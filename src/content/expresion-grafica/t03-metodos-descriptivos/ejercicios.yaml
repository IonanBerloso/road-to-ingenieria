ejercicios:
  # Decisión: «Plano en VM» va el primero. No es de la colección —no tiene
  # número que respetar (§04)— ni es nuestro: es la hoja de clase con que el
  # curso practica los tres métodos sobre el mismo triángulo, y por eso es la
  # entrada del tema. Los de la colección (7 a 10, 13, 14, 16 a 21, 48 y 49) van
  # detrás, en el orden de la colección, a medida que se escriben.
  - id: pvm-el-plano-abc-por-seis-caminos
    titulo: El plano ABC en verdadera magnitud, por seis caminos
    fuente: Ejercicio «Plano en VM» (hoja de clase Ejercicio_PlanoVM.pdf, 1 pág.) · Expresión Gráfica, Escuela de Ingeniería de Gipuzkoa · UPV/EHU. No es de la colección de ejercicios ni de examen; la figura se redibuja desde sus coordenadas.
    nivel: practica
    # Decisión: el texto impreso tal cual, en el orden de la página: primero la
    # columna de la izquierda, con sus seis métodos, y después la frase de la
    # esquina derecha. Se conserva la errata «qe» del método 6 (§08). Cada
    # método va en su párrafo para que el Markdown no los junte en una línea.
    enunciado: |
      Encontrar la VM del plano ABC mediante:

      1.- Cambio de plano empezando por un cambio de plano vertical

      2.- Cambio de plano empezando por un cambio de plano horizontal

      3.- Giros empezando por un giro de eje vertical

      4.- Giros empezando por un giro de eje horizontal

      5.- Abatimiento poniendo como charnela una recta horizontal que pase por C

      6.- Abatimiento poniendo como charnela una recta frontal qe pase por C

      Escribir esquemáticamente los pasos a seguir:

      **Notas nuestras.** La figura es la de la hoja, a escala 1:1: el triángulo ABC con el
      alzado arriba y la planta abajo, y nada más; la hoja deja en blanco el sitio de los
      pasos. Aquí los métodos 5 y 6, cuyas charnelas fija el enunciado, se construyen sobre la
      lámina y se corrigen punto a punto; los pasos de los seis se escriben en papel y se
      comparan con su rúbrica. «VM» es verdadera magnitud.
    pide: Los abatidos de A y de B con las dos charnelas por C que da el enunciado, la longitud real de los tres lados y los pasos de los seis métodos.
    receta:
      lamina: pvm
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        abc: plano(A, B, C)
      solucion:
        # Las dos charnelas que da el enunciado: la horizontal y la frontal del
        # plano que pasan por C. No son una elección.
        hC: horizontal_por(C, abc)
        fC: frontal_por(C, abc)
        # Método 5. A abatido a cualquiera de los dos lados de la charnela (una
        # elección: la primera marca fija el lado) y B con el mismo giro, para
        # que el triángulo caiga entero del mismo lado. C está en la charnela.
        A_h: abatido_a_elegir(A, hC, abc)
        B_h: 'abatido_junto(B, hC, abc, con: A_h, de: A)'
        MA: pie_perpendicular(A, hC)
        MB: pie_perpendicular(B, hC)
        perpA: 'perpendicular(por: figura.punto("A1"), a: proy_planta(hC))'
        perpB: 'perpendicular(por: figura.punto("B1"), a: proy_planta(hC))'
        # Método 6, lo mismo con la frontal por C: lo abatido se ve en el alzado.
        A_f: abatido_a_elegir(A, fC, abc)
        B_f: 'abatido_junto(B, fC, abc, con: A_f, de: A)'
        NA: pie_perpendicular(A, fC)
        NB: pie_perpendicular(B, fC)
        perpA2: 'perpendicular(por: figura.punto("A2"), a: proy_alzado(fC))'
        perpB2: 'perpendicular(por: figura.punto("B2"), a: proy_alzado(fC))'
        # La diferencia de alejamientos de A (y de B) con la charnela frontal: el
        # cateto que se mide en la planta. Las recetas no exponen todavía la
        # diferencia de alejamientos (`deltaAlejamiento` de lib/diedrico no está
        # en FUNCIONES), así que sale del radio y del cateto del alzado, por
        # Pitágoras. Cuando la expongan, estas dos líneas pasan a llamarla.
        dyA: 'raiz(vm(A, NA) * vm(A, NA) - vm_alzado(A, NA) * vm_alzado(A, NA))'
        dyB: 'raiz(vm(B, NB) * vm(B, NB) - vm_alzado(B, NB) * vm_alzado(B, NB))'
        vm_AB_mm: en_mm(vm(A, B))
        vm_BC_mm: en_mm(vm(B, C))
        vm_CA_mm: en_mm(vm(C, A))
        # Para la construcción paso a paso de los métodos 5 y 6. El punto 1,
        # donde la recta AB corta cada charnela: da la segunda proyección de la
        # charnela, y es el punto fijo de la afinidad que lleva de A₀ a B₀.
        X_h: pie_comun(recta3(A, B), hC)
        X_f: pie_comun(recta3(A, B), fC)
        # K, en la línea de referencia de C, a la altura de A₂ (método 5) o de
        # A₁ (método 6): de C₂ o de C₁ a K va la diferencia de cotas o de
        # alejamientos de A y C, que se toma con el compás.
        K_h: 'pie_perpendicular(figura.punto("A2"), segmento2(figura.punto("C1"), figura.punto("C2")))'
        K_f: 'pie_perpendicular(figura.punto("A1"), segmento2(figura.punto("C1"), figura.punto("C2")))'
        # T, el otro extremo del cateto del triángulo del radio de A: por A₁ (o
        # por A₂), paralelo a la charnela y a esa diferencia. MT (o NT) es el
        # radio del abatimiento.
        T_h: 'uno(medir_sobre(perpendicular(por: figura.punto("A1"), a: perpA), desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, C)), 1)'
        T_f: 'uno(medir_sobre(perpendicular(por: figura.punto("A2"), a: perpA2), desde: figura.punto("A2"), distancia: dyA), 1)'
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        L_hC: 'desplaza(K_h, dy: mm(-5))'
        L_hA: 'desplaza(K_h, dx: mm(5))'
        L_hAB2: 'uno(medir_sobre(figura.segmento("AB2"), desde: proy_alzado(X_h), distancia: mm(6)), 1)'
        L_h2: 'desplaza(proy_alzado(X_h), dx: mm(-6))'
        L_hAB1: 'uno(medir_sobre(figura.segmento("AB1"), desde: proy_planta(X_h), distancia: mm(6)), 1)'
        L_href: 'desplaza(proy_planta(X_h), dy: mm(6))'
        L_hpA: 'uno(medir_sobre(perpA, desde: proy_planta(rama(A_h, 1)), distancia: mm(6)), 1)'
        L_hT: 'uno(medir_sobre(perpendicular(por: figura.punto("A1"), a: perpA), desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, C) + mm(6)), 1)'
        L_hpB: 'uno(medir_sobre(perpB, desde: proy_planta(rama(B_h, 1)), distancia: mm(6)), 1)'
        L_fC: 'desplaza(K_f, dy: mm(5))'
        L_fA: 'desplaza(K_f, dx: mm(5))'
        L_fAB1: 'uno(medir_sobre(figura.segmento("AB1"), desde: proy_planta(X_f), distancia: mm(6)), 1)'
        L_f1: 'desplaza(proy_planta(X_f), dx: mm(-6))'
        L_fAB2: 'uno(medir_sobre(figura.segmento("AB2"), desde: proy_alzado(X_f), distancia: mm(6)), 1)'
        L_fref: 'desplaza(proy_alzado(X_f), dy: mm(-6))'
        L_fpN: 'uno(medir_sobre(perpA2, desde: proy_alzado(NA), distancia: mm(5)), 2)'
        L_fpA: 'uno(medir_sobre(perpA2, desde: proy_alzado(rama(A_f, 1)), distancia: mm(6)), 1)'
        L_fT: 'uno(medir_sobre(perpendicular(por: figura.punto("A2"), a: perpA2), desde: figura.punto("A2"), distancia: dyA + mm(6)), 1)'
        L_fpB: 'uno(medir_sobre(perpB2, desde: proy_alzado(rama(B_f, 1)), distancia: mm(6)), 1)'
      comprueba:
        # C es el vértice más bajo y el de menor alejamiento (el más próximo al
        # plano vertical): las dos charnelas por C dejan
        # el triángulo entero a un lado, y A y B se abaten hacia el mismo.
        - en_recta(C, hC)
        - en_recta(C, fC)
    pasos:
      - tipo: reconocer
        pregunta: Los seis métodos del enunciado acaban en lo mismo. ¿Qué tienen que conseguir para que el triángulo se vea en verdadera magnitud?
        opciones:
          - texto: Que el plano ABC quede paralelo a uno de los planos de proyección, o tumbado sobre uno
            correcta: true
            mensaje: |
              Eso es. Una vista solo enseña sin acortar lo que es paralelo a ella. El cambio de
              plano trae una vista nueva paralela al plano; el giro mueve el plano hasta ponerlo
              paralelo a una vista que ya existe; el abatimiento lo tumba sobre un plano
              horizontal o frontal alrededor de una recta suya.
          - texto: Que el plano quede de canto, visto como una recta con toda su inclinación
            mensaje: |
              Ese es el paso de en medio, no el final. De canto se ve lo inclinado que está el
              plano, pero el triángulo se reduce a un segmento: su forma no se ve. Hace falta
              un segundo paso que lo ponga paralelo a una vista.
          - texto: Que cada lado se mida en la vista donde se ve más largo, y con las tres medidas se construya el triángulo aparte
            mensaje: |
              Ningún lado de ABC es horizontal ni frontal, así que las dos vistas acortan los
              tres. La más larga de dos medidas cortas sigue siendo corta: la verdadera magnitud
              no está en ninguna de las dos vistas.

      - tipo: construir
        titulo: Método 5, con la horizontal por C de charnela
        intro: |
          La charnela es la horizontal del plano que pasa por C. Su alzado h₂ es la horizontal
          por C₂. Para su planta, prolonga A₂B₂ hasta que corte a h₂ y baja ese punto a la
          prolongación de A₁B₁: h₁ es la recta que lo une con C₁. Abate A y B sobre el plano
          horizontal de la charnela. Vale cualquiera de los dos lados de h₁, pero los dos al
          mismo; C está en la charnela y no se mueve.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A0
            pide: el vértice A, abatido sobre el plano horizontal de la charnela
            es: proy_planta(solucion.A_h)
            bien: |
              A₀ está en la perpendicular a h₁ que pasa por A₁, a la distancia real de A a la
              charnela. Esa distancia es la hipotenusa de un triángulo rectángulo: un cateto es
              lo que separa A₁ de h₁ en la planta y el otro, lo que A está más alto que C.
            diagnosticos:
              - si: cerca_de(figura.punto("A1"))
                mensaje: |
                  Ese es A₁, la planta de A sin abatir. Al abatir, A gira alrededor de la
                  charnela hasta quedar a la cota de C, y en la planta se aparta de h₁.
                ejemplo: figura.punto("A1")
              - si: 'en_recta(solucion.perpA) && a_distancia(de: proy_planta(solucion.MA), d: diferencia_de_cotas(A, C))'
                mensaje: |
                  Vas por la perpendicular a h₁, pero has llevado solo **lo que A está más alto
                  que C**. Eso es un cateto. El radio del abatimiento es la hipotenusa: ese cateto
                  y lo que separa A₁ de h₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpA, desde: proy_planta(solucion.MA), distancia: diferencia_de_cotas(A, C)), 1)'
              - si: 'en_recta(solucion.perpA) && a_distancia(de: proy_planta(solucion.MA), d: vm_planta(A, solucion.MA))'
                mensaje: |
                  Has llevado lo que separa A₁ de h₁ **en la planta**, y la planta acorta: A está
                  más alto que la charnela. Con ese cateto y la diferencia de cotas de A y C se
                  forma el triángulo cuya hipotenusa es el radio.
                ejemplo: 'uno(medir_sobre(solucion.perpA, desde: proy_planta(solucion.MA), distancia: vm_planta(A, solucion.MA)), 1)'
              - si: 'en_recta(solucion.perpA) && a_distancia(de: proy_planta(solucion.MA), d: raiz(vm_planta(A, solucion.MA) * vm_planta(A, solucion.MA) + solucion.dyA * solucion.dyA))'
                mensaje: |
                  El segundo cateto no es el bueno: has llevado la diferencia de **alejamientos**,
                  que es la del abatimiento sobre el plano frontal. Sobre el plano horizontal, A
                  baja hasta la cota de C, y lo que cuenta es la diferencia de **cotas**, que se
                  mide en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.perpA, desde: proy_planta(solucion.MA), distancia: raiz(vm_planta(A, solucion.MA) * vm_planta(A, solucion.MA) + solucion.dyA * solucion.dyA)), 1)'
              - si: '!en_recta(solucion.perpA)'
                mensaje: |
                  Al abatir, A gira alrededor de la charnela en un plano perpendicular a ella, y
                  ese plano es vertical: en la planta, A₀ se mueve por la **perpendicular a h₁
                  que pasa por A₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.A_h, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a h₁ por A₁, pero no en su sitio. O la distancia no
                  es la buena —el radio es la hipotenusa de lo que separa A₁ de h₁ en la planta y
                  de lo que A está más alto que C, que se mide en el alzado—, o has abatido A al
                  otro lado de h₁ del que ya fijaste con B₀.
          - nombre: B0
            pide: el vértice B, abatido sobre el plano horizontal de la charnela
            es: proy_planta(solucion.B_h)
            bien: |
              B₀ está en la perpendicular a h₁ por B₁, del mismo lado que A₀ y a la distancia
              real de B a la charnela. Comprobación por afinidad: las rectas A₁B₁ y A₀B₀ se
              cortan sobre h₁.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.B_h)))
                mensaje: |
                  Ese es B abatido **al otro lado** de la charnela. El plano gira entero, como
                  una tapa, y A y B están al mismo lado de h: si A₀ ha caído a un lado de h₁, B₀
                  cae al mismo. Con cada punto a un lado, el triángulo abatido sale deformado.
                ejemplo: proy_planta(rama(solucion.B_h, 2))
              - si: cerca_de(figura.punto("B1"))
                mensaje: |
                  Ese es B₁ sin abatir. B también gira alrededor de la charnela, y se aparta de
                  h₁ por la perpendicular que pasa por B₁.
                ejemplo: figura.punto("B1")
              - si: 'en_recta(solucion.perpB) && a_distancia(de: proy_planta(solucion.MB), d: diferencia_de_cotas(B, C))'
                mensaje: |
                  Has llevado solo **lo que B está más alto que C**: un cateto. El radio es la
                  hipotenusa de ese cateto y de lo que separa B₁ de h₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpB, desde: proy_planta(solucion.MB), distancia: diferencia_de_cotas(B, C)), 1)'
              - si: 'en_recta(solucion.perpB) && a_distancia(de: proy_planta(solucion.MB), d: vm_planta(B, solucion.MB))'
                mensaje: |
                  Has llevado lo que separa B₁ de h₁ **en la planta**, que acorta. Falta la
                  diferencia de cotas de B y C como segundo cateto.
                ejemplo: 'uno(medir_sobre(solucion.perpB, desde: proy_planta(solucion.MB), distancia: vm_planta(B, solucion.MB)), 1)'
              - si: 'en_recta(solucion.perpB) && a_distancia(de: proy_planta(solucion.MB), d: raiz(vm_planta(B, solucion.MB) * vm_planta(B, solucion.MB) + solucion.dyB * solucion.dyB))'
                mensaje: |
                  El segundo cateto es la diferencia de **cotas** de B y C, no la de
                  alejamientos: esa es la del abatimiento sobre el plano frontal.
                ejemplo: 'uno(medir_sobre(solucion.perpB, desde: proy_planta(solucion.MB), distancia: raiz(vm_planta(B, solucion.MB) * vm_planta(B, solucion.MB) + solucion.dyB * solucion.dyB)), 1)'
              - si: '!en_recta(solucion.perpB)'
                mensaje: |
                  B₀ va por la **perpendicular a h₁ que pasa por B₁**, como A₀ por la suya.
                ejemplo: 'desplaza(proy_planta(rama(solucion.B_h, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a h₁ por B₁, pero no a la distancia buena. Hazlo como
                  con A, o por afinidad: prolonga A₁B₁ hasta h₁; la recta que une ese punto con
                  A₀ corta la perpendicular por B₁ en B₀.
        trazado:
          - proy_alzado(segmento3(C, solucion.MB))
          - proy_planta(segmento3(C, solucion.MB))
          - proy_planta(segmento3(solucion.MA, solucion.A_h))
          - proy_planta(segmento3(solucion.MB, solucion.B_h))
          - segmento2(figura.punto("C1"), proy_planta(solucion.A_h))
          - segmento2(proy_planta(solucion.A_h), proy_planta(solucion.B_h))
          - segmento2(proy_planta(solucion.B_h), figura.punto("C1"))
        bloques:
          - nombre: Abatimiento con la horizontal por C
            explica: |
              El enunciado fija la charnela: h, la horizontal del plano por C. Al
              [abatir](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano),
              el plano gira alrededor de h hasta quedar horizontal, a la cota de C, y la planta lo
              da sin acortar. Cada punto gira en un plano vertical, perpendicular a h: en la planta
              va por la perpendicular a h₁. Su radio es su distancia real a la charnela, la
              hipotenusa de lo que su planta dista de h₁ y de lo que está más alto que C. C no se
              mueve, B sale por afinidad (AB y su abatida se cortan en h), y C₁A₀B₀ es ABC en
              verdadera magnitud.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("C1"), solucion.L_hC)
            bloque: Abatimiento con la horizontal por C
            porque: |
              La **línea de referencia** de C, de C₁ a C₂ y larga hacia arriba, hasta pasar la altura
              de A₂. En diédrico directo no hay línea de tierra: una horizontal se traza en el
              alzado perpendicular a las líneas de referencia, y esta hace de guía. Además, en ella
              se va a medir la cota de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_hA)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            bloque: Abatimiento con la horizontal por C
            porque: |
              Por A₂, la perpendicular a la línea de referencia de C, hacia la derecha y más allá de
              ella: la horizontal de la altura de A.
          - con: marca
            traza: solucion.K_h
            rotulo: K
            bloque: Abatimiento con la horizontal por C
            porque: |
              K, donde esa horizontal corta la línea de referencia de C. De C₂ a K va **lo que A
              está más alto que C**, la diferencia de cotas: 46,7 mm.
          - con: regla
            traza: segmento2(figura.punto("B2"), solucion.L_hAB2)
            bloque: Abatimiento con la horizontal por C
            porque: |
              **La charnela** es la horizontal del plano que pasa por C, y hacen falta sus dos
              proyecciones. Su segundo punto sale de la recta AB: primero se prolonga A₂B₂ con la
              regla, más allá de B₂, larga.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.L_h2)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            rotulo: h₂
            bloque: Abatimiento con la horizontal por C
            porque: |
              h₂, la horizontal por C₂: perpendicular a la línea de referencia de C, hacia la
              izquierda, hasta cortar A₂B₂ prolongada y pasarla.
          - con: marca
            traza: proy_alzado(solucion.X_h)
            rotulo: 1₂
            bloque: Abatimiento con la horizontal por C
            porque: |
              1₂, donde h₂ corta A₂B₂ prolongada. El punto 1 es de la recta AB y de la charnela a la
              vez: las dos son rectas del plano ABC.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_hAB1)
            bloque: Abatimiento con la horizontal por C
            porque: |
              En la planta, A₁B₁ prolongada con la regla más allá de B₁, larga: ahí va a caer 1₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X_h), solucion.L_href)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            bloque: Abatimiento con la horizontal por C
            porque: |
              Por 1₂, la línea de referencia hasta la planta, paralela a la de C: las dos
              proyecciones de un punto van en la misma vertical.
          - con: marca
            traza: proy_planta(solucion.X_h)
            rotulo: 1₁
            bloque: Abatimiento con la horizontal por C
            porque: |
              1₁, donde esa línea de referencia corta A₁B₁ prolongada: la planta del punto 1.
          - con: regla
            traza: segmento2(proy_planta(solucion.X_h), figura.punto("C1"))
            rotulo: h₁
            bloque: Abatimiento con la horizontal por C
            porque: |
              h₁, de 1₁ a C₁: la planta de la charnela. Sale casi horizontal en el papel, pero no del
              todo, se aparta 0,16°: se traza por sus dos puntos, no con la escuadra.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.L_hpA)
            guia: segmento2(proy_planta(solucion.X_h), figura.punto("C1"))
            bloque: Abatimiento con la horizontal por C
            porque: |
              Al abatir, A gira alrededor de la charnela en un plano perpendicular a ella, que es
              vertical: en la planta, A se mueve por la **perpendicular a h₁ por A₁**. Larga hacia
              arriba, cruzando h₁: A se va a abatir al otro lado de la charnela. Hacia abajo valdría
              igual; lo que no vale es mezclar los dos lados.
          - con: marca
            traza: proy_planta(solucion.MA)
            rotulo: M
            bloque: Abatimiento con la horizontal por C
            porque: |
              M, el pie de A en la charnela, donde la perpendicular corta h₁: es el centro del giro
              de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.L_hT)
            guia: segmento2(proy_planta(solucion.X_h), figura.punto("C1"))
            bloque: Abatimiento con la horizontal por C
            porque: |
              El radio es la hipotenusa de un triángulo rectángulo en A₁: un cateto es A₁M, lo que A₁
              se aparta de h₁ en la planta; el otro, la diferencia de cotas, se lleva por A₁
              perpendicular a A₁M, es decir, paralela a h₁. Hacia la derecha, larga.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.T_h, desde: desplaza(solucion.T_h, dx: -0.69, dy: -13.84), hasta: desplaza(solucion.T_h, dx: -0.76, dy: 13.83))'
            toma: segmento2(figura.punto("C2"), solucion.K_h)
            bloque: Abatimiento con la horizontal por C
            porque: |
              Con el compás, C₂K, la diferencia de cotas de A y C, llevada desde A₁ sobre esa
              paralela.
          - con: marca
            traza: solucion.T_h
            rotulo: T
            bloque: Abatimiento con la horizontal por C
            porque: |
              T, donde el arco corta la paralela a h₁ por A₁: A₁T es lo que A está más alto que C.
          - con: regla
            traza: segmento2(proy_planta(solucion.MA), solucion.T_h)
            bloque: Abatimiento con la horizontal por C
            porque: |
              La hipotenusa MT es la **distancia real de A a la charnela**, 59,7 mm: el radio con que
              gira A.
          - con: compas
            traza: 'arco(proy_planta(solucion.MA), por: proy_planta(solucion.A_h), desde: desplaza(proy_planta(solucion.A_h), dx: -14.76, dy: 0.60), hasta: desplaza(proy_planta(solucion.A_h), dx: 14.76, dy: 0.68))'
            toma: segmento2(proy_planta(solucion.MA), solucion.T_h)
            bloque: Abatimiento con la horizontal por C
            porque: |
              El compás, abierto de M a T, con la punta en M: el arco corta la perpendicular de A₁.
              La circunferencia la corta dos veces, una a cada lado de h₁, y las dos valen; aquí se
              toma la de arriba, la del lado trazado.
          - con: marca
            traza: proy_planta(solucion.A_h)
            rotulo: A₀
            bloque: Abatimiento con la horizontal por C
            porque: |
              A₀, donde el arco de centro M corta la perpendicular de A₁, al otro lado de h₁: A
              abatido sobre el plano horizontal de C, a 59,7 mm de M. Cae dentro del alzado del
              triángulo, pero es otro dibujo: la planta abatida, que no tiene nada que ver con
              A₂B₂C₂.
          - con: regla
            traza: segmento2(proy_planta(solucion.X_h), proy_planta(solucion.A_h))
            bloque: Abatimiento con la horizontal por C
            porque: |
              B₀ sale por **afinidad**. El punto 1 está en la charnela y no se mueve al abatir, así
              que la recta AB abatida pasa por 1₁ y por A₀: con la regla, de 1₁ a A₀.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.L_hpB)
            guia: segmento2(proy_planta(solucion.X_h), figura.punto("C1"))
            bloque: Abatimiento con la horizontal por C
            porque: |
              B gira como A: en la planta, por la perpendicular a h₁ por B₁, hacia arriba, del mismo
              lado que A₀.
          - con: marca
            traza: proy_planta(solucion.B_h)
            rotulo: B₀
            bloque: Abatimiento con la horizontal por C
            porque: |
              B₀, donde esa perpendicular corta la recta 1₁A₀. Con su propio triángulo, como A,
              saldría lo mismo: un radio de 22,8 mm.
          - con: regla
            traza: '[segmento2(figura.punto("C1"), proy_planta(rama(solucion.A_h, 1))), segmento2(proy_planta(rama(solucion.B_h, 1)), figura.punto("C1"))]'
            bloque: Abatimiento con la horizontal por C
            porque: |
              C está en la charnela y no se mueve: C₁A₀B₀ es el triángulo ABC en **verdadera
              magnitud**. Sus lados miden 44,4, 52,8 y 64,0 mm.
        pista: |
          (1) h₂: la horizontal por C₂; corta a la prolongación de A₂B₂ en un punto que bajas a
          A₁B₁ prolongada, y h₁ va de C₁ a él. (2) Por A₁, la perpendicular a h₁, que la corta en
          M. (3) Por A₁, perpendicular a A₁M, lleva lo que A está más alto que C (mídelo en el
          alzado): la distancia de M a ese punto es el radio. (4) Con centro en M y ese radio,
          corta la perpendicular: A₀. (5) B₀ igual, del mismo lado.
        desarrollo: |
          En verde claro, la charnela en las dos vistas, el camino de A y de B por sus
          perpendiculares y el triángulo C₁A₀B₀ abatido: es ABC en verdadera magnitud. En esta
          lámina h₁ sale casi horizontal (se aparta 0,16°), así que cada punto se abate casi por
          su propia línea de referencia.

      - tipo: construir
        titulo: Método 6, con la frontal por C de charnela
        intro: |
          Ahora la charnela es la frontal del plano que pasa por C. Su planta f₁ es la
          horizontal por C₁. Para su alzado, prolonga A₁B₁ hasta que corte a f₁ y sube ese punto
          a la prolongación de A₂B₂: f₂ es la recta que lo une con C₂. Abate A y B sobre el plano
          frontal de la charnela; lo abatido se ve en el alzado. Vale cualquiera de los dos
          lados de f₂, pero los dos al mismo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A0
            pide: el vértice A, abatido sobre el plano frontal de la charnela
            es: proy_alzado(solucion.A_f)
            bien: |
              A₀ está en la perpendicular a f₂ por A₂, a la distancia real de A a la charnela:
              la hipotenusa de lo que separa A₂ de f₂ en el alzado y de lo que el alejamiento de A
              supera al de C, que se mide en la planta.
            diagnosticos:
              - si: cerca_de(figura.punto("A2"))
                mensaje: |
                  Ese es A₂, el alzado de A sin abatir. Al abatir sobre el plano frontal, A gira
                  alrededor de f hasta quedar al alejamiento de C, y en el alzado se aparta de f₂.
                ejemplo: figura.punto("A2")
              - si: 'en_recta(solucion.perpA2) && a_distancia(de: proy_alzado(solucion.NA), d: solucion.dyA)'
                mensaje: |
                  Has llevado solo la **diferencia de alejamientos** de A y C, que es un cateto.
                  El radio es la hipotenusa de ese cateto y de lo que separa A₂ de f₂ en el
                  alzado.
                ejemplo: 'uno(medir_sobre(solucion.perpA2, desde: proy_alzado(solucion.NA), distancia: solucion.dyA), 1)'
              - si: 'en_recta(solucion.perpA2) && a_distancia(de: proy_alzado(solucion.NA), d: vm_alzado(A, solucion.NA))'
                mensaje: |
                  Has llevado lo que separa A₂ de f₂ **en el alzado**, y el alzado acorta: A está
                  más lejos del plano vertical que la charnela. Falta la diferencia de
                  alejamientos como segundo cateto.
                ejemplo: 'uno(medir_sobre(solucion.perpA2, desde: proy_alzado(solucion.NA), distancia: vm_alzado(A, solucion.NA)), 2)'
              - si: 'en_recta(solucion.perpA2) && a_distancia(de: proy_alzado(solucion.NA), d: raiz(vm_alzado(A, solucion.NA) * vm_alzado(A, solucion.NA) + diferencia_de_cotas(A, C) * diferencia_de_cotas(A, C)))'
                mensaje: |
                  Has llevado la diferencia de **cotas**, la del método 5. Sobre el plano frontal,
                  A se mueve hasta el alejamiento de C, y lo que cuenta es la diferencia de
                  **alejamientos**, que se mide en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpA2, desde: proy_alzado(solucion.NA), distancia: raiz(vm_alzado(A, solucion.NA) * vm_alzado(A, solucion.NA) + diferencia_de_cotas(A, C) * diferencia_de_cotas(A, C))), 1)'
              - si: '!en_recta(solucion.perpA2)'
                mensaje: |
                  A gira alrededor de la frontal en un plano perpendicular a ella, que es de canto
                  sobre el alzado: en el alzado, A₀ se mueve por la **perpendicular a f₂ que pasa
                  por A₂**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.A_f, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a f₂ por A₂, pero no en su sitio. O la distancia no es
                  la buena —el radio es la hipotenusa de lo que separa A₂ de f₂ en el alzado y de lo
                  que el alejamiento de A supera al de C, que se lee en la planta—, o has abatido A
                  al otro lado de f₂ del que ya fijaste con B₀.
          - nombre: B0
            pide: el vértice B, abatido sobre el plano frontal de la charnela
            es: proy_alzado(solucion.B_f)
            bien: |
              B₀ está en la perpendicular a f₂ por B₂, del mismo lado que A₀. Y C₂A₀B₀ es el mismo
              triángulo que salió con la horizontal: la verdadera magnitud no depende del método.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_alzado(solucion.B_f)))
                mensaje: |
                  Ese es B abatido **al otro lado** de f₂. El plano gira entero: B₀ va al mismo lado
                  que A₀.
                ejemplo: proy_alzado(rama(solucion.B_f, 2))
              - si: cerca_de(figura.punto("B2"))
                mensaje: |
                  Ese es B₂ sin abatir. B gira alrededor de f y se aparta de f₂ por la
                  perpendicular que pasa por B₂.
                ejemplo: figura.punto("B2")
              - si: 'en_recta(solucion.perpB2) && a_distancia(de: proy_alzado(solucion.NB), d: solucion.dyB)'
                mensaje: |
                  Has llevado solo la diferencia de alejamientos de B y C: un cateto. Falta el
                  otro, lo que separa B₂ de f₂ en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.perpB2, desde: proy_alzado(solucion.NB), distancia: solucion.dyB), 1)'
              - si: 'en_recta(solucion.perpB2) && a_distancia(de: proy_alzado(solucion.NB), d: vm_alzado(B, solucion.NB))'
                mensaje: |
                  Has llevado lo que separa B₂ de f₂ en el alzado, que acorta. Falta la diferencia
                  de alejamientos de B y C.
                ejemplo: 'uno(medir_sobre(solucion.perpB2, desde: proy_alzado(solucion.NB), distancia: vm_alzado(B, solucion.NB)), 2)'
              - si: 'en_recta(solucion.perpB2) && a_distancia(de: proy_alzado(solucion.NB), d: raiz(vm_alzado(B, solucion.NB) * vm_alzado(B, solucion.NB) + diferencia_de_cotas(B, C) * diferencia_de_cotas(B, C)))'
                mensaje: |
                  Ese segundo cateto es la diferencia de **cotas**, la del método 5. Aquí toca la
                  de **alejamientos**.
                ejemplo: 'uno(medir_sobre(solucion.perpB2, desde: proy_alzado(solucion.NB), distancia: raiz(vm_alzado(B, solucion.NB) * vm_alzado(B, solucion.NB) + diferencia_de_cotas(B, C) * diferencia_de_cotas(B, C))), 1)'
              - si: '!en_recta(solucion.perpB2)'
                mensaje: |
                  B₀ va por la **perpendicular a f₂ que pasa por B₂**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.B_f, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a f₂ por B₂, pero no a la distancia buena. Hazlo como
                  con A, o por afinidad: las rectas A₂B₂ y A₀B₀ se cortan sobre f₂.
        trazado:
          - proy_planta(segmento3(C, solucion.NB))
          - proy_alzado(segmento3(C, solucion.NB))
          - proy_alzado(segmento3(solucion.NA, solucion.A_f))
          - proy_alzado(segmento3(solucion.NB, solucion.B_f))
          - segmento2(figura.punto("C2"), proy_alzado(solucion.A_f))
          - segmento2(proy_alzado(solucion.A_f), proy_alzado(solucion.B_f))
          - segmento2(proy_alzado(solucion.B_f), figura.punto("C2"))
        bloques:
          - nombre: Abatimiento con la frontal por C
            explica: |
              Es el método 5 con las vistas cambiadas. La charnela que fija el enunciado es f, la
              frontal del plano por C, y el plano gira alrededor de ella hasta quedar frontal, al
              alejamiento de C: el alzado lo da sin acortar. Cada punto gira en un plano
              perpendicular a f, que se ve de canto en el alzado, y en el alzado va por la
              perpendicular a f₂. Su radio es la hipotenusa de lo que su alzado dista de f₂ y de lo
              que su alejamiento supera al de C, que se mide en la planta. C no se mueve, B sale por
              afinidad, y C₂A₀B₀ es otra vez ABC en verdadera magnitud.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("C2"), solucion.L_fC)
            bloque: Abatimiento con la frontal por C
            porque: |
              Es el método 5 con las vistas cambiadas. Primero, la **línea de referencia** de C, de
              C₂ a C₁ y larga hacia abajo, hasta pasar la altura de A₁: las frontales se trazan en
              la planta perpendiculares a ella, y en ella se mide el alejamiento de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.L_fA)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            bloque: Abatimiento con la frontal por C
            porque: |
              Por A₁, la perpendicular a la línea de referencia de C, hacia la derecha y más allá de
              ella.
          - con: marca
            traza: solucion.K_f
            rotulo: K
            bloque: Abatimiento con la frontal por C
            porque: |
              K, donde esa recta corta la línea de referencia de C. De C₁ a K va **lo que el
              alejamiento de A supera al de C**, la diferencia de alejamientos: 37,2 mm.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_fAB1)
            bloque: Abatimiento con la frontal por C
            porque: |
              **La charnela** es ahora la frontal del plano que pasa por C. Su segundo punto sale
              otra vez de la recta AB: A₁B₁ prolongada con la regla más allá de B₁, larga.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_f1)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            rotulo: f₁
            bloque: Abatimiento con la frontal por C
            porque: |
              f₁, la planta de la frontal por C: perpendicular a la línea de referencia de C, hacia
              la izquierda, hasta cortar A₁B₁ prolongada y pasarla.
          - con: marca
            traza: proy_planta(solucion.X_f)
            rotulo: 1₁
            bloque: Abatimiento con la frontal por C
            porque: |
              1₁, donde f₁ corta A₁B₁ prolongada: el punto 1 es de la recta AB y de la frontal a la
              vez.
          - con: regla
            traza: segmento2(figura.punto("B2"), solucion.L_fAB2)
            bloque: Abatimiento con la frontal por C
            porque: |
              En el alzado, A₂B₂ prolongada con la regla más allá de B₂, larga: ahí va a caer 1₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.X_f), solucion.L_fref)
            guia: segmento2(figura.punto("C1"), figura.punto("C2"))
            bloque: Abatimiento con la frontal por C
            porque: |
              Por 1₁, la línea de referencia hasta el alzado, paralela a la de C: las dos
              proyecciones de un punto van en la misma vertical.
          - con: marca
            traza: proy_alzado(solucion.X_f)
            rotulo: 1₂
            bloque: Abatimiento con la frontal por C
            porque: |
              1₂, donde esa línea de referencia corta A₂B₂ prolongada: el alzado del punto 1.
          - con: regla
            traza: segmento2(proy_alzado(solucion.X_f), figura.punto("C2"))
            rotulo: f₂
            bloque: Abatimiento con la frontal por C
            porque: |
              f₂, de 1₂ a C₂: el alzado de la charnela, en verdadera magnitud porque es frontal. Casi
              horizontal en el papel, se aparta 0,20°, pero se traza por sus dos puntos.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), solucion.L_fpN), segmento2(figura.punto("A2"), solucion.L_fpA)]'
            guia: segmento2(proy_alzado(solucion.X_f), figura.punto("C2"))
            bloque: Abatimiento con la frontal por C
            porque: |
              A gira alrededor de la frontal en un plano perpendicular a ella, que es de canto sobre
              el alzado: en el alzado, A se mueve por la **perpendicular a f₂ por A₂**. Larga hacia
              los dos lados: hacia abajo, hasta cortar f₂, y hacia arriba, más allá de A₂: A se va a
              abatir de este lado de la charnela, el de A₂, porque al otro caería encima de la
              planta.
          - con: marca
            traza: proy_alzado(solucion.NA)
            rotulo: N
            bloque: Abatimiento con la frontal por C
            porque: |
              N, el pie de A en la charnela, donde la perpendicular corta f₂: el centro del giro de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_fT)
            guia: segmento2(proy_alzado(solucion.X_f), figura.punto("C2"))
            bloque: Abatimiento con la frontal por C
            porque: |
              El triángulo del radio, rectángulo en A₂: un cateto es A₂N, en el alzado; el otro, la
              diferencia de alejamientos, se lleva por A₂ paralela a f₂. Hacia la derecha, larga.
          - con: compas
            traza: 'arco(figura.punto("A2"), por: solucion.T_f, desde: desplaza(solucion.T_f, dx: -0.74, dy: -12.86), hasta: desplaza(solucion.T_f, dx: -0.83, dy: 12.85))'
            toma: segmento2(figura.punto("C1"), solucion.K_f)
            bloque: Abatimiento con la frontal por C
            porque: |
              Con el compás, C₁K, la diferencia de alejamientos de A y C, que se mide en la planta,
              llevada desde A₂ sobre esa paralela.
          - con: marca
            traza: solucion.T_f
            rotulo: T
            bloque: Abatimiento con la frontal por C
            porque: |
              T, donde el arco corta la paralela a f₂ por A₂: A₂T es lo que el alejamiento de A
              supera al de C.
          - con: regla
            traza: segmento2(proy_alzado(solucion.NA), solucion.T_f)
            bloque: Abatimiento con la frontal por C
            porque: |
              NT es la **distancia real de A a la charnela**, 59,6 mm: el radio con que gira A.
          - con: compas
            traza: 'arco(proy_alzado(solucion.NA), por: proy_alzado(solucion.A_f), desde: desplaza(proy_alzado(solucion.A_f), dx: -14.74, dy: 0.59), hasta: desplaza(proy_alzado(solucion.A_f), dx: 14.73, dy: 0.69))'
            toma: segmento2(proy_alzado(solucion.NA), solucion.T_f)
            bloque: Abatimiento con la frontal por C
            porque: |
              El compás, abierto de N a T, con la punta en N: el arco corta la perpendicular de A₂
              por encima de A₂. La circunferencia la corta también por debajo de f₂, al otro lado:
              las dos valen, y aquí se toma la de arriba, la del lado trazado.
          - con: marca
            traza: proy_alzado(solucion.A_f)
            rotulo: A₀
            bloque: Abatimiento con la frontal por C
            porque: |
              A₀, donde el arco de centro N corta la perpendicular de A₂, por encima de A₂: A abatido
              sobre el plano frontal de C, a 59,6 mm de N.
          - con: regla
            traza: segmento2(proy_alzado(solucion.X_f), proy_alzado(solucion.A_f))
            bloque: Abatimiento con la frontal por C
            porque: |
              B₀ sale por **afinidad**: el punto 1 está en la charnela y no se mueve, así que AB
              abatida pasa por 1₂ y por A₀.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.L_fpB)
            guia: segmento2(proy_alzado(solucion.X_f), figura.punto("C2"))
            bloque: Abatimiento con la frontal por C
            porque: |
              Por B₂, la perpendicular a f₂, hacia arriba, del mismo lado que A₀.
          - con: marca
            traza: proy_alzado(solucion.B_f)
            rotulo: B₀
            bloque: Abatimiento con la frontal por C
            porque: |
              B₀, donde esa perpendicular corta la recta 1₂A₀. Con su propio triángulo, como A, el
              radio saldría de 22,6 mm.
          - con: regla
            traza: '[segmento2(figura.punto("C2"), proy_alzado(rama(solucion.A_f, 1))), segmento2(proy_alzado(rama(solucion.B_f, 1)), figura.punto("C2"))]'
            bloque: Abatimiento con la frontal por C
            porque: |
              C₂A₀B₀ es el triángulo en verdadera magnitud, abatido sobre el plano frontal de C.
              Mide lo mismo que C₁A₀B₀ en el método 5: es el mismo triángulo.
        pista: |
          Es el método 5 con las vistas cambiadas. (1) f₁: la horizontal por C₁; f₂, por el punto
          donde f₁ corta a A₁B₁ prolongada, subido a A₂B₂. (2) Por A₂, la perpendicular a f₂. (3)
          El radio, con los catetos «lo que separa A₂ de f₂», medido en el alzado, y «lo que el
          alejamiento de A supera al de C», medido en la planta. (4) B₀ igual, del mismo lado.
        desarrollo: |
          En verde claro, la frontal en las dos vistas, el camino de A y de B y el triángulo
          C₂A₀B₀ abatido sobre el plano frontal de C. Mide lo mismo que el del método 5: es el
          mismo triángulo, en verdadera magnitud.

      - tipo: calcular
        titulo: La longitud real de AB
        pregunta: ¿Cuánto mide de verdad el lado AB?
        respuesta:
          tipo: numero
          valor: '44.44'
          receta: vm_AB_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '33.78'
            receta: en_mm(vm_planta(A, B))
            mensaje: |
              Eso es lo que mide **A₁B₁ en la planta**. AB sube de B a A, y la planta lo acorta.
              Mídelo en el triángulo abatido, entre A₀ y B₀.
          - valor: '37.96'
            receta: en_mm(vm_alzado(A, B))
            mensaje: |
              Eso es **A₂B₂ en el alzado**, que también acorta: AB se aleja del plano vertical
              mientras sube, y no es frontal.
          - valor: '28.87'
            receta: en_mm(diferencia_de_cotas(A, B))
            mensaje: |
              Eso es lo que A está más alto que B, la **diferencia de cotas**: un cateto del
              triángulo de la verdadera magnitud, no el lado.
        pista: |
          Mide A₀B₀ con «medir» del Taller, en el paso anterior, o en tu lámina de papel, en
          cualquiera de los dos abatimientos: los dos dan lo mismo.
        desarrollo: |
          $$ \overline{AB} = \sqrt{\overline{A_1B_1}^{\,2} + \Delta z^{2}} = \sqrt{33{,}78^{2} + 28{,}87^{2}} \approx 44{,}44 \text{ mm} $$

          La planta del lado CA, C₁A₁, mide 43,74 mm, a 0,7 mm de la respuesta, por casualidad: no es AB, y
          la casilla da por buena esa cifra. AB se mide en el triángulo abatido, de A₀ a B₀.

      - tipo: calcular
        titulo: La longitud real de BC
        pregunta: ¿Cuánto mide de verdad el lado BC?
        respuesta:
          tipo: numero
          valor: '52.77'
          receta: vm_BC_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '49.67'
            receta: en_mm(vm_planta(B, C))
            mensaje: |
              Eso es **B₁C₁ en la planta**. BC sube poco, y por eso la planta lo acorta poco,
              pero lo acorta: unos 3 mm.
          - valor: '50.85'
            receta: en_mm(vm_alzado(B, C))
            mensaje: |
              Eso es **B₂C₂ en el alzado**. BC tampoco es frontal: la diferencia es pequeña, y
              por eso es la trampa del ejercicio. Ni la planta ni el alzado dan la verdadera
              magnitud de un lado oblicuo.
          - valor: '17.82'
            receta: en_mm(diferencia_de_cotas(B, C))
            mensaje: |
              Eso es lo que B está más alto que C: la diferencia de cotas, un cateto. El lado es
              la hipotenusa.
        pista: |
          Mide B₀C₁ en el abatimiento del método 5, o B₀C₂ en el del 6, con «medir» del Taller en
          el paso anterior o en tu lámina de papel.
        desarrollo: |
          $$ \overline{BC} = \sqrt{\overline{B_1C_1}^{\,2} + \Delta z^{2}} = \sqrt{49{,}67^{2} + 17{,}82^{2}} \approx 52{,}77 \text{ mm} $$

          El alzado del lado CA, C₂A₂, mide 52,05 mm, a 0,7 mm de la respuesta, por casualidad: no es BC, y
          la casilla da por buena esa cifra. BC se mide en el triángulo abatido, de C₁ a B₀ (en el método 6, de C₂ a B₀).

      - tipo: calcular
        titulo: La longitud real de CA
        pregunta: ¿Cuánto mide de verdad el lado CA?
        respuesta:
          tipo: numero
          valor: '63.98'
          receta: vm_CA_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '43.74'
            receta: en_mm(vm_planta(C, A))
            mensaje: |
              Eso es **C₁A₁ en la planta**. CA es el lado más inclinado del triángulo, y la
              planta lo acorta casi un tercio.
          - valor: '52.05'
            receta: en_mm(vm_alzado(C, A))
            mensaje: |
              Eso es **C₂A₂ en el alzado**, que acorta: CA se aleja del plano vertical mientras
              sube.
          - valor: '59.75'
            receta: en_mm(vm(A, solucion.MA))
            mensaje: |
              Eso es el **radio** con que se abate A en el método 5: la distancia de A a la
              charnela, medida desde su pie M. El lado CA va de C₁, que está en la charnela, a A₀.
        pista: |
          C está en las dos charnelas y no se mueve al abatir: CA en verdadera magnitud va de C₁
          a A₀ en el método 5, o de C₂ a A₀ en el 6. Mídelo con «medir» del Taller en el paso
          anterior o en tu lámina de papel.
        desarrollo: |
          $$ \overline{CA} = \sqrt{\overline{C_1A_1}^{\,2} + \Delta z^{2}} = \sqrt{43{,}74^{2} + 46{,}69^{2}} \approx 63{,}98 \text{ mm} $$

      # Decisión: los pasos de los seis métodos van en tres `redactar`, uno por
      # método, con sus dos variantes «empezando por…», porque es lo que pide la
      # hoja: «Escribir esquemáticamente los pasos a seguir». Son los pasos de un
      # método, ni una demostración ni una deducción: `que: procedimiento`.
      - tipo: redactar
        que: procedimiento
        consigna: |
          En papel, como en la hoja: **los pasos de los métodos 1 y 2**, el cambio de plano
          empezando por uno vertical y empezando por uno horizontal. Un renglón por paso, con la
          recta del plano que usas, dónde va cada línea nueva y qué distancia llevas.
        rubrica:
          - punto: |
              **Método 1, primer cambio, vertical.** Una horizontal del plano, por ejemplo la que
              pasa por C, y la línea nueva perpendicular a h₁, a la distancia que se quiera. Cada
              punto sale de su planta por la perpendicular a la línea nueva y se aparta de ella su
              cota contada desde la de C. A₄, B₄ y C₄ quedan alineados: el plano, de canto.
            porque: |
              La horizontal es la recta del plano que un cambio vertical puede ver de punta, porque
              su planta está en verdadera magnitud. Vista de punta la horizontal, todo el plano se
              ve de canto. Sin decir qué recta se usa, la línea nueva queda al azar.
            minimo: true
          - punto: |
              **Método 1, segundo cambio, horizontal.** La línea nueva, paralela al canto A₄B₄C₄.
              Cada punto sale de la vista 4 por la perpendicular y se aparta lo que separaba su
              planta de la primera línea nueva. A₅B₅C₅ es el triángulo en verdadera magnitud.
            porque: |
              Una vista paralela al plano lo enseña sin acortar. La distancia que se lleva es la
              del sistema que se deja atrás, la planta; llevar otra vez la cota es un error típico
              del segundo cambio.
            minimo: true
          - punto: |
              **Método 2, primer cambio, horizontal.** Una frontal del plano, por ejemplo la que
              pasa por C, la línea nueva perpendicular a f₂, y cada punto desde su alzado a su
              alejamiento contado desde el de C. El plano sale de canto en la vista 4.
            porque: |
              Es el método 1 con las vistas cambiadas: la frontal está en verdadera magnitud en el
              alzado, y un cambio horizontal la ve de punta.
            minimo: true
          - punto: |
              **Método 2, segundo cambio, vertical.** La línea nueva paralela al canto, y cada
              punto a lo que separaba su alzado de la primera línea nueva. Sale el triángulo en
              verdadera magnitud.
            porque: |
              Igual que en el método 1, la distancia es la de la vista que se deja: aquí, el
              alzado.
          - punto: |
              **Primero de canto, después paralelo**, en los dos métodos, y la referencia
              (C₄ ≡ h₄, C₄ ≡ f₄) dicha en cada cambio.
            porque: |
              Un solo cambio no da la forma de un plano oblicuo: lo pone de canto o lo deja
              oblicuo. En diédrico directo no hay línea de tierra, y lo que fija la vista nueva es
              el punto que se toma de referencia.

      - tipo: redactar
        que: procedimiento
        consigna: |
          En papel: **los pasos de los métodos 3 y 4**, los giros empezando por uno de eje
          vertical y empezando por uno de eje horizontal. Un renglón por paso, con el eje, hasta
          dónde se gira y qué se queda quieto en cada giro.
        rubrica:
          - punto: |
              **Método 3, giro de eje vertical.** Un eje vertical por un punto del plano, por
              ejemplo por C. Se gira la planta alrededor de C₁ hasta que la horizontal por C
              quede de punta, con la planta perpendicular a la horizontal del papel. Las cotas no
              cambian: cada alzado se mueve en horizontal. El plano queda de canto en el alzado.
            porque: |
              Un giro de eje vertical mueve cada punto en un plano horizontal: la planta gira sin
              deformarse y las cotas se quedan. Llevar la horizontal a de punta es lo que pone el
              plano de canto, igual que en el cambio de plano.
            minimo: true
          - punto: |
              **Método 3, giro de eje de punta.** Un eje de punta por un punto del canto. Se gira
              el alzado hasta que el canto quede horizontal. Los alejamientos no cambian: cada
              planta se mueve en horizontal. La planta nueva es el triángulo en verdadera
              magnitud.
            porque: |
              El plano de canto gira alrededor de una recta perpendicular al plano vertical hasta
              quedar horizontal, y una figura horizontal se ve en verdadera magnitud en la planta.
            minimo: true
          - punto: |
              **Método 4.** Primero un giro de eje de punta hasta que la frontal por C quede
              vertical, con el plano de canto en la planta. Después, uno de eje vertical hasta que
              el canto de la planta quede horizontal. El triángulo sale en verdadera magnitud en
              el alzado.
            porque: |
              Es el método 3 con cota y alejamiento cambiados de papel: la frontal hace de
              horizontal, y el plano acaba frontal en vez de horizontal.
            minimo: true
          - punto: |
              **El «eje horizontal» del enunciado es un eje de punta**: horizontal y además
              perpendicular al plano vertical.
            porque: |
              Con un eje horizontal cualquiera, cada punto giraría en un plano que no es paralelo a
              ninguno de los dos planos de proyección, y su trayectoria no se vería como una
              circunferencia en ninguna de las dos vistas. Las diapositivas de giros lo dicen así:
              «De punta (perpendicular) al plano de proyección vertical. [horizontal]» (págs. 10 y
              11).
          - punto: |
              **Todos los puntos giran alrededor del mismo eje, el mismo ángulo y en el mismo
              sentido.**
            porque: |
              Así el triángulo se mueve entero, como un sólido. Si un punto gira otro ángulo, la
              figura se deforma y lo que se mide al final no es su verdadera magnitud.

      - tipo: redactar
        que: procedimiento
        consigna: |
          En papel: **los pasos de los métodos 5 y 6**, los abatimientos con la horizontal y con la
          frontal por C de charnela. Son los que acabas de construir: escríbelos como los
          entregarías.
        rubrica:
          - punto: |
              **La charnela, en las dos vistas.** Método 5: h₂ horizontal por C₂, y h₁ por C₁ y por
              un segundo punto de h, que sale de cortar h₂ con la prolongación de A₂B₂ y bajarlo a
              la prolongación de A₁B₁. Método 6: f₁ horizontal por C₁, y f₂ por el punto que sale de
              cortar f₁ con la prolongación de A₁B₁ y subirlo a la de A₂B₂.
            porque: |
              La charnela tiene que ser una recta del plano, y sin su segunda proyección no hay
              perpendiculares que trazar. Una horizontal cualquiera del papel por C₁ no es la
              charnela del método 5, aunque en esta lámina casi coincida con ella.
            minimo: true
          - punto: |
              **Cada punto va por la perpendicular a la charnela que pasa por su proyección**, a un
              radio que es la hipotenusa de dos catetos: lo que separa esa proyección de la
              charnela y la diferencia de cotas con C (método 5) o de alejamientos (método 6).
            porque: |
              El punto gira alrededor de la charnela en un plano perpendicular a ella. Ese plano es
              vertical en el método 5 y de canto en el 6: por eso el camino es una perpendicular en
              la planta o en el alzado. El radio es la distancia real a la charnela, que ninguna
              vista da sin el triángulo.
            minimo: true
          - punto: |
              **A₀ y B₀, al mismo lado de la charnela**, y C, que está en ella, no se mueve. B₀ se
              comprueba por afinidad: A₁B₁ y A₀B₀ se cortan sobre h₁ (A₂B₂ y A₀B₀, sobre f₂).
            porque: |
              El plano gira entero, como una tapa sobre su bisagra: todos sus puntos giran en el
              mismo sentido. Aquí A y B están al mismo lado de las dos charnelas, y por eso caen
              juntos; si una charnela cortara el triángulo, cada parte caería a su lado. La
              afinidad da el segundo punto sin otro triángulo y comprueba el primero.
          - punto: |
              **El triángulo abatido es la verdadera magnitud**: en la planta en el método 5, en el
              alzado en el 6, y miden lo mismo.
            porque: |
              Abatir es tumbar el plano sobre un plano horizontal o frontal, y lo que está en uno
              de esos planos se ve sin acortar en su vista.

      - tipo: justificar
        pregunta: Ordena el razonamiento del método 5. Una pieza no debe entrar.
        piezas:
          - texto: La charnela es la horizontal del plano por C, y su planta se saca con un segundo punto de h, bajado desde el alzado.
          - texto: A gira alrededor de la charnela en un plano vertical, así que A₀ está en la perpendicular a h₁ que pasa por A₁.
          - texto: El radio de A es la hipotenusa de lo que separa A₁ de h₁ en la planta y de lo que A está más alto que C.
          - texto: B₀ sale igual, del mismo lado que A₀, y C no se mueve; C₁A₀B₀ es el triángulo en verdadera magnitud.
          - texto: El radio de A es lo que A está más alto que C, que se lee directamente en el alzado.
            trampa: true
            mensaje: |
              Eso es solo un cateto. A también está apartado de la charnela en horizontal, y eso se
              ve en la planta: la distancia real es la hipotenusa de los dos.

    resolucion: |
      **Qué se busca.** Ningún lado de ABC es horizontal ni frontal, y las dos vistas acortan los
      tres: la verdadera magnitud hay que construirla. C es el vértice más bajo y el de menor
      alejamiento, el más próximo al plano vertical: A está 46,69 mm más alto que C y B, 17,82 mm;
      A tiene 37,21 mm más de alejamiento que C, y B, 14,10 mm.

      **El plano de esta hoja.** Al trazar la horizontal por C sale una sorpresa: su planta h₁
      es casi horizontal en el papel, y la frontal por C, también en el alzado. El plano ABC es
      casi paralelo a la línea de tierra: forma 51,4° con el plano horizontal y 38,6° con el
      vertical, que suman 90°. Suman eso porque su normal es casi perpendicular a la línea de
      tierra, se aparta 0,12°, y cuando lo es del todo los dos ángulos son complementarios. Por
      eso, en los abatimientos, cada punto se abate casi por su propia línea de referencia. Y por
      eso aquí la horizontal del papel por C₁ casi coincide con h₁, a 0,06 mm al pie de A y a
      0,13 mm al de B, y el Taller da por buenos los abatidos construidos con ese atajo. En otra
      lámina no vale: h₁ sale siempre de un segundo punto de h.

      **Método 5, horizontal por C.** h₂ es la horizontal por C₂; corta a la prolongación de
      A₂B₂ en un punto que, bajado a A₁B₁, da la planta h₁. A₁ está a 37,27 mm de h₁ y A, 46,69 mm
      más alto que C: el radio es la hipotenusa, 59,75 mm, llevado desde el pie M por la
      perpendicular a h₁. Para B, 14,23 mm y 17,82 mm dan 22,80 mm. Los dos al mismo lado, y C
      no se mueve.

      **Método 6, frontal por C.** Lo mismo en el alzado: A₂ está a 46,61 mm de f₂, y el
      alejamiento de A supera al de C en 37,21 mm, así que el radio es de 59,65 mm; el de B, de
      22,60 mm. El triángulo C₂A₀B₀ mide lo mismo que C₁A₀B₀.

      **Los lados en verdadera magnitud.** AB = 44,44 mm, BC = 52,77 mm y CA = 63,98 mm. BC es la
      trampa: mide 49,67 mm en la planta y 50,85 mm en el alzado, y los dos se quedan cortos.

      **Métodos 1 y 2, cambios de plano.** En el 1, la línea nueva va perpendicular a h₁ y lleva
      las cotas desde la de C: el plano sale de canto, con su ángulo de 51,4° con el plano
      horizontal a la vista. La segunda línea nueva, paralela a ese canto, lleva lo que cada
      planta distaba de la primera línea nueva (los «alejamientos» de las diapositivas, contados
      desde esa línea), y da el triángulo en verdadera magnitud. El 2 es lo mismo con la frontal y
      las vistas cambiadas: el canto enseña los 38,6° con el plano vertical. Como h₁ es casi
      horizontal en el papel, la primera vista auxiliar del método 1 es casi una vista de perfil.

      **Métodos 3 y 4, giros.** En el 3, un giro de eje vertical por C de unos 90° deja la
      horizontal por C de punta, y el plano, de canto en el alzado. Uno de eje de punta de 51,4°
      lo deja horizontal, y la planta es la verdadera magnitud. En el 4, un giro de eje de punta
      de unos 90° deja la frontal vertical, y uno de eje vertical de 38,6° deja el plano frontal.

      **La comprobación.** Los seis caminos dan los mismos tres lados. Si dos métodos tuyos no
      coinciden en un lado, uno de los dos está mal construido.

  - id: sd9-el-rombo-de-lado-horizontal-y-lado-frontal
    titulo: El rombo con un lado horizontal y otro frontal, y su ángulo con el plano horizontal
    fuente: Ejercicio 7 (SD9) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU. La página no trae figura; la lámina es nuestra, sacada de las coordenadas del enunciado.
    nivel: practica
    # Decisión: el texto impreso tal cual (§08). La página no trae figura, solo
    # las coordenadas: la lámina sd9 es nuestra (la línea de tierra, el origen
    # y A y C situados a escala 1:1, lo primero que haría el alumno en el
    # papel), y lo dicen las Notas nuestras, el intro del primer paso y
    # revision.notas. Las coordenadas van con el convenio de la diapositiva 8
    # del tema de punto, recta y plano: (desplazamiento, alejamiento, cota), con
    # el desplazamiento positivo hacia la izquierda del origen. El enunciado no
    # impone método: B sale de abatir el plano frontal de BC sobre el
    # horizontal de AB, y el ángulo, de un cambio de plano vertical con la
    # línea nueva perpendicular a A₁B₁; la línea nueva y la referencia se fijan
    # en el intro del paso.
    enunciado: |
      Dibujar las proyecciones diédricas de un rombo y calcular el ángulo que forma con el plano
      horizontal. Datos: la diagonal AC, un lado es el segmento de recta horizontal AB y el otro el
      segmento de recta frontal BC, A(-20,40,70) y C(40,10,30).

      **Notas nuestras.** La colección no trae figura: solo las coordenadas. La lámina es nuestra,
      sacada de ellas: la línea de tierra, el origen O y A y C en sus dos proyecciones, a escala 1:1.
      Las coordenadas van en el orden del curso, (x, y, z): x, el desplazamiento sobre la línea de
      tierra, positivo hacia la izquierda de O; y, el alejamiento, hacia abajo en la planta; z, la
      cota, hacia arriba en el alzado. Así, A está 20 mm a la derecha de O, y C, 40 mm a la izquierda.
      Llamamos D al cuarto vértice del rombo.
    pide: Las proyecciones de B y de D, el cuarto vértice, y el ángulo que forma el rombo con el plano horizontal.
    receta:
      lamina: sd9
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        # l: la recta de los puntos que tienen la cota de A y el alejamiento de
        # C, paralela a la línea de tierra. En el alzado, la horizontal de A₂;
        # en la planta, la de C₁.
        hA2: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dx: -50))'
        hC1: 'segmento2(figura.punto("C1"), desplaza(figura.punto("C1"), dx: 50))'
        LA: 'punto3(alzado: figura.punto("A2"), planta: pie_perpendicular(figura.punto("A1"), hC1))'
        LC: 'punto3(alzado: pie_perpendicular(figura.punto("C2"), hA2), planta: figura.punto("C1"))'
        l: recta3(LA, LC)
      solucion:
        # B: en l (AB horizontal, BC frontal) y a la misma distancia de A que de
        # C (rombo): en el plano mediador de AC. D cierra el paralelogramo.
        B: corte_recta_plano(l, plano_mediador(A, C))
        D: 'simetrico(B, respecto: punto_medio(segmento3(A, C)))'
        rombo: plano(A, B, C)
        angulo: angulo_con_ph(rombo)
        lado_mm: en_mm(vm(A, B))
        # ── Decisión: B por abatimiento. El plano frontal de BC (contiene l y C)
        # se abate sobre el plano horizontal de AB con l de charnela: C₀ cae en
        # la vertical de C₁, a lo que C está más bajo que A (40 mm). Hacia
        # arriba caería justo en C₂ (por los datos: 10 + 2·30 = 70), y el
        # Taller no deja marcar encima de un punto dado; se fija hacia abajo,
        # el segundo de la lista. B₁ equidista de A₁ y de C₀: la mediatriz.
        frontalBC: plano(LA, LC, C)
        C_abs: abatido(C, l, frontalBC)
        C_ab: uno(C_abs, 2)
        K2: pie_perpendicular(figura.punto("C2"), hA2)
        K2mas: 'uno(medir_sobre(hA2, desde: K2, distancia: mm(6)), 1)'
        C0mas: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(C_ab)), desde: proy_planta(C_ab), distancia: mm(6)), 1)'
        # La mediatriz de A₁C₀, con el compás abierto A₁C₀: los dos cortes, P
        # arriba y Q abajo, a √3/2 de A₁C₀ de su punto medio.
        mAC0: punto_medio(segmento2(figura.punto("A1"), proy_planta(C_ab)))
        medAC0: 'perpendicular(por: mAC0, a: segmento2(figura.punto("A1"), proy_planta(C_ab)))'
        PQ: 'medir_sobre(medAC0, desde: mAC0, distancia: vm_planta(A, C_ab) * raiz(3) / 2)'
        Pm: uno(PQ, 1)
        Qm: uno(PQ, 2)
        B1mas: 'uno(medir_sobre(hC1, desde: proy_planta(B), distancia: mm(10)), 1)'
        # D: AD frontal (D₁ en la horizontal de A₁) y CD horizontal (D₁ en la
        # paralela a A₁B₁ por C₁, y D₂ en la horizontal de C₂).
        AB1: segmento2(figura.punto("A1"), proy_planta(B))
        hA1: 'segmento2(figura.punto("A1"), desplaza(figura.punto("A1"), dx: -50))'
        hC2: 'segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dx: 50))'
        parC1: 'perpendicular(por: figura.punto("C1"), a: perpendicular(por: figura.punto("C1"), a: AB1))'
        D1masC: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(D)), desde: proy_planta(D), distancia: mm(6)), 1)'
        D1masA: 'uno(medir_sobre(hA1, desde: proy_planta(D), distancia: mm(6)), 1)'
        D2mas: 'uno(medir_sobre(hC2, desde: proy_alzado(D), distancia: mm(6)), 1)'
        # Los errores de B₁, todos sobre l: igualar las distancias de la planta
        # (A₁B₁ = B₁C₁), las del alzado (A₂B₂ = B₂C₂), o abatir C con 30 mm.
        Cmisma: 'punto3(alzado: K2, planta: figura.punto("C1"))'
        Calej: 'punto3(alzado: figura.punto("C2"), planta: pie_perpendicular(figura.punto("C1"), hA1))'
        C30: 'punto3(alzado: K2, planta: desplaza(figura.punto("C1"), dy: mm(30)))'
        Bplanta: corte_recta_plano(l, plano_mediador(A, Cmisma))
        Balzado: corte_recta_plano(l, plano_mediador(A, Calej))
        B30: corte_recta_plano(l, plano_mediador(A, C30))
        # ── Decisión: el ángulo con un cambio de plano vertical. Línea nueva,
        # perpendicular a A₁B₁ por A₁, el vértice de abajo a la derecha de la
        # planta; la vista 4 cae abajo a la derecha, donde hay sitio.
        # Referencia, C (la más baja, con D): todo cae hacia fuera.
        # AB y CD, horizontales, se ven de punta: A₄ ≡ B₄ y C₄ ≡ D₄.
        nueva: 'perpendicular(por: figura.punto("A1"), a: AB1)'
        A_4: 'cambio_plano_vertical(A, nueva, ref: C)'
        B_4: 'cambio_plano_vertical(B, nueva, ref: C)'
        C_4: 'cambio_plano_vertical(C, nueva, ref: C)'
        D_4: 'cambio_plano_vertical(D, nueva, ref: C)'
        A4mas: 'uno(medir_sobre(segmento2(proy_planta(B), figura.punto("A1")), desde: A_4, distancia: mm(6)), 1)'
        nuevaFin: 'uno(medir_sobre(segmento2(figura.punto("A1"), C_4), desde: C_4, distancia: mm(10)), 1)'
        nuevaIni: 'uno(medir_sobre(segmento2(figura.punto("A1"), C_4), desde: figura.punto("A1"), distancia: mm(8)), 2)'
        lineaB1A1: segmento2(proy_planta(B), figura.punto("A1"))
        C4fuera30: 'uno(medir_sobre(segmento2(figura.punto("C1"), C_4), desde: C_4, distancia: mm(30)), 1)'
        C4dentro40: 'uno(medir_sobre(segmento2(figura.punto("C1"), C_4), desde: C_4, distancia: diferencia_de_cotas(A, C)), 2)'
        A4con70: 'uno(medir_sobre(lineaB1A1, desde: figura.punto("A1"), distancia: mm(70)), 1)'
        A4con30: 'uno(medir_sobre(lineaB1A1, desde: figura.punto("A1"), distancia: mm(30)), 1)'
        A4dentro: 'uno(medir_sobre(lineaB1A1, desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, C)), 2)'
      comprueba:
        # B con la cota de A y el alejamiento de C, y AB = BC.
        - en_recta(B, l)
        - en_plano(B, plano_mediador(A, C))
        - en_plano(D, rombo)
    pasos:
      - tipo: reconocer
        pregunta: AB es horizontal y BC es frontal. ¿Qué dice eso de B antes de dibujar nada?
        opciones:
          - texto: Que B tiene la cota de A y el alejamiento de C
            correcta: true
            mensaje: |
              Eso es. Una horizontal tiene todos sus puntos a la misma cota, así que B₂ está en la
              horizontal de A₂; una frontal, al mismo alejamiento, así que B₁ está en la paralela a la
              línea de tierra por C₁. B está en la recta que cumple las dos cosas, paralela a la línea de
              tierra; solo falta saber dónde.
          - texto: Que B tiene la cota de C y el alejamiento de A
            mensaje: |
              Ese es D, el cuarto vértice: AD es paralelo a BC, y por eso frontal, con el alejamiento de A;
              CD es paralelo a AB, horizontal, con la cota de C. B está en la horizontal que sale de A,
              así que tiene la cota de A.
          - texto: Nada; para dibujar el rombo hace falta además la medida de su lado o de su ángulo
            mensaje: |
              No hace falta. B tiene la cota de A y el alejamiento de C, y en un rombo los lados AB y BC
              miden lo mismo: eso fija el único punto de esa recta que vale. La medida del lado sale, no
              se da.

      - tipo: construir
        titulo: B y D, abatiendo el plano frontal de BC
        intro: |
          La lámina es nuestra: la colección no trae figura, y la hemos sacado de las coordenadas del
          enunciado, como lo haría el alumno en el papel. B tiene la cota de A y el alejamiento de C: está
          en la recta l, paralela a la línea de tierra, cuyo alzado es la horizontal de A₂ y cuya planta,
          la de C₁. Falta dónde: AB tiene que medir lo que BC. El enunciado no impone método, y el que
          proponemos compara las dos en la misma vista. AB es horizontal y se ve en verdadera magnitud en
          la planta; BC no. Abate el plano frontal de BC, que contiene l y C, sobre el plano horizontal de
          A, con l de charnela: C₀ cae en la vertical de C₁, a lo que C está más bajo que A, y B₁, que no
          se mueve porque está en la charnela, equidista de A₁ y de C₀. Lleva C₀ hacia abajo: hacia arriba
          caería justo encima de C₂, y ese punto no se deja marcar. D cierra el paralelogramo. Marca C₀,
          B₁, B₂, D₁ y D₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: C0
            pide: C abatido sobre el plano horizontal de A, con l de charnela
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está en la vertical de C₁, 40 mm por debajo: lo que C está más bajo que l, que es la
              distancia de C₂ a la horizontal de A₂. C₁ está en l₁, así que el radio es solo esa diferencia
              de cotas.
            diagnosticos:
              - si: 'cerca_de(desplaza(figura.punto("C1"), dy: mm(30)))'
                mensaje: |
                  Has llevado 30 mm, que es la cota de C contada desde la línea de tierra (y también lo que C
                  está más cerca que A del plano vertical). La charnela es l, a la cota de A: el radio es lo que C está más bajo
                  que l, 70 − 30 = 40 mm, de C₂ a la horizontal de A₂.
                ejemplo: 'desplaza(figura.punto("C1"), dy: mm(30))'
              - si: '!en_vertical_de(figura.punto("C1"))'
                mensaje: |
                  Al abatir, C gira alrededor de l en un plano perpendicular a ella. l es paralela a la línea
                  de tierra, así que ese plano es de perfil, y en la planta C₀ se mueve por la **vertical de
                  C₁**.
                ejemplo: 'desplaza(proy_planta(solucion.C_ab), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₁, pero no a la distancia buena: lo que C está más bajo que A, que
                  se mide en el alzado, de C₂ a la horizontal de A₂.
          - nombre: B1
            pide: la planta de B
            es: proy_planta(B)
            bien: |
              B₁ está en l₁, la paralela a la línea de tierra por C₁, donde la corta la mediatriz de A₁C₀:
              A₁B₁ es la verdadera magnitud de AB, y B₁C₀, la de BC abatido. Las dos miden 46,7 mm.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Bplanta))
                mensaje: |
                  Has igualado A₁B₁ con B₁C₁, lo que miden **en la planta**. A₁B₁ sí es la verdadera magnitud
                  de AB, que es horizontal; B₁C₁ no lo es de BC, que baja 40 mm de B a C. Por eso se abate C:
                  B₁C₀ sí mide lo que BC.
                ejemplo: proy_planta(solucion.Bplanta)
              - si: cerca_de(proy_planta(solucion.Balzado))
                mensaje: |
                  Has igualado A₂B₂ con B₂C₂, lo que miden **en el alzado**, y has bajado ese punto a l₁.
                  B₂C₂ sí es la verdadera magnitud de BC, que es frontal, pero A₂B₂ no lo es de AB: AB se
                  acerca 30 mm de A a B, y el alzado lo acorta.
                ejemplo: proy_planta(solucion.Balzado)
              - si: cerca_de(proy_planta(solucion.B30))
                mensaje: |
                  La mediatriz está bien trazada, pero C₀ no: está a 30 mm de C₁. El radio con que C se abate
                  es lo que C está más bajo que l, 40 mm.
                ejemplo: proy_planta(solucion.B30)
              - si: '!en_recta(hC1)'
                mensaje: |
                  BC es frontal, así que B tiene el alejamiento de C: B₁ va en la **paralela a la línea de
                  tierra por C₁**.
                ejemplo: 'desplaza(proy_planta(B), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en l₁, pero no en la mediatriz de A₁C₀. B₁ tiene que estar a la misma distancia de A₁
                  que de C₀: con el compás abierto A₁C₀, dos arcos desde A₁ y dos desde C₀; la recta que une
                  sus cortes corta l₁ en B₁.
          - nombre: B2
            pide: el alzado de B
            es: proy_alzado(B)
            bien: |
              B₂ está en la vertical de B₁, en la horizontal de A₂: AB es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(B1)'
                mensaje: |
                  B₂ va en la **vertical de B₁**.
                ejemplo: 'desplaza(proy_alzado(B), dx: mm(6))'
              - si: cerca_de(pie_perpendicular(proy_alzado(B), solucion.hC2))
                mensaje: |
                  Ese punto tiene la cota de C. AB es horizontal: B tiene la cota de A, y B₂ va en la
                  horizontal de A₂.
                ejemplo: pie_perpendicular(proy_alzado(B), solucion.hC2)
              - si: siempre
                mensaje: |
                  Estás en la vertical de B₁, pero no a la altura buena: B₂ está en la horizontal de A₂.
          - nombre: D1
            pide: la planta de D, el cuarto vértice
            es: proy_planta(D)
            bien: |
              D₁ está donde la paralela a la línea de tierra por A₁ corta la paralela a A₁B₁ por C₁: AD es
              paralelo a BC, frontal, y CD paralelo a AB, horizontal.
            diagnosticos:
              - si: '!en_recta(solucion.hA1)'
                mensaje: |
                  AD es paralelo a BC, que es frontal: D tiene el alejamiento de A, y D₁ va en la **paralela a
                  la línea de tierra por A₁**.
                ejemplo: 'desplaza(proy_planta(D), dy: mm(6))'
              - si: '!en_recta(solucion.parC1)'
                mensaje: |
                  Estás en la paralela a la línea de tierra por A₁, pero CD es paralelo a AB: D₁ va también en
                  la **paralela a A₁B₁ por C₁**.
                ejemplo: 'desplaza(proy_planta(D), dx: mm(6))'
              - si: siempre
                mensaje: |
                  D₁ está donde la paralela a la línea de tierra por A₁ corta la paralela a A₁B₁ por C₁.
          - nombre: D2
            pide: el alzado de D
            es: proy_alzado(D)
            bien: |
              D₂ está en la vertical de D₁, en la horizontal de C₂: CD es horizontal. A₂D₂ sale paralela a
              B₂C₂, y eso lo comprueba.
            diagnosticos:
              - si: '!en_vertical_de(D1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**.
                ejemplo: 'desplaza(proy_alzado(D), dx: mm(6))'
              - si: cerca_de(pie_perpendicular(proy_alzado(D), hA2))
                mensaje: |
                  Ese punto tiene la cota de A. CD es paralelo a AB, horizontal: D tiene la cota de C, y D₂ va
                  en la horizontal de C₂.
                ejemplo: pie_perpendicular(proy_alzado(D), hA2)
              - si: siempre
                mensaje: |
                  Estás en la vertical de D₁, pero no a la altura buena: D₂ está en la horizontal de C₂.
        trazado:
          - segmento2(figura.punto("A1"), proy_planta(B))
          - segmento2(proy_planta(B), figura.punto("C1"))
          - segmento2(figura.punto("C1"), proy_planta(D))
          - segmento2(proy_planta(D), figura.punto("A1"))
          - segmento2(figura.punto("A2"), proy_alzado(B))
          - segmento2(proy_alzado(B), figura.punto("C2"))
          - segmento2(figura.punto("C2"), proy_alzado(D))
          - segmento2(proy_alzado(D), figura.punto("A2"))
        bloques:
          - nombre: Abatimiento del plano frontal de BC
            explica: |
              El método es nuestro: el enunciado no lo impone. AB es horizontal y la planta lo da
              sin acortar; BC es frontal, y la planta lo acorta. Para medir los dos en la misma
              vista, se
              [abate](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)
              el plano frontal de BC sobre el horizontal de A, alrededor de l, la recta en que se
              cortan: tiene la cota de A y el alejamiento de C. C gira en un plano de perfil y en la
              planta va por la vertical de C₁, con un radio que es solo lo que C está más bajo que
              l, porque C₁ ya está en l₁. B, en la charnela, no se mueve, y como AB = BC, B₁ es el
              punto de l₁ a la misma distancia de A₁ que de C₀.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.K2mas)
            guia: figura.segmento("LT")
            rotulo: l₂
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por A₂, la paralela a la línea de tierra, hacia la izquierda y larga, hasta pasar la vertical
              de C₂: es l₂, el alzado de l (nombre nuestro: la recta de los puntos con la cota de A y el
              alejamiento de C). AB es horizontal, así que B tiene la cota de A, y B₂ está en ella.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.K2)
            guia: figura.segmento("LT")
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₂, la vertical hacia arriba, hasta l₂: ese trozo es lo que C está más bajo que A, 40 mm,
              y será el radio con que C se abate.
          - con: marca
            traza: solucion.K2
            rotulo: K₂
            bloque: Abatimiento del plano frontal de BC
            porque: |
              K₂ (nombre nuestro), donde la vertical de C₂ corta l₂: el punto de l que está en la vertical de
              C. C₂K₂ mide 40 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.B1mas)
            guia: figura.segmento("LT")
            rotulo: l₁
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₁, la paralela a la línea de tierra, hacia la derecha y larga: es l₁. BC es frontal, así
              que B tiene el alejamiento de C, y B₁ está en ella. C₁ también: C está en el plano frontal de
              l.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.C0mas)
            guia: figura.segmento("LT")
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₁, la perpendicular a l₁, hacia abajo y larga, que es la vertical de C₁. Se abate el plano
              frontal de BC sobre el horizontal de A, con l de charnela: C gira en un plano perpendicular a
              l, y en la planta se mueve por esta recta.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: proy_planta(solucion.C_ab), desde: desplaza(proy_planta(solucion.C_ab), dx: -6), hasta: desplaza(proy_planta(solucion.C_ab), dx: 6))'
            toma: segmento2(figura.punto("C2"), solucion.K2)
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Con el compás, C₂K₂, lo que C está más bajo que l, y con centro en C₁. C₁ está en la charnela en
              la planta, así que el radio no necesita triángulo: es esa diferencia de cotas. El arco corta la
              vertical de C₁ arriba y abajo; arriba cae justo en C₂, y se toma el corte de abajo.
          - con: marca
            traza: proy_planta(solucion.C_ab)
            rotulo: C₀
            bloque: Abatimiento del plano frontal de BC
            porque: |
              C₀, donde el arco corta la vertical de C₁, 40 mm por debajo: C abatido. B₁C₀ medirá lo que BC
              de verdad. Hacia arriba caería justo encima de C₂.
          - con: compas
            traza: '[arco(figura.punto("A1"), por: solucion.Pm, desde: desplaza(solucion.Pm, dx: 6.18, dy: -5.08), hasta: desplaza(solucion.Pm, dx: -6.18, dy: 5.08)), arco(figura.punto("A1"), por: solucion.Qm, desde: desplaza(solucion.Qm, dx: -7.49, dy: -2.81), hasta: desplaza(solucion.Qm, dx: 7.49, dy: 2.81))]'
            toma: segmento2(figura.punto("A1"), proy_planta(solucion.C_ab))
            bloque: Abatimiento del plano frontal de BC
            porque: |
              La mediatriz de A₁C₀. Con el compás abierto A₁C₀ y centro en A₁, un arco arriba y otro abajo:
              más de la mitad de A₁C₀, para que se corten con los de C₀.
          - con: compas
            traza: '[arco(proy_planta(solucion.C_ab), por: solucion.Pm, desde: desplaza(solucion.Pm, dx: 7.49, dy: 2.81), hasta: desplaza(solucion.Pm, dx: -7.49, dy: -2.81)), arco(proy_planta(solucion.C_ab), por: solucion.Qm, desde: desplaza(solucion.Qm, dx: -6.18, dy: 5.08), hasta: desplaza(solucion.Qm, dx: 6.18, dy: -5.08))]'
            toma: segmento2(figura.punto("A1"), proy_planta(solucion.C_ab))
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Con la misma abertura y centro en C₀, otros dos arcos, que cortan a los primeros arriba y
              abajo.
          - con: marca
            traza: solucion.Pm
            rotulo: P
            bloque: Abatimiento del plano frontal de BC
            porque: |
              P (nombre nuestro), donde se cortan los dos arcos de arriba: está a la misma distancia de A₁
              que de C₀.
          - con: marca
            traza: solucion.Qm
            rotulo: Q
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Q (nombre nuestro), donde se cortan los dos arcos de abajo, también a la misma distancia de A₁
              que de C₀.
          - con: regla
            traza: segmento2(solucion.Pm, solucion.Qm)
            bloque: Abatimiento del plano frontal de BC
            porque: |
              PQ es la mediatriz de A₁C₀: todos sus puntos están a la misma distancia de A₁ que de C₀. Cruza
              l₁ entre P y Q.
          - con: marca
            traza: proy_planta(B)
            rotulo: B₁
            bloque: Abatimiento del plano frontal de BC
            porque: |
              B₁, donde la mediatriz corta l₁: B está en la charnela y no se ha movido, y B₁A₁ = B₁C₀, que es
              decir AB = BC.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(B), proy_alzado(B))
            guia: figura.segmento("LT")
            porque: |
              Por B₁, la vertical hasta l₂: B tiene la cota de A.
          - con: marca
            traza: proy_alzado(B)
            rotulo: B₂
            porque: |
              B₂, donde la vertical de B₁ corta l₂, la horizontal de A₂.
          - con: regla
            traza: solucion.AB1
            porque: |
              A₁B₁, la planta del lado AB: hace falta su dirección para el lado opuesto, CD, que es paralelo.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.D1masC)
            guia: solucion.AB1
            porque: |
              Por C₁, la paralela a A₁B₁, larga: CD es paralelo a AB, y D₁ está en ella.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.D1masA)
            guia: figura.segmento("LT")
            porque: |
              Por A₁, la paralela a la línea de tierra, hacia la izquierda: AD es paralelo a BC, frontal, así
              que D tiene el alejamiento de A.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁ (D es nombre nuestro), donde se cortan la paralela a A₁B₁ por C₁ y la paralela a la línea
              de tierra por A₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.D2mas)
            guia: figura.segmento("LT")
            porque: |
              Por C₂, la paralela a la línea de tierra, hacia la derecha: CD es horizontal, así que D tiene
              la cota de C.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(D), proy_alzado(D))
            guia: figura.segmento("LT")
            porque: |
              Por D₁, la vertical hasta la horizontal de C₂.
          - con: marca
            traza: proy_alzado(D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta la horizontal de C₂.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), proy_planta(B)), segmento2(proy_planta(B), figura.punto("C1")), segmento2(figura.punto("C1"), proy_planta(D)), segmento2(proy_planta(D), figura.punto("A1")), segmento2(figura.punto("A2"), proy_alzado(B)), segmento2(proy_alzado(B), figura.punto("C2")), segmento2(figura.punto("C2"), proy_alzado(D)), segmento2(proy_alzado(D), figura.punto("A2"))]'
            porque: |
              A₁B₁C₁D₁ y A₂B₂C₂D₂, las proyecciones del rombo. A₂D₂ sale paralela a B₂C₂: la comprobación.
        pista: |
          (1) l₂, la horizontal de A₂, y l₁, la paralela a la línea de tierra por C₁: B está en l. (2) C₀, en
          la vertical de C₁, 40 mm por debajo (de C₂ a l₂). (3) La mediatriz de A₁C₀ corta l₁ en B₁; B₂, en la
          vertical, sobre l₂. (4) D₁, donde la paralela a A₁B₁ por C₁ corta la horizontal de A₁; D₂, en la
          horizontal de C₂.
        desarrollo: |
          En verde claro, las dos proyecciones del rombo. Ninguna de las dos es un rombo en el papel: el
          rombo no es horizontal ni frontal.

      - tipo: construir
        titulo: El rombo de canto, con un cambio de plano
        intro: |
          Empieza por B₁, como en el paso anterior. Después, el ángulo con el plano horizontal: el tema lo
          saca con un cambio de plano vertical, con la línea nueva perpendicular a una horizontal del plano,
          y aquí hay una dibujada, AB. El enunciado no dice dónde va la línea nueva ni qué referencia se
          toma: lo fijamos nosotros. La línea nueva, perpendicular a A₁B₁ por A₁, el vértice de abajo a la
          derecha de la planta; baja hacia la izquierda, y la vista 4 cae abajo a la derecha, donde hay
          sitio. La referencia, C, el punto más bajo, con la misma cota que D: todo cae hacia fuera. AB y CD
          se ven de punta en la vista 4, así que A₄ ≡ B₄ y C₄ ≡ D₄, y el rombo, de canto. La perpendicular a
          la línea nueva que pasa por A₁ es la propia A₁B₁ prolongada, y la que pasa por C₁ es la paralela a
          A₁B₁, que pasaría por D₁, el del paso anterior. Marca C₄ y A₄; con el transportador, el ángulo del
          canto con la línea nueva.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: C4
            rotulo: C₄
            pide: C y D en la vista 4, que caen en el mismo punto
            es: solucion.C_4
            bien: |
              C₄ ≡ D₄ está en la línea nueva, donde la corta la paralela a A₁B₁ por C₁: C es la referencia, y
              D tiene su misma cota.
            diagnosticos:
              - si: cerca_de(solucion.C4fuera30)
                mensaje: |
                  Has apartado C₄ 30 mm de la línea nueva, su cota contada desde la línea de tierra. En diédrico
                  directo las cotas se cuentan desde la referencia, y C es la referencia: cae en la línea nueva.
                ejemplo: solucion.C4fuera30
              - si: cerca_de(solucion.C4dentro40)
                mensaje: |
                  Has tomado A de referencia, como si C₄ tuviera que quedar 40 mm por debajo de ella, hacia la
                  planta. Aquí la referencia es C: cae en la línea nueva, y A y B se apartan hacia fuera.
                ejemplo: solucion.C4dentro40
              - si: '!en_recta(solucion.parC1)'
                mensaje: |
                  C₄ sale de C₁ por la **perpendicular a la línea nueva**, que es la paralela a A₁B₁ por C₁: la
                  línea nueva es perpendicular a A₁B₁.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("A1"), solucion.C_4), desde: solucion.C_4, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la paralela a A₁B₁ por C₁, pero no en la línea nueva: C es la referencia, y su
                  proyección nueva cae en ella.
          - nombre: A4
            rotulo: A₄
            pide: A y B en la vista 4, que caen en el mismo punto
            es: solucion.A_4
            bien: |
              A₄ ≡ B₄ está en la prolongación de B₁A₁, 40 mm más allá de A₁, hacia fuera: lo que A está más
              alto que C, la referencia. C₄A₄ es el canto del rombo.
            diagnosticos:
              - si: cerca_de(solucion.A4con70)
                mensaje: |
                  Has llevado 70 mm, la cota de A desde la línea de tierra. Se lleva lo que A está más alto que
                  la referencia, C: 70 − 30 = 40 mm.
                ejemplo: solucion.A4con70
              - si: cerca_de(solucion.A4con30)
                mensaje: |
                  Has llevado 30 mm, lo que A está más lejos que C: la diferencia de **alejamientos**. Un cambio
                  de plano vertical sale de la planta y lleva **cotas**: lo que A₂ está por encima de la
                  horizontal de C₂, 40 mm.
                ejemplo: solucion.A4con30
              - si: cerca_de(solucion.A4dentro)
                mensaje: |
                  La distancia es la buena, pero hacia la planta. La vista nueva va al otro lado de la línea
                  nueva, y un punto más alto que la referencia se aparta de ella hacia fuera.
                ejemplo: solucion.A4dentro
              - si: '!en_recta(solucion.lineaB1A1)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**, que es la prolongación de B₁A₁. A₁
                  está en la línea nueva, y desde ahí se lleva la cota.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(4), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de B₁A₁, pero no a la distancia buena: desde A₁, hacia fuera, lo que
                  A está más alto que C, de A₂ a la horizontal de C₂.
        trazado:
          - segmento2(figura.punto("A1"), solucion.C_4)
          - segmento2(solucion.C_4, solucion.A_4)
        bloques:
          - nombre: Abatimiento del plano frontal de BC
            explica: |
              Es el abatimiento del paso anterior, nuestro, que hace falta otra vez para tener B₁.
              El plano frontal de BC gira alrededor de l hasta el horizontal de A, y C₀ cae en la
              vertical de C₁, a lo que C está más bajo que l. Así B₁C₀ mide lo que BC, y B₁, que no
              se mueve, equidista de A₁ y de C₀.
          - nombre: Cambio de plano vertical
            explica: |
              El ángulo del rombo con el plano horizontal se ve con el rombo de canto. Se
              [cambia el plano vertical](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-cambios)
              por otro perpendicular a AB: como AB es horizontal, la línea nueva va perpendicular a
              A₁B₁, y la vista 4 ve AB y CD de punta. La planta se queda, y cada punto lleva su
              cota: se aparta de la línea nueva, hacia el lado contrario a la planta, lo que su cota
              supera a la de C, la referencia. El rombo sale como la recta C₄A₄, y su ángulo con la
              línea nueva es el del rombo con el plano horizontal. El método, la línea nueva y la
              referencia son nuestros: el enunciado no los da.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.K2mas)
            guia: figura.segmento("LT")
            rotulo: l₂
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Primero, B₁, como en el paso anterior. Por A₂, la paralela a la línea de tierra, hacia la
              izquierda y larga: l₂, el alzado de l (nombre nuestro), con la cota de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.K2)
            guia: figura.segmento("LT")
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₂, la vertical hasta l₂: lo que C está más bajo que A, que servirá dos veces.
          - con: marca
            traza: solucion.K2
            rotulo: K₂
            bloque: Abatimiento del plano frontal de BC
            porque: |
              K₂ (nombre nuestro), donde la vertical de C₂ corta l₂: C₂K₂ mide 40 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.B1mas)
            guia: figura.segmento("LT")
            rotulo: l₁
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₁, la paralela a la línea de tierra, hacia la derecha: l₁, con el alejamiento de C.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.C0mas)
            guia: figura.segmento("LT")
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Por C₁, la vertical hacia abajo: el camino de C al abatir el plano frontal de BC con l de
              charnela.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: proy_planta(solucion.C_ab), desde: desplaza(proy_planta(solucion.C_ab), dx: -6), hasta: desplaza(proy_planta(solucion.C_ab), dx: 6))'
            toma: segmento2(figura.punto("C2"), solucion.K2)
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Con centro en C₁ y radio C₂K₂, el corte de abajo: el de arriba cae justo en C₂.
          - con: marca
            traza: proy_planta(solucion.C_ab)
            rotulo: C₀
            bloque: Abatimiento del plano frontal de BC
            porque: |
              C₀, donde el arco corta la vertical de C₁: C abatido, 40 mm por debajo de C₁.
          - con: compas
            traza: '[arco(figura.punto("A1"), por: solucion.Pm, desde: desplaza(solucion.Pm, dx: 6.18, dy: -5.08), hasta: desplaza(solucion.Pm, dx: -6.18, dy: 5.08)), arco(figura.punto("A1"), por: solucion.Qm, desde: desplaza(solucion.Qm, dx: -7.49, dy: -2.81), hasta: desplaza(solucion.Qm, dx: 7.49, dy: 2.81))]'
            toma: segmento2(figura.punto("A1"), proy_planta(solucion.C_ab))
            bloque: Abatimiento del plano frontal de BC
            porque: |
              La mediatriz de A₁C₀: con el compás abierto A₁C₀ y centro en A₁, un arco arriba y otro abajo.
          - con: compas
            traza: '[arco(proy_planta(solucion.C_ab), por: solucion.Pm, desde: desplaza(solucion.Pm, dx: 7.49, dy: 2.81), hasta: desplaza(solucion.Pm, dx: -7.49, dy: -2.81)), arco(proy_planta(solucion.C_ab), por: solucion.Qm, desde: desplaza(solucion.Qm, dx: -6.18, dy: 5.08), hasta: desplaza(solucion.Qm, dx: 6.18, dy: -5.08))]'
            toma: segmento2(figura.punto("A1"), proy_planta(solucion.C_ab))
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Con la misma abertura y centro en C₀, los otros dos.
          - con: marca
            traza: solucion.Pm
            rotulo: P
            bloque: Abatimiento del plano frontal de BC
            porque: |
              P (nombre nuestro), el corte de los arcos de arriba.
          - con: marca
            traza: solucion.Qm
            rotulo: Q
            bloque: Abatimiento del plano frontal de BC
            porque: |
              Q (nombre nuestro), el corte de los arcos de abajo.
          - con: regla
            traza: segmento2(solucion.Pm, solucion.Qm)
            bloque: Abatimiento del plano frontal de BC
            porque: |
              PQ, la mediatriz de A₁C₀, que cruza l₁.
          - con: marca
            traza: proy_planta(B)
            rotulo: B₁
            bloque: Abatimiento del plano frontal de BC
            porque: |
              B₁, donde la mediatriz corta l₁: A₁B₁ = B₁C₀.
          - con: regla
            traza: segmento2(proy_planta(B), solucion.A4mas)
            bloque: Cambio de plano vertical
            porque: |
              A₁B₁, prolongada con la regla más allá de A₁, larga: AB es horizontal, y la línea nueva se traza
              perpendicular a ella. En esta prolongación caerá A₄.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), solucion.nuevaFin), segmento2(figura.punto("A1"), solucion.nuevaIni)]'
            guia: solucion.AB1
            rotulo: línea nueva
            bloque: Cambio de plano vertical
            porque: |
              La **línea nueva**, perpendicular a A₁B₁ por A₁, larga hacia abajo a la izquierda: vista desde
              la dirección de AB, la horizontal se ve de punta, y el rombo entero, de canto.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.C_4)
            guia: solucion.AB1
            bloque: Cambio de plano vertical
            porque: |
              Por C₁, la paralela a A₁B₁, que es la perpendicular a la línea nueva, hasta ella. Pasaría por D₁,
              la del paso anterior: CD es paralelo a AB.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            bloque: Cambio de plano vertical
            porque: |
              C₄ ≡ D₄, donde la paralela a A₁B₁ por C₁ corta la línea nueva: C es la referencia, y su
              proyección nueva cae en la línea; D tiene su misma cota.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.A_4, desde: desplaza(solucion.A_4, dx: -3.85, dy: 4.6), hasta: desplaza(solucion.A_4, dx: 3.85, dy: -4.6))'
            toma: segmento2(figura.punto("C2"), solucion.K2)
            bloque: Cambio de plano vertical
            porque: |
              Con el compás, otra vez C₂K₂, lo que A está más alto que C, la referencia. Con centro en A₁, que
              está en la línea nueva, el arco corta la recta B₁A₁ a los dos lados: vale el de fuera, en la
              prolongación, porque A está más alto que la referencia y se aparta de la planta.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            bloque: Cambio de plano vertical
            porque: |
              A₄ ≡ B₄, donde el arco corta la prolongación de B₁A₁, 40 mm por fuera de la línea nueva: A y B
              tienen la misma cota.
          - con: regla
            traza: segmento2(solucion.C_4, solucion.A_4)
            rotulo: canto
            bloque: Cambio de plano vertical
            porque: |
              C₄A₄ es el rombo **de canto**: la vista 4 mira a lo largo de AB y de CD, que se ven de punta, y
              el plano entero se ve como una recta.
          - con: transportador
            traza: 'arco(solucion.C_4, por: figura.punto("A1"), desde: figura.punto("A1"), hasta: solucion.A_4)'
            bloque: Cambio de plano vertical
            porque: |
              Con el transportador en C₄, el ángulo del canto con la línea nueva: es el que forma el rombo con
              el plano horizontal, porque la línea nueva hace de línea de tierra de una vista que mira el
              plano de canto.
        pista: |
          (1) B₁, como en el paso anterior. (2) Prolonga B₁A₁; la línea nueva, perpendicular a ella por A₁.
          (3) La paralela a A₁B₁ por C₁ corta la línea nueva en C₄ ≡ D₄. (4) A₄ ≡ B₄, en la prolongación de
          B₁A₁, 40 mm por fuera de A₁, con el compás abierto C₂K₂.
        desarrollo: |
          En verde claro, la línea nueva y el canto C₄A₄. El ángulo que forman es el del rombo con el plano
          horizontal.

      - tipo: calcular
        titulo: El ángulo del rombo con el plano horizontal
        pregunta: ¿Qué ángulo forma el rombo con el plano horizontal? Mídelo con el transportador en la vista 4 del paso anterior.
        respuesta:
          tipo: numero
          valor: '68.80'
          receta: angulo
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '21.20'
            receta: 90 - angulo
            mensaje: |
              Ese es el **complementario**: el ángulo del canto con la perpendicular a la línea nueva. El del
              plano con el horizontal es el que forma el canto con la propia línea nueva, que hace de línea
              de tierra de la vista 4.
          - valor: '58.86'
            receta: angulo_con_ph(segmento3(B, C))
            mensaje: |
              Ese es el ángulo de **BC** con el plano horizontal, el que se ve en el alzado porque BC es
              frontal. BC está en el rombo, pero no es su recta de máxima pendiente, y el ángulo del plano
              es el de esa recta: el mayor de todas las suyas.
          - valor: '30.81'
            receta: angulo_con_ph(segmento3(A, C))
            mensaje: |
              Ese es el ángulo de la diagonal **AC** con el plano horizontal: el que forma con A₁C₁ la
              hipotenusa del triángulo de catetos A₁C₁ y los 40 mm de diferencia de cotas. AC tampoco es de
              máxima pendiente.
          - valor: '44.37'
            receta: angulo_con_pv(rombo)
            mensaje: |
              Ese es el ángulo del rombo con el plano **vertical**, el que daría un cambio de plano
              horizontal con la línea nueva perpendicular a B₂C₂.
        pista: |
          En la vista 4, el rombo es la recta C₄A₄: el ángulo es el de esa recta con la línea nueva. También
          sale de la cuenta: A₄ está 40 mm por fuera de la línea nueva, y C₄ queda a 15,5 mm de A₁ sobre ella.
        desarrollo: |
          En la vista 4, el canto sube 40 mm (lo que A está más alto que C) mientras avanza 15,51 mm sobre la
          línea nueva, que es lo que separa las plantas de AB y de CD:

          $$ \tan\alpha = \frac{40}{15{,}51} \;\Longrightarrow\; \alpha \approx 68{,}80^\circ $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: AB es horizontal y BC frontal, así que B tiene la cota de A y el alejamiento de C, y está en una recta paralela a la línea de tierra.
          - texto: AB se ve en verdadera magnitud en la planta, y BC no; abatido el plano frontal de BC sobre el horizontal de A, B₁C₀ sí mide lo que BC.
          - texto: B₁ está en la mediatriz de A₁C₀, donde corta la paralela a la línea de tierra por C₁; D cierra el paralelogramo con AD frontal y CD horizontal.
          - texto: Con la línea nueva perpendicular a A₁B₁, AB y CD se ven de punta y el rombo de canto; el canto forma con la línea nueva el ángulo con el plano horizontal.
          - texto: B₁ es el punto de la paralela a la línea de tierra por C₁ que está a la misma distancia de A₁ que de C₁.
            trampa: true
            mensaje: |
              En la planta, A₁B₁ es la verdadera magnitud de AB, que es horizontal, pero B₁C₁ no lo es de BC,
              que baja 40 mm. Ese punto cae 13,3 mm a la derecha de B₁, y el cuadrilátero que da no es un
              rombo: AB mediría 37,5 mm y BC, 54,8.
    resolucion: |
      **Lo que dan los datos.** Con el convenio del curso (desplazamiento positivo hacia la izquierda del
      origen), A está 20 mm a la derecha de O, a 70 mm de cota y 40 de alejamiento, y C, 40 mm a la
      izquierda, a 30 de cota y 10 de alejamiento. AB horizontal da a B la cota de A; BC frontal, el
      alejamiento de C: B está en la recta l, paralela a la línea de tierra, con l₂ en la horizontal de A₂ y
      l₁ en la de C₁.

      **B.** En un rombo AB = BC. AB, horizontal, está en verdadera magnitud en la planta; BC no. Se abate
      el plano frontal de BC sobre el horizontal de A, con l de charnela: C₁ ya está en l₁, así que C₀ cae en
      su vertical, 40 mm por debajo, lo que C está más bajo que A. B, en la charnela, no se mueve, y B₁ es
      donde la mediatriz de A₁C₀ corta l₁. Queda B(15,83; 10; 70): 15,83 mm a la izquierda de O. El lado
      mide 46,73 mm.

      **D.** AD es paralelo a BC, frontal, y CD paralelo a AB, horizontal: D₁ está donde la paralela a la
      línea de tierra por A₁ corta la paralela a A₁B₁ por C₁, y D₂ en la horizontal de C₂. D(4,17; 40; 30).

      **El ángulo.** Con un cambio de plano vertical, línea nueva perpendicular a A₁B₁ por A₁ y C de
      referencia, AB y CD se ven de punta: C₄ ≡ D₄ en la línea nueva y A₄ ≡ B₄ 40 mm por fuera. El canto
      C₄A₄ forma con la línea nueva 68,80°: el ángulo del rombo con el plano horizontal. BC, que es frontal,
      forma 58,86° con él, y la diagonal AC, 30,81°: menos, porque no son de máxima pendiente.

  - id: sd10-el-triangulo-equilatero-con-el-lado-opuesto-sobre-r
    titulo: El triángulo equilátero con un vértice en A y el lado opuesto sobre r
    fuente: Ejercicio 8 (SD10) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual (§08). El enunciado no impone método:
    # r es horizontal (r₂ es horizontal en el papel), así que abatir alrededor
    # de r es lo que haría el alumno: B y C están en la charnela y no se
    # mueven. A₀ vale a los dos lados (lista). Cuál de los dos vértices de r es
    # B lo decide la primera marca (elección): el enunciado no los nombra. No
    # se usa poligono_regular, para que la receta siga a la construcción: el
    # alumno no busca el centro (en AM, a 2/3 desde A), sino que lleva sobre r,
    # desde el pie M, la mitad del lado, altura/√3; la receta hace lo mismo,
    # con punto_a_distancia.
    enunciado: |
      Dibujar las proyecciones diédricas de un triángulo equilátero sabiendo que el punto A es uno de sus
      vértices y que el lado opuesto está sobre la recta r.

      **Notas nuestras.** La figura es el punto A, con las cruces de A₂ arriba y de A₁ debajo, y la recta
      r, con r₂ horizontal entre las dos cruces y r₁ inclinada, bajando hacia la derecha por debajo de A₁.
      La hoja no da escala: la leemos a 1:1, en milímetros de la lámina. Como r₂ es horizontal, r es
      una recta horizontal. Llamamos B y C a los otros dos
      vértices, los que están sobre r; cuál es cada uno lo decides tú al marcar el primero.
    pide: Las proyecciones de los vértices B y C, que están sobre r, y, como pregunta nuestra, la medida real del lado.
    receta:
      lamina: sd10
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        Ri: 'punto3(alzado: figura.punto("Ri2"), planta: figura.punto("Ri1"))'
        Rd: 'punto3(alzado: figura.punto("Rd2"), planta: figura.punto("Rd1"))'
        tri: plano(A, Ri, Rd)
      solucion:
        # M, el pie de la altura: la perpendicular desde A a r. B y C están en
        # r, a la mitad del lado de M (altura/√3), uno a cada lado: cuál es B
        # es una elección.
        M: pie_perpendicular(A, r)
        h: vm(A, M)
        B: 'punto_a_distancia(r, desde: M, distancia: h / raiz(3))'
        C: 'simetrico(B, respecto: M)'
        lado_mm: en_mm(vm(B, C))
        # ── Decisión: abatimiento con r de charnela sobre su plano horizontal.
        # A se abate a cualquiera de los dos lados (lista); el primero, debajo
        # de r₁ a la izquierda, es el de la construcción, lejos de A₁ y de r₂.
        A_abs: abatido(A, r, tri)
        A_ab: uno(A_abs, 1)
        M1: proy_planta(M)
        K2: pie_perpendicular(figura.punto("A2"), figura.segmento("r2"))
        perpA1: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("r1"))'
        A0mas: 'uno(medir_sobre(segmento2(M1, proy_planta(A_ab)), desde: proy_planta(A_ab), distancia: mm(6)), 1)'
        # El triángulo del radio, rectángulo en M₁: sobre la charnela, desde M₁
        # y hacia la derecha, lo que A está más alto que r; A₁T es el radio.
        T: 'uno(medir_sobre(figura.segmento("r1"), desde: M1, distancia: diferencia_de_cotas(A, M)), 1)'
        # El ángulo de 30° con el compás: el triángulo equilátero A₀M₁P (P a la
        # derecha de A₀M₁) y la perpendicular por A₀ a M₁P, que es su bisectriz
        # en A₀ y corta r₁ en el vértice de la derecha (la rama 1 de B).
        mAM: punto_medio(segmento2(proy_planta(A_ab), M1))
        P: 'uno(medir_sobre(perpendicular(por: mAM, a: segmento2(proy_planta(A_ab), M1)), desde: mAM, distancia: h * raiz(3) / 2), 1)'
        MP: segmento2(M1, P)
        Bmas: 'uno(medir_sobre(segmento2(proy_planta(A_ab), proy_planta(rama(B, 1))), desde: proy_planta(rama(B, 1)), distancia: mm(9)), 1)'
        # Los errores. A₀ con un solo cateto: la cota (a los dos lados) o lo que
        # A₁ dista de r₁, llevado al otro lado (en el lado de A₁ cae en A₁).
        A0cota: 'medir_sobre(perpA1, desde: M1, distancia: diferencia_de_cotas(A, M))'
        A0planta: 'uno(medir_sobre(perpA1, desde: M1, distancia: vm_planta(A, M)), 1)'
        # B y C con la altura de la planta (el triángulo dibujado en la planta,
        # sin abatir) o con la diferencia de cotas sola.
        Bplanta: 'medir_sobre(figura.segmento("r1"), desde: M1, distancia: vm_planta(A, M) / raiz(3))'
        Bcota: 'medir_sobre(figura.segmento("r1"), desde: M1, distancia: diferencia_de_cotas(A, M) / raiz(3))'
      comprueba:
        - en_recta(B, r)
        - en_recta(C, r)
        # Equilátero: B a la misma distancia de A que de C, y C de A que de B.
        - en_plano(B, plano_mediador(A, C))
        - en_plano(C, plano_mediador(A, B))
    pasos:
      - tipo: reconocer
        pregunta: r₂ es horizontal en el papel. ¿Por qué eso decide cómo se resuelve el ejercicio?
        opciones:
          - texto: Porque r es una horizontal del plano del triángulo, y sirve de charnela para abatirlo sin mover B ni C
            correcta: true
            mensaje: |
              Eso es. A y r definen el plano del triángulo, y r es una horizontal suya: se abate sobre el
              plano horizontal de r con ella de charnela. B y C están en r, así que abatidos no se mueven:
              B₀ ≡ B₁ y C₀ ≡ C₁. Solo hay que abatir A.
          - texto: Porque entonces la planta del triángulo está en verdadera magnitud, ya que r se ve sin acortar y el triángulo cuelga de ella
            mensaje: |
              No: lo estaría si el plano del triángulo fuera horizontal, y no lo es, porque A está 30 mm más
              alto que r. Lo que está en verdadera magnitud en la planta es r, y con ella el lado BC; los
              otros dos lados salen acortados.
          - texto: Porque r es frontal, ya que r₂ es horizontal en el papel, y el triángulo se ve en verdadera magnitud en el alzado
            mensaje: |
              r no es frontal: una frontal tiene la planta paralela a la horizontal del papel, y aquí es r₂
              la que lo es. r es horizontal, y su verdadera magnitud está en la planta.

      - tipo: construir
        titulo: Por abatimiento, con r de charnela
        intro: |
          El enunciado no impone método. El que haría el alumno es abatir el plano del triángulo, el de A y
          r, sobre el plano horizontal de r, con r de charnela, porque r es horizontal: B y C, que están en
          ella, no se mueven al abatir, y solo hay que abatir A. Para el radio, el triángulo rectángulo en
          M₁, el pie de la perpendicular a r₁ por A₁: un cateto es A₁M₁ y el otro, lo que A está más alto que
          r. Abatido, A₀M₁ es la altura del triángulo en verdadera magnitud, y los lados que salen de A₀
          forman 30° con ella: con el compás, el triángulo equilátero A₀M₁P da 60° en A₀, y la perpendicular
          por A₀ a M₁P lo parte en dos. A₀ vale a cualquiera de los dos lados de r₁. Cuál de los dos vértices
          de r es B lo decides tú al marcarlo. La vertical de A₂, que es la de A₁, pasa a 1,2 mm del vértice
          de la derecha, en la planta y en el alzado, y M₁P prolongada corta r₂ a 1,2 mm del alzado del de la
          izquierda: amplía con la lupa antes de marcarlos. Marca A₀, B₁, C₁, B₂ y C₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A0
            pide: A abatido sobre el plano horizontal de r, con r de charnela
            es: proy_planta(solucion.A_abs)
            bien: |
              A₀ está en la perpendicular a r₁ por A₁, a 39,1 mm de M₁: la distancia real de A a r, la
              hipotenusa de A₁M₁ (25,1 mm) y de lo que A está más alto que r (30,0 mm). Vale a los dos lados.
            diagnosticos:
              - si: cerca_de(solucion.A0cota)
                mensaje: |
                  Vas por la perpendicular a r₁, pero has llevado solo **lo que A está más alto que r**, A₂K₂.
                  Eso es un cateto. El radio es la hipotenusa de ese cateto y de lo que A₁ dista de r₁ en la
                  planta.
                ejemplo: uno(solucion.A0cota, 1)
              - si: cerca_de(solucion.A0planta)
                mensaje: |
                  Has llevado al otro lado de r₁ lo que A₁ dista de ella **en la planta**, y la planta acorta:
                  A está 30 mm más alto que r. Con esa distancia y la diferencia de cotas se forma el triángulo
                  cuya hipotenusa es el radio.
                ejemplo: solucion.A0planta
              - si: '!en_recta(solucion.perpA1)'
                mensaje: |
                  A gira alrededor de r en un plano perpendicular a ella, que es vertical: en la planta, A₀ se
                  mueve por la **perpendicular a r₁ que pasa por A₁**.
                ejemplo: 'desplaza(proy_planta(solucion.A_ab), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a r₁ por A₁, pero no a la distancia buena. El radio es la
                  hipotenusa de A₁M₁ y de lo que A₂ está por encima de r₂.
          - nombre: B1
            pide: la planta de B, un vértice de los que están en r
            es: proy_planta(solucion.B)
            bien: |
              B₁ ≡ B₀ está en r₁, a 22,6 mm de M₁: la mitad del lado, que es la altura entre √3. B está en la
              charnela, y abatido no se mueve.
            diagnosticos:
              - si: cerca_de(solucion.Bplanta)
                mensaje: |
                  Has dibujado el triángulo **en la planta**, con A₁ de vértice y A₁M₁ de altura. La planta
                  acorta A₁M₁, porque A está 30 mm más alto que r: la altura de verdad es A₀M₁, y sale de
                  abatir A.
                ejemplo: uno(solucion.Bplanta, 1)
              - si: cerca_de(solucion.Bcota)
                mensaje: |
                  Has tomado de altura solo lo que A está más alto que r, un cateto. La altura es A₀M₁, la
                  hipotenusa, con A₁M₁ de otro cateto.
                ejemplo: uno(solucion.Bcota, 1)
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  B está en r: B₁ va **en r₁**. Como está en la charnela, B₀ y B₁ son el mismo punto.
                ejemplo: 'desplaza(proy_planta(rama(solucion.B, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en r₁, pero no a la distancia buena de M₁. Por A₀, la recta que forma 30° con A₀M₁:
                  con el triángulo equilátero A₀M₁P, la perpendicular por A₀ a M₁P. Donde corta r₁, un
                  vértice.
          - nombre: C1
            pide: la planta de C, el otro vértice de r
            es: proy_planta(solucion.C)
            bien: |
              C₁ ≡ C₀ está en r₁, al otro lado de M₁, a la misma distancia que B₁: la altura cae en el punto
              medio del lado BC. B₁C₁ mide 45,2 mm, el lado, en verdadera magnitud: r es horizontal.
            diagnosticos:
              - si: cerca_de(solucion.Bplanta)
                mensaje: |
                  Ese punto sale del triángulo dibujado en la planta, con A₁M₁ de altura. La altura de verdad
                  es A₀M₁: C₁ está al otro lado de M₁, a lo mismo que B₁.
                ejemplo: uno(solucion.Bplanta, 2)
              - si: cerca_de(solucion.Bcota)
                mensaje: |
                  Ese punto sale de tomar de altura solo la diferencia de cotas. C₁ está al otro lado de M₁, a
                  la misma distancia que B₁: con el compás abierto M₁B₁.
                ejemplo: uno(solucion.Bcota, 2)
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  C está en r: C₁ va **en r₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.C, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en r₁, pero no donde toca: al otro lado de M₁, a la distancia M₁B₁. Con centro en M₁ y
                  esa abertura, el arco corta r₁ en C₁.
          - nombre: B2
            pide: el alzado de B
            es: proy_alzado(solucion.B)
            bien: |
              B₂ está en r₂, en la vertical de B₁.
            diagnosticos:
              - si: '!en_vertical_de(B1)'
                mensaje: |
                  B₂ va en la **vertical de B₁**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.B, 1)), dx: mm(5))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  B está en r: B₂ va **en r₂**, donde la corta la vertical de B₁.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.B, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  B₂ está donde la vertical de B₁ corta r₂.
          - nombre: C2
            pide: el alzado de C
            es: proy_alzado(solucion.C)
            bien: |
              C₂ está en r₂, en la vertical de C₁. B₂C₂ está en r₂, y A₂B₂C₂ es el alzado del triángulo.
            diagnosticos:
              - si: '!en_vertical_de(C1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.C, 1)), dx: mm(5))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  C está en r: C₂ va **en r₂**, donde la corta la vertical de C₁.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.C, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  C₂ está donde la vertical de C₁ corta r₂.
        trazado:
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.B))
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.C))
          - segmento2(figura.punto("A1"), proy_planta(solucion.B))
          - segmento2(figura.punto("A1"), proy_planta(solucion.C))
          - segmento2(proy_planta(solucion.B), proy_planta(solucion.C))
          - segmento2(figura.punto("A2"), proy_alzado(solucion.B))
          - segmento2(figura.punto("A2"), proy_alzado(solucion.C))
          - segmento2(proy_alzado(solucion.B), proy_alzado(solucion.C))
        bloques:
          - nombre: Abatimiento con r de charnela
            explica: |
              El enunciado no impone método;
              [abatir](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)
              con r de charnela es elección nuestra, la que haría el alumno, porque r es horizontal.
              El plano gira alrededor de r hasta quedar horizontal, a la cota de r, y la planta lo
              da sin acortar. B y C están en r y no se mueven; A gira en un plano vertical,
              perpendicular a r, y en la planta va por la perpendicular a r₁. Su radio es la
              hipotenusa de A₁M₁ y de lo que A está más alto que r, y A₀M₁ es la altura en verdadera
              magnitud: ahí se dibuja el triángulo, y B₁ y C₁ ya son sus plantas.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.K2)
            guia: figura.segmento("r2")
            bloque: Abatimiento con r de charnela
            porque: |
              Por A₂, la vertical hasta r₂: ese trozo es lo que A está más alto que r. r es horizontal, y toda
              ella tiene la misma cota, la de r₂.
          - con: marca
            traza: solucion.K2
            bloque: Abatimiento con r de charnela
            porque: |
              K₂ (nombre nuestro), donde la vertical de A₂ corta r₂: A₂K₂ mide 30 mm. Va sin rótulo, porque el
              alzado del vértice de la derecha caerá a 1,2 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.A0mas)
            guia: figura.segmento("r1")
            bloque: Abatimiento con r de charnela
            porque: |
              Por A₁, la perpendicular a la charnela r₁, larga, cruzándola: al abatir, A gira alrededor de r en
              un plano perpendicular a ella, que es vertical, y en la planta se mueve por esta recta.
          - con: marca
            traza: solucion.M1
            rotulo: M₁
            bloque: Abatimiento con r de charnela
            porque: |
              M₁ (nombre nuestro), donde la perpendicular por A₁ corta r₁: el pie de A en la charnela. Será el
              pie de la altura del triángulo.
          - con: compas
            traza: 'arco(solucion.M1, por: solucion.T, desde: desplaza(solucion.T, dx: -3.86, dy: 4.6), hasta: desplaza(solucion.T, dx: 3.86, dy: -4.6))'
            toma: segmento2(figura.punto("A2"), solucion.K2)
            bloque: Abatimiento con r de charnela
            porque: |
              El triángulo del radio, rectángulo en M₁. Con el compás, A₂K₂, lo que A está más alto que r, y
              con centro en M₁, sobre la charnela. Corta r₁ a los dos lados de M₁, y los dos dan el mismo
              radio; tomamos el de la derecha, que queda libre.
          - con: marca
            traza: solucion.T
            rotulo: T
            bloque: Abatimiento con r de charnela
            porque: |
              T (nombre nuestro), donde el arco corta r₁: M₁T es la diferencia de cotas, y A₁M₁, el otro cateto.
          - con: regla
            traza: segmento2(figura.punto("A1"), solucion.T)
            bloque: Abatimiento con r de charnela
            porque: |
              La hipotenusa, de A₁ a T, es la distancia real de A a la charnela: el radio con que A se abate,
              39,1 mm. Como el lado opuesto a A está en r, es también la altura del triángulo.
          - con: compas
            traza: 'arco(solucion.M1, por: proy_planta(solucion.A_ab), desde: desplaza(proy_planta(solucion.A_ab), dx: -4.6, dy: -3.86), hasta: desplaza(proy_planta(solucion.A_ab), dx: 4.6, dy: 3.86))'
            toma: segmento2(figura.punto("A1"), solucion.T)
            bloque: Abatimiento con r de charnela
            porque: |
              Con centro en M₁ y radio A₁T, el arco que corta la perpendicular al otro lado de r₁: A cae al
              plano horizontal de r girando alrededor de la charnela. Del lado de A₁ también valdría.
          - con: marca
            traza: proy_planta(solucion.A_ab)
            rotulo: A₀
            bloque: Abatimiento con r de charnela
            porque: |
              A₀, donde el arco de centro M₁ corta la perpendicular por A₁, debajo de r₁: A abatido. A₀M₁ es la
              altura del triángulo en verdadera magnitud.
          - con: compas
            traza: '[arco(proy_planta(solucion.A_ab), por: solucion.P, desde: desplaza(solucion.P, dx: -1.39, dy: 7.88), hasta: desplaza(solucion.P, dx: 1.39, dy: -7.88)), arco(solucion.M1, por: solucion.P, desde: desplaza(solucion.P, dx: -7.52, dy: 2.74), hasta: desplaza(solucion.P, dx: 7.52, dy: -2.74))]'
            toma: segmento2(proy_planta(solucion.A_ab), solucion.M1)
            bloque: Abatimiento con r de charnela
            porque: |
              El ángulo de 60°, con el compás: con radio A₀M₁ y centro en A₀ y en M₁, dos arcos que se cortan a
              los dos lados de A₀M₁. Tomamos el corte de la derecha; el de la izquierda también vale, y daría
              primero el vértice de la izquierda.
          - con: marca
            traza: solucion.P
            rotulo: P
            bloque: Abatimiento con r de charnela
            porque: |
              P (nombre nuestro), donde se cortan los dos arcos: A₀M₁P es equilátero, y el ángulo en A₀ mide
              60°.
          - con: regla
            traza: solucion.MP
            bloque: Abatimiento con r de charnela
            porque: |
              M₁P, el lado del triángulo equilátero auxiliar opuesto a A₀.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.A_ab), solucion.Bmas)
            guia: solucion.MP
            bloque: Abatimiento con r de charnela
            porque: |
              Por A₀, la perpendicular a M₁P, hasta cruzar r₁: en el triángulo equilátero A₀M₁P es la bisectriz
              del ángulo en A₀, así que forma 30° con la altura A₀M₁. En el triángulo pedido, la altura parte en
              dos el ángulo de 60° de A₀: esta recta es un lado. En el papel, el cartabón la da de una vez.
          - con: marca
            traza: proy_planta(solucion.B)
            rotulo: B₁
            bloque: Abatimiento con r de charnela
            porque: |
              B₁ ≡ B₀, donde esa recta corta r₁: B está en la charnela, y abatido no se mueve. Aquí es el de la
              derecha; el otro valdría igual, y entonces sería C.
          - con: compas
            traza: 'arco(solucion.M1, por: proy_planta(solucion.C), desde: desplaza(proy_planta(solucion.C), dx: 3.86, dy: -4.6), hasta: desplaza(proy_planta(solucion.C), dx: -3.86, dy: 4.6))'
            toma: segmento2(solucion.M1, proy_planta(rama(solucion.B, 1)))
            bloque: Abatimiento con r de charnela
            porque: |
              Con centro en M₁ y radio M₁B₁, el arco que corta r₁ al otro lado: la altura cae en el punto
              medio del lado BC.
          - con: marca
            traza: proy_planta(solucion.C)
            rotulo: C₁
            bloque: Abatimiento con r de charnela
            porque: |
              C₁ ≡ C₀, donde el arco corta r₁ al otro lado de M₁.
          - con: regla
            traza: segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.C))
            bloque: Abatimiento con r de charnela
            porque: |
              A₀C₁ cierra el triángulo abatido A₀B₁C₁, en verdadera magnitud: sus tres lados miden 45,2 mm.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(rama(solucion.B, 1)), proy_alzado(rama(solucion.B, 1))), segmento2(proy_planta(rama(solucion.C, 1)), proy_alzado(rama(solucion.C, 1)))]'
            guia: figura.segmento("r2")
            porque: |
              Por B₁ y por C₁, las verticales hasta r₂: B y C están en r.
          - con: marca
            traza: proy_alzado(solucion.B)
            rotulo: B₂
            porque: |
              B₂, donde la vertical de B₁ corta r₂, a 1,2 mm de K₂.
          - con: marca
            traza: proy_alzado(solucion.C)
            rotulo: C₂
            porque: |
              C₂, donde la vertical de C₁ corta r₂.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), proy_planta(rama(solucion.B, 1))), segmento2(figura.punto("A1"), proy_planta(rama(solucion.C, 1))), segmento2(figura.punto("A2"), proy_alzado(rama(solucion.B, 1))), segmento2(figura.punto("A2"), proy_alzado(rama(solucion.C, 1)))]'
            porque: |
              A₁B₁C₁ y A₂B₂C₂, las proyecciones del triángulo; sus lados BC están sobre r₁ y r₂.
        pista: |
          (1) Por A₁, la perpendicular a r₁: M₁. (2) El radio: sobre r₁, desde M₁, lo que A₂ está por encima
          de r₂; la hipotenusa hasta A₁. (3) A₀, con centro en M₁ y ese radio. (4) Con radio A₀M₁ y centros
          en A₀ y M₁, P; por A₀, la perpendicular a M₁P corta r₁ en un vértice. (5) El otro, al otro lado de
          M₁, a la misma distancia. (6) Los alzados, en r₂.
        desarrollo: |
          En verde claro, el triángulo abatido A₀B₁C₁, en verdadera magnitud, y sus dos proyecciones. B y C
          están en la charnela: no se mueven al abatir.

      - tipo: calcular
        titulo: El lado del triángulo
        pregunta: ¿Cuánto mide de verdad el lado del triángulo equilátero?
        respuesta:
          tipo: numero
          valor: '45.18'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '39.13'
            receta: en_mm(h)
            mensaje: |
              Eso es la **altura**, A₀M₁: la distancia real de A a r. El lado es más largo, 2/√3 veces la
              altura, porque la altura es un cateto del triángulo que forma con medio lado.
          - valor: '28.98'
            receta: en_mm(vm_planta(A, M) * 2 / raiz(3))
            mensaje: |
              Es el lado del triángulo que tiene de altura A₁M₁, la de la **planta**. La planta acorta esa
              altura, porque A está 30 mm más alto que r: la buena es A₀M₁, la abatida.
          - valor: '30.04'
            receta: en_mm(vm_alzado(A, rama(B, 1)))
            mensaje: |
              Eso es lo que mide en el **alzado** el lado que va al vértice de la derecha. Ese lado no es
              frontal, y el alzado lo acorta. El lado en verdadera magnitud está en la planta, sobre r: B₁C₁.
          - valor: '33.77'
            receta: en_mm(vm_planta(A, B))
            mensaje: |
              Eso es lo que mide **A₁B₁ en la planta**. AB sube 30 mm de B a A, y la planta lo acorta. El lado
              que sí se ve en verdadera magnitud en la planta es B₁C₁: está sobre r, que es horizontal.
        pista: |
          Mide B₁C₁ con «medir»: BC está sobre r, que es horizontal, y la planta la da en verdadera magnitud.
          También A₀B₁, en el abatimiento.
        desarrollo: |
          La altura es la distancia real de A a r, 39,13 mm, y el lado de un triángulo equilátero es 2/√3
          veces su altura:

          $$ \ell = \frac{2}{\sqrt{3}}\, \overline{A_0M_1} = \frac{2}{\sqrt{3}} \cdot 39{,}13 \approx 45{,}18 \text{ mm} $$

          En el alzado, el lado que va al vértice de la izquierda mide 44,93 mm, casi lo mismo por
          casualidad, y el de la derecha, 30,04: ninguno está en verdadera magnitud, porque ni AB ni AC son
          frontales.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A y r definen el plano del triángulo, y r es horizontal, porque r₂ lo es en el papel; sirve de charnela.
          - texto: A se abate por la perpendicular a r₁, con un radio que es la hipotenusa de A₁M₁ y de lo que A está más alto que r; A₀M₁ es la altura en verdadera magnitud.
          - texto: B y C están en r, a cada lado de M₁, y los lados A₀B₁ y A₀C₁ forman 30° con la altura A₀M₁.
          - texto: B y C están en la charnela y no se mueven al abatir, así que B₁ y C₁ ya son sus plantas; los alzados, en r₂, en la vertical.
          - texto: La altura del triángulo es A₁M₁, lo que A₁ dista de r₁ en la planta, y el triángulo se dibuja allí mismo.
            trampa: true
            mensaje: |
              A₁M₁ es una proyección: A está 30 mm más alto que r, y la planta acorta la altura, de 39,1 a 25,1
              mm. Un triángulo dibujado en la planta con esa altura tiene 29,0 mm de lado, y el de verdad,
              45,2.
    resolucion: |
      **Lo que dan los datos.** r₂ es horizontal en el papel: r es una recta horizontal, y con A define el
      plano del triángulo. El lado BC está en r, y A es el vértice opuesto: la altura del triángulo es la
      distancia de A a r.

      **El abatimiento.** Con r de charnela, el plano se abate sobre el plano horizontal de r, y B y C, que
      están en ella, no se mueven. A se abate por la perpendicular a r₁ que pasa por A₁, que la corta en M₁.
      El radio es la hipotenusa de A₁M₁, 25,10 mm en la planta, y de lo que A está más alto que r, 30,01 mm
      en el alzado: 39,13 mm. Esa es la altura del triángulo.

      **El triángulo.** En verdadera magnitud, los lados que salen de A₀ forman 30° con la altura A₀M₁: con
      el triángulo equilátero auxiliar A₀M₁P, la perpendicular por A₀ a M₁P corta r₁ en un vértice, y el
      otro está al otro lado de M₁, a la misma distancia, 22,59 mm, la mitad del lado. B₁ y C₁ son esos dos
      puntos, y B₂ y C₂ están en r₂, en sus verticales. El lado mide 45,18 mm; B₁C₁ lo da en la planta,
      porque r es horizontal, y A₁B₁, que no lo es, mide 33,77.

  - id: sd11-el-cuadrado-de-40-mm-con-un-lado-sobre-r
    titulo: El cuadrado de 40 mm con un lado sobre r y A de vértice más alto
    fuente: Ejercicio 9 (SD11) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual (§08), con su «Datos:» seguido de
    # minúscula, como en la página. El enunciado no impone método: dibujar una
    # figura dentro de un plano es abatir, dibujar y desabatir (la tabla «Qué
    # método conviene» del tema), y es lo que haría el alumno. La charnela no
    # la da: la fijamos en el intro, la horizontal por el extremo de abajo de
    # s₂, que corta r₂ a 1 mm de su extremo. Una sola solución: B baja por r y D
    # baja desde A, porque A es el vértice de mayor cota.
    enunciado: |
      Dibujar las proyecciones diédricas de un cuadrado contenido en el plano definido por las rectas r
      y s. Datos: un lado se sitúa sobre la recta r, el punto A es el vértice de mayor cota y los lados
      miden 40 mm.

      **Notas nuestras.** La figura son las rectas r y s, que se cortan en A, en el alzado arriba y en la
      planta debajo: A₂ y A₁ son el vértice común de las dos rectas en cada vista, y las dos
      bajan desde A, r hacia la izquierda y s hacia la derecha. La figura no nombra nada más, y la hoja
      no da escala: la leemos a 1:1, y los 40 mm del lado son 40 mm de la lámina. Aquí
      llamamos B al otro extremo del lado que va sobre r, D al otro vértice que forma lado con A y C al
      cuarto; S al extremo de abajo de s₂, y R al punto de r que tiene la cota de S, que cae a 1 mm del
      extremo de abajo de r₂.
    pide: Las proyecciones de los vértices B, C y D del cuadrado y, como pregunta nuestra, el ángulo que forma el plano de r y s con el plano horizontal.
    receta:
      lamina: sd11
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        s: 'recta3(alzado: figura.segmento("s2"), planta: figura.segmento("s1"))'
        # El plano horizontal de S₂, para sacar S, el punto de s que tiene el
        # alzado S₂, y R, el punto de r a su misma altura. S₂ y el extremo de s₁
        # no están en la misma vertical (0,25 mm): S se toma sobre s₁, en la x de S₂.
        Sa: 'punto3(alzado: figura.punto("S2"), planta: desplaza(figura.punto("S2"), dy: 170))'
        Sb: 'punto3(alzado: desplaza(figura.punto("S2"), dx: 50), planta: desplaza(figura.punto("S2"), dx: 50, dy: 170))'
        Sc: 'punto3(alzado: figura.punto("S2"), planta: desplaza(figura.punto("S2"), dy: 220))'
        cotaS: plano(Sa, Sb, Sc)
        S: corte_recta_plano(s, cotaS)
        R: corte_recta_plano(r, cotaS)
        rs: plano(A, R, S)
      solucion:
        # El cuadrado. El lado de r tiene a A en un extremo; B, a 40 mm, hacia
        # donde r baja (rama 1): A es el de mayor cota. D, girando B 90°
        # alrededor de la normal al plano por A, hacia donde baja. Una sola
        # posición; Bmal y Dmal, los que suben, son errores.
        BB: 'punto_a_distancia(r, desde: A, distancia: mm(40))'
        B: rama(BB, 1)
        Bmal: rama(BB, 2)
        nA: perpendicular_a_plano(A, rs)
        D: 'gira(B, nA, angulo: 90, sentido: descendente)'
        Dmal: 'gira(B, nA, angulo: 90, sentido: ascendente)'
        C: 'simetrico(A, respecto: punto_medio(segmento3(B, D)))'
        alfa: angulo_con_ph(rs)
        # Decisión: abatimiento con la charnela hS, la horizontal por S, que va
        # de R a S, sobre el plano horizontal que la contiene. A se abate a
        # cualquiera de los dos lados (una elección: la primera marca fija el
        # lado), y los demás con el mismo giro. Rama 1, debajo de la planta, la
        # de la construcción: al otro lado el cuadrado abatido cae encima de la
        # planta.
        hS: recta3(R, S)
        A_ab: abatido_a_elegir(A, hS, rs)
        B_ab: 'abatido_junto(B, hS, rs, con: A_ab, de: A)'
        C_ab: 'abatido_junto(C, hS, rs, con: A_ab, de: A)'
        D_ab: 'abatido_junto(D, hS, rs, con: A_ab, de: A)'
        # La construcción, en la rama 1.
        R1: proy_planta(R)
        R2: proy_alzado(R)
        S1: proy_planta(S)
        ch: segmento2(R1, S1)
        M: pie_perpendicular(figura.punto("A1"), ch)
        MA: pie_perpendicular(A, hS)
        N2: 'pie_perpendicular(figura.punto("A2"), segmento2(figura.punto("S2"), R2))'
        perpA: 'perpendicular(por: figura.punto("A1"), a: ch)'
        parA: 'perpendicular(por: figura.punto("A1"), a: perpA)'
        # El triángulo del radio de A, rectángulo en A₁: sobre la paralela a la
        # charnela, hacia la derecha, lo que A está más alto que ella. MT es el
        # radio, y el ángulo en M es el del plano con el horizontal.
        T: 'uno(medir_sobre(parA, desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, S)), 2)'
        A0c: proy_planta(rama(A_ab, 1))
        B0c: proy_planta(rama(B_ab, 1))
        C0c: proy_planta(rama(C_ab, 1))
        D0c: proy_planta(rama(D_ab, 1))
        r0: segmento2(R1, A0c)
        # Donde la recta CD corta la charnela: no se mueve al abatir, así que
        # D₀C₀ pasa por él, y C₁D₁ también, paralela a r₁ (CD es paralela a AB).
        J3: corte_recta_plano(recta3(C, D), cotaS)
        J1: proy_planta(J3)
        J2: proy_alzado(J3)
        lJ: 'perpendicular(por: J1, a: perpendicular(por: J1, a: figura.segmento("r1")))'
        lJ2: 'perpendicular(por: J2, a: perpendicular(por: J2, a: figura.segmento("r2")))'
        perpB: 'perpendicular(por: proy_planta(B), a: ch)'
        perpC: 'perpendicular(por: proy_planta(C), a: ch)'
        perpD: 'perpendicular(por: proy_planta(D), a: ch)'
        # Los extremos de los trazos largos, que pasan unos mm del punto que
        # luego se marca en ellos.
        h2mas: 'uno(medir_sobre(segmento2(figura.punto("S2"), R2), desde: R2, distancia: 6), 1)'
        N2mas: 'uno(medir_sobre(segmento2(figura.punto("A2"), N2), desde: N2, distancia: 6), 1)'
        R1mas: 'uno(medir_sobre(segmento2(R2, R1), desde: R1, distancia: 7), 1)'
        S1mas: 'uno(medir_sobre(segmento2(figura.punto("S2"), S1), desde: S1, distancia: 7), 1)'
        chI: 'uno(medir_sobre(ch, desde: R1, distancia: 8), 2)'
        chD: 'uno(medir_sobre(ch, desde: S1, distancia: 25), 1)'
        A0mas: 'uno(medir_sobre(perpA, desde: A0c, distancia: 9), 1)'
        Tmas: 'uno(medir_sobre(parA, desde: T, distancia: 9), 2)'
        D0mas: 'uno(medir_sobre(perpendicular(por: A0c, a: r0), desde: D0c, distancia: 9), 2)'
        C0masB: 'uno(medir_sobre(segmento2(B0c, C0c), desde: C0c, distancia: 9), 1)'
        C0masD: 'uno(medir_sobre(segmento2(D0c, C0c), desde: C0c, distancia: 9), 1)'
        B1mas: 'uno(medir_sobre(segmento2(B0c, proy_planta(B)), desde: proy_planta(B), distancia: 8), 1)'
        C1mas: 'uno(medir_sobre(segmento2(C0c, proy_planta(C)), desde: proy_planta(C), distancia: 8), 1)'
        D1mas: 'uno(medir_sobre(segmento2(D0c, proy_planta(D)), desde: proy_planta(D), distancia: 8), 1)'
        lJi: 'uno(medir_sobre(lJ, desde: proy_planta(C), distancia: 8), 2)'
        lJd: 'uno(medir_sobre(lJ, desde: proy_planta(D), distancia: 8), 1)'
        J2mas: 'uno(medir_sobre(segmento2(J1, J2), desde: J2, distancia: 6), 1)'
        lJ2i: 'uno(medir_sobre(lJ2, desde: proy_alzado(C), distancia: 8), 2)'
        lJ2d: 'uno(medir_sobre(lJ2, desde: proy_alzado(D), distancia: 8), 1)'
        B2mas: 'uno(medir_sobre(segmento2(proy_planta(B), proy_alzado(B)), desde: proy_alzado(B), distancia: 8), 1)'
        C2mas: 'uno(medir_sobre(segmento2(proy_planta(C), proy_alzado(C)), desde: proy_alzado(C), distancia: 8), 1)'
        D2mas: 'uno(medir_sobre(segmento2(proy_planta(D), proy_alzado(D)), desde: proy_alzado(D), distancia: 8), 1)'
        # Los errores. A₀ con un solo cateto: la cota (a los dos lados) o lo que
        # A₁ dista de la charnela, llevado al otro lado (del lado de A₁ cae en A₁).
        Acat: 'medir_sobre(perpA, desde: M, distancia: diferencia_de_cotas(A, S))'
        Aplanta: 'uno(medir_sobre(perpA, desde: M, distancia: vm_planta(A, MA)), 1)'
        # D sobre s₀, la recta s abatida, como si el lado AD fuera por s: de A₀
        # hacia S₁, que está en la charnela y no se mueve.
        Ds0: 'uno(medir_sobre(segmento2(proy_planta(A_ab), S1), desde: proy_planta(A_ab), distancia: mm(40)), 1)'
        # Donde la perpendicular a la charnela que sale de D₀ corta s₁
        # prolongada: el que cree que D está en s.
        Ds1: proy_planta(corte_recta_plano(s, plano_perpendicular_a_recta(D, hS)))
      comprueba:
        - en_recta(A, s)
        - en_recta(R, r)
        - en_recta(S, s)
        - en_recta(B, r)
        - en_plano(C, rs)
        - en_plano(D, rs)
    pasos:
      - tipo: reconocer
        pregunta: A es un vértice del cuadrado y está en r, y un lado va sobre r. ¿Qué lado es?
        opciones:
          - texto: AB, con B en r a 40 mm de A, hacia donde r baja
            correcta: true
            mensaje: |
              Eso es. Una recta que lleva un lado solo pasa por los dos vértices de ese lado; si A está en
              r y es un vértice, es uno de los dos extremos. Y como A es el vértice de mayor cota, B queda
              hacia donde r baja: en el alzado, hacia la izquierda de A₂.
          - texto: Uno que no pasa por A, porque A ya está en s
            mensaje: |
              No puede ser. La recta de un lado solo contiene los dos vértices de ese lado. Si A está en r y
              es un vértice, el lado de r es uno de los suyos. s no lleva ningún lado: solo define el
              plano con r.
          - texto: 'AB, con B en r a 40 mm de A, hacia donde r sube: a la derecha de A₂, en la prolongación de r₂'
            mensaje: |
              El lado sí es AB, pero B quedaría por encima de A, y el enunciado dice que A es el vértice de
              mayor cota. B va hacia donde r baja.

      - tipo: construir
        titulo: Por abatimiento, con la horizontal por S de charnela
        intro: |
          El enunciado no impone método. El que haría el alumno es abatir el plano de r y s, dibujar el
          cuadrado en verdadera magnitud y desabatirlo. La charnela tampoco la da: la fijamos nosotros. Es
          la horizontal del plano por S, el extremo de abajo de s₂, que corta r₂ en R, a 1 mm de su
          extremo: los dos extremos de abajo están casi a la misma cota. A se abate con su triángulo, y r₀
          va de R₁ a A₀. Sobre r₀, B₀ a 40 mm de A₀, y D₀ en la perpendicular por A₀, hacia la charnela:
          los dos bajan desde A. Vale cualquiera de los dos lados de la charnela, pero todo al mismo. Para
          desabatir C y D, J, donde D₀C₀ corta la charnela: CD es paralela a r. Varios cortes caen muy
          cerca de un punto que se marca: B₀, a 1 mm de donde el arco de 40 mm corta la vertical de R₂; D₀,
          a 2 mm de donde ese arco corta el de A₀; C₀, a 2 mm de s₁, y C₁, a 3 mm de la vertical de A₂. Si
          abates del lado de A₁, B₀ cae a 3 mm de B₁. Amplía con la lupa (×4) antes de marcarlos. Marca A₀, el
          cuadrado abatido, y las dos proyecciones de B, C y D.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A0
            pide: A abatido sobre el plano horizontal de la charnela
            es: proy_planta(solucion.A_ab)
            bien: |
              A₀ está en la perpendicular a la charnela que pasa por A₁, a 39,2 mm de M: la distancia real
              de A a la charnela, la hipotenusa de lo que A₁ dista de ella en la planta (21,7 mm) y de lo
              que A está más alto que ella (32,6 mm). Vale a los dos lados.
            diagnosticos:
              - si: cerca_de(solucion.Acat)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que A está más alto que
                  la charnela**, A₂N₂. Eso es un cateto. El radio es la hipotenusa de ese cateto y de lo que
                  A₁ dista de la charnela en la planta.
                ejemplo: uno(solucion.Acat, 1)
              - si: cerca_de(solucion.Aplanta)
                mensaje: |
                  Has llevado al otro lado de la charnela lo que A₁ dista de ella **en la planta**, y la
                  planta acorta: A está 32,6 mm más alto que la charnela. Con esa distancia y la cota se
                  forma el triángulo cuya hipotenusa es el radio.
                ejemplo: solucion.Aplanta
              - si: '!en_recta(solucion.perpA)'
                mensaje: |
                  A gira alrededor de la charnela en un plano perpendicular a ella, que es vertical, porque
                  la charnela es horizontal: en la planta, A₀ se mueve por la **perpendicular a la charnela
                  que pasa por A₁**.
                ejemplo: 'desplaza(solucion.A0c, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por A₁, pero no a la distancia buena. El radio es la
                  hipotenusa del triángulo que tiene por catetos lo que A₁ dista de la charnela y lo que A₂
                  está por encima de la horizontal de S₂.
          - nombre: B0
            pide: el vértice B, el otro extremo del lado de r, abatido
            es: proy_planta(solucion.B_ab)
            bien: |
              B₀ está en r₀, a 40 mm de A₀, del lado de R₁: el lado, en verdadera magnitud, hacia donde r
              baja. r₀ va de R₁, que está en la charnela y no se mueve, a A₀.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.B_ab)))
                mensaje: |
                  Ese es B abatido **al otro lado** de la charnela. El plano gira entero, como una tapa sobre
                  su bisagra: B₀ cae al mismo lado que A₀.
                ejemplo: proy_planta(rama(solucion.B_ab, 2))
              - si: '!a_distancia(de: A0, d: mm(40))'
                mensaje: |
                  B₀ está a **40 mm de A₀**, el lado del cuadrado: abatido, el plano se ve en verdadera
                  magnitud, y el lado se lleva tal cual, con el compás abierto 40 mm.
                ejemplo: 'uno(medir_sobre(solucion.r0, desde: solucion.B0c, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  A 40 mm de A₀, pero no en r₀. B está en r: B₀ va en r₀, la recta abatida, que une R₁, que
                  está en la charnela y no se mueve, con A₀.
          - nombre: D0
            pide: el vértice D, el otro que forma lado con A, abatido
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está en la perpendicular a r₀ por A₀, a 40 mm, del lado de la charnela: D está más bajo que
              A y los dos están por encima de la charnela, así que abatido D₀ queda más cerca de ella que A₀.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela. Si A₀ y B₀ han caído a un lado, D₀ cae al
                  mismo.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: cerca_de(solucion.Ds0)
                mensaje: |
                  Has llevado el lado AD **sobre s₀**. s no lleva ningún lado del cuadrado: solo define el
                  plano con r. r y s forman 71,7°, no 90°, y AD es perpendicular a AB: D₀ va en la
                  perpendicular a r₀ por A₀.
                ejemplo: rama(solucion.Ds0, 1)
              - si: '!a_distancia(de: A0, d: mm(40))'
                mensaje: |
                  D₀ está a **40 mm de A₀**: AD es un lado, y en el abatimiento se lleva en verdadera
                  magnitud.
                ejemplo: 'uno(medir_sobre(perpendicular(por: solucion.A0c, a: solucion.r0), desde: solucion.D0c, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  A 40 mm de A₀, pero no en la perpendicular a r₀ que pasa por A₀: los lados AB y AD forman un
                  ángulo recto, y abatidos lo siguen formando.
          - nombre: C0
            pide: el vértice C, el cuarto, abatido
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está a 40 mm de B₀ y de D₀, en la perpendicular a r₀ por B₀ y en la paralela a r₀ por D₀.
              A₀B₀C₀D₀ es el cuadrado en verdadera magnitud; la charnela lo cruza, porque C está más bajo
              que ella.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.C_ab)))
                mensaje: |
                  Ese es C abatido **al otro lado** de la charnela, el de la otra posición del cuadrado. Va con
                  A₀, B₀ y D₀.
                ejemplo: proy_planta(rama(solucion.C_ab, 2))
              - si: '!a_distancia(de: B0, d: mm(40))'
                mensaje: |
                  C₀ está a **40 mm de B₀**: BC es un lado, perpendicular a r₀ por B₀.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.B0c, solucion.C0c), desde: solucion.C0c, distancia: mm(6)), 2)'
              - si: '!a_distancia(de: D0, d: mm(40))'
                mensaje: |
                  C₀ está a **40 mm de D₀**: CD es un lado, paralelo a r₀ por D₀.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.D0c, solucion.C0c), desde: solucion.C0c, distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  C₀ es el cuarto vértice: donde la perpendicular a r₀ por B₀ corta la paralela a r₀ por D₀.
          - nombre: B1
            pide: el vértice B, desabatido, en la planta
            es: proy_planta(solucion.B)
            bien: |
              B₁ está en r₁, en la perpendicular a la charnela que pasa por B₀: al desabatir, B vuelve por el
              mismo camino por el que se abatió.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Bmal))
                mensaje: |
                  Ese B está en r₁, pero al otro lado de A₁, por encima de A: es el que sale de llevar el lado
                  hacia donde r sube. A es el vértice de mayor cota, y B baja.
                ejemplo: proy_planta(solucion.Bmal)
              - si: '!en_recta(solucion.perpB)'
                mensaje: |
                  Al desabatir, B₁ vuelve por la **perpendicular a la charnela que pasa por B₀**: es el mismo
                  camino que siguió al abatirse.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(solucion.B), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  B está en r: B₁ va **en r₁**, donde la corta la perpendicular a la charnela que sale de B₀.
                ejemplo: 'uno(medir_sobre(solucion.perpB, desde: proy_planta(solucion.B), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  B₁ está donde la perpendicular a la charnela por B₀ corta r₁.
          - nombre: D1
            pide: el vértice D, desabatido, en la planta
            es: proy_planta(solucion.D)
            bien: |
              D₁ está en la perpendicular a la charnela que pasa por D₀ y en la paralela a r₁ por J: la recta
              CD corta la charnela en J, que no se mueve, y es paralela a r.
            diagnosticos:
              - si: cerca_de(solucion.Ds1)
                mensaje: |
                  Has llevado D₁ **a s₁**. D no está en s: s solo define el plano con r, y ningún lado del
                  cuadrado va por ella. D₁ está en la paralela a r₁ que pasa por J.
                ejemplo: solucion.Ds1
              - si: '!en_recta(solucion.perpD)'
                mensaje: |
                  D₁ vuelve por la **perpendicular a la charnela que pasa por D₀**.
                ejemplo: 'uno(medir_sobre(solucion.lJ, desde: proy_planta(solucion.D), distancia: mm(6)), 1)'
              - si: '!en_recta(solucion.lJ)'
                mensaje: |
                  D no está en r ni en s: hace falta una recta del plano que pase por él. La de CD sirve: es
                  paralela a r, y corta la charnela en J, donde D₀C₀ la corta, porque J no se mueve. D₁ va en
                  la **paralela a r₁ por J**.
                ejemplo: 'uno(medir_sobre(solucion.perpD, desde: proy_planta(solucion.D), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  D₁ está donde la perpendicular a la charnela por D₀ corta la paralela a r₁ por J.
          - nombre: C1
            pide: el vértice C, desabatido, en la planta
            es: proy_planta(solucion.C)
            bien: |
              C₁ está en la perpendicular a la charnela que pasa por C₀ y en la paralela a r₁ por J, como D₁:
              C₁D₁ es paralela a A₁B₁.
            diagnosticos:
              - si: '!en_recta(solucion.perpC)'
                mensaje: |
                  C₁ vuelve por la **perpendicular a la charnela que pasa por C₀**. C está más bajo que la
                  charnela, así que C₁ queda al otro lado de ella que A₁, B₁ y D₁.
                ejemplo: 'uno(medir_sobre(solucion.lJ, desde: proy_planta(solucion.C), distancia: mm(6)), 2)'
              - si: '!en_recta(solucion.lJ)'
                mensaje: |
                  C₁ va en la **paralela a r₁ por J**, la planta de la recta CD, como D₁.
                ejemplo: 'uno(medir_sobre(solucion.perpC, desde: proy_planta(solucion.C), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  C₁ está donde la perpendicular a la charnela por C₀ corta la paralela a r₁ por J.
          - nombre: B2
            pide: el vértice B, en el alzado
            es: proy_alzado(solucion.B)
            bien: |
              B₂ está en r₂, en la vertical de B₁.
            diagnosticos:
              - si: '!en_vertical_de(B1)'
                mensaje: |
                  B₂ va en la **vertical de B₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.B), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  B está en r: B₂ va donde la vertical de B₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.B), dy: mm(6))'
              - si: siempre
                mensaje: |
                  B₂ está en la vertical de B₁, sobre r₂.
          - nombre: D2
            pide: el vértice D, en el alzado
            es: proy_alzado(solucion.D)
            bien: |
              D₂ está en la vertical de D₁ y en la paralela a r₂ por J₂, el alzado de la recta CD.
            diagnosticos:
              - si: '!en_vertical_de(D1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.D), dx: mm(6))'
              - si: '!en_recta(solucion.lJ2)'
                mensaje: |
                  D₂ va en la **paralela a r₂ por J₂**: J está en la charnela, así que J₂ está en la
                  horizontal de S₂, y la recta CD es paralela a r también en el alzado.
                ejemplo: 'desplaza(proy_alzado(solucion.D), dy: mm(6))'
              - si: siempre
                mensaje: |
                  D₂ está donde la vertical de D₁ corta la paralela a r₂ por J₂.
          - nombre: C2
            pide: el vértice C, en el alzado
            es: proy_alzado(solucion.C)
            bien: |
              C₂ está en la vertical de C₁, sobre la paralela a r₂ por J₂: es el vértice más bajo, y queda
              por debajo de la horizontal de S₂.
            diagnosticos:
              - si: '!en_vertical_de(C1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.C), dx: mm(6))'
              - si: '!en_recta(solucion.lJ2)'
                mensaje: |
                  C₂ va en la **paralela a r₂ por J₂**, como D₂: C y D están en la misma recta, paralela a r.
                ejemplo: 'desplaza(proy_alzado(solucion.C), dy: mm(6))'
              - si: siempre
                mensaje: |
                  C₂ está donde la vertical de C₁ corta la paralela a r₂ por J₂.
        trazado:
          - segmento2(solucion.R1, solucion.S1)
          - segmento2(solucion.M, proy_planta(solucion.A_ab))
          - segmento2(solucion.R1, proy_planta(solucion.A_ab))
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.B_ab))
          - segmento2(proy_planta(solucion.B_ab), proy_planta(solucion.C_ab))
          - segmento2(proy_planta(solucion.C_ab), proy_planta(solucion.D_ab))
          - segmento2(proy_planta(solucion.D_ab), proy_planta(solucion.A_ab))
          - segmento2(proy_planta(solucion.B), proy_planta(solucion.C))
          - segmento2(proy_planta(solucion.C), proy_planta(solucion.D))
          - segmento2(proy_planta(solucion.D), figura.punto("A1"))
          - segmento2(proy_alzado(solucion.B), proy_alzado(solucion.C))
          - segmento2(proy_alzado(solucion.C), proy_alzado(solucion.D))
          - segmento2(proy_alzado(solucion.D), figura.punto("A2"))
        bloques:
          - nombre: Abatimiento con la horizontal por S
            explica: |
              El enunciado no da método ni charnela: abatir, dibujar y desabatir con la horizontal
              por S es elección nuestra. El plano gira alrededor de esa horizontal hasta quedar
              horizontal, y en la planta el cuadrado se dibuja sin acortar, con su lado de 40 mm y
              sus ángulos rectos. A gira en un plano vertical, perpendicular a la charnela, con un
              radio que es la hipotenusa de lo que A₁ dista de ella y de lo que A está más alto que
              ella. Al
              [desabatir](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir),
              cada vértice vuelve por la perpendicular a la charnela hasta su recta: B a r₁, y C y D
              a la planta de CD, paralela a r₁ por J, que no se mueve. Los alzados salen después con
              rectas del plano, como en el tema 2.
        construccion:
          - con: marca
            traza: figura.punto("S2")
            bloque: Abatimiento con la horizontal por S
            porque: |
              S₂ (nombre nuestro), el extremo de abajo de s₂, junto a su rótulo: el punto de partida de la
              charnela. Va sin rótulo para no pisar el de s₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("S2"), solucion.h2mas)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por S₂, la horizontal hacia la izquierda, hasta pasar r₂: es el alzado de una horizontal del
              plano, la que será la charnela. Corta r₂ casi en su extremo.
          - con: marca
            traza: solucion.R2
            rotulo: R₂
            bloque: Abatimiento con la horizontal por S
            porque: |
              R₂ (nombre nuestro), donde la horizontal de S₂ corta r₂, a 1 mm del extremo: R es el punto de r
              que tiene la cota de S.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.N2mas)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por A₂, la vertical hasta la horizontal de S₂: ese trozo es lo que A está más alto que la
              charnela, un cateto del triángulo del radio.
          - con: marca
            traza: solucion.N2
            rotulo: N₂
            bloque: Abatimiento con la horizontal por S
            porque: |
              N₂ (nombre nuestro), donde la vertical de A₂ corta la horizontal de S₂: A₂N₂ mide 32,6 mm.
          - con: escuadra-cartabon
            traza: segmento2(solucion.R2, solucion.R1mas)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por R₂, la vertical hasta r₁: R está en r, y su planta cae en r₁.
          - con: marca
            traza: solucion.R1
            bloque: Abatimiento con la horizontal por S
            porque: |
              R₁, donde la vertical de R₂ corta r₁, a 1 mm del extremo de r₁. Va sin rótulo, porque B₁ caerá
              encima de él.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("S2"), solucion.S1mas)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por S₂, la vertical hasta s₁: S está en s, y su planta cae en s₁.
          - con: marca
            traza: solucion.S1
            bloque: Abatimiento con la horizontal por S
            porque: |
              S₁, donde la vertical de S₂ corta s₁, casi en su extremo. Sin rótulo, para no pisar el de s₁.
          - con: regla
            traza: '[segmento2(solucion.R1, solucion.chI), segmento2(solucion.R1, solucion.chD)]'
            rotulo: charnela
            bloque: Abatimiento con la horizontal por S
            porque: |
              La **charnela**, R₁S₁, la planta de la horizontal por S, prolongada con la regla hacia los dos
              lados: el plano se abatirá sobre el plano horizontal que la contiene, girando alrededor de ella.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.A0mas)
            guia: solucion.ch
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por A₁, la **perpendicular a la charnela**, larga, cruzándola: al abatir, A gira alrededor de la
              charnela en un plano perpendicular a ella, que es vertical, y en la planta se mueve por esta
              recta.
          - con: marca
            traza: solucion.M
            rotulo: M
            bloque: Abatimiento con la horizontal por S
            porque: |
              M (nombre nuestro), donde la perpendicular por A₁ corta la charnela: el centro del giro de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.Tmas)
            guia: solucion.ch
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por A₁, la paralela a la charnela, hacia la derecha, para el triángulo del radio, rectángulo en
              A₁.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.T, desde: desplaza(solucion.T, dx: 2.52, dy: -5.44), hasta: desplaza(solucion.T, dx: -2.52, dy: 5.44))'
            toma: segmento2(figura.punto("A2"), solucion.N2)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Con el compás, en el alzado, A₂N₂, **lo que A está más alto que la charnela**. Se lleva desde A₁
              sobre la paralela.
          - con: marca
            traza: solucion.T
            rotulo: T
            bloque: Abatimiento con la horizontal por S
            porque: |
              T (nombre nuestro), donde el arco corta la paralela: A₁T es la cota de A sobre la charnela, y
              A₁M, el otro cateto.
          - con: regla
            traza: segmento2(solucion.M, solucion.T)
            rotulo: radio
            bloque: Abatimiento con la horizontal por S
            porque: |
              La hipotenusa, de M a T, es la **distancia real de A a la charnela**: el radio con que A se
              abate, 39,2 mm. El ángulo que forma en M con MA₁ es el del plano con el plano horizontal.
          - con: compas
            traza: 'arco(solucion.M, por: solucion.A0c, desde: desplaza(solucion.A0c, dx: 5.44, dy: 2.52), hasta: desplaza(solucion.A0c, dx: -5.44, dy: -2.52))'
            toma: segmento2(solucion.M, solucion.T)
            bloque: Abatimiento con la horizontal por S
            porque: |
              Con centro en M, que está en la charnela, y radio MT, el arco que corta la perpendicular al otro
              lado de la charnela: A cae al plano horizontal de la charnela girando alrededor de ella.
          - con: marca
            traza: solucion.A0c
            rotulo: A₀
            bloque: Abatimiento con la horizontal por S
            porque: |
              A₀, donde el arco de centro M corta la perpendicular por A₁, debajo de la planta: A abatido. Del
              lado de A₁ también valdría, con todo lo demás al mismo lado.
          - con: regla
            traza: solucion.r0
            rotulo: r₀
            bloque: Abatimiento con la horizontal por S
            porque: |
              r₀, la recta r abatida: de R₁, que está en la charnela y no se mueve, a A₀. B₀ caerá entre los
              dos.
          - con: escuadra-cartabon
            traza: segmento2(solucion.A0c, solucion.D0mas)
            guia: solucion.r0
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por A₀, la **perpendicular a r₀**, hacia la charnela: AD es el otro lado que sale de A, y forma
              un ángulo recto con AB. Va hacia la charnela porque D está más bajo que A.
          - con: compas
            traza: 'arco(solucion.A0c, por: solucion.B0c, desde: desplaza(solucion.B0c, dx: -7.91, dy: 1.2), hasta: desplaza(solucion.D0c, dx: 1.2, dy: 7.91))'
            bloque: Abatimiento con la horizontal por S
            porque: |
              Con el compás abierto 40 mm sobre la regla, el lado del cuadrado, y centro en A₀, un cuarto de
              vuelta de r₀ a la perpendicular: abatido, el plano está en verdadera magnitud y el lado se lleva
              tal cual.
          - con: marca
            traza: solucion.B0c
            rotulo: B₀
            bloque: Abatimiento con la horizontal por S
            porque: |
              B₀, donde el arco corta r₀, del lado de R₁: B baja por r desde A.
          - con: marca
            traza: solucion.D0c
            rotulo: D₀
            bloque: Abatimiento con la horizontal por S
            porque: |
              D₀, donde el arco corta la perpendicular a r₀ por A₀.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B0c, solucion.C0masB)
            guia: solucion.r0
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por B₀, la perpendicular a r₀: BC es el lado opuesto a AD. Cruza s₁ poco antes de C₀.
          - con: escuadra-cartabon
            traza: segmento2(solucion.D0c, solucion.C0masD)
            guia: solucion.r0
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por D₀, la paralela a r₀: CD es el lado opuesto a AB. Cruza la charnela por el camino.
          - con: marca
            traza: solucion.C0c
            rotulo: C₀
            bloque: Abatimiento con la horizontal por S
            porque: |
              C₀, donde se cortan las dos últimas rectas, a 2 mm de s₁: A₀B₀C₀D₀ es el cuadrado en verdadera
              magnitud.
          - con: marca
            traza: solucion.J1
            rotulo: J
            bloque: Abatimiento con la horizontal por S
            porque: |
              J (nombre nuestro), donde D₀C₀ corta la charnela. Es un punto de la recta CD que no se mueve al
              abatir: abatida o no, la recta CD pasa por J.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B0c, solucion.B1mas), segmento2(solucion.D0c, solucion.D1mas), segmento2(solucion.C0c, solucion.C1mas)]'
            guia: solucion.ch
            bloque: Abatimiento con la horizontal por S
            porque: |
              Se desabate por el mismo camino: desde B₀, D₀ y C₀, las perpendiculares a la charnela. Con el
              cuadrado abatido debajo de la planta, las tres cruzan la charnela: B y D están por encima de
              ella y se han abatido al otro lado, con A₀, y C, que está por debajo, al revés. La de B₀ para en
              r₁, porque B está en r; las de D₀ y C₀ siguen hacia la planta.
          - con: marca
            traza: proy_planta(solucion.B)
            rotulo: B₁
            bloque: Abatimiento con la horizontal por S
            porque: |
              B₁, donde la perpendicular de B₀ corta r₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.J1, solucion.lJi), segmento2(solucion.J1, solucion.lJd)]'
            guia: figura.segmento("r1")
            bloque: Abatimiento con la horizontal por S
            porque: |
              Por J, la **paralela a r₁**: es la planta de la recta CD, que es paralela a AB, es decir, a r, y
              pasa por J. Es la afinidad: una recta y su abatida se cortan en la charnela.
          - con: marca
            traza: proy_planta(solucion.D)
            rotulo: D₁
            bloque: Abatimiento con la horizontal por S
            porque: |
              D₁, donde la perpendicular de D₀ corta la paralela a r₁ por J.
          - con: marca
            traza: proy_planta(solucion.C)
            rotulo: C₁
            bloque: Abatimiento con la horizontal por S
            porque: |
              C₁, donde la perpendicular de C₀ corta la paralela a r₁ por J.
          - con: escuadra-cartabon
            traza: segmento2(solucion.J1, solucion.J2mas)
            porque: |
              Por J, la vertical hasta la horizontal de S₂: J está en la charnela, y su alzado cae en el de la
              charnela.
          - con: marca
            traza: solucion.J2
            rotulo: J₂
            porque: |
              J₂, donde la vertical de J corta la horizontal de S₂.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.J2, solucion.lJ2i), segmento2(solucion.J2, solucion.lJ2d)]'
            guia: figura.segmento("r2")
            porque: |
              Por J₂, la paralela a r₂: el alzado de la recta CD, que es paralela a r también en el alzado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.B), solucion.B2mas), segmento2(proy_planta(solucion.D), solucion.D2mas), segmento2(proy_planta(solucion.C), solucion.C2mas)]'
            porque: |
              Los alzados, por las verticales de B₁, D₁ y C₁: la de B₁ hasta r₂, y las de D₁ y C₁ hasta la
              paralela a r₂ por J₂.
          - con: marca
            traza: proy_alzado(solucion.B)
            rotulo: B₂
            porque: |
              B₂, donde la vertical de B₁ corta r₂.
          - con: marca
            traza: proy_alzado(solucion.D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta la paralela a r₂ por J₂.
          - con: marca
            traza: proy_alzado(solucion.C)
            rotulo: C₂
            porque: |
              C₂, donde la vertical de C₁ corta la paralela a r₂ por J₂, debajo de la horizontal de S₂: C es
              el vértice más bajo.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.B), proy_planta(solucion.C)), segmento2(proy_planta(solucion.D), figura.punto("A1")), segmento2(proy_alzado(solucion.B), proy_alzado(solucion.C)), segmento2(proy_alzado(solucion.D), figura.punto("A2"))]'
            porque: |
              Los lados BC y DA en las dos vistas; AB va sobre r, y CD sobre las paralelas por J y J₂.
              A₁B₁C₁D₁ y A₂B₂C₂D₂ son las proyecciones del cuadrado.
        pista: |
          (1) La horizontal de S₂ corta r₂ en R₂; R₁S₁ es la charnela. (2) Por A₁, la perpendicular a la
          charnela, que la corta en M; por A₁, la paralela, con lo que A₂ está por encima de la horizontal de
          S₂: la distancia de M a ese punto es el radio. (3) A₀, con centro en M. (4) r₀ = R₁A₀; B₀ en r₀ a
          40 mm de A₀, y D₀ en la perpendicular por A₀, hacia la charnela; C₀ cierra el cuadrado. (5) Se
          desabate por las perpendiculares a la charnela: B hasta r₁; C y D hasta la paralela a r₁ por J,
          donde D₀C₀ corta la charnela. (6) Los alzados, en r₂ y en la paralela a r₂ por J₂.
        desarrollo: |
          En verde claro, la charnela, el camino de A, r₀, el cuadrado abatido A₀B₀C₀D₀ en verdadera magnitud
          y sus dos proyecciones. La charnela cruza el cuadrado: C está más bajo que ella.

      - tipo: calcular
        titulo: El ángulo del plano con el plano horizontal
        pregunta: ¿Qué ángulo forma el plano de r y s con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '56.41'
          receta: alfa
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '33.59'
            receta: 90 - alfa
            mensaje: |
              Es el **complementario**: el ángulo en T del triángulo del radio, no el de M. El del plano con
              el horizontal es el que forma la hipotenusa MT con el cateto de la planta, MA₁.
          - valor: '44.00'
            receta: angulo_con_ph(r)
            mensaje: |
              Ese es el ángulo de **r** con el plano horizontal. r es una recta del plano, pero no la de
              máxima pendiente, y cualquier otra recta del plano está menos inclinada que el plano.
          - valor: '40.91'
            receta: angulo_con_ph(s)
            mensaje: |
              Ese es el ángulo de **s** con el plano horizontal. Tampoco es la de máxima pendiente: el plano
              está más inclinado que cualquiera de sus rectas que no lo sea. Y por casualidad es también, a
              0,01°, el ángulo del plano con el plano **vertical**, 40,90°: si has medido ese, el error es
              otro, pero la cifra es la misma. El del plano con el horizontal se mide en M.
        pista: |
          Mide con el transportador del Taller, en el paso anterior, el ángulo en M del triángulo del radio
          de A: entre MA₁, en la planta, y la hipotenusa MT.
        desarrollo: |
          El triángulo del radio de A es el de la verdadera magnitud de AM, y AM es una recta de máxima
          pendiente: es perpendicular a la charnela, que es una horizontal del plano. El cateto A₁M es su
          planta y A₁T, lo que sube; por eso su ángulo en M es el del plano con el horizontal:

          $$ \tan\alpha = \frac{\overline{A_1T}}{\overline{A_1M}} = \frac{32{,}64}{21{,}68} \;\Longrightarrow\; \alpha \approx 56{,}41^\circ $$

          En el abatimiento hay dos ángulos que se le parecen por casualidad. r₀ forma con la charnela
          56,51°, a 0,1° de la respuesta: es el ángulo de r con las horizontales del plano, no el del plano
          con el horizontal, y cae dentro de la tolerancia, así que medirlo ahí no se distingue de medirlo
          bien. Y A₀D₀ forma con la charnela 33,49°, casi el complementario. El ángulo del plano se mide en
          M, en el triángulo del radio.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A está en r y es un vértice, así que el lado de r es AB, con B a 40 mm de A hacia donde r baja, porque A es el de mayor cota.
          - texto: Con la horizontal por S de charnela, A se abate con un radio que es la hipotenusa de lo que A₁ dista de la charnela y de lo que A está más alto que ella.
          - texto: En verdadera magnitud, B₀ va en r₀ a 40 mm de A₀, D₀ en la perpendicular a r₀ por A₀, hacia la charnela, y C₀ cierra el cuadrado.
          - texto: Se desabate por las perpendiculares a la charnela; B cae en r₁, y C y D en la paralela a r₁ por J, donde D₀C₀ corta la charnela.
          - texto: El otro lado que sale de A, AD, va sobre s, y D queda en s a 40 mm de A.
            trampa: true
            mensaje: |
              s no lleva ningún lado: solo define el plano con r. r y s forman 71,7°, no 90°, así que un lado
              perpendicular a AB no puede ir por s.
    resolucion: |
      **Qué fija el enunciado.** r y s se cortan en A, y definen el plano. A es un vértice y está en r, así
      que el lado de r es AB, con A en un extremo; como A es el vértice de mayor cota, B está en r a 40 mm,
      hacia donde r baja. D, el otro vértice que forma lado con A, está en la perpendicular a r por A dentro
      del plano, también hacia abajo. Una sola solución. s no lleva ningún lado: forma 71,7° con r.

      **El abatimiento.** La horizontal del plano por S, el extremo de abajo de s₂, corta r₂ en R, a 1 mm de
      su extremo; R₁S₁ es la charnela. A se abate por la perpendicular a la charnela que pasa por A₁, que la
      corta en M, con un radio que es la hipotenusa de lo que A₁ dista de la charnela, 21,68 mm, y de lo
      que A está más alto que ella, 32,64 mm: 39,18 mm. r₀ va de R₁ a A₀. B₀ está en r₀ a 40 mm de A₀; D₀,
      en la perpendicular a r₀ por A₀, del lado de la charnela; C₀ cierra el cuadrado, al otro lado de la
      charnela, porque C está más bajo que ella.

      **La vuelta.** B vuelve por la perpendicular a la charnela hasta r₁. C y D no están en ninguna recta
      dada: la recta CD, paralela a r, corta la charnela en J, donde D₀C₀ la corta, y su planta es la
      paralela a r₁ por J; C₁ y D₁ están en ella. Los alzados, en las verticales: B₂ en r₂, y C₂ y D₂ en la
      paralela a r₂ por J₂.

      **El ángulo.** El triángulo del radio de A da el del plano con el horizontal: 56,41°. r forma 44,00° y
      s, 40,91°: ninguna de las dos es la de máxima pendiente.

  - id: sd12-el-cuadrado-con-ab-sobre-r-y-otro-lado-sobre-s
    titulo: El cuadrado con el lado AB sobre r y otro lado sobre s
    fuente: Ejercicio 10 (SD12) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual (§08). La figura no dibuja s₂: sale
    # de los datos, y es el primer paso. A y B están en r y son los dos
    # vértices de mayor cota, así que AB es un lado (dos vértices opuestos no
    # pueden ser los dos más altos); el otro lado que va sobre s sale de A,
    # porque s corta r en A, y es AD, perpendicular a AB. Como r es frontal, el
    # ángulo recto se ve en el alzado: s₂ es la perpendicular a r₂ por A₂.
    # «El plano proyectante vertical» se lee como el plano vertical de
    # proyección: A y B, los de menor alejamiento. Con la otra lectura posible
    # (el plano de canto que contiene a r) A y B están a distancia cero y la
    # frase no elige nada; con las dos, el cuadrado es el mismo, porque D tiene
    # que bajar desde A, y bajando por s también se aleja. Una sola posición.
    # El método no lo impone: un giro de eje vertical por A, que deja s frontal.
    enunciado: |
      Dibujar las proyecciones diédricas de un cuadrado contenido en el plano definido por las rectas r
      y s. Datos: los puntos A y B son los vértices de mayor cota y los que se sitúan a menor distancia
      del plano proyectante vertical, otro lado del cuadrado se sitúa sobre la recta s.

      **Notas nuestras.** La figura es la recta r, con las cruces de B₂ y A₂ en el alzado, arriba, y las de
      B₁ y A₁ en la planta, debajo, y s₁, que sale de A₁ hacia abajo a la izquierda. La hoja no da
      escala: la leemos a 1:1, en milímetros de la lámina. r₁ es
      horizontal en el papel: r es una recta frontal. La figura no dibuja s₂, que sale de los datos.
      Llamamos D al vértice que forma lado con A sobre s, C al cuarto y K al punto de s que tiene la cota
      de B.
    pide: El alzado de s y las proyecciones de los vértices C y D del cuadrado, y, como pregunta nuestra, la medida real de su lado.
    receta:
      lamina: sd12
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
      solucion:
        # s pasa por A y es perpendicular a r: está en el plano perpendicular a r
        # por A. Con su planta, s₁, queda fijada; Sx es su punto sobre el extremo
        # de s₁. Como r es frontal, su alzado sale perpendicular a r₂.
        perpR: plano_perpendicular_a_recta(A, r)
        Sx: 'punto_en_plano(planta: figura.punto("S1"), plano: perpR)'
        s: recta3(A, Sx)
        rs: plano(A, B, Sx)
        # K, el punto de s con la cota de B: la horizontal de B₂ corta s₂ en K₂.
        Bx: 'punto3(alzado: desplaza(figura.punto("B2"), dx: 50), planta: desplaza(figura.punto("B1"), dx: 50))'
        By: 'punto3(alzado: figura.punto("B2"), planta: desplaza(figura.punto("B1"), dy: 50))'
        cotaB: plano(B, Bx, By)
        K: corte_recta_plano(s, cotaB)
        # El cuadrado: D en s, a AB de A, hacia donde s baja (rama 1, hacia Sx),
        # que es también hacia donde se aleja. Una sola posición; Dmal es el
        # error de llevarlo hacia arriba.
        DD: 'punto_a_distancia(s, desde: A, distancia: vm(A, B))'
        D: rama(DD, 1)
        Dmal: rama(DD, 2)
        C: 'simetrico(A, respecto: punto_medio(segmento3(B, D)))'
        lado_mm: en_mm(vm(A, B))
        # Decisión: el giro de eje vertical por A. K gira en la planta alrededor
        # de A₁ hasta la horizontal que pasa por A₁, que es r₁: s queda frontal y
        # su alzado, en verdadera magnitud. Hacia los dos lados vale: es una
        # elección, y la primera marca fija el lado. Rama 1, hacia la izquierda
        # (K₁′ entre B₁ y A₁), la de la construcción. Ka es el punto del eje a la
        # cota de K, el centro del giro; la recta de Ka a B es la horizontal de
        # alejamiento el de A por la que se mueve K.
        Ka: 'punto3(alzado: pie_perpendicular(figura.punto("A2"), segmento2(figura.punto("B2"), proy_alzado(K))), planta: figura.punto("A1"))'
        rK: vm_planta(A, K)
        Kg: 'punto_a_distancia(recta3(Ka, B), desde: Ka, distancia: rK)'
        # D girado: en la recta AK girada, al otro lado de A, con la cota de D,
        # porque el giro no cambia cotas.
        Dx: 'punto3(alzado: desplaza(proy_alzado(D), dx: 50), planta: desplaza(proy_planta(D), dx: 50))'
        Dy: 'punto3(alzado: proy_alzado(D), planta: desplaza(proy_planta(D), dy: 50))'
        cotaD: plano(D, Dx, Dy)
        Dg: corte_recta_plano(recta3(A, Kg), cotaD)
        # La construcción, en la rama 1.
        K2p: proy_alzado(K)
        K1p: proy_planta(K)
        D2p: proy_alzado(D)
        Kgc: proy_planta(rama(Kg, 1))
        K2gc: proy_alzado(rama(Kg, 1))
        Dgc: proy_alzado(rama(Dg, 1))
        s2l: 'perpendicular(por: figura.punto("A2"), a: figura.segmento("r2"))'
        lD2: 'perpendicular(por: D2p, a: perpendicular(por: D2p, a: figura.segmento("r2")))'
        lB2: 'perpendicular(por: figura.punto("B2"), a: figura.segmento("r2"))'
        hD1: 'perpendicular(por: proy_planta(D), a: perpendicular(por: proy_planta(D), a: figura.segmento("r1")))'
        s2top: 'uno(medir_sobre(segmento2(figura.punto("A2"), K2p), desde: K2p, distancia: 10), 1)'
        s2bot: 'uno(medir_sobre(segmento2(figura.punto("A2"), D2p), desde: D2p, distancia: 10), 1)'
        hBmas: 'uno(medir_sobre(segmento2(figura.punto("B2"), K2p), desde: K2p, distancia: 10), 1)'
        K1mas: 'uno(medir_sobre(segmento2(figura.punto("A1"), K1p), desde: K1p, distancia: 10), 1)'
        K1vmas: 'uno(medir_sobre(segmento2(K2p, K1p), desde: K1p, distancia: 8), 1)'
        K2gmas: 'uno(medir_sobre(segmento2(Kgc, K2gc), desde: K2gc, distancia: 8), 1)'
        sgmas: 'uno(medir_sobre(segmento2(K2gc, Dgc), desde: Dgc, distancia: 10), 1)'
        hDmas: 'uno(medir_sobre(segmento2(Dgc, D2p), desde: D2p, distancia: 10), 1)'
        C2masD: 'uno(medir_sobre(lD2, desde: proy_alzado(C), distancia: 8), 1)'
        C2masB: 'uno(medir_sobre(lB2, desde: proy_alzado(C), distancia: 8), 1)'
        D1mas: 'uno(medir_sobre(segmento2(D2p, proy_planta(D)), desde: proy_planta(D), distancia: 8), 1)'
        C1masD: 'uno(medir_sobre(hD1, desde: proy_planta(C), distancia: 8), 1)'
        C1masV: 'uno(medir_sobre(segmento2(proy_alzado(C), proy_planta(C)), desde: proy_planta(C), distancia: 8), 1)'
        # Los errores. K₂ con s₂ paralela a s₁, o perpendicular a r₁ (vertical).
        Kpar: 'desplaza(figura.punto("A2"), dx: 70.81, dy: -59.4)'
        Kvert: 'pie_perpendicular(figura.punto("A2"), segmento2(figura.punto("B2"), K2p))'
        # D₂′ hacia el lado de K₂′ (D por encima de A), o llevando A₁B₁, la
        # planta de AB, en vez de A₂B₂.
        Dmx: 'punto3(alzado: desplaza(proy_alzado(Dmal), dx: 50), planta: desplaza(proy_planta(Dmal), dx: 50))'
        Dmy: 'punto3(alzado: proy_alzado(Dmal), planta: desplaza(proy_planta(Dmal), dy: 50))'
        Dgmal: proy_alzado(corte_recta_plano(recta3(A, Kg), plano(Dmal, Dmx, Dmy)))
        DgA1B1: 'uno(medir_sobre(segmento2(proy_alzado(Kg), figura.punto("A2")), desde: figura.punto("A2"), distancia: vm_planta(A, B)), 1)'
        # D₂ llevando A₂B₂ sobre s₂, sin girar.
        D2s2: 'uno(medir_sobre(segmento2(figura.punto("A2"), D2p), desde: figura.punto("A2"), distancia: vm(A, B)), 1)'
        # D₁ parado en r₁: la vertical de D₂ la cruza antes de llegar a s₁.
        D1r1: pie_perpendicular(D2p, figura.segmento("r1"))
      comprueba:
        - en_recta(A, r)
        - en_recta(B, r)
        - en_recta(K, s)
        - en_plano(C, rs)
        - en_plano(D, rs)
        # El otro lado que sale de A va por s: s es perpendicular a r.
        - en_recta(D, s)
    pasos:
      - tipo: reconocer
        pregunta: La figura no dibuja s₂. Con los datos, ¿cómo se saca?
        opciones:
          - texto: Es la perpendicular a r₂ por A₂
            correcta: true
            mensaje: |
              Eso es. r y s definen un plano, así que se cortan, y su corte tiene la planta en A₁, donde se
              cortan r₁ y s₁: s pasa por A. AB está en r, y el otro lado que sale de A, AD, está en s: AB y AD
              forman un ángulo recto, así que s es perpendicular a r. Un ángulo recto con un lado paralelo a un plano de
              proyección se ve recto en esa vista, y r es frontal, porque r₁ es horizontal: en el alzado,
              s₂ es perpendicular a r₂ por A₂.
          - texto: Coincide con r₂, porque el plano de r y s es proyectante vertical
            mensaje: |
              Si s₂ coincidiera con r₂, s estaría en el plano de canto que contiene a r. Ahí la única recta
              por A perpendicular a r es de punta, con la planta perpendicular a r₁, y s₁ no lo es: AD no
              podría ir por s. El enunciado habla de un plano proyectante para otra cosa, la distancia de
              los vértices.
          - texto: No se puede sacar, porque falta un dato
            mensaje: |
              El dato está en el enunciado: otro lado del cuadrado va sobre s. Como s corta r en A, ese lado
              es AD, perpendicular a AB, y con r frontal el ángulo recto se ve en el alzado.

      - tipo: construir
        titulo: s₂ por el ángulo recto, y AD en verdadera magnitud con un giro
        intro: |
          Primero s₂: la perpendicular a r₂ por A₂, porque AD es perpendicular a AB y r es frontal. El
          enunciado no impone método para lo demás: lo que haría el alumno es llevar s a verdadera magnitud
          y medir en ella el lado, que es A₂B₂, porque r es frontal. Lo hacemos con un giro de eje vertical
          por A: K, el punto de s que tiene la cota de B (la horizontal de B₂ corta s₂ en K₂), gira en la
          planta alrededor de A₁ hasta r₁, la horizontal de A₁, y s queda frontal. Vale girar hacia
          cualquiera de los dos lados: lo decides tú al marcar K₁′. «El plano proyectante vertical» lo
          leemos como el plano vertical de proyección: A y B son los vértices de menor alejamiento. D
          tiene que bajar desde A, y bajando por s también se aleja, así que las dos condiciones dicen lo
          mismo; con la otra lectura, el plano de canto que contiene a r, A y B están a distancia cero y
          la frase no elige nada. El cuadrado es el mismo. Cerca de D₂ hay dos cruces: la circunferencia de
          radio A₂B₂ con centro en A₂ corta s₂ a 3,3 mm, que es justo el error de no girar, y la vertical de
          K₁′ corta la horizontal de D₂′ a 3,5 mm. Si giras hacia la derecha, K₂′ cae a 4 mm de K₂. Amplía
          con la lupa (×4) antes de marcarlos. Marca K₂, K₁′, K₂′, D₂′ y las dos proyecciones de D y de C.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: K2
            pide: K, el punto de s que tiene la cota de B, en el alzado
            es: solucion.K2p
            bien: |
              K₂ está en la horizontal de B₂ y en s₂, la perpendicular a r₂ por A₂: K está en s, a la altura
              de B.
            diagnosticos:
              - si: cerca_de(solucion.Kpar)
                mensaje: |
                  Has trazado s₂ **paralela a s₁**, y no hay razón para eso: las dos proyecciones de una recta
                  no tienen por qué ser paralelas. s₂ sale del ángulo recto: AD es perpendicular a AB, y como
                  r es frontal, s₂ es perpendicular a r₂.
                ejemplo: solucion.Kpar
              - si: cerca_de(solucion.Kvert)
                mensaje: |
                  Has trazado s₂ perpendicular a **r₁**, vertical. El ángulo recto se ve recto en la vista a
                  la que r es paralela, y r es frontal: paralela al plano vertical, así que se ve en el
                  alzado, y s₂ es perpendicular a **r₂**.
                ejemplo: solucion.Kvert
              - si: '!en_horizontal_de(figura.punto("B2"))'
                mensaje: |
                  K es el punto de s que tiene la cota de B: K₂ está en la **horizontal de B₂**.
                ejemplo: 'desplaza(solucion.K2p, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de B₂, pero no en s₂. s₂ es la perpendicular a r₂ que pasa por A₂, y
                  sube hacia la derecha: K₂ está donde corta la horizontal de B₂.
          - nombre: K1g
            rotulo: K₁′
            pide: K girado alrededor del eje vertical por A, en la planta
            es: proy_planta(solucion.Kg)
            bien: |
              K₁′ está en r₁, la horizontal de A₁, a A₁K₁ de A₁ (15,8 mm): la planta gira alrededor de A₁ sin
              deformarse, y con K₁′ en la horizontal de A₁, AK queda frontal. Vale a los dos lados.
            diagnosticos:
              - si: cerca_de(solucion.K1p)
                mensaje: |
                  Ese es K₁, sin girar. Con el eje vertical por A, K₁ gira alrededor de A₁, con radio A₁K₁,
                  hasta la horizontal que pasa por A₁, que es r₁: ahí s queda frontal.
                ejemplo: solucion.K1p
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  K₁′ va en la **horizontal de A₁**, que es r₁: así la planta de AK′ queda horizontal en el
                  papel, y AK′ es frontal.
                ejemplo: 'desplaza(solucion.Kgc, dy: mm(6))'
              - si: '!a_distancia(de: figura.punto("A1"), d: solucion.rK)'
                mensaje: |
                  K₁′ está a **A₁K₁** de A₁: en un giro de eje vertical la planta gira sin deformarse, y el
                  radio es lo que K₁ dista del eje, A₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: solucion.Kgc, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  K₁′ está en r₁, a A₁K₁ de A₁, a un lado o al otro: el arco de centro A₁ que pasa por K₁.
          - nombre: K2g
            rotulo: K₂′
            pide: K girado, en el alzado
            es: proy_alzado(solucion.Kg)
            bien: |
              K₂′ está en la vertical de K₁′ y en la horizontal de B₂, a la altura de K₂: en un giro de eje
              vertical las cotas no cambian.
            diagnosticos:
              - si: '!en_vertical_de(K1g)'
                mensaje: |
                  K₂′ va en la **vertical de K₁′**: son las dos proyecciones del mismo punto girado.
                ejemplo: 'desplaza(solucion.K2gc, dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("B2"))'
                mensaje: |
                  En un giro de eje vertical **las cotas no cambian**: K₂′ se queda a la altura de K₂, que es
                  la de B₂. En el alzado, K solo se mueve en horizontal.
                ejemplo: 'desplaza(solucion.K2gc, dy: mm(6))'
              - si: siempre
                mensaje: |
                  K₂′ está donde la vertical de K₁′ corta la horizontal de B₂.
          - nombre: D2g
            rotulo: D₂′
            pide: D girado, en el alzado
            es: proy_alzado(solucion.Dg)
            bien: |
              D₂′ está en la recta K₂′A₂, prolongada más allá de A₂, a A₂B₂ de A₂ (41,9 mm): AK′ es frontal y
              se ve en verdadera magnitud, y el lado es A₂B₂, porque r también es frontal.
            diagnosticos:
              - si: cerca_de(solucion.Dgmal)
                mensaje: |
                  Has llevado el lado hacia K₂′, y ahí D quedaría **por encima de A** y más cerca del plano
                  vertical. A y B son los vértices de mayor cota: D baja, y está al otro lado de A₂.
                ejemplo: rama(solucion.Dgmal, 1)
              - si: cerca_de(solucion.DgA1B1)
                mensaje: |
                  Has llevado **A₁B₁**, que es una proyección y acorta. r es frontal: su verdadera magnitud
                  está en el alzado, y el lado es A₂B₂.
                ejemplo: rama(solucion.DgA1B1, 1)
              - si: '!a_distancia(de: figura.punto("A2"), d: vm(A, B))'
                mensaje: |
                  D₂′ está a **A₂B₂** de A₂: AB es un lado, en verdadera magnitud en el alzado porque r es
                  frontal, y AD′ también lo está, porque AK′ es frontal.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.K2gc, solucion.Dgc), desde: solucion.Dgc, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  A la distancia buena de A₂, pero no en la recta K₂′A₂: s girada pasa por A, que está en el
                  eje y no se mueve, y por K′. D₂′ está en ella, al otro lado de A₂.
          - nombre: D2
            pide: el vértice D, en el alzado
            es: proy_alzado(solucion.D)
            bien: |
              D₂ está en s₂, en la horizontal de D₂′: al deshacer el giro, D vuelve a s sin cambiar de cota.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Dmal))
                mensaje: |
                  Ese D está en s₂, pero por encima de A: sale de llevar el lado hacia arriba. A y B son los
                  vértices de mayor cota, y D baja.
                ejemplo: proy_alzado(solucion.Dmal)
              - si: cerca_de(solucion.D2s2)
                mensaje: |
                  Has llevado A₂B₂ **directamente sobre s₂**. s₂ no está en verdadera magnitud: AD se aleja
                  mientras baja, y el alzado lo acorta. Por eso se gira s hasta dejarla frontal y se mide en
                  s₂′; D₂ cae 3 mm más cerca de A₂.
                ejemplo: solucion.D2s2
              - si: '!en_horizontal_de(D2g)'
                mensaje: |
                  Al deshacer el giro, **la cota no cambia**: D₂ está en la horizontal de D₂′.
                ejemplo: 'desplaza(solucion.D2p, dy: mm(6))'
              - si: '!en_recta(solucion.s2l)'
                mensaje: |
                  D está en s: D₂ va **en s₂**, donde la corta la horizontal de D₂′.
                ejemplo: 'desplaza(solucion.D2p, dx: mm(6))'
              - si: siempre
                mensaje: |
                  D₂ está donde la horizontal de D₂′ corta s₂.
          - nombre: C2
            pide: el vértice C, en el alzado
            es: proy_alzado(solucion.C)
            bien: |
              C₂ está en la paralela a r₂ por D₂ y en la perpendicular a r₂ por B₂: CD es paralela a AB, y BC
              a AD. A₂B₂C₂D₂ es un rectángulo, porque r es frontal y el ángulo recto se ve en el alzado.
            diagnosticos:
              - si: '!en_recta(solucion.lD2)'
                mensaje: |
                  CD es el lado opuesto a AB: C₂ está en la **paralela a r₂ por D₂**.
                ejemplo: 'uno(medir_sobre(solucion.lB2, desde: proy_alzado(solucion.C), distancia: mm(6)), 1)'
              - si: '!en_recta(solucion.lB2)'
                mensaje: |
                  BC es el lado opuesto a AD, perpendicular a AB: C₂ está en la **perpendicular a r₂ por B₂**,
                  paralela a s₂.
                ejemplo: 'uno(medir_sobre(solucion.lD2, desde: proy_alzado(solucion.C), distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  C₂ está donde la paralela a r₂ por D₂ corta la perpendicular a r₂ por B₂.
          - nombre: D1
            pide: el vértice D, en la planta
            es: proy_planta(solucion.D)
            bien: |
              D₁ está en s₁, en la vertical de D₂. Por el camino, la vertical cruza r₁: D está en s, y hay que
              seguir.
            diagnosticos:
              - si: cerca_de(solucion.D1r1)
                mensaje: |
                  Te has parado en r₁. La vertical de D₂ cruza r₁ antes de llegar a s₁, pero D está en s: sigue
                  hasta s₁.
                ejemplo: solucion.D1r1
              - si: '!en_vertical_de(D2)'
                mensaje: |
                  D₁ va en la **vertical de D₂**.
                ejemplo: 'desplaza(proy_planta(solucion.D), dx: mm(6))'
              - si: '!en_recta(figura.segmento("s1"))'
                mensaje: |
                  D está en s: D₁ va **en s₁**, donde la corta la vertical de D₂.
                ejemplo: 'desplaza(proy_planta(solucion.D), dy: mm(6))'
              - si: siempre
                mensaje: |
                  D₁ está donde la vertical de D₂ corta s₁.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(solucion.C)
            bien: |
              C₁ está en la vertical de C₂ y en la horizontal de D₁: CD es frontal, como AB, y C y D tienen el
              mismo alejamiento.
            diagnosticos:
              - si: '!en_vertical_de(C2)'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(solucion.C), dx: mm(6))'
              - si: '!en_horizontal_de(D1)'
                mensaje: |
                  CD es paralela a AB, que es frontal: C y D tienen el **mismo alejamiento**, y C₁ está en la
                  horizontal de D₁, paralela a r₁.
                ejemplo: 'desplaza(proy_planta(solucion.C), dy: mm(6))'
              - si: siempre
                mensaje: |
                  C₁ está donde la vertical de C₂ corta la horizontal de D₁.
        trazado:
          - segmento2(solucion.K2p, solucion.D2p)
          - segmento2(proy_alzado(solucion.Kg), proy_alzado(solucion.Dg))
          - segmento2(figura.punto("A2"), solucion.D2p)
          - segmento2(solucion.D2p, proy_alzado(solucion.C))
          - segmento2(proy_alzado(solucion.C), figura.punto("B2"))
          - segmento2(proy_planta(solucion.D), proy_planta(solucion.C))
          - segmento2(proy_planta(solucion.C), figura.punto("B1"))
        bloques:
          - nombre: Giro de eje vertical por A
            explica: |
              El enunciado no impone método; el
              [giro](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-giro-mover-la-figura)
              es elección nuestra. Para llevar el lado sobre s hay que verla en verdadera magnitud,
              y eso pasa si es frontal: con un eje vertical por A, lo es cuando su planta cae sobre
              r₁, la horizontal de A₁. La planta gira alrededor de A₁ sin deformarse y las cotas se
              quedan: en el alzado K solo se mueve en horizontal, y A, en el eje, no se mueve. En
              s₂′ se lleva el lado, A₂B₂ (r es frontal), y al deshacer el giro D₂ vuelve a s₂ por su
              horizontal, sin cambiar de cota.
        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), solucion.s2top), segmento2(figura.punto("A2"), solucion.s2bot)]'
            guia: figura.segmento("r2")
            rotulo: s₂
            porque: |
              s₂, la **perpendicular a r₂ por A₂**, larga hacia los dos lados. AB está en r y AD en s, y forman
              un ángulo recto; como AB es frontal, el ángulo recto se ve recto en el alzado.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.hBmas)
            porque: |
              Por B₂, la horizontal hasta pasar s₂: hace falta otro punto de s, además de A, con sus dos
              proyecciones, y el de la cota de B es fácil de sacar.
          - con: marca
            traza: solucion.K2p
            rotulo: K₂
            porque: |
              K₂ (nombre nuestro), donde la horizontal de B₂ corta s₂: K es el punto de s que tiene la cota de
              B.
          - con: regla
            traza: segmento2(figura.punto("A1"), solucion.K1mas)
            porque: |
              s₁, prolongada con la regla más allá de A₁, hacia arriba a la derecha: K está más alto que A, al
              otro lado de A que el trozo dibujado.
          - con: escuadra-cartabon
            traza: segmento2(solucion.K2p, solucion.K1vmas)
            porque: |
              Por K₂, la vertical hasta s₁ prolongada: K está en s, y su planta cae en s₁. Cruza r₂ por el
              camino.
          - con: marca
            traza: solucion.K1p
            rotulo: K₁
            porque: |
              K₁, donde la vertical de K₂ corta s₁ prolongada.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.K1p, desde: solucion.K1p, hasta: desplaza(solucion.Kgc, dx: 0.24, dy: 4.68))'
            bloque: Giro de eje vertical por A
            porque: |
              El giro, con el eje vertical por A: con centro en A₁ y radio A₁K₁, el arco desde K₁ hasta pasar
              r₁, la horizontal de A₁. La planta gira alrededor de A₁ sin deformarse.
          - con: marca
            traza: solucion.Kgc
            rotulo: K₁′
            bloque: Giro de eje vertical por A
            porque: |
              K₁′, donde el arco corta r₁, entre B₁ y A₁: con K₁′ en la horizontal de A₁, la recta AK′ es
              frontal. Al otro lado de A₁ también valdría.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Kgc, solucion.K2gmas)
            bloque: Giro de eje vertical por A
            porque: |
              Por K₁′, la vertical hasta la horizontal de B₂: en un giro de eje vertical las cotas no cambian, y
              K₂′ se queda a la altura de K₂.
          - con: marca
            traza: solucion.K2gc
            rotulo: K₂′
            bloque: Giro de eje vertical por A
            porque: |
              K₂′, donde la vertical de K₁′ corta la horizontal de B₂.
          - con: regla
            traza: segmento2(solucion.K2gc, solucion.sgmas)
            rotulo: s₂′
            bloque: Giro de eje vertical por A
            porque: |
              s₂′, la recta de K₂′ a A₂, prolongada más allá de A₂: s girada, frontal, y por eso en verdadera
              magnitud en el alzado. A está en el eje y no se mueve.
          - con: compas
            traza: 'arco(figura.punto("A2"), por: solucion.Dgc, desde: desplaza(solucion.Dgc, dx: 4.79, dy: -3.61), hasta: desplaza(solucion.Dgc, dx: -4.79, dy: 3.61))'
            toma: segmento2(figura.punto("B2"), figura.punto("A2"))
            bloque: Giro de eje vertical por A
            porque: |
              Con el compás, A₂B₂, el lado en verdadera magnitud, porque r es frontal. Con centro en A₂, el arco
              que corta s₂′ al otro lado de A₂ que K₂′: D está más bajo que A.
          - con: marca
            traza: solucion.Dgc
            rotulo: D₂′
            bloque: Giro de eje vertical por A
            porque: |
              D₂′, donde el arco corta s₂′ por debajo de A₂: D girado.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Dgc, solucion.hDmas)
            bloque: Giro de eje vertical por A
            porque: |
              Se deshace el giro: por D₂′, la horizontal hasta pasar s₂. D vuelve a s sin cambiar de cota.
          - con: marca
            traza: solucion.D2p
            rotulo: D₂
            bloque: Giro de eje vertical por A
            porque: |
              D₂, donde la horizontal de D₂′ corta s₂.
          - con: escuadra-cartabon
            traza: segmento2(solucion.D2p, solucion.C2masD)
            guia: figura.segmento("r2")
            porque: |
              Por D₂, la paralela a r₂, hacia la izquierda: CD es el lado opuesto a AB.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.C2masB)
            guia: figura.segmento("r2")
            porque: |
              Por B₂, la perpendicular a r₂, paralela a s₂: BC es el lado opuesto a AD, y el ángulo recto en B
              también se ve recto en el alzado.
          - con: marca
            traza: proy_alzado(solucion.C)
            rotulo: C₂
            porque: |
              C₂, donde se cortan las dos últimas rectas, a la izquierda de B₂.
          - con: escuadra-cartabon
            traza: segmento2(solucion.D2p, solucion.D1mas)
            porque: |
              Por D₂, la vertical hasta s₁: cruza r₁ por el camino, pero D está en s.
          - con: marca
            traza: proy_planta(solucion.D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta s₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.D), solucion.C1masD)
            guia: figura.segmento("r1")
            porque: |
              Por D₁, la paralela a r₁, horizontal: CD es frontal como AB, y C tiene el alejamiento de D.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.C), solucion.C1masV)
            porque: |
              Por C₂, la vertical hasta la horizontal de D₁.
          - con: marca
            traza: proy_planta(solucion.C)
            rotulo: C₁
            porque: |
              C₁, donde la vertical de C₂ corta la horizontal de D₁.
          - con: regla
            traza: segmento2(figura.punto("B1"), proy_planta(solucion.C))
            porque: |
              B₁C₁, el lado que falta en la planta; A₁D₁ está en s₁, C₁D₁ en la horizontal de D₁ y A₁B₁ en r₁.
              En el alzado ya están los cuatro.
        pista: |
          (1) s₂, perpendicular a r₂ por A₂. (2) La horizontal de B₂ corta s₂ en K₂; K₁, en s₁ prolongada. (3)
          Con centro en A₁, K₁ gira hasta r₁: K₁′; K₂′, en su vertical, a la altura de K₂. (4) En K₂′A₂
          prolongada, A₂B₂ desde A₂, al otro lado: D₂′. (5) La horizontal de D₂′ corta s₂ en D₂. (6) C₂, con
          la paralela a r₂ por D₂ y la perpendicular por B₂. (7) D₁ en s₁; C₁ en la horizontal de D₁.
        desarrollo: |
          En verde claro, s₂, la recta girada K₂′D₂′ en verdadera magnitud y las dos proyecciones del
          cuadrado. A₂B₂C₂D₂ es un rectángulo, porque AB es frontal y el ángulo recto se ve en el alzado;
          A₁B₁C₁D₁, un paralelogramo con dos lados horizontales, porque AB y CD son frontales.

      - tipo: calcular
        titulo: El lado del cuadrado
        pregunta: ¿Cuánto mide de verdad el lado del cuadrado?
        respuesta:
          tipo: numero
          valor: '41.90'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '36.28'
            receta: en_mm(vm_planta(A, B))
            mensaje: |
              Eso es **A₁B₁ en la planta**, que acorta: AB sube de A a B. r es frontal, y su verdadera
              magnitud está en el alzado, A₂B₂.
          - valor: '38.63'
            receta: en_mm(vm_alzado(A, D))
            mensaje: |
              Eso es **A₂D₂ en el alzado**. AD no es frontal: se aleja mientras baja, y el alzado lo acorta. El
              lado en verdadera magnitud es A₂B₂, o A₂D₂′ tras el giro.
          - valor: '25.22'
            receta: en_mm(vm_planta(A, D))
            mensaje: |
              Eso es **A₁D₁ en la planta**, que acorta todavía más: AD baja 33,5 mm.
        pista: |
          Mide A₂B₂ con «medir» del Taller, o en tu lámina: r es frontal, y el alzado la da en verdadera
          magnitud.
        desarrollo: |
          AB está en r, que es frontal, y el alzado lo da en verdadera magnitud:

          $$ \overline{AB} = \overline{A_2B_2} = \sqrt{102{,}84^{2} + 59{,}40^{2}}\ \text{pt} \approx 41{,}90 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A y B son los dos vértices de mayor cota y están en r, así que AB es un lado, y r es frontal, porque r₁ es horizontal.
          - texto: s corta r en A, así que el otro lado que va sobre s es AD, perpendicular a AB; como r es frontal, s₂ es la perpendicular a r₂ por A₂.
          - texto: Con un giro de eje vertical por A, s queda frontal, y en ella se lleva A₂B₂ desde A₂, hacia donde s baja, porque A y B son los de mayor cota.
          - texto: Se deshace el giro sin cambiar la cota; C sale con las paralelas a los lados, y C₁D₁ es horizontal, porque CD es frontal.
          - texto: El plano de r y s es proyectante vertical, así que s₂ coincide con r₂.
            trampa: true
            mensaje: |
              Si s₂ coincidiera con r₂, la única recta del plano por A perpendicular a r sería de punta, y s₁
              no es perpendicular a r₁: AD no podría ir por s. s₂ es la perpendicular a r₂ por A₂.
    resolucion: |
      **Qué fija el enunciado.** A y B están en r, y son los dos vértices de mayor cota: AB es un lado, porque
      dos vértices opuestos no pueden ser los dos más altos. r₁ es horizontal, así que r es frontal, y AB
      mide en el alzado lo que mide de verdad, 41,90 mm. r y s definen un plano, así que se cortan, y el
      corte tiene la planta en r₁ ∩ s₁, que es A₁: s corta r en A. Por eso el otro lado que va sobre s es
      AD, perpendicular a AB.

      **s₂.** La figura no la dibuja. Un ángulo recto con un lado frontal se ve recto en el alzado: s₂ es la
      perpendicular a r₂ por A₂. Con ella, s queda fijada, y el plano también.

      **«El plano proyectante vertical».** Lo leemos como el plano vertical de proyección: A y B son los
      vértices de menor alejamiento. Como D baja desde A y, bajando por s, también se aleja, las dos
      condiciones eligen el mismo lado. Si se lee como el plano de canto que contiene a r, A y B están a
      distancia cero de él y la frase no elige nada: el cuadrado es el mismo.

      **El giro.** K, el punto de s con la cota de B, gira alrededor del eje vertical por A hasta que K₁′ cae
      en r₁, la horizontal de A₁: s queda frontal, y en K₂′A₂ prolongada se lleva el lado, A₂B₂, al otro lado
      de A₂, hacia abajo. Deshecho el giro, D₂ está en s₂ a la altura de D₂′, 33,45 mm por debajo de A₂, y D₁
      en s₁, 16,21 mm más lejos que A₁. C sale con las paralelas: C₂ en la paralela a r₂ por D₂ y en la
      perpendicular a r₂ por B₂, y C₁ en la horizontal de D₁.

      **También por abatimiento.** Con la horizontal BK de charnela, como hace el tema con las figuras
      planas, también sale corto: B y K no se mueven, A se abate con su triángulo, el cuadrado se dibuja en
      verdadera magnitud con D₀ en s₀, la recta de K a A₀, y D se desabate por la perpendicular a la
      charnela hasta s₁. Lo que no sirve es abatir alrededor de r: s es perpendicular a r, y s₀ cae sobre
      s₂.

  - id: sd16-las-otras-dos-palas-del-molino
    titulo: Las otras dos palas del molino
    fuente: Ejercicio 13 (SD16) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: «120º» tal cual, con la «o» volada de la página (como el «60º»
    # de la hoja 53): quiere decir grados.
    enunciado: |
      El trapecio ABCD representa una de las tres palas de un molino de viento. Representar las otras
      dos palas sabiendo que el conjunto gira 120º alrededor del eje OP.

      **Notas nuestras.** La figura es la de la colección. La hoja no da escala: la leemos a 1:1, en
      milímetros de la lámina. Arriba, el alzado de la pala:
      A₂B₂ y C₂D₂ son horizontales, B₂C₂ es oblicuo, y A₂D₂ es vertical y sigue hacia abajo hasta la
      cruz O₂ ≡ P₂, que es el eje OP visto de punta. Abajo, la planta: la pala se ve como el segmento
      A₁B₁, con C₁ en él y A₁ ≡ D₁ ≡ O₁ en su extremo izquierdo, y el eje como una recta de trazo y
      punto que sube desde O₁ por P₁. Llamamos A′B′C′D′ y A″B″C″D″ a las otras dos palas; esos
      nombres son nuestros. El enunciado solo pide dibujar: la pregunta del radio del giro de B
      también es nuestra.
    pide: Las otras dos palas en el alzado y en la planta; y, como pregunta nuestra, el radio de la circunferencia que recorre la punta B al girar.
    receta:
      lamina: sd16
      escena:
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        # El eje, de O hacia P: hacia el plano vertical, porque P₁ está por encima
        # de O₁ en la planta (menos alejamiento).
        ejeOP: segmento3(O, P)
      solucion:
        # Decisión: el enunciado pide las dos palas y no fija cuál es cuál. Llamamos
        # A′B′C′D′ a la que sale de girar ABCD 120° en sentido antihorario visto de
        # frente, en el alzado, y A″B″C″D″ a la de 120° en sentido horario, que es
        # también la segunda girada otros 120° en el mismo sentido: el «conjunto
        # gira 120°» lleva cada pala al sitio de la siguiente. Lo dice el intro de
        # cada paso. `gira` sin sentido da los dos giros como una elección, y su
        # rama 1 es el del ángulo con su signo, que alrededor de un eje orientado
        # de O hacia P (hacia el plano vertical) es el antihorario del alzado. Lo
        # comprueba el segundo camino, que gira el alzado en el papel alrededor de
        # O₂ sin pasar por el espacio.
        Ap: 'rama(gira(A, ejeOP, angulo: 120), 1)'
        Bp: 'rama(gira(B, ejeOP, angulo: 120), 1)'
        Cp: 'rama(gira(C, ejeOP, angulo: 120), 1)'
        Dp: 'rama(gira(D, ejeOP, angulo: 120), 1)'
        App: 'rama(gira(A, ejeOP, angulo: 120), 2)'
        Bpp: 'rama(gira(B, ejeOP, angulo: 120), 2)'
        Cpp: 'rama(gira(C, ejeOP, angulo: 120), 2)'
        Dpp: 'rama(gira(D, ejeOP, angulo: 120), 2)'
        # Errores, para los ejemplos de los diagnósticos. Girar 60°: la recta de
        # 30° del cartabón trazada por encima de la horizontal y no por debajo.
        A60: 'rama(gira(A, ejeOP, angulo: 60), 1)'
        A60h: 'rama(gira(A, ejeOP, angulo: 60), 2)'
        # Un punto de la circunferencia de cada vértice que no es el bueno: a 90°
        # en sentido antihorario y a 140° en el horario (a 90° se saldría del
        # encuadre por la derecha).
        A90: 'rama(gira(A, ejeOP, angulo: 90), 1)'
        A140h: 'rama(gira(A, ejeOP, angulo: 140), 2)'
        B90: 'rama(gira(B, ejeOP, angulo: 90), 1)'
        B140h: 'rama(gira(B, ejeOP, angulo: 140), 2)'
        C90: 'rama(gira(C, ejeOP, angulo: 90), 1)'
        C140h: 'rama(gira(C, ejeOP, angulo: 140), 2)'
        D90: 'rama(gira(D, ejeOP, angulo: 90), 1)'
        D140h: 'rama(gira(D, ejeOP, angulo: 140), 2)'
        # Girar también la planta, alrededor de O₁, como si el eje fuera vertical.
        # A está en la vertical de O (A₁ ≡ O₁), así que OA es un eje vertical; su
        # rama 2 es el giro antihorario visto en la planta.
        ejeV: segmento3(O, A)
        Bv: 'rama(gira(B, ejeV, angulo: 120), 2)'
        Cv: 'rama(gira(C, ejeV, angulo: 120), 2)'
        # El radio del giro de B: su distancia al eje, desde el pie de la
        # perpendicular. Con el eje de punta se ve entera en el alzado, O₂B₂.
        radio_B_mm: en_mm(vm(B, pie_perpendicular(B, recta3(O, P))))
        # Los extremos de las rectas largas de la construcción paso a paso: en el
        # papel se trazan más allá del punto que van a dar, y no paran en él.
        L_OA: 'uno(medir_sobre(segmento2(figura.punto("O2"), proy_alzado(Ap)), desde: figura.punto("O2"), distancia: vm_alzado(O, A) + mm(8)), 1)'
        L_AB: 'uno(medir_sobre(segmento2(proy_alzado(Ap), proy_alzado(Bp)), desde: proy_alzado(Ap), distancia: vm_alzado(A, B) + mm(8)), 1)'
        L_DC: 'uno(medir_sobre(segmento2(proy_alzado(Dp), proy_alzado(Cp)), desde: proy_alzado(Dp), distancia: vm_alzado(D, C) + mm(8)), 1)'
        L_OApp: 'uno(medir_sobre(segmento2(figura.punto("O2"), proy_alzado(App)), desde: figura.punto("O2"), distancia: vm_alzado(O, A) + mm(8)), 1)'
        L_ABpp: 'uno(medir_sobre(segmento2(proy_alzado(App), proy_alzado(Bpp)), desde: proy_alzado(App), distancia: vm_alzado(A, B) + mm(8)), 1)'
        L_DCpp: 'uno(medir_sobre(segmento2(proy_alzado(Dpp), proy_alzado(Cpp)), desde: proy_alzado(Dpp), distancia: vm_alzado(D, C) + mm(8)), 1)'
      comprueba:
        # O está en la recta AD: la pala arranca del eje.
        - en_recta(O, recta3(A, D))
    pasos:
      - tipo: reconocer
        pregunta: El eje OP es de punta, O₂ ≡ P₂. Al girar la pala alrededor de él, ¿qué se conserva de cada punto?
        opciones:
          - texto: Su alejamiento; en el alzado gira alrededor de O₂, y en la planta se mueve en horizontal
            correcta: true
            mensaje: |
              Eso es. Cada punto gira en un plano perpendicular al eje, y con el eje de punta ese
              plano es frontal: el alzado recorre una circunferencia de centro O₂ en verdadera
              magnitud, y la distancia al plano vertical no cambia.
          - texto: Su cota; en la planta gira alrededor de O₁, y en el alzado se mueve en horizontal
            mensaje: |
              Esa es la regla del eje **vertical**. Este es de punta: lo ves como un punto en el
              alzado, O₂ ≡ P₂, y en la planta es la recta de trazo y punto. La vista donde el eje es
              un punto es la que gira.
          - texto: Su distancia a O; las dos proyecciones giran 120°, alrededor de O₁ y de O₂
            mensaje: |
              Solo gira la vista donde el eje es un punto. En la planta el eje es una recta, y
              los puntos no giran alrededor de O₁: se mueven en horizontal, porque su alejamiento
              no cambia.

      # Decisión: dos pasos construir, uno por pala, de ocho puntos cada uno (sus
      # cuatro vértices en las dos vistas). Las dos salen de ABCD y no dependen
      # una de otra, así que el segundo paso no obliga a rehacer el primero.
      - tipo: construir
        titulo: La segunda pala, girada 120° en sentido antihorario
        intro: |
          El eje OP es de punta: en el alzado es el punto O₂ ≡ P₂, y cada punto de la pala gira
          alrededor de él sin cambiar de alejamiento. Aquí, A′B′C′D′ es la pala que sale de girar
          ABCD 120° en sentido **antihorario visto de frente**, en el alzado; la del sentido horario
          es la del paso siguiente. Marca sus cuatro vértices en las dos vistas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A2p
            rotulo: A₂′
            pide: la punta A de la segunda pala, en el alzado
            es: proy_alzado(solucion.Ap)
            bien: |
              A₂′ está en la circunferencia de centro O₂ que pasa por A₂, 120° más allá en sentido
              antihorario: la recta O₂A₂′ baja 30° por debajo de la horizontal, hacia la izquierda.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.App))
                mensaje: |
                  Esa es la otra pala, la del giro **horario**: la construyes en el paso siguiente.
                  Aquí va la del antihorario: de A₂, arriba, gira hacia la izquierda.
                ejemplo: proy_alzado(solucion.App)
              - si: cerca_de(proy_alzado(solucion.A60))
                mensaje: |
                  Has girado **60°**, no 120°: la recta de 30° del cartabón va por debajo de la
                  horizontal, no por encima. Desde la vertical que sube, 90° llevan a la horizontal,
                  y 30° más la bajan.
                ejemplo: proy_alzado(solucion.A60)
              - si: en_horizontal_de(figura.punto("A2"))
                mensaje: |
                  Has dejado A a su altura, y eso es lo que pasa con un eje **vertical**. Este es de
                  punta: lo que no cambia es el alejamiento, y en el alzado A₂ gira alrededor de O₂.
                ejemplo: 'desplaza(figura.punto("A2"), dx: mm(-20))'
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, A))'
                mensaje: |
                  Estás en la circunferencia de centro O₂ que pasa por A₂, pero no a 120°. Desde la
                  vertical que sube hasta A₂, en sentido antihorario: la recta de 30° por debajo de la
                  horizontal, hacia la izquierda.
                ejemplo: proy_alzado(solucion.A90)
              - si: siempre
                mensaje: |
                  A₂′ tiene que quedar a la misma distancia de O₂ que A₂: en un giro de eje de punta,
                  el alzado de cada punto recorre una circunferencia de centro O₂. Pincha el compás
                  en O₂ y ábrelo hasta A₂.
          - nombre: D2p
            rotulo: D₂′
            pide: el vértice D de la segunda pala, en el alzado
            es: proy_alzado(solucion.Dp)
            bien: |
              D₂′ está en la misma recta que A₂′, a la distancia de O₂ a la que estaba D₂: A, D y O
              están alineados, y siguen alineados después del giro.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Dpp))
                mensaje: |
                  Ese es D en la otra pala, la del giro horario. Esta pala sale hacia la izquierda,
                  como A₂′.
                ejemplo: proy_alzado(solucion.Dpp)
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, D))'
                mensaje: |
                  El radio es el bueno, O₂D₂, pero D₂′ va en la recta O₂A₂′: A, D y O están en la
                  misma vertical en el alzado de partida, y el giro los deja en la misma recta.
                ejemplo: proy_alzado(solucion.D90)
              - si: siempre
                mensaje: |
                  D₂′ está en la recta O₂A₂′, a la distancia O₂D₂ de O₂: con el compás en O₂, el arco
                  que pasa por D₂ corta esa recta en D₂′.
          - nombre: B2p
            rotulo: B₂′
            pide: la punta B de la segunda pala, en el alzado
            es: proy_alzado(solucion.Bp)
            bien: |
              B₂′ está en la circunferencia de centro O₂ que pasa por B₂ y en la perpendicular a O₂A₂′
              por A₂′: A₂B₂ era perpendicular a A₂D₂, y un giro no cambia los ángulos.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Bpp))
                mensaje: |
                  Ese es B en la otra pala, la del giro horario. Aquí, la pala que sale hacia la
                  izquierda.
                ejemplo: proy_alzado(solucion.Bpp)
              - si: 'cerca_de(desplaza(proy_alzado(solucion.Ap), dx: vm_alzado(A, B)))'
                mensaje: |
                  Has llevado A₂′B₂′ en horizontal, como estaba A₂B₂. Pero el lado AB gira con la
                  pala: A₂′B₂′ es perpendicular a O₂A₂′, no horizontal.
                ejemplo: 'desplaza(proy_alzado(solucion.Ap), dx: vm_alzado(A, B))'
              - si: 'a_distancia(de: figura.punto("O2"), d: vm(O, B))'
                mensaje: |
                  Has tomado de radio la **verdadera magnitud** de OB, y no es la distancia de B al
                  eje: B y O no tienen el mismo alejamiento. El radio del giro es lo que B dista del
                  eje, y con el eje de punta eso se ve en el alzado: O₂B₂.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("O2"), proy_alzado(solucion.Bp)), desde: figura.punto("O2"), distancia: vm(O, B)), 1)'
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, B))'
                mensaje: |
                  Estás en la circunferencia de B, pero no en su sitio. Lo fija la perpendicular a
                  O₂A₂′ por A₂′, una recta de 60°: el lado AB gira con la pala.
                ejemplo: proy_alzado(solucion.B90)
              - si: siempre
                mensaje: |
                  B₂′ está a la distancia O₂B₂ de O₂, en la perpendicular a O₂A₂′ por A₂′. Con el
                  compás en O₂ y abierto hasta B₂, el arco corta esa perpendicular en B₂′.
          - nombre: C2p
            rotulo: C₂′
            pide: el vértice C de la segunda pala, en el alzado
            es: proy_alzado(solucion.Cp)
            bien: |
              C₂′ está en la circunferencia de centro O₂ que pasa por C₂ y en la paralela a A₂′B₂′ por
              D₂′. B₂′C₂′ mide lo mismo que B₂C₂: es el mismo trapecio, girado.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Cpp))
                mensaje: |
                  Ese es C en la otra pala, la del giro horario.
                ejemplo: proy_alzado(solucion.Cpp)
              - si: 'cerca_de(desplaza(proy_alzado(solucion.Dp), dx: vm_alzado(D, C)))'
                mensaje: |
                  Has llevado D₂′C₂′ en horizontal, como estaba D₂C₂. D₂C₂ es paralelo a A₂B₂, y los
                  dos giran con la pala: D₂′C₂′ es paralelo a A₂′B₂′.
                ejemplo: 'desplaza(proy_alzado(solucion.Dp), dx: vm_alzado(D, C))'
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, C))'
                mensaje: |
                  Estás en la circunferencia de C, pero no en su sitio: C₂′ está también en la
                  paralela a A₂′B₂′ que pasa por D₂′.
                ejemplo: proy_alzado(solucion.C90)
              - si: siempre
                mensaje: |
                  C₂′ está a la distancia O₂C₂ de O₂, en la paralela a A₂′B₂′ por D₂′.
          - nombre: A1p
            rotulo: A₁′
            pide: la punta A de la segunda pala, en la planta
            es: proy_planta(solucion.Ap)
            bien: |
              A₁′ está en la vertical de A₂′ y en la horizontal de A₁: con el eje de punta, el
              alejamiento no cambia.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.App))
                mensaje: |
                  Esa es la planta de A en la otra pala, la del giro horario. A₁′ va en la vertical
                  de tu A₂′.
                ejemplo: proy_planta(solucion.App)
              - si: en_vertical_de(A2p)
                mensaje: |
                  Está en la vertical de A₂′, pero más arriba o más abajo de lo que toca. El
                  alejamiento no cambia al girar alrededor de un eje de punta: A₁′ está en la
                  horizontal de A₁.
                ejemplo: 'desplaza(proy_planta(solucion.Ap), dy: mm(-10))'
              - si: en_horizontal_de(figura.punto("A1"))
                mensaje: |
                  Bien la horizontal de A₁, porque el alejamiento no cambia. Falta la x: A₁′ está en
                  la vertical de A₂′.
                ejemplo: 'desplaza(proy_planta(solucion.Ap), dx: mm(10))'
              - si: siempre
                mensaje: |
                  A₁′ cumple dos cosas: está en la vertical de A₂′ y en la horizontal de A₁ ≡ O₁.
          - nombre: D1p
            rotulo: D₁′
            pide: el vértice D de la segunda pala, en la planta
            es: proy_planta(solucion.Dp)
            bien: |
              D₁′ está en la vertical de D₂′ y en la horizontal de D₁ ≡ O₁, como A₁′. Ya no coinciden:
              A y D dejaron de estar en una vertical.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Dpp))
                mensaje: |
                  Esa es la planta de D en la otra pala, la del giro horario. D₁′ va en la vertical de
                  tu D₂′.
                ejemplo: proy_planta(solucion.Dpp)
              - si: en_vertical_de(D2p)
                mensaje: |
                  Está en la vertical de D₂′, pero el alejamiento no cambia: D₁′ está en la horizontal
                  de D₁ ≡ O₁.
                ejemplo: 'desplaza(proy_planta(solucion.Dp), dy: mm(-10))'
              - si: en_horizontal_de(figura.punto("D1"))
                mensaje: |
                  Bien la horizontal de D₁ ≡ O₁, porque el alejamiento no cambia. Falta la x: D₁′ está
                  en la vertical de D₂′. Si has caído en A₁′, es esta misma horizontal, pero la
                  vertical de A₂′.
                ejemplo: 'desplaza(proy_planta(solucion.Dp), dx: mm(-8))'
              - si: siempre
                mensaje: |
                  D₁′ está en la vertical de D₂′ y en la horizontal de D₁ ≡ O₁. Si has caído en A₁′,
                  es esa misma horizontal, pero la vertical de A₂′.
          - nombre: B1p
            rotulo: B₁′
            pide: la punta B de la segunda pala, en la planta
            es: proy_planta(solucion.Bp)
            bien: |
              B₁′ está en la vertical de B₂′ y en la horizontal de B₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Bpp))
                mensaje: |
                  Esa es la planta de B en la otra pala, la del giro horario. B₁′ va en la vertical de
                  tu B₂′.
                ejemplo: proy_planta(solucion.Bpp)
              - si: cerca_de(proy_planta(solucion.Bv))
                mensaje: |
                  Has girado también la **planta** alrededor de O₁. Eso es un giro de eje vertical.
                  Con el eje de punta solo gira el alzado; en la planta, B₁ se mueve en horizontal
                  hasta la vertical de B₂′.
                ejemplo: proy_planta(solucion.Bv)
              - si: en_vertical_de(B2p)
                mensaje: |
                  Está en la vertical de B₂′, pero el alejamiento no cambia: B₁′ está en la horizontal
                  de B₁.
                ejemplo: 'desplaza(proy_planta(solucion.Bp), dy: mm(10))'
              - si: en_horizontal_de(figura.punto("B1"))
                mensaje: |
                  Bien la horizontal de B₁. Falta la x: B₁′ está en la vertical de B₂′.
                ejemplo: 'desplaza(proy_planta(solucion.Bp), dx: mm(10))'
              - si: siempre
                mensaje: |
                  B₁′ está en la vertical de B₂′ y en la horizontal de B₁.
          - nombre: C1p
            rotulo: C₁′
            pide: el vértice C de la segunda pala, en la planta
            es: proy_planta(solucion.Cp)
            bien: |
              C₁′ está en la vertical de C₂′ y en la horizontal de C₁. La pala girada ya no se ve
              como un segmento en la planta: su plano ha dejado de ser vertical.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Cpp))
                mensaje: |
                  Esa es la planta de C en la otra pala, la del giro horario.
                ejemplo: proy_planta(solucion.Cpp)
              - si: cerca_de(proy_planta(solucion.Cv))
                mensaje: |
                  Has girado también la **planta** alrededor de O₁, como si el eje fuera vertical.
                  En la planta, C₁ solo se mueve en horizontal, hasta la vertical de C₂′.
                ejemplo: proy_planta(solucion.Cv)
              - si: en_vertical_de(C2p)
                mensaje: |
                  Está en la vertical de C₂′, pero el alejamiento no cambia: C₁′ está en la horizontal
                  de C₁.
                ejemplo: 'desplaza(proy_planta(solucion.Cp), dy: mm(10))'
              - si: siempre
                mensaje: |
                  C₁′ está en la vertical de C₂′ y en la horizontal de C₁.
        trazado:
          - segmento2(proy_alzado(solucion.Ap), proy_alzado(solucion.Bp))
          - segmento2(proy_alzado(solucion.Bp), proy_alzado(solucion.Cp))
          - segmento2(proy_alzado(solucion.Cp), proy_alzado(solucion.Dp))
          - segmento2(figura.punto("O2"), proy_alzado(solucion.Ap))
          - segmento2(figura.punto("O1"), proy_planta(solucion.Dp))
          - segmento2(proy_planta(solucion.Ap), proy_planta(solucion.Bp))
          - segmento2(proy_planta(solucion.Bp), proy_planta(solucion.Cp))
          - segmento2(proy_planta(solucion.Cp), proy_planta(solucion.Dp))
          - segmento2(proy_planta(solucion.Dp), proy_planta(solucion.Ap))
        bloques:
          - nombre: Giro antihorario de 120°, eje OP
            explica: |
              El
              [giro](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-giro-mover-la-figura)
              lo pide el enunciado: 120° alrededor de OP, un eje de punta, que en el alzado es el
              punto O₂ ≡ P₂. Cada punto gira en un plano frontal: en el alzado recorre una
              circunferencia de centro O₂, y en la planta solo se mueve en horizontal, porque su
              alejamiento no cambia. Todos giran el mismo ángulo y en el mismo sentido, así que en
              el alzado la pala gira entera y conserva sus ángulos y sus paralelas. Esta es la del
              sentido antihorario visto de frente; el nombre A′B′C′D′ es nuestro.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), solucion.L_OA)
            guia: figura.segmento("CD2")
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              Se empieza por la recta O₂A₂D₂, que es vertical y lleva dos vértices: la pala arranca
              del eje. Girada 120° en sentido antihorario, la vertical que sube pasa la horizontal y
              baja 30° por debajo de ella, hacia la izquierda. Los 30° los da el cartabón, con la
              escuadra apoyada en una horizontal de la lámina, C₂D₂. Se traza larga, más allá de
              donde caerá A₂′.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("A2"), desde: figura.punto("A2"), hasta: proy_alzado(solucion.Ap))'
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              A gira en un plano perpendicular al eje, y con el eje de punta ese plano es frontal: en
              el alzado, A₂ recorre una circunferencia de centro O₂ sin deformarse. Por eso el compás
              se pincha en O₂ y se abre hasta A₂, y el arco se lleva hasta la recta de 30°.
          - con: marca
            traza: proy_alzado(solucion.Ap)
            rotulo: A₂′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              A₂′ es el corte del arco con la recta de 30°: está a la distancia de O₂ que tenía A₂, y
              girado 120°.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("D2"), desde: figura.punto("D2"), hasta: proy_alzado(solucion.Dp))'
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              D gira alrededor del mismo eje y el mismo ángulo, con su radio O₂D₂. Cae en la misma
              recta, porque A, D y O siguen alineados después del giro.
          - con: marca
            traza: proy_alzado(solucion.Dp)
            rotulo: D₂′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              D₂′, el corte de ese arco con la recta de 30°, entre O₂ y A₂′.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Ap), solucion.L_AB)
            guia: segmento2(figura.punto("O2"), proy_alzado(solucion.Ap))
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              A₂B₂ era perpendicular a A₂D₂, y un giro no cambia los ángulos de la figura. Así que B₂′
              está en la perpendicular a O₂A₂′ por A₂′: la escuadra, apoyada en O₂A₂′, la da. Larga,
              más allá de donde caerá B₂′.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("B2"), desde: figura.punto("B2"), hasta: proy_alzado(solucion.Bp))'
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              B gira con radio O₂B₂, que es su distancia al eje. La circunferencia de centro O₂ corta
              la perpendicular dos veces, una a cada lado de A₂′; vale el corte del lado trazado,
              hacia donde sale el lado AB, porque al otro lado quedaría la pala reflejada, no girada.
          - con: marca
            traza: proy_alzado(solucion.Bp)
            rotulo: B₂′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              B₂′, en la perpendicular por A₂′ y a la distancia O₂B₂ de O₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Dp), solucion.L_DC)
            guia: segmento2(proy_alzado(solucion.Ap), proy_alzado(solucion.Bp))
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              D₂C₂ es paralelo a A₂B₂, y el giro conserva el paralelismo. Por D₂′, la paralela a
              A₂′B₂′, deslizando la escuadra sobre el cartabón. Larga, más allá de donde caerá C₂′.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("C2"), desde: figura.punto("C2"), hasta: proy_alzado(solucion.Cp))'
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              C gira con su radio O₂C₂ hasta esa paralela, por la misma razón que B.
          - con: marca
            traza: proy_alzado(solucion.Cp)
            rotulo: C₂′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              C₂′, en la paralela por D₂′ y a la distancia O₂C₂ de O₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.Bp), proy_alzado(solucion.Cp))
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              B₂′C₂′ une los dos vértices que faltaban y cierra la pala en el alzado. Sirve de
              comprobación: mide lo mismo que B₂C₂, porque el giro no deforma la figura.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.Ap), desplaza(proy_planta(solucion.Ap), dy: mm(6))), segmento2(proy_alzado(solucion.Dp), desplaza(proy_planta(solucion.Dp), dy: mm(6))), segmento2(proy_alzado(solucion.Bp), desplaza(proy_planta(solucion.Bp), dy: mm(6))), segmento2(proy_alzado(solucion.Cp), desplaza(proy_planta(solucion.Cp), dy: mm(6)))]'
            guia: figura.segmento("DA2")
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              Las dos proyecciones de un punto están siempre en la misma vertical. Por cada alzado
              girado, la línea de referencia hasta la planta, paralela a A₂D₂; larga, porque todavía
              no se sabe dónde corta.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), desplaza(proy_planta(solucion.Ap), dx: mm(-4))), segmento2(figura.punto("B1"), desplaza(proy_planta(solucion.Bp), dx: mm(-4))), segmento2(figura.punto("C1"), desplaza(proy_planta(solucion.Cp), dx: mm(-4)))]'
            guia: figura.segmento("AB2")
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              Con el eje de punta el **alejamiento no cambia**, así que en la planta cada punto se
              mueve en horizontal: por A₁ ≡ D₁ ≡ O₁, por B₁ y por C₁, la paralela a A₂B₂, hacia la
              izquierda y más allá de las líneas de referencia.
          - con: marca
            traza: proy_planta(solucion.Ap)
            rotulo: A₁′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              A₁′ cumple las dos condiciones a la vez: el cruce de la vertical de A₂′ con la
              horizontal de A₁.
          - con: marca
            traza: proy_planta(solucion.Dp)
            rotulo: D₁′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              D₁′, en la misma horizontal, porque A y D tenían el mismo alejamiento, y en la vertical
              de D₂′.
          - con: marca
            traza: proy_planta(solucion.Bp)
            rotulo: B₁′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              B₁′, el cruce de la horizontal de B₁ con la vertical de B₂′.
          - con: marca
            traza: proy_planta(solucion.Cp)
            rotulo: C₁′
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              C₁′, el cruce de la horizontal de C₁ con la vertical de C₂′.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.Ap), proy_planta(solucion.Bp)), segmento2(proy_planta(solucion.Bp), proy_planta(solucion.Cp)), segmento2(proy_planta(solucion.Cp), proy_planta(solucion.Dp))]'
            bloque: Giro antihorario de 120°, eje OP
            porque: |
              La pala girada en la planta, uniendo sus cuatro vértices (D₁′A₁′ ya está en la
              horizontal). Ya no es un segmento: la pala de partida estaba en un plano vertical, y
              al girar alrededor de un eje de punta su plano se inclina.
        pista: |
          (1) En el alzado, la recta O₂A₂D₂ es vertical: girada 120° en sentido antihorario, baja 30°
          por debajo de la horizontal, hacia la izquierda. (2) Con el compás en O₂, lleva A₂ y D₂ a
          esa recta. (3) Por A₂′, la perpendicular; por D₂′, la paralela a ella. (4) Con el compás en
          O₂, B₂ y C₂ a esas rectas. (5) Cada planta, en la vertical de su alzado y en la horizontal de
          su planta de partida. Sin cartabón, los 120° salen con el compás: el radio cabe seis veces
          en la circunferencia, así que desde A₂, con el radio O₂A₂, dos arcos seguidos sobre ella
          dan el punto a 120°.
        desarrollo: |
          En verde claro, la segunda pala: en el alzado, el trapecio girado 120° alrededor de O₂, con
          la recta O₂A₂′ a 30° por debajo de la horizontal; en la planta, el cuadrilátero A₁′B₁′C₁′D₁′,
          con cada vértice en la horizontal de su planta de partida.

      - tipo: construir
        titulo: La tercera pala, girada 120° en sentido horario
        intro: |
          Ahora A″B″C″D″, la pala que sale de girar ABCD 120° en sentido **horario visto de frente**.
          Es también la segunda girada otros 120° en sentido antihorario: el conjunto gira 120°, y
          cada pala va al sitio de la siguiente. Marca sus cuatro vértices en las dos vistas. En la
          planta, B₁″ cae a menos de 4 mm de la cruz B₁ y C₁″, a 2,6 mm de la recta del eje: amplía
          la lámina con la lupa antes de marcarlos, para que el imán no te lleve a la cruz o al eje.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A2pp
            rotulo: A₂″
            pide: la punta A de la tercera pala, en el alzado
            es: proy_alzado(solucion.App)
            bien: |
              A₂″ está en la circunferencia de centro O₂ que pasa por A₂, 120° en sentido horario: la
              recta O₂A₂″ baja 30° por debajo de la horizontal, hacia la derecha.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Ap))
                mensaje: |
                  Esa es la segunda pala, la del giro antihorario, que ya construiste. La tercera
                  sale hacia la derecha.
                ejemplo: proy_alzado(solucion.Ap)
              - si: cerca_de(proy_alzado(solucion.A60h))
                mensaje: |
                  Has girado **60°**, no 120°: la recta de 30° va por debajo de la horizontal, no por
                  encima.
                ejemplo: proy_alzado(solucion.A60h)
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, A))'
                mensaje: |
                  Estás en la circunferencia de A, pero no a 120°: en sentido horario, desde la
                  vertical que sube hasta A₂, la recta de 30° por debajo de la horizontal, hacia la
                  derecha.
                ejemplo: proy_alzado(solucion.A140h)
              - si: siempre
                mensaje: |
                  A₂″ está a la distancia O₂A₂ de O₂: el compás, en O₂ y abierto hasta A₂.
          - nombre: D2pp
            rotulo: D₂″
            pide: el vértice D de la tercera pala, en el alzado
            es: proy_alzado(solucion.Dpp)
            bien: |
              D₂″ está en la recta O₂A₂″, a la distancia O₂D₂ de O₂.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Dp))
                mensaje: |
                  Ese es D en la segunda pala. La tercera sale hacia la derecha.
                ejemplo: proy_alzado(solucion.Dp)
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, D))'
                mensaje: |
                  El radio es el bueno, pero D₂″ va en la recta O₂A₂″: A, D y O siguen alineados.
                ejemplo: proy_alzado(solucion.D140h)
              - si: siempre
                mensaje: |
                  D₂″ está en la recta O₂A₂″, a la distancia O₂D₂ de O₂.
          - nombre: B2pp
            rotulo: B₂″
            pide: la punta B de la tercera pala, en el alzado
            es: proy_alzado(solucion.Bpp)
            bien: |
              B₂″ está en la circunferencia de B y en la perpendicular a O₂A₂″ por A₂″. Es el vértice
              más bajo de las tres palas.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Bp))
                mensaje: |
                  Ese es B en la segunda pala. La tercera sale hacia la derecha.
                ejemplo: proy_alzado(solucion.Bp)
              - si: 'cerca_de(desplaza(proy_alzado(solucion.App), dx: vm_alzado(A, B)))'
                mensaje: |
                  Has llevado A₂″B₂″ en horizontal, como estaba A₂B₂. El lado AB gira con la pala:
                  A₂″B₂″ es perpendicular a O₂A₂″.
                ejemplo: 'desplaza(proy_alzado(solucion.App), dx: vm_alzado(A, B))'
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, B))'
                mensaje: |
                  Estás en la circunferencia de B, pero no en su sitio: B₂″ está en la perpendicular
                  a O₂A₂″ por A₂″.
                ejemplo: proy_alzado(solucion.B140h)
              - si: siempre
                mensaje: |
                  B₂″ está a la distancia O₂B₂ de O₂, en la perpendicular a O₂A₂″ por A₂″.
          - nombre: C2pp
            rotulo: C₂″
            pide: el vértice C de la tercera pala, en el alzado
            es: proy_alzado(solucion.Cpp)
            bien: |
              C₂″ está en la circunferencia de C y en la paralela a A₂″B₂″ por D₂″.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Cp))
                mensaje: |
                  Ese es C en la segunda pala.
                ejemplo: proy_alzado(solucion.Cp)
              - si: 'a_distancia(de: figura.punto("O2"), d: vm_alzado(O, C))'
                mensaje: |
                  Estás en la circunferencia de C, pero no en su sitio: C₂″ está en la paralela a
                  A₂″B₂″ por D₂″.
                ejemplo: proy_alzado(solucion.C140h)
              - si: siempre
                mensaje: |
                  C₂″ está a la distancia O₂C₂ de O₂, en la paralela a A₂″B₂″ por D₂″.
          - nombre: A1pp
            rotulo: A₁″
            pide: la punta A de la tercera pala, en la planta
            es: proy_planta(solucion.App)
            bien: |
              A₁″ está en la vertical de A₂″ y en la horizontal de A₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Ap))
                mensaje: |
                  Esa es la planta de A en la segunda pala. A₁″ va en la vertical de tu A₂″.
                ejemplo: proy_planta(solucion.Ap)
              - si: en_vertical_de(A2pp)
                mensaje: |
                  Está en la vertical de A₂″, pero el alejamiento no cambia: A₁″ está en la
                  horizontal de A₁.
                ejemplo: 'desplaza(proy_planta(solucion.App), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  A₁″ está en la vertical de A₂″ y en la horizontal de A₁ ≡ O₁.
          - nombre: D1pp
            rotulo: D₁″
            pide: el vértice D de la tercera pala, en la planta
            es: proy_planta(solucion.Dpp)
            bien: |
              D₁″ está en la vertical de D₂″ y en la horizontal de D₁ ≡ O₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Dp))
                mensaje: |
                  Esa es la planta de D en la segunda pala. D₁″ va en la vertical de tu D₂″.
                ejemplo: proy_planta(solucion.Dp)
              - si: en_vertical_de(D2pp)
                mensaje: |
                  Está en la vertical de D₂″, pero el alejamiento no cambia: D₁″ está en la
                  horizontal de D₁.
                ejemplo: 'desplaza(proy_planta(solucion.Dpp), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  D₁″ está en la vertical de D₂″ y en la horizontal de D₁ ≡ O₁.
          - nombre: B1pp
            rotulo: B₁″
            pide: la punta B de la tercera pala, en la planta
            es: proy_planta(solucion.Bpp)
            bien: |
              B₁″ está en la vertical de B₂″ y en la horizontal de B₁, a poco menos de 4 mm de B₁.
            diagnosticos:
              - si: en_vertical_de(B2pp)
                mensaje: |
                  Está en la vertical de B₂″, pero el alejamiento no cambia: B₁″ está en la horizontal
                  de B₁.
                ejemplo: 'desplaza(proy_planta(solucion.Bpp), dy: mm(10))'
              - si: en_horizontal_de(figura.punto("B1"))
                mensaje: |
                  Bien la horizontal de B₁. Falta la x: B₁″ está en la vertical de B₂″, 3,7 mm a la
                  izquierda de la cruz B₁.
                ejemplo: 'desplaza(proy_planta(solucion.Bpp), dx: mm(-8))'
              - si: siempre
                mensaje: |
                  B₁″ está en la vertical de B₂″ y en la horizontal de B₁.
          - nombre: C1pp
            rotulo: C₁″
            pide: el vértice C de la tercera pala, en la planta
            es: proy_planta(solucion.Cpp)
            bien: |
              C₁″ está en la vertical de C₂″ y en la horizontal de C₁, muy cerca del eje en la
              planta.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Cp))
                mensaje: |
                  Esa es la planta de C en la segunda pala. C₁″ va en la vertical de tu C₂″.
                ejemplo: proy_planta(solucion.Cp)
              - si: en_vertical_de(C2pp)
                mensaje: |
                  Está en la vertical de C₂″, pero el alejamiento no cambia: C₁″ está en la
                  horizontal de C₁.
                ejemplo: 'desplaza(proy_planta(solucion.Cpp), dy: mm(10))'
              - si: en_horizontal_de(figura.punto("C1"))
                mensaje: |
                  Bien la horizontal de C₁. Falta la x: C₁″ está en la vertical de C₂″, 2,6 mm a la
                  derecha de la recta del eje. Si has marcado el cruce de la horizontal con el eje,
                  el imán te ha llevado a él: amplía con la lupa.
                ejemplo: 'pie_perpendicular(figura.punto("C1"), figura.segmento("OP1"))'
              - si: siempre
                mensaje: |
                  C₁″ está en la vertical de C₂″ y en la horizontal de C₁.
        trazado:
          - segmento2(proy_alzado(solucion.App), proy_alzado(solucion.Bpp))
          - segmento2(proy_alzado(solucion.Bpp), proy_alzado(solucion.Cpp))
          - segmento2(proy_alzado(solucion.Cpp), proy_alzado(solucion.Dpp))
          - segmento2(figura.punto("O2"), proy_alzado(solucion.App))
          - segmento2(figura.punto("O1"), proy_planta(solucion.Dpp))
          - segmento2(proy_planta(solucion.App), proy_planta(solucion.Bpp))
          - segmento2(proy_planta(solucion.Bpp), proy_planta(solucion.Cpp))
          - segmento2(proy_planta(solucion.Cpp), proy_planta(solucion.Dpp))
          - segmento2(proy_planta(solucion.Dpp), proy_planta(solucion.App))
        bloques:
          - nombre: Giro horario de 120°, eje OP
            explica: |
              El mismo giro de 120° alrededor de OP, ahora en sentido horario visto de frente: da la
              tercera pala, A″B″C″D″ (nombre nuestro), que es también la segunda girada otros 120°
              en sentido antihorario. En el alzado cada punto recorre su circunferencia de centro
              O₂; en la planta solo se mueve en horizontal, porque el alejamiento no cambia.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), solucion.L_OApp)
            guia: figura.segmento("CD2")
            bloque: Giro horario de 120°, eje OP
            porque: |
              Otra vez la recta O₂A₂D₂, ahora girada 120° en sentido horario: pasa la horizontal por
              la derecha y baja 30° por debajo de ella. El cartabón da los 30°, con la escuadra sobre
              la horizontal C₂D₂. Larga, más allá de donde caerá A₂″.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("A2"), desde: figura.punto("A2"), hasta: proy_alzado(solucion.App))'
            bloque: Giro horario de 120°, eje OP
            porque: |
              A₂ sigue girando en su circunferencia de centro O₂, ahora hacia la derecha: el compás
              en O₂, abierto hasta A₂, hasta la recta de 30°.
          - con: marca
            traza: proy_alzado(solucion.App)
            rotulo: A₂″
            bloque: Giro horario de 120°, eje OP
            porque: |
              A₂″, el corte del arco con la recta de 30°.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("D2"), desde: figura.punto("D2"), hasta: proy_alzado(solucion.Dpp))'
            bloque: Giro horario de 120°, eje OP
            porque: |
              D, con su radio O₂D₂, a la misma recta: A, D y O siguen alineados.
          - con: marca
            traza: proy_alzado(solucion.Dpp)
            rotulo: D₂″
            bloque: Giro horario de 120°, eje OP
            porque: |
              D₂″, el corte del arco de D con la recta de 30°, entre O₂ y A₂″.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.App), solucion.L_ABpp)
            guia: segmento2(figura.punto("O2"), proy_alzado(solucion.App))
            bloque: Giro horario de 120°, eje OP
            porque: |
              El lado AB sigue perpendicular a AD, porque el giro no cambia los ángulos: por A₂″, la
              perpendicular a O₂A₂″, larga.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("B2"), desde: figura.punto("B2"), hasta: proy_alzado(solucion.Bpp))'
            bloque: Giro horario de 120°, eje OP
            porque: |
              B, con su radio O₂B₂, hasta esa perpendicular. La circunferencia la corta dos veces, a
              un lado y otro de A₂″; vale el corte del lado trazado, que es hacia donde sale el lado
              AB.
          - con: marca
            traza: proy_alzado(solucion.Bpp)
            rotulo: B₂″
            bloque: Giro horario de 120°, eje OP
            porque: |
              B₂″, el corte del arco de B con la perpendicular por A₂″: el punto más bajo del molino.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Dpp), solucion.L_DCpp)
            guia: segmento2(proy_alzado(solucion.App), proy_alzado(solucion.Bpp))
            bloque: Giro horario de 120°, eje OP
            porque: |
              D₂C₂ sigue paralelo a A₂B₂: por D₂″, la paralela a A₂″B₂″, larga.
          - con: compas
            traza: 'arco(figura.punto("O2"), por: figura.punto("C2"), desde: figura.punto("C2"), hasta: proy_alzado(solucion.Cpp))'
            bloque: Giro horario de 120°, eje OP
            porque: |
              C, con su radio O₂C₂, hasta esa paralela.
          - con: marca
            traza: proy_alzado(solucion.Cpp)
            rotulo: C₂″
            bloque: Giro horario de 120°, eje OP
            porque: |
              C₂″, en la paralela por D₂″ y a la distancia O₂C₂ de O₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.Bpp), proy_alzado(solucion.Cpp))
            bloque: Giro horario de 120°, eje OP
            porque: |
              B₂″C₂″ cierra la tercera pala. Las tres quedan a 120° unas de otras alrededor de O₂,
              como pide el enunciado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.App), desplaza(proy_planta(solucion.App), dy: mm(6))), segmento2(proy_alzado(solucion.Dpp), desplaza(proy_planta(solucion.Dpp), dy: mm(6))), segmento2(proy_alzado(solucion.Bpp), desplaza(proy_planta(solucion.Bpp), dy: mm(6))), segmento2(proy_alzado(solucion.Cpp), desplaza(proy_planta(solucion.Cpp), dy: mm(6)))]'
            guia: figura.segmento("DA2")
            bloque: Giro horario de 120°, eje OP
            porque: |
              Las líneas de referencia desde cada alzado hasta la planta, paralelas a A₂D₂: las dos
              proyecciones de un punto van en la misma vertical.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), desplaza(proy_planta(solucion.App), dx: mm(4))), segmento2(figura.punto("B1"), desplaza(proy_planta(solucion.Bpp), dx: mm(-4))), segmento2(figura.punto("C1"), desplaza(proy_planta(solucion.Cpp), dx: mm(-4)))]'
            guia: figura.segmento("AB2")
            bloque: Giro horario de 120°, eje OP
            porque: |
              El alejamiento no cambia: las horizontales de A₁, B₁ y C₁, paralelas a A₂B₂, hasta más
              allá de las líneas de referencia. La de B₁ es corta: B₁″ cae a menos de 4 mm de B₁.
          - con: marca
            traza: proy_planta(solucion.App)
            rotulo: A₁″
            bloque: Giro horario de 120°, eje OP
            porque: |
              A₁″, el cruce de la horizontal de A₁ con la vertical de A₂″.
          - con: marca
            traza: proy_planta(solucion.Dpp)
            bloque: Giro horario de 120°, eje OP
            porque: |
              D₁″, en la misma horizontal y en la vertical de D₂″. Va sin rótulo: el suyo pisaría el
              rótulo A₁ ≡ D₁ ≡ O₁ de la lámina, que queda justo encima del punto.
          - con: marca
            traza: proy_planta(solucion.Bpp)
            bloque: Giro horario de 120°, eje OP
            porque: |
              B₁″, el cruce de la horizontal de B₁ con la vertical de B₂″. Va sin rótulo: el suyo
              caería encima del de B₁ y de su cruz, a menos de 4 mm en la misma horizontal.
          - con: marca
            traza: proy_planta(solucion.Cpp)
            rotulo: C₁″
            bloque: Giro horario de 120°, eje OP
            porque: |
              C₁″, el cruce de la horizontal de C₁ con la vertical de C₂″.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.App), proy_planta(solucion.Bpp)), segmento2(proy_planta(solucion.Bpp), proy_planta(solucion.Cpp)), segmento2(proy_planta(solucion.Cpp), proy_planta(solucion.Dpp))]'
            bloque: Giro horario de 120°, eje OP
            porque: |
              La tercera pala en la planta, que se cruza con la primera. Las dos van en continuo: la
              primera está entera por encima del eje y la tercera, entera por debajo, y la primera,
              que es vertical, se ve como una línea y no tapa nada.
        pista: |
          Como la segunda pala, al otro lado: la recta O₂A₂″ baja 30° por debajo de la horizontal,
          hacia la derecha. A₂″ y D₂″ con el compás en O₂; por A₂″ la perpendicular y por D₂″ la
          paralela; B₂″ y C₂″ con el compás en O₂. Las plantas, en las horizontales de las de partida.
          Los 120° hacia el otro lado salen igual con el compás: dos veces el radio O₂A₂ sobre la
          circunferencia, desde A₂ hacia la derecha.
        desarrollo: |
          En verde claro, la tercera pala: en el alzado, abajo a la derecha de O₂, y en la planta,
          a la derecha del eje, pasando por debajo de la primera. B₁″ queda en la horizontal de B₁, a
          3,7 mm a su izquierda.

      # Decisión: el enunciado solo pide dibujar. Este calcular, atado a la receta,
      # pregunta lo que decide el compás de cada punto: el radio del giro es la
      # distancia al eje, que con el eje de punta se ve en el alzado, y no la
      # verdadera magnitud de OB. B es el vértice donde más se apartan.
      - tipo: calcular
        titulo: El radio del giro de la punta B
        pregunta: Al girar, el vértice B recorre una circunferencia alrededor del eje OP. ¿Cuánto mide de verdad su radio?
        respuesta:
          tipo: numero
          valor: '66.74'
          receta: radio_B_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '68.95'
            receta: en_mm(vm(O, B))
            mensaje: |
              Eso es la **verdadera magnitud de OB**, y no es el radio: B y O no tienen el mismo
              alejamiento, así que OB no es perpendicular al eje. El radio es la distancia de B al
              eje, y con el eje de punta se ve entera en el alzado: O₂B₂.
          - valor: '39.25'
            receta: en_mm(vm_planta(O, B))
            mensaje: |
              Eso es **O₁B₁ en la planta**. En la planta el eje es una recta, no un punto, y ahí no
              se ve ninguna circunferencia: B gira en un plano frontal, que en la planta se ve de
              canto.
        pista: |
          B gira en un plano perpendicular al eje. Con el eje de punta, ese plano es frontal: ¿en qué
          vista se ve sin deformar la circunferencia que recorre B? Mide en ella con «medir» del
          Taller, en uno de los pasos anteriores, o en tu lámina de papel.
        desarrollo: |
          El eje es de punta, así que B gira en un plano frontal y su circunferencia se ve en
          verdadera magnitud en el alzado, con centro en O₂. En el alzado, B₂ está 35,22 mm a la
          derecha de O₂ (lo que mide A₂B₂) y 56,68 mm por encima (lo que mide O₂A₂):

          $$ r = \overline{O_2B_2} = \sqrt{35{,}22^{2} + 56{,}68^{2}} \approx 66{,}7 \text{ mm} $$

          OB mide más, 68,95 mm, porque además se acerca al plano vertical: esa diferencia de
          alejamientos va a lo largo del eje, y no cuenta en el radio.

      - tipo: justificar
        pregunta: Ordena el razonamiento para la segunda pala. Una pieza no debe entrar.
        piezas:
          - texto: El eje OP es de punta, así que cada punto gira en un plano frontal y en el alzado recorre una circunferencia de centro O₂.
          - texto: La vertical O₂A₂D₂ gira 120° y queda a 30° por debajo de la horizontal; A₂′ y D₂′ salen con el compás en O₂.
          - texto: B₂′ y C₂′ salen igual, con la perpendicular y la paralela por A₂′ y D₂′, porque el giro no cambia los ángulos de la pala.
          - texto: El alejamiento no cambia, así que cada planta va en la horizontal de su planta de partida y en la vertical de su alzado girado.
          - texto: La planta también gira 120°, alrededor de O₁, y cada alzado se mueve en horizontal hasta la vertical de su planta.
            trampa: true
            mensaje: |
              Eso es un giro de eje vertical. Aquí el eje es de punta: el que gira es el alzado, y
              en la planta cada punto solo se mueve en horizontal.

    resolucion: |
      **Qué gira y alrededor de qué.** El eje OP es de punta: en el alzado es el punto O₂ ≡ P₂, y en
      la planta, la recta de trazo y punto por O₁ y P₁. Cada punto de la pala gira en un plano
      perpendicular al eje, que es frontal: en el alzado recorre una circunferencia de centro O₂ en
      verdadera magnitud, y su alejamiento no cambia. Las otras dos palas son la primera girada 120°
      en un sentido y en el otro.

      **El alzado.** A, D y O están en la misma vertical: la pala arranca del eje. Girada 120° en
      sentido antihorario, esa vertical baja 30° por debajo de la horizontal, hacia la izquierda, y
      el compás en O₂ lleva A₂ y D₂ a ella. A₂′B₂′ es la perpendicular por A₂′ y D₂′C₂′ la paralela
      por D₂′, porque el giro no cambia los ángulos; el compás en O₂ lleva B₂ y C₂ a ellas. La tercera
      pala es igual hacia la derecha, girando 120° en sentido horario, que es lo mismo que girar la
      segunda otros 120° en sentido antihorario.

      **La planta.** Cada vértice girado va en la vertical de su alzado y en la horizontal de su
      planta de partida. La pala de partida estaba en un plano vertical y en la planta era un
      segmento; las giradas no lo están, y se ven como cuadriláteros. B₁″ cae a 3,7 mm de B₁, en su
      misma horizontal.

      **La visibilidad.** En el alzado, las tres palas ocupan sectores distintos alrededor de O₂ y no
      se tapan. En la planta, la tercera pala queda debajo de la primera: la primera está entera por
      encima de O y la tercera, entera por debajo (lo hemos comprobado comparando las cotas). La
      primera, vertical, se ve como una línea y no tapa nada, así que todo va en trazo continuo.

      **El radio.** La punta B gira con radio O₂B₂ = 66,74 mm, que se mide en el alzado. La
      verdadera magnitud de OB, 68,95 mm, es más larga porque OB no es perpendicular al eje.

  - id: sd17-el-cuadrado-y-la-barra-tras-dos-giros
    titulo: El cuadrado y la barra, tras dos giros de 60°
    fuente: Ejercicio 14 (SD17) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: la figura no es un cuadrado exacto: su alzado, que es su
    # verdadera magnitud porque es frontal, mide 31,54 × 27,26 mm. Manda el
    # material: se gira tal como está dibujada, y las notas nuestras lo dicen
    # para que nadie busque un error en su lámina.
    enunciado: |
      Una barra MN soporta un cuadrado vertical ABCD (M es el punto medio de CD). Se pide
      dibujar la posición final del cuadrado y la barra tras sufrir dos giros consecutivos:

      a) Giro de 60° alrededor del eje e, de punta al plano horizontal por el punto N. Sentido antihorario.

      b) Giro de 60° alrededor del eje j, de punta al plano vertical por el punto P. Sentido horario.

      **Notas nuestras.** La figura es la de la colección. La hoja no da escala: la leemos a 1:1, en
      milímetros de la lámina. Arriba, el alzado: el
      cuadrado se ve como un rectángulo, con A₂B₂ arriba y D₂C₂ abajo; N₂ ≡ M₂ está en el punto
      medio de D₂C₂, y la cruz P₂, encima, en la misma vertical. Abajo, la planta: el cuadrado se ve
      como el segmento horizontal que va de A₁ ≡ D₁ a B₁ ≡ C₁, y la barra como el segmento vertical
      que baja desde M₁, el punto medio de ese segmento, hasta P₁ ≡ N₁. El cuadrado es frontal y la barra, de punta, perpendicular
      a él; P está en la vertical de N. Como el cuadrado es frontal, el alzado es su verdadera
      magnitud, y en la figura mide 31,5 mm de ancho por 27,3 mm de alto: no es un cuadrado exacto,
      y se gira tal como está dibujado. A la izquierda de la página hay un croquis en perspectiva
      con el cuadrado, la barra, los ejes e y j y dos arcos que señalan los dos giros, sin cifras;
      es una ilustración y no da datos. Llamamos A′, B′… a las posiciones tras el primer giro y A″,
      B″… a las de tras el segundo; esos nombres son nuestros. El enunciado solo pide dibujar: la
      visibilidad y el ángulo final de la barra con el plano horizontal son preguntas nuestras.
    pide: El cuadrado y la barra tras el primer giro y en su posición final, en las dos vistas; y, como preguntas nuestras, su visibilidad y el ángulo que forma al final la barra con el plano horizontal.
    receta:
      lamina: sd17
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        # Otro punto del eje j: j es de punta, así que todos sus puntos tienen el
        # alzado P₂; este tiene el alejamiento de M.
        Pj: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("M1"))'
        # Decisión: el sentido de cada giro se lee en la vista donde su eje es un
        # punto, como se ve en el papel: el de e (vertical) en la planta, desde
        # arriba, y el de j (de punta) en el alzado, de frente. El croquis de la
        # página casa con esa lectura: la barra girada que dibuja en N y la recta
        # PN girada que dibuja en P van en esos sentidos. Lo dice el intro de cada
        # paso.
        # Los ejes van orientados para que el ángulo positivo sea el del
        # enunciado: e, de P hacia abajo (hacia N), y j, desde el alejamiento de M
        # hacia el de P (hacia el observador). `gira` sin sentido da los dos
        # giros como una elección, y su rama 1 es la del ángulo con su signo. Lo
        # comprueba el segundo camino, que gira la planta y el alzado en el papel.
        eje_e: segmento3(P, N)
        eje_j: segmento3(Pj, P)
      solucion:
        # a) 60° alrededor de e, antihorario en la planta. N está en e y no se mueve.
        Ap: 'rama(gira(A, eje_e, angulo: 60), 1)'
        Bp: 'rama(gira(B, eje_e, angulo: 60), 1)'
        Cp: 'rama(gira(C, eje_e, angulo: 60), 1)'
        Dp: 'rama(gira(D, eje_e, angulo: 60), 1)'
        Mp: 'rama(gira(M, eje_e, angulo: 60), 1)'
        # b) 60° alrededor de j, horario en el alzado, desde la posición que dejó a).
        App: 'rama(gira(Ap, eje_j, angulo: 60), 1)'
        Bpp: 'rama(gira(Bp, eje_j, angulo: 60), 1)'
        Cpp: 'rama(gira(Cp, eje_j, angulo: 60), 1)'
        Dpp: 'rama(gira(Dp, eje_j, angulo: 60), 1)'
        Mpp: 'rama(gira(Mp, eje_j, angulo: 60), 1)'
        Npp: 'rama(gira(N, eje_j, angulo: 60), 1)'
        # Errores, para los ejemplos de los diagnósticos.
        # El primer giro en sentido horario, visto en la planta (el de B cae fuera
        # del marco de la página).
        Ap_h: 'rama(gira(A, eje_e, angulo: 60), 2)'
        Mp_h: 'rama(gira(M, eje_e, angulo: 60), 2)'
        # Un punto de la circunferencia que no es el bueno: a 30°.
        A30: 'rama(gira(A, eje_e, angulo: 30), 1)'
        B30: 'rama(gira(B, eje_e, angulo: 30), 1)'
        M30: 'rama(gira(M, eje_e, angulo: 30), 1)'
        # El segundo giro aplicado a la posición de partida y no a la del primero
        # (el de M es N″, porque M₂ ≡ N₂: lo recoge su diagnóstico).
        Ad: 'rama(gira(A, eje_j, angulo: 60), 1)'
        Bd: 'rama(gira(B, eje_j, angulo: 60), 1)'
        Cd: 'rama(gira(C, eje_j, angulo: 60), 1)'
        Dd: 'rama(gira(D, eje_j, angulo: 60), 1)'
        # El segundo giro en sentido antihorario (A y B: los demás caen fuera del
        # marco de la página).
        App_h: 'rama(gira(Ap, eje_j, angulo: 60), 2)'
        Bpp_h: 'rama(gira(Bp, eje_j, angulo: 60), 2)'
        # Un punto de la circunferencia de centro P₂ que no es el bueno: a 30°.
        A30b: 'rama(gira(Ap, eje_j, angulo: 30), 1)'
        B30b: 'rama(gira(Bp, eje_j, angulo: 30), 1)'
        C30b: 'rama(gira(Cp, eje_j, angulo: 30), 1)'
        D30b: 'rama(gira(Dp, eje_j, angulo: 30), 1)'
        M30b: 'rama(gira(Mp, eje_j, angulo: 30), 1)'
        N30b: 'rama(gira(N, eje_j, angulo: 30), 1)'
        # Lo que el primer giro alejó del plano vertical cada punto (A, B y M),
        # para el error de llevar la planta final a la horizontal de partida.
        # La cota no cambia en el primer giro, así que vm_alzado es la diferencia
        # de x, y lo que queda es la diferencia de alejamientos.
        dyA: 'raiz(vm_planta(A, Ap) * vm_planta(A, Ap) - vm_alzado(A, Ap) * vm_alzado(A, Ap))'
        dyB: 'raiz(vm_planta(B, Bp) * vm_planta(B, Bp) - vm_alzado(B, Bp) * vm_alzado(B, Bp))'
        dyM: 'raiz(vm_planta(M, Mp) * vm_planta(M, Mp) - vm_alzado(M, Mp) * vm_alzado(M, Mp))'
        # El ángulo de la barra con el plano horizontal al final, y el que se ve
        # en el alzado: el de un segmento frontal con el mismo alzado que M″N″
        # (Mfr tiene el alzado de N″ y el alejamiento de M″).
        ang_barra_ph: angulo_con_ph(segmento3(Mpp, Npp))
        Mfr: 'punto3(alzado: proy_alzado(Npp), planta: pie_perpendicular(proy_planta(Npp), perpendicular(por: proy_planta(Mpp), a: figura.segmento("MN1"))))'
        ang_barra_alzado: angulo_con_ph(segmento3(Mpp, Mfr))
        # Los extremos de las rectas largas de la construcción paso a paso: en el
        # papel se trazan más allá del punto que van a dar, y no paran en él.
        L_NM: 'uno(medir_sobre(segmento2(figura.punto("N1"), proy_planta(Mp)), desde: figura.punto("N1"), distancia: vm_planta(N, M) + mm(10)), 1)'
        L_MA: 'uno(medir_sobre(segmento2(proy_planta(Mp), proy_planta(Ap)), desde: proy_planta(Mp), distancia: vm_planta(M, A) + mm(8)), 1)'
        L_MB: 'uno(medir_sobre(segmento2(proy_planta(Mp), proy_planta(Bp)), desde: proy_planta(Mp), distancia: vm_planta(M, B) + mm(8)), 1)'
        L_PN: 'uno(medir_sobre(segmento2(figura.punto("P2"), proy_alzado(Npp)), desde: figura.punto("P2"), distancia: vm_alzado(P, N) + mm(10)), 1)'
        L_ND: 'uno(medir_sobre(segmento2(proy_alzado(Npp), proy_alzado(Dpp)), desde: proy_alzado(Npp), distancia: vm_alzado(N, Dp) + mm(8)), 1)'
        L_DA: 'uno(medir_sobre(segmento2(proy_alzado(Dpp), proy_alzado(App)), desde: proy_alzado(Dpp), distancia: vm_alzado(Dp, Ap) + mm(8)), 1)'
        L_CB: 'uno(medir_sobre(segmento2(proy_alzado(Cpp), proy_alzado(Bpp)), desde: proy_alzado(Cpp), distancia: vm_alzado(Cp, Bp) + mm(8)), 1)'
        # La visibilidad: el cruce aparente, en la planta, donde la barra pasa de
        # oculta (debajo del cuadrado) a vista, con el lado que lo da
        # (k_<arista>_<lado>). En el alzado no cambia nada.
        k_MN_DA: 'cruce_aparente(segmento2(proy_planta(Mpp), proy_planta(Npp)), segmento2(proy_planta(Dpp), proy_planta(App)))'
      comprueba:
        # M está en CD (el enunciado dice que es su punto medio).
        - en_recta(M, recta3(C, D))
    pasos:
      - tipo: reconocer
        pregunta: El primer giro es de eje vertical por N; el segundo, de eje de punta por P. ¿Qué no cambia en cada uno?
        opciones:
          - texto: En el primero, las cotas, y gira la planta; en el segundo, los alejamientos, y gira el alzado
            correcta: true
            mensaje: |
              Eso es. Cada giro mueve los puntos en planos perpendiculares a su eje. Con el eje
              vertical son planos horizontales: la planta gira alrededor de N₁ sin deformarse y
              cada alzado se mueve en horizontal. Con el eje de punta son frontales: el alzado gira
              alrededor de P₂ y cada planta se mueve en horizontal.
          - texto: En el primero, los alejamientos, y gira el alzado; en el segundo, las cotas, y gira la planta, porque el eje vertical es el de punta
            mensaje: |
              Al revés. «De punta al plano horizontal» es perpendicular a él: el eje e es vertical,
              se ve como un punto en la planta, y lo que no cambia es la cota. El eje j, de punta
              al plano vertical, es el que conserva los alejamientos.
          - texto: Nada; en cada giro las dos vistas giran 60°, alrededor de N y de P
            mensaje: |
              Solo gira la vista donde el eje es un punto. En la otra el eje es una recta, y cada
              punto solo se mueve en horizontal: conserva su cota o su alejamiento.

      # Decisión: un paso construir por giro. El Taller no pasa las marcas de un
      # paso al siguiente, así que el segundo pide rehacer el primero en su
      # lámina, como el apartado 2 del Ejercicio 53; su construcción paso a paso
      # lo rehace al principio, en tres trazados y sus marcas. Doce puntos en el
      # segundo paso, el máximo que ya tiene el corpus (la hoja 54·1 a).
      - tipo: construir
        titulo: El primer giro, alrededor del eje vertical por N
        intro: |
          El eje e es vertical y pasa por N: en la planta es el punto N₁, y la planta gira alrededor
          de él sin deformarse; las cotas no cambian. El sentido antihorario se ve **desde arriba,
          en la planta**, donde el eje es un punto. Marca el cuadrado y la barra tras este giro: en
          la planta, A₁′ ≡ D₁′, B₁′ ≡ C₁′ y M₁′; en el alzado, A₂′, B₂′, C₂′, D₂′ y M₂′. N está en
          el eje y no se mueve.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M1p
            rotulo: M₁′
            pide: el punto M, el extremo de la barra, en la planta
            es: proy_planta(solucion.Mp)
            bien: |
              M₁′ está en la circunferencia de centro N₁ que pasa por M₁, 60° en sentido antihorario:
              la barra, que subía en vertical desde N₁, queda a 30° sobre la horizontal, hacia la
              izquierda.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Mp_h))
                mensaje: |
                  Has girado en sentido **horario** visto desde arriba. Antihorario en la planta: la
                  barra, que sube de N₁ a M₁, se inclina hacia la izquierda.
                ejemplo: proy_planta(solucion.Mp_h)
              - si: 'a_distancia(de: figura.punto("N1"), d: vm_planta(N, M))'
                mensaje: |
                  Estás en la circunferencia de centro N₁ que pasa por M₁, pero no a 60°. Desde la
                  vertical que sube hasta M₁, en sentido antihorario: la recta de 30° sobre la
                  horizontal, hacia la izquierda, que da el cartabón.
                ejemplo: proy_planta(solucion.M30)
              - si: siempre
                mensaje: |
                  M₁′ está a la misma distancia de N₁ que M₁: con el eje vertical, la planta gira
                  alrededor de N₁ sin deformarse. Pincha el compás en N₁ y ábrelo hasta M₁.
          - nombre: A1p
            rotulo: A₁′ ≡ D₁′
            pide: los vértices A y D, que siguen coincidiendo en la planta
            es: proy_planta(solucion.Ap)
            bien: |
              A₁′ ≡ D₁′ está en la perpendicular a N₁M₁′ por M₁′, que es la planta del cuadrado, y en
              la circunferencia de centro N₁ que pasa por A₁. El cuadrado sigue perpendicular a la
              barra y sigue siendo vertical: en la planta, un segmento.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Ap_h))
                mensaje: |
                  Has girado en sentido **horario** visto desde arriba. El cuadrado gira con la barra,
                  en sentido antihorario.
                ejemplo: proy_planta(solucion.Ap_h)
              - si: cerca_de(proy_planta(solucion.Bp))
                mensaje: |
                  Ese es B₁′ ≡ C₁′, el otro extremo. A₁ está a la izquierda de M₁ en la planta de
                  partida; al girar 60° en sentido antihorario, A₁′ baja hacia la izquierda de M₁′.
                ejemplo: proy_planta(solucion.Bp)
              - si: 'a_distancia(de: figura.punto("N1"), d: vm_planta(N, A))'
                mensaje: |
                  Estás en la circunferencia de centro N₁ que pasa por A₁, pero no en su sitio. Lo
                  fija la planta del cuadrado: la perpendicular a N₁M₁′ por M₁′.
                ejemplo: proy_planta(solucion.A30)
              - si: siempre
                mensaje: |
                  A₁′ ≡ D₁′ está en la perpendicular a N₁M₁′ por M₁′, a la distancia N₁A₁ de N₁.
          - nombre: B1p
            rotulo: B₁′ ≡ C₁′
            pide: los vértices B y C, que siguen coincidiendo en la planta
            es: proy_planta(solucion.Bp)
            bien: |
              B₁′ ≡ C₁′ está en la misma perpendicular, al otro lado de M₁′, y en la circunferencia de
              centro N₁ que pasa por B₁. M₁′ es el punto medio de A₁′B₁′.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Ap))
                mensaje: |
                  Ese es A₁′ ≡ D₁′, el otro extremo de la planta del cuadrado. B₁ está a la derecha de
                  M₁ en la planta de partida; al girar 60° en sentido antihorario, B₁′ sube hacia la
                  derecha de M₁′.
                ejemplo: proy_planta(solucion.Ap)
              - si: 'a_distancia(de: figura.punto("N1"), d: vm_planta(N, B))'
                mensaje: |
                  Estás en la circunferencia de centro N₁ que pasa por B₁, pero no en su sitio: B₁′
                  está en la perpendicular a N₁M₁′ por M₁′, al otro lado de A₁′.
                ejemplo: proy_planta(solucion.B30)
              - si: siempre
                mensaje: |
                  B₁′ ≡ C₁′ está en la perpendicular a N₁M₁′ por M₁′, a la distancia N₁B₁ de N₁.
          - nombre: A2p
            rotulo: A₂′
            pide: el vértice A tras el primer giro, en el alzado
            es: proy_alzado(solucion.Ap)
            bien: |
              A₂′ está a la altura de A₂, porque la cota no cambia, y en la vertical de A₁′.
            diagnosticos:
              - si: en_vertical_de(A1p)
                mensaje: |
                  Está en la vertical de A₁′, pero has cambiado la cota. Con el eje vertical cada
                  punto gira en un plano horizontal: A₂′ sigue a la altura de A₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Ap), dy: mm(-10))'
              - si: en_horizontal_de(figura.punto("A2"))
                mensaje: |
                  Bien la altura, porque la cota no cambia. Falta la x: A₂′ está en la vertical de
                  A₁′.
                ejemplo: 'desplaza(proy_alzado(solucion.Ap), dx: mm(10))'
              - si: siempre
                mensaje: |
                  A₂′ está a la altura de A₂ y en la vertical de A₁′.
          - nombre: D2p
            rotulo: D₂′
            pide: el vértice D tras el primer giro, en el alzado
            es: proy_alzado(solucion.Dp)
            bien: |
              D₂′ está a la altura de D₂ y en la vertical de A₁′ ≡ D₁′, debajo de A₂′.
            diagnosticos:
              - si: en_vertical_de(A1p)
                mensaje: |
                  Está en la vertical de D₁′, pero has cambiado la cota: D₂′ sigue a la altura de D₂,
                  en el lado de abajo.
                ejemplo: 'desplaza(proy_alzado(solucion.Dp), dy: mm(10))'
              - si: en_horizontal_de(figura.punto("D2"))
                mensaje: |
                  Bien la altura. Falta la x: D₂′ está en la vertical de A₁′ ≡ D₁′.
                ejemplo: 'desplaza(proy_alzado(solucion.Dp), dx: mm(-10))'
              - si: siempre
                mensaje: |
                  D₂′ está a la altura de D₂ y en la vertical de D₁′.
          - nombre: B2p
            rotulo: B₂′
            pide: el vértice B tras el primer giro, en el alzado
            es: proy_alzado(solucion.Bp)
            bien: |
              B₂′ está a la altura de B₂ y en la vertical de B₁′ ≡ C₁′. El cuadrado se ve ahora más
              estrecho en el alzado: ya no es frontal.
            diagnosticos:
              - si: en_vertical_de(B1p)
                mensaje: |
                  Está en la vertical de B₁′, pero has cambiado la cota: B₂′ sigue a la altura de B₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Bp), dy: mm(-10))'
              - si: en_horizontal_de(figura.punto("B2"))
                mensaje: |
                  Bien la altura. Falta la x: B₂′ está en la vertical de B₁′ ≡ C₁′.
                ejemplo: 'desplaza(proy_alzado(solucion.Bp), dx: mm(10))'
              - si: siempre
                mensaje: |
                  B₂′ está a la altura de B₂ y en la vertical de B₁′.
          - nombre: C2p
            rotulo: C₂′
            pide: el vértice C tras el primer giro, en el alzado
            es: proy_alzado(solucion.Cp)
            bien: |
              C₂′ está a la altura de C₂ y en la vertical de B₁′ ≡ C₁′, debajo de B₂′.
            diagnosticos:
              - si: en_vertical_de(B1p)
                mensaje: |
                  Está en la vertical de C₁′, pero has cambiado la cota: C₂′ sigue a la altura de C₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Cp), dy: mm(10))'
              - si: en_horizontal_de(figura.punto("C2"))
                mensaje: |
                  Bien la altura. Falta la x: C₂′ está en la vertical de B₁′ ≡ C₁′.
                ejemplo: 'desplaza(proy_alzado(solucion.Cp), dx: mm(10))'
              - si: siempre
                mensaje: |
                  C₂′ está a la altura de C₂ y en la vertical de C₁′.
          - nombre: M2p
            rotulo: M₂′
            pide: el punto M tras el primer giro, en el alzado
            es: proy_alzado(solucion.Mp)
            bien: |
              M₂′ está en el lado D₂′C₂′, en su punto medio y en la vertical de M₁′. La barra N₂M₂′ se
              ve ahora horizontal en el alzado, en la prolongación de ese lado.
            diagnosticos:
              - si: cerca_de(figura.punto("M2"))
                mensaje: |
                  Ese es M₂ sin mover. N no se mueve, porque está en el eje, pero M sí: M₂′ está en la
                  vertical de M₁′.
                ejemplo: figura.punto("M2")
              - si: en_vertical_de(M1p)
                mensaje: |
                  Está en la vertical de M₁′, pero has cambiado la cota: M₂′ sigue a la altura de M₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Mp), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  M₂′ está a la altura de M₂ y en la vertical de M₁′: el punto medio de D₂′C₂′.
        trazado:
          - segmento2(figura.punto("N1"), proy_planta(solucion.Mp))
          - segmento2(proy_planta(solucion.Ap), proy_planta(solucion.Bp))
          - segmento2(proy_alzado(solucion.Ap), proy_alzado(solucion.Bp))
          - segmento2(proy_alzado(solucion.Bp), proy_alzado(solucion.Cp))
          - segmento2(proy_alzado(solucion.Cp), proy_alzado(solucion.Dp))
          - segmento2(proy_alzado(solucion.Dp), proy_alzado(solucion.Ap))
          - segmento2(proy_alzado(solucion.Mp), figura.punto("N2"))
        bloques:
          - nombre: 1.er giro, eje vertical por N
            explica: |
              El primer
              [giro](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-giro-mover-la-figura)
              lo da el enunciado: 60° en sentido antihorario alrededor de e, la vertical por N. Su
              sentido se ve desde arriba, en la planta, donde e es un punto. La planta gira
              alrededor de N₁ sin deformarse, y las cotas se quedan: en el alzado cada punto solo se
              mueve en horizontal. N, en el eje, no se mueve, y el cuadrado sigue vertical y
              perpendicular a la barra.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("N1"), solucion.L_NM)
            guia: figura.segmento("AB1")
            bloque: 1.er giro, eje vertical por N
            porque: |
              El eje e es vertical: en la planta es el punto N₁, y la planta gira alrededor de él sin
              deformarse. Se empieza por la barra, que sube en vertical de N₁ a M₁: girada 60° en
              sentido antihorario, queda a 30° sobre la horizontal, hacia la izquierda. Los 30° los da
              el cartabón, con la escuadra sobre la horizontal A₁B₁. Larga, más allá de donde caerá M₁′.
          - con: compas
            traza: 'arco(figura.punto("N1"), por: figura.punto("M1"), desde: figura.punto("M1"), hasta: proy_planta(solucion.Mp))'
            bloque: 1.er giro, eje vertical por N
            porque: |
              M gira en un plano horizontal, y en la planta recorre una circunferencia de centro N₁.
              Por eso el compás se pincha en N₁ y se abre hasta M₁, y el arco se lleva hasta la recta.
          - con: marca
            traza: proy_planta(solucion.Mp)
            rotulo: M₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              M₁′, el corte del arco con la recta de 30°: el extremo de la barra girada.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Mp), solucion.L_MA), segmento2(proy_planta(solucion.Mp), solucion.L_MB)]'
            guia: segmento2(figura.punto("N1"), proy_planta(solucion.Mp))
            bloque: 1.er giro, eje vertical por N
            porque: |
              El cuadrado es perpendicular a la barra, y el giro no cambia los ángulos: su planta es la
              perpendicular a N₁M₁′ por M₁′. La escuadra, apoyada en N₁M₁′, la da; a los dos lados de
              M₁′, larga.
          - con: compas
            traza: 'arco(figura.punto("N1"), por: figura.punto("A1"), desde: figura.punto("A1"), hasta: proy_planta(solucion.Ap))'
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₁ y B₁ están a la misma distancia de N₁, 38,5 mm, porque N₁M₁ es perpendicular a A₁B₁
              por su punto medio: una sola circunferencia de centro N₁ sirve para los dos. El arco
              que sale de A₁ y gira 60° en sentido antihorario corta la planta del cuadrado dos
              veces: primero en B₁′ y, al final, en A₁′.
          - con: marca
            traza: proy_planta(solucion.Ap)
            rotulo: A₁′ ≡ D₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₁′ ≡ D₁′, donde acaba el arco, a los 60°, sobre la planta del cuadrado. El cuadrado
              sigue siendo vertical, así que A y D siguen coincidiendo en la planta.
          - con: marca
            traza: proy_planta(solucion.Bp)
            rotulo: B₁′ ≡ C₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              B₁′ ≡ C₁′, el primer corte del arco con la planta del cuadrado, al otro lado de M₁′.
              M₁′ queda en el punto medio de A₁′B₁′, como M₁ en A₁B₁: es la comprobación.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Ap), desplaza(proy_alzado(solucion.Ap), dy: mm(-8))), segmento2(proy_planta(solucion.Bp), desplaza(proy_alzado(solucion.Bp), dy: mm(-8))), segmento2(proy_planta(solucion.Mp), desplaza(proy_alzado(solucion.Mp), dy: mm(-8)))]'
            guia: figura.segmento("MN1")
            bloque: 1.er giro, eje vertical por N
            porque: |
              Las dos proyecciones de un punto van en la misma vertical: por cada planta girada, la
              línea de referencia hacia el alzado, paralela a M₁N₁, larga.
          - con: regla
            traza: '[segmento2(figura.punto("A2"), desplaza(proy_alzado(solucion.Ap), dx: mm(-8))), segmento2(figura.punto("D2"), desplaza(proy_alzado(solucion.Dp), dx: mm(-8)))]'
            bloque: 1.er giro, eje vertical por N
            porque: |
              Con el eje vertical la **cota no cambia**: cada punto del alzado se mueve en horizontal.
              Los vértices de arriba se quedan en la recta A₂B₂ y los de abajo, con M, en la recta
              D₂C₂: se prolongan las dos con la regla hacia la izquierda, más allá de las líneas de
              referencia.
          - con: marca
            traza: proy_alzado(solucion.Ap)
            rotulo: A₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₂′, el cruce de A₂B₂ prolongada con la vertical de A₁′.
          - con: marca
            traza: proy_alzado(solucion.Dp)
            rotulo: D₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              D₂′, el cruce de D₂C₂ prolongada con la misma vertical.
          - con: marca
            traza: proy_alzado(solucion.Bp)
            bloque: 1.er giro, eje vertical por N
            porque: |
              B₂′, el cruce de A₂B₂ prolongada con la vertical de B₁′. Va sin rótulo: el suyo pisaría
              el rótulo A₂ de la lámina, que queda justo a su derecha.
          - con: marca
            traza: proy_alzado(solucion.Cp)
            bloque: 1.er giro, eje vertical por N
            porque: |
              C₂′, el cruce de D₂C₂ prolongada con la misma vertical. Va sin rótulo: el suyo pisaría
              el rótulo D₂ de la lámina, que queda justo a su derecha.
          - con: marca
            traza: proy_alzado(solucion.Mp)
            rotulo: M₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              M₂′, el cruce de D₂C₂ prolongada con la vertical de M₁′. N₂ no se ha movido, porque N
              está en el eje, y la barra se ve ahora horizontal, de N₂ a M₂′, en la recta del lado de
              abajo.
        pista: |
          (1) En la planta, la recta de 30° por N₁ hacia la izquierda: es la barra girada 60° en
          sentido antihorario; con el compás en N₁, M₁ va a ella. (2) La perpendicular por M₁′ es la
          planta del cuadrado; el arco de centro N₁ que sale de A₁ la corta en B₁′ y en A₁′. (3) Sube
          cada punto a la altura que tenía en el alzado. Sin cartabón, los 60° salen con el compás:
          con centro en M₁ y radio N₁M₁, el arco corta la circunferencia de M justo a 60°.
        desarrollo: |
          En verde claro, la posición tras el primer giro: en la planta, la barra N₁M₁′ y el cuadrado
          A₁′B₁′, perpendicular a ella; en el alzado, el cuadrado más estrecho, a la izquierda del de
          partida y a la misma altura, y la barra horizontal de N₂ a M₂′.

      - tipo: construir
        titulo: El segundo giro, alrededor del eje de punta por P
        intro: |
          El eje j es de punta y pasa por P: en el alzado es el punto P₂, y el alzado gira alrededor
          de él; los alejamientos no cambian. El sentido horario se ve **de frente, en el alzado**.
          El giro se aplica a la posición que dejó el primero: rehaz el primer giro en esta lámina y
          gira desde ahí. Marca la posición final en las dos vistas; esta vez N también se mueve,
          porque no está en j. N₂ ≡ M₂ no lleva marca en la lámina: está en D₂C₂, en la vertical de
          P₂.

          Después, pasa a limpio la posición final en las dos vistas con «arista vista» y «arista
          oculta». Lo visto y lo oculto es pregunta nuestra (el enunciado solo pide dibujar), y
          también la lectura: tomamos el cuadrado como una placa opaca y la barra como una varilla,
          que no tapa nada. Con el cuadrado transparente, todo iría en continua; con la placa
          opaca, en la planta la barra pasa por debajo de ella desde M₁″ hasta el lado A₁″D₁″, y
          ese tramo va a trazos. Cada arista se corta solo donde cambia su visibilidad: para tener
          ese punto, traza antes la barra con la recta. En el alzado la barra va en la recta del
          lado C₂″D₂″, y de M₂″ a C₂″ coincide con él: pasa el lado y la barra, cada uno entero.
          La posición de partida, que trae la lámina, y la que deja el primer giro, que es de paso,
          no se pasan. El tramo visto de la barra en la planta, de A₁″D₁″ a N₁″, mide 5,2 mm:
          amplía con la lupa (×4) si hace falta.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: N2pp
            rotulo: N₂″
            pide: el extremo N de la barra, en su posición final, en el alzado
            es: proy_alzado(solucion.Npp)
            bien: |
              N₂″ está en la circunferencia de centro P₂ que pasa por N₂, 60° en sentido horario: P₂N₂
              era vertical, y P₂N₂″ baja 30° por debajo de la horizontal, hacia la izquierda.
            diagnosticos:
              - si: cerca_de(figura.punto("N2"))
                mensaje: |
                  Ese es N₂ sin mover. N está en el eje e, y por eso no se movió en el primer giro;
                  pero no está en j, y en el segundo gira alrededor de P₂.
                ejemplo: figura.punto("N2")
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, N))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por N₂, pero no a 60° en sentido
                  horario: desde la vertical que baja de P₂, la recta de 30° por debajo de la
                  horizontal, hacia la izquierda.
                ejemplo: proy_alzado(solucion.N30b)
              - si: siempre
                mensaje: |
                  N₂″ está a la misma distancia de P₂ que N₂: con el eje de punta, el alzado gira
                  alrededor de P₂ sin deformarse.
          - nombre: M2pp
            rotulo: M₂″
            pide: el punto M en su posición final, en el alzado
            es: proy_alzado(solucion.Mpp)
            bien: |
              M₂″ está en la circunferencia de centro P₂ que pasa por M₂′ y en la recta que sube 60°
              desde N₂″: la barra N₂M₂′, que era horizontal, girada 60° en sentido horario.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Npp))
                mensaje: |
                  Ese es N₂″. M₂ y N₂ coincidían al principio, pero M se movió en el primer giro y N
                  no: lo que gira ahora es M₂′. Si has girado M₂, la posición de partida, caes aquí.
                ejemplo: proy_alzado(solucion.Npp)
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, Mp))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por M₂′, pero no en su sitio. M₂″
                  está también en la recta que sube 60° hacia la izquierda desde N₂″: la barra
                  girada.
                ejemplo: proy_alzado(solucion.M30b)
              - si: siempre
                mensaje: |
                  M₂″ está a la distancia P₂M₂′ de P₂, en la recta de 60° que sube desde N₂″.
          - nombre: D2pp
            rotulo: D₂″
            pide: el vértice D en su posición final, en el alzado
            es: proy_alzado(solucion.Dpp)
            bien: |
              D₂″ está en la misma recta que N₂″ y M₂″: N₂, M₂′, C₂′ y D₂′ estaban en una horizontal,
              y el giro los deja en una recta.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Dd))
                mensaje: |
                  Has girado D₂, la posición de partida. El segundo giro se aplica a D₂′.
                ejemplo: proy_alzado(solucion.Dd)
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, Dp))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por D₂′, pero no en su sitio: D₂″
                  está en la recta que sube 60° desde N₂″.
                ejemplo: proy_alzado(solucion.D30b)
              - si: siempre
                mensaje: |
                  D₂″ está a la distancia P₂D₂′ de P₂, en la recta de 60° que sube desde N₂″.
          - nombre: C2pp
            rotulo: C₂″
            pide: el vértice C en su posición final, en el alzado
            es: proy_alzado(solucion.Cpp)
            bien: |
              C₂″ está en la recta de N₂″, entre N₂″ y M₂″: la barra se ve en la prolongación del lado
              C₂″D₂″, como antes del giro.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Cd))
                mensaje: |
                  Has girado C₂, la posición de partida. El segundo giro se aplica a C₂′.
                ejemplo: proy_alzado(solucion.Cd)
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, Cp))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por C₂′, pero no en su sitio: C₂″
                  está en la recta que sube 60° desde N₂″.
                ejemplo: proy_alzado(solucion.C30b)
              - si: siempre
                mensaje: |
                  C₂″ está a la distancia P₂C₂′ de P₂, en la recta de 60° que sube desde N₂″.
          - nombre: A2pp
            rotulo: A₂″
            pide: el vértice A en su posición final, en el alzado
            es: proy_alzado(solucion.App)
            bien: |
              A₂″ está en la circunferencia de centro P₂ que pasa por A₂′ y en la perpendicular por D₂″
              a la recta de la barra: A₂′D₂′ era vertical, perpendicular a la horizontal de D₂′C₂′.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Ad))
                mensaje: |
                  Has girado A₂, la posición de partida. El segundo giro se aplica a A₂′.
                ejemplo: proy_alzado(solucion.Ad)
              - si: cerca_de(proy_alzado(solucion.App_h))
                mensaje: |
                  Has girado en sentido **antihorario**. El segundo giro es horario, visto de frente:
                  lo que estaba debajo de P₂ se va hacia la izquierda.
                ejemplo: proy_alzado(solucion.App_h)
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, Ap))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por A₂′, pero no en su sitio: A₂″
                  está en la perpendicular a la recta de la barra por D₂″.
                ejemplo: proy_alzado(solucion.A30b)
              - si: siempre
                mensaje: |
                  A₂″ está a la distancia P₂A₂′ de P₂, en la perpendicular a N₂″D₂″ por D₂″.
          - nombre: B2pp
            rotulo: B₂″
            pide: el vértice B en su posición final, en el alzado
            es: proy_alzado(solucion.Bpp)
            bien: |
              B₂″ está en la circunferencia de centro P₂ que pasa por B₂′ y en la perpendicular a la
              recta de la barra por C₂″. A₂″B₂″ es paralelo a D₂″C₂″.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Bd))
                mensaje: |
                  Has girado B₂, la posición de partida. El segundo giro se aplica a B₂′.
                ejemplo: proy_alzado(solucion.Bd)
              - si: cerca_de(proy_alzado(solucion.Bpp_h))
                mensaje: |
                  Has girado en sentido **antihorario**. El segundo giro es horario, visto de frente.
                ejemplo: proy_alzado(solucion.Bpp_h)
              - si: 'a_distancia(de: figura.punto("P2"), d: vm_alzado(P, Bp))'
                mensaje: |
                  Estás en la circunferencia de centro P₂ que pasa por B₂′, pero no en su sitio: B₂″
                  está en la perpendicular a la recta de la barra por C₂″.
                ejemplo: proy_alzado(solucion.B30b)
              - si: siempre
                mensaje: |
                  B₂″ está a la distancia P₂B₂′ de P₂, en la perpendicular a N₂″C₂″ por C₂″.
          - nombre: N1pp
            rotulo: N₁″
            pide: el extremo N de la barra, en su posición final, en la planta
            es: proy_planta(solucion.Npp)
            bien: |
              N₁″ está en la vertical de N₂″ y en la horizontal de N₁: el alejamiento no cambia.
            diagnosticos:
              - si: cerca_de(figura.punto("N1"))
                mensaje: |
                  Ese es N₁ sin mover. En el segundo giro N se mueve: su planta va en horizontal hasta
                  la vertical de N₂″.
                ejemplo: figura.punto("N1")
              - si: en_vertical_de(N2pp)
                mensaje: |
                  Está en la vertical de N₂″, pero el alejamiento no cambia con el eje de punta: N₁″
                  está en la horizontal de N₁.
                ejemplo: 'desplaza(proy_planta(solucion.Npp), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  N₁″ está en la vertical de N₂″ y en la horizontal de N₁.
          - nombre: M1pp
            rotulo: M₁″
            pide: el punto M en su posición final, en la planta
            es: proy_planta(solucion.Mpp)
            bien: |
              M₁″ está en la vertical de M₂″ y en la horizontal de M₁′, el alejamiento que dejó el
              primer giro.
            diagnosticos:
              - si: en_horizontal_de(figura.punto("M1"))
                mensaje: |
                  Has usado la horizontal de M₁, la de partida. El alejamiento que se conserva en el
                  segundo giro es el que dejó el primero: M₁″ está en la horizontal de M₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Mpp), dy: 0 - solucion.dyM)'
              - si: en_vertical_de(M2pp)
                mensaje: |
                  Está en la vertical de M₂″, pero a otro alejamiento: M₁″ está en la horizontal de
                  M₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Mpp), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  M₁″ está en la vertical de M₂″ y en la horizontal de M₁′.
          - nombre: D1pp
            rotulo: D₁″
            pide: el vértice D en su posición final, en la planta
            es: proy_planta(solucion.Dpp)
            bien: |
              D₁″ está en la vertical de D₂″ y en la horizontal de A₁′ ≡ D₁′. A y D ya no coinciden en
              la planta: el cuadrado ha dejado de ser vertical.
            diagnosticos:
              - si: en_horizontal_de(figura.punto("D1"))
                mensaje: |
                  Has usado la horizontal de D₁, la de partida. El alejamiento que se conserva es el
                  que dejó el primer giro: D₁″ está en la horizontal de A₁′ ≡ D₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Dpp), dy: 0 - solucion.dyA)'
              - si: en_vertical_de(D2pp)
                mensaje: |
                  Está en la vertical de D₂″, pero a otro alejamiento: D₁″ está en la horizontal de
                  D₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Dpp), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  D₁″ está en la vertical de D₂″ y en la horizontal de D₁′.
          - nombre: C1pp
            rotulo: C₁″
            pide: el vértice C en su posición final, en la planta
            es: proy_planta(solucion.Cpp)
            bien: |
              C₁″ está en la vertical de C₂″ y en la horizontal de B₁′ ≡ C₁′.
            diagnosticos:
              - si: en_horizontal_de(figura.punto("C1"))
                mensaje: |
                  Has usado la horizontal de C₁, la de partida, que está muy cerca. El alejamiento que
                  se conserva es el que dejó el primer giro: C₁″ está en la horizontal de C₁′, 4 mm
                  más abajo.
                ejemplo: 'desplaza(proy_planta(solucion.Cpp), dy: 0 - solucion.dyB)'
              - si: en_vertical_de(C2pp)
                mensaje: |
                  Está en la vertical de C₂″, pero a otro alejamiento: C₁″ está en la horizontal de
                  C₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Cpp), dy: mm(10))'
              - si: siempre
                mensaje: |
                  C₁″ está en la vertical de C₂″ y en la horizontal de C₁′.
          - nombre: A1pp
            rotulo: A₁″
            pide: el vértice A en su posición final, en la planta
            es: proy_planta(solucion.App)
            bien: |
              A₁″ está en la vertical de A₂″ y en la horizontal de A₁′ ≡ D₁′, como D₁″.
            diagnosticos:
              - si: en_horizontal_de(figura.punto("A1"))
                mensaje: |
                  Has usado la horizontal de A₁, la de partida. El alejamiento que se conserva es el
                  que dejó el primer giro: A₁″ está en la horizontal de A₁′.
                ejemplo: 'desplaza(proy_planta(solucion.App), dy: 0 - solucion.dyA)'
              - si: en_vertical_de(A2pp)
                mensaje: |
                  Está en la vertical de A₂″, pero a otro alejamiento: A₁″ está en la horizontal de
                  A₁′.
                ejemplo: 'desplaza(proy_planta(solucion.App), dy: mm(-10))'
              - si: siempre
                mensaje: |
                  A₁″ está en la vertical de A₂″ y en la horizontal de A₁′.
          - nombre: B1pp
            rotulo: B₁″
            pide: el vértice B en su posición final, en la planta
            es: proy_planta(solucion.Bpp)
            bien: |
              B₁″ está en la vertical de B₂″ y en la horizontal de B₁′ ≡ C₁′, como C₁″.
            diagnosticos:
              - si: en_horizontal_de(figura.punto("B1"))
                mensaje: |
                  Has usado la horizontal de B₁, la de partida, que está muy cerca. El alejamiento que
                  se conserva es el que dejó el primer giro: B₁″ está en la horizontal de B₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Bpp), dy: 0 - solucion.dyB)'
              - si: en_vertical_de(B2pp)
                mensaje: |
                  Está en la vertical de B₂″, pero a otro alejamiento: B₁″ está en la horizontal de
                  B₁′.
                ejemplo: 'desplaza(proy_planta(solucion.Bpp), dy: mm(10))'
              - si: siempre
                mensaje: |
                  B₁″ está en la vertical de B₂″ y en la horizontal de B₁′.
        # Decisión: la visibilidad es pregunta nuestra (el enunciado solo pide
        # dibujar), con el cuadrado como placa opaca y la barra como varilla; va
        # aquí, en el paso que marca la posición final, y sustituye al paso
        # dibujar que había. Sale de un cálculo de líneas ocultas aparte, por
        # rayos contra la placa, y coincide con lo que decía ese paso. En el
        # alzado la barra va sobre el lado CD de M₂″ a C₂″: los dos se parten en
        # M₂″ y en C₂″ para que sus tramos no se pisen, y así casan tanto el lado
        # entero como la barra entera.
        tramos:
          - traza: segmento2(proy_planta(solucion.App), proy_planta(solucion.Bpp))
            tipo: visto
            porque: 'AB es un lado de la placa, y en la planta nada pasa por encima de ella: la barra sale por debajo.'
          - traza: segmento2(proy_planta(solucion.Bpp), proy_planta(solucion.Cpp))
            tipo: visto
            porque: 'BC es un lado de la placa, lejos de la barra en la planta, y nada pasa por encima de la placa: desde arriba se ve.'
          - traza: segmento2(proy_planta(solucion.Cpp), proy_planta(solucion.Dpp))
            tipo: visto
            porque: 'CD es el lado del que sale la barra, en M: la barra baja desde él por debajo de la placa, y desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.Dpp), proy_planta(solucion.App))
            tipo: visto
            porque: 'DA es un lado de la placa. La barra lo cruza en la planta, pero 36,5 mm por debajo: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.Mpp), solucion.k_MN_DA)
            tipo: oculto
            porque: 'De M₁″ a A₁″D₁″, la barra cae dentro de la planta de la placa, y la placa va más alta: a mitad de ese tramo, 18,2 mm por encima. La placa la tapa.'
          - traza: segmento2(solucion.k_MN_DA, proy_planta(solucion.Npp))
            tipo: visto
            porque: 'Pasado el lado A₁″D₁″, la barra sale de la planta de la placa: de ahí a N₁″ no tiene nada encima.'
          - traza: segmento2(proy_alzado(solucion.App), proy_alzado(solucion.Bpp))
            tipo: visto
            porque: 'AB es un lado de la placa. En el alzado la barra va por la recta del lado CD, sin entrar en el contorno de la placa: nada tapa sus lados.'
          - traza: segmento2(proy_alzado(solucion.Bpp), proy_alzado(solucion.Cpp))
            tipo: visto
            porque: 'BC es un lado de la placa, y en el alzado nada pasa por delante de ella: la barra va por su borde, la recta de CD.'
          - traza: segmento2(proy_alzado(solucion.Dpp), proy_alzado(solucion.App))
            tipo: visto
            porque: 'DA es un lado de la placa, lejos de la barra en el alzado, y nada pasa por delante de la placa: se ve entero.'
          - traza: segmento2(proy_alzado(solucion.Dpp), proy_alzado(solucion.Mpp))
            tipo: visto
            porque: 'De D₂″ a M₂″, el lado CD es borde del alzado de la placa, y la barra no llega aquí: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.Mpp), proy_alzado(solucion.Cpp))
            tipo: visto
            porque: 'De M₂″ a C₂″ van juntos el lado CD y la barra, en un mismo plano de punta. La barra va por delante del lado (a mitad del tramo, 9,1 mm), y una varilla no tapa: los dos se ven.'
          - traza: segmento2(proy_alzado(solucion.Cpp), proy_alzado(solucion.Npp))
            tipo: visto
            porque: 'Pasado C₂″, la barra sigue en la recta del lado CD, fuera del contorno de la placa: nada la tapa.'
        bloques:
          - nombre: 1.er giro, eje vertical por N
            explica: |
              El segundo giro parte de donde deja el primero, así que primero se rehace: 60° en
              sentido antihorario alrededor de e, la vertical por N. La planta gira alrededor de N₁
              sin deformarse, las cotas se quedan, y N no se mueve.
          - nombre: 2.º giro, eje de punta por P
            explica: |
              El segundo giro: 60° en sentido horario alrededor de j, la recta de punta por P, que
              en el alzado es el punto P₂; el sentido se ve de frente. Ahora gira el alzado que dejó
              el primer giro, alrededor de P₂ y sin deformarse, y los alejamientos se quedan: en la
              planta cada punto se mueve en horizontal. El alejamiento que se conserva es el que
              dejó el primer giro, no el de partida. N no está en j, y esta vez se mueve.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("N1"), solucion.L_NM)
            guia: figura.segmento("AB1")
            bloque: 1.er giro, eje vertical por N
            porque: |
              El segundo giro parte de la posición que deja el primero, así que primero se rehace el
              primero, como en el paso anterior. En la planta, la barra girada: la recta de 30° por N₁,
              hacia la izquierda.
          - con: compas
            traza: 'arco(figura.punto("N1"), por: figura.punto("M1"), desde: figura.punto("M1"), hasta: proy_planta(solucion.Mp))'
            bloque: 1.er giro, eje vertical por N
            porque: |
              M₁ gira alrededor de N₁ hasta esa recta.
          - con: marca
            traza: proy_planta(solucion.Mp)
            rotulo: M₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              M₁′, el corte del arco con la recta de 30°: el extremo de la barra tras el primer giro.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Mp), solucion.L_MA), segmento2(proy_planta(solucion.Mp), solucion.L_MB)]'
            guia: segmento2(figura.punto("N1"), proy_planta(solucion.Mp))
            bloque: 1.er giro, eje vertical por N
            porque: |
              La planta del cuadrado, perpendicular a la barra por M₁′.
          - con: compas
            traza: 'arco(figura.punto("N1"), por: figura.punto("A1"), desde: figura.punto("A1"), hasta: proy_planta(solucion.Ap))'
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₁ y B₁ están a la misma distancia de N₁: el arco de centro N₁ que sale de A₁ corta la
              planta del cuadrado primero en B₁′ y, a los 60°, en A₁′.
          - con: marca
            traza: proy_planta(solucion.Ap)
            rotulo: A₁′ ≡ D₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₁′ ≡ D₁′, donde acaba el arco, a los 60°, sobre la planta del cuadrado.
          - con: marca
            traza: proy_planta(solucion.Bp)
            rotulo: B₁′ ≡ C₁′
            bloque: 1.er giro, eje vertical por N
            porque: |
              B₁′ ≡ C₁′, el primer corte del arco con la planta del cuadrado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Ap), desplaza(proy_alzado(solucion.Ap), dy: mm(-8))), segmento2(proy_planta(solucion.Bp), desplaza(proy_alzado(solucion.Bp), dy: mm(-8))), segmento2(proy_planta(solucion.Mp), desplaza(proy_alzado(solucion.Mp), dy: mm(-8)))]'
            guia: figura.segmento("MN1")
            bloque: 1.er giro, eje vertical por N
            porque: |
              Las dos proyecciones de un punto van en la misma vertical: por cada planta girada, la
              línea de referencia hacia el alzado, larga.
          - con: regla
            traza: '[segmento2(figura.punto("A2"), desplaza(proy_alzado(solucion.Ap), dx: mm(-8))), segmento2(figura.punto("D2"), desplaza(proy_alzado(solucion.Dp), dx: mm(-8)))]'
            bloque: 1.er giro, eje vertical por N
            porque: |
              Las cotas no cambian en el primer giro: A₂B₂ y D₂C₂ prolongadas hacia la izquierda.
          - con: marca
            traza: proy_alzado(solucion.Ap)
            rotulo: A₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              A₂′, el cruce de A₂B₂ prolongada con la vertical de A₁′.
          - con: marca
            traza: proy_alzado(solucion.Bp)
            bloque: 1.er giro, eje vertical por N
            porque: |
              B₂′, el cruce de A₂B₂ prolongada con la vertical de B₁′. Va sin rótulo: el suyo pisaría
              el rótulo A₂ de la lámina, que queda justo a su derecha.
          - con: marca
            traza: proy_alzado(solucion.Cp)
            bloque: 1.er giro, eje vertical por N
            porque: |
              C₂′, el cruce de D₂C₂ prolongada con la vertical de B₁′ ≡ C₁′. Va sin rótulo: el suyo
              pisaría el rótulo D₂ de la lámina, que queda justo a su derecha.
          - con: marca
            traza: proy_alzado(solucion.Dp)
            rotulo: D₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              D₂′, el cruce de D₂C₂ prolongada con la vertical de A₁′ ≡ D₁′.
          - con: marca
            traza: proy_alzado(solucion.Mp)
            rotulo: M₂′
            bloque: 1.er giro, eje vertical por N
            porque: |
              M₂′, el cruce de D₂C₂ prolongada con la vertical de M₁′. Ahora N₂, M₂′, C₂′ y D₂′ están
              en una misma horizontal, la de abajo, y eso va a ahorrar trabajo en el segundo giro.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("P2"), desplaza(figura.punto("N2"), dy: mm(6)))'
            guia: figura.segmento("MN1")
            porque: |
              N₂ ≡ M₂ no lleva marca en la lámina, y el compás del segundo giro tiene que abrirse
              hasta él. P está en el eje e, en la vertical de N (P₁ ≡ N₁): la vertical por P₂,
              paralela a M₁N₁, corta el lado D₂C₂ en N₂. Larga, más abajo del lado.
          - con: marca
            traza: figura.punto("N2")
            rotulo: N₂ ≡ M₂
            porque: |
              N₂ ≡ M₂, el cruce de la vertical de P₂ con D₂C₂: su punto medio, que es donde el
              enunciado pone M.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P2"), solucion.L_PN)
            guia: figura.segmento("CD2")
            bloque: 2.º giro, eje de punta por P
            porque: |
              El segundo giro. El eje j es de punta: en el alzado es el punto P₂, y el alzado gira
              alrededor de él. N está debajo de P, así que P₂N₂ es vertical; girada 60° en sentido
              horario, baja 30° por debajo de la horizontal, hacia la izquierda. El cartabón da los
              30°, con la escuadra sobre la horizontal C₂D₂. Larga, más allá de donde caerá N₂″.
          - con: compas
            traza: 'arco(figura.punto("P2"), por: figura.punto("N2"), desde: figura.punto("N2"), hasta: proy_alzado(solucion.Npp))'
            bloque: 2.º giro, eje de punta por P
            porque: |
              N gira en un plano frontal, y en el alzado recorre una circunferencia de centro P₂: el
              compás en P₂, abierto hasta N₂, hasta la recta de 30°.
          - con: marca
            traza: proy_alzado(solucion.Npp)
            rotulo: N₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              N₂″, el corte del arco con la recta de 30°. En el primer giro N no se movió, porque
              estaba en e; en este sí, porque no está en j.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Npp), solucion.L_ND)
            guia: segmento2(figura.punto("P2"), proy_alzado(solucion.Npp))
            bloque: 2.º giro, eje de punta por P
            porque: |
              P₂N₂ era vertical y la horizontal de abajo, la de N₂, M₂′, C₂′ y D₂′, perpendicular a
              ella. El giro no cambia los ángulos: esa horizontal girada es la perpendicular a P₂N₂″
              por N₂″. Larga, más allá de donde caerá D₂″, el más lejano.
          - con: compas
            traza: '[arco(figura.punto("P2"), por: proy_alzado(solucion.Mp), desde: proy_alzado(solucion.Mp), hasta: proy_alzado(solucion.Mpp)), arco(figura.punto("P2"), por: proy_alzado(solucion.Cp), desde: proy_alzado(solucion.Cp), hasta: proy_alzado(solucion.Cpp)), arco(figura.punto("P2"), por: proy_alzado(solucion.Dp), desde: proy_alzado(solucion.Dp), hasta: proy_alzado(solucion.Dpp))]'
            bloque: 2.º giro, eje de punta por P
            porque: |
              M, C y D giran alrededor de P₂ con sus radios P₂M₂′, P₂C₂′ y P₂D₂′, y caen en esa
              recta. Cada circunferencia corta la recta de la barra dos veces, una a cada lado de
              N₂″; vale el corte del lado trazado, de N₂″ hacia arriba, que es donde los deja el
              giro de 60° en sentido horario. El otro corte no es un giro de 60°.
          - con: marca
            traza: proy_alzado(solucion.Mpp)
            rotulo: M₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              M₂″, el corte del arco de M con la recta de la barra: el extremo de la barra girada.
          - con: marca
            traza: proy_alzado(solucion.Cpp)
            rotulo: C₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              C₂″, el corte del arco de C con la recta de la barra, entre N₂″ y M₂″: la barra sigue en
              la prolongación del lado C₂″D₂″.
          - con: marca
            traza: proy_alzado(solucion.Dpp)
            rotulo: D₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              D₂″, el corte del arco de D con la recta de la barra, al otro lado de M₂″, que es el
              punto medio de C₂″D₂″.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.Dpp), solucion.L_DA), segmento2(proy_alzado(solucion.Cpp), solucion.L_CB)]'
            guia: segmento2(proy_alzado(solucion.Npp), proy_alzado(solucion.Dpp))
            bloque: 2.º giro, eje de punta por P
            porque: |
              A₂′D₂′ y B₂′C₂′ eran verticales, perpendiculares a la horizontal de abajo, y lo siguen
              siendo después del giro: por D₂″ y por C₂″, las perpendiculares a la recta de la barra.
              Largas, más allá de donde caerán A₂″ y B₂″.
          - con: compas
            traza: '[arco(figura.punto("P2"), por: proy_alzado(solucion.Ap), desde: proy_alzado(solucion.Ap), hasta: proy_alzado(solucion.App)), arco(figura.punto("P2"), por: proy_alzado(solucion.Bp), desde: proy_alzado(solucion.Bp), hasta: proy_alzado(solucion.Bpp))]'
            bloque: 2.º giro, eje de punta por P
            porque: |
              A y B giran alrededor de P₂ con sus radios P₂A₂′ y P₂B₂′ hasta esas perpendiculares.
          - con: marca
            traza: proy_alzado(solucion.App)
            rotulo: A₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              A₂″, el corte del arco de A con la perpendicular por D₂″.
          - con: marca
            traza: proy_alzado(solucion.Bpp)
            rotulo: B₂″
            bloque: 2.º giro, eje de punta por P
            porque: |
              B₂″, el corte del arco de B con la perpendicular por C₂″.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.App), proy_alzado(solucion.Bpp)), segmento2(proy_alzado(solucion.Bpp), proy_alzado(solucion.Cpp)), segmento2(proy_alzado(solucion.Dpp), proy_alzado(solucion.App)), segmento2(proy_alzado(solucion.Dpp), proy_alzado(solucion.Cpp)), segmento2(proy_alzado(solucion.Mpp), proy_alzado(solucion.Npp))]'
            porque: |
              **El alzado, a limpio.** A₂″B₂″ une los dos vértices de arriba y cierra el alzado del
              cuadrado. Comprobación: sale paralelo a D₂″C₂″, porque el rectángulo del primer giro
              gira entero, sin deformarse. En el alzado todo se ve, en continua: la placa entera, y
              la barra de M₂″ a N₂″, en la recta del lado D₂″C₂″, con el que coincide de M₂″ a C₂″.
              La barra y CD están en un mismo plano de punta, y la barra no entra en el contorno de la
              placa.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.Npp), desplaza(proy_planta(solucion.Npp), dy: mm(5))), segmento2(proy_alzado(solucion.Mpp), desplaza(proy_planta(solucion.Mpp), dy: mm(8))), segmento2(proy_alzado(solucion.Dpp), desplaza(proy_planta(solucion.Dpp), dy: mm(8))), segmento2(proy_alzado(solucion.Cpp), desplaza(proy_planta(solucion.Cpp), dy: mm(8))), segmento2(proy_alzado(solucion.App), desplaza(proy_planta(solucion.App), dy: mm(8))), segmento2(proy_alzado(solucion.Bpp), desplaza(proy_planta(solucion.Bpp), dy: mm(8)))]'
            guia: figura.segmento("MN1")
            bloque: 2.º giro, eje de punta por P
            porque: |
              Las líneas de referencia, desde cada alzado final hacia la planta, paralelas a M₁N₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("N1"), desplaza(proy_planta(solucion.Npp), dx: mm(-5))), segmento2(proy_planta(solucion.Mp), desplaza(proy_planta(solucion.Mpp), dx: mm(-5))), segmento2(proy_planta(solucion.Ap), desplaza(proy_planta(solucion.Dpp), dx: mm(-5))), segmento2(proy_planta(solucion.Bp), desplaza(proy_planta(solucion.Cpp), dx: mm(-5)))]'
            guia: figura.segmento("AB1")
            bloque: 2.º giro, eje de punta por P
            porque: |
              Con el eje de punta el **alejamiento no cambia**, y el que vale es el que dejó el primer
              giro. Por N₁, M₁′, A₁′ ≡ D₁′ y B₁′ ≡ C₁′, las paralelas a A₁B₁ hacia la izquierda, más
              allá de las líneas de referencia.
          - con: marca
            traza: proy_planta(solucion.Npp)
            bloque: 2.º giro, eje de punta por P
            porque: |
              N₁″, el cruce de la horizontal de N₁ con la vertical de N₂″. Va sin rótulo: el punto A₁″,
              que se marca después, se lo rozaría por arriba.
          - con: marca
            traza: proy_planta(solucion.Mpp)
            rotulo: M₁″
            bloque: 2.º giro, eje de punta por P
            porque: |
              M₁″, en la horizontal de M₁′ y la vertical de M₂″.
          - con: marca
            traza: proy_planta(solucion.Dpp)
            rotulo: D₁″
            bloque: 2.º giro, eje de punta por P
            porque: |
              D₁″, en la horizontal de A₁′ ≡ D₁′ y la vertical de D₂″.
          - con: marca
            traza: proy_planta(solucion.App)
            rotulo: A₁″
            bloque: 2.º giro, eje de punta por P
            porque: |
              A₁″, en la misma horizontal que D₁″, porque A y D tienen el mismo alejamiento, y en la
              vertical de A₂″.
          - con: marca
            traza: proy_planta(solucion.Cpp)
            rotulo: C₁″
            bloque: 2.º giro, eje de punta por P
            porque: |
              C₁″, en la horizontal de B₁′ ≡ C₁′ y la vertical de C₂″.
          - con: marca
            traza: proy_planta(solucion.Bpp)
            rotulo: B₁″
            bloque: 2.º giro, eje de punta por P
            porque: |
              B₁″, en la misma horizontal que C₁″ y la vertical de B₂″.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.App), proy_planta(solucion.Bpp)), segmento2(proy_planta(solucion.Bpp), proy_planta(solucion.Cpp)), segmento2(proy_planta(solucion.Cpp), proy_planta(solucion.Dpp)), segmento2(proy_planta(solucion.Dpp), proy_planta(solucion.App))]'
            porque: |
              **La planta, a limpio.** El cuadrado, uniendo los vértices: ya no es vertical, y se ve
              como un paralelogramo, entero en continua, porque nada pasa por encima de él. M₁″ queda
              en el punto medio de C₁″D₁″, como M₂″ en el de D₂″C₂″: el cuadrado y la barra se han
              movido juntos.
          - con: regla
            traza: segmento2(proy_planta(solucion.Mpp), proy_planta(solucion.Npp))
            porque: |
              La barra, fina, con la regla, de M₁″ a N₁″: cruza el lado A₁″D₁″, y en ese cruce cambia
              su visibilidad.
          - con: arista-oculta
            traza: segmento2(proy_planta(solucion.Mpp), solucion.k_MN_DA)
            porque: |
              De M₁″ hasta donde cruza A₁″D₁″, la barra cae dentro de la planta del cuadrado, y el
              cuadrado va más alto: a mitad de ese tramo, 18,2 mm por encima. Ese tramo, el 78 % de la
              planta de la barra, a trazos.
          - con: arista-vista
            traza: segmento2(solucion.k_MN_DA, proy_planta(solucion.Npp))
            porque: |
              Y de ahí a N₁″, en continua: pasado el lado A₁″D₁″, ya no hay placa encima.
        pista: |
          (1) Rehaz el primer giro: lo necesitas, porque el segundo gira desde ahí. (2) La vertical
          por P₂ corta D₂C₂ en N₂ ≡ M₂. En el alzado, la recta de 30° por P₂ hacia la izquierda y abajo;
          con el compás en P₂, N₂ va a ella; sin cartabón, el arco de radio P₂N₂ con centro en N₂
          corta la circunferencia de N justo a 60°. (3) Por
          N₂″, la recta de 60° hacia arriba; los arcos de centro P₂ por M₂′, C₂′ y D₂′ la cortan. (4)
          Por D₂″ y C₂″, las perpendiculares; los arcos por A₂′ y B₂′. (5) Las plantas, en las
          horizontales que dejó el primer giro. (6) En el alzado todo se ve. En la planta, la barra
          pasa por debajo de la placa de M₁″ hasta A₁″D₁″, y ese tramo va a trazos.
        desarrollo: |
          En verde claro, la posición final, con lo oculto a trazos. En el alzado, el rectángulo
          del primer giro girado 60° alrededor de P₂, con la barra en la recta del lado D₂″C₂″,
          de M₂″ a más allá de C₂″, todo en continua: la barra y el lado CD están en un mismo plano
          de punta, que en el alzado se ve como una recta, y la barra va por el borde del alzado de
          la placa, sin entrar en él. En la planta, el cuadrado, que ya no es vertical, se ve como un
          paralelogramo, entero en continua: nada pasa por encima de él. La barra sale de M₁″, en
          el punto medio de C₁″D₁″, y pasa por debajo del cuadrado hasta el lado A₁″D₁″: ese tramo,
          el 78 % de su planta, a trazos, porque el cuadrado va más alto (a mitad del tramo, 18,2 mm
          por encima). De A₁″D₁″ a N₁″, en continua. M₁″ y M₂″ en el punto medio de CD son la
          comprobación de que el cuadrado y la barra se han movido juntos.

      # Decisión: el enunciado solo pide dibujar. Este calcular comprueba la
      # posición final con una cifra atada a la receta, y caza el error que el
      # dibujo invita a cometer: leer el ángulo en el alzado, donde la barra se
      # ve a 60° sin ser frontal. Se resuelve con el triángulo del tema 2.
      - tipo: calcular
        titulo: El ángulo de la barra con el plano horizontal, al final
        pregunta: Con la barra en su posición final, ¿qué ángulo forma con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '48.59'
          receta: ang_barra_ph
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '60'
            receta: ang_barra_alzado
            mensaje: |
              Ese es el ángulo que **ves en el alzado**, entre N₂″M₂″ y la horizontal: el del giro.
              Pero la barra no es frontal —se acerca al plano vertical a la vez que sube—, y el
              alzado no da su ángulo de verdad.
          - valor: '41.41'
            receta: 90 - ang_barra_ph
            mensaje: |
              Ese es el **complementario**: el ángulo de la barra con la vertical. Con el plano
              horizontal es el otro ángulo agudo del triángulo.
          - valor: '30'
            receta: angulo_con_pv(segmento3(solucion.Mpp, solucion.Npp))
            mensaje: |
              Ese es el ángulo de la barra con el plano **vertical**, el que dejó el primer giro: el
              segundo, de eje de punta, no lo cambia. Se pedía con el plano horizontal.
        pista: |
          La barra no cambia de longitud al girar: mide lo que medía su planta de partida, M₁N₁,
          porque era horizontal. Su diferencia de cotas al final se lee en el alzado, entre M₂″ y
          N₂″. Con esos dos datos, el triángulo del tema 2.
        desarrollo: |
          La barra mide 35,18 mm: era horizontal y de punta, así que su planta de partida está en
          verdadera magnitud. Al final, M₂″ queda 26,38 mm por encima de N₂″ en el alzado. En el
          triángulo de la verdadera magnitud, esa diferencia de cotas es el cateto opuesto al ángulo
          con el plano horizontal:

          $$ \sin\alpha = \frac{26{,}38}{35{,}18} \quad\Rightarrow\quad \alpha \approx 48{,}6^{\circ} $$

          Ojo con el transportador en la planta final: A₁″D₁″ es horizontal en el papel (A″ y D″
          tienen el mismo alejamiento), y la barra la corta a 49,1°. Es lo que mide quien busca el
          ángulo con el plano horizontal en la planta, entre la barra y una horizontal: queda a 0,5°
          de la respuesta, justo en el borde de la tolerancia, y la casilla puede darlo por bueno.
          Pero es un ángulo de la planta, no el que forma la barra con el plano horizontal.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El eje e es vertical, así que en el primer giro la planta gira 60° en sentido antihorario alrededor de N₁ y cada alzado se mueve en horizontal.
          - texto: N está en e y no se mueve en el primer giro; M y el cuadrado sí.
          - texto: El eje j es de punta, así que en el segundo giro el alzado que dejó el primero gira 60° en sentido horario alrededor de P₂, y cada planta se mueve en horizontal.
          - texto: En el segundo giro N también se mueve, porque no está en j, y cada planta conserva el alejamiento que dejó el primer giro.
          - texto: Los dos giros se pueden hacer en cualquier orden, porque el resultado es el mismo.
            trampa: true
            mensaje: |
              En general no se pueden cambiar de orden, y estos tampoco: si giras primero alrededor
              de j, N sale del eje e, y el giro alrededor de e también lo mueve. La barra y el
              cuadrado acaban en otro sitio, entre 27 y 63 mm más allá.

    resolucion: |
      **Los dos ejes.** e es vertical por N («de punta al plano horizontal»): en la planta es el
      punto N₁. j es de punta por P: en el alzado es el punto P₂. P está en la vertical de N, así que
      P también está en e. Cada giro mueve los puntos en planos perpendiculares a su eje, y su sentido
      se ve en la vista donde el eje es un punto: el primero, desde arriba; el segundo, de frente.

      **El primer giro.** La planta gira 60° en sentido antihorario alrededor de N₁ sin deformarse:
      la barra, que subía en vertical, queda a 30° sobre la horizontal, hacia la izquierda, y el
      cuadrado sigue perpendicular a ella, A₁′ ≡ D₁′ y B₁′ ≡ C₁′, porque sigue siendo vertical. Las
      cotas no cambian: cada alzado se mueve en horizontal hasta la vertical de su planta girada. El
      cuadrado se ve ahora más estrecho en el alzado, y la barra, horizontal, en la prolongación de su
      lado de abajo. N no se mueve.

      **El segundo giro.** Gira el alzado que dejó el primero, 60° en sentido horario alrededor de
      P₂. P₂N₂ era vertical y baja 30° por debajo de la horizontal; la horizontal de la barra y del
      lado de abajo sube 60° desde N₂″, y los lados verticales quedan a 30°. Los alejamientos no
      cambian: cada planta va en la horizontal que dejó el primer giro y en la vertical de su alzado
      final. Al final, el cuadrado no es vertical: en la planta se ve como un paralelogramo.

      **La visibilidad.** En la planta final, la barra cruza el cuadrado desde M₁″ hasta el lado
      A₁″D₁″, y en ese tramo el cuadrado está más alto: hemos comparado las cotas de los dos en un
      mismo punto de la planta, a mitad de ese tramo, y el cuadrado queda 18 mm por encima. Ese
      tramo de la barra va en discontinuo. En el alzado la barra cae en la recta de D₂″C₂″ y no
      tapa nada.

      **El ángulo de la barra.** Mide 35,18 mm, como al principio, y M₂″ queda 26,38 mm por encima
      de N₂″: forma 48,6° con el plano horizontal. En el alzado se ve a 60°, pero no es frontal.

  - id: sd20-el-poste-que-se-endereza
    titulo: El poste que se endereza tirando de dos cuerdas
    fuente: Ejercicio 16 (SD20) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 17).
    enunciado: |
      Un poste PQ, inicialmente inclinado, es enderezado tirando con dos cuerdas inextensibles AP y
      BP. La dirección de tiro de cada cuerda será siempre la marcada por su correspondiente
      proyección horizontal, manteniéndose los puntos A y B en un mismo plano horizontal. Hallar las
      posiciones de las cuerdas cuando el poste quede vertical.

      **Notas nuestras.** La figura es el poste y las dos cuerdas en el alzado, arriba, y en la
      planta, debajo. Q es el pie del poste y P, su punta, de donde salen las dos cuerdas: Q₁P₁, la
      planta del poste, es horizontal en el papel. A₂ y B₂ están a la misma altura, la del plano
      horizontal en que se quedan A y B. Arriba a la derecha, un croquis en perspectiva enseña el
      poste y a dos personas que tiran desde A y desde B: es ilustración. Leemos «la dirección de
      tiro» como la recta por la que camina quien tira, la planta de su cuerda: A₁P₁ para A y B₁P₁
      para B. Los nombres de las posiciones finales (P₂′, A₁′, A₂′, B₁′, B₂′) y de los puntos
      auxiliares son nuestros.
    pide: La punta del poste ya vertical y las posiciones finales de A y de B en las dos vistas, con las cuerdas, y cuánto ha retrocedido A.
    receta:
      lamina: sd20
      escena:
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
      solucion:
        # Decisión: el poste se endereza girando alrededor de su pie Q, en su
        # propio plano, que es frontal (Q₁P₁ es horizontal): el eje es la recta
        # de punta por Q. Gira lo que le falta para quedar vertical, 90° menos
        # su ángulo con el plano horizontal; de los dos sentidos, el que sube
        # la punta. El enunciado no fija el eje: lo dice el intro.
        Qp: 'punto3(alzado: figura.punto("Q2"), planta: desplaza(figura.punto("Q1"), dy: 50))'
        punta: recta3(Q, Qp)
        giro: 90 - angulo_con_ph(segmento3(Q, P))
        Pv: 'gira(P, punta, angulo: giro, sentido: ascendente)'
        Qv: 'punto3(alzado: desplaza(figura.punto("Q2"), dy: -50), planta: figura.punto("Q1"))'
        # La horizontal de A y B en el alzado: su cota, que no cambia. M₂ es
        # el punto del poste a esa cota, y P2h, el de la vertical de P₂.
        hAB: 'segmento2(figura.punto("B2"), figura.punto("A2"))'
        M2: 'pie_perpendicular(figura.punto("Q2"), hAB)'
        P2h: 'pie_perpendicular(figura.punto("P2"), hAB)'
        # La verdadera magnitud de cada cuerda, con un giro de eje vertical por
        # P hasta dejarla frontal: (A₁) en la horizontal de P₁, a la izquierda,
        # a la distancia P₁A₁, y (A₂) en la horizontal de A₂. Lo mismo con B.
        Ag1: 'uno(medir_sobre(figura.segmento("QP1"), desde: figura.punto("P1"), distancia: vm_planta(A, P)), 2)'
        Ag2: pie_perpendicular(Ag1, hAB)
        Bg1: 'uno(medir_sobre(figura.segmento("QP1"), desde: figura.punto("P1"), distancia: vm_planta(B, P)), 2)'
        Bg2: pie_perpendicular(Bg1, hAB)
        # Decisión: «la dirección de tiro de cada cuerda será siempre la marcada
        # por su correspondiente proyección horizontal». Quien tira de A camina
        # por la recta A₁P₁ y no cambia de cota: rA es la horizontal por A con
        # esa planta, que pasa por la vertical de P₁ (Ah); la de B, por B₁P₁,
        # pasa por el mismo Ah, porque A y B tienen la misma cota.
        Ah: 'punto3(alzado: P2h, planta: figura.punto("P1"))'
        rA: recta3(A, Ah)
        rB: recta3(B, Ah)
        # A′ está en rA a la longitud de la cuerda de P′: desde el pie de la
        # perpendicular de P′ a rA, a la raíz de AP² menos la distancia de P′ a
        # rA al cuadrado. Los dos cortes son una elección de la función; vale
        # el de más allá de A (rama 2), porque quien tira se aleja del poste, y
        # el otro, junto a P₁, se diagnostica.
        FA: pie_perpendicular(Pv, rA)
        Ax: 'punto_a_distancia(rA, desde: FA, distancia: raiz(vm(A, P) * vm(A, P) - vm(Pv, FA) * vm(Pv, FA)))'
        Ar: rama(Ax, 2)
        FB: pie_perpendicular(Pv, rB)
        Bx: 'punto_a_distancia(rB, desde: FB, distancia: raiz(vm(B, P) * vm(B, P) - vm(Pv, FB) * vm(Pv, FB)))'
        Br: rama(Bx, 2)
        # Para la construcción paso a paso: la planta de cada cuerda final, ρ,
        # cateto del triángulo que tiene la verdadera magnitud por hipotenusa y
        # lo que P′ está por encima de A por el otro; y (A₂′), la cuerda final
        # girada alrededor del poste hasta quedar frontal, en la horizontal de
        # A₂ y a ρ de M₂, a la izquierda.
        rhoA: 'raiz(vm(A, P) * vm(A, P) - diferencia_de_cotas(Pv, A) * diferencia_de_cotas(Pv, A))'
        rhoB: 'raiz(vm(B, P) * vm(B, P) - diferencia_de_cotas(Pv, B) * diferencia_de_cotas(Pv, B))'
        rotA2: 'uno(medir_sobre(hAB, desde: M2, distancia: rhoA), 2)'
        rotB2: 'uno(medir_sobre(hAB, desde: M2, distancia: rhoB), 2)'
        # Los errores que se diagnostican, construidos. QA es el punto del
        # poste a la cota de A; su distancia a rA es la de Q₁ a la recta A₁P₁.
        # · La planta de la cuerda conservada (o la cota de P sin subir, que da
        #   el mismo radio): desde Q₁, lo que medía P₁A₁.
        # · La verdadera magnitud llevada en la planta, como si la cuerda nueva
        #   fuera horizontal.
        # · La cuerda paralela a como estaba: desde Q₁, en la dirección de P₁A₁.
        QA: 'punto3(alzado: M2, planta: figura.punto("Q1"))'
        Ae_planta: 'rama(punto_a_distancia(rA, desde: FA, distancia: raiz(vm_planta(A, P) * vm_planta(A, P) - vm(QA, FA) * vm(QA, FA))), 2)'
        Ae_vm: 'rama(punto_a_distancia(rA, desde: FA, distancia: raiz(vm(A, P) * vm(A, P) - vm(QA, FA) * vm(QA, FA))), 2)'
        Ae_par: 'uno(medir_sobre(perpendicular(por: figura.punto("Q1"), a: perpendicular(por: figura.punto("Q1"), a: figura.segmento("AP1"))), desde: figura.punto("Q1"), distancia: rhoA), 1)'
        Ae_par3: 'punto3(alzado: pie_perpendicular(Ae_par, hAB), planta: Ae_par)'
        Be_planta: 'rama(punto_a_distancia(rB, desde: FB, distancia: raiz(vm_planta(B, P) * vm_planta(B, P) - vm(QA, FB) * vm(QA, FB))), 2)'
        Be_vm: 'rama(punto_a_distancia(rB, desde: FB, distancia: raiz(vm(B, P) * vm(B, P) - vm(QA, FB) * vm(QA, FB))), 2)'
        Be_par: 'uno(medir_sobre(perpendicular(por: figura.punto("Q1"), a: perpendicular(por: figura.punto("Q1"), a: figura.segmento("BP1"))), desde: figura.punto("Q1"), distancia: rhoB), 1)'
        # Las rectas del tiro en la planta y las verticales, para los
        # diagnósticos.
        tiroA: linea(figura.segmento("AP1"))
        tiroB: linea(figura.segmento("BP1"))
        verticalQ2: 'perpendicular(por: figura.punto("Q2"), a: figura.segmento("QP1"))'
        # Las cifras del calcular.
        retroceso_A_mm: en_mm(vm(A, Ar))
        err_planta_mm: en_mm(vm(A, Ae_planta))
        err_vm_mm: en_mm(vm(A, Ae_vm))
        err_par_mm: en_mm(vm(A, Ae_par3))
      comprueba:
        # El poste enderezado es vertical, y A′ y B′ siguen en el plano
        # horizontal de A y B, en sus rectas del tiro.
        - en_recta(Pv, recta3(Q, Qv))
        - en_recta(Ar, rA)
        - en_recta(Br, rB)
    pasos:
      - tipo: reconocer
        pregunta: Antes de mover nada, Q₁P₁, la planta del poste, es horizontal en el papel. ¿Qué dice eso del poste, y con qué giro se endereza?
        opciones:
          - texto: PQ es frontal; se endereza girando alrededor de la recta de punta por Q, y su alzado conserva la verdadera magnitud en todo el giro
            correcta: true
            mensaje: |
              Eso es. Una planta horizontal en el papel dice que el poste no cambia de alejamiento:
              es una recta frontal, y Q₂P₂ es su verdadera magnitud. Al enderezarse gira en su propio
              plano, que es frontal, alrededor de su pie: el eje es la recta de punta por Q, que en el
              alzado es el punto Q₂. P₂ va por un arco de centro Q₂, y en la planta P₁ va en
              horizontal hasta Q₁.
          - texto: PQ es horizontal, y Q₁P₁ es su verdadera magnitud; por eso el poste se endereza trabajando solo en la planta, sin mirar el alzado
            mensaje: |
              Horizontal sería con el alzado horizontal: no cambiaría de cota. Aquí lo horizontal en el
              papel es la planta, y eso dice que no cambia de alejamiento: es frontal. Q₁P₁ acorta el
              poste; su verdadera magnitud es Q₂P₂.
          - texto: Se endereza con un giro de eje vertical por Q, llevando P₁ por un arco de centro Q₁ hasta dejar el poste de pie
            mensaje: |
              Un giro de eje vertical no cambia las cotas: la punta P daría vueltas a la misma altura y
              el poste nunca quedaría vertical. Para levantarlo, el eje tiene que ser horizontal y
              perpendicular al plano del poste: la recta de punta por Q.

      - tipo: construir
        titulo: El poste vertical y las cuerdas en su sitio
        intro: |
          El enunciado no impone método; lo resolvemos con giros, que es lo que pide un objeto que se
          mueve. El poste gira alrededor de su pie Q en su propio plano, que es frontal: el eje es la
          recta de punta por Q, el punto Q₂ en el alzado. Como leemos el enunciado, quien tira de A
          camina por la recta A₁P₁, alejándose del poste y sin cambiar de cota, y quien tira de B, por
          B₁P₁. Las cuerdas no se estiran: su verdadera magnitud sale de girarlas hasta dejarlas
          frontales. Marca la punta del poste vertical, P₂′, y A y B en su sitio final, en las dos
          vistas. Avisos para el imán, y
          amplía con la lupa antes de crear cada punto: A₂′ cae a 0,24 mm de B₂, casi encima, y vale
          el cruce que caiga, pero 2,7 mm más arriba su vertical corta una de las cuerdas giradas de
          la construcción, y ese cruce no vale; B₂′ cae a 3,6 mm de otro cruce de la horizontal de
          A₂, el del arco con que se mide la cuerda de A.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P2p
            rotulo: P₂′
            pide: la punta del poste ya vertical, en el alzado
            es: proy_alzado(solucion.Pv)
            bien: |
              P₂′ está en la vertical de Q₂, a la distancia Q₂P₂ por encima: el poste ha girado 45°
              alrededor de la recta de punta por Q sin cambiar de longitud, 54,1 mm. En la planta, el
              poste vertical se reduce a un punto: P₁′ ≡ Q₁.
            diagnosticos:
              - si: 'en_vertical_de(figura.punto("Q2")) && a_distancia(de: figura.punto("Q2"), d: diferencia_de_cotas(P, Q))'
                mensaje: |
                  Te has quedado a la altura de P₂: has llevado P₂ en horizontal hasta la vertical de Q₂,
                  o has tomado la planta Q₁P₁, que aquí mide lo mismo. Así el poste se acorta. Al
                  enderezarse gira alrededor de Q sin cambiar de longitud: con centro en Q₂ y radio
                  Q₂P₂, que es su verdadera magnitud porque PQ es frontal.
                ejemplo: 'pie_perpendicular(figura.punto("P2"), solucion.verticalQ2)'
              - si: '!en_recta(solucion.verticalQ2)'
                mensaje: |
                  El poste vertical tiene el alzado en la **vertical de Q₂**, su pie: P₂′ está encima de
                  Q₂, en la misma línea de referencia.
                ejemplo: 'desplaza(proy_alzado(solucion.Pv), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de Q₂, pero no a la altura buena. El poste mide lo mismo de pie que
                  inclinado: con centro en Q₂ y radio Q₂P₂, el arco que sale de P₂ corta la vertical en
                  P₂′.
          - nombre: A1p
            rotulo: A₁′
            pide: A en su sitio final, en la planta
            es: proy_planta(solucion.Ar)
            bien: |
              A₁′ está en la recta A₁P₁, 17,6 mm más allá de A₁, y a 40,0 mm de Q₁: esa es la planta
              de la cuerda nueva, que baja de P′ a A. La cuerda ha cambiado de dirección en la planta,
              de A₁P₁ a A₁′Q₁; lo que no ha cambiado es la dirección del tiro.
            diagnosticos:
              - si: cerca_de(proy_planta(rama(solucion.Ax, 1)))
                mensaje: |
                  Ese punto está a la distancia buena de Q₁, pero en el otro corte del arco con la recta
                  A₁P₁, junto a P₁, al otro lado del poste. Quien tira se aleja del poste: A₁′ está más
                  allá de A₁.
                ejemplo: proy_planta(rama(solucion.Ax, 1))
              - si: cerca_de(solucion.Ae_par)
                mensaje: |
                  Has dejado la cuerda paralela a como estaba: desde Q₁, en la dirección de P₁A₁. Leemos
                  la dirección del tiro como el camino de quien tira, no la dirección de la cuerda: quien
                  tira camina por la recta A₁P₁, y A₁′ está en ella. La cuerda nueva va de A₁′ a Q₁, y en
                  la planta cambia de dirección.
                ejemplo: solucion.Ae_par
              - si: 'en_recta(solucion.tiroA) && a_distancia(de: figura.punto("Q1"), d: vm_planta(A, P))'
                mensaje: |
                  Has llevado desde Q₁ lo que medía la planta de la cuerda, A₁P₁ (o has usado la cota de P
                  antes de enderezar el poste, que da lo mismo). La planta cambia: P sube 15,8 mm al
                  ponerse el poste vertical, la cuerda se empina y su planta se acorta. Lo que se conserva
                  es la verdadera magnitud.
                ejemplo: proy_planta(solucion.Ae_planta)
              - si: 'en_recta(solucion.tiroA) && a_distancia(de: figura.punto("Q1"), d: vm(A, P))'
                mensaje: |
                  Has llevado la verdadera magnitud de la cuerda en la planta, desde Q₁: eso valdría si la
                  cuerda nueva fuera horizontal. Baja de P′ a A, y su planta es un cateto: el del
                  triángulo que tiene la verdadera magnitud por hipotenusa y lo que P′ está por encima
                  de A por el otro.
                ejemplo: proy_planta(solucion.Ae_vm)
              - si: '!en_recta(solucion.tiroA)'
                mensaje: |
                  A₁′ está en la **recta A₁P₁**, prolongada más allá de A₁: es la dirección del tiro, y A
                  no se sale de ella.
                ejemplo: 'desplaza(proy_planta(solucion.Ar), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la recta del tiro, pero no a la distancia buena de Q₁. La planta de la cuerda
                  nueva sale del triángulo del alzado: con centro en P₂′ y la verdadera magnitud de AP,
                  el arco corta la horizontal de A₂; de ahí a M₂ es la planta, y con ella y centro en
                  Q₁ se corta la recta del tiro.
          - nombre: A2p
            rotulo: A₂′
            pide: A en su sitio final, en el alzado
            es: proy_alzado(solucion.Ar)
            bien: |
              A₂′ está en la vertical de A₁′ y en la horizontal de A₂, porque A no cambia de cota. Cae a
              0,24 mm de B₂: es casualidad de la figura, no un error. La cuerda nueva va de A₂′ a P₂′.
            diagnosticos:
              - si: '!en_vertical_de(A1p)'
                mensaje: |
                  A₂′ va en la **vertical de A₁′**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.Ar), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("A2"))'
                mensaje: |
                  A no cambia de cota: se queda en el mismo plano horizontal, y A₂′ está en la horizontal
                  de A₂, que es también la de B₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Ar), dy: mm(8))'
              - si: siempre
                mensaje: |
                  A₂′ está en la vertical de A₁′ y a la altura de A₂, casi encima de B₂.
          - nombre: B1p
            rotulo: B₁′
            pide: B en su sitio final, en la planta
            es: proy_planta(solucion.Br)
            bien: |
              B₁′ está en la recta B₁P₁, 23,1 mm más allá de B₁, y a 59,8 mm de Q₁, la planta de la
              cuerda nueva de B. B retrocede más que A: su cuerda, más larga y más tendida, acorta menos
              su planta cuando sube P.
            diagnosticos:
              - si: cerca_de(solucion.Be_par)
                mensaje: |
                  Has dejado la cuerda paralela a como estaba, desde Q₁ en la dirección de P₁B₁. Leemos la
                  dirección del tiro como el camino de quien tira, no la dirección de la cuerda: B camina
                  por la recta B₁P₁, y B₁′ está en ella.
                ejemplo: solucion.Be_par
              - si: 'en_recta(solucion.tiroB) && a_distancia(de: figura.punto("Q1"), d: vm_planta(B, P))'
                mensaje: |
                  Has llevado desde Q₁ lo que medía B₁P₁, la planta de la cuerda de antes (o has usado la
                  cota de P sin subir). La cuerda se empina al subir P, y su planta se acorta.
                ejemplo: proy_planta(solucion.Be_planta)
              - si: 'en_recta(solucion.tiroB) && a_distancia(de: figura.punto("Q1"), d: vm(B, P))'
                mensaje: |
                  Has llevado la verdadera magnitud de BP en la planta: la cuerda nueva no es horizontal,
                  y su planta es el cateto del triángulo que tiene la verdadera magnitud por hipotenusa.
                ejemplo: proy_planta(solucion.Be_vm)
              - si: '!en_recta(solucion.tiroB)'
                mensaje: |
                  B₁′ está en la **recta B₁P₁**, prolongada más allá de B₁: es la dirección del tiro de B.
                ejemplo: 'desplaza(proy_planta(solucion.Br), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la recta del tiro de B, pero no a la distancia buena de Q₁: la planta de la
                  cuerda nueva, M₂(B₂′), sale del triángulo del alzado con la verdadera magnitud de BP.
          - nombre: B2p
            rotulo: B₂′
            pide: B en su sitio final, en el alzado
            es: proy_alzado(solucion.Br)
            bien: |
              B₂′ está en la vertical de B₁′ y en la horizontal de B₂. Con A₂′ y P₂′, las dos cuerdas
              del poste vertical.
            diagnosticos:
              - si: '!en_vertical_de(B1p)'
                mensaje: |
                  B₂′ va en la **vertical de B₁′**.
                ejemplo: 'desplaza(proy_alzado(solucion.Br), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("B2"))'
                mensaje: |
                  B no cambia de cota: B₂′ está en la horizontal de B₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Br), dy: mm(8))'
              - si: siempre
                mensaje: |
                  B₂′ está en la vertical de B₁′ y a la altura de B₂.
        trazado:
          - 'segmento2(figura.punto("Q2"), proy_alzado(solucion.Pv))'
          - 'segmento2(figura.punto("A1"), proy_planta(solucion.Ar))'
          - 'segmento2(figura.punto("B1"), proy_planta(solucion.Br))'
          - 'segmento2(proy_alzado(solucion.Pv), proy_alzado(solucion.Ar))'
          - 'segmento2(proy_alzado(solucion.Pv), proy_alzado(solucion.Br))'
          - 'segmento2(figura.punto("Q1"), proy_planta(solucion.Ar))'
          - 'segmento2(figura.punto("Q1"), proy_planta(solucion.Br))'
        bloques:
          - nombre: Giro del poste, eje de punta por Q
            explica: |
              El método y el eje son nuestros: el enunciado no los da. Q₁P₁ es horizontal en el
              papel, así que el poste es frontal, y se endereza
              [girando](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-giro-mover-la-figura)
              en su plano alrededor del eje de punta por su pie Q, que en el alzado es el punto Q₂.
              P₂ va por un arco de centro Q₂ hasta la vertical de Q₂, sin que el poste se acorte.
              Los alejamientos se quedan: en la planta, P₁ va en horizontal hasta Q₁, y el poste
              vertical se ve como un punto.
          - nombre: Giro de las cuerdas, eje vertical por P
            explica: |
              Las cuerdas no se estiran, y hace falta su longitud de verdad. La sacamos, por
              elección nuestra, girando cada cuerda alrededor del eje vertical por P hasta dejarla
              frontal, con la planta en la horizontal de P₁: entonces el alzado la da sin acortar.
              Las cotas se quedan, así que A y B girados siguen en la horizontal de A₂. Cada cuerda
              gira su propio ángulo: son dos rectas que se giran por separado, no una figura que se
              mueve entera.
          - nombre: Cuerdas nuevas, giro alrededor del poste
            explica: |
              Con el poste vertical, cada cuerda baja de P′ a la cota de A y de B, y mide lo mismo
              que antes. Para ver cuánto ocupa en la planta, la giramos, también por elección
              nuestra, alrededor del poste hasta dejarla frontal: en el alzado va de P₂′ a la
              horizontal de A₂, y lo que su extremo se aparta de M₂ es su planta. Al deshacer el
              giro, esa planta es el radio con que gira alrededor de Q₁ hasta la recta del tiro,
              como leemos el enunciado, y la cota se queda.
        construccion:
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("Q2"), desplaza(proy_alzado(solucion.Pv), dy: -12))'
            guia: figura.segmento("QP1")
            bloque: Giro del poste, eje de punta por Q
            porque: |
              Por Q₂, la **vertical**, larga, hacia arriba: el poste vertical tiene el alzado en la
              vertical de su pie, y la planta, en Q₁.
          - con: compas
            traza: 'arco(figura.punto("Q2"), por: figura.punto("P2"), desde: figura.punto("P2"), hasta: proy_alzado(solucion.Pv))'
            bloque: Giro del poste, eje de punta por Q
            porque: |
              El poste gira alrededor de la recta de punta por Q, que en el alzado es Q₂. Con centro en
              Q₂ y radio Q₂P₂, el arco desde P₂ hasta la vertical: PQ es frontal, así que Q₂P₂ es su
              verdadera magnitud y el poste gira 45° sin acortarse.
          - con: marca
            traza: proy_alzado(solucion.Pv)
            rotulo: P₂′
            bloque: Giro del poste, eje de punta por Q
            porque: |
              P₂′, donde el arco corta la vertical de Q₂: la punta del poste enderezado, 54,1 mm por
              encima de Q₂.
          - con: marca
            traza: figura.punto("Q1")
            bloque: Giro del poste, eje de punta por Q
            porque: |
              Aquí, en Q₁, está P₁′ ≡ Q₁: en la planta, P₁ va por Q₁P₁ hasta Q₁, porque con el eje de punta
              los alejamientos no cambian, y el poste vertical se ve como un punto. El rótulo de la
              lámina, Q₁, ya lo nombra.
          - con: regla
            traza: 'segmento2(figura.punto("Q1"), desplaza(solucion.Bg1, dx: -12))'
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              La recta P₁Q₁ es horizontal en el papel. Prolongada con la regla más allá de Q₁, larga, es
              la horizontal por P₁, donde caen las plantas de las cuerdas cuando se giran hasta quedar
              frontales.
          - con: compas
            traza: 'arco(figura.punto("P1"), por: figura.punto("A1"), desde: figura.punto("A1"), hasta: solucion.Ag1)'
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              La verdadera magnitud de la cuerda AP, con un giro de eje vertical por P: con centro en P₁
              y radio P₁A₁, A₁ gira hasta la horizontal de P₁. La cuerda queda frontal, y su alzado
              enseñará su longitud.
          - con: marca
            traza: solucion.Ag1
            rotulo: (A₁)
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              (A₁), donde el arco corta la horizontal de P₁: la planta de A con la cuerda girada, a 52,0
              mm de P₁.
          - con: compas
            traza: 'arco(figura.punto("P1"), por: figura.punto("B1"), desde: figura.punto("B1"), hasta: solucion.Bg1)'
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              Lo mismo con la cuerda BP: con centro en P₁ y radio P₁B₁, B₁ gira hasta la misma
              horizontal.
          - con: marca
            traza: solucion.Bg1
            rotulo: (B₁)
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              (B₁), donde ese arco corta la horizontal de P₁, a 68,4 mm de P₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B2"), desplaza(solucion.rotB2, dx: -12)), segmento2(figura.punto("B2"), desplaza(solucion.P2h, dx: 12))]'
            guia: figura.segmento("QP1")
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              Por B₂, la horizontal, larga, hacia los dos lados: pasa por A₂, y es la cota de A y de B,
              que no cambia ni al girar las cuerdas ni al tirar.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.Ag1, desplaza(solucion.Ag2, dy: -8)), segmento2(solucion.Bg1, desplaza(solucion.Bg2, dy: -8))]'
            guia: figura.segmento("QP1")
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              Las líneas de referencia de (A₁) y de (B₁), verticales, hasta pasar la horizontal de A₂:
              con el eje vertical las cotas no cambian, y A y B girados siguen a su altura.
          - con: marca
            traza: solucion.Ag2
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              (A₂), donde la vertical de (A₁) corta la horizontal de A₂: el alzado de A con la cuerda
              girada hasta quedar frontal. Va sin rótulo en el dibujo, que pisaría el de A₂.
          - con: marca
            traza: solucion.Bg2
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              (B₂), donde la vertical de (B₁) corta la misma horizontal. También sin rótulo en el dibujo:
              pisaría el de A₂′, que cae a su derecha.
          - con: regla
            traza: '[segmento2(figura.punto("P2"), solucion.Ag2), segmento2(figura.punto("P2"), solucion.Bg2)]'
            rotulo: VM
            bloque: Giro de las cuerdas, eje vertical por P
            porque: |
              P₂(A₂) y P₂(B₂) son las dos cuerdas frontales, y su alzado es su verdadera magnitud: 58,4 mm
              la de A y 73,5 mm la de B. Son inextensibles: medirán lo mismo con el poste vertical.
          - con: marca
            traza: solucion.M2
            rotulo: M₂
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              M₂, donde la vertical de Q₂ corta la horizontal de A₂: el punto del poste vertical que está
              a la cota de A y de B. P₂′ queda 42,6 mm por encima de él.
          - con: compas
            traza: 'arco(proy_alzado(solucion.Pv), por: solucion.rotA2, desde: desplaza(solucion.rotA2, dx: 4, dy: 4), hasta: desplaza(solucion.rotA2, dx: -4, dy: -4))'
            toma: segmento2(figura.punto("P2"), solucion.Ag2)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              Con el compás, la verdadera magnitud de AP, de P₂ a (A₂), y centro en P₂′: el arco hasta
              la horizontal de A₂. Es la cuerda nueva girada alrededor del poste hasta quedar frontal:
              el triángulo P₂′M₂(A₂′) tiene la cuerda por hipotenusa, lo que P′ sube sobre A por cateto
              vertical, y su cateto horizontal es la planta de la cuerda nueva. El arco corta la
              horizontal dos veces, una a cada lado del poste, y las dos dan la misma planta: aquí, la
              de la izquierda.
          - con: marca
            traza: solucion.rotA2
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              (A₂′), donde el arco corta la horizontal: M₂(A₂′), 40,0 mm, es lo que mide en la planta la
              cuerda de A con el poste vertical. Sin rótulo en el dibujo, porque pisaría el de B₂′, que
              cae 3,6 mm a su izquierda.
          - con: compas
            traza: 'arco(proy_alzado(solucion.Pv), por: solucion.rotB2, desde: desplaza(solucion.rotB2, dx: 3.5, dy: 5), hasta: desplaza(solucion.rotB2, dx: -3.5, dy: -5))'
            toma: segmento2(figura.punto("P2"), solucion.Bg2)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              Lo mismo con la cuerda de B: su verdadera magnitud, de P₂ a (B₂), con centro en P₂′, hasta
              la horizontal de A₂, por la izquierda.
          - con: marca
            traza: solucion.rotB2
            rotulo: (B₂′)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              (B₂′), donde ese arco corta la horizontal: M₂(B₂′), 59,8 mm, la planta de la cuerda de B
              con el poste vertical.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), uno(medir_sobre(figura.segmento("AP1"), desde: proy_planta(solucion.Ar), distancia: 10), 2)), segmento2(figura.punto("B1"), uno(medir_sobre(figura.segmento("BP1"), desde: proy_planta(solucion.Br), distancia: 10), 2))]'
            porque: |
              Las rectas A₁P₁ y B₁P₁, prolongadas con la regla más allá de A₁ y de B₁, largas: son la
              dirección del tiro. Quien tira de A camina por la suya alejándose del poste, sin cambiar de
              cota, y lo mismo quien tira de B.
          - con: compas
            traza: 'arco(figura.punto("Q1"), por: proy_planta(solucion.Ar), desde: desplaza(proy_planta(solucion.Ar), dx: 5, dy: 3.5), hasta: desplaza(proy_planta(solucion.Ar), dx: -5, dy: -3.5))'
            toma: segmento2(solucion.M2, solucion.rotA2)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              Con esa planta, M₂(A₂′), y centro en Q₁, que es la planta del poste y de P′, el arco hasta
              la recta del tiro de A. La circunferencia corta la recta A₁P₁ dos veces: vale el corte de
              más allá de A₁, porque quien tira se aleja; el otro cae junto a P₁, al otro lado del
              poste.
          - con: marca
            traza: proy_planta(solucion.Ar)
            rotulo: A₁′
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              A₁′, donde el arco corta la recta del tiro, 17,6 mm más allá de A₁: lo que ha retrocedido
              quien tira de A.
          - con: compas
            traza: 'arco(figura.punto("Q1"), por: proy_planta(solucion.Br), desde: desplaza(proy_planta(solucion.Br), dx: 4, dy: -4.3), hasta: desplaza(proy_planta(solucion.Br), dx: -4, dy: 4.3))'
            toma: segmento2(solucion.M2, solucion.rotB2)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              Con M₂(B₂′) y centro en Q₁, el arco hasta la recta del tiro de B. También la corta dos
              veces; vale el corte de más allá de B₁, y el otro queda al otro lado del poste, fuera de
              la lámina.
          - con: marca
            traza: proy_planta(solucion.Br)
            rotulo: B₁′
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              B₁′, donde el arco corta la recta del tiro, 23,1 mm más allá de B₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Ar), desplaza(proy_alzado(solucion.Ar), dy: -5)), segmento2(proy_planta(solucion.Br), desplaza(proy_alzado(solucion.Br), dy: -5))]'
            guia: figura.segmento("QP1")
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              Las líneas de referencia de A₁′ y de B₁′, verticales, hasta pasar la horizontal de A₂. La
              de A₁′ va casi encima de la línea de referencia de B, 0,24 mm a su izquierda.
          - con: marca
            traza: proy_alzado(solucion.Ar)
            rotulo: A₂′
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              A₂′, donde la vertical de A₁′ corta la horizontal de A₂: A no cambia de cota. Cae a 0,24
              mm de B₂, casi encima, por casualidad de la figura.
          - con: marca
            traza: proy_alzado(solucion.Br)
            bloque: Cuerdas nuevas, giro alrededor del poste
            porque: |
              B₂′, donde la vertical de B₁′ corta la misma horizontal, 3,6 mm a la izquierda de (A₂′).
              Va sin rótulo, como (A₂′): ese punto, que ya está marcado, quedaría pegado a su rótulo por debajo.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.Pv), proy_alzado(solucion.Ar)), segmento2(proy_alzado(solucion.Pv), proy_alzado(solucion.Br)), segmento2(figura.punto("Q1"), proy_planta(solucion.Ar)), segmento2(figura.punto("Q1"), proy_planta(solucion.Br))]'
            porque: |
              Las cuerdas con el poste vertical: en el alzado, de P₂′ a A₂′ y a B₂′; en la planta, de Q₁ a
              A₁′ y a B₁′. El poste es Q₂P₂′ en el alzado y el punto Q₁ en la planta. Ninguna cuerda se
              cruza con otra ni con el poste: todo se ve.
        pista: |
          (1) Con centro en Q₂ y radio Q₂P₂, P₂ hasta la vertical de Q₂: P₂′. (2) Gira cada cuerda con
          eje vertical por P hasta la horizontal de P₁, y súbela a la horizontal de A₂: P₂(A₂) es su
          verdadera magnitud. (3) Con esa abertura y centro en P₂′, corta la horizontal de A₂: de M₂ a
          ese punto es la planta de la cuerda nueva. (4) Con esa planta y centro en Q₁, corta la recta
          del tiro más allá de A₁: A₁′, y súbelo a la horizontal de A₂. (5) B, igual.
        desarrollo: |
          En verde claro, el poste vertical, Q₂P₂′ en el alzado y el punto Q₁ en la planta; el camino de
          A y de B por sus rectas del tiro, y las dos cuerdas nuevas en las dos vistas. A retrocede 17,6
          mm y B, 23,1.

      - tipo: calcular
        titulo: Cuánto retrocede quien tira de A
        pregunta: Con el poste ya vertical, ¿cuántos milímetros del papel ha retrocedido A por la recta del tiro, de A₁ a A₁′?
        respuesta:
          tipo: numero
          valor: '17.59'
          receta: retroceso_A_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '30.59'
            receta: err_planta_mm
            mensaje: |
              Ese retroceso sale de conservar la planta de la cuerda, A₁P₁, o de usar la cota de P antes
              de enderezar el poste, que da lo mismo. P sube al ponerse vertical, la cuerda se empina y
              su planta se acorta: A retrocede menos.
          - valor: '37.44'
            receta: err_vm_mm
            mensaje: |
              Ese retroceso sale de llevar la verdadera magnitud de la cuerda en la planta, como si la
              cuerda nueva fuera horizontal. La planta es un cateto, más corto que la cuerda.
          - valor: '28.26'
            receta: err_par_mm
            mensaje: |
              Ese es el camino de A si la cuerda se quedara paralela a como estaba, desde Q₁. Leemos el
              tiro como el camino de quien tira: la recta A₁P₁, y A no se sale de ella.
        pista: |
          A no cambia de cota y se mueve en horizontal: lo que retrocede se ve sin acortar en la planta,
          de A₁ a A₁′. Mídelo con «medir» del Taller en el paso anterior, o en tu lámina de papel.
        desarrollo: |
          La cuerda de A mide de verdad 58,44 mm, y con el poste vertical P′ queda 42,59 mm por encima de
          A. La planta de la cuerda nueva es el otro cateto:

          $$ \rho_A = \sqrt{58{,}44^{2} - 42{,}59^{2}} \approx 40{,}02 \text{ mm} $$

          Con ese radio y centro en Q₁, la recta del tiro se corta 17,59 mm más allá de A₁.

          En el alzado, sobre la horizontal de A, (A₂′) queda a 17,07 mm de B₂ y a 16,83 mm de A₂′: casi lo
          mismo que el retroceso, por casualidad, y la casilla da por buena cualquiera de las dos. Ninguna es
          el retroceso, que es lo que A se aleja en la planta: de A₁ a A₁′.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: PQ es frontal, así que gira alrededor de la recta de punta por Q, su pie; P₂ va por un arco de centro Q₂ hasta la vertical de Q₂, y P₁ va a Q₁.
          - texto: Las cuerdas no se estiran, y su verdadera magnitud sale de girarlas con eje vertical por P hasta dejarlas frontales.
          - texto: A y B no cambian de cota y se mueven por las rectas A₁P₁ y B₁P₁, alejándose del poste, porque esa es la dirección del tiro.
          - texto: La planta de cada cuerda nueva es el cateto del triángulo que tiene su verdadera magnitud por hipotenusa y lo que P′ está por encima de A por el otro; con ella y centro en Q₁ se corta la recta del tiro.
          - texto: La planta de cada cuerda conserva su longitud, porque la cuerda es inextensible.
            trampa: true
            mensaje: |
              Inextensible quiere decir que la verdadera magnitud no cambia. La planta sí cambia: P
              sube al enderezarse el poste, la cuerda se empina, y su planta se acorta.
    resolucion: |
      **Qué se mueve y qué no.** Q₁P₁ es horizontal en el papel: el poste es una recta frontal, a 45°
      del plano horizontal, y Q₂P₂ es su verdadera magnitud, 54,09 mm. Q, su pie, está 11,5 mm por
      debajo de A y de B, que tienen la misma cota. Al enderezarse, el poste gira en su propio plano
      alrededor de la recta de punta por Q. A y B no cambian de cota y se mueven por las rectas A₁P₁ y
      B₁P₁: leemos «la dirección de tiro» como el camino de quien tira, la planta de su cuerda, y no
      como la dirección de la cuerda. Las cuerdas no cambian de longitud.

      **El poste.** Con centro en Q₂ y radio Q₂P₂, P₂ gira 45° hasta la vertical de Q₂: P₂′, 54,09 mm
      por encima de Q₂. En la planta, P₁ va por Q₁P₁ hasta Q₁: el poste vertical es un punto, y P′
      queda 42,59 mm por encima de A y de B.

      **La longitud de cada cuerda.** Con un giro de eje vertical por P, cada cuerda gira hasta
      quedar frontal: (A₁) y (B₁) en la horizontal de P₁, y (A₂) y (B₂) en la de A₂. P₂(A₂) = 58,44 mm
      y P₂(B₂) = 73,45 mm son sus verdaderas magnitudes.

      **Dónde acaban A y B.** Con el poste vertical, cada cuerda baja de P′ a la cota de A. En el
      alzado, con centro en P₂′ y su verdadera magnitud, el arco corta la horizontal de A₂: de M₂, el
      punto del poste a esa cota, al corte, es la planta de la cuerda nueva, 40,02 mm la de A y 59,85
      mm la de B. Con esa planta y centro en Q₁ se corta cada recta del tiro, más allá de A₁ y de B₁:
      A₁′ y B₁′. A retrocede 17,59 mm y B, 23,15. A₂′ y B₂′ están en sus verticales, en la horizontal
      de A₂; A₂′ cae a 0,24 mm de B₂, por casualidad.

      **Las cuerdas.** En el alzado, de P₂′ a A₂′ y a B₂′; en la planta, de Q₁ a A₁′ y a B₁′. Su planta
      ha cambiado de dirección: lo que se mantiene es la dirección del tiro, no la de la cuerda. No se
      cruzan entre ellas ni con el poste, en ninguna de las dos vistas: todo se ve.

      **La comprobación.** Cada cuerda nueva mide lo que medía: de A₂′ a P₂′ hay 42,59 mm de cota y
      40,02 de planta, y la hipotenusa da 58,44 mm.

  - id: sd22-el-cuadrado-con-dos-lados-sobre-r-y-s
    titulo: El cuadrado con dos lados sobre r y s, por cambio de plano y por abatimiento
    fuente: Ejercicio 17 (SD22) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, con su «Datos:» en mayúscula detrás
    # de los dos puntos, como en la página (§08). Los dos métodos los impone el
    # enunciado y van en dos pasos `construir`; las líneas nuevas, la referencia
    # y la charnela no las da, y se fijan en el intro de cada paso.
    enunciado: |
      Dibujar las proyecciones diédricas del cuadrado contenido en el plano definido por las
      rectas r y s. Aplicar los métodos de cambio de plano y abatimientos. Datos: El vértice de
      menor cota es el punto A y dos de sus lados se sitúan sobre las rectas r y s.

      **Notas nuestras.** La figura son las rectas r y s en el alzado, arriba, y en la planta,
      debajo: paralelas en las dos vistas, así que r y s son paralelas. La hoja no da escala: la
      leemos a 1:1, en milímetros de la lámina. A₂ es el
      extremo de abajo de s₂, y A₁ está sobre s₁: A es un punto de s. La figura no nombra nada más;
      aquí llamamos B al otro vértice que está en s, C y D a los dos que están en r (D, el que forma
      lado con A), S al extremo de arriba de s₂ y R al extremo de abajo de r₂, que está a la altura
      de A₂.
    pide: Las proyecciones de los vértices B, C y D del cuadrado, por cambio de plano y por abatimiento, y, como pregunta nuestra, la medida real de su lado.
    receta:
      lamina: sd22
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        s: 'recta3(alzado: figura.segmento("s2"), planta: figura.segmento("s1"))'
        # El plano horizontal de A, para sacar R: el punto de r con la cota de A,
        # que es el extremo de abajo de r₂.
        Ax: 'punto3(alzado: desplaza(figura.punto("A2"), dx: 50), planta: desplaza(figura.punto("A1"), dx: 50))'
        Ay: 'punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 50))'
        cotaA: plano(A, Ax, Ay)
        R: corte_recta_plano(r, cotaA)
        # El plano de r y s: r ∥ s, así que lo fijan r y el punto A de s.
        rs: plano(A, R, pie_perpendicular(A, r))
        S: 'punto_en_plano(alzado: figura.punto("S2"), plano: rs)'
      solucion:
        # El cuadrado. Los lados sobre r y s son opuestos, así que el lado es la
        # distancia real entre las dos: AD, perpendicular a r. B va sobre s a esa
        # distancia de A, del lado en que s sube (rama 1, hacia S): A es el
        # vértice de menor cota. Una sola posición, y la otra (Bmal) es un error.
        D: pie_perpendicular(A, r)
        lado: vm(A, D)
        BB: 'punto_a_distancia(s, desde: A, distancia: lado)'
        B: rama(BB, 1)
        Bmal: rama(BB, 2)
        C: 'simetrico(A, respecto: punto_medio(segmento3(B, D)))'
        # La horizontal del plano por A, de R a A, y lo que S está más alto que A.
        hA: recta3(R, A)
        S2h: 'pie_perpendicular(figura.punto("S2"), segmento2(figura.punto("R2"), figura.punto("A2")))'
        S2hmas: 'uno(medir_sobre(segmento2(figura.punto("R2"), S2h), desde: S2h, distancia: 10), 1)'
        cotaS: diferencia_de_cotas(S, A)
        # Lo que A está más cerca que S, que lleva el error de cambiar cotas por
        # alejamientos: Pitágoras, porque la receta no expone la diferencia de
        # alejamientos (como en SD26).
        dyAS: 'raiz(vm(A, S) * vm(A, S) - vm_alzado(A, S) * vm_alzado(A, S))'
        # Decisión: 1 · Dos cambios de plano con las dos líneas nuevas de la
        # lámina, que fija el ejercicio porque el enunciado no las da, y A de
        # referencia en los dos. El vertical, perpendicular a la horizontal por
        # A, deja el plano de canto (vista 4); el horizontal, paralelo al canto,
        # en verdadera magnitud (vista 5).
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: A)'
        S_4: 'cambio_plano_vertical(S, figura.segmento("nueva1"), ref: A)'
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: A)'
        C_4: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: A)'
        D_4: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: A)'
        A_5: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        S_5: 'cambio_plano_vertical(S, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        R_5: 'cambio_plano_vertical(R, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        B_5: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        C_5: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        D_5: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        Bmal_5: 'cambio_plano_vertical(Bmal, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"))'
        pieS: 'pie_perpendicular(proy_planta(S), figura.segmento("nueva1"))'
        perpS1: 'perpendicular(por: proy_planta(S), a: figura.segmento("nueva1"))'
        pieS4: 'pie_perpendicular(S_4, figura.segmento("nueva2"))'
        # La paralela a la primera línea nueva por A₁: lo que la planta de un
        # punto está más lejos de la línea que A₁ es su distancia a esta paralela.
        parA1: 'perpendicular(por: figura.punto("A1"), a: proy_planta(hA))'
        pieS1c: pie_perpendicular(proy_planta(S), parA1)
        pieS1cmas: 'uno(medir_sobre(segmento2(figura.punto("A1"), pieS1c), desde: pieS1c, distancia: 8), 1)'
        s5: segmento2(A_5, S_5)
        r5: segmento2(R_5, C_5)
        perpA5: 'perpendicular(por: A_5, a: s5)'
        perpB5: 'perpendicular(por: B_5, a: s5)'
        perpB4: 'perpendicular(por: B_4, a: figura.segmento("nueva1"))'
        perpC4: 'perpendicular(por: C_4, a: figura.segmento("nueva1"))'
        perpD4: 'perpendicular(por: D_4, a: figura.segmento("nueva1"))'
        # Donde la perpendicular que sale de C₄ (o de D₄) cruza s₁ camino de r₁:
        # es la planta de la horizontal del plano por C (o por D).
        QhC: pie_comun(horizontal_por(C, rs), s)
        QhD: pie_comun(horizontal_por(D, rs), s)
        S4mas: 'uno(medir_sobre(segmento2(proy_planta(S), S_4), desde: S_4, distancia: 10), 1)'
        R5mas: 'uno(medir_sobre(segmento2(A_4, R_5), desde: R_5, distancia: 10), 1)'
        S5mas: 'uno(medir_sobre(segmento2(S_4, pieS4), desde: pieS4, distancia: 8), 1)'
        C5mas: 'uno(medir_sobre(segmento2(R_5, C_5), desde: C_5, distancia: 12), 1)'
        # Decisión: 2 · Abatimiento sobre el plano horizontal de A con la
        # charnela hA, la horizontal por A, que fija el ejercicio: pasa por A y
        # por R, el extremo de abajo de r₂. S se abate a cualquiera de los dos
        # lados (una elección: la primera marca fija el lado), y los demás con el
        # mismo giro. Rama 1, hacia abajo de la planta, donde hay sitio.
        S_ab: abatido_a_elegir(S, hA, rs)
        B_ab: 'abatido_junto(B, hA, rs, con: S_ab, de: S)'
        C_ab: 'abatido_junto(C, hA, rs, con: S_ab, de: S)'
        D_ab: 'abatido_junto(D, hA, rs, con: S_ab, de: S)'
        Bmal_ab: 'abatido_junto(Bmal, hA, rs, con: S_ab, de: S)'
        MS: pie_perpendicular(S, hA)
        perpS: 'perpendicular(por: proy_planta(S), a: proy_planta(hA))'
        # El triángulo del radio de S: su cota sobre A, llevada desde S₁ por la
        # paralela a la charnela, hacia la derecha.
        TS: 'uno(medir_sobre(perpendicular(por: proy_planta(S), a: perpS), desde: proy_planta(S), distancia: cotaS), 2)'
        TSmas: 'uno(medir_sobre(segmento2(proy_planta(S), TS), desde: TS, distancia: 8), 1)'
        R1menos: 'uno(medir_sobre(segmento2(figura.punto("A1"), proy_planta(R)), desde: proy_planta(R), distancia: 8), 1)'
        MSmas: 'uno(medir_sobre(segmento2(proy_planta(R), proy_planta(MS)), desde: proy_planta(MS), distancia: 15), 1)'
        S0mas1: 'uno(medir_sobre(segmento2(proy_planta(MS), proy_planta(rama(S_ab, 1))), desde: proy_planta(rama(S_ab, 1)), distancia: 6), 1)'
        S0mas2: 'uno(medir_sobre(segmento2(proy_planta(MS), proy_planta(rama(S_ab, 2))), desde: proy_planta(rama(S_ab, 2)), distancia: 6), 1)'
        C0mas: 'uno(medir_sobre(segmento2(proy_planta(R), proy_planta(C_ab)), desde: proy_planta(C_ab), distancia: 10), 1)'
        # Los dos errores del radio de S: solo la cota (un cateto) y solo lo que
        # dista en la planta (el otro), llevados desde M hacia el lado de S₀.
        Scat: 'uno(medir_sobre(segmento2(proy_planta(MS), proy_planta(S_ab)), desde: proy_planta(MS), distancia: cotaS), 1)'
        Splanta: 'uno(medir_sobre(segmento2(proy_planta(MS), proy_planta(S_ab)), desde: proy_planta(MS), distancia: vm_planta(S, MS)), 1)'
        B0AR: 'uno(medir_sobre(segmento2(figura.punto("A1"), proy_planta(S_ab)), desde: figura.punto("A1"), distancia: vm(A, R)), 1)'
        # Donde la perpendicular a la charnela que sale de C₀ cruza s₁ camino de r₁.
        QpC: corte_recta_plano(s, plano_perpendicular_a_recta(C, hA))
        perpB1: 'perpendicular(por: proy_planta(B), a: proy_planta(hA))'
        perpC1: 'perpendicular(por: proy_planta(C), a: proy_planta(hA))'
        perpD1: 'perpendicular(por: proy_planta(D), a: proy_planta(hA))'
        lado_mm: en_mm(lado)
      comprueba:
        - en_recta(A, s)
        - en_recta(S, s)
        - en_recta(R, r)
        - en_recta(C, r)
        - en_plano(C, rs)
    pasos:
      - tipo: reconocer
        pregunta: r y s son paralelas, y el cuadrado tiene un lado sobre cada una. ¿Qué queda fijado con eso?
        opciones:
          - texto: El lado del cuadrado, que es la distancia real entre r y s
            correcta: true
            mensaje: |
              Eso es. Los lados que van sobre r y sobre s son opuestos, y los otros dos les son
              perpendiculares: cada uno va de una recta a la otra por el camino más corto. Por eso el
              lado no hace falta darlo. Desde A, la perpendicular a r da D, y AD es el lado.
          - texto: Nada todavía, porque el enunciado no da la medida del lado
            mensaje: |
              No hace falta darla. Dos lados opuestos de un cuadrado son paralelos y están separados
              justo un lado. Si van sobre r y sobre s, el lado es lo que separa las dos rectas, medido
              en verdadera magnitud.
          - texto: Que AR, el tramo de la horizontal por A que va de s a r, es un lado
            mensaje: |
              AR une s con r, pero no por el camino más corto: es horizontal, y r no es una recta de máxima
              pendiente del plano, así que AR no le es perpendicular (forma 68° con ella), y mide más que el
              lado. El lado es la perpendicular común, AD.

      - tipo: construir
        titulo: Por dos cambios de plano
        intro: |
          Dos cambios, como el método 1 de la hoja «Plano en VM». El enunciado impone el método, pero no
          dice dónde van las líneas nuevas ni qué referencia se toma: lo hemos fijado nosotros. Las dos
          ya están dibujadas, de trazo y punto, y la referencia es A en los dos cambios. La primera, a la
          derecha de la planta, es perpendicular a la horizontal del plano por A, que va de A₁ a R₁: con
          un cambio vertical, que lleva cotas, el plano sale de canto en la vista 4. La segunda es
          paralela a ese canto: con un cambio horizontal, que lleva lo que la planta de cada punto
          distaba de la primera línea nueva, la vista 5 es la verdadera magnitud, y en ella se dibuja
          el cuadrado. Después se vuelve a la planta y al alzado por el mismo camino. Para el canto usa
          S, el extremo de arriba de s₂; para r₅, R, el extremo de abajo de r₂. Marca S₄, los tres
          vértices nuevos en la vista 5 y sus dos proyecciones.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: S4
            pide: S, el extremo de arriba de s, en la vista 4
            es: solucion.S_4
            bien: |
              S₄ está en la perpendicular a la primera línea nueva que pasa por S₁, a 39 mm por fuera:
              lo que S está más alto que A. A₄S₄ es el canto, y r₄ y s₄ van por él.
            diagnosticos:
              - si: cerca_de(solucion.pieS)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí cae A, que es la referencia; S está más alto que
                  A, y su cota se lleva desde la línea hacia fuera.
                ejemplo: solucion.pieS
              - si: 'cerca_de(uno(medir_sobre(solucion.perpS1, desde: solucion.pieS, distancia: solucion.cotaS), 2))'
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. La vista nueva queda al otro
                  lado de la línea nueva, y un punto más alto que la referencia se aparta de la línea hacia
                  fuera.
                ejemplo: 'uno(medir_sobre(solucion.perpS1, desde: solucion.pieS, distancia: solucion.cotaS), 2)'
              - si: 'en_recta(solucion.perpS1) && a_distancia(de: solucion.pieS, d: solucion.dyAS)'
                mensaje: |
                  Has llevado lo que S está **más cerca** que A, la diferencia de alejamientos. Un cambio
                  de plano vertical sale de la planta y lleva **cotas**: lo que S₂ está por encima de la
                  horizontal de A₂.
                ejemplo: 'uno(medir_sobre(solucion.perpS1, desde: solucion.pieS, distancia: solucion.dyAS), 1)'
              - si: '!en_recta(solucion.perpS1)'
                mensaje: |
                  S₄ sale de S₁ por la **perpendicular a la línea nueva**. S₁ no está dibujado: es donde la
                  vertical de S₂ corta s₁.
                ejemplo: 'desplaza(solucion.S_4, dx: mm(-2), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena. S₄ se aparta de la línea
                  nueva lo que S está más alto que A, que se mide en el alzado: de S₂ a la horizontal de A₂.
          - nombre: D5
            pide: el vértice D, que forma lado con A, en la vista 5
            es: solucion.D_5
            bien: |
              D₅ está en r₅, al pie de la perpendicular a s₅ que pasa por A₅. A₅D₅ es el lado del
              cuadrado en verdadera magnitud, 22,5 mm: lo que separa r de s.
            diagnosticos:
              - si: cerca_de(solucion.R_5)
                mensaje: |
                  Ese es R₅. AR es la horizontal por A, y no es perpendicular a s: une las dos rectas, pero
                  no por el camino más corto. El lado AD sale de la perpendicular a s₅ por A₅.
                ejemplo: solucion.R_5
              - si: 'cerca_de(uno(medir_sobre(segmento2(solucion.A_5, solucion.D_5), desde: solucion.A_5, distancia: solucion.lado), 2))'
                mensaje: |
                  Has llevado R₅ hacia dentro, y r₅ ha quedado al otro lado de s₅. R₁ está más lejos de la
                  primera línea nueva que A₁, así que R₅ se aparta de la segunda hacia fuera, más allá de
                  A₅.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.A_5, solucion.D_5), desde: solucion.A_5, distancia: solucion.lado), 2)'
              - si: '!en_recta(solucion.perpA5)'
                mensaje: |
                  D₅ está en la **perpendicular a s₅ que pasa por A₅**: AD es un lado del cuadrado, y es
                  perpendicular a s.
                ejemplo: 'uno(medir_sobre(solucion.r5, desde: solucion.D_5, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a s₅ por A₅, pero no en r₅. Comprueba R₅: R₁ está más lejos de
                  la primera línea nueva que A₁ lo que mide A₁R₁, y R₅ se aparta eso de la segunda, por la
                  perpendicular que sale de A₄ ≡ R₄.
          - nombre: B5
            pide: el vértice B, el otro de s, en la vista 5
            es: solucion.B_5
            bien: |
              B₅ está en s₅, a A₅D₅ de A₅ y del lado de S₅: B está por encima de A, que es el vértice de
              menor cota.
            diagnosticos:
              - si: cerca_de(solucion.Bmal_5)
                mensaje: |
                  Ese B queda **por debajo de A**: has llevado el lado hacia el otro lado de A₅. El enunciado
                  dice que A es el vértice de menor cota, así que B sube por s, hacia S₅.
                ejemplo: solucion.Bmal_5
              - si: 'cerca_de(uno(medir_sobre(solucion.s5, desde: solucion.A_5, distancia: vm(A, R)), 1))'
                mensaje: |
                  Has llevado A₅R₅, la horizontal por A, en vez del lado. El lado es A₅D₅, perpendicular a
                  s₅; AR mide casi 2 mm más.
                ejemplo: 'uno(medir_sobre(solucion.s5, desde: solucion.A_5, distancia: vm(A, R)), 1)'
              - si: '!en_recta(solucion.s5)'
                mensaje: |
                  B está en s: B₅ va **en s₅**, la recta que une A₅ con S₅.
                ejemplo: 'desplaza(solucion.B_5, dx: mm(3), dy: mm(4))'
              - si: siempre
                mensaje: |
                  Estás en s₅, pero no a la distancia buena: con centro en A₅ y radio A₅D₅, el arco corta s₅
                  en B₅, del lado de S₅.
          - nombre: C5
            pide: el vértice C, el otro de r, en la vista 5
            es: solucion.C_5
            bien: |
              C₅ está en r₅, en la perpendicular a s₅ por B₅. A₅B₅C₅D₅ es el cuadrado en verdadera
              magnitud.
            diagnosticos:
              - si: '!en_recta(solucion.r5)'
                mensaje: |
                  C está en r: C₅ va **en r₅**, la paralela a s₅ por R₅.
                ejemplo: 'desplaza(solucion.C_5, dx: mm(-3), dy: mm(-4))'
              - si: '!en_recta(solucion.perpB5)'
                mensaje: |
                  BC es otro lado del cuadrado, perpendicular a s como AD: C₅ está en la **perpendicular a
                  s₅ que pasa por B₅**.
                ejemplo: 'uno(medir_sobre(solucion.r5, desde: solucion.C_5, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  C₅ está donde la perpendicular a s₅ por B₅ corta r₅.
          - nombre: B1
            pide: el vértice B, de vuelta en la planta
            es: proy_planta(B)
            bien: |
              B₁ está en s₁, en la perpendicular a la primera línea nueva que pasa por B₄, el punto del
              canto en la perpendicular de B₅.
            diagnosticos:
              - si: cerca_de(proy_planta(Bmal))
                mensaje: |
                  Ese B está en s₁, pero por debajo de A: es el que sale de llevar el lado hacia el otro lado
                  de A₅. A es el vértice de menor cota, y B sube.
                ejemplo: proy_planta(Bmal)
              - si: '!en_recta(solucion.perpB4)'
                mensaje: |
                  La vuelta es por el mismo camino: de B₅, la perpendicular a la segunda línea nueva hasta el
                  canto, B₄, y de B₄, la **perpendicular a la primera línea nueva** hasta s₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("s1"), desde: proy_planta(B), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("s1"))'
                mensaje: |
                  B está en s: B₁ va **en s₁**, donde la perpendicular que sale de B₄ la corta.
                ejemplo: 'uno(medir_sobre(solucion.perpB4, desde: proy_planta(B), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  B₁ está donde la perpendicular a la primera línea nueva que sale de B₄ corta s₁.
          - nombre: C1
            pide: el vértice C, de vuelta en la planta
            es: proy_planta(C)
            bien: |
              C₁ está en r₁, en la perpendicular a la primera línea nueva que pasa por C₄. Por el camino,
              esa perpendicular cruza s₁: C está en r, y hay que seguir hasta r₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.QhC))
                mensaje: |
                  Te has parado en s₁. La perpendicular que sale de C₄ cruza s₁ antes de llegar a r₁, pero C
                  está en r: sigue hasta r₁.
                ejemplo: proy_planta(solucion.QhC)
              - si: '!en_recta(solucion.perpC4)'
                mensaje: |
                  De C₅, la perpendicular a la segunda línea nueva hasta el canto, C₄; de C₄, la
                  **perpendicular a la primera línea nueva** hasta r₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(C), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  C está en r: C₁ va **en r₁**.
                ejemplo: 'uno(medir_sobre(solucion.perpC4, desde: proy_planta(C), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  C₁ está donde la perpendicular a la primera línea nueva que sale de C₄ corta r₁.
          - nombre: D1
            pide: el vértice D, de vuelta en la planta
            es: proy_planta(D)
            bien: |
              D₁ está en r₁, en la perpendicular a la primera línea nueva que pasa por D₄. También cruza s₁
              por el camino.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.QhD))
                mensaje: |
                  Te has parado en s₁. D está en r: la perpendicular que sale de D₄ sigue hasta r₁.
                ejemplo: proy_planta(solucion.QhD)
              - si: '!en_recta(solucion.perpD4)'
                mensaje: |
                  De D₅, la perpendicular a la segunda línea nueva hasta el canto, D₄; de D₄, la
                  **perpendicular a la primera línea nueva** hasta r₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(D), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  D está en r: D₁ va **en r₁**.
                ejemplo: 'uno(medir_sobre(solucion.perpD4, desde: proy_planta(D), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  D₁ está donde la perpendicular a la primera línea nueva que sale de D₄ corta r₁.
          - nombre: B2
            pide: el vértice B, en el alzado
            es: proy_alzado(B)
            bien: |
              B₂ está en s₂, en la vertical de B₁.
            diagnosticos:
              - si: '!en_vertical_de(B1)'
                mensaje: |
                  B₂ va en la **vertical de B₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(B), dx: mm(6))'
              - si: '!en_recta(figura.segmento("s2"))'
                mensaje: |
                  B está en s: B₂ va donde la vertical de B₁ corta **s₂**.
                ejemplo: 'desplaza(proy_alzado(B), dy: mm(6))'
              - si: siempre
                mensaje: |
                  B₂ está en la vertical de B₁, sobre s₂.
          - nombre: C2
            pide: el vértice C, en el alzado
            es: proy_alzado(C)
            bien: |
              C₂ está en r₂, en la vertical de C₁: es el vértice más alto del cuadrado.
            diagnosticos:
              - si: '!en_vertical_de(C1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_alzado(C), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  C está en r: C₂ va donde la vertical de C₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(C), dy: mm(6))'
              - si: siempre
                mensaje: |
                  C₂ está en la vertical de C₁, sobre r₂.
          - nombre: D2
            pide: el vértice D, en el alzado
            es: proy_alzado(D)
            bien: |
              D₂ está en r₂, en la vertical de D₁. A₂B₂C₂D₂ es el alzado del cuadrado: un paralelogramo,
              porque el cuadrado no es frontal.
            diagnosticos:
              - si: '!en_vertical_de(D1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**.
                ejemplo: 'desplaza(proy_alzado(D), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  D está en r: D₂ va donde la vertical de D₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(D), dy: mm(6))'
              - si: siempre
                mensaje: |
                  D₂ está en la vertical de D₁, sobre r₂.
        trazado:
          - segmento2(solucion.A_4, solucion.S_4)
          - segmento2(solucion.A_5, solucion.S_5)
          - segmento2(solucion.R_5, solucion.C_5)
          - segmento2(solucion.A_5, solucion.D_5)
          - segmento2(solucion.B_5, solucion.C_5)
          - segmento2(proy_planta(B), proy_planta(C))
          - segmento2(proy_planta(D), figura.punto("A1"))
          - segmento2(proy_alzado(B), proy_alzado(C))
          - segmento2(proy_alzado(D), figura.punto("A2"))
        bloques:
          - nombre: 1.er cambio de plano
            explica: |
              Es un cambio vertical: la planta se queda, y el plano vertical se cambia por otro
              perpendicular a AR, la horizontal del plano por A. Por eso la primera línea nueva, que hemos
              fijado nosotros, va perpendicular a A₁R₁: la vista 4 ve AR de punta, A₄ ≡ R₄, y el plano de r
              y s entero como una recta, el canto A₄S₄. Cada punto conserva su cota, contada desde la de A,
              la referencia, que cae en la línea: S, 39 mm más alto que A, se aparta 39 mm de la línea,
              hacia el lado contrario a la planta. Es el primer paso de
              [un plano, en dos cambios](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-cambios):
              el canto ya da la inclinación del plano, 63,7°, pero todavía no su forma.
          - nombre: 2.º cambio de plano
            explica: |
              Es un cambio horizontal: la vista 4 se queda, y la planta se cambia por una vista desde un
              plano paralelo al de r y s. Por eso la segunda línea nueva va paralela al canto, y la vista 5
              da el plano en verdadera magnitud, con r₅ y s₅ a la distancia real entre r y s, que es el
              lado. Cada punto lleva la distancia de la vista que se deja, la planta: lo que su planta está
              más lejos, o más cerca, de la primera línea nueva que A₁, que es su distancia a la paralela
              por A₁; A sigue de referencia, y A₅ cae en la segunda línea. R₁ está más lejos, y R₅ cae fuera
              de la segunda línea; S₁ está más cerca, y S₅ cae hacia el canto. A la vuelta, deshacer este
              cambio devuelve la planta: cada vértice va de la vista 5 al canto, y del canto a s₁ o a r₁.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("R2"), solucion.S2hmas)
            bloque: 1.er cambio de plano
            porque: |
              En el alzado, la **horizontal de A₂**: une A₂ con el extremo de abajo de r₂, que está a su
              misma altura, y se prolonga hacia la derecha, más allá de la vertical de S₂. A es la
              referencia, y las cotas se cuentan desde esta recta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("S2"), proy_planta(S))
            porque: |
              Por S₂, la vertical hasta s₁. S está en s, y su planta cae en s₁. El trozo de esta vertical
              entre S₂ y la horizontal de A₂ es lo que S está más alto que A.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, donde la vertical de S₂ corta s₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("R2"), proy_planta(R))
            porque: |
              Por el extremo de abajo de r₂, la vertical hasta r₁: R es el punto de r con la cota de A, y su
              planta está en r₁.
          - con: marca
            traza: proy_planta(R)
            porque: |
              R₁, donde la vertical de R₂ corta r₁. A₁R₁ es la horizontal del plano por A. Va sin rótulo:
              el punto D₁, que se marca después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(R), solucion.A_4)
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por A₁, la **perpendicular a la primera línea nueva**, hasta ella. Pasa también por R₁, porque
              la línea nueva se trazó perpendicular a la horizontal por A: esta recta es esa horizontal,
              prolongada.
          - con: marca
            traza: solucion.A_4
            bloque: 1.er cambio de plano
            porque: |
              A es la referencia, y cae en la línea nueva. R tiene su misma cota, y cae en el mismo punto:
              la horizontal por A se ve de punta. Es A₄ ≡ R₄, y va sin rótulo: el punto D₄, que se marca
              después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.pieS1cmas)
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por A₁, la **paralela a la primera línea nueva**, hacia arriba. Servirá en el segundo cambio:
              cada punto lleva lo que su planta está más lejos de la línea nueva que A₁, y eso es su
              distancia a esta paralela.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(S), solucion.S4mas), segmento2(proy_planta(S), solucion.pieS1c)]'
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por S₁, la perpendicular a la primera línea nueva, larga: hacia la derecha, más allá de la
              línea, porque ahí cae S₄; hacia la izquierda, hasta la paralela de A₁.
          - con: compas
            traza: 'arco(solucion.pieS, por: solucion.S_4, desde: desplaza(solucion.S_4, dx: 1.85, dy: -5.71), hasta: desplaza(solucion.S_4, dx: -1.85, dy: 5.71))'
            bloque: 1.er cambio de plano
            toma: segmento2(figura.punto("S2"), solucion.S2h)
            porque: |
              Con el compás, en el alzado, **lo que S está más alto que A**: de S₂ a la horizontal de A₂. Se
              lleva desde la línea nueva hacia fuera, lejos de la planta: S es más alto que la referencia.
          - con: marca
            traza: solucion.S_4
            bloque: 1.er cambio de plano
            rotulo: S₄
            porque: |
              S₄, donde el arco corta la perpendicular que sale de S₁.
          - con: regla
            traza: segmento2(solucion.A_4, solucion.S_4)
            bloque: 1.er cambio de plano
            rotulo: canto
            porque: |
              A₄S₄ es el **plano de canto**: con la horizontal por A vista de punta, el plano entero se ve
              como una recta. r₄ y s₄ van por ella, y también los cuatro vértices del cuadrado.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.A_4, solucion.R5mas), segmento2(solucion.S_4, solucion.S5mas)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva2")
            porque: |
              Desde A₄ y S₄, las perpendiculares a la segunda línea nueva, que es paralela al canto. La de
              A₄, larga, más allá de la línea: por ella van A₅ y R₅, porque A₄ y R₄ coinciden.
          - con: marca
            traza: solucion.A_5
            bloque: 2.º cambio de plano
            rotulo: A₅
            porque: |
              A₅, donde la perpendicular de A₄ corta la segunda línea nueva: A es también la referencia del
              segundo cambio.
          - con: compas
            traza: 'arco(solucion.pieS4, por: solucion.S_5, desde: desplaza(solucion.S_5, dx: -5.93, dy: -0.87), hasta: desplaza(solucion.S_5, dx: 5.93, dy: 0.87))'
            bloque: 2.º cambio de plano
            toma: segmento2(proy_planta(S), solucion.pieS1c)
            porque: |
              S₁ está **más cerca** de la primera línea nueva que A₁, lo que mide el trozo de S₁ a la
              paralela de A₁. S₅ se aparta eso de la segunda línea, pero hacia dentro, hacia el canto.
          - con: marca
            traza: solucion.S_5
            bloque: 2.º cambio de plano
            rotulo: S₅
            porque: |
              S₅, donde el arco corta la perpendicular que sale de S₄, entre el canto y la línea.
          - con: compas
            traza: 'arco(solucion.A_5, por: solucion.R_5, desde: desplaza(solucion.R_5, dx: -5.93, dy: -0.87), hasta: desplaza(solucion.R_5, dx: 5.93, dy: 0.87))'
            bloque: 2.º cambio de plano
            toma: segmento2(figura.punto("A1"), proy_planta(R))
            porque: |
              R₁ está más lejos de la primera línea nueva que A₁ justo lo que mide A₁R₁, porque A₁R₁ es
              perpendicular a ella. Con esa abertura, desde A₅, hacia fuera.
          - con: marca
            traza: solucion.R_5
            bloque: 2.º cambio de plano
            rotulo: R₅
            porque: |
              R₅, en la perpendicular que sale de A₄ ≡ R₄, más allá de A₅.
          - con: regla
            traza: segmento2(solucion.A_5, solucion.S_5)
            bloque: 2.º cambio de plano
            rotulo: s₅
            porque: |
              s₅, la recta s en verdadera magnitud: la que une A₅ con S₅.
          - con: escuadra-cartabon
            traza: segmento2(solucion.R_5, solucion.C5mas)
            bloque: 2.º cambio de plano
            guia: segmento2(solucion.A_5, solucion.S_5)
            rotulo: r₅
            porque: |
              r₅, la paralela a s₅ por R₅: r y s son paralelas, y en verdadera magnitud lo siguen siendo.
          - con: escuadra-cartabon
            traza: segmento2(solucion.A_5, solucion.D_5)
            bloque: 2.º cambio de plano
            guia: segmento2(solucion.A_5, solucion.S_5)
            porque: |
              Por A₅, la **perpendicular a s₅** hasta r₅. AD es un lado del cuadrado: perpendicular a s, y
              con D en r. Es la distancia real entre las dos rectas.
          - con: marca
            traza: solucion.D_5
            bloque: 2.º cambio de plano
            rotulo: D₅
            porque: |
              D₅, donde la perpendicular corta r₅.
          - con: compas
            traza: 'arco(solucion.A_5, por: solucion.B_5, desde: solucion.D_5, hasta: solucion.B_5)'
            bloque: 2.º cambio de plano
            toma: segmento2(solucion.A_5, solucion.D_5)
            porque: |
              Con centro en A₅ y radio A₅D₅, el lado, un cuarto de vuelta hasta s₅, del lado de S₅: B está
              en s y por encima de A, porque A es el vértice de menor cota.
          - con: marca
            traza: solucion.B_5
            bloque: 2.º cambio de plano
            rotulo: B₅
            porque: |
              B₅, donde el arco corta s₅.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B_5, solucion.C_5)
            bloque: 2.º cambio de plano
            guia: segmento2(solucion.A_5, solucion.S_5)
            porque: |
              Por B₅, la perpendicular a s₅ hasta r₅: BC es el lado opuesto a AD.
          - con: marca
            traza: solucion.C_5
            bloque: 2.º cambio de plano
            rotulo: C₅
            porque: |
              C₅, donde la perpendicular corta r₅. A₅B₅C₅D₅ es el cuadrado en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B_5, solucion.B_4), segmento2(solucion.C_5, solucion.C_4), segmento2(solucion.D_5, solucion.D_4)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva2")
            porque: |
              La vuelta, por el mismo camino. Desde B₅, C₅ y D₅, las perpendiculares a la segunda línea
              nueva hasta el canto: los tres vértices están en el plano, y en la vista 4 el plano es esa
              recta.
          - con: marca
            traza: solucion.B_4
            bloque: 2.º cambio de plano
            rotulo: B₄
            porque: |
              B₄, donde la perpendicular de B₅ corta el canto.
          - con: marca
            traza: solucion.C_4
            bloque: 2.º cambio de plano
            rotulo: C₄
            porque: |
              C₄, donde la perpendicular de C₅ corta el canto.
          - con: marca
            traza: solucion.D_4
            bloque: 2.º cambio de plano
            rotulo: D₄
            porque: |
              D₄, donde la perpendicular de D₅ corta el canto.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B_4, proy_planta(B)), segmento2(solucion.C_4, proy_planta(C)), segmento2(solucion.D_4, proy_planta(D))]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Desde B₄, C₄ y D₄, las perpendiculares a la primera línea nueva, de vuelta a la planta. B está
              en s, y su perpendicular para en s₁; C y D están en r, y las suyas cruzan s₁ y siguen hasta
              r₁.
          - con: marca
            traza: proy_planta(B)
            bloque: 2.º cambio de plano
            rotulo: B₁
            porque: |
              B₁, donde la perpendicular de B₄ corta s₁.
          - con: marca
            traza: proy_planta(C)
            bloque: 2.º cambio de plano
            rotulo: C₁
            porque: |
              C₁, donde la perpendicular de C₄ corta r₁.
          - con: marca
            traza: proy_planta(D)
            bloque: 2.º cambio de plano
            rotulo: D₁
            porque: |
              D₁, donde la perpendicular de D₄ corta r₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(B), proy_alzado(B)), segmento2(proy_planta(C), proy_alzado(C)), segmento2(proy_planta(D), proy_alzado(D))]'
            porque: |
              Los alzados, por las verticales de B₁, C₁ y D₁: la de B₁ hasta s₂, y las de C₁ y D₁ hasta r₂,
              porque cada vértice está en su recta.
          - con: marca
            traza: proy_alzado(B)
            rotulo: B₂
            porque: |
              B₂, donde la vertical de B₁ corta s₂.
          - con: marca
            traza: proy_alzado(C)
            rotulo: C₂
            porque: |
              C₂, donde la vertical de C₁ corta r₂.
          - con: marca
            traza: proy_alzado(D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta r₂.
          - con: regla
            traza: '[segmento2(proy_planta(B), proy_planta(C)), segmento2(proy_planta(D), figura.punto("A1")), segmento2(proy_alzado(B), proy_alzado(C)), segmento2(proy_alzado(D), figura.punto("A2"))]'
            porque: |
              Los lados que faltan, BC y DA, en las dos vistas; AB va sobre s y CD sobre r. A₁B₁C₁D₁ y
              A₂B₂C₂D₂ son las proyecciones del cuadrado.
        pista: |
          (1) La horizontal de A₂ pasa por el extremo de abajo de r₂: ese es R. (2) Primer cambio: A₄ ≡ R₄
          en la línea nueva; S₄, a lo que S₂ está por encima de la horizontal de A₂. (3) Segundo cambio: A₅
          en la línea; S₅ y R₅, a lo que S₁ y R₁ están más cerca o más lejos de la primera línea nueva que
          A₁. (4) En la vista 5: la perpendicular a s₅ por A₅ da D₅; el lado, llevado sobre s₅ hacia S₅,
          da B₅. (5) De vuelta, cada vértice cae en s₁ o en r₁, y luego en s₂ o en r₂.
        desarrollo: |
          En verde claro, el canto de la vista 4, el cuadrado en verdadera magnitud de la vista 5 y sus
          dos proyecciones. El lado mide 22,5 mm: lo que separa r de s.

      - tipo: construir
        titulo: Por abatimiento, con la horizontal por A de charnela
        intro: |
          Abate el plano sobre el plano horizontal de A. El enunciado impone el método, pero no dice qué
          charnela: la fijamos nosotros. Es la horizontal del plano por A, que en el alzado pasa por A₂ y
          por el extremo de abajo de r₂, R₂, y en la planta va de A₁ a R₁. A y R están en la charnela y
          no se mueven. Abate S, el extremo de arriba de s₂, con su triángulo; s₀ y r₀ salen de ahí, y
          en ellas se dibuja el cuadrado. Vale cualquiera de los dos lados de la charnela, pero todo al
          mismo. Después se desabate. Marca S₀, los tres vértices nuevos abatidos y sus dos proyecciones. Las
          rectas de trazo y punto de la derecha son las líneas nuevas del cambio de plano: aquí no se
          usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: S0
            pide: S, el extremo de arriba de s, abatido
            es: proy_planta(solucion.S_ab)
            bien: |
              S₀ está en la perpendicular a la charnela que pasa por S₁, a la distancia real de S a la
              charnela: la hipotenusa de lo que S₁ dista de ella en la planta y de lo que S está más alto
              que A, que se mide en el alzado.
            diagnosticos:
              - si: cerca_de(proy_planta(S))
                mensaje: |
                  Ese es S₁, la planta de S sin abatir. Al abatir, S gira alrededor de la charnela hasta
                  quedar a la cota de A, y en la planta se aparta de ella por la perpendicular.
                ejemplo: proy_planta(S)
              - si: cerca_de(solucion.Scat)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que S está más alto que
                  A**. Eso es un cateto. El radio es la hipotenusa de ese cateto y de lo que separa S₁ de la
                  charnela en la planta.
                ejemplo: rama(solucion.Scat, 1)
              - si: cerca_de(solucion.Splanta)
                mensaje: |
                  Has llevado al otro lado de la charnela lo que S₁ dista de ella **en la planta**, y la
                  planta acorta: S está 39 mm por encima de la charnela. Con esa distancia y la cota se forma
                  el triángulo cuya hipotenusa es el radio.
                ejemplo: rama(solucion.Splanta, 1)
              - si: '!en_recta(solucion.perpS)'
                mensaje: |
                  S gira alrededor de la charnela en un plano perpendicular a ella, y ese plano es vertical,
                  porque la charnela es horizontal: en la planta, S₀ se mueve por la **perpendicular a la
                  charnela que pasa por S₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.S_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por S₁, pero no a la distancia buena. El radio es
                  la hipotenusa del triángulo que tiene por catetos lo que separa S₁ de la charnela en la
                  planta y lo que S₂ está por encima de la horizontal de A₂.
          - nombre: D0
            pide: el vértice D, que forma lado con A, abatido
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está en r₀, al pie de la perpendicular a s₀ que pasa por A₁. A₁D₀ es el lado en
              verdadera magnitud, 22,5 mm.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela. El plano gira entero, como una tapa sobre
                  su bisagra: D₀ cae al lado de S₀.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: cerca_de(proy_planta(R))
                mensaje: |
                  Ese es R₁. AR es la horizontal por A, la charnela misma, y no es perpendicular a s: une s
                  con r, pero no por el camino más corto. El lado sale de la perpendicular a s₀ por A₁.
                ejemplo: proy_planta(R)
              - si: siempre
                mensaje: |
                  D₀ está en r₀ —la paralela a s₀ por R₁—, al pie de la perpendicular a s₀ que pasa por A₁.
          - nombre: B0
            pide: el vértice B, el otro de s, abatido
            es: proy_planta(solucion.B_ab)
            bien: |
              B₀ está en s₀, a A₁D₀ de A₁ y del lado de S₀: B está por encima de A.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.B_ab)))
                mensaje: |
                  Ese es B abatido **al otro lado** de la charnela. El plano gira entero, como una tapa sobre
                  su bisagra: si D₀ ha caído a un lado, B₀ cae al mismo.
                ejemplo: proy_planta(rama(solucion.B_ab, 2))
              - si: cerca_de(proy_planta(solucion.Bmal_ab))
                mensaje: |
                  Ese B queda **por debajo de A**: has llevado el lado hacia el otro lado de A₁. A es el
                  vértice de menor cota, así que B sube por s, hacia S₀.
                ejemplo: proy_planta(rama(solucion.Bmal_ab, 1))
              - si: cerca_de(solucion.B0AR)
                mensaje: |
                  Has llevado A₁R₁, la charnela, en vez del lado. El lado es A₁D₀, perpendicular a s₀; AR
                  mide casi 2 mm más.
                ejemplo: rama(solucion.B0AR, 1)
              - si: siempre
                mensaje: |
                  B₀ está en s₀ —la recta de A₁ a S₀—, donde la corta el arco de centro A₁ y radio A₁D₀, del
                  lado de S₀.
          - nombre: C0
            pide: el vértice C, el otro de r, abatido
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está en r₀, en la perpendicular a s₀ por B₀. A₁B₀C₀D₀ es el cuadrado en verdadera
              magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.C_ab)))
                mensaje: |
                  Ese es C abatido **al otro lado** de la charnela: va al lado de D₀ y B₀.
                ejemplo: proy_planta(rama(solucion.C_ab, 2))
              - si: cerca_de(proy_planta(solucion.D_ab))
                mensaje: |
                  Ese es D₀. C es el cuarto vértice: en r₀, pero en la perpendicular a s₀ que pasa por B₀.
                ejemplo: proy_planta(rama(solucion.D_ab, 1))
              - si: siempre
                mensaje: |
                  C₀ está donde la perpendicular a s₀ por B₀ corta r₀.
          - nombre: B1
            pide: el vértice B, desabatido, en la planta
            es: proy_planta(B)
            bien: |
              B₁ está en s₁, en la perpendicular a la charnela que pasa por B₀: al desabatir, B vuelve por
              el mismo camino por el que se abatió.
            diagnosticos:
              - si: cerca_de(proy_planta(Bmal))
                mensaje: |
                  Ese B está en s₁, pero por debajo de A: sale de llevar el lado hacia el otro lado de A₁. A
                  es el vértice de menor cota, y B sube.
                ejemplo: proy_planta(Bmal)
              - si: '!en_recta(solucion.perpB1)'
                mensaje: |
                  Al desabatir, B₁ vuelve por la **perpendicular a la charnela que pasa por B₀**: es el mismo
                  camino que habría seguido al abatirse.
                ejemplo: 'uno(medir_sobre(figura.segmento("s1"), desde: proy_planta(B), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("s1"))'
                mensaje: |
                  B está en s: B₁ va **en s₁**, donde la corta la perpendicular a la charnela que sale de B₀.
                ejemplo: 'uno(medir_sobre(solucion.perpB1, desde: proy_planta(B), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  B₁ está donde la perpendicular a la charnela por B₀ corta s₁.
          - nombre: C1
            pide: el vértice C, desabatido, en la planta
            es: proy_planta(C)
            bien: |
              C₁ está en r₁, en la perpendicular a la charnela que pasa por C₀. Esa perpendicular cruza s₁
              por el camino: C está en r, y hay que seguir.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.QpC))
                mensaje: |
                  Te has parado en s₁. La perpendicular que sale de C₀ cruza s₁ antes de llegar a r₁, pero C
                  está en r: sigue hasta r₁.
                ejemplo: proy_planta(solucion.QpC)
              - si: '!en_recta(solucion.perpC1)'
                mensaje: |
                  C₁ vuelve por la **perpendicular a la charnela que pasa por C₀**.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(C), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  C está en r: C₁ va **en r₁**.
                ejemplo: 'uno(medir_sobre(solucion.perpC1, desde: proy_planta(C), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  C₁ está donde la perpendicular a la charnela por C₀ corta r₁.
          - nombre: D1
            pide: el vértice D, desabatido, en la planta
            es: proy_planta(D)
            bien: |
              D₁ está en r₁, en la perpendicular a la charnela que pasa por D₀.
            diagnosticos:
              - si: '!en_recta(solucion.perpD1)'
                mensaje: |
                  D₁ vuelve por la **perpendicular a la charnela que pasa por D₀**.
                ejemplo: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(D), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  D está en r: D₁ va **en r₁**.
                ejemplo: 'uno(medir_sobre(solucion.perpD1, desde: proy_planta(D), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  D₁ está donde la perpendicular a la charnela por D₀ corta r₁.
          - nombre: B2
            pide: el vértice B, en el alzado
            es: proy_alzado(B)
            bien: |
              B₂ está en s₂, en la vertical de B₁.
            diagnosticos:
              - si: '!en_vertical_de(B1)'
                mensaje: |
                  B₂ va en la **vertical de B₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(B), dx: mm(6))'
              - si: '!en_recta(figura.segmento("s2"))'
                mensaje: |
                  B está en s: B₂ va donde la vertical de B₁ corta **s₂**.
                ejemplo: 'desplaza(proy_alzado(B), dy: mm(6))'
              - si: siempre
                mensaje: |
                  B₂ está en la vertical de B₁, sobre s₂.
          - nombre: C2
            pide: el vértice C, en el alzado
            es: proy_alzado(C)
            bien: |
              C₂ está en r₂, en la vertical de C₁.
            diagnosticos:
              - si: '!en_vertical_de(C1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_alzado(C), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  C está en r: C₂ va donde la vertical de C₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(C), dy: mm(6))'
              - si: siempre
                mensaje: |
                  C₂ está en la vertical de C₁, sobre r₂.
          - nombre: D2
            pide: el vértice D, en el alzado
            es: proy_alzado(D)
            bien: |
              D₂ está en r₂, en la vertical de D₁. Las proyecciones son las mismas que con el cambio de
              plano: los dos métodos dan el mismo cuadrado.
            diagnosticos:
              - si: '!en_vertical_de(D1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**.
                ejemplo: 'desplaza(proy_alzado(D), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  D está en r: D₂ va donde la vertical de D₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(D), dy: mm(6))'
              - si: siempre
                mensaje: |
                  D₂ está en la vertical de D₁, sobre r₂.
        trazado:
          - proy_planta(segmento3(R, A))
          - proy_planta(segmento3(solucion.MS, solucion.S_ab))
          - segmento2(figura.punto("A1"), proy_planta(solucion.S_ab))
          - segmento2(proy_planta(R), proy_planta(solucion.C_ab))
          - segmento2(figura.punto("A1"), proy_planta(solucion.D_ab))
          - segmento2(proy_planta(solucion.B_ab), proy_planta(solucion.C_ab))
          - segmento2(proy_planta(B), proy_planta(C))
          - segmento2(proy_planta(D), figura.punto("A1"))
          - segmento2(proy_alzado(B), proy_alzado(C))
          - segmento2(proy_alzado(D), figura.punto("A2"))
        bloques:
          - nombre: Abatimiento con la horizontal por A
            explica: |
              Se abate el plano de r y s sobre el plano horizontal de A, alrededor de la horizontal del
              plano por A, que hemos elegido de charnela: A₁R₁ en la planta. A y R no se mueven; los demás
              puntos giran en planos perpendiculares a la charnela, verticales porque ella es horizontal, y
              en la planta se mueven por las perpendiculares a A₁R₁. El radio de cada uno es su distancia
              real a la charnela, que ninguna vista da: para S, la hipotenusa de lo que S₁ dista de A₁R₁ y
              de los 39 mm que S está más alto que A, 43,5 mm. Abatido, el plano está en verdadera magnitud,
              y el cuadrado se dibuja con escuadra y compás. Para
              [desabatir](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir),
              cada vértice vuelve por su perpendicular a la charnela hasta s₁ o r₁.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("R2"), solucion.S2hmas)
            bloque: Abatimiento con la horizontal por A
            porque: |
              En el alzado, la **horizontal de A₂**, que pasa por el extremo de abajo de r₂: es el alzado de
              la charnela. Se prolonga hacia la derecha, más allá de la vertical de S₂, porque desde ella se
              mide la cota de S.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("R2"), proy_planta(R))
            porque: |
              Por R₂, la vertical hasta r₁: R es el punto de r que tiene la cota de A, y con él sale la
              planta de la charnela.
          - con: marca
            traza: proy_planta(R)
            porque: |
              R₁, donde la vertical de R₂ corta r₁. Va sin rótulo: el punto D₁, que se marca después, lo
              taparía.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("S2"), proy_planta(S))
            porque: |
              Por S₂, la vertical hasta s₁: S es el punto de s que se va a abatir primero, el más alejado
              de la charnela, para que s₀ salga con precisión.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, donde la vertical de S₂ corta s₁.
          - con: regla
            traza: '[segmento2(proy_planta(R), solucion.R1menos), segmento2(proy_planta(R), solucion.MSmas)]'
            bloque: Abatimiento con la horizontal por A
            rotulo: charnela
            porque: |
              La **charnela**, R₁A₁, prolongada con la regla hacia los dos lados, larga: a la derecha de A₁
              cae M, el pie de S.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(S), solucion.S0mas1), segmento2(proy_planta(S), solucion.S0mas2)]'
            bloque: Abatimiento con la horizontal por A
            guia: proy_planta(segmento3(R, A))
            porque: |
              Por S₁, la **perpendicular a la charnela**, larga y hacia los dos lados: al abatir, S gira
              alrededor de la charnela en un plano vertical, y en la planta se mueve por esta recta. Corta la
              charnela en M, el pie de S.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(S), solucion.TSmas)
            bloque: Abatimiento con la horizontal por A
            guia: proy_planta(segmento3(R, A))
            porque: |
              Por S₁, la paralela a la charnela, hacia la derecha, para el triángulo del radio, rectángulo
              en S₁. Cruza la primera línea nueva del cambio de plano, que aquí no se usa.
          - con: compas
            traza: 'arco(proy_planta(S), por: solucion.TS, desde: desplaza(solucion.TS, dx: 1.85, dy: -5.71), hasta: desplaza(solucion.TS, dx: -1.85, dy: 5.71))'
            bloque: Abatimiento con la horizontal por A
            toma: segmento2(figura.punto("S2"), solucion.S2h)
            porque: |
              Con el compás, en el alzado, **lo que S está más alto que A**, que es lo que está por encima de
              la charnela: de S₂ a la horizontal de A₂. Se lleva desde S₁ sobre la paralela.
          - con: regla
            traza: segmento2(proy_planta(solucion.MS), solucion.TS)
            bloque: Abatimiento con la horizontal por A
            rotulo: radio
            porque: |
              La hipotenusa, de M al punto que acabas de llevar, es la **distancia real de S a la
              charnela**: el radio con que S se abate, 43,5 mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.MS), por: solucion.TS, desde: solucion.TS, hasta: proy_planta(solucion.S_ab))'
            bloque: Abatimiento con la horizontal por A
            toma: segmento2(proy_planta(solucion.MS), solucion.TS)
            porque: |
              Con centro en M, que está en la charnela, y ese radio, el arco hasta la perpendicular: S cae
              al plano horizontal de A girando alrededor de la charnela.
          - con: marca
            traza: proy_planta(solucion.S_ab)
            bloque: Abatimiento con la horizontal por A
            rotulo: S₀
            porque: |
              S₀, donde el arco de centro M corta la perpendicular a la charnela por S₁: S abatido. Aquí cae
              hacia abajo de la planta; al otro lado también valdría, con todo lo demás al mismo lado.
          - con: regla
            traza: segmento2(figura.punto("A1"), proy_planta(solucion.S_ab))
            bloque: Abatimiento con la horizontal por A
            rotulo: s₀
            porque: |
              s₀, la recta s abatida: de A₁, que está en la charnela y no se mueve, a S₀.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(R), solucion.C0mas)
            bloque: Abatimiento con la horizontal por A
            guia: segmento2(figura.punto("A1"), proy_planta(solucion.S_ab))
            rotulo: r₀
            porque: |
              r₀, la paralela a s₀ por R₁: R está en la charnela y no se mueve, y dos rectas paralelas
              siguen siéndolo abatidas.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), proy_planta(solucion.D_ab))
            bloque: Abatimiento con la horizontal por A
            guia: segmento2(figura.punto("A1"), proy_planta(solucion.S_ab))
            porque: |
              Por A₁, la **perpendicular a s₀** hasta r₀: el lado AD, la distancia real entre r y s.
          - con: marca
            traza: proy_planta(solucion.D_ab)
            bloque: Abatimiento con la horizontal por A
            rotulo: D₀
            porque: |
              D₀, donde la perpendicular corta r₀.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: proy_planta(solucion.B_ab), desde: proy_planta(solucion.D_ab), hasta: proy_planta(solucion.B_ab))'
            bloque: Abatimiento con la horizontal por A
            toma: segmento2(figura.punto("A1"), proy_planta(solucion.D_ab))
            porque: |
              Con centro en A₁ y radio A₁D₀, un cuarto de vuelta hasta s₀, del lado de S₀: B está por encima
              de A.
          - con: marca
            traza: proy_planta(solucion.B_ab)
            bloque: Abatimiento con la horizontal por A
            rotulo: B₀
            porque: |
              B₀, donde el arco corta s₀.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.B_ab), proy_planta(solucion.C_ab))
            bloque: Abatimiento con la horizontal por A
            guia: segmento2(figura.punto("A1"), proy_planta(solucion.S_ab))
            porque: |
              Por B₀, la perpendicular a s₀ hasta r₀: el lado BC.
          - con: marca
            traza: proy_planta(solucion.C_ab)
            bloque: Abatimiento con la horizontal por A
            rotulo: C₀
            porque: |
              C₀, donde la perpendicular corta r₀. A₁B₀C₀D₀ es el cuadrado en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(rama(solucion.B_ab, 1)), proy_planta(B)), segmento2(proy_planta(rama(solucion.D_ab, 1)), proy_planta(D)), segmento2(proy_planta(rama(solucion.C_ab, 1)), proy_planta(C))]'
            bloque: Abatimiento con la horizontal por A
            guia: proy_planta(segmento3(R, A))
            porque: |
              Se desabate por el mismo camino: desde B₀, D₀ y C₀, las perpendiculares a la charnela. B está
              en s, y su perpendicular para en s₁; D y C están en r, y las suyas siguen hasta r₁ —la de C
              cruza s₁ por el camino—.
          - con: marca
            traza: proy_planta(B)
            bloque: Abatimiento con la horizontal por A
            rotulo: B₁
            porque: |
              B₁, donde la perpendicular de B₀ corta s₁.
          - con: marca
            traza: proy_planta(D)
            bloque: Abatimiento con la horizontal por A
            rotulo: D₁
            porque: |
              D₁, donde la perpendicular de D₀ corta r₁.
          - con: marca
            traza: proy_planta(C)
            bloque: Abatimiento con la horizontal por A
            rotulo: C₁
            porque: |
              C₁, donde la perpendicular de C₀ corta r₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(B), proy_alzado(B)), segmento2(proy_planta(C), proy_alzado(C)), segmento2(proy_planta(D), proy_alzado(D))]'
            porque: |
              Los alzados, por las verticales de B₁, C₁ y D₁: la de B₁ hasta s₂, y las de C₁ y D₁ hasta r₂.
          - con: marca
            traza: proy_alzado(B)
            rotulo: B₂
            porque: |
              B₂, donde la vertical de B₁ corta s₂.
          - con: marca
            traza: proy_alzado(C)
            rotulo: C₂
            porque: |
              C₂, donde la vertical de C₁ corta r₂.
          - con: marca
            traza: proy_alzado(D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta r₂.
          - con: regla
            traza: '[segmento2(proy_planta(B), proy_planta(C)), segmento2(proy_planta(D), figura.punto("A1")), segmento2(proy_alzado(B), proy_alzado(C)), segmento2(proy_alzado(D), figura.punto("A2"))]'
            porque: |
              Los lados BC y DA en las dos vistas: las proyecciones del cuadrado, las mismas que con el
              cambio de plano.
        pista: |
          (1) La charnela: A₁R₁, con R₁ en la vertical del extremo de abajo de r₂. (2) Por S₁, la
          perpendicular a la charnela; la corta en M. (3) Por S₁, paralela a la charnela, lleva lo que S₂
          está por encima de la horizontal de A₂: la distancia de M a ese punto es el radio. (4) Con
          centro en M, corta la perpendicular: S₀. (5) s₀ = A₁S₀; r₀, paralela por R₁. (6) La
          perpendicular a s₀ por A₁ da D₀; el lado, sobre s₀ hacia S₀, da B₀. (7) Desabate por las
          perpendiculares a la charnela, hasta s₁ o r₁.
        desarrollo: |
          En verde claro, la charnela, el camino de S, las rectas abatidas, el cuadrado A₁B₀C₀D₀ en
          verdadera magnitud y sus dos proyecciones, las mismas que con el cambio de plano.

      - tipo: calcular
        titulo: El lado del cuadrado
        pregunta: ¿Cuánto mide de verdad el lado del cuadrado?
        respuesta:
          tipo: numero
          valor: '22.51'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '21.22'
            receta: en_mm(vm_planta(A, D))
            mensaje: |
              Eso es lo que mide **A₁D₁ en la planta**. AD sube de A a D, y la planta lo acorta. El lado en
              verdadera magnitud es A₅D₅ en la vista 5, o A₁D₀ en el abatimiento.
          - valor: '20.19'
            receta: en_mm(vm_alzado(A, D))
            mensaje: |
              Eso es **A₂D₂ en el alzado**, que también acorta: AD se acerca al plano vertical mientras sube.
          - valor: '24.25'
            receta: en_mm(vm(A, R))
            mensaje: |
              Eso es **AR**, el tramo de la horizontal por A que va de s a r: en verdadera magnitud, pero no
              es el lado. AR no es perpendicular a las dos rectas, y por eso mide más que la distancia entre
              ellas.
        pista: |
          Mide A₅D₅ o A₁D₀ con «medir» del Taller, en el paso anterior, o en tu lámina de papel: es el lado.
        desarrollo: |
          El lado es la distancia real de A a la recta r, la perpendicular AD:

          $$ \overline{AD} = \sqrt{\overline{A_1D_1}^{\,2} + \Delta z^{2}} = \sqrt{21{,}22^{2} + 7{,}50^{2}} \approx 22{,}51 \text{ mm} $$

          Dentro de la tolerancia caen, por casualidad, otras medidas del dibujo que no son el lado: en el
          alzado, A₂B₂ y C₂D₂ miden 21,63 mm cada uno, A₂R₂ 23,07 y S₂B₂ 23,40; y en la vista 4, S₄B₄ mide 22,61.
          Quien mida cualquiera de ellas recibe un «bien» que no ha ganado. El lado se mide sin acortar en la
          vista 5, de A₅ a B₅, o en el abatimiento, de A₁ a B₀.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: r y s son paralelas, así que los lados que van sobre ellas son opuestos y el lado del cuadrado es la distancia real entre las dos.
          - texto: En verdadera magnitud, en la vista 5 o abatido, la perpendicular a s por A corta r en D, y AD es el lado.
          - texto: B va sobre s, a un lado de A, hacia donde s sube, porque A es el vértice de menor cota; C, en r, en la perpendicular a s por B.
          - texto: De vuelta a las proyecciones, B cae en s₁ y en s₂, y C y D en r₁ y en r₂, porque cada vértice está en su recta.
          - texto: El lado del cuadrado es AR, el tramo de la horizontal por A que va de s a r.
            trampa: true
            mensaje: |
              AR une las dos rectas, pero no es perpendicular a ellas: forma 68° con r. Mide 24,25 mm, más
              que el lado; el lado es la perpendicular AD, de 22,51 mm.
    resolucion: |
      **Qué fija el enunciado.** r₂ y s₂ son paralelas, y r₁ y s₁ también: r y s son paralelas, y el
      plano que definen es oblicuo, a 63,7° del horizontal. Los dos lados que van sobre ellas son
      opuestos, y el lado es la distancia real entre las dos rectas, 22,51 mm. A está en s; D, el vértice
      que forma lado con él, es el pie de la perpendicular desde A a r. B está en s, a un lado de A, y
      como A es el vértice de menor cota, B queda del lado en que s sube.

      **Por cambio de plano.** La horizontal del plano por A pasa por el extremo de abajo de r₂, R, que
      está a su altura. Con la primera línea nueva perpendicular a A₁R₁ y A de referencia, A₄ ≡ R₄ caen
      en la línea, y S₄ a 39 mm: el plano sale de canto. La segunda línea, paralela al canto, lleva lo que
      cada planta distaba de la primera: S₅ cae hacia dentro, porque S₁ está más cerca de la línea que
      A₁, y R₅ hacia fuera, a lo que mide A₁R₁. En la vista 5, s₅ y r₅ son paralelas; la perpendicular a
      s₅ por A₅ da D₅, y el lado llevado sobre s₅ hacia S₅ da B₅. De vuelta, cada vértice va al canto y
      de ahí a s₁ o a r₁.

      **Por abatimiento.** Con la horizontal por A de charnela, A y R no se mueven. S se abate con el
      triángulo: su cota sobre A, 39,0 mm, y lo que S₁ dista de la charnela, 19,3 mm, dan un radio de
      43,5 mm. s₀ va de A₁ a S₀, y r₀ es su paralela por R₁. El cuadrado se dibuja ahí, y se desabate por
      las perpendiculares a la charnela, hasta s₁ o r₁.

      **Las proyecciones.** B₁ y B₂ en s₁ y s₂; C₁, C₂, D₁ y D₂ en r₁ y r₂. Las dos construcciones dan
      las mismas. AR, el tramo horizontal entre las dos rectas, mide 24,25 mm: no es el lado, porque no
      es perpendicular a ellas.

  - id: sd23-la-lampara-de-tres-varillas
    titulo: La lámpara colgada de tres varillas, por abatimiento
    fuente: Ejercicio 18 (SD23) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 19). Su
    # «NOTA» va entera al campo `notas` (§04, «Las notas del enunciado»).
    enunciado: |
      Se desea colgar una lámpara de un techo mediante tres varillas. Una varilla se fija en el punto
      A y es de 40 cm. La segunda, de 70 cm, se fija en el punto B y la tercera de 60 cm en el punto
      C. Los tres extremos libres irán unidos entre sí en el punto V. Representar a escala 1:10 el
      trípode así formado. Utilizar el método de abatimiento.

      **Notas nuestras.** La figura son solo las cruces de A, B y C, en el alzado, arriba, y en la
      planta, debajo. A₂, B₂ y C₂ están en la misma horizontal: el techo es horizontal. Arriba a la
      derecha, un croquis en perspectiva enseña el techo, las tres varillas y la lámpara colgada en V:
      es ilustración. A escala 1:10, cada milímetro del papel es un centímetro: las varillas miden 40,
      70 y 60 mm en el dibujo. Los nombres V₀, V₀′, M, (V₀)₁ y T₂ son nuestros.
    notas:
      - 'NOTA: Para dibujar la proyección horizontal se supone que el techo es transparente.'
    pide: V abatido con las charnelas AB y AC, las dos proyecciones de V, el trípode dibujado y a qué altura bajo el techo cuelga la lámpara.
    receta:
      lamina: sd23
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
      solucion:
        # Decisión: V es el punto a 40, 70 y 60 mm (las varillas a escala
        # 1:10) de A, B y C. Hay dos, uno a cada lado del techo: la lámpara
        # cuelga, así que se fija el de abajo con `sentido: descendente`, y el
        # de arriba se diagnostica.
        V: 'punto_a_tres_distancias(A, mm(40), B, mm(70), C, mm(60), sentido: descendente)'
        Vup: 'punto_a_tres_distancias(A, mm(40), B, mm(70), C, mm(60), sentido: ascendente)'
        # Decisión: el enunciado impone el abatimiento y no dice cuál. Se
        # abaten sobre el techo los triángulos VAB y VAC, con las charnelas AB
        # y AC, que son horizontales porque el techo lo es. V abatido es una
        # LISTA de dos posiciones con cada charnela: las dos dan la misma
        # perpendicular a la charnela, y la elección no cambia nada de lo que
        # viene después.
        chAB: recta3(A, B)
        chAC: recta3(A, C)
        V0ab: abatido(V, chAB, plano(A, B, V))
        V0ac: abatido(V, chAC, plano(A, C, V))
        # La que dibuja la construcción: la del lado de C con AB, y la de
        # arriba con AC.
        V0ab2: uno(proy_planta(V0ab), 2)
        V0ac2: uno(proy_planta(V0ac), 2)
        # Los pies de V en las charnelas (M en AB cae fuera del segmento, más
        # allá de A), las dos perpendiculares que se cortan en V₁ y el
        # triángulo del radio: (V₀)₁ en la paralela a A₁B₁ por V₁, a la altura
        # de V bajo el techo.
        MAB: pie_perpendicular(V, chAB)
        MAC: pie_perpendicular(V, chAC)
        segAB: 'segmento2(figura.punto("A1"), figura.punto("B1"))'
        segAC: 'segmento2(figura.punto("A1"), figura.punto("C1"))'
        perpAB: 'perpendicular(por: V0ab2, a: segAB)'
        perpAC: 'perpendicular(por: V0ac2, a: segAC)'
        parV1: 'perpendicular(por: proy_planta(V), a: perpAB)'
        Vo1: 'uno(medir_sobre(parV1, desde: proy_planta(V), distancia: diferencia_de_cotas(V, A)), 1)'
        # En el alzado: el techo de canto, T₂ (el punto del techo encima de
        # V) y la vertical hacia abajo desde T₂.
        techo2: 'segmento2(figura.punto("A2"), figura.punto("C2"))'
        T2: pie_perpendicular(proy_planta(V), techo2)
        bajada: segmento2(T2, proy_alzado(V))
        # Las varillas cambiadas, para el diagnóstico: el punto a 70 de A y 40
        # de B (y a 60 de A y 40 de C), abatido con su charnela.
        Wab: 'punto_a_tres_distancias(A, mm(70), B, mm(40), C, mm(60), sentido: descendente)'
        W0ab: abatido(Wab, chAB, plano(A, B, Wab))
        Wac: 'punto_a_tres_distancias(A, mm(60), B, mm(70), C, mm(40), sentido: descendente)'
        W0ac: abatido(Wac, chAC, plano(A, C, Wac))
        # Las cifras del calcular: a escala 1:10, los mm del papel son cm.
        h_cm: en_mm(diferencia_de_cotas(V, A))
        radioAB_cm: en_mm(vm(V, MAB))
        plantaAB_cm: en_mm(vm_planta(V, MAB))
        sumaAB_cm: 'en_mm(raiz(vm(V, MAB) * vm(V, MAB) + vm_planta(V, MAB) * vm_planta(V, MAB)))'
      comprueba:
        # El techo es horizontal: los tres puntos están en el plano horizontal
        # de A, y las dos charnelas, en el techo.
        - 'en_plano(C, plano(A, B, punto3(alzado: desplaza(figura.punto("A2"), dx: 50), planta: desplaza(figura.punto("A1"), dx: 50))))'
        - en_recta(MAB, chAB)
    pasos:
      - tipo: reconocer
        pregunta: A₂, B₂ y C₂ están en la misma horizontal del alzado. ¿Qué dice eso del techo, y para qué sirve?
        opciones:
          - texto: El techo es horizontal; A₁B₁C₁ está en verdadera magnitud, y cada lado sirve de charnela para abatir sobre el techo el triángulo de dos varillas
            correcta: true
            mensaje: |
              Eso es. Tres puntos a la misma altura definen un plano horizontal, y una figura horizontal
              se ve sin acortar en la planta: A₁B₁ es la distancia real entre A y B. El triángulo VAB,
              con sus tres lados conocidos (AB y las varillas de 40 y 70 cm), se abate sobre el techo
              alrededor de AB y se dibuja con el compás.
          - texto: El techo es frontal, y se ve en verdadera magnitud en el alzado; allí se miden AB, BC y CA, y las varillas se abaten alrededor de cada uno de esos lados
            mensaje: |
              Frontal sería con la planta reducida a una recta horizontal. Aquí lo que se reduce a una
              recta es el alzado: desde delante el techo se ve de canto, y un plano que se ve de canto
              en el alzado con esa recta horizontal es un plano horizontal.
          - texto: Las varillas se ven en verdadera magnitud en la planta, porque el techo es transparente y se dibujan vistas por debajo, así que se miden ahí sin abatir nada
            mensaje: |
              La nota del techo transparente solo dice que en la planta las varillas se dibujan vistas,
              aunque estén debajo del techo. No dice nada de su longitud: bajan de A, B y C hasta V, y la
              planta las acorta.

      - tipo: construir
        titulo: V abatido con dos charnelas, y de vuelta a sus vistas
        intro: |
          El enunciado impone el abatimiento y no dice cuál; lo fijamos nosotros. La varilla de A forma
          con la de B el triángulo VAB, y con la de C, el VAC: los dos se abaten sobre el techo, que es
          horizontal, alrededor de AB y de AC. Abatido, cada triángulo tiene sus tres lados en
          verdadera magnitud: AB o AC, que ya lo están en la planta, y dos varillas, a escala 1:10, de
          40, 70 o 60 mm. V₀ es V abatido con la charnela AB, y V₀′, con la AC; vale cualquiera de los
          dos lados de cada charnela, porque los dos dan la misma perpendicular. Al volver, V se mueve
          por la perpendicular a cada charnela, y las dos se cortan en V₁. La altura sale del triángulo
          del radio y se lleva por debajo del techo: la lámpara cuelga, y la solución simétrica, por
          encima, no vale. Avisos para el imán: V₀ y V₀′ quedan a unos 2 mm de cruces de lo que se
          traza después (el lado C₁V₀′ pasa justo por debajo de V₀; la vertical de V₁ y el arco de
          centro M, junto a V₀′), así que márcalos en cuanto los construyas; y V₁ queda a 4 mm del
          cruce de la perpendicular de V₀′ con el lado A₁V₀. Amplía con la lupa.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: V0
            rotulo: V₀
            pide: V abatido sobre el techo con la charnela AB
            es: proy_planta(solucion.V0ab)
            bien: |
              V₀ está a 40 mm de A₁ y a 70 mm de B₁: el triángulo VAB abatido, con sus tres lados en
              verdadera magnitud. Valen los dos cortes de los arcos, uno a cada lado de A₁B₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.W0ab))
                mensaje: |
                  Has cambiado las varillas: ese punto está a 70 mm de A₁ y a 40 de B₁. La varilla de A
                  mide 40 cm y la de B, 70: V₀ está a 40 mm de A₁ y a 70 de B₁.
                ejemplo: uno(proy_planta(solucion.W0ab), 2)
              - si: '!a_distancia(de: figura.punto("A1"), d: mm(40))'
                mensaje: |
                  V₀ está a **40 mm de A₁**: la varilla de A mide 40 cm, y a escala 1:10 son 40 mm. Al
                  abatir el triángulo sobre el techo, la varilla conserva su longitud.
                ejemplo: 'desplaza(solucion.V0ab2, dy: mm(4))'
              - si: '!a_distancia(de: figura.punto("B1"), d: mm(70))'
                mensaje: |
                  Estás a 40 mm de A₁, pero no a **70 mm de B₁**, la varilla de B. V₀ es el cruce del arco
                  de 40 mm con centro en A₁ y el de 70 mm con centro en B₁.
                ejemplo: 'uno(medir_sobre(solucion.segAC, desde: figura.punto("A1"), distancia: mm(40)), 1)'
              - si: siempre
                mensaje: |
                  V₀ es uno de los dos cortes del arco de 40 mm con centro en A₁ y el de 70 mm con centro
                  en B₁.
          - nombre: V0p
            rotulo: V₀′
            pide: V abatido sobre el techo con la charnela AC
            es: proy_planta(solucion.V0ac)
            bien: |
              V₀′ está a 40 mm de A₁ y a 60 mm de C₁: el triángulo VAC abatido. La varilla de A está en
              los dos triángulos, y V₀ y V₀′ están en el mismo arco de centro A₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.W0ac))
                mensaje: |
                  Has cambiado las varillas: ese punto está a 60 mm de A₁ y a 40 de C₁. La de A mide 40 cm
                  y la de C, 60.
                ejemplo: uno(proy_planta(solucion.W0ac), 2)
              - si: '!a_distancia(de: figura.punto("A1"), d: mm(40))'
                mensaje: |
                  V₀′ está a **40 mm de A₁**, la varilla de A, como V₀: los dos están en el mismo arco.
                ejemplo: 'desplaza(solucion.V0ac2, dy: mm(4))'
              - si: '!a_distancia(de: figura.punto("C1"), d: mm(60))'
                mensaje: |
                  Estás a 40 mm de A₁, pero no a **60 mm de C₁**, la varilla de C.
                ejemplo: 'uno(medir_sobre(solucion.segAB, desde: figura.punto("A1"), distancia: mm(40)), 1)'
              - si: siempre
                mensaje: |
                  V₀′ es uno de los dos cortes del arco de 40 mm con centro en A₁ y el de 60 mm con centro
                  en C₁.
          - nombre: V1
            rotulo: V₁
            pide: la planta de V, el extremo común de las tres varillas
            es: proy_planta(solucion.V)
            bien: |
              V₁ es el cruce de la perpendicular a A₁B₁ por V₀ y de la perpendicular a A₁C₁ por V₀′. Al
              desabatir, V gira alrededor de cada charnela en un plano perpendicular a ella, que es
              vertical: su planta no se sale de esas rectas.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.MAB))
                mensaje: |
                  Ese es M, el pie de la perpendicular en la charnela AB. V₁ está en esa perpendicular,
                  pero no en la charnela: V cuelga por debajo del techo, y solo los puntos del techo se
                  quedan en él.
                ejemplo: proy_planta(solucion.MAB)
              - si: en_recta(solucion.perpAB)
                mensaje: |
                  Estás en la perpendicular a A₁B₁ que pasa por V₀, y V₁ está en ella, pero donde la corta
                  la perpendicular a A₁C₁ que pasa por V₀′.
                ejemplo: 'uno(medir_sobre(solucion.perpAB, desde: proy_planta(solucion.V), distancia: mm(8)), 1)'
              - si: en_recta(solucion.perpAC)
                mensaje: |
                  Estás en la perpendicular a A₁C₁ que pasa por V₀′, y V₁ está en ella, pero donde la corta
                  la perpendicular a A₁B₁ que pasa por V₀.
                ejemplo: 'uno(medir_sobre(solucion.perpAC, desde: proy_planta(solucion.V), distancia: mm(8)), 1)'
              - si: siempre
                mensaje: |
                  Al desabatir, V vuelve por la perpendicular a la charnela: V₁ está en la perpendicular a
                  A₁B₁ por V₀ y en la perpendicular a A₁C₁ por V₀′, donde se cortan.
          - nombre: V2
            rotulo: V₂
            pide: el alzado de V
            es: proy_alzado(solucion.V)
            bien: |
              V₂ está en la vertical de V₁, 28,4 mm por debajo del techo: la altura del triángulo del
              radio, V₁(V₀)₁. La lámpara cuelga 28,4 cm por debajo del techo.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Vup))
                mensaje: |
                  Has llevado la altura hacia arriba, por encima del techo. Ahí las varillas también se
                  juntarían, pero la lámpara cuelga: V₂ va por debajo de la recta del techo.
                ejemplo: proy_alzado(solucion.Vup)
              - si: '!en_vertical_de(V1)'
                mensaje: |
                  V₂ va en la **vertical de V₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.V), dx: mm(6))'
              - si: 'a_distancia(de: solucion.T2, d: vm(V, solucion.MAB))'
                mensaje: |
                  Has bajado 39,2 mm: el radio del abatimiento, MV₀, que es la distancia de V a la
                  charnela AB, inclinada (o los 40 mm de la varilla de A, que casi lo igualan). La altura
                  es el cateto vertical del triángulo del radio: V₁(V₀)₁.
                ejemplo: 'uno(medir_sobre(solucion.bajada, desde: solucion.T2, distancia: vm(V, solucion.MAB)), 1)'
              - si: 'a_distancia(de: solucion.T2, d: vm_planta(V, solucion.MAB))'
                mensaje: |
                  Has bajado MV₁, lo que V₁ dista de la charnela en la planta: es el otro cateto del
                  triángulo del radio. La altura es V₁(V₀)₁, el cateto que sale de cortar con el radio MV₀
                  la paralela a A₁B₁ por V₁.
                ejemplo: 'uno(medir_sobre(solucion.bajada, desde: solucion.T2, distancia: vm_planta(V, solucion.MAB)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de V₁, pero no a la altura buena. Con centro en T₂, donde esa
                  vertical corta el techo, y radio V₁(V₀)₁, el arco la corta por debajo del techo en V₂.
        trazado:
          - 'segmento2(figura.punto("A1"), solucion.V0ab2)'
          - 'segmento2(figura.punto("B1"), solucion.V0ab2)'
          - 'segmento2(figura.punto("A1"), solucion.V0ac2)'
          - 'segmento2(figura.punto("C1"), solucion.V0ac2)'
          - 'segmento2(solucion.V0ab2, proy_planta(solucion.MAB))'
          - 'segmento2(solucion.V0ac2, proy_planta(solucion.MAC))'
          - 'segmento2(proy_planta(solucion.V), figura.punto("A1"))'
          - 'segmento2(proy_planta(solucion.V), figura.punto("B1"))'
          - 'segmento2(proy_planta(solucion.V), figura.punto("C1"))'
          - 'segmento2(proy_alzado(solucion.V), figura.punto("A2"))'
          - 'segmento2(proy_alzado(solucion.V), figura.punto("B2"))'
          - 'segmento2(proy_alzado(solucion.V), figura.punto("C2"))'
        bloques:
          - nombre: Abatimiento de VAB sobre el techo
            explica: |
              El enunciado impone el
              [abatimiento](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)
              y no dice cuál; lo fijamos nosotros. El techo es horizontal, y el triángulo VAB se
              tumba sobre él girando alrededor de la charnela AB. Abatido, la planta da sus tres
              lados sin acortar: AB y las varillas de A y de B, de 40 y 70 mm a escala 1:10, que al
              girar no cambian. Por eso V₀ sale de dos arcos, sin conocer todavía V.
          - nombre: Abatimiento de VAC sobre el techo
            explica: |
              Lo mismo con el triángulo VAC y la charnela AC: abatido, sus lados son A₁C₁ y las
              varillas de A y de C, de 40 y 60 mm, y V₀′ sale de dos arcos. Hace falta este segundo
              abatimiento porque uno solo deja V₁ en una recta de la planta, y no en un punto.
          - nombre: Vuelta de V a las vistas de la hoja
            explica: |
              Al desabatir, V gira alrededor de cada charnela en un plano vertical, perpendicular a
              ella: V₁ está en la perpendicular a A₁B₁ por V₀ y en la perpendicular a A₁C₁ por V₀′,
              donde se cortan. La altura sale del triángulo del radio de AB, al revés que al abatir:
              la hipotenusa es MV₀, la distancia de V a la charnela, que el giro conserva; un
              cateto, MV₁, y el otro, lo que V cuelga bajo el techo. En el alzado se lleva desde el
              techo, que se ve de canto, hacia abajo.
        construccion:
          - con: regla
            traza: 'segmento2(figura.punto("B1"), uno(medir_sobre(solucion.segAB, desde: proy_planta(solucion.MAB), distancia: 12), 2))'
            rotulo: AB
            bloque: Abatimiento de VAB sobre el techo
            porque: |
              La charnela AB: A₁B₁, unida con la regla y prolongada más allá de A₁, larga, porque el pie
              de V en ella cae fuera del segmento. El techo es horizontal, y A₁B₁ es la verdadera magnitud
              de AB.
          - con: regla
            traza: 'segmento2(figura.punto("A1"), figura.punto("C1"))'
            rotulo: AC
            bloque: Abatimiento de VAC sobre el techo
            porque: |
              La charnela AC: A₁C₁, unida con la regla. También es una horizontal del techo, en verdadera
              magnitud.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.V0ab2, desde: desplaza(solucion.V0ab2, dx: 10, dy: 5), hasta: desplaza(solucion.V0ac2, dx: -8))'
            bloque: Abatimiento de VAB sobre el techo
            porque: |
              Con el compás abierto 40 mm en la regla, la varilla de A a escala 1:10, y centro en A₁, un
              arco largo hacia arriba. La varilla de A está en los dos triángulos, y abatida no cambia de
              longitud: en este arco caen V₀ y V₀′.
          - con: compas
            traza: 'arco(figura.punto("B1"), por: solucion.V0ab2, desde: desplaza(solucion.V0ab2, dx: 6, dy: -2), hasta: desplaza(solucion.V0ab2, dx: -6, dy: 2))'
            bloque: Abatimiento de VAB sobre el techo
            porque: |
              Con 70 mm, la varilla de B, y centro en B₁, el arco que corta al anterior: el triángulo VAB
              abatido tiene sus tres lados en verdadera magnitud, 50, 40 y 70 mm. Los dos arcos se cortan
              dos veces, una a cada lado de A₁B₁; vale cualquiera, y aquí se toma la de arriba, del lado
              de C₁.
          - con: marca
            traza: solucion.V0ab2
            rotulo: V₀
            bloque: Abatimiento de VAB sobre el techo
            porque: |
              V₀, donde se cortan los arcos de A₁ y de B₁: V abatido sobre el techo con la charnela AB.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: solucion.V0ac2, desde: desplaza(solucion.V0ac2, dx: 3, dy: -5.4), hasta: desplaza(solucion.V0ac2, dx: -3, dy: 5.4))'
            bloque: Abatimiento de VAC sobre el techo
            porque: |
              Con 60 mm, la varilla de C, y centro en C₁, el arco que corta al de A₁: el triángulo VAC
              abatido. También corta dos veces, una a cada lado de A₁C₁; aquí, la de arriba.
          - con: marca
            traza: solucion.V0ac2
            rotulo: V₀′
            bloque: Abatimiento de VAC sobre el techo
            porque: |
              V₀′, donde el arco de C₁ corta el de A₁: V abatido con la charnela AC.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), solucion.V0ab2), segmento2(figura.punto("B1"), solucion.V0ab2), segmento2(figura.punto("A1"), solucion.V0ac2), segmento2(figura.punto("C1"), solucion.V0ac2)]'
            bloque: Abatimiento de VAC sobre el techo
            porque: |
              Los dos triángulos abatidos, con la regla: A₁V₀B₁ es VAB en verdadera magnitud, con lados de
              50, 40 y 70 mm, y A₁V₀′C₁ es VAC, con 60,9, 40 y 60. A₁V₀, B₁V₀ y C₁V₀′ son las varillas
              de verdad: abatidas no se acortan, y A₁V₀ y A₁V₀′ son la misma, la de A.
          - con: escuadra-cartabon
            traza: 'segmento2(solucion.V0ab2, uno(medir_sobre(solucion.perpAB, desde: proy_planta(solucion.MAB), distancia: 8), 1))'
            guia: solucion.segAB
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Por V₀, la **perpendicular a A₁B₁**, larga, hasta pasar la charnela prolongada: al
              desabatir, V gira alrededor de AB en un plano perpendicular a ella, que es vertical, y su
              planta V₁ está en esta recta.
          - con: marca
            traza: proy_planta(solucion.MAB)
            rotulo: M
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              M, donde la perpendicular corta la charnela prolongada, más allá de A₁: el pie de V en la
              recta AB. MV₀ es la distancia real de V a la charnela.
          - con: escuadra-cartabon
            traza: 'segmento2(solucion.V0ac2, uno(medir_sobre(solucion.perpAC, desde: proy_planta(solucion.MAC), distancia: 8), 1))'
            guia: solucion.segAC
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Por V₀′, la **perpendicular a A₁C₁**, larga, hasta pasar la charnela AC: la planta de V
              también está en esta recta, y corta a la anterior.
          - con: marca
            traza: proy_planta(solucion.V)
            rotulo: V₁
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              V₁, donde se cortan las dos perpendiculares: la planta de V. Con el techo transparente,
              como dice la nota, se ve desde arriba.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.V), uno(medir_sobre(solucion.parV1, desde: proy_planta(solucion.V), distancia: diferencia_de_cotas(V, A) + 12), 1))'
            guia: solucion.segAB
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Por V₁, la paralela a A₁B₁, larga: la perpendicular a MV₁ por V₁, el cateto que falta del
              triángulo rectángulo del radio.
          - con: compas
            traza: 'arco(proy_planta(solucion.MAB), por: solucion.V0ab2, desde: solucion.V0ab2, hasta: solucion.Vo1)'
            toma: segmento2(proy_planta(solucion.MAB), solucion.V0ab2)
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Con centro en M y radio MV₀, la distancia real de V a la charnela, el arco desde V₀ hasta la
              paralela. El triángulo M V₁ (V₀)₁ es rectángulo en V₁: su hipotenusa es MV₀, un cateto es
              MV₁, lo que V₁ dista de la charnela en la planta, y el otro es lo que V está por debajo del
              techo. El arco corta la paralela a los dos lados de V₁, y los dos dan la misma altura: aquí,
              el de la izquierda.
          - con: marca
            traza: solucion.Vo1
            rotulo: (V₀)₁
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              (V₀)₁, donde el arco corta la paralela: V₁(V₀)₁, 28,4 mm, es la altura de V bajo el techo,
              28,4 cm de verdad.
          - con: regla
            traza: 'segmento2(figura.punto("A2"), figura.punto("C2"))'
            rotulo: techo
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              En el alzado, A₂C₂, que pasa por B₂: el techo, horizontal, visto de canto. Desde él se miden
              las alturas.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.V), desplaza(solucion.T2, dy: -8))'
            guia: solucion.techo2
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Desde V₁, la línea de referencia, vertical, hasta pasar el techo: V₂ está en ella.
          - con: marca
            traza: solucion.T2
            rotulo: T₂
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              T₂, donde la vertical de V₁ corta el techo: el punto del techo que está justo encima de V.
          - con: compas
            traza: 'arco(solucion.T2, por: proy_alzado(solucion.V), desde: desplaza(proy_alzado(solucion.V), dx: 6), hasta: desplaza(proy_alzado(solucion.V), dx: -6))'
            toma: segmento2(proy_planta(solucion.V), solucion.Vo1)
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              Con el compás, la altura V₁(V₀)₁, y centro en T₂, el arco que corta la vertical por debajo
              del techo. A la misma distancia por encima también la cortaría: esa es la otra solución,
              con las varillas hacia arriba, y la lámpara cuelga.
          - con: marca
            traza: proy_alzado(solucion.V)
            rotulo: V₂
            bloque: Vuelta de V a las vistas de la hoja
            porque: |
              V₂, donde el arco corta la vertical de V₁, 28,4 mm por debajo del techo.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.V), figura.punto("A2")), segmento2(proy_alzado(solucion.V), figura.punto("B2")), segmento2(proy_alzado(solucion.V), figura.punto("C2")), segmento2(proy_planta(solucion.V), figura.punto("A1")), segmento2(proy_planta(solucion.V), figura.punto("B1")), segmento2(proy_planta(solucion.V), figura.punto("C1"))]'
            porque: |
              Las tres varillas, en las dos vistas: de V₂ a A₂, B₂ y C₂, y de V₁ a A₁, B₁ y C₁. Solo se
              tocan en V, y el techo es transparente: todas se ven, en continua.
        pista: |
          (1) Con centro en A₁, un arco de 40 mm; con centro en B₁, uno de 70: se cortan en V₀. Con
          centro en C₁, uno de 60, que corta al de A₁ en V₀′. (2) Por V₀, la perpendicular a A₁B₁; por
          V₀′, la perpendicular a A₁C₁: se cortan en V₁. (3) La primera corta la charnela en M. Por V₁,
          la paralela a A₁B₁; con centro en M y radio MV₀, córtala: de V₁ a ese punto es la altura. (4)
          Baja la altura desde el techo, por la vertical de V₁: V₂.
        desarrollo: |
          En verde claro, los dos triángulos abatidos, VAB con la charnela AB y VAC con la AC; las dos
          perpendiculares que llevan a V₁, y las tres varillas en las dos vistas. V cuelga 28,4 mm por
          debajo del techo en el dibujo: 28,4 cm de verdad.

      - tipo: calcular
        titulo: A qué altura cuelga la lámpara
        pregunta: ¿Cuántos centímetros por debajo del techo queda V, de verdad? A escala 1:10, cada milímetro del papel es un centímetro.
        respuesta:
          tipo: numero
          valor: '28.44'
          receta: h_cm
          tolerancia: 1
          formato: un número, en cm
        distractores:
          - valor: '39.19'
            receta: radioAB_cm
            mensaje: |
              Eso es MV₀, el radio del abatimiento con la charnela AB: la distancia de V a la recta AB,
              que no es vertical. La altura es el cateto vertical del triángulo del radio, no su
              hipotenusa. (Los 40 cm de la varilla de A, que casi lo igualan, tampoco valen: ninguna
              varilla cuelga vertical.)
          - valor: '26.97'
            receta: plantaAB_cm
            mensaje: |
              Eso es MV₁, lo que V₁ dista de la charnela en la planta: el cateto horizontal del triángulo
              del radio. La altura es el otro cateto, V₁(V₀)₁.
          - valor: '47.58'
            receta: sumaAB_cm
            mensaje: |
              Has sumado los cuadrados de MV₀ y MV₁. MV₀ es la hipotenusa, y la altura es un cateto: se
              restan, la raíz de MV₀² − MV₁². Un cateto nunca puede salir más largo que la hipotenusa.
        pista: |
          Con «medir» del Taller en el paso anterior, o en tu lámina de papel: V₁(V₀)₁ en la planta, o
          T₂V₂ en el alzado. O con el triángulo del radio: su hipotenusa es MV₀ y un cateto, MV₁.
        desarrollo: |
          En el triángulo del radio con la charnela AB, la hipotenusa MV₀ mide 39,19 mm y el cateto MV₁,
          26,97 mm. La altura es el otro cateto:

          $$ h = \sqrt{39{,}19^{2} - 26{,}97^{2}} \approx 28{,}44 \text{ mm} $$

          A escala 1:10, 28,44 cm por debajo del techo.

          En la planta, la varilla de A, A₁V₁, mide 28,12 mm del papel, casi lo mismo que la altura, por
          casualidad, y la casilla da por buena esa cifra. No es la altura: es la planta de una varilla, que
          la acorta. La altura se mide de V₁ a (V₀)₁ en el triángulo del radio, o de T₂ a V₂ en el alzado.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El techo es horizontal, así que A₁B₁ y A₁C₁ son verdaderas magnitudes y sirven de charnelas para abatir sobre él.
          - texto: Abatido, el triángulo VAB tiene sus tres lados en verdadera magnitud, A₁B₁, 40 y 70 mm, y V₀ es el cruce de dos arcos con centro en A₁ y en B₁; V₀′ sale igual con A₁ y C₁.
          - texto: Al desabatir, V se mueve en un plano perpendicular a la charnela, así que V₁ está en la perpendicular a A₁B₁ por V₀ y en la perpendicular a A₁C₁ por V₀′.
          - texto: La altura de V es el cateto del triángulo rectángulo que tiene MV₀ por hipotenusa y MV₁ por el otro cateto, y se lleva por debajo del techo porque la lámpara cuelga.
          - texto: V₁ es el cruce de los arcos de 40, 70 y 60 mm con centro en A₁, B₁ y C₁.
            trampa: true
            mensaje: |
              Esos arcos miden las varillas en verdadera magnitud, y en la planta las varillas se
              acortan: ni pasan por V₁ ni se cortan los tres en un punto. Los arcos sirven en los
              triángulos abatidos, no en la planta.
    resolucion: |
      **Qué se sabe.** A, B y C están a la misma altura: el techo es horizontal, y la planta da en
      verdadera magnitud sus distancias, 50,0 mm de A a B y 60,9 de A a C. A escala 1:10, las varillas
      miden 40, 70 y 60 mm en el dibujo. V es el punto que está a esas distancias de A, B y C, y como la
      lámpara cuelga, está por debajo del techo.

      **Los triángulos abatidos.** VAB es un triángulo de lados conocidos: A₁B₁, 40 y 70 mm. Abatido
      sobre el techo alrededor de AB, se dibuja con el compás: V₀ es el cruce del arco de 40 mm con
      centro en A₁ y el de 70 con centro en B₁. Lo mismo VAC alrededor de AC: V₀′, con los arcos de 40
      y 60 mm. Cada pareja de arcos se corta a los dos lados de la charnela, y cualquiera vale.

      **La planta de V.** Al desabatir, V gira alrededor de cada charnela en un plano perpendicular a
      ella, y ese plano es vertical: V₁ está en la perpendicular a A₁B₁ por V₀ y en la perpendicular a
      A₁C₁ por V₀′, donde se cortan. Con la charnela AB, el pie M cae fuera del segmento, más allá de A:
      por eso se prolonga A₁B₁.

      **La altura.** El triángulo M V₁ (V₀)₁ es rectángulo en V₁: la hipotenusa MV₀, 39,19 mm, es la
      distancia real de V a AB, y el cateto MV₁, 26,97 mm, lo que V₁ dista de la charnela en la planta.
      El otro cateto es la altura de V bajo el techo, 28,44 mm.

      **El alzado.** V₂ está en la vertical de V₁, 28,44 mm por debajo de la recta del techo. La lámpara
      cuelga 28,44 cm por debajo del techo.

      **El trípode.** Las varillas van de V₁ a A₁, B₁ y C₁ en la planta, y de V₂ a A₂, B₂ y C₂ en el
      alzado. Solo se tocan en V, así que ninguna tapa a otra, y el techo es transparente, como dice la
      nota: todas en continua. En la planta miden 28,1, 64,0 y 52,8 mm, y bajan 45,3°, 24,0° y 28,3°
      respecto del techo.

      **La comprobación.** Cada varilla es la hipotenusa de su planta y de la altura: la de A,
      √(28,12² + 28,44²) = 40,0 mm.

  - id: sd25-tres-caras-de-un-bloque-cortado
    titulo: Tres caras de un bloque cortado, cada una por su método
    fuente: Ejercicio 19 (SD25) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, con sus dos erratas: «eta» (la «y»
    # del euskera, que se quedó en la versión castellana) y «mediamente» por
    # «mediante», dos veces (§08). Cada apartado en su párrafo para que el
    # Markdown no los junte en una línea.
    enunciado: |
      Representar gráficamente la verdadera magnitud de los planos α, β eta δ.

      a) Plano α mediamente abatimiento.

      b) Plano β mediamente cambio de plano.

      c) Plano δ mediante giro.

      **Notas nuestras.** La figura son tres vistas de un bloque cortado: el alzado
      arriba a la izquierda, el perfil a su derecha y la planta debajo del alzado. La hoja no da
      escala: la leemos a 1:1, en milímetros de la lámina. La línea de
      trazos del alzado es una arista oculta. α y β están rotulados en la planta, y δ en el
      perfil. La figura no nombra ningún vértice; aquí los llamamos así. α es el hexágono grande
      de la planta: A y B son los extremos de su lado inclinado de arriba a la izquierda (A el de
      abajo, B el de arriba), y los dos están en el suelo; siguiendo el contorno, C es la esquina
      de arriba a la derecha, D el vértice del borde derecho donde empieza la diagonal, E el otro
      extremo de la diagonal y F la esquina de abajo a la izquierda. β es el triángulo pequeño de
      debajo de α: F, E y G, que es el vértice de abajo, en el borde delantero. δ es la cara
      delantera del bloque, la que en la planta se ve como el borde inclinado de abajo: H está en
      el suelo, debajo de F; J es la esquina de abajo a la derecha de la planta, en el suelo, y K,
      la que tiene encima, arriba del todo; los otros dos vértices de δ son G y F. En la planta
      coinciden F₁ y H₁, y J₁ y K₁; en el alzado, E₂ y G₂. «Eta» es la «y» del euskera, y «mediamente»
      quiere decir «mediante»: son erratas de la hoja, y se dejan como están.
    pide: α abatida, β en la vista nueva de un cambio de plano y δ girada hasta quedar frontal, y dos longitudes que se miden en esas verdaderas magnitudes.
    receta:
      lamina: sd25
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        J: 'punto3(alzado: figura.punto("J2"), planta: figura.punto("J1"))'
        K: 'punto3(alzado: figura.punto("K2"), planta: figura.punto("K1"))'
        alfa: plano(A, B, D)
        beta: plano(F, E, G)
        delta: plano(H, J, K)
      solucion:
        # Decisión: a) α, abatido sobre el suelo con la charnela AB, que el
        # enunciado no fija: es la horizontal de α que está en el suelo. C se abate a
        # cualquiera de los dos lados (una elección: la primera marca fija el
        # lado), y los demás con el mismo giro, para que α caiga entera.
        charnela: recta3(A, B)
        C_ab: abatido_a_elegir(C, charnela, alfa)
        D_ab: 'abatido_junto(D, charnela, alfa, con: C_ab, de: C)'
        E_ab: 'abatido_junto(E, charnela, alfa, con: C_ab, de: C)'
        F_ab: 'abatido_junto(F, charnela, alfa, con: C_ab, de: C)'
        MC: pie_perpendicular(C, charnela)
        MD: pie_perpendicular(D, charnela)
        ME: pie_perpendicular(E, charnela)
        MF: pie_perpendicular(F, charnela)
        perpC: 'perpendicular(por: figura.punto("C1"), a: figura.segmento("AB1"))'
        perpD: 'perpendicular(por: figura.punto("D1"), a: figura.segmento("AB1"))'
        perpE: 'perpendicular(por: figura.punto("E1"), a: figura.segmento("AB1"))'
        perpF: 'perpendicular(por: figura.punto("F1"), a: figura.segmento("AB1"))'
        # Para la construcción paso a paso: el triángulo del radio de C (la cota
        # de C llevada desde C₁, paralela a A₁B₁) y los puntos de la charnela
        # por los que pasan CD y EF y sus abatidas (afinidad).
        TC: 'uno(medir_sobre(perpendicular(por: figura.punto("C1"), a: perpC), desde: figura.punto("C1"), distancia: diferencia_de_cotas(C, A)), 1)'
        Xcd: pie_comun(recta3(C, D), charnela)
        Xef: pie_comun(recta3(E, F), charnela)
        # Decisión: b) β, por UN cambio de plano horizontal, con la línea nueva
        # de la lámina (paralela a β₂ y a 15 mm, que fija el ejercicio porque el
        # enunciado no la da) y F de referencia. β es de canto: con uno basta.
        Fv: 'cambio_plano_horizontal(F, figura.segmento("nueva"), ref: F)'
        Ev: 'cambio_plano_horizontal(E, figura.segmento("nueva"), ref: F)'
        Gv: 'cambio_plano_horizontal(G, figura.segmento("nueva"), ref: F)'
        perpF2: 'perpendicular(por: figura.punto("F2"), a: figura.segmento("nueva"))'
        perpE2: 'perpendicular(por: figura.punto("E2"), a: figura.segmento("nueva"))'
        # Decisión: c) δ, girada alrededor de la arista vertical HF (el eje,
        # que fija el ejercicio) lo justo para quedar frontal: lo que forma con el plano
        # vertical. Con el eje hacia arriba, el giro bueno es el negativo (la
        # rama 2), el que lleva J₁ a la derecha de H₁. El otro sentido, 180°
        # más, también la deja frontal, pero lleva J₁ a x = 31, pegado al marco
        # de la hoja y fuera de la lámina, y por eso no es una elección.
        eje: recta3(H, F)
        giro: angulo_con_pv(delta)
        G_g: 'rama(gira(G, eje, angulo: giro), 2)'
        K_g: 'rama(gira(K, eje, angulo: giro), 2)'
        J_g: 'rama(gira(J, eje, angulo: giro), 2)'
        BE_mm: en_mm(vm(B, E))
        FG_mm: en_mm(vm(F, G))
      comprueba:
        - en_plano(C, alfa)
        - en_plano(E, alfa)
        - en_plano(F, alfa)
        - en_plano(F, delta)
        - en_plano(G, delta)
    pasos:
      - tipo: reconocer
        pregunta: Antes de elegir cómo se hace cada uno, ¿en qué posición está cada plano?
        opciones:
          - texto: 'α es oblicuo; β es de canto, una recta en el alzado; δ es vertical, una recta en la planta'
            correcta: true
            mensaje: |
              Eso es. α se ve como un hexágono en las dos vistas, deformado en las dos. β se reduce
              a la recta F₂E₂ en el alzado: es perpendicular al plano vertical. δ se reduce al borde
              H₁J₁ en la planta: es perpendicular al horizontal. Por eso a β le basta un cambio de
              plano y a δ un giro, mientras que α pide el método completo.
          - texto: 'Los tres son oblicuos, porque ninguno es horizontal ni frontal: piden el método completo'
            mensaje: |
              No ser horizontal ni frontal no hace oblicuo a un plano. β se ve como una recta en el
              alzado y δ como una recta en la planta: los dos son proyectantes. Solo α no se reduce a
              una recta en ninguna vista.
          - texto: β es vertical, porque es una recta en el alzado, y δ, de canto, una recta en la planta
            mensaje: |
              Al revés. El plano que se ve como una recta en el alzado es el de canto, y ese es β,
              con F₂E₂. El que se ve como una recta en la planta es vertical, y ese es δ, con H₁J₁.

      - tipo: construir
        titulo: α, abatido con la charnela AB
        intro: |
          El enunciado no dice alrededor de qué recta se abate α. Lo fijamos nosotros: la charnela
          es AB, el lado de α que está en el suelo. En la planta es A₁B₁, el lado inclinado de arriba
          a la izquierda, y en el alzado está en la línea del suelo: es una horizontal de α, y α se
          abate sobre el suelo. A y B están en la charnela y no se mueven. Marca C, D, E y F
          abatidos. Vale cualquiera de los dos lados de A₁B₁, pero todos al mismo. La recta de trazo y
          punto de arriba a la izquierda es la línea nueva del cambio de plano de β: aquí no se usa.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: C0
            pide: el vértice C, abatido
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está en la perpendicular a A₁B₁ que pasa por C₁, a la distancia real de C a la
              charnela: la hipotenusa de lo que separa C₁ de A₁B₁ en la planta y de la cota de C, que
              se mide en el alzado desde la línea del suelo.
            diagnosticos:
              - si: cerca_de(figura.punto("C1"))
                mensaje: |
                  Ese es C₁, la planta de C sin abatir. Al abatir, C gira alrededor de AB hasta quedar
                  en el suelo, y en la planta se aparta de A₁B₁ por la perpendicular.
                ejemplo: figura.punto("C1")
              - si: 'en_recta(solucion.perpC) && a_distancia(de: proy_planta(solucion.MC), d: diferencia_de_cotas(C, A))'
                mensaje: |
                  Vas por la perpendicular a A₁B₁, pero has llevado solo **la cota de C**. Eso es un
                  cateto. El radio del abatimiento es la hipotenusa de ese cateto y de lo que separa C₁
                  de A₁B₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpC, desde: proy_planta(solucion.MC), distancia: diferencia_de_cotas(C, A)), 1)'
              - si: 'en_recta(solucion.perpC) && a_distancia(de: proy_planta(solucion.MC), d: vm_planta(C, solucion.MC))'
                mensaje: |
                  Has llevado al otro lado de la charnela lo que C₁ dista de ella **en la planta**, y la
                  planta acorta: C está 30 mm por encima del suelo. Con esa distancia y la cota de C se
                  forma el triángulo cuya hipotenusa es el radio.
                ejemplo: 'uno(medir_sobre(solucion.perpC, desde: proy_planta(solucion.MC), distancia: vm_planta(C, solucion.MC)), 1)'
              - si: '!en_recta(solucion.perpC)'
                mensaje: |
                  C gira alrededor de la charnela en un plano perpendicular a ella, y ese plano es
                  vertical, porque la charnela es horizontal: en la planta, C₀ se mueve por la
                  **perpendicular a A₁B₁ que pasa por C₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.C_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₁B₁ por C₁, pero no a la distancia buena. El radio es la
                  hipotenusa del triángulo que tiene por catetos lo que separa C₁ de A₁B₁ en la planta y
                  la cota de C, que es lo que C₂ está por encima de la línea del suelo.
          - nombre: D0
            pide: el vértice D, abatido
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está en la perpendicular a A₁B₁ por D₁, del mismo lado que C₀. D y E son los puntos
              más altos de α, y por eso los que más se apartan: 55 mm de la charnela.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela. α gira entera, como una tapa sobre
                  su bisagra, y C y D están al mismo lado de AB: si C₀ ha caído a un lado de A₁B₁, D₀ cae
                  al mismo.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: cerca_de(figura.punto("D1"))
                mensaje: |
                  Ese es D₁ sin abatir. D también gira alrededor de AB, y se aparta de A₁B₁ por la
                  perpendicular que pasa por D₁.
                ejemplo: figura.punto("D1")
              - si: 'en_recta(solucion.perpD) && a_distancia(de: proy_planta(solucion.MD), d: diferencia_de_cotas(D, A))'
                mensaje: |
                  Has llevado solo **la cota de D**, 45 mm: un cateto. El radio es la hipotenusa de ese
                  cateto y de lo que separa D₁ de A₁B₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpD, desde: proy_planta(solucion.MD), distancia: diferencia_de_cotas(D, A)), 1)'
              - si: '!en_recta(solucion.perpD)'
                mensaje: |
                  D₀ va por la **perpendicular a A₁B₁ que pasa por D₁**, como C₀ por la suya.
                ejemplo: 'desplaza(proy_planta(rama(solucion.D_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₁B₁ por D₁, pero no a la distancia buena. Hazlo como con
                  C: el radio es la hipotenusa de lo que separa D₁ de A₁B₁ en la planta y de la cota de
                  D.
          - nombre: E0
            pide: el vértice E, abatido
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la perpendicular a A₁B₁ por E₁, del mismo lado. Está a la misma distancia de
              la charnela que D₀, porque DE es otra horizontal de α, paralela a AB: D₀E₀ sale
              paralela a A₁B₁.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_ab)))
                mensaje: |
                  Ese es E abatido **al otro lado** de la charnela. Toda α cae al mismo lado: el de C₀
                  y D₀.
                ejemplo: proy_planta(rama(solucion.E_ab, 2))
              - si: cerca_de(figura.punto("E1"))
                mensaje: |
                  Ese es E₁ sin abatir. E gira alrededor de AB, y se aparta de A₁B₁ por la
                  perpendicular que pasa por E₁.
                ejemplo: figura.punto("E1")
              - si: 'en_recta(solucion.perpE) && a_distancia(de: proy_planta(solucion.ME), d: diferencia_de_cotas(E, A))'
                mensaje: |
                  Has llevado solo **la cota de E**: un cateto. Falta el otro, lo que separa E₁ de A₁B₁
                  en la planta, para tener el radio.
                ejemplo: 'uno(medir_sobre(solucion.perpE, desde: proy_planta(solucion.ME), distancia: diferencia_de_cotas(E, A)), 1)'
              - si: '!en_recta(solucion.perpE)'
                mensaje: |
                  E₀ va por la **perpendicular a A₁B₁ que pasa por E₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₁B₁ por E₁, pero no a la distancia buena. Hazlo como con
                  C, o por afinidad: DE es paralela a AB, así que D₀E₀ es paralela a A₁B₁.
          - nombre: F0
            pide: el vértice F, abatido
            es: proy_planta(solucion.F_ab)
            bien: |
              F₀ está en la perpendicular a A₁B₁ por F₁, del mismo lado, y cierra el hexágono abatido:
              A₁B₁C₀D₀E₀F₀ es α en verdadera magnitud, con todos sus ángulos de 120°.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.F_ab)))
                mensaje: |
                  Ese es F abatido **al otro lado** de la charnela. F₀ va al mismo lado que los demás.
                ejemplo: proy_planta(rama(solucion.F_ab, 2))
              - si: cerca_de(figura.punto("F1"))
                mensaje: |
                  Ese es F₁ sin abatir. F está 15 mm por encima del suelo, y también se aparta de A₁B₁.
                ejemplo: figura.punto("F1")
              - si: 'en_recta(solucion.perpF) && a_distancia(de: proy_planta(solucion.MF), d: diferencia_de_cotas(F, A))'
                mensaje: |
                  Has llevado solo **la cota de F**, 15 mm: un cateto. El radio es la hipotenusa de ese
                  cateto y de lo que separa F₁ de A₁B₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpF, desde: proy_planta(solucion.MF), distancia: diferencia_de_cotas(F, A)), 1)'
              - si: '!en_recta(solucion.perpF)'
                mensaje: |
                  F₀ va por la **perpendicular a A₁B₁ que pasa por F₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.F_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₁B₁ por F₁, pero no a la distancia buena. Comprueba por
                  afinidad: la recta E₁F₁ y la recta E₀F₀ se cortan sobre la charnela, en la
                  prolongación de A₁B₁.
        trazado:
          - proy_planta(segmento3(solucion.MC, solucion.C_ab))
          - proy_planta(segmento3(solucion.MD, solucion.D_ab))
          - proy_planta(segmento3(solucion.ME, solucion.E_ab))
          - proy_planta(segmento3(solucion.MF, solucion.F_ab))
          - segmento2(figura.punto("B1"), proy_planta(solucion.C_ab))
          - segmento2(proy_planta(solucion.C_ab), proy_planta(solucion.D_ab))
          - segmento2(proy_planta(solucion.D_ab), proy_planta(solucion.E_ab))
          - segmento2(proy_planta(solucion.E_ab), proy_planta(solucion.F_ab))
          - segmento2(proy_planta(solucion.F_ab), figura.punto("A1"))
        bloques:
          - nombre: Abatimiento con charnela AB
            explica: |
              Se abate α sobre el suelo, alrededor de AB, el lado que ya está en él: es una horizontal de α,
              y la hemos elegido de charnela porque el enunciado no la fija. Los otros vértices giran en
              planos verticales, perpendiculares a AB, y en la planta se apartan de A₁B₁ por sus
              perpendiculares. El radio es la distancia real a la charnela: la hipotenusa de lo que la
              planta dista de A₁B₁ y de la cota, que se lee en el alzado desde la línea del suelo; para C,
              36,7 mm. D, E y F se ahorran el triángulo por
              [afinidad](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano):
              una recta de α y su abatida se cortan en la charnela, y DE, horizontal como AB, sale paralela
              a A₁B₁. Con todos los vértices al mismo lado, el hexágono abatido es α en verdadera magnitud.
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("B1"), desplaza(proy_planta(solucion.Xcd), dx: 8, dy: -8)), segmento2(figura.punto("A1"), desplaza(proy_planta(solucion.Xef), dx: -8, dy: 8))]'
            bloque: Abatimiento con charnela AB
            rotulo: charnela
            porque: |
              La **charnela**, A₁B₁, prolongada con la regla hacia los dos lados, larga: ahí caen M, el
              pie de cada vértice, y los puntos fijos de la afinidad. Hacia arriba cruza la línea del
              suelo del alzado y sube por dentro de él: no la confundas con sus aristas.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("C1"), desplaza(proy_planta(rama(solucion.C_ab, 1)), dx: 5.66, dy: 5.66)), segmento2(figura.punto("C1"), desplaza(proy_planta(rama(solucion.C_ab, 2)), dx: -5.66, dy: -5.66))]'
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              Por C₁, la **perpendicular a A₁B₁**, larga y hacia los dos lados: al abatir, C gira
              alrededor de la charnela en un plano vertical, y en la planta se mueve por esa recta.
              Corta la charnela en M, el pie de C.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("C1"), desplaza(solucion.TC, dx: 5.66, dy: -5.66))'
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              Por C₁, la paralela a A₁B₁, larga. Sobre ella se lleva la cota de C, y sale el triángulo
              del radio, rectángulo en C₁. Su extremo cae dentro del perfil: no lo confundas con sus
              aristas.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: solucion.TC, desde: desplaza(solucion.TC, dx: 4.24, dy: 4.24), hasta: desplaza(solucion.TC, dx: -4.24, dy: -4.24))'
            bloque: Abatimiento con charnela AB
            toma: segmento2(figura.punto("C2"), figura.punto("J2"))
            porque: |
              Con el compás, la **cota de C**: lo que C₂ está por encima de la esquina de abajo del
              alzado, 30 mm, que es lo que C está por encima de la charnela. Se lleva desde C₁ sobre la
              paralela.
          - con: regla
            traza: segmento2(proy_planta(solucion.MC), solucion.TC)
            bloque: Abatimiento con charnela AB
            rotulo: r
            porque: |
              La hipotenusa, de M al punto que acabas de llevar, es la **distancia real de C a la
              charnela**: el radio con que C se abate, 36,7 mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.MC), por: solucion.TC, desde: solucion.TC, hasta: proy_planta(solucion.C_ab))'
            bloque: Abatimiento con charnela AB
            toma: segmento2(proy_planta(solucion.MC), solucion.TC)
            porque: |
              Con centro en M, que está en la charnela, y ese radio, el arco hasta la perpendicular: C
              cae al suelo girando alrededor de AB.
          - con: marca
            traza: proy_planta(solucion.C_ab)
            bloque: Abatimiento con charnela AB
            rotulo: C₀
            porque: |
              C₀, C abatido. Aquí cae del lado de la planta; al otro lado también valdría, con todo lo
              demás al mismo lado.
          - con: regla
            traza: segmento2(figura.punto("D1"), proy_planta(solucion.Xcd))
            bloque: Abatimiento con charnela AB
            porque: |
              Los demás vértices salen por **afinidad**. La recta D₁C₁, prolongada, corta la charnela en
              un punto que no se mueve al abatir. Esa prolongación va por la misma vertical que la arista
              derecha del alzado, y el punto cae sobre ella.
          - con: regla
            traza: 'segmento2(proy_planta(solucion.Xcd), desplaza(proy_planta(solucion.D_ab), dx: 2.07, dy: 7.73))'
            bloque: Abatimiento con charnela AB
            porque: |
              La recta CD abatida, larga: pasa por ese punto y por C₀, porque una recta del plano y su
              abatida se cortan en la charnela.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), proy_planta(solucion.D_ab))
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              Por D₁, la perpendicular a A₁B₁. D₀ está donde corta la abatida de CD.
          - con: marca
            traza: proy_planta(solucion.D_ab)
            bloque: Abatimiento con charnela AB
            rotulo: D₀
            porque: |
              D₀, del mismo lado que C₀: α se tumba entera.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.D_ab), desplaza(proy_planta(solucion.E_ab), dx: -5.66, dy: 5.66))'
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              DE es otra horizontal de α, paralela a AB, y su abatida también lo es: por D₀, la
              paralela a A₁B₁, larga.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), proy_planta(solucion.E_ab))
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              Por E₁, la perpendicular a A₁B₁, hasta la paralela que sale de D₀.
          - con: marca
            traza: proy_planta(solucion.E_ab)
            bloque: Abatimiento con charnela AB
            rotulo: E₀
            porque: |
              E₀, a la misma distancia de la charnela que D₀.
          - con: regla
            traza: segmento2(figura.punto("E1"), proy_planta(solucion.Xef))
            bloque: Abatimiento con charnela AB
            porque: |
              La recta E₁F₁, prolongada, corta la charnela en otro punto fijo.
          - con: regla
            traza: segmento2(proy_planta(solucion.Xef), proy_planta(solucion.E_ab))
            bloque: Abatimiento con charnela AB
            porque: |
              La abatida de EF va de ese punto a E₀, y F₀ está en ella.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F1"), proy_planta(solucion.F_ab))
            bloque: Abatimiento con charnela AB
            guia: figura.segmento("AB1")
            porque: |
              Por F₁, la perpendicular a A₁B₁, hasta la abatida de EF.
          - con: marca
            traza: proy_planta(solucion.F_ab)
            bloque: Abatimiento con charnela AB
            rotulo: F₀
            porque: |
              F₀, donde la perpendicular a A₁B₁ por F₁ corta la abatida de EF: el último vértice que se mueve.
          - con: regla
            traza: '[segmento2(figura.punto("B1"), proy_planta(rama(solucion.C_ab, 1))), segmento2(proy_planta(rama(solucion.F_ab, 1)), figura.punto("A1"))]'
            bloque: Abatimiento con charnela AB
            porque: |
              Los dos lados que faltan, B₁C₀ y F₀A₁: A₁B₁C₀D₀E₀F₀ es α en verdadera magnitud, con cuatro
              lados de 21,2 mm, dos de 42,4 y todos los ángulos de 120°.
        pista: |
          (1) Por C₁, la perpendicular a A₁B₁; la corta en M. (2) Por C₁, perpendicular a C₁M, lleva
          la cota de C, que es lo que C₂ está por encima de la línea del suelo: la distancia de M a ese
          punto es el radio. (3) Con centro en M y ese radio, corta la perpendicular: C₀. (4) D, E y F
          igual, del mismo lado.
        desarrollo: |
          En verde claro, el camino de cada vértice por su perpendicular a la charnela y el hexágono
          A₁B₁C₀D₀E₀F₀: es α en verdadera magnitud. Tiene cuatro lados de 21,2 mm y dos de 42,4, BC y
          EF, que son opuestos, y todos los ángulos de 120°.

      - tipo: construir
        titulo: β, con un cambio de plano
        intro: |
          β es de canto: en el alzado se ve como la recta F₂E₂, y G₂ coincide con E₂. Un cambio de
          plano horizontal con la línea nueva paralela a F₂E₂ pone el plano nuevo paralelo a β, y la
          vista nueva lo da sin acortar. El enunciado no dice dónde va la línea nueva: la hemos fijado
          nosotros y ya está dibujada, la de trazo y punto de arriba a la izquierda, a 15 mm de F₂E₂. La
          referencia es F, que cae en la línea nueva. Marca los tres vértices de β en la vista nueva.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: F4
            pide: el vértice F, en la vista nueva
            es: solucion.Fv
            bien: |
              F₄ está en la línea nueva, al pie de la perpendicular que sale de F₂: F es la referencia,
              y su alejamiento es el que se cuenta como cero.
            diagnosticos:
              - si: 'en_recta(figura.segmento("nueva")) && en_vertical_de(figura.punto("F2"))'
                mensaje: |
                  Has subido F₂ en vertical hasta la línea nueva. Las líneas de referencia de un cambio
                  de plano van **perpendiculares a la línea nueva**, no verticales: la vertical solo une
                  el alzado con la planta.
                # Decisión: el ejemplo va en cifras (pt): el punto de la línea nueva
                # (x + y = 369,48) en la vertical de F₂, 60,12 pt por encima.
                ejemplo: 'desplaza(figura.punto("F2"), dy: -60.12)'
              - si: '!en_recta(solucion.perpF2)'
                mensaje: |
                  F₄ sale de F₂ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.Fv, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de F₂, pero F es la referencia: su alejamiento cuenta
                  como cero, y F₄ cae **en la línea nueva**.
                ejemplo: 'desplaza(solucion.Fv, dx: mm(-5), dy: mm(-5))'
          - nombre: E4
            pide: el vértice E, en la vista nueva
            es: solucion.Ev
            bien: |
              E₄ también cae en la línea nueva: E tiene el mismo alejamiento que F, porque FE es una
              frontal de β. F₄E₄ mide 42,4 mm, como F₂E₂: FE ya estaba en verdadera magnitud en el
              alzado.
            diagnosticos:
              - si: '!en_recta(solucion.perpE2)'
                mensaje: |
                  E₄ sale de E₂ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.Ev, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de E₂, pero E está tan lejos como F: E₁ y F₁ están a
                  la misma altura en la planta. Lleva cero, y E₄ cae en la línea nueva.
                ejemplo: 'desplaza(solucion.Ev, dx: mm(-5), dy: mm(-5))'
          - nombre: G4
            pide: el vértice G, en la vista nueva
            es: solucion.Gv
            bien: |
              G₄ está en la misma perpendicular que E₄, porque G₂ coincide con E₂, y 10 mm más allá de
              la línea nueva: lo que G está más cerca que F, que en la planta es lo que G₁ está por
              debajo de F₁. F₄E₄G₄ es β en verdadera magnitud, con el ángulo recto en E.
            diagnosticos:
              - si: cerca_de(E4)
                mensaje: |
                  G₄ no coincide con E₄. En el alzado G₂ y E₂ coinciden, porque EG es de punta, pero G está
                  10 mm más cerca que E: en la vista nueva esos 10 mm se ven.
                ejemplo: solucion.Ev
              - si: 'en_recta(solucion.perpE2) && a_distancia(de: solucion.Ev, d: diferencia_de_cotas(G, F))'
                mensaje: |
                  Has llevado la diferencia de **cotas** de G y F, 30 mm. Un cambio de plano horizontal
                  sale del alzado y lleva **alejamientos**: lo que G está más cerca que F, que se mide en
                  la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpE2, desde: solucion.Ev, distancia: diferencia_de_cotas(G, F)), 1)'
              - si: 'cerca_de(uno(medir_sobre(solucion.perpE2, desde: solucion.Ev, distancia: vm(G, E)), 1))'
                mensaje: |
                  Has llevado los 10 mm **hacia el alzado**. La vista nueva queda al otro lado de la
                  línea nueva, y un punto que está más cerca que la referencia se aparta de la línea hacia
                  fuera, no hacia el alzado.
                ejemplo: 'uno(medir_sobre(solucion.perpE2, desde: solucion.Ev, distancia: vm(G, E)), 1)'
              - si: '!en_recta(solucion.perpE2)'
                mensaje: |
                  G₄ sale de G₂ por la **perpendicular a la línea nueva**, y G₂ coincide con E₂: es la
                  misma perpendicular que la de E₄.
                ejemplo: 'desplaza(solucion.Gv, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena. G₄ se aparta de la línea
                  nueva lo que G está más cerca que F: en la planta, lo que G₁ está por debajo de F₁, 10
                  mm.
        trazado:
          - segmento2(figura.punto("F2"), solucion.Fv)
          - segmento2(figura.punto("E2"), solucion.Gv)
          - segmento2(solucion.Fv, solucion.Ev)
          - segmento2(solucion.Ev, solucion.Gv)
          - segmento2(solucion.Gv, solucion.Fv)
        bloques:
          - nombre: Cambio de plano horizontal
            explica: |
              β es de canto: en el alzado es la recta F₂E₂, y por eso basta un cambio. Es horizontal: el
              alzado se queda, y la planta se cambia por una vista desde un plano paralelo a β, así que la
              línea nueva, que hemos fijado nosotros, va paralela a F₂E₂. Cada punto conserva su
              alejamiento, que se lee en la planta y se cuenta desde el de F, la referencia, que cae en la
              línea. E tiene el de F, porque FE es frontal; G₁ está 10 mm por debajo de F₁, así que G está
              10 mm más lejos del plano vertical, y G₄ se aparta 10 mm de la línea, hacia el lado contrario
              al alzado. F₄E₄G₄, rectángulo en E, es β en
              [verdadera magnitud](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-cambio-de-plano-una-vista-nueva).
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F2"), solucion.Fv)
            bloque: Cambio de plano horizontal
            guia: figura.segmento("nueva")
            porque: |
              Por F₂, la **perpendicular a la línea nueva**, hasta ella: las líneas de referencia de un
              cambio de plano van siempre perpendiculares a la línea nueva.
          - con: marca
            traza: solucion.Fv
            bloque: Cambio de plano horizontal
            rotulo: F₄
            porque: |
              F es la referencia: su alejamiento cuenta como cero, y F₄ cae en la línea nueva.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("E2"), desplaza(solucion.Gv, dx: -5.66, dy: -5.66))'
            bloque: Cambio de plano horizontal
            guia: figura.segmento("nueva")
            porque: |
              Por E₂, que coincide con G₂, la otra perpendicular, larga, más allá de la línea nueva:
              sirve para E y para G.
          - con: marca
            traza: solucion.Ev
            bloque: Cambio de plano horizontal
            rotulo: E₄
            porque: |
              E está tan lejos como F, porque E₁ y F₁ están a la misma altura en la planta: E₄ cae donde
              la perpendicular corta la línea nueva.
          - con: compas
            traza: 'arco(solucion.Ev, por: solucion.Gv, desde: desplaza(solucion.Gv, dx: 2.12, dy: -2.12), hasta: desplaza(solucion.Gv, dx: -2.12, dy: 2.12))'
            bloque: Cambio de plano horizontal
            toma: figura.segmento("EG1")
            porque: |
              Con el compás, en la planta, **lo que G está más cerca que F**: de E₁ a G₁, 10 mm. Se lleva
              desde E₄ hacia fuera de la línea nueva, lejos del alzado.
          - con: marca
            traza: solucion.Gv
            bloque: Cambio de plano horizontal
            rotulo: G₄
            porque: |
              G₄, 10 mm más allá de la línea nueva.
          - con: regla
            traza: segmento2(solucion.Fv, solucion.Gv)
            bloque: Cambio de plano horizontal
            porque: |
              F₄E₄G₄ es β en verdadera magnitud: rectángulo en E, con FG de 43,5 mm.
        pista: |
          (1) Por F₂ y por E₂, las perpendiculares a la línea nueva. (2) F es la referencia: F₄ en la
          línea. E tiene el alejamiento de F: E₄ también en la línea. (3) En la planta, G₁ está 10 mm
          por debajo de F₁: G está 10 mm más cerca. Lleva esos 10 mm desde E₄, hacia fuera: G₄.
        desarrollo: |
          En verde claro, las dos líneas de referencia y el triángulo F₄E₄G₄: β en verdadera magnitud,
          rectángulo en E, con catetos de 42,4 y 10 mm y la hipotenusa FG de 43,5 mm.

      - tipo: construir
        titulo: δ, girada hasta quedar frontal
        intro: |
          δ es vertical: en la planta se ve como el borde inclinado H₁J₁. Un giro de eje vertical que
          deje esa recta horizontal pone δ frontal, y el alzado la da en verdadera magnitud. El
          enunciado no fija el eje; lo fijamos nosotros: la arista vertical de δ que va de H a F, que en
          la planta es el punto H₁ ≡ F₁ y en el alzado, el tramo bajo del borde izquierdo. H y F no se
          mueven. Gira lo justo para que H₁J₁ quede horizontal, con J y K a la derecha, unos 18°.
          Girando hacia el otro lado también quedaría frontal, pero J y K quedarían pegados al marco de
          la hoja, fuera de la lámina. Marca
          G y K girados, en la planta y en el alzado. La recta de trazo y punto de arriba a la izquierda
          es la línea nueva del cambio de plano de β: aquí no se usa.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G1p
            rotulo: G₁′
            pide: el vértice G girado, en la planta
            es: proy_planta(solucion.G_g)
            bien: |
              G₁′ está en la horizontal que pasa por F₁, a la misma distancia de F₁ que G₁: la planta
              gira alrededor de F₁ sin deformarse.
            diagnosticos:
              - si: cerca_de(figura.punto("G1"))
                mensaje: |
                  Ese es G₁, sin girar. G gira alrededor del eje, que en la planta es F₁, hasta que δ
                  queda frontal: G₁′ en la horizontal por F₁.
                ejemplo: figura.punto("G1")
              - si: cerca_de(figura.punto("E1"))
                mensaje: |
                  Has subido G₁ **en vertical** hasta la horizontal por F₁: eso no es girar, es acortar.
                  En un giro de eje vertical cada punto se mueve por un arco con centro en el eje, F₁, y
                  conserva su distancia a él. Ese punto, además, es E₁.
                ejemplo: figura.punto("E1")
              - si: 'cerca_de(proy_planta(simetrico(solucion.G_g, respecto: F)))'
                mensaje: |
                  Has girado hacia el otro lado, unos 162°, y δ también queda frontal: la distancia a F₁
                  es la buena. Aquí va el giro corto, con J y K a la derecha, que es el que fija este
                  paso: con el largo, J₁′ y K₁′ quedarían pegados al marco de la hoja, fuera de la lámina.
                ejemplo: 'proy_planta(simetrico(solucion.G_g, respecto: F))'
              - si: '!en_recta(figura.segmento("FE1"))'
                mensaje: |
                  δ frontal tiene la planta **horizontal**, y pasa por el eje: G₁′ está en la horizontal
                  que pasa por F₁, la prolongación de F₁E₁.
                ejemplo: 'desplaza(proy_planta(solucion.G_g), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal por F₁, pero no a la distancia buena. Con centro en F₁ y radio
                  F₁G₁, el arco corta esa horizontal en G₁′.
          - nombre: G2p
            rotulo: G₂′
            pide: el vértice G girado, en el alzado
            es: proy_alzado(solucion.G_g)
            bien: |
              G₂′ está en la vertical de G₁′ y a la altura de G₂: en un giro de eje vertical las cotas no
              cambian. Se ha corrido 1,6 mm a la derecha de G₂: δ estaba casi frontal.
            diagnosticos:
              - si: '!en_vertical_de(G1p)'
                mensaje: |
                  G₂′ va en la **vertical de G₁′**: son el mismo punto girado, visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.G_g), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("G2"))'
                mensaje: |
                  Has cambiado la cota de G. Con el eje vertical, G gira en un plano horizontal: en el
                  alzado solo se mueve en horizontal, y G₂′ queda a la altura de G₂.
                ejemplo: 'desplaza(proy_alzado(solucion.G_g), dy: mm(8))'
              - si: siempre
                mensaje: |
                  G₂′ está en la vertical de G₁′ y a la altura de G₂, arriba del todo del alzado.
          - nombre: K1p
            rotulo: K₁′
            pide: el vértice K girado, en la planta, que es también J girado
            es: proy_planta(solucion.K_g)
            bien: |
              K₁′ ≡ J₁′ está en la horizontal por F₁, a la distancia F₁J₁, 47,4 mm: es lo que mide H₁J₁,
              el borde de δ en el suelo, que ya estaba en verdadera magnitud porque es horizontal.
            diagnosticos:
              - si: cerca_de(figura.punto("K1"))
                mensaje: |
                  Ese es K₁ ≡ J₁, sin girar. Con δ frontal, J₁ queda en la horizontal que pasa por F₁.
                ejemplo: figura.punto("K1")
              - si: 'cerca_de(pie_perpendicular(figura.punto("K1"), figura.segmento("FE1")))'
                mensaje: |
                  Has subido J₁ **en vertical** hasta la horizontal por F₁: eso acorta δ. J gira con
                  centro en F₁ y conserva su distancia a él, 47,4 mm.
                ejemplo: 'pie_perpendicular(figura.punto("K1"), figura.segmento("FE1"))'
              - si: '!en_recta(figura.segmento("FE1"))'
                mensaje: |
                  Con δ frontal, toda su planta está en la horizontal que pasa por F₁: K₁′ también.
                ejemplo: 'desplaza(proy_planta(solucion.K_g), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal por F₁, pero no a la distancia buena: con centro en F₁ y radio
                  F₁J₁, el arco la corta en J₁′ ≡ K₁′.
          - nombre: K2p
            rotulo: K₂′
            pide: el vértice K girado, en el alzado
            es: proy_alzado(solucion.K_g)
            bien: |
              K₂′ está en la vertical de K₁′, arriba del todo, a la cota de K. Con H₂, J₂′, K₂′, G₂′ y
              F₂ queda δ en verdadera magnitud: un pentágono con tres ángulos rectos, en H, J y K.
            diagnosticos:
              - si: '!en_vertical_de(K1p)'
                mensaje: |
                  K₂′ va en la **vertical de K₁′**.
                ejemplo: 'desplaza(proy_alzado(solucion.K_g), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("K2"))'
                mensaje: |
                  La cota de K no cambia al girar: K₂′ está a la altura de K₂, arriba del todo del
                  alzado. La que está en el suelo es J₂′, debajo.
                ejemplo: proy_alzado(solucion.J_g)
              - si: siempre
                mensaje: |
                  K₂′ está en la vertical de K₁′ y a la altura de K₂.
        trazado:
          - segmento2(figura.punto("F1"), proy_planta(solucion.K_g))
          - segmento2(proy_planta(solucion.G_g), proy_alzado(solucion.G_g))
          - segmento2(proy_planta(solucion.K_g), proy_alzado(solucion.K_g))
          - segmento2(figura.punto("H2"), proy_alzado(solucion.J_g))
          - segmento2(proy_alzado(solucion.J_g), proy_alzado(solucion.K_g))
          - segmento2(proy_alzado(solucion.K_g), proy_alzado(solucion.G_g))
          - segmento2(proy_alzado(solucion.G_g), figura.punto("F2"))
        bloques:
          - nombre: Giro alrededor de HF
            explica: |
              δ es vertical: en la planta es el borde H₁J₁, a 18,4° del plano frontal. Se gira alrededor de
              la arista vertical HF, que hemos elegido de eje: en la planta es el punto H₁ ≡ F₁, y H y F no
              se mueven. Con un
              [eje vertical](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-giro-mover-la-figura),
              la planta gira sin deformarse y las cotas no cambian: cada punto conserva su distancia a F₁,
              el radio de su arco, y en el alzado se mueve en horizontal, a su altura. Se gira 18,4°, lo
              justo para que H₁J₁ quede horizontal en el papel, con J y K a la derecha: δ queda frontal, y
              su alzado es la verdadera magnitud.
        construccion:
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("F1"), desplaza(proy_planta(solucion.K_g), dx: 10))'
            bloque: Giro alrededor de HF
            porque: |
              Por F₁, que es el eje, la horizontal, larga: ahí queda la planta de δ cuando es frontal.
              Es la prolongación de F₁E₁.
          - con: compas
            traza: 'arco(figura.punto("F1"), por: figura.punto("G1"), desde: figura.punto("G1"), hasta: proy_planta(solucion.G_g))'
            bloque: Giro alrededor de HF
            porque: |
              Con centro en el eje, F₁, y radio F₁G₁, el arco hasta la horizontal: en un giro de eje
              vertical la planta gira sin deformarse.
          - con: marca
            traza: proy_planta(solucion.G_g)
            bloque: Giro alrededor de HF
            rotulo: G₁′
            porque: |
              G₁′, G girado en la planta, 1,6 mm a la derecha de E₁.
          - con: compas
            traza: 'arco(figura.punto("F1"), por: figura.punto("K1"), desde: figura.punto("K1"), hasta: proy_planta(solucion.K_g))'
            bloque: Giro alrededor de HF
            porque: |
              Lo mismo con J₁ ≡ K₁: el mismo centro y el mismo giro, unos 18°.
          - con: marca
            traza: proy_planta(solucion.K_g)
            bloque: Giro alrededor de HF
            rotulo: J₁′ ≡ K₁′
            porque: |
              J₁′ ≡ K₁′, donde el arco de centro F₁ que sale de K₁ corta la horizontal por F₁, a 47,4 mm de F₁:
              lo que mide H₁J₁, que ya estaba en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("K2"), desplaza(proy_alzado(solucion.K_g), dx: 10)), segmento2(figura.punto("J2"), desplaza(proy_alzado(solucion.J_g), dx: 10))]'
            bloque: Giro alrededor de HF
            porque: |
              K₂′ y J₂′ van a caer 2,4 mm a la derecha del alzado. Antes se prolongan hacia la derecha la
              arista de arriba y la línea del suelo, que son las horizontales a la cota de K y a la de J:
              las cotas no cambian en un giro de eje vertical.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.G_g), proy_alzado(solucion.G_g)), segmento2(proy_planta(solucion.K_g), proy_alzado(solucion.K_g))]'
            bloque: Giro alrededor de HF
            porque: |
              Las líneas de referencia, verticales, desde G₁′ y K₁′ hasta el alzado: G₂′ cae en la arista
              de arriba, y K₂′ y J₂′, en las dos prolongaciones.
          - con: marca
            traza: proy_alzado(solucion.G_g)
            bloque: Giro alrededor de HF
            rotulo: G₂′
            porque: |
              G₂′, a la altura de G₂ y en la vertical de G₁′.
          - con: marca
            traza: proy_alzado(solucion.K_g)
            bloque: Giro alrededor de HF
            rotulo: K₂′
            porque: |
              K₂′, a la altura de K₂ y en la vertical de K₁′.
          - con: marca
            traza: proy_alzado(solucion.J_g)
            bloque: Giro alrededor de HF
            rotulo: J₂′
            porque: |
              J₂′, en la línea del suelo prolongada y en la misma vertical.
          - con: regla
            traza: '[segmento2(figura.punto("H2"), proy_alzado(solucion.J_g)), segmento2(proy_alzado(solucion.K_g), proy_alzado(solucion.G_g)), segmento2(proy_alzado(solucion.G_g), figura.punto("F2"))]'
            bloque: Giro alrededor de HF
            porque: |
              El pentágono H₂J₂′K₂′G₂′F₂ es δ en verdadera magnitud; el lado J₂′K₂′ ya está trazado, en
              la línea de referencia de K.
        pista: |
          (1) Con centro en F₁, arcos de radio F₁G₁ y F₁J₁ hasta la horizontal por F₁: G₁′ y J₁′ ≡ K₁′.
          (2) Súbelos por sus verticales. (3) Las cotas no cambian: G₂′ y K₂′ arriba del todo, a la
          altura de G₂ y K₂; J₂′ en la línea del suelo.
        desarrollo: |
          En verde claro, δ girada: en la planta, la recta F₁J₁′, horizontal; en el alzado, el pentágono
          H₂J₂′K₂′G₂′F₂, que es δ en verdadera magnitud. El giro es de 18,4°, y por eso δ cambia poco:
          estaba casi frontal.

      - tipo: calcular
        titulo: La diagonal BE de α
        pregunta: ¿Cuánto mide de verdad la diagonal BE de α? Mídela en α abatida.
        respuesta:
          tipo: numero
          valor: '56.13'
          receta: BE_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '33.55'
            receta: en_mm(vm_planta(B, E))
            mensaje: |
              Eso es lo que mide **B₁E₁ en la planta**. BE sube 45 mm de B a E, y la planta lo acorta
              mucho. En α abatida, B₀ es B₁, porque B está en la charnela: mide de B₁ a E₀.
          - valor: '47.43'
            receta: en_mm(vm_alzado(B, E))
            mensaje: |
              Eso es **B₂E₂ en el alzado**, que también acorta: BE se acerca mientras sube, y no es
              frontal.
          - valor: '45.00'
            receta: en_mm(diferencia_de_cotas(B, E))
            mensaje: |
              Eso es lo que E está más alto que B, la **diferencia de cotas**: un cateto del triángulo
              de la verdadera magnitud, no la diagonal.
        pista: |
          B está en la charnela y no se mueve: la diagonal en verdadera magnitud va de B₁ a E₀.
        desarrollo: |
          $$ \overline{BE} = \sqrt{\overline{B_1E_1}^{\,2} + \Delta z^{2}} = \sqrt{33{,}55^{2} + 45{,}00^{2}} \approx 56{,}13 \text{ mm} $$

      - tipo: calcular
        titulo: La arista común a β y δ
        pregunta: FG es lado de β y de δ. ¿Cuánto mide de verdad? Mídelo en β y en δ, y comprueba que da lo mismo.
        respuesta:
          tipo: numero
          valor: '43.55'
          receta: FG_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '42.39'
            receta: en_mm(vm_alzado(F, G))
            mensaje: |
              Eso es **F₂G₂ en el alzado**, y FG no es frontal: G está 10 mm más cerca que F. La
              diferencia es poca, y por eso engaña. F₄G₄ en la vista nueva, o F₂G₂′ con δ girada, dan la
              verdadera magnitud.
          - valor: '31.59'
            receta: en_mm(vm_planta(F, G))
            mensaje: |
              Eso es **F₁G₁ en la planta**. FG sube 30 mm, y la planta lo acorta.
          - valor: '29.97'
            receta: en_mm(diferencia_de_cotas(F, G))
            mensaje: |
              Eso es lo que G está más alto que F, la **diferencia de cotas**: un cateto, no la arista.
        pista: |
          En β es la hipotenusa F₄G₄ del triángulo de la vista nueva; en δ, el lado F₂G₂′ del pentágono
          girado. Si no te dan lo mismo, uno de los dos está mal.
        desarrollo: |
          $$ \overline{FG} = \sqrt{\overline{F_2E_2}^{\,2} + \overline{E_4G_4}^{\,2}} = \sqrt{42{,}39^{2} + 9{,}99^{2}} \approx 43{,}55 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: α es oblicuo, y se abate sobre el suelo alrededor de AB, una horizontal suya que ya está en el suelo.
          - texto: Cada vértice de α se abate por la perpendicular a A₁B₁, con un radio que es la hipotenusa de lo que dista de A₁B₁ en la planta y de su cota.
          - texto: 'β es de canto: un solo cambio de plano horizontal, con la línea nueva paralela a F₂E₂, lo enseña sin acortar, y cada punto lleva su alejamiento contado desde el de F.'
          - texto: 'δ es vertical: un giro de eje vertical que deje su planta horizontal la pone frontal, y como las cotas no cambian, el alzado la da en verdadera magnitud.'
          - texto: β es de canto, así que su alzado F₂E₂G₂ ya está en verdadera magnitud.
            trampa: true
            mensaje: |
              De canto quiere decir lo contrario: el alzado ve β de lado, como una recta, y el triángulo
              entero se reduce a un segmento. Lo que está en verdadera magnitud en el alzado es solo
              FE, que es frontal; la forma de β hace falta verla desde una vista paralela a ella.
    resolucion: |
      **Qué es cada plano.** El bloque es un cubo de 45 mm cortado por tres planos. α se ve como un
      hexágono en las dos vistas: es oblicuo, a 54,8° del plano horizontal. β se reduce a la recta
      F₂E₂ en el alzado: es de canto. δ se reduce al borde H₁J₁ en la planta: es vertical, y está a
      18,4° del plano frontal. El método lo fija el enunciado para cada uno, y la recta que hace falta
      (charnela, línea nueva o eje) la fija el ejercicio, porque el enunciado no la da.

      **α, abatido.** AB es una horizontal de α que está en el suelo: con ella de charnela, α se tumba
      sobre el suelo. Cada vértice va por la perpendicular a A₁B₁, con un radio que es la hipotenusa de
      lo que dista de A₁B₁ en la planta y de su cota: 36,7 mm para C, 55,1 para D y E y 18,4 para F. Todos
      al mismo lado. El hexágono abatido tiene cuatro lados de 21,2 mm y dos de 42,4, BC y EF, opuestos,
      y todos los ángulos de 120°; su diagonal BE mide 56,13 mm.

      **β, por cambio de plano.** Con la línea nueva paralela a F₂E₂ y F de referencia, F₄ y E₄ caen en
      la línea, porque E y F están igual de lejos, y G₄ se aparta 10 mm, lo que G está más cerca. El
      triángulo es rectángulo en E: FE mide 42,39 mm, EG 9,99 y FG 43,55.

      **δ, por giro.** Con el eje vertical por H y F, la planta gira 18,4° alrededor de F₁ hasta que
      H₁J₁ queda horizontal; G₁′ y J₁′ ≡ K₁′ se llevan con el compás. Las cotas no cambian, y el alzado
      H₂J₂′K₂′G₂′F₂ es δ en verdadera magnitud: 47,39 mm abajo, 45,00 a la derecha, 15,80 arriba, 43,55
      el lado inclinado y 15,03 a la izquierda.

      **La comprobación.** FG es lado de β y de δ, y mide 43,55 mm en las dos construcciones, que se
      han hecho por métodos distintos. Si no coincidieran, una de las dos estaría mal.

  - id: sd26-el-plano-oblicuo-abcdefgh-por-tres-metodos
    titulo: El plano oblicuo ABCDEFGH, por los tres métodos
    fuente: Ejercicio 20 (SD26) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    enunciado: |
      Dibujar la verdadera magnitud del plano oblicuo ABCDEFGH aplicando los métodos de cambio de
      plano, abatimientos y giros.

      **Notas nuestras.** La figura es el octógono ABCDEFGH en el alzado, arriba, y en la planta,
      debajo, con sus vértices rotulados. La hoja no da escala: la leemos a 1:1, en milímetros de
      la lámina. Las rectas que van desde la figura hasta el
      borde izquierdo son las aristas de un prisma que el plano corta: no hacen falta para el
      ejercicio. «Verdadera magnitud» es la forma real de la figura, sin acortar.
    pide: La figura en verdadera magnitud por dos cambios de plano, por un abatimiento y por dos giros, el ángulo en D y la distancia de C a G, que tienen que salir iguales por los tres caminos.
    receta:
      lamina: sd26
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        abc: plano(C, D, E)
      solucion:
        # Decisión: 1 · Dos cambios de plano, con las dos líneas nuevas de la
        # lámina (que fija el ejercicio, porque el enunciado no las da) y C de referencia en los dos: el vertical,
        # perpendicular a las horizontales, deja el plano de canto (vista 4); el
        # horizontal, paralelo a ese canto, lo deja en verdadera magnitud (5).
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: C)'
        G_4: 'cambio_plano_vertical(G, figura.segmento("nueva1"), ref: C)'
        C_4: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: C)'
        A_5: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        B_5: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        C_5: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        D_5: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        E_5: 'cambio_plano_vertical(E, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        F_5: 'cambio_plano_vertical(F, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        G_5: 'cambio_plano_vertical(G, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        H_5: 'cambio_plano_vertical(H, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"))'
        perpA1: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("nueva1"))'
        perpG1: 'perpendicular(por: figura.punto("G1"), a: figura.segmento("nueva1"))'
        pieA1: 'pie_perpendicular(figura.punto("A1"), figura.segmento("nueva1"))'
        pieG1: 'pie_perpendicular(figura.punto("G1"), figura.segmento("nueva1"))'
        perpC4: 'perpendicular(por: C_4, a: figura.segmento("nueva2"))'
        perpA4: 'perpendicular(por: A_4, a: figura.segmento("nueva2"))'
        perpG4: 'perpendicular(por: G_4, a: figura.segmento("nueva2"))'
        pieA4: 'pie_perpendicular(A_4, figura.segmento("nueva2"))'
        pieG4: 'pie_perpendicular(G_4, figura.segmento("nueva2"))'
        # Lo que A está más cerca que C, que lleva el error de cambiar cotas
        # por alejamientos en el primer cambio: Pitágoras, porque la receta no
        # expone todavía la diferencia de alejamientos.
        dyAC: 'raiz(vm(A, C) * vm(A, C) - vm_alzado(A, C) * vm_alzado(A, C))'
        # Para la construcción paso a paso: la paralela a la primera línea nueva
        # por C₁. Lo que la planta de un punto está más lejos de la línea que C₁
        # es su distancia a esa paralela, medida por su horizontal.
        parC1: 'perpendicular(por: figura.punto("C1"), a: figura.segmento("D1C1"))'
        pieE1c: 'pie_perpendicular(figura.punto("E1"), parC1)'
        pieG1c: 'pie_perpendicular(figura.punto("G1"), parC1)'
        pieB1c: 'pie_perpendicular(figura.punto("B1"), parC1)'
        # Decisión: 2 · Abatimiento con la charnela CD, la horizontal más baja, que fija el
        # ejercicio. E se abate a cualquiera de los dos lados (una elección) y
        # los demás con el mismo giro.
        charnela: recta3(C, D)
        E_ab: abatido_a_elegir(E, charnela, abc)
        G_ab: 'abatido_junto(G, charnela, abc, con: E_ab, de: E)'
        H_ab: 'abatido_junto(H, charnela, abc, con: E_ab, de: E)'
        B_ab: 'abatido_junto(B, charnela, abc, con: E_ab, de: E)'
        A_ab: 'abatido_junto(A, charnela, abc, con: E_ab, de: E)'
        F_ab: 'abatido_junto(F, charnela, abc, con: E_ab, de: E)'
        ME: pie_perpendicular(E, charnela)
        MG: pie_perpendicular(G, charnela)
        MH: pie_perpendicular(H, charnela)
        MB: pie_perpendicular(B, charnela)
        perpE: 'perpendicular(por: figura.punto("E1"), a: figura.segmento("D1C1"))'
        perpG: 'perpendicular(por: figura.punto("G1"), a: figura.segmento("D1C1"))'
        perpH: 'perpendicular(por: figura.punto("H1"), a: figura.segmento("D1C1"))'
        perpB: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("D1C1"))'
        # Para la construcción paso a paso: el triángulo del radio de E (lo que E
        # está más alto que CD, llevado desde E₁ paralelo a C₁D₁, hacia abajo,
        # porque hacia arriba iría encima del lado E₁F₁) y el punto de
        # la charnela por el que pasan EG y su abatida (afinidad).
        TE: 'uno(medir_sobre(perpendicular(por: figura.punto("E1"), a: perpE), desde: figura.punto("E1"), distancia: diferencia_de_cotas(E, C)), 1)'
        Xeg: pie_comun(recta3(E, G), charnela)
        # Decisión: 3 · Dos giros, los dos con el eje por C, que fija el
        # ejercicio.
        # El primero, de eje vertical, lo justo para que CD (horizontal) quede
        # de punta: el ángulo de CD con la recta de punta por C. Con el eje hacia
        # abajo, la rama 1 es el giro corto, que deja D₁ debajo de C₁. Girar
        # 180° más también deja CD de punta, pero mete la figura en el alzado:
        # se fija el corto.
        Cv: 'punto3(alzado: desplaza(figura.punto("C2"), dy: 50), planta: figura.punto("C1"))'
        Cp: 'punto3(alzado: figura.punto("C2"), planta: desplaza(figura.punto("C1"), dy: 50))'
        vertical: recta3(C, Cv)
        punta: recta3(C, Cp)
        giro1: angulo_rectas(charnela, punta)
        A_g: 'rama(gira(A, vertical, angulo: giro1), 1)'
        B_g: 'rama(gira(B, vertical, angulo: giro1), 1)'
        D_g: 'rama(gira(D, vertical, angulo: giro1), 1)'
        E_g: 'rama(gira(E, vertical, angulo: giro1), 1)'
        F_g: 'rama(gira(F, vertical, angulo: giro1), 1)'
        G_g: 'rama(gira(G, vertical, angulo: giro1), 1)'
        H_g: 'rama(gira(H, vertical, angulo: giro1), 1)'
        canto: plano(D_g, E_g, G_g)
        # Decisión: el segundo, de eje de punta por C, lleva el canto hasta el plano
        # horizontal de C. Es el mismo movimiento que abatir ese plano de canto
        # con la recta de punta por C de charnela, y abatido_a_elegir da los dos
        # sentidos, que valen los dos: G se gira a cualquiera de los dos lados
        # (una elección) y los demás con el mismo giro.
        G_gg: abatido_a_elegir(G_g, punta, canto)
        E_gg: 'abatido_junto(E_g, punta, canto, con: G_gg, de: G_g)'
        B_gg: 'abatido_junto(B_g, punta, canto, con: G_gg, de: G_g)'
        A_gg: 'abatido_junto(A_g, punta, canto, con: G_gg, de: G_g)'
        F_gg: 'abatido_junto(F_g, punta, canto, con: G_gg, de: G_g)'
        H_gg: 'abatido_junto(H_g, punta, canto, con: G_gg, de: G_g)'
        D_gg: 'abatido_junto(D_g, punta, canto, con: G_gg, de: G_g)'
        verticalC1: 'perpendicular(por: figura.punto("C1"), a: figura.segmento("B1C1"))'
        # Las dos cifras, que valen lo mismo por los tres caminos.
        angulo_D: 180 - angulo_rectas(recta3(D, C), recta3(D, E))
        Eh: 'punto3(alzado: pie_perpendicular(figura.punto("E2"), figura.segmento("D2C2")), planta: figura.punto("E1"))'
        Cf: 'punto3(alzado: figura.punto("C2"), planta: pie_perpendicular(figura.punto("C1"), figura.segmento("E1D1")))'
        CG_mm: en_mm(vm(C, G))
      comprueba:
        - en_plano(A, abc)
        - en_plano(B, abc)
        - en_plano(F, abc)
        - en_plano(G, abc)
        - en_plano(H, abc)
    pasos:
      - tipo: reconocer
        pregunta: AB, CD, EF y GH tienen el alzado horizontal, y BC, DE, FG y HA, la planta horizontal. ¿Qué son esas rectas para el plano?
        opciones:
          - texto: Las primeras son horizontales del plano, y las segundas, frontales
            correcta: true
            mensaje: |
              Eso es. Un alzado horizontal dice que la recta no cambia de cota: es horizontal, y su
              planta está en verdadera magnitud. Una planta horizontal dice que no cambia de
              alejamiento: es frontal. Con ellas se hace todo: la línea nueva perpendicular a una
              horizontal pone el plano de canto, y una horizontal sirve de charnela.
          - texto: Las primeras son frontales, y las segundas, horizontales, porque un alzado horizontal es la marca de una frontal
            mensaje: |
              Al revés. Lo que una recta conserva se ve en la vista contraria: si su alzado es
              horizontal, la cota no cambia, y es una horizontal del plano. Las frontales son las de
              planta horizontal: no cambian de alejamiento.
          - texto: Son líneas de máxima pendiente del plano, las que más suben
            mensaje: |
              Una línea de máxima pendiente es perpendicular a las horizontales en la planta, y no
              tiene ninguna vista horizontal: sube todo lo que el plano deja. Aquí cada recta tiene una
              vista horizontal, así que son horizontales o frontales.

      - tipo: construir
        titulo: Por dos cambios de plano
        intro: |
          Dos cambios, como el método 1 de la hoja «Plano en VM». El enunciado no dice dónde van las
          líneas nuevas ni qué referencia se toma: lo hemos fijado nosotros. Las dos ya están
          dibujadas, de trazo y punto, y la referencia es C en los dos cambios. La primera, a la derecha
          del alzado, es perpendicular a las horizontales del plano: con un cambio vertical,
          que lleva cotas, el plano sale de canto en la vista 4. La segunda es paralela a ese canto: con
          un cambio horizontal, que lleva lo que la planta de cada punto distaba de la primera línea
          nueva, la vista 5 es la verdadera magnitud. Marca el canto y cuatro vértices de la vista 5.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            rotulo: A₄ ≡ B₄
            pide: A en la vista 4, que coincide con B, E y F
            es: solucion.A_4
            bien: |
              A₄ está en la perpendicular a la primera línea nueva que pasa por A₁, y 22 mm por fuera:
              lo que A está más alto que C. B, E y F caen en el mismo punto, porque están en la misma
              horizontal del plano, que la vista 4 ve de punta.
            diagnosticos:
              - si: cerca_de(solucion.pieA1)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí cae C, que es la referencia; A está 22 mm más
                  alta que C, y su cota se lleva desde la línea hacia fuera.
                ejemplo: solucion.pieA1
              - si: 'en_recta(solucion.perpA1) && a_distancia(de: solucion.pieA1, d: solucion.dyAC)'
                mensaje: |
                  Has llevado lo que A está **más cerca** que C, el alejamiento. Un cambio de plano
                  vertical sale de la planta y lleva **cotas**: lo que A₂ está por encima de C₂.
                ejemplo: 'uno(medir_sobre(solucion.perpA1, desde: solucion.pieA1, distancia: solucion.dyAC), 2)'
              - si: 'cerca_de(uno(medir_sobre(solucion.perpA1, desde: solucion.pieA1, distancia: diferencia_de_cotas(A, C)), 1))'
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. La vista nueva queda al otro
                  lado de la línea nueva, y un punto más alto que la referencia se aparta de la línea
                  hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.perpA1, desde: solucion.pieA1, distancia: diferencia_de_cotas(A, C)), 1)'
              - si: '!en_recta(solucion.perpA1)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**: es la dirección desde la que
                  mira la vista 4, la de las horizontales del plano.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena. A₄ se aparta de la línea
                  nueva lo que A está más alto que C, que se mide en el alzado: 22 mm.
          - nombre: G4
            rotulo: G₄ ≡ H₄
            pide: G en la vista 4, que coincide con H
            es: solucion.G_4
            bien: |
              G₄ está 44 mm por fuera de la línea nueva, lo que G está más alto que C. C₄, A₄ y G₄ quedan
              en una recta: el plano, de canto, y su ángulo con la línea nueva es el del plano con el
              horizontal, 67,4°.
            diagnosticos:
              - si: cerca_de(solucion.pieG1)
                mensaje: |
                  Te has quedado en la línea nueva: G está 44 mm más alto que C, la referencia.
                ejemplo: solucion.pieG1
              - si: 'en_recta(solucion.perpG1) && a_distancia(de: solucion.pieG1, d: diferencia_de_cotas(G, A))'
                mensaje: |
                  Has contado la cota de G desde la de A. La referencia de este cambio es C, la que cae en
                  la línea nueva, y todas las cotas se cuentan desde la suya.
                ejemplo: 'uno(medir_sobre(solucion.perpG1, desde: solucion.pieG1, distancia: diferencia_de_cotas(G, A)), 2)'
              - si: '!en_recta(solucion.perpG1)'
                mensaje: |
                  G₄ sale de G₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.G_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: 44 mm por fuera de la
                  línea, lo que G₂ está por encima de C₂. Comprueba que C₄, A₄ y G₄ salen en línea.
          - nombre: D5
            rotulo: D₅
            pide: D en la vista 5
            es: solucion.D_5
            bien: |
              D₅ está en la perpendicular a la segunda línea nueva que pasa por D₄ ≡ C₄, a 59,5 mm de
              ella: lo que D₁ estaba más lejos de la primera línea nueva que C₁. C₅D₅ es CD en verdadera
              magnitud, que ya lo era en la planta.
            diagnosticos:
              - si: en_recta(figura.segmento("nueva2"))
                mensaje: |
                  Has llevado otra vez **la cota**. D tiene la cota de C, y con ella se queda en la línea.
                  En el segundo cambio se lleva la distancia de la vista que se deja atrás, la planta: lo
                  que D₁ estaba más lejos de la primera línea nueva que C₁.
                ejemplo: solucion.C_5
              - si: 'cerca_de(uno(medir_sobre(solucion.perpC4, desde: solucion.C_5, distancia: vm_planta(C, D)), 2))'
                mensaje: |
                  La distancia es la buena, pero hacia la vista 4. La vista 5 queda al otro lado de la
                  segunda línea nueva.
                ejemplo: 'uno(medir_sobre(solucion.perpC4, desde: solucion.C_5, distancia: vm_planta(C, D)), 2)'
              - si: '!en_recta(solucion.perpC4)'
                mensaje: |
                  D₅ sale de D₄, que coincide con C₄, por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.D_5, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: lo que D₁ estaba más
                  lejos de la primera línea nueva que C₁, que es lo que mide C₁D₁, 59,5 mm.
          - nombre: E5
            rotulo: E₅
            pide: E en la vista 5
            es: solucion.E_5
            bien: |
              E₅ está en la perpendicular a la segunda línea nueva por E₄ ≡ A₄, a lo que E₁ estaba más
              lejos de la primera línea nueva que C₁. D₅E₅ mide 24,6 mm, como D₂E₂: DE es frontal.
            diagnosticos:
              - si: 'en_recta(solucion.perpA4) && a_distancia(de: solucion.pieA4, d: diferencia_de_cotas(E, C))'
                mensaje: |
                  Has llevado otra vez **la cota** de E, 22 mm. En el segundo cambio se lleva lo que E₁
                  estaba más lejos de la primera línea nueva que C₁: se mide en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpA4, desde: solucion.pieA4, distancia: diferencia_de_cotas(E, C)), 1)'
              - si: '!en_recta(solucion.perpA4)'
                mensaje: |
                  E₅ sale de E₄, que coincide con A₄, por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.E_5, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de A₄ ≡ E₄. Sobre ella caen A₅, B₅, E₅ y F₅, cada uno
                  a lo que su planta estaba más lejos de la primera línea nueva que C₁: E es el que más.
          - nombre: G5
            rotulo: G₅
            pide: G en la vista 5
            es: solucion.G_5
            bien: |
              G₅ está en la perpendicular a la segunda línea nueva por G₄ ≡ H₄. E₅F₅ y G₅H₅ salen
              paralelas a C₅D₅: son horizontales del plano, como CD.
            diagnosticos:
              - si: 'en_recta(solucion.perpG4) && a_distancia(de: solucion.pieG4, d: diferencia_de_cotas(G, C))'
                mensaje: |
                  Has llevado otra vez **la cota** de G, 44 mm. En el segundo cambio se lleva lo que G₁
                  estaba más lejos de la primera línea nueva que C₁.
                ejemplo: 'uno(medir_sobre(solucion.perpG4, desde: solucion.pieG4, distancia: diferencia_de_cotas(G, C)), 1)'
              - si: '!en_recta(solucion.perpG4)'
                mensaje: |
                  G₅ sale de G₄, que coincide con H₄, por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.G_5, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de G₄ ≡ H₄, pero no a la distancia buena: lo que G₁
                  estaba más lejos de la primera línea nueva que C₁.
          - nombre: B5
            rotulo: B₅
            pide: B en la vista 5
            es: solucion.B_5
            bien: |
              B₅ está en la perpendicular por A₄ ≡ B₄, y muy cerca de la segunda línea nueva: B₁ está
              casi tan cerca de la primera línea como C₁. B₅C₅ es paralela a D₅E₅, y A₅B₅, a C₅D₅.
            diagnosticos:
              - si: 'en_recta(solucion.perpA4) && a_distancia(de: solucion.pieA4, d: diferencia_de_cotas(B, C))'
                mensaje: |
                  Has llevado otra vez **la cota** de B, 22 mm. En el segundo cambio se lleva lo que B₁
                  estaba más lejos de la primera línea nueva que C₁: muy poco.
                ejemplo: 'uno(medir_sobre(solucion.perpA4, desde: solucion.pieA4, distancia: diferencia_de_cotas(B, C)), 1)'
              - si: '!en_recta(solucion.perpA4)'
                mensaje: |
                  B₅ sale de B₄, que coincide con A₄, por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.B_5, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: lo que B₁ estaba más
                  lejos de la primera línea nueva que C₁.
        trazado:
          - segmento2(solucion.C_4, solucion.G_4)
          - segmento2(solucion.C_5, solucion.D_5)
          - segmento2(solucion.D_5, solucion.E_5)
          - segmento2(solucion.E_5, solucion.F_5)
          - segmento2(solucion.F_5, solucion.G_5)
          - segmento2(solucion.G_5, solucion.H_5)
          - segmento2(solucion.H_5, solucion.A_5)
          - segmento2(solucion.A_5, solucion.B_5)
          - segmento2(solucion.B_5, solucion.C_5)
        bloques:
          - nombre: 1.er cambio de plano
            explica: |
              Es un cambio vertical: la planta se queda, y el plano vertical se cambia por otro
              perpendicular a las horizontales del plano, AB, CD, EF y GH. Por eso la primera línea nueva,
              que hemos fijado nosotros, va perpendicular a sus plantas: la vista 4 ve cada horizontal de
              punta, y sus puntos caen juntos. Cada punto conserva su cota, contada desde la de C, la
              referencia, que cae en la línea con D: A, B, E y F se apartan 22 mm hacia el lado contrario a
              la planta, y G y H, 44 mm. C₄, A₄ y G₄ quedan en una recta: el plano, de canto. Es el primer
              paso de
              [un plano, en dos cambios](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-cambios):
              el canto ya da la inclinación del plano, 67,4°, pero todavía no su forma.
          - nombre: 2.º cambio de plano
            explica: |
              Es un cambio horizontal: la vista 4 se queda, y la planta se cambia por una vista desde un
              plano paralelo al del octógono. Por eso la segunda línea nueva va paralela al canto, y la
              vista 5 da ABCDEFGH en verdadera magnitud; C sigue de referencia, y C₅ cae en la segunda
              línea. Cada punto lleva la distancia de la vista que se deja, la planta: lo que su planta está
              más lejos de la primera línea nueva que C₁, que es su distancia a la paralela por C₁. D₅ queda
              a 59,5 mm de la segunda línea, lo que mide C₁D₁, perpendicular a esa paralela. En la vista 5
              las horizontales siguen paralelas entre sí, y las frontales también, y eso ahorra arcos: F₅ y
              H₅ salen con paralelas, y A₅, con A₁B₁, que ya es verdadera magnitud.
        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("C1"), desplaza(solucion.C_4, dx: 5.55, dy: -8.32)), segmento2(figura.punto("B1"), desplaza(solucion.A_4, dx: 5.55, dy: -8.32)), segmento2(figura.punto("H1"), desplaza(solucion.G_4, dx: 5.55, dy: -8.32))]'
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Desde la planta, las perpendiculares a la primera línea nueva, largas, más allá de ella.
              Como la línea es perpendicular a las horizontales del plano, cada perpendicular es una
              horizontal prolongada: la de C₁D₁, la de E₁F₁A₁B₁ y la de G₁H₁, y los puntos de cada una
              caen juntos. Cruzan el alzado: la de B₁ pasa justo por C₂, y la de H₁ corta C₂D₂ y B₂C₂.
          - con: marca
            traza: solucion.C_4
            bloque: 1.er cambio de plano
            porque: |
              C es la referencia, y cae en la línea nueva; D, con la misma cota, también. Es C₄ ≡ D₄, y
              va sin rótulo: el de C₅, que se marca después, lo pisaría.
          - con: compas
            traza: 'arco(solucion.pieA1, por: solucion.A_4, desde: desplaza(solucion.A_4, dx: 4.99, dy: 3.33), hasta: desplaza(solucion.A_4, dx: -4.99, dy: -3.33))'
            bloque: 1.er cambio de plano
            toma: segmento2(figura.punto("F2"), figura.punto("D2"))
            porque: |
              Con el compás, en el alzado, **lo que A está más alto que C**: 22 mm, lo mismo que de D₂ a
              F₂. Se lleva desde la línea nueva hacia fuera, lejos de la planta.
          - con: marca
            traza: solucion.A_4
            bloque: 1.er cambio de plano
            rotulo: A₄ ≡ B₄
            porque: |
              A₄, y con él B₄, E₄ y F₄: los cuatro están en la misma horizontal del plano.
          - con: compas
            traza: 'arco(solucion.pieG1, por: solucion.G_4, desde: desplaza(solucion.G_4, dx: 4.99, dy: 3.33), hasta: desplaza(solucion.G_4, dx: -4.99, dy: -3.33))'
            bloque: 1.er cambio de plano
            toma: segmento2(figura.punto("H2"), figura.punto("D2"))
            porque: |
              Lo mismo con G, que está 44 mm más alto que C: de D₂ a H₂.
          - con: marca
            traza: solucion.G_4
            bloque: 1.er cambio de plano
            rotulo: G₄ ≡ H₄
            porque: |
              G₄, donde el arco de 44 mm, con centro en el pie de G₁ en la línea nueva, corta la perpendicular que sale de H₁ (la horizontal G₁H₁ prolongada); con él cae H₄, que tiene la misma cota.
          - con: regla
            traza: segmento2(solucion.C_4, solucion.G_4)
            bloque: 1.er cambio de plano
            rotulo: canto
            porque: |
              C₄, A₄ y G₄ quedan en una recta: el plano, de canto. Su ángulo con la línea nueva es el del
              plano con el horizontal, 67,4°.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.C_4, desplaza(solucion.D_5, dx: 7.85, dy: 1.54)), segmento2(solucion.A_4, desplaza(solucion.E_5, dx: 7.85, dy: 1.54)), segmento2(solucion.G_4, desplaza(solucion.G_5, dx: 7.85, dy: 1.54))]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva2")
            porque: |
              Desde C₄, A₄ y G₄, las perpendiculares a la segunda línea nueva, que es paralela al canto:
              largas, más allá de ella.
          - con: marca
            traza: solucion.C_5
            bloque: 2.º cambio de plano
            rotulo: C₅
            porque: |
              C₅, donde la perpendicular de C₄ corta la segunda línea nueva: C es también la referencia
              del segundo cambio.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.pieG1c)
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por C₁, la paralela a la primera línea nueva, hasta la horizontal de G₁. En el segundo
              cambio cada punto lleva lo que su planta está más lejos de la primera línea que C₁, y eso
              es su distancia a esta paralela, medida por su horizontal.
          - con: compas
            traza: 'arco(solucion.C_5, por: solucion.D_5, desde: desplaza(solucion.D_5, dx: -1.16, dy: 5.89), hasta: desplaza(solucion.D_5, dx: 1.16, dy: -5.89))'
            bloque: 2.º cambio de plano
            toma: figura.segmento("D1C1")
            porque: |
              D₁ está en la horizontal de C₁, así que su distancia a la paralela es C₁D₁, 59,5 mm. Con esa
              abertura, desde C₅, hacia fuera.
          - con: marca
            traza: solucion.D_5
            bloque: 2.º cambio de plano
            rotulo: D₅
            porque: |
              D₅. C₅D₅ es CD en verdadera magnitud, que ya lo era en la planta.
          - con: compas
            traza: 'arco(solucion.pieA4, por: solucion.E_5, desde: desplaza(solucion.E_5, dx: -1.15, dy: 5.89), hasta: desplaza(solucion.E_5, dx: 1.15, dy: -5.89))'
            bloque: 2.º cambio de plano
            toma: segmento2(figura.punto("E1"), solucion.pieE1c)
            porque: |
              La distancia de E₁ a la paralela, por su horizontal, se lleva sobre la perpendicular que
              sale de A₄ ≡ E₄, desde donde corta la segunda línea nueva.
          - con: marca
            traza: solucion.E_5
            bloque: 2.º cambio de plano
            rotulo: E₅
            porque: |
              E₅, el vértice más alejado de la segunda línea nueva.
          - con: compas
            traza: 'arco(solucion.pieG4, por: solucion.G_5, desde: desplaza(solucion.G_5, dx: -1.15, dy: 5.89), hasta: desplaza(solucion.G_5, dx: 1.15, dy: -5.89))'
            bloque: 2.º cambio de plano
            toma: segmento2(figura.punto("G1"), solucion.pieG1c)
            porque: |
              Lo mismo con G, sobre la perpendicular que sale de G₄ ≡ H₄.
          - con: marca
            traza: solucion.G_5
            bloque: 2.º cambio de plano
            rotulo: G₅
            porque: |
              G₅, donde el arco corta la perpendicular que sale de G₄ ≡ H₄.
          - con: compas
            traza: 'arco(solucion.pieA4, por: solucion.B_5, desde: desplaza(solucion.B_5, dx: -0.48, dy: 2.45), hasta: desplaza(solucion.B_5, dx: 0.48, dy: -2.45))'
            bloque: 2.º cambio de plano
            toma: segmento2(figura.punto("B1"), solucion.pieB1c)
            porque: |
              Y con B, que está casi tan cerca de la primera línea como C: B₅ cae muy cerca de la
              segunda.
          - con: marca
            traza: solucion.B_5
            bloque: 2.º cambio de plano
            rotulo: B₅
            porque: |
              B₅, en la misma perpendicular que E₅.
          - con: regla
            traza: '[segmento2(solucion.D_5, solucion.E_5), segmento2(solucion.B_5, solucion.C_5)]'
            bloque: 2.º cambio de plano
            porque: |
              Los lados D₅E₅ y B₅C₅, que son frontales del plano y van a servir de guía para las
              paralelas.
          - con: escuadra-cartabon
            traza: segmento2(solucion.G_5, solucion.F_5)
            bloque: 2.º cambio de plano
            guia: segmento2(solucion.D_5, solucion.E_5)
            porque: |
              FG es frontal, como DE, y dos rectas paralelas siguen paralelas en la verdadera magnitud:
              por G₅, la paralela a D₅E₅, hasta la perpendicular que sale de A₄.
          - con: marca
            traza: solucion.F_5
            bloque: 2.º cambio de plano
            rotulo: F₅
            porque: |
              F₅, donde la paralela a D₅E₅ por G₅ corta la perpendicular que sale de A₄ ≡ F₄: entre E₅ y B₅.
          - con: compas
            traza: 'arco(solucion.B_5, por: solucion.A_5, desde: desplaza(solucion.A_5, dx: -1.16, dy: 5.89), hasta: desplaza(solucion.A_5, dx: 1.16, dy: -5.89))'
            bloque: 2.º cambio de plano
            toma: figura.segmento("A1B1")
            porque: |
              AB es horizontal, así que A₁B₁ ya es su verdadera magnitud: con esa abertura, desde B₅,
              sobre la misma perpendicular.
          - con: marca
            traza: solucion.A_5
            bloque: 2.º cambio de plano
            rotulo: A₅
            porque: |
              A₅, donde el arco de centro B₅ y radio A₁B₁ corta la perpendicular que sale de A₄ ≡ B₄: entre B₅ y F₅.
          - con: escuadra-cartabon
            traza: segmento2(solucion.A_5, solucion.H_5)
            bloque: 2.º cambio de plano
            guia: segmento2(solucion.B_5, solucion.C_5)
            porque: |
              HA es frontal, como BC: por A₅, la paralela a B₅C₅, hasta la perpendicular que sale de G₄.
          - con: marca
            traza: solucion.H_5
            bloque: 2.º cambio de plano
            rotulo: H₅
            porque: |
              H₅, en la misma perpendicular que G₅.
          - con: regla
            traza: '[segmento2(solucion.C_5, solucion.D_5), segmento2(solucion.D_5, solucion.E_5), segmento2(solucion.E_5, solucion.F_5), segmento2(solucion.F_5, solucion.G_5), segmento2(solucion.G_5, solucion.H_5), segmento2(solucion.H_5, solucion.A_5), segmento2(solucion.A_5, solucion.B_5), segmento2(solucion.B_5, solucion.C_5)]'
            bloque: 2.º cambio de plano
            porque: |
              Repasado, el octógono C₅D₅E₅F₅G₅H₅A₅B₅ es el plano en verdadera magnitud.
        pista: |
          (1) Por cada vértice de la planta, la perpendicular a la primera línea nueva: los de una misma
          horizontal comparten perpendicular. (2) C₄ en la línea; A₄ y G₄, a 22 y 44 mm, lo que están
          más altos que C. (3) Por C₄, A₄ y G₄, las perpendiculares a la segunda línea. (4) Cada punto,
          a lo que su planta estaba más lejos de la primera línea nueva que C₁.
        desarrollo: |
          En verde claro, el canto de la vista 4 y el octógono de la vista 5: ABCDEFGH en verdadera
          magnitud.

      - tipo: construir
        titulo: Por abatimiento, con la charnela CD
        intro: |
          Abate el plano sobre el plano horizontal de CD, con CD de charnela. El enunciado no dice qué
          charnela; la fijamos nosotros: CD es una horizontal del plano, la más baja. C y D no se
          mueven. Marca E, G, H y B abatidos; F y A caen en la recta E₀B₀, que sale paralela a C₁D₁.
          Vale cualquiera de los dos lados de C₁D₁, pero todos al mismo. Las dos rectas de trazo y punto
          de la derecha son las líneas nuevas de los cambios de plano: aquí no se usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: E0
            pide: el vértice E, abatido
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la perpendicular a C₁D₁ que pasa por E₁, a la distancia real de E a la
              charnela, 23,8 mm: la hipotenusa de lo que separa E₁ de C₁D₁ en la planta y de lo que E
              está más alto que CD.
            diagnosticos:
              - si: cerca_de(figura.punto("E1"))
                mensaje: |
                  Ese es E₁, sin abatir. E gira alrededor de CD hasta quedar a la cota de CD, y en la
                  planta se aparta de C₁D₁ por la perpendicular.
                ejemplo: figura.punto("E1")
              - si: 'cerca_de(medir_sobre(solucion.perpE, desde: proy_planta(solucion.ME), distancia: diferencia_de_cotas(E, C)))'
                mensaje: |
                  Vas por la perpendicular a C₁D₁, pero has llevado solo **lo que E está más alto que
                  CD**: un cateto. El radio es la hipotenusa de ese cateto y de lo que separa E₁ de C₁D₁
                  en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpE, desde: proy_planta(solucion.ME), distancia: diferencia_de_cotas(E, C)), 1)'
              - si: '!en_recta(solucion.perpE)'
                mensaje: |
                  E gira alrededor de CD en un plano vertical, perpendicular a CD: en la planta, E₀ se
                  mueve por la **perpendicular a C₁D₁ que pasa por E₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a C₁D₁ por E₁, pero no a la distancia buena. El radio es la
                  hipotenusa de lo que separa E₁ de C₁D₁ en la planta y de lo que E₂ está por encima de
                  C₂D₂.
          - nombre: G0
            pide: el vértice G, abatido
            es: proy_planta(solucion.G_ab)
            bien: |
              G₀ está en la perpendicular a C₁D₁ por G₁, del mismo lado que E₀ y al doble de distancia,
              47,6 mm: G está el doble de lejos de CD que E: el doble de alto y el doble de apartado en la planta.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.G_ab)))
                mensaje: |
                  Ese es G abatido **al otro lado** de la charnela. El plano gira entero, como una tapa
                  sobre su bisagra: todo cae al lado de E₀.
                ejemplo: proy_planta(rama(solucion.G_ab, 2))
              - si: cerca_de(figura.punto("G1"))
                mensaje: |
                  Ese es G₁, sin abatir. G gira alrededor de CD y se aparta de C₁D₁ por la
                  perpendicular que pasa por G₁.
                ejemplo: figura.punto("G1")
              - si: 'en_recta(solucion.perpG) && a_distancia(de: proy_planta(solucion.MG), d: diferencia_de_cotas(G, C))'
                mensaje: |
                  Has llevado solo **lo que G está más alto que CD**, 44 mm: un cateto. Falta el otro, lo
                  que separa G₁ de C₁D₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpG, desde: proy_planta(solucion.MG), distancia: diferencia_de_cotas(G, C)), 1)'
              - si: '!en_recta(solucion.perpG)'
                mensaje: |
                  G₀ va por la **perpendicular a C₁D₁ que pasa por G₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.G_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a C₁D₁ por G₁, pero no a la distancia buena: hazlo como con E.
          - nombre: H0
            pide: el vértice H, abatido
            es: proy_planta(solucion.H_ab)
            bien: |
              H₀ está en la perpendicular a C₁D₁ por H₁, a la misma distancia que G₀: GH es horizontal,
              y G₀H₀ sale paralela a C₁D₁.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.H_ab)))
                mensaje: |
                  Ese es H abatido **al otro lado** de la charnela: va al lado de E₀ y G₀.
                ejemplo: proy_planta(rama(solucion.H_ab, 2))
              - si: cerca_de(figura.punto("H1"))
                mensaje: |
                  Ese es H₁, sin abatir. H se aparta de C₁D₁ por la perpendicular que pasa por H₁.
                ejemplo: figura.punto("H1")
              - si: '!en_recta(solucion.perpH)'
                mensaje: |
                  H₀ va por la **perpendicular a C₁D₁ que pasa por H₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.H_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a C₁D₁ por H₁, pero no a la distancia buena: la de G₀, porque
                  GH es una horizontal del plano y G₀H₀ es paralela a C₁D₁.
          - nombre: B0
            pide: el vértice B, abatido
            es: proy_planta(solucion.B_ab)
            bien: |
              B₀ está en la recta de E₀, paralela a C₁D₁: E, F, A y B están en la misma horizontal del
              plano. C₁D₁E₀F₀G₀H₀A₀B₀ es el plano en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.B_ab)))
                mensaje: |
                  Ese es B abatido **al otro lado** de la charnela: va al lado de E₀.
                ejemplo: proy_planta(rama(solucion.B_ab, 2))
              - si: cerca_de(figura.punto("B1"))
                mensaje: |
                  Ese es B₁, sin abatir. B se aparta de C₁D₁ por la perpendicular que pasa por B₁.
                ejemplo: figura.punto("B1")
              - si: 'cerca_de(medir_sobre(solucion.perpB, desde: proy_planta(solucion.MB), distancia: diferencia_de_cotas(B, C)))'
                mensaje: |
                  Has llevado solo **lo que B está más alto que CD**: un cateto. El radio es la
                  hipotenusa de ese cateto y de lo que separa B₁ de C₁D₁ en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpB, desde: proy_planta(solucion.MB), distancia: diferencia_de_cotas(B, C)), 1)'
              - si: '!en_recta(solucion.perpB)'
                mensaje: |
                  B₀ va por la **perpendicular a C₁D₁ que pasa por B₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.B_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a C₁D₁ por B₁, pero no a la distancia buena: B₀ está en la
                  paralela a C₁D₁ que pasa por E₀.
        trazado:
          - segmento2(figura.punto("D1"), proy_planta(solucion.E_ab))
          - segmento2(proy_planta(solucion.E_ab), proy_planta(solucion.F_ab))
          - segmento2(proy_planta(solucion.F_ab), proy_planta(solucion.G_ab))
          - segmento2(proy_planta(solucion.G_ab), proy_planta(solucion.H_ab))
          - segmento2(proy_planta(solucion.H_ab), proy_planta(solucion.A_ab))
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.B_ab))
          - segmento2(proy_planta(solucion.B_ab), figura.punto("C1"))
        bloques:
          - nombre: Abatimiento con charnela CD
            explica: |
              Se abate el plano sobre el plano horizontal de CD, alrededor de CD, la horizontal más baja,
              que hemos elegido de charnela: C y D no se mueven. Los otros vértices giran en planos
              verticales, perpendiculares a CD, y en la planta se apartan de C₁D₁ por sus perpendiculares.
              El radio es la distancia real a la charnela: la hipotenusa de lo que la planta dista de C₁D₁ y
              de lo que el punto está más alto que CD; para E, 23,8 mm. Los demás se ahorran el triángulo:
              E, F, A y B están en una horizontal, que abatida sigue paralela a C₁D₁; G sale por
              [afinidad](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano),
              porque EG y su abatida se cortan en la charnela, y H, en la paralela por G₀. Con todos los
              vértices al mismo lado, el octógono abatido es la verdadera magnitud, en un solo paso.
        construccion:
          - con: regla
            traza: 'segmento2(figura.punto("D1"), desplaza(proy_planta(solucion.Xeg), dx: -5.55, dy: 8.32))'
            bloque: Abatimiento con charnela CD
            rotulo: charnela
            porque: |
              La **charnela**, C₁D₁, prolongada con la regla más allá de D₁, larga: ahí caen el pie de E
              y el punto fijo de la afinidad de EG.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("E1"), desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: -6.66, dy: -4.44)), segmento2(figura.punto("E1"), desplaza(proy_planta(rama(solucion.E_ab, 2)), dx: 6.66, dy: 4.44))]'
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por E₁, la **perpendicular a C₁D₁**, larga y hacia los dos lados: E gira alrededor de CD en
              un plano vertical, y en la planta se mueve por esa recta. Corta la charnela en M, el pie de
              E.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("E1"), desplaza(solucion.TE, dx: -4.44, dy: 6.66))'
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por E₁, la paralela a C₁D₁, larga, para el triángulo del radio, rectángulo en E₁. Como EF
              también es horizontal, esa paralela es la recta F₁E₁: se lleva hacia abajo, por su
              prolongación, para no montar el cateto encima del lado E₁F₁.
          - con: compas
            traza: 'arco(figura.punto("E1"), por: solucion.TE, desde: desplaza(solucion.TE, dx: -4.99, dy: -3.33), hasta: desplaza(solucion.TE, dx: 4.99, dy: 3.33))'
            bloque: Abatimiento con charnela CD
            toma: segmento2(figura.punto("F2"), figura.punto("D2"))
            porque: |
              Con el compás, en el alzado, **lo que E está más alto que CD**: 22 mm, lo mismo que de D₂ a
              F₂. Se lleva desde E₁ sobre la paralela.
          - con: regla
            traza: segmento2(proy_planta(solucion.ME), solucion.TE)
            bloque: Abatimiento con charnela CD
            rotulo: r
            porque: |
              La hipotenusa, de M a ese punto, es la distancia real de E a la charnela: el radio, 23,8
              mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.ME), por: solucion.TE, desde: solucion.TE, hasta: proy_planta(solucion.E_ab))'
            bloque: Abatimiento con charnela CD
            toma: segmento2(proy_planta(solucion.ME), solucion.TE)
            porque: |
              Con centro en M, en la charnela, y ese radio, el arco hasta la perpendicular.
          - con: marca
            traza: proy_planta(solucion.E_ab)
            bloque: Abatimiento con charnela CD
            rotulo: E₀
            porque: |
              E₀, E abatido, hacia el lado de la figura; al otro lado también valdría.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.E_ab), desplaza(proy_planta(solucion.B_ab), dx: 4.44, dy: -6.66))'
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              E, F, A y B están en la misma horizontal del plano, paralela a CD: sus abatidos, en la
              paralela a C₁D₁ que pasa por E₀, larga.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), proy_planta(solucion.B_ab))
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por B₁, la perpendicular a C₁D₁, hasta esa paralela.
          - con: marca
            traza: proy_planta(solucion.B_ab)
            bloque: Abatimiento con charnela CD
            rotulo: B₀
            porque: |
              B₀, en la paralela de E₀.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F1"), proy_planta(solucion.F_ab))
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por F₁, la perpendicular a C₁D₁, hasta la misma paralela.
          - con: marca
            traza: proy_planta(solucion.F_ab)
            bloque: Abatimiento con charnela CD
            rotulo: F₀
            porque: |
              F₀, donde la perpendicular a C₁D₁ por F₁ corta la paralela que sale de E₀; no se pide, pero cierra la figura.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), proy_planta(solucion.A_ab))
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por A₁, la perpendicular a C₁D₁, hasta la misma paralela.
          - con: marca
            traza: proy_planta(solucion.A_ab)
            bloque: Abatimiento con charnela CD
            rotulo: A₀
            porque: |
              A₀, donde la perpendicular a C₁D₁ por A₁ corta esa misma paralela: entre F₀ y B₀.
          - con: regla
            traza: segmento2(figura.punto("G1"), proy_planta(solucion.Xeg))
            bloque: Abatimiento con charnela CD
            porque: |
              G sale por **afinidad**. La recta G₁E₁, prolongada, corta la charnela prolongada en un punto
              que no se mueve.
          - con: regla
            traza: 'segmento2(proy_planta(solucion.Xeg), desplaza(proy_planta(solucion.G_ab), dx: -3.55, dy: -7.17))'
            bloque: Abatimiento con charnela CD
            porque: |
              La abatida de EG, larga: pasa por ese punto y por E₀.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("G1"), proy_planta(solucion.G_ab))
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por G₁, la perpendicular a C₁D₁, hasta la abatida de EG.
          - con: marca
            traza: proy_planta(solucion.G_ab)
            bloque: Abatimiento con charnela CD
            rotulo: G₀
            porque: |
              G₀, al doble de distancia de la charnela que E₀.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.G_ab), desplaza(proy_planta(solucion.H_ab), dx: 4.44, dy: -6.66))'
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              GH es otra horizontal: por G₀, la paralela a C₁D₁, larga.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("H1"), proy_planta(solucion.H_ab))
            bloque: Abatimiento con charnela CD
            guia: figura.segmento("D1C1")
            porque: |
              Por H₁, la perpendicular a C₁D₁, hasta la paralela de G₀.
          - con: marca
            traza: proy_planta(solucion.H_ab)
            bloque: Abatimiento con charnela CD
            rotulo: H₀
            porque: |
              H₀, en la misma paralela que G₀.
          - con: regla
            traza: '[segmento2(figura.punto("D1"), proy_planta(rama(solucion.E_ab, 1))), segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.G_ab, 1))), segmento2(proy_planta(rama(solucion.H_ab, 1)), proy_planta(rama(solucion.A_ab, 1))), segmento2(proy_planta(rama(solucion.B_ab, 1)), figura.punto("C1"))]'
            bloque: Abatimiento con charnela CD
            porque: |
              Los lados que faltan: C₁D₁E₀F₀G₀H₀A₀B₀ es el plano en verdadera magnitud.
        pista: |
          (1) Por E₁, la perpendicular a C₁D₁; la corta en M. (2) Por E₁, perpendicular a E₁M, lleva lo
          que E₂ está por encima de C₂D₂: la distancia de M a ese punto es el radio. (3) Con centro en M,
          corta la perpendicular: E₀. (4) G y H igual; B, por la paralela a C₁D₁ que pasa por E₀.
        desarrollo: |
          En verde claro, el octógono abatido C₁D₁E₀F₀G₀H₀A₀B₀: el plano en verdadera magnitud, en un
          solo paso.

      - tipo: construir
        titulo: Por dos giros, con los ejes por C
        intro: |
          Dos giros, como el método 3 de la hoja «Plano en VM». El enunciado no fija los ejes; los
          fijamos nosotros, los dos por C. Primero, eje vertical por C: gira la planta alrededor de C₁
          hasta que CD, que es horizontal, quede de punta, con D₁ debajo de C₁; las cotas no cambian, y
          el plano queda de canto en el alzado. Después, eje de punta por C: gira ese canto alrededor de
          C₂ hasta que quede horizontal; los alejamientos no cambian, y la planta sale en verdadera
          magnitud. Este segundo giro vale hacia los dos lados. Marca D y G tras el primer giro, y G, E y
          B tras el segundo. Las dos rectas de trazo y punto de la derecha son las líneas nuevas de
          los cambios de plano: aquí no se usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Dp1
            rotulo: D₁′
            pide: D tras el primer giro, en la planta
            es: proy_planta(solucion.D_g)
            bien: |
              D₁′ está en la vertical de C₁, debajo, a 59,5 mm: lo que mide C₁D₁, porque la planta gira
              sin deformarse. El giro es de 33,7°.
            diagnosticos:
              - si: 'cerca_de(proy_planta(simetrico(solucion.D_g, respecto: C)))'
                mensaje: |
                  Has girado hacia el otro lado, 146,3°, y CD también queda de punta. Aquí el giro va
                  hacia abajo, el corto, que es el que fija este paso: hacia arriba, la
                  figura girada se mete en el alzado.
                ejemplo: 'proy_planta(simetrico(solucion.D_g, respecto: C))'
              - si: cerca_de(pie_perpendicular(figura.punto("D1"), solucion.verticalC1))
                mensaje: |
                  Has llevado D₁ en horizontal hasta la vertical de C₁: eso no es girar, es acortar. D₁
                  se mueve por un arco con centro en C₁, y conserva su distancia a él.
                ejemplo: pie_perpendicular(figura.punto("D1"), solucion.verticalC1)
              - si: '!en_recta(solucion.verticalC1)'
                mensaje: |
                  CD de punta tiene la planta perpendicular a la horizontal del papel: D₁′ está en la
                  **vertical de C₁**.
                ejemplo: 'desplaza(proy_planta(solucion.D_g), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₁, pero no a la distancia buena: con centro en C₁ y radio C₁D₁,
                  59,5 mm, el arco la corta en D₁′.
          - nombre: Gp1
            rotulo: G₁′
            pide: G tras el primer giro, en la planta
            es: proy_planta(solucion.G_g)
            bien: |
              G₁′ está a la misma distancia de C₁ que G₁, girado los mismos 33,7° que D. Toda la planta
              gira como un sólido: G₁′ es a D₁′ lo que G₁ es a D₁.
            diagnosticos:
              - si: cerca_de(figura.punto("G1"))
                mensaje: |
                  Ese es G₁, sin girar. Todos los puntos giran alrededor de C₁ el mismo ángulo que D.
                ejemplo: figura.punto("G1")
              - si: 'cerca_de(proy_planta(simetrico(solucion.G_g, respecto: C)))'
                mensaje: |
                  Has girado G hacia el otro lado. Todos los puntos giran en el mismo sentido que D,
                  hacia abajo: si no, la figura se deforma.
                ejemplo: 'proy_planta(simetrico(solucion.G_g, respecto: C))'
              - si: '!a_distancia(de: figura.punto("C1"), d: vm_planta(C, G))'
                mensaje: |
                  G se mueve por un arco con centro en C₁: G₁′ está **a la misma distancia de C₁** que G₁.
                ejemplo: 'desplaza(proy_planta(solucion.G_g), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a la buena distancia de C₁, pero no has girado el mismo ángulo que D. Un camino
                  limpio: G₁D₁ gira con la figura, así que lleva la distancia D₁G₁ desde D₁′ con el compás
                  y corta el arco.
          - nombre: Gp2
            rotulo: G₂′
            pide: G tras el primer giro, en el alzado
            es: proy_alzado(solucion.G_g)
            bien: |
              G₂′ está en la vertical de G₁′ y a la altura de G₂. C₂, los alzados de A, B, E y F, y G₂′
              quedan en una recta: el canto, a 67,4° del horizontal.
            diagnosticos:
              - si: 'cerca_de(pie_perpendicular(figura.punto("G2"), perpendicular(por: proy_planta(simetrico(solucion.G_g, respecto: C)), a: figura.segmento("B1C1"))))'
                mensaje: |
                  Ese es G₂′ con el primer giro hecho hacia el otro lado, 146,3°. CD también queda de
                  punta, pero aquí el giro es el corto, con D₁ debajo de C₁, y G₂′ va en la vertical del
                  G₁′ de ese giro.
                ejemplo: 'pie_perpendicular(figura.punto("G2"), perpendicular(por: proy_planta(simetrico(solucion.G_g, respecto: C)), a: figura.segmento("B1C1")))'
              - si: '!en_vertical_de(Gp1)'
                mensaje: |
                  G₂′ va en la **vertical de G₁′**.
                ejemplo: 'desplaza(proy_alzado(solucion.G_g), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("G2"))'
                mensaje: |
                  Con el eje vertical las cotas no cambian: G₂′ queda a la altura de G₂.
                ejemplo: 'desplaza(proy_alzado(solucion.G_g), dy: mm(8))'
              - si: siempre
                mensaje: |
                  G₂′ está en la vertical de G₁′ y a la altura de G₂.
          - nombre: Gx1
            rotulo: G₁″
            pide: G tras el segundo giro, en la planta
            es: proy_planta(solucion.G_gg)
            bien: |
              G₁″ está a la altura de G₁′, porque el giro de eje de punta no cambia los alejamientos, y
              en la vertical de G₂″: el canto girado hasta la horizontal de C₂, con radio C₂G₂′.
            diagnosticos:
              - si: cerca_de(Gp1)
                mensaje: |
                  Ese es G₁′, antes del segundo giro. Ahora el canto gira alrededor de C₂ hasta quedar
                  horizontal, y G₁′ se mueve en horizontal hasta la vertical de G₂″.
                ejemplo: proy_planta(solucion.G_g)
              - si: '!en_horizontal_de(Gp1)'
                mensaje: |
                  Con el eje de punta los alejamientos no cambian: en la planta, G₁″ se mueve **en
                  horizontal** desde G₁′.
                ejemplo: 'desplaza(proy_planta(rama(solucion.G_gg, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a la altura de G₁′, pero no en la buena vertical. En el alzado, con centro en C₂ y
                  radio C₂G₂′, lleva G₂′ hasta la horizontal de C₂: G₂″. G₁″ está en su vertical.
          - nombre: Ex1
            rotulo: E₁″
            pide: E tras el segundo giro, en la planta
            es: proy_planta(solucion.E_gg)
            bien: |
              E₁″ está a la altura de E₁′ y del mismo lado que G₁″. D₁″E₁″ mide 24,6 mm, como D₂E₂.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_gg)))
                mensaje: |
                  Ese es E girado **hacia el otro lado**. El canto gira entero alrededor de C₂: E va al
                  mismo lado que G.
                ejemplo: proy_planta(rama(solucion.E_gg, 2))
              - si: '!en_horizontal_de(proy_planta(solucion.E_g))'
                mensaje: |
                  Con el eje de punta los alejamientos no cambian: E₁″ está a la altura de E₁′, el
                  punto de E tras el primer giro.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_gg, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a la altura de E₁′, pero no en la buena vertical: la de E₂″, que es E₂′ girado
                  alrededor de C₂ hasta la horizontal de C₂.
          - nombre: Bx1
            rotulo: B₁″
            pide: B tras el segundo giro, en la planta
            es: proy_planta(solucion.B_gg)
            bien: |
              B₁″ está en la misma vertical que E₁″: tras el primer giro, E, F, A y B forman una
              horizontal de punta, y el canto los lleva juntos. C₁D₁″E₁″F₁″G₁″H₁″A₁″B₁″ es el plano en
              verdadera magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.B_gg)))
                mensaje: |
                  Ese es B girado **hacia el otro lado**: va al lado de G y E.
                ejemplo: proy_planta(rama(solucion.B_gg, 2))
              - si: '!en_horizontal_de(proy_planta(solucion.B_g))'
                mensaje: |
                  B₁″ está a la altura de B₁′: el giro de eje de punta no cambia los alejamientos.
                ejemplo: 'desplaza(proy_planta(rama(solucion.B_gg, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a la altura de B₁′, pero no en la buena vertical: la misma que E₁″, porque B₂′ y
                  E₂′ coinciden en el alzado.
        trazado:
          - proy_alzado(segmento3(C, solucion.G_g))
          - proy_planta(segmento3(C, solucion.D_gg))
          - proy_planta(segmento3(solucion.D_gg, solucion.E_gg))
          - proy_planta(segmento3(solucion.E_gg, solucion.F_gg))
          - proy_planta(segmento3(solucion.F_gg, solucion.G_gg))
          - proy_planta(segmento3(solucion.G_gg, solucion.H_gg))
          - proy_planta(segmento3(solucion.H_gg, solucion.A_gg))
          - proy_planta(segmento3(solucion.A_gg, solucion.B_gg))
          - proy_planta(segmento3(solucion.B_gg, C))
        bloques:
          - nombre: Giro de eje vertical por C
            explica: |
              El primer giro tiene el eje vertical por C, que hemos elegido nosotros: en la planta es el
              punto C₁, y C no se mueve. La planta gira alrededor de C₁ sin deformarse, 33,7°, hasta que CD,
              que es horizontal, queda de punta, con D₁′ en la vertical de C₁, debajo. Cada punto conserva
              su distancia a C₁ y, como la planta gira entera, también a D₁; y conserva su cota, así que en
              el alzado se mueve en horizontal hasta la vertical de su planta girada. Con CD de punta, todas
              las horizontales del plano lo están, y el alzado ve el plano como una recta, el canto C₂G₂′:
              es el primer paso de
              [un plano, en dos giros](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-giros).
          - nombre: Giro de eje de punta por C
            explica: |
              El segundo giro tiene el eje de punta por C, que también hemos elegido nosotros: es
              perpendicular al plano vertical, y en el alzado es el punto C₂. Ese eje es CD, que tras el
              primer giro ya está de punta, y por eso C y D no se mueven. El canto gira alrededor de C₂
              hasta quedar horizontal, sobre la horizontal de C₂: 67,4° hacia la izquierda, o 112,6° hacia
              la derecha, que también vale. Los alejamientos no cambian, así que en la planta cada punto se
              mueve en horizontal hasta la vertical de su alzado girado. Con el plano horizontal, la planta
              es el octógono en verdadera magnitud.
        construccion:
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("C1"), desplaza(proy_planta(solucion.D_g), dy: 25))'
            bloque: Giro de eje vertical por C
            porque: |
              Primer giro, de eje vertical por C. Por C₁, la vertical, larga, hacia abajo: CD de punta
              tiene la planta perpendicular a la horizontal del papel.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: figura.punto("D1"), desde: figura.punto("D1"), hasta: proy_planta(solucion.D_g))'
            bloque: Giro de eje vertical por C
            porque: |
              Con centro en C₁, en el eje, y radio C₁D₁, el arco hasta esa vertical: así CD queda de
              punta.
          - con: marca
            traza: proy_planta(solucion.D_g)
            bloque: Giro de eje vertical por C
            rotulo: D₁′
            porque: |
              D₁′, a 59,5 mm de C₁: la planta gira sin deformarse. El giro es de 33,7°.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: figura.punto("G1"), desde: figura.punto("G1"), hasta: proy_planta(solucion.D_g))'
            bloque: Giro de eje vertical por C
            porque: |
              Todos los puntos giran alrededor de C₁ el mismo ángulo. G, por su arco con centro en C₁,
              largo, hasta la vertical de C₁: dónde para G₁′ lo dice el paso siguiente.
          - con: compas
            traza: 'arco(proy_planta(solucion.D_g), por: proy_planta(solucion.G_g), desde: desplaza(proy_planta(solucion.G_g), dx: 2.31, dy: -5.54), hasta: desplaza(proy_planta(solucion.G_g), dx: -2.31, dy: 5.54))'
            bloque: Giro de eje vertical por C
            toma: segmento2(figura.punto("D1"), figura.punto("G1"))
            porque: |
              G₁′ está a la misma distancia de D₁′ que G₁ de D₁: con esa abertura, desde D₁′, se corta el
              arco.
          - con: marca
            traza: proy_planta(solucion.G_g)
            bloque: Giro de eje vertical por C
            rotulo: G₁′
            porque: |
              G₁′, G tras el primer giro: donde el arco de centro D₁′ y radio D₁G₁ corta el arco que viene de G₁.
          - con: compas
            traza: '[arco(figura.punto("C1"), por: figura.punto("E1"), desde: figura.punto("E1"), hasta: proy_planta(solucion.D_g)), arco(figura.punto("C1"), por: figura.punto("B1"), desde: figura.punto("B1"), hasta: proy_planta(solucion.D_g))]'
            bloque: Giro de eje vertical por C
            porque: |
              Lo mismo con E y con B, por sus arcos con centro en C₁, largos, hasta la vertical de C₁.
          - con: compas
            traza: 'arco(proy_planta(solucion.D_g), por: proy_planta(solucion.E_g), desde: desplaza(proy_planta(solucion.E_g), dx: -1.66, dy: -2.5), hasta: desplaza(proy_planta(solucion.E_g), dx: 1.66, dy: 2.5))'
            bloque: Giro de eje vertical por C
            toma: segmento2(figura.punto("D1"), figura.punto("E1"))
            porque: |
              E₁′, a la distancia D₁E₁ de D₁′.
          - con: marca
            traza: proy_planta(solucion.E_g)
            bloque: Giro de eje vertical por C
            rotulo: E₁′
            porque: |
              E₁′, E tras el primer giro: donde el arco de centro D₁′ y radio D₁E₁ corta el arco que viene de E₁.
          - con: compas
            traza: 'arco(proy_planta(solucion.D_g), por: proy_planta(solucion.B_g), desde: desplaza(proy_planta(solucion.B_g), dx: 5.91, dy: -1.01), hasta: desplaza(proy_planta(solucion.B_g), dx: -5.91, dy: 1.01))'
            bloque: Giro de eje vertical por C
            toma: segmento2(figura.punto("D1"), figura.punto("B1"))
            porque: |
              Y B₁′, a la distancia D₁B₁ de D₁′.
          - con: marca
            traza: proy_planta(solucion.B_g)
            bloque: Giro de eje vertical por C
            rotulo: B₁′
            porque: |
              B₁′, B tras el primer giro: donde el arco de centro D₁′ y radio D₁B₁ corta el arco que viene de B₁.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("H2"), desplaza(proy_alzado(solucion.G_g), dx: 10))'
            bloque: Giro de eje vertical por C
            porque: |
              G₂′ va a caer 14,7 mm a la derecha de H₂. Antes se prolonga hacia la derecha la arista de
              arriba del alzado, G₂H₂, que es la horizontal a la cota de G: con el eje vertical las cotas
              no cambian.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.G_g), proy_alzado(solucion.G_g))
            bloque: Giro de eje vertical por C
            porque: |
              Desde G₁′, la línea de referencia hasta esa horizontal prolongada.
          - con: marca
            traza: proy_alzado(solucion.G_g)
            bloque: Giro de eje vertical por C
            rotulo: G₂′
            porque: |
              G₂′, G tras el primer giro, en el alzado.
          - con: regla
            traza: segmento2(figura.punto("C2"), proy_alzado(solucion.G_g))
            bloque: Giro de eje vertical por C
            rotulo: canto
            porque: |
              De C₂ a G₂′, el canto: el plano tras el primer giro, de canto, a 67,4° del horizontal.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.E_g), proy_alzado(solucion.E_g))
            bloque: Giro de eje vertical por C
            porque: |
              Desde E₁′, la línea de referencia, que pasa por B₁′, hasta el canto: E₂′, donde esa vertical
              corta el canto, y B₂′ coincide con él.
          - con: marca
            traza: proy_alzado(solucion.E_g)
            bloque: Giro de eje vertical por C
            porque: |
              E₂′ ≡ B₂′, en el canto. Va sin rótulo: el suyo pisaría el rótulo B₂ de la lámina, que
              queda justo encima del punto.
          - con: compas
            traza: 'arco(figura.punto("C2"), por: proy_alzado(solucion.G_g), desde: proy_alzado(solucion.G_g), hasta: proy_alzado(solucion.G_gg))'
            bloque: Giro de eje de punta por C
            porque: |
              Segundo giro, de eje de punta por C. Con centro en C₂, en el eje, G₂′ gira hasta la
              horizontal de C₂, la línea C₂D₂. Hacia la izquierda es el giro corto; hacia la derecha
              también valdría.
          - con: marca
            traza: proy_alzado(solucion.G_gg)
            bloque: Giro de eje de punta por C
            rotulo: G₂″
            porque: |
              G₂″, donde el arco corta la horizontal C₂D₂: ahí acaba el giro de G.
          - con: compas
            traza: 'arco(figura.punto("C2"), por: proy_alzado(solucion.E_g), desde: proy_alzado(solucion.E_g), hasta: proy_alzado(solucion.E_gg))'
            bloque: Giro de eje de punta por C
            porque: |
              Lo mismo con E₂′: el canto gira entero.
          - con: marca
            traza: proy_alzado(solucion.E_gg)
            bloque: Giro de eje de punta por C
            rotulo: E₂″
            porque: |
              E₂″ ≡ B₂″, donde el arco de centro C₂ que sale de E₂′ corta la horizontal C₂D₂.
          - con: escuadra-cartabon
            traza: 'segmento2(proy_planta(solucion.G_g), desplaza(proy_planta(rama(solucion.G_gg, 1)), dx: -8))'
            bloque: Giro de eje de punta por C
            porque: |
              Los alejamientos no cambian: por G₁′, la horizontal, larga, hacia el lado del giro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.G_gg), proy_planta(solucion.G_gg))
            bloque: Giro de eje de punta por C
            porque: |
              Desde G₂″, la vertical hasta esa horizontal: G₁″ está donde se cortan. Por el camino pasa
              por H₁″, que se construye más abajo.
          - con: marca
            traza: proy_planta(solucion.G_gg)
            bloque: Giro de eje de punta por C
            porque: |
              G₁″, G tras los dos giros, donde la vertical que baja de G₂″ corta la horizontal que sale de
              G₁′. Va sin rótulo: el suyo pisaría el rótulo E₁ de la lámina, que queda encima, un poco a la
              derecha.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.E_g), desplaza(proy_planta(rama(solucion.E_gg, 1)), dx: -8)), segmento2(proy_planta(solucion.B_g), desplaza(proy_planta(rama(solucion.B_gg, 1)), dx: -8))]'
            bloque: Giro de eje de punta por C
            porque: |
              Lo mismo con E y con B: por E₁′ y por B₁′, las horizontales, largas.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.E_gg), proy_planta(solucion.E_gg))
            bloque: Giro de eje de punta por C
            porque: |
              Desde E₂″, que coincide con B₂″, la vertical hasta la horizontal de E₁′: corta la de B₁′ en
              B₁″ y para en E₁″. Por el camino pasa por A₁″ y F₁″, que se construyen después.
          - con: marca
            traza: proy_planta(solucion.E_gg)
            bloque: Giro de eje de punta por C
            rotulo: E₁″
            porque: |
              E₁″, en la vertical de E₂″ y a la altura de E₁′.
          - con: marca
            traza: proy_planta(solucion.B_gg)
            bloque: Giro de eje de punta por C
            rotulo: B₁″
            porque: |
              B₁″, en la misma vertical y a la altura de B₁′.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.D_gg), proy_planta(rama(solucion.E_gg, 1))), segmento2(proy_planta(rama(solucion.B_gg, 1)), figura.punto("C1"))]'
            bloque: Giro de eje de punta por C
            porque: |
              Los lados D₁″E₁″ y B₁″C₁, que son frontales del plano y van a servir de guía. C no se mueve
              en ningún giro, y D₁″ es D₁′, porque D está en el segundo eje.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.G_gg), proy_planta(solucion.F_gg))
            bloque: Giro de eje de punta por C
            guia: segmento2(proy_planta(solucion.D_gg), proy_planta(rama(solucion.E_gg, 1)))
            porque: |
              FG es frontal, como DE: por G₁″, la paralela a D₁″E₁″, hasta la vertical de E₂″.
          - con: marca
            traza: proy_planta(solucion.F_gg)
            bloque: Giro de eje de punta por C
            rotulo: F₁″
            porque: |
              F₁″, entre E₁″ y B₁″.
          - con: compas
            traza: 'arco(proy_planta(solucion.B_gg), por: proy_planta(solucion.A_gg), desde: desplaza(proy_planta(solucion.A_gg), dx: -6), hasta: desplaza(proy_planta(solucion.A_gg), dx: 6))'
            bloque: Giro de eje de punta por C
            toma: figura.segmento("A1B1")
            porque: |
              AB es horizontal, así que A₁B₁ ya es su verdadera magnitud: con esa abertura, desde B₁″,
              sobre la misma vertical.
          - con: marca
            traza: proy_planta(solucion.A_gg)
            bloque: Giro de eje de punta por C
            rotulo: A₁″
            porque: |
              A₁″, entre B₁″ y F₁″.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.A_gg), proy_planta(solucion.H_gg))
            bloque: Giro de eje de punta por C
            guia: segmento2(proy_planta(rama(solucion.B_gg, 1)), figura.punto("C1"))
            porque: |
              HA es frontal, como BC: por A₁″, la paralela a B₁″C₁, hasta la vertical de G₂″.
          - con: marca
            traza: proy_planta(solucion.H_gg)
            bloque: Giro de eje de punta por C
            porque: |
              H₁″, en la misma vertical que G₁″. Va sin rótulo: el suyo pisaría el rótulo G₁ de la
              lámina, que queda un poco más abajo, a la derecha.
          - con: regla
            traza: '[proy_planta(segmento3(C, solucion.D_gg)), proy_planta(segmento3(solucion.D_gg, rama(solucion.E_gg, 1))), proy_planta(segmento3(rama(solucion.E_gg, 1), rama(solucion.F_gg, 1))), proy_planta(segmento3(rama(solucion.F_gg, 1), rama(solucion.G_gg, 1))), proy_planta(segmento3(rama(solucion.G_gg, 1), rama(solucion.H_gg, 1))), proy_planta(segmento3(rama(solucion.H_gg, 1), rama(solucion.A_gg, 1))), proy_planta(segmento3(rama(solucion.A_gg, 1), rama(solucion.B_gg, 1))), proy_planta(segmento3(rama(solucion.B_gg, 1), C))]'
            bloque: Giro de eje de punta por C
            porque: |
              Repasado, el octógono de la planta es el plano en verdadera magnitud.
        pista: |
          (1) Con centro en C₁, D₁ hasta la vertical de C₁, abajo: D₁′. Los demás, el mismo ángulo:
          cada uno conserva su distancia a C₁ y a D₁. (2) Sube cada punto a su cota: el canto. (3) Con
          centro en C₂, el canto hasta la horizontal de C₂. (4) Baja cada punto a la altura de su planta
          girada.
        desarrollo: |
          En verde claro, el canto tras el primer giro y el octógono tras el segundo: el plano en
          verdadera magnitud, en la planta.

      - tipo: calcular
        titulo: El ángulo en D
        pregunta: ¿Cuánto mide de verdad el ángulo del octógono en D, entre DC y DE? Mídelo con el transportador en cualquiera de las tres construcciones.
        respuesta:
          tipo: numero
          valor: '104.36'
          receta: angulo_D
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '75.64'
            receta: angulo_rectas(recta3(D, C), recta3(D, E))
            mensaje: |
              Ese es el ángulo **agudo** entre las dos rectas, el suplementario. El del octógono en D es
              el obtuso: DE sale hacia atrás respecto de DC.
          - valor: '123.68'
            receta: 180 - angulo_rectas(recta3(D, C), recta3(D, solucion.Eh))
            mensaje: |
              Ese es el ángulo **en la planta**, entre D₁C₁ y D₁E₁. La planta deforma los ángulos de
              una figura que no es horizontal: hay que medirlo en la verdadera magnitud.
          - valor: '116.57'
            receta: 180 - angulo_rectas(recta3(D, solucion.Cf), recta3(D, E))
            mensaje: |
              Ese es el ángulo **en el alzado**, entre D₂C₂ y D₂E₂. El alzado también lo deforma: el
              plano no es frontal.
        pista: |
          En la verdadera magnitud, entre C₅D₅ y D₅E₅, o entre C₁D₁ y D₁E₀, o entre C₁D₁″ y D₁″E₁″: los
          tres tienen que dar lo mismo.
        desarrollo: |
          El ángulo de DC con DE en el espacio es de 104,36°; los tres métodos lo conservan. En la
          planta se ve de 123,68° y en el alzado, de 116,57°.

      - tipo: calcular
        titulo: La distancia de C a G
        pregunta: ¿Cuánto mide de verdad CG, la distancia entre los dos vértices más alejados? Mídela en las tres construcciones; tiene que dar lo mismo.
        respuesta:
          tipo: numero
          valor: '70.40'
          receta: CG_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '54.97'
            receta: en_mm(vm_planta(C, G))
            mensaje: |
              Eso es lo que mide **C₁G₁ en la planta**. CG sube 44 mm, y la planta lo acorta: mídelo en
              la verdadera magnitud.
          - valor: '62.20'
            receta: en_mm(vm_alzado(C, G))
            mensaje: |
              Eso es **C₂G₂ en el alzado**, que también acorta: CG se acerca mientras sube.
          - valor: '43.98'
            receta: en_mm(diferencia_de_cotas(C, G))
            mensaje: |
              Eso es lo que G está más alto que C, la **diferencia de cotas**: un cateto, no la
              distancia.
        pista: |
          C₅G₅ en la vista 5, C₁G₀ en el abatimiento o C₁G₁″ tras los giros.
        desarrollo: |
          $$ \overline{CG} = \sqrt{\overline{C_1G_1}^{\,2} + \Delta z^{2}} = \sqrt{54{,}97^{2} + 43{,}98^{2}} \approx 70{,}40 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El plano es oblicuo, así que un cambio de plano o un giro solo lo dejan de canto, y hacen falta dos; el abatimiento lo deja en verdadera magnitud de una vez.
          - texto: 'Primer cambio, vertical, con la línea nueva perpendicular a las horizontales: el plano sale de canto. Segundo, horizontal, con la línea paralela al canto: la vista 5 es la verdadera magnitud.'
          - texto: Con CD de charnela, cada vértice se abate por la perpendicular a C₁D₁, con un radio que es la hipotenusa de lo que dista en la planta y de lo que está por encima de CD.
          - texto: Con un giro de eje vertical que deja CD de punta y otro de eje de punta que deja el canto horizontal, la planta final es la verdadera magnitud.
          - texto: 'Los tres caminos dan la misma figura: el mismo ángulo en D y la misma distancia de C a G.'
          - texto: En el segundo cambio de plano, cada punto lleva otra vez su cota, contada desde la de C.
            trampa: true
            mensaje: |
              Cada cambio lleva la distancia de la vista que se deja atrás. En el segundo se deja la
              planta, y lo que se lleva es lo que la planta de cada punto distaba de la primera línea
              nueva. Con la cota otra vez, D se quedaría en la línea y la figura saldría deformada.
    resolucion: |
      **Qué plano es.** AB, CD, EF y GH tienen el alzado horizontal: son horizontales del plano, y en la
      planta van todas en la misma dirección. BC, DE, FG y HA tienen la planta horizontal: son
      frontales. Ninguna vista lo reduce a una recta: el plano es oblicuo, a 67,4° del plano
      horizontal. E, F, A y B están en la misma horizontal, 22 mm por encima de CD, y G y H, 44 mm.

      **Por dos cambios de plano.** La primera línea nueva, perpendicular a las horizontales, ve cada
      horizontal de punta: los ocho vértices caen en tres puntos, C₄ ≡ D₄ en la línea (C es la
      referencia), A₄ ≡ B₄ ≡ E₄ ≡ F₄ a 22 mm y G₄ ≡ H₄ a 44 mm, en una recta: el canto. La segunda línea,
      paralela al canto, lleva lo que la planta de cada punto distaba de la primera: D₅ a 59,5 mm, lo
      que mide C₁D₁, y los demás a lo suyo. La vista 5 es el octógono en verdadera magnitud.

      **Por abatimiento.** Con CD de charnela, E, F, A y B se abaten a 23,8 mm de ella y G y H a 47,6, todos
      al mismo lado y cada uno por la perpendicular a C₁D₁ que pasa por su planta. E₀F₀A₀B₀ y G₀H₀ salen
      paralelas a C₁D₁.

      **Por dos giros.** Con el eje vertical por C, la planta gira 33,7° hasta que D₁ queda debajo de C₁:
      CD de punta, y el alzado, de canto. Con el eje de punta por C, el canto gira hasta la horizontal
      de C₂ (112,6° hacia la derecha o 67,4° hacia la izquierda: los dos valen), y la planta queda en
      verdadera magnitud.

      **La comprobación.** Los tres caminos dan la misma figura: lados de 19,8, 24,6 y 59,5 mm, el ángulo
      en D de 104,36° y CG de 70,40 mm. En la planta ese ángulo se ve de 123,68° y en el alzado de
      116,57°, y CG de 54,97 y 62,20 mm: ninguna vista da la verdadera magnitud.

  - id: sd28-el-triangulo-equilatero-de-centro-o
    titulo: El triángulo equilátero de centro O, por los tres métodos
    fuente: Ejercicio 21 (SD28) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual (§08). Los tres métodos los impone el
    # enunciado y van en tres pasos `construir`, detrás de uno que saca O₁ y
    # D₁, que los tres necesitan; las líneas nuevas, las referencias, la
    # charnela y los ejes no los da, y se fijan en el intro de cada paso.
    enunciado: |
      Dibujar las proyecciones diédricas de un triángulo equilátero que está contenido en el plano
      ABC. Aplicar los métodos de cambio de plano, abatimientos y giros. Datos: el centro O y la
      proyección vertical del vértice D del triángulo.

      **Notas nuestras.** La figura es el triángulo ABC en el alzado, arriba, y en la planta, debajo,
      con sus vértices rotulados, y dentro del alzado las cruces de O₂ y D₂. O₂ cae justo
      en la vertical de B₂, y D₂, a la altura de C₂. La hoja no da escala: la leemos a 1:1, en
      milímetros de la lámina. Llamamos E y F a los otros dos vértices del
      triángulo equilátero: E, el de más cota, y F, el otro. «Proyección vertical» es el alzado.
    pide: O₁ y D₁, y las proyecciones de los vértices E y F del triángulo equilátero, por cambio de plano, por abatimiento y por giros, y, como pregunta nuestra, la medida real de su lado.
    receta:
      lamina: sd28
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        abc: plano(A, B, C)
        # O y D están en el plano ABC: el alzado da su planta.
        O: 'punto_en_plano(alzado: figura.punto("O2"), plano: abc)'
        D: 'punto_en_plano(alzado: figura.punto("D2"), plano: abc)'
      solucion:
        # El triángulo equilátero de centro O con un vértice en D. E es el
        # segundo de la lista, el de más cota, y F el tercero.
        tri: 'poligono_regular(abc, O, D, lados: 3)'
        E: uno(tri, 2)
        F: uno(tri, 3)
        radio: vm(O, D)
        lado: vm(D, E)
        # El error de llevar el radio como lado: los vértices del hexágono que
        # flanquean D, el del lado de E y el del lado de F.
        hex: 'poligono_regular(abc, O, D, lados: 6)'
        H2: uno(hex, 2)
        H6: uno(hex, 6)
        # ── O₁ y D₁. D está en la horizontal del plano por C (D₂ a la altura de
        # C₂), que corta AB en X; O, en la horizontal por O, que corta AB en Y.
        hC: horizontal_por(C, abc)
        hO: horizontal_por(O, abc)
        X: pie_comun(hC, recta3(A, B))
        Y: pie_comun(hO, recta3(A, B))
        Xmas: 'uno(medir_sobre(segmento2(figura.punto("C2"), proy_alzado(X)), desde: proy_alzado(X), distancia: 10), 1)'
        h1: 'segmento2(figura.punto("C1"), proy_planta(X))'
        parY: 'perpendicular(por: proy_planta(Y), a: perpendicular(por: proy_planta(Y), a: h1))'
        Omas: 'uno(medir_sobre(segmento2(proy_planta(Y), proy_planta(O)), desde: proy_planta(O), distancia: 10), 1)'
        # Los errores: la horizontal del papel por C₁ (o por Y₁) tomada por la
        # del plano, y la horizontal por C tomada para O.
        horC1: 'segmento2(figura.punto("C1"), desplaza(figura.punto("C1"), dx: 50))'
        Dhor: pie_perpendicular(proy_planta(D), horC1)
        horY1: 'segmento2(proy_planta(Y), desplaza(proy_planta(Y), dx: 50))'
        Ohor: pie_perpendicular(proy_planta(O), horY1)
        Ov: 'punto3(alzado: desplaza(figura.punto("O2"), dy: 50), planta: proy_planta(O))'
        Oy: 'punto3(alzado: figura.punto("O2"), planta: desplaza(proy_planta(O), dy: 50))'
        OenhC: corte_recta_plano(hC, plano(O, Ov, Oy))
        # ── Decisión: 1 · Dos cambios de plano, con las dos líneas nuevas de la
        # lámina, que fija el ejercicio porque el enunciado no las da. El
        # primero, vertical, perpendicular a las horizontales del plano, con A
        # de referencia, la más baja: todo cae hacia fuera. El segundo,
        # horizontal y paralelo al canto, con O de referencia, el centro.
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: A)'
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: A)'
        O_4: 'cambio_plano_vertical(O, figura.segmento("nueva1"), ref: A)'
        D_4: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: A)'
        E_4: 'cambio_plano_vertical(E, figura.segmento("nueva1"), ref: A)'
        F_4: 'cambio_plano_vertical(F, figura.segmento("nueva1"), ref: A)'
        O_5: 'cambio_plano_vertical(O, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        D_5: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        E_5: 'cambio_plano_vertical(E, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        F_5: 'cambio_plano_vertical(F, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        H2_5: 'cambio_plano_vertical(H2, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        H6_5: 'cambio_plano_vertical(H6, figura.segmento("nueva1"), ref: A, luego: figura.segmento("nueva2"), ref2: O)'
        A2h: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dx: 50))'
        A2hB: pie_perpendicular(figura.punto("B2"), A2h)
        A2hE: pie_perpendicular(proy_alzado(E), A2h)
        A2hF: pie_perpendicular(proy_alzado(F), A2h)
        A2hmas: 'uno(medir_sobre(A2h, desde: A2hE, distancia: 10), 1)'
        pieB1: 'pie_perpendicular(figura.punto("B1"), figura.segmento("nueva1"))'
        B4mas: 'uno(medir_sobre(segmento2(figura.punto("B1"), B_4), desde: B_4, distancia: 10), 1)'
        parO1: 'perpendicular(por: proy_planta(O), a: h1)'
        pieD1c: pie_perpendicular(proy_planta(D), parO1)
        pieE1c: pie_perpendicular(proy_planta(E), parO1)
        pieF1c: pie_perpendicular(proy_planta(F), parO1)
        parO1a: 'uno(medir_sobre(parO1, desde: proy_planta(O), distancia: 26), 1)'
        parO1b: 'uno(medir_sobre(parO1, desde: proy_planta(O), distancia: 34), 2)'
        pieD4: 'pie_perpendicular(D_4, figura.segmento("nueva2"))'
        pieE5: 'pie_perpendicular(E_5, figura.segmento("nueva2"))'
        pieF5: 'pie_perpendicular(F_5, figura.segmento("nueva2"))'
        pieE4: 'pie_perpendicular(E_4, figura.segmento("nueva1"))'
        pieF4: 'pie_perpendicular(F_4, figura.segmento("nueva1"))'
        perpD4n2: 'perpendicular(por: D_4, a: figura.segmento("nueva2"))'
        perpE4n1: 'perpendicular(por: E_4, a: figura.segmento("nueva1"))'
        perpF4n1: 'perpendicular(por: F_4, a: figura.segmento("nueva1"))'
        O5mas: 'uno(medir_sobre(segmento2(O_4, O_5), desde: O_5, distancia: 8), 1)'
        D5mas: 'uno(medir_sobre(segmento2(D_4, D_5), desde: D_5, distancia: 10), 1)'
        Dant5: 'uno(medir_sobre(segmento2(D_5, O_5), desde: O_5, distancia: radio), 1)'
        Dant5mas: 'uno(medir_sobre(segmento2(D_5, O_5), desde: O_5, distancia: radio + 8), 1)'
        E5fuera: 'uno(medir_sobre(segmento2(E_4, pieE5), desde: pieE5, distancia: 6), 1)'
        F5fuera: 'uno(medir_sobre(segmento2(F_4, pieF5), desde: pieF5, distancia: 6), 1)'
        E1mas: 'uno(medir_sobre(segmento2(E_4, pieE1c), desde: pieE1c, distancia: 8), 1)'
        F1mas: 'uno(medir_sobre(segmento2(F_4, pieF1c), desde: pieF1c, distancia: 8), 1)'
        E2mas: 'uno(medir_sobre(segmento2(proy_planta(E), proy_alzado(E)), desde: proy_alzado(E), distancia: 8), 1)'
        F2mas: 'uno(medir_sobre(segmento2(proy_planta(F), proy_alzado(F)), desde: proy_alzado(F), distancia: 8), 1)'
        # Lo que la planta de D, E y F está más lejos (o más cerca) de la
        # primera línea nueva que O₁: su distancia a la paralela por O₁.
        dOD: 'vm_planta(D, punto_en_plano(planta: pieD1c, plano: abc))'
        dE: 'vm_planta(E, punto_en_plano(planta: pieE1c, plano: abc))'
        dF: 'vm_planta(F, punto_en_plano(planta: pieF1c, plano: abc))'
        vertE: 'segmento2(proy_planta(E), proy_alzado(E))'
        vertF: 'segmento2(proy_planta(F), proy_alzado(F))'
        # ── Decisión: 2 · Abatimiento sobre el plano horizontal de B, con la
        # horizontal por B de charnela, que fija el ejercicio. La horizontal por
        # C, que pasa por D, dejaría O a 3 mm de la charnela, con un radio de 3
        # mm. O se abate a cualquiera de los dos lados (una elección) y los
        # demás con el mismo giro; la rama 1 cae debajo de la planta.
        hB: horizontal_por(B, abc)
        O_ab: abatido_a_elegir(O, hB, abc)
        D_ab: 'abatido_junto(D, hB, abc, con: O_ab, de: O)'
        E_ab: 'abatido_junto(E, hB, abc, con: O_ab, de: O)'
        F_ab: 'abatido_junto(F, hB, abc, con: O_ab, de: O)'
        H2_ab: 'abatido_junto(H2, hB, abc, con: O_ab, de: O)'
        H6_ab: 'abatido_junto(H6, hB, abc, con: O_ab, de: O)'
        MO: pie_perpendicular(O, hB)
        MD: pie_perpendicular(D, hB)
        # Los triángulos de los radios, rectángulos en el pie: sobre la
        # charnela, desde M, lo que el punto está más bajo que B.
        TO: 'uno(medir_sobre(proy_planta(hB), desde: proy_planta(MO), distancia: diferencia_de_cotas(O, B)), 1)'
        TD: 'uno(medir_sobre(proy_planta(hB), desde: proy_planta(MD), distancia: diferencia_de_cotas(D, B)), 1)'
        # La afinidad: DE corta la charnela en K, y OF en L. Son puntos de la
        # charnela, y no se mueven.
        K: pie_comun(recta3(D, E), hB)
        L: pie_comun(recta3(O, F), hB)
        chA: 'uno(medir_sobre(proy_planta(hB), desde: proy_planta(K), distancia: 10), 2)'
        chB: 'uno(medir_sobre(proy_planta(hB), desde: TD, distancia: 10), 1)'
        B2h: 'segmento2(figura.punto("B2"), desplaza(figura.punto("B2"), dx: 50))'
        B2hD: pie_perpendicular(figura.punto("D2"), B2h)
        B2hA: 'uno(medir_sobre(B2h, desde: proy_alzado(K), distancia: 10), 2)'
        B2hB: 'uno(medir_sobre(B2h, desde: proy_alzado(L), distancia: 10), 1)'
        perpO1: 'perpendicular(por: proy_planta(O), a: proy_planta(hB))'
        perpD1: 'perpendicular(por: proy_planta(D), a: proy_planta(hB))'
        perpE1: 'perpendicular(por: proy_planta(E), a: proy_planta(hB))'
        perpF1: 'perpendicular(por: proy_planta(F), a: proy_planta(hB))'
        O0mas1: 'uno(medir_sobre(segmento2(proy_planta(MO), proy_planta(rama(O_ab, 1))), desde: proy_planta(rama(O_ab, 1)), distancia: 6), 1)'
        O0mas2: 'uno(medir_sobre(segmento2(proy_planta(MO), proy_planta(rama(O_ab, 2))), desde: proy_planta(rama(O_ab, 2)), distancia: 6), 1)'
        D0mas1: 'uno(medir_sobre(segmento2(proy_planta(MD), proy_planta(rama(D_ab, 1))), desde: proy_planta(rama(D_ab, 1)), distancia: 6), 1)'
        D0mas2: 'uno(medir_sobre(segmento2(proy_planta(MD), proy_planta(rama(D_ab, 2))), desde: proy_planta(rama(D_ab, 2)), distancia: 6), 1)'
        # Los dos errores del radio de O, y el de la cota sola para D.
        Ocat: 'uno(medir_sobre(segmento2(proy_planta(MO), proy_planta(O_ab)), desde: proy_planta(MO), distancia: diferencia_de_cotas(O, B)), 1)'
        Oplanta: 'uno(medir_sobre(segmento2(proy_planta(MO), proy_planta(O_ab)), desde: proy_planta(MO), distancia: vm_planta(O, MO)), 1)'
        Dcat: 'uno(medir_sobre(segmento2(proy_planta(MD), proy_planta(D_ab)), desde: proy_planta(MD), distancia: diferencia_de_cotas(D, B)), 1)'
        Dant0: 'uno(medir_sobre(segmento2(proy_planta(rama(D_ab, 1)), proy_planta(rama(O_ab, 1))), desde: proy_planta(rama(O_ab, 1)), distancia: radio), 1)'
        Dant0mas: 'uno(medir_sobre(segmento2(proy_planta(rama(D_ab, 1)), proy_planta(rama(O_ab, 1))), desde: proy_planta(rama(O_ab, 1)), distancia: radio + 8), 1)'
        Kmas: 'uno(medir_sobre(segmento2(proy_planta(rama(D_ab, 1)), proy_planta(K)), desde: proy_planta(K), distancia: 6), 1)'
        Lmas: 'uno(medir_sobre(segmento2(proy_planta(rama(F_ab, 1)), proy_planta(L)), desde: proy_planta(L), distancia: 6), 1)'
        F1masL: 'uno(medir_sobre(segmento2(proy_planta(L), proy_planta(F)), desde: proy_planta(F), distancia: 8), 1)'
        F2masL: 'uno(medir_sobre(segmento2(proy_alzado(L), proy_alzado(F)), desde: proy_alzado(F), distancia: 8), 1)'
        # ── Decisión: 3 · Dos giros. El primero, de eje vertical por C, lo justo
        # para que la horizontal por C quede de punta, con D₁′ debajo de C₁: el
        # giro corto, de 57,5°. El otro sentido, 122,5°, también la deja de
        # punta, pero mete la figura en el alzado, y se fija el corto.
        Cv: 'punto3(alzado: desplaza(figura.punto("C2"), dy: 50), planta: figura.punto("C1"))'
        Cp: 'punto3(alzado: figura.punto("C2"), planta: desplaza(figura.punto("C1"), dy: 50))'
        vertical: recta3(C, Cv)
        punta: recta3(C, Cp)
        giro1: angulo_rectas(hC, punta)
        A_g: 'rama(gira(A, vertical, angulo: giro1), 1)'
        B_g: 'rama(gira(B, vertical, angulo: giro1), 1)'
        O_g: 'rama(gira(O, vertical, angulo: giro1), 1)'
        D_g: 'rama(gira(D, vertical, angulo: giro1), 1)'
        E_g: 'rama(gira(E, vertical, angulo: giro1), 1)'
        F_g: 'rama(gira(F, vertical, angulo: giro1), 1)'
        H2_g: 'rama(gira(H2, vertical, angulo: giro1), 1)'
        H6_g: 'rama(gira(H6, vertical, angulo: giro1), 1)'
        # Decisión: el segundo, de eje de punta por A′ (A tras el primer giro),
        # lleva el canto hasta el plano horizontal de A, el más bajo. Es abatir
        # ese plano de canto con la recta de punta por A′ de charnela, y
        # abatido_a_elegir da los dos sentidos, que valen los dos (una
        # elección); la rama 1 gira hacia la derecha. Con el eje por C, O, a 3
        # mm de él, y D, casi encima, apenas se moverían.
        A_gp: 'punto3(alzado: proy_alzado(A_g), planta: desplaza(proy_planta(A_g), dy: -50))'
        puntaA: recta3(A_g, A_gp)
        canto: plano(A_g, B_g, C)
        O_gg: abatido_a_elegir(O_g, puntaA, canto)
        D_gg: 'abatido_junto(D_g, puntaA, canto, con: O_gg, de: O_g)'
        E_gg: 'abatido_junto(E_g, puntaA, canto, con: O_gg, de: O_g)'
        F_gg: 'abatido_junto(F_g, puntaA, canto, con: O_gg, de: O_g)'
        H2_gg: 'abatido_junto(H2_g, puntaA, canto, con: O_gg, de: O_g)'
        H6_gg: 'abatido_junto(H6_g, puntaA, canto, con: O_gg, de: O_g)'
        verticalC1: 'perpendicular(por: figura.punto("C1"), a: horC1)'
        D1pmas: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(D_g)), desde: proy_planta(D_g), distancia: 10), 1)'
        Dotro: 'proy_planta(simetrico(D_g, respecto: C))'
        Ootro: 'proy_planta(simetrico(O_g, respecto: C))'
        Dcorto: pie_perpendicular(proy_planta(D), verticalC1)
        A2gmas: 'uno(medir_sobre(A2h, desde: proy_alzado(rama(E_gg, 1)), distancia: 10), 1)'
        O2h: 'segmento2(figura.punto("O2"), desplaza(figura.punto("O2"), dx: 50))'
        O2hmas: 'uno(medir_sobre(O2h, desde: proy_alzado(O_g), distancia: 8), 1)'
        cantomas: 'uno(medir_sobre(segmento2(proy_alzado(A_g), figura.punto("C2")), desde: proy_alzado(E_g), distancia: 10), 1)'
        O1h: 'segmento2(proy_planta(O_g), desplaza(proy_planta(O_g), dx: 50))'
        D1h: 'segmento2(proy_planta(D_g), desplaza(proy_planta(D_g), dx: 50))'
        O1ppmas: 'uno(medir_sobre(O1h, desde: proy_planta(rama(O_gg, 1)), distancia: 8), 1)'
        D1ppmas: 'uno(medir_sobre(D1h, desde: proy_planta(rama(D_gg, 1)), distancia: 8), 1)'
        Dantg: 'uno(medir_sobre(segmento2(proy_planta(rama(D_gg, 1)), proy_planta(rama(O_gg, 1))), desde: proy_planta(rama(O_gg, 1)), distancia: radio), 1)'
        Dantgmas: 'uno(medir_sobre(segmento2(proy_planta(rama(D_gg, 1)), proy_planta(rama(O_gg, 1))), desde: proy_planta(rama(O_gg, 1)), distancia: radio + 8), 1)'
        E1h: 'segmento2(proy_planta(rama(E_gg, 1)), proy_planta(E_g))'
        F1h: 'segmento2(proy_planta(rama(F_gg, 1)), proy_planta(F_g))'
        E1pmas: 'uno(medir_sobre(E1h, desde: proy_planta(E_g), distancia: 8), 1)'
        F1pmas: 'uno(medir_sobre(F1h, desde: proy_planta(F_g), distancia: 8), 1)'
        E2h: 'segmento2(proy_alzado(E_g), proy_alzado(E))'
        F2h: 'segmento2(proy_alzado(F_g), proy_alzado(F))'
        E2hmas: 'uno(medir_sobre(E2h, desde: proy_alzado(E), distancia: 8), 1)'
        F2hmas: 'uno(medir_sobre(F2h, desde: proy_alzado(F), distancia: 8), 1)'
        lado_mm: en_mm(lado)
      comprueba:
        - en_plano(O, abc)
        - en_plano(D, abc)
        # D está, al redondeo de la hoja, en la horizontal del plano por C.
        - en_recta(D, hC)
        - en_plano(E, abc)
        - en_plano(F, abc)
    pasos:
      - tipo: reconocer
        pregunta: Del vértice D solo se da el alzado, y de O, también. ¿Cómo se sabe dónde están sus plantas?
        opciones:
          - texto: Están en el plano ABC, así que cada una sale de una recta del plano que pase por el punto
            correcta: true
            mensaje: |
              Eso es. Un punto de un plano se sitúa con una recta del plano que pase por él, como en el
              tema 2. Aquí sirven las horizontales: D₂ está a la altura de C₂, así que D está en la
              horizontal por C, y la de O corta A₂B₂ en un punto que se baja a A₁B₁.
          - texto: No se sabe; al enunciado le falta la planta de los dos puntos, y habría que pedirla antes de empezar a construir
            mensaje: |
              No le falta. El enunciado dice que el triángulo está en el plano ABC, y su centro y su
              vértice también. De un punto de un plano basta una proyección: la otra la da el plano.
          - texto: En la vertical de cada alzado, a la misma distancia de A₁ que su alzado de A₂, porque el plano se proyecta igual en las dos vistas
            mensaje: |
              El alzado y la planta no se corresponden así: la planta del plano no es el alzado
              trasladado. Hay que pasar por una recta del plano que contenga el punto, y llevarla de una
              vista a la otra.

      - tipo: construir
        titulo: O₁ y D₁, con horizontales del plano
        intro: |
          Antes de cualquier método hacen falta las plantas de O y de D, que están en el plano ABC. D₂
          está a la altura de C₂: D está en la horizontal del plano por C. Esa horizontal corta A₂B₂ en
          un punto, X, que se baja a A₁B₁; h₁ va de C₁ a X₁. Para O, la horizontal por O₂, que corta
          A₂B₂ en Y, y su planta, paralela a h₁ por Y₁: las horizontales de un plano son paralelas en
          la planta. Junto a O₁, la vertical de O₂ corta h₁: amplía con la lupa antes de marcarlo. Marca
          D₁ y O₁. Las rectas de trazo y punto de la izquierda son las líneas nuevas del cambio de plano:
          aquí no se usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: D1
            pide: la planta de D, el vértice dado
            es: proy_planta(D)
            bien: |
              D₁ está en h₁, la planta de la horizontal del plano por C, en la vertical de D₂.
            diagnosticos:
              - si: cerca_de(solucion.Dhor)
                mensaje: |
                  Has tomado la horizontal **del papel** por C₁. La horizontal del plano no es horizontal en
                  la planta: lo es en el alzado. Su planta sale de un segundo punto que tenga la cota de C:
                  X, donde la horizontal de C₂ corta A₂B₂, bajado a A₁B₁.
                ejemplo: solucion.Dhor
              - si: '!en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  D₁ va en la **vertical de D₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(D), dx: mm(6))'
              - si: '!en_recta(solucion.h1)'
                mensaje: |
                  Estás en la vertical de D₂, pero no en h₁. D está en la horizontal del plano por C, así
                  que D₁ está en su planta, la recta de C₁ a X₁.
                ejemplo: 'desplaza(proy_planta(D), dy: mm(6))'
              - si: siempre
                mensaje: |
                  D₁ está donde la vertical de D₂ corta h₁, la recta que une C₁ con X₁.
          - nombre: O1
            pide: la planta de O, el centro
            es: proy_planta(O)
            bien: |
              O₁ está en la paralela a h₁ que pasa por Y₁, en la vertical de O₂, que es también la de B₂.
            diagnosticos:
              - si: cerca_de(solucion.Ohor)
                mensaje: |
                  Has bajado Y a A₁B₁ y te has ido por la horizontal **del papel**. La planta de la
                  horizontal de O no es horizontal: es paralela a h₁, porque todas las horizontales de un
                  plano lo son en la planta.
                ejemplo: solucion.Ohor
              - si: cerca_de(proy_planta(solucion.OenhC))
                mensaje: |
                  Ese punto está en h₁, la horizontal por C, y O no tiene la cota de C: O₂ está más alto que
                  C₂. Hace falta la horizontal por O, la de O₂, y su planta por Y₁.
                ejemplo: proy_planta(solucion.OenhC)
              - si: '!en_vertical_de(figura.punto("O2"))'
                mensaje: |
                  O₁ va en la **vertical de O₂**, que pasa también por B₂ y B₁.
                ejemplo: 'desplaza(proy_planta(O), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de O₂, pero no en la planta de la horizontal de O: la paralela a h₁ que
                  pasa por Y₁.
        trazado:
          - segmento2(figura.punto("C1"), proy_planta(solucion.X))
          - segmento2(proy_planta(solucion.Y), proy_planta(O))
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.Xmas)
            porque: |
              En el alzado, la **horizontal por C₂**, hacia la izquierda hasta pasar A₂B₂. Pasa por D₂, que
              está a su altura: D está en la horizontal del plano por C.
          - con: marca
            traza: proy_alzado(solucion.X)
            porque: |
              X₂, donde la horizontal de C₂ corta A₂B₂: X es el punto de AB que tiene la cota de C.
              Va sin rótulo: el punto Y₂, que se marca después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X), proy_planta(solucion.X))
            porque: |
              Por X₂, la vertical hasta A₁B₁: X está en AB, y su planta, en A₁B₁.
          - con: marca
            traza: proy_planta(solucion.X)
            porque: |
              X₁, donde la vertical de X₂ corta A₁B₁. Va sin rótulo, como X₂: el suyo y el de Y₁, que
              se marca después, se pisarían.
          - con: regla
            traza: segmento2(figura.punto("C1"), proy_planta(solucion.X))
            rotulo: h₁
            porque: |
              h₁, la planta de la horizontal por C: de C₁ a X₁. No es horizontal en el papel; en el alzado
              sí lo es.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), proy_planta(D))
            porque: |
              Por D₂, la vertical hasta h₁: D está en la horizontal por C, y su planta, en h₁.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta h₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_alzado(solucion.Y))
            porque: |
              En el alzado, la **horizontal por O₂**, hacia la izquierda hasta A₂B₂: la horizontal del plano
              por O.
          - con: marca
            traza: proy_alzado(solucion.Y)
            rotulo: Y₂
            porque: |
              Y₂, donde esa horizontal corta A₂B₂: Y es el punto de AB con la cota de O.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Y), proy_planta(solucion.Y))
            porque: |
              Por Y₂, la vertical hasta A₁B₁: Y está en AB, y su planta, en A₁B₁.
          - con: marca
            traza: proy_planta(solucion.Y)
            rotulo: Y₁
            porque: |
              Y₁, donde la vertical de Y₂ corta A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Y), solucion.Omas)
            guia: solucion.h1
            porque: |
              Por Y₁, la **paralela a h₁**, larga: las horizontales de un plano son paralelas en la planta,
              y esta es la planta de la horizontal por O.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_planta(O))
            porque: |
              Por O₂, la vertical hasta esa paralela. Es la misma vertical que la de B₂ y B₁: O₂ está justo
              debajo de B₂.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, donde la vertical de O₂ corta la planta de la horizontal por O.
        pista: |
          (1) La horizontal por C₂ pasa por D₂ y corta A₂B₂ en X₂; baja X a A₁B₁. (2) h₁ = C₁X₁, y D₁ en la
          vertical de D₂. (3) La horizontal por O₂ corta A₂B₂ en Y₂; baja Y a A₁B₁. (4) Por Y₁, la paralela
          a h₁; O₁, en la vertical de O₂.
        desarrollo: |
          En verde claro, las dos horizontales en la planta: h₁, con D₁, y su paralela por Y₁, con O₁.

      - tipo: construir
        titulo: Por dos cambios de plano
        intro: |
          Empieza por O₁ y D₁, como en el paso anterior. Después, dos cambios, como el método 1 de la hoja
          «Plano en VM». El enunciado impone el método, pero no dice dónde van las líneas nuevas ni qué
          referencias se toman: lo hemos fijado nosotros. Las dos líneas ya están dibujadas, de trazo y
          punto, a la izquierda de la planta. La primera es perpendicular a las horizontales del plano, y
          su referencia es A, el punto más bajo: con un cambio vertical, que lleva cotas, el plano sale de
          canto en la vista 4. La segunda es paralela a ese canto, y su referencia es O, el centro: con un
          cambio horizontal, que lleva lo que la planta de cada punto distaba de la primera línea nueva,
          la vista 5 es la verdadera magnitud. Ahí se dibuja el triángulo, y se vuelve por el mismo
          camino. En la vista 5 la cota crece en el sentido del canto, de A₄ a B₄, que en esta hoja es
          hacia abajo: E, el vértice de más cota, es el de abajo. Junto a F₁ y F₂ pasa la vertical de Y₂:
          amplía con la lupa antes de marcarlos. Marca D₅, E₅ y F₅, y E y F de vuelta en la planta y en el
          alzado.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: D5
            pide: el vértice D, en la vista 5
            es: solucion.D_5
            bien: |
              D₅ está en la perpendicular a la segunda línea nueva que pasa por D₄, a 14,4 mm por fuera: lo
              que D₁ está más lejos de la primera línea nueva que O₁.
            diagnosticos:
              - si: cerca_de(solucion.pieD4)
                mensaje: |
                  Te has quedado en la segunda línea nueva. Ahí cae O, la referencia del segundo cambio, y D
                  no está tan cerca de la primera línea nueva como O: D₁ está más lejos.
                ejemplo: solucion.pieD4
              - si: 'cerca_de(uno(medir_sobre(solucion.perpD4n2, desde: solucion.pieD4, distancia: solucion.dOD), 2))'
                mensaje: |
                  La distancia es la buena, pero hacia el canto. D₁ está **más lejos** de la primera línea
                  nueva que O₁, así que D₅ se aparta de la segunda hacia fuera, lejos del canto.
                ejemplo: 'uno(medir_sobre(solucion.perpD4n2, desde: solucion.pieD4, distancia: solucion.dOD), 2)'
              - si: 'en_recta(solucion.perpD4n2) && a_distancia(de: solucion.pieD4, d: diferencia_de_cotas(D, O))'
                mensaje: |
                  Has llevado otra vez **la cota**: lo que D está más bajo que O. En el segundo cambio se lleva
                  la distancia de la vista que se deja atrás, la planta: lo que D₁ está más lejos de la
                  primera línea nueva que O₁, medido hasta la paralela por O₁.
                ejemplo: 'uno(medir_sobre(solucion.perpD4n2, desde: solucion.pieD4, distancia: diferencia_de_cotas(D, O)), 1)'
              - si: '!en_recta(solucion.perpD4n2)'
                mensaje: |
                  D₅ sale de D₄ por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.D_5, dx: mm(2), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: lo que D₁ está más lejos de
                  la primera línea nueva que O₁, que es el trozo de D₁ a la paralela por O₁.
          - nombre: E5
            pide: el vértice E, el de más cota, en la vista 5
            es: solucion.E_5
            bien: |
              E₅ está en la circunferencia de centro O₅ que pasa por D₅, a 120° de D₅: donde la corta el arco
              con centro en el punto opuesto a D₅ y radio O₅D₅. Es el de abajo, porque en la vista 5 la cota
              crece hacia abajo.
            diagnosticos:
              - si: cerca_de(solucion.F_5)
                mensaje: |
                  Ese es F₅, el de menos cota. En la vista 5 la cota crece en el sentido del canto, de A₄ a B₄,
                  hacia abajo de la hoja: E₅ es el vértice nuevo de abajo.
                ejemplo: solucion.F_5
              - si: cerca_de(solucion.H2_5)
                mensaje: |
                  Has llevado el radio sobre la circunferencia desde D₅: así salen los vértices del hexágono,
                  a 60°. Los del triángulo están a 120°, a dos pasos; o, de una vez, con el arco de centro en
                  el punto opuesto a D₅ y radio O₅D₅.
                ejemplo: solucion.H2_5
              - si: '!a_distancia(de: solucion.O_5, d: solucion.radio)'
                mensaje: |
                  E₅ está en la **circunferencia de centro O₅ que pasa por D₅**: los tres vértices de un
                  triángulo equilátero equidistan de su centro.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.O_5, solucion.E_5), desde: solucion.E_5, distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 120° de D₅. Prolonga D₅O₅ hasta el otro lado de la
                  circunferencia; con centro ahí y radio O₅D₅, el arco la corta en E₅ y en F₅.
          - nombre: F5
            pide: el vértice F, el otro, en la vista 5
            es: solucion.F_5
            bien: |
              F₅ es el otro corte del arco con la circunferencia. D₅E₅F₅ es el triángulo en verdadera
              magnitud: lados de 25,5 mm.
            diagnosticos:
              - si: cerca_de(solucion.H6_5)
                mensaje: |
                  Ese es un vértice del hexágono, a 60° de D₅: el radio llevado una vez. El de triángulo está
                  a 120°.
                ejemplo: solucion.H6_5
              - si: '!a_distancia(de: solucion.O_5, d: solucion.radio)'
                mensaje: |
                  F₅ está en la **circunferencia de centro O₅ que pasa por D₅**.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.O_5, solucion.F_5), desde: solucion.F_5, distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 120° de D₅: F₅ es el otro corte del arco de centro en
                  el punto opuesto a D₅.
          - nombre: E1
            pide: el vértice E, de vuelta en la planta
            es: proy_planta(E)
            bien: |
              E₁ está en la perpendicular a la primera línea nueva que pasa por E₄, y más cerca de ella que la
              paralela por O₁, lo que E₅ estaba hacia dentro de la segunda línea nueva.
            diagnosticos:
              - si: cerca_de(proy_planta(F))
                mensaje: |
                  Ese es F₁. E es el de más cota, el que en la vista 5 queda abajo.
                ejemplo: proy_planta(F)
              - si: cerca_de(solucion.pieE1c)
                mensaje: |
                  Te has quedado en la paralela por O₁, como si E estuviera tan lejos de la primera línea
                  nueva como O. E₅ no está en la segunda línea nueva: se aparta de ella hacia dentro, y E₁
                  queda más cerca de la primera línea que O₁, lo que mide ese apartamiento.
                ejemplo: solucion.pieE1c
              - si: 'cerca_de(uno(medir_sobre(solucion.perpE4n1, desde: solucion.pieE1c, distancia: solucion.dE), 2))'
                mensaje: |
                  La distancia es la buena, pero hacia el otro lado de la paralela. E₅ está hacia dentro de la
                  segunda línea nueva, hacia el canto: E₁ queda entre la paralela por O₁ y la primera línea
                  nueva.
                ejemplo: 'uno(medir_sobre(solucion.perpE4n1, desde: solucion.pieE1c, distancia: solucion.dE), 2)'
              - si: '!en_recta(solucion.perpE4n1)'
                mensaje: |
                  De E₅, la perpendicular a la segunda línea nueva hasta el canto, E₄; de E₄, la
                  **perpendicular a la primera línea nueva**, hacia la planta. E₁ está en ella.
                ejemplo: 'desplaza(proy_planta(E), dx: mm(3), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de E₄, pero no a la distancia buena: desde la paralela por
                  O₁, hacia la primera línea nueva, lo que E₅ dista de la segunda.
          - nombre: F1
            pide: el vértice F, de vuelta en la planta
            es: proy_planta(F)
            bien: |
              F₁ está en la perpendicular a la primera línea nueva que pasa por F₄, más cerca de ella que la
              paralela por O₁, lo que F₅ estaba hacia dentro de la segunda línea.
            diagnosticos:
              - si: cerca_de(solucion.pieF1c)
                mensaje: |
                  Te has quedado en la paralela por O₁. F₅ se aparta de la segunda línea nueva hacia dentro, y
                  F₁ queda más cerca de la primera línea que O₁, lo que mide ese apartamiento.
                ejemplo: solucion.pieF1c
              - si: '!en_recta(solucion.perpF4n1)'
                mensaje: |
                  De F₅, la perpendicular a la segunda línea nueva hasta el canto, F₄; de F₄, la
                  **perpendicular a la primera línea nueva**. F₁ está en ella.
                ejemplo: 'desplaza(proy_planta(F), dx: mm(3), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de F₄, pero no a la distancia buena: desde la paralela por
                  O₁, hacia la primera línea nueva, lo que F₅ dista de la segunda.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la vertical de E₁, por encima de la horizontal de A₂ lo que E₄ dista de la primera
              línea nueva: la cota de E sobre la de A, que es lo que llevaba la vista 4.
            diagnosticos:
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(6))'
              - si: 'cerca_de(uno(medir_sobre(solucion.vertE, desde: solucion.A2hE, distancia: diferencia_de_cotas(E, A)), 2))'
                mensaje: |
                  La distancia es la buena, pero hacia abajo. E₄ está fuera de la primera línea nueva, del lado
                  contrario a la planta: E es **más alto** que A, y E₂ queda por encima de la horizontal de A₂.
                ejemplo: 'uno(medir_sobre(solucion.vertE, desde: solucion.A2hE, distancia: diferencia_de_cotas(E, A)), 2)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de E₁, pero no a la altura buena: por encima de la horizontal de A₂, lo
                  que E₄ dista de la primera línea nueva.
          - nombre: F2
            pide: el vértice F, en el alzado
            es: proy_alzado(F)
            bien: |
              F₂ está en la vertical de F₁, por encima de la horizontal de A₂ lo que F₄ dista de la primera
              línea nueva. D₂E₂F₂ es el alzado del triángulo.
            diagnosticos:
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(proy_alzado(F), dx: mm(6))'
              - si: 'cerca_de(uno(medir_sobre(solucion.vertF, desde: solucion.A2hF, distancia: diferencia_de_cotas(F, A)), 2))'
                mensaje: |
                  Hacia abajo, no: F es más alto que A, como todo el triángulo, y F₂ queda por encima de la
                  horizontal de A₂.
                ejemplo: 'uno(medir_sobre(solucion.vertF, desde: solucion.A2hF, distancia: diferencia_de_cotas(F, A)), 2)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de F₁, pero no a la altura buena: por encima de la horizontal de A₂, lo
                  que F₄ dista de la primera línea nueva.
        trazado:
          - segmento2(solucion.A_4, solucion.B_4)
          - segmento2(solucion.D_5, solucion.E_5)
          - segmento2(solucion.E_5, solucion.F_5)
          - segmento2(solucion.F_5, solucion.D_5)
          - segmento2(proy_planta(D), proy_planta(E))
          - segmento2(proy_planta(E), proy_planta(F))
          - segmento2(proy_planta(F), proy_planta(D))
          - segmento2(figura.punto("D2"), proy_alzado(E))
          - segmento2(proy_alzado(E), proy_alzado(F))
          - segmento2(proy_alzado(F), figura.punto("D2"))
        bloques:
          - nombre: 1.er cambio de plano
            explica: |
              Es un cambio vertical: la planta se queda, y el plano vertical se cambia por otro
              perpendicular a las horizontales del plano ABC. Por eso la primera línea nueva, que hemos
              fijado nosotros, va perpendicular a h₁: la vista 4 ve las horizontales de punta, y el plano
              entero como una recta, el canto A₄B₄. Cada punto conserva su cota, contada desde la de A, la
              referencia, que es el punto más bajo y cae en la línea: los demás se apartan de ella, hacia el
              lado contrario a la planta, lo que están más altos que A. O y D están en el plano, y caen en
              el canto sin medir nada. A la vuelta, este cambio se deshace el último: lo que E₄ y F₄ distan
              de la primera línea es su cota sobre A, y se lleva desde la horizontal de A₂ hacia arriba.
          - nombre: 2.º cambio de plano
            explica: |
              Es un cambio horizontal: la vista 4 se queda, y la planta se cambia por una vista desde un
              plano paralelo a ABC. Por eso la segunda línea nueva va paralela al canto, y en la vista 5 el
              plano está en verdadera magnitud: ahí se dibuja el triángulo, en la circunferencia de centro
              O₅ que pasa por D₅. Cada punto lleva la distancia de la vista que se deja, la planta, contada
              desde O, la referencia que hemos elegido para este cambio: lo que su planta está más lejos, o
              más cerca, de la primera línea nueva que O₁, que es su distancia a la paralela por O₁. D₁ está
              más lejos, y D₅ cae 14,4 mm fuera de la segunda línea; E₅ y F₅ caen hacia el canto, y por eso
              E₁ y F₁ quedarán más cerca de la primera línea que O₁. A la vuelta, este cambio se deshace el
              primero y devuelve la planta: E y F van al canto, y de ahí bajan por las perpendiculares a la
              primera línea, hasta quedar desde la paralela por O₁ lo que se apartaban de la segunda.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.Xmas)
            porque: |
              Primero, O₁ y D₁, como en el paso anterior. La horizontal por C₂, hasta pasar A₂B₂: pasa por
              D₂, así que D está en la horizontal del plano por C.
          - con: marca
            traza: proy_alzado(solucion.X)
            porque: |
              X₂, donde la horizontal de C₂ corta A₂B₂: el punto de AB con la cota de C. Va sin
              rótulo: el punto Y₂, que se marca después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X), proy_planta(solucion.X))
            porque: |
              Por X₂, la vertical hasta A₁B₁, porque X está en AB.
          - con: marca
            traza: proy_planta(solucion.X)
            porque: |
              X₁, donde la vertical de X₂ corta A₁B₁. Va sin rótulo, como X₂: el suyo y el de Y₁, que
              se marca después, se pisarían.
          - con: regla
            traza: segmento2(figura.punto("C1"), proy_planta(solucion.X))
            rotulo: h₁
            porque: |
              h₁, la planta de la horizontal por C, de C₁ a X₁: da la dirección de todas las horizontales del
              plano en la planta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), proy_planta(D))
            porque: |
              Por D₂, la vertical hasta h₁: D está en la horizontal por C.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta h₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_alzado(solucion.Y))
            porque: |
              La horizontal por O₂, hacia la izquierda hasta A₂B₂: la horizontal del plano por O.
          - con: marca
            traza: proy_alzado(solucion.Y)
            rotulo: Y₂
            porque: |
              Y₂, donde la horizontal de O₂ corta A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Y), proy_planta(solucion.Y))
            porque: |
              Por Y₂, la vertical hasta A₁B₁, porque Y está en AB.
          - con: marca
            traza: proy_planta(solucion.Y)
            rotulo: Y₁
            porque: |
              Y₁, donde la vertical de Y₂ corta A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Y), solucion.Omas)
            guia: solucion.h1
            porque: |
              Por Y₁, la paralela a h₁: en la planta, las horizontales de un plano son paralelas.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_planta(O))
            porque: |
              Por O₂, la vertical hasta esa paralela, que es también la vertical de B₂.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, donde la vertical de O₂ corta la planta de la horizontal por O.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.A_4)
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Primer cambio. Por A₁, la **perpendicular a la primera línea nueva**, hasta ella: A es la
              referencia, y su proyección nueva cae en la línea.
          - con: marca
            traza: solucion.A_4
            bloque: 1.er cambio de plano
            rotulo: A₄
            porque: |
              A₄, el pie de esa perpendicular: A, la referencia, en la línea nueva.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.A2hmas)
            bloque: 1.er cambio de plano
            porque: |
              En el alzado, la **horizontal de A₂**, hacia la derecha, larga: las cotas del primer cambio se
              cuentan desde la de A, la referencia.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.B4mas)
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por B₁, la perpendicular a la primera línea nueva, larga, más allá de ella: B es el punto más
              alto, y da el canto con precisión.
          - con: compas
            traza: 'arco(solucion.pieB1, por: solucion.B_4, desde: desplaza(solucion.B_4, dx: -3.23, dy: -5.06), hasta: desplaza(solucion.B_4, dx: 3.23, dy: 5.06))'
            bloque: 1.er cambio de plano
            toma: segmento2(figura.punto("B2"), solucion.A2hB)
            porque: |
              Con el compás, en el alzado, **lo que B está más alto que A**: de B₂ a la horizontal de A₂, por
              la vertical de B₂, que es la de O₂. Se lleva desde la línea nueva hacia fuera, lejos de la
              planta.
          - con: marca
            traza: solucion.B_4
            bloque: 1.er cambio de plano
            rotulo: B₄
            porque: |
              B₄, donde el arco corta la perpendicular que sale de B₁.
          - con: regla
            traza: segmento2(solucion.A_4, solucion.B_4)
            bloque: 1.er cambio de plano
            rotulo: canto
            porque: |
              A₄B₄ es el **plano de canto**: la vista 4 mira a lo largo de las horizontales, que se ven de
              punta, y el plano entero se ve como una recta. O₄ y D₄ están en ella.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(O), solucion.O_4), segmento2(proy_planta(D), solucion.D_4)]'
            bloque: 1.er cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por O₁ y por D₁, las perpendiculares a la primera línea nueva, hasta el canto: O y D están en
              el plano, y el canto es el plano. Así no hace falta llevar sus cotas.
          - con: marca
            traza: solucion.O_4
            bloque: 1.er cambio de plano
            porque: |
              O₄, donde la perpendicular de O₁ corta el canto. Va sin rótulo: el punto D₄, que se marca
              justo después, lo taparía.
          - con: marca
            traza: solucion.D_4
            bloque: 1.er cambio de plano
            rotulo: D₄
            porque: |
              D₄, donde la perpendicular de D₁ corta el canto, muy cerca de O₄.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(O), solucion.parO1a), segmento2(proy_planta(O), solucion.parO1b)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por O₁, la **paralela a la primera línea nueva**, hacia los dos lados. O es la referencia del
              segundo cambio: cada punto llevará lo que su planta está más lejos o más cerca de la línea
              nueva que O₁, que es su distancia a esta paralela.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.O_4, solucion.O5mas), segmento2(solucion.D_4, solucion.D5mas)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva2")
            porque: |
              Segundo cambio. Desde O₄ y D₄, las perpendiculares a la segunda línea nueva, que es paralela al
              canto; la de D₄, larga, más allá de la línea.
          - con: marca
            traza: solucion.O_5
            bloque: 2.º cambio de plano
            rotulo: O₅
            porque: |
              O₅, donde la perpendicular de O₄ corta la segunda línea nueva: O es la referencia, y cae en
              ella.
          - con: compas
            traza: 'arco(solucion.pieD4, por: solucion.D_5, desde: desplaza(solucion.D_5, dx: 1.89, dy: -5.69), hasta: desplaza(solucion.D_5, dx: -1.89, dy: 5.69))'
            bloque: 2.º cambio de plano
            toma: segmento2(proy_planta(D), solucion.pieD1c)
            porque: |
              D₁ está **más lejos** de la primera línea nueva que O₁: lo que mide de D₁ a la paralela por O₁.
              D₅ se aparta eso de la segunda línea, hacia fuera, lejos del canto.
          - con: marca
            traza: solucion.D_5
            bloque: 2.º cambio de plano
            rotulo: D₅
            porque: |
              D₅, donde el arco corta la perpendicular que sale de D₄.
          - con: compas
            traza: 'arco(solucion.O_5, por: solucion.D_5)'
            bloque: 2.º cambio de plano
            porque: |
              Con centro en O₅ y radio O₅D₅, la **circunferencia entera**: el triángulo equilátero tiene sus
              tres vértices en ella, porque O es su centro.
          - con: regla
            traza: segmento2(solucion.D_5, solucion.Dant5mas)
            bloque: 2.º cambio de plano
            porque: |
              D₅O₅, prolongada hasta cortar la circunferencia al otro lado: el punto opuesto a D₅.
          - con: marca
            traza: solucion.Dant5
            bloque: 2.º cambio de plano
            rotulo: D₅*
            porque: |
              D₅*, el punto de la circunferencia opuesto a D₅, donde la recta vuelve a cortarla.
          - con: compas
            traza: 'arco(solucion.Dant5, por: solucion.E_5, desde: desplaza(solucion.E_5, dx: 2.31, dy: 3.72), hasta: desplaza(solucion.F_5, dx: 4.36, dy: 0.32))'
            bloque: 2.º cambio de plano
            toma: segmento2(solucion.O_5, solucion.D_5)
            porque: |
              Con centro en D₅* y el mismo radio, el arco que pasa por O₅ y corta la circunferencia en los dos
              vértices que faltan: los dos están a 60° de D₅*, que es estar a 120° de D₅.
          - con: marca
            traza: solucion.E_5
            bloque: 2.º cambio de plano
            rotulo: E₅
            porque: |
              E₅, el corte de abajo: en la vista 5 la cota crece hacia abajo, en el sentido del canto de A₄
              a B₄, y E es el de más cota.
          - con: marca
            traza: solucion.F_5
            bloque: 2.º cambio de plano
            rotulo: F₅
            porque: |
              F₅, el otro corte del arco con la circunferencia.
          - con: regla
            traza: '[segmento2(solucion.D_5, solucion.E_5), segmento2(solucion.E_5, solucion.F_5), segmento2(solucion.F_5, solucion.D_5)]'
            bloque: 2.º cambio de plano
            porque: |
              D₅E₅F₅ es el triángulo equilátero en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.E_5, solucion.E5fuera), segmento2(solucion.E_5, solucion.E_4), segmento2(solucion.F_5, solucion.F5fuera), segmento2(solucion.F_5, solucion.F_4)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva2")
            porque: |
              La vuelta. Por E₅ y por F₅, las perpendiculares a la segunda línea nueva: hacia fuera, hasta
              cortarla, porque desde ella se mide lo que se apartan; hacia dentro, hasta el canto.
          - con: marca
            traza: solucion.E_4
            bloque: 2.º cambio de plano
            rotulo: E₄
            porque: |
              E₄, donde la perpendicular de E₅ corta el canto: E está en el plano.
          - con: marca
            traza: solucion.F_4
            bloque: 2.º cambio de plano
            rotulo: F₄
            porque: |
              F₄, donde la perpendicular de F₅ corta el canto.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.E_4, solucion.E1mas), segmento2(solucion.F_4, solucion.F1mas)]'
            bloque: 2.º cambio de plano
            guia: figura.segmento("nueva1")
            porque: |
              Por E₄ y por F₄, las perpendiculares a la primera línea nueva, de vuelta a la planta, largas:
              hasta pasar la paralela por O₁.
          - con: compas
            traza: 'arco(solucion.pieE1c, por: proy_planta(E), desde: desplaza(proy_planta(E), dx: -1.08, dy: -1.69), hasta: desplaza(proy_planta(E), dx: 1.08, dy: 1.69))'
            bloque: 2.º cambio de plano
            toma: segmento2(solucion.E_5, solucion.pieE5)
            porque: |
              E₅ está hacia dentro de la segunda línea nueva lo que mide de E₅ a su pie en ella: E₁ queda más
              cerca de la primera línea que O₁ eso mismo. Desde la paralela por O₁, hacia la línea nueva.
          - con: marca
            traza: proy_planta(E)
            bloque: 2.º cambio de plano
            rotulo: E₁
            porque: |
              E₁, donde el arco corta la perpendicular que sale de E₄.
          - con: compas
            traza: 'arco(solucion.pieF1c, por: proy_planta(F), desde: desplaza(proy_planta(F), dx: -1.62, dy: -2.53), hasta: desplaza(proy_planta(F), dx: 1.62, dy: 2.53))'
            bloque: 2.º cambio de plano
            toma: segmento2(solucion.F_5, solucion.pieF5)
            porque: |
              Lo mismo con F: desde la paralela por O₁, hacia la primera línea nueva, lo que F₅ dista de la
              segunda.
          - con: marca
            traza: proy_planta(F)
            bloque: 2.º cambio de plano
            rotulo: F₁
            porque: |
              F₁, donde el arco corta la perpendicular que sale de F₄.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), solucion.E2mas), segmento2(proy_planta(F), solucion.F2mas)]'
            bloque: 1.er cambio de plano
            porque: |
              Por E₁ y por F₁, las verticales hacia el alzado, largas: cruzan la horizontal de A₂, desde la
              que se lleva la cota.
          - con: compas
            traza: 'arco(solucion.A2hE, por: proy_alzado(E), desde: desplaza(proy_alzado(E), dx: 6), hasta: desplaza(proy_alzado(E), dx: -6))'
            bloque: 1.er cambio de plano
            toma: segmento2(solucion.E_4, solucion.pieE4)
            porque: |
              La vista 4 llevaba cotas desde A: lo que E₄ dista de la primera línea nueva es lo que E está más
              alto que A. Se lleva desde la horizontal de A₂, hacia arriba, por la vertical de E₁.
          - con: marca
            traza: proy_alzado(E)
            bloque: 1.er cambio de plano
            rotulo: E₂
            porque: |
              E₂, donde el arco corta la vertical de E₁.
          - con: compas
            traza: 'arco(solucion.A2hF, por: proy_alzado(F), desde: desplaza(proy_alzado(F), dx: 6), hasta: desplaza(proy_alzado(F), dx: -6))'
            bloque: 1.er cambio de plano
            toma: segmento2(solucion.F_4, solucion.pieF4)
            porque: |
              Lo mismo con F: lo que F₄ dista de la primera línea nueva, desde la horizontal de A₂, hacia
              arriba.
          - con: marca
            traza: proy_alzado(F)
            bloque: 1.er cambio de plano
            rotulo: F₂
            porque: |
              F₂, donde el arco corta la vertical de F₁.
          - con: regla
            traza: '[segmento2(proy_planta(D), proy_planta(E)), segmento2(proy_planta(E), proy_planta(F)), segmento2(proy_planta(F), proy_planta(D)), segmento2(figura.punto("D2"), proy_alzado(E)), segmento2(proy_alzado(E), proy_alzado(F)), segmento2(proy_alzado(F), figura.punto("D2"))]'
            porque: |
              D₁E₁F₁ y D₂E₂F₂ son las proyecciones del triángulo equilátero.
        pista: |
          (1) O₁ y D₁ con las horizontales por C y por O. (2) Primer cambio, A de referencia: A₄ en la línea,
          B₄ a lo que B₂ está por encima de la horizontal de A₂, y el canto A₄B₄; O₄ y D₄, en el canto. (3)
          Segundo cambio, O de referencia: O₅ en la línea; D₅, a lo que D₁ dista de la paralela por O₁. (4)
          La circunferencia de centro O₅ por D₅; con centro en el punto opuesto a D₅ y el mismo radio, E₅ y
          F₅. (5) De vuelta: al canto, a la planta (desde la paralela por O₁) y al alzado (desde la
          horizontal de A₂).
        desarrollo: |
          En verde claro, el canto de la vista 4, el triángulo en verdadera magnitud de la vista 5 y sus dos
          proyecciones.

      - tipo: construir
        titulo: Por abatimiento, con la horizontal por B de charnela
        intro: |
          Empieza por O₁ y D₁, como en el primer paso. Después, abate el plano sobre el plano horizontal de
          B. El enunciado impone el método, pero no dice qué charnela: la fijamos nosotros. Es la
          horizontal del plano por B, que en la planta es la paralela a h₁ por B₁ y en el alzado, la
          horizontal de B₂. B está en ella y no se mueve. La horizontal por C, que pasa por D, no
          conviene: O está a 3 mm de ella, y un arco tan pequeño no se construye con precisión. Abate O y
          D, cada uno con su triángulo; dibuja el triángulo equilátero abatido, y desabátelo por afinidad.
          Vale cualquiera de los dos lados de la charnela, pero todo al mismo. B es el vértice más alto de
          ABC, y E y F quedan por debajo de él: E, el de más cota, es el que queda más cerca de la
          charnela. Junto a F₁ y F₂ pasa la vertical de Y₂: amplía con la lupa antes de marcarlos. Marca
          O₀, D₀, E₀ y F₀, y E y F en la planta y en el alzado. Las rectas de trazo y punto de la izquierda
          son las líneas nuevas del cambio de plano: aquí no se usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: O0
            pide: el centro O, abatido
            es: proy_planta(solucion.O_ab)
            bien: |
              O₀ está en la perpendicular a la charnela que pasa por O₁, a la distancia real de O a la
              charnela: la hipotenusa de lo que O₁ dista de ella en la planta y de lo que O está más bajo que
              B, que es lo que mide B₂O₂.
            diagnosticos:
              - si: cerca_de(proy_planta(O))
                mensaje: |
                  Ese es O₁, sin abatir. Al abatir, O gira alrededor de la charnela hasta quedar a la cota de
                  B, y en la planta se aparta de ella por la perpendicular.
                ejemplo: proy_planta(O)
              - si: cerca_de(solucion.Ocat)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que O está más bajo que
                  B**, B₂O₂. Eso es un cateto. El radio es la hipotenusa de ese cateto y de lo que separa O₁
                  de la charnela en la planta.
                ejemplo: rama(solucion.Ocat, 1)
              - si: cerca_de(solucion.Oplanta)
                mensaje: |
                  Has llevado al otro lado de la charnela lo que O₁ dista de ella **en la planta**, y la planta
                  acorta: O está 20 mm más bajo que la charnela. Con esa distancia y B₂O₂ se forma el
                  triángulo cuya hipotenusa es el radio.
                ejemplo: rama(solucion.Oplanta, 1)
              - si: '!en_recta(solucion.perpO1)'
                mensaje: |
                  O gira alrededor de la charnela en un plano perpendicular a ella, que es vertical: en la
                  planta, O₀ se mueve por la **perpendicular a la charnela que pasa por O₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.O_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por O₁, pero no a la distancia buena. El radio es la
                  hipotenusa de lo que separa O₁ de la charnela en la planta y de B₂O₂.
          - nombre: D0
            pide: el vértice D, abatido
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está en la perpendicular a la charnela por D₁, del mismo lado que O₀. O₀D₀ mide 14,7 mm,
              lo que mide de verdad OD: el radio del triángulo.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela. El plano gira entero, como una tapa sobre su
                  bisagra: D₀ cae al lado de O₀.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: cerca_de(solucion.Dcat)
                mensaje: |
                  Has llevado solo **lo que D está más bajo que B**: un cateto. Falta el otro, lo que separa D₁
                  de la charnela en la planta, para tener el radio.
                ejemplo: rama(solucion.Dcat, 1)
              - si: '!en_recta(solucion.perpD1)'
                mensaje: |
                  D₀ va por la **perpendicular a la charnela que pasa por D₁**, como O₀ por la suya.
                ejemplo: 'desplaza(proy_planta(rama(solucion.D_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por D₁, pero no a la distancia buena: el radio es la
                  hipotenusa de lo que separa D₁ de la charnela en la planta y de lo que D₂ está por debajo de
                  la horizontal de B₂.
          - nombre: E0
            pide: el vértice E, el de más cota, abatido
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la circunferencia de centro O₀ que pasa por D₀, a 120° de D₀, y es el más cercano a
              la charnela de los dos vértices nuevos: la charnela es la horizontal de B, y E y F están por
              debajo: el más cercano tiene más cota.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_ab)))
                mensaje: |
                  Ese es E abatido **al otro lado** de la charnela: va al lado de O₀ y D₀.
                ejemplo: proy_planta(rama(solucion.E_ab, 2))
              - si: cerca_de(proy_planta(solucion.F_ab))
                mensaje: |
                  Ese es F₀. La charnela es la horizontal por B, y E y F están por debajo de ella: cuanto más
                  cerca de ella queda un punto abatido, más cota tiene. E₀ es el vértice nuevo más cercano a
                  la charnela.
                ejemplo: proy_planta(rama(solucion.F_ab, 1))
              - si: cerca_de(proy_planta(solucion.H2_ab))
                mensaje: |
                  Has llevado el radio sobre la circunferencia desde D₀: así salen los vértices del hexágono,
                  a 60°. Los del triángulo están a 120°: con centro en el punto opuesto a D₀ y radio O₀D₀.
                ejemplo: proy_planta(rama(solucion.H2_ab, 1))
              - si: siempre
                mensaje: |
                  E₀ está donde el arco de centro en el punto opuesto a D₀, y radio O₀D₀, corta la
                  circunferencia de centro O₀ que pasa por D₀: el corte más cercano a la charnela.
          - nombre: F0
            pide: el vértice F, el otro, abatido
            es: proy_planta(solucion.F_ab)
            bien: |
              F₀ es el otro corte del arco con la circunferencia. D₀E₀F₀ es el triángulo equilátero en
              verdadera magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.F_ab)))
                mensaje: |
                  Ese es F abatido **al otro lado** de la charnela: va al lado de los demás.
                ejemplo: proy_planta(rama(solucion.F_ab, 2))
              - si: cerca_de(proy_planta(solucion.H6_ab))
                mensaje: |
                  Ese es un vértice del hexágono, a 60° de D₀. El del triángulo está a 120°.
                ejemplo: proy_planta(rama(solucion.H6_ab, 1))
              - si: siempre
                mensaje: |
                  F₀ es el otro corte del arco de centro en el punto opuesto a D₀ con la circunferencia.
          - nombre: E1
            pide: el vértice E, desabatido, en la planta
            es: proy_planta(E)
            bien: |
              E₁ está en la perpendicular a la charnela por E₀ y en la recta que une K₁ con D₁: la recta DE
              y su abatida D₀E₀ se cortan en la charnela, en K, que no se mueve.
            diagnosticos:
              - si: cerca_de(proy_planta(F))
                mensaje: |
                  Ese es F₁. E es el vértice nuevo que, abatido, queda más cerca de la charnela.
                ejemplo: proy_planta(F)
              - si: '!en_recta(solucion.perpE1)'
                mensaje: |
                  Al desabatir, E₁ vuelve por la **perpendicular a la charnela que pasa por E₀**.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(solucion.K), proy_planta(D)), desde: proy_planta(E), distancia: mm(6)), 1)'
              - si: '!en_recta(segmento2(proy_planta(solucion.K), proy_planta(D)))'
                mensaje: |
                  Estás en la perpendicular buena, pero no en la recta K₁D₁. Por **afinidad**: prolonga D₀E₀
                  hasta la charnela, en K₁; la recta K₁D₁ es DE desabatida, y E₁ está en ella.
                ejemplo: 'uno(medir_sobre(solucion.perpE1, desde: proy_planta(E), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  E₁ está donde la perpendicular a la charnela por E₀ corta la recta K₁D₁.
          - nombre: F1
            pide: el vértice F, desabatido, en la planta
            es: proy_planta(F)
            bien: |
              F₁ está en la perpendicular a la charnela por F₀ y en la recta L₁O₁, prolongada más allá de O₁:
              OF y su abatida se cortan en la charnela, en L.
            diagnosticos:
              - si: '!en_recta(solucion.perpF1)'
                mensaje: |
                  Al desabatir, F₁ vuelve por la **perpendicular a la charnela que pasa por F₀**.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(solucion.L), proy_planta(F)), desde: proy_planta(F), distancia: mm(6)), 1)'
              - si: '!en_recta(segmento2(proy_planta(solucion.L), proy_planta(F)))'
                mensaje: |
                  Estás en la perpendicular buena, pero no en la recta L₁O₁. Por afinidad: prolonga F₀O₀ hasta
                  la charnela, en L₁; la recta L₁O₁, prolongada más allá de O₁, es OF desabatida.
                ejemplo: 'uno(medir_sobre(solucion.perpF1, desde: proy_planta(F), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  F₁ está donde la perpendicular a la charnela por F₀ corta la prolongación de L₁O₁.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la vertical de E₁ y en la recta K₂D₂: E está en la recta DK, y K₂ está en la
              horizontal de B₂, porque K está en la charnela.
            diagnosticos:
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(6))'
              - si: '!en_recta(segmento2(proy_alzado(solucion.K), figura.punto("D2")))'
                mensaje: |
                  E está en la recta DK. K está en la charnela, así que K₂ está en la horizontal de B₂, en la
                  vertical de K₁: E₂ va donde la vertical de E₁ corta K₂D₂.
                ejemplo: 'desplaza(proy_alzado(E), dy: mm(6))'
              - si: siempre
                mensaje: |
                  E₂ está donde la vertical de E₁ corta la recta K₂D₂.
          - nombre: F2
            pide: el vértice F, en el alzado
            es: proy_alzado(F)
            bien: |
              F₂ está en la vertical de F₁ y en la recta L₂O₂, prolongada más allá de O₂.
            diagnosticos:
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(proy_alzado(F), dx: mm(6))'
              - si: '!en_recta(segmento2(proy_alzado(solucion.L), figura.punto("O2")))'
                mensaje: |
                  F está en la recta OL: L₂ en la horizontal de B₂, en la vertical de L₁, y F₂ donde la vertical
                  de F₁ corta la prolongación de L₂O₂.
                ejemplo: 'desplaza(proy_alzado(F), dy: mm(6))'
              - si: siempre
                mensaje: |
                  F₂ está donde la vertical de F₁ corta la prolongación de L₂O₂.
        trazado:
          - proy_planta(segmento3(solucion.K, solucion.L))
          - segmento2(proy_planta(solucion.D_ab), proy_planta(solucion.E_ab))
          - segmento2(proy_planta(solucion.E_ab), proy_planta(solucion.F_ab))
          - segmento2(proy_planta(solucion.F_ab), proy_planta(solucion.D_ab))
          - segmento2(proy_planta(D), proy_planta(E))
          - segmento2(proy_planta(E), proy_planta(F))
          - segmento2(proy_planta(F), proy_planta(D))
          - segmento2(figura.punto("D2"), proy_alzado(E))
          - segmento2(proy_alzado(E), proy_alzado(F))
          - segmento2(proy_alzado(F), figura.punto("D2"))
        bloques:
          - nombre: Abatimiento con la horizontal por B
            explica: |
              Se abate el plano ABC sobre el plano horizontal de B, alrededor de la horizontal del plano por
              B, que hemos elegido de charnela: en la planta es la paralela a h₁ por B₁. La horizontal por
              C, que pasa por D, no conviene: O está a 3 mm de ella, y su arco sería demasiado pequeño. Cada
              punto gira en un plano vertical perpendicular a la charnela, y su radio es su distancia real a
              ella: la hipotenusa de lo que su planta dista de la charnela y de lo que está más bajo que B,
              25,8 mm para O y 29,0 para D. Abatido, el plano está en verdadera magnitud, y el triángulo se
              dibuja en la circunferencia de centro O₀ que pasa por D₀. Se
              [desabate](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir)
              por afinidad: D₀E₀ y F₀O₀ cortan la charnela en K y en L, que no se mueven, y E₁ y F₁ quedan
              en K₁D₁ y en L₁O₁, en las perpendiculares a la charnela por E₀ y por F₀.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.Xmas)
            porque: |
              Primero, O₁ y D₁, como en el paso anterior. La horizontal por C₂, hasta pasar A₂B₂: pasa por
              D₂, así que D está en la horizontal del plano por C.
          - con: marca
            traza: proy_alzado(solucion.X)
            porque: |
              X₂, donde la horizontal de C₂ corta A₂B₂: el punto de AB con la cota de C. Va sin
              rótulo: el punto Y₂, que se marca después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X), proy_planta(solucion.X))
            porque: |
              Por X₂, la vertical hasta A₁B₁, porque X está en AB.
          - con: marca
            traza: proy_planta(solucion.X)
            porque: |
              X₁, donde la vertical de X₂ corta A₁B₁. Va sin rótulo, como X₂: el suyo y el de Y₁, que
              se marca después, se pisarían.
          - con: regla
            traza: segmento2(figura.punto("C1"), proy_planta(solucion.X))
            rotulo: h₁
            porque: |
              h₁, la planta de la horizontal por C, de C₁ a X₁: da la dirección de todas las horizontales del
              plano en la planta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), proy_planta(D))
            porque: |
              Por D₂, la vertical hasta h₁: D está en la horizontal por C.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta h₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_alzado(solucion.Y))
            porque: |
              La horizontal por O₂, hacia la izquierda hasta A₂B₂: la horizontal del plano por O.
          - con: marca
            traza: proy_alzado(solucion.Y)
            rotulo: Y₂
            porque: |
              Y₂, donde la horizontal de O₂ corta A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Y), proy_planta(solucion.Y))
            porque: |
              Por Y₂, la vertical hasta A₁B₁, porque Y está en AB.
          - con: marca
            traza: proy_planta(solucion.Y)
            rotulo: Y₁
            porque: |
              Y₁, donde la vertical de Y₂ corta A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Y), solucion.Omas)
            guia: solucion.h1
            porque: |
              Por Y₁, la paralela a h₁: en la planta, las horizontales de un plano son paralelas.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_planta(O))
            porque: |
              Por O₂, la vertical hasta esa paralela, que es también la vertical de B₂.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, donde la vertical de O₂ corta la planta de la horizontal por O.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B1"), solucion.chA), segmento2(figura.punto("B1"), solucion.chB)]'
            bloque: Abatimiento con la horizontal por B
            guia: solucion.h1
            rotulo: charnela
            porque: |
              La **charnela**: por B₁, la paralela a h₁, larga y hacia los dos lados. Es la planta de la
              horizontal del plano por B; en ella caerán los pies de O y de D y los puntos fijos de la
              afinidad.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B2"), solucion.B2hA), segmento2(figura.punto("B2"), solucion.B2hB)]'
            bloque: Abatimiento con la horizontal por B
            porque: |
              En el alzado, la horizontal de B₂, hacia los dos lados: es el alzado de la charnela, y desde ella
              se miden las cotas de O y de D.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(O), solucion.O0mas1), segmento2(proy_planta(O), solucion.O0mas2)]'
            bloque: Abatimiento con la horizontal por B
            guia: segmento2(figura.punto("B1"), solucion.chB)
            porque: |
              Por O₁, la **perpendicular a la charnela**, larga y hacia los dos lados: al abatir, O gira
              alrededor de la charnela en un plano vertical, y en la planta se mueve por esta recta. La
              corta en M, el pie de O.
          - con: compas
            traza: 'arco(proy_planta(solucion.MO), por: solucion.TO, desde: desplaza(solucion.TO, dx: 3.23, dy: 5.06), hasta: desplaza(solucion.TO, dx: -3.23, dy: -5.06))'
            bloque: Abatimiento con la horizontal por B
            toma: segmento2(figura.punto("B2"), figura.punto("O2"))
            porque: |
              El triángulo del radio, rectángulo en M. Con el compás, **lo que O está más bajo que B**: de B₂
              a O₂, que están en la misma vertical. Se lleva sobre la charnela, desde M.
          - con: regla
            traza: segmento2(proy_planta(O), solucion.TO)
            bloque: Abatimiento con la horizontal por B
            rotulo: r
            porque: |
              La hipotenusa, de O₁ al punto llevado, es la **distancia real de O a la charnela**: el radio con
              que O se abate, 25,8 mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.MO), por: proy_planta(solucion.O_ab), desde: desplaza(proy_planta(solucion.O_ab), dx: -5.06, dy: 3.23), hasta: desplaza(proy_planta(solucion.O_ab), dx: 5.06, dy: -3.23))'
            bloque: Abatimiento con la horizontal por B
            toma: segmento2(proy_planta(O), solucion.TO)
            porque: |
              Con centro en M y ese radio, el arco que corta la perpendicular: O cae al plano horizontal de B
              girando alrededor de la charnela.
          - con: marca
            traza: proy_planta(solucion.O_ab)
            bloque: Abatimiento con la horizontal por B
            rotulo: O₀
            porque: |
              O₀, donde el arco de centro M corta la perpendicular a la charnela por O₁: O abatido. Aquí cae
              debajo de la planta, hacia fuera; al otro lado también valdría, con todo lo demás al mismo
              lado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(D), solucion.D0mas1), segmento2(proy_planta(D), solucion.D0mas2)]'
            bloque: Abatimiento con la horizontal por B
            guia: segmento2(figura.punto("B1"), solucion.chB)
            porque: |
              Por D₁, la perpendicular a la charnela, larga y hacia los dos lados: el camino de D al abatirse.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), solucion.B2hD)
            bloque: Abatimiento con la horizontal por B
            porque: |
              Por D₂, la vertical hacia arriba, hasta la horizontal de B₂: ese trozo es lo que D está más bajo
              que B.
          - con: compas
            traza: 'arco(proy_planta(solucion.MD), por: solucion.TD, desde: desplaza(solucion.TD, dx: 3.23, dy: 5.06), hasta: desplaza(solucion.TD, dx: -3.23, dy: -5.06))'
            bloque: Abatimiento con la horizontal por B
            toma: segmento2(figura.punto("D2"), solucion.B2hD)
            porque: |
              El triángulo del radio de D: lo que D está más bajo que B, llevado sobre la charnela desde su
              pie.
          - con: regla
            traza: segmento2(proy_planta(D), solucion.TD)
            bloque: Abatimiento con la horizontal por B
            rotulo: r
            porque: |
              La hipotenusa, de D₁ al punto llevado: la distancia real de D a la charnela, 29,0 mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.MD), por: proy_planta(solucion.D_ab), desde: desplaza(proy_planta(solucion.D_ab), dx: -5.06, dy: 3.23), hasta: desplaza(proy_planta(solucion.D_ab), dx: 5.06, dy: -3.23))'
            bloque: Abatimiento con la horizontal por B
            toma: segmento2(proy_planta(D), solucion.TD)
            porque: |
              Con centro en el pie de D y ese radio, el arco que corta su perpendicular, del lado de O₀.
          - con: marca
            traza: proy_planta(solucion.D_ab)
            bloque: Abatimiento con la horizontal por B
            rotulo: D₀
            porque: |
              D₀, donde el arco con centro en el pie de D corta su perpendicular, del lado de O₀: el plano
              gira entero.
          - con: compas
            traza: 'arco(proy_planta(solucion.O_ab), por: proy_planta(solucion.D_ab))'
            bloque: Abatimiento con la horizontal por B
            porque: |
              Con centro en O₀ y radio O₀D₀, la **circunferencia entera**: los tres vértices del triángulo
              equilátero están en ella.
          - con: regla
            traza: segmento2(proy_planta(rama(solucion.D_ab, 1)), solucion.Dant0mas)
            bloque: Abatimiento con la horizontal por B
            porque: |
              D₀O₀, prolongada hasta cortar la circunferencia al otro lado: el punto opuesto a D₀.
          - con: marca
            traza: solucion.Dant0
            bloque: Abatimiento con la horizontal por B
            rotulo: D₀*
            porque: |
              D₀*, el punto de la circunferencia opuesto a D₀, donde la recta vuelve a cortarla.
          - con: compas
            traza: 'arco(solucion.Dant0, por: proy_planta(rama(solucion.E_ab, 1)), desde: desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: -4.34, dy: -0.56), hasta: desplaza(proy_planta(rama(solucion.F_ab, 1)), dx: -3.0, dy: 3.18))'
            bloque: Abatimiento con la horizontal por B
            toma: segmento2(proy_planta(rama(solucion.O_ab, 1)), proy_planta(rama(solucion.D_ab, 1)))
            porque: |
              Con centro en D₀* y el mismo radio, el arco que pasa por O₀ y corta la circunferencia en los dos
              vértices que faltan, a 120° de D₀.
          - con: marca
            traza: proy_planta(solucion.E_ab)
            bloque: Abatimiento con la horizontal por B
            rotulo: E₀
            porque: |
              E₀, el corte más cercano a la charnela: los dos vértices están por debajo de B, y E es el de más
              cota.
          - con: marca
            traza: proy_planta(solucion.F_ab)
            bloque: Abatimiento con la horizontal por B
            rotulo: F₀
            porque: |
              F₀, el otro corte del arco con la circunferencia.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.D_ab, 1)), proy_planta(rama(solucion.E_ab, 1))), segmento2(proy_planta(rama(solucion.E_ab, 1)), proy_planta(rama(solucion.F_ab, 1))), segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.D_ab, 1)))]'
            bloque: Abatimiento con la horizontal por B
            porque: |
              D₀E₀F₀ es el triángulo equilátero en verdadera magnitud.
          - con: regla
            traza: segmento2(proy_planta(rama(solucion.D_ab, 1)), solucion.Kmas)
            bloque: Abatimiento con la horizontal por B
            porque: |
              Se desabate por **afinidad**. La recta D₀E₀, prolongada con la regla hasta la charnela: ahí
              corta a la recta DE sin abatir, porque los puntos de la charnela no se mueven.
          - con: marca
            traza: proy_planta(solucion.K)
            bloque: Abatimiento con la horizontal por B
            rotulo: K₁
            porque: |
              K₁, donde D₀E₀ corta la charnela: un punto fijo de la afinidad.
          - con: regla
            traza: segmento2(proy_planta(solucion.K), proy_planta(D))
            bloque: Abatimiento con la horizontal por B
            porque: |
              K₁D₁ es la planta de la recta DE: pasa por K, que no se ha movido, y por D₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(rama(solucion.E_ab, 1)), proy_planta(E))
            bloque: Abatimiento con la horizontal por B
            guia: segmento2(figura.punto("B1"), solucion.chB)
            porque: |
              Por E₀, la perpendicular a la charnela, hasta K₁D₁: E vuelve por el mismo camino por el que se
              abatió.
          - con: marca
            traza: proy_planta(E)
            bloque: Abatimiento con la horizontal por B
            rotulo: E₁
            porque: |
              E₁, donde la perpendicular de E₀ corta K₁D₁.
          - con: regla
            traza: segmento2(proy_planta(rama(solucion.F_ab, 1)), solucion.Lmas)
            bloque: Abatimiento con la horizontal por B
            porque: |
              Para F, la recta F₀O₀, prolongada hasta la charnela: corta a OF sin abatir en un punto fijo.
              F₀D₀ cortaría la charnela muy lejos y con un ángulo pequeño.
          - con: marca
            traza: proy_planta(solucion.L)
            bloque: Abatimiento con la horizontal por B
            rotulo: L₁
            porque: |
              L₁, donde F₀O₀ corta la charnela.
          - con: regla
            traza: segmento2(proy_planta(solucion.L), solucion.F1masL)
            bloque: Abatimiento con la horizontal por B
            porque: |
              L₁O₁ es la planta de OF: de L₁, por O₁, y prolongada más allá, porque F₁ cae al otro lado de O₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(F))
            bloque: Abatimiento con la horizontal por B
            guia: segmento2(figura.punto("B1"), solucion.chB)
            porque: |
              Por F₀, la perpendicular a la charnela, hasta la prolongación de L₁O₁.
          - con: marca
            traza: proy_planta(F)
            bloque: Abatimiento con la horizontal por B
            rotulo: F₁
            porque: |
              F₁, donde la perpendicular de F₀ corta L₁O₁ prolongada.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.K), proy_alzado(solucion.K)), segmento2(proy_planta(solucion.L), proy_alzado(solucion.L))]'
            porque: |
              Para los alzados, K y L: por K₁ y L₁, las verticales hasta la horizontal de B₂, porque están en
              la charnela y tienen la cota de B.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta la horizontal de B₂.
          - con: marca
            traza: proy_alzado(solucion.L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta la horizontal de B₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.K), figura.punto("D2"))
            porque: |
              K₂D₂, el alzado de la recta DE: E está en ella.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(E), proy_alzado(E))
            porque: |
              Por E₁, la vertical hasta K₂D₂: E está en esa recta.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta K₂D₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.L), solucion.F2masL)
            porque: |
              L₂O₂, el alzado de la recta OF, prolongado más allá de O₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(F), proy_alzado(F))
            porque: |
              Por F₁, la vertical hasta L₂O₂ prolongada.
          - con: marca
            traza: proy_alzado(F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta L₂O₂.
          - con: regla
            traza: '[segmento2(proy_planta(D), proy_planta(E)), segmento2(proy_planta(E), proy_planta(F)), segmento2(proy_planta(F), proy_planta(D)), segmento2(figura.punto("D2"), proy_alzado(E)), segmento2(proy_alzado(E), proy_alzado(F)), segmento2(proy_alzado(F), figura.punto("D2"))]'
            porque: |
              D₁E₁F₁ y D₂E₂F₂: las mismas proyecciones que con el cambio de plano.
        pista: |
          (1) O₁ y D₁ con las horizontales por C y por O. (2) La charnela, paralela a h₁ por B₁. (3) O₀ y D₀,
          cada uno por la perpendicular a la charnela, con el radio de su triángulo: catetos, lo que dista
          su planta de la charnela y lo que está más bajo que B. (4) La circunferencia de centro O₀ por D₀;
          con centro en el punto opuesto a D₀ y el mismo radio, E₀ y F₀. (5) Afinidad: D₀E₀ corta la
          charnela en K₁, y E₁ está en K₁D₁; F₀O₀, en L₁, y F₁ en L₁O₁. (6) Los alzados, con K₂ y L₂ en la
          horizontal de B₂.
        desarrollo: |
          En verde claro, la charnela, el triángulo equilátero abatido y sus dos proyecciones, las mismas que
          con el cambio de plano.

      - tipo: construir
        titulo: Por dos giros
        intro: |
          Empieza por O₁ y D₁, como en el primer paso. Después, dos giros, como el método 3 de la hoja «Plano
          en VM». El enunciado impone el método, pero no fija los ejes: los fijamos nosotros. Primero, eje
          vertical por C: gira la planta alrededor de C₁ hasta que la horizontal por C quede de punta, con
          D₁′ debajo de C₁; las cotas no cambian, y el plano queda de canto en el alzado. Para el canto
          sirve A, que está lejos de C; O y D se giran con él. Después, eje de punta por A′, el punto A ya
          girado: gira el canto alrededor de A₂′ hasta la horizontal de A₂; los alejamientos no cambian, y
          la planta sale en verdadera magnitud. Este segundo giro vale hacia los dos lados. El eje no va
          por C porque O está a 3 mm de él, y D, casi encima: apenas se moverían. Ahí se dibuja el
          triángulo, y se deshacen los dos giros en orden contrario. Tras el segundo giro, E, el de más
          cota, es el que queda más lejos del eje, la vertical de A₂′. Junto a F₁ y F₂ pasa la vertical de
          Y₂: amplía con la lupa antes de marcarlos. Marca D₁′ y O₁′, O₁″, E₁″ y F₁″, y E y F en la planta
          y en el alzado. Las rectas de trazo y punto de la izquierda son las líneas nuevas del cambio de
          plano: aquí no se usan.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: D1p
            rotulo: D₁′
            pide: D tras el primer giro, en la planta
            es: proy_planta(solucion.D_g)
            bien: |
              D₁′ está en la vertical de C₁, debajo, a la distancia C₁D₁: la planta gira sin deformarse. El
              giro es de 57,5°.
            diagnosticos:
              - si: cerca_de(solucion.Dotro)
                mensaje: |
                  Has girado hacia el otro lado, 122,5°, y la horizontal por C también queda de punta. Aquí el
                  giro es el corto, con D₁′ debajo de C₁, que es el que fija este paso: hacia arriba, la figura
                  girada se mete en el alzado.
                ejemplo: solucion.Dotro
              - si: cerca_de(solucion.Dcorto)
                mensaje: |
                  Has llevado D₁ en horizontal hasta la vertical de C₁: eso no es girar, es acortar. D₁ se
                  mueve por un arco con centro en C₁, y conserva su distancia a él.
                ejemplo: solucion.Dcorto
              - si: '!en_recta(solucion.verticalC1)'
                mensaje: |
                  La horizontal por C, de punta, tiene la planta perpendicular a la horizontal del papel: D₁′
                  está en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_planta(solucion.D_g), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₁, pero no a la distancia buena: con centro en C₁ y radio C₁D₁, el
                  arco la corta en D₁′.
          - nombre: O1p
            rotulo: O₁′
            pide: O tras el primer giro, en la planta
            es: proy_planta(solucion.O_g)
            bien: |
              O₁′ está a la misma distancia de C₁ que O₁, girado los mismos 57,5° que D: a la distancia D₁O₁
              de D₁′.
            diagnosticos:
              - si: cerca_de(proy_planta(O))
                mensaje: |
                  Ese es O₁, sin girar. Todos los puntos giran alrededor de C₁ el mismo ángulo que D.
                ejemplo: proy_planta(O)
              - si: cerca_de(solucion.Ootro)
                mensaje: |
                  Has girado O hacia el otro lado. Todos los puntos giran en el mismo sentido que D; si no, la
                  figura se deforma.
                ejemplo: solucion.Ootro
              - si: '!a_distancia(de: figura.punto("C1"), d: vm_planta(C, O))'
                mensaje: |
                  O se mueve por un arco con centro en C₁: O₁′ está **a la misma distancia de C₁** que O₁.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(solucion.O_g)), desde: proy_planta(solucion.O_g), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás a la buena distancia de C₁, pero no has girado el mismo ángulo que D. La planta gira
                  como un sólido: lleva la distancia D₁O₁ desde D₁′ con el compás y corta el arco.
          - nombre: O1pp
            rotulo: O₁″
            pide: O tras el segundo giro, en la planta
            es: proy_planta(solucion.O_gg)
            bien: |
              O₁″ está a la altura de O₁′, porque el giro de eje de punta no cambia los alejamientos, y en la
              vertical de O₂″: O₂′ girado alrededor de A₂′ hasta la horizontal de A₂.
            diagnosticos:
              - si: '!en_horizontal_de(O1p)'
                mensaje: |
                  Con el eje de punta los alejamientos no cambian: en la planta, O₁″ se mueve **en horizontal**
                  desde O₁′.
                ejemplo: 'desplaza(proy_planta(rama(solucion.O_gg, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a la altura de O₁′, pero no en la buena vertical. En el alzado, con centro en A₂′ y
                  radio A₂′O₂′, lleva O₂′ hasta la horizontal de A₂: O₂″. O₁″ está en su vertical.
          - nombre: E1pp
            rotulo: E₁″
            pide: el vértice E, el de más cota, tras los dos giros
            es: proy_planta(solucion.E_gg)
            bien: |
              E₁″ está en la circunferencia de centro O₁″ que pasa por D₁″, a 120° de D₁″: el corte que queda
              más lejos del eje, la vertical de A₂′, porque tras el segundo giro la distancia al eje dice
              cuánto subía cada punto por el canto.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_gg)))
                mensaje: |
                  Ese es E con el segundo giro hecho **hacia el otro lado**. Vale cualquiera de los dos, pero
                  todos los puntos giran en el mismo sentido que O.
                ejemplo: proy_planta(rama(solucion.E_gg, 2))
              - si: cerca_de(proy_planta(solucion.F_gg))
                mensaje: |
                  Ese es F₁″. Cuanto más alto estaba un punto, más lejos del eje, la vertical de A₂′, lo deja
                  el segundo giro, porque el canto subía desde A: E₁″ es el vértice nuevo más alejado del eje.
                ejemplo: proy_planta(rama(solucion.F_gg, 1))
              - si: cerca_de(proy_planta(solucion.H2_gg))
                mensaje: |
                  Has llevado el radio sobre la circunferencia desde D₁″: así salen los vértices del hexágono,
                  a 60°. Los del triángulo están a 120°: con centro en el punto opuesto a D₁″ y el mismo radio.
                ejemplo: proy_planta(rama(solucion.H2_gg, 1))
              - si: siempre
                mensaje: |
                  E₁″ está donde el arco de centro en el punto opuesto a D₁″ corta la circunferencia de centro
                  O₁″: el corte más alejado del eje, la vertical de A₂′.
          - nombre: F1pp
            rotulo: F₁″
            pide: el vértice F, el otro, tras los dos giros
            es: proy_planta(solucion.F_gg)
            bien: |
              F₁″ es el otro corte del arco con la circunferencia. D₁″E₁″F₁″ es el triángulo en verdadera
              magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.F_gg)))
                mensaje: |
                  Ese es F con el segundo giro hecho hacia el otro lado: va con los demás.
                ejemplo: proy_planta(rama(solucion.F_gg, 2))
              - si: cerca_de(proy_planta(solucion.H6_gg))
                mensaje: |
                  Ese es un vértice del hexágono, a 60° de D₁″. El del triángulo está a 120°.
                ejemplo: proy_planta(rama(solucion.H6_gg, 1))
              - si: siempre
                mensaje: |
                  F₁″ es el otro corte del arco de centro en el punto opuesto a D₁″ con la circunferencia.
          - nombre: E1
            pide: el vértice E, con los giros deshechos, en la planta
            es: proy_planta(E)
            bien: |
              E₁ está a la distancia C₁E₁′ de C₁ y a la distancia D₁′E₁′ de D₁: es E₁′ girado 57,5° hacia el
              otro lado, alrededor de C₁.
            diagnosticos:
              - si: cerca_de(proy_planta(F))
                mensaje: |
                  Ese es F₁. E es el que, tras el segundo giro, quedaba más lejos del eje, la vertical de A₂′.
                ejemplo: proy_planta(F)
              - si: cerca_de(proy_planta(solucion.E_g))
                mensaje: |
                  Ese es E₁′, E tras deshacer solo el segundo giro. Falta el primero: alrededor de C₁, el mismo
                  ángulo, hacia el otro lado.
                ejemplo: proy_planta(solucion.E_g)
              - si: '!a_distancia(de: figura.punto("C1"), d: vm_planta(C, E))'
                mensaje: |
                  Deshacer el giro de eje vertical es girar otra vez alrededor de C₁: E₁ está **a la misma
                  distancia de C₁** que E₁′.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(E)), desde: proy_planta(E), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás a la buena distancia de C₁, pero no en el ángulo bueno: E₁ está a la distancia D₁′E₁′
                  de D₁, porque la planta gira como un sólido.
          - nombre: F1
            pide: el vértice F, con los giros deshechos, en la planta
            es: proy_planta(F)
            bien: |
              F₁ está a la distancia C₁F₁′ de C₁ y a la distancia D₁′F₁′ de D₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.F_g))
                mensaje: |
                  Ese es F₁′: falta deshacer el primer giro, alrededor de C₁, hacia el otro lado.
                ejemplo: proy_planta(solucion.F_g)
              - si: siempre
                mensaje: |
                  F₁ está a la distancia C₁F₁′ de C₁ y a la distancia D₁′F₁′ de D₁.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la vertical de E₁ y a la altura de E₂′: en el giro de eje vertical las cotas no
              cambian.
            diagnosticos:
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(6))'
              - si: '!en_horizontal_de(proy_alzado(solucion.E_g))'
                mensaje: |
                  Has cambiado la cota de E. Deshacer el giro de eje vertical no la cambia: E₂ queda a la altura
                  de E₂′, el punto del canto.
                ejemplo: 'desplaza(proy_alzado(E), dy: mm(6))'
              - si: siempre
                mensaje: |
                  E₂ está en la vertical de E₁, a la altura de E₂′.
          - nombre: F2
            pide: el vértice F, en el alzado
            es: proy_alzado(F)
            bien: |
              F₂ está en la vertical de F₁ y a la altura de F₂′. Las proyecciones son las mismas que por los
              otros dos métodos.
            diagnosticos:
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(proy_alzado(F), dx: mm(6))'
              - si: '!en_horizontal_de(proy_alzado(solucion.F_g))'
                mensaje: |
                  La cota de F no cambia al deshacer el giro de eje vertical: F₂ queda a la altura de F₂′.
                ejemplo: 'desplaza(proy_alzado(F), dy: mm(6))'
              - si: siempre
                mensaje: |
                  F₂ está en la vertical de F₁, a la altura de F₂′.
        trazado:
          - segmento2(proy_alzado(solucion.A_g), proy_alzado(solucion.E_g))
          - segmento2(proy_planta(solucion.D_gg), proy_planta(solucion.E_gg))
          - segmento2(proy_planta(solucion.E_gg), proy_planta(solucion.F_gg))
          - segmento2(proy_planta(solucion.F_gg), proy_planta(solucion.D_gg))
          - segmento2(proy_planta(D), proy_planta(E))
          - segmento2(proy_planta(E), proy_planta(F))
          - segmento2(proy_planta(F), proy_planta(D))
          - segmento2(figura.punto("D2"), proy_alzado(E))
          - segmento2(proy_alzado(E), proy_alzado(F))
          - segmento2(proy_alzado(F), figura.punto("D2"))
        bloques:
          - nombre: Giro de eje vertical por C
            explica: |
              El primer giro tiene el eje vertical por C, que hemos elegido nosotros: en la planta es el
              punto C₁. La planta gira alrededor de C₁ sin deformarse, 57,5°, hasta que la horizontal por C,
              que pasa por D, queda de punta, con D₁′ en la vertical de C₁, debajo; cada punto conserva su
              distancia a C₁ y, como la planta gira entera, también a D₁. Las cotas no cambian: en el alzado
              cada punto se mueve en horizontal, y el plano se ve como una recta, el canto A₂′C₂, el primer
              paso de
              [un plano, en dos giros](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-giros).
              A la vuelta, este giro se deshace el último: E₁′ y F₁′ giran alrededor de C₁ el mismo ángulo
              en sentido contrario, y sus alzados se quedan a la altura de E₂′ y F₂′.
          - nombre: Giro de eje de punta por A′
            explica: |
              El segundo giro tiene el eje de punta por A′ (A tras el primer giro), que hemos elegido
              nosotros: es perpendicular al plano vertical, y en el alzado es el punto A₂′. No va por C: ese
              eje sería la horizontal por C, y O, a 3 mm de ella, y D, casi encima, apenas se moverían. El
              canto gira alrededor de A₂′ hasta la horizontal de A₂, 50,9° hacia la derecha (hacia el otro
              lado, 129,1°, también valdría); los alejamientos no cambian, y en la planta cada punto se
              mueve en horizontal. Con el plano horizontal, la planta es la verdadera magnitud, y ahí se
              dibuja el triángulo. A la vuelta, este giro se deshace el primero: E y F suben a la horizontal
              de A₂, vuelven al canto con centro en A₂′ y bajan a la altura de E₁″ y F₁″.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.Xmas)
            porque: |
              Primero, O₁ y D₁, como en el paso anterior. La horizontal por C₂, hasta pasar A₂B₂: pasa por
              D₂, así que D está en la horizontal del plano por C.
          - con: marca
            traza: proy_alzado(solucion.X)
            porque: |
              X₂, donde la horizontal de C₂ corta A₂B₂: el punto de AB con la cota de C. Va sin
              rótulo: el punto Y₂, que se marca después, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X), proy_planta(solucion.X))
            porque: |
              Por X₂, la vertical hasta A₁B₁, porque X está en AB.
          - con: marca
            traza: proy_planta(solucion.X)
            porque: |
              X₁, donde la vertical de X₂ corta A₁B₁. Va sin rótulo, como X₂: el suyo y el de Y₁, que
              se marca después, se pisarían.
          - con: regla
            traza: segmento2(figura.punto("C1"), proy_planta(solucion.X))
            rotulo: h₁
            porque: |
              h₁, la planta de la horizontal por C, de C₁ a X₁: da la dirección de todas las horizontales del
              plano en la planta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), proy_planta(D))
            porque: |
              Por D₂, la vertical hasta h₁: D está en la horizontal por C.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta h₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_alzado(solucion.Y))
            porque: |
              La horizontal por O₂, hacia la izquierda hasta A₂B₂: la horizontal del plano por O.
          - con: marca
            traza: proy_alzado(solucion.Y)
            rotulo: Y₂
            porque: |
              Y₂, donde la horizontal de O₂ corta A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Y), proy_planta(solucion.Y))
            porque: |
              Por Y₂, la vertical hasta A₁B₁, porque Y está en AB.
          - con: marca
            traza: proy_planta(solucion.Y)
            rotulo: Y₁
            porque: |
              Y₁, donde la vertical de Y₂ corta A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Y), solucion.Omas)
            guia: solucion.h1
            porque: |
              Por Y₁, la paralela a h₁: en la planta, las horizontales de un plano son paralelas.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), proy_planta(O))
            porque: |
              Por O₂, la vertical hasta esa paralela, que es también la vertical de B₂.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, donde la vertical de O₂ corta la planta de la horizontal por O.
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("C1"), desplaza(figura.punto("C1"), dy: 82))'
            bloque: Giro de eje vertical por C
            porque: |
              Primer giro, de eje vertical por C. Por C₁, la vertical, hacia abajo, larga: la horizontal por
              C, de punta, tiene la planta perpendicular a la horizontal del papel.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: proy_planta(D), desde: proy_planta(D), hasta: proy_planta(solucion.D_g))'
            bloque: Giro de eje vertical por C
            porque: |
              Con centro en C₁, en el eje, y radio C₁D₁, el arco hasta esa vertical: así la horizontal por C,
              que pasa por D, queda de punta.
          - con: marca
            traza: proy_planta(solucion.D_g)
            bloque: Giro de eje vertical por C
            rotulo: D₁′
            porque: |
              D₁′, donde el arco corta la vertical de C₁: la planta gira sin deformarse. El giro es de 57,5°.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: figura.punto("A1"), desde: figura.punto("A1"), hasta: desplaza(proy_planta(solucion.A_g), dx: 22.14, dy: 4.31))'
            bloque: Giro de eje vertical por C
            porque: |
              Todos los puntos giran alrededor de C₁ el mismo ángulo. A, por su arco con centro en C₁, largo:
              dónde para lo dice el paso siguiente.
          - con: compas
            traza: 'arco(proy_planta(solucion.D_g), por: proy_planta(solucion.A_g), desde: desplaza(proy_planta(solucion.A_g), dx: -5.52, dy: -2.36), hasta: desplaza(proy_planta(solucion.A_g), dx: 5.52, dy: 2.36))'
            bloque: Giro de eje vertical por C
            toma: segmento2(proy_planta(D), figura.punto("A1"))
            porque: |
              A₁′ está a la misma distancia de D₁′ que A₁ de D₁, porque la planta gira como un sólido: con esa
              abertura, desde D₁′, se corta el arco.
          - con: marca
            traza: proy_planta(solucion.A_g)
            bloque: Giro de eje vertical por C
            rotulo: A₁′
            porque: |
              A₁′, donde el arco con centro en D₁′ corta el de A: A tras el primer giro, lejos de C, que dará
              el canto con precisión.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: proy_planta(O), desde: proy_planta(O), hasta: desplaza(proy_planta(solucion.O_g), dx: 13.58, dy: -1.52))'
            bloque: Giro de eje vertical por C
            porque: |
              Lo mismo con O: su arco con centro en C₁, largo.
          - con: compas
            traza: 'arco(proy_planta(solucion.D_g), por: proy_planta(solucion.O_g), desde: desplaza(proy_planta(solucion.O_g), dx: -5.94, dy: 0.85), hasta: desplaza(proy_planta(solucion.O_g), dx: 5.94, dy: -0.85))'
            bloque: Giro de eje vertical por C
            toma: segmento2(proy_planta(D), proy_planta(O))
            porque: |
              O₁′ está a la distancia D₁O₁ de D₁′: con esa abertura, desde D₁′, se corta el arco de O.
          - con: marca
            traza: proy_planta(solucion.O_g)
            bloque: Giro de eje vertical por C
            rotulo: O₁′
            porque: |
              O₁′, donde el arco con centro en D₁′ corta el de O: O tras el primer giro.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.A2gmas)
            bloque: Giro de eje vertical por C
            porque: |
              En el alzado, la horizontal de A₂, hacia la derecha, larga: en el giro de eje vertical las cotas
              no cambian, y A₂′ caerá en ella; tras el segundo giro, todo el triángulo también.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.A_g), proy_alzado(solucion.A_g))
            bloque: Giro de eje vertical por C
            porque: |
              Por A₁′, la vertical hasta la horizontal de A₂.
          - con: marca
            traza: proy_alzado(solucion.A_g)
            bloque: Giro de eje vertical por C
            rotulo: A₂′
            porque: |
              A₂′, donde la vertical de A₁′ corta la horizontal de A₂: el giro de eje vertical no cambia la
              cota.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), solucion.O2hmas)
            bloque: Giro de eje vertical por C
            porque: |
              La horizontal de O₂, hacia la derecha: la cota de O tampoco cambia.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.O_g), proy_alzado(solucion.O_g))
            bloque: Giro de eje vertical por C
            porque: |
              Por O₁′, la vertical hasta la horizontal de O₂.
          - con: marca
            traza: proy_alzado(solucion.O_g)
            bloque: Giro de eje vertical por C
            porque: |
              O₂′, donde la vertical de O₁′ corta la horizontal de O₂. El punto cae sobre el rótulo C₂ de
              la lámina, y va sin rótulo: el suyo también lo pisaría.
          - con: regla
            traza: segmento2(proy_alzado(solucion.A_g), solucion.cantomas)
            bloque: Giro de eje vertical por C
            rotulo: canto
            porque: |
              De A₂′ por C₂, prolongada, larga: el plano tras el primer giro, **de canto**. C no se ha movido,
              porque está en el eje, y O₂′ cae en esta recta, que es la comprobación.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.D_g), proy_alzado(solucion.D_g))
            bloque: Giro de eje vertical por C
            porque: |
              Por D₁′, la vertical hasta el canto: D está en el plano.
          - con: marca
            traza: proy_alzado(solucion.D_g)
            bloque: Giro de eje vertical por C
            porque: |
              D₂′, donde la vertical de D₁′ corta el canto, casi encima de C₂: D está en la horizontal por C,
              que ahora es de punta. Va sin rótulo: el suyo caería encima del de C₂.
          - con: compas
            traza: 'arco(proy_alzado(solucion.A_g), por: proy_alzado(solucion.O_g), desde: proy_alzado(solucion.O_g), hasta: proy_alzado(solucion.O_gg))'
            bloque: Giro de eje de punta por A′
            porque: |
              Segundo giro, de eje de punta por A′. Con centro en A₂′, en el eje, O₂′ gira hasta la horizontal
              de A₂. Hacia la derecha; hacia la izquierda también valdría.
          - con: marca
            traza: proy_alzado(solucion.O_gg)
            bloque: Giro de eje de punta por A′
            rotulo: O₂″
            porque: |
              O₂″, donde el arco corta la horizontal de A₂: tras el segundo giro, O tiene la cota de A.
          - con: compas
            traza: 'arco(proy_alzado(solucion.A_g), por: proy_alzado(solucion.D_g), desde: proy_alzado(solucion.D_g), hasta: proy_alzado(solucion.D_gg))'
            bloque: Giro de eje de punta por A′
            porque: |
              Lo mismo con D₂′: el canto gira entero alrededor de A₂′.
          - con: marca
            traza: proy_alzado(solucion.D_gg)
            bloque: Giro de eje de punta por A′
            porque: |
              D₂″, donde el arco de D₂′ corta la horizontal de A₂. Va sin rótulo: el suyo pisaría el de
              O₂″, que ya está marcado, y el punto O₂″ lo rozaría.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.O_g), solucion.O1ppmas), segmento2(proy_planta(solucion.D_g), solucion.D1ppmas)]'
            bloque: Giro de eje de punta por A′
            porque: |
              Con el eje de punta los alejamientos no cambian: por O₁′ y por D₁′, las horizontales, largas,
              hacia el lado del giro.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(rama(solucion.O_gg, 1)), proy_planta(rama(solucion.O_gg, 1))), segmento2(proy_alzado(rama(solucion.D_gg, 1)), proy_planta(rama(solucion.D_gg, 1)))]'
            bloque: Giro de eje de punta por A′
            porque: |
              Desde O₂″ y D₂″, las verticales hasta esas horizontales.
          - con: marca
            traza: proy_planta(solucion.O_gg)
            bloque: Giro de eje de punta por A′
            rotulo: O₁″
            porque: |
              O₁″, donde la vertical de O₂″ corta la horizontal de O₁′.
          - con: marca
            traza: proy_planta(solucion.D_gg)
            bloque: Giro de eje de punta por A′
            rotulo: D₁″
            porque: |
              D₁″, donde la vertical de D₂″ corta la horizontal de D₁′. O₁″D₁″ es OD en verdadera magnitud.
          - con: compas
            traza: 'arco(proy_planta(solucion.O_gg), por: proy_planta(solucion.D_gg))'
            bloque: Giro de eje de punta por A′
            porque: |
              Con centro en O₁″ y radio O₁″D₁″, la **circunferencia entera**: el plano ya es horizontal, y la
              planta, su verdadera magnitud.
          - con: regla
            traza: segmento2(proy_planta(rama(solucion.D_gg, 1)), solucion.Dantgmas)
            bloque: Giro de eje de punta por A′
            porque: |
              D₁″O₁″, prolongada hasta cortar la circunferencia al otro lado.
          - con: marca
            traza: solucion.Dantg
            bloque: Giro de eje de punta por A′
            rotulo: D₁*
            porque: |
              D₁*, el punto de la circunferencia opuesto a D₁″, donde la recta vuelve a cortarla.
          - con: compas
            traza: 'arco(solucion.Dantg, por: proy_planta(rama(solucion.E_gg, 1)), desde: desplaza(proy_planta(rama(solucion.E_gg, 1)), dx: 2.8, dy: 3.36), hasta: desplaza(proy_planta(rama(solucion.F_gg, 1)), dx: -1.07, dy: 4.24))'
            bloque: Giro de eje de punta por A′
            toma: segmento2(proy_planta(rama(solucion.O_gg, 1)), proy_planta(rama(solucion.D_gg, 1)))
            porque: |
              Con centro en D₁* y el mismo radio, el arco que pasa por O₁″ y corta la circunferencia en los dos
              vértices que faltan, a 120° de D₁″.
          - con: marca
            traza: proy_planta(solucion.E_gg)
            bloque: Giro de eje de punta por A′
            rotulo: E₁″
            porque: |
              E₁″, el corte más alejado del eje, la vertical de A₂′: el canto subía desde A, y el más alto
              queda más lejos.
          - con: marca
            traza: proy_planta(solucion.F_gg)
            bloque: Giro de eje de punta por A′
            rotulo: F₁″
            porque: |
              F₁″, el otro corte del arco con la circunferencia.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.D_gg, 1)), proy_planta(rama(solucion.E_gg, 1))), segmento2(proy_planta(rama(solucion.E_gg, 1)), proy_planta(rama(solucion.F_gg, 1))), segmento2(proy_planta(rama(solucion.F_gg, 1)), proy_planta(rama(solucion.D_gg, 1)))]'
            bloque: Giro de eje de punta por A′
            porque: |
              D₁″E₁″F₁″ es el triángulo equilátero en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(rama(solucion.E_gg, 1)), proy_alzado(rama(solucion.E_gg, 1))), segmento2(proy_planta(rama(solucion.F_gg, 1)), proy_alzado(rama(solucion.F_gg, 1)))]'
            bloque: Giro de eje de punta por A′
            porque: |
              Se deshacen los giros en orden contrario. Por E₁″ y F₁″, las verticales hasta la horizontal de
              A₂: tras el segundo giro, todos los puntos tienen la cota de A.
          - con: marca
            traza: proy_alzado(solucion.E_gg)
            bloque: Giro de eje de punta por A′
            rotulo: E₂″
            porque: |
              E₂″, donde la vertical de E₁″ corta la horizontal de A₂.
          - con: marca
            traza: proy_alzado(solucion.F_gg)
            bloque: Giro de eje de punta por A′
            porque: |
              F₂″, donde la vertical de F₁″ corta la horizontal de A₂. Va sin rótulo: el suyo quedaría
              pegado al punto D₂″, a su derecha.
          - con: compas
            traza: '[arco(proy_alzado(solucion.A_g), por: proy_alzado(rama(solucion.E_gg, 1)), desde: proy_alzado(rama(solucion.E_gg, 1)), hasta: proy_alzado(solucion.E_g)), arco(proy_alzado(solucion.A_g), por: proy_alzado(rama(solucion.F_gg, 1)), desde: proy_alzado(rama(solucion.F_gg, 1)), hasta: proy_alzado(solucion.F_g))]'
            bloque: Giro de eje de punta por A′
            porque: |
              Con centro en A₂′, E₂″ y F₂″ vuelven al canto por sus arcos: es el segundo giro hacia atrás.
          - con: marca
            traza: proy_alzado(solucion.E_g)
            bloque: Giro de eje de punta por A′
            rotulo: E₂′
            porque: |
              E₂′, donde el arco de E₂″ corta el canto.
          - con: marca
            traza: proy_alzado(solucion.F_g)
            bloque: Giro de eje de punta por A′
            rotulo: F₂′
            porque: |
              F₂′, donde el arco de F₂″ corta el canto.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(rama(solucion.E_gg, 1)), solucion.E1pmas), segmento2(proy_planta(rama(solucion.F_gg, 1)), solucion.F1pmas)]'
            bloque: Giro de eje de punta por A′
            porque: |
              Los alejamientos no cambian en ese giro: por E₁″ y F₁″, las horizontales, largas, hacia A.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.E_g), proy_planta(solucion.E_g)), segmento2(proy_alzado(solucion.F_g), proy_planta(solucion.F_g))]'
            bloque: Giro de eje de punta por A′
            porque: |
              Desde E₂′ y F₂′, las verticales hasta esas horizontales.
          - con: marca
            traza: proy_planta(solucion.E_g)
            bloque: Giro de eje de punta por A′
            porque: |
              E₁′, donde la vertical de E₂′ corta la horizontal de E₁″. Va sin rótulo: el punto O₁″, que
              queda justo encima, lo taparía en parte.
          - con: marca
            traza: proy_planta(solucion.F_g)
            bloque: Giro de eje de punta por A′
            porque: |
              F₁′, donde la vertical de F₂′ corta la horizontal de F₁″. Va sin rótulo: el suyo quedaría
              pegado al punto F₁″, a su derecha.
          - con: compas
            traza: '[arco(figura.punto("C1"), por: proy_planta(solucion.E_g), desde: proy_planta(solucion.E_g), hasta: desplaza(proy_planta(E), dx: -10.65, dy: -11.42)), arco(figura.punto("C1"), por: proy_planta(solucion.F_g), desde: proy_planta(solucion.F_g), hasta: desplaza(proy_planta(F), dx: -6.85, dy: -15.78))]'
            bloque: Giro de eje vertical por C
            porque: |
              El primer giro hacia atrás: con centro en C₁, los arcos de E₁′ y F₁′, largos, en el sentido
              contrario al de antes.
          - con: compas
            traza: 'arco(proy_planta(D), por: proy_planta(E), desde: desplaza(proy_planta(E), dx: -5.34, dy: -2.74), hasta: desplaza(proy_planta(E), dx: 5.34, dy: 2.74))'
            bloque: Giro de eje vertical por C
            toma: segmento2(proy_planta(solucion.D_g), proy_planta(solucion.E_g))
            porque: |
              D₁′ vuelve a D₁, y E₁ está a la misma distancia de D₁ que E₁′ de D₁′: con esa abertura, desde D₁,
              se corta el arco de E.
          - con: marca
            traza: proy_planta(E)
            bloque: Giro de eje vertical por C
            rotulo: E₁
            porque: |
              E₁, donde el arco con centro en C₁ corta el de centro D₁: E con los dos giros deshechos.
          - con: compas
            traza: 'arco(proy_planta(D), por: proy_planta(F), desde: desplaza(proy_planta(F), dx: -2.2, dy: -5.58), hasta: desplaza(proy_planta(F), dx: 2.2, dy: 5.58))'
            bloque: Giro de eje vertical por C
            toma: segmento2(proy_planta(solucion.D_g), proy_planta(solucion.F_g))
            porque: |
              Lo mismo con F: a la distancia D₁′F₁′ de D₁.
          - con: marca
            traza: proy_planta(F)
            bloque: Giro de eje vertical por C
            rotulo: F₁
            porque: |
              F₁, donde el arco con centro en C₁ corta el de centro D₁: F con los dos giros deshechos.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.E_g), solucion.E2hmas), segmento2(proy_alzado(solucion.F_g), solucion.F2hmas)]'
            bloque: Giro de eje vertical por C
            porque: |
              En el giro de eje vertical las cotas no cambian: por E₂′ y F₂′, las horizontales, largas, hacia
              la izquierda.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), proy_alzado(E)), segmento2(proy_planta(F), proy_alzado(F))]'
            bloque: Giro de eje vertical por C
            porque: |
              Por E₁ y F₁, las verticales hasta esas horizontales.
          - con: marca
            traza: proy_alzado(E)
            bloque: Giro de eje vertical por C
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta la horizontal de E₂′.
          - con: marca
            traza: proy_alzado(F)
            bloque: Giro de eje vertical por C
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta la horizontal de F₂′.
          - con: regla
            traza: '[segmento2(proy_planta(D), proy_planta(E)), segmento2(proy_planta(E), proy_planta(F)), segmento2(proy_planta(F), proy_planta(D)), segmento2(figura.punto("D2"), proy_alzado(E)), segmento2(proy_alzado(E), proy_alzado(F)), segmento2(proy_alzado(F), figura.punto("D2"))]'
            porque: |
              D₁E₁F₁ y D₂E₂F₂: las mismas proyecciones que por los otros dos métodos.
        pista: |
          (1) O₁ y D₁. (2) Con centro en C₁: D₁ hasta la vertical de C₁, abajo; A y O, el mismo ángulo,
          cortando cada arco con la distancia a D₁ llevada desde D₁′. (3) Alzados tras el giro, a su misma
          altura: el canto A₂′C₂. (4) Con centro en A₂′, O₂′ y D₂′ hasta la horizontal de A₂; bájalos a la
          altura de O₁′ y D₁′. (5) El triángulo en la planta, como en el abatimiento. (6) Deshaz: E₁″ y F₁″
          suben a la horizontal de A₂, vuelven al canto con centro en A₂′, bajan a su altura, y vuelven con
          centro en C₁, a la distancia de D₁ que tenían de D₁′.
        desarrollo: |
          En verde claro, el canto tras el primer giro, el triángulo en verdadera magnitud tras el segundo y
          sus dos proyecciones, las mismas que por los otros dos métodos.

      - tipo: calcular
        titulo: El lado del triángulo
        pregunta: ¿Cuánto mide de verdad el lado del triángulo equilátero?
        respuesta:
          tipo: numero
          valor: '25.53'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '14.74'
            receta: en_mm(radio)
            mensaje: |
              Eso es **OD**, el radio de la circunferencia en la que está inscrito el triángulo: la distancia
              del centro a un vértice. El lado es √3 veces el radio.
          - valor: '21.69'
            receta: en_mm(vm_planta(D, E))
            mensaje: |
              Eso es lo que mide **D₁E₁ en la planta**. DE sube de D a E, y la planta lo acorta: el triángulo
              no es horizontal. Mídelo en la verdadera magnitud.
          - valor: '16.71'
            receta: en_mm(vm_alzado(D, E))
            mensaje: |
              Eso es **D₂E₂ en el alzado**, que también acorta: DE se aleja del plano vertical mientras sube.
        pista: |
          Mide D₅E₅, D₀E₀ o D₁″E₁″ con «medir» del Taller, en cualquiera de los tres pasos anteriores, o en
          tu lámina de papel: los tres dan lo mismo. También sale de la cuenta: el lado es √3 veces el
          radio, O₀D₀.
        desarrollo: |
          El radio es la verdadera magnitud de OD, 14,74 mm, y en un triángulo equilátero el lado es √3
          veces el radio:

          $$ \ell = \sqrt{3}\, \overline{OD} = \sqrt{3} \cdot 14{,}74 \approx 25{,}53 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: O y D están en el plano ABC, así que sus plantas salen de horizontales del plano; D, de la horizontal por C, porque D₂ está a la altura de C₂.
          - texto: 'El plano es oblicuo: el triángulo se dibuja en verdadera magnitud, con dos cambios de plano, con un abatimiento o con dos giros.'
          - texto: En verdadera magnitud, los tres vértices están en la circunferencia de centro O que pasa por D, y E y F están a 120° de D.
          - texto: Deshaciendo el método, E y F vuelven a la planta y al alzado, y los tres métodos dan las mismas proyecciones.
          - texto: El triángulo se puede dibujar directamente en la planta, con centro O₁ y un vértice en D₁, porque la planta conserva los ángulos de 60°.
            trampa: true
            mensaje: |
              La planta solo conserva la forma de lo que es horizontal, y el plano ABC no lo es: forma 50,9°
              con el horizontal. Un triángulo equilátero se ve deformado en la planta; D₁E₁ mide 21,69 mm y
              el lado de verdad, 25,53.
    resolucion: |
      **Lo que dan los datos.** O y D están en el plano ABC, del que solo se dan sus alzados: las plantas
      salen de horizontales del plano. D₂ está a la altura de C₂, así que D está en la horizontal por C,
      que corta A₂B₂ en X₂; h₁ va de C₁ a X₁, y D₁ cae en ella. La horizontal por O₂ corta A₂B₂ en Y₂, y la
      planta de la horizontal de O es la paralela a h₁ por Y₁. El plano está a 50,9° del horizontal.

      **El triángulo.** En verdadera magnitud, OD mide 14,74 mm: es el radio de la circunferencia en la que
      está inscrito. Los otros dos vértices están en ella, a 120° de D: el arco de centro en el punto
      opuesto a D y radio OD los da de una vez. El lado mide √3 veces el radio, 25,53 mm. E es el de más
      cota y F, el de menos.

      **Por cambio de plano.** Con la primera línea nueva perpendicular a las horizontales y A de
      referencia, B₄ cae a 42,5 mm de la línea, y A₄B₄ es el canto; O₄ y D₄ están en él. Con la segunda,
      paralela al canto, y O de referencia, D₅ se aparta 14,4 mm hacia fuera. De vuelta, E₁ y F₁ quedan
      4,4 y 10,0 mm más cerca de la primera línea que O₁, y E₂ y F₂, 33,5 y 14,2 mm por encima de la
      horizontal de A₂.

      **Por abatimiento.** Con la horizontal por B de charnela, O se abate con un radio de 25,8 mm y D con
      uno de 29,0. El triángulo abatido se desabate por afinidad: D₀E₀ corta la charnela en K, y E₁ está en
      K₁D₁; F₀O₀ la corta en L, y F₁ está en L₁O₁ prolongada. La horizontal por C no conviene de charnela: O
      está a 3 mm de ella.

      **Por giros.** Con el eje vertical por C, la planta gira 57,5° hasta que la horizontal por C queda de
      punta, con D₁′ debajo de C₁, y el plano queda de canto en el alzado. Con el eje de punta por A′, el
      canto gira 50,9° hasta la horizontal de A₂ (o 129,1° hacia el otro lado), y la planta queda en
      verdadera magnitud. El triángulo se dibuja ahí, y los dos giros se deshacen en orden contrario.

      **La comprobación.** Los tres métodos dan las mismas proyecciones de E y F. D₁E₁ mide 21,69 mm en la
      planta y D₂E₂, 16,71 en el alzado: ninguna vista da la verdadera magnitud del lado.

  - id: sd64-la-chapa-hexagonal-soldada-a-30
    titulo: La chapa hexagonal soldada a 30° sobre la diagonal BD
    fuente: Ejercicio 48 (SD64) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 49), con
    # su «30º» de «o» volada. El enunciado no impone método: se abate el plano
    # del hexágono sobre la chapa, con BD de charnela, y se vuelve con un cambio
    # de plano que deja BD de punta. La línea nueva no la da, y se fija en el
    # intro; va en la lámina, de tipo «e», como en SD22 y SD28.
    enunciado: |
      Se presenta la chapa ABCD mediante las proyecciones diédricas. Se quiere soldar otra chapa
      hexagonal de 20 mm de lado formando un ángulo de 30º inclinada hacia el vértice A y con un lado
      centrado en la diagonal BD. Dibujar las proyecciones diédricas del montaje.

      **Notas nuestras.** La figura es la chapa en el alzado, arriba, y en la planta, debajo. La hoja
      no da escala: la leemos a 1:1, y los 20 mm del lado del hexágono son 20 mm de la lámina.
      En el alzado es un segmento horizontal con una cruz en cada extremo, D₂ ≡ A₂ a la izquierda
      y C₂ ≡ B₂ a la derecha: los cuatro vértices tienen la misma cota, y la chapa es horizontal. En la
      planta es un rectángulo de 50 × 35 mm, con A₁B₁ arriba y D₁C₁ abajo. La figura no nombra nada
      más. Aquí llamamos O al centro de la chapa, E y F a los extremos del lado del hexágono que va
      sobre BD (E, el del lado de B), y G, H, I y J a los otros cuatro vértices, siguiendo desde F: G
      y J son los de en medio, y HI es el lado opuesto a EF. K es el centro del hexágono.
    pide: Las proyecciones de la chapa hexagonal —su planta y su alzado—, con lo que se ve y lo que queda oculto del montaje, y, como pregunta nuestra, a qué altura sobre la chapa ABCD queda su lado más alto.
    receta:
      lamina: sd64
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        # C₂ ≡ B₂ y D₂ ≡ A₂: los alzados de C y D son las mismas cruces.
        C: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("D1"))'
        chapa: plano(A, B, D)
      solucion:
        # El lado EF, sobre BD y centrado en O, el punto medio de BD (y el cruce
        # de las diagonales). BD va de B a D: así el abatimiento del lado de A es
        # la rama 1.
        O: punto_medio(segmento3(B, D))
        BD: recta3(B, D)
        EF: 'punto_a_distancia(BD, desde: O, distancia: mm(10))'
        E: rama(EF, 2)
        F: rama(EF, 1)
        E20: 'rama(punto_a_distancia(BD, desde: O, distancia: mm(20)), 2)'
        F20: 'rama(punto_a_distancia(BD, desde: O, distancia: mm(20)), 1)'
        F30: 'rama(punto_a_distancia(BD, desde: O, distancia: mm(30)), 1)'
        # El hexágono abatido del lado de A, en el plano de la chapa: su centro
        # es el tercer vértice del triángulo equilátero de lado EF.
        Earriba: 'punto3(alzado: desplaza(proy_alzado(E), dy: -20), planta: proy_planta(E))'
        KK: 'gira(F, recta3(E, Earriba), angulo: 60)'
        KabA: rama(KK, 1)
        hexA: 'poligono_regular(chapa, KabA, E, lados: 6)'
        GabA: uno(hexA, 3)
        HabA: uno(hexA, 4)
        IabA: uno(hexA, 5)
        JabA: uno(hexA, 6)
        # Decisión: «inclinada hacia el vértice A»: la chapa nueva sube desde BD,
        # por encima de ABCD, y se inclina sobre el rincón A. Su plano forma 30°
        # con la chapa, que es horizontal, y sale de girar el abatido 30° hacia
        # arriba alrededor de BD. El hexágono por debajo es un diagnóstico.
        G: 'gira(GabA, BD, angulo: 30, sentido: ascendente)'
        H: 'gira(HabA, BD, angulo: 30, sentido: ascendente)'
        I: 'gira(IabA, BD, angulo: 30, sentido: ascendente)'
        J: 'gira(JabA, BD, angulo: 30, sentido: ascendente)'
        K: 'gira(KabA, BD, angulo: 30, sentido: ascendente)'
        hexagono: plano(B, D, G)
        Gbajo: 'gira(GabA, BD, angulo: 30, sentido: descendente)'
        Jbajo: 'gira(JabA, BD, angulo: 30, sentido: descendente)'
        Hbajo: 'gira(HabA, BD, angulo: 30, sentido: descendente)'
        Ibajo: 'gira(IabA, BD, angulo: 30, sentido: descendente)'
        # El abatimiento que hace el alumno: hacia cualquiera de los dos lados de
        # BD (una elección, que fija la primera marca de G₀), y todo junto.
        G_ab: abatido_a_elegir(G, BD, hexagono)
        H_ab: 'abatido_junto(H, BD, hexagono, con: G_ab, de: G)'
        I_ab: 'abatido_junto(I, BD, hexagono, con: G_ab, de: G)'
        J_ab: 'abatido_junto(J, BD, hexagono, con: G_ab, de: G)'
        K_ab: 'abatido_junto(K, BD, hexagono, con: G_ab, de: G)'
        # Decisión: el cambio de plano de la vuelta, con la línea nueva de la
        # lámina («nueva», perpendicular a BD, 45 pt más allá de D₁) y B de
        # referencia: la chapa entera cae en la línea, y BD se ve de punta.
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva"), ref: B)'
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva"), ref: B)'
        G_4: 'cambio_plano_vertical(G, figura.segmento("nueva"), ref: B)'
        H_4: 'cambio_plano_vertical(H, figura.segmento("nueva"), ref: B)'
        Gab_4: 'cambio_plano_vertical(G_ab, figura.segmento("nueva"), ref: B)'
        Hab_4: 'cambio_plano_vertical(H_ab, figura.segmento("nueva"), ref: B)'
        # Los dos errores del canto: hacia el lado de C, y a 60° en vez de 30°.
        GcantoC: 'cambio_plano_vertical(gira(rama(G_ab, 2), BD, angulo: 30, sentido: ascendente), figura.segmento("nueva"), ref: B)'
        Gcanto60: 'cambio_plano_vertical(gira(GabA, BD, angulo: 60, sentido: ascendente), figura.segmento("nueva"), ref: B)'
        pieG4: 'pie_perpendicular(G_4, figura.segmento("nueva"))'
        pieH4: 'pie_perpendicular(H_4, figura.segmento("nueva"))'
        # Para el alzado: el punto de A₂B₂ en la vertical de J₁ (y de I₁), donde
        # se pincha el compás; y la cota de H, para el error de llevar B₄G₄.
        Jp: 'proy_alzado(punto_en_plano(planta: proy_planta(J), plano: chapa))'
        Ip: 'proy_alzado(punto_en_plano(planta: proy_planta(I), plano: chapa))'
        Hx: 'punto3(alzado: desplaza(proy_alzado(H), dx: 10), planta: desplaza(proy_planta(H), dx: 10, dy: 10))'
        cotaH: plano(H, I, Hx)
        Jvm: 'punto_en_plano(planta: proy_planta(J), plano: cotaH)'
        # Las rectas largas de la construcción: cada una sigue unos puntos más
        # allá del punto que va a dar.
        B4mas: 'uno(medir_sobre(segmento2(figura.punto("D1"), B_4), desde: B_4, distancia: 8), 1)'
        A4mas: 'uno(medir_sobre(segmento2(figura.punto("A1"), A_4), desde: A_4, distancia: 8), 1)'
        cantomas: 'uno(medir_sobre(segmento2(B_4, H_4), desde: H_4, distancia: 12), 1)'
        GabA_4: 'cambio_plano_vertical(GabA, figura.segmento("nueva"), ref: B)'
        HabA_4: 'cambio_plano_vertical(HabA, figura.segmento("nueva"), ref: B)'
        G4mas: 'uno(medir_sobre(segmento2(proy_planta(JabA), GabA_4), desde: GabA_4, distancia: 8), 1)'
        H4mas: 'uno(medir_sobre(segmento2(proy_planta(IabA), HabA_4), desde: HabA_4, distancia: 8), 1)'
        J1lejos: 'uno(medir_sobre(segmento2(G_4, proy_planta(J)), desde: proy_planta(J), distancia: 10), 1)'
        I1lejos: 'uno(medir_sobre(segmento2(H_4, proy_planta(I)), desde: proy_planta(I), distancia: 10), 1)'
        G1mas: 'uno(medir_sobre(segmento2(proy_planta(GabA), proy_planta(G)), desde: proy_planta(G), distancia: 6), 1)'
        H1mas: 'uno(medir_sobre(segmento2(proy_planta(HabA), proy_planta(H)), desde: proy_planta(H), distancia: 6), 1)'
        I1mas: 'uno(medir_sobre(segmento2(proy_planta(IabA), proy_planta(I)), desde: proy_planta(I), distancia: 6), 1)'
        J1mas: 'uno(medir_sobre(segmento2(proy_planta(JabA), proy_planta(J)), desde: proy_planta(J), distancia: 6), 1)'
        E2mas: 'desplaza(proy_alzado(E), dy: -8)'
        F2mas: 'desplaza(proy_alzado(F), dy: -8)'
        G2arriba: 'desplaza(proy_alzado(G), dy: -8)'
        J2arriba: 'desplaza(proy_alzado(J), dy: -8)'
        H2arriba: 'desplaza(proy_alzado(H), dy: -8)'
        I2arriba: 'desplaza(proy_alzado(I), dy: -8)'
        G2mas: 'desplaza(proy_alzado(G), dx: -8)'
        H2mas: 'desplaza(proy_alzado(H), dx: -8)'
        canto: segmento2(B_4, H_4)
        perpG: 'perpendicular(por: proy_planta(G), a: proy_planta(BD))'
        perpH: 'perpendicular(por: proy_planta(H), a: proy_planta(BD))'
        perpI: 'perpendicular(por: proy_planta(I), a: proy_planta(BD))'
        perpJ: 'perpendicular(por: proy_planta(J), a: proy_planta(BD))'
        # Las cifras del calcular: la altura de HI sobre la chapa, y sus errores.
        pieH: pie_perpendicular(H, BD)
        alturaHI_mm: en_mm(diferencia_de_cotas(H, B))
        # La visibilidad: el cruce aparente, en la planta, donde el lado A₁B₁ de
        # la chapa sale de debajo del hexágono, con el lado que lo da
        # (k_<arista>_<lado>). El de A₁D₁ con G₁H₁ no hace falta: ese tramo oculto
        # va pegado a G₁H₁, que se ve, y no se pasa aparte.
        k_AB_JE: 'cruce_aparente(figura.segmento("AB1"), segmento2(proy_planta(J), proy_planta(E)))'
      comprueba:
        - en_plano(C, chapa)
        - en_plano(E, hexagono)
        - en_plano(H, hexagono)
        - en_plano(I, hexagono)
        - en_plano(J, hexagono)
        - en_plano(K, hexagono)
    pasos:
      - tipo: reconocer
        pregunta: En el alzado, D₂ ≡ A₂ y C₂ ≡ B₂ están a la misma altura. ¿Qué dice eso de la chapa ABCD, y qué se gana con ello?
        opciones:
          - texto: Que es horizontal, su planta está en verdadera magnitud y BD, horizontal, puede ser la charnela
            correcta: true
            mensaje: |
              Eso es. Los cuatro vértices tienen la misma cota. BD es una horizontal de la chapa y también
              del plano del hexágono, porque el lado EF va sobre ella: abatido alrededor de BD, el hexágono
              cae en el plano de la chapa, y se dibuja en la planta tal como es.
          - texto: Que la chapa se ve de canto en el alzado, así que el ángulo de 30° se lleva en el alzado, con la línea de tierra como base
            mensaje: |
              De canto sí está, pero el ángulo de 30° no se ve en el alzado. Se vería si BD fuera de punta,
              perpendicular al plano vertical, y BD es oblicua en la planta. Hace falta una vista con BD de
              punta: la de un cambio de plano con la línea nueva perpendicular a B₁D₁.
          - texto: Que es frontal, y su alzado está en verdadera magnitud, así que el hexágono se abate directamente sobre el alzado
            mensaje: |
              Al revés. Una chapa frontal se ve como una recta en la **planta**, y en el alzado entera. Aquí
              la recta es el alzado: la chapa es horizontal, y la que está en verdadera magnitud es la planta.

      - tipo: construir
        titulo: La chapa hexagonal, abatida sobre ABCD
        intro: |
          El enunciado no impone método, y elegimos el que haría el alumno: abatir el plano del hexágono
          sobre la chapa. La charnela es BD, que es horizontal, está en las dos chapas y lleva el lado EF.
          Abatido, el hexágono cae en el plano de ABCD, que es horizontal: se dibuja en la planta, regular
          y en verdadera magnitud, con EF sobre B₁D₁ y centrado en O₁. Vale abatirlo hacia cualquiera de
          los dos lados de BD (la marca de G₀ fija el lado), pero todo al mismo: el plano gira entero.
          Marca E₁ y F₁, que están en la chapa y no se mueven, y los cuatro vértices abatidos. G₀ cae a
          1,3 mm de A₁D₁: amplía con la lupa (×4) si hace falta. La recta de trazo y punto de la izquierda
          es la línea nueva del paso siguiente: aquí no se usa.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: E1
            pide: E, el extremo del lado soldado que queda hacia B
            es: proy_planta(E)
            bien: |
              E₁ está en B₁D₁, a 10 mm de O₁ hacia B₁. El lado EF mide 20 mm y va centrado en BD: su punto
              medio es O, el centro de la chapa.
            diagnosticos:
              - si: cerca_de(proy_planta(O))
                mensaje: |
                  Ese es O₁, el centro de la chapa, donde se cortan las diagonales. Es el punto medio del
                  lado: E está a 10 mm de él, hacia B.
                ejemplo: proy_planta(O)
              - si: cerca_de(proy_planta(E20))
                mensaje: |
                  Has llevado el lado entero, 20 mm, desde O₁. El lado va **centrado** en BD: E y F quedan a
                  10 mm de O₁, uno a cada lado.
                ejemplo: proy_planta(E20)
              - si: cerca_de(proy_planta(F))
                mensaje: |
                  Ese es F₁, el extremo del lado de D. E es el del lado de B: los dos a 10 mm de O₁.
                ejemplo: proy_planta(F)
              - si: '!en_recta(proy_planta(BD))'
                mensaje: |
                  El lado del hexágono va sobre la diagonal BD: E₁ está **en B₁D₁**.
                ejemplo: 'desplaza(proy_planta(E), dx: mm(3), dy: mm(4))'
              - si: siempre
                mensaje: |
                  Estás en B₁D₁, pero no a la distancia buena: con el compás abierto 10 mm y centro en O₁,
                  el arco corta B₁D₁ en E₁, hacia B₁.
          - nombre: F1
            pide: F, el otro extremo del lado soldado, hacia D
            es: proy_planta(F)
            bien: |
              F₁ está en B₁D₁, a 10 mm de O₁ hacia D₁. E₁F₁ es el lado soldado, 20 mm, y en la planta se
              ve tal cual: está en la chapa, que es horizontal.
            diagnosticos:
              - si: cerca_de(proy_planta(F20))
                mensaje: |
                  Has llevado el lado entero, 20 mm, desde O₁. El lado va **centrado** en BD: F está a 10 mm
                  de O₁, hacia D.
                ejemplo: proy_planta(F20)
              - si: '!en_recta(proy_planta(BD))'
                mensaje: |
                  F también está en la diagonal BD: F₁ va **en B₁D₁**.
                ejemplo: 'desplaza(proy_planta(F), dx: mm(-3), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  Estás en B₁D₁, pero no a la distancia buena: F₁ está a 10 mm de O₁, hacia D₁, al otro lado
                  de E₁.
          - nombre: G0
            pide: G, el vértice que sigue a F, abatido
            es: proy_planta(G_ab)
            bien: |
              G₀ está a 20 mm de F₁ y a 20 mm de K₀, el centro: en un hexágono regular el radio es el lado.
              Aquí cae del lado de A; del lado de C también valdría, con todo el hexágono allí.
            diagnosticos:
              - si: cerca_de(proy_planta(J_ab))
                mensaje: |
                  Ese es J₀, el vértice que sigue a E. G es el que sigue a F, del lado de D.
                ejemplo: proy_planta(rama(J_ab, 1))
              - si: '!a_distancia(de: F1, d: mm(20))'
                mensaje: |
                  G₀ está **a 20 mm de F₁**: el hexágono abatido es regular, y todos sus lados miden 20 mm,
                  como EF.
                ejemplo: 'desplaza(proy_planta(rama(G_ab, 1)), dx: mm(4))'
              - si: '!a_distancia(de: proy_planta(K_ab), d: mm(20))'
                mensaje: |
                  A 20 mm de F₁ sí, pero G₀ también está a 20 mm de K₀, el centro del hexágono abatido: en un
                  hexágono regular el radio de la circunferencia que pasa por los vértices es el lado.
                ejemplo: proy_planta(F30)
              - si: siempre
                mensaje: |
                  G₀ está donde el arco de 20 mm con centro en F₁ corta la circunferencia de centro K₀ que
                  pasa por E₁ y F₁; el otro corte es E₁.
          - nombre: H0
            pide: H, el vértice que sigue a G, abatido
            es: proy_planta(H_ab)
            bien: |
              H₀ está a 20 mm de G₀, en la circunferencia de centro K₀. EH es una diagonal larga: pasa por
              K₀ y mide 40 mm.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(H_ab)))
                mensaje: |
                  Ese es H abatido **al otro lado** de BD. El plano gira entero, como una tapa sobre su
                  bisagra: H₀ cae al mismo lado que G₀.
                ejemplo: proy_planta(rama(H_ab, 2))
              - si: cerca_de(proy_planta(I_ab))
                mensaje: |
                  Ese es I₀. H es el vértice que sigue a G, el del lado de D en el lado opuesto a EF.
                ejemplo: proy_planta(rama(I_ab, 1))
              - si: siempre
                mensaje: |
                  H₀ está donde el arco de 20 mm con centro en G₀ corta la circunferencia de centro K₀; el
                  otro corte es F₁.
          - nombre: I0
            pide: I, el vértice que sigue a H, abatido
            es: proy_planta(I_ab)
            bien: |
              I₀ está a 20 mm de H₀ y de J₀. H₀I₀ es el lado opuesto a EF, paralelo a BD.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(I_ab)))
                mensaje: |
                  Ese es I abatido **al otro lado** de BD: todo el hexágono cae al lado de G₀.
                ejemplo: proy_planta(rama(I_ab, 2))
              - si: '!a_distancia(de: H0, d: mm(20))'
                mensaje: |
                  I₀ está **a 20 mm de H₀**: H₀I₀ es un lado del hexágono, paralelo a E₁F₁.
                ejemplo: 'desplaza(proy_planta(rama(I_ab, 1)), dx: mm(5))'
              - si: siempre
                mensaje: |
                  I₀ está en la circunferencia de centro K₀, a 20 mm de H₀, en la paralela a BD por H₀.
          - nombre: J0
            pide: J, el vértice que sigue a I y vuelve a E, abatido
            es: proy_planta(J_ab)
            bien: |
              J₀ está a 20 mm de I₀ y de E₁. G₀J₀ es la otra diagonal larga, paralela a BD y a 17,3 mm de
              ella (20 · √3/2).
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(J_ab)))
                mensaje: |
                  Ese es J abatido **al otro lado** de BD: todo el hexágono cae al lado de G₀.
                ejemplo: proy_planta(rama(J_ab, 2))
              - si: '!a_distancia(de: E1, d: mm(20))'
                mensaje: |
                  J₀ está **a 20 mm de E₁**: J₀E₁ es el último lado, el que cierra el hexágono.
                ejemplo: 'desplaza(proy_planta(rama(J_ab, 1)), dy: mm(5))'
              - si: siempre
                mensaje: |
                  J₀ está donde el arco de 20 mm con centro en E₁ corta la circunferencia de centro K₀; el
                  otro corte es F₁.
        trazado:
          - segmento2(proy_planta(E), proy_planta(F))
          - segmento2(proy_planta(F), proy_planta(G_ab))
          - segmento2(proy_planta(G_ab), proy_planta(H_ab))
          - segmento2(proy_planta(H_ab), proy_planta(I_ab))
          - segmento2(proy_planta(I_ab), proy_planta(J_ab))
          - segmento2(proy_planta(J_ab), proy_planta(E))
        bloques:
          - nombre: Abatimiento del hexágono
            explica: |
              El hexágono todavía no está dibujado, y en las vistas saldría deformado: lo dibujamos
              [abatido](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir),
              con el método que elegimos nosotros, porque el enunciado no impone ninguno. Su plano y
              la chapa comparten BD, que es horizontal: con BD de charnela, el plano del hexágono
              gira hasta caer sobre la chapa, que es horizontal y se ve en verdadera magnitud en la
              planta. E y F están en la charnela y no se mueven, y el hexágono abatido se traza en
              la planta con regla y compás, regular y de 20 mm de lado. Vale abatirlo hacia
              cualquiera de los dos lados de BD, pero entero al mismo; el paso siguiente lo levanta
              los 30° del enunciado.
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A1"), figura.punto("C1")), segmento2(figura.punto("B1"), figura.punto("D1"))]'
            porque: |
              Las dos diagonales de la chapa. B₁D₁ es donde va el lado del hexágono, y las dos se cortan en
              el centro de la chapa, que es el punto medio de BD.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, nombre nuestro: el cruce de las diagonales, el punto medio de B₁D₁. Ahí se centra el lado.
          - con: compas
            traza: '[arco(proy_planta(O), por: proy_planta(E), desde: desplaza(proy_planta(E), dx: 2.01, dy: 2.87), hasta: desplaza(proy_planta(E), dx: -2.01, dy: -2.87)), arco(proy_planta(O), por: proy_planta(F), desde: desplaza(proy_planta(F), dx: -2.01, dy: -2.87), hasta: desplaza(proy_planta(F), dx: 2.01, dy: 2.87))]'
            porque: |
              Con el compás abierto 10 mm en la regla, la mitad del lado, y centro en O₁, dos arcos que
              cortan B₁D₁ a los dos lados de O₁: el lado va centrado en BD, y valen los dos cortes.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, nombre nuestro: el corte del lado de B₁. E está en la chapa y en la charnela, y no se
              mueve al abatir.
          - con: marca
            traza: proy_planta(F)
            rotulo: F₁
            porque: |
              F₁, nombre nuestro: el corte del lado de D₁. E₁F₁ es el lado soldado, 20 mm.
          - con: compas
            traza: '[arco(proy_planta(E), por: proy_planta(KabA), desde: desplaza(proy_planta(KabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(KabA), dx: -2.54, dy: 5.44)), arco(proy_planta(F), por: proy_planta(KabA), desde: desplaza(proy_planta(KabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(KabA), dx: -5.98, dy: 0.52))]'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con el compás abierto E₁F₁, el lado (20 mm), y centro en E₁ y en F₁, dos arcos que se cortan
              del lado de A: el
              triángulo EFK es equilátero, y en un hexágono regular el radio es el lado. Del lado de C
              también se cortan, y valdría abatir hacia allí, con todo lo demás en ese lado.
          - con: marca
            traza: proy_planta(KabA)
            rotulo: K₀
            bloque: Abatimiento del hexágono
            porque: |
              K₀, nombre nuestro: donde se cortan los dos arcos, el centro del hexágono abatido.
          - con: compas
            traza: 'arco(proy_planta(KabA), por: proy_planta(E))'
            bloque: Abatimiento del hexágono
            porque: |
              La circunferencia de centro K₀ que pasa por E₁ y F₁: los seis vértices del hexágono abatido
              están en ella.
          - con: compas
            traza: 'arco(proy_planta(F), por: proy_planta(GabA), desde: desplaza(proy_planta(GabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(GabA), dx: -2.54, dy: 5.44))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con la misma abertura, E₁F₁, y centro en F₁, el arco que corta la circunferencia en G₀; el otro
              corte es E₁.
          - con: marca
            traza: proy_planta(GabA)
            rotulo: G₀
            bloque: Abatimiento del hexágono
            porque: |
              G₀, donde el arco de centro F₁ corta la circunferencia, del lado contrario a E₁: el vértice que
              sigue a F.
          - con: compas
            traza: 'arco(proy_planta(GabA), por: proy_planta(HabA), desde: desplaza(proy_planta(HabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(HabA), dx: -5.98, dy: 0.52))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con E₁F₁ y centro en G₀, el arco que corta la circunferencia en H₀; el otro corte es F₁.
          - con: marca
            traza: proy_planta(HabA)
            rotulo: H₀
            bloque: Abatimiento del hexágono
            porque: |
              H₀, donde el arco de centro G₀ corta la circunferencia, lejos de F₁: el vértice que sigue a G.
          - con: compas
            traza: 'arco(proy_planta(E), por: proy_planta(JabA), desde: desplaza(proy_planta(JabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(JabA), dx: -5.98, dy: 0.52))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Del otro lado, con centro en E₁, el arco que corta la circunferencia en J₀; el otro corte es
              F₁.
          - con: marca
            traza: proy_planta(JabA)
            rotulo: J₀
            bloque: Abatimiento del hexágono
            porque: |
              J₀, donde el arco de centro E₁ corta la circunferencia, lejos de F₁: el vértice que sigue a E.
          - con: compas
            traza: 'arco(proy_planta(JabA), por: proy_planta(IabA), desde: desplaza(proy_planta(IabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(IabA), dx: -2.54, dy: 5.44))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con centro en J₀, el arco que corta la circunferencia en I₀. I₀ queda a 20 mm de H₀: el
              hexágono cierra, y esa es la comprobación de que el compás no se ha abierto.
          - con: marca
            traza: proy_planta(IabA)
            rotulo: I₀
            bloque: Abatimiento del hexágono
            porque: |
              I₀, donde el arco de centro J₀ corta la circunferencia, lejos de E₁, y a 20 mm de H₀.
          - con: regla
            traza: '[segmento2(proy_planta(F), proy_planta(GabA)), segmento2(proy_planta(GabA), proy_planta(HabA)), segmento2(proy_planta(HabA), proy_planta(IabA)), segmento2(proy_planta(IabA), proy_planta(JabA)), segmento2(proy_planta(JabA), proy_planta(E))]'
            bloque: Abatimiento del hexágono
            porque: |
              Los lados que faltan, de F₁ a E₁ pasando por G₀, H₀, I₀ y J₀: el hexágono abatido, regular,
              en verdadera magnitud. El sexto, E₁F₁, va sobre la diagonal.
        pista: |
          (1) Las diagonales de la chapa se cortan en O₁. (2) Con 10 mm y centro en O₁, sobre B₁D₁: E₁
          hacia B₁ y F₁ hacia D₁. (3) Con 20 mm desde E₁ y desde F₁: K₀, el centro. (4) La circunferencia
          de centro K₀ que pasa por E₁, y el lado, 20 mm, llevado sobre ella desde F₁ y desde E₁.
        desarrollo: |
          En verde claro, el hexágono abatido: regular, de 20 mm de lado, con EF sobre BD y centrado en O.
          Está en el plano de la chapa, y por eso la planta lo enseña tal cual. Aquí está del lado de A;
          del lado de C sería su simétrico respecto de BD, y la vuelta del paso siguiente daría lo mismo.

      - tipo: construir
        titulo: De vuelta, con BD de punta, a la planta y al alzado
        intro: |
          La vuelta, con un cambio de plano. La línea nueva ya está dibujada, de trazo y punto, abajo a
          la izquierda de la planta: la hemos fijado nosotros, perpendicular a BD, que es una horizontal
          del plano del hexágono. En la vista 4 BD se ve de punta, en B₄ ≡ D₄, y el plano del hexágono, de
          canto. La referencia es B: la chapa es horizontal y cae entera en la línea nueva. El canto es
          la recta que sale de B₄ ≡ D₄ a 30° de la línea nueva, hacia el lado de A₄ y hacia fuera de la
          planta: leemos «inclinada hacia el vértice A» como que la chapa nueva sube desde BD, por encima
          de ABCD, y se inclina sobre el rincón A. Los abatidos, llevados a la vista 4, caen en la línea
          nueva; un arco de centro B₄ ≡ D₄ los sube al canto, y de ahí vuelven a la planta y al alzado.
          Redibuja primero el hexágono abatido del paso anterior. Marca G₄ ≡ J₄, H₄ ≡ I₄, las cuatro
          plantas que faltan y los seis alzados. Con la lupa (×4): H₁ cae a 1,4 mm de A₁, y G₁, sobre A₁D₁;
          las verticales de E₁ y de J₁ van a 0,4 mm una de otra, y las de F₁ y de I₁, a 0,8 mm. En un móvil,
          aun con la lupa, A₁ engancha casi hasta H₁: pincha H₁ por fuera de la chapa, lejos de A₁.

          Después, pasa a limpio el montaje con «arista vista» y «arista oculta»: el hexágono en las
          dos vistas y el lado A₁B₁ de la chapa. El enunciado pide «las proyecciones diédricas del
          montaje», que llevan lo visto y lo oculto; la lectura es nuestra: las dos chapas son finas
          y opacas, y la hexagonal va soldada por encima de ABCD. Con las chapas transparentes, todo
          iría en continua; opacas, en la planta el hexágono tapa el rincón A, y A₁B₁ va a trazos
          desde A₁ hasta donde la cruza J₁E₁: pasa antes J₁E₁, que da ese punto. No se pasan B₁C₁,
          C₁D₁ ni A₂B₂, que se ven enteros y ya están dibujados, ni E₂F₂, que va sobre A₂B₂. Tampoco
          A₁D₁: el hexágono tapa su tramo de A₁ a G₁H₁, pero ese tramo va a menos de 0,4 mm de G₁H₁,
          que se ve, y en el papel lo cubre. Decidimos que lo visto mande, como cuando dos líneas
          coinciden, y aquí no se pasa: el Taller no lo distingue de G₁H₁. En tu lámina de papel,
          dibujarlo a trazos pegado a G₁H₁ tampoco está mal.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G4
            rotulo: G₄ ≡ J₄
            pide: G y J, que en la vista 4 coinciden, en el canto
            es: solucion.G_4
            bien: |
              G₄ ≡ J₄ está en el canto, a 17,3 mm de B₄ ≡ D₄: lo que G y J distan de BD de verdad. G y J
              están a la misma distancia de la charnela, y con BD de punta caen en el mismo punto.
            diagnosticos:
              - si: cerca_de(solucion.Gab_4)
                mensaje: |
                  Ese punto, en la línea nueva, es G abatido visto en la vista 4: abatido, el hexágono está
                  en la chapa, y la chapa es la línea nueva. Falta levantarlo: con centro en B₄ ≡ D₄, el
                  arco hasta el canto.
                ejemplo: rama(solucion.Gab_4, 1)
              - si: cerca_de(solucion.GcantoC)
                mensaje: |
                  Has levantado el canto hacia el lado de C₄. La chapa se inclina **hacia A**: el canto sale
                  de B₄ ≡ D₄ hacia el lado de A₄.
                ejemplo: solucion.GcantoC
              - si: cerca_de(solucion.Gcanto60)
                mensaje: |
                  Ese canto forma 60° con la línea nueva. La línea nueva es la chapa ABCD vista de canto, y
                  el ángulo entre las dos chapas, 30°, se mide desde ella.
                ejemplo: solucion.Gcanto60
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  G₄ está **en el canto**: la recta que sale de B₄ ≡ D₄ a 30° de la línea nueva, hacia el
                  lado de A₄. En la vista 4 todo el plano del hexágono es esa recta.
                ejemplo: 'desplaza(solucion.G_4, dx: mm(3), dy: mm(4))'
              - si: siempre
                mensaje: |
                  Estás en el canto, pero no a la distancia buena: con centro en B₄ ≡ D₄ y radio hasta (G₀)₄,
                  el pie de la paralela a BD que pasa por G₀ y J₀.
          - nombre: H4
            rotulo: H₄ ≡ I₄
            pide: H e I, que en la vista 4 coinciden, en el canto
            es: solucion.H_4
            bien: |
              H₄ ≡ I₄ está en el canto, a 34,6 mm de B₄ ≡ D₄ (20 · √3), y a 17,3 mm de la línea nueva: la
              cota del lado HI sobre la chapa.
            diagnosticos:
              - si: cerca_de(solucion.Hab_4)
                mensaje: |
                  Ese es H abatido, visto en la vista 4, en la línea nueva. Con centro en B₄ ≡ D₄, el arco lo
                  sube hasta el canto.
                ejemplo: rama(solucion.Hab_4, 1)
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  H₄ también está **en el canto**, más lejos de B₄ ≡ D₄ que G₄: el doble.
                ejemplo: 'desplaza(solucion.H_4, dx: mm(3), dy: mm(4))'
              - si: siempre
                mensaje: |
                  Estás en el canto, pero no a la distancia buena: con centro en B₄ ≡ D₄ y radio hasta (H₀)₄.
          - nombre: G1
            pide: G, de vuelta en la planta
            es: proy_planta(G)
            bien: |
              G₁ está en la perpendicular a BD que pasa por G₀ y en la paralela a BD que sale de G₄ ≡ J₄. Cae
              a 15 mm de BD, y prácticamente sobre A₁D₁ (a 0,01 mm): una casualidad de las medidas.
            diagnosticos:
              - si: cerca_de(proy_planta(G_ab))
                mensaje: |
                  Ese es G₀, el abatido. Al levantar el hexágono, G se acerca a BD: en la planta queda a 15 mm,
                  y no a 17,3. Vuelve por la perpendicular a BD hasta la paralela que sale de G₄ ≡ J₄.
                ejemplo: proy_planta(rama(G_ab, 1))
              - si: '!en_recta(solucion.perpG)'
                mensaje: |
                  Al desabatir, G vuelve por la **perpendicular a BD que pasa por G₀**: es el camino por el que
                  se abatió.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.G_4, proy_planta(G)), desde: proy_planta(G), distancia: mm(5)), 1)'
              - si: '!en_recta(segmento2(solucion.G_4, proy_planta(G)))'
                mensaje: |
                  G₁ está en la **perpendicular a la línea nueva que sale de G₄ ≡ J₄**, que es paralela a BD:
                  la vuelta del cambio de plano.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(GabA), proy_planta(G)), desde: proy_planta(G), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  G₁ está donde la perpendicular a BD por G₀ corta la paralela a BD que sale de G₄ ≡ J₄.
          - nombre: J1
            pide: J, de vuelta en la planta
            es: proy_planta(J)
            bien: |
              J₁ está en la misma paralela a BD que G₁, porque G y J tienen la misma cota y la misma distancia
              a BD, y en la perpendicular a BD que pasa por J₀.
            diagnosticos:
              - si: cerca_de(proy_planta(J_ab))
                mensaje: |
                  Ese es J₀, el abatido. J vuelve por la perpendicular a BD, hacia BD, hasta la paralela que
                  sale de G₄ ≡ J₄.
                ejemplo: proy_planta(rama(J_ab, 1))
              - si: '!en_recta(solucion.perpJ)'
                mensaje: |
                  J vuelve por la **perpendicular a BD que pasa por J₀**.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.G_4, proy_planta(J)), desde: proy_planta(J), distancia: mm(5)), 1)'
              - si: '!en_recta(segmento2(solucion.G_4, proy_planta(J)))'
                mensaje: |
                  J₁ está en la **paralela a BD que sale de G₄ ≡ J₄**, la misma que la de G₁.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(JabA), proy_planta(J)), desde: proy_planta(J), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  J₁ está donde la perpendicular a BD por J₀ corta la paralela a BD que sale de G₄ ≡ J₄.
          - nombre: H1
            pide: H, de vuelta en la planta
            es: proy_planta(H)
            bien: |
              H₁ está a 30 mm de BD, en la paralela que sale de H₄ ≡ I₄ y en la perpendicular a BD por H₀.
              Queda a 1,4 mm de A₁, por fuera de la chapa: el hexágono tapa el rincón A.
            diagnosticos:
              - si: cerca_de(proy_planta(H_ab))
                mensaje: |
                  Ese es H₀, el abatido. H vuelve por la perpendicular a BD hasta la paralela que sale de
                  H₄ ≡ I₄: en la planta queda a 30 mm de BD, y no a 34,6.
                ejemplo: proy_planta(rama(H_ab, 1))
              - si: '!en_recta(solucion.perpH)'
                mensaje: |
                  H vuelve por la **perpendicular a BD que pasa por H₀**.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.H_4, proy_planta(H)), desde: proy_planta(H), distancia: mm(5)), 1)'
              - si: '!en_recta(segmento2(solucion.H_4, proy_planta(H)))'
                mensaje: |
                  H₁ está en la **paralela a BD que sale de H₄ ≡ I₄**.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(HabA), proy_planta(H)), desde: proy_planta(H), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  H₁ está donde la perpendicular a BD por H₀ corta la paralela a BD que sale de H₄ ≡ I₄, junto
                  a A₁.
          - nombre: I1
            pide: I, de vuelta en la planta
            es: proy_planta(I)
            bien: |
              I₁ está en la paralela a BD que sale de H₄ ≡ I₄, como H₁, y en la perpendicular a BD por I₀.
              H₁I₁ es paralela a BD.
            diagnosticos:
              - si: cerca_de(proy_planta(I_ab))
                mensaje: |
                  Ese es I₀, el abatido. I vuelve por la perpendicular a BD hasta la paralela que sale de
                  H₄ ≡ I₄.
                ejemplo: proy_planta(rama(I_ab, 1))
              - si: '!en_recta(solucion.perpI)'
                mensaje: |
                  I vuelve por la **perpendicular a BD que pasa por I₀**.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.H_4, proy_planta(I)), desde: proy_planta(I), distancia: mm(5)), 1)'
              - si: '!en_recta(segmento2(solucion.H_4, proy_planta(I)))'
                mensaje: |
                  I₁ está en la **paralela a BD que sale de H₄ ≡ I₄**, la misma que la de H₁.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(IabA), proy_planta(I)), desde: proy_planta(I), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  I₁ está donde la perpendicular a BD por I₀ corta la paralela a BD que sale de H₄ ≡ I₄.
          - nombre: E2
            pide: E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en A₂B₂, en la vertical de E₁: E está en la chapa, y la chapa se ve de canto.
            diagnosticos:
              - si: '!en_vertical_de(proy_planta(E))'
                mensaje: |
                  E₂ va en la **vertical de E₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(5))'
              - si: '!en_recta(figura.segmento("AB2"))'
                mensaje: |
                  E está en BD, en la chapa, y la chapa es horizontal: su alzado cae **en A₂B₂**.
                ejemplo: 'desplaza(proy_alzado(E), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  E₂ está donde la vertical de E₁ corta A₂B₂.
          - nombre: F2
            pide: F, en el alzado
            es: proy_alzado(F)
            bien: |
              F₂ está en A₂B₂, en la vertical de F₁. E₂F₂, la soldadura, va sobre la chapa.
            diagnosticos:
              - si: '!en_vertical_de(proy_planta(F))'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(proy_alzado(F), dx: mm(5))'
              - si: '!en_recta(figura.segmento("AB2"))'
                mensaje: |
                  F está en la chapa: su alzado cae **en A₂B₂**.
                ejemplo: 'desplaza(proy_alzado(F), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  F₂ está donde la vertical de F₁ corta A₂B₂.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(J)
            bien: |
              J₂ está en la vertical de J₁, 8,66 mm por encima de A₂B₂: lo que G₄ ≡ J₄ dista de la línea
              nueva, que es la cota de J sobre la chapa.
            diagnosticos:
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**.
                ejemplo: 'desplaza(proy_alzado(J), dx: mm(5))'
              - si: cerca_de(proy_alzado(Jbajo))
                mensaje: |
                  Ese J₂ queda **por debajo** de la chapa. La chapa hexagonal sube desde BD: su alzado queda
                  por encima de A₂B₂.
                ejemplo: proy_alzado(Jbajo)
              - si: cerca_de(proy_alzado(Jvm))
                mensaje: |
                  Has llevado como cota B₄G₄, lo que G dista de BD de verdad. La cota es lo que G₄ ≡ J₄ se
                  aparta de la línea nueva, medido en perpendicular a ella: la mitad, porque sen 30° = 1/2.
                ejemplo: proy_alzado(Jvm)
              - si: siempre
                mensaje: |
                  En la vertical de J₁, pero no a la altura buena: con el compás, lo que G₄ ≡ J₄ dista de la
                  línea nueva, llevado desde A₂B₂ hacia arriba.
          - nombre: G2
            pide: G, en el alzado
            es: proy_alzado(G)
            bien: |
              G₂ está en la vertical de G₁, a la altura de J₂: G y J tienen la misma cota. G₂J₂ es horizontal
              en el alzado, y paralela a E₂F₂.
            diagnosticos:
              - si: '!en_vertical_de(G1)'
                mensaje: |
                  G₂ va en la **vertical de G₁**, que pasa casi por D₂ ≡ A₂.
                ejemplo: 'desplaza(proy_alzado(G), dx: mm(5))'
              - si: cerca_de(proy_alzado(Gbajo))
                mensaje: |
                  Ese G₂ queda **por debajo** de la chapa. La chapa hexagonal sube desde BD.
                ejemplo: proy_alzado(Gbajo)
              - si: '!en_horizontal_de(J2)'
                mensaje: |
                  G y J están a la misma distancia de BD y suben lo mismo: G₂ va **a la altura de J₂**.
                ejemplo: 'desplaza(proy_alzado(G), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  G₂ está donde la horizontal de J₂ corta la vertical de G₁.
          - nombre: I2
            pide: I, en el alzado
            es: proy_alzado(I)
            bien: |
              I₂ está en la vertical de I₁, 17,3 mm por encima de A₂B₂: lo que H₄ ≡ I₄ dista de la línea
              nueva. Es el doble que la de J, porque I está el doble de lejos de BD.
            diagnosticos:
              - si: '!en_vertical_de(I1)'
                mensaje: |
                  I₂ va en la **vertical de I₁**.
                ejemplo: 'desplaza(proy_alzado(I), dx: mm(5))'
              - si: cerca_de(proy_alzado(Ibajo))
                mensaje: |
                  Ese I₂ queda **por debajo** de la chapa. La chapa hexagonal sube desde BD.
                ejemplo: proy_alzado(Ibajo)
              - si: siempre
                mensaje: |
                  En la vertical de I₁, pero no a la altura buena: con el compás, lo que H₄ ≡ I₄ dista de la
                  línea nueva, llevado desde A₂B₂ hacia arriba.
          - nombre: H2
            pide: H, en el alzado
            es: proy_alzado(H)
            bien: |
              H₂ está en la vertical de H₁, a la altura de I₂. H₂I₂ es el lado más alto del hexágono, 17,3 mm
              por encima de la chapa.
            diagnosticos:
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la **vertical de H₁**, que pasa justo a la izquierda de D₂ ≡ A₂.
                ejemplo: 'desplaza(proy_alzado(H), dx: mm(5))'
              - si: cerca_de(proy_alzado(Hbajo))
                mensaje: |
                  Ese H₂ queda **por debajo** de la chapa. La chapa hexagonal sube desde BD.
                ejemplo: proy_alzado(Hbajo)
              - si: '!en_horizontal_de(I2)'
                mensaje: |
                  H e I tienen la misma cota: H₂ va **a la altura de I₂**.
                ejemplo: 'desplaza(proy_alzado(H), dy: mm(4))'
              - si: siempre
                mensaje: |
                  H₂ está donde la horizontal de I₂ corta la vertical de H₁.
        trazado:
          - segmento2(solucion.B_4, solucion.H_4)
        # Decisión: el enunciado pide «las proyecciones diédricas del montaje», y un
        # montaje de dos chapas lleva su visibilidad; que las chapas sean finas y
        # opacas es lectura nuestra. Va aquí, en el paso que marca el hexágono, y
        # sustituye al paso dibujar que había. Sale de un cálculo de líneas ocultas
        # aparte, por rayos contra las dos chapas, y coincide con lo que decía ese
        # paso. El tramo oculto de A₁D₁ (de A₁ a G₁H₁, 16,1 mm) no es tramo: va a
        # 0,36 mm o menos de G₁H₁, que se ve, y en el Taller los dos se pisarían.
        # E₂F₂ va sobre A₂B₂, que ya está; B₁C₁, C₁D₁ y A₂B₂ se ven enteros.
        tramos:
          - traza: segmento2(proy_planta(E), proy_planta(F))
            tipo: visto
            porque: 'EF es la soldadura, sobre BD: está en la chapa, y el hexágono sube desde ella hacia A. Desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(F), proy_planta(G))
            tipo: visto
            porque: 'FG sube de la soldadura a G, 8,66 mm por encima de la chapa: el hexágono va todo por encima de ABCD, y desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(G), proy_planta(H))
            tipo: visto
            porque: 'GH sube de G, 8,66 mm por encima de la chapa, a H, 17,32: desde arriba nada lo tapa. A₁D₁ pasa por debajo, pegada a él, y manda GH.'
          - traza: segmento2(proy_planta(H), proy_planta(I))
            tipo: visto
            porque: 'HI es el lado más alto, 17,32 mm por encima de la chapa, y en la planta queda fuera de ella: nada lo tapa.'
          - traza: segmento2(proy_planta(I), proy_planta(J))
            tipo: visto
            porque: 'IJ baja de 17,32 a 8,66 mm por encima de la chapa, y en la planta queda fuera de ella: nada lo tapa.'
          - traza: segmento2(proy_planta(J), proy_planta(E))
            tipo: visto
            porque: 'JE baja de J, 8,66 mm por encima de la chapa, a E, en la soldadura: va por encima de ABCD, y desde arriba nada lo tapa.'
          - traza: segmento2(figura.punto("A1"), solucion.k_AB_JE)
            tipo: oculto
            porque: 'De A₁ al cruce con J₁E₁, A₁B₁ cae dentro de la planta del hexágono, que va por encima: a mitad de ese tramo, 11,1 mm más alto. El hexágono la tapa.'
          - traza: segmento2(solucion.k_AB_JE, figura.punto("B1"))
            tipo: visto
            porque: 'Pasado J₁E₁ (en el cruce, JE va 5,65 mm por encima de AB), A₁B₁ sale de la planta del hexágono: de ahí a B₁ no hay nada encima.'
          - traza: segmento2(proy_alzado(F), proy_alzado(G))
            tipo: visto
            porque: 'En el alzado la chapa ABCD se ve de canto, como la recta A₂B₂, y no tapa nada: FG sube de ella hacia G.'
          - traza: segmento2(proy_alzado(G), proy_alzado(H))
            tipo: visto
            porque: 'GH va de 8,66 a 17,32 mm por encima de A₂B₂: la chapa de canto no tapa nada, y el hexágono no tapa sus propios lados.'
          - traza: segmento2(proy_alzado(H), proy_alzado(I))
            tipo: visto
            porque: 'HI es el lado más alto, 17,32 mm por encima de A₂B₂: la chapa, de canto, no lo tapa, y no hay nada más delante.'
          - traza: segmento2(proy_alzado(I), proy_alzado(J))
            tipo: visto
            porque: 'IJ va por encima de A₂B₂: la chapa se ve de canto, como una recta, y no tapa nada.'
          - traza: segmento2(proy_alzado(J), proy_alzado(E))
            tipo: visto
            porque: 'JE baja hasta E₂, en A₂B₂, siempre por encima de la chapa, que de canto no tapa nada.'
        bloques:
          - nombre: Abatimiento del hexágono
            explica: |
              Se redibuja el hexágono abatido del paso anterior: su plano, girado alrededor de BD
              hasta caer sobre la chapa, que es horizontal, se ve en verdadera magnitud en la
              planta. De él salen las distancias reales de cada vértice a BD, que el giro de vuelta
              conserva: 17,3 mm las de G y J, y 34,6 mm las de H e I.
          - nombre: Cambio de plano con BD de punta
            explica: |
              Para levantar el hexágono hay que ver de verdad el ángulo de 30° entre las dos chapas,
              y ese ángulo se ve donde su recta común, BD, se ve como un punto. Lo da un
              [cambio de plano](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-cambio-de-plano-una-vista-nueva)
              vertical, con la línea nueva perpendicular a B₁D₁ (el método y la línea son nuestros):
              BD es horizontal, y vista en esa dirección queda de punta, B₄ ≡ D₄. La vista nueva
              sale de la planta y conserva las cotas: con B de referencia, cada punto se aparta de
              la línea nueva lo que está más alto que B. La chapa está toda a la cota de B y cae
              entera en la línea nueva, con los abatidos, que están en ella; el plano del hexágono
              se ve de canto, la recta por B₄ ≡ D₄ a 30° de la línea nueva, hacia A₄.
          - nombre: Giro de 30° alrededor de BD
            explica: |
              Levantar el hexágono es deshacer el abatimiento: girarlo 30° alrededor de BD, la
              charnela, hasta el canto. En la vista 4, BD es el punto B₄ ≡ D₄, y el giro se ve tal
              cual: cada vértice describe un arco de centro B₄ ≡ D₄ y conserva su distancia real a
              BD. En la planta, cada vértice se mueve por la perpendicular a BD que sale de su
              abatido, porque gira en un plano perpendicular a BD, que es vertical. Su planta está
              donde esa perpendicular corta la paralela a BD que vuelve de su punto en la vista 4.
          - nombre: Vuelta al alzado
            explica: |
              La vista 4 conserva las cotas: lo que un vértice se aparta en ella de la línea nueva
              es lo que está más alto que B, y B está a la cota de la chapa. Esa medida se lleva con
              el compás al alzado, desde A₂B₂ y hacia arriba, en la vertical de su planta: 8,66 mm
              para J y 17,32 mm para I. G tiene la cota de J, y H la de I, porque cada pareja está a
              la misma distancia de BD, que es horizontal: basta una horizontal en el alzado.
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A1"), figura.punto("C1")), segmento2(figura.punto("B1"), figura.punto("D1"))]'
            porque: |
              Primero, el hexágono abatido del paso anterior: las dos diagonales de la chapa, que se cortan en
              su centro.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, el cruce de las diagonales y punto medio de B₁D₁, como en el paso anterior.
          - con: compas
            traza: '[arco(proy_planta(O), por: proy_planta(E), desde: desplaza(proy_planta(E), dx: 2.01, dy: 2.87), hasta: desplaza(proy_planta(E), dx: -2.01, dy: -2.87)), arco(proy_planta(O), por: proy_planta(F), desde: desplaza(proy_planta(F), dx: -2.01, dy: -2.87), hasta: desplaza(proy_planta(F), dx: 2.01, dy: 2.87))]'
            porque: |
              Con 10 mm y centro en O₁, los dos cortes con B₁D₁: el lado, centrado en BD.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, el corte del lado de B₁.
          - con: marca
            traza: proy_planta(F)
            rotulo: F₁
            porque: |
              F₁, el corte del lado de D₁.
          - con: compas
            traza: '[arco(proy_planta(E), por: proy_planta(KabA), desde: desplaza(proy_planta(KabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(KabA), dx: -2.54, dy: 5.44)), arco(proy_planta(F), por: proy_planta(KabA), desde: desplaza(proy_planta(KabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(KabA), dx: -5.98, dy: 0.52))]'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con el compás abierto E₁F₁ (20 mm), desde E₁ y desde F₁, el corte del lado de A: el centro del
              hexágono abatido.
          - con: marca
            traza: proy_planta(KabA)
            rotulo: K₀
            bloque: Abatimiento del hexágono
            porque: |
              K₀, el centro del hexágono abatido, donde se cortan los dos arcos.
          - con: compas
            traza: 'arco(proy_planta(KabA), por: proy_planta(E))'
            bloque: Abatimiento del hexágono
            porque: |
              La circunferencia de centro K₀ por E₁ y F₁, donde están los seis vértices.
          - con: compas
            traza: 'arco(proy_planta(F), por: proy_planta(GabA), desde: desplaza(proy_planta(GabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(GabA), dx: -2.54, dy: 5.44))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con E₁F₁ y centro en F₁, el corte con la circunferencia que no es E₁.
          - con: marca
            traza: proy_planta(GabA)
            bloque: Abatimiento del hexágono
            porque: |
              G₀, donde el arco de centro F₁ corta la circunferencia, lejos de E₁. Aquí va sin rótulo: el
              suyo pisaría el de G₁, que cae 2,3 mm más abajo.
          - con: compas
            traza: 'arco(proy_planta(GabA), por: proy_planta(HabA), desde: desplaza(proy_planta(HabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(HabA), dx: -5.98, dy: 0.52))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con E₁F₁ y centro en G₀, el corte con la circunferencia que no es F₁.
          - con: marca
            traza: proy_planta(HabA)
            rotulo: H₀
            bloque: Abatimiento del hexágono
            porque: |
              H₀, donde el arco de centro G₀ corta la circunferencia, lejos de F₁.
          - con: compas
            traza: 'arco(proy_planta(E), por: proy_planta(JabA), desde: desplaza(proy_planta(JabA), dx: 5.98, dy: -0.52), hasta: desplaza(proy_planta(JabA), dx: -5.98, dy: 0.52))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con E₁F₁ y centro en E₁, el corte con la circunferencia que no es F₁.
          - con: marca
            traza: proy_planta(JabA)
            bloque: Abatimiento del hexágono
            porque: |
              J₀, donde el arco de centro E₁ corta la circunferencia, lejos de F₁. Aquí va sin rótulo: el
              suyo pisaría el de J₁, que cae 2,3 mm más abajo.
          - con: compas
            traza: 'arco(proy_planta(JabA), por: proy_planta(IabA), desde: desplaza(proy_planta(IabA), dx: 2.54, dy: -5.44), hasta: desplaza(proy_planta(IabA), dx: -2.54, dy: 5.44))'
            toma: segmento2(proy_planta(E), proy_planta(F))
            bloque: Abatimiento del hexágono
            porque: |
              Con E₁F₁ y centro en J₀, el corte con la circunferencia que no es E₁; queda a 20 mm de H₀.
          - con: marca
            traza: proy_planta(IabA)
            rotulo: I₀
            bloque: Abatimiento del hexágono
            porque: |
              I₀, donde el arco de centro J₀ corta la circunferencia, lejos de E₁. El hexágono abatido está
              completo.
          - con: regla
            traza: segmento2(figura.punto("D1"), solucion.B4mas)
            bloque: Cambio de plano con BD de punta
            porque: |
              Ahora el cambio de plano. B₁D₁, prolongada con la regla más allá de D₁ hasta pasar la línea
              nueva: la línea nueva es perpendicular a BD, y BD se verá de punta donde la corte.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄ ≡ D₄
            bloque: Cambio de plano con BD de punta
            porque: |
              B₄ ≡ D₄, donde la prolongación de BD corta la línea nueva. B es la referencia, y cae en la
              línea; D, E y F están en BD y tienen su misma cota, y caen en el mismo punto: la charnela, de
              punta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.A4mas)
            guia: figura.segmento("nueva")
            bloque: Cambio de plano con BD de punta
            porque: |
              Por A₁, la perpendicular a la línea nueva, que es paralela a BD, hasta pasarla. A tiene la cota
              de B, y cae en la línea: así se ve hacia qué lado de B₄ está A.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            bloque: Cambio de plano con BD de punta
            porque: |
              A₄, donde esa perpendicular corta la línea nueva. La chapa ABCD, de canto en la vista 4, es la
              propia línea nueva.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B_4, solucion.cantomas)
            guia: figura.segmento("nueva")
            rotulo: canto
            bloque: Cambio de plano con BD de punta
            porque: |
              Con el cartabón apoyado en la línea nueva, por B₄ ≡ D₄, la recta a 30° hacia el lado de A₄ y
              hacia fuera de la planta, larga: el plano del hexágono, de canto. Forma 30° con la chapa y sube
              desde BD inclinado hacia A.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(JabA), solucion.G4mas), segmento2(proy_planta(IabA), solucion.H4mas)]'
            guia: figura.segmento("nueva")
            bloque: Cambio de plano con BD de punta
            porque: |
              Por J₀ y G₀, que están a la misma distancia de BD (J₀G₀ es paralela a BD), la perpendicular a
              la línea nueva hasta pasarla; lo mismo por I₀ y H₀. Es llevar los abatidos a la vista 4:
              abatidos están en la chapa, y caen en la línea nueva.
          - con: marca
            traza: solucion.GabA_4
            rotulo: (G₀)₄
            bloque: Cambio de plano con BD de punta
            porque: |
              (G₀)₄, nombre nuestro: donde la recta de J₀ y G₀ corta la línea nueva. Es G abatido visto en la
              vista 4, y J₀ cae en el mismo punto.
          - con: marca
            traza: solucion.HabA_4
            rotulo: (H₀)₄
            bloque: Cambio de plano con BD de punta
            porque: |
              (H₀)₄, nombre nuestro: donde la recta de I₀ y H₀ corta la línea nueva, más allá de A₄. H₀ e I₀
              están a 34,6 mm de BD; A, a 28,7.
          - con: compas
            traza: 'arco(solucion.B_4, por: solucion.GabA_4, desde: solucion.GabA_4, hasta: desplaza(solucion.G_4, dx: -1.34, dy: 3.15))'
            bloque: Giro de 30° alrededor de BD
            porque: |
              Con centro en B₄ ≡ D₄, que es la charnela vista de punta, y radio hasta (G₀)₄, el arco que sube
              G y J hasta el canto: deshacer el abatimiento es girar 30° alrededor de BD, y en la vista 4 ese
              giro se ve tal cual.
          - con: marca
            traza: solucion.G_4
            rotulo: G₄ ≡ J₄
            bloque: Giro de 30° alrededor de BD
            porque: |
              G₄ ≡ J₄, donde el arco corta el canto: G y J en su sitio, vistos con BD de punta.
          - con: compas
            traza: 'arco(solucion.B_4, por: solucion.HabA_4, desde: solucion.HabA_4, hasta: desplaza(solucion.H_4, dx: -2.68, dy: 6.31))'
            bloque: Giro de 30° alrededor de BD
            porque: |
              Lo mismo con radio hasta (H₀)₄: el arco que sube H e I hasta el canto, también 30°.
          - con: marca
            traza: solucion.H_4
            rotulo: H₄ ≡ I₄
            bloque: Giro de 30° alrededor de BD
            porque: |
              H₄ ≡ I₄, donde el segundo arco corta el canto, el doble de lejos de B₄ que G₄.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.G_4, solucion.J1lejos), segmento2(solucion.H_4, solucion.I1lejos)]'
            guia: figura.segmento("nueva")
            bloque: Giro de 30° alrededor de BD
            porque: |
              De vuelta a la planta, por las perpendiculares a la línea nueva que salen de G₄ ≡ J₄ y de
              H₄ ≡ I₄, largas, hasta pasar la chapa. Cruzan la línea nueva en el pie de cada punto: lo que
              G₄ se aparta de ella es la cota de G sobre la chapa.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(GabA), solucion.G1mas), segmento2(proy_planta(JabA), solucion.J1mas), segmento2(proy_planta(HabA), solucion.H1mas), segmento2(proy_planta(IabA), solucion.I1mas)]'
            guia: segmento2(figura.punto("B1"), figura.punto("D1"))
            bloque: Giro de 30° alrededor de BD
            porque: |
              Desde G₀, J₀, H₀ e I₀, las perpendiculares a BD, hacia BD: al desabatir, cada vértice vuelve
              por el camino por el que se abatió, y se acerca a BD (en la planta queda a cos 30° de su
              distancia abatida).
          - con: marca
            traza: proy_planta(G)
            rotulo: G₁
            bloque: Giro de 30° alrededor de BD
            porque: |
              G₁, donde la perpendicular a BD por G₀ corta la paralela a BD que sale de G₄ ≡ J₄. Cae sobre
              A₁D₁.
          - con: marca
            traza: proy_planta(J)
            rotulo: J₁
            bloque: Giro de 30° alrededor de BD
            porque: |
              J₁, donde la perpendicular a BD por J₀ corta esa misma paralela, por encima de A₁B₁.
          - con: marca
            traza: proy_planta(H)
            bloque: Giro de 30° alrededor de BD
            porque: |
              H₁, donde la perpendicular a BD por H₀ corta la paralela que sale de H₄ ≡ I₄, a 1,4 mm de A₁ y
              por fuera de la chapa. Va sin rótulo: el suyo pisaría el de A₁.
          - con: marca
            traza: proy_planta(I)
            rotulo: I₁
            bloque: Giro de 30° alrededor de BD
            porque: |
              I₁, donde la perpendicular a BD por I₀ corta la paralela que sale de H₄ ≡ I₄.
          - con: arista-vista
            traza: '[segmento2(proy_planta(E), proy_planta(F)), segmento2(proy_planta(F), proy_planta(G)), segmento2(proy_planta(G), proy_planta(H)), segmento2(proy_planta(H), proy_planta(I)), segmento2(proy_planta(I), proy_planta(J)), segmento2(proy_planta(J), proy_planta(E))]'
            porque: |
              **La planta, a limpio.** El hexágono: E₁F₁ sobre BD, y los demás lados. Ya no es regular:
              los lados que suben se acortan. Va entero en continua, porque queda todo por encima de la
              chapa ABCD y nada pasa por encima de él.
          - con: arista-oculta
            traza: segmento2(figura.punto("A1"), solucion.k_AB_JE)
            porque: |
              El hexágono tapa el rincón A: A₁ queda dentro de su planta. A₁B₁, de A₁ hasta donde la
              cruza J₁E₁, a trazos: ahí la chapa va por debajo del hexágono, 11,1 mm a mitad del tramo.
          - con: arista-vista
            traza: segmento2(solucion.k_AB_JE, figura.punto("B1"))
            porque: |
              Y el resto de A₁B₁, del cruce con J₁E₁ a B₁, en continua: ya no hay hexágono encima. El
              tramo tapado de A₁D₁, de A₁ a G₁H₁, va pegado a G₁H₁, a menos de 0,4 mm, y lo cubre su
              continua; B₁C₁ y C₁D₁ se ven enteros y ya están dibujados.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), solucion.E2mas), segmento2(proy_planta(F), solucion.F2mas), segmento2(proy_planta(G), solucion.G2arriba), segmento2(proy_planta(J), solucion.J2arriba), segmento2(proy_planta(H), solucion.H2arriba), segmento2(proy_planta(I), solucion.I2arriba)]'
            porque: |
              Los alzados, por las verticales de las seis plantas, hasta pasar A₂B₂ por arriba: E y F están
              en la chapa, y los otros cuatro, por encima.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta A₂B₂: E está en la chapa.
          - con: marca
            traza: proy_alzado(F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta A₂B₂.
          - con: compas
            traza: 'arco(solucion.Jp, por: proy_alzado(J), desde: desplaza(proy_alzado(J), dx: 3, dy: 0), hasta: desplaza(proy_alzado(J), dx: -3, dy: 0))'
            toma: segmento2(solucion.G_4, solucion.pieG4)
            bloque: Vuelta al alzado
            porque: |
              Con el compás, lo que G₄ ≡ J₄ dista de la línea nueva: de G₄ a donde su perpendicular corta la
              línea. Es la cota de J sobre la chapa. Con centro donde la vertical de J₁ corta A₂B₂, hacia
              arriba: J está por encima de la chapa.
          - con: marca
            traza: proy_alzado(J)
            rotulo: J₂
            bloque: Vuelta al alzado
            porque: |
              J₂, donde el arco corta la vertical de J₁, por encima de A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(J), solucion.G2mas)
            bloque: Vuelta al alzado
            porque: |
              Por J₂, la horizontal hacia la izquierda, hasta pasar la vertical de G₁: G tiene la misma cota
              que J.
          - con: marca
            traza: proy_alzado(G)
            rotulo: G₂
            bloque: Vuelta al alzado
            porque: |
              G₂, donde la horizontal de J₂ corta la vertical de G₁.
          - con: compas
            traza: 'arco(solucion.Ip, por: proy_alzado(I), desde: desplaza(proy_alzado(I), dx: 6, dy: 0), hasta: desplaza(proy_alzado(I), dx: -6, dy: 0))'
            toma: segmento2(solucion.H_4, solucion.pieH4)
            bloque: Vuelta al alzado
            porque: |
              Lo que H₄ ≡ I₄ dista de la línea nueva, con centro donde la vertical de I₁ corta A₂B₂, hacia
              arriba.
          - con: marca
            traza: proy_alzado(I)
            rotulo: I₂
            bloque: Vuelta al alzado
            porque: |
              I₂, donde el arco corta la vertical de I₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(I), solucion.H2mas)
            bloque: Vuelta al alzado
            porque: |
              Por I₂, la horizontal hacia la izquierda, hasta pasar la vertical de H₁: H tiene la cota de I.
          - con: marca
            traza: proy_alzado(H)
            rotulo: H₂
            bloque: Vuelta al alzado
            porque: |
              H₂, donde la horizontal de I₂ corta la vertical de H₁.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(F), proy_alzado(G)), segmento2(proy_alzado(G), proy_alzado(H)), segmento2(proy_alzado(H), proy_alzado(I)), segmento2(proy_alzado(I), proy_alzado(J)), segmento2(proy_alzado(J), proy_alzado(E))]'
            porque: |
              **El alzado, a limpio.** El hexágono: E₂F₂ va sobre A₂B₂, que ya está, y los demás lados
              por encima, en continua: la chapa se ve de canto, como una recta, y no tapa nada. G₂J₂ y
              H₂I₂ son horizontales, como E₂F₂: los tres son paralelos a BD, que es horizontal.
        pista: |
          (1) Redibuja el hexágono abatido. (2) B₁D₁ prolongada da B₄ ≡ D₄ en la línea nueva; la paralela a
          BD por A₁, A₄. (3) El canto: 30° desde la línea nueva, hacia A₄. (4) Las paralelas a BD por J₀G₀ y
          por I₀H₀ dan (G₀)₄ y (H₀)₄; arcos de centro B₄ hasta el canto. (5) De G₄ y H₄, paralelas a BD;
          cortadas por las perpendiculares a BD desde los abatidos, dan las plantas. (6) En el alzado, las
          cotas: lo que G₄ y H₄ distan de la línea nueva. (7) En la planta el hexágono va por encima y
          tapa el rincón A: A₁B₁, a trazos hasta J₁E₁. En el alzado la chapa es una recta y no tapa nada.
        desarrollo: |
          En verde claro, el canto de la vista 4 y las dos proyecciones del hexágono, con lo oculto a
          trazos. En la planta, G₁ y J₁ quedan a 15 mm de BD y H₁ e I₁ a 30 mm (r · cos 30°); en el
          alzado, G₂ y J₂ a 8,66 mm de la chapa y H₂ e I₂ a 17,32 mm (r · sen 30°). H₁ se sale de la
          chapa por el rincón A, a 1,4 mm de A₁, y G₁ cae sobre A₁D₁: el hexágono tapa en la planta
          ese rincón. A₁B₁ va oculta desde A₁ hasta donde la cruza J₁E₁, a 32,9 mm de A₁: a mitad de
          ese tramo, el hexágono va 11,1 mm más alto que el lado AB. A₁D₁ también queda tapada desde
          A₁ hasta donde la cruza G₁H₁, a 16,1 mm, casi en G₁; pero A₁ está a 0,36 mm de G₁H₁ y G₁ a
          0,01 mm de A₁D₁, así que ese tramo va pegado a G₁H₁, que se ve, y en el papel lo cubre: es
          una casualidad de las medidas, no un error del dibujo. B₁C₁ y C₁D₁, lejos del hexágono, en
          continua. En el alzado la chapa ABCD se ve de canto y no tapa nada: el hexágono, por encima,
          va entero en continua, y solo la toca en la soldadura, E₂F₂. La diagonal BD no es una
          arista de la chapa: sirvió de charnela.

      - tipo: calcular
        titulo: La altura del lado más alto
        pregunta: ¿A qué altura sobre la chapa ABCD queda HI, el lado del hexágono opuesto a la soldadura?
        respuesta:
          tipo: numero
          valor: '17.32'
          receta: alturaHI_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '34.64'
            receta: en_mm(vm(H, pieH))
            mensaje: |
              Eso es lo que HI dista de BD **de verdad**: la altura del hexágono, 20 · √3. Esa distancia va
              por el plano del hexágono, inclinada 30°; lo que sube es la mitad, porque sen 30° = 1/2.
          - valor: '30.00'
            receta: en_mm(vm_planta(H, pieH))
            mensaje: |
              Eso es lo que H₁ dista de B₁D₁ en la planta, 34,64 · cos 30°: lo que HI se aparta de BD en
              horizontal, no lo que sube.
          - valor: '8.66'
            receta: en_mm(diferencia_de_cotas(G, B))
            mensaje: |
              Esa es la cota de G y de J, los vértices de en medio, que están a la mitad de distancia de BD.
              HI está el doble de lejos, y sube el doble.
        pista: |
          Mide de H₂I₂ a A₂B₂ con «medir» del Taller, en el paso de la vuelta (el tercero), o en tu lámina
          de papel; o, en la vista 4, lo que H₄ ≡ I₄ se aparta de la línea nueva. También sale de la cuenta.
        desarrollo: |
          HI está a la altura del hexágono de BD, 20 · √3 = 34,64 mm, medida en su plano, que forma 30° con
          la chapa:

          $$ h = 34{,}64 \cdot \operatorname{sen} 30^\circ = 17{,}32 \text{ mm} $$

          En la planta, ese mismo lado queda a 34,64 · cos 30° = 30,00 mm de BD. Ojo, que 17,32 también lo
          miden B₄G₄ (la distancia real de G y J a BD, el radio del primer arco de la vista 4) y la apotema del
          hexágono, porque sen 30° = 1/2; y F₁G₁, en la planta, 18,03, cae dentro de la tolerancia. Quien dé
          alguna de esas medidas recibe un «bien» que no ha ganado: mide de H₂I₂ a A₂B₂.

          Hay más cifras en la vecindad, todas por casualidad y ninguna es una altura: en el alzado, A₂F₂ y
          E₂B₂ miden 16,80 mm, y E₂F₂ y H₂I₂, 16,39; y en la planta, G₁ parte el borde A₁D₁ en 16,65 y 18,31
          mm, y los lados inclinados G₁H₁, I₁J₁ y J₁E₁ miden 18,03 mm, como F₁G₁. Y el tramo visto de
          A₁B₁, el que se pasa a limpio del cruce con J₁E₁ a B₁, mide 17,07 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: La chapa ABCD es horizontal, así que su planta está en verdadera magnitud, y BD, horizontal y común a las dos chapas, sirve de charnela.
          - texto: Abatido sobre la chapa, el hexágono se dibuja en la planta, regular, con el lado EF sobre B₁D₁ y centrado en O₁.
          - texto: Con la línea nueva perpendicular a BD, BD se ve de punta y el plano del hexágono de canto, una recta por B₄ ≡ D₄ a 30° de la chapa y hacia el lado de A.
          - texto: Cada vértice sube al canto con un arco de centro B₄ ≡ D₄ y vuelve a la planta por la paralela a BD y por la perpendicular a BD que sale de su abatido; su cota pasa al alzado.
          - texto: El ángulo de 30° se lleva en el alzado, entre A₂B₂ y el alzado del hexágono.
            trampa: true
            mensaje: |
              En el alzado el plano del hexágono no se ve de canto, porque BD no es de punta: es oblicua en
              la planta. El ángulo entre dos planos se ve donde su recta común se ve como un punto, y eso
              pasa en la vista 4.
    resolucion: |
      **Qué fija el enunciado.** En el alzado, D₂ ≡ A₂ y C₂ ≡ B₂ están a la misma altura: la chapa ABCD es
      horizontal, de 50 × 35 mm. La hexagonal tiene un lado, EF, sobre la diagonal BD y centrado en ella, y
      su plano forma 30° con la chapa. «Inclinada hacia el vértice A» la deja subiendo desde BD, por encima
      de ABCD y del lado de A.

      **El abatimiento.** BD es horizontal y está en las dos chapas: con ella de charnela, el hexágono se
      abate sobre la chapa y se dibuja en la planta, regular. E₁ y F₁, a 10 mm de O₁ sobre B₁D₁; K₀, el
      centro, con dos arcos de 20 mm; y los demás vértices, llevando el lado sobre la circunferencia de
      centro K₀.

      **La vuelta.** Con la línea nueva perpendicular a BD y B de referencia, la chapa cae en la línea
      nueva y BD en un punto, B₄ ≡ D₄; el plano del hexágono es la recta a 30° hacia el lado de A₄. Los
      abatidos caen en la línea nueva, y un arco de centro B₄ ≡ D₄ los sube al canto. De vuelta, cada
      vértice queda en la planta a cos 30° de su distancia abatida a BD (15 y 30 mm), y en el alzado a sen
      30° por encima de la chapa (8,66 y 17,32 mm).

      **La visibilidad.** En el alzado la chapa es una recta y no tapa nada. En la planta el hexágono va
      por encima y tapa el rincón A: H₁ sale 1,4 mm por fuera de A₁, y G₁ cae sobre A₁D₁. A₁B₁ queda
      oculta en sus primeros 32,9 mm y A₁D₁ en sus primeros 16,1 mm, pegada a G₁H₁, a menos de 0,4 mm:
      en el dibujo la cubre G₁H₁, que se ve.

  - id: sd65-el-agujero-cuadrado-del-tubo-a-45
    titulo: El agujero cuadrado para el tubo a 45°, en la cara inclinada del depósito
    fuente: Ejercicio 49 (SD65) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 50), con
    # sus comillas «a» y su «45º». «a» no lleva cifra: es el segmento dibujado,
    # que mide 20 mm a escala 1:1, y lo decimos en las notas y en el intro. La
    # perforación cuadrada es el agujero EN LA CARA (lectura literal: «La
    # perforación será cuadrada»), centrado donde el eje pincha la cara, con dos
    # lados horizontales. El método no lo impone: el centro por el plano vertical
    # del eje, y el cuadrado abatiendo la cara alrededor de PQ.
    enunciado: |
      En la cara superior del depósito representado quiere hacerse una perforación para acoplar un tubo.
      La perforación será cuadrada de lado «a» y debe tener dos lados horizontales. Datos: el eje del
      tubo pasa por el punto A en su proyección horizontal según la dirección indicada y forma un ángulo
      de 45º con el suelo. Dibujar las proyecciones diédricas del agujero.

      **Notas nuestras.** La figura es el depósito en el alzado, arriba, y en la planta, debajo,
      con el punto A dado por sus dos proyecciones y, arriba a la izquierda, el segmento «a». La hoja
      no da escala: la leemos a 1:1, en milímetros de la lámina. En la
      planta, el depósito es un rectángulo girado, de 45,6 × 35,4 mm. En el alzado se ve que su cara de
      arriba es un plano inclinado, más alto por detrás que por delante. Por A₁ pasa una recta de trazo y
      punto: es «la dirección indicada». «a» no lleva cifra en la página; el segmento mide 20 mm (20,02 su
      trazo y 19,97 entre las cruces), y esa es la medida con la que trabajamos. Leemos que lo cuadrado
      es la perforación, el agujero de la cara: un cuadrado de lado a en la cara inclinada, con dos lados
      horizontales y centrado donde el eje del tubo la pincha. Si lo cuadrado fuera la sección recta de un
      tubo de lado a, el agujero sería un paralelogramo de unos 21,5 × 20 mm, sin lados horizontales (los
      que vienen de los horizontales del tubo, a 4° de ellos en la cara). La figura no nombra nada más. Aquí llamamos P, Q, R y S a los
      vértices de la cara de arriba: P, el de la izquierda, y Q, el de detrás, son los más altos; R, el de
      la derecha, y S, el de delante, los más bajos. I es el centro del agujero, y J, K, L y N, sus
      vértices: J y K, los del lado de más cota, con J del lado de P; L y N, los del otro, con N del lado
      de P.
    pide: Las proyecciones del agujero cuadrado —su planta y su alzado— y, antes, las de su centro, donde el eje del tubo pincha la cara; y, como pregunta nuestra, cuánto miden en la planta sus lados que no son horizontales.
    receta:
      lamina: sd65
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        R: 'punto3(alzado: figura.punto("R2"), planta: figura.punto("R1"))'
        S: 'punto3(alzado: figura.punto("S2"), planta: figura.punto("S1"))'
        cara: plano(P, Q, S)
        # «a», el trazo de arriba a la izquierda: 56,76 pt, 20,02 mm.
        lado: 'vm_planta(punto3(alzado: figura.punto("aI"), planta: figura.punto("aI")), punto3(alzado: figura.punto("aF"), planta: figura.punto("aF")))'
      solucion:
        # El eje: por A, con la planta por e₁ hacia el depósito (X1), y a 45° con
        # el suelo. Se gira 45° hacia abajo el punto de e₁ a la cota de A,
        # alrededor de la horizontal por A perpendicular a e₁.
        Ax: 'punto3(alzado: desplaza(figura.punto("A2"), dx: 50), planta: desplaza(figura.punto("A1"), dx: 50))'
        Ay: 'punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 50))'
        cotaA: plano(A, Ax, Ay)
        Xh: 'punto_en_plano(planta: figura.punto("X1"), plano: cotaA)'
        Aup: 'punto3(alzado: desplaza(figura.punto("A2"), dy: -50), planta: figura.punto("A1"))'
        verticalA: plano(A, Xh, Aup)
        ejeH: perpendicular_a_plano(A, verticalA)
        T45: 'gira(Xh, ejeH, angulo: 45, sentido: descendente)'
        eje: recta3(A, T45)
        I: corte_recta_plano(eje, cara)
        # E y F: donde la planta del eje cruza las aristas S₁R₁ y P₁Q₁. El plano
        # vertical del eje corta la cara por EF.
        EFc: 'cortes(recta3(I, A), [segmento3(S, R), segmento3(P, Q)])'
        E: uno(EFc, 1)
        F: uno(EFc, 2)
        Farr: 'punto3(alzado: desplaza(proy_alzado(F), dy: -20), planta: proy_planta(F))'
        T: pie_comun(eje, recta3(F, Farr))
        Y: 'punto_en_plano(planta: proy_planta(F), plano: cotaA)'
        # El error de dibujar el alzado del eje a 45° en el papel: baja en el
        # alzado lo que avanza en x, vm_alzado(A, Y).
        Tmal: 'punto3(alzado: desplaza(proy_alzado(Y), dy: vm_alzado(A, Y)), planta: proy_planta(F))'
        Imal: corte_recta_plano(recta3(A, Tmal), cara)
        # Decisión: la charnela es PQ, la arista alta de la cara, una horizontal
        # del plano ya dibujada en las dos vistas. Va de Q a P: así el abatimiento
        # hacia fuera de la cara (lejos de S) es la rama 1.
        ch: recta3(Q, P)
        M: pie_perpendicular(I, ch)
        I_ab: abatido_a_elegir(I, ch, cara)
        # El cuadrado en la cara: U y W, los puntos medios de los lados
        # horizontales, a a/2 de I por la l.m.p. (U, subiendo, hacia M); Xp y
        # Xq, los de los otros dos, por la horizontal de I (Xp, hacia P).
        h: lado / 2
        U: 'rama(punto_a_distancia(recta3(I, M), desde: I, distancia: h), 1)'
        W: 'simetrico(U, respecto: I)'
        XX: 'punto_a_distancia(horizontal_por(I, cara), desde: I, distancia: h)'
        Xp: rama(XX, 2)
        Xq: rama(XX, 1)
        J: 'simetrico(I, respecto: punto_medio(segmento3(U, Xp)))'
        K: 'simetrico(I, respecto: punto_medio(segmento3(U, Xq)))'
        L: 'simetrico(J, respecto: I)'
        N: 'simetrico(K, respecto: I)'
        J_ab: 'abatido_junto(J, ch, cara, con: I_ab, de: I)'
        K_ab: 'abatido_junto(K, ch, cara, con: I_ab, de: I)'
        L_ab: 'abatido_junto(L, ch, cara, con: I_ab, de: I)'
        N_ab: 'abatido_junto(N, ch, cara, con: I_ab, de: I)'
        # La rama 1 de cada abatido, para las listas de la construcción.
        IabF: rama(I_ab, 1)
        JabF: rama(J_ab, 1)
        KabF: rama(K_ab, 1)
        LabF: rama(L_ab, 1)
        NabF: rama(N_ab, 1)
        UabF: 'rama(abatido_junto(U, ch, cara, con: I_ab, de: I), 1)'
        WabF: 'rama(abatido_junto(W, ch, cara, con: I_ab, de: I), 1)'
        # Donde las diagonales cortan la charnela: no se mueven al abatir.
        G: pie_comun(recta3(J, L), ch)
        H: pie_comun(recta3(K, N), ch)
        # El triángulo del radio de I: lo que I está por debajo de PQ, llevado
        # desde I₁ por la paralela a la charnela, hacia Q.
        dz: diferencia_de_cotas(I, P)
        parI: 'perpendicular(por: proy_planta(I), a: perpendicular(por: proy_planta(I), a: proy_planta(ch)))'
        I01: 'uno(medir_sobre(parI, desde: proy_planta(I), distancia: dz), 1)'
        I01mas: 'uno(medir_sobre(parI, desde: proy_planta(I), distancia: dz + 8), 1)'
        Ih2: 'pie_perpendicular(proy_alzado(I), figura.segmento("PQ2"))'
        # Los errores del radio: solo el cateto de la cota, o solo el de la planta.
        Icat: 'uno(medir_sobre(segmento2(proy_planta(M), proy_planta(IabF)), desde: proy_planta(M), distancia: dz), 1)'
        Iplan: 'uno(medir_sobre(segmento2(proy_planta(M), proy_planta(IabF)), desde: proy_planta(M), distancia: vm_planta(I, M)), 1)'
        # El cuadrado girado 45°: un vértice en la perpendicular a la charnela.
        Jgir: 'uno(medir_sobre(segmento2(proy_planta(IabF), proy_planta(M)), desde: proy_planta(IabF), distancia: h * raiz(2)), 1)'
        # Las rectas largas de la construcción.
        F1mas: 'uno(medir_sobre(segmento2(figura.punto("X1"), proy_planta(F)), desde: proy_planta(F), distancia: 10), 1)'
        E2mas: 'desplaza(proy_alzado(E), dy: -8)'
        Ymas: 'desplaza(proy_alzado(Y), dy: -8)'
        Yizq: 'desplaza(proy_alzado(Y), dx: -8)'
        I2arriba: 'desplaza(proy_alzado(I), dy: -26)'
        I1mas: 'desplaza(proy_planta(I), dy: 8)'
        perpLejos: 'uno(medir_sobre(segmento2(proy_planta(I), proy_planta(M)), desde: proy_planta(M), distancia: 80), 1)'
        dLmas: 'uno(medir_sobre(segmento2(proy_planta(IabF), proy_planta(LabF)), desde: proy_planta(LabF), distancia: 8), 1)'
        dGmas: 'uno(medir_sobre(segmento2(proy_planta(IabF), proy_planta(G)), desde: proy_planta(G), distancia: 8), 1)'
        dNmas: 'uno(medir_sobre(segmento2(proy_planta(IabF), proy_planta(NabF)), desde: proy_planta(NabF), distancia: 8), 1)'
        dHmas: 'uno(medir_sobre(segmento2(proy_planta(IabF), proy_planta(H)), desde: proy_planta(H), distancia: 8), 1)'
        J0mas: 'uno(medir_sobre(segmento2(proy_planta(UabF), proy_planta(JabF)), desde: proy_planta(JabF), distancia: 6), 1)'
        K0mas: 'uno(medir_sobre(segmento2(proy_planta(UabF), proy_planta(KabF)), desde: proy_planta(KabF), distancia: 6), 1)'
        L0mas: 'uno(medir_sobre(segmento2(proy_planta(WabF), proy_planta(LabF)), desde: proy_planta(LabF), distancia: 6), 1)'
        N0mas: 'uno(medir_sobre(segmento2(proy_planta(WabF), proy_planta(NabF)), desde: proy_planta(NabF), distancia: 6), 1)'
        N1mas: 'uno(medir_sobre(segmento2(proy_planta(NabF), proy_planta(N)), desde: proy_planta(N), distancia: 8), 1)'
        L1mas: 'uno(medir_sobre(segmento2(proy_planta(LabF), proy_planta(L)), desde: proy_planta(L), distancia: 8), 1)'
        L1diag: 'uno(medir_sobre(segmento2(proy_planta(G), proy_planta(L)), desde: proy_planta(L), distancia: 8), 1)'
        N1diag: 'uno(medir_sobre(segmento2(proy_planta(H), proy_planta(N)), desde: proy_planta(N), distancia: 8), 1)'
        G2mas: 'desplaza(proy_alzado(G), dy: -6)'
        H2mas: 'desplaza(proy_alzado(H), dy: -6)'
        L2diag: 'uno(medir_sobre(segmento2(proy_alzado(G), proy_alzado(L)), desde: proy_alzado(L), distancia: 8), 1)'
        N2diag: 'uno(medir_sobre(segmento2(proy_alzado(H), proy_alzado(N)), desde: proy_alzado(N), distancia: 8), 1)'
        J2mas: 'desplaza(proy_alzado(J), dy: -4)'
        K2mas: 'desplaza(proy_alzado(K), dy: -4)'
        L2mas: 'desplaza(proy_alzado(L), dy: -6)'
        N2mas: 'desplaza(proy_alzado(N), dy: -6)'
        perpI: 'perpendicular(por: proy_planta(I), a: proy_planta(ch))'
        perpJN: 'perpendicular(por: proy_planta(J), a: proy_planta(ch))'
        perpKL: 'perpendicular(por: proy_planta(K), a: proy_planta(ch))'
        lado_planta_mm: en_mm(vm_planta(J, N))
      comprueba:
        - en_plano(R, cara)
        - en_plano(I, cara)
        - en_recta(I, eje)
        - en_plano(J, cara)
        - en_plano(L, cara)
        - en_recta(G, ch)
        - en_recta(H, ch)
    pasos:
      - tipo: reconocer
        pregunta: La perforación es cuadrada, de lado a, y tiene dos lados horizontales. ¿Dónde mide a × a?
        opciones:
          - texto: En la cara de arriba del depósito, que es un plano inclinado
            correcta: true
            mensaje: |
              Eso es. Lo que el enunciado llama perforación es el agujero, y el agujero está en la cara de
              arriba. Esa cara no es horizontal ni frontal, así que el cuadrado se dibuja abatido, en
              verdadera magnitud, y en la planta y el alzado sale deformado.
          - texto: En la planta, donde se dibuja un cuadrado de lado a alrededor de I₁
            mensaje: |
              La cara está inclinada 23,9°, y la planta acorta lo que sube: los dos lados que van por la
              línea de máxima pendiente miden en la planta 18,3 mm, no 20. En la planta el agujero es un
              rectángulo.
          - texto: En la sección del tubo perpendicular a su eje
            mensaje: |
              Con la lectura que tomamos (notas del enunciado), no: el enunciado dice que la
              **perforación** es cuadrada, y la perforación es el agujero de la cara. Un tubo de sección
              cuadrada a 45° cortaría la cara en un paralelogramo de unos 21,5 × 20 mm, sin lados
              horizontales.

      - tipo: construir
        titulo: El centro del agujero, donde el eje pincha la cara
        intro: |
          El centro del agujero es I, donde el eje del tubo pincha la cara de arriba: el eje del tubo es el
          del agujero. El enunciado no dice cómo sacarlo, y lo hacemos con el plano vertical que contiene
          al eje, un proyectante horizontal, que en la planta se ve como la recta e₁. Corta las aristas
          S₁R₁ y P₁Q₁ en E₁ y F₁ (nombres nuestros), y la cara, por EF. El eje sale de A hacia el depósito
          y baja 45°; hacia el otro lado no llegaría nunca a la cara. Para su alzado hace falta otro punto
          suyo: T, el que cae en la vertical de F₁ (nombre nuestro). A 45°, el eje baja lo mismo que avanza
          en la planta. Marca T₂, I₂ e I₁.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: T2
            pide: T, el punto del eje en la vertical de F₁, en el alzado
            es: proy_alzado(T)
            bien: |
              T₂ está en la vertical de F₁, A₁F₁ (52,4 mm) por debajo de la horizontal de A₂: de A a T el eje
              avanza A₁F₁ en la planta y, a 45°, baja lo mismo. Cae por debajo de la arista PQ, en la pared
              de detrás del depósito: el eje pincha la cara antes.
            diagnosticos:
              - si: cerca_de(proy_alzado(Tmal))
                mensaje: |
                  Has dibujado el alzado del eje a 45°, y casi llegas a F₂. El eje forma 45° con el suelo,
                  pero no es frontal: su planta es oblicua, y el alzado no lo enseña en verdadera magnitud.
                  Lo que baja se mide con lo que avanza **en la planta**, A₁F₁.
                ejemplo: proy_alzado(Tmal)
              - si: '!en_vertical_de(proy_planta(F))'
                mensaje: |
                  T₂ va en la **vertical de F₁**: T es el punto del eje que está encima o debajo de F.
                ejemplo: 'desplaza(proy_alzado(T), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de F₁, pero no a la altura buena: T está A₁F₁ por debajo de la
                  horizontal de A₂. Con el compás, A₁F₁, y centro en el cruce de esa horizontal con la
                  vertical de F₁, hacia abajo.
          - nombre: I2
            pide: I, el centro del agujero, en el alzado
            es: proy_alzado(I)
            bien: |
              I₂ está donde el alzado del eje, A₂T₂, corta E₂F₂: el eje está en el plano vertical, y E₂F₂ es lo
              que ese plano tiene de cara.
            diagnosticos:
              - si: cerca_de(proy_alzado(Imal))
                mensaje: |
                  Con el alzado del eje a 45° saldría ahí, casi en la arista alta. El eje forma 45° con el
                  suelo, pero en el alzado se ve más empinado (58,6°), porque su planta es oblicua.
                ejemplo: proy_alzado(Imal)
              - si: '!en_recta(segmento2(proy_alzado(E), proy_alzado(F)))'
                mensaje: |
                  I está en la cara y en el plano vertical del eje, así que su alzado cae **en E₂F₂**: E₂ en
                  S₂R₂ y F₂ en P₂Q₂, en las verticales de E₁ y F₁.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("A2"), proy_alzado(T)), desde: proy_alzado(I), distancia: mm(5)), 1)'
              - si: '!en_recta(segmento2(figura.punto("A2"), proy_alzado(T)))'
                mensaje: |
                  I está en el eje: su alzado va **en A₂T₂**.
                ejemplo: 'uno(medir_sobre(segmento2(proy_alzado(E), proy_alzado(F)), desde: proy_alzado(I), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  I₂ es el cruce de A₂T₂ con E₂F₂.
          - nombre: I1
            pide: I, el centro del agujero, en la planta
            es: proy_planta(I)
            bien: |
              I₁ está en e₁, en la vertical de I₂, entre E₁ y F₁: a 38,2 mm de A₁ en la planta. De A a I el
              eje baja lo mismo, 38,2 mm.
            diagnosticos:
              - si: '!en_vertical_de(I2)'
                mensaje: |
                  I₁ va en la **vertical de I₂**.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("X1"), proy_planta(F)), desde: proy_planta(I), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("e1"))'
                mensaje: |
                  I está en el eje: I₁ va **en e₁**, prolongada.
                ejemplo: 'desplaza(proy_planta(I), dy: mm(5))'
              - si: siempre
                mensaje: |
                  I₁ está donde la vertical de I₂ corta e₁.
        trazado:
          - segmento2(figura.punto("X1"), proy_planta(F))
          - segmento2(proy_alzado(E), proy_alzado(F))
          - segmento2(figura.punto("A2"), proy_alzado(T))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("X1"), solucion.F1mas)
            porque: |
              La planta del eje, e₁, prolongada con la regla hacia el depósito, hasta pasar la arista P₁Q₁:
              el eje baja desde A hacia la cara de arriba, y su planta la cruza.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, nombre nuestro: donde la planta del eje corta S₁R₁, la arista baja de la cara.
          - con: marca
            traza: proy_planta(F)
            rotulo: F₁
            porque: |
              F₁, nombre nuestro: donde corta P₁Q₁, la arista alta. EF es la recta por la que el plano
              vertical del eje corta la cara.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), solucion.E2mas), segmento2(proy_planta(F), solucion.Ymas)]'
            porque: |
              Las verticales de E₁ y de F₁. La de E₁, hasta pasar S₂R₂; la de F₁, larga, hasta pasar la altura
              de A₂: por ella pasan F₂ y el punto del eje que se busca.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta S₂R₂: E está en la arista SR.
          - con: marca
            traza: proy_alzado(F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta P₂Q₂: F está en la arista PQ.
          - con: regla
            traza: segmento2(proy_alzado(E), proy_alzado(F))
            porque: |
              E₂F₂, el alzado de la recta en que el plano vertical del eje corta la cara. El eje pincha la
              cara en un punto de esa recta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.Yizq)
            porque: |
              Por A₂, la horizontal hacia la izquierda, hasta pasar la vertical de F₁: es la cota de A, desde
              la que se mide lo que baja el eje.
          - con: marca
            traza: proy_alzado(Y)
            rotulo: Y
            porque: |
              Y, nombre nuestro: donde la horizontal de A₂ corta la vertical de F₁. Está a la cota de A.
          - con: compas
            traza: 'arco(proy_alzado(Y), por: proy_alzado(T), desde: desplaza(proy_alzado(T), dx: -6, dy: 0), hasta: desplaza(proy_alzado(T), dx: 6, dy: 0))'
            toma: segmento2(figura.punto("A1"), proy_planta(F))
            porque: |
              A 45°, el eje baja lo mismo que avanza en la planta. De A a F avanza A₁F₁, que es horizontal y
              se ve tal cual. Con el compás, A₁F₁, y centro en Y, el arco que corta la vertical de F₁ por
              debajo: por encima también la corta, pero el eje baja de A hacia el depósito.
          - con: marca
            traza: proy_alzado(T)
            rotulo: T₂
            porque: |
              T₂, nombre nuestro: donde el arco corta la vertical de F₁, por debajo de Y. Es el punto del eje
              que está en la vertical de F.
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(T))
            porque: |
              A₂T₂, el alzado del eje. Cruza E₂F₂ antes de llegar a T₂: el eje pincha la cara y sigue por
              dentro del depósito.
          - con: marca
            traza: proy_alzado(I)
            rotulo: I₂
            porque: |
              I₂, donde A₂T₂ corta E₂F₂: el punto que está a la vez en el eje y en la cara, el centro del
              agujero.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(I), solucion.I2arriba), segmento2(proy_alzado(I), solucion.I1mas)]'
            porque: |
              Por I₂, la vertical: hacia abajo, hasta pasar e₁; hacia arriba, hasta pasar P₂Q₂, que servirá
              para medir lo que I está por debajo de la arista alta.
          - con: marca
            traza: proy_planta(I)
            rotulo: I₁
            porque: |
              I₁, donde la vertical de I₂ corta e₁, entre E₁ y F₁.
        pista: |
          (1) e₁ prolongada corta S₁R₁ en E₁ y P₁Q₁ en F₁. (2) Sus verticales dan E₂ en S₂R₂ y F₂ en P₂Q₂.
          (3) En la vertical de F₁, A₁F₁ por debajo de la horizontal de A₂: T₂. (4) A₂T₂ corta E₂F₂ en I₂, y
          la vertical de I₂ corta e₁ en I₁.
        desarrollo: |
          En verde claro, la planta del eje prolongada, E₂F₂ y el alzado del eje, A₂T₂. I₁ queda a 38,2 mm
          de A₁ y a 14,2 mm de la arista alta en la planta; I₂, 6,3 mm por debajo de P₂Q₂. El eje, a 45° con
          el suelo, se ve en el alzado a 58,6°: dibujarlo a 45° es el error que este paso busca, y lleva I
          casi hasta la arista alta.

      - tipo: construir
        titulo: El agujero en verdadera magnitud, con la cara abatida alrededor de PQ
        intro: |
          Abate la cara de arriba alrededor de PQ, su arista alta. El enunciado no impone método, y
          elegimos el que haría el alumno: PQ es una horizontal de la cara, ya dibujada en las dos vistas,
          y es la charnela que conviene. I se abate con su triángulo; en I₀ se dibuja el agujero, un
          cuadrado de lado a (los 20 mm que mide el segmento de la figura) con dos lados horizontales, que
          abatidos son paralelos a la charnela. Vale abatir hacia los dos lados de PQ (la marca de I₀ fija
          el lado), pero la cara está poco inclinada (23,9°): hacia dentro casi no se mueve, y el cuadrado
          caería encima de la planta. Hacia fuera queda limpio. Redibuja primero I₁ e I₂ como en el paso
          anterior. Marca I₀ y los cuatro vértices abatidos: J y K, los del lado de arriba, el más cercano a
          la charnela (J hacia P); L y N, los de abajo (N hacia P). El error de llevar como radio lo que I₁
          dista de la charnela en la planta cae a 1,3 mm de I₀, y K₀, a 2 mm de la vertical de I₂: amplía
          con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I0
            pide: I, el centro del agujero, abatido
            es: proy_planta(I_ab)
            bien: |
              I₀ está en la perpendicular a la charnela que pasa por I₁, a la distancia real de I a PQ, 15,5
              mm: la hipotenusa de lo que I₁ dista de la charnela en la planta (14,2 mm) y de lo que I está por
              debajo de PQ (6,3 mm).
            diagnosticos:
              - si: cerca_de(proy_planta(I))
                mensaje: |
                  Ese es I₁, la planta de I sin abatir. Al abatir, I gira alrededor de PQ hasta quedar a su
                  cota, y en la planta se aparta de ella por la perpendicular.
                ejemplo: proy_planta(I)
              - si: cerca_de(solucion.Icat)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que I está por debajo
                  de PQ**. Eso es un cateto. El radio es la hipotenusa de ese cateto y de lo que separa I₁ de
                  la charnela en la planta.
                ejemplo: solucion.Icat
              - si: cerca_de(solucion.Iplan)
                mensaje: |
                  Muy cerca, pero 1,3 mm corto: es lo que da llevar como radio lo que I₁ dista de la charnela
                  **en la planta**. La planta acorta; con la cota, ese es un cateto del triángulo, y el radio
                  es su hipotenusa.
                ejemplo: solucion.Iplan
              - si: '!en_recta(solucion.perpI)'
                mensaje: |
                  I gira alrededor de la charnela en un plano perpendicular a ella, que es vertical: en la
                  planta, I₀ va por la **perpendicular a la charnela que pasa por I₁**.
                ejemplo: 'desplaza(proy_planta(IabF), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por I₁, pero no a la distancia buena. El radio es
                  la hipotenusa del triángulo que tiene por catetos lo que separa I₁ de P₁Q₁ en la planta y lo
                  que I₂ está por debajo de P₂Q₂.
          - nombre: J0
            pide: J, el vértice de arriba hacia P, abatido
            es: proy_planta(J_ab)
            bien: |
              J₀ está a 10 mm de la perpendicular a la charnela por I₀ y a 10 mm de la paralela, del lado de
              la charnela y de P: en la diagonal que va de I₀ a la charnela a 45°.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(J_ab)))
                mensaje: |
                  Ese es J abatido **al otro lado** de la charnela. La cara gira entera, como una tapa sobre su
                  bisagra: el cuadrado cae al lado de I₀.
                ejemplo: proy_planta(rama(J_ab, 2))
              - si: cerca_de(proy_planta(K_ab))
                mensaje: |
                  Ese es K₀, el otro vértice de arriba. J es el que queda hacia P.
                ejemplo: proy_planta(KabF)
              - si: cerca_de(proy_planta(N_ab))
                mensaje: |
                  Ese es N₀, el de abajo. J está en el lado de arriba: el más cercano a la charnela, que es el
                  de más cota.
                ejemplo: proy_planta(NabF)
              - si: cerca_de(solucion.Jgir)
                mensaje: |
                  Ese cuadrado está girado 45°: tiene un vértice en la perpendicular a la charnela, y sus
                  lados no son horizontales. Los dos lados horizontales del agujero, abatidos, son
                  **paralelos a la charnela**; los vértices van en las diagonales a 45°.
                ejemplo: solucion.Jgir
              - si: siempre
                mensaje: |
                  J₀ está donde la paralela a la charnela por U₀ —a 10 mm de I₀, hacia la charnela— corta la
                  diagonal que va hacia P.
          - nombre: K0
            pide: K, el vértice de arriba hacia Q, abatido
            es: proy_planta(K_ab)
            bien: |
              K₀ está en la misma paralela a la charnela que J₀, a 20 mm de él, en la otra diagonal.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(K_ab)))
                mensaje: |
                  Ese es K abatido **al otro lado** de la charnela: todo el cuadrado cae al lado de I₀.
                ejemplo: proy_planta(rama(K_ab, 2))
              - si: cerca_de(proy_planta(L_ab))
                mensaje: |
                  Ese es L₀, el de abajo hacia Q. K está en el lado de arriba, con J.
                ejemplo: proy_planta(LabF)
              - si: siempre
                mensaje: |
                  K₀ está en la paralela a la charnela por U₀, donde la corta la diagonal que va hacia Q.
          - nombre: L0
            pide: L, el vértice de abajo hacia Q, abatido
            es: proy_planta(L_ab)
            bien: |
              L₀ está en la diagonal de J₀, al otro lado de I₀, y en la paralela a la charnela por W₀.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(L_ab)))
                mensaje: |
                  Ese es L abatido **al otro lado** de la charnela: todo el cuadrado cae al lado de I₀.
                ejemplo: proy_planta(rama(L_ab, 2))
              - si: cerca_de(proy_planta(N_ab))
                mensaje: |
                  Ese es N₀. L es el de abajo hacia Q, el opuesto a J.
                ejemplo: proy_planta(NabF)
              - si: siempre
                mensaje: |
                  L₀ está donde la paralela a la charnela por W₀ corta la diagonal de J₀, al otro lado de I₀.
          - nombre: N0
            pide: N, el vértice de abajo hacia P, abatido
            es: proy_planta(N_ab)
            bien: |
              N₀ cierra el cuadrado abatido: en la paralela por W₀ y en la diagonal de K₀. J₀N₀ y K₀L₀ son
              perpendiculares a la charnela.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(N_ab)))
                mensaje: |
                  Ese es N abatido **al otro lado** de la charnela: todo el cuadrado cae al lado de I₀.
                ejemplo: proy_planta(rama(N_ab, 2))
              - si: siempre
                mensaje: |
                  N₀ está donde la paralela a la charnela por W₀ corta la diagonal de K₀, al otro lado de I₀.
        trazado:
          - segmento2(proy_planta(I), proy_planta(I_ab))
          - segmento2(proy_planta(J_ab), proy_planta(K_ab))
          - segmento2(proy_planta(K_ab), proy_planta(L_ab))
          - segmento2(proy_planta(L_ab), proy_planta(N_ab))
          - segmento2(proy_planta(N_ab), proy_planta(J_ab))
        bloques:
          - nombre: Abatimiento alrededor de PQ
            explica: |
              La cara de arriba no es horizontal ni frontal: el cuadrado solo se dibuja en verdadera
              magnitud con la cara
              [abatida](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano).
              La charnela es PQ, su arista alta, una horizontal de la cara que ya está dibujada en
              las dos vistas, y la elegimos nosotros: la cara cae sobre el plano horizontal de PQ. I
              gira en un plano perpendicular a la charnela, que es vertical, así que en la planta se
              mueve por la perpendicular a P₁Q₁, alrededor de M. Su radio es la distancia real a PQ:
              la hipotenusa de lo que I₁ dista de P₁Q₁ en la planta y de lo que I está por debajo de
              PQ, que se mide en el alzado. Abatidos, los lados horizontales del agujero son
              paralelos a la charnela, y el cuadrado se traza en I₀ con regla y compás.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("X1"), solucion.F1mas)
            porque: |
              Primero, I₁ e I₂ como en el paso anterior: e₁ prolongada hasta pasar P₁Q₁.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, donde e₁ corta S₁R₁.
          - con: marca
            traza: proy_planta(F)
            porque: |
              F₁, donde e₁ corta P₁Q₁. Aquí va sin rótulo: el suyo pisaría el de M, que cae a 1,3 mm.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), solucion.E2mas), segmento2(proy_planta(F), solucion.Ymas)]'
            porque: |
              Las verticales de E₁ y de F₁, la segunda hasta pasar la altura de A₂.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta S₂R₂.
          - con: marca
            traza: proy_alzado(F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta P₂Q₂.
          - con: regla
            traza: segmento2(proy_alzado(E), proy_alzado(F))
            porque: |
              E₂F₂, lo que el plano vertical del eje tiene de cara.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.Yizq)
            porque: |
              La horizontal de A₂, hasta pasar la vertical de F₁.
          - con: marca
            traza: proy_alzado(Y)
            rotulo: Y
            porque: |
              Y, donde la horizontal de A₂ corta la vertical de F₁, a la cota de A.
          - con: compas
            traza: 'arco(proy_alzado(Y), por: proy_alzado(T), desde: desplaza(proy_alzado(T), dx: -6, dy: 0), hasta: desplaza(proy_alzado(T), dx: 6, dy: 0))'
            toma: segmento2(figura.punto("A1"), proy_planta(F))
            porque: |
              Con A₁F₁ y centro en Y, el corte de abajo con la vertical de F₁: a 45°, el eje baja lo que
              avanza.
          - con: marca
            traza: proy_alzado(T)
            rotulo: T₂
            porque: |
              T₂, el punto del eje en la vertical de F₁, donde la corta el arco por debajo de Y.
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(T))
            porque: |
              A₂T₂, el alzado del eje.
          - con: marca
            traza: proy_alzado(I)
            rotulo: I₂
            porque: |
              I₂, donde A₂T₂ corta E₂F₂.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(I), solucion.I2arriba), segmento2(proy_alzado(I), solucion.I1mas)]'
            porque: |
              La vertical de I₂, hacia abajo hasta pasar e₁ y hacia arriba hasta pasar P₂Q₂.
          - con: marca
            traza: proy_planta(I)
            porque: |
              I₁, donde la vertical de I₂ corta e₁. Aquí va sin rótulo: el punto (I₀)₁, que se marca después,
              lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(I), solucion.perpLejos)
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Ahora el abatimiento. Por I₁, la perpendicular a la charnela P₁Q₁, larga, hasta bien pasada la
              charnela por fuera: al abatir, I gira alrededor de PQ en un plano vertical, y en la planta se
              mueve por esta recta.
          - con: marca
            traza: proy_planta(M)
            rotulo: M
            bloque: Abatimiento alrededor de PQ
            porque: |
              M, nombre nuestro: el pie de la perpendicular en la charnela. Es el centro del giro de I.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(I), solucion.I01mas)
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Por I₁, la paralela a la charnela, hacia Q, para el triángulo del radio, rectángulo en I₁.
          - con: compas
            traza: 'arco(proy_planta(I), por: solucion.I01, desde: desplaza(solucion.I01, dx: 1.61, dy: 2.53), hasta: desplaza(solucion.I01, dx: -1.61, dy: -2.53))'
            toma: segmento2(proy_alzado(I), solucion.Ih2)
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con el compás, en el alzado, **lo que I está por debajo de PQ**: de I₂ a P₂Q₂, por su vertical.
              Se lleva desde I₁ sobre la paralela, hacia Q; hacia P también valdría, porque el radio que sale
              es el mismo.
          - con: marca
            traza: solucion.I01
            rotulo: (I₀)₁
            bloque: Abatimiento alrededor de PQ
            porque: |
              (I₀)₁, nombre nuestro, como en el tema: donde el arco corta la paralela. De I₁ a él va el
              cateto de la cota.
          - con: regla
            traza: segmento2(proy_planta(M), solucion.I01)
            rotulo: radio
            bloque: Abatimiento alrededor de PQ
            porque: |
              La hipotenusa, de M a (I₀)₁, es la **distancia real de I a la charnela**: el radio con que I se
              abate, 15,5 mm.
          - con: compas
            traza: 'arco(proy_planta(M), por: solucion.I01, desde: solucion.I01, hasta: desplaza(proy_planta(IabF), dx: -1.91, dy: 1.29))'
            toma: segmento2(proy_planta(M), solucion.I01)
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con centro en M y ese radio, el arco que lleva I hasta la perpendicular, por fuera de la
              charnela: la cara gira alrededor de PQ y cae al plano horizontal de PQ. Por dentro también
              cortaría, casi encima de I₁.
          - con: marca
            traza: proy_planta(IabF)
            rotulo: I₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              I₀, donde el arco de centro M corta la perpendicular, por fuera de P₁Q₁: el centro del agujero
              abatido.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(IabF), solucion.dLmas), segmento2(proy_planta(IabF), solucion.dGmas), segmento2(proy_planta(IabF), solucion.dNmas), segmento2(proy_planta(IabF), solucion.dHmas)]'
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con la escuadra de 45° apoyada en la charnela, las dos diagonales del cuadrado por I₀, largas,
              hasta pasar la charnela: el agujero tiene dos lados horizontales, que abatidos son paralelos a
              la charnela, y sus diagonales forman 45° con ellos.
          - con: compas
            traza: '[arco(proy_planta(IabF), por: proy_planta(UabF), desde: desplaza(proy_planta(UabF), dx: 4.22, dy: -2.68), hasta: desplaza(proy_planta(UabF), dx: -4.22, dy: 2.68)), arco(proy_planta(IabF), por: proy_planta(WabF), desde: desplaza(proy_planta(WabF), dx: -4.22, dy: 2.68), hasta: desplaza(proy_planta(WabF), dx: 4.22, dy: -2.68))]'
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con el compás abierto 10 mm en la regla, la mitad de a, y centro en I₀, los dos cortes con la
              perpendicular a la charnela: los puntos medios de los lados horizontales, a los dos lados de I₀.
          - con: marca
            traza: proy_planta(UabF)
            rotulo: U₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              U₀, nombre nuestro: el corte del lado de la charnela, punto medio del lado de arriba.
          - con: marca
            traza: proy_planta(WabF)
            rotulo: W₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              W₀, nombre nuestro: el corte de fuera, punto medio del lado de abajo.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(UabF), solucion.J0mas), segmento2(proy_planta(UabF), solucion.K0mas), segmento2(proy_planta(WabF), solucion.N0mas), segmento2(proy_planta(WabF), solucion.L0mas)]'
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Por U₀ y por W₀, las paralelas a la charnela, hacia los dos lados hasta pasar las diagonales:
              son los dos lados horizontales del agujero, abatidos.
          - con: marca
            traza: proy_planta(JabF)
            rotulo: J₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              J₀, donde la paralela por U₀ corta la diagonal del lado de P.
          - con: marca
            traza: proy_planta(KabF)
            rotulo: K₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              K₀, donde la paralela por U₀ corta la diagonal del lado de Q.
          - con: marca
            traza: proy_planta(LabF)
            rotulo: L₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              L₀, donde la paralela por W₀ corta la diagonal de J₀, al otro lado de I₀.
          - con: marca
            traza: proy_planta(NabF)
            rotulo: N₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              N₀, donde la paralela por W₀ corta la diagonal de K₀, al otro lado de I₀.
          - con: regla
            traza: '[segmento2(proy_planta(JabF), proy_planta(NabF)), segmento2(proy_planta(KabF), proy_planta(LabF))]'
            bloque: Abatimiento alrededor de PQ
            porque: |
              Los otros dos lados, J₀N₀ y K₀L₀, perpendiculares a la charnela: el agujero en verdadera
              magnitud, un cuadrado de 20 mm.
        pista: |
          (1) Rehaz I₁ e I₂. (2) Por I₁, la perpendicular a P₁Q₁ la corta en M. (3) Por I₁, paralela a la
          charnela, lleva lo que I₂ está por debajo de P₂Q₂: la distancia de M a ese punto es el radio. (4)
          Con centro en M, corta la perpendicular por fuera: I₀. (5) Diagonales a 45° por I₀; a 10 mm de I₀
          sobre la perpendicular, U₀ y W₀; las paralelas a la charnela por ellos cortan las diagonales en
          los vértices.
        desarrollo: |
          En verde claro, el camino de I y el cuadrado abatido, de 20 mm, con sus lados horizontales
          paralelos a la charnela. El radio de I es 15,5 mm: la hipotenusa de 14,2 mm de planta y 6,3 mm de
          cota. Llevar solo la planta deja I₀ 1,3 mm corto, justo por encima de la tolerancia del Taller, que
          es la de la regla: un milímetro.

      - tipo: construir
        titulo: De vuelta a la planta y al alzado, por afinidad
        intro: |
          Desabate el agujero. Cada vértice vuelve por la perpendicular a la charnela por la que se abatió,
          y dónde para lo dice la afinidad: una recta de la cara y su abatida se cortan en la charnela, que
          no se mueve. Las diagonales del cuadrado abatido cortan P₁Q₁ en G y H (nombres nuestros);
          desabatidas, pasan por G₁, o H₁, y por I₁. En el alzado, lo mismo: G₂ y H₂ están en P₂Q₂, y las
          diagonales son G₂I₂ y H₂I₂. Redibuja primero lo de los dos pasos anteriores. Marca las cuatro
          plantas y los cuatro alzados. Con la lupa (×4): L₁ cae a 0,3 mm de la vertical de E₁; K₂, a 3 mm
          de H₂ y J₂ a 5 mm de F₂; y el alzado del eje pasa a 1 mm de K₂ y de N₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: J1
            pide: J, de vuelta en la planta
            es: proy_planta(J)
            bien: |
              J₁ está en la perpendicular a la charnela que pasa por J₀ —la prolongación del lado N₀J₀— y en
              la recta G₁I₁, la diagonal desabatida.
            diagnosticos:
              - si: cerca_de(proy_planta(JabF))
                mensaje: |
                  Ese es J₀, el abatido. J vuelve por la perpendicular a la charnela, cruza P₁Q₁ y para en la
                  diagonal desabatida, G₁I₁.
                ejemplo: proy_planta(JabF)
              - si: '!en_recta(solucion.perpJN)'
                mensaje: |
                  Al desabatir, J vuelve por la **perpendicular a la charnela que pasa por J₀**, que es la
                  prolongación del lado N₀J₀.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(G), proy_planta(I)), desde: proy_planta(J), distancia: mm(4)), 1)'
              - si: '!en_recta(segmento2(proy_planta(G), proy_planta(I)))'
                mensaje: |
                  J está en la diagonal JL, que abatida corta la charnela en G y pasa por I₀. G no se mueve:
                  desabatida, la diagonal es **G₁I₁**, y J₁ está en ella.
                ejemplo: 'uno(medir_sobre(solucion.perpJN, desde: proy_planta(J), distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  J₁ está donde la perpendicular a la charnela por J₀ corta G₁I₁.
          - nombre: K1
            pide: K, de vuelta en la planta
            es: proy_planta(K)
            bien: |
              K₁ está en la prolongación del lado L₀K₀ y en la recta H₁I₁. J₁K₁ es paralela a la charnela: es
              un lado horizontal, y en la planta mide 20 mm.
            diagnosticos:
              - si: cerca_de(proy_planta(KabF))
                mensaje: |
                  Ese es K₀, el abatido. K vuelve por la perpendicular a la charnela hasta H₁I₁.
                ejemplo: proy_planta(KabF)
              - si: '!en_recta(solucion.perpKL)'
                mensaje: |
                  K vuelve por la **perpendicular a la charnela que pasa por K₀**, la prolongación de L₀K₀.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(H), proy_planta(I)), desde: proy_planta(K), distancia: mm(4)), 1)'
              - si: '!en_recta(segmento2(proy_planta(H), proy_planta(I)))'
                mensaje: |
                  K está en la diagonal KN, que corta la charnela en H: desabatida es **H₁I₁**.
                ejemplo: 'uno(medir_sobre(solucion.perpKL, desde: proy_planta(K), distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  K₁ está donde la perpendicular a la charnela por K₀ corta H₁I₁.
          - nombre: L1
            pide: L, de vuelta en la planta
            es: proy_planta(L)
            bien: |
              L₁ está en la misma perpendicular que K₁ y en la diagonal G₁I₁, al otro lado de I₁.
            diagnosticos:
              - si: '!en_recta(solucion.perpKL)'
                mensaje: |
                  L vuelve por la misma perpendicular que K: la del lado L₀K₀, prolongada.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(G), proy_planta(I)), desde: proy_planta(L), distancia: mm(4)), 1)'
              - si: '!en_recta(segmento2(proy_planta(G), proy_planta(I)))'
                mensaje: |
                  L está en la diagonal de J: L₁ va en **G₁I₁**, prolongada más allá de I₁.
                ejemplo: 'uno(medir_sobre(solucion.perpKL, desde: proy_planta(L), distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  L₁ está donde G₁I₁, prolongada, corta la perpendicular de K₁.
          - nombre: N1
            pide: N, de vuelta en la planta
            es: proy_planta(N)
            bien: |
              N₁ está en la perpendicular de J₁ y en la diagonal H₁I₁. J₁K₁L₁N₁ es un rectángulo: 20 mm en
              los lados horizontales y 18,3 mm en los otros.
            diagnosticos:
              - si: '!en_recta(solucion.perpJN)'
                mensaje: |
                  N vuelve por la misma perpendicular que J: la del lado N₀J₀, prolongada.
                ejemplo: 'uno(medir_sobre(segmento2(proy_planta(H), proy_planta(I)), desde: proy_planta(N), distancia: mm(4)), 1)'
              - si: '!en_recta(segmento2(proy_planta(H), proy_planta(I)))'
                mensaje: |
                  N está en la diagonal de K: N₁ va en **H₁I₁**, prolongada más allá de I₁.
                ejemplo: 'uno(medir_sobre(solucion.perpJN, desde: proy_planta(N), distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  N₁ está donde H₁I₁, prolongada, corta la perpendicular de J₁.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(J)
            bien: |
              J₂ está en la vertical de J₁ y en G₂I₂, el alzado de la diagonal: G está en la arista PQ, y su
              alzado, en P₂Q₂.
            diagnosticos:
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**.
                ejemplo: 'desplaza(proy_alzado(J), dx: mm(5))'
              - si: '!en_recta(segmento2(proy_alzado(G), proy_alzado(I)))'
                mensaje: |
                  J está en la diagonal JL, que pasa por G y por I: su alzado va en **G₂I₂**, con G₂ en P₂Q₂,
                  en la vertical de G₁.
                ejemplo: 'desplaza(proy_alzado(J), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  J₂ está donde la vertical de J₁ corta G₂I₂.
          - nombre: K2
            pide: K, en el alzado
            es: proy_alzado(K)
            bien: |
              K₂ está en la vertical de K₁, a la altura de J₂: JK es un lado horizontal, y su alzado también
              lo es.
            diagnosticos:
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la **vertical de K₁**.
                ejemplo: 'desplaza(proy_alzado(K), dx: mm(5))'
              - si: '!en_horizontal_de(J2)'
                mensaje: |
                  JK es uno de los dos lados horizontales: K₂ va **a la altura de J₂**. También lo da H₂I₂.
                ejemplo: 'desplaza(proy_alzado(K), dy: mm(4))'
              - si: siempre
                mensaje: |
                  K₂ está donde la vertical de K₁ corta H₂I₂, a la altura de J₂.
          - nombre: L2
            pide: L, en el alzado
            es: proy_alzado(L)
            bien: |
              L₂ está en la vertical de L₁ y en G₂I₂, prolongada más allá de I₂.
            diagnosticos:
              - si: '!en_vertical_de(L1)'
                mensaje: |
                  L₂ va en la **vertical de L₁**.
                ejemplo: 'desplaza(proy_alzado(L), dx: mm(5))'
              - si: '!en_recta(segmento2(proy_alzado(G), proy_alzado(I)))'
                mensaje: |
                  L está en la diagonal de J: L₂ va en **G₂I₂**, prolongada más allá de I₂.
                ejemplo: 'desplaza(proy_alzado(L), dy: mm(4))'
              - si: siempre
                mensaje: |
                  L₂ está donde la vertical de L₁ corta G₂I₂ prolongada.
          - nombre: N2
            pide: N, en el alzado
            es: proy_alzado(N)
            bien: |
              N₂ está en la vertical de N₁, a la altura de L₂: LN es el otro lado horizontal. El alzado del
              agujero es un paralelogramo con dos lados horizontales.
            diagnosticos:
              - si: '!en_vertical_de(N1)'
                mensaje: |
                  N₂ va en la **vertical de N₁**.
                ejemplo: 'desplaza(proy_alzado(N), dx: mm(5))'
              - si: '!en_horizontal_de(L2)'
                mensaje: |
                  LN es el otro lado horizontal: N₂ va **a la altura de L₂**. También lo da H₂I₂, prolongada.
                ejemplo: 'desplaza(proy_alzado(N), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  N₂ está donde la vertical de N₁ corta H₂I₂ prolongada, a la altura de L₂.
        trazado:
          - segmento2(proy_planta(J), proy_planta(K))
          - segmento2(proy_planta(K), proy_planta(L))
          - segmento2(proy_planta(L), proy_planta(N))
          - segmento2(proy_planta(N), proy_planta(J))
          - segmento2(proy_alzado(J), proy_alzado(K))
          - segmento2(proy_alzado(K), proy_alzado(L))
          - segmento2(proy_alzado(L), proy_alzado(N))
          - segmento2(proy_alzado(N), proy_alzado(J))
        bloques:
          - nombre: Abatimiento alrededor de PQ
            explica: |
              Se rehace el abatimiento del paso anterior: la cara gira alrededor de PQ, su arista
              alta, hasta el plano horizontal de PQ. I se abate con su triángulo, con 15,5 mm de
              radio, y en I₀ se dibuja el cuadrado de 20 mm, con los lados horizontales paralelos a
              la charnela.
          - nombre: Vuelta a la planta por afinidad
            explica: |
              Desabatir es deshacer el giro: cada vértice vuelve a la planta por la perpendicular a
              la charnela por la que se abatió, y J y N comparten una, como K y L. Dónde para lo
              dice la
              [afinidad](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir):
              una recta de la cara que corta la charnela la sigue cortando, abatida, en el mismo
              punto, porque los puntos de PQ no se mueven. Las diagonales abatidas cortan P₁Q₁ en G₁
              y H₁, y desabatidas pasan por G₁ o por H₁ y por I₁: cada una corta las perpendiculares
              en las plantas de sus vértices.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("X1"), solucion.F1mas)
            porque: |
              Lo de los dos pasos anteriores, deprisa: e₁ prolongada hasta pasar P₁Q₁.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, donde e₁ corta S₁R₁.
          - con: marca
            traza: proy_planta(F)
            porque: |
              F₁, donde e₁ corta P₁Q₁; sin rótulo, que pisaría el de M.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(E), solucion.E2mas), segmento2(proy_planta(F), solucion.Ymas)]'
            porque: |
              Las verticales de E₁ y de F₁, la segunda hasta la altura de A₂.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta S₂R₂.
          - con: marca
            traza: proy_alzado(F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta P₂Q₂.
          - con: regla
            traza: segmento2(proy_alzado(E), proy_alzado(F))
            porque: |
              E₂F₂, lo que el plano vertical del eje tiene de cara.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.Yizq)
            porque: |
              La horizontal de A₂, hasta pasar la vertical de F₁.
          - con: marca
            traza: proy_alzado(Y)
            rotulo: Y
            porque: |
              Y, a la cota de A en la vertical de F₁.
          - con: compas
            traza: 'arco(proy_alzado(Y), por: proy_alzado(T), desde: desplaza(proy_alzado(T), dx: -6, dy: 0), hasta: desplaza(proy_alzado(T), dx: 6, dy: 0))'
            toma: segmento2(figura.punto("A1"), proy_planta(F))
            porque: |
              Con A₁F₁ y centro en Y, el corte de abajo: el eje baja lo que avanza.
          - con: marca
            traza: proy_alzado(T)
            rotulo: T₂
            porque: |
              T₂, donde el arco de centro Y corta la vertical de F₁, el corte de abajo.
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(T))
            porque: |
              A₂T₂, el alzado del eje.
          - con: marca
            traza: proy_alzado(I)
            porque: |
              I₂, donde A₂T₂ corta E₂F₂. Aquí va sin rótulo: el punto K₂, que se marca al final, lo taparía.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(I), solucion.I2arriba), segmento2(proy_alzado(I), solucion.I1mas)]'
            porque: |
              La vertical de I₂, hasta pasar e₁ y hasta pasar P₂Q₂.
          - con: marca
            traza: proy_planta(I)
            porque: |
              I₁, donde la vertical de I₂ corta e₁. Aquí va sin rótulo: el punto (I₀)₁, que se marca después,
              lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(I), solucion.perpLejos)
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              La perpendicular a la charnela por I₁, larga, hasta pasarla por fuera.
          - con: marca
            traza: proy_planta(M)
            rotulo: M
            bloque: Abatimiento alrededor de PQ
            porque: |
              M, el pie de la perpendicular en la charnela.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(I), solucion.I01mas)
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              La paralela a la charnela por I₁, hacia Q.
          - con: compas
            traza: 'arco(proy_planta(I), por: solucion.I01, desde: desplaza(solucion.I01, dx: 1.61, dy: 2.53), hasta: desplaza(solucion.I01, dx: -1.61, dy: -2.53))'
            toma: segmento2(proy_alzado(I), solucion.Ih2)
            bloque: Abatimiento alrededor de PQ
            porque: |
              Lo que I₂ está por debajo de P₂Q₂, llevado desde I₁ por la paralela, hacia Q.
          - con: marca
            traza: solucion.I01
            rotulo: (I₀)₁
            bloque: Abatimiento alrededor de PQ
            porque: |
              (I₀)₁, donde el arco corta la paralela.
          - con: regla
            traza: segmento2(proy_planta(M), solucion.I01)
            rotulo: radio
            bloque: Abatimiento alrededor de PQ
            porque: |
              M(I₀)₁, el radio con que se abate I.
          - con: compas
            traza: 'arco(proy_planta(M), por: solucion.I01, desde: solucion.I01, hasta: desplaza(proy_planta(IabF), dx: -1.91, dy: 1.29))'
            toma: segmento2(proy_planta(M), solucion.I01)
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con centro en M y ese radio, hasta la perpendicular, por fuera.
          - con: marca
            traza: proy_planta(IabF)
            rotulo: I₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              I₀, donde el arco de centro M corta la perpendicular, por fuera de P₁Q₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(IabF), solucion.dLmas), segmento2(proy_planta(IabF), solucion.dGmas), segmento2(proy_planta(IabF), solucion.dNmas), segmento2(proy_planta(IabF), solucion.dHmas)]'
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Las diagonales a 45° por I₀, hasta pasar la charnela.
          - con: compas
            traza: '[arco(proy_planta(IabF), por: proy_planta(UabF), desde: desplaza(proy_planta(UabF), dx: 4.22, dy: -2.68), hasta: desplaza(proy_planta(UabF), dx: -4.22, dy: 2.68)), arco(proy_planta(IabF), por: proy_planta(WabF), desde: desplaza(proy_planta(WabF), dx: -4.22, dy: 2.68), hasta: desplaza(proy_planta(WabF), dx: 4.22, dy: -2.68))]'
            bloque: Abatimiento alrededor de PQ
            porque: |
              Con 10 mm, la mitad de a, y centro en I₀, sobre la perpendicular.
          - con: marca
            traza: proy_planta(UabF)
            rotulo: U₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              U₀, donde el arco de 10 mm corta la perpendicular del lado de la charnela.
          - con: marca
            traza: proy_planta(WabF)
            rotulo: W₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              W₀, donde el arco de 10 mm corta la perpendicular por fuera de I₀.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(UabF), solucion.J0mas), segmento2(proy_planta(UabF), solucion.K0mas), segmento2(proy_planta(WabF), solucion.N0mas), segmento2(proy_planta(WabF), solucion.L0mas)]'
            guia: figura.segmento("QP1")
            bloque: Abatimiento alrededor de PQ
            porque: |
              Las paralelas a la charnela por U₀ y por W₀.
          - con: marca
            traza: proy_planta(JabF)
            rotulo: J₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              J₀, en la paralela de U₀ y la diagonal de P.
          - con: marca
            traza: proy_planta(KabF)
            rotulo: K₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              K₀, en la paralela de U₀ y la diagonal de Q.
          - con: marca
            traza: proy_planta(LabF)
            rotulo: L₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              L₀, en la paralela de W₀ y la diagonal de J₀.
          - con: marca
            traza: proy_planta(NabF)
            rotulo: N₀
            bloque: Abatimiento alrededor de PQ
            porque: |
              N₀, en la paralela de W₀ y la diagonal de K₀.
          - con: regla
            traza: '[segmento2(proy_planta(JabF), proy_planta(NabF)), segmento2(proy_planta(KabF), proy_planta(LabF))]'
            bloque: Abatimiento alrededor de PQ
            porque: |
              J₀N₀ y K₀L₀: el cuadrado abatido, completo.
          - con: marca
            traza: proy_planta(G)
            rotulo: G₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              G₁, nombre nuestro: donde la diagonal de J₀ y L₀ corta P₁Q₁. Está en la charnela, que no se
              mueve: abatido y desabatido, G es el mismo punto.
          - con: marca
            traza: proy_planta(H)
            rotulo: H₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              H₁, nombre nuestro: donde la diagonal de K₀ y N₀ corta P₁Q₁. Tampoco se mueve.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(NabF), solucion.N1mas), segmento2(proy_planta(LabF), solucion.L1mas)]'
            guia: figura.segmento("QP1")
            bloque: Vuelta a la planta por afinidad
            porque: |
              Los lados N₀J₀ y L₀K₀ ya son perpendiculares a la charnela: se prolongan con la escuadra, más
              allá de la charnela, hasta cruzar la cara. Al desabatir, cada vértice vuelve por la recta por la
              que se abatió, y J y N vuelven por la misma, como K y L.
          - con: regla
            traza: '[segmento2(proy_planta(G), solucion.L1diag), segmento2(proy_planta(H), solucion.N1diag)]'
            bloque: Vuelta a la planta por afinidad
            porque: |
              Afinidad: una recta de la cara y su abatida se cortan en la charnela. La diagonal JL, abatida,
              corta la charnela en G₁ y pasa por I₀; desabatida, pasa por G₁ y por I₁. Lo mismo la diagonal
              KN, por H₁ e I₁. Las dos, prolongadas más allá de I₁.
          - con: marca
            traza: proy_planta(J)
            rotulo: J₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              J₁, donde la prolongación de N₀J₀ corta G₁I₁.
          - con: marca
            traza: proy_planta(K)
            rotulo: K₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              K₁, donde la prolongación de L₀K₀ corta H₁I₁.
          - con: marca
            traza: proy_planta(L)
            rotulo: L₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              L₁, donde la prolongación de L₀K₀ corta G₁I₁, más allá de I₁.
          - con: marca
            traza: proy_planta(N)
            rotulo: N₁
            bloque: Vuelta a la planta por afinidad
            porque: |
              N₁, donde la prolongación de N₀J₀ corta H₁I₁, más allá de I₁.
          - con: regla
            traza: '[segmento2(proy_planta(J), proy_planta(K)), segmento2(proy_planta(K), proy_planta(L)), segmento2(proy_planta(L), proy_planta(N)), segmento2(proy_planta(N), proy_planta(J))]'
            porque: |
              La planta del agujero: un rectángulo. J₁K₁ y N₁L₁ son paralelos a la charnela y miden 20 mm;
              los otros dos suben por la cara, y la planta los acorta.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(G), solucion.G2mas), segmento2(proy_planta(H), solucion.H2mas)]'
            porque: |
              Para los alzados, las verticales de G₁ y de H₁ hasta pasar P₂Q₂: G y H están en la arista PQ.
          - con: marca
            traza: proy_alzado(G)
            rotulo: G₂
            porque: |
              G₂, donde la vertical de G₁ corta P₂Q₂.
          - con: marca
            traza: proy_alzado(H)
            porque: |
              H₂, donde la vertical de H₁ corta P₂Q₂. Va sin rótulo: el suyo pisaría el de K₂, que cae a 3 mm.
          - con: regla
            traza: '[segmento2(proy_alzado(G), solucion.L2diag), segmento2(proy_alzado(H), solucion.N2diag)]'
            porque: |
              Los alzados de las diagonales: G₂I₂ y H₂I₂, prolongadas más allá de I₂. Cada vértice está en una
              de ellas.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(J), solucion.J2mas), segmento2(proy_planta(K), solucion.K2mas), segmento2(proy_planta(L), solucion.L2mas), segmento2(proy_planta(N), solucion.N2mas)]'
            porque: |
              Las verticales de J₁, K₁, L₁ y N₁, hasta pasar las diagonales del alzado.
          - con: marca
            traza: proy_alzado(J)
            porque: |
              J₂, donde la vertical de J₁ corta G₂I₂. Va sin rótulo: el punto F₂, que está al lado, lo
              taparía.
          - con: marca
            traza: proy_alzado(K)
            porque: |
              K₂, donde la vertical de K₁ corta H₂I₂, a la altura de J₂: JK es horizontal. Va sin rótulo: el
              punto H₂, encima de él, lo taparía.
          - con: marca
            traza: proy_alzado(L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta G₂I₂, prolongada.
          - con: marca
            traza: proy_alzado(N)
            porque: |
              N₂, donde la vertical de N₁ corta H₂I₂, prolongada, a la altura de L₂. Va sin rótulo: el punto
              I₂ lo taparía.
          - con: regla
            traza: '[segmento2(proy_alzado(J), proy_alzado(K)), segmento2(proy_alzado(K), proy_alzado(L)), segmento2(proy_alzado(L), proy_alzado(N)), segmento2(proy_alzado(N), proy_alzado(J))]'
            porque: |
              El alzado del agujero: un paralelogramo, con J₂K₂ y N₂L₂ horizontales.
        pista: |
          (1) Rehaz I₁, I₂, I₀ y el cuadrado abatido. (2) Las diagonales abatidas cortan P₁Q₁ en G₁ y H₁.
          (3) Prolonga N₀J₀ y L₀K₀ hasta cruzar la cara: son las perpendiculares a la charnela. (4) G₁I₁ y
          H₁I₁ las cortan en J₁, L₁, K₁ y N₁. (5) G₂ y H₂ en P₂Q₂; G₂I₂ y H₂I₂, cortadas por las verticales,
          dan los alzados.
        desarrollo: |
          En verde claro, el agujero en las dos vistas. En la planta es un rectángulo: los lados horizontales
          miden 20 mm, como en la cara, y los otros, 18,3 mm. En el alzado es un paralelogramo con dos lados
          horizontales. Ojo con un error que el Taller no ve: dibujar en la planta un cuadrado de 20 mm
          alrededor de I₁, sin abatir, deja cada vértice a 0,85 mm del bueno, dentro de la tolerancia de 1 mm,
          porque la cara está poco inclinada. Lo caza la pregunta siguiente: con ese cuadrado, los lados que
          no son horizontales medirían en la planta 20 mm, y miden 18,3.

      # Decisión: el enunciado solo pide dibujar. Este calcular comprueba la
      # planta del agujero con una cifra atada a la receta, y caza el error que
      # el Taller no distingue: dibujar el cuadrado directamente en la planta.
      - tipo: calcular
        titulo: Los lados que suben, en la planta
        pregunta: En la planta, ¿cuánto miden los lados del agujero que no son horizontales, J₁N₁ y K₁L₁?
        respuesta:
          tipo: numero
          valor: '18.31'
          receta: lado_planta_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '20.02'
            receta: en_mm(vm(J, N))
            mensaje: |
              Esa es a, lo que miden en la cara. Esos dos lados suben por la cara, que está inclinada
              23,9°, y la planta los acorta: el agujero es cuadrado en la cara, no en la planta.
          - valor: '21.89'
            receta: en_mm(vm(J, N) * vm(J, N) / vm_planta(J, N))
            mensaje: |
              Has dividido por el coseno en vez de multiplicar. La planta acorta lo que sube, no lo alarga:
              a · cos 23,9°.
          - valor: '8.10'
            receta: en_mm(diferencia_de_cotas(J, N))
            mensaje: |
              Eso es lo que sube cada uno de esos lados: la diferencia de cotas entre J y N, el otro cateto.
              La planta enseña lo que avanzan.
        pista: |
          Mide J₁N₁ con «medir» del Taller, en el paso anterior, o en tu lámina de papel. También sale de la
          cuenta, con el ángulo de la cara con el suelo.
        desarrollo: |
          La cara baja de PQ a SR 15,66 mm en 35,42 mm de planta, así que forma con el suelo

          $$ \alpha = \arctan\frac{15{,}66}{35{,}42} \approx 23{,}86^\circ $$

          Los lados JN y KL van por la línea de máxima pendiente, y la planta los acorta por el coseno:

          $$ \overline{J_1N_1} = a\cos\alpha = 20{,}02 \cdot \cos 23{,}86^\circ \approx 18{,}31 \text{ mm} $$

          con a = 20,02 mm, lo que mide el trazo de la figura (los 20 mm de las notas). Los horizontales, J₁K₁ y
          N₁L₁, miden en la planta lo mismo que en la cara.

          En el alzado, Q₂F₂ mide 17,59 mm, y en la planta R₁E₁, 17,55: son los trozos de las aristas PQ y SR
          que quedan entre el vértice y el plano vertical del eje, y caen dentro de la tolerancia por
          casualidad. No son lados del agujero, y la casilla daría por buena cualquiera de las dos. Los lados J₁N₁ y K₁L₁
          se miden en la planta del agujero.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El agujero es un cuadrado de lado a en la cara de arriba, que es un plano inclinado, así que para dibujarlo hay que verlo en verdadera magnitud.
          - texto: Su centro es I, donde el eje pincha la cara. El plano vertical del eje corta la cara por EF, y el alzado del eje corta E₂F₂ en I₂.
          - texto: Abatida la cara alrededor de PQ, el cuadrado se dibuja con centro en I₀ y con los dos lados horizontales paralelos a la charnela.
          - texto: Se desabate por las perpendiculares a la charnela y, por afinidad, con las diagonales, que cortan la charnela en G y H; los alzados salen de G₂I₂ y H₂I₂.
          - texto: El alzado del eje se dibuja a 45°, porque el eje forma 45° con el suelo.
            trampa: true
            mensaje: |
              El eje no es frontal: su planta es oblicua. Un ángulo con el suelo se ve tal cual solo en una
              vista paralela a la recta; en el alzado este eje se ve a 58,6°. Dibujado a 45°, I saldría casi
              en la arista alta.
    resolucion: |
      **Cómo lo leemos.** La perforación es el agujero de la cara de arriba, y es esa la que es
      cuadrada, de lado a, con dos lados horizontales. a no lleva cifra: el segmento de la figura mide 20 mm.
      La cara es un plano inclinado, que baja de PQ, por detrás, a SR, por delante, con 23,9° de pendiente.
      El centro del agujero es I, donde el eje del tubo pincha la cara.

      **El centro.** El eje sale de A hacia el depósito, con la planta por e₁ y a 45° con el suelo. El plano
      vertical que lo contiene corta la cara por EF, con E en SR y F en PQ. A 45°, el eje baja lo que avanza
      en la planta: en la vertical de F₁ está A₁F₁, 52,4 mm, por debajo de A, y eso da T₂. A₂T₂ corta E₂F₂ en
      I₂, e I₁ cae en e₁. En el alzado el eje se ve a 58,6°, no a 45°.

      **El agujero en verdadera magnitud.** Con PQ de charnela, I se abate con su triángulo: 14,2 mm de
      planta y 6,3 mm de cota dan un radio de 15,5 mm. En I₀ se dibuja el cuadrado de 20 mm, con las
      diagonales a 45° de la charnela y los lados horizontales paralelos a ella.

      **La vuelta.** Cada vértice vuelve por la perpendicular a la charnela, y la afinidad dice dónde para:
      la diagonal JL corta la charnela en G y la KN en H, que no se mueven, y desabatidas pasan por I₁. En el
      alzado, las mismas diagonales son G₂I₂ y H₂I₂. La planta del agujero es un rectángulo de 20 × 18,3
      mm, y el alzado, un paralelogramo con dos lados horizontales. Los dos se ven: la cara de arriba mira
      hacia arriba y hacia delante.
