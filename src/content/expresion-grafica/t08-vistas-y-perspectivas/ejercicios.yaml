      - tipo: justificar
        pregunta: Ordena por qué la escuadra necesita tres vistas, y por qué el perfil es el izquierdo. Una pieza es falsa.
        piezas:
          - texto: El alzado da la anchura y la altura, y la planta, la anchura y el fondo; entre las dos están las tres medidas.
          - texto: Pero el nervio sale igual en el alzado y en la planta que un taco macizo, y solo el perfil enseña su triángulo.
          - texto: Y sin la planta el fondo redondo de la ranura no se vería en ninguna vista, porque solo sale tal como es desde arriba.
          - texto: Los dos perfiles definen lo mismo, y se dibuja el izquierdo, que enseña la ranura sin ninguna oculta.
          - texto: Como el alzado y la planta ya dan las tres medidas de la pieza, el perfil sobra.
            trampa: true
            mensaje: |
              Dar las tres medidas no es definir la forma. Con el alzado y la planta, el nervio podría
              ser un taco macizo: las dos piezas dan las mismas líneas en esas dos vistas.
    resolucion: |
      **Las vistas.** El alzado se mira según la flecha A. En el sistema europeo, la planta va
      debajo y el perfil izquierdo, la pieza mirada desde su izquierda, a la derecha del alzado
      ([el sistema europeo y el americano](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#el-sistema-europeo-y-el-americano)).
      Alzado y planta comparten las anchuras; alzado y perfil, las alturas; planta y perfil, el
      fondo, y lo de delante de la pieza queda en cada vista lejos del alzado.

      **Lo que va a trazos.** Solo el fondo redondo de la ranura en el alzado: lo tapa la cara de
      delante de la base. En la planta y en el perfil izquierdo la ranura está a la vista
      ([las aristas ocultas](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#las-aristas-ocultas)).

      **Las vistas que hacen falta.** El alzado y la planta dan las tres medidas, pero el nervio
      sale en ellas igual que un taco macizo; sin la planta, el fondo redondo de la ranura no sale
      tal como es en ninguna vista. Hacen falta las tres, la 1, la 2 y la 3. De los dos perfiles,
      el izquierdo, que no lleva ninguna oculta: el derecho tendría la ranura a trazos
      ([las vistas necesarias](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#las-vistas-necesarias)).

      **Los errores que se ven en el perfil.** Dibujar una línea donde la placa se apoya en la base,
      que tienen la cara izquierda en el mismo plano, y poner el perfil derecho en el sitio del
      izquierdo, como en el sistema americano: los dos están entre los
      [errores que se ven en una vista](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#los-errores-que-se-ven-en-una-vista).

  - id: nyv23-1-bloque-con-agujero-pasante
    titulo: La pieza 1 del ejercicio 2.3, un bloque en L con un agujero pasante
