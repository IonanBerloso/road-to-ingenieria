      - tipo: justificar
        pregunta: Ordena por qué la solución dibuja el perfil derecho, y dónde lo pone. Una pieza es falsa.
        piezas:
          - texto: Los dos perfiles definen la pieza igual.
          - texto: Desde la izquierda, el rebaje y la ranura del extremo derecho quedan detrás de la placa y salen a trazos.
          - texto: Desde la derecha quedan de frente y se ven, y solo van a trazos las dos generatrices del coliso.
          - texto: Las vistas se eligen para que salgan pocas ocultas, así que se dibuja el perfil derecho.
          - texto: En el sistema europeo, el perfil derecho va a la izquierda del alzado.
          - texto: El perfil derecho va a la derecha del alzado, que es su lado.
            trampa: true
            mensaje: |
              En el sistema europeo es al revés: la pieza se proyecta sobre la pared que queda detrás
              de ella, y lo que se ve desde la derecha cae a la izquierda del alzado. A la derecha va
              en el sistema americano.
    resolucion: |
      **La pieza.** Una placa con una oreja de cabeza redonda en el extremo izquierdo, atravesada de
      delante atrás por un coliso y unida a la placa con un acuerdo; en el extremo derecho, un
      rebaje ancho y, dentro, una ranura en U.

      **Qué perfil.** Los dos definen lo mismo, y se elige el de menos ocultas
      ([las aristas ocultas](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#las-aristas-ocultas)).
      Desde la derecha, el rebaje y la ranura quedan de frente: el perfil derecho, calculado, lleva
      dos ocultas, las del coliso, y el izquierdo siete. Es lo que hace la solución de la pág. 15:
      «se ha delineado la vista desde la derecha, con el fin de dibujar menos líneas ocultas». Va a la
      izquierda del alzado
      ([el sistema europeo y el americano](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#el-sistema-europeo-y-el-americano)).

      **Las vistas.** El alzado enseña la oreja con el coliso visto, el acuerdo y, a trazos, la pared
      del rebaje y el fondo de la ranura. La planta enseña el coliso a trazos y el rebaje y la ranura
      vistos. Las vistas calculadas son las de la solución, ocultas incluidas; la solución añade en
      la planta la arista ficticia del acuerdo, fina y sin tocar los lados.

      **Los errores que se ven.** Una línea donde la cabeza redonda es tangente a los lados, y el
      perfil del otro lado en el sitio de este, que en una pieza simétrica solo se delata por las
      ocultas ([los errores que se ven en una vista](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#los-errores-que-se-ven-en-una-vista)).

