        opciones:
          - texto: El dibujo a
            mensaje: |
              Lleva una línea de más: la que separa la cara de arriba del escalón, a la derecha de la
              cabeza, de su canto redondeado. El canto es un cuarto de cilindro tangente a esa cara, y
              donde una superficie curva es tangente a una plana no hay arista.
          - texto: El dibujo b
            mensaje: |
              Está dada la vuelta: lo de delante, la cara quebrada de la base, sale arriba, pegado al
              alzado. Al desplegar la caja del sistema europeo, la planta cae debajo del alzado con lo
              de delante abajo: lo de delante queda en cada vista lejos del alzado.
          - texto: El dibujo c
            correcta: true
            mensaje: |
              Eso es. La cara quebrada de la base abajo, lejos del alzado; la cabeza detrás, con la
              ranura en tres franjas, porque el agujero asoma por el fondo de la ranura y es la de en
              medio; y las dos generatrices del agujero a trazos, porque desde arriba quedan dentro de
              la cabeza y, en la ranura, por debajo de su fondo.
          - texto: El dibujo d
            mensaje: |
              Le faltan las dos ocultas del agujero. Desde arriba, sus generatrices quedan dentro de la
              cabeza y, en la ranura, por debajo de su fondo: hay materia entre ellas y quien mira.

      - tipo: calcular
        titulo: El perfil más adecuado
        pregunta: |
          El enunciado pide el alzado, la planta y el perfil más adecuado. Escribe las tres vistas que
          dibujas por su letra de la norma, como número: 1 el alzado (A), 2 la planta (B), 3 el perfil
          izquierdo (C), 4 el perfil derecho (D), 5 la vista inferior (E) y 6 la posterior (F).
        respuesta:
          tipo: conjunto
          valor: '1, 2, 4'
          tolerancia: 0.1
          formato: los números de las vistas, separados por comas
        distractores:
          - valor: '1, 2, 3'
            mensaje: |
              Desde la izquierda, el escalón redondeado de la base queda detrás de la cabeza: su curva
              y su cara de arriba salen a trazos. El perfil izquierdo, calculado, lleva cinco ocultas,
              y el derecho tres, todas del agujero. Se dibuja el de menos ocultas.
          - valor: '1, 2'
            mensaje: |
              Falta el perfil, que el enunciado pide. Y en esta pieza hace falta de verdad: el escalón
              redondeado solo enseña su curva en un perfil.
          - valor: '1, 2, 3, 4'
            mensaje: |
              Uno de los dos perfiles sobra: dicen lo mismo, y el enunciado pide uno, el más adecuado.
          - valor: '1, 4'
            mensaje: |
              Falta la planta, que el enunciado pide: es la única que enseña la cara de delante
              quebrada de la base.
        pista: |
          ¿Desde qué lado se ve el escalón redondeado de la base, el que está a la derecha de la
          cabeza? Desde el otro, la cabeza lo tapa.
        desarrollo: |
          Los dos perfiles definen la pieza. La diferencia está en el escalón redondeado de la base,
          a la derecha de la cabeza: desde la derecha se ve de frente, y desde la izquierda queda
          detrás de la cabeza, con su curva y su cara de arriba a trazos. Calculados, el derecho lleva
          tres ocultas, las del agujero, y el izquierdo cinco.

          Son la 1, la 2 y la 4.

      - tipo: dibujar
        consigna: |
          Dibuja en papel el alzado, la planta y el perfil derecho de la pieza 3, en el sistema europeo,
          con las medidas de la figura en proporción y las ocultas a trazos.
        comprueba:
          - punto: El perfil derecho a la izquierda del alzado, y la planta debajo, con la cara quebrada de la base abajo.
            porque: |
              Es el sistema europeo: lo que se ve desde la derecha va a la izquierda del alzado, y lo
              de delante queda en cada vista lejos del alzado.
          - punto: En el alzado, el agujero como una circunferencia vista y el fondo de la ranura a trazos, a los dos lados del agujero.
            porque: |
              La ranura corta la cabeza por arriba entre sus dos orejas, y su fondo queda detrás de la
              oreja de delante.
          - punto: En la planta, la ranura en tres franjas y las dos generatrices del agujero a trazos de lado a lado de la cabeza.
            porque: |
              Desde arriba, las generatrices del agujero quedan dentro de la cabeza y, en la ranura,
              por debajo de su fondo. La franja de en medio es el agujero, que asoma por el fondo.
          - punto: En el perfil derecho, el escalón redondeado visto, con su curva, y las tres ocultas del agujero.
            porque: |
              Desde la derecha el escalón queda de frente. Del agujero van a trazos su generatriz de
              abajo, de lado a lado, y la de arriba en cada oreja; en la ranura, por encima del fondo,
              no hay materia donde dibujarla.
          - punto: Ninguna línea donde el escalón redondeado se junta con la cara de arriba, ni donde el remate redondo de la cabeza se junta con sus lados.
            porque: |
              Son tangencias: una superficie curva que sigue a una plana sin esquina no deja arista.
