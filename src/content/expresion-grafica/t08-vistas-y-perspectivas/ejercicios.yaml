      **Notas nuestras.** La página da las cuatro piezas en una figura; este ejercicio es el de la
      pieza 1, redibujada con el motor de vistas desde el mismo lado. La página no da cotas: la
      pieza tiene las medidas de la figura en proporción, y las vistas se dibujan «A mano, pero con
      las medidas proporcionales en las vistas» (diapositivas, pág. 9).
    notas:
      - 'Nota: A = vista de alzado'
    pide: El perfil izquierdo bueno entre cuatro, las líneas del alzado que van a trazos y las tres vistas dibujadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Estos son cuatro dibujos del perfil izquierdo de la pieza 1. Solo uno está bien. ¿Cuál?

          <figure class="figura-examen">
          <svg viewBox="0 0 308 279" role="img" width="308" height="279" aria-labelledby="t08e-p1-opciones-t t08e-p1-opciones-d">
