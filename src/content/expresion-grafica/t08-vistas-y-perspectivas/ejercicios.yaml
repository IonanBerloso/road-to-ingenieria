      - tipo: justificar
        pregunta: Ordena por qué el perfil más adecuado de la pieza 3 es el derecho. Una pieza es falsa.
        piezas:
          - texto: Los dos perfiles definen la pieza.
          - texto: A la derecha de la cabeza, la base sube en un escalón redondeado.
          - texto: Desde la izquierda, la cabeza lo tapa, y su curva y su cara de arriba salen a trazos.
          - texto: Desde la derecha se ve, y solo van a trazos las líneas del agujero.
          - texto: Se elige el perfil con menos ocultas, el derecho, y va a la izquierda del alzado.
          - texto: El perfil más adecuado es siempre el izquierdo, porque es el que se dibuja a la derecha del alzado.
            trampa: true
            mensaje: |
              El izquierdo es el de casi todos los planos, pero no siempre el más adecuado: se elige el
              perfil que define la pieza con menos ocultas, y aquí es el derecho.
    resolucion: |
      **La pieza.** Una base con la cara de delante en tres tramos —retranqueada a la izquierda,
      adelantada en medio y en diagonal a la derecha— y, detrás a la izquierda, una cabeza de remate
      redondo atravesada por un agujero, con una ranura ancha que la corta por arriba y deja dos
      orejas. A la derecha de la cabeza, la base sube en un escalón redondeado.

      **La planta.** Lo de delante abajo, lejos del alzado; la ranura en tres franjas, la de en medio
      el agujero, que asoma por su fondo; y las generatrices del agujero a trazos, porque desde arriba
      quedan dentro de la cabeza y por debajo del fondo de la ranura. El escalón redondeado no deja
      línea donde se junta con la cara de arriba: es una tangencia
      ([los errores que se ven en una vista](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#los-errores-que-se-ven-en-una-vista)).

      **Qué perfil.** Los dos definen la pieza; el derecho deja el escalón a la vista y solo lleva
      las tres ocultas del agujero, y el izquierdo, cinco. Se dibuja el derecho, a la izquierda del
      alzado ([las aristas ocultas](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#las-aristas-ocultas)).

      **Los errores que se ven.** La línea del escalón en la planta, la planta dada la vuelta con lo
      de delante junto al alzado, y el agujero sin sus ocultas.
