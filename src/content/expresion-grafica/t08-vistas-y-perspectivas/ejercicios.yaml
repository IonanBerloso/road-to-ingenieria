          <figcaption>Cuatro perfiles calculados con el motor de vistas. Uno es el bueno; los otros tres llevan, cada uno, un error que se comete de verdad.</figcaption>
          </figure>
        opciones:
          - texto: El dibujo a
            correcta: true
            mensaje: |
              Eso es. Desde la izquierda, el rebaje y la ranura del extremo derecho quedan detrás de
              la placa: sus cuatro paredes van a trazos, y también, al pie de la oreja, la arista de
              arriba del rebaje, que queda detrás de ella. Con las dos del coliso son siete ocultas.
              Cuéntalas: es lo que decide el paso siguiente.
          - texto: El dibujo b
            mensaje: |
              Le faltan las ocultas. Desde la izquierda, el rebaje y la ranura del extremo derecho
              quedan detrás de la placa, y el coliso dentro de la oreja: todo eso tiene materia
              delante y va a trazos. Sin ellas, este perfil no dice que la placa tenga nada en su
              extremo.
          - texto: El dibujo c
            mensaje: |
              Lleva una línea de más: la horizontal donde la cabeza redonda de la oreja se junta con sus
              lados. La cabeza es un medio cilindro tangente a los lados planos, y donde una superficie
              curva es tangente a una plana no hay arista.
          - texto: El dibujo d
            mensaje: |
              Es lo que se ve desde la **derecha**: el rebaje y la ranura quedan de frente y salen en
              cuatro líneas continuas. Es el perfil de la solución de la pág. 15, pero esa lo pone a la
              izquierda del alzado; en el sitio del izquierdo, a su derecha, es colocarlo como en el
              sistema americano. La pieza es simétrica de delante atrás, así que el contorno no delata
              el cambio de lado; lo delatan las ocultas.

      - tipo: calcular
        titulo: El perfil más adecuado
        pregunta: |
          El enunciado pide el alzado, la planta y el perfil más adecuado. Escribe las tres vistas que
          dibujas por su letra de la norma, como número: 1 el alzado (A), 2 la planta (B), 3 el perfil
          izquierdo (C), 4 el perfil derecho (D), 5 la vista inferior (E) y 6 la posterior (F).
        respuesta:
          tipo: conjunto
          valor: '1, 2, 4'
          tolerancia: 0.1
          formato: los números de las vistas, separados por comas
        distractores:
          - valor: '1, 2, 3'
            mensaje: |
              El perfil izquierdo define la pieza igual, pero desde la izquierda el rebaje y la ranura
              quedan detrás de la placa: son siete ocultas frente a dos. La solución lo comenta: «se ha
              delineado la vista desde la derecha, con el fin de dibujar menos líneas ocultas».
          - valor: '1, 2'
            mensaje: |
              Falta el perfil: el enunciado pide tres vistas, el alzado, la planta y el perfil más
              adecuado. Lo que hay que decidir es cuál de los dos.
          - valor: '1, 2, 3, 4'
            mensaje: |
              Uno de los dos perfiles sobra: dicen lo mismo, y el enunciado pide uno, el más adecuado.
          - valor: '1, 4'
            mensaje: |
              Falta la planta, que el enunciado pide: es la única que enseña la forma del rebaje y de la
              ranura en U, que en el alzado son líneas de trazos.
        pista: |
          El perfil izquierdo lo has visto en el paso anterior: cuenta sus líneas de trazos. ¿Desde
          qué lado quedan a la vista el rebaje y la ranura del extremo derecho?
        desarrollo: |
          Los dos perfiles definen lo mismo. El rebaje y la ranura están en el extremo derecho y
          abiertos hacia la derecha: desde la derecha se ven, y desde la izquierda quedan detrás de la
          placa. Calculados, el derecho lleva dos ocultas, las del coliso, y el izquierdo siete. Entre
          dos vistas que definen lo mismo se elige la de menos ocultas, y la solución de la pág. 15
          hace eso.

          Son la 1, la 2 y la 4.

      - tipo: dibujar
        consigna: |
          Dibuja en papel el alzado, la planta y el perfil derecho de la pieza 2, en el sistema europeo,
          con las medidas de la figura en proporción y las ocultas a trazos.
        comprueba:
          - punto: El perfil derecho a la izquierda del alzado, y la planta debajo.
            porque: |
              En el sistema europeo cada vista se proyecta en la pared de detrás de la pieza: lo que se
              ve desde la derecha va a la izquierda del alzado. La solución lo rotula «Dcha.».
          - punto: En el perfil, lo de delante de la pieza a la izquierda, lejos del alzado, y la oreja en medio.
            porque: |
              Lo de delante de la pieza queda en cada vista lejos del alzado; en el perfil derecho, a la
              izquierda.
          - punto: En el perfil derecho, las cuatro paredes del rebaje y de la ranura en continua, y solo dos ocultas, las del coliso.
            porque: |
              El rebaje y la ranura están abiertos hacia la derecha: se ven. La solución rodea esa zona
              con «Sin líneas discontinuas».
          - punto: En el alzado, dos líneas de trazos en el extremo derecho de la placa, la pared del rebaje y el fondo de la ranura, con el eje de la ranura.
            porque: |
              El rebaje y la ranura quedan detrás de la cara de delante de la placa, que no cortan.
          - punto: En la planta, el coliso con sus dos paredes a trazos, y el rebaje en escalón y la ranura en U vistos.
            porque: |
              Desde arriba, el coliso queda dentro de la oreja; el rebaje y la ranura atraviesan la
              placa y se ven.
          - punto: Ninguna línea donde la cabeza redonda de la oreja se junta con sus lados, ni donde el acuerdo se junta con la oreja y con la placa.
            porque: |
              Son tangencias: ahí no hay arista. La solución sugiere el acuerdo en la planta con una
              arista ficticia, fina y sin tocar los lados; la figura de abajo, calculada, no la lleva.
        figura: |
          <svg viewBox="0 0 387 375" role="img" width="387" height="375" aria-labelledby="t08e-p2-vistas-t t08e-p2-vistas-d">
