            <text fill="var(--faint)" font-size="10px" font-family="var(--mono)" paint-order="stroke" stroke="var(--paper)" stroke-width="3px" stroke-linejoin="round" x="181.6" y="26" text-anchor="start">perfil izquierdo</text>
            <text fill="var(--faint)" font-size="10px" font-family="var(--mono)" paint-order="stroke" stroke="var(--paper)" stroke-width="3px" stroke-linejoin="round" x="160" y="224.6" text-anchor="start">planta</text>
