          <figcaption>Cuatro perfiles calculados con el motor de vistas. Uno es el bueno; los otros tres llevan, cada uno, un error que se comete de verdad.</figcaption>
          </figure>
        opciones:
          - texto: El dibujo a
            mensaje: |
              Lleva una línea de más: la horizontal que cruza el cuerpo alto a la altura de la base. La
              base y el cuerpo alto tienen la cara izquierda en el mismo plano; es una sola cara, y ahí
              no hay arista.
          - texto: El dibujo b
            mensaje: |
              Es el perfil **derecho**: el cuerpo alto, que está detrás, sale a la derecha del dibujo.
              La pieza es simétrica y el derecho es el izquierdo dado la vuelta, pero en el sistema
              europeo el perfil izquierdo va a la derecha del alzado con lo de detrás junto al alzado,
              a la izquierda. Puesto aquí, es el sistema americano.
          - texto: El dibujo c
            mensaje: |
              Le faltan las dos líneas de trazos del agujero. El agujero atraviesa la pieza entera: su
              generatriz de detrás sube por dentro del cuerpo alto, de abajo arriba, y la de delante
              cruza la base. Desde la izquierda, las dos tienen materia delante.
          - texto: El dibujo d
            correcta: true
            mensaje: |
              Eso es. El cuerpo alto a la izquierda, junto al alzado, y la base delante; y dos ocultas:
              la generatriz de detrás del agujero, de arriba abajo, y la de delante, solo en la base,
              porque por encima de la base, delante del cuerpo alto, no hay pieza.

      - tipo: calcular
        titulo: Qué líneas del alzado van a trazos
        pregunta: |
          En este alzado de la pieza 1 están todas las líneas sin su tipo, y cuatro trozos llevan
          número. ¿Cuáles van a trazos?

          <figure class="figura-examen">
          <svg viewBox="0 0 216 190" role="img" width="216" height="190" aria-labelledby="t08e-p1-lineas-t t08e-p1-lineas-d">
            <title id="t08e-p1-lineas-t">El alzado de la pieza 1 con todas las líneas iguales y cuatro numeradas</title>
            <desc id="t08e-p1-lineas-d">El alzado de la pieza 1, calculado, con todas sus líneas continuas, del mismo grueso y sin ejes: un rectángulo con la línea de arriba de la base, a un tercio de la altura, y dos verticales de arriba abajo, las aristas del agujero, una a cada lado del centro. Cuatro trozos llevan número. 1: la vertical de la izquierda, de arriba hasta la línea de la base. 2: la misma vertical, dentro de la base. 3: la vertical de la derecha, de arriba hasta la línea de la base. 4: la misma vertical, dentro de la base.</desc>
            <path stroke="var(--ink)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M53.4 118.5L53.4 160M152.2 118.5L152.2 160"/>
            <path stroke="var(--ink)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M30 30L30 160M175.6 30L175.6 160M53.4 30L53.4 118.5M152.2 30L152.2 118.5M30 160L175.6 160M30 118.4L175.6 118.4M30 30L175.6 30"/>
            <text font-size="10.5px" font-family="var(--mono)" font-weight="700" paint-order="stroke" stroke="var(--paper)" stroke-width="3.4px" stroke-linejoin="round" x="65.1" y="79.4" text-anchor="middle" fill="var(--live)">1</text>
            <text font-size="10.5px" font-family="var(--mono)" font-weight="700" paint-order="stroke" stroke="var(--paper)" stroke-width="3.4px" stroke-linejoin="round" x="65.1" y="144.4" text-anchor="middle" fill="var(--live)">2</text>
            <text font-size="10.5px" font-family="var(--mono)" font-weight="700" paint-order="stroke" stroke="var(--paper)" stroke-width="3.4px" stroke-linejoin="round" x="140.5" y="79.4" text-anchor="middle" fill="var(--live)">3</text>
            <text font-size="10.5px" font-family="var(--mono)" font-weight="700" paint-order="stroke" stroke="var(--paper)" stroke-width="3.4px" stroke-linejoin="round" x="140.5" y="144.4" text-anchor="middle" fill="var(--live)">4</text>
          </svg>
          <figcaption>El alzado de la pieza 1, calculado, con las líneas sin su tipo. Cuáles van a trazos es lo que pregunta el paso.</figcaption>
          </figure>
        respuesta:
          tipo: conjunto
          valor: '2, 4'
          tolerancia: 0.1
          formato: los números de las líneas, separados por comas
        distractores:
          - valor: '1, 2, 3, 4'
            mensaje: |
              No todas. Un agujero no va a trazos por ser un agujero: va a trazos lo que tiene
              materia delante. Por encima de la base, el agujero es una media caña abierta por
              delante, y entre la 1 o la 3 y quien mira no hay nada: se ven.
          - valor: '1, 3'
            mensaje: |
              Al revés. La 1 y la 3 son las aristas de la media caña, abierta por delante: se ven. La
              2 y la 4 son las mismas aristas dentro de la base, y la cara de delante de la base las
              tapa.
          - valor: '2'
            mensaje: |
              Te falta la 4. La pieza es simétrica: a la derecha pasa lo mismo que a la izquierda, y
              la cara de delante de la base tapa también ese trozo de la arista.
          - valor: '4'
            mensaje: |
              Te falta la 2. La pieza es simétrica: a la izquierda pasa lo mismo que a la derecha, y
              la cara de delante de la base tapa también ese trozo de la arista.
          - valor: '1, 2'
            mensaje: |
              La 1 se ve, y te falta la 4. Cada arista cambia de tipo a la altura de la base: va a
              trazos solo donde la tapa la base, y eso pasa en las dos.
        pista: |
          Sigue el rayo desde cada trozo hacia delante, hacia ti: si atraviesa la pieza, va a trazos.
          ¿Qué hay delante del agujero por encima de la base, y qué hay en la base?
        desarrollo: |
          Las cuatro son las dos aristas del agujero, cada una partida a la altura de la base. Por
          encima de la base, el agujero es una media caña abierta por delante: entre la 1 o la 3 y
          quien mira no hay materia, y se ven. En la base el agujero está entero, y la cara de
          delante de la base tapa la 2 y la 4.

          Van a trazos la 2 y la 4.

      - tipo: dibujar
        consigna: |
          Dibuja en papel el alzado, la planta y el perfil izquierdo de la pieza 1, en el sistema
          europeo, con las medidas de la figura en proporción y las ocultas a trazos.
        comprueba:
          - punto: La planta debajo del alzado y el perfil izquierdo a su derecha, con el cuerpo alto a la izquierda del perfil.
            porque: |
              Es el sistema europeo: lo de detrás de la pieza queda junto al alzado. Con el cuerpo alto
              a la derecha del perfil, has dibujado el perfil derecho.
          - punto: En el alzado, las dos aristas del agujero continuas desde arriba hasta la base, y de trazos en la base.
            porque: |
              Arriba, el agujero es una media caña abierta por delante y sus aristas se ven; abajo, la
              cara de delante de la base las tapa. Es la misma línea, que cambia de tipo donde cambia lo
              que tiene delante.
          - punto: En la planta, la circunferencia entera del agujero, y la arista de delante del cuerpo alto solo a los dos lados de ella.
            porque: |
              Mirando desde arriba, el agujero atraviesa la pieza: su borde se ve entero, la mitad de
              detrás arriba del cuerpo alto y la de delante sobre la base.
          - punto: En el perfil, las dos generatrices del agujero a trazos, la de detrás de arriba abajo y la de delante solo en la base.
            porque: |
              Desde la izquierda, las dos quedan detrás de la cara izquierda de la pieza; y delante del
              cuerpo alto, por encima de la base, no hay pieza donde dibujar la de delante.
          - punto: Ninguna línea en el perfil a la altura de la base dentro del cuerpo alto.
            porque: |
              La base y el cuerpo alto tienen la cara izquierda en el mismo plano: no hay arista.
          - punto: Los ejes del agujero, de trazo y punto, en las tres vistas.
            porque: |
              En la planta, la cruz de ejes de la circunferencia; en el alzado y en el perfil, el eje
              vertical. Cada eje que falta cuesta en la hoja de criterios.
        figura: |
