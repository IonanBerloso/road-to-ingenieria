            <desc id="t08e-p1-opciones-d">Cuatro dibujos de la pieza 1 vista desde un lado, calculados y a la misma escala. Los cuatro son una L: un rectángulo alto en un extremo y la base, más baja, en el otro, con el eje del agujero de trazo y punto en el escalón. a: el alto a la izquierda, con una línea de trazos de arriba abajo cerca del borde izquierdo, otra corta en la base cerca del borde derecho, y una línea horizontal continua que cruza el rectángulo alto a la altura de la base. b: el alto a la derecha, con las dos líneas de trazos cambiadas de lado. c: el alto a la izquierda y ninguna línea de trazos. d: el alto a la izquierda, con la línea de trazos de arriba abajo cerca del borde izquierdo y la corta en la base, cerca del borde derecho.</desc>
