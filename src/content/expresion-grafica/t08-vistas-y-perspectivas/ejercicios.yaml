ejercicios:
  # Orden (§04): primero el nuestro, la escuadra (`ejemplo`), y después las
  # piezas 1, 2 y 3 del ejercicio 2.3 de las diapositivas «Normalización y
  # vistas» (pág. 14), en su orden. La pieza 4 se queda fuera de esta entrega
  # (revisión rev/m-ej-t08a): su lectura como sólido no se sostiene contra la
  # página, y una solución dudosa no se publica como buena.
  #
  # Todas las figuras las calcula el motor de vistas (src/lib/vistas) desde
  # una descripción de cada pieza: las piezas, los guiones que las dibujan y
  # el cotejo de cada una sobre la página están en la entrega de la unidad
  # m-ej-t08a (piezas/, figuras/ y cotejo/). Ninguna línea está puesta a mano.
  #
  # Decisión: el `reconocer` es el T1 del diseño de la fase M: cuatro dibujos
  # de una vista, rotulados a, b, c y d en minúscula para no confundirlos con
  # las letras de la norma (A alzado, B planta, C y D perfiles) ni con la
  # flecha A de la página. Los tres malos salen de la buena: la espejada
  # (el perfil del otro lado, o la planta dada la vuelta), sin las ocultas,
  # con una línea que el motor descarta (mismo plano o tangencia) o la de otra
  # pieza. La buena cambia de sitio en cada ejercicio.
  #
  # Decisión: el `calcular` es el T9 (qué vistas, por su letra de la norma
  # como número: A = 1 … F = 6, libro, pág. 2-13) donde la elección es real.
  # En la escuadra hace falta el perfil y los dos no valen lo mismo; en las
  # piezas 2 y 3 el enunciado pide «el perfil más adecuado» y los dos
  # perfiles, calculados, no tienen las mismas ocultas: 2 frente a 7 y 3
  # frente a 5. En la pieza 1 los dos perfiles son iguales, simétricos, y la
  # elección no es real: su `calcular` pregunta qué trozos de las aristas del
  # agujero van a trazos en el alzado, que es lo que esa pieza entrena.
  #
  # Decisión (revisión): ningún paso da hecha la respuesta del siguiente. El
  # enunciado de la escuadra no nombra las vistas que se piden; el
  # `reconocer` de la pieza 2 es del perfil izquierdo, no del que se dibuja;
  # y el `calcular` de la pieza 1 pregunta por el alzado, porque las ocultas
  # del perfil ya las enseña la opción buena del `reconocer`.
  #
  # Decisión: el `dibujar` dibuja el perfil «más adecuado» que pide la página,
  # el de menos ocultas: el derecho en las piezas 2 y 3 (en la 2, el de la
  # solución de la pág. 15) y el izquierdo en las demás.
  - id: vistas-escuadra-con-nervio
    titulo: Una escuadra con un nervio, y las vistas que hacen falta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      Esta escuadra tiene una base de 60 × 40 y 10 de grueso; detrás, sobre la base, una placa de
      10 de grueso que sube hasta 50; entre las dos, en medio, un nervio triangular de 10 de ancho
      que arranca a 10 del borde de delante y sube hasta 40 contra la placa; y en el extremo
      izquierdo de la base, una ranura en U de 10 de ancho y 20 de largo, abierta por la izquierda.
      La flecha A dice desde dónde se mira el alzado.

