      **Notas nuestras.** La página da las cuatro piezas en una figura; este ejercicio es el de la
      pieza 3, redibujada con el motor de vistas desde el mismo lado. La página no da cotas: la
      pieza tiene las medidas de la figura en proporción.
    notas:
      - 'Nota: A = vista de alzado'
    pide: La planta buena entre cuatro, las tres vistas que se dibujan por su letra de la norma y las tres dibujadas.
    pasos:
