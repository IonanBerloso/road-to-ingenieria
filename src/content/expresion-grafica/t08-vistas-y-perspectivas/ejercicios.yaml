        opciones:
          - texto: El dibujo a
            mensaje: |
              Es lo que se ve desde la **derecha**: la placa, que está detrás, sale a la derecha del
              dibujo, y la ranura, que por ese lado queda detrás de la base, en dos líneas de trazos.
              En el sistema europeo el perfil izquierdo va a la derecha del alzado, y lo de detrás de
              la pieza queda junto al alzado, a la izquierda del perfil. Poner aquí el perfil derecho
              es colocarlo como en el sistema americano.
          - texto: El dibujo b
            correcta: true
            mensaje: |
              Eso es. Mirada desde la izquierda, la placa de detrás queda a la izquierda del dibujo,
              junto al alzado, y lo de delante, lejos de él. El nervio enseña su triángulo, y la
              ranura, abierta por este lado, sale en dos líneas continuas: entre ellas y quien mira
              no hay materia. Este perfil no lleva ninguna oculta.
          - texto: El dibujo c
            mensaje: |
              Lleva una línea de más: la horizontal que cruza la placa a la altura de la base. La placa
              y la base tienen la cara izquierda en el mismo plano, así que ahí no hay arista: la cara
              es una sola. Es el error de pensar la pieza como bloques sumados y dibujar la junta.
          - texto: El dibujo d
            mensaje: |
              Es el perfil de **otra pieza**: la que lleva un taco macizo donde esta lleva el nervio.
              Las dos tienen el mismo alzado y la misma planta, y solo el perfil las distingue. El de
              esta escuadra enseña el triángulo del nervio, no un rectángulo.

      - tipo: calcular
        titulo: Las vistas que hacen falta
        pregunta: |
          ¿Qué vistas hacen falta para definir la escuadra sin ambigüedad, y ni una más? Escribe su
          letra de la norma como número: 1 el alzado (A), 2 la planta (B), 3 el perfil izquierdo (C),
          4 el perfil derecho (D), 5 la vista inferior (E) y 6 la posterior (F).
        respuesta:
          tipo: conjunto
          valor: '1, 2, 3'
          tolerancia: 0.1
          formato: los números de las vistas, separados por comas
        distractores:
          - valor: '1, 2'
            mensaje: |
              El alzado y la planta dan las tres medidas, pero no la forma del nervio. Un taco macizo
              de 10 de ancho, de 10 a 30 de fondo y hasta 40 de alto da exactamente las mismas líneas
              en las dos vistas; el triángulo solo sale en el perfil.
          - valor: '1, 3'
            mensaje: |
              Sin la planta, la forma del fondo de la ranura no sale en ninguna vista: en el alzado
              es una línea de trazos y en el perfil, dos continuas. Su fondo redondo solo se ve tal
              como es desde arriba, y cada forma de la pieza tiene que verse en alguna vista: es lo
              que las soluciones de las diapositivas señalan con «En esta vista».
          - valor: '1, 2, 4'
            mensaje: |
              El perfil derecho también define la pieza, pero desde la derecha la ranura queda detrás
              de la base y sale en dos líneas de trazos. El izquierdo dice lo mismo sin ninguna oculta,
              y entre dos vistas que dicen lo mismo se elige la que se lee mejor.
          - valor: '1, 2, 3, 4'
            mensaje: |
              Sobra el perfil derecho: repite lo que dice el izquierdo, con dos ocultas más. El criterio
              tiene dos mitades, definir la pieza por completo y dibujar el menor número de vistas.
          - valor: '2, 3'
            mensaje: |
              Falta el alzado. Es la vista principal y va siempre: las demás se colocan y se leen en
              relación con él.
          - valor: '1'
            mensaje: |
              Una vista da dos de las tres medidas: el alzado no dice nada del fondo. Con una sola
              vista solo se define una pieza de revolución con sus diámetros acotados, y esta no lo es.
        pista: |
          Busca, para cada pareja de vistas que incluya el alzado, qué no dice: el alzado y la planta
          no enseñan la forma del nervio; el alzado y el perfil, la del fondo de la ranura.
        desarrollo: |
          El alzado va siempre. Con él, la planta da el fondo de la ranura en U, que en las otras
          vistas son rectas; y el perfil da el triángulo del nervio, que en el alzado y en la planta
          sale igual que un taco macizo. Hacen falta las tres. Y de los dos perfiles, el izquierdo:
          enseña la ranura abierta, en continua, y el derecho la tendría a trazos.

          Son la 1, la 2 y la 3.

      - tipo: dibujar
        consigna: |
          Dibuja en papel el alzado, la planta y el perfil izquierdo de la escuadra, en el sistema
          europeo, con las medidas del enunciado y las ocultas a trazos.
        comprueba:
          - punto: La planta debajo del alzado y el perfil izquierdo a su derecha.
            porque: |
              Es el sistema europeo, el de las láminas. Colocar mal una vista incumple la mitad del
              mínimo «Dibujar y colocar correctamente al menos una vista».
          - punto: Las anchuras del alzado en la planta, las alturas del alzado en el perfil y el fondo de 40 en la planta y en el perfil.
            porque: |
              Las tres vistas son de la misma pieza: el nervio, de 25 a 35, va en la misma vertical en
              el alzado y en la planta; la base de 10, la punta del nervio a 40 y la placa a 50, en la
              misma horizontal en el alzado y en el perfil.
          - punto: En el perfil, la placa a la izquierda, junto al alzado, y la punta del nervio hacia la derecha, a 10 del borde de delante.
            porque: |
              En el sistema europeo, lo de delante queda lejos del alzado. Si la placa sale a la
              derecha, has dibujado el perfil desde el otro lado.
          - punto: En el alzado, una sola línea de trazos, a 20 del borde izquierdo y en la altura de la base.
            porque: |
              Es el fondo redondo de la ranura, que queda detrás de la cara de delante de la base: entre
              él y quien mira hay materia. En la planta y en el perfil izquierdo, la ranura se ve.
          - punto: Ninguna línea en el perfil donde la placa se apoya en la base.
            porque: |
              Las dos tienen la cara izquierda en el mismo plano: es una sola cara, y ahí no hay arista.
          - punto: El eje de la ranura, de trazo y punto, en las tres vistas, y que sobresalga un poco del contorno.
            porque: |
              Toda superficie de revolución lleva su eje, y en la hoja de criterios cada eje que falta
              cuesta.
        figura: |
          <svg viewBox="0 0 318 287" role="img" width="318" height="287" aria-labelledby="t08e-esc-vistas-t t08e-esc-vistas-d">
            <title id="t08e-esc-vistas-t">El alzado, la planta y el perfil izquierdo de la escuadra, en el sistema europeo</title>
            <desc id="t08e-esc-vistas-d">Las tres vistas de la escuadra, calculadas. Arriba a la izquierda, el alzado: un rectángulo de 60 por 50 con la línea de la base a 10 de altura, el nervio en medio como un rectángulo estrecho que sube hasta 40, y una línea de trazos a 20 del borde izquierdo, en la altura de la base, con el eje de la ranura de trazo y punto. Debajo, la planta: la placa como una franja arriba, junto al alzado; el nervio como un rectángulo estrecho que baja de la placa hasta 10 del borde de delante; y la ranura en U, abierta por la izquierda, en líneas continuas. A la derecha del alzado, el perfil izquierdo: la placa a la izquierda, junto al alzado; el triángulo del nervio bajando hacia la derecha; la base abajo, y en ella las dos líneas continuas de la ranura. Entre la base y la placa no hay ninguna línea.</desc>
