      Di qué vistas hacen falta para definirla, ni una más, y dibújalas en el sistema europeo.
    pide: El perfil izquierdo bueno entre cuatro, las vistas que hacen falta por su letra de la norma y esas vistas dibujadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Estos son cuatro dibujos del perfil izquierdo de la escuadra, la pieza mirada desde su
          izquierda. Solo uno está bien. ¿Cuál?

