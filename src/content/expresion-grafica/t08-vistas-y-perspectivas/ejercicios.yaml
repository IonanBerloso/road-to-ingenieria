      - tipo: justificar
        pregunta: Ordena por qué en el alzado las aristas del agujero son continuas arriba y de trazos abajo. Una pieza es falsa.
        piezas:
          - texto: El agujero atraviesa la pieza de arriba abajo, con el eje en el plano de la cara de delante del cuerpo alto.
          - texto: En el cuerpo alto queda abierto por delante, como una media caña, y entre sus aristas y quien mira no hay materia.
          - texto: En la base queda entero, y la cara de delante de la base tapa sus aristas.
          - texto: Por eso cada arista va continua hasta la cara de arriba de la base, y de trazos desde ahí hasta abajo.
          - texto: Como es un agujero, sus aristas van a trazos en todo el alzado.
            trampa: true
            mensaje: |
              Un agujero no va a trazos por ser un agujero. Va a trazos lo que tiene materia delante, y
              arriba la media caña está abierta por delante: sus aristas se ven.
    resolucion: |
      **La pieza.** Un bloque en L: una base baja delante y un cuerpo alto detrás, del mismo ancho.
      Un agujero vertical lo atraviesa entero, con el eje en el plano de la cara de delante del
      cuerpo alto: en el cuerpo alto deja una media caña abierta por delante, y en la base, un
      agujero entero.

      **El alzado.** Cada arista del agujero es una sola línea de arriba abajo, y cambia de tipo a
      la altura de la base: continua donde la media caña está abierta, de trazos donde la tapa la
      base ([las aristas ocultas](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#las-aristas-ocultas)).

      **La planta y el perfil.** En la planta el agujero se ve entero. En el perfil izquierdo van a
      trazos sus dos generatrices: la de detrás de arriba abajo, la de delante solo en la base. La
      pieza es simétrica de izquierda a derecha y los dos perfiles dicen lo mismo con las mismas
      ocultas: ninguno es más adecuado que el otro, y se dibuja el izquierdo, el que acompaña al
      alzado y a la planta en casi todos los planos.

      **Los errores que se ven.** Una línea en el perfil donde la base y el cuerpo alto siguen el
      mismo plano, y el perfil del otro lado puesto en este, entre los
      [errores que se ven en una vista](/road-to-ingenieria/expresion-grafica/t08-vistas-y-perspectivas/#los-errores-que-se-ven-en-una-vista);
      y dibujar a trazos las aristas de la media caña, que se ven.

