          <figcaption>La recta r con el triángulo ABC tomado como una lámina opaca: en continua lo visto y en discontinua lo oculto, el alzado arriba y la planta abajo. En azul r, en violeta la perpendicular PT y en verde la proyección RT.</figcaption>
          </figure>
        veredicto: >-
          Si tu dibujo tiene oculto en la planta el tramo de 1₁ a R₁ y en el alzado el de R₂ a C₂B₂, y
          todo lo demás en continua, la visibilidad está bien. Si has tomado ABC como un plano y no
          como una lámina, r va entera en continua: la hoja no lo precisa, y aquí se toma opaca.

      - tipo: calcular
        titulo: El ángulo de r con el plano
        pregunta: ¿Cuántos grados mide δ, el ángulo entre la recta r y el plano ABC?
        respuesta:
          tipo: numero
          valor: '56.88'
          receta: delta
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '33.12'
            receta: 90 - delta
            mensaje: |
              Ese es el **complementario**: el ángulo de r con la perpendicular t, el de P₀ en el
              triángulo abatido. δ está en R₀, entre R₀T₁ y R₀P₀. (Por casualidad, el ángulo de r con el
              plano horizontal mide 33,2°, casi lo mismo: si has medido ese, el error es otro, y la
              casilla no los distingue. El plano de la referencia es ABC, no el horizontal.)
          - valor: '123.12'
            receta: 180 - delta
            mensaje: |
              Ese es el **suplementario**: el ángulo entre R₀P₀ y la prolongación de T₁R₀ más allá de
              R₀. El ángulo entre una recta y un plano va de 0 a 90°: es el del triángulo, en R₀.
          - valor: '31.78'
            receta: ang_planta
            mensaje: |
              Es lo que forman r₁ y R₁T₁ **en la planta**. El plano PTR no es horizontal, y la planta
              deforma su ángulo: hace falta abatirlo, o ponerlo en verdadera magnitud de otra manera.
          - valor: '69.45'
            receta: ang_alzado
            mensaje: |
              Es lo que forman r₂ y R₂T₂ **en el alzado**. El plano PTR tampoco es frontal, y el alzado
              deforma el ángulo igual que la planta.
          - valor: '50.44'
            receta: ang_radio_dz
            mensaje: |
              Has abatido P con un radio igual a lo que P está más alto que T, P₂K, que es solo un
              cateto: P₀ cae más cerca de la charnela de lo que toca, el triángulo sale deformado y su
              ángulo en R₀ mide 50,4°. El radio es la hipotenusa de P₂K y de MP₁, 56,6 mm.
        pista: |
          Con el transportador del Taller en el paso anterior, o en tu lámina de papel: el ángulo del
          triángulo abatido en R₀, entre R₀T₁ y R₀P₀. Si mides el de P₀, es su complementario.
        desarrollo: |
          En el triángulo PTR, rectángulo en T, el cateto opuesto a δ es PT y la hipotenusa, PR:

          $$
          \operatorname{sen}\delta = \frac{PT}{PR} = \frac{59{,}28}{70{,}78} \approx 0{,}8375, \qquad \delta \approx 56{,}88^{\circ}
          $$

          Una casualidad de esta lámina: r forma con la arista BC 56,94°, a 0,06° de δ. Quien tomara por
          ángulo con el plano el que r forma con BC tendría una cifra que la casilla da por buena, y no
          se puede distinguir; con cualquier otra recta del plano sale más, porque el de la proyección
          es el más pequeño.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Por P, un punto de r, la perpendicular t al plano, con t₁ perpendicular a h₁ y t₂ perpendicular a f₂, porque el ángulo recto se ve recto donde la recta del plano está en verdadera magnitud.
          - texto: R, donde r corta al plano, y T, donde lo corta t, salen con un plano auxiliar vertical que contiene a cada recta.
          - texto: 'RT es la proyección de r sobre el plano: el ángulo δ está en R, entre RP y RT, y el triángulo PTR es rectángulo en T.'
          - texto: Abatido el triángulo PTR alrededor de su horizontal por T, se ve en verdadera magnitud, y δ se mide en R₀ con el transportador.
          - texto: δ se mide en la planta, entre r₁ y R₁T₁, porque ahí están R y T.
            trampa: true
            mensaje: |
              La planta deforma el ángulo: el plano PTR no es horizontal. Ese ángulo mide 31,8°, y δ,
              56,9°. Un ángulo solo se mide en una vista si su plano está en verdadera magnitud en ella.
    resolucion: |
      **Qué se busca.** El ángulo de una recta con un plano es el que forma con su proyección sobre el
      plano. Se toma un punto P de r —aquí, el extremo común de r₂ y r₁, que están en la misma
      vertical— y se baja la perpendicular t al plano: su pie T y el punto R donde r corta al plano
      dan la proyección RT. El triángulo PTR es rectángulo en T, y su ángulo en R es δ.

      **R.** Por r pasa un plano vertical, que en la planta se ve como r₁. Corta a A₁C₁ en 1₁ y a
      C₁B₁ en 2₁; subidos al alzado, 1₂2₂ es la intersección de ese plano con ABC, y corta a r₂ en R₂.
      R₁ está en su vertical, sobre r₁.

      **T.** La horizontal del plano por 2 y la frontal por 1 dan las direcciones de la
      perpendicular: t₁ perpendicular a h₁ por P₁ y t₂ perpendicular a f₂ por P₂. t es casi de perfil:
      sus dos proyecciones salen casi verticales. Con el plano vertical de t, que en la planta es t₁,
      como con r: 3₁ y 4₁ en C₁B₁ y A₁B₁, subidos al alzado, y 3₂4₂ corta a t₂ en T₂. T₁ está en su
      vertical, sobre t₁.

      **La posición.** El ángulo tiene el vértice en R y los lados RP y RT: R₁T₁ y R₂T₂ son la
      proyección de r sobre el plano. En ninguna vista está en verdadera magnitud: el plano PTR no es
      horizontal ni frontal, y en la planta se ve de 31,8° y en el alzado de 69,5°.

      **La magnitud.** Se abate el triángulo PTR alrededor de su horizontal por T, J₁T₁, donde J es el
      punto de r a la cota de T. P está 48,7 mm más alto que T y su planta, 28,8 mm apartada de la
      charnela: el radio es la hipotenusa, 56,6 mm, y P₀ cae en la perpendicular a la charnela por P₁.
      R₀ sale por afinidad, en J₁P₀. El triángulo P₀T₁R₀ es PTR en verdadera magnitud, con PT = 59,3 mm,
      RT = 38,7 mm y PR = 70,8 mm, y su ángulo en R₀ es δ = 56,9°. El de P₀, 33,1°, es el de r con la
      perpendicular.

      **Lo visto y lo oculto.** Con ABC como una lámina opaca, P queda encima del plano y delante de
      él. En la planta, r va oculta de 1₁ a R₁; en el alzado, de R₂ a donde sale por C₂B₂. t y RT se
      ven enteras.

      **La comprobación.** El triángulo abatido es recto en T₁, y T₁P₀ mide lo mismo que PT de verdad.
      Y sen δ = PT/PR = 59,28/70,78 da los mismos 56,88°.

  - id: sd66-el-mastil-sobre-el-tejado
    titulo: El mástil sobre el tejado, sus anclajes y sus ángulos
    fuente: Ejercicio 50 (SD66) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 51, A3
    # girada). El a), con un construir: el alzado de cada anclaje por una
    # horizontal de su faldón. El b) y el d), de una misma vista nueva con la
    # cumbrera de punta, y el c), abatiendo el plano ACE con la charnela AC,
    # que es frontal: dos construir más, y un calcular por apartado.
    enunciado: |
      Un mástil colocado verticalmente sobre un tejado, apoyando su extremo B en el faldón, se
      sostiene por tres barras rectas AC, AE y AD ancladas al tejado en los puntos C, D y E, tal como
      se indica en las proyecciones diédricas alzado y planta. Se pide determinar gráficamente:

      a) Puntos de intersección C, D y E.

      b) Ángulo entre los dos faldones del tejado.

      c) Ángulo entre barras AC y AE.

      d) Ángulo que forma la barra AD con el faldón.

      **Notas nuestras.** La figura es el tejado a dos aguas, con el mástil AB, en el alzado, arriba, y
      en la planta, debajo, girada. Los dos aleros están a la misma altura y la cumbrera es
      horizontal; en la planta, la cumbrera va paralela a los aleros, mucho más cerca del de atrás:
      el faldón trasero es estrecho y empinado, y el delantero, ancho. Las barras solo están dadas en la
      planta, de A₁ a C₁, D₁ y E₁; en el alzado solo está el mástil. «Puntos de intersección» quiere
      decir dónde se clavan las barras en el tejado: el alzado de C, D y E, que son puntos del tejado.
      Los tres caen en la planta por delante de la cumbrera, y están en el faldón delantero, el mismo
      en que apoya el mástil. Por eso leemos «el faldón» del apartado d) como el delantero: es en el que se
      ancla D. Con el trasero, que AD no toca, el ángulo sería otro, y también se da. B₂ queda 0,4 mm
      por encima del faldón: es del original, y no se usa. F y G son los extremos de la cumbrera, H y J
      las esquinas del alero delantero y K y L las del trasero; ellos, los puntos 1, 2 y 3, M, N, T, Y,
      Z, E⁰, D′ y la vista 4 son nuestros. La lámina no da escala: las medidas son de la lámina. Los
      métodos son nuestros: el enunciado pide determinar gráficamente, sin decir cómo. El del
      apartado d) es el triángulo PTR del tema con la barra: P es A, R es D, que ya está en el
      faldón, y T es el pie de la perpendicular t desde A; ese triángulo, rectángulo en T, se pone
      en verdadera magnitud girando D alrededor de t. El atajo del tema, abatir el plano de AD y t y
      restar de 90° el ángulo en A, da lo mismo.
    pide: El alzado de los anclajes C, D y E, y, en grados, el ángulo entre los dos faldones, el de las barras AC y AE y el de la barra AD con el faldón en el que se ancla, con las construcciones que los dan.
    receta:
      lamina: sd66
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        J: 'punto3(alzado: figura.punto("J2"), planta: figura.punto("J1"))'
        K: 'punto3(alzado: figura.punto("K2"), planta: figura.punto("K1"))'
        L: 'punto3(alzado: figura.punto("L2"), planta: figura.punto("L1"))'
        delantero: plano(F, G, H)
        trasero: plano(F, G, L)
      solucion:
        # a) Los anclajes, en el faldón delantero: sus plantas caen por delante
        # de la cumbrera. Cada uno, por la horizontal del faldón que pasa por
        # él, paralela a la cumbrera en la planta, hasta el borde del faldón
        # más cercano: el de la derecha (JG) para C y E, el de la izquierda
        # (HF) para D. Los puntos 1, 2 y 3 son esos cortes.
        C: 'punto_en_plano(planta: figura.punto("C1"), plano: delantero)'
        D: 'punto_en_plano(planta: figura.punto("D1"), plano: delantero)'
        E: 'punto_en_plano(planta: figura.punto("E1"), plano: delantero)'
        Uc: pie_comun(recta3(J, G), horizontal_por(C, delantero))
        Ud: pie_comun(recta3(H, F), horizontal_por(D, delantero))
        Ue: pie_comun(recta3(J, G), horizontal_por(E, delantero))
        vC1: 'segmento2(figura.punto("C1"), desplaza(figura.punto("C1"), dy: -10))'
        vD1: 'segmento2(figura.punto("D1"), desplaza(figura.punto("D1"), dy: -10))'
        vE1: 'segmento2(figura.punto("E1"), desplaza(figura.punto("E1"), dy: -10))'
        hC2: segmento2(proy_alzado(Uc), proy_alzado(C))
        hD2: segmento2(proy_alzado(Ud), proy_alzado(D))
        hE2: segmento2(proy_alzado(Ue), proy_alzado(E))
        # Los errores: tomar el borde del faldón en la vertical del punto, o el
        # alero.
        Cborde: 'cruce_aparente(vC1, figura.segmento("JG2"))'
        Dborde: 'cruce_aparente(vD1, figura.segmento("HF2"))'
        Ealero: 'cruce_aparente(vE1, figura.segmento("HJ2"))'
        # b) y d) Decisión: un cambio de plano vertical con la línea nueva de la
        # lámina, perpendicular a la cumbrera, y H de referencia: los aleros
        # caen en la línea, la cumbrera sale de punta (F₄ ≡ G₄) y los dos
        # faldones se ven de canto.
        F_4: 'cambio_plano_vertical(F, figura.segmento("nueva"), ref: H)'
        H_4: 'cambio_plano_vertical(H, figura.segmento("nueva"), ref: H)'
        L_4: 'cambio_plano_vertical(L, figura.segmento("nueva"), ref: H)'
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva"), ref: H)'
        D_4: 'cambio_plano_vertical(D, figura.segmento("nueva"), ref: H)'
        pieF: 'pie_perpendicular(figura.punto("F1"), figura.segmento("nueva"))'
        pieA: 'pie_perpendicular(figura.punto("A1"), figura.segmento("nueva"))'
        F2b: 'pie_perpendicular(figura.punto("F2"), figura.segmento("HJ2"))'
        A2b: 'pie_perpendicular(figura.punto("A2"), figura.segmento("HJ2"))'
        canto: segmento2(F_4, H_4)
        projA: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("nueva"))'
        projD: 'perpendicular(por: figura.punto("D1"), a: figura.segmento("nueva"))'
        angFaldones: angulo_planos(delantero, trasero)
        diedroF: angulo_diedro(H, recta3(F, G), L)
        # d) Decisión: el ángulo de AD con el faldón, girando D alrededor de la
        # perpendicular t al faldón por A hasta el plano paralelo a la vista 4:
        # el giro deja D en el faldón y no cambia el ángulo, y entonces AD se
        # ve en verdadera magnitud y el faldón de canto. T es el pie de t, que
        # cae en el plano del faldón 2,0 mm más allá de la cumbrera. D′ (Dg)
        # está en la línea de máxima pendiente del faldón por T, a TD de T, del
        # lado de D (rama 1: Tm está por delante de T).
        T: pie_en_plano(A, delantero)
        Tdel2: 'uno(medir_sobre(perpendicular(por: proy_planta(T), a: figura.segmento("cumbrera1")), desde: proy_planta(T), distancia: 20), 1)'
        Tm: 'punto_en_plano(planta: Tdel2, plano: delantero)'
        Dgd: 'punto_a_distancia(recta3(T, Tm), desde: T, distancia: vm(T, D))'
        Dg: rama(Dgd, 1)
        T_4: 'cambio_plano_vertical(T, figura.segmento("nueva"), ref: H)'
        Dg_4: 'cambio_plano_vertical(Dg, figura.segmento("nueva"), ref: H)'
        # Lo que D está más lejos de la línea nueva que A, en la planta: A₁Y,
        # con Y en la paralela a la cumbrera por A₁, a la altura de D₁. Z, en la
        # perpendicular al canto por D₄, a esa distancia: T₄Z = TD.
        Y: 'cruce_aparente(perpendicular(por: figura.punto("D1"), a: figura.segmento("cumbrera1")), projA)'
        Y3: 'punto3(alzado: pie_perpendicular(Y, figura.segmento("HJ2")), planta: Y)'
        prof: vm_planta(A, Y3)
        perpD4: 'perpendicular(por: D_4, a: canto)'
        Z: 'uno(medir_sobre(perpD4, desde: D_4, distancia: prof), 2)'
        angAD: angulo_recta_plano(recta3(A, D), delantero)
        angADtrasero: angulo_recta_plano(recta3(A, D), trasero)
        angADph: angulo_con_ph(segmento3(A, D))
        # Los errores de la vista 4: la cumbrera hacia el lado de la planta; A₄
        # con la altura del mástil sobre B; D′ con solo lo que D está más lejos;
        # y el ángulo de A₄D₄ con el canto, sin girar.
        F4mal: 'uno(medir_sobre(figura.segmento("cumbrera1"), desde: pieF, distancia: diferencia_de_cotas(F, H)), 2)'
        A4mal: 'medir_sobre(projA, desde: pieA, distancia: diferencia_de_cotas(A, punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))))'
        Dprof: 'medir_sobre(canto, desde: T_4, distancia: prof)'
        Dg4s: 'medir_sobre(canto, desde: T_4, distancia: vm(T, D))'
        horRef: 'segmento2(figura.punto("H2"), figura.punto("J2"))'
        D4z: 'punto3(alzado: pie_perpendicular(D_4, horRef), planta: D_4)'
        A4z: 'punto3(alzado: pie_perpendicular(A_4, horRef), planta: A_4)'
        F4z: 'punto3(alzado: pie_perpendicular(F_4, horRef), planta: F_4)'
        angVista4: angulo_rectas(recta3(D4z, A4z), recta3(D4z, F4z))
        # Lo que se ve de los faldones en el alzado: el hastial de la izquierda,
        # en F₂, entre F₂H₂ y F₂L₂ (los puntos llevados al alejamiento de F).
        horF1: 'segmento2(figura.punto("F1"), desplaza(figura.punto("F1"), dx: 10))'
        Hf: 'punto3(alzado: figura.punto("H2"), planta: pie_perpendicular(figura.punto("H2"), horF1))'
        Lf: 'punto3(alzado: figura.punto("L2"), planta: pie_perpendicular(figura.punto("L2"), horF1))'
        angHastial: angulo_rectas(recta3(F, Hf), recta3(F, Lf))
        pendDelantero: angulo_con_ph(delantero)
        # c) Decisión: AC es frontal (A₁C₁ es horizontal en el papel), así que
        # sirve de charnela para abatir el plano ACE sobre el plano frontal de
        # AC, en el alzado. E abatido es una elección; la charnela va de C a A
        # para que la rama 1 sea la de arriba a la derecha, lejos del tejado.
        ace: plano(A, C, E)
        chAC: recta3(C, A)
        Me: pie_perpendicular(E, chAC)
        Eab: abatido_a_elegir(E, chAC, ace)
        lAC2: segmento2(figura.punto("A2"), proy_alzado(C))
        perpE2: 'perpendicular(por: proy_alzado(E), a: lAC2)'
        paraE2: 'perpendicular(por: proy_alzado(E), a: perpE2)'
        Kc: 'uno(medir_sobre(paraE2, desde: proy_alzado(E), distancia: vm_planta(A, E)), 2)'
        angCAE: angulo_rectas(recta3(A, C), recta3(A, E))
        E0alzado: 'uno(medir_sobre(perpE2, desde: proy_alzado(Me), distancia: vm_alzado(E, Me)), 2)'
        E0alej: 'medir_sobre(perpE2, desde: proy_alzado(Me), distancia: vm_planta(A, E))'
        horA2: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dx: 10))'
        Ch: 'punto3(alzado: pie_perpendicular(figura.punto("C1"), horA2), planta: figura.punto("C1"))'
        Eh: 'punto3(alzado: pie_perpendicular(figura.punto("E1"), horA2), planta: figura.punto("E1"))'
        Ef: 'punto3(alzado: proy_alzado(E), planta: pie_perpendicular(proy_alzado(E), figura.segmento("AC1")))'
        angPlantaCAE: angulo_rectas(recta3(A, Ch), recta3(A, Eh))
        angAlzadoCAE: angulo_rectas(recta3(A, C), recta3(A, Ef))
        # Los extremos de las rectas largas y de los arcos de la construcción.
        L_pC: 'uno(medir_sobre(segmento2(figura.punto("C1"), proy_planta(Uc)), desde: proy_planta(Uc), distancia: 5), 1)'
        L_pD: 'uno(medir_sobre(segmento2(figura.punto("D1"), proy_planta(Ud)), desde: proy_planta(Ud), distancia: 5), 1)'
        L_pE: 'uno(medir_sobre(segmento2(figura.punto("E1"), proy_planta(Ue)), desde: proy_planta(Ue), distancia: 5), 1)'
        L_vC: 'desplaza(proy_alzado(C), dy: -6)'
        L_vD: 'desplaza(proy_alzado(D), dy: -6)'
        L_vE: 'desplaza(proy_alzado(E), dy: -6)'
        L_hC: 'desplaza(proy_alzado(C), dx: -6)'
        L_hD: 'desplaza(proy_alzado(D), dx: 6)'
        L_hE: 'desplaza(proy_alzado(E), dx: -6)'
        L_F4: 'uno(medir_sobre(figura.segmento("cumbrera1"), desde: F_4, distancia: 8), 1)'
        L_H4: 'uno(medir_sobre(figura.segmento("HJ1"), desde: H_4, distancia: 6), 1)'
        L_L4: 'uno(medir_sobre(figura.segmento("KL1"), desde: L_4, distancia: 6), 2)'
        L_F2b: 'desplaza(F2b, dy: 6)'
        L_A2b: 'desplaza(A2b, dy: 6)'
        L_canto: 'uno(medir_sobre(canto, desde: F_4, distancia: 14), 2)'
        T_F4: 'uno(medir_sobre(canto, desde: F_4, distancia: 20), 1)'
        L_A4: 'uno(medir_sobre(projA, desde: A_4, distancia: 6), 2)'
        L_Yb: 'uno(medir_sobre(projA, desde: Y, distancia: 6), 1)'
        L_D4: 'uno(medir_sobre(projD, desde: D_4, distancia: 6), 2)'
        L_T4: 'uno(medir_sobre(perpendicular(por: A_4, a: canto), desde: T_4, distancia: 5), 1)'
        L_Y: 'uno(medir_sobre(segmento2(figura.punto("D1"), Y), desde: Y, distancia: 5), 1)'
        L_Z: 'uno(medir_sobre(perpD4, desde: Z, distancia: 5), 2)'
        T_Dg: 'uno(medir_sobre(canto, desde: Dg_4, distancia: 20), 2)'
        L_AC: 'uno(medir_sobre(lAC2, desde: proy_alzado(Me), distancia: 6), 1)'
        L_E0: 'uno(medir_sobre(perpE2, desde: proy_alzado(rama(Eab, 1)), distancia: 6), 2)'
        L_Kc: 'uno(medir_sobre(paraE2, desde: Kc, distancia: 6), 2)'
        T_A2: 'uno(medir_sobre(lAC2, desde: figura.punto("A2"), distancia: 25), 1)'
      comprueba:
        # J está en el faldón delantero y K en el trasero: el tejado es plano.
        # La cumbrera y los aleros son horizontales, y D′ sigue en el faldón.
        - en_plano(J, delantero)
        - en_plano(K, trasero)
        - en_plano(Dg, delantero)
        - en_plano(T, delantero)
    pasos:
      - tipo: reconocer
        pregunta: En la planta, C₁, D₁ y E₁ caen los tres por delante de la cumbrera. ¿Qué dice eso, y cómo se saca el alzado de los anclajes?
        opciones:
          - texto: Que están en el faldón delantero, y su alzado está en la vertical de su planta, donde corta el borde del tejado que se ve en el alzado
            mensaje: |
              En el faldón delantero sí, pero el borde del tejado en el alzado es el contorno del faldón,
              no el faldón. C, por ejemplo, está dentro: en la vertical de C₁, la arista J₂G₂ queda 6,2 mm
              más abajo que C₂. La altura de cada punto sale de una horizontal del faldón que pase por él.
          - texto: Que están a la misma altura que B, el pie del mástil, porque el mástil se apoya en el mismo faldón
            mensaje: |
              El mismo faldón no quiere decir la misma altura: el faldón está inclinado, y cuanto más cerca
              de la cumbrera, más alto. D está 23,6 mm por encima del alero, C 28,1 y E, junto al alero
              delantero, solo 2,6.
          - texto: Que los tres están en el faldón delantero, y el alzado de cada uno sale de una horizontal de ese faldón, paralela a la cumbrera en la planta y horizontal en el alzado, que se lleva hasta un borde del faldón
            correcta: true
            mensaje: |
              Eso es. Un punto de un plano se pone por una recta del plano que pase por él. La horizontal
              es la más cómoda: en la planta va paralela a la cumbrera, y corta el borde del faldón, la
              arista del hastial, en un punto que se sube al alzado; a esa altura, la vertical de la
              planta da el punto.

      - tipo: construir
        titulo: Los anclajes C, D y E, por las horizontales del faldón
        intro: |
          Los tres anclajes están en el faldón delantero. Para cada uno, en la planta, la paralela a la
          cumbrera por su planta, que es una horizontal del faldón, hasta el borde más cercano: J₁G₁ para
          C₁ y E₁, F₁H₁ para D₁. Ese punto (1, 2 o 3) se sube por su vertical al mismo borde en el alzado,
          J₂G₂ o F₂H₂, y la horizontal que pasa por él corta la vertical del anclaje en su alzado. Después,
          las barras: A₂C₂, A₂D₂ y A₂E₂. Marca C₂, D₂ y E₂. Avisos para el imán: 3₁ cae a 3 mm de
          J₁; E₂, a 2,6 mm del alero; C₂, a 3,6 mm de 1₂, y D₂, a 2,7 mm de 2₂; amplía con la lupa
          (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: C2
            pide: el anclaje C, en el alzado
            es: proy_alzado(C)
            bien: |
              C₂ está en la vertical de C₁, a la altura de 1₂: 28,1 mm por encima del alero. La horizontal
              del faldón por C, paralela a la cumbrera en la planta, lleva esa altura.
            diagnosticos:
              - si: cerca_de(solucion.Cborde)
                mensaje: |
                  Ese punto está en la arista J₂G₂, el borde del faldón: es el punto del borde que cae en la
                  vertical de C₁, no C. C está dentro del faldón, más cerca de la cumbrera, y su altura sale
                  de la horizontal por C, que corta el borde en 1.
                ejemplo: solucion.Cborde
              - si: '!en_recta(solucion.vC1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(C), dx: mm(5))'
              - si: '!en_recta(solucion.hC2)'
                mensaje: |
                  Estás en la vertical de C₁, pero no a la altura buena. C₂ está en la horizontal de 1₂, el
                  punto donde la paralela a la cumbrera por C₁ corta J₁G₁, subido a J₂G₂.
                ejemplo: 'desplaza(proy_alzado(C), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  C₂ está donde la vertical de C₁ corta la horizontal de 1₂.
          - nombre: D2
            pide: el anclaje D, en el alzado
            es: proy_alzado(D)
            bien: |
              D₂ está en la vertical de D₁, a la altura de 2₂: 23,6 mm por encima del alero. 2 es el punto
              del borde F H del faldón que está en la horizontal de D.
            diagnosticos:
              - si: cerca_de(solucion.Dborde)
                mensaje: |
                  Ese punto está en la arista F₂H₂, el borde del faldón: está en la vertical de D₁, pero no es
                  D. D está dentro del faldón, 4,6 mm más abajo: su altura la da la horizontal por D, que
                  corta el borde en 2.
                ejemplo: solucion.Dborde
              - si: '!en_recta(solucion.vD1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**.
                ejemplo: 'desplaza(proy_alzado(D), dx: mm(5))'
              - si: '!en_recta(solucion.hD2)'
                mensaje: |
                  Estás en la vertical de D₁, pero no a la altura buena. D₂ está en la horizontal de 2₂, el
                  punto donde la paralela a la cumbrera por D₁ corta F₁H₁, subido a F₂H₂.
                ejemplo: 'desplaza(proy_alzado(D), dy: mm(5))'
              - si: siempre
                mensaje: |
                  D₂ está donde la vertical de D₁ corta la horizontal de 2₂.
          - nombre: E2
            pide: el anclaje E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la vertical de E₁, que es la del mástil, a la altura de 3₂: 2,6 mm por encima del
              alero, porque E está cerca del alero delantero.
            diagnosticos:
              - si: cerca_de(solucion.Ealero)
                mensaje: |
                  Ese punto está en el alero. E está muy cerca de él en la planta, pero no encima: el faldón
                  ya ha subido 2,6 mm. La horizontal por E corta el borde J G en 3, y 3₂ da la altura.
                ejemplo: solucion.Ealero
              - si: '!en_recta(solucion.vE1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**, que es la misma del mástil: A₁E₁ es vertical en el papel.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(5))'
              - si: '!en_recta(solucion.hE2)'
                mensaje: |
                  Estás en la vertical de E₁, pero no a la altura buena. E₂ está en la horizontal de 3₂, el
                  punto donde la paralela a la cumbrera por E₁ corta J₁G₁, subido a J₂G₂.
                ejemplo: 'desplaza(proy_alzado(E), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  E₂ está donde la vertical de E₁ corta la horizontal de 3₂.
        trazado:
          - segmento2(figura.punto("A2"), proy_alzado(C))
          - segmento2(figura.punto("A2"), proy_alzado(D))
          - segmento2(figura.punto("A2"), proy_alzado(E))
          - segmento2(figura.punto("C1"), proy_planta(solucion.Uc))
          - segmento2(figura.punto("D1"), proy_planta(solucion.Ud))
          - segmento2(figura.punto("E1"), proy_planta(solucion.Ue))
          - segmento2(proy_alzado(solucion.Uc), proy_alzado(C))
          - segmento2(proy_alzado(solucion.Ud), proy_alzado(D))
          - segmento2(proy_alzado(solucion.Ue), proy_alzado(E))
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_pC)
            guia: figura.segmento("cumbrera1")
            porque: |
              Por C₁, la paralela a la cumbrera, hacia la derecha, hasta pasar J₁G₁: es la horizontal del
              faldón delantero que pasa por C.
          - con: marca
            traza: proy_planta(solucion.Uc)
            porque: |
              El punto 1, nombre nuestro, donde la paralela por C₁ corta J₁G₁, el borde derecho del
              faldón: un punto del faldón a la altura de C, en una arista dibujada en las dos vistas. Va sin
              rótulo, que pisaría el de C₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Uc), proy_alzado(solucion.Uc))
            porque: |
              Por 1₁, la vertical hasta J₂G₂, el mismo borde en el alzado.
          - con: marca
            traza: proy_alzado(solucion.Uc)
            porque: |
              1₂, donde la vertical de 1₁ corta J₂G₂. Va sin rótulo, que pisaría el de C₂, 3,6 mm a la
              izquierda.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_vC)
            porque: |
              Por C₁, la vertical hacia arriba, larga, hasta pasar la altura de 1₂ en el alzado.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Uc), solucion.L_hC)
            guia: figura.segmento("HJ2")
            porque: |
              Por 1₂, la horizontal hacia la izquierda, hasta pasar la vertical de C₁: es la horizontal del
              faldón por C, en el alzado.
          - con: marca
            traza: proy_alzado(C)
            porque: |
              C₂, donde la vertical de C₁ corta la horizontal de 1₂. Va sin rótulo: 1₂, a 3,6 mm, lo
              taparía.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), solucion.L_pD)
            guia: figura.segmento("cumbrera1")
            porque: |
              Por D₁, la paralela a la cumbrera, hacia arriba a la izquierda, hasta pasar F₁H₁, el borde
              izquierdo del faldón, que está a 3 mm.
          - con: marca
            traza: proy_planta(solucion.Ud)
            porque: |
              El punto 2, nombre nuestro: 2₁, donde la paralela por D₁ corta F₁H₁. Va sin rótulo, que
              pisaría el de D₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Ud), proy_alzado(solucion.Ud))
            porque: |
              Por 2₁, la vertical hasta F₂H₂, el borde izquierdo en el alzado.
          - con: marca
            traza: proy_alzado(solucion.Ud)
            porque: |
              2₂, donde la vertical de 2₁ corta F₂H₂. Va sin rótulo, que pisaría el de D₂, 2,7 mm a la
              derecha.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), solucion.L_vD)
            porque: |
              Por D₁, la vertical hacia arriba, larga, hasta pasar la altura de 2₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Ud), solucion.L_hD)
            guia: figura.segmento("HJ2")
            porque: |
              Por 2₂, la horizontal hacia la derecha, hasta pasar la vertical de D₁.
          - con: marca
            traza: proy_alzado(D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta la horizontal de 2₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_pE)
            guia: figura.segmento("cumbrera1")
            porque: |
              Por E₁, la paralela a la cumbrera, hacia abajo a la derecha, hasta pasar J₁G₁, cerca de J₁.
          - con: marca
            traza: proy_planta(solucion.Ue)
            rotulo: 3₁
            porque: |
              3₁, nombre nuestro, donde la paralela por E₁ corta J₁G₁, 3 mm antes de J₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Ue), proy_alzado(solucion.Ue))
            porque: |
              Por 3₁, la vertical hasta J₂G₂, cerca de su pie en el alero.
          - con: marca
            traza: proy_alzado(solucion.Ue)
            rotulo: 3₂
            porque: |
              3₂, donde la vertical de 3₁ corta J₂G₂, 2,6 mm por encima del alero.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_vE)
            porque: |
              Por E₁, la vertical hacia arriba: pasa por A₁ ≡ B₁, porque A₁E₁ es vertical en el papel, y
              sigue hasta pasar la altura de 3₂ en el alzado.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Ue), solucion.L_hE)
            guia: figura.segmento("HJ2")
            porque: |
              Por 3₂, la horizontal hacia la izquierda, hasta pasar la vertical de E₁.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta la horizontal de 3₂, debajo de B₂.
          - con: regla
            traza: '[segmento2(figura.punto("A2"), proy_alzado(C)), segmento2(figura.punto("A2"), proy_alzado(D)), segmento2(figura.punto("A2"), proy_alzado(E))]'
            porque: |
              Las barras en el alzado: de A₂ a C₂, D₂ y E₂. A₂E₂ va sobre el mástil y lo prolonga, porque AE
              está en el plano de perfil del mástil.
        pista: |
          (1) Por la planta del anclaje, la paralela a la cumbrera hasta el borde del faldón: 1₁, 2₁ o 3₁.
          (2) Su vertical, al mismo borde en el alzado. (3) La horizontal por ahí corta la vertical del
          anclaje en su alzado.
        desarrollo: |
          En verde claro, las tres horizontales del faldón y las barras en el alzado. Por encima del
          alero, C está a 28,1 mm, D a 23,6 mm y E a 2,6 mm; la cumbrera, a 34,8 mm. A₂E₂ cae sobre la
          vertical del mástil: AE es una recta de perfil, como el propio mástil.

      - tipo: construir
        titulo: La cumbrera de punta, los faldones de canto y la barra AD girada
        intro: |
          La cumbrera es horizontal, así que un solo cambio de plano la pone de punta: la línea nueva, de
          trazo y punto, ya está dibujada abajo a la derecha, perpendicular a la cumbrera en la planta. El
          cambio es vertical, sale de la planta y lleva cotas; la referencia es H, la esquina del alero,
          así que los aleros caen en la línea. Cada punto sale por la paralela a la cumbrera y se aparta de
          la línea lo que está más alto que el alero. F₄ ≡ G₄ es la cumbrera de punta, y F₄H₄ y F₄L₄, los
          faldones de canto: su ángulo es el del apartado b). Para el d), A₄ y D₄; por A₄, la
          perpendicular al canto delantero, t, con su pie T₄; y D girado alrededor de t hasta que AD queda
          paralela a la vista: D′₄, en el canto, a la distancia real de T a D, que es la hipotenusa de
          T₄D₄ y de lo que D está más lejos de la línea que A (A₁Y en la planta). Vale hacia
          cualquiera de los dos lados de T₄; aquí, hacia D₄. El ángulo en D′₄, entre
          el canto y D′₄A₄, es el de AD con el faldón. El giro es nuestro: pone en verdadera
          magnitud el triángulo ATD, rectángulo en T, que es el PTR del tema. Marca F₄, A₄, D₄ y D′₄. Aviso para el imán: T₄ cae a
          2 mm de F₄; amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: F4
            rotulo: F₄ ≡ G₄
            pide: la cumbrera, de punta en la vista nueva
            es: solucion.F_4
            bien: |
              F₄ ≡ G₄ está en la cumbrera prolongada, 34,8 mm más allá de la línea nueva: lo que la cumbrera
              está más alta que el alero, que es la referencia.
            diagnosticos:
              - si: cerca_de(solucion.F4mal)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. La vista nueva queda al otro lado
                  de la línea, y la cumbrera, más alta que el alero, se aparta de ella hacia fuera.
                ejemplo: solucion.F4mal
              - si: '!en_recta(figura.segmento("cumbrera1"))'
                mensaje: |
                  F₄ sale de F₁ y G₁ por la perpendicular a la línea nueva, y esa perpendicular es la propia
                  cumbrera, prolongada: la cumbrera se ve de punta en ella.
                ejemplo: 'desplaza(solucion.F_4, dx: mm(4), dy: mm(-4))'
              - si: siempre
                mensaje: |
                  Estás en la cumbrera prolongada, pero no a la distancia buena: 34,8 mm desde la línea
                  nueva, lo que F₂ está por encima del alero en el alzado.
          - nombre: A4
            pide: el extremo A del mástil en la vista nueva
            es: solucion.A_4
            bien: |
              A₄ está en la paralela a la cumbrera por A₁, 65,5 mm más allá de la línea nueva: lo que A
              está más alto que el alero.
            diagnosticos:
              - si: cerca_de(solucion.A4mal)
                mensaje: |
                  Has llevado la altura del mástil, AB, que se cuenta desde B. La referencia es el alero: A₄
                  se aparta de la línea lo que A₂ está por encima del alero, 65,5 mm.
                ejemplo: uno(solucion.A4mal, 1)
              - si: '!en_recta(solucion.projA)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**, que es la paralela a la cumbrera.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a la cumbrera por A₁, pero no a la distancia buena: de A₂ al alero, en
                  el alzado, 65,5 mm, llevados desde la línea hacia fuera.
          - nombre: D4
            pide: el anclaje D en la vista nueva
            es: solucion.D_4
            bien: |
              D₄ está en el canto del faldón delantero, donde lo corta la paralela a la cumbrera por D₁: D
              está en ese faldón, y el faldón se ve como esa recta.
            diagnosticos:
              - si: '!en_recta(solucion.projD)'
                mensaje: |
                  D₄ sale de D₁ por la paralela a la cumbrera, la perpendicular a la línea nueva.
                ejemplo: 'uno(medir_sobre(solucion.canto, desde: solucion.D_4, distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  D está en el faldón delantero, y en esta vista el faldón es la recta F₄H₄: D₄ cae en ella,
                  sin llevar ninguna distancia.
                ejemplo: 'uno(medir_sobre(solucion.projD, desde: solucion.D_4, distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  D₄ está donde la paralela a la cumbrera por D₁ corta F₄H₄.
          - nombre: Dp
            rotulo: D′₄
            pide: el anclaje D girado alrededor de la perpendicular t, en la vista nueva
            es: solucion.Dg4s
            bien: |
              D′₄ está en el canto, a 35,4 mm de T₄: la distancia real de T a D, hipotenusa de T₄D₄ y de lo
              que D está más lejos de la línea nueva que A. Girado así, AD se ve de verdad, y el ángulo en
              D′₄ es el de AD con el faldón.
            diagnosticos:
              - si: cerca_de(solucion.Dprof)
                mensaje: |
                  Has llevado desde T₄ solo lo que D está más lejos de la línea que A, A₁Y: es un cateto. La
                  distancia real de T a D es la hipotenusa T₄Z, con el otro cateto, T₄D₄.
                ejemplo: uno(solucion.Dprof, 1)
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  D gira alrededor de t, que es perpendicular al faldón: se queda en el faldón, y en esta
                  vista el faldón es la recta F₄H₄. D′₄ está en ella.
                ejemplo: 'desplaza(solucion.Dg_4, dx: mm(3), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en el canto, pero no a la distancia buena: con centro en T₄ y radio T₄Z, la
                  hipotenusa del triángulo T₄D₄Z.
        trazado:
          - segmento2(solucion.H_4, solucion.L_canto)
          - segmento2(solucion.L_4, solucion.F_4)
          - segmento2(figura.punto("G1"), solucion.F_4)
          - segmento2(solucion.A_4, solucion.T_4)
          - segmento2(solucion.T_4, solucion.Z)
          - segmento2(solucion.A_4, solucion.Dg_4)
        construccion:
          - con: regla
            traza: segmento2(figura.punto("G1"), solucion.L_F4)
            porque: |
              En la planta, la cumbrera F₁G₁ prolongada con la regla más allá de G₁, larga, hasta pasar la
              línea nueva bien: es perpendicular a ella, y por ella sale F₄ ≡ G₄.
          - con: regla
            traza: segmento2(figura.punto("J1"), solucion.L_H4)
            porque: |
              El alero delantero H₁J₁ prolongado más allá de J₁ hasta pasar la línea nueva: también es
              paralelo a la cumbrera.
          - con: regla
            traza: segmento2(figura.punto("K1"), solucion.L_L4)
            porque: |
              El alero trasero L₁K₁ prolongado más allá de K₁ hasta pasar la línea nueva.
          - con: marca
            traza: solucion.H_4
            rotulo: H₄ ≡ J₄
            porque: |
              H₄, donde el alero delantero prolongado corta la línea nueva: H es la referencia, y el alero
              entero, que está a su altura, se ve como este punto.
          - con: marca
            traza: solucion.L_4
            rotulo: L₄ ≡ K₄
            porque: |
              L₄, donde el alero trasero prolongado corta la línea nueva: está a la altura de la
              referencia.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F2"), solucion.L_F2b)
            porque: |
              En el alzado, por F₂, la vertical hasta pasar el alero: el trozo entre F₂ y el alero es lo que
              la cumbrera está más alta que él, 34,8 mm.
          - con: compas
            traza: 'arco(solucion.pieF, por: solucion.F_4, desde: desplaza(solucion.F_4, dx: 2.8, dy: -5.3), hasta: desplaza(solucion.F_4, dx: -2.8, dy: 5.3))'
            toma: segmento2(figura.punto("F2"), solucion.F2b)
            porque: |
              Con el compás, esa altura; con centro donde la cumbrera prolongada corta la línea nueva, un
              arco hacia fuera, lejos de la planta: la cumbrera es más alta que la referencia.
          - con: marca
            traza: solucion.F_4
            porque: |
              F₄ ≡ G₄, donde el arco corta la cumbrera prolongada: la cumbrera, de punta. Va sin rótulo: T₄,
              que se marca después a 2 mm, lo taparía.
          - con: regla
            traza: '[segmento2(solucion.H_4, solucion.L_canto), segmento2(solucion.L_4, solucion.F_4)]'
            porque: |
              F₄H₄ y F₄L₄, los faldones de canto. El delantero se prolonga 5 mm más allá de F₄, porque ahí
              cae el pie de la perpendicular desde A.
          - con: transportador
            traza: 'arco(solucion.F_4, por: solucion.T_F4, desde: solucion.H_4, hasta: solucion.L_4)'
            porque: |
              El transportador con el centro en F₄, de F₄H₄ a F₄L₄: el ángulo entre los dos faldones, por
              debajo del tejado.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), solucion.L_A4), segmento2(figura.punto("A1"), solucion.L_Yb)]'
            guia: figura.segmento("cumbrera1")
            porque: |
              Por A₁, la paralela a la cumbrera, larga hacia los dos lados: hacia la línea nueva y más allá,
              porque por ella sale A₄; y hacia atrás, hasta pasar la perpendicular a la cumbrera por
              D₁, porque en ella se mide lo
              que D está más lejos de la línea que A.
          - con: regla
            traza: segmento2(figura.punto("B2"), solucion.L_A2b)
            porque: |
              En el alzado, el mástil prolongado más allá de B₂ hasta pasar el alero: el trozo de A₂ al
              alero es lo que A está más alto que él, 65,5 mm.
          - con: compas
            traza: 'arco(solucion.pieA, por: solucion.A_4, desde: desplaza(solucion.A_4, dx: 2.8, dy: -5.3), hasta: desplaza(solucion.A_4, dx: -2.8, dy: 5.3))'
            toma: segmento2(figura.punto("A2"), solucion.A2b)
            porque: |
              Con el compás, esa altura; con centro donde la paralela por A₁ corta la línea nueva, un arco
              hacia fuera.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la paralela a la cumbrera por A₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), solucion.L_D4)
            guia: figura.segmento("cumbrera1")
            porque: |
              Por D₁, la paralela a la cumbrera, hasta pasar el canto del faldón delantero: D está en el
              faldón, y su vista nueva cae en el canto, sin llevar distancias.
          - con: marca
            traza: solucion.D_4
            rotulo: D₄
            porque: |
              D₄, donde la paralela por D₁ corta el canto F₄H₄.
          - con: escuadra-cartabon
            traza: segmento2(solucion.A_4, solucion.L_T4)
            guia: solucion.canto
            porque: |
              Por A₄, la perpendicular al canto delantero, hasta pasar su prolongación más allá de F₄: es t,
              la perpendicular al faldón desde A, que en esta vista se ve de verdad.
          - con: marca
            traza: solucion.T_4
            rotulo: T₄
            porque: |
              T₄, nombre nuestro, donde t corta la prolongación del canto, 2 mm más allá de F₄: el pie de la
              perpendicular desde A al plano del faldón. A₄T₄, 37,8 mm, es lo que A dista del faldón.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), solucion.L_Y)
            guia: figura.segmento("nueva")
            porque: |
              En la planta, por D₁, la paralela a la línea nueva, hasta pasar la paralela a la cumbrera por
              A₁, a 8 mm.
          - con: marca
            traza: solucion.Y
            rotulo: Y
            porque: |
              Y, nombre nuestro, donde la paralela a la línea nueva por D₁ corta la paralela a la cumbrera
              por A₁. A₁Y, 29,3 mm, es lo que D está más lejos de la línea nueva que A.
          - con: escuadra-cartabon
            traza: segmento2(solucion.D_4, solucion.L_Z)
            guia: solucion.canto
            porque: |
              En la vista nueva, por D₄, la perpendicular al canto, hacia el lado de A₄: paralela a t.
          - con: compas
            traza: 'arco(solucion.D_4, por: solucion.Z, desde: desplaza(solucion.Z, dx: -5.5, dy: 2.4), hasta: desplaza(solucion.Z, dx: 5.5, dy: -2.4))'
            toma: segmento2(figura.punto("A1"), solucion.Y)
            porque: |
              Con el compás, A₁Y; con centro en D₄, un arco que corta esa perpendicular.
          - con: marca
            traza: solucion.Z
            rotulo: Z
            porque: |
              Z, nombre nuestro, donde el arco corta la perpendicular al canto por D₄. El triángulo T₄D₄Z es
              rectángulo en D₄.
          - con: regla
            traza: segmento2(solucion.T_4, solucion.Z)
            porque: |
              T₄Z, la hipotenusa: la distancia real de T a D, 35,4 mm. Es el radio con que D gira alrededor
              de t.
          - con: compas
            traza: 'arco(solucion.T_4, por: solucion.Z, desde: solucion.Z, hasta: desplaza(solucion.Dg_4, dx: -2.4, dy: -5.5))'
            porque: |
              Con centro en T₄ y radio T₄Z, el arco desde Z hasta pasar el canto delantero: D gira alrededor
              de t, sin salir del faldón, hasta que TD queda paralela a la vista nueva.
          - con: marca
            traza: solucion.Dg_4
            rotulo: D′₄
            porque: |
              D′₄, nombre nuestro, donde el arco corta el canto F₄H₄: D girado. AD′ es AD en
              verdadera magnitud, y el faldón sigue de canto. La circunferencia cortaría el canto
              también al otro lado de T₄, más allá de F₄, y ese D′ también valdría: el ángulo es el
              mismo.
          - con: regla
            traza: segmento2(solucion.A_4, solucion.Dg_4)
            porque: |
              A₄D′₄: la barra AD girada, en verdadera magnitud, 51,8 mm.
          - con: transportador
            traza: 'arco(solucion.Dg_4, por: solucion.T_Dg, desde: solucion.T_4, hasta: solucion.A_4)'
            porque: |
              El transportador con el centro en D′₄, del canto a D′₄A₄: el ángulo de la barra AD con el
              faldón delantero.
        pista: |
          (1) La cumbrera y los aleros prolongados hasta la línea nueva: H₄ y L₄ en ella; F₄ ≡ G₄, a lo que
          la cumbrera sube sobre el alero. (2) El ángulo en F₄. (3) A₄ a lo que A sube sobre el alero; D₄ en
          el canto delantero. (4) Por A₄, la perpendicular al canto: T₄. (5) A₁Y en la planta; en D₄, sobre
          la perpendicular al canto: Z. (6) Con centro en T₄ y radio T₄Z, al canto: D′₄. (7) El ángulo en
          D′₄.
        desarrollo: |
          En verde claro, la vista con la cumbrera de punta: el faldón delantero sube 38,9° y el trasero
          58,2°, y entre los dos, por debajo del tejado, 82,9°. A₄T₄ = 37,8 mm es lo que A dista del faldón;
          T₄D₄ = 20,0 mm y A₁Y = 29,3 mm dan TD = 35,4 mm, y AD′ = 51,8 mm, la longitud de la barra.

      - tipo: calcular
        titulo: El ángulo entre los dos faldones
        pregunta: ¿Cuántos grados forman los dos faldones del tejado?
        respuesta:
          tipo: numero
          valor: '82.92'
          receta: angFaldones
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '97.08'
            receta: 180 - angFaldones
            mensaje: |
              Ese es el **suplementario**: el de un faldón con la prolongación del otro más allá de la
              cumbrera. Los faldones forman, por debajo del tejado, el ángulo en F₄ entre F₄H₄ y F₄L₄, y es
              agudo; es también el menor de los dos que forman sus planos.
          - valor: '38.86'
            receta: pendDelantero
            mensaje: |
              Esa es la **pendiente del faldón delantero**, su ángulo con el plano horizontal: el de F₄H₄
              con la línea nueva. El de los dos faldones está entre ellos, en F₄.
          - valor: '46.23'
            receta: angHastial
            mensaje: |
              Es lo que forman F₂H₂ y F₂L₂ **en el alzado**, en el hastial de la izquierda. La cumbrera no
              es de punta en el alzado, y los faldones no se ven de canto: hace falta la vista con la
              cumbrera de punta.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en F₄, entre F₄H₄ y F₄L₄.
        desarrollo: |
          Con la cumbrera de punta, cada faldón se ve con su pendiente: el delantero baja 34,8 mm en
          43,2 mm y el trasero, lo mismo en 21,6 mm:

          $$ 180^{\circ} - \arctan\frac{34{,}84}{43{,}23} - \arctan\frac{34{,}84}{21{,}59} \approx 180^{\circ} - 38{,}86^{\circ} - 58{,}22^{\circ} = 82{,}92^{\circ} $$

          Es agudo, así que el ángulo de los faldones por debajo del tejado y el de sus planos coinciden.

      - tipo: construir
        titulo: El ángulo de las barras AC y AE, abatiendo su plano
        intro: |
          AC es frontal: A₁C₁ es horizontal en el papel. Sirve de charnela para abatir el plano ACE sobre
          el plano frontal de AC, y el alzado lo da en verdadera magnitud. Primero, C₂ y E₂, como en el
          paso de los anclajes. Abate E: la perpendicular a A₂C₂ por E₂ corta la charnela, prolongada más
          allá de C₂, en M. El radio es la hipotenusa del triángulo de catetos ME₂ y lo que E está por
          delante de AC, A₁E₁ en la planta: arma en E₂, sobre la paralela a la charnela, esa distancia, N,
          y MN es el radio. Con centro en M, E⁰ en la perpendicular. Vale abatir hacia los dos lados; aquí,
          arriba a la derecha, lejos del tejado. El ángulo C₂A₂E⁰ es el de las barras. Marca C₂, E₂, M y E⁰.
          Aviso para el imán: M cae a 1,7 mm de C₂, y 1₂ a 3,6 mm; amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: C2
            pide: el anclaje C, en el alzado
            es: proy_alzado(C)
            bien: |
              C₂ está en la vertical de C₁, a la altura de 1₂, como en el paso de los anclajes.
            diagnosticos:
              - si: cerca_de(solucion.Cborde)
                mensaje: |
                  Ese punto está en la arista J₂G₂, el borde del faldón, no en C: la altura de C sale de la
                  horizontal del faldón por C, que corta el borde en 1.
                ejemplo: solucion.Cborde
              - si: '!en_recta(solucion.vC1)'
                mensaje: |
                  C₂ va en la **vertical de C₁**.
                ejemplo: 'desplaza(proy_alzado(C), dx: mm(5))'
              - si: siempre
                mensaje: |
                  C₂ está donde la vertical de C₁ corta la horizontal de 1₂.
          - nombre: E2
            pide: el anclaje E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la vertical de E₁, a la altura de 3₂, como en el paso de los anclajes.
            diagnosticos:
              - si: cerca_de(solucion.Ealero)
                mensaje: |
                  Ese punto está en el alero, y E está 2,6 mm más arriba: la horizontal por E corta el borde
                  J G en 3, y 3₂ da la altura.
                ejemplo: solucion.Ealero
              - si: '!en_recta(solucion.vE1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**, la del mástil.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(5))'
              - si: siempre
                mensaje: |
                  E₂ está donde la vertical de E₁ corta la horizontal de 3₂.
          - nombre: M
            pide: el pie de E en la charnela AC, en el alzado
            es: proy_alzado(solucion.Me)
            bien: |
              M está en A₂C₂ prolongada, 1,7 mm más allá de C₂, al pie de la perpendicular por E₂: AC es
              frontal, y la perpendicular a ella se ve perpendicular en el alzado.
            diagnosticos:
              - si: '!en_recta(solucion.lAC2)'
                mensaje: |
                  M está **en la charnela**, la recta A₂C₂ prolongada más allá de C₂: es el centro del giro de
                  E.
                ejemplo: 'uno(medir_sobre(solucion.perpE2, desde: proy_alzado(solucion.Me), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.perpE2)'
                mensaje: |
                  M es el pie de la **perpendicular a A₂C₂ por E₂**: E gira en un plano perpendicular a la
                  charnela.
                ejemplo: 'uno(medir_sobre(solucion.lAC2, desde: proy_alzado(solucion.Me), distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  M está donde la perpendicular a A₂C₂ por E₂ corta la charnela prolongada.
          - nombre: E0
            rotulo: E⁰
            pide: el anclaje E abatido sobre el plano frontal de AC
            es: proy_alzado(solucion.Eab)
            bien: |
              E⁰ está en la perpendicular a la charnela por E₂, a 43,9 mm de M: la distancia real de E a AC.
              El ángulo C₂A₂E⁰ es el de las barras AC y AE.
            diagnosticos:
              - si: cerca_de(solucion.E0alzado)
                mensaje: |
                  Has llevado al otro lado de M lo que E₂ dista de la charnela **en el alzado**, 39,0 mm: es un
                  cateto. E está 20,2 mm por delante del plano frontal de AC, y la distancia real es la
                  hipotenusa MN.
                ejemplo: solucion.E0alzado
              - si: cerca_de(solucion.E0alej)
                mensaje: |
                  Has abatido E solo con lo que está por delante de AC, 20,2 mm, A₁E₁ en la planta: es el otro
                  cateto. El radio es la hipotenusa MN.
                ejemplo: uno(solucion.E0alej, 2)
              - si: '!en_recta(solucion.perpE2)'
                mensaje: |
                  E gira en un plano perpendicular a la charnela: E⁰ está en la **perpendicular a A₂C₂ por
                  E₂**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.Eab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por E₂, pero no a la distancia buena: con centro en M y radio MN,
                  el arco que sale de N la corta en E⁰.
        trazado:
          - segmento2(figura.punto("A2"), solucion.L_AC)
          - segmento2(proy_alzado(E), proy_alzado(solucion.Eab))
          - segmento2(figura.punto("A2"), proy_alzado(solucion.Eab))
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_pC)
            guia: figura.segmento("cumbrera1")
            porque: |
              C₂, como en el paso de los anclajes. Por C₁, la paralela a la cumbrera hasta pasar J₁G₁.
          - con: marca
            traza: proy_planta(solucion.Uc)
            porque: |
              El punto 1, nombre nuestro: 1₁, donde la paralela por C₁ corta J₁G₁. Sin rótulo, que pisaría
              el de C₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Uc), proy_alzado(solucion.Uc))
            porque: |
              Por 1₁, la vertical hasta J₂G₂.
          - con: marca
            traza: proy_alzado(solucion.Uc)
            porque: |
              1₂, donde la vertical de 1₁ corta J₂G₂. Sin rótulo, que pisaría el de C₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_vC)
            porque: |
              Por C₁, la vertical hacia arriba, hasta pasar la altura de 1₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Uc), solucion.L_hC)
            guia: figura.segmento("HJ2")
            porque: |
              Por 1₂, la horizontal hasta pasar la vertical de C₁.
          - con: marca
            traza: proy_alzado(C)
            porque: |
              C₂, donde la vertical de C₁ corta la horizontal de 1₂. Va sin rótulo: 1₂, a 3,6 mm, lo
              taparía.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_pE)
            guia: figura.segmento("cumbrera1")
            porque: |
              E₂, igual. Por E₁, la paralela a la cumbrera hasta pasar J₁G₁, cerca de J₁.
          - con: marca
            traza: proy_planta(solucion.Ue)
            rotulo: 3₁
            porque: |
              3₁, nombre nuestro, donde la paralela por E₁ corta J₁G₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Ue), proy_alzado(solucion.Ue))
            porque: |
              Por 3₁, la vertical hasta J₂G₂.
          - con: marca
            traza: proy_alzado(solucion.Ue)
            rotulo: 3₂
            porque: |
              3₂, donde la vertical de 3₁ corta J₂G₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_vE)
            porque: |
              Por E₁, la vertical hacia arriba, por A₁ ≡ B₁, hasta pasar la altura de 3₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Ue), solucion.L_hE)
            guia: figura.segmento("HJ2")
            porque: |
              Por 3₂, la horizontal hasta pasar la vertical de E₁.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta la horizontal de 3₂.
          - con: regla
            traza: segmento2(figura.punto("A2"), solucion.L_AC)
            rotulo: charnela
            porque: |
              A₂C₂ con la regla, prolongada más allá de C₂: la charnela. AC es frontal, y el alzado la da en
              verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(E), solucion.L_E0)
            guia: solucion.lAC2
            porque: |
              Por E₂, la perpendicular a la charnela, larga, hasta pasarla y seguir arriba a la derecha: E
              gira alrededor de AC en un plano perpendicular a ella, y en el alzado se mueve por esta recta.
          - con: marca
            traza: proy_alzado(solucion.Me)
            porque: |
              M, nombre nuestro, donde la perpendicular por E₂ corta la charnela prolongada, 1,7 mm más allá
              de C₂: el pie de E, centro de su giro. Va sin rótulo, que pisaría el de C₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(E), solucion.L_Kc)
            guia: solucion.lAC2
            porque: |
              Por E₂, la paralela a la charnela, hacia abajo a la derecha: en ella se arma el triángulo del
              radio, rectángulo en E₂.
          - con: compas
            traza: 'arco(proy_alzado(E), por: solucion.Kc, desde: desplaza(solucion.Kc, dx: -4.7, dy: 3.7), hasta: desplaza(solucion.Kc, dx: 4.7, dy: -3.7))'
            toma: segmento2(figura.punto("A1"), figura.punto("E1"))
            porque: |
              Con el compás, en la planta, A₁E₁: lo que E está por delante del plano frontal de AC, 20,2 mm.
              Con centro en E₂, sobre la paralela.
          - con: marca
            traza: solucion.Kc
            rotulo: N
            porque: |
              N, nombre nuestro, donde el arco corta la paralela a la charnela por E₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.Me), solucion.Kc)
            porque: |
              MN, la hipotenusa del triángulo rectángulo M E₂ N: la distancia real de E a AC, 43,9 mm, el
              radio con que E se abate.
          - con: compas
            traza: 'arco(proy_alzado(solucion.Me), por: solucion.Kc, desde: solucion.Kc, hasta: desplaza(proy_alzado(rama(solucion.Eab, 1)), dx: -4.7, dy: -5.9))'
            porque: |
              Con centro en M y radio MN, el arco desde N, por la derecha, hasta pasar la perpendicular
              arriba a la derecha: E gira alrededor de AC y cae al plano frontal de AC. La circunferencia la
              corta también abajo, junto a E₂, y ese E⁰ también valdría.
          - con: marca
            traza: proy_alzado(rama(solucion.Eab, 1))
            rotulo: E⁰
            porque: |
              E⁰, donde el arco corta la perpendicular por E₂, arriba a la derecha: E abatido, a 43,9 mm de
              M.
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(rama(solucion.Eab, 1)))
            porque: |
              A₂E⁰: la barra AE abatida. A está en la charnela y no se mueve.
          - con: transportador
            traza: 'arco(figura.punto("A2"), por: solucion.T_A2, desde: proy_alzado(C), hasta: proy_alzado(rama(solucion.Eab, 1)))'
            porque: |
              El transportador con el centro en A₂, de A₂C₂ a A₂E⁰: el ángulo de las barras AC y AE.
        pista: |
          (1) C₂ y E₂, por las horizontales del faldón. (2) La charnela A₂C₂, prolongada, y por E₂ su
          perpendicular: M. (3) Por E₂, la paralela a la charnela, y sobre ella A₁E₁: N. (4) Con centro en M
          y radio MN, a la perpendicular: E⁰. (5) El ángulo en A₂, entre A₂C₂ y A₂E⁰.
        desarrollo: |
          En verde claro, la charnela, el camino de E y la barra abatida. AC mide 47,7 mm, de verdad en el
          alzado; ME₂ = 39,0 mm y A₁E₁ = 20,2 mm dan el radio, 43,9 mm, y A₂E⁰ es AE de verdad, 66,1 mm.

      - tipo: calcular
        titulo: El ángulo entre las barras AC y AE
        pregunta: ¿Cuántos grados forman las barras AC y AE?
        respuesta:
          tipo: numero
          valor: '41.66'
          receta: angCAE
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '90.00'
            receta: angPlantaCAE
            mensaje: |
              Es lo que forman A₁C₁ y A₁E₁ **en la planta**: un ángulo recto en el papel. El plano ACE no es
              horizontal —A está muy por encima de C y de E—, y la planta deforma su ángulo.
          - valor: '38.31'
            receta: angAlzadoCAE
            mensaje: |
              Es lo que forman A₂C₂ y A₂E₂ **en el alzado**. AC es frontal y se ve entera, pero AE no: E está
              20,2 mm por delante. Hay que abatir E sobre el plano frontal de AC.
          - valor: '138.34'
            receta: 180 - angCAE
            mensaje: |
              Ese es el **suplementario**: el que forma A₂E⁰ con la prolongación de C₂A₂ más allá de A₂. Las
              barras salen de A hacia C y hacia E, y su ángulo es el de A₂, entre A₂C₂ y A₂E⁰.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en A₂, entre A₂C₂ y A₂E⁰.
        desarrollo: |
          En el triángulo ACE, con AC = 47,67 mm, AE = 66,08 mm y CE = 43,95 mm, por el teorema del
          coseno:

          $$ \cos\widehat{A} = \frac{47{,}67^{2} + 66{,}08^{2} - 43{,}95^{2}}{2 \cdot 47{,}67 \cdot 66{,}08} \approx 0{,}7471, \qquad \widehat{A} \approx 41{,}66^{\circ} $$

      - tipo: calcular
        titulo: El ángulo de la barra AD con el faldón
        pregunta: ¿Cuántos grados forma la barra AD con el faldón en el que se ancla?
        respuesta:
          tipo: numero
          valor: '46.84'
          receta: angAD
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '43.16'
            receta: 90 - angAD
            mensaje: |
              Ese es el **complementario**: el ángulo de AD con la perpendicular t al faldón, el de A₄ en el
              triángulo A₄T₄D′₄. El del faldón está en D′₄, donde la barra lo toca.
          - valor: '62.11'
            receta: angVista4
            mensaje: |
              Es lo que forma A₄D₄ con el canto **sin girar D**. El faldón se ve de canto, pero AD no está
              en verdadera magnitud en esta vista, y el ángulo sale deformado: hay que girar D alrededor de t
              hasta D′₄.
          - valor: '54.12'
            receta: angADph
            mensaje: |
              Ese es el ángulo de AD con el **plano horizontal**. El faldón está inclinado 38,9°, y el
              ángulo que se pide es con él.
          - valor: '17.05'
            receta: angADtrasero
            mensaje: |
              Es el ángulo de AD con el **faldón trasero**. D está en el delantero —D₁ cae por delante de la
              cumbrera— y leemos que se pide con ese faldón, el del enunciado: AD no toca el
              trasero.
        pista: |
          Con el transportador en el paso de la vista nueva, o en tu lámina: en D′₄, entre el canto F₄H₄ y
          D′₄A₄.
        desarrollo: |
          En el triángulo A T D, rectángulo en T, el cateto opuesto al ángulo es AT, lo que A dista del
          faldón, y la hipotenusa, AD:

          $$ \operatorname{sen}\delta = \frac{AT}{AD} = \frac{37{,}79}{51{,}81} \approx 0{,}7294, \qquad \delta \approx 46{,}84^{\circ} $$

          Una casualidad de esta lámina: en la planta, A₁D₁ forma 46,6° con A₁E₁, que es vertical en el
          papel, y con cualquier vertical (la de D₁, por ejemplo), dentro de la tolerancia. No es el ángulo
          de la barra con el faldón, que está en D′₄, y la casilla no lo distingue.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: C₁, D₁ y E₁ caen por delante de la cumbrera, así que los tres anclajes están en el faldón delantero; el alzado de cada uno sale de una horizontal de ese faldón.
          - texto: La cumbrera es horizontal; con la línea nueva perpendicular a ella en la planta, un cambio de plano la pone de punta, y los faldones se ven de canto y forman 82,9°.
          - texto: AC es frontal, y sirve de charnela para abatir el plano ACE sobre su plano frontal; en A₂, entre A₂C₂ y A₂E⁰, el ángulo de las barras, 41,7°.
          - texto: En la vista con los faldones de canto, la perpendicular t al faldón desde A se ve de verdad; girando D alrededor de t hasta el canto, AD se ve entera y forma 46,8° con el faldón.
          - texto: El ángulo de AD con el faldón se mide en la vista nueva, entre A₄D₄ y el canto, porque ahí el faldón está de canto.
            trampa: true
            mensaje: |
              El faldón está de canto, pero AD no está en verdadera magnitud: no es paralela a esa vista. Así
              sale 62,1°, y el ángulo es 46,8°. Hace falta que se vean de verdad las dos cosas a la vez, y
              para eso se gira D alrededor de t.
    resolucion: |
      **Qué fija la figura.** El tejado es a dos aguas: los aleros a la misma altura, la cumbrera
      horizontal y paralela a ellos, más cerca del alero trasero; el faldón delantero es ancho y sube
      38,9°, y el trasero, estrecho, 58,2°. El mástil es vertical, y las barras solo están dadas en la
      planta.

      **a) Los anclajes.** C₁, D₁ y E₁ caen por delante de la cumbrera: los tres están en el faldón
      delantero. La horizontal del faldón por cada uno, paralela a la cumbrera, corta el borde del faldón
      en 1, 2 o 3, que se suben a ese borde en el alzado; la horizontal por ahí corta la vertical del
      anclaje. C queda a 28,1 mm sobre el alero, D a 23,6 mm y E a 2,6 mm. Las barras en el alzado van de
      A₂ a C₂, D₂ y E₂; A₂E₂ cae sobre la vertical del mástil, porque AE es de perfil.

      **b) Los faldones.** Una vista nueva con la línea perpendicular a la cumbrera y el alero de
      referencia pone la cumbrera de punta, a 34,8 mm de la línea, y los faldones de canto: forman
      82,9° por debajo del tejado. Es agudo, y es también el ángulo de sus planos.

      **c) Las barras AC y AE.** AC es frontal y sirve de charnela. E₂ dista de ella 39,0 mm en el
      alzado y E está 20,2 mm por delante: el radio es 43,9 mm. E⁰ cae en la perpendicular por E₂, y en
      A₂ el ángulo entre A₂C₂ y A₂E⁰ es 41,7°.

      **d) La barra AD con el faldón.** Con el faldón de canto, la perpendicular t desde A se ve de
      verdad: A dista 37,8 mm del faldón, y su pie T cae 2,0 mm más allá de la cumbrera, en el plano
      del faldón prolongado. D gira alrededor de t hasta el canto, a TD = 35,4 mm de T₄, y entonces AD se ve
      entera, 51,8 mm: en D′₄ forma 46,8° con el faldón. sen δ = 37,79/51,81 lo confirma. Con el faldón
      trasero, que AD no toca, saldrían 17,0°.
