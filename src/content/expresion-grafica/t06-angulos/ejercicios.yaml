ejercicios:
  # Decisión: los ejercicios del tema 6 van en el orden de la colección (§04).
  # A 8 de octubre de 2026 están escritos todos los suyos: el 15 (SD18), del 43
  # al 47 (SD59 a SD63) y el 50 (SD66).
  - id: sd18-la-placa-triangular-soldada-a-60
    titulo: La placa triangular soldada a 60° sobre la pieza angular
    fuente: Ejercicio 15 (SD18) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 16),
    # con sus dos erratas («ìeza», «traingular») y su «60º» de «o» volada; las
    # erratas se señalan en la nota en cursiva. La perspectiva no se reproduce:
    # lo que dice de la placa (qué lado apoya, hacia dónde se levanta) se
    # declara en las Notas nuestras como lectura nuestra.
    enunciado: |
      En una ìeza angular ABCDEF se necesita soldar una placa traingular equilátera PQR de 70 mm de
      lado, formando 60º con el ala horizontal, tal como se indica en la perspectiva. Representar
      dicha placa situando P a 30 mm a la derecha de D.

      *«ìeza» y «traingular» son erratas del original, por «pieza» y «triangular»; se dejan como
      están impresas.*

      **Notas nuestras.** La figura es la pieza en el alzado, arriba, y en la planta, debajo, a escala
      1:1. El ala vertical ABCD es frontal: en el alzado se ve entera, un rectángulo de 120 × 60 mm, y
      en la planta, de canto, como la recta A₁B₁ ≡ D₁C₁. El ala horizontal DCFE se ve entera en la
      planta, de 120 × 55 mm, y de canto en el alzado, como D₂C₂ ≡ E₂F₂. Las dos se juntan en la
      arista DC. La perspectiva de la hoja, que aquí no se reproduce, pone P sobre la arista DC, el lado
      PQ apoyado en el ala horizontal, a la derecha de P, y R levantado y apoyado en el ala vertical; y
      marca el ángulo de 60° entre la altura del triángulo que baja de R y su planta, que es el ángulo
      de la placa con el ala horizontal. Esa lectura es nuestra, y con ella la placa queda fijada.
      Con otras dos no cabe en la pieza: si fuera el lado PR el que formase 60°, R subiría 60,6 mm,
      por encima del borde AB del ala, que mide 60, y la placa quedaría de pie, en el propio ala
      vertical, con Q en la arista; y con R a la izquierda de P quedaría 16,3 mm a la
      izquierda de D, fuera del ala. Toda la placa se ve en las dos vistas: está delante del ala
      vertical y encima de la horizontal. X, Z, M y W son nombres nuestros, los de un triángulo
      auxiliar.
    pide: Las proyecciones de la placa, sus vértices P, Q y R en el alzado y en la planta, y, como pregunta nuestra, el ángulo que forma su lado PR con el ala horizontal.
    receta:
      lamina: sd18
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        vertical: plano(A, B, D)
        horizontal: plano(D, C, E)
      solucion:
        # P, en la arista DC, 30 mm a la derecha de D (rama 1, hacia C).
        DC: recta3(D, C)
        Pd: 'punto_a_distancia(DC, desde: D, distancia: mm(30))'
        P: rama(Pd, 1)
        # Decisión: la cota de R sale de la línea de máxima pendiente de la
        # placa, que es su altura desde R (PQ es horizontal): 70·√3/2 mm,
        # inclinada 60°. Se construye en el alzado con un triángulo equilátero
        # auxiliar de 70 mm, P X Z, con la base sobre D₂C₂: P₂Z₂ va a 60° y Z₂M
        # es la altura; llevada desde P₂ sobre P₂Z₂ da W, que está a la cota de
        # R. El método no lo impone el enunciado y se declara en el intro.
        Xd: 'punto_a_distancia(DC, desde: P, distancia: mm(70))'
        X: rama(Xd, 1)
        Pdelante: 'punto3(alzado: proy_alzado(P), planta: desplaza(proy_planta(P), dy: 10))'
        ejeP: recta3(P, Pdelante)
        Z: 'gira(X, ejeP, angulo: 60, sentido: ascendente)'
        M: punto_medio(segmento3(P, X))
        Wd: 'punto_a_distancia(recta3(P, Z), desde: P, distancia: vm(Z, M))'
        W: rama(Wd, 1)
        Wx: 'punto3(alzado: desplaza(proy_alzado(W), dx: 10), planta: desplaza(proy_planta(W), dx: 10))'
        hW: recta3(W, Wx)
        Pw: pie_perpendicular(P, hW)
        # R, en el ala vertical, a la cota de W y a 70 mm de P: PR es frontal y
        # el alzado la da entera. A la derecha (rama 1); a la izquierda queda
        # fuera de la pieza.
        Rd: 'punto_a_distancia(hW, desde: Pw, distancia: raiz(mm(70) * mm(70) - vm(P, Pw) * vm(P, Pw)))'
        R: rama(Rd, 1)
        Rizq: rama(Rd, 2)
        # Q, en el ala horizontal, a 70 mm de P y de R. Como R está a la misma
        # altura sobre P y sobre Q, las plantas de RP y RQ miden lo mismo: Q₁
        # está a R₁P₁ de R₁ (Rp es el pie de R en DC, en la planta R₁). Delante
        # del ala vertical (ascendente: el plano PRRp es frontal, y su normal
        # «que sube» gana alejamiento).
        Rp: pie_perpendicular(R, DC)
        Q: 'punto_a_tres_distancias(P, mm(70), R, mm(70), Rp, vm(Rp, P), sentido: ascendente)'
        Qdetras: 'punto_a_tres_distancias(P, mm(70), R, mm(70), Rp, vm(Rp, P), sentido: descendente)'
        placa: plano(P, Q, R)
        # Los errores: P medido desde C; Q₁ con 70 mm también desde R₁; Q₁
        # girado alrededor de la vertical de P (a 70 mm de P₁, no a R₁P₁ de R₁).
        Pdesde_C: 'rama(punto_a_distancia(DC, desde: C, distancia: mm(30)), 2)'
        P1R1medio: 'punto_medio(segmento2(proy_planta(P), proy_planta(R)))'
        perpPR1: 'perpendicular(por: P1R1medio, a: figura.segmento("DC1"))'
        QR70: 'uno(medir_sobre(perpPR1, desde: P1R1medio, distancia: raiz(mm(70) * mm(70) - vm(P, Rp) * vm(P, Rp) / 4)), 1)'
        Parriba: 'punto3(alzado: desplaza(proy_alzado(P), dy: -10), planta: proy_planta(P))'
        Qg: 'gira(Q, recta3(P, Parriba), angulo: 9)'
        horW2: segmento2(proy_alzado(W), proy_alzado(R))
        # Las cifras del calcular.
        angPR: angulo_con_ph(segmento3(P, R))
        angPlaca: angulo_planos(placa, horizontal)
        # Los extremos de las rectas largas y de los arcos de la construcción.
        Rmas: 'desplaza(proy_alzado(R), dx: 9)'
        arcoX0: 'desplaza(proy_alzado(X), dy: 5)'
        arcoZ1: 'desplaza(proy_alzado(Z), dx: -9)'
      comprueba:
        - en_plano(P, horizontal)
        - en_plano(P, vertical)
        - en_plano(R, vertical)
        - en_plano(Q, horizontal)
        - en_plano(W, vertical)
    pasos:
      - tipo: reconocer
        pregunta: PQ apoya en el ala horizontal y R en la vertical. ¿Qué medidas de la placa se ven de verdad sin construir nada?
        opciones:
          - texto: 'Ninguna: la placa está inclinada'
            mensaje: |
              La placa sí, pero dos de sus lados no. PQ va en el ala horizontal, así que es horizontal, y
              la planta lo da entero; PR va en el ala vertical, que es frontal, y el alzado lo da entero.
              Con eso se construye casi todo.
          - texto: PR en el alzado y PQ en la planta
            correcta: true
            mensaje: |
              Eso es. PR está en el ala vertical, que es frontal: P₂R₂ mide los 70 mm. PQ está en el ala
              horizontal: P₁Q₁ los mide también. Lo que no se ve en ninguna vista es el lado RQ, ni la
              altura de la placa, que es la que forma los 60°.
          - texto: Los tres lados en el alzado, porque el ala vertical es frontal y la placa se apoya en ella
            mensaje: |
              Solo R se apoya en el ala vertical, y con P, el lado PR. Q está en el ala horizontal, 45,8 mm
              por delante: PQ y RQ se acercan al observador, y el alzado los acorta.
          - texto: La altura del triángulo desde R, en el alzado, porque R está en el ala vertical y la altura baja hasta PQ
            mensaje: |
              La altura va de R al punto medio de PQ, que está en el ala horizontal, 22,9 mm por delante
              de la arista: no es frontal, y el alzado la acorta. Es la línea de máxima pendiente de la
              placa, la que forma los 60°, y se ve entera en una vista con PQ de punta.

      - tipo: construir
        titulo: La placa, por su cota y sus dos lados apoyados
        intro: |
          PQ es horizontal, así que la altura del triángulo desde R, perpendicular a PQ, es la línea de
          máxima pendiente de la placa: mide 70·√3/2 mm y forma 60° con el ala horizontal. Lo que sube es
          la cota de R. La sacamos en el alzado con un triángulo equilátero auxiliar de 70 mm, P X Z, con
          la base sobre D₂C₂: P₂Z₂ va a 60° y Z₂M es la altura; llevada desde P₂ sobre P₂Z₂ da W, que está
          a la cota de R. El método es nuestro, porque el enunciado no lo impone. R₂ está a esa altura y a
          70 mm de P₂, porque PR es frontal; Q₁, a 70 mm de P₁ y a R₁P₁ de R₁. Marca P₂, P₁, R₂, R₁, Q₁ y
          Q₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P2
            pide: el vértice P en el alzado, 30 mm a la derecha de D
            es: proy_alzado(P)
            bien: |
              P₂ está en D₂C₂, a 30 mm de D₂: P está en la arista DC, que en el alzado es la recta de
              abajo del rectángulo.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Pdesde_C))
                mensaje: |
                  Has llevado los 30 mm desde C₂. El enunciado los cuenta desde D, el extremo de la
                  izquierda: P queda a 30 mm a la derecha de D₂.
                ejemplo: proy_alzado(solucion.Pdesde_C)
              - si: '!en_recta(figura.segmento("DC2"))'
                mensaje: |
                  P está en la arista DC, donde se juntan las dos alas: en el alzado, en la recta D₂C₂.
                ejemplo: 'desplaza(proy_alzado(P), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en D₂C₂, pero no a la distancia buena: con el compás, 30 mm desde D₂, hacia la
                  derecha.
          - nombre: P1
            pide: el vértice P en la planta
            es: proy_planta(P)
            bien: |
              P₁ está en D₁C₁, en la vertical de P₂: en la planta, la arista DC es la recta de arriba del
              rectángulo.
            diagnosticos:
              - si: '!en_vertical_de(P2)'
                mensaje: |
                  P₁ va en la vertical de P₂: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(P), dx: mm(6))'
              - si: '!en_recta(figura.segmento("DC1"))'
                mensaje: |
                  P está en la arista DC, que en la planta es la recta A₁B₁ ≡ D₁C₁.
                ejemplo: 'desplaza(proy_planta(P), dy: mm(6))'
              - si: siempre
                mensaje: |
                  P₁ está donde la vertical de P₂ corta D₁C₁.
          - nombre: R2
            pide: el vértice R en el alzado
            es: proy_alzado(R)
            bien: |
              R₂ está a la altura de W, 52,5 mm sobre D₂C₂, y a 70 mm de P₂: PR va en el ala vertical, que
              es frontal, y el alzado lo da entero.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Z))
                mensaje: |
                  Ese es Z, el vértice del triángulo auxiliar: está a 60,6 mm de D₂C₂, la altura entera del
                  triángulo. Ahí estaría R con la placa de pie, a 90°, o si fuera el lado PR el que formase
                  60°. La altura de la placa está inclinada 60°, y R sube menos: lo que marca W.
                ejemplo: proy_alzado(solucion.Z)
              - si: cerca_de(proy_alzado(solucion.W))
                mensaje: |
                  Ese es W, el punto auxiliar: da la cota de R, pero no es R. R está a esa misma altura y a
                  70 mm de P₂, sobre el arco de centro P₂.
                ejemplo: proy_alzado(solucion.W)
              - si: cerca_de(proy_alzado(solucion.Rizq))
                mensaje: |
                  Has tomado el corte de la izquierda. Ahí R quedaría 16,3 mm a la izquierda de D, fuera del
                  ala vertical: R está a la derecha de P, como en la perspectiva.
                ejemplo: proy_alzado(solucion.Rizq)
              - si: '!en_recta(solucion.horW2)'
                mensaje: |
                  R₂ va a la altura de W: la cota de R es lo que sube la altura de la placa, 60,6 mm
                  inclinados 60°, y eso es lo que W está por encima de D₂C₂.
                ejemplo: 'desplaza(proy_alzado(R), dy: mm(-5))'
              - si: '!a_distancia(de: proy_alzado(P), d: mm(70))'
                mensaje: |
                  Estás a la altura buena, pero no a 70 mm de P₂. PR está en el ala vertical, que es
                  frontal: P₂R₂ mide el lado entero, y R₂ está en el arco de centro P₂ y radio 70 mm.
                ejemplo: 'desplaza(proy_alzado(R), dx: mm(6))'
              - si: siempre
                mensaje: |
                  R₂ está donde la horizontal de W corta el arco de centro P₂ y radio 70 mm, a la derecha.
          - nombre: R1
            pide: el vértice R en la planta
            es: proy_planta(R)
            bien: |
              R₁ está en D₁C₁, en la vertical de R₂: R está en el ala vertical, que en la planta se ve de
              canto.
            diagnosticos:
              - si: '!en_vertical_de(R2)'
                mensaje: |
                  R₁ va en la vertical de R₂.
                ejemplo: 'desplaza(proy_planta(R), dx: mm(6))'
              - si: '!en_recta(figura.segmento("DC1"))'
                mensaje: |
                  R está en el ala vertical, y el ala vertical se ve en la planta como la recta A₁B₁ ≡ D₁C₁:
                  R₁ cae en ella, aunque R esté a 52,5 mm de altura.
                ejemplo: 'desplaza(proy_planta(R), dy: mm(6))'
              - si: siempre
                mensaje: |
                  R₁ está donde la vertical de R₂ corta D₁C₁.
          - nombre: Q1
            pide: el vértice Q en la planta
            es: proy_planta(Q)
            bien: |
              Q₁ está a 70 mm de P₁, porque PQ es horizontal, y a R₁P₁ de R₁, porque RP y RQ suben lo mismo
              con la misma longitud. Por delante de D₁C₁: Q está en el ala horizontal.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Qdetras))
                mensaje: |
                  Has tomado el corte de arriba. Ese Q queda detrás del ala vertical, donde no hay ala
                  horizontal en la que apoyarse: Q₁ es el corte de abajo, delante de D₁C₁.
                ejemplo: proy_planta(solucion.Qdetras)
              - si: cerca_de(solucion.QR70)
                mensaje: |
                  Has llevado 70 mm también desde R₁. RQ no es horizontal, y su planta mide menos que el
                  lado: lo mismo que R₁P₁, 46,3 mm, porque RQ y RP suben lo mismo, 52,5 mm, en 70 mm.
                ejemplo: solucion.QR70
              - si: '!a_distancia(de: proy_planta(P), d: mm(70))'
                mensaje: |
                  Q₁ está a 70 mm de P₁: PQ apoya en el ala horizontal, es horizontal, y la planta lo da
                  entero.
                ejemplo: 'desplaza(proy_planta(Q), dx: mm(5))'
              - si: '!a_distancia(de: proy_planta(R), d: vm_planta(R, P))'
                mensaje: |
                  Estás a 70 mm de P₁, pero no a la distancia buena de R₁. La planta de RQ mide lo mismo que
                  la de RP: con centro en R₁ y radio R₁P₁, el arco corta al de P₁ en Q₁.
                ejemplo: proy_planta(rama(solucion.Qg, 1))
              - si: siempre
                mensaje: |
                  Q₁ está donde se cortan el arco de centro P₁ y radio 70 mm y el de centro R₁ y radio R₁P₁,
                  delante de D₁C₁.
          - nombre: Q2
            pide: el vértice Q en el alzado
            es: proy_alzado(Q)
            bien: |
              Q₂ está en D₂C₂, en la vertical de Q₁: Q está en el ala horizontal, que en el alzado se ve de
              canto.
            diagnosticos:
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la vertical de Q₁.
                ejemplo: 'desplaza(proy_alzado(Q), dx: mm(6))'
              - si: '!en_recta(figura.segmento("DC2"))'
                mensaje: |
                  Q está en el ala horizontal, que en el alzado es la recta D₂C₂ ≡ E₂F₂: Q₂ cae en ella.
                ejemplo: 'desplaza(proy_alzado(Q), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Q₂ está donde la vertical de Q₁ corta D₂C₂.
        trazado:
          - segmento2(proy_alzado(P), proy_alzado(R))
          - segmento2(proy_alzado(R), proy_alzado(Q))
          - segmento2(proy_alzado(P), proy_alzado(Q))
          - segmento2(proy_planta(P), proy_planta(Q))
          - segmento2(proy_planta(Q), proy_planta(R))
          - segmento2(proy_planta(P), proy_planta(R))
        construccion:
          - con: compas
            traza: 'arco(figura.punto("D2"), por: proy_alzado(P), desde: desplaza(proy_alzado(P), dy: -6), hasta: desplaza(proy_alzado(P), dy: 6))'
            porque: |
              Con centro en D₂ y radio 30 mm, el que da el enunciado, un arco corto que corta D₂C₂: P está
              en la arista DC, 30 mm a la derecha de D.
          - con: marca
            traza: proy_alzado(P)
            rotulo: P₂
            porque: |
              P₂, donde el arco corta D₂C₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(P), proy_planta(P))
            porque: |
              Por P₂, la vertical hasta D₁C₁: en la planta, la arista DC es la recta de arriba del
              rectángulo.
          - con: marca
            traza: proy_planta(P)
            rotulo: P₁
            porque: |
              P₁, donde la vertical de P₂ corta D₁C₁.
          - con: compas
            traza: 'arco(proy_alzado(P), por: proy_alzado(X), desde: solucion.arcoX0, hasta: solucion.arcoZ1)'
            porque: |
              Con centro en P₂ y radio 70 mm, el lado de la placa, un arco que sale de debajo de D₂C₂, a la
              derecha, y sube hasta pasar los 60°. Sirve dos veces: para el triángulo auxiliar y, más tarde,
              para R₂, porque PR es frontal y mide 70 mm en el alzado.
          - con: marca
            traza: proy_alzado(X)
            rotulo: X
            porque: |
              X, nombre nuestro, donde el arco corta D₂C₂, a 70 mm de P₂: la base del triángulo
              auxiliar.
          - con: compas
            traza: 'arco(proy_alzado(X), por: proy_alzado(Z), desde: desplaza(proy_alzado(Z), dx: -5, dy: 3), hasta: desplaza(proy_alzado(Z), dx: 5, dy: -3))'
            porque: |
              Con centro en X y el mismo radio, 70 mm, un arco corto que corta el anterior arriba: el
              tercer vértice del triángulo equilátero auxiliar.
          - con: marca
            traza: proy_alzado(Z)
            rotulo: Z
            porque: |
              Z, nombre nuestro, donde se cortan los dos arcos de 70 mm. P₂XZ es equilátero, y su lado
              P₂Z sale de P₂ a 60° de D₂C₂.
          - con: regla
            traza: segmento2(proy_alzado(P), proy_alzado(Z))
            porque: |
              P₂Z, el lado del triángulo auxiliar que va a 60°: en él se llevará la altura de la placa.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(Z), proy_alzado(M))
            porque: |
              Por Z, la vertical hasta D₂C₂: es la altura del triángulo auxiliar, que mide lo mismo que la
              de la placa, 60,6 mm.
          - con: marca
            traza: proy_alzado(M)
            rotulo: M
            porque: |
              M, nombre nuestro, el pie de la vertical de Z en D₂C₂: el punto medio de P₂X.
          - con: compas
            traza: 'arco(proy_alzado(P), por: proy_alzado(W), desde: desplaza(proy_alzado(W), dx: 4, dy: 3), hasta: desplaza(proy_alzado(W), dx: -4, dy: -3))'
            toma: segmento2(proy_alzado(Z), proy_alzado(M))
            porque: |
              Con el compás, ZM, la altura de la placa; con centro en P₂, un arco corto sobre P₂Z: la
              altura queda inclinada 60°, como la de la placa.
          - con: marca
            traza: proy_alzado(W)
            rotulo: W
            porque: |
              W, nombre nuestro, donde el arco corta P₂Z. Está 52,5 mm por encima de D₂C₂: lo que sube la
              altura de la placa, que es la cota de R.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(W), solucion.Rmas)
            guia: figura.segmento("DC2")
            porque: |
              Por W, la paralela a D₂C₂, hacia la derecha y larga, hasta pasar el arco de 70 mm: R está a
              esta altura.
          - con: marca
            traza: proy_alzado(R)
            rotulo: R₂
            porque: |
              R₂, donde la horizontal de W corta el arco de centro P₂ y radio 70 mm, a la derecha de P₂: R
              está en el ala vertical, y PR se ve entero.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(R), proy_planta(R))
            porque: |
              Por R₂, la vertical hasta D₁C₁: R está en el ala vertical, que en la planta se ve de canto.
          - con: marca
            traza: proy_planta(R)
            rotulo: R₁
            porque: |
              R₁, donde la vertical de R₂ corta D₁C₁.
          - con: compas
            traza: 'arco(proy_planta(P), por: proy_planta(Q), desde: desplaza(proy_planta(Q), dx: 5, dy: -6), hasta: desplaza(proy_planta(Q), dx: -5, dy: 6))'
            porque: |
              Con centro en P₁ y radio 70 mm, un arco corto delante de D₁C₁: PQ es horizontal, y la planta
              lo da entero.
          - con: compas
            traza: 'arco(proy_planta(R), por: proy_planta(Q), desde: desplaza(proy_planta(Q), dx: -6, dy: -2), hasta: desplaza(proy_planta(Q), dx: 6, dy: 2))'
            toma: segmento2(proy_planta(R), proy_planta(P))
            porque: |
              Con el compás, R₁P₁; con centro en R₁, otro arco corto. RQ y RP suben lo mismo, 52,5 mm, con
              la misma longitud, así que sus plantas miden lo mismo.
          - con: marca
            traza: proy_planta(Q)
            rotulo: Q₁
            porque: |
              Q₁, donde se cortan los dos arcos, delante de D₁C₁. La circunferencia entera los cortaría
              también detrás, encima de D₁C₁, pero ahí no hay ala horizontal.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(Q), proy_alzado(Q))
            porque: |
              Por Q₁, la vertical hasta D₂C₂: Q está en el ala horizontal, que en el alzado se ve de canto.
          - con: marca
            traza: proy_alzado(Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta D₂C₂.
          - con: regla
            traza: '[segmento2(proy_alzado(P), proy_alzado(R)), segmento2(proy_alzado(R), proy_alzado(Q)), segmento2(proy_planta(P), proy_planta(Q)), segmento2(proy_planta(Q), proy_planta(R))]'
            porque: |
              Los lados de la placa: P₂R₂ y R₂Q₂ en el alzado, P₁Q₁ y Q₁R₁ en la planta. P₂Q₂ va sobre D₂C₂ y
              P₁R₁ sobre D₁C₁, porque cada uno está en un ala.
          - con: transportador
            traza: 'arco(proy_alzado(P), por: proy_alzado(M), desde: proy_alzado(M), hasta: proy_alzado(R))'
            porque: |
              El transportador con el centro en P₂, de D₂C₂ a P₂R₂: el ángulo del lado PR con el ala
              horizontal, que se ve de verdad porque PR es frontal.
        pista: |
          (1) P₂ a 30 mm de D₂ sobre D₂C₂, y P₁ en su vertical. (2) El triángulo equilátero auxiliar de
          70 mm con la base sobre D₂C₂ desde P₂: P₂Z va a 60° y ZM es la altura. (3) ZM llevada sobre P₂Z
          desde P₂ da W, a la cota de R. (4) R₂ a esa altura y a 70 mm de P₂; R₁ en D₁C₁. (5) Q₁ a 70 mm
          de P₁ y a R₁P₁ de R₁, delante; Q₂ en D₂C₂.
        desarrollo: |
          En verde claro, la placa en las dos vistas. La altura de la placa, 60,62 mm, inclinada 60°,
          sube 52,50 mm y avanza 30,31 mm: R está 52,5 mm por encima del ala horizontal. P₂R₂ mide 70 mm,
          y R₁ queda 46,30 mm a la derecha de P₁; Q₁, 45,83 mm por delante de D₁C₁. En el alzado, P₂Q₂ y
          R₂Q₂ se ven acortados, y en la planta P₁R₁ y R₁Q₁: solo PR y PQ se ven enteros.

      - tipo: calcular
        titulo: El ángulo del lado PR con el ala horizontal
        pregunta: Como pregunta nuestra, ¿cuántos grados forma el lado PR de la placa con el ala horizontal?
        respuesta:
          tipo: numero
          valor: '48.59'
          receta: angPR
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '60.00'
            receta: angPlaca
            mensaje: |
              Ese es el ángulo de la **placa** con el ala horizontal, el de su línea de máxima pendiente,
              la altura desde R. PR es otra recta de la placa, no perpendicular a PQ, y de todas las rectas
              de un plano la de máxima pendiente es la que más se inclina: PR forma menos.
          - valor: '41.41'
            receta: 90 - angPR
            mensaje: |
              Ese es el **complementario**: el ángulo de PR con la vertical, el que queda en R₂. El del ala
              horizontal está en P₂, entre D₂C₂ y P₂R₂.
          - valor: '30.00'
            receta: 90 - angPlaca
            mensaje: |
              Es el complementario de los 60° de la placa, el de su altura con la vertical. Ni es el de la
              placa ni el de PR: PR es frontal, y su ángulo con el ala horizontal se mide en el alzado, en
              P₂.
        pista: |
          PR está en el ala vertical, que es frontal: el alzado la da en verdadera magnitud. Mide en P₂, con
          el transportador del Taller en el paso anterior o en tu lámina, el ángulo entre D₂C₂ y P₂R₂.
        desarrollo: |
          R está 52,5 mm por encima de P, y PR mide 70 mm:

          $$ \operatorname{sen}\alpha = \frac{52{,}5}{70} = 0{,}75, \qquad \alpha \approx 48{,}59^{\circ} $$

          RQ forma lo mismo, por la misma cuenta: los dos lados que salen de R bajan 52,5 mm en 70 mm. La
          altura de la placa, que es su línea de máxima pendiente, forma 60°, y ninguna recta de la
          placa forma más. En la construcción el mismo ángulo se lee también en R₂, entre R₂P₂ y la
          horizontal de W: son alternos, porque esa horizontal es paralela a D₂C₂.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: PQ apoya en el ala horizontal, así que es horizontal, y la altura de la placa desde R, perpendicular a PQ, es su línea de máxima pendiente; forma 60° con el ala horizontal.
          - texto: La altura mide 70·√3/2 = 60,6 mm; inclinada 60°, sube 52,5 mm, y esa es la cota de R.
          - texto: PR está en el ala vertical, que es frontal, así que R₂ está a 70 mm de P₂ y a 52,5 mm de D₂C₂.
          - texto: PQ se ve entero en la planta, y la planta de RQ mide lo mismo que la de RP, porque los dos suben 52,5 mm en 70 mm; Q₁ está en el cruce de los dos arcos.
          - texto: Como la placa forma 60° con el ala horizontal, P₂R₂ se traza a 60° de D₂C₂, con 70 mm.
            trampa: true
            mensaje: |
              Los 60° son los de la placa, los de su línea de máxima pendiente. PR no lo es, y forma
              48,6°. Trazado a 60°, R subiría 60,6 mm, por encima del borde AB del ala vertical, que mide 60.
    resolucion: |
      **Qué fija el enunciado.** La pieza es un ángulo de dos alas: la vertical ABCD, frontal, y la
      horizontal DCFE, que se juntan en la arista DC. Leemos en la perspectiva que el lado PQ apoya en el
      ala horizontal, con P en la arista y Q a la derecha, y que R se levanta hasta apoyarse en el ala
      vertical; los 60° son los de la placa con el ala horizontal.

      **La cota de R.** PQ es horizontal, así que la altura del triángulo desde R, que le es
      perpendicular, es la línea de máxima pendiente de la placa: mide 70·√3/2 = 60,62 mm y forma 60°
      con el ala horizontal. R está, por tanto, 60,62·sen 60° = 52,5 mm por encima de ella. En la lámina
      se construye con un triángulo equilátero auxiliar de 70 mm, P₂XZ, con la base sobre D₂C₂: P₂Z va a
      60°, ZM es la altura, y llevada desde P₂ sobre P₂Z da W, a 52,5 mm de D₂C₂.

      **R.** PR está en el ala vertical, que es frontal: P₂R₂ mide 70 mm. R₂ está donde la horizontal de
      W corta el arco de centro P₂ y radio 70 mm, a la derecha; a la izquierda quedaría fuera de la pieza.
      R₁ cae en D₁C₁, porque el ala vertical se ve de canto en la planta: 46,30 mm a la derecha de P₁.

      **Q.** PQ apoya en el ala horizontal, así que P₁Q₁ mide 70 mm. RQ y RP bajan lo mismo, 52,5 mm,
      con la misma longitud, y sus plantas miden igual: R₁Q₁ = R₁P₁. Los dos arcos se cortan delante de
      D₁C₁ en Q₁, 45,83 mm por delante de la arista; Q₂ cae en D₂C₂.

      **La comprobación.** PQ = QR = RP = 70 mm, y la placa forma 60,0° con el ala horizontal. Su lado
      PR, que se ve entero en el alzado, forma 48,6°: sen α = 52,5/70.

  - id: sd59-el-nudo-de-la-grua
    titulo: El nudo del cable de la grúa cuando el contrapeso toca el suelo
    fuente: Ejercicio 43 (SD59) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 44),
    # con su doble numeración «a) 1.», que es del original. Lo que la página
    # no dice —qué es el suelo, cómo baja P, qué se gira y alrededor de qué—
    # va en las Notas nuestras.
    enunciado: |
      Se presenta una grúa mediante el alzado y la planta. Se pide:

      a) 1. Determinar gráficamente la posición del nudo N cuando el contrapeso P alcance el suelo.

      b) 2. Calcular la longitud real del cable entre el nudo N y el extremo P.

      c) 3. Calcular el ángulo formado por NQ y QP.

      **Notas nuestras.** La figura es la grúa en alzado, arriba, y en planta, debajo: la cabina
      con el tambor, la pluma, que acaba en Q, y el cable, que sale del tambor, pasa por el nudo N,
      llega a Q y baja en vertical hasta el contrapeso P (P₁ ≡ Q₁: QP es vertical). El suelo es la
      recta rayada del alzado, a la altura de la base de la cabina. Leemos que P llega al suelo
      porque el tambor suelta cable: el cable corre por la polea de Q sin estirarse, P baja en
      vertical y cada punto del tramo del tambor a Q, también el nudo, avanza hacia Q lo mismo que
      P baja. Por eso el cable de N a P mide lo mismo antes y después. No leemos que la pluma
      bascule: la figura no dibuja dónde se articularía, y sin ese eje la posición de N no se
      podría determinar. Para medir sobre el cable en verdadera magnitud lo giramos alrededor del
      eje vertical por Q, que es el propio tramo QP: Q y P no se mueven, N no cambia de cota, y el
      cable queda frontal. N está a la misma altura que P, así que el triángulo NQP es rectángulo
      en P y su plano es vertical. La lámina no da escala: las longitudes se dan en milímetros de
      la lámina. Los nombres P′ y N′ (P en el suelo y el nudo entonces) y (N) y (N′) (girados) son
      nuestros.
    pide: El nudo N con el contrapeso en el suelo, N′, en las dos vistas, construido con un giro de eje vertical; la longitud real del cable de N a P, en mm, y el ángulo de NQ y QP, en grados.
    receta:
      lamina: sd59
      escena:
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        cable: recta3(Q, N)
      solucion:
        # P en el suelo: baja en vertical hasta la recta rayada del alzado.
        Ps: 'vertical_hasta(P, linea(figura.segmento("suelo")))'
        baja: diferencia_de_cotas(P, Ps)
        # Decisión: el cable no se estira y corre por la polea de Q: N avanza
        # hacia Q lo que baja P. N′ está en QN a |QN| − baja de Q (rama 1, la
        # que va de Q hacia N).
        NNs: 'punto_a_distancia(cable, desde: Q, distancia: vm(Q, N) - baja)'
        Nn: rama(NNs, 1)
        # Decisión: el giro tiene el eje vertical por Q, que es la recta QP.
        # (N) es N girado hasta que QN queda frontal: a la cota de N y en la
        # horizontal de Q₁, a Q₁N₁ de Q₁. Kn es el punto del eje a la cota de
        # N (aquí, P mismo: N está a su altura). Los dos lados valen: es una
        # elección, y la construcción va por la derecha (rama 1), donde el
        # alzado está libre.
        Kn: 'punto3(alzado: pie_perpendicular(figura.punto("N2"), figura.segmento("QP2")), planta: figura.punto("Q1"))'
        Kx: 'punto3(alzado: desplaza(proy_alzado(Kn), dx: 10), planta: desplaza(figura.punto("Q1"), dx: 10))'
        Ng: 'punto_a_distancia(recta3(Kn, Kx), desde: Kn, distancia: vm_planta(Q, N))'
        # (N′)₂: lo que baja P, llevado desde (N)₂ hacia Q₂ sobre el cable
        # girado, que es frontal: en el alzado, en verdadera magnitud.
        Nn_g2: 'uno(medir_sobre(segmento2(proy_alzado(Ng), figura.punto("Q2")), desde: proy_alzado(Ng), distancia: baja), 1)'
        # Para los diagnósticos y la construcción: la horizontal de Q₁, el
        # extremo de la prolongación de Q₂P₂ bajo el suelo, y los extremos
        # largos de las rectas que se trazan más allá del punto que dan.
        horQ1: 'perpendicular(por: figura.punto("Q1"), a: figura.segmento("QP2"))'
        Ps2mas: 'desplaza(proy_alzado(Ps), dy: mm(1.5))'
        Lh1: 'desplaza(proy_planta(rama(Ng, 1)), dx: mm(4))'
        Lv1: 'desplaza(proy_alzado(rama(Ng, 1)), dy: mm(-3))'
        Lh2: 'desplaza(proy_alzado(rama(Ng, 1)), dx: mm(4))'
        LhN: 'desplaza(proy_alzado(Nn), dx: mm(-2))'
        LvN: 'desplaza(proy_planta(Nn), dy: mm(2))'
        # Los errores, construidos: el radio del giro tomado en el alzado, lo
        # que baja P llevado desde Q₂ o hacia fuera, o sobre Q₂N₂ sin girar.
        Ng1_alz: 'medir_sobre(horQ1, desde: figura.punto("Q1"), distancia: vm_alzado(Q, N))'
        Nng2_Q: 'uno(medir_sobre(segmento2(figura.punto("Q2"), proy_alzado(Ng)), desde: figura.punto("Q2"), distancia: baja), 1)'
        Nng2_fuera: 'uno(medir_sobre(segmento2(proy_alzado(Ng), figura.punto("Q2")), desde: proy_alzado(Ng), distancia: baja), 2)'
        Nn2_alz: 'uno(medir_sobre(figura.segmento("cable2"), desde: figura.punto("N2"), distancia: baja), 1)'
        # El ángulo que se ve en el alzado, para un distractor: N llevado al
        # plano frontal de Q sin cambiar su alzado.
        Nf: 'punto3(alzado: figura.punto("N2"), planta: pie_perpendicular(figura.punto("N1"), horQ1))'
      comprueba:
        # N y Q están en el cable que dibuja la lámina, y el punto del eje a
        # la cota de N está en QP, que es vertical (P₁ ≡ Q₁).
        - 'en_recta(N, recta3(alzado: figura.segmento("cable2"), planta: figura.segmento("cable1")))'
        - 'en_recta(Q, recta3(alzado: figura.segmento("cable2"), planta: figura.segmento("cable1")))'
        - en_recta(Kn, recta3(Q, P))
    pasos:
      - tipo: reconocer
        pregunta: El tambor suelta cable y el contrapeso P baja hasta el suelo. ¿Qué le pasa al nudo N?
        opciones:
          - texto: Baja en vertical lo mismo que P, porque los dos cuelgan del mismo cable
            mensaje: |
              N no cuelga: está en el tramo que va del tambor a Q, que sube en diagonal hasta la polea.
              Ese tramo no se mueve de sitio; el cable corre a lo largo de él, y N con el cable, por la
              misma recta.
          - texto: Avanza por el cable hacia Q lo mismo que baja P, porque el cable no se estira
            correcta: true
            mensaje: |
              Eso es. El cable corre por la polea de Q: lo que el tambor suelta pasa por N y por Q y
              baja con P. Cada punto del tramo del tambor a Q avanza hacia Q lo que baja P, y el nudo
              también. Por eso el cable de N a P mide lo mismo antes y después.
          - texto: No se mueve, porque al soltar el tambor solo se alarga el tramo vertical QP del que cuelga el contrapeso
            mensaje: |
              El tramo QP se alarga, pero con cable que viene de detrás: del tambor, pasando por N y
              por la polea. El nudo va con ese cable, y avanza hacia Q justo lo que se alarga QP.

      # Decisión: un solo paso construir, con el giro y la vuelta. El giro es
      # el método del tema de giros: eje vertical por Q, el cable queda
      # frontal. La pregunta b) y la c) se leen en ese mismo dibujo.
      - tipo: construir
        titulo: El nudo con el contrapeso en el suelo, girando el cable
        intro: |
          Primero, P en el suelo: P baja en vertical, por la prolongación de Q₂P₂, hasta la recta
          rayada; marca P′₂. Después gira el cable alrededor del eje vertical por Q —el propio QP, que
          no se mueve— hasta que QN quede frontal: N₁ va por un arco de centro Q₁ hasta la horizontal
          de Q₁, (N)₁, y (N)₂ queda en su vertical, a la altura de N₂. Q₂(N)₂ es el cable en
          verdadera magnitud. Lleva sobre él, desde (N)₂ hacia Q₂, lo que baja P: es (N′)₂, el nudo
          con P en el suelo, todavía girado. Deshaz el giro: N′₂ a la misma altura, sobre Q₂N₂, y N′₁
          en su vertical, sobre Q₁N₁. Gira hacia el lado que quieras; aquí, a la derecha. Avisos para
          el imán: P′₂ cae entre las rayas del suelo, y N′₂ a medio milímetro de una arista de la
          pluma que va casi pegada al cable; amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Ps2
            rotulo: P′₂
            pide: el contrapeso P apoyado en el suelo, en el alzado
            es: proy_alzado(solucion.Ps)
            bien: |
              P′₂ está en la prolongación de Q₂P₂, sobre la recta rayada del suelo. P baja 25,9 mm,
              lo que mide P₂P′₂; en la planta no se mueve: P′₁ ≡ P₁.
            diagnosticos:
              - si: '!en_vertical_de(figura.punto("P2"))'
                mensaje: |
                  P cuelga de Q y baja en vertical: P′₂ está en la **prolongación de Q₂P₂**, debajo de
                  P₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Ps), dx: mm(6))'
              - si: '!en_recta(figura.segmento("suelo"))'
                mensaje: |
                  El suelo es la **recta rayada** de la derecha del alzado, a la altura de la base de la
                  cabina. P baja hasta tocarla.
                ejemplo: 'desplaza(proy_alzado(solucion.Ps), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  P′₂ está donde la prolongación de Q₂P₂ corta la recta rayada del suelo.
          - nombre: Ng1
            rotulo: (N)₁
            pide: N girado hasta que el cable QN quede frontal, en la planta
            es: proy_planta(solucion.Ng)
            bien: |
              (N)₁ está en la horizontal de Q₁, a Q₁N₁ de Q₁, 58,6 mm: con el eje vertical por Q, N
              describe en la planta una circunferencia de centro Q₁, y QN queda frontal cuando su
              planta es horizontal.
            diagnosticos:
              - si: cerca_de(solucion.Ng1_alz)
                mensaje: |
                  Has tomado de radio **Q₂N₂**, lo que mide el cable en el alzado. En un giro de eje
                  vertical, N gira en un plano horizontal, y en la planta su radio es **Q₁N₁**.
                ejemplo: uno(solucion.Ng1_alz, 1)
              - si: '!en_recta(solucion.horQ1)'
                mensaje: |
                  (N)₁ va en la **horizontal de Q₁**: el cable girado es frontal, y la planta de una
                  frontal es horizontal en el papel.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Ng, 1)), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de Q₁, pero no a la distancia buena. Con centro en Q₁ y radio
                  Q₁N₁, el arco que sale de N₁ corta esa horizontal en (N)₁.
          - nombre: Ng2
            rotulo: (N)₂
            pide: N girado, en el alzado
            es: proy_alzado(solucion.Ng)
            bien: |
              (N)₂ está en la vertical de (N)₁ y a la altura de N₂, que es también la de P₂: el giro
              de eje vertical no cambia la cota. Q₂(N)₂ es el cable QN en verdadera magnitud, 64,1 mm.
            diagnosticos:
              - si: '!en_vertical_de(Ng1)'
                mensaje: |
                  (N)₂ va en la **vertical de (N)₁**: es el mismo punto girado, visto dos veces.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.Ng, 1)), dx: mm(6))'
              - si: '!en_horizontal_de(figura.punto("N2"))'
                mensaje: |
                  Un giro de eje vertical **no cambia la cota**: (N)₂ está a la altura de N₂, en la
                  recta que va de N₂ a P₂.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.Ng, 1)), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  (N)₂ está donde la vertical de (N)₁ corta la horizontal de N₂.
          - nombre: Nng2
            rotulo: (N′)₂
            pide: el nudo con P en el suelo, todavía girado, en el alzado
            es: solucion.Nn_g2
            bien: |
              (N′)₂ está en Q₂(N)₂, a 25,9 mm de (N)₂ hacia Q₂: lo que baja P. El cable girado es
              frontal, y en el alzado se mide de verdad.
            diagnosticos:
              - si: cerca_de(solucion.Nng2_Q)
                mensaje: |
                  Has llevado lo que baja P **desde Q₂**. Lo que baja P lo avanza el nudo: se lleva
                  desde (N)₂, hacia Q₂.
                ejemplo: rama(solucion.Nng2_Q, 1)
              - si: cerca_de(solucion.Nng2_fuera)
                mensaje: |
                  Has llevado lo que baja P hacia fuera, más allá de (N)₂. Al bajar P, el cable pasa por
                  la polea hacia P: el nudo **se acerca** a Q, no se aleja.
                ejemplo: rama(solucion.Nng2_fuera, 1)
              - si: siempre
                mensaje: |
                  (N′)₂ está en Q₂(N)₂, a lo que baja P —de P₂ a P′₂— desde (N)₂, hacia Q₂. Tómalo con el
                  compás y pincha en (N)₂.
          - nombre: Nn2
            rotulo: N′₂
            pide: el nudo con P en el suelo, en el alzado
            es: proy_alzado(solucion.Nn)
            bien: |
              N′₂ está en Q₂N₂, a la altura de (N′)₂: al deshacer el giro, la cota no cambia. N′ queda
              a 38,1 mm de Q por el cable.
            diagnosticos:
              - si: cerca_de(solucion.Nn2_alz)
                mensaje: |
                  Has llevado lo que baja P **sobre Q₂N₂**, en el alzado. Q₂N₂ no es la verdadera
                  magnitud del cable, que no es frontal: el alzado lo acorta de 64,1 a 34,9 mm. Por eso se
                  gira, y N′₂ sale de (N′)₂ por su horizontal.
                ejemplo: solucion.Nn2_alz
              - si: '!en_recta(figura.segmento("cable2"))'
                mensaje: |
                  N′ sigue en el cable: N′₂ está **en Q₂N₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.Nn), dx: mm(-5))'
              - si: '!en_horizontal_de(Nng2)'
                mensaje: |
                  Al deshacer el giro el punto vuelve **sin cambiar de cota**: N′₂ está a la altura de
                  (N′)₂.
                ejemplo: 'uno(medir_sobre(figura.segmento("cable2"), desde: proy_alzado(solucion.Nn), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  N′₂ está donde la horizontal de (N′)₂ corta Q₂N₂.
          - nombre: Nn1
            rotulo: N′₁
            pide: el nudo con P en el suelo, en la planta
            es: proy_planta(solucion.Nn)
            bien: |
              N′₁ está en Q₁N₁, en la vertical de N′₂. También sale deshaciendo el giro en la planta:
              con centro en Q₁, de vuelta desde la horizontal de Q₁ hasta Q₁N₁.
            diagnosticos:
              - si: '!en_vertical_de(Nn2)'
                mensaje: |
                  N′₁ va en la **vertical de N′₂**.
                ejemplo: 'uno(medir_sobre(figura.segmento("cable1"), desde: proy_planta(solucion.Nn), distancia: mm(6)), 1)'
              - si: '!en_recta(figura.segmento("cable1"))'
                mensaje: |
                  N′ sigue en el cable: N′₁ está **en Q₁N₁**, donde la corta la vertical de N′₂.
                ejemplo: 'desplaza(proy_planta(solucion.Nn), dy: mm(6))'
              - si: siempre
                mensaje: |
                  N′₁ está donde la vertical de N′₂ corta Q₁N₁.
        trazado:
          - segmento2(figura.punto("P2"), proy_alzado(solucion.Ps))
          - segmento2(figura.punto("Q1"), proy_planta(solucion.Ng))
          - segmento2(figura.punto("Q2"), proy_alzado(solucion.Ng))
          - segmento2(solucion.Nn_g2, proy_alzado(solucion.Nn))
          - segmento2(proy_alzado(solucion.Nn), proy_planta(solucion.Nn))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("P2"), solucion.Ps2mas)
            porque: |
              En el alzado, Q₂P₂ prolongada con la regla hacia abajo, hasta pasar la recta rayada del
              suelo: P cuelga de Q y baja en vertical, por la prolongación del tramo QP.
          - con: marca
            traza: proy_alzado(solucion.Ps)
            rotulo: P′₂
            porque: |
              P′₂, donde la prolongación de Q₂P₂ corta la recta del suelo: el contrapeso apoyado. P baja
              lo que mide P₂P′₂, 25,9 mm. P′ es nombre nuestro, y en la planta P′₁ ≡ P₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("Q1"), solucion.Lh1)
            porque: |
              Por Q₁, la horizontal hacia la derecha, larga. El eje del giro es la vertical por Q: en la
              planta, el punto Q₁; en el alzado, la recta Q₂P₂. Cuando QN quede frontal, su planta irá
              por esta horizontal.
          - con: compas
            traza: 'arco(figura.punto("Q1"), por: figura.punto("N1"), desde: figura.punto("N1"), hasta: desplaza(proy_planta(rama(solucion.Ng, 1)), dy: 6))'
            porque: |
              Con centro en Q₁ y radio Q₁N₁, el arco desde N₁ hasta pasar la horizontal: N gira
              alrededor del eje vertical por Q y en la planta describe una circunferencia de centro Q₁.
              Hacia la izquierda valdría igual; aquí, a la derecha, donde el alzado está libre.
          - con: marca
            traza: proy_planta(solucion.Ng)
            rotulo: (N)₁
            porque: |
              (N)₁, donde el arco corta la horizontal de Q₁: la planta de N con el cable girado hasta
              quedar frontal, a 58,6 mm de Q₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Ng), solucion.Lv1)
            porque: |
              Por (N)₁, la vertical hasta el alzado, larga, hasta pasar la altura de N₂: el giro no
              cambia la cota de N.
          - con: regla
            traza: segmento2(figura.punto("N2"), solucion.Lh2)
            porque: |
              En el alzado, la recta de N₂ a P₂, prolongada con la regla hacia la derecha hasta pasar la
              vertical de (N)₁. N₂ y P₂ están a la misma altura: es la horizontal de N₂, y N girado sigue
              en ella.
          - con: marca
            traza: proy_alzado(solucion.Ng)
            rotulo: (N)₂
            porque: |
              (N)₂, donde la vertical de (N)₁ corta la horizontal de N₂: el alzado de N girado.
          - con: regla
            traza: segmento2(figura.punto("Q2"), proy_alzado(solucion.Ng))
            porque: |
              Q₂(N)₂, el tramo QN del cable girado: es frontal, y su alzado es su verdadera magnitud,
              64,1 mm. Con Q₂P₂, el cable de N a P se ve entero de verdad, y el ángulo en Q₂ entre los dos
              tramos es el de NQ y QP.
          - con: compas
            traza: 'arco(proy_alzado(solucion.Ng), por: solucion.Nn_g2, desde: desplaza(solucion.Nn_g2, dx: 2.4, dy: -5.5), hasta: desplaza(solucion.Nn_g2, dx: -2.4, dy: 5.5))'
            toma: segmento2(figura.punto("P2"), proy_alzado(solucion.Ps))
            porque: |
              Con el compás, lo que baja P, de P₂ a P′₂, y centro en (N)₂: el arco corta Q₂(N)₂ entre
              (N)₂ y Q₂. El cable no se estira: lo que gana QP lo pierde NQ, y el nudo avanza hacia Q lo
              que baja P.
          - con: marca
            traza: solucion.Nn_g2
            rotulo: (N′)₂
            porque: |
              (N′)₂, donde el arco corta Q₂(N)₂: el nudo con P en el suelo, todavía girado, a 38,1 mm de
              Q₂.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Nn_g2, solucion.LhN)
            porque: |
              Se deshace el giro: el nudo vuelve a su sitio sin cambiar de cota. Por (N′)₂, la
              horizontal hacia la izquierda, hasta pasar Q₂N₂.
          - con: marca
            traza: proy_alzado(solucion.Nn)
            rotulo: N′₂
            porque: |
              N′₂, donde esa horizontal corta Q₂N₂, el alzado del cable. N′ es nombre nuestro: el nudo
              cuando P toca el suelo.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.Nn), solucion.LvN)
            porque: |
              Por N′₂, la vertical hasta la planta, hasta pasar Q₁N₁.
          - con: marca
            traza: proy_planta(solucion.Nn)
            rotulo: N′₁
            porque: |
              N′₁, donde la vertical de N′₂ corta Q₁N₁, la planta del cable.
          - con: transportador
            traza: 'arco(figura.punto("Q2"), por: figura.punto("P2"), desde: figura.punto("P2"), hasta: proy_alzado(rama(solucion.Ng, 1)))'
            porque: |
              El transportador con el centro en Q₂, desde Q₂P₂ hasta Q₂(N)₂: NQ y QP forman 66,1°. Es el
              ángulo del cable en la polea, que no cambia al bajar P.
        pista: |
          (1) P′₂: la prolongación de Q₂P₂ hasta la recta rayada. (2) El giro: con centro en Q₁ y radio
          Q₁N₁, de N₁ a la horizontal de Q₁, (N)₁; (N)₂ en su vertical y a la altura de N₂. (3) Sobre
          Q₂(N)₂, lo que baja P desde (N)₂ hacia Q₂: (N′)₂. (4) Sin cambiar de altura, a Q₂N₂: N′₂; en su
          vertical, sobre Q₁N₁: N′₁.
        desarrollo: |
          En verde claro, la bajada de P, el cable girado Q₂(N)₂ y su planta Q₁(N)₁, y la vuelta de N′.
          P baja 25,9 mm; el tramo QN mide 64,1 mm de verdad, y con P en el suelo, QN′ mide 38,1 mm.

      - tipo: calcular
        titulo: El cable de N a P
        pregunta: ¿Cuánto mide de verdad el cable entre el nudo N y el extremo P?
        respuesta:
          tipo: numero
          valor: '89.96'
          receta: en_mm(vm(N, Q) + vm(Q, P))
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '64.05'
            receta: en_mm(vm(N, Q))
            mensaje: |
              Eso es solo el tramo **NQ**, Q₂(N)₂ en el giro. El cable sigue de Q a P: hay que sumarle
              Q₂P₂, 25,9 mm, que es vertical y ya está en verdadera magnitud en el alzado.
          - valor: '60.85'
            receta: en_mm(vm_alzado(N, Q) + vm(Q, P))
            mensaje: |
              Has sumado Q₂P₂ y **Q₂N₂ en el alzado**, sin girar. QN no es frontal, y el alzado lo acorta
              de 64,1 a 34,9 mm. Girado alrededor del eje vertical por Q, Q₂(N)₂ da su verdadera
              magnitud.
          - valor: '84.49'
            receta: en_mm(vm_planta(N, Q) + vm(Q, P))
            mensaje: |
              Has sumado Q₂P₂ y **Q₁N₁ en la planta**. QN sube de N a Q, y la planta también lo acorta:
              mide 58,6 mm, y de verdad 64,1.
          - valor: '58.58'
            receta: en_mm(vm(N, P))
            mensaje: |
              Eso es la distancia **en línea recta de N a P**: los dos están a la misma altura, y NP es
              horizontal. El cable no va recto: sube de N a la polea de Q y baja a P.
          - valor: '115.87'
            receta: en_mm(vm(N, Q) + vm(Q, Ps))
            mensaje: |
              Has mezclado las dos posiciones: NQ de antes y QP′ de después, con P en el suelo. Al bajar
              P, el nudo avanza hacia Q, y el cable de N′ a P′ mide lo mismo que el de N a P.
        pista: |
          En el paso anterior, o en tu lámina: Q₂(N)₂ más Q₂P₂, los dos tramos en verdadera magnitud.
          Con P en el suelo, Q₂(N′)₂ más Q₂P′₂ da lo mismo.
        desarrollo: |
          El triángulo NQP es rectángulo en P: N está a la altura de P y QP es vertical. Con Q₁N₁ =
          58,58 mm y QP = 25,91 mm:

          $$ \overline{NQ} = \sqrt{58{,}58^{2} + 25{,}91^{2}} \approx 64{,}05 \text{ mm}, \qquad \overline{NQ} + \overline{QP} \approx 64{,}05 + 25{,}91 = 89{,}96 \text{ mm} $$

          Con P en el suelo sale lo mismo: QN′ = 38,14 mm y QP′ = 51,82 mm.

      - tipo: calcular
        titulo: El ángulo de NQ y QP
        pregunta: ¿Cuántos grados forman los tramos NQ y QP del cable?
        respuesta:
          tipo: numero
          valor: '66.14'
          receta: angulo_rectas(cable, recta3(Q, P))
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '42.15'
            receta: angulo_rectas(recta3(Q, Nf), recta3(Q, P))
            mensaje: |
              Es lo que forman Q₂N₂ y Q₂P₂ **en el alzado**. El plano NQP es vertical, pero no frontal, y
              el alzado deforma su ángulo. Girado hasta quedar frontal, se mide entre Q₂(N)₂ y Q₂P₂.
          - valor: '23.86'
            receta: angulo_con_ph(cable)
            mensaje: |
              Ese es el ángulo del cable NQ con el **plano horizontal**, el de (N)₂ en el triángulo
              girado: el complementario del que se pide. El ángulo de NQ y QP está en Q₂, entre Q₂(N)₂ y
              la vertical Q₂P₂.
          - valor: '113.86'
            receta: 180 - angulo_rectas(cable, recta3(Q, P))
            mensaje: |
              Ese es el **suplementario**: el de NQ con la prolongación de PQ por encima de Q. El ángulo
              de los dos tramos del cable es el que abarcan desde Q, entre QN y QP, y es agudo.
        pista: |
          Con el transportador del Taller en el paso anterior, o en tu lámina: en Q₂, entre Q₂P₂ y
          Q₂(N)₂, el cable girado. En Q₂N₂, sin girar, el ángulo sale deformado.
        desarrollo: |
          En el triángulo NQP, rectángulo en P, el cateto opuesto al ángulo de Q es NP, la planta Q₁N₁,
          y el contiguo, QP:

          $$ \operatorname{tg}\widehat{Q} = \frac{58{,}58}{25{,}91} \approx 2{,}261, \qquad \widehat{Q} \approx 66{,}14^{\circ} $$

          Con P en el suelo el ángulo no cambia: N′ sigue en la misma recta QN. En (N)₂, la vertical de
          (N)₁ y el cable girado forman el mismo ángulo, porque esa vertical es paralela a QP. Y una
          casualidad de esta lámina: en Q₁, Q₁N₁ y la horizontal de Q₁ forman 66,4°, que no es el
          ángulo pedido (es lo que giraría el cable hacia la izquierda; hacia la derecha, como aquí,
          gira 113,6°); quien midiera ese tendría una cifra que la casilla da por buena, y no se puede
          distinguir.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: P baja en vertical, por la prolongación de Q₂P₂, hasta la recta rayada del suelo; baja lo que mide P₂P′₂, 25,9 mm.
          - texto: El cable no se estira y corre por la polea de Q, así que el nudo N avanza hacia Q, por el cable, lo mismo que baja P.
          - texto: Girado alrededor del eje vertical por Q, que es el propio QP, el tramo QN queda frontal sin que N cambie de cota, y Q₂(N)₂ es su verdadera magnitud.
          - texto: Sobre Q₂(N)₂, (N′)₂ a 25,9 mm de (N)₂; deshecho el giro, N′₂ está a su altura sobre Q₂N₂, y N′₁ en su vertical sobre Q₁N₁.
          - texto: N′₂ está sobre Q₂N₂ a 25,9 mm de N₂, medidos directamente en el alzado.
            trampa: true
            mensaje: |
              Q₂N₂ no es la verdadera magnitud del cable: QN no es frontal, y el alzado lo acorta de 64,1
              a 34,9 mm. Medido ahí, N′₂ caería 11,8 mm más allá, hacia Q₂. Hay que girarlo antes.
    resolucion: |
      **Qué pasa.** El tambor suelta cable, que corre por la polea de Q sin estirarse: P baja en
      vertical hasta la recta rayada del suelo, a la altura de la base de la cabina, y el nudo N
      avanza hacia Q, por el cable, lo mismo que baja P. P₂P′₂ mide 25,9 mm.

      **El giro.** El tramo QN no es frontal ni horizontal. Se gira alrededor del eje vertical por Q,
      que es el propio tramo QP: con centro en Q₁ y radio Q₁N₁, 58,6 mm, N₁ va hasta la horizontal de
      Q₁, (N)₁, y (N)₂ queda en su vertical a la altura de N₂, que es también la de P₂. Q₂(N)₂ es QN
      en verdadera magnitud, 64,1 mm.

      **El nudo.** Sobre Q₂(N)₂, desde (N)₂ hacia Q₂, los 25,9 mm que baja P: (N′)₂, a 38,1 mm de Q₂.
      Deshecho el giro, a la misma altura, N′₂ cae en Q₂N₂, y N′₁ en su vertical, sobre Q₁N₁.

      **El cable.** De N a P mide QN + QP = 64,05 + 25,91 = 89,96 mm, y con P en el suelo,
      38,14 + 51,82, lo mismo. **El ángulo.** El triángulo NQP es rectángulo en P y su plano es
      vertical; girado, se ve de verdad en el alzado, y en Q₂ mide 66,1°. En el alzado sin girar se ve
      de 42,2°.

  - id: sd60-la-cara-cdgh-y-el-diedro-de-alfa-y-beta
    titulo: La cara CDGH en verdadera magnitud, su pendiente y el ángulo de las caras α y β
    fuente: Ejercicio 44 (SD60) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 45),
    # con su doble numeración «a) 1.», que es del original. El método de la
    # verdadera magnitud no lo impone: abatimos con la charnela CH, y lo dice
    # el intro. «El ángulo formado por las caras» se lee como el diedro que
    # abarcan las caras por dentro de la pieza, y pasa de 90°; el de los
    # planos, el menor, es un distractor.
    enunciado: |
      Se presenta el alzado y la vista en planta de una pieza. Se pide:

      a) 1. Dibujar gráficamente la verdadera magnitud de la cara CDGH.

      b) 2. Calcular la pendiente de la cara CDGH en grados.

      c) 3. Calcular el ángulo formado por las caras α y β.

      **Notas nuestras.** La figura es la pieza en alzado, arriba, y en planta, debajo: una base
      horizontal, una cara de arriba también horizontal, 45,0 mm más alta, y entre las dos, una cara
      vertical, la de la derecha, y cuatro inclinadas. α es la cara ABDC y β, la ABFE, simétricas
      respecto del plano frontal que contiene la arista AB. La cara CDGH tiene dos lados, CH y DG,
      que son horizontales y frontales a la vez, y GH les es perpendicular. Por pendiente de la cara
      entendemos el ángulo que forma con el plano horizontal, el de su línea de máxima pendiente.
      Por el ángulo formado por las caras α y β, el diedro que abarcan por dentro de la pieza, como
      el que mediría un transportador apoyado en ella en ángulo recto con la arista AB: pasa de 90°.
      Si se leyera el ángulo entre los planos de las dos caras, el menor de los dos que forman,
      saldría su suplementario. K es nombre nuestro.
    pide: La cara CDGH abatida sobre el plano de la base, que es su verdadera magnitud; su pendiente en grados, y el ángulo de las caras α y β en grados.
    receta:
      lamina: sd60
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        cara: plano(C, H, G)
        alfa: plano(A, B, C)
        beta: plano(A, B, E)
        arista: recta3(A, B)
      solucion:
        # Decisión: la verdadera magnitud, abatiendo la cara sobre el plano
        # de la base con la charnela CH, que está en él. G se abate con el
        # triángulo de GH, que es perpendicular a CH; D cae con el mismo giro.
        # Los dos lados valen: es una elección, y la construcción va hacia
        # abajo (rama 1), fuera de la planta.
        ch: recta3(C, H)
        Gab: abatido_a_elegir(G, ch, cara)
        Dab: 'abatido_junto(D, ch, cara, con: Gab, de: G)'
        sube: diferencia_de_cotas(G, H)
        # K: desde G₁, sobre la paralela a la charnela (la prolongación de
        # D₁G₁), lo que G sube sobre H. Vale a los dos lados: es una lista.
        Ks: 'medir_sobre(figura.segmento("DG1"), desde: figura.punto("G1"), distancia: sube)'
        Kp: uno(Ks, 1)
        # Las cifras.
        pendiente_cara: angulo_con_ph(cara)
        diedro: angulo_diedro(C, arista, E)
        entre_planos: angulo_planos(alfa, beta)
        # Para los distractores: CD vista en el alzado como si fuera frontal
        # (D llevado al plano frontal de C sin cambiar su alzado) y el plano
        # frontal que contiene a AB, el de simetría de la pieza.
        Df: 'punto3(alzado: figura.punto("D2"), planta: pie_perpendicular(figura.punto("D1"), figura.segmento("CH1")))'
        Ax: 'punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10))'
        simetria: plano(A, B, Ax)
        # Los errores del radio, construidos: la cota sola y la planta sola.
        G0_cota: 'medir_sobre(figura.segmento("der1"), desde: figura.punto("H1"), distancia: sube)'
        G0_planta: 'uno(medir_sobre(figura.segmento("der1"), desde: figura.punto("H1"), distancia: vm_planta(G, H)), 1)'
        D0_cota: 'medir_sobre(perpendicular(por: figura.punto("D1"), a: figura.segmento("CH1")), desde: pie_perpendicular(figura.punto("D1"), figura.segmento("CH1")), distancia: sube)'
        K_planta: 'medir_sobre(figura.segmento("DG1"), desde: figura.punto("G1"), distancia: vm_planta(G, H))'
        perpD1: 'perpendicular(por: figura.punto("D1"), a: figura.segmento("CH1"))'
        # Los extremos de las rectas largas de la construcción.
        Kmas: 'desplaza(Kp, dx: mm(3))'
        Lder: 'desplaza(proy_planta(rama(Gab, 1)), dy: mm(3))'
        LD: 'desplaza(proy_planta(rama(Dab, 1)), dy: mm(3))'
        LG: 'desplaza(proy_planta(rama(Dab, 1)), dx: mm(-3))'
      comprueba:
        # D está en el plano de C, H y G, y la cara α, en el de A, B y C (D),
        # como la β (F): la pieza es de caras planas.
        - en_plano(D, cara)
        - en_plano(D, alfa)
        - en_plano(F, beta)
    pasos:
      - tipo: reconocer
        pregunta: El apartado c) pide «el ángulo formado por las caras α y β». ¿Qué ángulo es?
        opciones:
          - texto: El que forman los planos de las dos caras, el menor de los dos, entre 0 y 90°
            mensaje: |
              Ese es el ángulo entre dos planos, y aquí no se pide el de dos planos sino el de dos caras
              de una pieza: el que abarcan por donde está la pieza. Con la arista AB de punta se ven los
              dos, que suman 180°; el menor es 86,2°, por fuera de la pieza.
          - texto: El que abarcan las dos caras por dentro de la pieza, aunque pase de 90°
            correcta: true
            mensaje: |
              Eso es. Es el diedro de las caras: el que mediría un transportador apoyado en la pieza en
              ángulo recto con la arista AB, por dentro. Aquí pasa de 90°, y su suplementario, el menor
              de los dos que forman los planos, es otro número.
          - texto: El que forman α₁ y β₁ en la planta, que es donde las dos caras se ven enteras y sin solaparse
            mensaje: |
              La planta enseña de verdad el ángulo de las aristas de la base, AC y AE, que son
              horizontales: 90°. Las caras están inclinadas, y su ángulo se mide en un plano
              perpendicular a la arista común AB, con AB de punta.

      # Decisión: un solo paso construir, el del apartado a). La pendiente se
      # lee en su triángulo del radio, y el diedro, en el calcular.
      - tipo: construir
        titulo: La cara CDGH abatida sobre el plano de la base
        intro: |
          Abate la cara CDGH sobre el plano horizontal de la base, con la charnela CH: C y H están en
          ella y no se mueven. GH es perpendicular a CH, así que G gira por la prolongación de G₁H₁. Su
          radio sale de un triángulo rectángulo: arma en G₁, sobre la prolongación de D₁G₁, que es la
          paralela a la charnela, lo que G está más alto que H, G₂H₂; ese punto es K, y H₁K es el radio.
          Con centro en H₁, G₀; D₀, en la perpendicular a la charnela por D₁ y a la altura de G₀,
          porque DG es paralela a CH. C₁H₁G₀D₀ es la verdadera magnitud. Abate hacia el lado que
          quieras; aquí, hacia abajo, fuera de la planta (hacia arriba, G₀ y D₀ caen sobre la planta,
          a 4,6 mm de un vértice cada uno: amplía con la lupa, ×4). Marca K, G₀ y D₀.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: K
            pide: el punto del triángulo del radio, a lo que G sube sobre H desde G₁
            es: solucion.Ks
            bien: |
              K está en la prolongación de D₁G₁, a 45,0 mm de G₁: lo que G está más alto que H. El
              triángulo H₁G₁K es rectángulo en G₁, y su hipotenusa H₁K, 46,6 mm, es la distancia real
              de G a la charnela. A la izquierda de G₁ también valdría.
            diagnosticos:
              - si: cerca_de(solucion.K_planta)
                mensaje: |
                  Has llevado G₁H₁, lo que G₁ dista de la charnela **en la planta**: ese es el otro cateto,
                  que ya está dibujado. Sobre la paralela a la charnela va lo que G está **más alto** que
                  H, G₂H₂ en el alzado.
                ejemplo: uno(solucion.K_planta, 1)
              - si: '!en_recta(figura.segmento("DG1"))'
                mensaje: |
                  K va en la **paralela a la charnela por G₁**, que es la prolongación de D₁G₁: el
                  triángulo es rectángulo en G₁.
                ejemplo: 'desplaza(solucion.Kp, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de D₁G₁, pero no a la distancia buena: con el compás, G₂H₂, la
                  altura de la pieza, y centro en G₁.
          - nombre: G0
            pide: el vértice G abatido
            es: proy_planta(solucion.Gab)
            bien: |
              G₀ está en la prolongación de G₁H₁, a H₁K de H₁, 46,6 mm: G gira alrededor de la
              charnela, por un plano perpendicular a ella, hasta el plano de la base.
            diagnosticos:
              - si: cerca_de(solucion.G0_cota)
                mensaje: |
                  Has abatido G con lo que sube sobre H, 45,0 mm: es solo un cateto. El radio es la
                  hipotenusa, H₁K, que tiene por otro cateto lo que G₁ dista de la charnela en la planta.
                ejemplo: uno(solucion.G0_cota, 1)
              - si: cerca_de(solucion.G0_planta)
                mensaje: |
                  Has llevado al otro lado de H₁ lo que G₁ dista de la charnela **en la planta**. La cara
                  está inclinada y la planta la acorta: el radio es H₁K, la distancia real.
                ejemplo: solucion.G0_planta
              - si: '!en_recta(figura.segmento("der1"))'
                mensaje: |
                  G gira en un plano perpendicular a la charnela, que en la planta es la **prolongación de
                  G₁H₁**: GH es perpendicular a CH.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Gab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de G₁H₁, pero no a la distancia buena: con centro en H₁ y radio
                  H₁K, el arco que sale de K la corta en G₀.
          - nombre: D0
            pide: el vértice D abatido
            es: proy_planta(solucion.Dab)
            bien: |
              D₀ está en la perpendicular a la charnela por D₁ y a la altura de G₀: D₀G₀ es paralela a
              C₁H₁. C₁H₁G₀D₀ es la cara CDGH en verdadera magnitud, un trapecio rectángulo.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.Dab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela. La cara gira entera, como una tapa
                  sobre su bisagra: D₀ cae del mismo lado que G₀.
                ejemplo: proy_planta(rama(solucion.Dab, 2))
              - si: cerca_de(solucion.D0_cota)
                mensaje: |
                  Has abatido D con lo que sube sobre la base, 45,0 mm, que es un cateto. D está a la
                  misma distancia de la charnela que G: D₀ va a la altura de G₀.
                ejemplo: uno(solucion.D0_cota, 1)
              - si: '!en_recta(solucion.perpD1)'
                mensaje: |
                  D gira en un plano perpendicular a la charnela: D₀ está en la **perpendicular a C₁H₁ por
                  D₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Dab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  D₀ está donde la paralela a la charnela por G₀ corta la perpendicular a la charnela por
                  D₁.
        trazado:
          - segmento2(figura.punto("G1"), solucion.Kp)
          - segmento2(figura.punto("H1"), solucion.Kp)
          - segmento2(figura.punto("H1"), proy_planta(solucion.Gab))
          - segmento2(proy_planta(solucion.Gab), proy_planta(solucion.Dab))
          - segmento2(figura.punto("C1"), proy_planta(solucion.Dab))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("G1"), solucion.Kmas)
            porque: |
              En la planta, D₁G₁ prolongada con la regla hacia la derecha, larga: DG es paralela a la
              charnela CH, y esta recta es la paralela a la charnela por G₁, donde se arma el triángulo
              del radio.
          - con: compas
            traza: 'arco(figura.punto("G1"), por: solucion.Kp, desde: desplaza(solucion.Kp, dy: -6), hasta: desplaza(solucion.Kp, dy: 6))'
            toma: segmento2(figura.punto("G2"), figura.punto("H2"))
            porque: |
              Con el compás, en el alzado, lo que G está más alto que H: G₂H₂, la altura de la pieza,
              45,0 mm. Con centro en G₁, sobre la paralela, hacia la derecha.
          - con: marca
            traza: solucion.Kp
            rotulo: K
            porque: |
              K, nombre nuestro, donde el arco corta la paralela por G₁: G₁K es lo que G está más alto
              que la charnela.
          - con: regla
            traza: segmento2(figura.punto("H1"), solucion.Kp)
            porque: |
              H₁K, la hipotenusa del triángulo rectángulo H₁G₁K: la distancia real de G a la charnela,
              46,6 mm, que es el radio con que G se abate. El ángulo del triángulo en H₁ es la pendiente
              de la cara: GH es su línea de máxima pendiente.
          - con: regla
            traza: segmento2(figura.punto("H1"), solucion.Lder)
            porque: |
              G₁H₁ prolongada con la regla hacia abajo, larga: es la perpendicular a la charnela por G₁,
              y por ella se mueve G al abatirse.
          - con: compas
            traza: 'arco(figura.punto("H1"), por: solucion.Kp, desde: solucion.Kp, hasta: desplaza(proy_planta(rama(solucion.Gab, 1)), dx: -6))'
            porque: |
              Con centro en H₁ y radio H₁K, el arco desde K hasta pasar la prolongación de G₁H₁: G gira
              alrededor de la charnela y cae al plano de la base. Hacia arriba, sobre la planta, también
              valdría; aquí, hacia abajo, donde hay sitio.
          - con: marca
            traza: proy_planta(solucion.Gab)
            rotulo: G₀
            porque: |
              G₀, donde el arco corta la prolongación de G₁H₁: G abatido, a 46,6 mm de H₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D1"), solucion.LD)
            guia: figura.segmento("CH1")
            porque: |
              Por D₁, la perpendicular a la charnela, hacia abajo y larga: D se abate como G, por un
              plano perpendicular a CH. Cruza C₁H₁ en el pie de D.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Gab), solucion.LG)
            guia: figura.segmento("CH1")
            porque: |
              Por G₀, la paralela a la charnela hacia la izquierda: DG es paralela a CH, y abatida lo
              sigue siendo, a la misma distancia.
          - con: marca
            traza: proy_planta(solucion.Dab)
            rotulo: D₀
            porque: |
              D₀, donde la paralela por G₀ corta la perpendicular a la charnela por D₁: D abatido.
          - con: regla
            traza: segmento2(figura.punto("C1"), proy_planta(solucion.Dab))
            porque: |
              C₁D₀, el lado CD abatido: C está en la charnela y no se mueve. C₁H₁G₀D₀ es la cara CDGH en
              verdadera magnitud, un trapecio rectángulo en H₁ y en G₀: CH mide 35,0 mm, DG 30,0, GH 46,6
              y CD 46,8.
          - con: transportador
            traza: 'arco(figura.punto("H1"), por: figura.punto("G1"), desde: figura.punto("G1"), hasta: solucion.Kp)'
            porque: |
              El transportador con el centro en H₁, de H₁G₁ a H₁K: 75,1°, la pendiente de la cara, el
              ángulo de su línea de máxima pendiente GH con el plano horizontal.
        pista: |
          (1) En G₁, sobre la prolongación de D₁G₁, G₂H₂ con el compás: K. (2) H₁K es el radio. (3) Con
          centro en H₁, a la prolongación de G₁H₁: G₀. (4) Por D₁, la perpendicular a C₁H₁; por G₀, la
          paralela: D₀. (5) C₁H₁G₀D₀ es la cara de verdad.
        desarrollo: |
          En verde claro, el triángulo del radio, H₁G₁K, y la cara abatida C₁H₁G₀D₀: CH = 35,0 mm, DG =
          30,0 mm, GH = 46,6 mm y CD = 46,8 mm, con ángulos rectos en H₁ y en G₀. El ángulo del
          triángulo en H₁ es la pendiente de la cara.

      - tipo: calcular
        titulo: La pendiente de la cara CDGH
        pregunta: ¿Cuántos grados mide la pendiente de la cara CDGH, su ángulo con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '75.09'
          receta: pendiente_cara
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '14.91'
            receta: 90 - pendiente_cara
            mensaje: |
              Ese es el **complementario**: el ángulo de la cara con la vertical, el de K en el triángulo
              H₁G₁K. La pendiente está en H₁, entre H₁G₁, la planta de GH, y H₁K, GH de verdad.
          - valor: '73.91'
            receta: angulo_con_ph(segmento3(C, D))
            mensaje: |
              Es el ángulo de la arista **CD** con el plano horizontal. CD no es perpendicular a CH, así
              que no es una recta de máxima pendiente, y sube menos que la cara. La de máxima pendiente
              es GH, perpendicular a las horizontales CH y DG.
          - valor: '83.67'
            receta: angulo_con_ph(segmento3(C, Df))
            mensaje: |
              Es lo que C₂D₂ forma con la horizontal **en el alzado**. CD no es frontal y el alzado
              deforma su ángulo; y tampoco es la recta de máxima pendiente. La pendiente sale del
              triángulo de GH.
          - valor: '375.62'
            receta: pendiente(H, G) * 100
            mensaje: |
              Esa es la pendiente **en tanto por ciento**: lo que sube por cada cien que avanza, 45,0
              entre 12,0 por cien. Se pide en grados: el ángulo cuya tangente es 3,756.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en H₁, entre H₁G₁ y H₁K. GH es
          perpendicular a las horizontales de la cara, CH y DG.
        desarrollo: |
          GH es la recta de máxima pendiente de la cara. Sube 45,00 mm, G₂H₂, y avanza en la planta
          11,98 mm, G₁H₁:

          $$ \operatorname{tg} i = \frac{45{,}00}{11{,}98} \approx 3{,}756, \qquad i \approx 75{,}09^{\circ} $$

          Por la normal de la cara sale lo mismo. Las caras α y β son casi igual de empinadas, 75,0°.

      - tipo: calcular
        titulo: El ángulo de las caras α y β
        pregunta: ¿Cuántos grados forman las caras α y β, por dentro de la pieza?
        respuesta:
          tipo: numero
          valor: '93.78'
          receta: diedro
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '86.22'
            receta: entre_planos
            mensaje: |
              Ese es el **suplementario**, el ángulo entre los planos de las dos caras, el menor de los
              dos que forman: el que queda por fuera de la pieza. Se pide el de las caras, el que
              abarcan por dentro, y pasa de 90°.
          - valor: '89.96'
            receta: angulo_rectas(recta3(A, C), recta3(A, E))
            mensaje: |
              Es el ángulo de las aristas de la base, AC y AE, que en la planta se ve de verdad porque son
              horizontales: es el de α₁ y β₁. Las caras están inclinadas; su ángulo se mide en un plano
              perpendicular a la arista AB, con AB de punta.
          - valor: '46.91'
            receta: angulo_planos(alfa, simetria)
            mensaje: |
              Es lo que forma **una sola cara** con el plano de simetría de la pieza, el frontal de AB.
              Con AB de punta por un cambio de plano horizontal, ese plano se ve como la recta por A₄
              paralela a la línea nueva (la propia línea nueva, si la referencia es A): has medido
              entre el canto de una cara y esa recta. El de las caras es el que forman los dos cantos,
              el doble.
        pista: |
          AB es frontal: A₁B₁ es horizontal en el papel. Un cambio de plano horizontal con la línea
          nueva perpendicular a A₂B₂ pone AB de punta, y las dos caras se ven de canto: mide entre los
          dos cantos, por el lado de la pieza.
        desarrollo: |
          AB es frontal, y A₂B₂ su verdadera magnitud, 48,1 mm. Con un cambio de plano horizontal, la
          línea nueva perpendicular a A₂B₂ y la referencia en A, la arista queda de punta, A₄ ≡ B₄,
          sobre la línea nueva, y α y β se ven como dos rectas, A₄C₄ y A₄E₄, simétricas respecto de
          ella. Por el otro camino, con u y v, las perpendiculares a AB desde C y desde E, de 36,98 y
          36,95 mm:

          $$ \cos\theta = \frac{\vec u \cdot \vec v}{|\vec u|\,|\vec v|} = \frac{-90{,}13}{36{,}98 \cdot 36{,}95} \approx -0{,}0660, \qquad \theta \approx 93{,}78^{\circ} $$

          Con D y F en vez de C y E sale 93,9°: la diferencia es el redondeo de la lámina, y la
          casilla da por buenos los dos. Los planos de las caras forman 86,2°, su suplementario.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: CH y DG son horizontales y frontales a la vez, así que la cara CDGH se abate alrededor de CH sobre el plano de la base, y C y H no se mueven.
          - texto: GH es perpendicular a CH; G₁H₁ y lo que G sube, G₂H₂, son los catetos de un triángulo cuyo ángulo en H₁ es la pendiente de la cara, 75,1°, y cuya hipotenusa es el radio de G.
          - texto: G₀ cae en la prolongación de G₁H₁, a ese radio de H₁, y D₀ en la perpendicular a CH por D₁, a la altura de G₀; C₁H₁G₀D₀ es la cara en verdadera magnitud.
          - texto: Con la arista AB de punta, α y β se ven de canto, y el ángulo que abarcan por dentro de la pieza, 93,8°, es el que forman las caras.
          - texto: El ángulo de las caras α y β es el de α₁ y β₁ en la planta, 90°, porque las dos caras salen de A en ángulo recto.
            trampa: true
            mensaje: |
              La planta enseña de verdad el ángulo de las aristas de la base, que son horizontales, pero
              no el de las caras, que están inclinadas: ese se mide perpendicular a la arista AB, y es
              93,8°.
    resolucion: |
      **La cara CDGH.** CH y DG son horizontales y frontales a la vez, y GH les es perpendicular: es la
      recta de máxima pendiente de la cara. Se abate la cara sobre el plano de la base con la charnela
      CH. El radio de G es la hipotenusa del triángulo de catetos G₁H₁, 12,0 mm, y lo que G sube sobre
      H, G₂H₂, 45,0 mm: 46,6 mm. G₀ cae en la prolongación de G₁H₁, y D₀ en la perpendicular a C₁H₁
      por D₁, a la altura de G₀. C₁H₁G₀D₀ es un trapecio rectángulo con CH = 35,0 mm, DG = 30,0 mm,
      GH = 46,6 mm y CD = 46,8 mm.

      **La pendiente.** El ángulo de ese triángulo en H₁: tg i = 45,00/11,98, i = 75,1°. No es la de
      la arista CD, 73,9°, que no es de máxima pendiente.

      **El ángulo de α y β.** La arista común AB es frontal, y un solo cambio de plano horizontal, con
      la línea nueva perpendicular a A₂B₂, la pone de punta: α y β se ven de canto, y por dentro de la
      pieza forman 93,8°. Los planos de las caras forman 86,2°, el suplementario; se pide el de las
      caras, que pasa de 90°. En la planta, α₁ y β₁ salen de A₁ en ángulo recto, que es el de las
      aristas de la base, no el de las caras.

  - id: sd61-el-tripode-del-tren-de-aterrizaje
    titulo: El trípode del tren de aterrizaje, el brazo AB y el ángulo de AD y AC
    fuente: Ejercicio 45 (SD61) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 46).
    # Los métodos no los impone: AB, con su triángulo rectángulo levantado en
    # B₁; el ángulo de AD y AC, abatiendo el plano ACD con la charnela CD. Un
    # paso construir para cada construcción y un calcular para cada cifra.
    enunciado: |
      Dadas las vistas del trípode de un tren de aterrizaje, se pide:

      a) Determinar gráficamente la longitud del brazo AB y el ángulo que forma con el plano horizontal.

      b) Determinar gráficamente el ángulo que forman los brazos AD y AC.

      **Notas nuestras.** La figura es el tren en alzado, arriba, y en planta, debajo: la rueda, en
      un eje de punta que sale de A (en el alzado, su centro cae en A₂), y tres brazos que van de A
      a B, C y D, los tres a la misma altura, donde el tren se fija al avión. La rueda es adorno.
      A₁D₁ es horizontal en el papel: AD es frontal. La lámina no da escala, y las longitudes se dan
      en milímetros de la lámina. Construimos AB con su triángulo rectángulo levantado en B₁, y el
      ángulo de AD y AC abatiendo el plano ACD alrededor de CD, que es una horizontal del plano
      porque C y D están a la misma cota. B₀, M, K y A₀ son nombres nuestros.
    pide: La longitud real del brazo AB, en mm, y su ángulo con el plano horizontal, y el ángulo de los brazos AD y AC, en grados, con las dos construcciones que los dan.
    receta:
      lamina: sd61
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        acd: plano(A, C, D)
      solucion:
        # AB: B abatido sobre la planta con el plano vertical de AB, a lo que
        # B sube sobre A de B₁, en la perpendicular a A₁B₁. Los dos lados valen
        # (una lista); la construcción va hacia abajo a la izquierda (el 1).
        Bab_s: abatido_planta(A, B)
        Bab1: uno(Bab_s, 1)
        sube: diferencia_de_cotas(A, B)
        perpB1: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("AB1"))'
        # La horizontal de B₂, C₂ y D₂, y el punto de ella en la vertical de
        # A₂: A₂Ah2 es lo que B, C y D están más altos que A.
        Ah2: 'pie_perpendicular(figura.punto("A2"), segmento2(figura.punto("D2"), figura.punto("B2")))'
        # Decisión: AD y AC, abatiendo el plano ACD sobre el plano horizontal
        # de C y D con la charnela CD. A abatido es una elección; la
        # construcción va al lado contrario de A₁ (rama 1), porque al otro A₀
        # cae encima del neumático de la planta.
        ch: recta3(D, C)
        Mch: pie_perpendicular(A, ch)
        Aab: abatido_a_elegir(A, ch, acd)
        perpA1: 'perpendicular(por: figura.punto("A1"), a: segmento2(figura.punto("D1"), figura.punto("C1")))'
        paraA1: 'perpendicular(por: figura.punto("A1"), a: perpA1)'
        Kc: 'uno(medir_sobre(paraA1, desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, C)), 2)'
        # Las cifras.
        AB_mm: en_mm(vm(A, B))
        angAB: angulo_con_ph(segmento3(A, B))
        angDAC: angulo_rectas(recta3(A, D), recta3(A, C))
        # Para los distractores: B, C y D llevados a la cota de A (lo que se
        # ve en la planta) o al plano frontal de A (lo que se ve en el alzado),
        # y el triángulo abatido con el radio mal, igual a la cota.
        horA2: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dx: 10))'
        Bf: 'punto3(alzado: figura.punto("B2"), planta: pie_perpendicular(figura.punto("B1"), figura.segmento("AD1")))'
        Ch: 'punto3(alzado: pie_perpendicular(figura.punto("C1"), horA2), planta: figura.punto("C1"))'
        Dh: 'punto3(alzado: pie_perpendicular(figura.punto("D1"), horA2), planta: figura.punto("D1"))'
        Cf: 'punto3(alzado: figura.punto("C2"), planta: pie_perpendicular(figura.punto("C2"), figura.segmento("AD1")))'
        A0x2: 'uno(medir_sobre(perpA1, desde: proy_planta(Mch), distancia: diferencia_de_cotas(A, C)), 1)'
        A0x: 'punto3(alzado: pie_perpendicular(A0x2, segmento2(figura.punto("D2"), figura.punto("B2"))), planta: A0x2)'
        # Los errores de las construcciones: B₀ con la diferencia de
        # alejamientos, A abatido en A₁ en vez de B en B₁, y A₀ con el radio
        # igual a la cota o a lo que dista en la planta.
        B0_dy: 'medir_sobre(perpB1, desde: figura.punto("B1"), distancia: raiz(vm(A, B) * vm(A, B) - vm_alzado(A, B) * vm_alzado(A, B)))'
        A0_enA1: 'medir_sobre(perpendicular(por: figura.punto("A1"), a: figura.segmento("AB1")), desde: figura.punto("A1"), distancia: sube)'
        A0_cota: 'medir_sobre(perpA1, desde: proy_planta(Mch), distancia: diferencia_de_cotas(A, C))'
        A0_planta: 'uno(medir_sobre(perpA1, desde: proy_planta(Mch), distancia: vm_planta(A, Mch)), 1)'
        # Los extremos de las rectas largas de la construcción.
        LvA2: 'desplaza(Ah2, dy: mm(-2))'
        LB0: 'uno(medir_sobre(perpB1, desde: Bab1, distancia: mm(3)), 1)'
        LA0: 'uno(medir_sobre(perpA1, desde: proy_planta(rama(Aab, 1)), distancia: mm(3)), 1)'
        LK: 'uno(medir_sobre(paraA1, desde: Kc, distancia: mm(3)), 2)'
        # El plano horizontal de C, para comprobar que B y D están a su cota.
        Cx: 'punto3(alzado: desplaza(figura.punto("C2"), dx: 10), planta: desplaza(figura.punto("C1"), dx: 10))'
        Cy: 'punto3(alzado: figura.punto("C2"), planta: desplaza(figura.punto("C1"), dy: 10))'
        horC: plano(C, Cx, Cy)
      comprueba:
        # B, C y D están a la misma cota: CD es una horizontal del plano ACD,
        # y M, el pie de A, está en la charnela y en el plano.
        - en_plano(B, horC)
        - en_plano(D, horC)
        - en_plano(Mch, acd)
    pasos:
      - tipo: reconocer
        pregunta: El brazo AB no es horizontal ni frontal. ¿Qué construcción da a la vez su longitud y su ángulo con el plano horizontal?
        opciones:
          - texto: A₂B₂ y el ángulo que forma con la horizontal, los dos en el alzado
            mensaje: |
              AB no es frontal —A₁B₁ no es horizontal en el papel—, así que el alzado lo acorta y
              deforma su ángulo: A₂B₂ mide 35,3 mm y forma 55,7° con la horizontal, y AB mide 37,0 mm y
              forma 52,0° con el plano horizontal.
          - texto: El triángulo de catetos A₂B₂ y la diferencia de alejamientos, con la hipotenusa y el ángulo en A₂
            mensaje: |
              Su hipotenusa sí es AB de verdad, pero su ángulo en A₂ es el de AB con el plano
              **vertical**, 17,6°: ese triángulo abate el plano de canto de AB sobre el alzado. El ángulo
              con el horizontal sale del triángulo de la planta.
          - texto: El triángulo rectángulo de catetos A₁B₁ y lo que B está más alto que A, con la hipotenusa y el ángulo en A₁
            correcta: true
            mensaje: |
              Eso es. Es el plano vertical que contiene a AB, abatido sobre la planta: A₁B₁ es lo que AB
              avanza en horizontal y la diferencia de cotas, lo que sube. El ángulo con el plano
              horizontal es el de AB con su planta, en A₁.

      - tipo: construir
        titulo: El brazo AB en verdadera magnitud
        intro: |
          En B₁, la perpendicular a A₁B₁, y sobre ella lo que B está más alto que A: en el alzado, de
          A₂ a la horizontal de B₂, que pasa también por C₂ y D₂. Ese punto es B₀, B abatido sobre la
          planta con el plano vertical de AB. A₁B₀ es AB de verdad, y el ángulo en A₁, entre A₁B₁ y
          A₁B₀, el de AB con el plano horizontal. Hacia cualquiera de los dos lados de B₁ vale; aquí,
          hacia abajo a la izquierda. Marca B₀.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: B0
            pide: el extremo B del brazo, abatido sobre la planta
            es: solucion.Bab_s
            bien: |
              B₀ está en la perpendicular a A₁B₁ por B₁, a 29,2 mm de B₁: lo que B está más alto que A.
              A₁B₀ mide 37,0 mm, la longitud del brazo, y forma con A₁B₁ 52,0°, su ángulo con el plano
              horizontal.
            diagnosticos:
              - si: cerca_de(solucion.B0_dy)
                mensaje: |
                  Has llevado lo que B está **más lejos** que A, la diferencia de alejamientos. Sobre la
                  planta se lleva lo que **sube**: de A₂ a la horizontal de B₂, en el alzado.
                ejemplo: uno(solucion.B0_dy, 1)
              - si: cerca_de(solucion.A0_enA1)
                mensaje: |
                  Has levantado la diferencia de cotas en A₁, no en B₁. Ese triángulo también da la
                  longitud, pero aquí se pide B abatido: la perpendicular a A₁B₁ va por B₁.
                ejemplo: uno(solucion.A0_enA1, 1)
              - si: '!en_recta(solucion.perpB1)'
                mensaje: |
                  B₀ va en la **perpendicular a A₁B₁ por B₁**: el plano vertical de AB gira alrededor de
                  A₁B₁ hasta la planta, y B se mueve perpendicular a ella.
                ejemplo: 'desplaza(solucion.Bab1, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por B₁, pero no a la distancia buena: con el compás, de A₂ a la
                  horizontal de B₂, y centro en B₁.
        trazado:
          - segmento2(figura.punto("B1"), solucion.Bab1)
          - segmento2(figura.punto("A1"), solucion.Bab1)
        construccion:
          - con: regla
            traza: segmento2(figura.punto("D2"), figura.punto("B2"))
            porque: |
              En el alzado, la recta de D₂ a B₂, que pasa por C₂: los tres extremos están a la misma
              altura, y es la horizontal de las fijaciones al avión.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.LvA2)
            porque: |
              Por A₂, la vertical hacia arriba, hasta pasar la horizontal de B₂: el trozo entre A₂ y esa
              horizontal es lo que B, C y D están más altos que A, 29,2 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.LB0)
            guia: figura.segmento("AB1")
            porque: |
              En la planta, por B₁, la perpendicular a A₁B₁, hacia abajo a la izquierda y larga: el
              plano vertical de AB se abate sobre la planta girando alrededor de A₁B₁, y B se mueve por
              esta recta.
          - con: compas
            traza: 'arco(figura.punto("B1"), por: solucion.Bab1, desde: desplaza(solucion.Bab1, dx: 5.2, dy: 2.9), hasta: desplaza(solucion.Bab1, dx: -5.2, dy: -2.9))'
            toma: segmento2(figura.punto("A2"), solucion.Ah2)
            porque: |
              Con el compás, en el alzado, lo que B está más alto que A: de A₂ a la horizontal de B₂.
              Con centro en B₁, sobre la perpendicular.
          - con: marca
            traza: solucion.Bab1
            rotulo: B₀
            porque: |
              B₀, donde el arco corta la perpendicular por B₁: B abatido, nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("A1"), solucion.Bab1)
            porque: |
              A₁B₀, la hipotenusa del triángulo rectángulo A₁B₁B₀: el brazo AB en verdadera magnitud,
              37,0 mm.
          - con: transportador
            traza: 'arco(figura.punto("A1"), por: figura.punto("B1"), desde: figura.punto("B1"), hasta: solucion.Bab1)'
            porque: |
              El transportador con el centro en A₁, de A₁B₁ a A₁B₀: 52,0°, el ángulo de AB con su
              planta, que es el que forma con el plano horizontal.
        pista: |
          (1) La horizontal de B₂, C₂ y D₂, y la vertical de A₂ hasta ella: lo que B sube sobre A. (2)
          En B₁, la perpendicular a A₁B₁, y sobre ella esa altura: B₀. (3) A₁B₀ es AB, y el ángulo en
          A₁, el del plano horizontal.
        desarrollo: |
          En verde claro, el triángulo A₁B₁B₀, rectángulo en B₁: A₁B₁ = 22,8 mm, B₁B₀ = 29,2 mm y A₁B₀
          = 37,0 mm, la longitud del brazo. Su ángulo en A₁ es el de AB con el plano horizontal.

      - tipo: construir
        titulo: El ángulo de AD y AC, abatiendo su plano
        intro: |
          C y D están a la misma cota, así que CD es una horizontal del plano ACD: es la charnela, y C
          y D no se mueven. Abate A: en la planta, la perpendicular a C₁D₁ por A₁ corta la charnela en
          M, el pie de A. El radio es la hipotenusa del triángulo de catetos MA₁ y lo que C y D están
          más altos que A: arma en A₁, sobre la paralela a la charnela, esa altura, K, y MK es el
          radio. Con centro en M, A₀ en la perpendicular. El ángulo D₁A₀C₁ es el de AD y AC. Abate
          hacia el lado contrario de A₁: hacia A₁ también vale, pero A₀ cae encima del neumático,
          entre sus rayas (si vas por ahí, amplía con la lupa, ×4).
          Marca M y A₀.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M
            pide: el pie de A en la charnela CD, en la planta
            es: proy_planta(solucion.Mch)
            bien: |
              M está en C₁D₁, al pie de la perpendicular por A₁: CD es horizontal, y la perpendicular a
              ella se ve perpendicular en la planta. A gira alrededor de CD con centro en M.
            diagnosticos:
              - si: '!en_recta(segmento2(figura.punto("D1"), figura.punto("C1")))'
                mensaje: |
                  M está **en la charnela**, la recta C₁D₁: es el centro del giro de A.
                ejemplo: 'desplaza(proy_planta(solucion.Mch), dx: mm(4), dy: mm(-3))'
              - si: '!en_recta(solucion.perpA1)'
                mensaje: |
                  M es el pie de la **perpendicular a C₁D₁ por A₁**: A gira en un plano perpendicular a
                  la charnela.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("D1"), figura.punto("C1")), desde: proy_planta(solucion.Mch), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  M está donde la perpendicular a C₁D₁ por A₁ corta C₁D₁.
          - nombre: A0
            pide: el vértice A abatido
            es: proy_planta(solucion.Aab)
            bien: |
              A₀ está en la perpendicular a la charnela por A₁, a 37,4 mm de M: la distancia real de A a
              CD. El ángulo D₁A₀C₁ es el de AD y AC, 39,4°.
            diagnosticos:
              - si: cerca_de(solucion.A0_cota)
                mensaje: |
                  Has abatido A con lo que C y D están más altos que A, 29,2 mm: es solo un cateto. El
                  radio es la hipotenusa MK, que tiene por otro cateto lo que A₁ dista de la charnela en
                  la planta, MA₁.
                ejemplo: uno(solucion.A0_cota, 1)
              - si: cerca_de(solucion.A0_planta)
                mensaje: |
                  Has llevado al otro lado de M lo que A₁ dista de la charnela **en la planta**, MA₁. A
                  está más bajo que la charnela, y la distancia real es la hipotenusa MK.
                ejemplo: solucion.A0_planta
              - si: '!en_recta(solucion.perpA1)'
                mensaje: |
                  A gira en un plano perpendicular a la charnela: A₀ está en la **perpendicular a C₁D₁
                  por A₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Aab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por A₁, pero no a la distancia buena: con centro en M y radio
                  MK, el arco que sale de K la corta en A₀.
        trazado:
          - segmento2(figura.punto("D1"), figura.punto("C1"))
          - segmento2(figura.punto("A1"), proy_planta(solucion.Aab))
          - segmento2(proy_planta(solucion.Aab), figura.punto("D1"))
          - segmento2(proy_planta(solucion.Aab), figura.punto("C1"))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("D1"), figura.punto("C1"))
            porque: |
              En la planta, C₁D₁ con la regla: la charnela. C y D están a la misma altura en el alzado,
              y CD es una horizontal del plano ACD.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.LA0)
            guia: segmento2(figura.punto("D1"), figura.punto("C1"))
            porque: |
              Por A₁, la perpendicular a la charnela, larga, más allá de C₁D₁ y hacia abajo a la
              izquierda: A gira alrededor de CD en un plano perpendicular a ella, y en la planta se
              mueve por esta recta.
          - con: marca
            traza: proy_planta(solucion.Mch)
            rotulo: M
            porque: |
              M, nombre nuestro, donde la perpendicular por A₁ corta la charnela: el pie de A, centro de
              su giro.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A1"), solucion.LK)
            guia: segmento2(figura.punto("D1"), figura.punto("C1"))
            porque: |
              Por A₁, la paralela a la charnela, hacia abajo a la derecha: en ella se arma el triángulo
              del radio, rectángulo en A₁.
          - con: regla
            traza: segmento2(figura.punto("D2"), figura.punto("B2"))
            porque: |
              En el alzado, la recta de D₂ a B₂, que pasa por C₂: la horizontal de los tres extremos.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.LvA2)
            porque: |
              Por A₂, la vertical hasta pasar esa horizontal: el trozo entre las dos es lo que C y D
              están más altos que A, 29,2 mm.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.Kc, desde: desplaza(solucion.Kc, dx: 4.8, dy: -3.6), hasta: desplaza(solucion.Kc, dx: -4.8, dy: 3.6))'
            toma: segmento2(figura.punto("A2"), solucion.Ah2)
            porque: |
              Con el compás, esa altura, y centro en A₁: el arco corta la paralela a la charnela.
          - con: marca
            traza: solucion.Kc
            rotulo: K
            porque: |
              K, nombre nuestro, donde el arco corta la paralela por A₁: A₁K es lo que A está más bajo
              que la charnela.
          - con: regla
            traza: segmento2(proy_planta(solucion.Mch), solucion.Kc)
            porque: |
              MK, la hipotenusa del triángulo rectángulo M A₁ K: la distancia real de A a la charnela,
              37,4 mm, que es el radio con que A se abate.
          - con: compas
            traza: 'arco(proy_planta(solucion.Mch), por: solucion.Kc, desde: solucion.Kc, hasta: desplaza(proy_planta(rama(solucion.Aab, 1)), dx: -3.6, dy: -4.8))'
            porque: |
              Con centro en M y radio MK, el arco desde K, por debajo de M, hasta pasar la perpendicular
              al otro lado de la charnela: A gira alrededor de CD y cae al plano horizontal de C y D.
          - con: marca
            traza: proy_planta(solucion.Aab)
            rotulo: A₀
            porque: |
              A₀, donde el arco corta la perpendicular por A₁, al otro lado de la charnela: A abatido, a
              37,4 mm de M.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.Aab, 1)), figura.punto("D1")), segmento2(proy_planta(rama(solucion.Aab, 1)), figura.punto("C1"))]'
            porque: |
              A₀D₁ y A₀C₁: los brazos AD y AC abatidos. D y C están en la charnela y no se mueven; el
              triángulo A₀D₁C₁ es ACD en verdadera magnitud.
          - con: transportador
            traza: 'arco(proy_planta(solucion.Aab), por: figura.punto("D1"), desde: figura.punto("D1"), hasta: figura.punto("C1"))'
            porque: |
              El transportador con el centro en A₀, de A₀D₁ a A₀C₁: 39,4°, el ángulo de los brazos AD y
              AC.
        pista: |
          (1) La charnela C₁D₁, y por A₁ su perpendicular: M. (2) Por A₁, la paralela a la charnela, y
          sobre ella lo que A está más bajo que C y D, de A₂ a la horizontal de C₂ y D₂: K. (3) Con
          centro en M y radio MK, a la perpendicular, al otro lado: A₀. (4) El ángulo en A₀, entre A₀D₁
          y A₀C₁.
        desarrollo: |
          En verde claro, la charnela, el camino de A y el triángulo A₀D₁C₁, que es ACD en verdadera
          magnitud: AD = 41,3 mm, AC = 38,6 mm y CD = 27,1 mm. MA₁ mide 23,4 mm, y la hipotenusa MK, el
          radio, 37,4 mm.

      - tipo: calcular
        titulo: La longitud del brazo AB
        pregunta: ¿Cuánto mide de verdad el brazo AB?
        respuesta:
          tipo: numero
          valor: '37.03'
          receta: AB_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '35.31'
            receta: en_mm(vm_alzado(A, B))
            mensaje: |
              Eso es **A₂B₂, en el alzado**. AB no es frontal —A₁B₁ no es horizontal en el papel—, y el
              alzado lo acorta. Su verdadera magnitud es A₁B₀, la hipotenusa del triángulo.
          - valor: '22.82'
            receta: en_mm(vm_planta(A, B))
            mensaje: |
              Eso es **A₁B₁, en la planta**: lo que el brazo avanza en horizontal. Es un cateto del
              triángulo; la longitud es la hipotenusa.
          - valor: '29.17'
            receta: en_mm(sube)
            mensaje: |
              Eso es lo que B está **más alto** que A, el otro cateto. La longitud del brazo es la
              hipotenusa A₁B₀, con los dos catetos.
        pista: |
          Mide A₁B₀ en el paso anterior, con «medir» del Taller, o en tu lámina: la hipotenusa del
          triángulo A₁B₁B₀.
        desarrollo: |
          Con A₁B₁ = 22,82 mm y la diferencia de cotas, 29,17 mm:

          $$ \overline{AB} = \sqrt{22{,}82^{2} + 29{,}17^{2}} \approx 37{,}03 \text{ mm} $$

          Una casualidad de esta lámina: en la construcción del ángulo de AD y AC, el radio MK, que es
          lo que A dista de la charnela CD, mide 37,39 mm, dentro de la tolerancia de AB. No es el
          brazo, y la casilla no lo distingue.

      - tipo: calcular
        titulo: El ángulo de AB con el plano horizontal
        pregunta: ¿Cuántos grados forma el brazo AB con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '51.96'
          receta: angAB
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '55.70'
            receta: angulo_con_ph(segmento3(A, Bf))
            mensaje: |
              Es lo que forma A₂B₂ con la horizontal **en el alzado**. AB no es frontal, y el alzado
              deforma su ángulo. El de verdad está en A₁, entre A₁B₁ y A₁B₀.
          - valor: '38.04'
            receta: 90 - angAB
            mensaje: |
              Ese es el **complementario**, el ángulo de AB con la vertical, el de B₀ en el triángulo.
              El del plano horizontal está en A₁, entre la hipotenusa y la planta A₁B₁.
          - valor: '17.56'
            receta: angulo_con_pv(segmento3(A, B))
            mensaje: |
              Es el ángulo de AB con el plano **vertical**: sale del triángulo armado sobre A₂B₂ con la
              diferencia de alejamientos. El del horizontal sale del triángulo de la planta, con la
              diferencia de cotas.
        pista: |
          Con el transportador en el paso del brazo AB, o en tu lámina: en A₁, entre A₁B₁ y A₁B₀.
        desarrollo: |
          En el triángulo A₁B₁B₀, rectángulo en B₁:

          $$ \operatorname{tg}\alpha = \frac{29{,}17}{22{,}82} \approx 1{,}278, \qquad \alpha \approx 51{,}96^{\circ} $$

      - tipo: calcular
        titulo: El ángulo de los brazos AD y AC
        pregunta: ¿Cuántos grados forman los brazos AD y AC?
        respuesta:
          tipo: numero
          valor: '39.44'
          receta: angDAC
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '59.05'
            receta: angulo_rectas(recta3(A, Dh), recta3(A, Ch))
            mensaje: |
              Es lo que forman A₁D₁ y A₁C₁ **en la planta**. El plano ACD no es horizontal —A está más
              bajo que C y D—, y la planta deforma su ángulo. Hay que abatirlo.
          - valor: '21.03'
            receta: angulo_rectas(recta3(A, D), recta3(A, Cf))
            mensaje: |
              Es lo que forman A₂D₂ y A₂C₂ **en el alzado**. AD es frontal y se ve de verdad, pero AC
              no, y el plano ACD tampoco: el alzado deforma el ángulo.
          - valor: '49.13'
            receta: angulo_rectas(recta3(A0x, D), recta3(A0x, C))
            mensaje: |
              Has abatido A con un radio igual a lo que C y D están más altos que A, 29,2 mm, que es solo
              un cateto: A₀ cae demasiado cerca de la charnela y el ángulo sale abierto. El radio es la
              hipotenusa MK, 37,4 mm.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en A₀, entre A₀D₁ y A₀C₁.
        desarrollo: |
          En el triángulo ACD, con AD = 41,28 mm, AC = 38,59 mm y CD = 27,07 mm, por el teorema del
          coseno:

          $$ \cos\widehat{A} = \frac{41{,}28^{2} + 38{,}59^{2} - 27{,}07^{2}}{2 \cdot 41{,}28 \cdot 38{,}59} \approx 0{,}7723, \qquad \widehat{A} \approx 39{,}44^{\circ} $$

          Otra casualidad: en la construcción del brazo AB, A₁B₀ y A₁C₁ forman 39,7°, dentro de la
          tolerancia. No es nada del ángulo pedido, que está en A₀, y la casilla no lo distingue.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: AB no es horizontal ni frontal; A₁B₁ y lo que B sube sobre A son los catetos de un triángulo rectángulo cuya hipotenusa es AB y cuyo ángulo en A₁ es el de AB con el plano horizontal.
          - texto: Levantado en B₁, ese triángulo da A₁B₀ = 37,0 mm, y en A₁, 52,0°.
          - texto: C y D están a la misma cota, así que CD es una horizontal del plano ACD y sirve de charnela para abatirlo; C y D no se mueven.
          - texto: A₀ cae en la perpendicular a C₁D₁ por A₁, a la distancia real de A a CD, y el ángulo D₁A₀C₁, 39,4°, es el de AD y AC.
          - texto: El ángulo de AD y AC se mide en el alzado, entre A₂D₂ y A₂C₂, porque AD es frontal.
            trampa: true
            mensaje: |
              AD es frontal, pero AC no, y el plano ACD tampoco: el alzado deforma el ángulo. Ahí se
              ve de 21,0°, y de verdad mide 39,4°.
    resolucion: |
      **El brazo AB.** No es horizontal ni frontal. Su planta, A₁B₁, mide 22,8 mm, y B está 29,2 mm
      más alto que A: de A₂ a la horizontal de B₂, C₂ y D₂, que están a la misma altura. Con esos dos
      catetos, levantado en B₁, el triángulo A₁B₁B₀ da AB = 37,0 mm, la hipotenusa, y en A₁ su ángulo
      con el plano horizontal, 52,0°. En el alzado, A₂B₂ se ve de 35,3 mm y de 55,7°: AB no es
      frontal.

      **El ángulo de AD y AC.** C y D están a la misma cota, así que CD es una horizontal del plano
      ACD: la charnela. La perpendicular a C₁D₁ por A₁ la corta en M. A₁ dista de ella 23,4 mm en la
      planta y A está 29,2 mm más bajo: el radio de A es la hipotenusa, 37,4 mm, y A₀ cae en esa
      perpendicular, al otro lado de la charnela. El triángulo A₀D₁C₁ es ACD de verdad, y en A₀ mide
      39,4°. En la planta el ángulo se ve de 59,1°, y en el alzado de 21,0°.

  - id: sd62-los-angulos-de-la-cabria
    titulo: Los ángulos de la cabria, entre sus patas, entre sus planos y con el plano horizontal
    fuente: Ejercicio 46 (SD62) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 47),
    # con su doble numeración «a) 1 .» y el espacio antes del punto del primer
    # apartado. Los métodos no los impone: AVB, abatiendo su plano con la
    # charnela AB; los planos, con un cambio de plano que pone VB de punta; CV,
    # con su triángulo. Un construir por apartado y un calcular por cifra.
    enunciado: |
      Se presentan la planta y el alzado de una cabria para la elevación de pesos que consta de tres
      patas (VA, VB y VC). Calcular:

      a) 1 . El ángulo AVB existente entre las patas VA y VB.

      b) 2. El ángulo existente entre los planos AVB y CVB formados por las patas.

      c) 3. El ángulo que presentan las patas CV y BV con el plano horizontal.

      **Notas nuestras.** La figura es la cabria en el alzado, arriba, y en la planta, debajo, junto
      al borde de un edificio: la cubierta y la pared, rayadas, son el sitio donde apoyan las patas.
      La perspectiva de la hoja no se reproduce. A, B y C están a la misma altura, la de la cubierta,
      y A₂ ≡ C₂. En la planta, V₁B₁ es horizontal en el papel, así que VB es frontal, y A₁ y C₁
      quedan a los dos lados de V₁B₁, a la misma distancia: la cabria es simétrica respecto del plano
      frontal de VB. La lámina no da escala, y las longitudes se dan en milímetros de la lámina. En
      el apartado b), dos planos que se cortan forman dos ángulos suplementarios, y el enunciado no
      dice cuál quiere. Aquí se da el menor, 67,77°, que es el convenio del ángulo entre dos planos,
      como en el apartado 3 del Ejercicio 53; el que abarcan las dos caras de la cabria, por donde
      están A y C, es su suplementario, 112,23°, y se da como distractor, con un mensaje que
      reconoce la construcción. Los métodos son nuestros:
      el enunciado solo pide calcular. M, K, V₀, N, V′ y la vista 4 son nuestros.
    pide: El ángulo AVB entre las patas VA y VB, el ángulo entre los planos AVB y CVB (el menor de los dos que forman) y los ángulos de las patas CV y BV con el plano horizontal, todos en grados, con las construcciones que los dan.
    receta:
      lamina: sd62
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        # A₂ ≡ C₂: el alzado de C es la misma cruz.
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        avb: plano(A, V, B)
        cvb: plano(C, V, B)
      solucion:
        # a) A y B están a la misma cota: AB es una horizontal del plano AVB y
        # sirve de charnela. V abatido es una elección; la construcción va del
        # lado de V₁ (rama 1).
        ch: recta3(A, B)
        Mv: pie_perpendicular(V, ch)
        Vab: abatido_a_elegir(V, ch, avb)
        A1B1: 'segmento2(figura.punto("A1"), figura.punto("B1"))'
        perpV1: 'perpendicular(por: figura.punto("V1"), a: A1B1)'
        parV1: 'perpendicular(por: figura.punto("V1"), a: perpV1)'
        # K, en la paralela a la charnela por V₁, a lo que V está más alto que
        # A: MK es el radio. N₂ es el pie de V₂ en la horizontal de A₂ y B₂.
        cotaV: diferencia_de_cotas(V, A)
        K: 'uno(medir_sobre(parV1, desde: figura.punto("V1"), distancia: cotaV), 1)'
        N2: 'pie_perpendicular(figura.punto("V2"), figura.segmento("AB2"))'
        angAVB: angulo_rectas(recta3(V, A), recta3(V, B))
        # Los errores del radio: solo la cota, o MV₁ llevado al otro lado.
        V0cota: 'medir_sobre(perpV1, desde: proy_planta(Mv), distancia: cotaV)'
        V0planta: 'uno(medir_sobre(perpV1, desde: proy_planta(Mv), distancia: vm_planta(V, Mv)), 2)'
        # Lo que se ve de AVB en la planta (A y B llevados a la cota de V) y
        # en el alzado (A llevado al alejamiento de V; B ya lo tiene).
        horV2: 'segmento2(figura.punto("V2"), desplaza(figura.punto("V2"), dx: 10))'
        Ah: 'punto3(alzado: pie_perpendicular(figura.punto("A1"), horV2), planta: figura.punto("A1"))'
        Bh: 'punto3(alzado: pie_perpendicular(figura.punto("B1"), horV2), planta: figura.punto("B1"))'
        Af: 'punto3(alzado: figura.punto("A2"), planta: pie_perpendicular(figura.punto("A2"), figura.segmento("VB1")))'
        Cf: 'punto3(alzado: figura.punto("C2"), planta: pie_perpendicular(figura.punto("C2"), figura.segmento("VB1")))'
        angPlantaAVB: angulo_rectas(recta3(V, Ah), recta3(V, Bh))
        angAlzadoAVB: angulo_rectas(recta3(V, Af), recta3(V, B))
        # b) Decisión: un cambio de plano horizontal con la línea nueva de la
        # lámina, perpendicular a V₂B₂, y V de referencia: VB es frontal y
        # queda de punta, V₄ ≡ B₄ en la línea, y los planos AVB y CVB se ven de
        # canto. A está 40,8 pt más atrás que V y C lo mismo más adelante: A₄
        # cae hacia el alzado y C₄ hacia fuera.
        V_4: 'cambio_plano_horizontal(V, figura.segmento("nueva"), ref: V)'
        B_4: 'cambio_plano_horizontal(B, figura.segmento("nueva"), ref: V)'
        A_4: 'cambio_plano_horizontal(A, figura.segmento("nueva"), ref: V)'
        C_4: 'cambio_plano_horizontal(C, figura.segmento("nueva"), ref: V)'
        pieA4: 'pie_perpendicular(figura.punto("A2"), figura.segmento("nueva"))'
        paraA2: 'perpendicular(por: figura.punto("A2"), a: figura.segmento("nueva"))'
        N1: 'pie_perpendicular(figura.punto("A1"), figura.segmento("VB1"))'
        # El menor de los dos ángulos de los planos, y el de las caras, que
        # abarcan A y C.
        angPlanos: angulo_planos(avb, cvb)
        diedro: angulo_diedro(A, recta3(V, B), C)
        # Los errores: cada cara con el plano frontal de VB, que en la vista
        # nueva es la propia línea (la mitad del diedro); y A₄ y C₄ con la cota
        # en vez del alejamiento. Los puntos de la vista nueva se suben a una
        # misma cota para medir su ángulo en el papel con angulo_rectas.
        Varriba: 'punto3(alzado: desplaza(figura.punto("V2"), dy: -10), planta: figura.punto("V1"))'
        frontalVB: plano(V, B, Varriba)
        angCaraFrontal: angulo_planos(avb, frontalVB)
        A4cota: 'medir_sobre(paraA2, desde: pieA4, distancia: cotaV)'
        horRef: 'segmento2(figura.punto("A2"), figura.punto("B2"))'
        V4z: 'punto3(alzado: pie_perpendicular(V_4, horRef), planta: V_4)'
        Acz: 'punto3(alzado: pie_perpendicular(uno(A4cota, 1), horRef), planta: uno(A4cota, 1))'
        Ccz: 'punto3(alzado: pie_perpendicular(uno(A4cota, 2), horRef), planta: uno(A4cota, 2))'
        angCotas: angulo_rectas(recta3(V4z, Acz), recta3(V4z, Ccz))
        # c) CV, con su triángulo levantado en V₁ (V abatido sobre la planta
        # con el plano vertical de CV, a lo que V sube sobre C): una lista, los
        # dos lados valen; la construcción va abajo a la izquierda (el 2). BV
        # es frontal: su ángulo se ve en el alzado.
        VabCV: abatido_planta(C, V)
        perpV1c: 'perpendicular(por: figura.punto("V1"), a: figura.segmento("VC1"))'
        angCV: angulo_con_ph(segmento3(C, V))
        angBV: angulo_con_ph(segmento3(B, V))
        Vp_dy: 'medir_sobre(perpV1c, desde: figura.punto("V1"), distancia: raiz(vm(C, V) * vm(C, V) - vm_alzado(C, V) * vm_alzado(C, V)))'
        Vp_enC1: 'medir_sobre(perpendicular(por: figura.punto("C1"), a: figura.segmento("VC1")), desde: figura.punto("C1"), distancia: cotaV)'
        # Los extremos de las rectas largas y de los arcos de la construcción.
        L_ch: 'uno(medir_sobre(A1B1, desde: proy_planta(Mv), distancia: 8), 2)'
        L_V0: 'uno(medir_sobre(perpV1, desde: proy_planta(rama(Vab, 1)), distancia: 8), 1)'
        L_M: 'uno(medir_sobre(perpV1, desde: proy_planta(Mv), distancia: 6), 2)'
        L_K: 'uno(medir_sobre(parV1, desde: K, distancia: 6), 1)'
        L_hA2: 'desplaza(N2, dx: -8)'
        L_vV2: 'desplaza(N2, dy: 6)'
        L_V4: 'uno(medir_sobre(figura.segmento("VB2"), desde: V_4, distancia: 6), 2)'
        L_C4: 'uno(medir_sobre(paraA2, desde: C_4, distancia: 6), 1)'
        L_prolC4: 'uno(medir_sobre(segmento2(C_4, V_4), desde: V_4, distancia: 30), 1)'
        T_V4: 'uno(medir_sobre(segmento2(V_4, A_4), desde: V_4, distancia: 15), 1)'
        L_Vp: 'uno(medir_sobre(perpV1c, desde: uno(VabCV, 2), distancia: 6), 1)'
        T_C1: 'uno(medir_sobre(figura.segmento("VC1"), desde: figura.punto("C1"), distancia: 20), 2)'
        T_B2: 'desplaza(figura.punto("B2"), dx: -20)'
        # El plano horizontal de A, para comprobar que B y C están a su cota.
        Ax: 'punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10))'
        Ay: 'punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 10))'
        horA: plano(A, Ax, Ay)
      comprueba:
        # B y C están a la cota de A: AB es una horizontal del plano AVB y
        # sirve de charnela; y el pie de V en ella está en el plano.
        - en_plano(B, horA)
        - en_plano(C, horA)
        - en_plano(Mv, avb)
        - en_plano(B, frontalVB)
    pasos:
      - tipo: reconocer
        pregunta: En la planta, V₁B₁ es horizontal en el papel. ¿Qué se gana con eso?
        opciones:
          - texto: Que VB es frontal y el alzado la da entera
            correcta: true
            mensaje: |
              Eso es. VB está a la misma distancia del plano vertical en toda su longitud: V₂B₂ mide lo
              que la pata, 48,3 mm, y su ángulo con la horizontal del papel es el que forma con el plano
              horizontal. Y como es frontal, un solo cambio de plano, con la línea nueva perpendicular a
              V₂B₂, la pone de punta: es la arista de los planos AVB y CVB, que así se ven de canto.
          - texto: Que VB es horizontal, y su ángulo con el plano horizontal se mide en la planta, entre V₁B₁ y la horizontal del papel
            mensaje: |
              Horizontal sería si V₂B₂ fuera horizontal en el alzado, y no lo es: V₂ está 21,6 mm más alto
              que B₂. V₁B₁ horizontal en el papel dice que VB no se acerca ni se aleja del plano vertical:
              es frontal, y su ángulo con el plano horizontal se ve en el alzado.
          - texto: Que VB es de punta, y los planos AVB y CVB ya se ven de canto en el alzado, como dos rectas que salen de V₂
            mensaje: |
              De punta sería un punto en una de las vistas, y VB se ve como un segmento en las dos. En el
              alzado, A₂ ≡ C₂ está fuera de V₂B₂: los planos no se ven de canto. Hace falta un cambio de
              plano que la ponga de punta, y basta uno porque es frontal.

      - tipo: construir
        titulo: El ángulo AVB, abatiendo su plano
        intro: |
          A y B están a la misma altura, así que AB es una horizontal del plano AVB: es la charnela, y A y
          B no se mueven. Abate V: en la planta, la perpendicular a A₁B₁ por V₁ corta la charnela,
          prolongada más allá de A₁, en M, el pie de V. El radio es la hipotenusa del triángulo de catetos
          MV₁ y lo que V está más alto que A: arma en V₁, sobre la paralela a la charnela, esa altura, K,
          y MK es el radio. Con centro en M, V₀ en la perpendicular. El ángulo A₁V₀B₁ es el de las patas
          VA y VB. Vale abatir hacia cualquiera de los dos lados; aquí, hacia el de V₁. Marca M y V₀.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M
            pide: el pie de V en la charnela AB, en la planta
            es: proy_planta(solucion.Mv)
            bien: |
              M está en A₁B₁ prolongada, al pie de la perpendicular por V₁: AB es horizontal, y la
              perpendicular a ella se ve perpendicular en la planta. V gira alrededor de AB con centro en M.
            diagnosticos:
              - si: '!en_recta(solucion.A1B1)'
                mensaje: |
                  M está **en la charnela**, la recta A₁B₁, prolongada más allá de A₁: es el centro del giro
                  de V.
                ejemplo: 'uno(medir_sobre(solucion.perpV1, desde: proy_planta(solucion.Mv), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.perpV1)'
                mensaje: |
                  M es el pie de la **perpendicular a A₁B₁ por V₁**: V gira en un plano perpendicular a la
                  charnela.
                ejemplo: 'uno(medir_sobre(solucion.A1B1, desde: proy_planta(solucion.Mv), distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  M está donde la perpendicular a A₁B₁ por V₁ corta la charnela prolongada.
          - nombre: V0
            pide: el vértice V abatido
            es: proy_planta(solucion.Vab)
            bien: |
              V₀ está en la perpendicular a la charnela por V₁, a 32,2 mm de M: la distancia real de V a AB.
              El ángulo A₁V₀B₁ es el de las patas VA y VB.
            diagnosticos:
              - si: cerca_de(solucion.V0cota)
                mensaje: |
                  Has abatido V con lo que está más alto que A, 21,6 mm: es solo un cateto. El radio es la
                  hipotenusa MK, que tiene por otro cateto lo que V₁ dista de la charnela en la
                  planta, 23,9 mm.
                ejemplo: uno(solucion.V0cota, 1)
              - si: cerca_de(solucion.V0planta)
                mensaje: |
                  Has llevado al otro lado de M lo que V₁ dista de la charnela **en la planta**, MV₁. V está
                  más alto que la charnela, y su distancia real a ella es la hipotenusa MK.
                ejemplo: solucion.V0planta
              - si: '!en_recta(solucion.perpV1)'
                mensaje: |
                  V gira en un plano perpendicular a la charnela: V₀ está en la **perpendicular a A₁B₁ por
                  V₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Vab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por V₁, pero no a la distancia buena: con centro en M y radio MK,
                  el arco que sale de K la corta en V₀.
        trazado:
          - segmento2(solucion.L_ch, figura.punto("B1"))
          - segmento2(figura.punto("V1"), proy_planta(solucion.Vab))
          - segmento2(proy_planta(solucion.Vab), figura.punto("A1"))
          - segmento2(proy_planta(solucion.Vab), figura.punto("B1"))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_ch)
            rotulo: charnela
            porque: |
              En la planta, A₁B₁ con la regla, prolongada más allá de A₁: la charnela. A₂ y B₂ están a la
              misma altura en el alzado, y AB es una horizontal del plano AVB.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("V1"), solucion.L_V0), segmento2(figura.punto("V1"), solucion.L_M)]'
            guia: solucion.A1B1
            porque: |
              Por V₁, la perpendicular a la charnela, larga hacia los dos lados: arriba, hasta pasar A₁B₁
              prolongada; abajo, más allá de V₁. V gira alrededor de AB en un plano perpendicular a ella, y
              en la planta se mueve por esta recta.
          - con: marca
            traza: proy_planta(solucion.Mv)
            rotulo: M
            porque: |
              M, nombre nuestro, donde la perpendicular por V₁ corta la charnela prolongada, 10 mm más allá
              de A₁: el pie de V, centro de su giro.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V1"), solucion.L_K)
            guia: solucion.A1B1
            porque: |
              Por V₁, la paralela a la charnela, hacia arriba a la izquierda: en ella se arma el triángulo
              del radio, rectángulo en V₁.
          - con: regla
            traza: segmento2(figura.punto("A2"), solucion.L_hA2)
            porque: |
              En el alzado, la recta de B₂ y A₂ prolongada hacia la izquierda, hasta pasar la vertical de
              V₂: es la horizontal de la cubierta, la cota de A, B y C.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V2"), solucion.L_vV2)
            porque: |
              Por V₂, la vertical hasta pasar esa horizontal: el trozo entre V₂ y ella, N, es lo que V está
              más alto que A, 21,6 mm.
          - con: compas
            traza: 'arco(figura.punto("V1"), por: solucion.K, desde: desplaza(solucion.K, dx: -3.3, dy: 5), hasta: desplaza(solucion.K, dx: 3.3, dy: -5))'
            toma: segmento2(figura.punto("V2"), solucion.N2)
            porque: |
              Con el compás, V₂N, lo que V está más alto que A; con centro en V₁, el arco corta la paralela a
              la charnela.
          - con: marca
            traza: solucion.K
            rotulo: K
            porque: |
              K, nombre nuestro, donde el arco corta la paralela a la charnela por V₁: V₁K es lo que V está
              más alto que la charnela.
          - con: regla
            traza: segmento2(proy_planta(solucion.Mv), solucion.K)
            porque: |
              MK, la hipotenusa del triángulo rectángulo M V₁ K: la distancia real de V a la charnela,
              32,2 mm, que es el radio con que V se abate.
          - con: compas
            traza: 'arco(proy_planta(solucion.Mv), por: solucion.K, desde: solucion.K, hasta: desplaza(proy_planta(rama(solucion.Vab, 1)), dx: 5, dy: 3))'
            porque: |
              Con centro en M y radio MK, el arco desde K, hacia abajo, hasta pasar la perpendicular por
              V₁: V gira alrededor de AB y cae al plano horizontal de la cubierta. La circunferencia entera
              la cortaría también arriba, al otro lado de la charnela, y ese V₀ también valdría.
          - con: marca
            traza: proy_planta(rama(solucion.Vab, 1))
            rotulo: V₀
            porque: |
              V₀, donde el arco corta la perpendicular por V₁, más allá de V₁: V abatido, a 32,2 mm de M.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.Vab, 1)), figura.punto("A1")), segmento2(proy_planta(rama(solucion.Vab, 1)), figura.punto("B1"))]'
            porque: |
              V₀A₁ y V₀B₁: las patas VA y VB abatidas. A y B están en la charnela y no se mueven; el
              triángulo A₁V₀B₁ es AVB en verdadera magnitud.
          - con: transportador
            traza: 'arco(proy_planta(rama(solucion.Vab, 1)), por: figura.punto("A1"), desde: figura.punto("A1"), hasta: figura.punto("B1"))'
            porque: |
              El transportador con el centro en V₀, de V₀A₁ a V₀B₁: el ángulo AVB de las patas.
        pista: |
          (1) La charnela A₁B₁, prolongada, y por V₁ su perpendicular: M. (2) Por V₁, la paralela a la
          charnela, y sobre ella lo que V está más alto que A, de V₂ a la horizontal de A₂B₂: K. (3) Con
          centro en M y radio MK, a la perpendicular: V₀. (4) El ángulo en V₀, entre V₀A₁ y V₀B₁.
        desarrollo: |
          En verde claro, la charnela, el camino de V y el triángulo A₁V₀B₁, que es AVB en verdadera
          magnitud: VA = 33,8 mm, VB = 48,3 mm y AB = 26,0 mm. MV₁ mide 23,9 mm, y la hipotenusa MK, el
          radio, 32,2 mm.

      - tipo: calcular
        titulo: El ángulo AVB entre las patas VA y VB
        pregunta: ¿Cuántos grados forman las patas VA y VB?
        respuesta:
          tipo: numero
          valor: '30.91'
          receta: angAVB
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '33.69'
            receta: angPlantaAVB
            mensaje: |
              Es lo que forman V₁A₁ y V₁B₁ **en la planta**. El plano AVB no es horizontal —V está más alto
              que A y B—, y la planta deforma su ángulo. Hay que abatirlo.
          - valor: '18.46'
            receta: angAlzadoAVB
            mensaje: |
              Es lo que forman V₂A₂ y V₂B₂ **en el alzado**. VB es frontal y se ve entera, pero VA no, y el
              plano AVB tampoco: el alzado deforma el ángulo.
          - valor: '149.09'
            receta: 180 - angAVB
            mensaje: |
              Ese es el **suplementario**: el que forma V₀A₁ con la prolongación de B₁V₀ más allá de V₀. Las
              patas salen de V hacia A y hacia B, y el ángulo que abarcan es el del triángulo, en V₀.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en V₀, entre V₀A₁ y V₀B₁.
        desarrollo: |
          En el triángulo AVB, con VA = 33,76 mm, VB = 48,31 mm y AB = 25,98 mm, por el teorema del
          coseno:

          $$ \cos\widehat{V} = \frac{33{,}76^{2} + 48{,}31^{2} - 25{,}98^{2}}{2 \cdot 33{,}76 \cdot 48{,}31} \approx 0{,}8580, \qquad \widehat{V} \approx 30{,}91^{\circ} $$

      - tipo: construir
        titulo: Los planos AVB y CVB, con VB de punta
        intro: |
          VB es frontal, así que un solo cambio de plano la pone de punta. La línea nueva, de trazo y
          punto, ya está dibujada arriba a la izquierda, perpendicular a V₂B₂; la referencia es V, y el
          cambio es horizontal: sale del alzado y lleva alejamientos. V₄ ≡ B₄ cae en la línea, donde la
          corta V₂B₂ prolongada. A₂ ≡ C₂ sale por la paralela a V₂B₂, y A₄ y C₄ se apartan de la línea lo
          que A₁ y C₁ están por encima y por debajo de V₁B₁ en la planta, 14,4 mm: A, que está más atrás
          que V, hacia el alzado, y C hacia fuera. V₄A₄ y V₄C₄ son los planos de canto. Marca V₄ ≡ B₄, A₄ y
          C₄.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: V4
            rotulo: V₄ ≡ B₄
            pide: la arista VB, de punta en la vista nueva
            es: solucion.V_4
            bien: |
              V₄ ≡ B₄ está en la línea nueva, donde la corta V₂B₂ prolongada: V es la referencia, y B tiene
              su mismo alejamiento. La arista se ve como un punto.
            diagnosticos:
              - si: '!en_recta(figura.segmento("nueva"))'
                mensaje: |
                  V es la referencia del cambio: cae **en la línea nueva**. B también, porque VB es frontal y
                  tiene el mismo alejamiento en toda su longitud.
                ejemplo: 'uno(medir_sobre(figura.segmento("VB2"), desde: solucion.V_4, distancia: mm(5)), 2)'
              - si: '!en_recta(figura.segmento("VB2"))'
                mensaje: |
                  V₄ sale de V₂ por la perpendicular a la línea nueva, y esa perpendicular es la propia V₂B₂,
                  prolongada: V₄ ≡ B₄ está donde corta la línea.
                ejemplo: 'uno(medir_sobre(figura.segmento("nueva"), desde: solucion.V_4, distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  V₄ ≡ B₄ está donde V₂B₂ prolongada corta la línea nueva.
          - nombre: A4
            pide: el pie A de la pata VA en la vista nueva
            es: solucion.A_4
            bien: |
              A₄ está en la paralela a V₂B₂ por A₂, 14,4 mm antes de la línea nueva, hacia el alzado: A₁ está
              por encima de V₁B₁ en la planta, y A está más atrás que V.
            diagnosticos:
              - si: cerca_de(solucion.C_4)
                mensaje: |
                  Ese es el lado de C. A₁ está por encima de V₁B₁ en la planta: A está más atrás que V, la
                  referencia, y en la vista nueva queda del lado del alzado, entre la línea y A₂.
                ejemplo: solucion.C_4
              - si: cerca_de(solucion.A4cota)
                mensaje: |
                  Has llevado lo que A está más bajo que V, la cota. Este cambio sale del alzado y lleva
                  **alejamientos**: lo que A₁ está por encima de V₁B₁ en la planta, 14,4 mm.
                ejemplo: uno(solucion.A4cota, 1)
              - si: '!en_recta(solucion.paraA2)'
                mensaje: |
                  A₄ sale de A₂ por la **perpendicular a la línea nueva**, que es la paralela a V₂B₂.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(4), dy: mm(-3))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a V₂B₂ por A₂, pero no a la distancia buena: A₄ se aparta de la línea
                  nueva lo que A₁ está por encima de V₁B₁, hacia el alzado.
          - nombre: C4
            pide: el pie C de la pata VC en la vista nueva
            es: solucion.C_4
            bien: |
              C₄ está en la misma paralela, al otro lado de la línea nueva y a la misma distancia: C₁ está
              por debajo de V₁B₁ lo mismo que A₁ por encima. V₄A₄ y V₄C₄ son los planos AVB y CVB de canto.
            diagnosticos:
              - si: cerca_de(solucion.A4cota)
                mensaje: |
                  Has llevado la cota de C en vez de su alejamiento. El cambio sale del alzado: C₄ se aparta
                  de la línea lo que C₁ está por debajo de V₁B₁ en la planta, 14,4 mm.
                ejemplo: uno(solucion.A4cota, 2)
              - si: '!en_recta(solucion.paraA2)'
                mensaje: |
                  C₂ es la misma cruz que A₂: C₄ sale por la misma paralela a V₂B₂, la perpendicular a la
                  línea nueva.
                ejemplo: 'desplaza(solucion.C_4, dx: mm(4), dy: mm(-3))'
              - si: siempre
                mensaje: |
                  Estás en la paralela por A₂ ≡ C₂, pero no a la distancia buena: C₄ se aparta de la línea, hacia
                  fuera, lo que C₁ está por debajo de V₁B₁.
        trazado:
          - segmento2(figura.punto("V2"), solucion.V_4)
          - segmento2(figura.punto("A2"), solucion.C_4)
          - segmento2(solucion.V_4, solucion.A_4)
          - segmento2(solucion.C_4, solucion.L_prolC4)
        construccion:
          - con: regla
            traza: segmento2(figura.punto("V2"), solucion.L_V4)
            porque: |
              V₂B₂ prolongada con la regla más allá de V₂, hasta pasar la línea nueva: es perpendicular a
              ella, y por ella sale V₄, y también B₄.
          - con: marca
            traza: solucion.V_4
            rotulo: V₄ ≡ B₄
            porque: |
              V₄ ≡ B₄, donde V₂B₂ prolongada corta la línea nueva: V es la referencia, y B tiene su mismo
              alejamiento. VB, de punta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_C4)
            guia: figura.segmento("VB2")
            porque: |
              Por A₂ ≡ C₂, la paralela a V₂B₂, que es la perpendicular a la línea nueva, larga, hasta pasarla
              bien: por ella salen A₄ y C₄.
          - con: compas
            traza: '[arco(solucion.pieA4, por: solucion.A_4, desde: desplaza(solucion.A_4, dx: -2.7, dy: 5.4), hasta: desplaza(solucion.A_4, dx: 2.7, dy: -5.4)), arco(solucion.pieA4, por: solucion.C_4, desde: desplaza(solucion.C_4, dx: -2.7, dy: 5.4), hasta: desplaza(solucion.C_4, dx: 2.7, dy: -5.4))]'
            toma: segmento2(figura.punto("A1"), solucion.N1)
            porque: |
              Con el compás, en la planta, lo que A₁ está por encima de V₁B₁, 14,4 mm, que es lo mismo que C₁
              está por debajo. Con centro donde la paralela corta la línea nueva, un arco a cada lado.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la paralela del lado del alzado: A está más atrás que V.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            porque: |
              C₄, donde el arco corta la paralela al otro lado de la línea nueva: C está más adelante que V.
          - con: regla
            traza: '[segmento2(solucion.V_4, solucion.A_4), segmento2(solucion.C_4, solucion.L_prolC4)]'
            porque: |
              V₄A₄ y V₄C₄, los planos AVB y CVB de canto. C₄V₄ se prolonga más allá de V₄: entre esa
              prolongación y V₄A₄ queda el menor de los dos ángulos.
          - con: transportador
            traza: 'arco(solucion.V_4, por: solucion.T_V4, desde: solucion.A_4, hasta: solucion.L_prolC4)'
            porque: |
              El transportador con el centro en V₄, de V₄A₄ a la prolongación de C₄V₄: el ángulo entre los
              planos, el menor. El de V₄A₄ a V₄C₄, por donde están A y C, es su suplementario.
        pista: |
          (1) V₂B₂ prolongada hasta la línea nueva: V₄ ≡ B₄. (2) Por A₂ ≡ C₂, la paralela a V₂B₂. (3) Sobre
          ella, a cada lado de la línea, lo que A₁ y C₁ están por encima y por debajo de V₁B₁: A₄ hacia el
          alzado y C₄ hacia fuera. (4) El ángulo en V₄.
        desarrollo: |
          En verde claro, la vista con VB de punta: las dos rectas V₄A₄ y V₄C₄ son los planos AVB y CVB de
          canto, simétricos respecto de la línea nueva, que en esta vista es el plano frontal de VB. Cada
          uno forma 56,1° con ella: las caras abarcan 112,2°, y los planos, el menor, 67,8°.

      - tipo: calcular
        titulo: El ángulo entre los planos AVB y CVB
        # Decisión: dos planos que se cortan forman dos ángulos suplementarios, y se
        # da el menor, el convenio de «ángulo entre planos» (y el de angulo_planos),
        # como en el 53·3 A. El de las caras, 112,23°, va de distractor con un mensaje
        # que reconoce la construcción. El enunciado no dice cuál de los dos espera el
        # corrector: es la pregunta abierta para Ionan del 53·3 A (tasks/pendiente.md).
        pregunta: ¿Cuántos grados forman los planos AVB y CVB? Del par de ángulos suplementarios que forman, el menor.
        respuesta:
          tipo: numero
          valor: '67.77'
          receta: angPlanos
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '112.23'
            receta: diedro
            mensaje: |
              Es el ángulo de las **caras**, el que abarcan por donde están A y C, de V₄A₄ a V₄C₄, y
              la construcción es la buena. Dos planos que se cortan forman dos ángulos
              suplementarios; el enunciado pide el de los planos, y aquí se da el menor, como en el
              apartado 3 del Ejercicio 53: 180° − 112,23° = 67,77°.
          - valor: '56.11'
            receta: angCaraFrontal
            mensaje: |
              Es lo que forma **una** cara con la línea nueva, que en esta vista es el plano frontal que
              contiene a VB: la mitad del ángulo de las caras. El ángulo de los planos está entre V₄A₄ y la
              prolongación de V₄C₄.
          - valor: '48.24'
            receta: angCotas
            mensaje: |
              Sale de llevar a la vista nueva las **cotas** de A y C en vez de sus alejamientos. El cambio
              sale del alzado, así que lleva lo que A₁ y C₁ están por encima y por debajo de V₁B₁ en la
              planta, 14,4 mm, no los 21,6 mm que V está más alto.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en V₄, entre V₄A₄ y la prolongación de
          C₄V₄ más allá de V₄.
        desarrollo: |
          Con VB de punta, A₄ y C₄ quedan a 14,4 mm a cada lado de la línea nueva, y la paralela que los
          une está a 9,67 mm de V₄. Cada cara forma con la línea un ángulo de tangente 14,4/9,67:

          $$ 2\arctan\frac{14{,}39}{9{,}67} \approx 112{,}23^{\circ}, \qquad 180^{\circ} - 112{,}23^{\circ} = 67{,}77^{\circ} $$

          Dos casualidades de esta lámina, dentro de la tolerancia: en la planta, V₁A₁ y V₁C₁ forman 67,4°;
          y en la construcción del ángulo AVB, la charnela A₁B₁ y su paralela por V₁ forman 67,3° con
          V₁A₁. Ninguna es el ángulo de los planos —ni su arista VB es vertical ni los planos lo son—, y la
          casilla no las distingue.

      - tipo: construir
        titulo: Las patas CV y BV con el plano horizontal
        intro: |
          BV es frontal: su ángulo con el plano horizontal se ve en el alzado, entre V₂B₂ y la horizontal
          de la cubierta. CV no es horizontal ni frontal: en V₁, la perpendicular a C₁V₁, y sobre ella lo
          que V está más alto que C, de V₂ a la horizontal de A₂ ≡ C₂. Ese punto es V′, V abatido sobre la
          planta con el plano vertical de CV; el ángulo en C₁, entre C₁V₁ y C₁V′, es el de CV con el plano
          horizontal. Hacia cualquiera de los dos lados de V₁ vale; aquí, hacia abajo a la izquierda.
          Marca V′.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Vp
            rotulo: V′
            pide: el extremo V de la pata CV, abatido sobre la planta
            es: solucion.VabCV
            bien: |
              V′ está en la perpendicular a C₁V₁ por V₁, a 21,6 mm de V₁: lo que V está más alto que C.
              C₁V′ mide 33,8 mm, la longitud de la pata, y forma con C₁V₁ su ángulo con el plano horizontal.
            diagnosticos:
              - si: cerca_de(solucion.Vp_dy)
                mensaje: |
                  Has llevado lo que V está **más atrás** que C, la diferencia de alejamientos. Sobre la
                  planta se lleva lo que **sube**: de V₂ a la horizontal de A₂ ≡ C₂, en el alzado.
                ejemplo: uno(solucion.Vp_dy, 1)
              - si: cerca_de(solucion.Vp_enC1)
                mensaje: |
                  Has levantado la diferencia de cotas en C₁, no en V₁. Ese triángulo también da la
                  longitud, pero aquí se pide V abatido: la perpendicular a C₁V₁ va por V₁.
                ejemplo: uno(solucion.Vp_enC1, 1)
              - si: '!en_recta(solucion.perpV1c)'
                mensaje: |
                  V′ va en la **perpendicular a C₁V₁ por V₁**: el plano vertical de CV gira alrededor de C₁V₁
                  hasta la planta, y V se mueve perpendicular a ella.
                ejemplo: 'desplaza(uno(solucion.VabCV, 2), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por V₁, pero no a la distancia buena: con el compás, de V₂ a la
                  horizontal de A₂ ≡ C₂, y centro en V₁.
        trazado:
          - segmento2(figura.punto("V1"), uno(solucion.VabCV, 2))
          - segmento2(figura.punto("C1"), uno(solucion.VabCV, 2))
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V1"), solucion.L_Vp)
            guia: figura.segmento("VC1")
            porque: |
              En la planta, por V₁, la perpendicular a C₁V₁, hacia abajo a la izquierda y larga: el plano
              vertical de CV se abate sobre la planta girando alrededor de C₁V₁, y V se mueve por esta
              recta.
          - con: regla
            traza: segmento2(figura.punto("A2"), solucion.L_hA2)
            porque: |
              En el alzado, la recta de B₂ y A₂ ≡ C₂ prolongada hacia la izquierda, hasta pasar la vertical
              de V₂: la horizontal de la cubierta, la cota de C.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V2"), solucion.L_vV2)
            porque: |
              Por V₂, la vertical hasta pasar esa horizontal: el trozo entre V₂ y ella, N, es lo que V está
              más alto que C, 21,6 mm.
          - con: compas
            traza: 'arco(figura.punto("V1"), por: uno(solucion.VabCV, 2), desde: desplaza(uno(solucion.VabCV, 2), dx: 4.2, dy: 2.8), hasta: desplaza(uno(solucion.VabCV, 2), dx: -4.2, dy: -2.8))'
            toma: segmento2(figura.punto("V2"), solucion.N2)
            porque: |
              Con el compás, en el alzado, V₂N, lo que V está más alto que C. Con centro en V₁, sobre la
              perpendicular.
          - con: marca
            traza: uno(solucion.VabCV, 2)
            rotulo: V′
            porque: |
              V′, nombre nuestro, donde el arco corta la perpendicular por V₁: V abatido sobre la planta
              con el plano vertical de CV.
          - con: regla
            traza: segmento2(figura.punto("C1"), uno(solucion.VabCV, 2))
            porque: |
              C₁V′, la hipotenusa del triángulo rectángulo C₁V₁V′: la pata CV en verdadera magnitud, 33,8 mm.
          - con: transportador
            traza: 'arco(figura.punto("C1"), por: solucion.T_C1, desde: figura.punto("V1"), hasta: uno(solucion.VabCV, 2))'
            porque: |
              El transportador con el centro en C₁, de C₁V₁ a C₁V′: el ángulo de CV con su planta, que es
              el que forma con el plano horizontal.
          - con: transportador
            traza: 'arco(figura.punto("B2"), por: solucion.T_B2, desde: solucion.T_B2, hasta: figura.punto("V2"))'
            porque: |
              Y en el alzado, el transportador con el centro en B₂, de la horizontal B₂A₂ a B₂V₂: BV es
              frontal, y el alzado da su ángulo con el plano horizontal sin construir nada.
        pista: |
          (1) BV: en el alzado, en B₂, entre la horizontal y B₂V₂. (2) CV: en V₁, la perpendicular a C₁V₁,
          y sobre ella lo que V sube sobre C, de V₂ a la horizontal de A₂ ≡ C₂: V′. (3) El ángulo en C₁,
          entre C₁V₁ y C₁V′.
        desarrollo: |
          En verde claro, el triángulo C₁V₁V′, rectángulo en V₁: C₁V₁ = 25,9 mm, V₁V′ = 21,6 mm y C₁V′ =
          33,8 mm, la longitud de la pata. AV forma el mismo ángulo que CV: la cabria es simétrica.

      - tipo: calcular
        titulo: El ángulo de la pata CV con el plano horizontal
        pregunta: ¿Cuántos grados forma la pata CV con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '39.76'
          receta: angCV
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '45.00'
            receta: angulo_con_ph(segmento3(V, Cf))
            mensaje: |
              Es lo que forma V₂C₂ con la horizontal **en el alzado**. CV no es frontal —C₁ no está en la
              horizontal de V₁—, y el alzado deforma su ángulo. El de verdad está en C₁, entre C₁V₁ y C₁V′.
          - valor: '50.24'
            receta: 90 - angCV
            mensaje: |
              Ese es el **complementario**, el ángulo de CV con la vertical, el de V′ en el triángulo. El del
              plano horizontal está en C₁, entre la hipotenusa y la planta C₁V₁.
          - valor: '83.21'
            receta: pendiente(C, V) * 100
            mensaje: |
              Es la **pendiente** de CV en tanto por ciento: lo que sube, 21,6 mm, por lo que avanza, 25,9 mm.
              Es la tangente del ángulo, no el ángulo.
        pista: |
          Con el transportador en el paso anterior, o en tu lámina: en C₁, entre C₁V₁ y C₁V′.
        desarrollo: |
          En el triángulo C₁V₁V′, rectángulo en V₁:

          $$ \operatorname{tg}\alpha = \frac{21{,}59}{25{,}95} \approx 0{,}832, \qquad \alpha \approx 39{,}76^{\circ} $$

      - tipo: calcular
        titulo: El ángulo de la pata BV con el plano horizontal
        pregunta: ¿Cuántos grados forma la pata BV con el plano horizontal?
        respuesta:
          tipo: numero
          valor: '26.54'
          receta: angBV
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '63.46'
            receta: 90 - angBV
            mensaje: |
              Ese es el **complementario**, el que forma V₂B₂ con la vertical. El del plano horizontal está
              en B₂, entre la horizontal de la cubierta y B₂V₂.
          - valor: '49.95'
            receta: pendiente(B, V) * 100
            mensaje: |
              Es la **pendiente** de BV en tanto por ciento: sube 21,6 mm en 43,2 mm, casi la mitad. Es la
              tangente del ángulo, no el ángulo.
          - valor: '39.76'
            receta: angCV
            mensaje: |
              Ese es el ángulo de **CV**, o el de AV, que es el mismo. BV es la pata frontal: su ángulo se mide
              en el alzado, en B₂, y es menor, porque llega más lejos con la misma altura.
        pista: |
          BV es frontal: con el transportador en el alzado, en B₂, entre la horizontal B₂A₂ y B₂V₂.
        desarrollo: |
          V está 21,59 mm más alto que B, y BV avanza 43,22 mm en horizontal; como es frontal, el alzado da
          las dos medidas:

          $$ \operatorname{tg}\beta = \frac{21{,}59}{43{,}22} \approx 0{,}4995, \qquad \beta \approx 26{,}54^{\circ} $$

          En la vista de los planos, la paralela a V₂B₂ por A₂ forma el mismo ángulo con la horizontal de la
          cubierta: es paralela a V₂B₂, y el ángulo es el mismo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A y B están a la misma cota, así que AB es una horizontal del plano AVB; con ella de charnela, V abatido da el ángulo AVB, 30,9°.
          - texto: VB es frontal, porque V₁B₁ es horizontal en el papel; un solo cambio de plano, con la línea nueva perpendicular a V₂B₂, la pone de punta.
          - texto: Con VB de punta, los planos AVB y CVB se ven de canto; sus caras abarcan 112,2°, y los planos forman el menor, 67,8°.
          - texto: BV se ve entera en el alzado, con su ángulo con el plano horizontal, 26,5°; el de CV sale de su triángulo, 39,8°.
          - texto: El ángulo de los planos AVB y CVB se mide en la planta, entre V₁A₁ y V₁C₁, porque desde arriba se ven las dos patas.
            trampa: true
            mensaje: |
              La planta no enseña el ángulo de dos planos que no son verticales: hay que ver de punta su
              arista, VB. Aquí sale 67,4°, cerca de los 67,8° por casualidad; en otra cabria no se
              parecerían.
    resolucion: |
      **Qué fija la figura.** A, B y C están a la misma altura, la de la cubierta, y A₂ ≡ C₂. V₁B₁ es
      horizontal en el papel: VB es frontal. A₁ y C₁ están a 14,4 mm a cada lado de V₁B₁: la cabria es
      simétrica respecto del plano frontal de VB. V está 21,6 mm más alto que A, B y C.

      **a) El ángulo AVB.** AB es una horizontal del plano AVB y sirve de charnela. La perpendicular a
      A₁B₁ por V₁ la corta, prolongada, en M. MV₁ mide 23,9 mm y V está 21,6 mm más alto: el radio es
      la hipotenusa, 32,2 mm, y V₀ cae en esa perpendicular. El triángulo A₁V₀B₁ es AVB de verdad, y en
      V₀ mide 30,9°. En la planta se ve de 33,7° y en el alzado de 18,5°.

      **b) Los planos AVB y CVB.** Se cortan en VB, que es frontal. Un cambio de plano con la línea nueva
      perpendicular a V₂B₂ y V de referencia la pone de punta: V₄ ≡ B₄ en la línea, y A₄ y C₄ en la
      paralela a V₂B₂ por A₂ ≡ C₂, a 14,4 mm a cada lado. V₄A₄ y V₄C₄ son los planos de canto: las
      caras abarcan 112,2° por donde están A y C, y los planos forman el menor de los dos ángulos,
      67,8°, que es el que se da: el enunciado no dice cuál de los dos quiere.

      **c) Las patas con el plano horizontal.** BV es frontal, y el alzado da su ángulo: 26,5°. CV,
      con su triángulo: C₁V₁ = 25,9 mm y 21,6 mm de altura dan 39,8°, el mismo que AV.

  - id: sd63-el-angulo-de-r-con-el-plano-abc
    titulo: El ángulo de la recta r con el plano ABC, en magnitud y posición
    fuente: Ejercicio 47 (SD63) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 48).
    # El ángulo no tiene nombre en la hoja: δ es nuestro, el de las
    # diapositivas de ángulos.
    enunciado: |
      Hallar la magnitud y la posición del ángulo entre la recta r y el plano ABC.

      **Notas nuestras.** La figura es el triángulo ABC, con el alzado arriba y la planta debajo, y la
      recta r, que atraviesa el triángulo en las dos vistas. El extremo de arriba de r₂ y el de abajo
      de r₁ están en la misma vertical: son las dos proyecciones de un mismo punto de r, que aquí
      llamamos P. «Posición» quiere decir dónde está el ángulo: su vértice, el punto R en que r corta
      al plano, y su otro lado, la proyección de r sobre el plano, la recta RT, donde T es el pie de la
      perpendicular al plano desde P. La hoja no dice si ABC es una lámina opaca o solo un plano; para
      lo visto y lo oculto se toma opaca, como en las intersecciones. Al ángulo lo llamamos δ. Los
      nombres P, R, T, J, M y K, los de los puntos 1 a 4, F y H, y δ son nuestros.
    pide: R y T en las dos vistas, que son el vértice del ángulo y el otro extremo de su lado RT; el triángulo PTR abatido; lo visto y lo oculto de r, y el ángulo δ en grados.
    receta:
      lamina: sd63
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        # P: el extremo de arriba de r₂ y el de abajo de r₁, en la misma
        # vertical. Es el punto de r desde el que se baja la perpendicular.
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        abc: plano(A, B, C)
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
      solucion:
        # La posición: R, donde r corta al plano, y T, el pie de la
        # perpendicular t desde P. RT es la proyección de r sobre el plano.
        R: corte_recta_plano(r, abc)
        t: perpendicular_a_plano(P, abc)
        T: pie_en_plano(P, abc)
        # La magnitud: de 0 a 90°, el complementario del que r forma con t.
        delta: angulo_recta_plano(r, abc)
        # Decisión: R y T se construyen con un plano auxiliar proyectante, el
        # método de las diapositivas de intersecciones (págs. 5 y 6). El plano
        # auxiliar de r es el vertical que la contiene (de canto en la planta:
        # se ve como r₁); el de t, el vertical que contiene a t. P_alto, encima
        # de P, los fija. Con el que se ve como r₂ (o t₂) saldría lo mismo.
        P_alto: 'punto3(alzado: desplaza(figura.punto("P2"), dy: mm(-10)), planta: figura.punto("P1"))'
        vert_r: plano(P, R, P_alto)
        vert_t: plano(P, T, P_alto)
        # 1 y 2: donde el plano vertical de r corta AC y CB (en la planta,
        # donde r₁ corta A₁C₁ y C₁B₁). 1₂2₂ corta r₂ en R₂.
        I1: corte_recta_plano(recta3(A, C), vert_r)
        I2: corte_recta_plano(recta3(C, B), vert_r)
        # Decisión: la horizontal del plano se toma por 2 y la frontal por 1,
        # que ya están construidos, y no por C. Con la de C, la vertical de su
        # punto en AB caería a 1,3 mm de la del punto 4 de abajo: t es casi de
        # perfil (la normal del plano apenas tiene componente x), y todo lo
        # que se construye para t cae entre x = 341 y x = 356.
        h2: horizontal_por(I2, abc)
        H: pie_comun(recta3(A, B), h2)
        f1: frontal_por(I1, abc)
        F: pie_comun(recta3(A, B), f1)
        # 3 y 4: donde el plano vertical de t corta CB y AB (en la planta,
        # donde t₁ corta C₁B₁ y A₁B₁). 3₂4₂ corta t₂ en T₂.
        # Decisión: T₁ sale de T₂ por su vertical, aunque corta a t₁ a 5,6°.
        # En el Taller es exacto, y en el papel el bien y el porque piden
        # trazar fino. La horizontal del plano por T, que cortaría a t₁ en
        # ángulo recto, metería otra vertical a 1,7 mm de la de H (por A₂B₂) o
        # a 1,9 mm de la de R (por C₂B₂).
        I3: corte_recta_plano(recta3(C, B), vert_t)
        I4: corte_recta_plano(recta3(A, B), vert_t)
        # Decisión: el método de la magnitud no lo impone el enunciado; lo
        # fijamos en el intro. Se abate el triángulo PTR sobre el plano
        # horizontal de T, con la horizontal de PTR por T de charnela: T no se
        # mueve, y J, el punto de r a la cota de T, tampoco. P abatido es una
        # ELECCIÓN entre los dos lados, y R cae con el mismo giro.
        ptr: plano(P, T, R)
        ch: horizontal_por(T, ptr)
        J: pie_comun(r, ch)
        M: pie_perpendicular(P, ch)
        Pab: abatido_a_elegir(P, ch, ptr)
        Rab: 'abatido_junto(R, ch, ptr, con: Pab, de: P)'
        # K₂, en la vertical de P₂ a la altura de T₂: P₂K₂ es lo que P está más
        # alto que T, el cateto del triángulo del radio que se toma con el
        # compás. Pp es (P₀)₁: desde P₁, paralelo a la charnela, ese cateto.
        K2: 'pie_perpendicular(figura.punto("P2"), segmento2(proy_alzado(J), proy_alzado(T)))'
        perpP: 'perpendicular(por: figura.punto("P1"), a: proy_planta(ch))'
        parP: 'perpendicular(por: figura.punto("P1"), a: perpP)'
        Pp: 'uno(medir_sobre(parP, desde: figura.punto("P1"), distancia: diferencia_de_cotas(P, T)), 1)'
        perpR: 'perpendicular(por: proy_planta(R), a: proy_planta(ch))'
        refC: 'segmento2(figura.punto("C1"), figura.punto("C2"))'
        # Donde r₂ corta A₂C₂ y C₂B₂ en el alzado: cruces aparentes, para el
        # diagnóstico de quien toma uno de ellos por R₂. El plano que contiene
        # a r y es perpendicular al plano vertical (se ve como r₂) los da.
        P_frente: 'punto3(alzado: figura.punto("P2"), planta: desplaza(figura.punto("P1"), dy: mm(10)))'
        de_canto_r2: plano(P, R, P_frente)
        X_AC: corte_recta_plano(recta3(A, C), de_canto_r2)
        X_CB: corte_recta_plano(recta3(C, B), de_canto_r2)
        # Los ángulos que se leen en las proyecciones (distractores): r y RT
        # llevadas a la cota de C₂ (planta) o al alejamiento de C₁ (alzado),
        # para que angulo_rectas mida lo que se ve en esa vista.
        horC2: 'perpendicular(por: figura.punto("C2"), a: refC)'
        horC1: 'perpendicular(por: figura.punto("C1"), a: refC)'
        Rh: 'punto3(alzado: pie_perpendicular(proy_planta(R), horC2), planta: proy_planta(R))'
        Th: 'punto3(alzado: pie_perpendicular(proy_planta(T), horC2), planta: proy_planta(T))'
        Ph: 'punto3(alzado: pie_perpendicular(figura.punto("P1"), horC2), planta: figura.punto("P1"))'
        Rf: 'punto3(alzado: proy_alzado(R), planta: pie_perpendicular(proy_alzado(R), horC1))'
        Tf: 'punto3(alzado: proy_alzado(T), planta: pie_perpendicular(proy_alzado(T), horC1))'
        Pf: 'punto3(alzado: figura.punto("P2"), planta: pie_perpendicular(figura.punto("P2"), horC1))'
        ang_planta: angulo_rectas(segmento3(Rh, Ph), segmento3(Rh, Th))
        ang_alzado: angulo_rectas(segmento3(Rf, Pf), segmento3(Rf, Tf))
        # El abatimiento con el radio mal (distractor): P llevado desde M solo
        # lo que está más alto que T, R por afinidad con ese P, y el ángulo que
        # sale en R. Los tres puntos quedan a la cota de T: el ángulo del
        # espacio es el de la planta.
        P0x: 'uno(medir_sobre(perpP, desde: proy_planta(M), distancia: diferencia_de_cotas(P, T)), 1)'
        horT2: 'perpendicular(por: proy_alzado(T), a: refC)'
        P0x3: 'punto3(alzado: pie_perpendicular(P0x, horT2), planta: P0x)'
        R0x3: corte_recta_plano(recta3(J, P0x3), plano_perpendicular_a_recta(R, ch))
        ang_radio_dz: angulo_rectas(segmento3(R0x3, T), segmento3(R0x3, P0x3))
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        L_v1: 'desplaza(proy_alzado(I1), dy: mm(-3))'
        L_v2: 'desplaza(proy_alzado(I2), dy: mm(-3))'
        L_vR: 'desplaza(proy_planta(R), dy: mm(3))'
        L_h2: 'desplaza(proy_alzado(H), dx: mm(3))'
        L_vH: 'desplaza(proy_planta(H), dy: mm(3))'
        L_f1: 'desplaza(proy_planta(F), dx: mm(3))'
        L_vF: 'desplaza(proy_alzado(F), dy: mm(-3))'
        L_t1: 'uno(medir_sobre(proy_planta(t), desde: proy_planta(I4), distancia: mm(3)), 2)'
        L_t2: 'uno(medir_sobre(proy_alzado(t), desde: proy_alzado(T), distancia: mm(11.5)), 2)'
        L_v3: 'desplaza(proy_alzado(I3), dy: mm(-3))'
        L_v4: 'desplaza(proy_alzado(I4), dy: mm(-3))'
        L_vT: 'desplaza(proy_planta(T), dy: mm(3))'
        L_hJ: 'desplaza(proy_alzado(J), dx: mm(-3))'
        L_vJ: 'desplaza(proy_planta(J), dy: mm(3))'
        L_ch: 'uno(medir_sobre(proy_planta(ch), desde: proy_planta(M), distancia: mm(3)), 1)'
        L_pM: 'uno(medir_sobre(perpP, desde: proy_planta(M), distancia: mm(3)), 2)'
        L_pP0: 'uno(medir_sobre(perpP, desde: proy_planta(rama(Pab, 1)), distancia: mm(4)), 1)'
        L_vK: 'desplaza(K2, dy: mm(3))'
        L_par: 'uno(medir_sobre(parP, desde: Pp, distancia: mm(3)), 1)'
        L_pR: 'uno(medir_sobre(perpR, desde: proy_planta(rama(Rab, 1)), distancia: mm(3)), 1)'
        # Donde r₀ cruza C₁B₁ en la planta (el plano vertical que contiene a
        # r₀ corta CB): desde ahí arranca el arco del transportador.
        J_alto: 'punto3(alzado: desplaza(proy_alzado(J), dy: mm(-10)), planta: proy_planta(J))'
        X_r0: corte_recta_plano(recta3(C, B), plano(J, Pab, J_alto))
      comprueba:
        # P está en r: los extremos de r₂ y r₁ en la misma vertical son un
        # punto de la recta, y R, T y J están en el plano o en la recta que
        # dicen.
        - en_recta(P, r)
        - en_plano(R, abc)
        - en_plano(T, abc)
        - en_recta(J, r)
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué ángulo es el ángulo entre una recta y un plano?
        opciones:
          - texto: El que forma la recta con su proyección sobre el plano
            correcta: true
            mensaje: |
              Eso es. La proyección es la recta RT, del punto R donde r corta al plano al pie T de la
              perpendicular desde otro punto de r. De todas las rectas del plano que pasan por R, es la
              que forma con r el ángulo más pequeño, y ese es el ángulo con el plano. Por eso la
              «posición» pide R y T: el vértice del ángulo y el punto que fija su otro lado.
          - texto: El que forma con cualquier recta del plano que pase por el punto donde lo corta
            mensaje: |
              Esos ángulos cambian según la recta: van desde el que forma con la proyección hasta 90°.
              El ángulo con el plano es el más pequeño de todos, el de la proyección. Con la arista AB,
              por ejemplo, r forma 64,0°, y con el plano, menos.
          - texto: El que forma con la perpendicular al plano
            mensaje: |
              Ese es el complementario. La recta, la perpendicular y la proyección forman un triángulo
              rectángulo, así que los dos ángulos suman 90°. Sirve para calcularlo, pero hay que
              restarlo de 90°.

      # Decisión: un solo paso construir, con la posición y la magnitud. El
      # reproductor arranca cada paso desde la lámina, y el abatimiento
      # necesita R, T y t, que salen de la posición.
      - tipo: construir
        titulo: R y T, y el triángulo PTR abatido
        intro: |
          Toma P en el extremo de arriba de r₂ y el de abajo de r₁, que están en la misma vertical. Por
          P va la perpendicular t al plano ABC; T es su pie en el plano y R, el punto donde r corta al
          plano. Los dos salen con un plano auxiliar vertical que contiene a la recta, r o t. RT es la
          proyección de r sobre el plano, y el ángulo está en R, entre RP y RT. Para verlo en verdadera
          magnitud, abate el triángulo PTR sobre el plano horizontal de T, con la horizontal de PTR que
          pasa por T de charnela: T no se mueve, P₀ vale a cualquiera de los dos lados y R₀ cae al mismo
          que P₀. Marca R₂, R₁, T₂, T₁, P₀ y R₀. Avisos para el imán: t es casi de perfil, y junto a T₂ y
          a T₁ se cruzan varias rectas de la construcción. A unos 2,5 mm de T₂, h₂ corta a t₂, a 3₂4₂ y a las
          verticales de 3 y de T; a 1,2 mm de T₁, la vertical de 3₁ corta a R₁T₁ y a la charnela, que se
          trazan después. Marca T₂ y T₁ en cuanto los construyas, y amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: R2
            pide: el punto donde r corta al plano ABC, en el alzado
            es: proy_alzado(solucion.R)
            bien: |
              R₂ está en r₂, donde la corta 1₂2₂: la recta en que el plano vertical que contiene a r
              corta al plano ABC. r está en ese plano vertical, así que solo puede tocar a ABC en un
              punto de esa recta.
            diagnosticos:
              - si: 'cerca_de([proy_alzado(solucion.X_AC), proy_alzado(solucion.X_CB)])'
                mensaje: |
                  Ahí r₂ corta un lado del triángulo, pero solo en el alzado: en la planta, r₁ y ese
                  lado se cortan en otra vertical. r y el lado se cruzan sin tocarse. R es el punto de r
                  que está en el plano, y se busca con un plano auxiliar que contenga a r.
                ejemplo: proy_alzado(solucion.X_AC)
              - si: en_segmento(figura.segmento("r2"))
                mensaje: |
                  Estás en r₂, y R₂ también, pero en un punto concreto: donde la corta 1₂2₂, la recta en
                  que el plano vertical de r (el que en la planta se ve como r₁) corta al plano ABC.
                ejemplo: 'uno(medir_sobre(figura.segmento("r2"), desde: proy_alzado(solucion.R), distancia: mm(8)), 1)'
              - si: siempre
                mensaje: |
                  R₂ está en r₂. Lleva al alzado los puntos donde r₁ corta A₁C₁ y C₁B₁, que caen en A₂C₂
                  y en C₂B₂, y únelos: donde esa recta corta a r₂ está R₂.
          - nombre: R1
            pide: el punto donde r corta al plano ABC, en la planta
            es: proy_planta(solucion.R)
            bien: |
              R₁ está en la vertical de R₂, sobre r₁: el mismo punto visto desde arriba.
            diagnosticos:
              - si: '!en_vertical_de(R2)'
                mensaje: |
                  R₁ va en la **vertical de R₂**: son el mismo punto visto dos veces. Baja R₂ por su
                  línea de referencia hasta r₁.
                ejemplo: 'desplaza(proy_planta(solucion.R), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Si ya tienes R₂: R₁ está en su vertical, donde esa vertical corta a r₁.
          - nombre: T2
            pide: el pie de la perpendicular desde P al plano ABC, en el alzado
            es: proy_alzado(solucion.T)
            bien: |
              T₂ está en t₂, la perpendicular a f₂ por P₂, donde la corta 3₂4₂: la recta en que el
              plano vertical que contiene a t corta al plano ABC.
            diagnosticos:
              - si: 'en_vertical_de(figura.punto("P2"))'
                mensaje: |
                  Has trazado t₂ vertical, que es la perpendicular a una horizontal. En el alzado, la
                  perpendicular a un plano va perpendicular a sus **frontales**, que son las rectas del
                  plano que esa vista enseña en verdadera magnitud: aquí, f₂.
                ejemplo: 'desplaza(figura.punto("P2"), dy: mm(48))'
              - si: en_recta(proy_alzado(solucion.t))
                mensaje: |
                  Vas por t₂, y T₂ está en ella, pero donde t corta al plano. El plano vertical que
                  contiene a t se ve en la planta como t₁: lleva al alzado los puntos donde t₁ corta C₁B₁
                  y A₁B₁, únelos, y esa recta corta a t₂ en T₂.
                ejemplo: 'uno(medir_sobre(proy_alzado(solucion.t), desde: proy_alzado(solucion.T), distancia: mm(8)), 1)'
              - si: siempre
                mensaje: |
                  T₂ está en t₂ —la perpendicular a f₂ por P₂— y en el plano: donde t₂ corta la recta
                  3₂4₂.
          - nombre: T1
            pide: el pie de la perpendicular desde P al plano ABC, en la planta
            es: proy_planta(solucion.T)
            bien: |
              T₁ está en la vertical de T₂, sobre t₁, la perpendicular a h₁ por P₁. La vertical corta a
              t₁ muy de lado, porque t es casi de perfil: en el papel, traza fino.
            diagnosticos:
              - si: 'es_pie_perpendicular(desde: figura.punto("P1"), sobre: segmento2(proy_planta(solucion.I2), proy_planta(solucion.H)))'
                mensaje: |
                  Ahí t₁ corta a h₁. Que t₁ sea perpendicular a h₁ está bien, pero T no está en h: es
                  donde t corta al plano, y eso lo dice T₂. Baja T₂ por su vertical hasta t₁.
                ejemplo: 'pie_perpendicular(figura.punto("P1"), segmento2(proy_planta(solucion.I2), proy_planta(solucion.H)))'
              - si: '!en_vertical_de(T2)'
                mensaje: |
                  T₁ va en la **vertical de T₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.T), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Si ya tienes T₂: T₁ está en su vertical, donde esa vertical corta a t₁.
          - nombre: P0
            rotulo: P₀
            pide: P abatido sobre el plano horizontal de T, con la horizontal de PTR por T de charnela
            es: proy_planta(solucion.Pab)
            bien: |
              P₀ está en la perpendicular a la charnela por P₁, a la distancia real de P a la charnela:
              la hipotenusa del triángulo que tiene por catetos lo que separa P₁ de la charnela en la
              planta y lo que P está más alto que T. Comprobación: T₁P₀ mide 59,3 mm, lo mismo que PT de
              verdad.
            diagnosticos:
              - si: 'cerca_de(figura.punto("P1"))'
                mensaje: |
                  Ese es P₁, sin abatir. P gira alrededor de la charnela hasta quedar a la cota de T, y
                  en la planta se aparta de ella por la perpendicular que pasa por P₁.
                ejemplo: figura.punto("P1")
              - si: 'en_recta(solucion.perpP) && a_distancia(de: proy_planta(solucion.M), d: diferencia_de_cotas(P, solucion.T))'
                mensaje: |
                  Has llevado desde M solo **lo que P está más alto que T**: es un cateto. El radio es la
                  hipotenusa de ese cateto y de lo que separa P₁ de la charnela en la planta, MP₁.
                ejemplo: 'uno(medir_sobre(solucion.perpP, desde: proy_planta(solucion.M), distancia: diferencia_de_cotas(P, solucion.T)), 1)'
              - si: '!en_recta(solucion.perpP)'
                mensaje: |
                  Al abatir, P gira alrededor de la charnela en un plano perpendicular a ella, que es
                  vertical: en la planta, P₀ se mueve por la **perpendicular a la charnela que pasa por
                  P₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Pab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por P₁, pero no a la distancia buena. El radio
                  es la hipotenusa de MP₁ y de lo que P está más alto que T, P₂K: con centro en M, ese
                  radio corta la perpendicular en P₀.
          - nombre: R0
            rotulo: R₀
            pide: R abatido, al mismo lado de la charnela que P₀
            es: proy_planta(solucion.Rab)
            bien: |
              R₀ está en la perpendicular a la charnela por R₁, donde la corta r₀, la recta J₁P₀: J está
              en la charnela y no se mueve, así que r abatida pasa por J₁. El ángulo del triángulo en R₀,
              entre R₀T₁ y R₀P₀, es δ.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.Rab)))
                mensaje: |
                  Ese es R abatido **al otro lado** de la charnela. El triángulo PTR gira entero, como una
                  tapa: si P₀ ha caído a un lado, R₀ cae al mismo.
                ejemplo: proy_planta(rama(solucion.Rab, 2))
              - si: en_recta(solucion.perpR)
                mensaje: |
                  Vas por la perpendicular a la charnela por R₁, pero R₀ está donde la corta r₀. Une J₁,
                  que está en la charnela y no se mueve, con P₀.
                ejemplo: 'uno(medir_sobre(solucion.perpR, desde: proy_planta(rama(solucion.Rab, 1)), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  R₀ está en la perpendicular a la charnela que pasa por R₁ y en r₀, la recta J₁P₀, del
                  mismo lado que P₀.
        trazado:
          - proy_alzado(segmento3(solucion.R, solucion.T))
          - proy_planta(segmento3(solucion.R, solucion.T))
          - proy_alzado(segmento3(P, solucion.T))
          - proy_planta(segmento3(P, solucion.T))
          - segmento2(proy_planta(solucion.Rab), proy_planta(solucion.Pab))
          - segmento2(proy_planta(solucion.Rab), proy_planta(solucion.T))
          - segmento2(proy_planta(solucion.T), proy_planta(solucion.Pab))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("C1"), figura.punto("C2"))
            porque: |
              La **línea de referencia** de C, de C₁ a C₂. En diédrico directo no hay línea de tierra:
              las verticales se trazan paralelas a esta y las horizontales, perpendiculares, con la
              escuadra apoyada en ella.
          - con: marca
            traza: proy_planta(solucion.I1)
            rotulo: 1₁
            porque: |
              **R, donde r corta al plano.** Por r pasa un plano auxiliar vertical, que en la planta se
              ve de canto, como la propia r₁. 1₁, nombre nuestro, donde r₁ corta A₁C₁: el punto 1 está
              en el lado AC del plano y en ese plano vertical.
          - con: marca
            traza: proy_planta(solucion.I2)
            rotulo: 2₁
            porque: |
              2₁, nombre nuestro, donde r₁ corta C₁B₁: el punto 2, otro punto del plano ABC que está en
              el plano vertical de r.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I1), solucion.L_v1), segmento2(proy_planta(solucion.I2), solucion.L_v2)]'
            guia: solucion.refC
            porque: |
              Por 1₁ y por 2₁, las líneas de referencia hacia el alzado, paralelas a la de C, hasta pasar
              A₂C₂ y C₂B₂: 1 es un punto de AC y 2, de CB, y sus alzados están en esos lados.
          - con: marca
            traza: proy_alzado(solucion.I1)
            rotulo: 1₂
            porque: |
              1₂, donde la vertical de 1₁ corta A₂C₂.
          - con: marca
            traza: proy_alzado(solucion.I2)
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta C₂B₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I1), proy_alzado(solucion.I2))
            porque: |
              1₂2₂ es la **intersección** del plano vertical de r con el plano ABC, vista en el alzado.
              r está en el plano vertical, así que corta a ABC en un punto de esta recta. Corta a r₂ casi
              en ángulo recto, a 79°: el cruce sale limpio.
          - con: marca
            traza: proy_alzado(solucion.R)
            rotulo: R₂
            porque: |
              R₂, donde 1₂2₂ corta r₂: el alzado del punto de r que está en el plano ABC.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.R), solucion.L_vR)
            guia: solucion.refC
            porque: |
              Por R₂, la línea de referencia hasta la planta, más allá de r₁.
          - con: marca
            traza: proy_planta(solucion.R)
            rotulo: R₁
            porque: |
              R₁, donde esa vertical corta r₁: R, el vértice del ángulo, ya está en las dos vistas.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.I2), solucion.L_h2)
            guia: solucion.refC
            rotulo: h₂
            porque: |
              **La horizontal y la frontal del plano**, que son las que dicen cómo va su perpendicular.
              Cualquier horizontal del plano sirve; se toma la que pasa por 2, que ya está construido.
              h₂, la horizontal por 2₂: perpendicular a la línea de referencia, hacia la derecha, hasta
              pasar A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.H)
            rotulo: H₂
            porque: |
              H₂, nombre nuestro, donde h₂ corta A₂B₂: H es el punto de AB a la cota de 2.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.H), solucion.L_vH)
            guia: solucion.refC
            porque: |
              Por H₂, la línea de referencia hasta la planta, más allá de A₁B₁.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            porque: |
              H₁, donde esa vertical corta A₁B₁.
          - con: regla
            traza: segmento2(proy_planta(solucion.I2), proy_planta(solucion.H))
            rotulo: h₁
            porque: |
              h₁, de 2₁ a H₁: la planta de la horizontal, que la planta enseña en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.I1), solucion.L_f1)
            guia: solucion.refC
            rotulo: f₁
            porque: |
              f₁, la frontal por 1₁: cualquier frontal del plano sirve, y se toma la que pasa por 1, que
              ya está. En la planta, perpendicular a la línea de referencia, hacia la derecha, hasta pasar
              A₁B₁.
          - con: marca
            traza: proy_planta(solucion.F)
            rotulo: F₁
            porque: |
              F₁, nombre nuestro, donde f₁ corta A₁B₁: F es el punto de AB con el alejamiento de 1.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.F), solucion.L_vF)
            guia: solucion.refC
            porque: |
              Por F₁, la línea de referencia hasta el alzado, más allá de A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.F)
            rotulo: F₂
            porque: |
              F₂, donde esa vertical corta A₂B₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I1), proy_alzado(solucion.F))
            rotulo: f₂
            porque: |
              f₂, de 1₂ a F₂: el alzado de la frontal, que el alzado enseña en verdadera magnitud.
          - con: marca
            traza: figura.punto("P2")
            rotulo: P₂
            porque: |
              **La perpendicular desde P.** P₂, nombre nuestro: el extremo de arriba de r₂, que está en
              la misma vertical que el de abajo de r₁. Es un punto de r dado en las dos vistas.
          - con: marca
            traza: figura.punto("P1")
            rotulo: P₁
            porque: |
              P₁, el extremo de abajo de r₁, en la vertical de P₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_t1)
            guia: segmento2(proy_planta(solucion.I2), proy_planta(solucion.H))
            rotulo: t₁
            porque: |
              t₁, la planta de la perpendicular al plano por P: perpendicular a h₁, porque un ángulo
              recto se ve recto en la vista donde uno de sus lados está en verdadera magnitud, y h₁ lo
              está en la planta. Larga, hacia arriba, hasta pasar A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P2"), solucion.L_t2)
            guia: segmento2(proy_alzado(solucion.I1), proy_alzado(solucion.F))
            rotulo: t₂
            porque: |
              t₂, el alzado de la perpendicular: perpendicular a f₂, por lo mismo, con la frontal. Larga,
              hacia abajo, hasta pasar C₂B₂. t₁ y t₂ salen casi verticales: t es casi una recta de
              perfil.
          - con: marca
            traza: proy_planta(solucion.I3)
            rotulo: 3₁
            porque: |
              **T, el pie de la perpendicular.** Como con r: por t pasa un plano vertical, que en la
              planta se ve como t₁. 3₁, nombre nuestro, donde t₁ corta C₁B₁.
          - con: marca
            traza: proy_planta(solucion.I4)
            rotulo: 4₁
            porque: |
              4₁, nombre nuestro, donde t₁ corta A₁B₁: otro punto del plano ABC que está en el plano
              vertical de t.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I3), solucion.L_v3), segmento2(proy_planta(solucion.I4), solucion.L_v4)]'
            guia: solucion.refC
            porque: |
              Por 3₁ y por 4₁, las líneas de referencia hacia el alzado, hasta pasar C₂B₂ y A₂B₂. Van
              juntas, a 2 mm, porque t es casi de perfil.
          - con: marca
            traza: proy_alzado(solucion.I3)
            rotulo: 3₂
            porque: |
              3₂, donde la vertical de 3₁ corta C₂B₂.
          - con: marca
            traza: proy_alzado(solucion.I4)
            rotulo: 4₂
            porque: |
              4₂, donde la vertical de 4₁ corta A₂B₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I3), proy_alzado(solucion.I4))
            porque: |
              3₂4₂, la intersección del plano vertical de t con el plano ABC, en el alzado: t lo corta en
              un punto de esta recta. La corta a 12°, muy de lado: en el papel, traza fino.
          - con: marca
            traza: proy_alzado(solucion.T)
            rotulo: T₂
            porque: |
              T₂, donde 3₂4₂ corta t₂: el alzado del pie de la perpendicular.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.T), solucion.L_vT)
            guia: solucion.refC
            porque: |
              Por T₂, la línea de referencia hasta la planta, más allá de t₁. Corta a t₁ a menos de 6°,
              casi encima de ella.
          - con: marca
            traza: proy_planta(solucion.T)
            rotulo: T₁
            porque: |
              T₁, donde esa vertical corta t₁: T ya está en las dos vistas.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.R), proy_planta(solucion.T)), segmento2(proy_alzado(solucion.R), proy_alzado(solucion.T))]'
            porque: |
              **La posición.** R₁T₁ y R₂T₂: la proyección de r sobre el plano. El ángulo de r con el
              plano tiene el vértice en R y sus lados son RP y RT, pero en ninguna de las dos vistas está
              en verdadera magnitud, porque el plano PTR no es horizontal ni frontal.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.T), solucion.L_hJ)
            guia: solucion.refC
            porque: |
              **La magnitud: el triángulo PTR abatido.** Su charnela es la horizontal del plano PTR que
              pasa por T. En el alzado es la horizontal por T₂: perpendicular a la línea de referencia,
              hacia la izquierda, hasta pasar r₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, nombre nuestro, donde esa horizontal corta r₂: J es el punto de r a la cota de T, y
              está en la charnela.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.J), solucion.L_vJ)
            guia: solucion.refC
            porque: |
              Por J₂, la línea de referencia hasta la planta, más allá de r₁.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde esa vertical corta r₁.
          - con: regla
            traza: segmento2(proy_planta(solucion.J), solucion.L_ch)
            rotulo: charnela
            porque: |
              La **charnela**: J₁T₁, unida con la regla y prolongada más allá de T₁, larga, porque el pie
              de P en ella cae más allá. Es una horizontal, y la planta la da en verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("P1"), solucion.L_pM), segmento2(figura.punto("P1"), solucion.L_pP0)]'
            guia: segmento2(proy_planta(solucion.J), proy_planta(solucion.T))
            porque: |
              Por P₁, la **perpendicular a la charnela**, larga hacia los dos lados: hasta pasar la
              charnela prolongada y, hacia abajo, bien lejos de P₁. Al abatir, P gira alrededor de la
              charnela en un plano perpendicular a ella, que es vertical, y su planta no se sale de esta
              recta.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M
            porque: |
              M, nombre nuestro, donde la perpendicular corta la charnela prolongada: el pie de P en la
              charnela. MP₁ es un cateto del triángulo del radio.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P2"), solucion.L_vK)
            guia: solucion.refC
            porque: |
              En el alzado, por P₂, la vertical hasta pasar la horizontal de T₂: el otro cateto es lo que
              P está más alto que T.
          - con: marca
            traza: solucion.K2
            porque: |
              K, nombre nuestro, donde esa vertical corta la horizontal de T₂, 3 mm a la izquierda de T₂:
              va sin rótulo, que taparía T₂. P₂K, 48,7 mm, es lo que P está más alto que T.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_par)
            guia: segmento2(proy_planta(solucion.J), proy_planta(solucion.T))
            porque: |
              Por P₁, la paralela a la charnela, hacia la izquierda, larga: en ella se lleva el segundo
              cateto, perpendicular al primero.
          - con: compas
            traza: 'arco(figura.punto("P1"), por: solucion.Pp, desde: desplaza(solucion.Pp, dx: -4.85, dy: 6.36), hasta: desplaza(solucion.Pp, dx: 4.85, dy: -6.36))'
            toma: segmento2(figura.punto("P2"), solucion.K2)
            porque: |
              Con el compás, P₂K, llevada desde P₁ sobre la paralela. A la derecha de P₁ valdría igual:
              el triángulo saldría reflejado, con la misma hipotenusa; aquí, a la izquierda, donde hay
              sitio.
          - con: marca
            traza: solucion.Pp
            rotulo: (P₀)₁
            porque: |
              (P₀)₁, donde el arco corta la paralela. El triángulo M P₁ (P₀)₁ es rectángulo en P₁, y su
              hipotenusa M(P₀)₁, 56,6 mm, es la distancia real de P a la charnela: el radio del
              abatimiento.
          - con: compas
            traza: 'arco(proy_planta(solucion.M), por: solucion.Pp, desde: solucion.Pp, hasta: desplaza(proy_planta(rama(solucion.Pab, 1)), dx: 6, dy: 4.6))'
            porque: |
              Con centro en M y radio M(P₀)₁, el arco desde (P₀)₁ hasta pasar la perpendicular. La
              circunferencia entera la cortaría dos veces, una a cada lado de la charnela, y las dos son
              P abatido; aquí, la de abajo, del lado de P₁, hacia donde va el arco. La otra, arriba a la
              derecha, también vale, y R₀ caería con ella.
          - con: marca
            traza: proy_planta(rama(solucion.Pab, 1))
            rotulo: P₀
            porque: |
              P₀, donde el arco corta la perpendicular por P₁: P abatido sobre el plano horizontal de T.
          - con: regla
            traza: segmento2(proy_planta(solucion.J), proy_planta(rama(solucion.Pab, 1)))
            rotulo: r₀
            porque: |
              r₀, la recta r abatida: de J₁, que está en la charnela y no se mueve, a P₀. Es la
              **afinidad**: una recta y su abatida se cortan en la charnela.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.R), solucion.L_pR)
            guia: segmento2(proy_planta(solucion.J), proy_planta(solucion.T))
            porque: |
              Por R₁, la perpendicular a la charnela, hacia abajo, hasta pasar r₀: R gira como P, y su
              planta se mueve por esta recta.
          - con: marca
            traza: proy_planta(rama(solucion.Rab, 1))
            porque: |
              R₀, donde esa perpendicular corta r₀, 6 mm abajo a la izquierda de R₁: R abatido, al mismo
              lado que P₀. Va sin rótulo, que tocaría R₁.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.Rab, 1)), proy_planta(solucion.T)), segmento2(proy_planta(solucion.T), proy_planta(rama(solucion.Pab, 1)))]'
            porque: |
              R₀T₁ y T₁P₀: el triángulo PTR abatido, en verdadera magnitud, con el lado R₀P₀ sobre r₀. T
              no se ha movido, y el ángulo en T₁ es recto: la comprobación.
          - con: transportador
            traza: 'arco(proy_planta(rama(solucion.Rab, 1)), por: proy_planta(rama(solucion.X_r0, 1)), desde: proy_planta(rama(solucion.X_r0, 1)), hasta: proy_planta(solucion.T))'
            porque: |
              El transportador con el centro en R₀, desde r₀ —donde cruza C₁B₁— hasta R₀T₁: el ángulo
              entre R₀P₀ y R₀T₁ es δ, el de r con el plano, 56,9°. El de P₀ es su complementario.
        pista: |
          (1) R: por r va un plano vertical, que en la planta es r₁. Sube al alzado los puntos donde r₁
          corta A₁C₁ y C₁B₁, y únelos: esa recta corta r₂ en R₂. (2) La horizontal y la frontal del
          plano, y por P la perpendicular: t₁ perpendicular a h₁, t₂ perpendicular a f₂. (3) T, igual que
          R, con t. (4) Abate PTR con su horizontal por T: J₂, donde la horizontal de T₂ corta r₂; la
          charnela es J₁T₁. (5) P₀ con el triángulo del radio; R₀ por afinidad, en J₁P₀.
        desarrollo: |
          R cae dentro del triángulo en las dos vistas, y T también. En verde claro, la proyección de r
          sobre el plano, RT, y la perpendicular PT; y el triángulo abatido P₀T₁R₀, rectángulo en T₁, con
          PT = 59,3 mm, RT = 38,7 mm y PR = 70,8 mm de verdad. El ángulo en R₀ es δ.

      # Decisión: ABC se toma como una lámina opaca, como en las
      # intersecciones del tema 4. La hoja no pide la visibilidad; va porque
      # queda un tramo oculto de r en cada vista. Con un plano transparente, r
      # iría entera en continua, y el veredicto lo dice.
      - tipo: dibujar
        consigna: |
          Repasa r en las dos vistas tomando el triángulo ABC como una lámina opaca: lo visto en
          continua y lo oculto en discontinua. Repasa también t, de P a T, y la proyección RT.
        comprueba:
          - punto: En la planta, r₁ va oculta entre 1₁, donde entra en el triángulo por A₁C₁, y R₁; vista en el resto.
            porque: >-
              Desde arriba se ve lo de más cota. En el cruce aparente de r₁ con A₁C₁, r va 10,2 mm por
              debajo de AC: de ahí hasta R, r está debajo del plano. En R lo atraviesa, y en el cruce
              con C₁B₁ ya va 26,6 mm por encima.
          - punto: En el alzado, r₂ va oculta entre R₂ y donde sale del triángulo por C₂B₂; vista en el resto.
            porque: >-
              Desde delante se ve lo de más alejamiento. En el cruce aparente de r₂ con A₂C₂, r va
              34,2 mm por delante de AC, y en el de C₂B₂, 21,4 mm por detrás: el tramo de R a C₂B₂
              queda detrás de la lámina.
          - punto: t y RT, vistas en las dos vistas.
            porque: >-
              P está encima del plano y delante de él, y t va de P a T sin atravesarlo: queda entera
              del lado que se ve desde arriba y desde delante. RT está sobre esa misma cara.
          - punto: Fuera del contorno del triángulo, r va en continua en las dos vistas.
            porque: >-
              La lámina solo tapa lo que queda dentro de su contorno; fuera, nada se interpone entre r
              y quien mira.
        figura: |
          <figure>
          <svg viewBox="0 0 252 488" role="img" width="252" height="488" aria-labelledby="sd63-vis-t sd63-vis-d">
            <title id="sd63-vis-t">La recta r y el triángulo ABC opaco, con lo visto y lo oculto</title>
            <desc id="sd63-vis-d">Arriba el alzado y abajo la planta del triángulo ABC, a la escala de la lámina, con la recta r, el punto R donde corta al plano, T, el pie de la perpendicular desde P, la perpendicular PT y la proyección RT. En la planta, r₁ va en discontinua desde donde entra en el triángulo por A₁C₁ hasta R₁: en ese cruce aparente r va 10,2 mm por debajo de AC. De R₁ en adelante va en continua: en el cruce con C₁B₁ va 26,6 mm por encima de CB. En el alzado, r₂ va en continua hasta R₂, porque en el cruce con A₂C₂ va 34,2 mm por delante de AC, y en discontinua de R₂ hasta donde sale por C₂B₂, donde va 21,4 mm por detrás de CB. PT y RT van en continua en las dos vistas: P está encima del plano y delante de él, y RT, sobre la cara que se ve.</desc>
