      El tramo de la izquierda está roscado en sus primeros 20 mm, y el agujero de Ø6 atraviesa
      el eje. Son **funcionales** el asiento del rodamiento, que es el tramo de Ø25, y la rosca:
      su designación y su longitud útil.

      ¿Qué candidatas hay que añadir para que el eje quede definido, sin repetir ninguna medida
      y sin ningún descuento de la hoja de criterios?
    pide: Los números de las candidatas que completan la acotación del eje.
    pasos:
      - tipo: reconocer
        pregunta: Este eje se dibuja en una sola vista. ¿Por qué es suficiente una?
        opciones:
          - texto: Porque el símbolo Ø delante de cada diámetro ya dice que cada tramo es un cilindro
            correcta: true
            mensaje: |
              Eso es. El libro lo dice así: utilizar los símbolos evita hacer una nueva vista para
              conocer la forma de la pieza (pág. 4-10). Y la hoja de criterios cobra la vista de
              más: «En una pieza por revolución no normalizada, indicar otra vista además de la
              vista principal (quizás se necesiten detalles, cortes o secciones): -1 por cada vista
              principal extra».
          - texto: No es suficiente, hace falta un perfil que enseñe que las secciones son circulares
            mensaje: |
              El Ø ya lo dice, y el perfil sería una vista principal de más. La hoja de criterios
              la cobra: −1 por cada vista principal extra en una pieza de revolución.
          - texto: Porque a escala 1:2 no cabe otra vista en la hoja
            mensaje: |
              La escala no tiene nada que ver. Aunque cupieran tres vistas, en una pieza de
              revolución sobran: el Ø de cada tramo ya dice que es un cilindro.

      # Decisión (revisión, hallazgo 1): el enunciado declara funcional la
      # longitud útil de la rosca, y los mensajes lo fundan en el libro (pág.
      # 5-18: la rosca útil se acota desde el extremo) y en las diapositivas
      # (pág. 7, rec. 1: las funcionales van expresas). Con ese enunciado,
      # {9, 11, 14} es la única respuesta; sin él, {9, 12, 14} también
      # definiría el eje (`guiones\comprueba-cotas.mjs` lo comprueba).
      - tipo: calcular
        titulo: Las candidatas que faltan
        pregunta: Escribe los números de las candidatas que hay que añadir.
        respuesta:
          tipo: conjunto
          valor: '9, 11, 14'
          tolerancia: 0.1
          formato: los números de las cotas, separados por comas
        distractores:
          # Los seis subconjuntos estrictos de {9, 11, 14}: cada uno deja una cota sin poner.
          - valor: '9'
            mensaje: |
              Te faltan la 11 y la 14. Sin la 11, la longitud de la rosca no está acotada, y la hoja
              de criterios la cobra aparte: «No acotar la longitud/profundidad de la rosca: -0,5 por
              cada caso». Sin la 14, nada sitúa el agujero de Ø6 a lo largo del eje.
          - valor: '11'
            mensaje: |
              Te faltan la 9 y la 14. Sin la 9, la rosca se queda sin designación: ni diámetro ni
              paso. Es funcional —en el tornillo de las diapositivas, el diámetro y la longitud de
              la rosca van marcados F (pág. 4)—, y una funcional que falta cuesta −0,5. Sin la 14,
              nada sitúa el agujero.
          - valor: '14'
            mensaje: |
              Te faltan la 9 y la 11: la designación de la rosca y su longitud. Sin la 9 la rosca no
              tiene ni diámetro ni paso, y es funcional (−0,5). Sin la 11, «No acotar la
              longitud/profundidad de la rosca: -0,5 por cada caso».
          - valor: '9, 11'
            mensaje: |
              Te falta la 14. Nada sitúa el agujero de Ø6 a lo largo del eje: las cotas puestas
              llegan a los escalones y al final, pero ninguna a su eje. Falta una cota no funcional,
              y la hoja de criterios cobra «-0,25 por cada una (máximo -1 por pieza)».
          - valor: '9, 14'
            mensaje: |
              Te falta la 11, la longitud de la rosca. El 24 llega al primer escalón, no al final de
              la rosca, y la hoja de criterios lo cobra: «No acotar la longitud/profundidad de la
              rosca: -0,5 por cada caso».
          - valor: '11, 14'
            mensaje: |
              Te falta la 9. La rosca se queda sin designación: ni diámetro ni paso. Es funcional
              —en el tornillo de las diapositivas, el diámetro y la longitud de la rosca van
              marcados F (pág. 4)—, y una funcional que falta cuesta −0,5.
          # Los conjuntos que cometen un error de la hoja de criterios.
          - valor: '10, 11, 14'
            mensaje: |
              La 10 acota la rosca con Ø. Eso dice que ahí hay un cilindro liso de 16 mm, y quien
              fabrique la pieza no la roscará. Está entre los mínimos para comenzar a corregir el
              ejercicio: «Al acotar una rosca, utilizar el símbolo M y no el símbolo de diámetro
              Ø». La buena es la 9, M16.
          - valor: '9, 12, 14'
            mensaje: |
              Con la 12, el final de la rosca sale por diferencia, 24 − 4 = 20, y ninguna cota da la
              longitud de la rosca. El libro acota la rosca útil desde el extremo, como la 11, y no lo
              que queda entre la rosca y el escalón (pág. 5-18). Y el enunciado dice que esa longitud
              es funcional: las funcionales van expresas, sin tener que consultar otras cotas
              (diapositivas, pág. 7). En la hoja de criterios, una longitud de rosca sin acotar es «No
              acotar la longitud/profundidad de la rosca: -0,5 por cada caso», y como funcional que
              falta el precio es el mismo: «Faltan cotas funcionales: -0,5 por cada una (máximo -1,5
              por pieza)». La rosca útil se acota directamente, con la 11.
          - valor: '9, 11, 13'
            mensaje: |
              La 13 dice 14, y la pieza mide 28: si el agujero está a 12 del extremo, como dice la
              14, está a 114 − 12 − 74 = 28 del collar, y la figura, que guarda las proporciones, lo
              enseña así. 14 es justo la mitad: es lo que mide en el papel a escala 1:2. «Acotar
              y/o dibujar sin tener en cuenta la escala» es un error muy grave de la hoja de
              criterios: −2. La cota dice siempre la medida real.
          - valor: '9, 11, 13, 14'
            mensaje: |
              Las dos cotas del agujero no pueden ir juntas: con el collar a 74 del extremo, 74 + 28
              + 12 = 114 ya cierra la cadena. Y la 13, además, dice 14 donde la pieza mide 28: es la
              medida del papel a escala 1:2, el error muy grave de «Acotar y/o dibujar sin tener en
              cuenta la escala» (−2). Quédate con la 14.
        pista: |
          Mira qué no sale de las cotas puestas: la rosca, su longitud y la posición del agujero.
          Para cada una hay una candidata buena y otra con trampa.
        desarrollo: |
          Lo que las cotas puestas ya definen: los diámetros de los tres tramos lisos, el agujero
          de Ø6, los escalones (24, 40 y 10) y el largo total (114). Lo que falta, y quién lo da:

          - **La rosca.** M16, la **9**. La 10 la acota con Ø, y eso es un mínimo de la hoja de
            criterios.
          - **Su longitud.** 20, la **11**, expresa: el enunciado dice que es funcional, y el libro
            acota la rosca útil desde el extremo (pág. 5-18). Con la 12 saldría por diferencia,
            24 − 4, y ninguna cota la daría.
          - **El agujero.** 12 desde el extremo, la **14**. La 13 dice 14 donde la pieza mide
            114 − 12 − 74 = 28: es la medida del papel a 1:2.

          Faltan la 9, la 11 y la 14.

      - tipo: justificar
        pregunta: Ordena por qué faltan esas tres. Una pieza es falsa.
        piezas:
          - texto: Las cotas puestas definen los diámetros, el agujero y los escalones, pero no la rosca, su longitud ni la posición del agujero.
          - texto: La rosca se acota con M16 y con su longitud útil, 20, las dos expresas, que son la 9 y la 11.
          - texto: El agujero se sitúa con la 14, a 12 del extremo, porque la 13 dice 14 donde la pieza mide 28.
          - texto: Con la 9, la 11 y la 14, cada medida sale una sola vez y el eje queda definido.
          - texto: La 12 vale igual que la 11, porque con 24 − 4 también sale el final de la rosca.
            trampa: true
            mensaje: |
              Sale, pero sale por diferencia. La longitud útil de la rosca es funcional y va expresa
              (diapositivas, pág. 7), y el libro la acota desde el extremo (pág. 5-18). Si ninguna
              cota la da, la hoja de criterios cobra «No acotar la longitud/profundidad de la rosca:
              -0,5 por cada caso».
    resolucion: |
      **Lo que ya está.** Los diámetros de los tres tramos lisos, el agujero de Ø6, los tres
      primeros tramos (24, 40 y 10) y el largo total, 114, que da el último por diferencia. Con
      una vista es suficiente: el Ø dice que cada tramo es un cilindro.

      **La rosca.** Se acota con M16, la 9, y con su longitud útil, la 11, las dos expresas: el
      enunciado dice que son funcionales, y el libro acota la rosca útil desde el extremo
      (pág. 5-18). La 10 la acotaría con Ø, que es uno de los mínimos de la hoja de criterios, y
      con la 12 la longitud de la rosca saldría por diferencia, 24 − 4 = 20, sin ninguna cota que
      la dé.

      **El agujero.** Nada lo sitúa a lo largo del eje. La 14 lo pone a 12 del extremo. La 13
      dice 14, pero entonces estaría a 28 del collar: 14 es la mitad, la medida del papel a
      escala 1:2, y una cota dice siempre la medida real.

      Faltan la 9, la 11 y la 14.
