ejercicios:
  # Orden (§04): los dos son nuestros y de entrada (`ejemplo`). No hay
  # ejercicios de acotación con enunciado y solución en el material: el
  # cuaderno del segundo cuatrimestre trae piezas para acotar (págs. 38-43)
  # sin medidas ni solución, y el «acótalas» de las marcas 2 y 8 es de t12
  # (k-t12b). Las dos piezas son nuestras, dibujadas a escala.
  #
  # Decisión: COMP2 con `conjunto` sobre cotas numeradas (PLAN-K §4.5). La
  # elección es real —cada cota se juzga contra un principio escrito— y se
  # verifica: `guiones\comprueba-cotas.mjs` reconstruye cada pieza desde sus
  # cotas, eje por eje, y recorre todos los subconjuntos posibles. En los dos
  # ejemplos hay una sola respuesta que deja la pieza bien acotada. Para que
  # lo sea, el enunciado dice cuáles son las cotas funcionales: en una cadena
  # cerrada sobra la no funcional (Acotacin.pdf, pág. 7, rec. 1: «Las cotas
  # funcionales deben colocarse de manera expresa»).
  #
  # Decisión: se declaran como distractores TODOS los subconjuntos estrictos
  # de cada respuesta. Si no, `EjercicioGuiado` contesta a una respuesta
  # incompleta con «Una ecuación de grado n tiene n soluciones en los
  # complejos» (l. 1290-1300), que aquí no tiene sentido (lo avisó k-t07).
  - id: acot-que-cotas-sobran
    titulo: Un soporte con trece cotas, y cuáles sobran
    fuente: Ejemplo introductorio · Road to Ingeniería. La pieza y su acotación son nuestras. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      Un compañero ha acotado este soporte en alzado y planta, y le han salido trece cotas.
      Cada una lleva su número en un círculo, que solo sirve para nombrarla aquí: no es
      parte del plano.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 470" role="img" width="360" height="470" aria-labelledby="ej-sobran-t ej-sobran-d">
        <title id="ej-sobran-t">Un soporte en L en alzado y planta, con trece cotas numeradas</title>
        <desc id="ej-sobran-d">Arriba, el alzado: una base de 90 de largo y 14 de alto, y a la izquierda un respaldo de 18 de espesor que sube hasta 60, con un chaflán en su arista alta exterior. Dos agujeros de la base se ven como líneas de trazos. Abajo, la planta: un rectángulo de 90 por 50 con la línea del respaldo y la del chaflán, y los dos agujeros vistos como circunferencias. Cotas, cada una con su número en un círculo. Alzado: 1, el chaflán 2×45°; 2, la altura total 60, a la izquierda; 3 y 4, a la derecha y en serie, 46 desde la base hasta arriba y 14 de espesor de la base; 5, Ø12 entre las líneas de trazos del primer agujero, debajo del alzado. Planta: 6, el fondo 50, a la izquierda; 7, 2×Ø12 en el primer agujero; 8, Ø12 en el segundo; 9, 25 desde el borde delantero hasta los ejes de los agujeros, a la derecha; debajo, 10, el espesor del respaldo 18; 11, 26 entre los ejes de los agujeros; 12, 48 desde el borde izquierdo hasta el primer agujero; y 13, el largo total 90.</desc>
