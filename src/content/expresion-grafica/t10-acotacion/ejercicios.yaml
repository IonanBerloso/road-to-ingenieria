      En el montaje mandan tres medidas, que son las **funcionales**: el espesor de la base,
      la altura total y la distancia entre los dos agujeros. Los agujeros atraviesan la base.

      ¿Qué cotas sobran? Quítalas de forma que la pieza siga definida, que ninguna medida
      salga dos veces y que no quede ninguna cota donde no se puede poner.
    pide: Los números de las cotas que hay que quitar para que la acotación sea la necesaria y suficiente.
    pasos:
      - tipo: reconocer
        pregunta: Una misma medida aparece dos veces en un plano. ¿Con cuál te quedas?
        opciones:
          - texto: Con la de la vista donde su elemento se ve más claro, junto a las demás cotas de ese elemento
            correcta: true
            mensaje: |
              Eso es. El libro lo pide con todas las letras: cada cota se escribe nada más una
              vez, y sobre la vista que representa más claramente los elementos (pág. 4-5). Y las
              diapositivas añaden que las cotas de un mismo elemento van agrupadas, en la misma
              vista (pág. 7).
          - texto: Con las dos, para que quien fabrica la pieza tenga dónde mirar
            mensaje: |
              Dos cotas de la misma medida son dos sitios donde puede haber dos números distintos,
              y entonces nadie sabe cuál vale. Por eso cada cota se escribe nada más una vez.
          - texto: Con la que esté más cerca de la pieza
            mensaje: |
              La cercanía no decide. Decide en qué vista se ve mejor el elemento: el diámetro de un
              agujero, donde el agujero es una circunferencia, y no donde son dos líneas de trazos.
          - texto: Con la del alzado, que es la vista principal
            mensaje: |
              El alzado es la vista que más dice de la pieza, pero no de cada elemento. Un agujero
              que atraviesa una base se ve entero en la planta; en el alzado son dos líneas de
              trazos, y esas no se acotan.

      - tipo: calcular
        titulo: Las cotas que sobran
        pregunta: Escribe los números de las cotas que sobran.
        respuesta:
          tipo: conjunto
          valor: '3, 5, 8'
          tolerancia: 0.1
          formato: los números de las cotas, separados por comas
        distractores:
          # Los seis subconjuntos estrictos de {3, 5, 8}: una respuesta incompleta.
          - valor: '3'
            mensaje: |
              Te faltan la 5 y la 8. La 5 da el diámetro del primer agujero sobre sus líneas de
              trazos: repite el que ya da la 7 en la planta, y acotar líneas discontinuas es uno de
              los errores muy graves de la hoja de criterios, −2. Y la 8 repite el diámetro que el
              «2×» de la 7 ya da a los dos agujeros.
          - valor: '5'
            mensaje: |
              Te faltan la 3 y la 8. 14 + 46 = 60 es una cadena cerrada, así que una de las tres
              sobra; como 14 y 60 son funcionales y van expresas, sobra la 46, la 3. Y la 8 repite lo
              que ya dice el «2×Ø12» de la 7.
          - valor: '8'
            mensaje: |
              Te faltan la 3 y la 5. La 46 cierra la cadena 14 + 46 = 60, en la que 14 y 60 son
              funcionales. Y la 5 da el diámetro sobre las líneas de trazos del alzado: repite la 7, y
              acotar líneas discontinuas es un error muy grave, −2.
          - valor: '3, 5'
            mensaje: |
              Te falta la 8. El «2×» de la 7 ya dice que los dos agujeros miden Ø12, así que el Ø12
              del segundo repite una medida que ya está.
          - valor: '3, 8'
            mensaje: |
              Te falta la 5. El diámetro sobre las líneas de trazos del alzado repite la 7 y, además,
              «Acotar rayas discontinuas» es uno de los errores muy graves de la hoja de criterios:
              −2.
          - valor: '5, 8'
            mensaje: |
              Te falta la 3. 14 + 46 = 60 cierra una cadena, así que una de las tres sobra. 14 y 60
              son funcionales y tienen que ir expresas, sin sumar otras para sacarlas: la que sobra
              es la 46.
          # Los conjuntos que cometen un error de la hoja de criterios.
          - valor: '3, 7'
            mensaje: |
              Has quitado la 7 y has dejado la 5. El primer agujero se queda con su diámetro sobre
              las líneas de trazos del alzado, y «Acotar rayas discontinuas» es uno de los errores
              muy graves de la hoja de criterios: −2. Quita la 5, que repite a la 7, y deja la 7 en
              la planta, donde el agujero es una circunferencia.
          - valor: '2, 5, 8'
            mensaje: |
              Quitas la 2, el 60, que es funcional. La cadena 14 + 46 = 60 tenía que perder una, pero
              no esa: las funcionales van expresas, sin tener que sumar otras para sacarlas. En la
              hoja de criterios, «Faltan cotas funcionales: -0,5 por cada una (máximo -1,5 por
              pieza)». La que sobra es la 46.
          - valor: '4, 5, 8'
            mensaje: |
              Quitas la 4, el 14, que es funcional: es el espesor de la base. La cadena 14 + 46 = 60
              tenía que perder una, pero no una funcional. En la hoja de criterios, «Faltan cotas
              funcionales: -0,5 por cada una (máximo -1,5 por pieza)». La que sobra es la 46.
          - valor: '3, 5, 8, 9'
            mensaje: |
              La 9 no sobra. Que los agujeros estén a 25 de un fondo de 50 no lo dice nada del dibujo
              hasta que lo dice una cota, o el signo = de una simetría: sin ella, quien fabrica la
              pieza no sabe dónde taladrar. Falta una cota no funcional, y la hoja de criterios cobra
              «-0,25 por cada una (máximo -1 por pieza)».
          - valor: '3, 5, 8, 13'
            mensaje: |
              La 13 no sobra. Sin el 90, nada dice dónde acaba la base por la derecha: ninguna otra
              cota llega a ese extremo. Falta una cota no funcional, y la hoja de criterios cobra
              «-0,25 por cada una (máximo -1 por pieza)».
          - valor: '3, 5, 7'
            mensaje: |
              Has quitado la 7 en vez de la 8. El «2×» era lo que daba el diámetro a los dos
              agujeros: sin él, el primero se queda sin diámetro, porque la 5, que lo daba sobre las
              líneas de trazos, también la quitas. Falta una cota no funcional, y la hoja de
              criterios cobra «-0,25 por cada una (máximo -1 por pieza)». Deja la 7 y quita la 8.
        pista: |
          Busca tres cosas: una cadena cerrada de cotas en un mismo eje, un diámetro escrito dos
          veces y una cota que se apoya en líneas de trazos.
        desarrollo: |
          Eje por eje, cada medida tiene que salir una sola vez.

          - **Alturas.** 14 + 46 = 60: la 4, la 3 y la 2 forman una cadena cerrada, y sobra una.
            14 y 60 son funcionales y van expresas, así que sobra la **3**.
          - **Diámetros.** La 7, «2×Ø12», da el diámetro de los dos agujeros. La **8** lo repite
            en el segundo, y la **5** lo repite en el primero sobre sus líneas de trazos, que es
            además un error muy grave.
          - **Lo demás no sobra.** A lo largo: 18, 48, 26 y 90 sitúan el respaldo, los dos
            agujeros y el final, y ninguna se deduce de las otras. A lo ancho: 50 y 25. El
            chaflán, con su 2×45°.

          Sobran la 3, la 5 y la 8.

      - tipo: justificar
        pregunta: Ordena por qué sobran esas tres. Una pieza es falsa.
        piezas:
          - texto: Cada medida se da una sola vez, en la vista donde mejor se ve su elemento.
          - texto: 14 + 46 = 60 cierra una cadena, y como 14 y 60 son funcionales y van expresas, sobra la 3.
          - texto: La 5 da el diámetro del primer agujero sobre líneas de trazos y repite la 7, así que sobra, y además es un error muy grave.
          - texto: La 8 repite el diámetro que el «2×» de la 7 ya da a los dos agujeros.
          - texto: La 9 también sobra, porque 25 es la mitad de 50 y se ve que los agujeros están en medio.
            trampa: true
            mensaje: |
              Verse no basta: el dibujo no es una medida. Sin la cota, o sin el signo = que declara
              la simetría, nada dice que los agujeros estén en medio, y quitarla es dejar una cota
              no funcional sin poner.
    resolucion: |
      **Necesarias y suficientes.** Cada medida tiene que poder leerse sin medir el dibujo, y
      ninguna puede salir dos veces. En una pieza así se comprueba eje por eje: cada elemento
      tiene que quedar sujeto a los demás por una cadena de cotas, y ninguna cadena puede
      cerrarse.

      **La cadena cerrada.** En las alturas, 14 + 46 = 60: sobra una de las tres. Como el
      espesor de la base y la altura total son funcionales, van expresas, y la que sobra es la
      46, la cota 3.

      **Los diámetros.** El «2×Ø12» de la 7 vale para los dos agujeros, así que el Ø12 de la 8
      lo repite. Y la 5 lo repite otra vez, ahora sobre las líneas de trazos del alzado: además
      de repetida, es el error muy grave de acotar líneas discontinuas, que cuesta dos puntos.

      **Lo que no sobra.** 18, 48, 26 y 90 sitúan a lo largo el respaldo, los dos agujeros y
      el final de la base; 50 y 25, a lo ancho; y 2×45° es el chaflán. Sobran la 3, la 5 y la
      8.

  - id: acot-que-cotas-faltan
    titulo: Un eje con ocho cotas, y cuáles le faltan
    fuente: Ejemplo introductorio · Road to Ingeniería. La pieza y su acotación son nuestras. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      Este eje está dibujado a escala 1:2, en una sola vista, y la figura respeta sus
      proporciones. Ya tiene puestas ocho cotas, de la 1 a la 8, y están bien. Para
      terminarlo hay seis candidatas, de la 9 a la 14, dibujadas en otro color. El número en
      un círculo solo sirve para nombrar cada cota.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 220" role="img" width="360" height="220" aria-labelledby="ej-faltan-t ej-faltan-d">
        <title id="ej-faltan-t">Un eje escalonado en una vista, con ocho cotas puestas y seis candidatas</title>
        <desc id="ej-faltan-d">Un eje de 114 de largo, de izquierda a derecha: un tramo de 24 roscado en sus primeros 20, dibujado con las crestas en gruesa y el fondo en fina; un tramo de Ø25 y 40 de largo; un collar de Ø35 y 10; y un tramo de Ø20 hasta el final, atravesado por un agujero de Ø6 que se ve como una circunferencia; el agujero queda mucho más cerca del extremo derecho que del collar. Cotas puestas, en negro: 1, Ø25; 2, Ø35; 3, Ø20; 4, Ø6 en el agujero; debajo, en serie, 5, 24; 6, 40; 7, 10; y 8, el largo total 114. Candidatas, en otro color: 9, M16, y 10, Ø16, las dos dentro del tramo roscado; arriba a la izquierda, 11, 20, del extremo al final de la rosca, y 12, 4, del final de la rosca al primer escalón; arriba a la derecha, en serie, 13, una cota que dice 14 del collar al eje del agujero, y 14, 12, del eje del agujero al extremo derecho.</desc>
