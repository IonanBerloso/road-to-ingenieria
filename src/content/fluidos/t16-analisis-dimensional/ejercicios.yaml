ejercicios:
  # ── NUESTRO (§08). La colección abre el capítulo 5 con una hélice de siete
  #    variables y cuatro parámetros: demasiado para entrar. Este es el caso
  #    mínimo con dos π, uno de ellos Reynolds, y el sistema de exponentes cabe
  #    en tres líneas.
  - id: ejflu16-los-dos-primeros-parametros-pi
    titulo: Cinco variables, dos parámetros, y uno de ellos es Reynolds
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      La caída de presión $\Delta p$ en un tramo de tubería depende de la
      velocidad media $v$, del diámetro $D$, de la densidad $\rho$ y de la
      viscosidad dinámica $\mu$ del fluido:

      $$
      \Delta p = f(v,\, D,\, \rho,\, \mu)
      $$

      a) Determinar cuántos parámetros adimensionales describen el fenómeno.

      b) Tomando $\rho$, $v$ y $D$ como variables repetidas, obtener el
      parámetro que contiene a $\mu$, es decir
      $\pi = \rho^{a}\,v^{b}\,D^{c}\,\mu$.

      c) Calcular su valor para agua a $20\ °\text{C}$
      ($\nu = 10^{-6}\ \text{m}^{2}/\text{s}$) circulando a
      $2\ \text{m/s}$ por un tubo de $50\ \text{mm}$.
    pide: El número de parámetros, el exponente de la densidad y el Reynolds.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos parámetros adimensionales describen este fenómeno?
        opciones:
          - texto: >-
              Dos, porque hay cinco variables y tres magnitudes fundamentales
            correcta: true
            mensaje: |
              Eso es. El teorema $\pi$ dice $n - m$: cinco variables
              —$\Delta p$, $v$, $D$, $\rho$, $\mu$— menos las tres
              fundamentales $M$, $L$, $T$.
          - texto: >-
              Cuatro, porque hay cuatro variables de las que depende la
              presión
            mensaje: |
              La variable dependiente cuenta como una más: son cinco, no
              cuatro. Y luego se restan las tres fundamentales, no se dejan
              tal cual.
          - texto: >-
              Tres, tantos como variables repetidas se han elegido
            mensaje: |
              Las repetidas son tantas como magnitudes fundamentales, sí, pero
              lo que dan es la **base** con la que se construyen los $\pi$. El
              número de parámetros es $n-m$, uno por cada variable **no**
              repetida.

      - tipo: calcular
        titulo: El exponente de la densidad
        pregunta: |
          En $\pi = \rho^{a}\,v^{b}\,D^{c}\,\mu$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              El signo. La masa solo aparece en $\rho$ y en $\mu$: la ecuación
              es $a + 1 = 0$, y $\mu$ está en el numerador con exponente $+1$.
              Para que se cancele, la densidad tiene que ir **debajo**.
          - valor: '-3'
            mensaje: |
              Ese $-3$ es el exponente de la longitud dentro de la densidad
              ($\rho = ML^{-3}$), no el exponente al que elevas $\rho$. Son
              cosas distintas: el de la tabla y el que estás buscando.
        pista: |
          Escribe solo la ecuación de la masa. Solo dos variables la llevan.
        desarrollo: |
          Con $\rho = ML^{-3}$, $v = LT^{-1}$, $D = L$ y $\mu = ML^{-1}T^{-1}$:

          $$
          \pi = (ML^{-3})^{a}(LT^{-1})^{b}(L)^{c}(ML^{-1}T^{-1}) = M^{0}L^{0}T^{0}
          $$

          Igualando exponentes, y empezando por la más corta:

          $$
          M:\; a + 1 = 0 \;\Rightarrow\; a = -1
          \qquad
          T:\; -b - 1 = 0 \;\Rightarrow\; b = -1
          $$
          $$
          L:\; -3a + b + c - 1 = 0 \;\Rightarrow\; 3 - 1 + c - 1 = 0
          \;\Rightarrow\; c = -1
          $$

          Es decir $\pi = \dfrac{\mu}{\rho v D}$, que es el **inverso** del
          número de Reynolds.

      - tipo: calcular
        titulo: El número de Reynolds
        pregunta: |
          ¿Cuánto vale $Re = \dfrac{vD}{\nu}$ en las condiciones del enunciado?
        respuesta:
          tipo: numero
          valor: '100000'
          tolerancia: 100
          formato: un número sin unidades
        distractores:
          - valor: '100000000'
            mensaje: |
              Has metido el diámetro en milímetros. En un adimensional las
              unidades tienen que cancelarse, y para eso todas van en el mismo
              sistema: $50\ \text{mm} = 0{,}05\ \text{m}$.
          - valor: '100'
            mensaje: |
              Has usado $10^{-3}$, que es la viscosidad **dinámica** del agua
              en $\text{Pa}\cdot\text{s}$. La cinemática es
              $\nu = \mu/\rho = 10^{-6}\ \text{m}^{2}/\text{s}$, y es la que
              va con $vD$ a secas.
        pista: |
          $Re = vD/\nu$, con las tres magnitudes en unidades del SI.
        desarrollo: |
          $$
          Re = \frac{v\,D}{\nu} = \frac{2 \cdot 0{,}05}{10^{-6}} = 10^{5}
          $$

          Muy por encima de 4.000, así que el flujo es **turbulento**, que es
          lo habitual en una conducción real.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con cinco variables y tres magnitudes fundamentales, el teorema
              $\pi$ garantiza dos parámetros adimensionales.
          - texto: >-
              El que contiene a $\mu$ sale $\mu/\rho v D$, que es el inverso
              de Reynolds; elevar un $\pi$ a $-1$ da otro $\pi$ igual de
              válido.
          - texto: >-
              El otro parámetro es $\Delta p/\rho v^{2}$, el número de Euler,
              y la ley del fenómeno es $Eu = \phi(Re)$.
          - texto: >-
              Como los dos parámetros son adimensionales, el análisis
              dimensional ya da la relación entre ellos sin necesidad de
              ensayar.
            trampa: true
            mensaje: |
              Esto es justo lo que el teorema **no** hace. Dice cuántos
              números hay y cuáles son; la función $\phi$ que los relaciona
              solo la da el experimento. Aquí esa función acabará siendo el
              ábaco de Moody, en el tema 18.

    resolucion: |
      **Cuántos.** Cinco variables ($\Delta p$, $v$, $D$, $\rho$, $\mu$) y tres
      magnitudes fundamentales dan $5-3 = 2$ parámetros.

      **Las repetidas valen.** $\rho$ aporta la masa, $D$ la longitud y $v$ el
      tiempo, y ninguna pareja se diferencia solo en el exponente. Son una
      elección legítima.

      **El parámetro con $\mu$.** Planteando
      $\pi = \rho^{a}v^{b}D^{c}\mu = M^{0}L^{0}T^{0}$ y resolviendo el sistema
      —masa, tiempo y por último longitud— salen $a = b = c = -1$, es decir

      $$
      \pi = \frac{\mu}{\rho v D} = \frac{1}{Re}
      $$

      **El otro.** Repitiendo con $\Delta p$ en vez de $\mu$ sale
      $\Delta p/\rho v^{2}$, el número de **Euler**. Así que la ley del
      fenómeno es $Eu = \phi(Re)$: una función de **una** variable en vez de
      cuatro. Ahí está el ahorro: cuatro variables exigen barrer un espacio de
      cuatro dimensiones en el laboratorio; una curva se levanta en una tarde.

      **El valor.** Con $\nu = 10^{-6}\ \text{m}^{2}/\text{s}$,
      $v = 2\ \text{m/s}$ y $D = 0{,}05\ \text{m}$:
      $Re = 10^{5}$, turbulento.

  # ── COLECCIÓN 5.3. El ejercicio canónico de superficie libre: escalas de
  #    Froude y el kilopondio escondido en el apartado de la fuerza.
  - id: ejflu16-la-presa-a-escala-1-49
    titulo: Una presa ensayada a escala 1 a 49
    fuente: >-
      Ejercicio 5.3 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se desea estudiar una presa mediante un modelo a escala $1{:}49$, en
      donde se mide la velocidad del agua (modelo) y resulta ser
      $0{,}4\ \text{m/s}$. El caudal máximo desaguado (prototipo) por la presa
      es de $500\ \text{m}^{3}/\text{s}$. En el modelo se midió la fuerza
      ejercida sobre la presa, resultando ser de $2{,}5\ \text{kg}$. Se pide
      calcular:

      a) Escalas de velocidades, caudales y fuerzas en función de la escala de
      longitud $\lambda$.

      b) Caudal que tiene que circular en el modelo, en l/s.

      c) Velocidad del agua en la presa, en m/s.

      d) Fuerza ejercida sobre la presa, en N.

      e) ¿Qué condiciones tiene que satisfacer el fluido para que la semejanza
      sea completa?
    pide: Las escalas y los tres valores del prototipo, más la condición del fluido.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué número adimensional hay que igualar entre modelo y prototipo?
        opciones:
          - texto: >-
              Froude, porque una presa desagua con superficie libre y ahí la
              gravedad es la que manda
            correcta: true
            mensaje: |
              Eso es. El agua toca la atmósfera, así que la presión no varía y
              lo que cambia es la cota: gobierna la gravedad. Reynolds habrá
              que sacrificarlo, y el apartado e) pregunta justamente por ese
              precio.
          - texto: >-
              Reynolds, porque siempre hay viscosidad
            mensaje: |
              Viscosidad hay siempre, pero eso no la hace dominante. En un
              flujo con superficie libre las fuerzas gravitatorias son muy
              superiores a las viscosas, y quien manda es **Froude**. Si
              igualas Reynolds aquí, el problema sale completo y entero mal.
          - texto: >-
              Los dos a la vez, que es lo que exige la semejanza absoluta
            mensaje: |
              Eso es lo que exige, sí, y por eso no se puede: con el mismo
              fluido en los dos las dos condiciones piden velocidades
              distintas y solo coinciden en $\lambda = 1$. El apartado e) lo
              cuantifica.

      - tipo: calcular
        titulo: El caudal del modelo
        pregunta: |
          ¿Qué caudal tiene que circular por el modelo?
        respuesta:
          tipo: magnitud
          valor: '29.75 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '208.3 l/s'
            mensaje: |
              Has escalado solo el área. El caudal es velocidad **por** área, y
              la velocidad también cambia: $\lambda^{1/2}\cdot\lambda^{2} =
              \lambda^{5/2}$, no $\lambda^{2}$.
          - valor: '4.25 l/s'
            mensaje: |
              Ese es $\lambda^{3}$, que es la escala de **fuerzas** (y la de
              volúmenes). El caudal es un volumen por unidad de tiempo, y el
              tiempo también se escala: queda $\lambda^{5/2}$.
        pista: |
          $Q = v\,A$, con $v \propto \lambda^{1/2}$ y $A \propto \lambda^{2}$.
        desarrollo: |
          $$
          \frac{Q_m}{Q_p} = \frac{v_m}{v_p}\cdot\frac{A_m}{A_p}
          = \lambda^{1/2}\cdot\lambda^{2} = \lambda^{5/2}
          $$
          $$
          Q_m = 500\left(\tfrac{1}{49}\right)^{5/2}
          = \frac{500}{49^{2}\cdot 7} = \frac{500}{16807}
          = 0{,}02975\ \text{m}^{3}/\text{s} = 29{,}75\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La velocidad en la presa real
        pregunta: |
          ¿A qué velocidad circula el agua en el prototipo?
        respuesta:
          tipo: magnitud
          valor: '2.8 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0.0571 m/s'
            mensaje: |
              Has multiplicado donde había que dividir. La escala
              $v_m/v_p = \lambda^{1/2}$ va del modelo **al** prototipo, así que
              para subir se divide: $v_p = v_m/\lambda^{1/2}$. Y comprueba el
              sentido físico: el prototipo es más grande, el agua va más
              deprisa.
          - valor: '19.6 m/s'
            mensaje: |
              Has usado $\lambda$ en vez de $\lambda^{1/2}$. Froude es
              $v^{2}/gL$, y el cuadrado de la velocidad es lo que va con la
              longitud: la velocidad va con su **raíz**.
        pista: |
          $Fr$ constante da $v_m/v_p = \sqrt{\lambda}$, y aquí $\sqrt{1/49} = 1/7$.
        desarrollo: |
          $$
          \frac{v_m^{2}}{gL_m} = \frac{v_p^{2}}{gL_p}
          \;\Longrightarrow\;
          \frac{v_m}{v_p} = \lambda^{1/2} = \frac{1}{7}
          $$
          $$
          v_p = 0{,}4 \cdot 7 = 2{,}8\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La fuerza sobre la presa, en newtons
        pregunta: |
          ¿Qué fuerza soporta la presa real?
        respuesta:
          tipo: magnitud
          valor: '2.882 MN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '294122.5 N'
            mensaje: |
              El número está bien pero es de kilopondios, no de newtons. Los
              $2{,}5\ \text{kg}$ del enunciado son kilopondios —el apartado d)
              pide newtons justo por eso—, así que al final hay que multiplicar
              por $9{,}8$.
          - valor: '58825 N'
            mensaje: |
              Has escalado con $\lambda^{2}$ pensando «fuerza = presión por
              área». La presión también cambia: va con $v^{2}$, es decir con
              $\lambda$. Queda $\lambda\cdot\lambda^{2} = \lambda^{3}$.
        pista: |
          $F \propto \rho v^{2}L^{2}$, y con el mismo fluido eso es $\lambda^{3}$.
          Después, de kp a N.
        desarrollo: |
          $$
          \frac{F_m}{F_p} = \frac{\rho\,v_m^{2}L_m^{2}}{\rho\,v_p^{2}L_p^{2}}
          = \lambda\cdot\lambda^{2} = \lambda^{3}
          $$
          $$
          F_p = 2{,}5 \cdot 49^{3} = 294\,122{,}5\ \text{kp}
          $$
          $$
          F_p = 294\,122{,}5 \cdot 9{,}8 = 2\,882\,400\ \text{N} \approx 2{,}88\ \text{MN}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              Para la semejanza completa haría falta, además de Froude, la
              igualdad de Reynolds, que aquí no se ha impuesto.
          - texto: >-
              Igualando los dos, $\nu_p/\nu_m = \lambda^{-3/2} = 49^{3/2} =
              343$, es decir un fluido 343 veces menos viscoso que el agua.
          - texto: >-
              Como no existe un líquido así de disponible, se recurre a la
              semejanza restringida y se conserva solo Froude, con buenos
              resultados prácticos.
          - texto: >-
              Al haber renunciado a Reynolds, los resultados del modelo no
              sirven para el prototipo y hay que corregirlos empíricamente uno
              a uno.
            trampa: true
            mensaje: |
              La semejanza restringida no invalida el ensayo: se renuncia al
              número que **no** gobierna el fenómeno, y por eso los resultados
              se trasladan directamente. Si hubiera que corregirlo todo a mano,
              el ensayo no serviría para nada y no se harían modelos de presas.

    resolucion: |
      **El tipo de flujo decide todo lo demás.** Una presa desagua en contacto
      con la atmósfera: es flujo en **superficie libre**, la presión no varía y
      manda la gravedad. Se conserva **Froude**.

      **a) Las escalas.** De $Fr$ constante,
      $v_m/v_p = \lambda^{1/2}$. De ahí:

      $$
      \frac{Q_m}{Q_p} = \lambda^{1/2}\lambda^{2} = \lambda^{5/2}
      \qquad
      \frac{F_m}{F_p} = \lambda\cdot\lambda^{2} = \lambda^{3}
      $$

      **b)** $Q_m = 500\,(1/49)^{5/2} = 0{,}02975\ \text{m}^{3}/\text{s}
      = 29{,}75\ \text{l/s}$.

      **c)** $v_p = 0{,}4 \cdot 7 = 2{,}8\ \text{m/s}$.

      **d)** $F_p = 2{,}5\cdot 49^{3} = 294.122{,}5\ \text{kp}$, y en newtons,
      $2{,}88\ \text{MN}$. Los «kg» del enunciado son kilopondios, y el
      apartado pide newtons precisamente para que se note.

      **e) La condición sobre el fluido.** Igualando también Reynolds:

      $$
      \frac{\nu_p}{\nu_m} = \lambda^{-3/2} = 49^{3/2} = 343
      \;\Longrightarrow\;
      \nu_{\text{modelo}} = \frac{\nu_{\text{agua}}}{343}
      $$

      No hay líquido a mano con esa viscosidad, así que la semejanza completa
      es inalcanzable y se acepta la restringida.

  # ── COLECCIÓN 5.15. El mismo argumento que el e) de la presa, pero aquí es
  #    el ejercicio entero: qué fluido haría falta, y qué relaciones quedan.
  - id: ejflu16-el-canal-y-el-liquido-que-no-existe
    titulo: El canal, y el líquido que haría falta para la homología
    fuente: >-
      Ejercicio 5.15 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se dispone de un canal, que denominamos prototipo, que funciona con un
      líquido cuya viscosidad cinemática es
      $4{,}7\cdot 10^{-5}\ \text{m}^{2}/\text{s}$. Se desea experimentar con un
      modelo reducido a escala $1/5$, deseándose conocer la viscosidad del
      líquido que deberá emplearse para que haya homología, así como la
      relación de velocidades y caudales entre el prototipo y modelo.
    pide: La viscosidad cinemática del líquido del modelo y las dos relaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide **homología**, que es semejanza completa. ¿Qué
          significa eso aquí?
        opciones:
          - texto: >-
              Que se cumplan Froude y Reynolds a la vez, y como el fluido es
              libre, la condición se convierte en una exigencia sobre su
              viscosidad
            correcta: true
            mensaje: |
              Exacto, y es la diferencia con la presa: allí el fluido estaba
              fijado —agua en los dos— y por eso la homología era imposible.
              Aquí el líquido es la incógnita, así que sí se puede.
          - texto: >-
              Que las dos secciones sean geométricamente semejantes, y nada más
            mensaje: |
              La semejanza geométrica es la primera de las tres y no basta:
              hace falta también la cinemática y la dinámica. La homología es
              la dinámica, y esa se traduce en igualdad de **todos** los
              parámetros adimensionales.
          - texto: >-
              Que se cumpla Froude, porque el canal tiene superficie libre
            mensaje: |
              Eso es la semejanza **restringida**, que es lo que se hace cuando
              la completa no se puede. El enunciado pide homología, es decir la
              completa: Froude **y** Reynolds.

      - tipo: calcular
        titulo: La viscosidad del líquido del modelo
        pregunta: |
          ¿Qué viscosidad cinemática debe tener el líquido del modelo?
        respuesta:
          tipo: magnitud
          valor: '4.204e-6 m2/s'
          tolerancia: 0.02
          formato: una viscosidad cinemática, con su unidad
        distractores:
          - valor: '9.4e-6 m2/s'
            mensaje: |
              Has escalado con $\lambda$. La condición conjunta de Froude y
              Reynolds da $\lambda^{3/2}$, no $\lambda$: viene de combinar
              $v \propto \lambda^{1/2}$ con $\nu \propto v L$.
          - valor: '1.88e-6 m2/s'
            mensaje: |
              Has usado $\lambda^{2}$. El exponente correcto es $3/2$: uno y
              medio, no dos. Sale de $\nu_m/\nu_p = (v_m/v_p)(L_m/L_p) =
              \lambda^{1/2}\cdot\lambda$.
        pista: |
          De Froude, $v_m/v_p = \lambda^{1/2}$. Métela en
          $Re$: $\nu_m/\nu_p = (v_m/v_p)(L_m/L_p)$.
        desarrollo: |
          $$
          \frac{\nu_m}{\nu_p} = \frac{v_m L_m}{v_p L_p}
          = \lambda^{1/2}\cdot\lambda = \lambda^{3/2}
          $$
          $$
          \nu_m = 4{,}7\cdot 10^{-5}\left(\tfrac{1}{5}\right)^{3/2}
          = 4{,}7\cdot 10^{-5}\cdot 0{,}08944
          = 4{,}20\cdot 10^{-6}\ \text{m}^{2}/\text{s}
          $$

      - tipo: calcular
        titulo: La relación de caudales
        pregunta: |
          ¿Cuánto vale $Q_p/Q_m$?
        respuesta:
          tipo: numero
          valor: '55.9'
          tolerancia: 0.5
          formato: un número sin unidades
        distractores:
          - valor: '25'
            mensaje: |
              Ese es $\lambda^{-2}$, la relación de **áreas**. Falta la
              velocidad, que también cambia: $\lambda^{-1/2}\cdot\lambda^{-2}
              = \lambda^{-5/2}$.
          - valor: '11.18'
            mensaje: |
              Ese es $5^{3/2}$, el exponente de la viscosidad del apartado
              anterior. El del caudal es $5/2$: $5^{5/2} = 55{,}9$.
        pista: |
          $Q = vA$, y aquí $v_p/v_m = \sqrt{5}$, $A_p/A_m = 25$.
        desarrollo: |
          $$
          \frac{Q_p}{Q_m} = \frac{v_p}{v_m}\cdot\frac{A_p}{A_m}
          = \sqrt{5}\cdot 25 = 5^{5/2} = 55{,}9 \approx 56
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un canal tiene superficie libre, así que la semejanza completa
              exige igualar Froude y Reynolds a la vez.
          - texto: >-
              Froude fija la relación de velocidades en $\lambda^{1/2}$, y
              metida en Reynolds obliga a $\nu_m/\nu_p = \lambda^{3/2}$.
          - texto: >-
              Como aquí el líquido del modelo es la incógnita y no está
              impuesto, la condición se puede satisfacer y la homología es
              alcanzable.
          - texto: >-
              Al ser la viscosidad del modelo menor que la del prototipo, el
              modelo tendrá menos pérdidas relativas y habrá que corregirlas.
            trampa: true
            mensaje: |
              Si hay homología, **no hay nada que corregir**: eso es
              exactamente lo que significa. Las pérdidas relativas son un
              adimensional, y un adimensional vale lo mismo en modelo y
              prototipo cuando los parámetros coinciden.

    resolucion: |
      **Lo que pide la homología.** Un canal tiene superficie libre, así que la
      semejanza completa exige igualdad de **Froude y de Reynolds**. La
      diferencia con el ejercicio de la presa es que allí el fluido estaba
      fijado —agua en los dos— y aquí es la incógnita: por eso allí la
      homología era imposible y aquí no.

      **La viscosidad.** De Froude, $v_m/v_p = \lambda^{1/2}$. Sustituyendo en
      la igualdad de Reynolds:

      $$
      \frac{\nu_m}{\nu_p} = \frac{v_m L_m}{v_p L_p} = \lambda^{3/2}
      = \left(\tfrac{1}{5}\right)^{3/2} = 0{,}08944
      $$
      $$
      \nu_m = 4{,}7\cdot 10^{-5}\cdot 0{,}08944
      = 4{,}20\cdot 10^{-6}\ \text{m}^{2}/\text{s}
      $$

      Un valor razonable: está en el orden de un aceite muy ligero, así que
      **este ensayo sí se puede montar**.

      **Las relaciones.**

      $$
      \frac{v_p}{v_m} = \lambda^{-1/2} = \sqrt{5} = 2{,}24
      \qquad
      \frac{Q_p}{Q_m} = \lambda^{-5/2} = 5^{5/2} = 55{,}9 \approx 56
      $$

      **La lectura.** Compara con la presa a escala $1{:}49$, que pedía un
      fluido 343 veces menos viscoso que el agua. La diferencia entera está en
      el exponente $3/2$: reducir la escala castiga la viscosidad exigida muy
      deprisa. A $1/5$ el ensayo es viable; a $1/49$, no.

  # ── COLECCIÓN 5.13. Corto, y el resultado es contraintuitivo: el modelo es
  #    tres veces más grande y tiene que girar cien veces más despacio.
  - id: ejflu16-la-bomba-que-gira-cien-veces-mas-despacio
    titulo: Una bomba ensayada con aire, y a qué velocidad tiene que girar
    fuente: >-
      Ejercicio 5.13 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una bomba centrífuga girando a $1200\ \text{rpm}$ bombea un aceite
      lubricante a $15\ °\text{C}$. Se va a ensayar un modelo de la bomba que
      utiliza aire a $20\ °\text{C}$. Si el diámetro del modelo es 3 veces
      mayor que el del prototipo, ¿a qué velocidad debe girar el modelo?

      Datos:
      $\nu_{\text{aceite}} = 1{,}8\cdot 10^{-4}\ \text{m}^{2}/\text{s}$;
      $\nu_{\text{aire}} = 1{,}5\cdot 10^{-5}\ \text{m}^{2}/\text{s}$.
    pide: La velocidad de giro del modelo, en rpm.

    pasos:
      - tipo: reconocer
        pregunta: |
          Una bomba es flujo en carga. ¿Qué se iguala, y con qué velocidad?
        opciones:
          - texto: >-
              Reynolds, tomando como velocidad característica $nD$ y como
              longitud el diámetro, con lo que queda $nD^{2}/\nu$
            correcta: true
            mensaje: |
              Eso es. En una turbomáquina no hay una velocidad de corriente
              obvia, así que se usa la de la punta del rodete, proporcional a
              $nD$. El Reynolds queda entonces $nD\cdot D/\nu = nD^{2}/\nu$.
          - texto: >-
              Froude, porque el líquido cae por gravedad dentro de la bomba
            mensaje: |
              Dentro de una bomba el fluido va confinado y aislado de la
              atmósfera: es flujo **en carga**, y la variación de cota se
              agrupa con la presión. La gravedad no gobierna, y Froude se
              descarta.
          - texto: >-
              Reynolds, con la velocidad de giro directamente como velocidad
              característica
            mensaje: |
              La velocidad de giro no es una velocidad: sus dimensiones son
              $T^{-1}$, no $LT^{-1}$. Hay que multiplicarla por una longitud
              —el diámetro— para obtener una velocidad de verdad.

      - tipo: calcular
        titulo: La velocidad de giro del modelo
        pregunta: |
          ¿A qué velocidad debe girar el modelo?
        respuesta:
          tipo: magnitud
          valor: '11.11 rpm'
          tolerancia: 0.02
          formato: una velocidad de giro, con su unidad
        distractores:
          - valor: '133.3 rpm'
            mensaje: |
              Has escalado solo el tamaño y has olvidado que el fluido cambia.
              El aire es doce veces menos viscoso que el aceite, y eso entra en
              la cuenta: $1200/9$ hay que multiplicarlo aún por
              $\nu_{\text{aire}}/\nu_{\text{aceite}}$.
          - valor: '1600 rpm'
            mensaje: |
              Has puesto la relación de viscosidades del revés. El fluido del
              **modelo** va en el numerador:
              $n_m = n_p (D_p/D_m)^{2}(\nu_m/\nu_p)$, y el aire es el menos
              viscoso, así que el factor achica el resultado en vez de
              agrandarlo.
        pista: |
          Iguala $nD^{2}/\nu$ y despeja $n_m$. Ojo: el modelo es **más
          grande**, así que $D_p/D_m = 1/3$.
        desarrollo: |
          $$
          \frac{n_m D_m^{2}}{\nu_m} = \frac{n_p D_p^{2}}{\nu_p}
          \;\Longrightarrow\;
          n_m = n_p\left(\frac{D_p}{D_m}\right)^{2}\frac{\nu_m}{\nu_p}
          $$
          $$
          n_m = 1200\cdot\frac{1}{9}\cdot\frac{1{,}5\cdot 10^{-5}}{1{,}8\cdot 10^{-4}}
          = 133{,}3\cdot 0{,}08333 = 11{,}11\ \text{rpm}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una bomba es flujo en carga, así que la semejanza dinámica se
              consigue igualando el número de Reynolds.
          - texto: >-
              Con la velocidad de punta $nD$, el Reynolds de la máquina es
              $nD^{2}/\nu$, y de ahí $n_m = n_p (D_p/D_m)^{2}(\nu_m/\nu_p)$.
          - texto: >-
              Los dos factores empujan en el mismo sentido —el modelo es más
              grande y su fluido menos viscoso—, así que sale mucho más lento:
              $11{,}11$ rpm.
          - texto: >-
              Como el modelo gira tan despacio, el ensayo no será
              representativo y habrá que subir las revoluciones hasta un valor
              realista.
            trampa: true
            mensaje: |
              Subir las revoluciones rompe la igualdad de Reynolds, que es lo
              único que hace válido el ensayo. Un resultado incómodo no es un
              resultado equivocado: si $11{,}11$ rpm es inviable, lo que se
              cambia es el **fluido** o el **tamaño**, no el número que se
              estaba igualando.

    resolucion: |
      **El número.** Una bomba trabaja en carga —fluido confinado, la cota se
      agrupa con la presión—, así que la semejanza dinámica se logra igualando
      **Reynolds**.

      **La velocidad característica.** En una turbomáquina no hay corriente
      libre a la que medirle la velocidad: se usa la de la punta del rodete,
      proporcional a $nD$. Con el diámetro como longitud característica:

      $$
      Re = \frac{(nD)\,D}{\nu} = \frac{n D^{2}}{\nu}
      $$

      **El despeje.**

      $$
      n_m = n_p\left(\frac{D_p}{D_m}\right)^{2}\frac{\nu_m}{\nu_p}
      = 1200\cdot\left(\frac{1}{3}\right)^{2}\cdot
      \frac{1{,}5\cdot 10^{-5}}{1{,}8\cdot 10^{-4}} = 11{,}11\ \text{rpm}
      $$

      **Por qué sale tan bajo, que es lo que hay que entender.** Los dos
      factores tiran hacia abajo a la vez: el modelo es **tres veces mayor**
      —y el diámetro entra al cuadrado, así que divide por nueve— y su fluido
      es **doce veces menos viscoso**, lo que vuelve a dividir por doce. Nueve
      por doce, ciento ocho.

      Once revoluciones por minuto es una vuelta cada cinco segundos y medio:
      un ensayo perfectamente realizable, aunque no se parezca en nada a lo que
      hace la bomba real. Ese es todo el sentido de la teoría de modelos —el
      modelo no tiene que **parecerse** al prototipo, tiene que tener sus
      mismos números adimensionales—.

  # ── COLECCIÓN 5.11. Tres líneas de enunciado y la lección más incómoda del
  #    tema: la semejanza de Reynolds con el mismo fluido exige velocidades
  #    que no se pueden alcanzar. Es el reverso del 5.13, donde salía una
  #    velocidad ridículamente pequeña.
  - id: ejflu16-col511-el-submarino-a-escala
    titulo: El submarino a escala, y la velocidad que nadie puede dar
    fuente: >-
      Ejercicio 5.11 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un modelo de submarino a escala $1{:}15$ va a ser ensayado en un canal
      hidrodinámico de agua salada. Si el submarino se mueve a una velocidad
      de 12 millas por hora, ¿a qué velocidad deberá ser arrastrado el modelo
      para que exista semejanza dinámica?
    pide: La velocidad de arrastre del modelo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El submarino navega **completamente sumergido**. ¿Qué número
          adimensional hay que igualar?
        opciones:
          - texto: >-
              Reynolds, porque sin superficie libre no se generan olas y la
              gravedad deja de intervenir
            correcta: true
            mensaje: |
              Eso es, y es el criterio que decide todo el problema. La
              gravedad solo cuenta cuando hay una superficie libre que
              deformar; sumergido, lo único que compite con la inercia es la
              viscosidad.
          - texto: >-
              Froude, porque se mueve dentro del agua y el agua tiene peso
            mensaje: |
              Froude es la relación entre inercia y **gravedad**, y aparece
              cuando hay olas: barcos en superficie, canales, vertederos. Un
              cuerpo sumergido no genera olas de gravedad, así que Froude no
              tiene a qué agarrarse.
          - texto: >-
              Mach, porque cualquier cuerpo en movimiento comprime el fluido
              que tiene delante
            mensaje: |
              Mach cuenta cuando la velocidad se acerca a la del sonido. En
              agua el sonido va a 1450 m/s y el submarino a unos 5: la
              compresibilidad es irrelevante.

      - tipo: calcular
        titulo: La velocidad del modelo
        pregunta: |
          ¿A cuántas millas por hora hay que arrastrar el modelo? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '180'
          tolerancia: 1
          formato: una velocidad en millas por hora, solo el número
        distractores:
          - valor: '0.8'
            mensaje: |
              Has dividido entre 15 en vez de multiplicar. El modelo es
              **quince veces más pequeño**, así que para tener el mismo
              $Re = VL/\nu$ con el mismo fluido tiene que ir quince veces más
              deprisa.
          - valor: '3.1'
            mensaje: |
              Eso sale de igualar **Froude**, $V_m = V_p/\sqrt{15}$, que es lo
              correcto para un barco en superficie. Aquí el submarino va
              sumergido y manda Reynolds.
        pista: |
          $Re_m = Re_p$ con el mismo fluido: $V_m L_m = V_p L_p$.
        desarrollo: |
          $$
          \frac{V_m L_m}{\nu} = \frac{V_p L_p}{\nu}
          \;\Longrightarrow\;
          V_m = V_p\,\frac{L_p}{L_m} = 12\cdot 15 = 180\ \text{millas/h}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Sumergido no hay superficie libre, así que la gravedad no
              interviene y la semejanza dinámica es la de Reynolds.
          - texto: >-
              Con el mismo fluido en modelo y prototipo, igualar Reynolds
              obliga a que la velocidad crezca en la misma proporción en que
              el tamaño decrece.
          - texto: >-
              De ahí las 180 millas por hora: unos 80 m/s en un canal de
              agua, que no es un ensayo realizable.
          - texto: >-
              Como el resultado es irrealizable, el análisis dimensional no
              sirve para estudiar submarinos.
            trampa: true
            mensaje: |
              El análisis dimensional ha hecho exactamente su trabajo: decir
              **qué haría falta**. Lo que hay que cambiar es el ensayo, no la
              teoría. Se ensaya con un modelo mayor, o en un túnel de agua
              presurizado, o se acepta trabajar a un Reynolds menor y se
              extrapola. Un resultado incómodo no es un resultado equivocado.

    resolucion: |
      **La decisión, que es todo el ejercicio.** Un submarino sumergido no
      genera olas de gravedad, así que Froude no aplica; y va muy lejos de la
      velocidad del sonido, así que Mach tampoco. Queda **Reynolds**.

      **La cuenta.** El canal se llena de agua salada, el mismo fluido en el
      que navega el prototipo, así que $\nu$ se simplifica:

      $$
      V_m = V_p\,\frac{L_p}{L_m} = 12\cdot 15 = 180\ \text{millas/h}
      $$

      **Y lo que hay que sacar de ahí.** Ciento ochenta millas por hora son
      unos 80 m/s. Ningún canal hidrodinámico arrastra un modelo a esa
      velocidad, y aunque lo hiciera, el agua cavitaría mucho antes.

      Compáralo con el ejercicio 5.13, donde la misma exigencia de Reynolds
      daba 11 rpm en vez de 1200. Los dos casos son la misma moneda: **la
      semejanza de Reynolds a escala reducida es cara o imposible salvo que
      se cambie de fluido**, y por eso los ensayos reales o cambian de fluido,
      o presurizan, o renuncian a la semejanza completa y corrigen después.

  # ── COLECCIÓN 5.17. Tres apartados, y en los tres la misma ecuación:
  #    Reynolds igual. Sirve para ver que la semejanza no es una técnica de
  #    maquetas, sino una forma de trasladar resultados entre dos flujos
  #    cualesquiera —aquí ni siquiera hay modelo y prototipo, hay dos tuberías
  #    con dos líquidos distintos—.
  - id: ejflu16-col517-el-agua-y-el-keroseno
    titulo: Dos tuberías, dos líquidos, y el mismo flujo
    fuente: >-
      Ejercicio 5.17 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Agua a $15{,}6\ °\text{C}$ fluye a $3{,}66\ \text{m/s}$ a través de una
      tubería de $15{,}2\ \text{cm}$. Para que exista semejanza hidráulica:

      a) ¿A qué velocidad debe fluir el keroseno ($s = 0{,}77$) a
      $10\ °\text{C}$ por una tubería de $30{,}5\ \text{cm}$?

      b) ¿Qué diámetro de tubería se utilizaría si la velocidad del keroseno
      fuera de $19{,}2\ \text{m/s}$?

      c) Si la caída de presión $\Delta P$ en el agua es $0{,}5$ bar, ¿cuál
      será la caída de presión (en metros de columna de keroseno) en la
      tubería donde fluye keroseno en el caso b?

      Datos: $\nu_{\text{agua}}(15{,}6\ °\text{C}) = 1{,}07\cdot 10^{-6}\
      \text{m}^{2}/\text{s}$ (cuadro n.º 8);
      $\nu_{\text{keroseno}}(10\ °\text{C}) = 3{,}0\cdot 10^{-6}\
      \text{m}^{2}/\text{s}$ (ábaco de viscosidades).
    pide: La velocidad, el diámetro y la caída de presión del keroseno.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí no hay maqueta ni prototipo: son dos tuberías reales con dos
          líquidos distintos. ¿Qué significa entonces «semejanza hidráulica»?
        opciones:
          - texto: >-
              Que los dos flujos tienen el mismo número de Reynolds, y por
              tanto el mismo patrón de flujo aunque el líquido y el tamaño
              sean otros
            correcta: true
            mensaje: |
              Exacto. La semejanza no es una técnica de maquetas: es la
              afirmación de que **dos flujos con los mismos números
              adimensionales son el mismo flujo**, medido con otras reglas.
          - texto: >-
              Que las dos tuberías tienen la misma forma y proporciones
            mensaje: |
              Eso es la semejanza **geométrica**, que aquí se cumple sola —dos
              tubos circulares— y no basta. La dinámica exige además igualdad
              de los adimensionales que gobiernan el fenómeno.
          - texto: >-
              Que los dos líquidos circulan a la misma velocidad
            mensaje: |
              Justo lo contrario: si los dos fueran a la misma velocidad con
              distinta viscosidad y distinto diámetro, sus Reynolds serían
              distintos y los flujos no se parecerían en nada.

      - tipo: calcular
        titulo: La velocidad del keroseno
        pregunta: |
          ¿A qué velocidad debe fluir el keroseno por la tubería de
          $30{,}5\ \text{cm}$?
        respuesta:
          tipo: magnitud
          valor: '5.11 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.83 m/s'
            mensaje: |
              Has escalado solo con el diámetro y te has dejado la viscosidad.
              El keroseno es casi tres veces más viscoso que el agua a esas
              temperaturas, y eso obliga a ir **más** deprisa, no menos.
          - valor: '20.6 m/s'
            mensaje: |
              Has multiplicado por el cociente de diámetros en vez de dividir.
              El tubo del keroseno es el **doble** de ancho: a igualdad de
              Reynolds, más diámetro pide menos velocidad.
        pista: |
          $\dfrac{V_a D_a}{\nu_a} = \dfrac{V_k D_k}{\nu_k}$, y despeja $V_k$.
        desarrollo: |
          $$
          V_k = V_a\,\frac{D_a}{D_k}\,\frac{\nu_k}{\nu_a}
          = 3{,}66\cdot\frac{15{,}2}{30{,}5}\cdot\frac{3{,}0}{1{,}07}
          = 5{,}11\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El diámetro para 19,2 m/s
        pregunta: |
          Si el keroseno fuera a $19{,}2\ \text{m/s}$, ¿qué diámetro haría
          falta?
        respuesta:
          tipo: magnitud
          valor: '8.11 cm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '2.9 cm'
            mensaje: |
              Otra vez sin la viscosidad. El Reynolds del agua es
              $Re = 3{,}66\cdot 0{,}152/1{,}07\cdot 10^{-6} = 5{,}2\cdot
              10^{5}$, y con él y los $19{,}2$ m/s se despeja el diámetro,
              usando la viscosidad **del keroseno**.
          - valor: '30.5 cm'
            mensaje: |
              Ese es el diámetro del apartado anterior. Aquí la velocidad ha
              subido casi cuatro veces, así que para mantener el mismo
              Reynolds el tubo tiene que estrecharse en la misma proporción.
        pista: |
          El Reynolds es el mismo de siempre; ahora la incógnita es $D$.
        desarrollo: |
          $$
          Re = \frac{3{,}66\cdot 0{,}152}{1{,}07\cdot 10^{-6}}
          = 5{,}20\cdot 10^{5}
          $$
          $$
          D_k = \frac{Re\,\nu_k}{V_k} = \frac{5{,}20\cdot 10^{5}\cdot
          3{,}0\cdot 10^{-6}}{19{,}2} = 0{,}0811\ \text{m}
          $$

      - tipo: calcular
        titulo: La caída de presión
        pregunta: |
          ¿Cuántos metros de columna de keroseno cae la presión en el caso b?
        respuesta:
          tipo: magnitud
          valor: '140.4 m'
          tolerancia: 0.02
          formato: una altura de columna, con su unidad
        distractores:
          - valor: '6.62 m'
            mensaje: |
              Has convertido los $0{,}5$ bar a columna de keroseno y te has
              parado ahí. Falta lo esencial: la velocidad del keroseno es
              cinco veces la del agua, y el número de Euler exige que
              $\Delta P/\rho V^{2}$ se conserve, así que la caída sube con el
              **cuadrado** de la velocidad.
          - valor: '108.1 m'
            mensaje: |
              La presión está bien —$1{,}06$ MPa— pero la has pasado a
              columna dividiendo entre el peso específico del **agua**. Eso
              son 108,1 metros de columna de agua; el enunciado pide metros
              de columna de keroseno, y el keroseno pesa un 23 % menos.
        pista: |
          Semejanza dinámica significa también igualdad de Euler:
          $\dfrac{\Delta P}{\rho V^{2}}$ es el mismo en los dos flujos.
        desarrollo: |
          $$
          \frac{\Delta P_k}{\rho_k V_k^{2}} = \frac{\Delta P_a}{\rho_a V_a^{2}}
          \;\Longrightarrow\;
          \Delta P_k = 0{,}5\cdot 10^{5}\cdot 0{,}77\cdot
          \left(\frac{19{,}2}{3{,}66}\right)^{2}
          = 1{,}06\cdot 10^{6}\ \text{Pa}
          $$
          $$
          h = \frac{\Delta P_k}{\gamma_k}
          = \frac{1{,}06\cdot 10^{6}}{0{,}77\cdot 9800}
          = 140{,}4\ \text{m de columna de keroseno}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Semejanza hidráulica en tubería es igualdad de Reynolds:
              $VD/\nu$ vale lo mismo en los dos flujos.
          - texto: >-
              Con eso, el keroseno en el tubo de 30,5 cm tiene que ir a
              5,11 m/s, y si se le obliga a ir a 19,2 el tubo baja a 8,11 cm.
          - texto: >-
              Y como los dos flujos son semejantes, sus números de Euler
              coinciden: la caída de presión escala con $\rho V^{2}$ y sale
              de 140,4 m de columna de keroseno.
          - texto: >-
              Al ser la misma caída de presión expresada en otro líquido, la
              energía disipada por metro de tubería es la misma en los dos
              casos.
            trampa: true
            mensaje: |
              No es «la misma caída en otras unidades»: es una caída **veinte
              veces mayor**. Los $0{,}5$ bar del agua son 6,6 m de columna de
              keroseno, y el resultado son 140. Lo que se conserva es el
              adimensional $\Delta P/\rho V^{2}$, no la presión ni la energía.

    resolucion: |
      **Lo que este ejercicio enseña y los otros del capítulo no.** No hay
      maqueta. Hay dos tuberías reales, dos líquidos y una pregunta:
      ¿cuándo son «el mismo flujo»? La respuesta —cuando comparten sus
      números adimensionales— es la definición de semejanza, y aquí se ve sin
      el disfraz del modelo a escala.

      **a) La velocidad.** Igualando Reynolds,

      $$
      V_k = V_a\,\frac{D_a}{D_k}\,\frac{\nu_k}{\nu_a}
      = 3{,}66\cdot 0{,}498\cdot 2{,}80 = 5{,}11\ \text{m/s}
      $$

      Dos efectos que tiran en sentidos contrarios: el tubo el doble de ancho
      pide menos velocidad, y el líquido casi el triple de viscoso pide más.
      Gana el segundo.

      **b) El diámetro.** El mismo $Re = 5{,}20\cdot 10^{5}$, ahora con la
      velocidad como dato: $D = 8{,}11$ cm. El boletín publica 8,113.

      **c) La caída de presión.** Aquí entra el segundo adimensional. Si los
      flujos son semejantes, también lo es su Euler:

      $$
      \frac{\Delta P}{\rho V^{2}} = \text{constante}
      \;\Longrightarrow\;
      \Delta P_k = \Delta P_a\,\frac{\rho_k}{\rho_a}
      \left(\frac{V_k}{V_a}\right)^{2}
      $$

      El cociente de velocidades es 5,25 y su cuadrado, 27,5. Por eso una
      caída modesta —medio bar— se convierte en 140 metros de columna: **la
      presión escala con el cuadrado de la velocidad**, y ese cuadrado es lo
      que hace que los ensayos a velocidad aumentada den presiones enormes.

  # ── COLECCIÓN 5.20. El contrapunto de los tres anteriores: aquí manda
  #    Froude, no Reynolds, porque hay superficie libre. Y el apartado d)
  #    obliga a decir en voz alta que la semejanza NO es completa, que es la
  #    honestidad que el tema pide.
  - id: ejflu16-col520-el-pilar-del-puente
    titulo: El pilar del puente, y por qué aquí manda Froude
    fuente: >-
      Ejercicio 5.20 · Colección de Problemas, capítulo 5 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un pilar o columna rectangular de un puente sobre un río tiene un
      espesor de $1{,}20\ \text{m}$ y $3{,}65\ \text{m}$ de ancho, para una
      altura media en el río de $2{,}75\ \text{m}$. Se ha realizado el
      experimento en un modelo a escala $1/16$, con una velocidad de
      $0{,}76\ \text{m/s}$, obteniéndose una fuerza que actúa sobre el pilar
      de $0{,}409\ \text{kg}$. Se pide:

      a) Determinar los valores correspondientes a la velocidad y fuerza en
      el prototipo.

      b) En el modelo se observó una onda estacionaria de $4{,}9\ \text{cm}$
      de altura al frente del pilar y se desea conocer la altura que tendrá
      en el prototipo.

      c) De acuerdo con la definición de coeficiente de arrastre
      $C_R = F_R/(A\rho V^{2}/2)$, determinar dicho coeficiente en el pilar
      en el modelo y el prototipo.

      d) ¿Se verifica la semejanza u homología total? Razona la contestación.
    pide: Velocidad y fuerza en el prototipo, la altura de la onda, los coeficientes de arrastre y si hay homología total.

    pasos:
      - tipo: reconocer
        pregunta: |
          El pilar atraviesa la superficie del río y delante de él se forma
          una onda. ¿Qué número gobierna el ensayo?
        opciones:
          - texto: >-
              Froude, porque hay superficie libre y la onda que se forma es
              un fenómeno de gravedad
            correcta: true
            mensaje: |
              Eso es. En cuanto aparece una superficie libre que se deforma,
              la gravedad entra en el problema y Froude pasa a mandar. La
              propia onda estacionaria del apartado b) es la prueba visible.
          - texto: >-
              Reynolds, porque el agua es viscosa y el pilar la frena
            mensaje: |
              Reynolds también existe aquí, pero no se puede igualar a la vez
              que Froude con el mismo fluido —es justo lo que pregunta el
              apartado d)—. Cuando hay que elegir, manda el fenómeno
              dominante, y con superficie libre ese es la gravedad.
          - texto: >-
              Euler, porque lo que se mide es una fuerza
            mensaje: |
              Euler no se **impone**: se obtiene. Es el adimensional que
              contiene la incógnita —la presión o la fuerza— y por eso es el
              que se despeja al final, no el que se iguala al principio.

      - tipo: calcular
        titulo: La velocidad del río
        pregunta: |
          ¿A qué velocidad corresponde el ensayo en el prototipo?
        respuesta:
          tipo: magnitud
          valor: '3.04 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '12.16 m/s'
            mensaje: |
              Has escalado con $\lambda = 16$ en vez de con $\sqrt{16}$. En
              semejanza de Froude la velocidad va con la **raíz** de la
              escala: $V_p/V_m = \sqrt{L_p/L_m}$.
          - valor: '0.19 m/s'
            mensaje: |
              Has dividido. El prototipo es dieciséis veces mayor, así que su
              velocidad es cuatro veces **mayor**, no menor: un río lleva más
              velocidad que su maqueta.
        pista: |
          $\dfrac{V}{\sqrt{gL}}$ igual en modelo y prototipo, con el mismo
          $g$.
        desarrollo: |
          $$
          \frac{V_p}{\sqrt{L_p}} = \frac{V_m}{\sqrt{L_m}}
          \;\Longrightarrow\;
          V_p = 0{,}76\cdot\sqrt{16} = 3{,}04\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La fuerza sobre el pilar real
        pregunta: |
          ¿Qué fuerza soporta el pilar del puente?
        respuesta:
          tipo: magnitud
          valor: '16418 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1026 N'
            mensaje: |
              Has escalado la fuerza con $\lambda^{2}$, el área. Falta un
              factor más: la fuerza va como $\rho V^{2}L^{2}$, y en Froude
              $V^{2}$ escala con $\lambda$, así que en total
              $\lambda^{3} = 4096$, no 256.
          - valor: '1675 N'
            mensaje: |
              El escalado está bien: $0{,}409\cdot 4096 = 1675$. Pero eso son
              **kilopondios**, la misma unidad en que venía el dato del
              modelo. En newtons hay que multiplicar por $9{,}8$.
        pista: |
          $F \propto \rho V^{2}L^{2}$, y en Froude con el mismo fluido eso
          deja $F_p/F_m = \lambda^{3}$.
        desarrollo: |
          $$
          \frac{F_p}{F_m} = \lambda^{3} = 16^{3} = 4096
          $$
          $$
          F_p = 0{,}409\cdot 4096 = 1675\ \text{kg}
          = 1675\cdot 9{,}8 = 16\,418\ \text{N}
          $$

      - tipo: calcular
        titulo: El coeficiente de arrastre
        pregunta: |
          ¿Cuánto vale $C_R$ en el prototipo? Toma como área frontal el
          espesor por el calado, $1{,}20\cdot 2{,}75$.
        respuesta:
          tipo: numero
          valor: '1.076'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '2.153'
            mensaje: |
              Te has dejado el 2 del denominador. La definición lleva
              $A\rho V^{2}/2$, con la presión dinámica completa.
          - valor: '0.354'
            mensaje: |
              Parece que has usado el ancho, $3{,}65$ m, como área frontal en
              vez del espesor. El área que se opone al río es la que el río
              ve de frente: el **espesor** por el calado.
        pista: |
          $C_R = F/(A\rho V^{2}/2)$, con $A = 1{,}20\cdot 2{,}75$,
          $\rho = 1000$ y $V = 3{,}04$.
        desarrollo: |
          $$
          C_R = \frac{16\,418}{1{,}20\cdot 2{,}75\cdot 1000\cdot
          \dfrac{3{,}04^{2}}{2}} = \frac{16\,418}{15\,249} = 1{,}076
          $$

          En el modelo sale exactamente lo mismo, y **tiene que salir**: el
          coeficiente de arrastre es un adimensional, y si los dos flujos son
          semejantes en Froude, coincide.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con superficie libre manda Froude, así que la velocidad escala
              con $\sqrt{16} = 4$ y la fuerza con $16^{3} = 4096$.
          - texto: >-
              El río va a 3,04 m/s, el pilar aguanta 16,4 kN y la onda
              estacionaria mide 78,4 cm, dieciséis veces la del modelo.
          - texto: >-
              El coeficiente de arrastre sale 1,076 en los dos, que es lo
              que confirma que los dos flujos son semejantes en Froude.
          - texto: >-
              Y como el coeficiente coincide, la homología es total: el
              modelo reproduce el prototipo en todos sus aspectos.
            trampa: true
            mensaje: |
              **No hay homología total**, y esa es la respuesta del apartado
              d). Igualando Froude con el mismo fluido, el Reynolds del modelo
              es $\lambda^{3/2} = 64$ veces menor que el del prototipo. Los
              efectos viscosos —la capa límite, el desprendimiento— no están a
              escala. Que $C_R$ coincida solo dice que el arrastre de este
              pilar está dominado por la forma y la presión, no por la
              viscosidad; en un cuerpo fuselado no habría coincidido.

    resolucion: |
      **Por qué Froude y no Reynolds.** El pilar corta la superficie del río y
      levanta una onda. Eso es un fenómeno de gravedad, y donde la gravedad
      manda el adimensional que hay que igualar es
      $Fr = V/\sqrt{gL}$.

      **a) Velocidad y fuerza.** Con el mismo $g$ y el mismo fluido,

      $$
      \frac{V_p}{V_m} = \sqrt\lambda = 4
      \qquad
      \frac{F_p}{F_m} = \lambda^{3} = 4096
      $$

      es decir $V_p = 3{,}04$ m/s y $F_p = 1675$ kg $= 16{,}4$ kN.

      **b) La onda.** Las longitudes van con $\lambda$ a secas:
      $4{,}9\cdot 16 = 78{,}4$ cm.

      **c) El coeficiente.** Con $A = 1{,}20\cdot 2{,}75 = 3{,}30$ m²,

      $$
      C_R = \frac{16\,418}{3{,}30\cdot 1000\cdot 3{,}04^{2}/2} = 1{,}076
      $$

      y en el modelo, el mismo número. **Que coincida no es un resultado: es
      la comprobación de que la semejanza se ha aplicado bien.** Un
      adimensional que sale distinto en modelo y prototipo delata un error de
      escalado.

      **d) La homología no es total, y hay que decirlo.** Al fijar Froude con
      el mismo fluido, el Reynolds queda encadenado:

      $$
      \frac{Re_p}{Re_m} = \frac{V_p L_p}{V_m L_m}
      = \sqrt\lambda\cdot\lambda = \lambda^{3/2} = 64
      $$

      El modelo trabaja a un Reynolds 64 veces menor. **Con un solo fluido no
      se pueden igualar Froude y Reynolds a la vez**, salvo escala 1:1, y ese
      es el conflicto central del tema: se elige el que domina y se acepta que
      el otro queda desatendido. Aquí sale bien porque el arrastre de un
      prisma de aristas vivas lo fija el desprendimiento en las esquinas, que
      está anclado por la geometría; con un cuerpo redondeado, donde el punto
      de desprendimiento depende del Reynolds, el mismo ensayo habría dado un
      coeficiente equivocado.

  - id: ejflu16-col55-los-tres-grupos-de-una-turbomaquina
    titulo: Los tres grupos de una turbomáquina, deducidos y no memorizados
    fuente: >-
      Ejercicio 5.5 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La experiencia y la experimentación demuestran que la diferencia de
      presiones entre la salida y la entrada de una turbomáquina depende del
      caudal $Q$ turbinado, de la velocidad de giro de la máquina $n$, de la
      densidad del fluido $\rho$, de la viscosidad cinemática $\nu$ del líquido
      turbinado y del diámetro del rodete de la turbina $D$.

      **a)** Hallar los parámetros adimensionales de los que dependerá el
      fenómeno físico, si se toman como variables repetidas $\rho$, $n$ y $D$.
    pide: Los tres parámetros adimensionales del fenómeno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de montar ninguna matriz: ¿cuántos parámetros adimensionales
          van a salir?
        opciones:
          - texto: >-
              Tres: seis variables menos las tres dimensiones fundamentales que
              intervienen
            correcta: true
            mensaje: |
              Eso es el teorema de Vaschy-Buckingham: $\pi = n - k$, con $n$ el
              número de variables y $k$ el de dimensiones independientes. Aquí
              $6 - 3 = 3$, y **se sabe antes de empezar**: si al final salen
              cuatro, hay un error.
          - texto: Tres, porque son tres las variables repetidas
            mensaje: |
              El número de repetidas coincide con $k$, así que el resultado es
              el mismo, pero el razonamiento no: las repetidas son tres
              **porque** hay tres dimensiones, no al revés. Con un problema
              puramente mecánico sin masa saldrían dos.
          - texto: Seis, uno por variable
            mensaje: |
              Entonces no habría reducido nada. La gracia del teorema es
              justamente que **agrupa**: seis variables que había que barrer una
              a una se convierten en tres grupos.
      - tipo: calcular
        titulo: El exponente de la velocidad de giro
        pregunta: |
          En el grupo que contiene $\Delta p$, escrito como
          $\pi_1 = \Delta p \cdot \rho^{a} n^{b} D^{c}$, ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-1'
            mensaje: |
              Con $b = -1$ te quedaría un tiempo suelto. $\Delta p$ lleva
              $T^{-2}$ y la única variable con tiempo entre las repetidas es
              $n$, que aporta $T^{-1}$: hacen falta **dos** para cancelarlo.
          - valor: '2'
            mensaje: >-
              El signo al revés. $\Delta p$ ya tiene $T^{-2}$; para anularlo hay
              que multiplicar por $n^{-2}$, no por $n^{2}$.
        pista: |
          $[\Delta p] = ML^{-1}T^{-2}$ y $[n] = T^{-1}$. Solo $n$ tiene tiempo
          entre las repetidas, así que el exponente de $T$ lo decide ella sola.
        desarrollo: |
          $$
          [\Delta p]\,[\rho]^{a}[n]^{b}[D]^{c}
          = (ML^{-1}T^{-2})(ML^{-3})^{a}(T^{-1})^{b}(L)^{c} = M^{0}L^{0}T^{0}
          $$

          Tomando exponentes:

          | | ecuación | sale |
          |---|---|---|
          | $M$ | $1 + a = 0$ | $a = -1$ |
          | $T$ | $-2 - b = 0$ | $b = -2$ |
          | $L$ | $-1 - 3a + c = 0$ | $c = -2$ |

          $$
          \boxed{\pi_1 = \frac{\Delta p}{\rho\,n^{2}D^{2}}}
          $$
      - tipo: calcular
        titulo: El exponente del diámetro en el grupo del caudal
        pregunta: |
          En $\pi_2 = Q \cdot \rho^{a} n^{b} D^{c}$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-2'
            mensaje: |
              Eso saldría si $Q$ fuera una velocidad. Es un **caudal**:
              $L^{3}T^{-1}$, tres longitudes, no dos. El grupo es $Q/(nD^{3})$.
          - valor: '3'
            mensaje: >-
              El signo al revés. $Q$ ya aporta $L^{3}$; para anularlo hace falta
              $D^{-3}$.
        pista: |
          $[Q] = L^{3}T^{-1}$. La densidad no hace falta aquí — su exponente
          sale cero — así que solo quedan $n$ y $D$.
        desarrollo: |
          $$
          (L^{3}T^{-1})(ML^{-3})^{a}(T^{-1})^{b}(L)^{c} = M^{0}L^{0}T^{0}
          $$

          De $M$: $a = 0$. De $T$: $-1-b = 0 \Rightarrow b = -1$. De $L$:
          $3 + c = 0 \Rightarrow c = -3$.

          $$
          \boxed{\pi_2 = \frac{Q}{n\,D^{3}}}
          $$

          Que la densidad desaparezca tiene sentido: un caudal es geometría por
          tiempo, y ahí la masa no pinta nada.
      - tipo: reconocer
        pregunta: |
          Los dos primeros grupos no son nuevos. ¿De qué te suenan?
        opciones:
          - texto: >-
              Son los parámetros de Rateau del tema 22: el coeficiente de
              altura y el de caudal
            correcta: true
            mensaje: |
              Exacto, y esa es la gracia del ejercicio. $H/(n^{2}D^{2})$ y
              $Q/(nD^{3})$ son las dos constantes con las que se comparan
              máquinas semejantes, y **salen solas** del análisis dimensional:
              no hay que memorizarlas.
          - texto: Son el número de Reynolds y el de Froude
            mensaje: |
              El tercero, $\nu/(nD^{2})$, sí es un Reynolds disfrazado —con
              $nD$ haciendo de velocidad—. Pero los dos primeros no: son los
              coeficientes de altura y de caudal.
          - texto: >-
              No se parecen a nada conocido; son propios de este enunciado
            mensaje: |
              Son exactamente las dos expresiones que el tema 22 usa para la
              semejanza de turbomáquinas, y las que el tema 25 emplea al variar
              el régimen de giro de una bomba.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay seis variables y tres dimensiones fundamentales, así que el
              teorema de Vaschy-Buckingham anuncia tres grupos.
          - texto: >-
              Con $\rho$, $n$ y $D$ como repetidas, cada grupo se forma con una
              de las tres variables restantes y las tres repetidas elevadas a
              exponentes por determinar.
          - texto: >-
              Imponiendo que cada grupo sea adimensional salen tres ecuaciones
              —una por dimensión— y tres exponentes.
          - texto: >-
              Las variables repetidas se eligen porque son las más importantes
              del fenómeno.
            trampa: true
            mensaje: |
              Se eligen porque **entre las tres contienen las tres dimensiones y
              no forman por sí solas un grupo adimensional**, no por importancia.
              De hecho la variable que más interesa —aquí $\Delta p$— nunca se
              pone como repetida: se quiere que aparezca en un solo grupo, para
              poder despejarla.
          - texto: >-
              Salen $\Delta p/(\rho n^{2}D^{2})$, $Q/(nD^{3})$ y
              $\nu/(nD^{2})$, y los dos primeros son los parámetros de Rateau.
    resolucion: |
      **Cuántos grupos.** Seis variables —$\Delta p$, $Q$, $n$, $\rho$, $\nu$,
      $D$— y tres dimensiones fundamentales, así que el teorema de
      Vaschy-Buckingham anuncia $6-3 = 3$ grupos. Eso se sabe **antes** de
      montar nada, y sirve de comprobación al final.

      **Los tres grupos.** Con $\rho$, $n$ y $D$ como repetidas, cada una de
      las tres variables restantes forma un grupo:

      $$
      \pi_1 = \frac{\Delta p}{\rho\,n^{2}D^{2}}
      \qquad
      \pi_2 = \frac{Q}{n\,D^{3}}
      \qquad
      \pi_3 = \frac{\nu}{n\,D^{2}}
      $$

      **Qué son.** Los dos primeros son los **parámetros de Rateau** del tema
      22 —el coeficiente de altura y el de caudal—, los mismos con los que el
      tema 25 cambia el régimen de giro de una bomba. El tercero es un
      **Reynolds** con $nD$ haciendo de velocidad característica.

      **Lo que hay que llevarse.** Las leyes de semejanza de las turbomáquinas
      no son una tabla que memorizar: **salen del análisis dimensional en tres
      líneas**, y con ellas sale también el aviso de que hay un tercer grupo
      —el Reynolds— que en la práctica se desprecia porque en las máquinas
      grandes apenas cambia.

  - id: ejflu16-col56-el-proyectil-y-el-numero-de-mach
    titulo: El proyectil rápido, y de dónde sale el número de Mach
    fuente: >-
      Ejercicio 5.6 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La resistencia $F$ sobre un proyectil de alta velocidad depende de la
      velocidad $V$ del proyectil, de la densidad del fluido $\rho$, de la
      velocidad del sonido $a$, del diámetro del proyectil $D$ y de la
      viscosidad del fluido $\mu$.

      **a)** Encontrar los parámetros adimensionales que definen el fenómeno
      físico, mediante el teorema de $\pi$. Hágase el problema por el método
      rápido.
    pide: Los tres parámetros adimensionales, tomando la velocidad del sonido como repetida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado incluye la velocidad del sonido entre las variables.
          ¿Qué está diciendo con eso?
        opciones:
          - texto: >-
              Que el fluido se va a comportar como compresible, y que va a
              aparecer un grupo con la forma $V/a$
            correcta: true
            mensaje: |
              Eso es. La velocidad del sonido solo entra en un problema cuando
              la compresibilidad importa, y en cuanto entra aparece
              inevitablemente el cociente $V/a$ — el número de Mach. En un
              problema de agua en tubería no estaría.
          - texto: Que hay que tener en cuenta el ruido del disparo
            mensaje: |
              La velocidad del sonido aquí no tiene que ver con el sonido que
              se oye: es la velocidad a la que se propagan las perturbaciones
              de presión en el fluido, y por tanto la medida de su
              compresibilidad.
          - texto: >-
              Que el proyectil va más rápido que el sonido, necesariamente
            mensaje: |
              No lo dice: dice «alta velocidad». Que $V$ sea mayor o menor que
              $a$ es precisamente lo que decide el grupo $V/a$, y el análisis
              vale en los dos casos.
      - tipo: calcular
        titulo: El exponente de la velocidad del sonido
        pregunta: |
          En $\pi_1 = F \cdot \rho^{x} a^{y} D^{z}$, ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-1'
            mensaje: |
              Quedaría un $T^{-1}$ suelto. La fuerza aporta $T^{-2}$ y la única
              repetida con tiempo es $a$, con $T^{-1}$: hacen falta dos.
          - valor: '-4'
            mensaje: >-
              Ese es el exponente que saldría si el grupo llevara $n$, una
              velocidad de giro, en vez de una velocidad lineal. Aquí $a$ es
              $LT^{-1}$, no $T^{-1}$.
        pista: |
          $[F] = MLT^{-2}$, $[\rho] = ML^{-3}$, $[a] = LT^{-1}$, $[D] = L$.
          Empieza por la masa, sigue por el tiempo y termina por la longitud.
        desarrollo: |
          $$
          (MLT^{-2})(ML^{-3})^{x}(LT^{-1})^{y}(L)^{z} = M^{0}L^{0}T^{0}
          $$

          | | ecuación | sale |
          |---|---|---|
          | $M$ | $1 + x = 0$ | $x = -1$ |
          | $T$ | $-2 - y = 0$ | $y = -2$ |
          | $L$ | $1 - 3x + y + z = 0$ | $z = -2$ |

          $$
          \boxed{\pi_1 = \frac{F}{\rho\,a^{2}D^{2}}}
          $$

          El orden importa poco, pero empezar por la masa y el tiempo ahorra
          trabajo: los dos aparecen en una sola variable cada uno.
      - tipo: calcular
        titulo: El tercer grupo
        pregunta: |
          El tercer grupo es $\mu/(\rho\,a\,D)$. ¿Qué número adimensional
          conocido es su inverso?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: escribe 1 si es un Reynolds, 2 si es un Froude, 3 si es un Weber
        distractores:
          - valor: '2'
            mensaje: |
              El Froude compara inercia con gravedad y lleva una $g$ dentro.
              Aquí no hay gravedad por ninguna parte: el grupo lleva viscosidad,
              así que es un Reynolds.
          - valor: '3'
            mensaje: >-
              El Weber lleva tensión superficial, que aquí no aparece. Un grupo
              con $\mu$ en el numerador y $\rho\,\ell\,v$ en el denominador es
              el inverso de un Reynolds.
        pista: |
          Mira qué variable física lleva dentro: $\mu$ es viscosidad.
        desarrollo: |
          $$
          \pi_3 = \frac{\mu}{\rho\,a\,D}
          = \frac{1}{Re_a}
          $$

          Es un **Reynolds construido con la velocidad del sonido** en vez de
          con la del proyectil. No es un capricho: al elegir $a$ como variable
          repetida, todas las velocidades del problema se miden contra ella.

          Y como $Re_V = Re_a \cdot (V/a) = Re_a\cdot M$, los tres grupos
          contienen la misma información que $F/(\rho V^{2}D^{2})$, $M$ y
          $Re_V$: **la elección de repetidas cambia la cara de los grupos, no
          la física**.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Seis variables y tres dimensiones dan tres grupos adimensionales.
          - texto: >-
              Con $\rho$, $a$ y $D$ como repetidas, los tres grupos se forman
              con $F$, $V$ y $\mu$.
          - texto: >-
              Sale $F/(\rho a^{2}D^{2})$, el número de Mach $V/a$ y un Reynolds
              construido sobre la velocidad del sonido.
          - texto: >-
              Como las repetidas son otras, estos grupos describen un fenómeno
              distinto del que describirían con $V$ repetida.
            trampa: true
            mensaje: |
              El fenómeno es el mismo. Cambiar las variables repetidas cambia
              **la forma** de los grupos, no la física: cada juego se obtiene
              del otro multiplicando y dividiendo grupos entre sí. Aquí,
              $Re_V = Re_a \cdot M$.
          - texto: >-
              La ley adimensional queda
              $F/(\rho a^{2}D^{2}) = f(M,\ 1/Re_a)$.
    resolucion: |
      **Cuántos.** Seis variables —$F$, $V$, $\rho$, $a$, $D$, $\mu$— y tres
      dimensiones: tres grupos.

      **Los tres**, con $\rho$, $a$ y $D$ como repetidas:

      $$
      \pi_1 = \frac{F}{\rho\,a^{2}D^{2}}
      \qquad
      \pi_2 = \frac{V}{a}
      \qquad
      \pi_3 = \frac{\mu}{\rho\,a\,D}
      $$

      **Qué son.** El segundo es el **número de Mach**, y aparece en cuanto la
      velocidad del sonido entra en la lista — que es la forma que tiene un
      enunciado de decir «esto es compresible». El tercero es un **Reynolds**
      construido con $a$ en vez de con $V$.

      **Lo que hay que llevarse.** Que los grupos salgan con $a$ y no con $V$
      no cambia la física: $Re_V = Re_a\cdot M$, así que un juego se obtiene
      del otro. **Las variables repetidas cambian la cara de la respuesta, no
      la respuesta**, y por eso el enunciado tiene que decir cuáles se toman —
      si no, hay infinitas presentaciones correctas.

  - id: ejflu16-col510-los-siete-grupos-de-una-tuberia
    titulo: Siete grupos para una tubería, y por qué el tema 18 usa solo dos
    fuente: >-
      Ejercicio 5.10 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Determinar de qué parámetros $\pi$ adimensionales depende la pérdida de
      carga en una tubería, sabiendo que la caída de presión es función del
      diámetro $D$, la longitud $L$, la rugosidad $\varepsilon$, la velocidad
      media $V$, la viscosidad del fluido que circula $\mu$, la densidad del
      mismo $\rho$, la tensión superficial $\sigma$, la gravedad $g$ y el
      módulo de elasticidad volumétrico $K$.

      **a)** De los parámetros que se obtengan, indicar su nombre y la relación
      de fuerzas a que equivale.

      Nota: tómense como variables repetidas $\rho$, $V$, $D$.
    pide: Los siete parámetros adimensionales, con su nombre y la relación de fuerzas de cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Diez variables y tres dimensiones. ¿Cuántos grupos salen?
        opciones:
          - texto: Siete
            correcta: true
            mensaje: |
              $10 - 3 = 7$. Y merece la pena pararse en el número: siete grupos
              para un problema que en el tema 18 se resuelve con **dos**. Esa
              diferencia es el contenido de este ejercicio.
          - texto: Diez, uno por variable
            mensaje: |
              Entonces el teorema no habría agrupado nada. El punto es
              justamente que diez variables se reducen a siete grupos, y en la
              práctica a dos.
          - texto: Tres, como las variables repetidas
            mensaje: |
              Tres es el número de **repetidas**, que es $k$. El número de
              grupos es $n - k = 10 - 3 = 7$.
      - tipo: calcular
        titulo: El grupo de la gravedad
        pregunta: |
          En $\pi = g\cdot\rho^{x}V^{y}D^{z}$, ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-1'
            mensaje: |
              Quedaría un tiempo sin cancelar. $[g] = LT^{-2}$ y
              $[V] = LT^{-1}$: hacen falta dos velocidades para anular el
              $T^{-2}$.
          - valor: '2'
            mensaje: >-
              El signo al revés. Con $V^{2}$ en el numerador el grupo tendría
              $T^{-4}$; hace falta dividir, no multiplicar.
        pista: |
          $[g] = LT^{-2}$. La densidad no entra —su exponente sale cero—, así
          que solo hay que casar $V$ y $D$.
        desarrollo: |
          $$
          (LT^{-2})(ML^{-3})^{x}(LT^{-1})^{y}(L)^{z} = M^{0}L^{0}T^{0}
          $$

          De $M$: $x = 0$. De $T$: $-2-y = 0 \Rightarrow y = -2$. De $L$:
          $1 + y + z = 0 \Rightarrow z = 1$.

          $$
          \pi = \frac{g\,D}{V^{2}} = \frac{1}{Fr^{2}}
          $$

          Es el inverso del cuadrado del número de **Froude**, que compara la
          inercia con la gravedad.
      - tipo: reconocer
        pregunta: |
          El tema 18 dice que el coeficiente de frotamiento depende solo de
          $Re$ y de $\varepsilon/D$. Aquí han salido siete grupos. ¿Se
          contradicen?
        opciones:
          - texto: >-
              No: en una tubería llena de líquido, cuatro de los siete no
              intervienen, y el de la longitud se factoriza aparte
            correcta: true
            mensaje: |
              Exacto, y esa es la lectura del ejercicio. **Froude** exige
              superficie libre y en un conducto lleno no la hay; **Weber**
              exige una interfaz entre dos fluidos; **Cauchy** exige
              compresibilidad, y un líquido no la tiene a estas presiones. El
              de $L/D$ no desaparece: sale fuera, y es la $L/D$ que Darcy-
              Weisbach lleva delante. Quedan $Re$ y $\varepsilon/D$.
          - texto: >-
              Sí: el análisis dimensional da la respuesta buena y el tema 18
              simplifica de más
            mensaje: |
              El análisis dimensional dice de qué **puede** depender, no de qué
              depende. Descartar los grupos que no intervienen en un caso
              concreto no es simplificar de más: es el paso siguiente, y hay
              que saber justificarlo.
          - texto: >-
              Sí: el tema 18 se olvidó del número de Euler
            mensaje: |
              El número de Euler no falta: **es la incógnita**.
              $\Delta p/(\rho V^{2})$ es justamente lo que se quiere calcular, y
              por eso aparece despejado a un lado de la ley adimensional y no
              como variable de la que depende.
      - tipo: justificar
        pregunta: |
          Ordena la lectura de los siete grupos. Una pieza es falsa.
        piezas:
          - texto: >-
              $L/D$ y $\varepsilon/D$ son puramente geométricos: no llevan
              ninguna magnitud física dentro.
          - texto: >-
              $\Delta p/(\rho V^{2})$ es el número de **Euler**, y compara las
              fuerzas de presión con las de inercia. Es la incógnita.
          - texto: >-
              $\mu/(\rho V D)$ es el inverso del **Reynolds**, que compara las
              viscosas con las de inercia; $gD/V^{2}$, el inverso del cuadrado
              del **Froude**, que compara la gravedad con la inercia.
          - texto: >-
              $\sigma/(\rho V^{2}D)$ es el inverso del **Weber**, y como toda
              tubería tiene tensión superficial en su pared, siempre interviene.
            trampa: true
            mensaje: |
              La tensión superficial no aparece entre un líquido y una pared
              sólida: aparece en una **interfaz entre dos fluidos**. En una
              tubería que va llena no hay ninguna, así que el Weber no
              interviene — y por eso desaparece de la lista del tema 18. Sí
              intervendría en un canal, o en un tubo capilar.
          - texto: >-
              $K/(\rho V^{2})$ es el inverso del **Cauchy**, que compara las
              elásticas con las de inercia, y solo cuenta si el fluido es
              compresible.
    resolucion: |
      **Cuántos.** Diez variables y tres dimensiones: **siete grupos**.

      **Los siete**, con $\rho$, $V$ y $D$ como repetidas, y lo que significa
      cada uno:

      | grupo | nombre | compara |
      |---|---|---|
      | $L/D$ | — | geometría |
      | $\varepsilon/D$ | rugosidad relativa | geometría |
      | $\Delta p/(\rho V^{2})$ | **Euler** | presión / inercia |
      | $\mu/(\rho V D)$ | inverso de **Reynolds** | viscosas / inercia |
      | $gD/V^{2}$ | inverso de **Froude**$^{2}$ | gravedad / inercia |
      | $\sigma/(\rho V^{2}D)$ | inverso de **Weber** | tensión superficial / inercia |
      | $K/(\rho V^{2})$ | inverso de **Cauchy** | elásticas / inercia |

      **Y ahora la parte que importa**, porque el tema 18 resuelve este mismo
      problema con dos grupos y no con siete:

      - el **Euler** no es un dato, **es la incógnita**: se despeja a un lado;
      - el **Froude** necesita superficie libre, y una tubería llena no la
        tiene;
      - el **Weber** necesita una interfaz entre dos fluidos, y tampoco la hay;
      - el **Cauchy** necesita compresibilidad, y un líquido no la tiene a
        estas presiones;
      - y $L/D$ **no desaparece**: sale factorizado, y es la $L/D$ que
        Darcy-Weisbach lleva delante.

      Quedan $Re$ y $\varepsilon/D$, que es exactamente
      $f = f(Re,\ \varepsilon/D)$ — el ábaco de Moody.

      **Lo que hay que llevarse.** El análisis dimensional dice de qué **puede**
      depender un fenómeno; decidir cuáles de esos grupos intervienen de verdad
      es un paso aparte, y es física, no álgebra. Los siete grupos de aquí y los
      dos del tema 18 no se contradicen: los cinco que faltan se han descartado
      uno a uno, con motivo.

  - id: ejflu16-col514-la-helice-y-las-dos-semejanzas-incompatibles
    titulo: La hélice, y por qué no se pueden cumplir las dos semejanzas a la vez
    fuente: >-
      Ejercicio 5.14 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Para estudiar las características de una hélice de $4$ m de diámetro,
      girando a $100$ rpm, se realiza una maqueta semejante geométricamente, de
      $0{,}50$ m de diámetro. En estas condiciones, despreciando la gravedad,
      se sabe que la fuerza de propulsión de la hélice puede expresarse bajo la
      forma

      $$
      R = \rho\,V^{2}D^{2}\,f\!\left(\frac{VD}{\nu},\ \frac{V}{ND}\right)
      $$

      Se pide:

      **a)** Demostrar que, si la maqueta se mueve en el mismo fluido que el
      prototipo, la semejanza dinámica completa es imposible. Considerar
      inapropiada $N_m > 4000$ rpm.

      **b)** Despreciando la viscosidad, si se hace girar la maqueta a $360$
      rpm, la fuerza de propulsión es de $23$ kg, el par aplicado
      $2{,}27$ mkg y la velocidad $V = 9$ km/h, determinar estos valores en el
      prototipo.
    pide: Por qué la semejanza completa es imposible, y la velocidad, fuerza y par del prototipo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La ley adimensional tiene **dos** grupos. ¿Qué exige la semejanza
          dinámica completa?
        opciones:
          - texto: >-
              Que los dos coincidan a la vez entre modelo y prototipo, y son
              dos condiciones sobre una sola incógnita
            correcta: true
            mensaje: |
              Ahí está el conflicto. Fijada la escala geométrica, lo único que
              queda por elegir son la velocidad y el régimen del modelo; dos
              grupos son dos ecuaciones, y con el mismo fluido el sistema pide
              un régimen absurdo.
          - texto: Que coincida el más importante de los dos
            mensaje: |
              «Completa» significa **los dos**. Cumplir solo uno es semejanza
              parcial, que es lo que se acaba haciendo — pero entonces hay que
              decir cuál se ha sacrificado y por qué.
          - texto: >-
              Que el modelo y el prototipo tengan el mismo diámetro
            mensaje: |
              Entonces no habría modelo. La semejanza geométrica ya está dada
              —la maqueta es semejante— y lo que falta es la dinámica, que va
              sobre los grupos adimensionales.
      - tipo: calcular
        titulo: El régimen que exigiría la semejanza completa
        pregunta: |
          Con el mismo fluido en los dos, ¿a cuántas rpm habría que girar la
          maqueta para cumplir los dos grupos?
        respuesta:
          tipo: magnitud
          valor: 6400 rpm
          tolerancia: 0.02
          formato: una velocidad de giro, con su unidad
        distractores:
          - valor: 800 rpm
            mensaje: |
              Has aplicado la escala una sola vez. El régimen va con
              $\lambda^{2}$: una vez porque Reynolds pide multiplicar la
              velocidad por $\lambda$, y otra porque $V/(ND)$ pide dividir el
              diámetro. $100\cdot 8^{2} = 6400$.
          - valor: 12.5 rpm
            mensaje: >-
              Has dividido en vez de multiplicar. El modelo es **más pequeño**,
              así que para igualar el Reynolds con el mismo fluido tiene que ir
              más deprisa, no más despacio.
        pista: |
          Reynolds con el mismo $\nu$ obliga a $V_mD_m = V_pD_p$. Mete eso en
          $V/(ND)$ y despeja $N_m$.
        desarrollo: |
          La escala es $\lambda = D_p/D_m = 4/0{,}5 = 8$.

          **Reynolds**, con el mismo fluido, obliga a $V_m D_m = V_p D_p$, o sea
          $V_m = \lambda V_p$: el modelo, ocho veces más rápido.

          **El segundo grupo**, $V/(ND)$, obliga entonces a

          $$
          \frac{N_m}{N_p} = \frac{V_m}{V_p}\cdot\frac{D_p}{D_m}
          = \lambda\cdot\lambda = \lambda^{2} = 64
          $$

          $$
          \boxed{N_m = 100 \cdot 64 = 6400\ \text{rpm}}
          $$

          Muy por encima de las 4000 que el enunciado marca como límite: la
          semejanza completa **no se puede ensayar**. Y no es un problema de
          este montaje, es estructural — con el mismo fluido, dos grupos y una
          escala, el régimen se dispara con el cuadrado.
      - tipo: calcular
        titulo: La velocidad del prototipo
        pregunta: |
          Despreciando ya la viscosidad, con la maqueta a $360$ rpm y
          $9$ km/h, ¿a qué velocidad va el prototipo?
        respuesta:
          tipo: magnitud
          valor: 20 km/h
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: 72 km/h
            mensaje: |
              Has escalado solo con el diámetro y te has olvidado del régimen.
              El grupo que se conserva es $V/(ND)$: el prototipo es 8 veces más
              grande pero gira 3,6 veces más despacio.
          - valor: 2.5 km/h
            mensaje: >-
              Has puesto la escala al revés. El prototipo es el **grande**:
              $V_p = V_m\,(N_pD_p)/(N_mD_m)$, con $N_pD_p = 400$ y
              $N_mD_m = 180$.
        pista: |
          Al despreciar la viscosidad solo queda un grupo, $V/(ND)$, y con él
          basta.
        desarrollo: |
          $$
          \frac{V_p}{N_pD_p} = \frac{V_m}{N_mD_m}
          \;\Longrightarrow\;
          V_p = 9\,\frac{100\cdot 4}{360\cdot 0{,}5} = 9\cdot\frac{400}{180}
          = 20\ \text{km/h}
          $$
      - tipo: calcular
        titulo: La fuerza de propulsión del prototipo
        pregunta: |
          ¿Y la fuerza?
        respuesta:
          tipo: magnitud
          valor: 7269 kg
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: 1472 kg
            mensaje: |
              Has usado $D^{2}$ en vez de $D^{4}$. Al escribir la fuerza con
              $V/(ND)$ constante, $V$ se sustituye por $ND$ y
              $\rho V^{2}D^{2}$ se convierte en $\rho N^{2}D^{4}$.
          - valor: 94208 kg
            mensaje: >-
              Te has dejado el factor del régimen. El prototipo gira 3,6 veces
              más despacio, y eso divide por $3{,}6^{2} = 12{,}96$.
        pista: |
          Con $V/(ND)$ constante, $R = \rho V^{2}D^{2}$ se escribe
          $R \propto \rho N^{2}D^{4}$.
        desarrollo: |
          $$
          \frac{R}{\rho N^{2}D^{4}} = \text{cte}
          \;\Longrightarrow\;
          R_p = 23\left(\frac{100}{360}\right)^{2}\!\left(\frac{4}{0{,}5}\right)^{4}
          = 23 \cdot 0{,}0772 \cdot 4096
          $$

          $$
          \boxed{R_p = 7269\ \text{kg}}
          $$

          Y el par, con una potencia más de diámetro porque lleva un brazo:

          $$
          M_p = 2{,}27\left(\frac{100}{360}\right)^{2}\!\left(\frac{4}{0{,}5}\right)^{5}
          = 5739\ \text{m}\cdot\text{kg}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              La semejanza dinámica completa exige que coincidan **los dos**
              grupos, $VD/\nu$ y $V/(ND)$.
          - texto: >-
              Con el mismo fluido, igualar Reynolds obliga a que el modelo vaya
              $\lambda$ veces más rápido que el prototipo.
          - texto: >-
              Metiendo esa velocidad en el segundo grupo, el régimen del modelo
              sale $\lambda^{2}$ veces el del prototipo: 6400 rpm.
          - texto: >-
              El problema se resolvería usando un modelo más grande, porque así
              la velocidad exigida bajaría.
            trampa: true
            mensaje: |
              Un modelo más grande reduce $\lambda$, sí — pero también reduce la
              razón de ser del modelo. En el límite, $\lambda = 1$ y el
              «modelo» es el prototipo. La salida real es **cambiar de fluido**
              o **renunciar a un grupo**, que es lo que hace el apartado b) al
              despreciar la viscosidad.
          - texto: >-
              6400 rpm está por encima del límite de 4000, así que el ensayo
              con semejanza completa no es realizable.
    resolucion: |
      **El apartado a), que es el que enseña algo.** La ley adimensional tiene
      dos grupos, y la semejanza completa exige los dos a la vez. Con el mismo
      fluido, igualar Reynolds obliga a $V_m = \lambda V_p$; metiendo eso en
      $V/(ND)$ sale $N_m = \lambda^{2}N_p = 64\cdot 100 = 6400$ rpm, por encima
      del límite de 4000. **No es un problema de este montaje: es estructural.**
      Con el mismo fluido, el régimen del modelo crece con el **cuadrado** de la
      escala.

      Las dos salidas posibles son cambiar de fluido —lo que hace el ejercicio
      5.4, que acaba pidiendo mercurio— o renunciar a un grupo, que es lo que
      hace el apartado b).

      **El apartado b)**, ya sin viscosidad y con un solo grupo:

      $$
      V_p = V_m\frac{N_pD_p}{N_mD_m} = 20\ \text{km/h}
      \qquad
      R_p = R_m\left(\frac{N_p}{N_m}\right)^{2}\lambda^{4} = 7269\ \text{kg}
      $$

      $$
      M_p = M_m\left(\frac{N_p}{N_m}\right)^{2}\lambda^{5} = 5739\ \text{m}\cdot\text{kg}
      $$

      **Lo que hay que llevarse.** El par lleva **una potencia más de diámetro
      que la fuerza**, porque es fuerza por brazo. Y la fuerza va con $D^{4}$ y
      no con $D^{2}$ porque al fijar $V/(ND)$ la velocidad se ha sustituido por
      $ND$: $\rho V^{2}D^{2} \rightarrow \rho N^{2}D^{4}$.

  - id: ejflu16-col516-el-torpedo-y-la-cavitacion
    titulo: A qué velocidad cavita el torpedo si baja doce metros más
    fuente: >-
      Ejercicio 5.16 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Al acelerar el agua desde el reposo hasta una velocidad determinada la
      presión desciende, hasta el punto de poder producirse la cavitación. Esto
      ocurre, por ejemplo, en la región de bajas presiones asociadas a los
      torbellinos de punta de pala en una hélice de barco.

      Por esta razón, cuando un torpedo se mueve $8$ m por debajo de la
      superficie del agua del mar con una velocidad de $21$ m/s, analizando el
      flujo relativo del agua respecto al torpedo se produce un descenso de
      presión que produce cavitación.

      Recordando que el estudio de un fenómeno en la investigación experimental
      en mecánica de fluidos está definido por la expresión
      $Eu = f(Fr,\ Re,\ M)$ y que el número de Euler es
      $Eu = \Delta p/(\rho v^{2})$, hallar:

      **a)** Si los efectos de viscosidad, gravedad y compresibilidad son
      despreciables, ¿a qué velocidad se producirá cavitación cuando se mueva a
      $20$ m de profundidad?

      **b)** Si se quieren tener en cuenta los efectos de la viscosidad, ¿a qué
      escala se debería construir el modelo del torpedo que, moviéndose a
      $20$ m de profundidad, fuese dinámicamente semejante al prototipo, que se
      mueve a $8$ m?

      **c)** Con este modelo, ¿se puede asegurar la semejanza absoluta?

      Datos: $p_v = 2400$ Pa (absoluta); $p_{atm} = 101$ kPa;
      $\rho_{agua} = 1025\ \text{kg/m}^{3}$.
    pide: La velocidad de cavitación a 20 m, la escala del modelo y si hay semejanza absoluta.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el $\Delta p$ que hay que meter en el número de Euler?
        opciones:
          - texto: >-
              La diferencia entre la presión del agua a esa profundidad y la de
              vapor, porque es la caída que el torpedo tiene que provocar para
              que cavite
            correcta: true
            mensaje: |
              Eso es. La cavitación empieza cuando la presión local baja hasta
              la de vapor, así que el margen disponible es
              $p_{amb} - p_v$. Cuanto más hondo, más margen, y por eso hace
              falta más velocidad.
          - texto: La presión absoluta a esa profundidad, sin más
            mensaje: |
              Faltaría restarle la de vapor. El torpedo no tiene que bajar la
              presión hasta cero, sino hasta $2400$ Pa: lo que cuenta es la
              **diferencia** hasta ahí.
          - texto: La presión atmosférica, que es la referencia
            mensaje: |
              A 8 o a 20 metros de profundidad la atmosférica es solo una parte
              de lo que hay: el peso de la columna de agua aporta más que ella
              a 20 m. Hay que contar las dos.
      - tipo: calcular
        titulo: La velocidad a veinte metros
        pregunta: |
          ¿A qué velocidad cavitará el torpedo a $20$ m de profundidad?
        respuesta:
          tipo: magnitud
          valor: 27.17 m/s
          tolerancia: 0.01
          formato: una velocidad, con su unidad
        distractores:
          - valor: 33.2 m/s
            mensaje: |
              Has escalado con la profundidad, $21\sqrt{20/8}$. Lo que se
              conserva es el Euler, y en él entra la **presión disponible**
              —atmosférica más columna, menos la de vapor—, no la profundidad
              sola.
          - valor: 52.5 m/s
            mensaje: >-
              Has escalado linealmente con la presión en vez de con su raíz. En
              $\Delta p/(\rho v^{2})$ la velocidad va al cuadrado, así que
              $v \propto \sqrt{\Delta p}$.
        pista: |
          Igual número de Euler en los dos casos:
          $\Delta p_1/v_1^{2} = \Delta p_2/v_2^{2}$, con
          $\Delta p = p_{atm} + \rho g z - p_v$.
        desarrollo: |
          **La presión disponible** a cada profundidad:

          $$
          \Delta p_{8} = 101\,000 + 1025\cdot 9{,}8\cdot 8 - 2400
          = 178\,960\ \text{Pa}
          $$

          $$
          \Delta p_{20} = 101\,000 + 1025\cdot 9{,}8\cdot 20 - 2400
          = 299\,500\ \text{Pa}
          $$

          **Igualando el número de Euler**, que es lo único que queda al
          despreciar viscosidad, gravedad y compresibilidad:

          $$
          v_2 = v_1\sqrt{\frac{\Delta p_2}{\Delta p_1}}
          = 21\sqrt{\frac{299\,500}{178\,960}} = 27{,}17\ \text{m/s}
          $$

          Más hondo, más margen antes de llegar a la presión de vapor, y por
          tanto más velocidad hace falta para cavitar.
      - tipo: calcular
        titulo: La escala del modelo
        pregunta: |
          Si además hay que igualar el Reynolds, ¿qué escala
          $L_p/L_m$ tiene el modelo?
        respuesta:
          tipo: numero
          valor: '1.29'
          tolerancia: 0.03
          formato: una relación de escala, sin unidades
        distractores:
          - valor: '0.77'
            mensaje: >-
              Es la escala invertida. El modelo va **más rápido**, así que para
              mantener $vL$ constante tiene que ser **más pequeño**: $L_p/L_m$
              es mayor que 1.
          - valor: '2.5'
            mensaje: |
              Has usado la relación de profundidades, $20/8$. La escala sale de
              igualar Reynolds, o sea de la relación de **velocidades**:
              $27{,}17/21$.
        pista: |
          Mismo fluido, así que Reynolds igual significa $v_pL_p = v_mL_m$.
        desarrollo: |
          $$
          Re_p = Re_m
          \;\Longrightarrow\;
          v_p L_p = v_m L_m
          \;\Longrightarrow\;
          \frac{L_p}{L_m} = \frac{v_m}{v_p} = \frac{27{,}17}{21} = 1{,}29
          $$

          Un modelo apenas un 30 % más pequeño que el prototipo: la semejanza
          por Reynolds con el mismo fluido casi no deja reducir nada, que es la
          misma pega del ejercicio de la hélice.
      - tipo: justificar
        pregunta: |
          El apartado c) pregunta si hay semejanza absoluta. Ordena la
          respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La semejanza absoluta exigiría igualar a la vez Euler, Reynolds,
              Froude y Mach.
          - texto: >-
              Euler y Reynolds sí se han igualado: son los que han fijado la
              velocidad y la escala.
          - texto: >-
              Mach no interviene, porque a estas velocidades el agua no se
              comporta como compresible.
          - texto: >-
              Froude tampoco interviene, porque el torpedo va sumergido y no
              hay superficie libre que deformar.
            trampa: true
            mensaje: |
              Sí interviene, y es justo lo que hace fallar la semejanza
              absoluta. Froude compara inercia con **gravedad**, y aquí la
              gravedad está muy presente: es la que crea la presión hidrostática
              del enunciado. Igualarlo pediría $v_m/v_p = \sqrt{L_m/L_p}$, o sea
              que el modelo fuera más **lento**, y Reynolds pide lo contrario.
          - texto: >-
              Como flujo en carga la semejanza vale, pero teniendo en cuenta el
              número de Froude, no.
    resolucion: |
      **La idea.** La cavitación empieza cuando la presión local llega a la de
      vapor, así que lo que gobierna es la **presión disponible**,
      $p_{atm} + \rho g z - p_v$. Cuanto más hondo, más margen, y más velocidad
      hace falta para gastarlo.

      **a)** Igualando el número de Euler, que es lo único que queda al
      despreciar los otros tres:

      $$
      v_2 = 21\sqrt{\frac{299\,500}{178\,960}} = 27{,}17\ \text{m/s}
      $$

      **b)** Con el Reynolds también igualado y el mismo fluido,
      $v_pL_p = v_mL_m$, luego $L_p/L_m = 27{,}17/21 = 1{,}29$.

      **c)** No hay semejanza absoluta. **Como flujo en carga sí** —Euler y
      Reynolds se han igualado y Mach no interviene—, pero **el número de
      Froude no se cumple**: exigiría un modelo más lento y Reynolds lo pide
      más rápido. Son incompatibles con el mismo fluido.

      **Lo que hay que llevarse.** Es el mismo choque que en la hélice del 5.14
      y en el buque del 5.4: **Froude y Reynolds tiran en sentidos opuestos**, y
      con un solo fluido no se pueden cumplir los dos. Lo que cambia de un
      problema a otro es cuál se sacrifica y con qué excusa.

  - id: ejflu16-col518-el-vertedero-a-escala-uno-veinte
    titulo: El vertedero a escala 1:20, con la ley de Froude
    fuente: >-
      Ejercicio 5.18 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Un vertedero en pared gruesa se investiga en el laboratorio con un modelo
      geométricamente semejante, construido a escala $1{:}20$. Determinar:

      **a)** La carga necesaria en el vertedero modelo $h_m$ si en el prototipo
      es de $3$ m.
      **b)** El caudal en el prototipo, si en el modelo es
      $0{,}19\ \text{m}^{3}/\text{s}$.
      **c)** La carga de presión sobre el vertedero prototipo, si en el modelo
      se obtuvo una presión de vacío de $200$ mm de columna de agua.

      En vista del poco efecto de la viscosidad, el modelo se probó de acuerdo
      con la ley de Froude.
    pide: La carga del modelo, el caudal del prototipo y su carga de presión.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se ensaya con la ley de Froude y no con la de Reynolds?
        opciones:
          - texto: >-
              Porque en un vertedero hay superficie libre y manda la gravedad;
              la viscosidad apenas influye
            correcta: true
            mensaje: |
              Eso es el criterio de siempre: **superficie libre, Froude**. El
              agua cae por su peso sobre la pared, y las fuerzas viscosas son
              pequeñas frente a las de gravedad e inercia. En un conducto a
              presión sería al revés.
          - texto: Porque la ley de Froude es más sencilla de aplicar
            mensaje: |
              Lo es, pero esa no es la razón: si el fenómeno lo mandara la
              viscosidad, aplicar Froude daría un resultado cómodo y falso. Se
              elige por física, no por comodidad.
          - texto: Porque el modelo es más pequeño que el prototipo
            mensaje: |
              Eso pasa con cualquier modelo y con cualquier ley de semejanza. Lo
              que decide es **qué fuerza domina el fenómeno**.
      - tipo: calcular
        titulo: El caudal del prototipo
        pregunta: |
          Con $0{,}19\ \text{m}^{3}/\text{s}$ en el modelo, ¿cuánto pasa por el
          prototipo?
        respuesta:
          tipo: magnitud
          valor: 339.9 m3/s
          tolerancia: 0.01
          formato: un caudal, con su unidad
        distractores:
          - valor: 3.8 m3/s
            mensaje: |
              Has escalado con $\lambda$ a secas. El caudal es área por
              velocidad: el área va con $\lambda^{2}$ y la velocidad, por
              Froude, con $\lambda^{1/2}$. En total $\lambda^{5/2}$.
          - valor: 76 m3/s
            mensaje: >-
              Has usado $\lambda^{2}$, o sea solo el área. Falta la velocidad,
              que también crece: $\sqrt{20} = 4{,}47$ veces.
        pista: |
          Por Froude, la velocidad va con $\sqrt{\lambda}$ y el área con
          $\lambda^{2}$. El caudal es el producto.
        desarrollo: |
          $$
          \frac{Q_p}{Q_m} = \lambda^{5/2} = 20^{2{,}5} = 1788{,}9
          $$

          $$
          Q_p = 0{,}19 \cdot 1788{,}9 = 339{,}9\ \text{m}^{3}/\text{s}
          $$

          El exponente $5/2$ es el que hay que recordar de la ley de Froude, y
          se reconstruye en un segundo: dos del área y medio de la velocidad.
      - tipo: calcular
        titulo: La carga de presión del prototipo
        pregunta: |
          En el modelo se midió una presión de vacío de $200$ mm de columna de
          agua. ¿Cuánto vale en el prototipo?
        respuesta:
          tipo: magnitud
          valor: -4 m
          tolerancia: 0.01
          formato: una carga de presión en metros de columna de agua, con su unidad
        distractores:
          - valor: -0.89 m
            mensaje: |
              Has escalado con $\sqrt{\lambda}$, que es lo que le toca a la
              velocidad. Una **altura** de presión es una longitud: escala con
              $\lambda$ a secas.
          - valor: 4 m
            mensaje: >-
              El módulo está bien y el signo no. Era una presión de **vacío**, y
              en el prototipo sigue siéndolo: cuatro metros por debajo de la
              atmosférica.
        pista: |
          Una carga de presión se mide en metros de columna: es una longitud, y
          las longitudes van con $\lambda$.
        desarrollo: |
          $$
          h_p = \lambda\,h_m = 20 \cdot (-0{,}200) = -4\ \text{m de columna de agua}
          $$

          Y el signo importa: **cuatro metros de vacío** sobre el paramento del
          vertedero real es mucho, y es el dato que decide si hay que
          preocuparse por la cavitación en la obra.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al haber superficie libre manda la gravedad, así que el ensayo se
              hace con igualdad de número de Froude.
          - texto: >-
              Las longitudes escalan con $\lambda$, así que la carga del modelo
              es $3/20 = 0{,}15$ m.
          - texto: >-
              Por Froude, las velocidades escalan con $\sqrt{\lambda}$, y el
              caudal —área por velocidad— con $\lambda^{5/2}$.
          - texto: >-
              La presión medida en el modelo también escala con
              $\lambda^{5/2}$, porque es una consecuencia del caudal.
            trampa: true
            mensaje: |
              Cada magnitud escala con la potencia de $\lambda$ que le
              corresponde por sus dimensiones, no por «de dónde viene». Una
              carga de presión está en **metros de columna**: es una longitud, y
              escala con $\lambda$. Con $\lambda^{5/2}$ saldrían 358 m de vacío,
              que es físicamente imposible.
          - texto: >-
              La carga de presión, al ser una longitud, escala con $\lambda$:
              $-0{,}2\cdot 20 = -4$ m.
    resolucion: |
      **La ley que toca.** Hay superficie libre, así que manda la gravedad y el
      ensayo se hace con igualdad de **Froude**. La viscosidad se desprecia, y
      el enunciado lo dice expresamente.

      **Las tres respuestas**, cada una con su exponente:

      | magnitud | escala | resultado |
      |---|---|---|
      | carga $h$ | $\lambda$ | $3/20 = 0{,}15$ m |
      | caudal $Q$ | $\lambda^{5/2}$ | $0{,}19\cdot 1788{,}9 = 339{,}9$ m³/s |
      | carga de presión | $\lambda$ | $-0{,}2\cdot 20 = -4$ m c. de agua |

      **Lo que hay que llevarse.** El exponente no se memoriza, se reconstruye:
      las longitudes van con $\lambda$; las velocidades, por Froude, con
      $\sqrt\lambda$; y el caudal, que es área por velocidad, con
      $\lambda^{2}\cdot\lambda^{1/2} = \lambda^{5/2}$. Una carga de presión, por
      mucho que salga de un ensayo de caudales, sigue siendo **una longitud**.

  - id: ejflu16-col519-el-canal-semicircular-y-los-seis-grupos
    titulo: Seis grupos para un canal, y el líquido que hay que buscar
    fuente: >-
      Ejercicio 5.19 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Se desea estudiar la caída de presión de un fluido
      ($\nu = 4{,}7\cdot 10^{-5}\ \text{m}^{2}/\text{s}$) a lo largo de un canal
      de sección semicircular de diámetro $D$. Se sabe que dicha caída depende
      de las siguientes variables: densidad del fluido circulante $\rho$,
      velocidad media del flujo $V$, longitud del canal $L$, rugosidad de las
      paredes $\varepsilon$, diámetro del canal $D$, gravedad $g$, viscosidad
      absoluta $\mu$ y calado $h$.

      $$
      \Delta p = f(\rho,\ V,\ L,\ \varepsilon,\ D,\ g,\ \mu,\ h)
      $$

      Aplicando el análisis dimensional:

      **a)** ¿Cuántos parámetros adimensionales intervienen en el fenómeno?
      **b)** Obtener dichos parámetros. Variables repetidas: $\rho$, $D$ y $V$.
      **c)** Determinar la viscosidad cinemática del fluido a utilizar en el
      ensayo del modelo para obtener la semejanza absoluta. Dato:
      $\lambda = D_{prototipo}/D_{modelo} = 10$.

      Razónese todo lo que se haga.
    pide: El número de grupos, los grupos, y la viscosidad cinemática del fluido del modelo.
    pasos:
      - tipo: calcular
        titulo: Cuántos grupos
        pregunta: |
          ¿Cuántos parámetros adimensionales salen?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              Nueve son las **variables**, contando $\Delta p$. El teorema resta
              las dimensiones fundamentales: $9 - 3 = 6$.
          - valor: '5'
            mensaje: >-
              Te has dejado $\Delta p$ al contar. Es una variable más del
              fenómeno, y de hecho es la que se quiere despejar.
        pista: |
          Vaschy-Buckingham: variables menos dimensiones fundamentales. Cuenta
          bien las variables, incluida la incógnita.
        desarrollo: |
          Las variables son nueve —$\Delta p$, $\rho$, $V$, $L$, $\varepsilon$,
          $D$, $g$, $\mu$ y $h$— y las dimensiones fundamentales, tres.

          $$
          \pi = 9 - 3 = \boxed{6}
          $$
      - tipo: reconocer
        pregunta: |
          Este canal tiene un grupo que la tubería del ejercicio 5.10 no tenía:
          $h/D$. ¿Por qué aparece aquí?
        opciones:
          - texto: >-
              Porque el canal no va lleno: el calado es una variable
              independiente del diámetro
            correcta: true
            mensaje: |
              Eso es lo que distingue un conducto abierto de uno cerrado. En una
              tubería llena, el agua ocupa toda la sección y no hay nada que
              elegir; en un canal, el calado es un dato más — y por eso el tema
              21 lo trata aparte.
          - texto: Porque la sección es semicircular y no circular
            mensaje: |
              La forma de la sección entra por la semejanza geométrica, no por
              este grupo. Un canal rectangular también tendría su $h/D$ (o
              $h/b$): lo que lo trae es la **superficie libre**.
          - texto: Porque hay que medir el calado para calcular el caudal
            mensaje: |
              Se mide, sí, pero eso es procedimiento de laboratorio. El grupo
              aparece porque el calado es una variable **física independiente**
              del fenómeno, no porque haya que medirla.
      - tipo: calcular
        titulo: La viscosidad del fluido del modelo
        pregunta: |
          Para semejanza absoluta con $\lambda = 10$, ¿qué viscosidad
          cinemática hace falta en el modelo?
        respuesta:
          tipo: magnitud
          valor: 1.486e-6 m2/s
          tolerancia: 0.01
          formato: una viscosidad cinemática, con su unidad
        distractores:
          - valor: 4.7e-6 m2/s
            mensaje: |
              Has dividido solo por $\lambda$. Hacen falta las dos condiciones:
              Froude fija la velocidad y Reynolds la viscosidad, y entre las dos
              sale $\lambda^{3/2} = 31{,}6$, no 10.
          - valor: 1.486e-5 m2/s
            mensaje: >-
              Un orden de magnitud de más: $4{,}7\cdot 10^{-5}/31{,}6$ es
              $1{,}49\cdot 10^{-6}$, no $10^{-5}$.
        pista: |
          Froude da $V_m/V_p = \lambda^{-1/2}$. Métela en Reynolds, que pide
          $\nu_m/\nu_p = (V_m/V_p)(L_m/L_p)$.
        desarrollo: |
          **Semejanza absoluta** significa cumplir Froude **y** Reynolds a la
          vez. Froude fija la velocidad:

          $$
          \frac{V_m}{V_p} = \sqrt{\frac{L_m}{L_p}} = \lambda^{-1/2}
          $$

          y Reynolds, con esa velocidad ya fijada, deja la viscosidad como
          única incógnita:

          $$
          \frac{\nu_m}{\nu_p} = \frac{V_m}{V_p}\cdot\frac{L_m}{L_p}
          = \lambda^{-1/2}\cdot\lambda^{-1} = \lambda^{-3/2}
          $$

          $$
          \nu_m = \frac{4{,}7\cdot 10^{-5}}{10^{3/2}}
          = \frac{4{,}7\cdot 10^{-5}}{31{,}62}
          = 1{,}486\cdot 10^{-6}\ \text{m}^{2}/\text{s}
          $$

          Un valor muy cercano al del agua a unos 5 °C, así que este ensayo **sí**
          se puede montar — al revés que el del buque del 5.4, que acababa
          pidiendo mercurio.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              La semejanza absoluta exige cumplir a la vez todos los grupos que
              intervienen, y aquí eso son Froude y Reynolds.
          - texto: >-
              Froude no deja elegir la velocidad del modelo: la fija en
              $\lambda^{-1/2}$ veces la del prototipo.
          - texto: >-
              Con la velocidad ya fijada, Reynolds solo se puede cumplir
              cambiando el fluido.
          - texto: >-
              Como el modelo es diez veces más pequeño, su fluido tiene que ser
              diez veces menos viscoso.
            trampa: true
            mensaje: |
              Sería así si la velocidad fuese la misma en los dos, pero no lo
              es: Froude ya la ha bajado en $\sqrt{10}$. Las dos condiciones se
              multiplican y sale $\lambda^{3/2} = 31{,}6$, no 10. Con el factor
              10 saldría $4{,}7\cdot 10^{-6}$, tres veces la viscosidad
              correcta.
          - texto: >-
              De ahí $\nu_m = \nu_p\,\lambda^{-3/2} = 1{,}486\cdot 10^{-6}$
              m²/s, muy cerca del agua fría.
    resolucion: |
      **a) y b).** Nueve variables y tres dimensiones dan **seis grupos**, y con
      $\rho$, $D$ y $V$ como repetidas salen

      $$
      \frac{\Delta p}{\rho V^{2}}\ \ \frac{L}{D}\ \ \frac{\varepsilon}{D}\ \
      \frac{gD}{V^{2}}\ \ \frac{\mu}{\rho V D}\ \ \frac{h}{D}
      $$

      Son los de la tubería del 5.10 **menos** los de tensión superficial y
      compresibilidad, que aquí no se han incluido en la lista, **más** el
      calado relativo $h/D$ — que es lo que distingue un conducto abierto de uno
      cerrado: el canal no va lleno, así que el calado es una variable propia.

      **c) La viscosidad del modelo.** La semejanza absoluta exige Froude y
      Reynolds a la vez. Froude fija la velocidad en $\lambda^{-1/2}$; con ella
      metida en Reynolds,

      $$
      \frac{\nu_m}{\nu_p} = \lambda^{-1/2}\cdot\lambda^{-1} = \lambda^{-3/2}
      \;\Longrightarrow\;
      \nu_m = \frac{4{,}7\cdot 10^{-5}}{31{,}62} = 1{,}486\cdot 10^{-6}\ \text{m}^{2}/\text{s}
      $$

      **Lo que hay que llevarse.** El $\lambda^{3/2}$ aparece cada vez que se
      piden Froude y Reynolds juntos, y es el mismo exponente del ejercicio del
      buque. La diferencia está en el resultado: allí pedía mercurio y el ensayo
      era impracticable; aquí pide agua fría y **se puede hacer**. El método no
      dice si un ensayo es viable — lo dice el número que sale al final.

  - id: ejflu16-col52-la-tuberia-de-gas-y-su-modelo-de-agua
    titulo: La tubería de gas ensayada con agua, y la velocidad que sale disparada
    fuente: >-
      Ejercicio 5.2 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Se quieren determinar las pérdidas de carga lineales en una tubería de
      $1$ m de diámetro cuando circula un gas de densidad
      $\rho = 31{,}85\ \text{kg/m}^{3}$ y viscosidad $\mu = 0{,}0015$ Po,
      siendo su velocidad media $V = 25$ m/s, mediante una tubería modelo. En
      el modelo el fluido circulante es agua a $20°$ y el caudal de
      $4000$ l/min.

      **a)** Determinar la escala geométrica y la escala de pérdidas de carga,
      siendo la densidad del agua $\rho = 1000\ \text{kg/m}^{3}$ y la
      viscosidad absoluta del agua $\mu = 1$ cPo.
    pide: La escala geométrica y la de pérdidas de carga.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es un flujo en carga, sin superficie libre. ¿Qué semejanza hay que
          imponer?
        opciones:
          - texto: >-
              Igualdad de número de Reynolds, además de la geométrica
            correcta: true
            mensaje: |
              Eso es el criterio: **conducto cerrado, Reynolds**. Sin superficie
              libre la gravedad no deforma nada, así que Froude no interviene y
              lo que manda es la relación entre inercia y viscosidad.
          - texto: Igualdad de número de Froude
            mensaje: |
              Froude compara inercia con gravedad, y hace falta una superficie
              libre que la gravedad pueda deformar. En una tubería llena no la
              hay: ahí manda Reynolds.
          - texto: >-
              Igualdad de velocidad entre modelo y prototipo
            mensaje: |
              Eso no es ninguna semejanza: es una coincidencia que casi nunca se
              puede imponer. La velocidad del modelo **sale** de la condición de
              semejanza, no se elige.
      - tipo: calcular
        titulo: El Reynolds del prototipo
        pregunta: |
          ¿Cuánto vale el número de Reynolds en la tubería de gas?
        respuesta:
          tipo: numero
          valor: '5308000'
          tolerancia: 20000
          formato: un número sin unidades
        distractores:
          - valor: '530833'
            mensaje: |
              Un factor diez en la conversión del poise. Un poise es una
              **décima** de pascal por segundo, así que $0{,}0015$ Po son
              $1{,}5\cdot 10^{-4}$ Pa·s y no $1{,}5\cdot 10^{-3}$.
          - valor: '166666667'
            mensaje: |
              Has usado la densidad del agua en la tubería de gas. El gas tiene
              $31{,}85\ \text{kg/m}^{3}$; los $1000$ son del modelo, y con ellos
              el Reynolds sale treinta veces mayor.
        pista: |
          $Re = \rho V D/\mu$, y ojo con el poise: $1$ Po $= 0{,}1$ Pa·s.
        desarrollo: |
          $$
          \mu = 0{,}0015\ \text{Po} = 1{,}5\cdot 10^{-4}\ \text{Pa}\cdot\text{s}
          $$

          $$
          Re = \frac{\rho V D}{\mu}
          = \frac{31{,}85 \cdot 25 \cdot 1}{1{,}5\cdot 10^{-4}}
          = 5{,}308\cdot 10^{6}
          $$
      - tipo: calcular
        titulo: El diámetro del modelo
        pregunta: |
          Con $4000$ l/min de agua y ese mismo Reynolds, ¿qué diámetro tiene la
          tubería modelo?
        respuesta:
          tipo: magnitud
          valor: 16 mm
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: 160 mm
            mensaje: |
              Un factor diez. Con $D' = 0{,}16$ m el Reynolds del modelo sería
              diez veces menor que el del prototipo: comprueba sustituyendo.
          - valor: 62.5 mm
            mensaje: >-
              Ese número es la **escala**, no el diámetro. La escala sale
              después, dividiendo el diámetro del prototipo entre el del
              modelo.
        pista: |
          En el modelo la velocidad no es dato: sale del caudal,
          $V' = Q'/(\pi D'^{2}/4)$. Sustitúyela en el Reynolds y queda una
          ecuación con $D'$ sola.
        desarrollo: |
          La velocidad del modelo depende de su propio diámetro:

          $$
          V' = \frac{Q'}{\pi D'^{2}/4} = \frac{4/60}{\pi D'^{2}/4}
          = \frac{0{,}08488}{D'^{2}}
          $$

          y metiéndola en el Reynolds del modelo, el $D'$ se simplifica una vez:

          $$
          Re' = \frac{V'D'\rho'}{\mu'}
          = \frac{0{,}08488}{D'}\cdot\frac{1000}{10^{-3}}
          = \frac{84\,880}{D'} = 5{,}308\cdot 10^{6}
          $$

          $$
          \boxed{D' = 0{,}016\ \text{m} = 16\ \text{mm}}
          $$
      - tipo: calcular
        titulo: La escala de pérdidas de carga
        pregunta: |
          ¿Cuántas veces mayores son las pérdidas de carga en el modelo que en
          el prototipo?
        respuesta:
          tipo: numero
          valor: '176'
          tolerancia: 3
          formato: un número sin unidades
        distractores:
          - valor: '62.5'
            mensaje: |
              Esa es la escala **geométrica**. Las pérdidas de carga van con el
              cuadrado de la velocidad, no con la longitud:
              $(V'/V)^{2} = (331{,}6/25)^{2}$.
          - valor: '13.3'
            mensaje: >-
              Esa es la relación de velocidades, $331{,}6/25$. Falta elevarla al
              cuadrado: el número de Euler lleva $V^{2}$.
        pista: |
          Del número de Euler, $h_f/V^{2}$ se conserva. Calcula primero la
          velocidad del modelo con el diámetro que acabas de hallar.
        desarrollo: |
          Con $D' = 0{,}016$ m, la velocidad del modelo es

          $$
          V' = \frac{0{,}08488}{0{,}016^{2}} = 331{,}6\ \text{m/s}
          $$

          y del número de Euler, $\Delta p/(\rho V^{2})$ constante, sale
          $h_f/V^{2}$ constante:

          $$
          \frac{h_f'}{h_f} = \left(\frac{V'}{V}\right)^{2}
          = \left(\frac{331{,}6}{25}\right)^{2} = 176
          $$

          Y la escala geométrica, $\lambda = 1/0{,}016 = 62{,}5$.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al ser flujo en carga, la semejanza dinámica pide igualdad de
              número de Reynolds además de la geométrica.
          - texto: >-
              El Reynolds del prototipo sale directo de sus datos:
              $5{,}31\cdot 10^{6}$.
          - texto: >-
              En el modelo la velocidad no es dato: depende del diámetro a
              través del caudal, así que al imponer el Reynolds queda una sola
              incógnita.
          - texto: >-
              Sale un modelo de 16 mm con el agua a 331 m/s, y como es un
              modelo pequeño esa velocidad es perfectamente asumible.
            trampa: true
            mensaje: |
              331 m/s en agua es del orden de la velocidad del sonido, así que
              **aparecerían efectos de compresibilidad** que el análisis no ha
              tenido en cuenta — y ni siquiera se podría montar. La propia
              colección lo advierte. El resultado es correcto como cuenta y
              **avisa de que el ensayo no vale**: eso también es una respuesta.
          - texto: >-
              Las pérdidas de carga van con el cuadrado de la velocidad, así
              que su escala es $(331{,}6/25)^{2} = 176$.
    resolucion: |
      **La semejanza que toca.** Flujo en carga, sin superficie libre: manda
      **Reynolds**.

      **El prototipo.** Con $\mu = 0{,}0015$ Po $= 1{,}5\cdot 10^{-4}$ Pa·s,

      $$
      Re = \frac{31{,}85\cdot 25\cdot 1}{1{,}5\cdot 10^{-4}} = 5{,}31\cdot 10^{6}
      $$

      **El modelo.** Su velocidad no es dato: sale del caudal, y por eso al
      imponer el Reynolds queda una sola incógnita —
      $Re' = 84\,880/D' = 5{,}31\cdot 10^{6}$ da $D' = 16$ mm y
      $V' = 331{,}6$ m/s.

      **Las dos escalas.** $\lambda = 1/0{,}016 = 62{,}5$ para la geometría, y
      $(V'/V)^{2} = 176$ para las pérdidas de carga.

      **Y lo que hay que llevarse, que no es ninguno de los dos números.** El
      ensayo **no se puede hacer**: 331 m/s en agua está en el orden de la
      velocidad del sonido, con lo que aparecerían efectos de compresibilidad
      que el análisis no ha considerado. La cuenta es correcta y su conclusión
      es que hay que cambiar de estrategia — usar otro fluido, o aceptar
      semejanza parcial. **Un resultado absurdo bien calculado sigue siendo
      información.**

  - id: ejflu16-col58-la-potencia-de-una-helice
    titulo: Los cuatro grupos de una hélice, y por qué son cuatro y no tres
    fuente: >-
      Ejercicio 5.8 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La potencia $P$ obtenida en una hélice depende de la densidad del aire
      $\rho$, el diámetro de la hélice $D$, la velocidad de la corriente $v$,
      la velocidad de rotación de la hélice $n$, la viscosidad dinámica del
      aire $\mu$ y la velocidad del sonido $a$.

      **a)** Encontrar los parámetros adimensionales que definan el fenómeno
      físico.
    pide: Los cuatro parámetros adimensionales, con ρ, D y n como repetidas.
    pasos:
      - tipo: calcular
        titulo: Cuántos grupos
        pregunta: |
          ¿Cuántos parámetros adimensionales van a salir?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Tres saldrían con seis variables. Aquí hay **siete**: la potencia
              y las seis de las que depende. $7 - 3 = 4$.
          - valor: '7'
            mensaje: >-
              Siete son las variables. El teorema resta las tres dimensiones
              fundamentales.
        pista: |
          Cuenta las variables incluyendo la potencia, y réstale las tres
          dimensiones fundamentales.
        desarrollo: |
          Variables: $P$, $\rho$, $D$, $v$, $n$, $\mu$, $a$ — **siete**.
          Dimensiones fundamentales: tres.

          $$
          \pi = 7 - 3 = \boxed{4}
          $$

          Un grupo más que en los ejercicios anteriores, y la razón es que aquí
          hay **dos velocidades del fluido** —$v$ y $a$— además de la de giro.
      - tipo: calcular
        titulo: El exponente del diámetro en el grupo de la potencia
        pregunta: |
          En $\pi_1 = P\cdot\rho^{x}D^{y}n^{z}$, ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-4'
            mensaje: |
              Cuatro es el del **par**, no el de la potencia. La potencia es par
              por velocidad angular, así que lleva una potencia más de $D$… no:
              lleva una más de $n$. Repasa la ecuación de $L$: sale $-5$.
          - valor: '-2'
            mensaje: >-
              Ese sería el exponente si $P$ fuera una presión. Es una
              **potencia**: $ML^{2}T^{-3}$, con dos longitudes y tres tiempos.
        pista: |
          $[P] = ML^{2}T^{-3}$, $[\rho] = ML^{-3}$, $[D] = L$, $[n] = T^{-1}$.
          Empieza por la masa y sigue por el tiempo.
        desarrollo: |
          $$
          (ML^{2}T^{-3})(ML^{-3})^{x}(L)^{y}(T^{-1})^{z} = M^{0}L^{0}T^{0}
          $$

          | | ecuación | sale |
          |---|---|---|
          | $M$ | $1 + x = 0$ | $x = -1$ |
          | $T$ | $-3 - z = 0$ | $z = -3$ |
          | $L$ | $2 - 3x + y = 0$ | $y = -5$ |

          $$
          \boxed{\pi_1 = \frac{P}{\rho\,D^{5}n^{3}}}
          $$

          Es el **coeficiente de potencia**, y aparece igual en bombas y en
          turbinas: la potencia de una máquina de flujo va con $D^{5}n^{3}$.
      - tipo: reconocer
        pregunta: |
          Los otros tres grupos son $v/(Dn)$, $\mu/(\rho D^{2}n)$ y $a/(Dn)$.
          ¿Qué tienen en común?
        opciones:
          - texto: >-
              Los tres comparan algo con la velocidad de la punta de la pala,
              $Dn$
            correcta: true
            mensaje: |
              Eso es lo que hace elegante el juego. Al tomar $n$ y $D$ como
              repetidas, $Dn$ se convierte en **la velocidad de referencia** del
              problema: el primero es un coeficiente de avance, el tercero un
              Mach de punta de pala y el segundo un Reynolds construido sobre
              ella.
          - texto: Los tres llevan la densidad
            mensaje: |
              Solo el de la viscosidad la lleva. En $v/(Dn)$ y $a/(Dn)$ el
              exponente de $\rho$ sale cero, porque son cocientes de dos
              velocidades y ahí la masa no pinta nada.
          - texto: Los tres son inversos de números conocidos
            mensaje: |
              $\mu/(\rho D^{2}n)$ sí es el inverso de un Reynolds, pero
              $v/(Dn)$ y $a/(Dn)$ no son inversos de nada: son un coeficiente de
              avance y un Mach, directos.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Siete variables y tres dimensiones fundamentales dan cuatro
              grupos.
          - texto: >-
              Con $\rho$, $D$ y $n$ como repetidas, cada una de las cuatro
              variables restantes forma su grupo.
          - texto: >-
              El de la potencia sale $P/(\rho D^{5}n^{3})$, que es el
              coeficiente de potencia de cualquier máquina de flujo.
          - texto: >-
              Como $v$ y $a$ son las dos velocidades, su cociente $v/a$ tiene
              que ser uno de los cuatro grupos.
            trampa: true
            mensaje: |
              $v/a$ **es** adimensional y **sí** es un grupo válido — pero no
              uno de estos cuatro, porque con $\rho$, $D$ y $n$ como repetidas
              los grupos salen $v/(Dn)$ y $a/(Dn)$. Su cociente da $v/a$, claro:
              cualquier combinación de grupos vuelve a ser un grupo. Lo que el
              enunciado pide es **el juego que sale de esas repetidas**, no
              cualquier juego posible.
          - texto: >-
              Los otros tres comparan la velocidad de la corriente, la del
              sonido y la viscosidad con la velocidad de punta de pala $Dn$.
    resolucion: |
      **Cuántos.** Siete variables y tres dimensiones: **cuatro grupos**, uno
      más que en los problemas anteriores porque aquí hay dos velocidades de
      fluido además de la de giro.

      **Los cuatro**, con $\rho$, $D$ y $n$ como repetidas:

      $$
      \pi_1 = \frac{P}{\rho D^{5}n^{3}}
      \quad
      \pi_2 = \frac{v}{Dn}
      \quad
      \pi_3 = \frac{\mu}{\rho D^{2}n}
      \quad
      \pi_4 = \frac{a}{Dn}
      $$

      **Cómo leerlos.** Al tomar $n$ y $D$ como repetidas, el producto $Dn$ pasa
      a ser **la velocidad de referencia del problema** — la de la punta de la
      pala. Y entonces los tres últimos grupos son lo mismo tres veces:
      comparar algo con ella. $\pi_2$ es el coeficiente de avance, $\pi_4$ un
      Mach de punta de pala y $\pi_3$ el inverso de un Reynolds construido sobre
      ella.

      **Lo que hay que llevarse.** $P/(\rho D^{5}n^{3})$ no es propio de las
      hélices: es **el coeficiente de potencia de cualquier máquina de flujo**,
      y el mismo que usan los temas 22 a 25 para bombas y turbinas. Cambia el
      aparato, no el grupo.

  - id: ejflu16-col59-el-empuje-de-la-helice-de-aeroplano
    titulo: El empuje de una hélice, y la ley adimensional entera
    fuente: >-
      Ejercicio 5.9 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      El empuje producido por una hélice cualquiera de un conjunto de hélices
      de aeroplano, geométricamente semejantes, se determina experimentalmente
      a partir de un ensayo en un túnel aerodinámico con un modelo.

      El empuje $F$ depende de la velocidad de rotación $n$, de la velocidad de
      avance $V$, del diámetro de la hélice $D$, de la viscosidad del aire
      $\mu$, de la densidad $\rho$ y de la velocidad del sonido $a$.

      **a)** Hallar los parámetros adimensionales y la función que los
      relaciona, tomando como variables repetidas $\rho$, $n$ y $D$.
    pide: Los cuatro grupos y la ley adimensional que los relaciona.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide «los parámetros **y la función que los relaciona**».
          ¿Qué añade eso?
        opciones:
          - texto: >-
              Que hay que despejar el grupo de la incógnita y dejar los demás
              como argumentos de una función desconocida
            correcta: true
            mensaje: |
              Eso es la ley adimensional, y es el producto final del análisis:
              $F/(\rho n^{2}D^{4}) = f\!\left(V/(nD),\ \mu/(\rho nD^{2}),\
              a/(nD)\right)$. El análisis dimensional **no da la función**, solo
              dice de qué depende y reduce el ensayo a tres variables en vez de
              seis.
          - texto: Que hay que encontrar la fórmula del empuje
            mensaje: |
              El análisis dimensional no la da, y esa es su limitación
              fundamental: dice **de qué** depende el fenómeno, no **cómo**. La
              forma de $f$ la da el ensayo.
          - texto: >-
              Que hay que relacionar los grupos entre sí multiplicándolos
            mensaje: |
              Multiplicar grupos entre sí da otros grupos válidos, pero eso no
              es la ley: la ley es la igualdad entre el grupo de la incógnita y
              una función de los demás.
      - tipo: calcular
        titulo: El exponente del diámetro en el grupo del empuje
        pregunta: |
          En $\pi_1 = F\cdot\rho^{x}n^{y}D^{z}$, ¿cuánto vale $z$?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-5'
            mensaje: |
              Cinco es el de la **potencia**, que lleva una longitud más porque
              es fuerza por velocidad. El empuje es una fuerza: $-4$.
          - valor: '-2'
            mensaje: >-
              Con $-2$ te quedaría un $L^{2}$ sin cancelar. La fuerza aporta
              $L^{1}$ y la densidad, al ir con exponente $-1$, aporta $L^{3}$:
              en total cuatro que hay que quitar.
        pista: |
          $[F] = MLT^{-2}$. La masa la fija $\rho$ y el tiempo lo fija $n$; el
          diámetro recoge lo que queda de longitud.
        desarrollo: |
          $$
          (MLT^{-2})(ML^{-3})^{x}(T^{-1})^{y}(L)^{z} = M^{0}L^{0}T^{0}
          $$

          De $M$: $x = -1$. De $T$: $y = -2$. De $L$:
          $1 - 3(-1) + z = 0 \Rightarrow z = -4$.

          $$
          \boxed{\pi_1 = \frac{F}{\rho\,n^{2}D^{4}}}
          $$

          Y comparándolo con el ejercicio anterior: el empuje va con
          $\rho n^{2}D^{4}$ y la potencia con $\rho n^{3}D^{5}$. La diferencia
          es exactamente un $nD$ — una velocidad —, que es lo que separa una
          fuerza de una potencia.
      - tipo: reconocer
        pregunta: |
          El ejercicio 5.14 usaba $R = \rho V^{2}D^{2}f(VD/\nu,\ V/(ND))$ para
          la misma hélice. ¿Contradice a este?
        opciones:
          - texto: >-
              No: son el mismo contenido con otras repetidas, y uno se obtiene
              del otro combinando grupos
            correcta: true
            mensaje: |
              Exacto. Allí se tomó $V$ como referencia y aquí $nD$;
              $\rho V^{2}D^{2}$ y $\rho n^{2}D^{4}$ se diferencian en
              $(V/nD)^{2}$, que **es uno de los grupos**. Multiplicar por un
              grupo adimensional no cambia nada.
          - texto: >-
              Sí: uno da tres grupos y el otro cuatro
            mensaje: |
              El 5.14 despreciaba la gravedad **y** no incluía la velocidad del
              sonido, así que tenía una variable menos. No es una
              contradicción: es otra lista de partida.
          - texto: >-
              Sí: el empuje no puede ir con $V^{2}$ y con $n^{2}$ a la vez
            mensaje: |
              Puede, y esa es la gracia. La ley adimensional no dice que el
              empuje **sea** $\rho V^{2}D^{2}$: dice que el cociente es una
              función de los otros grupos, y esa función absorbe la diferencia.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Siete variables y tres dimensiones dan cuatro grupos.
          - texto: >-
              Con $\rho$, $n$ y $D$ repetidas, el del empuje sale
              $F/(\rho n^{2}D^{4})$.
          - texto: >-
              Los otros tres son $V/(nD)$, $\mu/(\rho nD^{2})$ y $a/(nD)$.
          - texto: >-
              La ley adimensional se escribe despejando el grupo que contiene
              la incógnita, y el análisis dimensional da además la forma de la
              función.
            trampa: true
            mensaje: |
              El análisis dimensional **no da la forma de la función**, y esa es
              su limitación de fondo. Dice de qué depende el fenómeno y reduce
              el ensayo de seis variables a tres — que ya es muchísimo —, pero
              la curva hay que medirla.
          - texto: >-
              Queda $F/(\rho n^{2}D^{4}) = f\!\left(V/(nD),\ \mu/(\rho
              nD^{2}),\ a/(nD)\right)$.
    resolucion: |
      **Los cuatro grupos**, con $\rho$, $n$ y $D$ como repetidas:

      $$
      \frac{F}{\rho n^{2}D^{4}}
      \qquad
      \frac{V}{nD}
      \qquad
      \frac{\mu}{\rho n D^{2}}
      \qquad
      \frac{a}{nD}
      $$

      **Y la ley adimensional**, que es lo que el enunciado pide de verdad:

      $$
      \frac{F}{\rho n^{2}D^{4}}
      = f\!\left(\frac{V}{nD},\ \frac{\mu}{\rho nD^{2}},\ \frac{a}{nD}\right)
      $$

      **Lo que hay que llevarse, y son dos cosas.**

      Una, la comparación con el ejercicio anterior: el **empuje** va con
      $\rho n^{2}D^{4}$ y la **potencia** con $\rho n^{3}D^{5}$. La diferencia
      es un $nD$ — una velocidad —, que es justo lo que separa una fuerza de una
      potencia. No hay que memorizar los dos: sale uno del otro.

      Y otra, la limitación: **el análisis dimensional no da la función $f$**.
      Lo que da es que un ensayo que parecía necesitar barrer seis variables se
      reduce a barrer tres. Eso es lo que hace posible el túnel aerodinámico, y
      es bastante.

  - id: ejflu16-col54-el-buque-que-pide-mercurio
    titulo: El buque a escala un cuarto, y el fluido que haría falta
    fuente: >-
      Ejercicio 5.4 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La resistencia $F$ al avance y el comportamiento de un cuerpo flotante
      depende de las siguientes variables: gravedad $g$, longitud
      característica $L$, densidad del fluido $\rho$, viscosidad dinámica del
      mismo $\mu$ y velocidad $V$.

      **a)** Deducir los parámetros $\pi$ adimensionales que intervienen en el
      fenómeno y la ley adimensional de dicho fenómeno.

      **b)** Se quiere hacer un ensayo con un modelo a escala $1/4$ de un
      prototipo que se prevé que pesará $1000$ kg y navegará en agua dulce a
      $20\ °$C con una velocidad de $20$ km/h. ¿Cómo podrá realizarse el
      ensayo? ¿Qué fluido se empleará? ¿Cuál debe ser el peso del modelo?

      **c)** Si la resistencia media en el modelo es de $50$ kg y la potencia
      que consume de $2{,}66$ CV, determinar la resistencia al avance y el
      rendimiento del prototipo.

      Nota: variables repetidas $\rho$, $L$, $V$.
    pide: Los tres grupos, el fluido y el peso del modelo, y la resistencia y el rendimiento del prototipo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un cuerpo **flotante**: navega en la superficie. ¿Qué grupos van a
          intervenir?
        opciones:
          - texto: >-
              Froude y Reynolds los dos, porque hay superficie libre y también
              viscosidad
            correcta: true
            mensaje: |
              Y ahí está el problema del ejercicio. Un buque arrastra dos
              resistencias a la vez —la de las olas, que es gravedad, y la de
              fricción, que es viscosidad—, así que hacen falta los dos
              números. Es el caso más incómodo de la semejanza.
          - texto: Solo Froude, porque flota
            mensaje: |
              La resistencia de un buque tiene dos partes, y la de fricción con
              el casco no es despreciable: en un mercante es más de la mitad.
              El enunciado incluye $\mu$ precisamente para que cuente.
          - texto: Solo Reynolds, porque hay un fluido viscoso
            mensaje: |
              Entonces sobraría la $g$ de la lista. Está ahí porque el buque
              genera olas, y las olas son gravedad: sin Froude no se
              reproducen.
      - tipo: calcular
        titulo: La velocidad del modelo
        pregunta: |
          Con escala $1/4$ e igualdad de Froude, ¿a qué velocidad hay que
          arrastrar el modelo?
        respuesta:
          tipo: magnitud
          valor: 10 km/h
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: 5 km/h
            mensaje: |
              Has escalado con $\lambda$ a secas. Froude escala las velocidades
              con la **raíz** de la escala: $\sqrt{1/4} = 1/2$, así que el
              modelo va a la mitad, no a la cuarta parte.
          - valor: 40 km/h
            mensaje: >-
              Al revés: el modelo es más pequeño, así que por Froude va más
              **despacio**, no más deprisa. Es Reynolds el que pediría acelerar.
        pista: |
          $Fr = V^{2}/(gL)$ igual en los dos, con la misma $g$.
        desarrollo: |
          $$
          \frac{V'^{2}}{gL'} = \frac{V^{2}}{gL}
          \;\Longrightarrow\;
          \frac{V'}{V} = \sqrt{\frac{L'}{L}} = \sqrt{\tfrac14} = \tfrac12
          $$

          $$
          V' = \frac{20}{2} = 10\ \text{km/h} = 2{,}78\ \text{m/s}
          $$
      - tipo: calcular
        titulo: La viscosidad que hace falta
        pregunta: |
          Con esa velocidad ya fijada, ¿qué viscosidad cinemática necesita el
          fluido del modelo? El agua del prototipo tiene
          $\nu = 9{,}5\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.
        respuesta:
          tipo: magnitud
          valor: 1.19e-7 m2/s
          tolerancia: 0.03
          formato: una viscosidad cinemática, con su unidad
        distractores:
          - valor: 2.375e-7 m2/s
            mensaje: |
              Has aplicado solo la escala de longitudes, $1/4$. Hay que aplicar
              también la de velocidades, que Froude ya ha fijado en $1/2$: en
              total $\lambda^{3/2} = 1/8$.
          - valor: 4.75e-7 m2/s
            mensaje: >-
              Has usado solo la escala de velocidades. Reynolds pide el producto
              de las dos, velocidad **por** longitud.
        pista: |
          $\nu'/\nu = (V'/V)(L'/L)$, y las dos razones ya las conoces.
        desarrollo: |
          $$
          \frac{\nu'}{\nu} = \frac{V'}{V}\cdot\frac{L'}{L}
          = \frac12\cdot\frac14 = \frac18 = \lambda^{3/2}
          $$

          $$
          \nu' = \frac{9{,}5\cdot 10^{-7}}{8} = 1{,}19\cdot 10^{-7}\ \text{m}^{2}/\text{s}
          $$

          Y buscando ese valor en el ábaco de viscosidades cinemáticas, el
          único líquido corriente que lo tiene es el **mercurio a 25 °C**.
      - tipo: calcular
        titulo: La resistencia del prototipo
        pregunta: |
          Si en el modelo se mide una resistencia de $50$ kg, ¿cuánto vale en
          el prototipo?
        respuesta:
          tipo: magnitud
          valor: 235.3 kg
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: 3200 kg
            mensaje: |
              Te has dejado la relación de densidades. El modelo navega en
              mercurio y el prototipo en agua: hay un factor $1/13{,}6$ que
              descuenta la mayor parte del $\lambda^{3}$.
          - valor: 12.5 kg
            mensaje: >-
              Has escalado hacia el lado que no es. El prototipo es el
              **grande**: su resistencia tiene que salir mayor que la del
              modelo, no menor.
        pista: |
          De $F/(\rho V^{2}L^{2})$ constante y con Froude cumplido,
          $F/F' = (\rho/\rho')\lambda^{3}$.
        desarrollo: |
          Con $\pi_1 = F/(\rho V^{2}L^{2})$ igual en los dos y $V^{2}$
          proporcional a $L$ por Froude, la fuerza escala con
          $\rho\,L^{3}$:

          $$
          \frac{F}{F'} = \frac{\rho}{\rho'}\left(\frac{L}{L'}\right)^{3}
          = \frac{1}{13{,}6}\cdot 4^{3} = 4{,}706
          $$

          $$
          F = 50 \cdot 4{,}706 = 235{,}3\ \text{kg}
          $$

          Y el peso del modelo sale de la misma relación al revés:
          $1000\cdot 13{,}6\cdot(1/4)^{3} = 212{,}5$ kg.
      - tipo: calcular
        titulo: El rendimiento
        pregunta: |
          Con $2{,}66$ CV consumidos y $50$ kg de resistencia a $2{,}78$ m/s,
          ¿cuál es el rendimiento?
        respuesta:
          tipo: numero
          valor: '69.7'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '52.2'
            mensaje: |
              Has usado la velocidad del prototipo, $5{,}56$ m/s, con la
              resistencia del modelo. Las dos magnitudes tienen que ser del
              **mismo** cuerpo.
          - valor: '0.697'
            mensaje: >-
              Esa es la fracción, no el porcentaje. Multiplica por 100.
        pista: |
          Potencia útil dividida entre potencia consumida, y $1$ CV $= 75$
          kg·m/s.
        desarrollo: |
          $$
          \eta = \frac{R'V'}{P_{consumida}}
          = \frac{50\cdot 2{,}78}{2{,}66\cdot 75}
          = \frac{139}{199{,}5} = 0{,}697
          $$

          $$
          \boxed{\eta = 69{,}7\ \%}
          $$

          Y como el rendimiento **es adimensional**, con semejanza absoluta es
          el mismo en el modelo y en el prototipo: no hay que escalarlo.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Al haber superficie libre y viscosidad a la vez, la semejanza
              absoluta exige igualar Froude **y** Reynolds.
          - texto: >-
              Froude no deja elegir: fija la velocidad del modelo en la mitad
              de la del prototipo.
          - texto: >-
              Con la velocidad ya fijada, Reynolds solo se puede cumplir
              cambiando de fluido, y pide $\nu' = \nu/8$.
          - texto: >-
              Como el mercurio es trece veces más denso que el agua, el modelo
              pesará trece veces más que el prototipo a escala.
            trampa: true
            mensaje: |
              Trece veces más **que un modelo de agua a esa escala**, no que el
              prototipo. El peso escala con $\rho\lambda^{3}$: los 13,6 de
              densidad multiplican, pero el $(1/4)^{3} = 1/64$ divide mucho
              más. Sale $1000\cdot 13{,}6/64 = 212{,}5$ kg, la quinta parte del
              prototipo.
          - texto: >-
              El fluido que tiene esa viscosidad es el mercurio a 25 °C, y con
              él el modelo debe pesar 212,5 kg.
    resolucion: |
      **a) Los tres grupos.** Seis variables y tres dimensiones:

      $$
      \frac{F}{\rho V^{2}L^{2}}
      \qquad
      \frac{gL}{V^{2}}\ (\text{Froude})
      \qquad
      \frac{\mu}{\rho V L}\ (\text{Reynolds})
      $$

      y la ley, $F/(\rho V^{2}L^{2}) = f(Fr, Re)$.

      **b) El ensayo.** Froude fija la velocidad en la mitad, $10$ km/h. Con
      ella metida en Reynolds, la única variable libre es la viscosidad:
      $\nu' = \nu\lambda^{3/2} = 1{,}19\cdot 10^{-7}$ m²/s. En el ábaco, eso es
      **mercurio a 25 °C**. Y el peso del modelo,
      $1000\cdot 13{,}6\cdot(1/4)^{3} = 212{,}5$ kg.

      **c) El prototipo.** $F = 50\cdot(1/13{,}6)\cdot 4^{3} = 235{,}3$ kg, y el
      rendimiento $\eta = 50\cdot 2{,}78/(2{,}66\cdot 75) = 69{,}7\ \%$ — el
      mismo en los dos, porque es adimensional.

      **Lo que hay que llevarse.** El resultado del apartado b) es una
      respuesta perfectamente correcta y **completamente impracticable**: nadie
      llena un canal de ensayos con mercurio. Ese es el motivo real de que los
      buques se ensayen **solo con Froude**, corrigiendo después la fricción
      aparte con una fórmula empírica. El análisis dimensional no dice que el
      ensayo sea posible; dice cuál tendría que ser, y a veces la respuesta es
      «ninguno razonable».

  - id: ejflu16-col57-la-rugosidad-como-longitud-de-referencia
    titulo: Los mismos π con otras repetidas, y la rugosidad de protagonista
    fuente: >-
      Ejercicio 5.7 · Colección de problemas de Mecánica de Fluidos, Análisis
      dimensional y semejanza de modelos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La ecuación que expresa la ley de resistencia para la circulación de un
      fluido por tuberías es la siguiente:

      $$
      F\!\left(\rho,\ \mu,\ \varepsilon,\ V,\ D,\ \frac{dp}{dx}\right) = 0
      $$

      **a)** Aplicar el teorema de Buckingham para la determinación de los
      parámetros adimensionales. Tómese como sistema de variables repetidas
      $\mu$, $\varepsilon$, $\rho$.
    pide: Los tres parámetros adimensionales con esas variables repetidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las repetidas son $\mu$, $\varepsilon$ y $\rho$, no las de siempre.
          ¿Qué cambia eso?
        opciones:
          - texto: >-
              Que la longitud de referencia pasa a ser la rugosidad, así que
              los grupos salen con $\varepsilon$ donde normalmente iría $D$
            correcta: true
            mensaje: |
              Eso es. Las repetidas fijan las «unidades naturales» del problema:
              con $\rho$, $V$, $D$ la referencia era el diámetro y la velocidad
              media; aquí es la **rugosidad** y la escala de velocidad que sale
              de $\mu/(\rho\varepsilon)$.
          - texto: >-
              Que el resultado será distinto del que sale con $\rho$, $V$, $D$
            mensaje: |
              Será **otro juego de grupos**, no otro resultado. Cualquier juego
              se obtiene del otro combinando: $D/\varepsilon$ es el inverso de
              la rugosidad relativa, y $V\varepsilon\rho/\mu$ es un Reynolds.
          - texto: >-
              Que hay que elegir otras repetidas porque estas no valen
            mensaje: |
              Valen: entre las tres contienen las tres dimensiones y no forman
              por sí solas un grupo adimensional, que es lo único que se les
              exige. Que sean poco habituales no las hace incorrectas.
      - tipo: calcular
        titulo: Cuántos grupos
        pregunta: |
          ¿Cuántos parámetros adimensionales salen?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              Seis son las variables. El teorema resta las tres dimensiones
              fundamentales: $6-3 = 3$.
          - valor: '4'
            mensaje: >-
              Cuatro saldrían con siete variables. Cuenta la lista del
              enunciado: $\rho$, $\mu$, $\varepsilon$, $V$, $D$ y $dp/dx$, seis.
        pista: |
          Vaschy-Buckingham, con las seis variables del enunciado.
        desarrollo: |
          $$
          \pi = 6 - 3 = \boxed{3}
          $$
      - tipo: calcular
        titulo: El exponente de la rugosidad en el grupo del gradiente
        pregunta: |
          En $\pi_2 = \dfrac{dp}{dx}\cdot\mu^{x}\varepsilon^{y}\rho^{z}$,
          ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-3'
            mensaje: |
              El signo al revés. $[dp/dx] = ML^{-2}T^{-2}$ tiene longitudes
              **negativas**, así que hay que multiplicar por $\varepsilon$
              elevado a un exponente **positivo** para compensarlas.
          - valor: '1'
            mensaje: >-
              Con $\varepsilon^{1}$ quedaría todavía $L^{-2}$ sin cancelar.
              Monta la ecuación de la longitud entera: sale 3.
        pista: |
          $[dp/dx] = ML^{-2}T^{-2}$, $[\mu] = ML^{-1}T^{-1}$,
          $[\rho] = ML^{-3}$. Empieza por el tiempo, que solo aparece en $\mu$.
        desarrollo: |
          $$
          (ML^{-2}T^{-2})(ML^{-1}T^{-1})^{x}(L)^{y}(ML^{-3})^{z} = M^{0}L^{0}T^{0}
          $$

          | | ecuación | sale |
          |---|---|---|
          | $T$ | $-2 - x = 0$ | $x = -2$ |
          | $M$ | $1 + x + z = 0$ | $z = 1$ |
          | $L$ | $-2 - x + y - 3z = 0$ | $y = 3$ |

          $$
          \boxed{\pi_2 = \frac{(dp/dx)\,\rho\,\varepsilon^{3}}{\mu^{2}}}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Seis variables y tres dimensiones dan tres grupos.
          - texto: >-
              Con $\mu$, $\varepsilon$ y $\rho$ repetidas, los grupos se forman
              con $V$, $dp/dx$ y $D$.
          - texto: >-
              Salen $V\varepsilon\rho/\mu$, $(dp/dx)\rho\varepsilon^{3}/\mu^{2}$
              y $D/\varepsilon$.
          - texto: >-
              El primero no puede ser un Reynolds, porque un Reynolds lleva el
              diámetro y aquí no aparece.
            trampa: true
            mensaje: |
              Un Reynolds lleva **una longitud característica**, la que se
              elija: hay Reynolds de placa plana con la distancia al borde, de
              esfera con el diámetro y aquí de rugosidad con $\varepsilon$. De
              hecho ese $Re_\varepsilon$ es exactamente el que decide si un tubo
              se comporta como liso o rugoso — el tema 18 lo usa sin llamarlo
              así.
          - texto: >-
              El tercero, $D/\varepsilon$, es el inverso de la rugosidad
              relativa de siempre.
    resolucion: |
      **Los tres grupos**, con $\mu$, $\varepsilon$ y $\rho$ como repetidas:

      $$
      \pi_1 = \frac{V\varepsilon\rho}{\mu}
      \qquad
      \pi_2 = \frac{(dp/dx)\,\rho\,\varepsilon^{3}}{\mu^{2}}
      \qquad
      \pi_3 = \frac{D}{\varepsilon}
      $$

      **Cómo leerlos.** Elegir $\varepsilon$ como repetida convierte la
      rugosidad en la longitud de referencia del problema, así que $\pi_1$ es un
      **Reynolds de rugosidad** y $\pi_3$ el inverso de la rugosidad relativa de
      siempre. Los mismos ingredientes con otro reparto.

      **Lo que hay que llevarse, y conecta con el tema 18.** Ese
      $Re_\varepsilon = V\varepsilon\rho/\mu$ no es una rareza: es
      **exactamente la magnitud que decide si un tubo se comporta como liso o
      como rugoso**. Comparar la rugosidad con la subcapa laminar es comparar
      $\varepsilon$ con $\nu/v^{*}$, y eso es un Reynolds construido sobre
      $\varepsilon$. El ábaco de Moody y este grupo hablan de lo mismo.

      Y la lección de método, la tercera vez que aparece en el capítulo:
      **las variables repetidas cambian la cara de los grupos, no la física.**
      Aquí se obtiene el juego de siempre multiplicando y dividiendo:
      $Re_D = \pi_1\pi_3$.
  - id: ejflu16-col51-la-helice-y-sus-cuatro-parametros
    titulo: La hélice, y de dónde salen Froude y Reynolds
    fuente: Ejercicio 5.1 · Colección de problemas, capítulo 5 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La fuerza axial de una hélice completamente sumergida en agua depende de:
      $D$ (diámetro de la hélice), $V$ (velocidad de desplazamiento), $\rho$
      (densidad del fluido), $n$ (velocidad de rotación), $g$ (aceleración de la
      gravedad) y $\mu$ (viscosidad dinámica del fluido).

      a) Calcular los parámetros $\pi$ adimensionales, eligiendo como variables
      repetidas las indicadas en los primeros lugares, siempre que sea posible.
    pide: Los parámetros adimensionales del problema, y qué números conocidos son.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear ninguna ecuación de exponentes: ¿cuántos parámetros
          adimensionales van a salir?
        opciones:
          - texto: |
              Cuatro: hay 7 variables en juego y 3 magnitudes fundamentales
              (M, L, T), y el teorema $\pi$ dice que salen $7-3$
            correcta: true
            mensaje: |
              Eso es, y conviene contarlo **antes** de empezar: si al final te
              salen tres o cinco, hay un error en algún sistema de exponentes y
              lo sabes sin tener que revisarlo entero. Las siete variables son
              la fuerza y las seis de las que depende.
          - texto: Seis, uno por cada variable de la que depende la fuerza
            mensaje: |
              Eso sería no haber reducido nada. El teorema $\pi$ sirve
              precisamente para bajar de siete variables a cuatro grupos: es la
              diferencia entre un ensayo imposible y uno que cabe en un canal.
          - texto: Tres, tantos como magnitudes fundamentales
            mensaje: |
              Las tres magnitudes fundamentales son lo que se **resta**, no el
              resultado. Y también son el número de variables repetidas que hay
              que elegir: $D$, $V$ y $\rho$.
          - texto: |
              Siete menos las tres repetidas menos la fuerza: tres
            mensaje: |
              La fuerza no se descuenta aparte: es una de las siete variables, y
              justamente la que va en el primer parámetro. El recuento es
              7 variables − 3 dimensiones = 4.

      - tipo: calcular
        titulo: El exponente de la densidad en el primer parámetro
        pregunta: |
          Se plantea $\pi_1 = F\,D^{\alpha} V^{\beta} \rho^{\gamma}$. Con
          $[F] = MLT^{-2}$ y $[\rho] = ML^{-3}$, la ecuación de la masa es
          $1 + \gamma = 0$. ¿Cuánto vale $\gamma$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              El signo. La densidad es la única variable del grupo con masa
              además de la fuerza, así que para que la masa se cancele su
              exponente tiene que ser el **opuesto** al de la fuerza.
          - valor: '3'
            mensaje: |
              Ese 3 viene del $L^{-3}$ de la densidad, y ese entra en la
              ecuación de la longitud, no en la de la masa. Cada magnitud
              fundamental da su propia ecuación y se resuelven por separado.
        pista: |
          De $1+\gamma = 0$ solo hay un despeje posible.
        desarrollo: |
          $$
          [\pi_1] = (MLT^{-2})\,L^{\alpha}\,(LT^{-1})^{\beta}\,(ML^{-3})^{\gamma}
          = M^{0}L^{0}T^{0}
          $$

          En $M$: $\;1+\gamma = 0 \Longrightarrow \gamma = -1$.

      - tipo: calcular
        titulo: El exponente del diámetro en el primer parámetro
        pregunta: |
          Con $\gamma = -1$ y, de la ecuación del tiempo,
          $-2-\beta = 0 \Rightarrow \beta = -2$, la ecuación de la longitud es
          $1 + \alpha + \beta - 3\gamma = 0$. ¿Cuánto vale $\alpha$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. Sustituye con cuidado:
              $1 + \alpha - 2 - 3(-1) = 0$, o sea $\alpha + 2 = 0$. Ojo al
              doble menos de $-3\gamma$ con $\gamma$ negativa.
          - valor: '-4'
            mensaje: |
              Has puesto $-3\gamma$ como $-3$ en vez de $+3$. Con $\gamma = -1$,
              el término $-3\gamma$ vale $+3$.
        pista: |
          $1 + \alpha - 2 + 3 = 0$.
        desarrollo: |
          $$
          1 + \alpha + \beta - 3\gamma = 1 + \alpha - 2 + 3 = 0
          \;\Longrightarrow\; \alpha = -2
          $$

          Y con los tres exponentes:

          $$
          \pi_1 = F D^{-2} V^{-2} \rho^{-1} = \frac{F}{\rho D^{2} V^{2}}
          $$

          Es el coeficiente de empuje de la hélice: la fuerza dividida entre la
          presión dinámica por el área. Toda la familia de coeficientes
          adimensionales de fuerza —de arrastre, de sustentación, de empuje—
          tiene esta forma.

      - tipo: calcular
        titulo: El exponente de la velocidad en el parámetro de la gravedad
        pregunta: |
          Ahora $\pi_3 = g\,D^{\alpha}V^{\beta}\rho^{\gamma}$, con
          $[g] = LT^{-2}$. La ecuación del tiempo es $-2-\beta = 0$. ¿Cuánto
          vale $\beta$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Signo. De $-2-\beta = 0$ sale $\beta = -2$, y por eso la velocidad
              acaba en el denominador: $\pi_3 = gD/V^{2}$.
          - valor: '-1'
            mensaje: |
              El $-1$ es el exponente del tiempo en la velocidad, no el
              resultado. La gravedad lleva $T^{-2}$, así que hace falta $V^{-2}$
              para cancelarlo.
        pista: |
          La gravedad tiene $T^{-2}$ y la velocidad $T^{-1}$: hacen falta dos.
        desarrollo: |
          En $M$: $\gamma = 0$ —la gravedad no tiene masa y solo la densidad
          podría aportarla—. En $T$: $\beta = -2$. En $L$:
          $1+\alpha+\beta = 0 \Rightarrow \alpha = 1$.

          $$
          \pi_3 = \frac{gD}{V^{2}}
          $$

          Y aquí llega lo que hace útil el análisis dimensional: **un parámetro
          sigue siendo adimensional si lo inviertes o lo elevas a una
          potencia**, así que se le puede dar la forma que se reconozca. El
          inverso elevado a $1/2$:

          $$
          \sqrt{\frac{V^{2}}{gD}} = \frac{V}{\sqrt{gD}} = \mathrm{Fr}
          $$

          el **número de Froude**, que no ha aparecido por casualidad: estaba
          escondido en cuanto la gravedad entró en la lista de variables.

      - tipo: justificar
        pregunta: |
          Ordena la conclusión del problema. Una pieza es falsa.
        piezas:
          - texto: |
              Los cuatro parámetros son
              $\pi_1 = F/\rho D^{2}V^{2}$, $\pi_2 = nD/V$, $\pi_3 = gD/V^{2}$ y
              $\pi_4 = \mu/\rho V D$.
          - texto: |
              $\pi_3$ y $\pi_4$ se presentan invertidos —y el tercero además
              elevado a $1/2$— porque así son el número de Froude
              $V/\sqrt{gD}$ y el número de Reynolds $\rho V D/\mu$, que es como
              los tiene tabulados todo el mundo.
          - texto: |
              $\pi_2 = nD/V$ es el cociente entre la velocidad de punta de pala
              y la de avance: en hélices se le llama grado de avance, y es el
              que dice si la hélice está mordiendo agua o patinando.
          - texto: |
              La relación final, en vez de siete variables, es
              $F/\rho D^{2}V^{2} = \phi(nD/V,\ \mathrm{Fr},\ \mathrm{Re})$:
              tres entradas en lugar de seis.
          - texto: |
              Como los cuatro parámetros son adimensionales, cualquiera de ellos
              se puede sustituir por otro grupo adimensional sin comprobar nada:
              todos contienen la misma información.
            trampa: true
            mensaje: |
              La primera mitad tienta porque es medio verdad —sí se puede
              invertir un parámetro o elevarlo a una potencia, y sí se pueden
              multiplicar dos entre sí—, pero «cualquiera por cualquiera» es
              falso: el grupo nuevo tiene que seguir siendo **independiente** de
              los otros tres. Si sustituyes $\pi_3$ por el producto
              $\pi_3\pi_4$, has perdido una ecuación y con ella una variable del
              problema.
    resolucion: |
      **Siete variables que se convierten en cuatro grupos.**

      **El recuento, primero.** Siete variables ($F, D, V, \rho, n, g, \mu$) y
      tres magnitudes fundamentales ($M, L, T$) dan $7-3 = 4$ parámetros. Vale
      la pena hacerlo antes de calcular: si al final salen otros tantos, hay un
      error de exponentes.

      **Las variables repetidas** son las tres primeras que se pueden:
      $D$, $V$ y $\rho$. La condición es que entre las tres cubran las tres
      magnitudes fundamentales y ninguna sea combinación de las otras dos —una
      longitud, una velocidad y una densidad la cumplen— y que **no** esté entre
      ellas la incógnita, que aquí es la fuerza.

      **Los cuatro sistemas.** Cada parámetro se plantea como la variable que
      falta multiplicada por las tres repetidas elevadas a exponentes, y se
      impone que las tres magnitudes se cancelen:

      | | $M$ | $L$ | $T$ | resultado |
      |---|---|---|---|---|
      | $\pi_1 = F D^{\alpha}V^{\beta}\rho^{\gamma}$ | $1+\gamma=0$ | $1+\alpha+\beta-3\gamma=0$ | $-2-\beta=0$ | $F/\rho D^{2}V^{2}$ |
      | $\pi_2 = n\,D^{\alpha}V^{\beta}\rho^{\gamma}$ | $\gamma=0$ | $\alpha+\beta=0$ | $-1-\beta=0$ | $nD/V$ |
      | $\pi_3 = g\,D^{\alpha}V^{\beta}\rho^{\gamma}$ | $\gamma=0$ | $1+\alpha+\beta=0$ | $-2-\beta=0$ | $gD/V^{2}$ |
      | $\pi_4 = \mu\,D^{\alpha}V^{\beta}\rho^{\gamma}$ | $1+\gamma=0$ | $-1+\alpha+\beta-3\gamma=0$ | $-1-\beta=0$ | $\mu/\rho V D$ |

      **La forma en que se presentan.** Un parámetro adimensional sigue siéndolo
      si se invierte o se eleva a una potencia, así que se le da la forma
      reconocible:

      $$
      \pi_3^{-1/2} = \frac{V}{\sqrt{gD}} = \mathrm{Fr}
      \qquad
      \pi_4^{-1} = \frac{\rho V D}{\mu} = \mathrm{Re}
      $$

      $$
      \frac{F}{\rho D^{2} V^{2}}
      = \phi\!\left(\frac{nD}{V},\ \mathrm{Fr},\ \mathrm{Re}\right)
      $$

      **Lo que hay que llevarse, y no es el álgebra.** Froude y Reynolds no se
      han elegido: han **salido**. Reynolds aparece en cuanto la lista incluye
      la viscosidad, y Froude en cuanto incluye la gravedad. Eso da un criterio
      práctico para cualquier ensayo: mira qué variables has metido en la lista
      y sabrás qué semejanzas vas a tener que respetar. Y al revés — si en un
      problema de tubería en carga la gravedad no interviene, Froude no sale, y
      no hay que forzarlo.

      Aquí salen los dos a la vez, y ese es el problema real de las hélices de
      superficie: conservar Froude y Reynolds simultáneamente en un modelo a
      escala es imposible con el mismo fluido, así que hay que decidir cuál se
      respeta y corregir el otro.
