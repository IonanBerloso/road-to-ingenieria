ejercicios:
  # ── Este tema no tiene capítulo propio en la colección de problemas: sus dos
  #    ideas se examinan siempre DENTRO de los temas 4 a 8. Los dos ejercicios
  #    son nuestros (§08) y existen para que la ecuación fundamental se use una
  #    vez antes de que aparezca disfrazada de compuerta o de manómetro.
  - id: ejflu3-el-gradiente-de-presion-en-dos-fluidos
    titulo: A qué ritmo sube la presión en el agua y en el aire
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      La ecuación fundamental de la estática, con la gravedad como única
      fuerza de volumen, se reduce a

      $$
      \frac{dp}{dz} = -\rho\,g
      $$

      (con $z$ hacia arriba). Calcular a qué ritmo varía la presión con la
      profundidad en agua ($\rho = 1000\ \text{kg/m}^{3}$) y en aire
      ($\rho = 1{,}2\ \text{kg/m}^{3}$), y comparar.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: El gradiente de presión en cada fluido, y cuántas veces mayor es uno que otro.

    pasos:
      - tipo: reconocer
        pregunta: |
          El signo menos de la ecuación con $z$ hacia arriba. ¿Qué está
          diciendo?
        opciones:
          - texto: >-
              Que la presión **disminuye** al subir: si $z$ crece, $p$ baja. Al
              bajar, crece
            correcta: true
            mensaje: |
              Eso es. Por eso en los problemas conviene medir $h$ **hacia
              abajo** desde la superficie libre: así desaparece el signo y
              queda $p = p_0 + \rho g h$, que es más difícil de equivocar.
          - texto: >-
              Que la presión es negativa
            mensaje: |
              El signo afecta a la derivada, no a la presión. Una presión
              absoluta nunca es negativa; lo que el signo dice es en qué
              sentido cambia.
          - texto: >-
              Que la gravedad va hacia abajo, y eso ya lo sabíamos
            mensaje: |
              Que la gravedad vaya hacia abajo es la causa, sí, pero el signo
              tiene una consecuencia práctica: **al subir, la presión baja**.
              Es lo que hay que tener en la cabeza al recorrer un manómetro.

      - tipo: calcular
        titulo: El gradiente en agua
        pregunta: |
          ¿Cuánto aumenta la presión por cada metro de profundidad en agua?
        respuesta:
          tipo: magnitud
          valor: '9800 Pa/m'
          tolerancia: 0.01
          formato: una presión por unidad de longitud, con su unidad
        distractores:
          - valor: '1000 Pa/m'
            mensaje: |
              Esa es la densidad, no el gradiente. Falta multiplicar por
              $g = 9{,}8$: $\rho g = 9800\ \text{Pa/m}$.
          - valor: '102 Pa/m'
            mensaje: |
              Has dividido entre la gravedad. El gradiente es
              $\rho\,g$, un producto.
        pista: |
          dp/dh = ρ·g, con ρ = 1000 y g = 9,8.
        desarrollo: |
          $$
          \frac{dp}{dh} = \rho\,g = 1000 \cdot 9{,}8 = 9800\ \text{Pa/m}
          $$

          **Este número conviene memorizarlo**: un metro de agua son
          $9800\ \text{Pa}$, y de ahí sale que $1\ \text{mca} = 9800\ \text{Pa}$
          y que $1\ \text{bar} \approx 10{,}2\ \text{mca}$.

      - tipo: calcular
        titulo: Cuántas veces más que en el aire
        pregunta: |
          ¿Cuántas veces mayor es el gradiente en el agua que en el aire?
        respuesta:
          tipo: numero
          valor: '833'
          tolerancia: 5
          formato: un número, sin unidades
        distractores:
          - valor: '9800'
            mensaje: |
              $9800\ \text{Pa/m}$ es el gradiente del agua, no la razón entre
              los dos. La razón es $1000/1{,}2 = 833$, porque la gravedad se
              cancela.
          - valor: '1000'
            mensaje: |
              Sería si el aire tuviera densidad $1$. Con $1{,}2$:
              $1000/1{,}2 = 833$.
        pista: |
          La razón de gradientes es la razón de densidades: la g se cancela.
        desarrollo: |
          $$
          \frac{(\rho g)_{\text{agua}}}{(\rho g)_{\text{aire}}}
          = \frac{\rho_{\text{agua}}}{\rho_{\text{aire}}}
          = \frac{1000}{1{,}2} \approx 833
          $$

      - tipo: justificar
        pregunta: |
          Ordena las conclusiones. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la gravedad como única fuerza de volumen,
              $\nabla p = \rho\,\vec{g}$, que en vertical es
              $dp/dz = -\rho g$.
          - texto: >-
              En agua: $9800\ \text{Pa}$ por metro, es decir casi
              $0{,}1\ \text{bar/m}$.
          - texto: >-
              En aire: $11{,}76\ \text{Pa}$ por metro, unas 833 veces menos.
          - texto: >-
              Por eso en un depósito de gas la presión se toma **uniforme**:
              dos metros de aire son 24 Pa, despreciables frente a las
              presiones del problema.
          - texto: >-
              Y por eso en un manómetro los tramos de aire no se cuentan,
              pero los de líquido sí.
          - texto: >-
              Como el gradiente del aire es pequeño, la presión atmosférica
              también lo es y puede despreciarse en los cálculos.
            trampa: true
            mensaje: |
              Son dos cosas distintas. El **gradiente** del aire es pequeño
              (la presión casi no cambia con la altura en un depósito), pero
              la **presión atmosférica** vale $101\,325\ \text{Pa}$: diez
              metros de agua. Lo que permite ignorarla es trabajar en
              presiones manométricas, no que sea pequeña.

    resolucion: |
      Con la gravedad como única fuerza de volumen, la ecuación fundamental
      $\vec{R} = \frac{1}{\rho}\nabla p$ se reduce en vertical a
      $dp/dz = -\rho g$, o midiendo hacia abajo, $dp/dh = \rho g$:

      $$
      \boxed{\text{agua: } 9800\ \text{Pa/m}}
      \qquad
      \boxed{\text{aire: } 11{,}76\ \text{Pa/m}}
      \qquad
      \boxed{\text{razón} \approx 833}
      $$

      > **La consecuencia que se usa en todos los temas siguientes.** En un
      > depósito con gas encima de un líquido, la variación de presión dentro
      > del gas es despreciable y dentro del líquido no. Por eso en los
      > manómetros del tema 4 los tramos de aire se saltan y los de líquido
      > se suman uno a uno.

  - id: ejflu3-la-isotropia-y-lo-que-no-dice
    titulo: Qué dice exactamente el principio de isotropía
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito contiene agua en reposo. En un punto situado a
      $2\ \text{m}$ de profundidad se colocan tres placas diminutas: una
      horizontal, una vertical y una inclinada $45°$, todas de
      $1\ \text{cm}^{2}$.

      a) ¿Qué presión soporta cada una?

      b) ¿Qué fuerza recibe cada una, y en qué dirección?

      Presión atmosférica en la superficie; trabajar en presiones
      manométricas y con $g = 9{,}8\ \text{m/s}^{2}$.
    pide: La presión sobre cada placa y la fuerza sobre cada una, con su dirección.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué presión soporta cada placa?
        opciones:
          - texto: >-
              La misma las tres, $19\,600\ \text{Pa}$: la presión en un punto
              no depende de la orientación de la superficie
            correcta: true
            mensaje: |
              Eso es el principio de isotropía. Las tres están en el mismo
              punto, a la misma profundidad, así que soportan la misma
              presión.
          - texto: >-
              La horizontal más, porque aguanta el peso de la columna de agua
            mensaje: |
              Es la intuición natural y es falsa: la demostración de la cuña
              muestra que el peso del elemento es un infinitésimo de orden
              superior y desaparece en el límite. Las tres soportan lo mismo.
          - texto: >-
              La vertical menos, porque el agua resbala por ella
            mensaje: |
              «Resbalar» sería un esfuerzo tangencial, y en un fluido en
              reposo no los hay (tema 2). Solo hay presión, y es la misma en
              las tres.

      - tipo: calcular
        titulo: La presión
        pregunta: |
          ¿Cuánto vale la presión manométrica a $2\ \text{m}$?
        respuesta:
          tipo: magnitud
          valor: '19600 Pa'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '2000 Pa'
            mensaje: |
              Has multiplicado por $1000$ y olvidado la gravedad:
              $p = \rho g h = 1000 \cdot 9{,}8 \cdot 2$.
          - valor: '120925 Pa'
            mensaje: |
              Esa es la presión **absoluta**
              ($101\,325 + 19\,600$). El enunciado pide manométrica, que toma
              la atmosférica como cero.
        pista: |
          p = ρ·g·h, en manométricas y con h = 2 m.
        desarrollo: |
          $$
          p = \rho\,g\,h = 1000 \cdot 9{,}8 \cdot 2 = 19\,600\ \text{Pa}
          = 2\ \text{mca} = 0{,}196\ \text{bar}
          $$

      - tipo: calcular
        titulo: La fuerza sobre cada placa
        pregunta: |
          ¿Qué fuerza recibe cada placa de $1\ \text{cm}^{2}$?
        respuesta:
          tipo: magnitud
          valor: '1.96 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '19600 N'
            mensaje: |
              Te has dejado el área: $1\ \text{cm}^{2} = 10^{-4}\ \text{m}^{2}$,
              así que $F = 19\,600 \cdot 10^{-4} = 1{,}96\ \text{N}$.
          - valor: '196 N'
            mensaje: |
              Un factor cien: $1\ \text{cm}^{2}$ son $10^{-4}\ \text{m}^{2}$,
              no $10^{-2}$.
        pista: |
          F = p·S, con la superficie en metros cuadrados.
        desarrollo: |
          $$
          F = p\,S = 19\,600 \cdot 10^{-4} = 1{,}96\ \text{N}
          $$

          El **módulo** es el mismo en las tres. Lo que cambia es la
          dirección: cada fuerza es perpendicular a su placa.

      - tipo: justificar
        pregunta: |
          Ordena las conclusiones. Una pieza es falsa.
        piezas:
          - texto: >-
              Isotropía: la presión en un punto es la misma en todas las
              direcciones, $19\,600\ \text{Pa}$ para las tres placas.
          - texto: >-
              La fuerza sobre cada una vale $F = pS = 1{,}96\ \text{N}$, el
              mismo módulo.
          - texto: >-
              Pero cada fuerza es **perpendicular a su placa**: vertical
              sobre la horizontal, horizontal sobre la vertical, y a $45°$
              sobre la inclinada.
          - texto: >-
              Es decir: la presión es un escalar y la fuerza, un vector cuya
              dirección la pone la superficie.
          - texto: >-
              Por eso en el tema 7 una compuerta inclinada exige descomponer
              en horizontal y vertical.
          - texto: >-
              Como las tres fuerzas tienen el mismo módulo y distinta
              dirección, su suma vectorial es cero y la placa triple estaría
              en equilibrio.
            trampa: true
            mensaje: |
              Tres vectores del mismo módulo no suman cero salvo que estén
              a $120°$ en un plano, y estos no lo están. Además cada fuerza
              actúa sobre una placa distinta: no hay nada que sumar. El
              equilibrio de una placa real sale de que el fluido la empuja
              **por las dos caras**.

    resolucion: |
      **a) La presión, la misma para las tres:**

      $$
      \boxed{p = \rho g h = 19\,600\ \text{Pa} = 2\ \text{mca}}
      $$

      Es el principio de isotropía: en un punto de un fluido en reposo la
      presión no depende de la orientación de la superficie sobre la que se
      mida.

      **b) La fuerza, el mismo módulo y distinta dirección:**

      $$
      \boxed{F = p\,S = 1{,}96\ \text{N}\ \text{sobre cada placa, perpendicular a ella}}
      $$

      > **La frase que hay que llevarse.** La presión es un escalar; la fuerza
      > es un vector. La isotropía es una afirmación sobre el escalar, y no
      > impide que las fuerzas sobre superficies distintas apunten a sitios
      > distintos — que es justo lo que hace interesantes los temas 7 y 8.
