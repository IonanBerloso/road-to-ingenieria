ejercicios:
  # ── NUESTRO (§08). La continuidad de líquidos ya se practicó en el tema 9;
  #    lo que falta es el caso de gas, donde el caudal NO se conserva, y es
  #    justo el que el examen usa para separar quien ha entendido la ecuación
  #    de quien ha memorizado «A·v = cte».
  - id: ejflu10-el-gas-que-acelera-sin-estrecharse
    titulo: Un gas que acelera en una tubería que no cambia de sección
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería de $100\ \text{mm}$ de diámetro **constante** circula
      aire comprimido. En el punto 1 la densidad es
      $6\ \text{kg/m}^{3}$ y la velocidad $12\ \text{m/s}$. Aguas abajo, en
      el punto 2, el aire se ha expandido hasta
      $2{,}4\ \text{kg/m}^{3}$.

      a) Calcular el gasto másico.

      b) Calcular la velocidad en el punto 2.

      c) ¿Se conserva el caudal volumétrico?

      Régimen permanente.
    pide: El gasto, la velocidad en 2, y si el caudal se conserva.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sección no cambia y la velocidad sí. ¿Contradice eso la
          continuidad?
        opciones:
          - texto: >-
              No: lo que la continuidad conserva aquí es
              $\dot m = \rho v A$, y al bajar $\rho$ tiene que subir $v$ para
              compensar
            correcta: true
            mensaje: |
              Eso es. La forma $Av = \text{cte}$ **solo** vale con densidad
              constante. En un gas que se expande, el caudal volumétrico
              crece aunque la tubería sea la misma.
          - texto: >-
              Sí: con sección constante la velocidad tiene que ser constante
            mensaje: |
              Eso sería cierto en un líquido. En un gas la densidad es una
              variable más, y la conservación es de **masa**, no de volumen.
          - texto: >-
              No, porque el flujo no es permanente
            mensaje: |
              El enunciado dice que sí lo es: nada cambia con el tiempo. Lo
              que cambia es la densidad **con la posición**, que es otra cosa.

      - tipo: calcular
        titulo: El gasto másico
        pregunta: |
          ¿Cuánta masa pasa por segundo?
        respuesta:
          tipo: magnitud
          valor: '0.5655 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '0.0942 kg/s'
            mensaje: |
              Ese es el caudal volumétrico $vA$ en $\text{m}^{3}/\text{s}$.
              Para la masa falta multiplicar por la densidad, $6\ \text{kg/m}^{3}$.
          - valor: '7.2 kg/s'
            mensaje: |
              Has multiplicado $\rho v$ sin el área:
              $6\cdot12 = 72\ \text{kg/(m}^{2}\text{s)}$ es un flujo másico
              **por unidad de área**. Falta $\times A = 0{,}00785$.
        pista: |
          ṁ = ρ·v·A, con A = π·0,1²/4.
        desarrollo: |
          $$
          A = \frac{\pi\cdot0{,}1^{2}}{4} = 7{,}854\cdot10^{-3}\ \text{m}^{2}
          $$
          $$
          \dot m = \rho_1 v_1 A = 6\cdot12\cdot7{,}854\cdot10^{-3}
          = 0{,}5655\ \text{kg/s}
          $$

      - tipo: calcular
        titulo: La velocidad aguas abajo
        pregunta: |
          Con la misma sección y $\rho_2 = 2{,}4\ \text{kg/m}^{3}$, ¿cuál es
          $v_2$?
        respuesta:
          tipo: magnitud
          valor: '30 m/s'
          tolerancia: 0.01
          formato: una velocidad, con su unidad
        distractores:
          - valor: '12 m/s'
            mensaje: |
              Sería la respuesta si el fluido fuera incompresible. Al
              expandirse el aire, la velocidad sube en la misma proporción en
              que baja la densidad: $\times 6/2{,}4 = 2{,}5$.
          - valor: '4.8 m/s'
            mensaje: |
              Has multiplicado por $2{,}4/6$ en vez de por $6/2{,}4$. Menos
              densidad significa **más** velocidad para llevar la misma masa.
        pista: |
          ρ₁v₁ = ρ₂v₂ con la misma A. Despeja v₂.
        desarrollo: |
          $$
          \rho_1 v_1 = \rho_2 v_2
          \quad\Rightarrow\quad
          v_2 = 12\cdot\frac{6}{2{,}4} = 30\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              En régimen permanente lo que se conserva es el gasto:
              $\dot m = \rho v A$, el mismo en 1 y en 2.
          - texto: >-
              $\dot m = 6\cdot12\cdot7{,}854\cdot10^{-3} = 0{,}5655\ \text{kg/s}$.
          - texto: >-
              Con $A$ igual: $v_2 = v_1\rho_1/\rho_2 = 30\ \text{m/s}$.
          - texto: >-
              El caudal **no** se conserva: pasa de $0{,}094$ a
              $0{,}236\ \text{m}^{3}/\text{s}$, dos veces y media más.
          - texto: >-
              Con un líquido la respuesta habría sido otra: densidad
              constante, y entonces sí $v_2 = v_1$.
          - texto: >-
              Como el caudal aumenta, por la tubería pasa más aire aguas
              abajo que aguas arriba.
            trampa: true
            mensaje: |
              Pasa el **mismo aire**: los mismos $0{,}5655\ \text{kg/s}$. Lo
              que ocupa más es el volumen, porque está más expandido. Si
              pasara más masa por un extremo que por otro, se estaría
              acumulando o creando materia dentro del tubo.

    resolucion: |
      **a) El gasto**, que es lo que se conserva:

      $$
      \boxed{\dot m = \rho_1 v_1 A = 6\cdot12\cdot7{,}854\cdot10^{-3} = 0{,}5655\ \text{kg/s}}
      $$

      **b) La velocidad**, con la misma sección:

      $$
      \boxed{v_2 = v_1\frac{\rho_1}{\rho_2} = 12\cdot2{,}5 = 30\ \text{m/s}}
      $$

      **c) No.** El caudal pasa de $0{,}0942$ a
      $0{,}2356\ \text{m}^{3}/\text{s}$: se multiplica por $2{,}5$, igual que
      la velocidad.

      > **La frase que hay que tener clara antes del tema 12.** «$Av$
      > constante» no es la ecuación de continuidad: es su caso particular
      > para densidad constante. La ecuación es «$\rho v A$ constante», y en
      > cuanto el enunciado hable de un gas que cambia de presión hay que
      > volver a ella.
  - id: ejflu10-col31-el-aire-que-se-ensancha-y-no-frena-tanto
    titulo: El aire que se ensancha, y no frena lo que parece
    fuente: Ejercicio 3.1 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por un conducto fluye aire. En la sección A el diámetro es de 100 mm, la
      temperatura 15 ºC, la presión 3 kg/cm² y la velocidad 25 m/s. En la
      sección B el diámetro es de 200 mm, la temperatura −5 ºC y la presión
      1,5 kg/cm². Se pide:

      a) Velocidad en la sección B.

      b) Caudal en peso.

      Dato: constante del aire $R_{aire} = 287{,}14$ m·N/(kg·K).
    pide: La velocidad en la sección ancha y el caudal en peso de la conducción.
    pasos:
      - tipo: reconocer
        pregunta: |
          El conducto pasa de 100 a 200 mm, o sea que la sección se
          **cuadruplica**. Sin calcular nada, ¿qué le pasa a la velocidad?
        opciones:
          - texto: |
              Baja, pero **menos** de cuatro veces: el aire también se expande,
              y un gas menos denso ocupa más sitio para el mismo gasto másico
            correcta: true
            mensaje: |
              Ese es el punto del ejercicio. Si el fluido fuera agua, cuadruplicar
              la sección dividiría la velocidad por cuatro y punto. Aquí el aire
              pasa de 4,78 a 3,23 kg/m³ —se expande un 48 %— y esa expansión
              tiene que salir por algún sitio: sale como velocidad. En vez de
              6,25 m/s queda en 9,26.
          - texto: Baja exactamente cuatro veces, a 6,25 m/s, por continuidad
            mensaje: |
              Eso es continuidad **volumétrica**, y solo vale si la densidad no
              cambia. Aquí cambia mucho: el aire pierde la mitad de su presión
              y se enfría veinte grados. Lo que se conserva siempre es el gasto
              **másico**, $\rho A V$, no el volumétrico.
          - texto: |
              Sube, porque al bajar la presión el aire se acelera como en un
              venturi
            mensaje: |
              En un venturi la presión baja **porque** el fluido se acelera al
              estrecharse, y aquí el conducto se ensancha. La velocidad baja;
              lo que discutimos es cuánto.
          - texto: |
              No se puede saber sin conocer las pérdidas de carga del tramo
            mensaje: |
              Las pérdidas afectan a la energía, y la continuidad no es una
              ecuación de energía: es de conservación de la masa. Lo que entra
              sale, se pierda carga o no.

      - tipo: calcular
        titulo: La densidad en la sección A
        pregunta: |
          Con $\rho = p/(R\,T)$ y $p_{atm} = 1{,}033$ kg/cm², ¿cuánto vale la
          densidad del aire en A? Cuidado con dos cosas a la vez.
        respuesta:
          tipo: magnitud
          valor: '4.78 kg/m3'
          tolerancia: 0.01
          formato: la densidad en kg/m³
        distractores:
          - valor: '3.56 kg/m3'
            mensaje: |
              Has usado los 3 kg/cm² tal cual. Esa es la lectura de un
              manómetro, o sea presión **relativa**: la ley de los gases pide
              la absoluta, que es $3 + 1{,}033 = 4{,}033$ kg/cm². Es el error
              más caro de este ejercicio porque no chirría — 3,56 kg/m³ es un
              valor perfectamente creíble para aire comprimido.
          - valor: '91.8 kg/m3'
            mensaje: |
              Has metido la temperatura en grados centígrados. La ley de los
              gases necesita kelvin, así que 15 ºC son 288 K. Y aquí el fallo sí
              chirría: 91,8 kg/m³ es aire más denso que el aceite.
          - valor: '0.0000488 kg/m3'
            mensaje: |
              Te has dejado la conversión de kg/cm² a pascales. Un kg/cm² es un
              kilopondio por centímetro cuadrado, o sea $9{,}8\cdot 10^{4}$ Pa
              — ese «kg» es una fuerza, no una masa.
        pista: |
          $p_{abs} = (3+1{,}033)\cdot 9{,}8\cdot 10^{4}$ Pa y $T = 288$ K.
        desarrollo: |
          $$
          \rho_A = \frac{p_A}{R\,T_A}
                 = \frac{(3+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot(15+273)}
                 = \frac{395\,234}{82\,696} = 4{,}78\ \text{kg/m}^{3}
          $$

          Dos conversiones y las dos se olvidan: la presión a **absoluta** y la
          temperatura a **kelvin**. Y una tercera que no es conversión sino
          lectura: en los enunciados de esta escuela **kg/cm² es una presión**,
          no una masa por unidad de área. Ese «kg» es un kilopondio, y equivale
          a 9,8·10⁴ Pa.

      - tipo: calcular
        titulo: La velocidad en B
        pregunta: |
          En B la densidad sale 3,23 kg/m³. Con el gasto másico conservado,
          ¿cuál es la velocidad en la sección B, en m/s?
        respuesta:
          tipo: magnitud
          valor: '9.26 m/s'
          tolerancia: 0.01
          formato: la velocidad en m/s
        distractores:
          - valor: '6.25 m/s'
            mensaje: |
              Ese es el resultado de $A_A V_A = A_B V_B$, o sea de conservar el
              **volumen**. Solo vale con densidad constante. Aquí el aire se
              expande de 4,78 a 3,23 kg/m³ y esa expansión aporta velocidad: la
              real es un 48 % mayor que 6,25, exactamente la razón de densidades.
          - valor: '11.64 m/s'
            mensaje: |
              Las cuentas están bien encadenadas y las densidades mal: parece
              que has usado las presiones relativas en las dos secciones. Como
              el fallo afecta a las dos, no se cancela — la razón
              $\rho_A/\rho_B$ cambia de 1,48 a 1,86.
          - valor: '37.0 m/s'
            mensaje: |
              Has aplicado la razón de densidades y te has dejado la de áreas.
              Y el resultado se descarta sin comprobar nada: el conducto se
              **ensancha**, así que la velocidad no puede salir mayor que los
              25 m/s de partida.
        pista: |
          $\rho_A A_A V_A = \rho_B A_B V_B$, y $A_B/A_A = 4$.
        desarrollo: |
          $$
          \rho_A A_A V_A = \rho_B A_B V_B
          \;\Longrightarrow\;
          V_B = V_A\,\frac{\rho_A}{\rho_B}\,\frac{A_A}{A_B}
              = 25\cdot\frac{4{,}78}{3{,}23}\cdot\frac{1}{4}
              = 9{,}26\ \text{m/s}
          $$

          Escrito así se ven separados los dos efectos: la razón de áreas
          divide por 4, y la de densidades multiplica por 1,48. El resultado neto
          es dividir por 2,7, no por 4.

      - tipo: calcular
        titulo: El caudal en peso
        pregunta: |
          ¿Cuál es el caudal en peso, en N/s?
        respuesta:
          tipo: magnitud
          valor: '9.2 N/s'
          tolerancia: 0.02
          formato: el caudal en peso, en N/s
        distractores:
          - valor: '0.939 N/s'
            mensaje: |
              Eso es el caudal **másico**, en kg/s, y está bien calculado. El
              caudal en peso es ese mismo por $g$: son newtons por segundo, no
              kilogramos por segundo.
          - valor: '0.196 N/s'
            mensaje: |
              Parece que has usado el caudal volumétrico en vez del másico. El
              paso obligatorio es multiplicar por la densidad: sin ella el
              número no tiene masa dentro y no puede tener peso.
        pista: |
          $G = \rho_A A_A V_A \cdot g$, y da igual la sección que elijas.
        desarrollo: |
          $$
          \dot m = \rho_A A_A V_A = 4{,}78\cdot\frac{\pi\,0{,}1^{2}}{4}\cdot 25
                 = 0{,}939\ \text{kg/s}
          $$

          $$
          G = \dot m\, g = 0{,}939\cdot 9{,}8 = 9{,}2\ \text{N/s}
          $$

          Y aquí hay una comprobación gratis que conviene coger la costumbre de
          hacer: el mismo cálculo en la sección B tiene que dar lo mismo.

          $$
          \rho_B A_B V_B = 3{,}23\cdot 0{,}0314\cdot 9{,}26 = 0{,}939\ \text{kg/s}
          \quad\checkmark
          $$

          Si no coincide, el fallo está en las densidades o en la velocidad de
          B, y lo sabes sin mirar la solución.

      - tipo: justificar
        pregunta: |
          Ordena el argumento del apartado a). Una pieza es falsa.
        piezas:
          - texto: |
              Lo que se conserva entre A y B es el **gasto másico**,
              $\rho A V$, porque no entra ni sale aire por las paredes del
              conducto.
          - texto: |
              El gasto **volumétrico** no se conserva: $Q_A = 0{,}196$ m³/s y
              $Q_B = 0{,}291$ m³/s. El aire ocupa un 48 % más de sitio en B
              porque está a menos presión y más frío.
          - texto: |
              Las densidades salen de la ley de los gases con la presión
              **absoluta** —hay que sumar la atmosférica a la lectura del
              manómetro— y la temperatura en kelvin: 4,78 y 3,23 kg/m³.
          - texto: |
              Con eso, $V_B = V_A(\rho_A/\rho_B)(A_A/A_B) = 9{,}26$ m/s: la
              sección divide por cuatro y la expansión multiplica por 1,48.
          - texto: |
              Que el volumen aumente y la masa se conserve significa que en el
              tramo se ha perdido aire; por eso hay que trabajar siempre con el
              gasto másico, que es el único que no se escapa.
            trampa: true
            mensaje: |
              No se pierde aire: no se pierde **nada**. Que el volumen aumente y
              la masa se conserve es justo lo que hace un gas al expandirse —la
              misma masa ocupando más sitio—, y es la definición de que baje la
              densidad. Si se escapara aire, tampoco se conservaría el gasto
              másico y la ecuación que hemos usado no valdría.
    resolucion: |
      **Continuidad cuando el fluido se expande.**

      Con agua, este problema sería una línea: la sección se cuadruplica, la
      velocidad se divide por cuatro, 6,25 m/s. Con aire no, y la diferencia es
      el 48 %.

      **1 · Las densidades**, con la ley de los gases y las dos conversiones que
      se olvidan —presión **absoluta**, temperatura en **kelvin**—:

      $$
      \rho_A = \frac{(3+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot 288}
             = 4{,}78\ \text{kg/m}^{3}
      \qquad
      \rho_B = \frac{(1{,}5+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot 268}
             = 3{,}23\ \text{kg/m}^{3}
      $$

      **2 · La continuidad, en masa.**

      $$
      \rho_A A_A V_A = \rho_B A_B V_B
      \;\Longrightarrow\;
      V_B = 25\cdot\frac{4{,}78}{3{,}23}\cdot\frac{1}{4} = 9{,}26\ \text{m/s}
      $$

      **3 · El caudal en peso.**

      $$
      G = \rho_A A_A V_A\, g = 0{,}939\cdot 9{,}8 = 9{,}2\ \text{N/s}
      $$

      **Las tres cosas que este ejercicio pone a prueba, y ninguna es la
      continuidad.** La ecuación es la de siempre. Lo que se falla es lo de
      alrededor:

      - **kg/cm² es una presión**, con un kilopondio dentro: $9{,}8\cdot 10^{4}$ Pa.
      - Y es una presión **relativa**: la ley de los gases quiere la absoluta,
        así que hay que sumar la atmosférica. Olvidarlo cambia la respuesta un
        26 % y produce un número perfectamente creíble.
      - La temperatura, en kelvin. Este sí avisa, porque en B saldría negativa.

      Y una costumbre que ahorra disgustos: **calcular el gasto másico por las
      dos secciones**. Tienen que dar lo mismo, y si no dan lo mismo el error
      está localizado antes de mirar ninguna solución.
