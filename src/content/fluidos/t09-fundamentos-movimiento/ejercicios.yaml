ejercicios:
  # ── Los dos son NUESTROS (§08). Los temas 9, 10 y 11 no tienen capítulo
  #    propio en la colección: la continuidad se examina siempre dentro de un
  #    problema de Bernoulli o de cantidad de movimiento. Estos dos existen
  #    para usarla una vez sola, antes de que venga acompañada.
  - id: ejflu9-la-continuidad-en-un-estrechamiento
    titulo: Qué pasa con la velocidad al estrechar la tubería
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería de $200\ \text{mm}$ de diámetro circula un caudal de
      agua de $50\ \text{l/s}$. La tubería se estrecha hasta
      $100\ \text{mm}$.

      a) Calcular la velocidad en cada tramo.

      b) Calcular el gasto másico.

      c) ¿Cuántas veces mayor es la velocidad en el tramo estrecho?
    pide: Las dos velocidades, el gasto másico y la razón entre velocidades.

    pasos:
      - tipo: reconocer
        pregunta: |
          El diámetro se reduce a la mitad. ¿Qué le pasa a la velocidad?
        opciones:
          - texto: >-
              Se multiplica por **cuatro**: la sección va con el cuadrado del
              diámetro, y $Q = vA$ obliga a que $v$ crezca lo que la sección
              disminuye
            correcta: true
            mensaje: |
              Eso es, y es la trampa más repetida del tema: la mitad de
              diámetro es la **cuarta parte** de sección, así que cuádruple
              velocidad.
          - texto: >-
              Se duplica, porque el diámetro se reduce a la mitad
            mensaje: |
              La velocidad no depende del diámetro sino del **área**, y el
              área va con $D^{2}$. Con la mitad de diámetro, un cuarto de
              área y cuatro veces la velocidad.
          - texto: >-
              No cambia, porque el caudal se conserva
            mensaje: |
              El caudal se conserva, sí, y precisamente por eso la velocidad
              **tiene** que cambiar: $Q = vA$ con $Q$ fijo y $A$ menor obliga
              a $v$ mayor.

      - tipo: calcular
        titulo: La velocidad en el tramo ancho
        pregunta: |
          ¿Qué velocidad lleva el agua en la tubería de $200\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '1.59 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0.25 m/s'
            mensaje: |
              Has dividido el caudal entre $D^{2}$ sin el $\pi/4$. El área de
              un círculo es $\pi D^{2}/4 = 0{,}0314\ \text{m}^{2}$, no
              $0{,}04$.
          - valor: '1592 m/s'
            mensaje: |
              Un factor mil: los $50\ \text{l/s}$ son
              $0{,}05\ \text{m}^{3}/\text{s}$, no $50$.
        pista: |
          v = Q/A, con Q en m³/s y A = π·D²/4.
        desarrollo: |
          $$
          A_1 = \frac{\pi\cdot0{,}2^{2}}{4} = 0{,}0314\ \text{m}^{2}
          \qquad
          v_1 = \frac{0{,}05}{0{,}0314} = 1{,}59\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El gasto másico
        pregunta: |
          ¿Cuál es el flujo másico de agua?
        respuesta:
          tipo: magnitud
          valor: '50 kg/s'
          tolerancia: 0.01
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '0.05 kg/s'
            mensaje: |
              Ese es el caudal en $\text{m}^{3}/\text{s}$. Para pasar a masa
              hay que multiplicar por la densidad:
              $1000\cdot0{,}05 = 50\ \text{kg/s}$.
          - valor: '79.6 kg/s'
            mensaje: |
              Has multiplicado por la velocidad en algún sitio. El gasto es
              $\dot m = \rho Q$, y la velocidad ya está dentro del caudal.
        pista: |
          ṁ = ρ·Q, con ρ = 1000 kg/m³.
        desarrollo: |
          $$
          \dot m = \rho\,Q = 1000\cdot0{,}05 = 50\ \text{kg/s}
          $$

          **Coincidencia útil de recordar:** en agua, los litros por segundo y
          los kilos por segundo son el mismo número.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Continuidad en flujo incompresible y permanente:
              $Q = A_1v_1 = A_2v_2$.
          - texto: >-
              $A_1 = 0{,}0314\ \text{m}^{2}$ y $A_2 = 0{,}00785\ \text{m}^{2}$,
              la cuarta parte.
          - texto: >-
              $v_1 = 1{,}59\ \text{m/s}$ y $v_2 = 6{,}37\ \text{m/s}$: cuatro
              veces más.
          - texto: >-
              $\dot m = \rho Q = 50\ \text{kg/s}$, el mismo en los dos tramos.
          - texto: >-
              El flujo es **no uniforme** en el estrechamiento —la velocidad
              cambia con la posición— y aun así permanente, porque no cambia
              con el tiempo.
          - texto: >-
              Como la velocidad aumenta al estrechar, también aumenta el
              caudal en el tramo estrecho.
            trampa: true
            mensaje: |
              El caudal es **el mismo**: eso es justo lo que dice la
              continuidad. Lo que aumenta es la velocidad, y lo hace
              exactamente para compensar la reducción de área, de modo que el
              producto $vA$ no cambie.

    resolucion: |
      **a) Las velocidades.** Con $Q = 0{,}05\ \text{m}^{3}/\text{s}$:

      $$
      \boxed{v_1 = \frac{0{,}05}{\pi\cdot0{,}2^{2}/4} = 1{,}59\ \text{m/s}}
      \qquad
      \boxed{v_2 = \frac{0{,}05}{\pi\cdot0{,}1^{2}/4} = 6{,}37\ \text{m/s}}
      $$

      **b) El gasto:** $\boxed{\dot m = 1000\cdot0{,}05 = 50\ \text{kg/s}}$.

      **c) La razón:** $\boxed{v_2/v_1 = 4}$, el cuadrado de la razón de
      diámetros.

      > **La regla que ahorra la mitad de las cuentas del resto del curso.**
      > Si el diámetro se divide por $k$, la velocidad se multiplica por
      > $k^{2}$. Con la mitad de diámetro, cuatro veces; con un tercio,
      > nueve. En un venturímetro o en una boquilla esto se usa en cada
      > apartado.

  - id: ejflu9-permanente-o-uniforme
    titulo: Permanente, uniforme, o las dos cosas
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Clasificar los siguientes flujos como permanentes o no, y como uniformes
      o no:

      a) Agua por una tubería recta de sección constante, con caudal fijo.

      b) Agua por un difusor (sección creciente), con caudal fijo.

      c) Agua por una tubería recta justo después de abrir una válvula.

      d) Un depósito que se vacía por un orificio, sin reponer el nivel.

      Y responder: ¿en cuál de ellos hay aceleración, y de qué tipo?
    pide: La clasificación de los cuatro casos y dónde hay aceleración.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué derivada define cada término?
        opciones:
          - texto: >-
              Permanente es $\partial/\partial t = 0$ (no cambia con el
              tiempo); uniforme es $\partial/\partial s = 0$ (no cambia con la
              posición)
            correcta: true
            mensaje: |
              Eso es, y son independientes: se pueden dar las cuatro
              combinaciones. Confundirlas es el error clásico del tema.
          - texto: >-
              Las dos significan lo mismo: que nada cambia
            mensaje: |
              Cambian cosas distintas. Un difusor con caudal fijo no cambia
              **con el tiempo** (permanente) pero sí **con la posición** (no
              uniforme).
          - texto: >-
              Permanente es que el caudal sea constante y uniforme que la
              tubería sea recta
            mensaje: |
              Se parece, pero no es la definición: un difusor con caudal
              constante es permanente y no uniforme, y una tubería recta
              justo tras abrir una válvula es uniforme y no permanente.

      - tipo: calcular
        titulo: Cuántos de los cuatro son permanentes
        pregunta: |
          De los cuatro casos, ¿cuántos son de flujo permanente?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Son dos: a) y b). Los dos tienen caudal fijo, y por tanto nada
              cambia con el tiempo, aunque b) no sea uniforme.
          - valor: '3'
            mensaje: |
              c) y d) **no** son permanentes: en c) el flujo está
              arrancando y en d) el nivel baja, así que la velocidad de salida
              disminuye con el tiempo.
        pista: |
          Permanente = nada cambia con el tiempo. ¿Cuáles tienen caudal fijo?
        desarrollo: |
          Permanentes: **a)** y **b)**, los dos de caudal fijo.
          No permanentes: **c)**, que está arrancando, y **d)**, donde el
          nivel baja y con él la velocidad de salida.

      - tipo: justificar
        pregunta: |
          Ordena la clasificación. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Permanente y uniforme: nada cambia ni con el tiempo ni a lo
              largo del tubo. **Sin aceleración.**
          - texto: >-
              b) Permanente y no uniforme: la velocidad cambia al avanzar.
              Hay **aceleración convectiva**.
          - texto: >-
              c) No permanente y uniforme: la velocidad es la misma en todo el
              tubo pero crece con el tiempo. Hay **aceleración local**.
          - texto: >-
              d) No permanente y no uniforme: cambia con el tiempo (el nivel
              baja) y con la posición (el orificio estrecha). Hay **las dos
              aceleraciones**.
          - texto: >-
              La mayoría de los problemas de la asignatura son del tipo a) y
              b): por eso se puede quitar siempre el término
              $\partial/\partial t$.
          - texto: >-
              Si un flujo es permanente, no puede tener aceleración: la
              velocidad de cada partícula no cambia.
            trampa: true
            mensaje: |
              Es la confusión que este ejercicio existe para deshacer. En
              régimen permanente la velocidad **en cada punto** no cambia,
              pero una partícula que avanza pasa por puntos con velocidades
              distintas: eso es la aceleración convectiva. El caso b) es
              exactamente eso.

    resolucion: |
      | caso | permanente | uniforme | aceleración |
      |---|---|---|---|
      | a) tubería recta, caudal fijo | sí | sí | ninguna |
      | b) difusor, caudal fijo | sí | no | convectiva |
      | c) tras abrir la válvula | no | sí | local |
      | d) depósito que se vacía | no | no | las dos |

      $$
      \vec{a}
      = \underbrace{\frac{\partial \vec{v}}{\partial s}\,v}_{\text{convectiva: falta si es uniforme}}
      + \underbrace{\frac{\partial \vec{v}}{\partial t}}_{\text{local: falta si es permanente}}
      $$

      > **La idea que hay que llevarse, porque reaparece en Bernoulli.** Un
      > flujo permanente **sí puede acelerar**. Lo hace cuando el conducto
      > cambia de sección: la partícula se acelera al avanzar aunque en cada
      > punto la velocidad sea siempre la misma. Sin eso, un venturímetro no
      > tendría sentido.
