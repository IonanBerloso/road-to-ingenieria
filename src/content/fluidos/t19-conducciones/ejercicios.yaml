        <line x1="340" y1="230" x2="392" y2="230" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="376" y1="55" x2="376" y2="230" stroke="var(--faint)" stroke-width="1" marker-start="url(#m618n)" marker-end="url(#m618n)"/>
