      <figcaption>El by-pass devuelve al aspirador parte de lo que la bomba impulsa, así que la bomba mueve más caudal del que llega a los depósitos. Las dos válvulas son lo único que pierde carga fuera de las tuberías.</figcaption>
      </figure>
    pide: Los factores de paso de las dos válvulas, el punto de funcionamiento de la bomba, el caudal máximo que puede llegar a F y el que volvería con la bomba parada.
    pasos:
      - tipo: reconocer
        pregunta: |
          El by-pass conecta la salida de la bomba con su aspiración. ¿Qué
          consecuencia tiene sobre los caudales?
        opciones:
          - texto: Que la bomba mueve más caudal del que llega a los depósitos, porque una parte vuelve por el by-pass
            correcta: true
            mensaje: |
              Eso es. La bomba impulsa Q, de los cuales una parte se va por la
              tubería 1 hacia los depósitos y el resto vuelve a la aspiración.
              Por eso el punto de funcionamiento —108,4 l/s— no coincide con
              los 80 l/s que llegan a E y F.
          - texto: Que la bomba mueve exactamente el caudal que llega a los depósitos, y el by-pass solo sirve para arrancar
            mensaje: |
              Si el by-pass está abierto —aunque sea poco—, por él circula
              caudal, y ese caudal pasa por la bomba y no llega a los
              depósitos. Es justamente su función: regular sin estrangular la
              impulsión.
          - texto: Que el caudal se reparte a partes iguales entre el by-pass y la tubería 1
            mensaje: |
              Se reparte según lo que pierda cada rama, y aquí no son
              comparables: el by-pass tiene que absorber los 33 m que da la
              bomba con una sola válvula, así que le corresponde poco caudal.

      - tipo: calcular
        titulo: El factor de paso de V2
        pregunta: |
          Factor de paso de V₂ para que las tuberías 2 y 3 lleven 40 l/s cada
          una. Para el acero comercial, el Cuadro nº 25 da $C_{HW} = 130$ en
          los dos diámetros.
        respuesta:
          tipo: numero
          valor: '1.98'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '6.6'
            mensaje: |
              Has hecho que V₂ absorba la pérdida entera de la tubería 3. Solo
              tiene que compensar la **diferencia** entre las dos ramas, que
              son 15 m de tubería de 150 mm: medio metro de columna.
          - valor: '121'
            mensaje: |
              Has hecho que V₂ absorba toda la energía del nudo. La tubería 2
              descarga en un depósito que está a la misma cota que el de la 3,
              así que lo único que hay que igualar es la diferencia de
              pérdidas.
        pista: |
          E y F están a la misma cota, así que las dos ramas parten del mismo
          nudo y llegan a la misma energía: tienen que perder lo mismo.
        desarrollo: |
          Las dos ramas salen del nudo D y terminan en la cota 30, así que
          pierden lo mismo. La 3 es 15 m más larga, y esa diferencia es la que
          la válvula tiene que compensar en la 2:

          $$
          K_2\frac{V^{2}}{2g} = J_1(150)\,(50-35)\,40^{1{,}852} = 0{,}5176\ \text{m}
          $$

          Con V = 2,264 m/s en la tubería de 150 mm,
          $V^{2}/2g = 0{,}2614$ m, de donde **K₂ = 1,98**.

      - tipo: calcular
        titulo: El punto de funcionamiento de la bomba
        pregunta: |
          Caudal que mueve la bomba, sabiendo que absorbe 50 kW con un
          rendimiento de 0,7 y que a los depósitos llegan 80 l/s.
        respuesta:
          tipo: magnitud
          valor: '108.4 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '80 l/s'
            mensaje: |
              Esos son los que llegan a los depósitos. La bomba mueve más,
              porque parte de lo que impulsa vuelve por el by-pass.
          - valor: '119 l/s'
            mensaje: |
              Te has dejado las pérdidas de carga. La altura de la bomba no
              son los 30 m de desnivel: son 32,95, con los 2,95 que se pierden
              en las tuberías 1 y 3.
          - valor: '155 l/s'
            mensaje: |
              Has usado los 50 kW como potencia útil. Son los que la bomba
              **absorbe**; al agua le llegan $50\cdot 0{,}7 = 35$ kW.
        pista: |
          La altura de la bomba es la energía del punto C, y esa se obtiene
          subiendo desde los depósitos: 30 m más lo que pierden las tuberías 3
          y 1.
        desarrollo: |
          $$
          B_D = 30 + J_1(150)\cdot 50\cdot 40^{1{,}852} = 30 + 1{,}725 = 31{,}725\ \text{m}
          $$

          $$
          H = B_C = B_D + J_1(200)\cdot 40\cdot 80^{1{,}852} = 31{,}725 + 1{,}227 = 32{,}95\ \text{m}
          $$

          Y con los 35 kW útiles:

          $$
          Q = \frac{35\,000}{9800\cdot 32{,}95} = 0{,}1084\ \text{m}^{3}/\text{s} = 108{,}4\ \text{l/s}
          $$

          El punto de funcionamiento es **(32,95 mca; 108,4 l/s)**, y por el
          by-pass vuelven $108{,}4 - 80 = 28{,}4$ l/s.

      - tipo: calcular
        titulo: El factor de paso de V1
        pregunta: |
          Factor de paso de V₁, sabiendo que por el by-pass —de 200 mm—
          vuelven 28,4 l/s y que su longitud es despreciable.
        respuesta:
          tipo: numero
          valor: '791'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '54.3'
            mensaje: |
              Has usado el caudal entero de la bomba. Por el by-pass solo
              vuelven 28,4 l/s: los otros 80 se van por la tubería 1.
          - valor: '250'
            mensaje: |
              Has usado el diámetro de 150 mm. El by-pass es de 200, como la
              impulsión, y con menos velocidad hace falta una K mucho mayor
              para disipar los mismos 33 m.
        pista: |
          El by-pass une C con B, y entre los dos hay 32,95 m de diferencia de
          energía. Toda esa carga la tiene que quemar V₁.
        desarrollo: |
          Con la longitud despreciable, la válvula es lo único que pierde:

          $$
          K_1\frac{V^{2}}{2g} = 32{,}95\ \text{m} \qquad V = \frac{0{,}0284}{\pi\,0{,}2^{2}/4} = 0{,}904\ \text{m/s}
          $$

          $$
          K_1 = \frac{32{,}95}{0{,}0417} = 791
          $$

          Un factor de paso de 791 es una válvula **casi cerrada**: le hace
          falta estrangular muchísimo para que solo se cuelen 28 l/s por un
          camino que no tiene ni longitud ni desnivel.

      - tipo: calcular
        titulo: El caudal máximo que puede llegar a F
        pregunta: |
          Caudal máximo Q₃ posible, y con qué posición de las válvulas.
        respuesta:
          tipo: magnitud
          valor: '90.7 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '108.4 l/s'
            mensaje: |
              Ese es el caudal de la bomba en el caso del apartado a), con el
              by-pass abierto y una altura de 32,95 m. Al mandarlo todo por la
              tubería 3, la pérdida sube y el caudal baja.
          - valor: '119 l/s'
            mensaje: |
              Te has dejado las pérdidas. Con 90,7 l/s por la 3 y la 1 se
              pierden 9,4 m, tres veces más que en el caso del apartado a).
        pista: |
          Para que a F llegue todo, hay que cerrar V₁ —que no vuelva nada— y
          V₂ —que no se vaya nada a E—. Después, la bomba a potencia constante
          contra la instalación 1 + 3.
        desarrollo: |
          El máximo se consigue **con V₁ y V₂ cerradas**: sin by-pass no
          vuelve nada y sin la rama 2 no se desvía nada. Entonces todo el
          caudal de la bomba pasa por 1 y por 3:

          $$
          \frac{35\,000}{9800\,Q} = 30 + \left[J_1(200)\cdot 40 + J_1(150)\cdot 50\right]Q_{l/s}^{1{,}852}
          $$

          y sale **Q₃ = 90,7 l/s**. Menos que los 108,4 que movía la bomba
          antes, y con razón: ahora tiene que empujar todo ese caudal por la
          tubería estrecha, y la altura necesaria sube de 32,95 a 39,4 m.

      - tipo: justificar
        pregunta: Ordena qué pasa con la bomba parada y las dos válvulas cerradas. Una pieza es falsa.
        piezas:
          - texto: 'El depósito F está en la cota 30 y el de aspiración A en la 0, y la tubería que los une sigue llena.'
          - texto: 'La bomba parada no crea pérdida adicional, y V1 y V2 cerradas no dejan pasar nada por el by-pass ni por la rama 2: el único camino es F, tubería 3, tubería 1, bomba, depósito A.'
          - texto: 'Los 30 m de desnivel se gastan enteros en las dos tuberías, y de ahí sale el caudal de retorno.'
          - texto: 'Salen 169,7 l/s, casi el doble de lo que la bomba conseguía impulsar en el mejor de los casos.'
          - texto: Con la bomba parada no puede circular nada, porque una bomba parada actúa como un tapón.
            trampa: true
            mensaje: |
              El enunciado dice expresamente que la bomba parada «no crea
              ninguna pérdida adicional», así que no tapona nada. Y aunque
              taponara algo, la gravedad seguiría empujando: por eso una
              instalación así lleva válvula de retención.
    resolucion: |
      ## Un by-pass no es un adorno

      La primera idea que hay que tener clara es que **la bomba y la
      instalación no mueven el mismo caudal**. La bomba impulsa Q; una parte
      se va por la tubería 1 hacia los depósitos y el resto vuelve a la
      aspiración por el by-pass. Regular con un by-pass, en vez de
      estrangulando la impulsión, es lo habitual cuando la bomba no admite
      variación de velocidad.

      ## a) Las dos válvulas

      **V₂** es la fácil, y sale sin tocar la bomba. Las tuberías 2 y 3 salen
      del mismo nudo y descargan en dos depósitos que están **a la misma
      cota**, así que tienen que perder lo mismo. La 3 es 15 m más larga:

      $$
      K_2\frac{V^{2}}{2g} = J_1(150)\,(50 - 35)\,40^{1{,}852} = 0{,}518\ \text{m} \;\Longrightarrow\; K_2 = 1{,}98
      $$

      Medio metro de columna, y con eso basta. **V₁** es otra historia. Antes
      hay que saber la altura de la bomba, y esa se obtiene subiendo desde los
      depósitos:

      $$
      B_D = 30 + 1{,}725 = 31{,}725 \qquad H = B_C = 31{,}725 + 1{,}227 = 32{,}95\ \text{m}
      $$

      $$
      Q_{bomba} = \frac{35\,000}{9800\cdot 32{,}95} = 108{,}4\ \text{l/s}
      $$

      De esos, 80 se van a los depósitos y **28,4 vuelven por el by-pass**. Y
      como el by-pass no tiene longitud ni desnivel, V₁ tiene que quemar los
      32,95 m ella sola:

      $$
      K_1 = \frac{32{,}95}{0{,}0417} = 791
      $$

      Un 791 frente a un 1,98. Esa desproporción no es un error de cálculo: es
      lo que cuesta frenar un caudal en un camino que no ofrece ninguna
      resistencia propia.

      ## b) El máximo a F

      Se consigue cerrando las dos válvulas: sin by-pass no vuelve nada y sin
      rama 2 no se desvía nada.

      $$
      \frac{35\,000}{9800\,Q} = 30 + \left[J_1(200)\cdot 40 + J_1(150)\cdot 50\right]Q^{1{,}852} \;\Longrightarrow\; Q_3 = 90{,}7\ \text{l/s}
      $$

      Fíjate en que es **menos** que los 108,4 que la bomba movía en el
      apartado a). No hay contradicción: allí buena parte del caudal daba una
      vuelta corta por el by-pass, que apenas cuesta altura; aquí todo tiene
      que subir 30 m y atravesar la tubería de 150. La altura necesaria pasa
      de 32,95 a 39,4 m, y a potencia constante más altura es menos caudal.

      ## c) La bomba parada, y los 170 l/s que vuelven

      Con V₁ y V₂ cerradas y la bomba parada sin crear pérdida, queda un único
      camino abierto: de F, por la tubería 3, por la 1, a través de la bomba,
      hasta A. Y ahí hay 30 m de desnivel a favor:

      $$
      30 = \left[J_1(200)\cdot 40 + J_1(150)\cdot 50\right]Q^{1{,}852} \;\Longrightarrow\; Q = 169{,}7\ \text{l/s}
      $$

      **Casi el doble de lo que la bomba conseguía impulsar en el mejor de los
      casos**, y en sentido contrario. La razón es sencilla: subiendo, los 30 m
      de desnivel se restan de lo que aporta la bomba; bajando, se suman a
      favor.

      Es el mismo final que el del petrolero del 6.18, y la misma moraleja:
      **una bomba parada no es un tapón.** Lo que impide el retorno es una
      válvula de retención, y por eso se ponen.

  - id: ejflu19-col617-el-llenado-del-camion-de-keroseno
    titulo: El llenado del camión de keroseno
    fuente: Ejercicio 6.17 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene una instalación de llenado de camiones de reparto de keroseno a
      partir de un depósito de almacenamiento, mediante el sistema de tuberías
      indicado en la figura. Se pide:

      **a)** Caudal circulante en la posición de la figura.

      **Datos:** Temperatura del keroseno = 20 ºC; peso específico relativo del
      keroseno = 0,77; longitud de la tubería = 25 m; diámetro = 100 mm;
      tubería de acero comercial.

      **Nota:** Se ha de utilizar el método de los factores de paso para
      calcular la pérdida de carga de las piezas especiales. Solo se tendrán en
      cuenta las piezas especiales resaltadas.

