        <line x1="548" y1="230" x2="548" y2="237" stroke="var(--faint)" stroke-width="1" marker-start="url(#m618n)" marker-end="url(#m618n)"/>
        <text x="556" y="224" font-size="10.5" fill="var(--faint)">1 m</text>
        <text x="548" y="290" text-anchor="middle" font-size="10" fill="var(--ink)">barco</text>
      </svg>
      <figcaption>El hidrocarburo tiene que subir del barco a la colina pasando por encima del depósito. La coronación del sifón está 25 m por encima del tramo horizontal y la lámina del barco, un metro por debajo.</figcaption>
      </figure>
    pide: El caudal trasvasado y qué pasa si se para la bomba con el depósito lleno hasta la cota 26.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué altura estática tiene que vencer la bomba?
        opciones:
          - texto: 26 m, los 25 que sube el sifón por encima del tramo horizontal más el metro que la lámina del barco está por debajo de él
            correcta: true
            mensaje: |
              Eso es. Las dos cotas se suman porque están a lados distintos del
              tramo horizontal. Y el apartado b) lo confirma al hablar de «la
              cota 26»: la coronación del sifón, medida desde la lámina del
              barco.
          - texto: 24 m, los 25 del sifón menos el metro del barco
            mensaje: |
              El metro del barco está **por debajo** del tramo horizontal, así
              que suma. Con 24 m el caudal saldría 46,6 l/s en vez de 43,8.
          - texto: 25 m, porque el metro del barco es la profundidad de la aspiración y no cuenta
            mensaje: |
              Sí cuenta, y de la misma forma que cualquier otro metro: la
              bomba tiene que subir el fluido desde donde está, y está un
              metro más abajo.

      - tipo: calcular
        titulo: El caudal trasvasado
        pregunta: |
          Caudal que trasvasa la bomba. El hidrocarburo tiene s = 0,86 y
          $\nu = 0{,}05$ St, y la tubería de fundición
          $\varepsilon = 0{,}026$ cm.
        respuesta:
          tipo: magnitud
          valor: '43.8 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '46.6 l/s'
            mensaje: |
              Has restado el metro del barco en vez de sumarlo. La altura
              estática son 26 m, no 24.
          - valor: '58.9 l/s'
            mensaje: |
              Has usado los 15 kW como potencia útil. Son la potencia
              consumida: al fluido solo le llegan
              $15\cdot 0{,}7 = 10{,}5$ kW.
        pista: |
          $L_{eq} = 150 + 3\cdot 5 + 25 = 190$ m. La bomba da
          $Hm = P_{util}/(Q\gamma)$ y la instalación pide
          $26 + (f\,L_{eq}/D + 1)V^{2}/2g$. Se itera.
        desarrollo: |
          La longitud equivalente total es

          $$
          L_{eq} = 150 + 3\cdot 5 + 25 = 190\ \text{m}
          $$

          La bomba entrega $P_{util} = 15\cdot 0{,}7 = 10{,}5$ kW, o sea
          $Hm = 10\,500/(Q\cdot 8428) = 1{,}246/Q$ metros de columna del
          hidrocarburo. La instalación pide

          $$
          Hm_i = 26 + \left(f\,\frac{190}{0{,}2} + 1\right)\frac{V^{2}}{2g}
          $$

          Iterando, con $\nu = 0{,}05\ \text{St} = 5\cdot 10^{-6}$ m²/s y
          $\varepsilon/D = 0{,}0013$: V = 1,396 m/s, $Re = 5{,}6\cdot 10^{4}$,
          f = 0,0245 y **Q = 43,8 l/s**.

      - tipo: calcular
        titulo: Cuánto se pierde por fricción
        pregunta: |
          Pérdida de carga total en la instalación, en ese punto de
          funcionamiento.
        respuesta:
          tipo: magnitud
          valor: '2.41 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m)
        distractores:
          - valor: '1.9 m'
            mensaje: |
              Te has dejado las longitudes equivalentes de las piezas. Los tres
              codos y la válvula suman 40 m, más de la cuarta parte de los
              150 m de tubería.
          - valor: '28.4 m'
            mensaje: |
              Esa es la altura que da la bomba, que incluye los 26 m de
              elevación. La pérdida de carga es solo la diferencia.
        pista: |
          $h_f = (f\,L_{eq}/D + 1)\,V^{2}/2g$, o directamente la altura de la
          bomba menos los 26 m de elevación.
        desarrollo: |
          $$
          h_f = \left(0{,}0245\cdot 950 + 1\right)\frac{1{,}396^{2}}{19{,}6} = 2{,}41\ \text{m}
          $$

          De los cuales 2,31 son la tubería con sus piezas y 0,10 la energía
          cinética que se pierde al descargar.

          Y aquí está lo que hay que ver: la bomba da 28,41 m, de los cuales
          **26 son elevación pura y solo 2,4 son fricción**. Esta instalación
          es lo contrario de un oleoducto: 190 m de tubería no pierden casi
          nada, y todo el trabajo es levantar el hidrocarburo.

      - tipo: justificar
        pregunta: Ordena qué pasa si se para la bomba con el depósito lleno hasta la cota 26. Una pieza es falsa.
        piezas:
          - texto: 'La coronación del sifón está en la cota 26 y la lámina del depósito acaba de llegar a esa misma cota, mientras la del barco sigue en la cota 0.'
          - texto: 'Sin bomba, la tubería es un sifón cebado que une dos láminas a 26 m de diferencia, y el líquido se mueve hacia la más baja.'
          - texto: 'Así que el hidrocarburo empieza a volver del depósito al barco, en sentido contrario al del trasvase.'
          - texto: 'Y sigue volviendo hasta que la lámina del depósito baja por debajo de la coronación y entra aire por el punto alto: el sifón se desceba y el flujo se corta solo.'
          - texto: Al parar la bomba el líquido se queda quieto, porque sin ella no hay nada que lo empuje.
            trampa: true
            mensaje: |
              Lo que lo empuja es la gravedad, y con 26 m de desnivel a favor
              tiene de sobra. Una bomba parada no es un tapón: si la tubería
              está cebada y hay desnivel, el líquido circula. Por eso a la
              salida de una bomba se pone una **válvula de retención**.
    resolucion: |
      ## Las dos cotas se suman

      Lo primero que hay que leer bien es la geometría. Los 25 m van del tramo
      horizontal de la tubería a la coronación del sifón, por encima del
      depósito; el metro del barco va del mismo tramo horizontal **hacia
      abajo**, hasta la lámina de la bodega. Están a lados distintos, así que
      se suman:

      $$
      \Delta z = 25 + 1 = 26\ \text{m}
      $$

      El propio enunciado lo confirma en el apartado b) al hablar de «la cota
      26»: es la coronación del sifón medida desde la lámina del barco.

      ## a) El caudal

      Las piezas se cuentan por longitud equivalente:

      $$
      L_{eq} = 150 + 3\cdot 5 + 25 = 190\ \text{m}
      $$

      Los tres codos y la válvula añaden 40 m a los 150 de tubería: un 27 %
      más. La bomba consume 15 kW y rinde el 70 %, así que entrega 10,5 kW al
      fluido:

      $$
      Hm_B = \frac{10\,500}{Q\cdot 0{,}86\cdot 9800} = \frac{1{,}246}{Q}
      $$

      y la instalación pide $26 + (950f + 1)V^{2}/2g$. Con
      $\nu = 0{,}05$ St $= 5\cdot 10^{-6}$ m²/s y
      $\varepsilon/D = 0{,}0013$, iterando sale

      $$
      V = 1{,}396\ \text{m/s} \qquad Re = 5{,}6\cdot 10^{4} \qquad f = 0{,}0245 \qquad \boxed{Q = 43{,}8\ \text{l/s}}
      $$

      ## Dónde va la energía

      | | m | % |
      |---|---|---|
      | elevación | 26,00 | 91,5 % |
      | fricción (tubería y piezas) | 2,31 | 8,1 % |
      | energía cinética de salida | 0,10 | 0,4 % |
      | **total** | **28,41** | |

      Compáralo con un oleoducto, donde la fricción es el 80 % y el desnivel
      el 20. Aquí es al revés, y por una razón sencilla: **190 metros de
      tubería no son nada.** Lo caro es subir.

      ## b) La bomba que se para, y el sifón que se da la vuelta

      Cuando la lámina del depósito llega a la cota 26 está exactamente a la
      altura de la coronación del sifón, mientras la del barco sigue en la
      cota 0. Si en ese instante se para la bomba, la tubería no se queda
      quieta: sigue siendo un sifón cebado que une dos láminas separadas 26 m,
      y **el líquido empieza a volver del depósito al barco**.

      Ese retorno dura hasta que la lámina del depósito baja por debajo de la
      coronación y entra aire por el punto alto. Ahí el sifón se desceba y el
      flujo se corta solo.

      Dicho de otro modo: se perdería parte del trasvase ya hecho, y la
      cantidad exacta dependería de la geometría del depósito. La forma de
      evitarlo es la de siempre —**una válvula de retención a la salida de la
      bomba**—, y ese es el motivo por el que se ponen: no para que la bomba
      funcione, sino para lo que pasa cuando deja de hacerlo.

  - id: ejflu19-col67-la-red-de-cuatro-tuberias-y-un-nudo
    titulo: La red de cuatro tuberías y un nudo
    fuente: Ejercicio 6.7 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Según la figura adjunta, donde $K_{boquilla} = 0{,}3$ y
      $D_{boquilla} = 75$ mm, se pide:

      **a)** Calcular Q₂, si un tubo de pitot colocado en el punto medio de la
      tubería 2 señala R₁ = 0,3 m y R₂ = 0,8 m.

      **b)** Sabiendo que un diafragma colocado en la tubería 3 tiene las
      siguientes características: $D_{orificio} = 100$ mm,
      $C_{orificio} = 0{,}8$, y que el manómetro diferencial con aire marca
      R = 0,85 m, calcular Q₃ y L₃.

      **c)** Si un caudalímetro electromagnético situado en 1 señala
      2400 l/min, calcular la potencia útil aportada por la bomba.

      **d)** Seleccionar el diámetro D₄, para poder asegurar el reparto de
      caudales, cuando la válvula G no cree pérdidas de carga adicionales.

      **e)** Calcular $h_f$ en la válvula G, para tener el reparto de caudales
      iniciales, con el D₄ seleccionado. ¿Cuál es la potencia perdida en esta
      válvula G?

      **Datos:** líquido, agua. Tuberías de fibrocemento.

      | tubería | D [mm] | L [m] |
      |---|---|---|
      | 1 | 175 | 500 |
      | 2 | 200 | 2100 |
      | 3 | 125 | ? |
      | 4 | ? | 1500 |

