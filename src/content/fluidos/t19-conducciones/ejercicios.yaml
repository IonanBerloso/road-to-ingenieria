    pide: Los cinco caudales, las cotas piezométricas de los dos nudos, la altura de la bomba y el diámetro que falta.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con cinco tuberías, dos nudos y un diámetro desconocido, ¿por dónde
          se entra?
        opciones:
          - texto: Por C, cuyo caudal está fijado en 25 l/s, y de ahí hacia atrás hasta la bomba
            correcta: true
            mensaje: |
              Eso es. Los 25 l/s de la tubería 5 son el único caudal conocido
              del sistema, y con ellos sale la cota de F, luego el caudal de la
              4, luego la de E, luego la bomba y por último el diámetro de la
              1. Cada paso da exactamente lo que necesita el siguiente.
          - texto: Por la bomba, calculando su altura con la potencia y el rendimiento
            mensaje: |
              La potencia útil sí se sabe —4,5 por 0,73—, pero la altura
              manométrica depende del caudal que trasiega, y ese caudal es
              incógnita. Con esa sola ecuación no se sale.
          - texto: Por A, que es el depósito más alto y por tanto el que manda
            mensaje: |
              A aporta, sí, pero su caudal depende del diámetro de la tubería
              1, que es precisamente lo que hay que calcular en el apartado d).
              Esa rama es la última que se resuelve, no la primera.
          - texto: Planteando las cinco ecuaciones a la vez y resolviendo el sistema
            mensaje: |
              Se puede, pero no hace falta: la red es **abierta** y el dato de
              partida está en un extremo, así que se recorre en cadena sin
              resolver ningún sistema. Ese es el regalo de este enunciado.

      - tipo: calcular
        titulo: La cota piezométrica de F
        pregunta: |
          Cota piezométrica del nudo F, en metros.
        respuesta:
          tipo: magnitud
          valor: '17.14 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '15 m'
            mensaje: |
              Esa es la cota de C. Para que lleguen 25 l/s hace falta que F
              esté por encima, justo lo que se pierde en los 600 m de la
              tubería 5.
          - valor: '12.86 m'
            mensaje: |
              Has restado la pérdida en vez de sumarla. El agua va de F a C, y
              el que pierde carga por el camino es el que la trae.
        pista: |
          La tubería 5 es la única con caudal conocido. Fibrocemento con
          200 mm da C = 130.
        desarrollo: |
          Fibrocemento tiene $\varepsilon = 0{,}01$ cm; con 200 mm queda
          $\varepsilon/D = 5\cdot 10^{-4}$, es decir **C = 130** en el cuadro
          nº 25, y $J_1 = 9{,}17\cdot 10^{-6}$.

          $$
          h_{f5} = 9{,}17\cdot 10^{-6}\cdot 600\cdot 25^{1{,}852} = 2{,}14\ \text{m}
          $$

          $$
          H_F = 15 + 2{,}14 = 17{,}14\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal que va a D
        pregunta: |
          Caudal que circula por la tubería 4, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '31.13 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '25 l/s'
            mensaje: |
              Has usado los 600 m de la tubería 5. Con la misma longitud
              saldría el mismo caudal, claro; pero la 4 mide 400 m, y al ser
              más corta con el mismo desnivel se lleva más agua.
          - valor: '56.12 l/s'
            mensaje: |
              Eso es la suma de las dos ramas, o sea lo que trae la tubería 3.
              La 4 solo lleva su parte.
        pista: |
          D y C están en la misma cota, así que las dos ramas parten del mismo
          desnivel; lo único que las diferencia es la longitud.
        desarrollo: |
          Las dos ramas salen de F, a 17,14 m, y llegan a la misma cota 15: las
          dos tienen 2,14 m de desnivel y los dos diámetros son de 200 mm. Lo
          único distinto es la longitud.

          $$
          Q_4 = \left(\frac{2{,}14}{9{,}17\cdot 10^{-6}\cdot 400}\right)^{1/1{,}852} = 31{,}13\ \text{l/s}
          $$

          Y ahí hay algo que conviene notar: la tubería 4 es un 33 % más corta
          y lleva un 25 % más de caudal. La pérdida no va con el caudal, sino
          con el caudal elevado a 1,852, así que las diferencias de longitud se
          traducen en diferencias de caudal **amortiguadas**.

      - tipo: calcular
        titulo: La cota piezométrica de E
        pregunta: |
          Cota piezométrica del nudo E, en metros.
        respuesta:
          tipo: magnitud
          valor: '27.71 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '30 m'
            mensaje: |
              Esa es la cota de A. E está por debajo, y lo que las separa es la
              pérdida de la tubería 1, que sale de 2,3 m — poca, pero no cero.
          - valor: '20.7 m'
            mensaje: |
              Has calculado la pérdida de la 3 con los 31,13 l/s de la tubería
              4. Por la 3 pasa **todo**, los 31,13 más los 25.
        pista: |
          Por la tubería 3 pasa la suma de las dos ramas, y son 1970 m de
          250 mm.
        desarrollo: |
          $$
          Q_3 = 31{,}13 + 25 = 56{,}13\ \text{l/s}
          $$

          Con 250 mm, $J_1 = 3{,}09\cdot 10^{-6}$:

          $$
          h_{f3} = 3{,}09\cdot 10^{-6}\cdot 1970\cdot 56{,}13^{1{,}852} = 10{,}57\ \text{m}
          $$

          $$
          H_E = 17{,}14 + 10{,}57 = 27{,}71\ \text{m}
          $$

          Casi once metros de los treinta disponibles se van en ese solo tramo.
          Es el más largo de los cinco y el que reúne todo el caudal — el
          candidato natural a engordarlo si algún día hay que ampliar la red.

      - tipo: calcular
        titulo: La altura manométrica de la bomba
        pregunta: |
          Altura manométrica de la bomba, en metros de columna de agua.
        respuesta:
          tipo: magnitud
          valor: '36 mca'
          tolerancia: 0.02
          formato: una altura con su unidad (mca o m)
        distractores:
          - valor: '49.4 mca'
            mensaje: |
              Has usado los 4,5 kW enteros. Esa es la potencia **absorbida**;
              la que llega al agua es el 73 % de ella.
          - valor: '27.71 mca'
            mensaje: |
              Esa es la cota de E. La bomba tiene que subir el agua desde la
              cota 0 hasta ahí **y además** vencer la pérdida de la tubería 2,
              que son otros 8,3 m.
        pista: |
          La potencia útil y el caudal están ligados por la altura, y la altura
          y el caudal por la tubería 2. Hay que resolver las dos a la vez.
        desarrollo: |
          La potencia útil es $4{,}5\cdot 0{,}73 = 3{,}285$ kW, y con ella

          $$
          H_b = \frac{P_{u}}{\gamma\,Q_2}
          $$

          Pero $Q_2$ también aparece en la pérdida de la tubería 2, que con
          100 mm da $J_1 = 2{,}68\cdot 10^{-4}$:

          $$
          H_b = 27{,}71 + 2{,}68\cdot 10^{-4}\cdot 500\cdot Q_2^{1{,}852}
          $$

          Igualando las dos expresiones sale $Q_2 = 9{,}30$ l/s y
          $H_b = 36{,}0$ mca, con 8,34 m de pérdida en la tubería 2.

          Esos 8,34 m en 500 metros son mucho: la tubería 2 es de 100 mm y por
          ella pasa poco caudal, pero el diámetro pequeño lo paga caro. De los
          36 m que da la bomba, casi la cuarta parte se queda en su propia
          tubería de impulsión.

      - tipo: calcular
        titulo: El diámetro de la tubería 1
        pregunta: |
          Diámetro comercial de la tubería 1, en milímetros.
        respuesta:
          tipo: magnitud
          valor: '350 mm'
          tolerancia: 0.02
          formato: una longitud con su unidad (mm)
        distractores:
          - valor: '250 mm'
            mensaje: |
              Has usado la cota de F en vez de la de E. La tubería 1 llega al
              nudo E, y el desnivel que la mueve son los 2,3 m que van de 30 a
              27,71.
          - valor: '370 mm'
            mensaje: |
              Has llevado por la 1 todo el caudal de la 3. Por la 1 pasa solo
              lo que viene de A, y la bomba aporta los otros 9,3 l/s.
        pista: |
          Por continuidad en E, la 1 trae lo que la 3 se lleva menos lo que
          aporta la bomba. Y el desnivel disponible es de A al nudo E.
        desarrollo: |
          $$
          Q_1 = 56{,}13 - 9{,}30 = 46{,}82\ \text{l/s} \qquad h_{f1} = 30 - 27{,}71 = 2{,}29\ \text{m}
          $$

          Despejando el diámetro de Hazen-Williams con C = 130 y 2850 m sale
          344,6 mm, y el comercial inmediato por encima es **350 mm**.

          Fíjate en el número: **2,29 m de pérdida en 2850 metros**, menos de un
          milímetro por metro. Es una tubería casi horizontal en términos de
          carga, y por eso hace falta que sea tan gruesa.

      - tipo: justificar
        pregunta: Ordena cómo queda la línea piezométrica del apartado e). Una pieza es falsa.
        piezas:
          - texto: 'Arranca en 30, la lámina de A, y baja suavemente hasta 27,71 en el nudo E: solo 2,29 m en 2850.'
          - texto: 'De B, en la cota 0, la bomba la sube de golpe hasta 36 m, y la tubería 2 la deja también en 27,71 al llegar a E.'
          - texto: 'Del nudo E al F cae de 27,71 a 17,14, diez metros y medio: es el tramo que más se come.'
          - texto: 'Y de F salen dos ramas que bajan las dos a 15, la de D y la de C, cada una con sus 2,14 m.'
          - texto: La línea piezométrica de la tubería 2 empieza en 36 m y sube hasta E, porque la bomba impulsa hacia arriba.
            trampa: true
            mensaje: |
              La línea piezométrica **nunca sube** siguiendo el flujo, salvo
              donde hay una máquina. El salto vertical está en la bomba; de ahí
              en adelante, por la tubería 2, la línea baja de 36 a 27,71. Que
              el agua suba de cota no significa que suba su carga.
    resolucion: |
      ## Una red que se lee al revés

      Este enunciado parece más difícil de lo que es. Hay cinco tuberías, dos
      nudos, una bomba y un diámetro desconocido, y sin embargo **no hay que
      resolver ningún sistema de ecuaciones**: basta con recorrer la red de
      atrás hacia delante.

      El motivo es que la red es abierta y el único caudal conocido —los 25 l/s
      que se quieren en C— está en un extremo. Desde ahí, cada cálculo entrega
      exactamente lo que pide el siguiente:

      | paso | de qué sale | qué da |
      |---|---|---|
      | 1 | los 25 l/s de la 5 | la cota de F, 17,14 |
      | 2 | la cota de F | el caudal de la 4, 31,13 |
      | 3 | los dos caudales | la cota de E, 27,71 |
      | 4 | la cota de E y la potencia | la bomba, 36 mca, y Q2 = 9,3 |
      | 5 | la continuidad en E | Q1 = 46,82 y el diámetro, 350 mm |

      ## a) y b) La cadena, tramo a tramo

      Todas las tuberías son de fibrocemento y todas caen en la banda de
      **C = 130**.

      $$
      h_{f5} = 9{,}17\cdot 10^{-6}\cdot 600\cdot 25^{1{,}852} = 2{,}14\ \text{m} \;\Longrightarrow\; H_F = 17{,}14\ \text{m}
      $$

      D está en la misma cota que C, así que la rama 4 arranca del mismo
      desnivel de 2,14 m y solo se diferencia en la longitud: 400 m contra 600.

      $$
      Q_4 = 31{,}13\ \text{l/s} \qquad Q_3 = 56{,}13\ \text{l/s}
      $$

      $$
      h_{f3} = 10{,}57\ \text{m} \;\Longrightarrow\; H_E = 27{,}71\ \text{m}
      $$

      ## c) La bomba, donde sí hay que iterar

      Aquí aparece la única ecuación implícita del problema. La potencia útil
      es fija —3,285 kW— pero se reparte entre altura y caudal, y el caudal
      determina la pérdida de la tubería 2:

      $$
      \frac{3285}{\gamma\,Q_2} = 27{,}71 + 2{,}68\cdot 10^{-4}\cdot 500\cdot Q_2^{1{,}852}
      $$

      Sale $Q_2 = 9{,}30$ l/s con $H_b = 36{,}0$ mca. De esos 36 metros, 27,71
      son para llegar a la cota piezométrica del nudo y **8,34 se pierden en
      los 500 m de la propia tubería de impulsión**, que es de 100 mm. Casi la
      cuarta parte de lo que da la bomba se queda en el camino más corto de la
      red.

      ## d) El diámetro que falta

      $$
      Q_1 = 56{,}13 - 9{,}30 = 46{,}82\ \text{l/s} \qquad h_{f1} = 2{,}29\ \text{m}
      $$

      2,29 metros de pérdida en 2850 de tubería. Despejando, 344,6 mm, y el
      comercial es **350 mm**.

      El contraste con la tubería 2 es la lección del problema. La 1 lleva
      cinco veces más caudal que la 2, es casi seis veces más larga, y aun así
      pierde casi cuatro veces menos: 2,29 m contra 8,34. La diferencia está
      entera en el diámetro —350 mm contra 100—, y en Hazen-Williams el
      diámetro entra elevado a 4,87. **Multiplicar el diámetro por tres y medio
      divide la pérdida por más de cuatrocientos.**

      ## e) La línea piezométrica

      Arranca en 30 en A y baja apenas dos metros y pico hasta E. Del lado de
      B, la bomba la levanta de 0 a 36 y la tubería 2 se come 8,34 hasta llegar
      también a 27,71: las dos ramas **tienen que juntarse en el mismo punto**,
      porque el nudo es uno solo. De E a F cae diez metros y medio, y de F
      salen dos ramas que bajan las dos a 15.

      El único tramo donde la línea sube es la bomba, y sube en vertical. En
      todo lo demás baja, siempre, y esa es la comprobación de que un dibujo de
      línea piezométrica está bien hecho.
