      <figcaption>El depósito descarga por gravedad sobre el camión, que está cuatro metros más abajo. Las piezas resaltadas en rojo son las únicas que cuentan, y los tres codos comerciales están repartidos por el recorrido.</figcaption>
      </figure>
    pide: El caudal de keroseno que llena el camión con la válvula en la posición de la figura.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde interviene el peso específico relativo 0,77 del keroseno?
        opciones:
          - texto: En ningún sitio del cálculo del caudal; lo que sí importa del keroseno es su viscosidad
            correcta: true
            mensaje: |
              Eso es. En una descarga por gravedad de la atmósfera a la
              atmósfera, la ecuación de la energía se escribe en metros de
              columna del propio líquido y la densidad se cancela en todos los
              términos. Lo que no se cancela es la viscosidad, que entra por el
              Reynolds y decide el factor de fricción.
          - texto: En la altura disponible, que pasa a ser 4 por 0,77
            mensaje: |
              Eso sería si midieras la energía en metros de agua. Se mide en
              metros de columna de keroseno, y entonces los cuatro metros de
              desnivel son cuatro metros de carga, sin corregir.
          - texto: En los factores de paso de las piezas especiales
            mensaje: |
              Los K son adimensionales y no dependen del fluido: solo de la
              geometría de la pieza. Por eso el cuadro nº 24 no pregunta qué
              circula.
          - texto: En el número de Reynolds, junto con la viscosidad
            mensaje: |
              Cuidado con cuál. En el Reynolds entra la viscosidad
              **cinemática**, que ya lleva la densidad dentro. Aquí se lee
              directamente del ábaco nº 5, así que el 0,77 no se usa ni ahí.

      - tipo: calcular
        titulo: La suma de factores de paso
        pregunta: |
          Suma de los factores de paso K de las piezas resaltadas.
        respuesta:
          tipo: numero
          valor: '3.49'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1.24'
            mensaje: |
              Te has dejado los tres codos. Cada codo comercial de radio medio
              vale 0,75, y son tres.
          - valor: '2.49'
            mensaje: |
              Falta el orificio de borda, que vale 1. Es la pieza más cara de
              las cuatro y la más fácil de pasar por alto porque no parece una
              pieza.
          - valor: '4.49'
            mensaje: |
              Has metido dentro de la suma el término de energía cinética. Ese
              no es un factor de paso: es la energía que el chorro se lleva al
              salir, y va aparte en la ecuación.
        pista: |
          Cuadro nº 24. El orificio de borda es una salida de depósito, la
          válvula esférica está tabulada por su ángulo y los codos comerciales
          de radio medio tienen un valor fijo.
        desarrollo: |
          Del cuadro nº 24:

          | pieza | K |
          |---|---|
          | orificio de borda | 1 |
          | válvula de compuerta abierta | 0,19 |
          | válvula esférica a 5º | 0,05 |
          | tres codos comerciales de radio medio | 3 · 0,75 = 2,25 |
          | **suma** | **3,49** |

          Los dos que más pesan son los que menos lo parecen: el orificio de
          borda vale él solo más que las dos válvulas juntas, y los tres codos
          valen cinco veces la compuerta.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Caudal circulante, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '22.5 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '28.5 l/s'
            mensaje: |
              Has dejado fuera las piezas especiales. Solo con la fricción de
              los 25 m saldría eso, un 27 % de más: en una instalación corta y
              llena de accesorios, las piezas no son un detalle.
          - valor: '23.7 l/s'
            mensaje: |
              Te falta el término de energía cinética. El chorro sale del tubo
              a 2,86 m/s y se lleva esa energía; los cuatro metros se reparten
              entre las pérdidas **y** esa velocidad.
          - valor: '21.2 l/s'
            mensaje: |
              Has usado 1,13, que es el codo **brusco** de 90º. Los del
              enunciado son comerciales de radio medio, y esos valen 0,75.
        pista: |
          El caudal es incógnita y el factor de fricción depende de él, así que
          hay que iterar. Se supone una f, se saca la velocidad y se recalcula.
        desarrollo: |
          Del ábaco nº 5, queroseno a 20 ºC:
          $\nu = 2{,}5\cdot 10^{-6}$ m²/s. Del cuadro nº 20, acero comercial:
          $\varepsilon = 0{,}006$ cm, y con D = 100 mm queda
          $\varepsilon/D = 6\cdot 10^{-4}$.

          La ecuación de la energía entre la superficie libre y la salida al
          camión, las dos a la atmósfera:

          $$
          4 = \left(1 + \sum K + f\,\frac{L}{D}\right)\frac{v^{2}}{2g}
          $$

          Iterando: con $v = 2{,}86$ m/s el Reynolds vale 114 400 y Colebrook
          da $f = 0{,}0204$, de modo que $fL/D = 5{,}10$. Entonces

          $$
          v = \sqrt{\frac{2\cdot 9{,}8\cdot 4}{1 + 3{,}49 + 5{,}10}} = 2{,}86\ \text{m/s}
          $$

          y la iteración ya no se mueve.

          $$
          Q = 2{,}86\cdot \frac{\pi\,0{,}1^{2}}{4} = 0{,}0225\ \text{m}^{3}/\text{s} = 22{,}5\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena en qué se van los cuatro metros de carga. Una pieza es falsa.
        piezas:
          - texto: 'La fricción de los 25 m de tubería se lleva 2,13 m, algo más de la mitad.'
          - texto: 'Las cuatro piezas especiales se llevan 1,46 m entre todas.'
          - texto: 'Y los 0,42 m que quedan no son una pérdida: son la energía cinética con la que el chorro entra en el camión.'
          - texto: 'Sumados, 2,13 más 1,46 más 0,42 dan los cuatro metros de partida.'
          - texto: Las piezas especiales pesan más que la tubería, porque son cuatro y la tubería solo mide 25 m.
            trampa: true
            mensaje: |
              Suena razonable y es falso, y conviene comprobarlo con los
              números en vez de con la intuición. La tubería se lleva 2,13 m
              y las piezas 1,46: la tubería gana. Lo que sí es cierto es que
              las piezas equivalen a 17 m más de tubería, que en una
              instalación de 25 m es muchísimo — pero «muchísimo» no es «la
              mayor parte».
    resolucion: |
      ## Un problema donde la mitad del dato sobra

      El enunciado da la temperatura del keroseno, su peso específico relativo,
      la longitud, el diámetro y el material. De todo eso, **el peso específico
      no se usa**. Merece la pena entender por qué antes de calcular nada.

      La instalación descarga de la atmósfera —la superficie libre del
      depósito— a la atmósfera —el chorro que entra en el camión—. Al escribir
      la ecuación de la energía en metros de columna del propio líquido, la
      presión se va porque es la misma arriba y abajo, y la densidad se va
      porque divide a todos los términos por igual. Quedan cuatro metros de
      desnivel, y da lo mismo que dentro haya keroseno, agua o mercurio.

      Lo que **no** da lo mismo es la viscosidad, y ahí sí entra el keroseno: a
      20 ºC su viscosidad cinemática es $2{,}5\cdot 10^{-6}$ m²/s, unas dos
      veces y media la del agua. Eso baja el Reynolds y sube algo la fricción.

      ## Las piezas, que aquí mandan

      La instalación mide 25 m. Con esa longitud, las piezas especiales dejan
      de ser una corrección y pasan a ser la mitad del problema:

      | pieza | K |
      |---|---|
      | orificio de borda | 1 |
      | válvula de compuerta abierta | 0,19 |
      | válvula esférica a 5º | 0,05 |
      | tres codos comerciales de radio medio | 2,25 |
      | **suma** | **3,49** |

      Los 3,49 equivalen a $3{,}49\,D/f = 17$ m de tubería recta, es decir a
      **dos tercios más de instalación**. Y el reparto sorprende: el orificio
      de borda, que ni siquiera parece una pieza, vale más que las dos válvulas
      juntas; y la válvula esférica abierta a 5º, con K = 0,05, es
      prácticamente transparente. Basta con cerrarla hasta los 15º para que su
      K pase a 0,75 y valga ella sola lo que los tres codos.

      ## El cálculo, que hay que iterar

      $$
      4 = \left(1 + 3{,}49 + f\,\frac{25}{0{,}1}\right)\frac{v^{2}}{2g}
      $$

      El factor de fricción depende de la velocidad y la velocidad depende del
      factor de fricción, así que se supone una y se corrige. Con
      $\varepsilon/D = 6\cdot 10^{-4}$ y Reynolds del orden de $10^{5}$,
      Colebrook da $f = 0{,}0204$, y de ahí

      $$
      v = 2{,}86\ \text{m/s} \qquad Q = 22{,}5\ \text{l/s}
      $$

      A ese caudal, llenar una cisterna de 20 m³ lleva un cuarto de hora largo.

      ## Dónde se van los cuatro metros

      | concepto | metros | del total |
      |---|---|---|
      | fricción en los 25 m | 2,13 | 53 % |
      | las cuatro piezas especiales | 1,46 | 37 % |
      | energía cinética del chorro | 0,42 | 10 % |

      Esa última fila es la que más se olvida, y no es una pérdida: es energía
      que el líquido se lleva puesta al salir del tubo. Si el enunciado hubiera
      dicho que la tubería termina sumergida en el camión, ese término seguiría
      estando, pero como pérdida de entrada a depósito — con K = 1, exactamente
      el mismo número. Es una de esas coincidencias que conviene entender y no
      memorizar.

  - id: ejflu19-col625-el-riego-y-el-sobrepresor-que-se-reparten-el-deposito
    titulo: El riego y el sobrepresor que se reparten el depósito
    fuente: Ejercicio 6.25 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Una fábrica es abastecida de agua a partir de un depósito D situado en la
      cota 231. La tubería de suministro tiene una longitud de 730 m hasta el
      nudo N, donde se bifurca en dos, una para abastecer a un sistema de riego
      formado por doce boquillas situadas en paralelo y la otra para introducir
      el agua en un depósito presurizado. La tubería que suministra agua al
      riego —NR— tiene una longitud de 500 m y la del sobrepresor —NS— 200 m.
      La cota de salida del riego es la 193 y la del sobrepresor la 167. Cada
      boquilla tiene un diámetro de salida de 20 mm y se desea salga por cada
      una un caudal de 5 l/s. La presión del depósito presurizado es de 35 mca;
      el diámetro de la tubería NR es 200 mm y el de la NS 150 mm. Se supondrán
      despreciables la pérdida de carga del colector que suministra agua a las
      boquillas y la energía cinética en las tuberías. Con todo lo anterior se
      pide:

      **a)** Esquema de la instalación con las correspondientes líneas
      piezométricas, indicando las cotas de los puntos singulares.

      **b)** Caudal que llegará al sobrepresor.

      **c)** Diámetro de la tubería de suministro DN.

      **Notas:** Las tuberías son de fibrocemento.

