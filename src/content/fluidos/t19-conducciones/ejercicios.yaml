        <text x="508" y="356" font-size="11.5" fill="var(--ink)">N</text>
        <text x="200" y="332" font-size="10" fill="var(--faint)">L1 = 500 m · D1 = 200 mm</text>
        <text x="410" y="272" font-size="10" fill="var(--faint)">L2 = 200 m</text>
        <text x="410" y="285" font-size="10" fill="var(--faint)">D2 = 150 mm</text>
        <text x="556" y="234" font-size="10" fill="var(--faint)">L3 = 700 m</text>
        <text x="556" y="247" font-size="10" fill="var(--faint)">D3 = 250 mm</text>
        <line x1="36" y1="150" x2="36" y2="340" stroke="var(--faint)" stroke-width="1" marker-start="url(#m621)" marker-end="url(#m621)"/>
        <line x1="32" y1="150" x2="56" y2="150" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="32" y1="340" x2="111" y2="340" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="30" y="248" text-anchor="end" font-size="10" fill="var(--faint)">40 m</text>
        <line x1="626" y1="90" x2="626" y2="340" stroke="var(--faint)" stroke-width="1" marker-start="url(#m621)" marker-end="url(#m621)"/>
        <line x1="604" y1="90" x2="630" y2="90" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="504" y1="340" x2="630" y2="340" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="634" y="220" font-size="10" fill="var(--faint)">50 m</text>
      </svg>
      <figcaption>Tres depósitos abiertos que se juntan en un nudo. La figura no dice hacia dónde va el agua en cada tubería, y averiguarlo es la mitad del problema.</figcaption>
      </figure>
    pide: Los tres caudales con su sentido, la cota que anularía la tubería 3 y la cota de B que llevaría 10 l/s hacia el depósito.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada, ¿qué se puede afirmar de los sentidos con
          solo mirar las tres cotas?
        opciones:
          - texto: Que C aporta y que B recibe; lo único por decidir es qué hace A
            correcta: true
            mensaje: |
              Exacto. La cota piezométrica del nudo no puede estar por encima
              del depósito más alto ni por debajo del más bajo, así que C
              —el de 50— aporta seguro y B —el de 25— recibe seguro. A, que
              está en medio, puede hacer cualquiera de las dos cosas, y eso es
              lo que hay que averiguar.
          - texto: Que C aporta y que A y B reciben, porque C es el más alto
            mensaje: |
              Es lo que acaba pasando, pero **no se sabe de antemano**. Si la
              tubería 1 fuera muy corta o la 3 muy larga, el nudo podría
              quedarse por debajo de 40 y entonces A aportaría también. Hay que
              comprobarlo.
          - texto: Que A y C aportan y B recibe, porque los dos están por encima de B
            mensaje: |
              Estar por encima de B no basta: lo que decide el sentido en la
              tubería 1 es la comparación de A con el **nudo**, no con B.
          - texto: No se puede afirmar nada sin calcular los tres caudales
            mensaje: |
              Dos de los tres sí se pueden. El nudo está siempre entre la cota
              más alta y la más baja, así que el extremo superior aporta y el
              inferior recibe. Eso ya reduce el problema a un solo signo.

      - tipo: calcular
        titulo: La cota piezométrica del nudo
        pregunta: |
          Cota piezométrica del nudo N, en metros.
        respuesta:
          tipo: magnitud
          valor: '41.52 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '40 m'
            mensaje: |
              Has supuesto que por la tubería 1 no circula nada. Compruébalo:
              con el nudo en 40, la 3 traería 95,2 l/s y la 2 solo podría
              llevarse 60,9. Sobran 34 l/s, y esos son los que se van hacia A.
          - valor: '38.33 m'
            mensaje: |
              Eso es la media de las tres cotas, y el nudo no tiene por qué
              estar ahí. Su posición la fija la continuidad, que depende de las
              longitudes y los diámetros, no solo de las alturas.
        pista: |
          Se tantea la cota del nudo hasta que los caudales sumen cero. Con
          fibrocemento y estos diámetros, C = 130 en las tres tuberías.
        desarrollo: |
          Fibrocemento tiene $\varepsilon = 0{,}01$ cm, así que
          $\varepsilon/D$ vale entre $4\cdot 10^{-4}$ y $6{,}7\cdot 10^{-4}$ en
          las tres tuberías: **C = 130** para todas, según el cuadro nº 25.

          | tubería | J1 |
          |---|---|
          | 1 (200 mm) | 9,17·10⁻⁶ |
          | 2 (150 mm) | 3,72·10⁻⁵ |
          | 3 (250 mm) | 3,09·10⁻⁶ |

          Se tantea la cota del nudo $H_N$ hasta que

          $$
          Q_3 = Q_1 + Q_2
          $$

          Con $H_N = 41{,}52$ m salen 87,1 l/s bajando de C y 23,0 y 64,1
          subiendo hacia A y hacia B. Cierra.

          El nudo queda **por encima de A**, y por eso el depósito de en medio
          recibe agua en lugar de darla.

      - tipo: calcular
        titulo: El caudal que baja de C
        pregunta: |
          Caudal que circula por la tubería 3, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '87.1 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '95.2 l/s'
            mensaje: |
              Ese es el caudal con el nudo en la cota 40, es decir suponiendo
              que la tubería 1 no lleva nada. El nudo está algo más arriba,
              en 41,52, y con menos desnivel baja menos agua.
          - valor: '69.8 l/s'
            mensaje: |
              Has resuelto C contra B como si la tubería 1 no existiera, en
              serie de 700 más 200 m. Pero la 1 también se lleva su parte, y al
              hacerlo baja la carga del nudo y **aumenta** lo que viene de C.
        pista: |
          Con la cota del nudo ya conocida, cada tubería se resuelve por
          separado con su desnivel.
        desarrollo: |
          $$
          Q_3 = \left(\frac{50 - 41{,}52}{3{,}09\cdot 10^{-6}\cdot 700}\right)^{1/1{,}852} = 87{,}1\ \text{l/s}
          $$

          Y los otros dos, con el nudo por encima de las dos láminas:

          $$
          Q_1 = \left(\frac{41{,}52 - 40}{9{,}17\cdot 10^{-6}\cdot 500}\right)^{1/1{,}852} = 23{,}0\ \text{l/s}
          $$

          $$
          Q_2 = \left(\frac{41{,}52 - 25}{3{,}72\cdot 10^{-5}\cdot 200}\right)^{1/1{,}852} = 64{,}1\ \text{l/s}
          $$

          y en efecto $23{,}0 + 64{,}1 = 87{,}1$.

      - tipo: calcular
        titulo: La cota que anularía la tubería 3
        pregunta: |
          Cota piezométrica que debería tener C para que no circulara caudal
          por la tubería 3, en metros.
        respuesta:
          tipo: magnitud
          valor: '34.28 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '32.5 m'
            mensaje: |
              Eso es la media de 40 y 25. El nudo se coloca donde la
              continuidad lo pone, y la tubería 2 es mucho más corta y estrecha
              que la 1: no reparten a partes iguales.
          - valor: '30.72 m'
            mensaje: |
              Has intercambiado las dos tuberías. La 1 es la de A —500 m y
              200 mm— y la 2 la de B —200 m y 150 mm—.
        pista: |
          Si la 3 no lleva nada, el sistema se reduce a A y B en serie a través
          del nudo, y la cota de C tiene que ser exactamente la del nudo.
        desarrollo: |
          Sin caudal en la 3, todo lo que sale de A entra en B:

          $$
          \left(\frac{40 - H_N}{9{,}17\cdot 10^{-6}\cdot 500}\right)^{1/1{,}852} = \left(\frac{H_N - 25}{3{,}72\cdot 10^{-5}\cdot 200}\right)^{1/1{,}852}
          $$

          y sale $H_N = 34{,}28$ m, con 46,9 l/s pasando de A a B. Para que la
          tubería 3 no lleve nada, C tiene que estar exactamente en esa cota
          piezométrica: **34,28 m**.

      - tipo: calcular
        titulo: La cota de B para llevarle 10 l/s
        pregunta: |
          Cota que debería tener B para que la tubería 2 llevara 10 l/s hacia
          el depósito, en metros.
        respuesta:
          tipo: magnitud
          valor: '45.46 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '40.99 m'
            mensaje: |
              Has usado la cota del nudo del apartado a). Al subir B cambia
              todo el reparto: la 2 se lleva mucho menos, la 1 tiene que
              tragarse el resto y el nudo sube de 41,52 a 45,99.
          - valor: '25.53 m'
            mensaje: |
              Le has sumado la pérdida a la cota actual de B sin rehacer el
              nudo. Subir B a 25,53 no reduce su caudal de 64 a 10.
        pista: |
          Con Q2 = 10 l/s hacia B, la continuidad en el nudo solo involucra a
          la 1 y la 3, y de ahí sale su cota. La de B es esa menos la pérdida
          de la 2.
        desarrollo: |
          Con 10 l/s fijados en la 2, la continuidad del nudo queda

          $$
          Q_3(50 \to H_N) = Q_1(H_N \to 40) + 10
          $$

          una sola ecuación con una sola incógnita, que da $H_N = 45{,}99$ m
          —con 58,1 l/s bajando de C y 48,1 subiendo hacia A—. La pérdida de la
          tubería 2 con 10 l/s es pequeñísima:

          $$
          h_{f2} = 3{,}72\cdot 10^{-5}\cdot 200\cdot 10^{1{,}852} = 0{,}53\ \text{m}
          $$

          $$
          z_B = 45{,}99 - 0{,}53 = 45{,}46\ \text{m}
          $$

          Fíjate en el tamaño de esa pérdida: **medio metro en veinte metros de
          subida de cota**. Cuando el caudal baja de 64 a 10 l/s, la pérdida se
          divide por treinta y uno, y la tubería deja de contar.

      - tipo: justificar
        pregunta: Ordena por qué el resultado del apartado b) no se puede conseguir. Una pieza es falsa.
        piezas:
          - texto: 'C es un depósito abierto, así que su cota piezométrica es la de su lámina libre y nada más.'
          - texto: 'Para que la 3 no lleve nada, esa lámina tendría que estar en 34,28 m en vez de en 50.'
          - texto: 'Serían 15,72 m de vaciado, y C pasaría a estar por debajo de A, que está en 40.'
          - texto: 'Es decir, no se consigue tocando C: manteniéndolo como está, la 3 siempre lleva caudal.'
          - texto: Bastaría con cerrar una válvula en la tubería 3 para dejar su cota piezométrica en 34,28 m.
            trampa: true
            mensaje: |
              Una válvula cerrada sí anula el caudal, pero no cambia la cota
              piezométrica de C, que sigue siendo su lámina en 50. Lo que pide
              el apartado es la **cota de C**, y una válvula no la mueve: lo
              que hace es meter una pérdida entre C y el nudo. Son dos cosas
              distintas y el enunciado pregunta por la primera.
    resolucion: |
      ## El problema clásico de los tres depósitos

      Tres láminas libres, tres tuberías y un nudo. Lo que lo hace distinto de
      una red cualquiera es que **no se sabe de antemano hacia dónde va el agua
      en una de las tres ramas**, y no se puede empezar a calcular sin
      decidirlo.

      Dos de los tres sentidos sí se saben sin cuentas. La cota piezométrica
      del nudo tiene que quedar entre la más alta y la más baja de las tres
      —si estuviera por encima de todas, el agua saldría de la nada, y si
      estuviera por debajo, desaparecería—. Así que **C, el de 50, aporta; B,
      el de 25, recibe**. El que no se sabe es A, y ahí está el problema.

      ## a) Tantear el nudo

      Fibrocemento en los tres tramos, con $\varepsilon/D$ entre
      $4\cdot 10^{-4}$ y $6{,}7\cdot 10^{-4}$: C = 130 para las tres. Se prueba
      una cota del nudo y se mira si los caudales cierran.

      Con $H_N = 41{,}52$ m:

      | tubería | desnivel | caudal | sentido |
      |---|---|---|---|
      | 3 (C, 700 m, 250 mm) | 8,48 m | 87,1 l/s | de C al nudo |
      | 1 (A, 500 m, 200 mm) | 1,52 m | 23,0 l/s | del nudo a A |
      | 2 (B, 200 m, 150 mm) | 16,52 m | 64,1 l/s | del nudo a B |

      El nudo queda **por encima de A**, así que A recibe. Y merece la pena ver
      por qué: con el nudo justo en la cota de A —el caso en que la 1 no
      llevaría nada— la 3 traería 95,2 l/s y la 2 solo podría llevarse 60,9.
      Sobrarían 34 l/s, y el sistema no tiene otro sitio donde meterlos que la
      tubería 1. Esa comprobación de una línea vale más que el tanteo entero.

      Fíjate también en el desnivel de la 1: **metro y medio**. Con
      quinientos metros de tubería de 200 mm, metro y medio bastan para mover
      23 l/s. Los otros 16,5 m de desnivel se los come la tubería 2, que es
      corta pero estrecha.

      ## b) La cota que anularía la tubería 3, y por qué no vale

      Si la 3 no lleva nada, el sistema es A → nudo → B, en serie:

      $$
      H_N = 34{,}28\ \text{m} \qquad Q = 46{,}9\ \text{l/s de A a B}
      $$

      Para que la 3 esté parada, C tiene que tener exactamente esa cota
      piezométrica. Y ahí está el «no»: C es un **depósito abierto**, de modo
      que su cota piezométrica es su lámina libre. Habría que vaciarlo 15,72 m,
      y entonces C dejaría de ser el depósito alto del sistema —quedaría por
      debajo de A—. No es un ajuste, es otra instalación.

      La tentación es responder «pues se cierra una válvula». Anula el caudal,
      sí, pero no es lo que se pregunta: una válvula introduce una pérdida
      entre C y el nudo, no cambia la cota de C.

      ## c) Subir B veinte metros

      Ahora se fija el caudal de la 2 en 10 l/s hacia B y se pregunta dónde
      tiene que estar B. La clave es que con el caudal de la 2 conocido, la
      continuidad del nudo queda con una sola incógnita:

      $$
      Q_3(50 \to H_N) = Q_1(H_N \to 40) + 10 \;\Longrightarrow\; H_N = 45{,}99\ \text{m}
      $$

      $$
      z_B = 45{,}99 - h_{f2} = 45{,}99 - 0{,}53 = 45{,}46\ \text{m}
      $$

      Es decir, hay que subir B **más de veinte metros**, de 25 a 45,46, para
      bajarle el caudal de 64 a 10 l/s. Y de esos veinte metros y medio, la
      pérdida de la tubería solo explica medio; el resto es cota pura.

      Esa es la moraleja del apartado. En Hazen-Williams la pérdida va con
      $Q^{1{,}852}$, así que dividir el caudal por 6,4 divide la pérdida por
      31: **el caudal no se regula con la tubería, se regula con la cota**.

