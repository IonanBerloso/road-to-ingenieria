        <text x="150" y="228" text-anchor="middle" font-size="11" fill="var(--ink)">conducto E</text>
        <path d="M250,170 V240 H310 V90" fill="none" stroke="var(--alt)" stroke-width="8" opacity="0.55"/>
        <path d="M86,200 H100 V120 H250 V170" fill="none" stroke="var(--live)" stroke-width="8" opacity="0.35"/>
        <path d="M86,200 H100 V120 H250 V240 H310 V60" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="318" y="52" font-size="10" fill="var(--faint)">abierto a la atmósfera</text>
        <text x="326" y="256" font-size="10" fill="var(--alt)">mercurio</text>
        <line x1="316" y1="240" x2="330" y2="250" stroke="var(--alt)" stroke-width="1"/>
        <line x1="206" y1="170" x2="244" y2="170" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="212" y1="170" x2="212" y2="200" stroke="var(--faint)" stroke-width="1" marker-start="url(#m67n)" marker-end="url(#m67n)"/>
        <text x="220" y="188" font-size="11" fill="var(--faint)">R1</text>
        <line x1="250" y1="170" x2="360" y2="170" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="310" y1="90" x2="360" y2="90" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="352" y1="90" x2="352" y2="170" stroke="var(--faint)" stroke-width="1" marker-start="url(#m67n)" marker-end="url(#m67n)"/>
        <text x="360" y="134" font-size="11" fill="var(--faint)">R2</text>
      </svg>
      <figcaption>El detalle del conducto E. La boca del pitot mira a la corriente; el mercurio del manómetro queda por encima del eje del conducto, y la rama de la derecha está abierta.</figcaption>
      </figure>
    pide: El caudal de la boquilla, la longitud de la tubería 3, la potencia de la bomba, el diámetro de la 4 y la pérdida que hay que meter en la válvula G.
    pasos:
      - tipo: reconocer
        pregunta: |
          El tubo de pitot del punto E, ¿qué mide exactamente?
        opciones:
          - texto: La energía total del flujo en ese punto, presión estática más altura cinética
            correcta: true
            mensaje: |
              Eso es. La boca del pitot mira a la corriente y detiene el fluido
              contra ella, así que lee $p_E/\gamma + V_E^{2}/2g$. Un
              piezómetro, con la toma a ras de pared, leería solo
              $p_E/\gamma$.
          - texto: Solo la presión estática, porque la toma está dentro del conducto
            mensaje: |
              Lo que decide no es estar dentro, sino la orientación: una toma
              **perpendicular** a la corriente lee la estática y una toma
              **enfrentada** a ella lee la total. Aquí la boca mira aguas
              arriba.
          - texto: Solo la altura cinética, que es lo que aporta el movimiento
            mensaje: |
              Para tener solo la cinética habría que restar dos lecturas: la de
              un pitot y la de un piezómetro. Un pitot solo da la suma.

      - tipo: calcular
        titulo: El caudal de la boquilla
        pregunta: |
          Caudal Q₂ que sale por la boquilla. La tubería 2 tiene D = 200 mm y
          2100 m, y para el fibrocemento el Cuadro nº 25 da
          $J_1 = 9{,}17\cdot 10^{-6}$ con $C_{HW} = 130$.
        respuesta:
          tipo: magnitud
          valor: '36.69 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '59.9 l/s'
            mensaje: |
              Te has dejado la pérdida de carga de la media tubería que hay
              entre E y la boquilla. El pitot está en el **punto medio**, así
              que todavía quedan 1050 m por recorrer, y no son pocos.
          - valor: '28.4 l/s'
            mensaje: |
              Has contado los 2100 m enteros entre E y la boquilla. Desde el
              punto medio solo queda la mitad.
          - valor: '38.5 l/s'
            mensaje: |
              Te has dejado el factor de paso de la boquilla. Con K = 0,3, al
              pasar la altura cinética de salida al otro lado quedan 1,3 veces
              $V_B^{2}/2g$, no 1.
        pista: |
          El pitot da $p_E/\gamma + V_E^{2}/2g = R_1 + 13{,}6\,R_2$. Después,
          Bernoulli de E a la boquilla con la mitad de la tubería 2.
        desarrollo: |
          El manómetro da la energía del punto E:

          $$
          \frac{p_{pitot}}{\gamma} = R_1 + 13{,}6\,R_2 = 0{,}3 + 13{,}6\cdot 0{,}8 = 11{,}18\ \text{mca}
          $$

          Bernoulli entre E (cota 19) y la boquilla B (cota 18), con media
          tubería 2 por delante:

          $$
          11{,}18 + 19 - \frac{h_{f2}}{2} - K\frac{V_B^{2}}{2g} = 18 + \frac{V_B^{2}}{2g}
          $$

          Con $V_B = 0{,}2264\,Q_2$ —Q en l/s— la altura cinética es
          $2{,}614\cdot 10^{-3}Q_2^{2}$, y por Hazen-Williams
          $h_{f2} = 9{,}17\cdot 10^{-6}\cdot 2100\cdot Q_2^{1{,}852}$:

          $$
          12{,}18 = 3{,}398\cdot 10^{-3}\,Q_2^{2} + 9{,}629\cdot 10^{-3}\,Q_2^{1{,}852}
          $$

          Resolviendo por Newton-Raphson, **Q₂ = 36,69 l/s**, con
          $V_B = 8{,}31$ m/s.

      - tipo: calcular
        titulo: La longitud de la tubería 3
        pregunta: |
          Longitud L₃, sabiendo que el diafragma da
          $Q = C\,A_0\sqrt{2gR}$ y que para D = 125 mm el Cuadro nº 25 da
          $J_1 = 9{,}05\cdot 10^{-5}$.
        respuesta:
          tipo: magnitud
          valor: '428.5 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '4229 m'
            mensaje: |
              Has usado el $J_1$ de la tubería de 200 mm. La 3 es de 125 mm, y
              su $J_1$ es diez veces mayor: por eso le basta con una décima
              parte de longitud para perder lo mismo.
          - valor: '108.6 m'
            mensaje: |
              Has tomado como pérdida la diferencia de cotas entre C y la
              boquilla. Lo que pierde la tubería 3 es la diferencia entre la
              energía del nudo, 37,785, y la cota de C, 22.
        pista: |
          Primero $B_N$ desde la boquilla hacia atrás; luego Q₃ del diafragma;
          después $h_{f3} = B_N - 22$ y de ahí L₃.
        desarrollo: |
          Recorriendo la tubería 2 hacia atrás desde la boquilla:

          $$
          B_N = 18 + 1{,}3\frac{V_B^{2}}{2g} + h_{f2} = 18 + 3{,}398\cdot 10^{-3}Q_2^{2} + 1{,}926\cdot 10^{-2}Q_2^{1{,}852} = 37{,}785\ \text{mca}
          $$

          El diafragma da

          $$
          Q_3 = 0{,}8\cdot\frac{\pi\,0{,}1^{2}}{4}\sqrt{2\cdot 9{,}8\cdot 0{,}85} = 0{,}02565\ \text{m}^{3}/\text{s} = 25{,}65\ \text{l/s}
          $$

          Y como $B_N = 37{,}785 > 22 = B_C$, el agua de la tubería 3 va **del
          nudo al depósito**, no al revés. La pérdida disponible es

          $$
          h_{f3} = 37{,}785 - 22 = 15{,}785\ \text{m} = 9{,}05\cdot 10^{-5}\,L_3\,(25{,}65)^{1{,}852}
          $$

          de donde **L₃ = 428,5 m**.

      - tipo: calcular
        titulo: La potencia útil de la bomba
        pregunta: |
          Potencia útil de la bomba, si el caudalímetro de la tubería 1 marca
          2400 l/min. Para D = 175 mm el Cuadro nº 25 da
          $J_1 = 1{,}76\cdot 10^{-5}$.
        respuesta:
          tipo: magnitud
          valor: '14.1 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '10.9 kW'
            mensaje: |
              Te has dejado la pérdida de carga de la tubería 1. Son 8,16 m de
              los 35,94 que da la bomba: casi la cuarta parte.
          - valor: '7.69 kW'
            mensaje: |
              Has restado la pérdida de carga en vez de sumarla. La bomba tiene
              que dar la energía del nudo **más** lo que se pierde por el
              camino hasta él.
        pista: |
          Bernoulli entre el depósito A (cota 10) y el nudo:
          $Z_A + Hm_B - h_{f1} = B_N$.
        desarrollo: |
          $$
          Q_1 = \frac{2400}{60} = 40\ \text{l/s} \qquad h_{f1} = 1{,}76\cdot 10^{-5}\cdot 500\cdot 40^{1{,}852} = 8{,}16\ \text{m}
          $$

          $$
          Hm_B = B_N - Z_A + h_{f1} = 37{,}785 - 10 + 8{,}16 = 35{,}94\ \text{mca}
          $$

          $$
          P_{util} = 35{,}94\cdot 0{,}04\cdot 9800 = 14\,089\ \text{W} = 14{,}1\ \text{kW}
          $$

      - tipo: calcular
        titulo: El diámetro de la tubería 4
        pregunta: |
          Diámetro comercial D₄ que hay que instalar para que el reparto de
          caudales sea el calculado, con la válvula G completamente abierta.
        respuesta:
          tipo: magnitud
          valor: '200 mm'
          tolerancia: 0.01
          formato: un diámetro con su unidad (mm o m)
        distractores:
          - valor: '175 mm'
            mensaje: |
              Con 175 mm el cuadro da $J_1 = 1{,}76\cdot 10^{-5}$, mayor que
              el $J_{1,	ext{max}} = 1{,}53\cdot 10^{-5}$ que admite la instalación:
              la tubería perdería más de lo que hay disponible y no pasarían
              los 22,34 l/s. Hay que ir al inmediato superior.
          - valor: '125 mm'
            mensaje: |
              Todavía más estrecha, y por tanto peor: la pérdida crece cuando
              el diámetro baja.
        pista: |
          Primero Q₄ por continuidad en el nudo, luego
          $h_{f4} = 45 - B_N$ y de ahí el $J_1$ máximo admisible. El diámetro
          se toma **por exceso**.
        desarrollo: |
          En el nudo, lo que entra sale:

          $$
          Q_1 + Q_4 = Q_2 + Q_3 \;\Longrightarrow\; Q_4 = 36{,}69 + 25{,}65 - 40 = 22{,}34\ \text{l/s}
          $$

          Como $Z_D = 45 > B_N = 37{,}785$, el agua baja del depósito D al
          nudo, y la pérdida disponible es $h_{f4} = 7{,}215$ m:

          $$
          J_{1,	ext{max}} = \frac{7{,}215}{1500\cdot 22{,}34^{1{,}852}} = 1{,}53\cdot 10^{-5}
          $$

          El de 175 mm da $1{,}76\cdot 10^{-5}$, que es **mayor**: pierde más
          de lo permitido. El de 200 mm da $9{,}17\cdot 10^{-6}$, menor.
          **D₄ = 200 mm.**

      - tipo: justificar
        pregunta: Ordena para qué sirve la válvula G. Una pieza es falsa.
        piezas:
          - texto: 'El diámetro comercial se toma siempre por exceso, así que la tubería 4 instalada pierde menos de lo que la instalación necesita: 4,33 m en vez de 7,22.'
          - texto: 'Si no se hiciera nada, por la tubería 4 pasaría más caudal del previsto y el reparto del nudo dejaría de ser el calculado.'
          - texto: 'Por eso se cierra parcialmente la válvula G hasta introducir los 2,88 m que sobran.'
          - texto: 'Esa pérdida cuesta dinero todos los días: 9800 · 0,02234 · 2,88 = 631 W disipados en la válvula.'
          - texto: La válvula G se pone para poder cortar el paso del depósito D, y mientras esté abierta no influye en el reparto de caudales.
            trampa: true
            mensaje: |
              Cortar el paso lo hace cualquier válvula. Aquí la G tiene un
              papel de **regulación**: es lo que ajusta el caudal de la
              tubería 4 al valor que el reparto necesita, precisamente porque
              el diámetro comercial no coincide con el diámetro exacto.
    resolucion: |
      ## Por qué este problema se resuelve con Hazen-Williams

      El propio boletín lo dice: la expresión de Hazen-Williams es menos exacta
      que Colebrook-White, pero **evita iterar**, porque da la pérdida
      directamente en función del caudal:

      $$
      h_f = J_1\,L\,Q^{1{,}852}
      $$

      con Q en l/s y $J_1$ leído en el Cuadro nº 25 a partir del diámetro y de
      la rugosidad relativa. En una red de cuatro tuberías donde hay que probar
      diámetros y sentidos de circulación, esa comodidad decide. El precio está
      escrito en la propia fórmula: **solo vale para agua** o líquidos de
      viscosidad parecida.

      Para el fibrocemento, con $\varepsilon = 0{,}01$ cm, sale
      $C_{HW} = 130$, y de ahí

      | D | $J_1$ |
      |---|---|
      | 125 mm | 9,05·10⁻⁵ |
      | 175 mm | 1,76·10⁻⁵ |
      | 200 mm | 9,17·10⁻⁶ |

      ## a) El pitot, y la mitad de tubería que queda

      El manómetro da la energía total del punto E:

      $$
      \frac{p_E}{\gamma} + \frac{V_E^{2}}{2g} = R_1 + 13{,}6\,R_2 = 11{,}18\ \text{mca}
      $$

      El detalle que más se falla está en el enunciado: el pitot está en el
      **punto medio**, así que entre E y la boquilla queda la mitad de la
      tubería 2 —1050 m— y solo esa mitad se descuenta.

      $$
      12{,}18 = 3{,}398\cdot 10^{-3}Q_2^{2} + 9{,}629\cdot 10^{-3}Q_2^{1{,}852} \;\Longrightarrow\; Q_2 = 36{,}69\ \text{l/s}
      $$

      ## b) El nudo, que es la pieza central

      Con Q₂ conocido se puede recorrer la tubería 2 hacia atrás y llegar a la
      **energía del nudo**:

      $$
      B_N = 37{,}785\ \text{mca}
      $$

      Ese número es la llave del resto del problema. Con él se sabe hacia
      dónde va el agua en cada tubería, sin más que comparar:

      | | energía | comparación con $B_N$ | sentido |
      |---|---|---|---|
      | Depósito D | 45 | mayor | entra al nudo |
      | Depósito C | 22 | menor | sale del nudo |
      | Depósito A + bomba | 35,94 + 10 | mayor | entra al nudo |

      El diafragma da $Q_3 = 25{,}65$ l/s, la pérdida disponible en la 3 es
      $37{,}785 - 22 = 15{,}785$ m y de ahí **L₃ = 428,5 m**.

      ## c) La bomba

      Con Q₁ = 40 l/s y $h_{f1} = 8{,}16$ m,
      $Hm_B = 35{,}94$ mca y $P_{util} = 14{,}1$ kW.

      ## d) y e) El diámetro comercial, y lo que sobra

      La continuidad del nudo cierra el reparto:

      $$
      Q_4 = Q_2 + Q_3 - Q_1 = 36{,}69 + 25{,}65 - 40 = 22{,}34\ \text{l/s}
      $$

      La tubería 4 dispone de $45 - 37{,}785 = 7{,}215$ m de pérdida, lo que
      pide $J_{1,	ext{max}} = 1{,}53\cdot 10^{-5}$. El de 175 mm pierde demasiado
      (1,76·10⁻⁵) y el de 200 mm demasiado poco (9,17·10⁻⁶). Como no se puede
      instalar un diámetro que no se fabrica, **se toma el de 200 mm, siempre
      por exceso**.

      Y aquí aparece lo que hace bonito el problema. Con 200 mm la tubería 4
      solo pierde

      $$
      h_{f4} = 9{,}17\cdot 10^{-6}\cdot 1500\cdot 22{,}34^{1{,}852} = 4{,}33\ \text{m}
      $$

      de los 7,215 disponibles. Si no se hiciera nada, entraría más caudal del
      previsto y el reparto del nudo cambiaría. Por eso está la válvula G: para
      **meter a mano los 2,88 m que sobran**.

      $$
      h_{f,G} = 7{,}215 - 4{,}33 = 2{,}88\ \text{mca} \qquad P_{perdida} = 9800\cdot 0{,}02234\cdot 2{,}88 = 631\ \text{W}
      $$

      Seiscientos treinta vatios tirados a la basura de forma permanente, y no
      por un error de cálculo: por el simple hecho de que los diámetros se
      fabrican de 25 en 25 milímetros. Esa es la diferencia entre un problema
      de libro y una instalación: **el catálogo manda, y lo que sobra hay que
      quemarlo en una válvula.**

  - id: ejflu19-col627-tres-depositos-y-la-tuberia-que-va-al-reves
    titulo: Tres depósitos, y la tubería que va al revés
    fuente: Ejercicio 6.27 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En la red hidráulica de la figura, si Q₄ = 750 l/s, calcular:

      **a)** Caudales en todas las tuberías.

      **b)** Cota del depósito A (Z_A).

      **c)** Se desea sustituir las tuberías 1 y 2 por una única tubería (5) de
      $\phi_5 = 700$ mm. Calcular la longitud L₅ de la misma para que el
      comportamiento hidráulico no varíe, es decir, para que no varíen los
      caudales.

      **d)** Calcular la cota que debería tener la lámina superior de agua en
      el depósito superior (Z_A) para que todo el caudal que sale de A a
      través de la tubería 5 vaya directamente a C, siendo Q₃ = 0.

      **Nota:** utilizar la fórmula de **Hazen-Williams**.
      **Datos:** tuberías de fibrocemento.

      | | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | L [m] | 1800 | 2400 | 2400 | 3000 |
      | D [mm] | 500 | 600 | 700 | 800 |

