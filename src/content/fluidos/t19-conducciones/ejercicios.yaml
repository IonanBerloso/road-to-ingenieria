      <figcaption>Las tres líneas piezométricas del apartado a). El hueco de la derecha, entre la línea del riego y la cota de las boquillas, es la energía cinética del chorro; el de abajo, entre la línea del sobrepresor y su cota, es la presión del depósito.</figcaption>
      </figure>
    pide: El caudal que llega al sobrepresor y el diámetro de la tubería de suministro.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que la energía cinética **en las tuberías** es
          despreciable. ¿Vale eso también para la salida de las boquillas?
        opciones:
          - texto: No; las boquillas son de 20 mm y ahí la energía cinética es enorme, y hay que contarla
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. En la tubería NR, de 200 mm,
              el agua va a 1,9 m/s y su altura de velocidad son 19 cm; en una
              boquilla de 20 mm va a 15,9 m/s y son casi 13 metros. La boquilla
              lleva la doceava parte del caudal por la centésima parte de la
              sección.
          - texto: Sí, si se desprecia en las tuberías, se desprecia en todo el sistema
            mensaje: |
              El enunciado acota dónde se desprecia, y lo acota a propósito.
              Despreciarlo también en las boquillas quitaría 12,9 m del
              balance, que es justo la carga que empuja el agua hacia el
              sobrepresor.
          - texto: Sí, porque la boquilla descarga a la atmósfera y ahí la presión es cero
            mensaje: |
              La presión es cero, pero la velocidad no. La carga que hay que
              garantizar en el extremo es la cota **más** la altura de
              velocidad del chorro; si no, el chorro no saldría.
          - texto: No, y además hay que sumar la pérdida de carga del colector
            mensaje: |
              Lo primero sí, lo segundo no: el enunciado dice expresamente que
              la pérdida del colector es despreciable. Solo la energía cinética
              de las boquillas.

      - tipo: calcular
        titulo: La altura de velocidad de una boquilla
        pregunta: |
          Altura de velocidad del chorro que sale de una boquilla, en metros.
        respuesta:
          tipo: magnitud
          valor: '12.92 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '0.186 m'
            mensaje: |
              Has usado la velocidad en la tubería NR, de 200 mm. La boquilla
              lleva la doceava parte del caudal por la centésima parte de la
              sección, así que va ocho veces más rápida y su altura de
              velocidad es sesenta y nueve veces mayor.
          - valor: '25.85 m'
            mensaje: |
              Te has dejado el 2 del denominador. La altura de velocidad es
              $v^{2}/2g$, no $v^{2}/g$.
        pista: |
          Cada boquilla lleva 5 l/s por 20 mm de diámetro. Primero la
          velocidad, después su altura.
        desarrollo: |
          $$
          v_b = \frac{0{,}005}{\pi\,0{,}02^{2}/4} = 15{,}92\ \text{m/s} \qquad \frac{v_b^{2}}{2g} = 12{,}92\ \text{m}
          $$

          Es un dato que conviene mirar dos veces: **casi trece metros de
          columna de agua** se van en acelerar el chorro. La cota piezométrica
          que hay que garantizar en el extremo del riego no es 193, sino
          205,92.

      - tipo: calcular
        titulo: El caudal al sobrepresor
        pregunta: |
          Caudal que llegará al depósito presurizado, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '56.16 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '113.9 l/s'
            mensaje: |
              Te has dejado los 35 mca de presión del depósito presurizado. La
              cota piezométrica que hay que vencer en S no es 167, sino 202.
          - valor: '60.5 l/s'
            mensaje: |
              Has usado C = 140. Con fibrocemento —rugosidad 0,01 cm— y 150 mm
              de diámetro, la relación $\varepsilon/D$ vale
              $6{,}7\cdot 10^{-4}$, que en el cuadro nº 25 cae en la banda de
              C = 130.
        pista: |
          Primero la cota piezométrica del nudo, subiendo desde el riego; luego
          se baja de ahí al sobrepresor por la NS.
        desarrollo: |
          **La cota piezométrica del nudo.** El extremo del riego pide 205,92 m,
          y desde N hasta ahí se pierde, por Hazen-Williams con C = 130,

          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}{130^{1{,}852}\cdot 200^{4{,}87}} = 9{,}17\cdot 10^{-6}
          $$

          $$
          h_{f,NR} = 9{,}17\cdot 10^{-6}\cdot 500\cdot 60^{1{,}852} = 9{,}01\ \text{m}
          $$

          de modo que $H_N = 205{,}92 + 9{,}01 = 214{,}93$ m.

          **La bajada al sobrepresor.** En S la cota piezométrica es
          $167 + 35 = 202$ m, así que quedan 12,93 m para los 200 m de la NS:

          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}{130^{1{,}852}\cdot 150^{4{,}87}} = 3{,}72\cdot 10^{-5}
          $$

          $$
          Q_S = \left(\frac{12{,}93}{3{,}72\cdot 10^{-5}\cdot 200}\right)^{1/1{,}852} = 56{,}16\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El diámetro de la tubería de suministro
        pregunta: |
          Diámetro comercial de la tubería DN, en milímetros.
        respuesta:
          tipo: magnitud
          valor: '250 mm'
          tolerancia: 0.02
          formato: una longitud con su unidad (mm)
        distractores:
          - valor: '200 mm'
            mensaje: |
              El cálculo pide 246,7 mm y has redondeado hacia abajo. Con 200 mm
              la pérdida sería de 44,7 m y al nudo llegarían 186 m de cota
              piezométrica: no daría ni para el riego. Un diámetro se redondea
              siempre hacia arriba.
          - valor: '192 mm'
            mensaje: |
              Has llevado por la DN solo el caudal del riego. Por ahí pasa
              **todo**, los 60 l/s del riego más los 56,16 del sobrepresor.
        pista: |
          Por la DN circula la suma de los dos caudales, y la carga disponible
          es lo que va de la cota 231 a la piezométrica del nudo.
        desarrollo: |
          El caudal total es $60 + 56{,}16 = 116{,}16$ l/s, y la carga
          disponible entre la lámina del depósito y el nudo,
          $231 - 214{,}93 = 16{,}07$ m. Despejando el diámetro de
          Hazen-Williams:

          $$
          D^{4{,}87} = \frac{1{,}2117\cdot 10^{10}\cdot 730\cdot 116{,}16^{1{,}852}}{130^{1{,}852}\cdot 16{,}07} \;\Longrightarrow\; D = 246{,}7\ \text{mm}
          $$

          El comercial inmediato por encima es **250 mm**. Y esos 3,3 mm de
          redondeo no son un detalle: con 250 mm la pérdida baja a 15,07 m y la
          cota piezométrica del nudo sube a 215,93, un metro por encima de lo
          exigido. Ese metro de más va a repartirse entre las dos ramas y hace
          que por las dos circule algo más de lo pedido, que es lo que se
          quiere.

      - tipo: justificar
        pregunta: Ordena por qué el problema se resuelve empezando por el riego. Una pieza es falsa.
        piezas:
          - texto: 'La rama del riego es la única con el caudal fijado de antemano: doce boquillas a 5 l/s son 60 l/s.'
          - texto: 'Con ese caudal se sube desde el extremo del riego hasta el nudo y se obtiene su cota piezométrica, 214,93.'
          - texto: 'Ya con el nudo conocido, la rama del sobrepresor se resuelve sola, porque su otro extremo también está fijado, en 202.'
          - texto: 'Y solo al final, con los dos caudales sumados, se puede dimensionar la tubería de suministro.'
          - texto: La rama del sobrepresor también tiene el caudal fijado, porque su presión de 35 mca lo determina.
            trampa: true
            mensaje: |
              Los 35 mca fijan la **cota piezométrica** del extremo, no el
              caudal. El caudal depende además de la cota del nudo, que no se
              conoce hasta haber resuelto el riego. Confundir una cota fija con
              un caudal fijo es lo que hace que este problema parezca no tener
              por dónde empezar.
    resolucion: |
      ## Una red abierta que se resuelve al revés

      La tentación es empezar por el depósito, que es de donde sale el agua.
      Pero el depósito no impone caudal: impone una cota. El único sitio de la
      red donde el caudal está fijado es el **extremo** del riego —doce
      boquillas a 5 l/s—, y por eso el problema se resuelve de aguas abajo
      hacia aguas arriba.

      ## a) Las líneas piezométricas, que son la respuesta

      El esquema de la figura no es una ilustración: es el apartado a). Y
      leyéndolo se ve la estructura entera del problema en dos huecos.

      El hueco de la derecha, entre la línea piezométrica del riego (205,92) y
      la cota de las boquillas (193), son **12,92 m de energía cinética**. El
      hueco de abajo, entre la línea del sobrepresor (202) y la cota del
      depósito (167), son los **35 mca de presión** que hay dentro. Los dos
      huecos son carga que el sistema tiene que entregar y que no se ve en la
      cota.

      ## b) Trece metros que deciden todo

      Cada boquilla lleva 5 l/s por 20 mm:

      $$
      v_b = 15{,}92\ \text{m/s} \qquad \frac{v_b^{2}}{2g} = 12{,}92\ \text{m}
      $$

      Doce boquillas en paralelo son 60 l/s por la NR, que cuesta 9,01 m de
      pérdida con C = 130. La cota del nudo sale

      $$
      H_N = 193 + 12{,}92 + 9{,}01 = 214{,}93\ \text{m}
      $$

      Y con 202 en el sobrepresor quedan 12,93 m para los 200 m de la NS:

      $$
      Q_S = 56{,}16\ \text{l/s}
      $$

      **Aquí hay una coincidencia que vale la pena mirar.** Si alguien
      despreciara la energía cinética de las boquillas, la cota del nudo
      saldría $193 + 9{,}01 = 202{,}01$ — es decir, prácticamente los 202 del
      sobrepresor— y el caudal al sobrepresor daría **cero**. El error no
      produce un número raro: produce un sistema que parece no funcionar. Es
      la mejor demostración de que esos 12,92 m son el motor de la rama del
      sobrepresor entera.

      ## c) El diámetro, con todo el caudal dentro

      Por la DN pasan los dos caudales juntos, 116,16 l/s, y la carga
      disponible son los $231 - 214{,}93 = 16{,}07$ m que van de la lámina del
      depósito a la piezométrica del nudo. Despejando,

      $$
      D = 246{,}7\ \text{mm} \;\longrightarrow\; \textbf{250 mm}
      $$

      Y conviene ver lo sensible que es: con 200 mm —el comercial anterior— la
      pérdida se dispara a 44,7 m, casi tres veces la disponible, y al nudo
      llegarían 186 m de cota piezométrica. Ni el riego funcionaría. En
      Hazen-Williams la pérdida va con $D^{-4{,}87}$: bajar un escalón de
      diámetro multiplica la pérdida por casi tres.

  - id: ejflu19-col621-los-tres-depositos-y-el-que-no-se-sabe-que-hace
    titulo: Los tres depósitos, y el que no se sabe qué hace
    fuente: Ejercicio 6.21 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Teniendo en cuenta los datos de la figura, se pide:

      **a)** Caudales de agua circulante.

      **b)** Cota piezométrica que debería tener C para que no circulara caudal
      por la tubería 3. Deducir si ello es posible.

      **c)** Cota que debería tener B para que circulara por la tubería 2 un
      caudal de 10 l/s en dirección al depósito.

      **Nota:** Prescíndase de las pérdidas menores y de las energías cinéticas.
      Las tuberías son de fibrocemento.

