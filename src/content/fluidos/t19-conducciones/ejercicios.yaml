        <desc id="f618d">A la derecha, el petrolero atracado, con el
        hidrocarburo en su bodega. De ella sale la tuberia, sube por la ladera
        de una colina, pasa por encima del deposito de almacenamiento y baja
        dentro de el. La coronacion de ese sifon esta 25 m por encima del
        tramo horizontal de la tuberia, y la lamina del barco 1 m por debajo
        de ese mismo tramo: en total, 26 m de altura que la bomba tiene que
        vencer.</desc>
        <defs>
          <marker id="m618n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M60,185 H235 L370,272 H60 Z" fill="var(--faint)" opacity="0.16" stroke="none"/>
