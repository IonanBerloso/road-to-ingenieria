        <text x="540" y="122" text-anchor="middle" font-size="12" fill="var(--ink)">C</text>
        <text x="540" y="68" text-anchor="middle" font-size="10.5" fill="var(--faint)">cota 50</text>
        <path d="M115,205 V340 H500" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M350,290 L500,340" fill="none" stroke="var(--ink)" stroke-width="3"/>
