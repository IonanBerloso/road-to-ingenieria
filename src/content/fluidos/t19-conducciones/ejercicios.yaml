        <path d="M40,214 l-7,8 M90,214 l-7,8 M140,214 l-7,8 M190,214 l-7,8 M240,214 l-7,8 M290,214 l-7,8 M340,214 l-7,8 M390,214 l-7,8 M440,214 l-7,8 M520,268 l-7,8 M570,268 l-7,8" stroke="var(--faint)" stroke-width="1.1"/>
        <path d="M478,248 H590 V268 H478 Z" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <circle cx="502" cy="272" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="566" cy="272" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="500" y1="210" x2="546" y2="210" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="500" y1="248" x2="546" y2="248" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="540" y1="210" x2="540" y2="248" stroke="var(--faint)" stroke-width="1" marker-start="url(#m614n)" marker-end="url(#m614n)"/>
        <text x="548" y="233" font-size="11" fill="var(--faint)">2 m</text>
        <text x="330" y="244" text-anchor="middle" font-size="9.5" fill="var(--faint)">tubería de hierro forjado · L = 100 m · D = 100 mm</text>
      </svg>
      <figcaption>Del depósito al camión, que está en una fosa. Los seis metros de gasolina y los dos que baja la tubería al final tiran en el mismo sentido: la carga disponible son ocho metros. La escala horizontal va muy comprimida.</figcaption>
      </figure>
    pide: El caudal de llenado por gravedad y la presión de aire que haría falta para duplicarlo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánta altura motriz tiene esta instalación entre la superficie de
          la gasolina y la boca del camión?
        opciones:
          - texto: 8 m, los 6 del depósito más los 2 que baja la tubería hasta el camión
            correcta: true
            mensaje: |
              Eso es. El camión está en una fosa, así que el último tramo de
              tubería **baja** 2 m en vez de subir: esos 2 m se suman a los 6
              del depósito. Es la lectura clave de la figura y la que decide
              todo el problema.
          - texto: 6 m, porque los 2 m del final hay que subirlos y se compensan con el desnivel de la tubería
            mensaje: |
              Mira la figura otra vez: el suelo cae al llegar al camión y el
              tramo final va hacia abajo. Con 6 m el caudal saldría 18 l/s en
              vez de 20,8.
          - texto: 4 m, la diferencia entre los 6 del depósito y los 2 que hay que subir
            mensaje: |
              Ese sería el caso si el camión estuviera **encima** del suelo y
              hubiera que subir la gasolina 2 m. Aquí la fosa lo pone por
              debajo, y el signo cambia.

      - tipo: calcular
        titulo: El caudal por gravedad
        pregunta: |
          Caudal de llenado con el nivel a 6 m. El hierro forjado tiene
          $\varepsilon = 0{,}006$ cm (Cuadro nº 20) y la gasolina a 10 °C
          $\nu \approx 6\cdot 10^{-7}$ m²/s (Ábaco nº 5).
        respuesta:
          tipo: magnitud
          valor: '20.8 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '18 l/s'
            mensaje: |
              Te has dejado los 2 m de bajada al camión. La altura motriz son
              8 m, no 6.
          - valor: '14.6 l/s'
            mensaje: |
              Has restado los 2 m en vez de sumarlos. El camión está en una
              fosa: la tubería baja hasta él.
          - valor: '23 l/s'
            mensaje: |
              Te has dejado las piezas especiales y la energía cinética de
              salida. Suman 3,94 frente a los 18,4 de la tubería: casi un
              quinto de la pérdida total.
        pista: |
          $8 = (f\,L/D + \sum K + 1)\,V^{2}/2g$, con
          $\sum K = 0{,}5 + 0{,}19 + 3\cdot 0{,}75$. Se itera con Moody.
        desarrollo: |
          Los factores de paso (Cuadro nº 24): salida de ángulos vivos 0,5,
          válvula de compuerta abierta 0,19 y tres codos de radio medio a 0,75.
          Con la energía cinética de salida:

          $$
          8 = \left(1000\,f + 2{,}94 + 1\right)\frac{V^{2}}{2g}
          $$

          Con $\varepsilon/D = 0{,}0006$ el ábaco da f = 0,0184 en la zona de
          transición, y el corte sale en

          $$
          V = 2{,}65\ \text{m/s} \qquad Re = 4{,}4\cdot 10^{5} \qquad Q = 20{,}8\ \text{l/s}
          $$

          El reparto de los 8 m: 6,59 se los lleva la tubería, 1,06 las piezas
          y 0,36 la energía cinética de salida.

      - tipo: calcular
        titulo: La presión de aire para duplicar el caudal
        pregunta: |
          Presión a la que hay que poner el aire comprimido sobre la gasolina
          para que el caudal pase a 41,6 l/s, con el nivel todavía en 6 m. La
          gasolina tiene s = 0,68 (Ábaco nº 5).
        respuesta:
          tipo: magnitud
          valor: '1.6 kg/cm2'
          tolerancia: 0.02
          formato: una presión con su unidad (kg/cm², bar o kPa)
        distractores:
          - valor: '2.13 kg/cm2'
            mensaje: |
              No has restado la altura que ya tenía la instalación. El aire
              solo tiene que aportar lo que **falta**: 31,3 m menos los 8 m de
              gravedad que ya estaban.
          - valor: '0.54 kg/cm2'
            mensaje: |
              Has supuesto que la altura necesaria crece en proporción al
              caudal. En Manning o en Darcy la pérdida va con $V^{2}$: doblar
              el caudal cuadruplica la pérdida, no la duplica.
        pista: |
          Con $Q$ doble, la velocidad se dobla y la pérdida se multiplica por
          algo menos de 4 (f baja un poco). Esa altura menos los 8 m que ya
          había es lo que aporta el aire.
        desarrollo: |
          Con $Q = 41{,}6$ l/s, $V = 5{,}30$ m/s, $Re = 8{,}8\cdot 10^{5}$ y
          f = 0,0179, la instalación necesita

          $$
          H = (1000\cdot 0{,}0179 + 3{,}94)\frac{5{,}30^{2}}{19{,}6} = 31{,}3\ \text{m de gasolina}
          $$

          De esos 31,3 m, 8 los pone la gravedad. El aire tiene que aportar
          los 23,3 restantes:

          $$
          p = 23{,}3\cdot 0{,}68\cdot 9800 = 155{,}6\ \text{kPa} = 1{,}59\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena por qué duplicar el caudal cuesta tanto. Una pieza es falsa.
        piezas:
          - texto: 'La pérdida de carga va con el cuadrado de la velocidad, así que al doblar el caudal se multiplica por casi cuatro: de 8 a 31,3 m.'
          - texto: 'El casi es porque el coeficiente de fricción baja algo al subir el Reynolds, de 0,0184 a 0,0179: un 3 % menos.'
          - texto: 'Los 8 m que ya ponía la gravedad siguen ahí, así que el aire solo tiene que aportar la diferencia, 23,3 m de columna de gasolina.'
          - texto: 'Y 23,3 m de gasolina, con s = 0,68, son 1,59 kg/cm² de presión de aire.'
          - texto: Para duplicar el caudal basta con duplicar la presión disponible, porque el caudal es proporcional a la altura motriz.
            trampa: true
            mensaje: |
              Si fuera proporcional, con 16 m tendríamos 41,6 l/s y bastaría
              con 0,54 kg/cm². Pero el caudal va con la **raíz** de la altura:
              $Q \propto \sqrt H$. Duplicar Q pide cuadruplicar H, no
              duplicarla.
    resolucion: |
      ## Leer la figura antes que nada

      Este problema se juega en un detalle del dibujo: **el camión está en una
      fosa**. El suelo cae al llegar a él, y el último tramo de tubería no sube
      los dos metros, los baja. Por eso la altura motriz no son 6 m ni 4, sino

      $$
      H = 6 + 2 = 8\ \text{m}
      $$

      Con 6 m el caudal saldría 18 l/s y con 4 m, 14,6. La diferencia entre
      leer bien y leer mal la figura es de un 40 %.

      ## a) El caudal por gravedad

      Del Cuadro nº 20, el hierro forjado tiene $\varepsilon = 0{,}006$ cm, y
      del Ábaco nº 5 la gasolina a 10 °C ronda
      $\nu = 6\cdot 10^{-7}$ m²/s con s = 0,68. Ninguno de los dos datos está
      en el enunciado.

      Los factores de paso (Cuadro nº 24) son salida de ángulos vivos 0,5,
      válvula de compuerta abierta 0,19 y tres codos de radio medio a 0,75 cada
      uno, más la energía cinética que se pierde al descargar:

      $$
      8 = \left(f\,\frac{100}{0{,}1} + 2{,}94 + 1\right)\frac{V^{2}}{2g}
      $$

      Iterando con Moody sale f = 0,0184, V = 2,65 m/s y **Q = 20,8 l/s**.

      El reparto merece un vistazo:

      | | m | % |
      |---|---|---|
      | fricción en los 100 m de tubería | 6,59 | 82 % |
      | piezas especiales | 1,06 | 13 % |
      | energía cinética de salida | 0,36 | 5 % |

      Con L/D = 1000, la tubería se lo come casi todo. Las piezas, que en una
      instalación corta serían decisivas, aquí son un decimal.

      ## b) Lo que cuesta ir al doble

      Y aquí está la lección. La pérdida de carga va con $V^{2}$, así que
      **doblar el caudal multiplica la pérdida por casi cuatro**: de 8 m se
      pasa a 31,3. El «casi» es porque el coeficiente de fricción baja un poco
      al subir el Reynolds —de 0,0184 a 0,0179—, pero es un efecto del 3 %.

      La gravedad sigue poniendo sus 8 m, así que el aire comprimido tiene que
      aportar los 23,3 restantes:

      $$
      p = 23{,}3\cdot 0{,}68\cdot 9800 = 155{,}6\ \text{kPa} = 1{,}59\ \text{kg/cm}^{2}
      $$

      Dicho al revés, que es como se entiende mejor: **el caudal crece con la
      raíz cuadrada de la altura motriz.** Cuadruplicar la altura para doblar
      el caudal no es un mal negocio ni un buen negocio: es la ley, y conviene
      tenerla en la cabeza antes de prometerle a nadie que una bomba mayor
      resolverá un cuello de botella.

      ## Sobre el modelo

      El enunciado no dice cuántos codos hay: hay que contarlos en la figura, y
      son tres —uno al salir del depósito, otro al llegar al suelo y otro al
      bajar al camión—. Con esos tres y con la altura motriz de 8 m, los dos
      resultados publicados salen a la primera: 20,83 l/s contra los 20,8
      publicados y 1,59 kg/cm² contra 1,6. Que **un solo modelo reproduzca los
      dos números** es la comprobación de que la lectura de la figura era la
      buena.

  - id: ejflu19-col616-el-oleoducto-que-pasa-raspando-por-el-alto
    titulo: El oleoducto que pasa raspando por el alto
    fuente: Ejercicio 6.16 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se quiere transportar 180 l/s de keroseno (densidad relativa = 0,98;
      viscosidad = $2{,}8\cdot 10^{-6}$ m²/s) mediante un oleoducto cuyo perfil
      longitudinal se indica en la figura. Se pide:

      <figure class="figura-examen">
      <svg viewBox="0 0 620 280" role="img" width="620" height="280"
           aria-labelledby="f616t f616d">
        <title id="f616t">Perfil longitudinal del oleoducto entre A, B y C</title>
        <desc id="f616d">El oleoducto arranca en A, a la cota 100, sube 30 km
        hasta el alto B, en la cota 305, y desde alli baja 93 km hasta C, en
        la cota 155. El punto de llegada esta 55 m por encima del de partida,
        pero por el camino se pasa por un alto 205 m mas arriba. La escala
        vertical esta muy exagerada respecto de la horizontal.</desc>
        <defs>
          <marker id="m616n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M60,230 L177,70 L540,187" fill="none" stroke="var(--ink)" stroke-width="2.8"/>
        <line x1="36" y1="230" x2="84" y2="230" stroke="var(--faint)" stroke-width="1.2"/>
        <text x="32" y="234" text-anchor="end" font-size="11" fill="var(--faint)">100</text>
        <text x="60" y="252" text-anchor="middle" font-size="13" fill="var(--ink)">A</text>
        <line x1="150" y1="70" x2="206" y2="70" stroke="var(--faint)" stroke-width="1.2"/>
        <text x="146" y="74" text-anchor="end" font-size="11" fill="var(--faint)">305</text>
        <text x="188" y="88" font-size="13" fill="var(--ink)">B</text>
        <line x1="516" y1="187" x2="564" y2="187" stroke="var(--faint)" stroke-width="1.2"/>
        <text x="570" y="191" font-size="11" fill="var(--faint)">155</text>
        <text x="540" y="208" text-anchor="middle" font-size="13" fill="var(--ink)">C</text>
        <text x="78" y="150" text-anchor="end" font-size="11" fill="var(--faint)">30 km</text>
        <text x="360" y="110" text-anchor="middle" font-size="11" fill="var(--faint)">93 km</text>
        <line x1="92" y1="196" x2="128" y2="147" stroke="var(--live)" stroke-width="1.6" marker-end="url(#m616n)"/>
        <line x1="300" y1="110" x2="340" y2="123" stroke="var(--live)" stroke-width="1.6" marker-end="url(#m616n)"/>
        <text x="60" y="268" text-anchor="middle" font-size="9.5" fill="var(--faint)">cotas en metros</text>
      </svg>
      <figcaption>Del punto A al C hay 55 metros de subida neta, pero por el camino se pasa por el alto B, doscientos metros más arriba. La escala vertical va muy exagerada: son 123 kilómetros de tubería.</figcaption>
      </figure>

      **a)** Seleccionar el diámetro de la tubería de fundición a instalar,
      igual para todo el oleoducto, teniendo en cuenta que la velocidad del
      flujo debe estar comprendida entre 0,8 y 1 m/s y que los diámetros
      comerciales se fabrican de 50 en 50 mm.

      **b)** Potencia bruta de la bomba necesaria para que el keroseno llegue
      a C a la presión atmosférica siendo el rendimiento de aquella de 0,75.

      **c)** Dibujar la línea piezométrica.

      **d)** Presión con que llegará el líquido a B.
    pide: El diámetro comercial, la potencia bruta de la bomba y con qué presión pasa el keroseno por el alto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué desnivel tiene que vencer la bomba, si el líquido debe llegar a
          C a la presión atmosférica?
        opciones:
          - texto: 55 m, la cota de C menos la de A, porque lo que se sube hasta B se recupera al bajar
            correcta: true
            mensaje: |
              Eso es. La energía potencial ganada subiendo a B se devuelve
              entera al bajar a C: no se pierde por el camino. Lo que sí se
              pierde es la fricción, y esa sí se acumula a lo largo de los
              123 km.
          - texto: 205 m, porque hay que subir el líquido hasta el alto de B
            mensaje: |
              Es el error clásico de los perfiles con un alto. La subida a B
              no se paga: se recupera. Lo que hay que vigilar en B es otra
              cosa —la presión con que pasa—, y de eso va el apartado d).
          - texto: 355 m, los 205 de subida más los 150 de bajada
            mensaje: |
              La bajada no se suma, se resta. Si se sumaran las dos, cualquier
              terreno ondulado haría imposible un oleoducto, y sin embargo los
              hay de miles de kilómetros.

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          Diámetro de la tubería, sabiendo que se fabrican de 50 en 50 mm y
          que la velocidad tiene que quedar entre 0,8 y 1 m/s con los
          180 l/s.
        respuesta:
          tipo: magnitud
          valor: '500 mm'
          tolerancia: 0.01
          formato: un diámetro con su unidad (mm, cm o m)
        distractores:
          - valor: '450 mm'
            mensaje: |
              Con 450 mm la velocidad sale 1,13 m/s, por encima del máximo
              admitido. La ventana no se cumple por arriba.
          - valor: '550 mm'
            mensaje: |
              Con 550 mm la velocidad sale 0,758 m/s, por debajo del mínimo.
              La ventana no se cumple por abajo.
        pista: |
          $V = Q/A$, y hay que probar los diámetros comerciales hasta que V
          caiga dentro de la ventana.
        desarrollo: |
          | D | V = Q/A |
          |---|---|
          | 450 mm | 1,132 m/s |
          | **500 mm** | **0,917 m/s** |
          | 550 mm | 0,758 m/s |

          Solo el de **500 mm** cae dentro de la ventana 0,8–1 m/s, y encima
          casi en el centro. La ventana existe por las dos razones de siempre:
          por arriba, la pérdida de carga crece con $V^{2}$ y la tubería se
          erosiona; por abajo, el tubo sale caro y el líquido puede depositar.

      - tipo: calcular
        titulo: La potencia bruta de la bomba
        pregunta: |
          Potencia bruta de la bomba, con un rendimiento de 0,75, para que el
          keroseno llegue a C a la presión atmosférica. La fundición tiene
          $\varepsilon = 0{,}026$ cm.
        respuesta:
          tipo: magnitud
          valor: '599 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '449 kW'
            mensaje: |
              Esa es la potencia **útil**, la que recibe el keroseno. La bruta
              es la que consume la bomba: hay que dividir entre el rendimiento
              de 0,75, no multiplicar.
          - valor: '940 kW'
            mensaje: |
              Has puesto los 205 m de subida hasta B como desnivel a vencer.
              La cota que cuenta es la de C: 55 m.
          - valor: '127 kW'
            mensaje: |
              Te has dejado la pérdida de carga. En 123 km de tubería son
              203 m, casi cuatro veces el desnivel: es el término dominante.
        pista: |
          $Hm = (Z_C - Z_A) + h_f$ con $h_f$ sobre los 123 km enteros, y
          $P_{bruta} = Hm\,Q\,\gamma/\eta$.
        desarrollo: |
          Con D = 500 mm, V = 0,917 m/s, $Re = 1{,}64\cdot 10^{5}$ y
          $\varepsilon/D = 0{,}00052$, el ábaco da f = 0,0193.

          $$
          h_f = f\,\frac{123\,000}{0{,}5}\cdot\frac{0{,}917^{2}}{19{,}6} = 203\ \text{m}
          $$

          $$
          Hm = (155 - 100) + 203 = 258\ \text{m de columna de keroseno}
          $$

          $$
          P_{bruta} = \frac{258\cdot 0{,}18\cdot 0{,}98\cdot 9800}{0{,}75} = 596\ \text{kW}
          $$

          El boletín publica 599 kW; la diferencia está en la tercera cifra de
          f, leída en el ábaco.

      - tipo: justificar
        pregunta: Ordena qué dice la línea piezométrica sobre el alto de B. Una pieza es falsa.
        piezas:
          - texto: 'La piezométrica arranca en A a la cota 358 —los 100 del terreno más los 258 que pone la bomba— y baja en línea recta, porque el diámetro y el caudal no cambian.'
          - texto: 'Hasta B se pierden 49,6 m, así que allí la piezométrica va por 309, y el terreno está a 305.'
          - texto: 'Es decir, el keroseno pasa por el alto con menos de cuatro metros de columna: si la piezométrica bajara por debajo del terreno, en B habría depresión y el oleoducto se cortaría.'
          - texto: 'Y ese número está mal condicionado, porque es la diferencia entre los 154 m que se pierden de B a C y los 150 m que se baja: un 1,5 % de error en f lo mueve un 70 %.'
          - texto: Como la bomba tiene que subir el líquido 205 m hasta B, esos 205 m son el desnivel del problema.
            trampa: true
            mensaje: |
              La subida a B se recupera bajando a C, así que el desnivel que
              paga la bomba son 55 m. Lo que el alto de B impone no es
              energía, es una **restricción**: que la piezométrica no baje por
              debajo de su cota.
    resolucion: |
      ## Un perfil con un alto en medio

      El oleoducto sube 205 m hasta B y baja 150 hasta C. Lo primero que hay
      que tener claro es que **la subida no se paga**: la energía potencial
      que el líquido gana subiendo la devuelve entera al bajar, así que el
      desnivel que la bomba tiene que vencer son los 55 m netos entre A y C.

      Lo que el alto sí impone es una restricción, y de eso va el apartado d).

      ## a) El diámetro, por la ventana de velocidad

      | D | V = Q/A |
      |---|---|
      | 450 mm | 1,132 m/s |
      | **500 mm** | **0,917 m/s** |
      | 550 mm | 0,758 m/s |

      Solo el de **500 mm** entra en la ventana 0,8–1 m/s.

      ## b) La potencia

      Con V = 0,917 m/s, $Re = 1{,}64\cdot 10^{5}$ y
      $\varepsilon/D = 0{,}026/50 = 0{,}00052$, el ábaco da f = 0,0193, y sobre
      los 123 km:

      $$
      h_f = 0{,}0193\cdot\frac{123\,000}{0{,}5}\cdot 0{,}0429 = 203\ \text{m}
      $$

      Fíjate en la proporción: **203 m de fricción contra 55 m de desnivel**.
      En un oleoducto largo el terreno casi no cuenta; lo que cuenta son los
      kilómetros.

      $$
      Hm = 55 + 203 = 258\ \text{m} \qquad P_{bruta} = \frac{258\cdot 0{,}18\cdot 9604}{0{,}75} = 596\ \text{kW}
      $$

      (El boletín publica 599 kW; la diferencia es la tercera cifra de f.)

      ## c) La línea piezométrica

      Como el diámetro y el caudal son constantes, la altura cinética no
      cambia y la piezométrica es una recta que cae con pendiente uniforme:

      | | terreno | piezométrica | presión |
      |---|---|---|---|
      | A (tras la bomba) | 100 | 358 | 258 mcl |
      | B | 305 | 309 | **4 mcl** |
      | C | 155 | 155 | 0 |

      Dibujarla es unir esos tres puntos de la columna del medio con dos
      rectas de la misma pendiente —0,00165 m/m—, y comprobar que la línea
      queda por encima del terreno en todo el recorrido.

      ## d) Los cuatro metros de B, y por qué hay que desconfiar de ellos

      El keroseno pasa por el alto con unos **4 metros de columna** de presión.
      Ese es el margen de toda la instalación: si la piezométrica bajara por
      debajo de la cota 305, en B habría depresión, el keroseno tendería a
      vaporizarse y la vena se cortaría.

      Pero conviene decir en voz alta que ese número es **frágil**. Sale como
      diferencia entre dos cantidades grandes y parecidas —los 154 m que se
      pierden de B a C y los 150 m que se baja—, así que un error pequeño en f
      se amplifica muchísimo:

      | f | potencia bruta | presión en B |
      |---|---|---|
      | 0,0192 | 594 kW | 3,1 mcl |
      | 0,0193 | 596 kW | 3,9 mcl |
      | 0,0194 | 598 kW | 4,7 mcl |
      | 0,0195 | 601 kW | 5,5 mcl |

      Un 1,5 % de diferencia en f mueve la potencia un 1 % y la presión en B
      un **77 %**. El boletín publica 4,6 mcl, que corresponde a leer
      f ≈ 0,0194; con la expresión de Colebrook salen 3,8.

      La lección no es cuál de los dos números es el bueno —los dos lo son,
      dentro de lo que se puede leer en un ábaco—, sino que **hay resultados
      robustos y resultados mal condicionados, y hay que saber cuál se tiene
      entre manos.** Con 4 metros de margen sobre un alto de 205, este
      oleoducto está diseñado al límite, y esa es la conclusión que sobrevive
      a la incertidumbre.

  - id: ejflu19-col618-el-petrolero-y-el-sifon-que-se-da-la-vuelta
    titulo: El petrolero, y el sifón que se da la vuelta
    fuente: Ejercicio 6.18 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un petrolero que transporta un hidrocarburo de peso específico relativo
      0,86 y viscosidad cinemática 0,05 St, cuando llega a puerto debe
      trasvasarlo a un depósito de almacenamiento. Para ello se dispone de una
      bomba autocebante de 15 kW y 70 % de rendimiento. El diámetro de la
      tubería de trasvase es de 200 mm y 150 m de longitud, disponiendo además
      de 3 codos y una válvula. Se pide:

      **a)** Caudal trasvasado.

      **b)** Qué sucedería en el caso de que la lámina superior del depósito
      alcanzase la cota 26 y en ese instante se parara la bomba.

      **Datos:** Longitud equivalente de un codo = 5 m; ídem de la válvula
      = 25 m.

      <figure class="figura-examen">
      <svg viewBox="0 0 620 300" role="img" width="620" height="300"
           aria-labelledby="f618t f618d">
