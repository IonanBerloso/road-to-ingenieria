    pide: Los caudales de las cuatro tuberías, la cota de A, la longitud de la tubería que sustituiría a las dos en paralelo, y la cota que haría que la 3 no llevase nada.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tuberías 1 y 2 unen los mismos dos puntos, el depósito A y el
          nudo N. ¿Qué tienen en común?
        opciones:
          - texto: La pérdida de carga, porque los dos extremos tienen la misma energía para las dos
            correcta: true
            mensaje: |
              Eso es. En un montaje en paralelo lo que se reparte es el caudal;
              lo que coincide es la pérdida. Aquí las dos pierden 0,34 m, y
              esa igualdad es la ecuación que decide el reparto.
          - texto: El caudal, que se divide a partes iguales entre las dos
            mensaje: |
              Solo se dividiría a partes iguales si fueran idénticas, y no lo
              son: una tiene 500 mm y 1800 m, la otra 600 mm y 2400 m. El
              reparto sale 61 y 85 l/s.
          - texto: La velocidad, porque el agua sale del mismo sitio
            mensaje: |
              Las velocidades salen distintas —0,31 y 0,30 m/s— y no hay
              ninguna razón para que coincidan. Lo que iguala el montaje en
              paralelo es la energía disipada, no la velocidad.

      - tipo: calcular
        titulo: El reparto entre las dos en paralelo
        pregunta: |
          Caudal Q₁, sabiendo que entre las dos tuberías en paralelo llevan
          146 l/s. Para el fibrocemento, el Cuadro nº 25 da $C_{HW} = 140$ en
          estos cuatro diámetros.
        respuesta:
          tipo: magnitud
          valor: '61.2 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '73 l/s'
            mensaje: |
              Has repartido a partes iguales. Solo valdría si las dos tuberías
              fueran idénticas; aquí la 2 es más ancha y por eso se lleva más,
              aunque también sea más larga.
          - valor: '55.8 l/s'
            mensaje: |
              Has repartido solo por el diámetro, sin contar las longitudes.
              La 2 es un 33 % más larga, y eso le quita parte de la ventaja
              que le da ser más ancha.
        pista: |
          $J_1 L_1 Q_1^{1{,}852} = J_1' L_2 Q_2^{1{,}852}$, con
          $J_1 = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D^{4{,}87})$ y D en mm.
        desarrollo: |
          Igualando las pérdidas de las dos ramas, y como el $C_{HW}$ es el
          mismo, todo se reduce a los diámetros y las longitudes:

          $$
          \left(\frac{Q_2}{Q_1}\right)^{1{,}852} = \frac{L_1}{L_2}\left(\frac{D_2}{D_1}\right)^{4{,}87} = \frac{1800}{2400}\cdot 1{,}2^{4{,}87} = 1{,}8225
          $$

          $$
          \frac{Q_2}{Q_1} = 1{,}8225^{1/1{,}852} = 1{,}383
          $$

          Con $Q_1 + Q_2 = 146$ l/s salen **Q₁ = 61,2 l/s** y
          **Q₂ = 84,7 l/s**, y las dos pierden 0,339 m.

      - tipo: calcular
        titulo: El caudal de la tubería 3
        pregunta: |
          Caudal Q₃, y en qué sentido circula. La tubería 4 lleva 750 l/s del
          nudo al depósito C.
        respuesta:
          tipo: magnitud
          valor: '604 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '896 l/s'
            mensaje: |
              Has sumado en vez de restar. Si la 3 aportara al nudo, la
              continuidad sería $Q_1+Q_2+Q_3 = Q_4$, y el que sale es 750: los
              que entran tienen que sumar 750, no 896.
          - valor: '750 l/s'
            mensaje: |
              Eso es Q₄. Por la 3 pasa lo que le falta al nudo para completar
              los 750 que salen hacia C, una vez descontados los 146 que
              llegan de A.
        pista: |
          Escribe la pérdida de la 4 y la de la 3 y comprueba si la energía
          del nudo cabe por debajo de la cota de B. Después, continuidad.
        desarrollo: |
          La tubería 4 pierde

          $$
          h_{f4} = J_1(800)\cdot 3000\cdot 750^{1{,}852} = 5{,}92\ \text{m}
          $$

          de modo que la energía del nudo es $B_N = 48 + 5{,}92 = 53{,}92$ m.
          Y como $B_N < Z_B = 60$, **el agua de la tubería 3 va del depósito B
          al nudo**, no al revés.

          La continuidad en el nudo es entonces
          $Q_1 + Q_2 + Q_3 = Q_4$:

          $$
          Q_3 = 750 - 146 = 604\ \text{l/s}
          $$

          Se comprueba: $h_{f3} = J_1(700)\cdot 2400\cdot 604^{1{,}852} = 6{,}08$ m,
          y $60 - 6{,}08 = 53{,}92$, la misma energía de nudo. Las dos vías
          coinciden, que es la señal de que el reparto es el bueno.

      - tipo: calcular
        titulo: La cota del depósito A
        pregunta: |
          Cota Z_A de la lámina del depósito A.
        respuesta:
          tipo: magnitud
          valor: '54.19 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '60.3 m'
            mensaje: |
              Has tomado la cota de B como energía del nudo. B está a 60 pero
              el nudo está a 53,92: entre los dos hay 6,08 m de pérdida en la
              tubería 3.
          - valor: '48.3 m'
            mensaje: |
              Has tomado la cota de C como energía del nudo. El nudo está por
              encima de C —si no, no saldría agua hacia allí—: 5,92 m por
              encima.
        pista: |
          $Z_A = B_N + h_{f1}$, con $h_{f1}$ la pérdida de cualquiera de las
          dos ramas en paralelo, que valen lo mismo.
        desarrollo: |
          $$
          h_{f1} = J_1(500)\cdot 1800\cdot 61{,}2^{1{,}852} = 0{,}339\ \text{m}
          $$

          $$
          Z_A = 53{,}92 + 0{,}34 = 54{,}26\ \text{m}
          $$

          —el boletín publica 54,19, y la diferencia está en la tercera cifra
          de los redondeos intermedios—.

          Y aquí hay algo que llama la atención: **A está más bajo que B**, con
          54,26 contra 60. El depósito grande no es el que manda; el que manda
          es B, que aporta cuatro veces más caudal que A.

      - tipo: calcular
        titulo: La tubería única que sustituye a las dos
        pregunta: |
          Longitud L₅ de una única tubería de 700 mm que sustituya a las dos
          en paralelo sin que cambien los caudales.
        respuesta:
          tipo: magnitud
          valor: '1856 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '89.6 m'
            mensaje: |
              Has metido los 750 l/s. Por la tubería 5 pasa lo que pasaba por
              las dos que sustituye: 146 l/s.
          - valor: '360 m'
            mensaje: |
              Has usado el $J_1$ de 500 mm. La tubería 5 es de 700, y su $J_1$
              es cinco veces menor: necesita cinco veces más longitud para
              perder lo mismo.
        pista: |
          Que «el comportamiento hidráulico no varíe» significa que la
          tubería 5 pierda los mismos 0,339 m llevando los 146 l/s.
        desarrollo: |
          $$
          0{,}339 = J_1(700)\cdot L_5\cdot 146^{1{,}852} \;\Longrightarrow\; L_5 = 1856\ \text{m}
          $$

          Fíjate en lo que significa: las dos tuberías en paralelo —1800 m de
          500 y 2400 m de 600— se comportan igual que **una sola de 700 mm y
          1856 m**. Menos tubería y más ancha, para el mismo resultado.

      - tipo: justificar
        pregunta: Ordena el apartado d), la cota que dejaría la tubería 3 sin caudal. Una pieza es falsa.
        piezas:
          - texto: 'Si Q₃ = 0, la tubería 3 no pierde nada, así que la energía del nudo pasa a ser exactamente la cota de B: 60 m.'
          - texto: 'Con el nudo a 60 y C a 48, la tubería 4 dispone de 12 m de pérdida, y eso la hace llevar 1098 l/s en vez de 750.'
          - texto: 'Todo ese caudal tiene que venir por la tubería 5, que pierde entonces 14,2 m.'
          - texto: 'Luego la lámina de A tendría que estar a 60 + 14,2 = 74,2 m, veinte metros por encima de donde está.'
          - texto: Con Q₃ = 0 el caudal de la tubería 4 sigue siendo 750 l/s, porque lo único que cambia es que B deja de aportar.
            trampa: true
            mensaje: |
              El caudal de la 4 lo fija su pérdida de carga, y esa ha cambiado:
              antes eran 5,92 m y ahora son 12. Con Hazen-Williams,
              $Q \propto h_f^{1/1{,}852}$, así que pasa de 750 a 1098 l/s.
              Nada en la red se queda quieto cuando se mueve una cota.
    resolucion: |
      ## Lo primero es averiguar hacia dónde va el agua

      Una red de tres depósitos tiene una pregunta antes que cualquier
      cálculo: **¿en qué sentido circula cada tubería?** Y se responde
      comparando la energía del nudo con las cotas.

      Aquí hay un dato que lo desbloquea todo: Q₄ = 750 l/s. Con él,

      $$
      h_{f4} = J_1(800)\cdot 3000\cdot 750^{1{,}852} = 5{,}92\ \text{m} \;\Longrightarrow\; B_N = 48 + 5{,}92 = 53{,}92\ \text{m}
      $$

      Y como 53,92 es **menor** que los 60 de B, el depósito B no recibe: da.
      La tubería 3 va de B al nudo. Con eso, la continuidad se escribe con los
      tres entrando y uno saliendo:

      $$
      Q_1 + Q_2 + Q_3 = Q_4 = 750\ \text{l/s}
      $$

      ## El reparto de las dos en paralelo

      Las tuberías 1 y 2 unen los mismos dos puntos, así que **pierden lo
      mismo**. Con Hazen-Williams y el mismo $C_{HW} = 140$ para todas —el
      fibrocemento tiene ε = 0,01 cm y en estos diámetros la relación ε/D cae
      entre 1,25 y 2·10⁻⁴, que es la banda del 140 en el Cuadro nº 25—:

      $$
      \left(\frac{Q_2}{Q_1}\right)^{1{,}852} = \frac{L_1}{L_2}\left(\frac{D_2}{D_1}\right)^{4{,}87} = 1{,}8225 \;\Longrightarrow\; \frac{Q_2}{Q_1} = 1{,}383
      $$

      El exponente 4,87 del diámetro es el que manda: un 20 % más de diámetro
      compensa de sobra un 33 % más de longitud.

      | | Q [l/s] | $h_f$ [m] |
      |---|---|---|
      | 1 (500 mm, 1800 m) | 61,2 | 0,339 |
      | 2 (600 mm, 2400 m) | 84,7 | 0,339 |
      | 3 (700 mm, 2400 m) | 604 | 6,08 |
      | 4 (800 mm, 3000 m) | 750 | 5,92 |

      Y de ahí $Z_A = 53{,}92 + 0{,}34 = 54{,}26$ m.

      **A está más bajo que B**, y eso no es un error: el depósito que manda en
      esta red es B, que aporta 604 de los 750 l/s. A pone los otros 146 con
      apenas 34 centímetros de desnivel, porque sus tuberías son cortas y
      anchas para el poco caudal que llevan.

      ## c) Dos en paralelo son una sola equivalente

      Que «el comportamiento hidráulico no varíe» quiere decir que la tubería
      5 pierda los mismos 0,339 m llevando los mismos 146 l/s:

      $$
      L_5 = \frac{0{,}339}{J_1(700)\cdot 146^{1{,}852}} = 1856\ \text{m}
      $$

      Es decir: 1800 m de 500 mm **más** 2400 m de 600 mm equivalen a 1856 m
      de 700 mm. Cuatro mil doscientos metros de tubería sustituidos por mil
      ochocientos.

      ## d) Y qué pasa si se sube A

      El apartado d) pide la cota que dejaría la tubería 3 sin caudal. Si
      Q₃ = 0, la 3 no pierde nada y el nudo se pone exactamente a la cota de
      B: $B_N = 60$ m.

      Ahora la tubería 4 tiene 12 m de pérdida disponible en vez de 5,92, y
      **el caudal sube con ella**:

      $$
      Q_4 = \left(\frac{12}{J_1(800)\cdot 3000}\right)^{1/1{,}852} = 1098\ \text{l/s}
      $$

      Todo eso tiene que venir por la tubería 5, que pierde entonces 14,2 m, y
      la lámina de A tiene que estar en

      $$
      Z_A = 60 + 14{,}2 = 74{,}2\ \text{m}
      $$

      Veinte metros más arriba. La lección de la red es esa: **no se puede
      mover una cota y esperar que lo demás se quede quieto.** Subir A no solo
      apaga la tubería 3; también acelera la 4, porque la energía del nudo ha
      subido y con ella la pérdida disponible aguas abajo.

  - id: ejflu19-col629-la-bomba-con-by-pass-y-las-dos-valvulas
    titulo: La bomba con by-pass, y las dos válvulas
    fuente: Ejercicio 6.29 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Una instalación de bombeo para llevar agua alimenta a dos depósitos E y
      F. La bomba, que absorbe 50 kW del motor de arrastre ($\eta = 0{,}7$),
      dispone de un by-pass con una válvula esférica de regulación V₁.
      Despreciando las pérdidas menores, excepto las producidas en las válvulas
      esféricas V₁ y V₂, cuyo factor de paso depende del grado de apertura,
      siendo 0 cuando la válvula está completamente abierta, se pide:

      **a)** Factor de paso de las válvulas V₁ y V₂ para que Q₂ = Q₃ = 40 l/s.
      ¿Cuál será el punto de funcionamiento de la bomba (H, Q)?

      **b)** ¿Cuál será el máximo caudal Q₃ posible? ¿Con qué posición de las
      válvulas se producirá?

      **c)** Si las válvulas V₁ y V₂ están cerradas y la bomba parada, no
      creando ésta ninguna pérdida adicional, ¿qué caudal retornará del
      depósito F al depósito de aspiración A?

      **Nota:** tuberías de acero comercial. Utilícese Hazen-Williams.
      Despreciar la longitud de tubería AB.

      | | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | D [mm] | 200 | 200 | 150 | 150 |
      | L [m] | 0 | 40 | 35 | 50 |

