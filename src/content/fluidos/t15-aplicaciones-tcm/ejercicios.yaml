        <path d="M300,240 A60,60 0 0 0 282,198" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="302" y="226" font-size="11" fill="var(--faint)">45°</text>
        <line x1="240" y1="380" x2="240" y2="356" stroke="var(--live)" stroke-width="2" marker-end="url(#m46j)"/>
        <text x="196" y="330" text-anchor="end" font-size="10.5" fill="var(--faint)">Q = 600 l/s</text>
