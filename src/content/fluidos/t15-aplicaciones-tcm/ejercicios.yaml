        <line x1="240" y1="240" x2="170" y2="119" stroke="var(--ink)" stroke-width="24" opacity="0.16"/>
        <line x1="240" y1="240" x2="350" y2="130" stroke="var(--ink)" stroke-width="48" opacity="0.16"/>
        <line x1="240" y1="352" x2="240" y2="240" stroke="var(--ink)" stroke-width="2" stroke-dasharray="8 5"/>
        <line x1="240" y1="240" x2="170" y2="119" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="8 5"/>
        <line x1="240" y1="240" x2="350" y2="130" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="8 5"/>
        <line x1="150" y1="240" x2="236" y2="240" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M196,240 A44,44 0 0 1 218,201" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="186" y="226" font-size="11" fill="var(--faint)">60°</text>
