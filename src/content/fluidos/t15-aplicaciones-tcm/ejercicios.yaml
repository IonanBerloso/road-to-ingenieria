      <figcaption>La entrada sube vertical y la Y se abre en dos ramas de tamaños muy distintos. Los anchos van a escala: la rama estrecha se lleva el 40 % del caudal con la cuarta parte de la sección.</figcaption>
      </figure>
    pide: Las dos componentes de la fuerza que el agua ejerce sobre la pieza en Y.
    pasos:
      - tipo: reconocer
        pregunta: |
          Por la rama de 15 cm salen 240 l/s y por la de 30 cm, 360. ¿Qué
          ocurre con las presiones en las dos salidas?
        opciones:
          - texto: La de 15 cm queda mucho más baja, porque su velocidad es casi el triple y la altura cinética va al cuadrado
            correcta: true
            mensaje: |
              Eso es. V₂ = 13,58 m/s frente a V₃ = 5,09, así que la rama
              estrecha se come casi toda la presión: queda en 12,9 kPa contra
              los 92,1 de la ancha. La misma pieza tiene dos presiones de
              salida muy distintas.
          - texto: Las dos son iguales, porque las dos salen de la misma pieza
            mensaje: |
              Lo que es igual es la **energía** en las dos, no la presión. Al
              repartirse entre presión y velocidad, la rama más rápida se
              queda con menos presión.
          - texto: Las dos son iguales a la de entrada, porque no hay pérdidas
            mensaje: |
              Sin pérdidas se conserva la energía total, no la presión. La
              presión baja en cuanto la velocidad sube, y aquí sube en las dos
              ramas.

      - tipo: calcular
        titulo: La presión en la rama estrecha
        pregunta: |
          Presión manométrica en la salida de la rama 2, la de 15 cm, sin
          considerar pérdidas.
        respuesta:
          tipo: magnitud
          valor: '12.9 kPa'
          tolerancia: 0.02
          formato: una presión con su unidad (kPa, Pa o mca)
        distractores:
          - valor: '183 kPa'
            mensaje: |
              Has cambiado el signo. La velocidad **sube** de 3,77 a
              13,58 m/s, así que la presión tiene que **bajar**: la energía se
              transforma, no se crea.
          - valor: '98 kPa'
            mensaje: |
              Esa es la presión de entrada. En la rama estrecha el agua se
              acelera mucho, y esa aceleración se paga con presión.
        pista: |
          Bernoulli entre 1 y 2, mismo plano y sin pérdidas:
          $p_2 = p_1 + \frac{\rho}{2}(V_1^{2} - V_2^{2})$.
        desarrollo: |
          $$
          V_1 = \frac{0{,}600}{0{,}15904} = 3{,}77\ \text{m/s} \qquad V_2 = \frac{0{,}240}{0{,}017671} = 13{,}58\ \text{m/s}
          $$

          $$
          p_2 = 98\,000 + 500\,(3{,}77^{2} - 13{,}58^{2}) = 12\,891\ \text{Pa} = 12{,}9\ \text{kPa}
          $$

          Y en la rama ancha, con $V_3 = 5{,}09$ m/s, queda
          $p_3 = 92{,}1$ kPa: siete veces más.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          Componente horizontal Fx de la fuerza que el agua ejerce sobre la
          pieza. La rama 2 forma 60° con la horizontal y la 3, 45°.
        respuesta:
          tipo: magnitud
          valor: '4.16 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '2.88 kN'
            mensaje: |
              Has medido los 60° desde la vertical. La figura los marca desde
              la **horizontal**, y el cambio mueve la componente horizontal un
              44 %.
          - valor: '3.70 kN'
            mensaje: |
              Has usado la presión de entrada en las dos salidas. La rama
              estrecha sale a 12,9 kPa, no a 98: ahí el término de presión es
              casi despreciable frente al de cantidad de movimiento.
        pista: |
          En cada boca, el término que empuja es $p A + \dot m V$. Se proyecta
          cada uno en su dirección y se restan los de salida del de entrada.
        desarrollo: |
          En cada sección, la suma de presión y cantidad de movimiento:

          | | $pA$ | $\dot m V$ | total |
          |---|---|---|---|
          | 1 (45 cm) | 15 586 N | 2264 N | 17 850 N |
          | 2 (15 cm) | 228 N | 3260 N | 3487 N |
          | 3 (30 cm) | 6513 N | 1834 N | 8347 N |

          Con la entrada vertical, $\hat e_2 = (-0{,}5;\ 0{,}866)$ y
          $\hat e_3 = (0{,}707;\ 0{,}707)$:

          $$
          F_x = -3487\,(-0{,}5) - 8347\,(0{,}707) = 1744 - 5902 = -4159\ \text{N}
          $$

          Es decir **4,16 kN hacia la izquierda**. Fíjate en la rama 2: sus
          228 N de presión no pintan nada, y lo que empuja son los 3260 N de
          cantidad de movimiento. En la rama 3 es al revés.

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          Componente vertical Fy de la fuerza sobre la pieza.
        respuesta:
          tipo: magnitud
          valor: '8.93 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '10.2 kN'
            mensaje: |
              Has medido los 60° desde la vertical. Con el ángulo bien medido
              la rama 2 empuja más hacia arriba y menos hacia la izquierda.
          - valor: '13.7 kN'
            mensaje: |
              Te has dejado las presiones de salida. La rama de 30 cm sale
              todavía a 92 kPa, y sobre sus 707 cm² eso son 6,5 kN que no se
              pueden ignorar.
        pista: |
          $F_y = 17\,850 - 3487\cdot 0{,}866 - 8347\cdot 0{,}707$.
        desarrollo: |
          $$
          F_y = 17\,850 - 3020 - 5902 = 8928\ \text{N} = 8{,}93\ \text{kN}
          $$

          hacia arriba. El módulo de la resultante es 9,85 kN, inclinado 65°
          respecto de la horizontal.

      - tipo: justificar
        pregunta: Ordena de dónde viene la fuerza sobre la Y. Una pieza es falsa.
        piezas:
          - texto: 'Por la entrada llegan 17,85 kN hacia arriba: 15,6 de presión sobre los 1590 cm² de la sección de 45 cm y 2,3 de cantidad de movimiento.'
          - texto: 'Por la rama estrecha salen 3,49 kN, casi todo cantidad de movimiento, porque su presión ha caído a 12,9 kPa.'
          - texto: 'Por la rama ancha salen 8,35 kN, y ahí es al revés: 6,5 son de presión y 1,8 de cantidad de movimiento.'
          - texto: 'Restando cada salida en su dirección quedan 4,16 kN hacia la izquierda y 8,93 hacia arriba.'
          - texto: La rama estrecha, al llevar menos caudal, es la que menos empuja sobre la pieza.
            trampa: true
            mensaje: |
              Lleva menos caudal pero mucha más velocidad, y la cantidad de
              movimiento va con el producto de los dos: 3260 N frente a los
              1834 de la rama ancha. **La rama estrecha empuja casi el doble
              que la ancha** en cantidad de movimiento; lo que no tiene es
              presión.
    resolucion: |
      ## Dos salidas que no se parecen en nada

      La Y reparte 600 l/s en 240 y 360, pero las secciones son de 15 y 30 cm:
      un factor de cuatro en área. El resultado es que la rama pequeña, con
      menos caudal, va casi al triple de velocidad.

      | | D | Q | V | p |
      |---|---|---|---|---|
      | 1 | 45 cm | 600 l/s | 3,77 m/s | 98,0 kPa |
      | 2 | 15 cm | 240 l/s | 13,58 m/s | 12,9 kPa |
      | 3 | 30 cm | 360 l/s | 5,09 m/s | 92,1 kPa |

      Las presiones de salida salen de Bernoulli, y la de la rama estrecha
      queda en nada: casi toda la presión de entrada se ha convertido en
      velocidad.

      ## El balance, sección a sección

      En cada boca lo que empuja es $pA + \dot m V$, y esos dos términos se
      reparten de forma muy distinta según la rama:

      | | $pA$ | $\dot m V$ |
      |---|---|---|
      | 1 | 15 586 N | 2264 N |
      | 2 | **228 N** | **3260 N** |
      | 3 | **6513 N** | **1834 N** |

      En la rama estrecha manda la cantidad de movimiento; en la ancha, la
      presión. Y contra la intuición, **la rama estrecha empuja más que la
      ancha en cantidad de movimiento**, aunque lleve menos caudal: 3260 N
      contra 1834.

      ## El resultado

      Con la entrada vertical, la rama 2 a 60° de la horizontal y la 3 a 45°:

      $$
      F_x = -4{,}16\ \text{kN} \qquad F_y = +8{,}93\ \text{kN}
      $$

      o sea 4,16 kN hacia la izquierda y 8,93 hacia arriba, 9,85 kN en total.

      ## El error que no se ve

      Los 60° están medidos **desde la horizontal**. Tomarlos desde la
      vertical da 2,88 y 10,20 kN: números perfectamente plausibles, del mismo
      orden, que nadie detectaría revisando. Cuando un enunciado da un ángulo
      con una figura, merece la pena escribir explícitamente respecto de qué
      se ha medido antes de sustituir; es la clase de error que solo aparece
      al comparar con la solución.
