ejercicios:
  # ── Los dos son NUESTROS (§08). El capítulo 4 de la colección resuelve el
  #    TCM sobre figuras acotadas —codos en planta, derivaciones, álabes con
  #    ángulos medidos en el dibujo—, y reproducirlas exige dibujarlas. Estos
  #    dos aíslan el álabe fijo y el móvil; el codo está en el tema 14, que es
  #    donde se enuncia el teorema.
  - id: ejflu15-el-alabe-fijo
    titulo: La fuerza sobre un álabe, y por qué 180 grados da el doble
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un chorro de agua de $30\ \text{l/s}$ y $20\ \text{m/s}$ incide
      tangencialmente sobre un álabe **fijo** que lo desvía un ángulo
      $\theta$ respecto de su dirección original.

      a) Calcular la fuerza sobre el álabe si $\theta = 90°$.

      b) Calcular la fuerza si $\theta = 180°$.

      Despreciar el rozamiento; $\rho = 1000\ \text{kg/m}^{3}$.
    pide: Las componentes de la fuerza en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin rozamiento y a presión atmosférica, ¿qué le pasa al **módulo**
          de la velocidad al atravesar el álabe?
        opciones:
          - texto: >-
              No cambia: $v_1 = v_2 = v$. Bernoulli entre entrada y salida,
              con la misma presión y la misma cota, deja iguales las alturas
              cinéticas
            correcta: true
            mensaje: |
              Eso es, y es lo que hace manejable el problema: el chorro
              cambia de **dirección** pero no de rapidez. Toda la variación de
              cantidad de movimiento es vectorial.
          - texto: >-
              Disminuye, porque el álabe le quita energía
            mensaje: |
              Un álabe **fijo** no absorbe energía: no se desplaza, así que no
              hace trabajo. Solo la absorbe si se mueve, y ese es el caso del
              álabe móvil.
          - texto: >-
              Depende del ángulo de desviación
            mensaje: |
              El ángulo cambia la **dirección** de la velocidad de salida,
              no su módulo. Por eso la fuerza sí depende de $\theta$ y la
              rapidez no.

      - tipo: calcular
        titulo: La fuerza con noventa grados
        pregunta: |
          Con $\theta = 90°$, ¿cuánto vale la componente $F_x$?
        respuesta:
          tipo: magnitud
          valor: '600 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1200 N'
            mensaje: |
              Ese es el caso de $180°$. Con $90°$,
              $1-\cos 90° = 1$, así que $F_x = \rho Q v = 600\ \text{N}$.
          - valor: '0.6 N'
            mensaje: |
              Un factor mil: el caudal son $0{,}03\ \text{m}^{3}/\text{s}$ y
              la densidad $1000\ \text{kg/m}^{3}$, así que
              $\rho Q = 30\ \text{kg/s}$.
        pista: |
          Fx = ρ·Q·v·(1 − cos θ), con θ = 90°.
        desarrollo: |
          $$
          F_x = \rho Q v(1-\cos 90°) = 1000\cdot0{,}03\cdot20\cdot1 = 600\ \text{N}
          $$

          Y la componente $y$ vale lo mismo,
          $F_y = \rho Q v\sin 90° = 600\ \text{N}$, así que la resultante es
          $848{,}5\ \text{N}$ a $45°$.

      - tipo: calcular
        titulo: La fuerza con ciento ochenta grados
        pregunta: |
          Y si el álabe devuelve el chorro por donde vino, ¿cuánto vale
          $F_x$?
        respuesta:
          tipo: magnitud
          valor: '1200 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '600 N'
            mensaje: |
              Es el doble, no lo mismo: la cantidad de movimiento pasa de
              $+\rho Q v$ a $-\rho Q v$, así que la variación es $2\rho Qv$.
              Con $1-\cos 180° = 2$.
          - valor: '0 N'
            mensaje: |
              Cero sería si el chorro **no** se desviara ($\theta = 0$). Al
              devolverlo, el cambio de cantidad de movimiento es el máximo
              posible.
        pista: |
          1 − cos 180° = 2.
        desarrollo: |
          $$
          F_x = \rho Q v(1-\cos 180°) = 600\cdot2 = 1200\ \text{N}
          $$

          Y $F_y = 0$, porque el chorro sale en la misma recta por la que
          entró.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli con las cuatro hipótesis del álabe deja $v_1 = v_2 = v$.
          - texto: >-
              TCM en $x$: $F_x = \rho Q(v - v\cos\theta) = \rho Qv(1-\cos\theta)$.
          - texto: >-
              Con $\theta = 90°$: $F_x = F_y = 600\ \text{N}$, resultante
              $848{,}5\ \text{N}$.
          - texto: >-
              Con $\theta = 180°$: $F_x = 1200\ \text{N}$ y $F_y = 0$.
          - texto: >-
              En general, el módulo vale $2\rho Qv\sin(\theta/2)$, que en
              $180°$ da el máximo.
          - texto: >-
              Como el álabe está fijo, la fuerza que recibe no hace trabajo y
              por tanto es nula.
            trampa: true
            mensaje: |
              No hacer trabajo y ser nula son cosas distintas. La fuerza vale
              $1200\ \text{N}$ y hay que aguantarla con el anclaje; lo que no
              hace es **trabajo**, porque su punto de aplicación no se
              desplaza. Si el álabe se moviera, la misma fuerza sí produciría
              potencia.

    resolucion: |
      Con las hipótesis del álabe, $v_1 = v_2 = v$ y solo cambia la dirección:

      $$
      \boxed{\theta = 90°:\quad F_x = F_y = \rho Qv = 600\ \text{N},\quad |F| = 848{,}5\ \text{N}}
      $$
      $$
      \boxed{\theta = 180°:\quad F_x = 2\rho Qv = 1200\ \text{N},\quad F_y = 0}
      $$

      > **Por qué las cucharas de una Pelton son dobles y muy curvadas.**
      > Porque el factor $(1-\cos\theta)$ vale 1 a noventa grados y **2** a
      > ciento ochenta: acercarse todo lo posible a devolver el chorro duplica
      > la fuerza sin gastar una gota más de agua.

  - id: ejflu15-el-alabe-movil
    titulo: El álabe que se mueve, y a qué velocidad conviene que gire
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      El mismo chorro del ejercicio anterior ($v = 20\ \text{m/s}$, sección
      $A = 15\ \text{cm}^{2}$) incide sobre una **rueda de álabes** que
      desvían el chorro $180°$. La rueda avanza con velocidad $u$ en la
      dirección del chorro.

      a) Escribir la potencia entregada en función de $u$.

      b) ¿Para qué $u$ es máxima, y cuánto vale?

      Tomar $\rho = 1000\ \text{kg/m}^{3}$.
    pide: La expresión de la potencia y su máximo.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una **rueda** de álabes, ¿qué caudal aprovecha la máquina?
        opciones:
          - texto: >-
              Todo el del chorro, $Q = A\,v$: siempre hay una cuchara
              recibiéndolo, aunque cada una se escape
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue la rueda del álabe suelto. Con un
              álabe único el caudal interceptado sería $A(v-u)$ y el óptimo
              saldría en $u = v/3$; con rueda, en $u = v/2$.
          - texto: >-
              Solo $A(v-u)$, porque los álabes huyen del chorro
            mensaje: |
              Eso vale para **un** álabe aislado. En una rueda, cuando una
              cuchara se aleja ya está entrando la siguiente, así que no se
              desperdicia nada del chorro.
          - texto: >-
              $A\,u$, el que barre la rueda
            mensaje: |
              El caudal lo fija el chorro, no la rueda: es $Av$, y no depende
              de a qué velocidad gire la máquina.

      - tipo: calcular
        titulo: La velocidad óptima
        pregunta: |
          ¿A qué velocidad debe avanzar la rueda para dar potencia máxima?
        respuesta:
          tipo: magnitud
          valor: '10 m/s'
          tolerancia: 0.01
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.67 m/s'
            mensaje: |
              Ese es el óptimo de un álabe **suelto** ($u = v/3$), que
              intercepta menos caudal al escaparse. Con una rueda,
              $u = v/2 = 10\ \text{m/s}$.
          - valor: '20 m/s'
            mensaje: |
              Con $u = v$ el álabe se mueve tan rápido como el chorro: la
              velocidad relativa es cero, no hay fuerza y la potencia es
              **nula**. El óptimo está en medio.
        pista: |
          Pot ∝ (v − u)·u. Deriva e iguala a cero.
        desarrollo: |
          $$
          \text{Pot} = \rho A v\,(v-u)\,(1-\cos180°)\,u = 2\rho A v\,(v-u)\,u
          $$

          El producto $(v-u)u$ es máximo en el punto medio del intervalo
          $[0,v]$:

          $$
          u = \frac{v}{2} = 10\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La potencia máxima
        pregunta: |
          ¿Cuánta potencia entrega en ese punto?
        respuesta:
          tipo: magnitud
          valor: '6 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '3.56 kW'
            mensaje: |
              Es la del álabe suelto en su propio óptimo. Con rueda, todo el
              caudal trabaja y salen $6\ \text{kW}$.
          - valor: '12 kW'
            mensaje: |
              Has usado $u = v$ en el factor $u$ y $v/2$ en el otro. Con
              $u = v/2$: $2\cdot1000\cdot0{,}03\cdot10\cdot10 = 6000\ \text{W}$.
        pista: |
          Pot = 2·ρ·A·v·(v − u)·u con u = 10 m/s, y A·v = 0,03 m³/s.
        desarrollo: |
          $$
          \text{Pot} = 2\rho\,(Av)\,(v-u)\,u = 2\cdot1000\cdot0{,}03\cdot10\cdot10
          = 6000\ \text{W} = 6\ \text{kW}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que empuja es la velocidad **relativa** $v-u$, no la
              absoluta.
          - texto: >-
              En una rueda el caudal aprovechado es $Av$, todo el del chorro.
          - texto: >-
              $\text{Pot} = 2\rho Av(v-u)u$, que es máxima en $u = v/2$.
          - texto: >-
              Con $u = 10\ \text{m/s}$: $\text{Pot} = 6\ \text{kW}$.
          - texto: >-
              Y ese máximo coincide con la potencia cinética del chorro,
              $\tfrac12\rho Av^{3} = 6\ \text{kW}$: rendimiento teórico del
              100 %, porque el agua sale con velocidad absoluta nula.
          - texto: >-
              Si la rueda se frenara del todo ($u = 0$), la potencia sería
              máxima, porque la fuerza sobre los álabes es la mayor posible.
            trampa: true
            mensaje: |
              La fuerza sí es máxima con la rueda parada, pero la **potencia**
              es fuerza por velocidad, y con $u = 0$ vale cero: una turbina
              bloqueada no produce nada. Los dos extremos dan potencia nula
              —$u=0$ y $u=v$— y el máximo está justo en medio.

    resolucion: |
      Con velocidad relativa $v-u$, caudal aprovechado $Av$ y $\theta = 180°$:

      $$
      \boxed{\text{Pot} = 2\rho\,A\,v\,(v-u)\,u}
      $$

      El producto $(v-u)u$ es máximo en $u = v/2$:

      $$
      \boxed{u = 10\ \text{m/s}}
      \qquad
      \boxed{\text{Pot}_{\max} = 6\ \text{kW}}
      $$

      > **El resultado que se usa para diseñar una Pelton.** La rueda gira a
      > la mitad de la velocidad del chorro, y en ese punto el rendimiento
      > teórico es del 100 %: el agua abandona la cuchara con velocidad
      > absoluta nula, habiendo entregado toda su energía. En la práctica se
      > queda en el 85–90 % por rozamiento y por no llegar a los 180°
      > exactos.

  # ── COLECCIÓN 4.4. El codo de 90° con pérdidas: el caso base del tema, con
  #    el término de presión mandando por treinta y cinco a uno.
  - id: ejflu15-col44-el-codo-de-noventa-grados
    titulo: La fuerza sobre un codo de noventa grados
    fuente: >-
      Ejercicio 4.4 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una tubería de $60\ \text{cm}$ de diámetro que transporta
      $900\ \text{l/s}$ de un aceite de peso específico relativo $0{,}85$
      tiene un codo de $90°$ en un plano horizontal. La pérdida de carga en el
      codo es de $1{,}10\ \text{mc}$ de aceite y la presión a la entrada es de
      $3\ \text{kg/cm}^{2}$. Se pide:

      a) Fuerza resultante ejercida por el aceite sobre el codo.
    pide: El módulo de la fuerza que el aceite ejerce sobre el codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El diámetro no cambia y el codo es horizontal. ¿Qué se deduce de la
          pérdida de carga?
        opciones:
          - texto: >-
              Que la presión de salida es la de entrada menos
              $1{,}10\ \text{mc}$ de aceite, porque ni la cota ni la velocidad
              cambian
            correcta: true
            mensaje: |
              Eso es. Con $z$ y $v$ iguales a los dos lados, Bernoulli se
              reduce a $p_1/\gamma - h_f = p_2/\gamma$: la pérdida se ve
              entera como caída de presión.
          - texto: >-
              Que la velocidad de salida es menor que la de entrada
            mensaje: |
              La velocidad la fija la continuidad, y con el mismo diámetro es
              la misma. Lo que pierde el fluido es presión, no velocidad.
          - texto: >-
              Que hay que restar la pérdida a la fuerza resultante
            mensaje: |
              La pérdida no se resta a una fuerza: entra cambiando la presión
              de salida, y esa presión sí aparece en el balance de cantidad de
              movimiento.

      - tipo: calcular
        titulo: La componente en la dirección de entrada
        pregunta: |
          ¿Cuánto vale la componente de la fuerza en el eje de entrada?
        respuesta:
          tipo: magnitud
          valor: '85.56 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '83.13 kn'
            mensaje: |
              Te has dejado el término de cantidad de movimiento. Es pequeño
              —$2{,}4\ \text{kN}$ frente a $83$— pero forma parte del balance,
              y en el examen se penaliza omitirlo.
          - valor: '2.435 kn'
            mensaje: |
              Solo has contado el término de cantidad de movimiento. Falta el
              de presión, $p_1 A$, que aquí es treinta y cuatro veces mayor.
        pista: |
          $p_1 A + R_x = \rho Q(0 - v)$, con $A = \pi\,0{,}6^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}9}{0{,}2827} = 3{,}183\ \text{m/s}
          \qquad
          p_1 A = 294\,000\cdot 0{,}2827 = 83{,}13\ \text{kN}
          $$
          $$
          |R_x| = p_1 A + \rho Q v = 83{,}13 + 2{,}44 = 85{,}56\ \text{kN}
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuál es el módulo de la fuerza sobre el codo?
        respuesta:
          tipo: magnitud
          valor: '119.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '168.5 kn'
            mensaje: |
              Has sumado las dos componentes como escalares. Son
              perpendiculares: hay que componerlas con el teorema de
              Pitágoras.
          - valor: '115.7 kn'
            mensaje: |
              Te has dejado el término de cantidad de movimiento en los dos
              ejes. Son solo $2{,}4\ \text{kN}$ en cada uno, pero al
              componerlos el resultado baja tres kilonewton y medio.
        pista: |
          Calcula la componente del eje de salida con $p_2$, y compón las dos.
        desarrollo: |
          $$
          \frac{p_2}{\gamma} = \frac{294\,000}{8330} - 1{,}10 = 34{,}19\ \text{mcl}
          \;\Longrightarrow\;
          p_2 = 284{,}8\ \text{kPa}
          $$
          $$
          |R_y| = p_2 A + \rho Q v = 80{,}54 + 2{,}44 = 82{,}97\ \text{kN}
          $$
          $$
          |R| = \sqrt{85{,}56^{2}+82{,}97^{2}} = 119{,}2\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con diámetro constante y codo horizontal, la pérdida de carga se
              ve entera como caída de presión: de 3 a
              $2{,}91\ \text{kg/cm}^{2}$.
          - texto: >-
              Cada eje lleva su fuerza de presión más su flujo de cantidad de
              movimiento: $85{,}6$ y $83{,}0\ \text{kN}$.
          - texto: >-
              La resultante es su composición vectorial, $119{,}2$ kN, a unos
              $44°$ de la dirección de entrada.
          - texto: >-
              La resultante saldría casi igual despreciando la pérdida de
              carga, así que el dato de $1{,}10\ \text{mc}$ es prescindible.
            trampa: true
            mensaje: |
              Cambia el resultado en un 1,5 % —de 121 a 119,2 kN—, que está por
              debajo de lo que se aprecia a ojo pero por encima de lo que un
              corrector tolera. Y sobre todo: **despreciar un dato que el
              enunciado da** es una decisión que hay que justificar, no una que
              se toma por comodidad.

    resolucion: |
      **Los dos ejes por separado, cada uno con sus dos términos.**

      $$
      \text{eje } x:\quad p_1 A + R_x = \rho Q(0-v)
      \qquad
      \text{eje } y:\quad -p_2 A + R_y = \rho Q(v-0)
      $$

      Con $v = 3{,}18\ \text{m/s}$, $A = 0{,}283\ \text{m}^{2}$,
      $p_1 = 294\ \text{kPa}$ y $p_2 = 284{,}8\ \text{kPa}$ tras descontar la
      pérdida:

      $$
      |R_x| = 85{,}6\ \text{kN}
      \qquad
      |R_y| = 83{,}0\ \text{kN}
      \qquad
      |R| = 119{,}2\ \text{kN}
      $$

      **Doce toneladas sobre un codo**, y ahí está el dato de ingeniería: por
      eso los codos de una conducción a presión van anclados con macizos de
      hormigón y no con tornillos.

      **Y el reparto entre los dos términos es el de siempre**: la presión
      aporta $83\ \text{kN}$ y la cantidad de movimiento $2{,}4$. Treinta y
      cuatro veces más. Quien se deje $p A$ no comete un error del 3 %, se deja
      el problema entero.

      La pérdida de carga, en cambio, sí es un detalle: mueve el resultado un
      1,5 %. Pero está en el enunciado, y un dato que se da se usa.

  # ── COLECCIÓN 4.5. Codo convergente: cambia la dirección Y el módulo de la
  #    velocidad, y las dos secciones tienen áreas distintas.
  - id: ejflu15-col45-el-codo-convergente
    titulo: Un codo que además estrecha, y las dos componentes de su anclaje
    fuente: >-
      Ejercicio 4.5 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un aceite de peso específico relativo $0{,}75$ fluye por un codo
      convergente en posición horizontal de $120°$, entre planos que pasan por
      las secciones extremas. El diámetro aguas abajo es de $600\ \text{mm}$ y
      la presión de $0{,}8\ \text{kg/cm}^{2}$. El diámetro aguas arriba es de
      $750\ \text{mm}$ y el caudal de $100\ \text{m}^{3}/\text{min}$.
      Despreciando las pérdidas de energía debidas al codo, se pide:

      a) Componentes de la fuerza (paralela y normal a la velocidad de aguas
      abajo) necesaria para soportar el codo.

      Nota: se despreciarán las energías de posición.
    pide: Las dos componentes de la fuerza de anclaje del codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El codo es «de $120°$ entre planos que pasan por las secciones
          extremas». ¿Cuánto se desvía el flujo?
        opciones:
          - texto: >-
              $60°$: el ángulo entre las secciones es el suplementario del que
              gira la corriente
            correcta: true
            mensaje: |
              Es la trampa de notación de este ejercicio, y la misma que
              aparece en los álabes. Con $120°$ entre planos, la velocidad gira
              $180° - 120° = 60°$.
          - texto: >-
              $120°$, el ángulo que da el enunciado
            mensaje: |
              El enunciado especifica «entre planos que pasan por las secciones
              extremas», que no es lo mismo que el ángulo de desviación. Con
              $120°$ de giro la fuerza saldría bastante mayor.
          - texto: >-
              $30°$, la mitad
            mensaje: |
              La mitad del ángulo aparece en la fórmula del módulo de la
              resultante de un álabe, pero no es el ángulo de desviación. Aquí
              la desviación es el suplementario, $60°$.

      - tipo: calcular
        titulo: La presión aguas arriba
        pregunta: |
          ¿Qué presión hay aguas arriba, en metros de columna de aceite?
        respuesta:
          tipo: magnitud
          valor: '11.71 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '10.67 m'
            mensaje: |
              Esa es la presión aguas **abajo**. Como el codo converge, el
              fluido se acelera y por Bernoulli la presión de entrada tiene que
              ser mayor.
          - valor: '9.62 m'
            mensaje: |
              Has restado la diferencia de alturas cinéticas en vez de
              sumarla. Aguas arriba la velocidad es menor, así que la presión
              es **mayor**.
        pista: |
          Bernoulli sin pérdidas y sin cotas:
          $p_1/\gamma = p_2/\gamma + (v_2^{2}-v_1^{2})/2g$.
        desarrollo: |
          $$
          v_1 = \frac{1{,}667}{0{,}4418} = 3{,}77\ \text{m/s}
          \qquad
          v_2 = \frac{1{,}667}{0{,}2827} = 5{,}89\ \text{m/s}
          $$
          $$
          \frac{p_1}{\gamma} = \frac{0{,}8\cdot 98\,000}{7350}
          + \frac{5{,}89^{2}-3{,}77^{2}}{19{,}6}
          = 10{,}67 + 1{,}05 = 11{,}71\ \text{mcl}
          $$

      - tipo: calcular
        titulo: La componente normal
        pregunta: |
          ¿Cuánto vale la componente **normal** a la velocidad de aguas abajo?
        respuesta:
          tipo: magnitud
          valor: '37.02 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '32.94 kn'
            mensaje: |
              Solo has contado la fuerza de presión de la entrada. Falta el
              flujo de cantidad de movimiento que entra con esa misma
              inclinación, otros $4{,}1\ \text{kN}$.
          - valor: '21.38 kn'
            mensaje: |
              Has proyectado con el coseno de $60°$ en vez de con el seno. El
              eje normal a la salida recoge la componente $\sin 60°$ de todo lo
              que entra inclinado, no la del coseno.
        pista: |
          Proyecta sobre el eje perpendicular a la salida: solo intervienen la
          presión de entrada y su cantidad de movimiento, las dos inclinadas
          $60°$.
        desarrollo: |
          Con la salida en $+x$ y la entrada girada $60°$:

          $$
          p_1 A_1\sin 60° + R_y = \rho Q(0 - v_1\sin 60°)
          $$
          $$
          R_y = -(32{,}94 + 4{,}08) = -37{,}02\ \text{kN}
          $$

      - tipo: calcular
        titulo: La componente paralela
        pregunta: |
          ¿Y la componente **paralela** a la velocidad de aguas abajo?
        respuesta:
          tipo: magnitud
          valor: '8.16 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '22.17 kn'
            mensaje: |
              Solo has contado la presión de salida. En este eje intervienen
              cuatro términos: las dos presiones y las dos cantidades de
              movimiento, y casi se cancelan.
          - valor: '3.15 kn'
            mensaje: |
              Te has dejado el flujo de cantidad de movimiento. Aquí sí importa:
              como los términos de presión casi se cancelan, los
              $5\ \text{kN}$ de la cantidad de movimiento son más de la mitad
              del resultado.
        pista: |
          $p_1A_1\cos 60° - p_2A_2 + R_x = \rho Q(v_2 - v_1\cos 60°)$.
        desarrollo: |
          $$
          R_x = \rho Q(v_2 - v_1\cos 60°) - p_1A_1\cos 60° + p_2A_2
          $$
          $$
          = 5{,}01 - 19{,}02 + 22{,}17 = 8{,}16\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              «$120°$ entre planos» significa que la corriente gira $60°$: es
              el suplementario.
          - texto: >-
              Al converger, la velocidad sube de 3,77 a 5,89 m/s y la presión
              de entrada resulta mayor que la de salida.
          - texto: >-
              Las componentes son $37{,}0\ \text{kN}$ normal y $8{,}2$
              paralela a la velocidad de salida.
          - texto: >-
              La componente paralela sale pequeña porque en esa dirección el
              flujo apenas cambia de cantidad de movimiento.
            trampa: true
            mensaje: |
              Sale pequeña porque los dos términos de **presión** casi se
              cancelan: $19{,}0$ de la entrada contra $22{,}2$ de la salida. La
              cantidad de movimiento, en cambio, aporta $5{,}0\ \text{kN}$ en
              esa dirección, que es más de la mitad del resultado.

    resolucion: |
      **Lo primero es el ángulo.** «$120°$ entre planos que pasan por las
      secciones extremas» significa que la corriente **gira $60°$**. Es la
      misma trampa de notación que en los álabes del tema, y equivocarse aquí
      arruina todo lo demás.

      **Después, Bernoulli**, porque el codo converge y el enunciado solo da la
      presión de salida:

      $$
      \frac{p_1}{\gamma} = 10{,}67 + \frac{5{,}89^{2}-3{,}77^{2}}{19{,}6}
      = 11{,}71\ \text{mcl}
      $$

      **Y el balance por componentes**, con la salida en $+x$:

      | | presión | cantidad de mov. | total |
      |---|---|---|---|
      | paralela | $-19{,}0 + 22{,}2$ | $+5{,}0$ | $8{,}2\ \text{kN}$ |
      | normal | $-32{,}9$ | $-4{,}1$ | $37{,}0\ \text{kN}$ |

      **La componente normal es cuatro veces y media la paralela**, y eso es
      lo que hay que anclar. Un codo no tira hacia delante: tira hacia fuera de
      la curva, que es donde hay que poner el macizo.

      Y fíjate en la fila de la paralela: los dos términos de presión casi se
      cancelan —19,0 contra 22,2— así que ahí la cantidad de movimiento, que
      normalmente es despreciable, aporta más de la mitad del resultado. **Cuál
      de los dos términos manda depende de la dirección que se mire.**

  # ── COLECCIÓN 4.10. Placa inclinada: la fuerza sale de una línea y el
  #    reparto de caudales, de otra. Dos ecuaciones distintas del mismo TCM.
  - id: ejflu15-col410-la-placa-inclinada
    titulo: Un chorro contra una placa inclinada, y cómo se reparte el agua
    fuente: >-
      Ejercicio 4.10 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un chorro de agua de $50\ \text{mm}$ de diámetro incide sobre una placa
      cuadrada, la cual forma $30°$ con la dirección del chorro. La velocidad
      del agua en el chorro es de $18\ \text{m/s}$ e incide en la placa en su
      centro de gravedad. Despreciando el rozamiento y el peso de la placa, se
      pide:

      a) Fuerza $P$ que hay que aplicar en el extremo para mantener la placa en
      equilibrio.

      b) Reparto de caudales.

      (La placa está articulada en uno de sus extremos y la fuerza $P$ se
      aplica en el opuesto; el chorro incide en el punto medio.)
    pide: La fuerza en el extremo y los dos caudales que salen de la placa.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin rozamiento, ¿en qué dirección es la fuerza sobre la placa?
        opciones:
          - texto: >-
              Perpendicular a ella, porque sin rozamiento el fluido no puede
              ejercer ninguna componente tangencial
            correcta: true
            mensaje: |
              Eso es, y simplifica el problema entero: solo hay que proyectar
              la cantidad de movimiento del chorro sobre la normal a la placa.
          - texto: >-
              En la dirección del chorro, porque es la del movimiento
            mensaje: |
              Esa sería la dirección si la placa fuera perpendicular. Al estar
              inclinada, la fuerza sigue siendo normal a la **placa**, no al
              chorro.
          - texto: >-
              A $30°$ de la placa, como el chorro
            mensaje: |
              Una superficie lisa solo puede empujar perpendicularmente a sí
              misma. El ángulo del chorro entra en el cálculo del módulo, no en
              la dirección de la fuerza.

      - tipo: calcular
        titulo: La fuerza en el extremo
        pregunta: |
          ¿Qué fuerza $P$ hay que aplicar?
        respuesta:
          tipo: magnitud
          valor: '159 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '318.1 n'
            mensaje: |
              Esa es la fuerza total del chorro sobre la placa. Como incide en
              el punto medio y $P$ se aplica en el extremo, el momento respecto
              de la articulación la deja en la mitad.
          - valor: '275.5 n'
            mensaje: |
              Has usado el coseno de $30°$ en vez del seno. Lo que empuja la
              placa es la componente **perpendicular** a ella, y con el chorro
              a $30°$ de la placa esa componente lleva el seno.
        pista: |
          $F = \rho Q v\sin 30°$, y después momentos: el chorro está en el
          centro y $P$ en el extremo.
        desarrollo: |
          $$
          Q = 18\cdot\frac{\pi\,0{,}05^{2}}{4} = 35{,}34\ \text{l/s}
          $$
          $$
          F = \rho\,Q\,v\sin 30° = 1000\cdot 0{,}03534\cdot 18\cdot 0{,}5
          = 318{,}1\ \text{N}
          $$
          $$
          P = \frac{F}{2} = 159\ \text{N}
          $$

      - tipo: calcular
        titulo: El caudal mayor
        pregunta: |
          ¿Qué caudal se va por la rama grande?
        respuesta:
          tipo: magnitud
          valor: '32.98 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.67 l/s'
            mensaje: |
              Has repartido el caudal por la mitad. Solo se reparte así con la
              placa perpendicular; inclinada, el chorro se desvía
              preferentemente hacia un lado.
          - valor: '26.51 l/s'
            mensaje: |
              Has usado $\sin 30°$ donde va el coseno. El reparto es
              $Q_{1,2} = \frac{Q}{2}(1\pm\cos\theta)$, con $\theta$ el ángulo
              entre el chorro y la placa; el seno es el que va en la fuerza.
        pista: |
          Cantidad de movimiento **a lo largo** de la placa: sin rozamiento se
          conserva, y de ahí sale el reparto.
        desarrollo: |
          Sin rozamiento no hay fuerza tangencial, así que la cantidad de
          movimiento paralela a la placa se conserva:

          $$
          Q_1 - Q_2 = Q\cos 30°
          \qquad
          Q_1 + Q_2 = Q
          $$
          $$
          Q_1 = \frac{Q}{2}(1+\cos 30°) = 32{,}98\ \text{l/s}
          \qquad
          Q_2 = 2{,}37\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin rozamiento la fuerza es normal a la placa, y vale
              $\rho Q v\sin 30° = 318$ N.
          - texto: >-
              Como el chorro incide en el centro y $P$ se aplica en el extremo,
              basta la mitad: 159 N.
          - texto: >-
              El reparto sale de conservar la cantidad de movimiento paralela a
              la placa: 32,98 y 2,37 l/s.
          - texto: >-
              Con la placa a $30°$ el reparto es muy desigual porque la mayor
              parte del agua rebota hacia atrás.
            trampa: true
            mensaje: |
              No rebota: sin rozamiento el agua **resbala** sobre la placa
              conservando su velocidad, y se reparte según hacia dónde apuntaba
              su cantidad de movimiento tangencial. Con 30° casi toda seguía
              hacia delante, y por eso el 93 % se va por esa rama.

    resolucion: |
      **Dos preguntas, dos ecuaciones distintas del mismo teorema.**

      **La fuerza** sale de la componente **normal** a la placa, que es la
      única que existe sin rozamiento:

      $$
      F = \rho\,Q\,v\sin 30° = 318\ \text{N}
      \qquad
      P = \frac{F}{2} = 159\ \text{N}
      $$

      **El reparto** sale de la componente **tangencial**, que sin rozamiento
      se conserva:

      $$
      Q_1 - Q_2 = Q\cos 30°
      \;\Longrightarrow\;
      Q_1 = 32{,}98
      \qquad
      Q_2 = 2{,}37\ \text{l/s}
      $$

      **El 93 % del agua se va por una sola rama.** Con la placa casi paralela
      al chorro, la cantidad de movimiento tangencial es grande y arrastra casi
      todo el caudal hacia delante. Con la placa perpendicular, $\cos 90° = 0$
      y el reparto sería mitad y mitad.

      **La estructura del problema conviene retenerla**: la componente normal
      da la **fuerza** y la tangencial da el **reparto**. Son las dos
      proyecciones de la misma ecuación vectorial, y confundirlas —usar el
      seno donde va el coseno— es el error que producen los dos distractores.

  # ── COLECCIÓN 4.11. Ensanchamiento brusco: la única pérdida localizada que
  #    se deduce, y aquí con aire para que además haya que calcular su
  #    densidad.
  - id: ejflu15-col411-el-ensanchamiento-brusco-con-aire
    titulo: El ensanchamiento brusco, deducido, y con aire dentro
    fuente: >-
      Ejercicio 4.11 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por un conducto de $60\ \text{cm}$ de diámetro circula aire a una presión
      absoluta $p = 0{,}7\ \text{kg/cm}^{2}$, $T = 5\ °\text{C}$ y
      $v = 60\ \text{m/s}$. El conducto sufre un ensanchamiento brusco pasando
      a tener $75\ \text{cm}$ de diámetro. Considerando el gas como
      incompresible, se pide:

      a) Pérdidas en el ensanchamiento brusco.

      b) Diferencia de presiones en el ensanchamiento.
    pide: La pérdida de carga y la diferencia de presiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la pérdida de un ensanchamiento brusco se puede **deducir**
          y la de un codo no?
        opciones:
          - texto: >-
              Porque combinando el teorema de la cantidad de movimiento con
              Bernoulli quedan dos ecuaciones y dos incógnitas, sin ningún
              coeficiente experimental
            correcta: true
            mensaje: |
              Eso es, y es el único caso del temario en que ocurre. En un codo
              o una válvula hay que medir; aquí basta con plantear las dos
              ecuaciones y eliminar la presión.
          - texto: >-
              Porque el ensanchamiento no tiene pérdidas
            mensaje: |
              Sí las tiene, y grandes: aquí 23,8 metros de columna de aire. Lo
              que ocurre es que se pueden calcular sin recurrir a tablas.
          - texto: >-
              Porque el flujo es incompresible
            mensaje: |
              Los codos también se estudian con flujo incompresible y su
              pérdida sigue siendo experimental. Lo que hace especial al
              ensanchamiento es que su geometría permite cerrar el sistema.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánto vale la pérdida en el ensanchamiento?
        respuesta:
          tipo: magnitud
          valor: '23.8 m'
          tolerancia: 0.02
          formato: una longitud, en metros de columna de aire
        distractores:
          - valor: '108.4 m'
            mensaje: |
              Esa es la diferencia de alturas cinéticas,
              $(v_1^{2}-v_2^{2})/2g$. La pérdida es
              $(v_1-v_2)^{2}/2g$, que es mucho menor: parte de la energía
              cinética sí se recupera como presión.
          - valor: '183.7 m'
            mensaje: |
              Has usado $v_1^{2}/2g$ entera, como si el aire se parase del
              todo. Solo se pierde la energía asociada a la **diferencia** de
              velocidades.
        pista: |
          $h_f = \dfrac{(v_1-v_2)^{2}}{2g}$, con $v_2$ de la continuidad.
        desarrollo: |
          $$
          v_2 = v_1\left(\frac{D_1}{D_2}\right)^{2} = 60\cdot 0{,}64
          = 38{,}4\ \text{m/s}
          $$
          $$
          h_f = \frac{(60-38{,}4)^{2}}{19{,}6} = \frac{466{,}6}{19{,}6}
          = 23{,}8\ \text{m de columna de aire}
          $$

      - tipo: calcular
        titulo: La diferencia de presiones
        pregunta: |
          ¿Cuánto sube la presión, en centímetros de columna de agua?
        respuesta:
          tipo: numero
          valor: '7.27'
          tolerancia: 0.15
          formato: un número en centímetros de columna de agua
        distractores:
          - valor: '84.64'
            mensaje: |
              Ese es el valor en metros de columna de **aire**. Hay que pasarlo
              a columna de agua, y como el aire es unas mil ciento cincuenta
              veces más ligero, el número se reduce muchísimo.
          - valor: '10.94'
            mensaje: |
              Has usado la densidad del aire en condiciones normales,
              $1{,}29\ \text{kg/m}^{3}$. En este conducto, a
              $0{,}7\ \text{kg/cm}^{2}$ absolutos y $5\ °\text{C}$, sale
              $0{,}859$: un 33 % menos.
        pista: |
          Bernoulli con la pérdida, y después de columna de aire a columna de
          agua con $\rho_{\text{aire}} = p/(RT)$.
        desarrollo: |
          $$
          \frac{p_2-p_1}{\gamma_{\text{aire}}}
          = \frac{v_1^{2}-v_2^{2}}{2g} - h_f = 108{,}4 - 23{,}8
          = 84{,}6\ \text{m de aire}
          $$
          $$
          \rho = \frac{p}{RT} = \frac{68\,600}{287\cdot 278}
          = 0{,}859\ \frac{\text{kg}}{\text{m}^{3}}
          \;\Longrightarrow\;
          \gamma = 8{,}42\ \frac{\text{N}}{\text{m}^{3}}
          $$
          $$
          \Delta p = 84{,}6\cdot 8{,}42 = 713\ \text{Pa} = 7{,}27\ \text{cm de agua}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La continuidad da $v_2 = 38{,}4$ m/s, y la pérdida del
              ensanchamiento es $(v_1-v_2)^{2}/2g = 23{,}8$ m de aire.
          - texto: >-
              Bernoulli con esa pérdida deja $84{,}6$ m de columna de aire de
              recuperación de presión.
          - texto: >-
              Con la densidad del aire en esas condiciones, eso son solo
              $7{,}3$ cm de columna de agua.
          - texto: >-
              Como la pérdida es de 23,8 metros, en un conducto de aire un
              ensanchamiento brusco es inaceptable.
            trampa: true
            mensaje: |
              Veintitrés metros **de columna de aire** son 200 pascales: dos
              milésimas de atmósfera. En un conducto de aire las alturas de
              columna engañan siempre, y hay que traducirlas a presión antes de
              juzgar si algo es mucho o poco.

    resolucion: |
      **La pérdida se deduce, y es el único caso del temario en que se puede.**
      Combinando el teorema de la cantidad de movimiento con Bernoulli sale

      $$
      h_f = \frac{(v_1-v_2)^{2}}{2g} = \frac{(60-38{,}4)^{2}}{19{,}6}
      = 23{,}8\ \text{m de columna de aire}
      $$

      **Y la presión sube**, pese a la pérdida, porque el aire se frena:

      $$
      \frac{\Delta p}{\gamma} = \frac{v_1^{2}-v_2^{2}}{2g} - h_f
      = 108{,}4 - 23{,}8 = 84{,}6\ \text{m de aire}
      $$

      Con $\rho = p/(RT) = 0{,}859\ \text{kg/m}^{3}$, eso son
      $713\ \text{Pa} = 7{,}3\ \text{cm de columna de agua}$.

      **La lección de unidades es la mitad del ejercicio.** Ochenta y cuatro
      metros de columna de aire suenan a barbaridad y son siete centímetros de
      agua. En conductos de gas, las alturas de columna del propio fluido son
      números enormes sin significado intuitivo: **hay que traducirlas a
      pascales o a milímetros de agua antes de juzgar nada**. Por eso los
      manómetros de ventilación se gradúan en mm de columna de agua y no en
      metros de aire.

      **Y el reparto entre recuperación y pérdida** es lo que decide si un
      ensanchamiento brusco es aceptable: de los $108\ \text{m}$ de energía
      cinética que el aire deja de tener, se recuperan $85$ como presión y se
      pierden $24$. Un difusor cónico bien hecho recuperaría casi todo — y esa
      es exactamente la diferencia entre un ensanchamiento brusco y uno
      gradual.

  # ── COLECCIÓN 4.8. La pieza en Y es el caso donde el teorema de la cantidad
  #    de movimiento se gana el sueldo: tres ramas, tres direcciones, y una
  #    fuerza de 17 kN que hay que anclar. La geometría viene de la figura del
  #    boletín —30° y 60° sobre la horizontal, la rama 2 vertical hacia
  #    abajo— y aquí se describe con palabras para no depender del dibujo.
  - id: ejflu15-col48-la-pieza-en-y
    titulo: La pieza en Y, y las diecisiete toneladas que hay que anclar
    fuente: >-
      Ejercicio 4.8 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una pieza en Y en posición vertical, por la que circula agua.
      Sus tres ramas están en el mismo plano vertical:

      - **1**, por la que **entra** el agua, con su eje a $30°$ sobre la
        horizontal y viniendo de arriba a la derecha:
        $Q_1 = 250\ \text{l/s}$, $D_1 = 300\ \text{mm}$,
        $P_1 = 3{,}5\ \text{kg/cm}^{2}$.
      - **2**, vertical y hacia abajo: $Q_2 = 150\ \text{l/s}$,
        $D_2 = 250\ \text{mm}$.
      - **3**, con su eje a $60°$ sobre la horizontal y saliendo hacia arriba
        a la izquierda: $D_3 = 200\ \text{mm}$.

      Se pide:

      a) Esfuerzos en dirección vertical y horizontal a que está sometida.

      b) Resultante de la fuerza en módulo, dirección y sentido.

      Nota: despréciense la gravedad, las pérdidas de carga y las energías de
      posición.
    pide: Las dos componentes del esfuerzo sobre la pieza y su resultante.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear el teorema de la cantidad de movimiento, ¿qué hay
          que tener y de dónde sale?
        opciones:
          - texto: >-
              El caudal de las tres ramas —por continuidad— y la presión de
              las tres —por Bernoulli desde la rama 1—, porque el teorema
              necesita todas las fuerzas de presión de la superficie de
              control
            correcta: true
            mensaje: |
              Eso es. El teorema de la cantidad de movimiento no se basta
              solo: la continuidad da los caudales y Bernoulli las presiones,
              y solo entonces se puede escribir el balance.
          - texto: >-
              Solo los caudales; las presiones de 2 y 3 son atmosféricas
              porque son salidas
            mensaje: |
              Salir de la pieza no es salir a la atmósfera: las ramas 2 y 3
              siguen siendo tubería. Sus presiones son casi las de la rama 1,
              y multiplicadas por sus secciones dan fuerzas de decenas de
              kilonewtons. Ignorarlas cambia el resultado por completo.
          - texto: >-
              Nada más: el teorema relaciona directamente los caudales con la
              fuerza
            mensaje: |
              La relación directa entre caudal y fuerza solo vale cuando las
              presiones son iguales en todas las caras —un chorro libre, por
              ejemplo—. En una pieza a 3,5 kg/cm² las presiones son el término
              dominante: aportan veinte veces más que la cantidad de
              movimiento.

      - tipo: calcular
        titulo: El caudal de la tercera rama
        pregunta: |
          ¿Qué caudal sale por la rama 3?
        respuesta:
          tipo: magnitud
          valor: '100 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '400 l/s'
            mensaje: |
              Has sumado. Por la rama 1 entran 250 l/s y por la 2 salen 150:
              lo que queda para la 3 es la diferencia. El agua no se crea
              dentro de la pieza.
          - valor: '125 l/s'
            mensaje: |
              Parece que has repartido los 250 l/s a partes iguales entre las
              dos salidas. El enunciado fija la rama 2 en 150 l/s, y el resto
              es lo que va por la 3.
        pista: |
          Continuidad: lo que entra es lo que sale.
        desarrollo: |
          $$
          Q_3 = Q_1 - Q_2 = 250 - 150 = 100\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El esfuerzo horizontal
        pregunta: |
          ¿Cuánto vale la componente horizontal de la fuerza sobre la pieza?
        respuesta:
          tipo: magnitud
          valor: '16.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '15.59 kn'
            mensaje: |
              Te has dejado los términos de cantidad de movimiento y has
              sumado solo las fuerzas de presión. Aquí la presión manda —es el
              96 % del resultado— pero el 4 % restante también cuenta.
          - valor: '21 kn'
            mensaje: |
              Parece que has contado solo la entrada, $p_1A_1\cos 30° = 21$
              kN. Las dos salidas empujan en sentido contrario y descuentan
              casi cinco kilonewtons.
        pista: |
          Proyecta sobre $x$: las presiones $p_iA_i$ apuntando **hacia** la
          pieza en cada rama, y el flujo de cantidad de movimiento
          $\rho Q_i v_i$ saliente menos entrante.
        desarrollo: |
          Velocidades: $v_1 = 3{,}537$, $v_2 = 3{,}056$, $v_3 = 3{,}183$ m/s.
          Con Bernoulli desde 1 (sin cota ni pérdidas):
          $p_2 = 344{,}6$ kPa y $p_3 = 344{,}2$ kPa frente a los
          $343$ kPa de la rama 1.

          | | $p_iA_i$ (N) | dirección | $x$ |
          |---|---|---|---|
          | 1 (entra) | 24.245 | $(-\cos30, -\sin30)$ | $-20.997$ |
          | 2 (sale) | 16.916 | $(0,+1)$ | $0$ |
          | 3 (sale) | 10.813 | $(+\cos60, -\sin60)$ | $+5.407$ |

          $$
          \sum (pA)_x = -15{,}59\ \text{kN}
          \qquad
          \Delta(\rho Q v)_x = +0{,}61\ \text{kN}
          $$
          $$
          F_x = 0{,}61 + 15{,}59 = 16{,}2\ \text{kN}
          $$

      - tipo: calcular
        titulo: El esfuerzo vertical
        pregunta: |
          ¿Y la componente vertical?
        respuesta:
          tipo: magnitud
          valor: '4.83 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4.57 kn'
            mensaje: |
              Solo las presiones, sin la cantidad de movimiento. En la
              vertical el término de momento pesa más que en la horizontal
              —un 5 %— porque la rama 2 descarga hacia abajo.
          - valor: '0.26 kn'
            mensaje: |
              Solo la cantidad de movimiento, sin las presiones. Doscientos
              sesenta newtons es lo que pesaría un bidón: no es el orden de
              magnitud de una pieza a 3,5 kg/cm².
        pista: |
          Lo mismo que en la horizontal, proyectando ahora sobre el eje
          vertical.
        desarrollo: |
          | | $p_iA_i$ (N) | $y$ |
          |---|---|---|
          | 1 (entra) | 24.245 | $-12.123$ |
          | 2 (sale) | 16.916 | $+16.916$ |
          | 3 (sale) | 10.813 | $-9.364$ |

          $$
          \sum (pA)_y = -4{,}57\ \text{kN}
          \qquad
          \Delta(\rho Q v)_y = +0{,}26\ \text{kN}
          $$
          $$
          F_y = 0{,}26 + 4{,}57 = 4{,}83\ \text{kN}
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuál es el módulo de la fuerza total sobre la pieza?
        respuesta:
          tipo: magnitud
          valor: '16.9 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '21.03 kn'
            mensaje: |
              Has sumado las componentes en vez de componerlas. Son
              perpendiculares: el módulo es la hipotenusa,
              $\sqrt{16{,}2^{2} + 4{,}83^{2}}$, no la suma.
          - valor: '11.37 kn'
            mensaje: |
              Las has restado. Dos componentes perpendiculares nunca se
              cancelan entre sí: la resultante es siempre mayor que la mayor
              de las dos.
        pista: |
          Teorema de Pitágoras con las dos componentes.
        desarrollo: |
          $$
          |F| = \sqrt{16{,}2^{2} + 4{,}83^{2}} = 16{,}9\ \text{kN}
          \qquad
          \alpha = \arctan\frac{4{,}83}{16{,}2} = 16{,}6°
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Por continuidad, $Q_3 = 250 - 150 = 100$ l/s, y con las
              secciones salen $v_1 = 3{,}54$, $v_2 = 3{,}06$ y
              $v_3 = 3{,}18$ m/s.
          - texto: >-
              Bernoulli desde la rama 1 da $p_2 = 344{,}6$ y $p_3 = 344{,}2$
              kPa: apenas kilopascal y medio por encima de la entrada, porque
              las velocidades son parecidas.
          - texto: >-
              Sumando presiones y cantidad de movimiento salen 16,2 kN
              horizontales y 4,83 verticales, es decir 16,9 kN a 16,6° de la
              horizontal.
          - texto: >-
              Y como las tres velocidades son casi iguales, el término de
              cantidad de movimiento se cancela y el resultado es puramente
              hidrostático.
            trampa: true
            mensaje: |
              No se cancela: aporta 0,61 kN en $x$ y 0,26 en $y$, un 4 % y un
              5 % del total. Es poco, pero no es cero, **y no es porque las
              velocidades sean parecidas sino porque son pequeñas**. Si la
              pieza llevara el mismo caudal por secciones cuatro veces
              menores, las velocidades se multiplicarían por 16, el término de
              momento por 256, y sería él quien mandara.

    resolucion: |
      **Por qué hace falta Bernoulli antes del teorema.** El balance de
      cantidad de movimiento pide **todas** las fuerzas que actúan sobre el
      volumen de control, y en las tres bocas hay una fuerza de presión. Solo
      se da la de la rama 1, así que las otras dos hay que calcularlas. Sin
      pérdidas y sin cotas,

      $$
      p_i = p_1 + \frac{\rho}{2}\left(v_1^{2} - v_i^{2}\right)
      $$

      y salen $344{,}6$ y $344{,}2$ kPa frente a $343$: **la presión apenas
      cambia**, porque las tres velocidades andan por 3 m/s. Pero eso no
      significa que las fuerzas sean parecidas: cada una se multiplica por su
      sección, y las secciones sí son muy distintas.

      | rama | $D$ | $A$ | $v$ | $p$ | $pA$ |
      |---|---|---|---|---|---|
      | 1 | 300 mm | 0,0707 m² | 3,54 m/s | 343,0 kPa | 24,25 kN |
      | 2 | 250 mm | 0,0491 m² | 3,06 m/s | 344,6 kPa | 16,92 kN |
      | 3 | 200 mm | 0,0314 m² | 3,18 m/s | 344,2 kPa | 10,81 kN |

      **El balance.** Con $x$ hacia la derecha e $y$ hacia arriba, cada boca
      aporta su $pA$ dirigida **hacia dentro** de la pieza, y el flujo de
      cantidad de movimiento aporta $\rho Q v$ saliente menos entrante:

      $$
      F_x = 16{,}2\ \text{kN}
      \qquad
      F_y = 4{,}83\ \text{kN}
      \qquad
      |F| = 16{,}9\ \text{kN}\ \text{a}\ 16{,}6°
      $$

      **Lo que hay que ver en el reparto.** De los 16,2 kN horizontales,
      15,59 los ponen las presiones y 0,61 la cantidad de movimiento: **el
      96 % es presión.** Y de los 4,83 verticales, 4,57 y 0,26. Es la
      situación normal en una conducción a presión, y explica por qué los
      anclajes de las piezas especiales se dimensionan por la presión de
      prueba y no por el caudal.

      Al revés ocurre en un chorro libre —el álabe de una Pelton, la placa del
      ejercicio 4.10—, donde la presión es la atmosférica en todas las caras,
      se cancela, y **todo** el esfuerzo lo pone la cantidad de movimiento. Los
      dos casos límite del mismo teorema.

      **Y el orden de magnitud.** Diecisiete kilonewtons son casi dos
      toneladas empujando una pieza que cabe en un armario. Una Y de
      fundición sin anclar se sale de la tubería: por eso las derivaciones
      llevan macizos de hormigón, y por eso este cálculo es de proyecto y no
      de examen solamente.
  - id: ejflu15-col43-el-chorro-contra-la-placa-inclinada
    titulo: El chorro contra la placa inclinada, y cómo se reparte
    fuente: Ejercicio 4.3 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un orificio en pared delgada de 150 mm de diámetro, situado a una
      profundidad de 7,5 m sobre la pared de un depósito, descarga un caudal de
      180 l/s de agua. El chorro incide sobre una pantalla plana, inclinada 60º
      con la horizontal. Para mantener dicha pantalla en esa posición hay que
      aplicar frente al chorro una fuerza de 180 kg en dirección perpendicular a
      la pantalla.

      Suponiendo constante la altura del depósito, calcular:

      a) Coeficientes de los orificios $C_c$, $C_v$ y $C_d$.

      b) Reparto de caudales en la pantalla.

      Nota: Suponer nulo el rozamiento en la placa.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 290" role="img" width="440" height="290"
           aria-labelledby="f43t f43d">
        <title id="f43t">El depósito con el orificio a 7,5 m y el chorro que choca contra una placa inclinada 60 grados</title>
        <desc id="f43d">Un depósito de agua con la lámina libre arriba y un
        orificio en pared delgada 7,5 metros más abajo. Del orificio sale un
        chorro horizontal que incide sobre una placa plana inclinada sesenta
        grados respecto de la horizontal. Al chocar, el chorro se reparte en dos
        láminas que resbalan por la placa, una hacia arriba y otra hacia abajo.
        Una fuerza perpendicular a la placa la mantiene en su sitio.</desc>
        <defs>
          <marker id="m43l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m43f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m43n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="20" y="40" width="130" height="150" fill="var(--live)" opacity="0.15"/>
        <path d="M20,40 v150 h130" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M150,40 V178 M150,190 V190" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="20" y1="40" x2="150" y2="40" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M78,31 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <text x="34" y="120" font-size="10.5" fill="var(--ink)">agua</text>
        <line x1="150" y1="178" x2="150" y2="190" stroke="var(--paper)" stroke-width="3"/>
        <line x1="150" y1="184" x2="262" y2="184" stroke="var(--live)" stroke-width="3" marker-end="url(#m43l)"/>
        <text x="160" y="176" font-size="9.5" fill="var(--live)">180 l/s · Ø 150</text>
        <line x1="100" y1="44" x2="100" y2="180" stroke="var(--faint)" stroke-width="1" marker-start="url(#m43n)" marker-end="url(#m43n)"/>
        <text x="96" y="112" text-anchor="end" font-size="10" fill="var(--faint)">7,5 m</text>
        <line x1="222" y1="266" x2="316" y2="103" stroke="var(--ink)" stroke-width="4"/>
        <text x="320" y="100" font-size="10.5" fill="var(--ink)">placa</text>
        <line x1="180" y1="266" x2="400" y2="266" stroke="var(--faint)" stroke-width="1.2"/>
        <path d="M258,266 A38,38 0 0 0 241,234" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="266" y="258" font-size="10" fill="var(--alt)">60°</text>
        <path d="M254,180 q22,-24 30,-52" fill="none" stroke="var(--live)" stroke-width="2.6" marker-end="url(#m43l)"/>
        <text x="288" y="132" font-size="10" fill="var(--live)">Q2</text>
        <path d="M250,192 q10,26 6,50" fill="none" stroke="var(--live)" stroke-width="2.6" marker-end="url(#m43l)"/>
        <text x="262" y="230" font-size="10" fill="var(--live)">Q3</text>
        <line x1="330" y1="238" x2="278" y2="208" stroke="var(--flag)" stroke-width="2.4" marker-end="url(#m43f)"/>
        <text x="336" y="242" font-size="10" fill="var(--flag)">F = 180 kg</text>
      </svg>
      <figcaption>El chorro llega horizontal y la placa está a 60° de la horizontal, así que el ángulo entre los dos es también de 60°. La fuerza que sujeta la placa es perpendicular a ella, y por eso solo equilibra la componente normal del chorro.</figcaption>
      </figure>
    pide: Los tres coeficientes del orificio y cómo se reparte el caudal en la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          La placa no tiene rozamiento. ¿Qué se sigue de eso para las
          velocidades de las dos láminas que salen?
        opciones:
          - texto: Que salen con la misma velocidad con la que llega el chorro, porque sin rozamiento ni desnivel el Bernoulli no cambia
            correcta: true
            mensaje: |
              Eso es. Es la teoría general de álabes: sin pérdidas y sin cambio
              de cota, todo el líquido que resbala por la placa conserva su
              carga, y como sale a la atmósfera igual que entra, conserva su
              velocidad. Lo que cambia es la **dirección**, no el módulo.
          - texto: Que las dos salen a la mitad de la velocidad de llegada, porque el caudal se parte en dos
            mensaje: |
              El caudal se parte, pero la velocidad no: cada lámina lleva menos
              caudal porque es más delgada, no porque vaya más despacio.
          - texto: Que la lámina que sube pierde velocidad y la que baja gana
            mensaje: |
              Eso pasaría si el desnivel fuera apreciable. En un chorro que
              resbala unos centímetros por una placa, la diferencia de cota es
              despreciable frente a los 6,5 m de altura de velocidad que lleva.

      - tipo: calcular
        titulo: El coeficiente de gasto
        pregunta: |
          Coeficiente de gasto $C_d$ del orificio, de 150 mm y a 7,5 m de
          profundidad, que descarga 180 l/s.
        respuesta:
          tipo: numero
          valor: '0.84'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1.19'
            mensaje: |
              Lo has invertido. El caudal real siempre es menor que el teórico,
              así que $C_d = Q_r/Q_t$ es menor que uno.
          - valor: '3.36'
            mensaje: |
              Has tomado los 150 mm como radio. El caudal teórico sale entonces
              cuatro veces menor, 53,6 l/s, y el coeficiente por encima de uno,
              que es imposible: de un orificio nunca sale más de lo teórico.
        pista: |
          $V_t = \sqrt{2gh}$, $Q_t = V_t\,\pi D^{2}/4$ y
          $C_d = Q_r/Q_t$.
        desarrollo: |
          $$
          V_{1t} = \sqrt{2 \cdot 9{,}8 \cdot 7{,}5} = 12{,}12\ \text{m/s} \qquad Q_{1t} = \frac{\pi \cdot 0{,}15^{2}}{4} \cdot 12{,}12 = 214{,}3\ \text{l/s}
          $$

          $$
          C_d = \frac{180}{214{,}3} = 0{,}84
          $$

      - tipo: calcular
        titulo: La velocidad real, que la delata la fuerza
        pregunta: |
          Velocidad real del chorro. La fuerza perpendicular que sujeta la placa
          es de 180 kg y el chorro llega formando 60º con ella.
        respuesta:
          tipo: magnitud
          valor: '11.32 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '19.6 m/s'
            mensaje: |
              Has usado el ángulo al revés, con el coseno. El chorro forma 60º
              con la placa, así que su componente **perpendicular** a ella va
              con el seno, no con el coseno.
          - valor: '0.011 m/s'
            mensaje: |
              Te has dejado el caudal en litros. En la ecuación va en m³/s:
              0,180, no 180.
        pista: |
          La placa solo puede empujar perpendicularmente, y la componente
          normal de la cantidad de movimiento entrante es
          $\rho\,Q\,V\sin 60°$.
        desarrollo: |
          $$
          R_y = \rho\,Q_1 V_1 \sin 60° \;\Longrightarrow\; V_1 = \frac{1\,764}{1\,000 \cdot 0{,}180 \cdot 0{,}866} = 11{,}32\ \text{m/s}
          $$

      - tipo: calcular
        titulo: Los otros dos coeficientes
        pregunta: |
          Coeficiente de contracción $C_c$ del orificio.
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '1.11'
            mensaje: |
              Lo has invertido: $C_c = C_d/C_v$, no al revés. Y los tres
              coeficientes son menores que uno.
          - valor: '0.78'
            mensaje: |
              Has multiplicado en vez de dividir. La relación es
              $C_d = C_c\,C_v$, así que la contracción se despeja dividiendo.
        pista: |
          $C_v = V_{real}/V_{teórica}$ y $C_d = C_c\,C_v$.
        desarrollo: |
          $$
          C_v = \frac{11{,}32}{12{,}12} = 0{,}933 \qquad C_c = \frac{C_d}{C_v} = \frac{0{,}84}{0{,}933} = 0{,}90
          $$

      - tipo: calcular
        titulo: El reparto de caudales
        pregunta: |
          Caudal de la lámina que sube por la placa, en l/s. En la dirección de
          la placa no hay fuerza, porque no hay rozamiento.
        respuesta:
          tipo: magnitud
          valor: '135 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '90 l/s'
            mensaje: |
              Has repartido a partes iguales. Solo se reparte así cuando el
              chorro llega perpendicular a la placa; con 60º, la componente
              tangencial desequilibra el reparto.
          - valor: '45 l/s'
            mensaje: |
              Ese es el caudal de la otra lámina, la que baja. La que sube se
              lleva la parte grande, porque la componente tangencial del chorro
              apunta hacia arriba de la placa.
          - valor: '167.9 l/s'
            mensaje: |
              Has usado el seno donde va el coseno. La componente **a lo largo**
              de la placa es $V\cos 60°$, la mitad de la velocidad.
        pista: |
          Sin rozamiento, la cantidad de movimiento en la dirección de la placa
          se conserva: $Q_2 - Q_3 = Q_1\cos 60°$, y además
          $Q_2 + Q_3 = Q_1$.
        desarrollo: |
          $$
          Q_2 - Q_3 = 0{,}180 \cdot 0{,}5 = 0{,}090 \qquad Q_2 + Q_3 = 0{,}180
          $$

          $$
          Q_2 = \frac{0{,}180\,(1+\cos 60°)}{2} = 135\ \text{l/s} \qquad Q_3 = 45\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la placa. Una pieza es falsa.
        piezas:
          - texto: 'La profundidad da la velocidad teórica y con ella el caudal teórico; comparado con el real, sale Cd = 0,84.'
          - texto: 'La fuerza que sujeta la placa es perpendicular a ella, así que equilibra solo la componente normal del chorro y de ahí sale la velocidad real.'
          - texto: 'Sin rozamiento no hay fuerza en la dirección de la placa, y esa ecuación da la diferencia de caudales de las dos láminas.'
          - texto: 'Como el chorro llega a 60º y no perpendicular, la fuerza sobre la placa es menor que si llegase de frente, y las dos láminas salen con velocidades distintas.'
            trampa: true
            mensaje: |
              La primera mitad es cierta —de frente la fuerza sería
              $\rho QV = 2\,037$ N en vez de 1 764— pero la segunda no: las dos
              láminas salen con la **misma** velocidad, la del chorro. Lo que
              cambia entre ellas es el caudal, 135 frente a 45 l/s.
    resolucion: |
      **La idea: la placa es un aparato de medida.** No se conoce la velocidad
      real del chorro, pero la fuerza que hay que hacer para sujetar la placa la
      delata, y con ella salen los tres coeficientes.

      **Lo que se puede calcular sin la fuerza** (parte de a).

      $$
      V_{1t} = \sqrt{2g \cdot 7{,}5} = 12{,}12\ \text{m/s} \qquad Q_{1t} = 214{,}3\ \text{l/s} \qquad C_d = \frac{180}{214{,}3} = 0{,}84
      $$

      **Lo que da la fuerza.** La placa no tiene rozamiento, así que solo puede
      empujar perpendicularmente. En esa dirección, la cantidad de movimiento
      entrante es $\rho Q V\sin 60°$ y la saliente es nula:

      $$
      1\,764 = 1\,000 \cdot 0{,}180 \cdot V_1 \cdot \sin 60° \;\Longrightarrow\; V_1 = 11{,}32\ \text{m/s}
      $$

      $$
      C_v = \frac{11{,}32}{12{,}12} = 0{,}933 \qquad C_c = \frac{0{,}84}{0{,}933} = 0{,}90
      $$

      **El reparto** (b). En la dirección de la placa no hay ninguna fuerza, y
      las tres velocidades son iguales porque no hay pérdidas ni desnivel:

      $$
      0 = Q_2V - Q_3V - Q_1V\cos 60° \;\Longrightarrow\; Q_2 - Q_3 = Q_1\cos 60° = 90\ \text{l/s}
      $$

      Con $Q_2 + Q_3 = 180$: **135 l/s hacia arriba y 45 hacia abajo**.

      **Los dos hábitos que este problema instala.** El primero: en una placa
      lisa, el líquido conserva el módulo de su velocidad y solo cambia de
      dirección; por eso la ecuación tangencial se convierte en un reparto de
      caudales. El segundo: el reparto es
      $Q_2/Q_1 = (1+\cos\theta)/2$, que vale 1/2 cuando el chorro llega
      perpendicular —y entonces se parte por la mitad— y tiende a 1 cuando el
      chorro llega casi rasante. Aquí, con 60º, sale tres cuartos contra un
      cuarto.
  - id: ejflu15-col414-el-disco-que-flota-sobre-un-chorro
    titulo: El disco que flota sobre un chorro
    fuente: Ejercicio 4.14 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      El disco mostrado en la figura se mantiene estable mediante un alambre y
      tiene libertad para moverse verticalmente cuando incide un chorro de agua
      en la cara inferior. El disco pesa 30 N, la velocidad y diámetro iniciales
      del chorro son 10 m/s y 30 mm respectivamente. Se pide:

      a) Altura $h$ hasta la cual se elevará y permanecerá en equilibrio el
      disco.

      Nota: la influencia que pudiera tener el alambre no se tendrá en cuenta en
      los cálculos.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="f414t f414d">
        <title id="f414t">El disco suspendido sobre el chorro vertical, a la altura donde su peso iguala al empuje</title>
        <desc id="f414d">Una boquilla de treinta milímetros lanza hacia arriba
        un chorro de agua a diez metros por segundo. A una altura h por encima
        de ella flota un disco horizontal que pesa treinta newtons; el chorro
        choca contra su cara inferior y se desvía hacia los lados. Un alambre
        vertical guía el disco sin sujetarlo.</desc>
        <defs>
          <marker id="m414l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m414f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m414n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M140,278 H180 L172,252 H148 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="188" y="274" font-size="10" fill="var(--faint)">boquilla Ø 30 mm</text>
        <line x1="160" y1="248" x2="160" y2="120" stroke="var(--live)" stroke-width="6" opacity="0.5"/>
        <line x1="160" y1="230" x2="160" y2="180" stroke="var(--live)" stroke-width="2" marker-end="url(#m414l)"/>
        <text x="172" y="212" font-size="10" fill="var(--live)">10 m/s al salir</text>
        <rect x="96" y="104" width="128" height="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="232" y="114" font-size="10.5" fill="var(--ink)">disco · 30 N</text>
        <path d="M152,118 q-24,4 -34,20 M168,118 q24,4 34,20" fill="none" stroke="var(--live)" stroke-width="2.6"/>
        <line x1="160" y1="104" x2="160" y2="30" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="168" y="44" font-size="9.5" fill="var(--faint)">alambre guía</text>
        <line x1="212" y1="122" x2="212" y2="156" stroke="var(--flag)" stroke-width="2" marker-end="url(#m414f)"/>
        <text x="220" y="146" font-size="9.5" fill="var(--flag)">peso 30 N</text>
        <line x1="60" y1="118" x2="60" y2="246" stroke="var(--faint)" stroke-width="1" marker-start="url(#m414n)" marker-end="url(#m414n)"/>
        <line x1="56" y1="116" x2="92" y2="116" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="56" y1="248" x2="136" y2="248" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="52" y="186" text-anchor="end" font-size="11" fill="var(--faint)">h</text>
      </svg>
      <figcaption>El chorro va frenando al subir, así que el disco encuentra su sitio donde el empuje que recibe iguala exactamente a su peso. Más arriba empujaría menos y caería; más abajo, más y subiría.</figcaption>
      </figure>
    pide: La altura de equilibrio del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco sube hasta que se queda quieto. ¿Qué cambia con la altura y
          qué no?
        opciones:
          - texto: La velocidad del chorro baja al subir, pero el caudal es el mismo; por eso el empuje disminuye con la altura
            correcta: true
            mensaje: |
              Eso es. El chorro es el mismo agua a lo largo de todo el
              recorrido, así que $Q$ no cambia; lo que cambia es su velocidad,
              que se frena subiendo. Y como el empuje es $\rho\,Q\,V$, baja con
              la altura hasta igualar el peso.
          - texto: El caudal disminuye al subir, porque parte del agua vuelve a caer
            mensaje: |
              Mientras el chorro sube en una sola pieza, todo el caudal que sale
              de la boquilla pasa por cada sección: la vena se ensancha, pero el
              caudal es el mismo.
          - texto: No cambia nada; el disco se queda donde lo pongas
            mensaje: |
              Si nada cambiara con la altura, el equilibrio sería indiferente y
              el disco no tendría una posición propia. Lo que le da una es
              justamente que el empuje disminuya al subir: es un equilibrio
              **estable**.

      - tipo: calcular
        titulo: El caudal del chorro
        pregunta: |
          Caudal que lanza la boquilla, de 30 mm y 10 m/s.
        respuesta:
          tipo: magnitud
          valor: '7.07 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '28.3 l/s'
            mensaje: |
              Has tomado los 30 mm como radio. Es el diámetro: la sección es
              $\pi \cdot 0{,}03^{2}/4 = 7{,}07$ cm².
        pista: |
          $Q = V_0 \cdot \pi D^{2}/4$.
        desarrollo: |
          $$
          Q = 10 \cdot \frac{\pi \cdot 0{,}03^{2}}{4} = 7{,}07 \cdot 10^{-3}\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: La velocidad con la que llega al disco
        pregunta: |
          Velocidad del chorro justo debajo del disco, para que su empuje
          equilibre los 30 N de peso.
        respuesta:
          tipo: magnitud
          valor: '4.24 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '0.433 m/s'
            mensaje: |
              Has usado el peso específico donde va la densidad, o has dividido
              además entre $g$. El empuje es $\rho\,Q\,V$ con
              $\rho = 1\,000$ kg/m³.
          - valor: '0.0042 m/s'
            mensaje: |
              Has usado el caudal en litros por segundo. En la ecuación va en
              m³/s: 0,00707.
        pista: |
          En el disco, todo el momento vertical del chorro se destruye:
          $W = \rho\,Q\,V$.
        desarrollo: |
          $$
          V = \frac{W}{\rho\,Q} = \frac{30}{1\,000 \cdot 7{,}07\cdot 10^{-3}} = 4{,}24\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La altura de equilibrio
        pregunta: |
          Altura $h$ a la que se queda el disco.
        respuesta:
          tipo: magnitud
          valor: '4.18 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '5.1 m'
            mensaje: |
              Has tomado los 10 m/s enteros para la altura, como si el chorro se
              parase del todo. No se para: llega al disco con 4,24 m/s, y esa
              energía cinética que le queda no se ha gastado en subir.
          - valor: '0.92 m'
            mensaje: |
              Has puesto la velocidad del disco donde va la diferencia de
              cuadrados. La altura ganada es $(V_0^{2}-V^{2})/2g$, no
              $V^{2}/2g$.
          - valor: '1.69 m'
            mensaje: |
              Has restado las velocidades antes de elevarlas al cuadrado. En
              energía se restan los **cuadrados**.
        pista: |
          Caída libre al revés: $\dfrac{V_0^{2}}{2g} = h + \dfrac{V^{2}}{2g}$.
        desarrollo: |
          $$
          h = \frac{V_0^{2} - V^{2}}{2g} = \frac{100 - 18{,}01}{19{,}6} = 4{,}18\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del disco. Una pieza es falsa.
        piezas:
          - texto: 'El caudal es el mismo a cualquier altura; lo que cambia es la velocidad, que se frena al subir.'
          - texto: 'En el disco el chorro se desvía a los lados, así que pierde todo su momento vertical y el empuje vale ρQV.'
          - texto: 'Igualando ese empuje al peso sale la velocidad de llegada, y de la caída libre, la altura.'
            trampa: false
          - texto: 'Si el disco pesara el doble, se quedaría a la mitad de altura, porque el empuje es proporcional a la velocidad.'
            trampa: true
            mensaje: |
              El empuje sí es proporcional a la velocidad, pero la altura no lo
              es: va con la **diferencia de cuadrados**. Con 60 N el disco
              necesitaría $V = 8{,}49$ m/s y se quedaría a
              $(100-72)/19{,}6 = 1{,}43$ m, no a 2,09. Doblar el peso lo baja a
              un tercio de la altura, no a la mitad.
    resolucion: |
      **Por qué el equilibrio existe.** El chorro sale a 10 m/s y va frenando al
      subir, pero su caudal es el mismo en todas las secciones. El empuje que
      hace sobre el disco es $\rho\,Q\,V$: máximo abajo y cada vez menor arriba.
      Hay entonces **una sola altura** donde ese empuje vale exactamente 30 N, y
      además es estable: si el disco baja recibe más y vuelve a subir, y al
      revés.

      **Las tres cuentas.**

      $$
      Q = 10 \cdot \frac{\pi \cdot 0{,}03^{2}}{4} = 7{,}07\ \text{l/s} \qquad V = \frac{30}{1\,000 \cdot 0{,}00707} = 4{,}24\ \text{m/s}
      $$

      $$
      h = \frac{10^{2} - 4{,}24^{2}}{2 \cdot 9{,}8} = 4{,}18\ \text{m}
      $$

      El boletín publica 4,19 m.

      **Lo que no es proporcional, y conviene tenerlo claro.** El empuje va con
      $V$ y la altura con $V^{2}$, así que las dos cosas no escalan igual.
      Doblar el peso del disco exige doblar la velocidad de llegada —de 4,24 a
      8,49 m/s— y eso lo baja de 4,18 m a 1,43: a **un tercio** de la altura, no
      a la mitad. Y hay un peso máximo: si el disco pesara más de
      $\rho\,Q\,V_0 = 70{,}7$ N, el chorro no lo levantaría ni pegado a la
      boquilla.

  - id: ejflu15-col415-la-placa-agujereada-y-lo-que-la-atraviesa
    titulo: La placa agujereada, y la parte del chorro que la atraviesa
    fuente: Ejercicio 4.15 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La placa circular de la figura tiene un diámetro de 50 cm, disponiendo en
      su centro un orificio de 5 cm de diámetro. Un chorro incide en la placa
      normalmente a ella y en su centro, alcanzándola con una velocidad de
      30 m/s. Se pide:

      a) Caudal que atraviesa el orificio.

      b) Espesor de la lámina de agua en el extremo exterior de la placa.

      c) Fuerza que el chorro efectúa sobre la placa.

      Datos: coeficientes del orificio: $C_v$ = 0,97; $C_c$ = 0,8.

      Nota: se supondrá que la placa carece de rozamiento.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 300" role="img" width="440" height="300"
           aria-labelledby="f415t f415d">
        <title id="f415t">El chorro de 100 mm contra la placa de 50 cm con un orificio de 5 cm en el centro</title>
        <desc id="f415d">Sección de una placa circular vertical de cincuenta
        centímetros de diámetro con un orificio de cinco centímetros en su
        centro. Por la izquierda llega un chorro de cien milímetros a treinta
        metros por segundo. Una parte lo atraviesa por el orificio y sale por
        la derecha; el resto se abre en una lámina que resbala por la cara
        anterior hacia los bordes, arriba y abajo, y sale por el extremo con un
        espesor pequeño.</desc>
        <defs>
          <marker id="m415l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m415n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="252" y="30" width="10" height="108" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <rect x="252" y="162" width="10" height="108" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <rect x="60" y="126" width="192" height="48" fill="var(--live)" opacity="0.22"/>
        <line x1="90" y1="150" x2="200" y2="150" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m415l)"/>
        <text x="66" y="122" font-size="10" fill="var(--live)">Q1 · V = 30 m/s</text>
        <text x="66" y="192" font-size="10" fill="var(--faint)">D1 = 100 mm</text>
        <rect x="262" y="138" width="112" height="24" fill="var(--live)" opacity="0.22"/>
        <line x1="290" y1="150" x2="356" y2="150" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <text x="300" y="136" font-size="10" fill="var(--live)">Q2 · u</text>
        <text x="286" y="176" font-size="9.5" fill="var(--faint)">orificio Ø 5 cm</text>
        <path d="M240,126 q6,-46 6,-92" fill="none" stroke="var(--live)" stroke-width="7" opacity="0.35"/>
        <path d="M240,174 q6,46 6,92" fill="none" stroke="var(--live)" stroke-width="7" opacity="0.35"/>
        <line x1="244" y1="96" x2="245" y2="52" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <line x1="244" y1="204" x2="245" y2="248" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <text x="204" y="60" text-anchor="end" font-size="10" fill="var(--live)">Q3 · lámina</text>
        <text x="204" y="248" text-anchor="end" font-size="10" fill="var(--live)">Q3 · lámina</text>
        <line x1="300" y1="34" x2="300" y2="266" stroke="var(--faint)" stroke-width="1" marker-start="url(#m415n)" marker-end="url(#m415n)"/>
        <line x1="266" y1="32" x2="304" y2="32" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="266" y1="268" x2="304" y2="268" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="306" y="206" font-size="10" fill="var(--faint)">50 cm</text>
        <line x1="222" y1="30" x2="222" y2="44" stroke="var(--faint)" stroke-width="1" marker-start="url(#m415n)" marker-end="url(#m415n)"/>
        <text x="216" y="42" text-anchor="end" font-size="9.5" fill="var(--faint)">espesor ?</text>
      </svg>
      <figcaption>El chorro se parte en dos caminos: lo que cabe por el orificio sigue recto, y el resto se abre en una lámina que resbala hasta el borde. Los dos se llevan cantidad de movimiento, y por eso la placa recibe menos de lo que recibiría entera.</figcaption>
      </figure>
    pide: El caudal del orificio, el espesor de la lámina en el borde y la fuerza sobre la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          El chorro que llega tiene 100 mm y el orificio 5 cm. ¿Qué parte del
          caudal lo atraviesa?
        opciones:
          - texto: La que cabe por el orificio con sus coeficientes, Cc·Cv·A·V, no la proporción de áreas
            correcta: true
            mensaje: |
              Eso es. Un orificio en una placa se comporta como cualquier otro:
              la vena se contrae ($C_c$) y pierde algo de velocidad ($C_v$). Lo
              que pasa es $C_cC_vA_oV$, un 78 % de lo que daría el área
              desnuda.
          - texto: La proporción de áreas, es decir, (5/10)² = un cuarto del caudal
            mensaje: |
              Esa proporción valdría si el agua pasara por el orificio sin
              enterarse. Pero se contrae al entrar y se frena: por eso hacen
              falta los dos coeficientes, que aquí dejan pasar el 78 % de lo que
              cabría.
          - texto: Todo el que llega, porque el chorro es de 100 mm y el orificio está en su centro
            mensaje: |
              El orificio tiene 5 cm y el chorro 10: por el agujero solo cabe
              una fracción. El resto choca contra la placa y se abre en lámina.

      - tipo: calcular
        titulo: Lo que atraviesa el orificio
        pregunta: |
          Caudal que pasa por el orificio de 5 cm, con $C_v$ = 0,97 y
          $C_c$ = 0,8.
        respuesta:
          tipo: magnitud
          valor: '45.7 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '58.9 l/s'
            mensaje: |
              Te has dejado los dos coeficientes. Sin contracción ni pérdida de
              velocidad pasarían 58,9 l/s; con ellos, el 78 % de eso.
          - valor: '57.1 l/s'
            mensaje: |
              Te has dejado el coeficiente de contracción. Es el que más pesa
              aquí: la vena se estrecha a un 80 % del área del agujero.
          - valor: '47.1 l/s'
            mensaje: |
              Te has dejado el coeficiente de velocidad. Solo cambia un 3 %,
              pero la cuenta lo lleva.
        pista: |
          $Q_2 = C_c\,C_v\,A_o\,V$ con $A_o = \pi \cdot 0{,}05^{2}/4$.
        desarrollo: |
          $$
          Q_2 = 0{,}8 \cdot 0{,}97 \cdot \frac{\pi \cdot 0{,}05^{2}}{4} \cdot 30 = 0{,}0457\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El espesor en el borde
        pregunta: |
          Espesor de la lámina de agua en el extremo exterior de la placa, de
          50 cm de diámetro, en milímetros. El chorro que llega es de 100 mm.
        respuesta:
          tipo: magnitud
          valor: '4.03 mm'
          tolerancia: 0.01
          formato: un espesor con su unidad (mm o m)
        distractores:
          - valor: '5 mm'
            mensaje: |
              Te has dejado el caudal que se escapa por el orificio. Del chorro
              de 235,6 l/s se van 45,7 por el agujero: por el borde solo salen
              190.
          - valor: '8.06 mm'
            mensaje: |
              Has usado el radio de la placa donde va su perímetro, o te has
              dejado el 2 de $2\pi R$. El agua sale por toda la circunferencia
              del borde.
          - valor: '2.02 mm'
            mensaje: |
              Has usado el diámetro donde va el radio en el perímetro. La
              circunferencia del borde es $2\pi \cdot 0{,}25 = 1{,}571$ m.
        pista: |
          $Q_3 = Q_1 - Q_2$ y sale por la circunferencia del borde con la misma
          velocidad de 30 m/s: $Q_3 = V \cdot 2\pi R \cdot e$.
        desarrollo: |
          $$
          Q_1 = 30 \cdot \frac{\pi \cdot 0{,}10^{2}}{4} = 235{,}6\ \text{l/s} \qquad Q_3 = 235{,}6 - 45{,}7 = 189{,}9\ \text{l/s}
          $$

          $$
          e = \frac{Q_3}{V \cdot 2\pi R} = \frac{0{,}1899}{30 \cdot 1{,}571} = 0{,}00403\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza sobre la placa
        pregunta: |
          Fuerza que el chorro ejerce sobre la placa, en newtons. La lámina sale
          paralela a la placa y el orificio deja escapar su chorro con $C_v$
          veces la velocidad de llegada.
        respuesta:
          tipo: magnitud
          valor: '5738 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '7069 N'
            mensaje: |
              Te has dejado la cantidad de movimiento que se escapa por el
              orificio. Ese chorro sigue recto y se lleva 1 330 N que la placa
              no recibe.
          - valor: '8399 N'
            mensaje: |
              Has sumado la cantidad de movimiento del orificio en vez de
              restarla. Ese chorro **se va** en el mismo sentido que llegó: se
              lleva empuje, no lo añade.
          - valor: '1330 N'
            mensaje: |
              Esa es la parte que se escapa, no la que la placa aguanta.
        pista: |
          En la dirección del chorro, la lámina no aporta nada porque sale
          perpendicular: $F = \rho\,Q_1V - \rho\,Q_2\,(C_vV)$.
        desarrollo: |
          $$
          F = 1\,000 \cdot 0{,}2356 \cdot 30 - 1\,000 \cdot 0{,}0457 \cdot 29{,}1 = 7\,069 - 1\,330 = 5\,738\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el balance de la placa. Una pieza es falsa.
        piezas:
          - texto: 'El orificio se comporta como cualquier otro: deja pasar Cc·Cv·A·V, un 78 % de lo que daría su área desnuda.'
          - texto: 'Lo que no pasa se abre en lámina y sale por la circunferencia del borde, y de ahí sale su espesor.'
          - texto: 'La lámina sale perpendicular al chorro, así que no aporta cantidad de movimiento en la dirección de éste.'
          - texto: 'La fuerza sobre la placa es la del chorro entero menos la del orificio, y como el orificio se lleva un 19 % del caudal, la placa recibe un 81 % de la fuerza.'
            trampa: true
            mensaje: |
              Recibe el 81 %, sí, pero no por el caudal: el chorro del orificio
              sale además un 3 % más despacio, así que se lleva
              $0{,}0457 \cdot 29{,}1$ y no $0{,}0457 \cdot 30$. La cuenta buena
              da 5 738 de 7 069 N, un 81,2 %; con la proporción de caudales
              saldría 80,6 %. La coincidencia es aproximada, no una regla.
    resolucion: |
      **Tres cosas que se calculan en cadena.** El orificio se lleva una parte
      del chorro; lo que queda se abre en lámina; y la fuerza es lo que la placa
      le quita al conjunto.

      **El orificio** (a). Se comporta como cualquier orificio, con sus dos
      coeficientes:

      $$
      Q_2 = C_cC_vA_oV = 0{,}8 \cdot 0{,}97 \cdot 1{,}963\cdot 10^{-3} \cdot 30 = 45{,}7\ \text{l/s}
      $$

      **La lámina** (b). El chorro de 100 mm trae 235,6 l/s, así que por el
      borde salen 189,9. Sin rozamiento la lámina conserva los 30 m/s, y sale
      por toda la circunferencia:

      $$
      e = \frac{0{,}1899}{30 \cdot 2\pi \cdot 0{,}25} = 4{,}03\ \text{mm}
      $$

      **La fuerza** (c). En la dirección del chorro, la lámina no cuenta —sale
      perpendicular—; el chorro del orificio sí, y a $C_v$ veces la velocidad:

      $$
      F = \rho Q_1 V - \rho Q_2 (C_vV) = 7\,069 - 1\,330 = 5\,738\ \text{N}
      $$

      El boletín publica 45,7 l/s; 4 mm; 5 735 N.

      **Para qué sirve agujerear una placa.** El orificio se lleva el 19 % del
      caudal y descarga a la placa un 19 % de la fuerza. No es una casualidad
      —es casi proporcional— pero tampoco es exacto: el chorro que escapa sale
      un 3 % más despacio, y esa diferencia es la que separa el 80,6 % que
      daría la regla de tres del 81,2 % real. En un deflector de verdad el
      agujero es exactamente el mando con el que se ajusta el empuje.
