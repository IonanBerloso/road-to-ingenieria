        <line x1="356" y1="124" x2="392" y2="88" stroke="var(--live)" stroke-width="2" marker-end="url(#m46j)"/>
        <text x="404" y="80" text-anchor="middle" font-size="10.5" fill="var(--faint)">D = 30 cm</text>
        <circle cx="188" cy="300" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="197" y1="300" x2="206" y2="300" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="176" y="304" text-anchor="end" font-size="10.5" fill="var(--ink)">1 kg/cm²</text>
        <text x="256" y="256" font-size="11" fill="var(--alt)">1</text>
        <text x="196" y="176" font-size="11" fill="var(--alt)">2</text>
        <text x="296" y="182" font-size="11" fill="var(--alt)">3</text>
