ejercicios:
  # ── Los dos son NUESTROS (§08). El capítulo 4 de la colección resuelve el
  #    TCM sobre figuras acotadas —codos en planta, derivaciones, álabes con
  #    ángulos medidos en el dibujo—, y reproducirlas exige dibujarlas. Estos
  #    dos aíslan el álabe fijo y el móvil; el codo está en el tema 14, que es
  #    donde se enuncia el teorema.
  - id: ejflu15-el-alabe-fijo
    titulo: La fuerza sobre un álabe, y por qué 180 grados da el doble
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un chorro de agua de $30\ \text{l/s}$ y $20\ \text{m/s}$ incide
      tangencialmente sobre un álabe **fijo** que lo desvía un ángulo
      $\theta$ respecto de su dirección original.

      a) Calcular la fuerza sobre el álabe si $\theta = 90°$.

      b) Calcular la fuerza si $\theta = 180°$.

      Despreciar el rozamiento; $\rho = 1000\ \text{kg/m}^{3}$.
    pide: Las componentes de la fuerza en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin rozamiento y a presión atmosférica, ¿qué le pasa al **módulo**
          de la velocidad al atravesar el álabe?
        opciones:
          - texto: >-
              No cambia: $v_1 = v_2 = v$. Bernoulli entre entrada y salida,
              con la misma presión y la misma cota, deja iguales las alturas
              cinéticas
            correcta: true
            mensaje: |
              Eso es, y es lo que hace manejable el problema: el chorro
              cambia de **dirección** pero no de rapidez. Toda la variación de
              cantidad de movimiento es vectorial.
          - texto: >-
              Disminuye, porque el álabe le quita energía
            mensaje: |
              Un álabe **fijo** no absorbe energía: no se desplaza, así que no
              hace trabajo. Solo la absorbe si se mueve, y ese es el caso del
              álabe móvil.
          - texto: >-
              Depende del ángulo de desviación
            mensaje: |
              El ángulo cambia la **dirección** de la velocidad de salida,
              no su módulo. Por eso la fuerza sí depende de $\theta$ y la
              rapidez no.

      - tipo: calcular
        titulo: La fuerza con noventa grados
        pregunta: |
          Con $\theta = 90°$, ¿cuánto vale la componente $F_x$?
        respuesta:
          tipo: magnitud
          valor: '600 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1200 N'
            mensaje: |
              Ese es el caso de $180°$. Con $90°$,
              $1-\cos 90° = 1$, así que $F_x = \rho Q v = 600\ \text{N}$.
          - valor: '0.6 N'
            mensaje: |
              Un factor mil: el caudal son $0{,}03\ \text{m}^{3}/\text{s}$ y
              la densidad $1000\ \text{kg/m}^{3}$, así que
              $\rho Q = 30\ \text{kg/s}$.
        pista: |
          Fx = ρ·Q·v·(1 − cos θ), con θ = 90°.
        desarrollo: |
          $$
          F_x = \rho Q v(1-\cos 90°) = 1000\cdot0{,}03\cdot20\cdot1 = 600\ \text{N}
          $$

          Y la componente $y$ vale lo mismo,
          $F_y = \rho Q v\sin 90° = 600\ \text{N}$, así que la resultante es
          $848{,}5\ \text{N}$ a $45°$.

      - tipo: calcular
        titulo: La fuerza con ciento ochenta grados
        pregunta: |
          Y si el álabe devuelve el chorro por donde vino, ¿cuánto vale
          $F_x$?
        respuesta:
          tipo: magnitud
          valor: '1200 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '600 N'
            mensaje: |
              Es el doble, no lo mismo: la cantidad de movimiento pasa de
              $+\rho Q v$ a $-\rho Q v$, así que la variación es $2\rho Qv$.
              Con $1-\cos 180° = 2$.
          - valor: '0 N'
            mensaje: |
              Cero sería si el chorro **no** se desviara ($\theta = 0$). Al
              devolverlo, el cambio de cantidad de movimiento es el máximo
              posible.
        pista: |
          1 − cos 180° = 2.
        desarrollo: |
          $$
          F_x = \rho Q v(1-\cos 180°) = 600\cdot2 = 1200\ \text{N}
          $$

          Y $F_y = 0$, porque el chorro sale en la misma recta por la que
          entró.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli con las cuatro hipótesis del álabe deja $v_1 = v_2 = v$.
          - texto: >-
              TCM en $x$: $F_x = \rho Q(v - v\cos\theta) = \rho Qv(1-\cos\theta)$.
          - texto: >-
              Con $\theta = 90°$: $F_x = F_y = 600\ \text{N}$, resultante
              $848{,}5\ \text{N}$.
          - texto: >-
              Con $\theta = 180°$: $F_x = 1200\ \text{N}$ y $F_y = 0$.
          - texto: >-
              En general, el módulo vale $2\rho Qv\sin(\theta/2)$, que en
              $180°$ da el máximo.
          - texto: >-
              Como el álabe está fijo, la fuerza que recibe no hace trabajo y
              por tanto es nula.
            trampa: true
            mensaje: |
              No hacer trabajo y ser nula son cosas distintas. La fuerza vale
              $1200\ \text{N}$ y hay que aguantarla con el anclaje; lo que no
              hace es **trabajo**, porque su punto de aplicación no se
              desplaza. Si el álabe se moviera, la misma fuerza sí produciría
              potencia.

    resolucion: |
      Con las hipótesis del álabe, $v_1 = v_2 = v$ y solo cambia la dirección:

      $$
      \boxed{\theta = 90°:\quad F_x = F_y = \rho Qv = 600\ \text{N},\quad |F| = 848{,}5\ \text{N}}
      $$
      $$
      \boxed{\theta = 180°:\quad F_x = 2\rho Qv = 1200\ \text{N},\quad F_y = 0}
      $$

      > **Por qué las cucharas de una Pelton son dobles y muy curvadas.**
      > Porque el factor $(1-\cos\theta)$ vale 1 a noventa grados y **2** a
      > ciento ochenta: acercarse todo lo posible a devolver el chorro duplica
      > la fuerza sin gastar una gota más de agua.

  - id: ejflu15-el-alabe-movil
    titulo: El álabe que se mueve, y a qué velocidad conviene que gire
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      El mismo chorro del ejercicio anterior ($v = 20\ \text{m/s}$, sección
      $A = 15\ \text{cm}^{2}$) incide sobre una **rueda de álabes** que
      desvían el chorro $180°$. La rueda avanza con velocidad $u$ en la
      dirección del chorro.

      a) Escribir la potencia entregada en función de $u$.

      b) ¿Para qué $u$ es máxima, y cuánto vale?

      Tomar $\rho = 1000\ \text{kg/m}^{3}$.
    pide: La expresión de la potencia y su máximo.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una **rueda** de álabes, ¿qué caudal aprovecha la máquina?
        opciones:
          - texto: >-
              Todo el del chorro, $Q = A\,v$: siempre hay una cuchara
              recibiéndolo, aunque cada una se escape
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue la rueda del álabe suelto. Con un
              álabe único el caudal interceptado sería $A(v-u)$ y el óptimo
              saldría en $u = v/3$; con rueda, en $u = v/2$.
          - texto: >-
              Solo $A(v-u)$, porque los álabes huyen del chorro
            mensaje: |
              Eso vale para **un** álabe aislado. En una rueda, cuando una
              cuchara se aleja ya está entrando la siguiente, así que no se
              desperdicia nada del chorro.
          - texto: >-
              $A\,u$, el que barre la rueda
            mensaje: |
              El caudal lo fija el chorro, no la rueda: es $Av$, y no depende
              de a qué velocidad gire la máquina.

      - tipo: calcular
        titulo: La velocidad óptima
        pregunta: |
          ¿A qué velocidad debe avanzar la rueda para dar potencia máxima?
        respuesta:
          tipo: magnitud
          valor: '10 m/s'
          tolerancia: 0.01
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.67 m/s'
            mensaje: |
              Ese es el óptimo de un álabe **suelto** ($u = v/3$), que
              intercepta menos caudal al escaparse. Con una rueda,
              $u = v/2 = 10\ \text{m/s}$.
          - valor: '20 m/s'
            mensaje: |
              Con $u = v$ el álabe se mueve tan rápido como el chorro: la
              velocidad relativa es cero, no hay fuerza y la potencia es
              **nula**. El óptimo está en medio.
        pista: |
          Pot ∝ (v − u)·u. Deriva e iguala a cero.
        desarrollo: |
          $$
          \text{Pot} = \rho A v\,(v-u)\,(1-\cos180°)\,u = 2\rho A v\,(v-u)\,u
          $$

          El producto $(v-u)u$ es máximo en el punto medio del intervalo
          $[0,v]$:

          $$
          u = \frac{v}{2} = 10\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La potencia máxima
        pregunta: |
          ¿Cuánta potencia entrega en ese punto?
        respuesta:
          tipo: magnitud
          valor: '6 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '3.56 kW'
            mensaje: |
              Es la del álabe suelto en su propio óptimo. Con rueda, todo el
              caudal trabaja y salen $6\ \text{kW}$.
          - valor: '12 kW'
            mensaje: |
              Has usado $u = v$ en el factor $u$ y $v/2$ en el otro. Con
              $u = v/2$: $2\cdot1000\cdot0{,}03\cdot10\cdot10 = 6000\ \text{W}$.
        pista: |
          Pot = 2·ρ·A·v·(v − u)·u con u = 10 m/s, y A·v = 0,03 m³/s.
        desarrollo: |
          $$
          \text{Pot} = 2\rho\,(Av)\,(v-u)\,u = 2\cdot1000\cdot0{,}03\cdot10\cdot10
          = 6000\ \text{W} = 6\ \text{kW}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que empuja es la velocidad **relativa** $v-u$, no la
              absoluta.
          - texto: >-
              En una rueda el caudal aprovechado es $Av$, todo el del chorro.
          - texto: >-
              $\text{Pot} = 2\rho Av(v-u)u$, que es máxima en $u = v/2$.
          - texto: >-
              Con $u = 10\ \text{m/s}$: $\text{Pot} = 6\ \text{kW}$.
          - texto: >-
              Y ese máximo coincide con la potencia cinética del chorro,
              $\tfrac12\rho Av^{3} = 6\ \text{kW}$: rendimiento teórico del
              100 %, porque el agua sale con velocidad absoluta nula.
          - texto: >-
              Si la rueda se frenara del todo ($u = 0$), la potencia sería
              máxima, porque la fuerza sobre los álabes es la mayor posible.
            trampa: true
            mensaje: |
              La fuerza sí es máxima con la rueda parada, pero la **potencia**
              es fuerza por velocidad, y con $u = 0$ vale cero: una turbina
              bloqueada no produce nada. Los dos extremos dan potencia nula
              —$u=0$ y $u=v$— y el máximo está justo en medio.

    resolucion: |
      Con velocidad relativa $v-u$, caudal aprovechado $Av$ y $\theta = 180°$:

      $$
      \boxed{\text{Pot} = 2\rho\,A\,v\,(v-u)\,u}
      $$

      El producto $(v-u)u$ es máximo en $u = v/2$:

      $$
      \boxed{u = 10\ \text{m/s}}
      \qquad
      \boxed{\text{Pot}_{\max} = 6\ \text{kW}}
      $$

      > **El resultado que se usa para diseñar una Pelton.** La rueda gira a
      > la mitad de la velocidad del chorro, y en ese punto el rendimiento
      > teórico es del 100 %: el agua abandona la cuchara con velocidad
      > absoluta nula, habiendo entregado toda su energía. En la práctica se
      > queda en el 85–90 % por rozamiento y por no llegar a los 180°
      > exactos.

  # ── COLECCIÓN 4.4. El codo de 90° con pérdidas: el caso base del tema, con
  #    el término de presión mandando por treinta y cinco a uno.
  - id: ejflu15-col44-el-codo-de-noventa-grados
    titulo: La fuerza sobre un codo de noventa grados
    fuente: >-
      Ejercicio 4.4 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una tubería de $60\ \text{cm}$ de diámetro que transporta
      $900\ \text{l/s}$ de un aceite de peso específico relativo $0{,}85$
      tiene un codo de $90°$ en un plano horizontal. La pérdida de carga en el
      codo es de $1{,}10\ \text{mc}$ de aceite y la presión a la entrada es de
      $3\ \text{kg/cm}^{2}$. Se pide:

      a) Fuerza resultante ejercida por el aceite sobre el codo.
    pide: El módulo de la fuerza que el aceite ejerce sobre el codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El diámetro no cambia y el codo es horizontal. ¿Qué se deduce de la
          pérdida de carga?
        opciones:
          - texto: >-
              Que la presión de salida es la de entrada menos
              $1{,}10\ \text{mc}$ de aceite, porque ni la cota ni la velocidad
              cambian
            correcta: true
            mensaje: |
              Eso es. Con $z$ y $v$ iguales a los dos lados, Bernoulli se
              reduce a $p_1/\gamma - h_f = p_2/\gamma$: la pérdida se ve
              entera como caída de presión.
          - texto: >-
              Que la velocidad de salida es menor que la de entrada
            mensaje: |
              La velocidad la fija la continuidad, y con el mismo diámetro es
              la misma. Lo que pierde el fluido es presión, no velocidad.
          - texto: >-
              Que hay que restar la pérdida a la fuerza resultante
            mensaje: |
              La pérdida no se resta a una fuerza: entra cambiando la presión
              de salida, y esa presión sí aparece en el balance de cantidad de
              movimiento.

      - tipo: calcular
        titulo: La componente en la dirección de entrada
        pregunta: |
          ¿Cuánto vale la componente de la fuerza en el eje de entrada?
        respuesta:
          tipo: magnitud
          valor: '85.56 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '83.13 kn'
            mensaje: |
              Te has dejado el término de cantidad de movimiento. Es pequeño
              —$2{,}4\ \text{kN}$ frente a $83$— pero forma parte del balance,
              y en el examen se penaliza omitirlo.
          - valor: '2.435 kn'
            mensaje: |
              Solo has contado el término de cantidad de movimiento. Falta el
              de presión, $p_1 A$, que aquí es treinta y cuatro veces mayor.
        pista: |
          $p_1 A + R_x = \rho Q(0 - v)$, con $A = \pi\,0{,}6^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}9}{0{,}2827} = 3{,}183\ \text{m/s}
          \qquad
          p_1 A = 294\,000\cdot 0{,}2827 = 83{,}13\ \text{kN}
          $$
          $$
          |R_x| = p_1 A + \rho Q v = 83{,}13 + 2{,}44 = 85{,}56\ \text{kN}
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuál es el módulo de la fuerza sobre el codo?
        respuesta:
          tipo: magnitud
          valor: '119.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '168.5 kn'
            mensaje: |
              Has sumado las dos componentes como escalares. Son
              perpendiculares: hay que componerlas con el teorema de
              Pitágoras.
          - valor: '115.7 kn'
            mensaje: |
              Te has dejado el término de cantidad de movimiento en los dos
              ejes. Son solo $2{,}4\ \text{kN}$ en cada uno, pero al
              componerlos el resultado baja tres kilonewton y medio.
        pista: |
          Calcula la componente del eje de salida con $p_2$, y compón las dos.
        desarrollo: |
          $$
          \frac{p_2}{\gamma} = \frac{294\,000}{8330} - 1{,}10 = 34{,}19\ \text{mcl}
          \;\Longrightarrow\;
          p_2 = 284{,}8\ \text{kPa}
          $$
          $$
          |R_y| = p_2 A + \rho Q v = 80{,}54 + 2{,}44 = 82{,}97\ \text{kN}
          $$
          $$
          |R| = \sqrt{85{,}56^{2}+82{,}97^{2}} = 119{,}2\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con diámetro constante y codo horizontal, la pérdida de carga se
              ve entera como caída de presión: de 3 a
              $2{,}91\ \text{kg/cm}^{2}$.
          - texto: >-
              Cada eje lleva su fuerza de presión más su flujo de cantidad de
              movimiento: $85{,}6$ y $83{,}0\ \text{kN}$.
          - texto: >-
              La resultante es su composición vectorial, $119{,}2$ kN, a unos
              $44°$ de la dirección de entrada.
          - texto: >-
              La resultante saldría casi igual despreciando la pérdida de
              carga, así que el dato de $1{,}10\ \text{mc}$ es prescindible.
            trampa: true
            mensaje: |
              Cambia el resultado en un 1,5 % —de 121 a 119,2 kN—, que está por
              debajo de lo que se aprecia a ojo pero por encima de lo que un
              corrector tolera. Y sobre todo: **despreciar un dato que el
              enunciado da** es una decisión que hay que justificar, no una que
              se toma por comodidad.

    resolucion: |
      **Los dos ejes por separado, cada uno con sus dos términos.**

      $$
      \text{eje } x:\quad p_1 A + R_x = \rho Q(0-v)
      \qquad
      \text{eje } y:\quad -p_2 A + R_y = \rho Q(v-0)
      $$

      Con $v = 3{,}18\ \text{m/s}$, $A = 0{,}283\ \text{m}^{2}$,
      $p_1 = 294\ \text{kPa}$ y $p_2 = 284{,}8\ \text{kPa}$ tras descontar la
      pérdida:

      $$
      |R_x| = 85{,}6\ \text{kN}
      \qquad
      |R_y| = 83{,}0\ \text{kN}
      \qquad
      |R| = 119{,}2\ \text{kN}
      $$

      **Doce toneladas sobre un codo**, y ahí está el dato de ingeniería: por
      eso los codos de una conducción a presión van anclados con macizos de
      hormigón y no con tornillos.

      **Y el reparto entre los dos términos es el de siempre**: la presión
      aporta $83\ \text{kN}$ y la cantidad de movimiento $2{,}4$. Treinta y
      cuatro veces más. Quien se deje $p A$ no comete un error del 3 %, se deja
      el problema entero.

      La pérdida de carga, en cambio, sí es un detalle: mueve el resultado un
      1,5 %. Pero está en el enunciado, y un dato que se da se usa.

  # ── COLECCIÓN 4.5. Codo convergente: cambia la dirección Y el módulo de la
  #    velocidad, y las dos secciones tienen áreas distintas.
  - id: ejflu15-col45-el-codo-convergente
    titulo: Un codo que además estrecha, y las dos componentes de su anclaje
    fuente: >-
      Ejercicio 4.5 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un aceite de peso específico relativo $0{,}75$ fluye por un codo
      convergente en posición horizontal de $120°$, entre planos que pasan por
      las secciones extremas. El diámetro aguas abajo es de $600\ \text{mm}$ y
      la presión de $0{,}8\ \text{kg/cm}^{2}$. El diámetro aguas arriba es de
      $750\ \text{mm}$ y el caudal de $100\ \text{m}^{3}/\text{min}$.
      Despreciando las pérdidas de energía debidas al codo, se pide:

      a) Componentes de la fuerza (paralela y normal a la velocidad de aguas
      abajo) necesaria para soportar el codo.

      Nota: se despreciarán las energías de posición.
    pide: Las dos componentes de la fuerza de anclaje del codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El codo es «de $120°$ entre planos que pasan por las secciones
          extremas». ¿Cuánto se desvía el flujo?
        opciones:
          - texto: >-
              $60°$: el ángulo entre las secciones es el suplementario del que
              gira la corriente
            correcta: true
            mensaje: |
              Es la trampa de notación de este ejercicio, y la misma que
              aparece en los álabes. Con $120°$ entre planos, la velocidad gira
              $180° - 120° = 60°$.
          - texto: >-
              $120°$, el ángulo que da el enunciado
            mensaje: |
              El enunciado especifica «entre planos que pasan por las secciones
              extremas», que no es lo mismo que el ángulo de desviación. Con
              $120°$ de giro la fuerza saldría bastante mayor.
          - texto: >-
              $30°$, la mitad
            mensaje: |
              La mitad del ángulo aparece en la fórmula del módulo de la
              resultante de un álabe, pero no es el ángulo de desviación. Aquí
              la desviación es el suplementario, $60°$.

      - tipo: calcular
        titulo: La presión aguas arriba
        pregunta: |
          ¿Qué presión hay aguas arriba, en metros de columna de aceite?
        respuesta:
          tipo: magnitud
          valor: '11.71 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '10.67 m'
            mensaje: |
              Esa es la presión aguas **abajo**. Como el codo converge, el
              fluido se acelera y por Bernoulli la presión de entrada tiene que
              ser mayor.
          - valor: '9.62 m'
            mensaje: |
              Has restado la diferencia de alturas cinéticas en vez de
              sumarla. Aguas arriba la velocidad es menor, así que la presión
              es **mayor**.
        pista: |
          Bernoulli sin pérdidas y sin cotas:
          $p_1/\gamma = p_2/\gamma + (v_2^{2}-v_1^{2})/2g$.
        desarrollo: |
          $$
          v_1 = \frac{1{,}667}{0{,}4418} = 3{,}77\ \text{m/s}
          \qquad
          v_2 = \frac{1{,}667}{0{,}2827} = 5{,}89\ \text{m/s}
          $$
          $$
          \frac{p_1}{\gamma} = \frac{0{,}8\cdot 98\,000}{7350}
          + \frac{5{,}89^{2}-3{,}77^{2}}{19{,}6}
          = 10{,}67 + 1{,}05 = 11{,}71\ \text{mcl}
          $$

      - tipo: calcular
        titulo: La componente normal
        pregunta: |
          ¿Cuánto vale la componente **normal** a la velocidad de aguas abajo?
        respuesta:
          tipo: magnitud
          valor: '37.02 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '32.94 kn'
            mensaje: |
              Solo has contado la fuerza de presión de la entrada. Falta el
              flujo de cantidad de movimiento que entra con esa misma
              inclinación, otros $4{,}1\ \text{kN}$.
          - valor: '21.38 kn'
            mensaje: |
              Has proyectado con el coseno de $60°$ en vez de con el seno. El
              eje normal a la salida recoge la componente $\sin 60°$ de todo lo
              que entra inclinado, no la del coseno.
        pista: |
          Proyecta sobre el eje perpendicular a la salida: solo intervienen la
          presión de entrada y su cantidad de movimiento, las dos inclinadas
          $60°$.
        desarrollo: |
          Con la salida en $+x$ y la entrada girada $60°$:

          $$
          p_1 A_1\sin 60° + R_y = \rho Q(0 - v_1\sin 60°)
          $$
          $$
          R_y = -(32{,}94 + 4{,}08) = -37{,}02\ \text{kN}
          $$

      - tipo: calcular
        titulo: La componente paralela
        pregunta: |
          ¿Y la componente **paralela** a la velocidad de aguas abajo?
        respuesta:
          tipo: magnitud
          valor: '8.16 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '22.17 kn'
            mensaje: |
              Solo has contado la presión de salida. En este eje intervienen
              cuatro términos: las dos presiones y las dos cantidades de
              movimiento, y casi se cancelan.
          - valor: '3.15 kn'
            mensaje: |
              Te has dejado el flujo de cantidad de movimiento. Aquí sí importa:
              como los términos de presión casi se cancelan, los
              $5\ \text{kN}$ de la cantidad de movimiento son más de la mitad
              del resultado.
        pista: |
          $p_1A_1\cos 60° - p_2A_2 + R_x = \rho Q(v_2 - v_1\cos 60°)$.
        desarrollo: |
          $$
          R_x = \rho Q(v_2 - v_1\cos 60°) - p_1A_1\cos 60° + p_2A_2
          $$
          $$
          = 5{,}01 - 19{,}02 + 22{,}17 = 8{,}16\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              «$120°$ entre planos» significa que la corriente gira $60°$: es
              el suplementario.
          - texto: >-
              Al converger, la velocidad sube de 3,77 a 5,89 m/s y la presión
              de entrada resulta mayor que la de salida.
          - texto: >-
              Las componentes son $37{,}0\ \text{kN}$ normal y $8{,}2$
              paralela a la velocidad de salida.
          - texto: >-
              La componente paralela sale pequeña porque en esa dirección el
              flujo apenas cambia de cantidad de movimiento.
            trampa: true
            mensaje: |
              Sale pequeña porque los dos términos de **presión** casi se
              cancelan: $19{,}0$ de la entrada contra $22{,}2$ de la salida. La
              cantidad de movimiento, en cambio, aporta $5{,}0\ \text{kN}$ en
              esa dirección, que es más de la mitad del resultado.

    resolucion: |
      **Lo primero es el ángulo.** «$120°$ entre planos que pasan por las
      secciones extremas» significa que la corriente **gira $60°$**. Es la
      misma trampa de notación que en los álabes del tema, y equivocarse aquí
      arruina todo lo demás.

      **Después, Bernoulli**, porque el codo converge y el enunciado solo da la
      presión de salida:

      $$
      \frac{p_1}{\gamma} = 10{,}67 + \frac{5{,}89^{2}-3{,}77^{2}}{19{,}6}
      = 11{,}71\ \text{mcl}
      $$

      **Y el balance por componentes**, con la salida en $+x$:

      | | presión | cantidad de mov. | total |
      |---|---|---|---|
      | paralela | $-19{,}0 + 22{,}2$ | $+5{,}0$ | $8{,}2\ \text{kN}$ |
      | normal | $-32{,}9$ | $-4{,}1$ | $37{,}0\ \text{kN}$ |

      **La componente normal es cuatro veces y media la paralela**, y eso es
      lo que hay que anclar. Un codo no tira hacia delante: tira hacia fuera de
      la curva, que es donde hay que poner el macizo.

      Y fíjate en la fila de la paralela: los dos términos de presión casi se
      cancelan —19,0 contra 22,2— así que ahí la cantidad de movimiento, que
      normalmente es despreciable, aporta más de la mitad del resultado. **Cuál
      de los dos términos manda depende de la dirección que se mire.**

  # ── COLECCIÓN 4.10. Placa inclinada: la fuerza sale de una línea y el
  #    reparto de caudales, de otra. Dos ecuaciones distintas del mismo TCM.
  - id: ejflu15-col410-la-placa-inclinada
    titulo: Un chorro contra una placa inclinada, y cómo se reparte el agua
    fuente: >-
      Ejercicio 4.10 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un chorro de agua de $50\ \text{mm}$ de diámetro incide sobre una placa
      cuadrada, la cual forma $30°$ con la dirección del chorro. La velocidad
      del agua en el chorro es de $18\ \text{m/s}$ e incide en la placa en su
      centro de gravedad. Despreciando el rozamiento y el peso de la placa, se
      pide:

      a) Fuerza $P$ que hay que aplicar en el extremo para mantener la placa en
      equilibrio.

      b) Reparto de caudales.

      (La placa está articulada en uno de sus extremos y la fuerza $P$ se
      aplica en el opuesto; el chorro incide en el punto medio.)
    pide: La fuerza en el extremo y los dos caudales que salen de la placa.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin rozamiento, ¿en qué dirección es la fuerza sobre la placa?
        opciones:
          - texto: >-
              Perpendicular a ella, porque sin rozamiento el fluido no puede
              ejercer ninguna componente tangencial
            correcta: true
            mensaje: |
              Eso es, y simplifica el problema entero: solo hay que proyectar
              la cantidad de movimiento del chorro sobre la normal a la placa.
          - texto: >-
              En la dirección del chorro, porque es la del movimiento
            mensaje: |
              Esa sería la dirección si la placa fuera perpendicular. Al estar
              inclinada, la fuerza sigue siendo normal a la **placa**, no al
              chorro.
          - texto: >-
              A $30°$ de la placa, como el chorro
            mensaje: |
              Una superficie lisa solo puede empujar perpendicularmente a sí
              misma. El ángulo del chorro entra en el cálculo del módulo, no en
              la dirección de la fuerza.

      - tipo: calcular
        titulo: La fuerza en el extremo
        pregunta: |
          ¿Qué fuerza $P$ hay que aplicar?
        respuesta:
          tipo: magnitud
          valor: '159 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '318.1 n'
            mensaje: |
              Esa es la fuerza total del chorro sobre la placa. Como incide en
              el punto medio y $P$ se aplica en el extremo, el momento respecto
              de la articulación la deja en la mitad.
          - valor: '275.5 n'
            mensaje: |
              Has usado el coseno de $30°$ en vez del seno. Lo que empuja la
              placa es la componente **perpendicular** a ella, y con el chorro
              a $30°$ de la placa esa componente lleva el seno.
        pista: |
          $F = \rho Q v\sin 30°$, y después momentos: el chorro está en el
          centro y $P$ en el extremo.
        desarrollo: |
          $$
          Q = 18\cdot\frac{\pi\,0{,}05^{2}}{4} = 35{,}34\ \text{l/s}
          $$
          $$
          F = \rho\,Q\,v\sin 30° = 1000\cdot 0{,}03534\cdot 18\cdot 0{,}5
          = 318{,}1\ \text{N}
          $$
          $$
          P = \frac{F}{2} = 159\ \text{N}
          $$

      - tipo: calcular
        titulo: El caudal mayor
        pregunta: |
          ¿Qué caudal se va por la rama grande?
        respuesta:
          tipo: magnitud
          valor: '32.98 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.67 l/s'
            mensaje: |
              Has repartido el caudal por la mitad. Solo se reparte así con la
              placa perpendicular; inclinada, el chorro se desvía
              preferentemente hacia un lado.
          - valor: '26.51 l/s'
            mensaje: |
              Has usado $\sin 30°$ donde va el coseno. El reparto es
              $Q_{1,2} = \frac{Q}{2}(1\pm\cos\theta)$, con $\theta$ el ángulo
              entre el chorro y la placa; el seno es el que va en la fuerza.
        pista: |
          Cantidad de movimiento **a lo largo** de la placa: sin rozamiento se
          conserva, y de ahí sale el reparto.
        desarrollo: |
          Sin rozamiento no hay fuerza tangencial, así que la cantidad de
          movimiento paralela a la placa se conserva:

          $$
          Q_1 - Q_2 = Q\cos 30°
          \qquad
          Q_1 + Q_2 = Q
          $$
          $$
          Q_1 = \frac{Q}{2}(1+\cos 30°) = 32{,}98\ \text{l/s}
          \qquad
          Q_2 = 2{,}37\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin rozamiento la fuerza es normal a la placa, y vale
              $\rho Q v\sin 30° = 318$ N.
          - texto: >-
              Como el chorro incide en el centro y $P$ se aplica en el extremo,
              basta la mitad: 159 N.
          - texto: >-
              El reparto sale de conservar la cantidad de movimiento paralela a
              la placa: 32,98 y 2,37 l/s.
          - texto: >-
              Con la placa a $30°$ el reparto es muy desigual porque la mayor
              parte del agua rebota hacia atrás.
            trampa: true
            mensaje: |
              No rebota: sin rozamiento el agua **resbala** sobre la placa
              conservando su velocidad, y se reparte según hacia dónde apuntaba
              su cantidad de movimiento tangencial. Con 30° casi toda seguía
              hacia delante, y por eso el 93 % se va por esa rama.

    resolucion: |
      **Dos preguntas, dos ecuaciones distintas del mismo teorema.**

      **La fuerza** sale de la componente **normal** a la placa, que es la
      única que existe sin rozamiento:

      $$
      F = \rho\,Q\,v\sin 30° = 318\ \text{N}
      \qquad
      P = \frac{F}{2} = 159\ \text{N}
      $$

      **El reparto** sale de la componente **tangencial**, que sin rozamiento
      se conserva:

      $$
      Q_1 - Q_2 = Q\cos 30°
      \;\Longrightarrow\;
      Q_1 = 32{,}98
      \qquad
      Q_2 = 2{,}37\ \text{l/s}
      $$

      **El 93 % del agua se va por una sola rama.** Con la placa casi paralela
      al chorro, la cantidad de movimiento tangencial es grande y arrastra casi
      todo el caudal hacia delante. Con la placa perpendicular, $\cos 90° = 0$
      y el reparto sería mitad y mitad.

      **La estructura del problema conviene retenerla**: la componente normal
      da la **fuerza** y la tangencial da el **reparto**. Son las dos
      proyecciones de la misma ecuación vectorial, y confundirlas —usar el
      seno donde va el coseno— es el error que producen los dos distractores.

  # ── COLECCIÓN 4.11. Ensanchamiento brusco: la única pérdida localizada que
  #    se deduce, y aquí con aire para que además haya que calcular su
  #    densidad.
  - id: ejflu15-col411-el-ensanchamiento-brusco-con-aire
    titulo: El ensanchamiento brusco, deducido, y con aire dentro
    fuente: >-
      Ejercicio 4.11 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por un conducto de $60\ \text{cm}$ de diámetro circula aire a una presión
      absoluta $p = 0{,}7\ \text{kg/cm}^{2}$, $T = 5\ °\text{C}$ y
      $v = 60\ \text{m/s}$. El conducto sufre un ensanchamiento brusco pasando
      a tener $75\ \text{cm}$ de diámetro. Considerando el gas como
      incompresible, se pide:

      a) Pérdidas en el ensanchamiento brusco.

      b) Diferencia de presiones en el ensanchamiento.
    pide: La pérdida de carga y la diferencia de presiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la pérdida de un ensanchamiento brusco se puede **deducir**
          y la de un codo no?
        opciones:
          - texto: >-
              Porque combinando el teorema de la cantidad de movimiento con
              Bernoulli quedan dos ecuaciones y dos incógnitas, sin ningún
              coeficiente experimental
            correcta: true
            mensaje: |
              Eso es, y es el único caso del temario en que ocurre. En un codo
              o una válvula hay que medir; aquí basta con plantear las dos
              ecuaciones y eliminar la presión.
          - texto: >-
              Porque el ensanchamiento no tiene pérdidas
            mensaje: |
              Sí las tiene, y grandes: aquí 23,8 metros de columna de aire. Lo
              que ocurre es que se pueden calcular sin recurrir a tablas.
          - texto: >-
              Porque el flujo es incompresible
            mensaje: |
              Los codos también se estudian con flujo incompresible y su
              pérdida sigue siendo experimental. Lo que hace especial al
              ensanchamiento es que su geometría permite cerrar el sistema.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánto vale la pérdida en el ensanchamiento?
        respuesta:
          tipo: magnitud
          valor: '23.8 m'
          tolerancia: 0.02
          formato: una longitud, en metros de columna de aire
        distractores:
          - valor: '108.4 m'
            mensaje: |
              Esa es la diferencia de alturas cinéticas,
              $(v_1^{2}-v_2^{2})/2g$. La pérdida es
              $(v_1-v_2)^{2}/2g$, que es mucho menor: parte de la energía
              cinética sí se recupera como presión.
          - valor: '183.7 m'
            mensaje: |
              Has usado $v_1^{2}/2g$ entera, como si el aire se parase del
              todo. Solo se pierde la energía asociada a la **diferencia** de
              velocidades.
        pista: |
          $h_f = \dfrac{(v_1-v_2)^{2}}{2g}$, con $v_2$ de la continuidad.
        desarrollo: |
          $$
          v_2 = v_1\left(\frac{D_1}{D_2}\right)^{2} = 60\cdot 0{,}64
          = 38{,}4\ \text{m/s}
          $$
          $$
          h_f = \frac{(60-38{,}4)^{2}}{19{,}6} = \frac{466{,}6}{19{,}6}
          = 23{,}8\ \text{m de columna de aire}
          $$

      - tipo: calcular
        titulo: La diferencia de presiones
        pregunta: |
          ¿Cuánto sube la presión, en centímetros de columna de agua?
        respuesta:
          tipo: numero
          valor: '7.27'
          tolerancia: 0.15
          formato: un número en centímetros de columna de agua
        distractores:
          - valor: '84.64'
            mensaje: |
              Ese es el valor en metros de columna de **aire**. Hay que pasarlo
              a columna de agua, y como el aire es unas mil ciento cincuenta
              veces más ligero, el número se reduce muchísimo.
          - valor: '10.94'
            mensaje: |
              Has usado la densidad del aire en condiciones normales,
              $1{,}29\ \text{kg/m}^{3}$. En este conducto, a
              $0{,}7\ \text{kg/cm}^{2}$ absolutos y $5\ °\text{C}$, sale
              $0{,}859$: un 33 % menos.
        pista: |
          Bernoulli con la pérdida, y después de columna de aire a columna de
          agua con $\rho_{\text{aire}} = p/(RT)$.
        desarrollo: |
          $$
          \frac{p_2-p_1}{\gamma_{\text{aire}}}
          = \frac{v_1^{2}-v_2^{2}}{2g} - h_f = 108{,}4 - 23{,}8
          = 84{,}6\ \text{m de aire}
          $$
          $$
          \rho = \frac{p}{RT} = \frac{68\,600}{287\cdot 278}
          = 0{,}859\ \frac{\text{kg}}{\text{m}^{3}}
          \;\Longrightarrow\;
          \gamma = 8{,}42\ \frac{\text{N}}{\text{m}^{3}}
          $$
          $$
          \Delta p = 84{,}6\cdot 8{,}42 = 713\ \text{Pa} = 7{,}27\ \text{cm de agua}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La continuidad da $v_2 = 38{,}4$ m/s, y la pérdida del
              ensanchamiento es $(v_1-v_2)^{2}/2g = 23{,}8$ m de aire.
          - texto: >-
              Bernoulli con esa pérdida deja $84{,}6$ m de columna de aire de
              recuperación de presión.
          - texto: >-
              Con la densidad del aire en esas condiciones, eso son solo
              $7{,}3$ cm de columna de agua.
          - texto: >-
              Como la pérdida es de 23,8 metros, en un conducto de aire un
              ensanchamiento brusco es inaceptable.
            trampa: true
            mensaje: |
              Veintitrés metros **de columna de aire** son 200 pascales: dos
              milésimas de atmósfera. En un conducto de aire las alturas de
              columna engañan siempre, y hay que traducirlas a presión antes de
              juzgar si algo es mucho o poco.

    resolucion: |
      **La pérdida se deduce, y es el único caso del temario en que se puede.**
      Combinando el teorema de la cantidad de movimiento con Bernoulli sale

      $$
      h_f = \frac{(v_1-v_2)^{2}}{2g} = \frac{(60-38{,}4)^{2}}{19{,}6}
      = 23{,}8\ \text{m de columna de aire}
      $$

      **Y la presión sube**, pese a la pérdida, porque el aire se frena:

      $$
      \frac{\Delta p}{\gamma} = \frac{v_1^{2}-v_2^{2}}{2g} - h_f
      = 108{,}4 - 23{,}8 = 84{,}6\ \text{m de aire}
      $$

      Con $\rho = p/(RT) = 0{,}859\ \text{kg/m}^{3}$, eso son
      $713\ \text{Pa} = 7{,}3\ \text{cm de columna de agua}$.

      **La lección de unidades es la mitad del ejercicio.** Ochenta y cuatro
      metros de columna de aire suenan a barbaridad y son siete centímetros de
      agua. En conductos de gas, las alturas de columna del propio fluido son
      números enormes sin significado intuitivo: **hay que traducirlas a
      pascales o a milímetros de agua antes de juzgar nada**. Por eso los
      manómetros de ventilación se gradúan en mm de columna de agua y no en
      metros de aire.

      **Y el reparto entre recuperación y pérdida** es lo que decide si un
      ensanchamiento brusco es aceptable: de los $108\ \text{m}$ de energía
      cinética que el aire deja de tener, se recuperan $85$ como presión y se
      pierden $24$. Un difusor cónico bien hecho recuperaría casi todo — y esa
      es exactamente la diferencia entre un ensanchamiento brusco y uno
      gradual.

  # ── COLECCIÓN 4.8. La pieza en Y es el caso donde el teorema de la cantidad
  #    de movimiento se gana el sueldo: tres ramas, tres direcciones, y una
  #    fuerza de 17 kN que hay que anclar. La geometría viene de la figura del
  #    boletín —30° y 60° sobre la horizontal, la rama 2 vertical hacia
  #    abajo— y aquí se describe con palabras para no depender del dibujo.
  - id: ejflu15-col48-la-pieza-en-y
    titulo: La pieza en Y, y las diecisiete toneladas que hay que anclar
    fuente: >-
      Ejercicio 4.8 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una pieza en Y en posición vertical, por la que circula agua.
      Sus tres ramas están en el mismo plano vertical:

      - **1**, por la que **entra** el agua, con su eje a $30°$ sobre la
        horizontal y viniendo de arriba a la derecha:
        $Q_1 = 250\ \text{l/s}$, $D_1 = 300\ \text{mm}$,
        $P_1 = 3{,}5\ \text{kg/cm}^{2}$.
      - **2**, vertical y hacia abajo: $Q_2 = 150\ \text{l/s}$,
        $D_2 = 250\ \text{mm}$.
      - **3**, con su eje a $60°$ sobre la horizontal y saliendo hacia arriba
        a la izquierda: $D_3 = 200\ \text{mm}$.

      Se pide:

      a) Esfuerzos en dirección vertical y horizontal a que está sometida.

      b) Resultante de la fuerza en módulo, dirección y sentido.

      Nota: despréciense la gravedad, las pérdidas de carga y las energías de
      posición.
    pide: Las dos componentes del esfuerzo sobre la pieza y su resultante.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear el teorema de la cantidad de movimiento, ¿qué hay
          que tener y de dónde sale?
        opciones:
          - texto: >-
              El caudal de las tres ramas —por continuidad— y la presión de
              las tres —por Bernoulli desde la rama 1—, porque el teorema
              necesita todas las fuerzas de presión de la superficie de
              control
            correcta: true
            mensaje: |
              Eso es. El teorema de la cantidad de movimiento no se basta
              solo: la continuidad da los caudales y Bernoulli las presiones,
              y solo entonces se puede escribir el balance.
          - texto: >-
              Solo los caudales; las presiones de 2 y 3 son atmosféricas
              porque son salidas
            mensaje: |
              Salir de la pieza no es salir a la atmósfera: las ramas 2 y 3
              siguen siendo tubería. Sus presiones son casi las de la rama 1,
              y multiplicadas por sus secciones dan fuerzas de decenas de
              kilonewtons. Ignorarlas cambia el resultado por completo.
          - texto: >-
              Nada más: el teorema relaciona directamente los caudales con la
              fuerza
            mensaje: |
              La relación directa entre caudal y fuerza solo vale cuando las
              presiones son iguales en todas las caras —un chorro libre, por
              ejemplo—. En una pieza a 3,5 kg/cm² las presiones son el término
              dominante: aportan veinte veces más que la cantidad de
              movimiento.

      - tipo: calcular
        titulo: El caudal de la tercera rama
        pregunta: |
          ¿Qué caudal sale por la rama 3?
        respuesta:
          tipo: magnitud
          valor: '100 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '400 l/s'
            mensaje: |
              Has sumado. Por la rama 1 entran 250 l/s y por la 2 salen 150:
              lo que queda para la 3 es la diferencia. El agua no se crea
              dentro de la pieza.
          - valor: '125 l/s'
            mensaje: |
              Parece que has repartido los 250 l/s a partes iguales entre las
              dos salidas. El enunciado fija la rama 2 en 150 l/s, y el resto
              es lo que va por la 3.
        pista: |
          Continuidad: lo que entra es lo que sale.
        desarrollo: |
          $$
          Q_3 = Q_1 - Q_2 = 250 - 150 = 100\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El esfuerzo horizontal
        pregunta: |
          ¿Cuánto vale la componente horizontal de la fuerza sobre la pieza?
        respuesta:
          tipo: magnitud
          valor: '16.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '15.59 kn'
            mensaje: |
              Te has dejado los términos de cantidad de movimiento y has
              sumado solo las fuerzas de presión. Aquí la presión manda —es el
              96 % del resultado— pero el 4 % restante también cuenta.
          - valor: '21 kn'
            mensaje: |
              Parece que has contado solo la entrada, $p_1A_1\cos 30° = 21$
              kN. Las dos salidas empujan en sentido contrario y descuentan
              casi cinco kilonewtons.
        pista: |
          Proyecta sobre $x$: las presiones $p_iA_i$ apuntando **hacia** la
          pieza en cada rama, y el flujo de cantidad de movimiento
          $\rho Q_i v_i$ saliente menos entrante.
        desarrollo: |
          Velocidades: $v_1 = 3{,}537$, $v_2 = 3{,}056$, $v_3 = 3{,}183$ m/s.
          Con Bernoulli desde 1 (sin cota ni pérdidas):
          $p_2 = 344{,}6$ kPa y $p_3 = 344{,}2$ kPa frente a los
          $343$ kPa de la rama 1.

          | | $p_iA_i$ (N) | dirección | $x$ |
          |---|---|---|---|
          | 1 (entra) | 24.245 | $(-\cos30, -\sin30)$ | $-20.997$ |
          | 2 (sale) | 16.916 | $(0,+1)$ | $0$ |
          | 3 (sale) | 10.813 | $(+\cos60, -\sin60)$ | $+5.407$ |

          $$
          \sum (pA)_x = -15{,}59\ \text{kN}
          \qquad
          \Delta(\rho Q v)_x = +0{,}61\ \text{kN}
          $$
          $$
          F_x = 0{,}61 + 15{,}59 = 16{,}2\ \text{kN}
          $$

      - tipo: calcular
        titulo: El esfuerzo vertical
        pregunta: |
          ¿Y la componente vertical?
        respuesta:
          tipo: magnitud
          valor: '4.83 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4.57 kn'
            mensaje: |
              Solo las presiones, sin la cantidad de movimiento. En la
              vertical el término de momento pesa más que en la horizontal
              —un 5 %— porque la rama 2 descarga hacia abajo.
          - valor: '0.26 kn'
            mensaje: |
              Solo la cantidad de movimiento, sin las presiones. Doscientos
              sesenta newtons es lo que pesaría un bidón: no es el orden de
              magnitud de una pieza a 3,5 kg/cm².
        pista: |
          Lo mismo que en la horizontal, proyectando ahora sobre el eje
          vertical.
        desarrollo: |
          | | $p_iA_i$ (N) | $y$ |
          |---|---|---|
          | 1 (entra) | 24.245 | $-12.123$ |
          | 2 (sale) | 16.916 | $+16.916$ |
          | 3 (sale) | 10.813 | $-9.364$ |

          $$
          \sum (pA)_y = -4{,}57\ \text{kN}
          \qquad
          \Delta(\rho Q v)_y = +0{,}26\ \text{kN}
          $$
          $$
          F_y = 0{,}26 + 4{,}57 = 4{,}83\ \text{kN}
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuál es el módulo de la fuerza total sobre la pieza?
        respuesta:
          tipo: magnitud
          valor: '16.9 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '21.03 kn'
            mensaje: |
              Has sumado las componentes en vez de componerlas. Son
              perpendiculares: el módulo es la hipotenusa,
              $\sqrt{16{,}2^{2} + 4{,}83^{2}}$, no la suma.
          - valor: '11.37 kn'
            mensaje: |
              Las has restado. Dos componentes perpendiculares nunca se
              cancelan entre sí: la resultante es siempre mayor que la mayor
              de las dos.
        pista: |
          Teorema de Pitágoras con las dos componentes.
        desarrollo: |
          $$
          |F| = \sqrt{16{,}2^{2} + 4{,}83^{2}} = 16{,}9\ \text{kN}
          \qquad
          \alpha = \arctan\frac{4{,}83}{16{,}2} = 16{,}6°
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Por continuidad, $Q_3 = 250 - 150 = 100$ l/s, y con las
              secciones salen $v_1 = 3{,}54$, $v_2 = 3{,}06$ y
              $v_3 = 3{,}18$ m/s.
          - texto: >-
              Bernoulli desde la rama 1 da $p_2 = 344{,}6$ y $p_3 = 344{,}2$
              kPa: apenas kilopascal y medio por encima de la entrada, porque
              las velocidades son parecidas.
          - texto: >-
              Sumando presiones y cantidad de movimiento salen 16,2 kN
              horizontales y 4,83 verticales, es decir 16,9 kN a 16,6° de la
              horizontal.
          - texto: >-
              Y como las tres velocidades son casi iguales, el término de
              cantidad de movimiento se cancela y el resultado es puramente
              hidrostático.
            trampa: true
            mensaje: |
              No se cancela: aporta 0,61 kN en $x$ y 0,26 en $y$, un 4 % y un
              5 % del total. Es poco, pero no es cero, **y no es porque las
              velocidades sean parecidas sino porque son pequeñas**. Si la
              pieza llevara el mismo caudal por secciones cuatro veces
              menores, las velocidades se multiplicarían por 16, el término de
              momento por 256, y sería él quien mandara.

    resolucion: |
      **Por qué hace falta Bernoulli antes del teorema.** El balance de
      cantidad de movimiento pide **todas** las fuerzas que actúan sobre el
      volumen de control, y en las tres bocas hay una fuerza de presión. Solo
      se da la de la rama 1, así que las otras dos hay que calcularlas. Sin
      pérdidas y sin cotas,

      $$
      p_i = p_1 + \frac{\rho}{2}\left(v_1^{2} - v_i^{2}\right)
      $$

      y salen $344{,}6$ y $344{,}2$ kPa frente a $343$: **la presión apenas
      cambia**, porque las tres velocidades andan por 3 m/s. Pero eso no
      significa que las fuerzas sean parecidas: cada una se multiplica por su
      sección, y las secciones sí son muy distintas.

      | rama | $D$ | $A$ | $v$ | $p$ | $pA$ |
      |---|---|---|---|---|---|
      | 1 | 300 mm | 0,0707 m² | 3,54 m/s | 343,0 kPa | 24,25 kN |
      | 2 | 250 mm | 0,0491 m² | 3,06 m/s | 344,6 kPa | 16,92 kN |
      | 3 | 200 mm | 0,0314 m² | 3,18 m/s | 344,2 kPa | 10,81 kN |

      **El balance.** Con $x$ hacia la derecha e $y$ hacia arriba, cada boca
      aporta su $pA$ dirigida **hacia dentro** de la pieza, y el flujo de
      cantidad de movimiento aporta $\rho Q v$ saliente menos entrante:

      $$
      F_x = 16{,}2\ \text{kN}
      \qquad
      F_y = 4{,}83\ \text{kN}
      \qquad
      |F| = 16{,}9\ \text{kN}\ \text{a}\ 16{,}6°
      $$

      **Lo que hay que ver en el reparto.** De los 16,2 kN horizontales,
      15,59 los ponen las presiones y 0,61 la cantidad de movimiento: **el
      96 % es presión.** Y de los 4,83 verticales, 4,57 y 0,26. Es la
      situación normal en una conducción a presión, y explica por qué los
      anclajes de las piezas especiales se dimensionan por la presión de
      prueba y no por el caudal.

      Al revés ocurre en un chorro libre —el álabe de una Pelton, la placa del
      ejercicio 4.10—, donde la presión es la atmosférica en todas las caras,
      se cancela, y **todo** el esfuerzo lo pone la cantidad de movimiento. Los
      dos casos límite del mismo teorema.

      **Y el orden de magnitud.** Diecisiete kilonewtons son casi dos
      toneladas empujando una pieza que cabe en un armario. Una Y de
      fundición sin anclar se sale de la tubería: por eso las derivaciones
      llevan macizos de hormigón, y por eso este cálculo es de proyecto y no
      de examen solamente.
  - id: ejflu15-col43-el-chorro-contra-la-placa-inclinada
    titulo: El chorro contra la placa inclinada, y cómo se reparte
    fuente: Ejercicio 4.3 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un orificio en pared delgada de 150 mm de diámetro, situado a una
      profundidad de 7,5 m sobre la pared de un depósito, descarga un caudal de
      180 l/s de agua. El chorro incide sobre una pantalla plana, inclinada 60º
      con la horizontal. Para mantener dicha pantalla en esa posición hay que
      aplicar frente al chorro una fuerza de 180 kg en dirección perpendicular a
      la pantalla.

      Suponiendo constante la altura del depósito, calcular:

      a) Coeficientes de los orificios $C_c$, $C_v$ y $C_d$.

      b) Reparto de caudales en la pantalla.

      Nota: Suponer nulo el rozamiento en la placa.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 290" role="img" width="440" height="290"
           aria-labelledby="f43t f43d">
        <title id="f43t">El depósito con el orificio a 7,5 m y el chorro que choca contra una placa inclinada 60 grados</title>
        <desc id="f43d">Un depósito de agua con la lámina libre arriba y un
        orificio en pared delgada 7,5 metros más abajo. Del orificio sale un
        chorro horizontal que incide sobre una placa plana inclinada sesenta
        grados respecto de la horizontal. Al chocar, el chorro se reparte en dos
        láminas que resbalan por la placa, una hacia arriba y otra hacia abajo.
        Una fuerza perpendicular a la placa la mantiene en su sitio.</desc>
        <defs>
          <marker id="m43l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m43f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m43n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="20" y="40" width="130" height="150" fill="var(--live)" opacity="0.15"/>
        <path d="M20,40 v150 h130" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M150,40 V178 M150,190 V190" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="20" y1="40" x2="150" y2="40" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M78,31 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <text x="34" y="120" font-size="10.5" fill="var(--ink)">agua</text>
        <line x1="150" y1="178" x2="150" y2="190" stroke="var(--paper)" stroke-width="3"/>
        <line x1="150" y1="184" x2="262" y2="184" stroke="var(--live)" stroke-width="3" marker-end="url(#m43l)"/>
        <text x="160" y="176" font-size="9.5" fill="var(--live)">180 l/s · Ø 150</text>
        <line x1="100" y1="44" x2="100" y2="180" stroke="var(--faint)" stroke-width="1" marker-start="url(#m43n)" marker-end="url(#m43n)"/>
        <text x="96" y="112" text-anchor="end" font-size="10" fill="var(--faint)">7,5 m</text>
        <line x1="222" y1="266" x2="316" y2="103" stroke="var(--ink)" stroke-width="4"/>
        <text x="320" y="100" font-size="10.5" fill="var(--ink)">placa</text>
        <line x1="180" y1="266" x2="400" y2="266" stroke="var(--faint)" stroke-width="1.2"/>
        <path d="M258,266 A38,38 0 0 0 241,234" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="266" y="258" font-size="10" fill="var(--alt)">60°</text>
        <path d="M254,180 q22,-24 30,-52" fill="none" stroke="var(--live)" stroke-width="2.6" marker-end="url(#m43l)"/>
        <text x="288" y="132" font-size="10" fill="var(--live)">Q2</text>
        <path d="M250,192 q10,26 6,50" fill="none" stroke="var(--live)" stroke-width="2.6" marker-end="url(#m43l)"/>
        <text x="262" y="230" font-size="10" fill="var(--live)">Q3</text>
        <line x1="330" y1="238" x2="278" y2="208" stroke="var(--flag)" stroke-width="2.4" marker-end="url(#m43f)"/>
        <text x="336" y="242" font-size="10" fill="var(--flag)">F = 180 kg</text>
      </svg>
      <figcaption>El chorro llega horizontal y la placa está a 60° de la horizontal, así que el ángulo entre los dos es también de 60°. La fuerza que sujeta la placa es perpendicular a ella, y por eso solo equilibra la componente normal del chorro.</figcaption>
      </figure>
    pide: Los tres coeficientes del orificio y cómo se reparte el caudal en la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          La placa no tiene rozamiento. ¿Qué se sigue de eso para las
          velocidades de las dos láminas que salen?
        opciones:
          - texto: Que salen con la misma velocidad con la que llega el chorro, porque sin rozamiento ni desnivel el Bernoulli no cambia
            correcta: true
            mensaje: |
              Eso es. Es la teoría general de álabes: sin pérdidas y sin cambio
              de cota, todo el líquido que resbala por la placa conserva su
              carga, y como sale a la atmósfera igual que entra, conserva su
              velocidad. Lo que cambia es la **dirección**, no el módulo.
          - texto: Que las dos salen a la mitad de la velocidad de llegada, porque el caudal se parte en dos
            mensaje: |
              El caudal se parte, pero la velocidad no: cada lámina lleva menos
              caudal porque es más delgada, no porque vaya más despacio.
          - texto: Que la lámina que sube pierde velocidad y la que baja gana
            mensaje: |
              Eso pasaría si el desnivel fuera apreciable. En un chorro que
              resbala unos centímetros por una placa, la diferencia de cota es
              despreciable frente a los 6,5 m de altura de velocidad que lleva.

      - tipo: calcular
        titulo: El coeficiente de gasto
        pregunta: |
          Coeficiente de gasto $C_d$ del orificio, de 150 mm y a 7,5 m de
          profundidad, que descarga 180 l/s.
        respuesta:
          tipo: numero
          valor: '0.84'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1.19'
            mensaje: |
              Lo has invertido. El caudal real siempre es menor que el teórico,
              así que $C_d = Q_r/Q_t$ es menor que uno.
          - valor: '3.36'
            mensaje: |
              Has tomado los 150 mm como radio. El caudal teórico sale entonces
              cuatro veces menor, 53,6 l/s, y el coeficiente por encima de uno,
              que es imposible: de un orificio nunca sale más de lo teórico.
        pista: |
          $V_t = \sqrt{2gh}$, $Q_t = V_t\,\pi D^{2}/4$ y
          $C_d = Q_r/Q_t$.
        desarrollo: |
          $$
          V_{1t} = \sqrt{2 \cdot 9{,}8 \cdot 7{,}5} = 12{,}12\ \text{m/s} \qquad Q_{1t} = \frac{\pi \cdot 0{,}15^{2}}{4} \cdot 12{,}12 = 214{,}3\ \text{l/s}
          $$

          $$
          C_d = \frac{180}{214{,}3} = 0{,}84
          $$

      - tipo: calcular
        titulo: La velocidad real, que la delata la fuerza
        pregunta: |
          Velocidad real del chorro. La fuerza perpendicular que sujeta la placa
          es de 180 kg y el chorro llega formando 60º con ella.
        respuesta:
          tipo: magnitud
          valor: '11.32 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '19.6 m/s'
            mensaje: |
              Has usado el ángulo al revés, con el coseno. El chorro forma 60º
              con la placa, así que su componente **perpendicular** a ella va
              con el seno, no con el coseno.
          - valor: '0.011 m/s'
            mensaje: |
              Te has dejado el caudal en litros. En la ecuación va en m³/s:
              0,180, no 180.
        pista: |
          La placa solo puede empujar perpendicularmente, y la componente
          normal de la cantidad de movimiento entrante es
          $\rho\,Q\,V\sin 60°$.
        desarrollo: |
          $$
          R_y = \rho\,Q_1 V_1 \sin 60° \;\Longrightarrow\; V_1 = \frac{1\,764}{1\,000 \cdot 0{,}180 \cdot 0{,}866} = 11{,}32\ \text{m/s}
          $$

      - tipo: calcular
        titulo: Los otros dos coeficientes
        pregunta: |
          Coeficiente de contracción $C_c$ del orificio.
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '1.11'
            mensaje: |
              Lo has invertido: $C_c = C_d/C_v$, no al revés. Y los tres
              coeficientes son menores que uno.
          - valor: '0.78'
            mensaje: |
              Has multiplicado en vez de dividir. La relación es
              $C_d = C_c\,C_v$, así que la contracción se despeja dividiendo.
        pista: |
          $C_v = V_{\text{real}}/V_{\text{teórica}}$ y $C_d = C_c\,C_v$.
        desarrollo: |
          $$
          C_v = \frac{11{,}32}{12{,}12} = 0{,}933 \qquad C_c = \frac{C_d}{C_v} = \frac{0{,}84}{0{,}933} = 0{,}90
          $$

      - tipo: calcular
        titulo: El reparto de caudales
        pregunta: |
          Caudal de la lámina que sube por la placa, en l/s. En la dirección de
          la placa no hay fuerza, porque no hay rozamiento.
        respuesta:
          tipo: magnitud
          valor: '135 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '90 l/s'
            mensaje: |
              Has repartido a partes iguales. Solo se reparte así cuando el
              chorro llega perpendicular a la placa; con 60º, la componente
              tangencial desequilibra el reparto.
          - valor: '45 l/s'
            mensaje: |
              Ese es el caudal de la otra lámina, la que baja. La que sube se
              lleva la parte grande, porque la componente tangencial del chorro
              apunta hacia arriba de la placa.
          - valor: '167.9 l/s'
            mensaje: |
              Has usado el seno donde va el coseno. La componente **a lo largo**
              de la placa es $V\cos 60°$, la mitad de la velocidad.
        pista: |
          Sin rozamiento, la cantidad de movimiento en la dirección de la placa
          se conserva: $Q_2 - Q_3 = Q_1\cos 60°$, y además
          $Q_2 + Q_3 = Q_1$.
        desarrollo: |
          $$
          Q_2 - Q_3 = 0{,}180 \cdot 0{,}5 = 0{,}090 \qquad Q_2 + Q_3 = 0{,}180
          $$

          $$
          Q_2 = \frac{0{,}180\,(1+\cos 60°)}{2} = 135\ \text{l/s} \qquad Q_3 = 45\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la placa. Una pieza es falsa.
        piezas:
          - texto: 'La profundidad da la velocidad teórica y con ella el caudal teórico; comparado con el real, sale Cd = 0,84.'
          - texto: 'La fuerza que sujeta la placa es perpendicular a ella, así que equilibra solo la componente normal del chorro y de ahí sale la velocidad real.'
          - texto: 'Sin rozamiento no hay fuerza en la dirección de la placa, y esa ecuación da la diferencia de caudales de las dos láminas.'
          - texto: 'Como el chorro llega a 60º y no perpendicular, la fuerza sobre la placa es menor que si llegase de frente, y las dos láminas salen con velocidades distintas.'
            trampa: true
            mensaje: |
              La primera mitad es cierta —de frente la fuerza sería
              $\rho QV = 2\,037$ N en vez de 1 764— pero la segunda no: las dos
              láminas salen con la **misma** velocidad, la del chorro. Lo que
              cambia entre ellas es el caudal, 135 frente a 45 l/s.
    resolucion: |
      **La idea: la placa es un aparato de medida.** No se conoce la velocidad
      real del chorro, pero la fuerza que hay que hacer para sujetar la placa la
      delata, y con ella salen los tres coeficientes.

      **Lo que se puede calcular sin la fuerza** (parte de a).

      $$
      V_{1t} = \sqrt{2g \cdot 7{,}5} = 12{,}12\ \text{m/s} \qquad Q_{1t} = 214{,}3\ \text{l/s} \qquad C_d = \frac{180}{214{,}3} = 0{,}84
      $$

      **Lo que da la fuerza.** La placa no tiene rozamiento, así que solo puede
      empujar perpendicularmente. En esa dirección, la cantidad de movimiento
      entrante es $\rho Q V\sin 60°$ y la saliente es nula:

      $$
      1\,764 = 1\,000 \cdot 0{,}180 \cdot V_1 \cdot \sin 60° \;\Longrightarrow\; V_1 = 11{,}32\ \text{m/s}
      $$

      $$
      C_v = \frac{11{,}32}{12{,}12} = 0{,}933 \qquad C_c = \frac{0{,}84}{0{,}933} = 0{,}90
      $$

      **El reparto** (b). En la dirección de la placa no hay ninguna fuerza, y
      las tres velocidades son iguales porque no hay pérdidas ni desnivel:

      $$
      0 = Q_2V - Q_3V - Q_1V\cos 60° \;\Longrightarrow\; Q_2 - Q_3 = Q_1\cos 60° = 90\ \text{l/s}
      $$

      Con $Q_2 + Q_3 = 180$: **135 l/s hacia arriba y 45 hacia abajo**.

      **Los dos hábitos que este problema instala.** El primero: en una placa
      lisa, el líquido conserva el módulo de su velocidad y solo cambia de
      dirección; por eso la ecuación tangencial se convierte en un reparto de
      caudales. El segundo: el reparto es
      $Q_2/Q_1 = (1+\cos\theta)/2$, que vale 1/2 cuando el chorro llega
      perpendicular —y entonces se parte por la mitad— y tiende a 1 cuando el
      chorro llega casi rasante. Aquí, con 60º, sale tres cuartos contra un
      cuarto.
  - id: ejflu15-col414-el-disco-que-flota-sobre-un-chorro
    titulo: El disco que flota sobre un chorro
    fuente: Ejercicio 4.14 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      El disco mostrado en la figura se mantiene estable mediante un alambre y
      tiene libertad para moverse verticalmente cuando incide un chorro de agua
      en la cara inferior. El disco pesa 30 N, la velocidad y diámetro iniciales
      del chorro son 10 m/s y 30 mm respectivamente. Se pide:

      a) Altura $h$ hasta la cual se elevará y permanecerá en equilibrio el
      disco.

      Nota: la influencia que pudiera tener el alambre no se tendrá en cuenta en
      los cálculos.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="f414t f414d">
        <title id="f414t">El disco suspendido sobre el chorro vertical, a la altura donde su peso iguala al empuje</title>
        <desc id="f414d">Una boquilla de treinta milímetros lanza hacia arriba
        un chorro de agua a diez metros por segundo. A una altura h por encima
        de ella flota un disco horizontal que pesa treinta newtons; el chorro
        choca contra su cara inferior y se desvía hacia los lados. Un alambre
        vertical guía el disco sin sujetarlo.</desc>
        <defs>
          <marker id="m414l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m414f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m414n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M140,278 H180 L172,252 H148 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="188" y="274" font-size="10" fill="var(--faint)">boquilla Ø 30 mm</text>
        <line x1="160" y1="248" x2="160" y2="120" stroke="var(--live)" stroke-width="6" opacity="0.5"/>
        <line x1="160" y1="230" x2="160" y2="180" stroke="var(--live)" stroke-width="2" marker-end="url(#m414l)"/>
        <text x="172" y="212" font-size="10" fill="var(--live)">10 m/s al salir</text>
        <rect x="96" y="104" width="128" height="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="232" y="114" font-size="10.5" fill="var(--ink)">disco · 30 N</text>
        <path d="M152,118 q-24,4 -34,20 M168,118 q24,4 34,20" fill="none" stroke="var(--live)" stroke-width="2.6"/>
        <line x1="160" y1="104" x2="160" y2="30" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="168" y="44" font-size="9.5" fill="var(--faint)">alambre guía</text>
        <line x1="212" y1="122" x2="212" y2="156" stroke="var(--flag)" stroke-width="2" marker-end="url(#m414f)"/>
        <text x="220" y="146" font-size="9.5" fill="var(--flag)">peso 30 N</text>
        <line x1="60" y1="118" x2="60" y2="246" stroke="var(--faint)" stroke-width="1" marker-start="url(#m414n)" marker-end="url(#m414n)"/>
        <line x1="56" y1="116" x2="92" y2="116" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="56" y1="248" x2="136" y2="248" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="52" y="186" text-anchor="end" font-size="11" fill="var(--faint)">h</text>
      </svg>
      <figcaption>El chorro va frenando al subir, así que el disco encuentra su sitio donde el empuje que recibe iguala exactamente a su peso. Más arriba empujaría menos y caería; más abajo, más y subiría.</figcaption>
      </figure>
    pide: La altura de equilibrio del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco sube hasta que se queda quieto. ¿Qué cambia con la altura y
          qué no?
        opciones:
          - texto: La velocidad del chorro baja al subir, pero el caudal es el mismo; por eso el empuje disminuye con la altura
            correcta: true
            mensaje: |
              Eso es. El chorro es el mismo agua a lo largo de todo el
              recorrido, así que $Q$ no cambia; lo que cambia es su velocidad,
              que se frena subiendo. Y como el empuje es $\rho\,Q\,V$, baja con
              la altura hasta igualar el peso.
          - texto: El caudal disminuye al subir, porque parte del agua vuelve a caer
            mensaje: |
              Mientras el chorro sube en una sola pieza, todo el caudal que sale
              de la boquilla pasa por cada sección: la vena se ensancha, pero el
              caudal es el mismo.
          - texto: No cambia nada; el disco se queda donde lo pongas
            mensaje: |
              Si nada cambiara con la altura, el equilibrio sería indiferente y
              el disco no tendría una posición propia. Lo que le da una es
              justamente que el empuje disminuya al subir: es un equilibrio
              **estable**.

      - tipo: calcular
        titulo: El caudal del chorro
        pregunta: |
          Caudal que lanza la boquilla, de 30 mm y 10 m/s.
        respuesta:
          tipo: magnitud
          valor: '7.07 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '28.3 l/s'
            mensaje: |
              Has tomado los 30 mm como radio. Es el diámetro: la sección es
              $\pi \cdot 0{,}03^{2}/4 = 7{,}07$ cm².
        pista: |
          $Q = V_0 \cdot \pi D^{2}/4$.
        desarrollo: |
          $$
          Q = 10 \cdot \frac{\pi \cdot 0{,}03^{2}}{4} = 7{,}07 \cdot 10^{-3}\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: La velocidad con la que llega al disco
        pregunta: |
          Velocidad del chorro justo debajo del disco, para que su empuje
          equilibre los 30 N de peso.
        respuesta:
          tipo: magnitud
          valor: '4.24 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '0.433 m/s'
            mensaje: |
              Has usado el peso específico donde va la densidad, o has dividido
              además entre $g$. El empuje es $\rho\,Q\,V$ con
              $\rho = 1\,000$ kg/m³.
          - valor: '0.0042 m/s'
            mensaje: |
              Has usado el caudal en litros por segundo. En la ecuación va en
              m³/s: 0,00707.
        pista: |
          En el disco, todo el momento vertical del chorro se destruye:
          $W = \rho\,Q\,V$.
        desarrollo: |
          $$
          V = \frac{W}{\rho\,Q} = \frac{30}{1\,000 \cdot 7{,}07\cdot 10^{-3}} = 4{,}24\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La altura de equilibrio
        pregunta: |
          Altura $h$ a la que se queda el disco.
        respuesta:
          tipo: magnitud
          valor: '4.18 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '5.1 m'
            mensaje: |
              Has tomado los 10 m/s enteros para la altura, como si el chorro se
              parase del todo. No se para: llega al disco con 4,24 m/s, y esa
              energía cinética que le queda no se ha gastado en subir.
          - valor: '0.92 m'
            mensaje: |
              Has puesto la velocidad del disco donde va la diferencia de
              cuadrados. La altura ganada es $(V_0^{2}-V^{2})/2g$, no
              $V^{2}/2g$.
          - valor: '1.69 m'
            mensaje: |
              Has restado las velocidades antes de elevarlas al cuadrado. En
              energía se restan los **cuadrados**.
        pista: |
          Caída libre al revés: $\dfrac{V_0^{2}}{2g} = h + \dfrac{V^{2}}{2g}$.
        desarrollo: |
          $$
          h = \frac{V_0^{2} - V^{2}}{2g} = \frac{100 - 18{,}01}{19{,}6} = 4{,}18\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del disco. Una pieza es falsa.
        piezas:
          - texto: 'El caudal es el mismo a cualquier altura; lo que cambia es la velocidad, que se frena al subir.'
          - texto: 'En el disco el chorro se desvía a los lados, así que pierde todo su momento vertical y el empuje vale ρQV.'
          - texto: 'Igualando ese empuje al peso sale la velocidad de llegada, y de la caída libre, la altura.'
            trampa: false
          - texto: 'Si el disco pesara el doble, se quedaría a la mitad de altura, porque el empuje es proporcional a la velocidad.'
            trampa: true
            mensaje: |
              El empuje sí es proporcional a la velocidad, pero la altura no lo
              es: va con la **diferencia de cuadrados**. Con 60 N el disco
              necesitaría $V = 8{,}49$ m/s y se quedaría a
              $(100-72)/19{,}6 = 1{,}43$ m, no a 2,09. Doblar el peso lo baja a
              un tercio de la altura, no a la mitad.
    resolucion: |
      **Por qué el equilibrio existe.** El chorro sale a 10 m/s y va frenando al
      subir, pero su caudal es el mismo en todas las secciones. El empuje que
      hace sobre el disco es $\rho\,Q\,V$: máximo abajo y cada vez menor arriba.
      Hay entonces **una sola altura** donde ese empuje vale exactamente 30 N, y
      además es estable: si el disco baja recibe más y vuelve a subir, y al
      revés.

      **Las tres cuentas.**

      $$
      Q = 10 \cdot \frac{\pi \cdot 0{,}03^{2}}{4} = 7{,}07\ \text{l/s} \qquad V = \frac{30}{1\,000 \cdot 0{,}00707} = 4{,}24\ \text{m/s}
      $$

      $$
      h = \frac{10^{2} - 4{,}24^{2}}{2 \cdot 9{,}8} = 4{,}18\ \text{m}
      $$

      El boletín publica 4,19 m.

      **Lo que no es proporcional, y conviene tenerlo claro.** El empuje va con
      $V$ y la altura con $V^{2}$, así que las dos cosas no escalan igual.
      Doblar el peso del disco exige doblar la velocidad de llegada —de 4,24 a
      8,49 m/s— y eso lo baja de 4,18 m a 1,43: a **un tercio** de la altura, no
      a la mitad. Y hay un peso máximo: si el disco pesara más de
      $\rho\,Q\,V_0 = 70{,}7$ N, el chorro no lo levantaría ni pegado a la
      boquilla.

  - id: ejflu15-col415-la-placa-agujereada-y-lo-que-la-atraviesa
    titulo: La placa agujereada, y la parte del chorro que la atraviesa
    fuente: Ejercicio 4.15 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La placa circular de la figura tiene un diámetro de 50 cm, disponiendo en
      su centro un orificio de 5 cm de diámetro. Un chorro incide en la placa
      normalmente a ella y en su centro, alcanzándola con una velocidad de
      30 m/s. Se pide:

      a) Caudal que atraviesa el orificio.

      b) Espesor de la lámina de agua en el extremo exterior de la placa.

      c) Fuerza que el chorro efectúa sobre la placa.

      Datos: coeficientes del orificio: $C_v$ = 0,97; $C_c$ = 0,8.

      Nota: se supondrá que la placa carece de rozamiento.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 300" role="img" width="440" height="300"
           aria-labelledby="f415t f415d">
        <title id="f415t">El chorro de 100 mm contra la placa de 50 cm con un orificio de 5 cm en el centro</title>
        <desc id="f415d">Sección de una placa circular vertical de cincuenta
        centímetros de diámetro con un orificio de cinco centímetros en su
        centro. Por la izquierda llega un chorro de cien milímetros a treinta
        metros por segundo. Una parte lo atraviesa por el orificio y sale por
        la derecha; el resto se abre en una lámina que resbala por la cara
        anterior hacia los bordes, arriba y abajo, y sale por el extremo con un
        espesor pequeño.</desc>
        <defs>
          <marker id="m415l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m415n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="252" y="30" width="10" height="108" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <rect x="252" y="162" width="10" height="108" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <rect x="60" y="126" width="192" height="48" fill="var(--live)" opacity="0.22"/>
        <line x1="90" y1="150" x2="200" y2="150" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m415l)"/>
        <text x="66" y="122" font-size="10" fill="var(--live)">Q1 · V = 30 m/s</text>
        <text x="66" y="192" font-size="10" fill="var(--faint)">D1 = 100 mm</text>
        <rect x="262" y="138" width="112" height="24" fill="var(--live)" opacity="0.22"/>
        <line x1="290" y1="150" x2="356" y2="150" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <text x="300" y="136" font-size="10" fill="var(--live)">Q2 · u</text>
        <text x="286" y="176" font-size="9.5" fill="var(--faint)">orificio Ø 5 cm</text>
        <path d="M240,126 q6,-46 6,-92" fill="none" stroke="var(--live)" stroke-width="7" opacity="0.35"/>
        <path d="M240,174 q6,46 6,92" fill="none" stroke="var(--live)" stroke-width="7" opacity="0.35"/>
        <line x1="244" y1="96" x2="245" y2="52" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <line x1="244" y1="204" x2="245" y2="248" stroke="var(--live)" stroke-width="2" marker-end="url(#m415l)"/>
        <text x="204" y="60" text-anchor="end" font-size="10" fill="var(--live)">Q3 · lámina</text>
        <text x="204" y="248" text-anchor="end" font-size="10" fill="var(--live)">Q3 · lámina</text>
        <line x1="300" y1="34" x2="300" y2="266" stroke="var(--faint)" stroke-width="1" marker-start="url(#m415n)" marker-end="url(#m415n)"/>
        <line x1="266" y1="32" x2="304" y2="32" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="266" y1="268" x2="304" y2="268" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="306" y="206" font-size="10" fill="var(--faint)">50 cm</text>
        <line x1="222" y1="30" x2="222" y2="44" stroke="var(--faint)" stroke-width="1" marker-start="url(#m415n)" marker-end="url(#m415n)"/>
        <text x="216" y="42" text-anchor="end" font-size="9.5" fill="var(--faint)">espesor ?</text>
      </svg>
      <figcaption>El chorro se parte en dos caminos: lo que cabe por el orificio sigue recto, y el resto se abre en una lámina que resbala hasta el borde. Los dos se llevan cantidad de movimiento, y por eso la placa recibe menos de lo que recibiría entera.</figcaption>
      </figure>
    pide: El caudal del orificio, el espesor de la lámina en el borde y la fuerza sobre la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          El chorro que llega tiene 100 mm y el orificio 5 cm. ¿Qué parte del
          caudal lo atraviesa?
        opciones:
          - texto: La que cabe por el orificio con sus coeficientes, Cc·Cv·A·V, no la proporción de áreas
            correcta: true
            mensaje: |
              Eso es. Un orificio en una placa se comporta como cualquier otro:
              la vena se contrae ($C_c$) y pierde algo de velocidad ($C_v$). Lo
              que pasa es $C_cC_vA_oV$, un 78 % de lo que daría el área
              desnuda.
          - texto: La proporción de áreas, es decir, (5/10)² = un cuarto del caudal
            mensaje: |
              Esa proporción valdría si el agua pasara por el orificio sin
              enterarse. Pero se contrae al entrar y se frena: por eso hacen
              falta los dos coeficientes, que aquí dejan pasar el 78 % de lo que
              cabría.
          - texto: Todo el que llega, porque el chorro es de 100 mm y el orificio está en su centro
            mensaje: |
              El orificio tiene 5 cm y el chorro 10: por el agujero solo cabe
              una fracción. El resto choca contra la placa y se abre en lámina.

      - tipo: calcular
        titulo: Lo que atraviesa el orificio
        pregunta: |
          Caudal que pasa por el orificio de 5 cm, con $C_v$ = 0,97 y
          $C_c$ = 0,8.
        respuesta:
          tipo: magnitud
          valor: '45.7 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '58.9 l/s'
            mensaje: |
              Te has dejado los dos coeficientes. Sin contracción ni pérdida de
              velocidad pasarían 58,9 l/s; con ellos, el 78 % de eso.
          - valor: '57.1 l/s'
            mensaje: |
              Te has dejado el coeficiente de contracción. Es el que más pesa
              aquí: la vena se estrecha a un 80 % del área del agujero.
          - valor: '47.1 l/s'
            mensaje: |
              Te has dejado el coeficiente de velocidad. Solo cambia un 3 %,
              pero la cuenta lo lleva.
        pista: |
          $Q_2 = C_c\,C_v\,A_o\,V$ con $A_o = \pi \cdot 0{,}05^{2}/4$.
        desarrollo: |
          $$
          Q_2 = 0{,}8 \cdot 0{,}97 \cdot \frac{\pi \cdot 0{,}05^{2}}{4} \cdot 30 = 0{,}0457\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El espesor en el borde
        pregunta: |
          Espesor de la lámina de agua en el extremo exterior de la placa, de
          50 cm de diámetro, en milímetros. El chorro que llega es de 100 mm.
        respuesta:
          tipo: magnitud
          valor: '4.03 mm'
          tolerancia: 0.01
          formato: un espesor con su unidad (mm o m)
        distractores:
          - valor: '5 mm'
            mensaje: |
              Te has dejado el caudal que se escapa por el orificio. Del chorro
              de 235,6 l/s se van 45,7 por el agujero: por el borde solo salen
              190.
          - valor: '8.06 mm'
            mensaje: |
              Has usado el radio de la placa donde va su perímetro, o te has
              dejado el 2 de $2\pi R$. El agua sale por toda la circunferencia
              del borde.
          - valor: '2.02 mm'
            mensaje: |
              Has usado el diámetro donde va el radio en el perímetro. La
              circunferencia del borde es $2\pi \cdot 0{,}25 = 1{,}571$ m.
        pista: |
          $Q_3 = Q_1 - Q_2$ y sale por la circunferencia del borde con la misma
          velocidad de 30 m/s: $Q_3 = V \cdot 2\pi R \cdot e$.
        desarrollo: |
          $$
          Q_1 = 30 \cdot \frac{\pi \cdot 0{,}10^{2}}{4} = 235{,}6\ \text{l/s} \qquad Q_3 = 235{,}6 - 45{,}7 = 189{,}9\ \text{l/s}
          $$

          $$
          e = \frac{Q_3}{V \cdot 2\pi R} = \frac{0{,}1899}{30 \cdot 1{,}571} = 0{,}00403\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza sobre la placa
        pregunta: |
          Fuerza que el chorro ejerce sobre la placa, en newtons. La lámina sale
          paralela a la placa y el orificio deja escapar su chorro con $C_v$
          veces la velocidad de llegada.
        respuesta:
          tipo: magnitud
          valor: '5738 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '7069 N'
            mensaje: |
              Te has dejado la cantidad de movimiento que se escapa por el
              orificio. Ese chorro sigue recto y se lleva 1 330 N que la placa
              no recibe.
          - valor: '8399 N'
            mensaje: |
              Has sumado la cantidad de movimiento del orificio en vez de
              restarla. Ese chorro **se va** en el mismo sentido que llegó: se
              lleva empuje, no lo añade.
          - valor: '1330 N'
            mensaje: |
              Esa es la parte que se escapa, no la que la placa aguanta.
        pista: |
          En la dirección del chorro, la lámina no aporta nada porque sale
          perpendicular: $F = \rho\,Q_1V - \rho\,Q_2\,(C_vV)$.
        desarrollo: |
          $$
          F = 1\,000 \cdot 0{,}2356 \cdot 30 - 1\,000 \cdot 0{,}0457 \cdot 29{,}1 = 7\,069 - 1\,330 = 5\,738\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el balance de la placa. Una pieza es falsa.
        piezas:
          - texto: 'El orificio se comporta como cualquier otro: deja pasar Cc·Cv·A·V, un 78 % de lo que daría su área desnuda.'
          - texto: 'Lo que no pasa se abre en lámina y sale por la circunferencia del borde, y de ahí sale su espesor.'
          - texto: 'La lámina sale perpendicular al chorro, así que no aporta cantidad de movimiento en la dirección de éste.'
          - texto: 'La fuerza sobre la placa es la del chorro entero menos la del orificio, y como el orificio se lleva un 19 % del caudal, la placa recibe un 81 % de la fuerza.'
            trampa: true
            mensaje: |
              Recibe el 81 %, sí, pero no por el caudal: el chorro del orificio
              sale además un 3 % más despacio, así que se lleva
              $0{,}0457 \cdot 29{,}1$ y no $0{,}0457 \cdot 30$. La cuenta buena
              da 5 738 de 7 069 N, un 81,2 %; con la proporción de caudales
              saldría 80,6 %. La coincidencia es aproximada, no una regla.
    resolucion: |
      **Tres cosas que se calculan en cadena.** El orificio se lleva una parte
      del chorro; lo que queda se abre en lámina; y la fuerza es lo que la placa
      le quita al conjunto.

      **El orificio** (a). Se comporta como cualquier orificio, con sus dos
      coeficientes:

      $$
      Q_2 = C_cC_vA_oV = 0{,}8 \cdot 0{,}97 \cdot 1{,}963\cdot 10^{-3} \cdot 30 = 45{,}7\ \text{l/s}
      $$

      **La lámina** (b). El chorro de 100 mm trae 235,6 l/s, así que por el
      borde salen 189,9. Sin rozamiento la lámina conserva los 30 m/s, y sale
      por toda la circunferencia:

      $$
      e = \frac{0{,}1899}{30 \cdot 2\pi \cdot 0{,}25} = 4{,}03\ \text{mm}
      $$

      **La fuerza** (c). En la dirección del chorro, la lámina no cuenta —sale
      perpendicular—; el chorro del orificio sí, y a $C_v$ veces la velocidad:

      $$
      F = \rho Q_1 V - \rho Q_2 (C_vV) = 7\,069 - 1\,330 = 5\,738\ \text{N}
      $$

      El boletín publica 45,7 l/s; 4 mm; 5 735 N.

      **Para qué sirve agujerear una placa.** El orificio se lleva el 19 % del
      caudal y descarga a la placa un 19 % de la fuerza. No es una casualidad
      —es casi proporcional— pero tampoco es exacto: el chorro que escapa sale
      un 3 % más despacio, y esa diferencia es la que separa el 80,6 % que
      daría la regla de tres del 81,2 % real. En un deflector de verdad el
      agujero es exactamente el mando con el que se ajusta el empuje.
  - id: ejflu15-col420-la-placa-inclinada-y-la-fuerza-que-la-sujeta
    titulo: La placa inclinada, y hacia dónde apunta la fuerza que la sujeta
    fuente: Ejercicio 4.20 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un chorro de agua incide sobre una placa inclinada 60º con respecto de la
      horizontal como indica la figura adjunta. Si la velocidad del chorro es de
      12 m/s y su sección 0,009 m², calcular la fuerza necesaria (módulo,
      dirección y sentido) para mantener la placa en reposo en la posición
      indicada, así como el reparto de caudales. Despreciar el rozamiento en la
      placa.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 290" role="img" width="420" height="290"
           aria-labelledby="f420t f420d">
        <title id="f420t">El chorro horizontal contra la placa inclinada 60 grados, con las dos láminas que salen y la fuerza que la sujeta</title>
        <desc id="f420d">Un chorro horizontal de nueve milésimas de metro
        cuadrado de sección llega a doce metros por segundo y choca contra una
        placa plana inclinada sesenta grados respecto de la horizontal. Al
        chocar se reparte en dos láminas que resbalan por la placa, una hacia
        arriba y otra hacia abajo. Una fuerza perpendicular a la placa la
        mantiene en reposo.</desc>
        <defs>
          <marker id="m420l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m420f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
        </defs>
        <line x1="176" y1="262" x2="272" y2="96" stroke="var(--ink)" stroke-width="5"/>
        <text x="278" y="92" font-size="10.5" fill="var(--ink)">placa</text>
        <line x1="150" y1="262" x2="376" y2="262" stroke="var(--faint)" stroke-width="1.2"/>
        <path d="M212,262 A38,38 0 0 0 195,230" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="252" y="258" font-size="10" fill="var(--alt)">60°</text>
        <rect x="30" y="170" width="192" height="16" fill="var(--live)" opacity="0.22"/>
        <line x1="60" y1="178" x2="180" y2="178" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m420l)"/>
        <text x="34" y="162" font-size="10" fill="var(--live)">V = 12 m/s · A = 0,009 m²</text>
        <path d="M226,168 q20,-26 26,-56" fill="none" stroke="var(--live)" stroke-width="6" opacity="0.35"/>
        <path d="M216,190 q10,28 8,58" fill="none" stroke="var(--live)" stroke-width="4" opacity="0.35"/>
        <line x1="240" y1="136" x2="250" y2="106" stroke="var(--live)" stroke-width="2" marker-end="url(#m420l)"/>
        <line x1="221" y1="222" x2="224" y2="252" stroke="var(--live)" stroke-width="2" marker-end="url(#m420l)"/>
        <text x="206" y="112" text-anchor="end" font-size="10" fill="var(--live)">Q2</text>
        <text x="232" y="244" font-size="10" fill="var(--live)">Q3</text>
        <line x1="316" y1="226" x2="252" y2="190" stroke="var(--flag)" stroke-width="2.4" marker-end="url(#m420f)"/>
        <text x="322" y="230" font-size="10" fill="var(--flag)">F</text>
      </svg>
      <figcaption>La placa no tiene rozamiento, así que solo puede recibir y devolver fuerza en la dirección perpendicular a ella. La que hay que hacer para sujetarla tiene por fuerza esa misma dirección.</figcaption>
      </figure>
    pide: El módulo, dirección y sentido de la fuerza, y el reparto de caudales.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la fuerza con su **dirección y sentido**. Sin
          rozamiento, ¿qué dirección puede tener?
        opciones:
          - texto: Solo la perpendicular a la placa, porque una superficie lisa no puede ejercer fuerza a lo largo de sí misma
            correcta: true
            mensaje: |
              Eso es, y no es un detalle: es lo que permite resolver el
              problema. Como en la dirección de la placa no hay ninguna fuerza,
              la ecuación de cantidad de movimiento en ese eje queda sin
              incógnitas y da directamente el reparto de caudales.
          - texto: La horizontal, la del chorro, porque es la única dirección en la que llega cantidad de movimiento
            mensaje: |
              Llega en horizontal, pero la placa no puede empujar en horizontal:
              solo perpendicularmente a sí misma. La fuerza tiene componente
              horizontal, sí, pero su dirección es la de la normal.
          - texto: La que resulte de sumar las de las dos láminas que salen
            mensaje: |
              Las dos láminas salen **paralelas a la placa**, así que su
              resultante también lo es. La fuerza sobre la placa es
              perpendicular; son dos cosas distintas.

      - tipo: calcular
        titulo: La fuerza
        pregunta: |
          Módulo de la fuerza necesaria para mantener la placa en reposo, en
          newtons.
        respuesta:
          tipo: magnitud
          valor: '1122 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '1296 N'
            mensaje: |
              Te has dejado el seno. La placa recibe solo la componente
              **normal** del chorro, y con 60º entre los dos eso es
              $\rho QV\sin 60° = 0{,}866\,\rho QV$.
          - valor: '648 N'
            mensaje: |
              Has usado el coseno. El chorro forma 60º con la placa, así que su
              componente perpendicular a ella va con el seno.
          - valor: '12701 N'
            mensaje: |
              Has multiplicado por $g$ de más, o has usado el peso específico
              donde va la densidad. La cantidad de movimiento se escribe con
              $\rho = 1\,000$ kg/m³.
        pista: |
          $Q = V\,A$ y la componente normal es $\rho\,Q\,V\sin 60°$.
        desarrollo: |
          $$
          Q = 12 \cdot 0{,}009 = 0{,}108\ \text{m}^{3}\text{/s}
          $$

          $$
          F = \rho\,Q\,V\sin 60° = 1\,000 \cdot 0{,}108 \cdot 12 \cdot 0{,}866 = 1\,122\ \text{N}
          $$

          Dirección: perpendicular a la placa. Sentido: contra el chorro, es
          decir, empujando la placa hacia él.

      - tipo: calcular
        titulo: La lámina grande
        pregunta: |
          Caudal de la lámina que sube por la placa, en l/s.
        respuesta:
          tipo: magnitud
          valor: '81 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '54 l/s'
            mensaje: |
              Has repartido a la mitad. Eso solo pasa cuando el chorro llega
              perpendicular a la placa; con 60º, la componente que resbala a lo
              largo de ella desequilibra el reparto.
          - valor: '27 l/s'
            mensaje: |
              Ese es el de la otra lámina, la que baja. La que sube se lleva la
              parte grande, porque la componente tangencial del chorro apunta
              hacia arriba de la placa.
          - valor: '100.8 l/s'
            mensaje: |
              Has usado el seno donde va el coseno. La componente **a lo largo**
              de la placa es $V\cos 60°$, la mitad de la velocidad.
        pista: |
          Sin rozamiento no hay fuerza tangencial:
          $Q_2 - Q_3 = Q\cos 60°$, y además $Q_2 + Q_3 = Q$.
        desarrollo: |
          $$
          Q_2 = \frac{Q\,(1+\cos 60°)}{2} = \frac{108 \cdot 1{,}5}{2} = 81\ \text{l/s} \qquad Q_3 = 27\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Sin rozamiento, la placa solo puede ejercer fuerza perpendicular a sí misma, y las dos láminas salen paralelas a ella con la misma velocidad del chorro.'
          - texto: 'La ecuación en la dirección normal da la fuerza, ρQV·sen 60° = 1 122 N, porque las láminas no aportan nada en esa dirección.'
          - texto: 'La ecuación en la dirección de la placa no tiene ninguna fuerza, así que se convierte en el reparto de caudales: 81 y 27 l/s.'
          - texto: 'Como la fuerza es perpendicular a la placa y ésta forma 60º con la horizontal, la fuerza forma también 60º con la horizontal.'
            trampa: true
            mensaje: |
              Forma 60º con la **vertical**, no con la horizontal. La normal a
              una recta inclinada 60º sobre la horizontal está inclinada 30º
              sobre ella. Es el error clásico al dar la dirección de una
              normal, y aquí el enunciado la pide expresamente.
    resolucion: |
      **Todo sale de que la placa es lisa.** Sin rozamiento, una superficie
      plana solo puede ejercer fuerza perpendicular a sí misma. Eso parte el
      problema en dos ecuaciones que se resuelven por separado:

      - **En la normal** está la fuerza, y las láminas —que salen paralelas a la
        placa— no aportan nada:

        $$
        F = \rho\,Q\,V\sin 60° = 1\,000 \cdot 0{,}108 \cdot 12 \cdot 0{,}866 = 1\,122\ \text{N}
        $$

      - **En la dirección de la placa** no hay ninguna fuerza, así que la
        cantidad de movimiento se conserva y da el reparto:

        $$
        Q_2 - Q_3 = Q\cos 60° = 54\ \text{l/s} \qquad Q_2 = 81 \qquad Q_3 = 27\ \text{l/s}
        $$

      **La dirección, que es lo que el enunciado subraya.** La fuerza es
      perpendicular a la placa, y una placa inclinada 60º sobre la horizontal
      tiene su normal a **30º sobre la horizontal**, no a 60º. El sentido es el
      que empuja la placa contra el chorro: si se soltara, el chorro se la
      llevaría.

      **Y la comprobación que conviene hacer siempre.** Con el chorro
      perpendicular ($\theta = 90°$) saldrían $\rho QV = 1\,296$ N y el reparto
      a la mitad, 54 y 54. Con el chorro casi rasante ($\theta \to 0$) la fuerza
      tendería a cero y todo el caudal se iría por la lámina de arriba. Los
      resultados de aquí, 1 122 N y 81/27, caen donde tienen que caer entre esos
      dos extremos.

  - id: ejflu15-col421-el-cuenco-que-tapa-un-agujero
    titulo: El cuenco que tapa un agujero, y hasta cuánta agua aguanta
    fuente: Ejercicio 4.21 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un chorro de 150 mm de diámetro incide sobre una placa, tal como se indica
      en la figura adjunta. La placa cubre el agujero de 125 mm de diámetro.
      ¿Cuál es la $H$ máxima que se puede mantener sin que haya fuga?

      <figure class="figura-examen">
      <svg viewBox="0 0 460 300" role="img" width="460" height="300"
           aria-labelledby="f421t f421d">
        <title id="f421t">El depósito de 3 m que lanza un chorro contra un cuenco que tapa el agujero de un muro, con agua al otro lado</title>
        <desc id="f421d">A la izquierda, un depósito con la lámina 3 metros por
        encima de una boquilla de 150 milímetros que lanza un chorro horizontal.
        El chorro incide sobre una placa cóncava, un cuenco, que devuelve el
        agua hacia atrás en dos láminas inclinadas 30 grados respecto de la
        vertical. El cuenco tapa por fuera un agujero de 125 milímetros abierto
        en un muro; al otro lado del muro hay agua cuya lámina está a una altura
        H por encima del agujero.</desc>
        <defs>
          <marker id="m421l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m421n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="20" y="118" width="110" height="106" fill="var(--live)" opacity="0.15"/>
        <path d="M20,118 v106 h110" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="20" y1="118" x2="130" y2="118" stroke="var(--live)" stroke-width="1.4"/>
        <path d="M66,109 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <line x1="88" y1="122" x2="88" y2="178" stroke="var(--faint)" stroke-width="1" marker-start="url(#m421n)" marker-end="url(#m421n)"/>
        <text x="82" y="154" text-anchor="end" font-size="10" fill="var(--faint)">3 m</text>
        <rect x="130" y="170" width="122" height="24" fill="var(--live)" opacity="0.25"/>
        <line x1="160" y1="182" x2="228" y2="182" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m421l)"/>
        <text x="136" y="212" font-size="10" fill="var(--faint)">Ø 150 mm · Cd = 1</text>
        <path d="M262,156 q26,26 0,52" fill="none" stroke="var(--ink)" stroke-width="5"/>
        <text x="240" y="230" text-anchor="end" font-size="10" fill="var(--ink)">cuenco</text>
        <path d="M250,166 q-24,-16 -38,-58" fill="none" stroke="var(--live)" stroke-width="6" opacity="0.35"/>
        <path d="M250,198 q-24,16 -38,58" fill="none" stroke="var(--live)" stroke-width="6" opacity="0.35"/>
        <line x1="228" y1="130" x2="216" y2="102" stroke="var(--live)" stroke-width="2" marker-end="url(#m421l)"/>
        <line x1="228" y1="234" x2="216" y2="262" stroke="var(--live)" stroke-width="2" marker-end="url(#m421l)"/>
        <line x1="212" y1="100" x2="212" y2="66" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M216,84 A22,22 0 0 1 232,96" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="236" y="88" font-size="10" fill="var(--alt)">30°</text>
        <rect x="272" y="20" width="16" height="260" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <rect x="272" y="170" width="16" height="24" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="296" y="212" font-size="10" fill="var(--faint)">agujero Ø 125 mm</text>
        <rect x="288" y="86" width="150" height="194" fill="var(--live)" opacity="0.15"/>
        <line x1="288" y1="86" x2="438" y2="86" stroke="var(--live)" stroke-width="1.4"/>
        <path d="M356,77 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <text x="366" y="110" font-size="10" fill="var(--ink)">s = 1</text>
        <line x1="410" y1="90" x2="410" y2="178" stroke="var(--faint)" stroke-width="1" marker-start="url(#m421n)" marker-end="url(#m421n)"/>
        <line x1="292" y1="182" x2="414" y2="182" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="416" y="138" font-size="11" fill="var(--faint)">H</text>
      </svg>
      <figcaption>El cuenco no desvía el chorro noventa grados: se lo devuelve hacia atrás. Por eso empuja más que una placa plana, y eso es justo lo que se necesita para tapar el agujero.</figcaption>
      </figure>
    pide: La altura máxima de agua que el cuenco puede retener.
    pasos:
      - tipo: reconocer
        pregunta: |
          El agua sale del cuenco hacia atrás, formando 30º con la vertical.
          ¿Qué factor multiplica a $\rho QV$ en la fuerza sobre el cuenco?
        opciones:
          - texto: 1,5, porque además de frenar el chorro hay que devolverlo, y la componente que vuelve es V·cos 60°
            correcta: true
            mensaje: |
              Eso es. Si el agua saliera perpendicular al chorro, el factor sería
              1: solo habría que anular lo que llega. Aquí sale además con una
              componente **hacia atrás** de $V\cos 60° = 0{,}5\,V$, y hay que
              dársela: $1 + 0{,}5 = 1{,}5$.
          - texto: 1, porque el cuenco solo tiene que parar el chorro
            mensaje: |
              Pararlo es lo mínimo. Devolverlo cuesta más, y esa es la razón de
              ser de un cuenco frente a una placa plana: con el mismo chorro
              hace un 50 % más de fuerza.
          - texto: 2, porque el chorro sale en sentido contrario al que entró
            mensaje: |
              Saldría 2 si volviera **exactamente** hacia atrás, con toda su
              velocidad en la horizontal. Aquí sale a 60º de la horizontal, así
              que solo devuelve la mitad: el factor es 1,5.

      - tipo: calcular
        titulo: El chorro que llega
        pregunta: |
          Caudal del chorro, de 150 mm, que sale de un depósito con 3 m de carga
          y $C_d = 1$.
        respuesta:
          tipo: magnitud
          valor: '135.5 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '95.8 l/s'
            mensaje: |
              Te has dejado el 2 de $\sqrt{2gh}$. La velocidad de salida son
              7,67 m/s, no 5,42.
          - valor: '542 l/s'
            mensaje: |
              Has tomado los 150 mm como radio. Es el diámetro: la sección es
              $\pi \cdot 0{,}15^{2}/4 = 176{,}7$ cm².
        pista: |
          $V = \sqrt{2gh}$ con $h = 3$ m, y $Q = V\,\pi D^{2}/4$.
        desarrollo: |
          $$
          V = \sqrt{2 \cdot 9{,}8 \cdot 3} = 7{,}67\ \text{m/s} \qquad Q = 7{,}67 \cdot \frac{\pi \cdot 0{,}15^{2}}{4} = 0{,}1355\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: La fuerza del cuenco
        pregunta: |
          Fuerza horizontal con que el chorro empuja el cuenco contra el muro,
          en newtons.
        respuesta:
          tipo: magnitud
          valor: '1558 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '1039 N'
            mensaje: |
              Te has quedado en $\rho QV$, que es lo que costaría solo **parar**
              el chorro. Devolverlo cuesta el 50 % más.
          - valor: '2078 N'
            mensaje: |
              Has supuesto que el chorro vuelve exactamente hacia atrás, con
              factor 2. Sale a 60º de la horizontal: solo devuelve
              $V\cos 60°$.
          - valor: '1939 N'
            mensaje: |
              Has usado el coseno de 30º en vez del de 60º. El chorro sale
              formando 30º con la **vertical**, es decir, 60º con la horizontal,
              y lo que cuenta en el eje del chorro es el coseno de ese ángulo.
        pista: |
          $F = \rho\,Q\,(V - V_{sal,x})$ con
          $V_{sal,x} = -V\cos 60°$.
        desarrollo: |
          $$
          F = \rho\,Q\,V\,(1 + \cos 60°) = 1\,000 \cdot 0{,}1355 \cdot 7{,}67 \cdot 1{,}5 = 1\,558\ \text{N}
          $$

      - tipo: calcular
        titulo: La altura que puede retener
        pregunta: |
          Altura $H$ máxima del agua al otro lado del muro, sabiendo que el
          agujero tiene 125 mm.
        respuesta:
          tipo: magnitud
          valor: '12.96 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '9.0 m'
            mensaje: |
              Has usado el área del chorro, de 150 mm, en vez de la del agujero.
              El agua de detrás empuja solo sobre lo que la placa tapa: 125 mm.
          - valor: '8.64 m'
            mensaje: |
              Arrastras la fuerza sin el factor 1,5, la de una placa plana que
              solo para el chorro.
          - valor: '1.32 m'
            mensaje: |
              Has dividido entre $\gamma$ dos veces, o has dejado la presión en
              kg/cm². $H = F/(\gamma A)$ con $\gamma = 9\,800$ N/m³.
        pista: |
          El agua de detrás empuja con $\gamma\,H$ sobre el área del **agujero**;
          en el límite, esa fuerza iguala a la del chorro.
        desarrollo: |
          $$
          \gamma\,H\,A_{agujero} = F \;\Longrightarrow\; H = \frac{1\,558}{9\,800 \cdot \pi \cdot 0{,}125^{2}/4} = \frac{1\,558}{120{,}3} = 12{,}96\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del cuenco. Una pieza es falsa.
        piezas:
          - texto: 'Los 3 m de carga dan la velocidad del chorro y, con los 150 mm, su caudal: 135,5 l/s.'
          - texto: 'El cuenco devuelve el agua hacia atrás, así que hay que anular lo que llega y dar además lo que sale: el factor es 1 + cos 60° = 1,5.'
          - texto: 'En el límite, esa fuerza iguala a la que el agua de detrás hace sobre el área del agujero, y de ahí sale H.'
          - texto: 'Como el chorro tiene 150 mm y el agujero 125, la placa recibe más presión de la que el agua le devuelve, y por eso puede taparlo.'
            trampa: true
            mensaje: |
              Los diámetros no se comparan así. El chorro no ejerce «presión»
              sobre su área: ejerce una fuerza que sale de su cantidad de
              movimiento, 1 558 N. Y el agua de detrás sí ejerce presión sobre
              el área del agujero. Que el chorro sea más ancho no tiene nada que
              ver: si tuviera 125 mm y la misma velocidad haría **menos** fuerza,
              no la misma.
    resolucion: |
      **Lo que distingue un cuenco de una placa.** Una placa plana perpendicular
      al chorro solo tiene que **pararlo**: $F = \rho QV$. Un cuenco además lo
      **devuelve**, y hay que darle esa cantidad de movimiento de vuelta. Aquí
      el agua sale formando 30º con la vertical, o sea 60º con la horizontal, de
      modo que su componente hacia atrás es $V\cos 60° = 0{,}5\,V$:

      $$
      F = \rho\,Q\,V\,(1 + \cos 60°) = 1{,}5\,\rho\,Q\,V
      $$

      **Las tres cuentas.**

      $$
      V = \sqrt{2g \cdot 3} = 7{,}67\ \text{m/s} \qquad Q = 135{,}5\ \text{l/s} \qquad F = 1{,}5 \cdot 1\,039 = 1\,558\ \text{N}
      $$

      $$
      H = \frac{F}{\gamma\,A_{agujero}} = \frac{1\,558}{9\,800 \cdot 0{,}012272} = 12{,}96\ \text{m}
      $$

      **Las dos áreas del problema, que no se pueden confundir.** El chorro
      tiene 150 mm y el agujero 125, y cada diámetro entra en un sitio distinto:
      el del chorro, en el **caudal**; el del agujero, en el **área sobre la que
      empuja el agua de detrás**. Usar 150 en la segunda cuenta baja la respuesta
      a 8,99 m, y usar 125 en la primera la baja a 9 l/s: son dos errores
      distintos, no el mismo.

      **Y el orden de magnitud, para no perder el sentido.** Trece metros de
      columna sobre un agujero de 125 mm son 1 558 N, unos 160 kilos. Los pone
      un chorro que lleva 135 l/s a 7,7 m/s: por eso los cuencos de este tipo se
      usan para cerrar compuertas de emergencia, donde no hay más energía
      disponible que la del propio agua.
  - id: ejflu15-col412-la-turbina-que-delata-el-deflector
    titulo: La turbina que delata un deflector
    fuente: Ejercicio 4.12 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Desde un gran depósito, el agua fluye por un tubo y una turbina y al salir
      de ésta incide sobre una lámina deflectora de 90º como se muestra en la
      figura. Si el chorro ejerce un empuje horizontal de 891,8 N sobre el
      deflector; se pide:

      a) Potencia desarrollada por la turbina.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 280" role="img" width="440" height="280"
           aria-labelledby="f412t f412d">
        <title id="f412t">El depósito de 30 m, la turbina en la tubería de 15,3 cm y el deflector de 90 grados al final</title>
        <desc id="f412d">Un gran depósito con la lámina libre treinta metros por
        encima de una tubería horizontal de 15,3 centímetros. En la tubería hay
        una turbina, y al salir de ella el chorro incide sobre una lámina
        deflectora que lo desvía noventa grados, hacia abajo. El empuje
        horizontal sobre el deflector es dato.</desc>
        <defs>
          <marker id="m412l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m412f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m412n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="20" y="30" width="120" height="150" fill="var(--live)" opacity="0.15"/>
        <path d="M20,30 v150 h120" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M140,30 V162 M140,182 V180" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="20" y1="30" x2="140" y2="30" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M74,21 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <text x="30" y="106" font-size="10.5" fill="var(--ink)">agua</text>
        <line x1="92" y1="34" x2="92" y2="168" stroke="var(--faint)" stroke-width="1" marker-start="url(#m412n)" marker-end="url(#m412n)"/>
        <text x="86" y="106" text-anchor="end" font-size="10" fill="var(--faint)">30 m</text>
        <rect x="140" y="164" width="80" height="18" fill="var(--live)" opacity="0.25"/>
        <circle cx="234" cy="173" r="15" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="234" y="146" text-anchor="middle" font-size="10.5" fill="var(--ink)">turbina</text>
        <rect x="249" y="164" width="86" height="18" fill="var(--live)" opacity="0.25"/>
        <line x1="266" y1="173" x2="316" y2="173" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m412l)"/>
        <text x="196" y="206" font-size="10" fill="var(--faint)">Ø 15,3 cm</text>
        <path d="M336,158 h24 v104" fill="none" stroke="var(--ink)" stroke-width="5"/>
        <text x="366" y="152" font-size="10.5" fill="var(--ink)">deflector 90°</text>
        <path d="M340,182 q10,26 8,52" fill="none" stroke="var(--live)" stroke-width="7" opacity="0.35"/>
        <line x1="346" y1="220" x2="348" y2="256" stroke="var(--live)" stroke-width="2" marker-end="url(#m412l)"/>
        <line x1="386" y1="188" x2="352" y2="188" stroke="var(--flag)" stroke-width="2.4" marker-end="url(#m412f)"/>
        <text x="392" y="192" font-size="9.5" fill="var(--flag)">891,8 N</text>
      </svg>
      <figcaption>El deflector gira el chorro noventa grados, así que el empuje horizontal que recibe es exactamente lo que costaba pararlo. Ese dato, medido, es lo único que permite conocer el caudal.</figcaption>
      </figure>
    pide: La potencia desarrollada por la turbina.
    pasos:
      - tipo: reconocer
        pregunta: |
          No se conoce ni el caudal ni la velocidad. ¿Cómo los da el empuje
          medido sobre el deflector?
        opciones:
          - texto: Porque con un giro de 90º el empuje horizontal vale ρQV, y como Q = V·A, esa sola ecuación tiene una sola incógnita
            correcta: true
            mensaje: |
              Eso es. Al desviar 90º el chorro pierde toda su cantidad de
              movimiento horizontal, así que $F = \rho QV$. Y sustituyendo
              $Q = V A$ queda $F = \rho A V^{2}$: una ecuación con $V$ sola.
          - texto: Porque el empuje es la fuerza de presión del chorro sobre la lámina
            mensaje: |
              El chorro sale a la atmósfera: su presión es cero. Lo que empuja
              es su cantidad de movimiento, no su presión.
          - texto: Porque el empuje se relaciona con la altura del depósito y de ahí sale la velocidad
            mensaje: |
              La altura del depósito sí interviene, pero **después**: primero se
              saca la velocidad del chorro con el empuje, y luego se compara con
              los 30 m para ver cuánto se ha llevado la turbina.

      - tipo: calcular
        titulo: La velocidad del chorro
        pregunta: |
          Velocidad del chorro que sale de la turbina, en una tubería de
          15,3 cm, si empuja el deflector con 891,8 N.
        respuesta:
          tipo: magnitud
          valor: '6.96 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '48.51 m/s'
            mensaje: |
              Te has quedado en $V^{2}$. La ecuación es
              $F = \rho A V^{2}$, así que hay que sacar la raíz.
          - valor: '3.48 m/s'
            mensaje: |
              Has tomado los 15,3 cm como radio. Es el diámetro: la sección es
              $\pi \cdot 0{,}153^{2}/4 = 183{,}9$ cm².
        pista: |
          Con un giro de 90º, $F = \rho\,Q\,V = \rho\,A\,V^{2}$.
        desarrollo: |
          $$
          A = \frac{\pi \cdot 0{,}153^{2}}{4} = 0{,}018385\ \text{m}^{2} \qquad V = \sqrt{\frac{891{,}8}{1\,000 \cdot 0{,}018385}} = 6{,}96\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Potencia desarrollada por la turbina, con el depósito a 30 m.
        respuesta:
          tipo: magnitud
          valor: '34.54 kW'
          tolerancia: 0.01
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '37.64 kW'
            mensaje: |
              Te has dejado la altura de velocidad del chorro. La turbina no se
              queda los 30 m: el chorro se lleva 2,47 m para poder salir.
          - valor: '3.11 kW'
            mensaje: |
              Has usado la altura de velocidad como altura de la turbina, en vez
              de restarla de los 30 m.
          - valor: '3.52 kW'
            mensaje: |
              Has dividido entre $g$ de más. $P = \gamma\,Q\,H$ con
              $\gamma = 9\,800$ N/m³ da vatios directamente.
        pista: |
          $Q = V A$, y $H_t = 30 - V^{2}/2g$ porque el chorro sale a la
          atmósfera llevándose su energía cinética.
        desarrollo: |
          $$
          Q = 6{,}96 \cdot 0{,}018385 = 0{,}1280\ \text{m}^{3}\text{/s} \qquad H_t = 30 - \frac{6{,}96^{2}}{19{,}6} = 27{,}53\ \text{m}
          $$

          $$
          P = 9\,800 \cdot 0{,}1280 \cdot 27{,}53 = 34{,}54\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El deflector de 90º convierte una medida de fuerza en una medida de caudal, porque F = ρAV² con una sola incógnita.'
          - texto: 'La velocidad del chorro, 6,96 m/s, dice cuánta energía se lleva el agua al salir: 2,47 m de los 30 disponibles.'
          - texto: 'Lo que queda, 27,53 m, es lo que la turbina ha extraído, y multiplicado por γQ da la potencia.'
          - texto: 'Si el deflector desviara el chorro solo 45º en vez de 90º, el empuje horizontal sería la mitad.'
            trampa: true
            mensaje: |
              Sería $\rho QV(1-\cos 45°) = 0{,}293\,\rho QV$, no la mitad: un
              29 %, no un 50 %. El factor es $1-\cos\theta$, que no es lineal en
              el ángulo. Y con 180º —un cuenco que lo devuelve— sería el doble,
              no el 200 % de 90º.
    resolucion: |
      **Un deflector como caudalímetro.** El único dato medido es una fuerza, y
      basta porque el giro es de 90º: el chorro pierde toda su cantidad de
      movimiento horizontal, así que

      $$
      F = \rho\,Q\,V = \rho\,A\,V^{2} \;\Longrightarrow\; V = \sqrt{\frac{891{,}8}{1\,000 \cdot 0{,}018385}} = 6{,}96\ \text{m/s}
      $$

      **Y de ahí, la turbina.**

      $$
      Q = 0{,}1280\ \text{m}^{3}\text{/s} \qquad H_t = 30 - \frac{V^{2}}{2g} = 27{,}53\ \text{m} \qquad P = 34{,}54\ \text{kW}
      $$

      El boletín publica 34,56 kW.

      **Lo que se lleva el chorro.** De los 30 m disponibles, la turbina extrae
      27,53 y 2,47 se van por la boquilla en forma de velocidad: un 8 %. Es el
      precio de tener que sacar el agua, y es la razón de que las turbinas de
      reacción lleven **tubo de aspiración**, que recupera buena parte de esa
      altura ensanchando la salida.

  - id: ejflu15-col49-la-caja-negra-de-cuatro-tuberias
    titulo: La caja negra de cuatro tuberías
    fuente: Ejercicio 4.9 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene la caja negra de la figura. Por todas las tuberías circula agua y
      todas las tuberías están en el mismo plano. Se pide:

      a) Componentes $R_x$ y $R_y$ de la fuerza que se requiere para mantener la
      caja en equilibrio.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 352" role="img" width="460" height="352"
           aria-labelledby="f49t f49d">
        <title id="f49t">La caja con sus cuatro tuberías: entra por la de arriba y la de abajo a la derecha, y sale por las otras dos</title>
        <desc id="f49d">Una caja cuadrada con cuatro tuberías. Por arriba entra
        la 1, vertical, con 21 litros por segundo a 4,5 metros por segundo y una
        presión de 1,5 kilos por centímetro cuadrado. Por el borde derecho sale
        la 2, formando 60 grados con la vertical, con 24 litros por segundo a
        3,6. Por el borde inferior entra la 3, formando 60 grados con la
        horizontal, con 33 litros por segundo a 3. Y por el borde izquierdo sale
        la 4, formando 45 grados con la vertical, con 30 litros por segundo a
        1,8.</desc>
        <defs>
          <marker id="m49l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <rect x="140" y="96" width="170" height="150" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <line x1="216" y1="96" x2="216" y2="34" stroke="var(--ink)" stroke-width="4"/>
        <line x1="216" y1="42" x2="216" y2="82" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m49l)"/>
        <text x="228" y="34" font-size="10" fill="var(--ink)">1 · entra</text>
        <text x="228" y="48" font-size="9" fill="var(--faint)">P = 1,5 kg/cm²</text>
        <text x="228" y="60" font-size="9" fill="var(--faint)">Q = 21 l/s · V = 4,5 m/s</text>
        <path d="M196,96 A20,20 0 0 0 216,116" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="176" y="116" font-size="9.5" fill="var(--alt)">90°</text>
        <line x1="310" y1="150" x2="392" y2="103" stroke="var(--ink)" stroke-width="4"/>
        <line x1="336" y1="136" x2="382" y2="109" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m49l)"/>
        <path d="M310,120 A30,30 0 0 0 334,142" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="316" y="112" font-size="9.5" fill="var(--alt)">60°</text>
        <text x="398" y="100" font-size="10" fill="var(--ink)">2 · sale</text>
        <text x="366" y="86" font-size="9" fill="var(--faint)">24 l/s · 3,6 m/s</text>
        <line x1="238" y1="246" x2="290" y2="336" stroke="var(--ink)" stroke-width="4"/>
        <line x1="282" y1="322" x2="250" y2="266" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m49l)"/>
        <path d="M262,246 A24,24 0 0 1 250,266" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="268" y="264" font-size="9.5" fill="var(--alt)">60°</text>
        <text x="296" y="318" font-size="10" fill="var(--ink)">3 · entra</text>
        <text x="296" y="332" font-size="9" fill="var(--faint)">33 l/s · 3 m/s</text>
        <line x1="140" y1="176" x2="62" y2="254" stroke="var(--ink)" stroke-width="4"/>
        <line x1="112" y1="204" x2="74" y2="242" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m49l)"/>
        <path d="M140,206 A30,30 0 0 1 118,198" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="122" y="188" text-anchor="end" font-size="9.5" fill="var(--alt)">45°</text>
        <text x="14" y="278" font-size="10" fill="var(--ink)">4 · sale</text>
        <text x="14" y="292" font-size="9" fill="var(--faint)">30 l/s · 1,8 m/s</text>
        <line x1="196" y1="180" x2="196" y2="146" stroke="var(--faint)" stroke-width="1.4" marker-end="url(#m49l)"/>
        <line x1="196" y1="180" x2="236" y2="180" stroke="var(--faint)" stroke-width="1.4" marker-end="url(#m49l)"/>
        <text x="188" y="146" text-anchor="end" font-size="10" fill="var(--faint)">y</text>
        <text x="240" y="184" font-size="10" fill="var(--faint)">x</text>
      </svg>
      <figcaption>Los ángulos del 2 y el 4 se miden desde los bordes verticales de la caja y el del 3 desde el borde inferior. Leerlos mal es el fallo caro del problema: cambia el signo de una componente.</figcaption>
      </figure>
    pide: Las dos componentes de la fuerza que mantiene la caja en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Se dan cuatro caudales pero no se dice cuáles entran y cuáles salen.
          ¿Cómo se averigua?
        opciones:
          - texto: Por continuidad. La única combinación que suma lo mismo a los dos lados es 21 + 33 entrando y 24 + 30 saliendo
            correcta: true
            mensaje: |
              Eso es, y merece hacerse antes que nada: $21+33 = 54 = 24+30$. Las
              otras dos particiones —con el 2 o el 4 entrando— dan 45 contra 63
              y 51 contra 57, y no cierran.
          - texto: Por las flechas de la figura, y ya está
            mensaje: |
              Las flechas ayudan, pero conviene comprobarlas: la continuidad es
              una condición que **tiene** que cumplirse, y aquí distingue una
              sola de las posibilidades.
          - texto: Entra solo la 1, que es la que tiene presión conocida, y salen las otras tres
            mensaje: |
              Entonces entrarían 21 l/s y saldrían 87: la caja se vaciaría. La
              presión medida no dice nada sobre el sentido.

      - tipo: calcular
        titulo: La sección de la tubería de entrada
        pregunta: |
          Sección de la tubería 1, en cm², a partir de su caudal y su velocidad.
        respuesta:
          tipo: magnitud
          valor: '46.67 cm2'
          tolerancia: 0.01
          formato: un área con su unidad (cm² o m²)
        distractores:
          - valor: '945 cm2'
            mensaje: |
              Has multiplicado el caudal por la velocidad en vez de dividir. El
              área es $Q/V$, y sale menor que el caudal en valor numérico.
        pista: |
          $A = Q/V$, con $Q$ en m³/s.
        desarrollo: |
          $$
          A_1 = \frac{0{,}021}{4{,}5} = 4{,}667 \cdot 10^{-3}\ \text{m}^{2} = 46{,}67\ \text{cm}^{2}
          $$

          Y lo mismo para las otras tres: 66,67; 110 y 166,67 cm².

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          Componente $R_x$ de la fuerza necesaria para mantener la caja en
          equilibrio, en newtons. Tómese la caja sin pérdidas, de modo que la
          carga de Bernoulli se conserva entre las cuatro secciones.
        respuesta:
          tipo: magnitud
          valor: '-37.4 N'
          tolerancia: 0.03
          formato: una fuerza con su unidad (N), con signo
        distractores:
          - valor: '86.2 N'
            mensaje: |
              Solo has puesto los términos de cantidad de movimiento. Las
              presiones de las cuatro secciones también empujan, y en el eje x
              suman 123 N que cambian hasta el signo del resultado.
          - valor: '-136.3 N'
            mensaje: |
              Has puesto la cantidad de movimiento con el signo cambiado: entra
              menos sale, en vez de sale menos entra.
        pista: |
          $\sum F_{ext} = \rho(\sum_{sal} Q\vec V - \sum_{ent} Q\vec V)$, y las
          presiones de cada sección empujan **hacia dentro** del volumen de
          control.
        desarrollo: |
          Con la carga común $B = 15 + 4{,}5^{2}/19{,}6 = 16{,}033$ mca salen las
          cuatro presiones: 147 000, 150 645, 152 625 y 155 505 Pa. Multiplicadas
          por sus áreas y proyectadas sobre x, las cuatro fuerzas de presión
          suman $+123{,}5$ N. Los términos de cantidad de movimiento dan
          $+86{,}2$ N. Por tanto

          $$
          R_x = 86{,}2 - 123{,}5 = -37{,}4\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          Componente $R_y$, en newtons.
        respuesta:
          tipo: magnitud
          valor: '-2085 N'
          tolerancia: 0.03
          formato: una fuerza con su unidad (N), con signo
        distractores:
          - valor: '-1685 N'
            mensaje: |
              Has medido el ángulo de la tubería 2 desde la horizontal. Se mide
              desde el borde **vertical** de la caja: su dirección es
              $(\sin 60°, \cos 60°)$, no $(\cos 60°, \sin 60°)$.
          - valor: '699.8 N'
            mensaje: |
              Has supuesto atmosféricas las presiones de las secciones 2, 3 y 4.
              La caja está llena de agua a presión: la carga se conserva y sus
              presiones son mayores que la de la 1, porque van más despacio.
          - valor: '13.8 N'
            mensaje: |
              Solo has puesto los términos de cantidad de movimiento. En el eje
              y las presiones suman 2 098 N: dominan por completo.
        pista: |
          Mismo procedimiento que en x, proyectando ahora sobre y. Ojo al signo
          de cada proyección.
        desarrollo: |
          $$
          \sum F_{\text{presión},y} = -686 - 502 + 1\,454 + 1\,832 = 2\,098\ \text{N} \qquad \rho\,\Delta_y = 13{,}8\ \text{N}
          $$

          $$
          R_y = 13{,}8 - 2\,098 = -2\,085\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento de la caja. Una pieza es falsa.
        piezas:
          - texto: 'La continuidad decide qué entra y qué sale antes de escribir ninguna ecuación: 21 + 33 contra 24 + 30.'
          - texto: 'Las áreas salen de Q/V, y con la carga de Bernoulli común se obtienen las cuatro presiones.'
          - texto: 'Las presiones empujan hacia dentro del volumen de control por cada sección, y sus proyecciones dominan el resultado.'
          - texto: 'Como la caja es una caja negra, dentro puede haber pérdidas, y por eso las presiones de las secciones 2, 3 y 4 no se pueden conocer.'
            trampa: true
            mensaje: |
              Si no se pudieran conocer, el problema no tendría solución: con
              las secciones 2, 3 y 4 a presión desconocida hay tres incógnitas
              más que ecuaciones. El enunciado obliga a suponer que la carga se
              conserva, y esa suposición es la que cierra el problema. Conviene
              saber que se está haciendo.
    resolucion: |
      **Lo primero, y sin escribir una ecuación: quién entra y quién sale.** Los
      cuatro caudales solo admiten una partición que cumpla la continuidad:

      $$
      21 + 33 = 54 = 24 + 30
      $$

      Entran la 1 y la 3; salen la 2 y la 4. Las otras dos combinaciones dan 45
      contra 63 y 51 contra 57.

      **Después, los ángulos, que es donde está el fallo caro.** El de la
      tubería 2 y el de la 4 se miden desde los bordes **verticales** de la
      caja; el de la 3, desde el borde inferior. Así que las direcciones
      salientes son:

      | tubería | dirección | velocidad |
      |---|---|---|
      | 1 | $(0,-1)$, entrando | 4,5 |
      | 2 | $(\sin 60°, \cos 60°) = (0{,}866,\ 0{,}5)$ | 3,6 |
      | 3 | $(0{,}5,\ -0{,}866)$, entrando | 3 |
      | 4 | $(-0{,}707,\ -0{,}707)$ | 1,8 |

      **Las presiones.** Con las secciones $A = Q/V$ —46,67; 66,67; 110 y
      166,67 cm²— y la carga común $B = 16{,}033$ mca, las presiones son 147 000,
      150 645, 152 625 y 155 505 Pa. Cada una empuja hacia dentro del volumen
      de control, y sus proyecciones suman $(123{,}5;\ 2\,098)$ N.

      **El balance.** Los términos de cantidad de movimiento suman
      $(86{,}2;\ 13{,}8)$ N, así que

      $$
      R_x = 86{,}2 - 123{,}5 = -37{,}4\ \text{N} \qquad R_y = 13{,}8 - 2\,098 = -2\,085\ \text{N}
      $$

      **Lo que domina, y no es lo que uno espera.** En el eje y, la cantidad de
      movimiento aporta 14 N y las presiones 2 098: el 99,3 %. Un problema que
      se titula «de cantidad de movimiento» está decidido casi por completo por
      las presiones, porque las velocidades son pequeñas —entre 1,8 y 4,5 m/s—
      y las presiones grandes, 15 metros de columna. **La cantidad de
      movimiento solo manda cuando el fluido va rápido**; en una conducción
      normal, mandan las presiones.

      **Dos avisos.** El primero: el enunciado no dice que la caja no tenga
      pérdidas, pero sin esa suposición no hay forma de conocer las presiones
      de las secciones 2, 3 y 4, y el problema no cierra. Es una hipótesis
      obligada, y conviene escribirla. El segundo: el boletín publica
      $-37{,}3$ y $-2\,048{,}3$ N. La primera coincide; la segunda difiere un
      1,8 %, que no hemos sabido reproducir con ninguna variante razonable del
      planteamiento y que atribuimos a un redondeo de las presiones
      intermedias.
  - id: ejflu15-col418-la-placa-que-oscila-y-el-coseno-que-se-cancela
    titulo: La placa que oscila, y el coseno que se cancela
    fuente: Ejercicio 4.18 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Tal como se muestra en la figura, un chorro plano de un fluido de densidad
      $\rho$ y velocidad $V$, incide sobre una placa plana de dimensiones
      1x1 cm², que puede oscilar sobre un eje horizontal 0. Considerando el
      chorro horizontal y despreciando los rozamientos, se pide:

      a) Reparto de caudales salientes de la placa.

      b) Posición de equilibrio de la placa, definida por su ángulo $\alpha$ con
      la vertical.

      Nota: explíquese detalladamente el proceso seguido en la resolución.

      Datos: área del chorro = 10 cm²; V = 30 m/s; h = 60 cm; L = 90 cm; peso de
      la placa = 240 kg; densidad del fluido = 1000 kg/m³.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 300" role="img" width="400" height="300"
           aria-labelledby="f418t f418d">
        <title id="f418t">La placa colgada del eje O, desviada por un chorro horizontal que la golpea 60 cm por debajo</title>
        <desc id="f418d">Una placa plana cuelga de un eje horizontal O situado
        en su extremo superior y puede oscilar libremente. Un chorro horizontal
        incide sobre ella a una distancia vertical h de sesenta centímetros por
        debajo del eje. La placa, de noventa centímetros de longitud, queda
        inclinada un ángulo alfa respecto de la vertical, y su peso actúa en el
        punto medio. Al chocar, el chorro se reparte en dos láminas que resbalan
        por la placa hacia arriba y hacia abajo.</desc>
        <defs>
          <marker id="m418l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m418f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m418n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <circle cx="196" cy="46" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <text x="188" y="38" text-anchor="end" font-size="11" fill="var(--ink)">O</text>
        <line x1="196" y1="46" x2="196" y2="276" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 4"/>
        <line x1="196" y1="46" x2="314" y2="264" stroke="var(--ink)" stroke-width="6"/>
        <text x="320" y="264" font-size="10.5" fill="var(--ink)">placa · L = 90 cm</text>
        <path d="M196,126 A80,80 0 0 0 236,120" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="206" y="140" font-size="11" fill="var(--alt)">α</text>
        <rect x="40" y="152" width="212" height="14" fill="var(--live)" opacity="0.22"/>
        <line x1="66" y1="159" x2="244" y2="159" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m418l)"/>
        <text x="44" y="144" font-size="10" fill="var(--live)">V = 30 m/s · 10 cm²</text>
        <path d="M226,148 q10,-30 6,-58" fill="none" stroke="var(--live)" stroke-width="5" opacity="0.35"/>
        <path d="M232,172 q14,26 20,52" fill="none" stroke="var(--live)" stroke-width="3" opacity="0.35"/>
        <line x1="230" y1="112" x2="232" y2="86" stroke="var(--live)" stroke-width="2" marker-end="url(#m418l)"/>
        <line x1="246" y1="200" x2="254" y2="226" stroke="var(--live)" stroke-width="2" marker-end="url(#m418l)"/>
        <text x="240" y="80" font-size="10" fill="var(--live)">Q2</text>
        <text x="262" y="222" font-size="10" fill="var(--live)">Q3</text>
        <line x1="255" y1="155" x2="255" y2="196" stroke="var(--flag)" stroke-width="2" marker-end="url(#m418f)"/>
        <text x="262" y="180" font-size="9.5" fill="var(--flag)">G = 240 kg</text>
        <line x1="112" y1="50" x2="112" y2="155" stroke="var(--faint)" stroke-width="1" marker-start="url(#m418n)" marker-end="url(#m418n)"/>
        <line x1="108" y1="48" x2="192" y2="48" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="108" y1="157" x2="140" y2="157" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="104" y="106" text-anchor="end" font-size="10" fill="var(--faint)">h = 60 cm</text>
      </svg>
      <figcaption>La cota de 60 cm es vertical, no a lo largo de la placa. Por eso, cuanto más se inclina la placa, más lejos del eje la golpea el chorro: el brazo crece justo lo que la fuerza disminuye.</figcaption>
      </figure>
    pide: El reparto de caudales y el ángulo de equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al inclinarse la placa, la fuerza normal del chorro disminuye
          ($\rho QV\cos\alpha$) pero su brazo respecto de O aumenta. ¿Cuánto
          aumenta?
        opciones:
          - texto: Como $h/\cos\alpha$, porque los 60 cm se miden en vertical y la placa está inclinada
            correcta: true
            mensaje: |
              Eso es, y es lo que hace bonito el problema: el chorro sigue
              entrando a la misma altura, pero el punto de la placa que está a
              esa altura se aleja del eje al inclinarse. El brazo crece
              exactamente en $1/\cos\alpha$, que es lo que la fuerza pierde.
          - texto: 'No aumenta: el chorro golpea siempre en el mismo punto de la placa'
            mensaje: |
              Golpearía siempre en el mismo punto si la cota estuviera medida a
              lo largo de la placa. Está medida en **vertical**, así que el
              punto de impacto se desliza hacia abajo por la placa conforme
              ésta se inclina.
          - texto: Aumenta como $h\cos\alpha$, porque el brazo es la proyección
            mensaje: |
              La proyección **reduce**, no aumenta, y aquí el brazo crece. Lo
              que se proyecta es al revés: la distancia a lo largo de la placa
              es la vertical dividida por el coseno.

      - tipo: calcular
        titulo: La fuerza del chorro
        pregunta: |
          Cantidad de movimiento del chorro, $\rho\,Q\,V$, en newtons. El chorro
          tiene 10 cm² de sección y va a 30 m/s.
        respuesta:
          tipo: magnitud
          valor: '900 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N)
        distractores:
          - valor: '30 N'
            mensaje: |
              Te has quedado en el caudal, 30 l/s expresado como número. La
              fuerza es $\rho\,Q\,V$: hay que multiplicar por la densidad y por
              la velocidad.
          - valor: '9000 N'
            mensaje: |
              Has tomado los 10 cm² como 10 dm² o has puesto un cero de más al
              pasar a metros cuadrados: son $10\cdot 10^{-4}$ m².
        pista: |
          $Q = A\,V = 10\cdot 10^{-4} \cdot 30$.
        desarrollo: |
          $$
          Q = 0{,}001 \cdot 30 = 0{,}030\ \text{m}^{3}\text{/s} \qquad \rho\,Q\,V = 1\,000 \cdot 0{,}030 \cdot 30 = 900\ \text{N}
          $$

      - tipo: calcular
        titulo: El ángulo de equilibrio
        pregunta: |
          Ángulo $\alpha$ de la placa con la vertical, en grados. Pesa 240 kg y
          mide 90 cm.
        respuesta:
          tipo: numero
          valor: '30.68'
          tolerancia: 0.02
          formato: un número, en grados
        distractores:
          - valor: '14.78'
            mensaje: |
              Has tomado el brazo del peso como $L$ entero. El peso actúa en el
              **centro** de la placa: su brazo es $(L/2)\sin\alpha$.
          - valor: '61.35'
            mensaje: |
              Te has quedado en el seno. De
              $\sin\alpha = 0{,}510$ sale $\alpha = 30{,}68°$, no 0,510
              radianes ni el doble del ángulo.
          - valor: '27.03'
            mensaje: |
              Has medido los 60 cm a lo largo de la placa en vez de en vertical.
              Entonces el brazo del chorro sería $h$ fijo y el coseno **no** se
              cancelaría: quedaría $\tan\alpha$ donde va $\sin\alpha$.
        pista: |
          Momentos respecto de O: el del chorro es
          $\rho QV\cos\alpha \cdot \dfrac{h}{\cos\alpha}$ y el del peso,
          $G\,\dfrac{L}{2}\sin\alpha$.
        desarrollo: |
          $$
          \rho\,Q\,V\cos\alpha \cdot \frac{h}{\cos\alpha} = G\,\frac{L}{2}\sin\alpha \;\Longrightarrow\; \rho\,Q\,V\,h = G\,\frac{L}{2}\sin\alpha
          $$

          $$
          \sin\alpha = \frac{900 \cdot 0{,}60}{2\,352 \cdot 0{,}45} = \frac{540}{1\,058{,}4} = 0{,}5102 \;\Longrightarrow\; \alpha = 30{,}68°
          $$

      - tipo: calcular
        titulo: El caudal de la lámina que sube
        pregunta: |
          Caudal de la lámina que sale hacia arriba de la placa, en l/s, con el
          ángulo de equilibrio.
        respuesta:
          tipo: magnitud
          valor: '22.65 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '15 l/s'
            mensaje: |
              Has repartido a la mitad. Solo pasa cuando el chorro llega
              perpendicular a la placa, es decir, con la placa vertical.
          - valor: '7.35 l/s'
            mensaje: |
              Ese es el de la otra lámina, la que baja.
          - valor: '27.9 l/s'
            mensaje: |
              Has usado el coseno del ángulo con la vertical. El chorro es
              horizontal y la placa forma $\alpha$ con la vertical, así que
              entre los dos hay $90° - \alpha$, y su coseno es
              $\sin\alpha$.
        pista: |
          $Q_2 = \dfrac{Q_0\,(1+\sin\alpha)}{2}$, porque el ángulo entre el
          chorro y la placa es $90° - \alpha$.
        desarrollo: |
          $$
          Q_2 = \frac{30\,(1+0{,}5102)}{2} = 22{,}65\ \text{l/s} \qquad Q_3 = \frac{30\,(1-0{,}5102)}{2} = 7{,}35\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la placa. Una pieza es falsa.
        piezas:
          - texto: 'La placa es lisa, así que solo recibe fuerza normal, y el reparto de caudales sale de la ecuación tangencial: Q0(1 ± sen α)/2.'
          - texto: 'El momento del chorro respecto de O es la fuerza normal por su brazo, y el brazo es h/cos α porque la cota está medida en vertical.'
          - texto: 'Al multiplicar fuerza por brazo, el coseno se cancela: el momento del chorro NO depende del ángulo.'
          - texto: 'Como el momento del chorro no depende del ángulo, la placa no tiene una posición de equilibrio definida y se queda donde la pongas.'
            trampa: true
            mensaje: |
              Al revés: lo que da el equilibrio es que el momento del **peso** sí
              depende del ángulo, y crece con él como $\sin\alpha$. Un momento
              constante contra otro creciente se cortan en un solo punto, y ese
              corte es estable: si la placa se inclina de más, el peso gana y la
              devuelve.
    resolucion: |
      **El truco del problema, y es de geometría.** La cota $h = 60$ cm está
      medida **en vertical** desde el eje, no a lo largo de la placa. Así que
      cuando la placa se inclina un ángulo $\alpha$, el punto donde el chorro la
      golpea se aleja del eje: está a $h/\cos\alpha$ medido sobre la placa.

      **Y entonces pasa esto.** La fuerza normal del chorro vale
      $\rho QV\cos\alpha$ —disminuye al inclinarse— y su brazo vale
      $h/\cos\alpha$ —aumenta—. Al multiplicar, el coseno **se cancela**:

      $$
      M_{chorro} = \rho\,Q\,V\cos\alpha \cdot \frac{h}{\cos\alpha} = \rho\,Q\,V\,h = 900 \cdot 0{,}60 = 540\ \text{N}\cdot\text{m}
      $$

      El momento del chorro no depende del ángulo. El del peso sí:

      $$
      M_{peso} = G\,\frac{L}{2}\sin\alpha = 2\,352 \cdot 0{,}45 \cdot \sin\alpha = 1\,058{,}4\,\sin\alpha
      $$

      **El equilibrio** (b).

      $$
      \sin\alpha = \frac{540}{1\,058{,}4} = 0{,}5102 \;\Longrightarrow\; \alpha = 30{,}68°
      $$

      **El reparto** (a). El chorro es horizontal y la placa forma $\alpha$ con
      la vertical, así que entre los dos hay $90° - \alpha$ y la componente
      tangencial va con $\sin\alpha$:

      $$
      Q_2 = \frac{Q_0(1+\sin\alpha)}{2} = 22{,}65\ \text{l/s} \qquad Q_3 = \frac{Q_0(1-\sin\alpha)}{2} = 7{,}35\ \text{l/s}
      $$

      El boletín publica las dos expresiones y 30,67º.

      **Por qué el equilibrio es estable, y por qué no era evidente.** Un
      momento constante contra otro que crece con $\sin\alpha$ se cortan una
      sola vez; y si la placa se pasa, el peso gana y la devuelve. Pero ojo al
      límite: como $\sin\alpha \leq 1$, existe un chorro capaz de tumbar la
      placa del todo, y es el que cumple
      $\rho QVh > G L/2$, aquí 1 058 N·m. Con este caudal harían falta
      $V = 42$ m/s en vez de 30.
  - id: ejflu15-col422-la-placa-que-mide-el-nivel-del-deposito
    titulo: La placa que mide el nivel del depósito
    fuente: Ejercicio 4.22 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Una placa cuadrada de 12,7 kg de masa, de espesor uniforme y 300 mm de
      lado, está suspendida de forma que puede oscilar libremente alrededor de
      un eje horizontal, por su extremo superior «0». Un chorro horizontal que
      sale de un depósito lleno de agua, incide perpendicularmente sobre la
      placa 200 mm por debajo del extremo superior de la placa, cuando la misma
      está en posición vertical, desviándola un ángulo de 40º. Sabiendo que el
      diámetro del orificio es de 30 mm y que los coeficientes de velocidad y
      contracción son 0,97 y 0,7 respectivamente. Se pide:

      a) Altura $H$ que alcanza la lámina de agua sobre el orificio en dichas
      condiciones, es decir cuando el depósito está lleno, así como la velocidad
      y el caudal del chorro.

      b) Si el depósito se va vaciando, determinar la relación entre la cota $z$
      de la lámina de agua sobre el orificio en cada instante y el ángulo de
      inclinación $\theta$ de la placa sobre la que incide el chorro.

      c) Tiempo necesario para que la placa, al ir disminuyendo el ángulo de
      inclinación al variar el nivel del depósito, alcance $\theta$ = 20º,
      siendo la sección transversal del depósito 2 m².

      d) Los ensayos realizados en el depósito anterior se quieren utilizar para
      construir un embalse a escala $\lambda$ = 10. Determinar la velocidad y el
      caudal de salida del agua por los aliviaderos de fondo de la presa
      (orificios de desagüe de la presa) cuando el embalse se encuentre lleno.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 300" role="img" width="460" height="300"
           aria-labelledby="f422t f422d">
        <title id="f422t">El depósito que descarga por un orificio contra una placa colgada, desviándola 40 grados</title>
        <desc id="f422d">Un depósito con la lámina de agua a una altura H sobre
        un orificio de treinta milímetros. Del orificio sale un chorro
        horizontal que incide sobre una placa cuadrada de trescientos
        milímetros de lado, colgada de un eje horizontal O por su borde
        superior. El chorro llega a doscientos milímetros por debajo del eje,
        medidos en vertical, y desvía la placa cuarenta grados respecto de la
        vertical. Conforme el depósito se vacía, la placa se va enderezando.</desc>
        <defs>
          <marker id="m422l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m422f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--flag)"/></marker>
          <marker id="m422n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="20" y="34" width="150" height="196" fill="var(--live)" opacity="0.15"/>
        <path d="M20,34 v196 h150" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M170,34 V154 M170,166 V230" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="20" y1="34" x2="170" y2="34" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M88,25 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <text x="30" y="120" font-size="10.5" fill="var(--ink)">agua</text>
        <text x="30" y="252" font-size="9.5" fill="var(--faint)">sección 2 m²</text>
        <line x1="122" y1="38" x2="122" y2="156" stroke="var(--faint)" stroke-width="1" marker-start="url(#m422n)" marker-end="url(#m422n)"/>
        <text x="116" y="100" text-anchor="end" font-size="10.5" fill="var(--faint)">H</text>
        <rect x="170" y="152" width="188" height="14" fill="var(--live)" opacity="0.25"/>
        <line x1="188" y1="159" x2="350" y2="159" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m422l)"/>
        <text x="176" y="190" font-size="9.5" fill="var(--faint)">orificio Ø 30 mm</text>
        <text x="176" y="202" font-size="9.5" fill="var(--faint)">Cv = 0,97 · Cc = 0,7</text>
        <circle cx="280" cy="60" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <text x="272" y="52" text-anchor="end" font-size="11" fill="var(--ink)">O</text>
        <line x1="280" y1="60" x2="280" y2="260" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 4"/>
        <line x1="280" y1="60" x2="396" y2="198" stroke="var(--ink)" stroke-width="6"/>
        <text x="396" y="224" text-anchor="end" font-size="10" fill="var(--ink)">placa 300 mm · 12,7 kg</text>
        <path d="M280,124 A64,64 0 0 0 320,110" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="288" y="136" font-size="10.5" fill="var(--alt)">40°</text>
        <line x1="248" y1="64" x2="248" y2="155" stroke="var(--faint)" stroke-width="1" marker-start="url(#m422n)" marker-end="url(#m422n)"/>
        <line x1="244" y1="62" x2="276" y2="62" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="242" y="112" text-anchor="end" font-size="10" fill="var(--faint)">200 mm</text>
        <line x1="338" y1="129" x2="338" y2="168" stroke="var(--flag)" stroke-width="2" marker-end="url(#m422f)"/>
        <text x="344" y="154" font-size="9.5" fill="var(--flag)">peso</text>
      </svg>
      <figcaption>La cota de 200 mm es vertical y fija: el chorro entra siempre a la misma altura. Lo que cambia al inclinarse la placa es el punto de ella que está a esa altura, y por tanto el brazo.</figcaption>
      </figure>
    pide: La altura, velocidad y caudal iniciales; la ley z(θ); el tiempo hasta 20º; y la velocidad y caudal del embalse a escala 10.
    pasos:
      - tipo: reconocer
        pregunta: |
          El momento del chorro respecto del eje O es
          $\rho QV\cos\theta \cdot \dfrac{h}{\cos\theta}$. ¿Qué se sigue de que
          el coseno se cancele?
        opciones:
          - texto: Que el momento del chorro solo depende de ρQV, y que el ángulo lo fija enteramente el peso
            correcta: true
            mensaje: |
              Eso es. El chorro aporta un momento constante,
              $\rho QV\,h$, y el peso uno que crece como $\sin\theta$. Igualarlos
              da una relación directa entre el caudal —o sea, el nivel del
              depósito— y el ángulo: la placa se convierte en un indicador de
              nivel.
          - texto: Que la placa no tiene posición de equilibrio
            mensaje: |
              La tiene, y única: el momento del peso crece con el ángulo, así
              que corta al del chorro en un solo punto. Lo que no depende del
              ángulo es el momento **del chorro**.
          - texto: Que el chorro empuja igual sea cual sea el ángulo
            mensaje: |
              La fuerza sí disminuye, como $\cos\theta$. Lo que no cambia es su
              **momento**, porque el brazo crece exactamente en la misma
              proporción en que la fuerza baja.

      - tipo: calcular
        titulo: La cantidad de movimiento del chorro
        pregunta: |
          Valor de $\rho\,Q\,V$ del chorro, en newtons, con la placa a 40º.
        respuesta:
          tipo: magnitud
          valor: '60 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N)
        distractores:
          - valor: '120 N'
            mensaje: |
              Has puesto el brazo del peso igual a $L$. La placa es homogénea:
              su peso actúa en el centro, a $L/2 = 0{,}15$ m del eje.
          - valor: '6.12 N'
            mensaje: |
              Has tomado los 12,7 kg como newtons. Son kilogramos de masa: el
              peso es $12{,}7 \cdot 9{,}8 = 124{,}5$ N.
          - valor: '71.5 N'
            mensaje: |
              Has usado el coseno de 40º donde va el seno. El brazo del peso es
              $(L/2)\sin\theta$: se anula con la placa vertical, que es cuando
              el peso no hace ningún momento.
        pista: |
          $\rho\,Q\,V\,h = W\,\dfrac{L}{2}\sin 40°$, con
          $W = 12{,}7 \cdot 9{,}8$ N, $L = 0{,}3$ m y $h = 0{,}2$ m.
        desarrollo: |
          $$
          \rho\,Q\,V = \frac{124{,}46 \cdot 0{,}15 \cdot \sin 40°}{0{,}2} = \frac{12{,}00}{0{,}2} = 60{,}0\ \text{N}
          $$

      - tipo: calcular
        titulo: La velocidad y la altura
        pregunta: |
          Altura $H$ de la lámina sobre el orificio, en metros.
        respuesta:
          tipo: magnitud
          valor: '6.58 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '6.19 m'
            mensaje: |
              Te has dejado el coeficiente de velocidad al volver de $V$ a $H$.
              La velocidad real es $C_v\sqrt{2gH}$, así que
              $H = (V/C_v)^{2}/2g$: dividir entre 0,97 antes de elevar al
              cuadrado.
          - valor: '4.60 m'
            mensaje: |
              Te has dejado el coeficiente de contracción al sacar $V$ de
              $\rho\,Q\,V = \rho\,C_c A V^{2}$. Sin él la velocidad sale menor y
              la altura también.
          - valor: '9.39 m'
            mensaje: |
              Has aplicado $C_c$ dos veces, o has usado el diámetro del chorro
              contraído como si fuera el del orificio.
        pista: |
          $\rho\,Q\,V = \rho\,C_c A\,V^{2}$ da $V$; y
          $V = C_v\sqrt{2gH}$ da $H$.
        desarrollo: |
          $$
          V = \sqrt{\frac{60{,}0}{1\,000 \cdot 0{,}7 \cdot 7{,}069\cdot 10^{-4}}} = 11{,}01\ \text{m/s} \qquad Q = C_cA\,V = 5{,}45\ \text{l/s}
          $$

          $$
          H = \frac{(11{,}01/0{,}97)^{2}}{19{,}6} = 6{,}58\ \text{m}
          $$

      - tipo: calcular
        titulo: La ley que relaciona nivel y ángulo
        pregunta: |
          La relación es $z = k\,\sin\theta$. ¿Cuánto vale $k$, en metros?
        respuesta:
          tipo: numero
          valor: '10.23'
          tolerancia: 0.01
          formato: un número, en metros
        distractores:
          - valor: '6.58'
            mensaje: |
              Ese es el valor de $z$ para $\theta = 40°$, no la constante. La
              constante es $z/\sin\theta = 6{,}58/0{,}643$.
          - valor: '20.46'
            mensaje: |
              Te has dejado el 2 del brazo del peso, o has puesto $L$ entero en
              vez de $L/2$.
        pista: |
          Sustituye $V = C_v\sqrt{2gz}$ y $Q = C_cAV$ en
          $\rho QV h = W (L/2)\sin\theta$: la $z$ queda a la primera potencia.
        desarrollo: |
          $$
          \rho\,C_cA\,C_v^{2}\,2g\,z\,h = W\frac{L}{2}\sin\theta \;\Longrightarrow\; z = \frac{W\,L/2}{2g\,\rho\,C_cA\,C_v^{2}\,h}\,\sin\theta = 10{,}23\,\sin\theta
          $$

          Con $\theta = 40°$ devuelve los 6,58 m de partida, como debe.

      - tipo: calcular
        titulo: El tiempo hasta los 20 grados
        pregunta: |
          Tiempo que tarda la placa en pasar de 40º a 20º, en segundos, con un
          depósito de 2 m² de sección.
        respuesta:
          tipo: magnitud
          valor: '1306 s'
          tolerancia: 0.01
          formato: un tiempo con su unidad (s o min)
        distractores:
          - valor: '653 s'
            mensaje: |
              Te has dejado el 2 de la integral. $\int dz/\sqrt{z}$ vale
              $2\sqrt{z}$, no $\sqrt{z}$.
          - valor: '1129 s'
            mensaje: |
              Has supuesto el caudal constante en su valor inicial, 5,45 l/s. Va
              bajando conforme baja el nivel: hay que integrar.
          - valor: '4827 s'
            mensaje: |
              Has vaciado el depósito del todo. La placa llega a los 20º cuando
              el nivel baja a 3,50 m, no a cero: la integral va de 6,58 a 3,50.
        pista: |
          $z$ pasa de $10{,}23\sin 40° = 6{,}58$ m a
          $10{,}23\sin 20° = 3{,}50$ m, y
          $A_{dep}\,dz = -C_cA\,C_v\sqrt{2gz}\,dt$.
        desarrollo: |
          $$
          t = \frac{2\,A_{dep}}{C_cA\,C_v\sqrt{2g}}\left(\sqrt{z_1}-\sqrt{z_2}\right) = \frac{2 \cdot 2}{2{,}125\cdot 10^{-3}}\left(2{,}564 - 1{,}870\right)
          $$

          $$
          t = 1\,306\ \text{s} = 21\ \text{min}\ 46\ \text{s}
          $$

      - tipo: calcular
        titulo: El embalse a escala 10
        pregunta: |
          Caudal de salida por los aliviaderos de fondo del embalse, en m³/s,
          con $\lambda = 10$ y el embalse lleno.
        respuesta:
          tipo: magnitud
          valor: '1.723 m3/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (m³/s)
        distractores:
          - valor: '0.0545 m3/s'
            mensaje: |
              Has escalado el caudal con $\lambda$ a la primera. En semejanza de
              Froude las velocidades van con $\sqrt{\lambda}$ y las áreas con
              $\lambda^{2}$: el caudal, con $\lambda^{5/2}$.
          - valor: '0.545 m3/s'
            mensaje: |
              Has escalado con $\lambda^{2}$, solo las áreas. Falta el
              $\sqrt{\lambda}$ de la velocidad.
          - valor: '5.45 m3/s'
            mensaje: |
              Has escalado con $\lambda^{3}$, como si fuera un volumen. El
              caudal no es un volumen: es volumen por segundo, y el tiempo
              también escala.
        pista: |
          Con gravedad dominante manda Froude: $V_p = V_m\sqrt{\lambda}$ y
          $Q_p = Q_m\,\lambda^{5/2}$.
        desarrollo: |
          $$
          V_p = 11{,}01\sqrt{10} = 34{,}8\ \text{m/s} \qquad Q_p = 5{,}45\cdot 10^{-3} \cdot 10^{2{,}5} = 1{,}723\ \text{m}^{3}\text{/s}
          $$

      - tipo: justificar
        pregunta: Ordena el recorrido del problema. Una pieza es falsa.
        piezas:
          - texto: 'El momento del chorro no depende del ángulo, porque el coseno de la fuerza se cancela con el del brazo; el del peso sí, y crece como sen θ.'
          - texto: 'Igualarlos convierte a la placa en un indicador de nivel: z = 10,23·sen θ, una relación que no depende del tiempo.'
          - texto: 'El vaciado se integra con Torricelli, y la placa pasa de 40º a 20º en 21 minutos y tres cuartos.'
          - texto: 'Al pasar al embalse con λ = 10, el caudal se multiplica por 10 y la velocidad también, porque la semejanza conserva las proporciones.'
            trampa: true
            mensaje: |
              La semejanza geométrica conserva las proporciones, pero las
              magnitudes derivadas escalan cada una con su potencia. Con Froude
              —gravedad dominante, que es el caso de un embalse— la velocidad va
              con $\sqrt{\lambda} = 3{,}16$ y el caudal con
              $\lambda^{5/2} = 316$. El caudal se multiplica por trescientos
              dieciséis, no por diez.
    resolucion: |
      **Lo que hace este problema distinto: la placa es un instrumento.** Como
      el momento del chorro no depende del ángulo —el coseno de la fuerza se
      cancela con el del brazo, igual que en el 4.18— igualarlo al del peso da
      una relación directa entre el nivel del depósito y la inclinación de la
      placa. La placa **mide** el nivel.

      **El punto de partida** (a). Con $\theta = 40°$:

      $$
      \rho\,Q\,V = \frac{W\,(L/2)\sin 40°}{h} = \frac{124{,}46 \cdot 0{,}15 \cdot 0{,}643}{0{,}2} = 60{,}0\ \text{N}
      $$

      $$
      V = \sqrt{\frac{60{,}0}{\rho\,C_cA}} = 11{,}01\ \text{m/s} \qquad Q = 5{,}45\ \text{l/s} \qquad H = \frac{(V/C_v)^{2}}{2g} = 6{,}58\ \text{m}
      $$

      **La ley del instrumento** (b). Sustituyendo $V = C_v\sqrt{2gz}$ queda la
      $z$ a la primera potencia:

      $$
      z = \frac{W\,L/2}{2g\,\rho\,C_cA\,C_v^{2}\,h}\,\sin\theta = 10{,}23\,\sin\theta
      $$

      **El vaciado** (c). $z$ baja de 6,58 a 3,50 m:

      $$
      t = \frac{2A_{dep}}{C_cA\,C_v\sqrt{2g}}\left(\sqrt{6{,}58}-\sqrt{3{,}50}\right) = 1\,306\ \text{s} = 21\ \text{min}\ 46\ \text{s}
      $$

      **El salto a la presa** (d). Un embalse está gobernado por la gravedad,
      así que la semejanza es de **Froude**:

      $$
      V_p = 11{,}01\sqrt{10} = 34{,}8\ \text{m/s} \qquad Q_p = 5{,}45\cdot 10^{-3}\,10^{5/2} = 1{,}72\ \text{m}^{3}\text{/s}
      $$

      Los siete resultados coinciden con el boletín.

      **Por qué el instrumento no es lineal, y qué se saca de eso.** La ley es
      $z \propto \sin\theta$, no $z \propto \theta$. Entre 0º y 20º un grado de
      giro son 18 cm de nivel; entre 70º y 90º, solo 6. La escala se aprieta
      justo cuando el depósito está lleno, que es donde peor se lee. Es el
      problema de todo indicador de este tipo, y la razón de que las escalas de
      los manómetros de émbolo se graben con divisiones desiguales.

  - id: ejflu15-col419-el-grano-que-pesa-mas-mientras-cae
    titulo: El grano que pesa más mientras cae
    fuente: Ejercicio 4.19 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un granjero desea comprar 675 kg de grano en bruto en la cooperativa
      local. El grano se coloca en su camioneta mediante una tolva cuyo
      diámetro de salida es 0,3 m. El operador de la tolva establece el pago
      observando la masa total de la camioneta, indicada por una balanza, como
      función del tiempo. El flujo del grano de la tolva
      ($\dot m = 40$ kg/s) se suspende cuando la escala de la balanza indica
      la masa total de 675 kg. Si la $\rho_{grano} = 600$ kg/m³, determinar la
      carga útil a pagar.

      **Nota:** la balanza se tara cuando el camión está vacío.

      <figure class="figura-examen">
      <svg viewBox="0 0 480 300" role="img" width="480" height="300"
           aria-labelledby="f419t f419d">
        <title id="f419t">La tolva, la camioneta y la balanza</title>
        <desc id="f419d">Una tolva descarga grano por una boca de 0,3 m de
        diametro. El chorro de grano cae dentro de la caja de una camioneta, y
        la camioneta esta subida sobre una balanza que va marcando la masa
        total. Mientras el grano cae, la balanza no solo soporta el peso de lo
        que ya hay dentro.</desc>
        <defs>
          <marker id="m419n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M160,22 H300 L245,74 H215 Z" fill="var(--alt)" opacity="0.16" stroke="none"/>
        <path d="M160,22 H300 L245,74 H215 Z" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="230" y="14" text-anchor="middle" font-size="10" fill="var(--ink)">tolva</text>
        <path d="M219,82 v58 M226,88 v52 M233,80 v60 M240,90 v50" stroke="var(--alt)" stroke-width="2.4"/>
        <text x="256" y="124" font-size="10" fill="var(--alt)">40 kg/s</text>
        <line x1="215" y1="74" x2="215" y2="92" stroke="var(--faint)" stroke-width="1"/>
        <line x1="245" y1="74" x2="245" y2="92" stroke="var(--faint)" stroke-width="1"/>
        <line x1="215" y1="86" x2="245" y2="86" stroke="var(--faint)" stroke-width="1" marker-start="url(#m419n)" marker-end="url(#m419n)"/>
        <text x="254" y="90" font-size="10" fill="var(--faint)">D = 0,3 m</text>
        <path d="M122,163 H298 V193 H122 Z" fill="var(--alt)" opacity="0.28" stroke="none"/>
        <path d="M120,148 H300 V195 H120 Z" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <path d="M300,132 H352 L364,158 V195 H300 Z" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <circle cx="160" cy="205" r="11" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="266" cy="205" r="11" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="338" cy="205" r="11" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M96,224 H396 L408,254 H84 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="246" y="245" text-anchor="middle" font-size="12" fill="var(--ink)">BALANZA</text>
        <line x1="70" y1="258" x2="420" y2="258" stroke="var(--faint)" stroke-width="1.6"/>
        <path d="M90,258 l-8,9 M130,258 l-8,9 M170,258 l-8,9 M210,258 l-8,9 M250,258 l-8,9 M290,258 l-8,9 M330,258 l-8,9 M370,258 l-8,9 M410,258 l-8,9" stroke="var(--faint)" stroke-width="1.2"/>
        <text x="246" y="288" text-anchor="middle" font-size="10" fill="var(--faint)">la balanza está tarada con el camión vacío</text>
      </svg>
      <figcaption>El grano cae de la tolva a la caja, y la balanza va marcando. La pregunta es qué está midiendo exactamente mientras el chorro sigue cayendo.</figcaption>
      </figure>
    pide: La carga útil que el granjero tiene que pagar, en newtons.
    pasos:
      - tipo: reconocer
        pregunta: |
          Mientras el grano está cayendo, ¿qué mide la balanza?
        opciones:
          - texto: El peso del grano que ya hay dentro más la fuerza que hace el chorro al frenarse contra la caja
            correcta: true
            mensaje: |
              Eso es. El volumen de control que se apoya en la balanza recibe
              un chorro con cantidad de movimiento y lo devuelve en reposo; esa
              variación por unidad de tiempo, $\dot m\,V$, es una fuerza
              adicional que la balanza tiene que aguantar.
          - texto: Solo el peso del grano que ya hay dentro, porque el chorro todavía no ha llegado a la caja
            mensaje: |
              Sí ha llegado: está cayendo dentro y frenándose contra el montón.
              Detener un chorro cuesta fuerza, y esa fuerza la soporta la
              balanza.
          - texto: El peso del grano más el peso del chorro que está en el aire
            mensaje: |
              El grano que va por el aire no se apoya en nada: su peso lo lleva
              la gravedad, no la balanza. Lo que sí se apoya es el **impulso**
              del chorro al detenerse.

      - tipo: calcular
        titulo: La velocidad del chorro
        pregunta: |
          Velocidad con la que el grano sale de la tolva, con
          $\dot m = 40$ kg/s, $\rho = 600$ kg/m³ y una boca de 0,3 m.
        respuesta:
          tipo: magnitud
          valor: '0.943 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '0.236 m/s'
            mensaje: |
              Has usado $\pi D^{2}$ como área. El área de un círculo es
              $\pi D^{2}/4$: cuatro veces menos, y por tanto cuatro veces más
              velocidad.
          - valor: '0.566 m/s'
            mensaje: |
              Has usado la densidad del agua. El grano en bruto pesa 600 kg/m³,
              no 1000: ocupa más volumen para la misma masa y sale más deprisa.
        pista: |
          $\dot m = \rho\,A\,V$, con $A = \pi D^{2}/4$.
        desarrollo: |
          $$
          V = \frac{\dot m}{\rho\,A} = \frac{40}{600\cdot \pi\,0{,}3^{2}/4} = \frac{40}{42{,}41} = 0{,}943\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La carga útil
        pregunta: |
          Carga útil que hay que pagar, en newtons, cuando la balanza marca
          675 kg. Conviene guardar cuatro cifras.
        respuesta:
          tipo: magnitud
          valor: '6577 N'
          tolerancia: 0.002
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '6615 N'
            mensaje: |
              Eso es lo que marca la balanza pasado a newtons,
              $675\cdot 9{,}8$. Pero parte de esa lectura no es grano: son los
              37,7 N con los que el chorro empuja al frenarse.
          - valor: '675 N'
            mensaje: |
              Has dejado la masa en kilogramos. La balanza marca 675 **kg**;
              en newtons eso son $675\cdot 9{,}8 = 6615$ N, y de ahí hay que
              descontar la fuerza del chorro.
        pista: |
          Lo que marca la balanza es $W + \dot m V$. La carga útil es la W.
        desarrollo: |
          La balanza soporta el peso de lo que hay en la caja más la fuerza
          con la que el chorro se detiene:

          $$
          F_{balanza} = W + \dot m\,V \;\Longrightarrow\; W = 675\cdot 9{,}8 - 40\cdot 0{,}943 = 6615 - 37{,}7
          $$

          $$
          W = 6577\ \text{N}
          $$

          Son 671,2 kg de grano de verdad, no 675: **el granjero se ahorra
          3,8 kg** si el operador para la báscula en 675.

      - tipo: justificar
        pregunta: Ordena por qué la balanza engaña. Una pieza es falsa.
        piezas:
          - texto: 'El chorro llega a la caja con 0,943 m/s y sale de ella en reposo, así que pierde toda su cantidad de movimiento.'
          - texto: 'Esa pérdida por unidad de tiempo es una fuerza, $\dot m\,V = 37{,}7$ N, que el grano ejerce hacia abajo sobre la caja.'
          - texto: 'La balanza tiene que soportar esa fuerza además del peso, así que marca de más mientras el chorro cae.'
          - texto: 'Al parar la tolva en la marca de 675 kg, lo que hay dentro son 671,2 kg: la diferencia es medio por ciento, y a favor del granjero.'
          - texto: El error se corregiría midiendo más despacio, con un caudal másico menor, porque entonces el chorro tarda más en llegar.
            trampa: true
            mensaje: |
              Medir más despacio **sí** reduce el error, pero no por eso: la
              fuerza del chorro es $\dot m V = \dot m^{2}/(\rho A)$, así que va
              con el **cuadrado** del caudal másico. A la mitad de caudal, el
              error se divide por cuatro. Lo que no cambia es el tiempo que
              tarda el chorro en llegar, que no interviene.
    resolucion: |
      ## Una balanza no pesa: mide fuerza

      El truco de este problema está en distinguir dos cosas que en reposo son
      la misma y en movimiento no. Una balanza no mide masa ni peso: mide **la
      fuerza vertical que recibe**. Cuando encima solo hay algo quieto, esa
      fuerza es el peso y no hay diferencia. Cuando encima hay un chorro que
      está frenándose, hay algo más.

      ## La fuerza del chorro

      El grano sale de la tolva a

      $$
      V = \frac{\dot m}{\rho A} = \frac{40}{600\cdot\pi\,0{,}3^{2}/4} = 0{,}943\ \text{m/s}
      $$

      y llega a la caja con esa velocidad —el enunciado no da altura de caída,
      así que no se considera—. Dentro se detiene. Tomando como volumen de
      control todo lo que se apoya en la balanza, la cantidad de movimiento
      que entra por unidad de tiempo es $\dot m V$ y la que sale es cero, de
      modo que

      $$
      F_{balanza} = W + \dot m\,V = W + 40\cdot 0{,}943 = W + 37{,}7\ \text{N}
      $$

      ## El pago

      La balanza marca 675 kg, es decir 6615 N. De esos, 37,7 no son grano:

      $$
      W = 6615 - 37{,}7 = 6577\ \text{N}
      $$

      o sea **671,2 kg** de grano. El granjero paga por 675 y se lleva 671,2 —
      o al revés, según quién mire la báscula—.

      ## Cuánto importa, y de qué depende

      El error es del **0,57 %**. Sobre 675 kg son 3,8 kg, y a precio de grano
      en bruto no es una fortuna; sobre una tolva que carga camiones todo el
      día, sí.

      Y conviene ver de qué depende, porque no es evidente. Sustituyendo
      $V = \dot m/(\rho A)$:

      $$
      \dot m\,V = \frac{\dot m^{2}}{\rho\,A}
      $$

      El error va con el **cuadrado** del caudal másico y con la inversa del
      área de la boca. Cargar a la mitad de ritmo lo divide por cuatro; usar
      una boca del doble de diámetro lo divide por cuatro también. Y no
      depende en absoluto de la altura desde la que se descargue, mientras el
      grano no coja velocidad por el camino.

      La forma limpia de eliminarlo es más sencilla que todo eso: **parar la
      tolva y leer la báscula después**, con todo quieto. Es lo que hace
      cualquiera que sepa lo que está midiendo.

  - id: ejflu15-col417-la-tobera-doble-y-los-pernos-que-la-sujetan
    titulo: La tobera doble, y los pernos que la sujetan
    fuente: Ejercicio 4.17 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En la figura adjunta se muestra una tobera doble que proporciona un
      caudal conjunto de 0,5 m³/s, siendo los diámetros respectivos de 30, 12
      y 10 cm. Se pide:

      **a)** Fuerza de tracción producida en el conjunto de los pernos de
      unión entre la tobera y la tubería a la que se encuentra unida.

      **b)** Esfuerzo cortante en el conjunto de dichos pernos.

      <figure class="figura-examen">
      <svg viewBox="0 0 480 360" role="img" width="480" height="360"
           aria-labelledby="f417t f417d">
        <title id="f417t">La tobera doble y su brida de pernos</title>
        <desc id="f417d">Una tuberia de 30 cm sube inclinada 30 grados
        respecto de la vertical y termina en un cuerpo del que salen dos
        toberas. Una, de 12 cm, descarga horizontalmente hacia la izquierda;
        la otra, de 10 cm, descarga verticalmente hacia arriba. Las dos salen
        a la atmosfera y estan practicamente a la misma cota. Abajo, la brida
        de pernos que une la tobera con la tuberia, perpendicular al eje
        inclinado.</desc>
        <defs>
          <marker id="m417j" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m417n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <line x1="265" y1="305" x2="265" y2="230" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M265,255 A50,50 0 0 1 290,262" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="278" y="248" font-size="11" fill="var(--faint)">30°</text>
        <line x1="265" y1="305" x2="330" y2="192" stroke="var(--ink)" stroke-width="30" stroke-linecap="butt" opacity="0.18"/>
        <line x1="265" y1="305" x2="330" y2="192" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M312,178 H352 V210 H312 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="332" y1="178" x2="332" y2="118" stroke="var(--ink)" stroke-width="10" opacity="0.18"/>
        <line x1="332" y1="178" x2="332" y2="118" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M326,118 H338 L335,108 H329 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="332" y1="104" x2="332" y2="62" stroke="var(--live)" stroke-width="2" marker-end="url(#m417j)"/>
        <text x="344" y="82" font-size="12" fill="var(--ink)">B</text>
        <text x="344" y="140" font-size="12" fill="var(--faint)">3 · 10 cm</text>
        <line x1="312" y1="194" x2="232" y2="194" stroke="var(--ink)" stroke-width="12" opacity="0.18"/>
        <line x1="312" y1="194" x2="232" y2="194" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M232,188 V200 L222,197 V191 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="218" y1="194" x2="164" y2="194" stroke="var(--live)" stroke-width="2" marker-end="url(#m417j)"/>
        <text x="252" y="178" font-size="12" fill="var(--faint)">2 · 12 cm</text>
        <line x1="239" y1="290" x2="291" y2="320" stroke="var(--ink)" stroke-width="4"/>
        <path d="M232,296 l10,-6 l6,10 l-10,6 z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M286,320 l10,-6 l6,10 l-10,6 z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="200" y="286" text-anchor="end" font-size="11" fill="var(--ink)">pernos</text>
        <line x1="204" y1="290" x2="232" y2="298" stroke="var(--faint)" stroke-width="1"/>
        <text x="300" y="300" font-size="12" fill="var(--ink)">A</text>
        <line x1="228" y1="352" x2="256" y2="304" stroke="var(--live)" stroke-width="2" marker-end="url(#m417j)"/>
        <text x="214" y="352" text-anchor="end" font-size="11" fill="var(--live)">agua</text>
        <text x="336" y="326" font-size="11" fill="var(--faint)">1 · 30 cm</text>
      </svg>
      <figcaption>La tubería sube inclinada treinta grados respecto de la vertical y se abre en dos toberas: una hacia la izquierda y otra hacia arriba. Los pernos de la brida trabajan a tracción a lo largo del eje y a cortante en perpendicular.</figcaption>
      </figure>
    pide: La tracción y el cortante que soportan los pernos de la brida.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos toberas descargan a la atmósfera y están prácticamente a la
          misma cota. ¿Cómo se reparte entre ellas el caudal?
        opciones:
          - texto: Con la misma velocidad de salida en las dos, así que el caudal se reparte en proporción a las áreas
            correcta: true
            mensaje: |
              Eso es. Las dos salen del mismo punto interior, a la misma cota
              y a la misma presión —la atmosférica—, así que sin pérdidas
              Bernoulli les da la misma altura cinética y, por tanto, la misma
              velocidad. El reparto lo hace entonces el área.
          - texto: A partes iguales, 0,25 m³/s por cada una
            mensaje: |
              Solo si las dos toberas fueran iguales, y no lo son: 12 y 10 cm.
              Con caudales iguales las velocidades saldrían 22,1 y 31,8 m/s, y
              entonces la de 10 cm tendría más altura cinética que la de 12
              saliendo las dos a la atmósfera. Imposible.
          - texto: En proporción a los diámetros, 12 y 10
            mensaje: |
              La proporción es de **áreas**, no de diámetros: van con el
              cuadrado. 12² frente a 10², o sea 144 frente a 100, no 12 frente
              a 10.

      - tipo: calcular
        titulo: La velocidad de los chorros
        pregunta: |
          Velocidad de salida de los dos chorros, con 0,5 m³/s repartidos
          entre las toberas de 12 y 10 cm.
        respuesta:
          tipo: magnitud
          valor: '26.09 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '22.1 m/s'
            mensaje: |
              Has repartido el caudal a partes iguales y has calculado la
              velocidad de la tobera de 12 cm. El reparto va con las áreas: a
              la de 12 le tocan 295 l/s y a la de 10, 205.
          - valor: '31.8 m/s'
            mensaje: |
              Igual que la anterior pero con la tobera de 10 cm. Si el reparto
              fuera a partes iguales, las dos velocidades saldrían distintas, y
              eso es imposible descargando las dos a la atmósfera.
        pista: |
          $Q = V(A_2 + A_3)$, porque las dos salen con la misma V.
        desarrollo: |
          $$
          V = \frac{Q}{A_2 + A_3} = \frac{0{,}5}{0{,}011310 + 0{,}007854} = 26{,}09\ \text{m/s}
          $$

          y de ahí $Q_2 = 295{,}1$ l/s y $Q_3 = 204{,}9$ l/s. En la tubería de
          entrada, $V_1 = 0{,}5/0{,}070686 = 7{,}07$ m/s.

      - tipo: calcular
        titulo: La presión antes de la tobera
        pregunta: |
          Presión manométrica en la sección A, justo antes de la brida.
        respuesta:
          tipo: magnitud
          valor: '315 kPa'
          tolerancia: 0.01
          formato: una presión con su unidad (kPa, bar o mca)
        distractores:
          - valor: '340 kPa'
            mensaje: |
              Te has dejado la altura cinética de la entrada. El agua ya llega
              con 7,07 m/s: solo hay que aportarle la diferencia hasta los
              26,09 de salida.
          - valor: '31.5 kPa'
            mensaje: |
              Te has equivocado en un factor de diez, seguramente al pasar de
              metros de columna a pascales: 32,18 m por 9800 N/m³.
        pista: |
          Bernoulli de A a la salida, sin pérdidas y a la misma cota:
          $p_A/\gamma + V_1^{2}/2g = V^{2}/2g$.
        desarrollo: |
          $$
          \frac{p_A}{\gamma} = \frac{V^{2} - V_1^{2}}{2g} = \frac{26{,}09^{2} - 7{,}07^{2}}{19{,}6} = 32{,}18\ \text{m}
          $$

          $$
          p_A = 32{,}18\cdot 9800 = 315\,400\ \text{Pa} = 315{,}4\ \text{kPa}
          $$

      - tipo: calcular
        titulo: La tracción en los pernos
        pregunta: |
          Fuerza de tracción en el conjunto de los pernos, es decir la
          componente de la fuerza en la dirección del eje de la tubería.
        respuesta:
          tipo: magnitud
          valor: '25.05 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '25.83 kN'
            mensaje: |
              Esa es la suma de la presión y la cantidad de movimiento de
              entrada, $p_AA_1 + \dot m V_1$, sin descontar lo que se llevan
              los chorros. Los dos chorros tiran del conjunto, y su proyección
              sobre el eje no es despreciable.
          - valor: '26.61 kN'
            mensaje: |
              Has puesto los chorros con el signo cambiado. La cantidad de
              movimiento **sale** por ellos, así que se resta de la que entra,
              no se suma.
        pista: |
          $\vec F = (p_AA_1 + \dot m V_1)\hat e_1 - \dot m_2V\hat e_2 - \dot m_3V\hat e_3$,
          y después se proyecta sobre $\hat e_1$.
        desarrollo: |
          Con el eje de entrada a 30° de la vertical,
          $\hat e_1 = (0{,}5;\ 0{,}866)$, la tobera 2 hacia la izquierda
          $\hat e_2 = (-1;\ 0)$ y la 3 hacia arriba $\hat e_3 = (0;\ 1)$:

          | término | valor |
          |---|---|
          | $p_A A_1$ | 22 291 N |
          | $\dot m V_1$ | 3537 N |
          | $\dot m_2 V$ | 7699 N |
          | $\dot m_3 V$ | 5346 N |

          $$
          \vec F = 25\,828\,(0{,}5;\ 0{,}866) + 7699\,(1;\ 0) - 5346\,(0;\ 1) = (20\,613;\ 17\,021)\ \text{N}
          $$

          Y proyectando sobre el eje:

          $$
          T = 20\,613\cdot 0{,}5 + 17\,021\cdot 0{,}866 = 25\,047\ \text{N} = 25{,}05\ \text{kN}
          $$

      - tipo: calcular
        titulo: El cortante en los pernos
        pregunta: |
          Esfuerzo cortante en el conjunto de los pernos, es decir la
          componente perpendicular al eje.
        respuesta:
          tipo: magnitud
          valor: '9.34 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '4.43 kN'
            mensaje: |
              Has medido los 30° desde la horizontal. La figura los marca
              respecto de la **vertical**: la tubería sube casi de pie, no
              casi tumbada.
          - valor: '26.73 kN'
            mensaje: |
              Ese es el módulo de la fuerza entera. El cortante es solo su
              componente perpendicular al eje; la otra componente es la
              tracción.
        pista: |
          La perpendicular al eje es $(0{,}866;\ -0{,}5)$.
        desarrollo: |
          $$
          C = 20\,613\cdot 0{,}866 - 17\,021\cdot 0{,}5 = 9341\ \text{N} = 9{,}34\ \text{kN}
          $$

          El módulo de la fuerza total es 26,73 kN, y se reparte en 25,05 de
          tracción y 9,34 de cortante: el eje se lleva el 94 % de la fuerza.

      - tipo: justificar
        pregunta: Ordena de dónde sale la fuerza sobre los pernos. Una pieza es falsa.
        piezas:
          - texto: 'Por la sección A entra el agua empujando con la presión, $p_AA_1 = 22{,}3$ kN, más su cantidad de movimiento, 3,5 kN: 25,8 kN en la dirección del eje.'
          - texto: 'Por las toberas sale cantidad de movimiento: 7,7 kN hacia la izquierda y 5,3 kN hacia arriba, que se restan de lo anterior.'
          - texto: 'La suma vectorial da 26,7 kN, que la brida tiene que sujetar.'
          - texto: 'Proyectada sobre el eje son 25,05 kN de tracción, y en perpendicular 9,34 kN de cortante.'
          - texto: La presión de 315 kPa actúa también sobre las bocas de las toberas y hay que sumarla allí.
            trampa: true
            mensaje: |
              En las bocas la presión es la **atmosférica**, o sea cero
              manométrica: por eso el agua sale. La presión de 315 kPa existe
              dentro, antes de que la tobera la convierta en velocidad.
    resolucion: |
      ## Primero, cómo se reparte el caudal

      Las dos toberas descargan a la atmósfera, a la misma cota y desde el
      mismo interior. Sin pérdidas, Bernoulli les da la misma altura cinética,
      así que **salen con la misma velocidad** y el reparto lo hacen las áreas:

      $$
      V = \frac{Q}{A_2 + A_3} = \frac{0{,}5}{0{,}019164} = 26{,}09\ \text{m/s}
      $$

      $$
      Q_2 = 295{,}1\ \text{l/s} \qquad Q_3 = 204{,}9\ \text{l/s}
      $$

      Es un reparto de 59 a 41, no de 55 a 45: las áreas van con el cuadrado
      del diámetro.

      ## La presión que hay que vencer

      $$
      \frac{p_A}{\gamma} = \frac{26{,}09^{2} - 7{,}07^{2}}{19{,}6} = 32{,}18\ \text{m} \;\Longrightarrow\; p_A = 315{,}4\ \text{kPa}
      $$

      Tres atmósferas largas, y toda esa presión empuja sobre la sección de
      30 cm: **22,3 kN solo de presión**, antes de contar ninguna cantidad de
      movimiento.

      ## El balance, con cuidado con los signos

      Sobre el conjunto tobera + agua actúan la presión de entrada y los
      flujos de cantidad de movimiento. Con el eje a 30° de la vertical:

      | | módulo | dirección |
      |---|---|---|
      | $p_AA_1 + \dot mV_1$ | 25 828 N | eje, (0,5; 0,866) |
      | $\dot m_2V$ | 7699 N | sale a la izquierda |
      | $\dot m_3V$ | 5346 N | sale hacia arriba |

      $$
      \vec F = (20\,613;\ 17\,021)\ \text{N} \qquad |\vec F| = 26{,}73\ \text{kN}
      $$

      ## Y por qué se pide separada

      Un perno no trabaja igual a tracción que a cortante: el acero aguanta
      mucho más lo primero que lo segundo, y por eso el enunciado pide las dos
      componentes por separado en vez del módulo.

      $$
      T = 25{,}05\ \text{kN} \qquad C = 9{,}34\ \text{kN}
      $$

      El 94 % de la fuerza va por el eje —que es lo que se quiere, porque es
      para lo que sirve una brida— y el 9,34 kN de cortante es el que decide
      cuántos pernos hacen falta. Si la tobera se hubiera montado con el eje
      horizontal, la geometría sería otra y el reparto también.

      ## Un aviso sobre el ángulo

      Los 30° están medidos **desde la vertical**. Tomarlos desde la
      horizontal cambia el seno por el coseno y deja el cortante en 4,43 kN,
      menos de la mitad. Es el error más caro de este problema, y no se ve al
      revisar: los dos números salen plausibles.

  - id: ejflu15-col46-la-pieza-en-y-y-sus-dos-salidas
    titulo: La pieza en Y, y sus dos salidas
    fuente: Ejercicio 4.6 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un caudal de 600 l/s de agua fluye por una tubería de 45 cm de diámetro
      que se bifurca en dos, de 15 cm y 30 cm de diámetro, como indica la
      figura adjunta. Se pide:

      **a)** Esfuerzos Fx y Fy a que está sometida la pieza en Y.

      <figure class="figura-examen">
