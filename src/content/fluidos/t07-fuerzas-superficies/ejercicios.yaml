        </defs>
      </svg>
      <figcaption>

      Lo que decide este problema está en la franja de abajo: **hay agua también
      bajo la solera de la compuerta**, empujándola hacia arriba. Sin eso, la
      vertical sale de signo contrario.

      </figcaption>
      </figure>
    pide: Las fuerzas horizontal y vertical con sus líneas de acción, la reacción en B, y el par en función del nivel.
    pasos:
      - tipo: reconocer
        pregunta: |
          Mira la franja de 0,5 m que queda entre la solera de la compuerta y el
          nivel de referencia. ¿Qué hay ahí, y qué consecuencia tiene?
        opciones:
          - texto: |
              Agua, que empuja la solera **hacia arriba**: hay que sumar ese
              empuje al que el arco recibe desde arriba
            correcta: true
            mensaje: |
              Y es lo que decide el signo del resultado. Sobre el arco el agua
              carga hacia abajo con 28 kN; bajo la solera empuja hacia arriba con
              58,8. La resultante vertical sale **hacia arriba**, 30,8 kN. Si
              olvidas la franja te sale hacia abajo y con otro valor: no es un
              error de un 10 %, es un error de sentido.
          - texto: |
              Aire, porque la compuerta sella en B y el aire está a ese lado
            mensaje: |
              El aire está a la izquierda de la cara vertical O–B. La franja de
              abajo está a la derecha del sello y comunica con el agua del
              embalse: mira las líneas de agua dibujadas ahí.
          - texto: |
              Nada relevante: la solera es horizontal y las presiones
              horizontales no actúan sobre ella
            mensaje: |
              Cierto que no aporta nada horizontal, y por eso mismo aporta
              **todo** en vertical: una cara horizontal solo recibe fuerza
              vertical, y aquí son 58,8 kN.
          - texto: |
              Agua, pero da igual porque también hay agua encima y se compensan
            mensaje: |
              No se compensan: las dos actúan sobre **superficies distintas** de
              la compuerta —el arco y la solera— y con áreas proyectadas
              distintas. La de arriba vale 28 kN y la de abajo 58,8.

      - tipo: calcular
        titulo: La fuerza horizontal
        pregunta: |
          Con $z = 3{,}5$ m, ¿cuál es la fuerza horizontal del agua sobre la
          compuerta, en N?
        respuesta:
          tipo: magnitud
          valor: '39200 N'
          tolerancia: 0.01
          formato: la fuerza horizontal en N
        distractores:
          - valor: '58800 N'
            mensaje: |
              Has usado la profundidad de A, 3 m, como si la presión fuese
              uniforme sobre toda la proyección. No lo es: va de 1 m de columna
              en O a 3 m en A, y la media es 2.
          - valor: '19600 N'
            mensaje: |
              Parece que has usado $\gamma h^{2}/2$ con $h = 2$, como si la
              lámina estuviese justo en O. Está un metro más arriba, y ese metro
              es una presión uniforme añadida sobre toda la proyección.
        pista: |
          Profundidad media $\times$ área proyectada: la proyección es de
          $2\times 1$ m y va de 1 a 3 m de profundidad.
        desarrollo: |
          La proyección vertical de la compuerta va de O —a 1 m bajo la lámina—
          hasta A, a 3 m:

          $$
          F_{h} = \gamma\,\frac{1+3}{2}\,(2\cdot 1) = 9800\cdot 2\cdot 2
                = 39\,200\ \text{N}
          $$

          Y su línea de acción, el centro de presiones de un trapecio:

          $$
          y_{p} = \frac{2}{3}\,\frac{3^{3}-1^{3}}{3^{2}-1^{2}} = 2{,}167\ \text{m}
          \ \text{de profundidad}
          $$

          es decir **1,1667 m por debajo de O**, que es como conviene darla
          porque la articulación está ahí.

      - tipo: calcular
        titulo: La fuerza vertical
        pregunta: |
          Sumando lo que el agua carga sobre el arco y lo que empuja bajo la
          solera, ¿cuál es la resultante vertical, en N?
        respuesta:
          tipo: magnitud
          valor: '30787.6 N'
          tolerancia: 0.01
          formato: la resultante vertical en N
        distractores:
          - valor: '28012.4 N'
            mensaje: |
              Esa es solo la carga sobre el arco, hacia **abajo**, y te has
              dejado la franja de agua de debajo. Es el error que este problema
              está construido para provocar: cambia el resultado de signo.
          - valor: '58800 N'
            mensaje: |
              Ese es solo el empuje bajo la solera, sin descontar lo que el agua
              carga sobre el arco. Las dos actúan y hay que restarlas.
          - valor: '86812 N'
            mensaje: |
              Las has sumado en vez de restarlas. Una apunta hacia abajo —el
              agua que hay **encima** del arco— y la otra hacia arriba.
        pista: |
          Abajo: $\gamma\,(3R - \pi R^{2}/4)$. Arriba: $\gamma\,(z-0{,}5)\,R$.
        desarrollo: |
          **Sobre el arco**, el agua que hay verticalmente encima. Su sección es
          el rectángulo de $2\times 3$ menos el cuarto de círculo:

          $$
          D = \gamma\left(3R - \frac{\pi R^{2}}{4}\right)
            = 9800\,(6 - \pi) = 28\,012{,}4\ \text{N}\ \downarrow
          $$

          **Bajo la solera**, presión uniforme, porque todos sus puntos están a
          la misma profundidad, 3 m:

          $$
          U = \gamma\,(z-0{,}5)\,R = 9800\cdot 3\cdot 2 = 58\,800\ \text{N}\ \uparrow
          $$

          $$
          F_{v} = 58\,800 - 28\,012{,}4 = 30\,787{,}6\ \text{N}\ \uparrow
          $$

          Y su línea de acción sale de tomar momentos de las dos: el empuje de
          abajo es uniforme y actúa en $x = 1$; la carga de arriba, en
          $x = 1{,}166$. Combinadas dan **$x = 0{,}8488$ m** desde B.

      - tipo: calcular
        titulo: La reacción en el tope
        pregunta: |
          Tomando momentos en O —donde la articulación no da momento—, ¿cuánto
          vale la reacción horizontal en el tope B, en N?
        respuesta:
          tipo: magnitud
          valor: '9800 N'
          tolerancia: 0.01
          formato: la reacción en N
        distractores:
          - valor: '39200 N'
            mensaje: |
              Esa es la fuerza horizontal del agua. B no tiene que aguantarla
              entera: la articulación en O se lleva su parte, y además la fuerza
              vertical descarga a B con su propio momento.
          - valor: '22867 N'
            mensaje: |
              Parece que has repartido el momento horizontal sin descontar el de
              la vertical. Los dos giran en sentidos contrarios respecto de O:
              45 733 N·m contra 26 133.
        pista: |
          $R_B\cdot 2 = F_h\cdot 1{,}1667 - F_v\cdot 0{,}8488$.
        desarrollo: |
          $$
          M_{h} = 39\,200\cdot 1{,}1667 = 45\,733\ \text{N·m}
          \qquad
          M_{v} = 30\,787{,}6\cdot 0{,}8488 = 26\,133\ \text{N·m}
          $$

          Los dos giran en sentidos contrarios, así que al tope solo le llega la
          diferencia, repartida sobre su brazo de 2 m:

          $$
          R_{B} = \frac{45\,733 - 26\,133}{2} = 9\,800\ \text{N}
          $$

          Que salga exactamente $\gamma$ no es casualidad: con los números de
          este enunciado, $R_B = \gamma\,b\,\text{(1 m}^{2})$. Es una de esas
          coincidencias que conviene comprobar y no interpretar.

      - tipo: calcular
        titulo: El par máximo del apartado d)
        pregunta: |
          El par necesario resulta ser $M = \gamma\,(z-0{,}5)\,(2{,}5-z)$. ¿Para
          qué nivel $z$ es máximo, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.5 m'
          tolerancia: 0.01
          formato: el nivel en metros
        distractores:
          - valor: '2.5 m'
            mensaje: |
              Con $z = 2{,}5$ el agua llega justo a O y el par vale **cero**: es
              uno de los dos extremos donde la expresión se anula, no el máximo.
          - valor: '3.5 m'
            mensaje: |
              3,5 m es el nivel del apartado a), y está fuera del rango en el que
              vale esta fórmula: el enunciado la pide entre 0,5 y 2,5.
          - valor: '0.5 m'
            mensaje: |
              Con $z = 0{,}5$ el agua llega justo a la solera y no hay nada que
              empuje: el par también es cero. Es el otro extremo.
        pista: |
          Es una parábola invertida con ceros en 0,5 y 2,5.
        desarrollo: |
          $$
          M = 9800\,(z-0{,}5)(2{,}5-z)
          $$

          Es una parábola invertida que se anula en los dos extremos del
          intervalo y tiene su máximo en el punto medio:

          $$
          z = \frac{0{,}5+2{,}5}{2} = 1{,}5\ \text{m}
          \qquad
          M_{max} = 9800\cdot 1\cdot 1 = 9\,800\ \text{N·m}
          $$

          **Los dos ceros tienen sentido físico y conviene entenderlos.** Con
          $z = 0{,}5$ no hay agua sobre la compuerta y no hay nada que
          contrarrestar. Con $z = 2{,}5$ el agua llega hasta la articulación, y
          entonces el momento del empuje horizontal y el de la resultante
          vertical se cancelan exactamente. Entre medias hace falta par, y lo
          peor está justo a media altura.

      - tipo: justificar
        pregunta: |
          Ordena la deducción del apartado d). Una pieza es falsa.
        piezas:
          - texto: |
              Llamando $h = z-0{,}5$ a la altura de agua sobre la solera, el
              empuje horizontal vale $\gamma h^{2}/2$ y actúa a $h/3$ de la
              solera: su momento en O sale $\gamma h^{3}/6 - \gamma h^{2}$.
          - texto: |
              La carga sobre el arco mojado da un momento
              $\gamma h^{3}/6$ respecto de O, y el empuje uniforme bajo la
              solera, $2\gamma h$.
          - texto: |
              Al sumarlos, **los términos en $h^{3}$ se cancelan** y queda
              $M = \gamma\,h\,(2-h)$, es decir
              $M = 9800\,(z-0{,}5)(2{,}5-z)$.
          - texto: |
              La expresión solo vale mientras el agua no pase de O: en cuanto la
              supera, el arco queda entero sumergido y el planteamiento cambia.
          - texto: |
              Y como la parábola se anula en $z = 2{,}5$, por encima de ese
              nivel la compuerta se mantiene cerrada sola sin ningún par.
            trampa: true
            mensaje: |
              La parábola se anula ahí, pero **fuera de su intervalo de validez
              no dice nada**: el propio enunciado la pide solo entre 0,5 y 2,5.
              Para $z$ mayor hay que rehacer el cálculo con el arco entero
              sumergido, y da otra cosa — con $z = 3{,}5$, por ejemplo, los
              momentos ya no se cancelan: sobran 19 600 N·m que aguanta el tope.
              Extrapolar una fórmula fuera del rango donde se dedujo es de los
              errores más caros que hay.
    resolucion: |
      **Una compuerta con agua por los dos lados de su solera.**

      Lo primero es mirar la figura y ver la franja de 0,5 m que queda debajo:
      **también está llena de agua**. Sin eso, el apartado b) sale con el signo
      cambiado.

      **b) Las dos fuerzas.**

      Horizontal, sobre la proyección de $2\times 1$ m que va de 1 a 3 m de
      profundidad:

      $$
      F_h = \gamma\,\frac{1+3}{2}\,(2\cdot 1) = 39\,200\ \text{N}
      \qquad
      y_p = \frac{2}{3}\frac{3^{3}-1^{3}}{3^{2}-1^{2}} = 2{,}167\ \text{m}
      $$

      o sea **1,1667 m bajo O**.

      Vertical, sumando lo que carga sobre el arco y lo que empuja bajo la
      solera:

      $$
      D = \gamma(6-\pi) = 28\,012{,}4\ \text{N}\downarrow
      \qquad
      U = \gamma\cdot 3\cdot 2 = 58\,800\ \text{N}\uparrow
      $$

      $$
      F_v = 30\,787{,}6\ \text{N}\ \uparrow
      \qquad
      x = 0{,}8488\ \text{m desde B}
      $$

      **c) El tope.** Momentos en O, donde la articulación no aporta:

      $$
      R_B = \frac{39\,200\cdot 1{,}1667 - 30\,787{,}6\cdot 0{,}8488}{2}
          = 9\,800\ \text{N}
      $$

      **d) El par, y por qué sale tan limpio.** Con $h = z-0{,}5$, los tres
      momentos respecto de O son:

      | | momento en O |
      |---|---|
      | empuje horizontal | $\gamma h^{3}/6 - \gamma h^{2}$ |
      | carga sobre el arco | $-\gamma h^{3}/6$ |
      | empuje bajo la solera | $+2\gamma h$ |

      $$
      M = \gamma\,(2h - h^{2}) = \gamma\,h\,(2-h)
        = 9800\,(z-0{,}5)(2{,}5-z)
      $$

      **Los términos cúbicos se van exactamente**, y eso es lo bonito: lo que
      parecía una función complicada del nivel resulta ser una parábola. Se
      anula en los dos extremos —sin agua sobre la solera no hay nada que
      contrarrestar; con el agua en O los dos momentos se cancelan— y su máximo
      está justo en medio, $z = 1{,}5$ m, con 9 800 N·m.

      **Y una advertencia sobre el rango.** La fórmula vale entre 0,5 y 2,5 m
      porque se dedujo con el arco **parcialmente** mojado. Por encima de O el
      planteamiento es otro, y de hecho con $z = 3{,}5$ los momentos ya no se
      cancelan: es lo que da los 9 800 N de reacción del apartado c). Una
      parábola que se anula en 2,5 no significa que a partir de ahí la compuerta
      se sostenga sola; significa que ahí se acabó la fórmula.
  - id: ejflu07-col232-la-compuerta-de-sector-y-el-piston-que-no-nota-el-agua
    titulo: La compuerta de sector, y el pistón que no nota el agua
    fuente: Ejercicio 2.32 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La compuerta OBC controla un vertedero de una presa, tiene de radio 8 m y
      anchura 10 m, su masa es 10 t y su eje de giro es O. Su centro de masas es
      el punto A, siendo la distancia $OA = 5$ m. Para realizar la apertura de
      la compuerta consta de un pistón hidráulico, como se indica en la figura.
      Se pide:

      a) Calcular las componentes horizontal y vertical de la fuerza que ejerce
      el agua sobre la compuerta, dibujando previamente los prismas de presiones
      correspondientes.

      b) Fuerza resultante de la acción del agua sobre la compuerta, en módulo,
      dirección y sentido, indicando su línea de acción.

      c) ¿Cómo influye la presión del agua en la fuerza del pistón?

