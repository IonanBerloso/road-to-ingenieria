              transform="rotate(45 216 96)">4 m</text>

        <path d="M266 200 A 34 34 0 0 1 276 176" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="256" y="194" text-anchor="end" font-size="10" fill="var(--faint)">45°</text>

        <circle cx="300" cy="200" r="4.5" fill="var(--ink)"/>
        <text x="308" y="216" font-size="11" fill="var(--ink)">O</text>
        <text x="152" y="66" font-size="11" fill="var(--ink)">A</text>

        <circle cx="235" cy="135" r="3.6" fill="var(--alt)"/>
        <text x="212" y="130" font-size="10" fill="var(--alt)">G</text>
        <line x1="235" y1="139" x2="235" y2="182" stroke="var(--alt)" stroke-width="1.6"
              marker-end="url(#f225p)"/>
