      <figcaption>

      Dos cosas fuera de lo corriente: el manómetro marca **en negativo**, así
      que el plano de presión nula cae 1 m por debajo de A y no en la tapa; y la
      pared tiene **tres semicírculos alternados** en vez de ser recta.

      </figcaption>
      </figure>
    pide: Las resultantes horizontal y vertical sobre la pared ondulada, y su momento respecto de O.
    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro de la tapa marca $-0{,}1$ kg/cm². ¿Qué significa y dónde
          deja el plano de presión nula?
        opciones:
          - texto: |
              Que el depósito está en depresión: 0,1 kg/cm² son 1 mca, así que
              el plano de presión nula queda **1 m por debajo de A**
            correcta: true
            mensaje: |
              Eso es. Un manómetro que marca negativo mide una succión respecto
              de la atmósfera. Como $0{,}1$ kg/cm² $= 1$ mca, la presión se anula
              1 m más abajo de la tapa, y por encima de esa línea el agua está
              **tirando** de la pared hacia dentro en vez de empujarla. En las
              cuentas eso se traduce en escribir $p = \gamma\,(y-1)$ con $y$
              medido desde A, y todo lo demás es lo de siempre.
          - texto: |
              Que hay que restar 0,1 kg/cm² al final, cuando ya se tenga la
              fuerza
            mensaje: |
              La resta hay que hacerla **en la presión**, punto a punto, y luego
              integrar. Restarla al final funcionaría solo si la superficie
              fuera plana y vertical; con la pared ondulada, no.
          - texto: |
              Que el manómetro está mal montado: las presiones absolutas no
              pueden ser negativas
            mensaje: |
              Las absolutas no, pero las **manométricas** sí: −1 mca de
              manométrica son 9,3 mca de absoluta, perfectamente posibles. Es lo
              que hay en el interior de un depósito parcialmente vaciado, o
              aguas arriba de una bomba.
          - texto: |
              Que el agua no llega hasta A, sino que su superficie está 1 m más
              abajo
            mensaje: |
              El agua llena el depósito hasta la tapa: es un recinto cerrado. Lo
              que está 1 m por debajo de A es el plano de **presión nula**, que
              es otra cosa — una línea imaginaria, no una lámina libre.

      - tipo: calcular
        titulo: La resultante horizontal
        pregunta: |
          Con $p = \gamma\,(y-1)$ medido desde A, la pared de 8 m y 2 m de
          anchura, ¿cuánto vale la resultante horizontal, en kN?
        respuesta:
          tipo: magnitud
          valor: '470.4 kN'
          tolerancia: 0.01
          formato: la fuerza horizontal en kN
        distractores:
          - valor: '627.2 kN'
            mensaje: |
              Te has dejado la depresión y has usado $p = \gamma y$. Ese metro
              de menos en toda la altura son 157 kN, un tercio del resultado.
          - valor: '313.6 kN'
            mensaje: |
              Parece que has restado 1 m dos veces, o has usado
              $p = \gamma(y-2)$. La depresión es de 0,1 kg/cm², que son
              exactamente 1 mca.
          - valor: '235.2 kN'
            mensaje: |
              Te falta la anchura. El enunciado la da aparte: 2 m normales al
              dibujo.
        pista: |
          $F_h = \gamma\,b\int_0^{8}(y-1)\,dy$.
        desarrollo: |
          La ondulación **no importa** para la horizontal: lo que cuenta es la
          proyección sobre un plano vertical, y esa es la misma que si la pared
          fuese recta, 8 m por 2 m.

          $$
          F_{h} = \gamma\,b\int_{0}^{8}(y-1)\,dy
                = 9800\cdot 2\left[\frac{y^{2}}{2}-y\right]_{0}^{8}
                = 19\,600\cdot 24 = 470{,}4\ \text{kN}
          $$

      - tipo: calcular
        titulo: La resultante vertical
        pregunta: |
          La pared lleva tres semicírculos de $R = 1$ m: el primero hacia fuera,
          el segundo hacia dentro del agua y el tercero otra vez hacia fuera.
          ¿Cuál es la resultante vertical, en kN?
        respuesta:
          tipo: magnitud
          valor: '30.79 kN'
          tolerancia: 0.01
          formato: la fuerza vertical en kN
        distractores:
          - valor: '92.36 kN'
            mensaje: |
              Has sumado los tres en el mismo sentido. El del medio se abomba
              hacia **dentro** del agua, así que su empuje vertical va al revés
              que el de los otros dos: se cancela con uno de ellos.
          - valor: '0 kN'
            mensaje: |
              Se cancelarían si fueran dos, uno hacia cada lado. Son **tres**
              alternados: dos se anulan y queda uno.
          - valor: '123.15 kN'
            mensaje: |
              Parece que has usado $R = 2$ m. Cada semicírculo abarca 2 m de
              altura, y esos 2 m son su **diámetro**: el radio es 1 m, y el área
              va al cuadrado.
        pista: |
          Cada semicírculo aporta $\gamma\,b\,\pi R^{2}/2$, y los signos
          alternan.
        desarrollo: |
          La componente vertical sobre una superficie curva es el peso del
          volumen de agua asociado. Para un semicírculo eso es, exactamente,
          medio cilindro:

          $$
          F_{sem} = \gamma\,b\,\frac{\pi R^{2}}{2}
                  = 9800\cdot 2\cdot\frac{\pi}{2} = 30{,}79\ \text{kN}
          $$

          Y el signo lo pone hacia dónde se abomba: hacia fuera, el agua carga
          **hacia abajo**; hacia dentro, empuja **hacia arriba**.

          | semicírculo | se abomba | aporta |
          |---|---|---|
          | 1.º | hacia fuera | 30,79 kN ↓ |
          | 2.º | hacia dentro | 30,79 kN ↑ |
          | 3.º | hacia fuera | 30,79 kN ↓ |

          Los dos primeros se cancelan y queda el tercero:
          **$F_v = 30{,}79$ kN hacia abajo.**

          Fíjate en algo que no es evidente: **la profundidad no aparece**. El
          término de presión constante se integra a cero sobre un semicírculo
          completo, así que da igual a qué altura esté cada uno. Solo cuenta su
          radio y hacia dónde mira.

      - tipo: calcular
        titulo: El momento respecto de O
        pregunta: |
          ¿Cuál es el momento de las fuerzas del agua respecto del eje O, en
          MN·m?
        respuesta:
          tipo: magnitud
          valor: '1.084 MN*m'
          tolerancia: 0.01
          formato: el momento en MN·m
        distractores:
          - valor: '1.045 MN*m'
            mensaje: |
              Ese es solo el de la horizontal. Los tres semicírculos aportan
              39,2 kN·m más, y **los tres en el mismo sentido**: aunque sus
              fuerzas se cancelen dos a dos, sus momentos no, porque al cambiar
              de lado cambian a la vez la fuerza y el brazo.
          - valor: '1.006 MN*m'
            mensaje: |
              Parece que has restado los momentos de los semicírculos en vez de
              sumarlos. Comprueba el signo: el que se abomba hacia dentro tiene
              la fuerza hacia arriba **y** el brazo al otro lado, así que su
              momento sale del mismo signo que los otros dos.
        pista: |
          $M_h = \gamma b\int_0^8 (y-1)(8-y)\,dy$, y cada semicírculo aporta
          $F_{sem}\cdot 4R/(3\pi)$.
        desarrollo: |
          **De la horizontal**, integrando presión por brazo:

          $$
          M_{h} = \gamma\,b\int_{0}^{8}(y-1)(8-y)\,dy = 1\,045{,}3\ \text{kN·m}
          $$

          **De cada semicírculo**, con su centro de gravedad a
          $4R/(3\pi) = 0{,}4244$ m del plano de la pared:

          $$
          M_{sem} = 30{,}79\cdot 0{,}4244 = 13{,}07\ \text{kN·m}
          $$

          Y aquí está lo que hay que ver: **los tres suman con el mismo signo**.
          El del medio tiene la fuerza hacia arriba en vez de hacia abajo, pero
          también tiene el brazo al otro lado del plano: los dos cambios se
          compensan y el momento sale igual.

          $$
          M = 1\,045{,}3 + 3\cdot 13{,}07 = 1\,084{,}5\ \text{kN·m}
            \approx 1{,}084\ \text{MN·m}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: |
              El manómetro negativo desplaza el plano de presión nula 1 m por
              debajo de A: por encima de esa línea el agua tira de la pared
              hacia dentro, y por debajo la empuja hacia fuera.
          - texto: |
              Para la horizontal la ondulación es irrelevante: cuenta la
              proyección vertical, que son los mismos 8 × 2 m que si la pared
              fuese recta. Salen 470,4 kN.
          - texto: |
              En vertical, cada semicírculo aporta el peso de medio cilindro de
              agua, 30,79 kN, con el signo que marque hacia dónde se abomba.
              Como son tres alternados, dos se cancelan y queda uno.
          - texto: |
              En cambio sus **momentos** no se cancelan: el que se abomba hacia
              dentro tiene la fuerza invertida y el brazo también, así que los
              tres suman igual. Total, 1,084 MN·m.
          - texto: |
              Y como el término de presión constante no interviene en la
              vertical, tampoco interviene en el momento: el manómetro no afecta
              al resultado del apartado c).
            trampa: true
            mensaje: |
              La primera mitad es cierta —sobre un semicírculo completo el
              término constante se integra a cero— y la conclusión es falsa,
              porque el momento tiene **dos** sumandos y el grande es el de la
              horizontal, donde la depresión sí interviene: sin ella el momento
              horizontal pasaría de 1 045 a 1 673 kN·m. Que un término
              desaparezca de una componente no significa que desaparezca del
              problema.
    resolucion: |
      **Un depósito en depresión y una pared que no es recta.**

      Dos rarezas a la vez, y cada una se trata por su lado.

      **La depresión.** El manómetro marca $-0{,}1$ kg/cm², es decir $-1$ mca.
      Eso no invalida nada: solo desplaza el origen de presiones. Con $y$ medido
      desde A hacia abajo,

      $$
      p = \gamma\,(y-1)
      $$

      y el plano de presión nula cae 1 m por debajo de la tapa. Por encima el
      agua **tira** de la pared; por debajo la empuja.

      **a) La horizontal.** La ondulación no cuenta: lo que importa es la
      proyección sobre un plano vertical, idéntica a la de una pared recta de
      8 × 2 m.

      $$
      F_h = \gamma b\int_0^8 (y-1)\,dy = 470{,}4\ \text{kN}
      $$

      **b) La vertical.** Cada semicírculo aporta el peso de medio cilindro:

      $$
      F_{sem} = \gamma\,b\,\frac{\pi R^{2}}{2} = 30{,}79\ \text{kN}
      $$

      hacia abajo si se abomba hacia fuera y hacia arriba si lo hace hacia
      dentro. Con tres alternados —fuera, dentro, fuera— dos se cancelan:

      $$
      F_v = 30{,}79\ \text{kN}\ \downarrow
      $$

      **c) El momento en O.**

      $$
      M = \underbrace{\gamma b\int_0^8 (y-1)(8-y)\,dy}_{1045{,}3}
        + \underbrace{3\cdot 30{,}79\cdot\frac{4R}{3\pi}}_{39{,}2}
        = 1\,084{,}5\ \text{kN·m}
      $$

      **Las dos cosas que hay que llevarse, y las dos son sutiles.**

      La primera: en la componente vertical **la profundidad no aparece**. El
      término de presión constante —sea la atmosférica, sea la depresión, sea el
      calado— se integra a cero sobre un semicírculo completo, porque la mitad
      de arriba y la de abajo lo reciben en sentidos opuestos. Solo sobrevive el
      término que crece con la profundidad, y ese da exactamente el peso del
      medio cilindro. Por eso los tres semicírculos valen lo mismo estando a
      alturas distintas.

      La segunda, y es la que más se falla: **las fuerzas se cancelan y los
      momentos no**. El semicírculo del medio tiene la fuerza invertida, sí,
      pero su centro de gravedad está al otro lado del plano de la pared. Los
      dos signos cambian a la vez, y el producto —que es el momento— no cambia.
      Cancelar en la fuerza y volver a cancelar en el momento es el error
      natural, y aquí cuesta 26 kN·m.
