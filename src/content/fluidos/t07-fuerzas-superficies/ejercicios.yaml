      </svg>
      <figcaption>

      La compuerta llega a 4,33 m de altura y el agua solo sube a 3,23: **moja
      la parte baja y nada más**. Por eso la longitud mojada no es 5 m sino la
      que resulte de dividir el calado por el seno de 60°.

      </figcaption>
      </figure>
    pide: El nivel de agua de equilibrio con el contrapeso al aire y con el contrapeso sumergido.
    pasos:
      - tipo: reconocer
        pregunta: |
          La compuerta mide 5 m y está a 60°, así que llega a 4,33 m de altura.
          El agua se queda en 3,23. ¿Qué superficie hay que usar para el empuje?
        opciones:
          - texto: |
              Solo la parte mojada: desde B hasta donde la compuerta corta la
              lámina libre, o sea $h/\operatorname{sen}60°$ de longitud
            correcta: true
            mensaje: |
              Eso es, y hay dos cosas que separar. La **longitud mojada** no es
              $h$ —eso es la altura— sino $h/\operatorname{sen}60°$, un 15 % más
              larga, porque la compuerta va inclinada. Y no es 5 m, porque el
              agua no llega arriba.
          - texto: |
              Los 5 m de la compuerta, que es su superficie
            mensaje: |
              La compuerta mide 5 m, pero el agua solo llega a 3,73 m contados
              desde B. La parte de arriba está al aire y no recibe presión: si
              la incluyeras, el empuje saldría un 34 % mayor.
          - texto: |
              Una altura de $h$ metros, que es hasta donde llega el agua
            mensaje: |
              $h$ es la **altura**, medida en vertical, y la superficie de la
              compuerta va inclinada: es más larga que su proyección. Confundir
              las dos es el error clásico de las compuertas inclinadas, y aquí
              vale un 15 %.
          - texto: |
              La proyección vertical de la compuerta, porque el empuje es
              horizontal
            mensaje: |
              Eso serviría si solo quisieras la componente horizontal. Aquí hace
              falta el empuje **perpendicular a la compuerta**, porque es el que
              da momento respecto de la articulación, y ese se calcula sobre la
              superficie real.

      - tipo: calcular
        titulo: El momento del agua, en función del calado
        pregunta: |
          El empuje sobre la parte mojada vale
          $E = \gamma\,\dfrac{h}{2}\,\dfrac{h}{\operatorname{sen}60°}\,b$ y actúa
          a un tercio de la longitud mojada por encima de B. Con
          $h = 3{,}23$ m y $b = 3$ m, ¿cuánto vale ese empuje, en kN?
        respuesta:
          tipo: magnitud
          valor: '177.1 kN'
          tolerancia: 0.01
          formato: el empuje en kN
        distractores:
          - valor: '153.4 kN'
            mensaje: |
              Has usado $h$ como longitud mojada, sin dividir por el seno. La
              compuerta está inclinada: para cubrir 3,23 m de altura hacen falta
              3,73 m de compuerta.
          - valor: '354.2 kN'
            mensaje: |
              Te has dejado el factor 1/2. El diagrama de presiones sobre la
              parte mojada es triangular —cero en la superficie, máximo en B—,
              así que la presión media es la mitad de la del fondo.
          - valor: '237.4 kN'
            mensaje: |
              Parece que has usado los 5 m enteros de compuerta. El agua no
              llega arriba: se queda a 3,73 m de B.
        pista: |
          $9800 \cdot \dfrac{3{,}23}{2}\cdot\dfrac{3{,}23}{0{,}866}\cdot 3$.
        desarrollo: |
          $$
          E = \gamma\,\frac{h}{2}\cdot\frac{h}{\operatorname{sen}60°}\cdot b
            = 9800\cdot\frac{3{,}23}{2}\cdot\frac{3{,}23}{0{,}866}\cdot 3
            = 177{,}1\ \text{kN}
          $$

          Y su momento respecto de B, con brazo un tercio de la longitud mojada:

          $$
          M = E\cdot\frac{1}{3}\cdot\frac{h}{\operatorname{sen}60°}
            = 6533\,h^{3}
          $$

          Merece la pena quedarse con esa forma compacta: **el momento del agua
          crece con el cubo del calado**. Todo lo demás del problema es
          igualarlo a algo.

      - tipo: calcular
        titulo: El nivel con el peso al aire
        pregunta: |
          El cable tira en A perpendicularmente a la compuerta, así que su
          momento respecto de B es $T\cdot 5$. Con 4500 kg colgando al aire,
          ¿cuál es el nivel de equilibrio, en metros?
        respuesta:
          tipo: magnitud
          valor: '3.23 m'
          tolerancia: 0.01
          formato: el nivel en metros
        distractores:
          - valor: '4.33 m'
            mensaje: |
              4,33 m es hasta dónde llega la compuerta, no el equilibrio. Si el
              agua llegase ahí, su momento sería 530 kN·m contra los 220 del
              cable: la compuerta se habría abierto mucho antes.
          - valor: '2.7 m'
            mensaje: |
              Ese es el resultado del apartado **b)**, con el peso sumergido. Al
              aire el contrapeso rinde más y aguanta más agua.
          - valor: '5 m'
            mensaje: |
              5 m es la longitud de la compuerta, y además la compuerta no
              alcanza esa altura: inclinada 60°, solo sube 4,33 m.
        pista: |
          $6533\,h^{3} = 44\,100\cdot 5$.
        desarrollo: |
          $$
          T = 4500\cdot 9{,}8 = 44\,100\ \text{N}
          \qquad
          M_{cable} = 44\,100\cdot 5 = 220\,500\ \text{N·m}
          $$

          $$
          6533\,h^{3} = 220\,500
          \;\Longrightarrow\;
          h^{3} = 33{,}75
          \;\Longrightarrow\;
          h = 3{,}23\ \text{m}
          $$

          Comprobación: la compuerta queda mojada 3,73 m de sus 5 m, así que el
          supuesto de que el agua no llega arriba se sostiene. Si hubiera salido
          más de 4,33 habría que rehacerlo con la compuerta entera sumergida.

      - tipo: calcular
        titulo: El nivel con el peso sumergido
        pregunta: |
          Ahora el contrapeso está dentro del agua y su densidad relativa es
          2,4. ¿Cuál es el nuevo nivel de equilibrio, en metros?
        respuesta:
          tipo: magnitud
          valor: '2.7 m'
          tolerancia: 0.01
          formato: el nivel en metros
        distractores:
          - valor: '2.41 m'
            mensaje: |
              Parece que has dividido el peso entre 2,4 en vez de multiplicarlo
              por $(1-1/2{,}4)$. El empuje de Arquímedes no se lleva todo el
              peso: se lleva **el del agua desalojada**, que es 2,4 veces menor
              que el del contrapeso.
          - valor: '3.23 m'
            mensaje: |
              Ese es el apartado a). Sumergir el contrapeso le quita el 42 % de
              su peso útil, así que aguanta bastante menos agua.
          - valor: '1.88 m'
            mensaje: |
              Has aplicado el factor 0,583 al **resultado** en vez de a la
              fuerza: $3{,}23\cdot 0{,}583$. No se puede, porque la relación
              entre fuerza y nivel no es lineal — va con el cubo—. El factor se
              mete en el momento y luego se saca la raíz cúbica.
        pista: |
          El peso efectivo es $W\left(1-\dfrac{1}{2{,}4}\right)$.
        desarrollo: |
          Sumergido, el contrapeso pierde el peso del agua que desaloja. Como su
          densidad relativa es 2,4, ese agua pesa $1/2{,}4$ de lo que él pesa:

          $$
          T' = W\left(1-\frac{1}{2{,}4}\right) = 44\,100\cdot 0{,}5833
             = 25\,725\ \text{N}
          $$

          $$
          6533\,h^{3} = 25\,725\cdot 5 = 128\,625
          \;\Longrightarrow\;
          h = 2{,}70\ \text{m}
          $$

          Fíjate en la desproporción: el contrapeso pierde el **42 %** de su
          fuerza y el nivel solo baja un **16 %**, de 3,23 a 2,70. Es el cubo
          otra vez: como el momento del agua va con $h^{3}$, hace falta mucho
          menos calado para compensar mucha menos fuerza.

      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: |
              Como se desprecia el peso de la compuerta, en B solo compiten dos
              momentos: el del agua y el del cable.
          - texto: |
              El del agua vale $6533\,h^{3}$, y sale de un empuje triangular
              sobre la longitud **mojada** —$h/\operatorname{sen}60°$, no $h$—
              aplicado a un tercio de esa longitud sobre B.
          - texto: |
              El del cable vale $T\cdot 5$, porque tira perpendicular a la
              compuerta en su extremo A: el brazo es la longitud entera.
          - texto: |
              Al sumergir el contrapeso, Arquímedes le quita el peso del agua
              desalojada, que es $1/2{,}4$ del suyo: le queda el 58,3 %.
          - texto: |
              Y como el momento del agua crece con $h^{3}$, quitarle al
              contrapeso el 42 % de su fuerza baja el nivel de equilibrio
              también un 42 %.
            trampa: true
            mensaje: |
              Es justo lo que el cubo impide. Si $M \propto h^{3}$, reducir el
              momento al 58,3 % reduce el nivel a $\sqrt[3]{0{,}583} = 0{,}836$
              del anterior: de 3,23 a 2,70 m, un 16 %. Confundir la proporción
              de la causa con la del efecto es el error que este apartado b)
              está pensado para cazar — y siempre que aparezca una potencia,
              conviene desconfiar de los porcentajes trasladados tal cual.
    resolucion: |
      **Dos momentos en B, y un cubo que lo amortigua todo.**

      Como el peso de la compuerta se desprecia, en la articulación solo
      compiten el agua y el cable.

      **El momento del agua.** Lo que más se falla aquí es la geometría, no la
      física: la compuerta está a 60°, así que para cubrir $h$ metros de altura
      hacen falta $h/\operatorname{sen}60°$ metros de compuerta — un 15 % más—.
      Con el diagrama triangular y el brazo a un tercio de la longitud mojada:

      $$
      E = \gamma\,\frac{h}{2}\,\frac{h}{\operatorname{sen}60°}\,b
      \qquad
      M = E\,\frac{1}{3}\,\frac{h}{\operatorname{sen}60°}
        = \frac{\gamma\,b}{6\operatorname{sen}^{2}60°}\,h^{3}
        = 6533\,h^{3}
      $$

      **a) Con el contrapeso al aire.**

      $$
      6533\,h^{3} = 44\,100\cdot 5
      \;\Longrightarrow\;
      h = 3{,}23\ \text{m}
      $$

      **b) Con el contrapeso sumergido.** Arquímedes le quita el peso del agua
      desalojada, que es $1/2{,}4$ del suyo:

      $$
      T' = 44\,100\left(1-\frac{1}{2{,}4}\right) = 25\,725\ \text{N}
      \;\Longrightarrow\;
      h = 2{,}70\ \text{m}
      $$

      **Las tres cosas que hay que llevarse.**

      La primera es la comprobación que casi nadie hace: **el agua no llega
      arriba**. La compuerta sube 4,33 m y el equilibrio está en 3,23, así que
      queda mojada 3,73 m de sus 5. Si el resultado hubiera pasado de 4,33 m,
      todo el planteamiento habría sido inválido y habría que rehacerlo con la
      compuerta entera sumergida, donde el diagrama ya no es triangular sino
      trapecial. Conviene comprobarlo **siempre** al final.

      La segunda es el factor $(1 - 1/s)$, y hay que entenderlo, no
      memorizarlo. El contrapeso no pierde $1/2{,}4$ de su volumen ni se divide
      por 2,4: pierde el peso del agua que ocupa su sitio, y como él es 2,4
      veces más denso que esa agua, lo que pierde es $1/2{,}4$ de su peso.

      La tercera es la que da el sentido físico del problema. El momento del
      agua va con $h^{3}$, así que **el nivel es muy poco sensible a la
      fuerza**: quitarle al contrapeso el 42 % baja el calado solo un 16 %, la
      raíz cúbica de 0,583. Dicho al revés, y esto es lo que importa en obra:
      para subir un metro el nivel de retención de esta compuerta habría que
      subir el contrapeso mucho más de un metro de peso equivalente.
  - id: ejflu07-col239-el-angulo-de-la-presa-que-no-depende-del-agua
    titulo: El ángulo de la presa, que no depende del agua
    fuente: Ejercicio 2.39 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      ¿Qué condición debe satisfacer el ángulo $\theta$ para que la presa de la
      figura no bascule alrededor del punto O?

      Se supondrá que la presión sobre la solera de la presa varía linealmente
      desde un valor máximo en el punto A hasta la presión atmosférica en el
      punto O.

      Datos: peso específico relativo del material de la presa: 2,5; altura de
      agua en la presa: 5 m; profundidad normal de la presa: 50 m.

      <figure class="figura-examen">
      <svg viewBox="-26 16 418 236" role="img" width="430" height="243"
           aria-labelledby="f239t f239d">
        <title id="f239t">La presa triangular, con el agua delante y la subpresión debajo</title>
        <desc id="f239d">Una presa de sección triangular. Su cara de aguas
        arriba es vertical y mide cinco metros; su cara de aguas abajo baja en
        rampa desde la coronación hasta el pie O, formando con la vertical el
        ángulo theta. El pie de aguas arriba se llama A. A la izquierda hay agua
        hasta la coronación, que empuja la cara vertical con un diagrama
        triangular. Por debajo de la solera, entre A y O, se ha dibujado el
        diagrama de subpresión: vale lo mismo que la presión del agua en A y se
        anula en O. La figura está dibujada a escala para la solución, con la
        base valiendo 2,89 m frente a los 5 m de altura, o sea theta igual a
        treinta grados.</desc>

        <rect x="30" y="60" width="112" height="150" fill="var(--live)" fill-opacity=".14"/>
        <line x1="30" y1="60" x2="142" y2="60" stroke="var(--live)" stroke-width="2"/>
        <path d="M52 70 L74 70 M56 76 L68 76" stroke="var(--live)" stroke-width="1.4"/>

        <path d="M142 60 L142 210 L229 210 Z" fill="var(--ink)" opacity=".5"/>
        <text x="134" y="228" text-anchor="end" font-size="12" fill="var(--ink)">A</text>
        <text x="238" y="228" font-size="12" fill="var(--ink)">O</text>
        <circle cx="229" cy="210" r="4" fill="var(--ink)"/>

        <path d="M20 210 L300 210" stroke="var(--faint)" stroke-width="1.4"/>
        <path d="M26 210 L20 218 M42 210 L36 218 M58 210 L52 218 M74 210 L68 218
                 M90 210 L84 218 M106 210 L100 218 M122 210 L116 218 M138 210 L132 218
                 M246 210 L240 218 M262 210 L256 218 M278 210 L272 218 M294 210 L288 218"
              stroke="var(--faint)" stroke-width="1"/>

        <path d="M142 60 L142 210 L106 210 Z" fill="var(--flag)" fill-opacity=".2"
              stroke="var(--flag)" stroke-width="1.2"/>
        <text x="100" y="196" text-anchor="end" font-size="10.5" fill="var(--flag)">empuje</text>

        <path d="M142 222 L229 222 L142 258 Z" fill="var(--alt)" fill-opacity=".22"
              stroke="var(--alt)" stroke-width="1.2"/>
        <text x="238" y="248" font-size="10.5" fill="var(--alt)">subpresión</text>

        <line x1="16" y1="60" x2="16" y2="210" stroke="var(--faint)" stroke-width="1"/>
        <line x1="10" y1="60" x2="22" y2="60" stroke="var(--faint)" stroke-width="1"/>
        <line x1="10" y1="210" x2="22" y2="210" stroke="var(--faint)" stroke-width="1"/>
        <text x="6" y="138" text-anchor="end" font-size="11" fill="var(--faint)">5 m</text>

        <path d="M142 96 A36 36 0 0 0 163 90" fill="none"
              stroke="var(--faint)" stroke-width="1"/>
        <text x="170" y="94" font-size="12" fill="var(--faint)">θ</text>
        <line x1="142" y1="60" x2="142" y2="100" stroke="var(--faint)" stroke-width="1"
              stroke-dasharray="3 3"/>

        <text x="300" y="130" text-anchor="end" font-size="10.5" fill="var(--faint)">el ángulo sale</text>
        <text x="300" y="144" text-anchor="end" font-size="10.5" fill="var(--faint)">de no volcar en O</text>
        <line x1="248" y1="148" x2="228" y2="200" stroke="var(--faint)" stroke-width="1"
              marker-end="url(#f239a)"/>

        <defs>
          <marker id="f239a" viewBox="0 0 9 9" refX="7" refY="4.5"
                  markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--faint)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      Tres fuerzas y un punto: el empuje del agua y la **subpresión** vuelcan
      la presa sobre O, y solo su peso propio la sujeta. El ángulo mínimo es el
      que hace que esas tres se equilibren justo.

      </figcaption>
      </figure>
    pide: La condición sobre el ángulo del paramento para que la presa no vuelque.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que la presión bajo la solera «varía linealmente
          desde un valor máximo en A hasta la atmosférica en O». ¿Qué es eso y
          para qué lado trabaja?
        opciones:
          - texto: |
              Es la **subpresión**: el agua que se filtra bajo la presa y la
              empuja hacia arriba, aligerándola. Trabaja **a favor** del vuelco
            correcta: true
            mensaje: |
              Eso es, y es la fuerza que más se olvida. El agua no se queda
              delante: se mete por el terreno bajo la solera y presiona hacia
              arriba. Como esa presión levanta la presa, le resta peso
              justamente donde el peso es lo único que la sujeta. Aquí vale
              70,7 kN por metro, el 40 % del peso propio.
          - texto: |
              Es el peso del agua que hay encima de la presa, que la ayuda a no
              volcar
            mensaje: |
              Encima de esta presa no hay agua: su cara de aguas arriba es
              vertical y el agua queda toda a un lado. Y lo que describe el
              enunciado está **bajo la solera**, no encima.
          - texto: |
              Es la reacción del terreno, que por eso se reparte de forma
              triangular
            mensaje: |
              La reacción del terreno es la que equilibra todo lo demás y no se
              conoce de antemano. Lo que el enunciado describe es una acción
              **del agua**, y por eso da su forma: máxima en A, donde hay 5 m de
              agua encima, y nula en O, donde no hay ninguno.
          - texto: |
              Es una corrección pequeña que se puede despreciar en una presa de
              gravedad
            mensaje: |
              No es pequeña: cambia el resultado de 24,1° a 30°, casi seis
              grados. Ignorar la subpresión es el error que ha tirado presas
              reales — es lo que se llevó la de Saint Francis en 1928.

      - tipo: calcular
        titulo: El momento que vuelca
        pregunta: |
          El empuje del agua sobre la cara vertical, por metro de presa. ¿Qué
          momento produce respecto de O, en kN·m por metro?
        respuesta:
          tipo: magnitud
          valor: '204.2 kN*m'
          tolerancia: 0.01
          formato: el momento en kN·m por metro de presa
        distractores:
          - valor: '612.5 kN*m'
            mensaje: |
              Has usado 5 m de brazo, o sea la altura entera. El empuje sobre
              una pared vertical no actúa a media altura ni arriba: actúa a
              **un tercio** de la altura desde el fondo, porque el diagrama de
              presiones es triangular.
          - valor: '306.3 kN*m'
            mensaje: |
              Brazo de 2,5 m, la mitad de la altura. Eso valdría si la presión
              fuese uniforme; siendo triangular, el centro de presiones baja a
              $H/3$.
          - valor: '10208 kN*m'
            mensaje: |
              Has multiplicado por los 50 m de profundidad. Se pide **por metro
              de presa**, y de hecho esa profundidad no hace falta en todo el
              problema: se cancela.
        pista: |
          $E = \gamma H^{2}/2$ y actúa a $H/3$ del fondo.
        desarrollo: |
          $$
          E = \frac{\gamma H^{2}}{2} = \frac{9800\cdot 25}{2} = 122{,}5\ \text{kN/m}
          \qquad
          M_{vuelco} = E\cdot\frac{H}{3} = 122{,}5\cdot 1{,}667 = 204{,}2\ \text{kN·m/m}
          $$

          Y fíjate en el dato que sobra: los **50 m de profundidad normal** no
          aparecen. Todo el problema se plantea por metro de presa y la anchura
          se cancela en los dos lados de la ecuación. Un dato de más en el
          enunciado no siempre es un error: a veces está para ver si lo metes
          donde no toca.

      - tipo: calcular
        titulo: La base de la presa
        pregunta: |
          El peso propio y la subpresión actúan los dos a $2b/3$ de O. Imponiendo
          que el momento estabilizador iguale al de vuelco, ¿cuánto vale la base
          $b$, en metros?
        respuesta:
          tipo: magnitud
          valor: '2.887 m'
          tolerancia: 0.01
          formato: la base en metros
        distractores:
          - valor: '2.236 m'
            mensaje: |
              Has olvidado la subpresión. Sin ella el peso neto sería
              $2{,}5\gamma bH/2$ en vez de $1{,}5\gamma bH/2$, y bastaría una
              base de 2,24 m. La subpresión se lleva el 40 % de lo que sujeta la
              presa.
          - valor: '5 m'
            mensaje: |
              5 m es la altura, no la base. Si la base fuera igual a la altura,
              el ángulo sería de 45°, y la presa estaría muy sobredimensionada.
          - valor: '1.667 m'
            mensaje: |
              1,667 m es $H/3$, el brazo del empuje. Aparece en la ecuación pero
              no es la incógnita.
        pista: |
          $\dfrac{\gamma H^{2}}{2}\cdot\dfrac{H}{3}
           = (s-1)\dfrac{\gamma b H}{2}\cdot\dfrac{2b}{3}$.
        desarrollo: |
          El peso propio y la subpresión tienen **el mismo brazo**, $2b/3$
          desde O, porque los dos son triángulos con su vértice en O y su base
          en A. Así que se pueden restar antes de tomar momentos:

          $$
          W - U = \frac{s\,\gamma\,b H}{2} - \frac{\gamma H b}{2}
                = (s-1)\,\frac{\gamma b H}{2}
          $$

          Con $s = 2{,}5$, el factor es $1{,}5$: el agua de debajo se lleva el
          40 % de lo que la presa pesa. Igualando momentos:

          $$
          \frac{\gamma H^{2}}{2}\cdot\frac{H}{3}
          = (s-1)\frac{\gamma b H}{2}\cdot\frac{2b}{3}
          \;\Longrightarrow\;
          b^{2} = \frac{H^{2}}{2(s-1)} = \frac{25}{3}
          $$

          $$
          b = \frac{5}{\sqrt{3}} = 2{,}887\ \text{m}
          $$

      - tipo: calcular
        titulo: El ángulo
        pregunta: |
          ¿Cuál es entonces el ángulo mínimo $\theta$, en grados?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.3
          formato: el ángulo en grados, sin unidad
        distractores:
          - valor: '60'
            mensaje: |
              Has tomado el ángulo desde la horizontal. En la figura $\theta$
              se mide desde la **vertical**, en la coronación: es el que abre el
              paramento de aguas abajo. Los dos son complementarios.
          - valor: '24.09'
            mensaje: |
              Ese es el ángulo si se ignora la subpresión, y ese es justamente
              el peligro: parece que basta una presa más esbelta de la que hace
              falta. Casi seis grados menos de talud es mucho menos hormigón, y
              una presa que vuelca.
        pista: |
          $\tan\theta = b/H$.
        desarrollo: |
          $$
          \tan\theta = \frac{b}{H} = \frac{5/\sqrt{3}}{5} = \frac{1}{\sqrt{3}}
          \;\Longrightarrow\;
          \theta = 30°
          $$

          Que salga un ángulo exacto no es casualidad: los datos están elegidos
          para eso. Y merece la pena ver por qué, porque la fórmula general lo
          explica:

          $$
          \tan\theta = \frac{b}{H} = \frac{1}{\sqrt{2(s-1)}}
          $$

          **La altura del agua ha desaparecido.** El ángulo depende solo de la
          densidad del material.

      - tipo: justificar
        pregunta: |
          Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: |
              El agua vuelca la presa sobre O por dos caminos: empujando la cara
              vertical, y metiéndose bajo la solera para levantarla.
          - texto: |
              El peso propio y la subpresión tienen el mismo brazo, $2b/3$, así
              que se pueden restar: el peso útil es $(s-1)\gamma bH/2$, un 60 %
              del peso real.
          - texto: |
              Igualando momentos sale $b^{2} = H^{2}/\big(2(s-1)\big)$, y de ahí
              $\tan\theta = 1/\sqrt{2(s-1)} = 1/\sqrt{3}$, o sea 30°.
          - texto: |
              Y en esa expresión la altura del agua **se ha ido**: el ángulo
              mínimo del paramento depende solo de la densidad del material, no
              de lo alta que sea la presa.
          - texto: |
              Como el ángulo no depende de la altura, una presa del mismo
              material vale igual para 5 m que para 50: basta con darle el mismo
              talud y crece proporcionada.
            trampa: true
            mensaje: |
              El **ángulo** no depende de la altura y la **presa** sí. Con la
              misma inclinación, subir de 5 a 50 m multiplica la base por diez y
              la sección por cien: no es «lo mismo más grande» en coste ni en
              cimentación. Y además este cálculo solo mira el vuelco: al crecer
              aparecen el deslizamiento y la tensión admisible del terreno, que
              en presas altas mandan antes que el vuelco. Que una fórmula pierda
              una variable no significa que el problema la haya perdido.
    resolucion: |
      **Tres fuerzas, un punto, y una variable que desaparece.**

      Todo se toma respecto de O, el pie de aguas abajo, y por metro de presa
      —los 50 m de profundidad se cancelan, y están en el enunciado para ver si
      los metes donde no van—.

      **Lo que vuelca.** El empuje del agua sobre la cara vertical:

      $$
      E = \frac{\gamma H^{2}}{2} = 122{,}5\ \text{kN/m}
      \qquad
      M_{vuelco} = E\,\frac{H}{3} = 204{,}2\ \text{kN·m/m}
      $$

      **Lo que sujeta, menos lo que resta.** El peso propio empuja hacia abajo y
      la subpresión hacia arriba, y los dos son triángulos con vértice en O:
      mismo brazo, $2b/3$. Así que se restan antes de tomar momentos:

      $$
      W - U = \frac{s\gamma bH}{2} - \frac{\gamma H b}{2}
            = (s-1)\frac{\gamma bH}{2}
      $$

      **El equilibrio.**

      $$
      \frac{\gamma H^{2}}{2}\cdot\frac{H}{3}
      = (s-1)\frac{\gamma bH}{2}\cdot\frac{2b}{3}
      \;\Longrightarrow\;
      b = \frac{H}{\sqrt{2(s-1)}} = 2{,}887\ \text{m}
      \;\Longrightarrow\;
      \boxed{\theta = 30°}
      $$

      **Las dos cosas que hay que llevarse.**

      La primera es la subpresión, y no es un detalle académico. Se lleva el
      **40 %** de lo que sujeta la presa, y olvidarla da 24,1° en vez de 30: una
      presa notablemente más esbelta, más barata y que vuelca. La presa de
      Saint Francis, en California, se llevó por delante unas cuatrocientas
      vidas en 1928 por, entre otras cosas, esto.

      La segunda es de método, y es lo bonito del problema. Al despejar en
      símbolos en vez de en números aparece

      $$
      \tan\theta = \frac{1}{\sqrt{2(s-1)}}
      $$

      y **la altura del agua no está**. Cuadruplicar el embalse no cambia el
      ángulo mínimo del paramento: cambia el tamaño de la presa, no su forma.
      Eso solo se ve despejando con letras. Si hubieras metido los números al
      principio, habrías obtenido el mismo 30° sin enterarte de que era general.

      Con una advertencia, eso sí: el ángulo es el mismo, la presa no. Con la
      misma inclinación, diez veces más alta significa cien veces más sección —y
      además, en presas grandes el vuelco deja de ser lo que manda: lo son el
      deslizamiento y lo que aguanta el terreno.
  - id: ejflu07-col233-el-cuarto-de-circulo-con-agua-por-debajo
    titulo: El cuarto de círculo, con agua también por debajo
    fuente: Ejercicio 2.33 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La compuerta OAB de la figura está articulada en O y sellada en B. Es una
      compuerta con forma de cuarto de círculo de $R = 2$ m. Se pide:

      a) Dibujar todos los prismas de presiones acotados de la sección del agua
      sobre la compuerta cuando $z = 3{,}5$ m.

      b) Calcular la fuerza horizontal y vertical del agua sobre la compuerta y
      las respectivas líneas de acción.

      c) Reacción en el tope B.

      d) Par mínimo que se debe realizar en la compuerta (N·m) en función de
      $Z$, para que se mantenga cerrada, cuando el valor de $Z$ esté comprendido
      entre 0,5 y $R+0{,}5$, es decir, cuando el nivel de agua esté comprendido
      entre O y B.

      Nota: ancho de la compuerta $b = 1$ m; despreciar el peso de la compuerta.
      Centroide del cuarto de círculo $= 4R/(3\pi)$.

