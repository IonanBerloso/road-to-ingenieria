      <figcaption>

      La compuerta tiene **agua a un lado y aceite al otro**, y encima de cada
      uno un aire que no está a la atmosférica: uno en depresión, medido por el
      vacuómetro, y el otro por el manómetro en U. Los dos prismas de presiones
      arrancan de un valor que hay que calcular antes, y ese es el ejercicio.

      </figcaption>
      </figure>
    pide: La fuerza horizontal que hay que aplicar en B, con su sentido.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos manómetros y ninguno mide la compuerta. ¿Para qué sirven?
        opciones:
          - texto: >-
              Para fijar el origen del prisma de presiones a cada lado: sin
              ellos no se sabe cuánto vale la presión en la lámina de cada
              fluido
            correcta: true
            mensaje: |
              Eso es. La compuerta ve dos prismas de presiones, y cada uno
              arranca de la presión de su aire. Uno está en depresión y el otro
              muy por encima de la atmósfera, así que el reparto no es el que
              sugiere el dibujo.
          - texto: >-
              Para comprobar que los dos depósitos están a la misma presión
            mensaje: |
              No lo están, y ahí está el problema: el de la izquierda a
              $-1{,}5$ mca y el de la derecha a $+4{,}5$. Si estuvieran igual,
              los manómetros sobrarían.
          - texto: >-
              Para calcular el peso de la compuerta
            mensaje: |
              El peso no interviene: la compuerta es vertical y la fuerza que
              se pide es horizontal, así que su peso no da momento respecto de
              la articulación en la dirección que importa. Además no se da.

      - tipo: calcular
        titulo: La presión del aire de la derecha
        pregunta: |
          ¿Qué presión tiene el aire sobre el aceite?
        respuesta:
          tipo: magnitud
          valor: '4.5 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1.5 mca'
            mensaje: |
              Has leído el desnivel del manómetro como si el líquido fuera
              agua. Es de $s_0 = 3$: cada metro de ese líquido son tres metros
              de columna de agua.
          - valor: '-4.5 mca'
            mensaje: |
              El signo. La rama abierta queda **más alta**, así que la presión
              del aire tiene que empujar hacia abajo el líquido de su lado: es
              una sobrepresión, no un vacío.
        pista: |
          $p = s_0\cdot h$ en metros de columna de agua.
        desarrollo: |
          $$
          \frac{p_{\text{aire}}}{\gamma} = s_0\cdot 1{,}5 = 3\cdot 1{,}5
          = 4{,}5\ \text{mca}
          $$

      - tipo: calcular
        titulo: La fuerza en B
        pregunta: |
          ¿Qué fuerza horizontal hay que aplicar en $B$?
        respuesta:
          tipo: magnitud
          valor: '2223 dan'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '635 dan'
            mensaje: |
              Te has dejado la depresión del aire de la izquierda. Con
              $p_2 = -0{,}15\ \text{kg/cm}^{2}$ el agua empuja $1{,}5$ mca
              menos en toda la compuerta, y eso cambia mucho el balance.
          - valor: '3493 dan'
            mensaje: |
              Has olvidado el aceite y su aire. Ese lado empuja hacia la
              izquierda con más fuerza que el agua hacia la derecha, y por eso
              la reacción sale **hacia la derecha**.
        pista: |
          Momentos respecto de $A$. El agua da $2{,}1$ mca en $A$ y $3{,}9$ en
          $B$; el aceite, $4{,}5$ en $A$ y $5{,}85$ en $B$.
        desarrollo: |
          Presiones a cada lado, con $A$ a $3{,}6\ \text{m}$ de la superficie
          del agua:

          $$
          \text{agua: } p_A = -1{,}5+3{,}6 = 2{,}1
          \qquad
          p_B = -1{,}5+5{,}4 = 3{,}9\ \text{mca}
          $$
          $$
          \text{aceite: } p_A = 4{,}5
          \qquad
          p_B = 4{,}5+0{,}75\cdot 1{,}8 = 5{,}85\ \text{mca}
          $$

          Momentos respecto de $A$, con $z$ medido hacia abajo:

          $$
          M_{\text{agua}} = b\gamma\!\!\int_0^{1{,}8}\!\!(2{,}1+z)z\,dz = 62{,}9\ \text{kN}\cdot\text{m}
          \quad
          M_{\text{aceite}} = b\gamma\!\!\int_0^{1{,}8}\!\!(4{,}5+0{,}75z)z\,dz = 102{,}9
          $$
          $$
          F = \frac{102{,}9-62{,}9}{1{,}8} = 22{,}2\ \text{kN} = 2223\ \text{daN}
          $$

          Y como el aceite gana, la fuerza que hay que aplicar va **hacia la
          derecha**, ayudando al agua.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro de la derecha da $4{,}5$ mca de aire sobre el
              aceite, y el de la izquierda, $-1{,}5$ mca sobre el agua.
          - texto: >-
              Con eso, el aceite empuja la compuerta con más fuerza que el
              agua, pese a ser más ligero y tener mucha menos altura.
          - texto: >-
              Tomando momentos respecto de $A$, hace falta aplicar $2223$ daN
              en $B$ **hacia la derecha**.
          - texto: >-
              El sentido de la fuerza se podía anticipar viendo que el depósito
              del agua es mucho más profundo.
            trampa: true
            mensaje: |
              La profundidad no decide nada por sí sola: lo que empuja es la
              **presión**, y el aire de la derecha aporta 4,5 mca de golpe
              mientras que el de la izquierda resta 1,5. Fiarse del dibujo es
              exactamente lo que este problema castiga.

    resolucion: |
      **Los dos manómetros son el problema.** Sin ellos, mirando el dibujo,
      cualquiera diría que los $5{,}4\ \text{m}$ de agua ganan a los
      $1{,}8\ \text{m}$ de aceite ligero. Con ellos, la cuenta se da la vuelta.

      $$
      \text{izquierda: } p_{\text{aire}} = -0{,}15\ \frac{\text{kg}}{\text{cm}^{2}}
      = -1{,}5\ \text{mca}
      \qquad
      \text{derecha: } p_{\text{aire}} = 3\cdot 1{,}5 = +4{,}5\ \text{mca}
      $$

      **Las presiones sobre la compuerta**, que va de $A$ (superficie del
      aceite, a 3,6 m bajo la del agua) a $B$ (fondo):

      | | en $A$ | en $B$ |
      |---|---|---|
      | agua | $2{,}1$ mca | $3{,}9$ mca |
      | aceite | $4{,}5$ mca | $5{,}85$ mca |

      **El aceite gana en todos los puntos.** Tomando momentos respecto de la
      articulación:

      $$
      F = \frac{M_{\text{aceite}} - M_{\text{agua}}}{1{,}8}
      = \frac{102{,}9 - 62{,}9}{1{,}8} = 22{,}2\ \text{kN} = 2223\ \text{daN}
      \;\text{hacia la derecha}
      $$

      **Lo que hay que llevarse** es que el sentido de la fuerza no se puede
      adivinar mirando el dibujo. Aquí el lado con menos fluido y más ligero es
      el que más empuja, porque su aire está a cuatro metros y medio de columna
      de agua mientras que el otro está en depresión. Seis metros de columna de
      diferencia entre los dos aires, contra tres y pico que aporta la
      geometría.

      **Y la disciplina que lo hace fácil**: escribir la presión en $A$ y en
      $B$ **por los dos lados** antes de integrar nada, en una tabla de cuatro
      casillas. Con esa tabla delante, el signo del resultado ya se ve.

  # ── COLECCIÓN 2.25. La incógnita es la COTA del agua, no la fuerza: hay que
  #    escribir el momento en función de h y despejar de un cúbico.
  - id: ejflu7-col225-la-cota-de-equilibrio
    titulo: Hasta dónde puede subir el agua antes de abrir la compuerta
    fuente: >-
      Ejercicio 2.25 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La compuerta plana de la figura pesa $2.000\ \text{N}$ por m de longitud
      perpendicular al plano del papel, teniendo su centro de gravedad a
      $2\ \text{m}$ de su articulación $O$. Razonando su resolución se pide:

      a) Cota $h$ para la que la compuerta se encuentre en equilibrio.

      b) Dibujar el prisma de presiones, calculando los valores de los puntos
      singulares.

      <figure class="figura-examen">
      <svg viewBox="34 52 376 170" role="img" width="440" height="199"
           aria-labelledby="f225t f225d">
        <title id="f225t">La compuerta plana de 4 m a 45°, articulada en O al nivel del suelo</title>
        <desc id="f225d">Una compuerta plana de cuatro metros de longitud sube
        hacia la izquierda formando cuarenta y cinco grados con la horizontal,
        desde su articulación O, que está al nivel del suelo. El agua queda al
        otro lado, a la izquierda, y su lámina libre está a una cota h sobre el
        suelo. El peso de la compuerta, dos mil newton por metro de anchura,
        actúa hacia abajo en su centro de gravedad G, situado a dos metros de
        la articulación, es decir en el punto medio de la compuerta.</desc>

        <path d="M70 156 L256 156 L300 200 L70 200 Z" fill="var(--live)" fill-opacity=".12"/>

        <line x1="70" y1="156" x2="256" y2="156" stroke="var(--live)" stroke-width="1.6"/>
        <text x="76" y="150" font-size="10" fill="var(--live)">superficie libre</text>
        <text x="120" y="184" font-size="11" fill="var(--live)">Agua</text>

        <line x1="70" y1="150" x2="70" y2="200" stroke="var(--ink)" stroke-width="2"/>
        <line x1="40" y1="200" x2="400" y2="200" stroke="var(--ink)" stroke-width="2"/>
        <g stroke="var(--faint)" stroke-width="1">
          <path d="M46 200 L38 210 M66 200 L58 210 M86 200 L78 210 M106 200 L98 210 M126 200 L118 210 M146 200 L138 210 M166 200 L158 210 M186 200 L178 210 M206 200 L198 210 M226 200 L218 210 M246 200 L238 210 M266 200 L258 210 M286 200 L278 210 M306 200 L298 210 M326 200 L318 210 M346 200 L338 210 M366 200 L358 210 M386 200 L378 210"/>
        </g>

        <line x1="300" y1="200" x2="170" y2="70" stroke="var(--ink)" stroke-width="5"
              stroke-linecap="round" opacity=".8"/>
