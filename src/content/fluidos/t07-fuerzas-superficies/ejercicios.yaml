        <line x1="58" y1="156" x2="58" y2="200" stroke="var(--faint)" stroke-width="1"/>
        <line x1="53" y1="156" x2="70" y2="156" stroke="var(--faint)" stroke-width="1"/>
        <line x1="53" y1="200" x2="70" y2="200" stroke="var(--faint)" stroke-width="1"/>
