        <line x1="478" y1="169" x2="478" y2="214" stroke="var(--faint)" stroke-width="1"/>
        <line x1="472" y1="169" x2="484" y2="169" stroke="var(--faint)" stroke-width="1"/>
        <line x1="472" y1="214" x2="484" y2="214" stroke="var(--faint)" stroke-width="1"/>
