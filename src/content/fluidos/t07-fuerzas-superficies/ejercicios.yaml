        <text x="376" y="252" text-anchor="end" font-size="10.5" fill="var(--faint)">nivel de referencia</text>

        <defs>
          <marker id="f233a" viewBox="0 0 9 9" refX="7" refY="4.5"
                  markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--faint)"/>
