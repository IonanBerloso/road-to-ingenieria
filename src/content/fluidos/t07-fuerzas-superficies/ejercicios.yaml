        <text x="311" y="247" text-anchor="middle" font-size="10" fill="var(--alt)">s = 0,75</text>
        <text x="311" y="178" text-anchor="middle" font-size="10.5" fill="var(--faint)">Aire</text>

        <g stroke="var(--ink)" stroke-width="2" fill="none">
          <path d="M112 62 L112 258 L370 258 L370 150 L252 150 L252 62 Z"/>
        </g>
        <line x1="112" y1="96" x2="248" y2="96" stroke="var(--live)" stroke-width="1.6"/>
        <line x1="254" y1="204" x2="370" y2="204" stroke="var(--alt)" stroke-width="1.6"/>

        <line x1="250" y1="204" x2="250" y2="258" stroke="var(--ink)" stroke-width="6"
              stroke-linecap="round" opacity=".85"/>
        <text x="240" y="200" text-anchor="end" font-size="11" fill="var(--ink)">A</text>
        <text x="240" y="256" text-anchor="end" font-size="11" fill="var(--ink)">B</text>

        <circle cx="140" cy="40" r="13" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
