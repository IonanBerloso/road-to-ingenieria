ejercicios:
  # ── Los dos son NUESTROS (§08). Los del capítulo 2 de la colección se
  #    resuelven todos sobre una figura acotada —compuertas articuladas, topes,
  #    tramos curvos— y reproducirlos exige dibujar esa figura sin inventarse
  #    una cota. Están declarados como pendientes en tasks/todo.md; entrarán
  #    con su dibujo, no antes.
  - id: ejflu7-compuerta-vertical-y-el-centro-de-presion
    titulo: Una compuerta vertical, y dónde se aplica la fuerza
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito de agua tiene en su pared vertical una compuerta
      rectangular de $2\ \text{m}$ de ancho, cuyo borde superior está a
      $1\ \text{m}$ de profundidad y el inferior a $3\ \text{m}$.

      a) Calcular la fuerza hidrostática sobre la compuerta.

      b) Calcular la profundidad a la que se aplica.

      Tomar $\gamma = 9800\ \text{N/m}^{3}$ y presiones manométricas.
    pide: La resultante y la profundidad del centro de presión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para la resultante, ¿qué presión hay que usar?
        opciones:
          - texto: >-
              La del **centroide** de la compuerta, a $2\ \text{m}$:
              $F = p_G A = \gamma H_G A$
            correcta: true
            mensaje: |
              Eso es, y vale para cualquier superficie plana, inclinada o no.
              La presión varía linealmente, así que su valor medio es el del
              punto medio.
          - texto: >-
              La del borde inferior, que es la mayor
            mensaje: |
              Daría $\gamma\cdot3\cdot A = 117{,}6\ \text{kN}$, un 50 % de más.
              La presión no es uniforme: hay que usar su valor medio, que es
              el del centroide.
          - texto: >-
              La de la superficie libre, que es cero
            mensaje: |
              Entonces la fuerza sería nula, y evidentemente no lo es. La
              presión crece con la profundidad y en el centroide vale
              $\gamma H_G$.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuánto vale la fuerza sobre la compuerta?
        respuesta:
          tipo: magnitud
          valor: '78.4 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '117.6 kN'
            mensaje: |
              Has usado la presión del borde inferior ($3\ \text{m}$) en vez de
              la del centroide ($2\ \text{m}$). El prisma de presiones es un
              trapecio, no un rectángulo.
          - valor: '39.2 kN'
            mensaje: |
              Has usado la profundidad del borde superior o has olvidado que
              la compuerta mide $2\ \text{m}$ de alto. $A = 2\cdot2 = 4\ \text{m}^{2}$
              y $H_G = 2\ \text{m}$.
        pista: |
          F = γ·H_G·A, con H_G la profundidad del centro de la compuerta y A su área.
        desarrollo: |
          $$
          A = 2\cdot(3-1) = 4\ \text{m}^{2}
          \qquad
          H_G = \frac{1+3}{2} = 2\ \text{m}
          $$
          $$
          F = \gamma H_G A = 9800\cdot2\cdot4 = 78\,400\ \text{N} = 78{,}4\ \text{kN}
          $$

          **Comprobación por el prisma de presiones:** es un trapecio de bases
          $9{,}8$ y $29{,}4\ \text{kPa}$ y altura $2\ \text{m}$, por $2\ \text{m}$
          de ancho:
          $\frac{9{,}8+29{,}4}{2}\cdot2\cdot2 = 78{,}4\ \text{kN}$ ✓

      - tipo: calcular
        titulo: El centro de presión
        pregunta: |
          ¿A qué profundidad se aplica esa fuerza?
        respuesta:
          tipo: magnitud
          valor: '2.167 m'
          tolerancia: 0.01
          formato: una profundidad, con su unidad
        distractores:
          - valor: '2 m'
            mensaje: |
              Ese es el centroide de la compuerta. El centro de presión está
              **más abajo**, porque la presión pesa más en la parte honda:
              $Y_P = I_G/(Y_G A) + Y_G = 0{,}167 + 2$.
          - valor: '2.667 m'
            mensaje: |
              Has aplicado la regla de los «dos tercios», que **solo** vale
              cuando la compuerta llega hasta la superficie libre. Aquí
              empieza a $1\ \text{m}$, así que hay que usar la fórmula
              completa.
        pista: |
          Y_P = I_G/(Y_G·A) + Y_G, con I_G = b·h³/12 = 2·2³/12.
        desarrollo: |
          $$
          I_G = \frac{b\,h^{3}}{12} = \frac{2\cdot2^{3}}{12} = 1{,}333\ \text{m}^{4}
          $$
          $$
          Y_P = \frac{I_G}{Y_G A} + Y_G = \frac{1{,}333}{2\cdot4} + 2
          = 0{,}167 + 2 = 2{,}167\ \text{m}
          $$

          Está $16{,}7\ \text{cm}$ por debajo del centroide, y **entre el
          centroide y el borde inferior**, que es la comprobación de que la
          cuenta va bien.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $A = 4\ \text{m}^{2}$ y $H_G = 2\ \text{m}$, la profundidad del
              centro de la compuerta.
          - texto: >-
              $F = \gamma H_G A = 78{,}4\ \text{kN}$, que es también el volumen
              del prisma de presiones.
          - texto: >-
              $I_G = bh^{3}/12 = 1{,}333\ \text{m}^{4}$, respecto al eje
              horizontal que pasa por el centroide.
          - texto: >-
              $Y_P = I_G/(Y_G A) + Y_G = 2{,}167\ \text{m}$.
          - texto: >-
              Comprobación: el centro de presión cae entre el centroide
              ($2\ \text{m}$) y el borde inferior ($3\ \text{m}$).
          - texto: >-
              Si la compuerta se hundiera más, manteniendo su tamaño, el
              centro de presión se alejaría cada vez más del centroide.
            trampa: true
            mensaje: |
              Al revés: el término $I_G/(Y_G A)$ **disminuye** al crecer
              $Y_G$. Cuanto más honda está la compuerta, más uniforme es la
              presión sobre ella y más se parece el centro de presión al
              centroide. En el límite de gran profundidad, coinciden.

    resolucion: |
      **a) La resultante.** Para cualquier superficie plana, la fuerza es la
      presión en el centroide por el área:

      $$
      \boxed{F = \gamma H_G A = 9800\cdot2\cdot4 = 78{,}4\ \text{kN}}
      $$

      **b) El centro de presión.** No coincide con el centroide:

      $$
      \boxed{Y_P = \frac{I_G}{Y_G A} + Y_G = \frac{1{,}333}{8}+2 = 2{,}167\ \text{m}}
      $$

      > **Las dos cosas que se preguntan siempre, y en este orden.** La
      > resultante decide cuánta fuerza aguanta el anclaje; el centro de
      > presión decide si la compuerta gira. En los enunciados con rótula y
      > tope —los del capítulo 2 de la colección— el apartado que puntúa es
      > el segundo, porque de él sale el momento.

  - id: ejflu7-compuerta-inclinada
    titulo: La misma compuerta, ahora inclinada sesenta grados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una compuerta rectangular de $2\ \text{m}$ de ancho y $1{,}2\ \text{m}$
      de longitud está inclinada $60°$ respecto a la horizontal. Su borde
      superior está a $1\ \text{m}$ de profundidad.

      a) Calcular la fuerza hidrostática sobre ella.

      b) Calcular la profundidad del centro de presión.

      Tomar $\gamma = 9800\ \text{N/m}^{3}$.
    pide: La resultante y la profundidad a la que se aplica.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con la compuerta inclinada hay dos coordenadas distintas: la
          profundidad $H$ y la distancia $Y$ medida **a lo largo del plano**.
          ¿Cuál va en cada fórmula?
        opciones:
          - texto: >-
              En la fuerza, la profundidad ($F = \gamma H_G A$); en el centro
              de presión, la distancia a lo largo del plano
              ($Y_P = I_G/(Y_GA)+Y_G$), y las dos se relacionan por
              $H = Y\sin\theta$
            correcta: true
            mensaje: |
              Exacto, y mezclarlas es el error más caro del tema. La fuerza
              depende de la presión, que depende de la profundidad; los
              momentos se toman sobre el plano de la compuerta, así que van
              con $Y$.
          - texto: >-
              La profundidad en las dos
            mensaje: |
              En la del centro de presión no: $I_G$ está calculado sobre el
              plano de la compuerta ($bL^{3}/12$ con $L$ medido a lo largo),
              así que $Y_G$ tiene que estar en la misma coordenada.
          - texto: >-
              La distancia a lo largo del plano en las dos
            mensaje: |
              En la fuerza no: la presión la fija la **profundidad**. Usar
              $Y_G = 1{,}75\ \text{m}$ en vez de $H_G = 1{,}52\ \text{m}$ daría
              un 15 % de más.

      - tipo: calcular
        titulo: La profundidad del borde inferior
        pregunta: |
          ¿A qué profundidad está el borde inferior?
        respuesta:
          tipo: magnitud
          valor: '2.039 m'
          tolerancia: 0.01
          formato: una profundidad, con su unidad
        distractores:
          - valor: '2.2 m'
            mensaje: |
              Has sumado la longitud entera ($1 + 1{,}2$), como si la
              compuerta fuera vertical. Al estar inclinada, lo que baja es
              $L\sin 60° = 1{,}039\ \text{m}$.
          - valor: '1.6 m'
            mensaje: |
              Has usado el coseno: $1{,}2\cos 60° = 0{,}6$. Con la inclinación
              medida **respecto a la horizontal**, la caída vertical es
              $L\sin\theta$.
        pista: |
          1 m más lo que baja la compuerta: L·sen 60°.
        desarrollo: |
          $$
          h_{\text{inf}} = 1 + 1{,}2\sin 60° = 1 + 1{,}039 = 2{,}039\ \text{m}
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuánto vale la fuerza?
        respuesta:
          tipo: magnitud
          valor: '35.74 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '30.96 kN'
            mensaje: |
              Has proyectado el área ($A\sin 60°$) además de usar la
              profundidad. El área que va en la fórmula es la **real** de la
              compuerta, $2\cdot1{,}2 = 2{,}4\ \text{m}^{2}$; la inclinación ya
              está contada en $H_G$.
          - valor: '41.27 kN'
            mensaje: |
              Has usado $Y_G = 1{,}755\ \text{m}$ (a lo largo del plano) donde
              va $H_G = 1{,}52\ \text{m}$ (profundidad).
        pista: |
          F = γ·H_G·A con H_G la profundidad media, (1 + 2,039)/2.
        desarrollo: |
          $$
          H_G = \frac{1+2{,}039}{2} = 1{,}520\ \text{m}
          \qquad A = 2\cdot1{,}2 = 2{,}4\ \text{m}^{2}
          $$
          $$
          F = 9800\cdot1{,}520\cdot2{,}4 = 35\,741\ \text{N} = 35{,}74\ \text{kN}
          $$

          **Comprobación por el prisma:** presiones de $9{,}8$ y
          $19{,}98\ \text{kPa}$ en los bordes, por la longitud real
          $1{,}2\ \text{m}$ y el ancho $2\ \text{m}$:
          $\frac{9{,}8+19{,}98}{2}\cdot1{,}2\cdot2 = 35{,}74\ \text{kN}$ ✓

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              El borde inferior está a $1+1{,}2\sin 60° = 2{,}039\ \text{m}$.
          - texto: >-
              $H_G = 1{,}520\ \text{m}$ y $A = 2{,}4\ \text{m}^{2}$, luego
              $F = \gamma H_G A = 35{,}74\ \text{kN}$.
          - texto: >-
              A lo largo del plano, $Y_G = H_G/\sin 60° = 1{,}755\ \text{m}$.
          - texto: >-
              $I_G = bL^{3}/12 = 2\cdot1{,}2^{3}/12 = 0{,}288\ \text{m}^{4}$, y
              $Y_P = 0{,}288/(1{,}755\cdot2{,}4)+1{,}755 = 1{,}823\ \text{m}$.
          - texto: >-
              En profundidad, el centro de presión está a
              $1{,}823\sin 60° = 1{,}579\ \text{m}$.
          - texto: >-
              Al inclinar la compuerta manteniendo su borde superior, la
              fuerza crece, porque la superficie mojada es mayor.
            trampa: true
            mensaje: |
              La superficie de la compuerta es la misma —son los mismos
              $2{,}4\ \text{m}^{2}$—, y al inclinarla su borde inferior queda
              **menos hondo**, así que $H_G$ baja y la fuerza **disminuye**.
              Vertical daría $H_G = 1{,}6$ y $F = 37{,}6\ \text{kN}$, más que
              los $35{,}74$ de ahora.

    resolucion: |
      **a) La resultante.** Con la profundidad del centroide:

      $$
      H_G = \frac{1+2{,}039}{2} = 1{,}520\ \text{m}
      \qquad
      \boxed{F = \gamma H_G A = 9800\cdot1{,}520\cdot2{,}4 = 35{,}74\ \text{kN}}
      $$

      **b) El centro de presión**, con las distancias medidas a lo largo del
      plano:

      $$
      Y_G = \frac{H_G}{\sin 60°} = 1{,}755\ \text{m}
      \qquad
      Y_P = \frac{0{,}288}{1{,}755\cdot2{,}4}+1{,}755 = 1{,}823\ \text{m}
      $$

      $$
      \boxed{\text{en profundidad: } 1{,}823\sin 60° = 1{,}579\ \text{m}}
      $$

      > **La regla que resume el tema.** La **presión** se calcula con la
      > profundidad; los **momentos**, con la distancia a lo largo del plano.
      > Escribir las dos coordenadas por separado desde el principio —una
      > columna para $H$ y otra para $Y$— es lo que evita el error, y cuesta
      > diez segundos.

  # ── COLECCIÓN 2.38. Una presa entera, con vuelco y coeficiente de
  #    seguridad, y con el empuje del hielo, que es el dato que sorprende.
  - id: ejflu7-col238-la-presa-y-el-hielo
    titulo: Dimensionar una presa al vuelco, con el hielo apretando
    fuente: >-
      Ejercicio 2.38 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una presa de hormigón que ha de soportar el empuje de agua de
      $10\ \text{m}$ de altura. Su coronación tiene $2\ \text{m}$ y se
      encuentra situada $1\ \text{m}$ por encima de la lámina superior de agua.
      Teniendo en cuenta que puede helarse una capa de $5\ \text{cm}$ de
      espesor, se pide:

      a) Anchura de la base si se desea obtener un coeficiente de seguridad al
      vuelco de $1{,}8$.

      Datos: presión producida por el hielo $= 80\ \text{kg/cm}^{2}$; peso
      específico relativo del hormigón $= 2{,}4$.

      Nota: no se tendrá en cuenta ningún efecto de subpresión.

      (La presa es un trapecio de $11\ \text{m}$ de altura, con la cara
      mojada vertical, $2\ \text{m}$ de coronación y la base a determinar.)
    pide: La anchura de la base de la presa.

    pasos:
      - tipo: reconocer
        pregunta: |
          El hielo produce $80\ \text{kg/cm}^{2}$ sobre una capa de
          $5\ \text{cm}$. ¿Cómo se compara con el empuje del agua?
        opciones:
          - texto: >-
              Es del mismo orden: $392\ \text{kN/m}$ frente a los
              $490\ \text{kN/m}$ del agua, y además actúa mucho más arriba
            correcta: true
            mensaje: |
              Ese es el dato que sorprende y lo que hace interesante el
              ejercicio. El hielo empuja casi tanto como los diez metros de
              agua, y como actúa en la superficie —a 10 m de la base en vez de
              a 3,33— su momento de vuelco es **más del doble**.
          - texto: >-
              Es despreciable: solo son cinco centímetros de espesor
            mensaje: |
              El espesor es pequeño pero la presión es enorme: 80 kg/cm² son
              casi 800 atmósferas. Multiplicado por 5 cm de altura da 392 kN
              por metro lineal de presa.
          - texto: >-
              Es mucho mayor, porque el agua solo empuja con su peso
            mensaje: |
              Del mismo orden, no mucho mayor: 392 frente a 490 kN/m. Lo que sí
              es mayor es su **momento**, porque el brazo es tres veces más
              largo.

      - tipo: calcular
        titulo: El momento de vuelco
        pregunta: |
          ¿Cuánto vale el momento de vuelco por metro de presa, respecto del
          pie de aguas abajo?
        respuesta:
          tipo: magnitud
          valor: '5553 kn*m'
          tolerancia: 0.02
          formato: un momento, en kilonewton por metro
        distractores:
          - valor: '1633 kn*m'
            mensaje: |
              Solo has contado el agua. El hielo aporta $392\cdot 10 =
              3920\ \text{kN}\cdot\text{m}$, que es más del doble que el agua:
              empuja casi lo mismo y desde tres veces más alto.
          - valor: '4900 kn*m'
            mensaje: |
              Parece que has aplicado el empuje del agua a media altura en vez
              de al tercio. La resultante de un prisma triangular de presiones
              pasa por su centro de gravedad, a $h/3$ de la base.
        pista: |
          Empuje del agua $\gamma h^{2}/2$ aplicado a $h/3$; empuje del hielo
          $p\cdot e$ aplicado en la superficie del agua.
        desarrollo: |
          $$
          E_{\text{agua}} = \frac{\gamma h^{2}}{2} = \frac{9800\cdot 100}{2}
          = 490\ \text{kN/m}
          \quad\text{a } \frac{10}{3} = 3{,}33\ \text{m}
          $$
          $$
          E_{\text{hielo}} = 80\cdot 98\,000\cdot 0{,}05 = 392\ \text{kN/m}
          \quad\text{a } 10\ \text{m}
          $$
          $$
          M_v = 490\cdot 3{,}33 + 392\cdot 10 = 1633 + 3920
          = 5553\ \text{kN}\cdot\text{m/m}
          $$

      - tipo: calcular
        titulo: La anchura de la base
        pregunta: |
          ¿Qué anchura debe tener la base?
        respuesta:
          tipo: magnitud
          valor: '9.9 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '7.21 m'
            mensaje: |
              Has dimensionado con coeficiente 1, es decir al límite del
              vuelco. El enunciado pide $1{,}8$: el momento estabilizador tiene
              que ser 1,8 veces el de vuelco.
          - valor: '5.09 m'
            mensaje: |
              Casi seguro te has dejado el empuje del hielo, que es el término
              dominante del momento de vuelco. Sin él la presa saldría mucho
              más esbelta, y se caería el primer invierno.
        pista: |
          Parte el trapecio en rectángulo más triángulo, calcula el momento de
          cada uno respecto del pie de aguas abajo, e iguala a
          $1{,}8\,M_v$.
        desarrollo: |
          Con la cara mojada vertical, altura total $11\ \text{m}$, coronación
          $2\ \text{m}$ y base $B$, tomando momentos respecto del pie de aguas
          abajo:

          $$
          M_e = \gamma_h\left[\underbrace{2\cdot 11\,(B-1)}_{\text{rectángulo}}
          + \underbrace{\frac{(B-2)\cdot 11}{2}\cdot\frac{2(B-2)}{3}}_{\text{triángulo}}\right]
          $$

          con $\gamma_h = 2{,}4\cdot 9800 = 23\,520\ \text{N/m}^{3}$.
          Imponiendo $M_e = 1{,}8\,M_v$:

          $$
          2(B-1) + \frac{(B-2)^{2}}{3} = 38{,}64
          \;\Longrightarrow\;
          B^{2} + 2B - 117{,}9 = 0
          \;\Longrightarrow\;
          B = 9{,}9\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el dimensionado. Una pieza es falsa.
        piezas:
          - texto: >-
              El momento de vuelco lo forman el empuje del agua a un tercio de
              la altura y el del hielo en la superficie: 5553 kN·m por metro.
          - texto: >-
              El momento estabilizador es el del peso propio del trapecio
              respecto del pie de aguas abajo, y crece con la base.
          - texto: >-
              Imponiendo que sea 1,8 veces el de vuelco queda una ecuación de
              segundo grado en $B$, cuya raíz positiva es 9,9 m.
          - texto: >-
              Como no se considera subpresión, el resultado queda del lado de
              la seguridad.
            trampa: true
            mensaje: |
              Del lado **contrario**. La subpresión es el agua que se filtra
              bajo la presa y empuja hacia arriba, restando peso estabilizador:
              contarla exigiría una base **mayor**. Despreciarla es una
              simplificación del enunciado, no un margen de seguridad — y por
              eso la nota lo dice expresamente.

    resolucion: |
      **El momento de vuelco, con sus dos términos.**

      $$
      E_{\text{agua}} = \frac{\gamma h^{2}}{2} = 490\ \text{kN/m}
      \quad\text{a } 3{,}33\ \text{m}
      \qquad
      E_{\text{hielo}} = p\,e = 392\ \text{kN/m}
      \quad\text{a } 10\ \text{m}
      $$
      $$
      M_v = 1633 + 3920 = 5553\ \text{kN}\cdot\text{m/m}
      $$

      **El estabilizador**, partiendo el trapecio en rectángulo y triángulo y
      tomando momentos respecto del pie de aguas abajo, e imponiendo el
      coeficiente 1,8:

      $$
      B^{2} + 2B - 117{,}9 = 0
      \;\Longrightarrow\;
      \boxed{B = 9{,}9\ \text{m}}
      $$

      **El hielo es el protagonista y no lo parece.** Cinco centímetros de
      espesor suenan a detalle, pero 80 kg/cm² son casi 800 atmósferas: el
      hielo, al congelarse, se expande y aprieta contra la presa con una fuerza
      comparable a la de diez metros de agua. Y como actúa **en la superficie**,
      su brazo es tres veces mayor: aporta el **71 %** del momento de vuelco.

      Sin contar el hielo, la base saldría de $5{,}1\ \text{m}$; con él, 9,9.
      La presa es **casi el doble de gruesa por una capa de cinco centímetros
      de hielo**. Ese es el resultado que hay que llevarse: en una presa de
      montaña, el invierno dimensiona más que el embalse.
