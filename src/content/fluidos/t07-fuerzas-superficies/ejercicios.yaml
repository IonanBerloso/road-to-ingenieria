        derecha, un depósito más bajo con un metro ochenta de aceite de
        densidad relativa cero coma setenta y cinco y aire encima. La compuerta
        AB es vertical y separa los dos: A está en la superficie del aceite y B
        en el fondo común. El aire del depósito derecho se mide con un
        manómetro en U de líquido de densidad relativa tres, cuya rama abierta
        queda un metro y medio más alta que la conectada.</desc>

