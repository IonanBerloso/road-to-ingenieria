      <figcaption>

      El depósito está **cerrado**, así que la presión de la lámina no es la
      atmosférica y no se puede suponer: la da el manómetro. Ese es todo el
      trabajo del apartado, y por eso el dibujo dedica media figura al tubo en
      U y no a la compuerta.

      </figcaption>
      </figure>
    pide: El momento que hay que aplicar en O para mantener cerrada la compuerta.

    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito está **cerrado**. ¿Qué hay que averiguar antes de tocar
          la compuerta?
        opciones:
          - texto: >-
              Dónde está la superficie piezométrica, es decir a qué altura la
              presión valdría cero, porque el agua no llega hasta ahí
            correcta: true
            mensaje: |
              Exacto. Con el depósito cerrado, la presión en la lámina no es
              cero, así que la «superficie libre» que gobierna el prisma de
              presiones es una superficie **imaginaria**, y puede caer por
              encima o por debajo del agua real.
          - texto: >-
              Nada especial: la superficie del agua está en $O$, así que se
              calcula como siempre
            mensaje: |
              Eso valdría si el depósito estuviera abierto. Aquí el manómetro
              va a decir que la presión en el fondo es de solo 0,6 mca, cuando
              con 1,2 m de agua y superficie libre serían 1,2. Falta presión:
              el aire de arriba está en depresión.
          - texto: >-
              El peso de la compuerta, que es lo que equilibra el momento
            mensaje: |
              El enunciado no lo da, así que se desprecia. Lo que sí hay que
              averiguar es la distribución de presiones, y para eso hace falta
              leer el manómetro.

      - tipo: calcular
        titulo: La presión en el fondo
        pregunta: |
          ¿Qué presión hay en el fondo del depósito, en mca?
        respuesta:
          tipo: magnitud
          valor: '0.6 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.9 mca'
            mensaje: |
              Has contado solo 60 cm de agua en la rama conectada. La interfaz
              está $60+30 = 90\ \text{cm}$ por debajo del fondo: los 30 cm son
              el desnivel **entre las dos ramas**, no la profundidad total.
          - valor: '1.2 mca'
            mensaje: |
              Esa es la presión que habría si el depósito estuviera **abierto**
              y lleno hasta arriba. El manómetro dice otra cosa, y ese es el
              dato del problema.
        pista: |
          Recorre el manómetro desde la rama abierta: baja 30 cm por el líquido
          de $s = 5$ y sube 90 cm por el agua hasta el fondo.
        desarrollo: |
          $$
          0 + 5\cdot 0{,}30 - 1\cdot 0{,}90 = \frac{p_{\text{fondo}}}{\gamma}
          = 1{,}5 - 0{,}9 = 0{,}6\ \text{mca}
          $$

          Y como el depósito tiene $1{,}20\ \text{m}$ de agua, en la lámina
          superior —donde está $O$— la presión vale

          $$
          \frac{p_O}{\gamma} = 0{,}6 - 1{,}2 = -0{,}6\ \text{mca}
          $$

          El aire de arriba está en **depresión**.

      - tipo: reconocer
        pregunta: |
          La superficie piezométrica queda $0{,}6\ \text{m}$ por debajo de
          $O$, es decir justo a media altura de la compuerta. ¿Qué implica?
        opciones:
          - texto: >-
              Que la mitad de arriba está succionada y la de abajo empujada, en
              partes exactamente iguales: la resultante es **nula** y lo que
              queda es un par
            correcta: true
            mensaje: |
              Ese es el resultado bonito del ejercicio. El diagrama de
              presiones es antisimétrico respecto del punto medio, así que las
              dos mitades se cancelan en fuerza pero **no** en momento: sus
              brazos están al mismo lado.
          - texto: >-
              Que la compuerta no necesita ningún momento, porque las dos
              mitades se compensan
            mensaje: |
              Se compensan en **fuerza**, no en momento. La mitad superior tira
              hacia dentro y la inferior empuja hacia fuera: las dos hacen
              girar la compuerta en el mismo sentido, así que sus momentos se
              **suman**.
          - texto: >-
              Que la presión es nula en toda la compuerta
            mensaje: |
              Es nula solo en el punto medio. Por encima es negativa y por
              debajo positiva, llegando a $-0{,}6$ y $+0{,}6$ mca en los
              extremos.

      - tipo: calcular
        titulo: El momento
        pregunta: |
          ¿Qué momento hay que aplicar en $O$?
        respuesta:
          tipo: magnitud
          valor: '5.08 kn*m'
          tolerancia: 0.02
          formato: un momento, en kilonewton por metro
        distractores:
          - valor: '20.32 kn*m'
            mensaje: |
              Has supuesto superficie libre en $O$, es decir depósito abierto.
              Con la depresión que marca el manómetro, la mitad superior de la
              compuerta **succiona** en vez de empujar y el momento baja a la
              cuarta parte.
          - valor: '12.7 kn*m'
            mensaje: |
              Has usado $0{,}9$ mca en el fondo, que es el error de leer mal el
              manómetro. Con ese valor la superficie piezométrica caería a
              $0{,}3$ m bajo $O$ en vez de a $0{,}6$.
        pista: |
          Integra a lo largo de la compuerta: $M_O = b\,\gamma\sin 45°
          \int_0^L (s-s_0)\,s\,ds$, con $s_0$ la posición de la superficie
          piezométrica medida sobre el plano de la compuerta.
        desarrollo: |
          Longitud de la compuerta y posición de la superficie piezométrica
          sobre ella:

          $$
          L = \frac{1{,}20}{\sin 45°} = 1{,}697\ \text{m}
          \qquad
          s_0 = \frac{0{,}60}{\sin 45°} = 0{,}8485\ \text{m} = \frac{L}{2}
          $$
          $$
          M_O = b\,\gamma\sin 45°\left[\frac{L^{3}}{3} - s_0\frac{L^{2}}{2}\right]
          = 12\,473\left[1{,}629 - 1{,}222\right]
          $$
          $$
          M_O = 5080\ \text{N}\cdot\text{m} = 508\ \text{m}\cdot\text{daN}
          $$

          Y la resultante, con la misma integral sin el brazo:

          $$
          F = b\,\gamma\sin 45°\left[\frac{L^{2}}{2} - s_0 L\right]
          = 12\,473\,[1{,}44 - 1{,}44] = 0
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro da $0{,}6$ mca en el fondo, así que en la lámina
              superior la presión es $-0{,}6$: el depósito está en depresión.
          - texto: >-
              La superficie piezométrica cae 0,6 m bajo $O$, justo en el punto
              medio de la compuerta, así que el diagrama de presiones es
              antisimétrico.
          - texto: >-
              La resultante sale exactamente nula, y lo que hay que equilibrar
              es un par puro de $508\ \text{m}\cdot\text{daN}$.
          - texto: >-
              Como la resultante es nula, el momento no depende de qué punto se
              tome para calcularlo, y por eso da lo mismo hacerlo en $O$ o en
              $A$.
            trampa: true
            mensaje: |
              Esta pieza es **verdadera**, y ese es el truco: lo que la hace
              falsa aquí es que se presenta como una observación sin
              consecuencias cuando en realidad es la propiedad que define un
              par. Un sistema de resultante nula tiene el mismo momento
              respecto de **cualquier** punto — y por eso la respuesta no
              cambia si el enunciado hubiera pedido el momento en $A$.

    resolucion: |
      **Primero el manómetro, porque sin él no se sabe ni por dónde empieza el
      prisma de presiones.** Recorriendo desde la rama abierta:

      $$
      \frac{p_{\text{fondo}}}{\gamma} = 5\cdot 0{,}30 - 0{,}90 = 0{,}6\ \text{mca}
      $$

      Con $1{,}20\ \text{m}$ de agua encima, en $O$ la presión vale
      $-0{,}6\ \text{mca}$: **el depósito está cerrado y en depresión**.

      **La superficie piezométrica** —la altura a la que la presión sería
      cero— cae por tanto $0{,}60\ \text{m}$ por debajo de $O$, es decir
      exactamente a **media altura de la compuerta**.

      **Y ahí está el resultado que hace especial a este problema.** El
      diagrama de presiones es antisimétrico: la mitad de arriba succiona
      hasta $-0{,}6$ mca y la de abajo empuja hasta $+0{,}6$.

      $$
      F = b\gamma\sin 45°\left[\frac{L^{2}}{2}-s_0 L\right] = 0
      \qquad
      M_O = b\gamma\sin 45°\left[\frac{L^{3}}{3}-s_0\frac{L^{2}}{2}\right]
      = 5080\ \text{N}\cdot\text{m}
      $$

      **La resultante es exactamente cero y el momento no.** Suena paradójico y
      no lo es: las dos mitades tiran en sentidos opuestos —una hacia dentro,
      otra hacia fuera— pero sus brazos están a lados opuestos del punto medio,
      así que **sus momentos se suman en vez de cancelarse**. Lo que actúa
      sobre la compuerta es un **par puro**.

      Consecuencias prácticas, que es lo que un proyectista sacaría de aquí:

      - **La articulación en $O$ no soporta ninguna fuerza**: no hay resultante
        que transmitir.
      - **Pero la compuerta sí tiene que aguantar el par**, y con él la flexión
        que produce. Una compuerta puede estar «descargada» y romperse igual.
      - Y como la resultante es nula, **hablar del centro de presión no tiene
        sentido**: la fórmula $y_{cp} = y_G + I/(y_G A)$ daría infinito. Es el
        caso límite en el que ese concepto deja de servir y hay que integrar.

  # ── COLECCIÓN 2.24. Compuerta entre dos fluidos con los DOS lados
  #    presurizados: uno en depresión y el otro por encima de la atmósfera. Es
  #    el ejercicio de contabilidad de presiones del capítulo.
  - id: ejflu7-col224-la-compuerta-entre-agua-y-aceite
    titulo: Una compuerta con agua a un lado y aceite presurizado al otro
    fuente: >-
      Ejercicio 2.24 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La compuerta $AB$ de la figura tiene $1{,}20\ \text{m}$ de anchura normal
      al dibujo y está articulada en $A$. Se pide:

      a) Fuerza horizontal que debe aplicarse en $B$, en módulo y sentido, para
      que la compuerta se mantenga en equilibrio.

