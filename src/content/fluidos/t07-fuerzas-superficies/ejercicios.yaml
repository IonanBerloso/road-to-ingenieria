    pide: La altura máxima de cierre, la fuerza sobre el tope y las reacciones en O.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua empuja con fuerza sobre la parte cilíndrica. ¿Cuánto momento
          produce eso respecto de $O$?
        opciones:
          - texto: >-
              Ninguno: la superficie es cilíndrica con centro en $O$, así que
              todas las presiones son radiales y su resultante pasa por el eje
            correcta: true
            mensaje: |
              Y ese es el diseño. La parte cilíndrica está ahí precisamente
              para que el empuje del embalse **no** intervenga en el giro: lo
              que decide si la compuerta abre es solo el peso contra la
              subpresión del recinto $C$.
          - texto: >-
              Mucho, y es lo que abre la compuerta
            mensaje: |
              Sería así con una compuerta plana. Con una cilíndrica centrada en
              el eje, la resultante pasa por $O$ y su momento es cero — es el
              mismo resultado del ejercicio 2.29.
          - texto: >-
              Depende de la altura $h$: con poca agua sí y con mucha no
            mensaje: |
              El momento es nulo **siempre**, independientemente de $h$: la
              propiedad es geométrica, no depende de cuánta superficie esté
              mojada.

      - tipo: calcular
        titulo: La altura máxima de cierre
        pregunta: |
          ¿Hasta qué altura $h$ permanece cerrada la compuerta?
        respuesta:
          tipo: magnitud
          valor: '2.133 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.067 m'
            mensaje: |
              Has usado $3\ \text{m}$ como brazo de la subpresión. La
              subpresión está repartida uniformemente sobre la solera, así que
              su resultante actúa en el punto medio, a $1{,}5\ \text{m}$ de
              $O$.
          - valor: '0.2177 m'
            mensaje: |
              Has tomado los $4000\ \text{kg}$ como newtons. Son kilogramos de
              masa: el peso son $4000\cdot 9{,}8 = 39\,200\ \text{N}$ por metro
              de compuerta.
        pista: |
          El único momento que abre es el de la subpresión bajo la solera; el
          único que cierra, el peso. La subpresión es uniforme y vale
          $\gamma h$.
        desarrollo: |
          La solera está a profundidad $h$, así que la subpresión es uniforme y
          vale $\gamma h$; su resultante actúa en el punto medio de $OA$:

          $$
          U = \gamma\,h\cdot 3
          \qquad
          M_U = \gamma\,h\cdot 3\cdot 1{,}5 = 44\,100\,h
          $$
          $$
          M_W = 4000\cdot 9{,}8\cdot 2{,}4 = 94\,080\ \text{N}\cdot\text{m}
          $$
          $$
          44\,100\,h = 94\,080
          \;\Longrightarrow\;
          h = 2{,}133\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza sobre el tope
        pregunta: |
          Con $h = 1{,}5\ \text{m}$, ¿qué fuerza hace la compuerta sobre el
          tope $A$?
        respuesta:
          tipo: magnitud
          valor: '9310 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '31360 n'
            mensaje: |
              Te has dejado la subpresión. Con $h = 1{,}5$ hay
              $44\,100\ \text{N}$ empujando la solera hacia arriba, y su
              momento descuenta dos tercios del que produce el peso.
          - valor: '11638 n'
            mensaje: |
              Has dividido entre $2{,}4$, que es el brazo del **peso**. El tope
              está en $A$, a $3\ \text{m}$ de la articulación.
        pista: |
          Momentos respecto de $O$: peso, subpresión y reacción del tope a
          $3\ \text{m}$.
        desarrollo: |
          $$
          U = 9800\cdot 1{,}5\cdot 3 = 44\,100\ \text{N}
          \qquad
          M_U = 44\,100\cdot 1{,}5 = 66\,150\ \text{N}\cdot\text{m}
          $$
          $$
          R_A\cdot 3 = M_W - M_U = 94\,080 - 66\,150 = 27\,930
          \;\Longrightarrow\;
          R_A = 9310\ \text{N}
          $$

          Como el peso gana, la compuerta **apoya** sobre el tope y el tope
          empuja hacia arriba.

      - tipo: calcular
        titulo: La reacción horizontal en O
        pregunta: |
          ¿Cuál es la componente horizontal de la reacción en $O$?
        respuesta:
          tipo: magnitud
          valor: '11025 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '22050 n'
            mensaje: |
              Te falta dividir entre dos: la presión sobre la proyección
              vertical va de cero en la lámina a $\gamma h$ en la solera, así
              que la media es $\gamma h/2$.
          - valor: '44100 n'
            mensaje: |
              Esa es la subpresión bajo la solera, que es **vertical**. La
              componente horizontal se calcula sobre la proyección vertical de
              la parte cilíndrica mojada, que mide $1{,}5\ \text{m}$.
        pista: |
          La única fuerza horizontal es la del agua sobre el cilindro, y se
          calcula sobre su proyección vertical de $1{,}5\ \text{m}$.
        desarrollo: |
          $$
          F_H = \gamma\,\frac{h}{2}\,h = 9800\cdot 0{,}75\cdot 1{,}5
          = 11\,025\ \text{N}
          $$

          No hay ninguna otra fuerza horizontal, así que la articulación tiene
          que dar esos $11\,025\ \text{N}$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La parte cilíndrica está centrada en $O$, así que el empuje del
              embalse no produce momento y no interviene en la apertura.
          - texto: >-
              Lo que abre es la subpresión del recinto $C$ bajo la solera, y lo
              que cierra es el peso: igualando momentos sale
              $h_{\max} = 2{,}133$ m.
          - texto: >-
              Con $h = 1{,}5$ el peso todavía gana, la compuerta apoya en el
              tope con $9310$ N y la articulación aguanta $11.025$ N
              horizontales.
          - texto: >-
              Como el empuje del embalse no da momento, tampoco carga la
              articulación.
            trampa: true
            mensaje: |
              Da momento nulo, pero **fuerza no**. Los $11.025\ \text{N}$
              horizontales que aguanta el eje son precisamente ese empuje: pasa
              por $O$, así que no hace girar nada, pero hay que sujetarlo.
              Momento cero y fuerza cero son cosas distintas.

    resolucion: |
      **La clave del diseño está en la parte cilíndrica.** Al estar centrada en
      $O$, todas las presiones del embalse son radiales, su resultante pasa por
      el eje y **su momento es nulo**. Es decir: el embalse empuja con toda su
      fuerza y no contribuye nada a abrir la compuerta.

      Lo que decide la apertura son solo dos cosas: el **peso**, que cierra, y
      la **subpresión** del recinto $C$, que abre.

      **a) La altura máxima.** La solera está a profundidad $h$, así que la
      subpresión es uniforme y su resultante actúa en el punto medio:

      $$
      \underbrace{\gamma h\cdot 3\cdot 1{,}5}_{\text{abre}}
      = \underbrace{4000\cdot 9{,}8\cdot 2{,}4}_{\text{cierra}}
      \;\Longrightarrow\;
      h_{\max} = 2{,}133\ \text{m}
      $$

      **b) El tope.** Con $h = 1{,}5$, el peso gana por
      $94\,080 - 66\,150 = 27\,930\ \text{N}\cdot\text{m}$, que el tope
      equilibra a $3\ \text{m}$:

      $$
      R_A = \frac{27\,930}{3} = 9310\ \text{N}
      $$

      **c) La articulación.** Horizontalmente solo actúa el agua sobre el
      cilindro, $F_H = 11\,025\ \text{N}$. Verticalmente hay que sumar la
      subpresión hacia arriba, el peso y el tope hacia abajo, y la componente
      vertical del agua sobre el arco mojado —$1914\ \text{N}$—, y queda

      $$
      R_{Oy} = 12\,296\ \text{N}
      $$

      **Por qué el recinto C es un mecanismo y no un accidente.** El canal $B$
      llena $C$ con el agua del propio embalse, así que la subpresión sube
      **con el nivel**. Mientras el embalse está bajo, el peso gana y la
      compuerta permanece cerrada apoyada en el tope; cuando el nivel llega a
      2,13 m, la subpresión iguala al peso y la compuerta se abre sola. Es un
      aliviadero automático sin ningún elemento móvil, y toda su regulación
      está en dos números: dónde se pone el centro de gravedad y cuánto mide la
      solera.

      **Y el aviso que deja la trampa**: que el empuje del embalse no dé
      momento no significa que no cargue nada. Son $11\ \text{kN}$ por metro de
      compuerta que la articulación tiene que aguantar. Momento nulo y fuerza
      nula son cosas distintas, y confundirlas dimensiona mal el eje.
  - id: ejflu07-col222-la-compuerta-acodada-que-se-equilibra-sola
    titulo: La compuerta acodada que se equilibra sola
    fuente: Ejercicio 2.22 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene la compuerta de la figura adjunta, que es capaz de girar sobre
      O. Tiene un peso de 15 kg por m de longitud normal al dibujo y su centro
      de gravedad está situado a 45 cm de su cara izquierda y 60 cm de la cara
      inferior. Se pide:

      a) Altura $h$ en la posición de equilibrio.

      b) Calcular las reacciones en la articulación para dicha altura $h$, en kN.

      Dato: longitud normal al dibujo = 1 m.

      <figure class="figura-examen">
