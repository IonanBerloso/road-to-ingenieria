      En la compuerta AO de la figura, en situación de equilibrio, se pide:

      a) Resultante y línea de acción de las fuerzas horizontales que ejerce el
      fluido sobre la compuerta, dibujando los prismas de presiones.

      b) Ídem de las fuerzas verticales.

      c) Momento respecto al eje O.

      Datos: anchura normal al plano del dibujo = 2 m. Centro de gravedad del
      semicírculo $= 4R/(3\pi)$.

