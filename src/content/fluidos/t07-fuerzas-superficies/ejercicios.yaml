        <path d="M370 168 L428 168 L428 232 Q428 240 436 240 L452 240 Q460 240 460 232 L460 140"
              fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M428 214 L428 232 Q428 236 432 236 L456 236 Q460 236 460 232 L460 169"
