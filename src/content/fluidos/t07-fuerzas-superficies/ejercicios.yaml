        </defs>
      </svg>
      <figcaption>

      El agua toca la compuerta por **dos caras y en dos sentidos**: empuja el
      brazo vertical hacia la derecha y el horizontal hacia arriba. Los dos
      empujes giran la compuerta en sentidos contrarios respecto de O, y de ahí
      sale la altura de equilibrio.

      </figcaption>
      </figure>
    pide: La altura de equilibrio y las dos componentes de la reacción en la articulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          La compuerta gira libremente sobre O y aun así se queda quieta a una
          altura concreta. ¿Qué la equilibra?
        opciones:
          - texto: |
              Los dos empujes del agua: el horizontal sobre el brazo vertical y
              el vertical bajo el brazo horizontal giran en sentidos contrarios
              respecto de O
            correcta: true
            mensaje: |
              Ese es el mecanismo, y es lo que hace bonito el problema. El agua
              no aparece con una sola fuerza: toca dos caras de la compuerta en
              direcciones perpendiculares, y sus momentos respecto del codo se
              oponen. Uno crece con $h^{3}$ y el otro con $h$, así que solo hay
              una altura donde se igualan.
          - texto: |
              El peso propio, que es el único que puede oponerse al empuje del
              agua
            mensaje: |
              El peso está y hay que meterlo, pero no es quien equilibra: son
              147 N contra empujes de 33 y 38 kN. Su momento vale 66 N·m frente
              a 28 500, un 0,2 %. Mueve la respuesta de 2,598 a 2,595 m — la
              tercera cifra— y nada más.
          - texto: |
              La reacción de la articulación, que hace el momento que haga falta
            mensaje: |
              Una articulación no puede dar momento: ese es justamente su
              sentido. Da fuerza en las dos direcciones y deja girar libremente,
              y por eso al tomar momentos **en O** la reacción desaparece de la
              ecuación. Es lo que permite encontrar $h$ sin conocerla.
          - texto: |
              Nada: la compuerta está en equilibrio para cualquier altura,
              porque el agua empuja igual por los dos lados
            mensaje: |
              No empuja igual: el empuje sobre el brazo vertical crece con el
              cuadrado de la altura y el de debajo del horizontal, linealmente.
              Por eso hay **una** altura de equilibrio y no infinitas.

      - tipo: calcular
        titulo: La altura de equilibrio
        pregunta: |
          Tomando momentos en O e igualando, sale
          $\gamma h^{3}/6 + P\cdot 0{,}45 = \gamma\,h\,L^{2}/2$ con
          $L = 1{,}5$ m y $P = 147$ N. ¿Cuánto vale $h$, en metros?
        respuesta:
          tipo: magnitud
          valor: '2.595 m'
          tolerancia: 0.01
          formato: la altura en metros
        distractores:
          - valor: '1.5 m'
            mensaje: |
              1,5 m es la longitud del brazo horizontal, no la altura del agua.
              Que aparezca en la ecuación no la convierte en la incógnita: lo
              que se busca es hasta dónde sube el agua.
          - valor: '1.061 m'
            mensaje: |
              Parece que has igualado las **fuerzas** en vez de los momentos:
              $\gamma h^{2}/2 = \gamma h L$ da $h = 2L = 3$, o alguna variante.
              Aquí no se equilibran fuerzas —para eso está la articulación— sino
              momentos, y cada fuerza lleva su brazo.
          - valor: '3.674 m'
            mensaje: |
              Te has dejado el factor 1/2 o el 1/6 en algún sitio. Comprueba los
              brazos: el empuje horizontal actúa a $h/3$ del codo y el vertical,
              a $L/2$.
        pista: |
          Despreciando el peso queda $h^{2} = 3L^{2}/... $ — mejor: sustituye y
          resuelve $h^{3} - 6{,}75\,h + 0{,}0405 = 0$.
        desarrollo: |
          Con $\gamma = 9800$ N/m³, $L = 1{,}5$ m y $P = 15\cdot 9{,}8 = 147$ N:

          $$
          \frac{9800\,h^{3}}{6} + 147\cdot 0{,}45 = 9800\,h\,\frac{1{,}5^{2}}{2}
          $$

          $$
          h^{3} - 6{,}75\,h + 0{,}0405 = 0
          \;\Longrightarrow\;
          h = 2{,}595\ \text{m}
          $$

          Y conviene ver qué pinta ahí el peso: **casi nada**. Sin él la
          ecuación sería $h^{2} = 6{,}75$, o sea $h = 2{,}598$ m. El peso propio
          mueve la tercera cifra decimal, y aun así hay que meterlo porque el
          enunciado lo da y porque en el apartado b) sí se nota.

      - tipo: calcular
        titulo: La reacción horizontal
        pregunta: |
          ¿Cuánto vale la componente horizontal de la reacción en O, en kN?
        respuesta:
          tipo: magnitud
          valor: '33 kN'
          tolerancia: 0.01
          formato: la reacción horizontal en kN
        distractores:
          - valor: '11.03 kN'
            mensaje: |
              Has puesto la longitud del brazo donde va la altura del agua:
              $\gamma L^{2}/2$ con $L = 1{,}5$ m. Los dos son metros y los dos
              están en el enunciado, pero quien manda la presión es el calado.
          - valor: '38 kN'
            mensaje: |
              Esa es la **vertical**. Las dos rondan los mismos treinta y tantos
              kilonewton, así que aquí no vale fiarse del orden de magnitud: hay
              que mirar qué área y qué presión lleva cada una.
          - valor: '66 kN'
            mensaje: |
              Te has dejado el factor 1/2: el diagrama de presiones sobre una
              pared vertical es **triangular**, no rectangular, así que el
              empuje es $\gamma h^{2}/2$, no $\gamma h^{2}$.
        pista: |
          Es el empuje sobre el brazo vertical: $\gamma h^{2}/2$ por 1 m de
          longitud.
        desarrollo: |
          $$
          R_x = \frac{\gamma h^{2}}{2} = \frac{9800\cdot 2{,}595^{2}}{2}
              = 33{,}0\ \text{kN}
          $$

          La articulación tiene que aguantar exactamente eso, porque no hay
          nadie más que se oponga al empuje horizontal.

      - tipo: calcular
        titulo: La reacción vertical
        pregunta: |
          Y la componente vertical, también en kN. No te dejes el peso.
        respuesta:
          tipo: magnitud
          valor: '38 kN'
          tolerancia: 0.01
          formato: la reacción vertical en kN
        distractores:
          - valor: '19.07 kN'
            mensaje: |
              Has usado un diagrama **triangular** también aquí,
              $gamma h L/2$. Bajo el brazo horizontal no lo es: todos sus
              puntos están a la misma profundidad, así que la presión es
              uniforme y el empuje vale $gamma h L$ entero.
          - valor: '0.147 kN'
            mensaje: |
              Eso es solo el peso. La articulación aguanta sobre todo el empuje
              del agua; el peso es una corrección del 0,4 %.
        pista: |
          Presión uniforme $\gamma h$ sobre $1{,}5 \times 1$ m², hacia arriba,
          menos el peso.
        desarrollo: |
          Todos los puntos del brazo horizontal están a la misma profundidad, así
          que la presión bajo él es **uniforme**:

          $$
          E_v = \gamma h L = 9800\cdot 2{,}595\cdot 1{,}5 = 38{,}15\ \text{kN}
          $$

          $$
          R_y = E_v - P = 38{,}15 - 0{,}147 = 38{,}0\ \text{kN}
          $$

          Aquí el peso sí cambia la cifra que se publica, aunque solo sea un
          0,4 %: 38,15 redondea a 38,2 y 38,00 a 38.

      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: |
              Sobre el brazo vertical la presión crece con la profundidad: el
              diagrama es triangular, el empuje vale $\gamma h^{2}/2$ y actúa a
              $h/3$ por encima del codo.
          - texto: |
              Bajo el brazo horizontal todos los puntos están a la misma
              profundidad $h$: la presión es uniforme, el empuje vale
              $\gamma h L$ y actúa en el centro, a $L/2$ del codo.
          - texto: |
              Tomando momentos **en O** la reacción de la articulación
              desaparece —una articulación no da momento— y queda una ecuación
              con $h$ como única incógnita.
          - texto: |
              Esa ecuación es cúbica porque un momento va con $h^{3}$ y el otro
              con $h$: por eso hay una sola altura de equilibrio y no un rango.
          - texto: |
              Y como el empuje horizontal crece más deprisa que el vertical, por
              encima de la altura de equilibrio la compuerta se cierra sola:
              cuanto más sube el agua, más firme queda.
            trampa: true
            mensaje: |
              La primera mitad es cierta —$h^{3}$ contra $h$— y la conclusión va
              al revés. Si el agua sube por encima de 2,595 m, el momento que
              crece con el cubo se impone al que crece linealmente, y ese es
              precisamente el que **abre** la compuerta girándola. El equilibrio
              es inestable por arriba: pasada esa altura, la compuerta se va. Y
              eso no es un defecto sino el diseño — así es como funciona una
              compuerta automática de vertido.
    resolucion: |
      **Una compuerta que el agua sujeta y el agua suelta.**

      Lo primero es ver que **el agua toca la compuerta por dos caras**, y en
      direcciones perpendiculares:

      - sobre el **brazo vertical**, presión creciente con la profundidad:
        diagrama triangular, empuje $\gamma h^{2}/2$ aplicado a $h/3$ sobre el
        codo;
      - bajo el **brazo horizontal**, todos los puntos a la misma profundidad
        $h$: presión uniforme, empuje $\gamma h L$ aplicado en el centro, a
        $L/2$.

      Los dos momentos respecto de O tienen sentidos contrarios.

      **a) La altura.** Momentos en O —donde la reacción de la articulación no
      aparece, porque una articulación no da momento—:

      $$
      \underbrace{\frac{\gamma h^{3}}{6}}_{\text{horizontal}}
      + \underbrace{P\cdot 0{,}45}_{\text{peso}}
      = \underbrace{\gamma\,h\,\frac{L^{2}}{2}}_{\text{vertical}}
      $$

      $$
      h^{3} - 6{,}75\,h + 0{,}0405 = 0
      \;\Longrightarrow\;
      \boxed{h = 2{,}595\ \text{m}}
      $$

      **b) Las reacciones.**

      $$
      R_x = \frac{\gamma h^{2}}{2} = 33{,}0\ \text{kN}
      \qquad
      R_y = \gamma h L - P = 38{,}15 - 0{,}15 = 38{,}0\ \text{kN}
      $$

      **Las dos cosas que hay que llevarse.**

      La primera es de método: **tomar momentos en la articulación**. La
      reacción es desconocida en módulo y dirección, y sin embargo no estorba,
      porque su brazo es cero. Es la razón de que se pueda encontrar $h$ antes
      que las reacciones y no al revés.

      La segunda es física, y es la que convierte el problema en un aparato:
      un momento crece con $h^{3}$ y el otro con $h$. Eso significa que
      **el equilibrio es inestable**. Por debajo de 2,595 m gana el empuje
      vertical y la compuerta se aprieta contra su asiento; por encima gana el
      horizontal y la compuerta se abre. No es un defecto de diseño: es el
      diseño. Así funciona una compuerta automática de vertido, que se abre
      sola cuando el nivel pasa de su consigna y no necesita ni motor ni
      vigilante.

      Y una advertencia sobre el peso propio. Aporta un 0,2 % del momento y un
      0,4 % de la reacción vertical, así que da la tentación de tirarlo. No se
      tira, por dos motivos: el enunciado lo da —y un dato que se da hay que
      usarlo o justificar por qué no—, y en el apartado b) es lo que separa
      38,15 de los 38 que se publican.
  - id: ejflu07-col244-la-valvula-de-cono-y-el-agua-que-la-tapa
    titulo: La válvula de cono, y el agua que solo cuenta a medias
    fuente: Ejercicio 2.44 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Calcular el valor $H$ para el cual esta válvula de cono empezará a
      permitir la fuga.

      Datos: $P = 6700$ N; $W_{v} = 2225$ N (peso de la válvula); $h = 1{,}8$ m; $l = 0{,}9$ m;
      $d = 1{,}5$ m.

      Nota: volumen del cono $= \dfrac{1}{3}\left(\pi\dfrac{d^{2}}{4}h\right)$.

      <figure class="figura-examen">
      <svg viewBox="-10 12 400 250" role="img" width="430" height="269"
           aria-labelledby="f244t f244d">
        <title id="f244t">La válvula de cono que tapa el fondo del depósito</title>
        <desc id="f244d">Un depósito con agua cuyo fondo tiene un orificio
        circular. El orificio lo tapa un cono con la punta hacia arriba: la
        mitad superior del cono asoma dentro del depósito y la mitad inferior
        queda por debajo del fondo, al aire. El cono mide un metro ochenta de
        altura total y un metro y medio de diámetro en su base, y el fondo del
        depósito lo corta justo a la mitad, a noventa centímetros de la base,
        donde su diámetro es de setenta y cinco centímetros. De la punta del
        cono sale un cable que pasa por dos poleas y sostiene un contrapeso P
        que tira de la válvula hacia arriba. La altura H se mide desde el fondo
        del depósito hasta la lámina libre. La figura está dibujada a escala
        para el valor de apertura, H igual a un metro con treinta y tres.</desc>

        <path d="M110 74 L110 176 L228 176 L228 74" fill="none"
