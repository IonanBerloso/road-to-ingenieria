        compuerta hay aire; a la derecha y por encima hay agua, y la franja de
        medio metro que queda por debajo de la solera de la compuerta también
        está llena de agua, de modo que el agua empuja la compuerta hacia abajo
        por el arco y hacia arriba por la solera. La altura Z se mide desde el
