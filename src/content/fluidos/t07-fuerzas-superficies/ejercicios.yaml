      se igualan.

      </figcaption>
      </figure>
    pide: La cota del agua para la que la compuerta queda en equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La incógnita es $h$ y aparece en tres sitios a la vez. ¿En cuáles?
        opciones:
          - texto: >-
              En la longitud mojada, en la profundidad del centro de gravedad y
              en el brazo del empuje: por eso el momento va con $h^{3}$
            correcta: true
            mensaje: |
              Exacto, y es lo que convierte el problema en una ecuación cúbica.
              Cada $h$ que aparece multiplica: la superficie mojada crece, la
              presión media crece y el brazo crece.
          - texto: >-
              Solo en la profundidad del centro de gravedad; la longitud mojada
              es siempre 4 m
            mensaje: |
              La compuerta mide 4 m, pero solo está mojada hasta donde llega el
              agua. Si $h$ es menor que $4\sin45° = 2{,}83$ m —y lo es
              mucho— la parte superior está seca.
          - texto: >-
              En la longitud mojada y en el brazo, pero no en la presión, que
              la fija el peso
            mensaje: |
              El peso no fija ninguna presión: es la otra mitad del equilibrio.
              La presión media sobre la parte mojada es $\gamma h/2$, y depende
              de $h$ como todo lo demás.

      - tipo: calcular
        titulo: El momento del peso
        pregunta: |
          ¿Qué momento produce el peso de la compuerta respecto de $O$?
        respuesta:
          tipo: magnitud
          valor: '2828 n*m'
          tolerancia: 0.02
          formato: un momento, en newton por metro
        distractores:
          - valor: '4000 n*m'
            mensaje: |
              Has usado los 2 m como brazo. El peso es **vertical** y su brazo
              es la distancia **horizontal** al eje: $2\cos 45° = 1{,}414$ m.
          - valor: '1414 n*m'
            mensaje: |
              Parece que has proyectado el peso en vez del brazo, o has
              dividido entre dos de más. El momento es la fuerza entera por la
              proyección horizontal de la distancia.
        pista: |
          El peso es vertical; el brazo es la proyección horizontal de los 2 m.
        desarrollo: |
          $$
          M_W = W\cdot 2\cos 45° = 2000\cdot 1{,}414 = 2828\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La cota de equilibrio
        pregunta: |
          ¿Para qué cota $h$ está la compuerta en equilibrio?
        respuesta:
          tipo: magnitud
          valor: '0.953 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.2 m'
            mensaje: |
              Te falta el $\sin 45°$ en la longitud mojada. La compuerta está
              inclinada: los $h$ metros de agua mojan $h/\sin 45° = 1{,}414\,h$
              metros de compuerta.
          - valor: '1.07 m'
            mensaje: |
              Has usado los 2 m como brazo del peso en vez de su proyección
              horizontal. El error es pequeño en el momento pero se nota en la
              raíz cúbica.
        pista: |
          El empuje es $\gamma\,(h/2)\,(h/\sin45°)$ y actúa a un tercio de la
          longitud mojada desde $O$. Iguala momentos y despeja de un cúbico.
        desarrollo: |
          Longitud mojada $L_m = h/\sin 45° = 1{,}414\,h$, empuje

          $$
          F = \gamma\,\frac{h}{2}\,L_m = 9800\cdot\frac{h}{2}\cdot 1{,}414\,h
          = 6930\,h^{2}
          $$

          aplicado a $L_m/3 = 0{,}471\,h$ de $O$. El momento del agua:

          $$
          M_F = 6930\,h^{2}\cdot 0{,}471\,h = 3267\,h^{3}
          $$
          $$
          3267\,h^{3} = 2828
          \;\Longrightarrow\;
          h^{3} = 0{,}8658
          \;\Longrightarrow\;
          h = 0{,}953\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El peso da un momento constante de $2828\ \text{N}\cdot\text{m}$,
              con el brazo igual a la proyección horizontal de los 2 m.
          - texto: >-
              El empuje del agua crece con $h^{2}$ y su brazo con $h$, así que
              su momento va con $h^{3}$.
          - texto: >-
              Igualando los dos momentos sale $h = 0{,}953$ m, muy por debajo
              de la altura total de la compuerta.
          - texto: >-
              Como el momento del agua crece con el cubo, si el agua sube un
              10 % la compuerta seguirá cerrada con margen.
            trampa: true
            mensaje: |
              Al revés: que crezca con el cubo hace el equilibrio **muy
              inestable**. Un 10 % más de cota da un 33 % más de momento, y la
              compuerta se abre de golpe. Es justamente lo que se busca en un
              aliviadero automático: que actúe con un cambio de nivel pequeño.

    resolucion: |
      **El momento del peso es constante**, y es el único término que no
      depende de $h$:

      $$
      M_W = 2000\cdot 2\cos 45° = 2828\ \text{N}\cdot\text{m}
      $$

      **El del agua va con el cubo**, porque $h$ entra tres veces: en la
      longitud mojada, en la presión media y en el brazo.

      $$
      M_F = \underbrace{\gamma\frac{h}{2}}_{\text{presión media}}
      \cdot\underbrace{\frac{h}{\sin 45°}}_{\text{longitud mojada}}
      \cdot\underbrace{\frac{h}{3\sin 45°}}_{\text{brazo}}
      = 3267\,h^{3}
      $$

      **Igualando**, $h = 0{,}953\ \text{m}$.

      **El prisma de presiones del apartado b)** es un triángulo sobre la parte
      mojada de la compuerta: cero en la lámina de agua y máximo en $O$, con

      $$
      p_{\max} = \gamma h = 9800\cdot 0{,}953 = 9{,}34\ \text{kPa}
      $$

      y la parte de compuerta por encima de la lámina —$4 - 1{,}35 =
      2{,}65\ \text{m}$— completamente seca.

      **Y la lectura de diseño.** Que el momento vaya con $h^{3}$ y el
      resistente sea constante hace que el equilibrio sea **muy sensible**: con
      un centímetro más de agua el momento sube un 3 %, y la compuerta se abre
      sin vuelta atrás. Es un mecanismo de disparo, no un cierre estable, y es
      exactamente lo que se pide de un aliviadero automático como el del
      ejercicio siguiente.

  # ── COLECCIÓN 2.26. El aliviadero automático: dos compuertas rígidamente
  #    unidas en ángulo recto, cuatro momentos y un contrapeso. Es el problema
  #    más completo del capítulo.
  - id: ejflu7-col226-el-aliviadero-automatico
    titulo: El aliviadero automático, con sus cuatro momentos y su contrapeso
    fuente: >-
      Ejercicio 2.26 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La figura representa un aliviadero automático de presa $AOB$. El ángulo
      $AOB$ es rígido. $W$ es un contrapeso cuyo centro de gravedad se
      encuentra a una distancia de $1{,}65\ \text{m}$ de $O$. El aliviadero
      está en equilibrio cuando el nivel del agua se encuentra como en la
      figura. Se pide:

      a) Fuerza debida a la presión hidrostática del agua sobre $OA$.

      b) Línea de acción de la fuerza sobre $OA$, delimitada por la distancia
      a $O$.

      c) Fuerza sobre $OB$.

      d) Línea de acción de la fuerza sobre $OB$, delimitada por la distancia
      a $O$.

      e) Magnitud del contrapeso.

      Datos: $OA = 1{,}5\ \text{m}$; $OB = 1{,}8\ \text{m}$; masa de la hoja
      $OA = 3.000\ \text{kg}$; masa de la hoja $OB = 3.600\ \text{kg}$;
      dimensión normal al dibujo $= 4\ \text{m}$.

      <figure class="figura-examen">
      <svg viewBox="44 52 372 196" role="img" width="440" height="232"
           aria-labelledby="f226t f226d">
        <title id="f226t">El aliviadero automático AOB, con sus dos hojas rígidas y el contrapeso</title>
        <desc id="f226d">Un aliviadero de presa formado por dos hojas rígidas
        unidas en la articulación O, que está en la coronación de un machón. La
        hoja OA, de metro y medio, sube hacia la derecha formando treinta
        grados con la vertical, y su extremo A queda justo en la superficie
        libre del agua. La hoja OB, de un metro ochenta, forma ángulo recto con
        OA y baja hacia la derecha, hacia el lado seco. El contrapeso W está
        sobre OB, a un metro sesenta y cinco de O. El agua embalsa a la
        izquierda.</desc>

        <path d="M50 72 L295 72 L250 150 L250 236 L50 236 Z" fill="var(--live)" fill-opacity=".12"/>
        <line x1="50" y1="72" x2="295" y2="72" stroke="var(--live)" stroke-width="1.6"/>
        <text x="56" y="66" font-size="10" fill="var(--live)">superficie libre</text>
        <text x="128" y="126" font-size="11" fill="var(--live)">Agua</text>

        <rect x="250" y="150" width="18" height="86" fill="var(--ink)" fill-opacity=".12"
              stroke="var(--ink)" stroke-width="1.4"/>
        <g stroke="var(--faint)" stroke-width="1" opacity=".8">
          <path d="M250 166 L268 158 M250 186 L268 178 M250 206 L268 198 M250 226 L268 218"/>
        </g>
        <line x1="44" y1="236" x2="410" y2="236" stroke="var(--ink)" stroke-width="2"/>

        <line x1="250" y1="150" x2="295" y2="72" stroke="var(--ink)" stroke-width="5"
              stroke-linecap="round" opacity=".85"/>
        <line x1="250" y1="150" x2="343" y2="204" stroke="var(--ink)" stroke-width="5"
              stroke-linecap="round" opacity=".85"/>

        <line x1="250" y1="150" x2="250" y2="104" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M250 112 A 38 38 0 0 1 269 117" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="256" y="102" font-size="10" fill="var(--faint)">30°</text>
        <path d="M257 138 L269 145 L262 157" fill="none" stroke="var(--faint)" stroke-width="1.2"/>

        <circle cx="250" cy="150" r="5" fill="var(--ink)"/>
        <text x="230" y="146" font-size="11" fill="var(--ink)">O</text>
        <text x="302" y="66" font-size="11" fill="var(--ink)">A</text>
        <text x="354" y="218" font-size="11" fill="var(--ink)">B</text>

        <text x="300" y="112" font-size="10" fill="var(--faint)">1,5 m</text>
        <text x="310" y="168" font-size="10" fill="var(--faint)">1,8 m</text>

        <circle cx="336" cy="200" r="6.5" fill="var(--alt)"/>
        <text x="348" y="196" font-size="11" fill="var(--alt)">W</text>
        <text x="282" y="230" font-size="10" fill="var(--alt)">W está a 1,65 m de O</text>

      </svg>
      <figcaption>

      Las dos hojas son **una sola pieza rígida**, así que el contrapeso no
      equilibra a una de ellas: equilibra la suma de los cuatro momentos
      respecto de O —los dos empujes del agua y los dos pesos propios—. Y por
      eso el aliviadero se abre solo cuando el agua sube.

      </figcaption>
      </figure>
    pide: Las dos fuerzas, sus líneas de acción y la magnitud del contrapeso.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué las fuerzas sobre $OA$ y sobre $OB$ hacen girar el conjunto
          en sentidos **opuestos**?
        opciones:
          - texto: >-
              Porque están a lados opuestos de $O$: el agua empuja $OA$ hacia
              arriba-derecha y $OB$ hacia arriba-derecha también, pero sus
              brazos respecto de $O$ tienen signos contrarios
            correcta: true
            mensaje: |
              Eso es. $A$ está por encima de $O$ y $B$ por debajo, así que la
              misma clase de empuje produce momentos de signo contrario. Es el
              principio del aliviadero: las dos hojas se compensan en parte y
              basta un contrapeso pequeño.
          - texto: >-
              Porque una está mojada y la otra no
            mensaje: |
              Las dos están mojadas: $OA$ desde la superficie hasta $O$ y $OB$
              entera, más profunda todavía. De hecho la fuerza sobre $OB$ es
              más de tres veces la de $OA$.
          - texto: >-
              Porque el agua empuja $OA$ hacia dentro y $OB$ hacia fuera
            mensaje: |
              El agua siempre empuja hacia fuera, perpendicularmente a cada
              superficie. Lo que cambia de signo no es el sentido del empuje
              sino la posición del punto de aplicación respecto de $O$.

      - tipo: calcular
        titulo: La fuerza sobre OA
        pregunta: |
          ¿Qué fuerza hidrostática recibe la hoja $OA$?
        respuesta:
          tipo: magnitud
          valor: '38.19 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '44.1 kn'
            mensaje: |
              Has usado $1{,}5\ \text{m}$ como profundidad de $O$. La hoja está
              inclinada $30°$ respecto de la vertical, así que $O$ está a
              $1{,}5\cos 30° = 1{,}299\ \text{m}$ bajo la superficie.
          - valor: '76.38 kn'
            mensaje: |
              Te falta dividir entre dos: la presión en el centro de gravedad
              es la **media** entre la de $A$ —que es cero, está en la
              superficie— y la de $O$.
        pista: |
          $F = \gamma\,h_G\,A$, con $h_G$ la profundidad del centro de gravedad
          de la hoja y $A = 1{,}5\cdot 4$.
        desarrollo: |
          $$
          z_O = 1{,}5\cos 30° = 1{,}299\ \text{m}
          \qquad
          h_G = \frac{0 + 1{,}299}{2} = 0{,}6495\ \text{m}
          $$
          $$
          F_{OA} = 9800\cdot 0{,}6495\cdot (1{,}5\cdot 4) = 38{,}19\ \text{kN}
          $$

          Y su línea de acción, al ser el prisma triangular con el vértice en
          $A$, pasa a $1{,}5/3 = 0{,}5\ \text{m}$ de $O$ — la respuesta al
          apartado b).

      - tipo: calcular
        titulo: La fuerza sobre OB
        pregunta: |
          ¿Y sobre la hoja $OB$?
        respuesta:
          tipo: magnitud
          valor: '123.4 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '155.2 kn'
            mensaje: |
              Has supuesto $OB$ vertical. Forma $60°$ con la vertical, así que
              $B$ está a $1{,}299 + 1{,}8\cos 60° = 2{,}199\ \text{m}$ de
              profundidad, no a $3{,}1$.
          - valor: '91.66 kn'
            mensaje: |
              Has usado la presión en $O$ para toda la hoja. La presión crece
              hacia $B$: el centro de gravedad está a la profundidad
              **media** entre $O$ y $B$.
        pista: |
          $z_B = z_O + 1{,}8\cos 60°$, y el centro de gravedad, a la media.
        desarrollo: |
          $$
          z_B = 1{,}299 + 1{,}8\cos 60° = 2{,}199\ \text{m}
          \qquad
          h_G = \frac{1{,}299+2{,}199}{2} = 1{,}749\ \text{m}
          $$
          $$
          F_{OB} = 9800\cdot 1{,}749\cdot (1{,}8\cdot 4) = 123{,}4\ \text{kN}
          $$

          Su línea de acción, con el prisma trapecial, cae a

          $$
          d = \frac{L}{3}\,\frac{2p_B+p_O}{p_B+p_O}
          = \frac{1{,}8}{3}\cdot\frac{2\cdot 2{,}199+1{,}299}{2{,}199+1{,}299}
          = 0{,}977\ \text{m}
          $$

          de $O$ — la respuesta al apartado d).

      - tipo: calcular
        titulo: El contrapeso
        pregunta: |
          ¿Cuánto tiene que valer el contrapeso $W$?
        respuesta:
          tipo: magnitud
          valor: '44.07 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '38.17 kn'
            mensaje: |
              Has usado $1{,}65\ \text{m}$ como brazo. El contrapeso es una
              fuerza **vertical** y su brazo es la proyección horizontal:
              $1{,}65\sin 60° = 1{,}429\ \text{m}$.
          - valor: '71.03 kn'
            mensaje: |
              Te has dejado el peso de las dos hojas. Pesan 3000 y 3600 kg y
              sus momentos van en el mismo sentido que el del contrapeso: le
              ahorran trabajo.
        pista: |
          Momentos respecto de $O$: los dos empujes contra los dos pesos de las
          hojas y el contrapeso. Todos los brazos de fuerzas verticales son
          proyecciones **horizontales**.
        desarrollo: |
          Momento neto del agua respecto de $O$:

          $$
          M_{\text{agua}} = 123{,}4\cdot 0{,}977 - 38{,}19\cdot 0{,}5
          = 120{,}6 - 19{,}1 = 101{,}5\ \text{kN}\cdot\text{m}
          $$

          Momentos de los pesos de las hojas, con brazo horizontal:

          $$
          M_{OA} = 29{,}4\cdot 0{,}75\sin 30° = 11{,}03
          \qquad
          M_{OB} = 35{,}28\cdot 0{,}9\sin 60° = 27{,}50\ \text{kN}\cdot\text{m}
          $$
          $$
          W\cdot 1{,}65\sin 60° = 101{,}5 - 11{,}03 - 27{,}50 = 62{,}98
          \;\Longrightarrow\;
          W = 44{,}07\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $A$ en la superficie, el prisma sobre $OA$ es triangular:
              38,19 kN a 0,5 m de $O$.
          - texto: >-
              Sobre $OB$ el prisma es trapecial, entre 1,299 y 2,199 m de
              profundidad: 123,4 kN a 0,977 m de $O$.
          - texto: >-
              Los dos momentos del agua se restan, y lo que queda lo equilibran
              los pesos de las hojas y el contrapeso de 44,07 kN.
          - texto: >-
              Los brazos de los pesos son las distancias a $O$ medidas a lo
              largo de cada hoja, porque es donde están aplicados.
            trampa: true
            mensaje: |
              El brazo de una fuerza **vertical** es su distancia **horizontal**
              al eje, no la distancia a lo largo de la hoja. Usar 1,65 en vez
              de $1{,}65\sin 60° = 1{,}429$ da 38,2 kN en vez de 44,1: un 13 %
              de error que no chirría por ningún lado.

    resolucion: |
      **La geometría primero, que es donde está la mitad del problema.** $A$
      está en la superficie libre y $OA$ forma $30°$ con la vertical, así que

      $$
      z_O = 1{,}5\cos 30° = 1{,}299\ \text{m}
      \qquad
      z_B = z_O + 1{,}8\cos 60° = 2{,}199\ \text{m}
      $$

      **Las dos fuerzas y sus líneas de acción.**

      | | fuerza | a qué distancia de $O$ |
      |---|---|---|
      | $OA$ (prisma triangular) | $38{,}19$ kN | $1{,}5/3 = 0{,}50$ m |
      | $OB$ (prisma trapecial) | $123{,}4$ kN | $0{,}977$ m |

      **Los momentos, que se restan** porque $A$ está por encima de $O$ y $B$
      por debajo:

      $$
      M_{\text{agua}} = 120{,}6 - 19{,}1 = 101{,}5\ \text{kN}\cdot\text{m}
      $$

      **Y el contrapeso**, después de descontar lo que ya aportan los pesos de
      las dos hojas:

      $$
      W = \frac{101{,}5 - 11{,}03 - 27{,}50}{1{,}65\sin 60°} = 44{,}07\ \text{kN}
      $$

      **Dos cosas que este problema enseña y que valen para todos los
      demás.**

      La primera: **los brazos de las fuerzas verticales son horizontales**.
      Los pesos —de las hojas y del contrapeso— van hacia abajo, así que su
      momento se calcula con la proyección horizontal de la distancia, no con
      la distancia a lo largo de la hoja. Es el error del distractor y cuesta
      un 13 %.

      La segunda: **por qué el aliviadero se diseña así**. Las dos hojas en
      ángulo recto hacen que los empujes den momentos opuestos, así que el
      momento neto es pequeño comparado con cada uno por separado —101 kN·m
      frente a 120— y basta un contrapeso modesto para equilibrarlo. Y como el
      momento del agua crece muy deprisa con el nivel, en cuanto el agua sube
      un poco el contrapeso pierde y el aliviadero se abre solo. Es el mismo
      principio del ejercicio anterior, aplicado con dos hojas en vez de una.

  # ── COLECCIÓN 2.29. Superficie curva, y el resultado que hay que saber de
  #    memoria: en una superficie cilíndrica la resultante pasa por el centro,
  #    así que su momento respecto del eje es CERO.
  - id: ejflu7-col229-el-cuarto-de-cilindro
    titulo: Un cuarto de cilindro, y por qué se abre sin fuerza
    fuente: >-
      Ejercicio 2.29 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En la compuerta de la figura, formada por un cuarto de cilindro de
      $2\ \text{m}$ de radio y $2\ \text{m}$ de longitud normal al plano del
      dibujo, se pide:

      a) Componente horizontal de la fuerza ejercida por el agua.

      b) Componente vertical.

      c) Fuerza $F$ necesaria para abrirla en el supuesto de despreciar su
      peso.

      Dato: distancia del centro de gravedad de un cuarto de círculo a los
      radios que lo limitan $= 4R/3\pi$.

      <figure class="figura-examen">
      <svg viewBox="52 16 386 214" role="img" width="440" height="244"
           aria-labelledby="f229t f229d">
        <title id="f229t">La compuerta de cuarto de cilindro, con el agua tres metros por encima de A</title>
        <desc id="f229d">El agua está a la izquierda de una pared vertical y su
        lámina libre queda tres metros por encima del punto A, que es el
        arranque del arco y está al pie de la pared. El eje de giro O queda dos
        metros a la derecha de A, a su misma altura, y es el centro del cuarto
        de cilindro. El punto C está dos metros por debajo de O, al nivel del
        suelo. El arco va de A a C bombeando hacia abajo y hacia la izquierda,
        que es por donde empuja el agua. La fuerza F que abre la compuerta es
        vertical y hacia arriba, aplicada en la pared por encima de O.</desc>

