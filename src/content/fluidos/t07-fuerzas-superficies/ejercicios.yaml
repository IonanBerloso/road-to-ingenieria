        <path d="M300 52 A 108 108 0 0 0 192 160" fill="none" stroke="var(--ink)"
              stroke-width="5" stroke-linecap="round" opacity=".85"/>
        <line x1="192" y1="160" x2="300" y2="160" stroke="var(--ink)" stroke-width="5"
              stroke-linecap="round" opacity=".85"/>

        <line x1="300" y1="160" x2="224" y2="84" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
