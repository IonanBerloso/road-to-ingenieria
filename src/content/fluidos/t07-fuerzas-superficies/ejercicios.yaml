      <figcaption>

      La compuerta es un **sector de círculo con su centro en el eje de giro**.
      Esa forma no es casual: hace que la presión del agua no pueda hacer girar
      la compuerta, y ese es todo el sentido del diseño.

      </figcaption>
      </figure>
    pide: Las componentes de la fuerza del agua, su resultante, y si la presión influye en el pistón.
    pasos:
      - tipo: reconocer
        pregunta: |
          La compuerta es un arco de circunferencia y su eje de giro está
          justamente en el centro de ese arco. ¿Qué consecuencia tiene eso para
          la resultante de las presiones?
        opciones:
          - texto: |
              Que pasa por O: la presión en cada punto es perpendicular a la
              superficie, y en un círculo la perpendicular es el radio
            correcta: true
            mensaje: |
              Ese es el mecanismo, y es el motivo por el que estas compuertas se
              construyen así. La presión actúa siempre perpendicular a la
              superficie; en un arco de circunferencia, la perpendicular en cada
              punto es su **radio**, y todos los radios se cortan en el centro.
              Así que la resultante —por grande que sea— **pasa por el eje de
              giro y no produce momento**.
          - texto: |
              Que la resultante es vertical, porque el arco es simétrico
            mensaje: |
              El arco no es simétrico respecto de ningún eje vertical: va de 25°
              por encima de la horizontal hasta 90° por debajo. La resultante
              sale a 46,7° de la horizontal.
          - texto: |
              Que la resultante es nula, porque las presiones opuestas se
              cancelan
            mensaje: |
              Se cancelarían si el arco fuese completo. Aquí es solo un sector, y
              la resultante vale casi 12 000 kN — lo que no produce es
              **momento** respecto de O, que es otra cosa.
          - texto: |
              Que hay que integrar punto por punto, porque en una superficie
              curva no valen los prismas de presiones
            mensaje: |
              Los prismas valen perfectamente: se descompone en horizontal —la
              proyección vertical— y vertical —el volumen de agua asociado—.
              Integrar punto a punto solo hace falta si se quiere demostrar lo
              de que la resultante pasa por O, y para eso basta el argumento
              geométrico.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          B está a 25° por encima de la horizontal que pasa por O, y C justo
          debajo de O. Con la lámina 5 m sobre O y 10 m de anchura, ¿cuánto vale
          la componente horizontal, en kN?
        respuesta:
          tipo: magnitud
          valor: '8153 kN'
          tolerancia: 0.01
          formato: la fuerza horizontal en kN
        distractores:
          - valor: '8281 kN'
            mensaje: |
              Has proyectado desde la lámina libre. La compuerta no empieza ahí:
              empieza en B, que está 3,38 m por encima de O y por tanto 1,62 m
              por debajo del agua. Solo ese metro y medio de más ya son 128 kN.
          - valor: '7056 kN'
            mensaje: |
              Has empezado la proyección en O en vez de en B. La compuerta sube
              25° por encima de la horizontal de O, y ese trozo también recibe
              presión.
          - valor: '16306 kN'
            mensaje: |
              Parece que has usado el arco entero de 8 m de radio como si
              midiera 16 m de proyección. La proyección vertical va de la altura
              de B a la de C: $3{,}381 + 8 = 11{,}38$ m.
        pista: |
          Profundidades: B a 1,619 m y C a 13 m. Usa
          $\gamma\,(d_C^{2}-d_B^{2})/2\cdot b$.
        desarrollo: |
          B está $8\operatorname{sen}25° = 3{,}381$ m por encima de O, así que a
          $5 - 3{,}381 = 1{,}619$ m bajo la lámina. C está a $5+8 = 13$ m.

          $$
          F_{h} = \gamma\,\frac{d_C^{2}-d_B^{2}}{2}\,b
                = 9800\cdot\frac{13^{2}-1{,}619^{2}}{2}\cdot 10
                = 8\,153\ \text{kN}
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          El tramo de arco que queda **por debajo** de O recibe empuje hacia
          arriba, y el que queda por encima, carga hacia abajo. ¿Cuál es la
          resultante vertical, en kN?
        respuesta:
          tipo: magnitud
          valor: '8646 kN'
          tolerancia: 0.01
          formato: la fuerza vertical en kN
        distractores:
          - valor: '8846 kN'
            mensaje: |
              Has contado solo el tramo de abajo, que empuja hacia arriba con
              8 846 kN. El trozo de arco por encima de O tiene agua encima y
              carga 200 kN hacia abajo: hay que restarlos.
          - valor: '9046 kN'
            mensaje: |
              Los has sumado. Una parte del arco tiene el agua **encima** y la
              otra **debajo**: sus componentes verticales van en sentidos
              contrarios.
          - valor: '4926 kN'
            mensaje: |
              Te has dejado los 5 m de lámina sobre O. Ese calado añade una
              presión uniforme sobre toda la proyección horizontal de 8 m, y son
              casi 4 000 kN.
        pista: |
          Hacia arriba: $\gamma\,b\,(5R + \pi R^{2}/4)$. Hacia abajo: el trocito
          entre el arco y la lámina, sobre la proyección de B.
        desarrollo: |
          **Hacia arriba**, el tramo de C a la horizontal de O. El volumen de
          agua que le corresponde, por metro de anchura, es el rectángulo de
          $5\times 8$ más el cuarto de círculo:

          $$
          A_{\uparrow} = 5R + \frac{\pi R^{2}}{4} = 40 + 50{,}27 = 90{,}27\ \text{m}^{2}
          $$

          **Hacia abajo**, el tramo de la horizontal de O hasta B, cuya
          proyección horizontal es estrecha —de 7,25 a 8 m—:

          $$
          A_{\downarrow} = 2{,}04\ \text{m}^{2}
          $$

          $$
          F_{v} = \gamma\,b\,(90{,}27 - 2{,}04) = 8\,646\ \text{kN}\ \uparrow
          $$

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuál es el módulo de la fuerza resultante del agua sobre la
          compuerta, en kN?
        respuesta:
          tipo: magnitud
          valor: '11884 kN'
          tolerancia: 0.01
          formato: el módulo de la resultante en kN
        distractores:
          - valor: '16799 kN'
            mensaje: |
              Has sumado las dos componentes. Son perpendiculares: se componen
              con Pitágoras, no sumando.
          - valor: '493 kN'
            mensaje: |
              Las has restado. Son perpendiculares, no opuestas.
        pista: |
          $\sqrt{8153^{2}+8646^{2}}$.
        desarrollo: |
          $$
          R = \sqrt{8153^{2}+8646^{2}} = 11\,884\ \text{kN}
          \qquad
          \alpha = \arctan\frac{8646}{8153} = 46{,}7°
          $$

          Hacia la derecha y hacia arriba, a 46,7° de la horizontal. **Y su
          línea de acción pasa por O**, que es lo único que hace falta saber
          para el apartado c).

      - tipo: justificar
        pregunta: |
          Responde al apartado c): ¿cómo influye la presión del agua en la
          fuerza del pistón? Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: |
              La presión actúa en cada punto perpendicular a la superficie, y en
              una superficie cilíndrica la perpendicular es el radio.
          - texto: |
              Todos los radios de la compuerta se cortan en O, que es
              precisamente el eje de giro: la resultante de las presiones pasa
              por O.
          - texto: |
              Una fuerza cuya línea de acción pasa por el eje **no produce
              momento** respecto de él, por grande que sea.
          - texto: |
              Así que al plantear momentos en O para abrir la compuerta, los
              11 884 kN del agua desaparecen de la ecuación: **el agua no influye
              en la fuerza del pistón**.
          - texto: |
              Y como no influye, el pistón podría dimensionarse igual para
              cualquier altura de embalse: la compuerta de sector es la única
              cuyo accionamiento no depende del nivel.
            trampa: true
            mensaje: |
              La primera mitad es la conclusión correcta del problema; la
              segunda añade dos cosas que no se siguen. «Igual para cualquier
              altura» no es cierto sin más: si el agua rebasara B, la parte que
              asoma dejaría de estar cargada como aquí y el planteamiento
              cambiaría. Y «la única» es falso: cualquier superficie cilíndrica
              girando sobre su propio eje tiene la misma propiedad —también una
              compuerta esférica sobre su centro—. Lo que sí es cierto, y es el
              motivo de que se construyan así, es que **el esfuerzo de maniobra
              no crece con el empuje**.
    resolucion: |
      **Una compuerta cuyo diseño existe para que el agua no cuente.**

      **a) Las componentes.** B está a $8\operatorname{sen}25° = 3{,}381$ m
      sobre O, o sea 1,619 m bajo la lámina; C, a 13 m.

      $$
      F_{h} = \gamma\,\frac{13^{2}-1{,}619^{2}}{2}\cdot 10 = 8\,153\ \text{kN}
      $$

      En vertical hay que separar los dos tramos, porque tiran en sentidos
      contrarios: el que queda bajo la horizontal de O tiene el agua encima de
      su proyección y empuja hacia arriba; el que asoma por encima carga hacia
      abajo.

      $$
      F_{v} = \gamma\cdot 10\,\Big(\underbrace{5R+\tfrac{\pi R^{2}}{4}}_{90{,}27}
              - \underbrace{2{,}04}_{\text{el trozo de arriba}}\Big)
            = 8\,646\ \text{kN}\ \uparrow
      $$

      **b) La resultante.**

      $$
      R = \sqrt{8153^{2}+8646^{2}} = 11\,884\ \text{kN}
      \qquad
      \alpha = 46{,}7°
      $$

      Y su línea de acción **pasa por O**.

      **c) Cómo influye la presión en el pistón: no influye.**

      Y esa es la respuesta entera, aunque parezca poca. El razonamiento cabe en
      tres frases: la presión actúa perpendicular a la superficie; en un
      cilindro la perpendicular es el radio; todos los radios pasan por el
      centro, que aquí es el eje de giro. Una fuerza que pasa por el eje no da
      momento, así que al escribir el equilibrio de momentos en O los 11 884 kN
      del agua **no aparecen**. El pistón solo tiene que vencer el peso propio
      de la compuerta.

      Por eso las compuertas de vertedero se construyen con esta forma —se
      llaman compuertas de sector o Tainter—: el esfuerzo de maniobra no crece
      con el empuje del embalse. Una compuerta plana del mismo tamaño
      necesitaría un accionamiento capaz de vencer el momento de esos 11 884 kN.

      > **Un apartado que no se publica aquí, y por qué.** El enunciado original
      > pide además la fuerza concreta del pistón, y da 81,8 kN. El método está
      > claro —momentos en O con el peso como única acción, $98$ kN aplicados en
      > A— pero para cerrar el número hace falta el brazo del pistón, que sale
      > 4,589 m, es decir 35° respecto del radio de su punto de anclaje. La
      > figura marca cinco ángulos (65°, 25°, 20°, 20° y 50°) y **ninguna
      > combinación de los leídos reproduce esos 35°**. Antes que elegir la que
      > cuadre —que sería inventar el enunciado— se deja dicho: el apartado se
      > escribirá cuando se pueda leer la figura con más resolución o aparezcan
      > las soluciones desarrolladas.
  - id: ejflu07-col230-la-pared-ondulada-y-el-deposito-en-depresion
    titulo: La pared ondulada, y el depósito en depresión
