      <figcaption>

      La componente vertical es el peso del volumen de agua que **descansaría**
      sobre el arco, y aquí ese volumen es imaginario: el agua está debajo, no
      encima. Por eso apunta hacia arriba, y por eso el resultado del apartado
      c) es exactamente cero.

      </figcaption>
      </figure>

    pide: Las dos componentes de la fuerza del agua y la fuerza necesaria para abrir.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una superficie curva, ¿cómo se calcula cada componente?
        opciones:
          - texto: >-
              La horizontal, sobre la **proyección vertical** de la superficie;
              la vertical, como el **peso del volumen** de líquido que hay
              encima
            correcta: true
            mensaje: |
              Eso es, y evita tener que integrar sobre el arco. La proyección
              convierte la componente horizontal en un problema de superficie
              plana, y la vertical se reduce a calcular un volumen.
          - texto: >-
              Integrando la presión a lo largo del arco y descomponiendo cada
              diferencial
            mensaje: |
              Es lo que se hace en el fondo, y da lo mismo, pero es
              innecesariamente laborioso. El método de la proyección y el
              volumen es esa integral ya resuelta de una vez por todas.
          - texto: >-
              Con la presión en el centro de gravedad del arco, multiplicada
              por su longitud
            mensaje: |
              Eso daría el módulo de una fuerza sobre una superficie plana de
              esa área, pero las presiones sobre un arco **no son paralelas**:
              no se pueden sumar como escalares.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Cuánto vale la componente horizontal?
        respuesta:
          tipo: magnitud
          valor: '156.8 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '117.6 kn'
            mensaje: |
              Has usado la profundidad de $A$, $3\ \text{m}$, para toda la
              proyección. La proyección va de 3 a 5 m de profundidad: su centro
              de gravedad está a 4 m.
          - valor: '196 kn'
            mensaje: |
              Has usado la profundidad de $C$, $5\ \text{m}$. Es la máxima, no
              la media: la presión sobre la proyección crece linealmente entre
              3 y 5 m.
        pista: |
          La proyección vertical del arco es un rectángulo de $2\times 2$ m,
          entre las profundidades 3 y 5.
        desarrollo: |
          $$
          h_G = \frac{3+5}{2} = 4\ \text{m}
          \qquad
          A_{\text{proy}} = 2\cdot 2 = 4\ \text{m}^{2}
          $$
          $$
          F_H = \gamma\,h_G\,A_{\text{proy}} = 9800\cdot 4\cdot 4
          = 156\,800\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          ¿Y la componente vertical?
        respuesta:
          tipo: magnitud
          valor: '179.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '117.6 kn'
            mensaje: |
              Has contado solo el prisma recto de $3\ \text{m}$ de altura sobre
              la proyección horizontal. Falta el trozo entre el nivel de $A$ y
              el arco, que es un cuarto de círculo de $\pi R^{2}/4$.
          - valor: '61.58 kn'
            mensaje: |
              Has contado solo el cuarto de círculo. Encima de él hay tres
              metros más de agua hasta la superficie libre, y también pesan.
        pista: |
          Es el peso del agua que hay verticalmente encima del arco: un prisma
          de $3\ \text{m}$ de alto más el cuarto de círculo.
        desarrollo: |
          Por unidad de longitud, el área de agua sobre el arco es

          $$
          A = \underbrace{3\cdot 2}_{\text{prisma}} + \underbrace{\frac{\pi\cdot 2^{2}}{4}}_{\text{cuarto de círculo}}
          = 6 + \pi = 9{,}14\ \text{m}^{2}
          $$
          $$
          V = 9{,}14\cdot 2 = 18{,}28\ \text{m}^{3}
          \qquad
          F_V = \gamma V = 179\,175\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza para abrirla
        pregunta: |
          ¿Qué fuerza hace falta para abrir la compuerta, en newtons?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 1
          formato: un número en newtons
        distractores:
          - valor: '238100'
            mensaje: |
              Ese es el módulo de la resultante,
              $\sqrt{F_H^{2}+F_V^{2}}$. Pero la pregunta no es cuánto vale la
              resultante sino qué momento produce sobre el eje — y su línea de
              acción pasa **por el eje**.
          - valor: '335975'
            mensaje: |
              Has sumado las dos componentes como escalares. Son
              perpendiculares: se componen con el teorema de Pitágoras, no
              sumando. Y aun así, la respuesta a esta pregunta es otra.
        pista: |
          Toma momentos respecto de $O$. ¿Por dónde pasa la resultante de una
          presión repartida sobre una superficie cilíndrica?
        desarrollo: |
          Sobre una superficie cilíndrica, la presión es en cada punto
          **perpendicular a la superficie**, es decir **radial**: su línea de
          acción pasa por el eje $O$.

          Todas las fuerzas elementales pasan por $O$, así que su resultante
          también, y

          $$
          M_O = 0
          \;\Longrightarrow\;
          F = 0
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La componente horizontal se calcula sobre la proyección vertical
              del arco: 156,8 kN.
          - texto: >-
              La vertical es el peso del agua que hay encima del arco —prisma
              más cuarto de círculo—: 179,2 kN.
          - texto: >-
              Como cada presión elemental es radial, todas pasan por $O$ y la
              resultante también: su momento es nulo y $F = 0$.
          - texto: >-
              El dato del centro de gravedad del cuarto de círculo,
              $4R/3\pi$, es el que permite localizar la línea de acción de la
              componente vertical.
            trampa: true
            mensaje: |
              Ese dato **sobra** en este problema, y darse cuenta es parte del
              ejercicio: como la resultante pasa por $O$, no hace falta
              localizar nada. Está en el enunciado como distracción — o para
              quien resuelva el apartado c) por el camino largo, tomando
              momentos de cada componente y comprobando que se cancelan.

    resolucion: |
      **Las dos componentes, con el método que evita integrar.**

      $$
      F_H = \gamma h_G A_{\text{proy}} = 9800\cdot 4\cdot 4 = 156{,}8\ \text{kN}
      $$
      $$
      F_V = \gamma V = 9800\cdot\left(3\cdot 2 + \frac{\pi\cdot 2^{2}}{4}\right)\cdot 2
      = 179{,}2\ \text{kN}
      $$

      **Y el apartado c), que es por lo que este problema merece la pena.**

      > En una superficie **cilíndrica**, la presión en cada punto es
      > perpendicular a la superficie, es decir **radial**. Todas las fuerzas
      > elementales pasan por el eje, y por tanto la resultante también. Su
      > momento respecto del eje es **cero**.

      Así que $F = 0$: la compuerta se abre sin esfuerzo, por muy grande que
      sea la fuerza que recibe. Y recibe 238 kN de resultante — veinticuatro
      toneladas— que la articulación aguanta entera sin transmitir nada al
      mecanismo.

      **Ese es el motivo de que las compuertas de sector se hagan así.** Una
      compuerta plana del mismo tamaño necesitaría un momento enorme para
      moverse; una cilíndrica con el eje en su centro de curvatura se abre con
      el dedo. Es el diseño de los aliviaderos de casi todas las presas
      grandes, y aparece otra vez en el ejercicio 2.32.

      **Y el dato de $4R/3\pi$ del enunciado no se usa.** Está para quien
      resuelva el apartado c) por el camino largo —localizar la línea de acción
      de cada componente y comprobar que sus momentos se cancelan— o
      simplemente como distracción. Reconocer un dato que sobra es parte de
      leer bien un enunciado.

  # ── COLECCIÓN 2.31. El problema más completo del capítulo: superficie
  #    cilíndrica cuya resultante pasa por el eje —y por tanto no da momento—,
  #    de modo que lo que abre la compuerta es la SUBPRESIÓN bajo la solera.
  - id: ejflu7-col231-la-compuerta-que-abre-la-subpresion
    titulo: La compuerta que abre la subpresión, no el empuje
    fuente: >-
      Ejercicio 2.31 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En la figura se representa la sección transversal de una compuerta
      articulada en el punto $O$ y formada por una parte plana y otra
      cilíndrica. Al llenarse el embalse, el agua, a través del canal $B$, se
      introduce en el recinto $C$, cuya misión es regular la apertura de la
      compuerta. Sabiendo que el peso de la compuerta es de
      $4000\ \text{kg}$ por metro de longitud normal al plano del dibujo y que
      el centro de gravedad se encuentra a $2{,}4\ \text{m}$ de la
      articulación $O$, se pide:

      a) La altura máxima $h$ para la cual permanecerá cerrada la compuerta.

      Para $h = 1{,}5\ \text{m}$:

      b) Fuerza ejercida por la compuerta sobre el tope $A$.

      c) Fuerzas de reacción en la articulación $O$.

