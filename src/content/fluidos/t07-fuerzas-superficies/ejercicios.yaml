      <figcaption>

      El fondo del depósito corta el cono **justo por la mitad**: solo la parte
      de arriba está en contacto con el agua, y allí el diámetro no es 1,5 m
      sino 0,75. Todo el problema depende de darse cuenta de eso.

      </figcaption>
      </figure>
    pide: La altura de agua a la que la válvula empieza a levantarse.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cono mide 1,8 m de alto y 1,5 m de diámetro en la base, pero el
          fondo del depósito lo corta a 0,9 m de esa base. ¿Qué superficie moja
          el agua?
        opciones:
          - texto: |
              Solo la parte del cono que queda **por encima del asiento**, cuyo
              diámetro es de 0,75 m: la mitad de abajo está al aire
            correcta: true
            mensaje: |
              Ese es el punto del problema. El agua está dentro del depósito y
              el cono asoma por el orificio: lo que hay por debajo del fondo
              está a la presión atmosférica y no cuenta. Y como el cono es
              recto, cortarlo a media altura deja **la mitad de diámetro**, no
              la mitad de área: el área del asiento es la cuarta parte de la de
              la base.
          - texto: |
              Todo el cono, porque está sumergido en el depósito
            mensaje: |
              No lo está: mira dónde está el fondo del depósito en la figura. La
              mitad inferior del cono, la ancha, queda fuera y al aire. Usar el
              cono entero da $H = 0{,}86$ m en vez de 1,33.
          - texto: |
              La base del cono, de 1,5 m de diámetro, que es donde apoya
            mensaje: |
              La base es la cara de abajo y está al aire. Donde el cono apoya es
              en el borde del orificio, a media altura, y ahí su diámetro es de
              0,75 m.
          - texto: |
              Ninguna: al estar apoyado, la válvula no recibe empuje hasta que
              se levanta
            mensaje: |
              Al revés — el empuje es lo que la levanta, y existe estando
              apoyada. Justamente se busca la altura a la que ese empuje llega
              a vencer al resto.

      - tipo: calcular
        titulo: El área del asiento
        pregunta: |
          El cono es recto, así que su radio crece linealmente desde la punta.
          ¿Cuánto vale el área del orificio donde apoya, en m²?
        respuesta:
          tipo: magnitud
          valor: '0.4418 m2'
          tolerancia: 0.01
          formato: el área en metros cuadrados
        distractores:
          - valor: '1.767 m2'
            mensaje: |
              Esa es el área de la **base** del cono, con $d = 1{,}5$ m. En el
              asiento el diámetro es la mitad, y el área, la cuarta parte:
              cuatro veces menos.
          - valor: '0.884 m2'
            mensaje: |
              Has partido por dos el área de la base. Cortar el cono a media
              altura parte el **diámetro** por dos, y el área va con el
              cuadrado: sale la cuarta parte, no la mitad.
        pista: |
          A 0,9 m de la base, el radio es $0{,}75\cdot(1 - 0{,}9/1{,}8)$.
        desarrollo: |
          $$
          r_{asiento} = \frac{d}{2}\left(1-\frac{l}{h}\right)
                      = 0{,}75\left(1-\frac{0{,}9}{1{,}8}\right) = 0{,}375\ \text{m}
          $$

          $$
          A = \pi\,0{,}375^{2} = 0{,}4418\ \text{m}^{2}
          $$

          Y de paso, el trozo de cono que asoma dentro del depósito:

          $$
          V = \frac{1}{3}\,A\,(h-l) = \frac{1}{3}\cdot 0{,}4418\cdot 0{,}9
            = 0{,}1325\ \text{m}^{3}
          $$

      - tipo: calcular
        titulo: La altura de apertura
        pregunta: |
          La válvula se levanta cuando el contrapeso vence al peso propio más el
          agua que carga encima del cono. ¿A qué altura $H$ ocurre, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.33 m'
          tolerancia: 0.01
          formato: la altura en metros
        distractores:
          - valor: '1.034 m'
            mensaje: |
              Te has dejado el volumen del cono. El agua no llega hasta el fondo
              del orificio: hasta 0,9 m está el cono ocupando sitio, y esos
              0,1325 m³ de agua que **no** hay son 1 300 N menos de carga. Por
              eso el enunciado da la fórmula del volumen del cono.
          - valor: '0.858 m'
            mensaje: |
              Has usado el cono entero, con su base de 1,5 m. Solo la mitad
              superior toca el agua.
          - valor: '0.734 m'
            mensaje: |
              Has **sumado** el volumen del cono en vez de restarlo. El cono
              desplaza agua: donde está él no hay agua que pese, así que su
              volumen se descuenta de la carga.
        pista: |
          $P = W + \gamma\,(A\,H - V)$, con $A = 0{,}4418$ m² y
          $V = 0{,}1325$ m³.
        desarrollo: |
          El agua que carga sobre el cono es la que hay verticalmente encima de
          su superficie mojada: la columna sobre el asiento **menos** lo que
          ocupa el propio cono.

          $$
          F_{\downarrow} = \gamma\,(A\,H - V) = 9800\,(0{,}4418\,H - 0{,}1325)
          $$

          En el instante de abrir, $P = W + F_{\downarrow}$:

          $$
          6700 = 2225 + 9800\,(0{,}4418\,H - 0{,}1325)
          $$

          $$
          4475 = 4329{,}5\,H - 1298{,}9
          \;\Longrightarrow\;
          H = \frac{5773{,}9}{4329{,}5} = 1{,}33\ \text{m}
          $$

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: |
              La válvula se abre cuando el tiro del contrapeso, 6700 N, iguala a
              todo lo que la sujeta hacia abajo.
          - texto: |
              Lo que la sujeta es su propio peso, 2225 N, más el peso del agua
              que carga sobre la parte del cono que asoma dentro del depósito.
          - texto: |
              Esa agua es la columna sobre el orificio, $\gamma A H$, **menos**
              la que el cono desplaza, $\gamma V$: donde está el cono no hay
              agua que pese.
          - texto: |
              Igualando sale $H = 1{,}33$ m, y por debajo de esa altura la
              válvula sigue cerrada.
          - texto: |
              Y como el empuje crece con $H$, si se aumentase el contrapeso la
              válvula abriría con menos agua: el contrapeso y la altura de
              apertura son proporcionales.
            trampa: true
            mensaje: |
              La primera mitad es correcta —más contrapeso, menos altura
              necesaria— y «proporcionales» es falso. La relación es
              $H = \big((P-W)/\gamma + V\big)/A$: es **afín**, no proporcional.
              Con $P = W$ la altura de apertura no sería cero sino
              $V/A = 0{,}30$ m, que es el trozo de cono que asoma. Hace falta
              agua por encima de la punta para que la carga empiece a contar.
    resolucion: |
      **Un problema donde todo se juega en una lectura de la figura.**

      El cono mide 1,8 m y 1,5 m de base, y el enunciado da esos dos números
      con toda claridad. Ninguno de los dos se usa tal cual: **el fondo del
      depósito corta el cono a media altura**, y lo único que toca el agua es
      la mitad de arriba.

      **La geometría.** El cono es recto, así que a 0,9 m de la base su radio es
      la mitad:

      $$
      r = 0{,}375\ \text{m}
      \qquad
      A = \pi r^{2} = 0{,}4418\ \text{m}^{2}
      \qquad
      V = \frac{A\,(h-l)}{3} = 0{,}1325\ \text{m}^{3}
      $$

      Fíjate en el salto: la base tiene 1,767 m² y el asiento 0,442. **Cuatro
      veces menos**, porque el diámetro se parte por dos y el área va al
      cuadrado.

      **El equilibrio.** La válvula abre cuando el contrapeso vence al peso
      propio más el agua que carga encima:

      $$
      P = W + \gamma\,(A\,H - V)
      \;\Longrightarrow\;
      6700 = 2225 + 9800\,(0{,}4418\,H - 0{,}1325)
      $$

      $$
      \boxed{H = 1{,}33\ \text{m}}
      $$

      **Los dos errores que este problema está hecho para provocar.**

      El primero es usar el cono entero: da $H = 0{,}86$ m, un número
      razonable y equivocado. Se evita mirando dónde está el fondo del
      depósito, no dónde está el cono.

      El segundo es olvidar el volumen. Se cae en él con facilidad porque la
      fórmula «peso de la columna de agua» sale sola, y aquí la columna **no
      llega hasta abajo**: hasta 0,9 m está el cono ocupando sitio. Son 0,1325
      m³, o sea 1 300 N que no cargan sobre la válvula. Si el enunciado se
      molesta en dar la fórmula del volumen del cono, es porque hay que usarla.

      **Y una comprobación de sentido físico que cierra el problema.** Con
      $P = W$ —contrapeso justo igual al peso de la válvula— la altura de
      apertura no sería cero, sino $V/A = 0{,}30$ m: exactamente lo que asoma
      el cono dentro del depósito. Hasta que el agua no cubre la punta no hay
      nada que empuje hacia abajo. Es la señal de que la relación entre
      contrapeso y altura es afín y no proporcional, y de que las cuentas están
      bien planteadas.
  - id: ejflu07-col243-el-contrapeso-que-pesa-menos-dentro-del-agua
    titulo: El contrapeso que pesa menos dentro del agua
    fuente: Ejercicio 2.43 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La compuerta AB de la figura mide 3 m en la dirección normal al dibujo,
      está articulada en B y tiene un tope en A. Se pide:

      a) Nivel $h$ del agua en el momento de alcanzar el equilibrio si el peso
      se encuentra fuera del agua.

      b) Ídem si el peso se halla sumergido.

      Dato: densidad relativa del material del peso = 2,4.

      Nota: despréciese el peso de la compuerta.

      <figure class="figura-examen">
      <svg viewBox="-6 20 400 232" role="img" width="430" height="249"
           aria-labelledby="f243t f243d">
        <title id="f243t">La compuerta inclinada y su contrapeso colgado de una polea</title>
        <desc id="f243d">Una compuerta plana de cinco metros de largo, inclinada
        sesenta grados sobre la horizontal, articulada por su extremo inferior B
        que está al nivel del fondo. El agua queda a la derecha de la compuerta
        y su lámina libre está a una altura h sobre el fondo, de modo que solo
        moja la parte baja de la compuerta. Del extremo superior A sale un cable
        perpendicular a la compuerta que pasa por una polea y sostiene un
        contrapeso de cuatro mil quinientos kilos. La figura está dibujada a
        escala para el caso a, con h igual a tres metros con veintitrés.</desc>

        <path d="M112 196 L390 196 L390 238 L136 238 Z" fill="var(--live)" fill-opacity=".14"/>
        <line x1="112" y1="196" x2="390" y2="196" stroke="var(--live)" stroke-width="2"/>
        <path d="M300 206 L322 206 M304 212 L318 212" stroke="var(--live)" stroke-width="1.4"/>
        <text x="390" y="188" text-anchor="end" font-size="10.5" fill="var(--live)">superficie libre</text>

        <path d="M40 238 L390 238" stroke="var(--faint)" stroke-width="1.6"/>
        <path d="M46 238 L40 246 M62 238 L56 246 M78 238 L72 246 M94 238 L88 246
                 M110 238 L104 246 M126 238 L120 246 M142 238 L136 246 M158 238 L152 246
