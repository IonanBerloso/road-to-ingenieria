ejercicios:
  # ── NUESTRO (§08). El capítulo 9 de la colección es todo de turbobombas en
  #    instalación —tema 25— y no toca las de desplazamiento positivo. Este
  #    ejercicio pone números a lo que hace distintas a las alternativas: el
  #    caudal sale de la geometría y no de la presión.
  - id: ejflu24-el-caudal-de-una-bomba-de-embolo
    titulo: El caudal de una bomba de émbolo sale de la geometría
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una bomba alternativa de émbolo de **simple efecto** tiene un pistón de
      $80\ \text{mm}$ de diámetro y una carrera de $120\ \text{mm}$, y gira a
      $300\ \text{rpm}$. Su rendimiento volumétrico es $0{,}92$ y trabaja
      contra una presión de $200\ \text{bar}$.

      a) Calcular el caudal teórico.

      b) Calcular el caudal real.

      c) Calcular la potencia hidráulica que entrega.
    pide: Los dos caudales y la potencia hidráulica.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado no da ninguna curva característica de la bomba?
        opciones:
          - texto: >-
              Porque en una bomba de desplazamiento positivo el caudal lo fija
              la cilindrada y el régimen, casi independientemente de la
              presión: su curva es prácticamente vertical
            correcta: true
            mensaje: |
              Exacto, y esa es la diferencia de fondo con una turbobomba. Aquí
              el caudal se **calcula**; en una turbobomba hay que cruzar dos
              curvas para saberlo.
          - texto: >-
              Porque con el rendimiento volumétrico ya se tiene toda la
              información de la curva
            mensaje: |
              El rendimiento volumétrico corrige las fugas, pero no sustituye a
              una curva. La razón de que no haga falta curva es más de fondo:
              en esta máquina el caudal no depende de la altura.
          - texto: >-
              Porque la presión de 200 bar ya determina el punto de trabajo
              sobre la curva
            mensaje: |
              Ese razonamiento vale para una turbobomba, donde altura y caudal
              están ligados. En una de desplazamiento positivo, la presión no
              elige el caudal: la bomba da el suyo y la presión sube hasta
              donde haga falta.

      - tipo: calcular
        titulo: El caudal teórico
        pregunta: |
          ¿Qué caudal desplaza teóricamente?
        respuesta:
          tipo: magnitud
          valor: '3.016 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '6.032 l/s'
            mensaje: |
              Has contado dos emboladas por vuelta, que es lo que ocurriría en
              una bomba de **doble efecto**. En simple efecto solo impulsa una
              de las dos carreras: una embolada por vuelta.
          - valor: '181 l/s'
            mensaje: |
              Te has dejado el 60: las 300 revoluciones son por **minuto**, y
              el caudal se pide por segundo.
        pista: |
          Volumen de una embolada por número de emboladas por segundo.
        desarrollo: |
          $$
          V = \frac{\pi D^{2}}{4}\,L = \frac{\pi\cdot 0{,}08^{2}}{4}\cdot 0{,}12
          = 6{,}03\cdot 10^{-4}\ \text{m}^{3} = 603\ \text{cm}^{3}
          $$
          $$
          Q_t = V\cdot\frac{300}{60} = 3{,}02\cdot 10^{-3}\ \text{m}^{3}/\text{s}
          = 3{,}02\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          ¿Y el que sale de verdad por la impulsión?
        respuesta:
          tipo: magnitud
          valor: '2.775 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '3.278 l/s'
            mensaje: |
              Has dividido entre el rendimiento en vez de multiplicar. El
              caudal real es **menor** que el teórico: parte del líquido pasa a
              la otra cara del émbolo o se fuga al exterior.
          - valor: '3.016 l/s'
            mensaje: |
              Ese es el teórico. El volumétrico de una alternativa no es 1: hay
              fugas por los huelgos y las válvulas no cierran instantáneamente,
              y eso empeora al subir la presión.
        pista: |
          $Q_u = \eta_v\,Q_t$, y tiene que salir menor.
        desarrollo: |
          $$
          Q_u = 0{,}92\cdot 3{,}016 = 2{,}77\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La potencia hidráulica
        pregunta: |
          ¿Qué potencia entrega al líquido contra los 200 bar?
        respuesta:
          tipo: magnitud
          valor: '55.49 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '60.32 kw'
            mensaje: |
              Has usado el caudal teórico. La potencia útil se calcula con el
              que de verdad llega a la impulsión.
          - valor: '5.549 kw'
            mensaje: |
              Un factor diez en la presión: $200\ \text{bar} = 2\cdot 10^{7}\
              \text{Pa}$, no $2\cdot 10^{6}$.
        pista: |
          $P = \Delta p\cdot Q$, con la presión en pascales.
        desarrollo: |
          $$
          P = \Delta p\,Q_u = 2\cdot 10^{7}\cdot 2{,}775\cdot 10^{-3}
          = 55\,500\ \text{W} = 55{,}5\ \text{kW}
          $$

          Casi tres litros por segundo, y cincuenta y cinco kilovatios: toda la
          potencia está en la presión, no en el caudal.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              En una bomba de desplazamiento positivo el caudal sale de la
              cilindrada por el régimen: 603 cm³ por embolada, cinco emboladas
              por segundo, 3,02 l/s.
          - texto: >-
              El rendimiento volumétrico recorta ese caudal a 2,77 l/s, y esa
              merma crece con la presión, porque aumentan las fugas.
          - texto: >-
              Contra 200 bar, la potencia hidráulica es de 55,5 kW: en esta
              máquina toda la potencia está en la presión, no en el caudal.
          - texto: >-
              Si se necesitara menos caudal, bastaría con estrangular una
              válvula en la impulsión, como en cualquier bomba.
            trampa: true
            mensaje: |
              En una bomba de desplazamiento positivo eso es peligroso. Su
              curva es casi vertical: al estrangular no baja el caudal, **sube
              la presión** hasta que algo cede. Se regula variando la velocidad
              de giro o la cilindrada, y se protege con válvula de seguridad.

    resolucion: |
      **El caudal teórico.** Sale de la geometría, sin curvas ni catálogos:

      $$
      V = \frac{\pi\cdot 0{,}08^{2}}{4}\cdot 0{,}12 = 603\ \text{cm}^{3}
      \qquad
      Q_t = 603\cdot\frac{300}{60} = 3{,}02\ \text{l/s}
      $$

      **El real.** $Q_u = 0{,}92\cdot 3{,}02 = 2{,}77\ \text{l/s}$.

      **La potencia.** $P = 2\cdot 10^{7}\cdot 2{,}775\cdot 10^{-3} =
      55{,}5\ \text{kW}$.

      **Las tres diferencias con una turbobomba**, que es de lo que va el
      ejercicio:

      1. **El caudal se calcula, no se cruza.** No hace falta curva de la
         bomba ni curva de la instalación: la máquina desplaza lo que desplaza.
      2. **La presión no la elige la bomba**, la elige la instalación, y la
         bomba la da. Teóricamente sin tope; en la práctica, hasta que rompe.
         De ahí la válvula de seguridad.
      3. **Y por eso no se regula estrangulando.** Cerrar una válvula en una
         turbobomba baja el caudal; aquí sube la presión. Se regula variando el
         régimen de giro o la cilindrada.

      Tres litros por segundo es un caudal pequeño —una turbobomba de tamaño
      medio mueve veinte veces más— y cincuenta y cinco kilovatios es mucha
      potencia. Ese es exactamente el nicho de estas máquinas: **poco caudal a
      muchísima presión**.

  # ── NUESTROS, y al final (§04): no son de la colección y no abren el tema.
  #    Son las piezas que se ven al desmontar las bombas en la práctica 24
  #    —los cierres de una turbobomba, los émbolos de una alternativa—, con
  #    la cuenta que dice para qué sirve cada una.
  - id: ejflu24-los-anillos-gastados-en-kilovatios
    titulo: Los anillos de cierre gastados, en kilovatios
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre los cierres de las
      turbobombas del tema 24 y el rendimiento volumétrico del tema 22 de los
      apuntes de Mecánica de Fluidos (UPV/EHU). No es de examen ni de la
      colección de problemas.
    nivel: practica
    enunciado: |
      Una turbobomba impulsa un caudal útil de $40\ \text{l/s}$ de agua con
      una altura manométrica de $30\ \text{m}$. Su rendimiento hidráulico es
      $0{,}85$ y el orgánico, $0{,}95$. Al desmontarla se ve que los anillos
      de cierre están gastados: se estima que $4\ \text{l/s}$ vuelven de la
      salida a la entrada del rodete por el huelgo, y que por el prensaestopas,
      que también está flojo, se escapan $0{,}1\ \text{l/s}$.

      a) Decir qué cierre corresponde a cada una de las dos fugas.

      b) Calcular el rendimiento volumétrico.

      c) Con anillos nuevos, lo que vuelve a la entrada baja a
      $1\ \text{l/s}$. Calcular cuánta potencia absorbida se ahorra, con el
      mismo caudal útil y las mismas alturas.
    pide: Qué cierre defiende de cada fuga, el rendimiento volumétrico y lo que ahorra cambiar los anillos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cierre corresponde a cada fuga?
        opciones:
          - texto: >-
              Lo que vuelve de la salida a la entrada del rodete, al sellado
              interno —los anillos de cierre, rozantes o laberínticos—; lo que
              se escapa por el eje, al externo —el prensaestopas o el cierre
              mecánico—
            correcta: true
            mensaje: |
              Eso es: laberínticos por dentro, prensaestopas o cierre mecánico
              por fuera. Y las dos fugas son las dos partes del caudal perdido
              del tema 22, así que las dos bajan el rendimiento volumétrico.
          - texto: >-
              Al revés: los laberínticos cierran el paso del eje y el
              prensaestopas separa la salida de la entrada del rodete
            mensaje: |
              Están cruzados. El prensaestopas son anillos elastoméricos que
              abrazan el **eje** donde entra en la carcasa. Los anillos de
              cierre van entre el rodete y la carcasa, donde el agua que ya
              tiene energía intenta volver a la entrada.
          - texto: >-
              Las dos al prensaestopas, que es el único cierre de una
              turbobomba
            mensaje: |
              Una turbobomba tiene dos cierres, y los tests de huecos de 2021 y
              de 2026 lo preguntan así: internos y externos. El prensaestopas
              solo está donde el eje atraviesa la carcasa.

      - tipo: calcular
        titulo: El rendimiento volumétrico
        pregunta: |
          b) ¿Cuánto vale el rendimiento volumétrico con los anillos gastados?
          (en tanto por uno)
        respuesta:
          tipo: numero
          valor: '0.907'
          tolerancia: 0.004
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.8975'
            mensaje: |
              Has restado las fugas al caudal útil, $(40 - 4{,}1)/40$. El
              rendimiento volumétrico es el útil entre el **total**, y el total
              es el útil **más** lo que se pierde: $40/44{,}1$.
          - valor: '1.103'
            mensaje: |
              Lo has puesto del revés, total entre útil. Un rendimiento no
              puede pasar de 1: es $Q_u/Q_t$.
        pista: |
          $\eta_v = Q_u/Q_t$, con $Q_t = Q_u$ más las dos fugas.
        desarrollo: |
          $$
          Q_t = 40 + 4 + 0{,}1 = 44{,}1\ \text{l/s}
          \qquad
          \eta_v = \frac{40}{44{,}1} = 0{,}907
          $$

          Con anillos nuevos, $Q_t = 41{,}1$ l/s y $\eta_v = 0{,}973$.

      - tipo: calcular
        titulo: Lo que ahorran los anillos nuevos
        pregunta: |
          c) ¿Cuánta potencia absorbida se ahorra al cambiar los anillos?
        respuesta:
          tipo: magnitud
          valor: '1092 w'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '882 w'
            mensaje: |
              Has multiplicado los 3 l/s por la altura manométrica, 30 m. Pero
              la absorbida es $P_a = \gamma H_a Q_t$: cada litro que pasa por el
              rodete, útil o perdido, le cuesta al motor la altura absorbida,
              $H_a = H_m/(\eta_m\eta_o) = 37{,}15$ m, con las pérdidas
              hidráulicas y orgánicas dentro.
          - valor: '1092 kw'
            mensaje: |
              La cifra es buena y la unidad no: el caudal va en m³/s. Tres
              litros por segundo son $0{,}003\ \text{m}^{3}/\text{s}$.
        pista: |
          $P_a = \gamma\,H_a\,Q_t$, con $H_a = H_m/(\eta_m\,\eta_o)$. Lo único
          que cambia es $Q_t$.
        desarrollo: |
          $$
          H_a = \frac{H_m}{\eta_m\,\eta_o} = \frac{30}{0{,}85\cdot 0{,}95}
          = 37{,}15\ \text{m}
          $$
          $$
          P_a = 9800\cdot 37{,}15\cdot 0{,}0441 = 16{,}06\ \text{kW}
          \qquad
          P_a' = 9800\cdot 37{,}15\cdot 0{,}0411 = 14{,}96\ \text{kW}
          $$

          Se ahorran $1{,}09\ \text{kW}$, un 7 % de lo que la bomba pedía al
          motor, sin que el agua útil cambie.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que vuelve de la salida a la entrada del rodete lo frena el
              sellado interno, con anillos de cierre; lo que se escapa por el
              eje, el externo, con el prensaestopas o el cierre mecánico.
          - texto: >-
              Las dos fugas son caudal perdido: $Q_t = 44{,}1$ l/s para 40 útiles,
              y $\eta_v = 0{,}907$.
          - texto: >-
              Ese caudal perdido pasa por el rodete, y el motor lo paga como
              todo el caudal total: a la altura absorbida, 37,15 m.
          - texto: >-
              Con anillos nuevos $Q_t$ baja a 41,1 l/s, y la absorbida, de
              16,06 a 14,96 kW: 1,09 kW menos por el mismo servicio.
          - texto: >-
              El agua que recircula vuelve a entrar en la bomba, así que no se
              pierde nada y el rendimiento volumétrico no cambia.
            trampa: true
            mensaje: |
              No sale de la instalación, pero sí se pierde: el rodete le ha dado
              energía y esa energía se disipa al volver a la entrada por el
              huelgo. Por eso el tema 22 la cuenta en el caudal perdido, y por
              eso los anillos gastados se pagan en la factura.

    resolucion: |
      **a) Cada fuga, su cierre.** La que vuelve de la salida a la entrada del
      rodete es el cortocircuito hidráulico, y la frenan los **anillos de
      cierre**, rozantes o laberínticos: el sellado interno. La que sale por el
      eje la frena el sellado externo: el **prensaestopas**, o un **cierre
      mecánico**.

      **b) El rendimiento volumétrico.**

      $$
      \eta_v = \frac{Q_u}{Q_t} = \frac{40}{40 + 4 + 0{,}1} = 0{,}907
      $$

      **c) El ahorro.** La potencia absorbida es $\gamma H_a Q_t$, con
      $H_a = 30/(0{,}85\cdot 0{,}95) = 37{,}15$ m. Con los anillos gastados
      son $16{,}06$ kW; con los nuevos, $14{,}96$ kW. Se ahorran
      **1,09 kW**, y el rendimiento global sube de 0,732 a 0,786.

      **Lo que hay que llevarse.** Un cierre no es un detalle de montaje: es el
      rendimiento volumétrico hecho pieza. Y el caudal que recircula no es
      gratis por quedarse dentro de la bomba: el motor lo paga a la altura
      absorbida, no a la manométrica, así que cuesta más de lo que parece.

  - id: ejflu24-la-bomba-de-tres-embolos-se-regula-con-el-motor
    titulo: La bomba de tres émbolos, y por qué se regula con el motor
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre las bombas alternativas del
      tema 24 de los apuntes de Mecánica de Fluidos (UPV/EHU) y las que se
      desmontan en la práctica 24. No es de examen ni de la colección de
      problemas.
    nivel: practica
    enunciado: |
      Una hidrolimpiadora lleva una bomba alternativa de **tres émbolos** de
      simple efecto, con los ciclos desfasados. Cada émbolo tiene
      $20\ \text{mm}$ de diámetro y $12\ \text{mm}$ de carrera; el motor gira
      a $1450\ \text{rpm}$, el rendimiento volumétrico es $0{,}95$ y la bomba
      trabaja a $150\ \text{bar}$.

      a) Decir qué energía del agua sube esta bomba, y por qué lleva tres
      émbolos y no uno.

      b) Calcular el caudal real que da.

      c) Se quiere bajar el caudal a $12\ \text{l/min}$. Calcular a qué
      régimen tiene que girar el motor, y explicar por qué no se hace cerrando
      una válvula en la impulsión.
    pide: Qué energía sube, el caudal real, el régimen para 12 l/min y por qué no se estrangula.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las tres formas de energía hidráulica —posición, presión y
          velocidad—, ¿cuál sube el agua al pasar por los émbolos de la
          hidrolimpiadora?
        opciones:
          - texto: >-
              Solo la de presión
            correcta: true
            mensaje: |
              Eso es: el desplazador encierra el líquido y lo empuja a una zona
              de más presión, y Pascal la transmite. La posición no cambia
              —entrada y salida están a la misma cota— y la velocidad tampoco.
          - texto: >-
              La de presión y la de velocidad
            mensaje: |
              Esas son las turbobombas: el rodete da presión y velocidad, y el
              difusor pasa parte de la velocidad a presión. En una de
              desplazamiento positivo solo sube la presión.
          - texto: >-
              La de velocidad
            mensaje: |
              Solo velocidad la suben los eyectores, y su finalidad real es
              mezclar. Una bomba de émbolos da poco caudal —poca velocidad— a
              mucha presión.
          - texto: >-
              La de posición
            mensaje: |
              Solo posición la sube el tornillo de Arquímedes, y prácticamente
              nada más. Entre la entrada y la salida de una bomba de émbolos no
              hay diferencia de cota que valga.

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          b) ¿Qué caudal real da la bomba, en litros por minuto?
        respuesta:
          tipo: magnitud
          valor: '15.58 l/min'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '5.193 l/min'
            mensaje: |
              Has contado un solo émbolo. Los tres impulsan una vez por vuelta
              cada uno: el caudal es tres veces el de uno.
          - valor: '16.4 l/min'
            mensaje: |
              Ese es el teórico. El rendimiento volumétrico de una alternativa
              no es 1: parte del líquido pasa a la otra cara del émbolo o se
              fuga, y más cuanto más presión.
          - valor: '17.26 l/min'
            mensaje: |
              Has dividido entre el rendimiento en vez de multiplicar. El real
              es **menor** que el teórico.
        pista: |
          Volumen de una embolada, por tres émbolos, por las vueltas por
          minuto, y por el rendimiento volumétrico.
        desarrollo: |
          $$
          V = \frac{\pi\cdot 0{,}02^{2}}{4}\cdot 0{,}012 = 3{,}77\cdot 10^{-6}\ \text{m}^{3}
          = 3{,}77\ \text{cm}^{3}
          $$
          $$
          Q_t = 3\cdot 3{,}77\ \text{cm}^{3}\cdot 1450\ \text{min}^{-1} = 16{,}40\ \text{l/min}
          \qquad
          Q_u = 0{,}95\cdot 16{,}40 = 15{,}58\ \text{l/min}
          $$

          A 150 bar eso son $150\cdot 10^{5}\cdot 15{,}58/60\,000 = 3{,}9$ kW de
          potencia hidráulica.

      - tipo: calcular
        titulo: El régimen para doce litros por minuto
        pregunta: |
          c) ¿A qué régimen tiene que girar el motor para que la bomba dé
          $12\ \text{l/min}$?
        respuesta:
          tipo: magnitud
          valor: '1117 rpm'
          tolerancia: 0.02
          formato: una velocidad de giro, con su unidad
        distractores:
          - valor: '1061 rpm'
            mensaje: |
              Has calculado el régimen que daría 12 l/min **teóricos**. Los
              12 son reales: hay que pedir un poco más de teórico para cubrir
              el 5 % que se fuga.
          - valor: '3351 rpm'
            mensaje: |
              Has contado un solo émbolo. Con tres, cada vuelta desplaza el
              triple, y el régimen necesario es la tercera parte.
        pista: |
          El caudal es proporcional al régimen:
          $N = Q_u/(\eta_v\cdot 3\cdot V)$.
        desarrollo: |
          $$
          N = \frac{12\ \text{l/min}}{0{,}95\cdot 3\cdot 3{,}77\ \text{cm}^{3}}
          = 1117\ \text{rpm}
          $$

          O, por proporción, $1450\cdot 12/15{,}58 = 1117$ rpm. Es lo que hace
          un variador de frecuencia en el motor.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Es de desplazamiento positivo: solo sube la presión del agua, y el
              caudal lo fijan la cilindrada y el régimen, no la presión.
          - texto: >-
              Tres émbolos de 3,77 cm³ a 1450 rpm desplazan 16,40 l/min, y con
              el rendimiento volumétrico salen 15,58 reales.
          - texto: >-
              Los tres ciclos desfasados hacen el suministro menos irregular que
              el de un solo émbolo, que empuja a golpes.
          - texto: >-
              Para 12 l/min se baja el régimen a 1117 rpm: el caudal va con el
              régimen, y la presión la sigue poniendo la instalación.
          - texto: >-
              También se podría cerrar un poco una válvula en la impulsión, que
              es más barato y con una bomba de émbolos da el mismo resultado que
              con una turbobomba.
            trampa: true
            mensaje: |
              Con una bomba de émbolos no da el mismo resultado: su curva es
              casi vertical, así que al estrangular el caudal apenas baja y la
              **presión sube** hasta que abre la válvula de seguridad o algo
              cede. Se regula con el régimen de giro o con la cilindrada.

    resolucion: |
      **a) Qué sube, y por qué tres émbolos.** Solo la energía de **presión**:
      es de desplazamiento positivo, el émbolo encierra el agua y la empuja, y
      Pascal transmite la presión. Los tres émbolos desfasados corrigen su
      defecto de fábrica, el suministro irregular: mientras uno aspira, otro
      impulsa. Y es alternativa y no rotativa porque bombea agua: las
      rotativas piden líquidos viscosos, que hagan de lubricante.

      **b) El caudal real.**

      $$
      Q_u = 0{,}95\cdot 3\cdot\frac{\pi\cdot 0{,}02^{2}}{4}\cdot 0{,}012\cdot 1450
      = 15{,}58\ \text{l/min}
      $$

      **c) Doce litros por minuto.** El caudal es proporcional al régimen, así
      que hay que girar a $1450\cdot 12/15{,}58 = $ **1117 rpm**. Cerrar una
      válvula de la impulsión no lo consigue: la curva de una bomba de
      desplazamiento positivo es casi vertical, el caudal apenas cambia y la
      presión sube hasta que abre la válvula de seguridad. Por eso se regula
      con el régimen de giro o con la cilindrada.

      **Lo que hay que llevarse.** Poco caudal a mucha presión: quince litros
      por minuto que llevan casi 4 kW. Ese es el nicho de las alternativas, y
      su curva vertical es la razón de las dos cosas que las distinguen de una
      turbobomba: no se estrangulan y llevan válvula de seguridad.
