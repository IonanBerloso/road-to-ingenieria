ejercicios:
  # ── NUESTROS (§08). La colección no tiene capítulo para este tema: sus
  #    problemas de viscosidad son ya de pérdidas de carga y viven en el
  #    capítulo 6, es decir en los temas 18 y 19. Los dos de aquí existen para
  #    fijar las dos ideas que el tema 18 da por sabidas: el Reynolds crítico
  #    y la longitud característica de la capa límite.
  - id: ejflu17-cuando-el-agua-deja-de-ser-laminar
    titulo: A qué velocidad deja de ser laminar el agua, y a cuál el aceite
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por un tubo de $40\ \text{mm}$ de diámetro circula primero agua a
      $20\ °\text{C}$ ($\nu = 10^{-6}\ \text{m}^{2}/\text{s}$) y después un
      aceite ($\nu = 10^{-4}\ \text{m}^{2}/\text{s}$).

      a) Clasificar el régimen del aceite cuando circula a $1\ \text{m/s}$.

      b) Calcular, para cada fluido, la velocidad a la que el flujo deja de
      ser laminar.
    pide: El régimen del aceite y las dos velocidades críticas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con los mismos tubo y velocidad, ¿por qué el aceite puede ir laminar
          y el agua no?
        opciones:
          - texto: >-
              Porque el Reynolds lleva la viscosidad dividiendo: más viscoso,
              menos Reynolds, y las fuerzas viscosas dominan durante más rango
            correcta: true
            mensaje: |
              Eso es. $Re = vD/\nu$, y el aceite tiene una viscosidad cien
              veces mayor, así que su Reynolds es cien veces menor en las
              mismas condiciones.
          - texto: >-
              Porque el aceite es más denso y pesa más
            mensaje: |
              La densidad ya está dentro de la viscosidad cinemática
              ($\nu = \mu/\rho$), y además un aceite es **menos** denso que el
              agua, no más. Lo que lo hace laminar es su viscosidad, no su
              peso.
          - texto: >-
              Porque el aceite no moja la pared igual y no hay condición de no
              deslizamiento
            mensaje: |
              La condición de no deslizamiento se cumple con todo fluido y
              toda pared: el fluido en contacto con el sólido tiene su misma
              velocidad, siempre. No es ahí donde está la diferencia.

      - tipo: calcular
        titulo: El Reynolds del aceite
        pregunta: |
          ¿Qué número de Reynolds tiene el aceite a $1\ \text{m/s}$?
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 1
          formato: un número sin unidades
        distractores:
          - valor: '40000'
            mensaje: |
              Has usado la viscosidad del agua. El aceite del enunciado tiene
              $\nu = 10^{-4}$, cien veces más: ese $40.000$ es el Reynolds del
              **agua**, y sí es turbulento.
          - valor: '16000'
            mensaje: |
              Has metido el diámetro en milímetros. En un adimensional todo va
              en el mismo sistema: $40\ \text{mm} = 0{,}04\ \text{m}$.
        pista: |
          $Re = vD/\nu$, con el diámetro en metros.
        desarrollo: |
          $$
          Re = \frac{v\,D}{\nu} = \frac{1\cdot 0{,}04}{10^{-4}} = 400
          $$

          Muy por debajo de 2000: **laminar**, y con holgura.

      - tipo: calcular
        titulo: La velocidad crítica del agua
        pregunta: |
          ¿A qué velocidad deja el agua de ser laminar en ese mismo tubo?
        respuesta:
          tipo: magnitud
          valor: '0.05 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '5 m/s'
            mensaje: |
              Ese es el valor del **aceite**. Con $\nu = 10^{-6}$ el resultado
              es cien veces menor: cinco centímetros por segundo, que es lo
              sorprendente de este ejercicio.
          - valor: '0.1 m/s'
            mensaje: |
              Has usado $Re = 4000$, que es la frontera de arriba. El flujo
              **deja de ser laminar** en 2000; entre 2000 y 4000 no es
              turbulento todavía, está en la zona crítica.
        pista: |
          Deja de ser laminar en $Re = 2000$. Despeja $v = Re\,\nu/D$.
        desarrollo: |
          $$
          v = \frac{Re\,\nu}{D} = \frac{2000\cdot 10^{-6}}{0{,}04}
          = 0{,}05\ \text{m/s}
          $$

          Cinco centímetros por segundo. Con el aceite,
          $v = 2000\cdot 10^{-4}/0{,}04 = 5\ \text{m/s}$: cien veces más.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El régimen lo fija el Reynolds, y con el mismo tubo y la misma
              velocidad solo cambia con la viscosidad cinemática del fluido.
          - texto: >-
              El agua deja de ser laminar a 5 cm/s y el aceite a 5 m/s: cien
              veces más, tantas como veces más viscoso es.
          - texto: >-
              De ahí que en las conducciones de agua reales el régimen sea
              siempre turbulento, y que el laminar quede para aceites y tubos
              capilares.
          - texto: >-
              Como el agua es turbulenta casi siempre, en ella no existe
              régimen laminar en ningún punto de la sección.
            trampa: true
            mensaje: |
              Pegada a la pared queda siempre la **subcapa laminar**, por muy
              turbulento que sea el resto. Es finísima —una décima de
              milímetro en una tubería de 100 mm— y es la que decide si el
              tubo se comporta como liso o como rugoso en el tema 18.

    resolucion: |
      **El régimen del aceite.**

      $$
      Re = \frac{v D}{\nu} = \frac{1 \cdot 0{,}04}{10^{-4}} = 400
      $$

      Por debajo de 2000: laminar.

      **Las dos velocidades críticas.** Despejando de $Re = 2000$:

      $$
      v_{\text{agua}} = \frac{2000\cdot 10^{-6}}{0{,}04} = 0{,}05\ \text{m/s}
      \qquad
      v_{\text{aceite}} = \frac{2000\cdot 10^{-4}}{0{,}04} = 5\ \text{m/s}
      $$

      **Lo que hay que llevarse.** Cinco centímetros por segundo es menos que
      lo que baja el agua por un desagüe. En cualquier conducción real —una
      acometida, un riego, una red— el agua va **siempre turbulenta**, y por
      eso el resto de la asignatura se dedica casi entero a ese régimen. El
      laminar aparece con aceites, con tubos capilares y poco más.

      Y ojo con la frontera que se usa: **el laminar se acaba en 2000**. Entre
      2000 y 4000 no hay turbulencia establecida, hay zona crítica, y ahí no
      se diseña.

  - id: ejflu17-donde-se-vuelve-turbulenta-la-capa-limite
    titulo: Dónde se vuelve turbulenta la capa límite de una placa
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Sobre una placa plana de $2\ \text{m}$ de longitud incide aire a
      $20\ °\text{C}$ ($\nu = 1{,}5\cdot 10^{-5}\ \text{m}^{2}/\text{s}$) con
      una velocidad de $10\ \text{m/s}$, paralelo a la placa.

      Tomando $Re_x = 5\cdot 10^{5}$ como valor de transición, calcular a qué
      distancia del borde de ataque la capa límite pasa de laminar a
      turbulenta.
    pide: La distancia al borde de ataque donde la capa límite cambia de régimen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué longitud característica lleva el Reynolds en este problema?
        opciones:
          - texto: >-
              La distancia $x$ desde el borde de ataque, que es la incógnita
            correcta: true
            mensaje: |
              Exacto. En flujo externo sobre una placa no hay diámetro: la
              longitud característica es lo que el fluido lleva recorrido
              sobre la placa, y por eso el Reynolds **crece a lo largo** de
              ella.
          - texto: >-
              El espesor $\delta$ de la capa límite
            mensaje: |
              El espesor es consecuencia, no dato: crece con $x$ y no se
              conoce de antemano. La longitud característica es la distancia
              recorrida.
          - texto: >-
              La longitud total de la placa, 2 m
            mensaje: |
              Con la longitud total sale el Reynolds **al final** de la placa,
              que sirve para saber si llega a transitar, pero no dónde. Lo que
              se pregunta es la posición del cambio, así que $x$ es la
              incógnita.

      - tipo: calcular
        titulo: La abscisa de transición
        pregunta: |
          ¿A qué distancia del borde de ataque transita la capa límite?
        respuesta:
          tipo: magnitud
          valor: '0.75 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '3 m'
            mensaje: |
              Has usado $Re_x = 2\cdot 10^{6}$ o has multiplicado donde había
              que dividir. Comprueba el despeje: $x = Re_x\,\nu/v$, y fíjate
              en que el resultado tiene que caber dentro de los 2 m de placa.
          - valor: '0.15 m'
            mensaje: |
              Has usado $Re = 10^{5}$, que es la frontera de Blasius del tema
              18, no la de transición de la capa límite. Aquí el valor es
              $5\cdot 10^{5}$.
        pista: |
          $Re_x = vx/\nu$. Despeja $x$ y comprueba que cabe en la placa.
        desarrollo: |
          $$
          x = \frac{Re_x\,\nu}{v} = \frac{5\cdot 10^{5}\cdot 1{,}5\cdot 10^{-5}}{10}
          = 0{,}75\ \text{m}
          $$

          Cabe dentro de los 2 m, así que la placa tiene los dos regímenes: los
          primeros 75 cm con capa límite laminar y el resto turbulenta.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              En flujo externo la longitud característica es la distancia $x$
              recorrida sobre la placa, así que el Reynolds crece a lo largo
              de ella.
          - texto: >-
              Con $Re_x = 5\cdot 10^{5}$ la transición cae en $x = 0{,}75$ m, y
              como la placa mide 2 m, sobre ella conviven los dos regímenes.
          - texto: >-
              A partir de esa abscisa la capa es turbulenta, pero pegada a la
              placa se forma una subcapa laminar, porque la pared impide el
              movimiento transversal.
          - texto: >-
              Al aumentar la velocidad del aire, la transición se retrasaría y
              el tramo laminar sería más largo.
            trampa: true
            mensaje: |
              Al revés. $x = Re_x\nu/v$: si $v$ sube, $x$ **baja** y la
              transición se adelanta. Más velocidad es más Reynolds en cada
              punto, y la turbulencia aparece antes, no después.

    resolucion: |
      **La longitud característica.** En una placa no hay diámetro. Lo que
      hace de longitud es la distancia $x$ recorrida desde el borde de ataque,
      de modo que el Reynolds **no es un número del problema sino una función
      de la posición**: crece según avanza el fluido.

      **El cálculo.**

      $$
      Re_x = \frac{v\,x}{\nu} = 5\cdot 10^{5}
      \;\Longrightarrow\;
      x = \frac{5\cdot 10^{5}\cdot 1{,}5\cdot 10^{-5}}{10} = 0{,}75\ \text{m}
      $$

      **La lectura.** La placa mide 2 m, así que sobre ella conviven los dos
      regímenes: capa límite laminar en los primeros 75 cm y turbulenta en el
      resto. Y en toda la zona turbulenta sigue habiendo, pegada a la placa,
      una **subcapa laminar**, porque la pared impide el movimiento
      transversal que la turbulencia necesita.

      El valor $5\cdot 10^{5}$ es un extremo del intervalo: los ensayos dan la
      transición entre $5\cdot 10^{5}$ y $10^{6}$ según lo limpia que esté la
      corriente. Con $10^{6}$ la transición caería en 1,5 m, todavía dentro de
      la placa.
