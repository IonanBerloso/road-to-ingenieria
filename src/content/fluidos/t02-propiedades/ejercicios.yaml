ejercicios:
  # ── El primero es NUESTRO (§08). La colección abre el capítulo con una placa
  #    entre DOS superficies, que exige sumar dos gradientes distintos; antes
  #    de eso hace falta haber aplicado la ley de Newton una sola vez.
  - id: ejflu2-la-ley-de-newton-una-sola-vez
    titulo: Una placa, un hueco y la ley de Newton
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una placa de $0{,}4\ \text{m}^{2}$ se desliza sobre una superficie fija
      a $1{,}5\ \text{m/s}$, separada de ella por una película de aceite de
      $2\ \text{mm}$ de espesor y viscosidad dinámica
      $\mu = 0{,}2\ \text{Pl}$.

      Suponiendo que el perfil de velocidades es lineal, calcular la fuerza
      necesaria para mantener el movimiento y la potencia disipada.
    pide: La fuerza de arrastre y la potencia, con sus unidades.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «perfil de velocidades lineal». ¿Qué permite hacer
          esa hipótesis?
        opciones:
          - texto: >-
              Sustituir la derivada por un cociente:
              $dv/dy = v/y = 1{,}5/0{,}002$, sin integrar nada
            correcta: true
            mensaje: |
              Eso es. La ley de Newton está escrita con una derivada, pero si
              la velocidad varía linealmente entre $0$ y $v$ a lo largo del
              espesor, la derivada es constante y vale $v/y$. Sin esa
              hipótesis habría que conocer el perfil.
          - texto: >-
              Suponer que la viscosidad es constante
            mensaje: |
              La viscosidad es un dato del enunciado y no depende del perfil:
              depende del fluido y de su temperatura. Lo que la linealidad
              permite es cambiar la derivada por un cociente.
          - texto: >-
              Despreciar el rozamiento con el aire
            mensaje: |
              Eso se desprecia siempre en estos problemas, con perfil lineal
              o sin él. La hipótesis sirve para calcular el gradiente.

      - tipo: calcular
        titulo: El gradiente de velocidad
        pregunta: |
          ¿Cuánto vale $dv/dy$?
        respuesta:
          tipo: magnitud
          valor: '750 s^-1'
          tolerancia: 0.01
          formato: una velocidad de deformación, con su unidad
        distractores:
          - valor: '0.75 s^-1'
            mensaje: |
              Has dividido por $2$ en vez de por $0{,}002$: el espesor está en
              milímetros y hay que pasarlo a metros. Un factor mil.
          - valor: '3 s^-1'
            mensaje: |
              Eso es $1{,}5 \cdot 2$. El gradiente es la velocidad **entre** el
              espesor, no por él.
        pista: |
          v entre y, con el espesor en metros: 1,5 / 0,002.
        desarrollo: |
          $$
          \frac{dv}{dy} = \frac{v}{y} = \frac{1{,}5}{0{,}002} = 750\ \text{s}^{-1}
          $$

          Fíjate en la unidad: **el gradiente de velocidad es un inverso de
          tiempo**, porque son m/s divididos por m. Por eso también se llama
          «velocidad de deformación angular» y se mide en rad/s.

      - tipo: calcular
        titulo: La fuerza
        pregunta: |
          Con la ley de Newton, ¿qué fuerza hay que hacer?
        respuesta:
          tipo: magnitud
          valor: '60 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '150 N'
            mensaje: |
              Eso es la tensión cortante $\tau = \mu\,dv/dy = 150\ \text{Pa}$,
              que es fuerza **por unidad de área**. Falta multiplicar por los
              $0{,}4\ \text{m}^{2}$.
          - valor: '0.06 N'
            mensaje: |
              Te has dejado el factor mil del espesor en milímetros. Con
              $y = 0{,}002\ \text{m}$ salen $60\ \text{N}$.
        pista: |
          F = μ·A·(dv/dy), con las tres cosas en unidades del SI.
        desarrollo: |
          $$
          F = \mu\,A\,\frac{dv}{dy} = 0{,}2 \cdot 0{,}4 \cdot 750 = 60\ \text{N}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Perfil lineal: $dv/dy = v/y = 1{,}5/0{,}002 = 750\ \text{s}^{-1}$.
          - texto: >-
              Ley de Newton: $\tau = \mu\,dv/dy = 0{,}2 \cdot 750 = 150\ \text{Pa}$.
          - texto: >-
              La fuerza es la tensión por el área:
              $F = 150 \cdot 0{,}4 = 60\ \text{N}$.
          - texto: >-
              Potencia disipada: $P = F\,v = 60 \cdot 1{,}5 = 90\ \text{W}$.
          - texto: >-
              Comprobación dimensional: $\text{Pl} \cdot \text{m}^{2} \cdot \text{s}^{-1}
              = \text{Pa·s} \cdot \text{m}^{2}/\text{s} = \text{N}$ ✓.
          - texto: >-
              Si se duplicara el espesor de la película, la fuerza también se
              duplicaría, porque hay el doble de aceite que arrastrar.
            trampa: true
            mensaje: |
              Al revés: el espesor está **dividiendo**, así que al duplicarlo
              la fuerza se reduce a la mitad. Cuanta más película, más suave
              es el gradiente y menos cuesta deslizar — que es exactamente
              para lo que sirve engrasar.

    resolucion: |
      **El gradiente**, con perfil lineal:

      $$
      \frac{dv}{dy} = \frac{1{,}5}{0{,}002} = 750\ \text{s}^{-1}
      $$

      **La fuerza**, por la ley de Newton de la viscosidad:

      $$
      \tau = \mu\,\frac{dv}{dy} = 0{,}2 \cdot 750 = 150\ \text{Pa}
      \qquad
      \boxed{F = \tau\,A = 150 \cdot 0{,}4 = 60\ \text{N}}
      $$

      **La potencia** es la fuerza por la velocidad a la que se aplica:

      $$
      \boxed{P = F\,v = 60 \cdot 1{,}5 = 90\ \text{W}}
      $$

      > **Las tres cosas que hay que tener claras antes del siguiente
      > ejercicio.** Que el gradiente es $v/y$ y se mide en s⁻¹; que $\tau$ es
      > fuerza por unidad de área y $F$ no; y que el espesor va en metros.
      > Con dos superficies en vez de una, lo único que cambia es que hay
      > **dos** gradientes y las fuerzas se suman.

  - id: ejflu2-col12-la-placa-entre-dos-superficies
    titulo: La placa que roza por las dos caras
    fuente: >-
      Ejercicio 1.2 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Dos superficies planas de grandes dimensiones están separadas
      $32\ \text{mm}$ y el espacio entre ellas está lleno con un líquido cuya
      viscosidad es de $0{,}15\ \text{Poise}$. Suponiendo que el gradiente de
      velocidades es lineal, se pide:

      a) ¿Qué fuerza en daN se requiere para arrastrar una placa de muy poco
      espesor y $0{,}5\ \text{m}^{2}$ de área a la velocidad constante de
      $20\ \text{cm/s}$, si la placa dista $10\ \text{mm}$ de una de las
      superficies?

      b) ¿Cuál es la potencia disipada en watio? Razónese todo lo que se haga.
    pide: La fuerza en decanewtons y la potencia en vatios.

    pasos:
      - tipo: reconocer
        pregunta: |
          La placa está a $10\ \text{mm}$ de una superficie. ¿Y de la otra?
        opciones:
          - texto: >-
              A $22\ \text{mm}$, y las dos películas frenan a la vez: hay que
              calcular dos fuerzas y sumarlas
            correcta: true
            mensaje: |
              Eso es. $32 - 10 = 22\ \text{mm}$. Los dos huecos tienen
              gradientes distintos —$0{,}2/0{,}01$ y $0{,}2/0{,}022$— y las
              dos fuerzas van en el mismo sentido: contra el movimiento.
          - texto: >-
              También a $10\ \text{mm}$: la placa va por el centro
            mensaje: |
              Solo si estuviera centrada, y el enunciado dice explícitamente
              que dista 10 mm de **una** de las superficies. Los 32 mm totales
              dejan 22 al otro lado. Si fuera simétrico, el dato de los 10 mm
              sobraría.
          - texto: >-
              A $32\ \text{mm}$, que es la separación dada
            mensaje: |
              Los $32\ \text{mm}$ son la separación entre las dos superficies
              fijas, no entre la placa y la segunda. Restando: $22\ \text{mm}$.

      - tipo: calcular
        titulo: La fuerza total
        pregunta: |
          Sumando las dos contribuciones, ¿qué fuerza hay que hacer?
        respuesta:
          tipo: magnitud
          valor: '0.218 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '0.15 N'
            mensaje: |
              Esa es solo la película de $10\ \text{mm}$
              ($0{,}015 \cdot 0{,}5 \cdot 20 = 0{,}15\ \text{N}$). Falta la de
              $22\ \text{mm}$, que aporta otros $0{,}068\ \text{N}$.
          - valor: '2.18 N'
            mensaje: |
              Un factor diez: la viscosidad son $0{,}15$ **poises**, es decir
              $0{,}015\ \text{Pl}$. Con $0{,}15\ \text{Pl}$ saldría diez veces
              más.
        pista: |
          F = μ·A·(v/l₁ + v/l₂), con μ en Pl y los huecos en metros.
        desarrollo: |
          $$
          F = \mu\,A\left(\frac{v}{l_1}+\frac{v}{l_2}\right)
          = 0{,}015 \cdot 0{,}5\left(\frac{0{,}2}{0{,}01}+\frac{0{,}2}{0{,}022}\right)
          $$
          $$
          = 0{,}0075\,(20 + 9{,}09) = 0{,}218\ \text{N} = 0{,}0218\ \text{daN}
          $$

      - tipo: calcular
        titulo: La potencia disipada
        pregunta: |
          ¿Cuánta potencia se disipa?
        respuesta:
          tipo: magnitud
          valor: '0.0436 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1.09 W'
            mensaje: |
              Has multiplicado por $5$ o dividido por la velocidad. La
              potencia es $P = F\,v = 0{,}218 \cdot 0{,}2$.
          - valor: '0.218 W'
            mensaje: |
              Ese es el número de la fuerza. Para la potencia falta
              multiplicar por la velocidad, $0{,}2\ \text{m/s}$.
        pista: |
          P = F·v, con la fuerza que acabas de calcular.
        desarrollo: |
          $$
          P = F\,v = 0{,}218 \cdot 0{,}2 = 0{,}0436\ \text{W}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $0{,}15\ \text{P} = 0{,}015\ \text{Pl}$; $v = 0{,}2\ \text{m/s}$;
              $l_1 = 0{,}01\ \text{m}$ y $l_2 = 0{,}022\ \text{m}$.
          - texto: >-
              Cada cara aporta $\mu A v/l$: los dos gradientes son distintos
              porque los huecos lo son.
          - texto: >-
              $F = 0{,}0075\,(20+9{,}09) = 0{,}218\ \text{N}$, que en
              decanewtons son $0{,}0218\ \text{daN}$.
          - texto: >-
              $P = F v = 0{,}0436\ \text{W}$.
          - texto: >-
              El espesor de la placa no interviene porque el enunciado dice
              que es muy pequeño.
          - texto: >-
              Como la placa está más cerca de una superficie que de la otra,
              hay que usar la media de los dos huecos, $16\ \text{mm}$.
            trampa: true
            mensaje: |
              Promediar los huecos daría $2\mu A v/0{,}016 = 0{,}1875\ \text{N}$,
              y la respuesta es $0{,}218$. No se puede promediar porque la
              fuerza depende de $1/l$, no de $l$: la media de los inversos no
              es el inverso de la media.

    resolucion: |
      **a) La fuerza.** La placa arrastra líquido por sus dos caras, y los dos
      huecos son distintos: $10\ \text{mm}$ y $32-10 = 22\ \text{mm}$.

      $$
      F = \mu A\left(\frac{v}{l_1}+\frac{v}{l_2}\right)
      = 0{,}015 \cdot 0{,}5\left(\frac{0{,}2}{0{,}01}+\frac{0{,}2}{0{,}022}\right)
      = \boxed{0{,}218\ \text{N} = 0{,}0218\ \text{daN}}
      $$

      **b) La potencia.**

      $$
      \boxed{P = F\,v = 0{,}218 \cdot 0{,}2 = 0{,}0436\ \text{W}}
      $$

      > **Dos avisos de unidades en un solo ejercicio.** La viscosidad viene
      > en poises (÷10 para pasar a Pl), la velocidad en cm/s (÷100) y la
      > respuesta se pide en daN (÷10 desde newtons). Ninguna de las tres
      > conversiones está avisada en el enunciado, y las tres se cazan igual:
      > escribiendo la unidad en cada paso.

  # ── COLECCIÓN 1.3. Tres cilindros coaxiales: el caso donde hay DOS huelgos
  #    y el par se reparte entre los dos. Es el error de contabilidad del
  #    capítulo.
  - id: ejflu2-col13-los-tres-cilindros-coaxiales
    titulo: Tres cilindros coaxiales, y dos huelgos que frenan a la vez
    fuente: >-
      Ejercicio 1.3 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se requiere un par de torsión de $4\ \text{N}\cdot\text{m}$ para hacer
      girar el cilindro intermedio de la figura a $30\ \text{rpm}$. Los
      cilindros 1 y 2 están fijos. Todos los cilindros tienen
      $450\ \text{mm}$ de longitud. Despreciar los efectos de extremo y el
      espesor del cilindro intermedio ($e = 0$). Calcular la viscosidad
      dinámica del aceite.

      Datos: $R = 0{,}15\ \text{m}$; $e_1 = e_2 = 3\ \text{mm}$.

      <figure class="figura-examen">
      <svg viewBox="20 20 456 200" role="img" width="440" height="193"
           aria-labelledby="fc13t fc13d">
        <title id="fc13t">Los tres cilindros coaxiales, en sección y de perfil</title>
        <desc id="fc13d">A la izquierda, la sección transversal: tres cilindros
        con el mismo eje. El intermedio, de radio R, es el que gira; los otros
        dos están fijos, uno por dentro y otro por fuera, separados del que
        gira por sendos huelgos de tres milímetros llenos de aceite. A la
        derecha, el mismo montaje de perfil: los tres cilindros tienen
        cuatrocientos cincuenta milímetros de longitud, y el aceite roza contra
        el cilindro intermedio por sus dos caras a la vez, la de dentro y la de
        fuera.</desc>

        <circle cx="126" cy="120" r="76" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="126" cy="120" r="58" fill="none" stroke="var(--live)" stroke-width="2.6"/>
        <circle cx="126" cy="120" r="40" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M126 120 m -76 0 a 76 76 0 0 1 152 0 a 76 76 0 0 1 -152 0
                 M126 120 m -58 0 a 58 58 0 0 0 116 0 a 58 58 0 0 0 -116 0"
              fill="var(--alt)" fill-opacity=".16" fill-rule="evenodd"/>
        <path d="M126 120 m -58 0 a 58 58 0 0 1 116 0 a 58 58 0 0 1 -116 0
                 M126 120 m -40 0 a 40 40 0 0 0 80 0 a 40 40 0 0 0 -80 0"
              fill="var(--alt)" fill-opacity=".16" fill-rule="evenodd"/>

        <path d="M160 78 A 58 58 0 0 1 172 106" fill="none" stroke="var(--live)"
              stroke-width="2" marker-end="url(#fc13g)"/>
        <text x="126" y="124" text-anchor="middle" font-size="10.5" fill="var(--faint)">30 rpm</text>

        <line x1="126" y1="120" x2="126" y2="44" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="132" y="60" font-size="11" fill="var(--faint)">R</text>
        <text x="126" y="212" text-anchor="middle" font-size="10" fill="var(--faint)">sección</text>

        <text x="216" y="72" font-size="10.5" fill="var(--alt)">e₁ = 3 mm (dentro)</text>
        <line x1="212" y1="68" x2="161" y2="85" stroke="var(--alt)" stroke-width="1"/>
        <text x="216" y="176" font-size="10.5" fill="var(--alt)">e₂ = 3 mm (fuera)</text>
        <line x1="212" y1="172" x2="173" y2="167" stroke="var(--alt)" stroke-width="1"/>

        <rect x="300" y="52" width="18" height="136" fill="var(--ink)" opacity=".7"/>
        <rect x="330" y="52" width="8" height="136" fill="var(--live)" opacity=".75"/>
        <rect x="350" y="52" width="18" height="136" fill="var(--ink)" opacity=".7"/>
        <rect x="318" y="52" width="12" height="136" fill="var(--alt)" fill-opacity=".2"/>
        <rect x="338" y="52" width="12" height="136" fill="var(--alt)" fill-opacity=".2"/>
        <line x1="386" y1="52" x2="386" y2="188" stroke="var(--faint)" stroke-width="1"/>
        <line x1="380" y1="52" x2="392" y2="52" stroke="var(--faint)" stroke-width="1"/>
        <line x1="380" y1="188" x2="392" y2="188" stroke="var(--faint)" stroke-width="1"/>
        <text x="396" y="124" font-size="10.5" fill="var(--faint)">450 mm</text>
        <text x="334" y="44" text-anchor="middle" font-size="10" fill="var(--live)">gira</text>
        <text x="334" y="204" text-anchor="middle" font-size="10" fill="var(--faint)">perfil</text>

        <defs>
          <marker id="fc13g" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      El cilindro que gira tiene aceite **por dentro y por fuera**, así que el
      par que hay que vencer es la suma de dos rozamientos, no uno. Y los dos
      huelgos miden lo mismo pero **los radios no**, de modo que las dos áreas
      tampoco: por eso no basta con multiplicar por dos.

      </figcaption>
      </figure>
    pide: La viscosidad dinámica del aceite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas superficies del cilindro intermedio están frenándolo?
        opciones:
          - texto: >-
              Las dos, la interior y la exterior, y cada una aporta su propio
              esfuerzo cortante al par
            correcta: true
            mensaje: |
              Eso es, y es de lo que va el ejercicio. Al despreciar el espesor
              del cilindro intermedio, las dos superficies tienen el mismo
              radio y la misma área, así que cada una aporta la mitad del par.
              Contar una sola duplica la viscosidad.
          - texto: >-
              Solo la exterior, que es la que tiene más área
            mensaje: |
              El enunciado dice expresamente que el espesor del cilindro
              intermedio es nulo, así que las dos superficies tienen
              exactamente el mismo radio y la misma área. Y aunque no lo
              fuera, las dos rozan.
          - texto: >-
              Solo la interior, porque el aceite exterior gira con el cilindro
            mensaje: |
              El cilindro 2, el exterior, está **fijo**. El aceite del huelgo
              exterior tiene una cara moviéndose y otra quieta, igual que el
              del interior: hay gradiente de velocidad y hay esfuerzo cortante.

      - tipo: calcular
        titulo: La viscosidad
        pregunta: |
          ¿Cuánto vale la viscosidad dinámica del aceite?
        respuesta:
          tipo: magnitud
          valor: '0.2 pl'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.4 pl'
            mensaje: |
              Has contado un solo huelgo. Con las dos superficies frenando, el
              par disponible se reparte entre las dos y la viscosidad que hace
              falta es la mitad.
          - valor: '0.021 pl'
            mensaje: |
              Has usado las 30 revoluciones por minuto como si fueran rad/s.
              $\omega = 30\cdot 2\pi/60 = \pi\ \text{rad/s}$, así que la
              velocidad periférica es $\pi\cdot 0{,}15 = 0{,}471\ \text{m/s}$.
        pista: |
          $M = 2\,\tau\,(2\pi R L)\,R$, con $\tau = \mu\,V/e$ y
          $V = \omega R$.
        desarrollo: |
          $$
          V = \omega R = \frac{30\cdot 2\pi}{60}\cdot 0{,}15
          = 0{,}471\ \text{m/s}
          $$
          $$
          M = \mu\left(\frac{V}{e_1}+\frac{V}{e_2}\right) 2\pi R L\cdot R
          = \mu\cdot 2\,\frac{V}{e}\,2\pi R^{2}L
          $$
          $$
          \mu = \frac{4}{2\cdot\dfrac{0{,}471}{0{,}003}\cdot 2\pi\cdot
          0{,}15^{2}\cdot 0{,}45} = 0{,}20\ \text{Pl} = 2\ \text{P}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro intermedio arrastra aceite por sus dos caras, y como
              su espesor es nulo, las dos tienen el mismo radio y la misma
              área.
          - texto: >-
              Cada cara aporta $\tau = \mu V/e$ sobre $2\pi R L$, y el par de
              cada una es esa fuerza por $R$.
          - texto: >-
              Igualando la suma de los dos pares a los 4 N·m sale
              $\mu = 0{,}20$ Pl, es decir 2 poises.
          - texto: >-
              Si el huelgo exterior fuese el doble que el interior, el par
              necesario sería el doble, porque hay más aceite que arrastrar.
            trampa: true
            mensaje: |
              Al revés: el esfuerzo cortante va con $1/e$, así que un huelgo
              **más ancho** frena **menos**. Con $e_2 = 6$ mm el par bajaría a
              $3\ \text{N}\cdot\text{m}$. Lo que resiste no es la cantidad de
              aceite, es el gradiente de velocidad.

    resolucion: |
      **La clave está en el dibujo, no en la fórmula.** El cilindro que gira
      tiene aceite por dentro y por fuera, y los dos huelgos lo frenan. Como el
      enunciado anula el espesor del cilindro intermedio, las dos superficies
      comparten radio y área.

      **La velocidad periférica.**

      $$
      V = \omega R = \pi\cdot 0{,}15 = 0{,}471\ \text{m/s}
      $$

      **El par, sumando las dos caras.**

      $$
      M = \mu\,\frac{2V}{e}\,2\pi R^{2} L
      \;\Longrightarrow\;
      \mu = \frac{M\,e}{4\pi R^{2} L\, V}
      = \frac{4\cdot 0{,}003}{4\pi\cdot 0{,}0225\cdot 0{,}45\cdot 0{,}471}
      = 0{,}20\ \text{Pl}
      $$

      Es decir **2 poises**, que es el orden de un aceite ligero.

      **El error que este ejercicio existe para provocar** es contar un solo
      huelgo: sale 0,4 Pl, el doble, y el número sigue pareciendo un aceite
      razonable. La comprobación es de dibujo: cuenta las superficies mojadas
      que se mueven respecto de su vecina.

  - id: ejflu2-col14-el-cojinete-de-dos-cilindros
    titulo: El cojinete, con dos superficies frenando a la vez
    fuente: >-
      Ejercicio 1.4 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa (UPV/EHU)
      · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Se tiene el cojinete que muestra la figura, que consta de dos cilindros
      coaxiales con un aceite de densidad relativa $0{,}95$ entre ambos. Se
      pide:

      **a)** Viscosidad dinámica del aceite.
      **b)** Viscosidad cinemática del aceite.
      **c)** Potencia disipada en el proceso.
      **d)** Velocidad angular de deformación del aceite.

      Datos: velocidad de giro del cilindro exterior $= 90$ rpm; ídem del
      interior $= 0$; par de torsión $= 0{,}04$ mkg.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 268" role="img" aria-labelledby="fc14t fc14d">
        <title id="fc14t">Media sección del cojinete de dos cilindros coaxiales</title>
        <desc id="fc14d">Media sección vertical del cojinete, con el eje de giro a la izquierda. El cilindro interior, fijo, tiene 50 milímetros de radio y 200 de altura. Alrededor de él, el cilindro exterior gira a 90 revoluciones por minuto y deja dos huelgos llenos de aceite: 0,2 milímetros en el lateral y 1 milímetro bajo la base. Los dos huelgos están dibujados mucho más anchos de lo que son para que se vean. El aceite frena por la superficie lateral y por la base a la vez, y por eso el par tiene dos sumandos.</desc>

        <line x1="70" y1="26" x2="70" y2="252" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="9 4 3 4"/>
        <text x="70" y="20" font-size="9" text-anchor="middle" fill="var(--faint)">eje</text>

        <rect x="70" y="60" width="180" height="140" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <text x="160" y="126" font-size="11" text-anchor="middle" fill="var(--ink)">cilindro interior</text>
        <text x="160" y="142" font-size="10" text-anchor="middle" fill="var(--faint)">fijo</text>

        <rect x="250" y="60" width="16" height="140" fill="var(--live)" opacity=".22"/>
        <rect x="70" y="200" width="196" height="20" fill="var(--live)" opacity=".22"/>

        <path d="M266 60 L282 60 L282 236 L70 236 L70 220 L266 220 Z" fill="var(--ink)" fill-opacity=".16" stroke="var(--ink)" stroke-width="2"/>
        <text x="296" y="196" font-size="10" fill="var(--ink)">cilindro exterior</text>
        <text x="296" y="210" font-size="10" fill="var(--faint)">gira</text>

        <line x1="70" y1="46" x2="250" y2="46" stroke="var(--faint)" stroke-width="1"/>
        <line x1="70" y1="42" x2="70" y2="50" stroke="var(--faint)" stroke-width="1"/>
        <line x1="250" y1="42" x2="250" y2="50" stroke="var(--faint)" stroke-width="1"/>
        <text x="160" y="39" font-size="10" text-anchor="middle" fill="var(--faint)">R = 50 mm</text>

        <line x1="376" y1="60" x2="376" y2="200" stroke="var(--faint)" stroke-width="1"/>
        <line x1="372" y1="60" x2="380" y2="60" stroke="var(--faint)" stroke-width="1"/>
        <line x1="372" y1="200" x2="380" y2="200" stroke="var(--faint)" stroke-width="1"/>
        <text transform="rotate(-90 392 130)" x="392" y="130" font-size="10" text-anchor="middle" fill="var(--faint)">L = 200 mm</text>

        <line x1="258" y1="80" x2="290" y2="66" stroke="var(--faint)" stroke-width="1"/>
        <text x="294" y="64" font-size="10" text-anchor="start" fill="var(--flag)">0,2 mm</text>
        <line x1="170" y1="210" x2="150" y2="252" stroke="var(--faint)" stroke-width="1"/>
        <text x="146" y="256" font-size="10" text-anchor="end" fill="var(--flag)">1 mm</text>

        <path d="M300 100 A 34 34 0 0 1 300 134" fill="none" stroke="var(--live)" stroke-width="2" marker-end="url(#fc14a)"/>
        <text x="322" y="121" font-size="10" text-anchor="start" fill="var(--live)">90 rpm</text>

        <defs>
          <marker id="fc14a" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      Media sección, con el eje a la izquierda. El cilindro exterior gira y el
      interior está quieto; el aceite, en verde, llena los dos huelgos. Por eso
      el par tiene **dos sumandos**, el de la superficie lateral y el de la
      base. Los dos huelgos van dibujados mucho más anchos de lo que son —0,2
      y 1 milímetro contra 50 de radio— porque a escala no se verían.

      </figcaption>
      </figure>
    pide: La viscosidad dinámica y cinemática, la potencia disipada y la velocidad angular de deformación.
    pasos:
      - tipo: reconocer
        pregunta: |
          El par medido, $0{,}04$ mkg, vence la resistencia del aceite. ¿Sobre
          qué superficies?
        opciones:
          - texto: >-
              Sobre la lateral y sobre la base, y hay que sumar los dos
              momentos
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue este ejercicio de un cilindro
              suelto. Hay aceite en el huelgo lateral **y** en el del fondo,
              así que $M_T = M_1 + M_2$. Olvidar el segundo da una viscosidad
              un 1 % alta; olvidar el primero, disparatada.
          - texto: Solo sobre la lateral, que es donde la velocidad es mayor
            mensaje: |
              La lateral aporta casi todo —aquí el 98 %— pero «casi todo» no
              es «todo». La base también tiene aceite y también se cizalla, y
              el enunciado da su huelgo precisamente para que la cuentes.
          - texto: Solo sobre la base, que es donde el huelgo es mayor
            mensaje: |
              Al revés: **más huelgo es menos tensión**, porque el gradiente
              $v/y$ baja. Y además la base tiene mucho menos brazo que la
              pared lateral, así que aporta lo de menos.
      - tipo: reconocer
        pregunta: |
          En la superficie lateral, ¿de qué depende el momento resistente?
        opciones:
          - texto: >-
              De $R^{3}$, porque la velocidad va con $R$, el área con $R$ y el
              brazo otra vez con $R$
            correcta: true
            mensaje: |
              Exacto, y por eso el radio manda tanto. $\tau = \mu\omega R/y$,
              el área lateral es $2\pi R L$ y el brazo es $R$: los tres
              factores lo llevan.
          - texto: De $R^{2}$, la velocidad por el área
            mensaje: |
              Falta el brazo. Estás calculando una **fuerza**, no un momento;
              para pasar de una a otro hay que multiplicar por $R$ otra vez.
          - texto: De $R$, solo por la velocidad periférica
            mensaje: |
              Eso es solo el primero de los tres factores. El área también
              crece con el radio, y el brazo también.
      - tipo: calcular
        titulo: La viscosidad dinámica
        pregunta: |
          Con $\omega = 3\pi$ rad/s y $M_T = 0{,}392$ m·N, ¿cuánto vale la
          viscosidad dinámica del aceite?
        respuesta:
          tipo: magnitud
          valor: 0.0514 Pl
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: 0.00162 Pl
            mensaje: |
              Has metido 90 rpm donde va $\omega$. En la ley de Newton la
              velocidad de la pared es $\omega R$ con $\omega$ en **radianes
              por segundo**: $90\cdot 2\pi/60 = 3\pi$, no 90. Sale una
              viscosidad treinta veces menor.
          - valor: 4.13 Pl
            mensaje: |
              Te has quedado en kilopondios. El par vale $0{,}04$ **mkg**, que
              son $0{,}04 \cdot 9{,}8 = 0{,}392$ m·N; sin esa conversión todo
              sale multiplicado por 9,8.
        pista: |
          $M_T = M_1 + M_2$, con
          $M_1 = \mu\,\omega\,R^{3}\,2\pi L/y_1$ y
          $M_2 = \mu\,\omega\,2\pi R^{4}/(4\,y_2)$. Despeja $\mu$.
        desarrollo: |
          Primero las unidades del par:

          $$
          M_T = 0{,}04\ \text{mkg} = 0{,}04 \cdot 9{,}8 = 0{,}392\ \text{m}\cdot\text{N}
          $$

          y el régimen, $\omega = 90 \cdot 2\pi/60 = 3\pi$ rad/s.

          **La superficie lateral.** La ley de Newton con perfil lineal en el
          huelgo da $\tau = \mu\,\omega R/y_1$, y el momento es esa tensión por
          el área lateral y por el brazo:

          $$
          M_1 = \mu\,\frac{\omega R^{2}}{y_1}\,(2\pi R L)
          = \mu\,\frac{3\pi\,(0{,}0502)^{3}\,2\pi\cdot 0{,}201}{0{,}2\cdot 10^{-3}}
          = 7{,}53\,\mu
          $$

          **La base.** Aquí la velocidad crece con el radio, así que hay que
          integrar $dM_2 = \mu\,(\omega r/y_2)\,(2\pi r\,dr)\,r$ de $0$ a $R$:

          $$
          M_2 = \frac{\mu\,\omega\,2\pi}{y_2}\int_0^{R} r^{3}dr
          = \frac{\mu\,\omega\,2\pi R^{4}}{4\,y_2}
          = 0{,}094\,\mu
          $$

          Sumando e igualando al par medido:

          $$
          0{,}392 = 7{,}53\,\mu + 0{,}094\,\mu
          \;\Longrightarrow\;
          \boxed{\mu = 0{,}0514\ \text{Pl}} = 0{,}514\ \text{poise}
          $$

          La base aporta el 1,2 % del par, no cero.
      - tipo: calcular
        titulo: La viscosidad cinemática
        pregunta: |
          ¿Y la viscosidad cinemática, en stokes?
        respuesta:
          tipo: numero
          valor: '0.541'
          tolerancia: 0.02
          formato: un número en stokes, sin la unidad
        distractores:
          - valor: '0.0000541'
            mensaje: |
              Eso está en m²/s, que es lo que sale directamente. Un stokes es
              un cm²/s, así que hay que multiplicar por $10^{4}$.
          - valor: '0.0514'
            mensaje: >-
              Has dividido por 1000 en vez de por 950. La densidad del aceite
              no es la del agua: la relativa es 0,95.
        pista: |
          $\nu = \mu/\rho$, con $\rho = 0{,}95 \cdot 1000$ kg/m³. Y un stokes
          es un centímetro cuadrado por segundo.
        desarrollo: |
          $$
          \nu = \frac{\mu}{\rho} = \frac{0{,}0514}{950}
          = 5{,}41\cdot 10^{-5}\ \text{m}^{2}/\text{s}
          = 0{,}541\ \text{St}
          $$

          El paso a stokes es $\times 10^{4}$, porque el stokes es cm²/s.
      - tipo: calcular
        titulo: La potencia disipada
        pregunta: |
          ¿Cuánta potencia se está disipando en el aceite?
        respuesta:
          tipo: magnitud
          valor: 3.69 W
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: 35.3 W
            mensaje: |
              Has usado 90 en vez de $\omega$. En $P = M\omega$ la velocidad va
              en **radianes por segundo**, no en revoluciones por minuto:
              $\omega = 3\pi = 9{,}42$ rad/s.
          - valor: 0.377 W
            mensaje: >-
              Ahí has vuelto a dejar el par en mkg. Con $0{,}392$ m·N sale
              3,69 W.
        pista: |
          Un par que gira disipa $P = M\,\omega$, con $\omega$ en rad/s.
        desarrollo: |
          $$
          P = M_T\,\omega = 0{,}392 \cdot 3\pi = 3{,}69\ \text{W}
          $$

          Toda esa potencia se convierte en calor dentro de la película de
          aceite. Es la razón de que un cojinete muy cargado necesite
          refrigeración.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              El par medido tiene que vencer dos resistencias, la de la
              superficie lateral y la de la base, así que $M_T = M_1 + M_2$.
          - texto: >-
              En la lateral la velocidad es la misma en todo el contorno, así
              que el momento sale sin integrar: tensión por área por brazo.
          - texto: >-
              En la base la velocidad crece con el radio, así que hay que
              integrar en $r$ y sale $2\pi R^{4}/(4y_2)$.
          - texto: >-
              Como el huelgo de la base es cinco veces mayor que el lateral,
              su momento es cinco veces mayor y domina el resultado.
            trampa: true
            mensaje: |
              Justo al revés en las dos cosas. Más huelgo es **menos** tensión,
              porque el gradiente $v/y$ baja; y además la base tiene mucho
              menos brazo que la pared. Su momento es el 1,2 % del total, no el
              dominante.
          - texto: >-
              Con los dos momentos escritos en función de $\mu$, la igualdad
              $M_T = M_1 + M_2$ deja una sola incógnita y se despeja.
    resolucion: |
      **La idea.** Un cojinete con aceite en dos huelgos frena por dos sitios,
      y el par medido es la suma de los dos momentos. Escribir los dos en
      función de $\mu$ deja una ecuación con una incógnita.

      **Los datos, en unidades del SI.** El par, $0{,}04$ mkg $= 0{,}392$ m·N.
      El régimen, $\omega = 90\cdot 2\pi/60 = 3\pi$ rad/s. Y la geometría de la
      figura: $R = 50{,}2$ mm, $y_1 = 0{,}2$ mm de huelgo lateral, $y_2 = 1$ mm
      bajo la base, $L = 200$ mm.

      **La superficie lateral.** La velocidad es la misma en todo el contorno,
      así que no hay que integrar: $M_1 = \mu\,(\omega R/y_1)(2\pi R L)\,R
      = 7{,}53\,\mu$.

      **La base.** Aquí la velocidad crece con el radio y sí hay que integrar,
      con $dA = 2\pi r\,dr$: $M_2 = \mu\,\omega\,2\pi R^{4}/(4y_2)
      = 0{,}094\,\mu$.

      **El despeje.** $0{,}392 = 7{,}624\,\mu$, luego
      $\mu = 0{,}0514$ Pl. De ahí, $\nu = \mu/\rho = 0{,}541$ St y
      $P = M\omega = 3{,}69$ W. La velocidad angular de deformación es el
      gradiente $\omega R/y$, que en la pared lateral vale
      $3\pi \cdot 0{,}0502/0{,}0002 \approx 2365$ s⁻¹ y en la base va de cero
      en el eje a $\omega R/y_2 \approx 473$ s⁻¹ en el borde.

      **Lo que hay que llevarse.** El sumando de la base vale el 1,2 % del par
      y aun así hay que ponerlo: el enunciado da su huelgo justamente porque
      cuenta. Y ojo con el mkg, que es la conversión que más veces estropea
      este ejercicio.

  # ── COLECCIÓN 1.5. Compresibilidad con la definición diferencial: el único
  #    del capítulo que obliga a integrar y a ver que, para variaciones
  #    pequeñas, el logaritmo y la fracción dan lo mismo.
  - id: ejflu2-col15-el-modulo-desde-la-densidad
    titulo: El módulo de elasticidad a partir de un cambio de densidad
    fuente: >-
      Ejercicio 1.5 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En un líquido, al aumentar su presión en $0{,}5\ \text{kg/cm}^{2}$ su
      densidad aumenta en un $0{,}02\ \%$. ¿Cuánto vale su módulo de
      elasticidad volumétrico en kPa?
    pide: El módulo de elasticidad volumétrico, en kilopascales.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es un aumento de **densidad**, no una reducción de volumen.
          ¿Cambia algo?
        opciones:
          - texto: >-
              No: como la masa es la misma, un aumento relativo de densidad es
              una reducción relativa de volumen del mismo tamaño
            correcta: true
            mensaje: |
              Eso es. De $\rho = m/V$ con $m$ constante sale
              $d\rho/\rho = -dV/V$, así que las dos formas del módulo son la
              misma: $K = \rho\,dp/d\rho = -V\,dp/dV$.
          - texto: >-
              Sí: con densidades hay que usar el módulo isotermo y con
              volúmenes el adiabático
            mensaje: |
              La distinción isotermo/adiabático depende del **proceso**, no de
              si se escribe con densidades o con volúmenes. Aquí ni siquiera
              hace falta: el enunciado da directamente el cambio medido.
          - texto: >-
              Sí: la densidad aumenta y el volumen también, así que el signo es
              el mismo
            mensaje: |
              Con la masa fija, si la densidad sube el volumen **baja**. Ese
              signo contrario es justo lo que hace que el módulo salga positivo
              en las dos formas.

      - tipo: calcular
        titulo: El módulo de elasticidad
        pregunta: |
          ¿Cuánto vale $K$, en kilopascales?
        respuesta:
          tipo: magnitud
          valor: '245000 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2500 kpa'
            mensaje: |
              Ese es el valor en $\text{kg/cm}^{2}$ con la etiqueta cambiada.
              Falta convertir: $1\ \text{kg/cm}^{2} = 9{,}8\cdot 10^{4}\
              \text{Pa} = 98\ \text{kPa}$.
          - valor: '24500 kpa'
            mensaje: |
              Has usado $0{,}2\ \%$ en vez de $0{,}02\ \%$. Un cero de más en
              la variación relativa divide el módulo por diez.
        pista: |
          $K = \dfrac{\Delta p}{\Delta\rho/\rho}$, y después de
          $\text{kg/cm}^{2}$ a kPa.
        desarrollo: |
          Partiendo de la definición diferencial e integrando con $K$
          constante:

          $$
          K = \rho\,\frac{dp}{d\rho}
          \;\Longrightarrow\;
          \Delta p = K\ln\frac{\rho_2}{\rho_1}
          \;\Longrightarrow\;
          K = \frac{\Delta p}{\ln(1{,}0002)}
          $$
          $$
          K = \frac{0{,}5}{2{,}0\cdot 10^{-4}} = 2500\ \text{kg/cm}^{2}
          $$
          $$
          K = 2500\cdot 9{,}8\cdot 10^{4}\ \text{Pa} = 2{,}45\cdot 10^{5}\ \text{kPa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la masa constante, el aumento relativo de densidad es igual a
              la disminución relativa de volumen.
          - texto: >-
              Integrando la definición con $K$ constante sale
              $\Delta p = K\ln(\rho_2/\rho_1)$, y con $\rho_2/\rho_1 =
              1{,}0002$ el logaritmo vale prácticamente $0{,}0002$.
          - texto: >-
              Resulta $K = 2500\ \text{kg/cm}^{2}$, que en kilopascales son
              $2{,}45\cdot 10^{5}$.
          - texto: >-
              Como el logaritmo y la fracción dan lo mismo, la forma
              logarítmica sobra siempre y basta con $K = \Delta p/(\Delta
              V/V)$.
            trampa: true
            mensaje: |
              Coinciden **porque la variación es diminuta**: para
              $x$ pequeño, $\ln(1+x)\approx x$. Con una compresión fuerte —un
              5 %, por ejemplo— el logaritmo y la fracción ya difieren en un
              2,5 %. La forma logarítmica es la exacta; la otra, una
              aproximación buena en el rango habitual.

    resolucion: |
      **Las dos formas del módulo son la misma.** Con la masa constante,
      $\rho V = \text{cte}$, así que $d\rho/\rho = -dV/V$ y

      $$
      K = -V\frac{dp}{dV} = \rho\frac{dp}{d\rho}
      $$

      **Integrando** con $K$ constante:

      $$
      \Delta p = K\ln\frac{\rho_2}{\rho_1}
      \;\Longrightarrow\;
      K = \frac{0{,}5}{\ln 1{,}0002} = 2500{,}25\ \text{kg/cm}^{2}
      $$

      **Y la conversión, que es donde está el error caro:**

      $$
      K = 2500\cdot 9{,}8\cdot 10^{4}\ \text{Pa} = 2{,}45\cdot 10^{8}\ \text{Pa}
      = 2{,}45\cdot 10^{5}\ \text{kPa}
      $$

      **Un detalle que conviene notar.** La forma exacta usa el logaritmo y da
      2500,25; la aproximada, $\Delta p/(\Delta\rho/\rho)$, da 2500 clavados.
      Coinciden en cuatro cifras porque la variación es de dos diezmilésimas, y
      $\ln(1+x)\approx x$. En este rango se puede usar la fracción sin
      preocuparse — pero conviene saber por qué se puede.

      **Y el orden de magnitud como comprobación**: $2{,}45\cdot 10^{8}\
      \text{Pa}$ es 2450 bar, del orden del agua ($2{,}1\cdot 10^{9}$ Pa es el
      del agua, diez veces más rígida). El líquido del enunciado es bastante
      más compresible que el agua, lo cual es coherente con que un aumento de
      medio kilo por centímetro cuadrado ya se note en la densidad.

  - id: ejflu2-col16-el-deposito-de-acero-que-se-dilata
    titulo: Cuánta agua cabe de más cuando el depósito también cede
    fuente: >-
      Ejercicio 1.6 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa (UPV/EHU)
      · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Un depósito de acero se dilata un $1\ \%$ en volumen cuando la presión
      interior aumenta en $700\ \text{kg/cm}^{2}$. A la presión absoluta de
      $1\ \text{kg/cm}^{2}$ contiene $500$ kg de agua. Se pide:

      **a)** ¿Cuánta masa de agua habrá que añadir para aumentar la presión en
      $700\ \text{kg/cm}^{2}$?

      Datos: densidad del agua $1000\ \text{kg/m}^{3}$; módulo de elasticidad
      volumétrico del agua $K = 21\,000\ \text{kg/cm}^{2}$.
    pide: La masa de agua que hay que añadir.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué cabe más agua después de subir la presión?
        opciones:
          - texto: >-
              Por dos motivos a la vez: el agua se comprime y además el
              depósito se dilata
            correcta: true
            mensaje: |
              Eso es, y los dos suman en el mismo sentido. El agua se hace más
              densa —cabe más masa en el mismo hueco— y encima el hueco crece
              un 1 %. Contar solo uno de los dos deja el resultado a la mitad.
          - texto: Solo porque el agua se comprime; el acero no cede
            mensaje: |
              El enunciado te dice expresamente que se dilata un 1 % en
              volumen, y ese dato no está de adorno: aporta casi un cuarto del
              resultado.
          - texto: Solo porque el depósito se dilata; el agua es incompresible
            mensaje: |
              Si el agua fuera incompresible, $K$ sería infinito y el dato del
              enunciado no tendría sentido. Es poco compresible, que no es lo
              mismo: con 700 kg/cm² su densidad sube un 3,4 %.
      - tipo: calcular
        titulo: La densidad final
        pregunta: |
          ¿Qué densidad tiene el agua a la presión final?
        respuesta:
          tipo: magnitud
          valor: 1033.9 kg/m3
          tolerancia: 0.01
          formato: una densidad, con su unidad
        distractores:
          - valor: 1010 kg/m3
            mensaje: |
              Has aplicado al agua el 1 % que se dilata el **depósito**. Son
              dos cosas distintas: el acero gana volumen y el agua gana
              densidad, y cada una tiene su propio dato.
          - valor: 966.7 kg/m3
            mensaje: |
              Signo cambiado: al **subir** la presión el agua se comprime y su
              densidad **sube**. Te ha salido menos densa que al principio.
        pista: |
          De la definición $K = dp/(d\rho/\rho)$, integrando:
          $\rho = \rho_0\,e^{\Delta p/K}$.
        desarrollo: |
          El módulo de elasticidad volumétrico se define como

          $$
          K = \frac{dp}{d\rho/\rho}
          \;\Longrightarrow\;
          \frac{dp}{K} = \frac{d\rho}{\rho}
          \;\Longrightarrow\;
          \rho = \rho_0\,e^{\Delta p/K}
          $$

          y con los números del enunciado:

          $$
          \rho = 1000\,e^{700/21000} = 1000\,e^{1/30}
          = 1033{,}9\ \text{kg/m}^{3}
          $$
      - tipo: calcular
        titulo: La masa que hay que añadir
        pregunta: |
          ¿Cuánta agua hay que meter?
        respuesta:
          tipo: magnitud
          valor: 22.12 kg
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: 16.95 kg
            mensaje: |
              Has contado la compresión del agua pero no la dilatación del
              depósito: has usado $0{,}5$ m³ en vez de $0{,}505$. Falta el 1 %
              de volumen que gana el acero.
          - valor: 5 kg
            mensaje: |
              Ese es solo el efecto del depósito, con el agua tratada como
              incompresible. Los dos efectos suman: 5 kg del acero y 17 del
              agua.
        pista: |
          Volumen inicial $= 500/1000$. Volumen final $= $ ese más el 1 %.
          Masa final $=$ densidad final $\times$ volumen final.
        desarrollo: |
          **El volumen inicial** sale de la masa y la densidad iniciales:

          $$
          V_0 = \frac{m_0}{\rho_0} = \frac{500}{1000} = 0{,}5\ \text{m}^{3}
          $$

          **El volumen final**, con el depósito dilatado un 1 %:

          $$
          V = 1{,}01\,V_0 = 0{,}505\ \text{m}^{3}
          $$

          **La masa final** es la densidad de antes por ese volumen:

          $$
          m = 1033{,}9 \cdot 0{,}505 = 522{,}12\ \text{kg}
          $$

          $$
          \boxed{\Delta m = 522{,}12 - 500 = 22{,}12\ \text{kg}}
          $$

          De los 22 kg, unos 17 entran porque el agua se comprime y unos 5
          porque el depósito se hincha.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              De la definición de $K$, integrando entre los dos estados, sale
              $\rho = \rho_0 e^{\Delta p/K}$.
          - texto: >-
              El volumen inicial de agua es la masa inicial partida por la
              densidad inicial, $0{,}5$ m³.
          - texto: >-
              El depósito se dilata un 1 %, así que el volumen disponible pasa
              a ser $0{,}505$ m³.
          - texto: >-
              Como el agua se comprime, el volumen que ocupa disminuye y hay
              que restar esa contracción al volumen del depósito.
            trampa: true
            mensaje: |
              El depósito está lleno y sigue lleno: el agua no se queda con un
              hueco encima. Lo que cambia al comprimirse no es el volumen que
              ocupa —lo fija el depósito— sino **cuánta masa cabe en él**. Por
              eso se multiplica la densidad final por el volumen final.
          - texto: >-
              La masa final es la densidad final por el volumen final, y la
              diferencia con los 500 kg es lo que hay que añadir.
    resolucion: |
      **La idea.** El depósito acaba lleno igual que empezó, así que lo que
      cambia no es el volumen del agua sino **cuánta masa cabe** en el hueco. Y
      el hueco además ha crecido.

      **La densidad final.** De la definición de módulo de elasticidad
      volumétrico, $K = dp/(d\rho/\rho)$, integrando sale
      $\rho = \rho_0 e^{\Delta p/K} = 1000\,e^{700/21000} = 1033{,}9$ kg/m³. El
      agua se ha hecho un 3,4 % más densa.

      **El volumen final.** El inicial es $500/1000 = 0{,}5$ m³ y el acero se
      dilata un 1 %, así que quedan $0{,}505$ m³.

      **La masa.** $m = 1033{,}9 \cdot 0{,}505 = 522{,}12$ kg, luego hay que
      añadir $\Delta m = 22{,}12$ kg.

      **Lo que hay que llevarse.** Son dos efectos y los dos suman: unos 17 kg
      entran porque el agua se comprime y unos 5 porque el depósito cede.
      Quedarse con uno solo deja el resultado corto, y el enunciado da los dos
      datos precisamente para que se usen los dos.

  - id: ejflu2-col17-los-termometros-de-mercurio
    titulo: Por qué un termómetro más estrecho marca de menos
    fuente: >-
      Ejercicio 1.7 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa (UPV/EHU)
      · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Una fábrica de termómetros de mercurio tara sus aparatos con un
      termómetro patrón, que dispone de una varilla de $5$ mm de diámetro
      interior. Sin embargo, con el fin de ahorrar mercurio, los termómetros
      comerciales que fabrica los realiza con tan sólo $1$ mm de diámetro. Se
      pide:

      **a)** Estudiar si dichos termómetros miden con algún error y en qué
      sentido se produce.
      **b)** En caso afirmativo, calcular el error que se produciría en el
      termómetro si un grado equivaliera a $5$ mm de columna.

      Datos: tensión superficial del mercurio
      $\sigma_{Hg} = 0{,}52\ \text{N/m}$; peso específico relativo del mercurio
      $s_{Hg} = 13{,}6$.

      Nota: se supondrán nulas las fuerzas de adhesión entre mercurio y tubo.
    pide: Si hay error, en qué sentido, y cuántos grados vale.
    pasos:
      - tipo: reconocer
        pregunta: |
          El mercurio no moja el vidrio. ¿Qué le hace eso a la columna dentro
          del capilar?
        opciones:
          - texto: >-
              La baja respecto del nivel exterior, y tanto más cuanto más
              estrecho es el tubo
            correcta: true
            mensaje: |
              Eso es. Con el agua la capilaridad **sube** la columna porque el
              agua moja; con el mercurio la **baja**, porque no moja. Y en los
              dos casos el efecto va con $1/D$: a menos diámetro, más
              desviación.
          - texto: La sube, como le pasa al agua en un tubo fino
            mensaje: |
              El agua sube porque **moja** el vidrio: la adhesión gana a la
              cohesión. Con el mercurio pasa lo contrario, y por eso su
              menisco es convexo y la columna queda por debajo.
          - texto: >-
              No le hace nada mientras el tubo sea vertical; la capilaridad
              solo afecta a tubos inclinados
            mensaje: |
              La capilaridad no depende de la inclinación, sino del diámetro y
              de si el líquido moja o no. En vertical es donde más limpio se
              ve el efecto.
      - tipo: calcular
        titulo: La depresión en el tubo patrón
        pregunta: |
          ¿Cuánto baja la columna en el termómetro patrón, el de $5$ mm?
        respuesta:
          tipo: magnitud
          valor: 2.21 mm
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: 3.12 mm
            mensaje: >-
              Has olvidado el $\cos 45°$ de la componente vertical con el que
              trabaja la colección; con la tensión entera saldría 3,12 mm.
          - valor: 30 mm
            mensaje: |
              Te has dejado el peso específico del mercurio: has dividido por
              el del agua, o por nada. $\gamma_{Hg} = 13{,}6 \cdot 9800$ N/m³,
              que es lo que hace pequeño el efecto.
        pista: |
          Equilibrio vertical del menisco: la componente vertical de la tensión
          en el contorno, $\sigma\,\pi D\cos 45°$, contra el peso de la
          columna, $\gamma\,H\,\pi D^{2}/4$.
        desarrollo: |
          Igualando la componente vertical de la tensión superficial al peso de
          la columna desplazada:

          $$
          \sigma\,\pi D\cos 45° = \gamma\,H\,\frac{\pi D^{2}}{4}
          \;\Longrightarrow\;
          H = \frac{4\sigma\cos 45°}{\gamma\,D}
          $$

          Con $\gamma_{Hg} = 13{,}6 \cdot 9800 = 133\,280$ N/m³ y $D = 5$ mm:

          $$
          H = \frac{4 \cdot 0{,}52 \cdot \cos 45°}{133\,280 \cdot 0{,}005}
          = 2{,}21\ \text{mm}
          $$
      - tipo: calcular
        titulo: El error, en grados
        pregunta: |
          Si $5$ mm de columna son un grado, ¿de cuántos grados es el error del
          termómetro comercial?
        respuesta:
          tipo: numero
          valor: '1.77'
          tolerancia: 0.05
          formato: un número de grados, sin la unidad
        distractores:
          - valor: '2.21'
            mensaje: >-
              Has usado la depresión del tubo de 1 mm entera, 11,03 mm. Lo que
              produce el error es la **diferencia** con el patrón, porque el
              patrón es el que fija la escala.
          - valor: '0.44'
            mensaje: >-
              Esa es la depresión del patrón pasada a grados. El error es la
              diferencia entre las dos depresiones, no una de ellas.
        pista: |
          Calcula la depresión con $D = 1$ mm, réstale la del patrón y divide
          entre 5 mm por grado.
        desarrollo: |
          En el tubo comercial, con $D = 1$ mm:

          $$
          H = \frac{4 \cdot 0{,}52 \cdot \cos 45°}{133\,280 \cdot 0{,}001}
          = 11{,}03\ \text{mm}
          $$

          El patrón ya bajaba $2{,}21$ mm, y contra él se taró la escala. Lo
          que sobra es

          $$
          \Delta H = 11{,}03 - 2{,}21 = 8{,}83\ \text{mm}
          \;\Longrightarrow\;
          \frac{8{,}83}{5} = 1{,}77\ \approx 1{,}8\ °\text{C}
          $$

          Y el signo importa: el comercial marca **de menos**. A 20 °C reales
          marcaría 18,2.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El mercurio no moja el vidrio, así que la capilaridad **baja** la
              columna en vez de subirla.
          - texto: >-
              La depresión vale $H = 4\sigma\cos 45°/(\gamma D)$, o sea que va
              con el inverso del diámetro.
          - texto: >-
              El termómetro patrón, de 5 mm, también está deprimido, y la
              escala se taró con él ya deprimido.
          - texto: >-
              Como los dos tubos tienen la misma tensión superficial, las dos
              depresiones son iguales y se cancelan.
            trampa: true
            mensaje: |
              La tensión superficial es la misma, pero la depresión **no**: va
              con $1/D$, y un tubo es cinco veces más estrecho que el otro. Por
              eso no se cancelan — precisamente ahí está el error.
          - texto: >-
              El error es la diferencia entre las dos depresiones, 8,83 mm, que
              a 5 mm por grado son 1,8 °C de menos.
    resolucion: |
      **La idea.** El mercurio no moja el vidrio, así que la capilaridad le
      **baja** la columna, y la baja tanto más cuanto más estrecho es el tubo.
      Si el patrón y el comercial tienen distinto diámetro, se deprimen
      distinto, y esa diferencia se convierte en error de medida.

      **La expresión.** Del equilibrio vertical del menisco,
      $H = 4\sigma\cos 45°/(\gamma D)$, con
      $\gamma_{Hg} = 13{,}6 \cdot 9800 = 133\,280$ N/m³.

      **Los dos tubos.** Con $D = 5$ mm sale $H = 2{,}21$ mm; con $D = 1$ mm,
      $H = 11{,}03$ mm.

      **El error.** La escala se taró con el patrón ya deprimido, así que lo
      que sobra es la diferencia, $8{,}83$ mm. A 5 mm por grado son
      $1{,}8\ °$C **de menos**: a 20 °C reales, el comercial marca 18,2.

      **Lo que hay que llevarse.** No es que el tubo fino esté mal y el gordo
      bien: los dos están deprimidos. Lo que produce el error es que se
      depriman **distinto**, y eso pasa porque el efecto va con $1/D$. Ahorrar
      mercurio sale caro.

  - id: ejflu2-col18-el-capilar-con-aire-atrapado
    titulo: El capilar cerrado por arriba, y el aire que no deja subir al agua
    fuente: >-
      Ejercicio 1.8 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa (UPV/EHU)
      · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Un tubo capilar de longitud $L$ y diámetro $D$, inicialmente lleno de
      aire en condiciones ambientales y cerrado por un extremo, se introduce
      por su extremo abierto en un depósito con un líquido, el cual asciende
      por el tubo comprimiendo el aire atrapado, alcanzándose un estado de
      equilibrio en el que la tensión superficial se equilibra con la
      sobrepresión creada por la compresión y la fuerza gravitatoria. Se pide:

      **a)** Expresiones de la altura $H$ y la sobrepresión $P$ creadas,
      suponiendo que la longitud de tubo introducido en el depósito es
      despreciable. Suponer el proceso de compresión del aire isotermo y
      despreciar fuerzas de cohesión frente a las fuerzas de adhesión.

      **b)** Valores numéricos de $H$ y $P$ con los datos que se adjuntan.

      Datos: densidad relativa del líquido $s = 1$; tensión superficial
      $\sigma = 75\ \text{dyn/cm}$; $L = 20$ cm; $D = 0{,}01$ mm;
      $p_a = 1$ atm; $T_a = 288$ K.
    pide: Las expresiones de H y P, y sus valores numéricos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene este capilar que no tenga uno abierto por arriba?
        opciones:
          - texto: >-
              Que el aire atrapado se comprime y empuja hacia abajo, así que el
              líquido sube menos
            correcta: true
            mensaje: |
              Eso es, y es todo el ejercicio. En un capilar abierto la tensión
              superficial solo pelea contra el peso; aquí pelea contra el peso
              **y** contra la sobrepresión del aire encerrado, que crece según
              sube el líquido.
          - texto: 'Nada: el aire no pesa y no influye'
            mensaje: |
              Lo que importa del aire no es su peso, es su **presión**. Al
              quedar encerrado en un volumen que se reduce, su presión sube — y
              aquí llega a 3 metros de columna de agua.
          - texto: >-
              Que el líquido no puede subir en absoluto, porque el aire no
              tiene por dónde salir
            mensaje: |
              Sí puede: el aire es compresible. Sube hasta que la sobrepresión
              del aire comprimido más el peso igualan a la tensión superficial,
              y ese equilibrio es lo que hay que plantear.
      - tipo: reconocer
        pregunta: |
          El aire se comprime de forma isoterma. ¿Qué ecuación le corresponde?
        opciones:
          - texto: >-
              $p_0 L = (p_0 + P)(L - H)$, porque a temperatura constante el
              producto presión por volumen no cambia
            correcta: true
            mensaje: |
              Exacto. La sección es la misma, así que el volumen es
              proporcional a la longitud de columna de aire, que pasa de $L$ a
              $L-H$. De ahí $P = p_0 H/(L-H)$.
          - texto: $p_0/L = (p_0+P)/(L-H)$, la presión proporcional al volumen
            mensaje: |
              Eso diría que al comprimir el aire su presión **baja**. En un
              isotermo la presión y el volumen son inversamente
              proporcionales: su producto es lo que se conserva.
          - texto: >-
              $p_0 L^{\gamma} = (p_0+P)(L-H)^{\gamma}$, con $\gamma = 1{,}4$
            mensaje: |
              Esa es la adiabática, y valdría si el proceso fuera rápido y sin
              intercambiar calor. El enunciado dice **isotermo** de forma
              expresa, así que $\gamma = 1$.
      - tipo: calcular
        titulo: La altura que sube el líquido
        pregunta: |
          ¿Cuánto sube el líquido dentro del capilar?
        respuesta:
          tipo: magnitud
          valor: 4.52 cm
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: 306 cm
            mensaje: |
              Esa es la altura que subiría en un capilar **abierto**, donde la
              tensión superficial solo pelea contra el peso:
              $H = 4\sigma/(\gamma D) = 3{,}06$ m. El aire atrapado la reduce a
              4,5 cm.
          - valor: 1355 cm
            mensaje: >-
              Es la otra raíz de la ecuación de segundo grado, 13,55 m. No vale:
              el tubo mide 20 cm, así que el líquido no puede subir trece
              metros dentro de él.
        pista: |
          Equilibrio: $\gamma H + P = 4\sigma/D$, con
          $P = p_0 H/(L-H)$. Sale una ecuación de segundo grado en $H$, y de
          sus dos raíces solo una cabe en el tubo.
        desarrollo: |
          **El equilibrio.** La tensión superficial tira hacia arriba del
          contorno; el peso de la columna y la sobrepresión del aire empujan
          hacia abajo:

          $$
          \gamma H + P = \frac{4\sigma}{D}
          $$

          **La compresión isoterma** da la sobrepresión en función de $H$:

          $$
          p_0 L = (p_0+P)(L-H)
          \;\Longrightarrow\;
          P = \frac{p_0 H}{L-H}
          $$

          **Sustituyendo**, con $\gamma = 9800$ N/m³,
          $p_0 = 0{,}76\cdot 13{,}6\cdot 9800 = 101\,293$ Pa,
          $\sigma = 75\cdot10^{-3}$ N/m, $L = 0{,}2$ m y $D = 10^{-5}$ m:

          $$
          9800\,H + \frac{101\,293\,H}{0{,}2-H} = \frac{4\cdot 0{,}075}{10^{-5}}
          = 30\,000
          $$

          $$
          H^{2} - 13{,}597\,H + 0{,}6122 = 0
          $$

          $$
          H_1 = 13{,}55\ \text{m}\ (\text{no vale})
          \qquad
          \boxed{H_2 = 0{,}0452\ \text{m} = 4{,}52\ \text{cm}}
          $$

          La raíz grande se descarta sin calcular nada: el tubo mide 20 cm.
      - tipo: calcular
        titulo: La sobrepresión del aire
        pregunta: |
          ¿Cuánta sobrepresión ha alcanzado el aire atrapado, en metros de
          columna de agua?
        respuesta:
          tipo: magnitud
          valor: 3.02 mca
          tolerancia: 0.03
          formato: una presión, con su unidad
        distractores:
          - valor: 0.0452 mca
            mensaje: >-
              Has confundido la altura con la presión. La sobrepresión sale de
              la compresión del aire, $P = p_0H/(L-H)$, no de la columna de
              líquido.
          - valor: 22.9 mca
            mensaje: >-
              Has dividido entre $H$ en vez de entre $L-H$. Lo que se comprime
              es la columna de **aire**, que mide $L-H$.
        pista: |
          $P = p_0\,H/(L-H)$, y luego se pasa a metros de columna de agua
          dividiendo entre 9800.
        desarrollo: |
          $$
          P = \frac{p_0 H}{L-H} = \frac{101\,293 \cdot 0{,}0452}{0{,}2-0{,}0452}
          = 29\,576\ \text{Pa}
          $$

          $$
          \frac{29\,576}{9800} = 3{,}02\ \text{m c. de agua}
          $$

          Tres metros de columna de agua de sobrepresión en un tubo de una
          centésima de milímetro: eso es lo que frena la subida.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              En equilibrio, la tensión superficial en el contorno sostiene el
              peso de la columna **y** vence la sobrepresión del aire:
              $\gamma H + P = 4\sigma/D$.
          - texto: >-
              El aire encerrado pasa de ocupar $L$ a ocupar $L-H$, y como el
              proceso es isotermo, $p_0L = (p_0+P)(L-H)$.
          - texto: >-
              Sustituyendo $P$ en la primera queda una ecuación de segundo
              grado en $H$.
          - texto: >-
              De las dos raíces se elige la mayor, porque es la que más se
              acerca a la altura de un capilar abierto.
            trampa: true
            mensaje: |
              Se elige la que **cabe en el tubo**. La raíz grande vale 13,55 m
              y el capilar mide 20 cm: es una solución matemática de la
              ecuación, no un estado físico. Que se parezca a otra cosa no es
              un criterio.
          - texto: >-
              Con $H$ conocida, la sobrepresión sale de la propia isoterma,
              $P = p_0H/(L-H)$.
    resolucion: |
      **La idea.** Un capilar cerrado por arriba no deja subir al líquido lo
      que subiría uno abierto, porque el aire que queda encerrado se comprime y
      empuja hacia abajo. Y ese empuje crece según sube el líquido, así que hay
      que resolver un equilibrio, no aplicar una fórmula.

      **El equilibrio.** La tensión superficial actúa en el contorno,
      $\sigma\pi D$; contra ella, el peso de la columna,
      $\gamma H \pi D^{2}/4$, y la sobrepresión, $P\pi D^{2}/4$. Dividiendo por
      la sección queda $\gamma H + P = 4\sigma/D$.

      **La compresión isoterma.** La columna de aire pasa de $L$ a $L-H$ con la
      misma sección, así que $p_0L = (p_0+P)(L-H)$ y $P = p_0H/(L-H)$.

      **El resultado.** Sustituyendo sale
      $H^{2} - 13{,}597H + 0{,}6122 = 0$, con raíces $13{,}55$ m y
      $0{,}0452$ m. La primera no cabe en un tubo de 20 cm, así que
      $H = 4{,}52$ cm y $P = 29\,576$ Pa $= 3{,}02$ mca.

      **Lo que hay que llevarse.** Sin el aire atrapado el líquido subiría
      $4\sigma/(\gamma D) = 3{,}06$ m; con él sube 4,5 cm, casi setenta veces
      menos. Y al resolver la ecuación de segundo grado, la raíz se elige
      porque cabe en el tubo, no porque se parezca a nada.

  - id: ejflu2-col111-de-la-tension-cortante-a-los-centipoises
    titulo: De dinas por centímetro cuadrado a centipoises
    fuente: >-
      Ejercicio 1.11 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una tensión cortante de $4\ \text{dyn/cm}^{2}$ causa una deformación
      angular de $1\ \text{rad/s}$ a un fluido newtoniano. ¿Cuál es la
      viscosidad del fluido expresada en centipoises?
    pide: La viscosidad dinámica en centipoises.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es exactamente la «deformación angular» de $1\ \text{rad/s}$?
        opciones:
          - texto: >-
              El gradiente de velocidad $du/dy$, que tiene dimensiones de
              inverso de tiempo
            correcta: true
            mensaje: |
              Exacto, y esa equivalencia es de las que más rinden: la velocidad
              angular de deformación y el gradiente de velocidad son el mismo
              número, porque $\text{rad}$ es adimensional y
              $(\text{m/s})/\text{m} = \text{s}^{-1}$.
          - texto: >-
              Una velocidad de giro del fluido, en rad/s
            mensaje: |
              No es un giro de sólido rígido: es la velocidad a la que se
              deforma un elemento cuadrado de fluido al deslizar unas capas
              sobre otras. Numéricamente coincide con $du/dy$.
          - texto: >-
              El ángulo que forma el perfil de velocidades con la pared
            mensaje: |
              Un ángulo no tiene unidades de tiempo, y aquí el dato viene en
              rad **por segundo**. Lo que mide es la rapidez con la que se
              deforma el elemento, no una pendiente estática.

      - tipo: calcular
        titulo: La viscosidad
        pregunta: |
          ¿Cuánto vale la viscosidad, en centipoises?
        respuesta:
          tipo: magnitud
          valor: '400 cp'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '4000 cp'
            mensaje: |
              No has convertido la tensión: $4\ \text{dyn/cm}^{2} =
              4\cdot 10^{-5}\ \text{N}/10^{-4}\ \text{m}^{2} = 0{,}4\
              \text{Pa}$, no 4 Pa. La dina es diminuta, pero el centímetro
              cuadrado también.
          - valor: '0.4 cp'
            mensaje: |
              Has dado el valor en pascales por segundo con la etiqueta de
              centipoise. $0{,}4\ \text{Pl} = 4\ \text{P} = 400\ \text{cP}$:
              hay que multiplicar por mil al pasar de Pl a cP.
        pista: |
          Ley de Newton, $\mu = \tau/(du/dy)$, con todo en el SI y después a
          centipoises.
        desarrollo: |
          $$
          \tau = 4\ \frac{\text{dyn}}{\text{cm}^{2}}
          = \frac{4\cdot 10^{-5}\ \text{N}}{10^{-4}\ \text{m}^{2}}
          = 0{,}4\ \text{Pa}
          $$
          $$
          \mu = \frac{\tau}{du/dy} = \frac{0{,}4}{1} = 0{,}4\ \text{Pl}
          = 4\ \text{P} = 400\ \text{cP}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La velocidad angular de deformación y el gradiente de velocidad
              son el mismo número, porque el radián es adimensional.
          - texto: >-
              Convirtiendo la tensión al SI, $4\ \text{dyn/cm}^{2} = 0{,}4$ Pa,
              y dividiendo entre $1\ \text{s}^{-1}$ sale $0{,}4$ Pl.
          - texto: >-
              En centipoises son 400, que es el orden de un aceite ligero: unas
              cuatrocientas veces el agua.
          - texto: >-
              Como el fluido es newtoniano, esa viscosidad solo vale para esta
              tensión cortante; con otra tensión sería distinta.
            trampa: true
            mensaje: |
              Es exactamente al revés, y es la **definición** de fluido
              newtoniano: la viscosidad no depende de la tensión aplicada, así
              que la relación $\tau$–$du/dy$ es una recta que pasa por el
              origen. Lo que sí la cambia es la temperatura.

    resolucion: |
      **Dos conversiones y una definición.**

      $$
      \tau = 4\ \text{dyn/cm}^{2} = 0{,}4\ \text{Pa}
      \qquad
      \frac{du}{dy} = 1\ \text{s}^{-1}
      \qquad
      \mu = \frac{\tau}{du/dy} = 0{,}4\ \text{Pl}
      $$

      Y en centipoises, $0{,}4\ \text{Pl} = 4\ \text{P} = 400\ \text{cP}$.

      **La cadena de unidades, que es lo único difícil del ejercicio:**

      | | |
      |---|---|
      | $1\ \text{dyn}$ | $10^{-5}\ \text{N}$ |
      | $1\ \text{dyn/cm}^{2}$ | $0{,}1\ \text{Pa}$ |
      | $1\ \text{Pl} = 1\ \text{Pa}\cdot\text{s}$ | $10\ \text{P}$ |
      | $1\ \text{P}$ | $100\ \text{cP}$ |

      El centipoise es tan usado porque **el agua a 20 °C tiene exactamente
      1 cP**. Ese es el ancla que conviene memorizar: cualquier resultado en
      centipoises se lee de inmediato como «tantas veces más viscoso que el
      agua». Aquí, cuatrocientas.

  - id: ejflu2-col112-de-dinamica-a-cinematica
    titulo: De la viscosidad dinámica a la cinemática, pasando por los stokes
    fuente: >-
      Ejercicio 1.12 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      En un punto en un flujo viscoso, la tensión cortante es de
      $35\ \text{kPa}$ y el gradiente de velocidad es de
      $6000\ \text{m/s}\cdot\text{m}$. Si la densidad relativa del líquido es
      $0{,}93$. ¿Cuál es la viscosidad cinemática (en Stoke)?
    pide: La viscosidad cinemática en stokes.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que calcular primero, y por qué no se puede ir directo a la
          cinemática?
        opciones:
          - texto: >-
              La dinámica, $\mu = \tau/(dv/dy)$: la cinemática es
              $\nu = \mu/\rho$ y necesita $\mu$
            correcta: true
            mensaje: |
              Eso es. La ley de Newton da la dinámica; la cinemática sale
              después dividiendo por la densidad. Y la densidad hay que
              construirla desde la relativa: $0{,}93 \cdot 1000$.
          - texto: >-
              La densidad, que es el dato que falta
            mensaje: |
              La densidad sale de la relativa en un paso
              ($930\ \text{kg/m}^{3}$), pero no es lo primero: sin $\mu$ no
              hay nada que dividir.
          - texto: >-
              Nada: la viscosidad cinemática es la tensión entre el gradiente
            mensaje: |
              Eso es la **dinámica**. La cinemática es esa dividida por la
              densidad, y por eso tiene dimensiones distintas: $L^{2}T^{-1}$
              frente a $ML^{-1}T^{-1}$.

      - tipo: calcular
        titulo: La viscosidad dinámica
        pregunta: |
          ¿Cuánto vale $\mu$?
        respuesta:
          tipo: magnitud
          valor: '5.833 Pl'
          tolerancia: 0.01
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.00583 Pl'
            mensaje: |
              La tensión son $35\ \text{kPa} = 35\,000\ \text{Pa}$, no
              $35\ \text{Pa}$. Con el kilo puesto: $35000/6000 = 5{,}83$.
          - valor: '1029 Pl'
            mensaje: |
              Has multiplicado. $\mu = \tau/(dv/dy)$, con la tensión arriba.
        pista: |
          μ = τ/(dv/dy), y τ son 35 000 Pa.
        desarrollo: |
          $$
          \mu = \frac{35\,000}{6000} = 5{,}833\ \text{Pl}
          $$

          Es un fluido **muy** viscoso: casi seis mil veces el agua. Un
          gradiente de $6000\ \text{s}^{-1}$ con tensiones de kilopascales es
          propio de un lubricante en un cojinete.

      - tipo: calcular
        titulo: La viscosidad cinemática, en stokes
        pregunta: |
          Con $\rho = 930\ \text{kg/m}^{3}$, ¿cuánto vale $\nu$ en stokes?
        respuesta:
          tipo: magnitud
          valor: '62.7 st'
          tolerancia: 0.02
          formato: una viscosidad cinemática, con su unidad
        distractores:
          - valor: '0.00627 st'
            mensaje: |
              Ese es el valor en $\text{m}^{2}/\text{s}$, no en stokes. Un
              stoke es $\text{cm}^{2}/\text{s}$, así que hay que multiplicar
              por $10^{4}$.
          - valor: '5425 st'
            mensaje: |
              Has multiplicado por la densidad en vez de dividir. La
              cinemática es la dinámica **entre** la densidad.
        pista: |
          ν = μ/ρ en m²/s, y después ×10⁴ para pasarlo a stokes.
        desarrollo: |
          $$
          \nu = \frac{\mu}{\rho} = \frac{5{,}833}{930}
          = 6{,}272\cdot10^{-3}\ \text{m}^{2}/\text{s}
          = 62{,}7\ \text{St}
          $$

          El factor $10^{4}$ sale de que $1\ \text{St} = 1\ \text{cm}^{2}/\text{s}$
          y hay $10^{4}\ \text{cm}^{2}$ en un metro cuadrado.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mu = \tau/(dv/dy) = 35\,000/6000 = 5{,}833\ \text{Pl}$.
          - texto: >-
              $\rho = s\,\rho_{\text{agua}} = 0{,}93 \cdot 1000 = 930\ \text{kg/m}^{3}$.
          - texto: >-
              $\nu = \mu/\rho = 6{,}272\cdot10^{-3}\ \text{m}^{2}/\text{s}$.
          - texto: >-
              En stokes: $\times 10^{4} = 62{,}7\ \text{St}$.
          - texto: >-
              Comprobación dimensional: $\text{Pl}/(\text{kg/m}^{3})
              = \text{m}^{2}/\text{s}$, sin masa ✓.
          - texto: >-
              La densidad relativa $0{,}93$ se puede usar tal cual en
              $\nu = \mu/s$, porque es adimensional y no cambia el resultado.
            trampa: true
            mensaje: |
              Ser adimensional es precisamente lo que impide usarla: dividir
              entre $0{,}93$ daría $6{,}27\ \text{Pl}$, un número con las
              unidades equivocadas y mil veces mayor. La densidad relativa
              hay que convertirla en densidad multiplicando por la del agua.

    resolucion: |
      **Primero la dinámica**, de la ley de Newton:

      $$
      \mu = \frac{\tau}{dv/dy} = \frac{35\,000}{6000} = 5{,}833\ \text{Pl}
      $$

      **Después la densidad**, desde la relativa:
      $\rho = 0{,}93 \cdot 1000 = 930\ \text{kg/m}^{3}$.

      **Y la cinemática:**

      $$
      \nu = \frac{\mu}{\rho} = 6{,}272\cdot10^{-3}\ \frac{\text{m}^{2}}{\text{s}}
      = \boxed{62{,}7\ \text{St}}
      $$

      > **Tres unidades en tres líneas**, y ninguna avisada: kPa a Pa,
      > relativa a absoluta, m²/s a stokes. Este ejercicio no tiene más
      > física que la ley de Newton; lo que examina es si sabes moverte entre
      > sistemas sin perder un factor mil por el camino.

  - id: ejflu2-col113-la-viscosidad-a-partir-de-la-fuerza
    titulo: Del rozamiento medido a la viscosidad del fluido
    fuente: >-
      Ejercicio 1.13 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Una placa situada a $0{,}5\ \text{mm}$ de otra fija, se mueve a
      $0{,}25\ \text{m/s}$ y requiere una fuerza por unidad de superficie de
      $2\ \text{N/m}^{2}$, para mantener esta velocidad. Calcúlese la
      viscosidad absoluta del fluido situado entre las dos placas, en unidades
      del sistema internacional, así como la velocidad de deformación angular
      de dicho fluido.
    pide: La viscosidad absoluta en unidades del SI y la velocidad de deformación angular.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es «una fuerza por unidad de superficie de 2 N/m²». ¿Qué es
          esa magnitud en la ley de Newton?
        opciones:
          - texto: >-
              La tensión cortante $\tau$, que es justo el miembro izquierdo de
              la ley: no hay que multiplicar por ningún área
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado no da el área: no hace falta. La
              ley se despeja directamente,
              $\mu = \tau/(dv/dy)$.
          - texto: >-
              La fuerza $F$, y el área hay que suponerla de $1\ \text{m}^{2}$
            mensaje: |
              Suponer un área es innecesario: «fuerza por unidad de
              superficie» **es** la tensión cortante. Numéricamente saldría lo
              mismo con $A = 1$, pero el razonamiento sería casualidad, no
              método.
          - texto: >-
              La presión que ejerce la placa sobre el fluido
            mensaje: |
              Las dos tienen las mismas unidades (Pa), pero no son lo mismo:
              la presión actúa **perpendicular** a la superficie y la tensión
              cortante, **tangencial**. Aquí la placa se desliza, así que es
              cortante.

      - tipo: calcular
        titulo: La velocidad de deformación angular
        pregunta: |
          ¿Cuánto vale el gradiente de velocidad?
        respuesta:
          tipo: magnitud
          valor: '500 s^-1'
          tolerancia: 0.01
          formato: una velocidad de deformación angular, con su unidad
        distractores:
          - valor: '0.5 s^-1'
            mensaje: |
              El espesor está en milímetros: $0{,}5\ \text{mm} = 0{,}0005\ \text{m}$.
              $0{,}25/0{,}0005 = 500\ \text{s}^{-1}$.
          - valor: '0.125 s^-1'
            mensaje: |
              Has multiplicado en vez de dividir. El gradiente es velocidad
              entre distancia.
        pista: |
          0,25 m/s dividido entre 0,5 mm pasados a metros.
        desarrollo: |
          $$
          \frac{dv}{dy} = \frac{0{,}25}{0{,}0005} = 500\ \text{s}^{-1}
          $$

      - tipo: calcular
        titulo: La viscosidad absoluta
        pregunta: |
          Despejando de la ley de Newton, ¿cuál es $\mu$?
        respuesta:
          tipo: magnitud
          valor: '0.004 Pl'
          tolerancia: 0.01
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '1000 Pl'
            mensaje: |
              Has dividido el gradiente entre la tensión. La ley es
              $\tau = \mu\,(dv/dy)$, así que
              $\mu = \tau/(dv/dy) = 2/500$.
          - valor: '0.0004 Pl'
            mensaje: |
              Un cero de más: $2/500 = 0{,}004$, no $0{,}0004$.
        pista: |
          μ = τ / (dv/dy) = 2 / 500.
        desarrollo: |
          $$
          \mu = \frac{\tau}{dv/dy} = \frac{2}{500} = 0{,}004\ \text{Pl}
          = 0{,}04\ \text{P} = 4\ \text{cP}
          $$

          **Un aceite ligero**: cuatro veces el agua a 15 °C. El orden de
          magnitud es el que hay que reconocer para saber que la cuenta va
          bien.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Fuerza por unidad de superficie» es la tensión cortante:
              $\tau = 2\ \text{Pa}$.
          - texto: >-
              El espesor en metros: $0{,}5\ \text{mm} = 5\cdot10^{-4}\ \text{m}$.
          - texto: >-
              $dv/dy = 0{,}25/5\cdot10^{-4} = 500\ \text{s}^{-1}$, que es la
              velocidad de deformación angular pedida.
          - texto: >-
              $\mu = \tau/(dv/dy) = 2/500 = 0{,}004\ \text{Pl}$.
          - texto: >-
              En unidades cegesimales serían $0{,}04\ \text{P}$, porque
              $1\ \text{Pl} = 10\ \text{P}$.
          - texto: >-
              La velocidad de deformación angular se mide en radianes, así que
              su unidad es el radián y no el inverso de segundo.
            trampa: true
            mensaje: |
              Es velocidad **de deformación**: radianes por segundo, no
              radianes. Y como el radián es adimensional, la unidad queda en
              $\text{s}^{-1}$ — que es exactamente lo que sale de dividir m/s
              entre m.

    resolucion: |
      El dato de fuerza ya viene por unidad de superficie, así que es
      directamente la tensión cortante y no hace falta el área:

      $$
      \frac{dv}{dy} = \frac{0{,}25}{5\cdot10^{-4}} = \boxed{500\ \text{s}^{-1}}
      \qquad
      \mu = \frac{\tau}{dv/dy} = \frac{2}{500} = \boxed{0{,}004\ \text{Pl}}
      $$

      > **Por qué el enunciado no da el área.** Porque da la fuerza dividida
      > por ella. Quien busque el área en el enunciado y no la encuentre
      > perderá tiempo; quien reconozca que «N/m²» ya es una tensión, tiene el
      > ejercicio hecho en dos líneas.

  # ── COLECCIÓN 1.14. Igual que el 1.3 pero con UN huelgo y dando la potencia
  #    en vez del par: obliga a ver que P = M·ω = F·V.
  - id: ejflu2-col114-la-viscosidad-desde-la-potencia
    titulo: La viscosidad a partir de la potencia disipada
    fuente: >-
      Ejercicio 1.14 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un cilindro de $140\ \text{mm}$ de radio interior gira
      concéntricamente en el interior de otro de $146\ \text{mm}$ de radio. La
      longitud de ambos es de $40\ \text{cm}$. Se pide:

      a) Viscosidad del aceite existente en el huelgo.

      Datos: potencia disipada $= 6{,}12\ \text{W}$; velocidad de giro del
      cilindro interior $= 50\ \text{rpm}$; ídem del exterior $= 0$.
    pide: La viscosidad del aceite del huelgo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es la potencia, no el par. ¿Cómo entra en la cuenta?
        opciones:
          - texto: >-
              La potencia disipada es la fuerza viscosa por la velocidad con
              que se arrastra, $P = F\,V$, que es lo mismo que $M\,\omega$
            correcta: true
            mensaje: |
              Exacto. Las dos formas son la misma: $M\omega = (F R)(V/R) =
              FV$. Con la potencia se salta el paso del par y se llega directo
              a la viscosidad.
          - texto: >-
              La potencia es la fuerza viscosa por la velocidad de giro en rpm
            mensaje: |
              Las revoluciones por minuto no son ni una velocidad lineal ni
              una angular en unidades del SI. Hay que pasarlas a rad/s, y
              después multiplicar por el radio para tener m/s.
          - texto: >-
              La potencia disipada es el par dividido entre el tiempo de una
              vuelta
            mensaje: |
              Dimensionalmente no cuadra: un par entre un tiempo son
              $\text{N}\cdot\text{m/s}$, que sí son vatios, pero el factor
              correcto es la velocidad **angular**, $\omega = 2\pi/T$, no
              $1/T$.

      - tipo: calcular
        titulo: La viscosidad
        pregunta: |
          ¿Cuánto vale la viscosidad del aceite, en poises?
        respuesta:
          tipo: magnitud
          valor: '1.94 p'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '19.42 p'
            mensaje: |
              Un factor diez en el huelgo: la diferencia de radios es
              $146 - 140 = 6\ \text{mm} = 0{,}006\ \text{m}$, no 6 cm.
          - valor: '1.786 p'
            mensaje: |
              Has usado el radio exterior para la velocidad periférica. Quien
              gira es el cilindro **interior**, así que
              $V = \omega\cdot 0{,}140$, no $\omega\cdot 0{,}146$.
        pista: |
          $P = \tau A V$ con $\tau = \mu V/e$, $A = 2\pi R L$ y
          $V = \omega R$.
        desarrollo: |
          $$
          V = \frac{50\cdot 2\pi}{60}\cdot 0{,}14 = 0{,}733\ \text{m/s}
          \qquad
          e = 0{,}146 - 0{,}140 = 0{,}006\ \text{m}
          $$
          $$
          P = \mu\,\frac{V^{2}}{e}\,2\pi R L
          \;\Longrightarrow\;
          \mu = \frac{6{,}12\cdot 0{,}006}{0{,}733^{2}\cdot 2\pi\cdot 0{,}14\cdot 0{,}4}
          = 0{,}194\ \text{Pl} = 1{,}94\ \text{P}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La velocidad periférica del cilindro que gira es
              $\omega R = 0{,}733$ m/s, con $R$ el radio interior.
          - texto: >-
              El huelgo es la diferencia de radios, 6 mm, y en él el perfil de
              velocidades se supone lineal.
          - texto: >-
              La potencia disipada es $\mu (V/e)(2\pi R L)V$, y despejando sale
              $\mu = 1{,}94$ P.
          - texto: >-
              Como el huelgo es pequeño frente al radio, hay que usar el perfil
              logarítmico del flujo entre cilindros para no equivocarse.
            trampa: true
            mensaje: |
              Es justo al revés: **porque** el huelgo es pequeño frente al
              radio (6 mm frente a 140) la curvatura no se nota y el perfil se
              puede tomar lineal, que es lo que permite usar la ley de Newton
              tal cual. Si el huelgo fuese comparable al radio, entonces sí
              haría falta el perfil exacto.

    resolucion: |
      **El atajo de la potencia.** No hace falta pasar por el par:

      $$
      P = M\,\omega = (F R)\left(\frac{V}{R}\right) = F\,V
      $$

      **Los tres datos geométricos.** Velocidad periférica
      $V = \omega R = 0{,}733\ \text{m/s}$ con el radio del cilindro que gira;
      huelgo $e = 6\ \text{mm}$; área mojada $A = 2\pi R L = 0{,}352\ \text{m}^{2}$.

      **La cuenta.**

      $$
      \mu = \frac{P\,e}{V^{2}\,2\pi R L}
      = \frac{6{,}12\cdot 0{,}006}{0{,}733^{2}\cdot 0{,}352}
      = 0{,}194\ \text{Pl} = 1{,}94\ \text{P}
      $$

      **Y el orden de magnitud como comprobación**: dos poises es un aceite
      lubricante corriente. Si hubiera salido 19 P sería una melaza, y si
      hubiera salido 0,02 P, agua. Cuando el resultado es una propiedad de un
      material conocido, mirar si el número es creíble caza la mitad de los
      errores de unidades.

  # ── COLECCIÓN 1.15. El primero en el que el motor es el peso, no un par
  #    dado, y el único del capítulo que pide identificar el fluido en el
  #    ábaco. Ojo: la longitud del cilindro se cancela y no se da.
  - id: ejflu2-col115-el-cilindro-que-desliza
    titulo: Un cilindro que desliza por su propio peso, y qué fluido lo frena
    fuente: >-
      Ejercicio 1.15 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un cilindro macizo de acero ($s = 7{,}8$) de diámetro
      $D = 70\ \text{mm}$ desliza gracias a su propio peso, por el interior de
      un tubo de diámetro interior $D_t = 71\ \text{mm}$, formando un ángulo
      con la horizontal de $60°$. Se pide:

      a) Calcular la $\mu$ (Pl) del fluido existente en el huelgo si la
      velocidad alcanzada por el cilindro es de $2\ \text{m/s}$. Suponer que la
      única resistencia existente es la que produce el fluido que se encuentra
      en el huelgo.

      b) Utilizando los ábacos de viscosidad: ¿de qué fluido puede tratarse?,
      ¿a qué temperatura se encuentra?
    pide: La viscosidad del fluido del huelgo y su identificación en el ábaco.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da la longitud del cilindro. ¿Es un olvido?
        opciones:
          - texto: >-
              No: la longitud aparece en el peso y en el área mojada, y al
              igualarlos se cancela
            correcta: true
            mensaje: |
              Eso es. El peso va con $L$ (a través del volumen) y la fuerza
              viscosa también (a través del área lateral), así que la ecuación
              de equilibrio queda independiente de la longitud. Es una buena
              señal de que el planteamiento está bien.
          - texto: >-
              Sí, y hay que suponer una longitud razonable, por ejemplo 10 cm
            mensaje: |
              Antes de suponer un dato conviene plantear la ecuación: aquí se
              ve que $L$ está a los dos lados y se va. Suponerla no cambiaría
              el resultado, pero hace pensar que el problema está mal
              enunciado cuando no lo está.
          - texto: >-
              No hace falta porque el cilindro es macizo
            mensaje: |
              Que sea macizo importa para calcular su peso —se usa el volumen
              entero, no una corona— pero no es lo que hace innecesaria la
              longitud. Lo que la hace innecesaria es que se cancele.

      - tipo: calcular
        titulo: La viscosidad
        pregunta: |
          ¿Cuánto vale la viscosidad dinámica del fluido del huelgo?
        respuesta:
          tipo: magnitud
          valor: '0.29 pl'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.5792 pl'
            mensaje: |
              Has tomado el huelgo como la diferencia de **diámetros**, 1 mm.
              El huelgo es radial: $(71-70)/2 = 0{,}5\ \text{mm}$.
          - valor: '0.3344 pl'
            mensaje: |
              Te falta el seno. Lo que arrastra al cilindro no es su peso
              entero sino su componente **paralela al plano**,
              $W\sin 60°$.
        pista: |
          Equilibrio: $\rho_s V g \sin 60° = \mu\,(v/e)\,\pi D L$, con
          $V = \pi D^{2}L/4$.
        desarrollo: |
          $$
          \rho_s\,\frac{\pi D^{2}}{4}L\,g\,\sin 60°
          = \mu\,\frac{v}{e}\,\pi D L
          $$

          La longitud se va, y despejando:

          $$
          \mu = \frac{\rho_s\,D\,g\,e\,\sin 60°}{4\,v}
          = \frac{7800\cdot 0{,}07\cdot 9{,}8\cdot 0{,}0005\cdot 0{,}866}{4\cdot 2}
          = 0{,}290\ \text{Pl}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro baja a velocidad constante, así que la componente del
              peso paralela al plano iguala a la fuerza viscosa del huelgo.
          - texto: >-
              El huelgo es radial, medio milímetro, y la longitud del cilindro
              se cancela entre el peso y el área lateral.
          - texto: >-
              Sale $\mu = 0{,}290$ Pl, que en el ábaco de viscosidades
              corresponde a glicerina a unos 30 °C.
          - texto: >-
              Si el tubo se inclinara más, hasta 80°, la velocidad de bajada
              sería la misma porque el fluido es el mismo.
            trampa: true
            mensaje: |
              La velocidad de equilibrio sale de igualar $W\sin\alpha$ con
              $\mu v \pi D L/e$: si crece el ángulo, crece el seno y **crece la
              velocidad**. Con 80° sería $2\cdot\sin80/\sin60 = 2{,}27$ m/s. El
              fluido no cambia; lo que cambia es cuánto peso lo empuja.

    resolucion: |
      **El planteamiento en una línea.** El cilindro cae a velocidad constante,
      así que no hay aceleración: la componente del peso a lo largo del plano
      está equilibrada por el rozamiento viscoso del huelgo.

      $$
      \underbrace{\rho_s\,\frac{\pi D^{2}}{4}\,L\,g\,\sin 60°}_{\text{peso · sen}}
      = \underbrace{\mu\,\frac{v}{e}\,\pi D L}_{\text{viscosa}}
      $$

      **La longitud se va**, y ese es el detalle que desconcierta al leer el
      enunciado: no falta un dato, sobra la preocupación.

      $$
      \mu = \frac{\rho_s\,g\,D\,e\,\sin 60°}{4v} = 0{,}290\ \text{Pl}
      $$

      **Y el apartado b), que es el que enseña a usar el ábaco.** Con
      $\mu = 0{,}29\ \text{Pl}$ y sabiendo que la viscosidad **cae mucho con
      la temperatura**, se entra en el ábaco de viscosidades dinámicas
      buscando qué curva pasa por ese valor: la glicerina, alrededor de los
      **30 °C**.

      Ese apartado no es decorativo. La mitad de los problemas del capítulo 6
      empiezan por leer una viscosidad en el ábaco a partir del fluido y la
      temperatura; este lo hace al revés, y obliga a mirar el gráfico entero en
      vez de a buscar un punto.

  # ── COLECCIÓN 1.16 y 1.17. El mismo esquema —un cuerpo que desliza sobre
  #    una película— con las dos incógnitas cambiadas: en el 1.16 se busca el
  #    espesor y en el 1.17 la viscosidad. Van juntos a propósito.
  - id: ejflu2-col116-el-espesor-de-la-pelicula
    titulo: El espesor de la película que aguanta un cuerpo en un plano inclinado
    fuente: >-
      Ejercicio 1.16 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un cuerpo de $40\ \text{kg}$ de peso resbala sobre un plano inclinado
      $30°$ con la horizontal, apoyándose en una de sus caras planas de
      $1800\ \text{cm}^{2}$ de superficie. Para una viscosidad de
      $1\ \text{P}$ y una velocidad de $1{,}5\ \text{m/s}$, determinar el
      espesor de la película lubricante y la potencia absorbida en el
      deslizamiento, en kW.
    pide: El espesor de la película y la potencia absorbida.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «40 kg de peso». ¿Qué fuerza hay que usar?
        opciones:
          - texto: >-
              $40$ kilopondios, es decir $392\ \text{N}$, y de esa fuerza solo
              tira del cuerpo la componente paralela al plano
            correcta: true
            mensaje: |
              Eso es. En esta escuela «pesa 40 kg» significa 40 kp, y hay que
              pasarlo a newtons multiplicando por 9,8. Y después queda el
              $\sin 30°$, que en este caso es exactamente la mitad.
          - texto: >-
              $40\ \text{N}$, porque el peso es una fuerza
            mensaje: |
              Es una fuerza, sí, pero el número está en kilopondios. Tomarlo
              como newtons divide el resultado por 9,8 sin que nada avise.
          - texto: >-
              $40$ kg de masa, y la fuerza que importa es la normal al plano
            mensaje: |
              La normal es la que aprieta el cuerpo contra la película, pero no
              es la que lo arrastra. Lo que vence al rozamiento viscoso es la
              componente **paralela** al plano.

      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Qué espesor tiene la película lubricante?
        respuesta:
          tipo: magnitud
          valor: '0.1376 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.0688 mm'
            mensaje: |
              Te falta el $\sin 30°$: has equilibrado la fuerza viscosa con el
              peso entero en vez de con su componente paralela al plano. Como
              $\sin 30° = 0{,}5$, el error es justo un factor dos.
          - valor: '1.376 mm'
            mensaje: |
              No has convertido el poise: $1\ \text{P} = 0{,}1\ \text{Pl}$. Con
              $\mu = 1\ \text{Pa}\cdot\text{s}$ el espesor sale diez veces
              mayor.
        pista: |
          $W\sin 30° = \mu\,(v/e)\,A$, con $W$ en newtons y $\mu$ en Pl.
        desarrollo: |
          $$
          W\sin 30° = 40\cdot 9{,}8\cdot 0{,}5 = 196\ \text{N}
          $$
          $$
          e = \frac{\mu\,v\,A}{W\sin 30°}
          = \frac{0{,}1\cdot 1{,}5\cdot 0{,}18}{196}
          = 1{,}38\cdot 10^{-4}\ \text{m} = 0{,}138\ \text{mm}
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia se disipa en el deslizamiento?
        respuesta:
          tipo: magnitud
          valor: '0.294 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.588 kw'
            mensaje: |
              Has usado el peso entero. La potencia disipada es la fuerza que
              de verdad se opone al movimiento —la componente paralela, 196
              N— por la velocidad.
          - valor: '0.5092 kw'
            mensaje: |
              Has usado el coseno en vez del seno. La componente que arrastra
              es la **paralela** al plano, $W\sin\alpha$; la del coseno es la
              normal, que aprieta pero no mueve.
        pista: |
          La potencia es la fuerza que vence el rozamiento por la velocidad.
        desarrollo: |
          $$
          P = F\,v = 196\cdot 1{,}5 = 294\ \text{W} = 0{,}294\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A velocidad constante, la componente del peso paralela al plano
              —196 N— iguala a la fuerza viscosa de la película.
          - texto: >-
              De $F = \mu (v/e) A$ sale el espesor, 0,138 mm, con la viscosidad
              en Pl y el área en m².
          - texto: >-
              La potencia disipada es esa fuerza por la velocidad, 294 W, y se
              convierte íntegramente en calor en la película.
          - texto: >-
              Como la película es tan fina, la potencia disipada es
              despreciable frente a la energía potencial que pierde el cuerpo.
            trampa: true
            mensaje: |
              Son **exactamente la misma**: el cuerpo baja a velocidad
              constante, así que toda la energía potencial que pierde se disipa
              en la película. Los 294 W son la potencia con la que el cuerpo
              pierde altura, ni más ni menos.

    resolucion: |
      **Los dos apartados salen de la misma ecuación de equilibrio.** A
      velocidad constante no hay aceleración:

      $$
      W\sin 30° = \mu\,\frac{v}{e}\,A
      $$

      con $W = 40\ \text{kp} = 392\ \text{N}$, $\mu = 1\ \text{P} =
      0{,}1\ \text{Pl}$ y $A = 1800\ \text{cm}^{2} = 0{,}18\ \text{m}^{2}$.

      **El espesor.**

      $$
      e = \frac{0{,}1\cdot 1{,}5\cdot 0{,}18}{196} = 0{,}138\ \text{mm}
      $$

      **La potencia.** $P = 196\cdot 1{,}5 = 294\ \text{W}$.

      **Tres conversiones y ni una fórmula nueva.** Kilopondios a newtons,
      poises a poiseuilles, centímetros cuadrados a metros cuadrados. En este
      ejercicio no hay física que no estuviera en la ley de Newton del primer
      apartado del tema; lo que hay es la disciplina de pasar todo al SI antes
      de sustituir. Los dos distractores del espesor son justo las dos
      conversiones que más se olvidan.

      **Y una comprobación física que conviene hacerse siempre**: 0,14 mm de
      película es un espesor creíble para un lubricante. Si hubiera salido un
      centímetro, el cuerpo estaría flotando; si hubiera salido un micrómetro,
      las rugosidades del plano lo tocarían y ya no habría película.

  - id: ejflu2-col117-el-cubo-sobre-la-pelicula-de-aceite
    titulo: El mismo esquema del 1.16, con la incógnita cambiada
    fuente: >-
      Ejercicio 1.17 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una pieza cúbica de $30\ \text{cm}$ de arista y $20\ \text{kg}$ de peso
      desliza hacia abajo sobre una película de aceite existente en un plano
      inclinado $20°$ con la horizontal, con una velocidad de
      $25\ \text{m/s}$. Si el espesor de la película es de
      $0{,}03\ \text{mm}$, se pide:

      a) Viscosidad dinámica en el SI.

      b) Ídem en el sistema CGS.
    pide: La viscosidad dinámica en poiseuilles y en poises.

    pasos:
      - tipo: reconocer
        pregunta: |
          De la arista del cubo, ¿qué se usa?
        opciones:
          - texto: >-
              Solo el área de la cara apoyada, $0{,}3^{2} = 0{,}09\
              \text{m}^{2}$
            correcta: true
            mensaje: |
              Eso es. La película solo existe bajo la cara que apoya; las otras
              cinco caras están en aire y no rozan nada apreciable. El dato de
              la arista está para que calcules esa área.
          - texto: >-
              El área total del cubo, seis caras
            mensaje: |
              Solo una cara toca el aceite. Las demás están rodeadas de aire,
              cuya viscosidad es tres órdenes de magnitud menor: su rozamiento
              no cuenta.
          - texto: >-
              El volumen, para calcular el peso
            mensaje: |
              El peso lo da el enunciado directamente —20 kg—, así que el
              volumen no hace falta. Y ojo, esos 20 kg son kilopondios.

      - tipo: calcular
        titulo: La viscosidad en el SI
        pregunta: |
          ¿Cuánto vale la viscosidad dinámica, en poiseuilles?
        respuesta:
          tipo: magnitud
          valor: '0.000894 pl'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.002456 pl'
            mensaje: |
              Has usado el coseno. La fuerza que arrastra al cubo es la
              componente **paralela** al plano, $W\sin 20°$; la del coseno es
              la que lo aprieta contra la película.
          - valor: '0.8938 pl'
            mensaje: |
              El espesor está en milímetros: $0{,}03\ \text{mm} = 3\cdot
              10^{-5}\ \text{m}$. Tomarlo como 0,03 m multiplica el resultado
              por mil.
        pista: |
          $W\sin 20° = \mu\,(v/e)\,A$, con todo en unidades del SI.
        desarrollo: |
          $$
          W\sin 20° = 20\cdot 9{,}8\cdot \sin 20° = 67{,}0\ \text{N}
          $$
          $$
          \mu = \frac{F\,e}{v\,A} = \frac{67{,}0\cdot 3\cdot 10^{-5}}{25\cdot 0{,}09}
          = 8{,}94\cdot 10^{-4}\ \text{Pl}
          $$

      - tipo: calcular
        titulo: Y en el sistema CGS
        pregunta: |
          ¿Cuánto vale esa misma viscosidad en poises?
        respuesta:
          tipo: magnitud
          valor: '0.00894 p'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.0000894 p'
            mensaje: |
              Has dividido entre diez en vez de multiplicar. El poise es la
              unidad **pequeña**: $1\ \text{Pl} = 10\ \text{P}$, así que el
              número en poises es diez veces mayor.
          - valor: '0.894 p'
            mensaje: |
              Un factor cien. La conversión es exactamente $\times 10$:
              $8{,}94\cdot 10^{-4}\ \text{Pl} = 8{,}94\cdot 10^{-3}\ \text{P}$.
        pista: |
          $1\ \text{Pl} = 1\ \text{Pa}\cdot\text{s} = 10\ \text{P}$.
        desarrollo: |
          $$
          8{,}94\cdot 10^{-4}\ \text{Pl}\cdot\frac{10\ \text{P}}{1\ \text{Pl}}
          = 8{,}94\cdot 10^{-3}\ \text{P}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A velocidad constante, la componente del peso paralela al plano
              —67 N— iguala a la fuerza viscosa sobre la cara apoyada.
          - texto: >-
              Con $A = 0{,}09$ m², $v = 25$ m/s y $e = 3\cdot 10^{-5}$ m sale
              $\mu = 8{,}94\cdot 10^{-4}$ Pl, es decir $8{,}94\cdot 10^{-3}$ P.
          - texto: >-
              Ese valor es del orden de la viscosidad del agua, así que el
              «aceite» del enunciado es muy poco viscoso.
          - texto: >-
              Comparado con el ejercicio anterior, aquí la película es más fina
              y por eso hace falta más viscosidad para frenar el cuerpo.
            trampa: true
            mensaje: |
              Hace falta **menos**: la fuerza viscosa va con $\mu v/e$, así que
              una película más fina frena más con la misma viscosidad. Aquí
              sale una viscosidad cien veces menor que en el 1.16 justamente
              porque la película es cinco mil veces más fina y la velocidad,
              diecisiete veces mayor.

    resolucion: |
      **Mismo esquema que el 1.16, con la incógnita cambiada de sitio.**

      $$
      W\sin 20° = \mu\,\frac{v}{e}\,A
      \;\Longrightarrow\;
      \mu = \frac{W\sin 20°\,e}{v\,A}
      $$

      con $W = 20\ \text{kp} = 196\ \text{N}$, $A = 0{,}09\ \text{m}^{2}$ y
      $e = 3\cdot 10^{-5}\ \text{m}$:

      $$
      \mu = \frac{67{,}0\cdot 3\cdot 10^{-5}}{25\cdot 0{,}09}
      = 8{,}94\cdot 10^{-4}\ \text{Pl} = 8{,}94\cdot 10^{-3}\ \text{P}
      $$

      **Merece la pena mirar los dos ejercicios juntos.** El 1.16 y este son
      la misma ecuación con los datos permutados, y comparándolos se ve de qué
      depende cada cosa: el 1.16 tiene una película mil veces más gruesa y una
      velocidad diecisiete veces menor, y su fluido resulta ser cien veces más
      viscoso. Todo eso está en la misma expresión, $\mu v/e$.

      **Y una nota sobre el resultado.** $8{,}9\cdot 10^{-4}\ \text{Pl}$ es
      prácticamente la viscosidad del agua a 25 °C. Un «aceite» con esa
      viscosidad no es un lubricante; el enunciado lo llama así por costumbre.
      Es el tipo de comprobación que conviene hacer siempre: **mirar si el
      material que sale se parece al que dice el enunciado.**

  - id: ejflu2-col118-el-par-de-la-polea
    titulo: El par que hay que vencer en el huelgo de una polea
    fuente: >-
      Ejercicio 1.18 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una polea de $50\ \text{mm}$ de diámetro interior gira alrededor de un
      eje a $400\ \text{rpm}$, existiendo un huelgo radial entre ambos de
      $0{,}075\ \text{mm}$. Se pide:

      a) El par necesario para vencer la resistencia del aceite existente en el
      huelgo.

      b) Potencia disipada.

      c) Velocidad angular de deformación del fluido.

      Datos: viscosidad dinámica del aceite $= 1\ \text{P}$; longitud de la
      polea $= 10\ \text{cm}$.
    pide: El par, la potencia disipada y la velocidad angular de deformación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El huelgo es de $0{,}075\ \text{mm}$ y el radio, de $25\ \text{mm}$.
          ¿Qué permite eso?
        opciones:
          - texto: >-
              Tomar el perfil de velocidades como lineal, porque el huelgo es
              trescientas veces menor que el radio
            correcta: true
            mensaje: |
              Eso es. Con esa relación la curvatura del huelgo es
              irrelevante y el problema se resuelve como si fueran dos placas
              planas enrolladas. Es la hipótesis que hace fácil todo este
              bloque de ejercicios.
          - texto: >-
              Despreciar el rozamiento, porque hay muy poco aceite
            mensaje: |
              Al contrario: el esfuerzo cortante va con $\mu\,v/e$, así que
              cuanto **más fino** es el huelgo, mayor es el rozamiento. Un
              huelgo de 75 micras da un gradiente de casi 14.000 s⁻¹.
          - texto: >-
              Suponer que el aceite gira con la polea como un sólido rígido
            mensaje: |
              Si girase como un sólido rígido no habría gradiente de velocidad
              ni, por tanto, esfuerzo cortante ni par que vencer. Lo que hay es
              una capa quieta contra el eje y otra a la velocidad de la polea.

      - tipo: calcular
        titulo: La velocidad angular de deformación
        pregunta: |
          ¿Cuánto vale el gradiente de velocidad en el huelgo?
        respuesta:
          tipo: magnitud
          valor: '13963 s^-1'
          tolerancia: 0.02
          formato: una velocidad de deformación, en inversos de segundo
        distractores:
          - valor: '41.89 s^-1'
            mensaje: |
              Eso es $\omega$, la velocidad angular de la polea. El gradiente
              es la velocidad **periférica** dividida entre el huelgo:
              $\omega R/e$, y el huelgo es diminuto.
          - valor: '133333 s^-1'
            mensaje: |
              Has usado el diámetro donde va el radio. La velocidad periférica
              es $\omega R$ con $R = 0{,}025\ \text{m}$; y de paso comprueba si
              no habrás dejado las rpm sin pasar a rad/s.
        pista: |
          $du/dy = v/e$, con $v = \omega R$ y $\omega$ en rad/s.
        desarrollo: |
          $$
          \omega = \frac{400\cdot 2\pi}{60} = 41{,}9\ \text{rad/s}
          \qquad
          v = \omega R = 41{,}9\cdot 0{,}025 = 1{,}047\ \text{m/s}
          $$
          $$
          \frac{du}{dy} = \frac{v}{e} = \frac{1{,}047}{7{,}5\cdot 10^{-5}}
          = 13\,963\ \text{s}^{-1}
          $$

      - tipo: calcular
        titulo: El par
        pregunta: |
          ¿Qué par hay que aplicar para vencer la resistencia del aceite?
        respuesta:
          tipo: magnitud
          valor: '0.548 n*m'
          tolerancia: 0.02
          formato: un momento, en newton por metro
        distractores:
          - valor: '1.097 n*m'
            mensaje: |
              Has multiplicado la fuerza por el diámetro en vez de por el
              radio. El par es $F\cdot R$.
          - valor: '5.236 n*m'
            mensaje: |
              Has usado las 400 rpm como si fueran rad/s. Falta el factor
              $2\pi/60$, que vale 0,1047: por eso el resultado sale casi diez
              veces mayor.
        pista: |
          $\tau = \mu\,(du/dy)$, la fuerza es $\tau$ por el área lateral
          $2\pi R L$, y el par es esa fuerza por $R$.
        desarrollo: |
          $$
          \tau = \mu\,\frac{du}{dy} = 0{,}1\cdot 13\,963 = 1396\ \text{Pa}
          $$
          $$
          F = \tau\,2\pi R L = 1396\cdot 2\pi\cdot 0{,}025\cdot 0{,}1
          = 21{,}9\ \text{N}
          $$
          $$
          M = F\,R = 21{,}9\cdot 0{,}025 = 0{,}548\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La potencia disipada
        pregunta: |
          ¿Qué potencia se pierde en el huelgo?
        respuesta:
          tipo: magnitud
          valor: '23 w'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '219.3 w'
            mensaje: |
              Has multiplicado el par por las revoluciones por minuto. La
              potencia es $M\,\omega$ con $\omega$ en rad/s.
          - valor: '11.48 w'
            mensaje: |
              Te sobra un factor dos, probablemente por haber usado el radio en
              vez del diámetro —o al revés— en uno de los dos sitios donde
              aparece. Comprueba: $P = M\omega = 0{,}548\cdot 41{,}9$.
        pista: |
          $P = M\,\omega$, y también $P = F\,v$: las dos dan lo mismo.
        desarrollo: |
          $$
          P = M\,\omega = 0{,}548\cdot 41{,}9 = 23{,}0\ \text{W}
          $$

          O por el otro camino, $P = F\,v = 21{,}9\cdot 1{,}047 = 23{,}0$ W.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el huelgo trescientas veces menor que el radio, el perfil se
              toma lineal y $du/dy = \omega R/e = 13.963\ \text{s}^{-1}$.
          - texto: >-
              De ahí $\tau = 1396$ Pa sobre un área lateral de $0{,}0157$ m²,
              es decir 21,9 N, y un par de $0{,}548\ \text{N}\cdot\text{m}$.
          - texto: >-
              La potencia disipada es $M\omega = 23$ W, y sale igual
              calculándola como $F v$.
          - texto: >-
              Si se doblara la longitud de la polea, el par se mantendría
              porque el huelgo no cambia.
            trampa: true
            mensaje: |
              El par **se dobla**: la longitud entra en el área lateral
              $2\pi R L$, así que doblarla dobla la fuerza y con ella el par y
              la potencia. Lo que no cambia es el gradiente de velocidad, que
              solo depende de $\omega R$ y del huelgo.

    resolucion: |
      **Tres preguntas, una sola cadena.**

      $$
      \omega = 41{,}9\ \text{rad/s}
      \;\to\;
      v = \omega R = 1{,}047\ \text{m/s}
      \;\to\;
      \frac{du}{dy} = \frac{v}{e} = 13\,963\ \text{s}^{-1}
      $$
      $$
      \tau = \mu\frac{du}{dy} = 1396\ \text{Pa}
      \;\to\;
      F = \tau\,2\pi R L = 21{,}9\ \text{N}
      \;\to\;
      M = F R = 0{,}548\ \text{N}\cdot\text{m}
      \;\to\;
      P = M\omega = 23\ \text{W}
      $$

      **Lo que más sorprende del resultado es el gradiente**: casi catorce mil
      inversos de segundo. No es un número raro, es lo normal en un cojinete:
      un metro por segundo repartido en setenta y cinco micras. De ahí que un
      huelgo mal ajustado caliente tanto.

      **Y veintitrés vatios** perdidos en una sola polea pequeña. Multiplicado
      por los cojinetes de una máquina, eso es la razón de que la lubricación
      sea un compromiso: aceite demasiado viscoso disipa potencia; demasiado
      poco, deja que las piezas se toquen.

  - id: ejflu2-col119-el-eje-y-el-cilindro-contrarrotantes
    titulo: Un eje y un cilindro girando en sentidos contrarios
    fuente: >-
      Ejercicio 1.19 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un eje de $50\ \text{mm}$ de diámetro gira a $1.000\ \text{rpm}$ en el
      interior de un cilindro de $52\ \text{mm}$ de diámetro interior y
      $200\ \text{mm}$ de longitud, que gira a su vez, en el sentido contrario
      al eje, a $350\ \text{rpm}$. El espacio entre el eje y el cilindro está
      ocupado por un lubricante de viscosidad dinámica de $0{,}125\ \text{P}$.
      Se pide:

      a) Potencia disipada por la resistencia ofrecida por el lubricante.
    pide: La potencia disipada en el lubricante.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos superficies giran, y en sentidos contrarios. ¿Qué velocidad
          entra en el gradiente?
        opciones:
          - texto: >-
              La diferencia de velocidades periféricas, que al ser sentidos
              contrarios es la **suma** de sus módulos
            correcta: true
            mensaje: |
              Exacto, y es todo el ejercicio. Lo que produce esfuerzo cortante
              es la velocidad **relativa** entre las dos caras del huelgo; con
              sentidos contrarios, los módulos se suman.
          - texto: >-
              La del eje, que es la que gira más deprisa
            mensaje: |
              Si el cilindro exterior estuviera quieto, sí. Pero gira, y encima
              al revés, así que la velocidad relativa entre las dos caras es
              mayor que la del eje solo: 3,57 m/s frente a 2,62.
          - texto: >-
              La diferencia de sus módulos, $2{,}62 - 0{,}95$
            mensaje: |
              Eso valdría si girasen en el **mismo** sentido. Al ser
              contrarios, una cara va hacia un lado y la otra hacia el otro:
              la velocidad relativa es la suma.

      - tipo: calcular
        titulo: La potencia disipada
        pregunta: |
          ¿Qué potencia disipa el lubricante?
        respuesta:
          tipo: magnitud
          valor: '5.06 w'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '2.36 w'
            mensaje: |
              Has restado las velocidades en vez de sumarlas. Giran en
              **sentidos contrarios**, así que la velocidad relativa entre las
              dos caras del huelgo es $2{,}62 + 0{,}95 = 3{,}57$ m/s.
          - valor: '3.671 w'
            mensaje: |
              Solo has contado la potencia que gasta el eje. El cilindro
              exterior también gira contra el lubricante y también disipa; hay
              que sumar las dos.
        pista: |
          El huelgo es radial, 1 mm. Calcula $\tau$ con la velocidad relativa y
          suma la potencia de cada superficie: $M_i\,\omega_i$.
        desarrollo: |
          $$
          v_{\text{eje}} = \frac{1000\cdot 2\pi}{60}\cdot 0{,}025 = 2{,}618\ \text{m/s}
          \qquad
          v_{\text{cil}} = \frac{350\cdot 2\pi}{60}\cdot 0{,}026 = 0{,}953\ \text{m/s}
          $$
          $$
          \Delta v = 2{,}618 + 0{,}953 = 3{,}571\ \text{m/s}
          \qquad
          e = \frac{52-50}{2} = 1\ \text{mm}
          $$
          $$
          \tau = \mu\,\frac{\Delta v}{e} = 0{,}0125\cdot 3571 = 44{,}6\ \text{Pa}
          $$

          Y la potencia, sumando lo que gasta cada superficie contra el
          lubricante:

          $$
          P = \tau\,(2\pi R_e L)\,v_{\text{eje}} + \tau\,(2\pi R_c L)\,v_{\text{cil}}
          = 3{,}67 + 1{,}39 = 5{,}06\ \text{W}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El huelgo es radial y vale 1 mm, la mitad de la diferencia de
              diámetros.
          - texto: >-
              Al girar en sentidos contrarios, la velocidad relativa entre las
              dos caras es la suma de módulos, 3,57 m/s, y con ella
              $\tau = 44{,}6$ Pa.
          - texto: >-
              La potencia total es la suma de la que gasta cada superficie
              contra el lubricante: 3,67 W el eje y 1,39 W el cilindro.
          - texto: >-
              Si el cilindro exterior girase en el mismo sentido y a la misma
              velocidad que el eje, la potencia disipada sería la mitad.
            trampa: true
            mensaje: |
              Sería **cero**. Con las dos caras a la misma velocidad no hay
              velocidad relativa, no hay gradiente, no hay esfuerzo cortante y
              no se disipa nada: el lubricante giraría como un sólido rígido
              con ellas.

    resolucion: |
      **Dos superficies móviles: lo único nuevo del ejercicio.** Lo que produce
      esfuerzo cortante es la velocidad **relativa** entre las caras del
      huelgo, y al girar en sentidos contrarios los módulos se suman.

      $$
      \Delta v = \omega_e R_e + \omega_c R_c = 2{,}618 + 0{,}953
      = 3{,}571\ \text{m/s}
      \qquad
      \tau = \mu\frac{\Delta v}{e} = 44{,}6\ \text{Pa}
      $$

      **La potencia, superficie a superficie.** Cada una vence su fuerza
      viscosa moviéndose a su propia velocidad:

      $$
      P = \underbrace{\tau\,2\pi R_e L\,v_e}_{3{,}67\ \text{W}}
      + \underbrace{\tau\,2\pi R_c L\,v_c}_{1{,}39\ \text{W}}
      = 5{,}06\ \text{W}
      $$

      **Por qué se suman y no se restan las potencias**, que es la pregunta
      razonable: porque las dos superficies están **haciendo trabajo contra el
      fluido**, no una contra la otra. Cada motor empuja su pieza en el sentido
      en que gira, y las dos vencen el mismo esfuerzo cortante. El resultado se
      va entero en calentar el lubricante.

      Y la comprobación de que el planteamiento es coherente: si las dos
      girasen igual, $\Delta v = 0$ y la potencia sería cero, que es lo que
      tiene que pasar.

  - id: ejflu2-col120-el-disco-que-gira-sobre-la-pelicula
    titulo: Un disco que gira sobre una película, donde el radio ya no es constante
    fuente: >-
      Ejercicio 1.20 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El dispositivo mostrado en la figura consiste en un eje que hace girar un
      disco de $5\ \text{cm}$ de diámetro a $60\ \text{rpm}$. El disco se
      coloca a $2\ \text{mm}$ de un límite sólido. Entre el disco y el límite
      hay un aceite de viscosidad $0{,}01\ \text{Pl}$. Se pide:

      a) Expresión razonada de la ley de Newton de la viscosidad.

      b) Momento que hay que aplicar para vencer la resistencia del aceite.

      c) Potencia consumida.

      <figure class="figura-examen">
      <svg viewBox="30 24 434 196" role="img" width="430" height="194"
           aria-labelledby="fc120t fc120d">
        <title id="fc120t">El disco que gira sobre una película de aceite de espesor constante</title>
        <desc id="fc120d">Un eje vertical hace girar un disco de cinco
        centímetros de diámetro a sesenta revoluciones por minuto. El disco
        queda paralelo a una pared plana, separado de ella dos milímetros, y
        el hueco está lleno de aceite. Como el espesor de la película es el
        mismo en todo el disco pero la velocidad crece con el radio, el
        gradiente no es constante: en el centro es cero y en el borde es
        máximo. Por eso el par no se puede calcular con una sola fuerza y hay
        que integrar sobre el radio.</desc>

        <rect x="196" y="46" width="14" height="72" fill="var(--ink)" opacity=".7"/>
        <rect x="118" y="118" width="170" height="12" fill="var(--ink)" opacity=".7"/>
        <rect x="118" y="130" width="170" height="14" fill="var(--alt)" fill-opacity=".28"/>
        <rect x="96" y="144" width="214" height="16" fill="var(--faint)" fill-opacity=".3"
              stroke="var(--ink)" stroke-width="1.6"/>
        <g stroke="var(--faint)" stroke-width="1">
          <path d="M102 160 L94 170 M122 160 L114 170 M142 160 L134 170 M162 160 L154 170 M182 160 L174 170 M202 160 L194 170 M222 160 L214 170 M242 160 L234 170 M262 160 L254 170 M282 160 L274 170 M302 160 L294 170"/>
        </g>
        <text x="203" y="184" text-anchor="middle" font-size="10" fill="var(--faint)">pared fija</text>

        <path d="M228 62 A 44 44 0 0 1 250 88" fill="none" stroke="var(--live)"
              stroke-width="2" marker-end="url(#fc120g)"/>
        <text x="258" y="72" font-size="10.5" fill="var(--live)">60 rpm</text>

        <line x1="118" y1="104" x2="288" y2="104" stroke="var(--faint)" stroke-width="1"/>
        <line x1="118" y1="98" x2="118" y2="110" stroke="var(--faint)" stroke-width="1"/>
        <line x1="288" y1="98" x2="288" y2="110" stroke="var(--faint)" stroke-width="1"/>
        <text x="152" y="98" text-anchor="middle" font-size="10.5" fill="var(--faint)">D = 5 cm</text>

        <line x1="330" y1="130" x2="330" y2="144" stroke="var(--faint)" stroke-width="1"/>
        <line x1="324" y1="130" x2="336" y2="130" stroke="var(--faint)" stroke-width="1"/>
        <line x1="324" y1="144" x2="336" y2="144" stroke="var(--faint)" stroke-width="1"/>
        <text x="342" y="141" font-size="10.5" fill="var(--alt)">2 mm de aceite</text>

        <g stroke="var(--live)" stroke-width="1.6">
          <path d="M203 136 L203 136 M228 134 L235 134 M253 132 L267 132 M278 130 L299 130"/>
        </g>
        <text x="200" y="210" text-anchor="middle" font-size="10" fill="var(--live)">la velocidad crece con el radio: el gradiente no es constante</text>

        <defs>
          <marker id="fc120g" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      El espesor de la película es constante, pero **la velocidad no**: en el
      eje vale cero y en el borde vale ωR. Por eso este no es el problema de
      la placa plana con otra forma — hay que integrar el par sobre el radio,
      y ahí es donde aparece la cuarta potencia.

      </figcaption>
      </figure>
    pide: El momento a aplicar y la potencia consumida.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué este caso no se resuelve con $M = \tau A R$, como los
          cilindros?
        opciones:
          - texto: >-
              Porque en un disco la velocidad depende del radio, así que el
              esfuerzo cortante no es el mismo en todos los puntos y hay que
              integrar
            correcta: true
            mensaje: |
              Eso es lo que hace distinto a este ejercicio. En un cilindro
              todos los puntos de la superficie mojada están al mismo radio y
              van a la misma velocidad; en un disco, el centro está quieto y el
              borde va a $\omega R$.
          - texto: >-
              Porque la película es demasiado gruesa para suponer perfil lineal
            mensaje: |
              Dos milímetros frente a veinticinco de radio siguen permitiendo
              el perfil lineal **en la dirección del espesor**. Lo que cambia
              es que la velocidad de arrastre varía con el radio.
          - texto: >-
              Porque el aceite se escapa por el borde del disco
            mensaje: |
              El problema supone la película completa y en régimen; las fugas
              por el borde no se consideran. La dificultad es puramente
              geométrica: la velocidad crece con el radio.

      - tipo: calcular
        titulo: El momento
        pregunta: |
          ¿Qué momento hay que aplicar?
        respuesta:
          tipo: magnitud
          valor: '0.0000193 n*m'
          tolerancia: 0.02
          formato: un momento, en newton por metro
        distractores:
          - valor: '0.00003856 n*m'
            mensaje: |
              Has tratado todo el disco como si estuviera al radio máximo:
              $\tau_{\max}\,A\,R$. Al integrar aparece un $R^{4}/4$ en vez de
              $R^{3}/2$, y el resultado es justo la mitad.
          - valor: '0.0003084 n*m'
            mensaje: |
              Has usado el diámetro donde va el radio. Como entra a la cuarta,
              el error es un factor dieciséis.
        pista: |
          $dM = \mu\,\dfrac{\omega r}{e}\,r\,(2\pi r\,dr)$, e integra de 0 a
          $R$.
        desarrollo: |
          A distancia $r$ del eje, la velocidad de arrastre es $\omega r$ y el
          esfuerzo cortante, $\mu\,\omega r/e$. El momento del anillo de radio
          $r$ y espesor $dr$ es

          $$
          dM = \mu\,\frac{\omega r}{e}\,(2\pi r\,dr)\,r
          = \frac{2\pi\mu\omega}{e}\,r^{3}\,dr
          $$
          $$
          M = \frac{2\pi\mu\omega}{e}\int_{0}^{R} r^{3}\,dr
          = \frac{\pi\,\mu\,\omega\,R^{4}}{2\,e}
          $$

          Con $\omega = 6{,}28\ \text{rad/s}$, $R = 0{,}025\ \text{m}$ y
          $e = 0{,}002\ \text{m}$:

          $$
          M = \frac{\pi\cdot 0{,}01\cdot 6{,}28\cdot 0{,}025^{4}}{2\cdot 0{,}002}
          = 1{,}93\cdot 10^{-5}\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La potencia
        pregunta: |
          ¿Qué potencia consume?
        respuesta:
          tipo: magnitud
          valor: '0.000121 w'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.00116 w'
            mensaje: |
              Has usado las 60 rpm como si fueran rad/s. Coinciden en que el
              número es parecido —$\omega = 6{,}28$— pero no son lo mismo:
              revisa el factor $2\pi/60$.
          - valor: '0.0000193 w'
            mensaje: |
              Ese es el valor del **momento**, no de la potencia. Falta
              multiplicar por $\omega$.
        pista: |
          $P = M\,\omega$, con $\omega$ en rad/s.
        desarrollo: |
          $$
          P = M\,\omega = 1{,}93\cdot 10^{-5}\cdot 6{,}28
          = 1{,}21\cdot 10^{-4}\ \text{W}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En un disco la velocidad de arrastre vale $\omega r$, así que el
              esfuerzo cortante crece linealmente con el radio.
          - texto: >-
              El momento de un anillo es $\tau\,(2\pi r\,dr)\,r$, y al integrar
              aparece $r^{3}$: el resultado es $\pi\mu\omega R^{4}/2e$.
          - texto: >-
              Con los datos sale $M = 1{,}93\cdot 10^{-5}$ N·m y
              $P = 1{,}21\cdot 10^{-4}$ W: cantidades diminutas.
          - texto: >-
              Como el esfuerzo cortante en el centro es nulo, la zona central
              del disco no aporta nada y se podría recortar sin cambiar el
              momento.
            trampa: true
            mensaje: |
              Aporta poco, no nada, y el matiz importa: el momento va con
              $R^{4}$, así que la mitad interior del disco —hasta $R/2$—
              aporta $1/16$ del total. Es poco, pero no cero. Lo que sí es
              cierto es que **el borde manda**: el 15 % exterior del radio
              aporta casi la mitad del par.

    resolucion: |
      **Por qué hay que integrar.** En los cilindros de los ejercicios
      anteriores toda la superficie mojada estaba al mismo radio y a la misma
      velocidad. En un disco no: el centro está quieto y el borde va a
      $\omega R$, así que el esfuerzo cortante crece con $r$ y su brazo también.

      $$
      dM = \underbrace{\mu\,\frac{\omega r}{e}}_{\tau(r)}
      \cdot\underbrace{2\pi r\,dr}_{dA}\cdot\underbrace{r}_{\text{brazo}}
      \;\Longrightarrow\;
      M = \frac{2\pi\mu\omega}{e}\int_{0}^{R} r^{3}dr
      = \boxed{\frac{\pi\mu\omega R^{4}}{2e}}
      $$

      **Los números.** $\omega = 6{,}28$ rad/s,
      $M = 1{,}93\cdot 10^{-5}\ \text{N}\cdot\text{m}$,
      $P = 1{,}21\cdot 10^{-4}\ \text{W}$.

      **El $R^{4}$ es lo que hay que llevarse.** Doblar el diámetro del disco
      multiplica el par por dieciséis. Por eso en un embrague o un freno
      viscoso lo que se toca es el radio, no la viscosidad ni el espesor: es la
      variable con más palanca de las tres.

      Y por eso también el error del distractor —tratar todo el disco como si
      estuviera al radio máximo— se equivoca justo en un factor dos: sería
      $\tau_{\max}\pi R^{2}\cdot R = \pi\mu\omega R^{4}/e$, el doble de lo que
      da la integral.

  - id: ejflu2-col121-el-modulo-de-elasticidad
    titulo: Cuánto se comprime el alcohol, y qué módulo tiene
    fuente: >-
      Ejercicio 1.21 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Cuando se somete un volumen de alcohol de $0{,}02892\ \text{m}^{3}$ a
      una presión de $51000\ \text{kPa}$, éste se contrae a
      $0{,}02770\ \text{m}^{3}$. Calcúlese la elasticidad (en MPa).
    pide: El módulo de elasticidad volumétrico en megapascales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es exactamente el módulo de elasticidad volumétrico?
        opciones:
          - texto: >-
              El incremento de presión dividido por la deformación
              volumétrica unitaria: $E = -dp/(dV/V)$, y tiene unidades de
              presión
            correcta: true
            mensaje: |
              Eso es. El signo menos está porque al aumentar la presión el
              volumen disminuye, y así $E$ sale positivo. Es el inverso del
              coeficiente de compresibilidad cúbica $\alpha$.
          - texto: >-
              La variación de volumen por unidad de presión
            mensaje: |
              Eso es el coeficiente de compresibilidad $\alpha$, que es su
              **inverso**. $E = 1/\alpha$, y se usa más porque sus unidades
              son las de la presión y los números salen manejables.
          - texto: >-
              Una propiedad adimensional del líquido
            mensaje: |
              No lo es: la deformación $dV/V$ sí es adimensional, así que $E$
              hereda las unidades de $dp$, es decir, pascales.

      - tipo: calcular
        titulo: La deformación volumétrica unitaria
        pregunta: |
          ¿Cuánto vale $\Delta V/V$, en tanto por ciento?
        respuesta:
          tipo: numero
          valor: '4.22'
          tolerancia: 0.05
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '0.0422'
            mensaje: |
              Esa es la fracción, no el porcentaje: $\times 100$ para pasarlo a
              tanto por ciento.
          - valor: '4.4'
            mensaje: |
              Has dividido entre el volumen final. La deformación unitaria se
              refiere al volumen **inicial**: $(0{,}02892-0{,}02770)/0{,}02892$.
        pista: |
          (V inicial − V final) dividido entre V inicial, y ×100.
        desarrollo: |
          $$
          \frac{\Delta V}{V} = \frac{0{,}02892-0{,}02770}{0{,}02892}
          = 0{,}0422 = 4{,}22\ \%
          $$

          Un 4 % de compresión: mucho para un líquido, y coherente con los 510
          bar del enunciado.

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Cuál es el módulo de elasticidad volumétrico?
        respuesta:
          tipo: magnitud
          valor: '1209 MPa'
          tolerancia: 0.02
          formato: un módulo de elasticidad, con su unidad
        distractores:
          - valor: '2152 MPa'
            mensaje: |
              Has usado el volumen final en el denominador de la deformación.
              Con el inicial salen $1209\ \text{MPa}$.
          - valor: '1.209 MPa'
            mensaje: |
              Los $51000\ \text{kPa}$ son $51\ \text{MPa}$, no
              $51\ \text{kPa}$. Un factor mil.
        pista: |
          E = Δp / (ΔV/V), con Δp = 51 MPa y la deformación en fracción.
        desarrollo: |
          $$
          E = \frac{\Delta p}{\Delta V/V} = \frac{51\ \text{MPa}}{0{,}0422}
          = 1209\ \text{MPa}
          $$

          (La solución oficial redondea a $1208\ \text{MPa}$; la diferencia
          está en los decimales que se arrastren de la deformación.)

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\Delta V = 0{,}02892-0{,}02770 = 0{,}00122\ \text{m}^{3}$.
          - texto: >-
              $\Delta V/V = 0{,}00122/0{,}02892 = 0{,}0422$, adimensional.
          - texto: >-
              $\Delta p = 51000\ \text{kPa} = 51\ \text{MPa}$.
          - texto: >-
              $E = 51/0{,}0422 = 1209\ \text{MPa}$.
          - texto: >-
              Comprobación de orden de magnitud: el agua tiene
              $2100\ \text{MPa}$, y el alcohol es más compresible que el
              agua, así que menos módulo tiene sentido.
          - texto: >-
              Como $E$ es grande comparado con $\Delta p$, el alcohol es
              prácticamente incompresible y el resultado demuestra que la
              hipótesis de incompresibilidad vale siempre.
            trampa: true
            mensaje: |
              Precisamente aquí **no** vale: el volumen ha cambiado un 4 %, y
              despreciar eso sería despreciar el propio enunciado. La
              hipótesis de incompresibilidad es buena a presiones normales;
              a 510 bar deja de serlo, y por eso el capítulo incluye estos
              problemas.

    resolucion: |
      $$
      \frac{\Delta V}{V} = \frac{0{,}02892-0{,}02770}{0{,}02892} = 0{,}0422
      \qquad
      \boxed{E = \frac{\Delta p}{\Delta V/V} = \frac{51\ \text{MPa}}{0{,}0422}
      = 1209\ \text{MPa}}
      $$

      > **Dónde está el examen en un ejercicio de dos líneas.** En dos
      > sitios: en dividir entre el volumen **inicial** (el final da
      > $2152\ \text{MPa}$, un 78 % de error) y en ver que
      > $51000\ \text{kPa}$ son $51\ \text{MPa}$. La física —la definición de
      > $E$— es una línea de teoría; el resto es cuidado.

  - id: ejflu2-col122-el-modulo-de-un-gas-isotermo
    titulo: El módulo de elasticidad de un gas es su propia presión
    fuente: >-
      Ejercicio 1.22 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      ¿Cómo variará el módulo de elasticidad si se varía la presión,
      manteniendo la $T$ constante? ¿Cuál es el módulo de elasticidad
      volumétrico de un gas al someterlo a un proceso de compresión isotermo,
      cuando la presión absoluta es de $0{,}4\ \text{MPa}$?
    pide: Cómo depende K de la presión en un gas isotermo, y su valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          En un proceso isotermo de gas ideal, ¿qué relación liga presión y
          volumen?
        opciones:
          - texto: >-
              $pV = \text{cte}$, y derivándola sale directamente el módulo
            correcta: true
            mensaje: |
              Eso es todo el ejercicio. Derivando, $p\,dV + V\,dp = 0$, y
              sustituyendo en la definición de $K$ el resultado sale sin
              cuentas.
          - texto: >-
              $pV^{\gamma} = \text{cte}$, con $\gamma = 1{,}4$
            mensaje: |
              Esa es la **adiabática**, no la isoterma. Para un gas adiabático
              sí saldría $K = \gamma p$; el enunciado pide expresamente el
              proceso isotermo, donde $\gamma$ no aparece.
          - texto: >-
              $p/T = \text{cte}$, porque el volumen no cambia
            mensaje: |
              Si el volumen no cambiara no habría compresión que estudiar, y el
              módulo de elasticidad volumétrico no tendría sentido. En un
              isotermo lo que se conserva es el producto $pV$.

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Cuánto vale $K$ a $0{,}4\ \text{MPa}$ absolutos?
        respuesta:
          tipo: magnitud
          valor: '0.4 mpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.56 mpa'
            mensaje: |
              Has usado la adiabática, $K = \gamma p$ con $\gamma = 1{,}4$. El
              enunciado pide el proceso **isotermo**, donde el exponente es 1 y
              $K = p$ a secas.
          - valor: '2100 mpa'
            mensaje: |
              Ese es el módulo del **agua**, no el de un gas. Un gas es unos
              cinco mil veces más compresible, y su módulo no es una propiedad
              fija: vale lo que valga su presión en cada momento.
        pista: |
          Deriva $pV = \text{cte}$ y sustituye en $K = -V\,dp/dV$.
        desarrollo: |
          $$
          pV = \text{cte}
          \;\Longrightarrow\;
          p\,dV + V\,dp = 0
          \;\Longrightarrow\;
          -V\,\frac{dp}{dV} = p
          $$
          $$
          \boxed{K = p} \;\Longrightarrow\; K = 0{,}4\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              En un isotermo de gas ideal $pV$ es constante, y derivando sale
              $-V\,dp/dV = p$.
          - texto: >-
              Es decir, el módulo de elasticidad de un gas isotermo **es su
              propia presión**: $K = p = 0{,}4$ MPa.
          - texto: >-
              Y por tanto crece linealmente con la presión: cuanto más
              comprimido está el gas, más cuesta seguir comprimiéndolo.
          - texto: >-
              Como $K$ depende de la presión, un gas no es realmente
              compresible: se comporta como un líquido a presiones altas.
            trampa: true
            mensaje: |
              A 0,4 MPa el módulo de este gas es cinco mil veces menor que el
              del agua ($2100$ MPa). Para igualarlo haría falta comprimirlo a
              2100 MPa, es decir 21.000 atmósferas. Que $K$ crezca con $p$ es
              cierto; que eso lo convierta en incompresible en cualquier
              condición práctica, no.

    resolucion: |
      **La deducción cabe en dos líneas.** En un proceso isotermo de gas ideal
      $pV = \text{cte}$, y derivando:

      $$
      p\,dV + V\,dp = 0
      \;\Longrightarrow\;
      K = -V\frac{dp}{dV} = p
      $$

      **Con lo cual, a $0{,}4\ \text{MPa}$ absolutos, $K = 0{,}4\ \text{MPa}$.**

      **Lo que este resultado enseña, y no es poco:** en un líquido el módulo
      de elasticidad es una **propiedad del material** —el del agua vale
      siempre unos 2100 MPa— mientras que en un gas **no es una propiedad**:
      vale lo que valga su presión en cada instante.

      De ahí sale la comparación que ordena toda la asignatura. A presión
      atmosférica, $K_{\text{aire}} \approx 0{,}1$ MPa frente a
      $K_{\text{agua}} \approx 2100$ MPa: **el aire es veintiún mil veces más
      compresible que el agua**. Por eso el agua se trata como incompresible
      sin más discusión y el aire solo cuando el número de Mach lo permite
      (tema 16).

      Y para el proceso adiabático, que es el que aparece en el golpe de ariete
      y en las máquinas térmicas, la misma deducción con
      $pV^{\gamma} = \text{cte}$ da $K = \gamma p$.

  - id: ejflu2-col123-el-deposito-de-cinco-mil-litros
    titulo: El módulo del agua pesando el depósito antes y después
    fuente: >-
      Ejercicio 1.23 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene un depósito de acero, supuesto rígido, de $5.000\ \text{l}$ de
      capacidad, cuyo peso cuando está vacío es de $7.000\ \text{kg}$. El mismo
      depósito pesa $12.036{,}7\ \text{kg}$ después de llenarlo de agua a
      $150$ atmósferas de presión. Se pide:

      a) Módulo de elasticidad volumétrico del agua.

      Dato: $1\ \text{atm} = 10.336\ \text{kg/m}^{2}$.
    pide: El módulo de elasticidad volumétrico del agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se deduce de que quepan 5036,7 kg de agua en 5000 litros?
        opciones:
          - texto: >-
              Que el agua está comprimida: a presión normal esos kilos
              ocuparían $5{,}0367\ \text{m}^{3}$, y han cabido en 5
            correcta: true
            mensaje: |
              Exacto, y esa es toda la medida. La diferencia entre el volumen
              que ocuparía relajada y el que ocupa comprimida es el $\Delta V$
              que entra en el módulo.
          - texto: >-
              Que el depósito se ha dilatado 36,7 litros
            mensaje: |
              El enunciado dice «supuesto rígido»: el depósito **no** se
              dilata. Toda la diferencia de volumen es compresión del agua. En
              el ejercicio 1.24 pasa lo contrario y hay que contar las dos
              cosas.
          - texto: >-
              Que la densidad del agua a 150 atm es $5036{,}7/5000 = 1{,}0073$
            mensaje: |
              El número está bien —esa es la densidad relativa a 150 atm— pero
              no es un dato distinto: es otra forma de decir lo mismo. El paso
              siguiente es el mismo en los dos caminos.

      - tipo: calcular
        titulo: El módulo del agua
        pregunta: |
          ¿Cuánto vale el módulo de elasticidad volumétrico del agua, en
          $\text{kg/cm}^{2}$?
        respuesta:
          tipo: numero
          valor: '21136'
          tolerancia: 400
          formato: un número en kilopondios por centímetro cuadrado
        distractores:
          - valor: '263'
            mensaje: |
              Has usado los $12.036{,}7\ \text{kg}$ como masa de agua. Ese es
              el peso del conjunto: el agua son
              $12.036{,}7 - 7.000 = 5.036{,}7\ \text{kg}$.
          - valor: '20449'
            mensaje: |
              Has tomado las 149 atmósferas como si fueran
              $\text{kg/cm}^{2}$. No lo son: el enunciado da el dato
              precisamente para eso, $1\ \text{atm} = 10.336\ \text{kg/m}^{2} =
              1{,}0336\ \text{kg/cm}^{2}$.
        pista: |
          $\Delta V/V$ con el volumen que ocuparía el agua a presión normal, y
          $\Delta p = 149$ atm pasadas a $\text{kg/cm}^{2}$.
        desarrollo: |
          Masa de agua: $12.036{,}7 - 7.000 = 5.036{,}7\ \text{kg}$, que a
          presión normal ocuparían $5{,}0367\ \text{m}^{3}$.

          $$
          \frac{\Delta V}{V} = \frac{5{,}0367-5{,}000}{5{,}0367}
          = 7{,}29\cdot 10^{-3}
          $$
          $$
          \Delta p = 149\cdot 10.336\ \frac{\text{kg}}{\text{m}^{2}}
          = 154{,}0\ \frac{\text{kg}}{\text{cm}^{2}}
          $$
          $$
          K = \frac{154{,}0}{7{,}29\cdot 10^{-3}} = 21\,136\ \frac{\text{kg}}{\text{cm}^{2}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua que ha entrado son 5.036,7 kg, que a presión normal
              ocuparían 5,0367 m³ y han cabido en los 5 m³ del depósito.
          - texto: >-
              La compresión relativa es $0{,}0367/5{,}0367 = 7{,}29\cdot
              10^{-3}$, y el salto de presión, 149 atm.
          - texto: >-
              Dividiendo sale $K \approx 21.100\ \text{kg/cm}^{2}$, es decir
              unos $2{,}1\cdot 10^{9}$ Pa: el valor tabulado del agua.
          - texto: >-
              Que el depósito sea de acero significa que hay que descontar su
              dilatación del volumen disponible.
            trampa: true
            mensaje: |
              El enunciado lo declara **rígido** justamente para que no haya
              que hacerlo. Es una hipótesis del problema, no una propiedad del
              acero: en el ejercicio 1.24 el depósito sí se dilata y entonces
              hay que contar las dos deformaciones.

    resolucion: |
      **Todo el ejercicio es una pesada.** La diferencia entre el depósito
      lleno y vacío da la masa de agua; esa masa, a presión normal, ocuparía
      más de lo que ocupa dentro. Esa diferencia es la compresión.

      $$
      m_{\text{agua}} = 5.036{,}7\ \text{kg}
      \quad\to\quad
      V_{\text{normal}} = 5{,}0367\ \text{m}^{3}
      \quad\to\quad
      \Delta V = 0{,}0367\ \text{m}^{3}
      $$
      $$
      K = \frac{\Delta p}{\Delta V/V} = \frac{154{,}0}{7{,}29\cdot 10^{-3}}
      = 21\,136\ \frac{\text{kg}}{\text{cm}^{2}}
      $$

      **Y la comprobación que valida el planteamiento**: ese valor equivale a
      $2{,}07\cdot 10^{9}\ \text{Pa}$, que es el módulo tabulado del agua. Un
      problema experimental bien planteado tiene que devolver el dato de tabla;
      si sale otro orden de magnitud, el error está en el planteamiento y no en
      la medida.

      > **Nota sobre el resultado publicado.** El boletín da
      > $21.059\ \text{kg/cm}^{2}$ y aquí sale $21.136$: un 0,4 % de
      > diferencia, que viene de redondeos en el paso de atmósferas a
      > $\text{kg/cm}^{2}$ y de si el salto de presión se toma como 149 o 150
      > atmósferas. Los dos valores son el mismo dato.

  - id: ejflu2-col124-el-deposito-que-si-se-dilata
    titulo: Cuando el depósito también se deforma
    fuente: >-
      Ejercicio 1.24 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito metálico sometido a una presión interior de $30\ \text{MPa}$
      contiene $2.000\ \text{kg}$ de agua, ocupando todo su volumen. Si el
      depósito se ha dilatado un $0{,}5\ \%$ en volumen al someterle a tal
      presión, se pide:

      a) La cantidad de agua que se verterá cuando el depósito se despresurice.

      Dato: módulo de elasticidad volumétrico del agua
      $K = 2.100\ \text{MPa}$.
    pide: El volumen de agua que rebosará al despresurizar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al despresurizar, ¿por qué sobra agua?
        opciones:
          - texto: >-
              Porque el depósito se encoge y el agua se expande a la vez: las
              dos deformaciones van en el mismo sentido
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue a este ejercicio del 1.23. Allí el
              depósito era rígido y solo contaba la compresión del agua; aquí
              se suman los dos efectos.
          - texto: >-
              Porque el agua se expande, y el depósito no cambia
            mensaje: |
              El enunciado dice que el depósito se ha dilatado un 0,5 % **al
              presurizarlo**, así que al despresurizar vuelve a su volumen
              original y encoge. Ese medio por ciento es parte del agua que
              sobra.
          - texto: >-
              Porque al bajar la presión el agua se evapora parcialmente
            mensaje: |
              A temperatura ambiente y presión atmosférica el agua no hierve.
              Lo que pasa es puramente mecánico: dos volúmenes que cambian en
              sentidos contrarios.

      - tipo: calcular
        titulo: El agua vertida
        pregunta: |
          ¿Cuánta agua se vierte?
        respuesta:
          tipo: magnitud
          valor: '38.4 l'
          tolerancia: 0.02
          formato: un volumen, con su unidad
        distractores:
          - valor: '28.6 l'
            mensaje: |
              Solo has contado la expansión del agua. El depósito también
              vuelve a su tamaño, y ese 0,5 % —unos 10 litros— se suma.
          - valor: '10 l'
            mensaje: |
              Solo has contado la contracción del depósito. El agua, al dejar
              de estar comprimida a 30 MPa, también ocupa más.
        pista: |
          Compara el volumen que ocupan los 2.000 kg de agua relajada con el
          volumen del depósito **sin** dilatar.
        desarrollo: |
          Comprimida, la densidad del agua es

          $$
          \rho = \frac{\rho_0}{1-\Delta p/K} = \frac{1000}{1-30/2100}
          = 1014{,}5\ \frac{\text{kg}}{\text{m}^{3}}
          $$

          así que los 2.000 kg ocupan $V_d = 1{,}9714\ \text{m}^{3}$, que es el
          volumen del depósito **dilatado**. Sin dilatar:

          $$
          V_{d0} = \frac{1{,}9714}{1{,}005} = 1{,}9616\ \text{m}^{3}
          $$

          Y relajada, el agua ocupa $2{,}000\ \text{m}^{3}$. Lo que sobra:

          $$
          2{,}000 - 1{,}9616 = 0{,}0384\ \text{m}^{3} = 38{,}4\ \text{l}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A 30 MPa el agua tiene una densidad de $1014{,}5\ \text{kg/m}^{3}$,
              así que los 2.000 kg ocupan $1{,}9714\ \text{m}^{3}$.
          - texto: >-
              Ese es el volumen del depósito dilatado; sin dilatar son
              $1{,}9616\ \text{m}^{3}$.
          - texto: >-
              El agua relajada ocupa $2{,}000\ \text{m}^{3}$, así que sobran
              38,4 litros: casi un 2 % del contenido.
          - texto: >-
              De esos 38 litros, la mayor parte viene de la contracción del
              depósito, que es la deformación grande.
            trampa: true
            mensaje: |
              Es al revés: la expansión del agua aporta unos 28,6 litros y la
              contracción del depósito, unos 10. El agua se comprime un 1,43 %
              a 30 MPa mientras que el depósito solo se dilata un 0,5 %.

    resolucion: |
      **Dos deformaciones que van en el mismo sentido.** Al despresurizar, el
      agua se expande y el depósito se encoge: las dos cosas expulsan líquido.

      **La compresión del agua.**

      $$
      \frac{\Delta V}{V} = \frac{\Delta p}{K} = \frac{30}{2100} = 1{,}43\ \%
      \;\Longrightarrow\;
      \rho = 1014{,}5\ \frac{\text{kg}}{\text{m}^{3}}
      $$

      Los 2.000 kg ocupan por tanto $1{,}9714\ \text{m}^{3}$ dentro del
      depósito dilatado.

      **La dilatación del depósito.** Ese $1{,}9714$ es el volumen **con** el
      0,5 % de dilatación, así que en reposo el depósito mide
      $1{,}9714/1{,}005 = 1{,}9616\ \text{m}^{3}$.

      **Lo que sobra.**

      $$
      V_{\text{vertida}} = 2{,}000 - 1{,}9616 = 38{,}4\ \text{l}
      $$

      **El reparto entre las dos causas** conviene mirarlo, porque es
      contraintuitivo: de los 38 litros, unos **28,6 vienen del agua** y solo
      10 del depósito. Cuesta creerlo —el agua es «incompresible»— pero 30 MPa
      son trescientas atmósferas, y ahí el 1,4 % de compresión gana al 0,5 % de
      dilatación del metal.

      Es el mismo aviso del tema 1: **incompresible significa «se comprime
      poco», no «no se comprime»**, y a presiones altas la diferencia se mide
      en litros.

  - id: ejflu2-col125-el-ascenso-capilar
    titulo: El ascenso capilar, con la tensión superficial en kilopondios
    fuente: >-
      Ejercicio 1.25 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Introducido un tubo capilar de sección circular en agua, se pide:

      a) Deducir la expresión que proporciona la elevación del agua en el tubo
      capilar, suponiendo que el líquido moja totalmente al sólido.

      b) Aplicarlo al caso en que el diámetro del tubo sea de $5\ \text{mm}$.

      Dato: tensión superficial del agua $\sigma = 0{,}0074\ \text{kg/m}$.
    pide: La deducción de la fórmula y la altura para un tubo de 5 mm.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Moja totalmente» fija un dato de la fórmula. ¿Cuál?
        opciones:
          - texto: >-
              El ángulo de contacto: $\theta = 0$, y por tanto $\cos\theta = 1$
            correcta: true
            mensaje: |
              Eso es. Con mojado total el menisco es tangente a la pared y
              toda la tensión superficial tira hacia arriba. Si el enunciado
              diera un ángulo, habría que arrastrar el coseno.
          - texto: >-
              La tensión superficial, que vale la del agua
            mensaje: |
              La tensión superficial es un dato aparte y la da el enunciado.
              Lo que fija «moja totalmente» es el ángulo de contacto.
          - texto: >-
              Que el ascenso es positivo
            mensaje: |
              El signo es una consecuencia, no la hipótesis. Lo que se fija es
              $\theta = 0$; de ahí sale que $\cos\theta = 1 > 0$ y que el
              líquido sube.

      - tipo: calcular
        titulo: La tensión superficial en unidades del SI
        pregunta: |
          El dato viene en kg/m, o sea kilopondios por metro. ¿Cuánto vale en
          N/m?
        respuesta:
          tipo: magnitud
          valor: '0.07252 N/m'
          tolerancia: 0.01
          formato: una tensión superficial, con su unidad
        distractores:
          - valor: '0.0074 N/m'
            mensaje: |
              Ese es el número del enunciado sin convertir. Un kilopondio son
              $9{,}8\ \text{N}$: $0{,}0074 \cdot 9{,}8 = 0{,}07252$.
          - valor: '0.000755 N/m'
            mensaje: |
              Has dividido entre $9{,}8$ en vez de multiplicar. De kp a N se
              multiplica.
        pista: |
          El «kg» del dato es un kilopondio: ×9,8 para pasar a newtons.
        desarrollo: |
          $$
          \sigma = 0{,}0074\ \frac{\text{kp}}{\text{m}}
          = 0{,}0074 \cdot 9{,}8 = 0{,}07252\ \frac{\text{N}}{\text{m}}
          $$

          **Y este es el paso que decide el ejercicio.** Con el dato sin
          convertir la altura sale $0{,}6\ \text{mm}$ en vez de
          $5{,}92\ \text{mm}$: casi diez veces menos.

      - tipo: calcular
        titulo: La altura de ascenso
        pregunta: |
          Con $D = 5\ \text{mm}$, ¿cuánto sube el agua?
        respuesta:
          tipo: magnitud
          valor: '5.92 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.96 mm'
            mensaje: |
              Has usado el diámetro donde va el radio (o al revés). La fórmula
              con radio es $h = 2\sigma/(\rho g R)$; con diámetro,
              $h = 4\sigma/(\rho g D)$. Cuidado con el 2 y el 4.
          - valor: '0.604 mm'
            mensaje: |
              Es el resultado con la tensión superficial sin pasar de
              kilopondios a newtons. Falta el factor $9{,}8$.
        pista: |
          h = 4σ/(ρ·g·D), con σ ya en N/m y D en metros.
        desarrollo: |
          $$
          h = \frac{4\sigma}{\rho\,g\,D}
          = \frac{4 \cdot 0{,}07252}{1000 \cdot 9{,}8 \cdot 0{,}005}
          = \frac{0{,}29008}{49} = 5{,}92\cdot10^{-3}\ \text{m} = 5{,}92\ \text{mm}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la deducción y el cálculo. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza de tensión superficial actúa a lo largo del perímetro
              de contacto: $F = \sigma\,(2\pi R)\cos\theta$.
          - texto: >-
              El peso de la columna levantada es
              $W = \rho\,g\,(\pi R^{2}h)$.
          - texto: >-
              Igualando las dos y despejando:
              $h = \dfrac{2\sigma\cos\theta}{\rho g R} = \dfrac{4\sigma\cos\theta}{\rho g D}$.
          - texto: >-
              Con mojado total, $\cos\theta = 1$.
          - texto: >-
              Números: $\sigma = 0{,}07252\ \text{N/m}$ y $D = 0{,}005\ \text{m}$
              dan $h = 5{,}92\ \text{mm}$.
          - texto: >-
              Si se duplicara el diámetro del tubo, la altura también se
              duplicaría, porque cabe el doble de agua.
            trampa: true
            mensaje: |
              Al revés, y es el contenido de la ley de Jurin: $h\,D$ es
              constante, así que al duplicar el diámetro la altura **se
              reduce a la mitad**. La fuerza que sostiene la columna crece con
              el perímetro ($\propto D$) y el peso a levantar crece con el
              área ($\propto D^{2}$).

    resolucion: |
      **a) La deducción.** La componente vertical de la tensión superficial,
      repartida por el perímetro de contacto, sostiene el peso de la columna:

      $$
      \sigma\,(2\pi R)\cos\theta = \rho\,g\,\pi R^{2}h
      \qquad\Longrightarrow\qquad
      \boxed{h = \frac{2\sigma\cos\theta}{\rho\,g\,R} = \frac{4\sigma\cos\theta}{\rho\,g\,D}}
      $$

      **b) El número.** Mojado total, $\cos\theta = 1$; y la tensión
      superficial, de kp/m a N/m:

      $$
      \sigma = 0{,}0074 \cdot 9{,}8 = 0{,}07252\ \text{N/m}
      \qquad
      h = \frac{4 \cdot 0{,}07252}{1000 \cdot 9{,}8 \cdot 0{,}005}
      = \boxed{5{,}92\ \text{mm}}
      $$

      > **El «kg/m» del enunciado es kilopondio por metro**, no kilogramo por
      > metro. Es el mismo aviso del tema 1, y aquí decide el resultado por un
      > factor diez. La forma de no caer: cuando una unidad de un dato no
      > cuadre dimensionalmente con la fórmula —y kg/m no es una tensión
      > superficial— es que está en el Sistema Técnico.

  # ── COLECCIÓN 1.26. Capilar de sección CUADRADA: obliga a escribir la
  #    fórmula general con perímetro y área en vez de copiar la del tubo
  #    circular. Y el resultado sale idéntico, que es lo bonito.
  - id: ejflu2-col126-el-capilar-cuadrado
    titulo: Un capilar de sección cuadrada, y por qué sube lo mismo
    fuente: >-
      Ejercicio 1.26 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se introduce un tubo capilar de sección cuadrada de $1{,}5\ \text{mm}$ de
      lado en un vaso que contiene alcohol. Se pide:

      a) Altura a la que ascenderá el alcohol por el tubo, en el supuesto de
      que las fuerzas de cohesión del líquido sean despreciables frente a las
      de adhesión entre líquido y sólido.

      Datos: tensión superficial del alcohol $\sigma = 0{,}023\ \text{N/m}$;
      densidad relativa del mismo $s = 0{,}9$.
    pide: La altura de ascenso del alcohol en el capilar.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Cohesión despreciable frente a adhesión». ¿Qué significa eso para el
          ángulo de contacto?
        opciones:
          - texto: >-
              Que el líquido moja totalmente al sólido, es decir
              $\theta = 0$ y $\cos\theta = 1$
            correcta: true
            mensaje: |
              Eso es. Sin cohesión que tire del líquido hacia dentro, la
              adhesión gana del todo y el menisco se pega a la pared: el
              ángulo de contacto se anula y el coseno vale 1.
          - texto: >-
              Que el líquido no moja y el ángulo vale $180°$
            mensaje: |
              Es el caso contrario, el del mercurio: cohesión mucho mayor que
              adhesión, menisco convexo y descenso capilar en vez de ascenso.
              Aquí la despreciable es la cohesión.
          - texto: >-
              Que el ángulo vale $90°$ y no hay ascenso
            mensaje: |
              Con $\theta = 90°$ el coseno es cero y el líquido no subiría ni
              bajaría, que es el caso límite entre mojar y no mojar. El
              enunciado describe el extremo opuesto.

      - tipo: calcular
        titulo: El ascenso
        pregunta: |
          ¿Hasta qué altura sube el alcohol?
        respuesta:
          tipo: magnitud
          valor: '6.954 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '6.259 mm'
            mensaje: |
              Has usado el peso específico del agua. El alcohol tiene
              $s = 0{,}9$, así que $\gamma = 8820\ \text{N/m}^{3}$: al ser más
              ligero, sube **más**.
          - valor: '1.739 mm'
            mensaje: |
              Has tomado el perímetro como un solo lado. El líquido se agarra
              a las **cuatro** paredes del cuadrado: el perímetro es $4L$.
        pista: |
          Equilibra la fuerza de tensión superficial sobre el perímetro con el
          peso de la columna: $\sigma\,P = \gamma\,h\,A$.
        desarrollo: |
          $$
          \sigma\,P\cos\theta = \gamma\,h\,A
          \;\Longrightarrow\;
          h = \frac{\sigma\,P}{\gamma\,A}
          = \frac{\sigma\cdot 4L}{\gamma\,L^{2}} = \frac{4\sigma}{\gamma L}
          $$
          $$
          h = \frac{4\cdot 0{,}023}{0{,}9\cdot 9800\cdot 0{,}0015}
          = \frac{0{,}092}{13{,}23} = 6{,}95\cdot 10^{-3}\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión superficial tira hacia arriba a lo largo de todo el
              perímetro mojado, y ese tirón sostiene el peso de la columna
              levantada.
          - texto: >-
              Con sección cuadrada, $P/A = 4L/L^{2} = 4/L$, así que
              $h = 4\sigma/\gamma L$.
          - texto: >-
              Sale 6,95 mm, y es exactamente la misma expresión que la del tubo
              circular con $D$ en lugar de $L$.
          - texto: >-
              Un capilar cuadrado sube más que uno circular del mismo tamaño,
              porque las esquinas añaden perímetro sin añadir área.
            trampa: true
            mensaje: |
              Sube **lo mismo**, y es la gracia del ejercicio: para el cuadrado
              $P/A = 4/L$ y para el círculo $P/A = \pi D/(\pi D^{2}/4) = 4/D$.
              La relación perímetro-área es idéntica, así que con $L = D$ el
              ascenso coincide. Las esquinas añaden perímetro, sí, pero también
              área, y en la misma proporción.

    resolucion: |
      **La ley general, antes que la fórmula del tubo circular.** Lo que
      sostiene la columna es la tensión superficial actuando sobre todo el
      **perímetro mojado**; lo que hay que sostener es el **peso** de la
      columna, que va con el área:

      $$
      \sigma\,P\cos\theta = \gamma\,h\,A
      \;\Longrightarrow\;
      h = \frac{\sigma\cos\theta}{\gamma}\cdot\frac{P}{A}
      $$

      Con cohesión despreciable, $\cos\theta = 1$. Y para un cuadrado de lado
      $L$, $P/A = 4/L$:

      $$
      h = \frac{4\sigma}{\gamma L}
      = \frac{4\cdot 0{,}023}{8820\cdot 0{,}0015} = 6{,}95\ \text{mm}
      $$

      **Y aquí está lo que merece la pena llevarse.** Para un tubo circular,
      $P/A = \pi D/(\pi D^{2}/4) = 4/D$: **exactamente la misma relación**. Es
      decir, un capilar cuadrado de 1,5 mm de lado y uno circular de 1,5 mm de
      diámetro suben lo mismo.

      No es casualidad ni coincidencia numérica: el ascenso capilar depende del
      cociente perímetro/área, que es lo que mide cuánta pared hay por unidad
      de líquido levantado. La forma de la sección importa solo a través de ese
      cociente — y por eso el ejercicio 1.27, con una corona circular, sale
      distinto: allí $P/A = 4/(D_{\max}-D_{\min})$.

  - id: ejflu2-col127-la-corona-circular
    titulo: Una corona circular, y el ángulo de contacto deducido
    fuente: >-
      Ejercicio 1.27 · Colección de Problemas, capítulo 1 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un tubo de sección transversal en forma de corona circular
      ($\varnothing_{\max} = 10\ \text{mm}$ y $\varnothing_{\min} =
      6\ \text{mm}$) se introduce en un recipiente que contiene un líquido de
      densidad relativa $s = 0{,}78$ y tensión superficial
      $\sigma = 0{,}0223\ \text{N/m}$. Sabiendo que la relación entre los
      módulos de las fuerzas de adhesión y cohesión es de $5/4$, deducir y
      calcular:

      a) Si el líquido moja o no moja al sólido, calculando el ángulo que forma
      la superficie del líquido con el sólido.

      b) La expresión que dé el ascenso o descenso del líquido por la sección
      capilar de la corona circular.

      c) Calcular dicho ascenso o descenso para los datos indicados.
    pide: El ángulo de contacto, la expresión del ascenso y su valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una corona circular, ¿cuál es el perímetro mojado?
        opciones:
          - texto: >-
              Las dos circunferencias, la exterior y la interior:
              $\pi(D_{\max}+D_{\min})$
            correcta: true
            mensaje: |
              Eso es. El líquido toca pared por fuera y por dentro, así que las
              dos circunferencias tiran de él hacia arriba. Es lo que hace que
              una corona suba mucho más que un tubo del mismo diámetro
              exterior.
          - texto: >-
              Solo la circunferencia exterior, $\pi D_{\max}$
            mensaje: |
              El tubo interior también está mojado y su superficie también
              agarra al líquido. Contar solo una circunferencia da menos de la
              mitad del ascenso real.
          - texto: >-
              La diferencia de las dos, $\pi(D_{\max}-D_{\min})$
            mensaje: |
              Las dos paredes tiran en el mismo sentido —hacia arriba—, así que
              sus contribuciones se **suman**. La diferencia aparece después,
              al simplificar el cociente perímetro/área.

      - tipo: calcular
        titulo: El ángulo de contacto
        pregunta: |
          ¿Qué ángulo forma la superficie del líquido con el sólido?
        respuesta:
          tipo: numero
          valor: '52.48'
          tolerancia: 0.5
          formato: un ángulo en grados, solo el número
        distractores:
          - valor: '37.52'
            mensaje: |
              Ese es el ángulo que forma la resultante con la vertical, o
              equivalentemente el que forma la superficie libre con la
              horizontal. El ángulo de contacto se mide **desde la pared**, y
              es su complementario.
          - valor: '66.42'
            mensaje: |
              Parece que has usado $\cos\theta = F_c/(2F_a)$ o similar. La
              construcción correcta es vectorial: la resultante de adhesión y
              cohesión, y la superficie libre perpendicular a ella.
        pista: |
          La cohesión tira a $45°$ hacia el interior del líquido y la adhesión,
          perpendicular a la pared. La superficie libre es perpendicular a la
          resultante.
        desarrollo: |
          Con la pared a la izquierda y el líquido a la derecha, y tomando
          $F_a = 1{,}25\,F_c$:

          $$
          \vec R = \left(\frac{F_c}{\sqrt2}-F_a,\; -\frac{F_c}{\sqrt2}\right)
          = (-0{,}543,\; -0{,}707)\,F_c
          $$

          La superficie libre es perpendicular a $\vec R$, así que forma con la
          horizontal un ángulo

          $$
          \arctan\frac{0{,}543}{0{,}707} = 37{,}52°
          $$

          y con la pared vertical, su complementario:

          $$
          \theta = 90° - 37{,}52° = 52{,}48°
          $$

          Como $\theta < 90°$, **el líquido moja** al sólido.

      - tipo: calcular
        titulo: El ascenso
        pregunta: |
          ¿Cuánto asciende el líquido por la corona?
        respuesta:
          tipo: magnitud
          valor: '1.777 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.917 mm'
            mensaje: |
              Te falta el $\cos\theta$. El líquido no moja totalmente:
              $\theta = 52{,}48°$ y $\cos\theta = 0{,}609$, así que solo la
              componente vertical del tirón levanta la columna.
          - valor: '0.711 mm'
            mensaje: |
              Has usado el diámetro exterior en la fórmula del tubo circular.
              En una corona, $P/A = 4/(D_{\max}-D_{\min})$: lo que manda es la
              **anchura del hueco**, no el tamaño del tubo.
        pista: |
          $h = \dfrac{\sigma\cos\theta}{\gamma}\dfrac{P}{A}$, y simplifica
          $P/A$ para la corona.
        desarrollo: |
          $$
          P = \pi(D_{\max}+D_{\min})
          \qquad
          A = \frac{\pi}{4}\left(D_{\max}^{2}-D_{\min}^{2}\right)
          $$
          $$
          \frac{P}{A} = \frac{4(D_{\max}+D_{\min})}{(D_{\max}+D_{\min})(D_{\max}-D_{\min})}
          = \frac{4}{D_{\max}-D_{\min}}
          $$
          $$
          h = \frac{4\sigma\cos\theta}{\gamma\,(D_{\max}-D_{\min})}
          = \frac{4\cdot 0{,}0223\cdot 0{,}609}{0{,}78\cdot 9800\cdot 0{,}004}
          = 1{,}78\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Componiendo la adhesión —perpendicular a la pared— con la
              cohesión —a 45° hacia el líquido— sale una resultante inclinada
              37,52° respecto de la vertical.
          - texto: >-
              La superficie libre es perpendicular a esa resultante, así que
              forma 52,48° con la pared: menor de 90°, luego moja.
          - texto: >-
              Para la corona, $P/A$ se simplifica a $4/(D_{\max}-D_{\min})$, y
              el ascenso resulta de 1,78 mm.
          - texto: >-
              Si se estrechara la corona dejando el diámetro exterior igual, el
              ascenso bajaría porque hay menos área para el líquido.
            trampa: true
            mensaje: |
              Subiría, y mucho: $h$ va con $1/(D_{\max}-D_{\min})$. Estrechar
              la corona de 4 mm a 1 mm cuadruplicaría el ascenso. Es la misma
              idea de siempre —cuanto más fino el capilar, más sube— aplicada a
              la anchura del hueco en vez de al diámetro.

    resolucion: |
      **a) El ángulo, que sale de una composición de vectores.** La adhesión
      tira del líquido hacia la pared; la cohesión, hacia el interior del
      líquido a 45°. La superficie libre se coloca **perpendicular a la
      resultante**.

      Con $F_a/F_c = 5/4$, la resultante queda inclinada $37{,}52°$ respecto de
      la vertical, y por tanto

      $$
      \theta = 90° - 37{,}52° = 52{,}48° < 90°
      \;\Longrightarrow\;
      \textbf{moja}
      $$

      **b) La expresión, que es la general con el $P/A$ de la corona.**

      $$
      h = \frac{\sigma\cos\theta}{\gamma}\cdot\frac{P}{A}
      \qquad
      \frac{P}{A} = \frac{\pi(D_{\max}+D_{\min})}
      {\frac{\pi}{4}(D_{\max}^{2}-D_{\min}^{2})}
      = \frac{4}{D_{\max}-D_{\min}}
      $$
      $$
      \boxed{h = \frac{4\sigma\cos\theta}{\gamma\,(D_{\max}-D_{\min})}}
      $$

      **c)** $h = 1{,}78\ \text{mm}$.

      **Lo que enseña la simplificación.** El resultado no depende de los dos
      diámetros por separado sino solo de **la anchura del hueco**. Una corona
      de 10 y 6 mm sube igual que otra de 100 y 96: lo que cuenta es la
      distancia entre paredes.

      Es la versión general del mismo cociente $P/A$ del ejercicio anterior, y
      explica por qué un tubo circular sube con $4/D$ y una corona con
      $4/\Delta D$: en el tubo, la única pared está a $D/2$ del centro; en la
      corona, las dos paredes están a $\Delta D$ una de otra, y es esa
      distancia la que decide.
