ejercicios:
  # ── NUESTROS (§08). El capítulo 9 de la colección va entero de instalaciones
  #    de bombeo —tema 25— y da por sabida toda esta capa. Estos dos aíslan lo
  #    que el 25 usa sin explicar: la cadena de rendimientos y Euler.
  - id: ejflu22-la-cadena-de-rendimientos
    titulo: Del enchufe al agua, escalón por escalón
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una turbobomba impulsa $40\ \text{l/s}$ de agua con una altura
      manométrica de $45\ \text{m}$. Sus rendimientos son:
      hidráulico $\eta_m = 0{,}85$, volumétrico $\eta_v = 0{,}95$ y orgánico
      $\eta_o = 0{,}92$.

      a) Calcular la potencia útil.

      b) Calcular el rendimiento global.

      c) Calcular la potencia que la bomba pide al motor.
    pide: La potencia útil, el rendimiento global y la potencia absorbida.

    pasos:
      - tipo: reconocer
        pregunta: |
          En $P_u = \gamma\,H\,Q$, ¿qué altura y qué caudal hay que meter?
        opciones:
          - texto: >-
              La manométrica $H_m$ y el caudal útil $Q_u$, que son los que
              acaban en la tubería de impulsión
            correcta: true
            mensaje: |
              Eso es, y el patrón se repite: la potencia útil lleva las
              magnitudes útiles; la interna y la absorbida llevan el caudal
              **total**, que incluye el que recircula dentro de la máquina.
          - texto: >-
              La manométrica $H_m$ y el caudal total $Q_t$
            mensaje: |
              El caudal total incluye el que se recircula en cortocircuito
              dentro del rodete y el que se fuga entre carcasa y eje. Ese
              caudal no sale por la impulsión, así que no forma parte de la
              potencia **útil**.
          - texto: >-
              La altura absorbida $H_a$ y el caudal útil $Q_u$
            mensaje: |
              $H_a$ es lo que la bomba pide al motor, antes de las pérdidas
              mecánicas e hidráulicas. Mezclarla con el caudal útil no
              corresponde a ningún escalón de la cadena: cada altura va con
              su caudal.

      - tipo: calcular
        titulo: La potencia útil
        pregunta: |
          ¿Qué potencia recibe el agua?
        respuesta:
          tipo: magnitud
          valor: '17.64 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '18.57 kw'
            mensaje: |
              Has usado el caudal total, $Q_u/\eta_v = 42{,}1$ l/s. La potencia
              útil se calcula con el caudal que de verdad sale por la
              impulsión: los 40 l/s del enunciado.
          - valor: '1.8 kw'
            mensaje: |
              Has usado la densidad ($1000\ \text{kg/m}^{3}$) donde va el peso
              específico ($9800\ \text{N/m}^{3}$). Falta la gravedad.
        pista: |
          $P_u = \gamma\,H_m\,Q_u$, con $\gamma = 9800\ \text{N/m}^{3}$.
        desarrollo: |
          $$
          P_u = 9800\cdot 45\cdot 0{,}04 = 17\,640\ \text{W} = 17{,}64\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento global
        pregunta: |
          ¿Cuál es el rendimiento global de la bomba? (en tanto por uno)
        respuesta:
          tipo: numero
          valor: '0.743'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.782'
            mensaje: |
              Te falta el volumétrico. Los tres se multiplican:
              $\eta_g = \eta_m\,\eta_v\,\eta_o$. El volumétrico es alto pero no
              es 1, y en bombas conviene no darlo por supuesto —en turbinas sí
              se suele hacer—.
          - valor: '0.907'
            mensaje: |
              Parece que has hecho la media de los tres. No se promedian: son
              tres escalones **en serie**, y las pérdidas se acumulan
              multiplicativamente. El global es siempre menor que el peor de
              los tres.
        pista: |
          Los tres rendimientos son escalones consecutivos del mismo camino.
        desarrollo: |
          $$
          \eta_g = \eta_m\,\eta_v\,\eta_o = 0{,}85\cdot 0{,}95\cdot 0{,}92
          = 0{,}743
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia le pide la bomba al motor?
        respuesta:
          tipo: magnitud
          valor: '23.74 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '13.1 kw'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. La
              absorbida es **mayor** que la útil: el motor tiene que aportar
              todo lo que llega al agua **más** todo lo que se pierde por el
              camino.
          - valor: '19.17 kw'
            mensaje: |
              Solo has descontado el rendimiento orgánico. Faltan el hidráulico
              y el volumétrico: la potencia absorbida se obtiene dividiendo
              entre el **global**.
        pista: |
          $P_a = P_u/\eta_g$, y tiene que salir mayor que la útil.
        desarrollo: |
          $$
          P_a = \frac{P_u}{\eta_g} = \frac{17{,}64}{0{,}743} = 23{,}74\ \text{kW}
          $$

          Comprobación por el otro camino, con la cadena entera:

          $$
          H_i = \frac{H_m}{\eta_m} = 52{,}9\ \text{m}
          \qquad
          H_a = \frac{H_i}{\eta_o} = 57{,}5\ \text{m}
          \qquad
          Q_t = \frac{Q_u}{\eta_v} = 42{,}1\ \text{l/s}
          $$
          $$
          P_a = \gamma\,H_a\,Q_t = 9800\cdot 57{,}5\cdot 0{,}0421 = 23{,}74\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La potencia útil se calcula con las magnitudes útiles: 9800 por
              45 por 0,04, es decir 17,64 kW.
          - texto: >-
              Los tres rendimientos son escalones en serie del mismo camino, así
              que se multiplican: 0,743.
          - texto: >-
              La absorbida es la útil dividida entre el global, 23,74 kW, y es
              mayor porque incluye todo lo que se pierde por el camino.
          - texto: >-
              Como el rendimiento volumétrico es el más alto de los tres, es el
              que menos margen de mejora deja y el primero que se debe
              descartar al rediseñar la máquina.
            trampa: true
            mensaje: |
              El razonamiento está invertido. Un rendimiento **alto** es el que
              ya está casi perfecto: mejorar el volumétrico de 0,95 a 0,99
              apenas gana un 4 %. Donde hay margen es en el **más bajo**, aquí
              el hidráulico, que es también el más difícil de tocar. Que sea
              el que menos margen deja es cierto; que por eso sea el primero
              que se descarta, no: se descarta por eso mismo al revés.

    resolucion: |
      **La potencia útil.** Con las magnitudes que salen por la impulsión:

      $$
      P_u = \gamma\,H_m\,Q_u = 9800\cdot 45\cdot 0{,}04 = 17{,}64\ \text{kW}
      $$

      **El rendimiento global.** Los tres son escalones consecutivos y se
      multiplican:

      $$
      \eta_g = 0{,}85\cdot 0{,}95\cdot 0{,}92 = 0{,}743
      $$

      **La potencia absorbida.**

      $$
      P_a = \frac{17{,}64}{0{,}743} = 23{,}74\ \text{kW}
      $$

      **Lo que hay que llevarse de aquí.** Seis kilovatios de cada veinticuatro
      se van por el camino, con tres rendimientos que individualmente parecen
      buenos. Es la aritmética de las cosas en serie: 0,85 por 0,95 por 0,92 no
      es «bastante bien tres veces», es un 26 % perdido.

      Y el orden de la cadena, que es lo que hay que tener presente al leer un
      enunciado:

      $$
      \text{motor} \xrightarrow{\ \eta_o\ } H_i
      \xrightarrow{\ \eta_m\ } H_m
      \qquad
      Q_t \xrightarrow{\ \eta_v\ } Q_u
      $$

  - id: ejflu22-el-triangulo-de-salida-de-una-bomba
    titulo: La altura de Euler de un rodete centrífugo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      El rodete de una bomba centrífuga tiene $300\ \text{mm}$ de diámetro
      exterior y $20\ \text{mm}$ de ancho a la salida, y gira a
      $1450\ \text{rpm}$. Los álabes salen con un ángulo
      $\beta_2 = 30°$ respecto de la dirección tangencial, y la bomba impulsa
      $50\ \text{l/s}$.

      La entrada es radial, es decir $c_{u1} = 0$.

      a) Calcular la velocidad de arrastre a la salida, $u_2$.

      b) Calcular la componente meridiana $c_{m2}$.

      c) Calcular la altura de Euler.
    pide: Las dos componentes del triángulo de salida y la altura de Euler.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «la entrada es radial». ¿Qué significa eso y por
          qué simplifica?
        opciones:
          - texto: >-
              Que la velocidad absoluta a la entrada no tiene componente
              tangencial, $c_{u1} = 0$, y por tanto Euler se queda en un solo
              término
            correcta: true
            mensaje: |
              Eso es, y no es casualidad: en una bomba, $\alpha_1 = 90°$ es
              justamente la condición de máximo rendimiento del tema 22. Casi
              todas se diseñan así, y por eso casi todos los enunciados lo
              dicen.
          - texto: >-
              Que el agua entra perpendicular al eje de giro
            mensaje: |
              Eso lo cumple cualquier bomba centrífuga, radial o no: el agua
              entra por el centro y sale por la periferia. «Entrada radial»
              aquí se refiere a la **velocidad absoluta**, no a la geometría.
          - texto: >-
              Que la velocidad relativa a la entrada es nula
            mensaje: |
              Si la relativa fuera nula, el agua no atravesaría el rodete. Lo
              que se anula es la componente **tangencial de la absoluta**,
              $c_{u1}$, que es la que aparece en la ecuación de Euler.

      - tipo: calcular
        titulo: La velocidad de arrastre
        pregunta: |
          ¿Cuánto vale $u_2$?
        respuesta:
          tipo: magnitud
          valor: '22.78 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '11.39 m/s'
            mensaje: |
              Has usado el radio donde va el diámetro, o al revés.
              $u = \omega r = \pi D N/60$: con el diámetro, la fórmula lleva
              $\pi D$, no $\pi D/2$.
          - valor: '1367 m/s'
            mensaje: |
              Te has dejado el 60. La velocidad de giro viene en revoluciones
              por **minuto** y $\omega$ tiene que salir en rad/s.
        pista: |
          $u_2 = \dfrac{\pi D_2 N}{60}$, con $D_2$ en metros.
        desarrollo: |
          $$
          u_2 = \frac{\pi\cdot 0{,}3\cdot 1450}{60} = 22{,}78\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La componente meridiana
        pregunta: |
          ¿Cuánto vale $c_{m2}$?
        respuesta:
          tipo: magnitud
          valor: '2.653 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '10.61 m/s'
            mensaje: |
              Has usado el área de un círculo, $\pi D^{2}/4$. La sección de
              salida de un rodete no es un círculo: es la **superficie lateral
              del cilindro** que forma la periferia, $\pi D_2 b_2$.
          - valor: '0.833 m/s'
            mensaje: |
              Revisa el ancho: son $20\ \text{mm} = 0{,}02\ \text{m}$. Con
              $b_2$ en centímetros el área sale demasiado grande.
        pista: |
          El agua sale por toda la periferia del rodete: el área es
          $\pi D_2 b_2$.
        desarrollo: |
          $$
          c_{m2} = \frac{Q}{\pi D_2 b_2}
          = \frac{0{,}05}{\pi\cdot 0{,}3\cdot 0{,}02} = 2{,}65\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La altura de Euler
        pregunta: |
          ¿Cuál es la altura de Euler de este rodete?
        respuesta:
          tipo: magnitud
          valor: '42.26 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '52.94 m'
            mensaje: |
              Has tomado $c_{u2} = u_2$, que es lo que ocurriría con álabes
              **radiales** ($\beta_2 = 90°$). Con álabes curvados hacia atrás,
              como aquí, hay que restar $c_{m2}/\tan\beta_2$.
          - valor: '63.61 m'
            mensaje: |
              Signo cambiado: has sumado $c_{m2}/\tan\beta_2$ en vez de
              restarlo. Los álabes van curvados **hacia atrás**, así que la
              componente tangencial del agua es **menor** que la del rodete;
              $c_{u2}$ tiene que salir por debajo de $u_2$.
        pista: |
          Del triángulo de salida, $c_{u2} = u_2 - c_{m2}/\tan\beta_2$. Y con
          entrada radial, $H_E = u_2 c_{u2}/g$.
        desarrollo: |
          $$
          c_{u2} = u_2 - \frac{c_{m2}}{\tan\beta_2}
          = 22{,}78 - \frac{2{,}65}{\tan 30°} = 22{,}78 - 4{,}59
          = 18{,}18\ \text{m/s}
          $$
          $$
          H_E = \frac{u_2\,c_{u2}}{g} = \frac{22{,}78\cdot 18{,}18}{9{,}8}
          = 42{,}3\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con entrada radial, $c_{u1} = 0$ y la ecuación de Euler se reduce
              a $H_E = u_2 c_{u2}/g$.
          - texto: >-
              La componente meridiana sale de la continuidad sobre la
              superficie lateral del rodete, $c_{m2} = Q/(\pi D_2 b_2)$.
          - texto: >-
              Del triángulo de salida, $c_{u2} = u_2 - c_{m2}/\tan\beta_2 =
              18{,}18$ m/s, y de ahí $H_E = 42{,}3$ m.
          - texto: >-
              Como $H_E$ es la altura teórica para infinitos álabes, la bomba
              real dará algo más, porque los álabes reales guían mejor el
              flujo.
            trampa: true
            mensaje: |
              Al revés: $H_E$ es un **techo** que la máquina real no alcanza.
              Con álabes finitos el flujo no queda perfectamente guiado —hay
              recirculación entre canales— y la altura interna $H_i$ es menor.
              Esa relación es precisamente la eficiencia del álabe,
              $H_i/H_E < 1$.

    resolucion: |
      **La velocidad de arrastre.**

      $$
      u_2 = \frac{\pi D_2 N}{60} = \frac{\pi\cdot 0{,}3\cdot 1450}{60}
      = 22{,}78\ \text{m/s}
      $$

      **La componente meridiana.** El agua atraviesa la superficie lateral del
      rodete, no un círculo:

      $$
      c_{m2} = \frac{Q}{\pi D_2 b_2} = \frac{0{,}05}{\pi\cdot 0{,}3\cdot 0{,}02}
      = 2{,}65\ \text{m/s}
      $$

      **El triángulo, y la altura.** Con álabes curvados hacia atrás:

      $$
      c_{u2} = u_2 - \frac{c_{m2}}{\tan\beta_2} = 18{,}18\ \text{m/s}
      \qquad
      H_E = \frac{u_2 c_{u2}}{g} = 42{,}3\ \text{m}
      $$

      **Tres lecturas.**

      La primera es de magnitud: $c_{m2}$ es **ocho veces menor** que $u_2$. En
      un rodete centrífugo el agua sale casi tangencialmente, arrastrada; lo
      que la empuja hacia fuera es una fracción pequeña de su velocidad. Por
      eso $c_{u2}$ se parece tanto a $u_2$.

      La segunda es de diseño: con álabes **radiales** ($\beta_2 = 90°$) sería
      $c_{u2} = u_2$ y la altura subiría a 52,9 m. Curvarlos hacia atrás cuesta
      un 20 % de altura teórica, y aun así es lo que se hace en casi todas las
      bombas, porque da una curva característica estable y mejor rendimiento.

      La tercera es de expectativas: 42,3 m es la altura de **Euler**, el techo
      con infinitos álabes. La manométrica real de esta bomba estará bastante
      por debajo, después de descontar la eficiencia del álabe y el rendimiento
      hidráulico.

  # ── NUESTROS, y al final (§04): no abren el tema ni son de la colección.
  #    Entrenan lo que preguntan los tests de huecos de máquinas —el
  #    principio de cada familia y la clasificación por el rodete— con una
  #    cuenta real detrás, y se apoyan en las máquinas de la práctica 24.
  - id: ejflu22-el-techo-de-euler-y-el-de-pascal
    titulo: Euler pone techo a la altura de una bomba, y Pascal no
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre el teorema fundamental de
      las turbomáquinas del tema 22 y las máquinas de la práctica 24 del guion
      de prácticas de Mecánica de Fluidos (UPV/EHU), con datos inventados: el
      guion no da las medidas de esas máquinas. No es de examen ni de la
      colección de problemas.
    nivel: practica
    enunciado: |
      En la práctica 24 se desmontan, entre otras máquinas, una turbobomba y
      una bomba alternativa de émbolo. La turbobomba tiene un rodete de
      $200\ \text{mm}$ de diámetro exterior, gira a $2900\ \text{rpm}$ y la
      entrada del agua en el rodete es radial. La de émbolo lleva una válvula
      de seguridad tarada a $25\ \text{bar}$. Las dos bombean agua.

      a) Decir en qué principio se basa cada una.

      b) Calcular la velocidad de arrastre a la salida del rodete y la altura
      de Euler de la turbobomba con la válvula de impulsión cerrada del todo.

      c) Pasar esa altura a bar y explicar qué le pasa a cada máquina si se
      le cierra del todo la impulsión.
    pide: El principio de cada máquina, la altura de Euler a caudal nulo, y qué pasa al cerrar la impulsión de cada una.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos máquinas del enunciado intercambian energía con el agua de
          formas distintas. ¿En qué principio se basa cada una, primero la
          turbobomba y después la de émbolo?
        opciones:
          - texto: >-
              El teorema de Euler, que es el del momento cinético aplicado a la
              máquina, y el principio de Pascal
            correcta: true
            mensaje: |
              Eso es. Una turbomáquina intercambia energía porque el rodete le
              cambia al agua su momento cinético; una de desplazamiento
              positivo encierra un volumen y lo empuja, y Pascal transmite la
              presión aguas abajo. Las soluciones impresas escriben «el
              teorema de Euler», que es el del momento cinético del tema 14
              con nombre propio.
          - texto: >-
              El principio de Pascal y el teorema de Euler, en ese orden
            mensaje: |
              Están cruzados. Pascal explica la máquina que **encierra** el
              líquido y lo empuja —un émbolo, un gato hidráulico—. Una
              turbobomba no encierra nada: el agua la atraviesa de forma
              continua y el rodete le cambia el momento cinético.
          - texto: >-
              La ecuación de Bernoulli y el principio de Pascal
            mensaje: |
              Bernoulli es un balance de energía **a lo largo** de una línea de
              corriente, y dentro de un rodete que gira no se puede aplicar tal
              cual: el rodete mete o saca energía. Lo que explica cómo lo hace
              es el momento cinético, es decir, Euler.
          - texto: >-
              El teorema de la cantidad de movimiento en las dos
            mensaje: |
              Para la turbomáquina los apuntes admiten las dos formas, la
              cantidad de movimiento y su momento, aunque lo que hace girar el
              rodete es el momento respecto del eje. Lo que falla es la de
              desplazamiento positivo: la presión la pone el émbolo y la
              transmite Pascal.

      - tipo: calcular
        titulo: La velocidad de arrastre a la salida
        pregunta: |
          b) ¿Cuánto vale $u_2$?
        respuesta:
          tipo: magnitud
          valor: '30.37 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '15.18 m/s'
            mensaje: |
              Has metido el radio en la fórmula que lleva el diámetro, o has
              dividido dos veces entre dos. Con el diámetro,
              $u_2 = \pi D_2 N/60$.
          - valor: '1822 m/s'
            mensaje: |
              Te falta dividir entre 60: el régimen viene en revoluciones por
              **minuto**, y la velocidad se pide en metros por segundo.
        pista: |
          $u_2 = \omega r_2 = \pi D_2 N/60$, con $D_2$ en metros.
        desarrollo: |
          $$
          u_2 = \frac{\pi D_2 N}{60} = \frac{\pi\cdot 0{,}2\cdot 2900}{60}
          = 30{,}37\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La altura de Euler con la impulsión cerrada
        pregunta: |
          b) Con la válvula de impulsión cerrada del todo, ¿qué altura de Euler
          da el rodete?
        respuesta:
          tipo: magnitud
          valor: '94.11 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '47.05 m'
            mensaje: |
              Has escrito $u_2^{2}/2g$, como si fuera una altura cinética. La
              ecuación de Euler no lleva el 2: con entrada radial es
              $H_E = u_2 c_{u2}/g$, y con caudal nulo $c_{u2} = u_2$.
          - valor: '376.4 m'
            mensaje: |
              Es el cuádruple, que es lo que sale con una velocidad de arrastre
              doble: has tomado el diámetro como si fuera el radio en
              $u = \omega r$. Con $D_2 = 0{,}2$ m, el radio es 0,1 m.
        pista: |
          Con la impulsión cerrada no hay caudal, así que $c_{m2} = 0$ y, del
          triángulo de salida, $c_{u2} = u_2 - c_{m2}/\tan\beta_2 = u_2$.
        desarrollo: |
          Con entrada radial, $c_{u1} = 0$ y $H_E = u_2 c_{u2}/g$. Sin caudal
          no hay componente meridiana, y el triángulo de salida da
          $c_{u2} = u_2$:

          $$
          H_E(Q = 0) = \frac{u_2^{2}}{g} = \frac{30{,}37^{2}}{9{,}8}
          = 94{,}1\ \text{m}
          $$

          No depende del ángulo de los álabes ni del ancho del rodete: solo de
          lo deprisa que gira su periferia.

      - tipo: calcular
        titulo: Esa altura, en bar
        pregunta: |
          c) ¿Qué presión son esos metros de columna de agua, en bar?
        respuesta:
          tipo: magnitud
          valor: '9.223 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.9411 bar'
            mensaje: |
              Has multiplicado por la densidad, $1000\ \text{kg/m}^{3}$, en vez
              de por el peso específico, $9800\ \text{N/m}^{3}$. Te falta la
              gravedad: $p = \gamma H = \rho g H$.
          - valor: '94.11 bar'
            mensaje: |
              Un bar no es un metro de columna de agua: son unos
              $10{,}2\ \text{mca}$. La presión es $\gamma H = 9800\cdot 94{,}1$
              pascales, y un bar son $10^{5}$ Pa.
        pista: |
          $p = \gamma H$, en pascales, y $1\ \text{bar} = 10^{5}\ \text{Pa}$.
        desarrollo: |
          $$
          p = \gamma H_E = 9800\cdot 94{,}11 = 9{,}22\cdot 10^{5}\ \text{Pa}
          = 9{,}22\ \text{bar}
          $$

          Y es un techo que la bomba real ni siquiera toca: con álabes finitos
          y pérdidas, su altura a válvula cerrada se queda por debajo.

      - tipo: justificar
        pregunta: Ordena la respuesta a los tres apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              La turbobomba se basa en el teorema de Euler: el rodete le cambia
              al agua el momento cinético. La de émbolo, en el principio de
              Pascal: encierra un volumen y lo empuja.
          - texto: >-
              Con la impulsión cerrada no hay caudal, $c_{u2} = u_2$ y la altura
              de Euler es $u_2^{2}/g = 94{,}1$ m, unos 9,2 bar: un techo que
              pone la velocidad del rodete.
          - texto: >-
              Por eso a la turbobomba se le puede cerrar la impulsión: la altura
              sube hasta su valor a caudal nulo, por debajo de ese techo, y la
              presión no pasa de ahí.
          - texto: >-
              La de émbolo sigue empujando el mismo volumen contra una salida
              cerrada, y la presión sube hasta que abre la válvula de
              seguridad, a 25 bar, o hasta que algo cede.
          - texto: >-
              La turbobomba necesita también una válvula de seguridad, porque
              sin caudal su presión sube sin límite, igual que en la de émbolo.
            trampa: true
            mensaje: |
              Es justo lo que la cuenta desmiente. En una turbomáquina la altura
              está atada a la velocidad del rodete: a caudal nulo la de Euler
              es $u_2^{2}/g$, y la real, menos. No hay nada que suba sin límite.
              La válvula de seguridad es de las de desplazamiento positivo,
              porque en ellas quien fija la presión es la instalación, no la
              máquina.

    resolucion: |
      **a) Los principios.** La turbobomba es una turbomáquina: el rodete le
      cambia al agua su momento cinético, y eso lo describe el **teorema de
      Euler**, que es el del momento cinético aplicado a la máquina. La de
      émbolo es de desplazamiento positivo: encierra un volumen y lo empuja, y
      el **principio de Pascal** transmite la presión aguas abajo.

      **b) La altura a caudal nulo.**

      $$
      u_2 = \frac{\pi\cdot 0{,}2\cdot 2900}{60} = 30{,}37\ \text{m/s}
      \qquad
      H_E(Q = 0) = \frac{u_2^{2}}{g} = 94{,}1\ \text{m}
      $$

      Con entrada radial la ecuación de Euler se queda en $u_2 c_{u2}/g$, y
      sin caudal el triángulo de salida da $c_{u2} = u_2$.

      **c) Lo que pasa al cerrar.** Esos 94,1 m son
      $9800\cdot 94{,}1 = 9{,}22\cdot 10^{5}$ Pa, **9,2 bar**, y la bomba real
      se queda por debajo. Cerrarle la impulsión a la turbobomba sube su
      altura hasta ese valor de caudal nulo y la deja ahí: la regulación por
      válvula del tema 25 depende de eso. Otra cosa es tenerla así mucho rato:
      sin caudal, la potencia que sigue absorbiendo se queda en el agua
      encerrada y la calienta. A la de émbolo, en cambio, cerrarle
      la impulsión es peligroso: sigue metiendo el mismo volumen en cada
      embolada, y la presión sube hasta que abre la válvula de seguridad, a
      25 bar —casi el triple de lo que la turbobomba podría dar ni en
      teoría—, o hasta que revienta algo.

      **Lo que hay que llevarse.** La diferencia entre Euler y Pascal no es
      una palabra para un hueco: es la diferencia entre una máquina cuya
      altura depende de cómo gira y otra cuya presión la decide lo que tiene
      delante. De ahí salen las dos curvas del tema 24, la descendente y la
      casi vertical, y la válvula de seguridad que solo lleva una de las dos.

  - id: ejflu22-cual-de-las-dos-turbobombas-es-axial
    titulo: Dos turbobombas, y cuál de las dos tiene el rodete axial
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre la velocidad específica del
      tema 22 y la clasificación por la dirección del flujo de la práctica 24
      del guion de prácticas de Mecánica de Fluidos (UPV/EHU). No es de examen
      ni de la colección de problemas.
    nivel: practica
    enunciado: |
      La práctica 24 clasifica las máquinas, entre otros criterios, por la
      dirección del flujo respecto del rodete y por los parámetros
      adimensionales. Se tienen dos turbobombas de catálogo, las dos con agua
      y en su punto de máximo rendimiento:

      - **A**: $20\ \text{l/s}$ a $60\ \text{m}$, girando a
        $2900\ \text{rpm}$.
      - **B**: $800\ \text{l/s}$ a $4\ \text{m}$, girando a
        $725\ \text{rpm}$.

      a) Calcular la potencia útil de cada una, en CV.

      b) Calcular el número de Camerer de cada una.

      c) Decir cuál tiene el rodete radial y cuál el axial.

      Datos: $1\ \text{CV} = 735{,}5\ \text{W}$;
      $\gamma = 9800\ \text{N/m}^{3}$.
    pide: Las dos potencias útiles, los dos números de Camerer y qué rodete lleva cada una.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una turbobomba, ¿qué altura, qué potencia y qué caudal se meten en
          la velocidad específica?
        opciones:
          - texto: >-
              La manométrica $H_m$, la útil $P_u$ y el caudal útil $Q_u$: los
              del lado por donde sale el producto
            correcta: true
            mensaje: |
              Eso es. Una bomba vende altura y caudal en la tubería, así que se
              toman los útiles. En una turbina es al revés: altura neta,
              potencia efectiva y caudal total.
          - texto: >-
              La absorbida $H_a$, la potencia absorbida $P_a$ y el caudal total
              $Q_t$
            mensaje: |
              Esas son las del lado del motor. La velocidad específica de una
              bomba se define con lo que la bomba entrega, no con lo que pide:
              meter $P_a$ la haría depender de los rendimientos.
          - texto: >-
              La altura neta $H_n$, la potencia efectiva $P_e$ y el caudal total
              $Q_t$
            mensaje: |
              Esas son las de una **turbina**. Los símbolos de la fórmula son
              los mismos en las dos máquinas, pero significan cosas distintas,
              y es el error típico del tema 22.

      - tipo: calcular
        titulo: La potencia útil de A
        pregunta: |
          a) ¿Qué potencia útil da la bomba A, en CV?
        respuesta:
          tipo: magnitud
          valor: '15.99 cv'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1.632 cv'
            mensaje: |
              Has usado la densidad, $1000\ \text{kg/m}^{3}$, donde va el peso
              específico. La potencia útil es $\gamma\,Q\,H$, con
              $\gamma = 9800\ \text{N/m}^{3}$.
          - valor: '11.76 cv'
            mensaje: |
              Ese número son los **kilovatios**, no los CV. Un CV son
              $735{,}5\ \text{W}$, así que en CV sale mayor: 15,99.
        pista: |
          $P_u = \gamma\,Q_u\,H_m$ en vatios, y después entre 735,5.
        desarrollo: |
          $$
          P_u = 9800\cdot 0{,}02\cdot 60 = 11\,760\ \text{W}
          = \frac{11\,760}{735{,}5} = 15{,}99\ \text{CV}
          $$

          Y la de B, $9800\cdot 0{,}8\cdot 4 = 31\,360\ \text{W}$, que son
          $42{,}64\ \text{CV}$.

      - tipo: calcular
        titulo: El número de Camerer de A
        pregunta: |
          b) ¿Cuánto vale $n_s$ para la bomba A?
        respuesta:
          tipo: numero
          valor: '69.4'
          tolerancia: 1
          formato: un número sin unidades
        distractores:
          - valor: '59.5'
            mensaje: |
              Has metido la potencia en kW. La definición de $n_s$ es «1 CV con
              1 m», y la potencia va en CV: con kW el número sale un 14 % más
              bajo. A seguiría pareciendo radial, así que el error no se ve
              mirando el resultado: hay que evitarlo por costumbre.
          - valor: '538'
            mensaje: |
              Has usado $H^{3/4}$, que es el exponente de $n_q$ y de $N_s$. El
              número de Camerer lleva $H^{5/4}$, y con el otro exponente la
              bomba A, que es radial lenta, parecería diagonal: la figura 22.13
              de los apuntes pone las diagonales entre 300 y 600.
        pista: |
          $n_s = N\,\sqrt{P_u}/H_m^{5/4}$, con $N$ en rpm y $P_u$ en CV.
        desarrollo: |
          $$
          n_{s,A} = \frac{2900\cdot\sqrt{15{,}99}}{60^{5/4}}
          = \frac{2900\cdot 4{,}00}{167{,}0} = 69{,}4
          $$

      - tipo: calcular
        titulo: El número de Camerer de B
        pregunta: |
          b) ¿Y para la bomba B?
        respuesta:
          tipo: numero
          valor: '837'
          tolerancia: 10
          formato: un número sin unidades
        distractores:
          - valor: '718'
            mensaje: |
              Otra vez la potencia en kW: sale un 14 % más bajo, como en A, y B
              sigue pareciendo axial. Tampoco aquí se ve el error en el
              resultado.
          - valor: '1674'
            mensaje: |
              Has usado $H^{3/4}$ en vez de $H^{5/4}$. Con un salto de 4 m la
              diferencia entre los dos exponentes es un factor $4^{1/2} = 2$.
        pista: |
          La misma fórmula, con $P_u = 42{,}64$ CV, $H_m = 4$ m y 725 rpm.
        desarrollo: |
          $$
          n_{s,B} = \frac{725\cdot\sqrt{42{,}64}}{4^{5/4}}
          = \frac{725\cdot 6{,}53}{5{,}66} = 837
          $$

          Doce veces el de A.

      - tipo: justificar
        pregunta: Ordena la clasificación. Una pieza es falsa.
        piezas:
          - texto: >-
              En una bomba, $n_s$ se calcula con lo que entrega: $H_m$, $P_u$
              en CV y el régimen en rpm.
          - texto: >-
              A da 15,99 CV a 60 m con 2900 rpm: $n_s = 69{,}4$. B da 42,64 CV
              a 4 m con 725 rpm: $n_s = 837$.
          - texto: >-
              Velocidad específica pequeña, rodete radial; grande, rodete axial.
              A es la radial y B la axial, la que se parece a una Hélice.
          - texto: >-
              B es la axial porque es la más grande: mueve cuarenta veces más
              caudal, y el tamaño del rodete es lo que decide la dirección del
              flujo.
            trampa: true
            mensaje: |
              La velocidad específica no lleva el diámetro dentro, y por eso
              caracteriza a la familia entera y no al tamaño. Lo que decide que
              B sea axial es la **forma** de su punto de trabajo: mucho caudal
              con muy poca altura. Una bomba semejante a A pero del doble de
              tamaño tendría el mismo número de Camerer, y seguiría siendo
              radial.

    resolucion: |
      **a) Las potencias útiles**, con las magnitudes que salen por la
      impulsión:

      $$
      P_{u,A} = 9800\cdot 0{,}02\cdot 60 = 11\,760\ \text{W} = 15{,}99\ \text{CV}
      \qquad
      P_{u,B} = 9800\cdot 0{,}8\cdot 4 = 31\,360\ \text{W} = 42{,}64\ \text{CV}
      $$

      **b) Los números de Camerer.**

      $$
      n_{s,A} = \frac{2900\sqrt{15{,}99}}{60^{5/4}} = 69{,}4
      \qquad
      n_{s,B} = \frac{725\sqrt{42{,}64}}{4^{5/4}} = 837
      $$

      **c) Qué rodete lleva cada una.** Velocidad específica pequeña, máquina
      radial; grande, axial. La figura 22.13 de los apuntes le pone números en
      bombas: radiales de 40 a 300 (lentas hasta 80), diagonales de 300 a 600
      y axiales de 600 a 1800. A, con 69, es una turbobomba **radial** lenta:
      poca agua a mucha altura, con el rodete que la lanza hacia la periferia.
      B, con 837, doce veces más, es **axial**: mucha agua a muy poca altura,
      con un rodete de hélice que la empuja en la dirección del eje.

      **Lo que hay que llevarse.** Es el mismo razonamiento que elige entre
      Pelton, Francis y Kaplan en el tema 23, aplicado a bombas: el número dice
      la forma del rodete antes de ver la máquina. Y el cuidado de siempre con
      las unidades: la potencia en CV, el régimen en rpm y el exponente 5/4.
