asignatura: fluidos
curso: '2019-2020'
convocatoria: segundo-parcial
fecha: 4 de junio de 2020
# **Están los cinco.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 5 a 8 (11 a 14 del PDF).
#
# Como el resto del cuadernillo, publica el resultado de cada apartado y
# nada más (`pdfEs: enunciado-con-resultados`), y no imprime reparto por
# competencia sino el porcentaje de cada ejercicio junto a su número: 13 /
# 15 / 25 / 27 / 30. **Suman 110**, comprobado en la página (págs. 11, 12 y
# 13 del PDF), y se publican como vienen: la página avisa de que no suman
# 100. Por eso los ejercicios van sin `puntos`.
#
# **El 4 y el 5 estuvieron en `fuera` hasta el 30 de septiembre de 2026.**
#
# - El **4** decía que faltaba el cuadro de pérdidas menores. Está: es el
#   cuadro 24 de «Cuadros y ábacos» (págs. 44 a 49 del PDF), que da la
#   salida redondeada (0,05), el codo comercial (0,75), la compuerta con
#   X/D = 0,375 (0,81) y la esférica a 30º (5,47). Con ellas sale la curva
#   impresa, y con la curva sin redondear, la bomba impresa a la centésima.
# - El **5** decía que sin la tabla metida en la figura no había enunciado.
#   La tabla se lee en la página renderizada (pág. 13 del PDF) y va en las
#   «Notas nuestras» del enunciado.
#
# Las entradas llevan `n` aunque ya no quede nada en `fuera`: no cambia nada
# en la página y deja los puntos atados a su número del cuadernillo.
#
# Lo que este examen aporta al corpus:
#
# - **Un álabe móvil** (ej. 1), que es el único ejercicio del corpus donde
#   la velocidad relativa decide la fuerza: 42,47 kN huyendo del chorro y
#   169,9 kN yendo a su encuentro, con el mismo chorro.
# - **Variables repetidas poco habituales** (ej. 2): el enunciado impone
#   $\mu$, $\varepsilon$ y $c$ en vez de las de siempre, y lo primero que
#   hay que hacer es comprobar que son dimensionalmente independientes.
# - **Un canal y una tubería forzada en el mismo problema** (ej. 3), con la
#   fórmula de Barlow y la pregunta que de verdad importa: si acelerar el
#   cierre de la válvula obliga a cambiar el espesor.
# - **La curva en papel milimetrado, a una escala impuesta** (ej. 4), y la
#   bomba sacada de dos puntos de funcionamiento.
# - **Una red con dos tuberías en paralelo** (ej. 5), donde lo que se
#   reparte por igual es la pérdida y no el caudal.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (13%)». Suman 110, como vienen impresos'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 13 }
    - { n: 2, puntos: 15 }
    - { n: 3, puntos: 25 }
    - { n: 4, puntos: 27 }
    - { n: 5, puntos: 30 }

# `fuera` queda vacío: están los cinco.

