fecha: 4 de junio de 2020
# **Tres de los cinco.** Del cuadernillo «Exámenes 2020-2025» del
# departamento.
#
# Porcentajes impresos: 13 / 15 / 25 / 27 / 30, sin reparto por competencia,
# así que van sin `puntos`.
#
# **Faltan dos, y los dos por lo mismo: una tabla que está en la figura.**
#
# - El **4** es una instalación de bombeo con codo comercial, válvula de
#   compuerta al 62,5 % y válvula esférica girada 30º. Sus factores de paso
#   salen del cuadro de pérdidas menores del departamento, que no está
#   entre el material disponible; sin ellos, el término
#   $1{,}81\cdot 10^{-3}Q^{2}$ de la curva publicada no se puede
#   reconstruir. §13 caso 2.
# - El **5** es una red de cinco tuberías cuyas longitudes y diámetros van
#   en una tabla dentro de la figura.
#
# Lo que este examen aporta al corpus:
#
# - **Un álabe móvil** (ej. 1), que es el único ejercicio del corpus donde
#   la velocidad relativa decide la fuerza: 42,47 kN huyendo del chorro y
#   169,9 kN yendo a su encuentro, con el mismo chorro.
# - **Variables repetidas poco habituales** (ej. 2): el enunciado impone
#   $\mu$, $\varepsilon$ y $c$ en vez de las de siempre, y lo primero que
#   hay que hacer es comprobar que son dimensionalmente independientes.
# - **Un canal y una tubería forzada en el mismo problema** (ej. 3), con la
#   fórmula de Barlow y la pregunta que de verdad importa: si acelerar el
#   cierre de la válvula obliga a cambiar el espesor.
pdf: examenes-2020-2025.pdf

fuera:
  - n: 4
    motivo: >-
      Una instalación de bombeo con codo comercial, válvula de compuerta
      al 62,5 % y válvula esférica girada 30°. Sus factores de paso salen
      del cuadro de pérdidas menores del departamento, que no está entre
      el material que tenemos, y sin ellos no se puede reconstruir el
      término cuadrático de la curva que el examen publica.
  - n: 5
    motivo: >-
      Una red de cinco tuberías cuyas longitudes y diámetros van en una
      tabla metida dentro de la propia figura. Sin esa tabla no hay
      enunciado que transcribir.

