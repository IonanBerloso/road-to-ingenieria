ejercicios:
  # ── 1 (13 %) · El álabe móvil. La velocidad relativa decide la fuerza, y
  #    cuatro veces más si el álabe embiste que si huye.
  - id: exflu1920-2par-1-el-alabe-que-huye-y-el-que-embiste
    titulo: El álabe que huye del chorro, y el que va a su encuentro
    fuente: >-
      Ejercicio 1 · Segundo parcial, 4 de junio de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un chorro de agua, de diámetro $d = 13$ cm incide tangencialmente sobre
      el álabe de la figura, que lo desvía 180º. La velocidad del agua a la
      salida de la boquilla es $v = 60$ m/s. Se pide:

      **a)** Esfuerzo que ejerce el chorro sobre el álabe si la velocidad de
      desplazamiento del álabe es $u = v/3$.

      **b)** ¿A qué velocidad debe desplazarse el álabe para que la potencia
      útil obtenida sea nula? Razonar la respuesta.

      **c)** Esfuerzo que ejercería el chorro sobre el álabe si el álabe se
      desplazara a una velocidad $u = 20$ m/s **hacia el chorro**.

      <figure class="figura-examen">
      <svg viewBox="24 24 396 176" role="img" width="440" height="196"
           aria-labelledby="fy1t fy1d">
        <title id="fy1t">El chorro y el álabe que lo desvía 180 grados</title>
        <desc id="fy1d">Una boquilla lanza hacia la derecha un chorro de agua de
        trece centímetros de diámetro a sesenta metros por segundo. El chorro
        entra tangencialmente en un álabe con forma de media caña que lo hace
        girar ciento ochenta grados, de modo que el agua sale en sentido
        contrario, hacia la izquierda. El álabe no está quieto: se desplaza con
        una velocidad u que en los dos primeros apartados se aleja del chorro y
        en el tercero va a su encuentro.</desc>

        <rect x="40" y="92" width="44" height="26" fill="var(--ink)" opacity=".7"/>
        <text x="56" y="72" text-anchor="middle" font-size="10" fill="var(--faint)">boquilla</text>

        <rect x="84" y="92" width="152" height="26" fill="var(--live)" fill-opacity=".35"/>
        <line x1="120" y1="105" x2="200" y2="105" stroke="var(--live)" stroke-width="2.4"
              marker-end="url(#fy1f)"/>
        <text x="150" y="140" text-anchor="middle" font-size="10.5" fill="var(--live)">v = 60 m/s</text>
        <line x1="104" y1="92" x2="104" y2="118" stroke="var(--faint)" stroke-width="1"/>
        <line x1="98" y1="92" x2="110" y2="92" stroke="var(--faint)" stroke-width="1"/>
        <line x1="98" y1="118" x2="110" y2="118" stroke="var(--faint)" stroke-width="1"/>
        <text x="104" y="86" text-anchor="middle" font-size="10" fill="var(--faint)">d = 13 cm</text>

        <path d="M236 92 A 40 40 0 0 1 236 172" fill="none" stroke="var(--ink)"
              stroke-width="7" stroke-linecap="round"/>
        <path d="M236 118 A 14 14 0 0 0 236 146" fill="none" stroke="var(--ink)"
              stroke-width="3" opacity=".5"/>
        <text x="290" y="132" font-size="11" fill="var(--ink)">álabe</text>

        <rect x="150" y="146" width="86" height="26" fill="var(--live)" fill-opacity=".35"/>
        <line x1="216" y1="159" x2="160" y2="159" stroke="var(--live)" stroke-width="2.4"
              marker-end="url(#fy1f)"/>
        <text x="152" y="188" text-anchor="middle" font-size="10.5" fill="var(--live)">sale en sentido contrario</text>

        <line x1="296" y1="105" x2="352" y2="105" stroke="var(--alt)" stroke-width="2.4"
              marker-end="url(#fy1u)"/>
        <text x="358" y="109" font-size="11" fill="var(--alt)">u</text>
        <text x="324" y="94" text-anchor="middle" font-size="10" fill="var(--alt)">se aleja (a y b)</text>
        <line x1="352" y1="60" x2="296" y2="60" stroke="var(--alt)" stroke-width="2"
              marker-end="url(#fy1u)" opacity=".55"/>
        <text x="324" y="50" text-anchor="middle" font-size="10" fill="var(--alt)"
              opacity=".8">embiste (c)</text>

        <defs>
          <marker id="fy1f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/>
          </marker>
          <marker id="fy1u" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      Lo que empuja el álabe no es la velocidad del chorro sino la
      **velocidad relativa**, v − u. Por eso huyendo a v/3 la fuerza baja, a
      v exacta se anula, y **embistiendo** el chorro la velocidad relativa
      crece a v + u y la fuerza se dispara.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura está redibujada del cuadernillo, que solo
      pinta el álabe alejándose del chorro; el sentido del apartado c) lo
      añadimos nosotros. La nota de los cinco pasos va impresa dentro del
      apartado a), detrás de su pregunta.
    notas:
      - >-
        **Nota: en la resolución se deben seguir obligatoriamente los cinco
        pasos**.
    pide: La fuerza sobre el álabe en dos situaciones, y la velocidad de potencia nula.

    pasos:
      - tipo: reconocer
        pregunta: |
          El álabe se mueve. ¿Qué velocidad entra en el teorema de la cantidad
          de movimiento?
        opciones:
          - texto: >-
              La **relativa** al álabe, $v-u$, tanto en el caudal que lo
              alcanza como en la velocidad con que lo hace
            correcta: true
            mensaje: |
              Eso es, y es lo que hace que el resultado vaya con el
              **cuadrado**. Al volumen de control solidario con el álabe le
              llega un caudal $\rho A (v-u)$ a velocidad relativa $v-u$, así
              que la fuerza es $\rho A (v-u)^{2}$ por el factor del giro.
          - texto: >-
              La absoluta del chorro, $v$, porque es la que sale de la
              boquilla
            mensaje: |
              Si el álabe huye, parte del chorro nunca lo alcanza: el caudal
              que efectivamente lo golpea es menor. Con $v$ a secas la fuerza
              saldría 95,6 kN en vez de 42,47.
          - texto: >-
              La suma, $v+u$, porque el álabe se aleja
            mensaje: |
              La suma es la del apartado c), donde el álabe va **hacia** el
              chorro. En el a) se aleja, así que la relativa es la resta.

      - tipo: calcular
        titulo: La fuerza con el álabe huyendo
        pregunta: |
          Con $u = v/3$, ¿cuánto vale la fuerza sobre el álabe, en kN?
        respuesta:
          tipo: magnitud
          valor: '42.47 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '95.57 kN'
            mensaje: |
              Has usado la velocidad absoluta, 60 m/s. El álabe huye a 20, así
              que la relativa es 40 y la fuerza cae con su cuadrado: por un
              factor $(40/60)^{2} = 0{,}444$.
          - valor: '21.24 kN'
            mensaje: |
              Te has dejado el factor 2 del giro de 180º. El álabe no detiene
              el chorro: lo devuelve, así que la variación de cantidad de
              movimiento es el doble.
        pista: |
          $F = \rho A (v-u)^{2}(1-\cos 180^{\circ}) = 2\rho A (v-u)^{2}$.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}13^{2}}{4} = 0{,}013273\ \text{m}^{2}
          \qquad
          v-u = 40\ \text{m/s}
          $$
          $$
          F = 2\cdot 1000\cdot 0{,}013273\cdot 40^{2} = 42{,}47\ \text{kN}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, con los cinco pasos a la vista: la nota del
          enunciado los hace obligatorios, así que los 42,47 kN solos no
          bastan. Cada paso numerado y con su título, y el volumen de control y
          los ejes dibujados sobre el álabe. En el paso de las velocidades está
          lo que decide este ejercicio: con el álabe huyendo, la velocidad y el
          caudal que entran en el teorema son los relativos al álabe.
        rubrica: cinco-pasos-de-la-cantidad-de-movimiento
        veredicto: |
          Si en tu folio están los puntos que la rúbrica marca como mínimos, los
          42,47 kN valen lo que pesan. Si en el paso de las velocidades has
          puesto los 60 m/s del chorro y el caudal de la boquilla, vuelve a la
          cuenta: con la absoluta sale más del doble.

      - tipo: calcular
        titulo: La velocidad de potencia nula
        pregunta: |
          ¿A qué velocidad debe ir el álabe para que la potencia útil sea
          nula, en m/s? (la solución distinta de cero)
        respuesta:
          tipo: magnitud
          valor: '60 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '30 m/s'
            mensaje: |
              La mitad de la velocidad del chorro es donde tiene su máximo de
              potencia una **rueda** Pelton, en la que todo el caudal acaba
              alcanzando alguna cazoleta. Un álabe solo lo tiene en $v/3$,
              porque le llega $\rho A(v-u)$; y ninguno de los dos es un cero de
              la potencia.
          - valor: '20 m/s'
            mensaje: |
              Esa es la velocidad del apartado a), $v/3$. Ahí la potencia es
              grande, no nula.
        pista: |
          La potencia útil es $F\,u = 2\rho A (v-u)^{2}u$, un producto que se
          anula en dos sitios.
        desarrollo: |
          $$
          P = 2\rho A\,(v-u)^{2}\,u
          $$

          Se anula en $u = 0$ —el álabe no se mueve, no hay trabajo— y en
          $u = v = 60$ m/s: el álabe corre tanto como el chorro y este ya no
          lo alcanza.

      - tipo: calcular
        titulo: La fuerza con el álabe embistiendo
        pregunta: |
          Si el álabe va **hacia** el chorro a 20 m/s, ¿cuánto vale la fuerza,
          en kN?
        respuesta:
          tipo: magnitud
          valor: '169.9 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '42.47 kN'
            mensaje: |
              Esa es la del apartado a), con el álabe huyendo a la misma
              velocidad. La relativa pasa de 40 a 80 m/s, y la fuerza va con
              su cuadrado: **cuatro veces más**.
          - valor: '84.94 kN'
            mensaje: |
              Has duplicado la fuerza en vez de duplicar la velocidad
              relativa. Lo que se dobla es $v-u \to v+u$, y la fuerza depende
              de su cuadrado.
        pista: |
          Ahora la velocidad relativa es $v+u$.
        desarrollo: |
          $$
          F' = 2\rho A\,(v+u)^{2} = 2\cdot 1000\cdot 0{,}013273\cdot 80^{2}
          = 169{,}9\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el álabe en movimiento, lo que cuenta es la velocidad
              relativa: el caudal que lo alcanza y la velocidad con que lo
              hace son las dos $v \mp u$.
          - texto: >-
              De ahí $F = 2\rho A (v\mp u)^{2}$: 42,47 kN huyendo a 20 m/s y
              169,9 kN embistiendo a la misma velocidad.
          - texto: >-
              La potencia útil, $F\,u$, se anula en $u = 0$ y en $u = v$, y
              es máxima entre medias.
          - texto: >-
              En el apartado c), al ir el álabe hacia el chorro, la potencia
              útil obtenida es cuatro veces la del apartado a).
            trampa: true
            mensaje: |
              La **fuerza** es cuatro veces mayor, pero la potencia útil es
              **negativa**: el álabe avanza contra la fuerza, así que es él
              quien entrega trabajo al fluido, no al revés. Un álabe que
              embiste al chorro no es una turbina: es una bomba mal hecha.
              Una Pelton, en cambio, se diseña con la cazoleta huyendo a la
              mitad de la velocidad del chorro.
    resolucion: |
      **La idea.** Con el álabe en movimiento hay que colocarse **sobre él**.
      Desde ahí, el chorro llega con velocidad relativa $v \mp u$, y además el
      caudal que efectivamente lo alcanza es $\rho A (v \mp u)$, no $\rho A v$:
      si el álabe huye, parte del agua nunca le da alcance.

      $$
      F = \rho A\,(v\mp u)\cdot(v\mp u)\cdot(1-\cos 180^{\circ})
      = 2\rho A\,(v\mp u)^{2}
      $$

      **a) Huyendo a $v/3$.** Relativa 40 m/s:

      $$
      F = 2\cdot 1000\cdot 0{,}013273\cdot 1600 = 42{,}47\ \text{kN}
      $$

      **b) Potencia nula.** $P = F\,u$ es un producto que se anula dos veces:
      con el álabe quieto ($u = 0$: hay fuerza pero no hay recorrido) y con el
      álabe corriendo tanto como el chorro ($u = v = 60$ m/s: el agua ya no lo
      alcanza y no hay fuerza). Entre esos dos ceros está el máximo, en
      $u = v/3$ para este álabe.

      **c) Embistiendo a 20 m/s.** Relativa 80 m/s:

      $$
      F' = 2\cdot 1000\cdot 0{,}013273\cdot 6400 = 169{,}9\ \text{kN}
      $$

      **Cuatro veces la del apartado a) con el mismo chorro y la misma
      velocidad de álabe**, solo por cambiarle el signo. Y con una diferencia
      que no se ve en el número: en a) el chorro trabaja sobre el álabe, y en
      c) el álabe trabaja sobre el chorro. La fuerza es mayor pero la máquina
      ha dejado de ser una turbina.

  # ── 2 (15 %) · Variables repetidas poco habituales, y lo primero es
  #    comprobar que valen.
  - id: exflu1920-2par-2-el-modulo-de-aterrizaje-en-marte
    titulo: El módulo que aterriza en Marte, con variables repetidas raras
    fuente: >-
      Ejercicio 2 · Segundo parcial, 4 de junio de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no el desarrollo.
    nivel: examen
    enunciado: |
      La ESA (Agencia Espacial Europea) quiere diseñar un módulo de aterrizaje
      para futuras misiones al planeta Marte. Ante la imposibilidad de hacer
      los test directamente en la atmósfera del planeta de destino, se opta
      por hacer ensayos de laboratorio a escala con un gas idéntico al del
      planeta de destino ($\lambda = 1/10$). El factor determinante en el
      diseño del módulo es el calentamiento generado por fricción con la
      atmósfera durante el descenso, por lo que el diseño pretenderá
      minimizar dicha fuerza de fricción. Se va a considerar que dicha fuerza
      de fricción $F_R$ depende de la velocidad de descenso del módulo $v$, de
      la densidad $\rho$ y la viscosidad dinámica $\mu$ del gas de la
      atmósfera, del ángulo de entrada $\alpha$ (ángulo formado por la línea
      de acción de la gravedad y la dirección de avance del módulo), de la
      velocidad del sonido $c$ en dicho gas, de la rugosidad $\varepsilon$ del
      material superficial del módulo, de la gravedad local $g$, y de la
      longitud característica del módulo $L$. Responder a las siguientes
      preguntas y cuestiones:

      **a)** Se pretende utilizar las variables $\mu$, $\varepsilon$ y $c$
      como variables repetidas para deducir los números adimensionales que
      caracterizan el problema. Justificar si es posible hacerlo. En el caso
      en el que no lo sea, proponer y justificar una lista alternativa de
      variables repetidas.

      **b)** Indicar claramente las **dimensiones** de todas las variables
      involucradas (mediante una tabla por ejemplo), y **deducir
      justificadamente** los números adimensionales que caracterizan el
      problema **obligatoriamente mediante el teorema de
      VASCHY-BUCKINGHAM**. Es obligatorio emplear como variables repetidas
      las propuestas por el enunciado en el apartado anterior, con la
      excepción del caso justificado de la lista alternativa propuesta. Solo
      se valorarán los números adimensionales deducidos siguiendo
      estrictamente las condiciones impuestas y cuya deducción esté
      debidamente justificada.

      **c)** Justificar si es posible obtener la semejanza dinámica absoluta y
      discutir los resultados obtenidos. Se puede basar la respuesta en los
      números adimensionales deducidos en el paso anterior, o en los
      habituales cuyo uso esté justificado por la lista de variables
      involucradas. En el caso en el que se opte por esta segunda opción se
      debe justificar.
    pide: Si las variables repetidas propuestas sirven, los adimensionales y si hay semejanza absoluta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar antes de aceptar $\mu$, $\varepsilon$ y $c$
          como variables repetidas?
        opciones:
          - texto: >-
              Que entre las tres cubran M, L y T sin que ninguna sea
              combinación dimensional de las otras dos
            correcta: true
            mensaje: |
              Eso es, y aquí sí lo cumplen: $\mu$ es la única que aporta masa,
              $\varepsilon$ la única que aporta longitud pura, y $c$ es la que
              trae el tiempo. **Sí es posible**, aunque la elección sea
              inusual.
          - texto: >-
              Que sean las tres variables más importantes del fenómeno
            mensaje: |
              La importancia física no es el criterio; de hecho suele
              recomendarse **no** elegir como repetida la variable cuyo efecto
              se quiere estudiar. El criterio es la independencia dimensional.
          - texto: >-
              Que ninguna de ellas sea adimensional
            mensaje: |
              Eso también hay que mirarlo —el ángulo $\alpha$ no podría ser
              repetida— pero no basta: tres variables con dimensiones pueden
              seguir siendo dependientes entre sí.

      - tipo: calcular
        titulo: Cuántos grupos salen
        pregunta: |
          ¿Cuántos parámetros adimensionales caracterizan el problema?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Te has dejado el ángulo $\alpha$. Es una de las nueve variables
              y, al ser ya adimensional, **es** uno de los grupos: entra tal
              cual.
          - valor: '9'
            mensaje: |
              Nueve son las variables. El teorema resta las tres dimensiones
              independientes.
        pista: |
          $n-k$, contando también el ángulo entre las variables.
        desarrollo: |
          Nueve variables —$F_R$, $v$, $\rho$, $\mu$, $\alpha$, $c$,
          $\varepsilon$, $g$, $L$— y tres dimensiones, así que **seis**
          grupos.

      - tipo: calcular
        titulo: El exponente de la rugosidad en el grupo de la fuerza
        pregunta: |
          En $\Pi_1 = F_R\,\mu^{a}\varepsilon^{b}c^{d}$, ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.1
          formato: un número, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              El signo importa: el producto $\mu\,\varepsilon\,c$ tiene
              dimensiones de fuerza, así que hay que **dividir** por él, no
              multiplicar.
          - valor: '-2'
            mensaje: |
              Ese sería el exponente si la longitud apareciera al cuadrado,
              como en $\rho v^{2}L^{2}$. Aquí la combinación que da fuerza es
              $\mu\varepsilon c$, con la longitud a la primera.
        pista: |
          $[\mu] = ML^{-1}T^{-1}$, $[\varepsilon] = L$, $[c] = LT^{-1}$.
          Multiplícalas y compara con una fuerza.
        desarrollo: |
          $$
          [\mu\,\varepsilon\,c] = (ML^{-1}T^{-1})(L)(LT^{-1}) = MLT^{-2}
          $$

          que es exactamente una fuerza. Así que

          $$
          \Pi_1 = \frac{F_R}{\mu\,\varepsilon\,c}
          $$

          es decir $a = b = d = -1$.

      - tipo: redactar
        que: deduccion
        consigna: |
          Los apartados a) y b) en papel, como los pide el enunciado: la tabla
          con las dimensiones de las nueve variables, el número de grupos, la
          comprobación de que $\mu$, $\varepsilon$ y $c$ valen como repetidas
          y los grupos despejados uno a uno con esas tres. Aquí las repetidas
          vienen impuestas, así que el apartado a) entero es esa comprobación:
          el enunciado pregunta si se puede, y la respuesta es que sí. Y el b)
          avisa de que «solo se valorarán los números adimensionales deducidos
          siguiendo estrictamente las condiciones impuestas»: un Reynolds o un
          Mach escritos de memoria no puntúan.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si en tu folio están los puntos que la rúbrica marca como mínimos, a)
          y b) están enteros. Si te falta la comprobación de las repetidas,
          no es un detalle: es el apartado a). Y si algún grupo sale de otras
          repetidas que no son $\mu$, $\varepsilon$ y $c$, el enunciado dice
          que no se valora.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado c) en papel: si la semejanza dinámica absoluta es
          posible con un gas idéntico y a escala 1/10. Puedes apoyarte en los
          grupos del apartado b) o en los habituales, pero si eliges los
          habituales el enunciado pide justificar que la lista de variables
          los trae: la viscosidad trae un Reynolds, la velocidad del sonido un
          Mach y la gravedad un Froude.
        rubrica: semejanza-absoluta
        veredicto: |
          Si en tu folio están los puntos que la rúbrica marca como mínimos, el
          apartado c) está contestado. Si has escrito «no es posible» sin la
          cuenta que combina las igualdades, te falta justo lo que se puntúa.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mu$, $\varepsilon$ y $c$ son dimensionalmente independientes,
              así que **sí** valen como repetidas.
          - texto: >-
              Los seis grupos son
              $F_R/(\mu\varepsilon c)$, $v/c$, $\rho\varepsilon c/\mu$,
              $g\varepsilon/c^{2}$, $L/\varepsilon$ y el propio $\alpha$.
          - texto: >-
              El segundo es el número de Mach, el tercero un Reynolds
              construido sobre la rugosidad y el cuarto un Froude; el quinto
              es la rugosidad relativa del revés.
          - texto: >-
              Como las variables repetidas son inusuales, los números que
              salen son distintos de los habituales y describen otra física.
            trampa: true
            mensaje: |
              Describen **la misma** física. Cambiar las variables repetidas
              cambia la **forma** de los grupos, no su contenido: aquí salen
              Mach, Reynolds, Froude y la rugosidad relativa, exactamente los
              mismos que con $\rho$, $L$ y $v$, solo que escritos sobre
              $\varepsilon$ y $c$ en vez de sobre $L$ y $v$. Cualquier grupo
              de una lista es producto de potencias de los de la otra.
    resolucion: |
      **a) ¿Valen esas repetidas?** Sí. Hay que comprobar que las tres cubren
      M, L y T de forma independiente:

      | | M | L | T |
      |---|---|---|---|
      | $\mu$ | 1 | $-1$ | $-1$ |
      | $\varepsilon$ | 0 | 1 | 0 |
      | $c$ | 0 | 1 | $-1$ |

      El determinante no se anula: $\mu$ es la única que aporta masa,
      $\varepsilon$ la única longitud pura y $c$ la que trae el tiempo.
      **Sí es posible**, aunque la elección sea poco habitual.

      **b) Los seis grupos.** Nueve variables menos tres dimensiones dan seis,
      y uno de ellos —el ángulo— viene ya adimensional:

      $$
      \Pi_1 = \frac{F_R}{\mu\,\varepsilon\,c}
      \qquad
      \Pi_2 = \frac{v}{c}
      \qquad
      \Pi_3 = \frac{\rho\,\varepsilon\,c}{\mu}
      $$
      $$
      \Pi_4 = \frac{g\,\varepsilon}{c^{2}}
      \qquad
      \Pi_5 = \frac{L}{\varepsilon}
      \qquad
      \Pi_6 = \alpha
      $$

      El $\Pi_2$ es **Mach**; el $\Pi_3$, un **Reynolds** construido sobre la
      rugosidad; el $\Pi_4$, un **Froude**; y el $\Pi_5$, la rugosidad
      relativa puesta del revés. Son los de siempre con otro traje.

      **c) La semejanza absoluta.** No es posible. Con el mismo gas, $\rho$,
      $\mu$ y $c$ valen lo mismo en el modelo y en el prototipo, así que
      $\Pi_2$ obliga a ensayar a la misma velocidad y $\Pi_3$, a la misma
      rugosidad: $\varepsilon_m = \varepsilon_p$. Pero $\Pi_5 = L/\varepsilon$
      pide escalar la rugosidad con el módulo,
      $\varepsilon_m = \lambda\,\varepsilon_p = \varepsilon_p/10$, y las dos
      igualdades solo se cumplen a la vez con $\lambda = 1$. Es la
      incompatibilidad de siempre entre Mach y Reynolds con el mismo gas,
      porque $\Pi_2\,\Pi_3\,\Pi_5 = \rho v L/\mu$. Y $\Pi_4 = g\varepsilon/c^{2}$,
      con la rugosidad ya fijada por $\Pi_3$, pediría además la misma
      gravedad, que un laboratorio en la Tierra no tiene si el módulo baja
      en Marte.

      **Lo que enseña la elección rara de repetidas.** Que los números
      adimensionales no son una lista que memorizar: son lo que sale de las
      variables que uno mete y de las que elige repetir. Con
      $\rho$, $L$ y $v$ habrían salido Mach, Reynolds y Froude «de libro»;
      con $\mu$, $\varepsilon$ y $c$ salen los mismos, escritos de otra
      manera. Y la conclusión física —imposible la semejanza absoluta— es la
      misma en las dos escrituras, que es la comprobación de que el método no
      depende de la elección.

  # ── 3 (25 %) · Un canal y una tubería forzada, con Barlow y la pregunta
  #    de si acelerar el cierre obliga a cambiar el espesor.
  - id: exflu1920-2par-3-el-canal-y-la-tuberia-forzada
    titulo: El canal, la tubería forzada y la válvula que se quiere cerrar antes
    fuente: >-
      Ejercicio 3 · Segundo parcial, 4 de junio de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Al diseñar la instalación de montaña que se muestra en la figura, la
      presa A y el depósito B se unirán mediante un canal con la forma que se
      muestra en la figura. El canal está hecho de madera sin cepillar y la
      pendiente es de 1,5 milésimas. Como hay una gran variación de caudal
      entre el invierno y el verano se quiere lograr que en verano el nivel
      del agua no supere el 45% del diámetro.

      **a)** Si el caudal medio en verano es de 440 l/s, calcula el nivel de
      agua $h$ y la velocidad de flujo $v_c$. Los diámetros comerciales
      aumentan cada 10 cm.

      La superficie libre del depósito B está en la cota $z_B = 1550$ m. Del
      depósito sale una tubería de acero con un diámetro de 430 mm y una
      pendiente del 18%. En el camino hay una válvula de guillotina a una
      altitud de $z_C = 250$ m, y aguas abajo de la válvula, a una altitud de
      $z_D = 200$ m, una pequeña central hidroeléctrica con una turbina Pelton
      con dos inyectores para turbinar el agua que transporta la tubería.
      Después de la central, se vierte el agua en el río a una altitud de
      $z_E = 100$ m. Si el caudal que se transportará a través de la tubería
      debe ser de 390 l/s y el cierre de la válvula, manualmente, se
      realizará en 25 segundos:

      **b)** Calcula el grosor de la tubería utilizando la expresión de Barlow
      y después selecciona el espesor comercial adecuado sabiendo que son
      múltiplos de 2 mm. Explica y razona el procedimiento.

      **c)** El cliente desea que la válvula se cierre automáticamente en 10
      segundos. Explica con valores si es una buena idea o no. El cliente no
      aceptará opiniones contrarias que no estén respaldadas con valores.

      **Notas nuestras.** La figura del cuadernillo no se reproduce, y dice
      esto. El canal une la presa A con el depósito B; su sección es una
      media caña de diámetro $D$ abierta en el fondo de un cauce con 4 m de
      solera a cada lado y paredes de altura $2D$, así que con el agua al 45 %
      del diámetro el flujo va entero dentro de la media caña, igual que en
      una sección circular. De B baja la tubería hasta la válvula C, la
      turbina T en D y el vertido al río en E. Un recuadro da la expresión de
      Barlow,

      $$
      e = \left(\frac{pD}{2\sigma} + m\right)c
      $$

      con $\sigma$ la tensión admisible del material (355 MPa), $m$ el
      aumento debido a la corrosión (1 mm) y $c$ el margen de fabricación
      (1,25). Otro recuadro, «Valores c del material», da: hierro fundido 1;
      hierro y acero 0,5; hormigón 3,3; fibrocemento 5,5; PVC 33,3; PE 100;
      PRFV 5. Esa segunda $c$ no es la de Barlow: es el coeficiente $k$ de la
      fórmula de la celeridad del tema 20,
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El diámetro y el calado del canal, y el espesor de la tubería con los dos tiempos de cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado c), ¿qué hay que comprobar **antes** de calcular la
          sobrepresión?
        opciones:
          - texto: >-
              Si el cierre sigue siendo lento, comparando los 10 s con el
              tiempo crítico $2L/a$
            correcta: true
            mensaje: |
              Eso es, y es todo el apartado. Con 25 s el cierre es lento y
              vale Michaud; con 10 s hay que comprobar si se ha cruzado la
              frontera, porque si el cierre pasa a ser **rápido** la
              sobrepresión se calcula con Allievi y se dispara.
          - texto: >-
              Si el caudal cambia al cerrar más deprisa
            mensaje: |
              El caudal antes del cierre es el mismo, 390 l/s: lo que cambia
              es cuánto tarda en anularse. El caudal no interviene en la
              decisión entre Michaud y Allievi.
          - texto: >-
              Nada: basta con meter 10 en vez de 25 en la fórmula de Michaud
            mensaje: |
              Eso es justo lo que hay que no hacer. Michaud solo vale si el
              cierre es lento, y con 10 s puede que ya no lo sea; usarla fuera
              de su rango subestima la sobrepresión, que es el error caro.

      - tipo: calcular
        titulo: El diámetro comercial del canal
        pregunta: |
          ¿Qué diámetro comercial hay que instalar en el canal, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.1 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1 m'
            mensaje: |
              El cálculo exacto da $1{,}05$ m, y hacia abajo no vale: con 1 m
              el agua pasaría del 45 % del diámetro que impone el enunciado.
          - valor: '0.52 m'
            mensaje: |
              Has dado el radio. Con $R = 0{,}52$ m el diámetro es $1{,}05$, y
              el comercial siguiente, 1,1.
        pista: |
          Madera sin cepillar es $n = 0{,}013$, y el calado de cálculo es
          $y = 0{,}45\,D$.
        desarrollo: |
          Con $y/D = 0{,}45$, el ángulo mojado vale $2{,}941$ rad y

          $$
          A = 1{,}371\,R^{2}
          \qquad
          R_h = 0{,}4662\,R
          $$
          $$
          Q = \frac{1{,}371}{0{,}013}\,(0{,}4662R)^{2/3}\sqrt{0{,}0015}\;R^{2}
          = 2{,}456\,R^{8/3} = 0{,}44
          $$
          $$
          R = 0{,}525\ \text{m}
          \qquad
          D = 1{,}05\ \text{m}
          \;\longrightarrow\;
          D_{com} = 1{,}1\ \text{m}
          $$

          y con ese diámetro, $h = 46{,}3$ cm y $v_c = 1{,}17$ m/s.

      - tipo: calcular
        titulo: El espesor de la tubería forzada
        pregunta: |
          Con el cierre manual de 25 s, ¿qué espesor comercial hay que
          instalar, en mm?
        respuesta:
          tipo: magnitud
          valor: '14 mm'
          tolerancia: 0.02
          formato: un espesor, con su unidad
        distractores:
          - valor: '12 mm'
            mensaje: |
              El cálculo da $12{,}07$ mm, y hacia abajo no vale: el espesor es
              una resistencia y hay que redondear al comercial siguiente.
          - valor: '10 mm'
            mensaje: |
              Te has dejado el margen de fabricación, el $c = 1{,}25$ de la
              expresión de Barlow: sin él salen 9,66 mm y el comercial sería
              10. Ese factor no es opcional; es lo que el fabricante no
              garantiza de su chapa.
        pista: |
          La presión de cálculo es la estática en la válvula más la
          sobrepresión de Michaud, y la longitud sale de la pendiente del
          18 %.
        desarrollo: |
          $$
          L = \frac{1550-250}{0{,}18} = 7222\ \text{m}
          \qquad
          v = \frac{0{,}39}{0{,}1452} = 2{,}686\ \text{m/s}
          $$
          $$
          \Delta h = \frac{2Lv}{gT} = \frac{2\cdot 7222\cdot 2{,}686}{9{,}8\cdot 25}
          = 158\ \text{m}
          $$
          $$
          p = (1300+158)\cdot 9800 = 14{,}29\ \text{MPa}
          $$
          $$
          e = \Bigl(\frac{14{,}29\cdot 10^{6}\cdot 0{,}43}{2\cdot 355\cdot 10^{6}}
          +0{,}001\Bigr)1{,}25 = 12{,}07\ \text{mm}
          \;\longrightarrow\;
          14\ \text{mm}
          $$

      - tipo: calcular
        titulo: La sobrepresión con el cierre rápido
        pregunta: |
          Cerrando en 10 s, ¿cuánto vale la sobrepresión, en metros?
        respuesta:
          tipo: magnitud
          valor: '340 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '396 m'
            mensaje: |
              Has metido 10 s en la fórmula de Michaud. Con el cierre rápido
              Michaud ya no vale: la sobrepresión deja de depender del tiempo
              y pasa a valer $a\,v/g$.
          - valor: '158 m'
            mensaje: |
              Esa es la del cierre de 25 s. Al pasar a 10 s se cruza el tiempo
              crítico y la sobrepresión más que se duplica.
          - valor: '354 m'
            mensaje: |
              Esa sale con la celeridad de los módulos de un manual, 2,2 GPa el
              agua y 210 GPa el acero: 1.290 m/s. El enunciado no da módulos;
              da la tabla «Valores c del material», y con el $k = 0{,}5$ del
              acero la celeridad es 1.241 m/s y la sobrepresión, 340 m. La
              conclusión del apartado es la misma.
        pista: |
          Calcula la celeridad con el espesor del apartado anterior y el
          coeficiente del acero de la tabla de la figura, $k = 0{,}5$; compara
          $2L/a$ con los 10 s y usa la fórmula que toque.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + k\,D/e}}
          = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 430/14}}
          = \frac{9900}{\sqrt{63{,}66}} = 1241\ \text{m/s}
          $$
          $$
          \frac{2L}{a} = \frac{2\cdot 7222}{1241} = 11{,}6\ \text{s} > 10\ \text{s}
          $$

          El cierre es **rápido**, así que vale Allievi:

          $$
          \Delta h = \frac{a\,v}{g} = \frac{1241\cdot 2{,}686}{9{,}8}
          = 340\ \text{m}
          $$

          Con el módulo de compresibilidad del agua y el de Young del acero
          de un manual, 2,2 y 210 GPa, la celeridad sale 1.290 m/s y la
          sobrepresión 354 m; el enunciado no da esos módulos, da la tabla.
          La conclusión del apartado es la misma con los dos números.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Con el espesor de 14 mm y el $k = 0{,}5$ del acero, la celeridad
              es de 1.241 m/s y el tiempo crítico, 11,6 s.
          - texto: >-
              Cerrar en 10 s cruza esa frontera: el cierre pasa a ser rápido y
              la sobrepresión sube de 158 a 340 m.
          - texto: >-
              Aun así, el espesor necesario sube solo de 12,07 a 13,42 mm, y
              el comercial sigue siendo el mismo: **el cambio es aceptable**.
          - texto: >-
              El cambio es aceptable porque la sobrepresión sigue siendo
              pequeña frente a la presión estática.
            trampa: true
            mensaje: |
              No es pequeña: 340 m frente a 1.300 son un **26 %** más de
              presión, y con 158 m eran un 12 %. Lo que hace aceptable el
              cambio no es que la sobrepresión sea pequeña sino que el
              redondeo comercial se la traga: entre 12,07 y 13,42 mm no hay
              ningún múltiplo de 2, así que en los dos casos se compra la
              misma chapa. Es una casualidad afortunada, no un margen de
              diseño.
    resolucion: |
      **a) El canal.** Madera sin cepillar, $n = 0{,}013$, pendiente 1,5
      milésimas y el calado limitado al 45 % del diámetro. Con esa relación,
      el ángulo mojado vale $2{,}941$ rad y la ecuación de Manning queda

      $$
      2{,}456\,R^{8/3} = 0{,}44
      \qquad
      D = 1{,}05\ \text{m}
      \;\longrightarrow\;
      D_{com} = 1{,}1\ \text{m}
      $$

      Con el comercial ya instalado, el nivel real baja a $h = 46{,}3$ cm y la
      velocidad es $v_c = 1{,}17$ m/s.

      **b) El espesor.** La tubería baja 1.300 m con una pendiente del 18 %,
      así que mide unos 7.222 m. A 390 l/s por 430 mm, la velocidad es
      $2{,}686$ m/s, y el cierre de 25 s es **lento** —el tiempo crítico
      ronda los 12 s—, así que vale Michaud:

      $$
      \Delta h = \frac{2Lv}{gT} = 158\ \text{m}
      \qquad
      p = 14{,}29\ \text{MPa}
      $$
      $$
      e = \Bigl(\frac{pD}{2\sigma}+m\Bigr)c = 12{,}07\ \text{mm}
      \;\longrightarrow\;
      14\ \text{mm}
      $$

      **c) Cerrar en 10 segundos.** Aquí no basta con cambiar el 25 por un 10.
      Con el espesor recién calculado y el coeficiente del acero de la tabla
      de la figura, $k = 0{,}5$, la celeridad es

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 430/14}} = 1241\ \text{m/s}
      \qquad
      \frac{2L}{a} = 11{,}6\ \text{s}
      $$

      Diez segundos son **menos** que eso: el cierre deja de ser lento y hay
      que usar Allievi.

      $$
      \Delta h = \frac{a\,v}{g} = 340\ \text{m}
      $$

      Más del doble. Y sin embargo el espesor necesario solo pasa de 12,07 a
      13,42 mm, así que el comercial sigue siendo **14 mm**: **el cambio es
      aceptable**. Con los módulos de un manual en vez de la tabla —2,2 GPa
      el agua, 210 GPa el acero— saldrían 1.290 m/s, 354 m y 13,52 mm: la
      misma chapa y la misma respuesta.

      **Pero conviene decir por qué lo es.** No porque la sobrepresión sea
      pequeña —es un 26 % de la estática— sino porque el redondeo a múltiplos
      de 2 mm se la traga. Si los espesores comerciales fueran de milímetro en
      milímetro, la respuesta sería otra. Un margen que depende del catálogo
      del proveedor no es un margen de diseño, y eso es lo que hay que
      decirle al cliente junto con el «sí».

  # ── 4 (27 %) · Bombeo. Rescatado el 30 de septiembre de 2026: estaba en
  #    `fuera` porque faltaba el cuadro de pérdidas menores, y el cuadro 24
  #    de «Cuadros y ábacos» da las cuatro k (0,05 · 0,75 · 0,81 · 5,47). Con
  #    ellas sale la curva impresa, y con la curva sin redondear, la bomba
  #    impresa a la centésima: B = 5333,53.
  - id: exflu1920-2par-4-la-bomba-deducida-presurizando-el-deposito
    titulo: La curva en papel milimetrado, y la bomba que sale de presurizar el depósito
    fuente: >-
      Ejercicio 4 · Segundo parcial, 4 de junio de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se dispone de una instalación de bombeo desde la que se bombea agua
      desde el depósito A cuya cota es de 2,5 m a una boquilla B cuya salida
      se encuentra situada a una cota de 14,5 m y a un depósito C cuya lámina
      libre se encuentra en la cota 14,5 m. Se cierra la válvula $V_3$. La
      tubería de aspiración tiene una longitud de 15 m y un diámetro de
      100 mm. Su conexión al depósito A es una salida de ángulos redondeados
      y en el conducto de aspiración hay también un codo comercial de 90º de
      radio medio. En la tubería de impulsión, de 150 m de longitud y 150 mm
      de diámetro, se dispone de un codo comercial de 90º de radio medio, una
      válvula de compuerta con un grado de apertura del 62,5% y una válvula
      esférica girada 30º. La válvula $V_2$ de regulación está completamente
      abierta y no genera pérdidas. Se pide, empleando la expresión de
      Hazen-Williams:

      **a)** Expresión de la curva característica de la instalación. Dibujar
      la curva en papel milimetrado. **Escala**: DIN A4 vertical.
      1 cm = 5 l/s y 5 mca.

      Se conoce que el caudal del punto de funcionamiento es de 55 l/s.

      **b)** Expresión analítica de la altura manométrica de la turbobomba
      ($A - B\cdot Q^{2}$) sabiendo que cuando la presión en el depósito
      superior es de 70 kPa, el caudal disminuye un 10%.

      **c)** Sabiendo que el $NPSH_{req}$ de la turbo-bomba sigue la
      siguiente expresión: $NPSH_{req} = 2{,}2 + 382\cdot Q^{2}$
      ($NPSH_{req}$ en mca, $Q$ en m³/s), calcular a qué cota se debería
      colocar la bomba para evitar problemas de cavitación.

      **d)** Tomando la cota de la bomba calculada en el apartado anterior,
      lecturas (kg/cm²) de los manómetros situados antes y después de la
      turbo-bomba.

      **e)** Calcular la pérdida de carga que habrá de generar la válvula
      $V_2$ de regulación y su factor de paso en ese caso, para bombear un
      caudal de 52 l/s.

      **f)** Diferencia de presiones (kg/cm²) entre los manómetros al cerrar
      la válvula $V_2$ de regulación.

      **DATOS:** $P_{atm} = 1$ atm, $P_v/\gamma$ (abs) $= 0{,}2$ mca.

      **Notas nuestras.** La imagen del cuadernillo no se reproduce, y dice
      esto. La tubería 1 sale del depósito A por un lateral, cerca del fondo,
      y sube hasta la bomba P: es la aspiración. De la bomba salen dos ramas.
      La 3, con la válvula $V_3$, sube hasta la boquilla B, que lanza el
      chorro hacia arriba; la 2, con la válvula $V_2$, entra en el depósito C
      por un lateral, por debajo de su lámina libre. Con $V_3$ cerrada todo
      el caudal va por la 2 hasta C, que es el depósito superior del
      apartado b). *El impreso escribe el 2,2 del $NPSH_{req}$ con punto
      decimal, «2.2»; aquí va con coma, como el resto.*
    notas:
      - >-
        **NOTA**: Todas las conducciones son de fundición asfaltada.
    pide: La curva de la instalación dibujada, la de la bomba, la cota que evita la cavitación, las lecturas de los manómetros, la válvula para 52 l/s y la diferencia de presiones con V2 cerrada.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con la válvula $V_3$ cerrada, ¿entre qué dos puntos se plantea el
          balance que da la curva de la instalación?
        opciones:
          - texto: >-
              Entre la lámina de A y la de C: la boquilla B no recibe caudal,
              y la instalación acaba en un depósito
            correcta: true
            mensaje: |
              Eso es. Con $V_3$ cerrada la rama 3 no lleva agua, así que la
              boquilla no cuenta: ni su cota ni la altura cinética de un
              chorro. De lámina a lámina, las dos a la presión atmosférica, el
              término independiente es el desnivel, $14{,}5 - 2{,}5 = 12$ m, y
              la curva no lleva ningún $V^{2}/2g$ de salida.
          - texto: >-
              Entre A y la boquilla B, porque es la salida que el enunciado
              nombra primero
            mensaje: |
              Las dos salidas están a la misma cota, 14,5 m, pero por B no
              sale nada: $V_3$ está cerrada. Si terminaras en B meterías en la
              curva la altura cinética de un chorro que no existe.
          - texto: >-
              Entre la brida de aspiración y la de impulsión de la bomba
            mensaje: |
              Eso es la altura manométrica de la bomba, lo que miden los
              manómetros del apartado d). La curva de la instalación va de un
              extremo a otro de la instalación: entre las bridas te dejas el
              desnivel y las pérdidas de las dos tuberías.

      - tipo: calcular
        titulo: El término independiente
        pregunta: |
          ¿Cuánto vale el término independiente de la curva, lo que la bomba
          tiene que dar con caudal nulo?
        respuesta:
          tipo: magnitud
          valor: '12 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '14.5 m'
            mensaje: |
              Has tomado la cota de llegada como si fuera el desnivel. El agua
              sale de A, que está a 2,5 m: lo que la bomba tiene que subir es
              la diferencia.
          - valor: '17 m'
            mensaje: |
              Has sumado la cota de A en vez de restarla. El depósito de
              aspiración está por encima de la referencia, y eso ayuda: son
              2,5 m que la bomba no tiene que dar.
        pista: |
          Las dos láminas están a la presión atmosférica: queda el desnivel.
        desarrollo: |
          $$
          H_{mi0} = \Delta z + \frac{\Delta P}{\gamma} = (14{,}5 - 2{,}5) + 0
          = 12\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente de las pérdidas continuas
        pregunta: |
          Con Hazen-Williams, $h_f = J_1\,L\,Q^{1{,}852}$ con $Q$ en l/s. ¿Cuánto
          vale el coeficiente de $Q^{1{,}852}$ de la curva, sumando aspiración
          e impulsión?
        respuesta:
          tipo: numero
          valor: '0.01025'
          tolerancia: 0.0002
          formato: un número, para Q en l/s (se admite 1.025e-2)
        distractores:
          - valor: '0.009606'
            mensaje: |
              Has puesto $C_{HW} = 130$ en las dos tuberías. La fundición
              asfaltada tiene $\varepsilon = 0{,}012$ cm (cuadro 20), y en la
              aspiración de 100 mm eso es $\varepsilon/D = 1{,}2\cdot 10^{-3}$,
              que ya pasa de $10^{-3}$: cae en la banda de $C_{HW} = 120$. La
              de 150 mm, con $8\cdot 10^{-4}$, sí es de 130.
          - valor: '0.01114'
            mensaje: |
              Has tomado la rugosidad de la fundición sin asfaltar, 0,026 cm.
              La nota del enunciado dice fundición **asfaltada**, que en el
              cuadro 20 es 0,012 cm; con 0,026 las dos tuberías caen en
              $C_{HW} = 120$.
          - valor: '0.005583'
            mensaje: |
              Te has dejado la aspiración. Solo tiene 15 m, pero con 100 mm
              pierde casi tanto como los 150 m de la impulsión: $J_1$ va con
              $D^{-4{,}87}$.
        pista: |
          Rugosidad del cuadro 20, $\varepsilon/D$ de cada tubería, su banda
          de $C_{HW}$ en el cuadro 25 y
          $J_1 = 1{,}2117\cdot 10^{10}/\left(C_{HW}^{1{,}852}\,D^{4{,}87}\right)$,
          con $D$ en mm.
        desarrollo: |
          Fundición asfaltada, $\varepsilon = 0{,}012$ cm (cuadro 20). En la
          aspiración, $\varepsilon/D = 0{,}12/100 = 1{,}2\cdot 10^{-3}$, banda
          de $C_{HW} = 120$; en la impulsión, $0{,}12/150 = 8\cdot 10^{-4}$,
          banda de $C_{HW} = 130$ (cuadro 25).

          $$
          J_1(120;\ 100) = \frac{1{,}2117\cdot 10^{10}}{120^{1{,}852}\cdot 100^{4{,}87}}
          = 3{,}110\cdot 10^{-4}
          \qquad
          J_1(130;\ 150) = 3{,}722\cdot 10^{-5}
          $$
          $$
          15\cdot 3{,}110\cdot 10^{-4} + 150\cdot 3{,}722\cdot 10^{-5}
          = 4{,}665\cdot 10^{-3} + 5{,}583\cdot 10^{-3} = 1{,}025\cdot 10^{-2}
          $$

          Es el $1{,}02\cdot 10^{-2}$ impreso.

      - tipo: calcular
        titulo: El coeficiente de las pérdidas menores
        pregunta: |
          Las piezas vienen como factor de paso, así que van en el término de
          $Q^{2}$. ¿Cuánto vale su coeficiente, con $Q$ en l/s?
        respuesta:
          tipo: numero
          valor: '0.00181'
          tolerancia: 0.00004
          formato: un número, para Q en l/s (se admite 1.81e-3)
        distractores:
          - valor: '0.001279'
            mensaje: |
              Has multiplicado todas las $k$ por la velocidad de la impulsión.
              La salida y el codo de la aspiración van con la de la tubería de
              100 mm, que a igual caudal va 2,25 veces más deprisa: su
              $V^{2}/2g$ es cinco veces el de la impulsión.
          - valor: '0.002577'
            mensaje: |
              Has leído el 62,5 % como la penetración del obturador. El
              cuadro 24 tabula $X/D$, la parte cerrada: abierta al 62,5 % es
              $X/D = 0{,}375$, $k = 0{,}81$, y no 5,5.
          - valor: '0.002183'
            mensaje: |
              Has tomado la salida de ángulos vivos, $k = 0{,}5$. El enunciado
              dice ángulos **redondeados**, que en el cuadro 24 es
              $k = 0{,}05$: diez veces menos.
        pista: |
          $\sum k\,V^{2}/2g$ tramo a tramo, con $V^{2}/2g = Q^{2}/(2g\,A^{2})$
          y $Q$ pasado a l/s.
        desarrollo: |
          Del cuadro 24: salida de ángulos redondeados 0,05, codo comercial de
          90º de radio medio 0,75, compuerta con $X/D = 0{,}375$ 0,81 y
          esférica a 30º 5,47. La aspiración suma $0{,}05 + 0{,}75 = 0{,}80$
          y la impulsión, $0{,}75 + 0{,}81 + 5{,}47 = 7{,}03$.

          $$
          \frac{1}{2g\,A_{100}^{2}} = 8{,}271\cdot 10^{-4}
          \qquad
          \frac{1}{2g\,A_{150}^{2}} = 1{,}634\cdot 10^{-4}
          \quad \text{m}/(\text{l/s})^{2}
          $$
          $$
          0{,}80\cdot 8{,}271\cdot 10^{-4} + 7{,}03\cdot 1{,}634\cdot 10^{-4}
          = 1{,}810\cdot 10^{-3}
          $$

          La entrada al depósito C ($k = 1$ en el cuadro 24) no está entre
          las piezas que da el enunciado, y la curva impresa tampoco la lleva.

      - tipo: calcular
        titulo: La altura de la instalación a 55 l/s
        pregunta: |
          El enunciado dice después que el punto de funcionamiento está en
          55 l/s. ¿Cuánta altura pide la instalación a ese caudal?
        respuesta:
          tipo: magnitud
          valor: '34.61 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '12 m'
            mensaje: |
              Has metido el caudal en m³/s, 0,055, en una curva cuyos
              coeficientes son para l/s: las pérdidas salen de milésimas y te
              queda el término independiente. Con 55 salen 22,6 m de
              pérdidas.
          - valor: '48.48 m'
            mensaje: |
              Has elevado el caudal al cuadrado también en el término de
              Hazen-Williams. Su exponente es 1,852: con $Q^{2}$ las pérdidas
              continuas salen 31 m en vez de 17.
        pista: |
          Evalúa la curva con $Q = 55$, en l/s.
        desarrollo: |
          $$
          H_{mi}(55) = 12 + 1{,}025\cdot 10^{-2}\cdot 55^{1{,}852}
          + 1{,}810\cdot 10^{-3}\cdot 55^{2}
          = 12 + 17{,}13 + 5{,}48 = 34{,}61\ \text{m}
          $$

          Es la altura que da la bomba en el punto de funcionamiento, y la
          que se usa en los apartados b) y d).

      - tipo: redactar
        que: deduccion
        consigna: |
          Ahora el apartado a) en papel, entero y como lo entregarías: la
          expresión analítica de la curva, desde el balance de energía entre
          las láminas de A y de C hasta dejarla con sus tres coeficientes y
          sus unidades. Aquí hay dos detalles que la rúbrica mira: con $V_3$
          cerrada la instalación acaba en un depósito, así que no hay altura
          cinética de chorro; y las piezas vienen todas como factor de paso,
          así que van en el término de $Q^{2}$, y las tuberías en el de
          $Q^{1{,}852}$.

          Cae en nueve de las dieciséis convocatorias del corpus —las quince
          del cuadernillo 2020-2025 y la ordinaria de 2026—, y las nueve piden
          las pérdidas por Hazen-Williams. De ella cuelgan todos los
          apartados que vienen detrás.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Si tu folio tiene los mínimos, el apartado a) está entero, y con él
          la herramienta de b) a f). Si te falta el primero —de dónde a
          dónde—, revisa el resultado: terminar en la boquilla B en vez de en
          C da otra curva.

      - tipo: dibujar
        consigna: |
          La curva del apartado a) en el papel milimetrado, con la escala que
          impone el enunciado: DIN A4 vertical, 1 cm por cada 5 l/s en el eje
          de caudales y 1 cm por cada 5 mca en el de alturas. Marca el
          término independiente y el punto de 55 l/s.
        comprueba:
          - punto: >-
              La hoja en vertical y los dos ejes a la escala impuesta: 5 l/s y
              5 mca por centímetro.
            porque: >-
              Es lo que pide el enunciado, y con esa escala todo cabe: de 0 a
              80 l/s son 16 cm de los 21 de ancho, y de 0 a 60 mca, 12 cm de
              los 29,7 de alto. Con otra escala el dibujo no se compara con el
              de quien corrige, y el corte con la bomba se lee mal.
          - punto: >-
              La curva arranca en 12 m, a 2,4 cm del origen sobre el eje de
              alturas, y no en el cero.
            porque: >-
              Son los 12 m de desnivel entre las láminas de A y C, lo que hace
              falta con caudal nulo. Una curva que sale del origen es la de una
              instalación sin desnivel ni diferencia de presión entre sus
              extremos, como un circuito cerrado, y esta no lo es.
          - punto: >-
              Pasa por 34,6 m a 55 l/s y por unos 58 m a 80 l/s, curvándose
              hacia arriba.
            porque: >-
              A 55 l/s son 17,1 m de rozamiento y 5,5 de piezas sobre los 12
              de partida; a 80, 34,3 y 11,6. Si la tuya va recta entre dos o
              tres puntos, necesitas más: la curva no es una recta ni una
              parábola, y entre puntos tan separados se nota.
          - punto: >-
              El punto de 55 l/s marcado, 11 cm a la derecha y 6,9 cm arriba.
            porque: >-
              Es el punto de funcionamiento que el enunciado da después del
              apartado a), y sobre él se construye la curva de la bomba en b).
              Marcado aquí, el dibujo sirve para comprobar b) de un vistazo.
        figura: |
          <svg viewBox="0 0 348 276" role="img" width="348" height="276" aria-labelledby="flu1920-2par-4-t flu1920-2par-4-d">
