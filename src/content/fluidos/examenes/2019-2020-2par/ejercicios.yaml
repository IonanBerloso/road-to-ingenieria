      - tipo: calcular
        titulo: La altura del segundo punto
        pregunta: |
          Con el depósito C presurizado a 70 kPa el caudal baja un 10 %, a
          49,5 l/s. ¿Cuánta altura da la bomba en ese segundo punto?
        respuesta:
          tipo: magnitud
          valor: '37.67 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '30.53 m'
            mensaje: |
              Esa es la curva de antes evaluada en 49,5 l/s. Al presurizar C
              la curva de la instalación sube entera 70 kPa, que son 7,14 m de
              agua, y el segundo punto está sobre esa curva nueva.
          - valor: '41.75 m'
            mensaje: |
              Has evaluado la curva en 55 l/s y le has sumado la presión. El
              punto nuevo está al caudal nuevo, 49,5 l/s: sumar la presión al
              caudal de antes da un punto que la bomba no pisa.
        pista: |
          $H_2 = H_{mi}(49{,}5) + \Delta P/\gamma$, con la presión en columna
          de agua.
        desarrollo: |
          $$
          \frac{\Delta P}{\gamma} = \frac{70\,000}{9800} = 7{,}143\ \text{m}
          $$
          $$
          H_2 = 12 + 7{,}143 + 1{,}025\cdot 10^{-2}\cdot 49{,}5^{1{,}852}
          + 1{,}810\cdot 10^{-3}\cdot 49{,}5^{2}
          = 12 + 7{,}143 + 14{,}09 + 4{,}44 = 37{,}67\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente de la bomba
        pregunta: |
          Los dos puntos, (55 l/s; 34,61 m) y (49,5 l/s; 37,67 m), están
          sobre la misma curva de la bomba, $H = A - B\,Q^{2}$. ¿Cuánto vale
          $B$, con $Q$ en m³/s como en la curva impresa?
        respuesta:
          tipo: numero
          valor: '5333.5'
          tolerancia: 100
          formato: un número, para Q en m³/s
        distractores:
          - valor: '12428'
            mensaje: |
              Has puesto el segundo punto sobre la curva evaluada en 55 l/s.
              La presurización mueve el punto al caudal nuevo: con el punto
              mal puesto sale otra bomba, con $A = 72{,}2$ m.
          - valor: '6515'
            mensaje: |
              Has tomado el caudal nuevo como 55/1,1 = 50 l/s. «Disminuye un
              10 %» es sobre el caudal de partida: $0{,}9\cdot 55 = 49{,}5$
              l/s.
          - valor: '0.005334'
            mensaje: |
              Ese es el coeficiente con $Q$ en l/s. La pregunta, como la curva
              impresa, lo pide con $Q$ en m³/s: un millón de veces más.
        pista: |
          $B = (H_2 - H_1)/(Q_1^{2} - Q_2^{2})$, con los caudales en m³/s, y
          después $A = H_1 + B\,Q_1^{2}$.
        desarrollo: |
          $$
          B = \frac{37{,}673 - 34{,}608}{0{,}055^{2} - 0{,}0495^{2}}
          = \frac{3{,}065}{5{,}7475\cdot 10^{-4}} = 5333{,}5
          $$
          $$
          A = 34{,}608 + 5333{,}5\cdot 0{,}055^{2} = 50{,}74\ \text{m}
          $$

          La bomba es $H_{mtb} = 50{,}74 - 5333{,}53\,Q^{2}$, con $Q$ en
          m³/s: la curva impresa, a la centésima. Sale así con los
          coeficientes de la instalación sin redondear; con los impresos,
          $1{,}02\cdot 10^{-2}$ y $1{,}81\cdot 10^{-3}$, $B$ sale 5359, un
          0,5 % más, porque la diferencia de dos alturas tan parecidas
          amplifica el redondeo.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: la curva de la bomba sacada de dos puntos
          de funcionamiento. El primero, el de 55 l/s sobre la curva del
          apartado a); el segundo, el de 49,5 l/s sobre la curva de la
          instalación con C presurizado, que es la misma subida 7,14 m. Dos
          ecuaciones, dos incógnitas, y las unidades de $Q$ dichas junto a cada
          curva: la impresa de la instalación va en l/s y la de la bomba, en
          m³/s. Si no las pasas a la misma, dilo en las dos; en l/s, la bomba
          es $50{,}74 - 5{,}33\cdot 10^{-3}\,Q^{2}$.
        rubrica: curva-de-la-bomba-por-dos-puntos
        veredicto: |
          Si tu folio tiene los mínimos, el apartado b) está entero. Si te
          sale una $B$ de más del doble, mira dónde has puesto el segundo
          punto: al caudal nuevo, no al de antes.

      - tipo: calcular
        titulo: La pérdida en la aspiración
        pregunta: |
          Para el NPSH disponible hace falta lo que se pierde antes de la
          bomba. ¿Cuánto se pierde en la aspiración a 55 l/s?
        respuesta:
          tipo: magnitud
          valor: '9.80 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '7.80 m'
            mensaje: |
              Te has dejado las pérdidas menores de la aspiración: la salida
              del depósito y el codo, que con el agua a 7 m/s suman 2 m.
          - valor: '2.00 m'
            mensaje: |
              Esas son solo las piezas. Los 15 m de tubería de 100 mm, a
              7 m/s, pierden 7,8 m más.
        pista: |
          El término de Hazen-Williams de la aspiración,
          $15\,J_1(120;\ 100)\,Q^{1{,}852}$, más $0{,}80\,V^{2}/2g$ con la
          velocidad de la tubería de 100 mm.
        desarrollo: |
          $$
          h_{f,asp} = 4{,}665\cdot 10^{-3}\cdot 55^{1{,}852}
          + 0{,}80\cdot 8{,}271\cdot 10^{-4}\cdot 55^{2}
          = 7{,}80 + 2{,}00 = 9{,}80\ \text{m}
          $$

          Es mucho para 15 m de tubería: a 55 l/s, la de 100 mm lleva el agua
          a 7 m/s.

      - tipo: calcular
        titulo: La cota de la bomba
        pregunta: |
          ¿A qué cota hay que colocar la bomba, como mucho, para evitar la
          cavitación? Una cota por debajo de la referencia va con signo menos.
        respuesta:
          tipo: magnitud
          valor: '-1.52 m'
          tolerancia: 0.02
          formato: una cota, con su signo y su unidad
        distractores:
          - valor: '-0.52 m'
            mensaje: |
              Has pedido solo $NPSH_d > NPSH_{req}$, que es la condición de una
              instalación que ya funciona. Aquí se decide dónde se coloca la
              bomba, que es diseño, y la diapositiva 22 del tema 25 calcula esa
              cota máxima con el margen de la 21: $NPSH_d = 1{,}3\,NPSH_{req}$.
              Con él sale la cota impresa.
          - valor: '8.28 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración. Son 9,8 m, más que
              todo lo demás junto, y sin ellos la bomba podría ponerse casi
              6 m por encima de la lámina de A.
          - valor: '-4.02 m'
            mensaje: |
              Esa es la posición de la bomba respecto de la lámina de A, 4,02
              m por debajo. La pregunta pide la cota, y la lámina está a
              2,5 m: $2{,}5 - 4{,}02 = -1{,}52$ m.
          - valor: '-1.02 m'
            mensaje: |
              Esa cota sale con el otro criterio de diseño de los apuntes, un
              NPSH de seguridad de 0,5 mcl sobre el requerido. Es un criterio
              válido, pero no el del resultado impreso: la diapositiva 22 del
              tema 25 calcula la cota máxima con
              $NPSH_d = 1{,}3\,NPSH_{req}$, y con él sale $-1{,}52$ m.
        pista: |
          $NPSH_d = P_{atm}/\gamma - P_v/\gamma + z_A - z_b - h_{f,asp}$, y al
          elegir dónde va la bomba tiene que ser al menos $1{,}3\,NPSH_{req}$.
        desarrollo: |
          $$
          NPSH_{req}(0{,}055) = 2{,}2 + 382\cdot 0{,}055^{2} = 3{,}356\ \text{m}
          \qquad
          1{,}3\cdot 3{,}356 = 4{,}362\ \text{m}
          $$
          $$
          \frac{P_{atm}}{\gamma} = \frac{101\,325}{9800} = 10{,}339\ \text{m}
          $$
          $$
          10{,}339 - 0{,}2 + 2{,}5 - z_b - 9{,}80 \ge 4{,}362
          \;\Longrightarrow\;
          z_b \le -1{,}52\ \text{m}
          $$

          Con el otro criterio de diseño de los apuntes, un NPSH de seguridad
          de 0,5 a 0,9 mcl, saldría entre $-1{,}02$ y $-1{,}42$ m; el impreso
          usa el 1,3.

          La bomba va 4 m por debajo de la lámina de A: en carga, con la
          aspiración inundada.

      - tipo: calcular
        titulo: La lectura del manómetro de aspiración
        pregunta: |
          Con la bomba a $-1{,}52$ m, ¿qué marca el manómetro de antes de la
          bomba, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '-0.83 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su signo y su unidad
        distractores:
          - valor: '-0.578 kg/cm2'
            mensaje: |
              Te has dejado la altura cinética en la brida de aspiración. El
              agua llega a la bomba a 7 m/s, y esos 2,5 m de $V^{2}/2g$ salen
              de la presión: el manómetro marca menos.
          - valor: '0.206 kg/cm2'
            mensaje: |
              Esa es la presión absoluta, 2,06 mca. Un manómetro marca la
              diferencia con la atmosférica, y aquí es negativa: la
              aspiración está en depresión, y por eso el resultado impreso la
              llama $P_{vac}$.
        pista: |
          Bernoulli de la lámina de A a la brida de aspiración, en
          manométricas:
          $2{,}5 = z_b + p_e/\gamma + V_e^{2}/2g + h_{f,asp}$. Y 1 kg/cm² son
          10 mca.
        desarrollo: |
          $$
          \frac{p_e}{\gamma} = 2{,}5 + 1{,}52 - 2{,}50 - 9{,}80
          = -8{,}28\ \text{mca} = -0{,}83\ \text{kg/cm}^{2}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro de impulsión
        pregunta: |
          ¿Y el manómetro de después de la bomba?
        respuesta:
          tipo: magnitud
          valor: '2.83 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2.63 kg/cm2'
            mensaje: |
              Has sumado la altura de la bomba a la lectura de la aspiración
              sin las alturas cinéticas. La bomba da 34,61 m de **energía**; al
              pasar de 100 a 150 mm la velocidad baja de 7,0 a 3,1 m/s, y esos
              2 m de altura cinética se convierten en presión.
          - valor: '3.46 kg/cm2'
            mensaje: |
              Esa es solo la altura de la bomba, 34,61 m. El manómetro de
              impulsión parte de lo que ya marca el de aspiración, que es
              negativo.
        pista: |
          Entre las dos bridas, a la misma cota:
          $p_s/\gamma = p_e/\gamma + (V_e^{2} - V_s^{2})/2g + H$.
        desarrollo: |
          $$
          \frac{p_s}{\gamma} = -8{,}28 + 2{,}50 - 0{,}49 + 34{,}61
          = 28{,}34\ \text{mca} = 2{,}83\ \text{kg/cm}^{2}
          $$

          Por el otro lado sale lo mismo: de la brida de impulsión a la lámina
          de C, $14{,}5 + 1{,}52 - 0{,}49 + 12{,}81 = 28{,}34$ mca, con los
          12,81 m que se pierden en la impulsión.

      - tipo: calcular
        titulo: La pérdida en la válvula V2
        pregunta: |
          Para bombear 52 l/s se cierra la válvula $V_2$. ¿Cuánta pérdida
          tiene que generar?
        respuesta:
          tipo: magnitud
          valor: '3.98 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '24.32 m'
            mensaje: |
              Has restado a la bomba solo el término independiente de la
              instalación. A 52 l/s las tuberías y las piezas se siguen
              llevando 20,3 m, y la válvula solo tiene que aportar lo que
              sobra.
          - valor: '1.71 m'
            mensaje: |
              Has restado las alturas de la bomba a 52 y a 55 l/s. La pérdida
              de la válvula es la distancia, **al caudal nuevo**, entre la
              curva de la bomba y la de la instalación con la válvula abierta.
        pista: |
          La válvula tiene que cubrir la diferencia, a 52 l/s, entre lo que da
          la bomba y lo que pide la instalación abierta.
        desarrollo: |
          $$
          H_{mtb}(0{,}052) = 50{,}74 - 5333{,}5\cdot 0{,}052^{2} = 36{,}32\ \text{m}
          \qquad
          H_{mi}(52) = 32{,}34\ \text{m}
          $$
          $$
          h_{f,valv} = 36{,}32 - 32{,}34 = 3{,}98\ \text{m}
          $$

      - tipo: calcular
        titulo: El factor de paso de la válvula V2
        pregunta: |
          ¿Qué factor de paso da esa pérdida? (solo el número)
        respuesta:
          tipo: numero
          valor: '9.02'
          tolerancia: 0.18
          formato: un número sin unidades
        distractores:
          - valor: '1.78'
            mensaje: |
              Has usado la velocidad de la aspiración. $V_2$ está en la
              impulsión, en la tubería de 150 mm: a 52 l/s el agua va a
              2,94 m/s.
          - valor: '8.06'
            mensaje: |
              Has dividido entre la altura cinética a 55 l/s. La válvula se
              regula para 52 l/s, y es a ese caudal donde tiene que perder los
              3,98 m.
        pista: |
          $k = h_{f,valv}\,\big/\,(V^{2}/2g)$, con la velocidad a 52 l/s en la
          tubería donde está la válvula.
        desarrollo: |
          $$
          V = \frac{0{,}052}{\pi\,0{,}15^{2}/4} = 2{,}943\ \text{m/s}
          \qquad
          \frac{V^{2}}{2g} = 0{,}4418\ \text{m}
          $$
          $$
          k_{valv} = \frac{3{,}98}{0{,}4418} = 9{,}02
          $$

      - tipo: calcular
        titulo: La diferencia de presiones con V2 cerrada
        pregunta: |
          Si se cierra del todo $V_2$, ¿qué diferencia de presiones marcan los
          dos manómetros, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '5.07 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.46 kg/cm2'
            mensaje: |
              Esa es la altura de la bomba en el punto de funcionamiento. Con
              la válvula cerrada no pasa caudal y la bomba trabaja a caudal
              nulo, donde da más: toda su $A$.
          - valor: '50.74 kg/cm2'
            mensaje: |
              Has dejado los 50,74 mca como si fueran kg/cm². Un kg/cm² son
              10 mca: la diferencia es 5,07.
        pista: |
          Con $V_2$ y $V_3$ cerradas, $Q = 0$.
        desarrollo: |
          Sin caudal no hay pérdidas ni alturas cinéticas, y entre las dos
          bridas la bomba da su altura a caudal nulo:

          $$
          \frac{\Delta P}{\gamma} = A = 50{,}74\ \text{mca} = 5{,}07\ \text{kg/cm}^{2}
          $$

          Es el apartado que comprueba la $A$ del b) sin decirlo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $V_3$ cerrada la curva va de la lámina de A a la de C: 12 m
              de desnivel, las tuberías con $Q^{1{,}852}$ y las piezas con
              $Q^{2}$.
          - texto: >-
              La bomba sale de dos puntos de su curva: (55; 34,61) y
              (49,5; 37,67), el segundo con C presurizado. Queda
              $H = 50{,}74 - 5333{,}5\,Q^{2}$, con $Q$ en m³/s.
          - texto: >-
              Para elegir dónde va la bomba se pide
              $NPSH_d \ge 1{,}3\,NPSH_{req}$: a $-1{,}52$ m, en carga.
          - texto: >-
              Para bajar a 52 l/s la válvula tiene que perder 3,98 m,
              $k = 9{,}02$; y cerrada del todo, la bomba da su altura a caudal
              nulo, 5,07 kg/cm².
          - texto: >-
              Como la bomba está por debajo de la lámina de A, el manómetro
              de aspiración marca una presión positiva.
            trampa: true
            mensaje: |
              Estar en carga no basta. Los 4 m de agua que hay sobre la bomba
              no cubren los 9,8 m que se pierden en la aspiración ni los 2,5
              de altura cinética con que llega el agua: el manómetro marca
              $-0{,}83$ kg/cm². Lo que la cota garantiza es que la presión
              absoluta no baje de la de vapor, con margen; no que la
              manométrica sea positiva.
    resolucion: |
      **La instalación.** Con $V_3$ cerrada, la boquilla B no recibe agua y
      todo el caudal va del depósito A al C por la aspiración (15 m, 100 mm)
      y la impulsión (150 m, 150 mm). Todo es fundición asfaltada,
      $\varepsilon = 0{,}012$ cm (cuadro 20): $\varepsilon/D = 1{,}2\cdot
      10^{-3}$ en la aspiración y $8\cdot 10^{-4}$ en la impulsión, que en el
      cuadro 25 son $C_{HW} = 120$ y $130$. Las piezas, del cuadro 24: salida
      redondeada 0,05 y codo 0,75 en la aspiración; codo 0,75, compuerta con
      $X/D = 0{,}375$ 0,81 y esférica a 30º 5,47 en la impulsión.

      **a) La curva.** El balance entre las láminas de A y C, con la bomba
      como la energía que falta:

      $$
      H_{mi} = (14{,}5 - 2{,}5) + \sum J_1\,L\,Q^{1{,}852}
      + \sum k\,\frac{Q^{2}}{2g\,A^{2}}
      $$
      $$
      H_{mi} = 12 + 1{,}025\cdot 10^{-2}\,Q^{1{,}852} + 1{,}810\cdot 10^{-3}\,Q^{2}
      \qquad (H \text{ en m},\ Q \text{ en l/s})
      $$

      Es la curva impresa. No es una parábola: las tuberías van con
      $Q^{1{,}852}$ y solo las piezas con $Q^{2}$. No lleva altura cinética de
      salida, porque acaba en un depósito, ni la entrada en C, que el
      enunciado no da entre las piezas. En el papel milimetrado, a 5 l/s y
      5 mca por centímetro, sale de 12 m y pasa por 34,61 m a 55 l/s.

      **b) La bomba.** El punto de funcionamiento está en 55 l/s, así que
      $H_1 = H_{mi}(55) = 34{,}61$ m. Al presurizar C a 70 kPa, que son
      7,14 m de agua, la curva de la instalación sube entera y el caudal baja
      a 49,5 l/s: $H_2 = H_{mi}(49{,}5) + 7{,}14 = 37{,}67$ m. Los dos puntos
      están sobre la misma curva de la bomba:

      $$
      B = \frac{37{,}673 - 34{,}608}{0{,}055^{2} - 0{,}0495^{2}} = 5333{,}5
      \qquad
      A = 34{,}608 + 5333{,}5\cdot 0{,}055^{2} = 50{,}74\ \text{m}
      $$
      $$
      H_{mtb} = 50{,}74 - 5333{,}53\,Q^{2}
      \qquad (Q \text{ en m}^{3}/\text{s})
      $$

      Ojo con las unidades, que el resultado impreso no da: la curva de la
      instalación solo funciona con $Q$ en l/s y la de la bomba, en m³/s.
      Con $Q$ en l/s, la bomba es $50{,}74 - 5{,}33\cdot 10^{-3}\,Q^{2}$.

      **c) La cota de la bomba.** A 55 l/s la aspiración pierde
      $7{,}80 + 2{,}00 = 9{,}80$ m y la bomba pide
      $NPSH_{req} = 2{,}2 + 382\cdot 0{,}055^{2} = 3{,}356$ m. Como se está
      decidiendo dónde colocarla, se diseña con el margen de la diapositiva
      21 del tema 25, $NPSH_d \ge 1{,}3\,NPSH_{req} = 4{,}362$ m:

      $$
      10{,}339 - 0{,}2 + 2{,}5 - z_b - 9{,}80 \ge 4{,}362
      \;\Longrightarrow\;
      z_b \le -1{,}52\ \text{m}
      $$

      Con la condición de una instalación que ya funciona,
      $NPSH_d > NPSH_{req}$, bastaría con $-0{,}52$ m, y con el otro criterio
      de diseño de los apuntes (0,5 a 0,9 mcl de seguridad), entre $-1{,}02$ y
      $-1{,}42$; el impreso da $-1{,}52$, el del 1,3 de la diapositiva 22.

      **d) Los manómetros.** Con la bomba a $-1{,}52$ m, de la lámina de A a
      la brida de aspiración:

      $$
      \frac{p_e}{\gamma} = 2{,}5 + 1{,}52 - 2{,}50 - 9{,}80 = -8{,}28\ \text{mca}
      = -0{,}83\ \text{kg/cm}^{2}
      $$

      Y entre las bridas, con los 34,61 m de la bomba y las dos alturas
      cinéticas:

      $$
      \frac{p_s}{\gamma} = -8{,}28 + 2{,}50 - 0{,}49 + 34{,}61 = 28{,}34\ \text{mca}
      = 2{,}83\ \text{kg/cm}^{2}
      $$

      **e) La válvula para 52 l/s.** La bomba da $H_{mtb}(0{,}052) = 36{,}32$
      m y la instalación abierta pide $H_{mi}(52) = 32{,}34$ m: la válvula
      tiene que perder la diferencia, $3{,}98$ m. Con la velocidad de la
      impulsión a 52 l/s, 2,943 m/s,

      $$
      k_{valv} = \frac{3{,}98}{2{,}943^{2}/19{,}6} = 9{,}02
      $$

      **f) Con $V_2$ cerrada.** No hay caudal, y la bomba da su altura a
      caudal nulo: $\Delta P/\gamma = A = 50{,}74$ mca, $5{,}07$ kg/cm².

      **Lo que enseña.** Que este ejercicio estuviera fuera por «falta de
      datos» era una lectura del material, no del examen: las cuatro $k$
      están en el cuadro 24 que se reparte con él, y con ellas la curva
      impresa sale a la milésima. Y que un $B$ sacado de dos alturas muy
      parecidas pide no redondear antes de tiempo: con la curva ya redondeada
      a tres cifras, el coeficiente se mueve medio por ciento.

  # ── 5 (30 %) · Una red: dos depósitos, una boquilla y dos tuberías en
  #    paralelo. Rescatado el 30 de septiembre de 2026: la tabla de las
  #    tuberías es una imagen dentro de la figura (pág. 13 del PDF), y se
  #    lee. Con Colebrook en las semirrugosas, Blasius en el PVC y la altura
  #    cinética con que la tubería 2 entra en B salen los cuatro primeros
  #    resultados impresos y L4 a un 1,2 %.
  - id: exflu1920-2par-5-la-red-de-cinco-tuberias
    titulo: La red de cinco tuberías, con dos en paralelo y una longitud por averiguar
    fuente: >-
      Ejercicio 5 · Segundo parcial, 4 de junio de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El depósito abierto A situado a una cota de 140 m contiene un fluido
      con una densidad relativa de $s = 0{,}943$ y una viscosidad cinemática
      de 0,05 St. El depósito abastece la boquilla C situada a una cota de
      80 m. El depósito B está situado a una cota de 110 m y a una presión de
      1,5 bar. Los datos de las tuberías se resumen en la tabla.

      El diámetro de la boquilla es de 67,5 mm y su factor de paso es de 2.
      Las únicas pérdidas menores que se tendrán en cuenta serán las de la
      boquilla y las de la válvula parcialmente abierta $V_2$ (su factor de
      paso es 2). Las demás válvulas están completamente abiertas y su
      pérdida de carga es despreciable. El caudal $Q_1$ es de 50 l/s. Se
      pide:

      **a)** Calcular el caudal de la tubería 2 (l/s), determinando también
      el sentido del flujo.

      **b)** Calcular la velocidad (m/s) de la tubería 5.

      **c)** Calcular las velocidades (m/s) de las tuberías 3 y 4.

      **d)** Calcular la longitud de la tubería 4 (m).

      **Notas nuestras.** La tabla y la figura del cuadernillo son dos
      imágenes (pág. 7 del cuadernillo, 13 del PDF) y no se reproducen;
      dicen esto. La tabla:

      | | Material | L (m) | D (mm) |
      |---|---|---|---|
      | Tubería 1 | Fundición | 250 | 200 |
      | Tubería 2 | Fundición | 300 | 110 |
      | Tubería 3 | Hierro galvanizado | 100 | 60 |
      | Tubería 4 | Hierro galvanizado | ? | 85 |
      | Tubería 5 | PVC | 80 | 110 |

      Y la figura: del depósito A, con su lámina en $z_A$, sale la tubería 1,
      con la válvula $V_1$, hasta el nudo $N_1$. De $N_1$ salen la tubería 2,
      que entra en el depósito B por un lateral a través de la válvula $V_2$
      —B es cerrado, con un manómetro en la tapa y la lámina en $z_B$—, y las
      tuberías 3 y 4, en paralelo, cada una con su válvula, $V_3$ y $V_4$,
      que se juntan en el nudo $N_2$. De $N_2$ baja la tubería 5 hasta la
      boquilla C, que descarga a la atmósfera a la cota $z_C$.
    notas:
      - >-
        **IMPRESCINDIBLE: indicar el tipo de flujo, el comportamiento
        hidráulico y la expresión empleada a la hora de calcular el
        coeficiente de frotamiento.**
      - >-
        **Nota**: en caso de ser necesario, limitar a 3 el número de
        iteraciones a realizar o a un cambio menor al 5% en la variable a
        calcular.
    pide: El caudal y el sentido de la tubería 2, la velocidad de la 5, las de la 3 y la 4, y la longitud de la 4.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular $Q_2$ hay que saber hacia dónde va. ¿Con qué se
          decide?
        opciones:
          - texto: >-
              Comparando la energía del nudo $N_1$ con la altura piezométrica
              de B, $z_B + p_B/\gamma$, con la presión en columna del fluido de
              la red
            correcta: true
            mensaje: |
              Eso es. Con $Q_1$ como dato, la pérdida de la tubería 1 da la
              energía en $N_1$, 136,10 m; B está a $110 + 16{,}23 = 126{,}23$
              m. El fluido va de $N_1$ hacia B, y los 9,87 m de diferencia son
              lo que la tubería 2 puede gastar.
          - texto: >-
              Comparando las cotas: A está a 140 m y B a 110, así que el
              fluido baja hacia B
            mensaje: |
              Las cotas solas no deciden: B está presurizado, y 1,5 bar son
              16,2 m de columna de este fluido. Aquí el resultado es el mismo,
              pero con algo más de presión en B el fluido iría al revés, de B
              hacia $N_1$.
          - texto: >-
              Con la continuidad en $N_1$: como $Q_1 = 50$ l/s entra en el
              nudo, tiene que salir hacia las dos ramas
            mensaje: |
              La continuidad dice que lo que entra sale, no hacia dónde. Si B
              estuviera por encima de $N_1$, la tubería 2 aportaría caudal al
              nudo y a la rama de C le llegarían más de 50 l/s.

      - tipo: calcular
        titulo: La pérdida de carga en la tubería 1
        pregunta: |
          Con $Q_1 = 50$ l/s, ¿cuánto se pierde en la tubería 1?
        respuesta:
          tipo: magnitud
          valor: '3.90 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '3.21 m'
            mensaje: |
              Has leído la rugosidad del cuadro 20 en milímetros: son
              0,026 **cm**, 0,26 mm. Con $\varepsilon/D$ diez veces menor la
              tubería se comporta como lisa y $f$ baja a 0,0199.
          - valor: '3.38 m'
            mensaje: |
              Has tomado 0,05 St como 0,05 centistokes. Un stokes son
              $10^{-4}$ m²/s, así que $\nu = 5\cdot 10^{-6}$ m²/s; con cien
              veces menos el Reynolds sale de seis millones y la tubería,
              rugosa.
        pista: |
          Reynolds con $\nu = 5\cdot 10^{-6}$ m²/s, $\varepsilon/D$ con el
          cuadro 20, y las fronteras $Re' = 23/(\varepsilon/D)$ y
          $Re'' = 560/(\varepsilon/D)$ para elegir la expresión de $f$.
        desarrollo: |
          $$
          V_1 = \frac{0{,}05}{\pi\,0{,}2^{2}/4} = 1{,}592\ \text{m/s}
          \qquad
          Re = \frac{1{,}592\cdot 0{,}2}{5\cdot 10^{-6}} = 63\,660
          $$

          Flujo **turbulento**. Fundición, $\varepsilon = 0{,}026$ cm:
          $\varepsilon/D = 1{,}3\cdot 10^{-3}$, con $Re' = 17\,690$ y
          $Re'' = 430\,800$. Está entre las dos, así que la tubería es
          **semirrugosa** y $f$ sale de **Colebrook**: $f = 0{,}02413$, en dos
          iteraciones desde 0,02.

          $$
          h_{f1} = 0{,}02413\cdot\frac{250}{0{,}2}\cdot\frac{1{,}592^{2}}{19{,}6}
          = 3{,}90\ \text{m}
          $$

          La energía en el nudo es $140 - 3{,}90 = 136{,}10$ m.

      - tipo: calcular
        titulo: El caudal de la tubería 2
        pregunta: |
          ¿Qué caudal lleva la tubería 2, en l/s?
        respuesta:
          tipo: magnitud
          valor: '14.75 l/s'
          tolerancia: 0.012
          formato: un caudal, con su unidad
        distractores:
          - valor: '15.46 l/s'
            mensaje: |
              Has pasado los 1,5 bar a columna de agua, 15,3 m. El fluido de
              la red tiene $s = 0{,}943$: son 16,23 m de columna **de este
              fluido**, y con B más alto le llega menos caudal.
          - valor: '17.58 l/s'
            mensaje: |
              Te has dejado la pérdida de la tubería 1 y has puesto en $N_1$
              los 140 m del depósito A. Con 50 l/s circulando, al nudo llegan
              3,90 m menos.
          - valor: '24.55 l/s'
            mensaje: |
              Te has olvidado de la presión de B. Sin sus 16,23 m de columna
              el nudo ve el depósito a 110 m, y la tubería 2 se lleva casi la
              mitad del caudal.
        pista: |
          De $N_1$ a la boca de la tubería 2 dentro de B, donde la presión es
          la del depósito y el fluido aún lleva su altura cinética:
          $H_{N1} = z_B + p_B/\gamma + V_2^{2}/2g + h_{f2} + 2\,V_2^{2}/2g$,
          con un $f$ que depende de $V_2$: hay que tantear. Cerrando en la
          lámina de B, sin ese $V_2^{2}/2g$, también vale.
        desarrollo: |
          $$
          \frac{p_B}{\gamma} = \frac{150\,000}{943\cdot 9{,}8} = 16{,}23\ \text{m}
          \qquad
          136{,}10 - 126{,}23 = 9{,}87\ \text{m}
          $$

          Esos 9,87 m se reparten entre el rozamiento de la tubería 2, la
          válvula $V_2$ y la altura cinética con que el fluido sale al
          depósito. Tanteando con Colebrook ($\varepsilon/D = 2{,}36\cdot
          10^{-3}$, semirrugosa):

          $$
          V_2 = 1{,}552\ \text{m/s}
          \quad
          Re = 34\,140
          \quad
          f = 0{,}02836
          \quad
          h_{f2} = 9{,}50\ \text{m}
          $$
          $$
          9{,}50 + 3\cdot 0{,}123 = 9{,}87\ \text{m}
          \qquad
          Q_2 = 14{,}75\ \text{l/s}
          $$

          de $N_1$ **hacia B**.

          La válvula solo se lleva $2\cdot 0{,}123 = 0{,}25$ m de los 9,87,
          pero el enunciado la manda contar: sin ella saldrían unos 14,95 l/s,
          un 1,3 % más, y $L_4$ se iría a 112,5 m.

      - tipo: calcular
        titulo: La velocidad en la tubería 5
        pregunta: |
          ¿A qué velocidad va el fluido por la tubería 5?
        respuesta:
          tipo: magnitud
          valor: '3.71 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '5.26 m/s'
            mensaje: |
              Has mandado todo $Q_1$ por la tubería 5. Parte se va a B: por la
              5 pasa $Q_1 - Q_2 = 35{,}25$ l/s.
          - valor: '6.81 m/s'
            mensaje: |
              Has sumado $Q_2$ en vez de restarlo, como si B alimentara el
              nudo. El fluido va de $N_1$ hacia B: la tubería 2 se lleva
              caudal, no lo aporta.
          - valor: '9.85 m/s'
            mensaje: |
              Esa es la velocidad del chorro en la boquilla, de 67,5 mm. La
              tubería 5 tiene 110 mm.
        pista: |
          Continuidad en $N_1$ y en $N_2$: todo lo que no va a B acaba en la
          boquilla.
        desarrollo: |
          $$
          Q_5 = Q_1 - Q_2 = 50 - 14{,}75 = 35{,}25\ \text{l/s}
          \qquad
          V_5 = \frac{0{,}03525}{\pi\,0{,}11^{2}/4} = 3{,}71\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La energía en el nudo N2
        pregunta: |
          Para el apartado c) hace falta la energía en el nudo $N_2$. ¿Cuánto
          vale?
        respuesta:
          tipo: magnitud
          valor: '104.40 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '94.50 m'
            mensaje: |
              Te has dejado la pérdida de la boquilla, $2\,V_C^{2}/2g = 9{,}90$
              m. Es una de las dos pérdidas menores que el enunciado manda
              contar.
          - valor: '99.45 m'
            mensaje: |
              Te has dejado la altura cinética del chorro. El fluido sale de
              la boquilla a 9,85 m/s, y esos 4,95 m son energía que se lleva
              consigo: el balance acaba en el chorro, no en una lámina quieta.
        pista: |
          De $N_2$ al chorro:
          $H_{N2} = z_C + V_C^{2}/2g + 2\,V_C^{2}/2g + h_{f5}$, con la
          velocidad de la boquilla en sus dos términos.
        desarrollo: |
          $$
          V_C = \frac{0{,}03525}{\pi\,0{,}0675^{2}/4} = 9{,}851\ \text{m/s}
          \qquad
          \frac{V_C^{2}}{2g} = 4{,}952\ \text{m}
          $$

          En la tubería 5, de PVC ($\varepsilon = 0{,}0007$ cm,
          $\varepsilon/D = 6{,}4\cdot 10^{-5}$), $Re = 81\,610$, por debajo de
          $Re' = 361\,400$: se comporta como **lisa**, y con $Re < 10^{5}$
          vale **Blasius**, $f = 0{,}316/Re^{0{,}25} = 0{,}01870$.

          $$
          h_{f5} = 0{,}01870\cdot\frac{80}{0{,}11}\cdot\frac{3{,}71^{2}}{19{,}6}
          = 9{,}55\ \text{m}
          $$
          $$
          H_{N2} = 80 + 3\cdot 4{,}952 + 9{,}55 = 104{,}40\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad en la tubería 3
        pregunta: |
          Las tuberías 3 y 4 unen los mismos dos nudos. ¿A qué velocidad va el
          fluido por la 3?
        respuesta:
          tipo: magnitud
          valor: '3.65 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.23 m/s'
            mensaje: |
              Has repartido $Q_5$ a partes iguales entre las dos. En paralelo
              lo que se reparte por igual es la **pérdida**, no el caudal:
              cada tubería lleva el que le deja pasar su resistencia.
          - valor: '4.92 m/s'
            mensaje: |
              Has tomado como pérdida de la 3 toda la caída desde $N_1$ hasta
              la cota de C. La 3 acaba en $N_2$: lo que queda de ahí a C se lo
              llevan la tubería 5, la boquilla y el chorro.
        pista: |
          En paralelo, $h_{f3} = h_{f4} = H_{N1} - H_{N2}$. La 3 es conocida
          entera: se tantea su velocidad.
        desarrollo: |
          $$
          h_{f3} = 136{,}10 - 104{,}40 = 31{,}70\ \text{m}
          $$

          Hierro galvanizado, $\varepsilon = 0{,}015$ cm,
          $\varepsilon/D = 2{,}5\cdot 10^{-3}$. Tanteando con Colebrook:

          $$
          V_3 = 3{,}65\ \text{m/s}
          \quad
          Re = 43\,860
          \quad
          f = 0{,}02791
          \quad
          0{,}02791\cdot\frac{100}{0{,}06}\cdot\frac{3{,}655^{2}}{19{,}6}
          = 31{,}70\ \text{m}
          $$

          Semirrugosa ($Re' = 9200 < Re < Re'' = 224\,000$): Colebrook era la
          buena. Lleva $Q_3 = 10{,}33$ l/s.

      - tipo: calcular
        titulo: La velocidad en la tubería 4
        pregunta: |
          ¿Y por la 4?
        respuesta:
          tipo: magnitud
          valor: '4.39 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.21 m/s'
            mensaje: |
              Has pasado todo $Q_5$ por la 4, sin restar lo que lleva la 3.
              Las dos se reparten los 35,25 l/s.
          - valor: '6.99 m/s'
            mensaje: |
              Has restado $Q_3$ de $Q_1$ en vez de $Q_5$. A las tuberías 3 y 4
              solo llega lo que no se ha ido a B.
        pista: |
          Continuidad en $N_2$: $Q_4 = Q_5 - Q_3$.
        desarrollo: |
          $$
          Q_4 = 35{,}25 - 10{,}33 = 24{,}92\ \text{l/s}
          \qquad
          V_4 = \frac{0{,}02492}{\pi\,0{,}085^{2}/4} = 4{,}39\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La longitud de la tubería 4
        pregunta: |
          ¿Qué longitud tiene la tubería 4, en metros?
        respuesta:
          tipo: magnitud
          valor: '109.5 m'
          tolerancia: 0.025
          formato: una longitud, con su unidad
        distractores:
          - valor: '98.1 m'
            mensaje: |
              Has usado el $f$ de la tubería 3. La 4 tiene otro diámetro y
              otra velocidad, así que otro Reynolds y otra rugosidad relativa:
              su $f$ es 0,0250, no 0,0279.
          - valor: '77.3 m'
            mensaje: |
              Has puesto el diámetro de la 3, 60 mm, en el $L/D$ de la 4. La 4
              tiene 85 mm.
        pista: |
          La pérdida de la 4 es la misma que la de la 3: despeja $L_4$ de
          Darcy-Weisbach con el $f$ de la 4.
        desarrollo: |
          $$
          Re_4 = \frac{4{,}391\cdot 0{,}085}{5\cdot 10^{-6}} = 74\,650
          \qquad
          \frac{\varepsilon}{D} = 1{,}76\cdot 10^{-3}
          $$

          Semirrugosa ($Re' = 13\,030$, $Re'' = 317\,300$): Colebrook da
          $f = 0{,}02500$.

          $$
          L_4 = \frac{h_{f4}\,D_4\,2g}{f_4\,V_4^{2}}
          = \frac{31{,}70\cdot 0{,}085\cdot 19{,}6}{0{,}02500\cdot 4{,}391^{2}}
          = 109{,}5\ \text{m}
          $$

          El impreso da 108,21, un 1,2 % menos. $L_4$ es el final de una
          cadena de cuatro tanteos y amplifica cualquier diferencia de
          arriba: con Colebrook también en el PVC sale 108,6; cerrando el
          balance de la tubería 2 en la lámina de B, sin su altura cinética,
          111,0 (111,7 con $g = 9{,}81$). Por eso la casilla admite un 2,5 %.
          Con la fórmula explícita de Swamee y Jain en vez de Colebrook sale
          106,3, que ya se sale: aquí conviene iterar Colebrook.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $Q_1$ como dato, la tubería 1 pierde 3,90 m y el nudo $N_1$
              queda a 136,10 m, por encima de los 126,23 de B: el fluido va de
              $N_1$ hacia B.
          - texto: >-
              La tubería 2, con $V_2$ y la salida al depósito, lleva 14,75
              l/s, y a la boquilla le llegan 35,25: 3,71 m/s en la tubería 5.
          - texto: >-
              El PVC de la 5 se comporta como liso y va con Blasius; las otras
              cuatro son semirrugosas y van con Colebrook.
          - texto: >-
              Las tuberías 3 y 4 pierden lo mismo, 31,70 m: la 3 lleva
              3,65 m/s, la 4 los 4,39 m/s que quedan, y eso pide 109,5 m de
              tubería 4.
          - texto: >-
              Como las tuberías 3 y 4 están en paralelo, llevan el mismo caudal,
              la mitad de $Q_5$ cada una.
            trampa: true
            mensaje: |
              En paralelo lo común es la **pérdida**, no el caudal. Con los
              mismos 31,70 m, la 3, de 60 mm, deja pasar 10,33 l/s, y la 4, de
              85 mm, 24,92. Repartir a partes iguales pondría la 3 a 6,2 m/s y
              le haría perder mucho más que a la 4, y los dos caminos entre
              $N_1$ y $N_2$ no pueden perder cosas distintas.
    resolucion: |
      **El planteamiento.** $Q_1$ es dato, así que la red se desenreda de
      arriba abajo sin sistema de ecuaciones: la tubería 1 da la energía en
      $N_1$; con ella, la 2 da $Q_2$; la continuidad da $Q_5$, y la 5 con la
      boquilla, la energía en $N_2$. Entre los dos nudos, la 3 y la 4 pierden
      lo mismo. El fluido tiene $\nu = 0{,}05$ St $= 5\cdot 10^{-6}$ m²/s y
      $\gamma = 943\cdot 9{,}8$ N/m³: la presión de B se pasa a columna **de
      este fluido**, $p_B/\gamma = 16{,}23$ m.

      **Lo imprescindible, tubería a tubería.** Las cinco van en régimen
      **turbulento**. El comportamiento se decide con
      $Re' = 23/(\varepsilon/D)$ y $Re'' = 560/(\varepsilon/D)$, con las
      rugosidades del cuadro 20:

      | tubería | $V$ (m/s) | $Re$ | $\varepsilon/D$ | comportamiento y expresión | $f$ |
      |---|---|---|---|---|---|
      | 1 | 1,592 | 63 660 | $1{,}30\cdot 10^{-3}$ | semirrugosa, Colebrook | 0,02413 |
      | 2 | 1,552 | 34 140 | $2{,}36\cdot 10^{-3}$ | semirrugosa, Colebrook | 0,02836 |
      | 3 | 3,655 | 43 860 | $2{,}50\cdot 10^{-3}$ | semirrugosa, Colebrook | 0,02791 |
      | 4 | 4,391 | 74 650 | $1{,}76\cdot 10^{-3}$ | semirrugosa, Colebrook | 0,02500 |
      | 5 | 3,710 | 81 610 | $6{,}4\cdot 10^{-5}$ | lisa, Blasius | 0,01870 |

      Colebrook converge en dos o tres iteraciones desde $f = 0{,}02$, y los
      tanteos de $V_2$ y $V_3$, en tres: dentro de lo que permite la nota.

      **a) La tubería 2.** $h_{f1} = 3{,}90$ m deja el nudo en 136,10 m, por
      encima de los $110 + 16{,}23 = 126{,}23$ de B: el fluido va de $N_1$
      **hacia B**. No se cuenta ninguna pérdida más que las dos del
      enunciado: el balance se cierra en la boca de la tubería dentro de B,
      donde la altura piezométrica es la de B y el fluido todavía lleva su
      $V_2^{2}/2g$. Esa altura no es una pieza más, es la energía con que
      llega, y se disipa ya dentro del depósito (el cuadro 24 la tabula como
      «entrada a depósito», $k = 1$):

      $$
      136{,}10 = 126{,}23 + h_{f2} + (2 + 1)\,\frac{V_2^{2}}{2g}
      \;\Longrightarrow\;
      Q_2 = 14{,}75\ \text{l/s}
      $$

      Cerrando el balance en la lámina de B, sin ese término, sale
      14,85 l/s, dentro de la misma tolerancia; con él se reproduce el 14,74
      impreso, y por eso es el que se sigue.

      **b) La tubería 5.** $Q_5 = 50 - 14{,}75 = 35{,}25$ l/s, y
      $V_5 = 3{,}71$ m/s.

      **c) Las tuberías 3 y 4.** La boquilla pierde $2\,V_C^{2}/2g$ y el
      chorro se lleva otro $V_C^{2}/2g$, con $V_C = 9{,}851$ m/s; la 5
      pierde 9,55 m. El nudo $N_2$ queda a
      $80 + 3\cdot 4{,}952 + 9{,}55 = 104{,}40$ m, así que las dos tuberías en
      paralelo pierden $136{,}10 - 104{,}40 = 31{,}70$ m. La 3, conocida,
      lleva con esa pérdida $V_3 = 3{,}65$ m/s y 10,33 l/s; la 4 lleva el
      resto, 24,92 l/s, a $V_4 = 4{,}39$ m/s.

      **d) La longitud de la 4.** Con su $f = 0{,}02500$ y los mismos
      31,70 m:

      $$
      L_4 = \frac{31{,}70\cdot 0{,}085\cdot 19{,}6}{0{,}02500\cdot 4{,}391^{2}}
      = 109{,}5\ \text{m}
      $$

      El impreso da 108,21: un 1,2 % de diferencia al final de cuatro
      tanteos encadenados, que es lo que mueve un $f$ leído en el ábaco o
      el balance de la tubería 2 cerrado en la lámina de B (111,0 m).

      **Lo que enseña.** Que en una red con un caudal dato no hace falta
      resolver nada a la vez: cada pérdida conocida fija una energía, y cada
      energía, el caudal siguiente. Y que en paralelo lo común es la pérdida:
      la tubería de 85 mm lleva más del doble que la de 60, con casi la
      misma longitud.
