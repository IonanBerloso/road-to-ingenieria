            <desc id="flu1920-2par-4-d">Papel milimetrado con un centímetro por cada 5 litros por segundo en horizontal y por cada 5 metros de columna de agua en vertical, con el caudal de 0 a 80 l/s y la altura de 0 a 60 m. La curva de la instalación arranca en 12 m a caudal nulo, que es el desnivel entre los dos depósitos, y sube curvándose hacia arriba: pasa por 34,6 m a 55 l/s, el punto de funcionamiento que da el enunciado, marcado con un punto, y llega a unos 58 m a 80 l/s. No es una recta ni una parábola: las tuberías van con el caudal elevado a 1,852 y las piezas, con su cuadrado.</desc>
