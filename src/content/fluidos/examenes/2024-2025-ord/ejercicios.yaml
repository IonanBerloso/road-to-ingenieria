      <figcaption>

      El tope T es un puente que apoya por arriba en A, la esquina del cuarto
      de cilindro, y en B, la del triángulo. Entre los dos cuerpos queda agua
      con su lámina libre, así que las dos caras verticales también están
      mojadas.

      </figcaption>
      </figure>

      **Notas nuestras.** Las letras d), e) y f) son las del cuadernillo: el
      ejercicio no tiene a), b) ni c). La figura está redibujada con las
      proporciones del impreso, y el ángulo $\alpha$ no está a escala, porque
      es lo que pide el apartado f).
    notas:
      - >-
        **NOTA**: A la hora de calcular cualquier fuerza hidrostática, es
        **OBLIGATORIO** dibujar el correspondiente **prisma de presiones
        acotado**.
    pide: Las dos componentes sobre la pared curva, la reacción del tope en A y el ángulo que iguala las dos reacciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          La componente vertical del empuje sobre la pared curva del cuarto de
          cilindro, ¿con qué volumen se calcula?
        opciones:
          - texto: >-
              Con el cuarto de círculo que queda entre la pared curva y el
              nivel de la lámina libre, que es el propio cuerpo, y hacia arriba
            correcta: true
            mensaje: |
              Eso es. La componente vertical es el peso del líquido, real o
              ficticio, que hay entre la pared y el nivel de la lámina libre.
              Aquí el agua está por debajo del arco, así que ese volumen es
              ficticio —lo ocupa el cuerpo— y el empuje va hacia arriba:
              $F_V = \gamma\,\pi R^{2} b/4$.
          - texto: >-
              Con el agua que hay debajo del arco, hasta el fondo del depósito
            mensaje: |
              El fondo no pinta nada: la presión en cada punto del arco depende
              solo de su profundidad bajo la lámina libre. Lo que cuenta es lo
              que hay entre el arco y ese nivel, y ahí no hay agua: está el
              cuerpo.
          - texto: >-
              Con el trozo del cuadrado de lado R que queda fuera del cuarto de
              círculo
            mensaje: |
              Ese trozo, $R^{2}(1-\pi/4)$, está entre el arco y la esquina de
              abajo a la izquierda, es decir **por debajo** de la pared. La
              vertical de cada punto del arco sube hasta la lámina libre, no
              baja, y con ese volumen la fuerza sale casi cuatro veces menor.

      - tipo: calcular
        titulo: La componente horizontal sobre la pared curva
        pregunta: |
          La componente horizontal vale $F_H = k\,\gamma R^{2} b$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número (vale una fracción como 1/2)
        distractores:
          - valor: '0.7854'
            mensaje: |
              Has multiplicado la presión media, $\gamma R/2$, por la longitud
              del arco, $\pi R/2$. La componente horizontal es la fuerza sobre
              la **proyección vertical** de la pared, un rectángulo de
              $R\times b$, no sobre el arco estirado.
          - valor: '1'
            mensaje: |
              Has usado la presión del fondo, $\gamma R$, en toda la
              proyección. La presión crece con la profundidad desde cero en la
              lámina, así que la que cuenta es la media, la de $R/2$.
        pista: |
          Es la fuerza sobre la proyección vertical del arco: un rectángulo de
          altura R que empieza en la lámina libre.
        desarrollo: |
          $$
          F_H = \gamma\,\frac{R}{2}\,R\,b = \frac{1}{2}\,\gamma R^{2} b
          $$

          Su prisma es un triángulo de base $\gamma R$, así que actúa a
          $2R/3$ de profundidad y empuja hacia la derecha.

      - tipo: calcular
        titulo: La componente vertical sobre la pared curva
        pregunta: |
          La componente vertical vale $F_V = k\,\gamma R^{2} b$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '0.7854'
          tolerancia: 0.005
          formato: un número (vale una expresión como pi/4)
        distractores:
          - valor: '0.2146'
            mensaje: |
              Es $1-\pi/4$: el trozo del cuadrado que queda entre el arco y la
              esquina de abajo. Está por debajo de la pared, y el volumen que
              da la vertical es el de encima, hasta el nivel de la lámina: el
              cuarto de círculo.
          - valor: '1'
            mensaje: |
              Has tomado el cuadrado de lado R entero. Encima del arco, hasta
              la lámina, solo cabe el cuarto de círculo.
        pista: |
          El volumen entre el arco y el nivel de la lámina libre es un cuarto
          de círculo de radio R, de anchura b.
        desarrollo: |
          $$
          F_V = \gamma\,\frac{\pi R^{2}}{4}\,b = 0{,}785\,\gamma R^{2} b
          $$

          Hacia arriba, porque el agua está debajo, y aplicada en el
          centroide del cuarto de círculo, a $4R/(3\pi)$ de cada cara recta.

      - tipo: dibujar
        consigna: |
          Dibuja lo que la NOTA pone como OBLIGATORIO: el prisma de presiones
          acotado de cada fuerza hidrostática del ejercicio, no solo de la
          pared curva. Son cuatro caras mojadas: la curva y la vertical del
          cuarto de cilindro, y la vertical y la hipotenusa del triángulo.
          Hazlo antes de tomar momentos: el brazo de cada fuerza sale de ahí.
        comprueba:
          - punto: >-
              En la pared curva, las presiones perpendiculares a ella y
              crecientes con la profundidad, de cero en $O_1$ a $\gamma R$
              abajo, y todas apuntando a A.
            porque: >-
              Una presión es normal a la pared, y en un arco de circunferencia
              todas las normales pasan por el centro. Por eso la resultante de
              la pared curva pasa por A, y eso es lo que simplifica el momento
              del apartado e).
          - punto: >-
              La componente horizontal como un triángulo sobre la proyección
              vertical del arco, de base $\gamma R$, con su resultante,
              $\gamma R^{2}b/2$, a $2R/3$ de profundidad.
            porque: >-
              Es el prisma que pide la NOTA para $F_H$, y el que la sitúa a
              $2R/3$. Tomando momentos por componentes ese es su brazo respecto
              de $O_1$; con la resultante por A no hace falta, pero la cota es
              la misma que la de la cara vertical, que sí da momento.
          - punto: >-
              La componente vertical como el cuarto de círculo, hacia arriba,
              con su centroide a $4R/(3\pi)$ de la cara vertical.
            porque: >-
              El volumen ficticio es el propio cuerpo, y el DATO del centroide
              está para eso. Se mide desde la cara recta vertical, no desde
              $O_1$: medido desde $O_1$, la reacción sale $\gamma R^{2}b/3$.
          - punto: >-
              La cara vertical del cuarto de cilindro, mojada, con su triángulo
              hacia la izquierda: $\gamma R^{2}b/2$ a $2R/3$.
            porque: >-
              Es la fuerza que más se olvida, porque el enunciado solo nombra
              la pared curva. Sin ella $R_A$ sale $\pi\gamma R^{2}b/4$, un 74 %
              más.
          - punto: >-
              En el triángulo, el prisma de la cara vertical hacia la derecha y
              el de la hipotenusa perpendicular a ella, los dos de $\gamma R$
              abajo.
            porque: >-
              Las componentes horizontales de las dos caras son iguales y
              opuestas, y a la misma profundidad: se anulan en fuerza y en
              momento. Lo que queda es la vertical, el peso del triángulo de
              agua ficticia, $\gamma R^{2}b/(2\operatorname{tg}\alpha)$.
          - punto: >-
              Las reacciones del tope, $R_A$ y $R_B$, hacia abajo.
            porque: >-
              El agua empuja los dos cuerpos hacia arriba y los hace girar
              alrededor de sus articulaciones; el tope los sujeta por arriba.
              Es el sentido que pide el apartado e).
        figura: |
          <figure>
          <svg viewBox="0 0 420 290" role="img" width="420" height="290" aria-labelledby="ex2425o1-prismas-t ex2425o1-prismas-d">
