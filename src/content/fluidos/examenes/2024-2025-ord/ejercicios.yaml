      <figcaption>

      Las curvas del rodete de 214 mm, redibujadas de las lecturas de la
      tabla: altura con las marcas de rendimiento, potencia absorbida y NPSH
      requerido, con el mismo eje de caudales. Hace de anexo: sobre ella se
      dibuja la curva de la instalación.

      </figcaption>
      </figure>
    pide: La curva de la instalación, el punto de funcionamiento, si cavita, las lecturas de los dos manómetros y el coste de un día.

    pasos:
      - tipo: reconocer
        pregunta: |
          La curva impresa, $H = 32 + 6{,}64\cdot 10^{-3}\,Q^{1{,}852}$, no lleva
          ningún término en $Q^{2}$. ¿Por qué?
        opciones:
          - texto: >-
              Porque el enunciado no da ningún factor de paso ni longitud
              equivalente, y los dos depósitos son abiertos: solo quedan el
              desnivel y el rozamiento de los dos tramos
            correcta: true
            mensaje: |
              Eso es. El término en $Q^{2}$ lo ponen las piezas dadas como
              factor de paso y la altura cinética de un chorro que sale a la
              atmósfera. Aquí no hay ni lo uno ni lo otro —la válvula está,
              pero sin dato, así que se supone abierta y sin pérdida—, y lo que
              queda es Hazen-Williams, con $Q^{1{,}852}$.
          - texto: >-
              Porque Hazen-Williams ya incluye las pérdidas menores
            mensaje: |
              No las incluye: Hazen-Williams da la pérdida por rozamiento de un
              tramo recto. Las menores van aparte, como factor de paso con
              $Q^{2}$ o como longitud equivalente sumada al tramo. Aquí no
              están porque el enunciado no las da.
          - texto: >-
              Porque el término en $Q^{2}$ es pequeño y se ha despreciado
            mensaje: |
              No se ha calculado para despreciarlo: el enunciado no da ningún
              factor de paso —ni de la válvula ni de la entrada o la salida de
              los depósitos—, y sin dato no hay término que escribir. La curva
              impresa lleva solo lo que el enunciado da.

      - tipo: calcular
        titulo: El coeficiente de la curva de la instalación
        pregunta: |
          Con $H = 32 + K\,Q^{1{,}852}$, $H$ en m y $Q$ en l/s, ¿cuánto vale $K$?
        respuesta:
          tipo: numero
          valor: '0.00664'
          tolerancia: 0.00005
          formato: un número (vale 6.64e-3)
        distractores:
          - valor: '0.006476'
            mensaje: |
              Es solo la impulsión. La aspiración es corta —15 m— pero existe:
              sus $1{,}6\cdot 10^{-4}$ son un 2,4 % del coeficiente.
          - valor: '0.005721'
            mensaje: |
              Has tomado $C_{HW} = 130$. La fundición tiene
              $\varepsilon = 0{,}026$ cm (cuadro n.º 20), y con 200 y 150 mm
              la rugosidad relativa es $1{,}3\cdot 10^{-3}$ y
              $1{,}73\cdot 10^{-3}$: las dos caen en la banda de
              $C_{HW} = 120$ del cuadro n.º 25.
        pista: |
          $J_1 = 1{,}2117\cdot 10^{10}/\left(C_{HW}^{1{,}852}\,D^{4{,}87}\right)$,
          con D en mm, y $K = 15\,J_1(200) + 150\,J_1(150)$.
        desarrollo: |
          $$
          J_1(120;\,200) = 1{,}064\cdot 10^{-5}
          \qquad
          J_1(120;\,150) = 4{,}317\cdot 10^{-5}
          $$
          $$
          K = 15\cdot 1{,}064\cdot 10^{-5} + 150\cdot 4{,}317\cdot 10^{-5}
          = 1{,}60\cdot 10^{-4} + 6{,}48\cdot 10^{-3} = 6{,}64\cdot 10^{-3}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero: la curva característica de esta
          instalación, desde el balance de energía entre las dos láminas hasta
          dejarla con su coeficiente calculado y en las unidades que pide el
          enunciado, H en m y Q en l/s.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Aquí la curva es corta —el desnivel y dos tramos de Hazen-Williams,
          sin piezas ni chorro—, así que lo que se juega el apartado no es la
          cuenta sino el orden y las unidades. Una curva sin decir en qué va Q
          no se puede cortar con el anexo, que viene en l/s y en m³/h.

      - tipo: dibujar
        consigna: |
          Dibuja sobre las curvas del rodete de 214 mm —la figura del
          enunciado hace de anexo— la curva de la instalación, y marca el
          punto de funcionamiento con sus cinco valores, como pide el apartado
          b): Q y H en el panel de arriba, el rendimiento entre sus marcas, y
          bajando por el mismo caudal, la potencia y el NPSH requerido.
        comprueba:
          - punto: >-
              La curva de la instalación arranca en 32 m a caudal nulo, no en
              el origen.
            porque: >-
              Son los 32 m de desnivel entre dos depósitos abiertos, lo que la
              bomba tiene que dar aunque no mueva agua. Empezarla en cero es
              dibujar una instalación sin desnivel, y el corte sale con
              demasiado caudal.
          - punto: >-
              Pasa por los puntos calculados con el coeficiente: 38,2 m a
              40 l/s, 45,0 m a 60, 54,2 m a 80 y 65,6 m a 100.
            porque: >-
              Cuatro puntos bastan para situarla. Dibujarla a ojo, con la
              forma que parece razonable, cambia el corte por una conjetura, y
              cerca del cruce cada metro de error mueve el caudal casi un litro
              por segundo.
          - punto: >-
              El punto de funcionamiento donde se cortan, con sus coordenadas
              leídas en los ejes: 80,5 l/s y 54,5 m.
            porque: >-
              El apartado b) pide los valores «tanto en la gráfica como en la
              resolución». Un círculo sin cotas no es una lectura.
          - punto: >-
              El rendimiento leído entre la marca de 80 y la de 77, no
              redondeado a la más cercana.
            porque: >-
              El punto cae entre dos curvas de igual rendimiento. Interpolando
              por el caudal sale 78,8 %, y el cuadernillo da 78,7; tomar 80 es
              darle a la bomba su rendimiento máximo, que no es el de este
              punto.
          - punto: >-
              Una vertical por el mismo caudal hasta los paneles de potencia y
              de NPSH, con las dos lecturas: unos 54,9 kW y 4,6 m.
            porque: >-
              Los tres paneles comparten el eje de caudales y se leen en la
              misma vertical. La potencia de la curva, 54,9 kW, casi coincide
              con $\gamma QH/\eta = 54{,}6$ kW: es la comprobación de que el
              punto está bien leído.
        figura: |
          <figure>
          <svg viewBox="0 0 340 438" role="img" width="340" height="438" aria-labelledby="ex2425o9-cruce-t ex2425o9-cruce-d">
            <title id="ex2425o9-cruce-t">La curva de la instalación sobre la del rodete de 214 mm, y el punto de funcionamiento leído en los tres paneles</title>
            <desc id="ex2425o9-cruce-d">Las tres curvas del rodete de 214 milímetros, como en el enunciado, y en el panel de arriba la curva de la instalación, H = 32 + 6,64 por diez a la menos tres por Q elevado a 1,852, que arranca en 32 metros a caudal nulo y sube. Se cortan en 80,5 litros por segundo y 54,5 metros: ese es el punto de funcionamiento, marcado con un círculo, entre la marca de 80 por ciento y la de 77, así que el rendimiento es de unos 78,8. Una vertical de trazos baja por el mismo caudal a los otros dos paneles: corta a la potencia en 54,9 kilovatios y al NPSH requerido en 4,6 metros, y cada lectura lleva su línea hasta el eje.</desc>
