            <desc id="ex2425o8-esquema-d">Un tramo de tubería horizontal de sección A1 por el que circula glicerina de izquierda a derecha. A mitad, una placa delgada con un orificio de sección A2; detrás de ella el chorro se estrecha hasta la vena contraída y luego vuelve a llenar el tubo. Una toma, 1, está aguas arriba de la placa, a un diámetro; la otra, 2, aguas abajo, en la vena contraída. Por debajo del tubo, las dos tomas bajan a un manómetro en U normal con tetracloruro de carbono, más pesado que la glicerina: el menisco de la rama de la toma 1 está más bajo. Por encima, las mismas dos tomas suben a un manómetro en U invertida con agua, más ligera: ahí el menisco de la rama de la toma 1 está más alto. La glicerina llena las conducciones hasta los meniscos. Las dos lecturas R están dibujadas iguales, porque con estos líquidos el factor que multiplica a R vale 0,206 en los dos casos.</desc>
