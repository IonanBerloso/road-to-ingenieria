        <desc id="ex2425o9-anexo-d">Redibujo de las lecturas del anexo del fabricante, solo para el rodete de 214 milímetros, en tres paneles con el mismo eje de caudales, de 0 a 110 litros por segundo. Arriba, la altura: plana en unos 62 metros hasta 40 litros por segundo y bajando cada vez más deprisa, hasta 42 metros a 100. Sobre ella, unas marcas donde la cortan las curvas de igual rendimiento del anexo: 58, 62, 66, 70 y 74 por ciento entre 34 y 58 litros por segundo, 77 a 65, el máximo, 80, a 76,6, y bajando otra vez, 77 a 86, 74 a 93,5, 70 a 98 y 66 a 102. En medio, la potencia absorbida, que sube de unos 27 kilovatios a caudal nulo a 60 a 100 litros por segundo. Abajo, el NPSH requerido, casi plano en 3 metros hasta 60 litros por segundo y subiendo después hasta 8,6 metros a 100.</desc>
