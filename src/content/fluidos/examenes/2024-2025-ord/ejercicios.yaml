.6L113.9 76.6L115.8 76.5L117.6 76.5L119.5 76.5L121.4 76.4L123.3 76.4L125.1 76.3L127 76.3L128.9 76.2L130.7 76.2L132.6 76.1L134.5 76.1L136.4 76.1L138.2 76L140.1 76L142 76L143.8 76L145.7 76L147.6 76L149.5 76L151.3 76L153.2 76L155.1 76L156.9 76L158.8 75.9L160.7 75.8L162.5 75.6L164.4 75.5L166.3 75.3L168.2 75.1L170 75L171.9 74.9L173.8 74.9L175.6 74.8L177.5 74.8L179.4 74.9L181.3 75L183.1 75L185 74.9L186.9 74.9L188.7 74.8L190.6 74.7L192.5 74.4L194.4 74.2L196.2 73.9L198.7 73.6L200.6 73.3L202.5 72.9L204.3 72.6L206.2 72.2L208.1 71.8L209.9 71.5L211.8 71.1L213.7 70.6L215.6 70.2L217.4 69.7L219.3 69.2L221.8 68.7L223.7 68.2L225.5 67.6L227.4 67L229.3 66.4L231.1 65.7L233 65L234.9 64.4L236.8 63.7L238.6 63L240.5 62.2L242.4 61.5L244.2 60.7L246.1 59.9L248 59L249.9 58.1L251.7 57.2L253.6 56.2L255.5 55.2L257.3 54.2L259.2 53.1L261.1 52L262.9 50.9L264.8 49.7L266.7 48.6L268.6 47.3L270.4 46.1L272.3 44.8L274.2 43.5L276 42.1L277.9 41.5L279.8 40.8L281.7 40.1"/><path class="ex2425o9-cruce-op" d="M231.3 96L231.3 30"/><path class="ex2425o9-cruce-op" d="M30 65.7L231.3 65.7"/><circle class="ex2425o9-cruce-hueco" cx="231.3" cy="65.7" r="4"/><text class="ex2425o9-cruce-l" x="225.3" y="59.7" text-anchor="end" fill="var(--flag)">4,6 m</text></g>
          </svg>
          <figcaption>La instalación corta al rodete de 214 mm en 80,5 l/s y 54,5 m, entre las marcas de rendimiento de 80 y 77. La vertical de trazos lleva el mismo caudal a la potencia y al NPSH requerido.</figcaption>
          </figure>

      - tipo: calcular
        titulo: El caudal del punto de funcionamiento
        pregunta: |
          ¿Qué caudal da la bomba en esta instalación, con su unidad?
        respuesta:
          tipo: magnitud
          valor: '80.5 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '76.6 l/s'
            mensaje: |
              Es el caudal de rendimiento máximo, la marca de 80 %. El punto de
              funcionamiento no se elige: es donde la curva de la instalación
              corta a la de la bomba, y aquí cae un poco a la derecha del
              óptimo.
          - valor: '289.8 l/s'
            mensaje: |
              Has leído el eje de m³/h como si fuera de l/s. El anexo trae los
              dos, y el cruce está en 289,8 m³/h, que son 80,5 l/s.
        pista: |
          A 80 l/s la instalación pide 54,2 m y la bomba da 54,7; a 85 l/s la
          instalación pide 56,9 m y la bomba solo da 52,4. El cruce está entre
          los dos, muy cerca de 80.
        desarrollo: |
          Interpolando la diferencia entre lo que la bomba da y lo que la
          instalación pide:

          $$
          Q = 80 + 5\cdot\frac{54{,}7-54{,}2}{(54{,}7-54{,}2)+(56{,}9-52{,}4)}
          = 80{,}5\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura del punto de funcionamiento
        pregunta: |
          ¿Qué altura da la bomba en ese punto?
        respuesta:
          tipo: magnitud
          valor: '54.5 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '32 m'
            mensaje: |
              Es solo el desnivel, lo que la instalación pide a caudal nulo.
              Con 80,5 l/s circulando, las tuberías se comen otros 22,5 m.
          - valor: '62.2 m'
            mensaje: |
              Es la altura de la bomba a caudal nulo, el arranque plano de su
              curva. En el punto de funcionamiento la bomba ya ha bajado por su
              curva hasta 54,5 m.
        pista: |
          En el cruce las dos curvas dan lo mismo: sustituye 80,5 l/s en la de
          la instalación.
        desarrollo: |
          $$
          H = 32 + 6{,}64\cdot 10^{-3}\cdot 80{,}5^{1{,}852} = 32 + 22{,}5 = 54{,}5\ \text{m}
          $$

      - tipo: calcular
        titulo: El rendimiento en el punto de funcionamiento
        pregunta: |
          ¿Qué rendimiento tiene la bomba en ese punto, en tanto por ciento?
        respuesta:
          tipo: numero
          valor: '78.7'
          tolerancia: 1
          formato: un número en tanto por ciento
        distractores:
          - valor: '80'
            mensaje: |
              Es la marca más cercana, y la del rendimiento máximo de este
              rodete. El punto está a su derecha, entre ella y la de 77: hay
              que interpolar.
          - valor: '77'
            mensaje: |
              Es la otra marca, la de 86,1 l/s. A 80,5 l/s el punto está más
              cerca de la de 80, y la interpolación da 78,7.
        pista: |
          La marca de 80 % está a 76,6 l/s y la de 77 %, a 86,1 l/s.
          Interpola por el caudal.
        desarrollo: |
          $$
          \eta = 80 - 3\cdot\frac{80{,}5-76{,}6}{86{,}1-76{,}6} = 78{,}8\ \%
          $$

          El cuadernillo da 78,7 %: la décima es la de la lectura del anexo.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Cuánta potencia absorbe la bomba en el punto de funcionamiento?
        respuesta:
          tipo: magnitud
          valor: '54.63 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '43.0 kW'
            mensaje: |
              Es la potencia hidráulica, la que recibe el agua: $\gamma QH$.
              La que absorbe la bomba es mayor, porque hay que dividir por su
              rendimiento, 0,787.
          - valor: '65.82 kW'
            mensaje: |
              Es la potencia eléctrica: has dividido también por el 83 % del
              motor. La absorbida es la que llega al eje de la bomba; la del
              motor es la del apartado e).
        pista: |
          $P_{abs} = \gamma\,Q\,H/\eta$, con Q en m³/s.
        desarrollo: |
          $$
          P_{abs} = \frac{9800\cdot 0{,}0805\cdot 54{,}5}{0{,}787} = 54\,632\ \text{W} = 54{,}63\ \text{kW}
          $$

          En el panel de potencia del anexo se leen unos 54,9 kW a ese
          caudal: las dos cosas cuadran a menos del 1 %.

      - tipo: calcular
        titulo: El NPSH requerido
        pregunta: |
          ¿Qué NPSH requiere la bomba en el punto de funcionamiento?
        respuesta:
          tipo: magnitud
          valor: '4.7 m'
          tolerancia: 0.05
          formato: una altura, con su unidad
        distractores:
          - valor: '5.2 m'
            mensaje: |
              Le has sumado ya el margen de seguridad de 0,5 m del anexo. El
              requerido es el de la curva; el margen se suma al compararlo con
              el disponible, en el apartado c).
          - valor: '6.11 m'
            mensaje: |
              Lo has multiplicado ya por 1,3, el factor de proyecto del tema
              25. El requerido es lo que da la curva del fabricante; el factor,
              si se usa, va en la comparación.
        pista: |
          Baja por la vertical de 80,5 l/s hasta el panel de NPSH y lee la
          curva del rodete de 214 mm.
        desarrollo: |
          En la tabla, 4,5 m a 80 l/s y 5,2 m a 85 l/s: a 80,5 l/s, unos
          4,6 m. El cuadernillo da 4,7 m, la misma lectura con una décima
          más: un píxel del anexo son 0,12 m.

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          Con la bomba 4,6 m por encima del depósito inferior, ¿cuánto vale el
          NPSH disponible?
        respuesta:
          tipo: magnitud
          valor: '5.41 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '5.95 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración, 0,54 m. Es pequeña,
              pero el NPSH disponible es una resta de números grandes y lo que
              queda es poco.
          - valor: '5.0 m'
            mensaje: |
              Has tomado 1 atm, 10,34 m. El enunciado da 1,04 atm, que son
              10,75 m de agua.
          - valor: '5.61 m'
            mensaje: |
              Te has dejado la presión de vapor, 0,2 mca. El NPSH se cuenta
              sobre la presión de vapor, no sobre el cero absoluto.
        pista: |
          $NPSH_d = p_{atm}/\gamma - p_v/\gamma - z_{asp} - h_{f,asp}$, con
          $h_{f,asp} = 15\,J_1(200)\,Q^{1{,}852}$.
        desarrollo: |
          $$
          \frac{p_{atm}}{\gamma} = \frac{1{,}04\cdot 101\,325}{9800} = 10{,}753\ \text{m}
          \qquad
          h_{f,asp} = 1{,}595\cdot 10^{-4}\cdot 80{,}5^{1{,}852} = 0{,}540\ \text{m}
          $$
          $$
          NPSH_d = 10{,}753 - 0{,}2 - 4{,}6 - 0{,}540 = 5{,}41\ \text{m}
          $$

          Supera al requerido, 4,7 m según el cuadernillo, y también al
          requerido más el margen de 0,5 m del anexo, 5,2 m: no cavita.

      - tipo: calcular
        titulo: La lectura del Bourdon de la aspiración
        pregunta: |
          ¿Qué marca el Bourdon de la aspiración, en torr?
        respuesta:
          tipo: magnitud
          valor: '388.21 torr'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '412.9 torr'
            mensaje: |
              Te has dejado la altura cinética en la entrada de la bomba,
              0,335 m. En la brida el agua ya va a 2,56 m/s, y esa energía sale
              de la presión.
          - valor: '452.6 torr'
            mensaje: |
              Solo has restado la altura de la bomba sobre el depósito. Faltan
              la pérdida de la aspiración y la altura cinética, casi 0,9 m de
              columna de agua.
        pista: |
          Bernoulli de la lámina del depósito inferior a la entrada de la
          bomba, en absolutas, porque el Bourdon es de presión absoluta.
        desarrollo: |
          $$
          v_e = \frac{0{,}0805}{\pi\,0{,}2^{2}/4} = 2{,}562\ \text{m/s}
          \qquad
          \frac{v_e^{2}}{2g} = 0{,}335\ \text{m}
          $$
          $$
          \frac{p_e}{\gamma} = 10{,}753 - 4{,}6 - 0{,}540 - 0{,}335 = 5{,}278\ \text{m}
          \;\Longrightarrow\;
          p_e = 51\,724\ \text{Pa}
          $$

          Con 1 torr = 1 mm de columna de mercurio de 13 595 kg/m³ y
          $g = 9{,}8$, es decir 133,2 Pa, salen 388,2 torr. Con el torr
          normalizado, 101 325/760 Pa, saldrían 388,0: la diferencia no llega
          al 0,1 %.

      - tipo: calcular
        titulo: La lectura del manómetro de fuelle
        pregunta: |
          ¿Qué marca el manómetro de fuelle de la impulsión, en MPa?
        respuesta:
          tipo: magnitud
          valor: '0.473 MPa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.579 MPa'
            mensaje: |
              Es la presión absoluta. Un manómetro de fuelle mide contra la
              atmósfera, así que marca la manométrica: 1,04 atm menos.
          - valor: '0.534 MPa'
            mensaje: |
              Has tomado la altura de la bomba como la presión de salida,
              $p_s = \gamma H$. La bomba suma sus 54,5 m a lo que ya había en
              la entrada, que está en depresión, y parte de lo que suma es
              altura cinética.
        pista: |
          El de fuelle marca presión manométrica. Con la entrada y la salida
          de la bomba a la misma cota,
          $p_s/\gamma = p_e/\gamma + H + (v_e^{2}-v_s^{2})/2g$.
        desarrollo: |
          $$
          v_s = \frac{0{,}0805}{\pi\,0{,}15^{2}/4} = 4{,}555\ \text{m/s}
          \qquad
          \frac{v_s^{2}}{2g} = 1{,}059\ \text{m}
          $$
          $$
          \frac{p_{s,man}}{\gamma} = (5{,}278-10{,}753) + 54{,}5 + 0{,}335 - 1{,}059 = 48{,}30\ \text{m}
          \;\Longrightarrow\;
          p_{s,man} = 0{,}473\ \text{MPa}
          $$

          Por el otro lado sale lo mismo: de la brida de salida a la lámina de
          arriba, $32 - 4{,}6 + 21{,}93 - 1{,}059 = 48{,}26$ m.

      - tipo: calcular
        titulo: El coste diario de la instalación
        pregunta: |
          ¿Cuánto cuesta un día de funcionamiento, en euros?
        respuesta:
          tipo: numero
          valor: '105.31'
          tolerancia: 1
          formato: un número, en euros al día
        distractores:
          - valor: '87.41'
            mensaje: |
              Te has dejado el rendimiento del motor. Lo que se paga es la
              energía eléctrica, y el motor pierde un 17 % por el camino.
          - valor: '157.97'
            mensaje: |
              Has contado 24 horas. La instalación está en marcha 16 horas al
              día.
          - valor: '68.79'
            mensaje: |
              Has partido de la potencia hidráulica, 43 kW, sin ninguno de los
              dos rendimientos: ni el de la bomba ni el del motor.
        pista: |
          La potencia eléctrica es la absorbida dividida por el rendimiento del
          motor, y la energía de un día, esa potencia por 16 horas.
        desarrollo: |
          $$
          P_{el} = \frac{54{,}63}{0{,}83} = 65{,}82\ \text{kW}
          \qquad
          E = 65{,}82\cdot 16 = 1053{,}1\ \text{kWh}
          $$

          A 0,1 € el kW·h, son 105,31 € al día.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación solo lleva el desnivel y Hazen-Williams
              en los dos tramos: $H = 32 + 6{,}64\cdot 10^{-3}\,Q^{1{,}852}$.
          - texto: >-
              Se corta con la del rodete de 214 mm en 80,5 l/s y 54,5 m, entre
              las marcas de rendimiento de 80 y 77: $\eta = 78{,}7\,\%$ y
              $P_{abs} = \gamma QH/\eta = 54{,}63$ kW.
          - texto: >-
              El NPSH disponible, 5,41 m, supera al requerido, 4,7 m, y también
              a él más el margen de 0,5 m del anexo: no cavita.
          - texto: >-
              El Bourdon marca la absoluta de la entrada, 388,2 torr, y el de
              fuelle la manométrica de la salida, 0,473 MPa; el coste, con el
              83 % del motor, es de 105,31 € al día.
          - texto: >-
              La potencia absorbida es la hidráulica, $\gamma QH$, porque el
              rendimiento ya está dentro de la curva de la bomba.
            trampa: true
            mensaje: |
              La curva de la bomba da la altura que entrega al agua, no lo que
              absorbe. La absorbida es $\gamma QH/\eta$, 54,6 kW, y no 43,0: el
              21 % que falta se queda en la bomba.
    resolucion: |
      **Qué hay que leer y qué hay que calcular.** El ejercicio se resuelve
      sobre el anexo: la curva de la instalación se calcula, y el punto de
      funcionamiento, el rendimiento, la potencia y el NPSH requerido se leen
      en las curvas del rodete de 214 mm. Todo lo demás —cavitación,
      manómetros y coste— sale de esas lecturas.

      **a) La curva de la instalación.** Balance de energía entre las dos
      láminas, las dos a presión atmosférica y quietas: la bomba tiene que
      dar el desnivel más las pérdidas. No hay piezas con su factor de paso
      ni chorro, así que las pérdidas son solo las de Hazen-Williams. La
      fundición tiene $\varepsilon = 0{,}026$ cm (cuadro n.º 20); con 200 y
      150 mm, $\varepsilon/D$ vale $1{,}3\cdot 10^{-3}$ y
      $1{,}73\cdot 10^{-3}$, y las dos bandas del cuadro n.º 25 dan
      $C_{HW} = 120$:

      $$
      H = 32 + \bigl[15\,J_1(120;200) + 150\,J_1(120;150)\bigr]\,Q^{1{,}852}
      = 32 + 6{,}64\cdot 10^{-3}\,Q^{1{,}852}
      $$

      con $H$ en m y $Q$ en l/s. La aspiración pone solo el 2,4 % del
      coeficiente: los 150 m de 150 mm son casi toda la pérdida.

      **b) El punto de funcionamiento.** Sobre el anexo, la curva de la
      instalación corta a la del rodete de 214 mm en

      $$
      Q = 80{,}5\ \text{l/s}
      \qquad
      H = 54{,}5\ \text{m}
      $$

      entre la marca de rendimiento de 80 % (76,6 l/s) y la de 77 % (86,1
      l/s); interpolando por el caudal sale 78,8 %, y el cuadernillo da
      $\eta = 78{,}7\,\%$, con el que seguimos. El NPSH requerido se lee en su
      panel en la misma vertical: 4,6 m en nuestra lectura y 4,7 m en el
      cuadernillo, que es la misma lectura con una décima más —un píxel de la
      imagen del anexo son 0,12 m—. Y la potencia absorbida:

      $$
      P_{abs} = \frac{\gamma\,Q\,H}{\eta} = \frac{9800\cdot 0{,}0805\cdot 54{,}5}{0{,}787}
      = 54{,}63\ \text{kW}
      $$

      que es lo que da el panel de potencia, unos 54,9 kW.

      **c) La cavitación.** Todo el NPSH disponible es de la instalación:

      $$
      NPSH_d = \frac{p_{atm}}{\gamma} - \frac{p_v}{\gamma} - z_{asp} - h_{f,asp}
      = 10{,}753 - 0{,}2 - 4{,}6 - 0{,}540 = 5{,}41\ \text{m}
      $$

      Es mayor que el requerido, 4,7 m, y el cuadernillo concluye que **no
      hay cavitación**. Conviene mirar el margen: son 0,71 m. El anexo del
      fabricante pide 0,5 m, y se cumple. El tema 25 da el criterio de
      proyecto de dos maneras: un NPSH de seguridad de 0,5 a 0,9 mcl —y
      0,71 m queda dentro de esa banda, por encima de su extremo bajo y por
      debajo del alto—, o $NPSH_d > 1{,}3\,NPSH_r$, que aquí pediría 6,1 m y
      no se cumple. Las dos maneras solo coinciden cuando el requerido está
      entre 1,7 y 3 m; con 4,7 m, el 30 % son 1,4 m de margen. El examen
      compara sin factor, y con el margen del fabricante le basta. Es lo que
      dice la diapositiva 21 del tema 25: en una instalación en
      funcionamiento basta con que el disponible supere al requerido, y el
      factor 1,3 es un criterio de diseño.

      **d) Los manómetros.** Con la entrada y la salida de la bomba a la
      misma cota, y las velocidades de cada tubería, $v_e = 2{,}562$ m/s y
      $v_s = 4{,}555$ m/s:

      - el Bourdon, de presión absoluta, en la entrada:
        $p_e/\gamma = 10{,}753 - 4{,}6 - 0{,}540 - 0{,}335 = 5{,}278$ m, es
        decir 51 724 Pa y **388,2 torr**;
      - el de fuelle, manométrico, en la salida:
        $p_s/\gamma = (5{,}278 - 10{,}753) + 54{,}5 + 0{,}335 - 1{,}059 = 48{,}30$ m,
        es decir **0,473 MPa**.

      **e) El coste.** Lo que se paga es la potencia eléctrica:

      $$
      P_{el} = \frac{54{,}63}{0{,}83} = 65{,}82\ \text{kW}
      \qquad
      65{,}82\cdot 16 = 1053{,}1\ \text{kWh}
      $$

      A 0,1 € el kW·h, **105,31 € al día**.

      **Lo que no pregunta ningún apartado.** El caudalímetro está en el
      enunciado y nadie lo lee: a 80,5 l/s, con su escala de 4 a 20 mA para 0
      a 150 l/s, marcaría $4 + 16\cdot 80{,}5/150 = 12{,}59$ mA. Es la
      comprobación que se haría en la instalación de verdad, antes de fiarse
      del anexo.
