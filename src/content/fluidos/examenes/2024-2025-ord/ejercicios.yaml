ejercicios:
  # ── 2 (10 %) · El piezómetro que miente por capilaridad. De los 22 cm que
  #    sube el menisco, 2,46 no son presión.
  - id: exflu2425-ord-2-el-piezometro-que-miente-por-capilaridad
    titulo: El piezómetro que miente, y cuánto de los veintidós centímetros es capilaridad
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En un depósito presurizado de 1,5 m de diámetro se almacena un fluido de
      $s = 0{,}77$. Se le realiza un orificio lateral al depósito para colocar
      un tubo piezométrico abierto. Tras colocar el tubo, el fluido asciende
      por el tubo hasta que el menisco del tubo piezométrico está una altura
      $h = 22$ cm por encima de la superficie del fluido en el depósito.

      El tubo piezométrico es de sección **cuadrada de 1 mm de lado**, y la
      relación entre las fuerzas de adhesión y cohesión es
      $F_{adh}/F_{coh} = 4/3$. Calcular cuál es la presión de aire en la
      cámara que se encuentra en la parte superior del depósito (mbar).

      Dato: $\sigma = 70\ \text{dyn/cm}$.
    pide: La presión del aire de la cámara, descontando lo que sube el líquido por capilaridad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El menisco del piezómetro está 22 cm por encima de la superficie del
          depósito. ¿Qué mide esa altura?
        opciones:
          - texto: >-
              La presión de la cámara **más** el ascenso capilar del tubo, que
              hay que descontar
            correcta: true
            mensaje: |
              Eso es, y es todo el ejercicio. Un piezómetro de 1 mm de lado
              es un tubo capilar: el líquido sube por él aunque no haya
              ninguna presión. Lo que mide la altura es la suma de las dos
              cosas, y solo una de ellas es la que se pregunta.
          - texto: >-
              Solo la presión de la cámara, porque el piezómetro está abierto
            mensaje: |
              Que esté abierto garantiza que la referencia es la atmósfera,
              no que no haya capilaridad. Con un lado de 1 mm el ascenso
              capilar son 2,46 cm de los 22, un 11 % de la lectura.
          - texto: >-
              La presión de la cámara menos la altura del líquido del depósito
            mensaje: |
              La altura de líquido del depósito ya está descontada: los 22 cm
              se miden **desde la superficie libre** del depósito, no desde
              el orificio. Por eso el diámetro de 1,5 m es un dato de sobra.

      - tipo: calcular
        titulo: El coseno del ángulo de contacto
        pregunta: |
          Con $F_{adh}/F_{coh} = 4/3$, ¿cuánto vale $\cos\theta$?
        respuesta:
          tipo: numero
          valor: '0.663'
          tolerancia: 0.005
          formato: un número entre cero y uno
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el mojado perfecto. El enunciado da la relación
              adhesión-cohesión precisamente para que el ángulo no sea cero:
              aquí sale 48,5º.
          - valor: '0.8'
            mensaje: |
              Has puesto la cohesión perpendicular a la adhesión en vez de a
              45º. Con esa hipótesis saldría $4/5$; la construcción del tema
              coloca la cohesión a 45º hacia el interior del líquido.
          - valor: '0.75'
            mensaje: |
              Eso es $3/4$, el cociente de las dos fuerzas al revés. El
              coseno no es el cociente: sale de componer las dos fuerzas como
              vectores, con la cohesión a 45º.
        pista: |
          La adhesión tira perpendicular a la pared y la cohesión a 45º hacia
          el interior del líquido; la superficie libre queda perpendicular a
          la resultante.
        desarrollo: |
          Con $F_a = 4$ y $F_c = 3$:

          $$
          R_x = 4-\frac{3}{\sqrt{2}} = 1{,}8787
          \qquad
          R_y = \frac{3}{\sqrt{2}} = 2{,}1213
          $$
          $$
          \cos\theta = \frac{1{,}8787}{\sqrt{1{,}8787^{2}+2{,}1213^{2}}}
          = \frac{1{,}8787}{2{,}8336} = 0{,}663
          $$

      - tipo: calcular
        titulo: El ascenso capilar del tubo
        pregunta: |
          ¿Cuánto sube el líquido por capilaridad en ese tubo, en milímetros?
        respuesta:
          tipo: numero
          valor: '24.6'
          tolerancia: 0.3
          formato: un número en milímetros
        distractores:
          - valor: '37.1'
            mensaje: |
              Has supuesto mojado perfecto. Con $\cos\theta = 0{,}663$ el
              ascenso baja de 37,1 a 24,6 mm, y esos 12 milímetros de
              diferencia son un 5 % del resultado final.
          - valor: '18.4'
            mensaje: |
              Parece que has usado el factor 3 del rectángulo $b\times 2b$ en
              vez del 4 del cuadrado. En un cuadrado de lado $a$,
              $P/A = 4a/a^{2} = 4/a$, el mismo factor que en el tubo
              circular.
        pista: |
          $\sigma P\cos\theta = \gamma A h$, y en un cuadrado de lado $a$ la
          relación $P/A$ vale $4/a$.
        desarrollo: |
          $$
          h_{cap} = \frac{4\,\sigma\cos\theta}{\gamma\,a}
          = \frac{4\cdot 0{,}070\cdot 0{,}663}{0{,}77\cdot 9800\cdot 0{,}001}
          = \frac{0{,}18564}{7{,}546} = 0{,}0246\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión de la cámara
        pregunta: |
          ¿Cuánto vale la presión del aire de la cámara, en mbar?
        respuesta:
          tipo: magnitud
          valor: '14.74 mbar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '16.6 mbar'
            mensaje: |
              Te has quedado con los 22 cm enteros sin descontar la
              capilaridad. El piezómetro sube 2,46 cm por su cuenta, y
              atribuirlos a la presión la infla un 13 %.
          - valor: '21.56 mbar'
            mensaje: |
              Has usado el peso específico del agua. El fluido tiene
              $s = 0{,}77$, así que $\gamma = 7546\ \text{N/m}^{3}$.
        pista: |
          De los 22 cm de menisco, réstale el ascenso capilar; lo que queda
          es columna de fluido debida a la presión.
        desarrollo: |
          $$
          \frac{p}{\gamma} = 0{,}22-0{,}0246 = 0{,}1954\ \text{m}
          $$
          $$
          p = 7546\cdot 0{,}1954 = 1474{,}5\ \text{Pa} = 14{,}74\ \text{mbar}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Un tubo de 1 mm de lado es un capilar, así que el menisco sube
              por presión **y** por capilaridad.
          - texto: >-
              La relación $4/3$ entre adhesión y cohesión da
              $\cos\theta = 0{,}663$, y con ella el ascenso capilar vale
              24,6 mm.
          - texto: >-
              Los 19,54 cm que quedan sí son columna de fluido debida a la
              presión, y valen 14,74 mbar.
          - texto: >-
              El diámetro del depósito, 1,5 m, sirve para calcular cuánto baja
              su superficie al llenarse el piezómetro.
            trampa: true
            mensaje: |
              El tubo tiene 1 mm de lado y el depósito 1,5 m de diámetro: el
              volumen que sube por el capilar es una diezmillonésima parte
              del área del depósito. El dato está para comprobar que sabes
              descartarlo, y de paso para justificar que la superficie del
              depósito no se mueve.
    resolucion: |
      **Por qué este ejercicio existe.** Un piezómetro se lee suponiendo que
      la altura de la columna es la presión. Con un tubo estrecho eso deja de
      ser cierto: el líquido trepa solo, y la lectura sale inflada. Aquí el
      tubo tiene **1 mm de lado**, y el ejercicio pide separar las dos cosas.

      **El ángulo de contacto.** No lo da el enunciado: da la relación entre
      las fuerzas de adhesión —perpendiculares a la pared— y las de cohesión
      —a 45º hacia el interior del líquido—. La superficie libre se coloca
      perpendicular a la resultante, y de ahí:

      $$
      \cos\theta = \frac{F_a - F_c/\sqrt{2}}
      {\sqrt{(F_a-F_c/\sqrt{2})^{2}+(F_c/\sqrt{2})^{2}}}
      = \frac{1{,}8787}{2{,}8336} = 0{,}663
      \qquad
      \theta = 48{,}5^{\circ}
      $$

      **El ascenso capilar.** En una sección cuadrada de lado $a$ el balance
      capilar general $\sigma P\cos\theta = \gamma A h$ da $P/A = 4/a$, el
      mismo factor que en el tubo circular con $a = D$:

      $$
      h_{cap} = \frac{4\,\sigma\cos\theta}{\gamma a}
      = \frac{4\cdot 0{,}070\cdot 0{,}663}{7546\cdot 0{,}001}
      = 24{,}6\ \text{mm}
      $$

      **La presión.** De los 220 mm de menisco, 24,6 los pone la capilaridad.
      Los otros 195,4 son columna debida a la presión de la cámara:

      $$
      p = 7546\cdot 0{,}1954 = 1474{,}5\ \text{Pa} = 14{,}74\ \text{mbar}
      $$

      **La lección de instrumentación.** El error por no descontar la
      capilaridad sería del **13 %** en la presión. Y como $h_{cap}$ va con
      $1/a$, un piezómetro de 1 cm de lado lo reduciría a un 1,3 %. Esa es la
      razón por la que los tubos piezométricos de laboratorio son gruesos: no
      por robustez, sino para que la capilaridad no se cuele en la lectura.

  # ── 3 (10 %) · Diseñar la sensibilidad de un micromanómetro para igualar
  #    a un tubo inclinado. Al revés de lo habitual.
  - id: exflu2425-ord-3-disenar-la-sensibilidad-del-micromanometro
    titulo: Qué pareja de líquidos iguala a un tubo inclinado de cuatro grados
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se cuenta con dos micromanómetros, uno de líquidos inmiscibles y el otro
      de tubo inclinado. El micromanómetro de tubo inclinado tiene como
      líquido agua, y cuenta con un ángulo $\alpha$ sobre la horizontal de 4
      grados. Teniendo como uno de los fluidos el agua para el micromanómetro
      de líquidos inmiscibles, se pide:

      **a)** Calcular cuál será la densidad **máxima y mínima** que deberá
      tener el otro fluido en el micromanómetro de líquidos inmiscibles para
      tener, como mínimo, la misma precisión para medir variaciones de presión
      que el de tubo inclinado. Indicar en cada caso cuál será el fluido $s_1$
      y $s_2$.

      **b)** Si para el micromanómetro de líquidos inmiscibles se escoge como
      segundo fluido la parafina ($s = 0{,}9$), calcular cuál deberá ser el
      ángulo del micromanómetro de tubo inclinado para que ambos cuenten con
      exactamente la misma precisión. Indicar nuevamente cuál será el fluido
      $s_1$ y $s_2$.

      Nota: considérese en ambos casos que la medición de variación de presión
      se hace a través de una precisión de 1 mm en sus tramos de medición
      correspondientes. Considérese también que todos los depósitos son de
      grandes dimensiones.
    pide: El intervalo de densidades del segundo líquido, y el ángulo equivalente.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Precisión de 1 mm en el tramo de medición» ¿qué significa en cada
          aparato?
        opciones:
          - texto: >-
              Que se distingue 1 mm de recorrido a lo largo del tubo, y hay
              que traducir ese milímetro a la presión que le corresponde
            correcta: true
            mensaje: |
              Eso es, y es lo que hace comparables a los dos aparatos. En el
              inclinado, 1 mm de tubo son $1\cdot\sin\alpha$ mm de altura; en
              el de líquidos inmiscibles, 1 mm de menisco son
              $1\cdot(\gamma_1-\gamma_2)$ en vez de $1\cdot\gamma$. Más
              preciso es el que mide **menos presión** por milímetro.
          - texto: >-
              Que el error del aparato es de 1 mm de columna de agua
            mensaje: |
              La precisión se da en longitud recorrida por el líquido, no en
              columna de agua equivalente. Convertir una en otra es
              justamente lo que se pide.
          - texto: >-
              Que los dos aparatos tienen la misma precisión de partida
            mensaje: |
              Tienen la misma precisión **de lectura** —el milímetro de la
              regla— pero no la misma precisión en presión, que es lo que se
              compara. Esa es la diferencia entre resolución y sensibilidad.

      - tipo: calcular
        titulo: La densidad relativa máxima
        pregunta: |
          ¿Cuál es la densidad relativa **máxima** que puede tener el otro
          fluido?
        respuesta:
          tipo: numero
          valor: '1.07'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.14'
            mensaje: |
              Has contado el margen dos veces, como si el menisco se
              desplazara la mitad a cada lado. La condición es
              $\lvert s_1-s_2\rvert \le \sin\alpha$ a secas, y $\sin
              4^{\circ}$ vale 0,0698.
          - valor: '1.004'
            mensaje: |
              Parece que has usado el ángulo en radianes o has confundido el
              seno con la tangente de un ángulo muy pequeño mal convertido.
              $\sin 4^{\circ} = 0{,}0698$.
          - valor: '1.93'
            mensaje: |
              Has sumado 0,93 en vez de 0,0698. El margen que da un tubo
              inclinado de 4º es de **siete centésimas** de densidad relativa,
              no de casi uno.
        pista: |
          Iguala las dos precisiones: $(\gamma_1-\gamma_2)\cdot 1\ \text{mm}$
          contra $\gamma_{ag}\sin\alpha\cdot 1\ \text{mm}$.
        desarrollo: |
          $$
          |s_1-s_2|\le \sin 4^{\circ} = 0{,}069756
          $$
          $$
          s_{2,max} = 1+0{,}0698 = 1{,}07
          \qquad
          s_{2,min} = 1-0{,}0698 = 0{,}93
          $$

          En el primer caso el agua es el **ligero**, así que es $s_1$; en el
          segundo el agua es el **pesado**, así que es $s_2$.

      - tipo: calcular
        titulo: El ángulo equivalente a la parafina
        pregunta: |
          Con parafina de $s = 0{,}9$ frente al agua, ¿qué ángulo debe tener
          el tubo inclinado para igualar la precisión, en grados?
        respuesta:
          tipo: numero
          valor: '5.739'
          tolerancia: 0.02
          formato: un número en grados
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el ángulo de partida, y con él el inclinado es **más**
              preciso que la pareja agua-parafina. Para igualarla hay que
              levantar el tubo hasta 5,74º.
          - valor: '0.1'
            mensaje: |
              Eso es el seno del ángulo, no el ángulo. Como $\sin\alpha$ vale
              0,1 y el ángulo es pequeño, la diferencia se ve poco en
              radianes pero mucho en grados.
          - valor: '5.16'
            mensaje: |
              Parece que has tomado la diferencia como $0{,}9$ en vez de
              $1-0{,}9 = 0{,}1$, o has aplicado el arcoseno a un valor mal
              construido. El desequilibrio de la pareja es la **resta** de
              densidades relativas.
        pista: |
          La pareja agua-parafina mide $0{,}1\gamma_{ag}$ por milímetro; el
          inclinado, $\gamma_{ag}\sin\alpha$.
        desarrollo: |
          $$
          \sin\alpha = |1-0{,}9| = 0{,}1
          \;\Longrightarrow\;
          \alpha = 5{,}739^{\circ}
          $$

          Aquí la parafina es el ligero y el agua el pesado, así que el agua
          es $s_2$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En el tubo inclinado, un milímetro de recorrido equivale a
              $\sin\alpha$ milímetros de altura, y eso divide la presión
              medible por milímetro.
          - texto: >-
              En el de líquidos inmiscibles, un milímetro de menisco equivale
              a la **diferencia** de pesos específicos, no a uno de ellos.
          - texto: >-
              Igualar las dos precisiones es igualar
              $|s_1-s_2|$ con $\sin\alpha$, y con 4º sale un margen de
              $\pm 0{,}0698$ alrededor del agua.
          - texto: >-
              Como la precisión mejora al acercar las dos densidades, lo ideal
              sería elegir dos líquidos casi idénticos.
            trampa: true
            mensaje: |
              La sensibilidad crece, sí, pero el aparato se vuelve
              inservible: el menisco se va metros para presiones minúsculas,
              se sale del tubo, y cualquier cambio de temperatura —que altera
              las dos densidades de forma distinta— se convierte en un error
              enorme. La sensibilidad se paga en **rango** y en
              **estabilidad**, y el mismo argumento vale para el tubo
              inclinado cuando se tumba demasiado.
    resolucion: |
      **La idea, que aquí va del revés.** Lo habitual es leer un
      micromanómetro; aquí se pide **diseñarlo**. Y para eso hay que escribir
      la sensibilidad de cada aparato: cuánta presión representa un milímetro
      de recorrido del líquido.

      | aparato | presión por milímetro |
      |---|---|
      | tubo inclinado | $\gamma_{ag}\sin\alpha$ |
      | líquidos inmiscibles | $\gamma_{ag}\,\lvert s_1-s_2\rvert$ |

      Cuanto **menor** sea ese número, más fino es el aparato: distingue
      variaciones de presión más pequeñas.

      **a) El intervalo de densidades.** Para que el de líquidos inmiscibles
      sea al menos tan preciso como el inclinado de 4º:

      $$
      \lvert s_1-s_2\rvert \le \sin 4^{\circ} = 0{,}0698
      $$

      Con el agua como uno de los dos:

      $$
      s_{2,max} = 1{,}07
      \qquad
      s_{2,min} = 0{,}93
      $$

      Y hay que decir cuál es cuál en la figura: si el otro fluido es más
      pesado ($1{,}07$), el agua es el ligero, $s_1 = 1$; si es más ligero
      ($0{,}93$), el agua es el pesado, $s_2 = 1$.

      **b) El ángulo equivalente.** Con parafina, $\lvert s_1-s_2\rvert =
      0{,}1$, y para que el inclinado empate:

      $$
      \sin\alpha = 0{,}1
      \qquad
      \alpha = 5{,}739^{\circ}
      $$

      Aquí la parafina es $s_1$ y el agua $s_2$.

      **Lo que hay que llevarse.** Los dos aparatos hacen lo mismo por
      caminos distintos: el inclinado estira la lectura por geometría, el de
      líquidos inmiscibles por densidad. Y los dos pagan lo mismo por ello:
      un tubo casi horizontal o dos líquidos casi iguales dan una lectura
      enorme, un rango ridículo y una dependencia brutal de la temperatura.

  # ── 4 (7,5 %) · Un canal con acuerdo circular y escalones. El perímetro
  #    mojado hay que ir sumándolo tramo a tramo.
  - id: exflu2425-ord-4-el-canal-con-acuerdo-circular
    titulo: El canal con un acuerdo circular, y el perímetro que hay que ir sumando
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para el canal de la figura se pide:

      **a)** Calcular el caudal máximo que puede transportar el canal siendo
      de hormigón en bruto con una pendiente de 2 milésimas.

      **b)** Si el canal tuviera que ser reemplazado por un canal semicircular
      de hormigón acabado, transportando el mismo caudal, calcular el radio
      exacto que debería tener.

      La sección de la figura, de abajo arriba: un fondo horizontal de 3 m;
      en el lado izquierdo una pared vertical de 1 m y en el derecho un
      acuerdo circular de $R = 1$ m que sube hasta la misma cota; a esa altura
      la sección se ensancha con un escalón horizontal de 1 m a cada lado, y
      sobre él dos paredes verticales de 0,5 m.
    pide: El caudal máximo de la sección compuesta, y el radio del semicírculo que lo iguala.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Caudal máximo que puede transportar el canal» ¿qué calado hay que
          usar?
        opciones:
          - texto: >-
              El de la coronación, 1,5 m, porque por encima el agua
              desbordaría
            correcta: true
            mensaje: |
              Eso es. El máximo de un canal es el que cabe hasta el borde, sin
              resguardo, porque aquí no se pide diseñar sino saber hasta
              dónde llega. Y el calado de 1,5 m incluye el metro de la parte
              estrecha y el medio metro de la ancha.
          - texto: >-
              El del acuerdo circular, 1 m, porque por encima cambia la
              sección
            mensaje: |
              Que la sección cambie de forma no impide que el agua siga
              subiendo: el escalón ensancha el canal, y esa parte también
              lleva agua. Lo que limita es el borde superior.
          - texto: >-
              La mitad de la altura, por seguridad
            mensaje: |
              Un coeficiente de seguridad a ojo no es un dato del problema.
              El resguardo, cuando lo hay, lo da el enunciado; aquí no lo da,
              así que se llena hasta arriba.

      - tipo: calcular
        titulo: El área mojada
        pregunta: |
          ¿Cuánto vale el área de la sección llena, en m²?
        respuesta:
          tipo: magnitud
          valor: '6.785 m2'
          tolerancia: 0.02
          formato: un área, con su unidad
        distractores:
          - valor: '6 m2'
            mensaje: |
              Has tomado el acuerdo circular como una esquina recta. El cuarto
              de círculo quita $1-\pi/4 = 0{,}215\ \text{m}^{2}$ respecto del
              rectángulo, pero la parte ancha aporta 3, no 2.
          - valor: '3.785 m2'
            mensaje: |
              Te has quedado en la parte estrecha, hasta la cota 1 m. Por
              encima, los escalones ensanchan la sección a 6 m de ancho y
              medio metro de calado: 3 m² más.
        pista: |
          Divídela en dos: hasta la cota 1 m, y de la cota 1 a la 1,5.
        desarrollo: |
          $$
          A_{inf} = 3\cdot 1 + \frac{\pi\cdot 1^{2}}{4} = 3{,}785\ \text{m}^{2}
          $$
          $$
          A_{sup} = (1+3+1+1)\cdot 0{,}5 = 3\ \text{m}^{2}
          $$
          $$
          A = 6{,}785\ \text{m}^{2}
          $$

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Cuánto vale el caudal máximo, en m³/s?
        respuesta:
          tipo: magnitud
          valor: '17.313 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '13.85 m3/s'
            mensaje: |
              Has usado $n = 0{,}012$, el del hormigón **acabado**. El
              apartado a) dice hormigón **en bruto**, que en el cuadro n.º 26
              es $0{,}015$; el acabado es el del apartado b).
          - valor: '9.05 m3/s'
            mensaje: |
              Parece que has calculado solo con la parte estrecha de la
              sección. La parte ancha aporta casi la mitad del área.
        pista: |
          Perímetro mojado tramo a tramo: pared, fondo, arco, escalones y
          paredes superiores. Y $n = 0{,}015$.
        desarrollo: |
          $$
          P = 1+3+\frac{\pi}{2}+1+0{,}5+1+0{,}5 = 8{,}571\ \text{m}
          \qquad
          R_h = \frac{6{,}785}{8{,}571} = 0{,}7917\ \text{m}
          $$
          $$
          Q = \frac{1}{0{,}015}\,6{,}785\cdot 0{,}7917^{2/3}\sqrt{0{,}002}
          = 17{,}313\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: El radio del canal semicircular
        pregunta: |
          ¿Qué radio necesita el canal semicircular de hormigón acabado, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '1.786 m'
          tolerancia: 0.02
          formato: un radio, con su unidad
        distractores:
          - valor: '2.07 m'
            mensaje: |
              Has usado $n = 0{,}015$. El apartado b) cambia a hormigón
              **acabado**, $n = 0{,}012$, y por eso el canal nuevo puede ser
              más estrecho.
          - valor: '2.53 m'
            mensaje: |
              Has tomado el radio hidráulico igual al radio geométrico. En la
              media caña llena, $R_h = R/2$, y esa mitad va elevada a $2/3$.
        pista: |
          En la media caña llena hasta el diámetro, $A = \pi R^{2}/2$,
          $P = \pi R$ y $R_h = R/2$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}012}\,\frac{\pi R^{2}}{2}
          \Bigl(\frac{R}{2}\Bigr)^{2/3}\sqrt{0{,}002}
          = 3{,}6875\,R^{8/3} = 17{,}313
          $$
          $$
          R^{8/3} = 4{,}695
          \;\Longrightarrow\;
          R = 1{,}786\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El calado máximo es 1,5 m, y la sección se calcula en dos
              trozos: la parte estrecha con su acuerdo circular y la ancha de
              los escalones.
          - texto: >-
              El perímetro mojado se suma tramo a tramo, incluyendo el cuarto
              de arco y los dos escalones horizontales.
          - texto: >-
              Con $n = 0{,}015$ y $S = 0{,}002$ el canal lleva 17,313 m³/s, y
              una media caña de hormigón acabado necesita 1,786 m de radio
              para lo mismo.
          - texto: >-
              La superficie libre forma parte del perímetro mojado, porque es
              donde el agua roza con el aire.
            trampa: true
            mensaje: |
              El perímetro mojado es solo el contacto con el **contorno
              sólido**. El rozamiento con el aire es despreciable frente al
              de la pared, y por eso un canal tiene siempre mejor radio
              hidráulico que un conducto cerrado de la misma forma. Meter la
              superficie libre en $P$ es el error clásico del tema.
    resolucion: |
      **a) El caudal máximo.** La sección se llena hasta la coronación, 1,5 m,
      y conviene partirla en dos trozos.

      Hasta la cota 1 m: un rectángulo de $3\times 1$ más el cuarto de círculo
      del acuerdo, $\pi R^{2}/4$ con $R = 1$. Por encima, la sección se
      ensancha a $1+3+1+1 = 6$ m de anchura durante medio metro.

      $$
      A = 3 + \frac{\pi}{4} + 3 = 6{,}785\ \text{m}^{2}
      $$

      El perímetro mojado se va sumando tramo a tramo —y solo cuenta el
      contorno sólido—: la pared izquierda (1), el fondo (3), el cuarto de
      arco ($\pi/2$), el escalón derecho (1), la pared superior derecha (0,5),
      el escalón izquierdo (1) y la pared superior izquierda (0,5):

      $$
      P = 8{,}571\ \text{m}
      \qquad
      R_h = 0{,}7917\ \text{m}
      $$

      Con hormigón en bruto, $n = 0{,}015$, y $S = 0{,}002$:

      $$
      Q = \frac{1}{n}\,A\,R_h^{2/3}\sqrt{S} = 17{,}313\ \text{m}^{3}/\text{s}
      $$

      **b) La media caña equivalente.** Ahora el revestimiento es hormigón
      acabado, $n = 0{,}012$, y la sección es un semicírculo lleno hasta el
      diámetro: $A = \pi R^{2}/2$, $P = \pi R$, $R_h = R/2$.

      $$
      3{,}6875\,R^{8/3} = 17{,}313
      \qquad
      R = 1{,}786\ \text{m}
      $$

      **La comparación que merece la pena hacer.** La sección compuesta tiene
      6,79 m² y 8,57 m de perímetro; la media caña, con 5,01 m² —un 26 %
      menos— y 5,61 m de perímetro, lleva el mismo caudal. Parte de la ventaja
      es el acabado, pero la mayor parte es la **forma**: el semicírculo es la
      sección hidráulicamente óptima, y aquí se ve cuánto vale eso en obra.

  # ── 5 (10 %) · Cinco números adimensionales, uno de ellos ya adimensional
  #    de nacimiento, y la elección de cuál respetar.
  - id: exflu2425-ord-5-la-maniobra-de-la-compuerta-a-escala
    titulo: La maniobra de la compuerta, a escala uno a doce
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se desean estudiar las variaciones de presión producidas durante la
      maniobra de una compuerta que se colocará en la tubería principal
      presurizada de una presa. Se ha deducido que el cambio de presión
      $\Delta p$ depende de la velocidad del fluido en el conducto $v$, la
      densidad del fluido $\rho$, la viscosidad del fluido $\mu$, el diámetro
      del tubo $D$, el grado de apertura de la compuerta $\theta$, la
      aceleración de la gravedad $g$ y el tiempo de cierre de la válvula $t$.
      El grado de apertura de la compuerta se representa como porcentaje de la
      apertura total.

      **a)** Determinar las variables adimensionales con las variables
      repetidas $v$, $\rho$ y $D$.

      **b)** ¿Se puede conseguir una semejanza dinámica absoluta con un modelo
      a escala reducida si en los ensayos del modelo se utiliza agua de las
      mismas propiedades?

      **c)** La tubería construida para las pruebas tiene 25 cm, siendo el
      modelo 12 veces menor que el prototipo. Calcular el cambio de presión
      que se produciría en el prototipo si la diferencia de presión medida en
      el modelo fuera de 3,6 bar durante una maniobra de 8 segundos.

      **d)** En las condiciones del apartado anterior, ¿cuánto tiempo deberá
      realizarse la maniobra de cierre en el prototipo si se desea provocar el
      cambio de presión mencionado? ¿Y cuál sería la relación entre caudales
      de modelo y prototipo?
    pide: Los cinco parámetros adimensionales, y el paso del modelo al prototipo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Son ocho variables y tres dimensiones básicas. ¿Cuántos números
          adimensionales salen?
        opciones:
          - texto: >-
              Cinco, y uno de ellos es el propio grado de apertura, que ya es
              adimensional de nacimiento
            correcta: true
            mensaje: |
              Eso es. Buckingham da $8-3 = 5$, y conviene fijarse en que
              $\theta$ es un porcentaje: ya no tiene dimensiones, así que
              **es** uno de los cinco sin que haya que construirlo. Es el
              detalle que más se falla del apartado a).
          - texto: >-
              Cuatro, porque el grado de apertura no cuenta como variable
            mensaje: |
              Sí cuenta: es una de las ocho de las que depende el fenómeno, y
              tiene que aparecer en la respuesta. Lo que ocurre es que
              aparece tal cual.
          - texto: >-
              Ocho, uno por variable
            mensaje: |
              El teorema de Buckingham reduce: salen $n-k$ grupos, no $n$.
              Ocho variables menos tres dimensiones independientes, cinco
              números.

      - tipo: calcular
        titulo: La variación de presión en el prototipo
        pregunta: |
          Respetando el número que contiene la viscosidad, ¿qué variación de
          presión sufre el prototipo, en bar?
        respuesta:
          tipo: magnitud
          valor: '0.025 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.6 bar'
            mensaje: |
              Esa es la del modelo. Lo que se conserva es
              $\Delta p/(\rho v^{2})$, no $\Delta p$; con la misma agua, la
              presión escala como el cuadrado de la velocidad.
          - valor: '0.3 bar'
            mensaje: |
              Has dividido por 12 en vez de por $12^{2}$. La velocidad del
              prototipo es doce veces menor y la presión va con su
              **cuadrado**.
          - valor: '43.2 bar'
            mensaje: |
              Lo has puesto al revés: has multiplicado por 12. El prototipo es
              el grande, así que con el Reynolds conservado va **más
              despacio**, y sufre menos.
        pista: |
          Con la misma agua, igualar $\mu/(\rho D v)$ obliga a
          $v_p D_p = v_m D_m$.
        desarrollo: |
          $$
          \pi_3 = \frac{\mu}{\rho D v}
          \;\Longrightarrow\;
          v_p = \frac{v_m}{12}
          $$
          $$
          \pi_1 = \frac{\Delta p}{\rho v^{2}}
          \;\Longrightarrow\;
          \Delta p_p = \frac{3{,}6}{12^{2}} = 0{,}025\ \text{bar}
          $$

      - tipo: calcular
        titulo: El tiempo de la maniobra en el prototipo
        pregunta: |
          ¿Cuánto debe durar el cierre en el prototipo, en segundos?
        respuesta:
          tipo: magnitud
          valor: '1152 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '96 s'
            mensaje: |
              Has aplicado solo la escala geométrica. El tiempo lleva
              **dos** factores 12: uno porque el prototipo es doce veces más
              largo y otro porque el agua va doce veces más despacio.
          - valor: '0.667 s'
            mensaje: |
              Lo has puesto al revés. La maniobra del prototipo es mucho más
              lenta que la del modelo, no más rápida: casi veinte minutos
              frente a ocho segundos.
        pista: |
          El número que contiene el tiempo es $tv/D$.
        desarrollo: |
          $$
          \frac{t_p v_p}{D_p} = \frac{t_m v_m}{D_m}
          \;\Longrightarrow\;
          t_p = 8\cdot 12\cdot 12 = 1152\ \text{s}
          $$

      - tipo: calcular
        titulo: La relación de caudales
        pregunta: |
          ¿Cuánto vale $Q_m/Q_p$?
        respuesta:
          tipo: numero
          valor: '0.0833'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.00694'
            mensaje: |
              Has usado solo la relación de áreas, $1/144$. El caudal es
              velocidad por área, y la velocidad del modelo es doce veces
              **mayor**, así que se compensa un factor 12.
          - valor: '12'
            mensaje: |
              Ese es el cociente de velocidades, no el de caudales. Falta
              multiplicar por la relación de áreas, que va con el cuadrado de
              la escala.
        pista: |
          $Q = vA$, con $A \propto D^{2}$.
        desarrollo: |
          $$
          \frac{Q_m}{Q_p} = \frac{v_m}{v_p}\Bigl(\frac{D_m}{D_p}\Bigr)^{2}
          = 12\cdot\frac{1}{144} = \frac{1}{12} = 0{,}0833
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El $\pi_3$ pide $v_p D_p = v_m D_m$, es decir que el prototipo
              vaya doce veces más despacio.
          - texto: >-
              El $\pi_4$, $gD/v^{2}$, pide en cambio
              $v_p = v_m\sqrt{12}$, porque la gravedad no se puede escalar.
          - texto: >-
              Las dos condiciones se contradicen para cualquier escala
              distinta de 1, así que la semejanza dinámica absoluta es
              imposible.
          - texto: >-
              Podría conseguirse usando en el modelo un líquido más viscoso
              que el agua.
            trampa: true
            mensaje: |
              Podría, y por eso este apartado dice explícitamente **«con agua
              de las mismas propiedades»**. Cambiar de fluido es exactamente
              la salida que se le prohíbe al problema: liberando $\mu$ y
              $\rho$ vuelve a haber grados de libertad. La conclusión
              «imposible» lo es **bajo la hipótesis del enunciado**, no en
              abstracto, y decirlo así es la mitad de la nota.
    resolucion: |
      **a) Los cinco números.** Ocho variables y tres dimensiones dan cinco
      grupos. Con $v$, $\rho$ y $D$ como repetidas:

      $$
      \pi_1 = \frac{\Delta p}{\rho v^{2}}
      \qquad
      \pi_2 = \theta
      \qquad
      \pi_3 = \frac{\mu}{\rho D v}
      \qquad
      \pi_4 = \frac{gD}{v^{2}}
      \qquad
      \pi_5 = \frac{t\,v}{D}
      $$

      El $\pi_2$ merece un comentario: el grado de apertura es un
      **porcentaje**, así que ya es adimensional y entra en la lista tal cual,
      sin construir nada. El $\pi_3$ es el inverso del Reynolds, el $\pi_4$ el
      inverso del cuadrado del Froude, y el $\pi_5$ es el número de Strouhal
      del cierre.

      **b) La semejanza absoluta.** Con la misma agua, $\rho$ y $\mu$ son
      iguales, y entonces:

      - $\pi_3$ exige $v_p D_p = v_m D_m$, es decir $v_p = v_m/12$.
      - $\pi_4$ exige $v_p^{2}/D_p = v_m^{2}/D_m$, es decir
        $v_p = v_m\sqrt{12}$.

      Las dos no pueden cumplirse a la vez salvo con escala 1. **Imposible**,
      y conviene decir con qué hipótesis: con **este** fluido.

      **c) La presión.** Respetando $\pi_3$, el prototipo va doce veces más
      despacio, y como la presión escala con $\rho v^{2}$:

      $$
      \Delta p_p = \frac{3{,}6}{144} = 0{,}025\ \text{bar}
      $$

      **d) El tiempo y los caudales.** Con $\pi_5$:

      $$
      t_p = t_m\,\frac{D_p}{D_m}\,\frac{v_m}{v_p} = 8\cdot 12\cdot 12
      = 1152\ \text{s}
      \qquad
      \frac{Q_m}{Q_p} = 12\cdot\frac{1}{144} = 0{,}0833
      $$

      **Y lo que dice el resultado.** Ocho segundos en el laboratorio son
      **diecinueve minutos** en la presa. Esa es la trampa de los ensayos de
      maniobra: el modelo no solo es más pequeño, es mucho más rápido, y
      cualquier conclusión sobre «cerrar despacio» hay que traducirla con el
      $\pi_5$ antes de escribirla en el manual de explotación.

  # ── 6 (15 %) · Una central de tres turbinas en paralelo. El salto neto,
  #    y cuánto se lleva realmente el rozamiento.
  - id: exflu2425-ord-6-la-central-de-tres-turbinas
    titulo: La central de tres turbinas, y lo poco que se lleva el rozamiento
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Una central hidroeléctrica se alimenta de un embalse a 860 metros de
      altitud. En la central existen tres turbinas iguales, en paralelo, que
      turbinan en conjunto un total de $6\ \text{m}^{3}/\text{s}$. Tras
      turbinarla, el agua se vierte a otro embalse situado a 520 metros. El
      tubo principal que llega a la central (tubo 1) es de **hormigón**, tiene
      1,2 km y su diámetro es de 2400 mm, siendo $k = 20$ el factor de paso
      del conjunto de elementos que se encuentran en este tubo principal. Los
      tubos que alimentan las turbinas son de **acero comercial**, cada uno de
      ellos mide 28 metros de longitud y tiene 1000 mm de diámetro.

      Calcular la potencia hidráulica de la central, usando la expresión de
      Darcy-Weisbach.
    pide: La potencia hidráulica de la central.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres tubos de las turbinas están **en paralelo**. ¿Qué caudal
          lleva cada uno y qué pérdida cuenta?
        opciones:
          - texto: >-
              Cada uno lleva 2 m³/s, y la pérdida que se descuenta es la de
              **uno solo** de los tres
            correcta: true
            mensaje: |
              Eso es. En un paralelo el caudal se reparte pero la pérdida no
              se suma: los tres ramales tienen los mismos extremos, así que
              todos pierden lo mismo y esa es la pérdida del conjunto. Sumar
              las tres es el error clásico.
          - texto: >-
              Cada uno lleva 6 m³/s, porque son iguales
            mensaje: |
              Si cada uno llevara 6, la central turbinaría 18. El enunciado
              dice que **en conjunto** turbinan 6, así que van a 2 cada uno.
          - texto: >-
              Cada uno lleva 2 m³/s y hay que sumar las tres pérdidas
            mensaje: |
              Solo se sumarían si estuvieran en serie, uno detrás de otro. En
              paralelo, la pérdida del grupo es la de un ramal.

      - tipo: calcular
        titulo: La pérdida del tubo principal
        pregunta: |
          ¿Cuánto pierde el tubo 1, contando el rozamiento y el $k = 20$, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '2.55 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.76 m'
            mensaje: |
              Te has dejado el $k = 20$. Los elementos del tubo principal
              pierden 1,79 m, más del doble que los 1,2 km de tubería.
          - valor: '1.79 m'
            mensaje: |
              Esa es solo la parte de los elementos. Falta el rozamiento del
              kilómetro y pico de hormigón, 0,76 m más.
        pista: |
          $v = Q/A$ con $D = 2{,}4$ m, y hormigón en el cuadro de rugosidades
          es $\varepsilon = 0{,}12$ cm.
        desarrollo: |
          $$
          A = 4{,}524\ \text{m}^{2}
          \qquad
          v = 1{,}326\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}0897\ \text{m}
          $$
          $$
          \frac{\varepsilon}{D} = 5\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}01686
          $$
          $$
          h_1 = \Bigl(0{,}01686\,\frac{1200}{2{,}4} + 20\Bigr)\cdot 0{,}0897
          = 0{,}757+1{,}795 = 2{,}55\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia hidráulica
        pregunta: |
          ¿Cuánta potencia hidráulica da la central, en MW?
        respuesta:
          tipo: magnitud
          valor: '19.836 MW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '59.51 MW'
            mensaje: |
              Has puesto 6 m³/s por turbina. El enunciado dice que las tres
              turbinan **en conjunto** 6 m³/s, así que van a 2 cada una y la
              central mueve 6, no 18.
          - valor: '6.612 MW'
            mensaje: |
              Parece que has calculado la potencia de **una** turbina. La
              pregunta es la de la central, con los 6 m³/s completos.
        pista: |
          $P = \gamma\,Q\,H_{neto}$, con el salto bruto menos las pérdidas de
          los dos tramos.
        desarrollo: |
          Cada tubo de turbina lleva $2\ \text{m}^{3}/\text{s}$, con
          $v = 2{,}546$ m/s, acero comercial
          ($\varepsilon = 0{,}006$ cm) y $f = 0{,}01183$:

          $$
          h_2 = 0{,}01183\,\frac{28}{1}\cdot 0{,}3308 = 0{,}110\ \text{m}
          $$
          $$
          H_{neto} = (860-520) - 2{,}55 - 0{,}11 = 337{,}34\ \text{m}
          $$
          $$
          P = 9800\cdot 6\cdot 337{,}34 = 19{,}836\ \text{MW}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El salto bruto es la diferencia entre los dos embalses, 340 m.
          - texto: >-
              El tubo principal pierde 2,55 m, de los cuales 1,79 son los
              elementos con $k = 20$ y solo 0,76 el kilómetro de tubería.
          - texto: >-
              Los tres tubos de turbina están en paralelo, así que se descuenta
              la pérdida de uno solo, 0,11 m.
          - texto: >-
              Como las pérdidas apenas llegan al 1 % del salto, se pueden
              despreciar sin consecuencias.
            trampa: true
            mensaje: |
              El 0,8 % de 340 metros son 2,66 metros de salto, y a 6 m³/s eso
              son **156 kW** que la central no produce: unos 1,3 GWh al año.
              En una instalación grande los porcentajes pequeños son dinero
              grande, y por eso el enunciado exige Darcy-Weisbach en vez de
              conformarse con el salto bruto.
    resolucion: |
      **La estructura del cálculo.** La potencia hidráulica es
      $P = \gamma\,Q\,H_{neto}$, y todo el trabajo está en construir $H_{neto}$:
      el salto bruto menos lo que se pierde por el camino.

      **El salto bruto** es la diferencia entre los dos embalses:
      $860-520 = 340$ m.

      **El tubo principal.** Con $D = 2{,}4$ m y $Q = 6\ \text{m}^{3}/\text{s}$
      sale $v = 1{,}326$ m/s y $v^{2}/2g = 0{,}0897$ m. El hormigón tiene
      $\varepsilon = 0{,}12$ cm, así que $\varepsilon/D = 5\cdot 10^{-4}$ y
      $f = 0{,}0169$:

      $$
      h_1 = \Bigl(f\,\frac{L}{D} + k\Bigr)\frac{v^{2}}{2g}
      = (8{,}43+20)\cdot 0{,}0897 = 2{,}55\ \text{m}
      $$

      Conviene mirar el reparto: **de esos 2,55 m, 1,79 los ponen los
      elementos** y solo 0,76 el kilómetro y pico de tubería. Un $k = 20$ pesa
      más que 1.200 metros de hormigón de 2,4 m de diámetro.

      **Los tubos de las turbinas.** Están en paralelo, así que cada uno lleva
      $2\ \text{m}^{3}/\text{s}$ y la pérdida del grupo es la de **uno**:
      $v = 2{,}546$ m/s, acero comercial con
      $\varepsilon = 0{,}006$ cm, $f = 0{,}0118$ y $h_2 = 0{,}11$ m.

      **La potencia.**

      $$
      H_{neto} = 340-2{,}55-0{,}11 = 337{,}34\ \text{m}
      $$
      $$
      P = 9800\cdot 6\cdot 337{,}34 = 19{,}836\ \text{MW}
      $$

      **Lo que hay que llevarse.** Las pérdidas se comen el **0,8 %** del
      salto, un número que en un ejercicio de clase invita a despreciarlas. En
      dinero son 156 kW funcionando todo el año, y en decisiones de proyecto
      son las que justifican poner un tubo de 2,4 m en vez de uno de 2. La
      pregunta nunca es si el porcentaje es pequeño, sino cuánto vale lo que
      multiplica.

  # ── 7 (10 %) · El flyboard. Cantidad de movimiento con dos chorros, y una
  #    trampa en el ángulo: los 10º son entre los dos.
  - id: exflu2425-ord-7-el-flyboard-y-sus-dos-chorros
    titulo: El flyboard, y el ángulo que hay que partir por la mitad
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se pretende diseñar un flyboard con una bomba flotando sobre el agua del
      mar ($s_{mar} = 1{,}05$), que proporcione el caudal y la presión
      necesarios para el funcionamiento del sistema.

      El caudal del agua de mar se introducirá por la tubería conectada a la
      sección A y saldrá por las secciones B y C, que forman un ángulo
      $\theta$ de 10º, generando el impulso ascendente necesario. El sistema
      es simétrico respecto al eje central.

      Gracias a la bomba, cuando el sistema y el usuario están a una altura de
      $z_A = 10$ m sobre el mar, se han medido en A un caudal de entrada de
      $Q = 28{,}4$ l/s y una presión de 4,40 mcl ($s_{liquido} = 0{,}5$).

      Sabiendo que el flyboard y su material de uso pesan 45 kg y que el peso
      del fluido en el interior del flyboard es despreciable, para un
      funcionamiento correcto del sistema, ¿cuál es el peso máximo del
      usuario?

      Datos: $D_A = 42$ mm; $D_B = D_C = 30$ mm; $C_{c,A} = 1$;
      $C_{c,B} = C_{c,C} = 0{,}98$; $C_{v,A} = 1$;
      $C_{v,B} = C_{v,C} = 0{,}9545$.
    pide: El peso máximo del usuario que el empuje de los dos chorros puede sostener.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que B y C «forman un ángulo $\theta$ de 10º». ¿Con
          qué ángulo entra cada chorro en la ecuación?
        opciones:
          - texto: >-
              Con 5º respecto de la vertical, porque los 10º son el ángulo
              **entre los dos** chorros y el sistema es simétrico
            correcta: true
            mensaje: |
              Eso es, y es donde se pierde el ejercicio. «Las secciones B y C
              forman un ángulo de 10º» describe la abertura entre ellas; por
              simetría, cada una se separa 5º del eje. Tomar 10º para cada uno
              cambia el resultado en casi un kilo.
          - texto: >-
              Con 10º cada uno, porque así lo dice el enunciado
            mensaje: |
              El enunciado dice que las dos secciones **forman** un ángulo de
              10º **entre sí**, no que cada una forme 10º con la vertical. Y
              el sistema es simétrico, así que ese ángulo se reparte.
          - texto: >-
              Con 80º, el complementario
            mensaje: |
              El ángulo está medido respecto del eje del sistema, que es
              vertical. No hay ningún complementario que tomar.

      - tipo: calcular
        titulo: La velocidad de entrada
        pregunta: |
          ¿A qué velocidad entra el agua por A, en m/s?
        respuesta:
          tipo: magnitud
          valor: '20.5 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '40.2 m/s'
            mensaje: |
              Parece que has usado el diámetro de las boquillas, 30 mm, en
              vez del de la tubería de entrada, 42 mm.
          - valor: '10.25 m/s'
            mensaje: |
              Has repartido el caudal por la mitad en la entrada. El caudal se
              parte en B y C, pero entra entero por A.
        pista: |
          $C_{c,A} = 1$, así que la sección efectiva es la geométrica.
        desarrollo: |
          $$
          A_A = \frac{\pi\,0{,}042^{2}}{4} = 1{,}3854\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          v_A = \frac{0{,}0284}{1{,}3854\cdot 10^{-3}} = 20{,}50\ \text{m/s}
          $$

          Y en las boquillas, con la mitad del caudal y la sección contraída
          $0{,}98\,A_B$, sale exactamente la misma velocidad, $20{,}50$ m/s.

      - tipo: calcular
        titulo: El empuje total
        pregunta: |
          ¿Cuánto vale la fuerza ascendente que sostiene al conjunto, en N?
        respuesta:
          tipo: numero
          valor: '1250.1'
          tolerancia: 5
          formato: un número en newton
        distractores:
          - valor: '1243.1'
            mensaje: |
              Has tomado 10º para cada chorro en vez de 5º. La diferencia
              parece minúscula —siete newton— pero se los come entera el
              usuario: 0,7 kg de los 82,56.
          - valor: '641.1'
            mensaje: |
              Te has quedado solo con la cantidad de movimiento de entrada.
              El chorro que **sale** hacia abajo aporta casi lo mismo otra
              vez: es un cohete, no un tope.
        pista: |
          Cantidad de movimiento entrante más saliente, más la fuerza de
          presión sobre la sección A.
        desarrollo: |
          $$
          \rho Q = 1050\cdot 0{,}0284 = 29{,}82\ \text{kg/s}
          \qquad
          p_A = 4{,}40\cdot 0{,}5\cdot 9800 = 21560\ \text{Pa}
          $$
          $$
          F = \rho Q\,(v_A + v_B\cos 5^{\circ}) + p_A A_A
          $$
          $$
          F = 29{,}82\,(20{,}50+20{,}42) + 29{,}87 = 1250{,}1\ \text{N}
          $$

      - tipo: calcular
        titulo: El peso máximo del usuario
        pregunta: |
          ¿Cuánto puede pesar como máximo el usuario, en kg?
        respuesta:
          tipo: numero
          valor: '82.56'
          tolerancia: 0.5
          formato: un número en kilogramos
        distractores:
          - valor: '127.56'
            mensaje: |
              Te has dejado los 45 kg del flyboard y su material. El empuje
              sostiene al conjunto, no solo a la persona.
          - valor: '79.51'
            mensaje: |
              Te has dejado el término de presión en A, que aporta 30 N, es
              decir tres kilos de usuario.
        pista: |
          El empuje sostiene el peso del flyboard más el del usuario.
        desarrollo: |
          $$
          W = \frac{1250{,}1}{9{,}8} - 45 = 127{,}56-45 = 82{,}56\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua entra por A a 20,50 m/s y sale por las dos boquillas a
              la misma velocidad, porque la contracción del 0,98 compensa
              justo el cambio de sección.
          - texto: >-
              Los 10º del enunciado son entre las dos boquillas, así que cada
              chorro forma 5º con la vertical.
          - texto: >-
              El empuje es la cantidad de movimiento de entrada más la de
              salida, más la presión sobre A: 1.250 N en total.
          - texto: >-
              La altura de 10 m sobre el mar aparece en la ecuación de la
              cantidad de movimiento como término de energía potencial.
            trampa: true
            mensaje: |
              La cantidad de movimiento no tiene término de energía
              potencial: es un balance de **fuerzas**, y la única fuerza
              vertical del fluido sería su peso, que el enunciado manda
              despreciar. Los 10 m explican por qué la bomba tiene que dar
              esa presión, pero no entran en el balance del flyboard.
    resolucion: |
      **La idea.** El flyboard se sostiene porque el agua que entra por abajo
      sale hacia abajo con más velocidad todavía: es un cohete de agua. La
      fuerza es la de la cantidad de movimiento, más la que la presión hace
      sobre la sección de entrada.

      **Las velocidades.** Con $C_{c,A} = 1$:

      $$
      v_A = \frac{0{,}0284}{1{,}3854\cdot 10^{-3}} = 20{,}50\ \text{m/s}
      $$

      Y en cada boquilla, con la mitad del caudal sobre la sección contraída
      $0{,}98\,\pi\,0{,}03^{2}/4$, sale **la misma** velocidad, 20,50 m/s. No
      es casualidad: los datos están elegidos para que las dos formas de
      calcularla —por continuidad y por Bernoulli con $C_v = 0{,}9545$—
      coincidan.

      **El ángulo, que es donde se cae el ejercicio.** El enunciado dice que
      las secciones B y C **forman un ángulo de 10º**: es la abertura entre
      las dos. Con el sistema simétrico, cada chorro sale a **5º** de la
      vertical. Tomar 10º para cada uno da 81,85 kg en vez de 82,56.

      **El empuje.**

      $$
      \rho Q = 29{,}82\ \text{kg/s}
      \qquad
      p_A A_A = 21560\cdot 1{,}3854\cdot 10^{-3} = 29{,}87\ \text{N}
      $$
      $$
      F = 29{,}82\,(20{,}50 + 20{,}50\cos 5^{\circ}) + 29{,}87 = 1250{,}1\ \text{N}
      $$

      **El usuario.**

      $$
      W = \frac{1250{,}1}{9{,}8}-45 = 82{,}56\ \text{kg}
      $$

      **Y el orden de magnitud, que es lo que hace memorable el problema.**
      Veintiocho litros por segundo a veinte metros por segundo levantan
      ciento veintisiete kilos. La bomba tiene que subir esa agua diez metros
      y darle esa velocidad, y ahí es donde se ve por qué un flyboard necesita
      una moto de agua entera detrás.

  # ── 8 (10 %) · El diafragma y su líquido manométrico. Dos opciones y el
  #    empate exacto entre el agua y el tetracloruro.
  - id: exflu2425-ord-8-el-diafragma-y-su-liquido-manometrico
    titulo: El diafragma, y qué líquido manométrico mide las variaciones más finas
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el razonamiento pero no el desarrollo.
    nivel: examen
    enunciado: |
      En una instalación hidráulica por la que circula glicerina ($s_{glic}$)
      se estudia un diafragma, similar al empleado en las prácticas de
      laboratorio. Dicho diafragma, colocado en un conducto de sección $A_1$,
      tiene un orificio de sección $A_2$. Se ha conectado aguas arriba y aguas
      abajo del diafragma un manómetro de tipo U con un líquido manométrico de
      densidad relativa $s_m$, que ofrece una lectura $R$.

      **a)** Obtener la expresión del caudal medido por el diafragma en
      función de las variables dadas en el enunciado y de los distintos
      coeficientes de velocidad, contracción y/o descarga. Existen dos
      opciones posibles, en función del fluido manométrico seleccionado;
      cualquiera de ellas es válida.

      **b)** Para la opción seleccionada en el apartado a), elegir el líquido
      manométrico más adecuado para medir ligeras variaciones de caudal. Se
      dispone de diferentes fluidos: etanol, agua, tetracloruro de carbono y
      mercurio.

      Datos: $\rho_{eta} = 0{,}81$, $\rho_{agua} = 1{,}0$,
      $\rho_{CCl_4} = 1{,}52$, $\rho_{merc} = 13{,}60$ y
      $\rho_{glic} = 1{,}26\ \text{g/cm}^{3}$.
    pide: La expresión del caudal y el líquido manométrico más sensible.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace que un manómetro diferencial sea más sensible a
          variaciones pequeñas de caudal?
        opciones:
          - texto: >-
              Que su densidad se parezca lo más posible a la del fluido que
              circula, porque entonces la misma diferencia de presión mueve
              una columna más larga
            correcta: true
            mensaje: |
              Eso es. La lectura vale
              $R = (\Delta p/\gamma_0)\,/\,\lvert s_m/s_0 - 1\rvert$: cuanto
              más pequeño sea ese factor, más larga es la columna para la
              misma presión, y mejor se aprecian las variaciones.
          - texto: >-
              Que sea lo más denso posible, para que la columna sea estable
            mensaje: |
              Eso es lo contrario. El mercurio da lecturas cortísimas
              —factor 9,8— y por eso se usa cuando hay que medir presiones
              grandes en poco espacio, no cuando hay que apreciar cambios
              finos.
          - texto: >-
              Que sea inmiscible con la glicerina
            mensaje: |
              Inmiscible tiene que ser en cualquier caso, o el manómetro no
              funciona. Eso es una condición de partida, no un criterio de
              sensibilidad.

      - tipo: calcular
        titulo: El factor de sensibilidad del agua
        pregunta: |
          Con agua como líquido manométrico y glicerina circulando, ¿cuánto
          vale $\lvert 1 - s_m/s_0\rvert$?
        respuesta:
          tipo: numero
          valor: '0.206'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '0.357'
            mensaje: |
              Ese es el del **etanol**, $1-0{,}81/1{,}26$. Es mayor, así que
              el etanol da lecturas más cortas: es peor para apreciar
              variaciones finas.
          - valor: '9.794'
            mensaje: |
              Ese es el del **mercurio**. Cuarenta y siete veces peor que el
              agua para este fluido: la misma variación de caudal movería la
              columna cuarenta y siete veces menos.
          - valor: '0.26'
            mensaje: |
              Parece que has hecho $s_0 - s_m = 1{,}26-1$ en vez del cociente.
              Lo que aparece en la fórmula es la **relación** de densidades,
              no su diferencia.
        pista: |
          $s_{glic} = 1{,}26$ y $s_{agua} = 1$.
        desarrollo: |
          $$
          \Bigl\lvert 1-\frac{1}{1{,}26}\Bigr\rvert = 0{,}2063
          $$

          Y para el tetracloruro, por el otro lado:

          $$
          \Bigl\lvert\frac{1{,}52}{1{,}26}-1\Bigr\rvert = 0{,}2063
          $$

          Exactamente el mismo: los dos empatan.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El caudal vale
              $Q = C_d A_2\sqrt{2gR\,\lvert s_m/s_0-1\rvert\,/\,[1-(A_2/A_1)^{2}]}$,
              con el signo del corchete según el líquido sea más pesado o más
              ligero que la glicerina.
          - texto: >-
              Si se elige un líquido **más ligero** que la glicerina, el
              manómetro va en U invertida y el mejor de la lista es el agua.
          - texto: >-
              Si se elige uno **más pesado**, va en U normal y el mejor es el
              tetracloruro de carbono, con exactamente el mismo factor que el
              agua.
          - texto: >-
              El mercurio, por ser el más denso, es el que da la lectura más
              larga y por tanto el más preciso.
            trampa: true
            mensaje: |
              Al revés, y es el error que este ejercicio existe para corregir.
              Cuanto más se aleja la densidad del manométrico de la del fluido
              que circula, **más corta** es la columna para la misma presión.
              El mercurio es el peor de los cuatro para apreciar variaciones
              finas; es el mejor cuando lo que sobra es presión y falta
              espacio.
    resolucion: |
      **a) La expresión del caudal.** Un diafragma es un medidor de
      obstrucción como cualquier otro: la diferencia de presiones que crea se
      traduce en caudal por Bernoulli y continuidad, y el coeficiente de
      descarga $C_d = C_v C_c$ corrige a la realidad.

      $$
      Q = C_d\,A_2\,\sqrt{\frac{2g\,\Delta h}
      {1-\bigl(A_2/A_1\bigr)^{2}}}
      $$

      Lo que cambia con el líquido manométrico es cómo se traduce la lectura
      $R$ en $\Delta h$, medido en metros de glicerina:

      | | disposición | $\Delta h$ |
      |---|---|---|
      | manométrico **más pesado** | U normal | $R\,(s_m/s_0 - 1)$ |
      | manométrico **más ligero** | U invertida | $R\,(1 - s_m/s_0)$ |

      Las dos opciones son válidas, como dice el enunciado.

      **b) El líquido más adecuado.** Para apreciar variaciones pequeñas de
      caudal interesa que la columna se mueva mucho, es decir que el factor
      $\lvert s_m/s_0 - 1\rvert$ sea **lo más pequeño posible**:

      | líquido | $s_m$ | factor |
      |---|---|---|
      | etanol | 0,81 | 0,357 |
      | **agua** | 1,00 | **0,206** |
      | **tetracloruro** | 1,52 | **0,206** |
      | mercurio | 13,60 | 9,794 |

      Entre los más ligeros gana el **agua**; entre los más pesados, el
      **tetracloruro de carbono**. Y hay una coincidencia que merece la pena
      señalar: los dos dan **exactamente** el mismo factor, 0,206, porque
      $1{,}26-1 = 1{,}52-1{,}26$. Las dos opciones del apartado a) son
      igualmente buenas, no solo igualmente válidas.

      **Y el mercurio, que es la trampa.** Es el líquido manométrico por
      antonomasia y aquí es el peor de los cuatro: su factor es 47 veces mayor
      que el del agua, así que la misma variación de caudal movería la columna
      47 veces menos. El mercurio se usa cuando la presión es grande y el
      espacio poco; para medir variaciones finas se busca justo lo contrario.
