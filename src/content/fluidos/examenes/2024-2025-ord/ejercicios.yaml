            <desc id="ex2425o1-prismas-d">Los dos cuerpos en su depósito, con el triángulo dibujado con el ángulo que sale del apartado f), 36,4 grados. Sobre cada cara mojada, las flechas de presión, perpendiculares a la cara y proporcionales a la profundidad: cero en la lámina y gamma por R a la profundidad R. En la cara curva son radiales y apuntan a A, el centro del arco, así que su resultante pasa por A. En la cara vertical del cuarto de cilindro el agua del hueco empuja hacia la izquierda con un triángulo que llega a gamma por R abajo; en la cara vertical del triángulo empuja hacia la derecha con otro igual; en la hipotenusa las flechas son perpendiculares a ella y crecen hacia abajo. El cuarto de círculo y el triángulo van sombreados: son los volúmenes que dan las componentes verticales, hacia arriba. Las resultantes de las caras verticales están a dos tercios de R de profundidad. Arriba, el tope empuja hacia abajo en A y en B: RA y RB.</desc>
