      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero: la expresión del caudal que mide
          este diafragma, desde Bernoulli hasta dejarla en función de $A_1$,
          $A_2$, la lectura $R$, las dos densidades y los coeficientes.

          Es la misma deducción que la del venturímetro, que cae en la
          ordinaria de 2021-2022 y en la de 2022-2023: los dos son aparatos
          deprimógenos, y cambian los coeficientes, no el camino. El vertedero
          no entra, aunque también mida un caudal: las diapositivas 22 a 25
          del tema 13 lo deducen de otra manera, integrando la velocidad por
          franjas de altura, sin manómetro y sin continuidad entre dos
          secciones.
        rubrica: caudal-de-un-deprimogeno
        veredicto: |
          Si tu folio tiene los seis, tienes esta deducción para el
          venturímetro y para el diafragma. Si te falta el tercero —la
          traducción de la lectura—, no sigas: es el que arrastra a todos los
          números de los apartados siguientes.

    resolucion: |
      **a) La expresión del caudal.** Un diafragma es un medidor de
      obstrucción como cualquier otro: la diferencia de presiones que crea se
      traduce en caudal por Bernoulli y continuidad, y el coeficiente de
      descarga $C_d = C_v C_c$ corrige a la realidad.

      $$
      Q = C_d\,A_2\,\sqrt{\frac{2g\,\Delta h}
      {1-\bigl(A_2/A_1\bigr)^{2}}}
      $$

      Lo que cambia con el líquido manométrico es cómo se traduce la lectura
      $R$ en $\Delta h$, medido en metros de glicerina:

      | | disposición | $\Delta h$ |
      |---|---|---|
      | manométrico **más pesado** | U normal | $R\,(s_m/s_0 - 1)$ |
      | manométrico **más ligero** | U invertida | $R\,(1 - s_m/s_0)$ |

      Las dos opciones son válidas, como dice el enunciado.

      **b) El líquido más adecuado.** Para apreciar variaciones pequeñas de
      caudal interesa que la columna se mueva mucho, es decir que el factor
      $\lvert s_m/s_0 - 1\rvert$ sea **lo más pequeño posible**:

      | líquido | $s_m$ | factor |
      |---|---|---|
      | etanol | 0,81 | 0,357 |
      | **agua** | 1,00 | **0,206** |
      | **tetracloruro** | 1,52 | **0,206** |
      | mercurio | 13,60 | 9,794 |

      Entre los más ligeros gana el **agua**; entre los más pesados, el
      **tetracloruro de carbono**. Y hay una coincidencia que merece la pena
      señalar: los dos dan **exactamente** el mismo factor, 0,206, porque
      $1{,}26-1 = 1{,}52-1{,}26$. Las dos opciones del apartado a) son
      igualmente buenas, no solo igualmente válidas.

      **Y el mercurio, que es la trampa.** Es el líquido manométrico por
      antonomasia y aquí es el peor de los cuatro: su factor es 47 veces mayor
      que el del agua, así que la misma variación de caudal movería la columna
      47 veces menos. El mercurio se usa cuando la presión es grande y el
      espacio poco; para medir variaciones finas se busca justo lo contrario.

  # ── 9 (15 %) · La bomba IN-100-200.bF sobre su anexo de curvas. Rescatado el
  #    30 de septiembre de 2026 con las lecturas del anexo redibujadas: los
  #    cinco apartados llegan a lo impreso.
  - id: exflu2425-ord-9-la-bomba-leida-en-su-anexo-de-curvas
    titulo: La bomba leída en su anexo de curvas, del punto de funcionamiento al coste diario
    fuente: >-
      Ejercicio 9 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se dispone de una instalación de bombeo con agua que comunica dos
      depósitos abiertos, elevándola una diferencia cotas positiva de
      $\Delta z = 32$ m. Dicha instalación está equipada con una bomba que gira
      a 2960 r.p.m., modelo IN-100-200.bF y rodete de 214 mm de diámetro.
      Todas las tuberías son de fundición, siendo la tubería de aspiración de
      15 m de longitud y diámetro 200 mm, mientras que la tubería de impulsión
      tiene una longitud de 150 m y un diámetro de 150 mm. En la impulsión se
      dispone de una válvula de regulación.

      Para el monitorizado de la instalación se dispone de la siguiente
      instrumentación:

      - Un manómetro Bourdon de presión absoluta en la aspiración,
      - Un manómetro de fuelle en la impulsión, y
      - Un caudalímetro electromagnético, también en la impulsión, que
        suministra una señal eléctrica en mA, dando valores entre 4 y 20 mA;
        esta señal es proporcional al fondo de escala del equipo que varía
        entre 0 l/s y 150 l/s.

      Se pide:

      **a)** Deducir, empleando la ecuación de **Hazen-Williams**, la
      expresión de la curva característica de la instalación [H (m) y Q (l/s)]
      y dibujarla sobre el anexo de curvas proporcionado.

      **b)** Determinar gráficamente cuál debería ser, de acuerdo con los datos
      facilitados, el punto de funcionamiento de la bomba ($Q$, $H$, $\eta$,
      $P_{abs}$, $NPSH_{req}$), indicando claramente los valores obtenidos
      tanto en la gráfica como en la resolución del ejercicio.

      **c)** Si la bomba se encuentra 4,6 m por encima del depósito inferior,
      determinar si existe riesgo de cavitación.

      **d)** Calcular las lecturas de los manómetros Bourdon (torr) y de fuelle
      (MPa) situados aguas arriba y aguas abajo de la bomba.

      **e)** Siendo el rendimiento del motor eléctrico del 83% y el coste del
      kW·h de 0,1 €, calcular el costo diario del funcionamiento de la
      instalación, sabiendo que está en marcha 16 horas al día.

      DATOS: $p_{atm} = 1{,}04$ atm; $p_v/\gamma = 0{,}2$ mca.

      **Notas nuestras.** El anexo de curvas es un catálogo del fabricante y
      no se reproduce aquí; sí sus lecturas, tomadas de la imagen del
      cuadernillo con su rejilla y redibujadas en la figura, solo para el
      rodete de 214 mm a 2960 rpm:

      | Q (l/s) | H (m) | P absorbida (kW) | NPSH requerido (m) |
      |---|---|---|---|
      | 10 | 62,2 | 27,2 | — |
      | 20 | 62,2 | 29,1 | — |
      | 30 | 62,2 | 32,8 | — |
      | 40 | 62,0 | 37,9 | 3,0 |
      | 50 | 61,5 | 42,7 | 3,0 |
      | 60 | 60,3 | 47,2 | 3,3 |
      | 70 | 58,1 | 51,2 | 3,6 |
      | 75 | 56,5 | 53,0 | 4,0 |
      | 80 | 54,7 | 54,7 | 4,5 |
      | 85 | 52,4 | 56,2 | 5,2 |
      | 90 | 49,6 | 57,6 | 6,1 |
      | 95 | 46,3 | 59,0 | 7,3 |
      | 100 | 42,4 | 60,1 | 8,6 |

      El anexo da el rendimiento con curvas de igual rendimiento, que cortan a
      la de 214 mm en estos caudales: 58 % a 33,9 l/s; 62 % a 39,6; 66 % a
      45,5; 70 % a 50,2; 74 % a 57,6; 77 % a 64,8; 80 % a 76,6, que es el
      máximo de ese rodete; y bajando, 77 % a 86,1; 74 % a 93,5; 70 % a 97,8 y
      66 % a 101,6. El anexo pide además un margen de seguridad de 0,5 m sobre
      el NPSH requerido.

