ejercicios:
  # ── 1 (12,5 %) · El cuarto de cilindro, el tope y la compuerta triangular.
  #    Rescatado el 30 de septiembre de 2026: con la figura renderizada, B es
  #    la esquina de arriba del triángulo y los tres apartados salen exactos.
  - id: exflu2425-ord-1-el-cuarto-de-cilindro-y-la-compuerta-triangular
    titulo: El cuarto de cilindro, el tope y la compuerta triangular que iguala sus dos reacciones
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 29 de mayo de 2025 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El sistema de la figura está formado por dos cuerpos de peso
      despreciable y un tope T. Los cuerpos están en contacto con un fluido
      con un peso específico $\gamma$, tal y como se puede ver en la imagen.
      El primer cuerpo tiene forma de un cuarto de cilindro de radio R y está
      articulado en el punto $O_1$. El segundo cuerpo tiene forma triangular,
      altura vertical de valor R, ángulo no conocido $\alpha$, y está
      articulado en el punto $O_2$. La anchura normal respecto a la imagen de
      ambos cuerpos es b. El tope T realiza un contacto puntual en los puntos
      A y B.

      Responde a las siguientes preguntas, **en función de las variables R,
      b, $\gamma$ y $\alpha$:**

      **d)** Calcular la componente horizontal y vertical de las fuerzas
      hidrostáticas sobre la pared curva de la compuerta en forma de cuarto de
      cilindro.

      **e)** Calcular la reacción $R_A$ en el punto A del tope T e indicar su
      sentido.

      **f)** ¿Cuál debería ser el ángulo $\alpha$ de la compuerta triangular
      para que las reacciones $R_A$ y $R_B$ en los puntos A y B del tope T sean
      iguales?

      DATO: Centroide del cuarto de círculo: $x_G = 4\cdot R/(3\cdot\pi)$.

