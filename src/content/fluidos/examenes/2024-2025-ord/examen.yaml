asignatura: fluidos
curso: '2024-2025'
convocatoria: ordinaria
fecha: 29 de mayo de 2025
# **Siete de los nueve.** Del cuadernillo «Exámenes 2020-2025» del
# departamento.
#
# Porcentajes impresos: 12,5 / 10 / 10 / 7,5 / 10 / 15 / 10 / 10 / 15, sin
# reparto por competencia, así que van sin `puntos`.
#
# Esta convocatoria estuvo **cerrada durante semanas**, y conviene decir por
# qué se abre ahora. Su ejercicio 2 exige la construcción que relaciona la
# razón adhesión-cohesión con el ángulo de contacto, y esa construcción no
# está en los apuntes; se declaró como hueco y con ella se quedó fuera medio
# examen. La destapó el ejercicio 1 de la **extraordinaria de junio de
# 2023**, donde la misma construcción reproduce exactamente los 9,99 mm
# publicados. Con ella, el ejercicio 2 de aquí sale clavado: 14,74 mbar.
#
# **Faltan dos, y queda dicho por qué.**
#
# - El **1** pide, en función de R, b, γ y α, las fuerzas sobre un cuarto de
#   cilindro, la reacción en un tope y el ángulo de una compuerta triangular
#   que iguale las dos reacciones. Las dos primeras se reproducen
#   —F_H = γR²b/2 y F_V = γπR²b/4— y también R_A = γR²b(π/4 − 1/3), que sale
#   de tomar momentos con el brazo de F_V igual a R. Pero el α = 36,4° del
#   apartado f) exige el equilibrio de la compuerta triangular, y la figura
#   no permite fijar sin ambigüedad dónde se apoya B ni con qué brazo. §13
#   caso 2.
# - El **9** se resuelve **sobre el anexo de curvas** de la bomba
#   IN-100-200.bF: caudal, altura, rendimiento, potencia absorbida y NPSH
#   requerido se leen del gráfico. Su apartado a) sí se reconstruye
#   —h_mi = 32 + 6,64·10⁻³·Q^1,852, con C_HW = 120 en los dos tramos de
#   fundición— pero el resto no es transcribible sin publicar el anexo.
#
# Lo que este examen aporta al corpus:
#
# - **Un piezómetro que miente por capilaridad** (ej. 2): de los 22 cm que
#   sube el menisco, 2,46 son capilaridad y solo el resto es presión. Con un
#   tubo de 1 mm el error es del 11 %.
# - **Diseñar la sensibilidad de un micromanómetro** (ej. 3), en vez de
#   leerlo: qué pareja de líquidos iguala a un tubo inclinado de 4°.
# - **Una sección compuesta con un acuerdo circular** (ej. 4), donde el
#   perímetro mojado hay que ir sumándolo tramo a tramo.
# - **Cinco números adimensionales** (ej. 5), uno de ellos ya adimensional de
#   nacimiento, y la elección de cuál respetar.
# - **Un flyboard** (ej. 7), que es cantidad de movimiento con dos chorros y
#   una trampa en el ángulo: los 10º son entre los dos, no de cada uno.
pdf: examenes-2020-2025.pdf

fuera:
  - n: 1
    motivo: >-
      Pide, en función del radio, la anchura, el peso específico y un
      ángulo, las fuerzas sobre un cuarto de cilindro, la reacción en un
      tope y el ángulo de una compuerta triangular. Las tres primeras se
      reproducen; el ángulo de 36,4° del último apartado exige el
      equilibrio de la compuerta triangular, y la figura no fija dónde se
      apoya B ni con qué brazo.
  - n: 9
    motivo: >-
      Se resuelve sobre el anexo de curvas de la bomba IN-100-200.bF:
      caudal, altura, rendimiento, potencia absorbida y NPSH requerido se
      leen del gráfico. Su primer apartado sí se reconstruye, pero el
      resto no es transcribible sin publicar el anexo.

