# **Los nueve.** Del cuadernillo «Exámenes 2020-2025» del departamento, págs.
# 63 a 67 del PDF.
#
# Porcentajes impresos: 12,5 / 10 / 10 / 7,5 / 10 / 15 / 10 / 10 / 15, sin
# reparto por competencia: van en `puntosImpresos`, en %, y suman 100.
#
# Esta convocatoria estuvo **cerrada durante semanas**, y conviene decir por
# qué se abre ahora. Su ejercicio 2 exige la construcción que relaciona la
# razón adhesión-cohesión con el ángulo de contacto, y esa construcción no
# está en los apuntes; se declaró como hueco y con ella se quedó fuera medio
# examen. La destapó el ejercicio 1 de la **extraordinaria de junio de
# 2023**, donde la misma construcción reproduce exactamente los 9,99 mm
# publicados. Con ella, el ejercicio 2 de aquí sale clavado: 14,74 mbar.
#
# **Hasta el 30 de septiembre de 2026 faltaban dos, el 1 y el 9, y ya no
# falta ninguno.**
#
# - El **1** estaba fuera porque «la figura no fija dónde se apoya B ni con
#   qué brazo». Mirada la figura renderizada (pág. 63), B es la esquina de
#   arriba del triángulo, como A lo es del cuarto de cilindro, y con esa
#   lectura el α = 36,4° impreso sale exacto: las horizontales del triángulo
#   se anulan y R_B = γR²b/(3·tg α). Se rescata entero, con sus letras
#   impresas, d), e) y f).
# - El **9** estaba fuera porque se resuelve sobre el anexo de curvas de la
#   bomba IN-100-200.bF, que es un catálogo de fabricante. El anexo no se
#   publica, pero sus lecturas sí: tomadas de la imagen (pág. 67, 636×912
#   píxeles) con su rejilla, dan el cruce en 80,5 l/s y 54,5 m, y η = 78,7 %
#   entre las marcas de 80 y 77, que es lo impreso. Van en una tabla bajo
#   «Notas nuestras» y redibujadas en la figura del enunciado.
#
# Lo que este examen aporta al corpus:
#
# - **Un piezómetro que miente por capilaridad** (ej. 2): de los 22 cm que
#   sube el menisco, 2,46 son capilaridad y solo el resto es presión. Con un
#   tubo de 1 mm el error es del 11 %.
# - **Diseñar la sensibilidad de un micromanómetro** (ej. 3), en vez de
#   leerlo: qué pareja de líquidos iguala a un tubo inclinado de 4°.
# - **Una sección compuesta con un acuerdo circular** (ej. 4), donde el
#   perímetro mojado hay que ir sumándolo tramo a tramo.
# - **Cinco números adimensionales** (ej. 5), uno de ellos ya adimensional de
#   nacimiento, y la elección de cuál respetar.
# - **Un flyboard** (ej. 7), que es cantidad de movimiento con dos chorros y
#   una trampa en el ángulo: los 10º son entre los dos, no de cada uno.
# - **Dos fuerzas que se anulan** (ej. 1): en el triángulo, las horizontales
#   de sus dos caras mojadas, y por eso el ángulo sale de una sola vertical.
# - **Una bomba leída en su catálogo** (ej. 9), del punto de funcionamiento a
#   los dos manómetros y el coste de un día.
