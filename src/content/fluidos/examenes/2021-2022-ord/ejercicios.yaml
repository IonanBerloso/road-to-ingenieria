          </marker>
        </defs>
      </svg>
      <figcaption>

      Los cuadros están **vacíos a propósito**: el apartado a) es rellenarlos,
      decidir qué líquido cabe en cada manómetro y colocar sus meniscos.

      </figcaption>
      </figure>
    pide: Qué mide cada manómetro, la expresión del caudal y el cociente de las dos lecturas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos manómetros están conectados **a los mismos dos puntos**.
          ¿Qué tienen en común sus lecturas?
        opciones:
          - texto: >-
              Que miden la misma diferencia de altura piezométrica, aunque
              cada uno la exprese con una columna distinta
            correcta: true
            mensaje: |
              Eso es, y es la clave del apartado c). La diferencia
              $\Delta h$ entre A y B es una sola cosa, propiedad del flujo.
              Cada manómetro la traduce a longitud con su propio factor, y de
              ahí sale el cociente de las dos lecturas.
          - texto: >-
              Que las dos lecturas son iguales
            mensaje: |
              Solo lo serían si los dos líquidos manométricos se apartaran de
              $\gamma_0$ lo mismo. En general no, y el apartado c) pide
              precisamente cuánto se diferencian.
          - texto: >-
              Que las dos lecturas suman la pérdida de carga del venturímetro
            mensaje: |
              La pérdida de carga aparecería si los puntos fueran aguas
              arriba y aguas abajo del estrechamiento. Aquí los dos manómetros
              miden **lo mismo**, entre A y B; no se reparten nada.

      - tipo: redactar
        que: deduccion
        consigna: |
          Ahora el apartado b) en papel, como lo entregarías: la expresión del
          caudal real del venturímetro en función de $R_1$, la lectura del
          manómetro de arriba, desde Bernoulli entre A y B hasta dejarla con
          las dos áreas, las dos $\gamma$ y el coeficiente del aparato. Ese
          manómetro es el de la U invertida, con el líquido más ligero, así
          que el paréntesis de la lectura es el de ese caso.

          Y ojo a la letra: este enunciado llama $\gamma_0$ al fluido que
          circula y $\gamma_1$ al del manómetro, al revés que la diapositiva
          del tema 13 de donde sale la fórmula.
        rubrica: caudal-de-un-deprimogeno
        veredicto: |
          Si tu folio tiene los seis, tienes el apartado b) y la mitad del c),
          que sale de escribir lo mismo para el manómetro de abajo. Si te
          falta el tercero —la lectura traducida con la U invertida—, no
          sigas: con el paréntesis de la U normal el caudal sale con la raíz
          de un número negativo.

      - tipo: calcular
        titulo: El cociente de lecturas, con números
        pregunta: |
          Para fijar ideas: si por la tubería va agua ($s_0 = 1$), el
          manómetro superior lleva aceite ($s_1 = 0{,}8$) y el inferior
          mercurio ($s_2 = 13{,}6$), ¿cuánto vale $R_1/R_2$?
        respuesta:
          tipo: numero
          valor: '63'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '0.0159'
            mensaje: |
              Lo has puesto del revés. El manómetro de aceite es el
              **sensible**: su lectura es 63 veces mayor que la del de
              mercurio, no 63 veces menor.
          - valor: '17'
            mensaje: |
              Parece que has usado $\gamma_2/\gamma_1 = 13{,}6/0{,}8$. Lo que
              aparece en cada manómetro es cuánto se **aparta** su líquido del
              que circula, no el cociente entre los dos manométricos.
        pista: |
          $R_1/R_2 = (\gamma_2-\gamma_0)/(\gamma_0-\gamma_1)$.
        desarrollo: |
          $$
          \frac{R_1}{R_2} = \frac{13{,}6-1}{1-0{,}8} = \frac{12{,}6}{0{,}2}
          = 63
          $$

      - tipo: justificar
        pregunta: Ordena la deducción del cociente. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro superior lleva el fluido **ligero**, así que va en
              U invertida y su lectura vale
              $\Delta h = R_1(\gamma_0-\gamma_1)/\gamma_0$.
          - texto: >-
              El inferior lleva el **pesado**, va en U normal, y su lectura
              vale $\Delta h = R_2(\gamma_2-\gamma_0)/\gamma_0$.
          - texto: >-
              Como los dos miden el mismo $\Delta h$, igualando sale
              $R_1/R_2 = (\gamma_2-\gamma_0)/(\gamma_0-\gamma_1)$.
          - texto: >-
              Al arrancar el flujo, los meniscos del manómetro superior bajan
              por el lado de la garganta y los del inferior también.
            trampa: true
            mensaje: |
              La mitad es cierta y la otra no, y ese es el apartado a). En el
              ligero, montado por encima, el lado de la garganta **baja**, sí;
              pero en el pesado, el lado conectado a la garganta —donde la
              presión es menor— **sube**. Los dos se mueven en sentidos
              contrarios, y es lo que hay que dibujar en los cuadros del
              enunciado.
    resolucion: |
      **a) Qué hace cada manómetro.** El de $\gamma_1$, más ligero que el
      fluido que circula, solo puede montarse **por encima** de la tubería, en
      U invertida; el de $\gamma_2$, más pesado, va **por debajo**, en U
      normal. Al arrancar el flujo, la presión baja en la garganta B respecto
      de la sección ancha A, y los meniscos se desplazan en sentidos
      contrarios en uno y otro aparato.

      **b) El caudal.** Es el venturímetro de siempre, con la lectura del
      manómetro superior traducida a metros del fluido que circula:

      $$
      Q = C_d\,A_2\sqrt{\frac{2g\,\Delta h}{1-(A_2/A_1)^{2}}}
      \qquad
      \Delta h = R_1\Bigl(1-\frac{\gamma_1}{\gamma_0}\Bigr)
      $$

      **c) El cociente.** Los dos manómetros están conectados a los **mismos**
      dos puntos, así que miden el mismo $\Delta h$:

      $$
      R_1\,\frac{\gamma_0-\gamma_1}{\gamma_0}
      = R_2\,\frac{\gamma_2-\gamma_0}{\gamma_0}
      \qquad\Longrightarrow\qquad
      \frac{R_1}{R_2} = \frac{\gamma_2-\gamma_0}{\gamma_0-\gamma_1}
      $$

      **Y lo que dice ese cociente.** No compara los dos líquidos entre sí:
      compara **cuánto se aparta cada uno del fluido que circula**. Con agua,
      aceite y mercurio el cociente vale 63: el manómetro de aceite da una
      columna sesenta y tres veces más larga para la misma diferencia de
      presión. Esa es la razón de montar el ligero cuando hay que apreciar
      variaciones finas, y el pesado cuando la presión es grande y el espacio
      poco.

  # ── 7 (5 %) · El cono que desvía un chorro vertical. Setenta grados que
  #    hay que partir por la mitad, y un coeficiente que sobra.
  - id: exflu2122-ord-7-el-cono-que-desvia-el-chorro
    titulo: El cono que flota sobre el chorro, y cuánto tiene que pesar
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      De una manguera dispuesta verticalmente como se muestra en la figura,
      sale un chorro de agua a la atmósfera. A continuación, el chorro es
      desviado por un cono sostenido a la manguera mediante alambres de masa
      despreciable $L_1$, $L_2$ y $L_3$. Calcular el peso (kg) que debe tener
      el cono para evitar tensiones en los alambres.

      **Datos**: Velocidad del chorro $v = 15$ m/s, diámetro del chorro
      $D = 8$ cm, coeficiente de contracción a la salida de la manguera
      $C_c = 0{,}9$.

      **Notas nuestras.** La figura, redibujada abajo, enseña la manguera
      vertical con el chorro subiendo y, encima, el cono con el vértice hacia
      abajo: el chorro lo toca en el vértice y sale por sus paredes. Los 70°
      son el ángulo del vértice del cono, medido entre sus dos paredes. $L_1$
      es un alambre vertical bajo el vértice, y $L_2$ y $L_3$ se abren desde
      él hasta un collarín de la manguera.

      <figure class="figura-examen">
      <svg viewBox="46 34 208 262" role="img" width="248" height="312"
           aria-labelledby="fo7t fo7d">
        <title id="fo7t">El cono invertido sobre el chorro vertical de la manguera</title>
        <desc id="fo7d">Una manguera dispuesta verticalmente lanza hacia arriba
        un chorro de agua a la atmósfera. Encima, un cono invertido —con el
        vértice hacia abajo— recibe el chorro en su vértice y lo desvía hacia
        los lados, de modo que el agua sale en dos láminas que forman entre sí
        un ángulo total de setenta grados. El cono se sostiene sobre la
        manguera con tres alambres de masa despreciable: uno vertical, L uno, y
        dos que se abren en diagonal hasta un collarín de la manguera, L dos y
        L tres.</desc>

        <rect x="136" y="238" width="28" height="54" fill="var(--ink)" fill-opacity=".22"
              stroke="var(--ink)" stroke-width="1.6"/>
        <ellipse cx="150" cy="238" rx="14" ry="4.5" fill="var(--ink)" opacity=".7"/>
        <text x="172" y="268" font-size="10" fill="var(--faint)">manguera</text>

        <path d="M143 236 L143 152 L157 152 L157 236 Z" fill="var(--live)" fill-opacity=".32"/>

        <path d="M150 150 L111 96 L189 96 Z" fill="var(--ink)" opacity=".55"/>
        <path d="M150 150 L96 76 M150 150 L204 76" stroke="var(--live)" stroke-width="4"
              opacity=".45" stroke-linecap="round"/>

        <path d="M112 62 A 68 68 0 0 1 188 62" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="150" y="58" text-anchor="middle" font-size="12" fill="var(--faint)">70°</text>

        <path d="M150 152 L150 186" stroke="var(--alt)" stroke-width="1.6"/>
        <text x="158" y="172" font-size="10" fill="var(--alt)">L₁</text>
        <path d="M150 186 L122 216 M150 186 L178 216" stroke="var(--alt)" stroke-width="1.6"/>
        <text x="114" y="212" text-anchor="end" font-size="10" fill="var(--alt)">L₂</text>
        <text x="184" y="212" font-size="10" fill="var(--alt)">L₃</text>
        <ellipse cx="150" cy="218" rx="30" ry="5" fill="none" stroke="var(--alt)" stroke-width="1.4"/>
      </svg>
      <figcaption>

      El cono **no se apoya en nada**: lo sujetan a la manguera tres
      alambres, que solo pueden tirar. Por eso «evitar
      tensiones en los alambres» significa que su peso tiene que igualar
      exactamente el empuje vertical del chorro desviado, y ese es todo el
      ejercicio.

      </figcaption>
      </figure>
    pide: El peso del cono que anula la tensión de los alambres.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Evitar tensiones en los alambres» ¿qué condición impone?
        opciones:
          - texto: >-
              Que el peso del cono iguale exactamente al empuje vertical del
              chorro, de modo que los alambres no tengan que sujetar nada
            correcta: true
            mensaje: |
              Eso es. Los alambres solo pueden tirar hacia abajo —son
              alambres, no barras—, así que entran en tensión en cuanto el
              chorro levanta el cono. El límite es el equilibrio exacto.
          - texto: >-
              Que el cono pese más que el chorro, para que los alambres
              queden flojos
            mensaje: |
              Si pesara más, el cono bajaría hasta apoyarse en algo o hasta
              que los alambres trabajaran a compresión, cosa que no pueden
              hacer. La pregunta es por el peso **justo**.
          - texto: >-
              Que el chorro no toque el cono
            mensaje: |
              Si no lo tocara no habría fuerza, y el peso del cono sería
              irrelevante. El ejercicio va precisamente de la fuerza que el
              chorro hace al desviarse.

      - tipo: calcular
        titulo: La cantidad de movimiento del chorro
        pregunta: |
          ¿Cuánto vale $\rho\,Q\,v$ para este chorro, en N?
        respuesta:
          tipo: numero
          valor: '1131'
          tolerancia: 10
          formato: un número en newton
        distractores:
          - valor: '1018'
            mensaje: |
              Has multiplicado por el coeficiente de contracción la sección
              que da el diámetro. El
              enunciado dice «**diámetro del chorro** $D = 8$ cm»: la
              contracción ya está hecha, y $C_c$ es un dato que sobra.
          - valor: '75.4'
            mensaje: |
              Ese es el caudal en litros por segundo, no la cantidad de
              movimiento. Falta multiplicar por la densidad y por la
              velocidad.
        pista: |
          $Q = v\,A$, con $A$ la sección del chorro.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}08^{2}}{4} = 5{,}027\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          Q = 15\,A = 0{,}0754\ \text{m}^{3}/\text{s}
          $$
          $$
          \rho Q v = 1000\cdot 0{,}0754\cdot 15 = 1131\ \text{N}
          $$

      - tipo: calcular
        titulo: El peso del cono
        pregunta: |
          ¿Cuánto debe pesar el cono, en kg?
        respuesta:
          tipo: numero
          valor: '20.87'
          tolerancia: 0.3
          formato: un número en kilogramos
        distractores:
          - valor: '115.4'
            mensaje: |
              Has supuesto que el cono detiene el chorro por completo. No lo
              detiene: lo desvía, y el agua sale con el mismo módulo de
              velocidad a 35º de la vertical, así que sigue llevándose casi
              toda su cantidad de movimiento hacia arriba.
          - valor: '75.9'
            mensaje: |
              Has usado los 70º completos para cada lado del chorro. Los 70º
              son el ángulo **del vértice**, así que la pared del cono forma
              35º con la vertical, y esa es la desviación de cada chorro.
        pista: |
          El chorro entra vertical y sale a 35º de la vertical, con el mismo
          módulo de velocidad.
        desarrollo: |
          $$
          F = \rho Q v\,(1-\cos 35^{\circ}) = 1131\cdot 0{,}1808
          = 204{,}5\ \text{N}
          $$
          $$
          W = \frac{204{,}5}{9{,}8} = 20{,}87\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El chorro llega vertical con $\rho Q v = 1131$ N de cantidad de
              movimiento.
          - texto: >-
              El cono lo desvía 35º —la mitad de su ángulo de vértice— sin
              cambiarle el módulo de la velocidad.
          - texto: >-
              El empuje sobre el cono es $\rho Q v(1-\cos 35^{\circ})$, que
              son 204,5 N, es decir 20,87 kg.
          - texto: >-
              Un cono más abierto empujaría menos, porque desviaría menos el
              chorro.
            trampa: true
            mensaje: |
              Al revés. Un cono más abierto —vértice mayor— desvía **más** el
              chorro respecto de la vertical, y $1-\cos\theta$ crece. En el
              límite de un cono plano, $\theta = 90^{\circ}$, el empuje sería
              el $\rho Q v$ entero. Aquí, con solo 35º, el cono se queda con
              el 18 % de la cantidad de movimiento del chorro; el resto sigue
              subiendo.
    resolucion: |
      **La idea.** El chorro sube, choca con el cono invertido y sale por sus
      paredes formando 35º con la vertical —la mitad del ángulo del vértice—.
      Como el chorro es libre y no hay pérdidas, el **módulo** de la velocidad
      no cambia; solo cambia la dirección, y esa parte que ha dejado de subir
      verticalmente es la que empuja el cono.

      $$
      A = 5{,}027\cdot 10^{-3}\ \text{m}^{2}
      \qquad
      Q = 0{,}0754\ \text{m}^{3}/\text{s}
      \qquad
      \rho Q v = 1131\ \text{N}
      $$
      $$
      F = \rho Q v\,(1-\cos 35^{\circ}) = 204{,}5\ \text{N}
      \qquad
      W = 20{,}87\ \text{kg}
      $$

      **Dos avisos que este ejercicio da gratis.** El primero, que $C_c$ es un
      dato **que sobra**: el enunciado dice «diámetro del chorro», así que la
      contracción ya está aplicada. Usarlo otra vez rebaja el resultado a
      18,8 kg. El segundo, que los 70º son del **vértice**, no de cada pared:
      quien los use enteros obtiene 75,9 kg, casi cuatro veces el resultado
      correcto.

      Y un tercero, de método: el cono solo se lleva el 18 % de la cantidad de
      movimiento del chorro. Un chorro desviado poco empuja poco, por muy
      impresionante que parezca; toda la fuerza está en el **cambio** de
      dirección, no en la velocidad.

  # ── 8 (5 %) · Buckingham con seis variables, y una tabla de potencias que
  #    el examen obliga a rellenar.
  - id: exflu2122-ord-8-buckingham-con-seis-variables
    titulo: Buckingham con seis variables, y la tabla de potencias
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no el desarrollo.
    nivel: examen
    enunciado: |
      Deducir mediante el uso **obligatorio** del teorema de $\Pi$ ó
      Vaschy-Buckingham los parámetros adimensionales correspondientes a un
      sistema caracterizado por las variables que se dan a continuación.

      En el sistema se considerarán el módulo de elasticidad volumétrica de un
      fluido $K$, su viscosidad cinemática $\nu$, su densidad $\rho$, la
      diferencia de presión entre dos puntos $\Delta p$, la velocidad del
      fluido $v$ y una longitud característica $L$.

      Utilizar como variables repetidas $\rho$, $v$ y $L$ y completar la tabla
      de potencias correspondiente a las ecuaciones dimensionales de todas las
      variables.

      | | M | L | T |
      |---|---|---|---|
      | $\rho$ | | | |
      | $v$ | | | |
      | $L$ | | | |
      | $K$ | | | |
      | $\Delta P$ | | | |
      | $\nu$ | | | |

      **Notas nuestras.** *La tabla impresa rotula la viscosidad cinemática
      con una ípsilon, «υ»; va con la $\nu$ del texto.*
    pide: Los parámetros adimensionales del sistema, con sus ecuaciones dimensionales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se eligen $\rho$, $v$ y $L$ como variables repetidas y no
          otras tres cualesquiera?
        opciones:
          - texto: >-
              Porque entre las tres cubren las tres dimensiones M, L y T sin
              que ninguna sea combinación de las otras dos
            correcta: true
            mensaje: |
              Eso es. Las repetidas tienen que ser **dimensionalmente
              independientes**: $\rho$ aporta la masa, $v$ el tiempo y $L$ la
              longitud, y con ellas se puede adimensionalizar cualquier otra.
              Y hay una regla práctica: no se elige como repetida la variable
              cuya influencia se quiere estudiar.
          - texto: >-
              Porque son las tres que aparecen en más términos
            mensaje: |
              El criterio no es de frecuencia sino de independencia
              dimensional. Se podrían elegir otras tres siempre que
              cumplieran esa condición, y saldrían grupos distintos pero
              equivalentes.
          - texto: >-
              Porque son las únicas que se pueden medir directamente
            mensaje: |
              $\Delta p$ y $K$ también se miden, y muy directamente. El
              criterio es puramente dimensional.

      - tipo: calcular
        titulo: Cuántos grupos salen
        pregunta: |
          ¿Cuántos parámetros adimensionales tiene este sistema?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              Seis son las variables. El teorema dice que los grupos son
              $n - k$, es decir seis menos las tres dimensiones
              independientes.
          - valor: '9'
            mensaje: |
              Has sumado las variables y las dimensiones en vez de restarlas.
              El teorema **reduce**: esa es toda su utilidad.
        pista: |
          $n - k$, con $n$ las variables y $k$ las dimensiones básicas
          independientes.
        desarrollo: |
          Seis variables —$K$, $\nu$, $\rho$, $\Delta p$, $v$, $L$— y tres
          dimensiones —M, L, T—, así que salen $6-3 = 3$ grupos.

      - tipo: calcular
        titulo: El exponente de la densidad
        pregunta: |
          En el grupo que contiene $K$, escrito como
          $\Pi_1 = K\,\rho^{a}v^{b}L^{c}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.1
          formato: un número, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              El signo importa: $K$ tiene dimensiones de presión,
              $ML^{-1}T^{-2}$, y para cancelar la masa hay que **dividir**
              entre $\rho$, no multiplicar.
          - valor: '-2'
            mensaje: |
              El $-2$ es el exponente de la **velocidad**, no el de la
              densidad. La masa aparece a la primera potencia tanto en $K$
              como en $\rho$.
        pista: |
          $[K] = ML^{-1}T^{-2}$ y $[\rho] = ML^{-3}$. Empieza cancelando la
          masa.
        desarrollo: |
          $$
          [K\rho^{a}v^{b}L^{c}]
          = (ML^{-1}T^{-2})(ML^{-3})^{a}(LT^{-1})^{b}L^{c}
          $$

          De M: $1+a = 0 \Rightarrow a = -1$. De T:
          $-2-b = 0 \Rightarrow b = -2$. De L:
          $-1-3a+b+c = 0 \Rightarrow c = 0$. Así que

          $$
          \Pi_1 = \frac{K}{\rho v^{2}}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          Ahora el ejercicio entero en papel, como lo entregarías. El
          enunciado impone el método —«uso obligatorio del teorema»—, las
          repetidas y la tabla de potencias, así que lo que se corrige es el
          camino, no los tres grupos del final: las seis variables con su
          tabla de dimensiones, cuántos grupos salen y de dónde sale ese
          número, por qué valen $\rho$, $v$ y $L$ como repetidas, el despeje
          de cada grupo con su sistema de exponentes y la comprobación.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si en tu folio están los mínimos, tienes lo que el enunciado exige
          con la palabra «obligatorio». Si has llegado a los tres grupos
          reconociéndolos —el de Euler, el de Mach, el de Reynolds— sin
          despejar los exponentes, el resultado está bien y el ejercicio no:
          es justo lo que esa palabra dice que se mira.

      - tipo: justificar
        pregunta: Ordena el resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\rho$, $v$ y $L$ repetidas, el módulo de elasticidad da
              $\Pi_1 = K/(\rho v^{2})$, que es el inverso del cuadrado del
              número de Mach.
          - texto: >-
              La diferencia de presión da $\Pi_2 = \Delta p/(\rho v^{2})$, el
              número de Euler.
          - texto: >-
              La viscosidad cinemática da $\Pi_3 = \nu/(vL)$, el inverso del
              número de Reynolds; la densidad no aparece porque $\nu$ ya la
              lleva dividida dentro.
          - texto: >-
              Como los tres grupos llevan $\rho v^{2}$ en el denominador,
              todos miden lo mismo con distintas unidades.
            trampa: true
            mensaje: |
              El tercero **no** lleva $\rho v^{2}$: es $\nu/(vL)$, y ni
              siquiera contiene la densidad. Y los otros dos, aunque
              compartan denominador, miden cosas distintas: uno compara la
              inercia con la compresibilidad y el otro con la presión
              aplicada. Compartir un factor no es medir lo mismo.
    resolucion: |
      **El planteamiento.** Seis variables y tres dimensiones básicas dan
      **tres** grupos. Con $\rho$, $v$ y $L$ como repetidas, cada una de las
      tres restantes genera uno.

      **La tabla de potencias**, que es lo que el examen pide rellenar:

      | | M | L | T |
      |---|---|---|---|
      | $\rho$ | 1 | $-3$ | 0 |
      | $v$ | 0 | 1 | $-1$ |
      | $L$ | 0 | 1 | 0 |
      | $K$ | 1 | $-1$ | $-2$ |
      | $\Delta p$ | 1 | $-1$ | $-2$ |
      | $\nu$ | 0 | 2 | $-1$ |

      **Los tres grupos.**

      $$
      \Pi_1 = \frac{K}{\rho v^{2}}
      \qquad
      \Pi_2 = \frac{\Delta p}{\rho v^{2}}
      \qquad
      \Pi_3 = \frac{\nu}{v\,L}
      $$

      El primero es el inverso del cuadrado del número de **Mach**; el
      segundo, el número de **Euler**; el tercero, el inverso del de
      **Reynolds**.

      **Una observación que la tabla hace evidente.** $K$ y $\Delta p$ tienen
      exactamente la misma ecuación dimensional —las dos son presiones—, así
      que sus grupos salen con la misma forma. Eso no los hace equivalentes:
      uno compara la inercia del flujo con la rigidez del fluido y el otro con
      la presión que se le aplica. El análisis dimensional dice **qué forma**
      tienen los números, nunca qué significan; eso lo pone la física.

  # ── 9 (15 %) · Dos ramales en paralelo con la bomba en uno solo, y todo
  #    en régimen laminar: Poiseuille en vez de Colebrook.
  - id: exflu2122-ord-9-los-dos-ramales-laminares
    titulo: Dos ramales en paralelo, uno con bomba, y todo laminar
    fuente: >-
      Ejercicio 9 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de cobre de la imagen, se consigue un flujo
      completamente laminar.

      El fluido bombeado del punto A al punto B es un fluido de viscosidad
      80 cSt y densidad relativa $s = 1{,}26$, y la energía por unidad de
      volumen del punto A es de $555{,}66\ \text{kJ/m}^{3}$, mientras que en
      el punto B es de 15 mcl ($s = 2{,}52$). Se pide:

      **a)** Calcular el caudal bombeado, sabiendo que la potencia bruta de la
      bomba es de 1,2 kW y su rendimiento es del 54%.

      **b)** Calcular el caudal que sale del nudo B.

      | | $L$ (m) | $D$ (mm) |
      |---|---|---|
      | **1** | 100 | 50 |
      | **2** | 250 | 40 |

      **Notas nuestras.** La imagen, redibujada abajo, es el esquema de la
      instalación: del punto A salen dos tuberías en paralelo que se vuelven
      a juntar en B. La 1, arriba, lleva la bomba P; la 2, abajo, no lleva
      nada. La tabla da la longitud y el diámetro de cada una.

      <figure class="figura-examen">
      <svg viewBox="30 26 356 176" role="img" width="420" height="208"
           aria-labelledby="fo9t fo9d">
        <title id="fo9t">Los dos ramales en paralelo entre A y B, con la bomba en el primero</title>
        <desc id="fo9d">Del punto A, a la izquierda, salen dos tuberías en
        paralelo que vuelven a juntarse en el punto B, a la derecha, formando
        un anillo. La tubería 1, la de arriba, lleva una bomba en su tramo
        central. La tubería 2, la de abajo, no lleva nada. La uno mide cien
        metros y cincuenta milímetros de diámetro; la dos, doscientos cincuenta
        metros y cuarenta milímetros.</desc>

        <path d="M50 112 L100 112 M100 62 L300 62 M100 162 L300 162 M100 62 L100 162 M300 62 L300 162 M300 112 L354 112"
              fill="none" stroke="var(--ink)" stroke-width="2.4"/>

        <circle cx="200" cy="62" r="19" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.4"/>
        <text x="200" y="67" text-anchor="middle" font-size="14" fill="var(--ink)">P</text>
        <path d="M186 84 L214 84" stroke="var(--ink)" stroke-width="2"/>
        <path d="M188 84 L184 90 M196 84 L192 90 M204 84 L200 90 M212 84 L208 90"
              stroke="var(--faint)" stroke-width="1"/>
        <path d="M194 81 L206 81" stroke="var(--ink)" stroke-width="1.6"/>

        <text x="42" y="108" text-anchor="end" font-size="13" fill="var(--ink)">A</text>
        <text x="362" y="108" font-size="13" fill="var(--ink)">B</text>
        <text x="146" y="56" text-anchor="end" font-size="13" fill="var(--ink)">1</text>
        <text x="146" y="180" text-anchor="end" font-size="13" fill="var(--ink)">2</text>

        <text x="156" y="40" font-size="10" fill="var(--faint)">L = 100 m · D = 50 mm</text>
        <text x="156" y="196" font-size="10" fill="var(--faint)">L = 250 m · D = 40 mm</text>
      </svg>
      <figcaption>

      Los dos ramales van **en paralelo**, así que soportan la misma diferencia
      de altura piezométrica entre A y B. Pero uno lleva bomba y el otro no, y
      eso es lo que impide repartir el caudal por la regla de siempre.

      </figcaption>
      </figure>
    pide: El caudal que pasa por la bomba y el total que sale del nudo B.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado insiste en que el flujo es «completamente laminar».
          ¿Qué cambia respecto de lo habitual?
        opciones:
          - texto: >-
              Que la pérdida de carga es **proporcional al caudal**, no a su
              cuadrado, y sale de Poiseuille sin necesidad de ábaco ni de
              iterar
            correcta: true
            mensaje: |
              Eso es, y simplifica el problema entero. Con $f = 64/Re$, la
              fórmula de Darcy se reduce a
              $h_f = 128\nu L Q/(\pi g D^{4})$: lineal en $Q$, sin rugosidad
              y sin Colebrook. Por eso el enunciado se molesta en decirlo.
          - texto: >-
              Que se pueden despreciar las pérdidas
            mensaje: |
              Al contrario: en laminar las pérdidas suelen ser **grandes**,
              porque el régimen laminar aparece con fluidos viscosos. Aquí el
              fluido tiene 80 cSt, ochenta veces el agua.
          - texto: >-
              Que la rugosidad del cobre hay que buscarla en el cuadro n.º 20
            mensaje: |
              En régimen laminar la rugosidad **no interviene**: el factor de
              fricción vale $64/Re$ y no depende del material. Que la tubería
              sea de cobre es información de sobra.

      - tipo: calcular
        titulo: La altura de energía en A
        pregunta: |
          ¿A cuántos metros de columna del fluido equivalen los
          $555{,}66\ \text{kJ/m}^{3}$ del punto A?
        respuesta:
          tipo: magnitud
          valor: '45 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '56.7 m'
            mensaje: |
              Has dividido entre el peso específico del **agua**. El fluido
              tiene $s = 1{,}26$, así que
              $\gamma = 12348\ \text{N/m}^{3}$.
          - valor: '555.66 m'
            mensaje: |
              Has tomado los kilojulios por metro cúbico como metros. Son
              energía por unidad de **volumen**; para pasarlos a altura hay
              que dividir entre el peso específico.
        pista: |
          Energía por unidad de volumen dividida entre peso específico da
          energía por unidad de peso, es decir metros.
        desarrollo: |
          $$
          H_A = \frac{555660}{1{,}26\cdot 9800} = 45{,}0\ \text{m}
          $$

          Y en B, $15$ m de un líquido de $s = 2{,}52$ son
          $15\cdot 2{,}52\cdot 9800 = 370{,}4$ kPa, es decir
          $H_B = 30{,}0$ m. Entre A y B hay 15 metros disponibles.

      - tipo: calcular
        titulo: El caudal del ramal sin bomba
        pregunta: |
          ¿Cuánto circula por la tubería 2, en l/s?
        respuesta:
          tipo: magnitud
          valor: '0.462 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1.128 l/s'
            mensaje: |
              Has usado el diámetro de la tubería 1, 50 mm. En laminar la
              pérdida va con $D^{4}$, así que un 25 % más de diámetro
              multiplica el caudal por 2,44.
          - valor: '4.85 l/s'
            mensaje: |
              Ese es el de la tubería 1, que además lleva bomba. La 2 solo
              tiene los 15 metros de desnivel energético, y con 250 m de tubo
              de 40 mm eso da menos de medio litro por segundo.
        pista: |
          Sin bomba, los 15 metros disponibles se gastan enteros en pérdidas:
          $h_f = 128\nu L Q/(\pi g D^{4})$.
        desarrollo: |
          $$
          h_{f2} = \frac{128\cdot 8\cdot 10^{-5}\cdot 250}{\pi\cdot 9{,}8\cdot 0{,}04^{4}}\,Q_2
          = 32481\,Q_2 = 15
          $$
          $$
          Q_2 = 4{,}62\cdot 10^{-4}\ \text{m}^{3}/\text{s} = 0{,}462\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal bombeado
        pregunta: |
          ¿Cuánto circula por la tubería 1, en l/s?
        respuesta:
          tipo: magnitud
          valor: '4.85 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '2.03 l/s'
            mensaje: |
              Has puesto la bomba al revés en el balance de energía. Entre A
              y B ya hay 15 metros a favor, y la bomba **añade** más, así que
              la pérdida que tiene que vencer es
              $h_{f1} = 15 + H_m$, no $H_m - 15$.
          - valor: '5.31 l/s'
            mensaje: |
              Ese es el total que sale del nudo B, la suma de los dos
              ramales. El apartado a) pide solo el que pasa por la bomba.
        pista: |
          $H_A + H_m - h_{f1} = H_B$, con $H_m = P_{util}/(\gamma Q_1)$ y
          $h_{f1}$ lineal en $Q_1$. Sale una ecuación de segundo grado.
        desarrollo: |
          $$
          P_{util} = 1200\cdot 0{,}54 = 648\ \text{W}
          \qquad
          h_{f1} = 5321\,Q_1
          $$
          $$
          5321\,Q_1 = 15 + \frac{648}{12348\,Q_1}
          \;\Longrightarrow\;
          5321\,Q_1^{2} - 15\,Q_1 - 0{,}05248 = 0
          $$
          $$
          Q_1 = 4{,}85\cdot 10^{-3}\ \text{m}^{3}/\text{s} = 4{,}85\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal que sale del nudo B
        pregunta: |
          ¿Cuánto sale por B, en l/s?
        respuesta:
          tipo: magnitud
          valor: '5.31 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '4.39 l/s'
            mensaje: |
              Has restado los dos caudales. Los dos ramales van **de A a B**,
              así que en B se suman.
          - valor: '9.7 l/s'
            mensaje: |
              Parece que has duplicado el de la bomba. El segundo ramal
              aporta menos de medio litro por segundo: es diez veces más
              estrecho en capacidad.
        pista: |
          Continuidad en el nudo.
        desarrollo: |
          $$
          Q_B = 4{,}85+0{,}46 = 5{,}31\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La energía por unidad de volumen se pasa a metros dividiendo
              entre $\gamma$: 45 m en A y 30 m en B.
          - texto: >-
              El ramal sin bomba gasta esos 15 metros en pérdidas y solo
              consigue mover 0,46 l/s.
          - texto: >-
              El ramal con bomba dispone de los 15 metros **más** la altura
              manométrica, y lleva 4,85 l/s.
          - texto: >-
              Como los dos ramales tienen los mismos extremos, los dos pierden
              lo mismo y por tanto llevan el mismo caudal.
            trampa: true
            mensaje: |
              La primera mitad es cierta —los dos ramales unen A con B— pero
              la segunda no se sigue. En el ramal 1 hay una **bomba**: la
              energía disponible ahí no son 15 metros sino 15 más la altura
              manométrica. Un elemento activo rompe la regla de «mismos
              extremos, misma pérdida», y ese es exactamente el punto del
              ejercicio.
    resolucion: |
      **Lo primero, poner las dos energías en metros.** El enunciado las da en
      unidades distintas a propósito: una en kJ/m³ y la otra en metros de otro
      líquido.

      $$
      H_A = \frac{555660}{12348} = 45{,}0\ \text{m}
      \qquad
      H_B = \frac{15\cdot 2{,}52\cdot 9800}{12348} = 30{,}0\ \text{m}
      $$

      Entre A y B hay **15 metros a favor**.

      **El régimen laminar** simplifica el resto: con $f = 64/Re$, la pérdida
      es lineal en el caudal,

      $$
      h_f = \frac{128\,\nu\,L}{\pi g D^{4}}\,Q
      $$

      y ni la rugosidad ni el material intervienen. Que la instalación sea de
      cobre es un dato de sobra.

      **b) El ramal sin bomba.** Gasta los 15 metros enteros en rozamiento:

      $$
      32481\,Q_2 = 15
      \qquad
      Q_2 = 0{,}462\ \text{l/s}
      $$

      **a) El ramal con bomba.** Aquí la energía disponible es 15 metros
      **más** la altura manométrica, y esa depende del caudal:

      $$
      5321\,Q_1 = 15 + \frac{648}{12348\,Q_1}
      \qquad
      Q_1 = 4{,}85\ \text{l/s}
      $$

      **Y el nudo B** recibe la suma: $5{,}31$ l/s.

      **Lo que enseña.** Dos tuberías entre los mismos dos puntos llevan el
      mismo salto de energía **solo si no hay nada activo en medio**. La bomba
      rompe esa simetría, y por eso el ramal con bomba lleva diez veces más
      caudal que el otro pese a ser solo un 25 % más ancho. En una red, una
      bomba no es una tubería mejor: es otra cosa.

  # ── 10 (7,5 %) · Cinco preguntas cortas de máquinas hidráulicas.
  - id: exflu2122-ord-10-cinco-preguntas-de-maquinas
    titulo: Cinco preguntas cortas sobre turbinas y bombas
    fuente: >-
      Ejercicio 10 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen pide
      respuestas razonadas y breves.
    nivel: examen
    enunciado: |
      **Responder justificadamente de manera breve y concisa las siguientes
      preguntas:**

      **a)** Elementos de que consta la turbina Pelton.

      **b)** ¿Por qué se denomina la turbina Pelton turbina de acción?

      **c)** Función del distribuidor en las turbinas Francis y Kaplan.

      **d)** Tipo de energía hidráulica que se incrementa en las bombas de
      desplazamiento positivo.

      **e)** En la imagen se observa un rodete radial de una turbobomba.
      Indicar por dónde entra el flujo y por dónde sale.

      **Notas nuestras.** La imagen del apartado e) son fotos de un rodete
      radial y no se reproducen: a la izquierda, el rodete seccionado, con la
      tapa separada y los álabes al descubierto, y a la derecha, el rodete
      entero. *El impreso escribe «por donde», sin tilde.*
    pide: Las cinco respuestas, razonadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se llama «de acción» a la turbina Pelton?
        opciones:
          - texto: >-
              Porque el agua llega al rodete con energía exclusivamente
              cinética, ya a presión atmosférica
            correcta: true
            mensaje: |
              Eso es. Todo el salto se ha convertido en velocidad dentro del
              inyector, y el chorro golpea la cazoleta a presión atmosférica.
              El rodete solo cambia la dirección de la velocidad, que es el
              álabe del tema 15.
          - texto: >-
              Porque el agua actúa sobre el rodete y este reacciona
            mensaje: |
              Eso pasa en todas las turbinas, y es el error típico del tema:
              el nombre no describe la fuerza sino **con qué energía llega el
              agua**.
          - texto: >-
              Porque tiene acción directa sobre el generador, sin
              multiplicadora
            mensaje: |
              El acoplamiento con el generador no tiene nada que ver con la
              clasificación. Acción y reacción se refieren al tipo de energía
              en la entrada del rodete.

      - tipo: calcular
        titulo: La presión a la salida del inyector
        pregunta: |
          ¿Cuánto vale la presión **relativa** del agua justo a la salida del
          inyector de una Pelton, en bar?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.02
          formato: un número en bar
        distractores:
          - valor: '1.013'
            mensaje: |
              Esa es la presión **absoluta** aproximada, una atmósfera. La
              relativa, que es la que se pide, vale cero: el chorro está
              abierto al aire.
          - valor: '5'
            mensaje: |
              Si el chorro saliera a presión, la turbina sería de reacción y
              el rodete tendría que ir dentro de una carcasa llena de agua.
              En una Pelton el rodete gira al aire.
        pista: |
          El chorro sale a la atmósfera antes de tocar la cazoleta.
        desarrollo: |
          Cero. Todo el salto se ha convertido ya en altura cinética dentro
          del inyector:

          $$
          H = \frac{c^{2}}{2g}
          \qquad
          \frac{p}{\gamma} = 0
          $$

          y esa es exactamente la definición de turbina de acción.

      - tipo: justificar
        pregunta: Ordena las cinco respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** La Pelton consta de **inyector** —con su aguja y su
              deflector— y **rodete** con cazoletas. Nada más.
          - texto: >-
              **c)** El distribuidor de una Francis o una Kaplan regula el
              caudal y orienta el agua con el ángulo adecuado antes de entrar
              al rodete, mediante álabes móviles.
          - texto: >-
              **d)** Las bombas de desplazamiento positivo incrementan la
              energía **de presión**: encierran un volumen y lo comprimen
              contra la impulsión.
          - texto: >-
              **e)** En un rodete radial el flujo entra por la periferia y
              sale por el centro, arrastrado por los álabes.
            trampa: true
            mensaje: |
              Es justo al revés, y es lo que distingue a una **bomba** de una
              turbina. En un rodete radial de turbobomba el flujo entra
              **axialmente por el centro** —el oído del rodete— y sale
              **radialmente por la periferia**, lanzado por la fuerza
              centrífuga. Si entrara por fuera y saliera por dentro estaría
              cediendo energía al rodete, que es lo que hace una turbina
              centrípeta como la Francis.
    resolucion: |
      **a) Elementos de la Pelton.** Dos, y solo dos: el **inyector** —con la
      aguja que regula el caudal y el deflector que desvía el chorro en las
      paradas de emergencia— y el **rodete** con sus cazoletas de doble
      cuchara. No hay cámara espiral ni tubo difusor, y el distribuidor es el
      propio inyector: los Apuntes (vol. II, apartado 2.2.1 del tema 23) dicen
      que la Pelton «consta fundamentalmente del distribuidor, llamado así
      mismo inyector, y de la rueda o rodete».

      **b) Por qué «de acción».** Porque el agua llega al rodete con energía
      **exclusivamente cinética**. Dentro del inyector todo el salto se ha
      convertido en velocidad, y el chorro está a presión atmosférica antes de
      tocar la cazoleta y después de dejarla. El rodete solo cambia la
      dirección de la velocidad; no hay salto de presión a través de él.

      **c) El distribuidor de una Francis o una Kaplan.** Dos funciones a la
      vez: **regular el caudal** —sus álabes son orientables y actúan como una
      válvula repartida por toda la periferia— y **dar al agua el ángulo
      correcto** de entrada al rodete, para que la componente tangencial de la
      velocidad sea la que el diseño necesita. Es el órgano de regulación de
      la máquina.

      **d) Las bombas de desplazamiento positivo.** Incrementan la energía **de
      presión**. Encierran un volumen de fluido y lo empujan contra la
      impulsión; la velocidad del fluido apenas cambia. Es la diferencia de
      fondo con una turbobomba, que primero da **energía cinética** en el
      rodete y luego la convierte en presión en la voluta.

      **e) El rodete radial.** El flujo entra **axialmente por el centro** del
      rodete —el oído— y sale **radialmente por la periferia**, impulsado por
      los álabes. Ese cambio de dirección de axial a radial es lo que da
      nombre a la máquina, y es el sentido contrario al de una turbina Francis,
      que es centrípeta.

  # ── 11 (15 %) · Bombeo a una boquilla, y una válvula que se cierra. La
  #    altura cinética de salida entra en la curva de la instalación.
  - id: exflu2122-ord-11-la-boquilla-y-la-valvula-que-se-cierra
    titulo: El bombeo a una boquilla, y la válvula que se cierra
    fuente: >-
      Ejercicio 11 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En una instalación de bombeo simple se bombea agua desde un depósito
      abierto A, cuya lámina superior está en cota 0, a una boquilla vertical
      C, situada en cota 5 m, siendo el diámetro de la boquilla de 100 mm. La
      tubería es de polietileno (PE). En la aspiración la longitud equivalente
      total es 5 m y el diámetro es 350 mm. En la impulsión la longitud
      equivalente total es 500 m y el diámetro es 300 mm. La expresión
      analítica de la curva característica $H_m$-$Q$ de la turbobomba es la
      siguiente:

      $H_{mtb} = 24{,}49 - 5{,}061\cdot 10^{-4}\cdot Q^{2}$ (mca; l/s)

      Se pide resolver analíticamente, utilizando la expresión de
      Hazen-Williams para el cálculo de las pérdidas de carga:

      **a)** Deducir la expresión analítica de la curva característica de la
      instalación.

      **b)** Punto de funcionamiento de la instalación de bombeo
      [$H_m$ (mca); $Q$ (l/s)].

      **c)** Cota máxima a la que debe de instalarse la turbobomba.
      Considerar $NPSH_{\text{requerido}} = 4$ mca;
      $P_{atm}/\gamma = 10$ mca; $P_{vap}/\gamma$ = (abs) = 0,2 mca.
      Indicar el $NPSH_{\text{seguridad}}$ adoptado.

      **d)** En un momento dado, se maniobra la válvula reguladora de caudal
      colocada en la impulsión, siendo la lectura del vacuómetro colocado a la
      entrada de la turbobomba 4,5 mca y, la del manómetro de Bourdon colocado
      a la salida de $1{,}493\ \text{kg/cm}^{2}$. Indicar el nuevo punto de
      funcionamiento de la instalación ($H_m$; $Q$). Calcular asimismo el
      valor de las pérdidas de carga adicionales generadas en el maniobrado de
      la válvula.

      **Notas nuestras.** El ejercicio no trae figura. *La línea de
      resultados del cuadernillo escribe «$NPSH_{disp} < 1{,}3\cdot NPSH_{req}$»
      junto a la cota máxima: la desigualdad va al revés, porque lo que se
      exige es que el disponible supere 1,3 veces al requerido. Es una
      errata del original; la cota de 4,58 m impresa sale con la desigualdad
      bien puesta.*
    notas:
      - >-
        **Nota importante**: no considerar el término cinético en las
        tuberías. En los apartados b) y d) representar esquemáticamente la
        resolución analítica.
    pide: La curva de la instalación, el punto de funcionamiento, la cota de la bomba y la pérdida de la válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          La nota dice que no se considere el término cinético **en las
          tuberías**. ¿Y en la boquilla?
        opciones:
          - texto: >-
              En la boquilla sí, y es imprescindible: el agua sale a la
              atmósfera, así que toda su altura cinética se pierde y la paga
              la bomba
            correcta: true
            mensaje: |
              Eso es. La instalación no termina en un depósito sino en un
              chorro libre: la energía cinética con que sale ya no se
              recupera. Con 100 mm de boquilla eso son
              $8{,}27\cdot 10^{-4}Q^{2}$, el término que más pesa de la curva.
          - texto: >-
              Tampoco, porque la nota dice que se desprecie el término
              cinético
            mensaje: |
              La nota dice «en las **tuberías**», donde los diámetros son 300
              y 350 mm y las velocidades pequeñas. En la boquilla de 100 mm la
              velocidad es nueve veces mayor y su altura cinética es el
              término dominante.
          - texto: >-
              En la boquilla se considera, pero como una pérdida menor con su
              factor $k$
            mensaje: |
              No es una pérdida por rozamiento: es energía que el chorro se
              lleva puesta. Entra como $v^{2}/2g$ a secas, sin ningún
              coeficiente, porque el enunciado no da ninguno.

      - tipo: calcular
        titulo: El término de la boquilla
        pregunta: |
          Escrito como $a\cdot 10^{-4}Q^{2}$ con $Q$ en l/s, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '8.27'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '0.102'
            mensaje: |
              Has usado el diámetro de la impulsión, 300 mm. El término
              cinético que cuenta es el de la **boquilla**, de 100 mm, donde
              la velocidad es nueve veces mayor y la altura cinética ochenta
              veces.
          - valor: '16.54'
            mensaje: |
              Te has dejado el 2 del denominador: es $v^{2}/2g$, no
              $v^{2}/g$.
        pista: |
          $v = Q/A$ con $A = \pi\,0{,}1^{2}/4$, y $Q$ en litros por segundo.
        desarrollo: |
          $$
          A = 7{,}854\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          v = 0{,}12732\,Q
          $$
          $$
          \frac{v^{2}}{2g} = \frac{0{,}016211}{19{,}6}\,Q^{2}
          = 8{,}27\cdot 10^{-4}\,Q^{2}
          $$

      - tipo: calcular
        titulo: El término de Hazen-Williams
        pregunta: |
          Y el término $b\cdot 10^{-4}Q^{1{,}852}$ de las dos tuberías,
          ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '5.576'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '6.40'
            mensaje: |
              Has usado $C_{HW} = 130$. El PE tiene
              $\varepsilon = 0{,}0007$ cm, así que
              $\varepsilon/D \approx 2\cdot 10^{-5}$ en los dos tramos y el
              cuadro n.º 25 da **140**.
          - valor: '1.14'
            mensaje: |
              Parece que has usado 100 m de impulsión en vez de 500. La
              impulsión pone el 99,5 % de este término.
        pista: |
          $J_1 = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D_{mm}^{4{,}87})$ para cada
          tramo, y se suman los dos $J_1 L$.
        desarrollo: |
          $$
          J_1(350) = 5{,}237\cdot 10^{-7}
          \qquad
          J_1(300) = 1{,}110\cdot 10^{-6}
          $$
          $$
          5{,}237\cdot 10^{-7}\cdot 5 + 1{,}110\cdot 10^{-6}\cdot 500
          = 5{,}576\cdot 10^{-4}
          $$

          La aspiración aporta $2{,}6\cdot 10^{-6}$: medio por ciento.

      - tipo: redactar
        que: deduccion
        consigna: |
          Ahora el apartado a) en papel, como lo entregarías: la curva de esta
          instalación desde el balance de energía entre la lámina del depósito
          A y la salida del chorro por la boquilla C, hasta dejarla con sus
          tres términos calculados —el desnivel, la altura cinética del chorro
          en $Q^{2}$ y el rozamiento de Hazen-Williams en $Q^{1{,}852}$— y con
          las unidades de $H$ y de $Q$. Y deja dicho qué término cambia en el
          apartado d), cuando se maniobra la válvula.

          La nota manda no considerar el término cinético **en las
          tuberías**; el del chorro no es de una tubería, y es el mayor de los
          tres.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Si tu folio tiene los siete, tienes el apartado a) y la curva que
          cortan los otros tres. Si te falta el tercero —la altura cinética
          del chorro—, tu punto de funcionamiento sale con casi 50 l/s de más:
          revisa la curva antes de seguir.

      - tipo: calcular
        titulo: El punto de funcionamiento
        pregunta: |
          ¿Qué caudal circula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '109.98 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '159.2 l/s'
            mensaje: |
              Te has dejado el término de la boquilla, que es el mayor de los
              tres de la instalación: a 110 l/s vale 10 metros de los 18,4.
          - valor: '120.9 l/s'
            mensaje: |
              Te has dejado el rozamiento de Hazen-Williams y has cruzado la
              bomba solo con el desnivel y la boquilla.
        pista: |
          Igualar la curva de la bomba con
          $5 + 8{,}27\cdot 10^{-4}Q^{2} + 5{,}576\cdot 10^{-4}Q^{1{,}852}$ y
          tantear.
        desarrollo: |
          $$
          24{,}49-5{,}061\cdot 10^{-4}Q^{2}
          = 5 + 8{,}27\cdot 10^{-4}Q^{2} + 5{,}576\cdot 10^{-4}Q^{1{,}852}
          $$
          $$
          Q = 109{,}98\ \text{l/s}
          \qquad
          H_m = 18{,}37\ \text{m}
          $$

      - tipo: dibujar
        consigna: |
          La representación esquemática que la nota pide para el apartado b),
          en unos ejes $H$–$Q$ (m; l/s): la curva de la bomba, la de la
          instalación y su corte, con sus dos coordenadas.
        comprueba:
          - punto: >-
              La curva de la bomba sale de 24,49 m a caudal nulo y baja,
              curvándose hacia abajo.
            porque: >-
              Es $24{,}49 - 5{,}061\cdot 10^{-4}Q^{2}$: una parábola con el
              vértice en el eje de alturas. A 200 l/s ya solo da 4,2 m.
          - punto: >-
              La de la instalación sale de **5 m**, no de cero, y sube cada vez
              más deprisa.
            porque: >-
              Los 5 m son el desnivel hasta la boquilla, lo único que la bomba
              tiene que dar sin caudal. Luego crece con los otros dos términos,
              y el que manda es el del chorro: a 110 l/s ya son 10 de los
              18,37 m.
          - punto: >-
              El corte, con sus coordenadas escritas:
              $(109{,}98\ \text{l/s};\ 18{,}37\ \text{m})$.
            porque: >-
              Es el resultado del apartado, y la nota pide representar la
              resolución analítica, no sustituirla: el dibujo acompaña a la
              cuenta, y el punto tiene que estar donde ella dice.
        figura: |
          <svg viewBox="0 0 420 300" role="img" width="420" height="300" aria-labelledby="flu2122o11-b-t flu2122o11-b-d">
            <title id="flu2122o11-b-t">El punto de funcionamiento del ejercicio 11: la curva de la bomba y la de la instalación</title>
            <desc id="flu2122o11-b-d">Unos ejes con el caudal Q en litros por segundo, de 0 a 230, y la altura H en metros, de 0 a 30. La curva de la bomba baja desde 24,49 m a caudal nulo, y a 200 l/s va por 4,2 m. La curva de la instalación sale de 5 m, el desnivel hasta la boquilla, y sube cada vez más deprisa, casi toda por la altura cinética del chorro. Se cortan en el punto de funcionamiento, 109,98 l/s y 18,37 m, con dos líneas de trazos que bajan a los ejes.</desc>
            <style>
                .flu2122o11-b-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .flu2122o11-b-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .flu2122o11-b-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .flu2122o11-b-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .flu2122o11-b-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .flu2122o11-b-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .flu2122o11-b-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .flu2122o11-b-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .flu2122o11-b-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
