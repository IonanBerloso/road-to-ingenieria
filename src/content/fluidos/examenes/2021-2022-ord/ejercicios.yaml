      - tipo: calcular
        titulo: La cota máxima de la bomba
        pregunta: |
          ¿A qué cota máxima se puede instalar la turbobomba, en metros?
        respuesta:
          tipo: magnitud
          valor: '4.58 m'
          tolerancia: 0.02
          formato: una cota, con su unidad
        distractores:
          - valor: '5.78 m'
            mensaje: |
              Has pedido solo $NPSH_{disp} > NPSH_{req}$. Ese es el criterio
              de una instalación que ya funciona (diapositiva 21 del tema 25).
              Aquí se pregunta a qué cota **debe** instalarse la bomba, que es
              diseño, y en diseño se exige
              $NPSH_{disp} > 1{,}3\,NPSH_{req} = 5{,}2$ mca: ese 1,2 mca de
              más es el $NPSH$ de seguridad que el enunciado pide indicar.
          - valor: '9.78 m'
            mensaje: |
              Te has dejado el $NPSH$ entero. Sin él la bomba cavitaría mucho
              antes de llegar a esa cota.
        pista: |
          $NPSH_{disp} = p_{at}/\gamma - p_v/\gamma - z - h_{f,asp}$. Y como
          es una cota de diseño, se exige que supere $1{,}3$ veces el
          requerido.
        desarrollo: |
          $$
          h_{f,asp} = 2{,}62\cdot 10^{-6}\cdot 109{,}98^{1{,}852}
          = 0{,}016\ \text{m}
          $$
          $$
          10-0{,}2-z-0{,}016 \ge 1{,}3\cdot 4 = 5{,}2
          \;\Longrightarrow\;
          z \le 4{,}58\ \text{m}
          $$

          El $NPSH$ de seguridad adoptado es la diferencia,
          $5{,}2 - 4 = 1{,}2$ mca.

      - tipo: calcular
        titulo: La pérdida que añade la válvula
        pregunta: |
          Tras cerrar la válvula, ¿cuánta pérdida de carga adicional genera,
          en metros?
        respuesta:
          tipo: magnitud
          valor: '3.34 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '1.06 m'
            mensaje: |
              Esa es la subida de la altura manométrica, de 18,37 a 19,43. No
              es lo mismo: la instalación también pide menos que antes al
              bajar el caudal, y la diferencia entre lo que da la bomba y lo
              que piden tubería y boquilla es lo que quema la válvula.
          - valor: '19.43 m'
            mensaje: |
              Esa es la nueva altura manométrica completa. La válvula solo se
              queda con la parte que sobra después de descontar el desnivel,
              el rozamiento y la boquilla.
        pista: |
          Los dos manómetros dan la nueva $H_m$; de ahí sale el caudal por la
          curva de la bomba, y lo que sobre respecto de la curva de la
          instalación es de la válvula.
        desarrollo: |
          $$
          H_m = 14{,}93+4{,}5 = 19{,}43\ \text{m}
          \;\Longrightarrow\;
          Q = 100{,}0\ \text{l/s}
          $$
          $$
          h_{mi}(100) = 5 + 8{,}27 + 2{,}82 = 16{,}09\ \text{m}
          $$
          $$
          h_{f,v} = 19{,}43-16{,}09 = 3{,}34\ \text{m}
          $$

      - tipo: dibujar
        consigna: |
          La representación esquemática del apartado d), en los mismos ejes:
          las curvas de la bomba y de la instalación del apartado b), el punto
          nuevo sobre la curva de la bomba, la pérdida de la válvula como un
          segmento y la curva de la instalación con la válvula maniobrada.
        comprueba:
          - punto: >-
              El punto nuevo está **sobre la curva de la bomba**, en
              $(100\ \text{l/s};\ 19{,}43\ \text{m})$, a la izquierda y por
              encima del de b).
            porque: >-
              Maniobrar una válvula de la impulsión no cambia la bomba, solo
              la instalación: el punto resbala por la curva de la bomba hacia
              menos caudal y más altura. Los 19,43 m los dan los dos
              manómetros, $14{,}93 + 4{,}5$, y el caudal sale de la curva de la
              bomba, no de la de la instalación.
          - punto: >-
              A 100 l/s, un segmento vertical entre la instalación sin
              maniobrar (16,09 m) y el punto nuevo (19,43 m): 3,34 m.
            porque: >-
              Es el resultado del apartado dibujado: lo que la bomba da a ese
              caudal menos lo que la instalación pediría con la válvula como
              estaba. Esa diferencia es lo que la válvula quema.
          - punto: >-
              La instalación maniobrada sale **también de 5 m** y sube más
              deprisa, hasta cortar a la bomba en el punto nuevo.
            porque: >-
              Cerrar la válvula añade una pérdida que va con $Q^{2}$, así que
              cambia el coeficiente de $Q^{2}$ y no el término independiente:
              la curva se empina, no sube entera. Si la tuya arranca más
              arriba, has dibujado otra instalación.
        figura: |
          <svg viewBox="0 0 420 300" role="img" width="420" height="300" aria-labelledby="flu2122o11-d-t flu2122o11-d-d">
            <title id="flu2122o11-d-t">La maniobra de la válvula del ejercicio 11: el punto nuevo sobre la curva de la bomba y la pérdida de la válvula</title>
            <desc id="flu2122o11-d-d">Los mismos ejes y las mismas dos curvas del apartado b), con el punto de funcionamiento viejo, 109,98 l/s y 18,37 m, marcado con un círculo hueco. Al maniobrar la válvula, la bomba pasa a dar 19,43 m, la suma de las lecturas del manómetro y del vacuómetro, y su curva da el caudal nuevo, 100 l/s: es el punto nuevo, relleno. A ese caudal la instalación sin maniobrar pide 16,09 m, y un segmento vertical entre las dos curvas marca la pérdida de la válvula, 3,34 m. Una tercera curva, de trazos, es la instalación con la válvula maniobrada: sale también de 5 m pero sube más deprisa y corta a la bomba en el punto nuevo.</desc>
