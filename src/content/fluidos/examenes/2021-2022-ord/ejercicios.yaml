            <title id="flu2122o5-prismas-t">Los prismas de presiones de la compuerta 0AB, dibujados con H = 3 m</title>
            <desc id="flu2122o5-prismas-d">A la izquierda, el agua, con la lámina a 3 m del suelo, sujeta por una pared vertical que baja hasta la articulación A, a 2 m del suelo. La compuerta es el cuarto de círculo de centro 0, que está a la derecha de A y a su misma altura; su cara curva baja de A hasta B, en el suelo bajo 0, y el agua la moja entera. Sombreado encima de la cara curva, entre la vertical de A y la de B y hasta la lámina, el volumen de la fuerza vertical: el cuarto de círculo, de pi metros cuadrados, más un rectángulo de 1 por 2 metros, en total 5,14 metros cuadrados por metro de ancho; ahí no hay agua, porque ocupan ese sitio la compuerta y el aire, y por eso la fuerza vertical va hacia arriba, 151,16 kN, dibujada con una flecha en el centro de gravedad del volumen. A la derecha, el prisma de las presiones horizontales sobre la proyección vertical del arco, de 2 m de alto: un trapecio que vale 9,8 kilopascales a la altura de A y 29,4 en el suelo, con las presiones empujando hacia la derecha. Su fuerza, 117,6 kN hacia la derecha, va a 0,83 m sobre el suelo.</desc>
