        <circle cx="330" cy="138" r="4" fill="var(--ink)"/>
        <text x="338" y="134" font-size="11" fill="var(--ink)">0</text>
        <text x="338" y="244" font-size="11" fill="var(--ink)">B</text>

        <line x1="330" y1="138" x2="392" y2="138" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="279" y1="77" x2="326" y2="133" stroke="var(--alt)" stroke-width="2"
