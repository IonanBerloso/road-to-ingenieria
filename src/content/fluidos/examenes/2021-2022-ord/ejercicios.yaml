        <rect x="230" y="56" width="8" height="82" fill="var(--ink)" opacity=".8"/>
        <line x1="60" y1="230" x2="410" y2="230" stroke="var(--ink)" stroke-width="2"/>
        <g stroke="var(--faint)" stroke-width="1">
          <path d="M66 230 L58 240 M86 230 L78 240 M106 230 L98 240 M126 230 L118 240 M146 230 L138 240 M166 230 L158 240 M186 230 L178 240 M206 230 L198 240 M226 230 L218 240 M246 230 L238 240 M266 230 L258 240 M286 230 L278 240 M306 230 L298 240 M326 230 L318 240 M346 230 L338 240 M366 230 L358 240 M386 230 L378 240 M406 230 L398 240"/>
        </g>

        <path d="M238 138 A 92 92 0 0 0 330 230 L330 138 Z"
              fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <g stroke="var(--faint)" stroke-width="1" opacity=".7">
          <path d="M272 152 L322 152 M280 174 L326 174 M292 196 L328 196"/>
