      La U está **invertida**: el menisco más alto —C— está en la rama que
      más empuja, la del depósito A. Leer la R al revés cambia el signo del
      término de R, y es el error de lectura que más cuesta en este
      ejercicio.

      </figcaption>
      </figure>
    pide: La lectura del manómetro absoluto del depósito A.

    pasos:
      - tipo: reconocer
        pregunta: |
          El líquido $s_2$ ocupa la **parte alta** de un tubo en U invertida.
          ¿Cuál de los dos valores, 3 o 10, le corresponde?
        opciones:
          - texto: >-
              El 3, porque para quedarse arriba tiene que ser más ligero que
              el líquido de los depósitos
            correcta: true
            mensaje: |
              Eso es, y es la única forma de repartir los dos datos. En una U
              invertida el fluido manométrico se sostiene encima del otro, así
              que es el ligero: $s_2 = 3$ y $s_1 = 10$. El impreso da los dos
              números sin subíndice, y es la figura la que decide.
          - texto: >-
              El 10, porque el fluido manométrico siempre es el más denso
            mensaje: |
              Eso vale para una U normal, con el manométrico en el fondo. En
              una U **invertida** es al revés: el manométrico va arriba y
              tiene que ser el ligero, o se caería.
          - texto: >-
              Da igual, porque los dos meniscos están al mismo nivel
            mensaje: |
              No lo están: el enunciado da $R = 30$ cm de desnivel entre C y
              D, y ese desnivel multiplicado por $\gamma_2$ es justamente el
              término que aporta el fluido manométrico.

      - tipo: calcular
        titulo: La presión atmosférica del lugar
        pregunta: |
          ¿Cuánto vale la presión atmosférica que mide el barómetro, en Pa?
        respuesta:
          tipo: magnitud
          valor: '97961 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '101325 Pa'
            mensaje: |
              Esa es la atmósfera **normal**, 760 mm de mercurio. El barómetro
              de la figura marca 735, así que el lugar está algo por encima
              del nivel del mar o hay borrasca.
          - valor: '7203 Pa'
            mensaje: |
              Te has dejado la densidad relativa del mercurio. La columna es
              de mercurio, 13,6 veces más pesado que el agua.
        pista: |
          $H = 735$ mm de mercurio.
        desarrollo: |
          $$
          p_{at} = 0{,}735\cdot 13{,}6\cdot 9800 = 97961\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro A
        pregunta: |
          ¿Cuánto marca el manómetro absoluto del depósito A, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '5.52 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '4.52 kg/cm2'
            mensaje: |
              Esa es la presión **manométrica**. El enunciado subraya que el
              manómetro de A mide absolutas, así que hay que sumarle la
              atmósfera que da el barómetro: casi exactamente un kg/cm².
          - valor: '2.3 kg/cm2'
            mensaje: |
              Has intercambiado los dos líquidos: has puesto $s_1 = 3$ en los
              depósitos y $s_2 = 10$ en la U invertida. El de la U invertida
              tiene que ser el ligero.
        pista: |
          Recorre el circuito desde el manómetro de E hasta el de A, sumando
          al bajar y restando al subir, y comprueba al final que la cota de
          los meniscos se cancela: solo queda su desnivel $R$.
        desarrollo: |
          Con $\gamma_1 = 98000$, $\gamma_2 = 29400$ y el helio despreciable:

          $$
          p_A = p_E + \gamma_1\,(z_E - z_B + R) - \gamma_2 R
          $$
          $$
          p_A = 30000 + 98000\,(10-6+0{,}3) - 29400\cdot 0{,}3
          = 442{,}6\ \text{kPa}
          $$
          $$
          p_{A,abs} = 442580 + 97961 = 540{,}5\ \text{kPa}
          = 5{,}52\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El barómetro de 735 mm de mercurio fija la atmósfera del lugar
              en 97,96 kPa, y sirve para pasar de manométrica a absoluta.
          - texto: >-
              El líquido de la U invertida es el ligero, $s_2 = 3$, y el de
              los depósitos el pesado, $s_1 = 10$.
          - texto: >-
              La cota de los meniscos no hace falta: al recorrer el circuito
              se cancela y solo queda su desnivel de 30 cm.
          - texto: >-
              El helio hay que tenerlo en cuenta porque ocupa dos metros de
              altura entre $z_B$ y $z_A$.
            trampa: true
            mensaje: |
              Ocupa dos metros, sí, pero pesa
              $9{,}67\cdot 10^{-4}$ veces lo que el agua: esos dos metros
              valen **19 pascales** frente a los 540.000 del resultado: tres
              cienmilésimas y media. El dato está en el enunciado para
              que compruebes que sabes despreciarlo con un número, no por
              intuición.
    resolucion: |
      **Lo primero, repartir los dos líquidos.** El enunciado da $s = 3$ y
      $s = 10$ sin decir cuál es cuál, y la figura lo decide: el líquido $s_2$
      ocupa la parte alta de un tubo en U **invertida**, así que tiene que ser
      el ligero. $s_2 = 3$, $s_1 = 10$.

      **El barómetro.** Los 735 mm de mercurio de la esquina no son decoración:
      son los que permiten pasar de la presión manométrica de E a la absoluta
      de A.

      $$
      p_{at} = 0{,}735\cdot 13{,}6\cdot 9800 = 97{,}96\ \text{kPa}
      $$

      **El recorrido.** Desde el manómetro de E, bajando por el líquido pesado
      hasta el menisco D, subiendo $R$ por el ligero hasta C, y siguiendo
      por el pesado hasta la superficie del depósito A. La cota concreta
      de los meniscos se cancela sola: solo sobrevive el desnivel $R$.

      $$
      p_A = p_E + \gamma_1\,(z_E-z_B+R) - \gamma_2 R
      = 30000 + 421400 - 8820 = 442{,}6\ \text{kPa}
      $$

      El helio entre $z_B$ y $z_A$ aporta 19 Pa, que se desprecian.

      $$
      p_{A,abs} = 442580+97961 = 540{,}5\ \text{kPa} = 5{,}52\ \text{kg/cm}^{2}
      $$

      **Las tres trampas del ejercicio, todas de lectura.** Una, que los dos
      líquidos vienen sin etiquetar y hay que asignarlos por la disposición de
      la U. Dos, que un manómetro es absoluto y el otro relativo, y el
      barómetro está ahí para unirlos. Y tres, que el gas se puede despreciar
      pero conviene demostrarlo: son 19 pascales de 540.000.

  # ── 5 (15 %) · Compuerta de cuarto de cilindro con una fuerza aplicada.
  #    La altura máxima sale de anular la reacción del suelo.
  - id: exflu2122-ord-5-la-compuerta-de-cuarto-de-cilindro
    titulo: La compuerta de cuarto de cilindro, y hasta dónde aguanta el agua
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La compuerta 0AB que se muestra en la figura tiene forma de cuarto de
      cilindro de radio $R$ y profundidad $b$. La compuerta es rígida y su
      peso es despreciable. Está articulada en el punto A y en el punto B
      entra en contacto con el suelo. Se ejerce en el punto 0 una fuerza
      $F_1$ con un ángulo $\alpha$, manteniendo la compuerta apoyada en el
      suelo, permitiendo acumular agua en el lado izquierdo:

      **a)** Dibujar los prismas de presiones acotados de las fuerzas que
      actúan sobre la compuerta 0AB en función de $H$.

      **b)** Calcular las fuerzas que actúan sobre la compuerta 0AB en función
      de $H$.

      Sabiendo que el radio de la compuerta es $R = 2$ m y su profundidad es
      $b = 3$ m, se pide:

      **c)** Calcular la altura $H$ **máxima** del agua.

      **d)** Calcular las reacciones en A y B para $H = 3$ [m].

      **Datos**: $F_1 = 450$ kN; $\alpha = 50^{\circ}$.

      **Notas nuestras.** La figura, redibujada abajo, dice esto. A es la
      articulación, en el pie de una pared vertical que sujeta el agua por
      encima de A, a la altura $R$ sobre el suelo. 0 está a la derecha de A, a
      la misma altura y a la distancia $R$, y es el centro del arco. B está
      en el suelo, bajo 0. La cara curva va de A a B bombeando hacia el agua,
      que la moja entera, y $H$ es la profundidad del agua medida desde el
      suelo. $F_1$ se aplica en 0, hacia abajo y hacia la derecha, y $\alpha$
      es su ángulo con la horizontal. *El impreso escribe «450 KN»; va como
      kN.*

      <figure class="figura-examen">
      <svg viewBox="46 44 384 216" role="img" width="440" height="248"
           aria-labelledby="fo5t fo5d">
        <title id="fo5t">La compuerta 0AB de cuarto de cilindro, con el agua a la izquierda</title>
        <desc id="fo5d">Una compuerta rígida con forma de cuarto de cilindro de radio R.
        Su esquina A está a la altura R sobre el suelo, en el pie de una pared
        vertical, y es la articulación. La esquina 0 está a la derecha de A, a
        la misma altura, y es el centro del arco. El punto B está en el suelo,
        justo debajo de 0, y es donde la compuerta apoya. El arco va de A a B
        bombeando hacia abajo y hacia la izquierda. El agua se acumula a la
        izquierda de la pared, moja la cara curva entera hasta B y tiene una
        profundidad H medida desde el suelo, por encima del nivel de A. En 0
        se aplica la fuerza F uno, que forma un ángulo alfa con la horizontal
        y apunta hacia abajo y hacia la derecha.</desc>

