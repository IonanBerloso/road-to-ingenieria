      <figcaption>

      El agua llega **por encima de A**, así que el prisma sobre la parte alta
      del arco no arranca en cero: ese detalle es el que decide el apartado a),
      y es el que se pierde cuando el enunciado se lee sin dibujo.

      </figcaption>
      </figure>
    pide: Las fuerzas hidrostáticas sobre el arco, la altura máxima del agua y las reacciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa que exista una altura $H$ **máxima**?
        opciones:
          - texto: >-
              Que a partir de cierta altura el agua levanta la compuerta, y el
              límite es cuando la reacción del suelo en B se anula
            correcta: true
            mensaje: |
              Eso es, y es el planteamiento entero del apartado c). El suelo
              solo puede **empujar**, nunca tirar; en cuanto el empuje
              vertical del agua y el momento que produce superan a lo que
              $F_1$ sujeta, la compuerta se despega y $B_y$ pasaría a ser
              negativa, que es imposible.
          - texto: >-
              Que por encima de esa altura el agua desborda la compuerta
            mensaje: |
              La compuerta mide $R = 2$ m de alto y el resultado sale
              $H = 6{,}29$ m, así que el agua ya está muy por encima de ella:
              lo que hay encima del arco es una pared de depósito que el
              enunciado no cuestiona. El límite es mecánico, no geométrico.
          - texto: >-
              Que la compuerta se rompe por exceso de tensión
            mensaje: |
              El enunciado dice que la compuerta es **rígida** y que su peso
              es despreciable: no se está estudiando su resistencia sino su
              equilibrio.

      - tipo: calcular
        titulo: El empuje vertical
        pregunta: |
          Con $H = 3$ m, ¿cuánto vale la componente vertical de la fuerza
          hidrostática sobre el arco, en kN?
        respuesta:
          tipo: magnitud
          valor: '151.16 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '92.36 kN'
            mensaje: |
              Te has quedado con el cuarto de círculo. Sobre él hay además
              una columna de agua de $H-R = 1$ m de altura por $R$ de ancho,
              que aporta 58,8 kN más.
          - valor: '58.8 kN'
            mensaje: |
              Esa es solo la columna rectangular. Falta el cuarto de círculo,
              $\gamma\,\pi R^{2}/4\cdot b = 92{,}4$ kN.
        pista: |
          Es el peso del volumen de agua que hay sobre el arco hasta la
          superficie libre: un cuarto de círculo más un rectángulo.
        desarrollo: |
          $$
          F_V = \gamma\Bigl[\frac{\pi R^{2}}{4}+(H-R)R\Bigr]b
          = 9800\,[\pi + 2]\cdot 3 = 151{,}16\ \text{kN}\ (\uparrow)
          $$

      - tipo: dibujar
        consigna: |
          Los prismas de presiones del apartado a), acotados y en función de
          $H$: el de las presiones horizontales, sobre la proyección vertical
          del arco, y el volumen que da la fuerza vertical, sobre la cara
          curva. Con las dos fuerzas y su sentido. Dibújalos con la lámina por
          encima de A, que es el caso del examen; la figura de abajo está hecha
          con $H = 3$ m, el del apartado d), y a escala.
        comprueba:
          - punto: >-
              El prisma horizontal va sobre la **proyección vertical** del
              arco, de la cota de A al suelo, y es un **trapecio**: vale
              $\gamma(H-R)$ arriba y $\gamma H$ abajo, 9,8 y 29,4 kPa con
              $H = 3$ m.
            porque: >-
              El agua llega por encima de A, así que en A la presión ya no es
              cero. Un triángulo que arrancara en cero daría
              $\gamma R^{2}b/2$, que no depende de $H$, y el apartado b) pide
              las fuerzas en función de $H$: el área del trapecio por el ancho
              es $F_H = \gamma(H-R/2)R\,b$, la que imprime el cuadernillo.
          - punto: >-
              Las presiones de ese prisma empujan **hacia la derecha**, del
              agua hacia la compuerta, y $F_H$ va en ese sentido, a
              $1{,}17$ m por debajo de A con $H = 3$ m.
            porque: >-
              El agua está a la izquierda de la cara curva. La fuerza va por el
              centro de gravedad del trapecio, más cerca del suelo que de A
              porque abajo la presión es mayor; con $H = 3$ m son 117,6 kN.
          - punto: >-
              El volumen de la vertical es el que hay **encima de la cara
              curva hasta la lámina libre**, entre la vertical de A y la de B:
              un cuarto de círculo de radio $R$ más un rectángulo de
              $(H-R)\times R$, 5,14 m² por metro de ancho con $H = 3$ m.
            porque: >-
              Ahí no hay agua —ocupan ese sitio la compuerta y el aire que
              tiene encima—, pero es el volumen cuyo peso da la vertical. El
              tope es la lámina libre, no la cota de A: sin el rectángulo
              saldrían 92,4 kN en vez de 151,16.
          - punto: >-
              $F_V$ **hacia arriba**, en el centro de gravedad de ese volumen.
            porque: >-
              El agua está **debajo** de la cara curva, así que la empuja hacia
              arriba: el volumen es imaginario y la fuerza, hacia donde está
              él. Dibujarla hacia abajo cambia el signo del apartado c) entero,
              porque es la fuerza que intenta despegar la compuerta del suelo.
          - punto: >-
              Y la resultante de las dos, si la dibujas, pasa por 0.
            porque: >-
              Cada presión es normal al arco, y en un arco circular todas las
              normales pasan por su centro. Es lo que simplifica el apartado c):
              respecto de A la resultante tiene brazo $R$ solo para su
              componente vertical.
        figura: |
