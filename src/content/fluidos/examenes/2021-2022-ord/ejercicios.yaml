        <line x1="66" y1="92" x2="86" y2="92" stroke="var(--faint)" stroke-width="1"/>
        <line x1="66" y1="230" x2="86" y2="230" stroke="var(--faint)" stroke-width="1"/>
        <text x="62" y="166" text-anchor="end" font-size="11" fill="var(--faint)">H</text>

        <line x1="348" y1="138" x2="348" y2="230" stroke="var(--faint)" stroke-width="1"/>
        <line x1="342" y1="138" x2="354" y2="138" stroke="var(--faint)" stroke-width="1"/>
        <line x1="342" y1="230" x2="354" y2="230" stroke="var(--faint)" stroke-width="1"/>
