ejercicios:
  # ── 1 (5 %) · El perfil parabólico y su cortante, punto a punto. El único
  #    del corpus donde se pide la distribución de tau y no la fuerza.
  - id: exflu2122-ord-1-el-perfil-parabolico-y-su-cortante
    titulo: El perfil parabólico, y el cortante punto a punto
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un flujo de aceite de densidad relativa 0,80 y viscosidad
      $0{,}010\ \text{Pa}\cdot$s fluye a través de un tubo de radio $R$ en
      régimen laminar, siendo la distribución de la velocidad del aceite en el
      tubo **parabólica**.

      Tomando como variables $y$ (m) y velocidad $v$ (m/s), la función que
      relaciona ambas variables es $v = a + b\,y^{2}$, donde $y$ se mide desde
      el eje del tubo.

      La velocidad del aceite en el eje $v_0$ es de $0{,}12$ m/s. El radio del
      tubo es $R = 0{,}1$ m. Se pide:

      **a)** Obtener la velocidad del aceite en cualquier punto de la sección
      como función de las variables $v = v(y, R)$.

      **b)** Obtener la función del esfuerzo cortante existente en el flujo
      como función de las variables $\tau(y, R)$.

      **c)** Rellenar la tabla adjunta para $y/R = 0$, $1/3$, $1/2$, $2/3$
      y $1$.
    pide: El perfil de velocidades, la ley del cortante y sus valores en cinco puntos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos condiciones determinan $a$ y $b$ en $v = a + b\,y^{2}$?
        opciones:
          - texto: >-
              Que en el eje la velocidad valga $v_0$ y que en la pared valga
              cero
            correcta: true
            mensaje: |
              Eso es. La segunda es la **condición de no deslizamiento**: el
              fluido en contacto con la pared se mueve con la pared, y como
              el tubo está quieto, ahí la velocidad es cero. Es la hipótesis
              que hace posible toda la mecánica de fluidos viscosos.
          - texto: >-
              Que la velocidad media sea $v_0$ y que el caudal sea conocido
            mensaje: |
              La velocidad media de un perfil parabólico es la **mitad** de
              la del eje, no $v_0$. Y el caudal no es dato: es consecuencia.
          - texto: >-
              Que el cortante sea nulo en el eje y máximo en la pared
            mensaje: |
              Las dos cosas son ciertas, pero son **resultados** de la
              parábola, no las condiciones que la fijan. Y además no bastan
              para determinar $a$: solo hablan de la derivada.

      - tipo: calcular
        titulo: La velocidad a media distancia de la pared
        pregunta: |
          ¿Cuánto vale la velocidad en $y/R = 1/2$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.09'
          tolerancia: 0.002
          formato: un número en metros por segundo
        distractores:
          - valor: '0.06'
            mensaje: |
              Has usado un perfil **lineal**, $v_0(1-y/R)$. El perfil es
              parabólico, así que la caída va con el cuadrado y a media
              distancia solo se ha perdido una cuarta parte.
          - valor: '0.03'
            mensaje: |
              Has puesto la parábola del revés, $v_0(y/R)^{2}$. Así la
              velocidad sería máxima en la pared y nula en el eje, justo lo
              contrario de lo que hace un fluido viscoso.
        pista: |
          Con $a = v_0$ y $v(R) = 0$ sale $b = -v_0/R^{2}$.
        desarrollo: |
          $$
          v = v_0\Bigl[1-\Bigl(\frac{y}{R}\Bigr)^{2}\Bigr]
          = 0{,}12\Bigl[1-\frac{1}{4}\Bigr] = 0{,}09\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El cortante en la pared
        pregunta: |
          ¿Cuánto vale el esfuerzo cortante en la pared, en mPa? (con su
          signo)
        respuesta:
          tipo: numero
          valor: '-24'
          tolerancia: 0.5
          formato: un número en milipascales, con su signo
        distractores:
          - valor: '-2.4'
            mensaje: |
              Te has dejado un factor $1/R$. La ley es
              $\tau = -2{,}4\cdot 10^{-3}\,y/R^{2}$, y en la pared $y = R$,
              así que queda $-2{,}4\cdot 10^{-3}/R = -0{,}024$ Pa.
          - valor: '-12'
            mensaje: |
              Ese es el valor a media distancia, $y/R = 1/2$. El cortante
              crece **linealmente** desde el eje, así que en la pared vale el
              doble.
          - valor: '0'
            mensaje: |
              Cero es el valor en el **eje**, donde la parábola tiene su
              máximo y la derivada se anula. En la pared es donde el cortante
              es máximo, y es el que arrastra el tubo.
        pista: |
          $\tau = \mu\,dv/dy$, y la derivada de la parábola es lineal en $y$.
        desarrollo: |
          $$
          \frac{dv}{dy} = -\frac{2v_0\,y}{R^{2}}
          \qquad
          \tau = \mu\frac{dv}{dy} = -\frac{2\mu v_0}{R^{2}}\,y
          = -2{,}4\cdot 10^{-3}\,\frac{y}{R^{2}}
          $$
          $$
          \tau(R) = -\frac{2{,}4\cdot 10^{-3}}{0{,}1} = -0{,}024\ \text{Pa}
          = -24\ \text{mPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En el eje $v = v_0$, y en la pared la velocidad es cero por no
              deslizamiento: eso fija $a = v_0$ y $b = -v_0/R^{2}$.
          - texto: >-
              Derivando, el cortante es **lineal** en $y$: nulo en el eje y
              máximo en la pared, $-24$ mPa.
          - texto: >-
              La velocidad decae con el cuadrado y el cortante crece con la
              primera potencia; por eso a media distancia la velocidad ha
              caído un cuarto y el cortante ya va por la mitad.
          - texto: >-
              El signo negativo del cortante indica que el fluido se está
              frenando y que el flujo acabará deteniéndose.
            trampa: true
            mensaje: |
              El signo solo dice **hacia dónde** apunta el esfuerzo respecto
              del eje $y$: la velocidad decrece al alejarse del centro, así
              que $dv/dy < 0$. El flujo no se detiene porque la bomba —o el
              desnivel— repone exactamente lo que el rozamiento consume; eso
              es el régimen permanente.
    resolucion: |
      **a) El perfil.** Dos condiciones bastan. En el eje, $y = 0$, la
      velocidad vale $v_0$, así que $a = v_0$. En la pared, $y = R$, la
      velocidad es **cero** por la condición de no deslizamiento, así que
      $b = -v_0/R^{2}$:

      $$
      v(y) = v_0\Bigl[1-\Bigl(\frac{y}{R}\Bigr)^{2}\Bigr]
      = 0{,}12\Bigl[1-\Bigl(\frac{y}{R}\Bigr)^{2}\Bigr]
      $$

      **b) El cortante.** Ley de Newton con la derivada del perfil:

      $$
      \tau = \mu\,\frac{dv}{dy} = -\frac{2\mu v_0}{R^{2}}\,y
      = -2{,}4\cdot 10^{-3}\,\frac{y}{R^{2}}\ \text{[Pa]}
      $$

      **c) La tabla.**

      | $y/R$ | $v$ (m/s) | $\tau$ (mPa) |
      |---|---|---|
      | 0 | 0,120 | 0 |
      | 1/3 | 0,107 | $-8$ |
      | 1/2 | 0,090 | $-12$ |
      | 2/3 | 0,067 | $-16$ |
      | 1 | 0 | $-24$ |

      **Lo que enseña la tabla, y por eso el examen la pide entera.** La
      velocidad y el cortante van a distinta velocidad: la primera es
      **cuadrática** y el segundo **lineal**. A media distancia de la pared el
      fluido todavía conserva tres cuartas partes de su velocidad, pero el
      cortante ya va por la mitad del máximo. Todo el rozamiento se concentra
      cerca de la pared, y esa es la razón física de que la pérdida de carga
      dependa tanto del diámetro.

      Y un dato que no se usa: la densidad relativa $0{,}80$. En régimen
      laminar el cortante depende de la viscosidad y del gradiente, no de la
      densidad.

  # ── 2 (7,5 %) · El océano compresible. Cinco centésimas de MPa en
  #    kilómetro y medio, y siete kilos por metro cúbico de densidad.
  - id: exflu2122-ord-2-el-oceano-que-se-comprime
    titulo: El océano a mil quinientos metros, con el agua comprimida y sin comprimir
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea conocer la presión existente (MPa) en el océano a $h = 1500$ m
      de profundidad respecto a la superficie.

      **a)** Calcular el valor de la presión en el caso de que el fluido sea
      incompresible y la densidad en la superficie sea
      $\rho_0 = 1025\ \text{kg/m}^{3}$.

      **b)** Calcular el valor de la presión suponiendo que el agua de mar es
      compresible y aumenta su peso específico a medida que aumenta la
      profundidad. Se sabe que el módulo de elasticidad volumétrica del agua
      es de $2{,}1\cdot 10^{8}\ \text{kg/m}^{2}$.

      **c)** Indicar los valores de la densidad del agua de mar en los dos
      casos a) y b) a 1500 m de profundidad.

      Ayuda: ecuación de la estática para fluidos compresibles,
      $dp = \gamma\,dh$.
    pide: La presión a 1.500 m con y sin compresibilidad, y las dos densidades.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la ecuación $p = \gamma h$ deja de valer si el agua se
          comprime?
        opciones:
          - texto: >-
              Porque $\gamma$ ya no es constante con la profundidad, así que
              hay que integrar $dp = \gamma\,dh$ en vez de multiplicar
            correcta: true
            mensaje: |
              Eso es. $p = \gamma h$ es el resultado de integrar suponiendo
              $\gamma$ constante. Si $\gamma$ crece con la presión, la
              integral es otra y sale algo más que la recta.
          - texto: >-
              Porque a esa profundidad la gravedad ya no es la misma
            mensaje: |
              A 1.500 m la gravedad cambia menos de un 0,05 %, y desde luego
              no es lo que el enunciado modela. Lo que cambia es la densidad
              del agua.
          - texto: >-
              Porque el agua de mar tiene sal y la sal se deposita
            mensaje: |
              La salinidad influye en $\rho_0$, que ya está dada. Aquí lo que
              se estudia es un efecto **mecánico**: la compresión bajo su
              propio peso.

      - tipo: calcular
        titulo: La presión sin compresibilidad
        pregunta: |
          ¿Cuánto vale la presión a 1.500 m suponiendo el agua incompresible,
          en MPa?
        respuesta:
          tipo: magnitud
          valor: '15.07 MPa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '14.7 MPa'
            mensaje: |
              Has usado agua dulce, $1000\ \text{kg/m}^{3}$. El agua de mar
              tiene 1.025, y ese 2,5 % son casi cuatro décimas de megapascal.
          - valor: '10.05 MPa'
            mensaje: |
              Parece que has usado 1.000 m de profundidad en vez de 1.500.
        pista: |
          $p = \rho\,g\,h$, con $g = 9{,}8$.
        desarrollo: |
          $$
          p = 1025\cdot 9{,}8\cdot 1500 = 1{,}507\cdot 10^{7}\ \text{Pa}
          = 15{,}07\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La presión con el agua comprimida
        pregunta: |
          Y suponiendo el agua compresible, ¿cuánto vale, en MPa?
        respuesta:
          tipo: numero
          valor: '15.12'
          tolerancia: 0.02
          formato: un número en megapascales
        distractores:
          - valor: '15.07'
            mensaje: |
              Ese es el resultado incompresible. La compresión añade cinco
              centésimas de megapascal, un 0,3 %: poco, pero medible, y el
              apartado existe precisamente para cuantificarlo.
        pista: |
          Con $\rho = \rho_0/(1-p/K)$, la integral de $dp = \rho g\,dh$ da
          $p - p^{2}/(2K) = \rho_0 g h$. Y ojo con $K$, que viene en
          $\text{kg/m}^{2}$.
        desarrollo: |
          $$
          K = 2{,}1\cdot 10^{8}\cdot 9{,}8 = 2{,}058\cdot 10^{9}\ \text{Pa}
          $$
          $$
          p - \frac{p^{2}}{2K} = \rho_0\,g\,h = 1{,}5068\cdot 10^{7}
          $$
          $$
          p = 1{,}512\cdot 10^{7}\ \text{Pa} = 15{,}12\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La densidad a esa profundidad
        pregunta: |
          Con el agua compresible, ¿qué densidad tiene a 1.500 m, en kg/m³?
        respuesta:
          tipo: numero
          valor: '1032.56'
          tolerancia: 0.5
          formato: un número en kilogramos por metro cúbico
        distractores:
          - valor: '1025'
            mensaje: |
              Esa es la de la superficie, y la respuesta del apartado a). En
              el caso compresible sube siete kilos y medio por metro cúbico,
              que es de donde salen las cinco centésimas de megapascal de más.
        pista: |
          $\rho = \rho_0/(1-p/K)$, con la presión que acabas de calcular.
        desarrollo: |
          $$
          \rho = \frac{1025}{1-\dfrac{1{,}512\cdot 10^{7}}{2{,}058\cdot 10^{9}}}
          = \frac{1025}{0{,}99265} = 1032{,}56\ \text{kg/m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el agua incompresible, la presión crece linealmente y a
              1.500 m vale 15,07 MPa.
          - texto: >-
              Si el agua se comprime, $\gamma$ crece con la profundidad y hay
              que integrar; sale 15,12 MPa, un 0,3 % más.
          - texto: >-
              La densidad pasa de 1.025 a 1.032,56 kg/m³, un 0,74 % más.
          - texto: >-
              Como la diferencia es del 0,3 %, el modelo incompresible vale
              también para la fosa de las Marianas.
            trampa: true
            mensaje: |
              El efecto es **cuadrático** con la profundidad, así que no se
              puede extrapolar linealmente. A 11.000 m la corrección ya no es
              del 0,3 % sino de más del 2 %, y la densidad sube unos 50 kg/m³.
              Que un término sea pequeño a una escala no lo hace pequeño a
              todas.
    resolucion: |
      **a) Sin compresibilidad.** Es la fórmula de siempre:

      $$
      p = \rho_0\,g\,h = 1025\cdot 9{,}8\cdot 1500 = 15{,}07\ \text{MPa}
      $$

      **b) Con compresibilidad.** Aquí $\gamma$ crece con la presión, así que
      hay que integrar. La definición del módulo de elasticidad volumétrica da
      la densidad en función de la presión:

      $$
      \rho = \frac{\rho_0}{1-p/K}
      $$

      Y sustituyendo en $dp = \rho\,g\,dh$ e integrando desde la superficie:

      $$
      p - \frac{p^{2}}{2K} = \rho_0\,g\,h
      $$

      Con $K = 2{,}1\cdot 10^{8}\ \text{kg/m}^{2}$, es decir
      $2{,}058\cdot 10^{9}$ Pa —ojo al kilopondio del enunciado—, la ecuación
      de segundo grado da

      $$
      p = 15{,}12\ \text{MPa}
      $$

      **c) Las densidades.** En el caso incompresible, por definición,
      $1025\ \text{kg/m}^{3}$ a cualquier profundidad. En el compresible:

      $$
      \rho = \frac{1025}{1-15{,}12/2058} = 1032{,}56\ \text{kg/m}^{3}
      $$

      **Y lo que hay que llevarse.** Kilómetro y medio de océano comprime el
      agua un 0,74 % y añade un 0,3 % a la presión. Es poco, y por eso la
      hidrostática de este curso trata el agua como incompresible sin
      disculparse. Pero el término existe, es el mismo que produce el golpe de
      ariete, y crece con el **cuadrado** de la profundidad: lo que aquí es
      despreciable, once kilómetros más abajo ya no lo es.

  # ── 3 (7,5 %) · Un canal, su berma de seguridad y el material que habría
  #    que poner para que trabajara en el óptimo.
  - id: exflu2122-ord-3-el-canal-y-su-berma
    titulo: El canal, su berma de seguridad y el material que hay que buscar
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un canal rectangular de ancho $B = 3$ m y con paredes de $H = 1{,}6$ m
      de altura tiene una pendiente de 1 milésima, siendo su coeficiente de
      rugosidad de Manning de $0{,}0128\ \text{s/m}^{1/3}$. Se pide:

      **a)** $Q$ máximo que puede transportar el canal.

      **b)** ¿Cuál deberá ser la berma de seguridad del canal para que
      funcione con máxima eficiencia hidráulica?

      **c)** Si se desea que transporte el caudal del apartado a), determinar
      utilizando los ábacos cuál será el material del nuevo canal a colocar
      para que trabaje en las condiciones del apartado b).
    pide: El caudal máximo, la berma que lo hace óptimo y el material que lo permite.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) pide la berma «para que funcione con máxima
          eficiencia hidráulica». ¿Qué condición geométrica es esa?
        opciones:
          - texto: >-
              Que el calado sea la mitad del ancho, $y = B/2$, que es la
              sección rectangular óptima
            correcta: true
            mensaje: |
              Eso es. El rectángulo hidráulicamente óptimo es medio cuadrado,
              $b = 2y$. Con $B = 3$ m fijo, el calado óptimo es 1,5 m, y lo
              que sobra hasta la coronación es la berma.
          - texto: >-
              Que el canal vaya lleno hasta el borde, que es cuando más
              caudal lleva
            mensaje: |
              Lleno lleva más caudal, sí, pero no es la sección **óptima**:
              óptima significa máximo caudal **para un área dada**, es decir
              perímetro mojado mínimo. Y además dejaría berma cero.
          - texto: >-
              Que el radio hidráulico sea igual al calado
            mensaje: |
              En la sección óptima el radio hidráulico es la **mitad** del
              calado, no el calado. Con $y = 1{,}5$ sale $R_h = 0{,}75$.

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Cuánto vale el caudal máximo del canal tal como está, en m³/s?
        respuesta:
          tipo: magnitud
          valor: '10 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '9.18 m3/s'
            mensaje: |
              Has calculado con el calado óptimo, 1,5 m, que es el del
              apartado b). El máximo es con el canal lleno hasta la
              coronación, 1,6 m.
          - valor: '16.22 m3/s'
            mensaje: |
              Has tomado el radio hidráulico como el área partida por el
              **ancho**, no por el perímetro mojado. $R_h = A/P$, y el
              perímetro cuenta también las dos paredes.
        pista: |
          Lleno hasta arriba: $A = B\,H$ y $P = B + 2H$.
        desarrollo: |
          $$
          A = 3\cdot 1{,}6 = 4{,}8\ \text{m}^{2}
          \qquad
          P = 3+3{,}2 = 6{,}2\ \text{m}
          \qquad
          R_h = 0{,}7742\ \text{m}
          $$
          $$
          Q = \frac{1}{0{,}0128}\,4{,}8\cdot 0{,}7742^{2/3}\sqrt{0{,}001}
          = 10{,}0\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La berma de seguridad
        pregunta: |
          ¿Cuánta berma hay que dejar para que la sección sea óptima, en
          metros?
        respuesta:
          tipo: numero
          valor: '0.1'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es el **calado** óptimo, no la berma. La berma es lo que
              sobra por encima del agua: $1{,}6-1{,}5 = 0{,}1$ m.
          - valor: '0.6'
            mensaje: |
              Parece que has usado $B = 3y$ en vez de $B = 2y$. La sección
              rectangular óptima es medio cuadrado: el doble de ancha que de
              honda.
        pista: |
          Calado óptimo $y = B/2$, y la berma es $H - y$.
        desarrollo: |
          $$
          y_{opt} = \frac{B}{2} = 1{,}5\ \text{m}
          \qquad
          \text{berma} = 1{,}6-1{,}5 = 0{,}1\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente que haría falta
        pregunta: |
          ¿Qué $n$ debería tener el nuevo revestimiento para llevar los mismos
          10 m³/s trabajando en el óptimo?
        respuesta:
          tipo: numero
          valor: '0.0117'
          tolerancia: 0.0002
          formato: un número
        distractores:
          - valor: '0.0128'
            mensaje: |
              Ese es el actual. Con el calado bajado a 1,5 m la sección es
              menor, así que hace falta un revestimiento **más liso** para
              llevar el mismo caudal.
          - valor: '0.0120'
            mensaje: |
              Parece que has mantenido el radio hidráulico de 0,774 m, el del
              canal lleno. Al bajar el calado a 1,5 m el radio pasa a ser
              exactamente $0{,}75$ m.
        pista: |
          Misma fórmula de Manning, con $A = 4{,}5$, $P = 6$ y $Q = 10$.
        desarrollo: |
          $$
          A = 4{,}5\ \text{m}^{2}
          \qquad
          P = 3+3 = 6\ \text{m}
          \qquad
          R_h = 0{,}75\ \text{m}
          $$
          $$
          n = \frac{4{,}5\cdot 0{,}75^{2/3}\sqrt{0{,}001}}{10}
          = 0{,}0117\ \text{s/m}^{1/3}
          $$

          En el cuadro n.º 26 ese valor corresponde a **hormigón acabado** o
          **madera cepillada**, los dos con $n = 0{,}012$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Lleno hasta 1,6 m, el canal lleva 10 m³/s con $n = 0{,}0128$.
          - texto: >-
              La sección óptima de un rectángulo de 3 m de ancho tiene 1,5 m
              de calado, así que la berma es de 10 cm.
          - texto: >-
              Con menos calado el área baja de 4,8 a 4,5 m², así que para
              llevar lo mismo hace falta un revestimiento más liso,
              $n = 0{,}0117$.
          - texto: >-
              Como el canal óptimo lleva menos caudal, la sección óptima es
              peor que la actual.
            trampa: true
            mensaje: |
              La sección óptima no es la que más caudal lleva en absoluto: es
              la que más lleva **para un área dada**. Aquí se compara un área
              de 4,8 m² con otra de 4,5, así que no es una comparación justa.
              Con las **mismas** dimensiones de excavación, la óptima siempre
              gana; lo que pasa es que aquí el ancho está impuesto y solo se
              puede mover el calado.
    resolucion: |
      **a) El caudal máximo.** Lleno hasta la coronación, $y = 1{,}6$ m:

      $$
      A = 4{,}8\ \text{m}^{2}
      \qquad
      P = 6{,}2\ \text{m}
      \qquad
      R_h = 0{,}7742\ \text{m}
      $$
      $$
      Q = \frac{1}{0{,}0128}\,4{,}8\cdot 0{,}7742^{2/3}\sqrt{0{,}001}
      = 10{,}0\ \text{m}^{3}/\text{s}
      $$

      **b) La berma.** La sección rectangular hidráulicamente óptima es medio
      cuadrado, $B = 2y$. Con $B = 3$ m, el calado óptimo es $1{,}5$ m, así
      que la berma es

      $$
      1{,}6-1{,}5 = 0{,}1\ \text{m}
      $$

      **c) El material.** Ahora la incógnita es $n$: se quieren los mismos
      10 m³/s con $A = 4{,}5\ \text{m}^{2}$ y $R_h = 0{,}75$ m:

      $$
      n = \frac{A\,R_h^{2/3}\sqrt{S}}{Q} = 0{,}0117\ \text{s/m}^{1/3}
      $$

      En el cuadro n.º 26, el valor disponible más próximo por debajo es
      $0{,}012$: **hormigón acabado** o **madera cepillada**. Los dos sirven, y
      además dejan un pequeño margen a favor.

      **La lectura de ingeniería.** Bajar el calado 10 cm cuesta un 6 % del
      área, y ese 6 % hay que recuperarlo alisando la pared. La sección óptima
      no sale gratis: sale de un compromiso entre lo que se excava y lo que se
      reviste, y aquí el examen obliga a ponerle número a los dos lados.

  # ── 4 (7,5 %) · Dos depósitos, helio, un manómetro absoluto y otro
  #    relativo, y un barómetro de mercurio en el mismo dibujo.
  - id: exflu2122-ord-4-los-dos-depositos-y-el-helio
    titulo: Dos depósitos, un gas que no pesa y un barómetro en la misma figura
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 2 de junio de 2022 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra dos depósitos de gran tamaño unidos por un manómetro
      diferencial. Mientras uno de los tanques está parcialmente lleno con
      helio y un líquido de densidad relativa $s_1$, el otro está
      completamente lleno con el mismo líquido. Los pesos específicos
      relativos de los líquidos son $s = 3$ y $s = 10$. El peso específico
      relativo del helio es $s_{He} = 9{,}67\cdot 10^{-4}$. El manómetro del
      depósito **A** mide presiones **absolutas** mientras que el manómetro
      del depósito **E** mide presiones **manométricas**.

      **a)** Calcular la lectura del manómetro A (kg/cm²).

      Datos: $s_{Hg} = 13{,}6$; $H = 735$ mm; $P_E = 0{,}3$ bar; $R = 30$ cm;
      $z_A = 8$ m; $z_B = 6$ m; $z_E = 10$ m.

      <figure class="figura-examen">
      <svg viewBox="40 34 434 216" role="img" width="440" height="219"
           aria-labelledby="fo4t fo4d">
        <title id="fo4t">Los dos depósitos unidos por el manómetro diferencial invertido</title>
        <desc id="fo4d">Dos depósitos grandes unidos por su fondo mediante un
        tubo que sube en el centro formando una U invertida. El depósito A, a
        la izquierda, está parcialmente lleno de un líquido de densidad
        relativa s uno, con helio encima, y su manómetro mide presiones
        absolutas. El depósito E, a la derecha, está completamente lleno del
        mismo líquido y su manómetro mide presiones manométricas. En la parte
        alta de la U invertida hay un segundo líquido, s dos, más ligero: su
        menisco C, en la rama izquierda, queda R por encima del menisco D de
        la rama derecha. Arriba, separado, un barómetro de mercurio de altura
        H da la presión atmosférica.</desc>

        <rect x="60" y="118" width="90" height="82" fill="var(--alt)" fill-opacity=".14"/>
        <rect x="60" y="86" width="90" height="32" fill="var(--faint)" fill-opacity=".10"/>
        <rect x="60" y="86" width="90" height="114" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="60" y1="118" x2="150" y2="118" stroke="var(--alt)" stroke-width="1.6"/>
        <text x="105" y="106" text-anchor="middle" font-size="10" fill="var(--faint)">Helio</text>
        <text x="105" y="164" text-anchor="middle" font-size="11" fill="var(--alt)">s₁</text>
        <text x="66" y="212" font-size="11" fill="var(--ink)">A</text>

        <rect x="350" y="66" width="100" height="134" fill="var(--alt)" fill-opacity=".14"
              stroke="var(--ink)" stroke-width="1.8"/>
        <text x="400" y="140" text-anchor="middle" font-size="11" fill="var(--alt)">s₁</text>
        <text x="438" y="212" font-size="11" fill="var(--ink)">E</text>

        <path d="M150 190 L150 212 L215 212 L215 158 Q215 150 223 150 L247 150 Q255 150 255 158 L255 212 L350 212 L350 190"
              fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <path d="M215 166 L215 158 Q215 152 221 152 L249 152 Q255 152 255 158 L255 194"
              fill="none" stroke="var(--faint)" stroke-width="6" opacity=".5"/>
        <text x="272" y="150" font-size="11" fill="var(--faint)">s₂</text>
        <text x="207" y="170" text-anchor="end" font-size="11" fill="var(--ink)">C</text>
        <text x="262" y="198" font-size="11" fill="var(--ink)">D</text>
        <line x1="292" y1="166" x2="292" y2="194" stroke="var(--faint)" stroke-width="1"/>
        <line x1="286" y1="166" x2="298" y2="166" stroke="var(--faint)" stroke-width="1"/>
