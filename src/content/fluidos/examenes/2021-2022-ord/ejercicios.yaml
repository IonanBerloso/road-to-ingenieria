        <text x="156" y="122" font-size="10" fill="var(--faint)">zB = 6 m</text>

        <circle cx="400" cy="52" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M400 61 L400 66 M400 52 L405 47" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="414" y="50" font-size="10" fill="var(--faint)">zE = 10 m</text>
        <text x="414" y="62" font-size="10" fill="var(--faint)">pE = 0,3 bar</text>

        <path d="M276 96 L276 44 M276 96 L306 96 L306 44" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M276 94 L276 52" stroke="var(--flag)" stroke-width="5" opacity=".45"/>
        <text x="312" y="60" font-size="10" fill="var(--flag)">barómetro de Hg</text>
        <line x1="260" y1="52" x2="260" y2="94" stroke="var(--faint)" stroke-width="1"/>
        <line x1="254" y1="52" x2="266" y2="52" stroke="var(--faint)" stroke-width="1"/>
        <line x1="254" y1="94" x2="266" y2="94" stroke="var(--faint)" stroke-width="1"/>
