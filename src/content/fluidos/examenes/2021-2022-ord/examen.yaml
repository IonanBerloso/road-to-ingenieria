# **Los once ejercicios.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, y la convocatoria más larga del cuadernillo: once enunciados
# en lugar de los ocho o nueve habituales.
#
# Porcentajes impresos: 5 / 7,5 / 7,5 / 7,5 / 15 / 10 / 5 / 5 / 15 / 7,5 /
# 15, sin reparto por competencia, así que van sin `puntos`.
#
# Los once reconstruidos hasta aterrizar en el resultado impreso, incluidos
# los tres que no dan número —el 6, el 8 y el 10—, cuyas respuestas
# simbólicas se deducen enteras.
#
# Lo que este examen aporta al corpus:
#
# - **El perfil parabólico y su cortante** (ej. 1), que es el único
#   ejercicio del corpus donde se pide la distribución de $\tau$ punto a
#   punto en vez de la fuerza total.
# - **El océano compresible** (ej. 2): 15,07 MPa si el agua no se comprime y
#   15,12 si sí. Cinco centésimas de megapascal en kilómetro y medio, y la
#   densidad sube de 1.025 a 1.032,6.
# - **Una compuerta de cuarto de cilindro con una fuerza aplicada** (ej. 5),
#   donde la altura máxima del agua sale de anular la reacción del suelo.
# - **Dos manómetros sobre el mismo venturímetro** (ej. 6), uno con fluido
#   más ligero y otro más pesado, y el cociente de sus lecturas.
# - **Un cono que desvía un chorro vertical** (ej. 7), con el ángulo de 70º
#   que hay que partir por la mitad y un coeficiente de contracción que
#   sobra.
# - **Dos ramales en paralelo con la bomba en uno solo** (ej. 9), enteramente
#   en régimen laminar: Poiseuille en vez de Colebrook.
