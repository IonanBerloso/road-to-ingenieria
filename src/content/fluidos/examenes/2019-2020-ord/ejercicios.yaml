      un límite para u antes de que el tornillo reviente.

      </figcaption>
      </figure>
    pide: La velocidad del chorro, el semiángulo del cono y la velocidad del cono que rompe el tornillo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El factor de paso $k = 0{,}04$ está referido «a la salida». ¿Con qué
          velocidad se aplica?
        opciones:
          - texto: >-
              Con la de la tobera, la de salida, porque es a la que está
              referido
            correcta: true
            mensaje: |
              Eso es, y conviene mirarlo siempre: un mismo accesorio con el
              mismo $k$ pierde cosas muy distintas según a qué velocidad se
              refiera. Aquí la tobera estrecha de 54 a 25 cm, así que la
              velocidad de salida es casi cinco veces la de la tubería.
          - texto: >-
              Con la de la tubería, que es donde está el manómetro
            mensaje: |
              El manómetro está en la tubería, sí, pero el enunciado da el
              factor de paso «a la salida» de la tobera, y ahí la velocidad es
              la del chorro. Usar la de la tubería divide la pérdida por casi 22.
          - texto: >-
              Con la media de las dos
            mensaje: |
              No hay tal promedio: un factor de paso siempre se refiere a una
              velocidad concreta, y el enunciado dice cuál.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad sale el chorro, en m/s?
        respuesta:
          tipo: magnitud
          valor: '16.63 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '5.25 m/s'
            mensaje: |
              Has tomado el $1{,}4\ \text{kg/cm}^{2}$ como 1,4 metros de
              columna de agua. Un kilo por centímetro cuadrado son **diez**
              metros de columna, así que la presión disponible es de 14 m.
          - valor: '11.64 m/s'
            mensaje: |
              Has aplicado el $C_d = 0{,}7$ a la velocidad. El coeficiente de
              descarga corrige el **caudal**, no la velocidad de salida; la
              velocidad sale de Bernoulli.
        pista: |
          Bernoulli entre el manómetro y la salida, con
          $v_1 = v_2\,(d/D)^{2}$ y la pérdida referida a $v_2$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{1{,}4\cdot 98000}{9800} = 14\ \text{m}
          \qquad
          \frac{A_1}{A_2} = \Bigl(\frac{54}{25}\Bigr)^{2} = 4{,}666
          $$
          $$
          14 = \frac{v_2^{2}}{2g}\Bigl(1+0{,}04-\frac{1}{4{,}666^{2}}\Bigr)
          = 0{,}994\,\frac{v_2^{2}}{2g}
          $$
          $$
          v_2 = 16{,}61\ \text{m/s}
          $$

          El impreso da 16,63 m/s; la casilla acepta los dos.

      - tipo: calcular
        titulo: El semiángulo del cono
        pregunta: |
          ¿Qué semiángulo $\alpha$ debe tener el cono para que el tornillo no
          pase de los dos tercios de su carga de rotura, en grados?
        respuesta:
          tipo: numero
          valor: '9.73'
          tolerancia: 0.12
          formato: un número en grados
        distractores:
          - valor: '11.92'
            mensaje: |
              Has usado la carga de rotura entera, 205 N, en vez de los dos
              tercios que pide el enunciado. El ángulo va con la raíz de la
              fuerza para ángulos pequeños, así que un 50 % más de fuerza es
              un 22 % más de ángulo.
          - valor: '8.14'
            mensaje: |
              Te has dejado el coeficiente de descarga en el caudal. El chorro
              real lleva un 70 % del caudal teórico, así que empuja menos y
              admite un cono algo más abierto.
        pista: |
          El cono desvía el chorro $\alpha$ respecto del eje, así que la
          fuerza axial es $\rho Q v\,(1-\cos\alpha)$. El caudal es
          $Q = C_d\,A_2\,v_t$, con la velocidad **teórica**, la de Bernoulli
          sin la pérdida de la tobera: así define el curso el coeficiente de
          descarga.
        desarrollo: |
          $$
          v_t = \sqrt{\frac{2g\cdot 14}{1-(25/54)^{4}}} = 16{,}96\ \text{m/s}
          \qquad
          Q = C_d\,A_2\,v_t = 0{,}7\cdot 0{,}04909\cdot 16{,}96
          = 0{,}5827\ \text{m}^{3}/\text{s}
          $$
          $$
          \rho Q v = 1000\cdot 0{,}5827\cdot 16{,}63 = 9691\ \text{N}
          $$
          $$
          \rho Q v\,(1-\cos\alpha) = \tfrac23\cdot 205 = 136{,}7\ \text{N}
          \;\Longrightarrow\;
          1-\cos\alpha = 0{,}01410
          \;\Longrightarrow\;
          \alpha = 9{,}63^{\circ}
          $$

          Es el resultado impreso. Si el caudal se toma con la velocidad real,
          $Q = C_d A_2 v_2 = 0{,}5714$ m³/s, sale $\alpha = 9{,}73^{\circ}$: es
          aplicar dos veces la reducción de velocidad, una en la pérdida de la
          tobera y otra en el $C_d$, pero la diferencia es de una décima y la
          casilla acepta las dos, de 9,61 a 9,85. Lo que no acepta es olvidar
          la pérdida de la tobera, que da 9,54.

      - tipo: calcular
        titulo: La velocidad límite del cono
        pregunta: |
          Si el motor lleva el cono contra el chorro a velocidad $u$, ¿cuál es
          la $u$ con la que el tornillo llega a su carga de rotura, en m/s?
        respuesta:
          tipo: magnitud
          valor: '3.74 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '8.32 m/s'
            mensaje: |
              Has dejado fijo el caudal que llega al cono, como en una rueda de
              muchos álabes. Un solo cono que avanza hacia el chorro «se come»
              más agua cada segundo: recibe $\rho A_j (v+u)$, y la fuerza va con
              el cuadrado de $v+u$.
          - valor: '20.37 m/s'
            mensaje: |
              Esa es $v+u$, la velocidad del agua **respecto del cono**. La que
              se pide es la del cono: réstale los 16,63 m/s del chorro.
        pista: |
          Respecto del cono el agua llega a $v+u$, y el caudal que lo alcanza
          también va con $v+u$: $F = \rho\,A_j\,(v+u)^{2}\,(1-\cos\alpha)$.
          Con el cono del apartado b), a $u = 0$ la fuerza es $\tfrac23$ de la
          de rotura.
        desarrollo: |
          Con el mismo cono, la fuerza va con $(v+u)^{2}$:

          $$
          \Bigl(\frac{v+u}{v}\Bigr)^{2} = \frac{205}{\tfrac23\cdot 205} = 1{,}5
          \;\Longrightarrow\;
          u = v\,(\sqrt{1{,}5}-1) = 16{,}63\cdot 0{,}2247 = 3{,}74\ \text{m/s}
          $$

          No hace falta ni el ángulo ni el caudal: el apartado b) ha dejado el
          tornillo en los dos tercios de su rotura, y lo que queda es cuánto
          hay que subir la velocidad relativa para llegar al 150 % de esa
          fuerza.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la tubería y la salida, con la pérdida referida
              a la velocidad de salida, da $v_2 = 16{,}6$ m/s.
          - texto: >-
              El cono desvía el chorro un ángulo $\alpha$ respecto del eje, y
              la fuerza axial que recibe es $\rho Q v(1-\cos\alpha)$.
          - texto: >-
              Limitando esa fuerza a dos tercios de la carga de rotura sale un
              cono muy cerrado, de menos de diez grados.
          - texto: >-
              Un cono más cerrado abarcaría más superficie de limpieza, que es
              lo que se busca.
            trampa: true
            mensaje: |
              Es al revés: cuanto **más abierto** el cono, más se abre el
              chorro y más superficie barre. Por eso el diseño está en
              tensión: el área de limpieza pide abrir el cono y el tornillo
              pide cerrarlo. Los nueve grados y pico son el compromiso, y son
              el resultado del problema, no un punto de partida.
    resolucion: |
      **a) La velocidad de salida.** Bernoulli entre el punto donde está el
      manómetro y la salida de la tobera, con la pérdida referida a la
      velocidad de salida:

      $$
      \frac{p}{\gamma}+\frac{v_1^{2}}{2g}
      = \frac{v_2^{2}}{2g}+k\frac{v_2^{2}}{2g}
      $$

      Con $p/\gamma = 14$ m y $v_1 = v_2/4{,}666$:

      $$
      14 = 0{,}994\,\frac{v_2^{2}}{2g}
      \qquad
      v_2 = 16{,}61\ \text{m/s}
      $$

      El impreso da 16,63. El $C_d = 0{,}7$ **no** corrige la velocidad:
      corrige el caudal, y hace falta en el apartado siguiente.

      **b) El cono.** El chorro llega al vértice del cono y sale deslizando
      por su superficie, desviado un ángulo $\alpha$ respecto del eje. La
      fuerza axial es la de siempre:

      $$
      F = \rho\,Q\,v\,(1-\cos\alpha)
      \qquad
      Q = C_d A_2 v_t = 0{,}583\ \text{m}^{3}/\text{s}
      $$

      con el caudal como define el curso el coeficiente de descarga, sobre la
      velocidad teórica, sin la pérdida de la tobera: $v_t = 16{,}96$ m/s en
      vez de 16,61. Imponiendo $F \le \tfrac23\cdot 205 = 136{,}7$ N:

      $$
      1-\cos\alpha \le 0{,}01410
      \qquad
      \alpha = 9{,}63^{\circ}
      $$

      que es lo impreso. Con el caudal sobre la velocidad real saldrían
      $9{,}73^{\circ}$: una décima, y la casilla acepta las dos.

      **c) El cono que avanza.** Con el cono yendo hacia el chorro a $u$, el
      agua lo alcanza a $v+u$ y, como es un solo cuerpo que avanza, también
      recibe más caudal: $\rho A_j (v+u)$. La fuerza va con $(v+u)^{2}$, y
      el tornillo, que el apartado b) dejó en dos tercios de su rotura, rompe
      cuando esa fuerza sube un 50 %:

      $$
      \frac{v+u}{v} = \sqrt{1{,}5}
      \qquad
      u = 16{,}63\,(\sqrt{1{,}5}-1) = 3{,}74\ \text{m/s}
      $$

      Es el resultado impreso, y no depende ni del ángulo ni del caudal.

      **La tensión de diseño**, que es lo que el ejercicio quiere que veas: el
      área de limpieza pide abrir el cono y el tornillo pide cerrarlo. Diez
      grados es lo que aguanta el tornillo con el cono quieto, y en cuanto el
      motor lo mueve contra el chorro, el margen de los dos tercios se va en
      menos de 4 m/s.

  # ── 5 (12 %) · Semejanza de dos turbobombas: análisis dimensional
  #    aplicado a máquinas y no a flujos.
  - id: exflu1920-ord-5-las-dos-turbobombas-semejantes
    titulo: Dos turbobombas semejantes, y qué número se puede respetar
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La experiencia y la experimentación demuestran que el rendimiento de una
      turbobomba $\eta$ depende del caudal bombeado $Q$, de la velocidad de
      giro del rodete $n$, de la densidad $\rho$ y de la viscosidad dinámica
      $\mu$ del líquido bombeado, del diámetro del rodete $D$ y de la
      gravedad $g$.

      **a)** Deducir los parámetros adimensionales que intervienen en el
      fenómeno físico mediante el método rápido o intuitivo, si se toman como
      variables repetidas $\rho$, $n$ y $D$.

      En el laboratorio de modelos de hidráulica se dispone de dos
      turbobombas A y B, geométricamente semejantes. El diámetro del rodete de
      la turbobomba B es $D_B = 300$ mm y el de la turbobomba A es
      $D_A = 200$ mm. Ambas turbobombas bombean agua a la misma temperatura.

      **b)** ¿Es posible obtener la semejanza absoluta entre las dos
      turbobombas? Razonar la respuesta.

      **c)** Sí se desea que se cumpla la semejanza restringida de Reynolds,
      calcular la velocidad de giro y el caudal a bombear por la turbobomba B,
      si la velocidad de giro de la turbobomba A es $n_A = 1000$ rpm y
      descarga un caudal $Q_A = 7\ \text{m}^{3}/\text{min}$ de agua.

      **d)** ¿Qué turbobomba obtendrá un mejor rendimiento? Razonar la
      respuesta.

      **Notas nuestras.** El ejercicio no trae figura. *El impreso escribe
      «Sí se desea», con tilde; es la conjunción «si».*
    pide: Los adimensionales de una turbobomba, y el punto equivalente de la máquina mayor.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una máquina, ¿qué papel hace la velocidad de giro $n$ que en un
          flujo hacía la velocidad $v$?
        opciones:
          - texto: >-
              El de escala de tiempos: $nD$ es la velocidad periférica del
              rodete, y con ella se construyen todos los adimensionales
            correcta: true
            mensaje: |
              Eso es. En una turbomáquina la velocidad característica no es
              una velocidad del fluido sino la del álabe, $u = \pi n D$. Por
              eso los grupos salen con $nD$ donde en un flujo saldría $v$:
              $Q/(nD^{3})$ en vez de $Q/(vD^{2})$, y así todos.
          - texto: >-
              Ninguno: $n$ es un dato de la máquina y no entra en los
              adimensionales
            mensaje: |
              Es una de las tres variables **repetidas** que el enunciado
              impone, así que entra en todos los grupos. Y físicamente es la
              que fija la escala de tiempos del problema.
          - texto: >-
              El de la frecuencia de un fenómeno oscilatorio, como en Strouhal
            mensaje: |
              La forma se parece, pero aquí no hay ningún desprendimiento
              periódico que medir: $n$ es la velocidad de la máquina, y su
              papel es dar la velocidad de referencia $nD$.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, por el método que pide el enunciado: con
          $\rho$, $n$ y $D$ como repetidas, cada grupo se construye mirando qué
          combinación de ellas tiene las dimensiones de la variable, sin
          plantear el sistema de exponentes. Empieza por la lista de variables
          con sus dimensiones y por cuántos grupos tienen que salir.
        rubrica:
          - punto: |
              **Las siete variables con sus dimensiones**: $\eta$ [–],
              $Q$ [L³T⁻¹], $n$ [T⁻¹], $\rho$ [ML⁻³], $\mu$ [ML⁻¹T⁻¹], $D$ [L]
              y $g$ [LT⁻²].
            porque: |
              Son los pasos 1 a 3 de la diapositiva 7 del tema 16, y sin la
              tabla de dimensiones no hay nada que mirar: el método rápido
              consiste en compararlas. El rendimiento entra en la lista
              aunque ya sea adimensional, porque es la variable que se
              estudia.
            minimo: true
          - punto: |
              **Las repetidas, $\rho$, $n$ y $D$, y por qué valen**: cubren M,
              L y T, y ninguna se obtiene combinando las otras dos.
            porque: |
              Es el paso 4 de la misma diapositiva: «tantas como dimensiones
              fundamentales», y que las engloben. Aquí $\rho$ trae la masa,
              $n$ el tiempo y $D$ la longitud, cada una con una dimensión que
              las otras dos no tienen. El enunciado las impone: grupos hechos
              con otras repetidas no son los que se piden.
            minimo: true
          - punto: |
              **Cuántos grupos salen**: $7 - 3 = 4$, y uno es el propio
              $\eta$.
            porque: |
              Es el teorema de la diapositiva 6, $n - m$ parámetros con
              $m = 3$ en mecánica de fluidos. Contar cuatro dice cuántos hay
              que encontrar, y que el rendimiento es uno de ellos tal cual.
            minimo: true
          - punto: |
              **Cada grupo, por inspección**: se busca la combinación de
              $\rho$, $n$ y $D$ con las dimensiones de la variable y se divide
              por ella. $Q$ es un volumen por unidad de tiempo, como $nD^{3}$;
              $\mu$ es una densidad por una velocidad por una longitud, como
              $\rho\,nD\cdot D$; $g$ es una aceleración, como $n^{2}D$.
            porque: |
              Es lo que el enunciado llama «método rápido o intuitivo»: el
              mismo resultado que el sistema de exponentes del paso 5, sin
              plantear las tres ecuaciones. Ni las diapositivas ni los Apuntes
              lo describen con ese nombre, y se entiende así: igualar
              dimensiones mirando, en vez de resolviendo.
            minimo: true
          - punto: |
              **La comprobación de cada grupo**: $\pi_2 = Q/(nD^{3})$,
              $\pi_3 = \mu/(\rho D^{2}n)$ y $\pi_4 = g/(Dn^{2})$, sin
              dimensiones.
            porque: |
              Es el paso 6 de la diapositiva 7. Mirando es más fácil
              equivocarse en un exponente que resolviendo, y la comprobación es
              lo que lo caza: un grupo al que le sobra una dimensión no es un
              parámetro.
          - punto: |
              **Qué es cada uno**: $\pi_2$, el coeficiente de caudal; $\pi_3$,
              el inverso de un Reynolds hecho con la velocidad periférica
              $nD$; $\pi_4$, el inverso de un Froude al cuadrado con esa misma
              velocidad.
            porque: |
              No lo pide el a), pero es lo que usan el b) y el c): el grupo
              con $\mu$ es el que manda en la semejanza restringida de
              Reynolds, y el de $g$ es el que choca con él.
        veredicto: |
          Si en tu folio están los cuatro grupos, cada uno con la combinación
          de repetidas que lo iguala y su comprobación, el apartado está
          entero, y cabe en media cara. Si has llegado a ellos resolviendo el
          sistema de exponentes, el resultado es el mismo, pero el enunciado
          pide el camino corto.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: si la semejanza absoluta es posible entre
          las dos turbobombas, que bombean la misma agua a la misma
          temperatura. Apóyate en los grupos del a): dos de ellos ponen
          condiciones a la vez sobre $D$ y $n$.
        rubrica: semejanza-absoluta
        veredicto: |
          Si tu folio iguala $\pi_3$ y $\pi_4$ a la vez y llega a que, con el
          mismo fluido y la misma gravedad, solo se cumplen las dos con
          $D_A = D_B$, tienes el apartado: con 200 y 300 mm, no. Y si dices
          cuál se sacrifica —el c) elige Reynolds—, tienes también el último
          punto.

      - tipo: calcular
        titulo: La velocidad de giro de la turbobomba grande
        pregunta: |
          Respetando el Reynolds, ¿a qué velocidad debe girar la turbobomba B,
          en rpm?
        respuesta:
          tipo: magnitud
          valor: '444.4 rpm'
          tolerancia: 0.02
          formato: una velocidad de giro, con su unidad
        distractores:
          - valor: '666.7 rpm'
            mensaje: |
              Has usado la escala a la primera potencia. En el número que
              contiene la viscosidad, $\mu/(\rho D^{2}n)$, el diámetro va al
              **cuadrado**: $n_B = n_A (D_A/D_B)^{2}$.
          - valor: '2250 rpm'
            mensaje: |
              Lo has puesto del revés. La máquina grande gira **más despacio**
              para mantener el mismo Reynolds, no más deprisa.
        pista: |
          El tercer grupo, $\mu/(\rho D^{2}n)$, con el mismo fluido en las dos.
        desarrollo: |
          $$
          D_A^{2}n_A = D_B^{2}n_B
          \;\Longrightarrow\;
          n_B = 1000\Bigl(\frac{200}{300}\Bigr)^{2} = 444{,}4\ \text{rpm}
          $$

      - tipo: calcular
        titulo: El caudal de la turbobomba grande
        pregunta: |
          ¿Y qué caudal descarga, en m³/min?
        respuesta:
          tipo: magnitud
          valor: '10.5 m3/min'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '23.6 m3/min'
            mensaje: |
              Has aplicado solo la relación de diámetros al cubo y has
              olvidado que la máquina grande gira más despacio, lo que
              descuenta un factor $0{,}444$.
          - valor: '4.67 m3/min'
            mensaje: |
              Lo has puesto del revés: la máquina grande mueve **más** caudal,
              no menos, pese a girar más despacio.
        pista: |
          $Q/(nD^{3})$ igual en las dos.
        desarrollo: |
          $$
          \frac{Q_B}{Q_A} = \frac{n_B}{n_A}\Bigl(\frac{D_B}{D_A}\Bigr)^{3}
          = 0{,}4444\cdot 3{,}375 = 1{,}5
          $$
          $$
          Q_B = 7\cdot 1{,}5 = 10{,}5\ \text{m}^{3}/\text{min}
          $$

      - tipo: justificar
        pregunta: Ordena las respuestas a b) y d). Una pieza es falsa.
        piezas:
          - texto: >-
              Los grupos son $\eta$, $Q/(nD^{3})$, $\mu/(\rho D^{2}n)$ y
              $g/(Dn^{2})$.
          - texto: >-
              Con el mismo fluido, el tercero pide $D^{2}n$ constante y el
              cuarto $Dn^{2}$ constante: incompatibles salvo con $D_A = D_B$.
              La semejanza absoluta es **imposible**.
          - texto: >-
              Respetando solo Reynolds, la máquina grande gira a 444,4 rpm y
              descarga 10,5 m³/min.
          - texto: >-
              Como la turbobomba B es mayor, tendrá mejor rendimiento que la A.
            trampa: true
            mensaje: |
              Tendrán **el mismo**. El rendimiento es él mismo uno de los
              adimensionales, $\pi_1 = \eta$, así que si los demás coinciden
              —y en el punto calculado coinciden $\pi_2$ y $\pi_3$— el
              rendimiento tiene que coincidir también. Que las máquinas
              grandes rindan más en la práctica es un efecto de escala real
              —holguras y rugosidades relativas menores— que este modelo no
              recoge.
    resolucion: |
      **a) Los cuatro grupos.** Siete variables y tres dimensiones dan cuatro
      grupos, y uno es el propio rendimiento, que ya es adimensional. Por el
      método rápido, cada una de las otras se divide por la combinación de
      $\rho$, $n$ y $D$ que tiene sus dimensiones: $Q$ [L³T⁻¹] por $nD^{3}$;
      $\mu$ [ML⁻¹T⁻¹] por $\rho\,nD^{2}$; $g$ [LT⁻²] por $n^{2}D$.

      $$
      \pi_1 = \eta
      \qquad
      \pi_2 = \frac{Q}{n\,D^{3}}
      \qquad
      \pi_3 = \frac{\mu}{\rho\,D^{2}n}
      \qquad
      \pi_4 = \frac{g}{D\,n^{2}}
      $$

      El $\pi_2$ es el **coeficiente de caudal**; el $\pi_3$, el inverso de un
      Reynolds hecho con la velocidad periférica $nD$, y el $\pi_4$, el
      inverso de un Froude al cuadrado con esa misma velocidad.

      **b) La semejanza absoluta.** Con el mismo fluido, $\pi_3$ exige
      $D^{2}n$ constante y $\pi_4$ exige $D\,n^{2}$ constante. Dividiendo una
      condición por la otra sale $D = $ constante: las dos máquinas tendrían
      que tener el mismo diámetro. **Imposible.**

      **c) La semejanza restringida de Reynolds.**

      $$
      n_B = n_A\Bigl(\frac{D_A}{D_B}\Bigr)^{2} = 444{,}4\ \text{rpm}
      \qquad
      Q_B = Q_A\,\frac{n_B}{n_A}\Bigl(\frac{D_B}{D_A}\Bigr)^{3}
      = 10{,}5\ \text{m}^{3}/\text{min}
      $$

      **d) El rendimiento.** El mismo en las dos. El rendimiento **es** uno de
      los adimensionales, y en el punto calculado coinciden $\pi_2$ y
      $\pi_3$: si el fenómeno depende solo de esos grupos, $\eta$ no puede
      salir distinto.

      **Lo que hay que llevarse.** El análisis dimensional de una turbomáquina
      es el mismo de siempre con una sustitución: donde en un flujo va $v$,
      aquí va $nD$. Y la conclusión es la de las leyes de semejanza que el
      tema 22 usa a diario —$Q \propto nD^{3}$, $H \propto n^{2}D^{2}$— pero
      deducida en vez de recordada.

  # ── 6 (12 %) · Una turbina entre dos tuberías, con el diámetro de la
  #    primera deducido de la potencia que se pierde en ella.
  - id: exflu1920-ord-6-la-turbina-entre-dos-tuberias
    titulo: La turbina de la montaña, y el diámetro que sale de una pérdida
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de la imagen, el agua fluye desde el embalse A
      (situado a una cota de 900 m) hasta el depósito B presurizado a 5,5 bar
      (situado a 815 m). Gracias a la turbina hidráulica ubicada entre las
      tuberías 1 y 2, se abastece de electricidad la escuela de una población
      situada en la montaña. El rendimiento de la turbina es 0,78. Los datos
      de las tuberías son:

      - Tubería 1: longitud de 275 m, diámetro desconocido, material PVC.
      - Tubería 2: longitud de 90 m, diámetro de 200 mm, material hormigón.

      Las pérdidas menores que hay que tener en cuenta son las generadas por
      siete codos de 90º instalados en la tubería 1. La longitud equivalente
      de cada codo es de 9 m. La potencia total perdida en la tubería 1,
      teniendo en cuenta también las pérdidas menores, es de 1,5 kW. Se pide
      **calcular mediante Darcy-Weisbach**:

      **a)** El diámetro exacto de la tubería 1 (mm) y la potencia útil de la
      turbina (kW). El caudal circulante es de 40 l/s.

      **Notas nuestras.** La figura, que no se reproduce, es el esquema: el
      embalse A arriba a la izquierda, con su lámina en $z_A$; la tubería 1
      baja hasta la turbina T, y la tubería 2 sigue hasta el depósito B,
      cerrado y con un manómetro encima, con su lámina en $z_B$. Las
      rugosidades del PVC y del hormigón están en el cuadro n.º 20 del anexo:
      0,0007 cm y 0,12 cm (valor de diseño).
    notas:
      - |
        **IMPRESCINDIBLE:**

        - **Indicar** el **tipo de flujo, el comportamiento hidráulico y la
          expresión empleada** a la hora de calcular el coeficiente de
          frotamiento.
        - En caso de **realizar iteraciones**, el **cambio en la variable a
          calcular debe ser menor al 5%**.
    pide: El diámetro de la primera tubería y la potencia útil de la turbina.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la **potencia** perdida en la tubería 1, no su
          pérdida de carga. ¿Cómo se pasa de una a otra?
        opciones:
          - texto: >-
              Dividiendo entre $\gamma Q$: la potencia disipada es
              $\gamma\,Q\,h_f$
            correcta: true
            mensaje: |
              Eso es, y es la puerta de entrada al problema. Con
              $\gamma Q = 392$ W/m, los 1,5 kW son 3,83 metros de carga, y de
              ahí se despeja el diámetro.
          - texto: >-
              Multiplicando por el rendimiento de la turbina
            mensaje: |
              El rendimiento es de la máquina, no de la tubería. Una tubería
              no tiene rendimiento: disipa todo lo que pierde.
          - texto: >-
              No se puede: falta el diámetro
            mensaje: |
              Precisamente al revés: la potencia perdida es el dato que
              **permite** calcular el diámetro. La relación
              $P = \gamma Q h_f$ no contiene el diámetro por ningún lado.

      - tipo: calcular
        titulo: La pérdida de carga de la primera tubería
        pregunta: |
          ¿Cuánta carga se pierde en la tubería 1, en metros?
        respuesta:
          tipo: magnitud
          valor: '3.83 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.153 m'
            mensaje: |
              Te has dejado el caudal. La potencia disipada es
              $\gamma\,Q\,h_f$, no $\gamma\,h_f$.
          - valor: '1.5 m'
            mensaje: |
              Has tomado los kilovatios como metros. Son unidades distintas;
              el puente entre ellas es $\gamma Q$.
        pista: |
          $P = \gamma\,Q\,h_f$ con $Q = 40$ l/s.
        desarrollo: |
          $$
          h_{f1} = \frac{1500}{9800\cdot 0{,}04} = 3{,}83\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro de la primera tubería
        pregunta: |
          ¿Qué diámetro tiene la tubería 1, en mm?
        respuesta:
          tipo: magnitud
          valor: '176 mm'
          tolerancia: 0.01
          formato: un diámetro, con su unidad
        distractores:
          - valor: '169 mm'
            mensaje: |
              Te has dejado los codos. La longitud que entra en
              Darcy-Weisbach es la equivalente, $275 + 7\cdot 9 = 338$ m: los
              1,5 kW son de la tubería con sus pérdidas menores.
          - valor: '200 mm'
            mensaje: |
              Ese es el diámetro de la tubería **2**, que sí es dato. El de la
              1 es lo que se busca.
        pista: |
          Longitud equivalente $275 + 7\cdot 9 = 338$ m, y hay que iterar
          porque $f$ depende del diámetro. Mira en cada vuelta si el tubo se
          comporta como liso: $Re < 23/(\varepsilon/D)$.
        desarrollo: |
          $$
          h_{f1} = f\,\frac{338}{D}\,\frac{v^{2}}{2g}
          = 0{,}04473\,\frac{f}{D^{5}} = 3{,}83
          $$

          Se parte de $f = 0{,}02$ y se itera hasta que $D$ cambie menos de
          un 5 %, como pide la nota. Con PVC, $\varepsilon = 0{,}0007$ cm:

          | vuelta | $f$ | $D$ (mm) | cambio | $Re$ | $23/(\varepsilon/D)$ |
          |---|---|---|---|---|---|
          | 1 | 0,02000 | 187,8 | — | 271 000 | 617 000 |
          | 2 | 0,01475 | 176,7 | 5,9 % | 288 000 | 581 000 |
          | 3 | 0,01458 | 176,3 | 0,2 % | 289 000 | 579 000 |

          Flujo **turbulento** y tubo **hidráulicamente liso**: $Re$ queda
          por debajo de la frontera lisa-semirrugosa, $23/(\varepsilon/D)$.
          Como además $Re > 10^{5}$, el coeficiente sale de **Kármán-Prandtl
          para tubos lisos**,
          $1/\sqrt{f} = -2\log\bigl(2{,}51/(Re\sqrt{f})\bigr)$:

          $$
          f = 0{,}0146
          \qquad
          D = 176\ \text{mm}
          $$

          Blasius no vale aquí: es para $Re \le 10^{5}$, y fuera de su rango
          daría 173,9 mm, que la casilla no acepta. Colebrook, con 177,3 mm,
          sí cabe: en un tubo liso se reduce casi a Kármán-Prandtl.

      - tipo: calcular
        titulo: La potencia útil de la turbina
        pregunta: |
          ¿Cuánta potencia útil da la turbina, en kW?
        respuesta:
          tipo: magnitud
          valor: '7.3 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '9.35 kW'
            mensaje: |
              Esa es la potencia **bruta**, la que el agua entrega al rodete.
              La útil es el 78 % de ella.
          - valor: '5.69 kW'
            mensaje: |
              Has aplicado el rendimiento dos veces. Solo hay una conversión:
              de la energía del agua a la del eje.
        pista: |
          El salto que le queda a la turbina es el bruto menos la presión del
          depósito B y menos las dos pérdidas. La tubería 2 es de hormigón,
          $\varepsilon = 0{,}12$ cm: mira en qué zona cae.
        desarrollo: |
          En la tubería 2, $v = 1{,}273$ m/s y $Re = 2{,}55\cdot 10^{5}$, por
          encima de la frontera semirrugosa-rugosa,
          $560/(\varepsilon/D) = 560/0{,}006 = 93\,300$: flujo turbulento y
          tubo **hidráulicamente rugoso**, con **Kármán-Prandtl para tubos
          rugosos**, $1/\sqrt{f} = 2\log\bigl(3{,}71\,D/\varepsilon\bigr)$:

          $$
          f_2 = 0{,}0321
          \qquad
          h_{f2} = 0{,}0321\cdot\frac{90}{0{,}2}\cdot 0{,}0827 = 1{,}19\ \text{m}
          $$
          $$
          \frac{p_B}{\gamma} = \frac{550000}{9800} = 56{,}12\ \text{m}
          \qquad
          H_t = 900-815-56{,}12-3{,}83-1{,}19 = 23{,}86\ \text{m}
          $$
          $$
          P = 0{,}78\cdot 9800\cdot 0{,}04\cdot 23{,}86 = 7{,}3\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 1,5 kW perdidos en la tubería 1 son 3,83 metros de carga, y
              de ahí sale su diámetro: 176 mm.
          - texto: >-
              El salto bruto de 85 m se reparte entre la presión del depósito
              B —56,12 m—, las dos pérdidas y lo que le queda a la turbina.
          - texto: >-
              A la turbina le quedan 23,86 m, que a 40 l/s y con un
              rendimiento del 78 % son 7,3 kW.
          - texto: >-
              Los 5,5 bar del depósito B son una energía que se recupera, así
              que ayudan a la turbina.
            trampa: true
            mensaje: |
              Van **en contra**. El agua tiene que llegar a B con esa presión,
              así que esos 56 metros de columna son energía que la turbina
              **no** puede aprovechar: se los lleva el depósito. De los 85
              metros de salto bruto, la presión de B se come 56 y las pérdidas
              5; a la turbina le quedan 24.
    resolucion: |
      **El planteamiento, que va del revés.** Lo habitual es conocer el
      diámetro y calcular la pérdida. Aquí se da la **potencia** perdida y se
      busca el diámetro, y la relación que lo permite es

      $$
      P = \gamma\,Q\,h_f
      \qquad\Longrightarrow\qquad
      h_{f1} = \frac{1500}{9800\cdot 0{,}04} = 3{,}83\ \text{m}
      $$

      **El diámetro.** Con la longitud equivalente $275+7\cdot 9 = 338$ m y
      $Q = 40$ l/s, la ecuación de Darcy-Weisbach queda en función de $D$:

      $$
      3{,}83 = 0{,}04473\,\frac{f}{D^{5}}
      $$

      Hay que iterar, porque $f$ depende de $D$ por dos caminos —el Reynolds
      y la rugosidad relativa—, y en cada vuelta decidir la zona con las
      fronteras del tema 18: liso si $Re < 23/(\varepsilon/D)$, rugoso si
      $Re > 560/(\varepsilon/D)$. Con el PVC del cuadro n.º 20,
      $\varepsilon = 0{,}0007$ cm, el flujo es **turbulento** ($Re$ en torno
      a $2{,}9\cdot 10^{5}$) y el tubo, **hidráulicamente liso** (la
      frontera está en $5{,}8\cdot 10^{5}$); con $Re > 10^{5}$ el coeficiente
      sale de **Kármán-Prandtl para tubos lisos**. De $f = 0{,}02$ se pasa a
      187,8 mm, 176,7 mm (un 5,9 %) y 176,3 mm (un 0,2 %, menos del 5 % que
      pide la nota): $f = 0{,}0146$ y $D = 176$ mm, lo impreso. Con
      Colebrook, que es para la zona semirrugosa, saldrían 177,3 mm; con
      Blasius, que solo vale hasta $Re = 10^{5}$, 173,9, y eso ya es un
      error.

      **La potencia.** La tubería 2, de hormigón ($\varepsilon = 0{,}12$ cm),
      va con $Re = 2{,}55\cdot 10^{5}$, por encima de la frontera rugosa,
      93 300: flujo turbulento, tubo **hidráulicamente rugoso**,
      **Kármán-Prandtl para tubos rugosos**, $f = 0{,}0321$ y
      $h_{f2} = 1{,}19$ m. El salto bruto son 85 m, y de ahí hay que
      descontar todo lo que la turbina no ve:

      | concepto | metros |
      |---|---|
      | presión del depósito B | 56,12 |
      | pérdida en la tubería 1 | 3,83 |
      | pérdida en la tubería 2 | 1,19 |
      | **queda para la turbina** | **23,86** |

      $$
      P_{util} = 0{,}78\cdot\gamma\,Q\,H_t = 7{,}3\ \text{kW}
      $$

      **Lo que hay que llevarse.** De 85 metros de salto, la turbina solo
      aprovecha 24. Los 56 de la presión del depósito B no son una pérdida
      —el agua llega con ellos y sirven para algo aguas abajo— pero desde el
      punto de vista de la turbina son energía que no puede tocar. Confundir
      «no se pierde» con «se aprovecha aquí» es el error caro de este
      ejercicio.

  # ── 7 (15 %) · Una red ramificada de cuatro barrios, con la presión de un
  #    nudo y el diámetro comercial de la última rama.
  - id: exflu1920-ord-7-la-red-de-cuatro-barrios
    titulo: La red de cuatro barrios, y el diámetro que fija el más lejano
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Desde el depósito abierto A, situada la lámina de agua en cota 10, se
      bombea agua a 4 barrios (C, D, E y F). Se conocen las cotas de los
      barrios y los caudales punta demandados en cada barrio. Están indicados
      en la tabla adjunta. Asimismo, son conocidas las longitudes de cada uno
      de los tubos y los diámetros instalados, excepto el de la tubería 4. Las
      tuberías son de polietileno (PE).

      En la gráfica está representada la curva característica altura
      manométrica-caudal de la bomba instalada. Se pide:

      **a)** Indicar los caudales circulantes en cada tubería y la altura
      manométrica que debe aportar la bomba al flujo para abastecer los
      caudales demandados en los barrios.

      **b)** Presión del flujo en el barrio D (mca).

      **c)** Diámetro comercial mínimo a instalar en la tubería 4 si la
      presión mínima en el barrio F ha de ser $P_F = 40$ mca para los
      caudales punta. Los diámetros comerciales existentes van de 25 en 25
      mm.

      **d)** Dibujar la línea piezométrica desde el depósito A al barrio D,
      indicando la presión del flujo en los barrios C y D.

      **Notas nuestras.** Las dos tablas adjuntas dicen:

      | | | C | D | E | F |
      |---|---|---|---|---|---|
      | Cota | m | 25 | 43 | 25 | 30 |
      | Demanda punta | l/s | 3,5 | 17,5 | 13 | 11 |

      | | | t₁ | t₂ | t₃ | t₄ |
      |---|---|---|---|---|---|
      | Longitud | m | 1000 | 2600 | 1500 | 2000 |
      | Diámetro | mm | 225 | 175 | 175 | ? |

      El esquema de la red, que no se reproduce: del depósito A sale la
      bomba, y a su salida está el punto B; de B, la tubería $t_1$ sube hasta
      el nudo C; de C, la $t_2$ sube hasta el barrio D y la $t_3$ va hasta el
      nudo E, del que la $t_4$ sube hasta el barrio F. La gráfica de la bomba,
      rotulada en euskera («muz» es mca), da $H_m$ frente a $Q$ en l/s; leída
      por nosotros, con un margen de un metro:

      | $Q$ (l/s) | 0 | 10 | 20 | 30 | 40 | 45 | 50 | 60 | 70 | 80 | 90 |
      |---|---|---|---|---|---|---|---|---|---|---|---|
      | $H_m$ (mca) | 120 | 118 | 114 | 106,5 | 96 | 90 | 83 | 66,5 | 47 | 25 | 0 |
    notas:
      - >-
        **Nota importante**: no tener en cuenta el término cinético de la
        ecuación de Bernoulli.
    pide: Los caudales de la red y la altura de la bomba, la presión en D, el diámetro de la última rama y la línea piezométrica hasta D.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una red **ramificada** como esta, ¿cómo se reparten los caudales?
        opciones:
          - texto: >-
              Cada tubería lleva la suma de las demandas que quedan aguas
              abajo de ella, y no hay nada que iterar
            correcta: true
            mensaje: |
              Eso es. Una red ramificada, sin mallas, tiene los caudales
              **determinados por la continuidad sola**: $t_4$ lleva la demanda
              de F, $t_3$ la de E más la de F, y $t_1$ las cuatro. Solo las
              redes malladas obligan a iterar.
          - texto: >-
              Se reparten en proporción inversa a la resistencia de cada rama
            mensaje: |
              Eso pasa en un **paralelo**, donde dos ramas unen los mismos dos
              puntos. Aquí cada rama termina en un consumo distinto, así que
              el reparto lo fija la demanda.
          - texto: >-
              Hay que iterar hasta que las pérdidas de cada malla sumen cero
            mensaje: |
              Ese es el método de Hardy-Cross, y hace falta cuando hay
              **mallas**. Esta red es un árbol: de A sale un tronco que se va
              dividiendo y nunca se vuelve a juntar.

      - tipo: calcular
        titulo: El caudal de la tubería que sale de C hacia E
        pregunta: |
          ¿Cuánto lleva la tubería $t_3$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '24 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '13 l/s'
            mensaje: |
              Esa es solo la demanda de E. Por $t_3$ pasa además todo lo que
              consume F, que cuelga de E.
          - valor: '41.5 l/s'
            mensaje: |
              Has restado solo la demanda de C del total. Por $t_3$ no pasa lo
              que va a D: eso se lo lleva $t_2$.
        pista: |
          Todo lo que queda aguas abajo de la tubería.
        desarrollo: |
          $$
          Q_4 = 11
          \qquad
          Q_3 = 13+11 = 24
          \qquad
          Q_2 = 17{,}5
          \qquad
          Q_1 = 45\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura manométrica de la bomba
        pregunta: |
          Entrando en la curva de la bomba con el caudal que pasa por ella,
          ¿qué altura manométrica aporta, en mca?
        respuesta:
          tipo: magnitud
          valor: '90 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '94.2 mca'
            mensaje: |
              Has entrado en la curva con 41,5 l/s, sin la demanda de C. Por
              la bomba pasa lo que consumen los cuatro barrios: C también
              cuelga de ella, a través de $t_1$.
          - valor: '100 mca'
            mensaje: |
              Esa es la altura piezométrica a la salida de la bomba, la cota
              10 de la lámina más lo que aporta. La altura manométrica es solo
              lo que aporta.
        pista: |
          Por la bomba pasa todo lo que consumen los cuatro barrios. Con ese
          caudal se entra en la gráfica.
        desarrollo: |
          $$
          Q_1 = 3{,}5 + 17{,}5 + 13 + 11 = 45\ \text{l/s}
          $$

          En la curva, a 45 l/s, $H_m = 90$ mca: entre los 96 que da a 40 l/s
          y los 83 que da a 50.

      - tipo: calcular
        titulo: La presión en el barrio D
        pregunta: |
          ¿Cuánta presión llega a D, en mca?
        respuesta:
          tipo: magnitud
          valor: '43.82 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '86.82 mca'
            mensaje: |
              Esa es la **altura piezométrica** en D. La presión es lo que
              queda tras descontar su cota, que son 43 m.
          - valor: '51.81 mca'
            mensaje: |
              Te has dejado la pérdida de $t_2$, que con 2.600 m de tubería de
              175 mm son casi ocho metros: la mayor de toda la red.
        pista: |
          Altura del depósito más la de la bomba, menos las pérdidas de $t_1$
          y $t_2$, menos la cota de D.
        desarrollo: |
          Con PE ($\varepsilon/D$ del orden de $3\cdot 10^{-5}$ en los dos
          tramos, banda de $C_{HW} = 140$):

          $$
          h_{f1} = 5{,}19\ \text{m}
          \qquad
          h_{f2} = 7{,}98\ \text{m}
          $$
          $$
          \frac{p_D}{\gamma} = 10+90-5{,}19-7{,}98-43 = 43{,}82\ \text{mca}
          $$

      - tipo: calcular
        titulo: El diámetro de la última rama
        pregunta: |
          ¿Qué diámetro comercial hay que instalar en $t_4$, en mm?
        respuesta:
          tipo: magnitud
          valor: '125 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '100 mm'
            mensaje: |
              El cálculo exacto da 120 mm, y hacia abajo no vale: con 100 la
              pérdida se dispara y F no llegaría a los 40 mca exigidos. Al
              redondear una capacidad se sube al comercial siguiente.
          - valor: '175 mm'
            mensaje: |
              Ese es el de $t_2$ y $t_3$. La rama $t_4$ lleva menos caudal
              —11 l/s— y admite un tubo bastante más estrecho.
        pista: |
          La altura piezométrica en E menos la exigida en F es toda la pérdida
          que $t_4$ puede permitirse.
        desarrollo: |
          $$
          H_E = 10+90-5{,}19-8{,}27 = 86{,}54\ \text{m}
          \qquad
          H_F^{min} = 30+40 = 70\ \text{m}
          $$
          $$
          h_{f4} \le 16{,}54\ \text{m}
          \;\Longrightarrow\;
          D \ge 120\ \text{mm}
          \;\longrightarrow\;
          D_{com} = 125\ \text{mm}
          $$

      - tipo: dibujar
        consigna: |
          El apartado d) en papel: la línea piezométrica desde el depósito A
          hasta el barrio D, con la distancia a lo largo de la tubería en
          horizontal y las alturas en vertical, y las presiones de C y D
          marcadas como lo que hay entre la línea y cada barrio.
        comprueba:
          - punto: >-
              En A, la lámina en la cota 10; en la bomba, un salto vertical de
              90 m, hasta 100.
            porque: >-
              La piezométrica arranca en la lámina del depósito abierto, donde
              la presión relativa es nula. La bomba es el único punto donde la
              línea sube, y sube de golpe lo que aporta, $H_m$. Del depósito a
              la bomba el enunciado no da tubería, así que ahí no hay pérdida
              que dibujar.
          - punto: >-
              De la bomba a C, una recta que baja 5,19 m en los 1000 m de
              $t_1$, hasta 94,81 m; de C a D, otra que baja 7,98 m en los 2600
              m de $t_2$, hasta 86,82 m.
            porque: >-
              La pérdida de cada tubería es proporcional a su longitud, así
              que en cada una la línea es recta, con su pendiente: 5,19 m/km
              en $t_1$ y 3,07 m/km en $t_2$. La $t_2$ pierde más en total pero
              con menos pendiente, y por eso la línea tiene un quiebro en C:
              unir la bomba con D de un trazo da una presión en C que no es.
          - punto: >-
              Las presiones, como segmentos verticales entre cada barrio y la
              línea: 69,81 mca en C, en la cota 25, y 43,82 mca en D, en la 43.
            porque: >-
              La presión es la altura piezométrica menos la cota. D es el
              barrio más alto y el que recibe menos, pero la línea le pasa
              todavía casi 44 m por encima.
          - punto: >-
              Una sola línea: sin la de energía aparte.
            porque: >-
              La nota importante manda no tener en cuenta el término cinético,
              y sin él la línea de energía y la piezométrica coinciden.
        figura: |
          <svg viewBox="0 0 470 320" role="img" width="470" height="320" aria-labelledby="flu1920-ord-7-piezometrica-t flu1920-ord-7-piezometrica-d">
            <title id="flu1920-ord-7-piezometrica-t">La línea piezométrica desde el depósito A hasta el barrio D, con las presiones de C y D</title>
            <desc id="flu1920-ord-7-piezometrica-d">Unos ejes con la distancia a lo largo de la tubería en horizontal, en metros, desde la bomba, y la altura en vertical, de 0 a 110 metros. El depósito A, a la izquierda, tiene la lámina en la cota 10, y la línea piezométrica sale de ahí horizontal hasta la bomba, en la distancia cero. En la bomba sube en vertical 90 metros, hasta 100. Luego baja en línea recta por la tubería 1: 5,19 metros en 1000 metros de tubería, hasta 94,81 en el nudo C, que está en la cota 25; entre el barrio C y la línea hay 69,81 metros, la presión de C. Desde C baja con menos pendiente por la tubería 2, 7,98 metros en 2600, hasta 86,82 en el barrio D, que está en la cota 43, con 43,82 metros de presión.</desc>
            <style>
