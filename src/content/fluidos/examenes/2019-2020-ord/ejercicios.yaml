              stroke="var(--ink)" stroke-width="2"/>

        <line x1="140" y1="96" x2="260" y2="96" stroke="var(--faint)" stroke-width="1"/>
        <line x1="140" y1="90" x2="140" y2="102" stroke="var(--faint)" stroke-width="1"/>
        <line x1="260" y1="90" x2="260" y2="102" stroke="var(--faint)" stroke-width="1"/>
        <text x="200" y="90" text-anchor="middle" font-size="10" fill="var(--faint)">2R = 2 m</text>

