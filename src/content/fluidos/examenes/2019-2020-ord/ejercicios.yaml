        <line x1="376" y1="34" x2="376" y2="46" stroke="var(--faint)" stroke-width="1"/>
        <line x1="370" y1="34" x2="382" y2="34" stroke="var(--faint)" stroke-width="1"/>
        <line x1="370" y1="46" x2="382" y2="46" stroke="var(--faint)" stroke-width="1"/>
        <text x="386" y="44" font-size="10" fill="var(--faint)">0,2 m</text>
        <line x1="376" y1="46" x2="376" y2="106" stroke="var(--faint)" stroke-width="1"/>
        <line x1="260" y1="106" x2="382" y2="106" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="386" y="80" font-size="10" fill="var(--faint)">1 m</text>

        <circle cx="300" cy="24" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M300 33 L300 34 M300 24 L305 19" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="314" y="22" font-size="10" fill="var(--faint)">manómetro</text>
        <text x="200" y="260" text-anchor="middle" font-size="10" fill="var(--faint)">depósito cilíndrico, D = 10 m</text>
      </svg>
      <figcaption>

      La interfaz **corta al cilindro**, así que el cuerpo desplaza dos líquidos
      a la vez y el equilibrio tiene dos empujes, no uno. La incógnita h es
      justamente dónde queda ese corte. Y el metro de la derecha llega a la
      **tapa** del cilindro, no a la interfaz: de eso dependen las dos fuerzas
      verticales del apartado d).

      </figcaption>
      </figure>
    pide: Cuánto se hunde el cuerpo, qué marca el manómetro y las fuerzas de cada fluido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas de arriba está a varios bares. ¿Afecta eso a cuánto se hunde
          el cuerpo?
        opciones:
          - texto: >-
              No: una presión uniforme sobre toda la superficie libre se
              transmite por igual a todas partes y no cambia el equilibrio de
              flotación
            correcta: true
            mensaje: |
              Eso es. La presión del gas se suma a la de todos los puntos del
              líquido, así que en el balance vertical del cuerpo aparece
              empujando hacia abajo por arriba y hacia arriba por abajo, y se
              cancela. Lo que flota, flota igual a una atmósfera que a siete
              bares.
          - texto: >-
              Sí: al presurizar, el cuerpo se hunde más
            mensaje: |
              Se hundiría más si la presión actuara solo por arriba, pero
              actúa sobre todo el líquido. Por eso el apartado a) se puede
              resolver antes que el b), sin saber cuánto vale la presión.
          - texto: >-
              Sí: al presurizar, el líquido se comprime y su densidad aumenta
            mensaje: |
              A siete bares la densidad de un líquido cambia en torno a un
              0,03 %. Como $h$ sale de la pequeña diferencia entre empuje y
              peso, eso la movería en torno a un 0,3 %, de 0,457 a 0,459 m,
              dentro de la tolerancia. En este curso los líquidos se tratan
              como incompresibles salvo que el enunciado diga lo contrario.

      - tipo: calcular
        titulo: Cuánto se hunde en el fluido superior
        pregunta: |
          ¿Cuánto vale $h$, en metros?
        respuesta:
          tipo: numero
          valor: '0.457'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '0.831'
            mensaje: |
              Has supuesto que el cilindro asoma por encima del fluido
              superior y que solo el cono está en el inferior. La interfaz
              corta al **cilindro**, así que parte de él está en cada
              líquido.
          - valor: '0.293'
            mensaje: |
              Ese es lo que queda del cilindro en el fluido **inferior**,
              $0{,}75-0{,}457$. La pregunta es cuánto hay en el superior.
        pista: |
          El peso del cuerpo lo sostienen los dos empujes: el del fluido
          superior sobre la parte del cilindro que está en él, y el del
          inferior sobre el resto del cilindro más el cono.
        desarrollo: |
          $$
          V = \pi R^{2}L + \tfrac13\pi R^{2}H = 2{,}356+1{,}361
          = 3{,}718\ \text{m}^{3}
          $$
          $$
          W = 925\cdot 9{,}8\cdot 3{,}718 = 33{,}70\ \text{kN}
          $$
          $$
          \gamma_2\pi R^{2}h + \gamma_1\bigl[\pi R^{2}(L-h)+V_{cono}\bigr] = W
          $$
          $$
          36{,}80 - 6{,}773\,h = 33{,}70
          \;\Longrightarrow\;
          h = 0{,}457\ \text{m}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro superior
        pregunta: |
          ¿Cuánto marca el manómetro de la cámara de gas, en mm de columna de
          mercurio?
        respuesta:
          tipo: magnitud
          valor: '5225.96 mmHg'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '5986 mmHg'
            mensaje: |
              Has dado la presión **absoluta**. El manómetro mide relativa:
              hay que descontar la atmósfera, unos 760 mm de mercurio.
          - valor: '760 mmHg'
            mensaje: |
              Esa es la atmósfera. El gas de la cámara está a casi siete bares
              por encima de ella.
        pista: |
          $m = 0{,}066\cdot 5{,}2\cdot 60$ kg de gas en el volumen de la capa
          de 0,2 m, y gas ideal. Ojo, $R_{gas} = 2077$ es el del **helio**.
        desarrollo: |
          $$
          m = 0{,}066\cdot 312 = 20{,}59\ \text{kg}
          \qquad
          V = \pi\cdot 5^{2}\cdot 0{,}2 = 15{,}71\ \text{m}^{3}
          $$
          $$
          p_{abs} = \frac{mRT}{V}
          = \frac{20{,}59\cdot 2077{,}16\cdot 293}{15{,}71}
          = 797{,}8\ \text{kPa}
          $$
          $$
          p_{man} = 797{,}8-101{,}3 = 696{,}5\ \text{kPa}
          = \frac{696\,516}{13\,600\cdot 9{,}8}\ \text{m} = 5225{,}96\ \text{mm de Hg}
          $$

      - tipo: dibujar
        consigna: |
          El apartado c) en papel: los prismas de presiones de los dos fluidos
          sobre el cuerpo, acotados, cada uno perpendicular a la cara que
          empuja. La presión del gas se suma igual en todas las caras: dila
          aparte y dibuja a escala lo que pone cada fluido.
        comprueba:
          - punto: >-
              En la tapa del cilindro, un rectángulo del fluido superior hacia
              abajo: $\gamma_2\cdot 1\ \text{m} = 7{,}74$ kPa.
            porque: >-
              La tapa está a 1 m de la lámina del fluido superior: es lo que
              acota la figura del enunciado, de la lámina a la tapa. Leer ese
              metro como el espesor de la capa pone la tapa a $1-h$ y deja las
              dos fuerzas verticales un 0,5 % por debajo de las impresas.
          - punto: >-
              En la cara lateral, dos trapecios horizontales: del fluido
              superior, de 7,74 kPa en la tapa a 11,28 en la interfaz; del
              inferior, de 11,28 a 14,18 kPa en la base, con más pendiente.
            porque: >-
              Por encima de la interfaz la presión crece con
              $\gamma_2 = 7742$ N/m³ y por debajo con $\gamma_1 = 9898$: el
              prisma tiene un quiebro en la interfaz. Los de un lado y el otro
              son iguales y opuestos, y por eso las componentes horizontales
              de los dos fluidos valen cero.
          - punto: >-
              En el cono, perpendicular a su superficie y hacia dentro, del
              fluido inferior: 14,18 kPa en el borde de la base y 27,05 kPa en
              el vértice.
            porque: >-
              La presión es normal a la pared, así que en el cono el prisma va
              inclinado, perpendicular a la generatriz, ni horizontal ni
              vertical. Crece 9,9 kPa por metro de profundidad a lo largo de
              los 1,3 m del cono.
          - punto: >-
              Sobre todo lo anterior, uniforme, la presión del gas: 696,52 kPa
              en todas las caras.
            porque: >-
              A la escala de los prismas sería una banda de 35 m alrededor de un
              cuerpo de 2 m, y por eso se dice aparte. Es el 98,9 % de la fuerza
              vertical de arriba y el 97,4 % de la de abajo, y en la diferencia,
              que es el peso, se anula.
        figura: |
          <svg viewBox="0 0 460 392" role="img" width="460" height="392" aria-labelledby="flu1920-ord-3-prismas-t flu1920-ord-3-prismas-d">
            <title id="flu1920-ord-3-prismas-t">Los prismas de presiones de los dos fluidos sobre el cuerpo de cilindro y cono, acotados</title>
            <desc id="flu1920-ord-3-prismas-d">El cuerpo en corte, a escala: el cilindro de 2 metros de diámetro y 0,75 de altura, con el cono de 1,3 metros colgando debajo. La lámina del fluido superior está 1 metro por encima de la tapa, y la interfaz entre los dos fluidos corta al cilindro 0,457 metros por debajo de la tapa. Sobre cada cara, el prisma de lo que pone cada fluido, perpendicular a la cara: en la tapa, un rectángulo del fluido superior de 7,74 kilopascales apuntando hacia abajo, que no llega a la lámina; en las caras laterales, horizontales y simétricos, un trapecio del fluido superior de 7,74 a 11,28 kilopascales hasta la interfaz y otro del inferior de 11,28 a 14,18 hasta la base, con más pendiente; en el cono, inclinados, perpendiculares a la generatriz, del fluido inferior, de 14,18 kilopascales en el borde a 27,05 en el vértice. Un rótulo recuerda que a todo eso se suman, uniformes, los 696,52 kilopascales del gas, y da las fuerzas verticales: 2212,49 kilonewtons hacia abajo del fluido superior y 2246,19 hacia arriba del inferior.</desc>
