        <text x="314" y="22" font-size="10" fill="var(--faint)">manómetro</text>
        <text x="200" y="254" text-anchor="middle" font-size="10" fill="var(--faint)">depósito cilíndrico, D = 10 m</text>
      </svg>
      <figcaption>

      La interfaz **corta al cilindro**, así que el cuerpo desplaza dos líquidos
      a la vez y el equilibrio tiene dos empujes, no uno. La incógnita h es
      justamente dónde queda ese corte, y de ella depende todo lo demás.

      </figcaption>
      </figure>
    pide: Cuánto se hunde el cuerpo, qué marca el manómetro y las fuerzas de cada fluido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas de arriba está a varios bares. ¿Afecta eso a cuánto se hunde
          el cuerpo?
        opciones:
          - texto: >-
              No: una presión uniforme sobre toda la superficie libre se
              transmite por igual a todas partes y no cambia el equilibrio de
              flotación
            correcta: true
            mensaje: |
              Eso es. La presión del gas se suma a la de todos los puntos del
              líquido, así que en el balance vertical del cuerpo aparece
              empujando hacia abajo por arriba y hacia arriba por abajo, y se
              cancela. Lo que flota, flota igual a una atmósfera que a siete
              bares.
          - texto: >-
              Sí: al presurizar, el cuerpo se hunde más
            mensaje: |
              Se hundiría más si la presión actuara solo por arriba, pero
              actúa sobre todo el líquido. Por eso el apartado a) se puede
              resolver antes que el b), sin saber cuánto vale la presión.
          - texto: >-
              Sí: al presurizar, el líquido se comprime y su densidad aumenta
            mensaje: |
              A siete bares, la densidad de un líquido cambia en torno a un
              0,03 %: cuatro órdenes de magnitud menos que la precisión con
              que se pide $h$. En este curso los líquidos se tratan como
              incompresibles salvo que el enunciado diga lo contrario.

      - tipo: calcular
        titulo: Cuánto se hunde en el fluido superior
        pregunta: |
          ¿Cuánto vale $h$, en metros?
        respuesta:
          tipo: numero
          valor: '0.457'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '0.831'
            mensaje: |
              Has supuesto que el cilindro asoma por encima del fluido
              superior y que solo el cono está en el inferior. La interfaz
              corta al **cilindro**, así que parte de él está en cada
              líquido.
          - valor: '0.293'
            mensaje: |
              Ese es lo que queda del cilindro en el fluido **inferior**,
              $0{,}75-0{,}457$. La pregunta es cuánto hay en el superior.
        pista: |
          El peso del cuerpo lo sostienen los dos empujes: el del fluido
          superior sobre la parte del cilindro que está en él, y el del
          inferior sobre el resto del cilindro más el cono.
        desarrollo: |
          $$
          V = \pi R^{2}L + \tfrac13\pi R^{2}H = 2{,}356+1{,}361
          = 3{,}718\ \text{m}^{3}
          $$
          $$
          W = 925\cdot 9{,}8\cdot 3{,}718 = 33{,}70\ \text{kN}
          $$
          $$
          \gamma_2\pi R^{2}h + \gamma_1\bigl[\pi R^{2}(L-h)+V_{cono}\bigr] = W
          $$
          $$
          36{,}80 - 6{,}773\,h = 33{,}70
          \;\Longrightarrow\;
          h = 0{,}457\ \text{m}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro superior
        pregunta: |
          ¿Cuánto marca el manómetro de la cámara de gas, en mm de columna de
          mercurio?
        respuesta:
          tipo: magnitud
          valor: '5225.96 mmHg'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '5986 mmHg'
            mensaje: |
              Has dado la presión **absoluta**. El manómetro mide relativa:
              hay que descontar la atmósfera, unos 760 mm de mercurio.
          - valor: '760 mmHg'
            mensaje: |
              Esa es la atmósfera. El gas de la cámara está a casi siete bares
              por encima de ella.
        pista: |
          $m = 0{,}066\cdot 5{,}2\cdot 60$ kg de gas en el volumen de la capa
          de 0,2 m, y gas ideal. Ojo, $R_{gas} = 2077$ es el del **helio**.
        desarrollo: |
          $$
          m = 0{,}066\cdot 312 = 20{,}59\ \text{kg}
          \qquad
          V = \pi\cdot 5^{2}\cdot 0{,}2 = 15{,}71\ \text{m}^{3}
          $$
          $$
          p_{abs} = \frac{mRT}{V}
          = \frac{20{,}59\cdot 2077{,}16\cdot 293}{15{,}71}
          = 797{,}7\ \text{kPa}
          $$
          $$
          p_{man} = 797{,}7-101{,}3 = 696{,}4\ \text{kPa}
          = 5226\ \text{mm de Hg}
          $$

      - tipo: calcular
        titulo: La diferencia entre las dos fuerzas verticales
        pregunta: |
          ¿Cuánto vale la diferencia entre la fuerza vertical del fluido
          inferior y la del superior, en kN?
        respuesta:
          tipo: magnitud
          valor: '33.7 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2246 kN'
            mensaje: |
              Esa es la fuerza del fluido inferior **entera**. La pregunta es
              su diferencia con la del superior, y las dos son enormes
              precisamente porque el gas las infla por igual.
          - valor: '0 kN'
            mensaje: |
              Serían iguales si el cuerpo no pesara. El cuerpo flota, así que
              la resultante de las dos fuerzas verticales sostiene
              exactamente su peso.
        pista: |
          El cuerpo está en equilibrio, y la única fuerza que no es
          hidrostática es su peso.
        desarrollo: |
          $$
          F_{v1}-F_{v2} = W = 925\cdot 9{,}8\cdot 3{,}718 = 33{,}70\ \text{kN}
          $$

          Y las dos por separado valen $2246{,}19$ kN hacia arriba y
          $2212{,}49$ kN hacia abajo: **más de dos meganewton cada una**,
          porque el gas a siete bares se transmite a todo el líquido.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión del gas se transmite por igual a todo el líquido, así
              que no cambia el equilibrio de flotación: $h$ sale sin conocerla.
          - texto: >-
              Con el gas ideal y los 20,6 kg introducidos, la cámara está a
              797,7 kPa absolutos, es decir 5.226 mm de mercurio relativos.
          - texto: >-
              Las componentes horizontales se anulan por simetría de
              revolución, y las verticales valen más de dos meganewton cada
              una.
          - texto: >-
              Como las dos fuerzas verticales son enormes, el cuerpo está
              sometido a un esfuerzo estructural de dos meganewton.
            trampa: true
            mensaje: |
              Lo está a **compresión uniforme**, que es otra cosa. Un cuerpo
              sumergido en un fluido a presión no soporta la resultante de las
              dos caras: soporta la presión, igual por todas partes, como un
              submarinista a diez metros. Lo que puede romperlo es que sea
              hueco, no que la integral de presiones sea grande.
    resolucion: |
      **a) Cuánto se hunde.** Aquí lo primero es darse cuenta de que el gas
      **no interviene**: una presión uniforme sobre la superficie libre se
      transmite a todo el líquido y se cancela en el balance vertical del
      cuerpo. Así que el apartado a) se resuelve antes que el b).

      $$
      V = \pi R^{2}L+\tfrac13\pi R^{2}H = 3{,}718\ \text{m}^{3}
      \qquad
      W = 33{,}70\ \text{kN}
      $$

      Con la interfaz cortando al cilindro, el empuje tiene dos trozos:

      $$
      \gamma_2\,\pi R^{2}h + \gamma_1\bigl[\pi R^{2}(0{,}75-h)+1{,}361\bigr]
      = W
      \;\Longrightarrow\;
      h = 0{,}457\ \text{m}
      $$

      **b) El manómetro.** Con 20,6 kg de gas en 15,7 m³ a 293 K —y
      $R = 2077$, que es el del helio—:

      $$
      p_{abs} = 797{,}7\ \text{kPa}
      \qquad
      p_{man} = 696{,}4\ \text{kPa} = 5226\ \text{mm de Hg}
      $$

      **d) Las fuerzas.** Las horizontales son cero: el cuerpo es de
      revolución y los prismas se cierran sobre sí mismos. Las verticales:

      | | módulo | sentido |
      |---|---|---|
      | fluido superior, sobre la tapa del cilindro | $2212{,}49$ kN | $\downarrow$ |
      | fluido inferior, sobre el cono | $2246{,}19$ kN | $\uparrow$ |
      | **diferencia** | $33{,}70$ kN | $\uparrow$ |

      **Y ahí está lo que enseña.** Dos fuerzas de más de dos meganewton cuya
      diferencia son 33,7 kN: el peso del cuerpo. El 99 % de cada una la pone
      el gas, que se cancela; solo el 1,5 % restante decide si el cuerpo flota
      o se hunde. Calcular las dos por separado y restarlas es numéricamente
      pésimo —dos cifras significativas de error en cualquiera de ellas se
      comen el resultado— y por eso conviene hacer el balance con el empuje,
      que ya trae la resta hecha.

      > Nuestra reconstrucción da $2200{,}9$ y $2234{,}6$ kN frente a los
      > $2212{,}49$ y $2246{,}19$ publicados: un $0{,}5\ \%$, que es
      > exactamente lo que se mueven esas cifras al redondear la presión del
      > gas. **La diferencia, en cambio, sale idéntica**, y es la que tiene
      > significado físico.

  # ── 4 (14 %) · El limpiacristales y su cono. La velocidad de salida y el
  #    ángulo del asiento cónico.
  - id: exflu1920-ord-4-el-limpiacristales-y-su-cono
    titulo: El limpiacristales, y el ángulo del cono que abre el chorro
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para la limpieza de grandes superficies acristaladas verticales se
      emplea una tubería cilíndrica horizontal ($D = 54$ cm), habiéndose
      medido en el manómetro una presión de $1{,}4\ \text{kg/cm}^{2}$. Esta
      conducción lanza un chorro uniforme de agua desionizada a través de una
      tobera ($d = 25$ cm) con un factor de paso de $k = 0{,}04$ a la salida.
      Se pide:

      **a)** Determinar la velocidad de salida del chorro por la tobera
      considerando un $C_d = 0{,}7$.

      Para poder abarcar una mayor área de limpieza se acopla a la tobera una
      válvula de asiento cónico regulado mediante un tornillo. Suponiendo que
      inicialmente el cono permanece fijo en la posición mostrada, se pide:

      **b)** Diseñar el asiento cónico para que la fuerza que tiene que
      soportar el tornillo no supere los 2/3 de la carga de rotura por
      compresión de 205 N.

      Mediante la acción del motor eléctrico se desplaza el cono hacia la
      izquierda con una velocidad $u$ constante. Se pide:

      **c)** Valor límite que podría alcanzar la mencionada velocidad para no
      romper el tornillo.

      <figure class="figura-examen">
      <svg viewBox="24 20 452 182" role="img" width="440" height="177"
           aria-labelledby="fw4t fw4d">
        <title id="fw4t">La tobera del limpiacristales y el cono que abre el chorro</title>
        <desc id="fw4d">Una tubería horizontal de cincuenta y cuatro
        centímetros de diámetro, con un manómetro que marca uno con cuatro
        kilopondios por centímetro cuadrado, termina en una tobera de
        veinticinco centímetros por la que sale un chorro de agua. Enfrente, un
        cono de asiento con el vértice apuntando hacia la tobera recibe el
        chorro y lo abre en abanico; alfa es su semiángulo. El cono va sujeto
        por un tornillo a un motor eléctrico que puede desplazarlo hacia la
        izquierda con velocidad u, es decir contra el chorro.</desc>

        <path d="M40 82 L172 82 L212 96 L212 124 L172 138 L40 138 Z"
              fill="var(--live)" fill-opacity=".16" stroke="var(--ink)" stroke-width="2"/>
        <line x1="40" y1="66" x2="172" y2="66" stroke="var(--faint)" stroke-width="1"/>
        <line x1="40" y1="60" x2="40" y2="72" stroke="var(--faint)" stroke-width="1"/>
        <line x1="172" y1="60" x2="172" y2="72" stroke="var(--faint)" stroke-width="1"/>
        <text x="106" y="60" text-anchor="middle" font-size="10" fill="var(--faint)">D = 54 cm</text>
        <text x="216" y="152" font-size="10" fill="var(--faint)">d = 25 cm · k = 0,04</text>

        <circle cx="120" cy="66" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M120 75 L120 82 M120 66 L125 61" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="134" y="46" font-size="10" fill="var(--faint)">1,4 kg/cm²</text>
        <line x1="128" y1="60" x2="140" y2="50" stroke="var(--faint)" stroke-width="1"/>

        <rect x="212" y="98" width="52" height="24" fill="var(--live)" fill-opacity=".4"/>

        <path d="M264 110 L344 62 L344 158 Z" fill="var(--ink)" fill-opacity=".5"
              stroke="var(--ink)" stroke-width="2"/>
        <path d="M264 110 L344 110" stroke="var(--paper)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M298 110 A 34 34 0 0 0 292 90" fill="none" stroke="var(--paper)" stroke-width="1.2"/>
        <text x="300" y="104" font-size="11" fill="var(--paper)">α</text>

        <path d="M344 62 L386 38 M344 158 L386 182" stroke="var(--live)" stroke-width="3"
              opacity=".45" stroke-linecap="round"/>

        <path d="M344 104 L392 104 L392 116 L344 116 Z" fill="var(--faint)" fill-opacity=".5"
              stroke="var(--ink)" stroke-width="1.4"/>
        <text x="368" y="96" text-anchor="middle" font-size="10" fill="var(--faint)">tornillo</text>
        <rect x="392" y="86" width="26" height="48" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="405" y="146" text-anchor="middle" font-size="10" fill="var(--faint)">motor</text>

        <line x1="330" y1="180" x2="286" y2="180" stroke="var(--alt)" stroke-width="2"
              marker-end="url(#fw4u)"/>
        <text x="336" y="184" font-size="11" fill="var(--alt)">u</text>

        <defs>
          <marker id="fw4u" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      El cono está **enfrentado al chorro, con el vértice hacia la tobera**: no
      lo frena, lo abre en abanico. Y cuando el motor lo mueve hacia la
      izquierda, la velocidad relativa del agua contra él crece — por eso hay
      un límite para u antes de que el tornillo reviente.

      </figcaption>
      </figure>
    pide: La velocidad del chorro y el semiángulo del cono que no rompe el tornillo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El factor de paso $k = 0{,}04$ está referido «a la salida». ¿Con qué
          velocidad se aplica?
        opciones:
          - texto: >-
              Con la de la tobera, la de salida, porque es a la que está
              referido
            correcta: true
            mensaje: |
              Eso es, y conviene mirarlo siempre: un mismo accesorio con el
              mismo $k$ pierde cosas muy distintas según a qué velocidad se
              refiera. Aquí la tobera estrecha de 54 a 25 cm, así que la
              velocidad de salida es casi cinco veces la de la tubería.
          - texto: >-
              Con la de la tubería, que es donde está el manómetro
            mensaje: |
              El manómetro está en la tubería, sí, pero el enunciado dice
              explícitamente «respecto de la energía cinética a la salida».
              Usar la de la tubería divide la pérdida por 21.
          - texto: >-
              Con la media de las dos
            mensaje: |
              No hay tal promedio: un factor de paso siempre se refiere a una
              velocidad concreta, y el enunciado dice cuál.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad sale el chorro, en m/s?
        respuesta:
          tipo: magnitud
          valor: '16.63 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '5.26 m/s'
            mensaje: |
              Has tomado el $1{,}4\ \text{kg/cm}^{2}$ como 1,4 metros de
              columna de agua. Un kilo por centímetro cuadrado son **diez**
              metros de columna, así que la presión disponible es de 14 m.
          - valor: '11.64 m/s'
            mensaje: |
              Has aplicado el $C_d = 0{,}7$ a la velocidad. El coeficiente de
              descarga corrige el **caudal**, no la velocidad de salida; la
              velocidad sale de Bernoulli.
        pista: |
          Bernoulli entre el manómetro y la salida, con
          $v_1 = v_2\,(d/D)^{2}$ y la pérdida referida a $v_2$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{1{,}4\cdot 98000}{9800} = 14\ \text{m}
          \qquad
          \frac{A_1}{A_2} = \Bigl(\frac{54}{25}\Bigr)^{2} = 4{,}666
          $$
          $$
          14 = \frac{v_2^{2}}{2g}\Bigl(1+0{,}04-\frac{1}{4{,}666^{2}}\Bigr)
          = 0{,}994\,\frac{v_2^{2}}{2g}
          $$
          $$
          v_2 = 16{,}63\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El semiángulo del cono
        pregunta: |
          ¿Qué semiángulo $\alpha$ debe tener el cono para que el tornillo no
          pase de los dos tercios de su carga de rotura?
        respuesta:
          tipo: numero
          valor: '9.63'
          tolerancia: 0.2
          formato: un número en grados
        distractores:
          - valor: '19.3'
            mensaje: |
              Has usado la carga de rotura entera, 205 N, en vez de los dos
              tercios que pide el enunciado. El ángulo va con la raíz de la
              fuerza para ángulos pequeños, así que un 50 % más de fuerza es
              un 22 % más de ángulo.
          - valor: '8.13'
            mensaje: |
              Te has dejado el coeficiente de descarga en el caudal. El chorro
              real lleva un 70 % del caudal teórico, así que empuja menos y
              admite un cono algo más abierto.
        pista: |
          El cono desvía el chorro $\alpha$ respecto del eje, así que la
          fuerza axial es $\rho Q v\,(1-\cos\alpha)$.
        desarrollo: |
          $$
          Q = C_d\,A_2\,v_2 = 0{,}7\cdot 0{,}0491\cdot 16{,}63
          = 0{,}571\ \text{m}^{3}/\text{s}
          $$
          $$
          \rho Q v\,(1-\cos\alpha) = \tfrac23\cdot 205 = 136{,}7\ \text{N}
          $$
          $$
          1-\cos\alpha = \frac{136{,}7}{9500} = 0{,}0144
          \;\Longrightarrow\;
          \alpha = 9{,}63^{\circ}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la tubería y la salida, con la pérdida referida
              a la velocidad de salida, da $v_2 = 16{,}63$ m/s.
          - texto: >-
              El cono desvía el chorro un ángulo $\alpha$ respecto del eje, y
              la fuerza axial que recibe es $\rho Q v(1-\cos\alpha)$.
          - texto: >-
              Limitando esa fuerza a dos tercios de la carga de rotura sale un
              cono muy cerrado, de menos de diez grados.
          - texto: >-
              Un cono más cerrado abarcaría más superficie de limpieza, que es
              lo que se busca.
            trampa: true
            mensaje: |
              Es al revés: cuanto **más abierto** el cono, más se abre el
              chorro y más superficie barre. Por eso el diseño está en
              tensión: el área de limpieza pide abrir el cono y el tornillo
              pide cerrarlo. Los 9,63º son el compromiso, y son el resultado
              del problema, no un punto de partida.
    resolucion: |
      **a) La velocidad de salida.** Bernoulli entre el punto donde está el
      manómetro y la salida de la tobera, con la pérdida referida a la
      velocidad de salida:

      $$
      \frac{p}{\gamma}+\frac{v_1^{2}}{2g}
      = \frac{v_2^{2}}{2g}+k\frac{v_2^{2}}{2g}
      $$

      Con $p/\gamma = 14$ m y $v_1 = v_2/4{,}666$:

      $$
      14 = 0{,}994\,\frac{v_2^{2}}{2g}
      \qquad
      v_2 = 16{,}63\ \text{m/s}
      $$

      El $C_d = 0{,}7$ **no** corrige la velocidad: corrige el caudal, y hace
      falta en el apartado siguiente.

      **b) El cono.** El chorro llega al vértice del cono y sale deslizando
      por su superficie, desviado un ángulo $\alpha$ respecto del eje. La
      fuerza axial es la de siempre:

      $$
      F = \rho\,Q\,v\,(1-\cos\alpha)
      \qquad
      Q = C_d A_2 v_2 = 0{,}571\ \text{m}^{3}/\text{s}
      $$

      Imponiendo $F \le \tfrac23\cdot 205 = 136{,}7$ N:

      $$
      1-\cos\alpha \le 0{,}0144
      \qquad
      \alpha = 9{,}63^{\circ}
      $$

      **La tensión de diseño**, que es lo que el ejercicio quiere que veas: el
      área de limpieza pide abrir el cono y el tornillo pide cerrarlo. Diez
      grados es lo que aguanta el tornillo, y esa es toda la libertad que hay.

      **Un apartado que no se publica resuelto.** El c) pide la velocidad
      límite con la que el motor puede avanzar el cono contra el chorro.
      Con la velocidad relativa $v+u$ y la carga de rotura entera sale
      $u = 3{,}96$ m/s, frente a los $3{,}74$ publicados: un $5{,}7\ \%$. La
      diferencia viene de que el examen arrastra un coeficiente de descarga
      efectivo de $0{,}715$ en vez del $0{,}7$ del enunciado, y a esa cuenta
      la afecta al cuadrado. Se deja fuera antes que publicar un número que no
      cuadra.

  # ── 5 (12 %) · Semejanza de dos turbobombas: análisis dimensional
  #    aplicado a máquinas y no a flujos.
  - id: exflu1920-ord-5-las-dos-turbobombas-semejantes
    titulo: Dos turbobombas semejantes, y qué número se puede respetar
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La experiencia y la experimentación demuestran que el rendimiento de una
      turbobomba $\eta$ depende del caudal bombeado $Q$, de la velocidad de
      giro del rodete $n$, de la densidad $\rho$ y de la viscosidad dinámica
      $\mu$ del líquido bombeado, del diámetro del rodete $D$ y de la
      gravedad $g$.

      **a)** Deducir los parámetros adimensionales que intervienen en el
      fenómeno físico mediante el método rápido o intuitivo, si se toman como
      variables repetidas $\rho$, $n$ y $D$.

      En el laboratorio de modelos de hidráulica se dispone de dos
      turbobombas A y B, geométricamente semejantes. El diámetro del rodete de
      la turbobomba B es $D_B = 300$ mm y el de la A es $D_A = 200$ mm. Ambas
      bombean agua a la misma temperatura.

      **b)** ¿Es posible obtener la semejanza absoluta entre las dos
      turbobombas?

      **c)** Si se desea que se cumpla la semejanza restringida de Reynolds,
      calcular la velocidad de giro y el caudal a bombear por la turbobomba B,
      si la velocidad de giro de la A es $n_A = 1000$ rpm y descarga un caudal
      $Q_A = 7\ \text{m}^{3}/\text{min}$ de agua.

      **d)** ¿Qué turbobomba obtendrá un mejor rendimiento?
    pide: Los adimensionales de una turbobomba, y el punto equivalente de la máquina mayor.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una máquina, ¿qué papel hace la velocidad de giro $n$ que en un
          flujo hacía la velocidad $v$?
        opciones:
          - texto: >-
              El de escala de tiempos: $nD$ es la velocidad periférica del
              rodete, y con ella se construyen todos los adimensionales
            correcta: true
            mensaje: |
              Eso es. En una turbomáquina la velocidad característica no es
              una velocidad del fluido sino la del álabe, $u = \pi n D$. Por
              eso los grupos salen con $nD$ donde en un flujo saldría $v$:
              $Q/(nD^{3})$ en vez de $Q/(vD^{2})$, y así todos.
          - texto: >-
              Ninguno: $n$ es un dato de la máquina y no entra en los
              adimensionales
            mensaje: |
              Es una de las tres variables **repetidas** que el enunciado
              impone, así que entra en todos los grupos. Y físicamente es la
              que fija la escala de tiempos del problema.
          - texto: >-
              El de la frecuencia de un fenómeno oscilatorio, como en Strouhal
            mensaje: |
              La forma se parece, pero aquí no hay ningún desprendimiento
              periódico que medir: $n$ es la velocidad de la máquina, y su
              papel es dar la velocidad de referencia $nD$.

      - tipo: calcular
        titulo: La velocidad de giro de la turbobomba grande
        pregunta: |
          Respetando el Reynolds, ¿a qué velocidad debe girar la turbobomba B,
          en rpm?
        respuesta:
          tipo: magnitud
          valor: '444.4 rpm'
          tolerancia: 0.02
          formato: una velocidad de giro, con su unidad
        distractores:
          - valor: '666.7 rpm'
            mensaje: |
              Has usado la escala a la primera potencia. En el número que
              contiene la viscosidad, $\mu/(\rho D^{2}n)$, el diámetro va al
              **cuadrado**: $n_B = n_A (D_A/D_B)^{2}$.
          - valor: '2250 rpm'
            mensaje: |
              Lo has puesto del revés. La máquina grande gira **más despacio**
              para mantener el mismo Reynolds, no más deprisa.
        pista: |
          El tercer grupo, $\mu/(\rho D^{2}n)$, con el mismo fluido en las dos.
        desarrollo: |
          $$
          D_A^{2}n_A = D_B^{2}n_B
          \;\Longrightarrow\;
          n_B = 1000\Bigl(\frac{200}{300}\Bigr)^{2} = 444{,}4\ \text{rpm}
          $$

      - tipo: calcular
        titulo: El caudal de la turbobomba grande
        pregunta: |
          ¿Y qué caudal descarga, en m³/min?
        respuesta:
          tipo: magnitud
          valor: '10.5 m3/min'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '23.6 m3/min'
            mensaje: |
              Has aplicado solo la relación de diámetros al cubo y has
              olvidado que la máquina grande gira más despacio, lo que
              descuenta un factor $0{,}444$.
          - valor: '4.67 m3/min'
            mensaje: |
              Lo has puesto del revés: la máquina grande mueve **más** caudal,
              no menos, pese a girar más despacio.
        pista: |
          $Q/(nD^{3})$ igual en las dos.
        desarrollo: |
          $$
          \frac{Q_B}{Q_A} = \frac{n_B}{n_A}\Bigl(\frac{D_B}{D_A}\Bigr)^{3}
          = 0{,}4444\cdot 3{,}375 = 1{,}5
          $$
          $$
          Q_B = 7\cdot 1{,}5 = 10{,}5\ \text{m}^{3}/\text{min}
          $$

      - tipo: justificar
        pregunta: Ordena las respuestas a b) y d). Una pieza es falsa.
        piezas:
          - texto: >-
              Los grupos son $\eta$, $Q/(nD^{3})$, $\mu/(\rho D^{2}n)$ y
              $g/(Dn^{2})$.
          - texto: >-
              Con el mismo fluido, el tercero pide $D^{2}n$ constante y el
              cuarto $Dn^{2}$ constante: incompatibles salvo con $D_A = D_B$.
              La semejanza absoluta es **imposible**.
          - texto: >-
              Respetando solo Reynolds, la máquina grande gira a 444,4 rpm y
              descarga 10,5 m³/min.
          - texto: >-
              Como la turbobomba B es mayor, tendrá mejor rendimiento que la A.
            trampa: true
            mensaje: |
              Tendrán **el mismo**. El rendimiento es él mismo uno de los
              adimensionales, $\pi_1 = \eta$, así que si los demás coinciden
              —y en el punto calculado coinciden $\pi_2$ y $\pi_3$— el
              rendimiento tiene que coincidir también. Que las máquinas
              grandes rindan más en la práctica es un efecto de escala real
              —holguras y rugosidades relativas menores— que este modelo no
              recoge.
    resolucion: |
      **a) Los cuatro grupos.** Seis variables y tres dimensiones dan tres
      grupos… más el propio rendimiento, que ya es adimensional:

      $$
      \pi_1 = \eta
      \qquad
      \pi_2 = \frac{Q}{n\,D^{3}}
      \qquad
      \pi_3 = \frac{\mu}{\rho\,D^{2}n}
      \qquad
      \pi_4 = \frac{g}{D\,n^{2}}
      $$

      El $\pi_2$ es el **coeficiente de caudal** y el $\pi_4$ el inverso del
      **coeficiente de altura** disfrazado; el $\pi_3$ es el Reynolds de la
      máquina.

      **b) La semejanza absoluta.** Con el mismo fluido, $\pi_3$ exige
      $D^{2}n$ constante y $\pi_4$ exige $D\,n^{2}$ constante. Dividiendo una
      condición por la otra sale $D = $ constante: las dos máquinas tendrían
      que tener el mismo diámetro. **Imposible.**

      **c) La semejanza restringida de Reynolds.**

      $$
      n_B = n_A\Bigl(\frac{D_A}{D_B}\Bigr)^{2} = 444{,}4\ \text{rpm}
      \qquad
      Q_B = Q_A\,\frac{n_B}{n_A}\Bigl(\frac{D_B}{D_A}\Bigr)^{3}
      = 10{,}5\ \text{m}^{3}/\text{min}
      $$

      **d) El rendimiento.** El mismo en las dos. El rendimiento **es** uno de
      los adimensionales, y en el punto calculado coinciden $\pi_2$ y
      $\pi_3$: si el fenómeno depende solo de esos grupos, $\eta$ no puede
      salir distinto.

      **Lo que hay que llevarse.** El análisis dimensional de una turbomáquina
      es el mismo de siempre con una sustitución: donde en un flujo va $v$,
      aquí va $nD$. Y la conclusión es la de las leyes de semejanza que el
      tema 22 usa a diario —$Q \propto nD^{3}$, $H \propto n^{2}D^{2}$— pero
      deducida en vez de recordada.

  # ── 6 (12 %) · Una turbina entre dos tuberías, con el diámetro de la
  #    primera deducido de la potencia que se pierde en ella.
  - id: exflu1920-ord-6-la-turbina-entre-dos-tuberias
    titulo: La turbina de la montaña, y el diámetro que sale de una pérdida
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El agua fluye desde el embalse A (situado a una cota de 900 m) hasta el
      depósito B presurizado a 5,5 bar (situado a 815 m). Gracias a la turbina
      hidráulica ubicada entre las tuberías 1 y 2 se abastece de electricidad
      la escuela de una población situada en la montaña. El rendimiento de la
      turbina es 0,78. Los datos de las tuberías son:

      - Tubería 1: longitud de 275 m, diámetro desconocido, material **PVC**.
      - Tubería 2: longitud de 90 m, diámetro de 200 mm, material
        **hormigón**.

      Las pérdidas menores que hay que tener en cuenta son las generadas por
      siete codos de 90º instalados en la tubería 1. La longitud equivalente
      de cada codo es de 9 m. La potencia total perdida en la tubería 1,
      teniendo en cuenta también las pérdidas menores, es de 1,5 kW. Se pide
      calcular mediante **Darcy-Weisbach**:

      **a)** El diámetro exacto de la tubería 1 (mm) y la potencia útil de la
      turbina (kW). El caudal circulante es de 40 l/s.

      Imprescindible: indicar el tipo de flujo, el comportamiento hidráulico y
      la expresión empleada a la hora de calcular el coeficiente de
      frotamiento.
    pide: El diámetro de la primera tubería y la potencia útil de la turbina.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la **potencia** perdida en la tubería 1, no su
          pérdida de carga. ¿Cómo se pasa de una a otra?
        opciones:
          - texto: >-
              Dividiendo entre $\gamma Q$: la potencia disipada es
              $\gamma\,Q\,h_f$
            correcta: true
            mensaje: |
              Eso es, y es la puerta de entrada al problema. Con
              $\gamma Q = 392$ W/m, los 1,5 kW son 3,83 metros de carga, y de
              ahí se despeja el diámetro.
          - texto: >-
              Multiplicando por el rendimiento de la turbina
            mensaje: |
              El rendimiento es de la máquina, no de la tubería. Una tubería
              no tiene rendimiento: disipa todo lo que pierde.
          - texto: >-
              No se puede: falta el diámetro
            mensaje: |
              Precisamente al revés: la potencia perdida es el dato que
              **permite** calcular el diámetro. La relación
              $P = \gamma Q h_f$ no contiene el diámetro por ningún lado.

      - tipo: calcular
        titulo: La pérdida de carga de la primera tubería
        pregunta: |
          ¿Cuánta carga se pierde en la tubería 1, en metros?
        respuesta:
          tipo: magnitud
          valor: '3.83 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.153 m'
            mensaje: |
              Te has dejado el caudal. La potencia disipada es
              $\gamma\,Q\,h_f$, no $\gamma\,h_f$.
          - valor: '1.5 m'
            mensaje: |
              Has tomado los kilovatios como metros. Son unidades distintas;
              el puente entre ellas es $\gamma Q$.
        pista: |
          $P = \gamma\,Q\,h_f$ con $Q = 40$ l/s.
        desarrollo: |
          $$
          h_{f1} = \frac{1500}{9800\cdot 0{,}04} = 3{,}83\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro de la primera tubería
        pregunta: |
          ¿Qué diámetro tiene la tubería 1, en mm?
        respuesta:
          tipo: magnitud
          valor: '176 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '191 mm'
            mensaje: |
              Parece que has repartido los 1,5 kW entre las dos tuberías. El
              enunciado dice «la potencia total perdida en la tubería **1**,
              teniendo en cuenta también las pérdidas menores»: es solo de la
              primera, codos incluidos.
          - valor: '200 mm'
            mensaje: |
              Ese es el diámetro de la tubería **2**, que sí es dato. El de la
              1 es lo que se busca.
        pista: |
          Longitud equivalente $275 + 7\cdot 9 = 338$ m, y hay que tantear
          porque $f$ depende del diámetro.
        desarrollo: |
          $$
          h_{f1} = f\,\frac{338}{D}\,\frac{v^{2}}{2g}
          = 0{,}04473\,\frac{f}{D^{5}} = 3{,}83
          $$

          Con PVC ($\varepsilon = 0{,}0007$ cm) el flujo es **turbulento** y
          está en la zona de transición, así que $f$ sale de **Colebrook**.
          Tanteando converge en $f \approx 0{,}0150$ y

          $$
          D = 176\ \text{mm}
          $$

      - tipo: calcular
        titulo: La potencia útil de la turbina
        pregunta: |
          ¿Cuánta potencia útil da la turbina, en kW?
        respuesta:
          tipo: magnitud
          valor: '7.3 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '9.35 kW'
            mensaje: |
              Esa es la potencia **bruta**, la que el agua entrega al rodete.
              La útil es el 78 % de ella.
          - valor: '5.69 kW'
            mensaje: |
              Has aplicado el rendimiento dos veces. Solo hay una conversión:
              de la energía del agua a la del eje.
        pista: |
          El salto que le queda a la turbina es el bruto menos la presión del
          depósito B y menos las dos pérdidas.
        desarrollo: |
          $$
          \frac{p_B}{\gamma} = \frac{550000}{9800} = 56{,}12\ \text{m}
          \qquad
          h_{f2} = 1{,}21\ \text{m}
          $$
          $$
          H_t = 900-815-56{,}12-3{,}83-1{,}21 = 23{,}84\ \text{m}
          $$
          $$
          P = 0{,}78\cdot 9800\cdot 0{,}04\cdot 23{,}84 = 7{,}3\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 1,5 kW perdidos en la tubería 1 son 3,83 metros de carga, y
              de ahí sale su diámetro: 176 mm.
          - texto: >-
              El salto bruto de 85 m se reparte entre la presión del depósito
              B —56,12 m—, las dos pérdidas y lo que le queda a la turbina.
          - texto: >-
              A la turbina le quedan 23,84 m, que a 40 l/s y con un
              rendimiento del 78 % son 7,3 kW.
          - texto: >-
              Los 5,5 bar del depósito B son una energía que se recupera, así
              que ayudan a la turbina.
            trampa: true
            mensaje: |
              Van **en contra**. El agua tiene que llegar a B con esa presión,
              así que esos 56 metros de columna son energía que la turbina
              **no** puede aprovechar: se los lleva el depósito. De los 85
              metros de salto bruto, la presión de B se come 56 y las pérdidas
              5; a la turbina le quedan 24.
    resolucion: |
      **El planteamiento, que va del revés.** Lo habitual es conocer el
      diámetro y calcular la pérdida. Aquí se da la **potencia** perdida y se
      busca el diámetro, y la relación que lo permite es

      $$
      P = \gamma\,Q\,h_f
      \qquad\Longrightarrow\qquad
      h_{f1} = \frac{1500}{9800\cdot 0{,}04} = 3{,}83\ \text{m}
      $$

      **El diámetro.** Con la longitud equivalente $275+7\cdot 9 = 338$ m y
      $Q = 40$ l/s, la ecuación de Darcy-Weisbach queda en función de $D$:

      $$
      3{,}83 = 0{,}04473\,\frac{f}{D^{5}}
      $$

      Hay que tantear, porque $f$ depende de $D$ por dos caminos —el Reynolds
      y la rugosidad relativa—. El flujo es **turbulento** ($Re$ del orden de
      $3\cdot 10^{5}$) y en **régimen de transición**, así que el coeficiente
      sale de **Colebrook**. Converge en $f \approx 0{,}0150$ y
      $D = 176$ mm.

      **La potencia.** El salto bruto son 85 m, y de ahí hay que descontar
      todo lo que la turbina no ve:

      | concepto | metros |
      |---|---|
      | presión del depósito B | 56,12 |
      | pérdida en la tubería 1 | 3,83 |
      | pérdida en la tubería 2 | 1,21 |
      | **queda para la turbina** | **23,84** |

      $$
      P_{util} = 0{,}78\cdot\gamma\,Q\,H_t = 7{,}3\ \text{kW}
      $$

      **Lo que hay que llevarse.** De 85 metros de salto, la turbina solo
      aprovecha 24. Los 56 de la presión del depósito B no son una pérdida
      —el agua llega con ellos y sirven para algo aguas abajo— pero desde el
      punto de vista de la turbina son energía que no puede tocar. Confundir
      «no se pierde» con «se aprovecha aquí» es el error caro de este
      ejercicio.

  # ── 7 (15 %) · Una red ramificada de cuatro barrios, con la presión de un
  #    nudo y el diámetro comercial de la última rama.
  - id: exflu1920-ord-7-la-red-de-cuatro-barrios
    titulo: La red de cuatro barrios, y el diámetro que fija el más lejano
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Desde el depósito abierto A, situada la lámina de agua en cota 10, se
      bombea agua a 4 barrios (C, D, E y F). Las tuberías son de polietileno
      (PE).

      | | C | D | E | F |
      |---|---|---|---|---|
      | cota (m) | 25 | 43 | 25 | 30 |
      | demanda punta (l/s) | 3,5 | 17,5 | 13 | 11 |

      | | $t_1$ | $t_2$ | $t_3$ | $t_4$ |
      |---|---|---|---|---|
      | longitud (m) | 1000 | 2600 | 1500 | 2000 |
      | diámetro (mm) | 225 | 175 | 175 | ? |

      La red sale de la bomba B, sube por $t_1$ hasta el nudo C; de C parte
      $t_2$ hasta D y $t_3$ hasta E; y de E parte $t_4$ hasta F.

      **a)** Indicar los caudales circulantes en cada tubería y la altura
      manométrica que debe aportar la bomba. La gráfica de la bomba instalada
      da $H_m = 90$ mca para el caudal total.

      **b)** Presión del flujo en el barrio D (mca).

      **c)** Diámetro comercial mínimo a instalar en la tubería 4 si la
      presión mínima en el barrio F ha de ser $p_F = 40$ mca para los caudales
      punta. Los diámetros comerciales existentes van de 25 en 25 mm.

      Nota importante: no tener en cuenta el término cinético de la ecuación
      de Bernoulli.
    pide: Los caudales de la red, la presión en D y el diámetro de la última rama.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una red **ramificada** como esta, ¿cómo se reparten los caudales?
        opciones:
          - texto: >-
              Cada tubería lleva la suma de las demandas que quedan aguas
              abajo de ella, y no hay nada que iterar
            correcta: true
            mensaje: |
              Eso es. Una red ramificada, sin mallas, tiene los caudales
              **determinados por la continuidad sola**: $t_4$ lleva la demanda
              de F, $t_3$ la de E más la de F, y $t_1$ las cuatro. Solo las
              redes malladas obligan a iterar.
          - texto: >-
              Se reparten en proporción inversa a la resistencia de cada rama
            mensaje: |
              Eso pasa en un **paralelo**, donde dos ramas unen los mismos dos
              puntos. Aquí cada rama termina en un consumo distinto, así que
              el reparto lo fija la demanda.
          - texto: >-
              Hay que iterar hasta que las pérdidas de cada malla sumen cero
            mensaje: |
              Ese es el método de Hardy-Cross, y hace falta cuando hay
              **mallas**. Esta red es un árbol: de A sale un tronco que se va
              dividiendo y nunca se vuelve a juntar.

      - tipo: calcular
        titulo: El caudal de la tubería que sale de C hacia E
        pregunta: |
          ¿Cuánto lleva la tubería $t_3$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '24 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '13 l/s'
            mensaje: |
              Esa es solo la demanda de E. Por $t_3$ pasa además todo lo que
              consume F, que cuelga de E.
          - valor: '41.5 l/s'
            mensaje: |
              Has restado solo la demanda de C del total. Por $t_3$ no pasa lo
              que va a D: eso se lo lleva $t_2$.
        pista: |
          Todo lo que queda aguas abajo de la tubería.
        desarrollo: |
          $$
          Q_4 = 11
          \qquad
          Q_3 = 13+11 = 24
          \qquad
          Q_2 = 17{,}5
          \qquad
          Q_1 = 45\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La presión en el barrio D
        pregunta: |
          ¿Cuánta presión llega a D, en mca?
        respuesta:
          tipo: magnitud
          valor: '43.82 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '86.82 mca'
            mensaje: |
              Esa es la **altura piezométrica** en D. La presión es lo que
              queda tras descontar su cota, que son 43 m.
          - valor: '51.81 mca'
            mensaje: |
              Te has dejado la pérdida de $t_2$, que con 2.600 m de tubería de
              175 mm son casi ocho metros: la mayor de toda la red.
        pista: |
          Altura del depósito más la de la bomba, menos las pérdidas de $t_1$
          y $t_2$, menos la cota de D.
        desarrollo: |
          Con PE ($\varepsilon/D$ del orden de $3\cdot 10^{-5}$ en los dos
          tramos, banda de $C_{HW} = 140$):

          $$
          h_{f1} = 5{,}19\ \text{m}
          \qquad
          h_{f2} = 7{,}98\ \text{m}
          $$
          $$
          \frac{p_D}{\gamma} = 10+90-5{,}19-7{,}98-43 = 43{,}82\ \text{mca}
          $$

      - tipo: calcular
        titulo: El diámetro de la última rama
        pregunta: |
          ¿Qué diámetro comercial hay que instalar en $t_4$, en mm?
        respuesta:
          tipo: magnitud
          valor: '125 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '100 mm'
            mensaje: |
              El cálculo exacto da 120 mm, y hacia abajo no vale: con 100 la
              pérdida se dispara y F no llegaría a los 40 mca exigidos. Al
              redondear una capacidad se sube al comercial siguiente.
          - valor: '175 mm'
            mensaje: |
              Ese es el de $t_2$ y $t_3$. La rama $t_4$ lleva menos caudal
              —11 l/s— y admite un tubo bastante más estrecho.
        pista: |
          La altura piezométrica en E menos la exigida en F es toda la pérdida
          que $t_4$ puede permitirse.
        desarrollo: |
          $$
          H_E = 10+90-5{,}19-8{,}26 = 86{,}55\ \text{m}
          \qquad
          H_F^{min} = 30+40 = 70\ \text{m}
          $$
          $$
          h_{f4} \le 16{,}55\ \text{m}
          \;\Longrightarrow\;
          D \ge 120\ \text{mm}
          \;\longrightarrow\;
          D_{com} = 125\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Al ser ramificada, los caudales salen de la continuidad sola:
              45, 17,5, 24 y 11 l/s.
          - texto: >-
              Con $H_m = 90$ mca, a D le llegan 43,82 mca de presión pese a
              estar en la cota más alta de la red.
          - texto: >-
              A F, que está más lejos, la pérdida admisible de $t_4$ es de
              16,55 m, y con 11 l/s eso exige 125 mm.
          - texto: >-
              El barrio D es el más exigente de la red porque está en la cota
              más alta, 43 m.
            trampa: true
            mensaje: |
              El más exigente es **F**, y no por su cota sino por la presión
              que se le exige: 40 mca en la cota 30 son 70 metros de altura
              piezométrica, frente a los 43 de cota de D. Y encima cuelga del
              final de la rama más larga. En una red, «el punto crítico» no es
              el más alto: es aquel en el que la suma de cota más presión
              exigida más pérdidas acumuladas resulta mayor.
    resolucion: |
      **a) Los caudales.** La red es un árbol, así que la continuidad los fija
      sin iterar: cada tubería lleva la suma de lo que consumen los barrios
      que quedan aguas abajo.

      $$
      Q_1 = 45
      \qquad
      Q_2 = 17{,}5
      \qquad
      Q_3 = 24
      \qquad
      Q_4 = 11\ \text{l/s}
      $$

      Y la gráfica de la bomba da $H_m = 90$ mca para esos 45 l/s.

      **b) La presión en D.** Con Hazen-Williams y $C_{HW} = 140$ —que se
      elige por la rugosidad relativa, no por el nombre del material: los dos
      tramos dan $\varepsilon/D$ del orden de $3\cdot 10^{-5}$, que es la
      banda de 140—:

      $$
      h_{f1} = 5{,}19\ \text{m}
      \qquad
      h_{f2} = 7{,}98\ \text{m}
      $$
      $$
      \frac{p_D}{\gamma} = 100-5{,}19-7{,}98-43 = 43{,}82\ \text{mca}
      $$

      **c) La tubería 4.** El punto crítico de la red no es D sino **F**:
      necesita 40 mca en la cota 30, es decir 70 metros de altura
      piezométrica, y cuelga del final de la rama más larga.

      $$
      H_E = 100-5{,}19-8{,}26 = 86{,}55\ \text{m}
      \qquad
      h_{f4}\le 86{,}55-70 = 16{,}55\ \text{m}
      $$

      Con 11 l/s por 2.000 m, eso exige $D \ge 120$ mm, y como los comerciales
      van de 25 en 25, se instala el de **125 mm**.

      **Lo que enseña.** En una red ramificada el cálculo es fácil —no hay que
      iterar nada— y toda la dificultad está en **identificar el punto
      crítico**. No es el barrio más alto ni el más lejano por separado: es
      aquel donde cota, presión exigida y pérdidas acumuladas suman más. Aquí
      lo es F, que está trece metros por debajo de D.

  # ── 8 (8 %) · Un canal circular de arena, y el rectángulo óptimo que lo
  #    sustituye.
  - id: exflu1920-ord-8-el-canal-circular-de-arena
    titulo: El canal de arena, y el rectángulo que lo sustituye
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Por un canal de sección circular de **arena**, con un diámetro de 1,6 m,
      circula un caudal de agua de $3{,}7\ \text{m}^{3}/\text{s}$. La altura
      de calado es de 1,12 m. Se pide:

      **a)** Calcular la pendiente exacta del canal en milésimas y la
      velocidad de calado del flujo.

      En otro tramo de la instalación se quiere instalar un canal de sección
      rectangular hidráulicamente óptima, con una pendiente de 5 milésimas. El
      caudal circulante y el material del canal se mantienen constantes
      respecto al apartado anterior. Se pide:

      **b)** Calcular las dimensiones de la sección del canal.
    pide: La pendiente y la velocidad del canal circular, y el ancho del rectángulo óptimo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El calado es 1,12 m en un canal de 1,6 m de diámetro. ¿Qué implica
          eso para la geometría?
        opciones:
          - texto: >-
              Que el canal va lleno al 70 % y la superficie libre está **por
              encima** del centro, así que el ángulo mojado pasa de 180º
            correcta: true
            mensaje: |
              Eso es. Con $y/D = 0{,}7$ el arco mojado abarca casi 227º, y el
              área es bastante mayor que la mitad del círculo. Es el caso en
              que hay que ir con cuidado con los signos del seno al aplicar
              la fórmula del segmento circular.
          - texto: >-
              Que va justo por la mitad
            mensaje: |
              Por la mitad iría con 0,8 m de calado. Con 1,12 va al 70 %, y el
              área mojada es 1,50 m² frente a los 1,01 de la media caña.
          - texto: >-
              Que está en carga, es decir funcionando como tubería
            mensaje: |
              En carga estaría si el agua tocara la clave. Con 1,12 de 1,6
              todavía hay 48 cm de aire por encima: sigue siendo un canal con
              superficie libre.

      - tipo: calcular
        titulo: La velocidad del flujo
        pregunta: |
          ¿A qué velocidad circula el agua, en m/s?
        respuesta:
          tipo: magnitud
          valor: '2.46 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.84 m/s'
            mensaje: |
              Has usado el área del círculo **completo**,
              $\pi D^{2}/4 = 2{,}01\ \text{m}^{2}$. El canal va al 70 %, y su
              área mojada es de 1,50 m².
          - valor: '3.68 m/s'
            mensaje: |
              Has usado el área de la media caña, 1,01 m². Con 1,12 m de
              calado el agua pasa del centro y ocupa bastante más.
        pista: |
          $\theta = 2\arccos\bigl(1-y/R\bigr)$ y
          $A = R^{2}(\theta-\sin\theta)/2$.
        desarrollo: |
          $$
          \cos\frac{\theta}{2} = 1-\frac{1{,}12}{0{,}8} = -0{,}4
          \;\Longrightarrow\;
          \theta = 3{,}965\ \text{rad}
          $$
          $$
          A = \frac{0{,}64\,(3{,}965+0{,}734)}{2} = 1{,}503\ \text{m}^{2}
          \qquad
          v = \frac{3{,}7}{1{,}503} = 2{,}46\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La pendiente del canal
        pregunta: |
          ¿Qué pendiente tiene el canal, en milésimas?
        respuesta:
          tipo: numero
          valor: '6.561'
          tolerancia: 0.05
          formato: un número en milésimas
        distractores:
          - valor: '2.08'
            mensaje: |
              Has tomado el radio hidráulico igual al calado. $R_h = A/P$, y
              con $P = R\theta = 3{,}17$ m sale $0{,}474$ m, menos de la mitad
              del calado.
          - valor: '10.24'
            mensaje: |
              Parece que has usado $n = 0{,}025$. Para la arena el valor que
              reproduce los resultados publicados es $0{,}020$.
        pista: |
          Manning con $A = 1{,}503$, $P = R\theta = 3{,}17$ m y
          $n = 0{,}020$.
        desarrollo: |
          $$
          R_h = \frac{1{,}503}{3{,}172} = 0{,}474\ \text{m}
          $$
          $$
          \sqrt{J} = \frac{Q\,n}{A\,R_h^{2/3}}
          = \frac{3{,}7\cdot 0{,}020}{1{,}503\cdot 0{,}608} = 0{,}0810
          $$
          $$
          J = 6{,}561\ \text{milésimas}
          $$

      - tipo: calcular
        titulo: El ancho del rectángulo óptimo
        pregunta: |
          ¿Qué ancho tiene el canal rectangular óptimo, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.866 m'
          tolerancia: 0.02
          formato: un ancho, con su unidad
        distractores:
          - valor: '0.933 m'
            mensaje: |
              Ese es el **calado**. En el rectángulo óptimo el ancho es el
              doble del calado.
          - valor: '3.73 m'
            mensaje: |
              Has duplicado dos veces. El calado sale $0{,}933$ m y el ancho
              es su doble, $1{,}866$.
        pista: |
          $b = 2y$, $A = 2y^{2}$, $R_h = y/2$, con $n = 0{,}020$ y
          $J = 0{,}005$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}020}\,2y^{2}\Bigl(\frac{y}{2}\Bigr)^{2/3}
          \sqrt{0{,}005} = 4{,}454\,y^{8/3} = 3{,}7
          $$
          $$
          y = 0{,}933\ \text{m}
          \qquad
          b = 1{,}866\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $y/D = 0{,}7$ el arco mojado pasa de 180º y el área es de
              1,503 m², lo que da 2,46 m/s.
          - texto: >-
              Con $n = 0{,}020$ y ese radio hidráulico, la pendiente del canal
              circular es de 6,561 milésimas.
          - texto: >-
              El rectángulo óptimo, con menos pendiente —5 milésimas— y el
              mismo caudal, necesita 0,933 m de calado y 1,866 de ancho.
          - texto: >-
              Como el rectángulo óptimo tiene menos área que el circular,
              lleva el agua más deprisa y erosionará más la arena.
            trampa: true
            mensaje: |
              El rectángulo óptimo tiene $2y^{2} = 1{,}74\ \text{m}^{2}$
              frente a los $1{,}50$ del circular: **más** área, no menos, y
              por tanto menos velocidad —2,13 frente a 2,46 m/s—. Lo que pasa
              es que trabaja con menos pendiente, y por eso necesita una
              sección mayor para el mismo caudal.
    resolucion: |
      **a) El canal circular.** Con $R = 0{,}8$ m y $y = 1{,}12$ m, el agua
      pasa del centro: el arco mojado abarca

      $$
      \cos\frac{\theta}{2} = 1-\frac{y}{R} = -0{,}4
      \qquad
      \theta = 3{,}965\ \text{rad} = 227^{\circ}
      $$
      $$
      A = \frac{R^{2}(\theta-\sin\theta)}{2} = 1{,}503\ \text{m}^{2}
      \qquad
      P = R\theta = 3{,}172\ \text{m}
      \qquad
      R_h = 0{,}474\ \text{m}
      $$

      La velocidad sale sola, de la continuidad:

      $$
      v = \frac{3{,}7}{1{,}503} = 2{,}46\ \text{m/s}
      $$

      Y la pendiente, de Manning con $n = 0{,}020$ para la arena:

      $$
      J = 6{,}561\ \text{milésimas}
      $$

      **b) El rectángulo óptimo.** Mismo material y mismo caudal, pero con la
      pendiente rebajada a 5 milésimas:

      $$
      4{,}454\,y^{8/3} = 3{,}7
      \qquad
      y = 0{,}933\ \text{m}
      \qquad
      b = 1{,}866\ \text{m}
      $$

      **La comparación.** El rectángulo óptimo tiene 1,74 m² de sección frente
      a los 1,50 del circular, y sin embargo es la forma más eficiente. No hay
      contradicción: lo que se ha rebajado es la **pendiente**, de 6,56 a 5
      milésimas, y con menos energía disponible hace falta más sección. Si se
      comparasen a igual pendiente, el rectángulo óptimo ganaría.

      > Y una nota sobre el coeficiente. El cuadro n.º 26 asigna a la arena un
      > $n$ en torno a $0{,}020$-$0{,}025$; el valor que reproduce
      > exactamente los dos resultados publicados es **$0{,}020$**, y es el
      > que se ha usado aquí.
