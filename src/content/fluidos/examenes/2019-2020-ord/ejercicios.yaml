ejercicios:
  # ── 1 (12 %) · Un embrague de cinco discos en aceite. Diez películas, la
  #    velocidad relativa y el primer aceite de la tabla que llega.
  - id: exflu1920-ord-1-el-embrague-de-discos-en-aceite
    titulo: El embrague de discos en aceite, y qué aceite de la tabla lo mueve
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra un embrague hidráulico de múltiples etapas. En la
      Figura 1, cuando está completamente acoplado, transmite todo el par
      desde el eje izquierdo al eje derecho. En la figura 2 tiene la capacidad
      de transmitir un par de fuerzas $M$ de dependiendo de la separación
      "e".

      Si los datos iniciales son los siguientes:

      **Datos**: $N_1 = 260$ rpm; $N_2 = 40$ rpm; Ø₁ = 150 mm; Ø₂ = 1550 mm;
      $M = 4$ m·kN; $s = 0{,}79$ [-]; $e = 1{,}25$ mm.

      Calcular:

      **a)** Calcular la viscosidad cinemática del fluido requerida para
      transmitir el par de fuerzas $M$.

      **b)** Seleccionar de la tabla de la figura el aceite más adecuado para
      transmitir al menos el par de fuerza $M$ mientras se mantienen
      constantes las velocidades de rotación $N_1$ y $N_2$.

      **c)** Calcular la variación (%) que causará en la potencia transmitida
      el aceite seleccionado.

      **Notas nuestras.** La figura no se reproduce, y dice esto. La figura
      1 («1 irudia») es el embrague acoplado: los dos ejes giran juntos, a
      $N_1$. La figura 2 («2 irudia») es el embrague trabajando: el eje de la
      izquierda, que gira a $N_1$, termina en una carcasa con cinco ranuras
      llenas de aceite, y en cada ranura entra un disco del eje de la derecha,
      que gira a $N_2$. Entre cada cara de disco y la pared de su ranura queda
      una película de aceite de espesor $e$, acotada dos veces arriba. Ø₁ es
      el diámetro del eje de la derecha, donde arrancan los discos, y Ø₂ el
      diámetro exterior de los discos. A la derecha trae la tabla de
      aceites:

      | aceite | ν (cSt) | aceite | ν (cSt) |
      |---|---|---|---|
      | VG 700 | 700 | VG 68 | 68 |
      | VG 680 | 680 | VG 46 | 46 |
      | VG 460 | 460 | VG 32 | 32 |
      | VG 320 | 320 | VG 22 | 22 |
      | VG 220 | 220 | VG 15 | 15 |
      | VG 150 | 150 | VG 10 | 10 |
      | VG 100 | 100 | | |

      *El impreso escribe «un par de fuerzas M de dependiendo»; sobra el
      «de».*
    notas:
      - >-
        **Nota**: Las secciones laterales son insignificantes.
    pide: La viscosidad que hace falta, el aceite de la tabla y cuánto cambia la potencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la figura 2 los discos giran a $N_2$ y la carcasa que los rodea a
          $N_1$. ¿Qué velocidad de giro cizalla las películas de aceite?
        opciones:
          - texto: >-
              La relativa, $N_1 - N_2 = 220$ rpm: el aceite se pega a cada
              superficie y lo que lo deforma es la diferencia entre las dos
            correcta: true
            mensaje: |
              Eso es. En una película fina el perfil de velocidades es lineal,
              de la velocidad de una pared a la de la otra, y la tensión es
              $\tau = \mu\,\Delta v/e$. Si las dos giraran a la vez, como en la
              figura 1, no habría cizalla y el aceite no transmitiría nada:
              iría todo por el acoplamiento.
          - texto: >-
              La del eje motor, $N_1 = 260$ rpm
            mensaje: |
              Solo si los discos estuvieran quietos. Giran a 40 rpm en el mismo
              sentido, así que la pared de enfrente «huye» y la cizalla es
              menor: con 260 rpm el aceite necesario sale un 15 % menos
              viscoso de lo que hace falta.
          - texto: >-
              La suma, $N_1 + N_2 = 300$ rpm
            mensaje: |
              Se sumarían si giraran en sentidos opuestos, y entonces no sería
              un embrague: el par se opondría al giro de los dos ejes. Aquí el
              eje de la derecha arrastra, más despacio, en el mismo sentido que
              el de la izquierda.

      - tipo: calcular
        titulo: Las películas de aceite que trabajan
        pregunta: |
          Contando en la figura 2, ¿cuántas películas de aceite de espesor $e$
          transmiten par?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Has contado discos, no películas. Cada disco tiene aceite a los
              dos lados, entre sus dos caras y las dos paredes de su ranura: son
              dos películas por disco.
        pista: |
          Cinco ranuras, y en cada una un disco con aceite a un lado y al
          otro. Los cantos de los discos no cuentan: la nota dice que las
          secciones laterales son insignificantes.
        desarrollo: |
          $$
          5\ \text{discos}\times 2\ \text{caras} = 10\ \text{películas}
          $$

      - tipo: calcular
        titulo: La viscosidad dinámica que hace falta
        pregunta: |
          ¿Qué viscosidad dinámica tiene que tener el aceite para transmitir
          los 4 kN·m?
        respuesta:
          tipo: magnitud
          valor: '0.0383 Pa*s'
          tolerancia: 0.02
          formato: una viscosidad dinámica, con su unidad
        distractores:
          - valor: '0.0324 Pa*s'
            mensaje: |
              Has cizallado con $N_1 = 260$ rpm. Los discos giran a 40 rpm en
              el mismo sentido que la carcasa, así que la velocidad que
              deforma el aceite es la relativa, 220 rpm.
          - valor: '0.0766 Pa*s'
            mensaje: |
              Has contado cinco películas en vez de diez. Cada disco tiene
              aceite a los dos lados, y con la mitad de caras hace falta el
              doble de viscosidad.
        pista: |
          En una corona de radios $R_1$ y $R_2$, con la velocidad a la
          distancia $r$ igual a $\Delta\omega\,r$, el par de una cara es
          $\int_{R_1}^{R_2}\mu\,\frac{\Delta\omega\,r}{e}\,r\,2\pi r\,dr$.
        desarrollo: |
          $$
          \Delta\omega = (260-40)\,\frac{2\pi}{60} = 23{,}038\ \text{rad/s}
          $$
          $$
          M_{cara} = \frac{\pi\,\mu\,\Delta\omega}{2e}\,(R_2^{4}-R_1^{4})
          = \mu\,\frac{\pi\cdot 23{,}038}{2\cdot 0{,}00125}\,(0{,}775^{4}-0{,}075^{4})
          = 10\,443\,\mu
          $$
          $$
          4000 = 10\cdot 10\,443\,\mu
          \;\Longrightarrow\;
          \mu = 0{,}0383\ \text{Pa·s}
          $$

          El término de $R_1^{4}$ pesa una diezmilésima: casi todo el par lo
          hace el borde de los discos, donde la velocidad y el brazo son
          máximos.

      - tipo: calcular
        titulo: La viscosidad cinemática que hace falta
        pregunta: |
          ¿Y la viscosidad cinemática, en cSt?
        respuesta:
          tipo: magnitud
          valor: '48.5 cSt'
          tolerancia: 0.02
          formato: una viscosidad cinemática, con su unidad
        distractores:
          - valor: '38.3 cSt'
            mensaje: |
              Esa es la viscosidad **dinámica**, 38,3 centipoises, escrita
              como si fueran centistokes. Falta dividir entre la densidad del
              aceite, 790 kg/m³.
          - valor: '97 cSt'
            mensaje: |
              Has contado cinco películas en vez de diez: con la mitad de
              caras sale el doble. Cada disco tiene aceite a los dos lados.
        pista: |
          $\nu = \mu/\rho$, con $\rho = 0{,}79\cdot 1000$ kg/m³, y
          1 cSt $= 10^{-6}$ m²/s.
        desarrollo: |
          $$
          \nu = \frac{0{,}03830}{790} = 4{,}848\cdot 10^{-5}\ \text{m}^{2}/\text{s}
          = 48{,}5\ \text{cSt}
          $$

          El impreso da 48 cSt, redondeado; para el apartado c) hace falta el
          valor con sus cifras.

      - tipo: calcular
        titulo: El aceite que se elige
        pregunta: |
          ¿Qué viscosidad, en cSt, tiene el aceite de la tabla más adecuado?
        respuesta:
          tipo: numero
          valor: '68'
          tolerancia: 0.5
          formato: un número en centistokes
        distractores:
          - valor: '46'
            mensaje: |
              Es el más cercano, pero se queda corto: con 46 cSt el embrague
              transmitiría $46/48{,}5$ del par, 3,8 kN·m, y el enunciado pide
              «al menos» los 4 kN·m.
          - valor: '100'
            mensaje: |
              Ese también transmite el par, y de sobra: un 106 % más. Pero el
              más adecuado es el primero de la tabla que llega, el VG 68: con
              más viscosidad se transmite más par del necesario.
        pista: |
          El par es proporcional a $\mu$, y con la misma densidad, a $\nu$.
          Hace falta un aceite de 48,5 cSt o más.
        desarrollo: |
          En la tabla, 46 cSt se queda por debajo y 68 es el primero que pasa:
          **VG 68**.

      - tipo: calcular
        titulo: Cuánto sube la potencia
        pregunta: |
          Con el VG 68 y las mismas velocidades de giro, ¿cuánto varía la
          potencia transmitida, en tanto por ciento?
        respuesta:
          tipo: numero
          valor: '40.3'
          tolerancia: 1.5
          formato: un número en tanto por ciento, con su signo
        distractores:
          - valor: '-28.7'
            mensaje: |
              Has hecho el cociente al revés, $48{,}5/68$. La potencia nueva
              va con la viscosidad nueva: $68/48{,}5 = 1{,}403$, un aumento.
          - valor: '140.3'
            mensaje: |
              Ese es el cociente entre la potencia nueva y la vieja, en tanto
              por ciento. La variación es lo que cambia: $140{,}3 - 100$.
          - valor: '-5.1'
            mensaje: |
              Eso es lo que pasaría con el VG 46, que se queda corto. Con el
              elegido, el VG 68, la potencia sube.
        pista: |
          Con las velocidades fijas, la potencia va con el par, y el par con
          $\mu$: con la misma densidad, con $\nu$.
        desarrollo: |
          $$
          \frac{P'}{P} = \frac{M'}{M} = \frac{68}{48{,}48} = 1{,}403
          \;\Longrightarrow\;
          +40{,}3\ \%
          $$

          Con el 48 redondeado saldría un 41,7 %; la casilla acepta los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con cinco discos hay diez películas de aceite, cizalladas por la
              velocidad relativa: $N_1 - N_2 = 220$ rpm.
          - texto: >-
              Integrando la tensión por la corona, para 4 kN·m hace falta
              $\mu = 0{,}0383$ Pa·s, es decir 48,5 cSt con $s = 0{,}79$.
          - texto: >-
              El primer aceite de la tabla que llega es el VG 68, y con él el
              par, y la potencia, suben un 40,3 %.
          - texto: >-
              El más adecuado es el VG 46, porque es el más cercano a los
              48,5 cSt.
            trampa: true
            mensaje: |
              Cercano, pero por debajo. Con 46 cSt el embrague transmitiría
              un 5 % menos de par, 3,8 kN·m, y el enunciado pide «al menos»
              M. El más adecuado es el primero que llega, no el más cercano.
    resolucion: |
      **a) La viscosidad.** En cada película, de espesor $e$ muy pequeño, el
      perfil de velocidades es lineal entre la cara del disco y la pared de la
      ranura, y lo que lo deforma es la velocidad relativa:
      $\Delta\omega = (260-40)\cdot 2\pi/60 = 23{,}04$ rad/s. A la distancia
      $r$ del eje la tensión es $\tau = \mu\,\Delta\omega\,r/e$, y el par de
      una cara, integrando por la corona de Ø₁ a Ø₂:

      $$
      M_{cara} = \int_{R_1}^{R_2}\mu\,\frac{\Delta\omega\,r}{e}\,r\;2\pi r\,dr
      = \frac{\pi\,\mu\,\Delta\omega}{2e}\,(R_2^{4}-R_1^{4})
      $$

      Con cinco discos, cada uno con aceite a los dos lados, trabajan diez
      caras; los cantos no cuentan, como dice la nota:

      $$
      4000 = 10\cdot\frac{\pi\,\mu\cdot 23{,}04}{2\cdot 0{,}00125}\,
      (0{,}775^{4}-0{,}075^{4})
      \;\Longrightarrow\;
      \mu = 0{,}0383\ \text{Pa·s}
      $$
      $$
      \nu = \frac{\mu}{\rho} = \frac{0{,}0383}{790} = 48{,}5\ \text{cSt}
      $$

      El impreso da 48 cSt.

      **b) El aceite.** Con las velocidades fijas, el par es proporcional a
      $\mu$, y con la misma densidad, a $\nu$. Hace falta 48,5 cSt o más, y
      en la tabla el primero que llega es el **VG 68**; el VG 46 transmitiría
      un 5 % menos de lo pedido.

      **c) La potencia.** A velocidades constantes, la potencia va con el par:

      $$
      \frac{P'}{P} = \frac{68}{48{,}48} = 1{,}403
      \qquad\text{un aumento del } 40{,}3\ \%
      $$

      **Lo que enseña.** Aquí la viscosidad no es un dato que se mira en una
      tabla: es lo que se elige. Un embrague de este tipo transmite par sin
      que los discos se toquen, y el par va con $\mu$, con el número de caras,
      con $1/e$ y con $R_2^{4}$. El radio es la palanca más fuerte, pero el
      enunciado fija la geometría y deja libre el aceite; y dice que el par
      depende de «la separación e» porque, con la mitad de separación, el
      mismo aceite transmite el doble.

  # ── 2 (20 %) · Dos depósitos dentro de una cámara de aire, con cinco
  #    manómetros que miden contra cosas distintas.
  - id: exflu1920-ord-2-los-depositos-dentro-de-la-camara
    titulo: Los dos depósitos dentro de una cámara de aire, y cada manómetro contra qué mide
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La imagen muestra un depósito de dimensiones grandes C lleno de aire.
      En su interior hay dos depósitos de base cuadrada (A y B) con una altura
      de $L = 100$ cm. En el depósito A hay un fluido con una densidad
      relativa de $s_1 = 0{,}9$ y en el depósito B hay un fluido de densidad
      relativa de $s_3 = 3{,}2$. Entre los dos hay un manómetro en forma de U,
      siendo el líquido manométrico $s_2 = 0{,}6$.

      Se conectan dos manómetros a cada deposito A y B, donde los manómetros 2
      y 3 miden presiones absolutas.

      **a)** Calcular la lectura del manómetro U conectado al tanque C.

      **b)** Calcular la lectura del manómetro diferencial.

      La relación entre el diámetro del tubo del manómetro diferencial y el
      lado del tanque cuadrado B es 0,4.

      **c)** Calcular la presión máxima y mínima en la cámara de aire del
      tanque B para evitar que el fluido manométrico se introduzca al tubo
      horizontal, sabiendo que el proceso de compresión/expansión del aire es
      isotérmico.

      **d)** Si esta cámara de aire está conectada a un pistón de
      $D = 150$ mm, calcular la fuerza que resistirá en los dos casos
      calculados en la sección c).

      **Datos**: $H = 750$ mm; $P_1 = 18$ kPa; $P_3 = 1{,}38$ atm;
      $P_4 = 780000\ \text{dyn/cm}^{2}$; $y = 28$ cm; $z = 74{,}2$ cm.

      **Notas nuestras.** La figura no se reproduce, y dice esto. Dentro de
      la cámara C, llena de aire, están los dos depósitos, apoyados en el
      mismo fondo y de altura $L$: A a la izquierda, lleno hasta arriba del
      fluido $s_1$, y B a la derecha, con el fluido $s_3$ hasta la altura $z$
      sobre el fondo y aire encima; sobre B, un pistón de diámetro $D$ con una
      fuerza $F$. Los manómetros 1 (manométrico) y 3 (absoluto) están fuera
      de C, pinchados en lo alto de A y en la cámara de aire de B; el 2
      (absoluto) y el 4 (manométrico), dentro de C, en los mismos dos sitios.
      Del fondo de cada depósito sale un tubo horizontal que sube y se une al
      otro en un tubo en U invertida con el líquido $s_2$ arriba: en la rama
      de A, el fluido $s_1$ llega a la altura $y$ sobre el fondo; en la de B,
      el $s_3$ queda $R$ por encima de esa interfaz. Fuera de C, una U de
      mercurio conectada a C marca $X$, con el mercurio más alto en la rama
      de C, y a la izquierda un barómetro de mercurio da la altura $H$. *El
      impreso escribe «cada deposito», sin tilde, y llama «manómetro en forma
      de U» al de $s_2$, que en la figura es una U invertida; los datos
      escriben $y$ y $z$ en minúscula y la figura, en mayúscula.*
    pide: La lectura de la U de mercurio y la del diferencial, las presiones límite del aire de B y la fuerza del pistón.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro 4 es manométrico y está **dentro** de la cámara C.
          ¿Contra qué presión mide?
        opciones:
          - texto: >-
              Contra el aire de C, que es lo que tiene alrededor:
              $P_4 = p_B - p_C$
            correcta: true
            mensaje: |
              Eso es. Un manómetro manométrico compara lo que tiene dentro con
              lo que tiene fuera, y fuera del 4 está el aire de la cámara C,
              no la atmósfera. Por eso, con el 3 absoluto en el mismo sitio,
              la resta da la presión de C sin ningún otro dato.
          - texto: >-
              Contra la atmósfera, como todos los manométricos
            mensaje: |
              Solo los que tienen la atmósfera alrededor. El 1 sí, porque está
              fuera de C; el 4 está dentro, y su «fuera» es el aire de C. Con
              la atmósfera, el 3 y el 4 darían dos presiones distintas para la
              misma cámara de aire de B.
          - texto: >-
              Contra el vacío: da la presión absoluta, como el 3
            mensaje: |
              El enunciado dice que los absolutos son el 2 y el 3. Si el 4
              también lo fuera, marcaría lo mismo que el 3, 1,38 atm, y no
              0,78 bar.

      - tipo: calcular
        titulo: La presión de la cámara C
        pregunta: |
          ¿A qué presión absoluta está el aire de la cámara C, en Pa?
        respuesta:
          tipo: magnitud
          valor: '61828.5 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '217828.5 Pa'
            mensaje: |
              Has sumado el 4 en vez de restarlo. El 4 marca cuánto está B
              por **encima** de C: $p_C = P_3 - P_4$.
          - valor: '-38131.5 Pa'
            mensaje: |
              Esa es la presión de C respecto de la atmósfera, una depresión.
              Se pide la absoluta: $P_3 - P_4$ directamente.
        pista: |
          $P_3$ es la absoluta del aire de B, y $P_4$, lo que ese aire está
          por encima de C. 1 dyn/cm² $= 0{,}1$ Pa y 1 atm $= 101\,325$ Pa.
        desarrollo: |
          $$
          P_3 = 1{,}38\cdot 101\,325 = 139\,828{,}5\ \text{Pa}
          \qquad
          P_4 = 780\,000\cdot 0{,}1 = 78\,000\ \text{Pa}
          $$
          $$
          p_C = P_3 - P_4 = 61\,828{,}5\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La lectura de la U de mercurio
        pregunta: |
          ¿Cuánto marca la U de mercurio conectada a C, en mm?
        respuesta:
          tipo: magnitud
          valor: '286.1 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '296.3 mm'
            mensaje: |
              Has tomado la atmósfera como 1 atm. El enunciado da un
              barómetro: $H = 750$ mm de mercurio, 99 960 Pa, y es contra esa
              atmósfera contra la que está abierta la U.
          - valor: '164.8 mm'
            mensaje: |
              Has tomado los 78 kPa del manómetro 4 como la presión absoluta
              de C. El 4 es manométrico y está dentro de C: marca lo que B
              está por encima de C.
        pista: |
          La U tiene C en una rama y la atmósfera en la otra, y la atmósfera la
          da el barómetro: 750 mm de mercurio.
        desarrollo: |
          $$
          p_{atm} = 0{,}75\cdot 13\,600\cdot 9{,}8 = 99\,960\ \text{Pa}
          $$
          $$
          X = \frac{p_{atm}-p_C}{\gamma_{Hg}} = \frac{38\,131{,}5}{133\,280}
          = 0{,}2861\ \text{m} = 286{,}1\ \text{mm}
          $$

          C está por debajo de la atmósfera, y por eso el mercurio sube por la
          rama de C.

      - tipo: calcular
        titulo: La lectura del manómetro diferencial
        pregunta: |
          ¿Cuánto vale $R$, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.178 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.674 m'
            mensaje: |
              Has tomado el manómetro 1 contra el aire de C. El 1 está fuera
              de la cámara, así que mide contra la atmósfera: la tapa de A está
              a $18\,000 + 99\,960$ Pa absolutos.
          - valor: '0.806 m'
            mensaje: |
              Has leído la U como si el líquido manométrico estuviera abajo y
              fuera el más pesado: con $\gamma_3 + \gamma_2$. Está arriba, en
              una U invertida, y es el más ligero: entra $\gamma_3 - \gamma_2$.
          - valor: '0.957 m'
            mensaje: |
              Te has dejado la columna de $s_2$: los $R$ metros de líquido
              manométrico de la U también pesan, y restan.
        pista: |
          Baja desde la tapa de A por el fluido $s_1$ hasta la interfaz de la
          rama de A, sube $R$ por el $s_2$ hasta la de la rama de B, y sigue
          por el $s_3$ hasta el nivel de B y su aire.
        desarrollo: |
          Con $P_1$ contra la atmósfera, la tapa de A está a
          $p_A = 18\,000 + 99\,960 = 117\,960$ Pa. Recorriendo el manómetro:

          $$
          p_A + \gamma_1\,(L-y) - \gamma_2\,R = P_3 + \gamma_3\,(z-y-R)
          $$
          $$
          R = \frac{P_3 + \gamma_3\,(z-y) - p_A - \gamma_1\,(L-y)}{\gamma_3-\gamma_2}
          = \frac{139\,828{,}5 + 14\,488{,}3 - 117\,960 - 6350{,}4}{25\,480}
          $$
          $$
          R = 1{,}178\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión mínima del aire de B
        pregunta: |
          ¿Cuál es la presión mínima del aire de B, en bar?
        respuesta:
          tipo: magnitud
          valor: '1.23 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1.191 bar'
            mensaje: |
              Has tomado la razón de áreas como $0{,}4^{2} = 0{,}16$. El tubo es
              circular y el depósito cuadrado: la razón es
              $\frac{\pi}{4}\,0{,}4^{2} = 0{,}1257$.
          - valor: '0.975 bar'
            mensaje: |
              Has usado 0,4 como razón de áreas. 0,4 es la de longitudes, el
              diámetro del tubo entre el lado del depósito; las áreas van con
              su cuadrado, y además el tubo es circular.
        pista: |
          La mínima es con el líquido manométrico corrido hacia A hasta que su
          interfaz llega al tubo horizontal: baja $y$ en esa rama y el $s_3$
          sube $y$ en la otra, sacándolo de B.
        desarrollo: |
          $$
          \frac{a_{tubo}}{A_B} = \frac{\pi}{4}\,0{,}4^{2} = 0{,}1257
          \qquad
          \Delta z_B = 0{,}28\cdot 0{,}1257 = 0{,}0352\ \text{m}
          $$

          El aire de B pasa de $L - z = 0{,}258$ m a $0{,}2932$ m de altura:

          $$
          p_{\text{mín}} = 139\,828{,}5\cdot\frac{0{,}258}{0{,}2932}
          = 123\,047\ \text{Pa} = 1{,}23\ \text{bar}
          $$

      - tipo: calcular
        titulo: La presión máxima del aire de B
        pregunta: |
          ¿Y la máxima, en bar?
        respuesta:
          tipo: magnitud
          valor: '4.82 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.279 bar'
            mensaje: |
              Has corrido la interfaz de la rama de B solo $R$. Está a $y + R$
              del fondo, $1{,}458$ m, y tiene que bajar todo eso para llegar al
              tubo horizontal.
          - valor: '14.56 bar'
            mensaje: |
              Has tomado la razón de áreas como $0{,}4^{2} = 0{,}16$, sin el
              $\pi/4$ del tubo circular. Con tanto recorrido, el error se
              dispara: el aire quedaría casi aplastado.
        pista: |
          La máxima es al revés: el líquido manométrico corrido hacia B hasta
          que la interfaz de esa rama, a $y + R$ del fondo, llega al tubo
          horizontal; el $s_3$ que sale de esa rama vuelve a B.
        desarrollo: |
          $$
          \Delta z_B = (0{,}28 + 1{,}1776)\cdot 0{,}1257 = 0{,}1832\ \text{m}
          $$

          El aire queda en $0{,}258 - 0{,}1832 = 0{,}0748$ m:

          $$
          p_{\text{máx}} = 139\,828{,}5\cdot\frac{0{,}258}{0{,}0748}
          = 482\,123\ \text{Pa} = 4{,}82\ \text{bar}
          $$

      - tipo: calcular
        titulo: La fuerza en el pistón con la presión mínima
        pregunta: |
          Con la presión mínima, ¿qué fuerza soporta el pistón, en N?
        respuesta:
          tipo: magnitud
          valor: '1081.83 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2174.4 N'
            mensaje: |
              Has multiplicado la presión absoluta por el área. El pistón
              tiene aire por los dos lados: por dentro el de B, por fuera el de
              C, a 61 828,5 Pa. La fuerza es la diferencia.
          - valor: '408 N'
            mensaje: |
              Has descontado la atmósfera, pero el pistón no está al aire
              libre: está dentro de la cámara C, y lo que tiene por fuera es su
              aire, a 61 828,5 Pa.
        pista: |
          El pistón está dentro de C: $F = (p_B - p_C)\,\pi D^{2}/4$.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
          $$
          $$
          F_{\text{mín}} = (123\,047 - 61\,828{,}5)\cdot 0{,}017671 = 1081{,}83\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza en el pistón con la presión máxima
        pregunta: |
          ¿Y con la máxima, en N?
        respuesta:
          tipo: magnitud
          valor: '7427.22 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '8519.8 N'
            mensaje: |
              Presión absoluta por el área. Por fuera del pistón está el aire
              de C, que empuja en contra con 61 828,5 Pa.
          - valor: '6753.4 N'
            mensaje: |
              Has descontado la atmósfera del barómetro. El pistón está dentro
              de C y tiene por fuera su aire, que está por debajo de la
              atmósfera.
        pista: |
          La misma cuenta que para la mínima.
        desarrollo: |
          $$
          F_{\text{máx}} = (482\,123 - 61\,828{,}5)\cdot 0{,}017671 = 7427{,}2\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro 4 está dentro de C y mide contra su aire:
              $p_C = P_3 - P_4 = 61\,828{,}5$ Pa, por debajo de la atmósfera
              del barómetro, y la U de mercurio lo marca con 286,1 mm.
          - texto: >-
              Recorriendo el diferencial desde la tapa de A hasta el aire de B,
              con el manómetro 1 contra la atmósfera, sale $R = 1{,}178$ m.
          - texto: >-
              El aire de B cambia de volumen a temperatura constante según se
              corra el líquido manométrico por el tubo, y los dos topes dan
              1,23 y 4,82 bar.
          - texto: >-
              El pistón soporta la presión absoluta del aire de B por su área:
              2174 N con la mínima y 8520 N con la máxima.
            trampa: true
            mensaje: |
              Por fuera del pistón también hay aire, el de la cámara C, a
              61 828,5 Pa. La fuerza es la diferencia de presiones por el
              área: 1081,83 y 7427,22 N.
    resolucion: |
      **Contra qué mide cada manómetro.** Es todo el ejercicio. Los absolutos,
      el 2 y el 3, miden contra el vacío. Los manométricos miden contra lo que
      tienen alrededor: el 1, fuera de la cámara, contra la atmósfera; el 4,
      dentro, contra el aire de C. La atmósfera la da el barómetro:
      $p_{atm} = 0{,}75\cdot 13\,600\cdot 9{,}8 = 99\,960$ Pa.

      **a) La U de mercurio.** Con el 3 y el 4 en la misma cámara de aire de
      B:

      $$
      p_C = P_3 - P_4 = 139\,828{,}5 - 78\,000 = 61\,828{,}5\ \text{Pa}
      \qquad
      X = \frac{99\,960 - 61\,828{,}5}{133\,280} = 286{,}1\ \text{mm}
      $$

      con el mercurio más alto en la rama de C, que está en depresión.

      **b) El diferencial.** La tapa de A está a $18\,000 + 99\,960 = 117\,960$
      Pa absolutos (es lo que marcaría el 2, que no hace falta). Bajando por el
      $s_1$ hasta la interfaz de la rama de A, subiendo $R$ por el $s_2$ y
      siguiendo por el $s_3$ hasta el aire de B:

      $$
      p_A + \gamma_1\,(L-y) - \gamma_2\,R = P_3 + \gamma_3\,(z-y-R)
      \;\Longrightarrow\;
      R = \frac{30\,006{,}4}{25\,480} = 1{,}178\ \text{m}
      $$

      **c) Los topes.** El líquido manométrico se mueve en bloque: lo que
      baja una interfaz lo sube la otra, y el $s_3$ que entra o sale de la
      rama de B baja o sube el nivel de B en esa longitud por
      $a/A_B = \frac{\pi}{4}\,0{,}4^{2} = 0{,}1257$. El aire de B, que ocupa
      $L - z = 0{,}258$ m, cambia de volumen a temperatura constante. El
      pistón no se mueve, así que la presión del aire de B la fija solo su
      volumen. Lo que corre el líquido manométrico es lo que pasa del lado de
      A, cuya presión en cada tope no se pide. Por eso el tope hacia A, que
      saca líquido de B y expande su aire, es el de presión **mínima**. Es la
      lectura con la que salen los dos resultados impresos:

      | tope | recorrido | nivel de B | aire | presión |
      |---|---|---|---|---|
      | la interfaz de A llega al tubo | $y = 0{,}28$ m | baja 3,52 cm | 0,2932 m | 1,23 bar |
      | la interfaz de B llega al tubo | $y + R = 1{,}458$ m | sube 18,32 cm | 0,0748 m | 4,82 bar |

      **d) El pistón.** Está dentro de C, así que la fuerza es la diferencia
      entre el aire de B y el de C por
      $\pi\cdot 0{,}15^{2}/4 = 0{,}017671$ m²: **1081,83 N** con la mínima y
      **7427,22 N** con la máxima.

      **Lo que enseña.** Seis manómetros y un barómetro para dos presiones
      desconocidas: sobran lecturas, y lo que se examina es saber cuál mide
      contra qué. El 4, manométrico pero encerrado en la cámara, es el que
      decide el ejercicio: es la única lectura que ata la presión de C a las
      demás, y sin ella ni la U de mercurio ni el pistón tienen respuesta.

  # ── 3 (14 %) · Un cuerpo flotando entre dos líquidos bajo un gas a siete
  #    bares. Dos meganewton a cada lado y 33 kN de diferencia.
  - id: exflu1920-ord-3-el-cuerpo-que-flota-entre-dos-liquidos
    titulo: El cuerpo que flota entre dos líquidos, con siete bares encima
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En el depósito cilíndrico de la imagen de diámetro 10 m se encuentran
      almacenados dos fluidos inmiscibles de densidades relativas
      $s_1 = 1{,}01$ y $s_2 = 0{,}79$. En el centro de la imagen se encuentra
      un cuerpo formado por un bloque cilíndrico de radio $R = 1$ m y altura
      $L = 75$ cm, y un cono de altura $H = 130$ cm que flota entre ambos
      fluidos. Sabiendo que el gas que se encuentra en la zona superior de la
      cámara ha sido introducido a razón de 66 g por segundo y esta operación
      ha necesitado 5,2 minutos, calcular:

      **a)** Altura $h$ que está sumergido el cuerpo de la figura en el fluido
      superior.

      **b)** Lectura del manómetro superior (mmcHg).

      **c)** Dibujar los prismas de presiones acotados de las fuerzas
      hidrostáticas realizadas por ambos fluidos sobre el cuerpo.

      **d)** Calcular las componentes horizontales y verticales de las fuerzas
      hidrostáticas ejercidas por cada fluido sobre el cuerpo.

      **DATOS**: $\gamma_{material} = 925\ \text{kg/m}^{3}$,
      $R_{gas} = 2077{,}16\ \text{J/(kg}\cdot\text{K)}$; $T = 20$ ºC;
      $V_{cono} = 1/3\cdot\pi\cdot R^{2}\cdot H$; $P_{atm} = 1$ atm.

      **Notas nuestras.** La figura, redibujada abajo, dice esto: bajo la tapa
      del depósito quedan 0,2 m de gas, con el manómetro $P_1$; debajo, el
      fluido superior, y la tapa del cilindro está **1 m** por debajo de su
      lámina: la cota de 1 m va de la lámina hasta la tapa, no hasta la
      interfaz. La interfaz corta al cilindro una altura $h$ por debajo de su
      tapa, y el cono, con el vértice hacia abajo, queda entero en el fluido
      inferior. *El peso específico del material va en «kg/m³» porque ese kg
      es un kilopondio: son $925\cdot 9{,}8$ N/m³.*

      <figure class="figura-examen">
      <svg viewBox="20 6 400 262" role="img" width="420" height="275"
           aria-labelledby="fw3t fw3d">
