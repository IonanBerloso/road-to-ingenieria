      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Al ser ramificada, los caudales salen de la continuidad sola:
              45, 17,5, 24 y 11 l/s.
          - texto: >-
              Con $H_m = 90$ mca, a D le llegan 43,82 mca de presión pese a
              estar en la cota más alta de la red.
          - texto: >-
              A F, que está más lejos, la pérdida admisible de $t_4$ es de
              16,54 m, y con 11 l/s eso exige 125 mm.
          - texto: >-
              El barrio D es el más exigente de la red porque está en la cota
              más alta, 43 m.
            trampa: true
            mensaje: |
              El más exigente es **F**, y no por su cota sino por la presión
              que se le exige: 40 mca en la cota 30 son 70 metros de altura
              piezométrica, frente a los 43 de cota de D. Y encima cuelga del
              final de la rama más larga. En una red, «el punto crítico» no es
              el más alto: es aquel en el que la suma de cota más presión
              exigida más pérdidas acumuladas resulta mayor.
    resolucion: |
      **a) Los caudales.** La red es un árbol, así que la continuidad los fija
      sin iterar: cada tubería lleva la suma de lo que consumen los barrios
      que quedan aguas abajo.

      $$
      Q_1 = 45
      \qquad
      Q_2 = 17{,}5
      \qquad
      Q_3 = 24
      \qquad
      Q_4 = 11\ \text{l/s}
      $$

      Y la gráfica de la bomba da $H_m = 90$ mca para esos 45 l/s.

      **b) La presión en D.** Con Hazen-Williams y $C_{HW} = 140$ —que se
      elige por la rugosidad relativa, no por el nombre del material: los dos
      tramos dan $\varepsilon/D$ del orden de $3\cdot 10^{-5}$, que es la
      banda de 140—:

      $$
      h_{f1} = 5{,}19\ \text{m}
      \qquad
      h_{f2} = 7{,}98\ \text{m}
      $$
      $$
      \frac{p_D}{\gamma} = 100-5{,}19-7{,}98-43 = 43{,}82\ \text{mca}
      $$

      **c) La tubería 4.** El punto crítico de la red no es D sino **F**:
      necesita 40 mca en la cota 30, es decir 70 metros de altura
      piezométrica, y cuelga del final de la rama más larga.

      $$
      H_E = 100-5{,}19-8{,}27 = 86{,}54\ \text{m}
      \qquad
      h_{f4}\le 86{,}54-70 = 16{,}54\ \text{m}
      $$

      Con 11 l/s por 2.000 m, eso exige $D \ge 120$ mm, y como los comerciales
      van de 25 en 25, se instala el de **125 mm**.

      **d) La línea piezométrica hasta D.** Sin término cinético, como manda
      la nota, coincide con la de energía. Arranca en la lámina de A, cota
      10; sube de golpe 90 m en la bomba, hasta 100; baja en recta por $t_1$
      hasta 94,81 m en C, donde la presión es $94{,}81 - 25 = 69{,}81$ mca, y
      sigue por $t_2$, con menos pendiente, hasta 86,82 m en D:
      $86{,}82 - 43 = 43{,}82$ mca.

      **Lo que enseña.** En una red ramificada el cálculo es fácil —no hay que
      iterar nada— y toda la dificultad está en **identificar el punto
      crítico**. No es el barrio más alto ni el más lejano por separado: es
      aquel donde cota, presión exigida y pérdidas acumuladas suman más. Aquí
      lo es F, que está trece metros por debajo de D.

  # ── 8 (8 %) · Un canal circular de arena, y el rectángulo óptimo que lo
  #    sustituye.
  - id: exflu1920-ord-8-el-canal-circular-de-arena
    titulo: El canal de arena, y el rectángulo que lo sustituye
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Por un canal de sección circular de arena, con un diámetro de 1,6 m,
      circula un caudal de agua de $3{,}7\ \text{m}^{3}/\text{s}$. La altura
      de calado es de 1,12 m. Se pide:

      **a)** Calcular la pendiente exacta del canal en milésimas y la
      velocidad de calado del flujo.

      En otro tramo de la instalación, se quiere instalar un canal de sección
      rectangular hidráulicamente óptima, con una pendiente de 5 milésimas. El
      caudal circulante y el material del canal se mantienen constantes
      respecto al apartado anterior. Se pide:

      **b)** Calcular las dimensiones de la sección del canal. Dibujar la
      sección indicando sus dimensiones.

      **Notas nuestras.** El ejercicio no trae figura. El coeficiente de
      Manning de la arena está en el cuadro n.º 26 del anexo: 0,020.
    pide: La pendiente y la velocidad del canal circular, y las dimensiones del rectángulo óptimo, dibujado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El calado es 1,12 m en un canal de 1,6 m de diámetro. ¿Qué implica
          eso para la geometría?
        opciones:
          - texto: >-
              Que el canal va lleno al 70 % y la superficie libre está **por
              encima** del centro, así que el ángulo mojado pasa de 180º
            correcta: true
            mensaje: |
              Eso es. Con $y/D = 0{,}7$ el arco mojado abarca algo más de 227º, y el
              área es bastante mayor que la mitad del círculo. Es el caso en
              que hay que ir con cuidado con los signos del seno al aplicar
              la fórmula del segmento circular.
          - texto: >-
              Que va justo por la mitad
            mensaje: |
              Por la mitad iría con 0,8 m de calado. Con 1,12 va al 70 %, y el
              área mojada es 1,50 m² frente a los 1,01 de la media caña.
          - texto: >-
              Que está en carga, es decir funcionando como tubería
            mensaje: |
              En carga estaría si el agua tocara la clave. Con 1,12 de 1,6
              todavía hay 48 cm de aire por encima: sigue siendo un canal con
              superficie libre.

      - tipo: calcular
        titulo: La velocidad del flujo
        pregunta: |
          ¿A qué velocidad circula el agua, en m/s?
        respuesta:
          tipo: magnitud
          valor: '2.46 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.84 m/s'
            mensaje: |
              Has usado el área del círculo **completo**,
              $\pi D^{2}/4 = 2{,}01\ \text{m}^{2}$. El canal va al 70 %, y su
              área mojada es de 1,50 m².
          - valor: '3.68 m/s'
            mensaje: |
              Has usado el área de la media caña, 1,01 m². Con 1,12 m de
              calado el agua pasa del centro y ocupa bastante más.
        pista: |
          $\theta = 2\arccos\bigl(1-y/R\bigr)$ y
          $A = R^{2}(\theta-\sin\theta)/2$.
        desarrollo: |
          $$
          \cos\frac{\theta}{2} = 1-\frac{1{,}12}{0{,}8} = -0{,}4
          \;\Longrightarrow\;
          \theta = 3{,}965\ \text{rad}
          $$
          $$
          A = \frac{0{,}64\,(3{,}965+0{,}734)}{2} = 1{,}503\ \text{m}^{2}
          \qquad
          v = \frac{3{,}7}{1{,}503} = 2{,}46\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La pendiente del canal
        pregunta: |
          ¿Qué pendiente tiene el canal, en milésimas?
        respuesta:
          tipo: numero
          valor: '6.561'
          tolerancia: 0.05
          formato: un número en milésimas
        distractores:
          - valor: '2.08'
            mensaje: |
              Has tomado el radio hidráulico igual al calado. $R_h = A/P$, y
              con $P = R\theta = 3{,}17$ m sale $0{,}474$ m, menos de la mitad
              del calado.
          - valor: '10.25'
            mensaje: |
              Has usado $n = 0{,}025$, que en el cuadro n.º 26 es el de la
              grava media. La arena tiene $0{,}020$, y la pendiente va con el
              cuadrado de $n$.
        pista: |
          Manning con $A = 1{,}503$, $P = R\theta = 3{,}17$ m y
          $n = 0{,}020$.
        desarrollo: |
          $$
          R_h = \frac{1{,}503}{3{,}172} = 0{,}474\ \text{m}
          $$
          $$
          \sqrt{J} = \frac{Q\,n}{A\,R_h^{2/3}}
          = \frac{3{,}7\cdot 0{,}020}{1{,}503\cdot 0{,}608} = 0{,}0810
          $$
          $$
          J = 6{,}561\ \text{milésimas}
          $$

      - tipo: calcular
        titulo: El ancho del rectángulo óptimo
        pregunta: |
          ¿Qué ancho tiene el canal rectangular óptimo, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.866 m'
          tolerancia: 0.02
          formato: un ancho, con su unidad
        distractores:
          - valor: '0.933 m'
            mensaje: |
              Ese es el **calado**. En el rectángulo óptimo el ancho es el
              doble del calado.
          - valor: '3.73 m'
            mensaje: |
              Has duplicado dos veces. El calado sale $0{,}933$ m y el ancho
              es su doble, $1{,}866$.
        pista: |
          $b = 2y$, $A = 2y^{2}$, $R_h = y/2$, con $n = 0{,}020$ y
          $J = 0{,}005$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}020}\,2y^{2}\Bigl(\frac{y}{2}\Bigr)^{2/3}
          \sqrt{0{,}005} = 4{,}454\,y^{8/3} = 3{,}7
          $$
          $$
          y = 0{,}933\ \text{m}
          \qquad
          b = 1{,}866\ \text{m}
          $$

      - tipo: dibujar
        consigna: |
          La segunda parte del apartado b): la sección del canal rectangular
          óptimo, a escala, con sus dimensiones acotadas.
        comprueba:
          - punto: >-
              Un rectángulo abierto por arriba, con el fondo de 1,866 m y el
              agua hasta 0,933 m: el ancho, el doble del calado.
            porque: >-
              Es la sección hidráulicamente óptima de un rectángulo, $b = 2y$,
              la de menor perímetro mojado para esa área. Dibujado a escala se
              ve la proporción, y un rectángulo más alto que ancho es la señal
              de que se ha tomado el calado por el ancho.
          - punto: >-
              Las cotas de $b$ y de $y$, con la $y$ medida desde el fondo hasta
              la lámina libre.
            porque: >-
              Es lo que pide el enunciado, «indicando sus dimensiones». El
              calado es la altura del agua, no la del cajero: por encima de la
              lámina, el borde libre del canal no es dato.
          - punto: >-
              El perímetro mojado, los tres lados en contacto con el agua:
              $0{,}933 + 1{,}866 + 0{,}933 = 3{,}73$ m, y el área de 1,74 m².
            porque: >-
              La lámina libre no moja, y por eso no entra en el perímetro. Con
              ellos, $R_h = A/P = y/2 = 0{,}466$ m, que es el radio hidráulico
              de la cuenta de Manning.
