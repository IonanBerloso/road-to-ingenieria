        <text x="66" y="44" font-size="10" fill="var(--faint)">gas</text>
        <text x="66" y="72" font-size="11" fill="var(--alt)">s₂ = 0,79</text>
        <text x="66" y="200" font-size="11" fill="var(--live)">s₁ = 1,01</text>

        <rect x="140" y="106" width="120" height="45" fill="var(--panel)"
              stroke="var(--ink)" stroke-width="2"/>
