        <desc id="fw3d">Un depósito cilíndrico cerrado de diez metros de
        diámetro, dibujado más estrecho, contiene dos líquidos que no se
        mezclan: abajo el de densidad relativa uno con cero uno y encima el de
        cero con setenta y nueve, con veinte centímetros de gas por encima y un
        manómetro en la tapa. En el centro flota un cuerpo formado por un
        bloque cilíndrico de un metro de radio y setenta y cinco centímetros de
        altura, con un cono de un metro treinta colgando por debajo, con el
        vértice hacia abajo. La tapa del cilindro está un metro por debajo de
        la superficie del líquido de arriba, y la interfaz entre los dos
        líquidos corta al cilindro una altura h por debajo de su tapa. Las
        alturas y el cuerpo están a escala; el ancho del depósito, no.</desc>

        <rect x="46" y="46" width="308" height="87.4" fill="var(--alt)" fill-opacity=".16"/>
        <rect x="46" y="133.4" width="308" height="110.6" fill="var(--live)" fill-opacity=".16"/>
        <rect x="46" y="34" width="308" height="12" fill="var(--faint)" fill-opacity=".14"/>
