        <line x1="128" y1="80" x2="150" y2="80" stroke="var(--alt)" stroke-width="1"/>
        <line x1="128" y1="112" x2="150" y2="112" stroke="var(--alt)" stroke-width="1"/>
        <text x="124" y="100" text-anchor="end" font-size="11" fill="var(--alt)">h</text>

        <line x1="376" y1="34" x2="376" y2="52" stroke="var(--faint)" stroke-width="1"/>
        <line x1="370" y1="34" x2="382" y2="34" stroke="var(--faint)" stroke-width="1"/>
        <line x1="370" y1="52" x2="382" y2="52" stroke="var(--faint)" stroke-width="1"/>
