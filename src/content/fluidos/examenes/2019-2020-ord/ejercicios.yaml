      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $y/D = 0{,}7$ el arco mojado pasa de 180º y el área es de
              1,503 m², lo que da 2,46 m/s.
          - texto: >-
              Con $n = 0{,}020$ y ese radio hidráulico, la pendiente del canal
              circular es de 6,561 milésimas.
          - texto: >-
              El rectángulo óptimo, con menos pendiente —5 milésimas— y el
              mismo caudal, necesita 0,933 m de calado y 1,866 de ancho.
          - texto: >-
              Como el rectángulo óptimo tiene menos área que el circular,
              lleva el agua más deprisa y erosionará más la arena.
            trampa: true
            mensaje: |
              El rectángulo óptimo tiene $2y^{2} = 1{,}74\ \text{m}^{2}$
              frente a los $1{,}50$ del circular: **más** área, no menos, y
              por tanto menos velocidad —2,13 frente a 2,46 m/s—. Lo que pasa
              es que trabaja con menos pendiente, y por eso necesita una
              sección mayor para el mismo caudal.
    resolucion: |
      **a) El canal circular.** Con $R = 0{,}8$ m y $y = 1{,}12$ m, el agua
      pasa del centro: el arco mojado abarca

      $$
      \cos\frac{\theta}{2} = 1-\frac{y}{R} = -0{,}4
      \qquad
      \theta = 3{,}965\ \text{rad} = 227^{\circ}
      $$
      $$
      A = \frac{R^{2}(\theta-\sin\theta)}{2} = 1{,}503\ \text{m}^{2}
      \qquad
      P = R\theta = 3{,}172\ \text{m}
      \qquad
      R_h = 0{,}474\ \text{m}
      $$

      La velocidad sale sola, de la continuidad:

      $$
      v = \frac{3{,}7}{1{,}503} = 2{,}46\ \text{m/s}
      $$

      Y la pendiente, de Manning con el $n = 0{,}020$ que da el cuadro n.º 26
      para la arena:

      $$
      J = 6{,}561\ \text{milésimas}
      $$

      **b) El rectángulo óptimo.** Mismo material y mismo caudal, pero con la
      pendiente rebajada a 5 milésimas:

      $$
      4{,}454\,y^{8/3} = 3{,}7
      \qquad
      y = 0{,}933\ \text{m}
      \qquad
      b = 1{,}866\ \text{m}
      $$

      La sección, dibujada, es un rectángulo el doble de ancho que de hondo:
      1,866 m de fondo y 0,933 m de agua, con 1,74 m² de área y 3,73 m de
      perímetro mojado.

      **La comparación.** El rectángulo óptimo tiene 1,74 m² de sección frente
      a los 1,50 del circular. No es por la forma: lo que se ha rebajado es la
      **pendiente**, de 6,56 a 5 milésimas, y con menos energía disponible
      hace falta más sección. Y a igual pendiente tampoco ganaría: con 6,56
      milésimas, el rectángulo óptimo necesitaría 1,57 m² y 3,55 m de
      perímetro mojado, frente a los 1,50 y 3,17 del circular. «Óptimo» es el
      mejor de los rectángulos; la mejor sección de todas es la semicircular,
      y este círculo lleno al 70 % lleva el mismo caudal con menos sección que
      el mejor rectángulo.
