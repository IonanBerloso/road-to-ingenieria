      - tipo: calcular
        titulo: La fuerza vertical del fluido superior
        pregunta: |
          ¿Qué fuerza vertical hace el fluido superior sobre el cuerpo, en kN?
        respuesta:
          tipo: magnitud
          valor: '2212.49 kN'
          tolerancia: 0.003
          formato: una fuerza, con su unidad
        distractores:
          - valor: '24.32 kN'
            mensaje: |
              Te has dejado el gas. Encima del fluido superior hay 696,5 kPa
              de gas, y esa presión llega entera a la tapa: es casi toda la
              fuerza.
        pista: |
          El fluido de arriba solo toca en horizontal la tapa del cilindro.
          En ella hay la presión del gas más la de 1 m de fluido superior.
        desarrollo: |
          $$
          p_{tapa} = 696\,516 + 0{,}79\cdot 9800\cdot 1 = 704\,258\ \text{Pa}
          $$
          $$
          F_{v2} = p_{tapa}\,\pi R^{2} = 704\,258\cdot\pi = 2212{,}49\ \text{kN}\ (\downarrow)
          $$

          La cara lateral no da vertical: sus presiones son horizontales.

      - tipo: calcular
        titulo: La fuerza vertical del fluido inferior
        pregunta: |
          ¿Y la del fluido inferior, en kN?
        respuesta:
          tipo: magnitud
          valor: '2246.19 kN'
          tolerancia: 0.003
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58.02 kN'
            mensaje: |
              Te has dejado el gas: su presión llega al fluido inferior a
              través del superior, y empuja el cono desde abajo con los mismos
              696,5 kPa que la tapa desde arriba.
        pista: |
          En vertical, el fluido inferior solo empuja el cono. Su fuerza es la
          presión en el plano de la base del cilindro por el disco, más el
          peso del fluido inferior que cabría en el cono.
        desarrollo: |
          $$
          p_{base} = 704\,258 + 7742\cdot 0{,}457 + 9898\cdot 0{,}293
          = 710\,696\ \text{Pa}
          $$
          $$
          F_{v1} = p_{base}\,\pi R^{2} + \gamma_1\,V_{cono}
          = 2232{,}72 + 13{,}47 = 2246{,}19\ \text{kN}\ (\uparrow)
          $$

      - tipo: calcular
        titulo: La diferencia entre las dos fuerzas verticales
        pregunta: |
          ¿Cuánto vale la diferencia entre la fuerza vertical del fluido
          inferior y la del superior, en kN?
        respuesta:
          tipo: magnitud
          valor: '33.7 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2246 kN'
            mensaje: |
              Esa es la fuerza del fluido inferior **entera**. La pregunta es
              su diferencia con la del superior, y las dos son enormes
              precisamente porque el gas las infla por igual.
          - valor: '0 kN'
            mensaje: |
              Serían iguales si el cuerpo no pesara. El cuerpo flota, así que
              la resultante de las dos fuerzas verticales sostiene
              exactamente su peso.
        pista: |
          El cuerpo está en equilibrio, y la única fuerza que no es
          hidrostática es su peso.
        desarrollo: |
          $$
          F_{v1}-F_{v2} = W = 925\cdot 9{,}8\cdot 3{,}718 = 33{,}70\ \text{kN}
          $$

          Y las dos por separado valen $2246{,}19$ kN hacia arriba y
          $2212{,}49$ kN hacia abajo: **más de dos meganewton cada una**,
          porque el gas a siete bares se transmite a todo el líquido.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión del gas se transmite por igual a todo el líquido, así
              que no cambia el equilibrio de flotación: $h$ sale sin conocerla.
          - texto: >-
              Con el gas ideal y los 20,6 kg introducidos, la cámara está a
              797,8 kPa absolutos, es decir 5.226 mm de mercurio relativos.
          - texto: >-
              Las componentes horizontales se anulan por simetría de
              revolución, y las verticales valen más de dos meganewton cada
              una.
          - texto: >-
              Como las dos fuerzas verticales son enormes, el cuerpo está
              sometido a un esfuerzo estructural de dos meganewton.
            trampa: true
            mensaje: |
              Lo está a **compresión uniforme**, que es otra cosa. Un cuerpo
              sumergido en un fluido a presión no soporta la resultante de las
              dos caras: soporta la presión, igual por todas partes, como un
              submarinista a diez metros. Lo que puede romperlo es que sea
              hueco, no que la integral de presiones sea grande.
    resolucion: |
      **a) Cuánto se hunde.** Aquí lo primero es darse cuenta de que el gas
      **no interviene**: una presión uniforme sobre la superficie libre se
      transmite a todo el líquido y se cancela en el balance vertical del
      cuerpo. Así que el apartado a) se resuelve antes que el b).

      $$
      V = \pi R^{2}L+\tfrac13\pi R^{2}H = 3{,}718\ \text{m}^{3}
      \qquad
      W = 33{,}70\ \text{kN}
      $$

      Con la interfaz cortando al cilindro, el empuje tiene dos trozos:

      $$
      \gamma_2\,\pi R^{2}h + \gamma_1\bigl[\pi R^{2}(0{,}75-h)+1{,}361\bigr]
      = W
      \;\Longrightarrow\;
      h = 0{,}457\ \text{m}
      $$

      **b) El manómetro.** Con 20,6 kg de gas en 15,7 m³ a 293 K —y
      $R = 2077$, que es el del helio—:

      $$
      p_{abs} = 797{,}8\ \text{kPa}
      \qquad
      p_{man} = 696{,}5\ \text{kPa} = 5225{,}96\ \text{mm de Hg}
      $$

      **c) Los prismas.** La tapa del cilindro está 1 m por debajo de la
      lámina del fluido superior —es lo que acota la figura, de la lámina a
      la tapa— y la interfaz, $h$ más abajo. Lo que pone cada fluido, $\gamma
      h$: 7,74 kPa en la tapa, 11,28 en la interfaz, 14,18 en la base del
      cilindro y 27,05 en el vértice del cono. En la tapa, un rectángulo hacia
      abajo; en la cara lateral, dos trapecios con un quiebro en la interfaz;
      en el cono, un prisma perpendicular a la generatriz. Y encima de todo,
      uniforme, los 696,52 kPa del gas.

      **d) Las fuerzas.** Las horizontales son cero: el cuerpo es de
      revolución y los prismas de la cara lateral se cierran sobre sí mismos.
      Las verticales, con presiones manométricas:

      | | presión | fuerza |
      |---|---|---|
      | fluido superior, sobre la tapa | 704,26 kPa | $2212{,}49$ kN $\downarrow$ |
      | fluido inferior, sobre el cono | 710,70 kPa en la base, más el cono | $2246{,}19$ kN $\uparrow$ |
      | **diferencia** | | $33{,}70$ kN $\uparrow$ |

      La de abajo es la presión en el plano de la base del cilindro por el
      disco, más el peso del fluido inferior que cabría en el cono,
      $\gamma_1 V_{cono} = 13{,}47$ kN. Las dos salen a la centésima de las
      impresas.

      **Y ahí está lo que enseña.** Dos fuerzas de más de dos meganewton cuya
      diferencia son 33,7 kN: el peso del cuerpo. El gas pone el 98,9 % de la
      de arriba y el 97,4 % de la de abajo, y se cancela; lo que decide si el
      cuerpo flota es un 1,5 %. Calcular las dos por separado y restarlas es
      numéricamente pésimo —un error del 1 % en cualquiera de ellas son 22
      kN, dos tercios del resultado— y por eso conviene hacer el balance con
      el empuje, que ya trae la resta hecha.

      Y un aviso sobre la figura: si el metro que acota se lee como el
      espesor de la capa de arriba, con la tapa a $1-h$ de la lámina, las dos
      fuerzas salen un 0,5 % más bajas que las impresas, 2201,4 y 2235,1 kN.
      La diferencia sale igual, porque es el peso.

  # ── 4 (14 %) · El limpiacristales y su cono. La velocidad de salida y el
  #    ángulo del asiento cónico.
  - id: exflu1920-ord-4-el-limpiacristales-y-su-cono
    titulo: El limpiacristales, y el ángulo del cono que abre el chorro
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para la limpieza de grandes superficies acristaladas verticales, se
      emplea una tubería cilíndrica horizontal ($D = 54$ cm), habiéndose
      medido en el manómetro una presión de $1{,}4\ \text{kg/cm}^{2}$. Esta
      conducción lanza un chorro uniforme de agua des-ionizada a través de
      una tobera ($d = 25$ cm) con un factor de paso de $k = 0{,}04$ a la
      salida. Se pide:

      **a)** Determinar la velocidad de salida del chorro por la tobera
      considerando un $C_d = 0{,}7$.

      Para poder abarcar una mayor área de limpieza, se acopla a la tobera
      una válvula de asiento cónico regulado mediante un dispositivo de
      pequeño diámetro (tornillo) que permite el avance-retroceso del cono y
      es accionado por un pequeño motor eléctrico, tal y como se muestra en la
      figura. Suponiendo que inicialmente el cono permanece fijo en la
      posición mostrada, se pide:

      **b)** Diseñar el asiento cónico para que la fuerza que tiene que
      soportar el tornillo no supere los 2/3 de la carga de rotura por
      compresión de 205 N.

      Mediante la acción del motor eléctrico se desplaza el cono diseñado en
      el apartado anterior hacia la izquierda con una velocidad $u$
      constante. Se pide:

      **c)** Valor límite que podría alcanzar la mencionada velocidad para no
      romper el tornillo.

      **Notas nuestras.** La figura, redibujada abajo, dice esto: la tubería
      horizontal con el manómetro encima, que se estrecha en la tobera; de la
      tobera sale el chorro hacia la derecha y, enfrente, el cono, con el
      vértice apuntando a la tobera y $\alpha$ marcado entre su generatriz y
      el eje; del cono sale hacia la derecha el tornillo, hasta el motor. «La
      izquierda» del apartado c) es, por tanto, contra el chorro.

      <figure class="figura-examen">
      <svg viewBox="24 20 452 182" role="img" width="440" height="177"
           aria-labelledby="fw4t fw4d">
