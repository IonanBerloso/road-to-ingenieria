ejercicios:
  # ── 3 (14 %) · Un cuerpo flotando entre dos líquidos bajo un gas a siete
  #    bares. Dos meganewton a cada lado y 33 kN de diferencia.
  - id: exflu1920-ord-3-el-cuerpo-que-flota-entre-dos-liquidos
    titulo: El cuerpo que flota entre dos líquidos, con siete bares encima
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 29 de junio de 2020 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En un depósito cilíndrico de diámetro 10 m se encuentran almacenados dos
      fluidos inmiscibles de densidades relativas $s_1 = 1{,}01$ y
      $s_2 = 0{,}79$. En el centro se encuentra un cuerpo formado por un
      bloque cilíndrico de radio $R = 1$ m y altura $L = 75$ cm, y un cono de
      altura $H = 130$ cm, que flota entre ambos fluidos. Sabiendo que el gas
      que se encuentra en la zona superior de la cámara ha sido introducido a
      razón de 66 g por segundo y esta operación ha necesitado 5,2 minutos,
      calcular:

      **a)** Altura $h$ que está sumergido el cuerpo de la figura en el fluido
      superior.

      **b)** Lectura del manómetro superior (mmcHg).

      **c)** Dibujar los prismas de presiones acotados de las fuerzas
      hidrostáticas realizadas por ambos fluidos sobre el cuerpo.

      **d)** Calcular las componentes horizontales y verticales de las fuerzas
      hidrostáticas ejercidas por cada fluido sobre el cuerpo.

      Datos: $\rho_{material} = 925\ \text{kg/m}^{3}$;
      $R_{gas} = 2077{,}16\ \text{J/(kg}\cdot\text{K)}$; $T = 20$ ºC;
      $V_{cono} = \tfrac13\pi R^{2}H$; $p_{atm} = 1$ atm.

      <figure class="figura-examen">
      <svg viewBox="20 6 400 252" role="img" width="420" height="265"
           aria-labelledby="fw3t fw3d">
        <title id="fw3t">El cuerpo de cilindro y cono flotando entre los dos líquidos</title>
        <desc id="fw3d">Un depósito cilíndrico cerrado de diez metros de
        diámetro contiene dos líquidos que no se mezclan: abajo el de densidad
        relativa uno con cero uno, y encima una capa de un metro del de cero
        con setenta y nueve. Sobre esa capa quedan veinte centímetros de gas, y
        en la tapa hay un manómetro. En el centro flota un cuerpo formado por
        un bloque cilíndrico de un metro de radio y setenta y cinco centímetros
        de altura, con un cono de un metro treinta colgando por debajo, con el
        vértice hacia abajo. La interfaz entre los dos líquidos corta al
        cilindro, y la altura h es la parte de cilindro que queda sumergida en
        el líquido de arriba.</desc>

        <rect x="46" y="52" width="308" height="60" fill="var(--alt)" fill-opacity=".16"/>
        <rect x="46" y="112" width="308" height="128" fill="var(--live)" fill-opacity=".16"/>
        <rect x="46" y="34" width="308" height="18" fill="var(--faint)" fill-opacity=".14"/>
        <path d="M46 34 L354 34 L354 240 L46 240 Z" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="46" y1="52" x2="354" y2="52" stroke="var(--alt)" stroke-width="1.4"/>
        <line x1="46" y1="112" x2="354" y2="112" stroke="var(--live)" stroke-width="1.4"/>
        <text x="66" y="48" font-size="10" fill="var(--faint)">gas</text>
        <text x="66" y="86" font-size="11" fill="var(--alt)">s₂ = 0,79</text>
        <text x="66" y="190" font-size="11" fill="var(--live)">s₁ = 1,01</text>

        <rect x="150" y="80" width="100" height="45" fill="var(--panel)"
              stroke="var(--ink)" stroke-width="2"/>
        <path d="M150 125 L250 125 L200 203 Z" fill="var(--panel)"
              stroke="var(--ink)" stroke-width="2"/>

        <line x1="150" y1="70" x2="250" y2="70" stroke="var(--faint)" stroke-width="1"/>
        <line x1="150" y1="64" x2="150" y2="76" stroke="var(--faint)" stroke-width="1"/>
        <line x1="250" y1="64" x2="250" y2="76" stroke="var(--faint)" stroke-width="1"/>
        <text x="200" y="64" text-anchor="middle" font-size="10" fill="var(--faint)">2R = 2 m</text>

        <line x1="266" y1="80" x2="266" y2="125" stroke="var(--faint)" stroke-width="1"/>
        <line x1="260" y1="80" x2="272" y2="80" stroke="var(--faint)" stroke-width="1"/>
        <line x1="260" y1="125" x2="272" y2="125" stroke="var(--faint)" stroke-width="1"/>
