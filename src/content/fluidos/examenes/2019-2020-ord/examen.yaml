asignatura: fluidos
curso: '2019-2020'
convocatoria: ordinaria
fecha: 29 de junio de 2020
# **Están los ocho.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 9 a 13 (15 a 19 del PDF), y la convocatoria más
# antigua que recoge.
#
# Como el resto del cuadernillo, publica el resultado de cada apartado y
# nada más (`pdfEs: enunciado-con-resultados`), y no imprime reparto por
# competencia sino el porcentaje de cada ejercicio junto a su número: 12 /
# 20 / 14 / 14 / 12 / 12 / 15 / 8. **Suman 107**, comprobado en la página
# (págs. 15 a 19 del PDF), y se publican como vienen: la página avisa de
# que no suman 100. Por eso los ejercicios van sin `puntos`.
#
# **El 1 y el 2 estuvieron en `fuera` hasta el 30 de septiembre de 2026,**
# y el c) del 4, sin declarar, solo en la resolución.
#
# - El **1** decía que la tabla de aceites no estaba. Está, como imagen en
#   la figura (pág. 15 del PDF), y se lee entera: va en las «Notas
#   nuestras». Con los cinco discos de la figura 2, diez películas de
#   aceite, salen los 48 cSt, el VG68 y el +40,3 % impresos.
# - El **2** decía que la figura no acota las columnas. Las acotan los
#   datos, $y$ y $z$, y lo que decide el ejercicio es contra qué mide cada
#   manómetro: con el 4 contra el aire de C salen los seis resultados.
# - El **4 c)** decía salir 3,96 frente a 3,74. Con el cono avanzando
#   contra el chorro la fuerza va con $(v+u)^{2}$, y sale 3,74.
#
# Las entradas llevan `n` aunque ya no quede nada en `fuera`: no cambia nada
# en la página y deja los puntos atados a su número del cuadernillo.
#
# Lo que este examen aporta al corpus:
#
# - **Un embrague de discos en aceite** (ej. 1): la viscosidad como lo que
#   se diseña, con diez películas y la velocidad relativa de los dos ejes.
# - **Seis manómetros que miden contra cosas distintas** (ej. 2), uno de
#   ellos manométrico y encerrado en la cámara.
# - **Un cuerpo flotando entre dos líquidos** (ej. 3) bajo un gas a siete
#   bares: las dos fuerzas verticales valen más de dos meganewton y su
#   diferencia es el peso del cuerpo, 33,7 kN.
# - **Semejanza de dos turbobombas** (ej. 5), que es el análisis
#   dimensional aplicado a máquinas y no a flujos, por el «método rápido».
# - **Una turbina entre dos tuberías** (ej. 6), con el diámetro deducido de
#   la potencia perdida y una tubería lisa y otra rugosa.
# - **Una red ramificada de cuatro barrios** (ej. 7), con la presión de un
#   nudo, el diámetro comercial de la última rama y la línea piezométrica.
# - **Un canal circular de arena** (ej. 8), con el $n = 0{,}020$ del cuadro
#   n.º 26, y el rectángulo óptimo que lo sustituye.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (12%)». Suman 107, como vienen impresos'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 12 }
    - { n: 2, puntos: 20 }
    - { n: 3, puntos: 14 }
    - { n: 4, puntos: 14 }
    - { n: 5, puntos: 12 }
    - { n: 6, puntos: 12 }
    - { n: 7, puntos: 15 }
    - { n: 8, puntos: 8 }

