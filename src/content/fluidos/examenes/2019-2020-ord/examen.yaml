# **Seis de los ocho.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, y la convocatoria más antigua que recoge.
#
# Porcentajes impresos: 12 / 20 / 14 / 14 / 12 / 12 / 15 / 8, sin reparto
# por competencia, así que van sin `puntos`.
#
# **Faltan dos, y queda dicho por qué.**
#
# - El **1** es un embrague hidráulico multidisco cuya figura trae la tabla
#   de aceites de la que hay que elegir; sin ella no se puede resolver el
#   apartado b) ni, por tanto, el c). §13 caso 2.
# - El **2** son dos depósitos dentro de un tercero, con cinco manómetros
#   —dos absolutos y dos relativos—, un barómetro y dos tubos en U. La
#   figura no acota dónde empieza y acaba cada columna, y los 286,1 mm y
#   1,178 m publicados no se reconstruyen sin esas cotas.
#
# Y dentro del **4** se publican los apartados a) y b). El c) —la velocidad
# límite del cono— sale 3,96 m/s frente a los 3,74 publicados, un 5,7 %:
# el desajuste viene de que el examen usa un coeficiente de descarga
# efectivo de 0,715 en vez del 0,7 del enunciado. Queda dicho en la
# resolución.
#
# Lo que este examen aporta al corpus:
#
# - **Un cuerpo flotando entre dos líquidos** (ej. 3) bajo un gas a siete
#   bares: las dos fuerzas verticales valen más de dos meganewton y su
#   diferencia es el peso del cuerpo, 33,7 kN.
# - **Semejanza de dos turbobombas** (ej. 5), que es el análisis
#   dimensional aplicado a máquinas y no a flujos.
# - **Una turbina entre dos tuberías** (ej. 6), con el diámetro deducido de
#   la potencia perdida.
# - **Una red ramificada de cuatro barrios** (ej. 7), con la presión de un
#   nudo y el diámetro comercial de la última rama.
# - **Un canal circular de arena** (ej. 8), del que sale un dato que no
#   teníamos: la arena tiene n = 0,020.
