        <path d="M160 166 L160 10 A 156 156 0 0 1 314 140 L160 179 Z"
              fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <g stroke="var(--faint)" stroke-width="1" opacity=".55">
          <path d="M176 44 L206 44 M172 74 L238 74 M170 104 L272 104 M164 134 L300 134"/>
        </g>

        <line x1="314" y1="140" x2="438" y2="140" stroke="var(--ink)" stroke-width="2"/>
