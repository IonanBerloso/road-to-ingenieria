      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: la expresión de la presión de vacío en
          función de la lectura $R$, deducida desde el equilibrio del esquema
          del a), con la hipótesis de los depósitos grandes dicha y usada. El
          enunciado lo pide con «deducir», y de esa expresión cuelgan los
          apartados c), d), f) y g).
        rubrica:
          - punto: |
              **El equilibrio de partida**, con los dos depósitos abiertos:
              igualando presiones a la altura de la interfaz,
              $\gamma_1 h_1 = \gamma_2 h_2$, con $h_1$ y $h_2$ medidas desde
              ella hasta cada superficie libre y $\gamma_2$ el más denso.
            porque: |
              Es la ecuación fundamental de la hidrostática, $P + \gamma z$
              constante dentro de cada líquido (diapositiva 3 del tema 4),
              aplicada al esquema del a). Es la ecuación que se resta al
              final: sin ella, $h_1$ y $h_2$, que el enunciado no da, no se
              van de la cuenta.
            minimo: true
          - punto: |
              **Qué pasa al hacer el vacío**, dicho con el dibujo: la presión
              baja en un depósito, la interfaz se desplaza $R$ por su tubo
              hacia ese lado, y en una altura $R$ una columna de un líquido
              pasa a ser del otro.
            porque: |
              Es la idea del aparato, y sin ella el álgebra no se sabe de
              dónde sale. Con la interfaz en la rama del ligero, el vacío
              sobre el depósito del ligero la hace subir por esa rama, y el
              vacío sobre el del pesado, bajar por la misma. Las dos valen,
              porque el enunciado dice «en uno de los depósitos», y dan la
              misma expresión.
            minimo: true
          - punto: |
              **La hidrostática después, restando la de antes**: con el vacío
              $P_v$ sobre el depósito del ligero y a la altura de la interfaz
              nueva, $-P_v + \gamma_1 (h_1 - R) = \gamma_2 (h_2 - R)$; con
              $\gamma_1 h_1 = \gamma_2 h_2$ queda
              $P_{\text{vacío}} = R\,(\gamma_2 - \gamma_1)$.
            porque: |
              Es la expresión impresa en el resultado del ejercicio,
              «Pvacío=R·(γ2-γ1)», y la que la práctica 6 del guion pide deducir
              (pág. 19). El aparato es un manómetro diferencial,
              $P_1 - P_2 = g\,h\,(\rho_m - \rho)$ en la diapositiva 18 del
              tema 4, con las dos densidades muy parecidas.
            minimo: true
          - punto: |
              **Por qué valen los depósitos grandes**: sus niveles apenas se
              mueven y todo el desplazamiento ocurre en el tubo. Si no, cada
              superficie libre se mueve $R\,a/A$ y la expresión lleva un
              término más, $(\gamma_1 + \gamma_2)\,R\,a/A$.
            porque: |
              Es la hipótesis que el enunciado impone, «las dimensiones de los
              depósitos son muy grandes respecto del diámetro del tubo
              manométrico», y hay que usarla diciéndolo. La ecuación de lectura
              con las áreas está en el tema 4; con agua y aceite, que se
              parecen, el término de las áreas pesa mucho aunque $a/A$ sea
              pequeño.
            minimo: true
          - punto: |
              **Lo que dice la expresión**: para un mismo vacío, $R$ crece
              cuanto más parecidas son las densidades, y la mínima presión que
              se lee con un milímetro es $0{,}001\,(\gamma_2 - \gamma_1)$.
            porque: |
              Es la respuesta razonada del c) y la cuenta del f). El guion lo
              dice al describir el aparato: «requiere dos líquidos de color
              diferente con densidad lo más próxima posible» (pág. 9), y la
              práctica 6 pide la mínima presión medible «suponiendo que la
              mínima medida de longitud fiable es de 1 mm» (pág. 19).
        veredicto: |
          Si tu folio tiene los cuatro mínimos, la expresión vale para los
          apartados c), d), f) y g), y es la del tema 4 con $a/A \to 0$. Si te
          falta el primero, revisa la cuenta: sin el equilibrio de partida
          arrastras $h_1$ y $h_2$, que el enunciado no da, y no hay forma de
          quitártelos de encima.

      - tipo: calcular
        titulo: La lectura del micromanómetro
        pregunta: |
          Con la pareja elegida y un vacío de 42 mmcagua, ¿cuánto vale la
          lectura $R$, en metros?
        respuesta:
          tipo: numero
          valor: '0.28'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '0.042'
            mensaje: |
              Esa es la presión de vacío expresada en metros de columna de
              agua, no la lectura del aparato. El micromanómetro **amplifica**
              por $1/(s_2-s_1)$, aquí casi siete veces.
          - valor: '0.081'
            mensaje: |
              Has usado la pareja agua-tetracloruro, cuya diferencia es 0,52.
              La buena es aceite-agua, con 0,15: amplifica tres veces y media
              más.
        pista: |
          $\Delta p = R\,(\gamma_2-\gamma_1)$, y los 42 mmcagua son
          $0{,}042\cdot 9800$ Pa.
        desarrollo: |
          $$
          R = \frac{0{,}042\cdot 9800}{(1-0{,}85)\cdot 9800}
          = \frac{0{,}042}{0{,}15} = 0{,}28\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión absoluta del depósito
        pregunta: |
          Con el barómetro en 755 mmcHg, ¿cuál es la presión absoluta del
          depósito, en bar?
        respuesta:
          tipo: numero
          valor: '1.002'
          tolerancia: 0.002
          formato: un número en bar
        distractores:
          - valor: '0.9503'
            mensaje: |
              Has restado 42 mm de **mercurio**: $0{,}042\cdot 13{,}6\cdot 9800
              = 5598$ Pa. El vacío es de 42 mm de columna de **agua**, 412 Pa,
              trece veces y media menos: el barómetro está en mmcHg, pero el
              vacío no.
          - valor: '0.0041'
            mensaje: |
              Esos son los 42 mmcagua pasados a bar, es decir la presión de
              vacío. La absoluta es la atmosférica menos eso.
        pista: |
          755 mmcHg son $0{,}755\cdot 13{,}6\cdot 9800$ Pa, y de ahí se resta
          el vacío.
        desarrollo: |
          $$
          p_{at} = 0{,}755\cdot 13{,}6\cdot 9800 = 100{,}63\ \text{kPa}
          $$
          $$
          p_{abs} = 100{,}63-0{,}41 = 100{,}21\ \text{kPa} = 1{,}002\ \text{bar}
          $$

      - tipo: calcular
        titulo: La presión de vacío mínima que se puede medir
        pregunta: |
          Si la mínima lectura fiable es de un milímetro, ¿cuál es la presión
          de vacío mínima que mide el aparato, en Pa?
        respuesta:
          tipo: magnitud
          valor: '1.47 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '9.8 Pa'
            mensaje: |
              Ese es un milímetro de columna de agua, lo que mediría un tubo
              en U de agua. El micromanómetro no lee la columna de un líquido
              sino la **diferencia** entre los dos: un milímetro de
              desplazamiento vale $0{,}001\,(\gamma_2-\gamma_1)$.
          - valor: '5.1 Pa'
            mensaje: |
              Has usado la pareja agua-tetracloruro, con una diferencia de
              0,52. La pareja elegida, aceite y agua, se lleva 0,15, y por
              eso aprecia presiones tres veces y media más pequeñas.
          - valor: '-1.47 Pa'
            mensaje: |
              Es el número del cuadernillo, $P = -1{,}47$ Pa: la presión
              **relativa** del depósito, negativa porque es un vacío. La
              pregunta pide la presión de vacío, que se da en positivo —lo que
              la presión queda por debajo de la atmosférica—: 1,47 Pa.
        pista: |
          Es la expresión del b) con $R = 1$ mm. El guion lo llama grado de
          sensibilidad.
        desarrollo: |
          $$
          \Delta p_{min} = 0{,}001\cdot(1-0{,}85)\cdot 9800 = 1{,}47\ \text{Pa}
          $$

          El cuadernillo lo da con signo, $P = -1{,}47$ Pa: es un vacío, una
          presión relativa negativa.

      - tipo: calcular
        titulo: El ángulo del tubo inclinado equivalente
        pregunta: |
          ¿Qué ángulo debería tener un tubo inclinado de alcohol para igualar
          esta sensibilidad, en grados?
        respuesta:
          tipo: numero
          valor: '10.8'
          tolerancia: 0.1
          formato: un número en grados
        distractores:
          - valor: '8.63'
            mensaje: |
              Has usado agua en el tubo inclinado. El enunciado dice alcohol,
              $s = 0{,}8$: al ser más ligero necesita un ángulo algo mayor
              para dar la misma sensibilidad.
          - valor: '79.2'
            mensaje: |
              Has usado el coseno: $\cos\alpha = 0{,}1875$ da el ángulo del
              tubo con la **vertical**. El menisco avanza $l$ a lo largo del
              tubo y sube $l\sin\alpha$, con $\alpha$ medido desde la
              horizontal: casi tumbado, que es lo que hace sensible a un tubo
              inclinado.
        pista: |
          Un milímetro de tubo inclinado vale
          $\gamma_{alc}\sin\alpha$; un milímetro de menisco,
          $\gamma_{ag}(s_2-s_1)$.
        desarrollo: |
          $$
          0{,}8\,\sin\alpha = 0{,}15
          \;\Longrightarrow\;
          \sin\alpha = 0{,}1875
          \;\Longrightarrow\;
          \alpha = 10{,}8^{\circ}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión medida es $R(\gamma_2-\gamma_1)$, así que interesa la
              pareja de densidades más parecidas: **aceite y agua**.
          - texto: >-
              Con esa pareja, 42 mm.c.agua de vacío mueven el menisco 28 cm, y
              cada milímetro de lectura vale 1,47 Pa.
          - texto: >-
              Un tubo inclinado de alcohol tendría que ponerse a 10,8º para
              medir con la misma finura.
          - texto: >-
              La sensibilidad no depende de la sección de los depósitos porque
              el enunciado dice que son grandes, así que el aparato serviría
              igual con depósitos pequeños.
            trampa: true
            mensaje: |
              La hipótesis de depósitos grandes es la que **permite** suponer
              que sus niveles no se mueven. Con depósitos estrechos, parte del
              desplazamiento se lo comerían las superficies libres y el
              menisco se movería menos: el aparato sería menos sensible y,
              peor aún, su calibración dependería de la relación de secciones.
    resolucion: |
      **a) El esquema.** Dos depósitos anchos, abiertos, unidos por un tubo
      estrecho en U. El agua, que es la más densa de la pareja, llena su
      depósito y el fondo de la U; el aceite llena el suyo y baja por su rama
      hasta la única interfaz. Con los dos abiertos, las columnas se
      equilibran medidas desde la interfaz, $\gamma_{ag}\,h_{ag} =
      \gamma_{ac}\,h_{ac}$, así que la de aceite es más alta. Es el aparato del
      tema 4,
      [El micromanómetro de líquidos inmiscibles, y su sensibilidad](/road-to-ingenieria/fluidos/t04-hidrostatica/#el-micromanómetro-de-líquidos-inmiscibles-y-su-sensibilidad).

      **b) La expresión.** Con el vacío $p_v$ sobre el depósito del ligero,
      la interfaz sube $R$ por su tubo. Con los dos depósitos anchos, sus
      niveles no se mueven y todo el desplazamiento ocurre en el tubo: en una
      altura $R$, una columna de líquido pesado sustituye a una de ligero.
      Igualando presiones a la altura de la interfaz nueva,

      $$
      -p_v + \gamma_1\,(h_1 - R) = \gamma_2\,(h_2 - R)
      $$

      y restando el equilibrio de partida, $\gamma_1 h_1 = \gamma_2 h_2$:

      $$
      p_{\text{vacío}} = R\,(\gamma_2-\gamma_1)
      $$

      Sin la hipótesis de los depósitos grandes, cada superficie libre se
      movería $R\,a/A$ y la expresión llevaría el término
      $(\gamma_1+\gamma_2)\,R\,a/A$ que el tema 4 escribe entero.

      **c) La pareja.** Cuanto más pequeña sea $\gamma_2-\gamma_1$, más larga
      es la lectura para la misma presión:

      | pareja | $\lvert\Delta s\rvert$ | amplificación |
      |---|---|---|
      | **aceite y agua** | **0,15** | **6,7** |
      | agua y tetracloruro | 0,52 | 1,9 |
      | aceite y tetracloruro | 0,67 | 1,5 |

      Se eligen **aceite y agua**.

      **d) La lectura.** Los 42 mmcagua son columna de agua, 411,6 Pa
      ([Una columna en mca es siempre de agua](/road-to-ingenieria/fluidos/t04-hidrostatica/#una-columna-en-mca-es-siempre-de-agua)):

      $$
      R = \frac{0{,}042}{0{,}15} = 0{,}28\ \text{m}
      $$

      Veintiocho centímetros de menisco para cuatro centímetros de columna de
      agua: eso es lo que hace «micro» al manómetro.

      **e) La presión absoluta.** El barómetro, $0{,}755\cdot 13{,}6\cdot 9800
      = 100{,}63$ kPa, menos el vacío:

      $$
      p_{abs} = 100{,}63 - 0{,}41 = 100{,}21\ \text{kPa} = 1{,}002\ \text{bar}
      $$

      **f) El mínimo medible.** Con una regla de milímetro:

      $$
      \Delta p_{min} = 0{,}001\cdot 0{,}15\cdot 9800 = 1{,}47\ \text{Pa}
      $$

      El cuadernillo lo escribe $P = -1{,}47$ Pa, con el signo del vacío.

      **g) El tubo inclinado.** Para igualar esa sensibilidad con alcohol:

      $$
      0{,}8\sin\alpha = 0{,}15
      \qquad
      \alpha = 10{,}8^{\circ}
      $$

      **Lo que enseña.** El aparato no se lee: se **diseña**. Y el diseño es
      una sola decisión —qué pareja de líquidos— de la que sale todo lo demás:
      la amplificación, la resolución en pascales y el tubo inclinado
      equivalente. Pascal y medio es lo que se puede apreciar, y a cambio 42
      mm de columna de agua ya ocupan veintiocho centímetros de tubo: la
      finura se paga en rango.

  # ── 3 (30 %) · Una compuerta cuya resultante pasa siempre por el centro
  #    de curvatura, y una reacción que se anula a los cuatro metros.
  - id: exflu2021-1par-3-la-compuerta-que-se-abre-a-los-cuatro-metros
    titulo: La compuerta que se abre sola a los cuatro metros
    fuente: >-
      Ejercicio 3 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La compuerta OABO está articulada en el punto O y apoyada en el punto A.
      Tiene una masa $m = 1000$ kg por metro de compuerta y su centro de
      gravedad G está a una distancia $x_G = 4$ m horizontalmente desde el
      centro O. Las distancias $a$ y $c$ son respectivamente $a = 1$ m y
      $c = 0{,}5$ m. La compuerta se compone de un sector de círculo CAB de
      radio $R = 6$ m y ángulo $\alpha+\theta$, además del triángulo OAC. El
      ángulo $\beta$ es constante, pero el ángulo $\alpha$ y el ángulo
      $\theta$ son dependientes ambos de la altura $h$ del agua. El centro C
      de curvatura del sector CAB está situado a una distancia $c$ de la
      articulación O. El nivel del agua puede variar desde 0 m hasta
      $(R-a) = 5$ m. La anchura de la compuerta en un plano normal al dibujo
      es $b = 3$ m. Se pide calcular:

      **a)** Prisma horizontal de presiones **acotado** de la acción del agua
      sobre la compuerta. Calcular la fuerza horizontal (N) y centro de
      presiones de esta fuerza horizontal respecto a C cuando la altura del
      agua es de $h = 2$ m.

      **b)** Calcular la reacción que tiene lugar en A, como función de la
      altura $h$, es decir, $A_y = f(h)$.

      **c)** Calcular los valores de esta reacción para $h = 0$ m, $h = 2$ m y
      $h = h_{\text{máxima}} = R-a = 5$ m y hacer un gráfico esquemático de
      esta función, tomando como abscisas $h$ (m) y como ordenadas $A_y$ (N).
      Es suficiente representar los 3 puntos $h = 0$ m; $h = 2$ m y $h = 5$ m
      y unir los puntos de manera cualitativa, haciendo pasar la función por
      los 3 valores.

      **d)** ¿Para qué valor de $h = h_{apertura}$ (m) empezará a abrirse la
      compuerta de manera automática?

      **e)** Prisma vertical de presiones **acotado** de la acción del agua
      sobre la compuerta. Calcular la fuerza vertical (N) y centro de
      presiones de esta fuerza vertical respecto a C para una altura $h$ de
      2 m.

      **f)** Si la compuerta estuviese articulada en el centro de curvatura C,
      ¿cómo influiría el nivel del agua $h$ en la apertura de la compuerta?

      <figure class="figura-examen">
      <svg viewBox="0 0 460 330" role="img" width="460" height="330" aria-labelledby="exflu2021p1-3-enun-t exflu2021p1-3-enun-d">
