ejercicios:
  # ── 1 (30 %) · Seis afirmaciones, y las seis falsas por motivos
  #    distintos. El único ejercicio del corpus que se resuelve razonando.
  - id: exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas
    titulo: Seis afirmaciones, y las seis falsas por motivos distintos
    fuente: >-
      Ejercicio 1 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica que todas
      las afirmaciones eran falsas, pero no el razonamiento.
    nivel: examen
    enunciado: |
      Razonar si son **verdaderas o falsas** las siguientes afirmaciones:

      **a)** En el laboratorio se tiene un hidrómetro de cristal tarado para
      medir densidades relativas con valores comprendidos entre 0,85 y 0,95.
      Al sumergirlo en un fluido cuya densidad relativa es $s = 0{,}87$, el
      hidrómetro sufre un empuje menor que al sumergirlo en un fluido cuya
      densidad relativa es $s = 0{,}93$.

      **b)** Si compro un botellín de agua en la cafetería y le hago un
      orificio de $D = 3$ mm en el fondo **sin abrirlo**, el agua saldrá por
      dicho orificio hasta vaciar completamente el botellín.

      **c)** La potencia disipada por el fluido situado en el huelgo entre dos
      tubos concéntricos de radios $R_1$ y $R_2$ y longitud $L$ es la misma
      para el caso en el que el interior es fijo y el exterior gira con una
      velocidad $\omega$ que para el caso en el que el exterior es fijo y el
      que gira con velocidad $\omega$ es el interior.

      **d)** La relación existente entre las fuerzas de adhesión y las fuerzas
      de cohesión, para el caso en el que el ángulo de mojado o de contacto es
      de 90º, es de $F_{coh}/F_{adh} = \sqrt{2}/2$. Es **obligatorio**
      justificarlo analíticamente.

      **e)** La viscosidad dinámica de un fluido de peso específico
      $820\ \text{kg/m}^{3}$ y viscosidad cinemática $0{,}3$ cSt es de
      $2{,}46\cdot 10^{-3}$ Pl.

      **f)** A la hora de diseñar el espesor de las paredes de un tubo que va
      a transportar un fluido sometido a presión se sumerge el tubo en agua,
      ya que en esa situación el espesor calculado va a ser mayor.
    pide: Decidir y justificar cada una de las seis afirmaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El hidrómetro flota en los dos líquidos. ¿Qué empuje recibe en cada
          uno?
        opciones:
          - texto: >-
              El mismo en los dos, e igual a su propio peso; lo que cambia es
              cuánto se hunde
            correcta: true
            mensaje: |
              Eso es, y por eso la afirmación a) es falsa. Un cuerpo que
              **flota** desplaza siempre el peso de fluido que él mismo pesa,
              así que el empuje es su peso y no depende del líquido. En el
              líquido más denso desplaza menos volumen, y por eso se hunde
              menos: ahí está la escala del aparato.
          - texto: >-
              Mayor en el más denso, porque el empuje es $\gamma V$ y $\gamma$
              es mayor
            mensaje: |
              La fórmula es correcta pero $V$ no es constante: es el volumen
              **sumergido**, y en el líquido más denso el hidrómetro se hunde
              menos. Los dos factores se compensan exactamente, porque el
              cuerpo flota.
          - texto: >-
              Menor en el más denso, porque se hunde menos
            mensaje: |
              El volumen sumergido sí es menor, pero el peso específico es
              mayor en la misma proporción. El producto —el empuje— no cambia:
              es el peso del hidrómetro.

      - tipo: calcular
        titulo: La viscosidad dinámica de la afirmación e)
        pregunta: |
          ¿Cuánto vale realmente $\mu$, en Pa·s?
        respuesta:
          tipo: numero
          valor: '0.000246'
          tolerancia: 0.000005
          formato: un número en pascales por segundo
        distractores:
          - valor: '0.00246'
            mensaje: |
              Ese es el valor que **afirma** el enunciado, y está diez veces
              alto. Un centistoke es $10^{-6}\ \text{m}^{2}/\text{s}$, así que
              $0{,}3$ cSt son $3\cdot 10^{-7}$, no $3\cdot 10^{-6}$.
          - valor: '2733'
            mensaje: |
              Has dividido la densidad entre la viscosidad cinemática en vez
              de multiplicarlas. $\mu = \rho\,\nu$.
        pista: |
          $\mu = \rho\,\nu$, con $0{,}3$ cSt $= 3\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.
        desarrollo: |
          $$
          \mu = 820\cdot 3\cdot 10^{-7} = 2{,}46\cdot 10^{-4}\ \text{Pl}
          $$

          El enunciado dice $2{,}46\cdot 10^{-3}$: **falsa**, por un factor
          diez que sale de confundir el centistoke con el stoke.

      - tipo: calcular
        titulo: La relación de fuerzas de la afirmación d)
        pregunta: |
          Con un ángulo de contacto de 90º, ¿cuánto vale realmente
          $F_{coh}/F_{adh}$?
        respuesta:
          tipo: numero
          valor: '1.414'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.707'
            mensaje: |
              Ese es el valor que **afirma** el enunciado, y es exactamente el
              inverso del correcto. La confusión está en qué fuerza va en el
              numerador.
          - valor: '1'
            mensaje: |
              Serían iguales si la cohesión actuara en la misma dirección que
              la adhesión. Actúa a 45º, y ese factor $\sqrt{2}$ es todo el
              resultado.
        pista: |
          La adhesión tira perpendicular a la pared y la cohesión a 45º. Con
          $\theta = 90^{\circ}$ la superficie libre es paralela a la pared, es
          decir la resultante es perpendicular a ella.
        desarrollo: |
          Con la construcción de siempre, la resultante tiene componentes

          $$
          R_x = F_{adh}-\frac{F_{coh}}{\sqrt{2}}
          \qquad
          R_y = \frac{F_{coh}}{\sqrt{2}}
          $$

          y $\cos\theta = R_x/|R|$. Que $\theta$ valga 90º significa
          $\cos\theta = 0$, es decir $R_x = 0$:

          $$
          F_{adh} = \frac{F_{coh}}{\sqrt{2}}
          \qquad\Longrightarrow\qquad
          \frac{F_{coh}}{F_{adh}} = \sqrt{2} = 1{,}414
          $$

          El enunciado dice $\sqrt{2}/2 = 0{,}707$: **falsa**, y del revés.

      - tipo: justificar
        pregunta: Ordena las seis respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** Falsa. Un cuerpo que flota recibe siempre un empuje igual
              a su peso; lo que cambia con la densidad es el calado, no el
              empuje.
          - texto: >-
              **c)** Falsa. El par depende del radio donde se aplica el
              cortante, así que girando el tubo exterior la potencia disipada
              es $(R_2/R_1)^{3}$ veces mayor que girando el interior.
          - texto: >-
              **d)** Falsa y del revés: con 90º sale $F_{coh}/F_{adh} =
              \sqrt{2}$. **e)** Falsa por un factor diez: son
              $2{,}46\cdot 10^{-4}$ Pl.
          - texto: >-
              **b)** Falsa porque el orificio de 3 mm es demasiado grande para
              que la tensión superficial retenga el agua.
            trampa: true
            mensaje: |
              Es falsa, sí, pero no por eso. Lo que impide que el botellín se
              vacíe es que está **cerrado**: al salir agua, el aire de dentro
              se expande, su presión cae por debajo de la atmosférica y el
              chorro se para en cuanto la depresión iguala a la columna. Si
              destapas el botellín, se vacía por muy pequeño que sea el
              orificio; y con la tapa puesta no se vacía por muy grande que
              sea.
    resolucion: |
      **Las seis son falsas**, y lo interesante es que cada una por un motivo
      distinto.

      **a) El hidrómetro.** Falsa. Un cuerpo que **flota** desplaza siempre un
      peso de líquido igual al suyo, así que el empuje es su propio peso y no
      depende del fluido. Lo que cambia es el **volumen sumergido**: en el
      líquido más denso se hunde menos, y esa es precisamente la escala del
      aparato.

      **b) El botellín cerrado.** Falsa. Al salir agua por el orificio, el aire
      de la cámara superior se expande y su presión baja. El chorro se detiene
      en cuanto la depresión interior iguala a la columna de agua que queda.
      Con la tapa puesta el botellín **no se vacía**, por grande que sea el
      agujero; destapado, se vacía por pequeño que sea.

      **c) Los cilindros concéntricos.** Falsa. El cortante en el huelgo es el
      mismo, $\tau = \mu\,\omega R/e$, pero el **par** es fuerza por radio y la
      fuerza es cortante por área:

      $$
      M = \tau\,(2\pi R L)\,R = \frac{2\pi\mu\omega L}{e}\,R^{3}
      $$

      Girando el exterior, ese $R$ es $R_2$; girando el interior, $R_1$. La
      potencia, $M\omega$, difiere en $(R_2/R_1)^{3}$.

      **d) La adhesión y la cohesión.** Falsa, y justo del revés. Componiendo
      la adhesión —perpendicular a la pared— con la cohesión —a 45º—, un
      ángulo de contacto de 90º exige que la componente perpendicular de la
      resultante se anule:

      $$
      F_{adh} = \frac{F_{coh}}{\sqrt{2}}
      \qquad\Longrightarrow\qquad
      \frac{F_{coh}}{F_{adh}} = \sqrt{2}
      $$

      **e) La viscosidad.** Falsa por un factor diez.
      $0{,}3\ \text{cSt} = 3\cdot 10^{-7}\ \text{m}^{2}/\text{s}$, así que
      $\mu = 820\cdot 3\cdot 10^{-7} = 2{,}46\cdot 10^{-4}$ Pl.

      **f) El tubo sumergido.** Falsa, y del revés otra vez. Lo que dimensiona
      el espesor es la **diferencia** entre la presión interior y la exterior.
      Sumergir el tubo sube la presión exterior, así que la diferencia baja y
      el espesor necesario es **menor**. Es la razón por la que una tubería
      submarina de la misma presión de servicio puede ser más fina que la
      misma tubería al aire.

      **Y lo que enseña el conjunto.** Cinco de las seis se caen por un
      descuido de razonamiento —confundir empuje con calado, olvidar que un
      recinto cerrado no admite aire, invertir un cociente, restar mal una
      presión— y solo una, la e), por unidades. Un examen de treinta por
      ciento sin una sola ecuación de partida.

  # ── 2 (20 %) · Diseñar un micromanómetro eligiendo la pareja de líquidos
  #    entre tres candidatos.
  - id: exflu2021-1par-2-el-micromanometro-que-hay-que-disenar
    titulo: El micromanómetro que hay que diseñar eligiendo los líquidos
    fuente: >-
      Ejercicio 2 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En el laboratorio de Mecánica de Fluidos se desea construir un
      micromanómetro de líquidos inmiscibles para medir presiones de vacío muy
      pequeñas.

      Se dispone de los siguientes fluidos, inmiscibles entre sí: aceite
      ($s = 0{,}85$), tetracloruro de carbono ($s = 1{,}52$) y agua. Se pide:

      **a)** Representar esquemáticamente el micromanómetro en la situación
      inicial (ambos depósitos abiertos a la atmósfera).

      **b)** Deducir la expresión para el cálculo de la presión de vacío.
      Considerar que las dimensiones de los depósitos son muy grandes respecto
      del diámetro del tubo manométrico.

      **c)** Seleccionar los dos fluidos más adecuados para obtener la mayor
      precisión.

      **d)** En uno de los depósitos se genera un vacío de 42 mm.c.agua.
      Calcular la lectura $R$ en el micromanómetro.

      **e)** Si la lectura del barómetro del laboratorio es 755 mmcHg,
      calcular la presión absoluta en el depósito en bar.

      **f)** Calcular la presión de vacío mínima que se puede medir en Pa.

      **g)** Si se desea que el micromanómetro de tubo inclinado tenga la
      misma sensibilidad, ¿cuál debería ser el ángulo de inclinación del tubo
      si el fluido empleado fuera alcohol ($s = 0{,}8$)?
    pide: Qué pareja de líquidos elegir, la lectura, la presión absoluta y el ángulo equivalente.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres líquidos y hay que elegir dos. ¿Con qué criterio?
        opciones:
          - texto: >-
              La pareja cuyas densidades más se parezcan, porque la lectura es
              inversamente proporcional a su diferencia
            correcta: true
            mensaje: |
              Eso es. La presión medida es $R(\gamma_2-\gamma_1)$, así que
              para una misma presión la lectura crece cuando la diferencia se
              hace pequeña. Aceite y agua se llevan 0,15; agua y tetracloruro,
              0,52; aceite y tetracloruro, 0,67.
          - texto: >-
              La pareja cuyas densidades más se diferencien, para que la
              lectura sea más estable
            mensaje: |
              Más estable sí, pero también mucho más corta: esa es la
              elección de un manómetro normal, no de un micromanómetro. Aquí
              se pide **la mayor precisión** para presiones muy pequeñas.
          - texto: >-
              La pareja que incluya siempre el agua, por ser el fluido de
              referencia
            mensaje: |
              El agua entra en la mejor pareja, pero no por ser la referencia:
              entra porque su densidad es la que más se parece a la del
              aceite. Si hubiera un cuarto líquido de $s = 0{,}88$, la pareja
              ganadora sería aceite y ese.

      - tipo: calcular
        titulo: La lectura del micromanómetro
        pregunta: |
          Con la pareja elegida y un vacío de 42 mm.c.agua, ¿cuánto vale la
          lectura $R$, en metros?
        respuesta:
          tipo: numero
          valor: '0.28'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '0.042'
            mensaje: |
              Esa es la presión de vacío expresada en metros de columna de
              agua, no la lectura del aparato. El micromanómetro **amplifica**
              por $1/(s_2-s_1)$, aquí casi siete veces.
          - valor: '0.081'
            mensaje: |
              Has usado la pareja agua-tetracloruro, cuya diferencia es 0,52.
              La buena es aceite-agua, con 0,15: amplifica tres veces y media
              más.
        pista: |
          $\Delta p = R\,(\gamma_2-\gamma_1)$, y los 42 mm.c.agua son
          $0{,}042\cdot 9800$ Pa.
        desarrollo: |
          $$
          R = \frac{0{,}042\cdot 9800}{(1-0{,}85)\cdot 9800}
          = \frac{0{,}042}{0{,}15} = 0{,}28\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión absoluta del depósito
        pregunta: |
          Con el barómetro en 755 mmcHg, ¿cuál es la presión absoluta del
          depósito, en bar?
        respuesta:
          tipo: numero
          valor: '1.002'
          tolerancia: 0.002
          formato: un número en bar
        distractores:
          - valor: '1.0103'
            mensaje: |
              Has sumado el vacío en vez de restarlo. Un vacío es presión
              **por debajo** de la atmosférica.
          - valor: '0.0041'
            mensaje: |
              Esos son los 42 mm.c.agua pasados a bar, es decir la presión de
              vacío. La absoluta es la atmosférica menos eso.
        pista: |
          755 mmcHg son $0{,}755\cdot 13{,}6\cdot 9800$ Pa, y de ahí se resta
          el vacío.
        desarrollo: |
          $$
          p_{at} = 0{,}755\cdot 13{,}6\cdot 9800 = 100{,}61\ \text{kPa}
          $$
          $$
          p_{abs} = 100{,}61-0{,}41 = 100{,}20\ \text{kPa} = 1{,}002\ \text{bar}
          $$

      - tipo: calcular
        titulo: El ángulo del tubo inclinado equivalente
        pregunta: |
          ¿Qué ángulo debería tener un tubo inclinado de alcohol para igualar
          esta sensibilidad, en grados?
        respuesta:
          tipo: numero
          valor: '10.8'
          tolerancia: 0.1
          formato: un número en grados
        distractores:
          - valor: '8.63'
            mensaje: |
              Has usado agua en el tubo inclinado. El enunciado dice alcohol,
              $s = 0{,}8$: al ser más ligero necesita un ángulo algo mayor
              para dar la misma sensibilidad.
          - valor: '5.74'
            mensaje: |
              Ese sería el ángulo si la diferencia de densidades de la pareja
              fuera $0{,}1$ y el tubo llevara agua. Aquí la diferencia es
              $0{,}15$ y el líquido, alcohol.
        pista: |
          Un milímetro de tubo inclinado vale
          $\gamma_{alc}\sin\alpha$; un milímetro de menisco,
          $\gamma_{ag}(s_2-s_1)$.
        desarrollo: |
          $$
          0{,}8\,\sin\alpha = 0{,}15
          \;\Longrightarrow\;
          \sin\alpha = 0{,}1875
          \;\Longrightarrow\;
          \alpha = 10{,}8^{\circ}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión medida es $R(\gamma_2-\gamma_1)$, así que interesa la
              pareja de densidades más parecidas: **aceite y agua**.
          - texto: >-
              Con esa pareja, 42 mm.c.agua de vacío mueven el menisco 28 cm, y
              cada milímetro de lectura vale 1,47 Pa.
          - texto: >-
              Un tubo inclinado de alcohol tendría que ponerse a 10,8º para
              medir con la misma finura.
          - texto: >-
              La sensibilidad no depende de la sección de los depósitos porque
              el enunciado dice que son grandes, así que el aparato serviría
              igual con depósitos pequeños.
            trampa: true
            mensaje: |
              La hipótesis de depósitos grandes es la que **permite** suponer
              que sus niveles no se mueven. Con depósitos estrechos, parte del
              desplazamiento se lo comerían las superficies libres y el
              menisco se movería menos: el aparato sería menos sensible y,
              peor aún, su calibración dependería de la relación de secciones.
    resolucion: |
      **b) La expresión.** Con los dos depósitos anchos, sus niveles no se
      mueven y todo el desplazamiento ocurre en el tubo. Al desplazarse el
      menisco una distancia $R$, una columna de líquido pesado sustituye a una
      de ligero en la misma altura:

      $$
      p_{vacío} = R\,(\gamma_2-\gamma_1)
      $$

      **c) La pareja.** Cuanto más pequeña sea $\gamma_2-\gamma_1$, más larga
      es la lectura para la misma presión:

      | pareja | $\lvert\Delta s\rvert$ | amplificación |
      |---|---|---|
      | **aceite y agua** | **0,15** | **6,7** |
      | agua y tetracloruro | 0,52 | 1,9 |
      | aceite y tetracloruro | 0,67 | 1,5 |

      Se eligen **aceite y agua**.

      **d) La lectura.**

      $$
      R = \frac{0{,}042}{0{,}15} = 0{,}28\ \text{m}
      $$

      Veintiocho centímetros de menisco para cuatro centímetros de columna de
      agua: eso es lo que hace «micro» al manómetro.

      **e) La presión absoluta.**

      $$
      p_{abs} = 100{,}61 - 0{,}41 = 100{,}20\ \text{kPa} = 1{,}002\ \text{bar}
      $$

      **f) El mínimo medible.** Con una regla de milímetro:

      $$
      \Delta p_{min} = 0{,}001\cdot 0{,}15\cdot 9800 = 1{,}47\ \text{Pa}
      $$

      **g) El tubo inclinado.** Para igualar esa sensibilidad con alcohol:

      $$
      0{,}8\sin\alpha = 0{,}15
      \qquad
      \alpha = 10{,}8^{\circ}
      $$

      **Lo que enseña.** El aparato no se lee: se **diseña**. Y el diseño es
      una sola decisión —qué pareja de líquidos— de la que sale todo lo demás:
      la amplificación, la resolución en pascales y el tubo inclinado
      equivalente. Un milímetro y medio de pascal es lo que se puede apreciar,
      y para eso hacen falta veintiocho centímetros de tubo.

  # ── 3 (30 %) · Una compuerta cuya resultante pasa siempre por el centro
  #    de curvatura, y una reacción que se anula a los cuatro metros.
  - id: exflu2021-1par-3-la-compuerta-que-se-abre-a-los-cuatro-metros
    titulo: La compuerta que se abre sola a los cuatro metros
    fuente: >-
      Ejercicio 3 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La compuerta OABO está articulada en el punto O y apoyada en el punto A.
      Tiene una masa $m = 1000$ kg por metro de compuerta y su centro de
      gravedad G está a una distancia $x_G = 4$ m horizontalmente desde el
      centro O.

      Las distancias $a$ y $c$ son respectivamente $a = 1$ m y $c = 0{,}5$ m.
      La compuerta se compone de un sector de círculo CAB de radio $R = 6$ m,
      además del triángulo OAC. El centro C de curvatura del sector CAB está
      situado a una distancia $c$ de la articulación O. El nivel del agua
      puede variar desde 0 m hasta $(R-a) = 5$ m. La anchura de la compuerta
      en un plano normal al dibujo es $b = 3$ m. Se pide calcular:

      **a)** Prisma horizontal de presiones acotado. Calcular la fuerza
      horizontal (N) y el centro de presiones de esta fuerza horizontal
      respecto a C cuando la altura del agua es de $h = 2$ m.

      **b)** Calcular la reacción que tiene lugar en A como función de la
      altura $h$.

      **c)** Calcular los valores de esta reacción para $h = 0$, $h = 2$ y
      $h = h_{máxima} = R-a = 5$ m.

      **d)** ¿Para qué valor de $h = h_{apertura}$ empezará a abrirse la
      compuerta de manera automática?

      **e)** Prisma vertical de presiones acotado. Calcular la fuerza vertical
      (N) y su centro de presiones respecto a C para $h = 2$ m.

      **f)** Si la compuerta estuviese articulada en el centro de curvatura C,
      ¿cómo influiría el nivel del agua $h$ en la apertura de la compuerta?

      <figure class="figura-examen">
      <svg viewBox="46 -6 420 220" role="img" width="440" height="230"
           aria-labelledby="fz3t fz3d">
        <title id="fz3t">La compuerta OABO, con su sector de círculo y el triángulo</title>
        <desc id="fz3d">Una compuerta articulada en el punto O y apoyada en el
        punto A. Está formada por un sector de círculo CAB de seis metros de
        radio, con centro en C, más el triángulo OAC. El punto A está al nivel
        del suelo y del fondo del agua; C queda un metro por debajo de ese
        nivel y O medio metro por debajo de C, los dos en la misma vertical. El
        punto B está cinco metros por encima del nivel de A, también en la
        vertical de C. El agua embalsa a la derecha, apoyada contra la cara
        convexa del arco, y su nivel h puede subir desde cero hasta los cinco
        metros que separan A de B. El centro de gravedad G está cuatro metros a
        la derecha de O.</desc>

        <path d="M295 88 L438 88 L438 140 L314 140 A 156 156 0 0 0 295 88 Z"
              fill="var(--live)" fill-opacity=".16"/>
        <line x1="295" y1="88" x2="438" y2="88" stroke="var(--live)" stroke-width="1.6"/>
