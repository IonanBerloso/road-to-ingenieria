          <path d="M322 140 L314 150 M342 140 L334 150 M362 140 L354 150 M382 140 L374 150 M402 140 L394 150 M422 140 L414 150"/>
        </g>

        <circle cx="160" cy="179" r="5" fill="var(--ink)"/>
        <text x="150" y="196" text-anchor="end" font-size="11" fill="var(--ink)">O</text>
        <circle cx="314" cy="140" r="4.5" fill="var(--flag)"/>
        <text x="316" y="158" font-size="11" fill="var(--flag)">A</text>
        <circle cx="160" cy="10" r="4" fill="var(--ink)"/>
