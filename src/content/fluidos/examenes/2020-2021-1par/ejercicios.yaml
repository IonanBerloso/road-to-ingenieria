ejercicios:
  # ── 1 (30 %) · Seis afirmaciones, y las seis falsas por motivos
  #    distintos. El único ejercicio del corpus que se resuelve razonando.
  - id: exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas
    titulo: Seis afirmaciones, y las seis falsas por motivos distintos
    fuente: >-
      Ejercicio 1 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica que todas
      las afirmaciones eran falsas, pero no el razonamiento.
    nivel: examen
    enunciado: |
      Razonar si son **VERDADERAS** o **FALSAS** las siguientes afirmaciones:

      **a)** En el laboratorio se tiene un hidrómetro de cristal tarado para
      medir densidades relativas con valores comprendidos entre 0,85 y 0,95.
      Al sumergirlo en un fluido cuya densidad relativa es $s = 0{,}87$, el
      hidrómetro sufre un empuje menor que al sumergirlo en un fluido cuya
      densidad relativa es $s = 0{,}93$.

      **b)** Si compro un botellín de agua en la cafetería y le hago un
      orificio de $D = 3$ mm en el fondo a dicho botellín **sin abrirlo**, el
      agua saldrá por dicho orificio hasta vaciar completamente el botellín.

      **c)** La potencia disipada por el fluido situado en el huelgo entre dos
      tubos concéntricos de radios $R_1$ y $R_2$ y longitud $L$ es la misma
      para el caso en el que el interior es fijo y el exterior gira con una
      velocidad $\omega$ que para el caso en el que el exterior es fijo y el
      que gira con velocidad $\omega$ es el interior.

      **d)** La relación existente entre las fuerzas de adhesión y las fuerzas
      de cohesión, para el caso en el que el ángulo de mojado o de contacto es
      de 90º, es de $F_{coh}/F_{adh} = (\sqrt{2})/2$. Es **OBLIGATORIO**
      justificarlo analíticamente.

      **e)** La viscosidad dinámica de un fluido de peso específico
      $820\ \text{kg/m}^{3}$ y viscosidad cinemática $0{,}3$ cSt, es de
      $2{,}46\cdot 10^{-3}$ Pl.

      **f)** A la hora de diseñar el espesor de las paredes de un tubo que va
      a transportar un fluido sometido a presión se sumerge el tubo en agua,
      ya que en esa situación el espesor calculado va a ser mayor.
    pide: Decidir y justificar cada una de las seis afirmaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El hidrómetro flota en los dos líquidos. ¿Qué empuje recibe en cada
          uno?
        opciones:
          - texto: >-
              El mismo en los dos, e igual a su propio peso; lo que cambia es
              cuánto se hunde
            correcta: true
            mensaje: |
              Eso es, y por eso la afirmación a) es falsa. Un cuerpo que
              **flota** desplaza siempre el peso de fluido que él mismo pesa,
              así que el empuje es su peso y no depende del líquido. En el
              líquido más denso desplaza menos volumen, y por eso se hunde
              menos: ahí está la escala del aparato.
          - texto: >-
              Mayor en el más denso, porque el empuje es $\gamma V$ y $\gamma$
              es mayor
            mensaje: |
              La fórmula es correcta pero $V$ no es constante: es el volumen
              **sumergido**, y en el líquido más denso el hidrómetro se hunde
              menos. Los dos factores se compensan exactamente, porque el
              cuerpo flota.
          - texto: >-
              Menor en el más denso, porque se hunde menos
            mensaje: |
              El volumen sumergido sí es menor, pero el peso específico es
              mayor en la misma proporción. El producto —el empuje— no cambia:
              es el peso del hidrómetro.

      - tipo: calcular
        titulo: La viscosidad dinámica de la afirmación e)
        pregunta: |
          ¿Cuánto vale realmente $\mu$, en Pa·s?
        respuesta:
          tipo: numero
          valor: '0.000246'
          tolerancia: 0.000005
          formato: un número en pascales por segundo
        distractores:
          - valor: '0.00246'
            mensaje: |
              Ese es el valor que **afirma** el enunciado, y está diez veces
              alto. Un centistoke es $10^{-6}\ \text{m}^{2}/\text{s}$, así que
              $0{,}3$ cSt son $3\cdot 10^{-7}$, no $3\cdot 10^{-6}$.
          - valor: '2.733e9'
            mensaje: |
              Has despejado al revés: de $\nu = \mu/\rho$ sale
              $\mu = \rho\,\nu$, no $\rho/\nu$. Dividir 820 entre
              $3\cdot 10^{-7}$ da $2{,}7\cdot 10^{9}$, que no es ninguna
              viscosidad.
        pista: |
          $\mu = \rho\,\nu$, con $0{,}3$ cSt $= 3\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.
        desarrollo: |
          $$
          \mu = 820\cdot 3\cdot 10^{-7} = 2{,}46\cdot 10^{-4}\ \text{Pl}
          $$

          El enunciado dice $2{,}46\cdot 10^{-3}$: **falsa**, por un factor
          diez que sale de confundir el centistoke con el stoke.

      - tipo: calcular
        titulo: La relación de fuerzas de la afirmación d)
        pregunta: |
          Con un ángulo de contacto de 90º, ¿cuánto vale realmente
          $F_{coh}/F_{adh}$?
        respuesta:
          tipo: numero
          valor: '1.414'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.707'
            mensaje: |
              Ese es el valor que **afirma** el enunciado, y es exactamente el
              inverso del correcto. La confusión está en qué fuerza va en el
              numerador.
          - valor: '1'
            mensaje: |
              Serían iguales si la cohesión actuara en la misma dirección que
              la adhesión. Actúa a 45º, y ese factor $\sqrt{2}$ es todo el
              resultado.
        pista: |
          La adhesión tira perpendicular a la pared y la cohesión a 45º. Con
          $\theta = 90^{\circ}$ la superficie libre llega perpendicular a la
          pared, y la resultante, que es perpendicular a la superficie libre,
          queda paralela a la pared: su componente perpendicular a la pared se
          anula.
        desarrollo: |
          Con la construcción de siempre, la resultante tiene componentes

          $$
          R_x = F_{adh}-\frac{F_{coh}}{\sqrt{2}}
          \qquad
          R_y = \frac{F_{coh}}{\sqrt{2}}
          $$

          y $\cos\theta = R_x/|R|$. Que $\theta$ valga 90º significa
          $\cos\theta = 0$, es decir $R_x = 0$:

          $$
          F_{adh} = \frac{F_{coh}}{\sqrt{2}}
          \qquad\Longrightarrow\qquad
          \frac{F_{coh}}{F_{adh}} = \sqrt{2} = 1{,}414
          $$

          El enunciado dice $\sqrt{2}/2 = 0{,}707$: **falsa**, y del revés.

      - tipo: justificar
        pregunta: Ordena las seis respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** Falsa. Un cuerpo que flota recibe siempre un empuje igual
              a su peso; lo que cambia con la densidad es el calado, no el
              empuje.
          - texto: >-
              **c)** Falsa. El par depende del radio donde se aplica el
              cortante, así que girando el tubo exterior la potencia disipada
              es $(R_2/R_1)^{3}$ veces mayor que girando el interior.
          - texto: >-
              **d)** Falsa y del revés: con 90º sale $F_{coh}/F_{adh} =
              \sqrt{2}$. **e)** Falsa por un factor diez: son
              $2{,}46\cdot 10^{-4}$ Pl.
          - texto: >-
              **b)** Falsa: con el botellín cerrado, al salir unas gotas el
              aire de dentro se expande y su presión baja hasta sostener la
              columna, y por un agujero de 3 mm no entra aire que la reponga.
          - texto: >-
              **f)** Falsa y del revés: lo que dimensiona la pared es la
              diferencia entre la presión de dentro y la de fuera; sumergido
              el tubo, esa diferencia baja y el espesor necesario es menor.
          - texto: >-
              **b)** Falsa porque el orificio de 3 mm es demasiado grande para
              que la tensión superficial retenga el agua.
            trampa: true
            mensaje: |
              Es falsa, sí, pero no por eso: la tensión superficial, en todo
              caso, ayuda a que el agua **no** salga. Lo que impide que el
              botellín se vacíe es que está **cerrado**: al salir agua, el
              aire de dentro se expande, su presión cae por debajo de la
              atmosférica y el chorro se para en cuanto la depresión iguala a
              la columna. Para seguir tendría que entrar aire por el mismo
              agujero, y por uno de 3 mm no entra. Destapado, el aire entra
              por arriba y el botellín se vacía.
    resolucion: |
      **Las seis son falsas**, y lo interesante es que cada una por un motivo
      distinto.

      **a) El hidrómetro.** Falsa. Un cuerpo que **flota** desplaza siempre un
      peso de líquido igual al suyo, así que el empuje es su propio peso y no
      depende del fluido. Lo que cambia es el **volumen sumergido**: en el
      líquido más denso se hunde menos, y esa es precisamente la escala del
      aparato.

      **b) El botellín cerrado.** Falsa. Al salir agua por el orificio, el aire
      de la cámara superior se expande y su presión baja. El chorro se detiene
      en cuanto la depresión interior iguala a la columna de agua que queda,
      después de unas gotas. Para vaciarse tendría que entrar aire por el
      mismo agujero, y por uno de 3 mm no entra: la tensión superficial
      sostiene la superficie del agua en el orificio. Con la tapa puesta el
      botellín **no se vacía**; destapado, el aire entra por arriba y se
      vacía.

      **c) Los cilindros concéntricos.** Falsa. Con el perfil de velocidad
      lineal del huelgo estrecho —el modelo del curso, el del problema 1.14 de
      la colección—, el cortante es $\tau = \mu\,\omega R/e$, con $R$ el radio
      del tubo que gira, y el **par** es fuerza por radio, con la fuerza igual
      al cortante por el área:

      $$
      M = \tau\,(2\pi R L)\,R = \frac{2\pi\mu\omega L}{e}\,R^{3}
      $$

      Girando el exterior, ese $R$ es $R_2$; girando el interior, $R_1$. La
      potencia, $M\omega$, difiere en $(R_2/R_1)^{3}$.

      **d) La adhesión y la cohesión.** Falsa, y justo del revés. Componiendo
      la adhesión —perpendicular a la pared— con la cohesión —a 45º—, un
      ángulo de contacto de 90º exige que la componente perpendicular de la
      resultante se anule:

      $$
      F_{adh} = \frac{F_{coh}}{\sqrt{2}}
      \qquad\Longrightarrow\qquad
      \frac{F_{coh}}{F_{adh}} = \sqrt{2}
      $$

      **e) La viscosidad.** Falsa por un factor diez.
      $0{,}3\ \text{cSt} = 3\cdot 10^{-7}\ \text{m}^{2}/\text{s}$, así que
      $\mu = 820\cdot 3\cdot 10^{-7} = 2{,}46\cdot 10^{-4}$ Pl.

      **f) El tubo sumergido.** Falsa, y del revés otra vez. Lo que dimensiona
      el espesor es la **diferencia** entre la presión interior y la exterior.
      Sumergir el tubo sube la presión exterior, así que la diferencia baja y
      el espesor necesario es **menor**. Es la razón por la que una tubería
      submarina de la misma presión de servicio puede ser más fina que la
      misma tubería al aire.

      **Y lo que enseña el conjunto.** Cinco de las seis se caen por un
      descuido de razonamiento —confundir empuje con calado, olvidar que un
      recinto cerrado no deja entrar aire, olvidar que el par lleva el radio,
      invertir un cociente, restar mal una presión— y solo una, la e), por
      unidades. Un ejercicio de treinta por ciento sin una sola ecuación de
      partida.

  # ── 2 (20 %) · Diseñar un micromanómetro eligiendo la pareja de líquidos
  #    entre tres candidatos.
  - id: exflu2021-1par-2-el-micromanometro-que-hay-que-disenar
    titulo: El micromanómetro que hay que diseñar eligiendo los líquidos
    fuente: >-
      Ejercicio 2 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En el laboratorio de Mecánica de Fluidos se desea construir un
      micromanómetro de líquidos inmiscibles para **medir presiones de vacío
      muy pequeñas**.

      Se dispone de los siguientes fluidos, inmiscibles entre sí: aceite
      ($s_{\text{aceite}} = 0{,}85$); tetracloruro de carbono
      ($s_{\text{Cl4C}} = 1{,}52$) y agua.

      Se pide:

      **a)** Representar esquemáticamente el micromanómetro en la situación
      inicial (ambos depósitos abiertos a la atmósfera).

      **b)** Deducir la expresión para el cálculo de la **presión de vacío**.
      Considerar que las dimensiones de los depósitos son muy grandes respecto
      del diámetro del tubo manométrico.

      **c)** Seleccionar los dos fluidos más adecuados para obtener la mayor
      precisión. **Razonar la respuesta**.

      **d)** En uno de los depósitos se genera un vacío de 42 mmcagua.
      Calcular la lectura $R$ en el micromanómetro.

      **e)** Si la lectura del barómetro del laboratorio es 755 mmcHg,
      calcular la presión absoluta en el depósito en bar.

      **f)** Calcular la presión de vacío mínima que se puede medir en Pa.

      **g)** Si se desea que el micromanómetro de tubo inclinado tenga la
      misma sensibilidad, ¿cuál debería de ser el ángulo de inclinación del
      tubo, si el fluido empleado fuera alcohol ($s_{\text{alcoh}} = 0{,}8$)?

      **Notas nuestras.** *El cuadernillo imprime «aceite (saceite=0,85;»,
      sin cerrar el paréntesis, y en el g) «Sí se desea», con tilde;
      corregimos las dos erratas.*
    pide: El esquema, la expresión deducida, qué pareja de líquidos elegir, la lectura, la presión absoluta, la mínima medible y el ángulo equivalente.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres líquidos y hay que elegir dos. ¿Con qué criterio?
        opciones:
          - texto: >-
              La pareja cuyas densidades más se parezcan, porque la lectura es
              inversamente proporcional a su diferencia
            correcta: true
            mensaje: |
              Eso es. La presión medida es $R(\gamma_2-\gamma_1)$, así que
              para una misma presión la lectura crece cuando la diferencia se
              hace pequeña. Aceite y agua se llevan 0,15; agua y tetracloruro,
              0,52; aceite y tetracloruro, 0,67.
          - texto: >-
              La pareja cuyas densidades más se diferencien, para que la
              lectura sea más estable
            mensaje: |
              Más estable sí, pero también mucho más corta: esa es la
              elección de un manómetro normal, no de un micromanómetro. Aquí
              se pide **la mayor precisión** para presiones muy pequeñas.
          - texto: >-
              La pareja que incluya siempre el agua, por ser el fluido de
              referencia
            mensaje: |
              El agua entra en la mejor pareja, pero no por ser la referencia:
              entra porque su densidad es la que más se parece a la del
              aceite. Si hubiera un cuarto líquido de $s = 0{,}88$, la pareja
              ganadora sería aceite y ese.

      - tipo: dibujar
        consigna: |
          El esquema del apartado a): el micromanómetro de líquidos
          inmiscibles con los dos depósitos abiertos a la atmósfera, antes de
          hacer el vacío. Dibújalo con la pareja que eliges en el c), aceite y
          agua, y marca dónde queda la superficie de separación, que es desde
          donde se mide la lectura $R$.
        comprueba:
          - punto: >-
              Dos depósitos anchos arriba, abiertos, unidos por abajo por un
              tubo estrecho en U.
            porque: >-
              La anchura es la hipótesis del apartado b): «las dimensiones de
              los depósitos son muy grandes respecto del diámetro del tubo
              manométrico». Con los depósitos dibujados del ancho del tubo, el
              esquema contradice la expresión que se deduce después.
          - punto: >-
              Una sola interfaz, dentro de uno de los tubos: el agua en su
              depósito y en el fondo de la U, y el aceite en su depósito y en
              su rama, hasta la interfaz.
            porque: >-
              Es lo que hace «de líquidos inmiscibles» al aparato, y la
              interfaz es lo único que se mueve al medir. El líquido pesado
              tiene que ocupar el fondo de la U: con el aceite abajo, el agua
              se hundiría a través de él.
          - punto: >-
              La columna de aceite sobre la interfaz, más alta que la de agua,
              en la proporción $h_{ac} = h_{ag}/0{,}85$.
            porque: >-
              Con los dos depósitos abiertos, las dos columnas pesan lo mismo a
              la altura de la interfaz, $\gamma_{ag}\,h_{ag} =
              \gamma_{ac}\,h_{ac}$, y el líquido ligero necesita más altura.
              Las dos superficies libres a la misma cota son un aparato que no
              está en equilibrio.
          - punto: >-
              La posición de la interfaz marcada como el cero de la lectura.
            porque: >-
              $R$ es lo que se desplaza la interfaz desde ahí cuando se hace el
              vacío en un depósito. Sin la posición de partida, el esquema del
              a) no sirve para deducir la expresión del b), que se escribe
              comparando el antes y el después.
        figura: |
          <svg viewBox="0 0 360 360" role="img" width="360" height="360" aria-labelledby="exflu2021p1-2-mic-t exflu2021p1-2-mic-d">
            <title id="exflu2021p1-2-mic-t">El micromanómetro de líquidos inmiscibles del ejercicio 2 en la situación inicial, con agua y aceite y los dos depósitos abiertos</title>
