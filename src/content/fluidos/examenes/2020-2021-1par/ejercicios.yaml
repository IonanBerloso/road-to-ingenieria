        <desc id="exflu2021p1-3-enun-d">A escala, con el agua dibujada a 2 metros, el calado de los apartados a) y e). A la izquierda, el agua sobre un fondo horizontal rayado que acaba en el punto A. La compuerta es la figura cerrada O, A, B: una recta de O a A, un arco de circunferencia de 6 metros de radio de A a B, con el centro en C, y una recta vertical de B a O. C, O y B están en la misma vertical, a la derecha: C un metro por debajo del nivel del fondo, O medio metro por debajo de C, y B cinco metros por encima del fondo. El arco sube desde A abombado hacia el agua, así que el agua empuja contra su cara convexa. Desde C salen tres rectas finas: una horizontal hacia la izquierda, otra a A y otra al punto donde la lámina corta el arco. El ángulo beta va de la horizontal a la recta CA y es constante; alfa, de CA a la recta de la lámina; theta, de esa recta a la vertical CB. Alfa y theta cambian con h. El centro de gravedad G está dentro del sector, a 4 metros de la vertical de O; su altura no la da el enunciado y no interviene. Cotas: h, del fondo a la lámina; R menos a, de A a B en vertical; a, del fondo a C; c, de C a O.</desc>
