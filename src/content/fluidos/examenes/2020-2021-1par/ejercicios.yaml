        <circle cx="160" cy="166" r="3.5" fill="var(--faint)"/>
        <text x="150" y="164" text-anchor="end" font-size="11" fill="var(--faint)">C</text>

        <line x1="160" y1="166" x2="270" y2="55" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="238" y="70" font-size="10.5" fill="var(--faint)">R = 6 m</text>

        <line x1="128" y1="140" x2="128" y2="166" stroke="var(--faint)" stroke-width="1"/>
        <line x1="122" y1="140" x2="160" y2="140" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="122" y1="166" x2="134" y2="166" stroke="var(--faint)" stroke-width="1"/>
        <text x="118" y="158" text-anchor="end" font-size="10" fill="var(--faint)">a = 1 m</text>
        <line x1="128" y1="166" x2="128" y2="179" stroke="var(--faint)" stroke-width="1"/>
        <line x1="122" y1="179" x2="134" y2="179" stroke="var(--faint)" stroke-width="1"/>
        <text x="118" y="186" text-anchor="end" font-size="10" fill="var(--faint)">c = 0,5 m</text>

        <line x1="424" y1="88" x2="424" y2="140" stroke="var(--live)" stroke-width="1"/>
        <line x1="418" y1="88" x2="430" y2="88" stroke="var(--live)" stroke-width="1"/>
        <line x1="418" y1="140" x2="430" y2="140" stroke="var(--live)" stroke-width="1"/>
        <text x="434" y="118" font-size="11" fill="var(--live)">h</text>
        <line x1="160" y1="10" x2="438" y2="10" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="436" y="24" text-anchor="end" font-size="10" fill="var(--faint)">h máxima = R − a = 5 m</text>

        <circle cx="264" cy="118" r="3.6" fill="var(--alt)"/>
        <text x="258" y="112" text-anchor="end" font-size="10" fill="var(--alt)">G</text>
        <line x1="160" y1="196" x2="264" y2="196" stroke="var(--alt)" stroke-width="1"/>
        <line x1="264" y1="190" x2="264" y2="202" stroke="var(--alt)" stroke-width="1"/>
        <text x="212" y="210" text-anchor="middle" font-size="10" fill="var(--alt)">xG = 4 m</text>
      </svg>
      <figcaption>

      El agua empuja contra la **cara convexa** del arco, así que su resultante
      pasa por C, no por O. Y como O no coincide con C —está medio metro más
      abajo—, ese empuje sí da momento respecto de la articulación: en eso
      consiste que la compuerta se abra sola, y el apartado f) pregunta qué
      pasaría si los dos puntos coincidieran.

      </figcaption>
      </figure>
    pide: Las fuerzas del agua sobre el arco, la reacción del apoyo y cuándo la compuerta se abre sola.

    pasos:
      - tipo: reconocer
        pregunta: |
          Todas las presiones sobre un arco circular pasan por su centro. ¿Qué
          simplifica eso aquí?
        opciones:
          - texto: >-
              Que la resultante del agua pasa por C, y su momento respecto de
              O es solo el de la componente horizontal con brazo $c$
            correcta: true
            mensaje: |
              Eso es, y es la clave del ejercicio. O está justo debajo de C, a
              distancia $c$. Una fuerza que pasa por C tiene, respecto de O,
              un brazo igual a $c$ **solo para su componente horizontal**: la
              vertical pasa por la misma vertical que O y no produce momento.
          - texto: >-
              Que la resultante del agua es nula
            mensaje: |
              No es nula en absoluto: son casi 59 kN horizontales a dos metros
              de calado. Lo que pasa es que su **línea de acción** está
              obligada a pasar por C.
          - texto: >-
              Que da igual dónde esté la articulación
            mensaje: |
              Daría igual solo si la articulación fuera el propio C, que es
              justamente lo que pregunta el apartado f). Como está en O,
              medio metro más abajo, sí hay momento.

      - tipo: calcular
        titulo: El centro de presiones de la fuerza horizontal
        pregunta: |
          Con $h = 2$ m, ¿a qué distancia de C está el centro de presiones de
          la componente horizontal, en metros?
        respuesta:
          tipo: numero
          valor: '1.67'
          tolerancia: 0.03
          formato: un número en metros
        distractores:
          - valor: '0.667'
            mensaje: |
              Esa es la altura del centro de presiones sobre el fondo, es
              decir sobre A. La pregunta lo mide **respecto de C**, que está un
              metro más abajo.
          - valor: '2.33'
            mensaje: |
              Has puesto C por encima del nivel del agua en vez de por debajo.
              C está a $a = 1$ m bajo el fondo.
        pista: |
          El centro de presiones de un prisma triangular está a un tercio de
          la base, y C está $a$ por debajo del fondo.
        desarrollo: |
          $$
          F_H = \gamma\,\frac{h}{2}\,h\,b = 9800\cdot 1\cdot 2\cdot 3
          = 58\,800\ \text{N}
          $$
          $$
          y_{cp} = \frac{h}{3} + a = 0{,}667+1 = 1{,}67\ \text{m}
          $$

      - tipo: calcular
        titulo: La reacción del apoyo con el embalse vacío
        pregunta: |
          Sin agua, ¿cuánto vale la reacción en A, en N?
        respuesta:
          tipo: magnitud
          valor: '19878 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '29400 N'
            mensaje: |
              Ese es el peso de la compuerta, $3000$ kg por $9{,}8$. La
              reacción es menor porque su brazo respecto de O —los 5,92 m que
              hay hasta A— es mayor que los 4 m del centro de gravedad.
          - valor: '117600 N'
            mensaje: |
              Ese es el momento del peso respecto de O, en $\text{N}\cdot$m.
              Falta dividirlo por el brazo de la reacción.
        pista: |
          Momentos respecto de O, con la masa total $1000\,b$ y el brazo de A
          igual a $\sqrt{R^{2}-a^{2}}$.
        desarrollo: |
          $$
          W = 1000\cdot 3\cdot 9{,}8 = 29\,400\ \text{N}
          \qquad
          \overline{OA}_x = \sqrt{6^{2}-1^{2}} = 5{,}916\ \text{m}
          $$
          $$
          A_y = \frac{29\,400\cdot 4}{5{,}916} = 19\,878\ \text{N}
          $$

      - tipo: calcular
        titulo: El calado al que la compuerta se abre sola
        pregunta: |
          ¿A qué altura de agua empieza a abrirse, en metros?
        respuesta:
          tipo: magnitud
          valor: '4 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '5 m'
            mensaje: |
              Ese es el calado **máximo** que puede alcanzar el agua según el
              enunciado. La compuerta se abre antes, cuando la reacción del
              apoyo llega a cero.
          - valor: '2.83 m'
            mensaje: |
              Parece que has usado el peso sin multiplicar por la anchura, o
              has olvidado el brazo. Con la masa total de 3.000 kg sale
              exactamente 4 m.
        pista: |
          La compuerta se abre cuando el apoyo deja de trabajar: $A_y = 0$.
        desarrollo: |
          $$
          A_y = 19\,878 - 1242\,h^{2}
          \qquad
          A_y = 0
          \;\Longrightarrow\;
          h = \sqrt{\frac{19\,878}{1242}} = 4{,}00\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza vertical del agua
        pregunta: |
          Con $h = 2$ m, ¿cuánto vale la componente vertical, en N?
        respuesta:
          tipo: magnitud
          valor: '17207 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58800 N'
            mensaje: |
              Esa es la componente **horizontal**. La vertical es mucho menor
              porque el arco, cerca de A, es casi vertical: su proyección
              horizontal a dos metros de calado mide solo 72 cm.
          - valor: '42336 N'
            mensaje: |
              Has tomado el volumen de agua sobre el arco como un rectángulo
              de $0{,}72\times 2$ m. El arco no es una recta: el volumen real
              es de $0{,}585\ \text{m}^{2}$ por metro de anchura, un 60 % del
              rectángulo.
        pista: |
          Es el peso del agua que hay **encima** del arco mojado, cuya
          proyección horizontal va de A hasta donde la superficie corta al
          arco.
        desarrollo: |
          El arco corta la superficie ($y = 2$) a $0{,}72$ m de A, y el área
          entre el arco y la superficie vale $0{,}585\ \text{m}^{2}$:

          $$
          F_V = 9800\cdot 0{,}585\cdot 3 = 17\,207\ \text{N}\ (\downarrow)
          $$

          con su centro de presiones a $5{,}70$ m de C.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La resultante del agua pasa por C, y como O está $c$ por debajo,
              solo la componente horizontal produce momento respecto de O.
          - texto: >-
              Ese momento vale $c\,\gamma h^{2}b/2$, así que crece con el
              cuadrado del calado y resta a la reacción del apoyo.
          - texto: >-
              De ahí $A_y = 19\,878 - 1242\,h^{2}$, que se anula en $h = 4$ m:
              ahí la compuerta se abre sola.
          - texto: >-
              **f)** Articulada en C, la compuerta se abriría antes, porque el
              brazo de la fuerza del agua sería mayor.
            trampa: true
            mensaje: |
              Articulada en C, el agua **no produciría ningún momento**: su
              resultante pasa exactamente por C, así que el brazo es cero, no
              mayor. La compuerta se quedaría cerrada siempre, sostenida por
              su propio peso, sea cual sea el nivel del agua. Es la respuesta
              del apartado f) y la lección del ejercicio.
    resolucion: |
      **La geometría, primero.** A está al nivel del fondo; C, un metro por
      debajo; O, medio metro por debajo de C. Con $R = 6$ y $a = 1$, la
      distancia horizontal de O a A es $\sqrt{36-1} = 5{,}916$ m. Y B queda
      cinco metros por encima del fondo, en la vertical de C.

      **a) La componente horizontal.** Con $h = 2$ m:

      $$
      F_H = \gamma\frac{h}{2}h\,b = 58\,800\ \text{N}
      \qquad
      y_{cp} = \frac{h}{3}+a = 1{,}67\ \text{m desde C}
      $$

      **b) y c) La reacción del apoyo.** Y aquí está la idea del ejercicio:
      todas las presiones sobre un arco circular pasan por su **centro**, así
      que la resultante del agua pasa por C. Como O está justo debajo de C, el
      brazo de esa resultante respecto de O es $c = 0{,}5$ m, **y solo para su
      componente horizontal**: la vertical comparte vertical con O y no
      produce momento.

      $$
      A_y\cdot 5{,}916 = W\,x_G - c\,F_H
      = 29\,400\cdot 4 - 0{,}5\cdot 14\,700\,h^{2}
      $$
      $$
      A_y = 19\,878 - 1242\,h^{2}
      $$

      | $h$ (m) | $A_y$ (N) |
      |---|---|
      | 0 | 19.878 |
      | 2 | 14.910 |
      | 5 | $-11.181$ |

      El valor negativo a 5 m no es un resultado físico: es la señal de que a
      esa altura la compuerta ya está abierta.

      **d) La apertura.** El apoyo solo puede empujar, así que la compuerta se
      abre cuando $A_y = 0$:

      $$
      h_{apertura} = \sqrt{\frac{19\,878}{1242}} = 4{,}00\ \text{m}
      $$

      **e) La componente vertical.** El arco corta la superficie a 72 cm de A,
      y el agua que descansa sobre él pesa

      $$
      F_V = 17\,207\ \text{N}\ (\downarrow)
      \qquad
      x_{cp} = 5{,}70\ \text{m desde C}
      $$

      **f) Y si estuviera articulada en C.** El agua no produciría **ningún**
      momento, porque su resultante pasa exactamente por C. La compuerta se
      quedaría cerrada siempre, con independencia del nivel del agua, y solo
      su peso decidiría. Esa es la razón de que las compuertas Taintor se
      articulen en el centro de curvatura: para que el empuje del embalse no
      cargue el mecanismo de accionamiento.

  # ── 4 (20 %) · Un depósito que se dilata al presurizarlo, y la presión
  #    manométrica dentro de la fórmula de dilatación.
  - id: exflu2021-1par-4-el-deposito-que-se-dilata
    titulo: El depósito que se dilata, y con qué fluido pesa más
    fuente: >-
      Ejercicio 4 · Primer parcial, 16 de abril de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea diseñar un depósito y el tejado en el que se va a colocar. Para
      ello es necesario conocer el peso máximo del depósito. El depósito está
      formado por un cilindro de longitud $L = 5$ m y dos semiesferas de radio
      $R = 1{,}5$ m. Se puede emplear para acumular dos fluidos diferentes:
      queroseno y gas butano.

      El camión de repostaje tiene la capacidad de llenar el depósito con la
      siguiente presión (la temperatura se mantiene constante a 20 ºC durante
      el proceso de carga):

      - Queroseno a 6080 cmcHg de presión **absoluta**.
      - Butano a 4 bar de presión.

      Al someter el depósito a presión, su volumen aumenta, y este aumento
      viene determinado por

      $$
      \frac{\Delta V}{V}\,(\%) = e^{P/100}-1
      $$

      donde la presión $P$ se expresa en bar. Se pide:

      **a)** Calcular la densidad de cada fluido cuando el depósito esté
      lleno.

      **b)** Razonar con qué fluido pesará más el depósito. Calcular dicho
      peso (kN), despreciando el peso del propio depósito.

      Datos: $p_{atm} = 990$ mbar;
      $\rho_{queroseno}$ (990 mbar, 20 ºC) $= 73{,}5\ \text{UTM/m}^{3}$;
      $K_{queroseno} = 2\cdot 10^{10}\ \text{dyn/cm}^{2}$;
      $M_{butano} = 58$ g/mol; $R = 0{,}082$ atm·l/(K·mol).
    pide: La densidad de cada fluido con el depósito lleno y el peso máximo del conjunto.

    pasos:
      - tipo: reconocer
        pregunta: |
          La fórmula de dilatación lleva una presión $P$ en bar. ¿Cuál de las
          dos, la absoluta o la manométrica?
        opciones:
          - texto: >-
              La manométrica, porque lo que deforma el depósito es la
              diferencia entre lo de dentro y lo de fuera
            correcta: true
            mensaje: |
              Eso es. Un depósito a la presión atmosférica por dentro y por
              fuera no se deforma nada, así que la fórmula tiene que dar cero
              ahí: la variable es la presión relativa. Con el queroseno son
              80,04 bar y no 81,03.
          - texto: >-
              La absoluta, porque es la que se da en el enunciado
            mensaje: |
              El enunciado da la absoluta para el queroseno y la manométrica
              para el butano precisamente para que las distingas. La
              deformación de una pared la produce el salto de presión a través
              de ella.
          - texto: >-
              Da igual, porque la atmosférica es pequeña frente a 80 bar
            mensaje: |
              Es pequeña, sí —un 1,2 %—, pero la fórmula es exponencial y ese
              1,2 % de presión se traduce en un cambio de volumen que a su vez
              cambia el peso. Y en el butano, con 4 bar, la atmósfera es la
              cuarta parte del total.

      - tipo: calcular
        titulo: La densidad del queroseno comprimido
        pregunta: |
          ¿Qué densidad tiene el queroseno con el depósito lleno, en kg/m³?
        respuesta:
          tipo: numero
          valor: '723.19'
          tolerancia: 1
          formato: un número en kilogramos por metro cúbico
        distractores:
          - valor: '720.3'
            mensaje: |
              Esa es la densidad **sin comprimir**, la de los 990 mbar. A 80
              bares el queroseno se comprime un 0,4 %, que son casi tres
              kilos por metro cúbico.
          - valor: '73.5'
            mensaje: |
              Te has dejado la conversión de UTM. Una unidad técnica de masa
              son $9{,}8$ kg, así que $73{,}5\ \text{UTM/m}^{3}$ son
              $720{,}3\ \text{kg/m}^{3}$.
        pista: |
          $\rho = \rho_0\,e^{\Delta p/K}$, con $K$ pasado de dyn/cm² a
          pascales y $\Delta p$ **manométrica**.
        desarrollo: |
          $$
          \rho_0 = 73{,}5\cdot 9{,}8 = 720{,}3\ \text{kg/m}^{3}
          \qquad
          K = 2\cdot 10^{10}\cdot 0{,}1 = 2\cdot 10^{9}\ \text{Pa}
          $$
          $$
          p_{abs} = 60{,}80\cdot 13{,}6\cdot 9800 = 81{,}03\ \text{bar}
          \qquad
          \Delta p = 80{,}04\ \text{bar}
          $$
          $$
          \rho = 720{,}3\,e^{8{,}004\cdot 10^{6}/2\cdot 10^{9}}
          = 723{,}19\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La densidad del butano
        pregunta: |
          ¿Y la del butano, en kg/m³?
        respuesta:
          tipo: magnitud
          valor: '11.89 kg/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '9.53 kg/m3'
            mensaje: |
              Has tomado los 4 bar como absolutos. Para el butano el enunciado
              dice «4 bar de presión» a secas, que son manométricos: la
              absoluta es $4{,}99$ bar.
          - valor: '58 kg/m3'
            mensaje: |
              Esa es la masa molar en gramos por mol. Para pasar a densidad
              hace falta la ley de los gases con la presión y la temperatura.
        pista: |
          $\rho = pM/(RT)$, con la presión **absoluta** y $T = 293$ K.
        desarrollo: |
          $$
          p_{abs} = 4+0{,}99 = 4{,}99\ \text{bar} = 4{,}925\ \text{atm}
          $$
          $$
          \rho = \frac{4{,}925\cdot 58}{0{,}082\cdot 293}
          = 11{,}89\ \text{g/l} = 11{,}89\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: El peso máximo del depósito lleno
        pregunta: |
          ¿Cuánto pesa el depósito con el fluido más pesado, en kN?
        respuesta:
          tipo: numero
          valor: '354.98'
          tolerancia: 1
          formato: un número en kilonewton
        distractores:
          - valor: '350.68'
            mensaje: |
              Te has dejado la dilatación del depósito. A 80 bares crece un
              1,23 %, y ese volumen de más lo ocupa queroseno: cuatro
              kilonewton.
          - valor: '6'
            mensaje: |
              Ese es el peso con **butano**, que es el otro caso. El gas pesa
              sesenta veces menos que el queroseno, así que el que dimensiona
              el tejado es el líquido.
        pista: |
          Volumen geométrico —cilindro más esfera— por el factor de
          dilatación, y por el peso específico del queroseno comprimido.
        desarrollo: |
          $$
          V = \pi R^{2}L + \tfrac43\pi R^{3} = 35{,}34+14{,}14
          = 49{,}48\ \text{m}^{3}
          $$
          $$
          \frac{\Delta V}{V} = e^{80{,}04/100}-1 = 1{,}227\ \%
          \qquad
          V' = 50{,}09\ \text{m}^{3}
          $$
          $$
          W = 723{,}19\cdot 9{,}8\cdot 50{,}09 = 354{,}98\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El queroseno se comprime un 0,4 % a 80 bares y pasa de 720,3 a
              723,19 kg/m³; el butano, como gas, da 11,89 kg/m³ a 4,99 bar
              absolutos.
          - texto: >-
              El depósito geométrico mide 49,48 m³, y a 80 bares se dilata un
              1,23 %.
          - texto: >-
              Con queroseno pesa 354,98 kN y con butano unos 6: el que
              dimensiona el tejado es el líquido.
          - texto: >-
              Como el queroseno se comprime, cabe más masa en el mismo
              depósito, y ese es el efecto que más pesa en el resultado.
            trampa: true
            mensaje: |
              Cabe más, sí, pero la compresión del líquido añade un 0,4 % y
              la **dilatación del depósito** un 1,23 %: el recipiente se abre
              tres veces más de lo que el líquido se encoge. De los cuatro
              kilonewton que separan el cálculo con y sin estos efectos, tres
              los pone la pared y uno el fluido.
    resolucion: |
      **a) Las dos densidades.**

      El **queroseno** es un líquido que se comprime. Con
      $\rho_0 = 73{,}5\ \text{UTM/m}^{3} = 720{,}3\ \text{kg/m}^{3}$,
      $K = 2\cdot 10^{9}$ Pa y una presión manométrica de $80{,}04$ bar
      —los 81,03 absolutos menos la atmósfera—:

      $$
      \rho = \rho_0\,e^{\Delta p/K} = 723{,}19\ \text{kg/m}^{3}
      $$

      El **butano** es un gas ideal, y sus «4 bar de presión» son
      manométricos:

      $$
      \rho = \frac{p\,M}{R\,T}
      = \frac{4{,}925\cdot 58}{0{,}082\cdot 293} = 11{,}89\ \text{kg/m}^{3}
      $$

      **b) El peso.** El depósito geométrico son 49,48 m³, pero a 80 bares se
      dilata:

      $$
      \frac{\Delta V}{V} = e^{80{,}04/100}-1 = 1{,}227\ \%
      \qquad
      V' = 50{,}09\ \text{m}^{3}
      $$
      $$
      W_{quer} = 723{,}19\cdot 9{,}8\cdot 50{,}09 = 354{,}98\ \text{kN}
      $$

      Con butano, el mismo depósito dilatado un 4 % pesaría unos **6 kN**:
      sesenta veces menos. **El tejado se dimensiona con el queroseno.**

      **Y las tres trampas de unidades, que es lo que este ejercicio cobra.**
      Los 73,5 son UTM y hay que multiplicar por 9,8. Los
      $2\cdot 10^{10}\ \text{dyn/cm}^{2}$ son $2\cdot 10^{9}$ Pa. Y las
      presiones vienen de dos maneras distintas a propósito: la del queroseno
      **absoluta** y la del butano **manométrica**, mientras que la fórmula de
      dilatación pide siempre la manométrica y la ley de los gases siempre la
      absoluta.
