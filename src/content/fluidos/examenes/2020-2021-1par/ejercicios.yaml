      <figcaption>

      Redibujada a escala y orientada como en el cuadernillo, con el agua a
      2 m. El arco es circular y cada presión es normal a él, así que la
      resultante del agua pasa por su centro C, no por O. Y como O no
      coincide con C —está medio metro más abajo—, ese empuje sí da momento
      respecto de la articulación: en eso consiste que la compuerta se abra
      sola, y el apartado f) pregunta qué pasaría si los dos puntos
      coincidieran.

      </figcaption>
      </figure>

      **Notas nuestras.** En la figura del cuadernillo el agua está a la
      izquierda, sobre un fondo horizontal que acaba en A. C está un metro
      por debajo de ese fondo, en la misma vertical que O y que B, y el arco
      sube desde A hasta B abombado hacia el agua. $\beta$ es el ángulo entre
      la horizontal que pasa por C y la recta CA, y por eso no cambia
      ($\sin\beta = a/R$); $\alpha$ va de CA a la recta que une C con el punto
      donde la lámina corta el arco, y $\theta$, de esa recta a la vertical
      CB. $x_G$ se mide desde la vertical de O; la altura de G no se da y no
      hace falta.
    pide: Las fuerzas del agua sobre el arco, la reacción del apoyo y cuándo la compuerta se abre sola.

    pasos:
      - tipo: reconocer
        pregunta: |
          Todas las presiones sobre un arco circular pasan por su centro. ¿Qué
          simplifica eso aquí?
        opciones:
          - texto: >-
              Que la resultante del agua pasa por C, y su momento respecto de
              O es solo el de la componente horizontal con brazo $c$
            correcta: true
            mensaje: |
              Eso es, y es la clave del ejercicio. O está justo debajo de C, a
              distancia $c$. Una fuerza que pasa por C tiene, respecto de O,
              un brazo igual a $c$ **solo para su componente horizontal**: la
              vertical pasa por la misma vertical que O y no produce momento.
          - texto: >-
              Que la resultante del agua es nula
            mensaje: |
              No es nula en absoluto: son casi 59 kN horizontales a dos metros
              de calado. Lo que pasa es que su **línea de acción** está
              obligada a pasar por C.
          - texto: >-
              Que da igual dónde esté la articulación
            mensaje: |
              Daría igual solo si la articulación fuera el propio C, que es
              justamente lo que pregunta el apartado f). Como está en O,
              medio metro más abajo, sí hay momento.

      - tipo: calcular
        titulo: El centro de presiones de la fuerza horizontal
        pregunta: |
          Con $h = 2$ m, ¿a qué distancia de C está el centro de presiones de
          la componente horizontal, en metros?
        respuesta:
          tipo: numero
          valor: '1.67'
          tolerancia: 0.03
          formato: un número en metros
        distractores:
          - valor: '0.667'
            mensaje: |
              Esa es la altura del centro de presiones sobre el fondo, es
              decir sobre A. La pregunta lo mide **respecto de C**, que está un
              metro más abajo.
          - valor: '2.33'
            mensaje: |
              Has puesto el centro de presiones a $2h/3$ **del fondo**. Está a
              $2h/3$ de profundidad, medido desde la lámina, que es lo mismo
              que $h/3$ sobre el fondo: el prisma es un triángulo con la base
              abajo, y el empuje se concentra donde la presión es mayor.
        pista: |
          El centro de presiones de un prisma triangular está a un tercio de
          la base, y C está $a$ por debajo del fondo.
        desarrollo: |
          $$
          F_H = \gamma\,\frac{h}{2}\,h\,b = 9800\cdot 1\cdot 2\cdot 3
          = 58\,800\ \text{N}
          $$
          $$
          y_{cp} = \frac{h}{3} + a = 0{,}667+1 = 1{,}67\ \text{m}
          $$

      - tipo: calcular
        titulo: La reacción del apoyo con el embalse vacío
        pregunta: |
          Sin agua, ¿cuánto vale la reacción en A, en N?
        respuesta:
          tipo: magnitud
          valor: '19878 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '29400 N'
            mensaje: |
              Ese es el peso de la compuerta, $3000$ kg por $9{,}8$. La
              reacción es menor porque su brazo respecto de O —los 5,92 m que
              hay hasta A— es mayor que los 4 m del centro de gravedad.
          - valor: '117600 N'
            mensaje: |
              Ese es el momento del peso respecto de O, en $\text{N}\cdot$m.
              Falta dividirlo por el brazo de la reacción.
        pista: |
          Momentos respecto de O, con la masa total $1000\,b$ y el brazo de A
          igual a $\sqrt{R^{2}-a^{2}}$.
        desarrollo: |
          $$
          W = 1000\cdot 3\cdot 9{,}8 = 29\,400\ \text{N}
          \qquad
          \overline{OA}_x = \sqrt{6^{2}-1^{2}} = 5{,}916\ \text{m}
          $$
          $$
          A_y = \frac{29\,400\cdot 4}{5{,}916} = 19\,878\ \text{N}
          $$

          Con agua, $A_y = 19\,878 - 1242\,h^{2}$: 14.909 N a los 2 m y
          $-11.181$ N a los 5 m.

      - tipo: dibujar
        consigna: |
          El gráfico esquemático del apartado c): la reacción $A_y$ en
          ordenadas, en N, frente al calado $h$ en abscisas, en m, con los tres
          puntos que pide el enunciado, $h = 0$, 2 y 5 m, unidos de forma
          cualitativa.
        comprueba:
          - punto: >-
              Los ejes con su magnitud y su unidad, $h$ (m) y $A_y$ (N), y los
              tres puntos con su valor: 19.878 N, 14.909 N y $-11.181$ N.
            porque: >-
              Es lo que el enunciado pide con todas las letras, «tomando como
              abscisas h (m) y como ordenadas Ay (N)», y «es suficiente
              representar los 3 puntos». Un gráfico sin los valores no
              demuestra que la función del b) esté bien.
          - punto: >-
              Una curva que baja cada vez más deprisa, una parábola con el
              vértice en $h = 0$, y no tres segmentos rectos.
            porque: >-
              $A_y = 19\,878 - 1242\,h^{2}$ baja con el cuadrado del calado,
              porque la fuerza horizontal crece con $h^{2}$ y su brazo
              respecto de O es siempre $c$. Unidos con rectas, los dos tramos
              quedan por debajo de la curva y el corte con el eje sale en
              3,7 m en vez de en 4.
          - punto: >-
              El corte con el eje de abscisas en $h = 4$ m, marcado como el
              calado de apertura.
            porque: >-
              Es el apartado d) leído en el gráfico: el apoyo solo puede
              empujar hacia arriba, y la compuerta se abre cuando su reacción
              llega a cero. Si el corte no cae en 4 m, algún valor de los tres
              puntos está mal.
          - punto: >-
              El tramo de 4 a 5 m señalado como no físico: a trazos o con una
              nota.
            porque: >-
              Los $-11.181$ N del enunciado son el valor de la función, no una
              reacción que el apoyo pueda dar, porque un apoyo no tira. A esa
              altura la compuerta ya se ha abierto, y el gráfico tiene que
              decirlo en vez de dibujar una reacción negativa como si fuera
              real.
        figura: |
          <svg viewBox="0 0 360 290" role="img" width="360" height="290" aria-labelledby="exflu2021p1-3-ay-t exflu2021p1-3-ay-d">
            <title id="exflu2021p1-3-ay-t">La reacción del apoyo A en función del calado h, con los tres puntos que pide el apartado c)</title>
            <desc id="exflu2021p1-3-ay-d">Una gráfica con el calado h en metros en abscisas, de 0 a 5, y la reacción Ay en newton en ordenadas. La curva es la parábola Ay = 19 878 − 1242·h al cuadrado: parte de 19 878 newton con el embalse vacío, baja cada vez más deprisa, pasa por 14 909 newton a los 2 metros, corta el eje en h = 4 metros y acaba en −11 181 newton a los 5 metros. Los tres puntos del enunciado están marcados con su valor. Desde h = 4 la curva va a trazos: ahí la reacción saldría negativa, un apoyo no puede tirar, y lo que dice ese tramo es que la compuerta ya se ha abierto.</desc>
