asignatura: fluidos
curso: '2020-2021'
convocatoria: primer-parcial
fecha: 16 de abril de 2021
# **Los cuatro ejercicios.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 14 a 16 (20 a 22 del PDF), y el primer **parcial** que
# entra en el corpus.
#
# Publica el resultado de cada apartado y no la resolución (`pdfEs:
# enunciado-con-resultados`); el del ejercicio 1 va en rojo detrás del
# enunciado, «TODAS LAS AFIRMACIONES ERAN FALSAS». No imprime reparto por
# competencia sino el porcentaje de cada ejercicio junto a su número,
# «1. (30%)»: van en `puntosImpresos` y suman 100; los ejercicios van sin
# `puntos`.
#
# Desde el 30 de septiembre de 2026 los cuatro enunciados son los del
# cuadernillo palabra por palabra, con lo que añadimos en «Notas nuestras».
# Habían perdido frases que puntúan: el «Razonar la respuesta» del 2 c), el
# gráfico que pide el 3 c) —«hacer un gráfico esquemático de esta
# función»— y la frase de los ángulos del 3. Y la figura de la compuerta
# estaba dibujada al revés, con el agua a la derecha: ahora va como la del
# cuadernillo, a escala.
#
# Es la convocatoria que obligó a tocar la capa compartida: la tabla
# `CONVOCATORIAS` de `content.config.ts` no tenía «parcial», y Fluidos
# tiene hasta tres por curso. Entraron tres filas —`primer-parcial`,
# `segundo-parcial` y `tercer-parcial`— y con ellas la URL, la abreviatura
# y el nombre largo se derivan solos, que es para lo que existe la tabla.
#
# Lo que este examen aporta al corpus:
#
# - **Seis afirmaciones falsas** (ej. 1), y las seis lo son por un motivo
#   distinto. Es el único ejercicio del corpus de Fluidos que se resuelve
#   entero razonando, sin una sola ecuación de partida, y el resultado impreso
#   dice que todas son falsas.
# - **La construcción adhesión-cohesión, comprobada al revés** (ej. 1d):
#   con ángulo de contacto de 90º sale $F_{coh}/F_{adh} = \sqrt{2}$, y no
#   $\sqrt{2}/2$ como afirma el enunciado. Es la tercera vez que la misma
#   construcción aparece en el cuadernillo, y la primera en que sirve para
#   **refutar** algo.
# - **Diseñar un micromanómetro eligiendo la pareja de líquidos** (ej. 2)
#   entre tres candidatos, con el esquema, la expresión deducida y la
#   sensibilidad con un milímetro.
# - **Una compuerta cuya resultante hidrostática pasa siempre por el centro
#   de curvatura** (ej. 3): el brazo respecto de la articulación es la
#   distancia c, y solo la componente horizontal produce momento. De ahí
#   sale una reacción que baja con el cuadrado del calado y se anula a los
#   4 m.
# - **Un depósito que se dilata al presurizarlo** (ej. 4), con la fórmula
#   de dilatación dada y la presión **manométrica** dentro de ella.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (30%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 30 }
    - { n: 2, puntos: 20 }
    - { n: 3, puntos: 30 }
    - { n: 4, puntos: 20 }

# `fuera` queda vacío: están los cuatro.

ejercicios:
  - id: exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas
    tema: t02-propiedades
  - id: exflu2021-1par-2-el-micromanometro-que-hay-que-disenar
    tema: t04-hidrostatica
  - id: exflu2021-1par-3-la-compuerta-que-se-abre-a-los-cuatro-metros
    tema: t07-fuerzas-superficies
  - id: exflu2021-1par-4-el-deposito-que-se-dilata
    tema: t03-estatica
