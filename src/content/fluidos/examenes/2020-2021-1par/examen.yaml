# **Los cuatro ejercicios.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, y el primer **parcial** que entra en el corpus.
#
# Porcentajes impresos: 30 / 20 / 30 / 20, sin reparto por competencia, así
# que van sin `puntos`.
#
# Es la convocatoria que obligó a tocar la capa compartida: la tabla
# `CONVOCATORIAS` de `content.config.ts` no tenía «parcial», y Fluidos
# tiene hasta tres por curso. Entraron tres filas —`primer-parcial`,
# `segundo-parcial` y `tercer-parcial`— y con ellas la URL, la abreviatura
# y el nombre largo se derivan solos, que es para lo que existe la tabla.
#
# Lo que este examen aporta al corpus:
#
# - **Seis afirmaciones falsas** (ej. 1), y las seis lo son por un motivo
#   distinto. Es el único ejercicio del corpus de Fluidos que se resuelve
#   entero razonando, sin una sola ecuación de partida, y el enunciado
#   avisa de que todas son falsas.
# - **La construcción adhesión-cohesión, comprobada al revés** (ej. 1d):
#   con ángulo de contacto de 90º sale $F_{coh}/F_{adh} = \sqrt{2}$, y no
#   $\sqrt{2}/2$ como afirma el enunciado. Es la tercera vez que la misma
#   construcción aparece en el cuadernillo, y la primera en que sirve para
#   **refutar** algo.
# - **Diseñar un micromanómetro eligiendo la pareja de líquidos** (ej. 2)
#   entre tres candidatos.
# - **Una compuerta cuya resultante hidrostática pasa siempre por el centro
#   de curvatura** (ej. 3): el brazo respecto de la articulación es la
#   distancia c, y solo la componente horizontal produce momento. De ahí
#   sale una reacción que baja con el cuadrado del calado y se anula a los
#   4 m.
# - **Un depósito que se dilata al presurizarlo** (ej. 4), con la fórmula
#   de dilatación dada y la presión **manométrica** dentro de ella.
pdf: examenes-2020-2025.pdf

