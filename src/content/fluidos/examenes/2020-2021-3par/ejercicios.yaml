      <figcaption>

      El esquema del cuadernillo, redibujado con las cotas a escala: la
      lámina de A en 15 m, la bomba en 21,75 y las boquillas en 25. La altura
      del paso de la tubería 2 por encima de B no la da el enunciado, y no
      cuenta: la curva solo ve las cotas de los dos extremos.

      </figcaption>
      </figure>

      La «gráfica adjunta», en la página siguiente del cuadernillo, es una
      hoja de catálogo con seis bombas, y no se reproduce; sí sus lecturas,
      tomadas de la imagen con su rejilla, y la gráfica redibujada con ellas.
      El panel de alturas va en m³/h, de 0 a 35, con una columna por m³/h y
      una fila cada 10 m: un píxel de la imagen son 0,32 m de altura. Debajo,
      un solo NPSH requerido para todas, en l/s, con una fila cada 2 m: ahí un
      píxel son 0,07 m. Las bombas son la 25/1, de 2,2 kW; la 25/2, de 4 kW;
      la 25/3, de 5,5 kW; la 25/4, de 7,5 kW; la 25/6, de 11 kW, y la 25/8, de
      15 kW. La hoja trae además escalas en galones por minuto y en pies, que
      no hacen falta.

      | Q (l/s) | 25/1 | 25/2 | 25/3 | 25/4 | 25/6 | 25/8 | NPSHr (m) |
      |---|---|---|---|---|---|---|---|
      | 0 | 20,0 | 41,1 | 62,6 | 83,4 | 124,4 | 164,9 | — |
      | 1 | 19,8 | 40,7 | 61,9 | 82,6 | 123,3 | 163,5 | — |
      | 2 | 19,5 | 40,1 | 61,0 | 81,3 | 121,5 | 161,2 | — |
      | 3 | 19,0 | 39,2 | 59,7 | 79,5 | 119,1 | 158,0 | 0,86 |
      | 4 | 18,5 | 38,1 | 58,0 | 77,3 | 115,9 | 153,9 | 1,13 |
      | 5 | 17,8 | 36,7 | 55,9 | 74,5 | 111,8 | 148,6 | 1,51 |
      | 6 | 16,9 | 34,9 | 53,2 | 70,9 | 106,6 | 141,8 | 2,04 |
      | 7 | 15,8 | 32,6 | 49,8 | 66,5 | 100,0 | 133,0 | 2,72 |
      | 8 | 14,4 | 29,9 | 45,8 | 61,0 | 91,9 | 122,3 | 3,51 |
      | 9 | 12,8 | 26,7 | 41,0 | 54,6 | 82,2 | 109,2 | 4,42 |
      | 9,72 | 11,4 | 24,1 | 37,1 | 49,4 | 74,3 | 98,7 | 5,14 |

      Las seis columnas del medio son la altura de cada bomba, en m; la última
      fila es el final de las curvas, 35 m³/h. El NPSH requerido empieza en
      2,1 l/s, con 0,7 m. *El impreso escribe «SI», sin tilde, en la
      condición del apartado d).*

      <figure class="figura-examen">
      <svg viewBox="0 0 340 436" role="img" width="340" height="436" aria-labelledby="ex2021p3-6-curvas-t ex2021p3-6-curvas-d">
        <title id="ex2021p3-6-curvas-t">Las seis bombas de la gráfica del cuadernillo y su NPSH requerido, redibujados de las lecturas</title>
        <desc id="ex2021p3-6-curvas-d">Redibujo de las lecturas de la gráfica del cuadernillo, en dos paneles con la misma escala de caudal. Arriba, la altura manométrica en metros frente al caudal en metros cúbicos por hora, de 0 a 35: seis curvas casi horizontales al principio y cada vez más caídas, una por bomba. De arriba abajo, la 25/8 de 15 kW arranca en unos 165 m y acaba en 99 m a 35 m³/h; la 25/6 de 11 kW, de 124 a 74 m; la 25/4 de 7,5 kW, de 83 a 49; la 25/3 de 5,5 kW, de 63 a 37; la 25/2 de 4 kW, de 41 a 24; y la 25/1 de 2,2 kW, de 20 a 11. Abajo, el NPSH requerido en metros frente al caudal en litros por segundo, de 0 a 10: una sola curva para todas, que empieza en 0,7 m a 2,1 l/s y sube cada vez más deprisa hasta 5,1 m a 9,7 l/s.</desc>
