ejercicios:
  # ── 1 (15 %) · Las máquinas hidráulicas de corrido, con penalización por
  #    error. Teoría pura.
  - id: exflu2021-3par-1-las-maquinas-hidraulicas-de-corrido
    titulo: Las máquinas hidráulicas de corrido, y lo que cuesta fallar
    fuente: >-
      Ejercicio 1 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica la tabla
      resuelta.
    nivel: examen
    enunciado: |
      Rellenar los huecos. **Tener en cuenta que cada respuesta errónea resta
      la misma puntuación que cada acierto.**

      Según el intercambio de energía las máquinas hidráulicas pueden ser
      ______ y ______. Ejemplo de las primeras son las ______ mientras que
      las ______ lo son de las segundas. Según el principio de
      funcionamiento, las máquinas pueden ser ______ y ______. Las primeras
      se basan en el ______ y las segundas, en el ______.

      En las turbobombas hay dos tipos de cierre: ______ y ______. Los
      ______ son empleados en el primer caso. En el segundo caso, sin
      embargo, se pueden emplear dos opciones: ______ y ______.

      Siendo el caudal pequeño y la altura elevada, la turbina ______ es la
      más adecuada. Los distintos elementos que componen este tipo de turbina
      son los siguientes: ______ y ______. En este caso la entrada del agua
      en el rodete es ______.

      En cualquier instalación de bombeo, la válvula de regulación se debe
      poner en el conducto de ______, ya que, de ponerla en la tubería de
      ______, el riesgo de ______ es mayor.
    pide: Las palabras que faltan, sabiendo que fallar cuesta lo mismo que acertar.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Según el intercambio de energía»: ¿qué distingue a una máquina
          motora de una generadora?
        opciones:
          - texto: >-
              Quién da energía a quién: la motora la recibe del fluido —una
              turbina— y la generadora se la entrega —una bomba—
            correcta: true
            mensaje: |
              Eso es, y conviene fijarse en que los nombres despistan: la
              **motora** es la que mueve algo, es decir la que **saca**
              energía del agua. La generadora genera energía **en el fluido**,
              no electricidad.
          - texto: >-
              El sentido de giro del rodete
            mensaje: |
              El sentido de giro no clasifica nada: una Francis y una bomba
              centrífuga pueden girar igual. Lo que las separa es la dirección
              en que viaja la energía.
          - texto: >-
              Si producen electricidad o la consumen
            mensaje: |
              Se le parece, pero la clasificación es hidráulica y no
              eléctrica: una bomba accionada por un motor diésel sigue siendo
              generadora, y una turbina que mueve una muela de molino sigue
              siendo motora.

      - tipo: calcular
        titulo: Los elementos de la turbina más adecuada
        pregunta: |
          Con caudal pequeño y altura elevada, ¿de cuántos elementos consta la
          turbina que toca?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Esos son los de una turbina de **reacción**: cámara espiral,
              antedistribuidor, distribuidor, rodete y tubo difusor. Con poco
              caudal y mucho salto la que toca es la Pelton, que es de acción
              y tiene solo dos.
          - valor: '3'
            mensaje: |
              Con tres seguramente estás contando el deflector aparte. El
              deflector forma parte del **inyector**, junto con la aguja: el
              conjunto es un solo elemento.
        pista: |
          Poco caudal y mucho salto es el terreno de las turbinas de acción.
        desarrollo: |
          La turbina es la **Pelton**, y consta de **inyector** y **rodete**.
          Dos. La entrada del agua en el rodete es **puntual**, por donde
          estén los inyectores.

      - tipo: justificar
        pregunta: Ordena las respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              Según el intercambio de energía: **motoras** y **generadoras**;
              turbinas las primeras, bombas las segundas.
          - texto: >-
              Según el principio de funcionamiento: **turbomáquinas** —que se
              basan en el teorema de Euler— y **máquinas de desplazamiento
              positivo**, que se basan en el principio de Pascal.
          - texto: >-
              El cierre puede ser **interno** —anillos laberínticos— o
              **externo**, con cierres mecánicos o cajas prensaestopas.
          - texto: >-
              La válvula de regulación se pone en la **aspiración**, porque
              ahí regula mejor el caudal.
            trampa: true
            mensaje: |
              Se pone en la **impulsión**, y por una razón que no es de
              regulación sino de cavitación: una válvula en la aspiración
              baja la presión a la entrada de la bomba y se come el NPSH
              disponible. En la impulsión estrangula igual de bien y no toca
              el NPSH. Es la única de las cuatro filas que tiene una
              consecuencia práctica inmediata, y por eso cae siempre.
    resolucion: |
      **La tabla completa.**

      | hueco | respuesta |
      |---|---|
      | intercambio de energía | **motoras** y **generadoras** |
      | ejemplos | turbinas las motoras, bombas las generadoras |
      | principio de funcionamiento | **turbomáquinas** y **máquinas de desplazamiento positivo** |
      | en qué se basan | teorema de **Euler** y principio de **Pascal** |
      | tipos de cierre | **interno** y **externo** |
      | cierre interno | anillos **laberínticos** |
      | cierre externo | **cierres mecánicos** y **cajas prensaestopas** |
      | poco caudal, mucho salto | **Pelton** |
      | sus elementos | **inyector** y **rodete** |
      | su admisión | **puntual** |
      | dónde va la válvula de regulación | en la **impulsión** |
      | por qué no en la otra | en la **aspiración** el riesgo de **cavitación** es mayor |

      **Los dos hilos que sostienen toda la tabla.** El primero: «motora» y
      «generadora» se refieren a la energía **del fluido**, no a la
      electricidad. Una turbina es motora porque le quita energía al agua;
      una bomba es generadora porque se la da.

      El segundo: las turbomáquinas trabajan por **variación de cantidad de
      movimiento** —de ahí Euler— y las de desplazamiento positivo por
      **transmisión de presión** —de ahí Pascal—. Todo lo demás se deduce:
      una turbomáquina necesita cierres porque el eje atraviesa una carcasa
      con fluido a presión, y una de desplazamiento positivo no puede
      regularse estrangulando porque el caudal no depende de la presión.

      **Y una advertencia sobre el formato.** Cada error resta lo mismo que
      acierta un acierto, así que dejar un hueco en blanco es **mejor** que
      rellenarlo a medias. Es la única situación del curso en la que no
      contestar es una estrategia.

  # ── 2 (15 %) · Un factor de paso medido con un manómetro en U, y dos
  #    cotas que son datos de sobra.
  - id: exflu2021-3par-2-el-factor-de-paso-de-la-valvula
    titulo: El factor de paso de la válvula, y las dos cotas que sobran
    fuente: >-
      Ejercicio 2 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se tiene en el laboratorio una válvula de asiento plano de diámetro $D$,
      cuya entrada está a cota $z_1$ y su salida a cota $z_2$. A través de la
      válvula circula un fluido de densidad relativa $s$. El caudal $Q$ se
      mide con un rotámetro de coeficiente $C_{rot}$. Un manómetro en U, con
      un fluido manométrico de densidad relativa $s_m$ ($s_m > s$), conectado
      entre la entrada y la salida de la válvula, marca una altura $R$. Se
      pide:

      **a)** Esquema de la instalación.

      **b)** Deducción de la expresión de las pérdidas en la válvula en
      función de $R$.

      **c)** Calcular el factor de paso de la válvula $k$, conociendo los
      siguientes datos: $D = 4{,}5$ cm, $z_1 = 0{,}15$ m, $z_2 = 0{,}18$ m,
      $s = 0{,}8$, $Q = 2800$ l/h, $C_{rot} = 0{,}958$, $s_m = 0{,}96$ y
      $R = 28$ cm.
    pide: La expresión de la pérdida en función de la lectura, y el factor de paso.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da las cotas de entrada y salida, $z_1$ y $z_2$.
          ¿Hacen falta?
        opciones:
          - texto: >-
              No: un manómetro diferencial mide directamente la diferencia de
              alturas **piezométricas**, con la cota ya dentro
            correcta: true
            mensaje: |
              Eso es. Al recorrer el tubo en U de un lado al otro, los
              términos de cota se cancelan solos y lo que queda es
              $R\,(s_m/s-1)$ metros de columna del fluido que circula. Los
              tres centímetros de desnivel entre entrada y salida son un dato
              de sobra.
          - texto: >-
              Sí: hay que sumarle los 3 cm de desnivel a la lectura
            mensaje: |
              Si hubiera que sumarlos, el manómetro no serviría de nada: para
              eso habría que medir la cota de los dos puntos con un nivel. La
              gracia del tubo en U es justamente que la cota se cancela.
          - texto: >-
              Sí: hacen falta para saber el sentido del flujo
            mensaje: |
              El sentido lo da la propia lectura del manómetro, que se
              desplaza hacia el lado de menor altura piezométrica. Y en
              cualquier caso el enunciado ya dice que el flujo va de la
              entrada a la salida.

      - tipo: calcular
        titulo: La pérdida en la válvula
        pregunta: |
          ¿Cuánta carga se pierde en la válvula, en metros de columna del
          fluido que circula?
        respuesta:
          tipo: numero
          valor: '0.056'
          tolerancia: 0.002
          formato: un número en metros
        distractores:
          - valor: '0.28'
            mensaje: |
              Esa es la lectura $R$ a secas. Hay que traducirla a columna del
              fluido que circula con el factor $s_m/s-1$, que aquí vale
              $0{,}2$: el manométrico es solo un 20 % más pesado.
          - valor: '0.336'
            mensaje: |
              Has usado $s_m/s$ en vez de $s_m/s - 1$. El «menos uno» está
              porque la columna de manométrico **sustituye** a una columna de
              fluido, no se le suma.
        pista: |
          $h_f = R\,(s_m/s - 1)$.
        desarrollo: |
          $$
          h_f = 0{,}28\Bigl(\frac{0{,}96}{0{,}8}-1\Bigr)
          = 0{,}28\cdot 0{,}2 = 0{,}056\ \text{m}
          $$

      - tipo: calcular
        titulo: El factor de paso
        pregunta: |
          ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '4.59'
            mensaje: |
              Te has dejado el coeficiente del rotámetro. Los 2.800 l/h son la
              **lectura**; el caudal real es $0{,}958$ veces esa, y como $k$
              va con el inverso del cuadrado de la velocidad, el error se
              nota.
          - valor: '25'
            mensaje: |
              Has usado la lectura $R$ como pérdida, sin traducirla a columna
              del fluido. Un $k$ de 25 sería una válvula casi cerrada.
        pista: |
          $h_f = k\,v^{2}/2g$, con el caudal **real**, que es la lectura por
          $C_{rot}$.
        desarrollo: |
          $$
          Q = 0{,}958\cdot\frac{2800}{3600\cdot 1000}
          = 7{,}451\cdot 10^{-4}\ \text{m}^{3}/\text{s}
          $$
          $$
          A = \frac{\pi\,0{,}045^{2}}{4} = 1{,}5904\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          v = 0{,}4685\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}0112\ \text{m}
          $$
          $$
          k = \frac{0{,}056}{0{,}0112} = 5{,}0
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro en U mide la diferencia de alturas piezométricas
              entre entrada y salida, y como el diámetro no cambia, esa
              diferencia **es** la pérdida.
          - texto: >-
              En metros del fluido que circula, la lectura vale
              $R\,(s_m/s-1) = 0{,}056$ m.
          - texto: >-
              Con el caudal real —la lectura del rotámetro por su
              coeficiente— la altura cinética es de 11,2 mm, así que
              $k = 5$.
          - texto: >-
              Las cotas $z_1$ y $z_2$ hacen falta para pasar de presión a
              altura piezométrica.
            trampa: true
            mensaje: |
              El manómetro ya da la diferencia de **alturas piezométricas**,
              cota incluida: al recorrerlo se cancelan solas. Los tres
              centímetros de desnivel están en el enunciado para comprobar que
              sabes que sobran, igual que los datos de más de otros
              ejercicios de este cuadernillo.
    resolucion: |
      **b) La expresión.** Un manómetro diferencial conectado entre dos puntos
      de una conducción mide la diferencia de **alturas piezométricas**
      $z + p/\gamma$. Al recorrer el tubo en U de un lado a otro, los términos
      de cota se cancelan y queda

      $$
      \Delta\Bigl(z+\frac{p}{\gamma}\Bigr)
      = R\Bigl(\frac{s_m}{s}-1\Bigr)
      $$

      Y como la válvula no cambia el diámetro, la altura cinética es la misma
      a los dos lados: esa diferencia **es** la pérdida.

      $$
      h_{f,válv} = R\Bigl(\frac{s_m}{s}-1\Bigr)
      $$

      **c) El número.**

      $$
      h_f = 0{,}28\cdot 0{,}2 = 0{,}056\ \text{m}
      \qquad
      \frac{v^{2}}{2g} = 0{,}0112\ \text{m}
      \qquad
      k = 5{,}0
      $$

      **Dos detalles que deciden el resultado.** El primero, que el caudal que
      hay que usar es el **real**, no la lectura del rotámetro: el
      coeficiente $0{,}958$ parece pequeño pero mueve el $k$ casi medio
      punto. El segundo, que los dos líquidos son casi iguales —0,96 frente a
      0,8— y por eso el aparato amplifica: 28 centímetros de lectura para
      cinco centímetros y medio de pérdida. Es la misma idea del
      micromanómetro, aquí puesta a trabajar sobre una válvula.

  # ── 3 (15 %) · Una válvula de retención que se cierra sola con el corte
  #    de luz, y la tubería que tiene que aguantarlo.
  - id: exflu2021-3par-3-la-valvula-de-retencion-y-el-corte-de-luz
    titulo: La válvula que se cierra sola cuando se va la luz
    fuente: >-
      Ejercicio 3 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Una instalación de bombeo está ubicada en una zona donde el corte en el
      suministro eléctrico sin previo aviso es frecuente. Cuando ocurre esto
      la bomba se para y el agua retorna por gravedad desde el depósito B al
      A, vaciándose el depósito B.

      Para evitarlo se ha decidido instalar una **válvula de retención** aguas
      abajo de la bomba, de clapeta. Cuando se bombea agua la válvula está
      abierta, pero cuando el flujo retorna en sentido contrario, el flujo
      cierra la válvula.

      Se desea estudiar la sobrepresión generada por golpe de ariete. La
      tubería es de acero ($k = 0{,}5$), de 600 mm de diámetro interior y 5 mm
      de espesor. La tensión de tracción admisible del acero es
      $\sigma = 2600\ \text{kg/cm}^{2}$. Si el caudal de retorno es
      $1{,}23\ \text{m}^{3}/\text{s}$ y el cierre de la válvula dura 5 s, se
      pide:

      **a)** Valor de la sobrepresión generada por golpe de ariete, en mca.

      **b)** Tensión de tracción a la que se somete la tubería de acero.
      ¿Aguantará la tubería?

      **c)** Razonar cuál será la presión mínima que alcanzará el flujo aguas
      abajo de la válvula.

      Ayuda: $a = 9900/\sqrt{48{,}3 + k\,D/e}$;
      $e = p\,D/(2\sigma)$; Allievi $\Delta H = a\,v/g$;
      Michaud $\Delta H = 2\,L\,v/(g\,t)$.

      En la figura, el tramo que va de la bomba al depósito B mide
      $L_2 = 2000$ m.
    pide: La sobrepresión del golpe de ariete, la tensión en la tubería y la depresión aguas abajo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de elegir entre Allievi y Michaud, ¿qué hay que comparar?
        opciones:
          - texto: >-
              El tiempo de cierre con el tiempo crítico $2L/a$, que es lo que
              tarda la onda en ir y volver
            correcta: true
            mensaje: |
              Eso es. Si la válvula termina de cerrarse **después** de que la
              onda vuelva reflejada, la reflexión alivia la sobrepresión y
              vale Michaud; si se cierra antes, no hay alivio y manda Allievi.
              Aquí $2L/a = 4{,}2$ s frente a 5 s de cierre: por poco, cierre
              lento.
          - texto: >-
              El caudal de retorno con el caudal de bombeo
            mensaje: |
              El caudal de retorno es el dato, 1,23 m³/s, y de él sale la
              velocidad. Lo que decide la fórmula es el tiempo, no el caudal.
          - texto: >-
              La presión estática con la sobrepresión
            mensaje: |
              Eso se compara **después**, para el apartado b). La elección de
              fórmula es previa y depende solo de los tiempos.

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿A qué velocidad viaja la onda de presión, en m/s?
        respuesta:
          tipo: magnitud
          valor: '951 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1425 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$ de la ayuda, que es el que
              tiene en cuenta que la tubería se deforma. Con 600 mm de
              diámetro y 5 de pared, ese término vale 60 frente a los 48,3 del
              agua: **más que el propio fluido**.
          - valor: '9900 m/s'
            mensaje: |
              Ese es el numerador de la fórmula, no el resultado. Ninguna onda
              de presión viaja a 9.900 m/s en agua.
        pista: |
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$, con $D/e = 120$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 120}}
          = \frac{9900}{\sqrt{108{,}3}} = 951\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          ¿Cuánto vale la sobrepresión, en mca?
        respuesta:
          tipo: magnitud
          valor: '355.12 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '422 mca'
            mensaje: |
              Has usado Allievi. El cierre dura 5 s y el tiempo crítico es
              4,2: la onda **sí** llega a volver, así que la sobrepresión se
              alivia y vale Michaud.
          - valor: '710 mca'
            mensaje: |
              Parece que has duplicado el resultado, o has usado la longitud
              con el factor 2 aplicado dos veces. El 2 de Michaud ya está en
              la fórmula.
        pista: |
          $v = Q/A$ con $D = 600$ mm, y Michaud con $L = 2000$ m y $t = 5$ s.
        desarrollo: |
          $$
          v = \frac{1{,}23}{0{,}2827} = 4{,}350\ \text{m/s}
          \qquad
          \frac{2L}{a} = 4{,}2\ \text{s} < 5\ \text{s}
          $$
          $$
          \Delta H = \frac{2\,L\,v}{g\,t}
          = \frac{2\cdot 2000\cdot 4{,}350}{9{,}8\cdot 5} = 355{,}12\ \text{mca}
          $$

      - tipo: calcular
        titulo: La tensión en la pared
        pregunta: |
          ¿A qué tensión de tracción se somete la tubería, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '2131 kg/cm2'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '4262 kg/cm2'
            mensaje: |
              Te has dejado el 2 del denominador. La fórmula es
              $\sigma = pD/(2e)$: la fuerza que abre el tubo se reparte entre
              **dos** paredes.
          - valor: '2600 kg/cm2'
            mensaje: |
              Esa es la tensión **admisible** del acero, el dato con el que
              hay que comparar. La de trabajo sale algo menor, y por eso la
              tubería aguanta.
        pista: |
          $\sigma = p\,D/(2e)$, con la presión de la sobrepresión.
        desarrollo: |
          $$
          p = 9800\cdot 355{,}12 = 3{,}48\ \text{MPa}
          $$
          $$
          \sigma = \frac{3{,}48\cdot 10^{6}\cdot 0{,}6}{2\cdot 0{,}005}
          = 208{,}8\ \text{MPa} = 2131\ \text{kg/cm}^{2}
          $$

          Frente a los 2600 admisibles: **aguanta**, con un 18 % de margen.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Aguas arriba de la válvula, el agua que sigue llegando se
              comprime y produce la sobrepresión de 355 m.
          - texto: >-
              Aguas abajo ocurre lo contrario: el agua se aleja y deja tras de
              sí una depresión.
          - texto: >-
              Esa depresión no puede pasar de la presión de vapor, así que en
              la práctica el mínimo es el vacío: $p_{min} = -p_{atm}$.
          - texto: >-
              Como la depresión está limitada, no supone ningún peligro para
              la instalación.
            trampa: true
            mensaje: |
              Está limitada en **magnitud** pero es de las cosas más
              peligrosas que le pueden pasar a una conducción: al llegar a la
              tensión de vapor el agua **cavita**, se forma una bolsa de vapor
              y cuando la columna vuelve y la colapsa se produce un segundo
              golpe, mucho más brusco que el primero. Y una tubería de pared
              fina puede colapsar por aplastamiento con solo una atmósfera de
              depresión exterior.
    resolucion: |
      **La situación.** Al irse la luz, la bomba se para y el agua de B baja
      por gravedad. La válvula de retención se cierra empujada por ese flujo
      inverso, y al cerrarse detiene una columna de dos kilómetros que baja a
      4,35 m/s. Eso es un golpe de ariete provocado por la propia protección.

      **a) La sobrepresión.** Primero la celeridad, que en una tubería de 600
      mm y 5 de pared está muy lejos de la del agua libre:

      $$
      a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 120}} = 951\ \text{m/s}
      $$

      El término de la tubería, 60, pesa **más** que el del agua, 48,3: la
      pared se deforma y absorbe parte del golpe.

      El tiempo crítico es $2L/a = 4{,}2$ s, y la válvula tarda 5 en cerrar:
      la onda llega a volver, así que el cierre es **lento** y vale Michaud.

      $$
      \Delta H = \frac{2Lv}{gt} = 355{,}12\ \text{mca}
      $$

      **b) La tensión.**

      $$
      \sigma = \frac{p\,D}{2e} = 2131\ \text{kg/cm}^{2} < 2600
      $$

      **Aguanta**, con un 18 % de margen. Un margen estrecho para una
      solicitación que se produce cada vez que se va la luz.

      **c) Aguas abajo.** Al cerrarse la válvula, el agua que ya la había
      pasado sigue su camino y deja tras de sí un hueco. La presión cae, y no
      puede caer indefinidamente: se detiene en la tensión de vapor, que a
      efectos prácticos es el **vacío**. Así que

      $$
      p_{min} = -p_{atm}
      $$

      **Y ahí está el riesgo real.** La depresión está acotada, sí, pero al
      llegar a la tensión de vapor el agua cavita: se forma una bolsa que,
      cuando la columna vuelve, se colapsa y produce un segundo golpe mucho
      más brusco que el primero. Proteger una impulsión contra el vaciado con
      una simple clapeta resuelve un problema y crea otro; por eso las
      instalaciones reales llevan además calderines, chimeneas de equilibrio o
      válvulas de alivio.

  # ── 4 (20 %) · Una tubería que se ha ido corroyendo, y tres regímenes
  #    distintos en tres apartados.
  - id: exflu2021-3par-4-la-tuberia-que-se-ha-corroido
    titulo: La tubería que se ha ido corroyendo, y los tres regímenes
    fuente: >-
      Ejercicio 4 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El trasvase de la figura representa una conducción de A a B por gravedad
      entre dos depósitos abiertos a la atmósfera, cuyas láminas superiores
      tienen un desnivel de 22 m. La longitud del tubo de **hierro
      galvanizado** es de 400 m y 250 mm de diámetro. La aducción es bastante
      antigua, y solamente han sido rehabilitados los elementos de unión entre
      los diferentes tramos del tubo y la propia válvula, pero el tubo de 400
      m es el original.

      Se tiene la sospecha de que el caudal ha ido descendiendo estos últimos
      años debido a la corrosión del hierro galvanizado, que ha aumentado la
      rugosidad del mismo.

      Por ello se mide el caudal actual de trasvase, que resulta ser de 120
      l/s. Considerando unas pérdidas menores de los elementos nuevos de unión
      de 8 m de longitud equivalente y un coeficiente de pérdidas de la
      válvula nueva (abierta) $k = 4$, se pide calcular por medio de la
      ecuación de **Darcy-Weisbach**:

      **a)** Rugosidad (cm) **actual** del tubo e indicar el comportamiento
      hidráulico.

      **b)** Si se colocase un tubo nuevo de hierro galvanizado
      ($\varepsilon = 0{,}015$ cm) de dimensiones idénticas, calcular el
      caudal de trasvase (l/s) e indicar el comportamiento hidráulico.

      **c)** Si se pone un tubo nuevo de polietileno de 250 mm y longitud
      idéntica, de rugosidad $\varepsilon = 0{,}0001$ cm, calcular el factor
      de paso necesario en la válvula para transportar 200 l/s.

      **d)** Indicar el rango de caudales (l/h) para los cuales no se sabría
      con total certeza si el flujo es laminar o turbulento.

      Datos: agua, $\rho = 1000\ \text{kg/m}^{3}$;
      $\nu = 1{,}02\cdot 10^{-6}\ \text{m}^{2}/\text{s}$.
    pide: La rugosidad actual, el caudal con tubo nuevo, el factor de paso con PE y el rango de transición.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a) sale un factor de fricción de 0,042 con
          $Re \approx 6\cdot 10^{5}$. ¿Qué régimen es ese?
        opciones:
          - texto: >-
              Turbulencia completa: con esa rugosidad el factor ya no depende
              del Reynolds, y se puede usar la asíntota rugosa de Colebrook
            correcta: true
            mensaje: |
              Eso es, y simplifica el cálculo: en el régimen rugoso el término
              $2{,}51/(Re\sqrt{f})$ es despreciable frente a
              $\varepsilon/3{,}7D$, y la rugosidad se despeja directamente sin
              iterar. Es lo que hace el examen, y por eso la respuesta dice
              «comportamiento rugoso».
          - texto: >-
              Laminar, porque el factor de fricción es alto
            mensaje: |
              Un factor alto no significa laminar. En laminar, $f = 64/Re$
              daría $10^{-4}$: cuatrocientas veces menos. Lo que hace grande
              este factor es una rugosidad de más de tres milímetros.
          - texto: >-
              Transición, porque el Reynolds no es lo bastante grande
            mensaje: |
              La frontera del régimen rugoso no la marca el Reynolds solo sino
              su producto con la rugosidad relativa. Con
              $\varepsilon/D \approx 0{,}013$, seiscientos mil es de sobra.

      - tipo: calcular
        titulo: La rugosidad actual
        pregunta: |
          ¿Qué rugosidad tiene hoy el tubo, en cm?
        respuesta:
          tipo: numero
          valor: '0.3316'
          tolerancia: 0.005
          formato: un número en centímetros
        distractores:
          - valor: '0.015'
            mensaje: |
              Esa es la del tubo **nuevo**, la del apartado b). La corrosión la
              ha multiplicado por veintidós.
          - valor: '0.0332'
            mensaje: |
              Te has dejado un factor diez, probablemente al pasar de metros a
              centímetros. La rugosidad actual son más de tres milímetros.
        pista: |
          De los 22 m disponibles, resta la pérdida de la válvula y despeja
          $f$; después, la asíntota rugosa
          $1/\sqrt{f} = -2\log(\varepsilon/3{,}7D)$.
        desarrollo: |
          $$
          v = \frac{0{,}12}{0{,}04909} = 2{,}445\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}3049\ \text{m}
          $$
          $$
          22 = f\,\frac{408}{0{,}25}\,0{,}3049 + 4\cdot 0{,}3049
          \;\Longrightarrow\;
          f = 0{,}04181
          $$
          $$
          \frac{1}{\sqrt{f}} = -2\log\frac{\varepsilon}{3{,}7\,D}
          \;\Longrightarrow\;
          \varepsilon = 0{,}3316\ \text{cm}
          $$

      - tipo: calcular
        titulo: El caudal con el tubo nuevo
        pregunta: |
          Con un tubo nuevo de hierro galvanizado, ¿cuánto trasvasaría, en
          l/s?
        respuesta:
          tipo: magnitud
          valor: '176.46 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '120 l/s'
            mensaje: |
              Ese es el caudal **actual**, con el tubo corroído. Cambiarlo
              recupera un 47 % de capacidad.
          - valor: '200 l/s'
            mensaje: |
              Ese es el caudal del apartado c), que solo se alcanza con
              polietileno. El hierro galvanizado nuevo se queda en 176.
        pista: |
          La misma ecuación con $\varepsilon = 0{,}015$ cm, iterando: ahora el
          régimen ya no es rugoso.
        desarrollo: |
          Tanteando con Colebrook —el punto cae en la **zona de transición**,
          «semi-liso»— converge en $f = 0{,}0179$ y

          $$
          Q = 176{,}46\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal máximo del que aún se duda
        pregunta: |
          ¿Cuál es el caudal más alto para el que todavía no se sabe con
          certeza si el flujo es laminar o turbulento, en l/h?
        respuesta:
          tipo: magnitud
          valor: '2880 l/h'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1440 l/h'
            mensaje: |
              Ese es el extremo **inferior** del intervalo, el que corresponde
              a $Re = 2000$. Por debajo de ahí el flujo es laminar con
              seguridad.
          - valor: '4000 l/h'
            mensaje: |
              4.000 es el **Reynolds** del límite superior, no el caudal. Para
              pasar de uno a otro hay que multiplicar por $\nu A/D$.
        pista: |
          La zona de incertidumbre va de $Re = 2000$ a $Re = 4000$, y
          $Q = Re\,\nu\,A/D$.
        desarrollo: |
          $$
          Q = Re\,\frac{\nu A}{D}
          = 4000\cdot\frac{1{,}02\cdot 10^{-6}\cdot 0{,}04909}{0{,}25}
          = 8\cdot 10^{-4}\ \text{m}^{3}/\text{s}
          $$

          es decir $0{,}8$ l/s $= 2880$ l/h. Y el extremo inferior, con
          $Re = 2000$, son 1.440 l/h.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el tubo corroído el punto cae en régimen **rugoso**, y la
              rugosidad se despeja sin iterar: 0,3316 cm.
          - texto: >-
              Con el tubo nuevo de hierro galvanizado el punto baja a la
              **zona de transición**, hay que iterar Colebrook, y el caudal
              sube a 176,46 l/s.
          - texto: >-
              Con polietileno el tubo es hidráulicamente **liso**, y para
              limitar el caudal a 200 l/s hace falta una válvula con
              $k = 7$.
          - texto: >-
              Los tres apartados usan la misma fórmula, así que el régimen
              hidráulico es un detalle sin consecuencias prácticas.
            trampa: true
            mensaje: |
              La fórmula de Darcy es la misma, pero **el coeficiente sale de
              tres sitios distintos**: la asíntota rugosa en a), Colebrook
              completo en b) y la asíntota lisa en c). Y no es un detalle: en
              a) permite despejar la rugosidad de una vez, mientras que en b)
              obliga a iterar. Identificar el régimen es lo que decide cuánto
              trabajo cuesta el problema.
    resolucion: |
      **a) La rugosidad de hoy.** De los 22 metros de desnivel, la válvula se
      lleva 1,22 y el resto es rozamiento sobre 408 metros equivalentes:

      $$
      f = 0{,}04181
      $$

      Un factor tan alto con $Re \approx 6\cdot 10^{5}$ solo puede venir de
      una rugosidad grande: el punto está en **turbulencia completa**, donde
      $f$ ya no depende del Reynolds. Eso permite despejar directamente:

      $$
      \frac{1}{\sqrt{f}} = -2\log\frac{\varepsilon}{3{,}7D}
      \qquad
      \varepsilon = 0{,}3316\ \text{cm}
      $$

      **Veintidós veces la del tubo nuevo.** La sospecha era fundada.

      **b) Con tubo nuevo.** Con $\varepsilon = 0{,}015$ cm el punto baja a la
      **zona de transición** y hay que iterar Colebrook. Sale $f = 0{,}0179$ y

      $$
      Q = 176{,}46\ \text{l/s}
      $$

      un **47 % más** de capacidad solo por cambiar el tubo.

      **c) Con polietileno.** Ahora la tubería es hidráulicamente **lisa**, y
      con 200 l/s el rozamiento se queda en 16 metros de los 22. Los seis que
      sobran hay que quemarlos en la válvula:

      $$
      k = 7{,}0
      $$

      **d) La zona de duda.** Entre $Re = 2000$ y $Re = 4000$:

      $$
      1440\ \text{l/h} < Q < 2880\ \text{l/h}
      $$

      **Lo que enseña el conjunto.** Los cuatro apartados son la misma
      ecuación con el coeficiente de fricción sacado de tres sitios distintos.
      Y la lección de explotación está en los números: una conducción de
      hierro galvanizado que ha perdido un tercio de su caudal no está
      averiada ni obstruida —está **rugosa**—, y el diagnóstico se hace
      midiendo el caudal y despejando la rugosidad, sin abrir nada.

  # ── 5 (15 %) · Una red de canales construida con losas cuadradas: toda la
  #    geometría depende de un solo parámetro.
  - id: exflu2021-3par-5-la-red-de-canales-de-losas-cuadradas
    titulo: La red de canales hecha con losas cuadradas
    fuente: >-
      Ejercicio 5 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un pequeño municipio trabaja en el diseño de un plan de
      autoabastecimiento energético. Una de las opciones es la rehabilitación
      de una instalación compuesta por una red de canales y una pequeña
      central hidroeléctrica que cayó en desuso hace décadas.

      La geometría del canal es **triángulo más rectángulo**, habiendo sido
      construido íntegramente por losas prefabricadas cuadradas de lado $L$ de
      **hormigón en bruto**: dos losas verticales forman las paredes y otras
      dos, inclinadas, forman la V del fondo. La red consta de tres ramales:
      R1 y R2 bajan por sendos valles y se juntan para alcanzar la central por
      el ramal principal R0.

      | ramal | $z_i$ (m) | $z_f$ (m) | $L_{tot}$ (km) |
      |---|---|---|---|
      | R0 | 500 | 400 | 20 |
      | R1 | 559 | 500 | 12 |
      | R2 | ?? | 500 | 14 |

      **a)** Si el caudal máximo registrado fue de $Q = 3000$ l/s y en dicha
      situación el ramal R0 trabajaba en su máxima capacidad, estimar el valor
      de $L$ y seleccionar la talla comercial si estas se construían en
      intervalos de 10 cm.

      **b)** Sabiendo que el ramal R1 aportaba ⅔ del caudal y la lámina libre
      superaba la parte triangular, deducir el calado $H$ en dicho canal.

      **c)** Si el restante ⅓ aportado por R2 no superaba la parte triangular,
      calcular la cota mínima de partida del ramal R2.

      **d)** Si se sustituyera R0 por uno nuevo semicircular de hormigón
      acabado, manteniendo una berma de seguridad del 15 % del diámetro,
      seleccionar el diámetro comercial si están disponibles cada 50 cm.
    pide: El lado de la losa, el calado de R1, la cota de arranque de R2 y el diámetro de la media caña.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las losas son **cuadradas de lado $L$** y forman toda la sección.
          ¿Qué implica eso para la geometría?
        opciones:
          - texto: >-
              Que la sección entera depende de un solo parámetro: las dos
              paredes miden $L$, la V la forman dos losas de lado $L$ y la
              boca mide $L$
            correcta: true
            mensaje: |
              Eso es, y es lo que hace resoluble el apartado a). Con la boca
              de anchura $L$ y las dos losas de la V de longitud $L$ cada una,
              la V tiene medio ancho $L/2$ y profundidad $L\sqrt{3}/2$: un
              triángulo equilátero. Toda la sección queda en función de $L$.
          - texto: >-
              Que el canal es cuadrado
            mensaje: |
              Cuadradas son las **losas**, no la sección. La sección es un
              rectángulo con una V debajo, y para construirla hacen falta
              cuatro losas.
          - texto: >-
              Que hay que suponer la profundidad de la V
            mensaje: |
              No hay que suponerla: sale de la geometría. Si la boca mide $L$
              y cada losa inclinada mide $L$, el triángulo tiene los tres
              lados iguales y su altura es $L\sqrt{3}/2$.

      - tipo: calcular
        titulo: El lado de la losa
        pregunta: |
          ¿Cuánto mide el lado $L$ de las losas, en cm?
        respuesta:
          tipo: numero
          valor: '95.34'
          tolerancia: 0.5
          formato: un número en centímetros
        distractores:
          - valor: '100'
            mensaje: |
              Ese es el tamaño **comercial**, el que hay que pedir. El cálculo
              exacto da 95,34 cm, y como las losas van de 10 en 10 se compra
              la de un metro.
          - valor: '86.6'
            mensaje: |
              Parece que has dado la profundidad de la V, que vale
              $L\sqrt{3}/2$. La pregunta es el lado de la losa.
        pista: |
          Sección llena: $A = 1{,}433L^{2}$ y $P = 4L$, con
          $n = 0{,}015$ y $J = 100/20000$.
        desarrollo: |
          La V es un triángulo equilátero de lado $L$: área
          $\sqrt{3}L^{2}/4 = 0{,}433L^{2}$ y dos lados mojados de longitud
          $L$. Encima, el rectángulo $L\times L$ con dos paredes de $L$.

          $$
          A = 1{,}433\,L^{2}
          \qquad
          P = 4L
          \qquad
          R_h = 0{,}3583\,L
          $$
          $$
          Q = \frac{1{,}433}{0{,}015}\,(0{,}3583L)^{2/3}\sqrt{0{,}005}\;L^{2}
          = 3{,}408\,L^{8/3} = 3
          $$
          $$
          L = 0{,}9534\ \text{m}
          \;\longrightarrow\;
          L_{com} = 1\ \text{m}
          $$

      - tipo: calcular
        titulo: El calado del ramal R1
        pregunta: |
          Con la losa comercial de 1 m y ⅔ del caudal, ¿cuánto vale el calado
          $H$ en R1, en metros?
        respuesta:
          tipo: numero
          valor: '1.365'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '0.866'
            mensaje: |
              Esa es la profundidad de la V, es decir el calado al que la
              lámina llega justo al vértice del rectángulo. El enunciado dice
              que la **supera**.
          - valor: '0.499'
            mensaje: |
              Esa es la parte del calado que queda **dentro del rectángulo**.
              El calado total incluye además los 0,866 m de la V.
        pista: |
          Con $y$ la parte por encima de la V: $A = 0{,}433+y$ y
          $P = 2+2y$, y $J = 59/12000$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}015}\,(0{,}433+y)
          \Bigl(\frac{0{,}433+y}{2+2y}\Bigr)^{2/3}\sqrt{4{,}917\cdot 10^{-3}}
          = 2
          $$
          $$
          y = 0{,}499\ \text{m}
          \qquad
          H = 0{,}866+0{,}499 = 1{,}365\ \text{m}
          $$

      - tipo: calcular
        titulo: La cota de arranque del ramal R2
        pregunta: |
          ¿A qué cota mínima debe arrancar R2, en metros?
        respuesta:
          tipo: numero
          valor: '629.23'
          tolerancia: 0.5
          formato: un número en metros
        distractores:
          - valor: '559'
            mensaje: |
              Esa es la cota de arranque de **R1**, que lleva el doble de
              caudal por un canal más corto. R2 lleva la mitad pero tiene que
              hacerlo sin salirse de la V, y eso le exige mucha más pendiente.
          - valor: '500'
            mensaje: |
              Esa es la cota de **llegada**, la del nudo con R0. La pregunta
              es dónde empieza.
        pista: |
          La cota mínima corresponde al calado máximo dentro de la V, es
          decir $0{,}866$ m; con él se despeja la pendiente y se multiplica
          por los 14 km.
        desarrollo: |
          Con el calado justo al borde de la V, $A = 0{,}433$,
          $P = 2$ y $R_h = 0{,}2165$ m:

          $$
          1 = \frac{0{,}433}{0{,}015}\,0{,}2165^{2/3}\sqrt{J}
          \;\Longrightarrow\;
          J = 9{,}23\cdot 10^{-3}
          $$
          $$
          z_i = 500 + 9{,}23\cdot 10^{-3}\cdot 14\,000 = 629{,}23\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro de la media caña
        pregunta: |
          ¿Qué diámetro comercial hay que instalar si se sustituye R0, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.5 m'
            mensaje: |
              El cálculo exacto da 1,983 m, y hacia abajo no vale: con 1,5 el
              canal no llevaría los 3 m³/s con la berma exigida.
          - valor: '2.5 m'
            mensaje: |
              Es el comercial siguiente al siguiente. Basta con 2 m, que ya
              supera los 1,983 calculados.
        pista: |
          Berma del 15 % del diámetro significa calado $y = 0{,}7R$, y ahora
          el hormigón es acabado, $n = 0{,}012$.
        desarrollo: |
          Con $y = 0{,}7R$ el ángulo mojado vale $2{,}532$ rad, y

          $$
          A = 0{,}980\,R^{2}
          \qquad
          R_h = 0{,}387\,R
          $$
          $$
          Q = 3{,}069\,R^{8/3} = 3
          \;\Longrightarrow\;
          R = 0{,}9915\ \text{m}
          \qquad
          D = 1{,}983\ \text{m}
          $$

          y el comercial, **2 m**.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las losas cuadradas hacen que la V sea un triángulo equilátero
              de lado $L$, y toda la sección quede en función de $L$.
          - texto: >-
              A sección llena y con la pendiente de R0, los 3 m³/s exigen
              $L = 95{,}34$ cm, así que se compra la losa de un metro.
          - texto: >-
              Con esa losa, R1 lleva sus 2 m³/s con 1,365 m de calado, y R2
              necesita arrancar en la cota 629,23 para llevar 1 m³/s sin
              salirse de la V.
          - texto: >-
              R2 arranca más alto que R1 porque lleva más caudal.
            trampa: true
            mensaje: |
              Lleva **la mitad**: 1 m³/s frente a 2. Lo que le obliga a
              arrancar setenta metros más alto es la restricción de que el
              agua no pase de la V, que le deja una sección de solo
              $0{,}433\ \text{m}^{2}$ —menos de la mitad que R1— y le exige
              casi el doble de pendiente. Una limitación de calado cuesta
              cota, y aquí cuesta setenta metros.
    resolucion: |
      **La geometría, que es media resolución.** Las losas son cuadradas de
      lado $L$ y forman las cuatro caras: dos verticales de altura $L$ y dos
      inclinadas que cierran la V. Como la boca mide $L$ y cada losa inclinada
      mide $L$, **la V es un triángulo equilátero**: profundidad
      $L\sqrt{3}/2 = 0{,}866L$ y área $\sqrt{3}L^{2}/4$.

      $$
      A = 1{,}433\,L^{2}
      \qquad
      P = 4L
      \qquad
      R_h = 0{,}3583\,L
      $$

      **a) El lado de la losa.** Con hormigón en bruto ($n = 0{,}015$),
      $J = 0{,}005$ y sección llena:

      $$
      3{,}408\,L^{8/3} = 3
      \qquad
      L = 95{,}34\ \text{cm}
      \;\longrightarrow\;
      L_{com} = 1\ \text{m}
      $$

      **b) El calado de R1.** Con la losa comercial, $J = 59/12000$ y
      2 m³/s, la lámina sube medio metro por encima de la V:

      $$
      H = 0{,}866+0{,}499 = 1{,}365\ \text{m}
      $$

      **c) La cota de R2.** Aquí la restricción es geométrica: el agua no
      puede pasar de la V. Eso deja una sección de solo
      $0{,}433\ \text{m}^{2}$, y para mover 1 m³/s por ella hace falta una
      pendiente de $9{,}23$ milésimas: casi el doble que la de R1.

      $$
      z_i = 500 + 9{,}23\cdot 10^{-3}\cdot 14\,000 = 629{,}23\ \text{m}
      $$

      **Setenta metros más alto que R1, llevando la mitad de caudal.** Esa es
      la lectura que hay que sacar: una limitación de calado se paga en cota,
      y aquí sale carísima.

      **d) La media caña.** Berma del 15 % del diámetro significa $y = 0{,}7R$,
      y el hormigón acabado baja $n$ a 0,012:

      $$
      D = 1{,}983\ \text{m}
      \;\longrightarrow\;
      D_{com} = 2\ \text{m}
      $$
