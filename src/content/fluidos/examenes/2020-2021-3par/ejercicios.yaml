            <text class="ex2021p3-2-esquema-l" x="274.8" y="151" text-anchor="start" fill="var(--ink)">R</text>
            <path class="ex2021p3-2-esquema-cota" d="M126.1 98.9L126.1 119.5"/>
            <path class="ex2021p3-2-esquema-punta" fill="var(--faint)" d="M126.1 119.5L128.1 114.9L124.1 114.9Z"/>
            <path class="ex2021p3-2-esquema-cota" d="M126.1 98.9L126.1 78.3"/>
            <path class="ex2021p3-2-esquema-punta" fill="var(--faint)" d="M126.1 78.3L124.1 82.9L128.1 82.9Z"/>
            <text class="ex2021p3-2-esquema-n" x="121.1" y="102.9" text-anchor="end" fill="var(--ink)">z1</text>
            <path class="ex2021p3-2-esquema-cotap" d="M304.5 70.1L326.5 70.1"/>
            <path class="ex2021p3-2-esquema-cota" d="M307.3 94.8L307.3 119.5"/>
            <path class="ex2021p3-2-esquema-punta" fill="var(--faint)" d="M307.3 119.5L309.3 114.9L305.3 114.9Z"/>
            <path class="ex2021p3-2-esquema-cota" d="M307.3 94.8L307.3 70.1"/>
            <path class="ex2021p3-2-esquema-punta" fill="var(--faint)" d="M307.3 70.1L305.3 74.7L309.3 74.7Z"/>
            <text class="ex2021p3-2-esquema-n" x="312.3" y="98.8" text-anchor="start" fill="var(--ink)">z2</text>
          </svg>
          <figcaption>El esquema a escala, en centímetros: la entrada de la válvula a 15 cm del plano de referencia y la salida a 18, el tubo de 4,5 cm, el rotámetro vertical antes de la válvula, y la U con el manométrico abajo y el menisco de la entrada 28 cm más bajo que el de la salida.</figcaption>
          </figure>

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: la expresión de la pérdida en la válvula en
          función de la lectura $R$, desde Bernoulli entre la entrada y la
          salida hasta $h_f = R\,(s_m/s - 1)$, recorriendo el manómetro rama a
          rama.
        rubrica:
          - punto: |
              **Bernoulli entre la entrada 1 y la salida 2**, con la pérdida
              de la válvula como incógnita, y la observación de que
              $v_1 = v_2$ porque el diámetro es el mismo a los dos lados.
            porque: |
              Es la definición de la pérdida de una pieza, $h_f = k\,v^{2}/2g$
              (diapositiva 4 del tema 19), escrita entre sus dos bordes. Sin
              igualar las velocidades, lo que mide el manómetro es una
              diferencia de alturas piezométricas y no todavía la pérdida:
              con dos diámetros distintos habría que sumarle la diferencia de
              alturas cinéticas.
            minimo: true
          - punto: |
              **El recorrido del manómetro**, de la toma 1 a la toma 2 rama a
              rama, con cada columna multiplicada por el peso específico de su
              líquido: el fluido que circula en las ramas y el manométrico,
              más pesado, en el fondo de la U.
            porque: |
              La diapositiva 18 del tema 4 da el manómetro diferencial como
              $P_1 - P_2 = g\,h\,(\rho_m - \rho)$, con las dos tomas a la
              misma altura. Aquí la entrada y la salida están a cotas
              distintas, y copiar esa fórmula sin recorrer la U confunde la
              diferencia de presiones con la de alturas piezométricas.
            minimo: true
          - punto: |
              **Las cotas se cancelan**: el recorrido da
              $\left(z_1 + p_1/\gamma\right) - \left(z_2 + p_2/\gamma\right)
              = R\,(s_m/s - 1)$, y en el resultado no aparecen ni $z_1$ ni
              $z_2$.
            porque: |
              Es lo que hace útil el aparato y lo que el apartado c) comprueba
              dando dos cotas que no hacen falta. Si en tu expresión final
              queda una $z$, el recorrido está mal hecho: alguna columna se ha
              contado con el líquido que no es.
            minimo: true
          - punto: |
              **La expresión final en metros de columna del fluido que
              circula**, $h_f = R\,(s_m/s - 1)$, con el «menos uno» explicado.
            porque: |
              La columna de manométrico sustituye a una de fluido, no se le
              suma. Con $s_m/s$ a secas, aquí sale 0,336 m en vez de 0,056:
              seis veces la pérdida. Y en metros de manométrico, o en metros
              de agua, el número no se puede dividir entre la $v^{2}/2g$ del
              fluido.
            minimo: true
          - punto: |
              **Qué pasaría con un manométrico más ligero**: la U iría
              invertida, por encima del tubo, y la pérdida sería
              $R\,(1 - s_m/s)$.
            porque: |
              El enunciado fija $s_m > s$, pero la ordinaria de 2024 (ejercicio
              8) pone el caso contrario, agua en una U invertida sobre un
              fluido de densidad relativa 1,2. Saber de dónde sale el signo
              es lo que evita memorizar dos fórmulas.
        veredicto: |
          Si tu folio tiene los cuatro primeros, tienes el apartado b). Si en
          tu expresión aparecen $z_1$ o $z_2$, vuelve a recorrer la U: con las
          cotas bien llevadas se cancelan, y por eso el apartado c) da dos
          cotas de sobra.

      - tipo: calcular
        titulo: La pérdida en la válvula
        pregunta: |
          ¿Cuánta carga se pierde en la válvula, en metros de columna del
          fluido que circula?
        respuesta:
          tipo: numero
          valor: '0.056'
          tolerancia: 0.002
          formato: un número en metros
        distractores:
          - valor: '0.28'
            mensaje: |
              Esa es la lectura $R$ a secas. Hay que traducirla a columna del
              fluido que circula con el factor $s_m/s-1$, que aquí vale
              $0{,}2$: el manométrico es solo un 20 % más pesado.
          - valor: '0.336'
            mensaje: |
              Has usado $s_m/s$ en vez de $s_m/s - 1$. El «menos uno» está
              porque la columna de manométrico **sustituye** a una columna de
              fluido, no se le suma.
        pista: |
          $h_f = R\,(s_m/s - 1)$.
        desarrollo: |
          $$
          h_f = 0{,}28\Bigl(\frac{0{,}96}{0{,}8}-1\Bigr)
          = 0{,}28\cdot 0{,}2 = 0{,}056\ \text{m}
          $$

      - tipo: calcular
        titulo: El factor de paso
        pregunta: |
          ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '4.59'
            mensaje: |
              Te has dejado el coeficiente del rotámetro. Los 2.800 l/h son la
              **lectura**; el caudal real es $0{,}958$ veces esa, y como $k$
              va con el inverso del cuadrado de la velocidad, el error se
              nota.
          - valor: '25'
            mensaje: |
              Has usado la lectura $R$ como pérdida, sin traducirla a columna
              del fluido. Un $k$ de 25 sería una válvula casi cerrada.
        pista: |
          $h_f = k\,v^{2}/2g$, con el caudal **real**, que es la lectura por
          $C_{rot}$.
        desarrollo: |
          $$
          Q = 0{,}958\cdot\frac{2800}{3600\cdot 1000}
          = 7{,}451\cdot 10^{-4}\ \text{m}^{3}/\text{s}
          $$
          $$
          A = \frac{\pi\,0{,}045^{2}}{4} = 1{,}5904\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          v = 0{,}4685\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}0112\ \text{m}
          $$
          $$
          k = \frac{0{,}056}{0{,}0112} = 5{,}0
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro en U mide la diferencia de alturas piezométricas
              entre entrada y salida, y como el diámetro no cambia, esa
              diferencia **es** la pérdida.
          - texto: >-
              En metros del fluido que circula, la lectura vale
              $R\,(s_m/s-1) = 0{,}056$ m.
          - texto: >-
              Con el caudal real —la lectura del rotámetro por su
              coeficiente— la altura cinética es de 11,2 mm, así que
              $k = 5$.
          - texto: >-
              Las cotas $z_1$ y $z_2$ hacen falta para pasar de presión a
              altura piezométrica.
            trampa: true
            mensaje: |
              El manómetro ya da la diferencia de **alturas piezométricas**,
              cota incluida: al recorrerlo se cancelan solas. Los tres
              centímetros de desnivel están en el enunciado para comprobar que
              sabes que sobran, igual que los datos de más de otros
              ejercicios de este cuadernillo.
    resolucion: |
      **a) El esquema.** La válvula en su tubería de diámetro $D$, el
      rotámetro vertical que mide el caudal, y el manómetro en U con una toma
      en la entrada y otra en la salida. Como $s_m > s$, la U cuelga por
      debajo del tubo con el manométrico en el fondo, y el menisco de la rama
      de la entrada queda más bajo: ahí la altura piezométrica es mayor.

      **b) La expresión.** Un manómetro diferencial conectado entre dos puntos
      de una conducción mide la diferencia de **alturas piezométricas**
      $z + p/\gamma$. Al recorrer el tubo en U de un lado a otro, los términos
      de cota se cancelan y queda

      $$
      \Delta\Bigl(z+\frac{p}{\gamma}\Bigr)
      = R\Bigl(\frac{s_m}{s}-1\Bigr)
      $$

      Y como la válvula no cambia el diámetro, la altura cinética es la misma
      a los dos lados: esa diferencia **es** la pérdida.

      $$
      h_{f,\text{válv}} = R\Bigl(\frac{s_m}{s}-1\Bigr)
      $$

      **c) El número.**

      $$
      h_f = 0{,}28\cdot 0{,}2 = 0{,}056\ \text{m}
      \qquad
      \frac{v^{2}}{2g} = 0{,}0112\ \text{m}
      \qquad
      k = 5{,}0
      $$

      **Dos detalles que deciden el resultado.** El primero, que el caudal que
      hay que usar es el **real**, no la lectura del rotámetro: el
      coeficiente $0{,}958$ parece pequeño pero mueve el $k$ casi medio
      punto. El segundo, que los dos líquidos son casi iguales —0,96 frente a
      0,8— y por eso el aparato amplifica: 28 centímetros de lectura para
      cinco centímetros y medio de pérdida. Es la misma idea del
      micromanómetro, aquí puesta a trabajar sobre una válvula.

      Es la práctica 22 del laboratorio con números, y el tema 19 la cuenta
      entera en [Factor de paso y longitud equivalente de una
      válvula](/road-to-ingenieria/fluidos/t19-conducciones/#factor-de-paso-y-longitud-equivalente-de-una-válvula).

  # ── 3 (15 %) · Una válvula de retención que se cierra sola con el corte
  #    de luz, y la tubería que tiene que aguantarlo.
  - id: exflu2021-3par-3-la-valvula-de-retencion-y-el-corte-de-luz
    titulo: La válvula que se cierra sola cuando se va la luz
    fuente: >-
      Ejercicio 3 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La instalación de bombeo de la figura está ubicada en una zona donde el
      corte en el suministro eléctrico sin previo aviso es frecuente. Cuando
      ocurre esto la bomba se para y el agua retorna por gravedad desde el
      depósito B al A, vaciándose el depósito B.

      Para evitar el vaciado del depósito B, se ha decidido instalar una
      válvula de retención aguas abajo de la bomba, (de clapeta, como la
      mostrada en la figura adjunta). Cuando se bombea agua la válvula está
      abierta, pero cuando el flujo retorna en el sentido contrario, el flujo
      cierra la válvula.

      Se desea estudiar la sobrepresión generada por golpe de ariete. La
      tubería es de acero ($k = 0{,}5$), de 600 mm de diámetro interior y 5 mm
      de espesor. La tensión de tracción admisible del acero es
      $\sigma = 2600\ \text{kg/cm}^{2}$. Sí el caudal de retorno es
      $1{,}23\ \text{m}^{3}/\text{s}$ y el cierre de la válvula dura 5 s, se
      pide:

      **a)** Valor de la sobrepresión generada por golpe de ariete, en mca.

      **b)** Tensión de tracción a la que se somete a la tubería de acero.
      ¿Aguantará la tubería?

      **c)** Razonar cuál será la presión mínima que alcanzará el flujo aguas
      abajo de la válvula.

      **Ayuda**:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + \dfrac{k\cdot D}{e}}}
      \qquad\qquad
      e = \frac{P\cdot D}{2\cdot\sigma}
      $$

      Allievi → $\Delta H = a\cdot v/g$

      Micheaud → $\Delta H = 2\cdot L\cdot v/g\cdot t$

      **Notas nuestras.** La figura del cuadernillo, redibujada abajo, es el
      esquema de la instalación: el depósito A con su lámina en la cota
      10 m, la tubería 1, de 100 m, hasta la bomba P, en la cota 6 m, y la
      tubería 2, de 2000 m, hasta el depósito B, en la cota 50 m. La válvula de
      retención no está dibujada en ese esquema; la hemos puesto donde dice el
      texto, aguas abajo de la bomba. La «figura adjunta» de la válvula son
      dos cortes de una válvula de retención de clapeta —abierta, con el flujo
      levantando la clapeta, y cerrada, con el flujo en sentido contrario
      apretándola contra su asiento— y una foto de una de ellas: no se
      reproducen. *El impreso escribe «Sí el caudal», con tilde, por «Si»;
      «Micheaud» por Michaud; y la fórmula de Michaud como
      $2\cdot L\cdot v/g\cdot t$, con el tiempo de cierre dividiendo:
      $\Delta H = 2Lv/(g\,t)$.*

      <figure class="figura-examen">
      <svg viewBox="-14 22 486 212" role="img" width="440" height="192"
           aria-labelledby="fv3t fv3d">
        <title id="fv3t">La instalación de bombeo de A a B, con la válvula de retención</title>
        <desc id="fv3d">Una instalación de bombeo entre dos depósitos. El
        depósito A está abajo a la izquierda, con su lámina en la cota diez
        metros. De él sale la tubería 1, de cien metros, que baja hasta la
        bomba P, situada en la cota seis. De la bomba arranca la tubería 2, de
        dos mil metros, que sube hasta el depósito B, en la cota cincuenta.
        Justo aguas abajo de la bomba se ha instalado una válvula de retención
        de clapeta: deja pasar el agua cuando la bomba impulsa y se cierra sola
        si el flujo se invierte, que es lo que ocurre cuando se va la luz.</desc>

        <rect x="60" y="176" width="72" height="30" fill="var(--live)" fill-opacity=".2"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="60" y1="176" x2="132" y2="176" stroke="var(--live)" stroke-width="1.4"/>
        <text x="96" y="198" text-anchor="middle" font-size="12" fill="var(--ink)">A</text>

        <rect x="344" y="40" width="72" height="30" fill="var(--live)" fill-opacity=".2"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="344" y1="40" x2="416" y2="40" stroke="var(--live)" stroke-width="1.4"/>
        <text x="380" y="62" text-anchor="middle" font-size="12" fill="var(--ink)">B</text>

        <path d="M132 196 L214 190" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M246 186 L344 62" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <circle cx="230" cy="188" r="14" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="230" y="193" text-anchor="middle" font-size="12" fill="var(--ink)">P</text>
        <path d="M216 202 L244 202" stroke="var(--ink)" stroke-width="2"/>
        <g stroke="var(--faint)" stroke-width="1">
          <path d="M218 202 L214 208 M226 202 L222 208 M234 202 L230 208 M242 202 L238 208"/>
        </g>

        <path d="M262 172 L274 158" stroke="var(--flag)" stroke-width="3" stroke-linecap="round"/>
        <text x="284" y="164" font-size="10" fill="var(--flag)">válvula de retención</text>

        <text x="176" y="166" text-anchor="middle" font-size="11" fill="var(--faint)">1</text>
        <text x="176" y="180" text-anchor="middle" font-size="10.5" fill="var(--faint)">L₁ = 100 m</text>
        <text x="308" y="122" font-size="11" fill="var(--faint)">2</text>
        <text x="252" y="106" font-size="10.5" fill="var(--faint)">L₂ = 2000 m</text>

        <line x1="20" y1="210" x2="440" y2="210" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 4"/>
        <line x1="46" y1="176" x2="46" y2="210" stroke="var(--faint)" stroke-width="1"/>
        <line x1="40" y1="176" x2="60" y2="176" stroke="var(--faint)" stroke-width="1"/>
