ejercicios:
  # ── 1 (15 %) · Las máquinas hidráulicas de corrido, con penalización por
  #    error. Teoría pura.
  - id: exflu2021-3par-1-las-maquinas-hidraulicas-de-corrido
    titulo: Las máquinas hidráulicas de corrido, y lo que cuesta fallar
    fuente: >-
      Ejercicio 1 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica la tabla
      resuelta.
    nivel: examen
    enunciado: |
      Rellenar los huecos. Tener en cuenta que **cada respuesta errónea resta
      la misma puntuación que cada acierto**:

      Según el intercambio de energía las máquinas hidráulicas pueden ser:
      ______ y ______. Ejemplo de las primeras son las ______ mientras que
      las ______ lo son de las segundas. Según el principio de
      funcionamiento, las máquinas pueden ser ______ y ______. Las primeras
      se basan en el ______ y las segundas, en el ______.

      En las turbobombas hay dos tipos de cierre: ______ y ______.
      ______ son empleados en el primer caso. En el segundo caso, sin
      embargo, se pueden emplear dos opciones: ______ y ______.

      Siendo el caudal pequeño y la altura elevada, la turbina ______ es la
      más adecuada. Los distintos elementos que componen este tipo de turbina
      son los siguientes: ______. En este caso la entrada del agua en el
      rodete es ______.

      En cualquier instalación de bombeo, la válvula de regulación se debe
      poner en el conducto de ______, ya que, de ponerla en la tubería de
      ______, el riesgo de ______ es mayor.

      **Notas nuestras.** El cuadernillo publicado trae los huecos ya
      rellenos, en rojo y subrayados: son la solución, y aquí van en blanco,
      un hueco por cada subrayado. Por eso «inyector y rodete» es un solo
      hueco.
    pide: Las palabras que faltan, sabiendo que fallar cuesta lo mismo que acertar.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Según el intercambio de energía»: ¿qué distingue a una máquina
          motora de una generadora?
        opciones:
          - texto: >-
              Quién da energía a quién: la motora la recibe del fluido —una
              turbina— y la generadora se la entrega —una bomba—
            correcta: true
            mensaje: |
              Eso es, y conviene fijarse en que los nombres despistan: la
              **motora** es la que mueve algo, es decir la que **saca**
              energía del agua. La generadora genera energía **en el fluido**,
              no electricidad.
          - texto: >-
              El sentido de giro del rodete
            mensaje: |
              El sentido de giro no clasifica nada: una Francis y una bomba
              centrífuga pueden girar igual. Lo que las separa es la dirección
              en que viaja la energía.
          - texto: >-
              Si producen electricidad o la consumen
            mensaje: |
              Se le parece, pero la clasificación es hidráulica y no
              eléctrica: una bomba accionada por un motor diésel sigue siendo
              generadora, y una turbina que mueve una muela de molino sigue
              siendo motora.

      - tipo: calcular
        titulo: Los elementos de la turbina más adecuada
        pregunta: |
          Con caudal pequeño y altura elevada, ¿de cuántos elementos consta la
          turbina que toca?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Esos son los de una turbina de **reacción**: cámara espiral,
              antedistribuidor, distribuidor, rodete y tubo difusor. Con poco
              caudal y mucho salto la que toca es la Pelton, que es de acción
              y tiene solo dos.
          - valor: '3'
            mensaje: |
              Con tres seguramente estás contando el deflector aparte. El
              deflector forma parte del **inyector**, junto con la aguja: el
              conjunto es un solo elemento.
        pista: |
          Poco caudal y mucho salto es el terreno de las turbinas de acción.
        desarrollo: |
          La turbina es la **Pelton**, y consta de **inyector** y **rodete**.
          Dos. La entrada del agua en el rodete es **puntual**, por donde
          estén los inyectores.

      - tipo: justificar
        pregunta: Ordena las respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              Según el intercambio de energía: **motoras** y **generadoras**;
              turbinas las primeras, bombas las segundas.
          - texto: >-
              Según el principio de funcionamiento: **turbomáquinas** —que se
              basan en el teorema de Euler— y **máquinas de desplazamiento
              positivo**, que se basan en el principio de Pascal.
          - texto: >-
              El cierre puede ser **interno** —anillos laberínticos— o
              **externo**, con cierres mecánicos o cajas prensaestopas.
          - texto: >-
              La válvula de regulación se pone en la **aspiración**, porque
              ahí regula mejor el caudal.
            trampa: true
            mensaje: |
              Se pone en la **impulsión**, y por una razón que no es de
              regulación sino de cavitación: una válvula en la aspiración
              baja la presión a la entrada de la bomba y se come el NPSH
              disponible. En la impulsión estrangula igual de bien y no toca
              el NPSH. Es la única de las cuatro filas que tiene una
              consecuencia práctica inmediata.
    resolucion: |
      **La tabla completa.**

      | hueco | respuesta |
      |---|---|
      | intercambio de energía | **motoras** y **generadoras** |
      | ejemplos | turbinas las motoras, bombas las generadoras |
      | principio de funcionamiento | **turbomáquinas** y **máquinas de desplazamiento positivo** |
      | en qué se basan | teorema de **Euler** y principio de **Pascal** |
      | tipos de cierre | **interno** y **externo** |
      | cierre interno | anillos **laberínticos** |
      | cierre externo | **cierres mecánicos** y **cajas prensaestopas** |
      | poco caudal, mucho salto | **Pelton** |
      | sus elementos | **inyector** y **rodete** |
      | su admisión | **puntual** |
      | dónde va la válvula de regulación | en la **impulsión** |
      | por qué no en la otra | en la **aspiración** el riesgo de **cavitación** es mayor |

      **Los dos hilos que sostienen toda la tabla.** El primero: «motora» y
      «generadora» se refieren a la energía **del fluido**, no a la
      electricidad. Una turbina es motora porque le quita energía al agua;
      una bomba es generadora porque se la da.

      El segundo: las turbomáquinas trabajan por **variación de cantidad de
      movimiento** —de ahí Euler— y las de desplazamiento positivo por
      **transmisión de presión** —de ahí Pascal—. Todo lo demás se deduce:
      una turbomáquina necesita cierres porque el eje atraviesa una carcasa
      con fluido a presión, y una de desplazamiento positivo no puede
      regularse estrangulando porque el caudal no depende de la presión.

      **Y una advertencia sobre el formato.** Cada error resta lo mismo que
      suma un acierto, así que rellenar un hueco a ciegas es apostar a doble o
      nada: solo compensa si crees tener más de la mitad de posibilidades de
      acertar, y por debajo de eso es **mejor** dejarlo en blanco. Pasa lo
      mismo en el ejercicio 9 de la ordinaria de 2026, con otras ocho
      preguntas de huecos de turbomáquinas.

  # ── 2 (15 %) · Un factor de paso medido con un manómetro en U, y dos
  #    cotas que son datos de sobra.
  - id: exflu2021-3par-2-el-factor-de-paso-de-la-valvula
    titulo: El factor de paso de la válvula, y las dos cotas que sobran
    fuente: >-
      Ejercicio 2 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se tiene en el laboratorio una válvula de asiento plano de diámetro $D$,
      cuya entrada está a cota $z_1$ y su salida a cota $z_2$. A través de la
      válvula circula un fluido de densidad relativa $s$. El caudal $Q$ se
      mide con un rotámetro de coeficiente $C_{rot}$. Un manómetro en U, con
      un fluido manométrico de densidad relativa $s_m$ ($s_m > s$), conectado
      entre la entrada y la salida de la válvula, marca una altura $R$. Se
      pide:

      **a)** Esquema de la instalación.

      **b)** Deducción de la expresión de las pérdidas en la válvula en
      función de $R$.

      **c)** Calcular el factor de paso de la válvula $k$, conociendo los
      siguientes datos: $D = 4{,}5$ cm, $z_1 = 0{,}15$ m, $z_2 = 0{,}18$ m,
      $s = 0{,}8$, $Q = 2800$ l/h, $C_{rot} = 0{,}958$, $s_m = 0{,}96$ y
      $R = 28$ cm.
    pide: La expresión de la pérdida en función de la lectura, y el factor de paso.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da las cotas de entrada y salida, $z_1$ y $z_2$.
          ¿Hacen falta?
        opciones:
          - texto: >-
              No: un manómetro diferencial mide directamente la diferencia de
              alturas **piezométricas**, con la cota ya dentro
            correcta: true
            mensaje: |
              Eso es. Al recorrer el tubo en U de un lado al otro, los
              términos de cota se cancelan solos y lo que queda es
              $R\,(s_m/s-1)$ metros de columna del fluido que circula. Los
              tres centímetros de desnivel entre entrada y salida son un dato
              de sobra.
          - texto: >-
              Sí: hay que sumarle los 3 cm de desnivel a la lectura
            mensaje: |
              Si hubiera que sumarlos, el manómetro no serviría de nada: para
              eso habría que medir la cota de los dos puntos con un nivel. La
              gracia del tubo en U es justamente que la cota se cancela.
          - texto: >-
              Sí: hacen falta para saber el sentido del flujo
            mensaje: |
              El sentido lo da la propia lectura del manómetro, que se
              desplaza hacia el lado de menor altura piezométrica. Y en
              cualquier caso el enunciado ya dice que el flujo va de la
              entrada a la salida.

      - tipo: dibujar
        consigna: |
          El apartado a) en papel: el esquema de la instalación, con la
          válvula, el rotámetro que mide el caudal y el manómetro en U entre
          la entrada y la salida de la válvula, con los dos líquidos, la
          lectura $R$ y las cotas $z_1$ y $z_2$.
        comprueba:
          - punto: >-
              Las dos tomas del manómetro, una en la entrada de la válvula y
              otra en su salida, las dos en el mismo diámetro $D$.
            porque: >-
              El enunciado conecta el manómetro «entre la entrada y la salida
              de la válvula». Con las tomas lejos de ella, la lectura
              arrastraría la pérdida del tubo que queda entre medias, y con
              diámetros distintos la diferencia de alturas piezométricas ya
              no sería la pérdida.
          - punto: >-
              El manómetro en U colgando por debajo del tubo, con el líquido
              manométrico en el fondo de la U y el fluido que circula llenando
              las dos ramas hasta los meniscos.
            porque: >-
              $s_m > s$: el manométrico es el más pesado y se queda abajo.
              Si fuera más ligero, la U iría invertida, por encima del tubo,
              y la expresión del apartado b) cambiaría de signo.
          - punto: >-
              El menisco de la rama de la entrada más bajo que el de la
              salida, con $R$ acotada entre los dos.
            porque: >-
              La entrada tiene más altura piezométrica —la válvula pierde
              carga— y empuja el manométrico hacia abajo en su rama.
              Dibujarlo al revés es decir que la válvula da energía al
              fluido.
          - punto: >-
              El rotámetro en la tubería, vertical, con su coeficiente
              $C_{rot}$ al lado.
            porque: >-
              Es el aparato con el que el enunciado mide $Q$: un tubo
              vertical que se ensancha hacia arriba con un flotador dentro.
              Su lectura hay que multiplicarla por $C_{rot}$ para tener el
              caudal real del apartado c).
          - punto: >-
              Las cotas $z_1$ y $z_2$ de la entrada y la salida, medidas
              desde un mismo plano de referencia.
            porque: >-
              Son datos del enunciado y hay que situarlas, pero el esquema
              enseña ya por qué no hacen falta: el recorrido del manómetro,
              de una toma a la otra, las cancela.
        figura: |
          <figure>
          <svg viewBox="0 0 340 250" role="img" width="340" height="250" aria-labelledby="ex2021p3-2-esquema-t ex2021p3-2-esquema-d">
            <title id="ex2021p3-2-esquema-t">La válvula de asiento plano con su rotámetro y el manómetro en U entre la entrada y la salida</title>
            <desc id="ex2021p3-2-esquema-d">Esquema a escala, en centímetros. El fluido de densidad relativa s entra por abajo a la izquierda, sube por un rotámetro vertical —un tubo que se ensancha hacia arriba con un flotador dentro—, gira a la derecha y llega a la entrada de la válvula, a 15 cm sobre el plano de referencia. La válvula de asiento plano, con su vástago y su volante arriba, tiene la salida a 18 cm, tres más arriba que la entrada, y el tubo sigue hacia la derecha. El diámetro es de 4,5 cm en todo el tramo. Justo antes y justo después de la válvula bajan dos tomas, 1 y 2, a un manómetro en U que cuelga por debajo. En el fondo de la U está el líquido manométrico, más pesado que el fluido; por encima, las dos ramas están llenas del fluido que circula. El menisco de la rama de la entrada está 28 cm más bajo que el de la salida: esa es la lectura R. Las cotas z1 y z2 están acotadas desde el plano de referencia.</desc>
