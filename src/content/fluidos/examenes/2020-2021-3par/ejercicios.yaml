 69.6L139.9 70.2L144.1 70.8L148.3 71.5L152.6 72.1L156.8 72.8L161 73.5L165.2 74.2L169.5 74.9L173.7 75.7L177.9 76.4L182.2 77.2L186.4 78L190.6 78.8L194.8 79.7L199.1 80.5L203.3 81.4L207.5 82.3L211.7 83.2L216 84.2L220.2 85.1L224.4 86.1L228.6 87.1L232.9 88.1L237.1 89.1L241.3 90.1L245.5 91.2L249.8 92.3L254 93.4L258.2 94.5L262.5 95.6L266.7 96.8L270.9 97.9L275.1 99.1L279.4 100.3L283.6 101.5"/><text class="ex2021p3-6-cruce-n" x="37.9" y="56.8" text-anchor="start" fill="var(--alt)">NPSHd</text><text class="ex2021p3-6-cruce-n" x="276.8" y="38.3" text-anchor="end" fill="var(--d1)">NPSHr</text><path class="ex2021p3-6-cruce-op" d="M208.3 102L208.3 30"/><circle class="ex2021p3-6-cruce-hueco" cx="208.3" cy="71.5" r="3.5"/><circle class="ex2021p3-6-cruce-hueco" cx="208.3" cy="82.5" r="3.5"/><circle class="ex2021p3-6-cruce-pt" cx="186.3" cy="78" r="3"/><text class="ex2021p3-6-cruce-n" x="215.3" y="75.5" text-anchor="start" fill="var(--flag)">cavita</text></g>
