        <line x1="204" y1="190" x2="204" y2="210" stroke="var(--faint)" stroke-width="1"/>
        <text x="198" y="206" text-anchor="end" font-size="10.5" fill="var(--faint)">6 m</text>
        <line x1="430" y1="40" x2="430" y2="210" stroke="var(--faint)" stroke-width="1"/>
        <line x1="424" y1="40" x2="436" y2="40" stroke="var(--faint)" stroke-width="1"/>
        <text x="434" y="130" font-size="10.5" fill="var(--faint)">50 m</text>
      </svg>
      <figcaption>

      La válvula está **aguas abajo de la bomba**, mirando hacia B. Cuando se
      va la luz, los dos mil metros de columna vuelven hacia atrás y la clapeta
      se cierra contra ellos, en 5 s: por eso el golpe de ariete se calcula con
      L₂ y no con L₁.

      </figcaption>
      </figure>
    pide: La sobrepresión del golpe de ariete, la tensión en la tubería y la depresión aguas abajo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de elegir entre Allievi y Michaud, ¿qué hay que comparar?
        opciones:
          - texto: >-
              El tiempo de cierre con el tiempo crítico $2L/a$, que es lo que
              tarda la onda en ir y volver
            correcta: true
            mensaje: |
              Eso es. Si la válvula termina de cerrarse **después** de que la
              onda vuelva reflejada, la reflexión alivia la sobrepresión y
              vale Michaud; si se cierra antes, no hay alivio y manda Allievi.
              Aquí $2L/a = 4{,}2$ s frente a 5 s de cierre: por poco, cierre
              lento.
          - texto: >-
              El caudal de retorno con el caudal de bombeo
            mensaje: |
              El caudal de retorno es el dato, 1,23 m³/s, y de él sale la
              velocidad. Lo que decide la fórmula es el tiempo, no el caudal.
          - texto: >-
              La presión estática con la sobrepresión
            mensaje: |
              Eso se compara **después**, para el apartado b). La elección de
              fórmula es previa y depende solo de los tiempos.

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿A qué velocidad viaja la onda de presión, en m/s?
        respuesta:
          tipo: magnitud
          valor: '951 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1425 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$ de la ayuda, que es el que
              tiene en cuenta que la tubería se deforma. Con 600 mm de
              diámetro y 5 de pared, ese término vale 60 frente a los 48,3 del
              agua: **más que el propio fluido**.
          - valor: '9900 m/s'
            mensaje: |
              Ese es el numerador de la fórmula, no el resultado. Ninguna onda
              de presión viaja a 9.900 m/s en agua.
        pista: |
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$, con $D/e = 120$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 120}}
          = \frac{9900}{\sqrt{108{,}3}} = 951\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          ¿Cuánto vale la sobrepresión, en mca?
        respuesta:
          tipo: magnitud
          valor: '355.12 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '422 mca'
            mensaje: |
              Has usado Allievi. El cierre dura 5 s y el tiempo crítico es
              4,2: la onda **sí** llega a volver, así que la sobrepresión se
              alivia y vale Michaud.
          - valor: '372.9 mca'
            mensaje: |
              Has sumado los 100 m de la tubería 1. La válvula está aguas abajo
              de la bomba, así que la columna que se detiene contra ella es la
              de la tubería 2, la que baja desde B: $L = 2000$ m.
        pista: |
          $v = Q/A$ con $D = 600$ mm, y Michaud con $L = 2000$ m y $t = 5$ s.
        desarrollo: |
          $$
          v = \frac{1{,}23}{0{,}2827} = 4{,}350\ \text{m/s}
          \qquad
          \frac{2L}{a} = 4{,}2\ \text{s} < 5\ \text{s}
          $$
          $$
          \Delta H = \frac{2\,L\,v}{g\,t}
          = \frac{2\cdot 2000\cdot 4{,}350}{9{,}8\cdot 5} = 355{,}12\ \text{mca}
          $$

      - tipo: calcular
        titulo: La tensión en la pared
        pregunta: |
          ¿A qué tensión de tracción somete la sobrepresión del golpe de ariete
          a la pared de la tubería, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '2131 kg/cm2'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '4262 kg/cm2'
            mensaje: |
              Te has dejado el 2 del denominador. La fórmula es
              $\sigma = pD/(2e)$: la fuerza que abre el tubo se reparte entre
              **dos** paredes.
          - valor: '2600 kg/cm2'
            mensaje: |
              Esa es la tensión **admisible** del acero, el dato con el que
              hay que comparar. La de trabajo sale algo menor, y por eso la
              tubería aguanta.
        pista: |
          $\sigma = p\,D/(2e)$, con la presión de la sobrepresión.
        desarrollo: |
          $$
          p = 9800\cdot 355{,}12 = 3{,}48\ \text{MPa}
          $$
          $$
          \sigma = \frac{3{,}48\cdot 10^{6}\cdot 0{,}6}{2\cdot 0{,}005}
          = 208{,}8\ \text{MPa} = 2131\ \text{kg/cm}^{2}
          $$

          Frente a los 2600 admisibles: **aguanta**, con un 18 % de margen.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Aguas arriba de la válvula, el agua que sigue llegando se
              comprime y produce la sobrepresión de 355 m.
          - texto: >-
              Aguas abajo ocurre lo contrario: el agua se aleja y deja tras de
              sí una depresión.
          - texto: >-
              Esa depresión no puede pasar de la presión de vapor, así que en
              la práctica el mínimo es el vacío: $p_{min} = -p_{atm}$.
          - texto: >-
              Como la depresión está limitada, no supone ningún peligro para
              la instalación.
            trampa: true
            mensaje: |
              Está limitada en **magnitud** pero es de las cosas más
              peligrosas que le pueden pasar a una conducción: al llegar a la
              tensión de vapor el agua **cavita**, se forma una bolsa de vapor
              y cuando la columna vuelve y la colapsa se produce un segundo
              golpe, mucho más brusco que el primero. Y una tubería de pared
              fina puede colapsar por aplastamiento con el vacío dentro: una
              atmósfera de diferencia entre fuera y dentro.
    resolucion: |
      **La situación.** Al irse la luz, la bomba se para y el agua de B baja
      por gravedad. La válvula de retención se cierra empujada por ese flujo
      inverso, y al cerrarse detiene una columna de dos kilómetros que baja a
      4,35 m/s. Eso es un golpe de ariete provocado por la propia protección.

      **a) La sobrepresión.** Primero la celeridad, que en una tubería de 600
      mm y 5 de pared está muy lejos de la del agua libre:

      $$
      a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 120}} = 951\ \text{m/s}
      $$

      El término de la tubería, 60, pesa **más** que el del agua, 48,3: la
      pared se deforma y absorbe parte del golpe.

      El tiempo crítico es $2L/a = 4{,}2$ s, y la válvula tarda 5 en cerrar:
      la onda llega a volver, así que el cierre es **lento** y vale Michaud.

      $$
      \Delta H = \frac{2Lv}{gt} = 355{,}12\ \text{mca}
      $$

      **b) La tensión.**

      $$
      \sigma = \frac{p\,D}{2e} = 2131\ \text{kg/cm}^{2} < 2600
      $$

      **Aguanta**, con un 18 % de margen. Un margen estrecho para una
      solicitación que se produce cada vez que se va la luz. Y más estrecho
      aún si a la sobrepresión se le suma la presión que ya hay en la
      válvula, los unos 44 m de columna que hay de la lámina de B a la bomba:
      entonces sale 2395 kg/cm², y sigue aguantando. El cuadernillo solo
      imprime «Aguantará», que vale con las dos lecturas.

      **c) Aguas abajo.** Al cerrarse la válvula, el agua que ya la había
      pasado sigue su camino y deja tras de sí un hueco. La presión cae, y no
      puede caer indefinidamente: se detiene en la tensión de vapor, que a
      efectos prácticos es el **vacío**. Así que

      $$
      p_{min} = -p_{atm}
      $$

      **Y ahí está el riesgo real.** La depresión está acotada, sí, pero al
      llegar a la tensión de vapor el agua cavita: se forma una bolsa que,
      cuando la columna vuelve, se colapsa y produce un segundo golpe mucho
      más brusco que el primero. Proteger una impulsión contra el vaciado con
      una simple clapeta resuelve un problema y crea otro; por eso las
      instalaciones reales llevan además calderines, chimeneas de equilibrio o
      válvulas de alivio.

  # ── 4 (20 %) · Una tubería que se ha ido corroyendo, y tres regímenes
  #    distintos en tres apartados.
  - id: exflu2021-3par-4-la-tuberia-que-se-ha-corroido
    titulo: La tubería que se ha ido corroyendo, y los tres regímenes
    fuente: >-
      Ejercicio 4 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El trasvase de la figura representa una conducción de A a B por gravedad
      entre dos depósitos abiertos a la atmósfera, cuyas láminas superiores
      tienen un desnivel de 22 m. La longitud del tubo de Hierro Galvanizado
      (HG) es de 400 m y 250 mm de diámetro. La aducción es bastante antigua,
      y solamente han sido rehabilitados desde su construcción y
      recientemente, los elementos de unión entre los diferentes tramos del
      tubo y la propia válvula, pero el tubo de 400 m es el original.

      Se tiene la sospecha de que el caudal ha ido descendiendo estos últimos
      años, debido a la corrosión del hierro galvanizado, que ha aumentado la
      rugosidad del mismo.

      Por ello, se mide el caudal actual de trasvase, que resulta ser de
      120 l/s. Considerando unas pérdidas menores de los elementos nuevos de
      unión de 8 m de longitud equivalente y un coeficiente de pérdidas de la
      válvula nueva (abierta) $k = 4$, se pide calcular por medio de la
      ecuación de **Darcy-Weisbach**:

      **a)** Rugosidad (cm) **actual** del tubo de HG e indicar el
      comportamiento hidráulico del tubo. Se deben de tener en cuenta las
      pérdidas menores en la conducción.

      **b)** Si se colocase un tubo nuevo de HG ($\varepsilon = 0{,}015$ cm)
      de dimensiones idénticas al anterior en lugar del viejo, calcular el
      caudal de trasvase (l/s). Indicar asimismo el comportamiento hidráulico
      del tubo. Se deben de tener en cuenta las pérdidas menores en la
      conducción.

      **c)** Finalmente, se decide poner un tubo nuevo de Polietileno (PE) de
      250 mm y de longitud idéntica a los anteriores, de rugosidad
      $\varepsilon = 0{,}0001$ cm. Calcular el factor de paso necesario en la
      válvula para transportar 200 l/s de agua. Indicar el comportamiento
      hidráulico del tubo. Se deben de tener en cuenta las pérdidas menores
      en la conducción.

      **d)** Indicar el rango de caudales (l/h), para los cuales, no se sabría
      con total certeza si el flujo es laminar o turbulento.

      **Datos**: fluido: agua, densidad del agua
      $\rho = 1000\ \text{kg/m}^{3}$; viscosidad
      $\nu = 1{,}02\cdot 10^{-6}\ \text{m}^{2}/\text{s}$.

      **Notas nuestras.** La figura del cuadernillo, redibujada abajo, pone el
      depósito A arriba a la izquierda y el B abajo a la derecha, unidos por
      el tubo, que en el impreso baja ondulando (aquí, en recta) y lleva la
      válvula pasada la mitad, más cerca de B que de A. No trae cotas: el
      desnivel de 22 m está en el texto.

      <figure class="figura-examen">
      <svg viewBox="24 22 412 186" role="img" width="440" height="199"
           aria-labelledby="fv4t fv4d">
        <title id="fv4t">El trasvase por gravedad entre los dos depósitos abiertos</title>
        <desc id="fv4d">Dos depósitos abiertos a la atmósfera unidos por una
        conducción que trasvasa agua por gravedad. La lámina del depósito A, a
        la izquierda, queda veintidós metros por encima de la del depósito B.
        La tubería es de hierro galvanizado, mide cuatrocientos metros y tiene
        doscientos cincuenta milímetros de diámetro; lleva una válvula pasada la
        mitad, más cerca de B que de A. El tubo es el original de la instalación y se sospecha
        que la corrosión ha aumentado su rugosidad, porque el caudal ha ido
        bajando con los años.</desc>

        <rect x="50" y="52" width="80" height="40" fill="var(--live)" fill-opacity=".2"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="50" y1="52" x2="130" y2="52" stroke="var(--live)" stroke-width="1.4"/>
        <text x="90" y="80" text-anchor="middle" font-size="12" fill="var(--ink)">A</text>
        <text x="90" y="44" text-anchor="middle" font-size="10" fill="var(--faint)">abierto</text>

        <rect x="326" y="140" width="80" height="40" fill="var(--live)" fill-opacity=".2"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="326" y1="140" x2="406" y2="140" stroke="var(--live)" stroke-width="1.4"/>
        <text x="366" y="168" text-anchor="middle" font-size="12" fill="var(--ink)">B</text>
        <text x="366" y="132" text-anchor="middle" font-size="10" fill="var(--faint)">abierto</text>

        <path d="M130 86 L236 121.7 M264 131.1 L326 152" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M236 115 L264 138 M264 115 L236 138" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="250" y="109" text-anchor="middle" font-size="10.5" fill="var(--ink)">válvula</text>

        <text x="150" y="146" font-size="10.5" fill="var(--faint)">hierro galvanizado</text>
        <text x="150" y="160" font-size="10.5" fill="var(--faint)">L = 400 m · D = 250 mm</text>

        <line x1="286" y1="52" x2="286" y2="140" stroke="var(--faint)" stroke-width="1"/>
        <line x1="130" y1="52" x2="292" y2="52" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="280" y1="140" x2="326" y2="140" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="294" y="98" font-size="11" fill="var(--faint)">22 m</text>
      </svg>
      <figcaption>

      No hay bomba: **los 22 m son toda la energía disponible**, y se reparten
      entre las pérdidas del tubo y las de la válvula. Por eso el caudal baja
      cuando el tubo se corroe, y por eso medirlo permite despejar la rugosidad
      actual sin abrir nada.

      </figcaption>
      </figure>
    notas:
      - >-
        **Nota:** En caso de ser necesario, limitar a **3** el número de
        iteraciones a realizar o en su defecto, a un cambio menor al 5% de la
        variable a calcular. Los depósitos pueden considerarse de grandes
        dimensiones. Resolución por medio del ábaco de Moody y expresiones.
    pide: La rugosidad actual, el caudal con tubo nuevo, el factor de paso con PE y el rango de transición.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a) sale un factor de fricción de 0,042 con
          $Re \approx 6\cdot 10^{5}$. ¿Qué régimen es ese?
        opciones:
          - texto: >-
              Turbulencia completa: con esa rugosidad el factor ya no depende
              del Reynolds, y se puede usar la asíntota rugosa de Colebrook
            correcta: true
            mensaje: |
              Eso es, y simplifica el cálculo: en el régimen rugoso el término
              $2{,}51/(Re\sqrt{f})$ es despreciable frente a
              $\varepsilon/3{,}7D$, y la rugosidad se despeja directamente sin
              iterar. Es lo que dice el resultado del cuadernillo:
              «comportamiento rugoso».
          - texto: >-
              Laminar, porque el factor de fricción es alto
            mensaje: |
              Un factor alto no significa laminar. En laminar, $f = 64/Re$
              daría $10^{-4}$: cuatrocientas veces menos. Lo que hace grande
              este factor es una rugosidad de más de tres milímetros.
          - texto: >-
              Transición, porque el Reynolds no es lo bastante grande
            mensaje: |
              La frontera del régimen rugoso no la marca el Reynolds solo sino
              su producto con la rugosidad relativa. Con
              $\varepsilon/D \approx 0{,}013$, seiscientos mil es de sobra.

      - tipo: calcular
        titulo: La rugosidad actual
        pregunta: |
          ¿Qué rugosidad tiene hoy el tubo, en cm?
        respuesta:
          tipo: numero
          valor: '0.3316'
          tolerancia: 0.005
          formato: un número en centímetros
        distractores:
          - valor: '0.015'
            mensaje: |
              Esa es la del tubo **nuevo**, la del apartado b). La corrosión la
              ha multiplicado por veintidós.
          - valor: '0.0332'
            mensaje: |
              Te has dejado un factor diez, probablemente al pasar de metros a
              centímetros. La rugosidad actual son más de tres milímetros.
        pista: |
          De los 22 m disponibles, resta la pérdida de la válvula y despeja
          $f$; después, la asíntota rugosa
          $1/\sqrt{f} = -2\log(\varepsilon/3{,}7D)$.
        desarrollo: |
          $$
          v = \frac{0{,}12}{0{,}04909} = 2{,}445\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}3049\ \text{m}
          $$
          $$
          22 = f\,\frac{408}{0{,}25}\,0{,}3049 + 4\cdot 0{,}3049
          \;\Longrightarrow\;
          f = 0{,}0418
          $$
          $$
          \frac{1}{\sqrt{f}} = -2\log\frac{\varepsilon}{3{,}7\,D}
          \;\Longrightarrow\;
          \varepsilon = 0{,}331\ \text{cm}
          $$

          Con $g = 9{,}8$ sale 0,3307 cm; el 0,3316 que imprime el cuadernillo
          es la misma cuenta con $g = 9{,}81$.

      - tipo: calcular
        titulo: El caudal con el tubo nuevo
        pregunta: |
          Con un tubo nuevo de hierro galvanizado, ¿cuánto trasvasaría, en
          l/s?
        respuesta:
          tipo: magnitud
          valor: '176.46 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '120 l/s'
            mensaje: |
              Ese es el caudal **actual**, con el tubo corroído. Cambiarlo
              recupera un 47 % de capacidad.
          - valor: '200 l/s'
            mensaje: |
              Ese es el caudal del apartado c), que solo se alcanza con
              polietileno. El hierro galvanizado nuevo se queda en 176.
        pista: |
          La misma ecuación con $\varepsilon = 0{,}015$ cm, iterando: ahora el
          régimen ya no es rugoso.
        desarrollo: |
          Tanteando con Colebrook —el punto cae en la **zona de transición**,
          «semi-liso»— converge en $f = 0{,}0179$ y $Q \approx 176{,}9$ l/s. El
          cuadernillo imprime 176,46 l/s, que es la misma cuenta con
          $f = 0{,}0180$ leído en el ábaco; la casilla acepta las dos.

      - tipo: calcular
        titulo: El factor de paso de la válvula con el tubo de polietileno
        pregunta: |
          Con el tubo nuevo de polietileno, ¿qué factor de paso hay que dar a
          la válvula para que pasen justo 200 l/s?
        respuesta:
          tipo: numero
          valor: '7.029'
          tolerancia: 0.25
          formato: un número
        distractores:
          - valor: '9.66'
            mensaje: |
              Has sacado $f$ con Blasius, $f = 0{,}316/Re^{1/4}$, y Blasius solo
              vale en tubo liso hasta $Re = 10^{5}$. Aquí el Reynolds es casi
              $10^{6}$: el tubo sigue siendo liso, pero toca Kármán-Prandtl,
              Colebrook o la curva lisa del ábaco, y los tres dan
              $f \approx 0{,}0116$ a $0{,}0117$.
          - valor: '14.5'
            mensaje: |
              Has usado la asíntota rugosa, como en el apartado a). Con
              $\varepsilon/D = 4\cdot 10^{-6}$ el polietileno es
              hidráulicamente **liso**: el término de la rugosidad es
              despreciable y el que manda es el del Reynolds.
        pista: |
          Con 200 l/s la velocidad es de 4,07 m/s. Saca $Re$ y
          $\varepsilon/D$, lee $f$, y despeja $k$ de
          $22 = \left(f\,\dfrac{408}{0{,}25} + k\right)\dfrac{v^{2}}{2g}$.
        desarrollo: |
          $$
          v = \frac{0{,}2}{0{,}04909} = 4{,}074\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}847\ \text{m}
          \qquad
          Re = 9{,}99\cdot 10^{5}
          \qquad
          \frac{\varepsilon}{D} = 4\cdot 10^{-6}
          $$
          $$
          22 = (1632\,f + k)\cdot 0{,}847
          $$

          Con Colebrook, $f = 0{,}01174$ y $k = 6{,}82$; con Kármán-Prandtl,
          la de tubo liso, $f = 0{,}01165$ y $k = 6{,}96$; leyendo el ábaco en
          su curva de tubo liso, $f \approx 0{,}0116$ y $k = 7{,}03$, que es lo
          que imprime el cuadernillo, 7,029. La casilla acepta todos: la nota
          del enunciado pide el ábaco y las expresiones, y la diferencia es la
          que hay entre leer una curva y calcularla.

          Un aviso que la casilla no puede dar: si te sale 7,2, mira si has
          sumado los 8 m de longitud equivalente de las uniones. Sin ellos, con
          Colebrook, sale 7,19, dentro de lo que se acepta, porque ese olvido
          mueve la $k$ menos que la diferencia entre leer el ábaco y calcular
          $f$.

      - tipo: calcular
        titulo: El caudal máximo del que aún se duda
        pregunta: |
          ¿Cuál es el caudal más alto para el que todavía no se sabe con
          certeza si el flujo es laminar o turbulento, en l/h?
        respuesta:
          tipo: magnitud
          valor: '2880 l/h'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1440 l/h'
            mensaje: |
              Ese es el extremo **inferior** del intervalo, el que corresponde
              a $Re = 2000$. Por debajo de ahí el flujo es laminar con
              seguridad.
          - valor: '4000 l/h'
            mensaje: |
              4.000 es el **Reynolds** del límite superior, no el caudal. Para
              pasar de uno a otro hay que multiplicar por $\nu A/D$.
        pista: |
          La zona de incertidumbre va de $Re = 2000$ a $Re = 4000$, y
          $Q = Re\,\nu\,A/D$.
        desarrollo: |
          $$
          Q = Re\,\frac{\nu A}{D}
          = 4000\cdot\frac{1{,}02\cdot 10^{-6}\cdot 0{,}04909}{0{,}25}
          = 8{,}01\cdot 10^{-4}\ \text{m}^{3}/\text{s}
          $$

          es decir 2884 l/h, que el cuadernillo redondea a 2880. Y el extremo
          inferior, con $Re = 2000$, son 1442 l/h, que imprime como 1440.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el tubo corroído el punto cae en régimen **rugoso**, y la
              rugosidad se despeja sin iterar: 0,3316 cm.
          - texto: >-
              Con el tubo nuevo de hierro galvanizado el punto baja a la
              **zona de transición**, hay que iterar Colebrook, y el caudal
              sube a 176,46 l/s.
          - texto: >-
              Con polietileno el tubo es hidráulicamente **liso**, y para
              limitar el caudal a 200 l/s hace falta una válvula con
              $k = 7$.
          - texto: >-
              Los tres apartados usan la misma fórmula, así que el régimen
              hidráulico es un detalle sin consecuencias prácticas.
            trampa: true
            mensaje: |
              La fórmula de Darcy es la misma, pero **el coeficiente sale de
              tres sitios distintos**: la asíntota rugosa en a), Colebrook
              completo en b) y la asíntota lisa en c). Y no es un detalle: en
              a) permite despejar la rugosidad de una vez, mientras que en b)
              obliga a iterar. Identificar el régimen es lo que decide cuánto
              trabajo cuesta el problema.
    resolucion: |
      **a) La rugosidad de hoy.** De los 22 metros de desnivel, la válvula se
      lleva 1,22 y el resto es rozamiento sobre 408 metros equivalentes:

      $$
      f = 0{,}04181
      $$

      Un factor tan alto con $Re \approx 6\cdot 10^{5}$ solo puede venir de
      una rugosidad grande: el punto está en **turbulencia completa**, donde
      $f$ ya no depende del Reynolds. Eso permite despejar directamente:

      $$
      \frac{1}{\sqrt{f}} = -2\log\frac{\varepsilon}{3{,}7D}
      \qquad
      \varepsilon = 0{,}3316\ \text{cm}
      $$

      con $g = 9{,}81$, como el cuadernillo; con $g = 9{,}8$ sale 0,3307.
      **Veintidós veces la del tubo nuevo.** La sospecha era fundada.

      **b) Con tubo nuevo.** Con $\varepsilon = 0{,}015$ cm el punto baja a la
      **zona de transición** y hay que iterar Colebrook. Sale $f = 0{,}0179$
      con Colebrook —0,0180 en el ábaco, que da el número impreso— y

      $$
      Q = 176{,}46\ \text{l/s}
      $$

      un **47 % más** de capacidad solo por cambiar el tubo.

      **c) Con polietileno.** Ahora la tubería es hidráulicamente **lisa**:
      $\varepsilon/D = 4\cdot 10^{-6}$ con $Re = 9{,}99\cdot 10^{5}$, y el
      ábaco da $f \approx 0{,}0116$ en su curva de tubo liso. Con 200 l/s el
      rozamiento se queda en 16 metros de los 22. Los seis que sobran hay que
      quemarlos en la válvula:

      $$
      22 = (1632\,f + k)\cdot 0{,}847
      \quad\Longrightarrow\quad
      k = 7{,}03
      $$

      que es el 7,029 del cuadernillo. Con Colebrook, $f = 0{,}01174$, sale
      6,82: la válvula se lleva 5,8 m en vez de 6. La nota del enunciado pide
      «el ábaco de Moody y expresiones», y las dos cuentas valen. Lo que no
      vale es olvidar los 8 m de las uniones: con Colebrook da 7,19, un número
      que parece bueno.

      **d) La zona de duda.** Entre $Re = 2000$ y $Re = 4000$:

      $$
      1440\ \text{l/h} < Q < 2880\ \text{l/h}
      $$

      **Lo que enseña el conjunto.** Los cuatro apartados son la misma
      ecuación con el coeficiente de fricción sacado de tres sitios distintos.
      Y la lección de explotación está en los números: una conducción de
      hierro galvanizado que ha perdido un tercio de su caudal no está
      averiada ni obstruida —está **rugosa**—, y el diagnóstico se hace
      midiendo el caudal y despejando la rugosidad, sin abrir nada.

  # ── 5 (15 %) · Una red de canales construida con losas cuadradas: toda la
  #    geometría depende de un solo parámetro.
  - id: exflu2021-3par-5-la-red-de-canales-de-losas-cuadradas
    titulo: La red de canales hecha con losas cuadradas
    fuente: >-
      Ejercicio 5 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un pequeño municipio trabaja en el diseño de un plan de
      autoabastecimiento energético. Una de las opciones que se va a
      considerar es la rehabilitación de una instalación compuesta por una red
      de canales y una pequeña central hidroeléctrica que cayó en desuso hace
      décadas. En el marco de tu desempeño profesional te ha sido asignada la
      tarea de realizar los cálculos hidráulicos asociados a la reforma de la
      red de canales.

      La información disponible sobre la red de canales es escasa. Se conoce
      que la geometría del canal es la detallada en la figura
      (triángulo+rectángulo), habiendo sido construido íntegramente por losas
      prefabricadas cuadradas de lado $L$ de **hormigón en bruto**. La red de
      canales consta de tres ramales: los ramales **R1** y **R2** bajan por
      sendos valles, y se juntan más adelante para alcanzar la central
      hidroeléctrica por medio del ramal principal (**R0**). Las cotas de
      partida ($z_i$) y llegada ($z_f$), así como la longitud total
      ($L_{tot}$) de cada ramal se indican en la tabla.

      **a)** Si los registros de la central indican que el caudal máximo
      registrado fue de $Q = 3000$ l/s, y considerando que en dicha situación
      el ramal R0 trabajaba en su máxima capacidad, estimar el valor de la
      longitud $L$ de las losas de hormigón y seleccionar la talla comercial
      correspondiente si estas se solían construir en intervalos de 10 cm.

      **b)** Sabiendo que el ramal R1 aportaba ⅔ del caudal del apartado a) y
      la lámina libre superaba la parte triangular, deducir el calado $H$ en
      dicho canal.

      **c)** Si se conoce que el restante ⅓ del caudal aportado por el ramal
      R2 no superaba la parte triangular, calcular la cota mínima de partida
      del ramal R2.

      **d)** Si se tuviera que sustituir el ramal R0 por uno nuevo
      semicircular de hormigón acabado, y mantener una berma de seguridad del
      15% del diámetro, seleccionar el diámetro comercial a instalar si estos
      están disponibles cada 50 cm.

      | **Ramal** | **$z_i$ (m)** | **$z_f$ (m)** | **$L_{tot}$ (km)** | **J** |
      |---|---|---|---|---|
      | **R0** | 500 | 400 | 20 | |
      | **R1** | 559 | 500 | 12 | |
      | **R2** | ?? | 500 | 14 | |

      **Notas nuestras.** La figura del cuadernillo es la sección del canal,
      encajada en el terreno: dos losas verticales de lado $L$ hacen de
      paredes, separadas $L$ entre sí, y otras dos losas de lado $L$,
      inclinadas, cierran por debajo una V que se apoya en el pie de las
      paredes; el calado $H$ se mide desde el vértice de la V hasta la lámina.
      Al lado dibuja el contorno suelto, con sus cinco lados acotados como
      $L$ —la boca, las dos paredes y los dos lados de la V—, y una losa
      cuadrada de $L \times L$. La columna J de la tabla va vacía en el
      impreso.
    pide: El lado de la losa, el calado de R1, la cota de arranque de R2 y el diámetro de la media caña.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las losas son **cuadradas de lado $L$** y forman toda la sección.
          ¿Qué implica eso para la geometría?
        opciones:
          - texto: >-
              Que la sección entera depende de un solo parámetro: las dos
              paredes miden $L$, la V la forman dos losas de lado $L$ y la
              boca mide $L$
            correcta: true
            mensaje: |
              Eso es, y es lo que hace resoluble el apartado a). Con la boca
              de anchura $L$ y las dos losas de la V de longitud $L$ cada una,
              la V tiene medio ancho $L/2$ y profundidad $L\sqrt{3}/2$: un
              triángulo equilátero. Toda la sección queda en función de $L$.
          - texto: >-
              Que el canal es cuadrado
            mensaje: |
              Cuadradas son las **losas**, no la sección. La sección es un
              rectángulo con una V debajo, y para construirla hacen falta
              cuatro losas.
          - texto: >-
              Que hay que suponer la profundidad de la V
            mensaje: |
              No hay que suponerla: sale de la geometría. Si la boca mide $L$
              y cada losa inclinada mide $L$, el triángulo tiene los tres
              lados iguales y su altura es $L\sqrt{3}/2$.

      - tipo: calcular
        titulo: El lado de la losa
        pregunta: |
          ¿Cuánto mide el lado $L$ de las losas, en cm?
        respuesta:
          tipo: numero
          valor: '95.34'
          tolerancia: 0.5
          formato: un número en centímetros
        distractores:
          - valor: '100'
            mensaje: |
              Ese es el tamaño **comercial**, el que hay que pedir. El cálculo
              exacto da 95,34 cm, y como las losas van de 10 en 10 se compra
              la de un metro.
          - valor: '82.56'
            mensaje: |
              Esa es la profundidad de la V, $L\sqrt{3}/2$ con el lado que
              sale, 95,34 cm. La pregunta es el lado de la losa.
        pista: |
          Sección llena: $A = 1{,}433L^{2}$ y $P = 4L$, con
          $n = 0{,}015$ y $J = 100/20000$.
        desarrollo: |
          La V es un triángulo equilátero de lado $L$: área
          $\sqrt{3}L^{2}/4 = 0{,}433L^{2}$ y dos lados mojados de longitud
          $L$. Encima, el rectángulo $L\times L$ con dos paredes de $L$.

          $$
          A = 1{,}433\,L^{2}
          \qquad
          P = 4L
          \qquad
          R_h = 0{,}3583\,L
          $$
          $$
          Q = \frac{1{,}433}{0{,}015}\,(0{,}3583L)^{2/3}\sqrt{0{,}005}\;L^{2}
          = 3{,}408\,L^{8/3} = 3
          $$
          $$
          L = 0{,}9534\ \text{m}
          \;\longrightarrow\;
          L_{com} = 1\ \text{m}
          $$

      - tipo: calcular
        titulo: El calado del ramal R1
        pregunta: |
          Con la losa comercial de 1 m y ⅔ del caudal, ¿cuánto vale el calado
          $H$ en R1, en metros?
        respuesta:
          tipo: numero
          valor: '1.365'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '0.866'
            mensaje: |
              Esa es la profundidad de la V, es decir el calado al que la
              lámina llega justo al vértice del rectángulo. El enunciado dice
              que la **supera**.
          - valor: '0.499'
            mensaje: |
              Esa es la parte del calado que queda **dentro del rectángulo**.
              El calado total incluye además los 0,866 m de la V.
        pista: |
          Con $y$ la parte por encima de la V: $A = 0{,}433+y$ y
          $P = 2+2y$, y $J = 59/12000$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}015}\,(0{,}433+y)
          \Bigl(\frac{0{,}433+y}{2+2y}\Bigr)^{2/3}\sqrt{4{,}917\cdot 10^{-3}}
          = 2
          $$
          $$
          y = 0{,}499\ \text{m}
          \qquad
          H = 0{,}866+0{,}499 = 1{,}365\ \text{m}
          $$

      - tipo: calcular
        titulo: La cota de arranque del ramal R2
        pregunta: |
          ¿A qué cota mínima debe arrancar R2, en metros?
        respuesta:
          tipo: numero
          valor: '629.23'
          tolerancia: 0.5
          formato: un número en metros
        distractores:
          - valor: '559'
            mensaje: |
              Esa es la cota de arranque de **R1**, que lleva el doble de
              caudal por un canal más corto. R2 lleva la mitad pero tiene que
              hacerlo sin salirse de la V, y eso le exige mucha más pendiente.
          - valor: '500'
            mensaje: |
              Esa es la cota de **llegada**, la del nudo con R0. La pregunta
              es dónde empieza.
        pista: |
          La cota mínima corresponde al calado máximo dentro de la V, es
          decir $0{,}866$ m; con él se despeja la pendiente y se multiplica
          por los 14 km.
        desarrollo: |
          Con el calado justo al borde de la V, $A = 0{,}433$,
          $P = 2$ y $R_h = 0{,}2165$ m:

          $$
          1 = \frac{0{,}433}{0{,}015}\,0{,}2165^{2/3}\sqrt{J}
          \;\Longrightarrow\;
          J = 9{,}23\cdot 10^{-3}
          $$
          $$
          z_i = 500 + 9{,}23\cdot 10^{-3}\cdot 14\,000 = 629{,}23\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro de la media caña
        pregunta: |
          ¿Qué diámetro comercial hay que instalar si se sustituye R0, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.5 m'
            mensaje: |
              El cálculo exacto da 1,983 m, y hacia abajo no vale: con 1,5 el
              canal no llevaría los 3 m³/s con la berma exigida.
          - valor: '2.5 m'
            mensaje: |
              Has usado $n = 0{,}015$, el del hormigón en bruto de las losas.
              El canal nuevo es de hormigón **acabado**, $n = 0{,}012$: con
              0,015 el diámetro teórico sube a 2,16 m y el comercial a 2,5,
              pero con el acabado bastan 1,983 m y el de 2 m.
        pista: |
          Berma del 15 % del diámetro significa calado $y = 0{,}7R$, y ahora
          el hormigón es acabado, $n = 0{,}012$.
        desarrollo: |
          Con $y = 0{,}7R$ el ángulo mojado vale $2{,}532$ rad, y

          $$
          A = 0{,}980\,R^{2}
          \qquad
          R_h = 0{,}387\,R
          $$
          $$
          Q = 3{,}069\,R^{8/3} = 3
          \;\Longrightarrow\;
          R = 0{,}9915\ \text{m}
          \qquad
          D = 1{,}983\ \text{m}
          $$

          y el comercial, **2 m**.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las losas cuadradas hacen que la V sea un triángulo equilátero
              de lado $L$, y toda la sección quede en función de $L$.
          - texto: >-
              A sección llena y con la pendiente de R0, los 3 m³/s exigen
              $L = 95{,}34$ cm, así que se compra la losa de un metro.
          - texto: >-
              Con esa losa, R1 lleva sus 2 m³/s con 1,365 m de calado, y R2
              necesita arrancar en la cota 629,23 para llevar 1 m³/s sin
              salirse de la V.
          - texto: >-
              R2 arranca más alto que R1 porque lleva más caudal.
            trampa: true
            mensaje: |
              Lleva **la mitad**: 1 m³/s frente a 2. Lo que le obliga a
              arrancar setenta metros más alto es la restricción de que el
              agua no pase de la V, que le deja una sección de solo
              $0{,}433\ \text{m}^{2}$ —menos de la mitad que R1— y le exige
              casi el doble de pendiente. Una limitación de calado cuesta
              cota, y aquí cuesta setenta metros.
    resolucion: |
      **La geometría, que es media resolución.** Las losas son cuadradas de
      lado $L$ y forman las cuatro caras: dos verticales de altura $L$ y dos
      inclinadas que cierran la V. Como la boca mide $L$ y cada losa inclinada
      mide $L$, **la V es un triángulo equilátero**: profundidad
      $L\sqrt{3}/2 = 0{,}866L$ y área $\sqrt{3}L^{2}/4$.

      $$
      A = 1{,}433\,L^{2}
      \qquad
      P = 4L
      \qquad
      R_h = 0{,}3583\,L
      $$

      **a) El lado de la losa.** Con hormigón en bruto ($n = 0{,}015$),
      $J = 0{,}005$ y sección llena:

      $$
      3{,}408\,L^{8/3} = 3
      \qquad
      L = 95{,}34\ \text{cm}
      \;\longrightarrow\;
      L_{com} = 1\ \text{m}
      $$

      **b) El calado de R1.** Con la losa comercial, $J = 59/12000$ y
      2 m³/s, la lámina sube medio metro por encima de la V:

      $$
      H = 0{,}866+0{,}499 = 1{,}365\ \text{m}
      $$

      **c) La cota de R2.** Aquí la restricción es geométrica: el agua no
      puede pasar de la V. Eso deja una sección de solo
      $0{,}433\ \text{m}^{2}$, y para mover 1 m³/s por ella hace falta una
      pendiente de $9{,}23$ milésimas: casi el doble que la de R1.

      $$
      z_i = 500 + 9{,}23\cdot 10^{-3}\cdot 14\,000 = 629{,}23\ \text{m}
      $$

      **Setenta metros más alto que R1, llevando la mitad de caudal.** Esa es
      la lectura que hay que sacar: una limitación de calado se paga en cota,
      y aquí sale carísima.

      **d) La media caña.** Berma del 15 % del diámetro significa $y = 0{,}7R$,
      y el hormigón acabado baja $n$ a 0,012:

      $$
      D = 1{,}983\ \text{m}
      \;\longrightarrow\;
      D_{com} = 2\ \text{m}
      $$

  # ── 6 (20 %) · La bomba elegida en una gráfica de seis, para cuatro
  #    boquillas, y la cavitación que no se arregla con las válvulas.
  #    Rescatado el 30 de septiembre de 2026: la gráfica es una hoja de
  #    catálogo y no se reproduce, pero se publican sus lecturas, tomadas con
  #    su rejilla y redibujadas. Con ellas salen la curva impresa, la bomba, el
  #    punto de funcionamiento —6,75 l/s y 101,7 m— y la cavitación, y el
  #    apartado e) queda como lo imprime el cuadernillo, aunque por poco: el
  #    disponible y el requerido se igualan hacia los 6 l/s (5,9 con nuestras
  #    lecturas), y a 6 l/s el disponible se queda 8 cm por debajo, una
  #    diferencia menor que lo que se lee en la gráfica.
  - id: exflu2021-3par-6-las-cuatro-boquillas-y-la-bomba-que-cavita
    titulo: Las cuatro boquillas, la bomba que se elige en la gráfica y la cavitación que no arreglan las válvulas
    fuente: >-
      Ejercicio 6 · Tercer parcial, 3 de junio de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La imagen muestra la instalación capaz de conducir el agua desde el
      depósito A hasta el punto B, mediante una bomba. En el punto B hay 4
      boquillas. Las válvulas $V_1$ y $V_2$ están totalmente abiertas y no
      generan pérdidas de carga.

      - La tubería 1 es de PVC con codo $U_1$ que genera pérdidas de carga.
      - El tubo 2 es de acero comercial con 3 codos $U_2$ y boquillas que
        generan pérdidas de carga.

      Empleando la ecuación de **Hazen-Williams**, se pide:

      **a)** Obtener la curva característica de la instalación y
      representarla en la gráfica adjunta.

      **b)** Escoger en la gráfica la bomba más adecuada y especificar el
      punto de funcionamiento (Q y H), sabiendo que el objetivo es que el
      caudal sea de 6 l/s y nunca inferior.

      **c)** Indicar si la instalación de bombeo va a funcionar correctamente
      o no, desde el punto de vista de la cavitación.

      Si la respuesta del punto c) es **SI**:

      **d)** Indicar qué se puede hacer con la válvula $V_1$ y/o $V_2$ para
      trabajar la bomba con un caudal de 10 m³/h. Indicar la pérdida de carga
      a generar.

      Si la respuesta del punto c) es **NO**:

      **e)** Indicar si se puede lograr que la instalación funcione con el
      caudal mínimo mencionado de 6 l/s, actuando sobre la válvula $V_1$ y/o
      $V_2$. En caso afirmativo, calcular el factor de paso de la válvula
      maniobrada. En caso negativo, indicar qué otras medidas se podrían
      adoptar para evitar estos problemas.

      **DATOS**: $z_A = 15$ m; $z_P = 21{,}75$ m; $z_B = 25$ m,
      $P_{atm} = 1$ atm, $P_v^{abs} = 2330$ Pa.

      **Notas nuestras.** La imagen del cuadernillo, redibujada abajo con las
      cotas a escala, es el esquema de la instalación. La tubería 1 sale de
      dentro del depósito A, abierto, sube por su lado, gira en el codo $U_1$
      y va en horizontal, por la válvula $V_1$, hasta la bomba P. La tubería 2
      sale de la bomba en horizontal, pasa por $V_2$, gira hacia arriba en un
      codo $U_2$, sube, pasa por encima con otros dos codos $U_2$ y baja hasta
      B, donde un colector reparte el agua entre las cuatro boquillas, que
      desaguan a la atmósfera. El dibujo acota además la altura L y el
      diámetro D del depósito y la profundidad h, sin valores, y junto a él
      trae dos tablas, que se transcriben tal cual:

      | | Diámetro (mm) | Longitud (m) |
      |---|---|---|
      | Tubería 1 | 80 | 70 |
      | Tubería 2 | 50 | 50 |
      | Boquilla | 10 | - |

      | | Longitud equivalente (m) | Factor de paso k |
      |---|---|---|
      | $U_1$ | 2,5 | - |
      | $U_2$ | 4 | - |
      | Boquilla | - | 2 |

