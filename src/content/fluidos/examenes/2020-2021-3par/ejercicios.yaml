 y="33.6" text-anchor="end">6</text><text x="310" y="94" text-anchor="end">Q (l/s)</text><text x="36" y="40">NPSHr (m)</text></g><path class="ex2021p3-6-curvas-c" d="M84.8 93.5L86.2 93.5L87.6 93.4L89 93.3L90.5 93.2L91.9 93.1L93.3 93L94.8 92.9L96.2 92.9L97.6 92.7L99.1 92.6L100.5 92.5L101.9 92.3L103.4 92.3L104.8 92.1L106.2 92L107.7 91.8L109.1 91.7L110.5 91.5L112 91.4L113.4 91.3L114.8 91.1L116.3 90.9L117.7 90.8L119.1 90.6L120.5 90.5L122 90.3L123.4 90.1L124.8 89.9L126.3 89.7L127.7 89.6L129.1 89.4L130.6 89.2L132 89L133.4 88.8L134.9 88.6L136.3 88.4L137.7 88.1L139.2 87.9L140.6 87.7L142 87.5L143.5 87.2L144.9 87L146.3 86.8L147.8 86.5L149.2 86.2L150.6 86L152 85.7L153.5 85.5L154.9 85.2L156.3 84.9L157.8 84.6L159.2 84.4L160.6 84.1L162.1 83.8L163.5 83.5L164.9 83.1L166.4 82.8L167.8 82.6L169.2 82.2L170.7 81.9L172.1 81.6L173.5 81.2L175 80.9L176.4 80.6L177.8 80.2L179.3 79.8L180.7 79.5L182.1 79.1L183.5 78.8L185 78.4L186.4 78L187.8 77.6L189.3 77.3L190.7 76.8L192.1 76.3L193.6 76L195 75.6L196.4 75.2L197.9 74.7L199.3 74.3L200.7 73.9L202.2 73.4L203.6 73L205 72.6L206.5 72.1L207.9 71.7L209.3 71.2L210.8 70.8L212.2 70.3L213.6 69.8L215 69.3L216.5 68.9L217.9 68.4L219.3 67.9L220.8 67.4L222.2 66.9L223.6 66.4L225.1 65.9L226.5 65.4L227.9 64.9L229.4 64.4L230.8 63.9L232.2 63.3L233.7 62.8L235.1 62.2L236.5 61.7L238 61.2L239.4 60.7L240.8 60.1L242.3 59.5L243.7 59L245.1 58.4L246.5 57.8L248 57.3L249.4 56.7L250.8 56.1L252.3 55.5L253.7 55L255.1 54.4L256.6 53.7L258 53.1L259.4 52.5L260.9 51.9L262.3 51.3L263.7 50.7L265.2 50L266.6 49.4L268 48.8L269.5 48.2L270.9 47.5L272.3 46.9L273.8 46.2L275.2 45.6L276.6 44.9L278.1 44.2L279.5 43.6L280.9 42.9L282.3 42.3L283.8 41.6L285.2 40.9L286.6 40.3L287 40.2"/></g>
      </svg>
      <figcaption>

      Las curvas de la gráfica del cuadernillo, redibujadas de las lecturas:
      arriba, las seis bombas, en m³/h como el original; abajo, el NPSH
      requerido, en l/s. Hace de gráfica adjunta: sobre ella se dibuja la
      curva de la instalación.

      </figcaption>
      </figure>
    pide: La curva de la instalación dibujada sobre la gráfica, la bomba que llega a 6 l/s y su punto de funcionamiento, si cavita, y qué hacer si cavita.

    pasos:
      - tipo: reconocer
        pregunta: |
          La curva impresa lleva dos términos que crecen con el caudal:
          $H = 10 + 0{,}614\,Q^{1{,}852} + 1{,}55\,Q^{2}$. ¿Qué es lo que va en
          el término de $Q^{2}$?
        opciones:
          - texto: >-
              Las cuatro boquillas: su factor de paso, $k = 2$, y la altura
              cinética del chorro que sale por cada una, con un cuarto del
              caudal
            correcta: true
            mensaje: |
              Eso es. Con Hazen-Williams, las tuberías y los codos —que vienen
              en longitud equivalente— van con $Q^{1{,}852}$; con $Q^{2}$ van
              las piezas dadas como factor de paso y la altura cinética de los
              chorros. Aquí las dos cosas son de las boquillas:
              $(1 + 2)\,v^{2}/2g$, con $v$ la de una sola boquilla.
          - texto: >-
              Los codos $U_1$ y $U_2$, porque son pérdidas menores
            mensaje: |
              Son pérdidas menores, pero el enunciado las da en longitud
              equivalente, 2,5 y 4 m: se suman a la longitud de su tubería y
              van con Hazen-Williams, en el término de $Q^{1{,}852}$.
          - texto: >-
              Las válvulas $V_1$ y $V_2$
            mensaje: |
              Están totalmente abiertas y el enunciado dice que no generan
              pérdidas: no ponen nada en la curva. Cerrar $V_2$ sí añadiría un
              término en $Q^{2}$, y eso es lo que se piensa en el apartado e).

      - tipo: calcular
        titulo: El coeficiente de las tuberías
        pregunta: |
          Con $H = 10 + b\,Q^{1{,}852} + a\,Q^{2}$, $H$ en m y $Q$ en l/s,
          ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '0.614'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5032'
            mensaje: |
              Te has dejado los codos. Vienen en longitud equivalente y se
              suman a su tramo: 70 + 2,5 m en la tubería 1 y 50 + 3·4 m en la
              2. Los doce metros de los tres codos $U_2$ son casi un cuarto de
              la tubería de acero.
          - valor: '0.5364'
            mensaje: |
              Has tomado $C_{HW} = 130$ para el acero. Con 0,006 cm de
              rugosidad y 50 mm, $\varepsilon/D = 1{,}2\cdot 10^{-3}$, que ya
              pasa de $10^{-3}$: el cuadro n.º 25 lo pone en la banda de
              $C_{HW} = 120$.
        pista: |
          $\varepsilon$ del cuadro n.º 20 —PVC, 0,0007 cm; acero comercial,
          0,006 cm—, $C_{HW}$ por la banda de $\varepsilon/D$ del cuadro n.º 25,
          y $b = 72{,}5\,J_1(C_1;\,80) + 62\,J_1(C_2;\,50)$, con
          $J_1 = 1{,}2117\cdot 10^{10}/\left(C_{HW}^{1{,}852}\,D^{4{,}87}\right)$
          y $D$ en mm.
        desarrollo: |
          $$
          \frac{\varepsilon}{D}\Big|_1 = \frac{0{,}007}{80} = 8{,}75\cdot 10^{-5}
          \;\rightarrow\; C_{HW} = 140
          \qquad
          \frac{\varepsilon}{D}\Big|_2 = \frac{0{,}06}{50} = 1{,}2\cdot 10^{-3}
          \;\rightarrow\; C_{HW} = 120
          $$
          $$
          J_1(140;\,80) = 6{,}930\cdot 10^{-4}
          \qquad
          J_1(120;\,50) = 9{,}094\cdot 10^{-3}
          $$
          $$
          b = 72{,}5\cdot 6{,}930\cdot 10^{-4} + 62\cdot 9{,}094\cdot 10^{-3}
          = 0{,}0502 + 0{,}5638 = 0{,}614
          $$

      - tipo: calcular
        titulo: El coeficiente de las boquillas
        pregunta: |
          ¿Y cuánto vale $a$, el coeficiente de $Q^{2}$?
        respuesta:
          tipo: numero
          valor: '1.55'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '1.034'
            mensaje: |
              Solo has puesto la $k = 2$ de la boquilla. Falta la altura
              cinética del chorro: el agua sale a la atmósfera con toda su
              velocidad, y esa energía también la tiene que dar la bomba. Es
              $(1 + k)\,v^{2}/2g$, no $k\,v^{2}/2g$.
          - valor: '24.81'
            mensaje: |
              Has hecho pasar todo el caudal por una sola boquilla. Son cuatro
              en paralelo, y por cada una va $Q/4$: con la velocidad cuatro
              veces menor, el término es dieciséis veces menor.
          - valor: '6.20'
            mensaje: |
              Has sumado las cuatro boquillas como si fueran en serie. Están en
              paralelo: el agua pasa por una sola de ellas, y la energía que
              pierde es la de una, con su cuarto de caudal.
        pista: |
          Por cada boquilla de 10 mm pasa $Q/4$. Con $Q$ en l/s,
          $v = 10^{-3}\,Q/(4\,A)$, y el término es $(1 + k)\,v^{2}/2g$.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}01^{2}}{4} = 7{,}854\cdot 10^{-5}\ \text{m}^{2}
          \qquad
          v = \frac{10^{-3}\,Q}{4\,A} = 3{,}183\,Q
          \qquad
          \frac{v^{2}}{2g} = 0{,}517\,Q^{2}
          $$
          $$
          a = (1 + 2)\cdot 0{,}517 = 1{,}55
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero: la curva característica de esta
          instalación, desde el balance de energía entre la lámina de A y la
          salida de las boquillas hasta dejarla con sus dos coeficientes
          calculados, con $H$ en m y $Q$ en l/s.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Aquí la curva tiene las dos clases de término a la vez: las tuberías
          con sus codos en $Q^{1{,}852}$ y las boquillas, factor de paso y
          chorro, en $Q^{2}$. Si en tu folio los codos están en $Q^{2}$ o el
          chorro no está, la bomba que elijas en la gráfica puede ser otra.

      - tipo: calcular
        titulo: La altura que pide la instalación a 6 l/s
        pregunta: |
          ¿Cuánta altura pide la instalación para mover los 6 l/s del
          objetivo?
        respuesta:
          tipo: magnitud
          valor: '82.76 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '26.96 m'
            mensaje: |
              Te has dejado el término de las boquillas, $1{,}55\,Q^{2}$, que a
              6 l/s son casi 56 m: más de dos tercios de todo lo que pide la
              instalación.
          - valor: '72.76 m'
            mensaje: |
              Te has dejado los 10 m de desnivel, $z_B - z_A$. Es lo que la
              bomba tiene que dar aunque no mueva agua: la curva arranca ahí,
              no en el origen.
        pista: |
          Sustituye $Q = 6$ en $H = 10 + 0{,}614\,Q^{1{,}852} + 1{,}55\,Q^{2}$.
        desarrollo: |
          $$
          H(6) = 10 + 0{,}614\cdot 27{,}61 + 1{,}55\cdot 36
          = 10 + 16{,}95 + 55{,}8 = 82{,}76\ \text{m}
          $$

      - tipo: reconocer
        pregunta: |
          A 6 l/s la instalación pide 82,8 m. ¿Qué bomba de la gráfica es la
          adecuada?
        opciones:
          - texto: >-
              La 25/6, de 11 kW: a 6 l/s da 106,6 m, más de lo que pide la
              instalación, y la de debajo, la 25/4, se queda en 70,9
            correcta: true
            mensaje: |
              Eso es. Una bomba que a 6 l/s da más altura de la que la
              instalación pide trabaja a la derecha de 6 l/s, con más caudal;
              una que da menos, a la izquierda. La 25/6 es la más pequeña que
              cumple «6 l/s y nunca inferior».
          - texto: >-
              La 25/4, de 7,5 kW, porque su curva es la que pasa más cerca de
              los 82,8 m
            mensaje: |
              Pasa cerca, pero por debajo: a 6 l/s da 70,9 m, menos de lo que
              pide la instalación, así que su punto de funcionamiento se queda
              a la izquierda, en unos 5,6 l/s. El enunciado pide 6 y nunca
              menos.
          - texto: >-
              La 25/8, de 15 kW, porque da más altura y deja más margen
            mensaje: |
              Da de sobra —unos 7,6 l/s—, pero más grande no es más adecuada:
              consume más, y con más caudal el NPSH requerido sube y las
              pérdidas de la aspiración también, justo lo que en esta
              instalación hace daño. La adecuada es la menor que llega.

      - tipo: calcular
        titulo: El caudal del punto de funcionamiento
        pregunta: |
          ¿Qué caudal da la 25/6 en esta instalación, con su unidad?
        respuesta:
          tipo: magnitud
          valor: '6.75 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '6 l/s'
            mensaje: |
              Es el objetivo, no el punto de funcionamiento. La bomba no
              trabaja donde uno quiere sino donde su curva corta a la de la
              instalación, y la 25/6 la corta un poco a la derecha, con más
              caudal.
          - valor: '5.56 l/s'
            mensaje: |
              Es el cruce de la instalación con la 25/4, la bomba de debajo, y
              se queda corto: por eso no vale.
          - valor: '24.3 l/s'
            mensaje: |
              Has leído el eje de m³/h como si fuera de l/s. El cruce está en
              24,3 m³/h, que son 6,75 l/s.
        pista: |
          En la tabla, a 6 l/s la 25/6 da 106,6 m y la instalación pide 82,8;
          a 7 l/s la 25/6 da 100,0 y la instalación pide 108,5. El cruce está
          entre los dos.
        desarrollo: |
          Interpolando en la tabla la diferencia entre lo que da la bomba y lo
          que pide la instalación:

          $$
          Q = 6 + \frac{106{,}6 - 82{,}8}{(106{,}6 - 82{,}8) + (108{,}5 - 100{,}0)}
          = 6 + \frac{23{,}8}{32{,}3} = 6{,}74 \approx 6{,}75\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura del punto de funcionamiento
        pregunta: |
          ¿Y qué altura da la bomba en ese punto?
        respuesta:
          tipo: magnitud
          valor: '101.74 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '82.76 m'
            mensaje: |
              Es lo que pide la instalación a 6 l/s, el objetivo. La bomba no
              trabaja en el objetivo sino en el cruce, a 6,75 l/s, y ahí la
              instalación ya pide más.
          - valor: '106.6 m'
            mensaje: |
              Es lo que da la 25/6 a 6 l/s. En el punto de funcionamiento la
              bomba ya ha bajado por su curva, hasta los 6,75 l/s.
          - valor: '124.4 m'
            mensaje: |
              Es la altura de la 25/6 a caudal nulo, el arranque de su curva.
        pista: |
          En el cruce las dos curvas dan lo mismo: sustituye 6,75 l/s en la de
          la instalación.
        desarrollo: |
          $$
          H = 10 + 0{,}614\cdot 6{,}75^{1{,}852} + 1{,}55\cdot 6{,}75^{2}
          = 10 + 21{,}1 + 70{,}6 = 101{,}7\ \text{m}
          $$

          El cuadernillo imprime 101,74 m; en la gráfica se lee lo mismo, a
          menos de una décima.

      - tipo: calcular
        titulo: El NPSH disponible en el punto de funcionamiento
        pregunta: |
          ¿Cuánto NPSH hay disponible a 6,75 l/s?
        respuesta:
          tipo: magnitud
          valor: '1.63 m'
          tolerancia: 0.03
          formato: una altura, con su unidad
        distractores:
          - valor: '3.35 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración, 1,73 m. Toda la
              tubería 1, con su codo, está antes de la bomba: 72,5 m de PVC de
              80 mm.
          - valor: '1.86 m'
            mensaje: |
              Te has dejado la presión de vapor, 2330 Pa, que son 0,24 m. El
              NPSH se cuenta sobre la presión de vapor, no sobre el cero
              absoluto.
          - valor: '1.29 m'
            mensaje: |
              Has tomado la atmósfera como 10 m de agua. Eso es 1 kg/cm²; el
              enunciado da 1 atm, 101 325 Pa, que son 10,34 m.
        pista: |
          $NPSH_d = p_{atm}/\gamma - p_v/\gamma - (z_P - z_A) - h_{f,asp}$, con
          $h_{f,asp} = 72{,}5\,J_1(140;\,80)\,Q^{1{,}852}$.
        desarrollo: |
          $$
          \frac{p_{atm}}{\gamma} = \frac{101\,325}{9800} = 10{,}339\ \text{m}
          \qquad
          \frac{p_v}{\gamma} = \frac{2330}{9800} = 0{,}238\ \text{m}
          \qquad
          h_{f,asp} = 0{,}05024\cdot 6{,}75^{1{,}852} = 1{,}726\ \text{m}
          $$
          $$
          NPSH_d = 10{,}339 - 0{,}238 - 6{,}75 - 1{,}726 = 1{,}625 \approx 1{,}63\ \text{m}
          $$

      - tipo: calcular
        titulo: El NPSH requerido en el punto de funcionamiento
        pregunta: |
          ¿Cuánto NPSH pide la bomba a 6,75 l/s, según la gráfica?
        respuesta:
          tipo: magnitud
          valor: '2.54 m'
          tolerancia: 0.05
          formato: una altura, con su unidad
        distractores:
          - valor: '2.04 m'
            mensaje: |
              Es el requerido a 6 l/s, el objetivo. La bomba trabaja a 6,75,
              y el requerido crece con el caudal: hay que leerlo en la vertical
              del punto de funcionamiento.
          - valor: '1.63 m'
            mensaje: |
              Ese es el disponible, el de la instalación. El requerido es de
              la bomba, y se lee en el panel de abajo de la gráfica.
        pista: |
          El panel del NPSH requerido va en l/s. En la tabla, 2,04 m a 6 l/s y
          2,72 m a 7.
        desarrollo: |
          En la gráfica, en la vertical de 6,75 l/s, unos 2,54 m; interpolando
          en la tabla, $2{,}04 + 0{,}75\cdot(2{,}72 - 2{,}04) = 2{,}55$ m. El
          disponible, 1,63 m, no llega: la instalación **cavita**, que es lo
          que imprime el cuadernillo.

      - tipo: dibujar
        consigna: |
          Dibuja sobre la gráfica del enunciado la curva de la instalación
          —apartado a)— y marca el punto de funcionamiento de la bomba que
          elijas, con su caudal y su altura leídos en los ejes —apartado b)—.
          Para el c), dibuja también el NPSH disponible en el panel de abajo.
        comprueba:
          - punto: >-
              La curva de la instalación arranca en 10 m a caudal nulo, no en
              el origen.
            porque: >-
              Son los 10 m de desnivel entre la lámina de A y las boquillas,
              las dos a la presión atmosférica. Empezarla en cero es dibujar
              una instalación sin desnivel, y el corte con las bombas sale con
              demasiado caudal.
          - punto: >-
              Pasa por los puntos calculados con la curva: 18,4 m a 2 l/s,
              42,8 a 4, 82,8 a 6 y 138,1 a 8, llevados al eje de m³/h
              multiplicando por 3,6.
            porque: >-
              El panel de alturas va en m³/h y la curva, en l/s. Quien pinta
              los 6 l/s en la raya de 6 m³/h dibuja una instalación 3,6 veces
              más estrecha y elige mal la bomba.
          - punto: >-
              En la vertical de 6 l/s, 21,6 m³/h, la curva pasa entre la 25/4 y
              la 25/6: la 25/4 queda por debajo y la 25/6 por encima.
            porque: >-
              Es la elección del apartado b) hecha en el dibujo: la 25/6 es la
              menor que da, a 6 l/s, más altura de la que pide la instalación.
          - punto: >-
              El punto de funcionamiento en el cruce con la 25/6, bajado a los
              dos ejes: unos 24,3 m³/h, que son 6,75 l/s, y 101,7 m.
            porque: >-
              El enunciado pide «especificar el punto de funcionamiento (Q y
              H)». Un círculo sin sus dos proyecciones no es una lectura, y el
              caudal hay que devolverlo a l/s.
          - punto: >-
              Si se dibuja, el NPSH disponible baja desde 3,35 m a caudal nulo
              y corta al requerido prácticamente en la vertical de 6 l/s (5,9
              l/s con nuestras lecturas); en la vertical del punto,
              el disponible, 1,63 m, queda por debajo del requerido, 2,54 m.
            porque: >-
              Es el apartado c) a la vista: a la derecha del cruce de las dos
              curvas de NPSH la bomba cavita, y el punto de funcionamiento está
              a la derecha. Y es el e): el cruce cae en los 6 l/s o un poco
              antes, nunca después.
        figura: |
          <figure>
          <svg viewBox="0 0 340 436" role="img" width="340" height="436" aria-labelledby="ex2021p3-6-cruce-t ex2021p3-6-cruce-d">
            <title id="ex2021p3-6-cruce-t">La curva de la instalación sobre las seis bombas: la 25/6 da el punto de funcionamiento, y en él el NPSH disponible no llega al requerido</title>
            <desc id="ex2021p3-6-cruce-d">Las seis curvas de las bombas, como en el enunciado, y en el panel de arriba la curva de la instalación, H = 10 + 0,614 por Q elevado a 1,852 más 1,55 por Q al cuadrado, que arranca en 10 m a caudal nulo y sube cada vez más deprisa. Una vertical de puntos marca los 6 l/s del objetivo: la instalación pide ahí 82,8 m, la bomba 25/4 se queda por debajo y la 25/6, más gruesa, pasa por encima. La instalación corta a la 25/6 en 6,75 l/s y 101,7 m: ese es el punto de funcionamiento, marcado con un círculo y bajado a los dos ejes. En el panel de abajo, además del NPSH requerido, la curva del NPSH disponible, que baja desde 3,35 m a caudal nulo. En la vertical del punto de funcionamiento el disponible, 1,63 m, queda por debajo del requerido, 2,54 m: la bomba cavita. Las dos curvas se cortan hacia los 6 l/s —en 5,9 con nuestras lecturas, marcado con un punto, pegado a la vertical de 6 l/s—: cerrando la válvula de impulsión no se pasa de ahí sin cavitar.</desc>
