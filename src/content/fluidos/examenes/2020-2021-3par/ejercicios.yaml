          <figcaption>La instalación corta a la 25/6 en 6,75 l/s y 101,7 m. En la vertical de 6 l/s, de puntos, la 25/4 queda por debajo de la instalación y la 25/6 por encima. Abajo, el NPSH disponible corta al requerido hacia los 6 l/s (5,9 con nuestras lecturas); en el punto de funcionamiento el disponible queda por debajo, y la bomba cavita.</figcaption>
          </figure>

      - tipo: calcular
        titulo: El NPSH disponible a 6 l/s
        pregunta: |
          Si se cierra $V_2$ hasta bajar a los 6 l/s del objetivo, ¿cuánto NPSH
          queda disponible?
        respuesta:
          tipo: magnitud
          valor: '1.96 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '3.35 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración. Cerrar $V_2$ la hace
              más pequeña, porque baja el caudal, pero no la quita: a 6 l/s
              son todavía 1,39 m.
          - valor: '2.20 m'
            mensaje: |
              Te has dejado la presión de vapor, 0,24 m. Con ella fuera, el
              disponible parece superar al requerido, y no lo supera.
        pista: |
          La misma cuenta que en el punto de funcionamiento, con $Q = 6$ l/s.
          $V_2$ está en la impulsión, así que no entra en $h_{f,asp}$.
        desarrollo: |
          $$
          h_{f,asp} = 0{,}05024\cdot 6^{1{,}852} = 1{,}387\ \text{m}
          \qquad
          NPSH_d = 10{,}339 - 0{,}238 - 6{,}75 - 1{,}387 = 1{,}96\ \text{m}
          $$

          El requerido a 6 l/s se lee en unos 2,0 m (2,04 con nuestras
          lecturas): los dos están empatados dentro de lo que deja leer la
          gráfica, porque la diferencia, 8 cm, es un píxel del panel de NPSH y
          el trazo de la curva ocupa dos o tres. Así que cerrar $V_2$ deja la
          bomba, como mucho, justo en el límite de la cavitación a 6 l/s, sin
          ningún margen, y por encima de 6 l/s el requerido ya pasa al
          disponible. Con nuestras lecturas, las dos curvas se cortan en
          5,9 l/s.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación es
              $H = 10 + 0{,}614\,Q^{1{,}852} + 1{,}55\,Q^{2}$: los 10 m de
              desnivel, las dos tuberías con sus codos por Hazen-Williams y las
              cuatro boquillas en $Q^{2}$.
          - texto: >-
              A 6 l/s pide 82,8 m: la 25/4 no llega y la 25/6 sí. Es la
              adecuada, y trabaja en 6,75 l/s y 101,7 m.
          - texto: >-
              En ese punto el NPSH disponible, 1,63 m, no llega al requerido,
              2,54 m: la bomba cavita, y no vale el apartado d) sino el e).
          - texto: >-
              Cerrando $V_2$ el caudal baja, el requerido baja y el disponible
              sube, pero se igualan hacia los 6 l/s, nunca por encima: con las
              válvulas no se consigue. Hay que bajar la bomba.
          - texto: >-
              Cerrando un poco $V_1$ se baja el caudal hasta 6 l/s sin
              cavitación, porque así se frena el agua antes de que llegue a la
              bomba.
            trampa: true
            mensaje: |
              $V_1$ está en la aspiración: su pérdida entra en $h_{f,asp}$ y
              **baja** el NPSH disponible, justo lo contrario de lo que hace
              falta. Es el último hueco del ejercicio 1 de este mismo examen:
              la válvula de regulación va en la impulsión, porque en la
              aspiración el riesgo de cavitación es mayor.
    resolucion: |
      **a) La curva de la instalación.** Balance de energía entre la lámina de
      A y la salida de las boquillas, las dos a la presión atmosférica. La
      bomba tiene que dar el desnivel, $z_B - z_A = 10$ m, más las pérdidas y
      la altura cinética con que sale el agua. Con Hazen-Williams, las
      tuberías van con $Q^{1{,}852}$, y con ellas los codos, que vienen en
      longitud equivalente. La rugosidad sale del cuadro n.º 20 y el
      coeficiente, del cuadro n.º 25 por su banda de $\varepsilon/D$: el PVC
      de 80 mm, $8{,}75\cdot 10^{-5}$, $C_{HW} = 140$; el acero comercial de
      50 mm, $1{,}2\cdot 10^{-3}$, $C_{HW} = 120$ (cómo se elige, en
      [Hazen-Williams](/road-to-ingenieria/fluidos/t19-conducciones/#hazen-williams)).

      $$
      b = (70 + 2{,}5)\,J_1(140;\,80) + (50 + 3\cdot 4)\,J_1(120;\,50) = 0{,}614
      $$

      Las boquillas van con $Q^{2}$: por cada una pasa $Q/4$, pierde su
      $k = 2$ y sale con su altura cinética,

      $$
      a = (1 + 2)\,\frac{1}{2g}\Bigl(\frac{10^{-3}}{4\cdot 7{,}854\cdot 10^{-5}}\Bigr)^{2} = 1{,}55
      $$

      y la curva, con $H$ en m y $Q$ en l/s, es la que imprime el
      cuadernillo:

      $$
      H = 10 + 0{,}614\,Q^{1{,}852} + 1{,}55\,Q^{2}
      $$

      No es una parábola, y las boquillas pesan más que las tuberías: a
      6 l/s ponen 55,8 m de los 82,8.

      **b) La bomba y el punto de funcionamiento.** A 6 l/s la instalación
      pide 82,8 m. La 25/4 da ahí 70,9 m y se queda corta; la 25/6 da 106,6 y
      llega. Es la más pequeña que cumple «6 l/s y nunca inferior», y su curva
      corta a la de la instalación en

      $$
      Q = 6{,}75\ \text{l/s}
      \qquad
      H = 101{,}74\ \text{m}
      $$

      que en el panel de la gráfica son 24,3 m³/h.

      **c) La cavitación.** Toda la tubería 1 es aspiración: 72,5 m
      equivalentes de PVC de 80 mm, que a 6,75 l/s pierden 1,73 m. Con la bomba 6,75 m por encima de
      la lámina de A,

      $$
      NPSH_d = 10{,}339 - 0{,}238 - 6{,}75 - 1{,}726 = 1{,}63\ \text{m}
      $$

      y la gráfica pide 2,54 m en esa vertical. El disponible no llega: la
      instalación **cavita**, y el camino es el del apartado e). Es el
      criterio de una instalación en funcionamiento, sin margen de
      seguridad, el de
      [Cavitación y NPSH](/road-to-ingenieria/fluidos/t25-bombeo/#cavitación-y-npsh):
      aquí no se cumple ni ese.

      **e) Con las válvulas no se arregla.** $V_1$ está en la aspiración, y
      cerrarla empeora las cosas: su pérdida baja el NPSH disponible. Cerrar
      $V_2$, en la impulsión, lleva el punto hacia la izquierda por la curva
      de la bomba: baja el caudal, con él el requerido y la pérdida de la
      aspiración, y el disponible sube. Pero las dos curvas de NPSH se cortan
      hacia los 6 l/s: a 6 l/s quedan 1,96 m disponibles y la gráfica pide
      unos 2,0 (2,04 con nuestras lecturas, que ponen el corte en 5,9 l/s).
      Esa diferencia, 8 cm, es menor que lo que se puede leer en la gráfica.
      Lo que la gráfica dice de verdad es que 6 l/s es el límite: con $V_2$
      se llega, como mucho, a trabajar en la frontera de la cavitación, sin
      margen, y nunca por encima. Por eso el cuadernillo concluye que con las
      válvulas no se consigue por encima de 6 l/s y que hay que **reducir la
      cota de la bomba**. Si tu lectura del requerido a 6 l/s da 1,9 m, estás
      en el mismo sitio: en el límite no se cumple $NPSH_d > NPSH_r$.

      **Cuánto habría que bajarla.** El cuadernillo no lo pide. Con nuestras
      lecturas, para trabajar a 6 l/s con $V_2$ cerrada hasta ahí, bastaría
      con bajarla unos centímetros —a 21,67 m con nuestras lecturas—; y para
      trabajar sin tocar la
      válvula, a 6,75 l/s, a la cota 20,83 m. Pero mover la bomba es rehacer
      la instalación, y eso es una decisión de diseño: el tema 25 pide
      entonces el margen del 1,3, y con él la cota baja a 21,06 m para 6 l/s
      y a 20,07 m para 6,75. La otra salida es la del mismo tema: acortar o
      ensanchar la aspiración, que es la que se come el NPSH. Pierde 1,73 m y
      al disponible le faltan 0,92: con un tubo de 100 mm la pérdida bajaría
      a 0,59 m, el punto se iría a 6,78 l/s y el disponible, 2,76 m, pasaría
      del requerido, 2,57, aunque sin el margen del 1,3.

      **Lo que enseña.** Elegir la bomba mirando solo el caudal lleva aquí a
      una que cavita. La gráfica trae el NPSH requerido debajo precisamente
      para eso: el punto de funcionamiento se lee en dos paneles, no en uno.
