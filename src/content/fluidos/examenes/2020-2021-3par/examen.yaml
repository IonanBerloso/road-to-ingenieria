# **Cinco de los seis.** Del cuadernillo «Exámenes 2020-2025» del
# departamento.
#
# Porcentajes impresos: 15 / 15 / 15 / 20 / 15 / 20, sin reparto por
# competencia, así que van sin `puntos`.
#
# **Falta el 6**, y queda dicho por qué: es una instalación de bombeo cuya
# bomba hay que **elegir en una gráfica** de familia de curvas —la misma
# 25/1 a 25/8 del anexo—, y de ella se leen el punto de funcionamiento, el
# rendimiento y el NPSH requerido. Sin publicar el anexo no hay ejercicio
# que transcribir. §13 caso 2.
#
# Lo que este examen aporta al corpus:
#
# - **Un factor de paso medido con un manómetro en U** (ej. 2), donde las
#   cotas de entrada y salida son datos de sobra: el manómetro ya mide
#   alturas piezométricas.
# - **Una válvula de retención que se cierra sola** (ej. 3) con el corte de
#   luz, y la comprobación de que la tubería aguanta los 355 m de
#   sobrepresión que ella misma provoca.
# - **Una tubería que se ha ido corroyendo** (ej. 4), donde la incógnita es
#   la **rugosidad** y hay que decidir en qué régimen se está para elegir
#   la fórmula: rugoso, semi-liso y liso en los tres apartados.
# - **Una red de canales construida con losas cuadradas** (ej. 5): la
#   geometría entera depende de un solo parámetro, el lado de la losa, y de
#   ahí sale el tamaño comercial.
