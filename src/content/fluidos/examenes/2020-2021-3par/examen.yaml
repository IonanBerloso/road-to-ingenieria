fecha: 3 de junio de 2021
# **Los seis.** Del cuadernillo «Exámenes 2020-2025» del departamento, págs.
# 19 a 24 (25 a 30 del PDF).
#
# Porcentajes impresos: 15 / 15 / 15 / 20 / 15 / 20, sin reparto por
# competencia: van en `puntosImpresos`, en %, y suman 100.
#
# **Hasta el 30 de septiembre de 2026 faltaba el 6**, con el motivo de que la
# bomba se elige en una familia de curvas de catálogo que no se puede
# reproducir. La hoja no se reproduce: se publican sus lecturas, tomadas con
# su rejilla (pág. 30 del PDF, imagen de 971×843 píxeles; un píxel son
# 0,32 m de altura y 0,07 m de NPSH), en una tabla bajo «Notas nuestras», y
# la gráfica redibujada con ellas. Con las tablas de la figura sale la curva
# impresa, 10 + 0,614·Q^1,852 + 1,55·Q², y con las lecturas la bomba 25/6, el
# punto de funcionamiento —6,75 l/s y 101,7 m— y la cavitación. El e) queda
# como lo imprime el cuadernillo, aunque por poco: el disponible y el
# requerido se igualan hacia los 6 l/s (en 5,9 con nuestras lecturas), y a
# 6 l/s el disponible se queda 8 cm por debajo, una diferencia menor que lo
# que se lee en la gráfica.
#
# Ese mismo día los cinco que ya estaban pasaron a ser los del cuadernillo,
# palabra por palabra, con lo que añadimos en «Notas nuestras». El 4 había
# perdido tres veces «Se deben de tener en cuenta las pérdidas menores en la
# conducción» y su nota, que va en `notas`, y le faltaba el apartado c) como
# paso; el 5 había perdido dos párrafos y la columna J de la tabla.
#
# Lo que este examen aporta al corpus:
#
# - **Un factor de paso medido con un manómetro en U** (ej. 2), donde las
#   cotas de entrada y salida son datos de sobra: el manómetro ya mide
#   alturas piezométricas.
# - **Una válvula de retención que se cierra sola** (ej. 3) con el corte de
#   luz, y la comprobación de que la tubería aguanta los 355 m de
#   sobrepresión que ella misma provoca.
# - **Una tubería que se ha ido corroyendo** (ej. 4), donde la incógnita es
#   la **rugosidad** y hay que decidir en qué régimen se está para elegir
#   la fórmula: rugoso, semi-liso y liso en los tres apartados.
# - **Una red de canales construida con losas cuadradas** (ej. 5): la
#   geometría entera depende de un solo parámetro, el lado de la losa, y de
#   ahí sale el tamaño comercial.
# - **Una bomba elegida en una gráfica que cavita** (ej. 6), con cuatro
#   boquillas que pesan más que las tuberías en la curva, y una válvula en la
#   aspiración que es la respuesta mala del ejercicio 1.
