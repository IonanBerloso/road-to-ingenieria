           aria-labelledby="fq2t fq2d">
        <title id="fq2t">La conducción de gasolina, con el venturímetro y el conjunto Pitot más piezómetro</title>
        <desc id="fq2d">Un depósito de gasolina con su lámina libre en la cota
        veinticuatro alimenta una tubería de cuatrocientos milímetros que baja
        hasta una boquilla de ochenta milímetros, situada en la cota tres, por
        la que descarga a la atmósfera. En el tramo horizontal hay dos aparatos
        de medida. Primero un venturímetro, con la garganta de doscientos
        milímetros y un manómetro en U invertida lleno de aire que da la
        lectura R. Después, un tubo de Pitot y un piezómetro abierto conectados
        entre sí por un manómetro en U con un líquido de densidad relativa s
        sub cero, cuya lectura es de medio metro.</desc>

