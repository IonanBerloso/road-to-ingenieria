      <figcaption>

      Las diez boquillas están **en paralelo y son iguales**, así que el
      conducto 2 lleva diez veces el caudal de una. Y el depósito D no es una
      salida más: según cómo quede la energía del nudo, puede recibir caudal o
      **aportarlo** — decidir el sentido de Q₃ es el apartado c).

      </figcaption>
      </figure>
    pide: La energía del nudo, los caudales de los tres conductos, el rendimiento y la presión de D.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija el caudal total de la instalación?
        opciones:
          - texto: >-
              Las diez boquillas: su presión dinámica da la velocidad de
              salida, y de ahí el caudal de cada una
            correcta: true
            mensaje: |
              Eso es, y es la puerta de entrada al problema. Una presión
              dinámica de 2,5 mcl significa
              $v^{2}/2g = 2{,}5$, es decir 7 m/s en cada boquilla; con 25 mm
              de diámetro y diez boquillas, el conducto 2 lleva 34,36 l/s.
          - texto: >-
              La bomba, a través de su curva característica
            mensaje: |
              La curva de la bomba no se da: lo que se dan son las lecturas
              de sus dos manómetros, y con ellas su altura. El caudal lo
              impone el consumo de la línea de llenado.
          - texto: >-
              El depósito D, que es el que más alto está
            mensaje: |
              D está en la cota 6 y la línea de llenado en la 12: D es el más
              bajo de los dos. Y en cualquier caso lo que fija el caudal es
              el consumo, no las cotas.

      - tipo: calcular
        titulo: La energía del nudo
        pregunta: |
          ¿Cuánta energía por unidad de volumen hay en el nudo N, en kJ/m³?
        respuesta:
          tipo: numero
          valor: '169.4'
          tolerancia: 1
          formato: un número en kilojulios por metro cúbico
        distractores:
          - valor: '147.8'
            mensaje: |
              Te has dejado las pérdidas del conducto 2. Entre el nudo y las
              boquillas hay dos codos, el rozamiento de la tubería y la
              propia boquilla: dos metros y pico de columna.
          - valor: '16.62'
            mensaje: |
              Esos son los metros de columna de mirinda, no la energía por
              unidad de **volumen**. Para pasar de una a otra hay que
              multiplicar por el peso específico, $10\,192\ \text{N/m}^{3}$.
        pista: |
          La energía en C es su cota más la presión dinámica; súmale las
          pérdidas del conducto 2 para llegar a N, y multiplica por $\gamma$.
        desarrollo: |
          $$
          v_{boq} = \sqrt{2g\cdot 2{,}5} = 7\ \text{m/s}
          \qquad
          Q_2 = 10\cdot 7\cdot 4{,}909\cdot 10^{-4} = 34{,}36\ \text{l/s}
          $$
          $$
          h_{f2} = \frac{60}{10\,192\cdot 0{,}03436} = 0{,}171\ \text{m}
          \qquad
          2\,k_{codo}\frac{v_2^{2}}{2g} = 1{,}641\ \text{m}
          \qquad
          k_{boq}\cdot 2{,}5 = 0{,}300\ \text{m}
          $$
          $$
          H_N = 12+2{,}5+2{,}112 = 16{,}62\ \text{m}
          \qquad
          B_N = 16{,}62\cdot 10\,192 = 169{,}4\ \text{kJ/m}^{3}
          $$

      - tipo: calcular
        titulo: El caudal que bombea la bomba
        pregunta: |
          ¿Cuánto lleva el conducto 1, en l/s?
        respuesta:
          tipo: magnitud
          valor: '25.25 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '34.36 l/s'
            mensaje: |
              Ese es el caudal que consumen las diez boquillas. La bomba solo
              pone tres cuartas partes; el resto lo aporta el depósito D.
          - valor: '9.11 l/s'
            mensaje: |
              Ese es el que aporta el depósito D por el conducto 3. El
              conducto 1 lleva el resto.
        pista: |
          Las dos lecturas dan la altura de la bomba; con la energía del nudo
          ya conocida, lo que falta son las pérdidas del conducto 1, que van
          con $v_1^{2}$.
        desarrollo: |
          $$
          H_m = \frac{98\,000+0{,}66\cdot 13{,}6\cdot 9800}{10\,192}
          = 18{,}25\ \text{m}
          $$
          $$
          1+18{,}25-(0{,}6+0{,}84+0{,}6)\frac{v_1^{2}}{2g} = 16{,}62
          \;\Longrightarrow\;
          \frac{v_1^{2}}{2g} = 1{,}288\ \text{m}
          $$
          $$
          v_1 = 5{,}02\ \text{m/s}
          \qquad
          Q_1 = 25{,}25\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal del tercer conducto
        pregunta: |
          ¿Cuánto vale $Q_3$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '9.11 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '59.61 l/s'
            mensaje: |
              Has sumado los dos caudales en vez de restarlos. El nudo recibe
              por 1 y por 3, y entrega por 2: la continuidad es
              $Q_1+Q_3 = Q_2$.
          - valor: '25.25 l/s'
            mensaje: |
              Ese es el del conducto 1. El 3 es lo que falta hasta los 34,36
              que se llevan las boquillas.
        pista: |
          Continuidad en el nudo, y el sentido lo dice el signo.
        desarrollo: |
          $$
          Q_3 = Q_2-Q_1 = 34{,}36-25{,}25 = 9{,}11\ \text{l/s}
          $$

          Y el signo dice que va **del depósito D al nudo**: D no recibe
          bebida, la aporta.

      - tipo: calcular
        titulo: El rendimiento de la bomba
        pregunta: |
          ¿Cuál es el rendimiento de la bomba, en tanto por ciento?
        respuesta:
          tipo: numero
          valor: '57.44'
          tolerancia: 0.5
          formato: un número en tanto por ciento
        distractores:
          - valor: '78.2'
            mensaje: |
              Parece que has usado el caudal de las boquillas, 34,36 l/s. Por
              la bomba solo pasan 25,25.
          - valor: '174'
            mensaje: |
              Has puesto la división al revés. El rendimiento es la potencia
              **útil** entre la absorbida, y la útil siempre es menor.
        pista: |
          $\eta = \gamma\,Q_1 H_m / P_{abs}$.
        desarrollo: |
          $$
          \eta = \frac{10\,192\cdot 0{,}02525\cdot 18{,}25}{8176}
          = 0{,}5744
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las diez boquillas, con 2,5 mcl de presión dinámica, consumen
              34,36 l/s, y con las pérdidas del conducto 2 el nudo queda en
              16,62 m.
          - texto: >-
              Las lecturas de los dos manómetros dan $H_m = 18{,}25$ m, y con
              ella y las pérdidas de la aspiración sale $Q_1 = 25{,}25$ l/s.
          - texto: >-
              El depósito D aporta los 9,11 l/s que faltan, y para ello ha de
              estar a 128 kPa.
          - texto: >-
              Como el depósito D está en la cota 6 y el nudo por debajo, el
              caudal baja hacia D por gravedad.
            trampa: true
            mensaje: |
              El nudo tiene una altura piezométrica de 16,62 m, muy por
              encima de la cota 6 de D. Que D pueda aportar caudal a pesar de
              eso solo se explica porque está **presurizado**: su manómetro
              marca 128 kPa, que son doce metros y medio de columna. Es el
              mismo caso que el depósito B de la ordinaria de junio de 2023:
              lo que decide si un depósito da o recibe no es su cota sino su
              altura piezométrica.
    resolucion: |
      **a) El nudo.** El consumo lo fijan las boquillas: 2,5 mcl de presión
      dinámica son 7 m/s de salida, y diez boquillas de 25 mm dan
      $Q_2 = 34{,}36$ l/s. Remontando desde la línea de llenado hasta el
      nudo:

      | concepto | metros |
      |---|---|
      | cota de la línea | 12 |
      | presión dinámica de salida | 2,5 |
      | rozamiento del conducto 2 (de los 60 W) | 0,171 |
      | dos codos, $k = 0{,}84$ | 1,641 |
      | las boquillas, $k = 0{,}12$ | 0,300 |
      | **energía en N** | **16,62 m** |

      $$
      B_N = 16{,}62\cdot 10\,192 = 169{,}4\ \text{kJ/m}^{3}
      $$

      **b) El caudal de la bomba.** Los dos manómetros dan
      $H_m = 18{,}25$ m —ojo al vacuómetro, que se suma—, y como no hay
      pérdidas entre la bomba y el nudo, todas están en la aspiración:

      $$
      1+18{,}25-2{,}04\,\frac{v_1^{2}}{2g} = 16{,}62
      \qquad
      Q_1 = 25{,}25\ \text{l/s}
      $$

      **c) El tercer conducto.** $Q_3 = 34{,}36-25{,}25 = 9{,}11$ l/s, y va
      **del depósito D al nudo**.

      **d) El rendimiento.** $\eta = 57{,}44\ \%$.

      **e) La presión de D.** Con $h_{f3} = 1$ mcl de un líquido de $s = 2$,
      que son 1,92 m de mirinda:

      $$
      6+\frac{p_D}{\gamma} = 16{,}62+1{,}92
      \qquad
      p_D = 128\ \text{kPa}
      $$

      **Lo que hay que llevarse.** El depósito D está **por debajo** del nudo
      —cota 6 frente a una altura piezométrica de 16,62— y aun así le manda
      caudal. Puede hacerlo porque está presurizado a metro y medio de
      atmósfera. En una red, «arriba» y «abajo» se miden en altura
      piezométrica, no en cota; es la misma lección que deja la red de
      cuatro barrios de junio de 2020 y el depósito B de junio de 2023.

  # ── 2 (25 %) · Un Pitot y un piezómetro juntos, y el líquido manométrico
  #    que no serviría con agua.
  - id: exflu2021-2par-2-el-pitot-y-el-piezometro-juntos
    titulo: El Pitot y el piezómetro, y el líquido que el agua se llevaría
    fuente: >-
      Ejercicio 2 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de la figura fluye **gasolina** ($s = 0{,}68$). El
      diámetro de la tubería es $D = 400$ mm. En la tubería está instalado un
      venturímetro cuyo diámetro en la garganta es 200 mm, pudiéndose
      considerar el coeficiente del venturímetro $C_v = 1$. El diámetro de la
      boquilla es $d = 80$ mm. No se van a considerar las pérdidas de carga.
      Se pide:

      **a)** Caudal circulante de gasolina (l/s).

      **b)** Lectura $R$ (m) en el venturímetro.

      **c)** Velocidad del flujo en la tubería (m/s).

      **d)** Densidad relativa $s_0$ del líquido manométrico del conjunto
      Pitot + piezómetro abierto. Deducir previamente la expresión de
      cálculo.

      **e)** Si en la instalación el fluido circulante fuera agua, ¿se podría
      utilizar la combinación Pitot + piezómetro con el líquido manométrico
      calculado en el apartado d)?

