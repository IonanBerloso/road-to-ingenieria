        llega al nudo N. Del nudo salen dos conductos. El 2 sube, con dos
        codos, hasta la línea de llenado de la cota doce, donde diez boquillas
        iguales llenan diez botellas a la vez cuando se abren las válvulas V.
        El 3 baja hasta el depósito D, cuya lámina está en la cota seis. Antes
        de la bomba hay un vacuómetro y después un manómetro.</desc>

