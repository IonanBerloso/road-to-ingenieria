        <text class="exflu2021p2-2-enun-n" x="314" y="166" text-anchor="end" fill="var(--faint)">piezómetro</text>
        <text class="exflu2021p2-2-enun-n" x="382" y="116" text-anchor="start" fill="var(--faint)">Pitot</text>
