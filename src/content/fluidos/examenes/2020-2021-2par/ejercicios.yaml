      <figcaption>

      Redibujada como la del cuadernillo, sin escala. El chorro sale del
      depósito, el álabe del carro lo desvía hacia abajo y el líquido acaba
      dentro del carro: todo el fluido que sale de un cuerpo termina en el
      otro, y en eso está la respuesta del apartado c).

      </figcaption>
      </figure>

      **Notas nuestras.** La figura da dos datos que el texto no nombra: $H$,
      la altura del
      líquido sobre el orificio del depósito, y $\alpha$, el ángulo que el
      álabe desvía el chorro, medido entre la dirección del chorro que llega,
      horizontal, y la del que sale, hacia abajo. La barra $T_3$ une el álabe
      con la pared derecha del carro, y el líquido desviado cae dentro del
      carro.
    pide: La tensión de la barra que sujeta el depósito, la del álabe y qué pasa si se unen los dos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para saber si el conjunto unido por la barra $T$ se mueve, ¿qué
          volumen de control conviene tomar?
        opciones:
          - texto: >-
              Uno que encierre **todo** el fluido, depósito y carro incluidos:
              así no hay flujo de cantidad de movimiento ni a la entrada ni a
              la salida
            correcta: true
            mensaje: |
              Eso es, y contesta sin una sola cuenta si el conjunto se mueve:
              si nada entra ni sale del volumen de control, la resultante de
              las fuerzas exteriores horizontales es nula, y el conjunto
              depósito+carro no se mueve. Lo que no dice es cuánto vale la
              barra $T$, porque es una fuerza **interior** a ese volumen: para
              eso hay que cortarla.
          - texto: >-
              Uno alrededor del carro, y otro alrededor del depósito
            mensaje: |
              Con ellos por separado salen las tensiones de los apartados a) y
              b), y también la de la barra $T$, cortándola: el depósito solo
              pide $\rho Q v$. Pero para saber si el conjunto se mueve lo
              rápido es tomarlos juntos, porque entonces el chorro queda
              **dentro** y se cancela.
          - texto: >-
              Uno alrededor del chorro solamente
            mensaje: |
              El chorro solo daría la fuerza que el fluido hace sobre el
              álabe, que ya se conoce. La pregunta es sobre el conjunto.

      - tipo: calcular
        titulo: La tensión de la barra del depósito
        pregunta: |
          Con $d = 20$ mm, $C_c = 0{,}62$, $C_v = 0{,}98$, $H = 2$ m y agua,
          ¿cuánto vale $T_1$, en N?
        respuesta:
          tipo: numero
          valor: '7.33'
          tolerancia: 0.1
          formato: un número en newton
        distractores:
          - valor: '11.83'
            mensaje: |
              Te has dejado el coeficiente de contracción. La sección del
              chorro no es la del orificio: es $C_c$ veces menor, y aquí
              $C_c$ vale 0,62.
          - valor: '3.67'
            mensaje: |
              Te has dejado el factor 2. La reacción es
              $\rho Q v = \rho\,(C_c A C_v\sqrt{2gH})(C_v\sqrt{2gH})$, y el
              $2gH$ trae ese 2 consigo.
        pista: |
          $T_1 = \rho\,Q\,v$ con $Q = C_c A C_v\sqrt{2gH}$ y
          $v = C_v\sqrt{2gH}$.
        desarrollo: |
          $$
          T_1 = \rho\,C_c A\,C_v^{2}\,2gH
          = \gamma\,\frac{\pi d^{2}}{2}\,C_c\,C_v^{2}\,H
          $$
          $$
          = 9800\cdot\frac{\pi\,0{,}02^{2}}{2}\cdot 0{,}62\cdot 0{,}9604\cdot 2
          = 7{,}33\ \text{N}
          $$

          y su sentido es **hacia la izquierda**: el chorro sale hacia la
          derecha y el depósito retrocede.

      - tipo: calcular
        titulo: La reacción del álabe con sesenta grados
        pregunta: |
          Si el álabe desvía el chorro $\alpha = 60^{\circ}$, ¿cuántas veces
          $\rho Q v$ vale el módulo de $T_3$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es $1-\cos 60^{\circ}$, que sería el módulo si solo hubiera
              componente en el eje del chorro. El álabe también lo desvía hacia
              abajo, esa componente vale $\sin\alpha$, y el módulo de la
              resultante es $\sqrt{2(1-\cos\alpha)}$.
          - valor: '2'
            mensaje: |
              Ese es el valor con $\alpha = 180^{\circ}$, el álabe que
              devuelve el chorro. Con 60º la desviación es mucho menor.
          - valor: '0.707'
            mensaje: |
              Es lo que da la expresión del cuadernillo,
              $\rho Q v\sqrt{2}\,(1-\cos\alpha)$, con la raíz solo sobre el 2.
              Es una errata: la raíz tiene que cubrir también el paréntesis,
              $\sqrt{2\,(1-\cos\alpha)}$, que a 60º vale exactamente 1.
        pista: |
          El módulo del cambio de velocidad de un chorro desviado un ángulo
          $\alpha$ es $v\sqrt{2(1-\cos\alpha)}$.
        desarrollo: |
          $$
          T_3 = \rho\,Q\,v\sqrt{2\,(1-\cos\alpha)}
          $$
          $$
          \alpha = 60^{\circ}
          \;\Longrightarrow\;
          \sqrt{2\,(1-0{,}5)} = 1
          $$

          Con sesenta grados, el módulo de la reacción es **exactamente**
          $\rho Q v$. Es el ángulo en que el triángulo de velocidades es
          equilátero.

      - tipo: calcular
        titulo: La tensión de la barra que une el depósito y el carro
        pregunta: |
          Con los datos del primer paso ($d = 20$ mm, $C_c = 0{,}62$,
          $C_v = 0{,}98$, $H = 2$ m y agua) y el álabe de 60°, se quitan $T_1$
          y $T_2$ y se unen el depósito y el carro con la barra $T$. ¿Con qué
          fuerza trabaja la barra, en N?
        respuesta:
          tipo: numero
          valor: '7.33'
          tolerancia: 0.1
          formato: un número en newton
        distractores:
          - valor: '0'
            mensaje: |
              Lo nulo es la **resultante** sobre el conjunto, y por eso no se
              mueve. La barra es interior al conjunto: cortándola, el depósito
              solo necesita $\rho Q v$ hacia la derecha, igual que cuando lo
              sujetaba $T_1$, y esa fuerza se la da ahora la barra.
          - valor: '14.66'
            mensaje: |
              Has sumado $T_1$ y $T_2$. La barra hace a la vez el trabajo de
              las dos, pero es una sola fuerza con dos extremos: tira del
              depósito con $\rho Q v$ y del carro con $\rho Q v$, y su tensión
              es $\rho Q v$.
          - valor: '3.67'
            mensaje: |
              Has tomado sobre el carro solo el empuje del álabe,
              $\rho Q v\,(1-\cos 60^{\circ})$. El líquido desviado cae dentro
              del carro y le entrega el resto de su cantidad de movimiento
              horizontal, $\rho Q v\cos 60^{\circ}$: en total $\rho Q v$, lo
              mismo que pide el depósito.
        pista: |
          Corta la barra y aísla el depósito: ¿qué fuerza horizontal necesita
          para no retroceder?
        desarrollo: |
          El depósito aislado pierde $\rho Q v$ de cantidad de movimiento por
          el orificio, así que la barra tiene que tirar de él hacia la derecha
          con $\rho Q v$. El carro aislado recibe ese mismo flujo y no deja
          salir nada, porque el líquido desviado cae dentro: la barra tira de
          él hacia la izquierda con lo mismo.

          $$
          T = \rho\,Q\,v = T_1 = 7{,}33\ \text{N}\quad\text{(tracción)}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Se toma un volumen de control que encierre todo el fluido: el
              depósito, el chorro y el carro.
          - texto: >-
              No hay flujo de cantidad de movimiento ni a la entrada ni a la
              salida de ese volumen.
          - texto: >-
              Por tanto la resultante de las fuerzas exteriores horizontales
              sobre el conjunto es nula y **el conjunto no se mueve**.
          - texto: >-
              La barra $T$, que es interior al conjunto, sí trabaja: a
              tracción, con $T = \rho\,Q\,v$, porque sujeta a la vez el
              retroceso del depósito y el empuje del chorro sobre el carro.
          - texto: >-
              Eso demuestra que las tensiones $T_1$ y $T_2$ también eran
              nulas.
            trampa: true
            mensaje: |
              No lo eran: $T_1$ vale $\gamma\pi d^{2}C_cC_v^{2}H/2$ y $T_2$,
              lo mismo en sentido contrario. Al unir los dos cuerpos esas dos
              fuerzas no desaparecen: las hace ahora la barra $T$, que tira
              del depósito hacia la derecha y del carro hacia la izquierda y
              trabaja a tracción con $T = T_1$. Lo que se anula es la
              **resultante** sobre el conjunto, y por eso no se mueve. Es la
              diferencia entre «las fuerzas son nulas» y «la resultante es
              nula», y es justo lo que el apartado quiere que distingas.
    resolucion: |
      **a) La barra del depósito.** El depósito pierde cantidad de movimiento
      por el orificio, y la barra tiene que sujetarlo. Con
      $v = C_v\sqrt{2gH}$ y $Q = C_c A\,v$:

      $$
      T_1 = \rho\,Q\,v = \gamma\,\frac{\pi d^{2}}{2}\,C_c\,C_v^{2}\,H
      \qquad(\leftarrow)
      $$

      **b) El álabe.** El chorro llega horizontal con velocidad $v$ y sale
      con la misma —chorro libre, sin pérdidas y sin contar lo que cae entre
      el orificio y el álabe— desviado hacia abajo un ángulo $\alpha$. El
      cambio de velocidad tiene componentes $v\,(\cos\alpha - 1)$ y
      $-v\sin\alpha$, y su módulo es $v\sqrt{2(1-\cos\alpha)}$:

      $$
      T_3 = \rho\,Q\,v\,\sqrt{2\,(1-\cos\alpha)}
      $$

      El chorro empuja el álabe hacia la derecha y hacia arriba, con
      $\rho Q v\,(1-\cos\alpha)$ y $\rho Q v\sin\alpha$: una fuerza a
      $90^{\circ}-\alpha/2$ de la horizontal. La que la barra $T_3$ hace
      sobre el álabe es igual y de sentido contrario. El cuadernillo imprime
      $T_3 = \rho\cdot Q\cdot v\cdot\sqrt{2}\cdot(1-\cos\alpha)$, con la raíz
      solo sobre el 2: tiene que alcanzar también al paréntesis. Con
      $\alpha = 60^{\circ}$ lo impreso daría $0{,}71\,\rho Q v$, y componer
      los dos vectores da exactamente $\rho Q v$.

      **c) Y si se unen los dos.** Tomando un volumen de control que encierre
      **todo** el fluido —el del depósito, el chorro, el que baña el álabe y
      el que cae dentro del carro— no hay flujo de cantidad de movimiento ni a
      la entrada ni a la salida. La resultante de las fuerzas exteriores
      horizontales es nula, así que el conjunto depósito+carro **no se
      mueve**, que es lo que imprime el cuadernillo. La barra $T$, en cambio,
      es interior a ese volumen, y para saber su tensión hay que cortarla: el
      depósito, aislado, sigue necesitando $\rho Q v$ hacia la derecha, y el
      carro lo mismo hacia la izquierda. La barra trabaja a **tracción** con

      $$
      T = \rho\,Q\,v = \gamma\,\frac{\pi d^{2}}{2}\,C_c\,C_v^{2}\,H
      $$

      la misma fuerza que antes hacían $T_1$ y $T_2$ contra las paredes. En
      el carro no importa el ángulo del álabe, porque el líquido desviado cae
      dentro: el álabe recibe $\rho Q v\,(1-\cos\alpha)$, y el líquido, al
      caer y pararse en el carro, le entrega el resto de su cantidad de
      movimiento horizontal, $\rho Q v\cos\alpha$. Entra $\rho Q v$ y no sale
      nada. Si el álabe lanzara el chorro fuera del carro, el carro solo
      recibiría la primera parte y el conjunto no quedaría en equilibrio.

      **Lo que enseña, y no es poco.** El chorro empuja el depósito hacia la
      izquierda con la misma fuerza con que empuja el carro hacia la derecha:
      son acción y reacción a través del propio fluido, y por eso el conjunto
      no se mueve aunque la barra que lo une esté cargada. Un cohete no
      avanzaría si llevara delante una pantalla que recogiera su propio
      chorro, y el soporte de la pantalla sí notaría el empujón. El volumen de
      control que lo encierra todo dice si el conjunto se mueve; la fuerza de
      una barra solo sale cortándola.

  # ── 4 (25 %) · Un aerosol en un aula y una válvula que se comporta igual
  #    con agua que con mercurio.
  - id: exflu2021-2par-4-el-aerosol-y-la-valvula-con-mercurio
    titulo: El aerosol del aula, y la válvula que da igual con qué fluido
    fuente: >-
      Ejercicio 4 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no el desarrollo.
    nivel: examen
    enunciado: |
      Responder **justificadamente** a las siguientes preguntas
      **independientes** sobre problemas de análisis dimensional y teoría de
      modelos. Si fuera necesario, basar las respuestas en los números
      adimensionales apropiados de entre los habituales.

      **a)** Para estudiar la diseminación de un virus en un aula por medio de
      la dispersión en aerosoles, y determinar su concentración $C$ (g/ml), se
      va a considerar que dicha concentración depende de las siguientes
      variables: el diámetro $D$, la tensión superficial $\sigma$ y la
      densidad $\rho$ de las pequeñas gotas en suspensión, de la sección o
      área total $A$ de ventilación (suma de ventanas y puertas), de las
      velocidades horizontal $v$ y vertical $w$ generadas por la ventilación,
      y por último de la viscosidad cinemática $\nu$ del aire. Seleccionar
      justificadamente un grupo de variables repetidas adecuado, y determinar
      los parámetros adimensionales que caracterizarán el sistema.

      **b)** En el laboratorio de la escuela se ha observado que cuando fluye
      un caudal de agua de 10 l/s a través de una válvula la pérdida de carga
      es de 1,2 kPa. ¿Cuál es el caudal (m³/s) si a través de la misma
      válvula fluye mercurio y se ha observado una pérdida de carga de 1,22
      mca?
    pide: Los adimensionales del aerosol, y el caudal de mercurio por la misma válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b), ¿qué propiedad de la válvula permite pasar de un
          fluido a otro?
        opciones:
          - texto: >-
              Que su factor de paso es **adimensional**, así que la relación
              $\Delta p/(\rho v^{2})$ es la misma con cualquier fluido
            correcta: true
            mensaje: |
              Eso es. Un $k$ es un número puro que solo depende de la
              geometría y —débilmente— del Reynolds. Mientras el régimen sea
              turbulento, la misma válvula relaciona igual la pérdida con la
              altura cinética, dé lo mismo lo que circule.
          - texto: >-
              Que la pérdida de carga es la misma en los dos casos
            mensaje: |
              No lo es: 1,2 kPa con agua y 1,22 mca —unos 12 kPa— con
              mercurio. Lo que se conserva es el **coeficiente**, no la
              pérdida.
          - texto: >-
              Que el mercurio y el agua tienen la misma viscosidad cinemática
            mensaje: |
              No la tienen, pero da igual: en régimen turbulento plenamente
              desarrollado el factor de paso apenas depende del Reynolds, y
              esa es la hipótesis que hace posible el problema.

      - tipo: calcular
        titulo: Cuántos adimensionales tiene el aerosol
        pregunta: |
          ¿Cuántos parámetros adimensionales caracterizan el problema del
          aula?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              Ocho son las variables: $C$, $D$, $\sigma$, $\rho$, $A$, $v$,
              $w$ y $\nu$. El teorema resta las tres dimensiones
              independientes.
          - valor: '4'
            mensaje: |
              Te falta una variable, casi seguro una de las dos velocidades:
              $v$ y $w$ tienen las mismas dimensiones, pero son dos variables
              distintas del fenómeno, y la segunda da su propio grupo, $w/v$.
        pista: |
          $n-k$, y cuidado con contar bien las variables.
        desarrollo: |
          Ocho variables y tres dimensiones dan **cinco** grupos. Con
          $\rho$, $D$ y $v$ como repetidas:

          $$
          \frac{\sigma}{\rho\,D\,v^{2}}
          \qquad
          \frac{\nu}{D\,v}
          \qquad
          \frac{C}{\rho}
          \qquad
          \frac{A}{D^{2}}
          \qquad
          \frac{w}{v}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) entero en papel: las variables con sus dimensiones,
          cuántos grupos salen, el grupo de variables repetidas elegido **y
          justificado** —el enunciado lo pide así, «seleccionar
          justificadamente»— y cada parámetro despejado por el teorema de pi.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si en tu folio están los cinco mínimos, el apartado a) está entero.
          Mira dos cosas de este en concreto: que la concentración, en g/ml,
          quede escrita como una densidad, $ML^{-3}$, en la tabla, y que la
          elección de $\rho$, $D$ y $v$ vaya justificada con las tres
          dimensiones y no solo enunciada, porque es lo que el enunciado pide
          con la palabra «justificadamente».

      - tipo: calcular
        titulo: El caudal de mercurio
        pregunta: |
          ¿Qué caudal de mercurio pasa por esa válvula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '8.56 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '116.4 l/s'
            mensaje: |
              Has puesto el cociente de densidades multiplicando. De
              $\Delta p = k\rho v^{2}/2$ sale $v^{2} = 2\Delta p/(k\rho)$: con
              la misma válvula, el fluido más denso pasa **más despacio** para
              la misma pérdida, no más deprisa.
          - valor: '31.6 l/s'
            mensaje: |
              Parece que has usado solo la relación de pérdidas, sin dividir
              por la densidad. En $\Delta p = k\rho v^{2}/2$, la densidad está
              en el mismo lado que la velocidad.
        pista: |
          Con $k$ constante, $\Delta p = k\rho v^{2}/2$, así que
          $Q \propto \sqrt{\Delta p/\rho}$. Y ojo: 1,22 mca son metros de
          columna de **agua**.
        desarrollo: |
          $$
          \Delta p_{Hg} = 1{,}22\cdot 9800 = 11\,956\ \text{Pa}
          $$
          $$
          \frac{Q_{Hg}}{Q_{ag}} = \sqrt{\frac{\Delta p_{Hg}/\rho_{Hg}}
          {\Delta p_{ag}/\rho_{ag}}}
          = \sqrt{\frac{11\,956/13\,600}{1200/1000}} = 0{,}856
          $$
          $$
          Q_{Hg} = 8{,}56\ \text{l/s} = 8{,}56\cdot 10^{-3}\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena las dos respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\rho$, $D$ y $v$ como repetidas, los cinco grupos del aula
              son el inverso de Weber, el inverso de Reynolds, la
              concentración relativa, el área de ventilación relativa y la
              relación de velocidades.
          - texto: >-
              La concentración, medida en g/ml, es una densidad, así que
              $C/\rho$ ya es adimensional.
          - texto: >-
              En la válvula, el factor de paso es adimensional, así que
              $Q\propto\sqrt{\Delta p/\rho}$ y el mercurio pasa a 8,56 l/s.
          - texto: >-
              Como el mercurio es mucho más denso, por la misma válvula pasa
              mucho más caudal.
            trampa: true
            mensaje: |
              Pasa **menos**, no más: 8,56 frente a 10 l/s. La densidad está
              en el denominador de $\sqrt{\Delta p/\rho}$, porque es más
              difícil acelerar un fluido pesado. Que la pérdida medida en
              pascales sea diez veces mayor no compensa que el fluido sea 13,6
              veces más denso.
    resolucion: |
      **a) El aerosol.** Ocho variables —$C$, $D$, $\sigma$, $\rho$, $A$,
      $v$, $w$, $\nu$— y tres dimensiones dan cinco grupos. Las repetidas
      naturales son $\rho$, $D$ y $v$: cubren masa, longitud y tiempo de
      forma independiente, y ninguna de las tres es la magnitud que se quiere
      estudiar.

      $$
      \Pi_1 = \frac{\sigma}{\rho\,D\,v^{2}}
      \qquad
      \Pi_2 = \frac{\nu}{D\,v}
      \qquad
      \Pi_3 = \frac{C}{\rho}
      $$
      $$
      \Pi_4 = \frac{A}{D^{2}}
      \qquad
      \Pi_5 = \frac{w}{v}
      $$

      El primero es el inverso del número de **Weber** —la tensión
      superficial frente a la inercia, que es lo que decide si una gota se
      rompe—; el segundo, el inverso de **Reynolds**; el tercero, la
      concentración hecha adimensional con la densidad de la gota; el cuarto,
      el área de ventilación relativa al tamaño de gota; y el quinto, cuánto
      hay de corriente vertical frente a horizontal. El cuadernillo imprime
      el primero como $\sigma/(\rho\cdot d\cdot v^{2})$, con una $d$
      minúscula que es el diámetro $D$ de las gotas.

      **b) La válvula.** El factor de paso es un número puro:

      $$
      \Delta p = k\,\frac{\rho\,v^{2}}{2}
      \qquad\Longrightarrow\qquad
      Q \propto \sqrt{\frac{\Delta p}{\rho}}
      $$
      $$
      Q_{Hg} = 10\sqrt{\frac{11\,956/13\,600}{1200/1000}}
      = 8{,}56\ \text{l/s}
      $$

      Los 1,22 mca son columna de agua, 11.956 Pa, aunque lo que circule sea
      mercurio
      ([Una columna en mca es siempre de agua](/road-to-ingenieria/fluidos/t04-hidrostatica/#una-columna-en-mca-es-siempre-de-agua)).

      **Y por qué esto es más que una regla de tres.** Que un coeficiente sea
      adimensional significa que **describe la geometría, no el fluido**. Una
      válvula caracterizada con agua en el laboratorio sirve para dimensionar
      una instalación de mercurio, de gasolina o de glicerina, con la única
      condición de que el régimen siga siendo turbulento. Esa transferibilidad
      es lo que hace útiles los catálogos de accesorios, y es la razón de que
      las pérdidas menores se tabulen como $k$ y no como metros.
