ejercicios:
  # ── 1 (25 %) · Una embotelladora: el consumo lo fijan diez boquillas y el
  #    depósito intermedio pone lo que a la bomba le falta.
  - id: exflu2021-2par-1-la-embotelladora-de-diez-boquillas
    titulo: La embotelladora de diez boquillas, y el depósito que ayuda
    fuente: >-
      Ejercicio 1 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la imagen se puede ver una instalación de bombeo que se usa para
      embotellar mirinda. La mirinda es una bebida ácida ligeramente
      refrescante cuya densidad es $s = 1{,}04$. Sabiendo que en la planta de
      la imagen se pueden rellenar hasta 10 botellas de forma simultánea,
      abriendo las válvulas V de diámetro $D = 100$ mm, calcular:

      **a)** Energía por unidad de volumen del nudo N, sabiendo que la
      presión dinámica a la salida de cada boquilla es de 2,5 mcl.

      **b)** Calcular el caudal del conducto 1, sabiendo que las lecturas del
      vacuómetro y del manómetro son de 66 cmcHg y $1\ \text{kg/cm}^{2}$,
      respectivamente.

      **c)** Sentido y valor del caudal $Q_3$.

      **d)** Rendimiento de la bomba, sabiendo que la potencia absorbida es
      de 8176 W.

      **e)** Presión en el depósito D.

      **DATOS**: $D_1 = 80$ mm, $D_2 = 100$ mm, $D_3 = 125$ mm,
      $D_{boquilla} = 25$ mm, $k_{sal\ dep} = 0{,}6$, $k_{codo} = 0{,}84$,
      $k_{\text{válv}} = 0{,}73$, $k_{boq} = 0{,}12$, $k_1 = 0{,}6$,
      $P_{perd2} = 60$ W, $h_{f3} = 1$ mcl ($s = 2$), $P_{atm} = 1$ bar.

      <figure class="figura-examen">
      <svg viewBox="0 0 470 290" role="img" width="470" height="290" aria-labelledby="exflu2021p2-1-enun-t exflu2021p2-1-enun-d">
        <title id="exflu2021p2-1-enun-t">La instalación de embotellado del ejercicio 1: del depósito A al nudo N por la bomba, y del nudo a las boquillas y al depósito cerrado D</title>
        <desc id="exflu2021p2-1-enun-d">Esquema sin escala, dibujado como el del cuadernillo. Abajo a la izquierda, el depósito A, abierto, con la lámina en la cota 1. Del fondo de su pared derecha sale el conducto 1 por una salida de depósito, sube, gira en un codo y sigue en horizontal: pasa por el vacuómetro P1, la bomba P y el manómetro P2, y llega al nudo N. Del nudo, el conducto 2 sube, gira en un codo, sigue en horizontal y gira en otro codo hacia abajo, hasta un colector del que cuelgan las boquillas, cada una con su válvula V; hay dibujadas cuatro, con una línea quebrada en medio que indica que siguen hasta diez. La salida de las boquillas, el punto C, está en la cota 12. Del nudo, el conducto 3 baja, gira en un codo y va en horizontal hasta la parte baja de la pared izquierda del depósito D, que está cerrado, tiene la lámina en la cota 6 y lleva un manómetro, PD, en la pared.</desc>
