      <svg viewBox="0 0 490 240" role="img" width="490" height="240" aria-labelledby="exflu2021p2-2-enun-t exflu2021p2-2-enun-d">
        <title id="exflu2021p2-2-enun-t">La conducción de gasolina del ejercicio 2, con el venturímetro y su manómetro de aire, y el conjunto de piezómetro y Pitot con su manómetro en U</title>
        <desc id="exflu2021p2-2-enun-d">Esquema sin escala, dibujado como el del cuadernillo. A la izquierda, un depósito abierto de gasolina de densidad relativa 0,68 con la lámina, rotulada 0, en la cota 24 metros. De su parte baja sale una tubería horizontal, de 400 milímetros, que acaba a la derecha en una boquilla por la que sale un chorro a la atmósfera, con el eje en la cota 3 metros. En la tubería hay primero un venturímetro: se estrecha hasta la garganta y se vuelve a abrir. Encima, un manómetro en U invertida lleno de aire arriba, con una rama conectada a la tubería antes del estrechamiento y la otra a la garganta; la gasolina sube más en la rama de la tubería, y la diferencia de niveles es la lectura R. Después, por debajo de la tubería, dos tomas unidas por un manómetro en U con un líquido de densidad relativa s sub cero: aguas arriba una toma en la pared, el piezómetro, y aguas abajo un tubo de Pitot que entra por abajo, sube hasta el eje y se dobla con la boca abierta de cara al flujo, hacia el depósito. En la U el líquido manométrico queda más bajo en la rama del Pitot, y la diferencia entre las dos ramas es de 0,5 metros.</desc>
