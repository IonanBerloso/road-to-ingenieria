      <figcaption>

      Redibujada como la del cuadernillo, sin escala. Los dos manómetros miden
      cosas distintas y por eso llevan líquidos distintos. El del venturímetro
      es una **U invertida con aire**, que basta para una diferencia de alturas
      piezométricas entre la tubería y la garganta. El del conjunto Pitot más
      piezómetro mide la **presión dinámica**, que es mucho menor, y por eso
      necesita un líquido elegido a propósito. La boca del Pitot mira hacia el
      depósito, de cara al flujo.

      </figcaption>
      </figure>

      **Notas nuestras.** Datos de la figura: la lámina del depósito,
      rotulada 0, está en la cota 24 m y el eje del chorro de la boquilla, en
      la cota 3 m. El
      manómetro del venturímetro es una U invertida con aire en la parte de
      arriba («Aire/Airea» en la figura), con una rama conectada a la tubería
      antes del estrechamiento y la otra a la garganta; la diferencia de
      niveles entre las dos ramas es la lectura $R$. El conjunto Pitot más
      piezómetro va por debajo de la tubería: aguas arriba, una toma en la
      pared, que es el piezómetro; aguas abajo, el Pitot, que entra en la
      tubería y se dobla con la boca abierta de cara al flujo. Los une una U
      con el líquido manométrico $s_0$, más bajo en la rama del Pitot, y la
      diferencia de niveles es de 0,5 m.
    pide: El caudal, la lectura del venturímetro, la velocidad en la tubería, la densidad del líquido manométrico y si serviría con agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin pérdidas de carga, ¿qué fija el caudal de la instalación?
        opciones:
          - texto: >-
              Solo el desnivel entre la superficie del depósito y la salida
              de la boquilla, que se convierte entero en velocidad de salida
            correcta: true
            mensaje: |
              Eso es. Sin pérdidas, Torricelli puro: 21 metros de desnivel
              dan 20,3 m/s en la boquilla de 80 mm y con eso 102 l/s. El
              venturímetro y el Pitot son **medidores**, no obstáculos: no
              intervienen en el caudal.
          - texto: >-
              El venturímetro, que estrangula el paso
            mensaje: |
              El venturímetro estrecha y vuelve a ensanchar; sin pérdidas
              recupera toda la presión y no limita nada. Está ahí para medir,
              no para regular.
          - texto: >-
              El diámetro de la tubería, 400 mm
            mensaje: |
              La tubería es cinco veces más ancha que la boquilla, así que
              lo que estrangula es la salida. Por eso el enunciado da el
              diámetro de la boquilla.

      - tipo: calcular
        titulo: El caudal circulante
        pregunta: |
          ¿Cuánta gasolina circula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '102 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '2550 l/s'
            mensaje: |
              Has usado el diámetro de la tubería, 400 mm, como sección de
              salida. Lo que descarga es la boquilla, de 80.
          - valor: '109 l/s'
            mensaje: |
              Parece que has usado los 24 m de cota del depósito como salto.
              La boquilla descarga en la cota 3, así que el desnivel es 21.
        pista: |
          Torricelli entre la superficie y la boquilla: 21 m de desnivel.
        desarrollo: |
          $$
          v_{boq} = \sqrt{2g\cdot 21} = 20{,}29\ \text{m/s}
          \qquad
          Q = 20{,}29\cdot 5{,}027\cdot 10^{-3} = 102\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La lectura del venturímetro
        pregunta: |
          ¿Cuánto marca el venturímetro, en metros?
        respuesta:
          tipo: numero
          valor: '0.504'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '0.0336'
            mensaje: |
              Esa es la altura cinética de la **tubería**,
              $v^{2}/2g$ con 0,81 m/s. El venturímetro mide la diferencia
              entre la garganta y la tubería, y en la garganta la velocidad
              es cuatro veces mayor.
          - valor: '0.538'
            mensaje: |
              Te has dejado el término $(A_2/A_1)^{2}$ del denominador. Con
              una relación de diámetros de 2 ese factor vale 0,0625, y
              quitarlo cambia el resultado casi un 7 %.
        pista: |
          $Q = C_v A_2\sqrt{2gR/[1-(A_2/A_1)^{2}]}$, con $R$ en metros de
          gasolina.
        desarrollo: |
          $$
          A_2 = 0{,}0314\ \text{m}^{2}
          \qquad
          \Bigl(\frac{A_2}{A_1}\Bigr)^{2} = 0{,}0625
          $$
          $$
          0{,}102 = 0{,}0314\sqrt{\frac{19{,}6\,R}{0{,}9375}}
          \;\Longrightarrow\;
          R = 0{,}504\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad en la tubería
        pregunta: |
          ¿A qué velocidad va la gasolina por la tubería de 400 mm, en m/s?
        respuesta:
          tipo: magnitud
          valor: '0.81 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '20.3 m/s'
            mensaje: |
              Esa es la velocidad de salida por la boquilla, la de Torricelli.
              La tubería es cinco veces más ancha que la boquilla, así que su
              sección es veinticinco veces mayor y la velocidad, veinticinco
              veces menor.
          - valor: '3.25 m/s'
            mensaje: |
              Esa es la de la garganta del venturímetro, de 200 mm. La
              tubería tiene 400.
        pista: |
          Continuidad: el mismo caudal por la sección de 400 mm.
        desarrollo: |
          $$
          v = \frac{Q}{A} = \frac{0{,}102}{0{,}1257} = 0{,}81\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La densidad del líquido manométrico
        pregunta: |
          ¿Qué densidad relativa tiene el líquido del conjunto Pitot +
          piezómetro?
        respuesta:
          tipo: numero
          valor: '0.726'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.747'
            mensaje: |
              Has igualado la lectura en columna de agua, $R\,(s_0 - s)$, a la
              altura cinética en columna de gasolina. Hay que escribir las dos
              en la misma: $R\,(s_0 - s) = s\,v^{2}/2g$, o, dividiendo por $s$,
              $R\,(s_0/s - 1) = v^{2}/2g$.
          - valor: '1.067'
            mensaje: |
              Has hecho la cuenta como si por la tubería fuera agua, con
              $s = 1$. El factor del manómetro es $s_0/s - 1$ con la densidad
              del fluido que circula, y la gasolina tiene 0,68.
        pista: |
          El Pitot menos el piezómetro es la altura cinética de la tubería;
          el manómetro la lee como $R_0\,(s_0/s-1)$ con $R_0 = 0{,}5$ m.
        desarrollo: |
          $$
          \frac{v^{2}}{2g} = \frac{0{,}81^{2}}{19{,}6} = 0{,}0336\ \text{m}
          $$
          $$
          0{,}0336 = 0{,}5\Bigl(\frac{s_0}{0{,}68}-1\Bigr)
          \;\Longrightarrow\;
          s_0 = 0{,}726
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          La expresión que pide el apartado d) antes de la cuenta: «deducir
          previamente la expresión de cálculo». Qué mide cada toma del
          conjunto, Bernoulli hasta la boca del Pitot, la hidrostática del
          manómetro en U y la relación entre la lectura, las dos densidades y
          la velocidad de la tubería.
        rubrica: velocidad-con-un-pitot
        veredicto: |
          Si en tu folio están los cuatro mínimos, la expresión vale para el
          d) y contesta de paso el e): con $s_0$ menor que la densidad del
          fluido que circula, la U normal no funciona. Aquí la velocidad de la
          boca del Pitot se toma igual a la media de la tubería, $Q/A$: es lo
          que permite el flujo ideal, sin pérdidas, del enunciado, y dilo en
          una línea, porque en un flujo real el Pitot da la velocidad de un
          punto y no la media.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              El líquido manométrico calculado tiene $s_0 = 0{,}726$, algo más
              denso que la gasolina y por eso se queda abajo en la U.
          - texto: >-
              Con agua circulando, ese mismo líquido sería **más ligero** que
              el fluido de la tubería.
          - texto: >-
              **No se podría usar**: flotaría y el agua lo arrastraría fuera
              del tubo manométrico.
          - texto: >-
              Sí se podría usar tal cual: con agua el factor $s_0/s - 1$ sale
              negativo, y basta con leer la lectura en sentido contrario.
            trampa: true
            mensaje: |
              Un factor negativo no es una lectura al revés: dice que el
              líquido manométrico, $s_0 = 0{,}726$, es más ligero que el agua
              de la tubería. En una U por debajo de la tubería no se queda en
              el fondo: sube por las ramas hasta la tubería y el flujo se lo
              lleva, y no queda menisco que leer. Es lo que imprime el
              cuadernillo, «el agua arrastraría el líquido manométrico». Un
              manométrico más ligero que el fluido solo sirve en una U
              invertida, por encima de la tubería, y eso ya no es la
              combinación de la figura; además, con agua su factor sería
              $1 - 0{,}726 = 0{,}274$, cuatro veces el 0,067 de ahora, y la
              misma altura cinética se leería con 12 cm en vez de con 50.
    resolucion: |
      **a) El caudal.** Sin pérdidas, la instalación es un Torricelli con 21
      metros de desnivel:

      $$
      v_{boq} = \sqrt{2g\cdot 21} = 20{,}29\ \text{m/s}
      \qquad
      Q = 102\ \text{l/s}
      $$

      **b) El venturímetro.** Con $C_v = 1$ y la relación de áreas
      $(A_2/A_1)^{2} = 0{,}0625$, la expresión de la Ayuda da

      $$
      R = 0{,}504\ \text{m}
      $$

      en columna de gasolina: el aire de la U invertida apenas pesa, y la
      lectura es la diferencia de alturas piezométricas.

      **c) La velocidad en la tubería.** Por continuidad,
      $v = Q/A = 0{,}102/0{,}1257 = 0{,}81$ m/s.

      **d) El líquido del Pitot.** El Pitot se reconoce por su boca, abierta
      de cara al flujo
      ([Reconocer un Pitot en un esquema](/road-to-ingenieria/fluidos/t13-medidores/#reconocer-un-pitot-en-un-esquema)):
      mide la altura total, y el piezómetro, la piezométrica. Su diferencia
      es la altura cinética de la tubería, minúscula porque la tubería es muy
      ancha:

      $$
      \frac{v^{2}}{2g} = 0{,}0336\ \text{m}
      $$

      Y el manómetro la lee con 0,5 m de columna, así que el factor de
      amplificación es de casi quince:

      $$
      0{,}0336 = 0{,}5\Bigl(\frac{s_0}{0{,}68}-1\Bigr)
      \qquad
      s_0 = 0{,}726
      $$

      **e) Con agua no.** Ese líquido pesa menos que el agua, así que
      flotaría: el agua lo arrastraría fuera del tubo manométrico y el
      aparato dejaría de funcionar. Habría que elegir otro apenas más denso
      que el agua —o montar el manómetro en U invertida con uno más ligero—.

      **Lo que enseña.** La sensibilidad de un manómetro diferencial no la da
      su tamaño: la da lo **parecidas** que sean las dos densidades. Aquí
      0,726 frente a 0,68 son un 6,7 % de diferencia, y por eso tres
      centímetros y medio de altura cinética se leen como medio metro de
      columna. Cambiar el fluido que circula obliga a cambiar también el
      manométrico, y no por una cuestión de escala sino de que si no, se lo
      lleva.

  # ── 3 (25 %) · Un carro con un álabe alimentado por un depósito, y la
  #    pregunta que se responde sin calcular.
  - id: exflu2021-2par-3-el-carro-con-el-alabe
    titulo: El carro con el álabe, y por qué no se mueve
    fuente: >-
      Ejercicio 3 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El depósito de la izquierda alimenta un carro que dispone de un álabe
      unido al carro que desvía el flujo de un líquido de peso específico
      $\gamma$, tal y como se muestra en la figura adjunta. El depósito es
      circular de diámetro $D$ y dispone de un orificio de diámetro $d$ y de
      coeficientes $C_c$ y $C_v$ conocidos. El carro es de sección
      rectangular de base, cuyos lados son $a$ y $b$. El depósito está unido
      a la pared izquierda por medio de una barra metálica ($T_1$) y el carro
      está unido a la pared derecha por medio de una barra metálica $T_2$. Se
      pide calcular en función de las variables indicadas:

      **a)** Tensión de la barra $T_1$ (módulo, dirección y sentido).

      **b)** Reacción en el álabe unido a la barra $T_3$ (módulo, dirección y
      sentido).

      **c)** Si quitásemos las barras $T_1$ y $T_2$ y uniésemos el depósito y
      el carro por una barra metálica $T$, indicar la tensión a que estaría
      sometida la barra $T$.

