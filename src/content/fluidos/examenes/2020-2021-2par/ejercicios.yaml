        <text x="16" y="124" text-anchor="end" font-size="10.5" fill="var(--faint)">21 m</text>

        <defs>
          <marker id="fq2f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      Los dos manómetros miden cosas distintas y por eso llevan líquidos
      distintos. El del venturímetro es una **U invertida con aire**, que basta
      para una diferencia de presiones estáticas. El del conjunto Pitot más
      piezómetro mide la **presión dinámica**, que es mucho menor, y por eso
      necesita un líquido elegido a propósito.

      </figcaption>
      </figure>
    pide: El caudal, las dos lecturas y la densidad del líquido manométrico del Pitot.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin pérdidas de carga, ¿qué fija el caudal de la instalación?
        opciones:
          - texto: >-
              Solo el desnivel entre la superficie del depósito y la salida
              de la boquilla, que se convierte entero en velocidad de salida
            correcta: true
            mensaje: |
              Eso es. Sin pérdidas, Torricelli puro: 21 metros de desnivel
              dan 20,3 m/s en la boquilla de 80 mm y con eso 102 l/s. El
              venturímetro y el Pitot son **medidores**, no obstáculos: no
              intervienen en el caudal.
          - texto: >-
              El venturímetro, que estrangula el paso
            mensaje: |
              El venturímetro estrecha y vuelve a ensanchar; sin pérdidas
              recupera toda la presión y no limita nada. Está ahí para medir,
              no para regular.
          - texto: >-
              El diámetro de la tubería, 400 mm
            mensaje: |
              La tubería es cuatro veces más ancha que la boquilla, así que
              lo que estrangula es la salida. Por eso el enunciado da el
              diámetro de la boquilla.

      - tipo: calcular
        titulo: El caudal circulante
        pregunta: |
          ¿Cuánta gasolina circula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '102 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '2550 l/s'
            mensaje: |
              Has usado el diámetro de la tubería, 400 mm, como sección de
              salida. Lo que descarga es la boquilla, de 80.
          - valor: '109 l/s'
            mensaje: |
              Parece que has usado los 24 m de cota del depósito como salto.
              La boquilla descarga en la cota 3, así que el desnivel es 21.
        pista: |
          Torricelli entre la superficie y la boquilla: 21 m de desnivel.
        desarrollo: |
          $$
          v_{boq} = \sqrt{2g\cdot 21} = 20{,}29\ \text{m/s}
          \qquad
          Q = 20{,}29\cdot 5{,}027\cdot 10^{-3} = 102\ \text{l/s}
          $$

          Y la velocidad en la tubería, con 400 mm,
          $v = 102/125{,}66 = 0{,}81$ m/s.

      - tipo: calcular
        titulo: La lectura del venturímetro
        pregunta: |
          ¿Cuánto marca el venturímetro, en metros?
        respuesta:
          tipo: numero
          valor: '0.504'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '0.0336'
            mensaje: |
              Esa es la altura cinética de la **tubería**,
              $v^{2}/2g$ con 0,81 m/s. El venturímetro mide la diferencia
              entre la garganta y la tubería, y en la garganta la velocidad
              es cuatro veces mayor.
          - valor: '0.538'
            mensaje: |
              Te has dejado el término $(A_2/A_1)^{2}$ del denominador. Con
              una relación de diámetros de 2 ese factor vale 0,0625, y quitar
              el 1 menos cambia el resultado un 6 %.
        pista: |
          $Q = C_v A_2\sqrt{2gR/[1-(A_2/A_1)^{2}]}$, con $R$ en metros de
          gasolina.
        desarrollo: |
          $$
          A_2 = 0{,}0314\ \text{m}^{2}
          \qquad
          \Bigl(\frac{A_2}{A_1}\Bigr)^{2} = 0{,}0625
          $$
          $$
          0{,}102 = 0{,}0314\sqrt{\frac{19{,}6\,R}{0{,}9375}}
          \;\Longrightarrow\;
          R = 0{,}504\ \text{m}
          $$

      - tipo: calcular
        titulo: La densidad del líquido manométrico
        pregunta: |
          ¿Qué densidad relativa tiene el líquido del conjunto Pitot +
          piezómetro?
        respuesta:
          tipo: numero
          valor: '0.726'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.68'
            mensaje: |
              Esa es la de la gasolina. Si el manométrico tuviera la misma
              densidad no habría ninguna interfaz y el aparato no marcaría
              nada.
          - valor: '1.046'
            mensaje: |
              Has olvidado que la relación es con la gasolina y no con el
              agua. El factor del manómetro es $s_0/s - 1$, y $s$ vale 0,68,
              no 1.
        pista: |
          El Pitot menos el piezómetro es la altura cinética de la tubería;
          el manómetro la lee como $R_0\,(s_0/s-1)$ con $R_0 = 0{,}5$ m.
        desarrollo: |
          $$
          \frac{v^{2}}{2g} = \frac{0{,}81^{2}}{19{,}6} = 0{,}0336\ \text{m}
          $$
          $$
          0{,}0336 = 0{,}5\Bigl(\frac{s_0}{0{,}68}-1\Bigr)
          \;\Longrightarrow\;
          s_0 = 0{,}726
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              El líquido manométrico calculado tiene $s_0 = 0{,}726$, algo más
              denso que la gasolina y por eso se queda abajo en la U.
          - texto: >-
              Con agua circulando, ese mismo líquido sería **más ligero** que
              el fluido de la tubería.
          - texto: >-
              **No se podría usar**: flotaría y el agua lo arrastraría fuera
              del tubo manométrico.
          - texto: >-
              Bastaría con montar el manómetro en U invertida para poder
              usarlo con agua.
            trampa: true
            mensaje: |
              Montado en U invertida sí funcionaría —es exactamente lo que se
              hace con los manométricos ligeros— pero entonces **ya no es la
              misma combinación** que pregunta el enunciado, que es la de la
              figura. Y hay un detalle práctico: 0,726 frente a 1 da un
              factor de 0,274, casi diez veces mayor que el 0,0336 actual, así
              que la lectura se acortaría muchísimo y el aparato perdería casi
              toda su sensibilidad.
    resolucion: |
      **a) El caudal.** Sin pérdidas, la instalación es un Torricelli con 21
      metros de desnivel:

      $$
      v_{boq} = \sqrt{2g\cdot 21} = 20{,}29\ \text{m/s}
      \qquad
      Q = 102\ \text{l/s}
      \qquad
      v_{tubería} = 0{,}81\ \text{m/s}
      $$

      **b) El venturímetro.** Con $C_v = 1$ y la relación de áreas
      $(A_2/A_1)^{2} = 0{,}0625$:

      $$
      R = 0{,}504\ \text{m}
      $$

      **d) El líquido del Pitot.** Un Pitot mide la altura total y un
      piezómetro la piezométrica; su diferencia es la altura cinética de la
      tubería, minúscula porque la tubería es muy ancha:

      $$
      \frac{v^{2}}{2g} = 0{,}0336\ \text{m}
      $$

      Y el manómetro la lee con 0,5 m de columna, así que el factor de
      amplificación es de casi quince:

      $$
      0{,}0336 = 0{,}5\Bigl(\frac{s_0}{0{,}68}-1\Bigr)
      \qquad
      s_0 = 0{,}726
      $$

      **e) Con agua no.** Ese líquido pesa menos que el agua, así que
      flotaría: el agua lo arrastraría fuera del tubo manométrico y el
      aparato dejaría de funcionar. Habría que elegir otro apenas más denso
      que el agua —o montar el manómetro en U invertida con uno más ligero—.

      **Lo que enseña.** La sensibilidad de un manómetro diferencial no la da
      su tamaño: la da lo **parecidas** que sean las dos densidades. Aquí
      0,726 frente a 0,68 son un 6,8 % de diferencia, y por eso tres
      centímetros y medio de altura cinética se leen como medio metro de
      columna. Cambiar el fluido que circula obliga a cambiar también el
      manométrico, y no por una cuestión de escala sino de que si no, se lo
      lleva.

  # ── 3 (25 %) · Un carro con un álabe alimentado por un depósito, y la
  #    pregunta que se responde sin calcular.
  - id: exflu2021-2par-3-el-carro-con-el-alabe
    titulo: El carro con el álabe, y por qué no se mueve
    fuente: >-
      Ejercicio 3 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El depósito de la izquierda alimenta un carro que dispone de un álabe
      unido a él, que desvía el flujo de un líquido de peso específico
      $\gamma$ un ángulo $\theta$. El depósito es circular de diámetro $D$ y
      dispone de un orificio de diámetro $d$ y de coeficientes $C_c$ y $C_v$
      conocidos. El carro es de sección rectangular de base, cuyos lados son
      $a$ y $b$. El depósito está unido a la pared izquierda por medio de una
      barra metálica $T_1$ y el carro está unido a la pared derecha por medio
      de una barra metálica $T_2$. Se pide calcular, en función de las
      variables indicadas:

      **a)** Tensión de la barra $T_1$ (módulo, dirección y sentido).

      **b)** Reacción en el álabe unido a la barra $T_3$ (módulo, dirección y
      sentido).

      **c)** Si quitásemos las barras $T_1$ y $T_2$ y uniésemos el depósito y
      el carro por una barra metálica $T$, indicar la tensión a que estaría
      sometida la barra $T$.

      $H$ es la altura de líquido sobre el orificio del depósito.
    pide: La tensión de la barra que sujeta el depósito, la del álabe y qué pasa si se unen los dos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado c), ¿qué volumen de control conviene tomar?
        opciones:
          - texto: >-
              Uno que encierre **todo** el fluido, depósito y carro incluidos:
              así no hay flujo de cantidad de movimiento ni a la entrada ni a
              la salida
            correcta: true
            mensaje: |
              Eso es, y responde el apartado sin una sola cuenta. Si nada
              entra ni sale del volumen de control, la resultante de las
              fuerzas exteriores horizontales es nula, así que la barra $T$
              no trabaja: el conjunto depósito+carro no se mueve.
          - texto: >-
              Uno alrededor del carro, y otro alrededor del depósito
            mensaje: |
              Eso es lo que hacen los apartados a) y b), y da las dos
              tensiones por separado. Para el c) lo rápido es tomarlos
              juntos, porque entonces el chorro queda **dentro** y se cancela.
          - texto: >-
              Uno alrededor del chorro solamente
            mensaje: |
              El chorro solo daría la fuerza que el fluido hace sobre el
              álabe, que ya se conoce. La pregunta es sobre el conjunto.

      - tipo: calcular
        titulo: La tensión de la barra del depósito
        pregunta: |
          Con $d = 20$ mm, $C_c = 0{,}62$, $C_v = 0{,}98$, $H = 2$ m y agua,
          ¿cuánto vale $T_1$, en N?
        respuesta:
          tipo: numero
          valor: '7.33'
          tolerancia: 0.1
          formato: un número en newton
        distractores:
          - valor: '11.83'
            mensaje: |
              Te has dejado el coeficiente de contracción. La sección del
              chorro no es la del orificio: es $C_c$ veces menor, y aquí
              $C_c$ vale 0,62.
          - valor: '3.67'
            mensaje: |
              Te has dejado el factor 2. La reacción es
              $\rho Q v = \rho\,(C_c A C_v\sqrt{2gH})(C_v\sqrt{2gH})$, y el
              $2gH$ trae ese 2 consigo.
        pista: |
          $T_1 = \rho\,Q\,v$ con $Q = C_c A C_v\sqrt{2gH}$ y
          $v = C_v\sqrt{2gH}$.
        desarrollo: |
          $$
          T_1 = \rho\,C_c A\,C_v^{2}\,2gH
          = \gamma\,\frac{\pi d^{2}}{2}\,C_c\,C_v^{2}\,H
          $$
          $$
          = 9800\cdot\frac{\pi\,0{,}02^{2}}{2}\cdot 0{,}62\cdot 0{,}9604\cdot 2
          = 7{,}33\ \text{N}
          $$

          y su sentido es **hacia la izquierda**: el chorro sale hacia la
          derecha y el depósito retrocede.

      - tipo: calcular
        titulo: La reacción del álabe con sesenta grados
        pregunta: |
          Si el álabe desvía el chorro $\theta = 60^{\circ}$, ¿cuántas veces
          $\rho Q v$ vale el módulo de $T_3$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es $1-\cos 60^{\circ}$, que sería el módulo si solo hubiera
              componente en el eje del chorro. El álabe también desvía
              lateralmente, y el módulo de la resultante es
              $\sqrt{2(1-\cos\theta)}$.
          - valor: '2'
            mensaje: |
              Ese es el valor con $\theta = 180^{\circ}$, el álabe que
              devuelve el chorro. Con 60º la desviación es mucho menor.
        pista: |
          El módulo del cambio de velocidad de un chorro desviado un ángulo
          $\theta$ es $v\sqrt{2(1-\cos\theta)}$.
        desarrollo: |
          $$
          T_3 = \rho\,Q\,v\sqrt{2\,(1-\cos\theta)}
          $$
          $$
          \theta = 60^{\circ}
          \;\Longrightarrow\;
          \sqrt{2\,(1-0{,}5)} = 1
          $$

          Con sesenta grados, el módulo de la reacción es **exactamente**
          $\rho Q v$. Es el ángulo en que el triángulo de velocidades es
          equilátero.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Se toma un volumen de control que encierre todo el fluido: el
              depósito, el chorro y el carro.
          - texto: >-
              No hay flujo de cantidad de movimiento ni a la entrada ni a la
              salida de ese volumen.
          - texto: >-
              Por tanto la resultante de las fuerzas exteriores horizontales
              es nula y **el conjunto no se mueve**: la barra $T$ no trabaja.
          - texto: >-
              Eso demuestra que las tensiones $T_1$ y $T_2$ también eran
              nulas.
            trampa: true
            mensaje: |
              No lo eran: $T_1$ vale $\gamma\pi d^{2}C_cC_v^{2}H/2$ y $T_2$ la
              equilibra. Lo que ocurre es que son **iguales y opuestas**, así
              que al unir los dos cuerpos se anulan entre sí y la barra que
              los une no tiene que hacer nada. Es la diferencia entre «las
              fuerzas son nulas» y «la resultante es nula», y es justo lo que
              el apartado quiere que distingas.
    resolucion: |
      **a) La barra del depósito.** El depósito pierde cantidad de movimiento
      por el orificio, y la barra tiene que sujetarlo. Con
      $v = C_v\sqrt{2gH}$ y $Q = C_c A\,v$:

      $$
      T_1 = \rho\,Q\,v = \gamma\,\frac{\pi d^{2}}{2}\,C_c\,C_v^{2}\,H
      \qquad(\leftarrow)
      $$

      **b) El álabe.** El chorro llega con velocidad $v$ y sale con la misma
      —chorro libre, sin pérdidas— desviado un ángulo $\theta$. El módulo del
      cambio de velocidad es $v\sqrt{2(1-\cos\theta)}$:

      $$
      T_3 = \rho\,Q\,v\,\sqrt{2\,(1-\cos\theta)}
      $$

      **c) Y si se unen los dos.** Aquí no hace falta calcular nada. Tomando
      un volumen de control que encierre **todo** el fluido —el del depósito,
      el chorro y el que baña el álabe— no hay flujo de cantidad de
      movimiento ni a la entrada ni a la salida. La resultante de las fuerzas
      exteriores horizontales es nula, así que **la barra $T$ no está
      sometida a ninguna tensión** y el conjunto depósito+carro no se mueve.

      **Lo que enseña, y no es poco.** El chorro empuja el depósito hacia la
      izquierda con la misma fuerza con que empuja el carro hacia la derecha:
      son acción y reacción a través del propio fluido. Un cohete no
      funcionaría si llevara delante una pantalla que recogiera su propio
      chorro, y es exactamente esta cuenta. Elegir bien el volumen de control
      convierte un problema de tres barras en una frase.

  # ── 4 (25 %) · Un aerosol en un aula y una válvula que se comporta igual
  #    con agua que con mercurio.
  - id: exflu2021-2par-4-el-aerosol-y-la-valvula-con-mercurio
    titulo: El aerosol del aula, y la válvula que da igual con qué fluido
    fuente: >-
      Ejercicio 4 · Segundo parcial, 7 de mayo de 2021 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no el desarrollo.
    nivel: examen
    enunciado: |
      Responder justificadamente a las siguientes preguntas independientes
      sobre análisis dimensional y teoría de modelos.

      **a)** Para estudiar la diseminación de un virus en un aula por medio de
      la dispersión en aerosoles, y determinar su concentración $C$ (g/ml), se
      va a considerar que dicha concentración depende de las siguientes
      variables: el diámetro $D$, la tensión superficial $\sigma$ y la
      densidad $\rho$ de las pequeñas gotas en suspensión, de la sección o
      área total $A$ de ventilación (suma de ventanas y puertas), de las
      velocidades horizontal $v$ y vertical $w$ generadas por la ventilación,
      y por último de la viscosidad cinemática $\nu$ del aire. Seleccionar
      justificadamente un grupo de variables repetidas adecuado y determinar
      los parámetros adimensionales que caracterizarán el sistema.

      **b)** En el laboratorio de la escuela se ha observado que cuando fluye
      un caudal de agua de 10 l/s a través de una válvula la pérdida de carga
      es de 1,2 kPa. ¿Cuál es el caudal (m³/s) si a través de la misma
      válvula fluye mercurio y se ha observado una pérdida de carga de 1,22
      mca?
    pide: Los adimensionales del aerosol, y el caudal de mercurio por la misma válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b), ¿qué propiedad de la válvula permite pasar de un
          fluido a otro?
        opciones:
          - texto: >-
              Que su factor de paso es **adimensional**, así que la relación
              $\Delta p/(\rho v^{2})$ es la misma con cualquier fluido
            correcta: true
            mensaje: |
              Eso es. Un $k$ es un número puro que solo depende de la
              geometría y —débilmente— del Reynolds. Mientras el régimen sea
              turbulento, la misma válvula relaciona igual la pérdida con la
              altura cinética, dé lo mismo lo que circule.
          - texto: >-
              Que la pérdida de carga es la misma en los dos casos
            mensaje: |
              No lo es: 1,2 kPa con agua y 1,22 mca —unos 12 kPa— con
              mercurio. Lo que se conserva es el **coeficiente**, no la
              pérdida.
          - texto: >-
              Que el mercurio y el agua tienen la misma viscosidad cinemática
            mensaje: |
              No la tienen, pero da igual: en régimen turbulento plenamente
              desarrollado el factor de paso apenas depende del Reynolds, y
              esa es la hipótesis que hace posible el problema.

      - tipo: calcular
        titulo: Cuántos adimensionales tiene el aerosol
        pregunta: |
          ¿Cuántos parámetros adimensionales caracterizan el problema del
          aula?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              Ocho son las variables: $C$, $D$, $\sigma$, $\rho$, $A$, $v$,
              $w$ y $\nu$. El teorema resta las tres dimensiones
              independientes.
          - valor: '4'
            mensaje: |
              Has restado una de más, quizá contando la concentración como
              adimensional. No lo es: se da en gramos por mililitro, que es
              una densidad.
        pista: |
          $n-k$, y cuidado con contar bien las variables.
        desarrollo: |
          Ocho variables y tres dimensiones dan **cinco** grupos. Con
          $\rho$, $D$ y $v$ como repetidas:

          $$
          \frac{\sigma}{\rho\,D\,v^{2}}
          \qquad
          \frac{\nu}{D\,v}
          \qquad
          \frac{C}{\rho}
          \qquad
          \frac{A}{D^{2}}
          \qquad
          \frac{w}{v}
          $$

      - tipo: calcular
        titulo: El caudal de mercurio
        pregunta: |
          ¿Qué caudal de mercurio pasa por esa válvula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '8.56 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '10 l/s'
            mensaje: |
              Ese es el del agua. Con mercurio la pérdida medida es diez veces
              mayor en pascales, pero el fluido es 13,6 veces más denso: el
              caudal baja un 14 %.
          - valor: '31.6 l/s'
            mensaje: |
              Parece que has usado solo la relación de pérdidas, sin dividir
              por la densidad. En $\Delta p = k\rho v^{2}/2$, la densidad está
              en el mismo lado que la velocidad.
        pista: |
          Con $k$ constante, $\Delta p = k\rho v^{2}/2$, así que
          $Q \propto \sqrt{\Delta p/\rho}$. Y ojo: 1,22 mca son metros de
          columna de **agua**.
        desarrollo: |
          $$
          \Delta p_{Hg} = 1{,}22\cdot 9800 = 11\,956\ \text{Pa}
          $$
          $$
          \frac{Q_{Hg}}{Q_{ag}} = \sqrt{\frac{\Delta p_{Hg}/\rho_{Hg}}
          {\Delta p_{ag}/\rho_{ag}}}
          = \sqrt{\frac{11\,956/13\,600}{1200/1000}} = 0{,}856
          $$
          $$
          Q_{Hg} = 8{,}56\ \text{l/s} = 8{,}56\cdot 10^{-3}\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena las dos respuestas. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\rho$, $D$ y $v$ como repetidas, los cinco grupos del aula
              son el inverso de Weber, el inverso de Reynolds, la
              concentración relativa, el área de ventilación relativa y la
              relación de velocidades.
          - texto: >-
              La concentración, medida en g/ml, es una densidad, así que
              $C/\rho$ ya es adimensional.
          - texto: >-
              En la válvula, el factor de paso es adimensional, así que
              $Q\propto\sqrt{\Delta p/\rho}$ y el mercurio pasa a 8,56 l/s.
          - texto: >-
              Como el mercurio es mucho más denso, por la misma válvula pasa
              mucho más caudal.
            trampa: true
            mensaje: |
              Pasa **menos**, no más: 8,56 frente a 10 l/s. La densidad está
              en el denominador de $\sqrt{\Delta p/\rho}$, porque es más
              difícil acelerar un fluido pesado. Que la pérdida medida en
              pascales sea diez veces mayor no compensa que el fluido sea 13,6
              veces más denso.
    resolucion: |
      **a) El aerosol.** Ocho variables —$C$, $D$, $\sigma$, $\rho$, $A$,
      $v$, $w$, $\nu$— y tres dimensiones dan cinco grupos. Las repetidas
      naturales son $\rho$, $D$ y $v$: cubren masa, longitud y tiempo de
      forma independiente, y ninguna de las tres es la magnitud que se quiere
      estudiar.

      $$
      \Pi_1 = \frac{\sigma}{\rho\,D\,v^{2}}
      \qquad
      \Pi_2 = \frac{\nu}{D\,v}
      \qquad
      \Pi_3 = \frac{C}{\rho}
      $$
      $$
      \Pi_4 = \frac{A}{D^{2}}
      \qquad
      \Pi_5 = \frac{w}{v}
      $$

      El primero es el inverso del número de **Weber** —la tensión
      superficial frente a la inercia, que es lo que decide si una gota se
      rompe—; el segundo, el inverso de **Reynolds**; el tercero, la
      concentración hecha adimensional con la densidad de la gota; el cuarto,
      el área de ventilación relativa al tamaño de gota; y el quinto, cuánto
      hay de corriente vertical frente a horizontal.

      **b) La válvula.** El factor de paso es un número puro:

      $$
      \Delta p = k\,\frac{\rho\,v^{2}}{2}
      \qquad\Longrightarrow\qquad
      Q \propto \sqrt{\frac{\Delta p}{\rho}}
      $$
      $$
      Q_{Hg} = 10\sqrt{\frac{11\,956/13\,600}{1200/1000}}
      = 8{,}56\ \text{l/s}
      $$

      **Y por qué esto es más que una regla de tres.** Que un coeficiente sea
      adimensional significa que **describe la geometría, no el fluido**. Una
      válvula caracterizada con agua en el laboratorio sirve para dimensionar
      una instalación de mercurio, de gasolina o de glicerina, con la única
      condición de que el régimen siga siendo turbulento. Esa transferibilidad
      es lo que hace útiles los catálogos de accesorios, y es la razón de que
      las pérdidas menores se tabulen como $k$ y no como metros.
