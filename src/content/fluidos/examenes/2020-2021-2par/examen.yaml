asignatura: fluidos
curso: '2020-2021'
convocatoria: segundo-parcial
fecha: 7 de mayo de 2021
# **Los cuatro ejercicios**, del cuadernillo «Exámenes 2020-2025», págs. 17 y
# 18 (23 y 24 del PDF); con él se cerró el cuadernillo entero.
#
# Publica el resultado de cada apartado y no la resolución (`pdfEs:
# enunciado-con-resultados`), y no imprime reparto por competencia sino el
# porcentaje de cada ejercicio junto a su número, «1. (25%)». Esos
# porcentajes van en `puntosImpresos` y suman 100; los ejercicios van sin
# `puntos`.
#
# Desde el 30 de septiembre de 2026 los cuatro enunciados son los del
# cuadernillo palabra por palabra, con lo que añadimos en «Notas nuestras»,
# y la NOTA del 1 va en `notas`. El 1 había perdido dos datos: las válvulas V
# son de 100 mm y su $k$ es 0,73, y la energía del nudo impresa,
# 169.381,66 J/m³, solo sale con ellas. El 2 había perdido la «Ayuda» con la
# expresión del caudal del venturímetro, y su figura dibujaba el Pitot de
# cara a aguas abajo. El 3 no tenía figura, y el ángulo que desvía el álabe,
# α, solo está en ella; el enunciado lo llamaba θ y lo daba en el texto.
#
# Lo que este examen aporta al corpus:
#
# - **Una embotelladora** (ej. 1), que es una red con tres conductos donde
#   el consumo lo fijan diez boquillas iguales, y el depósito intermedio
#   resulta ser el que aporta el caudal que a la bomba le falta.
# - **Un Pitot y un piezómetro juntos** (ej. 2), de los que hay que deducir
#   la densidad del líquido manométrico —y comprobar después que ese
#   líquido no serviría con agua, porque el agua se lo llevaría.
# - **Un carro con un álabe y un depósito que lo alimenta** (ej. 3), con
#   dos volúmenes de control para dos preguntas distintas: el que encierra
#   todo el fluido no tiene flujo de cantidad de movimiento ni a la entrada
#   ni a la salida, así que el conjunto no se mueve; y la barra que une los
#   dos cuerpos, que es interior a ese volumen, trabaja igual a tracción con
#   $\rho Q v$, que solo sale cortándola. Hasta el 30 de septiembre de 2026
#   el sitio publicaba que la barra no trabajaba (revisión, C1).
# - **Un aerosol en un aula** (ej. 4), que es análisis dimensional aplicado
#   a un problema de 2021, y una válvula que se comporta igual con agua que
#   con mercurio porque su factor de paso es adimensional.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (25%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 25 }
    - { n: 2, puntos: 25 }
    - { n: 3, puntos: 25 }
    - { n: 4, puntos: 25 }

# `fuera` queda vacío: están los cuatro.

ejercicios:
  - id: exflu2021-2par-1-la-embotelladora-de-diez-boquillas
    tema: t19-conducciones
  - id: exflu2021-2par-2-el-pitot-y-el-piezometro-juntos
    tema: t13-medidores
  - id: exflu2021-2par-3-el-carro-con-el-alabe
    tema: t15-aplicaciones-tcm
  - id: exflu2021-2par-4-el-aerosol-y-la-valvula-con-mercurio
    tema: t16-analisis-dimensional
