# **Los cuatro ejercicios**, y con él se cierra el cuadernillo «Exámenes
# 2020-2025» entero.
#
# Porcentajes impresos: 25 / 25 / 25 / 25, sin reparto por competencia, así
# que van sin `puntos`.
#
# Lo que este examen aporta al corpus:
#
# - **Una embotelladora** (ej. 1), que es una red con tres conductos donde
#   el consumo lo fijan diez boquillas iguales, y el depósito intermedio
#   resulta ser el que aporta el caudal que a la bomba le falta.
# - **Un Pitot y un piezómetro juntos** (ej. 2), de los que hay que deducir
#   la densidad del líquido manométrico —y comprobar después que ese
#   líquido no serviría con agua, porque el agua se lo llevaría.
# - **Un carro con un álabe y un depósito que lo alimenta** (ej. 3), donde
#   la pregunta final se responde **sin calcular nada**: tomando todo el
#   fluido como volumen de control no hay flujo de cantidad de movimiento
#   ni a la entrada ni a la salida, así que el conjunto no se mueve.
# - **Un aerosol en un aula** (ej. 4), que es análisis dimensional aplicado
#   a un problema de 2021, y una válvula que se comporta igual con agua que
#   con mercurio porque su factor de paso es adimensional.
