                .ex2324e2-prismas-fl { stroke: var(--ink); stroke-width: 1.2; fill: none; }
            </style>
            <g transform="translate(0 16)"><text class="ex2324e2-prismas-l" x="2" y="-5" fill="var(--live)">La gabarra volcada (H no a escala)</text><path class="ex2324e2-prismas-agua" d="M67.1 124.3L367.9 124.3L367.9 54.2L67.1 54.2Z"/><path class="ex2324e2-prismas-aire" d="M117.3 88L317.8 88L317.8 102.4L117.3 102.4Z"/><path class="ex2324e2-prismas-lam" d="M67.1 54.2L367.9 54.2"/><path class="ex2324e2-prismas-corte" d="M67.1 66.7L142.3 64.2L192.5 69.2L242.6 64.2L292.7 69.2L367.9 66.7"/><path class="ex2324e2-prismas-pared" d="M117.3 113.1L117.3 88L317.8 88L317.8 113.1"/><path class="ex2324e2-prismas-lam" d="M117.3 102.4L317.8 102.4"/><text class="ex2324e2-prismas-n" x="217.5" y="99.2" text-anchor="middle" fill="var(--ink)">aire</text><text class="ex2324e2-prismas-n" x="84.7" y="49.2" text-anchor="start" fill="var(--d1)">s = 1</text><path class="ex2324e2-prismas-cota" d="M327.8 71.1L327.8 54.2"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M327.8 54.2L325.8 58.8L329.8 58.8Z"/><path class="ex2324e2-prismas-cota" d="M327.8 71.1L327.8 88"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M327.8 88L329.8 83.4L325.8 83.4Z"/><text class="ex2324e2-prismas-n" x="332.8" y="75.1" text-anchor="start" fill="var(--ink)">H = 7,067 m</text><path class="ex2324e2-prismas-cota" d="M107.2 95.2L107.2 88"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M107.2 88L105.2 92.6L109.2 92.6Z"/><path class="ex2324e2-prismas-cota" d="M107.2 95.2L107.2 102.4"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M107.2 102.4L109.2 97.8L105.2 97.8Z"/><text class="ex2324e2-prismas-n" x="102.2" y="99.2" text-anchor="end" fill="var(--ink)">h = 0,575 m</text><path class="ex2324e2-prismas-cota" d="M217.5 120.6L117.3 120.6"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M117.3 120.6L121.9 122.6L121.9 118.6Z"/><path class="ex2324e2-prismas-cota" d="M217.5 120.6L317.8 120.6"/><path class="ex2324e2-prismas-punta" fill="var(--faint)" d="M317.8 120.6L