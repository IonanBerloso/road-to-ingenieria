          </svg>

      - tipo: calcular
        titulo: La resultante vertical
        pregunta: |
          ¿Qué fuerza vertical resultante actúa sobre la gabarra volcada?
        respuesta:
          tipo: magnitud
          valor: '676.2 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '69 kn'
            mensaje: |
              Has dado la masa en kilonewtons sin multiplicar por $g$.
              $69\,000$ kg son $676{,}2$ kN.
          - valor: '1176 kn'
            mensaje: |
              Parece que has usado el volumen entero de la barca, 120 m³, en
              vez del de la cámara de aire, 69 m³. Solo el aire desplaza agua:
              el resto está inundado.
        pista: |
          En equilibrio, el empuje iguala al peso.
        desarrollo: |
          $$
          F_V = \rho g\,(8\cdot 15\cdot 0{,}575) = 676{,}2\ \text{kN}\ (\uparrow)
          $$

          Y la horizontal es **cero**: la barca es simétrica y los prismas de
          presión de los dos costados se cancelan.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con 0,6 m de calado y agua salada, el desplazamiento son
              73 800 kg, de los que 4 800 son la gente: la gabarra pesa
              69 000.
          - texto: >-
              En agua dulce el mismo volumen solo desplaza 72 000 kg, así que
              caben 37 personas en vez de 60.
          - texto: >-
              Volcada, la cámara de aire de 0,575 m sostiene los 69 000 kg, y
              la compresión isoterma la sitúa a 7,07 m de profundidad.
          - texto: >-
              El error del ensayo fue del 2,5 %, que es la diferencia de
              densidad entre las dos aguas.
            trampa: true
            mensaje: |
              El error de **densidad** es del 2,5 %, pero el de **aforo** es
              del 38 %: de 60 personas a 37. La razón es que la carga útil es
              la diferencia entre dos números grandes y parecidos —el
              desplazamiento, 73 800, y el peso de la barca, 69 000— y en una
              resta así los errores relativos se disparan. Es la misma
              amplificación que hace delicado calcular la pérdida de una
              válvula restando dos alturas.

    resolucion: |
      **a) La masa.** Con $0{,}6$ m de calado en agua salada, la gabarra
      desplaza $72\ \text{m}^{3}$, es decir $73\,800$ kg. Quitando las 60
      personas:

      $$
      m = 69\,000\ \text{kg}
      $$

      **b) El aforo real.** El mismo volumen en agua dulce solo desplaza
      $72\,000$ kg, y quedan $3\,000$ para la gente: **37 personas**.

      **Y ahí está la noticia.** Un $2{,}5\ \%$ menos de densidad se convierte
      en un **38 %** menos de aforo. La razón es aritmética: la carga útil es
      la diferencia entre el desplazamiento y el peso del casco, dos números
      grandes y parecidos, y un error pequeño en cualquiera de ellos se
      amplifica enormemente en su resta.

      | | agua salada | agua dulce |
      |---|---|---|
      | desplazamiento a 0,6 m | 73 800 kg | 72 000 kg |
      | menos el casco | 4 800 kg | 3 000 kg |
      | personas | 60 | 37 |

      **c) y d) La barca volcada.** El aire queda atrapado bajo el fondo y su
      empuje sostiene la barca:

      $$
      h = \frac{69\,000}{1000\cdot 120} = 0{,}575\ \text{m}
      $$

      Son 57,5 cm exactos; el 57,55 del resultado impreso es una errata del
      cuadernillo, un 0,09 % que la casilla acepta.

      Como el volumen de aire ha pasado de $120$ a $69\ \text{m}^{3}$, la ley
      de Boyle dice a qué presión está, y esa presión dice a qué profundidad
      se ha ido:

      $$
      p_1 = \frac{p_{at}\cdot 120}{69} = 176\,217\ \text{Pa}
      \;\Longrightarrow\;
      H = 7{,}067\ \text{m}
      $$

      **e) Los prismas.** En presiones relativas, el fondo tiene por fuera el
      agua a $\gamma H = 69{,}26$ kPa y por dentro el aire a
      $\gamma(H + h) = 74{,}89$ kPa, uniformes los dos. En cada costado, el
      agua de fuera va de 69,26 a 79,06 kPa; dentro, el aire da 74,89 kPa
      constantes hasta la interfaz y el agua de dentro sigue igual que la de
      fuera. Lo único que no se anula es un triángulo de 5,635 kPa a cero en
      la altura del aire, hacia fuera, igual en los dos costados.

      **f) Las fuerzas.** Horizontal, cero por simetría. Vertical, el empuje
      que sostiene la barca:

      $$
      F_V = 676{,}2\ \text{kN}\ (\uparrow)
      $$

      **Lo que hace bueno a este ejercicio.** Junta tres cosas que se enseñan
      por separado —Arquímedes, la ley de los gases y el equilibrio de un
      cuerpo sumergido— sobre un caso que todo el mundo recuerda, y la
      pregunta de fondo no es ninguna de las tres: es **por qué un ensayo
      correcto dio un resultado equivocado**. Porque se hizo en el fluido que
      no era.

  # ── 3 (10 %) · Micromanómetro de líquidos inmiscibles. El apartado c) es de
  #    diseño: qué líquido hay que elegir para la precisión que se pide.
  - id: exflu2324-ext-3-el-micromanometro-de-liquidos-inmiscibles
    titulo: El micromanómetro, y qué líquido hay que elegir
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se cuenta con un micromanómetro de líquidos inmiscibles como el mostrado
      en la imagen, con fluidos de densidades relativas $s_1$ y $s_2$. Al
      principio, ambos depósitos A y B se encuentran abiertos, no existiendo
      el émbolo de la imagen. En dicha situación, las lecturas recogidas son
      $h_1 = 40\ \text{cm}$ y $h_2 = 30\ \text{cm}$. Considerando los
      depósitos de **grandes dimensiones**, y tratándose el líquido $s_1$ de
      agua:

      a) Calcular la densidad relativa del líquido $s_2$.

      A continuación, se cierra el depósito A con un émbolo, sobre el cual se
      ejerce una fuerza en la dirección mostrada en la imagen.

      b) Calcular la fuerza a realizar en el émbolo para desplazar el líquido
      $s_1$ una distancia de $\Delta h = 12\ \text{cm}$ en el tubo
      manométrico. ($D_{\text{émbolo}} = 1\ \text{m}$)

      c) Mediante dicho micromanómetro se desean medir variaciones de presión
      de $\pm 2\ \text{Pa}$. Siendo posible distinguir variaciones de cota de
      $1\ \text{mm}$, y manteniendo agua en el depósito A, calcular el peso
      específico máximo del líquido nuevo en el depósito B para obtener dicha
      precisión.

      **Notas nuestras.** En la figura, el depósito A está a la izquierda, con
      el líquido $s_1$ y, encima, el émbolo, con una capa de aire debajo y la
      fuerza F apuntando hacia abajo. El depósito B, a la derecha y más alto,
      tiene el líquido $s_2$ y está abierto. De los fondos de los dos bajan
      los tubos de un manómetro en U. $h_1$ va de la lámina de A, y $h_2$ de
      la de B, hasta una misma línea de trazos por debajo de los dos
      depósitos, que es el contacto entre los dos líquidos en el tubo; y
      $\Delta h$ se mide desde esa línea hacia abajo.
    pide: La densidad del segundo líquido, la fuerza en el émbolo y el peso específico máximo para la precisión pedida.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con los dos depósitos abiertos, las dos superficies libres están a
          la atmósfera. ¿Qué dice eso?
        opciones:
          - texto: >-
              Que las dos columnas se equilibran: $\gamma_1h_1 =
              \gamma_2h_2$, y de ahí sale $s_2$ sin más datos
            correcta: true
            mensaje: |
              Exacto. Es la calibración del aparato: con las dos ramas a la
              atmósfera, las alturas de las dos columnas dan directamente la
              relación de densidades.
          - texto: >-
              Que las dos columnas tienen la misma altura
            mensaje: |
              Tendrían la misma altura si los líquidos fueran iguales. Como el
              de B es más denso, le basta con 30 cm para equilibrar los 40 del
              agua.
          - texto: >-
              Que no se puede sacar nada: hacen falta las presiones
            mensaje: |
              Las presiones son conocidas —las dos son la atmosférica— y eso
              es precisamente el dato. La ecuación de la hidrostática hace el
              resto.

      - tipo: calcular
        titulo: La densidad del segundo líquido
        pregunta: |
          ¿Cuánto vale $s_2$?
        respuesta:
          tipo: numero
          valor: '1.333'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '0.75'
            mensaje: |
              Has invertido la relación: $h_2/h_1$ en vez de $h_1/h_2$. El
              líquido de B sostiene una columna de agua **más alta** que la
              suya, luego tiene que ser más denso, no menos.
          - valor: '0.333'
            mensaje: |
              Eso es $s_2 - s_1$, la diferencia que decide la sensibilidad del
              aparato en los apartados b) y c). El a) pide $s_2$ a secas, y con
              las dos ramas abiertas $s_2 = s_1h_1/h_2 = 1{,}333$.
        pista: |
          Las dos columnas equilibradas: $\gamma_1h_1 = \gamma_2h_2$.
        desarrollo: |
          $$
          s_2 = s_1\,\frac{h_1}{h_2} = 1\cdot\frac{40}{30} = 1{,}333
          $$

      - tipo: calcular
        titulo: La fuerza en el émbolo
        pregunta: |
          ¿Qué fuerza hay que hacer para desplazar la interfaz
          $12\ \text{cm}$?
        respuesta:
          tipo: magnitud
          valor: '307.88 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1231.5 n'
            mensaje: |
              Te has dejado la resta. Al desplazarse la interfaz, la columna
              de $s_2$ sube y la de $s_1$ baja: lo que hay que vencer es la
              **diferencia** $\gamma_2 - \gamma_1$, no $\gamma_2$ sola.
          - valor: '923.6 n'
            mensaje: |
              Parece que has usado $\gamma_1$ sola. El aparato debe su
              sensibilidad justamente a que las dos columnas casi se
              compensan: la diferencia es un tercio de cada una.
        pista: |
          $\Delta p = (\gamma_2-\gamma_1)\,\Delta h$, y después
          $F = \Delta p\,A_{\text{émbolo}}$.
        desarrollo: |
          $$
          \Delta p = (13\,067 - 9800)\cdot 0{,}12 = 392{,}0\ \text{Pa}
          $$
          $$
          F = 392{,}0\cdot\frac{\pi\cdot 1^{2}}{4} = 307{,}88\ \text{N}
          $$

      - tipo: calcular
        titulo: El peso específico máximo del líquido nuevo
        pregunta: |
          ¿Qué peso específico puede tener como mucho el líquido de B?
        respuesta:
          tipo: magnitud
          valor: '11800 n/m3'
          tolerancia: 0.02
          formato: un peso específico, con su unidad
        distractores:
          - valor: '9802 n/m3'
            mensaje: |
              Parece que has sumado los 2 Pa al peso específico del agua sin
              dividir por el milímetro. La condición es
              $(\gamma_2-\gamma_1)\cdot 0{,}001 = 2$, así que la diferencia
              vale 2000, no 2.
          - valor: '2000 n/m3'
            mensaje: |
              Esa es la **diferencia** $\gamma_2 - \gamma_1$, lo que el líquido
              nuevo puede pesar de más que el agua. Lo que se pide es su peso
              específico: $9800 + 2000$.
        pista: |
          $(\gamma_2-\gamma_1)\cdot 0{,}001\ \text{m} = 2$ Pa.
        desarrollo: |
          $$
          \gamma_2 - \gamma_1 = \frac{2}{0{,}001} = 2000\ \text{N/m}^{3}
          $$
          $$
          \gamma_2 = 9800 + 2000 = 11\,800\ \text{N/m}^{3}
          $$

          Es un **máximo**: cuanto más se parezcan los dos líquidos, mayor es
          el desplazamiento para la misma variación de presión, y más fino
          mide el aparato.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las dos ramas abiertas, $\gamma_1h_1 = \gamma_2h_2$ y sale
              $s_2 = 1{,}333$.
          - texto: >-
              La sensibilidad del aparato la da la **diferencia**
              $\gamma_2-\gamma_1$, y por eso hacen falta 392 Pa —307,88 N en
              el émbolo— para mover la interfaz 12 cm.
          - texto: >-
              Para medir $\pm 2$ Pa distinguiendo milímetros, esa diferencia
              no puede pasar de 2000 N/m³: el líquido nuevo debe tener
              $\gamma_2 \le 11\,800$.
          - texto: >-
              Y para afinar más, lo que hay que buscar es un líquido lo más
              **denso** posible.
            trampa: true
            mensaje: |
              Al revés, y es la idea del micromanómetro: cuanto **más
              parecidos** sean los dos líquidos, menor es
              $\gamma_2-\gamma_1$ y más se desplaza la interfaz para la misma
              variación de presión. Un manométrico muy denso —mercurio— es
              justo lo contrario: sirve para medir presiones grandes con
              lecturas cortas. Aquí se busca lo opuesto.

    resolucion: |
      **a) La calibración.** Con las dos ramas a la atmósfera, las columnas se
      equilibran:

      $$
      \gamma_1h_1 = \gamma_2h_2
      \;\Longrightarrow\;
      s_2 = \frac{40}{30} = 1{,}333
      $$

      **b) La fuerza.** Aquí está la idea del aparato. Al desplazarse la
      interfaz $\Delta h$, una columna sube y la otra baja, así que la presión
      que hay que vencer es

      $$
      \Delta p = (\gamma_2-\gamma_1)\,\Delta h = 392\ \text{Pa}
      $$

      **la diferencia, no la suma**. Con dos líquidos que se diferencian en un
      tercio, la sensibilidad se multiplica por tres respecto de un manómetro
      corriente.

      $$
      F = \Delta p\,\frac{\pi D^{2}}{4} = 307{,}88\ \text{N}
      $$

      Treinta kilos sobre un émbolo de un metro para mover doce centímetros de
      líquido. La fuerza es la presión por el área del émbolo, y el tubo no
      interviene: lo que la deja en treinta kilos son los 392 Pa, pequeños
      porque los dos líquidos casi se compensan.

      **c) El diseño.** Si se quiere resolver $\pm 2$ Pa distinguiendo
      milímetros,

      $$
      \gamma_2 - \gamma_1 \le \frac{2}{0{,}001} = 2000\ \text{N/m}^{3}
      \;\Longrightarrow\;
      \gamma_2 \le 11\,800\ \text{N/m}^{3}
      $$

      **Y la regla del micromanómetro, que es lo contrario de la intuición.**
      Para medir presiones **pequeñas** con precisión hay que elegir dos
      líquidos lo más parecidos posible. El mercurio, que es el manométrico de
      referencia para presiones grandes, aquí sería el peor de todos: su
      $\gamma_2-\gamma_1$ es sesenta veces mayor que el límite de este
      enunciado.

      El aparato, su ecuación de lectura y su sensibilidad están en el tema 4,
      [El micromanómetro de líquidos inmiscibles, y su sensibilidad](/road-to-ingenieria/fluidos/t04-hidrostatica/#el-micromanómetro-de-líquidos-inmiscibles-y-su-sensibilidad):
      los «grandes dimensiones» del enunciado son lo que deja la ecuación en
      $\Delta p = \Delta h\,(\gamma_2 - \gamma_1)$, sin el término de las
      áreas.

  # ── 4 (15 %) · Venturímetro calibrado con un Pitot. Dos manómetros, dos
  #    caudales —el teórico y el real— y de su cociente sale el coeficiente.
  - id: exflu2324-ext-4-el-venturimetro-calibrado-con-un-pitot
    titulo: Un venturímetro calibrado con un Pitot
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se dispone de un conducto ascendente con $30°$ de inclinación. En dicho
      conducto hay un venturímetro de diámetros $D_1 = 100\ \text{mm}$ y
      $D_2 = 70\ \text{mm}$ y el fluido manométrico ($s_{m1} = 1{,}6$)
      empleado es más pesado que el circulante ($s_0 = 0{,}85$) por la
      tubería. A lo largo del venturímetro se disponen dos piezómetros
      conectados a la entrada y al estrechamiento, mientras que a la salida
      del venturímetro se sitúa un tubo de Pitot cuya **entrada se encuentra
      en el estrechamiento**. La diferencia de cotas entre las tomas
      piezométricas del venturímetro es $\Delta z = 27\ \text{cm}$.

      Teniendo en cuenta los datos de la imagen, calcular:

      a) Caudal real que circula por el conducto.

      b) Valor del coeficiente del venturímetro.

      c) Si aguas abajo del venturímetro colocamos un rotámetro, ¿la lectura
      del rotámetro será la misma que se ha calculado en el apartado b)?
      Razonar la respuesta.

      **Ayuda**: despreciar las pérdidas de carga entre los puntos 2 y 3 de la
      imagen. La expresión para la velocidad teórica del fluido en la garganta
      del venturímetro es la siguiente:

      $$
      v_{2T} = \sqrt{\frac{2\cdot g\cdot\left[\dfrac{\Delta p_{12}}{\gamma}
      + \Delta z_{12}\right]}{1 - \left(\dfrac{A_{2T}}{A_{1T}}\right)^{2}}}
      $$

      **Notas nuestras.** En la figura, el conducto sube hacia la derecha y el
      flujo va en ese sentido. El punto 1 es la toma de la entrada, el 2 la
      del estrechamiento y el 3 la boca del Pitot, que entra desde aguas abajo
      y se dobla dentro del estrechamiento, de cara al flujo. Los tres tubos
      bajan a un mismo recipiente con el líquido manométrico, y esos son los
      «datos de la imagen»: su nivel está **20 cm** más alto en el tubo de 2
      que en el de 1, y **25 cm** más bajo en el del Pitot que en el de 2.
      *El apartado c) dice «apartado b)», pero el caudal se calcula en el a);
      se deja como está impreso.*
    pide: El caudal real, el coeficiente del venturímetro y la comparación con un rotámetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos manómetros. ¿Qué mide cada uno?
        opciones:
          - texto: >-
              El de 20 cm, la caída de cota piezométrica entre la entrada y la
              garganta, que da el caudal **teórico**; el de 25 cm, la altura
              cinética real en la garganta, que da el **real**
            correcta: true
            mensaje: |
              Exacto, y de ahí sale el coeficiente: es el cociente entre las
              dos velocidades. El Pitot es el patrón, igual que en el
              diafragma del problema 3.30 de la colección (tema 13).
          - texto: >-
              Los dos miden lo mismo por caminos distintos, y sirven para
              comprobar que no hay fugas
            mensaje: |
              Si midieran lo mismo el coeficiente saldría 1, y todo el
              ejercicio consiste en que no lo es. Uno mide la caída de
              presión; el otro, la energía cinética que de verdad hay.
          - texto: >-
              El de 20 cm mide la presión y el de 25 cm la diferencia de
              cotas
            mensaje: |
              Las diferencias de cota ya están dentro de las lecturas: un
              manómetro diferencial mide diferencias de **cota
              piezométrica**, que incluyen la altura. Por eso el dato
              $\Delta z = 27$ cm no hace falta.

      - tipo: calcular
        titulo: La caída de cota piezométrica
        pregunta: |
          ¿Cuánta cota piezométrica se pierde entre 1 y 2, en columna del
          fluido circulante?
        respuesta:
          tipo: magnitud
          valor: '0.1765 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.2 m'
            mensaje: |
              Esa es la lectura del manómetro. Hay que multiplicarla por
              $s_m/s_0 - 1 = 0{,}882$ para pasarla a columna del fluido que
              circula.
          - valor: '0.376 m'
            mensaje: |
              Has usado $s_m/s_0$ sin restarle 1. El manométrico desplaza al
              circulante, así que lo que cuenta es la **diferencia** de pesos
              específicos.
        pista: |
          $R\left(\dfrac{s_m}{s_0}-1\right)$, con $R = 0{,}20$ m.
        desarrollo: |
          $$
          \frac{\Delta p_{12}}{\gamma}+\Delta z_{12}
          = 0{,}20\left(\frac{1{,}6}{0{,}85}-1\right) = 0{,}1765\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal teórico
        pregunta: |
          ¿Qué caudal daría el venturímetro sin coeficiente?
        respuesta:
          tipo: magnitud
          valor: '8.21 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '7.16 l/s'
            mensaje: |
              Te has dejado el factor $1-(A_2/A_1)^{2}$. La velocidad en la
              entrada no es despreciable frente a la de la garganta: con
              $D_2/D_1 = 0{,}7$ ese factor vale $0{,}76$ y sube la velocidad
              un 15 %.
          - valor: '11.99 l/s'
            mensaje: |
              Has usado $s_m/s_0$ sin restarle 1 en la caída de cota
              piezométrica. Todo lo demás está bien, pero el caudal sale un
              46 % alto.
        pista: |
          La expresión de la ayuda, y después $Q = v_{2T}A_2$.
        desarrollo: |
          $$
          \left(\frac{A_2}{A_1}\right)^{2}
          = \left(\frac{70}{100}\right)^{4} = 0{,}2401
          $$
          $$
          v_{2T} = \sqrt{\frac{19{,}6\cdot 0{,}1765}{1-0{,}2401}}
          = 2{,}133\ \text{m/s}
          \qquad
          Q_T = 8{,}21\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          ¿Y el que circula de verdad?
        respuesta:
          tipo: magnitud
          valor: '8 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '8.21 l/s'
            mensaje: |
              Ese es el teórico. El Pitot mide la altura cinética que de
              verdad hay en la garganta —0,2206 m— y da una velocidad algo
              menor.
          - valor: '9.18 l/s'
            mensaje: |
              Parece que has aplicado el factor $1-(A_2/A_1)^{2}$ también a la
              lectura del Pitot. El Pitot mide directamente $v^{2}/2g$ en su
              punto: no hay que corregir nada.
        pista: |
          El Pitot da $v_2^{2}/2g$ directamente:
          $0{,}25\,(s_m/s_0-1)$.
        desarrollo: |
          $$
          \frac{v_2^{2}}{2g} = 0{,}25\left(\frac{1{,}6}{0{,}85}-1\right)
          = 0{,}2206\ \text{m}
          \;\Longrightarrow\;
          v_2 = 2{,}079\ \text{m/s}
          $$
          $$
          Q = 2{,}079\cdot\frac{\pi\,0{,}07^{2}}{4} = 8{,}00\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El coeficiente del venturímetro
        pregunta: |
          ¿Cuánto vale el coeficiente?
        respuesta:
          tipo: numero
          valor: '0.975'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '1.026'
            mensaje: |
              Has dividido al revés. El coeficiente de un aparato deprimógeno
              es siempre **menor que 1**: mide menos caudal del que la teoría
              ideal predice.
          - valor: '0.8'
            mensaje: |
              Ese sería el cociente de las dos lecturas, $20/25$. El
              coeficiente compara **velocidades**, y las velocidades van con
              la raíz de las lecturas.
        pista: |
          $c = v_{2,\text{real}}/v_{2T}$, o equivalentemente el cociente de
          los caudales.
        desarrollo: |
          $$
          c = \frac{2{,}079}{2{,}133} = 0{,}975
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión, con la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro de 20 cm da la caída de cota piezométrica y con
              ella el caudal teórico, 8,21 l/s.
          - texto: >-
              El Pitot, con 25 cm, da la altura cinética real en la garganta y
              con ella el caudal real, 8,00 l/s.
          - texto: >-
              El coeficiente es su cociente, 0,975: el venturímetro pierde
              solo un 2,5 %, mucho menos que un diafragma.
          - texto: >-
              Y el rotámetro daría la misma lectura, porque mide el mismo
              caudal.
            trampa: true
            mensaje: |
              Daría **menos**, y esa es la respuesta del apartado c). El Pitot
              mide la velocidad en **un punto del eje**, que en régimen
              turbulento es la máxima del perfil; el rotámetro responde al
              caudal, es decir a la velocidad **media**, que es menor. Los dos
              instrumentos son correctos: miden magnitudes distintas.

    resolucion: |
      **Dos manómetros y dos caudales.** El primero, entre la entrada y la
      garganta, da lo que la teoría ideal predice; el segundo, un Pitot en la
      garganta, da lo que de verdad hay. El cociente es el coeficiente. La
      toma 3 se reconoce como Pitot por su boca, abierta de cara al flujo
      ([Reconocer un Pitot en un esquema](/road-to-ingenieria/fluidos/t13-medidores/#reconocer-un-pitot-en-un-esquema)),
      y medir un deprimógeno contra otro aparato es justo lo que el tema 13
      llama calibrarlo
      ([Calibrar un medidor](/road-to-ingenieria/fluidos/t13-medidores/#calibrar-un-medidor-venturímetros-diafragmas-y-rotámetros)).

      **a) y b).**

      | | lectura | en columna del fluido | resultado |
      |---|---|---|---|
      | piezómetros 1–2 | 20 cm | 0,1765 m | $v_{2T} = 2{,}133$ m/s, $Q_T = 8{,}21$ l/s |
      | Pitot 2–3 | 25 cm | 0,2206 m | $v_2 = 2{,}079$ m/s, $Q = 8{,}00$ l/s |

      $$
      c = \frac{2{,}079}{2{,}133} = 0{,}975
      $$

      **Un 2,5 % de pérdida**, que es lo que caracteriza al venturímetro
      frente al diafragma: su estrechamiento gradual y su difusor recuperan
      casi toda la energía. El diafragma del problema 3.30 de la colección,
      calibrado también con un Pitot, sale con un coeficiente de gasto de 0,654.

      **Los dos datos que no se usan.** La inclinación de $30°$ y la
      diferencia de cotas $\Delta z = 27$ cm **no intervienen**, porque un
      manómetro diferencial mide diferencias de cota piezométrica y esas ya
      incluyen la altura. Están en el enunciado para ver si se distingue lo
      que hace falta.

      **c) El rotámetro.** Daría una lectura **menor**. El Pitot mide la
      velocidad en un punto del eje, que en régimen turbulento es la máxima
      del perfil; el rotámetro se equilibra con el caudal, es decir con la
      velocidad **media**. En una tubería turbulenta la media anda por el 80
      al 85 % de la máxima, así que la diferencia no es pequeña.

      **Y la moraleja de instrumentación:** dos aparatos que dan números
      distintos no tienen por qué estar en desacuerdo. Hay que preguntarse
      primero **qué mide cada uno**.

  # ── 5 (10 %) · Análisis dimensional con un giro que no había salido: la
  #    semejanza sí es posible, pero solo si la gravedad del planeta vale lo
  #    que la condición exige.
  - id: exflu2324-ext-5-la-bomba-en-otro-planeta
    titulo: La bomba en otro planeta, y la gravedad que hace falta
    fuente: >-
      Ejercicio 5 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Para un futuro hipotético, en el que el ser humano sea capaz de realizar
      viajes interplanetarios, se pretende diseñar una instalación de bombeo
      de agua que lleve el agua de una instalación a otra, en un cuerpo
      planetario desconocido.

      Sabiendo que el incremento de presión $\Delta P$ capaz de generar la
      bomba depende del caudal $Q$, del diámetro del rodete $D$, de la
      longitud de la tubería $L$, de la viscosidad absoluta, de la densidad
      $\rho$, de la gravedad y de la velocidad $v$, se pide:

      a) Obtener los parámetros adimensionales del sistema. Variables
      repetidas: $D$, $\rho$, $v$.

      El agua que se quiere transportar en este cuerpo planetario tiene una
      temperatura de 20 °C siendo su viscosidad 1 centipoise. Este diseño se
      pretende validar ahora y para ello se utilizará un modelo a escala
      $\lambda = 0{,}125$, utilizando mercurio como fluido, cuya viscosidad es
      0,016 Poise.

      b) ¿Se puede lograr una semejanza dinámica absoluta?

      - En caso afirmativo, ¿cuáles son las condiciones para su cumplimiento?
        Razonar la respuesta.
      - En caso negativo, ¿cuál es el motivo de no conseguirlo? Razonar la
        respuesta.

      **Notas nuestras.** El enunciado no dice dónde se ensaya el modelo. El
      resultado impreso, $g = 1{,}38\ \text{m/s}^{2}$, sale con el modelo en
      la Tierra, a $g = 9{,}8\ \text{m/s}^{2}$, y así lo toma la resolución;
      la densidad del mercurio, que tampoco se da, se toma de
      $13\,600\ \text{kg/m}^{3}$.
    pide: Los parámetros adimensionales y la condición para la semejanza absoluta.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí la gravedad del prototipo es **desconocida**. ¿Qué cambia eso
          respecto de los ejercicios de semejanza habituales?
        opciones:
          - texto: >-
              Que deja de ser un dato y pasa a ser una incógnita: en vez de
              comprobar si la semejanza es posible, se calcula **qué gravedad
              la haría posible**
            correcta: true
            mensaje: |
              Eso es, y es lo que hace distinto a este ejercicio. En la Tierra
              Reynolds y Froude son incompatibles porque $g$ es la misma en
              los dos lados; aquí no lo es, y eso abre un grado de libertad.
          - texto: >-
              Nada: la gravedad se cancela al formar los adimensionales
            mensaje: |
              No se cancela: aparece en $\pi_4 = gD/v^{2}$, que es el inverso
              del cuadrado de Froude. Si se cancelara, Froude no existiría.
          - texto: >-
              Que hay que suponer $g = 9{,}8$ y comprobar después
            mensaje: |
              Suponer el valor de la incógnita es justo lo que el ejercicio
              pide no hacer. El enunciado dice «cuerpo planetario
              desconocido» a propósito.

      - tipo: calcular
        titulo: Cuántos parámetros
        pregunta: |
          ¿Cuántos parámetros adimensionales describen el fenómeno? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              Esas son las variables: $\Delta P$, $Q$, $D$, $L$, $\mu$,
              $\rho$, $g$ y $v$. El teorema resta las tres magnitudes
              fundamentales.
          - valor: '4'
            mensaje: |
              Te has dejado una variable en la cuenta. Son ocho contando la
              dependiente, $\Delta P$, que también entra.
        pista: |
          $n - m$, contando también la variable dependiente.
        desarrollo: |
          $$
          8 - 3 = 5
          $$
          $$
          \pi_1 = \frac{Q}{vD^{2}}
          \quad
          \pi_2 = \frac{L}{D}
          \quad
          \pi_3 = \frac{\mu}{\rho vD}
          \quad
          \pi_4 = \frac{gD}{v^{2}}
          \quad
          \pi_5 = \frac{\Delta P}{\rho v^{2}}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero, con las repetidas que impone el
          enunciado —$D$, $\rho$ y $v$—: las ocho variables con sus
          dimensiones, contando la viscosidad y la gravedad aunque el
          enunciado no les ponga letra, el número de grupos y cada grupo
          despejado.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si en tu folio están los cinco grupos impresos, con $\Delta P$ en el
          número de Euler, el apartado está entero. Si te salen cuatro, te has
          dejado la variable dependiente, la viscosidad o la gravedad, que el
          enunciado nombra sin símbolo.

      - tipo: calcular
        titulo: La relación de velocidades por Reynolds
        pregunta: |
          Igualando $\pi_3$, ¿cuánto vale $v_m/v_p$?
        respuesta:
          tipo: numero
          valor: '0.941'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '8'
            mensaje: |
              Te has dejado el cociente de viscosidades. El mercurio es ocho
              veces menos viscoso en términos cinemáticos que el agua, y eso
              compensa casi exactamente la escala.
          - valor: '0.125'
            mensaje: |
              Esa es la escala geométrica. Reynolds pide
              $v_m/v_p = (D_p/D_m)(\nu_m/\nu_p)$: la escala **invertida**,
              multiplicada por el cociente de viscosidades.
        pista: |
          $\nu_m = 0{,}0016/13\,600$ y $\nu_p = 10^{-6}$; y
          $D_p/D_m = 1/0{,}125 = 8$.
        desarrollo: |
          $$
          \nu_m = \frac{0{,}0016}{13\,600} = 1{,}176\cdot 10^{-7}
          \qquad
          \nu_p = 10^{-6}\ \text{m}^{2}/\text{s}
          $$
          $$
          \frac{v_m}{v_p} = 8\cdot\frac{1{,}176\cdot 10^{-7}}{10^{-6}}
          = 0{,}941
          $$

      - tipo: calcular
        titulo: La gravedad del planeta
        pregunta: |
          ¿Qué gravedad tendría que tener el cuerpo planetario para que la
          semejanza absoluta fuese posible?
        respuesta:
          tipo: magnitud
          valor: '1.38 m/s2'
          tolerancia: 0.02
          formato: una aceleración, con su unidad
        distractores:
          - valor: '9.8 m/s2'
            mensaje: |
              Esa es la de la Tierra, donde está el **modelo**. Si el planeta
              tuviera la misma, la semejanza sería imposible: es justo lo que
              pasa en los ejercicios habituales.
          - valor: '69.5 m/s2'
            mensaje: |
              Has invertido la relación. El modelo es más pequeño y va casi a
              la misma velocidad, así que su Froude es **mayor**: para
              igualarlo, el planeta necesita **menos** gravedad, no más.
        pista: |
          Iguala $\pi_4$: $g_pD_p/v_p^{2} = g_mD_m/v_m^{2}$, con
          $g_m = 9{,}8$.
        desarrollo: |
          $$
          \frac{g_p}{g_m} = \frac{D_m}{D_p}\left(\frac{v_p}{v_m}\right)^{2}
          = 0{,}125\cdot\frac{1}{0{,}941^{2}} = 0{,}1411
          $$
          $$
          g_p = 9{,}8\cdot 0{,}1411 = 1{,}38\ \text{m/s}^{2}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: si la semejanza dinámica absoluta es
          posible, con Reynolds y Froude igualados a la vez y la condición que
          sale contrastada con lo que se sabe del planeta. Aquí la respuesta
          impresa es la afirmativa, con una condición: dila con su número.
        rubrica: semejanza-absoluta
        veredicto: |
          Si tu folio acaba en «sí, siempre que la gravedad del planeta sea
          1,38 m/s²», con las dos igualdades planteadas y combinadas antes, el
          apartado está entero. «Sí, cambiando de fluido» no contesta: el
          fluido del modelo ya está elegido, y lo que queda libre es $g$.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Ocho variables y tres magnitudes fundamentales dan cinco
              parámetros, entre ellos los inversos de Reynolds y de Froude al
              cuadrado.
          - texto: >-
              Igualar Reynolds con mercurio a escala 1:8 pide
              $v_m/v_p = 0{,}941$: casi la misma velocidad en el modelo que en
              el prototipo.
          - texto: >-
              Con esa relación de velocidades, igualar Froude exige
              $g_p = 1{,}38\ \text{m/s}^{2}$: la semejanza **sí** es posible,
              pero solo en un planeta de esa gravedad.
          - texto: >-
              Y como $1{,}38\ \text{m/s}^{2}$ es una gravedad plausible —la
              Luna tiene 1,62— el ensayo serviría para cualquier cuerpo
              pequeño del sistema solar.
            trampa: true
            mensaje: |
              Serviría **solo** para un cuerpo de exactamente esa gravedad.
              La condición no es «un planeta pequeño»: es un valor concreto,
              y en la Luna —1,62— ya no se cumpliría. Lo que el ejercicio
              enseña es que la gravedad, que en la Tierra es un dato fijo y
              por eso hace incompatibles Reynolds y Froude, aquí se convierte
              en el grado de libertad que permite cuadrarlos.

    resolucion: |
      **a) Los cinco parámetros.** Ocho variables menos tres magnitudes:

      $$
      \pi_1 = \frac{Q}{vD^{2}}
      \quad
      \pi_2 = \frac{L}{D}
      \quad
      \pi_3 = \frac{\mu}{\rho vD}
      \quad
      \pi_4 = \frac{gD}{v^{2}}
      \quad
      \pi_5 = \frac{\Delta P}{\rho v^{2}}
      $$

      $\pi_3$ es el inverso de Reynolds, $\pi_4$ el inverso del cuadrado de
      Froude y $\pi_5$ el número de Euler, que es el que lleva la incógnita.

      **b) La vuelta de tuerca.** En un ensayo terrestre corriente, igualar
      Reynolds y Froude a la vez es imposible porque $g$ es la misma a los dos
      lados y las dos condiciones piden velocidades distintas. **Aquí la
      gravedad del prototipo es desconocida**, así que deja de ser un
      obstáculo y pasa a ser la incógnita.

      Reynolds, con mercurio a escala 1:8:

      $$
      \frac{v_m}{v_p} = \frac{D_p}{D_m}\cdot\frac{\nu_m}{\nu_p}
      = 8\cdot 0{,}1176 = 0{,}941
      $$

      —el modelo va casi a la misma velocidad que el prototipo, porque el
      mercurio es ocho veces menos viscoso en términos cinemáticos y eso
      compensa la escala—. Y Froude:

      $$
      g_p = g_m\,\frac{D_m}{D_p}\left(\frac{v_p}{v_m}\right)^{2}
      = 1{,}38\ \text{m/s}^{2}
      $$

      **La semejanza absoluta sí es posible**, pero solo si el planeta tiene
      esa gravedad exacta. En la mayoría de las convocatorias la respuesta
      impresa a «¿se puede?» es que no, y merece la pena ver por qué aquí es
      que sí: porque hay una variable libre más que en el caso terrestre.

  # ── 6 (15 %) · Selección de bomba con el criterio completo: altura, caudal,
  #    rendimiento y cavitación. La de mejor rendimiento es la que se descarta.
  - id: exflu2324-ext-6-la-bomba-que-cavita-y-la-que-no
    titulo: La bomba de mejor rendimiento es la que hay que descartar
    fuente: >-
      Ejercicio 6 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se quiere bombear agua desde un depósito abierto a 3 boquillas que se
      encuentran dispuestas en paralelo a cota $27\ \text{m}$. El diámetro de
      la tubería de aspiración es $150\ \text{mm}$ y el de impulsión,
      $100\ \text{mm}$. Sus longitudes son $10\ \text{m}$ y $40\ \text{m}$,
      respectivamente. Ambas son de PVC. El diámetro de las boquillas es de
      $50\ \text{mm}$ y su factor de paso es $k = 0{,}1$. A lo largo de la
      tubería de impulsión hay cuatro codos comerciales de $90°$ de radio
      medio ($k = 0{,}75$), todos ellos antes del nudo que distribuye el
      caudal por las boquillas. La lámina de agua en el depósito inferior se
      encuentra en la cota $3\ \text{m}$. Para el cálculo de las pérdidas de
      carga se empleará la expresión de **Hazen-Williams**. Se pide:

      a) Deducir la expresión analítica de la curva característica de la
      instalación.

      Se quiere obtener una presión dinámica de 5 mca a la salida de las
      boquillas. Para ello se dispone de dos bombas diferentes. En la tabla se
      muestran sus curvas:

      | Bomba A | Bomba B |
      |---|---|
      | $H_m = 108 - 0{,}013\cdot Q^{2}$ [mca; l/s] | $H_m = 117 - 0{,}45\cdot Q - 0{,}0085\cdot Q^{2}$ [mca; l/s] |
      | $\eta = 2{,}04\cdot Q - 0{,}0123\cdot Q^{2}$ [%; l/s] | $\eta = 4{,}22\cdot Q - 0{,}052\cdot Q^{2}$ [%; l/s] |
      | $NPSH_{req} = 2 + 8\cdot 10^{-4}\cdot Q^{2}$ [mca; l/s] | $NPSH_{req} = 1{,}2 + 6\cdot 10^{-4}\cdot Q^{2}$ [mca; l/s] |

      b) Escoger la bomba correcta y razonar la elección **en base a las tres
      curvas dadas para cada bomba**.

      c) Definir el punto de funcionamiento ($H_m$, $Q$ y $\eta$).

      d) Sabiendo que el rendimiento del motor eléctrico es del 68% y el
      precio del kWh es 0,12 €, calcular lo que cuesta bombear
      $1\ \text{m}^{3}$.

      **Datos**: $P_{vapor} = 0{,}25$ mca; $z_{bomba} = 8\ \text{m}$;
      $P_{atm} = 1$ atm.

      **Notas nuestras.** La resolución lee la «presión dinámica de 5 mca a la
      salida de las boquillas» como la altura cinética de cada chorro,
      $v^{2}/2g = 5$ m: es lo que fija el caudal demandado del apartado b).
    pide: La curva de la instalación, la bomba elegida, su punto de funcionamiento y el coste por metro cúbico.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres boquillas están **en paralelo**. ¿Con qué velocidad hay que
          calcular su pérdida?
        opciones:
          - texto: >-
              Con la del conjunto: cada una lleva $Q/3$, así que la altura
              cinética se calcula con el caudal total sobre la suma de las
              tres secciones
            correcta: true
            mensaje: |
              Eso es. Tres boquillas de 50 mm en paralelo se comportan como
              una sección de $3\times\pi\,0{,}05^{2}/4$, y por ahí pasa el
              caudal total.
          - texto: >-
              Con la del caudal total sobre **una** boquilla, que es el caso
              más desfavorable
            mensaje: |
              Eso triplicaría la velocidad y multiplicaría la pérdida por
              nueve. El caudal se reparte: por cada boquilla pasa un tercio.
          - texto: >-
              No hay que calcularla: las boquillas descargan a la atmósfera y
              no pierden carga
            mensaje: |
              Descargan a la atmósfera, sí, pero la energía cinética con la
              que sale el agua **también** hay que dársela, y además tienen su
              propio factor de paso $k = 0{,}1$. Entre las dos cosas son
              $1{,}1$ veces la altura cinética de salida.

      - tipo: calcular
        titulo: La altura piezométrica
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: magnitud
          valor: '24 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '27 m'
            mensaje: |
              Esa es la cota de las boquillas. Hay que restar la de la lámina
              del depósito, que está en la 3.
          - valor: '19 m'
            mensaje: |
              Parece que has restado la cota de la bomba, 8. La altura
              piezométrica va de lámina a salida; la cota de la bomba solo
              interviene en el NPSH.
        pista: |
          De la lámina del depósito a la salida de las boquillas.
        desarrollo: |
          $$
          H_{\text{piez}} = 27 - 3 = 24\ \text{m}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero: la curva característica desde el
          balance de energía entre la lámina del depósito y la salida de los
          chorros, con los codos en la velocidad de la impulsión, las tres
          boquillas con su factor de paso y la altura cinética de sus chorros,
          y las pérdidas continuas por Hazen-Williams, hasta dejarla con sus
          coeficientes y sus unidades.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Si tu folio llega a la curva impresa,
          $24 + 4{,}099\cdot 10^{-3}Q^{2} + 9{,}67\cdot 10^{-3}Q^{1{,}852}$,
          con «mca; l/s», tienes el apartado. Si tu coeficiente de $Q^{2}$ sale
          $2{,}63\cdot 10^{-3}$, te has dejado la altura cinética de los chorros:
          la instalación acaba en ellos, no en un depósito.

      - tipo: calcular
        titulo: El caudal que piden las boquillas
        pregunta: |
          Una presión dinámica de 5 mca a la salida de cada boquilla es una
          altura cinética de 5 m. ¿Qué caudal total piden las tres?
        respuesta:
          tipo: magnitud
          valor: '58.31 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '19.44 l/s'
            mensaje: |
              Ese es el caudal de una sola boquilla. Son tres en paralelo, cada
              una con su chorro de 9,90 m/s: el total es el triple.
          - valor: '13.17 l/s'
            mensaje: |
              Te has dejado el $2g$: con $v^{2}/2g = 5$ m la velocidad es
              $\sqrt{2\cdot 9{,}8\cdot 5} = 9{,}90$ m/s, no $\sqrt{5}$.
        pista: |
          $v = \sqrt{2g\cdot 5}$ en cada chorro, por el área de las tres
          boquillas.
        desarrollo: |
          $$
          v = \sqrt{2\cdot 9{,}8\cdot 5} = 9{,}90\ \text{m/s}
          \qquad
          Q = 3\cdot\frac{\pi\,0{,}05^{2}}{4}\cdot 9{,}90
          = 58{,}31\ \text{l/s}
          $$

          A ese caudal la instalación pide 55,95 m, y la bomba A da 63,79 y la
          B, 61,86: las dos sobran. Es la primera frase del resultado impreso,
          «Ambas dan suficiente altura para el caudal demandado».

      - tipo: calcular
        titulo: El punto de funcionamiento de la bomba B
        pregunta: |
          ¿Qué caudal da la bomba B en esta instalación?
        respuesta:
          tipo: magnitud
          valor: '60.64 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '69.47 l/s'
            mensaje: |
              Te has dejado los 24 m de altura piezométrica y has cruzado la
              bomba con las pérdidas solas. El desnivel de 24 metros desplaza
              el corte casi nueve litros por segundo a la izquierda.
          - valor: '81.43 l/s'
            mensaje: |
              Te has quedado con los 24 m de altura piezométrica sin las
              pérdidas, como si la instalación pidiera lo mismo a todo caudal.
              Los 50 m de tubería, los codos y los chorros piden 34 m más a
              60 l/s.
        pista: |
          Corta $H_{mi} = 24 + 4{,}099\cdot 10^{-3}Q^{2} + 9{,}67\cdot
          10^{-3}Q^{1{,}852}$ con la curva de B.
        desarrollo: |
          $$
          24 + 4{,}099\cdot 10^{-3}Q^{2} + 9{,}67\cdot 10^{-3}Q^{1{,}852}
          = 117 - 0{,}45Q - 0{,}0085Q^{2}
          $$
          $$
          Q = 60{,}64\ \text{l/s}
          \qquad
          H_m = 58{,}45\ \text{m}
          \qquad
          \eta = 64{,}69\ \%
          $$

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿De cuánto NPSH dispone la bomba en ese punto?
        respuesta:
          tipo: magnitud
          valor: '4.43 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '9.44 m'
            mensaje: |
              Te has dejado los 5 m de cota. La bomba está en la 8 y el
              depósito en la 3: aspira **por encima**, y esos cinco metros son
              lo que más margen le quita.
          - valor: '5.08 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración, 0,65 m. Son los 10 m
              de tubería de 150 mm que hay antes de la bomba.
        pista: |
          $p_{at}/\gamma - p_v/\gamma - z_{\text{asp}} - h_{f,\text{asp}}$,
          con la bomba 5 m por encima del depósito.
        desarrollo: |
          $$
          NPSH_d = 10{,}33 - 0{,}25 - 5 - 0{,}65 = 4{,}43\ \text{m}
          $$

          Frente a los requeridos: la bomba B pide $3{,}41$ m —**cabe**— y la
          A, en su punto, $5{,}01$ frente a $4{,}42$ disponibles —**no
          cabe**—. Ese es el descarte. Con la instalación funcionando basta
          $NPSH_d > NPSH_r$ (diapositiva 21 del tema 25), y con el criterio de
          diseño, $NPSH_d > 1{,}3\,NPSH_r$, la B pediría $4{,}43$ m; con la
          atmosférica exacta, $101\,325/9800 = 10{,}34$ mca, dispone de
          $4{,}44$ y sigue cabiendo, por un centímetro (con 10,33, por un
          milímetro): la elección no cambia.

      - tipo: calcular
        titulo: El coste por metro cúbico
        pregunta: |
          ¿Cuánto cuesta bombear un metro cúbico? (solo el número, en euros)
        respuesta:
          tipo: numero
          valor: '0.0434'
          tolerancia: 0.001
          formato: un número en euros por metro cúbico
        distractores:
          - valor: '0.0295'
            mensaje: |
              Te has dejado el rendimiento del motor. La potencia eléctrica es
              $\gamma QH/(\eta_b\eta_m)$: el de la bomba, 64,69 %, **y** el del
              motor, 68 %.
          - valor: '0.0281'
            mensaje: |
              Parece que has usado solo el rendimiento del motor. El de la
              bomba es el que más pesa: 64,69 % frente a 68 %.
        pista: |
          Potencia eléctrica dividida entre el caudal horario, por el precio
          del kWh.
        desarrollo: |
          $$
          P = \frac{9800\cdot 0{,}0606\cdot 58{,}45}{0{,}6469\cdot 0{,}68}
          = 78{,}97\ \text{kW}
          $$
          $$
          Q = 0{,}0606\ \text{m}^{3}/\text{s} = 218{,}3\ \text{m}^{3}/\text{h}
          $$
          $$
          \frac{78{,}97\cdot 0{,}12}{218{,}3} = 0{,}0434
          $$

          Es decir, 0,0434 €/m³.

      - tipo: justificar
        pregunta: Ordena la elección. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos bombas dan altura de sobra: la A corta en 61,29 l/s y la
              B en 60,64.
          - texto: >-
              La A tiene mejor rendimiento —78,8 % frente a 64,7— así que a
              primera vista es la buena.
          - texto: >-
              Pero su $NPSH$ requerido son 5,01 m frente a los 4,42
              disponibles: **cavita**, y se elige la B.
          - texto: >-
              Y como la B rinde peor, bombear con ella cuesta un 20 % más de
              lo que costaría con la A.
            trampa: true
            mensaje: |
              Costaría un 20 % más **si la A funcionara**, y no funciona: una
              bomba que cavita pierde altura, hace ruido, se come el rodete y
              acaba parada. La comparación correcta no es «B contra A», es «B
              contra nada». El coste de la A no es 0,036 €/m³: es infinito,
              porque no da el servicio.

    resolucion: |
      **a) La curva.** Altura piezométrica $27-3 = 24$ m, más dos términos:

      $$
      H_{mi} = 24 + 4{,}099\cdot 10^{-3}Q^{2}
      + 9{,}67\cdot 10^{-3}Q^{1{,}852}
      $$

      El de $Q^{2}$ recoge los cuatro codos —con la velocidad de la impulsión
      de 100 mm— y las tres boquillas, que aportan $1{,}1$ veces la altura
      cinética del **conjunto**: el caudal total sobre la suma de las tres
      secciones de 50 mm. El de $Q^{1{,}852}$ es Hazen-Williams con
      $C_{HW} = 140$ en los dos tramos, que es la banda del cuadro n.º 25 para
      el PVC en 150 y en 100 mm.

      **b) y c) La elección.** Para los 5 mca de presión dinámica, las tres
      boquillas piden $58{,}31$ l/s, y las dos bombas dan más: cortan a la
      instalación en 61,29 y 60,64 l/s. Por altura sirven las dos; lo deciden
      las otras dos curvas.

      | | $Q$ (l/s) | $H_m$ (m) | $\eta$ | $NPSH_{req}$ | $NPSH_{disp}$ | |
      |---|---|---|---|---|---|---|
      | A | 61,29 | 59,16 | 78,8 % | 5,01 m | 4,42 m | **cavita** |
      | B | 60,64 | 58,45 | 64,7 % | 3,41 m | 4,43 m | **elegida** |

      **Y aquí está lo que enseña el ejercicio.** La bomba A es mejor en todo
      lo que se mira primero: da algo más de caudal y rinde catorce puntos
      más. Pero cavita, y una bomba que cavita no es una bomba peor: es una
      bomba que no sirve. **El criterio de cavitación no compite con los
      demás, los precede.**

      **d) El coste.**

      $$
      P = \frac{\gamma QH}{\eta_b\,\eta_m} = 78{,}97\ \text{kW}
      \qquad
      \text{coste} = 0{,}0434
      $$

      —el coste, en euros por metro cúbico—.

      Cuatro céntimos por metro cúbico elevado 24 metros. Como referencia, el
      agua de red se factura en torno a 1,5 €/m³: **el bombeo es una fracción
      pequeña del precio del agua**, y por eso las decisiones de diseño se
      toman más por fiabilidad que por consumo. Que es exactamente lo que
      acaba de pasar con la bomba A.

  # ── 7 (12,5 %) · Canales, con una sección compuesta que es una calzada. La
  #    trampa está en dónde se mide H: desde el fondo de la cuneta, no desde
  #    el firme.
  - id: exflu2324-ext-7-la-calzada-como-canal
    titulo: La calzada como canal, y desde dónde se mide la altura
    fuente: >-
      Ejercicio 7 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se debe realizar el diseño para la renovación de la calzada de un
      pueblo. Esta calzada debe ser de hormigón en bruto y tener la forma que
      se muestra en la imagen:

      La longitud $L$ debe ser de 6 metros, ya que debe tener una anchura
      suficiente para dos coches. La pendiente de la calzada será variable
      entre 0,05 y 1 milésimas.

      a) Calcular el **radio R** que deben tener los canales semicirculares
      laterales si el caudal resultante de las peores lluvias para el verano
      varía entre $10\ \text{l/s}$ y $15\ \text{l/s}$ y el margen de seguridad
      que se desea mantener es del 8% del diámetro.

      b) Si el diámetro de los canales laterales debe ser múltiplo de
      $5\ \text{cm}$, seleccionar la dimensión de dichos canales.

      c) Calcular el valor de la altura $H$ si el caudal resultante de las
      peores lluvias invernales oscila entre $200\ \text{l/s}$ y
      $250\ \text{l/s}$ y el margen que se desea mantener es de
      $5\ \text{cm}$.

      d) Redondear el valor de $H$ para un múltiplo de $5\ \text{cm}$ y anotar
      los valores definitivos de la calzada.

      **Notas nuestras.** En la imagen, la calzada es un firme plano de
      longitud $L$ con un canal semicircular de radio $R$ a cada lado, abierto
      hacia arriba y con el borde a la altura del firme, y por fuera de cada
      canal un muro vertical. $H$ va del fondo de los canales a la coronación
      de los muros. El enunciado no da el coeficiente de Manning: para el
      hormigón en bruto se toma $n = 0{,}015$, el del tema 21. Y el caudal de
      verano se reparte entre los dos canales: el $R$ impreso sale con
      $7{,}5$ l/s en cada uno.
    pide: El radio de las cunetas, su diámetro comercial y la altura H de los bordes.

    pasos:
      - tipo: reconocer
        pregunta: |
          La pendiente «será variable entre 0,05 y 1 milésimas» y el caudal
          «varía entre 10 y 15 l/s». ¿Con qué combinación se dimensiona?
        opciones:
          - texto: >-
              Con el caudal **máximo** y la pendiente **mínima**: es la
              situación en que más sección hace falta
            correcta: true
            mensaje: |
              Eso es. Dimensionar es cubrir el caso peor, y el peor es el que
              más pide: mucho caudal empujado por poca pendiente.
          - texto: >-
              Con los valores medios de los dos rangos
            mensaje: |
              Con la media, la mitad de las situaciones desbordarían. Un
              dimensionado se hace para el extremo desfavorable, no para el
              caso típico.
          - texto: >-
              Con el caudal máximo y la pendiente máxima, que es el caso más
              violento
            mensaje: |
              Más pendiente es más velocidad y por tanto **menos** sección
              necesaria. La pendiente grande sería el caso peor si lo que
              preocupara fuese la erosión, pero aquí lo que se dimensiona es
              la capacidad.

      - tipo: calcular
        titulo: El radio de las cunetas
        pregunta: |
          ¿Qué radio necesitan las cunetas?
        respuesta:
          tipo: magnitud
          valor: '0.238 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.309 m'
            mensaje: |
              Has hecho pasar los 15 l/s por **una** cuneta. Son dos, una a
              cada lado, así que cada una lleva 7,5.
          - valor: '0.136 m'
            mensaje: |
              Has usado la pendiente máxima, 1 milésima. El caso desfavorable
              es la **mínima**, 0,05, que es la que obliga a más sección.
        pista: |
          Cada cuneta lleva 7,5 l/s con $J = 5\cdot 10^{-5}$, y la berma del
          8 % deja el calado en $0{,}42\,D$.
        desarrollo: |
          $$
          h = \frac{D}{2} - 0{,}08D = 0{,}42\,D
          \;\Longrightarrow\;
          A = 0{,}3130\,D^{2},\quad R_H = 0{,}2220\,D
          $$
          $$
          0{,}0075 = \frac{1}{0{,}015}\,0{,}3130D^{2}(0{,}2220D)^{2/3}
          \sqrt{5\cdot 10^{-5}}
          $$
          $$
          D = 0{,}476\ \text{m}
          \qquad
          R = 0{,}238\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          ¿Qué diámetro se instala?
        respuesta:
          tipo: magnitud
          valor: '50 cm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '45 cm'
            mensaje: |
              Has redondeado hacia abajo. Con 45 cm la cuneta no evacúa los
              7,5 l/s conservando la berma: en un dimensionado siempre se sube
              al comercial siguiente.
          - valor: '25 cm'
            mensaje: |
              Ese es aproximadamente el **radio** redondeado. Lo que se pide
              es el diámetro.
        pista: |
          Al múltiplo de 5 cm inmediatamente superior a 47,6.
        desarrollo: |
          $$
          D = 47{,}6\ \text{cm}\;\longrightarrow\; 50\ \text{cm}
          \qquad
          R = 0{,}25\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de los bordes
        pregunta: |
          ¿Qué altura $H$ hace falta para el caudal de invierno?
        respuesta:
          tipo: magnitud
          valor: '49.58 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '24.58 cm'
            mensaje: |
              Has medido $H$ desde el firme. El enunciado la mide desde el
              **fondo de las cunetas**, que están un radio —25 cm— más abajo.
          - valor: '19.58 cm'
            mensaje: |
              Esa es la lámina de agua sobre el firme, sin el radio de la
              cuneta ni los 5 cm de margen. $H$ los incluye los dos.
        pista: |
          Sección de invierno: las dos cunetas llenas más el firme inundado
          hasta $h$. Y después $H = h + R + 0{,}05$.
        desarrollo: |
          La sección inundada, con $h$ de lámina sobre el firme:

          $$
          A = 7h + 2\,\frac{\pi R^{2}}{2}
          \qquad
          P = 6 + 2\pi R + 2h
          $$

          Imponiendo $250\ \text{l/s}$ con $J = 5\cdot 10^{-5}$ sale
          $h = 0{,}196$ m, y

          $$
          H = h + R + 0{,}05 = 0{,}196 + 0{,}25 + 0{,}05 = 0{,}4958\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El caso desfavorable es caudal máximo con pendiente mínima:
              7,5 l/s por cuneta y $J = 5\cdot 10^{-5}$.
          - texto: >-
              Con la berma del 8 % sale $R = 0{,}238$ m, y el comercial
              siguiente es $D = 50$ cm.
          - texto: >-
              En invierno el firme se inunda 19,6 cm, y midiendo desde el
              fondo de la cuneta y añadiendo el margen, $H = 49{,}58$ cm que
              se redondea a 50.
          - texto: >-
              Y como el firme se inunda casi veinte centímetros, el diseño no
              sirve: los coches no podrían circular.
            trampa: true
            mensaje: |
              Los veinte centímetros corresponden a **las peores lluvias de
              invierno**, no al día corriente. Una calzada se dimensiona para
              que en el episodio extremo el agua no se salga hacia las casas,
              no para que se pueda circular durante él. Confundir el caudal de
              diseño con el caudal habitual es un error de criterio, no de
              cálculo.

    resolucion: |
      **El caso desfavorable.** Caudal máximo y pendiente mínima: es lo que
      más sección exige. Y el caudal de verano se reparte entre **dos**
      cunetas, así que cada una lleva 7,5 l/s.

      **a) y b) Las cunetas.** Con la berma del 8 % del diámetro, el calado es
      $0{,}42D$, y Manning da $D = 47{,}6$ cm, que se redondea a
      **50 cm** ($R = 0{,}25$ m).

      **c) La altura de los bordes, y dónde está la trampa.** En invierno la
      sección es toda la calzada: las dos cunetas llenas más el firme inundado
      una altura $h$. Imponiendo 250 l/s con la pendiente mínima sale
      $h = 19{,}6$ cm.

      Y entonces:

      $$
      H = \underbrace{0{,}196}_{\text{lámina}}
      + \underbrace{0{,}25}_{\text{radio de la cuneta}}
      + \underbrace{0{,}05}_{\text{margen}} = 0{,}4958\ \text{m}
      $$

      **porque $H$ se mide desde el fondo de las cunetas**, no desde el firme.
      Medirla desde el firme da 24,6 cm: la mitad. Es el mismo tipo de
      detalle que la berma del «70 % del radio» de otra convocatoria, y se
      resuelve mirando la figura antes de calcular.

      **d) Los valores definitivos.** $H = 50$ cm, $R = 0{,}25$ m,
      $L = 6\ \text{m}$.

      **Y una comprobación que da confianza.** Con $H = 50$ cm en vez de
      49,58, el margen real sube de 5 a 5,4 cm: el redondeo va del lado
      seguro, que es como debe ir. Si hubiera salido 50,2 y se redondeara a
      50, el margen bajaría por debajo del pedido y habría que subir a 55.

  # ── 8 (12,5 %) · Pérdidas de carga con el caudal fijado por el régimen. Estuvo
  #    en `fuera` hasta el 30 de septiembre de 2026 porque ninguna frontera
  #    laminar daba los 11,75 kPa impresos. Los dan dos cosas que el motivo no
  #    probaba: los 5,25 mca de la bomba son de columna de agua (5,00 m de este
  #    fluido), y la tubería de cobre es lisa, así que su f sale de Blasius sin
  #    iterar, que es lo que pide la nota.
  - id: exflu2324-ext-8-el-tramo-laminar-que-fija-el-caudal
    titulo: El tramo laminar que fija el caudal, y la bomba medida en agua
    fuente: >-
      Ejercicio 8 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para el caso en el que el fluido vaya de A a B, calcular la **máxima
      diferencia de presiones** $\Delta p = p_A - p_B$ (kPa) en los tanques de
      la figura para que el **flujo en el conducto 1** anterior a la bomba sea
      **laminar**.

      **Datos**: la viscosidad absoluta del fluido es
      $3{,}15\cdot 10^{-3}$ Pl y su peso específico es
      $10\,290\ \text{N/m}^{3}$. La altura manométrica de la bomba es
      $H_m = 5{,}25$ mca para el caudal asociado a la máxima diferencia de
      presiones. La tubería 1 es de hierro galvanizado, de $40\ \text{mm}$ de
      diámetro y $200\ \text{m}$ de longitud. La tubería 2 es de cobre de
      $14\ \text{mm}$ de diámetro y $30\ \text{m}$ de longitud.

      **Notas nuestras.** En la figura hay dos tanques cerrados, A a la
      izquierda y B a la derecha, cada uno con su manómetro encima, $P_A$ y
      $P_B$, y con la lámina marcada en la cota 15 los dos. La tubería 1 sale
      del fondo de A y llega hasta la bomba, que está junto a B; la 2, corta,
      va de la bomba a B. No se dibuja ninguna válvula ni se da ningún factor
      de paso. Las rugosidades son las del cuadro n.º 20: 0,015 cm el hierro
      galvanizado y 0,00015 cm el cobre.
    notas:
      - >-
        **Nota**: iterar sólo cuando sea obligatorio. Limitar a 3 iteraciones
        en caso de que sea obligatorio o hasta que la variación del valor de la
        variable a calcular sea inferior al 5%.
    pide: La máxima diferencia de presiones entre los tanques con el conducto 1 todavía en régimen laminar.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da el caudal. ¿Qué lo fija?
        opciones:
          - texto: >-
              El límite del régimen laminar en el conducto 1: con $Re = 2000$
              en la tubería de 40 mm sale la velocidad, y con ella el caudal,
              que es el mismo en las dos tuberías
            correcta: true
            mensaje: |
              Eso es. «Máxima diferencia de presiones» y «laminar» son la misma
              condición vista desde los dos lados: más $\Delta p$ empuja más
              caudal, y el tope lo pone el Reynolds del conducto 1. El tema 18
              pone la frontera en 2000; entre 2000 y 4000 está la zona crítica,
              donde no se trabaja.
          - texto: >-
              La bomba, cortando su curva con la de la instalación
            mensaje: |
              De la bomba no hay curva: solo un punto, 5,25 mca «para el caudal
              asociado a la máxima diferencia de presiones». Es un dato para el
              balance de energía, no para sacar el caudal.
          - texto: >-
              Que las dos tuberías sean laminares a la vez
            mensaje: |
              Solo se pide en la 1. La 2 lleva el mismo caudal por un tubo de
              14 mm, con un Reynolds $40/14 = 2{,}86$ veces mayor: 5714,
              turbulento. Si se exigiera laminar en las dos, mandaría la 2 y el
              caudal sería casi tres veces menor.

      - tipo: calcular
        titulo: El caudal en el límite laminar
        pregunta: |
          ¿Qué caudal circula cuando el conducto 1 está justo en $Re = 2000$?
        respuesta:
          tipo: magnitud
          valor: '0.1885 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '0.2168 l/s'
            mensaje: |
              Has puesto la frontera en $Re = 2300$. El tema 18 la pone en
              2000, y de ahí a 4000 es la zona crítica: el flujo ya no es
              laminar con seguridad.
          - valor: '0.0628 l/s'
            mensaje: |
              Has usado la viscosidad cinemática del agua, $10^{-6}$ m²/s. La de
              este fluido es $\mu/\rho = 3{,}15\cdot 10^{-3}/1050 =
              3\cdot 10^{-6}$ m²/s: el triple, y el caudal también.
        pista: |
          $\rho = \gamma/g = 1050$ kg/m³, $\nu = \mu/\rho$, y
          $Re = v\,D/\nu = 2000$ en la tubería de 40 mm.
        desarrollo: |
          $$
          \rho = \frac{10\,290}{9{,}8} = 1050\ \text{kg/m}^{3}
          \qquad
          \nu = \frac{3{,}15\cdot 10^{-3}}{1050} = 3\cdot 10^{-6}\ \text{m}^{2}/\text{s}
          $$
          $$
          v_1 = \frac{2000\cdot 3\cdot 10^{-6}}{0{,}04} = 0{,}15\ \text{m/s}
          \qquad
          Q = 0{,}15\cdot\frac{\pi\,0{,}04^{2}}{4} = 0{,}1885\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El factor de fricción de la tubería de cobre
        pregunta: |
          Con ese caudal, ¿cuánto vale el factor de fricción de la tubería 2?
        respuesta:
          tipo: numero
          valor: '0.03635'
          tolerancia: 0.0005
          formato: un número sin unidades
        distractores:
          - valor: '0.032'
            mensaje: |
              Ese es el de la tubería 1, $64/2000$. La 2 lleva el mismo caudal
              por un tubo de 14 mm: su Reynolds es 5714 y el flujo es
              turbulento.
          - valor: '0.0112'
            mensaje: |
              Has aplicado Hagen-Poiseuille, $64/Re$, a la tubería 2, que no es
              laminar: con $Re = 5714$ está pasada la zona crítica.
        pista: |
          $Re_2 = v_2D_2/\nu$. El cobre, con $\varepsilon/D = 1{,}07\cdot
          10^{-4}$, se comporta como liso mientras $Re < 23/(\varepsilon/D)$.
        desarrollo: |
          $$
          v_2 = \frac{Q}{\pi\,0{,}014^{2}/4} = 1{,}224\ \text{m/s}
          \qquad
          Re_2 = \frac{1{,}224\cdot 0{,}014}{3\cdot 10^{-6}} = 5714
          $$

          El cobre tiene $\varepsilon/D = 0{,}00015/1{,}4 = 1{,}07\cdot 10^{-4}$,
          así que es liso hasta $Re' = 23/(\varepsilon/D) = 214\,667$. Con
          $Re_2 = 5714$, liso y por debajo de $10^{5}$: **Blasius**, que es
          explícita.

          $$
          f_2 = \frac{0{,}316}{5714^{0{,}25}} = 0{,}03635
          $$

          Es lo que pide la nota: no hay que iterar, porque no es obligatorio.
          Colebrook, que sí obliga a iterar, da 0,0361.

      - tipo: calcular
        titulo: La pérdida en la tubería de cobre
        pregunta: |
          ¿Cuánta carga se pierde en la tubería 2, en metros de columna del
          fluido?
        respuesta:
          tipo: magnitud
          valor: '5.958 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '1.836 m'
            mensaje: |
              Sale de haber usado $f = 64/Re_2 = 0{,}0112$, como si la tubería
              2 fuera laminar. No lo es: con $Re = 5714$, el $f$ turbulento es
              más de tres veces mayor.
          - valor: '0.1837 m'
            mensaje: |
              Esa es la de la tubería 1, la laminar. La 2, casi siete veces
              más corta, pierde treinta y dos veces más: el mismo caudal por un tubo
              de 14 mm va ocho veces más deprisa.
        pista: |
          Darcy-Weisbach con el $f$ de Blasius: $h_f = f\,(L/D)\,v^{2}/2g$.
        desarrollo: |
          $$
          h_{f2} = 0{,}03635\cdot\frac{30}{0{,}014}\cdot\frac{1{,}224^{2}}{19{,}6}
          = 5{,}958\ \text{m}
          $$

          Y en la tubería 1, laminar:

          $$
          h_{f1} = \frac{64}{2000}\cdot\frac{200}{0{,}04}\cdot\frac{0{,}15^{2}}{19{,}6}
          = 0{,}184\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de la bomba en columna del fluido
        pregunta: |
          La bomba da $H_m = 5{,}25$ mca. ¿Cuántos metros de columna de este
          fluido son?
        respuesta:
          tipo: magnitud
          valor: '5 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '5.25 m'
            mensaje: |
              Has leído los mca como metros de este fluido. «mca» son metros de
              columna de **agua**, una unidad de presión: el fluido pesa un 5 %
              más que el agua y le basta una columna un 5 % más corta.
          - valor: '5.51 m'
            mensaje: |
              Has multiplicado por la densidad relativa en vez de dividir. Un
              fluido más pesado que el agua necesita **menos** columna para la
              misma presión.
        pista: |
          Una columna en mca es siempre de agua
          ([tema 4](/road-to-ingenieria/fluidos/t04-hidrostatica/#una-columna-en-mca-es-siempre-de-agua)):
          $h_{\text{fluido}} = h_{\text{mca}}\,\gamma_{\text{agua}}/\gamma$.
        desarrollo: |
          $$
          H_m = 5{,}25\cdot\frac{9800}{10\,290} = 5{,}00\ \text{m de columna del fluido}
          $$

      - tipo: calcular
        titulo: La máxima diferencia de presiones
        pregunta: |
          ¿Cuánto vale la máxima $\Delta p = p_A - p_B$?
        respuesta:
          tipo: magnitud
          valor: '11.75 kpa'
          tolerancia: 0.035
          formato: una presión, con su unidad
        distractores:
          - valor: '9.17 kpa'
            mensaje: |
              Has restado la altura de la bomba sin convertir, 5,25 m en vez de
              5,00. Un cuarto de metro parece poco, pero $\Delta p$ es una resta
              de dos números parecidos y ese error se lleva la quinta parte del
              resultado.
          - valor: '29.02 kpa'
            mensaje: |
              Es lo que sale con la frontera laminar en $Re = 2300$. El tema 18
              la pone en 2000; con 2300 el caudal sube un 15 % y la pérdida en
              la tubería de cobre, casi un 28 %.
          - valor: '63.2 kpa'
            mensaje: |
              Te has dejado la bomba. Entre A y B la bomba aporta energía al
              fluido, y $\Delta p/\gamma$ es lo que se pierde **menos** lo que
              ella da.
        pista: |
          Bernoulli de lámina a lámina, con las dos en la cota 15:
          $p_A/\gamma + H_m = p_B/\gamma + h_{f1} + h_{f2}$.
        desarrollo: |
          Entre las dos láminas, quietas y a la misma cota:

          $$
          \frac{p_A}{\gamma} + H_m = \frac{p_B}{\gamma} + h_{f1} + h_{f2}
          $$
          $$
          \Delta p = 10\,290\cdot(0{,}184 + 5{,}958 - 5{,}00)
          = 10\,290\cdot 1{,}142 = 11{,}75\ \text{kPa}
          $$

          Con Colebrook en vez de Blasius sale 11,37 kPa: un 0,6 % de
          diferencia en $f$ se convierte en un 3 % en $\Delta p$, porque la
          resta de dos números parecidos lo amplifica. Por eso esta casilla
          acepta un 3,5 %.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Laminar en el conducto 1 quiere decir $Re \le 2000$, y eso fija
              la velocidad, 0,15 m/s, y el caudal, 0,1885 l/s.
          - texto: >-
              El mismo caudal por la tubería 2, de 14 mm, da $Re = 5714$:
              turbulento y liso, así que Blasius da $f = 0{,}0363$ sin iterar.
          - texto: >-
              Se pierden 0,18 m en la 1 y 5,96 en la 2, y la bomba da 5,25 mca,
              que en columna de este fluido son 5,00 m.
          - texto: >-
              Entre dos láminas a la misma cota,
              $\Delta p = \gamma\,(h_{f1} + h_{f2} - H_m) = 11{,}75$ kPa.
          - texto: >-
              Y como la tubería 1 es la larga, con 200 m, es la que se lleva
              casi toda la pérdida.
            trampa: true
            mensaje: |
              Al revés: la 1 pierde 0,18 m y la 2, 5,96, treinta y dos veces
              más siendo casi siete veces más corta. El mismo caudal por un tubo de
              14 mm va ocho veces más deprisa y en régimen turbulento, y la
              pérdida crece mucho más con eso que con la longitud.

    resolucion: |
      **Qué fija el caudal.** La pregunta es la máxima $\Delta p$ con el
      conducto 1 laminar, y las dos cosas van juntas: más diferencia de
      presiones empuja más caudal, y el tope es la frontera laminar del tema
      18, $Re = 2000$, en la tubería de 40 mm. Con $\rho = 1050$ kg/m³ y
      $\nu = 3\cdot 10^{-6}$ m²/s:

      $$
      v_1 = 0{,}15\ \text{m/s}
      \qquad
      Q = 0{,}1885\ \text{l/s}
      $$

      **Las dos pérdidas.** En la 1, laminar, $f = 64/Re$ y
      $h_{f1} = 0{,}184$ m. En la 2 el mismo caudal va a $1{,}224$ m/s y
      $Re_2 = 5714$: turbulento. El cobre, con
      $\varepsilon/D = 1{,}07\cdot 10^{-4}$, es liso hasta
      $Re' = 214\,667$, y por debajo de $10^{5}$ el tema 18 da Blasius:

      $$
      f_2 = \frac{0{,}316}{Re_2^{0{,}25}} = 0{,}03635
      \qquad
      h_{f2} = 5{,}958\ \text{m}
      $$

      Es la lectura de la nota: «iterar sólo cuando sea obligatorio». Con
      Blasius no hace falta ninguna iteración.

      **La bomba, en columna del fluido.** Los 5,25 mca son metros de columna
      de **agua**
      ([tema 4](/road-to-ingenieria/fluidos/t04-hidrostatica/#una-columna-en-mca-es-siempre-de-agua)).
      Este fluido pesa $10\,290$ N/m³, así que son $5{,}00$ m de su columna.

      **El balance.** Las dos láminas están en la cota 15 y quietas:

      $$
      \Delta p = \gamma\,(h_{f1} + h_{f2} - H_m)
      = 10\,290\cdot 1{,}142 = 11{,}75\ \text{kPa}
      $$

      que es el resultado impreso.

      **Por qué estuvo fuera.** Hasta el 30 de septiembre de 2026 este
      ejercicio no se publicaba: con la bomba leída como 5,25 m de fluido y el
      cobre por Colebrook salían 8,80 kPa (por Blasius, 9,17), y con la
      frontera en 2300, 25,7. Faltaba convertir los
      mca, que es el mismo detalle que el ejercicio 5 de la extraordinaria de
      2025 y el 4 de la ordinaria de 2026. Y el resultado depende tanto de él
      porque $\Delta p$ es la diferencia entre lo que se pierde, 6,14 m, y lo
      que da la bomba, 5,00: un cuarto de metro de error en la bomba es la
      quinta parte de la respuesta.
