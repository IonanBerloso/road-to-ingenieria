ejercicios:
  # ── 1 (10 %) · Compresibilidad. Cincuenta mililitros de fuga y once bares
  #    de caída: el módulo de elasticidad volumétrico visto desde el lado que
  #    asusta.
  - id: exflu2324-ext-1-los-cincuenta-mililitros-que-faltan
    titulo: Cincuenta mililitros que se escapan, y once bares que se pierden
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Supóngase un tanque metálico rígido, con una capacidad de 100 litros en
      volumen y un peso de $34{,}0\ \text{kg}$ en vacío. Este depósito se llena
      de agua a $25\ \text{bar}$ de presión. En esta situación, el conjunto
      pesa un total de $134{,}109\ \text{kg}$. Si accidentalmente se abre una
      válvula y se pierde un determinado volumen de agua, se ha comprobado en
      el exterior que son $50\ \text{ml}$, ¿cuál será la pérdida de presión en
      el interior del depósito?
    notas:
      - >-
        **NOTA**: módulo de elasticidad volumétrico del agua 2,2 GPa.
    pide: La caída de presión dentro del depósito tras la fuga.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tanque es **rígido** y sigue lleno después de la fuga. ¿Qué ha
          cambiado dentro?
        opciones:
          - texto: >-
              La densidad: el mismo volumen contiene ahora menos masa, y en un
              líquido eso solo puede ocurrir bajando la presión
            correcta: true
            mensaje: |
              Eso es, y es todo el ejercicio. El volumen no puede cambiar
              —el tanque es rígido y el agua lo llena— así que la única
              variable libre es la densidad, ligada a la presión por $K$.
          - texto: >-
              El volumen de agua: ahora hay 50 ml menos y queda un hueco
            mensaje: |
              Si quedara un hueco habría vapor o aire, y el problema sería
              otro. Lo que ocurre es que el agua **se expande** al bajar la
              presión y vuelve a llenar el tanque, con menos masa.
          - texto: >-
              Nada: el agua es incompresible, así que la presión no cambia
            mensaje: |
              Si fuera incompresible, perder una gota vaciaría el tanque de
              golpe. Precisamente porque es **casi** incompresible, perder
              medio por mil de la masa cuesta once bares.

      - tipo: calcular
        titulo: La densidad del agua comprimida
        pregunta: |
          ¿Qué densidad tiene el agua dentro del tanque antes de la fuga?
        respuesta:
          tipo: magnitud
          valor: '1001.09 kg/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '1341.09 kg/m3'
            mensaje: |
              Te has dejado el peso del tanque vacío. La masa de agua es
              $134{,}109 - 34{,}0 = 100{,}109$ kg.
          - valor: '1.001 kg/m3'
            mensaje: |
              Has dividido entre 100, tomando los litros por metros cúbicos.
              La capacidad son $0{,}1\ \text{m}^{3}$, y la densidad tiene que
              salir del orden de los mil kilos por metro cúbico.
        pista: |
          La masa de agua es el peso total menos el del tanque, y el volumen
          son los 100 litros.
        desarrollo: |
          $$
          m = 134{,}109 - 34{,}0 = 100{,}109\ \text{kg}
          \qquad
          \rho = \frac{100{,}109}{0{,}1} = 1001{,}09\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La caída de presión
        pregunta: |
          ¿Cuánto baja la presión, en bar? (con su signo)
        respuesta:
          tipo: numero
          valor: '-10.99'
          tolerancia: 0.1
          formato: un número en bar, con su signo
        distractores:
          - valor: '-1.099'
            mensaje: |
              Ese es el valor en **megapascales**. Un bar son $10^{5}$ Pa, así
              que $1{,}099$ MPa son casi once bares.
          - valor: '-25'
            mensaje: |
              Parece que has supuesto que el tanque se despresuriza del todo.
              Con 50 ml perdidos la presión baja once bares y se queda en
              catorce: el agua se expande y sigue llenando el tanque.
        pista: |
          $\Delta p = K\,\dfrac{\Delta\rho}{\rho}$, con la masa perdida
          ocupando el mismo volumen de 100 litros.
        desarrollo: |
          Los 50 ml se miden **fuera**, a presión atmosférica, así que son
          $0{,}050$ kg de masa perdida:

          $$
          \rho' = \frac{100{,}059}{0{,}1} = 1000{,}59\ \text{kg/m}^{3}
          $$
          $$
          \Delta p = K\,\frac{\rho'-\rho}{\rho}
          = 2{,}2\cdot 10^{9}\,\frac{-0{,}5}{1001{,}09}
          = -1{,}099\ \text{MPa} = -10{,}99\ \text{bar}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El tanque es rígido y sigue lleno, así que el volumen no cambia
              y toda la variación va a la densidad.
          - texto: >-
              El agua a 25 bar tiene $1001{,}09\ \text{kg/m}^{3}$; tras perder
              50 gramos, $1000{,}59$.
          - texto: >-
              Medio kilo por metro cúbico —un $0{,}05\ \%$— cuesta once bares,
              porque $K = 2{,}2$ GPa amplifica muchísimo.
          - texto: >-
              Y como el agua es tan poco compresible, en las instalaciones
              hidráulicas se puede despreciar siempre su compresibilidad.
            trampa: true
            mensaje: |
              Es justamente al revés en dos casos que el temario trata a
              fondo: el **golpe de ariete**, donde toda la sobrepresión sale
              de que el agua se comprime, y los circuitos hidráulicos
              cerrados, donde una fuga minúscula despresuriza el sistema. Que
              la compresibilidad sea pequeña no la hace despreciable: la hace
              **sensible**, que es otra cosa.

    resolucion: |
      **La idea, en una frase.** El tanque es rígido y el agua lo llena antes
      y después, así que el volumen es el mismo y toda la fuga se traduce en
      **densidad**.

      **La densidad inicial.** El enunciado da el peso total —134,109 kg— para
      que salga:

      $$
      \rho = \frac{134{,}109 - 34{,}0}{0{,}1} = 1001{,}09\ \text{kg/m}^{3}
      $$

      Un uno por mil por encima de los 1000 de siempre: eso es lo que hacen
      25 bares al agua.

      **La caída.** Los 50 ml se miden en el exterior, a presión atmosférica,
      así que son 50 gramos:

      $$
      \Delta p = K\,\frac{\Delta\rho}{\rho}
      = 2{,}2\cdot 10^{9}\,\frac{-0{,}5}{1001{,}09} = -10{,}99\ \text{bar}
      $$

      **Y el orden de magnitud, que es lo que hay que llevarse.** Cincuenta
      mililitros de cien litros son **medio por mil** del contenido, y se
      llevan casi la mitad de la presión. La razón es que
      $K/p = \frac{2{,}2\cdot 10^{9}}{2{,}5\cdot 10^{6}} = 880$: cada punto
      porcentual de densidad vale 880 puntos porcentuales de presión.

      Es el mismo número que explica el golpe de ariete —un fluido que casi no
      cede responde con presiones enormes a cambios pequeños— y el que hace
      que un circuito hidráulico pierda la presión con una gota de fuga. **La
      poca compresibilidad del agua no es una simplificación: es la causa de
      los dos fenómenos más violentos de la asignatura.**

  # ── 2 (15 %) · Arquímedes contado como una noticia: por qué se hundió la
  #    gabarra del Athletic. Y el apartado c) mete un gas ideal dentro de un
  #    problema de flotación.
  - id: exflu2324-ext-2-la-gabarra-que-se-hundio
    titulo: La gabarra que se hundió al llegar al agua dulce
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, 24 de junio de 2024 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      El Athletic, con el fin de preparar la celebración de la Copa del Rey,
      realizó ensayos con la gabarra para asegurarse de que no se hundiera. El
      no-hundimiento se garantizaba manteniendo una distancia mínima de
      $0{,}4\ \text{m}$ respecto al nivel del agua, y en estas condiciones se
      calculó que debían caber 60 personas de $80\ \text{kg}$ en la barca.

      Sin embargo, no se tuvo en cuenta un factor importante: los ensayos se
      hicieron en agua salada ($s = 1{,}025$), pero al final del trayecto de
      la ría el agua era dulce ($s = 1$). Debido a ello, estando las 60
      personas montadas, finalmente el día de la celebración se hundió.

      Considerando la gabarra como rectangular, y teniendo ésta
      $15\ \text{m}$ de largo, se pide:

      a) Calcular la masa de la gabarra (sin gente montada).

      b) Calcular cuántas personas de $80\ \text{kg}$ podrían montarse para
      que en agua dulce se mantengan los $0{,}4\ \text{m}$ de seguridad.

      Tras hundirse en agua dulce ($s = 1$), la barca llega a una situación de
      equilibrio en la ría, tal y como se muestra en la imagen. Al volcarse,
      el volumen de aire inicial de la gabarra se comprime en un proceso
      isotermo. Sabiendo esto, se pide:

      c) Calcular la altura **h** de la cámara de aire generada (despreciar el
      peso del aire de la cámara).

      d) Calcular la profundidad **H** respecto a la superficie de la parte
      superior de la barca.

      e) Dibujar los prismas de presiones **acotados** que actúan sobre cada
      superficie de la gabarra.

      f) Calcular la fuerza resultante total horizontal y vertical, e indicar
      la dirección de cada una de ellas.

      **Notas nuestras.** Las dos figuras del cuadernillo dan las medidas que
      el texto no dice. En la primera, la gabarra flota con la gente a bordo:
      **8 m** de ancho, **1 m** de altura de costado y 0,4 m de ella por encima
      del agua. En la segunda está volcada y hundida en agua dulce: su fondo
      queda arriba, a la profundidad $H$ de la superficie, y debajo de él la
      cámara de aire, de altura $h$, con el agua por debajo entre los dos
      costados. *El cuadernillo imprime «Sabiendo ésto»; corregimos la
      errata.*
    pide: La masa de la gabarra, el aforo en agua dulce, la cámara de aire, su profundidad y la resultante.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se hunde al pasar de agua salada a dulce, si no ha subido
          nadie más?
        opciones:
          - texto: >-
              Porque el empuje es el peso del **agua desplazada**, y el agua
              dulce pesa un $2{,}5\ \%$ menos: hace falta desplazar más
              volumen para el mismo peso, y el calado sube
            correcta: true
            mensaje: |
              Eso es. Con el mismo peso a bordo, el volumen sumergido tiene
              que crecer un 2,5 %: el calado pasa de 0,600 a 0,615 m, y el
              resguardo baja de 40 a 38,5 cm, por debajo del mínimo exigido.
          - texto: >-
              Porque el agua dulce es menos viscosa y la barca se hunde más
              deprisa
            mensaje: |
              La viscosidad no interviene en la flotación: Arquímedes solo
              habla de densidad. Y de hecho el agua dulce a la misma
              temperatura es **más** viscosa que la salada.
          - texto: >-
              Porque en la ría hay corriente y eso reduce la sustentación
            mensaje: |
              Una gabarra flota, no se sustenta hidrodinámicamente: está
              parada o casi, y lo que la mantiene arriba es el empuje. La
              corriente no cambia el empuje.

      - tipo: calcular
        titulo: La masa de la gabarra
        pregunta: |
          ¿Cuánto pesa la gabarra vacía?
        respuesta:
          tipo: magnitud
          valor: '69000 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '73800 kg'
            mensaje: |
              Te has dejado a las sesenta personas. Los $73\,800$ kg son el
              **desplazamiento total** con la gente a bordo; la gabarra sola
              pesa 4 800 kg menos.
          - valor: '67200 kg'
            mensaje: |
              Has usado la densidad del agua **dulce**. El ensayo se hizo en
              agua salada, $s = 1{,}025$, y ese es justamente el origen del
              accidente.
        pista: |
          Calado en el ensayo $= 1 - 0{,}4 = 0{,}6$ m. El empuje sostiene la
          gabarra **y** la gente.
        desarrollo: |
          $$
          V = 8\cdot 15\cdot 0{,}6 = 72\ \text{m}^{3}
          \qquad
          m_{\text{desplazada}} = 72\cdot 1025 = 73\,800\ \text{kg}
          $$
          $$
          m_{\text{gabarra}} = 73\,800 - 60\cdot 80 = 69\,000\ \text{kg}
          $$

      - tipo: calcular
        titulo: El aforo en agua dulce
        pregunta: |
          ¿Cuántas personas caben manteniendo los $0{,}4\ \text{m}$ en agua
          dulce? (solo el número)
        respuesta:
          tipo: numero
          valor: '37'
          tolerancia: 0.5
          formato: un número entero de personas
        distractores:
          - valor: '60'
            mensaje: |
              Ese es el aforo calculado en el ensayo, con agua salada. El
              ejercicio existe precisamente para ver cuánto se equivocó: son
              veintitrés personas de más.
          - valor: '38'
            mensaje: |
              Salen $37{,}5$, y aquí hay que redondear **hacia abajo**: con 38
              personas el resguardo baja de los 40 cm exigidos. Media persona
              no sube a una barca.
        pista: |
          El mismo volumen de 72 m³, ahora con $\rho = 1000$.
        desarrollo: |
          $$
          n = \frac{72\cdot 1000 - 69\,000}{80} = 37{,}5
          \;\Longrightarrow\;
          \textbf{37 personas}
          $$

      - tipo: calcular
        titulo: La cámara de aire
        pregunta: |
          Volcada y en equilibrio, ¿qué altura tiene la cámara de aire?
        respuesta:
          tipo: magnitud
          valor: '0.575 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1 m'
            mensaje: |
              Esa es la altura de la cámara **inicial**, con la barca a flote
              y el aire a presión atmosférica. Al volcarse el aire se
              comprime, y la cámara es más baja.
          - valor: '0.615 m'
            mensaje: |
              Has contado también a las sesenta personas: $73\,800$ kg. Volcada,
              la gabarra ya no lleva a nadie, y la cámara de aire solo tiene que
              sostener su masa, $69\,000$ kg.
        pista: |
          El empuje de la cámara de aire tiene que sostener los 69 000 kg de
          la gabarra.
        desarrollo: |
          $$
          \rho\,g\,(8\cdot 15\cdot h) = m\,g
          \;\Longrightarrow\;
          h = \frac{69\,000}{1000\cdot 120} = 0{,}575\ \text{m}
          $$

      - tipo: calcular
        titulo: La profundidad de la barca
        pregunta: |
          ¿A qué profundidad queda la parte superior de la barca?
        respuesta:
          tipo: magnitud
          valor: '7.067 m'
          tolerancia: 0.02
          formato: una profundidad, con su unidad
        distractores:
          - valor: '7.642 m'
            mensaje: |
              Te has dejado la columna de agua que hay dentro de la cámara. La
              presión del aire iguala a la del agua en la **interfaz**, que
              está $h$ más abajo que el techo de la cámara.
          - valor: '0.575 m'
            mensaje: |
              Esa es la altura de la cámara de aire. La profundidad $H$ es
              otra cosa: cuánto se ha hundido la barca, y sale de la
              compresión isoterma del aire.
        pista: |
          Isotermo: $p_{at}V_0 = p_1V_1$, y $p_1$ es la presión del agua a la
          profundidad de la interfaz.
        desarrollo: |
          $$
          p_{at}\cdot 120 = p_1\cdot 120\,h
          \;\Longrightarrow\;
          p_1 = \frac{101\,325}{0{,}575} = 176\,217\ \text{Pa}
          $$
          $$
          p_1 = p_{at} + \rho g\,(H+h)
          \;\Longrightarrow\;
          H = \frac{176\,217 - 101\,325}{9800} - 0{,}575 = 7{,}067\ \text{m}
          $$

      - tipo: dibujar
        consigna: |
          El apartado e) en papel: la gabarra volcada, con su fondo arriba a
          $7{,}067$ m de la superficie y la cámara de aire de $0{,}575$ m, y el
          prisma de presiones acotado sobre cada superficie: el fondo, por
          fuera y por dentro, y los costados, por fuera y por dentro. Trabaja
          en presiones relativas: la atmosférica está en todas partes, también
          dentro de la cámara, y se cancela.
        comprueba:
          - punto: >-
              Sobre el fondo, por fuera, el agua: un rectángulo de
              $\gamma H = 69{,}26$ kPa hacia abajo. Por dentro, el aire: un
              rectángulo de $74{,}89$ kPa hacia arriba.
            porque: >-
              La cara de fuera está entera a la profundidad $H$, y la de dentro
              entera en contacto con el aire, que tiene la misma presión en toda
              la cámara. La diferencia, $5{,}635$ kPa por los 120 m² del fondo,
              es la resultante del apartado f): $676{,}2$ kN hacia arriba.
          - punto: >-
              La presión del aire acotada como la del agua en la interfaz,
              $\gamma(H + h) = 74{,}89$ kPa, que es la misma que da la isoterma:
              $176{,}2$ kPa absolutos.
            porque: >-
              El aire está en equilibrio con el agua que tiene justo debajo, así
              que su presión es la de la interfaz; y es la que da Boyle al pasar
              de 120 a 69 m³. Son las dos ecuaciones del apartado d), y el
              prisma las junta.
          - punto: >-
              En cada costado, por fuera, un trapecio de $69{,}26$ kPa arriba a
              $79{,}06$ kPa abajo. Por dentro, un rectángulo de $74{,}89$ kPa en
              la altura del aire y, por debajo de la interfaz, un trapecio de
              $74{,}89$ a $79{,}06$ kPa.
            porque: >-
              Por debajo de la interfaz hay agua a los dos lados y a la misma
              profundidad, así que ahí los dos prismas son iguales y se anulan.
              Donde dentro hay aire, queda un triángulo neto hacia fuera, de
              $5{,}635$ kPa arriba a cero en la interfaz.
          - punto: >-
              Los dos costados iguales y opuestos, y lo mismo los dos testeros
              de 8 m: la resultante horizontal es nula.
            porque: >-
              La gabarra es simétrica y cada costado empuja hacia fuera lo mismo
              que el de enfrente. Es el $F_H = 0$ impreso; el apartado pide los
              prismas de cada superficie aunque se anulen, porque son los que lo
              demuestran.
        figura: |
          <svg viewBox="0 0 420 596" role="img" width="420" height="596" aria-labelledby="ex2324e2-prismas-t ex2324e2-prismas-d">
            <title id="ex2324e2-prismas-t">La gabarra volcada y los prismas de presiones sobre su fondo y sus costados, acotados</title>
            <desc id="ex2324e2-prismas-d">Tres dibujos. El primero es la gabarra volcada en agua dulce, de 8 metros de ancho y 1 de costado: el fondo arriba, a 7,067 metros de la superficie, con esa profundidad cortada porque no cabe a escala; debajo del fondo la cámara de aire, de 0,575 metros, y por debajo de ella agua entre los dos costados. El segundo es el fondo con sus dos prismas, en presiones relativas: por encima, el agua de fuera, un rectángulo de 69,26 kilopascales que empuja hacia abajo; por debajo, el aire de la cámara, un rectángulo de 74,89 kilopascales que empuja hacia arriba, algo más alto. La diferencia, 5,635 kilopascales (γ·h) en 120 metros cuadrados, son los 676,2 kilonewtons hacia arriba. El tercero es un costado con sus dos prismas: por fuera, el agua, un trapecio de 69,26 kilopascales arriba a 79,06 abajo; por dentro, un rectángulo de 74,89 en la altura del aire y, por debajo de la interfaz, un trapecio de 74,89 a 79,06 igual al de fuera a la misma altura. Lo que no se anula es un triángulo de 5,635 kilopascales a cero en la altura del aire, hacia fuera; el otro costado es igual y opuesto, y la horizontal es nula.</desc>
