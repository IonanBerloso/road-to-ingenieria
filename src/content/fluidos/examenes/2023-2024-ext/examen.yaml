# Siete de los ocho ejercicios, del cuadernillo «Exámenes 2020-2025».
# Porcentajes impresos: 10 / 15 / 10 / 15 / 10 / 15 / 12,5 / 12,5, sin
# reparto por competencia, así que van sin `puntos`.
#
# **Falta el 8**, y queda dicho por qué. Pide la máxima diferencia de
# presiones entre dos tanques para que el conducto anterior a la bomba siga
# siendo laminar. Tomando Re = 2000 como frontera salen 8,80 kPa y el examen
# publica 11,75; con Re = 2300 se dispara a 25,7. Ninguna de las dos
# fronteras usuales da el número impreso y no se ha encontrado una tercera
# lectura que lo explique. §13 caso 2.
#
# Lo que este examen aporta al corpus:
#
# - **La gabarra del Athletic** (ej. 2), que es Arquímedes contado como una
#   noticia: por qué se hundió al pasar de agua salada a dulce, y en cuánto
#   se equivocó el ensayo. Y el apartado c) mete un gas ideal dentro de un
#   problema de flotación.
# - **Un tanque rígido del que se escapan 50 ml** (ej. 1) y la presión cae
#   once bares: el módulo de elasticidad volumétrico visto desde el lado que
#   asusta.
# - **Un venturímetro calibrado con un Pitot** (ej. 4): dos manómetros
#   distintos, uno para el caudal teórico y otro para el real, y de su
#   cociente sale el coeficiente.
# - **Una calzada como canal** (ej. 7), con dos cunetas semicirculares y el
#   firme inundado en invierno.
