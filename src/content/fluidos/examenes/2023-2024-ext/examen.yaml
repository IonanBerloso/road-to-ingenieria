asignatura: fluidos
curso: '2023-2024'
convocatoria: extraordinaria
fecha: 24 de junio de 2024
# La extraordinaria de junio de 2024, del cuadernillo «Exámenes 2020-2025»,
# págs. 53 a 56 (59 a 62 del PDF). Están los ocho.
#
# Publica el resultado de cada apartado y no la resolución (`pdfEs:
# enunciado-con-resultados`), y no imprime reparto por competencia sino el
# porcentaje de cada ejercicio junto a su número, «1. (10%)». Esos
# porcentajes van en `puntosImpresos` y suman 100; los ejercicios van sin
# `puntos`.
#
# **El 8 estuvo en `fuera` hasta el 30 de septiembre de 2026**, con el motivo
# de que ninguna frontera laminar daba los 11,75 kPa impresos: con Re = 2000
# salían 8,80 (con Colebrook) y con 2300, 25,7. Se leía la altura de la
# bomba, 5,25 mca, como metros del fluido que se bombea, y son de columna de
# agua: en columna de este fluido, de 10 290 N/m³, son 5,00 m. Con eso, Re = 2000 en el conducto 1
# y la tubería de cobre como lisa, que da su factor de fricción por Blasius
# sin iterar —lo que pide la nota del enunciado—, salen 11,747 kPa. Es la
# misma conversión que el tema 4 explica en «Una columna en mca es siempre de
# agua».
#
# Desde ese mismo día los siete enunciados que ya estaban son los del
# cuadernillo, palabra por palabra, con lo que añadimos en «Notas nuestras»
# y las dos notas impresas, la del 1 y la de las iteraciones del 8, en
# `notas`. El 6 había perdido una frase que puntúa: «Se quiere obtener una
# presión dinámica de 5 mca a la salida de las boquillas».
#
# Lo que este examen aporta al corpus:
#
# - **La gabarra del Athletic** (ej. 2), que es Arquímedes contado como una
#   noticia: por qué se hundió al pasar de agua salada a dulce, y en cuánto
#   se equivocó el ensayo. Y el apartado c) mete un gas ideal dentro de un
#   problema de flotación.
# - **Un tanque rígido del que se escapan 50 ml** (ej. 1) y la presión cae
#   once bares: el módulo de elasticidad volumétrico visto desde el lado que
#   asusta.
# - **Un venturímetro calibrado con un Pitot** (ej. 4): dos manómetros
#   distintos, uno para el caudal teórico y otro para el real, y de su
#   cociente sale el coeficiente.
# - **Una calzada como canal** (ej. 7), con dos cunetas semicirculares y el
#   firme inundado en invierno.
# - **Un caudal que no se da y lo fija el régimen** (ej. 8): la frontera
#   laminar de una tubería decide cuánto pasa por las dos.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (10%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 10 }
    - { n: 2, puntos: 15 }
    - { n: 3, puntos: 10 }
    - { n: 4, puntos: 15 }
    - { n: 5, puntos: 10 }
    - { n: 6, puntos: 15 }
    - { n: 7, puntos: 12.5 }
    - { n: 8, puntos: 12.5 }

# `fuera` queda vacío: están los ocho.

