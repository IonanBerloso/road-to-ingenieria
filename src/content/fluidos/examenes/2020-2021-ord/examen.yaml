asignatura: fluidos
curso: '2020-2021'
convocatoria: ordinaria
fecha: 28 de junio de 2021
# **Seis de los ocho.** Del cuadernillo «Exámenes 2020-2025» del
# departamento.
#
# Porcentajes impresos: 15 / 10 / 10 / 15 / 10 / 12,5 / 12,5 / 15, sin
# reparto por competencia, así que van sin `puntos`.
#
# **Faltan dos, y por motivos distintos.**
#
# - El **5** es un elevador hidráulico de taller con ocho apartados
#   encadenados y una válvula de seguridad; la figura no acota las cotas
#   de los puntos B, C, D y E, y sin ellas los 75,38 y 76,26 bar
#   publicados no se pueden reconstruir. §13 caso 2.
# - El **7** es teoría y dibujo: definiciones, esquemas de aparatos de
#   medida y las líneas de alturas totales y piezométrica de una
#   instalación con turbina Pelton, trazadas cualitativamente. No hay
#   resultado que verificar.
#
# Y dentro del **4** se publican solo los apartados a) y b): el c) pide
# las componentes de la fuerza sobre un codo convergente cuya figura
# —el «detalle B»— no permite fijar sin ambigüedad qué ángulo va a la
# entrada y cuál a la salida. Nuestra reconstrucción da 2.488 y 4.239 N
# frente a los 4.274 y 2.426 publicados: los mismos órdenes de magnitud
# con los ejes intercambiados. Queda dicho en la resolución.
#
# Lo que este examen aporta al corpus:
#
# - **Una presa con dos leyes** (ej. 1), según el agua tape o no la parte
#   inclinada del paramento, más la subpresión del terreno permeable.
# - **Un coeficiente de velocidad medido por lo que se pierde** (ej. 2),
#   no por lo que sale: el manómetro lee la pérdida y de ahí sale $C_v$.
# - **Un aliviadero de dos rampas** (ej. 3), con un diámetro comercial que
#   redondear y una pendiente que hay que subir a la milésima siguiente.
# - **Golpe de ariete con la longitud como incógnita** (ej. 4), y la
#   celeridad calculada con el módulo del cobre y el espesor del tubo.
# - **Un túnel de viento presurizado** (ej. 6) donde la semejanza absoluta
#   pide 10 bar y el túnel llega a 6.
pdf: examenes-2020-2025.pdf

fuera:
  - n: 5
    motivo: >-
      Un elevador hidráulico de taller con ocho apartados encadenados y
      una válvula de seguridad. La figura no acota las cotas de los puntos
      B, C, D y E, y sin ellas los 75,38 y 76,26 bar publicados no se
      pueden reconstruir.
  - n: 7
    motivo: >-
      Teoría y dibujo: definiciones de presión dinámica, estática, cota
      piezométrica y Bernoulli; el aparato que mide la presión dinámica en
      dos situaciones; y las líneas de alturas totales y piezométrica de una
      instalación con turbina Pelton, trazadas cualitativamente.

      El motivo estaba mal escrito hasta el 5 de septiembre de 2026: decía
      «no publica ningún resultado contra el que comprobar una
      transcripción», que es cierto pero no es la razón. La razón es que su
      enunciado **no contiene ninguna cuenta**, ni siquiera escondida, y el
      formato guiado exige un paso de cálculo o de verificación.

      La diferencia con el ejercicio 9 de 2025-2026, que también era «solo
      teoría» y sí entró, es exactamente esa: aquel avisaba de que cada fallo
      resta lo mismo que suma un acierto, y de ahí salía una cuenta real
      sobre cuándo compensa dejar un hueco en blanco. Aquí no hay nada
      equivalente, y añadir un paso de cálculo inventado para que encajase
      sería rellenar.

      Lo que sí se puede hacer, y queda anotado como trabajo y no como
      bloqueo: llevar sus tres apartados a la prosa de los temas 12 y 13. Las
      definiciones y los medidores ya están; las líneas de alturas totales y
      piezométrica de una instalación **con turbina** no las dibuja ningún
      tema, y esa figura sí falta.

