fuera:
  - n: 7
    motivo: >-
      Teoría y dibujo, sin una sola cuenta: definir presión dinámica, presión
      estática, cota piezométrica y Bernoulli en un tubo a presión; nombrar y
      esquematizar el aparato que mide la presión dinámica dentro de una
      tubería presurizada y en un chorro que sale de un depósito; y trazar,
      de forma cualitativa, las líneas de alturas totales y piezométrica de
      un embalse que alimenta una turbina Pelton con la válvula parcialmente
      cerrada. Se queda fuera porque el enunciado no trae ninguna cuenta, ni
      siquiera escondida, y el formato guiado exige un paso de cálculo o de
      verificación: inventar uno para que encajase sería rellenar.


      Lo que pregunta sí está enseñado, apartado por apartado. Las cuatro
      definiciones, en el tema 12, [Tres formas, y la que se
      usa](/road-to-ingenieria/fluidos/t12-bernoulli/#tres-formas-y-la-que-se-usa),
      y en el 13, [Estática, dinámica y
      total](/road-to-ingenieria/fluidos/t13-medidores/#estática-dinámica-y-total).
      Los dos aparatos, en el tema 13: dentro de la tubería, un Pitot con un
      piezómetro, o un tubo de Prandtl, que junta los dos ([Pitot y
      Prandtl](/road-to-ingenieria/fluidos/t13-medidores/#pitot-y-prandtl));
      en el chorro libre, el Pitot solo, porque la atmósfera hace de toma
      estática ([Reconocer un Pitot en un
      esquema](/road-to-ingenieria/fluidos/t13-medidores/#reconocer-un-pitot-en-un-esquema)).
      Y las dos líneas de la instalación con turbina, dibujadas, en el tema
      23, [Las líneas de alturas de la instalación
      entera](/road-to-ingenieria/fluidos/t23-turbinas/#las-líneas-de-alturas-de-la-instalación-entera).

