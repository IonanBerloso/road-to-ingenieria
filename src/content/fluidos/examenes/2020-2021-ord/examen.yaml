# **Siete de los ocho.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 31 a 36 del PDF.
#
# Porcentajes impresos: 15 / 10 / 10 / 15 / 10 / 12,5 / 12,5 / 15, sin
# reparto por competencia: van en `puntosImpresos`, en %, y suman 100. Como
# el 7 falta entero, cada entrada lleva su `n`.
#
# **Hasta el 30 de septiembre de 2026 faltaban el 5 y el c) del 4, y ya no.**
#
# - El **5**, el elevador de taller, estaba fuera porque «la figura no acota
#   las cotas de los puntos B, C, D y E». Sí las acota: mirada a 300 ppp
#   (pág. 33), el nivel de A está en la cota 2, B y E en la 0, C en la 20, y
#   el pistón sube 10 m hasta D. Con eso y g = 9,8 salen los 75,38, 76,26,
#   79,63 y 80,51 bar y los 4,25 m impresos.
# - El **c) del 4**, el codo convergente del «detalle B», estaba fuera porque
#   su reconstrucción daba 2488 y 4239 N frente a los 4274,02 y 2426,1
#   impresos, «con los ejes intercambiados». No estaban intercambiados: α =
#   30° va a la entrada —en el detalle está en la boca ancha, por donde entra
#   el fluido— y β = 60° a la salida, y como α + β = 90° las dos ramas son
#   perpendiculares, y lo impreso son las componentes según ellas. 2488 y
#   4239 N son la misma fuerza en ejes horizontal y vertical: 4915 N de
#   módulo en los dos casos.
#
# Sigue fuera el **7**, que no tiene ni una cuenta (motivo abajo).
#
# Lo que este examen aporta al corpus:
#
# - **Una presa con dos leyes** (ej. 1), según el agua tape o no la parte
#   inclinada del paramento, más la subpresión del terreno permeable.
# - **Un coeficiente de velocidad medido por lo que se pierde** (ej. 2), con
#   un Pitot en el chorro: el manómetro lee la pérdida y de ahí sale $C_v$.
# - **Un aliviadero de dos rampas** (ej. 3), con un diámetro comercial que
#   redondear y una pendiente que hay que subir a la milésima siguiente.
# - **Golpe de ariete con la longitud como incógnita** (ej. 4), y un codo
#   convergente cuya fuerza sale casi entera de las presiones.
# - **Un elevador que no llega arriba** (ej. 5): la columna de aceite que
#   crece al subir es lo que hace saltar la válvula de seguridad.
# - **Un túnel de viento presurizado** (ej. 6) donde la semejanza absoluta
#   pide 10 bar y el túnel llega a 6.
