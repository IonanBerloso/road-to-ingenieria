      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          Con la bomba encendida y sin la válvula del c), el caudal mayor de
          los dos, ¿cuánto vale el $NPSH$ disponible, en m?
        respuesta:
          tipo: magnitud
          valor: '10.96 m'
          tolerancia: 0.005
          formato: una altura, con su unidad
        distractores:
          - valor: '8.96 m'
            mensaje: |
              Has puesto la bomba por encima del agua. El eje está en la cota
              21 y la lámina en la 22: la bomba está un metro **por debajo**,
              y ese metro suma.
          - valor: '11.16 m'
            mensaje: |
              Te sale alto. Lo más probable es que no hayas restado la tensión
              de vapor, 0,2 mca: el $NPSH$ es lo que queda por encima de la
              presión a la que el agua hierve, no por encima del cero
              absoluto. Si sí la has restado, mira la atmósfera: 1 bar son
              10,2 mca, no 10,33.
          - valor: '0.76 m'
            mensaje: |
              Has trabajado en presiones manométricas. El $NPSH$ se mide en
              absoluta: la atmósfera, 10,2 mca, empuja el agua hacia la bomba,
              y es casi todo el margen.
        pista: |
          $NPSH_d = P_{atm}/\gamma + (z_A - z_B) - h_{f,asp} - P_v/\gamma$,
          con la pérdida de los 10 m de aspiración por Hazen-Williams al
          caudal del b). Las pérdidas menores están en la impulsión.
        desarrollo: |
          $$
          h_{f,asp} = 10\,J_1\,Q^{1{,}852} = 0{,}043\ \text{m}
          $$
          $$
          NPSH_d = \frac{10^{5}}{9800} + (22-21) - 0{,}043 - 0{,}2
          = 10{,}96\ \text{m}
          $$

          A 27,81 l/s, que son 100 m³/h, la curva del catálogo pide unos
          3,5 mca: sobran más de siete metros, y aun con el margen del 1,3
          que se usa al diseñar, 4,6 m, no hay riesgo.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              El eje de la bomba está en la cota 21 y la lámina del depósito
              en la 22: la bomba está **por debajo** del agua.
          - texto: >-
              Eso significa que la aspiración trabaja en carga, con un metro a
              favor en vez de en contra.
          - texto: >-
              Con la atmósfera en 10,2 mca, la tensión de vapor en 0,2 y una
              pérdida de aspiración de apenas 4 cm, el $NPSH$ disponible ronda
              los 11 metros.
          - texto: >-
              Aun así podría cavitar, porque la boquilla de 40 mm crea una
              depresión que se transmite a la aspiración.
            trampa: true
            mensaje: |
              La boquilla está en la **impulsión**, aguas abajo de la bomba, y
              lo que hace ahí es crear contrapresión, no depresión en la
              aspiración. Aguas abajo de una bomba nada puede afectar a su
              $NPSH$ disponible más que a través del caudal. Con once metros
              de $NPSH$ disponible no hay riesgo.
    resolucion: |
      **a) Con la bomba apagada.** El depósito está a la cota 22 y la boquilla
      a la 5: hay 17 metros de salto. Casi todo se convierte en velocidad de
      salida, porque la tubería es ancha —200 mm para 23 l/s— y apenas pierde:

      $$
      17 = \frac{v_c^{2}}{2g} + 1{,}1\,h_f
      \qquad
      h_f = 0{,}22\ \text{m}
      $$
      $$
      v_c = 18{,}12\ \text{m/s}
      \qquad
      Q = 22{,}77\ \text{l/s}
      \qquad
      h = 16{,}75\ \text{m}
      $$

      **b) Con la bomba encendida.** Ahora la curva de la instalación —con
      Hazen-Williams y $C_{HW} = 130$, que sale de la rugosidad relativa del
      tramo y no del nombre del material: el cuadro n.º 20 da para el acero
      comercial $\varepsilon = 0{,}006$ cm, que en 200 mm son
      $\varepsilon/D = 3\cdot 10^{-4}$, dentro de la banda de 130— se corta
      con la de la bomba:

      $$
      Q = 27{,}81\ \text{l/s}
      \qquad
      h = 24{,}99\ \text{m}
      $$

      Ocho metros más de chorro por 22 % más de caudal: la altura va con el
      cuadrado.

      **c) La válvula.** Para $h = 20$ m hace falta $Q = 24{,}88$ l/s, y a ese
      caudal la bomba da $8{,}98$ m mientras la instalación solo pide
      $25{,}35$ de los $30{,}98$ disponibles. La diferencia la quema la
      válvula:

      $$
      h_v = 5{,}63\ \text{m}
      $$

      **d) La cavitación.** El eje de la bomba está en la cota 21 y el agua en
      la 22: la bomba trabaja **en carga**, con un metro a favor. Con la
      atmósfera en 10,2 mca, la tensión de vapor en 0,2 y cuatro centímetros
      de pérdida en los 10 m de aspiración, el $NPSH$ disponible es de
      **10,96 m**. Se compara con el requerido, que da la curva del catálogo
      de la figura: a 27,81 l/s, que son 100 m³/h, unos 3,5 mca. Sobran más de
      siete metros, y aun con el margen del 1,3 que se usa al diseñar, 4,6 m,
      no hay riesgo de cavitación.

      **Una nota sobre el enunciado, que es didáctica y no un descuido.** El
      apartado a) pide Darcy-Weisbach y el b) Hazen-Williams para la **misma**
      tubería. No es una incoherencia: es una forma de que compares las dos
      formulaciones sobre un caso idéntico. A 22,77 l/s, con Darcy el tramo
      pierde 0,22 m y con Hazen-Williams, 0,27: un 20 % más de pérdida, pero
      cinco centímetros sobre diecisiete metros de salto, y el caudal apenas
      se mueve.
