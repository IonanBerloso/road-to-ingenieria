ejercicios:
  # ── 1 (15 %) · Una presa con dos leyes según el agua tape o no el
  #    paramento inclinado, y la subpresión del terreno permeable.
  - id: exflu2021-ord-1-la-presa-con-dos-leyes
    titulo: La presa con dos leyes, y el terreno que empuja desde abajo
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Una presa separa dos masas de agua. A la **izquierda** se tiene agua
      dulce ($s = 1$), siendo su profundidad $H$. A la **derecha** se tiene
      agua de mar ($s = 1{,}05$), siendo en este caso la profundidad $h$. Los
      valores de $H$ pueden oscilar entre 3 y 12 metros, mientras que los de
      $h$ entre 1 y 3 metros. La presa tiene una longitud normal a la figura
      de $b = 25$ m.

      **a)** Calcular la resultante (módulo, dirección y sentido) de la fuerza
      hidrostática que ejerce el agua dulce sobre la presa **en función de la
      profundidad $H$** y para el rango completo de valores de dicha variable
      (3-12 m).

      **b)** Calcular la resultante de la fuerza hidrostática que ejerce el
      agua salada sobre la presa **en función de $h$** y para el rango
      completo (1-3 m).

      Se considera a continuación que el material que sirve de base a los
      fluidos y a la presa no es impermeable, de forma que los fluidos se
      infiltrarán y ejercerán presión sobre la presa en su base. El valor de
      esta presión en el punto A bajo la base será igual al inmediatamente
      adyacente en el fluido, y otro tanto ocurrirá en el punto B. Entre los
      dos puntos la presión variará linealmente.

      **c)** Calcular la resultante de la fuerza hidrostática que ejercen los
      fluidos infiltrados en el material de la base sobre la presa, teniendo
      en cuenta los máximos valores de profundidad para $H$ y $h$.

      En la figura, el paramento de aguas arriba sube inclinado desde A —el
      pie de aguas arriba— hasta la cota 8,5 m con un retranqueo horizontal de
      6 m, y de ahí sigue vertical. La coronación está a 13 m y tiene 3 m de
      ancho. El paramento de aguas abajo baja desde la coronación hasta B con
      6 m de retranqueo. La base AB mide 18 m.
    pide: Las dos resultantes hidrostáticas en función del calado, y la subpresión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el apartado a) tiene **dos** expresiones distintas según el
          valor de $H$?
        opciones:
          - texto: >-
              Porque por encima de 8,5 m el paramento deja de ser inclinado y
              pasa a ser vertical, y el volumen de agua que descansa sobre él
              deja de crecer igual
            correcta: true
            mensaje: |
              Eso es. La componente **horizontal** sigue siendo
              $\tfrac12\gamma H^{2}b$ pase lo que pase, porque solo depende de
              la proyección vertical. La que cambia de ley es la **vertical**:
              hasta 8,5 m el agua se apoya sobre un triángulo, y por encima
              se le añade un rectángulo de 6 m de ancho.
          - texto: >-
              Porque a partir de 8,5 m el agua desborda la presa
            mensaje: |
              La coronación está a 13 m, así que con $H$ hasta 12 no
              desborda. Los 8,5 son la cota donde el paramento cambia de
              forma, no donde se acaba la presa.
          - texto: >-
              Porque por encima de 8,5 m hay que usar la densidad del agua
              salada
            mensaje: |
              El agua salada está al otro lado, y es el apartado b). El agua
              dulce es dulce a cualquier profundidad.

      - tipo: calcular
        titulo: El ángulo de la resultante con poca agua
        pregunta: |
          Con $H \le 8{,}5$ m, ¿qué ángulo forma la resultante con la
          horizontal, en grados?
        respuesta:
          tipo: numero
          valor: '35.21'
          tolerancia: 0.1
          formato: un número en grados
        distractores:
          - valor: '54.79'
            mensaje: |
              Ese es el complementario. El ángulo se mide respecto de la
              **horizontal**, y su tangente es $F_V/F_H = 6/8{,}5$.
          - valor: '45'
            mensaje: |
              Serían 45º si el paramento estuviera a 45º, es decir con 8,5 m
              de retranqueo en 8,5 de altura. Aquí el retranqueo es de 6.
        pista: |
          Con el agua sin pasar de 8,5 m, la relación $F_V/F_H$ no depende de
          $H$: es la pendiente del paramento.
        desarrollo: |
          $$
          F_H = \tfrac12\gamma H^{2}b
          \qquad
          F_V = \tfrac12\gamma H^{2}b\,\frac{6}{8{,}5}
          $$
          $$
          \alpha = \arctan\frac{6}{8{,}5} = 35{,}21^{\circ}
          $$

          Mientras el agua no pase de 8,5 m, **el ángulo es constante** y solo
          crece el módulo, con el cuadrado del calado.

      - tipo: calcular
        titulo: La resultante con la presa llena
        pregunta: |
          Con $H = 12$ m, ¿cuánto vale el módulo de la resultante del agua
          dulce, en MN?
        respuesta:
          tipo: magnitud
          valor: '21 MN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '17.64 MN'
            mensaje: |
              Esa es solo la componente horizontal,
              $\tfrac12\gamma H^{2}b$. Falta la vertical, que con 12 m de
              agua vale 11,4 MN.
          - valor: '11.4 MN'
            mensaje: |
              Esa es solo la componente vertical, el peso del agua que
              descansa sobre el paramento inclinado más el rectángulo que
              queda encima.
        pista: |
          Por encima de 8,5 m, $F_V = 6\gamma b (H-4{,}25)$.
        desarrollo: |
          $$
          F_R = \gamma_1 b\sqrt{\frac{H^{4}}{4}+36\,(H-4{,}25)^{2}}
          = 245000\sqrt{5184+2162{,}25} = 21{,}0\ \text{MN}
          $$
          $$
          \alpha = \arctan\frac{12\,(H-4{,}25)}{H^{2}} = 32{,}85^{\circ}
          $$

      - tipo: calcular
        titulo: La subpresión del terreno
        pregunta: |
          Con $H = 12$ y $h = 3$, ¿cuánto vale la resultante de la subpresión,
          en MN?
        respuesta:
          tipo: magnitud
          valor: '33.41 MN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '52.92 MN'
            mensaje: |
              Has tomado la presión de A en toda la base. Varía
              **linealmente** de A a B, así que lo que cuenta es la media de
              las dos, que es el área del trapecio.
          - valor: '13.89 MN'
            mensaje: |
              Parece que has tomado la presión de B en toda la base, o has
              usado 6 m de anchura en vez de los 18 de la base completa.
        pista: |
          Prisma trapecial: presión media por área de la base, con
          $18\times 25$ m.
        desarrollo: |
          $$
          F_{v3} = \Bigl(\frac{\gamma_1 H}{2}+\frac{\gamma_2 h}{2}\Bigr)
          \cdot 18\cdot b
          = (58800+15435)\cdot 450 = 33{,}41\ \text{MN}\ (\uparrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La componente horizontal es siempre $\tfrac12\gamma H^{2}b$; la
              que cambia de ley al pasar de 8,5 m es la vertical.
          - texto: >-
              El agua salada empuja al otro lado con una resultante inclinada
              24,78º, constante en dirección para todo su rango.
          - texto: >-
              La subpresión del terreno permeable es un prisma trapecial sobre
              los 18 m de base, y con los calados máximos vale 33,4 MN hacia
              arriba.
          - texto: >-
              Como la subpresión es vertical y la presa pesa mucho, es la
              menos importante de las tres fuerzas.
            trampa: true
            mensaje: |
              Es la **mayor de las tres**: 33,4 MN frente a los 21,0 del agua
              dulce y 1,3 del agua salada. Y va hacia arriba, es decir
              descontando peso propio a la presa justo cuando más lo
              necesita. Por eso las presas de gravedad llevan pantallas de
              impermeabilización y drenes bajo el cimiento: la subpresión es
              el enemigo principal, no el empuje del embalse.
    resolucion: |
      **a) El agua dulce, con dos leyes.** La componente horizontal es
      siempre la misma, porque solo depende de la proyección vertical del
      paramento:

      $$
      F_H = \tfrac12\gamma_1 H^{2}b
      $$

      La vertical es el peso del agua que descansa sobre el paramento, y ahí
      sí importa la forma:

      - **Con $H \le 8{,}5$ m** el agua solo cubre el tramo inclinado. El
        volumen es un triángulo semejante, y

        $$
        F_R = \tfrac12\gamma_1 H^{2}b\sqrt{1+\Bigl(\frac{6}{8{,}5}\Bigr)^{2}}
        \qquad
        \alpha = 35{,}21^{\circ}
        $$

        con el ángulo **constante**: solo crece el módulo.

      - **Con $H \ge 8{,}5$ m** se añade un rectángulo de 6 m de ancho, y

        $$
        F_R = \gamma_1 b\sqrt{\frac{H^{4}}{4}+36\,(H-4{,}25)^{2}}
        \qquad
        \alpha = \arctan\frac{12\,(H-4{,}25)}{H^{2}}
        $$

        Ahora el ángulo sí cambia con el calado: con $H = 12$ vale
        $32{,}85^{\circ}$ y el módulo, $21{,}0$ MN.

      **b) El agua salada.** Su paramento baja 13 m con 6 de retranqueo, y el
      calado nunca pasa de 3 m, así que hay una sola ley:

      $$
      F_R = \tfrac12\gamma_2 h^{2}b\sqrt{1+\Bigl(\frac{6}{13}\Bigr)^{2}}
      \qquad
      \beta = 24{,}78^{\circ}
      $$

      Con $h = 3$ m son $1{,}28$ MN.

      **c) La subpresión.** El terreno transmite la presión del agua a la base
      de la presa: $\gamma_1 H$ en A, $\gamma_2 h$ en B, y lineal entre los
      dos. El prisma es un trapecio sobre los 18 m de base:

      $$
      F_{v3} = \Bigl(\frac{\gamma_1 H}{2}+\frac{\gamma_2 h}{2}\Bigr)18\,b
      = 33{,}41\ \text{MN}\ (\uparrow)
      $$

      **Y ahí está lo que enseña el ejercicio.** La subpresión es **mayor que
      las otras dos fuerzas juntas**, y va hacia arriba: le quita a la presa
      3.400 toneladas de peso efectivo. Es la razón de que una presa de
      gravedad lleve siempre pantalla de impermeabilización aguas arriba y una
      línea de drenes bajo el cimiento. El fallo de Saint-Francis en 1928 y el
      de Malpasset en 1959 tuvieron mucho que ver con esto.

  # ── 2 (10 %) · Un coeficiente de velocidad medido por lo que se pierde,
  #    no por lo que sale.
  - id: exflu2021-ord-2-el-coeficiente-medido-por-la-perdida
    titulo: El coeficiente de velocidad, medido por lo que se pierde
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para la instalación de la figura:

      **a)** Deducir la expresión del coeficiente de velocidad del orificio
      $C_v$ en función del resto de variables que se ven en la imagen.

      **b)** Calcular el valor de dicho coeficiente para el caso en el que se
      despresurice el depósito, la relación $R/H = 0{,}02$ y las densidades
      relativas de los fluidos sean 1 y 10.

      En la figura, un depósito con manómetro $P$ contiene un líquido de
      densidad relativa $s$ hasta una altura $H$ sobre un orificio lateral;
      un manómetro en U con líquido de densidad relativa $s_m$ mide, con una
      lectura $R$, la pérdida que se produce en el orificio.
    pide: La expresión del coeficiente de velocidad y su valor numérico.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro mide la **pérdida** que se produce en el orificio.
          ¿Cómo se relaciona eso con $C_v$?
        opciones:
          - texto: >-
              La energía que sale es $C_v^{2}$ veces la teórica, así que la
              que se pierde es $H\,(1-C_v^{2})$
            correcta: true
            mensaje: |
              Eso es. $C_v = v_{real}/v_{teo}$, y como la energía va con el
              cuadrado de la velocidad, la altura cinética real es
              $C_v^{2}H$. Lo que falta hasta $H$ es lo que se ha degradado, y
              es lo que lee el manómetro.
          - texto: >-
              La pérdida es $H\,(1-C_v)$, porque el coeficiente es lineal
            mensaje: |
              El coeficiente es lineal en la **velocidad**, no en la energía.
              La pérdida es una altura, y las alturas cinéticas van con
              $v^{2}$.
          - texto: >-
              La pérdida no depende de $C_v$: depende del coeficiente de
              contracción
            mensaje: |
              El coeficiente de contracción reduce el **área** del chorro, no
              su velocidad, y no degrada energía. Lo que mide la pérdida es
              exactamente el de velocidad.

      - tipo: calcular
        titulo: El coeficiente de velocidad
        pregunta: |
          Con $R/H = 0{,}02$, $s = 1$ y $s_m = 10$, ¿cuánto vale $C_v$?
        respuesta:
          tipo: numero
          valor: '0.906'
          tolerancia: 0.005
          formato: un número entre cero y uno
        distractores:
          - valor: '0.424'
            mensaje: |
              Has tomado la lectura del manómetro como la **energía que
              sale** en vez de como la que se pierde. Un orificio con
              $C_v = 0{,}42$ sería malísimo: los reales andan entre 0,95 y
              0,99.
          - valor: '0.82'
            mensaje: |
              Ese es $C_v^{2}$, no $C_v$. Falta la raíz.
          - valor: '0.98'
            mensaje: |
              Parece que has usado $1-R/H$ sin el factor
              $s_m/s - 1$. La lectura del manómetro son milímetros de
              líquido **manométrico**, y hay que pasarlos a columna del
              fluido que circula.
        pista: |
          La pérdida en metros del fluido que circula es
          $R\,(s_m/s - 1)$, y vale $H\,(1-C_v^{2})$.
        desarrollo: |
          $$
          H\,(1-C_v^{2}) = R\Bigl(\frac{s_m}{s}-1\Bigr)
          $$
          $$
          C_v = \sqrt{1-\frac{R}{H}\Bigl(\frac{s_m}{s}-1\Bigr)}
          = \sqrt{1-0{,}02\cdot 9} = \sqrt{0{,}82} = 0{,}906
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin presurizar el depósito, la energía disponible en el orificio
              es $H$ y la velocidad teórica $\sqrt{2gH}$.
          - texto: >-
              La velocidad real es $C_v$ veces la teórica, así que la altura
              cinética real es $C_v^{2}H$ y lo perdido, $H(1-C_v^{2})$.
          - texto: >-
              El manómetro lee esa pérdida como $R(s_m/s-1)$ metros de
              columna del fluido que circula.
          - texto: >-
              Un $C_v$ de 0,906 es normal en un orificio de pared delgada.
            trampa: true
            mensaje: |
              Es **bajo**. Los coeficientes de velocidad de un orificio de
              pared delgada bien ejecutado andan entre 0,95 y 0,99: el chorro
              apenas pierde energía, y lo que sí reduce el caudal es la
              contracción, con $C_c \approx 0{,}62$. Un $0{,}906$ delata un
              borde mal acabado o un orificio corto que hace de tubo.
    resolucion: |
      **La idea, que es lo que hace distinto a este ejercicio.** Lo habitual
      es medir $C_v$ midiendo el chorro. Aquí se mide **lo que falta**: la
      energía que el orificio degrada.

      **a) La expresión.** Con el depósito a presión $P$ y una altura $H$
      sobre el orificio, la energía disponible es
      $H + P/\gamma$ y la velocidad teórica $\sqrt{2g(H+P/\gamma)}$. La real
      es $C_v$ veces esa, así que la altura cinética que sale es $C_v^{2}$
      veces la disponible y lo perdido es

      $$
      \Delta h = \Bigl(H+\frac{P}{\gamma}\Bigr)(1-C_v^{2})
      $$

      El manómetro en U, con líquido $s_m$, lee esa misma pérdida:

      $$
      \Delta h = R\Bigl(\frac{s_m}{s}-1\Bigr)
      \qquad\Longrightarrow\qquad
      C_v = \sqrt{1-\frac{R\,(s_m/s-1)}{H+P/\gamma}}
      $$

      **b) El número.** Despresurizado, $P = 0$:

      $$
      C_v = \sqrt{1-0{,}02\cdot 9} = \sqrt{0{,}82} = 0{,}906
      $$

      **Y una comprobación de sensatez.** Un orificio de pared delgada bien
      hecho tiene $C_v$ entre 0,95 y 0,99. Que salga 0,906 significa que este
      pierde un 18 % de la energía: bastante para un orificio, y una pista de
      que el borde no está afilado o de que el espesor de la pared lo
      convierte en un tubo corto. Saber qué valores son normales es parte de
      resolver el problema; un coeficiente fuera de rango es una alarma, no un
      resultado.

  # ── 3 (10 %) · Un aliviadero de dos rampas: media caña con diámetro
  #    comercial y canal rectangular óptimo con pendiente redondeada.
  - id: exflu2021-ord-3-el-aliviadero-de-dos-rampas
    titulo: El aliviadero de dos rampas, y las dos formas de redondear
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El aliviadero lateral de una presa sirve para evacuar agua si se supera
      cierto nivel de llenado que se considera peligroso. El aliviadero está
      formado por varias conducciones paralelas idénticas que se reparten
      uniformemente el caudal a evacuar y que fueron construidas de **hormigón
      acabado**. Cada una de estas conducciones paralelas está formada por dos
      rampas: una primera semicircular de pendiente $J_1$ y una segunda
      rectangular de pendiente $J_2$. Un terraplén provisto de piedras pesadas
      hace de frontera entre ambas rampas y sirve también como elemento
      disipador de energía. Puede considerarse que se alcanzan las condiciones
      de flujo permanente en las dos rampas. Se espera que cada una de las
      canalizaciones paralelas sea capaz de evacuar un caudal mínimo de
      $3\ \text{m}^{3}/\text{s}$.

      **a)** Seleccionar el diámetro comercial mínimo (cm) a instalar en la
      primera rampa, de pendiente $J_1$ de 1,5 milésimas. Indicar qué
      porcentaje del diámetro se tendrá como berma de seguridad instalado
      dicho diámetro. Los diámetros comerciales están disponibles cada 5 cm.

      **b)** Calcular la pendiente necesaria $J_2$ para que el canal
      rectangular en configuración hidráulicamente óptima transporte el caudal
      indicado con un calado de $H = 1$ m, y calcular la velocidad del flujo
      en dicha configuración. ¿Qué valor tendría esa velocidad si se instala
      la pendiente inmediatamente superior a la deducida, redondeada a la
      próxima milésima?
    pide: El diámetro comercial de la media caña con su berma, y la pendiente y la velocidad del canal rectangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué calado hay que dimensionar la primera rampa, la
          semicircular?
        opciones:
          - texto: >-
              Con la media caña llena hasta el diámetro, que es su máxima
              capacidad; después se comprueba cuánto sobra realmente
            correcta: true
            mensaje: |
              Eso es. Se busca el diámetro mínimo que **puede** llevar los
              3 m³/s, es decir el que a sección llena da justo ese caudal; se
              redondea al comercial siguiente, y con ese diámetro ya sobrado
              se calcula el calado real y lo que sobra por encima.
          - texto: >-
              Con la sección llena hasta la mitad del radio, por seguridad
            mensaje: |
              Un margen a ojo no es un dato del problema. El enunciado no da
              resguardo: pide el diámetro mínimo y **después** preguntar
              cuánto resguardo resulta.
          - texto: >-
              Con el calado crítico
            mensaje: |
              El calado crítico aparece en vertederos y en cambios de
              régimen. Aquí el enunciado dice explícitamente que se alcanzan
              **condiciones de flujo permanente**, es decir régimen uniforme:
              manda Manning.

      - tipo: calcular
        titulo: El diámetro comercial de la media caña
        pregunta: |
          ¿Qué diámetro comercial hay que instalar en la primera rampa, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.95 m'
            mensaje: |
              El cálculo exacto da $1{,}954$ m, y hacia abajo no vale: con
              1,95 la media caña no llega a los 3 m³/s. Al redondear una
              capacidad se sube siempre al comercial siguiente.
          - valor: '0.98 m'
            mensaje: |
              Has dado el radio. La media caña de radio $0{,}977$ m tiene
              $1{,}954$ m de diámetro.
        pista: |
          Media caña llena: $A = \pi R^{2}/2$, $P = \pi R$, $R_h = R/2$, con
          $n = 0{,}012$ y $J_1 = 0{,}0015$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}012}\,\frac{\pi R^{2}}{2}
          \Bigl(\frac{R}{2}\Bigr)^{2/3}\sqrt{0{,}0015}
          = 3{,}193\,R^{8/3} = 3
          $$
          $$
          R = 0{,}977\ \text{m}
          \qquad
          D = 1{,}954\ \text{m}
          \;\longrightarrow\;
          D_{com} = 2{,}00\ \text{m}
          $$

          Con $D = 2$ m, el calado real para 3 m³/s baja a $0{,}964$ m, así
          que la berma es de $3{,}6$ cm: en torno al **1,7-1,8 %** del
          diámetro.

      - tipo: calcular
        titulo: La pendiente del canal rectangular
        pregunta: |
          ¿Qué pendiente $J_2$ hace falta, en milésimas?
        respuesta:
          tipo: numero
          valor: '0.816'
          tolerancia: 0.005
          formato: un número en milésimas
        distractores:
          - valor: '1.5'
            mensaje: |
              Esa es la pendiente de la **primera** rampa. La segunda es
              rectangular y óptima, y con 1 m de calado necesita bastante
              menos.
          - valor: '3.27'
            mensaje: |
              Parece que has tomado $R_h = H = 1$ m en vez de $H/2$. En el
              rectángulo óptimo el radio hidráulico es la mitad del calado.
        pista: |
          Óptimo rectangular: $b = 2H = 2$ m, $A = 2$, $P = 4$,
          $R_h = 0{,}5$ m.
        desarrollo: |
          $$
          3 = \frac{1}{0{,}012}\cdot 2\cdot 0{,}5^{2/3}\sqrt{J_2}
          = 104{,}99\sqrt{J_2}
          $$
          $$
          J_2 = 8{,}16\cdot 10^{-4} = 0{,}816\ \text{milésimas}
          \qquad
          v_2 = \frac{3}{2} = 1{,}5\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad con la pendiente redondeada
        pregunta: |
          Si se ejecuta con la milésima siguiente, $J_2 = 1$, ¿a qué velocidad
          circula el mismo caudal, en m/s?
        respuesta:
          tipo: magnitud
          valor: '1.617 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.66 m/s'
            mensaje: |
              Has calculado el caudal que llevaría el canal **lleno hasta 1 m**
              con la pendiente nueva, y lo has dividido por la misma sección.
              Pero el caudal sigue siendo 3 m³/s: lo que baja es el calado, a
              $0{,}927$ m, y la sección con él.
          - valor: '1.5 m/s'
            mensaje: |
              Esa es la de la pendiente exacta. Con más pendiente el agua va
              más deprisa y ocupa menos calado, aunque el caudal no cambie.
        pista: |
          El caudal sigue siendo 3 m³/s y el ancho 2 m; lo que cambia es el
          calado. Hay que despejarlo de Manning y después dividir.
        desarrollo: |
          $$
          3 = \frac{1}{0{,}012}\,2y\Bigl(\frac{y}{1+y}\Bigr)^{2/3}
          \sqrt{0{,}001}
          \;\Longrightarrow\;
          y = 0{,}927\ \text{m}
          $$
          $$
          v = \frac{3}{2\cdot 0{,}927} = 1{,}617\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La media caña necesita $1{,}954$ m de diámetro, así que se
              instala la de 2 m y sobra un 1,8 % de resguardo.
          - texto: >-
              El canal rectangular óptimo con 1 m de calado tiene 2 m de ancho
              y necesita $0{,}816$ milésimas para llevar los 3 m³/s.
          - texto: >-
              Con la pendiente redondeada a una milésima, el mismo caudal
              circula con menos calado y algo más deprisa: 1,617 m/s.
          - texto: >-
              El terraplén de piedras entre las dos rampas está para frenar el
              agua, así que la segunda rampa se dimensiona con el caudal ya
              reducido.
            trampa: true
            mensaje: |
              El terraplén disipa **energía**, no caudal. El agua que entra
              tiene que salir: por las dos rampas circulan los mismos 3 m³/s.
              Lo que hace el disipador es matar la velocidad que trae la
              primera rampa para que la segunda arranque en régimen
              permanente, que es justo la hipótesis que el enunciado permite
              usar.
    resolucion: |
      **El dato común.** Hormigón acabado, $n = 0{,}012$ en el cuadro n.º 26.
      Y por las dos rampas circula el **mismo** caudal, 3 m³/s: el terraplén
      disipa energía, no agua.

      **a) La media caña.** Se busca el diámetro mínimo capaz de llevar los
      3 m³/s a sección llena, con $A = \pi R^{2}/2$, $P = \pi R$ y
      $R_h = R/2$:

      $$
      3{,}193\,R^{8/3} = 3
      \qquad
      R = 0{,}977\ \text{m}
      \qquad
      D = 1{,}954\ \text{m}
      $$

      Como los comerciales van de 5 en 5 cm, se instala el de **2,00 m**:
      hacia abajo no vale, porque no llegaría al caudal.

      Con esos 2 m ya hay holgura, y la pregunta es cuánta. Despejando el
      calado real para 3 m³/s sale $y = 0{,}964$ m, así que la berma es de
      unos $3{,}6$ cm, en torno al **1,7-1,8 %** del diámetro. El examen
      publica 1,7 %; la integración exacta de la sección circular da 1,80 %, y
      la diferencia es de lectura del cuadro n.º 27.

      **b) El canal rectangular.** En configuración óptima, $b = 2H = 2$ m:

      $$
      A = 2\ \text{m}^{2}
      \qquad
      P = 4\ \text{m}
      \qquad
      R_h = 0{,}5\ \text{m}
      $$
      $$
      J_2 = 0{,}816\ \text{milésimas}
      \qquad
      v_2 = 1{,}5\ \text{m/s}
      $$

      Y si se ejecuta con la milésima entera —que es lo que pasa en obra—, el
      canal es más rápido de lo necesario: el mismo caudal circula con
      $0{,}927$ m de calado y **1,617 m/s**. Un 8 % más de velocidad y 7 cm
      menos de agua, solo por redondear la pendiente hacia arriba.

      **Las dos formas de redondear, que es lo que enseña el ejercicio.** El
      diámetro se redondea **hacia arriba** porque es una capacidad y hacia
      abajo no llegaría. La pendiente también se redondea hacia arriba, pero
      ahí el efecto es el contrario: sobra capacidad y lo que hay que vigilar
      es que la velocidad no erosione el revestimiento.

  # ── 4 (15 %) · Golpe de ariete con la longitud como incógnita, y un
  #    sifón cuyo caudal máximo lo limita la cavitación en el punto alto.
  - id: exflu2021-ord-4-el-ariete-con-la-longitud-por-incognita
    titulo: El sifón que cavita arriba, y el ariete que mide la tubería
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se transporta un fluido de densidad relativa $s = 0{,}94$ desde un
      depósito A hasta un depósito E a través de un conducto de **cobre**, de
      400 mm de diámetro y 2 mm de espesor. Teniendo en cuenta las cotas de la
      imagen y sabiendo que se pierden 10 mcl por kilómetro de longitud de
      tubería, se pide:

      **a)** Calcular el caudal máximo que puede circular.

      A lo largo del segundo tramo (BC) de la tubería se encuentra una válvula
      de regulación. Al cerrar dicha válvula en 3 segundos, la sobrepresión
      generada es de 70 mcl.

      **b)** Calcular la longitud del segundo tramo (BC) hasta la válvula,
      justificando la respuesta.

      Datos: $p_{atm} = 0{,}987$ bar; $p_{vap}$ (abs) $= 2320$ Pa;
      $L_1 = 140$ m (tramo AB); módulo de elasticidad del fluido 2200 MPa y
      del cobre $1{,}1\cdot 10^{7}\ \text{N/cm}^{2}$.

      En la figura, la superficie del depósito A está en la cota 215, el punto
      alto B en la 224, y el depósito E, al que se descarga, en la 166.
    pide: El caudal máximo que admite el sifón, y la longitud del tramo BC.

    pasos:
      - tipo: reconocer
        pregunta: |
          El punto B está **por encima** de la superficie del depósito A.
          ¿Qué limita el caudal?
        opciones:
          - texto: >-
              La cavitación en B: la presión ahí no puede bajar de la tensión
              de vapor, y eso pone un tope a la altura cinética
            correcta: true
            mensaje: |
              Eso es. Es un sifón: para pasar por B el fluido tiene que estar
              en depresión, y cuanto más caudal, más depresión. El límite es
              que la presión absoluta en B llegue a la tensión de vapor; a
              partir de ahí el líquido hierve y el sifón se rompe.
          - texto: >-
              El desnivel entre A y E, que fija la energía disponible
            mensaje: |
              El desnivel da la energía, pero con 49 metros disponibles y
              10 mcl de pérdida por kilómetro el caudal sería enorme. Lo que
              corta antes es el punto alto.
          - texto: >-
              La rugosidad del cobre
            mensaje: |
              El enunciado ni siquiera la da: sustituye todo el rozamiento por
              «10 mcl por kilómetro». Lo que limita es la cavitación en B.

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Cuánto vale el caudal máximo, en l/s?
        respuesta:
          tipo: magnitud
          valor: '139.02 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '673 l/s'
            mensaje: |
              Te has dejado la pérdida del tramo AB. Son solo 1,4 metros en
              140 m de tubería, pero el margen disponible en B es de apenas
              6 centímetros de altura cinética: esos 1,4 metros son casi todo
              el problema.
          - valor: '251 l/s'
            mensaje: |
              Has usado una atmósfera de 1 bar en vez de los 0,987 del
              enunciado. Trece milibares son 14 cm de columna, y aquí el
              margen entero son 6 cm.
        pista: |
          Escribe la energía entre la superficie de A y el punto B, con la
          presión absoluta en B igual a la de vapor.
        desarrollo: |
          $$
          \frac{p_B}{\gamma} = \frac{2320-98700}{0{,}94\cdot 9800}
          = -10{,}462\ \text{m}
          $$
          $$
          215 - 1{,}4 = 224 - 10{,}462 + \frac{v^{2}}{2g}
          \;\Longrightarrow\;
          \frac{v^{2}}{2g} = 0{,}062\ \text{m}
          $$
          $$
          v = 1{,}107\ \text{m/s}
          \qquad
          Q = 1{,}107\cdot 0{,}1257 = 139{,}0\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿A qué velocidad viaja la onda de presión por esta tubería, en m/s?
        respuesta:
          tipo: magnitud
          valor: '684 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1530 m/s'
            mensaje: |
              Esa es la celeridad en el fluido **infinito**,
              $\sqrt{K/\rho}$: la que tendría si la tubería fuera
              indeformable. El cobre de 2 mm se dilata, y eso la reduce a
              menos de la mitad.
          - valor: '1425 m/s'
            mensaje: |
              Parece que has usado el módulo del cobre como si fuera el del
              fluido, o al revés. El que va en el numerador es el del
              **líquido**; el de la tubería aparece en el término corrector
              junto con $D/e$.
        pista: |
          $c = \sqrt{K/\rho}\,/\sqrt{1+(K/E)(D/e)}$, con $D/e = 200$.
        desarrollo: |
          $$
          \sqrt{\frac{K}{\rho}} = \sqrt{\frac{2{,}2\cdot 10^{9}}{940}}
          = 1530\ \text{m/s}
          $$
          $$
          1+\frac{K}{E}\frac{D}{e}
          = 1+\frac{2{,}2\cdot 10^{9}}{1{,}1\cdot 10^{11}}\cdot 200 = 5
          $$
          $$
          c = \frac{1530}{\sqrt{5}} = 684\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La longitud del tramo BC
        pregunta: |
          ¿Cuánto mide el tramo BC hasta la válvula, en metros?
        respuesta:
          tipo: magnitud
          valor: '790.15 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '930 m'
            mensaje: |
              Esa es la longitud **total** desde el depósito A hasta la
              válvula. En la fórmula de Michaud, $L$ es la distancia que
              recorre la onda hasta encontrar una superficie libre, es decir
              A-B-válvula; el tramo BC es eso menos los 140 m de AB.
          - valor: '1860 m'
            mensaje: |
              Te has dejado el 2 de la fórmula de Michaud,
              $\Delta h = 2Lv/(gT)$. El factor 2 está porque la onda tiene
              que ir y volver.
        pista: |
          Primero decide si el cierre es lento o rápido comparando $T$ con
          $2L/c$; después usa la fórmula que toque.
        desarrollo: |
          Con $c = 684$ m/s, el tiempo crítico de una tubería de unos 930 m es
          $2L/c = 2{,}7$ s, menor que los 3 s de cierre: el cierre es
          **lento**, así que vale Michaud.

          $$
          \Delta h = \frac{2\,L\,v}{g\,T}
          \;\Longrightarrow\;
          L = \frac{70\cdot 9{,}8\cdot 3}{2\cdot 1{,}107} = 930\ \text{m}
          $$
          $$
          L_{BC} = 930-140 = 790{,}15\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El caudal lo limita la cavitación en el punto alto B, y sale
              139 l/s con una altura cinética de solo 6 cm.
          - texto: >-
              La celeridad, con el módulo del cobre y $D/e = 200$, baja de
              1.530 a 684 m/s.
          - texto: >-
              Como el tiempo de cierre supera el crítico, el cierre es lento y
              se aplica Michaud, que da 930 m desde el depósito.
          - texto: >-
              Al ser un cierre lento, la sobrepresión es menor que la que daría
              un cierre instantáneo, así que la tubería está del lado de la
              seguridad.
            trampa: true
            mensaje: |
              La primera mitad es cierta —un cierre instantáneo daría
              $cv/g = 77$ m frente a los 70 medidos— pero la conclusión no se
              sigue. «Del lado de la seguridad» sería si la tubería estuviera
              calculada para el cierre instantáneo; el enunciado no dice nada
              de eso. Y setenta metros de columna sobre un conducto de cobre
              de 2 mm de espesor no es un margen: es el problema.
    resolucion: |
      **a) El caudal máximo, que lo limita un sifón.** El punto B está en la
      cota 224 y la superficie de A en la 215: el fluido tiene que **subir**
      nueve metros antes de bajar. Eso solo es posible en depresión, y la
      depresión tiene un tope: la tensión de vapor.

      $$
      \frac{p_B}{\gamma} = \frac{2320-98700}{9212} = -10{,}462\ \text{m}
      $$

      Escribiendo la energía entre la superficie de A y el punto B, con
      $1{,}4$ m de pérdida en los 140 m del tramo AB:

      $$
      215-1{,}4 = 224-10{,}462+\frac{v^{2}}{2g}
      \qquad
      \frac{v^{2}}{2g} = 0{,}062\ \text{m}
      $$

      **Seis centímetros de altura cinética.** Ese es todo el margen, y de ahí
      salen $v = 1{,}107$ m/s y $Q = 139$ l/s. Un sifón trabaja siempre al
      borde.

      **b) La longitud, medida con el golpe de ariete.** Primero la celeridad,
      que en una tubería de cobre de 2 mm de pared no es la del fluido libre:

      $$
      c = \frac{\sqrt{K/\rho}}{\sqrt{1+(K/E)(D/e)}}
      = \frac{1530}{\sqrt{5}} = 684\ \text{m/s}
      $$

      El tiempo crítico, $2L/c$, ronda los 2,7 s, menor que los 3 s de cierre:
      **cierre lento**, y vale Michaud:

      $$
      \Delta h = \frac{2Lv}{gT}
      \qquad
      L = \frac{70\cdot 9{,}8\cdot 3}{2\cdot 1{,}107} = 930\ \text{m}
      $$

      Esa $L$ es la distancia desde la válvula hasta la superficie libre más
      próxima aguas arriba, es decir **A**, pasando por B. Descontando los 140
      m del tramo AB:

      $$
      L_{BC} = 790{,}15\ \text{m}
      $$

      **Y lo bonito del ejercicio.** El golpe de ariete se usa aquí al revés
      de lo habitual: en vez de calcular la sobrepresión que produce una
      tubería conocida, se mide la sobrepresión para **averiguar dónde está la
      válvula**. Es exactamente el principio de los métodos de detección de
      fugas por transitorios.

  # ── 6 (12,5 %) · Un túnel de viento presurizado donde la semejanza
  #    absoluta pide 10 bar y el túnel llega a 6.
  - id: exflu2021-ord-6-el-tunel-de-viento-presurizado
    titulo: El túnel que necesita diez bares y solo tiene seis
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Unos ingenieros aeronáuticos quieren predecir la sustentación $F_L$ que
      se produce en su nuevo prototipo de ala de un aeroplano. La longitud de
      cuerda del ala es $L_c = 1{,}12$ m y su área de ala $A$ es de
      $10{,}7\ \text{m}^{2}$. El prototipo debe volar a una velocidad
      $v = 52$ m/s cerca del suelo, donde la temperatura es de 25 ºC.

      Los ingenieros construyen un modelo del ala a un décimo de escala para
      probarlo en un túnel aerodinámico que tiene la posibilidad de ser
      presurizado hasta un máximo de 6 bar (presión absoluta), manteniendo la
      temperatura en el túnel en 25 ºC. Se pide:

      **a)** Obtener los parámetros adimensionales que definen la fuerza de
      sustentación $F_L$, sabiendo que la fuerza es función de la longitud
      $L_c$, de la velocidad $v$, de la densidad del aire $\rho$, de la
      viscosidad absoluta $\mu$, de la velocidad del sonido $c$ y del ángulo
      de ataque $\alpha$. Tomar como variables repetidas $v$, $L_c$ y $\rho$.

      **b)** Calcular si serán válidos los valores obtenidos en el ensayo del
      modelo si se desea que se cumpla la semejanza dinámica absoluta, en el
      caso de realizar el ensayo en el túnel a la presión atmosférica.

      **c)** Calcular la presión absoluta (bar) del aire necesaria en el
      ensayo para lograr la semejanza dinámica absoluta y deducir si es
      posible conseguirla en nuestro túnel de viento.

      **d)** Se acepta que los efectos de compresibilidad sean despreciables
      para números de Mach menores de 0,3, no siendo necesario igualar el
      número de Mach en esos casos. Calcular la presión absoluta (bar) a que
      se debe presurizar el túnel para dar validez a los ensayos, la velocidad
      de ensayo en el modelo y la relación entre las fuerzas de sustentación
      del prototipo y del modelo.

      Notas: el ala prototipo vuela a través del aire a presión atmosférica de
      1 bar; la velocidad del sonido es de 346 m/s y se considera constante,
      ya que la temperatura es 25 ºC en todos los casos.
    pide: Los adimensionales, la presión que exige la semejanza absoluta y la del ensayo aceptable.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con la misma temperatura en modelo y prototipo, ¿qué impone la
          igualdad del número de Mach?
        opciones:
          - texto: >-
              Que las velocidades sean iguales, porque la velocidad del sonido
              solo depende de la temperatura
            correcta: true
            mensaje: |
              Eso es. $c$ es la misma —346 m/s— así que igualar $v/c$ es
              igualar $v$. El modelo tiene que soplar a los mismos 52 m/s que
              vuela el avión, y ahí se agota la libertad para ajustar
              Reynolds.
          - texto: >-
              Que la velocidad del modelo sea diez veces mayor
            mensaje: |
              Diez veces mayor es lo que pediría **Reynolds** si la densidad
              no cambiara. Mach pide velocidades iguales, y de la
              contradicción entre las dos sale todo el ejercicio.
          - texto: >-
              Que la presión del túnel sea la atmosférica
            mensaje: |
              La presión no aparece en el número de Mach. Aparece en el de
              Reynolds a través de la densidad, y ahí es donde se resuelve el
              conflicto.

      - tipo: calcular
        titulo: La presión que exige la semejanza absoluta
        pregunta: |
          ¿A qué presión absoluta habría que presurizar el túnel para lograr
          la semejanza dinámica absoluta, en bar?
        respuesta:
          tipo: magnitud
          valor: '10 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1 bar'
            mensaje: |
              Esa es la atmosférica, y es justo la que el apartado b) descarta:
              con ella el Reynolds del modelo sería diez veces menor que el
              del prototipo.
          - valor: '100 bar'
            mensaje: |
              Has elevado la escala al cuadrado. En el Reynolds la longitud
              entra a la primera potencia, así que la densidad tiene que
              multiplicarse por 10, no por 100.
        pista: |
          Mach iguala las velocidades; entonces Reynolds pide
          $\rho_m L_m = \rho_p L_p$. Y a temperatura constante,
          $\rho \propto p$.
        desarrollo: |
          $$
          v_m = v_p
          \qquad
          \rho_m\,\frac{L_p}{10} = \rho_p L_p
          \;\Longrightarrow\;
          \rho_m = 10\,\rho_p
          $$
          $$
          p_m = 10\ \text{bar} > 6\ \text{bar}
          $$

          **No es posible** en este túnel.

      - tipo: calcular
        titulo: La presión del ensayo aceptable
        pregunta: |
          Renunciando a Mach pero sin pasar de $Ma = 0{,}3$, ¿a qué presión
          hay que presurizar el túnel, en bar?
        respuesta:
          tipo: magnitud
          valor: '5 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '6 bar'
            mensaje: |
              Es el máximo del túnel, no lo que hace falta. Con 6 bar la
              velocidad de ensayo bajaría a 86,7 m/s y el Mach a 0,25; el
              ensayo valdría, pero la pregunta es la presión **necesaria**, y
              esa es la que deja el Mach justo en el límite.
          - valor: '3.33 bar'
            mensaje: |
              Parece que has puesto el Mach del lado equivocado. Con menos
              presión hace falta **más** velocidad para mantener el Reynolds,
              y el Mach subiría por encima de 0,3.
        pista: |
          $Ma = 0{,}3$ fija $v_m = 0{,}3\cdot 346$; con esa velocidad, Reynolds
          da la densidad.
        desarrollo: |
          $$
          v_m = 0{,}3\cdot 346 = 104\ \text{m/s} = 2\,v_p
          $$
          $$
          \rho_m v_m L_m = \rho_p v_p L_p
          \;\Longrightarrow\;
          \rho_m\cdot 2\cdot\frac{1}{10} = \rho_p
          \;\Longrightarrow\;
          \rho_m = 5\rho_p
          $$
          $$
          p_m = 5\ \text{bar} \le 6\ \text{bar}
          \qquad\text{sí es posible}
          $$

      - tipo: calcular
        titulo: La relación de sustentaciones
        pregunta: |
          En ese ensayo, ¿cuánto vale $F_{L,m}/F_{L,p}$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.05'
            mensaje: |
              Te has dejado la relación de velocidades. El modelo sopla al
              doble de velocidad que vuela el avión, y la fuerza va con
              $v^{2}$: eso multiplica por 4.
          - valor: '5'
            mensaje: |
              Has olvidado la escala geométrica, que entra al cuadrado y
              divide por 100. El modelo es pequeño: su sustentación es cinco
              veces **menor**, no cinco veces mayor.
        pista: |
          $F_L/(\rho L_c^{2}v^{2})$ igual en modelo y prototipo.
        desarrollo: |
          $$
          \frac{F_{L,m}}{F_{L,p}}
          = \frac{\rho_m}{\rho_p}
          \Bigl(\frac{L_m}{L_p}\Bigr)^{2}
          \Bigl(\frac{v_m}{v_p}\Bigr)^{2}
          = 5\cdot\frac{1}{100}\cdot 4 = 0{,}2
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los adimensionales son
              $F_L/(\rho L_c^{2}v^{2})$, $\mu/(\rho L_c v)$, $c/v$ y el propio
              ángulo de ataque.
          - texto: >-
              Con Mach igualado las velocidades coinciden, y Reynolds pide
              entonces diez veces la densidad, es decir 10 bar: imposible en
              un túnel que llega a 6.
          - texto: >-
              Renunciando a Mach y quedándose en el límite $0{,}3$, el ensayo
              se hace a 104 m/s y 5 bar, y la sustentación del modelo es la
              quinta parte de la del prototipo.
          - texto: >-
              El área del ala, $10{,}7\ \text{m}^{2}$, es la longitud
              característica que entra en los adimensionales.
            trampa: true
            mensaje: |
              La longitud característica es la **cuerda**, $L_c = 1{,}12$ m,
              que es la que el enunciado nombra en la lista de variables. El
              área de $10{,}7\ \text{m}^{2}$ no interviene en ningún
              adimensional de este problema: serviría para pasar de
              coeficiente de sustentación a fuerza en la formulación
              aeronáutica al uso, que no es la que se pide aquí.
    resolucion: |
      **a) Los adimensionales.** Siete variables —$F_L$, $L_c$, $v$, $\rho$,
      $\mu$, $c$ y $\alpha$— de las que una, el ángulo, ya es adimensional.
      Con $v$, $L_c$ y $\rho$ repetidas:

      $$
      \pi_1 = \frac{F_L}{\rho\,L_c^{2}\,v^{2}}
      \qquad
      \pi_2 = \frac{\mu}{\rho\,L_c\,v}
      \qquad
      \pi_3 = \frac{c}{v}
      \qquad
      \pi_4 = \alpha
      $$

      **b) y c) La semejanza absoluta.** Con la misma temperatura, $c$ y $\mu$
      son iguales en modelo y prototipo. El $\pi_3$ obliga entonces a
      $v_m = v_p$, y con eso el $\pi_2$ pide

      $$
      \rho_m L_m = \rho_p L_p
      \qquad\Longrightarrow\qquad
      \rho_m = 10\,\rho_p
      \qquad\Longrightarrow\qquad
      p_m = 10\ \text{bar}
      $$

      El túnel llega a 6. **No se puede.**

      **d) El ensayo que sí se puede hacer.** Renunciando a Mach —permitido
      por debajo de $0{,}3$— la única condición es Reynolds, y conviene
      apurar: cuanta más velocidad, menos presión hace falta. El tope es
      justamente $Ma = 0{,}3$:

      $$
      v_m = 0{,}3\cdot 346 = 104\ \text{m/s}
      \qquad
      \rho_m = 5\rho_p
      \qquad
      p_m = 5\ \text{bar}
      $$

      Y con el $\pi_1$:

      $$
      \frac{F_{L,m}}{F_{L,p}} = 5\cdot\frac{1}{100}\cdot 4 = 0{,}2
      $$

      **La decisión de ingeniería, que es lo que se está calificando.** No es
      «se puede o no se puede»: es **qué se sacrifica y cuánto**. Aquí se
      sacrifica Mach, se justifica con el criterio de los 0,3, y se apura la
      velocidad hasta el límite exacto del criterio para que la presión
      requerida quepa en el túnel. Un ensayo a 6 bar y 86,7 m/s también
      valdría; el de 5 bar es el que se ajusta a la hipótesis con el mínimo de
      presurización.

  # ── 8 (15 %) · Una boquilla con la bomba apagada y encendida, con dos
  #    formulaciones de pérdidas distintas en el mismo problema.
  - id: exflu2021-ord-8-la-boquilla-con-bomba-y-sin-ella
    titulo: La misma boquilla con la bomba apagada y encendida
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se bombea agua desde el depósito abierto A, cuya lámina superior está en
      cota 22, a la boquilla C situada en cota 5 m, siendo el diámetro de la
      boquilla de 40 mm. La longitud de la tubería es de 90 m, la tubería es
      de **acero comercial**, de diámetro 200 mm, y las pérdidas menores se
      pueden considerar un 10 % de las pérdidas de la tubería y están
      localizadas en la impulsión. Se pide:

      Mediante **Darcy-Weisbach**:

      **a)** Caudal (l/s) que sale a través de la boquilla C y altura $h$ (m)
      que alcanza el chorro si la bomba B está apagada.

      Mediante **Hazen-Williams**:

      **b)** Caudal bombeado (l/s) y altura del chorro $h$ (m) si la bomba B
      está encendida. La expresión analítica de la altura manométrica de la
      turbobomba es
      $H_{m,tb} = 11{,}23 - 3{,}63\cdot 10^{-3}\,Q^{2}$ (mca; l/s).

      **c)** Pérdida de carga a generar en la válvula colocada en la impulsión
      para que la altura del chorro sea $h = 20$ m.

      **d)** Si la cota del eje de la turbobomba es $z_B = 21$ m y la longitud
      en la aspiración es de 10 m, indicar si habrá problemas de cavitación.
      Datos: $p_{atm} = 1$ bar; $p_v/\gamma$ (abs) $= 0{,}2$ mca.
    pide: El caudal y la altura del chorro con la bomba apagada y encendida, la válvula y la cavitación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre el caudal de la boquilla y la altura $h$ que
          alcanza el chorro?
        opciones:
          - texto: >-
              La altura es exactamente la altura cinética de salida,
              $v_c^{2}/2g$, porque el chorro sube hasta agotar su velocidad
            correcta: true
            mensaje: |
              Eso es. Un chorro vertical que sale a $v_c$ y no encuentra
              resistencia sube hasta que su energía cinética se convierte
              entera en potencial. Por eso la pregunta «¿qué altura alcanza?»
              es la misma que «¿cuál es la altura cinética de salida?».
          - texto: >-
              La altura es la diferencia entre la cota del depósito y la de la
              boquilla, 17 m
            mensaje: |
              Serían 17 m si no hubiera pérdidas ni la boquilla estrechara
              nada. Con las pérdidas de la tubería el chorro se queda en
              16,75 m; poco menos, pero menos.
          - texto: >-
              La altura depende del diámetro de la boquilla pero no del caudal
            mensaje: |
              Depende de los dos, porque lo que la fija es la **velocidad**,
              que es el cociente de ambos.

      - tipo: calcular
        titulo: El caudal con la bomba apagada
        pregunta: |
          ¿Cuánto sale por la boquilla con la bomba parada, en l/s?
        respuesta:
          tipo: magnitud
          valor: '22.77 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '186.9 l/s'
            mensaje: |
              Has usado el diámetro de la tubería, 200 mm, como diámetro de
              salida. La boquilla es de 40 mm: veinticinco veces menos
              sección, y es ella la que estrangula el caudal.
          - valor: '26.1 l/s'
            mensaje: |
              Parece que has tomado los 22 m de cota del depósito como salto
              disponible. El chorro sale a la cota 5, así que el salto es
              $22-5 = 17$ m.
        pista: |
          $17 = v_c^{2}/2g + 1{,}1\,h_f$, con $h_f$ la pérdida de los 90 m de
          tubería de 200 mm.
        desarrollo: |
          Las pérdidas de la tubería son minúsculas —0,22 m— porque la
          velocidad ahí es de solo 0,72 m/s:

          $$
          17 \approx \frac{v_c^{2}}{2g} + 0{,}25
          \;\Longrightarrow\;
          v_c = 18{,}12\ \text{m/s}
          $$
          $$
          Q = 18{,}12\cdot 1{,}2566\cdot 10^{-3} = 22{,}77\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura del chorro con la bomba apagada
        pregunta: |
          ¿Hasta dónde sube el chorro, en metros?
        respuesta:
          tipo: numero
          valor: '16.75'
          tolerancia: 0.1
          formato: un número en metros
        distractores:
          - valor: '17'
            mensaje: |
              Esos son los 17 metros de salto **sin pérdidas**. La tubería y
              sus accesorios se quedan con 25 centímetros, y el chorro sube 25
              centímetros menos.
          - valor: '5'
            mensaje: |
              Esa es la cota de la boquilla, no la altura que alcanza el
              chorro por encima de ella.
        pista: |
          Es la altura cinética de salida.
        desarrollo: |
          $$
          h = \frac{v_c^{2}}{2g} = \frac{18{,}12^{2}}{19{,}6}
          = 16{,}75\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal con la bomba encendida
        pregunta: |
          Con la bomba en marcha, ¿cuánto sale por la boquilla, en l/s?
        respuesta:
          tipo: magnitud
          valor: '27.81 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '22.77 l/s'
            mensaje: |
              Ese es el de la bomba apagada. La bomba añade unos 8,4 metros a
              ese caudal, y el punto de funcionamiento se desplaza a la
              derecha.
          - valor: '29.3 l/s'
            mensaje: |
              Parece que has tomado la altura de la bomba como constante,
              $11{,}23$ m. La curva baja con el cuadrado del caudal, y a
              28 l/s ya ha perdido casi tres metros.
        pista: |
          Cortar $11{,}23-3{,}63\cdot 10^{-3}Q^{2}$ con la curva de la
          instalación, que ahora usa Hazen-Williams con $C_{HW} = 130$.
        desarrollo: |
          $$
          28{,}23 = 0{,}03231\,Q^{2} + 9{,}078\cdot 10^{-4}\,Q^{1{,}852}
          $$
          $$
          Q = 27{,}81\ \text{l/s}
          \qquad
          h = \frac{v_c^{2}}{2g} = 24{,}99\ \text{m}
          $$

      - tipo: calcular
        titulo: La válvula que baja el chorro a veinte metros
        pregunta: |
          ¿Cuánta pérdida hay que generar en la válvula para que el chorro se
          quede en 20 m, en metros?
        respuesta:
          tipo: magnitud
          valor: '5.63 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '4.99 m'
            mensaje: |
              Esa es la diferencia entre las dos alturas de chorro,
              $24{,}99-20$. No es lo mismo: al bajar el caudal, la
              instalación también pide menos y la bomba da más altura, y la
              válvula tiene que absorber las tres cosas.
          - valor: '2.25 m'
            mensaje: |
              Esa es la caída de la curva de la bomba entre los dos caudales.
              Es uno de los términos, no el resultado.
        pista: |
          $h = 20$ fija la velocidad de salida y con ella el caudal; a partir
          de ahí, lo que la bomba da de más es de la válvula.
        desarrollo: |
          $$
          \frac{v_c^{2}}{2g} = 20
          \;\Longrightarrow\;
          Q = 24{,}88\ \text{l/s}
          \qquad
          H_m = 8{,}98\ \text{m}
          $$
          $$
          22+8{,}98 = 5+20+0{,}35+h_v
          \;\Longrightarrow\;
          h_v = 5{,}63\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              El eje de la bomba está en la cota 21 y la lámina del depósito
              en la 22: la bomba está **por debajo** del agua.
          - texto: >-
              Eso significa que la aspiración trabaja en carga, con un metro a
              favor en vez de en contra.
          - texto: >-
              Con la atmósfera en 10,2 mca, la tensión de vapor en 0,2 y una
              pérdida de aspiración de apenas 4 cm, el $NPSH$ disponible ronda
              los 11 metros.
          - texto: >-
              Aun así podría cavitar, porque la boquilla de 40 mm crea una
              depresión que se transmite a la aspiración.
            trampa: true
            mensaje: |
              La boquilla está en la **impulsión**, aguas abajo de la bomba, y
              lo que hace ahí es crear contrapresión, no depresión en la
              aspiración. Aguas abajo de una bomba nada puede afectar a su
              $NPSH$ disponible más que a través del caudal. Con once metros
              de $NPSH$ disponible no hay riesgo.
    resolucion: |
      **a) Con la bomba apagada.** El depósito está a la cota 22 y la boquilla
      a la 5: hay 17 metros de salto. Casi todo se convierte en velocidad de
      salida, porque la tubería es ancha —200 mm para 23 l/s— y apenas pierde:

      $$
      17 = \frac{v_c^{2}}{2g} + 1{,}1\,h_f
      \qquad
      h_f = 0{,}22\ \text{m}
      $$
      $$
      v_c = 18{,}12\ \text{m/s}
      \qquad
      Q = 22{,}77\ \text{l/s}
      \qquad
      h = 16{,}75\ \text{m}
      $$

      **b) Con la bomba encendida.** Ahora la curva de la instalación —con
      Hazen-Williams, $C_{HW} = 130$ para el acero comercial de 200 mm— se
      corta con la de la bomba:

      $$
      Q = 27{,}81\ \text{l/s}
      \qquad
      h = 24{,}99\ \text{m}
      $$

      Ocho metros más de chorro por 22 % más de caudal: la altura va con el
      cuadrado.

      **c) La válvula.** Para $h = 20$ m hace falta $Q = 24{,}88$ l/s, y a ese
      caudal la bomba da $8{,}98$ m mientras la instalación solo pide
      $25{,}35$ de los $30{,}98$ disponibles. La diferencia la quema la
      válvula:

      $$
      h_v = 5{,}63\ \text{m}
      $$

      **d) La cavitación.** El eje de la bomba está en la cota 21 y el agua en
      la 22: la bomba trabaja **en carga**, con un metro a favor. Con la
      atmósfera en 10,2 mca, la tensión de vapor en 0,2 y cuatro centímetros
      de pérdida en los 10 m de aspiración, el $NPSH$ disponible ronda los
      **11 metros**. No hay riesgo.

      **Una nota sobre el enunciado, que es didáctica y no un descuido.** El
      apartado a) pide Darcy-Weisbach y el b) Hazen-Williams para la **misma**
      tubería. No es una incoherencia: es una forma de que compares las dos
      formulaciones sobre un caso idéntico y veas que dan lo mismo dentro de
      su margen. Con Darcy el tramo pierde 0,22 m; con Hazen-Williams, 0,24.
