        <desc id="ex2021o4-fig-d">Arriba, el perfil de la instalación, sin escala horizontal. El depósito A, con la lámina en la cota 215. La tubería sale de A y sube hasta el punto alto B, en la cota 224, por encima de la lámina de A. Desde B baja, pasa por la válvula de regulación C y llega a D, en la cota 166, donde sale al aire y cae en el depósito E. Una flecha de trazos baja de B a un círculo, el detalle B: un codo convergente. El fluido entra por la boca ancha, abajo a la izquierda, subiendo por una rama que forma el ángulo alfa con la horizontal; el codo gira y sale por la boca estrecha, a la derecha, bajando por una rama que forma el ángulo beta con la horizontal. Cada ángulo se marca por fuera del codo, entre una línea horizontal de trazos y la pared de su rama. El detalle está dibujado con alfa de 30 grados y beta de 60, los del enunciado, y entonces las dos ramas son perpendiculares.</desc>
