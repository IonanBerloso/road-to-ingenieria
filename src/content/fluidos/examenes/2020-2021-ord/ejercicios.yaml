      <svg viewBox="0 0 420 400" role="img" width="420" height="400" aria-labelledby="ex2021o5-fig-t ex2021o5-fig-d">
        <title id="ex2021o5-fig-t">El elevador de taller: el depósito A, la bomba de palanca, el manómetro B, la válvula de seguridad E y el cilindro de C a D</title>
        <desc id="ex2021o5-fig-d">Redibujo del esquema del cuadernillo, sin escala, con sus cotas. A la izquierda, el depósito A de aceite, cerrado y con un manómetro en la tapa; su nivel está en la cota 2. Del fondo sale una tubería horizontal, en la cota 0, que pasa por la bomba de mano, accionada con una palanca, entre dos válvulas antirretorno que solo dejan pasar el aceite del depósito hacia el cilindro. Aguas abajo de la bomba está el manómetro B. La tubería sigue, sube y entra por abajo en un cilindro vertical cuyo pistón parte de C, en la cota 20, y puede subir 10 m hasta D. Sobre el pistón, una plataforma y el coche. Por debajo de la bomba, un ramal une el lado de B con el del depósito a través de la válvula de seguridad E, también en la cota 0, que devuelve el aceite al depósito cuando B llega a 80 bar.</desc>
