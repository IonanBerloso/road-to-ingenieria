      </svg>
      <figcaption>Redibujo del esquema del cuadernillo, sin escala y con sus cotas.</figcaption>
      </figure>

      **Notas nuestras.** La figura, contada: el nivel del depósito A está en
      la cota 2; la tubería de la bomba y del manómetro B, y la válvula de
      seguridad E, en la cota 0; el pistón parte de C, en la cota 20, y puede
      subir 10 m hasta D. El cuadernillo dibuja además cómo funcionan las
      válvulas unidireccionales: dejan pasar el aceite en un sentido y en el
      otro cortan. Los «pesos» del coche y del operario van en kg: son masas,
      y el impreso las multiplica por $g = 9{,}8$ m/s². El impreso solo
      resuelve una de las dos ramas, la que corresponde a la respuesta del d).
      *«deposito» y «SI», sin tilde, están así en el impreso.*
    notas:
      - >-
        **NOTA**: Considerar la densidad del aceite constante.
    pide: La lectura de B abajo y arriba, con el operario y sin él, si el coche llega arriba, hasta dónde sube y si sirve de algo presurizar el depósito.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con el coche quieto sobre el pistón y las dos válvulas de la bomba
          cerradas, ¿qué equilibra la lectura del manómetro de B?
        opciones:
          - texto: >-
              El peso del coche repartido en el área del pistón, más la columna
              de aceite que hay entre B y la cara de abajo del pistón
            correcta: true
            mensaje: |
              Eso es. Con las válvulas cerradas el aceite entre B y el pistón
              está en reposo, y es hidrostática pura: bajo el pistón, el peso
              entre el área, con la atmósfera por encima; y bajando hasta B se
              suma $\gamma_{ac}\,(z_{\text{pistón}} - z_B)$. Esa columna crece a
              medida que el coche sube, y por eso la lectura de b) es mayor
              que la de a).
          - texto: >-
              Solo el peso del coche entre el área del pistón, porque en una
              tubería llena el aceite no pesa
            mensaje: |
              El aceite pesa igual dentro de una tubería. Entre B, en la cota
              0, y el pistón, en la 20, hay 20 m de aceite, 1,76 bar; y la
              diferencia entre los 75,38 y los 76,26 bar impresos es justo la
              columna que se añade al subir 10 m.
          - texto: >-
              La presión del depósito A más lo que añade la bomba en cada
              golpe de palanca
            mensaje: |
              Con el coche quieto, las dos válvulas unidireccionales están
              cerradas y B queda aislado del depósito y de la bomba. Lo que lee
              es lo que hace falta para sostener el coche, y el depósito no
              entra. Y como la válvula de seguridad salta a 80 bar en B, tenga
              A la presión que tenga, presurizarlo no cambia nada: es la
              pregunta del apartado h).

      - tipo: calcular
        titulo: La columna de aceite entre B y el pistón
        pregunta: |
          Con el pistón abajo, en C, ¿cuánto suma a la lectura de B la columna
          de aceite, en bar?
        respuesta:
          tipo: magnitud
          valor: '1.764 bar'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '1.588 bar'
            mensaje: |
              Has contado la columna desde el nivel del depósito, en la cota
              2: 18 m. El manómetro está en B, en la cota 0, y lo que tiene
              encima es el aceite hasta el pistón, 20 m. El depósito queda al
              otro lado de las válvulas cerradas.
          - valor: '1.96 bar'
            mensaje: |
              Esa es una columna de 20 m de **agua**. El aceite tiene
              $s = 0{,}9$, y su columna pesa un 10 % menos.
        pista: |
          $\gamma_{ac}\,(z_C - z_B)$, con $z_C = 20$ m y $z_B = 0$.
        desarrollo: |
          $$
          \gamma_{ac}\,(z_C - z_B) = 0{,}9\cdot 9800\cdot 20
          = 176\,400\ \text{Pa} = 1{,}764\ \text{bar}
          $$

      - tipo: calcular
        titulo: La lectura de B cuando empieza a subir
        pregunta: |
          ¿Qué marca el manómetro de B cuando se empieza a elevar el coche,
          en bar?
        respuesta:
          tipo: magnitud
          valor: '75.38 bar'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '73.62 bar'
            mensaje: |
              Es solo el peso del coche entre el área del pistón. Te falta la
              columna de aceite entre B y el pistón, 20 m: 1,76 bar más.
          - valor: '20.17 bar'
            mensaje: |
              Has tomado los 50 mm como radio. El dato es el diámetro del
              cilindro: el área es $\pi\cdot 0{,}05^{2}/4$, cuatro veces menor,
              y la presión del peso, cuatro veces mayor.
          - valor: '9.28 bar'
            mensaje: |
              Has dividido los 1475 kg entre el área sin multiplicar por $g$.
              El «peso» del enunciado está en kg, que es una masa: la fuerza
              son $1475\cdot 9{,}8 = 14\,455$ N.
        pista: |
          El peso del coche, $1475\cdot 9{,}8$ N, entre el área del pistón,
          $\pi\cdot 0{,}05^{2}/4$, más la columna del paso anterior.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 0{,}05^{2}}{4} = 1{,}9635\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          \frac{W}{A} = \frac{14\,455}{1{,}9635\cdot 10^{-3}}
          = 7{,}362\cdot 10^{6}\ \text{Pa} = 73{,}62\ \text{bar}
          $$
          $$
          p_B = 73{,}62 + 1{,}764 = 75{,}38\ \text{bar}
          $$

      - tipo: calcular
        titulo: La lectura de B con el coche arriba
        pregunta: |
          ¿Y cuando el coche ha llegado al punto más alto del cilindro, D, en
          bar?
        respuesta:
          tipo: magnitud
          valor: '76.26 bar'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '75.38 bar'
            mensaje: |
              Esa es la de abajo. El peso no cambia, pero el pistón ha subido
              10 m y la columna de aceite que hay encima de B también: 0,88
              bar más.
        pista: |
          Lo mismo que en a), con 30 m de columna en vez de 20.
        desarrollo: |
          $$
          p_B = 73{,}62 + 0{,}9\cdot 9800\cdot 30\cdot 10^{-5}
          = 73{,}62 + 2{,}646 = 76{,}26\ \text{bar}
          $$

      - tipo: calcular
        titulo: La lectura de B arriba, con el operario encima
        pregunta: |
          Con el operario montado en el coche, ¿qué marcaría B con el coche
          en D, en bar?
        respuesta:
          tipo: magnitud
          valor: '80.51 bar'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '79.63 bar'
            mensaje: |
              Esa es la lectura con el operario pero con el coche abajo, en C.
              Arriba se suman los 10 m de columna, 0,88 bar.
          - valor: '76.26 bar'
            mensaje: |
              Esa es la del coche solo. Los 85 kg del operario también cargan
              sobre el pistón: $85\cdot 9{,}8/A = 4{,}24$ bar más.
        pista: |
          Los 85 kg del operario suman $85\cdot 9{,}8/A$ a las dos lecturas.
        desarrollo: |
          $$
          \Delta p = \frac{85\cdot 9{,}8}{1{,}9635\cdot 10^{-3}}
          = 4{,}24\cdot 10^{5}\ \text{Pa} = 4{,}24\ \text{bar}
          $$
          $$
          p_{B,C} = 75{,}38 + 4{,}24 = 79{,}63\ \text{bar}
          \qquad
          p_{B,D} = 76{,}26 + 4{,}24 = 80{,}51\ \text{bar}
          $$

          Y 80,51 pasa de los 80 bar a los que abre la válvula de seguridad:
          esa es la respuesta del d), que es NO.

      - tipo: calcular
        titulo: La altura a la que se para el coche
        pregunta: |
          Con $g = 9{,}8$ m/s², el que usa el impreso, ¿cuántos metros por
          encima de C llega el coche con el operario montado?
        respuesta:
          tipo: magnitud
          valor: '4.25 m'
          tolerancia: 0.03
          formato: una altura, con su unidad
        distractores:
          - valor: '3.83 m'
            mensaje: |
              Has convertido los bares que sobran en columna de **agua**. Lo
              que sube es el aceite, de $s = 0{,}9$: con el mismo margen de
              presión, su columna es un 11 % más alta.
          - valor: '24.25 m'
            mensaje: |
              Esa es la altura del pistón sobre B, en la cota 0. La pregunta es
              cuánto sube el coche, y parte de C, en la cota 20.
          - valor: '52.35 m'
            mensaje: |
              Has hecho la cuenta sin el operario. Con el coche solo el margen
              hasta los 80 bar daría para 52 m de columna, más que los 10 de
              carrera: sin él, el coche sí llegaría arriba.
        pista: |
          La válvula no deja pasar de 80 bar en B. El margen entre 80 bar y la
          lectura de partida con el operario, 79,63 bar, es la columna de
          aceite que se puede añadir al subir.
        desarrollo: |
          $$
          h = \frac{(80 - 79{,}625)\cdot 10^{5}}{0{,}9\cdot 9800}
          = \frac{37\,490}{8820} = 4{,}25\ \text{m}
          $$

          **Y una advertencia sobre este número.** Sale de restar dos
          presiones casi iguales, 80 y 79,63 bar. Con $g = 9{,}81$ la lectura
          de partida sube a 79,71 bar y la altura baja a 3,3 m: un 0,1 % en la
          presión es casi un metro de coche. Por eso la pregunta fija el $g$
          del impreso.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el coche quieto, B marca el peso entre el área del pistón más
              la columna de aceite hasta él: 75,38 bar abajo y 76,26 bar
              arriba, porque la columna crece 10 m.
          - texto: >-
              Con el operario montado, las dos lecturas suben 4,24 bar, hasta
              79,63 y 80,51 bar.
          - texto: >-
              Como 80,51 bar pasa de los 80 de la válvula de seguridad, el
              coche no llega a D: se para a 4,25 m por encima de C, donde B
              alcanza los 80 bar.
          - texto: >-
              Presurizando el depósito A, la bomba recibe el aceite con más
              presión, y con eso el coche acabaría llegando arriba.
            trampa: true
            mensaje: |
              No serviría para nada, que es lo que dice el impreso. La válvula
              de seguridad limita la presión de B a 80 bar venga el aceite como
              venga, y lo que hace falta en B para sostener el coche arriba,
              80,51 bar, no depende del depósito: las válvulas
              unidireccionales lo aíslan. Presurizar A solo le ahorra trabajo a
              la bomba al aspirar.
    resolucion: |
      **La idea.** Con el coche quieto las dos válvulas de la bomba están
      cerradas, y el aceite entre B y el pistón es un problema de
      hidrostática: bajo el pistón hay la presión que sostiene el peso, y
      bajando hasta B se suma la columna de aceite. Esa columna es lo único
      que cambia al subir.

      **a) Al empezar a subir.** El pistón está en C, en la cota 20:

      $$
      p_B = \frac{1475\cdot 9{,}8}{\pi\cdot 0{,}05^{2}/4} + 0{,}9\cdot 9800\cdot 20
      = 73{,}62 + 1{,}764 = 75{,}38\ \text{bar}
      $$

      **b) Arriba.** Diez metros más de columna, 0,88 bar:

      $$
      p_B = 73{,}62 + 2{,}646 = 76{,}26\ \text{bar}
      $$

      **c) Con el operario encima.** Sus 85 kg suman
      $85\cdot 9{,}8/A = 4{,}24$ bar a las dos lecturas: **79,63 bar** abajo y
      **80,51 bar** arriba.

      **d) ¿Llega arriba?** No. La válvula de seguridad no deja que B pase de
      80 bar, y arriba harían falta 80,51. Así que e) y f), que solo se
      contestan si la respuesta es sí, no se hacen.

      **g) Hasta dónde sube.** Hasta que la columna añadida agota el margen
      entre la lectura de partida y los 80 bar:

      $$
      h = \frac{(80 - 79{,}625)\cdot 10^{5}}{0{,}9\cdot 9800} = 4{,}25\ \text{m}
      $$

      por encima de C. Es la diferencia de dos presiones casi iguales, y por
      eso es muy sensible a los datos: con $g = 9{,}81$ saldrían 3,3 m.

      **h) ¿Sirve presurizar el depósito?** No serviría para nada. Lo que hace
      falta en B para sostener el coche arriba no depende de A, porque las
      válvulas unidireccionales lo separan, y la válvula de seguridad corta en
      80 bar en B, tenga el depósito la presión que tenga. Para llegar habría
      que tarar la válvula por encima de 80,51 bar, o que el conjunto pesara
      menos: con el coche solo, 76,26 bar, sí llega.

      **Lo que enseña.** Una prensa hidráulica no es solo «fuerza entre
      área»: la columna del propio aceite cuenta, y aquí es justo la que
      decide. Los 0,88 bar de subir diez metros son lo que separa llegar de no
      llegar.

  # ── 6 (12,5 %) · Un túnel de viento presurizado donde la semejanza
  #    absoluta pide 10 bar y el túnel llega a 6.
  - id: exflu2021-ord-6-el-tunel-de-viento-presurizado
    titulo: El túnel que necesita diez bares y solo tiene seis
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Unos ingenieros aeronáuticos quieren predecir la sustentación $F_L$ que
      se produce en su nuevo diseño o prototipo de ala de un aeroplano. La
      longitud de cuerda del ala es $L_c = 1{,}12$ m y su área de ala A (área
      vista desde lo alto cuando el ala está a un ángulo de ataque
      $\alpha = 0^{\circ}$) es de $10{,}7\ \text{m}^{2}$. El prototipo debe de
      volar a una velocidad $v = 52$ m/s cerca del suelo, donde la temperatura
      $T = 25$ °C.

      Los ingenieros construyen un modelo del ala a un décimo de escala
      ($\lambda = 10$) para probarlo en un túnel aerodinámico que tiene la
      posibilidad de ser presurizado hasta un máximo de 6 bar (presión
      absoluta), manteniendo la temperatura en el túnel en el valor de 25 °C.
      Se pide:

      **a)** Obtener los parámetros adimensionales que definen la fuerza de
      sustentación $F_L$, sabiendo que la fuerza es función de la longitud
      $L_c$, de la velocidad $v$ del ala, de la densidad del aire $\rho$, de la
      viscosidad absoluta del aire $\mu$, de la velocidad del sonido en el
      aire $c$ y del ángulo de ataque $\alpha$. Tomar como variables repetidas:
      $v$, $L_c$ y $\rho$.

      **b)** Calcular si serán válidos los valores obtenidos en el ensayo del
      modelo, si se desea que se cumpla la semejanza dinámica absoluta, en el
      caso de realizar el ensayo en el túnel a la presión atmosférica.

      **c)** Calcular la presión absoluta (bar) del aire necesaria en el
      ensayo para lograr la semejanza dinámica absoluta y deducir si es
      posible conseguirla en nuestro túnel de viento.

      **d)** Para solucionar el problema surgido y poder realizar el ensayo, se
      acepta que los efectos de compresibilidad sean despreciables para
      números de Mach menores de 0,3, no siendo necesario igualar el número de
      Mach en estos casos. Calcular la presión absoluta (bar) a que se debe
      presurizar el túnel de viento para dar validez a los ensayos. Calcular,
      en este supuesto, la velocidad de ensayo (m/s) en el modelo y la
      relación entre las fuerzas de sustentación entre el prototipo y modelo.

      **Notas nuestras.** La figura del cuadernillo es de un manual y no se
      reproduce: dibuja el perfil del ala con la sustentación $F_L$ hacia
      arriba, la cuerda $L_c$, el ángulo de ataque $\alpha$ y el aire que
      llega con $\rho$, $\mu$, $c$ y $V$. En el d), la relación entre
      sustentaciones se da como modelo entre prototipo, $F_{Lm}/F_{Lp}$.
    notas:
      - |
        Notas a tener en cuenta en la resolución del ejercicio:

        - El ala prototipo vuela a través del aire a presión atmosférica de 1 bar.
        - El modelo, 10 veces más pequeño, es geométricamente similar al
          prototipo.
        - Considerar que la velocidad del sonido en el aire es de 346 m/s y es
          constante, ya que la temperatura tanto en el prototipo como en el
          modelo es de 25°C en todos los casos.
        - La velocidad del sonido y la viscosidad absoluta del aire son
          variables físicas muy poco dependientes de la presión y muy
          dependientes de la temperatura.
    pide: Los adimensionales, la presión que exige la semejanza absoluta y la del ensayo aceptable.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con la misma temperatura en modelo y prototipo, ¿qué impone la
          igualdad del número de Mach?
        opciones:
          - texto: >-
              Que las velocidades sean iguales, porque la velocidad del sonido
              solo depende de la temperatura
            correcta: true
            mensaje: |
              Eso es. $c$ es la misma —346 m/s— así que igualar $v/c$ es
              igualar $v$. El modelo tiene que soplar a los mismos 52 m/s que
              vuela el avión, y ahí se agota la libertad para ajustar
              Reynolds.
          - texto: >-
              Que la velocidad del modelo sea diez veces mayor
            mensaje: |
              Diez veces mayor es lo que pediría **Reynolds** si la densidad
              no cambiara. Mach pide velocidades iguales, y de la
              contradicción entre las dos sale todo el ejercicio.
          - texto: >-
              Que la presión del túnel sea la atmosférica
            mensaje: |
              La presión no aparece en el número de Mach. Aparece en el de
              Reynolds a través de la densidad, y ahí es donde se resuelve el
              conflicto.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel, entero: los parámetros adimensionales de la
          sustentación con las repetidas que impone el enunciado, $v$, $L_c$ y
          $\rho$. Son siete variables, y una de ellas, el ángulo de ataque, ya
          es adimensional: no la pierdas por el camino.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si tu folio llega a los cuatro grupos y enseña de dónde sale cada
          uno, el apartado está. Los grupos están impresos en los resultados;
          lo que se corrige es el camino hasta ellos.

      - tipo: calcular
        titulo: La presión que exige la semejanza absoluta
        pregunta: |
          ¿A qué presión absoluta habría que presurizar el túnel para lograr
          la semejanza dinámica absoluta, en bar?
        respuesta:
          tipo: magnitud
          valor: '10 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1 bar'
            mensaje: |
              Esa es la atmosférica, y es justo la que el apartado b) descarta:
              con ella el Reynolds del modelo sería diez veces menor que el
              del prototipo.
          - valor: '100 bar'
            mensaje: |
              Has elevado la escala al cuadrado. En el Reynolds la longitud
              entra a la primera potencia, así que la densidad tiene que
              multiplicarse por 10, no por 100.
        pista: |
          Mach iguala las velocidades; entonces Reynolds pide
          $\rho_m L_m = \rho_p L_p$. Y a temperatura constante,
          $\rho \propto p$.
        desarrollo: |
          $$
          v_m = v_p
          \qquad
          \rho_m\,\frac{L_p}{10} = \rho_p L_p
          \;\Longrightarrow\;
          \rho_m = 10\,\rho_p
          $$
          $$
          p_m = 10\ \text{bar} > 6\ \text{bar}
          $$

          **No es posible** en este túnel.

      - tipo: redactar
        que: deduccion
        consigna: |
          Los apartados b) y c) en papel: si el ensayo a presión atmosférica
          cumple la semejanza dinámica absoluta, qué presión haría falta para
          cumplirla y si el túnel llega. «Deducir», dice el c): la respuesta
          impresa es que no se puede, y lo que puntúa es por qué, con los
          números del apartado a).

          Ojo con la notación: el enunciado llama $\lambda = 10$ a $L_p/L_m$,
          y la rúbrica usa $\lambda = L_m/L_p = 1/10$. Con la del enunciado,
          Mach y Reynolds piden $\rho_m/\rho_p = \lambda = 10$.
        rubrica: semejanza-absoluta
        veredicto: |
          Si tu folio dice qué número manda cada condición y llega a los
          10 bar con la escala bien puesta, tienes b) y c). Si te sale que el
          modelo necesita una densidad diez veces **menor** que la del
          prototipo, has cruzado las dos $\lambda$: vuelve a la línea de
          arriba.

      - tipo: calcular
        titulo: La presión del ensayo aceptable
        pregunta: |
          Renunciando a Mach pero sin pasar de $Ma = 0{,}3$, ¿a qué presión
          hay que presurizar el túnel, en bar?
        respuesta:
          tipo: magnitud
          valor: '5 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '6 bar'
            mensaje: |
              Es el máximo del túnel, no lo que hace falta. Con 6 bar la
              velocidad de ensayo bajaría a 86,7 m/s y el Mach a 0,25; el
              ensayo valdría, pero la pregunta es la presión **necesaria**, y
              esa es la que deja el Mach justo en el límite.
          - valor: '0.5 bar'
            mensaje: |
              Te has dejado la escala: has igualado $\rho v$ en vez de
              $\rho v L$. El modelo es diez veces más pequeño, y el Reynolds
              solo se conserva si la densidad compensa también eso: diez veces
              más de lo que te sale.
        pista: |
          $Ma = 0{,}3$ fija $v_m = 0{,}3\cdot 346$; con esa velocidad, Reynolds
          da la densidad.
        desarrollo: |
          $$
          v_m = 0{,}3\cdot 346 = 104\ \text{m/s} = 2\,v_p
          $$
          $$
          \rho_m v_m L_m = \rho_p v_p L_p
          \;\Longrightarrow\;
          \rho_m\cdot 2\cdot\frac{1}{10} = \rho_p
          \;\Longrightarrow\;
          \rho_m = 5\rho_p
          $$
          $$
          p_m = 5\ \text{bar} \le 6\ \text{bar}
          \qquad\text{sí es posible}
          $$

      - tipo: calcular
        titulo: La relación de sustentaciones
        pregunta: |
          En ese ensayo, ¿cuánto vale $F_{L,m}/F_{L,p}$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.05'
            mensaje: |
              Te has dejado la relación de velocidades. El modelo sopla al
              doble de velocidad que vuela el avión, y la fuerza va con
              $v^{2}$: eso multiplica por 4.
          - valor: '5'
            mensaje: |
              Esa es la inversa, $F_{L,p}/F_{L,m}$: la del prototipo entre la
              del modelo. El enunciado dice «entre el prototipo y modelo», pero
              el impreso da $F_{Lm}/F_{Lp} = 0{,}2$, y es lo que se pregunta
              aquí: la sustentación del modelo es cinco veces **menor**.
          - valor: '20'
            mensaje: |
              Has olvidado la escala geométrica, que entra al cuadrado y
              divide por 100: $5\cdot 4 = 20$ sería la relación si el modelo
              fuera del mismo tamaño que el ala.
        pista: |
          $F_L/(\rho L_c^{2}v^{2})$ igual en modelo y prototipo.
        desarrollo: |
          $$
          \frac{F_{L,m}}{F_{L,p}}
          = \frac{\rho_m}{\rho_p}
          \Bigl(\frac{L_m}{L_p}\Bigr)^{2}
          \Bigl(\frac{v_m}{v_p}\Bigr)^{2}
          = 5\cdot\frac{1}{100}\cdot 4 = 0{,}2
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los adimensionales son
              $F_L/(\rho L_c^{2}v^{2})$, $\mu/(\rho L_c v)$, $c/v$ y el propio
              ángulo de ataque.
          - texto: >-
              Con Mach igualado las velocidades coinciden, y Reynolds pide
              entonces diez veces la densidad, es decir 10 bar: imposible en
              un túnel que llega a 6.
          - texto: >-
              Renunciando a Mach y quedándose en el límite $0{,}3$, el ensayo
              se hace a 104 m/s y 5 bar, y la sustentación del modelo es la
              quinta parte de la del prototipo.
          - texto: >-
              El área del ala, $10{,}7\ \text{m}^{2}$, es la longitud
              característica que entra en los adimensionales.
            trampa: true
            mensaje: |
              La longitud característica es la **cuerda**, $L_c = 1{,}12$ m,
              que es la que el enunciado nombra en la lista de variables. El
              área de $10{,}7\ \text{m}^{2}$ no interviene en ningún
              adimensional de este problema: serviría para pasar de
              coeficiente de sustentación a fuerza en la formulación
              aeronáutica al uso, que no es la que se pide aquí.
    resolucion: |
      **a) Los adimensionales.** Siete variables —$F_L$, $L_c$, $v$, $\rho$,
      $\mu$, $c$ y $\alpha$— de las que una, el ángulo, ya es adimensional.
      Con $v$, $L_c$ y $\rho$ repetidas:

      $$
      \pi_1 = \frac{F_L}{\rho\,L_c^{2}\,v^{2}}
      \qquad
      \pi_2 = \frac{\mu}{\rho\,L_c\,v}
      \qquad
      \pi_3 = \frac{c}{v}
      \qquad
      \pi_4 = \alpha
      $$

      **b) y c) La semejanza absoluta.** Con la misma temperatura, $c$ y $\mu$
      son iguales en modelo y prototipo. El $\pi_3$ obliga entonces a
      $v_m = v_p$, y con eso el $\pi_2$ pide

      $$
      \rho_m L_m = \rho_p L_p
      \qquad\Longrightarrow\qquad
      \rho_m = 10\,\rho_p
      \qquad\Longrightarrow\qquad
      p_m = 10\ \text{bar}
      $$

      El túnel llega a 6. **No se puede.**

      **d) El ensayo que sí se puede hacer.** Renunciando a Mach —permitido
      por debajo de $0{,}3$— la única condición es Reynolds, y conviene
      apurar: cuanta más velocidad, menos presión hace falta. El tope es
      justamente $Ma = 0{,}3$:

      $$
      v_m = 0{,}3\cdot 346 = 104\ \text{m/s}
      \qquad
      \rho_m = 5\rho_p
      \qquad
      p_m = 5\ \text{bar}
      $$

      Y con el $\pi_1$:

      $$
      \frac{F_{L,m}}{F_{L,p}} = 5\cdot\frac{1}{100}\cdot 4 = 0{,}2
      $$

      **La decisión de ingeniería, que es lo que se está calificando.** No es
      «se puede o no se puede»: es **qué se sacrifica y cuánto**. Aquí se
      sacrifica Mach, se justifica con el criterio de los 0,3, y se apura la
      velocidad hasta el límite exacto del criterio para que la presión
      requerida quepa en el túnel. Un ensayo a 6 bar y 86,7 m/s también
      valdría; el de 5 bar es el que se ajusta a la hipótesis con el mínimo de
      presurización.

  # ── 8 (15 %) · Una boquilla con la bomba apagada y encendida, con dos
  #    formulaciones de pérdidas distintas en el mismo problema.
  - id: exflu2021-ord-8-la-boquilla-con-bomba-y-sin-ella
    titulo: La misma boquilla con la bomba apagada y encendida
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de la figura se bombea agua desde el depósito abierto
      A, cuya lámina superior está en cota 22, a la boquilla C, situada en
      cota 5 m, siendo el diámetro de la boquilla de 40 mm. La longitud de la
      tubería es de 90 m, la tubería es de acero comercial, de diámetro 200 mm
      y las pérdidas menores se pueden considerar un 10% de las pérdidas de la
      tubería y están localizadas en la impulsión. Se pide:

      Mediante **Darcy-Weisbach**:

      **a)** Caudal (l/s) que sale a través de la boquilla C y altura $h$ (m)
      que alcanza el chorro si la bomba B está apagada.

      Mediante **Hazen-Williams**:

      **b)** Caudal bombeado (l/s) y altura del chorro $h$ (m) si la bomba B
      está encendida. La expresión analítica de la altura manométrica de la
      turbobomba es la siguiente:

      $H_{m\,tb} = 11{,}23 - 3{,}63\cdot 10^{-3}\cdot Q^{2}$ (mca; l/s).

      **c)** Pérdida de carga a generar en la válvula colocada en la impulsión
      para que la altura del chorro sea $h = 20$ m.

      **d)** Si la cota del eje de la turbobomba es $z_B = 21$ m y la longitud
      en la aspiración es $L_{\text{aspiración}} = 10$ m, indicar si habrá
      problemas de cavitación. **Datos**: $P_{atm} = 1$ bar;
      $P_v/\gamma$ (abs) $= 0{,}2$ mca.

      **Notas nuestras.** La figura del cuadernillo, contada: el depósito A,
      con la lámina en la cota 22; la tubería baja hasta la bomba B, sigue
      bajando y sube por fin hasta la boquilla C, en la cota 5, que lanza el
      chorro vertical hacia arriba hasta una altura $h$. Debajo trae la curva
      del $NPSH$ requerido de la bomba, en mca frente al caudal en m³/h: es
      de un catálogo y no se reproduce, pero se puede leer. Empieza en unos
      2,1 mca a 55 m³/h, baja a 2,0 hacia los 60 y sube después: unos 2,5 a
      80 m³/h, 3,0 a 90, 3,5 a 100 y 5,0 a 120 (lecturas nuestras sobre la
      imagen, con su rejilla).
    notas:
      - >-
        **Nota importante**: en los apartados b) y c) representar
        gráficamente de manera cualitativa la resolución analítica.
    pide: El caudal y la altura del chorro con la bomba apagada y encendida, la válvula y la cavitación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre el caudal de la boquilla y la altura $h$ que
          alcanza el chorro?
        opciones:
          - texto: >-
              La altura es exactamente la altura cinética de salida,
              $v_c^{2}/2g$, porque el chorro sube hasta agotar su velocidad
            correcta: true
            mensaje: |
              Eso es. Un chorro vertical que sale a $v_c$ y no encuentra
              resistencia sube hasta que su energía cinética se convierte
              entera en potencial. Por eso la pregunta «¿qué altura alcanza?»
              es la misma que «¿cuál es la altura cinética de salida?».
          - texto: >-
              La altura es la diferencia entre la cota del depósito y la de la
              boquilla, 17 m
            mensaje: |
              Serían 17 m si no hubiera pérdidas ni la boquilla estrechara
              nada. Con las pérdidas de la tubería el chorro se queda en
              16,75 m; poco menos, pero menos.
          - texto: >-
              La altura depende del diámetro de la boquilla pero no del caudal
            mensaje: |
              Depende de los dos, porque lo que la fija es la **velocidad**,
              que es el cociente de ambos.

      - tipo: calcular
        titulo: El caudal con la bomba apagada
        pregunta: |
          ¿Cuánto sale por la boquilla con la bomba parada, en l/s?
        respuesta:
          tipo: magnitud
          valor: '22.77 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '194.5 l/s'
            mensaje: |
              Has usado el diámetro de la tubería, 200 mm, como diámetro de
              salida. La boquilla es de 40 mm: veinticinco veces menos
              sección, y es ella la que estrangula el caudal.
          - valor: '25.9 l/s'
            mensaje: |
              Has tomado los 22 m de cota del depósito como salto disponible. El chorro sale a la cota 5, así que el salto es
              $22-5 = 17$ m.
        pista: |
          $17 = v_c^{2}/2g + 1{,}1\,h_f$, con $h_f$ la pérdida de los 90 m de
          tubería de 200 mm.
        desarrollo: |
          Las pérdidas de la tubería son minúsculas —0,22 m— porque la
          velocidad ahí es de solo 0,72 m/s:

          $$
          17 \approx \frac{v_c^{2}}{2g} + 0{,}25
          \;\Longrightarrow\;
          v_c = 18{,}12\ \text{m/s}
          $$
          $$
          Q = 18{,}12\cdot 1{,}2566\cdot 10^{-3} = 22{,}77\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura del chorro con la bomba apagada
        pregunta: |
          ¿Hasta dónde sube el chorro, en metros?
        respuesta:
          tipo: numero
          valor: '16.75'
          tolerancia: 0.1
          formato: un número en metros
        distractores:
          - valor: '17'
            mensaje: |
              Esos son los 17 metros de salto **sin pérdidas**. La tubería y
              sus accesorios se quedan con 25 centímetros, y el chorro sube 25
              centímetros menos.
          - valor: '5'
            mensaje: |
              Esa es la cota de la boquilla, no la altura que alcanza el
              chorro por encima de ella.
        pista: |
          Es la altura cinética de salida.
        desarrollo: |
          $$
          h = \frac{v_c^{2}}{2g} = \frac{18{,}12^{2}}{19{,}6}
          = 16{,}75\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal con la bomba encendida
        pregunta: |
          Con la bomba en marcha, ¿cuánto sale por la boquilla, en l/s?
        respuesta:
          tipo: magnitud
          valor: '27.81 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '22.77 l/s'
            mensaje: |
              Ese es el de la bomba apagada. Con la bomba en marcha la
              instalación recibe además su altura, 8,4 m en el punto de
              funcionamiento, y el caudal sube.
          - valor: '29.3 l/s'
            mensaje: |
              Parece que has tomado la altura de la bomba como constante,
              $11{,}23$ m. La curva baja con el cuadrado del caudal, y a
              28 l/s ya ha perdido casi tres metros.
        pista: |
          Cortar $11{,}23-3{,}63\cdot 10^{-3}Q^{2}$ con la curva de la
          instalación, que ahora usa Hazen-Williams con $C_{HW} = 130$.
        desarrollo: |
          $$
          28{,}23 = 0{,}03594\,Q^{2} + 9{,}078\cdot 10^{-4}\,Q^{1{,}852}
          $$
          $$
          Q = 27{,}81\ \text{l/s}
          \qquad
          h = \frac{v_c^{2}}{2g} = 24{,}99\ \text{m}
          $$

          El $Q^{2}$ junta la altura cinética del chorro, $0{,}03231\,Q^{2}$,
          con la caída de la bomba, $3{,}63\cdot 10^{-3}\,Q^{2}$, que pasa al
          otro lado.

      - tipo: dibujar
        consigna: |
          Lo que pide la «Nota importante» para el apartado b): la resolución
          analítica dibujada, de forma cualitativa, en unos ejes caudal-altura.
          La curva de la bomba, la de la instalación y el punto donde se
          cortan, con sus dos valores. Hazlo después de la cuenta y compara:
          la figura tiene que decir lo mismo que los números.
        comprueba:
          - punto: >-
              La curva de la instalación arranca por **debajo** del eje, en
              $-17$ m, porque la lámina del depósito está 17 m por encima de
              la boquilla.
            porque: >-
              Es lo que hace distinta a esta instalación: el agua ya sale sin
              bomba. La altura que tiene que dar la bomba es
              $H = (5 - 22) + v_c^{2}/2g + 1{,}1\,h_f$, negativa a caudal
              pequeño. Dibujarla saliendo del origen, o de 17 m hacia arriba,
              es poner el depósito por debajo de la boquilla.
          - punto: >-
              La curva de la instalación sube sobre todo por la altura cinética
              del chorro, con $Q^{2}$, y la de la bomba baja desde 11,23 m.
            porque: >-
              Con 200 mm de tubería la pérdida por rozamiento es de pocos
              decímetros; lo que pesa es la velocidad en la boquilla de 40 mm.
              Por eso la curva de la instalación es casi una parábola.
          - punto: >-
              Donde la instalación corta al eje de caudales, unos 22,7 l/s
              —casi los 22,77 del a), que usaba Darcy—, está el caudal con la
              bomba parada.
            porque: >-
              Con $H = 0$ la bomba no aporta nada: es el apartado a) leído en
              la misma figura. Lo que da la bomba es el paso de ese punto al de
              funcionamiento.
          - punto: >-
              El punto de funcionamiento, (27,81 l/s; 8,42 m), con líneas a los
              dos ejes.
            porque: >-
              Es el resultado del b) puesto en la figura. La altura del chorro,
              24,99 m, no es la altura de la bomba: es la cinética de salida a
              ese caudal.
        figura: |
          <svg viewBox="0 0 420 330" role="img" width="420" height="330" aria-labelledby="ex2021o8-b-t ex2021o8-b-d">
