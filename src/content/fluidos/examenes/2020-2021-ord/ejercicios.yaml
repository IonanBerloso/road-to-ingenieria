ejercicios:
  # ── 1 (15 %) · Una presa con dos leyes según el agua tape o no el
  #    paramento inclinado, y la subpresión del terreno permeable.
  - id: exflu2021-ord-1-la-presa-con-dos-leyes
    titulo: La presa con dos leyes, y el terreno que empuja desde abajo
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra una presa que separa dos masas de agua. A la
      **izquierda** se tiene agua dulce **($s = 1$)**, siendo su profundidad
      **$H$**. A la **derecha** se tiene agua de mar **($s = 1{,}05$)**,
      siendo en este caso la profundidad **$h$**. Los valores de la
      profundidad **$H$** pueden oscilar entre 3 y 12 metros, mientras que los
      de **$h$** entre 1 y 3 metros. La presa tiene una longitud normal a la
      figura de $b = 25$ m, indicándose el resto de sus dimensiones en la
      figura.

      **a)** Calcular la **resultante (modulo, dirección y sentido)** de la
      fuerza hidrostática que ejerce el agua dulce sobre la presa **en función
      de la profundidad $H$** y para el **rango completo** de valores de dicha
      variable (3-12 m).

      **b)** Calcular la **resultante (modulo, dirección y sentido)** de la
      fuerza hidrostática que ejerce el agua salada sobre la presa **en
      función de la profundidad $h$** y para el **rango completo** de valores
      de dicha variable (1-3 m).

      Se considera a continuación que el material que sirve de base a los
      fluidos y a la presa no es impermeable de forma que los fluidos se
      infiltrarán en el material y ejercerán presión a la presa en su base. El
      valor de esta presión en el punto A bajo la base será igual al
      inmediatamente adyacente en el fluido, y otro tanto ocurrirá en el punto
      B. Entre los dos puntos la presión variará linealmente.

      **c)** Calcular la **resultante (modulo, dirección y sentido)** de la
      fuerza hidrostática que ejercen los fluidos infiltrados en el material de
      la base sobre la presa teniendo en cuenta los máximos valores de
      profundidad para $H$ y $h$.

      **Dibujar en todos los casos previamente los prismas de presiones
      acotados.**

      **Notas nuestras.** La figura del cuadernillo, contada: el paramento de
      aguas arriba sube inclinado desde A, el pie de aguas arriba, hasta la
      cota 8,5 m con 6 m de retranqueo horizontal, y de ahí sigue vertical
      hasta la coronación. La coronación tiene 6 m de ancho y está a 16 m del
      terreno: el impreso acota 13 m hasta donde acaba el paramento de aguas
      abajo y 3 m más hasta arriba. El paramento de aguas abajo baja inclinado
      desde esos 13 m hasta B, con 6 m de retranqueo. La base AB mide 18 m, en
      tres tramos de 6. *«modulo», sin tilde, está así en el impreso.*
    pide: Las dos resultantes hidrostáticas en función del calado, y la subpresión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el apartado a) tiene **dos** expresiones distintas según el
          valor de $H$?
        opciones:
          - texto: >-
              Porque por encima de 8,5 m el paramento deja de ser inclinado y
              pasa a ser vertical, y el volumen de agua que descansa sobre él
              deja de crecer igual
            correcta: true
            mensaje: |
              Eso es. La componente **horizontal** sigue siendo
              $\tfrac12\gamma H^{2}b$ pase lo que pase, porque solo depende de
              la proyección vertical. La que cambia de ley es la **vertical**:
              hasta 8,5 m el agua se apoya sobre un triángulo, y por encima
              se le añade un rectángulo de 6 m de ancho.
          - texto: >-
              Porque a partir de 8,5 m el agua desborda la presa
            mensaje: |
              La coronación está a 16 m —13 hasta donde acaba el paramento
              de aguas abajo y 3 más—, así que con $H$ hasta 12 no desborda.
              Los 8,5 son la cota donde el paramento cambia de forma, no donde
              se acaba la presa.
          - texto: >-
              Porque por encima de 8,5 m hay que usar la densidad del agua
              salada
            mensaje: |
              El agua salada está al otro lado, y es el apartado b). El agua
              dulce es dulce a cualquier profundidad.

      - tipo: calcular
        titulo: El ángulo de la resultante con poca agua
        pregunta: |
          Con $H \le 8{,}5$ m, ¿qué ángulo forma la resultante con la
          horizontal, en grados?
        respuesta:
          tipo: numero
          valor: '35.21'
          tolerancia: 0.1
          formato: un número en grados
        distractores:
          - valor: '54.78'
            mensaje: |
              Ese es el ángulo del **paramento** con la horizontal,
              $\operatorname{arctg}(8{,}5/6)$. La resultante es perpendicular
              a él, así que forma con la horizontal el complementario, y su
              tangente es $F_V/F_H = 6/8{,}5$.
          - valor: '24.78'
            mensaje: |
              Esa es la pendiente del paramento de **aguas abajo**, $6/13$,
              que es la del agua salada del apartado b). El agua dulce está a
              la izquierda, sobre el paramento que sube 8,5 m con 6 de
              retranqueo: $\operatorname{tg}\alpha = 6/8{,}5$.
        pista: |
          Con el agua sin pasar de 8,5 m, la relación $F_V/F_H$ no depende de
          $H$: es la pendiente del paramento.
        desarrollo: |
          $$
          F_H = \tfrac12\gamma H^{2}b
          \qquad
          F_V = \tfrac12\gamma H^{2}b\,\frac{6}{8{,}5}
          $$
          $$
          \alpha = \arctan\frac{6}{8{,}5} = 35{,}22^{\circ}
          $$

          Mientras el agua no pase de 8,5 m, **el ángulo es constante** y solo
          crece el módulo, con el cuadrado del calado. El impreso da 35,21°:
          trunca en vez de redondear.

      - tipo: calcular
        titulo: La resultante con la presa llena
        pregunta: |
          Con $H = 12$ m, ¿cuánto vale el módulo de la resultante del agua
          dulce, en MN?
        respuesta:
          tipo: magnitud
          valor: '21 MN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '17.64 MN'
            mensaje: |
              Esa es solo la componente horizontal,
              $\tfrac12\gamma H^{2}b$. Falta la vertical, que con 12 m de
              agua vale 11,4 MN.
          - valor: '11.4 MN'
            mensaje: |
              Esa es solo la componente vertical, el peso del agua que
              descansa sobre el paramento inclinado más el rectángulo que
              queda encima.
        pista: |
          Por encima de 8,5 m, $F_V = 6\gamma b (H-4{,}25)$.
        desarrollo: |
          $$
          F_R = \gamma_1 b\sqrt{\frac{H^{4}}{4}+36\,(H-4{,}25)^{2}}
          = 245000\sqrt{5184+2162{,}25} = 21{,}0\ \text{MN}
          $$
          $$
          \alpha = \arctan\frac{12\,(H-4{,}25)}{H^{2}} = 32{,}86^{\circ}
          $$

      - tipo: calcular
        titulo: La subpresión del terreno
        pregunta: |
          Con $H = 12$ y $h = 3$, ¿cuánto vale la resultante de la subpresión,
          en MN?
        respuesta:
          tipo: magnitud
          valor: '33.41 MN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '52.92 MN'
            mensaje: |
              Has tomado la presión de A en toda la base. Varía
              **linealmente** de A a B, así que lo que cuenta es la media de
              las dos, que es el área del trapecio.
          - valor: '13.89 MN'
            mensaje: |
              Has tomado la presión de B, la del agua de mar, en toda la base.
              Varía **linealmente** de A a B, así que lo que cuenta es la media
              de las dos.
        pista: |
          Prisma trapecial: presión media por área de la base, con
          $18\times 25$ m.
        desarrollo: |
          $$
          F_{v3} = \Bigl(\frac{\gamma_1 H}{2}+\frac{\gamma_2 h}{2}\Bigr)
          \cdot 18\cdot b
          = (58800+15435)\cdot 450 = 33{,}41\ \text{MN}\ (\uparrow)
          $$

      - tipo: dibujar
        consigna: |
          Lo que el enunciado pide hacer antes de ninguna cuenta: el prisma de
          presiones acotado de cada cara mojada, con los calados máximos,
          $H = 12$ m y $h = 3$ m, que son los del apartado c). Son cuatro: el
          tramo vertical y el tramo inclinado del paramento de aguas arriba,
          el paramento de aguas abajo y la base. Si has hecho las cuentas sin
          dibujarlos, dibújalos ahora y compáralos: es lo primero que mira
          quien corrige.
        comprueba:
          - punto: >-
              En el paramento de aguas arriba, dos prismas y no uno: un
              triángulo en el tramo vertical, de cero en la lámina a
              $\gamma(H-8{,}5) = 34{,}3$ kPa en el quiebro, y un trapecio en el
              tramo inclinado, de 34,3 kPa en el quiebro a
              $\gamma H = 117{,}6$ kPa en A.
            porque: >-
              La presión solo depende de la profundidad, así que en el quiebro
              no salta: lo que cambia es la dirección de la cara. Por eso el
              apartado a) tiene dos leyes. Con $H \le 8{,}5$ m el tramo vertical
              queda seco y el prisma del inclinado es un triángulo con el
              vértice en la lámina, de la misma forma a cualquier calado: por
              eso el ángulo de la resultante no cambia.
          - punto: >-
              Las flechas del tramo inclinado perpendiculares a él y empujando
              hacia la presa, y el prisma sin pasar de la lámina libre ni
              meterse bajo el terreno.
            porque: >-
              Una presión es normal a la cara. En una cara inclinada la normal
              apunta hacia arriba y hacia el agua, y un prisma con la escala
              mal elegida acaba por encima de la lámina: dibuja agua donde no
              la hay.
          - punto: >-
              En el paramento de aguas abajo, un triángulo perpendicular a él,
              de cero en la lámina del agua de mar a
              $\gamma_2 h = 30{,}87$ kPa en B, empujando hacia la presa: hacia
              la izquierda y hacia abajo.
            porque: >-
              Es el apartado b), con una sola ley: con $h \le 3$ m el agua de
              mar no pasa nunca del tramo inclinado, que llega hasta los 13 m.
              La resultante es perpendicular al paramento, y por eso su ángulo
              es el de su pendiente, $\operatorname{arctg}(6/13) = 24{,}78^{\circ}$.
          - punto: >-
              Bajo la base, la subpresión: un trapecio de 117,6 kPa en A a
              30,87 kPa en B sobre los 18 m, con las flechas hacia arriba.
            porque: >-
              Es lo que dice el enunciado: en A la presión del agua dulce
              adyacente, en B la del agua de mar, y lineal entre las dos.
              Dibujarlo es ver que es un trapecio y no un rectángulo: con la
              presión de A en toda la base salen 52,9 MN en vez de 33,4.
          - punto: >-
              Cada prisma acotado con sus presiones en los extremos, y la
              resultante de la subpresión, 33,4 MN hacia arriba, a 7,25 m de A.
            porque: >-
              «Acotados» es parte de lo que se pide. El punto de aplicación sale
              del trapecio, $x = L\,(p_A + 2p_B)/[3\,(p_A + p_B)]$ medido desde
              A, y el c) pide la resultante con su dirección y su sentido.
        figura: |
          <svg viewBox="0 0 470 360" role="img" width="470" height="360" aria-labelledby="ex2021o1-prismas-t ex2021o1-prismas-d">
