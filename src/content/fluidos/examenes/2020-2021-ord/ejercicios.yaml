      - tipo: calcular
        titulo: La válvula que baja el chorro a veinte metros
        pregunta: |
          ¿Cuánta pérdida hay que generar en la válvula para que el chorro se
          quede en 20 m, en metros?
        respuesta:
          tipo: magnitud
          valor: '5.63 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '4.99 m'
            mensaje: |
              Esa es la diferencia entre las dos alturas de chorro,
              $24{,}99-20$. No es lo mismo: al bajar el caudal, la
              instalación también pide menos y la bomba da más altura, y la
              válvula tiene que absorber las tres cosas.
          - valor: '5.98 m'
            mensaje: |
              Te has olvidado de las pérdidas de la tubería, que con 24,88
              l/s son 0,35 m contando el 10 % de las menores: la válvula tiene
              que quemar lo que la bomba da de más **después** de pagarlas.
        pista: |
          $h = 20$ fija la velocidad de salida y con ella el caudal; a partir
          de ahí, lo que la bomba da de más es de la válvula.
        desarrollo: |
          $$
          \frac{v_c^{2}}{2g} = 20
          \;\Longrightarrow\;
          Q = 24{,}88\ \text{l/s}
          \qquad
          H_m = 8{,}98\ \text{m}
          $$
          $$
          22+8{,}98 = 5+20+0{,}35+h_v
          \;\Longrightarrow\;
          h_v = 5{,}63\ \text{m}
          $$

      - tipo: dibujar
        consigna: |
          Lo mismo para el apartado c): en los ejes del b), el caudal que da
          20 m de chorro, lo que da la bomba a ese caudal y lo que pide la
          instalación sin válvula, con la pérdida de la válvula entre las dos.
          Y la curva de la instalación con la válvula ya maniobrada.
        comprueba:
          - punto: >-
              Una vertical en 24,88 l/s, el caudal que fijan los 20 m de
              chorro, a la izquierda del punto de funcionamiento del b).
            porque: >-
              El chorro fija la velocidad de salida y con ella el caudal; la
              válvula no elige el caudal, solo lo consigue. Con menos caudal,
              el punto se mueve hacia la izquierda sobre la curva de la bomba.
          - punto: >-
              En esa vertical, el tramo entre la instalación sin válvula, 3,35
              m, y la bomba, 8,98 m: son los 5,63 m de la válvula.
            porque: >-
              Es la resolución del c) en una línea. Se ve que no es la
              diferencia de chorros, 24,99 menos 20: al bajar el caudal la
              bomba da más y la instalación pide menos, y la válvula se lo
              traga todo.
          - punto: >-
              La instalación con la válvula, más empinada, saliendo del mismo
              $-17$ m y cortando a la bomba justo en el punto nuevo.
            porque: >-
              Cerrar una válvula no cambia la curva de la bomba ni el desnivel:
              añade una pérdida que crece con $Q^{2}$, y la curva de la
              instalación gira hacia arriba alrededor de su arranque.
        figura: |
          <svg viewBox="0 0 420 330" role="img" width="420" height="330" aria-labelledby="ex2021o8-c-t ex2021o8-c-d">
            <title id="ex2021o8-c-t">La válvula del ejercicio 8 c): el caudal que da 20 m de chorro, lo que da la bomba y lo que pide la instalación</title>
            <desc id="ex2021o8-c-d">Los mismos ejes y las mismas dos curvas del apartado b), con el punto de funcionamiento sin válvula, 27,81 l/s, marcado con un círculo hueco. Veinte metros de chorro fijan el caudal, 24,88 l/s: una línea vertical en ese caudal. Ahí la bomba da 8,98 m y la instalación sin válvula solo pide 3,35 m; el segmento vertical, grueso, entre las dos curvas es la pérdida que tiene que generar la válvula, 5,63 m, rotulada abajo a la derecha. Una tercera curva, de trazos, es la instalación con la válvula: arranca también en −17 m, sube más deprisa y corta a la bomba justo en el punto nuevo.</desc>
