      <figcaption>Redibujo del esquema del cuadernillo: el perfil, sin escala horizontal, y el detalle B, con los ángulos del enunciado.</figcaption>
      </figure>

      **Notas nuestras.** En el detalle B, $\alpha$ está en la rama ancha,
      por donde entra el fluido desde A, y $\beta$ en la estrecha, por donde
      sale hacia C; con 30° y 60°, las dos ramas son perpendiculares. La cota
      166 es la de la boquilla D, que descarga al aire sobre el depósito E.
      Los 1,2 bar de la presurización son manométricos. En el c), los ejes
      son los de las dos ramas del codo: $x$ a lo largo del tramo AB e $y$ a
      lo largo del BC.
    notas:
      - >-
        **NOTA:** se penalizará no indicar los pasos empleados habitualmente
        en la resolución del apartado c).
    pide: El caudal máximo que admite el sifón, la longitud del tramo BC y las dos componentes de la fuerza que sujeta el codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El punto B está **por encima** de la superficie del depósito A.
          ¿Qué limita el caudal?
        opciones:
          - texto: >-
              La cavitación en B: la presión ahí no puede bajar de la tensión
              de vapor, y eso pone un tope a la altura cinética
            correcta: true
            mensaje: |
              Eso es. Es un sifón: para pasar por B el fluido tiene que estar
              en depresión, y cuanto más caudal, más depresión. El límite es
              que la presión absoluta en B llegue a la tensión de vapor; a
              partir de ahí el líquido hierve y el sifón se rompe.
          - texto: >-
              El desnivel entre A y E, que fija la energía disponible
            mensaje: |
              El desnivel da la energía, pero con 49 metros disponibles y
              10 mcl de pérdida por kilómetro el caudal sería enorme. Lo que
              corta antes es el punto alto.
          - texto: >-
              La rugosidad del cobre
            mensaje: |
              El enunciado ni siquiera la da: sustituye todo el rozamiento por
              «10 mcl por kilómetro». Lo que limita es la cavitación en B.

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Cuánto vale el caudal máximo, en l/s?
        respuesta:
          tipo: magnitud
          valor: '139.02 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '673 l/s'
            mensaje: |
              Te has dejado la pérdida del tramo AB. Son solo 1,4 metros en
              140 m de tubería, pero el margen disponible en B es de apenas
              6 centímetros de altura cinética: esos 1,4 metros son casi todo
              el problema.
          - valor: '251 l/s'
            mensaje: |
              Has usado una atmósfera de 1 bar en vez de los 0,987 del
              enunciado. Trece milibares son 14 cm de columna, y aquí el
              margen entero son 6 cm.
        pista: |
          Escribe la energía entre la superficie de A y el punto B, con la
          presión absoluta en B igual a la de vapor.
        desarrollo: |
          $$
          \frac{p_B}{\gamma} = \frac{2320-98700}{0{,}94\cdot 9800}
          = -10{,}462\ \text{m}
          $$
          $$
          215 - 1{,}4 = 224 - 10{,}462 + \frac{v^{2}}{2g}
          \;\Longrightarrow\;
          \frac{v^{2}}{2g} = 0{,}062\ \text{m}
          $$
          $$
          v = 1{,}106\ \text{m/s}
          \qquad
          Q = 1{,}106\cdot 0{,}1257 = 139{,}0\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿A qué velocidad viaja la onda de presión por esta tubería, en m/s?
        respuesta:
          tipo: magnitud
          valor: '684 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1530 m/s'
            mensaje: |
              Esa es la celeridad en el fluido **infinito**,
              $\sqrt{K/\rho}$: la que tendría si la tubería fuera
              indeformable. El cobre de 2 mm se dilata, y eso la reduce a
              menos de la mitad.
          - valor: '76.4 m/s'
            mensaje: |
              Has pasado el módulo del cobre de N/cm² a Pa multiplicando por
              100. Un centímetro cuadrado es $10^{-4}$ m², así que
              $1{,}1\cdot 10^{7}$ N/cm² son $1{,}1\cdot 10^{11}$ Pa, y el
              cociente $K/E$ vale 0,02, no 2.
        pista: |
          $c = \sqrt{K/\rho}\,/\sqrt{1+(K/E)(D/e)}$, con $D/e = 200$.
        desarrollo: |
          $$
          \sqrt{\frac{K}{\rho}} = \sqrt{\frac{2{,}2\cdot 10^{9}}{940}}
          = 1530\ \text{m/s}
          $$
          $$
          1+\frac{K}{E}\frac{D}{e}
          = 1+\frac{2{,}2\cdot 10^{9}}{1{,}1\cdot 10^{11}}\cdot 200 = 5
          $$
          $$
          c = \frac{1530}{\sqrt{5}} = 684\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La longitud del tramo BC
        pregunta: |
          ¿Cuánto mide el tramo BC hasta la válvula, en metros?
        respuesta:
          tipo: magnitud
          valor: '790.15 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '930 m'
            mensaje: |
              Esa es la longitud **total** desde el depósito A hasta la
              válvula. En la fórmula de Michaud, $L$ es la distancia que
              recorre la onda hasta encontrar una superficie libre, es decir
              A-B-válvula; el tramo BC es eso menos los 140 m de AB.
          - valor: '1720 m'
            mensaje: |
              Te has dejado el 2 de la fórmula de Michaud,
              $\Delta h = 2Lv/(gT)$: sin él la longitud total sale el doble,
              1860 m, y el tramo BC, 1720. El factor 2 está porque la onda
              tiene que ir y volver.
        pista: |
          Primero decide si el cierre es lento o rápido comparando $T$ con
          $2L/c$; después usa la fórmula que toque.
        desarrollo: |
          Con $c = 684$ m/s, el tiempo crítico de una tubería de unos 930 m es
          $2L/c = 2{,}7$ s, menor que los 3 s de cierre: el cierre es
          **lento**, así que vale Michaud.

          $$
          \Delta h = \frac{2\,L\,v}{g\,T}
          \;\Longrightarrow\;
          L = \frac{70\cdot 9{,}8\cdot 3}{2\cdot 1{,}1063} = 930{,}15\ \text{m}
          $$
          $$
          L_{BC} = 930{,}15-140 = 790{,}15\ \text{m}
          $$

          **Y una advertencia sobre la última cifra.** Esa $L$ va como $1/v$, y
          la $v$ sale de restar dos alturas casi iguales —213,6 contra
          213,538—, así que su tercera cifra no es de fiar. El impreso da los
          790,15 m de la cuenta con todas sus cifras, pero cambiar $v$ un 1 %
          mueve el tramo BC nueve metros: con $v = 1{,}107$ salen 789,5.

      - tipo: calcular
        titulo: La fuerza de los anclajes a lo largo del tramo AB
        pregunta: |
          Apartado c). Con el eje $x$ a lo largo del tramo AB, que es la
          dirección de la rama de entrada del codo, positivo hacia A, y el eje
          $y$ a lo largo del BC, la de salida, positivo hacia C —son
          perpendiculares, porque $\alpha + \beta = 90^{\circ}$—, ¿cuánto vale
          la componente $R_x$ de la fuerza que hacen los anclajes, en N?
        respuesta:
          tipo: magnitud
          valor: '4274.3 N'
          tolerancia: 0.005
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3059 N'
            mensaje: |
              Has usado las pérdidas del apartado a), 10 mcl por kilómetro.
              El c) dice que ahora son 2,5: en los 140 m del tramo AB se
              pierden 0,35 m, no 1,4, y la presión a la entrada del codo sale
              un 40 % más alta.
          - valor: '16677 N'
            mensaje: |
              Has puesto presiones absolutas en las bocas del codo. La
              atmósfera empuja también por fuera, sobre toda la pieza, y su
              resultante se anula: en la ecuación de cantidad de movimiento
              van las presiones manométricas.
          - valor: '2488 N'
            mensaje: |
              Esa es la componente **horizontal**: has proyectado sobre ejes
              horizontal y vertical. Es la misma fuerza —4915 N de módulo en
              los dos pares de ejes—, pero el impreso da las componentes según
              las dos ramas del codo, y es lo que se pregunta aquí.
        pista: |
          Bernoulli de la lámina de A a la entrada del codo, en B, con la
          presurización y las pérdidas del tramo AB, da $p_1$. En la dirección
          de la entrada solo intervienen $p_1A_1$ y $\rho Q v_1$: la salida es
          perpendicular.
        desarrollo: |
          $$
          v_1 = \frac{0{,}07}{\pi\cdot 0{,}2^{2}} = 0{,}557\ \text{m/s}
          \qquad
          h_{f,AB} = 2{,}5\cdot 0{,}14 = 0{,}35\ \text{m}
          $$
          $$
          \frac{p_1}{\gamma} = 215+\frac{1{,}2\cdot 10^{5}}{9212}-224-0{,}0158-0{,}35
          = 3{,}661\ \text{m}
          \qquad
          p_1 = 33\,722\ \text{Pa}
          $$
          $$
          R_x = p_1A_1+\rho Q v_1 = 4237{,}6+36{,}7 = 4274{,}3\ \text{N}
          $$

          Hacia atrás, contra el flujo que entra: los anclajes empujan el
          codo hacia A a lo largo del tramo AB. El impreso da 4274,02 N; la
          diferencia es de redondeo. El término de cantidad de movimiento es
          aquí menos del 1 %: casi toda la fuerza la hace la presión.

      - tipo: calcular
        titulo: La fuerza de los anclajes a lo largo del tramo BC
        pregunta: |
          Con los mismos ejes, ¿cuánto vale la componente $R_y$, a lo largo
          del tramo BC y positiva hacia C, en N?
        respuesta:
          tipo: magnitud
          valor: '2426.6 N'
          tolerancia: 0.005
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2361 N'
            mensaje: |
              Te has dejado el término de cantidad de movimiento de la salida,
              $\rho Q v_2 = 65$ N. En la boca estrecha la velocidad casi se ha
              duplicado, y el término ya pesa un 2,7 % de la componente: es el
              que da nombre al teorema.
          - valor: '1743 N'
            mensaje: |
              Has usado las pérdidas del apartado a), 10 mcl por kilómetro, en
              vez de los 2,5 del c): la presión en el codo te sale casi 10 kPa
              más baja.
          - valor: '4239 N'
            mensaje: |
              Esa es la componente **vertical**: has proyectado sobre ejes
              horizontal y vertical. Es la misma fuerza, pero el impreso da
              las componentes según las ramas del codo.
        pista: |
          Bernoulli entre la entrada y la salida del codo, sin pérdidas y a la
          misma cota, da $p_2$: la velocidad sube de 0,557 a 0,990 m/s y la
          presión baja lo que gana la altura cinética.
        desarrollo: |
          $$
          v_2 = \frac{0{,}07}{\pi\cdot 0{,}15^{2}} = 0{,}990\ \text{m/s}
          \qquad
          p_2 = p_1+\frac{\rho}{2}\left(v_1^{2}-v_2^{2}\right)
          = 33\,722-315 = 33\,407\ \text{Pa}
          $$
          $$
          R_y = p_2A_2+\rho Q v_2 = 2361{,}4+65{,}2 = 2426{,}6\ \text{N}
          $$

          En el sentido del flujo que sale: los anclajes tiran del codo hacia
          el tramo BC. El impreso da 2426,1 N. En ejes horizontal y vertical
          la misma fuerza son 2488 N hacia atrás y 4239 N hacia abajo, y el
          módulo, 4915 N en los dos casos.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado c) en papel, con lo que la NOTA penaliza no escribir:
          los pasos de clase, numerados y en su orden. El volumen de control
          es el codo, entre su boca de entrada en B y la de salida hacia C;
          los ejes, los de las dos ramas, que aquí son perpendiculares; y al
          final las dos componentes de la fuerza de los anclajes, con su
          sentido.
        rubrica: cinco-pasos-de-la-cantidad-de-movimiento
        veredicto: |
          Si en tu folio se ven los pasos con su número y las dos
          componentes salen con su sentido, tienes el apartado y no pierdes lo
          que la NOTA penaliza. Si te falta el paso 3, las fuerzas exteriores
          con las $p\,A$ de las dos bocas, las cifras no pueden cuadrar: en
          este codo las presiones son casi toda la fuerza.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El caudal lo limita la cavitación en el punto alto B, y sale
              139 l/s con una altura cinética de solo 6 cm.
          - texto: >-
              La celeridad, con el módulo del cobre y $D/e = 200$, baja de
              1.530 a 684 m/s.
          - texto: >-
              Como el tiempo de cierre supera el crítico, el cierre es lento y
              se aplica Michaud, que da 930 m desde el depósito.
          - texto: >-
              En el codo, con ejes según sus dos ramas, la fuerza de los
              anclajes sale casi entera de las presiones en las bocas:
              $p_1A_1 = 4238$ N frente a $\rho Q v_1 = 37$ N.
          - texto: >-
              Al ser un cierre lento, la sobrepresión es menor que la que daría
              un cierre instantáneo, así que la tubería está del lado de la
              seguridad.
            trampa: true
            mensaje: |
              La primera mitad es cierta —un cierre instantáneo daría
              $cv/g = 77$ m frente a los 70 medidos— pero la conclusión no se
              sigue. «Del lado de la seguridad» sería si la tubería estuviera
              calculada para el cierre instantáneo; el enunciado no dice nada
              de eso. Y setenta metros de columna sobre un conducto de cobre
              de 2 mm de espesor no es un margen: es el problema.
    resolucion: |
      **a) El caudal máximo, que lo limita un sifón.** El punto B está en la
      cota 224 y la superficie de A en la 215: el fluido tiene que **subir**
      nueve metros antes de bajar. Eso solo es posible en depresión, y la
      depresión tiene un tope: la tensión de vapor.

      $$
      \frac{p_B}{\gamma} = \frac{2320-98700}{9212} = -10{,}462\ \text{m}
      $$

      Escribiendo la energía entre la superficie de A y el punto B, con
      $1{,}4$ m de pérdida en los 140 m del tramo AB:

      $$
      215-1{,}4 = 224-10{,}462+\frac{v^{2}}{2g}
      \qquad
      \frac{v^{2}}{2g} = 0{,}062\ \text{m}
      $$

      **Seis centímetros de altura cinética.** Ese es todo el margen, y de ahí
      salen $v = 1{,}106$ m/s y $Q = 139$ l/s. Un sifón trabaja siempre al
      borde.

      **b) La longitud, medida con el golpe de ariete.** Primero la celeridad,
      que en una tubería de cobre de 2 mm de pared no es la del fluido libre:

      $$
      c = \frac{\sqrt{K/\rho}}{\sqrt{1+(K/E)(D/e)}}
      = \frac{1530}{\sqrt{5}} = 684\ \text{m/s}
      $$

      El tiempo crítico, $2L/c$, ronda los 2,7 s, menor que los 3 s de cierre:
      **cierre lento**, y vale Michaud:

      $$
      \Delta h = \frac{2Lv}{gT}
      \qquad
      L = \frac{70\cdot 9{,}8\cdot 3}{2\cdot 1{,}1063} = 930{,}15\ \text{m}
      $$

      Esa $L$ es la distancia desde la válvula hasta la superficie libre más
      próxima aguas arriba, es decir **A**, pasando por B. Descontando los 140
      m del tramo AB:

      $$
      L_{BC} = 930{,}15-140 = 790{,}15\ \text{m}
      $$

      Es lo impreso. La tercera cifra, aun así, no es de fiar, y conviene
      decirlo: $L$ va como $1/v$, y esa $v$ sale de restar dos alturas casi
      iguales. Un 1 % en la velocidad son nueve metros en el tramo.

      **c) El codo convergente.** Con A presurizado a 1,2 bar manométricos,
      70 l/s y 2,5 mcl por kilómetro, Bernoulli de la lámina de A a la
      entrada del codo da la presión en B, y otro Bernoulli, sin pérdidas y a
      la misma cota, la de la salida:

      $$
      p_1 = 33\,722\ \text{Pa}
      \qquad
      p_2 = p_1+\frac{\rho}{2}\left(v_1^{2}-v_2^{2}\right) = 33\,407\ \text{Pa}
      $$

      Los pasos de clase, que la NOTA exige:

      1. **Volumen de control**: el fluido dentro del codo, entre la boca de
         400 mm en B y la de 300 mm hacia C.
      2. **Ejes**: $x$ según la rama de entrada, que sube 30° desde A, e $y$
         según la de salida, que baja 60° hacia C. Con $\alpha + \beta = 90^{\circ}$
         son perpendiculares, y es la elección que da lo impreso.
      3. **Fuerzas exteriores**: $p_1A_1$ empujando hacia dentro por la
         entrada, $p_2A_2$ empujando hacia dentro por la salida, y la
         reacción $R$ del codo, que es lo que transmiten los anclajes. El
         peso de un codo pequeño se desprecia.
      4. **Velocidades y caudales**: $v_1 = 0{,}557$ m/s y
         $v_2 = 0{,}990$ m/s, con $\rho Q = 65{,}8$ kg/s.
      5. **El teorema por componentes**, lo que sale menos lo que entra:

      $$
      R_x = p_1A_1+\rho Q v_1 = 4274{,}3\ \text{N}
      \qquad
      R_y = p_2A_2+\rho Q v_2 = 2426{,}6\ \text{N}
      $$

      $R_x$ va contra el flujo que entra, hacia A, y $R_y$ en el sentido del
      que sale, hacia C. El impreso da 4274,02 y 2426,1 N. En ejes
      horizontal y vertical, la misma fuerza son 2488 N hacia atrás y 4239 N
      hacia abajo: no es otro resultado, es otra base. Lo que decide cuál se
      escribe es qué ejes se han dibujado en el paso 2, y por eso el paso
      puntúa.

      **Y lo bonito del ejercicio.** El golpe de ariete se usa aquí al revés
      de lo habitual: en vez de calcular la sobrepresión que produce una
      tubería conocida, se mide la sobrepresión para **averiguar dónde está la
      válvula**. Es exactamente el principio de los métodos de detección de
      fugas por transitorios.

  # ── 5 (10 %) · Un elevador hidráulico de taller: la columna de aceite
  #    que crece al subir y la válvula de seguridad que para el coche.
  #    Rescatado el 30 de septiembre de 2026: la figura sí acota lo que hace
  #    falta (nivel de A en la cota 2, B y E en la 0, C en la 20 y 10 m de
  #    carrera hasta D), y con ella salen todos los resultados impresos.
  - id: exflu2021-ord-5-el-elevador-que-no-llega-arriba
    titulo: El elevador de taller que no llega arriba
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El sistema de la imagen se utiliza para elevar los coches en un taller
      mecánico. La bomba que se acciona a mano, mediante palanca, toma el
      aceite de $s = 0{,}9$ del depósito A de gran tamaño y lo empuja hacia el
      cilindro situado verticalmente a cota $z_C$. El deposito A está
      inicialmente a presión atmosférica. Esta bomba de mano dispone de dos
      válvulas unidireccionales aguas arriba y aguas abajo para asegurar que
      el aceite fluye desde el depósito hasta el cilindro. Cuando el aceite
      intenta ir del cilindro al depósito, ambas válvulas cortan el paso.

      En el punto E hay una válvula de seguridad unidireccional. Esta válvula
      redirige el aceite del cilindro al depósito A cuando la presión en el
      punto B es igual a 80 bar y limita la presión máxima del punto E a ese
      valor.

      **a)** Calcula la lectura del manómetro del punto B (bar) cuando se
      empieza a elevar el coche.

      **b)** Calcular la lectura del manómetro del punto B (bar) en el momento
      en que el coche haya sido elevado al punto más alto del cilindro.

      El operario pide a otra compañera que le suba mientras él está montado
      en el coche.

      **c)** Estudiar la modificación de la lectura del manómetro del punto B
      para los casos a) y b).

      **d)** ¿Pueden conseguir subir el coche hasta el punto más alto?

      Si la respuesta es SI,

      **e)** ¿Qué masa máxima puede tener el coche antes de que tenga
      problemas en su elevación?

      **f)** Si la presión del depósito A aumenta a 5 bar, ¿qué masa puede
      sostener?

      Si la respuesta es NO,

      **g)** ¿Hasta qué altura subirá el coche?

      **h)** ¿Presurizar el depósito A permite subir el coche hasta arriba?
      ¿Qué presión será necesaria (bar)?

      **DATOS**: Peso del coche 1475 kg, peso del operario 85 kg,
      $D_{\text{cilindro}} = 50$ mm.

