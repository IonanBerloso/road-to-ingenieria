      <figcaption>Redibujo del esquema del cuadernillo, sin escala.</figcaption>
      </figure>

      **Notas nuestras.** La figura, contada: el depósito está cerrado, con
      el manómetro P en la tapa, y el orificio de la pared derecha descarga un
      chorro al aire. A la salida del orificio, un tubo abre de frente al
      chorro, en su eje, y baja a la rama derecha de un manómetro en U de
      líquido $s_m$; la rama izquierda sale del fondo del depósito. El
      líquido manométrico queda $R$ más alto en la rama del tubo que en la del
      depósito.
    pide: La expresión del coeficiente de velocidad y su valor numérico.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro mide la **pérdida** que se produce en el orificio.
          ¿Cómo se relaciona eso con $C_v$?
        opciones:
          - texto: >-
              La energía que sale es $C_v^{2}$ veces la teórica, así que la
              que se pierde es $H\,(1-C_v^{2})$
            correcta: true
            mensaje: |
              Eso es. $C_v = v_{real}/v_{teo}$, y como la energía va con el
              cuadrado de la velocidad, la altura cinética real es
              $C_v^{2}H$. Lo que falta hasta $H$ es lo que se ha degradado, y
              es lo que lee el manómetro.
          - texto: >-
              La pérdida es $H\,(1-C_v)$, porque el coeficiente es lineal
            mensaje: |
              El coeficiente es lineal en la **velocidad**, no en la energía.
              La pérdida es una altura, y las alturas cinéticas van con
              $v^{2}$.
          - texto: >-
              La pérdida no depende de $C_v$: depende del coeficiente de
              contracción
            mensaje: |
              El coeficiente de contracción reduce el **área** del chorro, no
              su velocidad, y no degrada energía. Lo que mide la pérdida es
              exactamente el de velocidad.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel: la expresión de $C_v$ «en función del resto
          de variables que se ven en la imagen», es decir con $P$, $H$, $R$,
          $s$ y $s_m$, y no solo para el depósito abierto del apartado b).
          Antes de escribir una ecuación, di qué marca cada rama del
          manómetro: todo el ejercicio depende de reconocer el tubo que mira
          al chorro.
        rubrica:
          - punto: |
              **La velocidad teórica, con la presión del depósito**: la
              energía disponible sobre el eje del orificio es $H + P/\gamma$,
              y la velocidad teórica, $\sqrt{2g\,(H + P/\gamma)}$.
            porque: |
              Es la referencia contra la que se define
              $C_v = v_{real}/v_{\text{teórica}}$. Sin $P/\gamma$ la expresión solo
              vale con el depósito abierto, y el apartado pide todas las
              variables de la figura, $P$ incluida.
            minimo: true
          - punto: |
              **Qué marca cada rama.** La izquierda sale del fondo del
              depósito, donde el líquido está en reposo: lleva la energía del
              depósito. La derecha viene de un tubo que abre de frente al
              chorro: es un Pitot, y como el chorro sale al aire marca su
              energía total, $v_{real}^{2}/2g$.
            porque: |
              Es el paso que decide el ejercicio. Leído como una toma de
              presión estática, el tubo marcaría la presión del chorro, que es
              la atmosférica, y la lectura no diría nada del orificio. El caso
              del chorro libre está en el tema 13, «Reconocer un Pitot en un
              esquema».
            minimo: true
          - punto: |
              **La ecuación del manómetro, recorrida con los dos líquidos**:
              la diferencia entre las dos energías es $R\,(s_m/s - 1)$ metros
              de columna del líquido del depósito.
            porque: |
              Por encima del manométrico las dos ramas están llenas del
              líquido del depósito, y sus columnas se compensan salvo en $R$:
              por eso entra la diferencia de densidades y no $s_m/s$. Con
              $s_m/s$ el coeficiente sale 0,894 en vez de 0,906.
            minimo: true
          - punto: |
              **Juntarlo y despejar**: la altura cinética real es $C_v^{2}$
              veces la disponible, así que
              $(H + P/\gamma)(1 - C_v^{2}) = R\,(s_m/s - 1)$ y
              $C_v = \sqrt{1 - R\,(s_m/s - 1)/(H + P/\gamma)}$.
            porque: |
              El coeficiente es lineal en la velocidad y cuadrático en la
              energía. Escribir $1 - C_v$ en vez de $1 - C_v^{2}$ es el error
              del que avisa el paso de reconocer.
            minimo: true
          - punto: |
              **Una comprobación antes de sustituir**: con $P = 0$ queda
              $C_v = \sqrt{1 - (R/H)(s_m/s - 1)}$, que vale 1 si $R = 0$ y
              nunca pasa de 1.
            porque: |
              Es la forma de ver que la expresión tiene sentido: sin lectura no
              hay pérdida y el orificio sería perfecto. Si con $R = 0$ no sale
              1, hay un signo o un término mal.
        veredicto: |
          Si tu folio tiene los cuatro primeros, la expresión está deducida.
          Si te falta el segundo, vuelve a la figura antes que a las cuentas:
          sin reconocer el Pitot, la lectura $R$ no dice nada del orificio.

      - tipo: calcular
        titulo: El coeficiente de velocidad
        pregunta: |
          Con $R/H = 0{,}02$, $s = 1$ y $s_m = 10$, ¿cuánto vale $C_v$?
        respuesta:
          tipo: numero
          valor: '0.906'
          tolerancia: 0.005
          formato: un número entre cero y uno
        distractores:
          - valor: '0.424'
            mensaje: |
              Has tomado la lectura del manómetro como la **energía que
              sale** en vez de como la que se pierde. Un orificio con
              $C_v = 0{,}42$ sería malísimo: los reales andan entre 0,95 y
              0,99.
          - valor: '0.82'
            mensaje: |
              Ese es $C_v^{2}$, no $C_v$. Falta la raíz.
          - valor: '0.99'
            mensaje: |
              Has usado $\sqrt{1-R/H}$, sin el factor
              $s_m/s - 1$. La lectura del manómetro son milímetros de
              líquido **manométrico**, y hay que pasarlos a columna del
              fluido que circula.
        pista: |
          La pérdida en metros del fluido que circula es
          $R\,(s_m/s - 1)$, y vale $H\,(1-C_v^{2})$.
        desarrollo: |
          $$
          H\,(1-C_v^{2}) = R\Bigl(\frac{s_m}{s}-1\Bigr)
          $$
          $$
          C_v = \sqrt{1-\frac{R}{H}\Bigl(\frac{s_m}{s}-1\Bigr)}
          = \sqrt{1-0{,}02\cdot 9} = \sqrt{0{,}82} = 0{,}906
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin presurizar el depósito, la energía disponible en el orificio
              es $H$ y la velocidad teórica $\sqrt{2gH}$.
          - texto: >-
              La velocidad real es $C_v$ veces la teórica, así que la altura
              cinética real es $C_v^{2}H$ y lo perdido, $H(1-C_v^{2})$.
          - texto: >-
              El manómetro lee esa pérdida como $R(s_m/s-1)$ metros de
              columna del fluido que circula.
          - texto: >-
              Un $C_v$ de 0,906 es normal en un orificio de pared delgada.
            trampa: true
            mensaje: |
              Es **bajo**. Los coeficientes de velocidad de un orificio de
              pared delgada bien ejecutado andan entre 0,95 y 0,99: el chorro
              apenas pierde energía, y lo que sí reduce el caudal es la
              contracción, con $C_c \approx 0{,}62$. Un $0{,}906$ delata un
              borde mal acabado o un orificio corto que hace de tubo.
    resolucion: |
      **La idea, que es lo que hace distinto a este ejercicio.** Lo habitual
      es medir $C_v$ midiendo el chorro. Aquí se mide **lo que falta**: la
      energía que el orificio degrada.

      **a) La expresión.** Con el depósito a presión $P$ y una altura $H$
      sobre el orificio, la energía disponible es
      $H + P/\gamma$ y la velocidad teórica $\sqrt{2g(H+P/\gamma)}$. La real
      es $C_v$ veces esa, así que la altura cinética que sale es $C_v^{2}$
      veces la disponible y lo perdido es

      $$
      \Delta h = \Bigl(H+\frac{P}{\gamma}\Bigr)(1-C_v^{2})
      $$

      El manómetro en U, con líquido $s_m$, lee esa misma pérdida, porque
      compara dos energías: su rama izquierda sale del fondo del depósito,
      donde el líquido está en reposo, y la derecha viene de un tubo que abre
      de frente al chorro, un Pitot, que en un chorro libre marca
      $v_{real}^{2}/2g$ ([Reconocer un Pitot en un
      esquema](/road-to-ingenieria/fluidos/t13-medidores/#reconocer-un-pitot-en-un-esquema)):

      $$
      \Delta h = R\Bigl(\frac{s_m}{s}-1\Bigr)
      \qquad\Longrightarrow\qquad
      C_v = \sqrt{1-\frac{R\,(s_m/s-1)}{H+P/\gamma}}
      $$

      **b) El número.** Despresurizado, $P = 0$:

      $$
      C_v = \sqrt{1-0{,}02\cdot 9} = \sqrt{0{,}82} = 0{,}906
      $$

      **Y una comprobación de sensatez.** Un orificio de pared delgada bien
      hecho tiene $C_v$ entre 0,95 y 0,99. Que salga 0,906 significa que este
      pierde un 18 % de la energía: bastante para un orificio, y una pista de
      que el borde no está afilado o de que el espesor de la pared lo
      convierte en un tubo corto. Saber qué valores son normales es parte de
      resolver el problema; un coeficiente fuera de rango es una alarma, no un
      resultado.

  # ── 3 (10 %) · Un aliviadero de dos rampas: media caña con diámetro
  #    comercial y canal rectangular óptimo con pendiente redondeada.
  - id: exflu2021-ord-3-el-aliviadero-de-dos-rampas
    titulo: El aliviadero de dos rampas, y las dos formas de redondear
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El aliviadero lateral de la presa de la imagen sirve para evacuar agua
      si se supera cierto nivel de llenado que se considera peligroso. El
      aliviadero está formado por varias conducciones paralelas idénticas que
      se reparten uniformemente el caudal a evacuar y que fueron construidas
      de **hormigón acabado**. Cada una de estas conducciones paralelas está
      formada por dos rampas: una primera semi-circular de pendiente $J_1$ y
      una segunda rectangular de pendiente $J_2$. Un terraplén provisto de
      piedras pesadas hace de frontera entre ambas rampas y sirve también como
      elemento disipador de energía. Puede considerarse que se alcanzan las
      condiciones de flujo permanente en las dos rampas. Se espera que cada
      una de las canalizaciones paralelas sea capaz de evacuar un caudal
      mínimo de $3\ \text{m}^{3}/\text{s}$.

      **a)** Seleccionar el diámetro comercial mínimo (cm) a instalar en la
      primera rampa de pendiente $J_1$ de 1,5 milésimas. Indicar qué
      porcentaje del diámetro se tendrá como berma de seguridad instalado
      dicho diámetro. Los diámetros comerciales están disponibles cada 5 cm.

      **b)** Calcular la pendiente necesaria $J_2$ para que el canal
      rectangular en configuración hidráulicamente óptima transporte el caudal
      indicado con un calado de $H = 1$ m y calcular la velocidad del flujo en
      dicha configuración. ¿Qué valor tendría esa velocidad si se instala la
      pendiente inmediatamente superior a la deducida (redondeada a la próxima
      milésima)?

      **Notas nuestras.** La imagen del cuadernillo dibuja las dos rampas de
      perfil, la primera con pendiente $J_1$ y la segunda con $J_2$, con el
      terraplén de piedras entre las dos, y al lado sus secciones: la media
      caña de diámetro $D$ y el rectángulo de ancho $b$ y calado $H$. *El
      porcentaje de este ejercicio está impreso como «(%10)».*
    pide: El diámetro comercial de la media caña con su berma, y la pendiente y la velocidad del canal rectangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué calado hay que dimensionar la primera rampa, la
          semicircular?
        opciones:
          - texto: >-
              Con la media caña llena hasta el diámetro, que es su máxima
              capacidad; después se comprueba cuánto sobra realmente
            correcta: true
            mensaje: |
              Eso es. Se busca el diámetro mínimo que **puede** llevar los
              3 m³/s, es decir el que a sección llena da justo ese caudal; se
              redondea al comercial siguiente, y con ese diámetro ya sobrado
              se calcula el calado real y lo que sobra por encima.
          - texto: >-
              Con la sección llena hasta la mitad del radio, por seguridad
            mensaje: |
              Un margen a ojo no es un dato del problema. El enunciado no da
              resguardo: pide el diámetro mínimo y **después** preguntar
              cuánto resguardo resulta.
          - texto: >-
              Con el calado crítico
            mensaje: |
              El calado crítico aparece en vertederos y en cambios de
              régimen. Aquí el enunciado dice explícitamente que se alcanzan
              **condiciones de flujo permanente**, es decir régimen uniforme:
              manda Manning.

      - tipo: calcular
        titulo: El diámetro comercial de la media caña
        pregunta: |
          ¿Qué diámetro comercial hay que instalar en la primera rampa, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.95 m'
            mensaje: |
              El cálculo exacto da $1{,}954$ m, y hacia abajo no vale: con
              1,95 la media caña no llega a los 3 m³/s. Al redondear una
              capacidad se sube siempre al comercial siguiente.
          - valor: '0.98 m'
            mensaje: |
              Has dado el radio. La media caña de radio $0{,}977$ m tiene
              $1{,}954$ m de diámetro.
        pista: |
          Media caña llena: $A = \pi R^{2}/2$, $P = \pi R$, $R_h = R/2$, con
          $n = 0{,}012$ y $J_1 = 0{,}0015$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}012}\,\frac{\pi R^{2}}{2}
          \Bigl(\frac{R}{2}\Bigr)^{2/3}\sqrt{0{,}0015}
          = 3{,}193\,R^{8/3} = 3
          $$
          $$
          R = 0{,}977\ \text{m}
          \qquad
          D = 1{,}954\ \text{m}
          \;\longrightarrow\;
          D_{com} = 2{,}00\ \text{m}
          $$

          Con $D = 2$ m, el calado real para 3 m³/s baja a $0{,}964$ m, así
          que la berma es de $3{,}6$ cm: en torno al **1,7-1,8 %** del
          diámetro.

      - tipo: calcular
        titulo: La pendiente del canal rectangular
        pregunta: |
          ¿Qué pendiente $J_2$ hace falta, en milésimas?
        respuesta:
          tipo: numero
          valor: '0.816'
          tolerancia: 0.005
          formato: un número en milésimas
        distractores:
          - valor: '1.5'
            mensaje: |
              Esa es la pendiente de la **primera** rampa. La segunda es
              rectangular y óptima, y con 1 m de calado necesita bastante
              menos.
          - valor: '0.324'
            mensaje: |
              Has tomado $R_h = H = 1$ m en vez de $H/2$. En el rectángulo
              óptimo el radio hidráulico es la mitad del calado: con uno el
              doble de grande, la pendiente sale dos veces y media menor.
        pista: |
          Óptimo rectangular: $b = 2H = 2$ m, $A = 2$, $P = 4$,
          $R_h = 0{,}5$ m.
        desarrollo: |
          $$
          3 = \frac{1}{0{,}012}\cdot 2\cdot 0{,}5^{2/3}\sqrt{J_2}
          = 104{,}99\sqrt{J_2}
          $$
          $$
          J_2 = 8{,}16\cdot 10^{-4} = 0{,}816\ \text{milésimas}
          \qquad
          v_2 = \frac{3}{2} = 1{,}5\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad con la pendiente redondeada
        pregunta: |
          Si se ejecuta con la milésima siguiente, $J_2 = 1$, ¿a qué velocidad
          circula el mismo caudal, en m/s?
        respuesta:
          tipo: magnitud
          valor: '1.617 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.66 m/s'
            mensaje: |
              Has calculado el caudal que llevaría el canal **lleno hasta 1 m**
              con la pendiente nueva, y lo has dividido por la misma sección.
              Pero el caudal sigue siendo 3 m³/s: lo que baja es el calado, a
              $0{,}927$ m, y la sección con él.
          - valor: '1.5 m/s'
            mensaje: |
              Esa es la de la pendiente exacta. Con más pendiente el agua va
              más deprisa y ocupa menos calado, aunque el caudal no cambie.
        pista: |
          El caudal sigue siendo 3 m³/s y el ancho 2 m; lo que cambia es el
          calado. Hay que despejarlo de Manning y después dividir.
        desarrollo: |
          $$
          3 = \frac{1}{0{,}012}\,2y\Bigl(\frac{y}{1+y}\Bigr)^{2/3}
          \sqrt{0{,}001}
          \;\Longrightarrow\;
          y = 0{,}927\ \text{m}
          $$
          $$
          v = \frac{3}{2\cdot 0{,}927} = 1{,}617\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La media caña necesita $1{,}954$ m de diámetro, así que se
              instala la de 2 m y sobra un 1,8 % de resguardo.
          - texto: >-
              El canal rectangular óptimo con 1 m de calado tiene 2 m de ancho
              y necesita $0{,}816$ milésimas para llevar los 3 m³/s.
          - texto: >-
              Con la pendiente redondeada a una milésima, el mismo caudal
              circula con menos calado y algo más deprisa: 1,617 m/s.
          - texto: >-
              El terraplén de piedras entre las dos rampas está para frenar el
              agua, así que la segunda rampa se dimensiona con el caudal ya
              reducido.
            trampa: true
            mensaje: |
              El terraplén disipa **energía**, no caudal. El agua que entra
              tiene que salir: por las dos rampas circulan los mismos 3 m³/s.
              Lo que hace el disipador es matar la velocidad que trae la
              primera rampa para que la segunda arranque en régimen
              permanente, que es justo la hipótesis que el enunciado permite
              usar.
    resolucion: |
      **El dato común.** Hormigón acabado, $n = 0{,}012$ en el cuadro n.º 26.
      Y por las dos rampas circula el **mismo** caudal, 3 m³/s: el terraplén
      disipa energía, no agua.

      **a) La media caña.** Se busca el diámetro mínimo capaz de llevar los
      3 m³/s a sección llena, con $A = \pi R^{2}/2$, $P = \pi R$ y
      $R_h = R/2$:

      $$
      3{,}193\,R^{8/3} = 3
      \qquad
      R = 0{,}977\ \text{m}
      \qquad
      D = 1{,}954\ \text{m}
      $$

      Como los comerciales van de 5 en 5 cm, se instala el de **2,00 m**:
      hacia abajo no vale, porque no llegaría al caudal.

      Con esos 2 m ya hay holgura, y la pregunta es cuánta. Despejando el
      calado real para 3 m³/s sale $y = 0{,}964$ m, así que la berma es de
      unos $3{,}6$ cm, en torno al **1,7-1,8 %** del diámetro. El examen
      publica 1,7 %; la integración exacta de la sección circular da 1,80 %, y
      la diferencia es de lectura del cuadro n.º 27.

      **b) El canal rectangular.** En configuración óptima, $b = 2H = 2$ m:

      $$
      A = 2\ \text{m}^{2}
      \qquad
      P = 4\ \text{m}
      \qquad
      R_h = 0{,}5\ \text{m}
      $$
      $$
      J_2 = 0{,}816\ \text{milésimas}
      \qquad
      v_2 = 1{,}5\ \text{m/s}
      $$

      Y si se ejecuta con la milésima entera —que es lo que pasa en obra—, el
      canal es más rápido de lo necesario: el mismo caudal circula con
      $0{,}927$ m de calado y **1,617 m/s**. Un 8 % más de velocidad y 7 cm
      menos de agua, solo por redondear la pendiente hacia arriba.

      **Las dos formas de redondear, que es lo que enseña el ejercicio.** El
      diámetro se redondea **hacia arriba** porque es una capacidad y hacia
      abajo no llegaría. La pendiente también se redondea hacia arriba, pero
      ahí el efecto es el contrario: sobra capacidad y lo que hay que vigilar
      es que la velocidad no erosione el revestimiento.

  # ── 4 (15 %) · Golpe de ariete con la longitud como incógnita, un sifón
  #    cuyo caudal máximo lo limita la cavitación en el punto alto y, desde el
  #    30 de septiembre de 2026, el apartado c): la fuerza sobre el codo
  #    convergente de B, que cuadra con lo impreso en ejes según sus ramas.
  - id: exflu2021-ord-4-el-ariete-con-la-longitud-por-incognita
    titulo: El sifón que cavita arriba, el ariete que mide la tubería y el codo anclado
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 28 de junio de 2021 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se transporta un fluido de densidad relativa $s = 0{,}94$ desde un
      depósito A hasta un depósito E, a través de un conducto de cobre, de
      400 mm de diámetro y 2 mm de espesor, como se muestra en la figura.
      Teniendo en cuenta las cotas de la imagen y sabiendo que se pierden
      10 mcl por kilómetro de longitud de tubería, se pide:

      **a)** Calcular el caudal máximo que puede circular.

      A lo largo del segundo tramo (BC) de la tubería, se encuentra una
      válvula de regulación. Al cerrar dicha válvula en 3 segundos, la
      sobrepresión generada es de 70 mcl.

      **b)** Calcular la longitud del segundo tramo (BC) hasta la válvula,
      **justificando la respuesta**.

      A continuación, se decide presurizar el depósito A a 1,2 bar y se
      sustituye el segundo tramo del conducto (BC), introduciendo un pequeño
      codo convergente (ver detalle inferior) anclado, de forma que el
      diámetro del tramo BC es de 300 mm.

      **c)** Sabiendo que debido a que se regula la válvula situada en C por
      el conducto circulan 70 l/s, calcular las componentes de la fuerza que
      deben hacer los anclajes para fijar el codo. En este caso, las pérdidas
      producidas son de 2,5 mcl por kilómetro de longitud de tubería.
      Despreciar las pérdidas en el codo convergente.

      **DATOS**: $P_{atm} = 0{,}987$ bar, $P_{vap}$ (abs) $= 2320$ Pa,
      $L_1 = 140$ m (tramo AB), Módulo de elasticidad del fluido 2200 MPa y
      del cobre $1{,}1\cdot 10^{7}\ \text{N/cm}^{2}$, $\alpha = 30^{\circ}$,
      $\beta = 60^{\circ}$.

