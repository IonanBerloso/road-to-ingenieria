            <desc id="ex2021o8-b-d">Unos ejes con el caudal Q en litros por segundo, de 0 a 36, y la altura H en metros, de −19 a 14. La curva de la bomba baja desde 11,23 m a caudal nulo. La curva de la instalación, la altura que tiene que dar la bomba para cada caudal, arranca en −17 m, porque la lámina del depósito está 17 m por encima de la boquilla, y sube casi toda por la altura cinética del chorro. Corta al eje de caudales en unos 22,7 l/s, que es lo que sale con la bomba parada, marcado con un círculo hueco. Y corta a la bomba en el punto de funcionamiento, 27,81 l/s y 8,42 m, con dos líneas de trazos a los ejes.</desc>
