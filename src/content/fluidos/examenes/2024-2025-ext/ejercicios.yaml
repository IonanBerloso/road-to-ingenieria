ejercicios:
  # ── 1 (10 %) · Propiedades. Tres apartados que recorren el tema entero:
  #    gas ideal, densidad y compresibilidad. Y dos trampas de unidades —el
  #    dyn/cm² y la UTM— puestas a propósito.
  - id: exflu2425-ext-1-el-dioxido-de-carbono-comprimido
    titulo: El dióxido de carbono comprimido, y dos unidades que se olvidan
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      El volumen inicial de un cilindro con un pistón que contiene dióxido de
      carbono es $0{,}1\ \text{m}^{3}$. El volumen del gas contenido varía al
      aplicarle presión. Se sabe que su presión **absoluta** inicial es
      $100\ \text{kPa}$ y el proceso de expansión/compresión es isotermo,
      siendo la temperatura de $300\ \text{K}$. El gas se comprime hasta un
      volumen de $0{,}04\ \text{m}^{3}$.

      a) Presión manométrica final ($\text{dyn/cm}^{2}$) si el gas se comporta
      como un gas ideal.

      b) Densidad final del gas ($\text{UTM/m}^{3}$).

      c) Coeficiente de compresibilidad cúbico del dióxido de carbono tras ser
      comprimido, en unidades del SI. Justificar la respuesta.

      Datos: $p_{at} = 1\ \text{atm}$;
      $R = 0{,}082\ (\text{atm}\cdot\text{l})/(\text{mol}\cdot\text{K})$;
      $M = 44\ \text{g/mol}$.
    pide: La presión manométrica final, la densidad final y el coeficiente de compresibilidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El proceso es **isotermo**. ¿Qué se conserva?
        opciones:
          - texto: >-
              El producto $pV$, porque con $T$ y la cantidad de gas
              constantes, $pV = nRT$ es el mismo antes y después
            correcta: true
            mensaje: |
              Eso es. Es la ley de Boyle-Mariotte, y sale de la de los gases
              ideales sin más que fijar $T$ y $n$. Comprimir a las dos quintas
              partes del volumen multiplica la presión por dos y media.
          - texto: >-
              La densidad, porque la masa de gas no cambia
            mensaje: |
              La **masa** no cambia; la densidad sí, porque el volumen se
              reduce. De hecho la densidad se multiplica por $0{,}1/0{,}04 =
              2{,}5$, igual que la presión.
          - texto: >-
              La presión, porque el pistón está en equilibrio
            mensaje: |
              Si la presión no cambiara, el pistón no comprimiría nada. Lo que
              el enunciado dice es que la **temperatura** se mantiene, no la
              presión.

      - tipo: calcular
        titulo: La presión absoluta final
        pregunta: |
          ¿Qué presión absoluta alcanza el gas?
        respuesta:
          tipo: magnitud
          valor: '250 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '40 kpa'
            mensaje: |
              Has invertido la relación: $p_1 = p_0 V_1/V_0$ en vez de
              $p_0V_0/V_1$. Al **comprimir**, la presión sube, no baja.
          - valor: '148.7 kpa'
            mensaje: |
              Esa es la manométrica, la del apartado a). Boyle trabaja con
              presiones **absolutas**, y el enunciado da la inicial ya en
              absolutas.
        pista: |
          $p_0V_0 = p_1V_1$, con las presiones en absolutas.
        desarrollo: |
          $$
          p_1 = p_0\,\frac{V_0}{V_1} = 100\,\frac{0{,}1}{0{,}04}
          = 250\ \text{kPa (abs)}
          $$

      - tipo: calcular
        titulo: La presión manométrica
        pregunta: |
          ¿Cuál es la presión manométrica final, en
          $\text{dyn/cm}^{2}$? (solo el número)
        respuesta:
          tipo: numero
          valor: '1486750'
          tolerancia: 2000
          formato: un número, en dinas por centímetro cuadrado
        distractores:
          - valor: '2500000'
            mensaje: |
              Has convertido la presión **absoluta**. La manométrica descuenta
              la atmosférica: $250 - 101{,}3 = 148{,}7$ kPa.
          - valor: '148675'
            mensaje: |
              Ese es el valor en pascales. Una baria o
              $\text{dyn/cm}^{2}$ vale $0{,}1$ Pa —cuadro n.º 11— así que hay
              que **multiplicar** por diez.
        pista: |
          Resta la atmosférica y recuerda que
          $1\ \text{dyn/cm}^{2} = 0{,}1\ \text{Pa}$.
        desarrollo: |
          $$
          p_{1,\text{man}} = 250\,000 - 101\,325 = 148\,675\ \text{Pa}
          $$
          $$
          = \frac{148\,675}{0{,}1} = 1{,}487\cdot 10^{6}\ \text{dyn/cm}^{2}
          $$

      - tipo: calcular
        titulo: La densidad final
        pregunta: |
          ¿Cuál es la densidad final del gas, en $\text{UTM/m}^{3}$?
        respuesta:
          tipo: magnitud
          valor: '0.45 utm/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '4.413 utm/m3'
            mensaje: |
              Ese es el valor en $\text{kg/m}^{3}$. La unidad técnica de masa
              vale $9{,}8$ kg, así que para pasar a UTM hay que **dividir**
              entre $9{,}8$.
          - valor: '0.18 utm/m3'
            mensaje: |
              Parece que has usado la presión **inicial**. La densidad se pide
              después de comprimir, con $250$ kPa: en un isotermo, densidad y
              presión son proporcionales.
        pista: |
          $\rho = \dfrac{pM}{RT}$ con la presión absoluta final, y después a
          UTM.
        desarrollo: |
          $$
          \frac{n}{V} = \frac{p}{RT} = \frac{250/101{,}325}{0{,}082\cdot 300}
          = 0{,}1003\ \text{mol/l}
          $$
          $$
          \rho = 0{,}1003\cdot 1000\cdot 44 = 4413\ \text{g/m}^{3}
          = 4{,}413\ \text{kg/m}^{3}
          = 0{,}45\ \text{UTM/m}^{3}
          $$

      - tipo: calcular
        titulo: El coeficiente de compresibilidad
        pregunta: |
          ¿Cuánto vale el coeficiente de compresibilidad cúbico, en
          $\text{Pa}^{-1}$? (solo el número)
        respuesta:
          tipo: numero
          valor: '0.000004'
          tolerancia: 0.0000002
          formato: un número, en pascales elevado a menos uno
        distractores:
          - valor: '0.00001'
            mensaje: |
              Has usado la presión **inicial**. El enunciado pide el
              coeficiente «tras ser comprimido», y en un gas ideal isotermo
              vale $1/p$: cambia con el estado.
          - valor: '250000'
            mensaje: |
              Ese es el **módulo de elasticidad volumétrico**, $K = p$, que es
              el inverso del coeficiente de compresibilidad. Fíjate en las
              unidades que pide el enunciado: $\text{Pa}^{-1}$.
        pista: |
          Para un gas ideal isotermo, $pV = $ cte, y de ahí
          $\beta = -\dfrac{1}{V}\dfrac{dV}{dp} = \dfrac{1}{p}$.
        desarrollo: |
          Derivando $pV = \text{cte}$ a temperatura constante,
          $p\,dV + V\,dp = 0$, luego

          $$
          \beta = -\frac{1}{V}\frac{dV}{dp} = \frac{1}{p}
          = \frac{1}{250\,000} = 4\cdot 10^{-6}\ \text{Pa}^{-1}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Isotermo con la misma masa de gas significa $pV$ constante, así
              que comprimir de 0,1 a 0,04 m³ lleva la presión de 100 a 250 kPa
              absolutos.
          - texto: >-
              En manométricas son 148,7 kPa, es decir
              $1{,}487\cdot 10^{6}\ \text{dyn/cm}^{2}$.
          - texto: >-
              La densidad sube en la misma proporción que la presión y queda
              en $4{,}41\ \text{kg/m}^{3}$, o sea $0{,}45\ \text{UTM/m}^{3}$.
          - texto: >-
              Y el coeficiente de compresibilidad, $\beta = 1/p$, es una
              propiedad del dióxido de carbono y no depende del estado.
            trampa: true
            mensaje: |
              Depende del estado, y mucho: $\beta = 1/p$ ha pasado de
              $10^{-5}$ a $4\cdot 10^{-6}$ al comprimir. **Un gas es tanto
              menos compresible cuanto más comprimido está**, y por eso el
              enunciado especifica «tras ser comprimido». En un líquido sí es
              casi una constante, y de ahí la confusión.

    resolucion: |
      **Un ejercicio de tres apartados y dos trampas de unidades.** La física
      es elemental —Boyle y la ley de los gases— y lo que evalúa de verdad es
      si se manejan el $\text{dyn/cm}^{2}$ y la UTM.

      **a) La presión.** $p_1 = p_0V_0/V_1 = 250$ kPa absolutos, y en
      manométricas $250 - 101{,}3 = 148{,}7$ kPa. La baria o
      $\text{dyn/cm}^{2}$ vale $0{,}1$ Pa (cuadro n.º 11), así que

      $$
      p_{1,\text{man}} = 1{,}487\cdot 10^{6}\ \text{dyn/cm}^{2}
      $$

      **b) La densidad.** Con la ley de los gases y la presión absoluta,
      $\rho = 4{,}413\ \text{kg/m}^{3}$. La unidad técnica de masa vale
      $9{,}8$ kg, así que son $0{,}45\ \text{UTM/m}^{3}$. Es la misma unidad
      que apareció en el globo aerostático de la ordinaria de 2026: en esta
      asignatura sale más de lo que parece.

      **c) El coeficiente.** Para un gas ideal isotermo,

      $$
      \beta = -\frac{1}{V}\frac{dV}{dp} = \frac{1}{p} = 4\cdot 10^{-6}\
      \text{Pa}^{-1}
      $$

      **Y el orden de magnitud, que es lo que da sentido al número.** El agua
      tiene $\beta \approx 5\cdot 10^{-10}\ \text{Pa}^{-1}$: **este gas
      comprimido sigue siendo ocho mil veces más compresible que el agua**.
      Por eso la hipótesis de incompresibilidad, que en líquidos se da por
      buena sin discutir, en gases hay que justificarla cada vez —y se
      justifica por el número de Mach, no por el fluido—.

  # ── 2 (15 %) · Bombeo. El ejercicio de más peso del examen, y el que reúne
  #    todo el tema 25: curva de la instalación con Hazen-Williams, punto de
  #    funcionamiento, cavitación y maniobra de la válvula. Y una rareza que
  #    conviene ver: el depósito de destino está MÁS BAJO que el de origen y
  #    aun así hay que bombear, porque está presurizado.
  - id: exflu2425-ext-2-la-bomba-y-la-valvula-que-hay-que-cerrar
    titulo: Bombear hacia abajo, y la válvula que hay que cerrar después
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se bombea agua desde un depósito cuya superficie libre se encuentra a
      cota $30\ \text{m}$ a otro depósito presurizado que se encuentra a cota
      $17\ \text{m}$. El manómetro situado en la parte superior del depósito
      indica una lectura de $1{,}96\ \text{bar}$.

      El conducto de aspiración tiene una longitud de $200\ \text{m}$ y un
      diámetro de $250\ \text{mm}$; el de impulsión, $400\ \text{m}$ y
      $300\ \text{mm}$. La salida del depósito es de ángulos vivos
      ($k = 0{,}5$) y la entrada al depósito inferior tiene $k = 1$. A lo
      largo de la impulsión hay tres codos de radio medio
      ($L_{eq} = 2\ \text{m}$ cada uno) y una válvula de regulación
      parcialmente abierta ($k = 6$). Todas las tuberías son de hierro
      forjado.

      a) Deducir, empleando Hazen-Williams, la expresión de la curva
      característica de la instalación.

      Sabiendo que se quiere una velocidad en la impulsión en torno a
      $1\ \text{m/s}$, la bomba elegida da su punto de funcionamiento en
      $Q = 76{,}39\ \text{l/s}$ y $H = 10{,}76\ \text{m}$, con
      $\eta = 80{,}4\ \%$ y $NPSH_{req} = 1{,}7\ \text{m}$.

      b) Determinar si existe o no riesgo de cavitación.

      c) Si se reduce la lectura del manómetro a la mitad y se maniobra la
      válvula para mantener el punto de funcionamiento previo, calcular el
      nuevo factor de paso de dicha válvula. ¿Se cierra o se abre?

      Datos: $p_{at} = 1\ \text{atm}$; $p_v/\gamma = 0{,}2$ mca;
      $z_{\text{bomba}} = 27\ \text{m}$.
    pide: La curva de la instalación, el estudio de cavitación y el nuevo factor de paso de la válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito de destino está **trece metros más bajo** que el de
          origen. ¿Por qué hace falta bombear?
        opciones:
          - texto: >-
              Porque está presurizado a 1,96 bar, que son 20 m de columna, y
              eso supera con creces el desnivel favorable
            correcta: true
            mensaje: |
              Eso es. La altura piezométrica es
              $\Delta z + \Delta p/\gamma = -13 + 20 = +7$ m: el desnivel
              ayuda, la presión estorba, y gana la presión.
          - texto: >-
              Porque sin bomba el agua no circularía por una tubería de 600 m
            mensaje: |
              La longitud produce pérdidas, pero por sí sola no impide la
              circulación: con desnivel favorable el agua bajaría sola hasta
              que el rozamiento igualara los 13 m. Lo que lo impide es la
              presión del depósito de llegada.
          - texto: >-
              Porque la bomba está a la cota 27, por debajo del depósito de
              origen
            mensaje: |
              La cota de la bomba no entra en la curva de la instalación —esta
              va de lámina a lámina— sino en el NPSH, que es el apartado b).
              Y estar por debajo del origen es una buena noticia para la
              aspiración, no un problema.

      - tipo: calcular
        titulo: La altura piezométrica
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: magnitud
          valor: '7 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '33 m'
            mensaje: |
              Has sumado el desnivel en vez de restarlo. El destino está más
              **bajo** que el origen: $17 - 30 = -13$ m, y eso descuenta.
          - valor: '-13 m'
            mensaje: |
              Te has quedado con el desnivel y has olvidado la presión del
              depósito de llegada: $1{,}96$ bar son 20 m de columna de agua, y
              son ellos los que obligan a poner una bomba.
        pista: |
          $\Delta z + \Delta p/\gamma$, con $1{,}96$ bar $= 196\,000$ Pa.
        desarrollo: |
          $$
          H_{\text{piez}} = (17 - 30) + \frac{196\,000}{9800}
          = -13 + 20 = 7\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de la instalación en el punto de funcionamiento
        pregunta: |
          A $76{,}39\ \text{l/s}$, ¿cuánta altura pide la instalación?
        respuesta:
          tipo: magnitud
          valor: '10.76 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '7 m'
            mensaje: |
              Esa es la altura piezométrica, la que hace falta a caudal
              **cero**. Con 76 l/s circulando hay 3,28 m de rozamiento y
              0,48 de pérdidas menores.
          - valor: '3.76 m'
            mensaje: |
              Esas son solo las pérdidas —3,28 de tubería más 0,48 de piezas—.
              La instalación necesita además vencer los 7 m de altura
              piezométrica.
        pista: |
          $H = 7 + J_1L\,Q^{1{,}852} + \sum k\,v^{2}/2g$, con los codos dentro
          de la longitud equivalente de la impulsión.
        desarrollo: |
          Con $\varepsilon = 0{,}006$ cm para el hierro forjado, las
          rugosidades relativas son $2{,}4\cdot 10^{-4}$ y $2{,}0\cdot
          10^{-4}$, que en el cuadro n.º 25 caen en $C_{HW} = 130$ y $140$
          respectivamente:

          $$
          H = 7 + 1{,}07\cdot 10^{-3}\,Q^{1{,}852}
          + 8{,}21\cdot 10^{-5}\,Q^{2}
          $$
          $$
          H(76{,}39) = 7 + 3{,}28 + 0{,}48 = 10{,}76\ \text{m}
          $$

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿De cuánto NPSH dispone la bomba?
        respuesta:
          tipo: magnitud
          valor: '11.17 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '5.17 m'
            mensaje: |
              Has restado los 3 m de cota. La bomba está a 27 y el depósito a
              30: está **por debajo**, trabaja en carga, y esos tres metros
              suman.
          - valor: '13.13 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración, 1,96 m. Son los 200 m
              de tubería que hay antes de la bomba más la salida del depósito.
        pista: |
          A $(p_{at}-p_v)/\gamma$ hay que sumarle el desnivel favorable
          $z_{\text{dep}} - z_{\text{bomba}}$ y restarle la pérdida de la
          aspiración.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 1{,}90 + 0{,}06 = 1{,}96\ \text{m}
          $$
          $$
          NPSH_d = 10{,}33 - 0{,}2 + 3 - 1{,}96 = 11{,}17\ \text{m}
          $$

          Frente a los $1{,}7$ m requeridos: **no hay riesgo de cavitación**,
          y por mucho.

      - tipo: calcular
        titulo: El nuevo factor de paso de la válvula
        pregunta: |
          Con el manómetro a la mitad y el mismo punto de funcionamiento,
          ¿cuánto vale el nuevo $k$ de la válvula? (solo el número)
        respuesta:
          tipo: numero
          valor: '174'
          tolerancia: 4
          formato: un número sin unidades
        distractores:
          - valor: '6'
            mensaje: |
              Ese es el valor original: sale de olvidarse de cambiar la altura
              piezométrica. Si el manómetro baja a la mitad, el término
              independiente pasa de 7 a $-3$ m, y son esos 10 metros los que
              la válvula tiene que reponer.
          - valor: '342'
            mensaje: |
              Has anulado la presión del depósito en vez de reducirla a la
              mitad. A la mitad son 10 m de columna, no cero, y la altura
              piezométrica queda en $-3$ m.
        pista: |
          La nueva curva tiene que pasar por el **mismo** punto (76,39;
          10,76), con la altura piezométrica cambiada. Despeja el $k$ que hace
          falta.
        desarrollo: |
          Con el manómetro a $0{,}98$ bar, $H_{\text{piez}} = 17 - 30 + 10
          = -3$ m. Para que la curva siga pasando por $(76{,}39;\ 10{,}76)$:

          $$
          10{,}76 = -3 + 3{,}28 + 0{,}12 + k_V\,\frac{v_{\text{imp}}^{2}}{2g}
          $$
          $$
          k_V = \frac{10{,}36}{0{,}0596} = 174
          $$

          De 6 a 174: **la válvula se cierra**, y mucho.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El destino está 13 m más bajo pero presurizado a 20 m de
              columna: la altura piezométrica es $+7$ m.
          - texto: >-
              A 76,39 l/s la instalación pide 10,76 m, y el NPSH disponible es
              de 11,17 frente a 1,7 requeridos: no cavita.
          - texto: >-
              Al bajar el manómetro a la mitad, la altura piezométrica cae a
              $-3$ m, y para no cambiar el caudal la válvula tiene que
              reponer diez metros: su factor de paso pasa de 6 a 174.
          - texto: >-
              Cerrar la válvula así hace que la bomba consuma más, porque tiene
              que vencer una pérdida mayor.
            trampa: true
            mensaje: |
              La bomba trabaja **en el mismo punto** —ese es el enunciado del
              apartado— así que da el mismo caudal a la misma altura y consume
              exactamente lo mismo. Lo que ha cambiado es en qué se gasta esa
              energía: antes, en vencer la presión del depósito; ahora, en
              calentar el agua dentro de la válvula. **El consumo no sube, pero
              el trabajo útil baja**, y ese es el argumento contra estrangular.

    resolucion: |
      **La rareza del enunciado.** El agua va de la cota 30 a la 17, es decir
      **cuesta abajo**, y aun así hace falta una bomba: el depósito de llegada
      está a 1,96 bar, que son 20 metros de columna. La altura piezométrica
      queda en $-13 + 20 = 7$ m. Es el ejercicio que separa «altura
      geométrica» de «altura piezométrica».

      **a) La curva.** Con hierro forjado ($\varepsilon = 0{,}006$ cm) las
      rugosidades relativas caen en dos bandas distintas del cuadro n.º 25
      —$C_{HW} = 130$ para los 250 mm y $140$ para los 300— y los tres codos
      entran como 6 m de longitud equivalente en la impulsión:

      $$
      H = 7 + 1{,}07\cdot 10^{-3}\,Q^{1{,}852} + 8{,}21\cdot 10^{-5}\,Q^{2}
      $$

      Los tres factores de paso —$0{,}5$ de salida, $6$ de válvula y $1$ de
      entrada— van en el segundo término, cada uno con la altura cinética de
      **su** tramo: la salida con los 250 mm y los otros dos con los 300.

      **b) La cavitación.** La bomba está en la cota 27 y el depósito en la
      30: aspira **en carga**, con tres metros a favor.

      $$
      NPSH_d = 10{,}33 - 0{,}2 + 3 - 1{,}96 = 11{,}17\ \text{m}
      $$

      frente a $1{,}7$ requeridos. No cavita ni de lejos, y el margen es tan
      grande precisamente por esos tres metros de carga: si la bomba se
      hubiera puesto tres metros por encima en vez de por debajo, el margen
      caería a 5,17.

      **c) La válvula.** Bajar el manómetro a la mitad quita 10 m de
      resistencia a la instalación, y su curva cae diez metros. Para que el
      punto de funcionamiento no se mueva, la válvula tiene que reponerlos:

      $$
      k_V = 174
      $$

      **Se cierra**, y de forma brutal: de 6 a 174 son casi treinta veces más
      resistencia.

      **Sobre el número publicado.** El examen da $175{,}79$. La diferencia
      está en si los factores de paso de la salida del depósito y de la
      entrada se descuentan o se meten dentro del nuevo $k$; descontándolos
      salen 173,8. Es un 1,1 % y las dos lecturas son defendibles.

  # ── 4 (7,5 %) · Análisis dimensional en su forma más pura: cuatro
  #    variables, una de ellas ya adimensional, y el resultado es la fórmula
  #    del vertedero triangular que el tema 13 usa sin demostrar.
  - id: exflu2425-ext-4-el-vertedero-en-v-por-analisis-dimensional
    titulo: El vertedero en V, deducido sin resolver ninguna integral
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea analizar el funcionamiento hidráulico de un vertedero en V de
      un río mediante un modelo a escala reducida. Se ha determinado que el
      caudal $Q$ que pasa por el vertedero depende de las siguientes
      variables: nivel de agua en el vertedero $H$, ángulo del vertedero
      $\alpha$ y aceleración de la gravedad $g$.

      Determinar las variables adimensionales que describen el proceso,
      indicando claramente el procedimiento empleado.
    pide: Los parámetros adimensionales del vertedero triangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          Una de las cuatro variables ya es adimensional. ¿Cómo entra eso en
          el teorema $\pi$?
        opciones:
          - texto: >-
              El ángulo es un $\pi$ por sí mismo, y las tres restantes con dos
              magnitudes fundamentales —longitud y tiempo— dan uno más: dos en
              total
            correcta: true
            mensaje: |
              Exacto. Una variable ya adimensional se lleva su propio
              parámetro sin hacer nada, y no puede entrar como repetida
              —no aporta ninguna dimensión que cancelar—.
          - texto: >-
              Se descarta, porque el teorema $\pi$ solo trabaja con variables
              dimensionales
            mensaje: |
              No se descarta: el fenómeno depende del ángulo, y una relación
              que no lo contenga estaría incompleta. Lo que ocurre es que
              entra directamente como $\pi_1 = \alpha$.
          - texto: >-
              Cuenta como una magnitud fundamental más, así que quedan tres
              parámetros
            mensaje: |
              Las magnitudes fundamentales aquí son dos —longitud y tiempo—,
              porque no aparece la masa por ningún sitio: ni densidad ni
              viscosidad ni fuerza. Un ángulo no es una magnitud fundamental.

      - tipo: calcular
        titulo: Cuántos parámetros
        pregunta: |
          ¿Cuántos parámetros adimensionales describen el fenómeno? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el ángulo. Es una variable del problema y también
              un parámetro adimensional: un vertedero de 90° y otro de 60° no
              se comportan igual.
          - valor: '3'
            mensaje: |
              Comprueba las magnitudes fundamentales: $Q$, $H$ y $g$ solo
              contienen longitud y tiempo, no masa. Son cuatro variables menos
              dos, no menos una.
        pista: |
          $n - m$, con $n$ el número de variables y $m$ el de magnitudes
          fundamentales que **aparecen de verdad**.
        desarrollo: |
          Variables: $Q$, $H$, $\alpha$, $g$. Dimensiones:

          $$
          [Q] = L^{3}T^{-1}
          \qquad
          [H] = L
          \qquad
          [g] = LT^{-2}
          \qquad
          [\alpha] = 1
          $$

          Solo intervienen $L$ y $T$, así que $m = 2$ y salen
          $4 - 2 = 2$ parámetros.

      - tipo: calcular
        titulo: El exponente del calado
        pregunta: |
          En $\pi_2 = Q\,H^{a}g^{b}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-2.5'
          tolerancia: 0.05
          formato: un número con su signo
        distractores:
          - valor: '-1.5'
            mensaje: |
              Ese es el exponente del vertedero **rectangular**, donde la
              anchura es constante y no depende de $H$. En el triangular la
              anchura crece con el calado y aparece una potencia más.
          - valor: '-2'
            mensaje: |
              Comprueba con las dimensiones: $Q$ lleva $L^{3}$ y $g^{-1/2}$
              aporta $L^{-1/2}$, así que hacen falta $L^{-5/2}$ de $H$ para
              cancelarlo todo.
        pista: |
          Impón $L$ y $T$ a cero por separado. El tiempo fija $b$ y después
          la longitud fija $a$.
        desarrollo: |
          $$
          [\pi_2] = (L^{3}T^{-1})(L)^{a}(LT^{-2})^{b} = L^{0}T^{0}
          $$
          $$
          T:\; -1 - 2b = 0 \;\Rightarrow\; b = -\tfrac{1}{2}
          \qquad
          L:\; 3 + a + b = 0 \;\Rightarrow\; a = -\tfrac{5}{2}
          $$
          $$
          \pi_2 = \frac{Q}{H^{5/2}\sqrt{g}}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuatro variables y dos magnitudes fundamentales —solo $L$ y
              $T$— dan dos parámetros.
          - texto: >-
              El ángulo es uno de ellos por sí mismo, $\pi_1 = \alpha$.
          - texto: >-
              El otro es $\pi_2 = Q/(H^{5/2}\sqrt g)$, de donde
              $Q = \phi(\alpha)\,H^{5/2}\sqrt g$.
          - texto: >-
              Y como el análisis dimensional ha dado la fórmula del vertedero
              triangular, ya no hace falta ensayarlo.
            trampa: true
            mensaje: |
              El análisis dimensional ha dado la **forma** —la potencia
              $5/2$— pero no la función $\phi(\alpha)$, que es donde vive el
              coeficiente de desagüe. Ese sigue saliendo del ensayo. Lo que sí
              ha conseguido es reducir el trabajo experimental de tres
              variables a una: basta con medir $\phi$ para cada ángulo, en vez
              de barrer calados y gravedades.

    resolucion: |
      **Cuatro variables, dos magnitudes.** $Q$, $H$, $\alpha$ y $g$. Como no
      aparece ni la densidad ni la viscosidad ni ninguna fuerza, **la masa no
      interviene**: solo $L$ y $T$. De ahí $4 - 2 = 2$ parámetros.

      **El primero es gratis.** El ángulo ya es adimensional:
      $\pi_1 = \alpha$.

      **El segundo.** Tomando $H$ y $g$ como repetidas,

      $$
      \pi_2 = \frac{Q}{H^{5/2}\sqrt g}
      $$

      **Y de ahí sale la fórmula del tema 13.**

      $$
      Q = \phi(\alpha)\,\sqrt g\,H^{5/2}
      $$

      que es exactamente la estructura de
      $Q = \frac{8}{15}C_d\sqrt{2g}\tan\frac{\alpha}{2}H^{5/2}$: la potencia
      $5/2$, la raíz de $g$, y todo lo demás metido en una función del
      ángulo. **El análisis dimensional ha deducido en tres líneas la forma
      que en el tema 13 costó una integral**, y sin decir nada del coeficiente
      de desagüe, que sigue siendo experimental.

      **Lo que este ejercicio enseña sobre el método.** Es el caso más limpio
      posible: no hay que elegir entre Reynolds y Froude, no hay conflicto de
      semejanza, no hay nada que discutir. Sirve para ver el teorema $\pi$
      haciendo lo único que sabe hacer —decir cuántos números hay y cuáles
      son— y para ver que eso, solo, ya vale mucho.

  # ── 5 (15 %) · Bombeo en paralelo. Y el detalle que decide el ejercicio:
  #    los 1,46 «mca» de pérdida hay que pasarlos a columna de petróleo. Sin
  #    esa conversión salen 63,9 l/s en vez de 69,4, un 8 % de error que no
  #    se delata solo.
  - id: exflu2425-ext-5-el-bombeo-de-petroleo-en-el-desierto
    titulo: Dos bombas en paralelo, y unos metros de columna que no son de agua
    fuente: >-
      Ejercicio 5 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea diseñar una instalación de bombeo de petróleo crudo
      ($s = 0{,}86$) en el desierto, que bombeará del pozo (cota
      $120\ \text{m}$) al depósito (cota $530\ \text{m}$). Se utilizarán dos
      bombas de forma habitual, en los tramos 2 y 4; la tercera (tramo 3) es
      de reserva y **no circula caudal por ella**. Todos los tubos son de
      hierro fundido y la temperatura media es de $30\ °C$.

      | conducto | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | longitud (m) | 10 | 5 | 3 | 5 | 400 |
      | diámetro (mm) | 200 | 100 | ? | 100 | 300 |

      a) Calcular el caudal bombeado por la instalación si se conoce que las
      pérdidas de carga del tramo 5 son de $1{,}46\ \text{mca}$. La longitud
      equivalente de los elementos situados en ese tramo es de
      $27\ \text{m}$.

      b) Calcular la potencia bruta de cada una de las bombas de los tramos 2
      y 4 —ambas son iguales y entre las dos mueven el caudal total— si su
      rendimiento es de $0{,}88$.

      Dato: $\nu_{\text{petróleo}}(30\ °C) = 7{,}0\cdot 10^{-6}\
      \text{m}^{2}/\text{s}$.
    pide: El caudal bombeado y la potencia bruta de cada bomba.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la pérdida del tramo 5 en **mca**, y por la tubería
          circula petróleo de $s = 0{,}86$. ¿Se puede meter ese número tal
          cual en Darcy-Weisbach?
        opciones:
          - texto: >-
              No: Darcy-Weisbach da alturas de columna **del fluido que
              circula**, así que hay que dividir entre $0{,}86$ y usar
              $1{,}70$ m de columna de petróleo
            correcta: true
            mensaje: |
              Exacto, y es el detalle que decide el ejercicio. Meter 1,46 tal
              cual da 63,9 l/s en vez de 69,4: un 8 % de error que no se
              delata por ningún lado.
          - texto: >-
              Sí: una pérdida de carga es una altura y no depende del fluido
            mensaje: |
              Una pérdida de carga es una altura **de la columna del propio
              fluido**. Decir «1,46 mca» es dar una presión disfrazada de
              altura, y para volver a altura hay que dividir entre el peso
              específico correcto.
          - texto: >-
              No: hay que multiplicar por $0{,}86$, porque el petróleo pesa
              menos
            mensaje: |
              El sentido está al revés. La misma presión, en un líquido más
              ligero, son **más** metros de columna: $1{,}46/0{,}86 = 1{,}70$.

      - tipo: calcular
        titulo: La pérdida en columna de petróleo
        pregunta: |
          ¿A cuántos metros de columna de petróleo equivalen los
          $1{,}46\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '1.698 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '1.46 m'
            mensaje: |
              Ese es el dato sin convertir. «mca» son metros de columna de
              **agua**: una unidad de presión. En columna de petróleo son
              más metros, porque el petróleo pesa menos.
          - valor: '1.256 m'
            mensaje: |
              Has multiplicado por $0{,}86$ en vez de dividir. Comprueba el
              sentido: un líquido más ligero necesita una columna **más alta**
              para dar la misma presión.
        pista: |
          $h_{\text{petróleo}} = h_{\text{agua}}\,\gamma_{\text{agua}}/
          \gamma_{\text{petróleo}}$.
        desarrollo: |
          $$
          h = \frac{1{,}46}{0{,}86} = 1{,}698\ \text{m de columna de petróleo}
          $$

      - tipo: calcular
        titulo: El caudal bombeado
        pregunta: |
          ¿Qué caudal mueve la instalación?
        respuesta:
          tipo: magnitud
          valor: '69.4 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '63.9 l/s'
            mensaje: |
              Has usado los $1{,}46$ mca sin convertir a columna de petróleo.
              Es un 8 % de error, y el resultado sigue pareciendo razonable:
              por eso la conversión hay que hacerla siempre, no solo cuando el
              número «canta».
          - valor: '71.9 l/s'
            mensaje: |
              Te has dejado los 27 m de longitud equivalente del tramo 5. La
              longitud de cálculo es $400 + 27 = 427$ m.
        pista: |
          Tipo II sobre el tramo 5: la pérdida es dato, así que se forma
          $Re\sqrt f$ sin conocer la velocidad. Hierro fundido,
          $\varepsilon = 0{,}026$ cm.
        desarrollo: |
          $$
          \sqrt f\,v = \sqrt{\frac{1{,}698\cdot 0{,}3\cdot 19{,}6}{427}}
          = 0{,}1529
          \qquad
          Re\sqrt f = \frac{0{,}1529\cdot 0{,}3}{7\cdot 10^{-6}} = 6553
          $$
          $$
          \frac{\varepsilon}{D} = 8{,}67\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0243
          \;\Longrightarrow\;
          v = 0{,}982\ \text{m/s}
          $$
          $$
          Q = 0{,}982\cdot\frac{\pi\,0{,}3^{2}}{4} = 69{,}4\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La potencia bruta de cada bomba
        pregunta: |
          ¿Qué potencia bruta necesita cada una de las dos bombas?
        respuesta:
          tipo: magnitud
          valor: '137.4 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '274.7 kw'
            mensaje: |
              Esa es la potencia total de la instalación. Son **dos** bombas
              repartiéndose el caudal: cada una mueve la mitad con la misma
              altura, así que cada una consume la mitad.
          - valor: '120.9 kw'
            mensaje: |
              Te has dejado el rendimiento. Los $0{,}88$ convierten la
              potencia útil en la bruta, y siempre dividiendo.
        pista: |
          Altura total: los 410 m de desnivel más las pérdidas de los tramos
          1, 2 y 5. Después $P = \gamma QH/\eta$, y a repartir entre dos.
        desarrollo: |
          | tramo | $Q$ | $D$ | $v$ | $h_f$ |
          |---|---|---|---|---|
          | 1 | 69,4 l/s | 200 mm | 2,21 m/s | 0,31 m |
          | 2 (o 4) | 34,7 l/s | 100 mm | 4,42 m/s | 1,36 m |
          | 5 | 69,4 l/s | 300 mm | 0,98 m/s | 1,70 m |

          $$
          H = 410 + 0{,}31 + 1{,}36 + 1{,}70 = 413{,}4\ \text{m}
          $$
          $$
          P_{\text{total}} = \frac{0{,}86\cdot 9800\cdot 0{,}0694\cdot 413{,}4}
          {0{,}88} = 274{,}7\ \text{kW}
          \;\Longrightarrow\;
          137{,}4\ \text{kW cada una}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 1,46 mca del tramo 5 son 1,70 m de columna de petróleo, y
              con ellos y los 427 m equivalentes salen 69,4 l/s.
          - texto: >-
              El caudal se reparte entre las dos bombas, así que por los
              tramos 2 y 4 pasan 34,7 l/s cada uno.
          - texto: >-
              La altura total son los 410 m de desnivel más 3,4 de pérdidas, y
              la potencia bruta, 137,4 kW por bomba.
          - texto: >-
              Las pérdidas de carga son tan pequeñas frente a los 410 m de
              desnivel que se podrían haber despreciado desde el principio.
            trampa: true
            mensaje: |
              Se podrían despreciar **para calcular la potencia** —son un
              0,8 %— pero no para el apartado a), donde son el dato del que
              sale todo el caudal. El enunciado da la pérdida del tramo 5
              precisamente porque no hay curva de bomba: sin ella no habría
              forma de saber cuánto circula. Un término despreciable en un
              balance puede ser el único dato disponible en otro.

    resolucion: |
      **El detalle que decide el ejercicio.** El enunciado da la pérdida del
      tramo 5 en **mca**, y por la tubería circula petróleo. «Metros de
      columna de agua» es una forma de escribir una presión; Darcy-Weisbach
      trabaja en metros de columna **del fluido que circula**. La conversión

      $$
      h = \frac{1{,}46}{0{,}86} = 1{,}70\ \text{m de columna de petróleo}
      $$

      es la diferencia entre 69,4 y 63,9 l/s: un 8 %, y ninguno de los dos
      números resulta sospechoso a simple vista.

      **a) El caudal.** El tramo 5 es un problema de tipo II —la pérdida es
      dato— así que se forma $Re\sqrt f = 6553$ sin conocer la velocidad, se
      entra al ábaco con $\varepsilon/D = 8{,}7\cdot 10^{-4}$ y se despeja:

      $$
      Q = 69{,}4\ \text{l/s}
      $$

      **b) La potencia.** Las dos bombas están en **paralelo**: cada una mueve
      la mitad del caudal, pero las dos tienen que dar la altura completa,
      porque están una al lado de otra entre los mismos dos nudos. La altura
      total son 413,4 m —410 de desnivel y 3,4 de pérdidas— y

      $$
      P = \frac{\gamma Q H}{\eta} = 274{,}7\ \text{kW}
      \;\Longrightarrow\;
      137{,}4\ \text{kW por bomba}
      $$

      **Y por qué la tercera bomba está ahí.** El tramo 3 no lleva caudal
      mientras las otras dos funcionan, y su diámetro ni siquiera se da. Es
      una bomba de reserva, y su existencia cambia el diseño: si tuviera que
      sustituir a **una** de las dos, movería 34,7 l/s a 413 m; si tuviera que
      sustituir a las dos, el doble de caudal, y entonces las pérdidas de los
      tramos estrechos se cuadruplicarían. Por eso el enunciado dice que
      «será diferente».

  # ── 6 (10 %) · Fuerzas sobre superficies, con la vuelta de tuerca del
  #    vacuómetro: la superficie piezométrica queda DENTRO del depósito, y la
  #    fuerza horizontal cambia de signo a media compuerta.
  - id: exflu2425-ext-6-la-compuerta-con-vacuometro
    titulo: La compuerta con vacuómetro, y el plano piezométrico que se hunde
    fuente: >-
      Ejercicio 6 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Un depósito cerrado contiene un fluido de densidad relativa $s = 2$ y
      lleva en su parte superior un vacuómetro que marca
      $0{,}4\ \text{kg/cm}^{2}$.

      La pared derecha del depósito lleva una compuerta ABCD de $3\ \text{m}$
      de altura total y $b = 1{,}2\ \text{m}$ de ancho, formada de arriba
      abajo por: un cuarto de cilindro de radio $R = 1\ \text{m}$ (de A a B),
      la cara de un prisma de sección cuadrada de lado $R = 1\ \text{m}$ (de B
      a C) y otro cuarto de cilindro de radio $R = 1\ \text{m}$ (de C a D).
      Los dos cuartos de cilindro sobresalen hacia el fluido; A está al nivel
      de la superficie libre.

      Calcular las componentes horizontal y vertical de la fuerza hidrostática
      que el fluido realiza sobre la compuerta ABCD.
    pide: Las dos componentes de la fuerza hidrostática sobre la compuerta.

    pasos:
      - tipo: reconocer
        pregunta: |
          El vacuómetro marca $0{,}4\ \text{kg/cm}^{2}$ de **vacío**. ¿Dónde
          queda el plano piezométrico?
        opciones:
          - texto: >-
              Por debajo de la superficie libre: la depresión equivale a
              $2\ \text{m}$ de columna del fluido, así que el plano de
              presión nula está 2 m más abajo que A
            correcta: true
            mensaje: |
              Eso es, y es lo que hace distinto a este ejercicio. Con el plano
              piezométrico hundido, los dos primeros metros de compuerta están
              a presión **negativa**: el fluido tira de ellos hacia dentro en
              vez de empujarlos hacia fuera.
          - texto: >-
              Por encima de la superficie libre, porque un vacuómetro mide
              presión
            mensaje: |
              Un vacuómetro mide **depresión**: presiones por debajo de la
              atmosférica. El plano piezométrico se hunde, no sube. Si
              subiera, todo el prisma de presiones sería positivo y la fuerza
              saldría mucho mayor.
          - texto: >-
              En la propia superficie libre, porque el vacío no afecta a la
              presión del líquido
            mensaje: |
              Afecta a todo el líquido por igual: la presión en cualquier
              punto es la del gas de arriba más $\gamma h$. Bajar la del gas
              baja la de todos los puntos en la misma cantidad.

      - tipo: calcular
        titulo: La profundidad del plano piezométrico
        pregunta: |
          ¿Cuántos metros por debajo de A queda el plano de presión nula?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4 m'
            mensaje: |
              Has dejado la depresión en metros de columna de **agua**:
              $0{,}4\ \text{kg/cm}^{2} = 4$ mca. El fluido tiene $s = 2$, así
              que la misma presión son la mitad de metros de su columna.
          - valor: '0.4 m'
            mensaje: |
              Has confundido $\text{kg/cm}^{2}$ con metros. La equivalencia es
              $1\ \text{kg/cm}^{2} = 10$ mca, así que $0{,}4$ son 4 mca, y en
              columna del fluido, 2 m.
        pista: |
          $0{,}4\ \text{kg/cm}^{2}$ en columna del fluido de $s = 2$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{0{,}4\cdot 9{,}8\cdot 10^{4}}
          {2\cdot 9800} = 2\ \text{m}
          $$

          Y como es **depresión**, el plano piezométrico está 2 m por debajo
          de A, es decir justo en C.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Cuánto vale la resultante horizontal sobre la compuerta?
        respuesta:
          tipo: magnitud
          valor: '35.28 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '105.84 kn'
            mensaje: |
              Has ignorado el vacuómetro y has puesto el plano piezométrico en
              A. Con la depresión, el tramo A–C está a presión negativa y
              resta: la resultante baja a la tercera parte.
          - valor: '17.64 kn'
            mensaje: |
              Has usado el peso específico del **agua**. El fluido tiene
              $s = 2$, así que su $\gamma$ es $19\,600\ \text{N/m}^{3}$.
        pista: |
          Integra el prisma de presiones sobre la proyección vertical de 3 m,
          contando negativo lo que queda por encima del plano piezométrico.
        desarrollo: |
          Con el plano piezométrico en C (2 m por debajo de A), la presión a
          profundidad $z$ vale $\gamma(z-2)$:

          $$
          F_H = \gamma b\int_0^{3}(z-2)\,dz
          = 19\,600\cdot 1{,}2\left[\frac{z^{2}}{2}-2z\right]_0^{3}
          $$
          $$
          = 23\,520\,(4{,}5-6) = -35\,280\ \text{N}
          $$

          El signo negativo dice que la resultante apunta **hacia el interior
          del depósito**: los dos metros en depresión pesan más que el metro
          en presión.

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          ¿Y la resultante vertical?
        respuesta:
          tipo: magnitud
          valor: '60.47 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '23.52 kn'
            mensaje: |
              Has restado las contribuciones de los dos cuartos de cilindro.
              Los dos empujan hacia arriba: el de arriba porque está en
              depresión y el de abajo porque tiene fluido encima. Se suman.
          - valor: '36.95 kn'
            mensaje: |
              Solo has contado las dos áreas de cuarto de círculo. En el arco
              superior hay además el rectángulo que va de su cuerda al plano
              piezométrico, y vale $1\ \text{m}^{2}$ más.
        pista: |
          Para cada arco, el volumen de fluido —real o imaginario— entre la
          superficie curva y el plano piezométrico. Los dos empujan hacia
          arriba.
        desarrollo: |
          Arco superior (A–B), con el plano piezométrico 2 m por debajo de A:

          $$
          V_1/b = \int_0^{1}\left(y_{\text{arco}}+2\right)dx
          = 1 + \frac{\pi R^{2}}{4} = 1{,}785\ \text{m}^{2}
          $$

          Arco inferior (C–D), que arranca justo en el plano piezométrico:

          $$
          V_2/b = \frac{\pi R^{2}}{4} = 0{,}785\ \text{m}^{2}
          $$
          $$
          F_V = \gamma b\,(1{,}785 + 0{,}785) = 23\,520\cdot 2{,}571
          = 60{,}47\ \text{kN}\ (\uparrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El vacuómetro hunde el plano piezométrico 2 m, justo hasta C.
          - texto: >-
              La horizontal sale $35{,}28$ kN hacia dentro, porque los dos
              metros en depresión superan al metro en presión.
          - texto: >-
              La vertical sale $60{,}47$ kN hacia arriba: los dos cuartos de
              cilindro empujan en el mismo sentido.
          - texto: >-
              Y la componente horizontal apunta hacia dentro porque la
              compuerta está por encima del plano piezométrico en su mayor
              parte, así que la compuerta no necesita anclaje.
            trampa: true
            mensaje: |
              Que la fuerza apunte hacia dentro no la hace inofensiva: son
              35 kN, tres toneladas y media, y el anclaje tiene que
              soportarlos **en ese sentido**. De hecho es el caso peor para
              muchas compuertas, porque suelen diseñarse para que la presión
              las apriete contra su marco: en depresión, el fluido tira de
              ellas hacia dentro y quien las sujeta son los tornillos, no el
              marco.

    resolucion: |
      **La idea del ejercicio.** Un vacuómetro en la parte alta del depósito
      hunde el plano piezométrico. Con $0{,}4\ \text{kg/cm}^{2}$ de depresión
      y un fluido de $s = 2$, se hunde **exactamente 2 m**: justo hasta C, el
      punto donde termina la cara plana y empieza el arco inferior. El
      enunciado está construido para que caiga ahí.

      **La consecuencia.** El prisma de presiones cambia de signo a mitad de
      la compuerta:

      | tramo | profundidad bajo A | presión |
      |---|---|---|
      | A–B (arco superior) | 0 a 1 m | negativa |
      | B–C (cara plana) | 1 a 2 m | negativa |
      | C–D (arco inferior) | 2 a 3 m | positiva |

      **La horizontal.** Integrando sobre los 3 m de proyección vertical, el
      área negativa (dos metros) supera a la positiva (uno):

      $$
      F_H = \gamma b\left[\frac{z^{2}}{2}-2z\right]_0^{3} = -35{,}28\
      \text{kN}
      $$

      es decir **hacia el interior**. Ignorar el vacuómetro daría 105,84 kN
      hacia fuera: no solo el triple, sino en sentido contrario.

      **La vertical.** Aquí los dos arcos empujan **hacia arriba**, aunque por
      motivos distintos. El de abajo, porque tiene fluido encima que lo
      levanta —el volumen entre el arco y el plano piezométrico—. El de
      arriba, porque está en depresión: la falta de presión sobre su cara
      superior actúa como una succión. Sumando los dos volúmenes,

      $$
      F_V = 60{,}47\ \text{kN}\ (\uparrow)
      $$

      **La comprobación que conviene hacer siempre en estos casos.** Cuando
      aparece un vacuómetro, dibuja el prisma de presiones **antes** de
      integrar nada y marca dónde cruza el cero. Si el cruce cae dentro de la
      compuerta —como aquí— hay dos áreas de signos contrarios, y sumarlas sin
      mirar el signo es el error más caro del tema.

  # ── 7 (12,5 %) · Canales, con una sección compuesta que no está en ninguna
  #    tabla: medio hexágono con un semicírculo encima. Hay que deducir el
  #    área y el perímetro desde la geometría, y ese es todo el ejercicio.
  - id: exflu2425-ext-7-el-tubo-de-hexagono-y-semicirculo
    titulo: Medio hexágono con un semicírculo encima
    fuente: >-
      Ejercicio 7 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      La sección de un tubo de hormigón acabado ($n = 0{,}012$) está formada
      por medio hexágono en su parte inferior y medio círculo en la superior.
      Los lados del hexágono tienen una longitud $L$ y forman ángulos de
      $60°$; el semicírculo se apoya sobre la anchura mayor del hexágono, que
      vale $2L$. La tubería recorre una distancia de $10\ \text{km}$,
      perdiendo $11\ \text{m}$ de altura en su trayecto.

      a) Si solo se utiliza la parte hexagonal de la sección, calcular la
      longitud $L$ exacta para transportar un caudal máximo de
      $2\ \text{m}^{3}/\text{s}$.

      Suponer en adelante que la tubería se ha construido con $L = 1\
      \text{m}$. Para minimizar el riesgo de que el conducto entre en carga
      cuando se llene, se pretende que la berma $H$ —desde la lámina de agua
      hasta la coronación del semicírculo— sea de $20\ \text{cm}$.

      b) ¿Cuál es el caudal máximo transportable en estas condiciones?
    pide: La longitud L del lado del hexágono y el caudal con la berma de 20 cm.

    pasos:
      - tipo: reconocer
        pregunta: |
          Medio hexágono regular de lado $L$, apoyado sobre uno de sus lados.
          ¿Qué área y qué perímetro mojado tiene lleno hasta el diámetro?
        opciones:
          - texto: >-
              Es un trapecio de bases $L$ y $2L$ y altura $L\sqrt3/2$: el área
              vale $3\sqrt3 L^{2}/4$ y el perímetro mojado, $3L$
            correcta: true
            mensaje: |
              Eso es. Los tres lados mojados son los tres de abajo del
              hexágono —el horizontal y los dos inclinados— y la anchura
              superior es $2L$ porque cada lado inclinado aporta $L/2$ de
              proyección horizontal a cada lado.
          - texto: >-
              Área $L^{2}\sqrt3/2$ y perímetro $2L$, porque son dos triángulos
              equiláteros
            mensaje: |
              Medio hexágono regular son **tres** triángulos equiláteros de
              lado $L$, no dos, y su contorno mojado son tres lados.
          - texto: >-
              Área $2L^{2}$ y perímetro $4L$, tomándolo como un rectángulo de
              $2L\times L$
            mensaje: |
              No es un rectángulo: los lados van inclinados $60°$, así que la
              altura es $L\sqrt3/2 = 0{,}866L$ y la base de abajo mide $L$, no
              $2L$.

      - tipo: calcular
        titulo: La longitud del lado
        pregunta: |
          ¿Qué lado $L$ hace falta para llevar $2\ \text{m}^{3}/\text{s}$ solo
          con la parte hexagonal?
        respuesta:
          tipo: magnitud
          valor: '98.99 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '89.45 cm'
            mensaje: |
              Parece que has usado $2L$ como perímetro mojado. Son los **tres**
              lados de abajo: $3L$.
          - valor: '49.5 cm'
            mensaje: |
              Eso es la mitad del resultado. Cuidado con no confundir el lado
              del hexágono con la mitad de la anchura superior: la anchura es
              $2L$, pero lo que se pide es $L$.
        pista: |
          $A = 3\sqrt3L^{2}/4$ y $R_H = A/3L$, y Manning con
          $J = 11/10\,000$ deja todo en $L^{8/3}$.
        desarrollo: |
          $$
          A = \frac{3\sqrt3}{4}L^{2} = 1{,}299\,L^{2}
          \qquad
          R_H = \frac{1{,}299L^{2}}{3L} = 0{,}433\,L
          $$
          $$
          2 = \frac{1}{0{,}012}\,1{,}299L^{2}\,(0{,}433L)^{2/3}
          \sqrt{1{,}1\cdot 10^{-3}} = 2{,}055\,L^{8/3}
          $$
          $$
          L = 0{,}9899\ \text{m} = 98{,}99\ \text{cm}
          $$

      - tipo: calcular
        titulo: El caudal con la berma
        pregunta: |
          Con $L = 1\ \text{m}$ y $20\ \text{cm}$ de berma, ¿cuánto caudal
          cabe?
        respuesta:
          tipo: magnitud
          valor: '5.07 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '2.06 m3/s'
            mensaje: |
              Ese es el caudal de la parte hexagonal sola, la del apartado a).
              Con el semicírculo casi lleno la sección se dobla y el radio
              hidráulico sube un 29 %.
          - valor: '4.78 m3/s'
            mensaje: |
              Has llenado el conducto entero, sin berma. Los 20 cm que se
              dejan libres cuestan un 6 % de caudal, y son precisamente lo que
              impide que el tubo entre en carga.
        pista: |
          Con $L = 1$, el semicírculo tiene $R = 1$ m; el agua llega a
          $0{,}8$ m por encima del diámetro. Suma el hexágono completo y el
          segmento circular.
        desarrollo: |
          Segmento circular de $R = 1$ hasta $y = 0{,}8$:

          $$
          A_{\text{seg}} = y\sqrt{1-y^{2}} + \arcsin y = 1{,}407\ \text{m}^{2}
          \qquad
          P_{\text{arco}} = 2\arcsin y = 1{,}855\ \text{m}
          $$
          $$
          A = 1{,}299 + 1{,}407 = 2{,}706\ \text{m}^{2}
          \qquad
          P = 3 + 1{,}855 = 4{,}855\ \text{m}
          $$
          $$
          v = \frac{1}{0{,}012}\,0{,}5575^{2/3}\sqrt{1{,}1\cdot 10^{-3}}
          = 1{,}873\ \text{m/s}
          \qquad
          Q = 5{,}07\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Medio hexágono de lado $L$ da $A = 1{,}299L^{2}$ y $P = 3L$, de
              donde $R_H = 0{,}433L$.
          - texto: >-
              Para 2 m³/s con la pendiente de 1,1 milésimas hace falta
              $L = 98{,}99$ cm.
          - texto: >-
              Con $L = 1$ m y 20 cm de berma, la sección pasa a 2,71 m² y el
              radio hidráulico a 0,558 m: caben 5,07 m³/s.
          - texto: >-
              Es decir que añadir el semicírculo multiplica el caudal por dos
              y medio porque duplica el área.
            trampa: true
            mensaje: |
              El área se dobla —de 1,30 a 2,71 m²— pero el caudal se
              multiplica por 2,47. El resto lo pone el **radio hidráulico**,
              que sube de 0,433 a 0,558 m: un 29 %. Es el mismo efecto que en
              cualquier sección profunda: la parte alta añade mucha área y
              poco perímetro, porque las paredes ahí ya se están cerrando
              hacia dentro.

    resolucion: |
      **Una sección que no está en ninguna tabla.** Medio hexágono con un
      semicírculo encima: no hay fórmula que buscar, hay que deducir el área y
      el perímetro. Ese es el ejercicio.

      **a) El hexágono solo.** Medio hexágono regular de lado $L$ son tres
      triángulos equiláteros: base $L$ abajo, anchura $2L$ arriba, altura
      $L\sqrt3/2$.

      $$
      A = \frac{3\sqrt3}{4}L^{2}
      \qquad
      P = 3L
      \qquad
      R_H = \frac{\sqrt3}{4}L = 0{,}433\,L
      $$

      Manning con $J = 11/10\,000$ deja todo en $L^{8/3}$ y sale
      $L = 98{,}99$ cm. Que salga tan cerca de un metro redondo es lo que
      justifica el apartado b).

      **b) Con el semicírculo y la berma.** Con $L = 1$ m el semicírculo tiene
      radio 1 m, y dejar 20 cm de berma significa que el agua llega a 0,8 m
      por encima del diámetro. La sección es el hexágono completo más un
      segmento circular:

      | | $A$ (m²) | $P$ (m) | $R_H$ (m) | $Q$ (m³/s) |
      |---|---|---|---|---|
      | solo hexágono | 1,299 | 3,000 | 0,433 | 2,06 |
      | con berma de 20 cm | 2,706 | 4,855 | 0,558 | **5,07** |
      | lleno hasta arriba | 2,870 | 6,142 | 0,467 | 4,78 |

      **Y la tercera fila es la que enseña algo.** Llenar el conducto **del
      todo** da menos caudal que dejarlo a 20 cm de la coronación: 4,78 frente
      a 5,07. En la parte alta del círculo las paredes se cierran, y ahí el
      perímetro crece más deprisa que el área. Es la misma razón por la que en
      una tubería circular el caudal máximo se da al 94 % del diámetro y no al
      100 %, y es lo que convierte la berma de este enunciado en algo mejor
      que una medida de seguridad: **también es la sección de mayor
      capacidad.**

  # ── 8 (10 %) · Álabes fijos aplicados a un coche de fórmula 1. Es el
  #    ejercicio que demuestra que la expresión ρQv(1−cos θ) del tema 15 no
  #    es solo de turbinas.
  - id: exflu2425-ext-8-los-alerones-del-formula-uno
    titulo: Los alerones de un fórmula 1, que son álabes fijos
    fuente: >-
      Ejercicio 8 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se está diseñando un coche experimental que se asemeja a un fórmula 1.
      Los alerones delanteros y traseros pueden considerarse **álabes fijos**.
      En la parte frontal tiene dos alerones de anchura $L = 0{,}95\ \text{m}$
      y $\alpha = 20°$, y en la posterior un único alerón de anchura
      $L = 1{,}8\ \text{m}$ y $\alpha = 15°$.

      En los tres alerones, los flujos que entran tienen una altura de
      $h = 50\ \text{cm}$. Los flujos de salida de los alerones frontales no
      afectan al del trasero, es decir, se pueden analizar de forma
      independiente. Para una velocidad del coche de $200\ \text{km/h}$,
      calcular:

      a) La fuerza horizontal y vertical por efecto del aire en cada alerón.

      b) ¿Qué pérdida de potencia se produce en el coche al circular a esa
      velocidad con los alerones descritos?

      Datos: $\rho_{\text{aire}} = 1{,}2\ \text{kg/m}^{3}$. Se desprecia la
      fricción del coche con el suelo y con el aire.
    pide: Las fuerzas en cada alerón y la potencia que cuestan.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede tratar un alerón como un álabe fijo, si el coche
          se mueve?
        opciones:
          - texto: >-
              Porque el problema se plantea en el sistema del coche: ahí el
              alerón está quieto y es el aire el que llega a 200 km/h
            correcta: true
            mensaje: |
              Eso es, y el enunciado lo dice explícitamente en su nota. Es un
              cambio de sistema de referencia inercial: las fuerzas son las
              mismas y el álabe queda fijo, que es el caso con fórmula sencilla.
          - texto: >-
              Porque los alerones no giran, y solo los álabes que giran son
              móviles
            mensaje: |
              «Móvil» en el sentido del tema 15 significa que el álabe se
              desplaza **respecto del chorro**, gire o no. Un álabe montado en
              un carro que avanza en línea recta también es móvil.
          - texto: >-
              Porque el aire es un gas y la fórmula del álabe solo vale para
              líquidos
            mensaje: |
              La fórmula sale del teorema de la cantidad de movimiento, que no
              distingue líquidos de gases. Lo único que hay que respetar es
              que la densidad sea aproximadamente constante, y a 200 km/h el
              Mach vale $0{,}16$: de sobra.

      - tipo: calcular
        titulo: La fuerza vertical de un alerón delantero
        pregunta: |
          ¿Qué fuerza vertical produce **cada** alerón delantero?
        respuesta:
          tipo: magnitud
          valor: '601.7 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1759 n'
            mensaje: |
              Ese es el flujo de cantidad de movimiento $\rho Q v$ sin
              proyectar. La componente vertical lleva $\sin 20°$.
          - valor: '106.1 n'
            mensaje: |
              Esa es la componente **horizontal**, que lleva
              $1 - \cos 20°$. Con ángulos pequeños la vertical es mucho mayor
              que la horizontal, y esa es toda la gracia de un alerón.
        pista: |
          $Q = v\,L\,h$ por alerón, y $F_y = \rho Q v\sin\alpha$.
        desarrollo: |
          $$
          v = 200\ \text{km/h} = 55{,}56\ \text{m/s}
          \qquad
          Q = 55{,}56\cdot 0{,}95\cdot 0{,}5 = 26{,}39\ \text{m}^{3}/\text{s}
          $$
          $$
          \rho Q v = 1{,}2\cdot 26{,}39\cdot 55{,}56 = 1759\ \text{N}
          $$
          $$
          F_y = 1759\,\sin 20° = 601{,}7\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza horizontal de un alerón delantero
        pregunta: |
          ¿Y la horizontal?
        respuesta:
          tipo: magnitud
          valor: '106.1 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '601.7 n'
            mensaje: |
              Esa es la vertical. La horizontal lleva $1-\cos\alpha$, que con
              $20°$ vale $0{,}060$ frente al $0{,}342$ del seno: casi seis
              veces menos.
          - valor: '1653 n'
            mensaje: |
              Has usado $\cos 20°$ en vez de $1 - \cos 20°$. La fuerza
              horizontal es la **variación** de cantidad de movimiento en esa
              dirección, no la de salida.
        pista: |
          $F_x = \rho Q v\,(1-\cos\alpha)$.
        desarrollo: |
          $$
          F_x = 1759\,(1-\cos 20°) = 1759\cdot 0{,}0603 = 106{,}1\ \text{N}
          $$

      - tipo: calcular
        titulo: El alerón trasero
        pregunta: |
          ¿Qué fuerza vertical produce el alerón trasero?
        respuesta:
          tipo: magnitud
          valor: '862.7 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3333 n'
            mensaje: |
              Ese es $\rho Q v$ sin proyectar. Falta el $\sin 15°$.
          - valor: '1203 n'
            mensaje: |
              Esa es la suma de los dos alerones delanteros. El trasero es uno
              solo, pero casi el doble de ancho, y aun así da menos que los dos
              de delante juntos porque su ángulo es menor.
        pista: |
          El mismo cálculo con $L = 1{,}8$ m y $\alpha = 15°$.
        desarrollo: |
          $$
          Q = 55{,}56\cdot 1{,}8\cdot 0{,}5 = 50{,}0\ \text{m}^{3}/\text{s}
          \qquad
          \rho Q v = 3333\ \text{N}
          $$
          $$
          F_y = 3333\,\sin 15° = 862{,}7\ \text{N}
          \qquad
          F_x = 3333\,(1-\cos 15°) = 113{,}6\ \text{N}
          $$

      - tipo: calcular
        titulo: La potencia que cuestan
        pregunta: |
          ¿Qué potencia pierde el coche por los tres alerones?
        respuesta:
          tipo: magnitud
          valor: '18.1 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '12.2 kw'
            mensaje: |
              Has contado un solo alerón delantero. Son **dos**, y sus fuerzas
              horizontales se suman a la del trasero.
          - valor: '114.8 kw'
            mensaje: |
              Has usado las fuerzas **verticales**. La potencia perdida es la
              que se opone al avance: fuerza horizontal por velocidad. La
              vertical no hace trabajo porque el coche no sube.
        pista: |
          $P = \left(\sum F_x\right)v$, con las tres fuerzas horizontales.
        desarrollo: |
          $$
          \sum F_x = 2\cdot 106{,}1 + 113{,}6 = 325{,}8\ \text{N}
          $$
          $$
          P = 325{,}8\cdot 55{,}56 = 18\,099\ \text{W} = 18{,}1\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              En el sistema del coche los alerones son álabes **fijos**, y
              vale $F = \rho Q v$ con sus proyecciones.
          - texto: >-
              Cada alerón delantero da 601,7 N hacia abajo y 106,1 de
              resistencia; el trasero, 862,7 y 113,6.
          - texto: >-
              La carga aerodinámica total son 2066 N —más de dos toneladas— y
              cuesta 18,1 kW de potencia.
          - texto: >-
              Como la fuerza vertical es seis veces la horizontal, los
              alerones dan mucho agarre y casi no penalizan.
            trampa: true
            mensaje: |
              «Casi no penalizan» son **18 kW**, unos 25 CV a 200 km/h, y a
              300 serían más del triple, porque la potencia va con el cubo de
              la velocidad. Ese es exactamente el compromiso que define el
              reglaje de un fórmula 1: mucha carga en circuitos revirados y
              poca en los rápidos. La relación seis a uno no dice que sea
              barato, dice cuál es el precio.

    resolucion: |
      **El cambio de sistema de referencia.** El enunciado lo da hecho en su
      nota, pero conviene entender por qué vale: coche moviéndose en aire
      quieto y coche quieto en aire moviéndose son el mismo problema visto
      desde dos sistemas inerciales, y las fuerzas no cambian. En el segundo,
      los alerones son **álabes fijos** y se aplica la fórmula del tema 15 sin
      más.

      **Las fuerzas.** Con $v = 55{,}56$ m/s y $Q = v L h$ en cada alerón:

      | | $L$ | $\alpha$ | $\rho Qv$ | $F_x$ | $F_y$ |
      |---|---|---|---|---|---|
      | delantero (×2) | 0,95 m | 20° | 1759 N | 106,1 N | 601,7 N |
      | trasero | 1,80 m | 15° | 3333 N | 113,6 N | 862,7 N |

      **Lo que hay que mirar en la tabla.** El alerón trasero mueve casi el
      doble de aire que uno delantero, pero su ángulo es menor, así que su
      carga solo supera en un 43 % a la de uno de ellos. Y la resistencia de
      los tres es parecida —106 y 114 N— porque el factor $1-\cos\alpha$ crece
      con el **cuadrado** del ángulo mientras el $\sin\alpha$ crece
      linealmente: es la razón matemática de que un alerón poco inclinado dé
      mucha carga por poca resistencia.

      **La potencia.**

      $$
      P = \left(\sum F_x\right)v = 325{,}8\cdot 55{,}56 = 18{,}1\ \text{kW}
      $$

      Veinticinco caballos a 200 km/h, y la carga aerodinámica que compran son
      2066 N, más de dos toneladas hacia abajo. **Ese es el negocio del
      alerón**: convertir potencia del motor en agarre.

      **Y el detalle que el ejercicio deja para pensar.** El enunciado dice
      que el centro de gravedad está más cerca del eje trasero. Con 1203 N de
      carga delante y 863 detrás, los alerones **reparten al revés** que el
      peso, y eso es deliberado: sirve para equilibrar el coche en curva. El
      dato está puesto para que se vea que el reparto de carga aerodinámica es
      una decisión, no una consecuencia.

  # ── 9 (10 %) · Pitot. El apartado bueno es el último: una avería en la toma
  #    estática no se nota mientras nada cambia, y aparece de golpe cuando el
  #    avión cambia de altura. Es el accidente de Birgenair de 1996 contado
  #    como ejercicio.
  - id: exflu2425-ext-9-el-pitot-del-avion-que-se-bloquea
    titulo: El Pitot del avión, y la avería que no se nota hasta que cambia todo
    fuente: >-
      Ejercicio 9 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Para determinar la velocidad de un avión se emplean un tubo de Pitot y
      un piezómetro abierto, conectados a un manómetro de mercurio. Por
      seguridad, el avión lleva un sistema a cada lado, R y L.

      a) Obtener la ecuación que define la velocidad del avión en función de
      la lectura manométrica $R$.

      b) Calcular la lectura del manómetro cuando el avión vuela a
      $250\ \text{km/h}$ a una altura de $z = 9000\ \text{m}$.

      Durante ese vuelo se bloquea la entrada del piezómetro abierto del
      sistema L, que queda encerrando la presión estática de los 9000 m. El
      sistema R sigue funcionando bien.

      d) Si el avión aterriza con esa avería y se detiene, ¿qué velocidad
      mostrará cada sistema?

      Datos: $p_{\text{tierra}} = 1{,}01\ \text{bar}$;
      $p_{9000\,\text{m}} = 308\ \text{mbar}$;
      $\rho_{\text{aire}}(z=0) = 1{,}2\ \text{kg/m}^{3}$;
      $\rho_{\text{aire}}(z=9000) = 0{,}61\ \text{kg/m}^{3}$.
      Despreciar la compresión del aire dentro del manómetro.
    pide: La ecuación de la velocidad, la lectura a 9000 m y lo que marca cada sistema tras aterrizar averiado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro compara el Pitot con el piezómetro. ¿Qué mide esa
          diferencia?
        opciones:
          - texto: >-
              La presión dinámica $\rho v^{2}/2$: el Pitot da la total y el
              piezómetro la estática, y su diferencia es la parte que
              corresponde a la velocidad
            correcta: true
            mensaje: |
              Eso es, y de ahí sale directamente
              $v = \sqrt{2g(s_m/s_{\text{aire}}-1)R}$. La toma estática es la
              mitad silenciosa del instrumento y la que se avería en el
              apartado d).
          - texto: >-
              La presión atmosférica a la altura de vuelo
            mensaje: |
              Esa la da el piezómetro **solo**, y el avión la usa para el
              altímetro. Lo que mide la diferencia con el Pitot es otra cosa:
              la presión dinámica.
          - texto: >-
              La densidad del aire a esa altura
            mensaje: |
              La densidad hay que conocerla aparte —el enunciado la da— para
              poder pasar de presión dinámica a velocidad. El manómetro solo
              mide una diferencia de presiones.

      - tipo: calcular
        titulo: La lectura a 9000 metros
        pregunta: |
          ¿Cuántos milímetros marca el manómetro de mercurio?
        respuesta:
          tipo: magnitud
          valor: '11.04 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '21.71 mm'
            mensaje: |
              Has usado la densidad del aire a nivel del suelo. A 9000 m es
              casi la mitad, $0{,}61\ \text{kg/m}^{3}$, y la presión dinámica
              baja en la misma proporción.
          - valor: '150.1 mm'
            mensaje: |
              Has usado agua como líquido manométrico. Es mercurio: pesa 13,6
              veces más, y la lectura es 13,6 veces menor.
        pista: |
          $\rho_{\text{aire}}v^{2}/2 = (\gamma_{Hg}-\gamma_{\text{aire}})R$.
        desarrollo: |
          $$
          v = \frac{250}{3{,}6} = 69{,}44\ \text{m/s}
          \qquad
          \frac{\rho v^{2}}{2} = \frac{0{,}61\cdot 69{,}44^{2}}{2}
          = 1471\ \text{Pa}
          $$
          $$
          R = \frac{1471}{13\,600\cdot 9{,}8} = 0{,}01104\ \text{m}
          = 11{,}04\ \text{mm}
          $$

      - tipo: calcular
        titulo: Lo que marca el sistema averiado al aterrizar
        pregunta: |
          Con el avión parado en tierra y el piezómetro L bloqueado a la
          presión de 9000 m, ¿qué velocidad muestra ese sistema?
        respuesta:
          tipo: magnitud
          valor: '342 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0 m/s'
            mensaje: |
              Eso es lo que marca el sistema **sano**, R, y lo que debería
              marcar el averiado. La avería consiste precisamente en que no
              lo hace.
          - valor: '69.4 m/s'
            mensaje: |
              Esa es la velocidad real de vuelo. El sistema averiado no la
              muestra: muestra la que corresponde a una diferencia de
              presiones que ya no significa nada.
        pista: |
          El Pitot mide ahora la presión de tierra y el piezómetro sigue
          encerrando la de 9000 m. Esa diferencia se interpreta como presión
          dinámica.
        desarrollo: |
          $$
          \Delta p = 101\,000 - 30\,800 = 70\,200\ \text{Pa}
          \;\Longrightarrow\;
          R = 0{,}527\ \text{m de mercurio}
          $$
          $$
          v = \sqrt{2g\left(\frac{s_m}{s_{\text{aire}}}-1\right)R}
          = \sqrt{19{,}6\left(\frac{13\,600}{1{,}2}-1\right)0{,}527}
          = 342\ \text{m/s}
          $$

          El sistema R, con su toma estática sana, marca **cero**.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La diferencia entre el Pitot y el piezómetro es la presión
              dinámica, de donde
              $v = \sqrt{2g(s_m/s_{\text{aire}}-1)\,R}$.
          - texto: >-
              A 250 km/h y 9000 m, con $\rho = 0{,}61$, el manómetro marca
              11,04 mm de mercurio.
          - texto: >-
              Con la toma estática bloqueada a la presión de 9000 m, el avión
              parado en tierra muestra 342 m/s en ese sistema y cero en el
              sano.
          - texto: >-
              Como la avería se nota nada más producirse, el piloto puede
              corregirla enseguida.
            trampa: true
            mensaje: |
              Justo al revés, y es lo que el enunciado dice: **mientras la
              altura y la velocidad no cambien, la avería no se nota**,
              porque la presión encerrada coincide con la real. Aparece de
              golpe al cambiar de altitud, es decir en el descenso, cuando el
              piloto tiene menos margen. Ese es el modo de fallo que causó el
              accidente de Birgenair en 1996 y el de Air France 447 en 2009: la
              redundancia de dos sistemas sirve de poco si el piloto no sabe
              **cuál** de los dos miente.

    resolucion: |
      **a) La ecuación.** El Pitot mide la carga total y el piezómetro la
      estática; su diferencia es la presión dinámica. Igualándola a la columna
      manométrica,

      $$
      \frac{\rho_{\text{aire}}v^{2}}{2}
      = (\gamma_m - \gamma_{\text{aire}})R
      \;\Longrightarrow\;
      v = \sqrt{2g\left(\frac{s_m}{s_{\text{aire}}}-1\right)R}
      $$

      **b) La lectura en vuelo.** A 9000 m el aire tiene la mitad de densidad
      que al nivel del mar, así que la presión dinámica de 250 km/h son solo
      1471 Pa: **11 milímetros de mercurio**. Es una lectura pequeñísima, y
      esa es la razón de que los aviones no midan la velocidad real sino la
      *indicada*: lo que el instrumento ve es $\rho v^{2}/2$, no $v$.

      **d) La avería, que es el apartado que importa.** El piezómetro L se
      bloquea a 9000 m encerrando 308 mbar. Mientras el avión siga a esa
      altura y velocidad no pasa nada: la presión encerrada es la que habría
      de todos modos. Pero al aterrizar, el Pitot ve la presión de tierra
      —1,01 bar— y el piezómetro sigue en 308 mbar:

      $$
      \Delta p = 70{,}2\ \text{kPa}
      \;\Longrightarrow\;
      R = 52{,}7\ \text{cm de mercurio}
      \;\Longrightarrow\;
      v = 342\ \text{m/s}
      $$

      **El avión, parado en la pista, indica 1231 km/h en un sistema y cero en
      el otro.**

      **Por qué esto no es un ejercicio de laboratorio.** Es el modo de fallo
      de los tubos de Pitot y de las tomas estáticas, y ha causado accidentes
      reales: Birgenair 301 en 1996 —toma de Pitot obstruida por un nido de
      avispas— y Air France 447 en 2009 —sondas heladas—. En los dos casos los
      instrumentos no fallaron a la vez ni de forma evidente: dieron lecturas
      **contradictorias entre sí**, que es lo que este apartado reproduce. La
      redundancia detecta el fallo; lo que no hace es decir cuál de los dos
      sistemas es el bueno.
