      <figcaption>La instalación del ejercicio 3, redibujada: el depósito y sus dos manómetros dentro de la cámara C, el tubo en U que une la cámara con el exterior y el barómetro, fuera.</figcaption>
      </figure>
    pide: La lectura de un manómetro absoluto en el punto de A, si B mide absolutas o manométricas, y las alturas x e y.

    pasos:
      - tipo: reconocer
        pregunta: |
          A la derecha de la cámara hay un tubo en U con una rama unida a la
          cámara y la otra abierta al exterior, y el líquido está más alto en
          la rama de la cámara. ¿Qué dice eso?
        opciones:
          - texto: >-
              Que la cámara C está en depresión: su presión es menor que la de
              fuera en $s_m R = 1{,}6$ mca, y por eso tira del líquido hacia su
              rama
            correcta: true
            mensaje: |
              Eso es. El líquido sube por la rama de **menor** presión, y
              $8\cdot 0{,}2 = 1{,}6$ mca es lo que le falta a la cámara para
              llegar a la atmósfera. Esa depresión es la pieza que hace salir
              los 10,43 mca impresos.
          - texto: >-
              Que la cámara está en sobrepresión, 1,6 mca por encima de la
              atmósfera
            mensaje: |
              Es al revés: el líquido sube por la rama de menor presión. Si la
              cámara empujara más que la atmósfera, bajaría el líquido de su
              rama y subiría el de la abierta. Con sobrepresión, D marcaría
              13,63 mca.
          - texto: >-
              Nada que haga falta: el barómetro ya da la presión de la cámara
            mensaje: |
              El barómetro está **fuera** de la cámara, y mide la atmósfera
              del exterior. La de la cámara es otra, y la da el tubo en U.
              Sumando A a la atmósfera de fuera salen 12,03 mca, y el examen
              publica 10,43.

      - tipo: calcular
        titulo: La presión absoluta de la cámara
        pregunta: |
          Con el barómetro a $760$ mmHg y el tubo en U, ¿qué presión absoluta
          hay dentro de la cámara C, en mca?
        respuesta:
          tipo: magnitud
          valor: '8.736 mca'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '11.936 mca'
            mensaje: |
              Has sumado el desnivel del tubo en U en vez de restarlo. El
              líquido está más alto en la rama de la cámara: la cámara está
              **por debajo** de la atmósfera.
          - valor: '10.136 mca'
            mensaje: |
              Has restado los 0,2 m del desnivel como si fueran de agua. Son
              de un líquido de $s_m = 8$: $0{,}2\cdot 8 = 1{,}6$ mca.
        pista: |
          $p_{atm} = 0{,}76\cdot 13{,}6$ mca, y a eso se le resta $s_m R$.
        desarrollo: |
          $$
          p_{atm} = 0{,}76\cdot 13{,}6 = 10{,}336\ \text{mca}
          \qquad
          p_C = 10{,}336 - 8\cdot 0{,}2 = 8{,}736\ \text{mca (abs)}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro absoluto D
        pregunta: |
          ¿Qué marcaría un manómetro de presiones absolutas conectado en el
          punto de A?
        respuesta:
          tipo: magnitud
          valor: '10.43 mca'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '12.03 mca'
            mensaje: |
              Has sumado la lectura de A a la atmósfera de **fuera**. A está
              dentro de la cámara y mide contra ella: lo que se le suma es la
              presión de la cámara, 8,736 mca.
          - valor: '7.042 mca'
            mensaje: |
              Has tomado la lectura de A como un vacío: $8{,}736 - 1{,}694 =
              7{,}04$ mca. El enunciado la da como presión relativa, positiva:
              el punto de A está **por encima** de la presión de la cámara.
          - valor: '13.63 mca'
            mensaje: |
              Has puesto la cámara en sobrepresión. En el tubo en U el líquido
              está más alto en la rama de la cámara: está en depresión.
        pista: |
          A mide contra lo que tiene alrededor, que es la cámara.
        desarrollo: |
          $$
          \frac{p_A}{\gamma} = \frac{1{,}66\cdot 10^{4}}{9800} = 1{,}694\ \text{mca}
          \qquad
          p_D = 8{,}736 + 1{,}694 = 10{,}43\ \text{mca}
          $$

      - tipo: calcular
        titulo: La diferencia entre B y A si B midiera absolutas
        pregunta: |
          Suponiendo que B midiera presiones absolutas, ¿cuánto más que en el
          punto de A habría en el de B, en mca?
        respuesta:
          tipo: magnitud
          valor: '0.87 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '9.606 mca'
            mensaje: |
              Esa es la diferencia si B es **manométrico**: las dos lecturas
              contra la cámara, restadas. Sirve para el apartado c), pero aquí
              se prueba la otra hipótesis.
          - valor: '11.3 mca'
            mensaje: |
              Es la lectura de B, pero la pregunta es la diferencia con el
              punto de A, que en absolutas está a 10,43 mca.
        pista: |
          En absolutas, B marcaría $11{,}3$ mca, y el punto de A está a
          $10{,}43$.
        desarrollo: |
          $$
          11{,}3 - 10{,}43 = 0{,}87\ \text{mca}
          $$

          Entre la tapa y B hay $H - h_0 = 1{,}4$ m de líquidos de $s = 4$ y
          $s = 9$, que pesan como poco $1{,}4\cdot 4 = 5{,}6$ mca. No caben en
          0,87: **B no puede medir absolutas**.

      - tipo: calcular
        titulo: La altura y de la capa inferior
        pregunta: |
          Con B manométrico, ¿cuánto mide la capa del líquido de $s_2$?
        respuesta:
          tipo: magnitud
          valor: '90.12 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '122.12 cm'
            mensaje: |
              Has leído B contra la atmósfera de fuera. B está dentro de la
              cámara, igual que A, y mide contra ella.
          - valor: '72.12 cm'
            mensaje: |
              Te has dejado $h_0$. B no está en el fondo: está 10 cm por
              encima, así que la capa de $s_2$ que queda sobre él es
              $y - 0{,}1$.
        pista: |
          Las dos lecturas son contra la misma cámara: su diferencia es lo que
          pesan los líquidos entre A y B. Y $x + y = H$.
        desarrollo: |
          $$
          11{,}3 - 1{,}694 = 4x + 9\,(y - 0{,}1)
          \qquad
          x + y = 1{,}5
          $$
          $$
          9{,}606 = 6 + 5y - 0{,}9
          \;\Longrightarrow\;
          y = 0{,}9012\ \text{m} = 90{,}12\ \text{cm}
          $$

      - tipo: calcular
        titulo: La altura x de la capa superior
        pregunta: |
          ¿Y la capa del líquido de $s_1$?
        respuesta:
          tipo: magnitud
          valor: '59.88 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '27.88 cm'
            mensaje: |
              Sale de leer B contra la atmósfera de fuera. B está dentro de la
              cámara, igual que A, y mide contra ella.
          - valor: '77.88 cm'
            mensaje: |
              Sale de dejarse $h_0$: la capa de $s_2$ que queda sobre B es
              $y - 0{,}1$, no $y$.
        pista: |
          $x = H - y$.
        desarrollo: |
          $$
          x = 1{,}5 - 0{,}9012 = 0{,}5988\ \text{m} = 59{,}88\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El barómetro está fuera de la cámara y marca la atmósfera del
              exterior: 760 mmHg son 10,336 mca.
          - texto: >-
              En el tubo en U el líquido está más alto en la rama de la
              cámara: C está 1,6 mca por debajo de la atmósfera, a 8,736 mca
              absolutos.
          - texto: >-
              A mide contra la cámara, que es lo que tiene alrededor: el punto
              de A está a 8,736 + 1,694 = 10,43 mca absolutos, y eso marcaría
              D.
          - texto: >-
              Si B midiera absolutas, entre la tapa y B habría 0,87 mca, y
              1,4 m de líquidos de $s = 4$ o más pesan por lo menos 5,6: B es
              manométrico, y mide contra la cámara.
          - texto: >-
              Y como A y B están en la cámara, las alturas $x$ e $y$ dependen de
              cuánta depresión haya en ella.
            trampa: true
            mensaje: |
              No dependen. Las dos lecturas son contra la misma cámara, y al
              restarlas su presión se va: $11{,}3 - 1{,}694 = 9{,}606$ mca es
              lo que pesan las dos capas entre A y B, haya en la cámara lo que
              haya. La cámara hace falta para a) y para descartar en b) que B
              mida absolutas; para c), no.

    resolucion: |
      **La figura manda.** El enunciado habla de «los manómetros mostrados en
      la imagen», y la imagen trae tres cosas que el texto no dice: A y B están
      **dentro** de una cámara C, la cámara está unida a un tubo en U cuya
      otra rama da al exterior, y el barómetro está **fuera**. Hay tres
      referencias de presión, y cada aparato mide contra la suya.

      **La atmósfera y la cámara.** El barómetro marca $a = 760$ mmHg, así que
      $p_{atm} = 0{,}76\cdot 13{,}6 = 10{,}336$ mca. En el tubo en U el líquido
      está más alto en la rama de la cámara: la cámara está en **depresión**.

      $$
      p_C = p_{atm} - s_m R = 10{,}336 - 8\cdot 0{,}2 = 8{,}736\ \text{mca (abs)}
      $$

      **a) El manómetro absoluto D.** A es un manómetro de esfera metido en la
      cámara, y mide contra lo que tiene alrededor, que es C, no la atmósfera.
      Su lectura, $1{,}66\cdot 10^{4}/9800 = 1{,}694$ mca, se suma a la de la
      cámara:

      $$
      p_D = 8{,}736 + 1{,}694 = 10{,}43\ \text{mca}
      $$

      Sin el tubo en U —sumando A a la atmósfera de fuera— salen 12,03, que no
      es lo impreso.

      **b) El manómetro B.** Si midiera absolutas, entre la tapa y B habría
      $11{,}3 - 10{,}43 = 0{,}87$ mca. Pero entre la tapa y B hay
      $H - h_0 = 1{,}4$ m de líquidos de $s = 4$ y $s = 9$, que pesan como poco
      $1{,}4\cdot 4 = 5{,}6$ mca. No puede ser: **B es manométrico**, y como A,
      mide contra la cámara.

      **c) Las dos capas.** Las lecturas de A y de B son contra la misma
      cámara, así que su diferencia es lo que pesan los líquidos entre los dos
      puntos, y la presión de C se cancela:

      $$
      11{,}3 - 1{,}694 = 4x + 9\,(y - 0{,}1)
      \qquad
      x + y = 1{,}5
      $$
      $$
      y = 90{,}12\ \text{cm}
      \qquad
      x = 59{,}88\ \text{cm}
      $$

      **Por qué la cámara cuenta en un apartado y en otro no.** Es la
      propiedad de los manómetros de esfera que el tema 4 explica con el
      Bourdon: miden contra lo que baña su caja. Para a) eso importa, porque
      se pide una absoluta y hay que saber qué hay alrededor de A. Para c) no,
      porque A y B tienen alrededor lo mismo y se resta.

  # ── 4 (7,5 %) · Análisis dimensional en su forma más pura: cuatro
  #    variables, una de ellas ya adimensional, y el resultado es la fórmula
  #    del vertedero triangular que el tema 13 usa sin demostrar.
  - id: exflu2425-ext-4-el-vertedero-en-v-por-analisis-dimensional
    titulo: El vertedero en V, deducido sin resolver ninguna integral
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea analizar el funcionamiento hidráulico de un vertedero en V de
      un río mediante un modelo a escala reducida. Se ha determinado que el
      caudal ($Q$) que pasa por el vertedero depende de las siguientes
      variables: nivel de agua en el vertedero ($H$), ángulo del vertedero
      ($\alpha$) y aceleración de la gravedad ($g$).

      Determinar las variables adimensionales que describen el proceso.
      Indicar claramente el procedimiento empleado y los pasos seguidos.
    pide: Los parámetros adimensionales del vertedero triangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          Una de las cuatro variables ya es adimensional. ¿Cómo entra eso en
          el teorema $\pi$?
        opciones:
          - texto: >-
              El ángulo es un $\pi$ por sí mismo, y las tres restantes con dos
              magnitudes fundamentales —longitud y tiempo— dan uno más: dos en
              total
            correcta: true
            mensaje: |
              Exacto. Una variable ya adimensional se lleva su propio
              parámetro sin hacer nada, y no puede entrar como repetida
              —no aporta ninguna dimensión que cancelar—.
          - texto: >-
              Se descarta, porque el teorema $\pi$ solo trabaja con variables
              dimensionales
            mensaje: |
              No se descarta: el fenómeno depende del ángulo, y una relación
              que no lo contenga estaría incompleta. Lo que ocurre es que
              entra directamente como $\pi_1 = \alpha$.
          - texto: >-
              Cuenta como una magnitud fundamental más, así que quedan tres
              parámetros
            mensaje: |
              Las magnitudes fundamentales aquí son dos —longitud y tiempo—,
              porque no aparece la masa por ningún sitio: ni densidad ni
              viscosidad ni fuerza. Un ángulo no es una magnitud fundamental.

      - tipo: calcular
        titulo: Cuántos parámetros
        pregunta: |
          ¿Cuántos parámetros adimensionales describen el fenómeno? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el ángulo. Es una variable del problema y también
              un parámetro adimensional: un vertedero de 90° y otro de 60° no
              se comportan igual.
          - valor: '3'
            mensaje: |
              Comprueba las magnitudes fundamentales: $Q$, $H$ y $g$ solo
              contienen longitud y tiempo, no masa. Son cuatro variables menos
              dos, no menos una.
        pista: |
          $n - m$, con $n$ el número de variables y $m$ el de magnitudes
          fundamentales que **aparecen de verdad**.
        desarrollo: |
          Variables: $Q$, $H$, $\alpha$, $g$. Dimensiones:

          $$
          [Q] = L^{3}T^{-1}
          \qquad
          [H] = L
          \qquad
          [g] = LT^{-2}
          \qquad
          [\alpha] = 1
          $$

          Solo intervienen $L$ y $T$, así que $m = 2$ y salen
          $4 - 2 = 2$ parámetros.

      - tipo: calcular
        titulo: El exponente del calado
        pregunta: |
          En $\pi_2 = Q\,H^{a}g^{b}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-2.5'
          tolerancia: 0.05
          formato: un número con su signo
        distractores:
          - valor: '-1.5'
            mensaje: |
              Ese es el exponente del vertedero **rectangular**, donde la
              anchura es constante y no depende de $H$. En el triangular la
              anchura crece con el calado y aparece una potencia más.
          - valor: '-2'
            mensaje: |
              Comprueba con las dimensiones: $Q$ lleva $L^{3}$ y $g^{-1/2}$
              aporta $L^{-1/2}$, así que hacen falta $L^{-5/2}$ de $H$ para
              cancelarlo todo.
        pista: |
          Impón $L$ y $T$ a cero por separado. El tiempo fija $b$ y después
          la longitud fija $a$.
        desarrollo: |
          $$
          [\pi_2] = (L^{3}T^{-1})(L)^{a}(LT^{-2})^{b} = L^{0}T^{0}
          $$
          $$
          T:\; -1 - 2b = 0 \;\Rightarrow\; b = -\tfrac{1}{2}
          \qquad
          L:\; 3 + a + b = 0 \;\Rightarrow\; a = -\tfrac{5}{2}
          $$
          $$
          \pi_2 = \frac{Q}{H^{5/2}\sqrt{g}}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          Ahora el ejercicio entero en papel, como lo entregarías: el
          enunciado pide «indicar claramente el procedimiento empleado y los
          pasos seguidos», y eso es lo que se corrige, no los dos grupos del
          final. Las variables con su tabla de dimensiones, cuántos grupos
          salen y por qué, las repetidas que eliges, el despeje de $\pi_2$ y
          la comprobación. Media cara.
        rubrica: adimensionales-por-buckingham
        veredicto: |
          Si tu folio tiene todos los mínimos, tienes el procedimiento que
          pide el enunciado. Si has llegado a los mismos dos grupos sin la
          tabla de dimensiones, el resultado está bien y el ejercicio no: es
          justo lo que la frase del enunciado dice que se mira.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuatro variables y dos magnitudes fundamentales —solo $L$ y
              $T$— dan dos parámetros.
          - texto: >-
              El ángulo es uno de ellos por sí mismo, $\pi_1 = \alpha$.
          - texto: >-
              El otro es $\pi_2 = Q/(H^{5/2}\sqrt g)$, de donde
              $Q = \phi(\alpha)\,H^{5/2}\sqrt g$.
          - texto: >-
              Y como el análisis dimensional ha dado la fórmula del vertedero
              triangular, ya no hace falta ensayarlo.
            trampa: true
            mensaje: |
              El análisis dimensional ha dado la **forma** —la potencia
              $5/2$— pero no la función $\phi(\alpha)$, que es donde vive el
              coeficiente de desagüe. Ese sigue saliendo del ensayo. Lo que sí
              ha conseguido es reducir el trabajo experimental de tres
              variables a una: basta con medir $\phi$ para cada ángulo, en vez
              de barrer calados y gravedades.

    resolucion: |
      **Cuatro variables, dos magnitudes.** $Q$, $H$, $\alpha$ y $g$. Como no
      aparece ni la densidad ni la viscosidad ni ninguna fuerza, **la masa no
      interviene**: solo $L$ y $T$. De ahí $4 - 2 = 2$ parámetros.

      **El primero es gratis.** El ángulo ya es adimensional:
      $\pi_1 = \alpha$.

      **El segundo.** Tomando $H$ y $g$ como repetidas,

      $$
      \pi_2 = \frac{Q}{H^{5/2}\sqrt g}
      $$

      **Y de ahí sale la fórmula del tema 13.**

      $$
      Q = \phi(\alpha)\,\sqrt g\,H^{5/2}
      $$

      que es exactamente la estructura de
      $Q = \frac{8}{15}C_d\sqrt{2g}\tan\frac{\alpha}{2}H^{5/2}$: la potencia
      $5/2$, la raíz de $g$, y todo lo demás metido en una función del
      ángulo. **El análisis dimensional ha deducido en tres líneas la forma
      que en el tema 13 costó una integral**, y sin decir nada del coeficiente
      de desagüe, que sigue siendo experimental.

      **Lo que este ejercicio enseña sobre el método.** Es el caso más limpio
      posible: no hay que elegir entre Reynolds y Froude, no hay conflicto de
      semejanza, no hay nada que discutir. Sirve para ver el teorema $\pi$
      haciendo lo único que sabe hacer —decir cuántos números hay y cuáles
      son— y para ver que eso, solo, ya vale mucho.

  # ── 5 (15 %) · Bombeo en paralelo. Y el detalle que decide el ejercicio:
  #    los 1,46 «mca» de pérdida hay que pasarlos a columna de petróleo. Sin
  #    esa conversión salen 63,9 l/s en vez de 69,4, un 8 % de error que no
  #    se delata solo.
  - id: exflu2425-ext-5-el-bombeo-de-petroleo-en-el-desierto
    titulo: Dos bombas en paralelo, y unos metros de columna que no son de agua
    fuente: >-
      Ejercicio 5 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea diseñar una instalación de bombeo de petróleo crudo
      ($s = 0{,}86$) en el desierto. La instalación bombeará petróleo del pozo
      al depósito, para su posterior transporte por gravedad. El diseño del
      bombeo se realizará mediante el esquema de la figura, con los diámetros
      y longitudes de la tabla para las tuberías. Se utilizarán dos bombas de
      forma habitual (2 y 4), la tercera (3) es para el caso de que alguna de
      las otras dos se averíe, por lo que será diferente. Todos los tubos son
      de hierro fundido y en el desierto la temperatura media se estima en
      30 ºC durante el funcionamiento de las bombas.

      | Conducto | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | Longitud (m) | 10 | 5 | 3 | 5 | 400 |
      | Diámetro (mm) | 200 | 100 | ? | 100 | 300 |

      a) Calcular el caudal bombeado por la instalación si se conoce que las
      pérdidas de carga del tramo 5 son de $1{,}46\ \text{mca}$. La longitud
      equivalente de los diferentes elementos situados en ese tramo
      (tubería 5) es de $27\ \text{m}$.

      b) Calcular la potencia bruta de cada una de las bombas de los tramos 2
      y 4 (ambas son iguales y bombean el caudal total de la instalación) si
      el rendimiento de las bombas es de $0{,}88$.

      **Notas nuestras.** La figura es el esquema de la instalación. La lámina
      del pozo está en la cota 120 y la del depósito en la 530. Del pozo sale
      la tubería 1 hasta un nudo del que parten las tres bombas en paralelo
      —la 2 arriba, la 3 en medio y la 4 abajo—, que se juntan en otro nudo;
      de ahí sale la tubería 5, que sube hasta el depósito.
    notas:
      - >-
        **Nota 1**: $\nu_{\text{petr}}$ (30 ºC) =
        $7{,}0\cdot 10^{-6}\ \text{m}^{2}/\text{s}$ para el petróleo. Las
        iteraciones se realizarán únicamente cuando sean imprescindibles.
      - >-
        **Nota 2**: No existe flujo en el conducto 3 mientras la bomba 3 no
        esté en marcha.
    pide: El caudal bombeado y la potencia bruta de cada bomba.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la pérdida del tramo 5 en **mca**, y por la tubería
          circula petróleo de $s = 0{,}86$. ¿Se puede meter ese número tal
          cual en Darcy-Weisbach?
        opciones:
          - texto: >-
              No: Darcy-Weisbach da alturas de columna **del fluido que
              circula**, así que hay que dividir entre $0{,}86$ y usar
              $1{,}70$ m de columna de petróleo
            correcta: true
            mensaje: |
              Exacto, y es el detalle que decide el ejercicio. Meter 1,46 tal
              cual da 63,9 l/s en vez de 69,4: un 8 % de error que no se
              delata por ningún lado.
          - texto: >-
              Sí: una pérdida de carga es una altura y no depende del fluido
            mensaje: |
              Una pérdida de carga es una altura **de la columna del propio
              fluido**. Decir «1,46 mca» es dar una presión disfrazada de
              altura, y para volver a altura hay que dividir entre el peso
              específico correcto.
          - texto: >-
              No: hay que multiplicar por $0{,}86$, porque el petróleo pesa
              menos
            mensaje: |
              El sentido está al revés. La misma presión, en un líquido más
              ligero, son **más** metros de columna: $1{,}46/0{,}86 = 1{,}70$.

      - tipo: calcular
        titulo: La pérdida en columna de petróleo
        pregunta: |
          ¿A cuántos metros de columna de petróleo equivalen los
          $1{,}46\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '1.698 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '1.46 m'
            mensaje: |
              Ese es el dato sin convertir. «mca» son metros de columna de
              **agua**: una unidad de presión. En columna de petróleo son
              más metros, porque el petróleo pesa menos.
          - valor: '1.256 m'
            mensaje: |
              Has multiplicado por $0{,}86$ en vez de dividir. Comprueba el
              sentido: un líquido más ligero necesita una columna **más alta**
              para dar la misma presión.
        pista: |
          $h_{\text{petróleo}} = h_{\text{agua}}\,\gamma_{\text{agua}}/
          \gamma_{\text{petróleo}}$.
        desarrollo: |
          $$
          h = \frac{1{,}46}{0{,}86} = 1{,}698\ \text{m de columna de petróleo}
          $$

      - tipo: calcular
        titulo: El caudal bombeado
        pregunta: |
          ¿Qué caudal mueve la instalación?
        respuesta:
          tipo: magnitud
          valor: '69.4 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '63.9 l/s'
            mensaje: |
              Has usado los $1{,}46$ mca sin convertir a columna de petróleo.
              Es un 8 % de error, y el resultado sigue pareciendo razonable:
              por eso la conversión hay que hacerla siempre, no solo cuando el
              número «canta».
          - valor: '71.9 l/s'
            mensaje: |
              Te has dejado los 27 m de longitud equivalente del tramo 5. La
              longitud de cálculo es $400 + 27 = 427$ m.
        pista: |
          Tipo II sobre el tramo 5: la pérdida es dato, así que se forma
          $Re\sqrt f$ sin conocer la velocidad. Hierro fundido,
          $\varepsilon = 0{,}026$ cm.
        desarrollo: |
          $$
          \sqrt f\,v = \sqrt{\frac{1{,}698\cdot 0{,}3\cdot 19{,}6}{427}}
          = 0{,}1529
          \qquad
          Re\sqrt f = \frac{0{,}1529\cdot 0{,}3}{7\cdot 10^{-6}} = 6553
          $$
          $$
          \frac{\varepsilon}{D} = 8{,}67\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0243
          \;\Longrightarrow\;
          v = 0{,}982\ \text{m/s}
          $$
          $$
          Q = 0{,}982\cdot\frac{\pi\,0{,}3^{2}}{4} = 69{,}4\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La potencia bruta de cada bomba
        pregunta: |
          ¿Qué potencia bruta necesita cada una de las dos bombas?
        respuesta:
          tipo: magnitud
          valor: '137.4 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '274.7 kw'
            mensaje: |
              Esa es la potencia total de la instalación. Son **dos** bombas
              repartiéndose el caudal: cada una mueve la mitad con la misma
              altura, así que cada una consume la mitad.
          - valor: '120.9 kw'
            mensaje: |
              Te has dejado el rendimiento. Los $0{,}88$ convierten la
              potencia útil en la bruta, y siempre dividiendo.
        pista: |
          Altura total: los 410 m de desnivel más las pérdidas de los tramos
          1, 2 y 5. Después $P = \gamma QH/\eta$, y a repartir entre dos.
        desarrollo: |
          | tramo | $Q$ | $D$ | $v$ | $h_f$ |
          |---|---|---|---|---|
          | 1 | 69,4 l/s | 200 mm | 2,21 m/s | 0,31 m |
          | 2 (o 4) | 34,7 l/s | 100 mm | 4,42 m/s | 1,36 m |
          | 5 | 69,4 l/s | 300 mm | 0,98 m/s | 1,70 m |

          $$
          H = 410 + 0{,}31 + 1{,}36 + 1{,}70 = 413{,}4\ \text{m}
          $$
          $$
          P_{\text{total}} = \frac{0{,}86\cdot 9800\cdot 0{,}0694\cdot 413{,}4}
          {0{,}88} = 274{,}7\ \text{kW}
          \;\Longrightarrow\;
          137{,}4\ \text{kW cada una}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 1,46 mca del tramo 5 son 1,70 m de columna de petróleo, y
              con ellos y los 427 m equivalentes salen 69,4 l/s.
          - texto: >-
              El caudal se reparte entre las dos bombas, así que por los
              tramos 2 y 4 pasan 34,7 l/s cada uno.
          - texto: >-
              La altura total son los 410 m de desnivel más 3,4 de pérdidas, y
              la potencia bruta, 137,4 kW por bomba.
          - texto: >-
              Las pérdidas de carga son tan pequeñas frente a los 410 m de
              desnivel que se podrían haber despreciado desde el principio.
            trampa: true
            mensaje: |
              Se podrían despreciar **para calcular la potencia** —son un
              0,8 %— pero no para el apartado a), donde son el dato del que
              sale todo el caudal. El enunciado da la pérdida del tramo 5
              precisamente porque no hay curva de bomba: sin ella no habría
              forma de saber cuánto circula. Un término despreciable en un
              balance puede ser el único dato disponible en otro.

    resolucion: |
      **El detalle que decide el ejercicio.** El enunciado da la pérdida del
      tramo 5 en **mca**, y por la tubería circula petróleo. «Metros de
      columna de agua» es una forma de escribir una presión; Darcy-Weisbach
      trabaja en metros de columna **del fluido que circula**. La conversión

      $$
      h = \frac{1{,}46}{0{,}86} = 1{,}70\ \text{m de columna de petróleo}
      $$

      es la diferencia entre 69,4 y 63,9 l/s: un 8 %, y ninguno de los dos
      números resulta sospechoso a simple vista.

      **a) El caudal.** El tramo 5 es un problema de tipo II —la pérdida es
      dato— así que se forma $Re\sqrt f = 6553$ sin conocer la velocidad, se
      entra al ábaco con $\varepsilon/D = 8{,}7\cdot 10^{-4}$ y se despeja:

      $$
      Q = 69{,}4\ \text{l/s}
      $$

      **b) La potencia.** Las dos bombas están en **paralelo**: cada una mueve
      la mitad del caudal, pero las dos tienen que dar la altura completa,
      porque están una al lado de otra entre los mismos dos nudos. La altura
      total son 413,4 m —410 de desnivel y 3,4 de pérdidas— y

      $$
      P = \frac{\gamma Q H}{\eta} = 274{,}7\ \text{kW}
      \;\Longrightarrow\;
      137{,}4\ \text{kW por bomba}
      $$

      **Y por qué la tercera bomba está ahí.** El tramo 3 no lleva caudal
      mientras las otras dos funcionan, y su diámetro ni siquiera se da. Es
      una bomba de reserva, y su existencia cambia el diseño: si tuviera que
      sustituir a **una** de las dos, movería 34,7 l/s a 413 m; si tuviera que
      sustituir a las dos, el doble de caudal, y entonces las pérdidas de los
      tramos estrechos se cuadruplicarían. Por eso el enunciado dice que
      «será diferente».

  # ── 6 (10 %) · Fuerzas sobre superficies, con la vuelta de tuerca del
  #    vacuómetro: la superficie piezométrica queda DENTRO del depósito, y la
  #    fuerza horizontal cambia de signo a media compuerta.
  - id: exflu2425-ext-6-la-compuerta-con-vacuometro
    titulo: La compuerta con vacuómetro, y el plano piezométrico que se hunde
    fuente: >-
      Ejercicio 6 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Si la lectura del vacuómetro de la figura es de
      $0{,}4\ \text{kg/cm}^{2}$, calcular las componentes horizontales y
      verticales de la fuerza hidrostática realizada por un fluido de densidad
      relativa $s = 2$ sobre la compuerta ABCD. La compuerta ABCD está formada
      por dos cuartos de cilindro de radio $R = 1\ \text{m}$ y un prisma de
      sección cuadrada de lado $R = 1\ \text{m}$, siendo el ancho normal a la
      imagen $b = 1{,}2\ \text{m}$.

      **Notas nuestras.** La figura es un depósito cerrado, lleno del fluido
      hasta la tapa, con el vacuómetro encima. La compuerta ABCD es su pared
      derecha, y de arriba abajo la forman un cuarto de cilindro de A a B, la
      cara vertical del prisma de B a C y otro cuarto de cilindro de C a D. A
      está en la esquina de arriba, a la altura de la tapa, y D en la de
      abajo, así que la compuerta mide 3 m de alto. Los dos cuartos de
      cilindro tienen el centro en la pared —el de arriba a la altura de B y
      el de abajo a la de C— y sobresalen hacia el fluido.
    notas:
      - >-
        **NOTA**: A la hora de calcular cualquier fuerza hidrostática, es
        **OBLIGATORIO** dibujar el correspondiente prisma de presiones
        **acotado**.
    pide: Las dos componentes de la fuerza hidrostática sobre la compuerta.

    pasos:
      - tipo: reconocer
        pregunta: |
          El vacuómetro marca $0{,}4\ \text{kg/cm}^{2}$ de **vacío**. ¿Dónde
          queda el plano piezométrico?
        opciones:
          - texto: >-
              Por debajo de la superficie libre: la depresión equivale a
              $2\ \text{m}$ de columna del fluido, así que el plano de
              presión nula está 2 m más abajo que A
            correcta: true
            mensaje: |
              Eso es, y es lo que hace distinto a este ejercicio. Con el plano
              piezométrico hundido, los dos primeros metros de compuerta están
              a presión **negativa**: el fluido tira de ellos hacia dentro en
              vez de empujarlos hacia fuera.
          - texto: >-
              Por encima de la superficie libre, porque un vacuómetro mide
              presión
            mensaje: |
              Un vacuómetro mide **depresión**: presiones por debajo de la
              atmosférica. El plano piezométrico se hunde, no sube. Si
              subiera, todo el prisma de presiones sería positivo y la fuerza
              saldría mucho mayor.
          - texto: >-
              En la propia superficie libre, porque el vacío no afecta a la
              presión del líquido
            mensaje: |
              Afecta a todo el líquido por igual: la presión en cualquier
              punto es la del gas de arriba más $\gamma h$. Bajar la del gas
              baja la de todos los puntos en la misma cantidad.

      - tipo: calcular
        titulo: La profundidad del plano piezométrico
        pregunta: |
          ¿Cuántos metros por debajo de A queda el plano de presión nula?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4 m'
            mensaje: |
              Has dejado la depresión en metros de columna de **agua**:
              $0{,}4\ \text{kg/cm}^{2} = 4$ mca. El fluido tiene $s = 2$, así
              que la misma presión son la mitad de metros de su columna.
          - valor: '0.4 m'
            mensaje: |
              Has confundido $\text{kg/cm}^{2}$ con metros. La equivalencia es
              $1\ \text{kg/cm}^{2} = 10$ mca, así que $0{,}4$ son 4 mca, y en
              columna del fluido, 2 m.
        pista: |
          $0{,}4\ \text{kg/cm}^{2}$ en columna del fluido de $s = 2$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{0{,}4\cdot 9{,}8\cdot 10^{4}}
          {2\cdot 9800} = 2\ \text{m}
          $$

          Y como es **depresión**, el plano piezométrico está 2 m por debajo
          de A, es decir justo en C.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Cuánto vale la resultante horizontal sobre la compuerta?
        respuesta:
          tipo: magnitud
          valor: '35.28 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '105.84 kn'
            mensaje: |
              Has ignorado el vacuómetro y has puesto el plano piezométrico en
              A. Con la depresión, el tramo A–C está a presión negativa y
              resta: la resultante baja a la tercera parte.
          - valor: '17.64 kn'
            mensaje: |
              Has usado el peso específico del **agua**. El fluido tiene
              $s = 2$, así que su $\gamma$ es $19\,600\ \text{N/m}^{3}$.
        pista: |
          Integra el prisma de presiones sobre la proyección vertical de 3 m,
          contando negativo lo que queda por encima del plano piezométrico.
        desarrollo: |
          Con el plano piezométrico en C (2 m por debajo de A), la presión a
          profundidad $z$ vale $\gamma(z-2)$:

          $$
          F_H = \gamma b\int_0^{3}(z-2)\,dz
          = 19\,600\cdot 1{,}2\left[\frac{z^{2}}{2}-2z\right]_0^{3}
          $$
          $$
          = 23\,520\,(4{,}5-6) = -35\,280\ \text{N}
          $$

          El signo negativo dice que la resultante apunta **hacia el interior
          del depósito**: los dos metros en depresión pesan más que el metro
          en presión.

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          ¿Y la resultante vertical?
        respuesta:
          tipo: magnitud
          valor: '60.47 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '23.52 kn'
            mensaje: |
              Has restado las contribuciones de los dos cuartos de cilindro.
              Los dos empujan hacia arriba: el de arriba porque está en
              depresión y el de abajo porque tiene el fluido debajo. Se suman.
          - valor: '36.95 kn'
            mensaje: |
              Solo has contado las dos áreas de cuarto de círculo. En el arco
              superior hay además el rectángulo que va de su cuerda al plano
              piezométrico, y vale $1\ \text{m}^{2}$ más.
        pista: |
          Para cada arco, el volumen de fluido —real o imaginario— entre la
          superficie curva y el plano piezométrico. Los dos empujan hacia
          arriba.
        desarrollo: |
          Arco superior (A–B), con el plano piezométrico 2 m por debajo de A:

          $$
          V_1/b = \int_0^{1}\left(y_{\text{arco}}+2\right)dx
          = 1 + \frac{\pi R^{2}}{4} = 1{,}785\ \text{m}^{2}
          $$

          Arco inferior (C–D), que arranca justo en el plano piezométrico:

          $$
          V_2/b = \frac{\pi R^{2}}{4} = 0{,}785\ \text{m}^{2}
          $$
          $$
          F_V = \gamma b\,(1{,}785 + 0{,}785) = 23\,520\cdot 2{,}571
          = 60{,}47\ \text{kN}\ (\uparrow)
          $$

      - tipo: dibujar
        consigna: |
          El prisma de presiones que la nota hace obligatorio, acotado: el de
          las presiones horizontales sobre la proyección vertical de la
          compuerta, de A a D, y los volúmenes que dan la fuerza vertical
          sobre los dos cuartos de cilindro. Con el plano piezométrico
          dibujado y las dos fuerzas, cada una con su sentido.
        comprueba:
          - punto: >-
              El **plano piezométrico**, 2 m por debajo de A, a la altura de C.
            porque: >-
              Es la referencia de todo el prisma. El vacuómetro marca 4 mca de
              depresión, que en un fluido de $s = 2$ son 2 m de su columna. Si
              el prisma se empieza en A, como en un depósito abierto, salen
              105,84 kN hacia fuera.
          - punto: >-
              El prisma horizontal, un solo triángulo que cambia de signo en C:
              −39,2 kPa en A, cero en C y +19,6 kPa en D.
            porque: >-
              La presión es $\gamma\,(z - 2)$, con $z$ la profundidad bajo A:
              una recta que cruza el cero, no dos prismas distintos. Las tres
              cotas son las que la nota llama «acotado»: sin ellas el dibujo no
              dice cuánto pesa cada parte.
          - punto: >-
              Las dos áreas de signo contrario, y la negativa mayor: 47,04 kN
              hacia el fluido contra 11,76 hacia fuera.
            porque: >-
              Son $\tfrac12\cdot 2\cdot 39{,}2$ y $\tfrac12\cdot 1\cdot 19{,}6$
              kN/m por el ancho de 1,2 m. Restadas dan los 35,28 kN, y el
              sentido lo pone la mayor: hacia el fluido, la «(←)» que imprime
              el examen.
          - punto: >-
              Los volúmenes de la vertical, rayados, los dos dentro de la
              compuerta: bajo el arco de arriba, del arco al plano
              piezométrico; sobre el de abajo, del plano al arco.
            porque: >-
              Son los 1,785 y 0,785 m² que, por $\gamma b$, dan los 60,47 kN.
              Los dos empujan hacia arriba —el de arriba porque está en
              depresión y el fluido tira de él, el de abajo porque tiene el
              fluido debajo—, y dibujarlos es lo que evita restarlos.
          - punto: >-
              Las dos fuerzas con su flecha: 35,28 kN hacia el fluido y
              60,47 kN hacia arriba.
            porque: >-
              El examen las imprime con su sentido, porque el sentido es media
              respuesta: con el vacuómetro, la horizontal va al revés de lo que
              se espera en un depósito.
        figura: |
          <svg viewBox="0 0 480 360" role="img" width="480" height="360" aria-labelledby="flu2425-6-t flu2425-6-d">
            <title id="flu2425-6-t">El prisma de presiones de la compuerta ABCD, con el plano piezométrico en C</title>
            <desc id="flu2425-6-d">A la izquierda, el depósito lleno del fluido de densidad relativa 2 hasta la tapa, con el vacuómetro encima. Su pared derecha es la compuerta: de A, arriba, a B un cuarto de círculo que sobresale hacia el fluido, de B a C una cara vertical y de C a D, abajo, otro cuarto de círculo. Una línea de trazos horizontal a la altura de C, dos metros por debajo de A, es el plano piezométrico, donde la presión es nula. Rayados dentro de la compuerta, los volúmenes de la fuerza vertical: bajo el arco de arriba, desde el arco hasta el plano piezométrico, 1,785 metros cuadrados; sobre el arco de abajo, entre el plano y el arco, 0,785. Una flecha hacia arriba es la fuerza vertical, 60,47 kN. A la derecha, el prisma de las presiones horizontales sobre la proyección vertical de A a D: un triángulo que vale menos 39,2 kilopascales en A, cero en C y más 19,6 en D; la parte negativa, de A a C, es mayor que la positiva, de C a D. Una flecha hacia la izquierda, a la altura de A, es la fuerza horizontal, 35,28 kN hacia el fluido: el momento de las dos partes respecto de A se anula, así que la resultante pasa por A.</desc>
