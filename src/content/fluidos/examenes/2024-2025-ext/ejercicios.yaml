        veredicto: >-
          Si tu papel tiene las dos curvas cortándose en el punto de
          funcionamiento y la nueva arrancando en −3 m, los dos dibujos del
          examen están. Si la nueva te sale paralela a la vieja, has bajado la
          presión y te has olvidado de la válvula.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El destino está 13 m más bajo pero presurizado a 20 m de
              columna: la altura piezométrica es $+7$ m.
          - texto: >-
              A 76,39 l/s la instalación pide 10,76 m, y el NPSH disponible es
              de 11,17 frente a 1,7 requeridos: no cavita.
          - texto: >-
              Al bajar el manómetro a la mitad, la altura piezométrica cae a
              $-3$ m, y para no cambiar el caudal la válvula tiene que
              reponer diez metros: su factor de paso pasa de 6 a 174.
          - texto: >-
              Cerrar la válvula así hace que la bomba consuma más, porque tiene
              que vencer una pérdida mayor.
            trampa: true
            mensaje: |
              La bomba trabaja **en el mismo punto** —ese es el enunciado del
              apartado— así que da el mismo caudal a la misma altura y consume
              exactamente lo mismo. Lo que ha cambiado es en qué se gasta esa
              energía: antes, en vencer la presión del depósito; ahora, en
              calentar el agua dentro de la válvula. **El consumo no sube, pero
              el trabajo útil baja**, y ese es el argumento contra estrangular.

    resolucion: |
      **La rareza del enunciado.** El agua va de la cota 30 a la 17, es decir
      **cuesta abajo**, y aun así hace falta una bomba: el depósito de llegada
      está a 1,96 bar, que son 20 metros de columna. La altura piezométrica
      queda en $-13 + 20 = 7$ m. Es el ejercicio que separa «altura
      geométrica» de «altura piezométrica».

      **a) La curva.** Con hierro forjado ($\varepsilon = 0{,}006$ cm) las
      rugosidades relativas caen en dos bandas distintas del cuadro n.º 25
      —$C_{HW} = 130$ para los 250 mm y $140$ para los 300— y los tres codos
      entran como 6 m de longitud equivalente en la impulsión:

      $$
      H = 7 + 1{,}07\cdot 10^{-3}\,Q^{1{,}852} + 8{,}21\cdot 10^{-5}\,Q^{2}
      $$

      con $H$ en m y $Q$ en l/s. Los tres factores de paso —$0{,}5$ de salida,
      $6$ de válvula y $1$ de entrada— van en el segundo término, cada uno con
      la altura cinética de **su** tramo: la salida con los 250 mm y los otros
      dos con los 300. No es una parábola: el rozamiento va con
      $Q^{1{,}852}$.

      **b) La bomba.** «En torno a 1 m/s» en la impulsión son 70,69 l/s, unos
      255 m³/h, y a ese caudal la instalación pide 10,26 m. Ese punto es el que
      se lleva al anexo 1. Las INP 125/315 y 125/400 son para alturas mucho
      mayores —sus gráficos empiezan en 15 y en 30 m—, y la solución impresa
      escoge la **INP 150/200 con el rodete de 210 mm**, que en esos caudales
      rinde por encima del 80 %.

      **c) El punto de funcionamiento.** Es el corte de esa curva de la bomba
      con la de la instalación: 76,39 l/s y 10,76 m, con $\eta = 80{,}4\ \%$ y
      un $NPSH_{req}$ de 1,7 m, leídos en el anexo. Lo que sí se comprueba aquí
      es que el punto está sobre nuestra curva: $H(76{,}39) = 10{,}76$ m. La
      potencia absorbida no la imprime la solución, y sale de las otras tres:

      $$
      P_{abs} = \frac{\gamma\,Q\,H}{\eta} = 10{,}02\ \text{kW}
      $$

      La velocidad en la impulsión queda en 1,08 m/s: en torno a 1 m/s, como
      pedía el enunciado.

      **d) La cavitación.** La bomba está en la cota 27 y el depósito en la
      30: aspira **en carga**, con tres metros a favor.

      $$
      NPSH_d = 10{,}33 - 0{,}2 + 3 - 1{,}96 = 11{,}17\ \text{m}
      $$

      frente a $1{,}7$ requeridos. No cavita ni de lejos, y el margen es tan
      grande precisamente por esos tres metros de carga: si la bomba se
      hubiera puesto tres metros por encima en vez de por debajo, el margen
      caería a 5,17.

      **e) La válvula.** Bajar el manómetro a la mitad quita 10 m de
      resistencia a la instalación, y su curva cae diez metros. Para que el
      punto de funcionamiento no se mueva, la válvula tiene que reponerlos:

      $$
      k_V = 174
      $$

      **Se cierra**, y de forma brutal: de 6 a 174 son casi treinta veces más
      resistencia. La curva nueva es

      $$
      H = -3 + 1{,}07\cdot 10^{-3}\,Q^{1{,}852} + 1{,}80\cdot 10^{-3}\,Q^{2}
      $$

      que sale de −3 m y corta a la vieja solo en el punto de funcionamiento.

      **Sobre el número publicado.** El examen da $175{,}79$, y sale de cargar
      a la válvula **todo** el término en $Q^{2}$: con la curva impresa,
      $10{,}76 = -3 + 1{,}07\cdot 10^{-3}\,Q^{1{,}852} + k\,v_{imp}^{2}/2g$ da
      $k = 175{,}76$. Así la salida del depósito y la entrada al de llegada
      desaparecen de la curva nueva, y siguen ahí: descontándolas salen 173,8.
      Es un 1,1 %, y la casilla acepta las dos.

  # ── 3 (10 %) · Manómetros, y dónde está la caja de cada uno. Estuvo en
  #    `fuera` hasta el 30 de septiembre de 2026 porque su 10,43 mca no salía
  #    por ninguna lectura. Salía con la figura bien leída: el barómetro está
  #    FUERA de la cámara C, y un tubo en U dice que la cámara está en
  #    depresión (pág. 70 del PDF, mirada a 300 ppp).
  - id: exflu2425-ext-3-la-camara-en-depresion-y-el-manometro-dudoso
    titulo: La cámara en depresión, y el manómetro que nadie sabe cómo mide
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se cuenta con la instalación de depósitos presurizados con los
      manómetros mostrados en la imagen. El manómetro A mide una presión
      relativa de $1{,}66\cdot 10^{4}\ \text{Pa}$, mientras que el manómetro B
      indica una medición de $1{,}13\ \text{kg/cm}^{2}$.

      Un nuevo operario recientemente incorporado en la instalación desconoce
      si el manómetro B mide presiones absolutas o manométricas.

      Partiendo de los datos proporcionados, se pide:

      a) Determinar la medición **en mca** de un manómetro de presiones
      absolutas (D) conectado al mismo punto en el que está conectado el
      manómetro A.

      b) Determinar **de forma justificada** si el manómetro B mide presiones
      manométricas o absolutas.

      c) Calcular los valores de $x$ e $y$ indicados en la figura.

      Datos: $s_1 = 4$; $s_2 = 9$; $H = 1{,}5\ \text{m}$;
      $h_0 = 0{,}1\ \text{m}$; $R = 0{,}2\ \text{m}$; $s_m = 8$;
      $a = 760\ \text{mmcHg}$.

      **Notas nuestras.** Lo que dice la figura y el texto no repite. Dentro
      de una cámara cerrada C hay un depósito de altura $H$ con dos líquidos:
      arriba el de $s_1$, con una altura $x$, y debajo el de $s_2$, con una
      altura $y$. El manómetro A está en la tapa del depósito y el B en su
      pared, a $h_0$ del fondo, y **los dos quedan dentro de la cámara**. La
      cámara se une por un tubo a un manómetro en U que está fuera, con
      líquido de $s_m$ y la otra rama abierta a la atmósfera; en la rama de la
      cámara el líquido está **más alto**, con un desnivel $R$. Y fuera de la
      cámara hay un barómetro de mercurio que marca la columna $a$. *El
      impreso repite «incorporado en en la instalación»; quitamos el «en» que
      sobra.*

