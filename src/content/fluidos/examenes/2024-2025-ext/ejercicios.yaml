          </svg>
        veredicto: >-
          Si tu (3) L tiene el mercurio alto en la rama tapada y tus dos
          dibujos de vuelo están en espejo, has entendido el instrumento, que
          es lo que el ejercicio pregunta con esos dibujos. Si has puesto el
          mercurio alto en la rama del Pitot, repasa qué toma recibe la presión
          mayor.

      - tipo: calcular
        titulo: Lo que marca el sistema averiado al aterrizar
        pregunta: |
          Con el avión parado en tierra y el piezómetro L bloqueado a la
          presión de 9000 m, ¿qué velocidad muestra ese sistema?
        respuesta:
          tipo: magnitud
          valor: '342 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0 m/s'
            mensaje: |
              Eso es lo que marca el sistema **sano**, R, y lo que debería
              marcar el averiado. La avería consiste precisamente en que no
              lo hace.
          - valor: '69.4 m/s'
            mensaje: |
              Esa es la velocidad real de vuelo. El sistema averiado no la
              muestra: muestra la que corresponde a una diferencia de
              presiones que ya no significa nada.
        pista: |
          El Pitot mide ahora la presión de tierra y el piezómetro sigue
          encerrando la de 9000 m. Esa diferencia se interpreta como presión
          dinámica.
        desarrollo: |
          $$
          \Delta p = 101\,000 - 30\,800 = 70\,200\ \text{Pa}
          \;\Longrightarrow\;
          R = 0{,}527\ \text{m de mercurio}
          $$
          $$
          v = \sqrt{2g\left(\frac{s_m}{s_{\text{aire}}}-1\right)R}
          = \sqrt{19{,}6\left(\frac{13\,600}{1{,}2}-1\right)0{,}527}
          = 342\ \text{m/s}
          $$

          El sistema R, con su toma estática sana, marca **cero**.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La diferencia entre el Pitot y el piezómetro es la presión
              dinámica, de donde
              $v = \sqrt{2g(s_m/s_{\text{aire}}-1)\,R}$.
          - texto: >-
              A 250 km/h y 9000 m, con $\rho = 0{,}61$, los dos manómetros
              marcan 11,04 mm de mercurio.
          - texto: >-
              Con la toma estática de L tapada a la presión de 9000 m, el avión
              parado en tierra marca 52,7 cm de mercurio en ese sistema y cero
              en el sano.
          - texto: >-
              Con la ecuación de a) y la densidad de tierra, eso son 342 m/s en
              el sistema averiado, y cero en el otro.
          - texto: >-
              Como la avería se nota nada más producirse, el piloto puede
              corregirla enseguida.
            trampa: true
            mensaje: |
              Justo al revés, y es lo que el enunciado dice: **mientras la
              altura y la velocidad no cambien, la avería no se nota**,
              porque la presión encerrada coincide con la real. Aparece al
              cambiar de altitud, es decir en el descenso, cuando el piloto
              tiene menos margen. Y la redundancia de dos sistemas avisa de que
              algo va mal, pero no dice **cuál** de los dos miente.

    resolucion: |
      **a) Los líquidos en vuelo, y la ecuación.** En vuelo, el Pitot recibe la
      presión total y el piezómetro la estática, así que la rama del Pitot
      empuja más: el mercurio baja en ella y sube en la del piezómetro. En R el
      Pitot es la rama de la izquierda y en L la de la derecha, porque los dos
      miran al morro. La diferencia de presiones es la presión dinámica, e
      igualándola a la columna manométrica,

      $$
      \frac{\rho_{\text{aire}}v^{2}}{2}
      = (\gamma_m - \gamma_{\text{aire}})R
      \;\Longrightarrow\;
      v = \sqrt{2g\left(\frac{s_m}{s_{\text{aire}}}-1\right)R}
      $$

      **b) La lectura en vuelo.** A 9000 m el aire tiene la mitad de densidad
      que al nivel del mar, así que la presión dinámica de 250 km/h son solo
      1471 Pa: **11 milímetros de mercurio**, los mismos en los dos sistemas.
      Es una lectura pequeñísima, y esa es la razón de que los aviones no
      midan la velocidad real sino la *indicada*: lo que el instrumento ve es
      $\rho v^{2}/2$, no $v$.

      **c) Los líquidos en tierra, con la avería.** El piezómetro L se bloquea
      a 9000 m encerrando 308 mbar. Mientras el avión siga a esa altura y
      velocidad no pasa nada: la presión encerrada es la que habría de todos
      modos. Pero al aterrizar y pararse, el Pitot de L ve la presión de la
      pista —1,01 bar, sin presión dinámica— y la rama tapada sigue en
      308 mbar:

      $$
      \Delta p = 70{,}2\ \text{kPa}
      \;\Longrightarrow\;
      R_L = 52{,}7\ \text{cm de mercurio}
      $$

      El mercurio baja en el Pitot y sube en la rama tapada. En R, con las dos
      tomas abiertas a la pista, los meniscos quedan a la misma altura. Un
      cambio de velocidad a la misma altura no delataría la avería: la presión
      encerrada seguiría siendo la estática de verdad. Lo que la delata es
      cambiar de altura.

      **d) Lo que muestra cada sistema.** Con la ecuación de a) y la densidad
      del aire en tierra, el sistema L da

      $$
      v_L = \sqrt{2g\left(\frac{s_m}{s_{\text{aire}}}-1\right)R_L}
      = 342\ \text{m/s}
      $$

      y el R, cero. **El avión, parado en la pista, indica 1231 km/h en un
      sistema y cero en el otro.**

      **Por qué esto no es un ejercicio de laboratorio.** Las tomas de Pitot y
      las estáticas se tapan en la realidad —con hielo, con insectos, con
      cinta olvidada—. En el Birgenair 301, en 1996, se obstruyó un Pitot, y
      en el Air France 447, en 2009, se helaron las sondas: en los dos, los
      sistemas que tenían que coincidir dieron lecturas **contradictorias
      entre sí**, que es el síntoma que este apartado reproduce, aunque aquí
      lo que se tapa es la toma estática y no el Pitot. La redundancia detecta
      el fallo; lo que no hace es decir cuál de los dos sistemas es el bueno.
      El caso de este ejercicio, la toma estática tapada, es el del Aeroperú
      603, en octubre de 1996, con cinta adhesiva olvidada sobre las tomas
      estáticas.
