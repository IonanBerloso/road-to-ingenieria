            <text class="flu2425-6-n" x="66.7" y="151.9" text-anchor="start" fill="var(--flag)">2 m</text>
            <text class="flu2425-6-n" x="172.3" y="183.6" text-anchor="middle" fill="var(--alt)">1,785 m²</text>
            <text class="flu2425-6-n" x="186.5" y="251.3" text-anchor="middle" fill="var(--live)">0,785</text>
            <path class="flu2425-6-fuerza" d="M229.3 180L229.3 108.7"/>
            <path class="flu2425-6-punta" fill="var(--flag)" d="M229.3 108.7L226 116L232.6 116Z"/>
            <text class="flu2425-6-l" x="229.3" y="100.7" text-anchor="middle" fill="var(--flag)">FV</text>
            <path class="flu2425-6-neg" d="M339.8 219.2L339.8 76.6L268.5 76.6Z"/>
            <path class="flu2425-6-pos" d="M339.8 219.2L339.8 290.5L375.5 290.5Z"/>
            <path class="flu2425-6-ref" d="M339.8 297.7L339.8 69.5"/>
            <text class="flu2425-6-n" x="268.5" y="69.6" text-anchor="middle" fill="var(--alt)">−39,2 kPa</text>
            <text class="flu2425-6-n" x="345.8" y="215.2" text-anchor="start" fill="var(--ink)">0</text>
            <text class="flu2425-6-n" x="375.5" y="304.5" text-anchor="middle" fill="var(--live)">+19,6 kPa</text>
            <path class="flu2425-6-fuerza" d="M443.2 76.6L368.3 76.6"/>
            <path class="flu2425-6-punta" fill="var(--flag)" d="M368.3 76.6L375.6 79.9L375.6 73.3Z"/>
            <text class="flu2425-6-l" x="407.6" y="68.6" text-anchor="middle" fill="var(--flag)">FH</text>
            <text class="flu2425-6-l" x="16" y="348" text-anchor="start" fill="var(--ink)">FH = 35,28 kN (←) · FV = 60,47 kN (↑)</text>
          </svg>
        veredicto: >-
          Si tu prisma cruza el cero en C y tus dos volúmenes van hacia arriba,
          las dos cifras salen solas y la nota está cumplida. Si tu prisma
          empieza en cero en A, has dibujado un depósito abierto, y la fuerza
          te sale el triple y hacia el otro lado.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El vacuómetro hunde el plano piezométrico 2 m, justo hasta C.
          - texto: >-
              La horizontal sale $35{,}28$ kN hacia dentro, porque los dos
              metros en depresión superan al metro en presión.
          - texto: >-
              La vertical sale $60{,}47$ kN hacia arriba: los dos cuartos de
              cilindro empujan en el mismo sentido.
          - texto: >-
              Y la componente horizontal apunta hacia dentro porque la
              compuerta está por encima del plano piezométrico en su mayor
              parte, así que la compuerta no necesita anclaje.
            trampa: true
            mensaje: |
              Que la fuerza apunte hacia dentro no la hace inofensiva: son
              35 kN, tres toneladas y media, y el anclaje tiene que
              soportarlos **en ese sentido**. De hecho es el caso peor para
              muchas compuertas, porque suelen diseñarse para que la presión
              las apriete contra su marco: en depresión, el fluido tira de
              ellas hacia dentro y quien las sujeta son los tornillos, no el
              marco.

    resolucion: |
      **La idea del ejercicio.** Un vacuómetro en la parte alta del depósito
      hunde el plano piezométrico. Con $0{,}4\ \text{kg/cm}^{2}$ de depresión
      y un fluido de $s = 2$, se hunde **exactamente 2 m**: justo hasta C, el
      punto donde termina la cara plana y empieza el arco inferior. El
      enunciado está construido para que caiga ahí.

      **La consecuencia.** El prisma de presiones cambia de signo a mitad de
      la compuerta:

      | tramo | profundidad bajo A | presión |
      |---|---|---|
      | A–B (arco superior) | 0 a 1 m | negativa |
      | B–C (cara plana) | 1 a 2 m | negativa |
      | C–D (arco inferior) | 2 a 3 m | positiva |

      **La horizontal.** Integrando sobre los 3 m de proyección vertical, el
      área negativa (dos metros) supera a la positiva (uno):

      $$
      F_H = \gamma b\left[\frac{z^{2}}{2}-2z\right]_0^{3} = -35{,}28\
      \text{kN}
      $$

      es decir **hacia el interior**. Ignorar el vacuómetro daría 105,84 kN
      hacia fuera: no solo el triple, sino en sentido contrario.

      **La vertical.** Aquí los dos arcos empujan **hacia arriba**, aunque por
      motivos distintos. El de abajo, porque tiene el fluido debajo y lo
      empuja hacia arriba —el volumen entre el plano piezométrico y el arco—.
      El de
      arriba, porque está en depresión: la falta de presión sobre su cara
      superior actúa como una succión. Sumando los dos volúmenes,

      $$
      F_V = 60{,}47\ \text{kN}\ (\uparrow)
      $$

      **La comprobación que conviene hacer siempre en estos casos.** Cuando
      aparece un vacuómetro, dibuja el prisma de presiones **antes** de
      integrar nada y marca dónde cruza el cero. Si el cruce cae dentro de la
      compuerta —como aquí— hay dos áreas de signos contrarios, y sumarlas sin
      mirar el signo es el error más caro del tema.

  # ── 7 (12,5 %) · Canales, con una sección compuesta que no está en ninguna
  #    tabla: medio hexágono con un semicírculo encima. Hay que deducir el
  #    área y el perímetro desde la geometría, y ese es todo el ejercicio.
  - id: exflu2425-ext-7-el-tubo-de-hexagono-y-semicirculo
    titulo: Medio hexágono con un semicírculo encima
    fuente: >-
      Ejercicio 7 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      La sección del tubo de hormigón acabado de la figura está formada por
      medio hexágono y medio círculo. Los lados del hexágono tienen una
      longitud $L$ y ángulos de 60° como muestra la figura. La tubería recorre
      una distancia de $10\ \text{km}$, perdiendo $11\ \text{m}$ de altura en
      su trayecto.

      a) Si sólo se utiliza la parte hexagonal de la sección, calcular la
      longitud $L$ exacta para transportar un caudal máximo de
      $2\ \text{m}^{3}/\text{s}$.

      Suponer en adelante que la tubería se ha construido con una longitud
      $L = 1\ \text{m}$. Para minimizar el riesgo de que el conducto entre en
      carga cuando el conducto se llene, se pretende que el tramo superior
      $H$ o berma indicada en la figura sea de $20\ \text{cm}$.

      b) ¿Cuál es el caudal máximo transportable en estas condiciones?

      **Notas nuestras.** En la figura, el medio hexágono va abajo, con el
      lado horizontal de longitud $L$ como solera y los dos lados inclinados
      formando 60° con la horizontal; encima, el semicírculo de radio $R$ se
      apoya sobre la anchura mayor del hexágono, que es su diámetro. La berma
      $H$ va desde la lámina de agua hasta la coronación del semicírculo. El
      coeficiente de Manning del hormigón acabado es $n = 0{,}012$, del
      cuadro n.º 26.
    pide: La longitud L del lado del hexágono y el caudal con la berma de 20 cm.

    pasos:
      - tipo: reconocer
        pregunta: |
          Medio hexágono regular de lado $L$, apoyado sobre uno de sus lados.
          ¿Qué área y qué perímetro mojado tiene lleno hasta el diámetro?
        opciones:
          - texto: >-
              Es un trapecio de bases $L$ y $2L$ y altura $L\sqrt3/2$: el área
              vale $3\sqrt3 L^{2}/4$ y el perímetro mojado, $3L$
            correcta: true
            mensaje: |
              Eso es. Los tres lados mojados son los tres de abajo del
              hexágono —el horizontal y los dos inclinados— y la anchura
              superior es $2L$ porque cada lado inclinado aporta $L/2$ de
              proyección horizontal a cada lado.
          - texto: >-
              Área $L^{2}\sqrt3/2$ y perímetro $2L$, porque son dos triángulos
              equiláteros
            mensaje: |
              Medio hexágono regular son **tres** triángulos equiláteros de
              lado $L$, no dos, y su contorno mojado son tres lados.
          - texto: >-
              Área $2L^{2}$ y perímetro $4L$, tomándolo como un rectángulo de
              $2L\times L$
            mensaje: |
              No es un rectángulo: los lados van inclinados $60°$, así que la
              altura es $L\sqrt3/2 = 0{,}866L$ y la base de abajo mide $L$, no
              $2L$.

      - tipo: calcular
        titulo: La longitud del lado
        pregunta: |
          ¿Qué lado $L$ hace falta para llevar $2\ \text{m}^{3}/\text{s}$ solo
          con la parte hexagonal?
        respuesta:
          tipo: magnitud
          valor: '98.99 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '89.45 cm'
            mensaje: |
              Parece que has usado $2L$ como perímetro mojado. Son los **tres**
              lados de abajo: $3L$.
          - valor: '49.5 cm'
            mensaje: |
              Eso es la mitad del resultado. Cuidado con no confundir el lado
              del hexágono con la mitad de la anchura superior: la anchura es
              $2L$, pero lo que se pide es $L$.
        pista: |
          $A = 3\sqrt3L^{2}/4$ y $R_H = A/3L$, y Manning con
          $J = 11/10\,000$ deja todo en $L^{8/3}$.
        desarrollo: |
          $$
          A = \frac{3\sqrt3}{4}L^{2} = 1{,}299\,L^{2}
          \qquad
          R_H = \frac{1{,}299L^{2}}{3L} = 0{,}433\,L
          $$
          $$
          2 = \frac{1}{0{,}012}\,1{,}299L^{2}\,(0{,}433L)^{2/3}
          \sqrt{1{,}1\cdot 10^{-3}} = 2{,}055\,L^{8/3}
          $$
          $$
          L = 0{,}9899\ \text{m} = 98{,}99\ \text{cm}
          $$

      - tipo: calcular
        titulo: El caudal con la berma
        pregunta: |
          Con $L = 1\ \text{m}$ y $20\ \text{cm}$ de berma, ¿cuánto caudal
          cabe?
        respuesta:
          tipo: magnitud
          valor: '5.07 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '2.06 m3/s'
            mensaje: |
              Ese es el caudal de la parte hexagonal sola, la del apartado a).
              Con el semicírculo casi lleno la sección se dobla y el radio
              hidráulico sube un 29 %.
          - valor: '4.78 m3/s'
            mensaje: |
              Has llenado el conducto entero, sin berma. Lleno del todo caben
              **menos**, 4,78 frente a 5,07: en lo alto del círculo el
              perímetro mojado crece más deprisa que el área. Los 20 cm de
              berma no cuestan caudal, lo ganan, y además impiden que el tubo
              entre en carga.
        pista: |
          Con $L = 1$, el semicírculo tiene $R = 1$ m; el agua llega a
          $0{,}8$ m por encima del diámetro. Suma el hexágono completo y el
          segmento circular.
        desarrollo: |
          Segmento circular de $R = 1$ hasta $y = 0{,}8$:

          $$
          A_{\text{seg}} = y\sqrt{1-y^{2}} + \arcsin y = 1{,}407\ \text{m}^{2}
          \qquad
          P_{\text{arco}} = 2\arcsin y = 1{,}855\ \text{m}
          $$
          $$
          A = 1{,}299 + 1{,}407 = 2{,}706\ \text{m}^{2}
          \qquad
          P = 3 + 1{,}855 = 4{,}855\ \text{m}
          $$
          $$
          v = \frac{1}{0{,}012}\,0{,}5575^{2/3}\sqrt{1{,}1\cdot 10^{-3}}
          = 1{,}873\ \text{m/s}
          \qquad
          Q = 5{,}07\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Medio hexágono de lado $L$ da $A = 1{,}299L^{2}$ y $P = 3L$, de
              donde $R_H = 0{,}433L$.
          - texto: >-
              Para 2 m³/s con la pendiente de 1,1 milésimas hace falta
              $L = 98{,}99$ cm.
          - texto: >-
              Con $L = 1$ m y 20 cm de berma, la sección pasa a 2,71 m² y el
              radio hidráulico a 0,558 m: caben 5,07 m³/s.
          - texto: >-
              Es decir que añadir el semicírculo multiplica el caudal por dos
              y medio porque duplica el área.
            trampa: true
            mensaje: |
              El área se dobla —de 1,30 a 2,71 m²— pero el caudal se
              multiplica por 2,47. El resto lo pone el **radio hidráulico**,
              que sube de 0,433 a 0,558 m: un 29 %. Es el mismo efecto que en
              cualquier sección profunda: la parte alta añade mucha área y
              poco perímetro, porque las paredes ahí ya se están cerrando
              hacia dentro.

    resolucion: |
      **Una sección que no está en ninguna tabla.** Medio hexágono con un
      semicírculo encima: no hay fórmula que buscar, hay que deducir el área y
      el perímetro. Ese es el ejercicio.

      **a) El hexágono solo.** Medio hexágono regular de lado $L$ son tres
      triángulos equiláteros: base $L$ abajo, anchura $2L$ arriba, altura
      $L\sqrt3/2$.

      $$
      A = \frac{3\sqrt3}{4}L^{2}
      \qquad
      P = 3L
      \qquad
      R_H = \frac{\sqrt3}{4}L = 0{,}433\,L
      $$

      Manning con $J = 11/10\,000$ deja todo en $L^{8/3}$ y sale
      $L = 98{,}99$ cm. Que salga tan cerca de un metro redondo es lo que
      justifica el apartado b).

      **b) Con el semicírculo y la berma.** Con $L = 1$ m el semicírculo tiene
      radio 1 m, y dejar 20 cm de berma significa que el agua llega a 0,8 m
      por encima del diámetro. La sección es el hexágono completo más un
      segmento circular:

      | | $A$ (m²) | $P$ (m) | $R_H$ (m) | $Q$ (m³/s) |
      |---|---|---|---|---|
      | solo hexágono | 1,299 | 3,000 | 0,433 | 2,06 |
      | con berma de 20 cm | 2,706 | 4,855 | 0,558 | **5,07** |
      | lleno hasta arriba | 2,870 | 6,142 | 0,467 | 4,78 |

      **Y la tercera fila es la que enseña algo.** Llenar el conducto **del
      todo** da menos caudal que dejarlo a 20 cm de la coronación: 4,78 frente
      a 5,07. En la parte alta del círculo las paredes se cierran, y ahí el
      perímetro crece más deprisa que el área. Es la misma razón por la que en
      una tubería circular el caudal máximo se da al 94 % del diámetro y no al
      100 %, y es lo que convierte la berma de este enunciado en algo mejor
      que una medida de seguridad: **también es la sección de mayor
      capacidad.**

  # ── 8 (10 %) · Álabes fijos aplicados a un coche de fórmula 1. Es el
  #    ejercicio que demuestra que la expresión ρQv(1−cos θ) del tema 15 no
  #    es solo de turbinas.
  - id: exflu2425-ext-8-los-alerones-del-formula-uno
    titulo: Los alerones de un fórmula 1, que son álabes fijos
    fuente: >-
      Ejercicio 8 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se está diseñando un coche experimental que se asemeja a un coche de
      fórmula 1. El coche tendrá un peso de $200\ \text{kg}$ y su centro de
      gravedad se encuentra más cercano al eje trasero que al delantero.

      Los alerones delanteros y traseros pueden considerarse como álabes
      fijos. En la parte frontal tiene dos alerones con anchura
      $L = 0{,}95\ \text{m}$ y $\alpha = 20°$, y en la parte posterior, un
      único alerón de anchura $L = 1{,}8\ \text{m}$ y $\alpha = 15°$.

      En los tres alerones, los flujos que entran tienen una altura de
      $h = 50\ \text{cm}$. Los flujos de salida de los alerones frontales no
      afectan al flujo de entrada en el alerón trasero, es decir, se pueden
      analizar de forma independiente. Para una velocidad del coche de
      $200\ \text{km/h}$ calcular:

      e) La fuerza horizontal y vertical por efecto del aire en cada alerón.

      f) ¿Qué pérdida de potencia se produce en el coche al circular a esa
      velocidad con los alerones descritos?

      DATOS: $\rho_{\text{aire}} = 1{,}2\ [\text{kg/m}^{3}]$.

      **Notas nuestras.** El cuadernillo letra estos dos apartados e) y f),
      sin un a) antes: se dejan como vienen. La figura enseña el coche de
      perfil y en planta, con los dos alerones delanteros a los lados del
      morro y el trasero detrás, y el perfil de un alerón: el aire entra
      horizontal, con una altura $h$, pasa por encima del alerón y sale
      desviado hacia arriba un ángulo $\alpha$ respecto de la horizontal.
      *El impreso escribe «unico», sin tilde.*
    notas:
      - >-
        **NOTA 1**: El caso en el que el coche está en movimiento y el aire
        en reposo es el mismo que en el que el coche está parado y el aire en
        movimiento.
      - >-
        **NOTA 2**: La fricción entre el coche y el suelo y las fuerzas de
        fricción entre el coche y el aire son despreciables.
    pide: Las fuerzas en cada alerón y la potencia que cuestan.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede tratar un alerón como un álabe fijo, si el coche
          se mueve?
        opciones:
          - texto: >-
              Porque el problema se plantea en el sistema del coche: ahí el
              alerón está quieto y es el aire el que llega a 200 km/h
            correcta: true
            mensaje: |
              Eso es, y el enunciado lo dice explícitamente en su NOTA 1. Es un
              cambio de sistema de referencia inercial: las fuerzas son las
              mismas y el álabe queda fijo, que es el caso con fórmula sencilla.
          - texto: >-
              Porque los alerones no giran, y solo los álabes que giran son
              móviles
            mensaje: |
              «Móvil» en el sentido del tema 15 significa que el álabe se
              desplaza **respecto del chorro**, gire o no. Un álabe montado en
              un carro que avanza en línea recta también es móvil.
          - texto: >-
              Porque el aire es un gas y la fórmula del álabe solo vale para
              líquidos
            mensaje: |
              La fórmula sale del teorema de la cantidad de movimiento, que no
              distingue líquidos de gases. Lo único que hay que respetar es
              que la densidad sea aproximadamente constante, y a 200 km/h el
              Mach vale $0{,}16$: de sobra.

      - tipo: calcular
        titulo: La fuerza vertical de un alerón delantero
        pregunta: |
          ¿Qué fuerza vertical produce **cada** alerón delantero?
        respuesta:
          tipo: magnitud
          valor: '601.7 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1759 n'
            mensaje: |
              Ese es el flujo de cantidad de movimiento $\rho Q v$ sin
              proyectar. La componente vertical lleva $\sin 20°$.
          - valor: '106.1 n'
            mensaje: |
              Esa es la componente **horizontal**, que lleva
              $1 - \cos 20°$. Con ángulos pequeños la vertical es mucho mayor
              que la horizontal, y esa es toda la gracia de un alerón.
        pista: |
          $Q = v\,L\,h$ por alerón, y $F_y = \rho Q v\sin\alpha$.
        desarrollo: |
          $$
          v = 200\ \text{km/h} = 55{,}56\ \text{m/s}
          \qquad
          Q = 55{,}56\cdot 0{,}95\cdot 0{,}5 = 26{,}39\ \text{m}^{3}/\text{s}
          $$
          $$
          \rho Q v = 1{,}2\cdot 26{,}39\cdot 55{,}56 = 1759\ \text{N}
          $$
          $$
          F_y = 1759\,\sin 20° = 601{,}7\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza horizontal de un alerón delantero
        pregunta: |
          ¿Y la horizontal?
        respuesta:
          tipo: magnitud
          valor: '106.1 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '601.7 n'
            mensaje: |
              Esa es la vertical. La horizontal lleva $1-\cos\alpha$, que con
              $20°$ vale $0{,}060$ frente al $0{,}342$ del seno: casi seis
              veces menos.
          - valor: '1653 n'
            mensaje: |
              Has usado $\cos 20°$ en vez de $1 - \cos 20°$. La fuerza
              horizontal es la **variación** de cantidad de movimiento en esa
              dirección, no la de salida.
        pista: |
          $F_x = \rho Q v\,(1-\cos\alpha)$.
        desarrollo: |
          $$
          F_x = 1759\,(1-\cos 20°) = 1759\cdot 0{,}0603 = 106{,}1\ \text{N}
          $$

      - tipo: calcular
        titulo: El alerón trasero
        pregunta: |
          ¿Qué fuerza vertical produce el alerón trasero?
        respuesta:
          tipo: magnitud
          valor: '862.7 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3333 n'
            mensaje: |
              Ese es $\rho Q v$ sin proyectar. Falta el $\sin 15°$.
          - valor: '1203 n'
            mensaje: |
              Esa es la suma de los dos alerones delanteros. El trasero es uno
              solo, pero casi el doble de ancho, y aun así da menos que los dos
              de delante juntos porque su ángulo es menor.
        pista: |
          El mismo cálculo con $L = 1{,}8$ m y $\alpha = 15°$.
        desarrollo: |
          $$
          Q = 55{,}56\cdot 1{,}8\cdot 0{,}5 = 50{,}0\ \text{m}^{3}/\text{s}
          \qquad
          \rho Q v = 3333\ \text{N}
          $$
          $$
          F_y = 3333\,\sin 15° = 862{,}7\ \text{N}
          \qquad
          F_x = 3333\,(1-\cos 15°) = 113{,}6\ \text{N}
          $$

      - tipo: calcular
        titulo: La potencia que cuestan
        pregunta: |
          ¿Qué potencia pierde el coche por los tres alerones?
        respuesta:
          tipo: magnitud
          valor: '18.1 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '12.2 kw'
            mensaje: |
              Has contado un solo alerón delantero. Son **dos**, y sus fuerzas
              horizontales se suman a la del trasero.
          - valor: '114.8 kw'
            mensaje: |
              Has usado las fuerzas **verticales**. La potencia perdida es la
              que se opone al avance: fuerza horizontal por velocidad. La
              vertical no hace trabajo porque el coche no sube.
        pista: |
          $P = \left(\sum F_x\right)v$, con las tres fuerzas horizontales.
        desarrollo: |
          $$
          \sum F_x = 2\cdot 106{,}1 + 113{,}6 = 325{,}8\ \text{N}
          $$
          $$
          P = 325{,}8\cdot 55{,}56 = 18\,099\ \text{W} = 18{,}1\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              En el sistema del coche los alerones son álabes **fijos**, y
              vale $F = \rho Q v$ con sus proyecciones.
          - texto: >-
              Cada alerón delantero da 601,7 N hacia abajo y 106,1 de
              resistencia; el trasero, 862,7 y 113,6.
          - texto: >-
              La carga aerodinámica total son 2066 N —el peso de unos 211 kg,
              más que los 200 kg del coche— y cuesta 18,1 kW de potencia.
          - texto: >-
              Como la fuerza vertical es seis veces la horizontal, los
              alerones dan mucho agarre y casi no penalizan.
            trampa: true
            mensaje: |
              «Casi no penalizan» son **18 kW**, unos 25 CV a 200 km/h, y a
              300 serían más del triple, porque la potencia va con el cubo de
              la velocidad. Ese es exactamente el compromiso que define el
              reglaje de un fórmula 1: mucha carga en circuitos revirados y
              poca en los rápidos. La relación seis a uno no dice que sea
              barato, dice cuál es el precio.

    resolucion: |
      **El cambio de sistema de referencia.** El enunciado lo da hecho en su
      NOTA 1, pero conviene entender por qué vale: coche moviéndose en aire
      quieto y coche quieto en aire moviéndose son el mismo problema visto
      desde dos sistemas inerciales, y las fuerzas no cambian. En el segundo,
      los alerones son **álabes fijos** y se aplica la fórmula del tema 15 sin
      más.

      **Las fuerzas.** Con $v = 55{,}56$ m/s y $Q = v L h$ en cada alerón:

      | | $L$ | $\alpha$ | $\rho Qv$ | $F_x$ | $F_y$ |
      |---|---|---|---|---|---|
      | delantero (×2) | 0,95 m | 20° | 1759 N | 106,1 N | 601,7 N |
      | trasero | 1,80 m | 15° | 3333 N | 113,6 N | 862,7 N |

      **Lo que hay que mirar en la tabla.** El alerón trasero mueve casi el
      doble de aire que uno delantero, pero su ángulo es menor, así que su
      carga solo supera en un 43 % a la de uno de ellos. Y la resistencia de
      los tres es parecida —106 y 114 N— porque el factor $1-\cos\alpha$ crece
      con el **cuadrado** del ángulo mientras el $\sin\alpha$ crece
      linealmente: es la razón matemática de que un alerón poco inclinado dé
      mucha carga por poca resistencia.

      **La potencia.**

      $$
      P = \left(\sum F_x\right)v = 325{,}8\cdot 55{,}56 = 18{,}1\ \text{kW}
      $$

      Veinticinco caballos a 200 km/h, y la carga aerodinámica que compran son
      2066 N hacia abajo: el peso de unos 211 kg, **más de lo que pesa el
      propio coche**, que son 200 kg. **Ese es el negocio del alerón**:
      convertir potencia del motor en agarre, y aquí duplica la fuerza con
      que el coche aprieta el suelo.

      **Y el detalle que el ejercicio deja para pensar.** El enunciado dice
      que el centro de gravedad está más cerca del eje trasero. Con 1203 N de
      carga delante y 863 detrás, los alerones **reparten al revés** que el
      peso, y eso es deliberado: sirve para equilibrar el coche en curva. El
      dato está puesto para que se vea que el reparto de carga aerodinámica es
      una decisión, no una consecuencia.

  # ── 9 (10 %) · Pitot. El apartado bueno es el último: una avería en la toma
  #    estática no se nota mientras nada cambia, y aparece de golpe cuando el
  #    avión cambia de altura. Hasta el 30 de septiembre de 2026 le faltaban el
  #    apartado c) y los dos dibujos que piden a) y c).
  - id: exflu2425-ext-9-el-pitot-del-avion-que-se-bloquea
    titulo: El Pitot del avión, y la avería que no se nota hasta que cambia todo
    fuente: >-
      Ejercicio 9 · Convocatoria extraordinaria, 23 de junio de 2025 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Para poder determinar la velocidad de un avión, se emplean un tubo Pitot
      y un piezómetro abierto. La lectura de la velocidad del avión que
      obtiene el piloto se basa en la diferencia de altura del líquido
      manométrico empleado. Para evitar problemas de seguridad, lleva un tubo
      de Pitot y un piezómetro abierto a cada lado del avión, como se muestra
      en las figuras (1) R y (1) L. El fluido manométrico en ambos casos es
      mercurio.

      En la imagen (1) R y (1) L se muestran el sistema con Pitot +
      Piezómetro abiertos con el avión parado en tierra a una velocidad
      $v = 0$ km/h en ambos casos.

      a) Representar, los líquidos manométricos en las figuras (2) R y (2) L
      y, obtener la ecuación que define la velocidad del avión en función de
      la lectura manométrica.

      b) Calcular la lectura (mm) del manómetro en cada sistema, (2) R y
      (2) L, cuando el avión vuela a una velocidad de $250\ \text{km/h}$ a una
      altura de $z = 9000$ metros.

      Durante el vuelo a 9000 metros de altura y 250 km/h de velocidad, se
      produce un problema y se bloquea la entrada del piezómetro abierto (L),
      tal y como se representa en el estado (3) L. En la figura (3) R, por el
      contrario, el piezómetro abierto sigue abierto. Mientras el avión vuela
      en esas condiciones a 250 km/h, el problema no se va a notar, pero si
      con este problema cambia la altura o la velocidad, aparecerán lecturas
      contradictorias en los sistemas (R) y (L).

      c) Representar los líquidos manométricos en los sistemas (3) R y (3) L
      en el caso de aterrizar con el problema descrito, una vez el avión se
      encuentre quieto.

      d) ¿Qué velocidad mostrará cada sistema? Utilizar la ecuación obtenida
      en el apartado a).

      Datos: $p_{\text{tierra}} = 1{,}01\ \text{bar}$;
      $p_{9000\ \text{m}} = 308\ \text{mbar}$;
      $\rho_{\text{aire}}\ [z = 0\ \text{m}] = 1{,}2\ \text{kg/m}^{3}$;
      $\rho_{\text{aire}}\ [z = 9000\ \text{m}] = 0{,}61\ \text{kg/m}^{3}$.

      **Notas nuestras.** La figura son seis dibujos del morro del avión, tres
      de cada lado. En cada uno hay un tubo en U con mercurio: una rama sube
      por encima del fuselaje y se dobla hacia el morro, de cara al aire, y es
      el Pitot; la otra acaba a ras del fuselaje, y es el piezómetro. En R el
      avión va hacia la derecha y el Pitot es la rama de la izquierda; en L va
      hacia la izquierda y el Pitot es la de la derecha. En (1) R y (1) L,
      parado, el mercurio está a la misma altura en las dos ramas. (2) R y
      (2) L son el vuelo a 250 km/h, y (3) R y (3) L, el avión otra vez parado
      en tierra, con la boca del piezómetro de L tapada; en esos cuatro las
      ramas están vacías, y rellenarlas es lo que piden a) y c).
    notas:
      - >-
        **NOTA**: Despreciar el proceso de compresión/expansión del aire
        dentro del manómetro.
    pide: Los líquidos manométricos en vuelo y en tierra, la ecuación de la velocidad, la lectura a 9000 m y lo que marca cada sistema tras aterrizar averiado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro compara el Pitot con el piezómetro. ¿Qué mide esa
          diferencia?
        opciones:
          - texto: >-
              La presión dinámica $\rho v^{2}/2$: el Pitot da la total y el
              piezómetro la estática, y su diferencia es la parte que
              corresponde a la velocidad
            correcta: true
            mensaje: |
              Eso es, y de ahí sale directamente
              $v = \sqrt{2g(s_m/s_{\text{aire}}-1)R}$. La toma estática es la
              mitad silenciosa del instrumento, y la que se avería en la
              segunda parte del enunciado.
          - texto: >-
              La presión atmosférica a la altura de vuelo
            mensaje: |
              Esa la da el piezómetro **solo**, y el avión la usa para el
              altímetro. Lo que mide la diferencia con el Pitot es otra cosa:
              la presión dinámica.
          - texto: >-
              La densidad del aire a esa altura
            mensaje: |
              La densidad hay que conocerla aparte —el enunciado la da— para
              poder pasar de presión dinámica a velocidad. El manómetro solo
              mide una diferencia de presiones.

      - tipo: redactar
        que: deduccion
        consigna: |
          La segunda mitad del apartado a) en papel, como la entregarías: la
          ecuación de la velocidad del avión en función de la lectura del
          manómetro, deducida desde lo que mide cada toma hasta dejar $v$
          despejada. Es la ecuación que usan b) y d), y la d) lo dice: «utilizar
          la ecuación obtenida en el apartado a)».
        rubrica: velocidad-con-un-pitot
        veredicto: |
          Si tu folio tiene los mínimos, llegas a la expresión que imprime la
          solución. Apunta al lado qué densidad del aire vas a meter en cada
          apartado: en b) la de 9000 m y en d) la de tierra, y es lo único que
          cambia entre las dos cuentas.

      - tipo: calcular
        titulo: La lectura a 9000 metros
        pregunta: |
          ¿Cuántos milímetros marca el manómetro de mercurio de cada sistema?
        respuesta:
          tipo: magnitud
          valor: '11.04 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '21.71 mm'
            mensaje: |
              Has usado la densidad del aire a nivel del suelo. A 9000 m es
              casi la mitad, $0{,}61\ \text{kg/m}^{3}$, y la presión dinámica
              baja en la misma proporción.
          - valor: '150.1 mm'
            mensaje: |
              Has usado agua como líquido manométrico. Es mercurio: pesa 13,6
              veces más, y la lectura es 13,6 veces menor.
        pista: |
          $\rho_{\text{aire}}v^{2}/2 = (\gamma_{Hg}-\gamma_{\text{aire}})R$.
        desarrollo: |
          $$
          v = \frac{250}{3{,}6} = 69{,}44\ \text{m/s}
          \qquad
          \frac{\rho v^{2}}{2} = \frac{0{,}61\cdot 69{,}44^{2}}{2}
          = 1471\ \text{Pa}
          $$
          $$
          R = \frac{1471}{13\,600\cdot 9{,}8} = 0{,}01104\ \text{m}
          = 11{,}04\ \text{mm}
          $$

          Los dos sistemas funcionan, así que (2) R y (2) L marcan lo mismo.

      - tipo: calcular
        titulo: La lectura del sistema averiado en tierra
        pregunta: |
          Con el avión parado en la pista y el piezómetro de L encerrando
          todavía la presión de 9000 m, ¿qué desnivel de mercurio marca el
          sistema L?
        respuesta:
          tipo: magnitud
          valor: '526.8 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0 mm'
            mensaje: |
              Eso marca el sistema **sano**, R: con el avión parado, su Pitot y
              su piezómetro reciben los dos la presión de la pista. En L el
              piezómetro está tapado y sigue con la presión de arriba.
          - valor: '757.9 mm'
            mensaje: |
              Has tomado la rama tapada como si tuviera vacío. No lo tiene:
              encierra el aire de los 9000 m, a 308 mbar, y esa presión se
              resta.
        pista: |
          El Pitot de L recibe la presión de la pista, $1{,}01$ bar, y la rama
          tapada sigue a $308$ mbar.
        desarrollo: |
          $$
          \Delta p = 101\,000 - 30\,800 = 70\,200\ \text{Pa}
          $$
          $$
          R_L = \frac{70\,200}{9{,}8\,(13\,600 - 1{,}2)} = 0{,}5268\ \text{m}
          = 526{,}8\ \text{mm}
          $$

          El mercurio baja en la rama del Pitot y sube en la tapada. Es
          casi cincuenta veces el desnivel de vuelo.

      - tipo: dibujar
        consigna: |
          Los líquidos manométricos de los cuatro estados que piden a) y c):
          (2) R y (2) L, en vuelo a 250 km/h y 9000 m, y (3) R y (3) L, en
          tierra, parado y con el piezómetro de L tapado. En cada uno, qué rama
          baja, cuál sube y cuánto, con los cuatro a la misma escala.
        comprueba:
          - punto: >-
              En (2) R y (2) L el mercurio **baja en la rama del Pitot** y sube
              en la del piezómetro, con 11,04 mm de desnivel.
            porque: >-
              El Pitot recibe la presión total y el piezómetro la estática, así
              que la rama del Pitot empuja más. En R el Pitot es la rama de la
              izquierda y en L la de la derecha, porque los dos miran al morro:
              los dos dibujos son simétricos, no iguales.
          - punto: >-
              (2) R y (2) L con el mismo desnivel.
            porque: >-
              Mientras los dos sistemas funcionan miden la misma presión
              dinámica, y el enunciado lo dice: a 250 km/h y 9000 m el problema
              no se nota. Un desnivel distinto en vuelo sería una avería que
              todavía no ha pasado.
          - punto: >-
              (3) R con los dos meniscos a la misma altura.
            porque: >-
              Parado en tierra, el Pitot y el piezómetro sano reciben los dos
              la presión de la pista: no hay presión dinámica y no hay
              desnivel. Marca cero, que es lo que tiene que marcar.
          - punto: >-
              (3) L con un desnivel enorme, 52,7 cm: el mercurio baja en el
              Pitot y sube en la rama tapada.
            porque: >-
              La rama tapada encierra los 308 mbar de los 9000 m y el Pitot
              recibe los 1,01 bar de la pista: 70,2 kPa de diferencia. A la
              misma escala que el vuelo, es lo que hace ver la avería: un
              instrumento que en vuelo apenas se mueve se va al final de su
              recorrido con el avión quieto.
        figura: |
          <svg viewBox="0 0 450 462" role="img" width="450" height="462" aria-labelledby="flu2425-9-t flu2425-9-d">
            <title id="flu2425-9-t">Los líquidos manométricos de los cuatro estados, a la misma escala: en vuelo y en tierra con la toma estática de L tapada</title>
            <desc id="flu2425-9-d">Cuatro dibujos del tubo en U de mercurio con el fuselaje como una línea horizontal. En cada uno, una rama sube por encima del fuselaje y se dobla hacia el morro: es el Pitot; la otra acaba en el fuselaje: es la toma estática. En R el avión va hacia la derecha y el Pitot es la rama izquierda; en L va hacia la izquierda y el Pitot es la derecha. Arriba, (2) R y (2) L, en vuelo a 250 kilómetros por hora: el mercurio baja en la rama del Pitot y sube en la estática, con un desnivel de 11,04 milímetros que a esta escala casi no se ve, igual en los dos. Abajo, (3) R, parado en tierra: los dos meniscos a la misma altura, desnivel cero. Y (3) L, parado en tierra con la toma estática tapada: el mercurio baja mucho en el Pitot y sube mucho en la rama tapada, con un desnivel de 52,7 centímetros, casi cincuenta veces el de vuelo.</desc>
