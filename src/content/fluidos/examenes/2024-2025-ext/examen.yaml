# La extraordinaria de junio de 2025, del cuadernillo del departamento
# «Exámenes 2020-2025». Ocho de sus nueve ejercicios.
#
# Igual que la ordinaria de 2026: publica el resultado y nada más, y no
# imprime reparto por competencia sino el porcentaje de cada ejercicio
# (10 / 15 / 10 / 7,5 / 15 / 10 / 12,5 / 10 / 10). Por eso van sin `puntos`.
#
# **El que falta es el 3**, y queda dicho por qué. Es una instalación de dos
# depósitos presurizados con un manómetro A relativo dentro de una cámara C
# que tiene su propio barómetro de mercurio (a = 760 mmHg). Sumando la
# lectura de A —1,66·10⁴ Pa— a esa atmósfera salen 12,03 mca, y el examen
# publica 10,43. Se ha probado también tomando la lectura de A como vacío
# (8,64 mca) y suponiendo que el barómetro mide la atmósfera exterior y no la
# de la cámara, y ninguna de las tres da el número impreso. §13 caso 2.
#
# Lo que este examen aporta que la ordinaria de 2026 no tenía:
#
# - **Dos ejercicios de bombeo en el mismo examen** (el 2 y el 5), uno con
#   válvula de regulación y otro con bombas en paralelo. Los dos se archivan
#   en el tema 25.
# - **Un ejercicio de álabes que no es de una turbina**: los alerones de un
#   coche de fórmula 1, con la misma expresión ρQv(1−cos θ) del tema 15.
# - **El apartado que convierte mca en columna de líquido** (5a): dar los
#   1,46 mca como metros de columna de petróleo da 63,9 l/s en vez de 69,4.
#   Es el mismo tipo de detalle que dejó fuera el ejercicio 4 de 2026.
