asignatura: fluidos
curso: '2024-2025'
convocatoria: extraordinaria
fecha: 23 de junio de 2025
# La extraordinaria de junio de 2025, del cuadernillo del departamento
# «Exámenes 2020-2025», págs. 62 a 67 (68 a 73 del PDF). Están los nueve.
#
# Igual que la ordinaria de 2026: publica el resultado y nada más
# (`pdfEs: enunciado-con-resultados`), y no imprime reparto por competencia
# sino el porcentaje de cada ejercicio junto a su número, «1. (10%)». Esos
# porcentajes van en `puntosImpresos` y suman 100. Por eso los ejercicios van
# sin `puntos`.
#
# **El 3 estuvo en `fuera` hasta el 30 de septiembre de 2026**, con el motivo
# de que su 10,43 mca no salía por ninguna lectura. Salía: la figura, mirada a
# 300 ppp (pág. 70 del PDF), tiene el barómetro de mercurio FUERA de la cámara
# C y un tubo en U (s_m = 8, R = 0,2 m) que une la cámara con el exterior, con
# el líquido más alto en la rama de la cámara. La cámara está en depresión:
# 10,336 − 1,6 + 1,694 = 10,43 mca. Las tres lecturas probadas antes no
# contaban ese tubo. Es la lección de CLAUDE.md §17: un «no se reproduce» se
# escribe citando la página renderizada que lo comprueba.
#
# Las entradas llevan `n` aunque ya no quede ningún ejercicio entero fuera: no
# cambia nada en la página y deja los puntos atados a su número del cuadernillo
# pase lo que pase con el 3.
#
# Lo que este examen aporta que la ordinaria de 2026 no tenía:
#
# - **Dos ejercicios de bombeo en el mismo examen** (el 2 y el 5), uno con
#   válvula de regulación y otro con bombas en paralelo. Los dos se archivan
#   en el tema 25.
# - **Un ejercicio de álabes que no es de una turbina**: los alerones de un
#   coche de fórmula 1, con la misma expresión ρQv(1−cos θ) del tema 15.
#
# Y uno que comparte con ella: **convertir mca en columna de otro líquido**
# (5a). Dar los 1,46 mca como metros de columna de petróleo da 63,9 l/s en vez
# de 69,38. Es el mismo detalle del ejercicio 4 de la ordinaria de 2026, y el
# tema 4 usa los dos de ejemplo en «Una columna en mca es siempre de agua».
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (10%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 10 }
    - { n: 2, puntos: 15 }
    - { n: 3, puntos: 10 }
