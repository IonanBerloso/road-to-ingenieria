      Los dos manómetros miden **absolutas**, y ahí está el apartado c). Un
      manómetro de absolutas no se entera de que suba la atmósfera si lo que
      mide está encerrado; el de membrana del fondo, en cambio, mide contra el
      exterior. Cuál se mueve y cuál no depende de eso, no de la altura a la
      que esté.

      </figcaption>
      </figure>
    pide: El peso específico del aceite, la lectura en el fondo y qué cambia al subir la atmósfera.

    pasos:
      - tipo: reconocer
        pregunta: |
          $P_1$ está conectado al aire y $P_2$ al aceite, 1,5 m por debajo de
          la superficie del aceite. ¿Qué da su diferencia?
        opciones:
          - texto: >-
              El peso de 1,5 m de aceite, porque en el aire la presión es
              prácticamente uniforme
            correcta: true
            mensaje: |
              Eso es. El aire pesa unas mil veces menos que el aceite, así
              que la presión en toda la cámara de aire es la misma que en la
              superficie del aceite. La diferencia entre los dos manómetros
              es entonces $\gamma_{ac}\cdot 1{,}5$.
          - texto: >-
              El peso de los 6 m que separan los dos manómetros
            mensaje: |
              Entre los dos manómetros hay aire y aceite, y solo el aceite
              pesa. La columna que cuenta va de la superficie del aceite
              —cota 4,5 m— al manómetro $P_2$ —cota 3 m—: 1,5 m.
          - texto: >-
              Nada, porque los dos son absolutos y las presiones absolutas no
              se restan
            mensaje: |
              Se restan perfectamente. Que sean absolutos solo significa que
              su cero es el vacío en vez de la atmósfera, y al restar dos
              lecturas el cero desaparece.

      - tipo: calcular
        titulo: El peso específico del aceite
        pregunta: |
          ¿Cuánto vale $\gamma_{aceite}$, en N/m³?
        respuesta:
          tipo: magnitud
          valor: '2613.3 N/m3'
          tolerancia: 0.02
          formato: un peso específico, con su unidad
        distractores:
          - valor: '653.3 N/m3'
            mensaje: |
              Has repartido la diferencia entre los 6 m que separan los dos
              manómetros. Solo pesa el aceite, y de aceite hay 1,5 m entre
              la superficie y $P_2$.
          - valor: '8711 N/m3'
            mensaje: |
              Parece que has usado la diferencia entre $P_2$ y la presión
              atmosférica. Los dos manómetros son absolutos, así que su
              diferencia ya está limpia de atmósfera.
        pista: |
          $2{,}04\ \text{kg/cm}^{2}$ son $199\,920$ Pa y $1{,}96$ bar son
          $196\,000$ Pa.
        desarrollo: |
          $$
          \Delta p = 199920-196000 = 3920\ \text{Pa}
          \qquad
          \Delta z = 4{,}5-3 = 1{,}5\ \text{m}
          $$
          $$
          \gamma_{ac} = \frac{3920}{1{,}5} = 2613{,}3\ \text{N/m}^{3}
          $$

      - tipo: calcular
        titulo: La lectura en el fondo
        pregunta: |
          ¿Cuánto marca el manómetro de membrana del fondo, en torr?
        respuesta:
          tipo: numero
          valor: '872.75'
          tolerancia: 3
          formato: un número en torr
        distractores:
          - valor: '1612.7'
            mensaje: |
              Has dado la presión **absoluta**. Un manómetro de membrana mide
              presión relativa: hay que restarle la atmosférica, que son 740
              torr.
          - valor: '833.5'
            mensaje: |
              Te has dejado el metro de agua del fondo. Entre $P_2$ y B hay
              2 m de aceite **y** 1 m de agua, y el agua pesa casi cuatro
              veces más.
        pista: |
          De $P_2$ hacia abajo: 2 m de aceite hasta la cota 1, y después 1 m
          de agua. Y el resultado, en relativa.
        desarrollo: |
          $$
          p_B = 199920 + 2613{,}3\cdot 2 + 9800\cdot 1
          = 214947\ \text{Pa (abs)}
          $$
          $$
          p_{at} = 0{,}74\cdot 13{,}6\cdot 9800 = 98627\ \text{Pa}
          \qquad
          p_{B,rel} = 116320\ \text{Pa}
          $$
          $$
          \frac{116320}{133{,}3} = 872{,}75\ \text{torr}
          $$

      - tipo: calcular
        titulo: La nueva lectura del fondo
        pregunta: |
          Con la atmósfera a 1076 mbar, ¿qué marca ahora el manómetro del
          fondo, en pascales?
        respuesta:
          tipo: magnitud
          valor: '107347 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '125292 Pa'
            mensaje: |
              Has sumado el aumento de la atmósfera en vez de restarlo. Las
              presiones absolutas del depósito no cambian, así que si el
              cero del manómetro sube, la lectura relativa **baja**.
          - valor: '214947 Pa'
            mensaje: |
              Esa es la presión absoluta en el fondo, que efectivamente no
              cambia. Lo que se pide es la lectura del manómetro, que es
              relativa.
        pista: |
          La presión absoluta del fondo no cambia; lo que cambia es el cero
          respecto del que mide la membrana.
        desarrollo: |
          $$
          p_{B,rel} = 214947 - 107600 = 107347\ \text{Pa}
          $$

          que en torr son $805{,}4$, frente a los $872{,}75$ de antes.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              $P_1$ y $P_2$ son manómetros de presión **absoluta**, y miden
              respecto del vacío, que no depende del tiempo que haga.
          - texto: >-
              El depósito está cerrado, así que la atmósfera no puede
              comunicar su cambio al aire de dentro.
          - texto: >-
              El manómetro del fondo es de membrana y mide respecto de la
              atmósfera, así que su lectura baja exactamente lo que sube la
              atmósfera.
          - texto: >-
              Como la atmósfera aumenta, el aire del depósito se comprime y
              el nivel del aceite sube un poco.
            trampa: true
            mensaje: |
              El depósito es rígido y cerrado: la atmósfera no toca el aire
              de dentro. Para que el aire se comprimiera tendría que llegarle
              la presión de fuera, y no le llega por ningún sitio. Es
              exactamente la razón por la que $P_1$ y $P_2$ no se mueven.
    resolucion: |
      **a) El peso específico del aceite.** Los dos manómetros son absolutos,
      así que su diferencia es limpia. $P_1$ está en el aire, cuya presión es
      prácticamente uniforme e igual a la de la superficie del aceite (cota
      4,5 m); $P_2$ está en el aceite a la cota 3 m:

      $$
      \gamma_{ac} = \frac{199920-196000}{4{,}5-3} = 2613{,}3\ \text{N/m}^{3}
      $$

      Es un aceite extraordinariamente ligero —$s = 0{,}27$— pero es lo que
      dan los datos, y el ejercicio no pide comprobar su verosimilitud.

      **b) El fondo.** Bajando desde $P_2$: dos metros de aceite y uno de
      agua.

      $$
      p_B = 199920 + 5227 + 9800 = 214947\ \text{Pa absolutos}
      $$

      Un manómetro de membrana mide **relativa**, así que hay que descontar la
      atmósfera, $74\ \text{cm.c.Hg} = 98\,627$ Pa:

      $$
      p_{B} = 116\,320\ \text{Pa} = 872{,}75\ \text{torr}
      $$

      **c) Sube la atmósfera.** Es la pregunta que ordena el ejercicio.

      - $P_1$ y $P_2$ **no cambian**: son absolutos, su cero es el vacío, y el
        depósito está cerrado, así que la atmósfera no llega al aire interior.
      - El del fondo **sí cambia**, porque su cero es la atmósfera. La presión
        absoluta del fondo sigue siendo 214.947 Pa, pero ahora se le resta
        107.600 en vez de 98.627.

      $$
      p_B = 214947-107600 = 107\,347\ \text{Pa} = 805{,}4\ \text{torr}
      $$

      **Lo que enseña.** Que la pregunta «¿cuánto marca el manómetro?» no
      tiene respuesta sin saber contra qué mide. Dos aparatos conectados al
      mismo punto de la misma instalación dan números distintos y los dos son
      correctos, y solo uno de ellos se entera de que ha cambiado el tiempo.

  # ── 3 (10 %) · El bloque de hormigón que ancla una tubería submarina. La
  #    presión interior y la marea son datos de sobra.
  - id: exflu2223-ext-3-el-bloque-que-ancla-la-tuberia-submarina
    titulo: El bloque que sujeta la tubería submarina, y los datos que sobran
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se desea instalar una tubería de 300 mm de diámetro cerca de la costa
      para transportar un fluido ($s_1 = 0{,}6$) a una presión constante de
      30 mca. La tubería se instalará sobre el lecho marino, a 10 metros de
      profundidad (la amplitud de marea es de 4,5 metros en esa zona). La
      tubería se anclará al fondo mediante un bloque de hormigón que se
      supondrá continuo, con un ancho $B$ de 350 mm. Se pide:

      **a)** Determinar la altura $H$ de la base de hormigón para mantener el
      bloque de hormigón en el fondo marino. Despreciar el peso del material
      de la tubería y los anclajes metálicos. Considerar, además, que el agua
      se filtra entre la base de hormigón y el fondo marino.

      **b)** Determinar la densidad relativa mínima del fluido que se puede
      transportar en la tubería si la altura del bloque fuese de $H = 5$ cm.

      Datos: $\rho_{agua\ de\ mar} = 1027\ \text{kg/m}^{3}$;
      $\rho_{hormigón} = 2300\ \text{kg/m}^{3}$.
    pide: La altura del bloque que impide que la tubería flote.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la profundidad (10 m), la amplitud de marea (4,5 m)
          y la presión interior (30 mca). ¿Cuáles hacen falta?
        opciones:
          - texto: >-
              Ninguna de las tres: el empuje solo depende del volumen
              desplazado y del peso específico del agua, no de la profundidad
            correcta: true
            mensaje: |
              Exacto, y es lo que hay que ver antes de ponerse a calcular. El
              empuje de Arquímedes es $\gamma V$: no aparece la cota por
              ningún lado. La marea sube las presiones arriba y abajo por
              igual, y la presión interior es un asunto de resistencia de la
              tubería, no de flotación.
          - texto: >-
              La profundidad, porque a 10 metros el empuje es mayor que en
              superficie
            mensaje: |
              El empuje no crece con la profundidad. Crecen las presiones,
              sí, pero crecen igual en la cara de arriba y en la de abajo, y
              su **diferencia** —que es el empuje— se queda igual.
          - texto: >-
              La presión interior de 30 mca, porque hincha la tubería
            mensaje: |
              El enunciado manda despreciar el peso del material y no da
              ningún módulo de elasticidad, así que la tubería es rígida. Los
              30 mca dimensionarían su espesor, que no es lo que se pregunta.

      - tipo: calcular
        titulo: El empuje neto sobre la tubería
        pregunta: |
          Por metro de tubería, ¿con qué fuerza neta tiende a subir, en N/m?
        respuesta:
          tipo: numero
          valor: '295.8'
          tolerancia: 2
          formato: un número en newton por metro
        distractores:
          - valor: '711.4'
            mensaje: |
              Ese es el empuje solo. Hay que descontarle el peso del fluido
              que va dentro, que son 415,6 N por metro.
          - valor: '415.6'
            mensaje: |
              Ese es el peso del fluido interior. El empuje que lo levanta
              vale 711,4 N/m, y la diferencia es lo que hay que sujetar.
        pista: |
          Empuje menos peso del contenido, con la sección de la tubería.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}3^{2}}{4} = 0{,}070686\ \text{m}^{2}
          $$
          $$
          E = 1027\cdot 9{,}8\cdot 0{,}070686 = 711{,}4\ \text{N/m}
          \qquad
          W = 0{,}6\cdot 9800\cdot 0{,}070686 = 415{,}6\ \text{N/m}
          $$
          $$
          E-W = 295{,}8\ \text{N/m}
          $$

      - tipo: calcular
        titulo: La altura del bloque
        pregunta: |
          ¿Qué altura $H$ debe tener el bloque, en milímetros?
        respuesta:
          tipo: magnitud
          valor: '67.74 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '37.5 mm'
            mensaje: |
              Te has olvidado del empuje sobre el propio bloque. El enunciado
              avisa de que el agua se filtra por debajo, y eso es
              precisamente para que el bloque reciba su empuje completo: lo
              que sujeta es su peso **sumergido**.
          - valor: '193.5 mm'
            mensaje: |
              Parece que has usado el ancho $B$ del bloque como si fuera un
              metro, o has olvidado dividir. El bloque tiene 0,35 m de ancho
              por $H$ de alto y un metro de fondo.
        pista: |
          El peso sumergido del bloque, por metro, es
          $(\gamma_{h}-\gamma_{mar})\,B\,H$.
        desarrollo: |
          $$
          (\gamma_h-\gamma_{mar})\,B\,H = 295{,}8
          $$
          $$
          (22540-10064{,}6)\cdot 0{,}35\,H = 295{,}8
          \;\Longrightarrow\;
          4366{,}4\,H = 295{,}8
          $$
          $$
          H = 0{,}06774\ \text{m} = 67{,}74\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La tubería llena de un fluido de $s = 0{,}6$ pesa menos que el
              agua que desplaza, así que tiende a flotar con 295,8 N por
              metro.
          - texto: >-
              El bloque solo aporta su peso **sumergido**, porque el agua se
              filtra por debajo y le da el empuje completo.
          - texto: >-
              Con $B = 0{,}35$ m, cada metro de altura de bloque aporta 4.366
              N por metro de tubería, y basta con 6,8 cm.
          - texto: >-
              Si la marea sube 4,5 m, el empuje sobre el conjunto aumenta y
              habría que engordar el bloque.
            trampa: true
            mensaje: |
              El empuje no cambia: sigue siendo el peso del agua desplazada,
              y el volumen desplazado es el mismo esté el mar donde esté.
              Sube la presión absoluta, sí, pero sube por igual en la cara
              superior y en la inferior. Es justamente por eso por lo que la
              amplitud de marea es un dato de sobra.
    resolucion: |
      **La idea.** Una tubería llena de un fluido más ligero que el agua es un
      flotador. Puesta en el fondo del mar tiende a subir, y el bloque de
      hormigón está para impedirlo. Todo el ejercicio es un balance de pesos
      sumergidos por metro de tubería.

      **a) La altura del bloque.** Con
      $A = \pi\,0{,}3^{2}/4 = 0{,}070686\ \text{m}^{2}$:

      $$
      E-W = (1027\cdot 9{,}8 - 0{,}6\cdot 9800)\cdot 0{,}070686
      = 295{,}8\ \text{N/m}
      $$

      El bloque aporta su peso menos su empuje —el enunciado avisa de que el
      agua se filtra por debajo, y eso es lo que garantiza que reciba el
      empuje completo—:

      $$
      (22540-10064{,}6)\cdot 0{,}35\cdot H = 295{,}8
      \;\Longrightarrow\;
      H = 67{,}74\ \text{mm}
      $$

      **Los tres datos que sobran, y por qué están.** La profundidad de 10 m,
      la amplitud de marea de 4,5 m y la presión interior de 30 mca no
      intervienen en ninguna de las dos cuentas. El empuje de Arquímedes vale
      $\gamma V$ y no sabe a qué profundidad está el cuerpo; la marea sube las
      presiones de todas las caras por igual; y la presión interior
      dimensionaría el espesor del tubo, que aquí se manda despreciar. Un
      examen que da datos de sobra está comprobando que sabes cuáles pintan.

      **Un apartado que no se publica resuelto.** El b) pide la densidad
      relativa mínima con un bloque de 5 cm y publica $s_1 = 0{,}752$. La
      misma ecuación que reproduce el apartado a) exactamente da $0{,}712$, y
      no se ha encontrado la lectura que explique la diferencia: no la dan ni
      el cambio de $g$, ni prescindir del empuje del bloque, ni ninguna otra
      combinación probada de los datos. Se deja fuera antes que publicar un
      número que no cuadra.

  # ── 4 (10 %) · El chorro que se parte en dos, y el ángulo que maximiza la
  #    fuerza. La respuesta es 90°, no 180°.
  - id: exflu2223-ext-4-el-chorro-que-se-parte-en-dos
    titulo: El chorro que se parte en dos, y el ángulo que más empuja
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un chorro de agua de diámetro $d = 200$ mm incide sobre la placa de la
      figura, repartiéndose el caudal en dos mitades. La placa desvía el agua
      un ángulo $\theta = 50^{\circ}$. La velocidad del chorro a la entrada es
      $v = 20$ m/s. Se pide:

      **a)** Hipótesis que se deben cumplir para que el módulo de la velocidad
      se mantenga constante en el chorro que incide sobre la placa.

      **b)** Fuerza que se debe ejercer sobre la placa (módulo, dirección y
      sentido) para que se mantenga fija en la posición de la figura.

      **c)** Si se pudiera variar el ángulo de desvío $\theta$ de la placa,
      ¿para qué ángulo sería máxima la fuerza ejercida por el chorro? Razonar
      la respuesta.

      <figure class="figura-examen">
      <svg viewBox="20 10 396 274" role="img" width="420" height="291"
           aria-labelledby="fu4t fu4d">
        <title id="fu4t">El chorro que la placa parte en dos mitades</title>
        <desc id="fu4d">Un chorro de agua de doscientos milímetros de diámetro
        avanza horizontalmente hacia la derecha a veinte metros por segundo y
        golpea una placa con forma de cuchara, cóncava hacia el chorro. La
        placa reparte el caudal en dos mitades iguales y las desvía hacia
        atrás: cada una sale formando cincuenta grados con la vertical, una
        hacia arriba y a la izquierda y otra hacia abajo y a la izquierda. Como
        el agua sale con una componente contraria a la de entrada, la fuerza
        sobre la placa es mayor que si solo la detuviera.</desc>

        <rect x="40" y="134" width="176" height="32" fill="var(--live)" fill-opacity=".35"/>
        <line x1="70" y1="150" x2="180" y2="150" stroke="var(--live)" stroke-width="2.6"
              marker-end="url(#fu4f)"/>
        <text x="120" y="184" text-anchor="middle" font-size="11" fill="var(--live)">v = 20 m/s</text>
        <line x1="56" y1="134" x2="56" y2="166" stroke="var(--faint)" stroke-width="1"/>
        <line x1="50" y1="134" x2="62" y2="134" stroke="var(--faint)" stroke-width="1"/>
        <line x1="50" y1="166" x2="62" y2="166" stroke="var(--faint)" stroke-width="1"/>
        <text x="56" y="126" text-anchor="middle" font-size="10" fill="var(--faint)">d = 200 mm</text>

        <path d="M232 82 A 78 78 0 0 0 232 218" fill="none" stroke="var(--ink)"
              stroke-width="7" stroke-linecap="round"/>
        <text x="256" y="154" font-size="11" fill="var(--ink)">placa</text>

        <path d="M228 88 L162 32 M228 212 L162 268" stroke="var(--live)" stroke-width="5"
              opacity=".45" stroke-linecap="round"/>
        <text x="150" y="26" text-anchor="end" font-size="10.5" fill="var(--live)">Q/2</text>
        <text x="150" y="272" text-anchor="end" font-size="10.5" fill="var(--live)">Q/2</text>

        <line x1="216" y1="150" x2="216" y2="46" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M216 92 A 58 58 0 0 1 172 108" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="188" y="88" text-anchor="middle" font-size="11" fill="var(--faint)">θ = 50°</text>

        <defs>
          <marker id="fu4f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      El agua sale **hacia atrás**, no hacia los lados: por eso la fuerza es
      mayor que si la placa se limitara a pararla. Y por eso la respuesta del
      apartado c) es 180°, donde el chorro se devolvería entero y la fuerza
      valdría el doble.

      </figcaption>
      </figure>
    pide: La fuerza sobre la placa y el ángulo que la hace máxima.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta para que el módulo de la velocidad no cambie entre
          la entrada y la salida del chorro?
        opciones:
          - texto: >-
              Que el chorro esté a presión atmosférica en todo su recorrido,
              que no cambie de cota y que no haya pérdidas
            correcta: true
            mensaje: |
              Eso es. Es Bernoulli entre la entrada y la salida: si la
              presión es la misma —la atmosférica— y la cota es la misma, y
              no se pierde carga, la altura cinética se conserva y con ella
              el módulo de la velocidad. Solo cambia la dirección.
          - texto: >-
              Que la placa sea perfectamente lisa
            mensaje: |
              Que sea lisa ayuda a que no haya pérdidas, pero es solo una de
              las tres condiciones, y ni siquiera la que más pesa. Faltan la
              presión atmosférica y la igualdad de cotas.
          - texto: >-
              Que el caudal se reparta exactamente por la mitad
            mensaje: |
              El reparto en dos mitades es un dato de simetría del problema y
              lo que hace es anular la componente transversal. No tiene nada
              que ver con que el **módulo** se conserve.

      - tipo: calcular
        titulo: La fuerza sobre la placa
        pregunta: |
          ¿Qué fuerza hay que ejercer sobre la placa para mantenerla fija, en
          kN?
        respuesta:
          tipo: magnitud
          valor: '22.19 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12.57 kN'
            mensaje: |
              Ese es $\rho Q v$, es decir la cantidad de movimiento que trae
              el chorro. Falta la que se lleva de vuelta: al salir hacia
              atrás, la placa tiene que **invertir** parte del movimiento, y
              eso añade $\rho Q v\sin\theta$.
          - valor: '8.08 kN'
            mensaje: |
              Parece que has usado $\rho Q v\,(1-\sin\theta)$. El chorro sale
              hacia atrás, no hacia adelante, así que su cantidad de
              movimiento en $x$ tiene signo contrario a la de entrada y las
              dos se **suman**.
          - valor: '25.13 kN'
            mensaje: |
              Ese es el máximo, el que se alcanzaría con
              $\theta = 90^{\circ}$. Con 50º todavía queda una parte del
              chorro yéndose hacia los lados sin empujar.
        pista: |
          Un volumen de control alrededor de la placa, eje $x$ en la dirección
          del chorro incidente. Las dos mitades salen con componente $-v
          \sin\theta$ en $x$.
        desarrollo: |
          $$
          Q = 20\cdot \frac{\pi\,0{,}2^{2}}{4} = 0{,}6283\ \text{m}^{3}/\text{s}
          \qquad
          \rho Q v = 12566\ \text{N}
          $$
          $$
          F_x = \rho Q v\,(1+\sin\theta)
          = 12566\,(1+0{,}766) = 22190\ \text{N}
          $$

      - tipo: calcular
        titulo: El ángulo que la hace máxima
        pregunta: |
          ¿Para qué ángulo $\theta$ sería máxima la fuerza, en grados?
        respuesta:
          tipo: numero
          valor: '90'
          tolerancia: 0.5
          formato: un número en grados
        distractores:
          - valor: '180'
            mensaje: |
              Cuidado con cómo está medido el ángulo. Aquí $\theta$ se toma
              desde la **vertical**, así que $\theta = 90^{\circ}$ ya
              significa que el chorro sale en sentido contrario al de
              entrada, es decir la vuelta completa.
          - valor: '45'
            mensaje: |
              Ese es el ángulo que maximiza un alcance balístico, no una
              fuerza. Aquí la fuerza es proporcional a $1+\sin\theta$, que
              crece de forma monótona hasta 90º.
          - valor: '0'
            mensaje: |
              Con $\theta = 0$ el chorro saldría perpendicular al de entrada,
              sin devolver nada de cantidad de movimiento, y la fuerza sería
              la mínima: $\rho Q v$.
        pista: |
          Escribe la fuerza en función de $\theta$ y mira dónde es máxima esa
          función.
        desarrollo: |
          $$
          F_x(\theta) = \rho Q v\,(1+\sin\theta)
          $$

          es máxima cuando $\sin\theta = 1$, es decir $\theta = 90^{\circ}$, y
          entonces

          $$
          F_{max} = 2\rho Q v = 25{,}13\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el chorro a presión atmosférica, sin cambio de cota y sin
              pérdidas, el módulo de la velocidad se conserva.
          - texto: >-
              Las dos mitades salen simétricas, así que sus componentes
              transversales se anulan y solo queda la del eje del chorro.
          - texto: >-
              La fuerza vale $\rho Q v\,(1+\sin\theta)$, que con 50º da 22,19
              kN y con 90º alcanza su máximo, 25,13 kN.
          - texto: >-
              Con $\theta = 90^{\circ}$ la fuerza sería infinita, porque el
              chorro se detendría por completo contra la placa.
            trampa: true
            mensaje: |
              El chorro no se detiene nunca: sale con el mismo módulo de
              velocidad, solo que en sentido contrario. Por eso el máximo es
              exactamente **el doble** de $\rho Q v$, no más. Ese factor 2 es
              el que explica la forma de cuchara de las cazoletas de una
              Pelton.
    resolucion: |
      **a) Las hipótesis.** Para que el módulo de la velocidad se conserve
      basta Bernoulli entre la entrada y la salida del chorro con los tres
      términos que quedan iguales: el chorro debe estar **a presión
      atmosférica** en todo su recorrido —es un chorro libre—, **sin variación
      de cota** entre entrada y salida, y **sin pérdidas** por rozamiento
      contra la placa. Entonces $v_1 = v_2$ y lo único que cambia es la
      dirección.

      **b) La fuerza.** Volumen de control alrededor de la placa, eje $x$ en
      la dirección del chorro incidente. Con
      $A = 0{,}031416\ \text{m}^{2}$ y $v = 20$ m/s:

      $$
      Q = 0{,}6283\ \text{m}^{3}/\text{s}
      \qquad
      \rho Q v = 12{,}566\ \text{kN}
      $$

      Las dos mitades salen simétricas —así que la componente transversal se
      anula— con componente en $x$ igual a $-v\sin\theta$. Aplicando el
      teorema de la cantidad de movimiento:

      $$
      F_x = \rho Q\bigl[v - (-v\sin\theta)\bigr]
      = \rho Q v\,(1+\sin\theta)
      = 22{,}19\ \text{kN}
      $$

      El chorro empuja la placa en el sentido de la corriente, así que para
      mantenerla fija hay que ejercer $22{,}19$ kN en sentido contrario.

      **c) El ángulo óptimo.** La fuerza depende de $\theta$ solo a través de
      $1+\sin\theta$, que crece de forma monótona hasta $\theta = 90^{\circ}$.
      Ahí el chorro sale exactamente en sentido contrario al que entró, y

      $$
      F_{max} = 2\rho Q v = 25{,}13\ \text{kN}
      $$

      **El factor dos, y dónde se ve.** El máximo es exactamente el doble de
      la fuerza de un chorro que simplemente se detuviera, y esa es la razón
      de la forma de las cazoletas de una turbina **Pelton**: dos cucharas
      simétricas que devuelven el agua casi 180º. No se puede hacer mejor;
      todo lo que se aleje de esa geometría cobra menos.

  # ── 5 (12,5 %) · Análisis dimensional del morro de un avión. Los tres
  #    números, la imposibilidad, y el ensayo que sí se puede hacer.
  - id: exflu2223-ext-5-el-morro-del-avion-en-el-tunel
    titulo: El morro del avión en el túnel, y los dos números que no caben juntos
    fuente: >-
      Ejercicio 5 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se pretende estudiar la variación de presión generada en el morro del
      fuselaje de un avión a una altitud de 12.000 m. Para ello se emplea en
      un laboratorio un túnel de viento con aire a 20 ºC y un modelo a escala
      $1{:}50$. La variación de presión depende de la velocidad del fluido,
      del módulo de compresibilidad del fluido $K$, de la densidad del fluido,
      de la viscosidad $\mu$ del fluido y de la dimensión $L$ de su morro.

      **a)** Determinar los parámetros adimensionales que definen el fenómeno
      descrito. Tomar $\rho$, $L$ y $v$ como variables repetidas.

      **b)** ¿Es posible obtener la semejanza dinámica absoluta entre modelo y
      prototipo?

      Para las pruebas del laboratorio se ha decidido prescindir de los
      efectos de la viscosidad. Se realiza una prueba en el túnel de viento
      con aire a 1000 km/h y la variación medida es de 43 kPa.

      **c)** Calcular la velocidad del aire y la variación de presión generada
      en la nariz del avión.

      Datos: $T$ (12 km) = 216,5 K; $p_{atm}$ (12 km) = 19,3 kPa;
      $\mu$ (12.000 m) $= 1{,}42\cdot 10^{-5}$ Pl;
      $\mu$ (0 m) $= 1{,}82\cdot 10^{-5}$ Pl;
      $R_{aire} = 287\ \text{J/(kg}\cdot\text{K)}$.

      Nota: el aire sigue procesos de compresión y expansión adiabáticos, de
      modo que su módulo de elasticidad es $K = 1{,}4\,p$, siendo $p$ su
      presión absoluta.
    pide: Los tres números adimensionales, si hay semejanza absoluta, y la velocidad y la presión en vuelo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Son seis variables —$\Delta p$, $v$, $K$, $\rho$, $\mu$, $L$— y tres
          dimensiones básicas. ¿Cuántos números adimensionales salen y qué
          son?
        opciones:
          - texto: >-
              Tres: el de Euler, el inverso del cuadrado de Mach y el inverso
              de Reynolds
            correcta: true
            mensaje: |
              Eso es. Buckingham da $6-3 = 3$, y con $\rho$, $L$ y $v$ como
              repetidas salen $\Delta p/(\rho v^{2})$,
              $K/(\rho v^{2})$ y $\mu/(\rho v L)$. Los dos últimos son
              exactamente Mach y Reynolds puestos del revés.
          - texto: >-
              Seis, uno por variable
            mensaje: |
              El teorema de Buckingham dice que salen $n-k$: seis variables
              menos tres dimensiones independientes, tres números.
          - texto: >-
              Dos, porque la viscosidad no interviene en un gas
            mensaje: |
              Interviene siempre; otra cosa es que se decida despreciarla,
              que es justo lo que hace el apartado c) **y lo dice
              explícitamente**. En el a) están las seis variables.

      - tipo: calcular
        titulo: La velocidad de vuelo
        pregunta: |
          Manteniendo el número que mide la compresibilidad, ¿a qué velocidad
          vuela el avión, en km/h?
        respuesta:
          tipo: magnitud
          valor: '859.6 km/h'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1163.4 km/h'
            mensaje: |
              Has puesto la raíz al revés. El aire de allá arriba está más
              frío, la velocidad del sonido es **menor**, y para el mismo
              Mach el avión vuela más despacio, no más deprisa.
          - valor: '20 km/h'
            mensaje: |
              Has aplicado la escala geométrica $1{:}50$ a la velocidad. La
              escala de velocidades no es la geométrica: la fija el número
              que se decida mantener, y aquí es el de compresibilidad.
        pista: |
          Con $K = 1{,}4p$ y $\rho = p/RT$, el número
          $K/(\rho v^{2})$ se reduce a $1{,}4RT/v^{2}$: la presión se va.
        desarrollo: |
          $$
          \frac{K}{\rho v^{2}} = \frac{1{,}4\,p}{\dfrac{p}{RT}\,v^{2}}
          = \frac{1{,}4\,R\,T}{v^{2}}
          $$

          Igualando modelo y prototipo, con $T_m = 293$ K y $T_p = 216{,}5$ K:

          $$
          v_p = v_m\sqrt{\frac{T_p}{T_m}}
          = 1000\sqrt{\frac{216{,}5}{293}} = 859{,}6\ \text{km/h}
          $$

      - tipo: calcular
        titulo: La variación de presión en vuelo
        pregunta: |
          ¿Cuánto vale $\Delta p$ en la nariz del avión, en kPa?
        respuesta:
          tipo: magnitud
          valor: '8.19 kPa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '43 kPa'
            mensaje: |
              Esa es la del túnel. El número que se conserva es
              $\Delta p/(\rho v^{2})$, no $\Delta p$ a secas, y arriba tanto
              la densidad como la velocidad son mucho menores.
          - valor: '31.8 kPa'
            mensaje: |
              Parece que has aplicado solo la relación de velocidades y has
              olvidado la de densidades. A 12 km el aire tiene
              $0{,}31\ \text{kg/m}^{3}$ frente a los $1{,}20$ del
              laboratorio, y esa es la parte que más pesa.
        pista: |
          $\Delta p/(\rho v^{2})$ igual en modelo y prototipo. La densidad de
          arriba sale de $p = \rho R T$.
        desarrollo: |
          $$
          \rho_p = \frac{19300}{287\cdot 216{,}5} = 0{,}3106\ \text{kg/m}^{3}
          \qquad
          \rho_m = \frac{101325}{287\cdot 293} = 1{,}205\ \text{kg/m}^{3}
          $$
          $$
          \Delta p_p = 43\,\frac{0{,}3106}{1{,}205}
          \Bigl(\frac{859{,}6}{1000}\Bigr)^{2} = 8{,}19\ \text{kPa}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La semejanza absoluta exigiría igualar a la vez
              $K/(\rho v^{2})$ y $\mu/(\rho v L)$.
          - texto: >-
              El primero fija la velocidad del modelo a partir de la
              temperatura, y ya no queda libertad para ajustar el segundo.
          - texto: >-
              Con la escala $1{:}50$ y las viscosidades dadas, los dos números
              no pueden coincidir a la vez, así que la semejanza absoluta es
              **imposible**.
          - texto: >-
              Aun así el ensayo no sirve para nada, porque sin semejanza
              absoluta los resultados no se pueden extrapolar.
            trampa: true
            mensaje: |
              Sirve, y de hecho es lo que hace el apartado c). Cuando no se
              pueden respetar los dos números se elige el que gobierna el
              fenómeno —aquí la compresibilidad, porque el morro de un avión
              a Mach alto es un problema de ondas, no de capa límite— y se
              acepta el error del otro. Eso es la semejanza **restringida**,
              y es lo normal en cualquier laboratorio.
    resolucion: |
      **a) Los tres números.** Seis variables y tres dimensiones dan tres
      grupos. Con $\rho$, $L$ y $v$ como repetidas:

      $$
      \pi_1 = \frac{\Delta p}{\rho v^{2}}
      \qquad
      \pi_2 = \frac{K}{\rho v^{2}}
      \qquad
      \pi_3 = \frac{\mu}{\rho v L}
      $$

      El primero es el número de **Euler**; el segundo es el inverso del
      cuadrado del de **Mach**; el tercero, el inverso del de **Reynolds**.

      **b) La semejanza absoluta.** Habría que igualar $\pi_2$ y $\pi_3$ a la
      vez. El $\pi_2$ fija la velocidad del modelo en cuanto se fija su
      temperatura, y entonces el $\pi_3$ queda sin ningún grado de libertad
      que ajustar: con la escala $1{:}50$ impuesta y las viscosidades dadas no
      se cumple. **Es imposible.**

      **c) El ensayo restringido.** Renunciando a la viscosidad, se conserva
      $\pi_2$. Y aquí conviene ver por qué ese número es Mach disfrazado: con
      $K = 1{,}4p$ y $\rho = p/RT$,

      $$
      \frac{K}{\rho v^{2}} = \frac{1{,}4\,R\,T}{v^{2}}
      $$

      La presión desaparece: solo queda la temperatura. Igualando:

      $$
      v_p = 1000\sqrt{\frac{216{,}5}{293}} = 859{,}6\ \text{km/h}
      $$

      Y con $\pi_1$, usando $\rho = p/RT$ arriba y la atmósfera normal en el
      laboratorio:

      $$
      \rho_p = 0{,}3106
      \qquad
      \rho_m = 1{,}205\ \text{kg/m}^{3}
      \qquad
      \Delta p_p = 43\cdot\frac{0{,}3106}{1{,}205}\cdot 0{,}7389
      = 8{,}19\ \text{kPa}
      $$

      **Lo que hay que llevarse.** El túnel sopla a 1000 km/h y mide 43 kPa;
      el avión vuela a 860 y sufre 8,2. No es que el modelo exagere: es que
      arriba hay cuatro veces menos aire. Y el ensayo es válido aunque el
      Reynolds no coincida, porque en un morro a alta velocidad manda la
      compresibilidad y no la capa límite. Elegir qué número respetar es la
      decisión de ingeniería del problema.

  # ── 6 (15 %) · Dos ramales en paralelo con el mismo caudal, y la zona de
  #    turbulencia completa donde el factor de fricción sale de von Kármán.
  - id: exflu2223-ext-6-los-dos-ramales-con-el-mismo-caudal
    titulo: Los dos ramales que llevan el mismo caudal, y la longitud que lo consigue
    fuente: >-
      Ejercicio 6 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En una pequeña instalación de bombeo se bombea etanol, cuya densidad
      relativa es $s = 0{,}789$ y su viscosidad $0{,}1074\ \text{mPa}\cdot$s.
      La potencia útil de la bomba es de 24 kW y su rendimiento del 46 %. Se
      maniobra la válvula de forma que se consigue que el caudal que circula
      por las tuberías 2 y 4 sea idéntico, y **superior a 20 l/s** en cada
      ramal.

      **a)** Calcular el factor de fricción de la tubería 4.

      **b)** Calcular el caudal bombeado y la altura manométrica de la bomba.

      **c)** Calcular la longitud de la tubería 3.

      Nota: longitudes equivalentes de las piezas especiales situadas en el
      conducto 2, 6 m. Longitud equivalente de la válvula, 10 m.

      | tubería | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | $L$ (m) | 15 | 50 | ?? | 125 |
      | $D$ (mm) | 75 | 75 | 75 | 100 |
      | material | PVC | PVC | PVC | hierro galvanizado |

      El circuito es cerrado: la bomba impulsa por la tubería 1 hasta un
      nudo; de ahí salen en paralelo la 2 y —pasando por la válvula— la 4,
      que se reúnen en un segundo nudo del que sale la 3 de vuelta al
      depósito.
    pide: El factor de fricción del ramal 4, el caudal, la altura de la bomba y la longitud que falta.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la tubería 4 el Reynolds ronda $2{,}3\cdot 10^{6}$ y la rugosidad
          relativa es $1{,}5\cdot 10^{-3}$. ¿Qué permite eso?
        opciones:
          - texto: >-
              Calcular el factor de fricción **sin iterar**, porque está en
              turbulencia completa y ya no depende del Reynolds
            correcta: true
            mensaje: |
              Eso es. Con esa rugosidad y ese Reynolds el punto cae en la
              zona horizontal del ábaco de Moody, donde vale
              $1/\sqrt{f} = 1{,}14 + 2\log(D/\varepsilon)$ y el caudal ya no
              interviene. Por eso el apartado a) se puede resolver antes que
              el b), aunque todavía no se sepa el caudal.
          - texto: >-
              Suponer flujo laminar y usar $f = 64/Re$
            mensaje: |
              Con $Re = 2{,}3\cdot 10^{6}$ el flujo es turbulento de sobra;
              la frontera está en 2000. Y $64/Re$ daría
              $2{,}8\cdot 10^{-5}$, mil veces menos de lo que sale.
          - texto: >-
              Despreciar las pérdidas en esa tubería
            mensaje: |
              Al contrario: la tubería 4 mide 125 m más 10 de válvula y se
              lleva 14 metros de carga. Es el ramal que más pesa del
              circuito.

      - tipo: calcular
        titulo: El factor de fricción de la tubería 4
        pregunta: |
          ¿Cuánto vale $f_4$?
        respuesta:
          tipo: numero
          valor: '0.02171'
          tolerancia: 0.0004
          formato: un número
        distractores:
          - valor: '0.0112'
            mensaje: |
              Has usado la rugosidad del PVC. La tubería 4 es la única de
              **hierro galvanizado**, con $\varepsilon = 0{,}015$ cm frente a
              los $0{,}0007$ del PVC: veinte veces más.
          - valor: '0.0234'
            mensaje: |
              Has usado un diámetro de 75 mm. La tubería 4 es la de 100, y
              lo que entra en la fórmula es $D/\varepsilon$.
        pista: |
          En turbulencia completa,
          $1/\sqrt{f} = 1{,}14 + 2\log_{10}(D/\varepsilon)$.
        desarrollo: |
          $$
          \frac{D}{\varepsilon} = \frac{0{,}1}{0{,}00015} = 666{,}7
          $$
          $$
          \frac{1}{\sqrt{f_4}} = 1{,}14 + 2\log_{10}666{,}7 = 6{,}788
          \;\Longrightarrow\;
          f_4 = 0{,}02171
          $$

      - tipo: calcular
        titulo: El caudal bombeado
        pregunta: |
          ¿Cuánto vale el caudal total $Q_1$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '48.32 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '24.16 l/s'
            mensaje: |
              Ese es el caudal de **cada ramal**. El de la bomba es la suma
              de los dos, porque las tuberías 2 y 4 están en paralelo.
          - valor: '96.64 l/s'
            mensaje: |
              Has duplicado dos veces. Cada ramal lleva 24,16 l/s y hay dos
              ramales.
        pista: |
          Los dos ramales están en paralelo, así que pierden lo mismo. Impón
          además que lleven el mismo caudal y saldrá el valor de $f_2$; de
          ahí, por Colebrook, el Reynolds y la velocidad.
        desarrollo: |
          Igualando pérdidas con el mismo caudal en los dos ramales,

          $$
          f_2\,\frac{L_2^{eq}}{D_2}\,\frac{1}{A_2^{2}}
          = f_4\,\frac{L_4^{eq}}{D_4}\,\frac{1}{A_4^{2}}
          $$

          con $L_2^{eq} = 50+6 = 56$ m y $L_4^{eq} = 125+10 = 135$ m sale
          $f_2 = 0{,}01242$, y de ahí, por Colebrook en PVC,
          $Re_2 \approx 3{,}0\cdot 10^{6}$, es decir $24{,}16$ l/s por ramal
          y $48{,}32$ l/s en total.

      - tipo: calcular
        titulo: La altura manométrica
        pregunta: |
          ¿Cuánto vale $H_m$, en metros?
        respuesta:
          tipo: magnitud
          valor: '64.24 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '29.55 m'
            mensaje: |
              Has multiplicado los 24 kW por el rendimiento. El enunciado dice
              que esos 24 kW son la potencia **útil**, es decir la que ya
              llega al fluido; el 46 % serviría para saber cuánto se paga en
              la acometida, no para esta cuenta.
          - valor: '50.68 m'
            mensaje: |
              Has usado el peso específico del agua. El fluido es etanol,
              $\gamma = 7732\ \text{N/m}^{3}$, y con menos peso específico la
              misma potencia da más altura.
        pista: |
          $P_{util} = \gamma\,Q\,H_m$, con el caudal total.
        desarrollo: |
          $$
          H_m = \frac{24000}{7732\cdot 0{,}04832} = 64{,}24\ \text{m}
          $$

      - tipo: calcular
        titulo: La longitud que falta
        pregunta: |
          ¿Cuánto mide la tubería 3, en metros?
        respuesta:
          tipo: magnitud
          valor: '35.49 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '50.7 m'
            mensaje: |
              Te has dejado la pérdida de la tubería 1, que son casi 15 m. Es
              corta —15 m— pero lleva el caudal entero por un diámetro de
              75 mm, y ahí la velocidad es de 11 m/s.
          - valor: '21.2 m'
            mensaje: |
              Has sumado las pérdidas de los dos ramales en paralelo. En un
              paralelo la pérdida es la de **uno** de los ramales, no la
              suma: los dos tienen los mismos extremos.
        pista: |
          El circuito es cerrado, así que $H_m$ se gasta entera en pérdidas:
          la de la 1, la del paralelo y la de la 3.
        desarrollo: |
          $$
          h_1 = 14{,}82\ \text{m}
          \qquad
          h_{paralelo} = h_4 = 14{,}15\ \text{m}
          $$
          $$
          h_3 = 64{,}24-14{,}82-14{,}15 = 35{,}27\ \text{m}
          $$

          y con la tubería 3 igual que la 1 —mismo diámetro, mismo caudal,
          mismo $f$— cada metro cuesta $0{,}988$ m de carga, así que

          $$
          L_3 = 35{,}49\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La tubería 4 está en turbulencia completa, así que su $f$ sale
              de $D/\varepsilon$ sin conocer el caudal.
          - texto: >-
              Imponer que los dos ramales lleven el mismo caudal **y** pierdan
              lo mismo fija el factor de fricción del ramal 2, y con él el
              caudal.
          - texto: >-
              Con el caudal total y la potencia útil sale $H_m$, y lo que le
              sobra tras descontar la 1 y el paralelo es la pérdida de la 3.
          - texto: >-
              Como los dos ramales llevan el mismo caudal, la válvula está
              totalmente abierta.
            trampa: true
            mensaje: |
              Al revés: la válvula está regulada **precisamente** para
              conseguirlo. El ramal 4 es más largo pero más ancho, y sin la
              válvula —cuyos 10 m equivalentes están en el dato— los caudales
              no serían iguales. Que dos ramales en paralelo lleven lo mismo
              es una casualidad que hay que fabricar.
    resolucion: |
      **a) El factor de fricción del ramal 4.** Merece la pena empezar por
      aquí porque es el único que se puede calcular **sin saber el caudal**.
      La tubería 4 es de hierro galvanizado, $\varepsilon = 0{,}015$ cm, y
      mide 100 mm, así que $\varepsilon/D = 1{,}5\cdot 10^{-3}$. Con el etanol
      del enunciado el Reynolds ronda $2{,}3\cdot 10^{6}$, y ese punto cae en
      la zona de **turbulencia completa** del ábaco de Moody, donde el factor
      ya no depende del Reynolds:

      $$
      \frac{1}{\sqrt{f_4}} = 1{,}14 + 2\log_{10}\frac{D}{\varepsilon}
      = 1{,}14 + 2\log_{10}666{,}7 = 6{,}788
      \qquad
      f_4 = 0{,}02171
      $$

      **b) El caudal.** Los ramales 2 y 4 están en paralelo, así que pierden
      lo mismo; y el enunciado añade que llevan **el mismo caudal**. Las dos
      condiciones juntas dejan una sola ecuación, que fija $f_2$:

      $$
      f_2\,\frac{56}{0{,}075}\,\frac{1}{A_2^{2}}
      = f_4\,\frac{135}{0{,}1}\,\frac{1}{A_4^{2}}
      \qquad\Longrightarrow\qquad
      f_2 = 0{,}01242
      $$

      Y con ese $f_2$, Colebrook en PVC devuelve el Reynolds, y de ahí la
      velocidad: $24{,}16$ l/s por ramal, $Q_1 = 48{,}32$ l/s en total.

      Con la potencia **útil** —los 24 kW ya son los que llegan al fluido; el
      rendimiento del 46 % serviría para la factura, no para esto—:

      $$
      H_m = \frac{24000}{7732\cdot 0{,}04832} = 64{,}24\ \text{m}
      $$

      **c) La longitud de la 3.** El circuito es cerrado, así que toda la
      altura manométrica se gasta en pérdidas. Descontando la tubería 1
      —14,82 m— y el paralelo —14,15 m, que es la de **uno** de los dos
      ramales, no la suma— quedan 35,27 m para la tubería 3, que a 0,988 m de
      carga por metro de tubo son

      $$
      L_3 = 35{,}49\ \text{m}
      $$

      **Una advertencia sobre este ejercicio.** La determinación del caudal es
      **hipersensible**: $f_2$ depende del Reynolds tan débilmente que un
      error del 0,1 % en el factor de fricción mueve el caudal un 0,5 %.
      Nuestra reconstrucción da 48,58 l/s frente a los 48,32 publicados —medio
      por ciento— y 35,69 m frente a 35,49. No es un desacuerdo de física: es
      la aritmética de una ecuación mal condicionada, y conviene saber que
      está ahí antes de perseguir la cuarta cifra.

  # ── 7 (15 %) · Tres canales encadenados. Manning tres veces, con la
  #    sección óptima, un trapecio dado y una media caña comercial.
  - id: exflu2223-ext-7-los-tres-canales-encadenados
    titulo: Tres canales encadenados, y el diámetro que hay que redondear
    fuente: >-
      Ejercicio 7 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se muestra una red de canales con tres tramos, todos con revestimiento
      de hormigón (hormigón acabado). Un tramo AC (**CANAL 1**) con un canal
      rectangular, otro tramo BC (**CANAL 2**) de sección trapezoidal y un
      tercer tramo CD (**CANAL 3**), de sección semicircular. El primer tramo
      transporta un caudal $Q_1 = 50$ l/s y el segundo tramo un caudal
      $Q_2 = 700$ l/s. Se pide:

      **a)** Si el CANAL 1, de 10 km de longitud, tiene una cota inicial de
      120 m y una cota final de 110 m, determinar el ancho $B_1$ y la altura
      total $H_1$ del canal para que este sea hidráulicamente óptimo al
      diseñarlo con un resguardo $T_1$ de 30 cm.

      **b)** El CANAL 2, de 12 km, se quiere diseñar para una profundidad
      $H_2 = 1{,}0$ m, un ancho $B_2$ de 0,6 m, una pendiente lateral
      $Z_2 = 1{,}5$ y un resguardo $T_2$ de 20 cm. Determinar la cota mínima
      a la que debe ubicarse el inicio del canal para transportar el caudal
      correspondiente.

      **c)** El CANAL 3, de 3 km, finaliza a una cota de 100 m. Determinar el
      diámetro de la sección semicircular para que transporte el caudal
      correspondiente y, además, el resguardo mínimo sea mayor que el 20 % de
      $R_3$. Considérese que los diámetros disponibles tienen valores
      proporcionales a 10 cm.
    pide: Las dimensiones de los tres canales, con sus resguardos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres canales llevan «resguardo». ¿Qué es y cómo entra en las
          cuentas?
        opciones:
          - texto: >-
              Es el borde libre por encima del agua, así que el calado de
              cálculo es la altura total menos el resguardo
            correcta: true
            mensaje: |
              Eso es. El resguardo no lleva agua: está para absorber olas,
              crecidas y errores de estimación. En Manning entra el calado
              real, y la altura total del canal es ese calado más el
              resguardo.
          - texto: >-
              Es la profundidad del agua, y la altura total es el resguardo
              más el ancho
            mensaje: |
              Está al revés. El resguardo es lo que **sobra** por encima del
              agua, no el agua.
          - texto: >-
              Es un coeficiente de seguridad que multiplica al caudal
            mensaje: |
              No es un coeficiente: es una longitud, y se suma al calado, no
              multiplica a nada.

      - tipo: calcular
        titulo: El ancho del canal rectangular óptimo
        pregunta: |
          ¿Cuánto vale $B_1$, en centímetros?
        respuesta:
          tipo: magnitud
          valor: '41.5 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '34.8 cm'
            mensaje: |
              Has tomado $R_h = y$ en vez de $y/2$. En el rectángulo óptimo
              el radio hidráulico es exactamente la mitad del calado, y
              entra elevado a $2/3$.
          - valor: '45.1 cm'
            mensaje: |
              Has usado $n = 0{,}015$, el del hormigón **en bruto**. El
              enunciado dice hormigón **acabado**, que en el cuadro n.º 26 es
              $n = 0{,}012$.
        pista: |
          La sección óptima rectangular cumple $b = 2y$ y $R_h = y/2$, y la
          pendiente es $10/10000$.
        desarrollo: |
          $$
          S = \frac{120-110}{10000} = 10^{-3}
          \qquad
          A = 2y^{2}
          \qquad
          R_h = \frac{y}{2}
          $$
          $$
          Q = \frac{1}{0{,}012}\,2y^{2}\Bigl(\frac{y}{2}\Bigr)^{2/3}
          \sqrt{10^{-3}} = 3{,}320\,y^{8/3} = 0{,}05
          $$
          $$
          y = 0{,}2074\ \text{m}
          \qquad
          B_1 = 2y = 41{,}5\ \text{cm}
          \qquad
          H_1 = 0{,}2074+0{,}30 = 50{,}7\ \text{cm}
          $$

      - tipo: calcular
        titulo: La cota de arranque del canal trapezoidal
        pregunta: |
          ¿A qué cota mínima debe empezar el CANAL 2, en metros?
        respuesta:
          tipo: numero
          valor: '111.33'
          tolerancia: 0.05
          formato: un número en metros
        distractores:
          - valor: '110.48'
            mensaje: |
              Te has dejado el resguardo y has calculado con el metro entero
              de profundidad. El agua solo ocupa $1{,}0-0{,}2 = 0{,}8$ m, y
              con menos sección hace falta más pendiente.
          - valor: '114.03'
            mensaje: |
              Has tomado $Z_2 = 1{,}5$ como vertical partido por horizontal.
              La pendiente lateral se da al revés: por cada metro de altura,
              1,5 de retranqueo horizontal.
        pista: |
          Área y perímetro del trapecio con $y = 0{,}8$ m, después Manning
          para despejar la pendiente, y esa por los 12 km.
        desarrollo: |
          $$
          A = (B_2+Z y)\,y = (0{,}6+1{,}2)\cdot 0{,}8 = 1{,}44\ \text{m}^{2}
          $$
          $$
          P = B_2+2y\sqrt{1+Z^{2}} = 0{,}6+1{,}6\cdot 1{,}803 = 3{,}484\ \text{m}
          \qquad
          R_h = 0{,}4133\ \text{m}
          $$
          $$
          0{,}7 = \frac{1{,}44}{0{,}012}\,0{,}5548\,\sqrt{S}
          \;\Longrightarrow\;
          S = 1{,}106\cdot 10^{-4}
          $$
          $$
          \Delta z = 1{,}106\cdot 10^{-4}\cdot 12000 = 1{,}33\ \text{m}
          \qquad
          z = 110+1{,}33 = 111{,}33\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro comercial de la media caña
        pregunta: |
          ¿Qué diámetro hay que elegir para el CANAL 3, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.2 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1 m'
            mensaje: |
              Ese es el diámetro que sale si se deja la media caña llena
              hasta arriba, sin resguardo. La condición pide que sobre más
              del 20 % del radio, es decir que el agua no pase de $0{,}8R$.
          - valor: '0.6 m'
            mensaje: |
              Has dado el **radio** que sale del cálculo —0,58 m— en vez del
              diámetro, y además sin redondear al múltiplo de 10 cm.
        pista: |
          El caudal del canal 3 es la suma de los otros dos. Y la condición
          del resguardo se traduce en calado máximo $y = 0{,}8R$.
        desarrollo: |
          $$
          Q_3 = 0{,}05+0{,}70 = 0{,}75\ \text{m}^{3}/\text{s}
          \qquad
          S = \frac{110-100}{3000} = 3{,}33\cdot 10^{-3}
          $$

          Con $y = 0{,}8R$, el ángulo mojado es $\theta = 2{,}739$ rad, y

          $$
          A = 1{,}1735\,R^{2}
          \qquad
          P = 2{,}739\,R
          \qquad
          R_h = 0{,}4285\,R
          $$
          $$
          Q = \frac{1{,}1735}{0{,}012}\,(0{,}4285R)^{2/3}\sqrt{S}\;R^{2}
          = 3{,}208\,R^{8/3} = 0{,}75
          $$
          $$
          R = 0{,}580\ \text{m}
          \qquad
          D = 1{,}16\ \text{m}
          \;\longrightarrow\;
          D_{com} = 1{,}2\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En los tres tramos la pendiente sale de las cotas y la longitud,
              y el revestimiento fija $n = 0{,}012$.
          - texto: >-
              El canal 3 recibe la suma de los dos anteriores, 750 l/s, y
              arranca en la cota final del canal 1.
          - texto: >-
              La condición de resguardo del canal 3 limita el calado a
              $0{,}8R$, y con esa geometría el radio sale 0,58 m.
          - texto: >-
              Como el diámetro calculado es 1,16 m, se elige el comercial
              inmediatamente inferior, 1,1 m, que es el que menos material
              gasta.
            trampa: true
            mensaje: |
              Hacia abajo nunca. Un canal más pequeño que el calculado no
              lleva el caudal: o desborda, o incumple el resguardo. Al
              redondear una **capacidad** siempre se sube al comercial
              siguiente, aquí 1,2 m, y el margen que sobra se apunta como
              seguridad, no como desperdicio.
    resolucion: |
      **El dato común.** Los tres canales son de hormigón acabado, que en el
      cuadro n.º 26 es $n = 0{,}012$. Y en los tres, el resguardo se resta de
      la altura total para obtener el calado que entra en Manning.

      **a) El canal rectangular óptimo.** Con
      $S = 10/10000 = 10^{-3}$ y la sección óptima —$b = 2y$, $R_h = y/2$—:

      $$
      Q = \frac{1}{n}\,2y^{2}\Bigl(\frac{y}{2}\Bigr)^{2/3}\sqrt{S}
      = 3{,}320\,y^{8/3} = 0{,}05
      \;\Longrightarrow\;
      y = 20{,}74\ \text{cm}
      $$
      $$
      B_1 = 41{,}5\ \text{cm}
      \qquad
      H_1 = 20{,}74+30 = 50{,}7\ \text{cm}
      $$

      **b) El trapecio.** Aquí la geometría está toda dada y la incógnita es
      la pendiente. Con $y = 1{,}0-0{,}2 = 0{,}8$ m y $Z = 1{,}5$:

      $$
      A = 1{,}44\ \text{m}^{2}
      \qquad
      P = 3{,}484\ \text{m}
      \qquad
      R_h = 0{,}4133\ \text{m}
      $$

      Despejando de Manning con $Q = 0{,}7\ \text{m}^{3}/\text{s}$ sale
      $S = 1{,}106\cdot 10^{-4}$, que en 12 km son 1,33 m de desnivel. Como
      el canal termina en C, a la cota 110, debe empezar en

      $$
      z = 111{,}33\ \text{m}
      $$

      **c) La media caña.** El canal 3 recoge los dos anteriores,
      $Q_3 = 750$ l/s, y baja de 110 a 100 en 3 km:
      $S = 3{,}33\cdot 10^{-3}$.

      La condición «el resguardo mínimo sea mayor que el 20 % de $R_3$» dice
      que el agua no puede pasar de $0{,}8R$. Con ese calado, la geometría
      circular da $\theta = 2{,}739$ rad, $A = 1{,}1735R^{2}$ y
      $R_h = 0{,}4285R$, y Manning queda

      $$
      Q = 3{,}208\,R^{8/3} = 0{,}75
      \;\Longrightarrow\;
      R = 0{,}580\ \text{m}
      \qquad
      D = 1{,}16\ \text{m}
      $$

      Y como los diámetros disponibles van de 10 en 10 centímetros, se elige
      **hacia arriba**: $D_{com} = 1{,}2$ m. Con ese diámetro el canal lleva
      el caudal con el calado por debajo de $0{,}8R$ y el resguardo sobrado.

      **Lo que enseña el conjunto.** Los tres apartados son la misma fórmula
      con la incógnita cambiada de sitio: en el a) se buscan las dimensiones,
      en el b) la pendiente, en el c) el diámetro. Manning tiene cuatro
      variables —caudal, sección, radio y pendiente— y un problema de canales
      consiste casi siempre en saber cuál de las cuatro es el dato que falta.

  # ── 8 (15 %) · Elegir bomba entre tres modelos, y ajustar una válvula
  #    para que el nivel de un depósito no se mueva.
  - id: exflu2223-ext-8-elegir-la-bomba-entre-tres-modelos
    titulo: Elegir la bomba entre tres modelos, y ajustar la válvula para que el nivel no se mueva
    fuente: >-
      Ejercicio 8 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El depósito A se utilizará para suministrar un caudal de agua constante
      $Q_{sal} = 300$ l/s a una aplicación industrial. Se pretende mantener
      constante el nivel del agua en el depósito A y para ello se va a diseñar
      un sistema de suministro de agua desde los depósitos B y C hacia el
      depósito A. La tubería 1 une el depósito B con A y está desprovista de
      elementos que generen pérdidas de carga menores. La tubería 2 une el
      depósito C con A y contiene una válvula reguladora V que genera pérdidas
      de carga no despreciables. Ambas tuberías son de PVC.

      | tubería | $L$ (m) | $D$ (mm) |
      |---|---|---|
      | 1 | 100 | 225 |
      | 2 | 200 | 250 |

      Las superficies libres están en las cotas 30 (depósito A), 15 (depósito
      B) y 12 (depósito C).

      Para realizar el bombeo se tienen a disposición 3 turbobombas, con
      $H_{m,tb} = A - B\,Q^{2}$ (mca; l/s):

      | modelo | $A$ (mca) | $B$ |
      |---|---|---|
      | M1 | 20 | $3{,}0\cdot 10^{-4}$ |
      | M2 | 30 | $3{,}5\cdot 10^{-4}$ |
      | M3 | 40 | $4{,}0\cdot 10^{-4}$ |

      Se pide resolver analíticamente, utilizando la expresión de
      **Hazen-Williams**:

      **a)** Deducir la expresión analítica de la curva característica de la
      instalación que bombea agua desde B hacia A.

      **b)** Seleccionar justificadamente el modelo de bomba que se empleará
      para que el caudal suministrado desde B sea al menos la mitad de
      $Q_{sal}$, y menor que 200 l/s. Indicar el punto de funcionamiento.

      **c)** De instalarse en la tubería 2 una bomba idéntica a la
      seleccionada, indicar el valor requerido para el factor de paso
      $k_{válv}$ de la válvula reguladora para que el nivel del depósito A
      permanezca constante.

      **d)** Si en un momento dado aumentase el nivel del agua en el depósito
      A en dos metros por causas ajenas al bombeo, y aun así se mantuviese
      constante el caudal de salida $Q_{sal}$ y el factor de paso
      $k_{válv}$, ¿cuál pasaría a ser el nuevo caudal entrante en el depósito
      A? ¿Se revertiría la situación inicial?
    pide: La curva de la instalación, el modelo de bomba, el ajuste de la válvula y qué pasa si sube el nivel.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Mantener constante el nivel del depósito A» ¿qué condición impone?
        opciones:
          - texto: >-
              Que la suma de los dos caudales entrantes sea exactamente los
              300 l/s que salen
            correcta: true
            mensaje: |
              Eso es, y es lo que convierte el apartado c) en una ecuación
              con una sola incógnita. Elegida la bomba, el caudal de la
              tubería 1 queda fijado, y el que falta hasta 300 tiene que
              venir por la 2: la válvula se ajusta para que salga
              exactamente ese.
          - texto: >-
              Que los dos caudales entrantes sean iguales
            mensaje: |
              No hay ninguna razón para que lo sean, y de hecho no lo son:
              163,45 por una y 136,55 por la otra. Lo que tiene que cuadrar
              es la **suma**.
          - texto: >-
              Que la bomba de la tubería 2 tenga la misma altura manométrica
              que la de la 1
            mensaje: |
              Son la misma bomba —lo dice el apartado c)— pero trabajando en
              puntos distintos de su curva, porque las dos instalaciones son
              distintas. Alturas distintas, caudales distintos.

      - tipo: calcular
        titulo: La curva de la instalación desde B
        pregunta: |
          Escrita como $h = 15 + a\cdot 10^{-4}Q^{1{,}852}$ con $Q$ en l/s,
          ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '4.5'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '3.96'
            mensaje: |
              Has usado $C_{HW} = 150$. Con $\varepsilon/D = 3{,}1\cdot
              10^{-5}$ la banda del cuadro n.º 25 es la de **140**; la de 150
              es para $\varepsilon/D \le 1{,}5\cdot 10^{-5}$.
          - valor: '9.01'
            mensaje: |
              Has usado 200 m de longitud, que es la de la tubería **2**. La
              que une B con A mide 100 m y tiene 225 de diámetro.
        pista: |
          $J_1 = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D_{mm}^{4{,}87})$, y la
          altura geométrica es la diferencia entre las superficies libres.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{7\cdot 10^{-6}}{0{,}225}
          = 3{,}1\cdot 10^{-5}
          \;\Longrightarrow\;
          C_{HW} = 140
          $$
          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}{140^{1{,}852}\cdot 225^{4{,}87}}
          = 4{,}504\cdot 10^{-6}
          $$
          $$
          h_{mi} = 15 + 4{,}5\cdot 10^{-4}\,Q^{1{,}852}
          $$

      - tipo: calcular
        titulo: El punto de funcionamiento con la bomba elegida
        pregunta: |
          Con el modelo que cumple las dos condiciones, ¿qué caudal circula
          por la tubería 1, en l/s?
        respuesta:
          tipo: magnitud
          valor: '163.45 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '97.3 l/s'
            mensaje: |
              Ese es el punto de la M1, y se descarta porque no llega a la
              mitad de $Q_{sal}$: hacen falta al menos 150 l/s.
          - valor: '203 l/s'
            mensaje: |
              Ese es el punto de la M3, y se descarta por pasarse: el
              enunciado pide menos de 200 l/s.
        pista: |
          Cortar cada curva de bomba con
          $15 + 4{,}5\cdot 10^{-4}Q^{1{,}852}$ y quedarse con la que caiga
          entre 150 y 200 l/s.
        desarrollo: |
          $$
          30 - 3{,}5\cdot 10^{-4}Q^{2} = 15 + 4{,}5\cdot 10^{-4}Q^{1{,}852}
          $$

          Tanteando, $Q = 163{,}45$ l/s, y entonces

          $$
          H_m = 30-3{,}5\cdot 10^{-4}\cdot 163{,}45^{2} = 20{,}65\ \text{m}
          $$

      - tipo: calcular
        titulo: El factor de paso de la válvula
        pregunta: |
          ¿Qué $k_{válv}$ hace falta para que el nivel de A no se mueva?
        respuesta:
          tipo: numero
          valor: '1.546'
          tolerancia: 0.06
          formato: un número
        distractores:
          - valor: '13.86'
            mensaje: |
              Te has dejado el rozamiento de la tubería 2. De los 5,47 m que
              le sobran a la bomba, 4,86 se los come la tubería y solo 0,62
              quedan para la válvula.
          - valor: '0.62'
            mensaje: |
              Esa es la **altura** que tiene que disipar la válvula, en
              metros, no su factor de paso. Para pasar de una a otro hay que
              dividir entre la altura cinética, $v^{2}/2g$.
        pista: |
          El caudal que falta es $300-163{,}45$. Con él, mira cuánto da la
          bomba y cuánto piden el desnivel y la tubería; lo que sobra es de la
          válvula.
        desarrollo: |
          $$
          Q_2 = 300-163{,}45 = 136{,}55\ \text{l/s}
          $$
          $$
          H_{bomba} = 30-3{,}5\cdot 10^{-4}\cdot 136{,}55^{2} = 23{,}47\ \text{m}
          $$
          $$
          18 + 5{,}39\cdot 10^{-4}\cdot 136{,}55^{1{,}852} = 22{,}86\ \text{m}
          $$
          $$
          k_{válv}\,\frac{v^{2}}{2g} = 0{,}62\ \text{m}
          \;\Longrightarrow\;
          k_{válv} = 1{,}546
          $$

      - tipo: calcular
        titulo: El caudal que entra si A sube dos metros
        pregunta: |
          Si el nivel de A sube a la cota 32, ¿cuánto entra por la tubería 1,
          en l/s?
        respuesta:
          tipo: magnitud
          valor: '151.82 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '163.45 l/s'
            mensaje: |
              Ese es el caudal de antes. Al subir A, la altura geométrica de
              la instalación pasa de 15 a 17 m, la curva sube dos metros
              enteros y el corte con la bomba se desplaza a la izquierda.
          - valor: '174.2 l/s'
            mensaje: |
              Has bajado el nivel en vez de subirlo. Si A subiera menos, la
              bomba tendría que trabajar menos y daría más caudal; como sube,
              da menos.
        pista: |
          Lo único que cambia es la altura geométrica: 15 pasa a 17.
        desarrollo: |
          $$
          30-3{,}5\cdot 10^{-4}Q^{2} = 17+4{,}5\cdot 10^{-4}Q^{1{,}852}
          \;\Longrightarrow\;
          Q_1 = 151{,}82\ \text{l/s}
          $$

          Y con la tubería 2, cuya altura geométrica pasa de 18 a 20 y cuya
          válvula sigue en $k = 1{,}546$, sale $Q_2 = 124{,}36$ l/s.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              Al subir A dos metros, las dos instalaciones piden dos metros
              más de altura y los dos caudales bajan.
          - texto: >-
              Entran $151{,}82+124{,}36 = 276{,}18$ l/s y siguen saliendo 300.
          - texto: >-
              Como entra menos de lo que sale, el nivel de A baja, y al bajar
              vuelven a subir los caudales hasta recuperar los 300 l/s.
          - texto: >-
              Habría que cerrar más la válvula para que el sistema volviera a
              su sitio.
            trampa: true
            mensaje: |
              No hace falta tocar nada: el sistema se corrige solo, y esa es
              justamente la respuesta a «¿se revertiría la situación
              inicial?». Cerrar la válvula empeoraría las cosas, porque
              quitaría todavía más caudal por la tubería 2. Un sistema con
              realimentación negativa se estabiliza sin ayuda; identificarlo
              es la mitad de la respuesta.
    resolucion: |
      **a) La curva de la instalación desde B.** Altura geométrica
      $30-15 = 15$ m, y las pérdidas por Hazen-Williams. El PVC de 225 mm da
      $\varepsilon/D = 3{,}1\cdot 10^{-5}$, que en el cuadro n.º 25 cae en la
      banda de $C_{HW} = 140$ —no en la de 150, que exige
      $\varepsilon/D \le 1{,}5\cdot 10^{-5}$—:

      $$
      h_{mi} = 15 + 4{,}5\cdot 10^{-4}\,Q^{1{,}852}
      \qquad (\text{mca}; \text{l/s})
      $$

      **b) La bomba.** Cortando esa curva con las tres:

      | modelo | punto de corte |
      |---|---|
      | M1 | 97 l/s — **se queda corta**, no llega a 150 |
      | M2 | 163,45 l/s y 20,65 m — **vale** |
      | M3 | 203 l/s — **se pasa** de los 200 |

      Se elige la **M2**.

      **c) La válvula.** Para que el nivel de A no se mueva, la tubería 2 debe
      aportar $300-163{,}45 = 136{,}55$ l/s. Con la misma bomba M2 a ese
      caudal:

      $$
      H_{bomba} = 23{,}47\ \text{m}
      \qquad
      18 + h_{f2} = 22{,}86\ \text{m}
      $$

      Le sobran 0,62 m, y esos son los que tiene que quemar la válvula:

      $$
      k_{válv}\,\frac{v^{2}}{2g} = 0{,}62
      \;\Longrightarrow\;
      k_{válv} = 1{,}546
      $$

      **d) Si A sube dos metros.** Lo único que cambia es la altura
      geométrica de las dos instalaciones: 15 pasa a 17 y 18 pasa a 20. Las
      dos curvas suben dos metros y los dos puntos de funcionamiento se
      desplazan a la izquierda:

      $$
      Q_1 = 151{,}82\ \text{l/s}
      \qquad
      Q_2 = 124{,}36\ \text{l/s}
      \qquad
      Q_1+Q_2 = 276{,}18\ \text{l/s}
      $$

      Entran 276 y salen 300, así que **el depósito se vacía**. Y al vaciarse
      baja su nivel, y al bajar el nivel las dos instalaciones vuelven a pedir
      menos altura y los caudales suben: el sistema regresa por sí solo a la
      situación inicial. **Sí se revierte, y sin tocar nada.**

      **Lo que enseña.** Un depósito intermedio entre bombas es un regulador
      automático. La perturbación —dos metros de más— produce un desequilibrio
      cuyo efecto es exactamente el que la deshace. Reconocer ese signo, el de
      la realimentación negativa, es lo que separa «calcular el nuevo caudal»
      de «entender la instalación».

  # ── 9 (5 %) · La tabla de acción y reacción. El tema 23 la anticipaba.
  - id: exflu2223-ext-9-accion-y-reaccion-en-una-tabla
    titulo: Acción y reacción, fila por fila
    fuente: >-
      Ejercicio 9 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica la tabla resuelta.
    nivel: examen
    enunciado: |
      Rellenar la siguiente tabla de diferencias fundamentales entre turbinas:

      | | turbinas de acción | turbinas de reacción |
      |---|---|---|
      | tipos (nombres) | | |
      | admisión | | |
      | elementos | | |
      | tipo de energía aportada | | |
      | campo de trabajo $Q/H$ | | |
      | tipo de central (localización) | | |
    pide: Las seis filas de la tabla, para las dos familias.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué separa exactamente a una turbina de acción de una de reacción?
        opciones:
          - texto: >-
              El tipo de energía con que el agua llega al rodete: solo
              cinética en la de acción, cinética y de presión en la de
              reacción
            correcta: true
            mensaje: |
              Eso es, y de ahí sale todo lo demás. Si el agua llega ya a
              presión atmosférica, el rodete solo puede recibir energía
              cinética, entra por puntos y no necesita tubo difusor. Si llega
              con presión, entra por toda la periferia y hay que recuperar la
              energía que le queda a la salida.
          - texto: >-
              Que en una el agua empuja y en la otra reacciona contra el
              álabe
            mensaje: |
              En las dos el agua empuja. El nombre despista, y es el error
              típico del tema: «de reacción» no describe la fuerza, describe
              **con qué energía llega el agua**.
          - texto: >-
              El tamaño: las de acción son grandes y las de reacción pequeñas
            mensaje: |
              No es el tamaño sino el campo de trabajo, y va al revés de lo
              que sugiere la frase: las de acción son para mucho salto y poco
              caudal, y las de reacción para poco salto y mucho caudal.

      - tipo: calcular
        titulo: Los elementos de una turbina de reacción
        pregunta: |
          ¿Cuántos elementos tiene el conjunto de una turbina de reacción,
          según la tabla del tema?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Esos son los de la turbina de **acción**: inyector y rodete, y
              nada más. Precisamente por eso una Pelton es tan simple de
              mantener.
          - valor: '4'
            mensaje: |
              Te falta uno, y casi siempre es el **antedistribuidor**, que se
              confunde con el distribuidor. Son dos coronas distintas: la
              primera es fija y estructural, la segunda es la de álabes
              orientables que regulan el caudal.
          - valor: '3'
            mensaje: |
              Con tres te has quedado en cámara espiral, rodete y difusor, y
              te has dejado las dos coronas de álabes que hay entre la cámara
              y el rodete.
        pista: |
          Del exterior hacia el interior y después hacia la salida.
        desarrollo: |
          Cámara espiral, antedistribuidor, distribuidor, rodete y tubo
          difusor. **Cinco**, frente a los dos —inyector y rodete— de una
          turbina de acción.

      - tipo: justificar
        pregunta: Ordena la tabla. Una pieza es falsa.
        piezas:
          - texto: >-
              De acción solo hay una, la Pelton; de reacción están Francis,
              Hélice, Kaplan, Deriaz, Bulbo y Straflo.
          - texto: >-
              La admisión es puntual en la de acción —donde estén los
              inyectores— y total en la de reacción.
          - texto: >-
              La de acción trabaja con $Q/H$ pequeño, en cabecera de río; la
              de reacción con $Q/H$ medio y grande, en cauce medio, terminal
              y desembocaduras.
          - texto: >-
              El tubo difusor aparece en las dos, porque en las dos hay que
              recuperar la energía que le queda al agua al salir del rodete.
            trampa: true
            mensaje: |
              Solo en las de reacción, y es la diferencia constructiva más
              visible. En una Pelton el agua sale de la cazoleta a presión
              atmosférica y cae libremente al canal de desagüe: no hay nada
              que recuperar. El difusor existe precisamente porque en una
              turbina de reacción el agua sale del rodete **todavía con
              energía**, y sin él se perdería.
    resolucion: |
      La tabla completa, que es lo que pedía el examen:

      | | acción | reacción |
      |---|---|---|
      | **tipos** | Pelton | Francis, Hélice, Kaplan, Deriaz, Bulbo, Straflo |
      | **admisión** | por puntos | total |
      | **elementos** | inyector y rodete | cámara espiral, antedistribuidor, distribuidor, rodete y tubo difusor |
      | **energía aportada** | cinética, $c^{2}/2g$ | cinética y de presión, $c^{2}/2g + p/\gamma$ |
      | **campo $Q/H$** | pequeño | medio y grande |
      | **tipo de central** | cabecera de los ríos | cauce medio, terminal y desembocaduras |

      **Y el hilo que la ordena, para no aprenderla de memoria.** Solo hay una
      decisión de fondo: **con qué energía llega el agua al rodete**.

      Si llega a presión atmosférica, toda su energía es velocidad. Entonces
      hace falta un inyector que convierta el salto en chorro, el chorro entra
      por donde estén los inyectores —admisión puntual—, el rodete gira al
      aire, y a la salida el agua ya no tiene nada que recuperar, así que no
      hay difusor. Esa máquina necesita mucho salto para que el chorro sea
      rápido y poco caudal para que quepa por los inyectores: cabecera de río.

      Si llega con presión, el agua ocupa todo el rodete, entra por toda la
      periferia —admisión total—, y sale todavía con energía, que hay que
      recuperar con un tubo difusor. Esa máquina admite mucho caudal con poco
      salto: cauce medio y desembocaduras.

      Las seis filas de la tabla son consecuencias de esa única frase.

      > El error que hay que quitarse de encima: **«de reacción» no significa
      > que el agua empuje**. En las dos empuja. Significa que llega con
      > presión, y que la va soltando dentro del rodete.
