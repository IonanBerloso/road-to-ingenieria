ejercicios:
  # ── 1 (7,5 %) · Capilaridad en un rectángulo, y la construcción
  #    adhesión-cohesión que da el ángulo de contacto.
  - id: exflu2223-ext-1-la-capilaridad-en-un-rectangulo
    titulo: La capilaridad en un tubo rectangular, y el ángulo que sale de dos fuerzas
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Obtener:

      **a)** La **expresión** del ascenso capilar en un tubo de sección
      rectangular en el que un lado sea el doble del otro.

      **b)** Sabiendo que la tensión superficial del fluido es de
      $33{,}8\ \text{dyn/cm}$, su densidad relativa $s = 0{,}95$, la relación
      entre fuerzas de adhesión y cohesión es $7/3$ y el lado corto de la
      sección rectangular es $b = 1$ mm, calcular el ascenso capilar.
    pide: La fórmula del ascenso en un rectángulo de lados b y 2b, y su valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la fórmula de Jurin el ascenso sale de igualar dos cosas. ¿Cuáles?
        opciones:
          - texto: >-
              La componente vertical de la tensión superficial repartida por
              todo el perímetro mojado, y el peso de la columna levantada
            correcta: true
            mensaje: |
              Eso es, y escrito así vale para **cualquier** sección, no solo
              para el tubo circular: $\sigma P\cos\theta = \gamma A h$. En un
              tubo la relación $P/A$ es $4/D$; en un rectángulo hay que
              calcularla.
          - texto: >-
              La presión atmosférica y el peso de la columna
            mensaje: |
              La atmósfera actúa por igual arriba y abajo, así que se
              cancela. Lo que sostiene la columna es la tensión superficial
              tirando del contorno.
          - texto: >-
              La tensión superficial y la viscosidad del líquido
            mensaje: |
              La viscosidad no interviene en el equilibrio final: solo
              decidiría cuánto tarda en subir. El ascenso de reposo es un
              problema de estática.

      - tipo: calcular
        titulo: El factor geométrico del rectángulo
        pregunta: |
          En un rectángulo de lados $b$ y $2b$, el ascenso queda
          $h = k\,\sigma\cos\theta/(\gamma b)$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el del tubo **circular**, donde $P/A = 4/D$. En el
              rectángulo $b\times 2b$ el perímetro es $6b$ y el área
              $2b^{2}$, así que $P/A = 3/b$.
          - valor: '6'
            mensaje: |
              Has usado el perímetro sin dividir entre el área. La relación
              que aparece es $P/A = 6b/2b^{2} = 3/b$.
          - valor: '1.5'
            mensaje: |
              Parece que has tomado el área como $4b^{2}$, la del cuadrado de
              lado $2b$. Los lados son $b$ y $2b$, así que el área es
              $2b^{2}$.
        pista: |
          $h = \sigma P\cos\theta/(\gamma A)$, con $P$ el perímetro y $A$ el
          área de la sección.
        desarrollo: |
          $$
          P = 2(b+2b) = 6b
          \qquad
          A = b\cdot 2b = 2b^{2}
          \qquad
          \frac{P}{A} = \frac{6b}{2b^{2}} = \frac{3}{b}
          $$
          $$
          h = \frac{3\,\sigma\cos\theta}{\gamma\,b}
          $$

      - tipo: calcular
        titulo: El coseno del ángulo de contacto
        pregunta: |
          Con $F_{adh}/F_{coh} = 7/3$, ¿cuánto vale $\cos\theta$?
        respuesta:
          tipo: numero
          valor: '0.917'
          tolerancia: 0.005
          formato: un número entre cero y uno
        distractores:
          - valor: '0.399'
            mensaje: |
              Has tomado el coseno del ángulo complementario. $\theta$ se
              mide entre la **pared** y la superficie libre, no entre la
              superficie y la resultante.
          - valor: '0.429'
            mensaje: |
              Eso es $3/7$, el cociente de las dos fuerzas al revés. El
              ángulo no es el cociente: sale de componer las dos fuerzas
              como vectores.
          - valor: '1'
            mensaje: |
              Ese sería el caso de mojado perfecto, $\theta = 0$, que es lo
              que se supone cuando el enunciado no dice nada. Aquí sí lo
              dice, y la relación $7/3$ deja un ángulo de 23,5º.
        pista: |
          La adhesión tira perpendicular a la pared y la cohesión a 45º hacia
          el interior del líquido. La superficie libre se coloca
          perpendicular a la resultante.
        desarrollo: |
          Con $F_a = 7$ y $F_c = 3$, y la cohesión a 45º:

          $$
          R_x = F_a - \frac{F_c}{\sqrt{2}} = 7-2{,}121 = 4{,}879
          \qquad
          R_y = \frac{F_c}{\sqrt{2}} = 2{,}121
          $$
          $$
          \cos\theta = \frac{R_x}{|R|}
          = \frac{4{,}879}{\sqrt{4{,}879^{2}+2{,}121^{2}}}
          = \frac{4{,}879}{5{,}320} = 0{,}917
          $$

          es decir $\theta = 23{,}5^{\circ}$.

      - tipo: calcular
        titulo: El ascenso
        pregunta: |
          ¿Cuánto sube el líquido, en milímetros?
        respuesta:
          tipo: numero
          valor: '9.99'
          tolerancia: 0.05
          formato: un número en milímetros
        distractores:
          - valor: '10.89'
            mensaje: |
              Has supuesto mojado perfecto, $\cos\theta = 1$. El enunciado da
              la relación adhesión-cohesión precisamente para que no lo
              supongas.
          - valor: '13.32'
            mensaje: |
              Has usado el factor 4 del tubo circular en vez del 3 del
              rectángulo.
          - valor: '9.49'
            mensaje: |
              Parece que has usado el peso específico del agua. El líquido
              tiene $s = 0{,}95$, así que $\gamma = 9310\ \text{N/m}^{3}$ y
              sube algo más.
        pista: |
          $33{,}8\ \text{dyn/cm}$ son $0{,}0338\ \text{N/m}$.
        desarrollo: |
          $$
          h = \frac{3\cdot 0{,}0338\cdot 0{,}917}{9310\cdot 0{,}001}
          = \frac{0{,}09299}{9{,}31} = 9{,}99\cdot 10^{-3}\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El equilibrio es $\sigma P\cos\theta = \gamma A h$, válido para
              cualquier sección.
          - texto: >-
              En el rectángulo $b\times 2b$, $P/A = 3/b$, y de ahí
              $h = 3\sigma\cos\theta/(\gamma b)$.
          - texto: >-
              La relación $7/3$ entre adhesión y cohesión da
              $\cos\theta = 0{,}917$, componiendo las dos fuerzas.
          - texto: >-
              Como el lado largo mide $2b$, el ascenso es mayor junto a las
              paredes largas que junto a las cortas.
            trampa: true
            mensaje: |
              El ascenso es uno solo: el balance se hace sobre **toda** la
              sección a la vez, con su perímetro completo y su área
              completa. Localmente el menisco se curva más cerca de las
              esquinas, sí, pero el ascenso medio que da la fórmula es
              único. Si cada pared levantara su propia columna, el líquido
              no estaría en equilibrio.
    resolucion: |
      **a) La expresión.** El equilibrio capilar no es propiedad del tubo
      redondo. En general, la componente vertical de la tensión superficial
      repartida por el perímetro mojado sostiene el peso de la columna:

      $$
      \sigma\,P\cos\theta = \gamma\,A\,h
      \qquad\Longrightarrow\qquad
      h = \frac{\sigma\cos\theta}{\gamma}\,\frac{P}{A}
      $$

      Para el rectángulo de lados $b$ y $2b$:

      $$
      P = 6b
      \qquad
      A = 2b^{2}
      \qquad
      h = \frac{3\,\sigma\cos\theta}{\gamma\,b}
      $$

      Conviene comparar: en el tubo circular el factor es $4/D$. Un rectángulo
      cuyo lado corto valga lo mismo que el diámetro sube **tres cuartas
      partes** de lo que sube el tubo.

      **b) El ángulo, que es el paso que se atasca.** El enunciado no da
      $\theta$: da la relación entre las fuerzas de adhesión —que tiran de la
      molécula perpendicularmente hacia la pared— y las de cohesión —que
      tiran hacia el interior del líquido a 45º—. La superficie libre se
      coloca **perpendicular a la resultante** de las dos, y de ahí sale el
      ángulo de contacto. Con $F_a = 7$ y $F_c = 3$:

      $$
      \cos\theta = \frac{F_a - F_c/\sqrt{2}}
      {\sqrt{(F_a-F_c/\sqrt{2})^{2}+(F_c/\sqrt{2})^{2}}}
      = 0{,}917
      \qquad
      \theta = 23{,}5^{\circ}
      $$

      **El ascenso.** Con $\sigma = 0{,}0338\ \text{N/m}$,
      $\gamma = 9310\ \text{N/m}^{3}$ y $b = 1$ mm:

      $$
      h = \frac{3\cdot 0{,}0338\cdot 0{,}917}{9310\cdot 0{,}001}
      = 9{,}99\ \text{mm}
      $$

      **Y una nota sobre por qué importa esta construcción.** Es la que
      convierte «el líquido moja más o menos» en un número. Sin ella, un
      enunciado que da la relación adhesión-cohesión no se puede resolver, y
      suponer $\cos\theta = 1$ se equivoca aquí en casi un milímetro sobre
      diez.

  # ── 2 (10 %) · Dos manómetros absolutos y uno relativo en el mismo
  #    depósito. Al subir la atmósfera solo se mueve uno.
  - id: exflu2223-ext-2-el-manometro-que-se-mueve-y-el-que-no
    titulo: Sube la atmósfera y solo se mueve uno de los tres manómetros
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, 26 de junio de 2023 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un depósito de sección cuadrada, altura $H = 10$ m, contiene en su
      interior dos fluidos inmiscibles: agua y aceite, encontrándose el resto
      del volumen lleno de aire. El depósito cuenta con dos manómetros de
      **presiones absolutas**, con las siguientes lecturas:

      - $P_1 = 1{,}96$ bar
      - $P_2 = 2{,}04\ \text{kg/cm}^{2}$

      La presión atmosférica es $74\ \text{cm.c.Hg}$.

      Determinar:

      **a)** El peso específico del aceite (N/m³).

      **b)** Lectura que daría un manómetro de membrana conectado al fondo
      del depósito (en B) en Torr.

      **c)** Si la presión atmosférica aumentara a 1076 mbar, ¿cuáles de las
      tres lecturas se modificarían? ¿Cuáles serían las nuevas lecturas (Pa)?

      <figure class="figura-examen">
      <svg viewBox="-102 16 512 264" role="img" width="430" height="222"
           aria-labelledby="fu2t fu2d">
