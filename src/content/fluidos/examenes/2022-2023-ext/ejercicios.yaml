        de aire hasta la tapa. Dos manómetros de presiones absolutas miden la
        instalación: el primero está conectado al aire, un metro por debajo de
        la tapa, y el segundo al aceite, tres metros por encima del fondo. La
        pregunta del examen es qué lecturas cambian si sube la presión
        atmosférica, y la respuesta depende de que los dos midan absolutas.</desc>

