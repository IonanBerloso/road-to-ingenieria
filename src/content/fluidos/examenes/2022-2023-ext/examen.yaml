asignatura: fluidos
curso: '2022-2023'
convocatoria: extraordinaria
fecha: 26 de junio de 2023
# **Los nueve ejercicios.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 50 a 54 del PDF.
#
# Porcentajes impresos: 7,5 / 10 / 10 / 10 / 12,5 / 15 / 15 / 15 / 5, sin
# reparto por competencia: van en `puntosImpresos`, en %, y suman 100.
#
# **Con un apartado declarado en `fuera`, el b) del ejercicio 3.** Pide la
# densidad relativa mínima transportable con un bloque de 5 cm y publica
# 0,752; nuestra reconstrucción da 0,712 con la misma ecuación que sí
# reproduce exactamente el apartado a). La figura, mirada a 300 ppp (pág. 50),
# no da otra lectura. Se dice en la resolución y en `fuera`. §13 caso 2.
#
# **El ejercicio 6 estaba sin recalcular en su apartado c)** hasta el 30 de
# septiembre de 2026 (`tasks/pendiente.md`, «la única respuesta de examen sin
# recalcular»). El caudal del b) es hipersensible: Colebrook da 49,18 l/s y
# el examen 48,32, y la longitud del c) multiplica esa diferencia. El paso del
# c) parte ahora de los valores publicados del b), y con ellos sale 35,70 m
# frente a los 35,49 impresos; el test lo recalcula así.
#
# Lo que este examen aporta al corpus:
#
# - **La construcción adhesión-cohesión** (ej. 1), que hasta ahora era el
#   hueco que dejaba fuera el ejercicio 2 de la ordinaria de 2025. La
#   relación 7/3 da $\cos\theta = 0{,}917$ por la resultante de las dos
#   fuerzas, y con ella el ascenso de 9,99 mm sale exacto.
# - **Un manómetro absoluto y uno relativo en el mismo depósito** (ej. 2), y
#   la pregunta que los separa: al subir la atmósfera, ¿cuál se mueve?
# - **Un bloque de anclaje submarino** (ej. 3), donde la presión interior de
#   30 mca y los 4,5 m de marea son datos de sobra: el empuje no depende de
#   la profundidad.
# - **La zona de turbulencia completa** (ej. 6), donde el factor de fricción
#   sale de von Kármán y no de Colebrook, y el caudal se determina por una
#   condición hipersensible.
# - **Tres canales encadenados** (ej. 7), con la sección óptima, un trapecio
#   de dimensiones dadas y una media caña que hay que redondear a diámetro
#   comercial.
# - **Elegir la bomba entre tres modelos** (ej. 8), y después ajustar una
#   válvula para que el nivel de un depósito no se mueva.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (7,5%)»'
  unidad: '%'
  reparto:
    - n: 1
      puntos: 7.5
    - n: 2
      puntos: 10
    - n: 3
      puntos: 10
    - n: 4
      puntos: 10
    - n: 5
      puntos: 12.5
    - n: 6
      puntos: 15
    - n: 7
      puntos: 15
    - n: 8
      puntos: 15
    - n: 9
      puntos: 5

fuera:
  - n: 3
    apartados: 'b'
    motivo: >-
      El examen publica una densidad relativa mínima de 0,752 con el bloque de
      5 cm, y la misma ecuación que reproduce exactamente el apartado a)
      (67,74 mm) da 0,712. No la explican ni el cambio de g, ni prescindir
      del empuje del bloque, ni la figura, mirada a 300 ppp en la pág. 50 del
      PDF. El apartado está en el enunciado y la resolución dice dónde falla.

ejercicios:
  - id: exflu2223-ext-1-la-capilaridad-en-un-rectangulo
