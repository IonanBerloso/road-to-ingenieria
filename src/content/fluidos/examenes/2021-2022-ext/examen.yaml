asignatura: fluidos
curso: '2021-2022'
convocatoria: extraordinaria
fecha: 27 de junio de 2022
# **Los nueve.** Del cuadernillo «Exámenes 2020-2025» del departamento, págs.
# 36 a 39 (42 a 45 del PDF).
#
# Porcentajes impresos: 5 / 10 / 15 / 15 / 10 / 12,5 / 15 / 10 / 7,5, sin
# reparto por competencia: van en `puntosImpresos`, en %, y suman 100.
#
# **Hasta el 30 de septiembre de 2026 faltaba el 9**, con el motivo de que se
# resuelve sobre una gráfica y sin publicarla no había ejercicio. La gráfica
# es del propio cuadernillo (pág. 45 del PDF, imagen de 819×520 píxeles), y
# lo que se publica son sus lecturas, tomadas con su rejilla, en una tabla
# bajo «Notas nuestras» y redibujadas en la figura del enunciado. Con ellas
# salen los resultados impresos del a), el b) y el c) —7,5 l/s, 23 m y
# 5 mca— a un píxel de la imagen o menos, y el d) en 5,2 m frente a los 5,5
# impresos. Ese 5,5 no cuadra ni con las marcas que el propio cuadernillo
# dibuja en la gráfica, a 35,3 y 30,1 m; la diferencia es un píxel y medio de
# la imagen, y la casilla acepta los dos.
#
# Lo que este examen aporta al corpus:
#
# - **La savia de los árboles** (ej. 1), que es capilaridad con un número
#   que se recuerda: para subir 30 metros hacen falta vasos de una
#   milésima de milímetro.
# - **Tres coches y una sola bomba** (ej. 2), donde el orden de subida lo
#   decide la presión que necesita cada cilindro, no el peso de cada coche.
# - **Un balancín con un prisma y una esfera en fluidos distintos** (ej. 3):
#   lo que equilibra no son los pesos sino los pesos **sumergidos**.
# - **Una derivación en Y en el plano horizontal** (ej. 4), con dos salidas
#   a ángulos distintos y las presiones deducidas de Bernoulli.
# - **Dos vertederos en el mismo canal** (ej. 6), uno de pared gruesa y otro
#   de pared delgada, midiendo el mismo caudal con alturas distintas.
# - **Un diámetro que hay que despejar** (ej. 7), que obliga a iterar sobre
#   Colebrook al revés y a redondear al comercial siguiente.
# - **Cuatro lecturas en una gráfica** (ej. 9), sin una sola fórmula de
#   pérdidas, y el error del d): la bomba sube por su curva cuando el caudal
#   baja.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (5%)»'
  unidad: '%'
  reparto:
