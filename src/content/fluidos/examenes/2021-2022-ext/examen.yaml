    - { n: 2, puntos: 10 }
    - { n: 3, puntos: 15 }
    - { n: 4, puntos: 15 }
    - { n: 5, puntos: 10 }
    - { n: 6, puntos: 12.5 }
    - { n: 7, puntos: 15 }
    - { n: 8, puntos: 10 }
    - { n: 9, puntos: 7.5 }

# `fuera` queda vacío: están los nueve.

