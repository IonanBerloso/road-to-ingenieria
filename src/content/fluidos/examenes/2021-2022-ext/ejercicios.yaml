        <text x="42" y="144" text-anchor="end" font-size="12" fill="var(--faint)">H</text>
        <line x1="434" y1="86" x2="434" y2="228" stroke="var(--faint)" stroke-width="1"/>
        <line x1="428" y1="86" x2="440" y2="86" stroke="var(--faint)" stroke-width="1"/>
        <text x="444" y="160" font-size="12" fill="var(--faint)">h</text>
      </svg>
      <figcaption>

      Los dos cuerpos son **del mismo material** y están **completamente
      sumergidos**, así que lo único que los diferencia es el empuje: uno flota
      en un fluido de 1,4 y el otro en uno de 2,1. Toda la relación x sobre m
      sale de igualar momentos con esa única asimetría.

      </figcaption>
      </figure>
    pide: La relación de brazos del balancín y las fuerzas hidrostáticas sobre cada cuerpo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerza tiene que equilibrar el balancín en cada extremo?
        opciones:
          - texto: >-
              El **peso sumergido**: el peso del cuerpo menos su empuje, que
              es lo único que la barra tiene que sostener
            correcta: true
            mensaje: |
              Eso es. Cada cuerpo tira de la barra con su peso menos el
              empuje del fluido en que está. Como los dos son del mismo
              material pero están en fluidos distintos, sus pesos sumergidos
              son distintos aunque el material sea el mismo.
          - texto: >-
              El peso de cada cuerpo, porque el empuje es interno al sistema
            mensaje: |
              El empuje no es interno: lo hacen dos fluidos **distintos**
              sobre dos cuerpos distintos, y por eso no se cancela. Ignorarlo
              cambia por completo la relación de brazos.
          - texto: >-
              El empuje de cada fluido, porque los pesos son iguales
            mensaje: |
              Los pesos no son iguales: el prisma y la esfera tienen volúmenes
              distintos. Y en cualquier caso lo que cuenta es la
              **diferencia** entre peso y empuje.

      - tipo: calcular
        titulo: La relación de brazos
        pregunta: |
          ¿Cuánto vale $x/m$?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '0.8'
            mensaje: |
              Lo has puesto del revés. El brazo largo va del lado del cuerpo
              que **menos** tira, y el prisma en el fluido 1 tira menos que la
              esfera en el fluido 2.
          - valor: '0.536'
            mensaje: |
              Te has quedado con la relación de volúmenes,
              $2\pi\varnothing^{3}/(3\sqrt{3}\,b\,L^{2})$, y has olvidado el
              factor de densidades. Los dos cuerpos están en fluidos
              distintos, y eso multiplica por 2,33.
        pista: |
          Momentos respecto de R con los pesos sumergidos:
          $V_1(\gamma_1-\gamma_{mat})\,x = V_2(\gamma_2-\gamma_{mat})\,m$.
        desarrollo: |
          $$
          V_{prisma} = \frac{\sqrt{3}}{4}L^{2}b
          \qquad
          V_{esfera} = \frac{\pi\varnothing^{3}}{6}
          $$
          $$
          \frac{x}{m} = \frac{2\pi\varnothing^{3}}{3\sqrt{3}\,b\,L^{2}}\,
          \frac{s_2-s_{mat}}{s_1-s_{mat}}
          = 0{,}5365\cdot\frac{2{,}1-0{,}8738}{1{,}4-0{,}8738}
          = 1{,}25
          $$

      - tipo: dibujar
        consigna: |
          Dibuja lo que pide el apartado c): los prismas de presiones acotados
          de las fuerzas horizontales y verticales sobre los dos cuerpos. Para
          las horizontales, el prisma sobre la proyección vertical de cada lado
          de cada cuerpo; para las verticales, las columnas de fluido que hay
          encima de sus caras hasta la lámina libre de su fluido. Cada prisma
          con su $\gamma h$ en cada vértice y a escala de las cotas: la barra
          está a $k = 5$ m, la base del prisma $y = 0{,}5$ m por debajo, la
          lámina 1 a $H = 10$ m y la 2 a $h = 8$ m.
        comprueba:
          - punto: >-
              Las profundidades de cada cara, sacadas de las cotas: el prisma,
              con la base a 5,5 m y el vértice a 4,63 m bajo la lámina 1; la
              esfera, con el centro a 3 m bajo la lámina 2, de 2,45 a 3,55 m.
            porque: >-
              Las cotas $H$, $h$, $k$ e $y$ no cambian ninguna resultante —es la
              trampa del último paso—, pero son lo único que sitúa los prismas.
              La $y$ va de la barra a la base del prisma, no a su centro: así
              está acotada en la imagen, y con ella la base queda a la cota
              4,5.
          - punto: >-
              Los prismas horizontales, uno a cada lado de cada cuerpo sobre su
              proyección vertical: trapecios de 63,6 a 75,5 kPa en el prisma y
              de 50,4 a 73,1 kPa en la esfera, con las flechas hacia el cuerpo.
            porque: >-
              En las caras inclinadas y en la esfera la presión es normal a la
              superficie; su componente horizontal es la que actúa sobre la
              proyección vertical, y crece con la profundidad. Los dos lados
              dan lo mismo en sentidos contrarios: 180,6 kN en cada cara del
              prisma y 58,7 kN en cada media esfera.
          - punto: >-
              Cada trapecio con $\gamma h$ en sus dos vértices, y su lado
              inclinado, prolongado, llegando a cero en la lámina libre, no en
              la cara de arriba del cuerpo.
            porque: >-
              La presión es $\gamma$ por la profundidad bajo la lámina, así que
              el prisma arranca en ella aunque solo actúe el trozo de la
              proyección. Empezarlo en cero en el vértice es dibujar un cuerpo
              que asoma a la superficie, y en el prisma da una fuerza
              horizontal casi doce veces menor; en la esfera, más de cinco.
          - punto: >-
              Las verticales, como las columnas de fluido encima de cada cara
              hasta la lámina: hacia abajo la de las caras de arriba, 208,6 kN
              en el prisma y 51,5 kN en la esfera; hacia arriba la de las caras
              de abajo, 226,4 kN y 65,8 kN.
            porque: >-
              La componente vertical sobre una superficie es el peso del fluido,
              real o ficticio, que hay entre ella y la lámina libre. Cada
              columna se corta en la lámina de su propio fluido: la del prisma,
              a 10 m del suelo, y la de la esfera, a 8.
          - punto: >-
              La diferencia de las dos columnas es el propio cuerpo, sombreado:
              17,82 kN en el prisma y 14,34 kN en la esfera, las dos hacia
              arriba, y cero en horizontal.
            porque: >-
              Es Arquímedes salido de los prismas, y son las fuerzas del
              apartado d). Si la neta sale hacia abajo, las dos columnas están
              cambiadas.
        figura: |
          <figure>
          <svg viewBox="0 0 440 380" role="img" width="440" height="380" aria-labelledby="ex2122e3-prismas-t ex2122e3-prismas-d">
            <title id="ex2122e3-prismas-t">Los prismas de presiones del ejercicio 3, acotados y a escala, sobre el prisma y sobre la esfera</title>
            <desc id="ex2122e3-prismas-d">Los dos cuerpos en sus fluidos, a escala: a la izquierda el fluido 1, de densidad relativa 1,4, con la lámina a 10 metros del suelo, y el prisma triangular con la base a 4,5 metros y el vértice a 5,37, es decir a 5,5 y a 4,63 metros de profundidad; a la derecha, tras la pared, el fluido 2, de 2,1, con la lámina a 8 metros, y la esfera de 1,1 metros de diámetro con el centro a 5 metros, a 3 de profundidad. A cada lado de cada cuerpo, sobre su proyección vertical, el prisma de las presiones horizontales: un trapecio con las flechas hacia el cuerpo, que en el prisma va de 63,6 kilopascales arriba a 75,5 abajo y en la esfera de 50,4 a 73,1; su lado inclinado, prolongado a trazos, llega a cero justo en la lámina libre. Los trapecios de los dos lados son iguales y se anulan. Encima de cada cuerpo, la columna de fluido que llega hasta la lámina: la de sus caras de arriba empuja hacia abajo y la de su cara de abajo, que es la misma columna más el propio cuerpo, hacia arriba. Lo que queda es el volumen del cuerpo, sombreado más fuerte, y la fuerza neta sube: 17,82 kilonewtons en el prisma y 14,34 en la esfera.</desc>
