ejercicios:
  # ── 1 (5 %) · La savia de los árboles. Capilaridad con un número que se
  #    recuerda: una milésima de milímetro para subir treinta metros.
  - id: exflu2122-ext-1-la-savia-que-sube-treinta-metros
    titulo: La savia que sube treinta metros, y el vaso que hace falta
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El ascenso de la savia en los árboles se puede estudiar como un simple
      fenómeno capilar. Si suponemos que la tensión superficial de la savia es
      muy parecida a la del agua, se desea conocer el **diámetro máximo** (mm)
      que deben tener los vasos capilares de los árboles para que la savia
      ascienda al extremo superior de un árbol de 30 m de altura.

      Datos: peso específico de la savia, $9810\ \text{N/m}^{3}$; tensión
      superficial de la savia a 20 ºC, $73{,}49\ \text{dyn/cm}$.

      Nota: suponer que las fuerzas de cohesión en la savia son despreciables
      frente a las fuerzas de adhesión al vaso capilar.
    pide: El diámetro máximo del vaso capilar para que la savia llegue a 30 m.

    pasos:
      - tipo: reconocer
        pregunta: |
          La nota dice que la cohesión es despreciable frente a la adhesión.
          ¿Qué significa eso en la fórmula?
        opciones:
          - texto: >-
              Que el ángulo de contacto es cero y $\cos\theta = 1$, es decir
              mojado perfecto
            correcta: true
            mensaje: |
              Eso es. El ángulo de contacto sale de componer las dos fuerzas;
              si la cohesión desaparece, la resultante es la adhesión pura,
              perpendicular a la pared, y la superficie libre queda pegada a
              ella: $\theta = 0$.
          - texto: >-
              Que la savia no moja el vaso y el menisco es convexo
            mensaje: |
              Eso sería lo contrario: menisco convexo y **descenso** capilar,
              como el mercurio en vidrio. Si la adhesión domina, el líquido
              trepa.
          - texto: >-
              Que hay que despreciar también la tensión superficial
            mensaje: |
              La tensión superficial es justamente el motor del fenómeno: sin
              ella no habría ascenso ninguno. Lo que se desprecia es una de
              las dos fuerzas que fijan el **ángulo**.

      - tipo: calcular
        titulo: El diámetro del vaso
        pregunta: |
          ¿Qué diámetro máximo pueden tener los vasos, en milímetros?
        respuesta:
          tipo: numero
          valor: '0.001'
          tolerancia: 0.00005
          formato: un número en milímetros
        distractores:
          - valor: '0.0005'
            mensaje: |
              Has calculado el **radio**. La fórmula de Jurin se escribe
              indistintamente como $h = 2\sigma\cos\theta/(\gamma R)$ o
              $h = 4\sigma\cos\theta/(\gamma D)$; el enunciado pide el
              diámetro.
          - valor: '0.999'
            mensaje: |
              Te has dejado la conversión de las unidades de la tensión
              superficial. Un $\text{dyn/cm}$ es $10^{-3}\ \text{N/m}$, así
              que $73{,}49\ \text{dyn/cm} = 0{,}07349\ \text{N/m}$, mil veces
              menos de lo que has usado.
        pista: |
          $h = 4\sigma\cos\theta/(\gamma D)$, despejando $D$. Y
          $73{,}49\ \text{dyn/cm} = 0{,}07349\ \text{N/m}$.
        desarrollo: |
          $$
          D = \frac{4\,\sigma\cos\theta}{\gamma\,h}
          = \frac{4\cdot 0{,}07349}{9810\cdot 30}
          = 9{,}99\cdot 10^{-7}\ \text{m}
          $$

          es decir $10^{-3}$ mm, una micra.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin cohesión, el ángulo de contacto es cero y el ascenso es
              $h = 4\sigma/(\gamma D)$.
          - texto: >-
              Para que la savia llegue a 30 m el vaso no puede pasar de una
              micra de diámetro.
          - texto: >-
              Como el ascenso va con $1/D$, un vaso diez veces más ancho
              subiría la savia diez veces menos.
          - texto: >-
              Ese resultado demuestra que la capilaridad es el mecanismo que
              usan los árboles para subir el agua.
            trampa: true
            mensaje: |
              El resultado demuestra más bien lo contrario, y por eso el
              ejercicio es bonito: los vasos reales del xilema tienen entre
              20 y 500 micras, cientos de veces más de lo que haría falta.
              La capilaridad sola no llega ni de lejos; el mecanismo real es
              la **tensión-cohesión**, con la transpiración de las hojas
              tirando de una columna de agua a presión negativa. El modelo
              capilar sirve para poner un número, no para explicar el árbol.
    resolucion: |
      **El planteamiento.** Con la cohesión despreciable frente a la
      adhesión, el mojado es perfecto y $\cos\theta = 1$. La fórmula de Jurin
      queda

      $$
      h = \frac{4\,\sigma}{\gamma\,D}
      \qquad\Longrightarrow\qquad
      D = \frac{4\,\sigma}{\gamma\,h}
      $$

      Con $\sigma = 73{,}49\ \text{dyn/cm} = 0{,}07349\ \text{N/m}$ —la
      conversión es donde más se falla—, $\gamma = 9810\ \text{N/m}^{3}$ y
      $h = 30$ m:

      $$
      D = \frac{4\cdot 0{,}07349}{9810\cdot 30}
      = 9{,}99\cdot 10^{-7}\ \text{m} = 10^{-3}\ \text{mm}
      $$

      **Una micra.** Y ahí está lo que enseña el ejercicio: los vasos reales
      del xilema miden entre veinte y quinientas micras, de modo que la
      capilaridad sola subiría la savia unos centímetros, no treinta metros.
      El modelo capilar da el orden de magnitud del problema y demuestra que
      **no basta**; el mecanismo real —la teoría de la tensión-cohesión— tira
      de la columna desde arriba, con la transpiración de las hojas, y el agua
      viaja a presión negativa.

      Un cálculo que sale «mal» respecto de la realidad no es un cálculo
      inútil: es la forma de descubrir que falta física.

  # ── 2 (10 %) · Tres coches y una sola bomba. El orden lo decide la
  #    presión que necesita cada cilindro, no el peso de cada coche.
  - id: exflu2122-ext-2-los-tres-coches-y-una-sola-bomba
    titulo: Tres coches, una sola bomba, y quién sube primero
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un sistema de elevación de 3 coches de pesos diferentes se acciona con
      una bomba oleohidráulica. Los 3 cilindros se alimentan con la misma
      bomba y tienen una carrera de 2 m.

      Inicialmente todos los coches están en su posición inferior y el
      objetivo es que todos los coches suban.

      **a)** ¿Subirán los 3 coches a la vez o de uno en uno? Razonar la
      respuesta.

      **c)** Si la respuesta es de uno en uno, ¿en qué orden ascenderán?

      **d)** Calcular la lectura del manómetro E cuando cada cilindro llegue a
      su respectivo fin de carrera (bar).

      Datos: $m_1 = 1650$ kg; $m_2 = 1750$ kg; $m_3 = 1900$ kg;
      $\varnothing_A = 10$ cm; $\varnothing_B = 8$ cm; $\varnothing_C = 15$ cm;
      $z_A = z_B = z_C = 1{,}5$ m; $z_E = 0{,}5$ m; $s_{aceite} = 0{,}85$.

      El coche 1 va sobre el cilindro A, el 2 sobre el B y el 3 sobre el C. El
      manómetro E está en la línea común, a la cota 0,5 m.
    pide: Si suben a la vez o de uno en uno, en qué orden y qué marca el manómetro en cada final de carrera.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres cilindros cuelgan de la **misma** línea de presión. ¿Qué
          decide cuál sube primero?
        opciones:
          - texto: >-
              La presión que necesita cada uno, que es su peso dividido por su
              sección: sube primero el que menos presión pide
            correcta: true
            mensaje: |
              Eso es. Al compartir línea, todos ven la misma presión, y la
              bomba la va subiendo poco a poco. En cuanto la presión alcanza
              la que necesita un cilindro, ese empieza a moverse y **se lleva
              todo el caudal**, así que la presión deja de subir hasta que
              termina su carrera.
          - texto: >-
              El peso de cada coche: sube primero el más ligero
            mensaje: |
              El peso solo es la mitad de la historia. El coche 3 es el más
              pesado —1.900 kg— y sube el primero, porque su cilindro tiene
              15 cm de diámetro y reparte ese peso sobre más del doble de
              área que el de 10 cm.
          - texto: >-
              El caudal que llega a cada cilindro, que es el mismo para los
              tres
            mensaje: |
              El caudal no se reparte por igual: se lo lleva entero el
              cilindro que se está moviendo. Y aunque se repartiera, lo que
              decide **si** un cilindro se mueve es la presión, no el caudal.

      - tipo: calcular
        titulo: La presión que necesita el cilindro C
        pregunta: |
          ¿Qué presión hace falta en el cilindro C para levantar el coche 3,
          en bar?
        respuesta:
          tipo: numero
          valor: '10.54'
          tolerancia: 0.05
          formato: un número en bar
        distractores:
          - valor: '20.59'
            mensaje: |
              Esa es la del cilindro A. El C tiene 15 cm de diámetro frente a
              los 10 del A: su área es 2,25 veces mayor, y por eso necesita
              menos presión pese a soportar un coche más pesado.
          - valor: '1.05'
            mensaje: |
              Te has dejado un factor 10 al convertir. Un bar son $10^{5}$ Pa.
        pista: |
          Presión igual a peso partido por sección.
        desarrollo: |
          $$
          A_C = \frac{\pi\,0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
          \qquad
          p = \frac{1900\cdot 9{,}8}{0{,}017671} = 10{,}54\ \text{bar}
          $$

          Y las otras dos: $20{,}59$ bar el cilindro A y $34{,}12$ bar el B.

      - tipo: calcular
        titulo: La lectura del manómetro E
        pregunta: |
          Cuando el cilindro C llega al fin de carrera, ¿qué marca el
          manómetro E, en bar?
        respuesta:
          tipo: numero
          valor: '10.79'
          tolerancia: 0.05
          formato: un número en bar
        distractores:
          - valor: '10.54'
            mensaje: |
              Esa es la presión en el cilindro. El manómetro está tres metros
              más abajo que el pistón al final de la carrera, y esa columna de
              aceite añade $0{,}25$ bar.
          - valor: '20.84'
            mensaje: |
              Esa es la lectura cuando le llega el turno al cilindro A. El C
              es el primero en subir.
        pista: |
          Al final de la carrera el pistón está a $1{,}5 + 2 = 3{,}5$ m, y el
          manómetro a $0{,}5$ m: tres metros de aceite entre medias.
        desarrollo: |
          $$
          p_E = 10{,}54 + 0{,}85\cdot 9800\cdot 3\cdot 10^{-5}
          = 10{,}54+0{,}25 = 10{,}79\ \text{bar}
          $$

          Y con el mismo desnivel, $20{,}84$ bar para el A y $34{,}37$ para el
          B.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Los tres cilindros comparten línea, así que ven la misma
              presión, pero cada uno necesita la suya: $10{,}54$, $20{,}59$ y
              $34{,}12$ bar.
          - texto: >-
              Suben **de uno en uno**, en orden creciente de presión
              necesaria: primero el 3, luego el 1 y por último el 2.
          - texto: >-
              El manómetro E está tres metros por debajo del pistón al final
              de la carrera, así que marca $0{,}25$ bar más que el cilindro.
          - texto: >-
              Mientras uno sube, los otros dos bajan, porque el aceite pasa de
              unos a otros.
            trampa: true
            mensaje: |
              No bajan: se quedan quietos. Para que un cilindro bajara, la
              presión de la línea tendría que caer por debajo de la que
              necesita, y la bomba la está **subiendo**, no bajando. Lo que
              ocurre es que el cilindro en movimiento absorbe todo el caudal y
              mantiene la presión constante hasta que llega al tope; entonces
              la presión vuelve a subir y le toca al siguiente.
    resolucion: |
      **a) y c) De uno en uno, y en qué orden.** Los tres cilindros están
      alimentados por la misma bomba, así que la presión es común. Cada uno
      empieza a moverse cuando esa presión alcanza la que necesita:

      | cilindro | coche | $\varnothing$ | presión necesaria |
      |---|---|---|---|
      | C | 3 (1.900 kg) | 15 cm | $10{,}54$ bar |
      | A | 1 (1.650 kg) | 10 cm | $20{,}59$ bar |
      | B | 2 (1.750 kg) | 8 cm | $34{,}12$ bar |

      La bomba va subiendo la presión. En cuanto llega a $10{,}54$ bar arranca
      el **cilindro C**, y mientras se mueve absorbe todo el caudal: la
      presión se queda ahí. Al llegar al tope vuelve a subir hasta $20{,}59$ y
      arranca el **A**, y por último el **B**. **Suben de uno en uno**, en el
      orden 3, 1, 2.

      Fíjate en que el coche más pesado sube **primero**: lo que manda no es
      el peso sino el peso dividido por la sección.

      **d) Las lecturas del manómetro.** El manómetro está a la cota 0,5 m y
      los pistones, al final de su carrera, a $1{,}5+2 = 3{,}5$ m. Los tres
      metros de aceite entre medias añaden

      $$
      \Delta p = 0{,}85\cdot 9800\cdot 3 = 24{,}99\ \text{kPa} = 0{,}25\ \text{bar}
      $$

      | fin de carrera de | $p_E$ |
      |---|---|
      | cilindro C | $10{,}79$ bar |
      | cilindro A | $20{,}84$ bar |
      | cilindro B | $34{,}37$ bar |

      **Y la lectura de ingeniería.** Un circuito hidráulico con varios
      actuadores en paralelo y sin válvulas de secuencia no mueve todo a la
      vez: mueve lo más fácil primero. Si se quiere que suban juntos hay que
      poner válvulas reguladoras de caudal o compensadores de presión, y eso
      es exactamente lo que este ejercicio hace ver sin nombrarlo.

  # ── 3 (15 %) · Un balancín con un prisma y una esfera en fluidos
  #    distintos. Lo que equilibra no son los pesos sino los sumergidos.
  - id: exflu2122-ext-3-el-balancin-en-dos-fluidos
    titulo: El balancín con un prisma y una esfera, cada uno en su fluido
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un prisma triangular equilátero de lado $L$ y profundidad $b$ y una
      esfera de diámetro $\varnothing$ están enlazados por una barra rígida y
      sumergidos en sendos fluidos de densidades relativas $s_1$ y $s_2$. El
      peso de la barra es despreciable y está articulada en el punto R,
      haciendo la función de un balancín. Ambos cuerpos son del mismo material
      ($s_{mat}$).

      **a)** Obtener la relación $x/m$ para que el sistema esté en equilibrio,
      en función de las variables que aparecen en la imagen.

      **b)** Calcular el valor de la relación $x/m$.

      **c)** Dibujar todos los prismas de presiones acotados de las fuerzas
      hidrostáticas horizontales y verticales que actúan sobre ambos cuerpos.

      **d)** Calcular las fuerzas hidrostáticas que actúan sobre ambos cuerpos
      (módulo, dirección y sentido).

      Datos: $H = 10$ m; $h = 8$ m; $L = 1$ m; $k = 5$ m; $b = 3$ m;
      $y = L/2$ m; $\varnothing = 1{,}1$ m; $s_1 = 1{,}4$; $s_2 = 2{,}1$;
      $\rho_{mat} = 873{,}76\ \text{kg/m}^{3}$.

      En la figura, $x$ es la distancia de R al prisma —sumergido en el fluido
      1, a la izquierda— y $m$ la distancia de R a la esfera, sumergida en el
      fluido 2, a la derecha. Los dos cuerpos están completamente sumergidos.
    pide: La relación de brazos del balancín y las fuerzas hidrostáticas sobre cada cuerpo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerza tiene que equilibrar el balancín en cada extremo?
        opciones:
          - texto: >-
              El **peso sumergido**: el peso del cuerpo menos su empuje, que
              es lo único que la barra tiene que sostener
            correcta: true
            mensaje: |
              Eso es. Cada cuerpo tira de la barra con su peso menos el
              empuje del fluido en que está. Como los dos son del mismo
              material pero están en fluidos distintos, sus pesos sumergidos
              son distintos aunque el material sea el mismo.
          - texto: >-
              El peso de cada cuerpo, porque el empuje es interno al sistema
            mensaje: |
              El empuje no es interno: lo hacen dos fluidos **distintos**
              sobre dos cuerpos distintos, y por eso no se cancela. Ignorarlo
              cambia por completo la relación de brazos.
          - texto: >-
              El empuje de cada fluido, porque los pesos son iguales
            mensaje: |
              Los pesos no son iguales: el prisma y la esfera tienen volúmenes
              distintos. Y en cualquier caso lo que cuenta es la
              **diferencia** entre peso y empuje.

      - tipo: calcular
        titulo: La relación de brazos
        pregunta: |
          ¿Cuánto vale $x/m$?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '0.8'
            mensaje: |
              Lo has puesto del revés. El brazo largo va del lado del cuerpo
              que **menos** tira, y el prisma en el fluido 1 tira menos que la
              esfera en el fluido 2.
          - valor: '0.536'
            mensaje: |
              Te has quedado con la relación de volúmenes,
              $2\pi\varnothing^{3}/(3\sqrt{3}\,b\,L^{2})$, y has olvidado el
              factor de densidades. Los dos cuerpos están en fluidos
              distintos, y eso multiplica por 2,33.
        pista: |
          Momentos respecto de R con los pesos sumergidos:
          $V_1(\gamma_1-\gamma_{mat})\,x = V_2(\gamma_2-\gamma_{mat})\,m$.
        desarrollo: |
          $$
          V_{prisma} = \frac{\sqrt{3}}{4}L^{2}b
          \qquad
          V_{esfera} = \frac{\pi\varnothing^{3}}{6}
          $$
          $$
          \frac{x}{m} = \frac{2\pi\varnothing^{3}}{3\sqrt{3}\,b\,L^{2}}\,
          \frac{s_2-s_{mat}}{s_1-s_{mat}}
          = 0{,}5365\cdot\frac{2{,}1-0{,}8738}{1{,}4-0{,}8738}
          = 1{,}25
          $$

      - tipo: calcular
        titulo: La fuerza hidrostática sobre el prisma
        pregunta: |
          ¿Cuánto vale la fuerza hidrostática que el fluido 1 ejerce sobre el
          prisma, en kN?
        respuesta:
          tipo: magnitud
          valor: '17.82 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12.73 kN'
            mensaje: |
              Has usado el peso específico del agua. El empuje lo da el
              fluido en que está sumergido el cuerpo, y ese tiene
              $s_1 = 1{,}4$.
          - valor: '11.12 kN'
            mensaje: |
              Has usado la densidad del **material** en vez de la del fluido.
              El empuje depende del fluido desplazado; el material solo
              interviene en el peso.
        pista: |
          Está completamente sumergido, así que es Arquímedes puro: el peso
          del fluido desplazado. El volumen de un prisma triangular
          equilátero es $\sqrt{3}L^{2}b/4$.
        desarrollo: |
          $$
          V = \frac{\sqrt{3}}{4}\cdot 1^{2}\cdot 3 = 1{,}299\ \text{m}^{3}
          $$
          $$
          F_{V1} = 1{,}4\cdot 9800\cdot 1{,}299 = 17{,}82\ \text{kN}\ (\uparrow)
          $$

          Y la esfera, en el fluido 2:
          $2{,}1\cdot 9800\cdot 0{,}697 = 14{,}34$ kN, también hacia arriba.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos cuerpos están completamente sumergidos, así que las
              componentes horizontales se anulan: $F_{H1} = F_{H2} = 0$.
          - texto: >-
              Las verticales son los empujes de Arquímedes: 17,82 kN sobre el
              prisma y 14,34 kN sobre la esfera, las dos hacia arriba.
          - texto: >-
              El balancín equilibra los **pesos sumergidos**, y de ahí sale
              $x/m = 1{,}25$.
          - texto: >-
              Las cotas $H = 10$ m y $h = 8$ m son las que fijan el valor de
              los empujes.
            trampa: true
            mensaje: |
              El empuje de Arquímedes no depende de la profundidad: vale
              $\gamma V$ y punto. Las cotas $H$, $h$ y $k$ sirven para
              dibujar los prismas de presiones del apartado c) —que sí
              dependen de la profundidad— pero no cambian ni una de las
              fuerzas resultantes.
    resolucion: |
      **La idea.** Los dos cuerpos están hechos del mismo material y
      completamente sumergidos, pero en **fluidos distintos**. Cada uno tira
      de su extremo de la barra con su peso menos su empuje, y esos dos pesos
      sumergidos no son iguales ni siquiera en proporción a los volúmenes.

      **a) y b) La relación de brazos.** Momentos respecto de R:

      $$
      V_{pr}\,(\gamma_{mat}-\gamma_1)\,x = V_{esf}\,(\gamma_{mat}-\gamma_2)\,m
      $$

      Con $V_{pr} = \sqrt{3}L^{2}b/4$ y
      $V_{esf} = \pi\varnothing^{3}/6$:

      $$
      \frac{x}{m} = \frac{2\pi\varnothing^{3}}{3\sqrt{3}\,b\,L^{2}}\cdot
      \frac{s_2-s_{mat}}{s_1-s_{mat}}
      $$

      Y con los números —$s_{mat} = 873{,}76/1000 = 0{,}8738$—:

      $$
      \frac{x}{m} = 0{,}5365\cdot 2{,}3303 = 1{,}25
      $$

      **d) Las fuerzas hidrostáticas.** Al estar los dos cuerpos totalmente
      sumergidos, las componentes horizontales se anulan por simetría, y las
      verticales son los empujes:

      $$
      F_{V1} = \gamma_1 V_{pr} = 17{,}82\ \text{kN}\ (\uparrow)
      \qquad
      F_{V2} = \gamma_2 V_{esf} = 14{,}34\ \text{kN}\ (\uparrow)
      $$

      **Lo que hay que llevarse.** El prisma tiene casi el doble de volumen
      que la esfera, pero está en el fluido más ligero, y su empuje es solo un
      24 % mayor. Y en el balance del balancín pasa algo más fino todavía: lo
      que cuenta no es el empuje sino la **diferencia** entre el peso
      específico del material y el del fluido, que en el fluido 2 es cuatro
      veces mayor que en el 1. Por eso la relación de brazos, que por
      volúmenes sería 0,54, acaba siendo 1,25.

      Las cotas $H$, $h$ y $k$ solo hacen falta para dibujar los prismas de
      presiones; ninguna resultante depende de ellas.

  # ── 4 (15 %) · Una derivación en Y en el plano horizontal, con dos
  #    salidas a ángulos distintos.
  - id: exflu2122-ext-4-la-derivacion-en-y
    titulo: La derivación en Y, con una salida a cuarenta y cinco y otra a sesenta
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la derivación de la figura, que se encuentra en un **plano
      horizontal**, circula un fluido con una densidad relativa de 1,5. Se
      pide el caudal que atravesará la sección 3 y las presiones en las
      salidas 2 y 3, suponiendo que no hay pérdidas de energía. Calcular la
      fuerza a la que está sometida la pieza en Y.

      | sección | $D$ | dato |
      |---|---|---|
      | 1 (entrada) | 500 mm | $p_1 = 50$ mca, $Q_1 = 1800\ \text{m}^{3}/\text{h}$ |
      | 2 (salida) | 150 mm | $Q_2 = 250\ \text{m}^{3}/\text{h}$, a 60º del eje |
      | 3 (salida) | 300 mm | a 45º del eje, al otro lado |

      El eje de entrada está en la dirección $Y$ positiva; la salida 2 se
      desvía 60º hacia $+X$ y la 3, 45º hacia $-X$.
    pide: El caudal de la salida 3, las dos presiones de salida y la fuerza sobre la pieza.

    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza está en un **plano horizontal** y no hay pérdidas. ¿Qué
          decide entonces las presiones de salida?
        opciones:
          - texto: >-
              Solo el cambio de velocidad: donde el fluido acelera, la presión
              baja
            correcta: true
            mensaje: |
              Eso es. Sin cotas ni pérdidas, Bernoulli se reduce a
              $p + \tfrac12\rho v^{2} = $ constante. La salida 3, más
              estrecha en relación a su caudal, acelera más y por eso tiene
              menos presión que la 2.
          - texto: >-
              El reparto de caudales, porque la presión es proporcional al
              caudal
            mensaje: |
              La presión no es proporcional al caudal: depende de la
              **velocidad**, que es caudal partido por área. La salida 3 lleva
              seis veces más caudal que la 2 y aun así va más deprisa, porque
              su sección no es seis veces mayor.
          - texto: >-
              Los ángulos de salida
            mensaje: |
              Los ángulos deciden la **fuerza**, no las presiones. En
              Bernoulli no aparece ninguna dirección.

      - tipo: calcular
        titulo: La presión en la salida 3
        pregunta: |
          ¿Cuánto vale $p_3$, en bar?
        respuesta:
          tipo: numero
          valor: '4.67'
          tolerancia: 0.02
          formato: un número en bar
        distractores:
          - valor: '4.90'
            mensaje: |
              Te has quedado con la presión de entrada sin corregir por el
              cambio de velocidad. En la salida 3 el fluido va a 6,1 m/s
              frente a los 2,5 de la entrada, y esa aceleración cuesta
              0,23 bar.
          - valor: '5.23'
            mensaje: |
              Has sumado el término cinético en vez de restarlo. Donde el
              fluido **acelera**, la presión baja.
        pista: |
          Bernoulli entre 1 y 3, con $Q_3 = 1800-250$ y
          $\rho = 1500\ \text{kg/m}^{3}$. Los 50 mca son metros de columna de
          **agua**.
        desarrollo: |
          $$
          Q_3 = 1550\ \text{m}^{3}/\text{h}
          \qquad
          v_1 = 2{,}55\ \text{m/s}
          \qquad
          v_3 = 6{,}09\ \text{m/s}
          $$
          $$
          p_3 = 490000 + 750\,(2{,}55^{2}-6{,}09^{2}) = 467{,}0\ \text{kPa}
          $$

          Y con la salida 2, a $3{,}93$ m/s, sale $p_2 = 483{,}3$ kPa.

      - tipo: calcular
        titulo: La componente vertical de la fuerza
        pregunta: |
          ¿Cuánto vale $F_y$ sobre la pieza, en kN?
        respuesta:
          tipo: magnitud
          valor: '67.52 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1.08 kN'
            mensaje: |
              Te has quedado con el término de cantidad de movimiento y has
              olvidado las fuerzas de presión sobre las tres bridas, que son
              casi todo el resultado.
          - valor: '96.21 kN'
            mensaje: |
              Esa es solo la fuerza de presión sobre la brida de entrada,
              $p_1A_1$. Hay que descontar las componentes verticales de las
              presiones de salida, que empujan hacia abajo.
        pista: |
          Volumen de control con las tres bridas cortadas. En cada salida, la
          presión empuja hacia dentro del volumen, es decir en sentido
          contrario al flujo.
        desarrollo: |
          $$
          \sum p A\big|_y = 96{,}21 - 4{,}27 - 23{,}34 = 68{,}60\ \text{kN}
          $$
          $$
          \sum \dot m v\big|_y = 0{,}20+2{,}78-1{,}91 = 1{,}08\ \text{kN}
          $$
          $$
          F_y = 68{,}60-1{,}08 = 67{,}52\ \text{kN}\ (\uparrow)
          $$

          Y en $x$, $F_x = 18{,}37$ kN hacia la derecha.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por continuidad, la salida 3 se lleva
              $1800-250 = 1550\ \text{m}^{3}/\text{h}$.
          - texto: >-
              Bernoulli sin cotas ni pérdidas da $p_2 = 4{,}83$ bar y
              $p_3 = 4{,}67$ bar: la salida más rápida es la de menos presión.
          - texto: >-
              La fuerza sobre la pieza sale de sumar las presiones sobre las
              tres bridas y el cambio de cantidad de movimiento: 18,37 kN en
              $x$ y 67,52 en $y$.
          - texto: >-
              Como la pieza es una Y simétrica, la fuerza horizontal sería
              nula si los dos caudales fueran iguales.
            trampa: true
            mensaje: |
              La pieza **no** es simétrica: una salida está a 60º y la otra a
              45º, y además tienen diámetros distintos, 150 y 300 mm. Ni
              siquiera con caudales iguales se anularía la componente
              horizontal, porque las velocidades y las secciones —y por tanto
              las fuerzas de presión— serían distintas.
    resolucion: |
      **El caudal.** Por continuidad,
      $Q_3 = 1800-250 = 1550\ \text{m}^{3}/\text{h}$.

      **Las presiones.** Plano horizontal y sin pérdidas: Bernoulli se queda
      en presión más altura cinética. Con $\rho = 1500\ \text{kg/m}^{3}$ y
      $p_1 = 50$ mca $= 490$ kPa:

      | sección | $D$ | $Q$ | $v$ | $p$ |
      |---|---|---|---|---|
      | 1 | 500 mm | 1800 m³/h | 2,55 m/s | 490,0 kPa |
      | 2 | 150 mm | 250 m³/h | 3,93 m/s | **483,3 kPa** |
      | 3 | 300 mm | 1550 m³/h | 6,09 m/s | **467,0 kPa** |

      La salida 3, que se lleva seis veces más caudal por una sección solo
      cuatro veces mayor, es la que más acelera y la que menos presión tiene.

      **La fuerza.** Volumen de control cortando las tres bridas, con la
      presión empujando siempre **hacia dentro**:

      $$
      F_x = 18{,}37\ \text{kN}\ (\rightarrow)
      \qquad
      F_y = 67{,}52\ \text{kN}\ (\uparrow)
      $$

      **Y el reparto, que es lo que conviene mirar.** De los 67,5 kN
      verticales, 68,6 los ponen las presiones y el chorro **resta** 1,1. En
      una pieza con presión de servicio alta y velocidades modestas, la
      cantidad de movimiento es una corrección; los anclajes se calculan con
      la presión. Es la misma lección que dejó el codo-boquilla de junio de
      2023, aquí con tres bridas en vez de dos.

  # ── 5 (10 %) · Reynolds y Froude a la vez, con la misma gravedad. La
  #    escala de viscosidades sale lambda elevado a tres medios.
  - id: exflu2122-ext-5-reynolds-y-froude-en-la-tierra
    titulo: Reynolds y Froude a la vez, con la gravedad de siempre
    fuente: >-
      Ejercicio 5 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen pide la deducción y la discusión.
    nivel: examen
    enunciado: |
      Deducir y discutir las condiciones necesarias para cumplir la semejanza
      completa o absoluta en un sistema caracterizado por los números de
      **Reynolds** y **Froude**, si tanto el modelo como el prototipo se
      encuentran en la superficie terrestre.
    pide: La condición que tendría que cumplir el fluido del modelo, y si es realizable.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos ensayos son en la superficie terrestre. ¿Qué implica eso?
        opciones:
          - texto: >-
              Que la gravedad es la misma en los dos, así que Froude fija la
              escala de velocidades y no queda libertad para ajustar Reynolds
            correcta: true
            mensaje: |
              Eso es, y es el nudo del problema. Con $g$ común, la igualdad de
              Froude obliga a $v_m/v_p = \sqrt{\lambda}$, y ahí se acaba la
              libertad: la escala de velocidades ya no se puede elegir para
              contentar a Reynolds.
          - texto: >-
              Que las velocidades del modelo y del prototipo son iguales
            mensaje: |
              No: Froude las relaciona por $\sqrt{\lambda}$. Iguales serían si
              lo que se conservara fuera el número de Mach a la misma
              temperatura, que es otro problema.
          - texto: >-
              Que se puede prescindir de Froude, porque la gravedad no cambia
            mensaje: |
              Froude no mide la gravedad: mide la relación entre inercia y
              gravedad, y esa **sí** cambia con la escala. Que $g$ sea la
              misma es precisamente lo que hace rígida la condición.

      - tipo: calcular
        titulo: La viscosidad que haría falta
        pregunta: |
          Con un modelo a escala $1{:}10$, ¿cuántas veces la viscosidad
          cinemática del prototipo debería tener el fluido del modelo?
        respuesta:
          tipo: numero
          valor: '0.0316'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.1'
            mensaje: |
              Esa es la escala geométrica a secas. La de viscosidades es
              $\lambda^{3/2}$, porque lleva la escala de longitudes **y** la
              de velocidades, que a su vez es $\sqrt{\lambda}$.
          - valor: '0.01'
            mensaje: |
              Ese es $\lambda^{2}$. El exponente correcto es $3/2$: uno por la
              longitud y medio por la velocidad.
        pista: |
          De Froude, $v_m/v_p = \sqrt{\lambda}$; llévalo a la igualdad de
          Reynolds.
        desarrollo: |
          $$
          Fr_m = Fr_p \;\Longrightarrow\; \frac{v_m}{v_p} = \sqrt{\lambda}
          $$
          $$
          Re_m = Re_p \;\Longrightarrow\;
          \frac{\nu_m}{\nu_p} = \frac{v_m}{v_p}\,\frac{L_m}{L_p}
          = \lambda^{3/2}
          $$
          $$
          \lambda = 0{,}1
          \;\Longrightarrow\;
          \frac{\nu_m}{\nu_p} = 0{,}0316
          $$

      - tipo: justificar
        pregunta: Ordena la discusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la misma gravedad, Froude impone
              $v_m/v_p = \sqrt{\lambda}$.
          - texto: >-
              Llevando esa relación a Reynolds queda
              $\nu_m/\nu_p = \lambda^{3/2}$: el fluido del modelo tiene que
              ser mucho menos viscoso que el del prototipo.
          - texto: >-
              A escala $1{:}10$ haría falta un líquido con la trigésima parte
              de la viscosidad cinemática del agua, y no existe ninguno
              práctico.
          - texto: >-
              Por eso los ensayos de canales y de buques se hacen respetando
              Reynolds y corrigiendo Froude a posteriori.
            trampa: true
            mensaje: |
              Es al revés, y es la conclusión práctica de todo el ejercicio.
              En superficie libre —canales, presas, buques— manda la
              **gravedad**, así que se respeta **Froude** y se acepta que el
              Reynolds del modelo sea menor; el efecto viscoso se corrige
              después con formulaciones semiempíricas, como el método de
              Froude para la resistencia de carena. Respetar Reynolds y
              olvidar Froude sería tirar la física dominante.
    resolucion: |
      **La deducción.** Semejanza absoluta significa igualar los dos números a
      la vez. Con el modelo y el prototipo en la superficie terrestre, la
      gravedad es la misma.

      **Froude** compara la inercia con la gravedad:

      $$
      \frac{v_m}{\sqrt{g L_m}} = \frac{v_p}{\sqrt{g L_p}}
      \qquad\Longrightarrow\qquad
      \frac{v_m}{v_p} = \sqrt{\lambda}
      $$

      donde $\lambda = L_m/L_p$. La escala de velocidades queda **fijada**; ya
      no es una variable libre.

      **Reynolds** compara la inercia con la viscosidad:

      $$
      \frac{v_m L_m}{\nu_m} = \frac{v_p L_p}{\nu_p}
      \qquad\Longrightarrow\qquad
      \frac{\nu_m}{\nu_p} = \frac{v_m}{v_p}\cdot\frac{L_m}{L_p}
      = \lambda^{3/2}
      $$

      **La discusión.** La condición es dura. A escala $1{:}10$ el fluido del
      modelo tendría que tener **la trigésima parte** de la viscosidad
      cinemática del prototipo; a $1{:}100$, la milésima. Con agua en el
      prototipo —$10^{-6}\ \text{m}^{2}/\text{s}$— haría falta un líquido de
      $3\cdot 10^{-8}$, y no existe: el mercurio, que es de los menos
      viscosos, se queda en $1{,}1\cdot 10^{-7}$.

      **La semejanza absoluta es, en la práctica, imposible.** Y lo que se
      hace es elegir: en flujos con superficie libre —canales, presas,
      aliviaderos, buques— domina la gravedad, así que **se respeta Froude** y
      se admite que el Reynolds del modelo sea más bajo; la diferencia se
      corrige después con formulaciones semiempíricas. En flujos confinados
      sin superficie libre —tuberías, válvulas— se respeta Reynolds y Froude
      no pinta nada.

      Saber **cuál de los dos sacrificar** es la parte de ingeniería del
      análisis dimensional.

  # ── 6 (12,5 %) · Dos vertederos en el mismo canal, uno de pared gruesa y
  #    otro de pared delgada, midiendo el mismo caudal.
  - id: exflu2122-ext-6-los-dos-vertederos-del-mismo-canal
    titulo: Dos vertederos en el mismo canal, y dos alturas distintas
    fuente: >-
      Ejercicio 6 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      **a)** Deducir la expresión del caudal real en un vertedero horizontal
      de pared delgada.

      **b)** Si en un canal de $L = 2$ m de ancho se ha medido un caudal de
      $2\ \text{m}^{3}/\text{s}$ mediante un vertedero de **pared gruesa**,
      calcular la altura de agua sobre dicho vertedero y también sobre un
      segundo vertedero horizontal de **pared delgada** colocado en el mismo
      canal.

      Dato: tomar el coeficiente del vertedero de pared delgada $0{,}6$.

      Ayuda. El caudal medido en el vertedero de pared gruesa sigue las
      expresiones

      $$
      Q = (L\,y)\sqrt{2g\,(h-y)}
      \qquad
      Q_{real} = \frac{2h}{3}\,L\,\sqrt{\frac{2g}{3}\,h}
      $$
    pide: La lámina sobre el vertedero de pared gruesa y sobre el de pared delgada.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el caudal máximo de un vertedero de pared gruesa se alcanza
          justo en $y = 2h/3$?
        opciones:
          - texto: >-
              Porque es el calado que hace máximo $y\sqrt{h-y}$, y en un canal
              ese máximo lo impone el propio flujo: es el calado crítico
            correcta: true
            mensaje: |
              Eso es, y es lo que convierte una identidad matemática en
              física. La expresión $Q = Ly\sqrt{2g(h-y)}$ tiene su máximo en
              $y = 2h/3$, y el flujo sobre un umbral ancho se acomoda
              precisamente ahí: pasa por el **calado crítico**, que es el que
              maximiza el caudal para la energía disponible.
          - texto: >-
              Porque el coeficiente de descarga vale 2/3
            mensaje: |
              El $2/3$ no es un coeficiente de descarga: sale de derivar
              $y\sqrt{h-y}$ e igualar a cero. El coeficiente del vertedero de
              pared delgada, ese sí empírico, es el $0{,}6$ del dato.
          - texto: >-
              Porque el agua pierde un tercio de su energía al pasar el umbral
            mensaje: |
              La deducción de la ayuda no incluye pérdidas: es Bernoulli entre
              el remanso y la sección sobre el umbral. El $2/3$ es geométrico,
              no de pérdidas.

      - tipo: calcular
        titulo: La lámina sobre el vertedero de pared gruesa
        pregunta: |
          ¿Cuánto vale $y$, el calado sobre el umbral, en metros?
        respuesta:
          tipo: numero
          valor: '0.467'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '0.7'
            mensaje: |
              Ese es $h$, la carga total aguas arriba del umbral. Sobre el
              umbral el agua pasa a $2h/3$, que es el calado crítico.
          - valor: '0.35'
            mensaje: |
              Has tomado la mitad de $h$ en vez de dos tercios. El factor sale
              de maximizar $y\sqrt{h-y}$, y da $2/3$.
        pista: |
          Con $Q_{real} = (2h/3)L\sqrt{2gh/3}$ despeja $h$, y después
          $y = 2h/3$.
        desarrollo: |
          $$
          2 = \frac{2h}{3}\cdot 2\cdot\sqrt{\frac{19{,}6}{3}\,h}
          = 3{,}408\,h^{3/2}
          \;\Longrightarrow\;
          h = 0{,}700\ \text{m}
          $$
          $$
          y = \frac{2h}{3} = 0{,}467\ \text{m}
          $$

      - tipo: calcular
        titulo: La lámina sobre el vertedero de pared delgada
        pregunta: |
          Y sobre el de pared delgada, ¿cuánto vale la altura de agua, en
          metros?
        respuesta:
          tipo: numero
          valor: '0.683'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '0.486'
            mensaje: |
              Te has dejado el coeficiente $0{,}6$. Sin él el vertedero
              parecería más eficiente de lo que es y bastaría con menos
              lámina.
          - valor: '0.7'
            mensaje: |
              Esa es la carga aguas arriba del vertedero de pared **gruesa**.
              Son dos aparatos distintos midiendo el mismo caudal, y sus
              láminas no tienen por qué coincidir.
        pista: |
          $Q = \tfrac{2}{3}C\,L\sqrt{2g}\;h^{3/2}$.
        desarrollo: |
          $$
          2 = \frac{2}{3}\cdot 0{,}6\cdot 2\cdot\sqrt{19{,}6}\;h^{3/2}
          = 3{,}542\,h^{3/2}
          $$
          $$
          h = 0{,}683\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En el vertedero de pared gruesa el flujo pasa por el calado
              crítico, $y = 2h/3$, y con 2 m³/s la carga es $h = 0{,}70$ m.
          - texto: >-
              El de pared delgada mide el mismo caudal con una lámina de
              $0{,}683$ m sobre su cresta.
          - texto: >-
              Los dos aparatos miden lo mismo con alturas distintas porque su
              geometría —y por tanto su coeficiente— es distinta.
          - texto: >-
              Como el de pared delgada necesita más lámina, es un aparato peor
              para medir caudales.
            trampa: true
            mensaje: |
              Es al revés en lo que importa: **más lámina para el mismo caudal
              significa más sensibilidad**, porque un cambio de caudal produce
              un cambio de altura mayor y más fácil de leer. El de pared
              delgada es el aparato de medida clásico de laboratorio
              precisamente por eso; el de pared gruesa se usa cuando además
              hay que dejar pasar sólidos o cuando el umbral es una obra de
              fábrica.
    resolucion: |
      **a) El vertedero de pared delgada.** Se integra la velocidad teórica
      $\sqrt{2gz}$ sobre la lámina, desde la cresta hasta la superficie, y se
      corrige con el coeficiente:

      $$
      Q = C\int_0^{h} L\sqrt{2gz}\;dz
      = \frac{2}{3}\,C\,L\,\sqrt{2g}\;h^{3/2}
      $$

      **b) Las dos alturas.**

      Con el de **pared gruesa**, la ayuda da el caudal en función de la
      carga, ya maximizado en el calado crítico:

      $$
      2 = \frac{2h}{3}\cdot 2\sqrt{\frac{2g}{3}h} = 3{,}408\,h^{3/2}
      \;\Longrightarrow\;
      h = 0{,}700\ \text{m}
      \qquad
      y = \frac{2h}{3} = 0{,}467\ \text{m}
      $$

      Con el de **pared delgada** y $C = 0{,}6$:

      $$
      2 = \frac{2}{3}\cdot 0{,}6\cdot 2\sqrt{19{,}6}\;h^{3/2}
      = 3{,}542\,h^{3/2}
      \;\Longrightarrow\;
      h = 0{,}683\ \text{m}
      $$

      **Lo que enseña la comparación.** Dos aparatos en el mismo canal midiendo
      el mismo caudal dan lecturas distintas, y ninguna está mal: cada uno
      tiene su ley. Y la diferencia no es un defecto sino una elección de
      diseño. El de pared delgada necesita más lámina, lo que significa que su
      lectura es **más sensible** —el mismo cambio de caudal mueve más la
      superficie—; el de pared gruesa es una obra de fábrica que deja pasar
      arrastres y no se estropea.

      Y el $2/3$ del vertedero de pared gruesa no es un coeficiente empírico:
      es el calado que hace máximo $y\sqrt{h-y}$, es decir el **calado
      crítico**. El flujo sobre un umbral ancho se coloca ahí solo.

  # ── 7 (15 %) · Un diámetro que hay que despejar, iterando Colebrook al
  #    revés, y redondear al comercial siguiente.
  - id: exflu2122-ext-7-el-diametro-que-hay-que-despejar
    titulo: El diámetro que hay que despejar, y el comercial que toca
    fuente: >-
      Ejercicio 7 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se tienen dos depósitos de grandes dimensiones. La presión en el
      depósito de la izquierda es de 1 bar, mientras que el depósito de la
      derecha se encuentra abierto a la atmósfera. Se desea conectar ambos
      depósitos mediante una tubería de **hierro forjado** de longitud 270 m,
      de forma que con la ayuda de una bomba de 40 kW de potencia útil y 63 %
      de rendimiento se pretende trasvasar un caudal de
      $0{,}25\ \text{m}^{3}/\text{s}$ del depósito izquierdo al depósito
      derecho. Calcular:

      **a)** El diámetro exacto del conducto que se ha de utilizar para
      cumplir con los datos del enunciado.

      **b)** Diámetro comercial del conducto, sabiendo que los diámetros van
      de 25 en 25 mm.

      Nota: la longitud equivalente de los distintos elementos situados a lo
      largo de la instalación es de 30 m. La viscosidad dinámica del fluido es
      $2\cdot 10^{-3}$ Pl y su densidad relativa es 1,2.

      En la figura, la superficie libre del depósito izquierdo está en la
      cota 100 m y la del derecho en la 120 m.
    pide: El diámetro exacto de la conducción y el comercial que hay que pedir.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da «40 kW de potencia útil **y** 63 % de rendimiento».
          ¿Qué se usa para calcular la altura de la bomba?
        opciones:
          - texto: >-
              Solo los 40 kW: la potencia útil es ya la que llega al fluido, y
              el rendimiento serviría para saber cuánto consume del enchufe
            correcta: true
            mensaje: |
              Eso es. $H_m = P_{util}/(\gamma Q)$. El rendimiento diría que la
              bomba absorbe $40/0{,}63 = 63{,}5$ kW, dato útil para la
              factura y para nada más en este ejercicio.
          - texto: >-
              El producto de los dos, $40\cdot 0{,}63 = 25{,}2$ kW
            mensaje: |
              Eso sería si los 40 kW fueran la potencia **absorbida**. El
              enunciado dice «útil», que es la que ya ha pasado por el
              rendimiento.
          - texto: >-
              El cociente, $40/0{,}63 = 63{,}5$ kW
            mensaje: |
              Esa es la potencia que consume la bomba de la red, no la que
              entrega al agua. La que sube el agua es la útil.

      - tipo: calcular
        titulo: La pérdida de carga admisible
        pregunta: |
          ¿Cuánta pérdida de carga puede permitirse la conducción, en metros?
        respuesta:
          tipo: magnitud
          valor: '2.11 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '6.53 m'
            mensaje: |
              Has usado el peso específico del agua en los dos términos. El
              fluido tiene $s = 1{,}2$, así que
              $\gamma = 11760\ \text{N/m}^{3}$: la bomba da menos metros y el
              bar del depósito vale menos metros también.
          - valor: '13.61 m'
            mensaje: |
              Esa es la altura manométrica de la bomba a secas. Hay que
              sumarle el bar del depósito izquierdo y restarle los 20 metros
              de desnivel.
        pista: |
          $H_m + p_{izq}/\gamma - \Delta z = h_f$, con
          $\gamma = 1{,}2\cdot 9800$.
        desarrollo: |
          $$
          H_m = \frac{40000}{11760\cdot 0{,}25} = 13{,}61\ \text{m}
          \qquad
          \frac{p}{\gamma} = \frac{10^{5}}{11760} = 8{,}50\ \text{m}
          $$
          $$
          h_f = 13{,}61+8{,}50-20 = 2{,}11\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro exacto
        pregunta: |
          ¿Qué diámetro hace falta, en milímetros?
        respuesta:
          tipo: magnitud
          valor: '406.45 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '327 mm'
            mensaje: |
              Has usado el peso específico del agua. Con $s = 1{,}2$ la bomba
              da menos metros de columna y el bar del depósito también, así
              que la pérdida admisible baja de 6,5 a 2,1 metros y hace falta
              un tubo bastante más ancho.
          - valor: '425 mm'
            mensaje: |
              Ese es el **comercial**, el del apartado b). El exacto es
              $406{,}45$ mm, y hay que redondear al siguiente disponible.
        pista: |
          $h_f = f\,(L/D)\,v^{2}/2g$ con $L = 270+30 = 300$ m y
          $v = Q/(\pi D^{2}/4)$. Hay que tantear, porque $f$ depende de $D$.
        desarrollo: |
          $$
          h_f = 1{,}5508\,\frac{f}{D^{5}} = 2{,}11
          \qquad
          \nu = \frac{2\cdot 10^{-3}}{1200} = 1{,}667\cdot 10^{-6}\ \text{m}^{2}/\text{s}
          $$

          Tanteando con Colebrook —$\varepsilon = 0{,}006$ cm para el hierro
          forjado— se llega a $f \approx 0{,}0150$ y

          $$
          D = 0{,}40645\ \text{m} = 406{,}45\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba da 13,61 m y el bar del depósito izquierdo, 8,50; los
              20 metros de desnivel se llevan casi todo y dejan 2,11 m para
              las pérdidas.
          - texto: >-
              Con 300 m de longitud equivalente y esa pérdida hay que tantear
              $D$, porque el factor de fricción depende del diámetro que se
              busca.
          - texto: >-
              Sale $406{,}45$ mm, y como los comerciales van de 25 en 25 hay
              que pedir el de **425**.
          - texto: >-
              Se elige 425 en vez de 400 porque es el más próximo al valor
              calculado.
            trampa: true
            mensaje: |
              400 está más cerca de 406,45 que 425, pero **no vale**: con
              400 mm la pérdida sería mayor que la admisible y la instalación
              no trasvasaría los 0,25 m³/s. Al redondear un diámetro por
              capacidad siempre se sube al siguiente; la proximidad no es el
              criterio.
    resolucion: |
      **La cuenta de energía.** Del depósito izquierdo al derecho hay 20
      metros de desnivel en contra. A favor están la bomba y el bar de presión
      del depósito de partida:

      $$
      H_m = \frac{40000}{11760\cdot 0{,}25} = 13{,}61\ \text{m}
      \qquad
      \frac{p_{izq}}{\gamma} = 8{,}50\ \text{m}
      $$
      $$
      h_f = 13{,}61+8{,}50-20 = 2{,}11\ \text{m}
      $$

      Solo **2,11 metros** para 300 metros de tubería —270 más 30
      equivalentes—: eso ya avisa de que el diámetro va a salir grande.

      **a) El diámetro exacto.** Aquí la incógnita está dentro del factor de
      fricción, así que hay que tantear. Con
      $\nu = 2\cdot 10^{-3}/1200 = 1{,}667\cdot 10^{-6}\ \text{m}^{2}/\text{s}$
      y $\varepsilon = 0{,}006$ cm:

      $$
      h_f = f\,\frac{300}{D}\,\frac{v^{2}}{2g}
      = 1{,}5508\,\frac{f}{D^{5}} = 2{,}11
      $$

      Converge en $f \approx 0{,}0150$ y

      $$
      D = 406{,}45\ \text{mm}
      $$

      **b) El comercial.** Los diámetros van de 25 en 25, así que las opciones
      son 400 y 425. Se pide el de **425**: con 400 la pérdida superaría la
      admisible y no se trasvasarían los 0,25 m³/s. Al dimensionar por
      capacidad se redondea **siempre hacia arriba**.

      **Y el dato que sobra.** El rendimiento del 63 % no entra en ninguna
      cuenta: los 40 kW son ya la potencia útil. Serviría para saber que la
      bomba absorbe 63,5 kW de la red, que es lo que se paga.

  # ── 8 (10 %) · La cota máxima de una aspiración, con la condición de
  #    presión mínima dada directamente en vez de por NPSH.
  - id: exflu2122-ext-8-la-cota-maxima-de-la-aspiracion
    titulo: Hasta dónde puede subir la bomba sobre el nivel del agua
    fuente: >-
      Ejercicio 8 · Convocatoria extraordinaria, 27 de junio de 2022 ·
      Mecánica de Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La tubería de aspiración de 150 mm de diámetro de una instalación de
      bombeo consta de los siguientes elementos: una válvula de pie cuyo
      factor de paso adimensional es 3, un codo de 90º cuya pérdida de carga
      equivale a la de 10 m de tubería recta, otro codo de 90º cuya pérdida de
      carga equivale a la de 5 m de tubería recta y un tramo de tubería recta
      de 8 m de longitud. El caudal bombeado es 2500 l/min. La presión
      absoluta en la brida de aspiración de la turbobomba radial ha de
      mantenerse 100 mbar por encima de la presión de vapor del agua. La
      tubería es de **fundición asfaltada**. La presión barométrica es
      750 Torr.

      Estimar la cota máxima del eje de la turbobomba respecto del nivel del
      agua en el depósito de aspiración.

      Dato: $p_{vapor}$ (abs) del agua $= 0{,}12335$ bar. Utilizar la
      expresión de **Hazen-Williams**.
    pide: La altura máxima a la que puede colocarse la bomba sobre el depósito.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos codos se dan como longitudes equivalentes y la válvula de
          pie como factor $k$. ¿Cómo se juntan?
        opciones:
          - texto: >-
              Las longitudes equivalentes se suman a la tubería recta y entran
              en Hazen-Williams; la válvula se calcula aparte, con la altura
              cinética
            correcta: true
            mensaje: |
              Eso es. Son dos formas distintas de contabilizar lo mismo y no
              se pueden mezclar: 10 + 5 + 8 = 23 metros de tubería para el
              rozamiento, y $3\,v^{2}/2g$ para la válvula.
          - texto: >-
              Se convierte todo a factor $k$ y se suma
            mensaje: |
              Se podría, pero para convertir las longitudes equivalentes a $k$
              hace falta el factor de fricción, y Hazen-Williams no lo
              calcula. Es más directo dejarlas donde están.
          - texto: >-
              Se suman los 15 m equivalentes al tramo recto y se ignora la
              válvula, porque su $k$ es pequeño
            mensaje: |
              Su $k$ es 3, que sobre una altura cinética de 0,28 m son
              0,85 metros: **la mitad** de todas las pérdidas de la
              aspiración. No es despreciable en absoluto.

      - tipo: calcular
        titulo: Las pérdidas de la aspiración
        pregunta: |
          ¿Cuánto se pierde en toda la aspiración, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.706 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.855 m'
            mensaje: |
              Te has dejado la válvula de pie. Con $k = 3$ y una altura
              cinética de $0{,}284$ m aporta $0{,}851$ m, prácticamente lo
              mismo que los 23 metros de tubería.
          - valor: '1.149 m'
            mensaje: |
              Te has dejado las longitudes equivalentes de los dos codos.
              Son 15 metros de tubería más, casi el doble que el tramo recto
              de 8.
        pista: |
          $C_{HW} = 130$ para la fundición asfaltada de 150 mm, y $L = 8+10+5$.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{0{,}00012}{0{,}15} = 8\cdot 10^{-4}
          \;\Longrightarrow\;
          C_{HW} = 130
          $$
          $$
          h_f = 3{,}722\cdot 10^{-5}\cdot 23\cdot 41{,}67^{1{,}852}
          = 0{,}855\ \text{m}
          $$
          $$
          k\,\frac{v^{2}}{2g} = 3\cdot 0{,}284 = 0{,}851\ \text{m}
          \qquad
          \text{total} = 1{,}706\ \text{m}
          $$

      - tipo: calcular
        titulo: La cota máxima de la bomba
        pregunta: |
          ¿A qué altura máxima puede estar el eje de la bomba sobre el nivel
          del agua, en metros?
        respuesta:
          tipo: magnitud
          valor: '5.93 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '6.78 m'
            mensaje: |
              Te has dejado la válvula de pie en el balance. Sus 0,85 metros
              salen directamente de la cota disponible.
          - valor: '10.2 m'
            mensaje: |
              Esa es la presión barométrica en metros de agua, es decir el
              límite absoluto de una aspiración ideal. De ahí hay que restar
              la presión mínima admisible, las pérdidas y la altura cinética.
        pista: |
          $z \le p_{bar}/\gamma - p_{min}/\gamma - h_f - v^{2}/2g$, con
          $p_{min}$ cien milibares por encima de la tensión de vapor.
        desarrollo: |
          $$
          \frac{p_{bar}}{\gamma} = \frac{0{,}750\cdot 13{,}6\cdot 9800}{9800}
          = 10{,}20\ \text{m}
          $$
          $$
          \frac{p_{min}}{\gamma} = \frac{12335+10000}{9800} = 2{,}279\ \text{m}
          $$
          $$
          z \le 10{,}20-2{,}279-1{,}706-0{,}284 = 5{,}93\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el balance. Una pieza es falsa.
        piezas:
          - texto: >-
              La barometría de 750 Torr son 10,20 metros de columna de agua:
              ese es todo el presupuesto.
          - texto: >-
              De ahí se reservan 2,28 m para no bajar de la presión mínima
              admisible, 100 mbar por encima de la tensión de vapor.
          - texto: >-
              Las pérdidas se llevan 1,71 m —la mitad la válvula de pie— y la
              altura cinética 0,28.
          - texto: >-
              Lo que sobra, 5,93 m, es la cota máxima; y como el margen es
              grande, la instalación no corre riesgo de cavitar.
            trampa: true
            mensaje: |
              El margen **ya está gastado**: los 5,93 m son el límite, no un
              sobrante. Si la bomba se coloca ahí, la presión en la brida es
              exactamente la mínima admisible y cualquier imprevisto —un
              filtro que se ensucia, un día de baja presión atmosférica, un
              caudal algo mayor— la hace cavitar. Por eso en proyecto se deja
              además un margen de seguridad sobre esa cota.
    resolucion: |
      **El presupuesto.** Todo lo que puede levantar una aspiración es la
      presión atmosférica del lugar, y de ahí hay que ir descontando.

      $$
      \frac{p_{bar}}{\gamma} = 10{,}20\ \text{m}
      $$

      **Lo que hay que reservar.** La brida no puede bajar de 100 mbar por
      encima de la tensión de vapor:

      $$
      \frac{p_{min}}{\gamma} = \frac{0{,}12335\cdot 10^{5}+10^{4}}{9800}
      = 2{,}279\ \text{m}
      $$

      **Lo que se pierde por el camino.** Con $Q = 2500$ l/min $= 41{,}67$ l/s
      en 150 mm, $v = 2{,}358$ m/s y $v^{2}/2g = 0{,}284$ m. La fundición
      asfaltada tiene $\varepsilon = 0{,}012$ cm, así que
      $\varepsilon/D = 8\cdot 10^{-4}$ y el cuadro n.º 25 da $C_{HW} = 130$.
      Las dos longitudes equivalentes se suman al tramo recto:

      $$
      h_f = 0{,}855\ \text{m}\ \text{(23 m de tubería)}
      \qquad
      k\frac{v^{2}}{2g} = 0{,}851\ \text{m}\ \text{(válvula de pie)}
      $$

      **Y la cota.**

      $$
      z \le 10{,}20 - 2{,}279 - 1{,}706 - 0{,}284 = 5{,}93\ \text{m}
      $$

      **Dos cosas que este ejercicio deja claras.** La primera, que la
      **válvula de pie sola pierde tanto como los 23 metros de tubería**: en
      una aspiración corta, los accesorios son el problema, no la conducción.
      Y la segunda, que aquí la condición no viene dada como $NPSH$ sino como
      una presión mínima en la brida; es la misma cuenta escrita de otra
      manera, y conviene saber traducir entre las dos.
