      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto de funcionamiento es el cruce de las dos curvas:
              7,5 l/s y 33,1 m.
          - texto: >-
              La instalación arranca en 10 m, su altura estática: los 5 m de
              desnivel y 5 mca de presión en B.
          - texto: >-
              Las pérdidas son lo que la curva sube sobre esa altura estática:
              $33{,}1 - 10 \approx 23$ m.
          - texto: >-
              Para bajar a 7 l/s, la válvula tiene que gastar lo que la bomba
              da y la instalación no pide a ese caudal: $35{,}3 - 30{,}1 =
              5{,}2$ m.
          - texto: >-
              Para bajar a 7 l/s, la válvula tiene que gastar lo que baja la
              curva de la instalación de 7,5 a 7 l/s: $33{,}1 - 30{,}1 = 3$ m.
            trampa: true
            mensaje: |
              Eso supone que la bomba sigue dando 33,1 m, y no: la bomba se
              mueve por su curva, y con 7 l/s da 35,3. La válvula tiene que
              gastar la diferencia entre la bomba y la instalación **al caudal
              nuevo**, 5,2 m, no la bajada de la instalación.
    resolucion: |
      **Leer la gráfica.** Las dos curvas se leen en la tabla del enunciado o
      directamente en la gráfica, con su rejilla de 0,2 l/s y 2 m.

      **a) El caudal.** El punto de funcionamiento es donde la bomba da la
      altura que pide la instalación: el cruce. A 7 l/s la bomba da 35,3 m y
      la instalación pide 30,1; a 8 l/s, 30,8 y 36,3. Se cruzan en
      **7,5 l/s**, con $H = 33{,}1$ m.

      **c) La presión de B**, antes que las pérdidas, porque las pérdidas
      necesitan su altura estática. A caudal nulo no hay pérdidas, así que
      donde la instalación corta el eje
      —10 m— está su altura estática. Con A abierto:

      $$
      H_{est} = (z_B - z_A) + \frac{P_B}{\gamma}
      \quad\Longrightarrow\quad
      \frac{P_B}{\gamma} = 10 - 5 = 5\ \text{mca}
      $$

      **b) Las pérdidas.** Son lo que la curva sube por encima de esa altura
      estática en el punto de funcionamiento:

      $$
      h_f = 33{,}1 - 10 \approx 23\ \text{m}
      $$

      **d) La válvula.** La bomba es la misma, así que el punto nuevo está en
      su curva: a 7 l/s da 35,3 m. La instalación sin válvula, a ese caudal,
      solo pide 30,1 m. Lo que sobra lo tiene que gastar la válvula:

      $$
      h_{f,\text{válv}} = 35{,}3 - 30{,}1 = 5{,}2\ \text{m}
      $$

      **El 5,5 del cuadernillo.** El cuadernillo imprime 5,5 m, pero la cota
      que dibuja en su gráfica tiene las marcas a 35,3 y a 30,1 m, es decir
      5,2, que es también lo que da la tabla. No dice de dónde sale el 5,5:
      saldría, por ejemplo, de leer 35,5 y 30. Son 0,3 m, un píxel y medio de
      su imagen, dentro de lo que una gráfica así deja leer. Por eso la
      casilla acepta los dos, aunque la lectura de la gráfica es 5,2.

      **Lo que enseña.** Todo el ejercicio se contesta sin una sola fórmula
      de pérdidas: la gráfica ya las lleva dentro. Y el d) es el error que se
      comete sin dibujar: quien no marca que la bomba sube por su curva
      cuando el caudal baja contesta 3 m, la bajada de la instalación.
