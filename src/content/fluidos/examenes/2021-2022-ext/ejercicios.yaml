        <text x="132" y="80" text-anchor="end" font-size="10.5" fill="var(--faint)">D₃ = 300 mm</text>
        <text x="132" y="94" text-anchor="end" font-size="10.5" fill="var(--faint)">θ = 45°</text>

        <path d="M250 168 L342 116 L358 142 L268 176 Z" fill="var(--live)" fill-opacity=".14"
              stroke="var(--ink)" stroke-width="2"/>
        <path d="M292 150 L338 124" stroke="var(--live)" stroke-width="3" marker-end="url(#fx4f)"/>
        <text x="368" y="112" font-size="10.5" fill="var(--faint)">D₂ = 150 mm</text>
        <text x="368" y="126" font-size="10.5" fill="var(--faint)">θ = 60°</text>
        <text x="368" y="140" font-size="10.5" fill="var(--faint)">Q₂ = 250 m³/h</text>

        <line x1="250" y1="168" x2="250" y2="60" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M250 106 A 62 62 0 0 0 206 124" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <path d="M250 106 A 62 62 0 0 1 304 137" fill="none" stroke="var(--faint)" stroke-width="1"/>

        <path d="M62 250 L62 200" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#fx4e)"/>
