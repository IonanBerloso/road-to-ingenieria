          <figcaption>Las cuatro respuestas sobre la gráfica. El punto de funcionamiento, a 7,5 l/s y 33,1 m; la altura estática de 10 m partida en desnivel y presión de B; las pérdidas, 23 m, entre ella y el punto; y a 7 l/s, los 5,2 m que la válvula tiene que gastar entre la bomba y la instalación. La curva de trazos es la instalación con la válvula más cerrada.</figcaption>
