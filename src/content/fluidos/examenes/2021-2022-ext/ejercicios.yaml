        <text class="ex2122e9-grafica-n" x="209.8" y="23" text-anchor="middle" fill="var(--ink)">Instalación de bombeo</text>
      </svg>
      <figcaption>

      Las dos curvas del cuadernillo, redibujadas desde las lecturas tomadas
      en su imagen, las de la tabla y las intermedias, cada 0,1 l/s. Los
      rótulos «bomba» e «instalación» son nuestros: el cuadernillo no los
      pone. Sobre esta gráfica se dibujan las cuatro respuestas.

      </figcaption>
      </figure>
    pide: El caudal, las pérdidas, la presión del depósito B y lo que tiene que perder la válvula para bajar a 7 l/s, todo leído y dibujado en la gráfica.

    pasos:
      - tipo: reconocer
        pregunta: |
          La curva de la instalación corta el eje vertical en unos 10 m. ¿Qué
          es esa altura?
        opciones:
          - texto: >-
              La altura estática: los 5 m de desnivel entre los depósitos más
              la presión del depósito B en metros de columna de agua
            correcta: true
            mensaje: |
              Eso es. A caudal nulo no hay pérdidas, y lo único que la bomba
              tiene que vencer es la energía de más que tiene el agua en B:
              su cota y su presión, porque A está abierto. De ahí saldrá el
              apartado c).
          - texto: >-
              Las pérdidas de la instalación cuando no circula agua
            mensaje: |
              Sin caudal no hay pérdidas: crecen con el cuadrado del caudal y a
              $Q = 0$ valen cero. Lo que queda a caudal nulo es la altura que
              no depende del caudal, la estática.
          - texto: >-
              El desnivel geométrico entre A y B
            mensaje: |
              El desnivel son 5 m, la mitad. B está presurizado, y esa presión
              también la tiene que dar la bomba: la altura estática es cota
              más presión.

      - tipo: calcular
        titulo: El caudal bombeado
        pregunta: |
          ¿Qué caudal bombea la instalación, con su unidad?
        respuesta:
          tipo: magnitud
          valor: '7.5 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '7 l/s'
            mensaje: |
              Ese es el caudal del apartado d), el que se quiere conseguir
              cerrando la válvula. Ahora la válvula no pierde nada, y el
              caudal es el del cruce de las dos curvas.
          - valor: '9.9 l/s'
            mensaje: |
              Has cortado la curva de la instalación con los 49,9 m que da la
              bomba a caudal nulo, como si su altura no bajara al dar caudal.
              La bomba da menos altura cuanto más caudal mueve: el punto de
              funcionamiento es donde se cruzan las dos curvas.
        pista: |
          En la tabla, a 7 l/s la bomba da 35,3 m y la instalación pide 30,1;
          a 8 l/s la bomba da 30,8 y la instalación pide 36,3. Se cruzan entre
          los dos.
        desarrollo: |
          El punto de funcionamiento es donde la altura que da la bomba es la
          que pide la instalación. Interpolando la diferencia entre 7 y 8 l/s:

          $$
          Q = 7 + \frac{35{,}3-30{,}1}{(35{,}3-30{,}1)+(36{,}3-30{,}8)}
          = 7 + \frac{5{,}2}{10{,}7} = 7{,}49 \approx 7{,}5\ \text{l/s}
          $$

          con $H = 35{,}3 - 0{,}49\cdot 4{,}5 = 33{,}1$ m, interpolando igual en la
          curva de la bomba.

      - tipo: calcular
        titulo: Las pérdidas de la instalación
        pregunta: |
          ¿Cuántos metros se pierden en la instalación con ese caudal?
          Escríbelo en m, como altura.
        respuesta:
          tipo: magnitud
          valor: '23 m'
          tolerancia: 0.03
          formato: una altura en metros, con su unidad
        distractores:
          - valor: '33.1 m'
            mensaje: |
              Esa es la altura del punto de funcionamiento, lo que da la bomba.
              Una parte, la estática, se la queda el agua al subir a B con su
              presión; las pérdidas son solo lo que la curva sube por encima de
              los 10 m de caudal nulo.
          - valor: '28.1 m'
            mensaje: |
              Has restado solo los 5 m de desnivel. La altura estática es la
              de caudal nulo, 10 m: el desnivel y la presión de B. Los otros
              5 m no son pérdidas.
        pista: |
          Las pérdidas son la distancia vertical, en el punto de
          funcionamiento, entre la curva de la instalación y la altura
          estática.
        desarrollo: |
          $$
          h_f = H - H_{est} = 33{,}1 - 10 = 23{,}1 \approx 23\ \text{m}
          $$

          Con los 9,9 m que da la tabla a caudal nulo, 23,2 m; el cuadernillo
          imprime 23.

      - tipo: calcular
        titulo: La presión del depósito B
        pregunta: |
          ¿Qué presión hay en el depósito B, en mca?
        respuesta:
          tipo: magnitud
          valor: '5 mca'
          tolerancia: 0.05
          formato: una presión en mca, con su unidad
        distractores:
          - valor: '10 mca'
            mensaje: |
              Es toda la altura estática. De esos 10 m, 5 son la cota de B
              sobre A; la presión es lo que queda.
          - valor: '15 mca'
            mensaje: |
              Has sumado la cota en vez de restarla. La altura estática ya
              incluye los 5 m de desnivel: $H_{est} = \Delta z + P_B/\gamma$.
        pista: |
          A está abierto y a caudal nulo no hay pérdidas:
          $H_{est} = (z_B - z_A) + P_B/\gamma$.
        desarrollo: |
          $$
          \frac{P_B}{\gamma} = H_{est} - (z_B - z_A) = 10 - 5 = 5\ \text{mca}
          $$

          Con los 9,9 m de la tabla sale 4,9; el cuadernillo imprime 5.

      - tipo: calcular
        titulo: La pérdida que tiene que dar la válvula
        pregunta: |
          Para bajar el caudal a 7 l/s, ¿cuántos metros tiene que perder la
          válvula de regulación?
        respuesta:
          tipo: magnitud
          valor: '5.2 m'
          tolerancia: 0.07
          formato: una altura en metros, con su unidad
        distractores:
          - valor: '2.2 m'
            mensaje: |
              Es lo que sube la altura de la bomba al pasar de 7,5 a 7 l/s,
              33,1 a 35,3 m. Pero a 7 l/s la instalación sin válvula ya no pide
              33,1, sino 30,1: la válvula tiene que gastar todo lo que la bomba
              da de más respecto de eso.
          - valor: '3 m'
            mensaje: |
              Es lo que baja la curva de la instalación de 7,5 a 7 l/s, 33,1 a
              30,1 m. Te has quedado con la altura del punto viejo, y la bomba
              no se queda ahí: con menos caudal da más, 35,3 m.
          - valor: '35.3 m'
            mensaje: |
              Es toda la altura de la bomba a 7 l/s. La válvula solo tiene que
              perder lo que sobra después de subir el agua a B y de las
              pérdidas que ya tenía la instalación a ese caudal, 30,1 m.
        pista: |
          A 7 l/s, lee las dos curvas: lo que da la bomba y lo que pide la
          instalación sin la válvula. La diferencia es lo que la válvula tiene
          que gastar.
        desarrollo: |
          $$
          h_{f,\text{válv}} = H_{bomba}(7) - H_{inst}(7) = 35{,}3 - 30{,}1
          = 5{,}2\ \text{m}
          $$

          El cuadernillo imprime 5,5 m; sus propias marcas en la gráfica van
          de 35,3 a 30,1 m, que son 5,2. La diferencia es un píxel y medio de
          la imagen, así que la casilla acepta los dos.

      - tipo: dibujar
        consigna: |
          Refleja en la gráfica las cuatro respuestas, como pide el
          enunciado: el punto de funcionamiento con su caudal y su altura
          leídos en los ejes; la altura estática partida en desnivel y
          presión; las pérdidas como una cota vertical; y a 7 l/s, la cota
          entre la curva de la bomba y la de la instalación.
        comprueba:
          - punto: >-
              El punto de funcionamiento marcado en el cruce y bajado a los dos
              ejes: 7,5 l/s y 33,1 m.
            porque: >-
              Es la respuesta del a) y el punto de partida de todo lo demás. Un
              círculo sin sus dos proyecciones no es una lectura, y el
              enunciado pide las respuestas en el gráfico.
          - punto: >-
              La altura estática, 10 m, leída donde la instalación corta el eje
              vertical, y partida en los 5 m de cota de B y los 5 m de su
              presión.
            porque: >-
              Es el apartado c) dibujado: a caudal nulo no hay pérdidas, y lo
              que queda es cota más presión. Sin partirla, la presión de B no
              aparece en ninguna parte de la gráfica.
          - punto: >-
              Una horizontal a 10 m y, en el punto de funcionamiento, la cota
              vertical desde ella hasta la curva: 23 m de pérdidas.
            porque: >-
              Las pérdidas son lo que la curva de la instalación sube sobre su
              altura estática. Medidas desde el eje, en vez de desde los 10 m,
              salen los 33,1 de la bomba.
          - punto: >-
              A 7 l/s, una vertical hasta la curva de la bomba, 35,3 m, y la
              cota entre ella y la de la instalación, 30,1 m: 5,2 m para la
              válvula.
            porque: >-
              La bomba no cambia: el punto nuevo está en su curva. La válvula
              añade pérdida a la instalación hasta que su curva pasa por él.
              El cuadernillo escribe 5,5 m sobre esa cota, y sus dos marcas
              están a 35,3 y 30,1 m.
          - punto: >-
              Si se dibuja, la curva de la instalación con la válvula más
              cerrada: sale también de 10 m y pasa por el punto nuevo.
            porque: >-
              La válvula añade un término en $Q^{2}$, así que no mueve la
              altura estática, solo hace la curva más empinada. Es la forma de
              ver por qué el caudal baja.
        figura: |
          <figure>
          <svg viewBox="0 0 400 330" role="img" width="400" height="330" aria-labelledby="ex2122e9-respuestas-t ex2122e9-respuestas-d">
            <title id="ex2122e9-respuestas-t">Las cuatro respuestas del ejercicio 9, dibujadas sobre la gráfica</title>
            <desc id="ex2122e9-respuestas-d">La misma gráfica del enunciado, con las respuestas encima. El punto de funcionamiento, donde se cortan la curva de la bomba y la de la instalación, marcado con un círculo y bajado a los dos ejes: 7,5 litros por segundo y 33,1 metros. Una línea horizontal de trazos a 10 metros, la altura estática, que es donde la curva de la instalación corta al eje vertical; en el eje, una cota la parte en los 5 metros de desnivel entre los depósitos y los 5 de presión en el depósito B. Entre esa línea y el punto, una cota vertical de 23 metros: las pérdidas. A 7 litros por segundo, una vertical de trazos sube hasta la curva de la instalación, a 30,1 metros, y hasta la de la bomba, a 35,3: la cota entre las dos, 5,2 metros, es lo que tiene que perder la válvula. Una curva de trazos, la instalación con la válvula más cerrada, sale también de 10 metros y pasa por el punto nuevo, en la curva de la bomba. En un recuadro, las cuatro respuestas.</desc>
