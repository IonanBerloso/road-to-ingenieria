        <text x="282" y="256" font-size="10.5" fill="var(--faint)">Q₁ = 1800 m³/h</text>

        <path d="M250 168 L172 90 L146 116 L232 176 Z" fill="var(--live)" fill-opacity=".14"
              stroke="var(--ink)" stroke-width="2"/>
