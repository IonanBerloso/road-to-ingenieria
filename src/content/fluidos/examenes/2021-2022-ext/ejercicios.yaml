        <line x1="356" y1="96" x2="356" y2="108" stroke="var(--faint)" stroke-width="1"/>
        <text x="302" y="98" text-anchor="middle" font-size="11" fill="var(--faint)">m</text>

        <line x1="266" y1="132" x2="266" y2="228" stroke="var(--faint)" stroke-width="1"/>
        <line x1="260" y1="228" x2="272" y2="228" stroke="var(--faint)" stroke-width="1"/>
        <text x="272" y="184" font-size="11" fill="var(--faint)">k</text>

        <line x1="50" y1="52" x2="50" y2="228" stroke="var(--faint)" stroke-width="1"/>
