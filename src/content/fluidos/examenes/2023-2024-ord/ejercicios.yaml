ejercicios:
  # ── 1 (7,5 %) · Capilaridad en una sección que no es un tubo. La fórmula de
  #    Jurin no sirve: hay que volver al equilibrio de fuerzas y contar el
  #    perímetro y el área que hay de verdad.
  - id: exflu2324-ord-1-la-capilaridad-entre-dos-tubos
    titulo: La capilaridad entre dos tubos, donde Jurin no sirve
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se tienen dos tubos concéntricos, uno exterior de sección cuadrada (de
      lado $b$) y otro interior circular (de diámetro $D$). Hay un fluido en
      el hueco que queda entre ambos.

      a) Dibujar la superficie libre del fluido sabiendo que **moja** al
      sólido, determinando las fuerzas que condicionan su subida o bajada.

      b) Deducir la expresión válida para determinar el ascenso capilar de
      cualquier fluido.

      c) Obtener el ascenso capilar para $D = 2\ \text{mm}$ y
      $b = 3\ \text{mm}$, sabiendo que el fluido es un alcohol con una tensión
      superficial de $3{,}31\cdot 10^{-3}\ \text{J/m}^{2}$, una densidad de
      $790\ \text{kg/m}^{3}$ y un ángulo de contacto de $0°$.
    pide: La expresión del ascenso capilar en esta sección y su valor numérico.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no vale aquí la fórmula de Jurin,
          $h = 4\sigma\cos\theta/(\gamma D)$?
        opciones:
          - texto: >-
              Porque está deducida para un tubo circular, y su $4/D$ es en
              realidad el cociente perímetro/área de ese caso concreto: aquí
              hay que recalcularlo
            correcta: true
            mensaje: |
              Exacto. Jurin no es una ley aparte: es el equilibrio
              $\sigma\cos\theta\,P = \gamma\,h\,A$ resuelto para un círculo.
              Cambiada la sección, cambian $P$ y $A$ y la fórmula es otra.
          - texto: >-
              Porque con dos tubos hay dos meniscos y las tensiones se
              cancelan
            mensaje: |
              No se cancelan: las dos tiran hacia arriba, porque el líquido
              moja las dos superficies. Por eso el perímetro que hay que poner
              es la **suma** de los dos contornos.
          - texto: >-
              Porque el hueco entre los tubos no es un capilar
            mensaje: |
              Sí lo es: lo que define un capilar no es su forma sino que sea
              lo bastante estrecho para que la tensión superficial pese frente
              al peso de la columna. Aquí el hueco tiene medio milímetro.

      - tipo: calcular
        titulo: El perímetro mojado de la sección
        pregunta: |
          ¿Cuánto vale el contorno sobre el que actúa la tensión superficial?
        respuesta:
          tipo: magnitud
          valor: '18.28 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '12 mm'
            mensaje: |
              Solo has contado el tubo exterior, $4b$. El líquido también moja
              el tubo interior, y su circunferencia $\pi D$ tira hacia arriba
              exactamente igual.
          - valor: '6.28 mm'
            mensaje: |
              Solo has contado el tubo interior, $\pi D$. Falta el cuadrado
              exterior, que aporta $4b = 12$ mm.
        pista: |
          Las dos superficies que el líquido moja: el interior del cuadrado y
          el exterior del círculo.
        desarrollo: |
          $$
          P = 4b + \pi D = 4\cdot 3 + \pi\cdot 2 = 18{,}28\ \text{mm}
          $$

      - tipo: calcular
        titulo: El ascenso capilar
        pregunta: |
          ¿Cuánto sube el alcohol?
        respuesta:
          tipo: magnitud
          valor: '1.334 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.855 mm'
            mensaje: |
              Has aplicado Jurin a un tubo circular de $D = 2$ mm, olvidando
              que la sección real es el hueco entre los dos tubos: menos área
              y más perímetro, así que sube más.
          - valor: '0.459 mm'
            mensaje: |
              Parece que has contado solo el perímetro del tubo interior y el
              área del cuadrado sin descontar el círculo. Las dos cosas van
              juntas: el mismo hueco define el contorno y la sección.
        pista: |
          Equilibrio: $\sigma\cos\theta\,P = \gamma\,h\,A$, con
          $A = b^{2} - \pi D^{2}/4$.
        desarrollo: |
          $$
          h = \frac{\sigma\cos\theta\,(4b+\pi D)}
          {\gamma\left(b^{2}-\dfrac{\pi D^{2}}{4}\right)}
          = \frac{4\sigma\cos\theta\,(4b+\pi D)}{\gamma\,(4b^{2}-\pi D^{2})}
          $$
          $$
          = \frac{4\cdot 3{,}31\cdot 10^{-3}\cdot 0{,}01828}
          {790\cdot 9{,}8\cdot 2{,}343\cdot 10^{-5}} = 1{,}334\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión superficial actúa sobre todo el contorno mojado, que
              aquí son los dos: $4b$ del cuadrado y $\pi D$ del círculo.
          - texto: >-
              Su componente vertical, $\sigma\cos\theta\,(4b+\pi D)$, sostiene
              el peso de la columna, $\gamma h\,(b^{2}-\pi D^{2}/4)$.
          - texto: >-
              Despejando sale
              $h = 4\sigma\cos\theta(4b+\pi D)/[\gamma(4b^{2}-\pi D^{2})]$, y
              con los datos, 1,334 mm.
          - texto: >-
              Y como el resultado es mayor que el de un tubo circular de
              diámetro $D$, se concluye que el tubo interior favorece el
              ascenso porque estrecha el paso.
            trampa: true
            mensaje: |
              Sube más, sí, pero no «porque estrecha el paso»: sube porque el
              cociente perímetro/área es mayor. El tubo interior **quita**
              área (3,14 de 9 mm²) y **añade** perímetro (6,28 sobre 12 mm), y
              las dos cosas empujan en el mismo sentido. Estrechar por
              estrechar no basta: si en vez de un tubo interior hubiera un
              tabique macizo pegado a la pared, quitaría área sin añadir
              contorno útil.

    resolucion: |
      **Por qué Jurin no vale.** La fórmula $h = 4\sigma\cos\theta/(\gamma D)$
      no es una ley: es el equilibrio de fuerzas resuelto para un tubo
      circular. Su $4/D$ es, escrito de otra forma, el cociente entre el
      perímetro $\pi D$ y el área $\pi D^{2}/4$. Cambiada la sección hay que
      recalcularlo.

      **El equilibrio.** La componente vertical de la tensión superficial
      sostiene el peso de la columna:

      $$
      \sigma\cos\theta\,\underbrace{(4b + \pi D)}_{\text{contorno mojado}}
      = \gamma\,h\,\underbrace{\left(b^{2}-\frac{\pi D^{2}}{4}\right)}
      _{\text{sección del hueco}}
      $$

      **La expresión y el número.**

      $$
      h = \frac{4\sigma\cos\theta\,(4b+\pi D)}{\gamma\,(4b^{2}-\pi D^{2})}
      = 1{,}334\ \text{mm}
      $$

      **La comparación que da sentido al resultado.** En un tubo circular de
      2 mm el mismo alcohol subiría 0,855 mm. Aquí sube un 56 % más, y la
      razón está en el cociente perímetro/área:

      | | perímetro | área | $P/A$ |
      |---|---|---|---|
      | tubo circular $D = 2$ | 6,28 mm | 3,14 mm² | 2,00 mm⁻¹ |
      | hueco cuadrado-círculo | 18,28 mm | 5,86 mm² | 3,12 mm⁻¹ |

      **Y la regla general que sale de aquí:** el ascenso capilar de cualquier
      sección vale

      $$
      h = \frac{\sigma\cos\theta}{\gamma}\,\frac{P}{A}
      $$

      Todo lo demás —Jurin incluido— son casos particulares de esa expresión.
      Es la misma estructura que el radio hidráulico del tema 19, y por el
      mismo motivo: un fenómeno de contorno frente a un fenómeno de volumen.

  # ── 2 (12,5 %) · Cantidad de movimiento sobre una pieza a 13,5 bar. La
  #    lección está en el reparto: de los 16,8 kN, 16,6 los pone p·A y el
  #    chorro solo inclina la resultante 0,65°.
  - id: exflu2324-ord-2-la-pieza-con-dos-boquillas
    titulo: La pieza con dos boquillas, y quién pone de verdad la fuerza
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Al final de un tubo que transporta agua hay una pieza especial con dos
      boquillas: una en el punto **B**, situada a la altura del eje de la
      tubería principal y con el chorro horizontal hacia delante, y otra en el
      punto **C**, cuyo chorro sale hacia atrás y hacia abajo formando
      $\alpha = 60°$ con la vertical.

      Determinar la fuerza —dirección y módulo— del flujo sobre la pieza
      especial. No considerar pérdidas de carga, diferencias de cota ni el
      peso del agua.

      Datos: $p_A = 13{,}5\ \text{bar}$; $\phi_A = 125\ \text{mm}$;
      $\phi_B = 10\ \text{mm}$; $v_A = 0{,}8\ \text{m/s}$;
      $c_{c,A} = 1$; $c_{c,B} = 0{,}6$; $c_{c,C} = 0{,}7$.
    pide: El módulo y la dirección de la fuerza sobre la pieza.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los chorros salen a la atmósfera. ¿Con qué velocidad?
        opciones:
          - texto: >-
              Con la que da Bernoulli desde A: toda la carga de presión de A
              se convierte en altura cinética, así que
              $v = \sqrt{v_A^{2} + 2p_A/\rho}$
            correcta: true
            mensaje: |
              Eso es. Con 13,5 bar la velocidad de salida es de 52 m/s, y esa
              es la misma para las dos boquillas: no dependen del diámetro
              sino de la carga disponible.
          - texto: >-
              Con $v_A$ multiplicada por la relación de áreas, por continuidad
            mensaje: |
              La continuidad reparte el caudal entre las dos boquillas, pero
              no fija la velocidad de cada una: eso lo hace Bernoulli. De
              hecho el enunciado ni siquiera da el diámetro de la boquilla C.
          - texto: >-
              Con $\sqrt{2gh}$, tomando $h$ como la diferencia de cotas
            mensaje: |
              El enunciado dice expresamente que se desprecien las diferencias
              de cota. Lo que impulsa el chorro es la **presión** de 13,5 bar,
              que en altura son 137 m.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad salen los chorros?
        respuesta:
          tipo: magnitud
          valor: '51.97 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '36.76 m/s'
            mensaje: |
              Te has dejado el 2. La altura cinética es $v^{2}/2g$, así que al
              despejar aparece $v = \sqrt{2p/\rho}$, no $\sqrt{p/\rho}$.
          - valor: '0.8 m/s'
            mensaje: |
              Esa es la velocidad en la tubería principal, de 125 mm. Las
              boquillas son de 10 mm y aprovechan además toda la presión: la
              velocidad se multiplica por sesenta y cinco.
        pista: |
          Bernoulli de A a la salida, sin cotas ni pérdidas:
          $p_A/\gamma + v_A^{2}/2g = v^{2}/2g$.
        desarrollo: |
          $$
          v = \sqrt{v_A^{2} + \frac{2p_A}{\rho}}
          = \sqrt{0{,}8^{2} + \frac{2\cdot 1{,}35\cdot 10^{6}}{1000}}
          = 51{,}97\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal por la boquilla B
        pregunta: |
          ¿Qué caudal sale por B?
        respuesta:
          tipo: magnitud
          valor: '2.449 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '4.082 l/s'
            mensaje: |
              Te has dejado el coeficiente de contracción. La vena sale más
              estrecha que el orificio: $c_{c,B} = 0{,}6$ recorta el área a
              seis décimas.
          - valor: '9.817 l/s'
            mensaje: |
              Ese es el caudal **total** que llega por A. Por B sale una
              parte; el resto se va por C.
        pista: |
          $Q_B = c_{c,B}\,A_B\,v$, con el área geométrica de la boquilla.
        desarrollo: |
          $$
          Q_B = 0{,}6\cdot\frac{\pi\,0{,}01^{2}}{4}\cdot 51{,}97
          = 2{,}449\ \text{l/s}
          $$

          Y por continuidad, $Q_C = 9{,}817 - 2{,}449 = 7{,}369$ l/s.

      - tipo: calcular
        titulo: El módulo de la fuerza
        pregunta: |
          ¿Qué fuerza soporta la pieza?
        respuesta:
          tipo: magnitud
          valor: '16780 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '286 n'
            mensaje: |
              Solo has contado los términos de cantidad de movimiento. En una
              pieza a 13,5 bar la fuerza de presión sobre la brida de entrada
              es de 16,6 kN: cincuenta y ocho veces más.
          - valor: '66481 n'
            mensaje: |
              Parece que has calculado el área de la brida como $\pi D^{2}$ en
              vez de $\pi D^{2}/4$. Un factor cuatro en el área es un factor
              cuatro en la fuerza dominante.
        pista: |
          Cantidad de movimiento con la fuerza de presión de la brida de
          entrada, y los dos chorros proyectados.
        desarrollo: |
          $$
          p_AA_A = 1{,}35\cdot 10^{6}\cdot 0{,}01227 = 16\,567\ \text{N}
          $$
          $$
          \rho Q_Bv = 127\ \text{N}
          \qquad
          \rho Q_Cv = 383\ \text{N}
          \qquad
          \rho Q_Av_A = 8\ \text{N}
          $$
          $$
          R_x = -16\,779\ \text{N}
          \qquad
          R_y = -191\ \text{N}
          \qquad
          |R| = 16\,780\ \text{N}
          $$

      - tipo: calcular
        titulo: La inclinación de la resultante
        pregunta: |
          ¿Cuántos grados se separa de la horizontal? (solo el número)
        respuesta:
          tipo: numero
          valor: '0.65'
          tolerancia: 0.05
          formato: un ángulo en grados, solo el número
        distractores:
          - valor: '60'
            mensaje: |
              Ese es el ángulo del chorro C. La resultante no sigue esa
              dirección: el chorro solo aporta 383 N de los 16 780, así que
              apenas la desvía.
          - valor: '30'
            mensaje: |
              Parece el complementario del ángulo del chorro. La resultante
              está dominada por la presión, que es horizontal, así que su
              inclinación tiene que ser pequeñísima.
        pista: |
          $\arctan(R_y/R_x)$, con las dos componentes que acabas de calcular.
        desarrollo: |
          $$
          \beta = \arctan\frac{191}{16\,779} = 0{,}65°
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los chorros salen a 51,97 m/s, que es lo que da Bernoulli con
              los 13,5 bar de A.
          - texto: >-
              Por B salen 2,449 l/s y por C los 7,369 restantes, y sus flujos
              de cantidad de movimiento valen 127 y 383 N.
          - texto: >-
              La fuerza sobre la pieza son 16 780 N a 0,65° de la horizontal,
              de los que 16 567 los pone la presión sobre la brida.
          - texto: >-
              Como la presión domina, el reparto de caudal entre las dos
              boquillas no influye en el resultado.
            trampa: true
            mensaje: |
              Influye en la **dirección**, que es la mitad de lo que se pide.
              Los 0,65° salen íntegramente del chorro C: si todo el caudal
              saliera por B, la resultante sería exactamente horizontal, y si
              saliera todo por C, se inclinaría 1,2°. Que un término sea
              pequeño en módulo no lo hace irrelevante cuando es el único que
              actúa en una dirección.

    resolucion: |
      **La velocidad de salida.** Con 13,5 bar y sin pérdidas ni cotas,
      Bernoulli da $v = 51{,}97$ m/s en **las dos** boquillas: la velocidad
      depende de la carga, no del diámetro. Por eso el enunciado puede
      permitirse no dar $\phi_C$.

      **El reparto de caudal.** Por A entran $9{,}817$ l/s. Por B salen
      $c_{c,B}A_Bv = 2{,}449$, y los $7{,}369$ restantes se van por C. El
      diámetro de C no hace falta: la continuidad lo fija.

      **El balance.**

      | término | valor |
      |---|---|
      | $p_AA_A$ (presión en la brida) | 16 567 N |
      | $\rho Q_Bv$ (chorro B) | 127 N |
      | $\rho Q_Cv$ (chorro C) | 383 N |
      | $\rho Q_Av_A$ (entrada) | 8 N |

      $$
      |R| = 16\,780\ \text{N}
      \qquad
      \beta = 0{,}65°
      $$

      **Y ahí está la lección.** El 99 % de la fuerza la pone la **presión**
      sobre la brida de entrada, no el chorro. El anclaje de esta pieza se
      dimensiona por la presión de prueba de la conducción, y el efecto de
      todo el caudal es inclinar la resultante menos de un grado.

      Compáralo con un álabe de Pelton, donde la presión es atmosférica en
      todas las caras, se cancela, y **todo** el esfuerzo lo pone la cantidad
      de movimiento. Son los dos casos límite del mismo teorema, y saber en
      cuál se está es lo primero que hay que decidir.

  # ── 3 (12,5 %) · Estática con dos manómetros redundantes y uno que miente.
  #    La gracia es que no se sabe cuál falla hasta que se recorre la
  #    instalación por un tercer camino.
  - id: exflu2324-ord-3-los-dos-manometros-y-el-que-miente
    titulo: Dos manómetros redundantes, y cómo saber cuál miente
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Dentro de una cámara cerrada **C** hay dos depósitos presurizados: el
      **A**, con aire encima de una columna de líquido $s_1$ de altura $h_1$,
      y el **B**, con aire encima de una columna de $s_3$ de altura $h_3$.
      Los dos están comunicados por el fondo a través de un tramo con líquido
      $s_2$ que asciende $h_2$.

      Un manómetro Bourdon de **presiones absolutas** $P_1$, conectado al aire
      de A, mide $3{,}57\ \text{kg/cm}^{2}$. Sobre el aire de B hay **dos
      manómetros redundantes**, $P_2$ y $P_3$, y en una revisión se descubre
      que uno de los dos lee mal.

      Un manómetro en U con líquido $s_4$ une la cámara C con el exterior y da
      una lectura $R$, y un barómetro de mercurio mide la atmósfera exterior,
      $H$.

      a) Justificar razonadamente cuál de los manómetros mide
      incorrectamente.

      b) Calcular la presión absoluta en la cámara C (bar).

      c) Calcular la densidad relativa del líquido $s_4$.

      Datos: $s_1 = 1{,}2$; $s_2 = 13{,}6$; $s_3 = 8$; $h_1 = 60\ \text{cm}$;
      $h_2 = 40\ \text{cm}$; $h_3 = 1{,}5\ \text{m}$; $R = 39{,}6\ \text{cm}$;
      $H = 400\ \text{mm}$; $P_2 = 1{,}16\cdot 10^{5}$ Pa;
      $P_3 = 1{,}54\cdot 10^{5}$ Pa.
    pide: Cuál de los dos manómetros falla, la presión absoluta de la cámara y la densidad del líquido s4.

    pasos:
      - tipo: reconocer
        pregunta: |
          $P_2$ y $P_3$ están dentro de la cámara C y miden presiones
          relativas. ¿Cómo se decide cuál miente?
        opciones:
          - texto: >-
              Cada lectura da un valor distinto de la presión de C, y solo uno
              de los dos es compatible con el manómetro en U que une C con el
              exterior
            correcta: true
            mensaje: |
              Exacto. La redundancia por sí sola no dice cuál falla: hace
              falta un **tercer camino** independiente, y ese es el manómetro
              en U. Es el mismo problema del Pitot averiado de un avión.
          - texto: >-
              El que se aparta más de la media de los dos
            mensaje: |
              Con dos aparatos no hay media que valga: cada uno es la mitad de
              la muestra. Y aunque hubiera tres, «el que más se aparta» es un
              criterio estadístico, no físico.
          - texto: >-
              El que da la presión mayor, porque una fuga siempre hace leer de
              más
            mensaje: |
              Una avería puede desviar en cualquier sentido: un aparato
              descalibrado, una toma obstruida o una columna atrapada leen de
              más o de menos según el caso. Aquí no se sabe hasta comprobarlo.

      - tipo: calcular
        titulo: La presión absoluta del aire de B
        pregunta: |
          Recorriendo la instalación desde A, ¿qué presión absoluta hay en el
          aire de B?
        respuesta:
          tipo: magnitud
          valor: '1.86 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2.93 bar'
            mensaje: |
              Has sumado la columna de mercurio en vez de restarla. El tramo
              $s_2$ **asciende** $h_2$, así que al subirlo la presión baja: y
              con $s_2 = 13{,}6$ esa bajada son 53 kPa.
          - valor: '1.72 bar'
            mensaje: |
              Has restado la columna de $s_1$. Bajando desde el aire de A por
              su propio líquido la presión **aumenta**: es la única de las
              tres que suma.
        pista: |
          Desde el aire de A: bajas $h_1$ por $s_1$, subes $h_2$ por $s_2$ y
          subes $h_3$ por $s_3$.
        desarrollo: |
          $$
          p_B = p_A + \gamma_1h_1 - \gamma_2h_2 - \gamma_3h_3
          $$
          $$
          = 349\,860 + 7056 - 53\,312 - 117\,600 = 186\,004\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La presión de la cámara
        pregunta: |
          ¿Qué presión absoluta hay en la cámara C?
        respuesta:
          tipo: magnitud
          valor: '0.7 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.32 bar'
            mensaje: |
              Has usado $P_3$. Los dos dan un valor de la presión de C —0,70 y
              0,32 bar— y hay que decidir cuál es el bueno con el manómetro en
              U, no eligiendo al azar.
          - valor: '1.86 bar'
            mensaje: |
              Esa es la presión absoluta del aire de **B**. La de la cámara
              sale de restarle la lectura del manómetro que está dentro de
              ella.
        pista: |
          $P_2$ y $P_3$ son relativas al ambiente que las rodea, que es la
          cámara C.
        desarrollo: |
          $$
          p_C = p_{B,\text{abs}} - P_2 = 186\,004 - 116\,000
          = 70\,004\ \text{Pa} = 0{,}70\ \text{bar}
          $$

          Con $P_3$ saldrían $32\,004$ Pa, y el apartado c) muestra que ese
          valor no es compatible con el manómetro en U: **el que miente es
          $P_3$.**

      - tipo: calcular
        titulo: La densidad del líquido manométrico
        pregunta: |
          ¿Cuánto vale $s_4$?
        respuesta:
          tipo: numero
          valor: '4.3'
          tolerancia: 0.1
          formato: un número sin unidades
        distractores:
          - valor: '18.04'
            mensaje: |
              Te has dejado la presión atmosférica. El manómetro en U mide la
              **diferencia** entre la cámara y el exterior, y el exterior está
              a 400 mmHg, es decir 53,3 kPa.
          - valor: '0.043'
            mensaje: |
              Un factor cien: has metido $R$ en centímetros. Son
              $0{,}396$ m.
        pista: |
          $p_C - p_{at} = \gamma_4 R$, con la atmosférica que da el barómetro.
        desarrollo: |
          $$
          p_{at} = 0{,}4\cdot 13{,}6\cdot 9800 = 53\,312\ \text{Pa}
          $$
          $$
          \gamma_4 = \frac{70\,004 - 53\,312}{0{,}396} = 42\,141\ \text{N/m}^{3}
          \;\Longrightarrow\;
          s_4 = 4{,}30
          $$

          Un valor perfectamente posible para un líquido manométrico pesado.
          Con $P_3$ saldría $\gamma_4$ **negativo**, que es lo que delata al
          aparato averiado.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Recorriendo desde A —bajando por $s_1$, subiendo por $s_2$ y por
              $s_3$— el aire de B está a 1,86 bar absolutos.
          - texto: >-
              Cada manómetro da entonces una presión de cámara distinta: 0,70
              bar con $P_2$ y 0,32 con $P_3$.
          - texto: >-
              El manómetro en U desempata: con 0,70 bar sale $s_4 = 4{,}3$,
              plausible; con 0,32 saldría un peso específico negativo, que es
              imposible. Miente $P_3$.
          - texto: >-
              Y como $P_2$ ha resultado correcto, la instalación puede
              prescindir de $P_3$ sin perder seguridad.
            trampa: true
            mensaje: |
              Sin $P_3$ no habría habido forma de **saber** que algo fallaba:
              un solo manómetro leyendo mal no se delata. La redundancia no ha
              servido para decidir cuál era el bueno —eso lo ha hecho el
              manómetro en U— pero sí para levantar la sospecha, que es su
              función. Quitarla es quedarse ciego ante la próxima avería.

    resolucion: |
      **El recorrido.** Desde el aire de A, cuya presión absoluta da el
      Bourdon, se llega al aire de B sumando y restando columnas:

      $$
      p_B = p_A + \gamma_1h_1 - \gamma_2h_2 - \gamma_3h_3 = 1{,}86\ \text{bar}
      $$

      Solo la primera suma —bajar por el líquido de A— y las otras dos restan,
      porque el fluido asciende en los dos tramos.

      **Los dos candidatos.** $P_2$ y $P_3$ están **dentro** de la cámara, así
      que miden respecto de ella. Cada uno da una presión de cámara distinta:

      | | lectura | $p_C$ resultante |
      |---|---|---|
      | $P_2$ | 116 kPa | 70,0 kPa = 0,70 bar |
      | $P_3$ | 154 kPa | 32,0 kPa = 0,32 bar |

      **El desempate.** El manómetro en U une la cámara con el exterior, que
      el barómetro sitúa en 53,3 kPa. Con 0,70 bar la cámara está **por
      encima** del exterior y el líquido $s_4$ sale de

      $$
      \gamma_4 = \frac{70\,004 - 53\,312}{0{,}396} = 42\,141\ \text{N/m}^{3}
      \;\Longrightarrow\;
      s_4 = 4{,}30
      $$

      Con 0,32 bar la cámara estaría **por debajo** del exterior, la lectura
      del manómetro en U tendría el signo contrario al dibujado, y el peso
      específico saldría negativo. **Miente $P_3$.**

      **Lo que este ejercicio enseña sobre la redundancia.** Dos aparatos que
      se contradicen dicen que algo falla, pero no cuál. Para eso hace falta
      un tercer camino **independiente**, y aquí lo es: el manómetro en U no
      pasa por ninguno de los dos depósitos. Es exactamente la misma
      estructura que el Pitot averiado de un avión, donde dos sistemas
      redundantes discrepan y hay que decidir cuál creer.

  # ── 4 (15 %) · Fuerzas sobre superficies con vacuómetro. La sutileza: en el
  #    tramo de aire la presión es CONSTANTE y en el líquido varía, así que el
  #    prisma no es un triángulo sino un rectángulo negativo más dos
  #    triángulos.
  - id: exflu2324-ord-4-la-compuerta-abc-con-vacuometro
    titulo: La compuerta ABC, y el prisma que no es un triángulo
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      La compuerta ABC de un depósito cerrado está articulada en **A** y tiene
      un tope en **C**. Su profundidad es de $2\ \text{m}$ y el fluido tiene
      $s = 1{,}5$.

      De arriba abajo: **A** está en la coronación; $1\ \text{m}$ más abajo
      empieza el líquido; **B** está $2\ \text{m}$ por debajo de la lámina; y
      de B a **C** hay $2{,}5\ \text{m}$ ocupados por una parte
      **semicilíndrica** que sobresale hacia el fluido. El metro superior está
      ocupado por aire, sobre el que un **vacuómetro** $P_1$ marca
      $14{,}7\ \text{kPa}$.

      a) Dibujar los prismas de presiones acotados.

      b) Calcular las componentes horizontal y vertical de la fuerza
      hidrostática sobre la compuerta ABC.

      c) Calcular la reacción en el tope C.

      Nota: despreciar el peso de la compuerta. Centroide del semicírculo:
      $4R/(3\pi)$.
    pide: Las dos componentes de la fuerza hidrostática y la reacción en el tope.

    pasos:
      - tipo: reconocer
        pregunta: |
          El metro superior de la compuerta está en contacto con el aire del
          depósito. ¿Cómo es la presión ahí?
        opciones:
          - texto: >-
              **Constante** e igual a la del vacuómetro, porque el peso del
              aire es despreciable: el prisma es un rectángulo, no un
              triángulo
            correcta: true
            mensaje: |
              Exacto, y es donde se pierde este ejercicio. En el líquido la
              presión crece linealmente; en el aire no crece nada. El prisma
              de la compuerta tiene por tanto tres trozos, no uno.
          - texto: >-
              Crece linealmente desde cero, como en el líquido
            mensaje: |
              Eso supondría que el aire pesa como el fluido. Con
              $\gamma_{\text{aire}} \approx 12\ \text{N/m}^{3}$ frente a
              $14\,700$, la variación en un metro es de doce pascales:
              despreciable frente a los 14 700 del vacuómetro.
          - texto: >-
              Es nula, porque el aire no ejerce fuerza sobre la pared
            mensaje: |
              El aire está en **depresión**, a $-14{,}7$ kPa, y eso son casi
              30 kN sobre el metro superior de compuerta, tirando hacia
              dentro. Es uno de los tres términos del resultado.

      - tipo: calcular
        titulo: La profundidad del plano piezométrico
        pregunta: |
          ¿Cuántos metros por debajo de la lámina queda el plano de presión
          nula?
        respuesta:
          tipo: magnitud
          valor: '1 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.5 m'
            mensaje: |
              Has dejado la depresión en metros de columna de **agua**:
              $14{,}7$ kPa son $1{,}5$ mca. El fluido tiene $s = 1{,}5$, así
              que en su columna son la mitad de metros.
          - valor: '0.67 m'
            mensaje: |
              Has multiplicado por $1{,}5$ en vez de dividir. Un fluido más
              pesado necesita **menos** altura para dar la misma presión.
        pista: |
          $14{,}7$ kPa en columna del fluido de $s = 1{,}5$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{14\,700}{1{,}5\cdot 9800} = 1\ \text{m}
          $$

          Y como es depresión, el plano piezométrico queda 1 m **por debajo**
          de la lámina, es decir 2 m por debajo de A: justo en B.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Cuánto vale la resultante horizontal sobre ABC?
        respuesta:
          tipo: magnitud
          valor: '135.98 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '165.38 kn'
            mensaje: |
              Te has dejado el metro de aire. Está a $-14{,}7$ kPa sobre
              $1\times 2$ m de compuerta: 29,4 kN tirando hacia dentro, que
              hay que restar.
          - valor: '121.28 kn'
            mensaje: |
              Has tratado el aire como si su presión creciera con la
              profundidad. No lo hace: en el metro superior el prisma es un
              **rectángulo** de $-14{,}7$ kPa, no un triángulo.
        pista: |
          Tres trozos: el rectángulo negativo del aire, el triángulo negativo
          del primer metro de líquido y el triángulo positivo del resto.
        desarrollo: |
          | tramo | prisma | fuerza |
          |---|---|---|
          | aire, 1 m | rectángulo $-14{,}7$ kPa | $-29{,}4$ kN |
          | líquido, de 0 a 1 m bajo la lámina | triángulo negativo | $-14{,}7$ kN |
          | líquido, de 1 a 4,5 m | triángulo positivo | $+180{,}1$ kN |

          $$
          F_H = -29{,}4 - 14{,}7 + 180{,}1 = 135{,}98\ \text{kN}\ (\rightarrow)
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          ¿Y la vertical, sobre la parte semicilíndrica?
        respuesta:
          tipo: magnitud
          valor: '72.16 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '36.08 kn'
            mensaje: |
              Has usado un cuarto de círculo. La parte BC es un
              **semicilindro** de 2,5 m de altura, así que su radio es 1,25 m
              y su sección, media circunferencia completa.
          - valor: '144.32 kn'
            mensaje: |
              Has usado el círculo entero. Solo sobresale la mitad: el
              diámetro coincide con la línea BC de la compuerta.
        pista: |
          El volumen del semicilindro por el peso específico. Fíjate en que no
          depende de dónde esté el plano piezométrico.
        desarrollo: |
          $$
          R = \frac{2{,}5}{2} = 1{,}25\ \text{m}
          \qquad
          A = \frac{\pi R^{2}}{2} = 2{,}454\ \text{m}^{2}
          $$
          $$
          F_V = \gamma\,b\,A = 14\,700\cdot 2\cdot 2{,}454
          = 72{,}16\ \text{kN}\ (\uparrow)
          $$

          Las dos mitades del semicírculo se compensan en lo que respecta al
          plano piezométrico, y por eso el resultado es simplemente el empuje
          del volumen desplazado.

      - tipo: calcular
        titulo: La reacción en el tope
        pregunta: |
          ¿Qué reacción soporta el tope C?
        respuesta:
          tipo: magnitud
          valor: '128.68 kn'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '135.64 kn'
            mensaje: |
              Te has dejado el momento de la componente vertical. Actúa a
              $4R/(3\pi) = 0{,}53$ m del plano de la compuerta, y su momento
              descuenta 38 kN·m.
          - valor: '142.6 kn'
            mensaje: |
              Has sumado el momento de la vertical en vez de restarlo.
              Comprueba el sentido: la vertical apunta hacia arriba y su
              brazo la lleva hacia el fluido, así que ayuda al tope en vez de
              cargarlo.
        pista: |
          Momentos respecto de A, con cada uno de los tres trozos del prisma
          en su centroide y la vertical a $4R/(3\pi)$ del plano.
        desarrollo: |
          | fuerza | brazo desde A | momento |
          |---|---|---|
          | $-29{,}4$ kN (aire) | 0,50 m | $-14{,}7$ |
          | $-14{,}7$ kN (triángulo negativo) | 1,33 m | $-19{,}6$ |
          | $+180{,}1$ kN (triángulo positivo) | 4,33 m | $+780{,}3$ |
          | $+72{,}16$ kN (vertical) | 0,53 m | $-38{,}3$ |

          $$
          R_C = \frac{746{,}0 - 38{,}3}{5{,}5} = 128{,}68\ \text{kN}\ (\leftarrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El vacuómetro hunde el plano piezométrico 1 m bajo la lámina, es
              decir justo hasta B.
          - texto: >-
              El prisma tiene tres trozos —rectángulo de aire, triángulo
              negativo y triángulo positivo— y su resultante son 135,98 kN
              hacia fuera.
          - texto: >-
              La vertical es el empuje del semicilindro, 72,16 kN hacia
              arriba, y no depende del vacuómetro.
          - texto: >-
              Tomando momentos en A sale $R_C = 128{,}68$ kN, menor que la
              componente horizontal porque la articulación se lleva el resto.
            trampa: true
            mensaje: |
              La articulación **no** se lleva «el resto» en el sentido que
              sugiere la frase: la reacción en A no es $135{,}98 - 128{,}68$.
              El tope y la articulación no se reparten la horizontal en
              proporción a nada; cada uno sale de su propia ecuación —el tope
              de momentos en A, la articulación de fuerzas— y ahí interviene
              también la vertical de 72 kN. Que $R_C$ salga menor que $F_H$ es
              una consecuencia de los brazos, no un reparto.

    resolucion: |
      **Lo que hace distinto a este ejercicio.** No es el vacuómetro —eso ya
      sale en otros— sino que la compuerta tiene **aire por encima del
      líquido**. En el aire la presión es constante; en el líquido crece. El
      prisma de presiones no es un triángulo: son tres trozos.

      **El plano piezométrico.** $14{,}7$ kPa en columna del fluido de
      $s = 1{,}5$ son exactamente $1$ m, así que el plano de presión nula cae
      1 m bajo la lámina, es decir **en B**. El enunciado está construido para
      que caiga ahí.

      **La horizontal.**

      | tramo | prisma | fuerza |
      |---|---|---|
      | aire (1 m) | rectángulo de $-14{,}7$ kPa | $-29{,}4$ kN |
      | líquido, primer metro | triángulo negativo | $-14{,}7$ kN |
      | líquido, 3,5 m restantes | triángulo positivo | $+180{,}1$ kN |
      | | **total** | **$135{,}98$ kN** $(\rightarrow)$ |

      Tratar el aire como si tuviera gradiente da 121,3 kN; olvidarlo del todo
      da 165,4. Los dos errores son de más del 10 %.

      **La vertical.** El semicilindro de $R = 1{,}25$ m desplaza
      $2{,}454\ \text{m}^{2}$ por metro de profundidad, y

      $$
      F_V = \gamma\,b\,\frac{\pi R^{2}}{2} = 72{,}16\ \text{kN}\ (\uparrow)
      $$

      **y no depende del vacuómetro en absoluto**: las dos mitades del
      semicírculo están simétricas respecto de su centro, así que cualquier
      presión uniforme se cancela y solo queda el empuje del volumen. Es una
      comprobación cómoda cuando la parte curva es media circunferencia.

      **El tope.** Momentos respecto de A, con la vertical restando porque su
      brazo la lleva hacia el fluido:

      $$
      R_C = \frac{746{,}0 - 38{,}3}{5{,}5} = 128{,}68\ \text{kN}\ (\leftarrow)
      $$

  # ── 5 (12,5 %) · Vaciado de depósito, con el orificio elevado sobre el
  #    fondo y una pregunta de razonamiento puro en medio: si el primer cuarto
  #    tarda 16 s, ¿el segundo tarda más o menos?
  - id: exflu2324-ord-5-el-tiempo-de-vaciado
    titulo: El tiempo de vaciado, y por qué el segundo cuarto tarda más
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se dispone de un depósito abierto de sección rectangular
      $30\times 25\ \text{cm}$ y altura $1\ \text{m}$, con un orificio de
      salida de diámetro $25\ \text{mm}$ situado a $h_0 = 200\ \text{mm}$
      sobre el fondo. El factor de paso de la salida es $k = 0{,}11$.

      a) Deducir la expresión del tiempo de vaciado.

      b) El depósito está inicialmente lleno y tarda $16\ \text{s}$ en vaciar
      **un cuarto** del volumen que contiene. Deducir, **sin calcular**, si
      vaciar otro cuarto llevará un tiempo mayor, menor o igual.

      c) Calcular el coeficiente de contracción del orificio.
    pide: La expresión del tiempo de vaciado, el razonamiento sobre el segundo cuarto y el coeficiente de contracción.

    pasos:
      - tipo: reconocer
        pregunta: |
          El orificio está a 20 cm del fondo. ¿Qué carga impulsa la salida?
        opciones:
          - texto: >-
              La altura de agua **por encima del orificio**, no la altura
              total: el agua que queda por debajo no puede salir
            correcta: true
            mensaje: |
              Eso es, y decide todo el ejercicio. Con el depósito lleno la
              carga son 80 cm, no 100, y el vaciado termina cuando la lámina
              llega al orificio, con 20 cm todavía dentro.
          - texto: >-
              La altura total de agua, 1 m, porque es la que da la presión en
              el fondo
            mensaje: |
              La presión en el fondo no importa: lo que impulsa el chorro es
              la presión **en el orificio**, y esa la da la columna que hay
              encima de él.
          - texto: >-
              La altura del orificio sobre el suelo, 20 cm
            mensaje: |
              Eso sería la carga si el chorro cayera desde el orificio hasta
              el suelo, que es otro problema. Aquí lo que se descarga es el
              agua del depósito y la carga es la que hay por **encima**.

      - tipo: calcular
        titulo: La carga al empezar y al acabar el primer cuarto
        pregunta: |
          ¿Cuánta carga queda sobre el orificio tras vaciar el primer cuarto
          del volumen?
        respuesta:
          tipo: magnitud
          valor: '0.55 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.75 m'
            mensaje: |
              Esa es la altura de la lámina sobre el **fondo**. La carga se
              mide desde el orificio, que está 20 cm más arriba.
          - valor: '0.6 m'
            mensaje: |
              Parece que has repartido el cuarto sobre los 80 cm de carga en
              vez de sobre el metro de altura. El cuarto es del **volumen que
              contiene** el depósito, que ocupa el metro entero.
        pista: |
          Un cuarto de $0{,}30\times 0{,}25\times 1$ hace bajar la lámina
          25 cm; después réstale los 20 cm del orificio.
        desarrollo: |
          $$
          z_1 = 1{,}00 - 0{,}20 = 0{,}80\ \text{m}
          \qquad
          z_2 = 0{,}75 - 0{,}20 = 0{,}55\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente de contracción
        pregunta: |
          ¿Cuánto vale $c_c$?
        respuesta:
          tipo: numero
          valor: '0.695'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '0.659'
            mensaje: |
              Te has dejado el coeficiente de velocidad. El factor de paso
              $k = 0{,}11$ significa $c_v = 1/\sqrt{1{,}11} = 0{,}949$, y
              multiplica al de contracción en el caudal.
          - valor: '0.609'
            mensaje: |
              Has usado las alturas sobre el fondo, 1,00 y 0,75 m, en vez de
              las cargas sobre el orificio, 0,80 y 0,55.
        pista: |
          $t = \dfrac{2ab}{c_vc_cA_o\sqrt{2g}}\left(\sqrt{z_1}-\sqrt{z_2}\right)$,
          con $c_v = 1/\sqrt{1+k}$.
        desarrollo: |
          $$
          c_v = \frac{1}{\sqrt{1{,}11}} = 0{,}949
          \qquad
          A_o = \frac{\pi\,0{,}025^{2}}{4} = 4{,}909\cdot 10^{-4}\ \text{m}^{2}
          $$
          $$
          16 = \frac{2\cdot 0{,}075\,(\sqrt{0{,}80}-\sqrt{0{,}55})}
          {0{,}949\,c_c\,4{,}909\cdot 10^{-4}\sqrt{19{,}6}}
          = \frac{11{,}11}{c_c}
          $$
          $$
          c_c = 0{,}695
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La velocidad de salida es $c_v\sqrt{2gz}$, con $z$ la carga
              sobre el orificio.
          - texto: >-
              El segundo cuarto se vacía con la lámina más baja, así que $z$
              es menor y la velocidad también.
          - texto: >-
              Menos velocidad es menos caudal, y como hay que evacuar el mismo
              volumen, **el segundo cuarto tarda más**.
          - texto: >-
              Y como el caudal va con $\sqrt z$, el segundo cuarto tardará
              exactamente $\sqrt{2}$ veces lo que el primero.
            trampa: true
            mensaje: |
              La relación no es esa. El tiempo va con
              $\sqrt{z_1}-\sqrt{z_2}$, así que el primer cuarto tarda
              $\sqrt{0{,}80}-\sqrt{0{,}55} = 0{,}153$ y el segundo
              $\sqrt{0{,}55}-\sqrt{0{,}30} = 0{,}194$: un 27 % más, no un
              41 %. El apartado pide razonar el **sentido**, no inventar una
              proporción.

    resolucion: |
      **a) La expresión.** El caudal que sale vacía el depósito:

      $$
      -ab\,\frac{dz}{dt} = c_vc_cA_o\sqrt{2gz}
      \;\Longrightarrow\;
      t = \frac{2ab}{c_vc_cA_o\sqrt{2g}}\left(\sqrt{z_1}-\sqrt{z_2}\right)
      $$

      con $z$ medida **desde el orificio**, que es lo que decide el
      ejercicio: el agua que queda por debajo no participa.

      **b) El razonamiento, sin calcular.** La velocidad de salida va con
      $\sqrt z$. El segundo cuarto se evacua con la lámina más baja, luego con
      menos velocidad, luego con menos caudal; y como el volumen a evacuar es
      el mismo, **tarda más**. Ese es todo el argumento y no hace falta
      ningún número.

      **c) El coeficiente.** Las cargas son $0{,}80$ y $0{,}55$ m —no 1,00 y
      0,75, que son alturas sobre el fondo—, y el factor de paso da
      $c_v = 1/\sqrt{1{,}11} = 0{,}949$:

      $$
      c_c = 0{,}695
      $$

      **Y una comprobación del apartado b) con números, ya que se tienen.**

      | cuarto | de | a | $\sqrt{z_1}-\sqrt{z_2}$ | tiempo |
      |---|---|---|---|---|
      | 1.º | 0,80 | 0,55 | 0,153 | 16,0 s |
      | 2.º | 0,55 | 0,30 | 0,194 | 20,3 s |
      | 3.º | 0,30 | 0,05 | 0,324 | 33,9 s |

      El último cuarto tarda **más del doble** que el primero, y el depósito
      nunca llega a vaciarse del todo: se para cuando la lámina alcanza el
      orificio, con 15 litros dentro. Los dos hechos salen de la misma raíz
      cuadrada.

  # ── 6 (15 %) · Bombeo, y el ejercicio que destapó nuestro error con el
  #    C_HW. Su apartado b) es poco común: deducir la curva de la bomba a
  #    partir de dos puntos de funcionamiento, no leerla de un catálogo.
  - id: exflu2324-ord-6-la-bomba-deducida-de-dos-puntos
    titulo: La curva de la bomba, deducida de dos puntos de funcionamiento
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se emplea una bomba para elevar agua de un depósito abierto bajo tierra
      ($z = -6\ \text{m}$) a otro depósito abierto cuya superficie libre está
      a cota $24\ \text{m}$. Todas las tuberías son de hierro galvanizado.

      En la aspiración hay una válvula de pie con filtro ($k = 2{,}5$) y la
      salida del depósito es de ángulos redondeados ($k = 0{,}05$). En la
      impulsión hay tres codos de $90°$ de radio medio ($k = 0{,}75$ cada
      uno), una válvula de compuerta abierta ($k = 0{,}19$) y la entrada al
      depósito ($k = 1$).

      | | aspiración | impulsión |
      |---|---|---|
      | $L$ (m) | 15 | 50 |
      | $D$ (mm) | 150 | 125 |

      a) Expresión analítica de la curva característica de la instalación,
      empleando Hazen-Williams.

      Si el caudal del punto de funcionamiento es de $80\ \text{l/s}$:

      b) Deducir la expresión $H_{mb} = A - B\,Q^{2}$ de la bomba, sabiendo
      que al cerrar parcialmente la válvula —generando $8\ \text{m}$ de
      pérdidas— el caudal disminuye un $10\ \%$.

      c) Si en lugar de cerrar la válvula se presuriza uno de los depósitos
      para obtener el mismo punto del apartado b), deducir la nueva curva de
      la instalación.
    pide: La curva de la instalación, la de la bomba deducida de dos puntos y la curva al presurizar.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) da dos puntos por los que pasa la bomba y pide su
          curva. ¿Cuáles son esos dos puntos?
        opciones:
          - texto: >-
              $(80;\ H_{mi}(80))$ con la válvula abierta, y
              $(72;\ H_{mi}(72)+8)$ con la válvula cerrada, porque los 8 m de
              la válvula los tiene que dar también la bomba
            correcta: true
            mensaje: |
              Exacto. La bomba no sabe de dónde viene la resistencia: al
              cerrar la válvula, la instalación pide 8 m más a cada caudal, y
              el nuevo punto de corte está sobre la **misma** curva de la
              bomba.
          - texto: >-
              $(80;\ H_{mi}(80))$ y $(72;\ H_{mi}(72))$, porque la válvula no
              cambia la curva de la bomba
            mensaje: |
              No la cambia, y por eso los dos puntos están en ella. Pero el
              segundo punto está donde la bomba corta a la **nueva** curva de
              la instalación, que va 8 m más arriba.
          - texto: >-
              $(80;\ 30)$ y $(72;\ 38)$, usando las alturas geométricas
            mensaje: |
              Los 30 m son la altura piezométrica, la que la instalación pide
              a caudal cero. A 80 l/s pide casi el doble, porque las pérdidas
              son 29,5 m.

      - tipo: calcular
        titulo: La altura piezométrica
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: magnitud
          valor: '30 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '18 m'
            mensaje: |
              Has restado. El depósito de origen está **bajo tierra**, a
              $-6$ m: la diferencia con la cota 24 es $24-(-6) = 30$.
          - valor: '24 m'
            mensaje: |
              Te has quedado con la cota del depósito superior. Hay que
              contar desde el inferior, que está seis metros por debajo del
              nivel del suelo.
        pista: |
          De lámina a lámina, con el signo de la cota negativa.
        desarrollo: |
          $$
          H_{\text{piez}} = 24 - (-6) = 30\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de la instalación en el punto de funcionamiento
        pregunta: |
          ¿Cuánta altura pide la instalación a $80\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '59.52 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '40.11 m'
            mensaje: |
              Te has dejado el término de Hazen-Williams. Los 65 m de tubería
              piden 19,4 m a ese caudal, casi el doble que las pérdidas
              menores.
          - valor: '49.41 m'
            mensaje: |
              Te has dejado las pérdidas menores. Son $1{,}58\cdot 10^{-3}
              Q^{2}$, es decir 10,1 m a 80 l/s: los cinco factores de paso
              suman mucho en una tubería tan corta.
        pista: |
          $H_{mi} = 30 + 1{,}58\cdot 10^{-3}Q^{2} + 5{,}8\cdot 10^{-3}
          Q^{1{,}852}$, con $Q$ en l/s.
        desarrollo: |
          $$
          H_{mi}(80) = 30 + 10{,}11 + 19{,}41 = 59{,}52\ \text{m}
          $$

          El término en $Q^{2}$ recoge los cinco factores de paso, cada uno
          con la altura cinética de **su** tramo; el término en $Q^{1{,}852}$
          es Hazen-Williams con $C_{HW} = 130$ en los 150 mm y $120$ en los
          125, que son las bandas del cuadro n.º 25 para
          $\varepsilon/D = 10^{-3}$ y $1{,}2\cdot 10^{-3}$.

      - tipo: calcular
        titulo: La altura a caudal nulo de la bomba
        pregunta: |
          ¿Cuánto vale $A$ en $H_{mb} = A - B\,Q^{2}$?
        respuesta:
          tipo: magnitud
          valor: '73.41 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '59.52 m'
            mensaje: |
              Esa es la altura en el punto de funcionamiento, no a caudal
              nulo. La curva de la bomba baja al aumentar el caudal: su
              ordenada en el origen es mayor.
          - valor: '54.16 m'
            mensaje: |
              Esa es la altura que la instalación pide a 72 l/s **sin** los 8
              m de la válvula. Con la válvula cerrada la bomba tiene que dar
              8 m más, y ese es el segundo punto.
        pista: |
          Dos ecuaciones con dos incógnitas: la curva pasa por $(80; 59{,}52)$
          y por $(72; 54{,}16+8)$.
        desarrollo: |
          $$
          A - B\cdot 80^{2} = 59{,}52
          \qquad
          A - B\cdot 72^{2} = 62{,}16
          $$
          $$
          B = \frac{59{,}52-62{,}16}{72^{2}-80^{2}} = 2{,}17\cdot 10^{-3}
          \qquad
          A = 73{,}41\ \text{m}
          $$

      - tipo: calcular
        titulo: La curva al presurizar
        pregunta: |
          Si en vez de cerrar la válvula se presuriza un depósito, ¿cuál es el
          nuevo término independiente?
        respuesta:
          tipo: magnitud
          valor: '38 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '30 m'
            mensaje: |
              Ese es el original. Presurizar cambia la altura piezométrica: es
              precisamente lo que se hace para mover el punto de
              funcionamiento sin estrangular.
          - valor: '22 m'
            mensaje: |
              Has restado los 8 m. Para **reducir** el caudal hay que hacer la
              instalación más exigente, así que la curva sube.
        pista: |
          Los 8 m que antes ponía la válvula tienen que ponerlos ahora la
          presión del depósito.
        desarrollo: |
          $$
          H_{mi} = 38 + 1{,}58\cdot 10^{-3}Q^{2}
          + 5{,}8\cdot 10^{-3}Q^{1{,}852}
          $$

          Es la **misma** curva desplazada 8 m hacia arriba, y por eso corta a
          la bomba en el mismo punto que con la válvula cerrada.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La instalación pide $30 + 1{,}58\cdot 10^{-3}Q^{2} +
              5{,}8\cdot 10^{-3}Q^{1{,}852}$, es decir 59,52 m a 80 l/s.
          - texto: >-
              Cerrando la válvula la curva sube 8 m y el corte baja a 72 l/s,
              donde la bomba da 62,16 m.
          - texto: >-
              Con esos dos puntos, la curva de la bomba es
              $73{,}41 - 2{,}17\cdot 10^{-3}Q^{2}$.
          - texto: >-
              Y presurizar el depósito 8 m produce el mismo efecto que la
              válvula, así que las dos maniobras son equivalentes.
            trampa: true
            mensaje: |
              Equivalentes en el **punto de funcionamiento**, no en lo que
              cuestan. Los 8 m de la válvula se disipan en calor; los 8 m de
              presurización quedan almacenados en el depósito y se recuperan
              al usar el agua. La bomba consume lo mismo en los dos casos, pero
              en uno el trabajo se tira y en el otro no. Que dos curvas se
              corten en el mismo sitio no las hace iguales.

    resolucion: |
      **a) La curva.** Dos términos:

      $$
      H_{mi} = 30 + \underbrace{1{,}58\cdot 10^{-3}Q^{2}}_{\text{cinco }k}
      + \underbrace{5{,}8\cdot 10^{-3}Q^{1{,}852}}_{\text{Hazen-Williams}}
      $$

      Los cinco factores de paso van cada uno con la altura cinética de su
      tramo —los dos de la aspiración con los 150 mm, los tres de la impulsión
      con los 125— y suman $1{,}58\cdot 10^{-3}$.

      **Y el detalle que hace valioso este ejercicio.** El término de
      Hazen-Williams solo sale si el mismo hierro galvanizado toma
      $C_{HW} = 130$ en la tubería de 150 mm y $120$ en la de 125. Eso es
      imposible si el coeficiente fuera del material: lo que decide es
      $\varepsilon/D$, que vale $10^{-3}$ y $1{,}2\cdot 10^{-3}$ y cae en dos
      bandas distintas del cuadro n.º 25. **Este examen es la comprobación de
      que la tabla va por rugosidad relativa y no por material.**

      **b) La bomba, deducida.** Lo que rara vez se hace: en vez de leer la
      curva de un catálogo, se deduce de dos puntos de funcionamiento. Al
      cerrar la válvula la instalación pide 8 m más a cada caudal, así que el
      nuevo corte, $(72;\ 62{,}16)$, está en la **misma** curva de la bomba
      que el viejo, $(80;\ 59{,}52)$. Dos ecuaciones, dos incógnitas:

      $$
      H_{mb} = 73{,}41 - 2{,}17\cdot 10^{-3}\,Q^{2}
      $$

      **c) Presurizando.** Los 8 m que ponía la válvula los pone ahora la
      presión del depósito, y el término independiente pasa de 30 a 38:

      $$
      H_{mi} = 38 + 1{,}58\cdot 10^{-3}Q^{2} + 5{,}8\cdot 10^{-3}Q^{1{,}852}
      $$

      **La comparación de las dos maniobras**, que es lo que el apartado c)
      quiere que se vea: las dos llevan al mismo punto y la bomba consume lo
      mismo. La diferencia es dónde va a parar la energía. Estrangulando se
      disipa en calor dentro de la válvula; presurizando queda como presión
      en el depósito de llegada, disponible para el uso siguiente. Es el
      mismo caudal por el mismo dinero, pero con un producto distinto.

  # ── 7 (10 %) · Análisis dimensional con nueve variables, y la conclusión
  #    de siempre en canales: con un solo fluido no se puede tener Reynolds y
  #    Froude a la vez.
  - id: exflu2324-ord-7-el-canal-de-donostia-a-barcelona
    titulo: El canal de Donostia a Barcelona, y la semejanza que no puede ser
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se quiere diseñar un sistema de canales y bombas que conducirán el agua
      de Donostia a Barcelona. El caudal $Q$ que llevará el canal depende del
      diámetro $D$, la viscosidad absoluta $\mu$, la densidad $\rho$, la
      gravedad $g$, el coeficiente de rugosidad de Manning $n$, la pendiente
      $J$, la longitud $L$ y la velocidad $v$.

      a) Obtener los parámetros adimensionales del sistema, con $L$, $\rho$ y
      $v$ como variables repetidas.

      El canal será semicircular, de $10\ \text{m}$ de diámetro, de hormigón
      en bruto, con una pendiente de 1 milésima, y siempre irá completamente
      lleno. El modelo será semicircular de $46{,}75\ \text{cm}$ de diámetro y
      transportará agua en las mismas condiciones de presión y temperatura.

      b) ¿Se puede lograr una semejanza dinámica absoluta? Razonar la
      respuesta.
    pide: Los parámetros adimensionales y si la semejanza absoluta es posible.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las nueve variables, dos ya son adimensionales. ¿Cuáles y qué
          consecuencia tiene?
        opciones:
          - texto: >-
              La pendiente $J$; y el coeficiente de Manning **no** lo es, así
              que solo una se lleva su propio $\pi$ sin más
            correcta: true
            mensaje: |
              Exacto, y el $n$ de Manning es la trampa: parece adimensional
              porque se da como un número de tabla, pero tiene dimensiones
              $T\,L^{-1/3}$. De ahí sale el $\pi_5 = n\,v/L^{2/3}$.
          - texto: >-
              La pendiente $J$ y el coeficiente de Manning $n$, así que dos
              parámetros salen gratis
            mensaje: |
              El $n$ de Manning **no** es adimensional: sus unidades son
              $\text{s}/\text{m}^{1/3}$, y por eso hay que combinarlo con $v$
              y $L$ para adimensionalizarlo.
          - texto: >-
              La pendiente $J$ y la relación $D/L$, que ya viene dada
            mensaje: |
              $D$ y $L$ son dos variables separadas del enunciado; que su
              cociente sea adimensional es un **resultado** del teorema, no un
              dato de partida.

      - tipo: calcular
        titulo: Cuántos parámetros
        pregunta: |
          ¿Cuántos parámetros adimensionales describen el fenómeno? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              Esas son las variables. El teorema $\pi$ resta las magnitudes
              fundamentales: nueve menos tres.
          - valor: '5'
            mensaje: |
              Parece que has descartado la pendiente por ser adimensional. No
              se descarta: es uno de los seis, $\pi_6 = J$.
        pista: |
          $n - m$, con nueve variables y tres magnitudes fundamentales.
        desarrollo: |
          $$
          9 - 3 = 6
          $$
          $$
          \pi_1 = \frac{Q}{vL^{2}}
          \quad
          \pi_2 = \frac{D}{L}
          \quad
          \pi_3 = \frac{\mu}{\rho vL}
          \quad
          \pi_4 = \frac{gL}{v^{2}}
          \quad
          \pi_5 = \frac{n\,v}{L^{2/3}}
          \quad
          \pi_6 = J
          $$

      - tipo: calcular
        titulo: La relación de viscosidades que haría falta
        pregunta: |
          Igualando $\pi_3$ y $\pi_4$ a la vez, la viscosidad del modelo tiene
          que ser $\lambda^{-3/2}$ veces la del prototipo. ¿Cuánto vale
          $\lambda^{3/2}$? (solo el número)
        respuesta:
          tipo: numero
          valor: '98.9'
          tolerancia: 1
          formato: un número sin unidades
        distractores:
          - valor: '21.39'
            mensaje: |
              Ese es $\lambda$ a secas, la escala geométrica. Combinar
              Reynolds con Froude da $\lambda^{3/2}$: la escala elevada a tres
              medios.
          - valor: '4.63'
            mensaje: |
              Ese es $\sqrt\lambda$, que es la relación de **velocidades** que
              impone Froude. La de viscosidades sale de multiplicarla por
              $\lambda$.
        pista: |
          $\lambda = D_p/D_m = 10/0{,}4675$, y después elévalo a $3/2$.
        desarrollo: |
          $$
          \lambda = \frac{10}{0{,}4675} = 21{,}39
          \qquad
          \lambda^{3/2} = 98{,}9
          $$

          Es decir, el modelo necesitaría un líquido **99 veces menos viscoso
          que el agua**, y va a usar agua.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Nueve variables y tres magnitudes fundamentales dan seis
              parámetros, entre ellos el inverso de Reynolds y el de Froude al
              cuadrado.
          - texto: >-
              Igualar los dos a la vez obliga a
              $\nu_m/\nu_p = \lambda^{-3/2}$, y con $\lambda = 21{,}39$ eso
              son 99 veces menos viscosidad.
          - texto: >-
              El modelo usa agua en las mismas condiciones, así que
              $\nu_m/\nu_p = 1$: **la semejanza absoluta es imposible**.
          - texto: >-
              La solución sería construir el modelo a escala 1:1, que es la
              única en la que la condición se cumple.
            trampa: true
            mensaje: |
              Es cierto que $\lambda = 1$ la cumple, pero un modelo a escala
              1:1 no es un modelo: es el prototipo. La salida real es otra:
              **elegir cuál de los dos números importa**. En un canal con
              superficie libre manda Froude, se ensaya con él, y el efecto del
              Reynolds distinto se corrige después con el coeficiente de
              Manning. Renunciar a la semejanza absoluta es lo normal, no un
              fracaso.

    resolucion: |
      **a) Los seis parámetros.** Nueve variables menos tres magnitudes
      fundamentales:

      $$
      \pi_1 = \frac{Q}{vL^{2}}
      \quad
      \pi_2 = \frac{D}{L}
      \quad
      \pi_3 = \frac{\mu}{\rho vL}
      \quad
      \pi_4 = \frac{gL}{v^{2}}
      \quad
      \pi_5 = \frac{n\,v}{L^{2/3}}
      \quad
      \pi_6 = J
      $$

      $\pi_3$ es el inverso de Reynolds y $\pi_4$ el inverso del cuadrado de
      Froude. $\pi_6$ sale gratis porque la pendiente ya es adimensional; el
      $n$ de Manning **no** lo es —vale $\text{s}/\text{m}^{1/3}$— y por eso
      necesita a $v$ y $L$ para adimensionalizarse.

      **b) La imposibilidad.** Igualando $\pi_3$ y $\pi_4$ a la vez:

      $$
      \frac{\nu_m}{\nu_p} = \left(\frac{L_m}{L_p}\right)^{3/2}
      = \lambda^{-3/2} = \frac{1}{98{,}9}
      $$

      El modelo tendría que llevar un líquido **99 veces menos viscoso que el
      agua**, y el enunciado dice que llevará agua en las mismas condiciones.
      Imposible.

      **Y la salida que el examen no pide pero conviene saber.** No se
      renuncia al ensayo: se renuncia a uno de los dos números. En un canal
      con superficie libre manda Froude —las olas y el resalto son fenómenos
      de gravedad— así que se ensaya con Froude, el Reynolds del modelo queda
      99 veces por debajo, y el desajuste se corrige eligiendo un material de
      modelo con el $n$ de Manning que compense. Es exactamente lo que hace
      $\pi_5$ en la lista, y por eso está ahí.

  # ── 8 (15 %) · El de más peso junto con el 4 y el 6. Dos incógnitas —caudal
  #    y longitud equivalente— y dos ecuaciones: la pérdida total y la lectura
  #    del manómetro invertido entre A y B.
  - id: exflu2324-ord-8-el-codo-y-su-longitud-equivalente
    titulo: El codo, y cómo se mide su longitud equivalente
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Por un tubo vertical que baja de **1** a **A**, un codo de $90°$ de A a
      **B**, y un tramo horizontal de B a **2**, circula un caudal $Q$ de un
      fluido de $s = 1{,}2$ y $\mu = 7{,}2\cdot 10^{-3}\ \text{Pl}$. Todo el
      sistema es de fundición asfaltada, con $20\ \text{mm}$ de diámetro
      interior y una longitud física total de $L = 0{,}75\ \text{m}$ que
      **no** incluye la longitud equivalente del codo.

      Las pérdidas de carga entre la entrada (1) y la salida (2) son
      $h_{f,1\text{-}2} = 1\ \text{mca}$.

      Entre la entrada (A) y la salida (B) del codo hay una diferencia de cota
      $H = 10\ \text{cm}$, y un manómetro en U con líquido manométrico
      $s_m = 1{,}0$ conectado entre ambos puntos da una lectura
      $R = 30\ \text{cm}$.

      Calcular el caudal circulante $Q$ (l/s) y la longitud equivalente del
      codo.
    pide: El caudal y la longitud equivalente del codo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El líquido manométrico ($s_m = 1{,}0$) es **más ligero** que el que
          circula ($s = 1{,}2$). ¿Qué significa eso?
        opciones:
          - texto: >-
              Que es un manómetro **invertido**, y la pérdida vale
              $R\,(1 - s_m/s)$ en columna del fluido, no $R\,(s_m/s - 1)$
            correcta: true
            mensaje: |
              Eso es. Con el manométrico más ligero el menisco se coloca
              arriba y la lectura se lee al revés. Aquí
              $R(1-1/1{,}2) = 0{,}05$ m: la lectura de 30 cm corresponde a
              solo 5 cm de pérdida.
          - texto: >-
              Que el manómetro no sirve, porque los dos líquidos se mezclarían
            mensaje: |
              Se usan a propósito manométricos inmiscibles más ligeros que el
              fluido cuando las diferencias de presión son pequeñas: amplifican
              la lectura, que es justo lo que pasa aquí —30 cm de lectura para
              5 cm de pérdida—.
          - texto: >-
              Que hay que sumar la diferencia de cota $H$ a la lectura
            mensaje: |
              La cota ya está dentro: el manómetro mide diferencias de **cota
              piezométrica**, $p/\gamma + z$, que es exactamente lo que
              queremos. El dato $H$ está en el enunciado para quien lo
              plantee mal.

      - tipo: calcular
        titulo: La pérdida en el codo
        pregunta: |
          ¿Cuánta carga se pierde en el codo?
        respuesta:
          tipo: magnitud
          valor: '0.05 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.3 m'
            mensaje: |
              Esa es la lectura del manómetro. Con un manométrico más ligero
              que el fluido, la pérdida es $R\,(1-s_m/s)$: seis veces menos.
          - valor: '0.06 m'
            mensaje: |
              Has usado $s/s_m - 1 = 0{,}2$. Con el manométrico **más ligero**
              el factor es $1 - s_m/s = 0{,}1667$, que no es lo mismo.
        pista: |
          Manómetro invertido: $\Delta\left(\dfrac{p}{\gamma}+z\right)
          = R\left(1-\dfrac{s_m}{s}\right)$.
        desarrollo: |
          $$
          h_{f,\text{codo}} = 0{,}30\left(1-\frac{1{,}0}{1{,}2}\right)
          = 0{,}05\ \text{m de columna del fluido}
          $$

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '1.027 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1.138 l/s'
            mensaje: |
              Has usado el «1 mca» tal cual. Son metros de columna de
              **agua**, es decir una presión: en columna del fluido de
              $s = 1{,}2$ son $0{,}833$ m.
          - valor: '1.061 l/s'
            mensaje: |
              Te has dejado el codo. De los $0{,}833$ m de pérdida total,
              $0{,}05$ se los lleva el codo, y solo los $0{,}783$ restantes
              corresponden a los 0,75 m de tubo recto.
        pista: |
          Resta la pérdida del codo de la total, pásalo todo a columna del
          fluido, y resuelve el tramo recto de 0,75 m. Fundición asfaltada,
          $\varepsilon = 0{,}012$ cm.
        desarrollo: |
          $$
          \nu = \frac{7{,}2\cdot 10^{-3}}{1200} = 6\cdot 10^{-6}\
          \text{m}^{2}/\text{s}
          \qquad
          \frac{\varepsilon}{D} = 6\cdot 10^{-3}
          $$
          $$
          h_{f,\text{recto}} = \frac{1}{1{,}2} - 0{,}05 = 0{,}783\ \text{m}
          $$

          Iterando sobre $v$ con Colebrook-White:
          $f = 0{,}0383$, $Re = 10\,894$, $v = 3{,}27$ m/s y

          $$
          Q = 1{,}027\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La longitud equivalente del codo
        pregunta: |
          ¿Cuántos milímetros de tubo recto equivale el codo?
        respuesta:
          tipo: magnitud
          valor: '47.9 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '57.5 mm'
            mensaje: |
              Viene de haber tomado $0{,}06$ m de pérdida en el codo en vez de
              $0{,}05$: el error del manómetro invertido se traslada entero.
          - valor: '287 mm'
            mensaje: |
              Has usado los 30 cm de lectura como pérdida. El codo equivaldría
              entonces a casi treinta centímetros de tubo, más de un tercio de
              toda la instalación.
        pista: |
          $h_{f,\text{codo}} = f\,\dfrac{L_{eq}}{D}\,\dfrac{v^{2}}{2g}$, con el
          $f$ y la $v$ que acabas de obtener.
        desarrollo: |
          $$
          L_{eq} = \frac{h_{f,\text{codo}}\,D\,2g}{f\,v^{2}}
          = \frac{0{,}05\cdot 0{,}02\cdot 19{,}6}{0{,}0383\cdot 3{,}27^{2}}
          = 0{,}0479\ \text{m} = 47{,}9\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro invertido da $R(1-s_m/s) = 0{,}05$ m de pérdida en
              el codo.
          - texto: >-
              El «1 mca» de pérdida total son $0{,}833$ m de columna del
              fluido, de los que $0{,}783$ corresponden al tubo recto.
          - texto: >-
              Con esos 0,783 m en 0,75 m de tubo de 20 mm sale $Q = 1{,}027$
              l/s, y con ellos el codo equivale a 47,9 mm de tubo.
          - texto: >-
              Es decir que el codo equivale a poco más de dos diámetros de
              tubo recto, que es lo habitual en un codo de 90°.
            trampa: true
            mensaje: |
              Dos diámetros y medio es **poquísimo** para un codo de 90°: lo
              habitual son 20 a 30 diámetros. Lo que ocurre aquí es que el
              tubo es muy rugoso en términos relativos —$\varepsilon/D =
              6\cdot 10^{-3}$— y su $f$ es enorme, $0{,}038$, así que un metro
              de tubo pierde mucho y hacen falta pocos milímetros para igualar
              al codo. **La longitud equivalente no es una propiedad del
              accesorio**: depende de la tubería con la que se compare.

    resolucion: |
      **Dos incógnitas y dos medidas.** El caudal y la longitud equivalente
      del codo salen de dos datos independientes: la pérdida total entre 1 y 2
      y la lectura del manómetro entre A y B. Ninguno basta solo.

      **El manómetro invertido.** El líquido manométrico es **más ligero**
      que el que circula, así que el menisco se coloca arriba y la lectura se
      interpreta al revés:

      $$
      h_{f,\text{codo}} = R\left(1-\frac{s_m}{s}\right) = 0{,}05\ \text{m}
      $$

      Treinta centímetros de lectura para cinco de pérdida: la amplificación
      es justo la razón de usar un manométrico ligero cuando la diferencia es
      pequeña. Y la diferencia de cota $H$ **no interviene**, porque un
      manómetro mide diferencias de cota piezométrica, que ya la incluyen.

      **La conversión que decide el resultado.** Los «1 mca» de pérdida total
      son metros de columna de **agua**, es decir una presión. En columna del
      fluido de $s = 1{,}2$ son $0{,}833$ m. Usarlos sin convertir da 1,138
      l/s en vez de 1,027: un 11 % de error que no se delata.

      **El caudal.** Restando el codo quedan $0{,}783$ m para los 0,75 m de
      tubo recto, y con $\varepsilon/D = 6\cdot 10^{-3}$ y
      $\nu = 6\cdot 10^{-6}$ la iteración converge a

      $$
      f = 0{,}0383
      \qquad
      v = 3{,}27\ \text{m/s}
      \qquad
      Q = 1{,}027\ \text{l/s}
      $$

      **La longitud equivalente.**

      $$
      L_{eq} = \frac{h_{f,\text{codo}}\,D\,2g}{f\,v^{2}} = 47{,}9\ \text{mm}
      $$

      **Y lo que ese número enseña.** Cuarenta y ocho milímetros son dos
      diámetros y medio, cuando lo habitual para un codo de 90° son veinte o
      treinta. No es que este codo sea especialmente bueno: es que el tubo con
      el que se compara es especialmente malo. Con $\varepsilon/D =
      6\cdot 10^{-3}$ y $Re = 10\,900$, el coeficiente de frotamiento es
      $0{,}038$ —el doble de lo corriente— así que hacen falta muy pocos
      milímetros de tubo para perder lo mismo que el codo.

      **La longitud equivalente de un accesorio no es una propiedad del
      accesorio**: es una equivalencia con **una** tubería concreta, y cambia
      con el material, el diámetro y hasta el caudal. Por eso las tablas la
      dan en diámetros ($L_{eq}/D$) y no en metros, y por eso el método de los
      factores de paso, que no depende de la tubería, es más limpio.
