ejercicios:
  # ── 1 (7,5 %) · Capilaridad en una sección que no es un tubo. La fórmula de
  #    Jurin no sirve: hay que volver al equilibrio de fuerzas y contar el
  #    perímetro y el área que hay de verdad.
  - id: exflu2324-ord-1-la-capilaridad-entre-dos-tubos
    titulo: La capilaridad entre dos tubos, donde Jurin no sirve
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Supónganse los dos tubos de la figura, uno exterior, con sección
      cuadrada (con lado $b$) y otro interior, circular (diámetro $D$). En la
      imagen se representa la sección transversal A-A’ de estos tubos y la
      sección longitudinal B-B’.

      Sabiendo que hay un fluido entre ambos tubos, se pide:

      a) Dibujar en la sección B-B’ la superficie libre correspondiente al
      fluido sabiendo que *moja* al sólido. Determinar claramente en la figura
      las fuerzas que condicionan la subida / bajada del fluido.

      b) Deducir la expresión válida para determinar el ascenso/descenso
      capilar de cualquier fluido.

      c) Obtener el ascenso/descenso capilar del fluido para unos valores de
      $D = 2\ \text{mm}$ y $b = 3\ \text{mm}$, sabiendo que el fluido es un
      alcohol con una tensión superficial de
      $3{,}31\cdot 10^{-3}\ \text{J/m}^{2}$, una densidad de
      $790\ \text{kg/m}^{3}$ y un ángulo de contacto de $0°$.

      **Notas nuestras.** La figura del cuadernillo tiene dos vistas. A la
      izquierda, la sección transversal A-A’: un cuadrado de lado $b$ con un
      círculo de diámetro $D$ centrado dentro, y la traza B-B’ como una
      horizontal que pasa por el centro. A la derecha, la sección longitudinal
      B-B’: cuatro rectas verticales, las dos de fuera separadas $b$ (el tubo
      cuadrado) y las dos de dentro separadas $D$ (el circular), con la traza
      A-A’ horizontal. El fluido ocupa las dos rendijas de $(b - D)/2$ que
      quedan entre ellas; la superficie libre no está dibujada, porque es lo
      que pide el apartado a). Dentro del tubo circular no hay fluido, así que
      se entiende cerrado por abajo.
    pide: La expresión del ascenso capilar en esta sección y su valor numérico.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no vale aquí la fórmula de Jurin,
          $h = 4\sigma\cos\theta/(\gamma D)$?
        opciones:
          - texto: >-
              Porque está deducida para un tubo circular, y su $4/D$ es en
              realidad el cociente perímetro/área de ese caso concreto: aquí
              hay que recalcularlo
            correcta: true
            mensaje: |
              Exacto. Jurin no es una ley aparte: es el equilibrio
              $\sigma\cos\theta\,P = \gamma\,h\,A$ resuelto para un círculo.
              Cambiada la sección, cambian $P$ y $A$ y la fórmula es otra.
          - texto: >-
              Porque con dos tubos hay dos meniscos y las tensiones se
              cancelan
            mensaje: |
              No se cancelan: las dos tiran hacia arriba, porque el líquido
              moja las dos superficies. Por eso el perímetro que hay que poner
              es la **suma** de los dos contornos.
          - texto: >-
              Porque el hueco entre los tubos no es un capilar
            mensaje: |
              Sí lo es: lo que define un capilar no es su forma sino que sea
              lo bastante estrecho para que la tensión superficial pese frente
              al peso de la columna. Aquí el hueco tiene medio milímetro.

      - tipo: dibujar
        consigna: |
          El apartado a) en papel: la sección longitudinal B-B’ con sus cuatro
          paredes —las dos del tubo cuadrado, separadas $b$, y las dos del
          circular, separadas $D$—, el fluido en las dos rendijas que quedan
          entre ellas con su superficie libre, y las fuerzas que lo suben o lo
          bajan. Dibújalo antes de deducir nada: el perímetro del apartado b)
          sale de contar las paredes que tiran.
        comprueba:
          - punto: >-
              En cada rendija, un menisco cóncavo pegado a las dos paredes: la
              del tubo cuadrado y la del circular.
            porque: >-
              El fluido moja, así que la adhesión gana a la cohesión y el
              menisco es cóncavo, como el agua en el vidrio de la diapositiva 28
              del tema 2. Moja las dos caras de la rendija: pegarlo solo a la
              pared de fuera es contar solo el perímetro $4b$.
          - punto: >-
              La tensión superficial en cada línea de contacto, a lo largo de
              la pared y hacia arriba: cuatro flechas en el corte, dos por
              rendija.
            porque: >-
              Son las fuerzas que el apartado pide «determinar claramente». Con
              el ángulo de contacto de $0°$ el menisco es tangente a la pared y
              la tensión tira en vertical entera; con un ángulo mayor de $90°$
              apuntaría hacia abajo y el fluido bajaría.
          - punto: >-
              El peso de la columna levantada, hacia abajo, y la altura $h$
              acotada desde la lámina libre de fuera.
            porque: >-
              Es la otra mitad del equilibrio que deduce el apartado b): la
              componente vertical de la tensión por el contorno mojado sostiene
              ese peso. Sin él, las flechas de arriba no equilibran nada.
          - punto: >-
              Las dos rendijas a la misma altura, y esa altura en proporción:
              con los números del apartado c), 1,334 mm sobre una rendija de
              0,5 mm, algo más de dos veces y media su anchura.
            porque: >-
              El corte pasa por el centro y la sección es simétrica: las dos
              rendijas son el mismo hueco. Y dibujar la columna a escala es la
              forma de ver que el hueco estrecho y con dos paredes mojadas sube
              más que el tubo de 2 mm solo, que se quedaría en 0,855 mm.
        figura: |
