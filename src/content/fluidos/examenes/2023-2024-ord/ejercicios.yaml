      - tipo: calcular
        titulo: El perímetro mojado de la sección
        pregunta: |
          ¿Cuánto vale el contorno sobre el que actúa la tensión superficial?
        respuesta:
          tipo: magnitud
          valor: '18.28 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '12 mm'
            mensaje: |
              Solo has contado el tubo exterior, $4b$. El líquido también moja
              el tubo interior, y su circunferencia $\pi D$ tira hacia arriba
              exactamente igual.
          - valor: '6.28 mm'
            mensaje: |
              Solo has contado el tubo interior, $\pi D$. Falta el cuadrado
              exterior, que aporta $4b = 12$ mm.
        pista: |
          Las dos superficies que el líquido moja: el interior del cuadrado y
          el exterior del círculo.
        desarrollo: |
          $$
          P = 4b + \pi D = 4\cdot 3 + \pi\cdot 2 = 18{,}28\ \text{mm}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: la expresión del ascenso o descenso capilar
          en este hueco, desde el equilibrio vertical de la columna, con el
          contorno y el área que tiene de verdad. «De cualquier fluido», dice
          el enunciado: la misma expresión tiene que servir para uno que moja y
          sube y para uno que no moja y baja.
        rubrica: ascenso-capilar
        veredicto: |
          Si tu folio llega a la expresión impresa, con $4b + \pi D$ arriba y
          $4b^{2} - \pi D^{2}$ abajo, y dice qué pasa con $\theta > 90°$, tienes
          los mínimos de la rúbrica que caen en este apartado; las fuerzas del
          menisco ya las dibujaste en el a). Si pone Jurin con otro diámetro,
          vuelve al equilibrio: la fórmula del tubo circular es un caso
          particular, no el punto de partida.

      - tipo: calcular
        titulo: El ascenso capilar
        pregunta: |
          ¿Cuánto sube el alcohol?
        respuesta:
          tipo: magnitud
          valor: '1.334 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.855 mm'
            mensaje: |
              Has aplicado Jurin a un tubo circular de $D = 2$ mm, olvidando
              que la sección real es el hueco entre los dos tubos: menos área
              y más perímetro, así que sube más.
          - valor: '0.459 mm'
            mensaje: |
              Has contado solo el perímetro del tubo interior, $\pi D$, con el
              área buena del hueco. El fluido moja también el tubo cuadrado,
              y sus $4b = 12$ mm de contorno tiran hacia arriba igual: son dos
              tercios de la fuerza.
        pista: |
          Equilibrio: $\sigma\cos\theta\,P = \gamma\,h\,A$, con
          $A = b^{2} - \pi D^{2}/4$.
        desarrollo: |
          $$
          h = \frac{\sigma\cos\theta\,(4b+\pi D)}
          {\gamma\left(b^{2}-\dfrac{\pi D^{2}}{4}\right)}
          = \frac{4\sigma\cos\theta\,(4b+\pi D)}{\gamma\,(4b^{2}-\pi D^{2})}
          $$
          $$
          = \frac{4\cdot 3{,}31\cdot 10^{-3}\cdot 0{,}01828}
          {790\cdot 9{,}8\cdot 2{,}343\cdot 10^{-5}} = 1{,}334\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión superficial actúa sobre todo el contorno mojado, que
              aquí son los dos: $4b$ del cuadrado y $\pi D$ del círculo.
          - texto: >-
              Su componente vertical, $\sigma\cos\theta\,(4b+\pi D)$, sostiene
              el peso de la columna, $\gamma h\,(b^{2}-\pi D^{2}/4)$.
          - texto: >-
              Despejando sale
              $h = 4\sigma\cos\theta(4b+\pi D)/[\gamma(4b^{2}-\pi D^{2})]$, y
              con los datos, 1,334 mm.
          - texto: >-
              Y como el resultado es mayor que el de un tubo circular de
              diámetro $D$, se concluye que el tubo interior favorece el
              ascenso porque estrecha el paso.
            trampa: true
            mensaje: |
              Sube más, sí, pero no «porque estrecha el paso»: sube porque el
              cociente perímetro/área es mayor. El tubo interior **quita**
              área (3,14 de 9 mm²) y **añade** perímetro (6,28 sobre 12 mm), y
              las dos cosas empujan en el mismo sentido. Lo que decide es el
              cociente $P/A$, que pasa de 2,00 a 3,12 mm⁻¹.

    resolucion: |
      **a) La superficie libre.** En el corte B-B’ el fluido está en dos
      rendijas de medio milímetro. Como moja, en cada una forma un menisco
      cóncavo pegado a las dos paredes, y la tensión superficial tira hacia
      arriba en las cuatro líneas de contacto contra el peso de la columna.
      La figura del paso de dibujo lo enseña a la escala del apartado c).

      **Por qué Jurin no vale.** La fórmula $h = 4\sigma\cos\theta/(\gamma D)$
      no es una ley: es el equilibrio de fuerzas resuelto para un tubo
      circular. Su $4/D$ es, escrito de otra forma, el cociente entre el
      perímetro $\pi D$ y el área $\pi D^{2}/4$. Cambiada la sección hay que
      recalcularlo.

      **El equilibrio.** La componente vertical de la tensión superficial
      sostiene el peso de la columna:

      $$
      \sigma\cos\theta\,\underbrace{(4b + \pi D)}_{\text{contorno mojado}}
      = \gamma\,h\,\underbrace{\left(b^{2}-\frac{\pi D^{2}}{4}\right)}
      _{\text{sección del hueco}}
      $$

      **La expresión y el número.**

      $$
      h = \frac{4\sigma\cos\theta\,(4b+\pi D)}{\gamma\,(4b^{2}-\pi D^{2})}
      = 1{,}334\ \text{mm}
      $$

      **La comparación que da sentido al resultado.** En un tubo circular de
      2 mm el mismo alcohol subiría 0,855 mm. Aquí sube un 56 % más, y la
      razón está en el cociente perímetro/área:

      | | perímetro | área | $P/A$ |
      |---|---|---|---|
      | tubo circular $D = 2$ | 6,28 mm | 3,14 mm² | 2,00 mm⁻¹ |
      | hueco cuadrado-círculo | 18,28 mm | 5,86 mm² | 3,12 mm⁻¹ |

      **Y la regla general que sale de aquí:** el ascenso capilar de cualquier
      sección vale

      $$
      h = \frac{\sigma\cos\theta}{\gamma}\,\frac{P}{A}
      $$

      Todo lo demás —Jurin incluido— son casos particulares de esa expresión.
      Es la misma estructura que el radio hidráulico del tema 19, y por el
      mismo motivo: un fenómeno de contorno frente a un fenómeno de volumen.

  # ── 2 (12,5 %) · Cantidad de movimiento sobre una pieza a 13,5 bar. La
  #    lección está en el reparto: de los 16,8 kN, 16,6 los pone p·A y el
  #    chorro solo inclina la resultante 0,65°.
  - id: exflu2324-ord-2-la-pieza-con-dos-boquillas
    titulo: La pieza con dos boquillas, y quién pone de verdad la fuerza
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Supongamos que tenemos una pieza como la de la figura, colocada al final
      de un tubo que transporta agua. Esta pieza especial consta de dos
      boquillas, una en el punto B, situada a la altura del eje de la tubería
      principal y con chorro horizontal, y otra en el punto C.

      Se pide:

      a) Determinar la fuerza (dirección y módulo) del flujo sobre la pieza
      especial. No considerar pérdidas de carga, diferencias de cota y peso
      del agua.

      **Datos**: $p_A = 13{,}5\ \text{bar}$, $\alpha = 60°$,
      $\phi_A = 125\ \text{mm}$, $\phi_B = 10\ \text{mm}$,
      $v_A = 0{,}8\ \text{m/s}$, $c_{c,A} = 1$, $c_{c,B} = 0{,}6$,
      $c_{c,C} = 0{,}7$.

      **Notas nuestras.** En la figura, el tubo llega horizontal por la
      izquierda con un manómetro en A y termina en una brida. La pieza sale
      de la brida: arriba, en B, a la altura del eje, la boquilla que lanza su
      chorro horizontal hacia delante; desde ahí la pieza se curva hacia abajo
      y hacia atrás hasta la boquilla C, cuyo chorro sale hacia abajo y hacia
      atrás, y el ángulo $\alpha$ está entre su eje y la vertical. El
      enunciado no da el diámetro de C.
    pide: El módulo y la dirección de la fuerza sobre la pieza.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los chorros salen a la atmósfera. ¿Con qué velocidad?
        opciones:
          - texto: >-
              Con la que da Bernoulli desde A: toda la carga de presión de A
              se convierte en altura cinética, así que
              $v = \sqrt{v_A^{2} + 2p_A/\rho}$
            correcta: true
            mensaje: |
              Eso es. Con 13,5 bar la velocidad de salida es de 52 m/s, y esa
              es la misma para las dos boquillas: no dependen del diámetro
              sino de la carga disponible.
          - texto: >-
              Con $v_A$ multiplicada por la relación de áreas, por continuidad
            mensaje: |
              La continuidad reparte el caudal entre las dos boquillas, pero
              no fija la velocidad de cada una: eso lo hace Bernoulli. De
              hecho el enunciado ni siquiera da el diámetro de la boquilla C.
          - texto: >-
              Con $\sqrt{2gh}$, tomando $h$ como la diferencia de cotas
            mensaje: |
              El enunciado dice expresamente que se desprecien las diferencias
              de cota. Lo que impulsa el chorro es la **presión** de 13,5 bar,
              que en altura son 138 m.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad salen los chorros?
        respuesta:
          tipo: magnitud
          valor: '51.97 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '36.76 m/s'
            mensaje: |
              Te has dejado el 2. La altura cinética es $v^{2}/2g$, así que al
              despejar aparece $v = \sqrt{2p/\rho}$, no $\sqrt{p/\rho}$.
          - valor: '0.8 m/s'
            mensaje: |
              Esa es la velocidad en la tubería principal, de 125 mm. Las
              boquillas son de 10 mm y aprovechan además toda la presión: la
              velocidad se multiplica por sesenta y cinco.
        pista: |
          Bernoulli de A a la salida, sin cotas ni pérdidas:
          $p_A/\gamma + v_A^{2}/2g = v^{2}/2g$.
        desarrollo: |
          $$
          v = \sqrt{v_A^{2} + \frac{2p_A}{\rho}}
          = \sqrt{0{,}8^{2} + \frac{2\cdot 1{,}35\cdot 10^{6}}{1000}}
          = 51{,}97\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal por la boquilla B
        pregunta: |
          ¿Qué caudal sale por B?
        respuesta:
          tipo: magnitud
          valor: '2.449 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '4.082 l/s'
            mensaje: |
              Te has dejado el coeficiente de contracción. La vena sale más
              estrecha que el orificio: $c_{c,B} = 0{,}6$ recorta el área a
              seis décimas.
          - valor: '9.817 l/s'
            mensaje: |
              Ese es el caudal **total** que llega por A. Por B sale una
              parte; el resto se va por C.
        pista: |
          $Q_B = c_{c,B}\,A_B\,v$, con el área geométrica de la boquilla.
        desarrollo: |
          $$
          Q_B = 0{,}6\cdot\frac{\pi\,0{,}01^{2}}{4}\cdot 51{,}97
          = 2{,}449\ \text{l/s}
          $$

          Y por continuidad, $Q_C = 9{,}817 - 2{,}449 = 7{,}369$ l/s.

      - tipo: calcular
        titulo: El módulo de la fuerza
        pregunta: |
          ¿Qué fuerza soporta la pieza?
        respuesta:
          tipo: magnitud
          valor: '16780 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '286 n'
            mensaje: |
              Solo has contado los términos de cantidad de movimiento. En una
              pieza a 13,5 bar la fuerza de presión sobre la brida de entrada
              es de 16,6 kN: cincuenta y ocho veces más.
          - valor: '66481 n'
            mensaje: |
              Parece que has calculado el área de la brida como $\pi D^{2}$ en
              vez de $\pi D^{2}/4$. Un factor cuatro en el área es un factor
              cuatro en la fuerza dominante.
        pista: |
          Cantidad de movimiento con la fuerza de presión de la brida de
          entrada, y los dos chorros proyectados.
        desarrollo: |
          $$
          p_AA_A = 1{,}35\cdot 10^{6}\cdot 0{,}01227 = 16\,567\ \text{N}
          $$
          $$
          \rho Q_Bv = 127\ \text{N}
          \qquad
          \rho Q_Cv = 383\ \text{N}
          \qquad
          \rho Q_Av_A = 8\ \text{N}
          $$
          $$
          R_x = -16\,779\ \text{N}
          \qquad
          R_y = -191\ \text{N}
          \qquad
          |R| = 16\,780\ \text{N}
          $$

      - tipo: calcular
        titulo: La inclinación de la resultante
        pregunta: |
          ¿Cuántos grados se separa de la horizontal? (solo el número)
        respuesta:
          tipo: numero
          valor: '0.65'
          tolerancia: 0.05
          formato: un ángulo en grados, solo el número
        distractores:
          - valor: '60'
            mensaje: |
              Ese es el ángulo del chorro C. La resultante no sigue esa
              dirección: el chorro solo aporta 383 N de los 16 780, así que
              apenas la desvía.
          - valor: '30'
            mensaje: |
              Parece el complementario del ángulo del chorro. La resultante
              está dominada por la presión, que es horizontal, así que su
              inclinación tiene que ser pequeñísima.
        pista: |
          $\arctan(R_y/R_x)$, con las dos componentes que acabas de calcular.
        desarrollo: |
          $$
          \beta = \arctan\frac{191}{16\,779} = 0{,}65°
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los chorros salen a 51,97 m/s, que es lo que da Bernoulli con
              los 13,5 bar de A.
          - texto: >-
              Por B salen 2,449 l/s y por C los 7,369 restantes, y sus flujos
              de cantidad de movimiento valen 127 y 383 N.
          - texto: >-
              La fuerza sobre la pieza son 16 780 N a 0,65° de la horizontal,
              de los que 16 567 los pone la presión sobre la brida.
          - texto: >-
              Como la presión domina, el reparto de caudal entre las dos
              boquillas no influye en el resultado.
            trampa: true
            mensaje: |
              Influye en la **dirección**, que es la mitad de lo que se pide.
              Los 0,65° salen íntegramente del chorro C: si todo el caudal
              saliera por B, la resultante sería exactamente horizontal, y si
              saliera todo por C, se inclinaría 0,86°. Que un término sea
              pequeño en módulo no lo hace irrelevante cuando es el único que
              actúa en una dirección.

    resolucion: |
      **La velocidad de salida.** Con 13,5 bar y sin pérdidas ni cotas,
      Bernoulli da $v = 51{,}97$ m/s en **las dos** boquillas: la velocidad
      depende de la carga, no del diámetro. Por eso el enunciado puede
      permitirse no dar $\phi_C$.

      **El reparto de caudal.** Por A entran $9{,}817$ l/s. Por B salen
      $c_{c,B}A_Bv = 2{,}449$, y los $7{,}369$ restantes se van por C. El
      diámetro de C no hace falta: la continuidad lo fija.

      **El balance.**

      | término | valor |
      |---|---|
      | $p_AA_A$ (presión en la brida) | 16 567 N |
      | $\rho Q_Bv$ (chorro B) | 127 N |
      | $\rho Q_Cv$ (chorro C) | 383 N |
      | $\rho Q_Av_A$ (entrada) | 8 N |

      $$
      |R| = 16\,780\ \text{N}
      \qquad
      \beta = 0{,}65°
      $$

      **Y ahí está la lección.** El 99 % de la fuerza la pone la **presión**
      sobre la brida de entrada, no el chorro. El anclaje de esta pieza se
      dimensiona por la presión de prueba de la conducción, y el efecto de
      todo el caudal es inclinar la resultante menos de un grado.

      Compáralo con un álabe de Pelton, donde la presión es atmosférica en
      todas las caras, se cancela, y **todo** el esfuerzo lo pone la cantidad
      de movimiento. Son los dos casos límite del mismo teorema, y saber en
      cuál se está es lo primero que hay que decidir.

  # ── 3 (12,5 %) · Estática con dos manómetros redundantes y uno que miente.
  #    La gracia es que no se sabe cuál falla hasta que se recorre la
  #    instalación por un tercer camino.
  - id: exflu2324-ord-3-los-dos-manometros-y-el-que-miente
    titulo: Dos manómetros redundantes, y cómo saber cuál miente
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de depósitos presurizados mostrada se cuenta con dos
      manómetros redundantes (2 y 3). En una revisión rutinaria, el operario
      de la instalación se percata de que uno de los dos ofrece una lectura
      incorrecta. Si el manómetro de Bourdon de presiones absolutas $P_1$
      mide una presión de $3{,}57\ \text{kg/cm}^{2}$, y considerando los datos
      proporcionados, se pide:

      a) **Justificar razonadamente** cuál de los manómetros mide
      **incorrectamente.**

      b) Calcular la presión absoluta en el depósito C (bar).

      c) Calcular la densidad relativa del líquido $s_4$.

      **DATOS**: $s_1 = 1{,}2$, $s_2 = 13{,}6$, $s_3 = 8$,
      $h_1 = 60\ \text{cm}$, $h_2 = 40\ \text{cm}$, $h_3 = 1{,}5\ \text{m}$,
      $R = 39{,}6\ \text{cm}$, $H = 400\ \text{mm}$.
      $P_2 = 1{,}16\cdot 10^{5}\ \text{Pa}$,
      $P_3 = 1{,}54\cdot 10^{5}\ \text{Pa}$

      **Notas nuestras.** En la figura, una cámara cerrada C contiene los
      dos depósitos; el apartado b) la llama «depósito C», y la resolución,
      cámara. En el A hay aire sobre el líquido $s_1$; de su fondo sale
      un tubo que baja hasta un tramo en U con el líquido $s_2$, y $h_1$ va de
      la lámina de $s_1$ a su contacto con $s_2$. El $s_2$ sube $h_2$ por la
      otra rama hasta tocar el $s_3$ del depósito B, donde hay aire sobre
      $s_3$, y $h_3$ va de la lámina de $s_3$ a ese contacto. $P_1$ está fuera
      de la cámara y mide el aire de A; $P_2$ y $P_3$ están sobre el aire de
      B, dentro de la cámara. Fuera, a la izquierda, un tubo en U con el
      líquido $s_4$ une la cámara con el exterior, con el líquido $R$ más alto
      en la rama abierta; a la derecha, un barómetro de mercurio marca $H$.
      *El cuadernillo imprime «una de los dos»; corregimos la errata.*
    pide: Cuál de los dos manómetros falla, la presión absoluta de la cámara y la densidad del líquido s4.

    pasos:
      - tipo: reconocer
        pregunta: |
          $P_2$ y $P_3$ están dentro de la cámara C y miden presiones
          relativas. ¿Cómo se decide cuál miente?
        opciones:
          - texto: >-
              Cada lectura da un valor distinto de la presión de C, y solo uno
              de los dos es compatible con el manómetro en U que une C con el
              exterior
            correcta: true
            mensaje: |
              Exacto. La redundancia por sí sola no dice cuál falla: hace
              falta un **tercer camino** independiente, y ese es el manómetro
              en U. Es el mismo problema del Pitot averiado de un avión.
          - texto: >-
              El que se aparta más de la media de los dos
            mensaje: |
              Con dos aparatos no hay media que valga: cada uno es la mitad de
              la muestra. Y aunque hubiera tres, «el que más se aparta» es un
              criterio estadístico, no físico.
          - texto: >-
              El que da la presión mayor, porque una fuga siempre hace leer de
              más
            mensaje: |
              Una avería puede desviar en cualquier sentido: un aparato
              descalibrado, una toma obstruida o una columna atrapada leen de
              más o de menos según el caso. Aquí no se sabe hasta comprobarlo.

      - tipo: calcular
        titulo: La presión absoluta del aire de B
        pregunta: |
          Recorriendo la instalación desde A, ¿qué presión absoluta hay en el
          aire de B?
        respuesta:
          tipo: magnitud
          valor: '1.86 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2.93 bar'
            mensaje: |
              Has sumado la columna de mercurio en vez de restarla. El tramo
              $s_2$ **asciende** $h_2$, así que al subirlo la presión baja: y
              con $s_2 = 13{,}6$ esa bajada son 53 kPa.
          - valor: '1.72 bar'
            mensaje: |
              Has restado la columna de $s_1$. Bajando desde el aire de A por
              su propio líquido la presión **aumenta**: es la única de las
              tres que suma.
        pista: |
          Desde el aire de A: bajas $h_1$ por $s_1$, subes $h_2$ por $s_2$ y
          subes $h_3$ por $s_3$.
        desarrollo: |
          $$
          p_B = p_A + \gamma_1h_1 - \gamma_2h_2 - \gamma_3h_3
          $$
          $$
          = 349\,860 + 7056 - 53\,312 - 117\,600 = 186\,004\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La presión de la cámara
        pregunta: |
          ¿Qué presión absoluta hay en la cámara C?
        respuesta:
          tipo: magnitud
          valor: '0.7 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.32 bar'
            mensaje: |
              Has usado $P_3$. Los dos dan un valor de la presión de C —0,70 y
              0,32 bar— y hay que decidir cuál es el bueno con el manómetro en
              U, no eligiendo al azar.
          - valor: '1.86 bar'
            mensaje: |
              Esa es la presión absoluta del aire de **B**. La de la cámara
              sale de restarle la lectura del manómetro que está dentro de
              ella.
        pista: |
          $P_2$ y $P_3$ son relativas al ambiente que las rodea, que es la
          cámara C.
        desarrollo: |
          $$
          p_C = p_{B,\text{abs}} - P_2 = 186\,004 - 116\,000
          = 70\,004\ \text{Pa} = 0{,}70\ \text{bar}
          $$

          Con $P_3$ saldrían $32\,004$ Pa, y el apartado c) muestra que ese
          valor no es compatible con el manómetro en U: **el que miente es
          $P_3$.**

      - tipo: calcular
        titulo: La densidad del líquido manométrico
        pregunta: |
          ¿Cuánto vale $s_4$?
        respuesta:
          tipo: numero
          valor: '4.3'
          tolerancia: 0.1
          formato: un número sin unidades
        distractores:
          - valor: '18.04'
            mensaje: |
              Te has dejado la presión atmosférica. El manómetro en U mide la
              **diferencia** entre la cámara y el exterior, y el exterior está
              a 400 mmHg, es decir 53,3 kPa.
          - valor: '0.043'
            mensaje: |
              Un factor cien: has metido $R$ en centímetros. Son
              $0{,}396$ m.
        pista: |
          $p_C - p_{at} = \gamma_4 R$, con la atmosférica que da el barómetro.
        desarrollo: |
          $$
          p_{at} = 0{,}4\cdot 13{,}6\cdot 9800 = 53\,312\ \text{Pa}
          $$
          $$
          \gamma_4 = \frac{70\,004 - 53\,312}{0{,}396} = 42\,141\ \text{N/m}^{3}
          \;\Longrightarrow\;
          s_4 = 4{,}30
          $$

          Un valor perfectamente posible para un líquido manométrico pesado.
          Con $P_3$ saldría $\gamma_4$ **negativo**, que es lo que delata al
          aparato averiado.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Recorriendo desde A —bajando por $s_1$, subiendo por $s_2$ y por
              $s_3$— el aire de B está a 1,86 bar absolutos.
          - texto: >-
              Cada manómetro da entonces una presión de cámara distinta: 0,70
              bar con $P_2$ y 0,32 con $P_3$.
          - texto: >-
              El manómetro en U desempata: con 0,70 bar sale $s_4 = 4{,}3$,
              plausible; con 0,32 saldría un peso específico negativo, que es
              imposible. Miente $P_3$.
          - texto: >-
              Y como $P_2$ ha resultado correcto, la instalación puede
              prescindir de $P_3$ sin perder seguridad.
            trampa: true
            mensaje: |
              Sin $P_3$ no habría habido forma de **saber** que algo fallaba:
              un solo manómetro leyendo mal no se delata. La redundancia no ha
              servido para decidir cuál era el bueno —eso lo ha hecho el
              manómetro en U— pero sí para levantar la sospecha, que es su
              función. Quitarla es quedarse ciego ante la próxima avería.

    resolucion: |
      **El recorrido.** Desde el aire de A, cuya presión absoluta da el
      Bourdon, se llega al aire de B sumando y restando columnas:

      $$
      p_B = p_A + \gamma_1h_1 - \gamma_2h_2 - \gamma_3h_3 = 1{,}86\ \text{bar}
      $$

      Solo la primera suma —bajar por el líquido de A— y las otras dos restan,
      porque el fluido asciende en los dos tramos.

      **Los dos candidatos.** $P_2$ y $P_3$ están **dentro** de la cámara, así
      que miden respecto de ella. Cada uno da una presión de cámara distinta:

      | | lectura | $p_C$ resultante |
      |---|---|---|
      | $P_2$ | 116 kPa | 70,0 kPa = 0,70 bar |
      | $P_3$ | 154 kPa | 32,0 kPa = 0,32 bar |

      **El desempate.** El manómetro en U une la cámara con el exterior, que
      el barómetro sitúa en 53,3 kPa. Con 0,70 bar la cámara está **por
      encima** del exterior y el líquido $s_4$ sale de

      $$
      \gamma_4 = \frac{70\,004 - 53\,312}{0{,}396} = 42\,141\ \text{N/m}^{3}
      \;\Longrightarrow\;
      s_4 = 4{,}30
      $$

      Con 0,32 bar la cámara estaría **por debajo** del exterior, la lectura
      del manómetro en U tendría el signo contrario al dibujado, y el peso
      específico saldría negativo. **Miente $P_3$.**

      **Lo que este ejercicio enseña sobre la redundancia.** Dos aparatos que
      se contradicen dicen que algo falla, pero no cuál. Para eso hace falta
      un tercer camino **independiente**, y aquí lo es: el manómetro en U no
      pasa por ninguno de los dos depósitos. Es exactamente la misma
      estructura que el Pitot averiado de un avión, donde dos sistemas
      redundantes discrepan y hay que decidir cuál creer.

  # ── 4 (15 %) · Fuerzas sobre superficies con vacuómetro. La sutileza: en el
  #    tramo de aire la presión es CONSTANTE y en el líquido varía, así que el
  #    prisma no es un triángulo sino un rectángulo negativo más dos
  #    triángulos.
  - id: exflu2324-ord-4-la-compuerta-abc-con-vacuometro
    titulo: La compuerta ABC, y el prisma que no es un triángulo
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 30 de mayo de 2024 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      La compuerta ABC de la instalación está articulada en A y tiene un tope
      en C. Cuenta con una parte cilíndrica (BC). La profundidad de la
      compuerta es de $2\ \text{m}$. Si el fluido el cual le ejerce presión
      tiene una densidad relativa de $s = 1{,}5$, y si el **vacuómetro** $P_1$
      ofrece una lectura de $14{,}7\ \text{kPa}$, se pide:

      a) Dibujar los prismas de presiones **acotados** en la compuerta ABC.

      b) Calcular las componentes horizontal y vertical de la fuerza
      hidrostática resultante realizada por el fluido sobre la compuerta ABC,
      indicando la dirección de cada una.

      c) Calcular la reacción en el tope C.

      **Notas nuestras.** En la figura, el depósito está a la izquierda y la
      compuerta es su pared derecha. A, la articulación, está arriba, a la
      altura de la tapa, sobre la que va el vacuómetro $P_1$. De arriba abajo
      por la compuerta: $1\ \text{m}$ de aire, $2\ \text{m}$ de fluido hasta B,
      en la misma vertical que A, y de B a C, $2{,}5\ \text{m}$ de una parte
      semicircular que sobresale hacia el fluido, con su diámetro sobre esa
      vertical. En C está el tope.
    notas:
      - >-
        **NOTA**: despreciar el peso de la compuerta. Centroide del
        semicírculo: $4\cdot R/(3\cdot\pi)$
    pide: Las dos componentes de la fuerza hidrostática y la reacción en el tope.

    pasos:
      - tipo: reconocer
        pregunta: |
          El metro superior de la compuerta está en contacto con el aire del
          depósito. ¿Cómo es la presión ahí?
        opciones:
          - texto: >-
              **Constante** e igual a la del vacuómetro, porque el peso del
              aire es despreciable: el prisma es un rectángulo, no un
              triángulo
            correcta: true
            mensaje: |
              Exacto, y es donde se pierde este ejercicio. En el líquido la
              presión crece linealmente; en el aire no crece nada. El prisma
              de la compuerta tiene por tanto tres trozos, no uno.
          - texto: >-
              Crece linealmente desde cero, como en el líquido
            mensaje: |
              Eso supondría que el aire pesa como el fluido. Con
              $\gamma_{\text{aire}} \approx 12\ \text{N/m}^{3}$ frente a
              $14\,700$, la variación en un metro es de doce pascales:
              despreciable frente a los 14 700 del vacuómetro.
          - texto: >-
              Es nula, porque el aire no ejerce fuerza sobre la pared
            mensaje: |
              El aire está en **depresión**, a $-14{,}7$ kPa, y eso son casi
              30 kN sobre el metro superior de compuerta, tirando hacia
              dentro. Es uno de los tres términos del resultado.

      - tipo: calcular
        titulo: La profundidad del plano piezométrico
        pregunta: |
          ¿Cuántos metros por debajo de la lámina queda el plano de presión
          nula?
        respuesta:
          tipo: magnitud
          valor: '1 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.5 m'
            mensaje: |
              Has dejado la depresión en metros de columna de **agua**:
              $14{,}7$ kPa son $1{,}5$ mca. El fluido tiene $s = 1{,}5$, así
              que en su columna son la mitad de metros.
          - valor: '2.25 m'
            mensaje: |
              Has multiplicado por $1{,}5$ en vez de dividir: $1{,}5$ mca por
              $1{,}5$ son $2{,}25$ m. Un fluido más pesado necesita **menos**
              altura para dar la misma presión, no más.
        pista: |
          $14{,}7$ kPa en columna del fluido de $s = 1{,}5$.
        desarrollo: |
          $$
          \frac{p}{\gamma} = \frac{14\,700}{1{,}5\cdot 9800} = 1\ \text{m}
          $$

          Y como es depresión, el plano piezométrico queda 1 m **por debajo**
          de la lámina, es decir 2 m por debajo de A. B está a 3 m de A, así
          que el plano cae a medio camino entre la lámina y B: en el metro de
          fluido que hay encima de él la presión todavía es negativa.

      - tipo: dibujar
        consigna: |
          El apartado a) en papel: los prismas de presiones acotados sobre la
          compuerta ABC. Sobre la proyección vertical de A a C, el de las
          presiones horizontales; y sobre la parte semicircular, el volumen que
          da la componente vertical. Acota cada valor de presión donde cambia
          el prisma.
        comprueba:
          - punto: >-
              En el metro de aire, un rectángulo de $-14{,}7$ kPa, del mismo
              ancho de A a la lámina.
            porque: >-
              El aire no pesa lo bastante para que su presión cambie en un
              metro: vale en toda la cámara lo que marca el vacuómetro. Es el
              trozo que más se dibuja mal, como un triángulo que empieza en cero
              en A, y ese error vale casi 15 kN en la horizontal.
          - punto: >-
              Desde la lámina, la presión crece linealmente: $-14{,}7$ kPa en la
              lámina, cero 1 m más abajo, $+14{,}7$ kPa en B y $+51{,}45$ kPa en
              C.
            porque: >-
              Son $\gamma = 14\,700$ N/m³ por metro. Acotar el cero en su sitio,
              a 2 m de A y no en B, es lo que separa el triángulo negativo del
              positivo, y cada uno tiene su propio centroide para el momento
              del apartado c).
          - punto: >-
              La horizontal resultante de los tres trozos, $135{,}98$ kN hacia
              fuera, y cada trozo con su brazo desde A: 0,50, 1,33 y 4,33 m.
            porque: >-
              El prisma de la proyección vertical sirve para la parte plana y
              para la curva a la vez, porque la componente horizontal sobre una
              superficie curva es la de su proyección. Sin los brazos acotados
              no hay momento que tomar.
          - punto: >-
              Para la vertical, el semicírculo de radio 1,25 m, con la fuerza
              hacia arriba y su centroide a $4R/(3\pi) = 0{,}53$ m de la vertical
              AC, del lado del fluido.
            porque: >-
              La presión empuja hacia abajo sobre el cuarto de arriba y hacia
              arriba sobre el de abajo; lo que queda es el peso del fluido que
              cabría en el semicilindro, $72{,}16$ kN hacia arriba, y el dato del
              centroide que da la NOTA está para su brazo.
          - punto: >-
              Sobre el arco, si lo dibujas, las presiones perpendiculares a él
              y apuntando a su centro.
            porque: >-
              Una presión es normal a la pared, y en una circunferencia todas
              las normales pasan por el centro. Por eso sobre el arco se dibuja
              el prisma radial o sus dos proyecciones, pero no el triángulo de
              la pared plana.
        figura: |
          <svg viewBox="0 0 480 470" role="img" width="480" height="470" aria-labelledby="ex2324o4-prismas-t ex2324o4-prismas-d">
            <title id="ex2324o4-prismas-t">Los prismas de presiones de la compuerta ABC, acotados, con el plano de presión nula a 2 m de A</title>
            <desc id="ex2324o4-prismas-d">A la izquierda, el depósito con el fluido de densidad relativa 1,5 y un metro de aire arriba, con el vacuómetro en la tapa marcando 14,7 kilopascales de vacío. Su pared derecha es la compuerta: de A, arriba, a B, 3 metros de pared vertical, y de B a C, abajo, un semicírculo de 2,5 metros de diámetro que sobresale hacia el fluido. Una línea de trazos horizontal a 2 metros de A, un metro por debajo de la lámina y uno por encima de B, es el plano donde la presión es nula. El semicírculo está sombreado: es el volumen que da la fuerza vertical, 72,16 kilonewtons hacia arriba, dibujada como una flecha a 0,53 metros de la pared. A la derecha, el prisma de las presiones horizontales sobre la proyección vertical de A a C: un rectángulo de menos 14,7 kilopascales en el metro de aire, un triángulo negativo de menos 14,7 en la lámina a cero en el plano, y un triángulo positivo de cero a más 51,45 kilopascales en C, pasando por más 14,7 en B. Junto a cada trozo, su fuerza y su brazo desde A: menos 29,4 kN a 0,50 m, menos 14,7 kN a 1,33 m y más 180,1 kN a 4,33 m, que suman 135,98 kN hacia fuera. En C, el tope empuja la compuerta hacia el fluido con 128,68 kilonewtons.</desc>
