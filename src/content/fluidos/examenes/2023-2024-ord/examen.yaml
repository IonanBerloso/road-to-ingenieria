asignatura: fluidos
curso: '2023-2024'
convocatoria: ordinaria
fecha: 30 de mayo de 2024
# La primera convocatoria de Fluidos que entra **entera**: los ocho
# ejercicios, y los ocho reconstruidos hasta aterrizar en el resultado
# impreso. Del cuadernillo «Exámenes 2020-2025» del departamento, págs. 49 a
# 52 (55 a 58 del PDF).
#
# Publica el resultado de cada apartado y no la resolución (`pdfEs:
# enunciado-con-resultados`), y no imprime reparto por competencia sino el
# porcentaje de cada ejercicio junto a su número, «1. (7,5%)». Esos
# porcentajes van en `puntosImpresos` y suman 100; los ejercicios van sin
# `puntos`.
#
# Desde el 30 de septiembre de 2026 los ocho enunciados son los del
# cuadernillo, palabra por palabra: antes estaban contados con otras palabras
# y con datos de las figuras metidos en frases impresas. Lo que añadimos va
# en «Notas nuestras», y las dos notas impresas, la del 4 y la de las
# iteraciones del 8, en `notas`.
#
# Es también el examen que **destapó un error nuestro**. Su ejercicio 6 da
# la curva de la instalación ya hecha, y solo cuadra si el mismo hierro
# galvanizado toma C_HW = 130 en la tubería de 150 mm y 120 en la de 125.
# Eso es imposible si el coeficiente fuera del material, que es como lo
# había escrito el tema 19 —y como lo había usado el ejercicio 2 de la
# ordinaria de 2026—. El cuadro n.º 25 asigna el coeficiente por **bandas de
# rugosidad relativa**, no por material. Corregidos los dos sitios.
#
# Lo que este examen aporta al corpus:
#
# - **Capilaridad en una sección que no es un tubo** (ej. 1): el hueco entre
#   un tubo cuadrado y uno circular, donde hay que deducir el perímetro y el
#   área en vez de aplicar la fórmula de Jurin.
# - **Un manómetro que miente** (ej. 3): dos aparatos redundantes y hay que
#   decidir cuál falla comparando con un tercer camino.
# - **Una compuerta con vacuómetro** (ej. 4) donde el aire de dentro está a
#   presión constante y el líquido no: el prisma no es un solo triángulo.
# - **Una fuerza dominada por la presión** (ej. 2): 16,8 kN de los que 16,6
#   los pone p·A, y el chorro solo inclina la resultante 0,65°.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (7,5%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 7.5 }
    - { n: 2, puntos: 12.5 }
    - { n: 3, puntos: 12.5 }
    - { n: 4, puntos: 15 }
    - { n: 5, puntos: 12.5 }
    - { n: 6, puntos: 15 }
    - { n: 7, puntos: 10 }
    - { n: 8, puntos: 15 }

# `fuera` queda vacío: están los ocho.

