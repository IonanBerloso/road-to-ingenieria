            <text class="exflu2223o9-curvas-n" x="235.2" y="232.9" text-anchor="start" fill="var(--d1)">V abierta</text>
            <text class="exflu2223o9-curvas-n" x="106.7" y="20.1" text-anchor="start" fill="var(--d1)">V cerrándose</text>
