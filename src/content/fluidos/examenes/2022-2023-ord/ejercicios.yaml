ejercicios:
  # ── 1 (10 %) · Micromanómetro de dos líquidos inmiscibles. El aparato que
  #    multiplica por diez la lectura de un piezómetro de agua.
  - id: exflu2223-ord-1-el-micromanometro-de-dos-liquidos
    titulo: El micromanómetro que multiplica la lectura por diez
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un micromanómetro de líquidos inmiscibles está formado por dos depósitos
      abiertos a la atmósfera, unidos mediante un tubo en U. Dicho
      micromanómetro contiene dos líquidos manométricos cuyas densidades
      relativas son $s_1 = 1$ y $s_2 = 0{,}9$, respectivamente. Se pide:

      **a)** Representar esquemáticamente la situación inicial del
      micromanómetro, cuando los dos depósitos están abiertos a la atmósfera.

      **b)** Si el menisco de separación se desplaza 5 cm, calcular el
      incremento de presión (mm.c.a) que se habrá producido en uno de los
      depósitos. La sección de los depósitos es muy grande frente a la del
      tubo. Representar esquemáticamente la situación final del
      micromanómetro.

      **c)** Calcular el grado de sensibilidad del micromanómetro.
    pide: El incremento de presión que corresponde a 5 cm de menisco, y la sensibilidad del aparato.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las secciones de los dos depósitos son **muy grandes** frente a la
          del tubo. ¿Para qué sirve esa hipótesis?
        opciones:
          - texto: >-
              Para poder suponer que los niveles de los depósitos no se mueven,
              y que todo el desplazamiento ocurre en el tubo
            correcta: true
            mensaje: |
              Eso es. El volumen que recorre el menisco a lo largo del tubo
              repartido sobre una sección grande es una bajada de nivel
              despreciable, así que las dos superficies libres se quedan
              donde estaban y la única incógnita es el menisco.
          - texto: >-
              Para que la presión sea la misma en los dos depósitos
            mensaje: |
              La presión de los dos depósitos es justamente lo que se quiere
              diferenciar. Lo que la hipótesis congela son los **niveles**,
              no las presiones.
          - texto: >-
              Para que los dos líquidos no se mezclen
            mensaje: |
              Que no se mezclen es que son **inmiscibles**, y eso es un dato
              aparte que da nombre al aparato. La sección grande no tiene
              nada que ver con la miscibilidad.

      - tipo: calcular
        titulo: El incremento de presión
        pregunta: |
          Con el menisco desplazado $5\ \text{cm}$, ¿cuántos milímetros de
          columna de agua ha subido la presión de ese depósito?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.05
          formato: un número en mm de columna de agua
        distractores:
          - valor: '50'
            mensaje: |
              Has dado el desplazamiento del menisco, no la presión. Los
              50 mm de recorrido equivalen a **5** mm de columna de agua, y
              esa reducción de diez a uno es precisamente lo que hace útil
              al aparato.
          - valor: '45'
            mensaje: |
              Parece que has multiplicado por $s_2 = 0{,}9$ en vez de por la
              **diferencia** $s_1 - s_2 = 0{,}1$. El líquido ligero no empuja
              solo: compite con el pesado, y lo que queda es la resta.
          - valor: '95'
            mensaje: |
              Has sumado las dos densidades relativas en vez de restarlas. Al
              subir el menisco, una columna de $s_1$ sustituye a una columna
              de $s_2$, así que lo que se gana es la **diferencia** de pesos
              específicos.
        pista: |
          Al desplazarse el menisco, una columna de líquido pesado sustituye
          a una de líquido ligero en la misma altura. Lo que cambia es
          $\gamma_1 - \gamma_2$.
        desarrollo: |
          $$
          \Delta p = d\,(\gamma_1-\gamma_2)
          = 0{,}05\,(9800-8820) = 49\ \text{Pa}
          $$
          $$
          \frac{\Delta p}{\gamma_{ag}} = \frac{49}{9800}
          = 0{,}005\ \text{m} = 5\ \text{mm.c.a}
          $$

      - tipo: calcular
        titulo: La sensibilidad
        pregunta: |
          ¿A cuántos pascales corresponde **un milímetro** de desplazamiento
          del menisco?
        respuesta:
          tipo: numero
          valor: '0.98'
          tolerancia: 0.01
          formato: un número en pascales
        distractores:
          - valor: '9.8'
            mensaje: |
              Ese sería el resultado con **un solo** líquido, $\gamma_1$ a
              secas. La gracia del aparato es que el que manda es
              $\gamma_1-\gamma_2$, diez veces menor.
          - valor: '8.82'
            mensaje: |
              Has usado $\gamma_2$ en vez de la diferencia. Con
              $s_2 = 0{,}9$ sale $8{,}82$ Pa por milímetro, casi lo mismo que
              un manómetro corriente: el aparato no serviría de nada.
        pista: |
          Es la misma cuenta de antes con $d = 1\ \text{mm}$.
        desarrollo: |
          $$
          \Delta p = 0{,}001\,(9800-8820) = 0{,}98\ \text{Pa}
          $$

          Y visto al revés, que es como se suele decir: un piezómetro de agua
          movería $5\ \text{mm}$ donde este mueve $50$, así que **amplifica
          por diez**, que es $\gamma_1/(\gamma_1-\gamma_2) = 1/0{,}1$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los depósitos muy anchos, sus niveles no se mueven y todo el
              desplazamiento se lo lleva el menisco del tubo.
          - texto: >-
              Al avanzar el menisco una distancia $d$, una columna de $s_1$
              ocupa el sitio donde había $s_2$, y el desequilibrio vale
              $d(\gamma_1-\gamma_2)$.
          - texto: >-
              Con $s_1-s_2 = 0{,}1$ el aparato amplifica por diez, y un
              milímetro de menisco son 0,98 Pa.
          - texto: >-
              Cuanto más parecidas sean las dos densidades, mejor es el
              aparato, sin ningún límite.
            trampa: true
            mensaje: |
              La amplificación crece, sí, pero no sin límite útil. Al
              acercarse $s_2$ a $s_1$ el menisco se vuelve larguísimo para
              presiones minúsculas, la columna se sale del tubo y cualquier
              cambio de temperatura —que altera las dos densidades de forma
              distinta— se convierte en un error enorme. La sensibilidad se
              paga en **rango** y en **estabilidad**.
    resolucion: |
      **La idea.** Un micromanómetro de líquidos inmiscibles es un manómetro
      diferencial al que se le ha quitado casi todo el peso específico. En un
      piezómetro corriente la presión se equilibra con $\gamma$ del líquido;
      aquí se equilibra con la **diferencia** entre dos líquidos que casi
      pesan lo mismo, y por eso la misma presión mueve una columna diez veces
      más larga.

      **a) La situación inicial.** Los dos depósitos abiertos, las dos
      superficies libres a la misma altura y el menisco de separación en el
      fondo del tubo en U, en reposo. No hay desequilibrio.

      **b) El incremento de presión.** Al subir la presión en uno de los
      depósitos, el menisco se desplaza una distancia $d = 5\ \text{cm}$ hacia
      el otro lado. Como los depósitos son anchos, sus niveles no cambian:
      lo único que ocurre es que en un tramo de altura $d$ el líquido pesado
      sustituye al ligero.

      $$
      \Delta p = d\,(\gamma_1-\gamma_2)
      = 0{,}05\,(9800-8820) = 49\ \text{Pa}
      = 5\ \text{mm.c.a}
      $$

      **c) La sensibilidad.** Un milímetro de menisco son $0{,}98\ \text{Pa}$.
      Dicho de otra forma, el aparato **amplifica por diez** la lectura de un
      piezómetro de agua, porque

      $$
      \frac{\gamma_1}{\gamma_1-\gamma_2} = \frac{1}{1-0{,}9} = 10
      $$

      Ese cociente es la fórmula de diseño del aparato: se elige la pareja de
      líquidos por lo parecidas que son sus densidades, no por sus valores.

  # ── 2 (10 %) · Cantidad de movimiento en un codo-boquilla de 180°. La
  #    presión pone el 82 % de la fuerza y el chorro el resto.
  - id: exflu2223-ord-2-el-codo-boquilla-que-da-la-vuelta
    titulo: El codo que da la vuelta entera, y la boquilla que acelera nueve veces
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En el conjunto codo-boquilla de la figura (situado en el **plano
      horizontal**), un manómetro Bourdon colocado a la entrada del codo marca
      $100\ \text{kPa}$. El fluido circulante es un combustible de densidad
      relativa $s = 0{,}85$.

      Los diámetros de la tubería y de la boquilla son 300 y 100 mm,
      respectivamente. Considerar que el factor de paso en la tubería es
      $k = 5$ y en la boquilla $k_{boq} = 0{,}1$ (respecto de la energía
      cinética a la salida).

      Se pide calcular:

      **a)** Caudal circulante $Q$ (l/s).

      **b)** Fuerza que el fluido ejerce sobre el conjunto (módulo, dirección
      y sentido).

      En la figura el fluido entra por el tramo inferior en un sentido, el
      codo lo hace girar 180º y la boquilla lo devuelve en sentido contrario.
    pide: El caudal, y la fuerza que el fluido hace sobre el conjunto.

    pasos:
      - tipo: reconocer
        pregunta: |
          El conjunto está en el **plano horizontal**. ¿Qué se simplifica con
          eso?
        opciones:
          - texto: >-
              Que las cotas son iguales en todos los puntos, así que el peso
              no interviene ni en la energía ni en la cantidad de movimiento
            correcta: true
            mensaje: |
              Eso es. En Bernoulli desaparece $z_1-z_2$ y en la ecuación de
              cantidad de movimiento desaparece el peso del fluido, que
              sería una componente vertical más.
          - texto: >-
              Que no hay pérdidas de carga
            mensaje: |
              Las pérdidas siguen ahí, y muy grandes: $k = 5$ en la tubería y
              $k_{boq} = 0{,}1$ en la boquilla. Lo que desaparece es el
              término de cota, no el de pérdidas.
          - texto: >-
              Que la velocidad es la misma a la entrada y a la salida
            mensaje: |
              La velocidad cambia porque cambia la sección: de 300 a 100 mm
              hay un factor 9 en el área, y por tanto en la velocidad. Eso no
              depende de la orientación del plano.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula, en litros por segundo?
        respuesta:
          tipo: magnitud
          valor: '112.37 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '103.6 l/s'
            mensaje: |
              Has usado el peso específico del agua. El fluido es un
              combustible con $s = 0{,}85$, así que
              $\gamma = 8330\ \text{N/m}^{3}$ y los 100 kPa valen más metros
              de columna, no menos.
          - valor: '48.84 l/s'
            mensaje: |
              Parece que has referido también el $k = 5$ de la tubería a la
              velocidad de **salida**. El enunciado solo dice eso de la
              boquilla; el de la tubería va con la velocidad de la tubería.
        pista: |
          Bernoulli entre el manómetro y la salida, con todo puesto en
          función de $v_1$ y sabiendo que $v_2 = 9v_1$.
        desarrollo: |
          $$
          \frac{p_1}{\gamma} = \frac{v_2^{2}}{2g}
          + k\,\frac{v_1^{2}}{2g} + k_{boq}\frac{v_2^{2}}{2g}
          - \frac{v_1^{2}}{2g}
          $$
          $$
          \frac{100000}{8330} = 12{,}005
          = \frac{v_1^{2}}{2g}\bigl[81\cdot 1{,}1 + 5 - 1\bigr]
          = 93{,}1\,\frac{v_1^{2}}{2g}
          $$
          $$
          v_1 = 1{,}590\ \text{m/s}
          \qquad
          Q = 1{,}590\cdot 0{,}070686 = 0{,}11237\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La fuerza sobre el conjunto
        pregunta: |
          ¿Qué fuerza ejerce el fluido sobre el conjunto, en kN?
        respuesta:
          tipo: magnitud
          valor: '8.59 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1.52 kN'
            mensaje: |
              Te has quedado solo con el término de cantidad de movimiento y
              has olvidado la presión. Los $100\ \text{kPa}$ sobre
              $0{,}0707\ \text{m}^{2}$ son $7{,}07$ kN, que es la parte
              grande de la respuesta.
          - valor: '5.85 kN'
            mensaje: |
              Parece que has puesto la velocidad de salida con el mismo signo
              que la de entrada. El codo da la vuelta **entera**: el chorro
              sale en sentido contrario, así que las dos cantidades de
              movimiento se suman en vez de restarse.
          - valor: '7.07 kN'
            mensaje: |
              Esa es solo la fuerza de presión sobre la brida de entrada. Hay
              que añadirle el cambio de cantidad de movimiento, que en un
              giro de 180º vale $\dot m\,(v_1+v_2)$ y aporta kilo y medio más.
        pista: |
          Un volumen de control que corte por la brida de entrada y por la
          salida de la boquilla. A la salida la presión es la atmosférica.
        desarrollo: |
          $$
          \dot m = \rho Q = 850\cdot 0{,}11237 = 95{,}52\ \text{kg/s}
          \qquad
          v_2 = 9v_1 = 14{,}31\ \text{m/s}
          $$
          $$
          R_x + p_1A_1 = \dot m\,(-v_2 - v_1)
          = 95{,}52\,(-15{,}90) = -1518\ \text{N}
          $$
          $$
          R_x = -1518 - 7069 = -8587\ \text{N}
          $$

          El signo dice que el conjunto empuja al fluido hacia atrás; por
          acción y reacción el fluido empuja al conjunto **hacia adelante**,
          en el sentido de entrada, con $8{,}59$ kN.

      - tipo: justificar
        pregunta: Ordena el análisis de la fuerza. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión de entrada aporta $p_1A_1 = 7{,}07$ kN, que es el 82 %
              del total.
          - texto: >-
              El giro de 180º hace que las cantidades de movimiento de entrada
              y salida se sumen, y aportan $1{,}52$ kN más.
          - texto: >-
              A la salida de la boquilla la presión es la atmosférica, así que
              ahí no hay término de presión.
          - texto: >-
              Como la boquilla acelera el fluido nueve veces, el término de
              cantidad de movimiento domina sobre el de presión.
            trampa: true
            mensaje: |
              Es al revés, y por eso este ejercicio está en el temario. La
              velocidad de salida es grande —14,3 m/s— pero el caudal másico
              es modesto, así que $\dot m\,\Delta v$ se queda en 1,5 kN
              frente a los 7,1 kN de la presión. **En una instalación con
              presión apreciable, la fuerza sobre un codo es casi toda de
              presión**, y el chorro solo la retoca.
    resolucion: |
      **a) El caudal.** Bernoulli entre el punto donde está el manómetro y la
      salida de la boquilla, en el plano horizontal, con las pérdidas
      declaradas. Con $D_1/D_2 = 3$, la continuidad da $v_2 = 9v_1$.

      $$
      \frac{p_1}{\gamma} + \frac{v_1^{2}}{2g}
      = \frac{v_2^{2}}{2g} + k\,\frac{v_1^{2}}{2g}
      + k_{boq}\frac{v_2^{2}}{2g}
      $$

      Con $\gamma = 0{,}85\cdot 9800 = 8330\ \text{N/m}^{3}$ y
      $p_1/\gamma = 12{,}005\ \text{m}$, todo queda en función de $v_1$:

      $$
      12{,}005 = \frac{v_1^{2}}{2g}\,(81 + 8{,}1 + 5 - 1)
      = 93{,}1\,\frac{v_1^{2}}{2g}
      $$

      $$
      v_1 = 1{,}590\ \text{m/s}
      \qquad
      Q = 112{,}37\ \text{l/s}
      $$

      **b) La fuerza.** Volumen de control cortando por la brida de entrada y
      por la salida del chorro. Eje $x$ en el sentido de entrada; el chorro
      sale en $-x$.

      $$
      \dot m = 95{,}52\ \text{kg/s}
      \qquad
      v_1 = 1{,}59\ \text{m/s}
      \qquad
      v_2 = 14{,}31\ \text{m/s}
      $$
      $$
      R_x + p_1A_1 = \dot m\,(-v_2-v_1)
      \;\Longrightarrow\;
      R_x = -1518 - 7069 = -8587\ \text{N}
      $$

      El fluido ejerce sobre el conjunto $8{,}59\ \text{kN}$ en el sentido de
      la corriente de entrada, es decir hacia la derecha en la figura.

      **Y lo que hay que llevarse.** De esos 8,59 kN, **7,07 los pone la
      presión** y solo 1,52 el chorro. Es la razón por la que las bridas de
      un codo se calculan con la presión de servicio y no con el caudal: un
      codo con el mismo caudal a presión doble sufre casi el doble.

  # ── 3 (15 %) · Fuerzas sobre una superficie curva con un fluido a cada
  #    lado, y el de la derecha en depresión. Los dos empujan igual.
  - id: exflu2223-ord-3-el-tramo-circular-entre-dos-fluidos
    titulo: El cuarto de círculo con un fluido a cada lado
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un depósito cerrado, de profundidad $b$, dividido en dos, contiene dos
      fluidos ($s_1 = 1{,}2$ y $s_2 = 0{,}8$). La pared que separa los dos
      compartimentos del depósito dispone de un tramo circular BC. El
      compartimento de la izquierda dispone de un manómetro Bourdon y el de la
      derecha un manómetro abierto al exterior.

      **a)** Dibujar los prismas de presiones acotados sobre la pared ABC que
      separa ambos fluidos.

      **b)** Calcular las fuerzas (sentido y módulo) ejercidas por los fluidos
      sobre el **tramo BC**.

      Datos: $d_1 = 2{,}00$ m, $d_2 = 3{,}00$ m, $h_1 = 1200$ mm,
      $h_2 = 900$ mm, $P_1 = 2{,}30$ mca, $R_1 = 400$ mm, $b = 1$ m.

      En la figura, el tramo BC es un cuarto de circunferencia de radio $R_1$
      con centro en la esquina inferior de la pared; B está sobre la vertical,
      a $R_1$ del suelo, y C sobre el suelo, a $R_1$ de la vertical. El
      manómetro abierto sitúa el plano de cargas del fluido 2 a la cota de C.
    pide: Las componentes horizontal y vertical que cada fluido ejerce sobre BC.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro de la derecha coloca el plano de cargas del fluido 2 a
          la cota de C, es decir **por debajo** de todo el tramo BC. ¿Qué
          significa eso?
        opciones:
          - texto: >-
              Que la presión del fluido 2 sobre BC es negativa, y sus fuerzas
              apuntan hacia fuera del fluido en vez de hacia la pared
            correcta: true
            mensaje: |
              Eso es, y es lo que hace especial a este ejercicio. El gas
              encerrado sobre $s_2$ está en depresión, la presión relativa en
              todo BC es negativa, y el fluido de la derecha **tira** del
              tramo en lugar de empujarlo. Resultado: sus fuerzas van en el
              mismo sentido que las del fluido de la izquierda.
          - texto: >-
              Que el fluido 2 no ejerce ninguna fuerza sobre BC
            mensaje: |
              Ejerce, y no es despreciable. Que la presión sea negativa no la
              anula: le cambia el signo. Son 627 N y 985 N.
          - texto: >-
              Que el compartimento de la derecha está vacío
            mensaje: |
              Está lleno hasta $h_2 = 900$ mm de fluido $s_2$. Lo que está en
              depresión es el **gas** que hay encima, y por eso el plano de
              cargas cae por debajo de la superficie libre.

      - tipo: calcular
        titulo: La fuerza horizontal del fluido de la izquierda
        pregunta: |
          ¿Cuánto vale la componente horizontal que $s_1$ ejerce sobre BC, en
          kN?
        respuesta:
          tipo: magnitud
          valor: '13.72 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4.70 kN'
            mensaje: |
              Te has dejado el manómetro Bourdon. Los $2{,}30$ mca de gas
              sobre la superficie equivalen a $1{,}92$ m más de fluido 1, y
              eso casi triplica la presión sobre el tramo.
          - valor: '11.43 kN'
            mensaje: |
              Has convertido mal los $2{,}30$ mca. Son metros de columna de
              **agua**, así que la presión es $2{,}30\cdot 9800 = 22540$ Pa;
              para pasarlos a metros de fluido 1 hay que dividir entre
              $\gamma_1 = 11760$, no tomarlos como 2,30 m de $s_1$.
        pista: |
          Es la presión en el centro de gravedad de la **proyección vertical**
          del tramo, que es un rectángulo de $R_1$ por $b$.
        desarrollo: |
          El plano de cargas de $s_1$ está $p_1/\gamma_1$ por encima de su
          superficie libre:

          $$
          \frac{2{,}30\cdot 9800}{11760} = 1{,}9167\ \text{m}
          \qquad
          z_{PC} = 1{,}2 + 1{,}9167 = 3{,}1167\ \text{m}
          $$
          $$
          F_H = \gamma_1\,(3{,}1167-0{,}2)\cdot R_1 b
          = 11760\cdot 2{,}9167\cdot 0{,}4 = 13720\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza vertical del fluido de la izquierda
        pregunta: |
          ¿Cuánto vale la componente vertical que $s_1$ ejerce sobre BC, en
          kN?
        respuesta:
          tipo: magnitud
          valor: '13.18 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '14.66 kN'
            mensaje: |
              Has tomado el prisma como un rectángulo entero, sin descontar
              el cuarto de círculo. El volumen que pesa sobre el tramo es
              $R_1 z_{PC} - \pi R_1^{2}/4$ por unidad de anchura.
          - valor: '1.48 kN'
            mensaje: |
              Ese es el peso del cuarto de círculo de fluido, que es
              justamente lo que hay que **restar** del prisma completo, no el
              resultado.
        pista: |
          El fluido 1 está **por debajo** del tramo, así que la vertical es
          el peso del volumen imaginario que va del arco hasta el plano de
          cargas, y apunta hacia arriba.
        desarrollo: |
          $$
          V = \Bigl(R_1 z_{PC} - \frac{\pi R_1^{2}}{4}\Bigr) b
          = 0{,}4\cdot 3{,}1167 - 0{,}12566 = 1{,}1210\ \text{m}^{3}
          $$
          $$
          F_V = \gamma_1 V = 11760\cdot 1{,}1210 = 13183\ \text{N}\ (\uparrow)
          $$

      - tipo: calcular
        titulo: Las dos fuerzas del fluido de la derecha
        pregunta: |
          ¿Cuánto vale la componente **vertical** que $s_2$ ejerce sobre BC,
          en newton?
        respuesta:
          tipo: magnitud
          valor: '985.2 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '269.2 N'
            mensaje: |
              Has puesto el plano de cargas de $s_2$ a la cota de B en vez de
              a la de C. El manómetro abierto lo sitúa 900 mm por debajo de
              la superficie libre, es decir justo en C.
          - valor: '627.2 N'
            mensaje: |
              Esa es la componente **horizontal**. La vertical vale
              $\gamma_2 R_1 b\,(\pi R_1/4)$, que sale 985 N.
        pista: |
          Con el plano de cargas en la cota de C, el volumen de presiones es
          exactamente el cuarto de círculo, y la fuerza apunta hacia arriba
          porque la presión es negativa.
        desarrollo: |
          $$
          F_H = \gamma_2\,|0-0{,}2|\cdot R_1 b
          = 7840\cdot 0{,}2\cdot 0{,}4 = 627{,}2\ \text{N}\ (\rightarrow)
          $$
          $$
          F_V = \gamma_2 R_1 b\,\frac{\pi R_1}{4}
          = 7840\cdot 0{,}4\cdot 0{,}31416 = 985{,}2\ \text{N}\ (\uparrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El fluido de la izquierda tiene el plano de cargas a 3,12 m y
              empuja el tramo hacia la derecha y hacia arriba.
          - texto: >-
              El de la derecha lo tiene a la cota de C, así que su presión
              sobre BC es negativa y **tira** del tramo hacia la derecha y
              hacia arriba también.
          - texto: >-
              Sumando, el tramo recibe 14,35 kN hacia la derecha y 14,17 kN
              hacia arriba.
          - texto: >-
              Los datos $d_1 = 2{,}00$ m y $d_2 = 3{,}00$ m son los que fijan
              la altura del plano de cargas del fluido 1.
            trampa: true
            mensaje: |
              No intervienen en ningún sitio. La altura del plano de cargas
              del fluido 1 la fijan $h_1$ y la lectura del Bourdon; $d_1$ y
              $d_2$ son las dimensiones del depósito y aquí solo sirven para
              dibujar. **Un examen que da datos de sobra está comprobando que
              sabes cuáles pintan**, y este da dos.
    resolucion: |
      **Lo primero es situar los dos planos de cargas**, porque el resto es
      geometría.

      **El de la izquierda.** El Bourdon marca $P_1 = 2{,}30$ mca sobre la
      superficie libre de $s_1$, que está a $h_1 = 1{,}2$ m del suelo. En
      metros de fluido 1:

      $$
      \frac{2{,}30\cdot 9800}{1{,}2\cdot 9800} = 1{,}9167\ \text{m}
      \qquad
      z_{PC,1} = 1{,}2 + 1{,}9167 = 3{,}1167\ \text{m}
      $$

      **El de la derecha.** El manómetro abierto lo sitúa a la cota de C, es
      decir 900 mm por debajo de la superficie de $s_2$: el gas encerrado
      está en depresión. Sobre todo el tramo BC la presión relativa del
      fluido 2 es **negativa**.

      **b) Las cuatro fuerzas.** Con $R_1 = 0{,}4$ m, $b = 1$ m,
      $\gamma_1 = 11760$ y $\gamma_2 = 7840\ \text{N/m}^{3}$:

      | | horizontal | vertical |
      |---|---|---|
      | fluido 1 | $13{,}72$ kN $(\rightarrow)$ | $13{,}18$ kN $(\uparrow)$ |
      | fluido 2 | $627{,}2$ N $(\rightarrow)$ | $985{,}2$ N $(\uparrow)$ |
      | **total** | $14{,}35$ kN | $14{,}17$ kN |

      La horizontal de cada fluido es la presión en el centro de gravedad de
      la proyección vertical del tramo, un rectángulo de $0{,}4\times 1$ m. La
      vertical es el peso del volumen de presiones: para el fluido 1, el
      prisma que va del arco hasta su plano de cargas, menos el cuarto de
      círculo; para el fluido 2, con el plano de cargas justo en C, el volumen
      se reduce **exactamente** al cuarto de círculo.

      **Y aquí está lo que enseña el ejercicio.** Uno espera que dos fluidos a
      ambos lados de una pared se contrarresten. Aquí no: los dos empujan en
      el mismo sentido. El de la izquierda porque presiona; el de la derecha
      porque, al estar su plano de cargas por debajo de la pared, **succiona**.
      Un depósito en depresión no descarga la pared que lo separa del vecino:
      la carga más.

      **Sobre la lectura de la figura.** Que el plano de cargas del fluido 2
      esté a la cota de C es lo que fija el manómetro abierto del dibujo, y lo
      confirman los dos resultados publicados, que salen exactos con esa
      hipótesis y con ninguna otra: $627{,}2$ N y $985{,}2$ N.

  # ── 4 (10 %) · Compresibilidad a 3.050 bar. La fórmula lineal ya no vale,
  #    y el agujero que se llena es más pequeño que el aceite que se compra.
  - id: exflu2223-ord-4-el-aceite-que-sostiene-la-chatarra
    titulo: El aceite que sostiene quinientas cincuenta toneladas
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Hay un cubo para acumular chatarra sostenido por un cilindro que se
      rellena con un aceite de mala calidad. El diámetro del cilindro es de
      15 cm y su longitud es de 490 mm. La masa del cubo es de 550 kg y la
      masa de la chatarra que se puede introducir en su interior es de 550
      toneladas. El peso del cilindro es irrelevante.

      Cuando el cubo está vacío, el cilindro se llena completamente de aceite.
      A continuación, se introduce la chatarra dentro del cubo:

      **a)** Calcular cuántos litros se reducirá el volumen de aceite del
      cilindro desde que el cubo está vacío hasta que se llena de chatarra.

      Se va a realizar la compra de una nueva botella de aceite de las mismas
      propiedades,

      **b)** ¿Cuál deberá ser el volumen de la nueva botella de aceite para
      llenar completamente el cilindro estando el cubo lleno de chatarra?

      Datos: $s_{aceite} = 0{,}87$; viscosidad del aceite
      $\nu_{aceite} = 68\ \text{cSt}$; coeficiente de compresibilidad cúbico
      del aceite $\alpha_{aceite} = 1{,}667\cdot 10^{-10}\ \text{Pa}^{-1}$.
    pide: Cuánto se encoge el aceite, y cuánto aceite hay que comprar para reponerlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la viscosidad del aceite, $68\ \text{cSt}$. ¿Para
          qué hace falta aquí?
        opciones:
          - texto: >-
              Para nada: no hay movimiento, así que la viscosidad no
              interviene en ningún sitio
            correcta: true
            mensaje: |
              Exacto. Es un dato de sobra, y reconocerlo es parte del
              ejercicio. La viscosidad solo aparece cuando hay velocidades
              distintas en capas contiguas; aquí el aceite está quieto y lo
              único que se le pide es sostener una carga.
          - texto: >-
              Para calcular la densidad, que depende de la viscosidad
            mensaje: |
              No dependen una de otra. La densidad la da $s = 0{,}87$, y de
              hecho tampoco hace falta: el ejercicio se resuelve con la
              presión, el volumen y $\alpha$.
          - texto: >-
              Para saber cuánto tarda el aceite en comprimirse
            mensaje: |
              La compresión de un líquido no es un proceso viscoso con un
              tiempo de relajación: es instantánea a efectos del problema.
              Lo que sí depende de la viscosidad es la velocidad con que el
              aceite **entraría** por un conducto, y eso no se pregunta.

      - tipo: calcular
        titulo: El incremento de presión
        pregunta: |
          ¿Cuánto sube la presión del aceite al cargar las 550 toneladas de
          chatarra, en bar?
        respuesta:
          tipo: numero
          valor: '3050'
          tolerancia: 5
          formato: un número en bar
        distractores:
          - valor: '3.05'
            mensaje: |
              Has tomado las 550 **toneladas** como 550 kilos. Con esa carga
              la presión sería de tres bares y el aceite no se enteraría; lo
              que hace interesante al ejercicio es precisamente que son mil
              veces más.
          - valor: '311'
            mensaje: |
              Parece que has dividido entre un área diez veces mayor. El
              diámetro es 15 cm, así que
              $A = \pi\cdot 0{,}15^{2}/4 = 0{,}01767\ \text{m}^{2}$.
        pista: |
          Es el peso de la chatarra repartido sobre la sección del cilindro.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
          $$
          $$
          \Delta p = \frac{550000\cdot 9{,}8}{0{,}017671}
          = 3{,}050\cdot 10^{8}\ \text{Pa} = 3050\ \text{bar}
          $$

      - tipo: calcular
        titulo: Los litros que faltan
        pregunta: |
          ¿Cuánto se reduce el volumen del aceite, en litros?
        respuesta:
          tipo: numero
          valor: '0.429'
          tolerancia: 0.003
          formato: un número en litros
        distractores:
          - valor: '0.440'
            mensaje: |
              Has usado la fórmula lineal $\Delta V = \alpha V\Delta p$. A
              3.050 bar el producto $\alpha\Delta p$ vale $0{,}0508$, que ya
              no es despreciable frente a 1, y la exponencial se separa de la
              recta un 2,5 %. Con
              $\Delta V = V_0\,(1-e^{-\alpha\Delta p})$ salen 0,429.
          - valor: '0.000429'
            mensaje: |
              Ese es el resultado en metros cúbicos. Un metro cúbico son mil
              litros.
        pista: |
          El volumen del cilindro son $8{,}659$ litros, y la ley de
          compresibilidad integrada es
          $V = V_0\,e^{-\alpha\Delta p}$.
        desarrollo: |
          $$
          V_0 = 0{,}017671\cdot 0{,}49 = 8{,}659\ \text{l}
          \qquad
          \alpha\,\Delta p = 1{,}667\cdot 10^{-10}\cdot 3{,}0501\cdot 10^{8}
          = 0{,}050845
          $$
          $$
          \Delta V = V_0\bigl(1-e^{-0{,}050845}\bigr)
          = 8{,}659\cdot 0{,}049574 = 0{,}429\ \text{l}
          $$

      - tipo: calcular
        titulo: La botella que hay que comprar
        pregunta: |
          ¿Qué volumen debe tener la botella nueva, en litros?
        respuesta:
          tipo: numero
          valor: '0.452'
          tolerancia: 0.003
          formato: un número en litros
        distractores:
          - valor: '0.429'
            mensaje: |
              Ese es el hueco **dentro** del cilindro, con el aceite ya
              comprimido. El aceite de la botella está a presión
              atmosférica, así que ocupa más: al meterlo se encogerá lo
              mismo que se encogió el que ya estaba.
          - valor: '0.408'
            mensaje: |
              Has multiplicado por $e^{-\alpha\Delta p}$ en vez de dividir.
              El aceite de la botella se **comprime** al entrar, así que hay
              que comprar más de 0,429 l, no menos.
        pista: |
          El mismo factor de antes, pero al revés: la botella está a presión
          atmosférica.
        desarrollo: |
          $$
          V_{bot} = \Delta V\,e^{\alpha\Delta p}
          = 0{,}429\cdot 1{,}0522 = 0{,}452\ \text{l}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Las 550 toneladas sobre $0{,}0177\ \text{m}^{2}$ dan 3.050 bar,
              una presión enorme para una máquina pequeña.
          - texto: >-
              A esa presión $\alpha\Delta p = 0{,}051$, y la fórmula lineal ya
              se equivoca en un 2,5 %.
          - texto: >-
              El hueco que queda dentro mide 0,429 l, pero hay que comprar
              0,452 porque el aceite de la botella está sin comprimir.
          - texto: >-
              Como el aceite se comprime, el cilindro baja $0{,}429/A = 2{,}4$
              cm, que es la carrera perdida del émbolo.
            trampa: true
            mensaje: |
              La cuenta está bien hecha —$0{,}429$ l entre
              $0{,}0177\ \text{m}^{2}$ son 2,4 cm— pero la conclusión no se
              sigue del enunciado, que dice que el cilindro **se rellena** de
              aceite y no habla de émbolo ni de carrera. Y el orden de
              magnitud sí es la lección real: dos centímetros y medio de
              hundimiento por la sola compresibilidad del aceite explican por
              qué en hidráulica de precisión se purga hasta la última burbuja
              y se elige el fluido por su módulo, no por su precio.
    resolucion: |
      **a) Los litros que se pierden.** El aceite soporta el peso de la
      chatarra repartido sobre la sección del cilindro:

      $$
      A = \frac{\pi\,0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
      \qquad
      \Delta p = \frac{550000\cdot 9{,}8}{0{,}017671} = 3050\ \text{bar}
      $$

      Con el volumen del cilindro $V_0 = A\cdot 0{,}49 = 8{,}659$ l, y la ley
      de compresibilidad integrada —no la lineal, que a esta presión ya se
      queda corta—:

      $$
      \Delta V = V_0\bigl(1-e^{-\alpha\Delta p}\bigr)
      = 8{,}659\bigl(1-e^{-0{,}050845}\bigr) = 0{,}429\ \text{l}
      $$

      **b) La botella.** Esos 0,429 litros son el hueco medido **dentro** del
      cilindro, es decir con el aceite ya comprimido a 3.050 bar. El aceite
      que se compra está a presión atmosférica y se encogerá al entrar, así
      que hace falta más:

      $$
      V_{bot} = \Delta V\,e^{\alpha\Delta p} = 0{,}452\ \text{l}
      $$

      **Dos cosas que llevarse.** La primera, que la fórmula lineal
      $\Delta V = \alpha V\Delta p$ da 0,440 l y la exacta 0,429: a tres mil
      bares la aproximación de siempre se sale un 2,5 %, y este ejercicio
      está puesto justo por encima de esa frontera. La segunda, que el
      agujero y el aceite que lo llena **no miden lo mismo**, y la diferencia
      —23 mililitros— es exactamente el aceite que se comprimirá al entrar.

      Y un dato del enunciado que no se usa: la viscosidad de 68 cSt. No hay
      movimiento, así que no pinta nada.

  # ── 5 (10 %) · Un venturímetro que primero dice hacia dónde va el fluido.
  #    Y la trampa del fluido manométrico, que aquí es el ligero.
  - id: exflu2223-ord-5-el-venturimetro-que-dice-hacia-donde-va
    titulo: El venturímetro que primero dice hacia dónde va el fluido
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para el venturímetro de la imagen:

      **a)** Indicar claramente cuál es la dirección del flujo y **deducir la
      expresión del caudal**.

      En el sistema representado en la imagen intervienen agua y glicol
      ($s = 1{,}1$). Los coeficientes del rotámetro y del venturímetro son
      $0{,}86$ y $0{,}97$, respectivamente. Sabiendo que el caudal real
      circulante por la instalación es de $100\ \text{l/s}$,

      **b)** Obtener la lectura del manómetro.

      **c)** Obtener la lectura del rotámetro.

      Datos: $D_1 = 300$ mm; $D_2 = 250$ mm.

      En la figura, la tubería es inclinada y lleva dos manómetros en U
      invertida, con agua como líquido manométrico sobre el glicol que
      circula. El de la izquierda marca $R$ y el de la derecha $T$.
    pide: El sentido del flujo, la lectura T del manómetro y la del rotámetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la figura $T > R$. ¿Qué permite deducir eso sobre el sentido del
          flujo?
        opciones:
          - texto: >-
              Que el fluido va del lado con mayor altura piezométrica al de
              menor, es decir del manómetro T hacia el R
            correcta: true
            mensaje: |
              Eso es. Entre dos puntos de una misma conducción la línea
              piezométrica **solo puede bajar** en el sentido del flujo,
              porque la diferencia son las pérdidas. Así que el flujo va del
              punto con más altura piezométrica al que tiene menos, sin
              necesidad de ningún otro dato.
          - texto: >-
              Que el fluido va del manómetro R hacia el T, porque el flujo va
              hacia donde la presión crece
            mensaje: |
              Al revés. Si la presión creciera en el sentido del flujo, el
              fluido estaría ganando energía por el camino, y por una tubería
              con rozamiento eso es imposible sin una bomba entre medias.
          - texto: >-
              Nada: hace falta saber la cota de cada punto
            mensaje: |
              La cota ya está dentro de la lectura. Un manómetro diferencial
              en U mide directamente la diferencia de alturas
              **piezométricas** $z + p/\gamma$, no de presiones, y por eso el
              criterio vale también en una tubería inclinada como esta.

      - tipo: calcular
        titulo: La lectura del manómetro
        pregunta: |
          ¿Cuánto vale la lectura $T$, en metros?
        respuesta:
          tipo: numero
          valor: '1.28'
          tolerancia: 0.02
          formato: un número en metros
        distractores:
          - valor: '1.165'
            mensaje: |
              Has tomado el glicol como líquido manométrico y el agua como
              fluido circulante, con el factor $(1{,}1-1)/1 = 0{,}1$. Es al
              revés: por la tubería va el glicol y el líquido manométrico es
              el agua, que al ser **más ligera** se coloca arriba en la U
              invertida. El factor es $(1{,}1-1)/1{,}1 = 0{,}0909$.
          - valor: '1.206'
            mensaje: |
              Te has dejado el coeficiente del venturímetro. Los 100 l/s son
              el caudal **real**; el que entra en la fórmula del venturi es
              el teórico, $100/0{,}97 = 103{,}09$ l/s.
        pista: |
          Primero el caudal teórico del venturi, después $\Delta h$ en metros
          de glicol, y al final la lectura con
          $\Delta h = T\,(1-\gamma_{ag}/\gamma_{gl})$.
        desarrollo: |
          $$
          Q_{teo} = \frac{0{,}100}{0{,}97} = 0{,}10309\ \text{m}^{3}/\text{s}
          \qquad
          v_2 = \frac{0{,}10309}{0{,}049087} = 2{,}1002\ \text{m/s}
          $$
          $$
          \Delta h = \frac{v_2^{2}}{2g}
          \Bigl[1-\Bigl(\frac{D_2}{D_1}\Bigr)^{4}\Bigr]
          = \frac{4{,}4108}{19{,}6}\,(1-0{,}48225) = 0{,}11651\ \text{m}
          $$
          $$
          T = \frac{0{,}11651}{1-\dfrac{1}{1{,}1}} = 1{,}28\ \text{m}
          $$

      - tipo: calcular
        titulo: La lectura del rotámetro
        pregunta: |
          ¿Qué caudal marca el rotámetro, en l/s?
        respuesta:
          tipo: magnitud
          valor: '116.28 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '86 l/s'
            mensaje: |
              Has multiplicado por el coeficiente en vez de dividir. El
              coeficiente convierte el caudal **teórico** que marca el
              aparato en el real que circula, así que
              $Q_{real} = c\,Q_{aparato}$ y hay que despejar al revés.
          - valor: '103.09 l/s'
            mensaje: |
              Ese es el caudal teórico del **venturímetro**, con su
              coeficiente $0{,}97$. El rotámetro tiene el suyo, $0{,}86$, y
              es el que hay que usar aquí.
        pista: |
          Por la instalación circula un solo caudal real; cada aparato lo
          marca dividido por su propio coeficiente.
        desarrollo: |
          $$
          Q_{rot} = \frac{100}{0{,}86} = 116{,}28\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Como $T > R$, la altura piezométrica es mayor bajo el manómetro
              de la derecha, y el fluido va de derecha a izquierda.
          - texto: >-
              La diferencia entre las dos lecturas es exactamente la pérdida
              de carga entre los dos puntos.
          - texto: >-
              El líquido manométrico es el agua, más ligera que el glicol, y
              por eso el factor de la U invertida es $(s-1)/s = 0{,}0909$.
          - texto: >-
              Los dos aparatos marcan caudales distintos, así que uno de los
              dos está mal calibrado.
            trampa: true
            mensaje: |
              Los dos están bien y marcan lo que deben. Un caudalímetro de
              obstrucción mide el caudal **teórico** que se deduce de una
              diferencia de presiones sin pérdidas, y el coeficiente es
              precisamente la corrección a la realidad. Dos aparatos con
              coeficientes distintos dan lecturas distintas para el mismo
              caudal real, y eso es lo normal: 116,28 l/s el rotámetro y
              103,09 el venturi, los dos para 100 l/s reales.
    resolucion: |
      **a) El sentido del flujo.** No hace falta ningún dato más que las dos
      lecturas. Entre dos puntos de una tubería la línea piezométrica solo
      puede bajar en el sentido del flujo, porque lo que pierde son las
      pérdidas de carga. Como $T > R$, la altura piezométrica es mayor en el
      punto del manómetro de la derecha, y **el fluido circula de derecha a
      izquierda**, hacia arriba. La diferencia entre las dos lecturas es
      justamente la pérdida entre los dos puntos.

      La expresión del caudal es la de siempre, escrita sobre alturas
      piezométricas para que valga con la tubería inclinada:

      $$
      Q = c\,A_2\sqrt{\frac{2g\,\Delta h}
      {1-\bigl(A_2/A_1\bigr)^{2}}}
      $$

      **b) La lectura del manómetro.** Con $Q_{real} = 100$ l/s y el
      coeficiente $0{,}97$, el caudal teórico es $103{,}09$ l/s, y con
      $A_2 = 0{,}049087\ \text{m}^{2}$ la velocidad en la garganta vale
      $2{,}1002$ m/s. Deshaciendo la fórmula:

      $$
      \Delta h = 0{,}11651\ \text{m de glicol}
      $$

      Y ahora el paso que se falla. El líquido manométrico es el **agua**,
      más ligera que el glicol que circula, así que va arriba en una U
      invertida y el factor no es el de siempre:

      $$
      \Delta h = T\Bigl(1-\frac{\gamma_{ag}}{\gamma_{gl}}\Bigr)
      = T\Bigl(1-\frac{1}{1{,}1}\Bigr) = 0{,}0909\,T
      \;\Longrightarrow\;
      T = 1{,}28\ \text{m}
      $$

      **c) La lectura del rotámetro.** Cada aparato marca el caudal teórico
      que corresponde a su propia medida; el real es el mismo para los dos:

      $$
      Q_{rot} = \frac{100}{0{,}86} = 116{,}28\ \text{l/s}
      $$

      **Lo que enseña.** Que un caudalímetro no mide el caudal: mide una
      diferencia de presiones de la que se deduce un caudal ideal, y el
      coeficiente hace el resto. Dos aparatos con coeficientes distintos
      marcan números distintos y los dos son correctos.

  # ── 6 (10 %) · Mach y Reynolds a la vez. El caso en que la semejanza
  #    absoluta obliga a la escala 1, y el que la rescata subiendo la presión.
  - id: exflu2223-ord-6-mach-y-reynolds-a-la-vez
    titulo: Cuando Mach y Reynolds se pelean por la escala
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el razonamiento pero no el desarrollo.
    nivel: examen
    enunciado: |
      Determinar si es posible, y bajo qué condiciones en caso de respuesta
      afirmativa, obtener la semejanza dinámica absoluta entre modelo y
      prototipo en un fenómeno que se caracteriza en los números
      adimensionales relacionados con la **compresibilidad** y la
      **viscosidad** y se realiza a escala reducida, en dos casos diferentes:

      **a)** Sabiendo que se emplea el mismo gas con las mismas condiciones de
      presión y temperatura.

      **b)** Sabiendo que se emplea el mismo gas con las mismas condiciones de
      temperatura.

      Nota: la velocidad del sonido y la viscosidad absoluta del gas son
      variables físicas muy poco dependientes de la presión y muy
      dependientes de la temperatura.
    pide: Si se puede tener a la vez igualdad de Mach y de Reynolds, y con qué condición.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos números adimensionales del enunciado son el de Mach
          (compresibilidad) y el de Reynolds (viscosidad). ¿Qué impone el de
          Mach si se usa el mismo gas a la misma temperatura?
        opciones:
          - texto: >-
              Que las velocidades de modelo y prototipo sean iguales, porque
              la velocidad del sonido solo depende de la temperatura
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. $Ma = v/c$, y la nota dice
              que $c$ apenas depende de la presión. Mismo gas y misma
              temperatura significan misma $c$, y entonces igualar Mach es
              igualar las velocidades: $v_m = v_p$.
          - texto: >-
              Que la escala de velocidades sea la raíz de la escala
              geométrica, como en Froude
            mensaje: |
              Esa es la condición de **Froude**, que sale de igualar
              inercia y gravedad. Mach no lleva ninguna longitud dentro, así
              que no relaciona velocidades con tamaños.
          - texto: >-
              Que las densidades sean iguales
            mensaje: |
              La densidad no aparece en el número de Mach. Donde sí aparece
              es en el de Reynolds, y de ahí saldrá la condición del apartado
              b).

      - tipo: calcular
        titulo: La escala que queda libre
        pregunta: |
          Con el mismo gas y la misma temperatura, si el modelo se construye a
          escala $1{:}4$, ¿cuántas veces mayor que la del prototipo tiene que
          ser la **presión** del gas del modelo?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.05
          formato: un número de veces
        distractores:
          - valor: '0.25'
            mensaje: |
              Lo has puesto al revés. El modelo es más pequeño, así que para
              mantener $\rho v L$ constante con $v$ fija hay que
              **aumentar** la densidad, y a temperatura constante eso es
              aumentar la presión.
          - valor: '16'
            mensaje: |
              Has elevado la escala al cuadrado. En el Reynolds la longitud
              aparece a la primera potencia, así que la densidad va con
              $1/\lambda$, no con $1/\lambda^{2}$.
          - valor: '2'
            mensaje: |
              Has tomado la raíz de la escala, que es lo que aparece en
              Froude. En Reynolds la longitud entra sin raíz.
        pista: |
          Mach iguala las velocidades; escribe entonces la igualdad de
          Reynolds y despeja el cociente de densidades. Con $T$ constante,
          $\rho$ es proporcional a $p$.
        desarrollo: |
          $$
          Ma_m = Ma_p \;\Longrightarrow\; v_m = v_p
          \qquad
          Re_m = Re_p \;\Longrightarrow\;
          \frac{\rho_m v_m L_m}{\mu_m} = \frac{\rho_p v_p L_p}{\mu_p}
          $$

          Con $v$ y $\mu$ iguales, queda $\rho_m L_m = \rho_p L_p$, es decir

          $$
          \lambda = \frac{L_m}{L_p} = \frac{\rho_p}{\rho_m}
          \;\Longrightarrow\;
          \frac{\rho_m}{\rho_p} = \frac{1}{\lambda} = 4
          $$

          Y a temperatura constante $\rho \propto p$, así que el modelo debe
          trabajar a cuatro veces la presión del prototipo.

      - tipo: justificar
        pregunta: Ordena la respuesta a los dos apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el mismo gas a la misma presión y temperatura, $\rho$ y
              $\mu$ son iguales, y las dos condiciones juntas obligan a
              $\lambda = 1$: no hay modelo reducido posible.
          - texto: >-
              Dejando libre la presión, la igualdad de Mach sigue dando
              $v_m = v_p$ y la de Reynolds pasa a pedir
              $\lambda = \rho_p/\rho_m$.
          - texto: >-
              Como a temperatura constante la densidad es proporcional a la
              presión, basta presurizar el modelo en la proporción inversa a
              la escala.
          - texto: >-
              La semejanza absoluta con Mach y Reynolds a la vez es imposible
              siempre, sea cual sea el fluido.
            trampa: true
            mensaje: |
              El propio apartado b) la consigue. Lo que es imposible es
              conseguirla **sin tocar ninguna propiedad del fluido**: si se
              deja libre una —aquí la presión, y por tanto la densidad— la
              semejanza absoluta vuelve a estar al alcance. Esa es la razón de
              ser de los túneles de viento presurizados.
    resolucion: |
      **El planteamiento.** El fenómeno lo gobiernan Mach y Reynolds, así que
      la semejanza dinámica absoluta exige los dos a la vez:

      $$
      \frac{v_m}{c_m} = \frac{v_p}{c_p}
      \qquad
      \frac{\rho_m v_m L_m}{\mu_m} = \frac{\rho_p v_p L_p}{\mu_p}
      $$

      La nota del enunciado es la que decide todo: $c$ y $\mu$ dependen mucho
      de la temperatura y muy poco de la presión. Como en los dos apartados la
      temperatura es la misma y el gas es el mismo, $c_m = c_p$ y
      $\mu_m = \mu_p$.

      De Mach sale entonces, sin más, $v_m = v_p$. Y metiendo eso en Reynolds:

      $$
      \rho_m L_m = \rho_p L_p
      \qquad\Longrightarrow\qquad
      \lambda = \frac{L_m}{L_p} = \frac{\rho_p}{\rho_m}
      $$

      **a) Misma presión y misma temperatura.** Entonces también
      $\rho_m = \rho_p$, y la relación anterior obliga a $\lambda = 1$. Es
      decir: **la semejanza dinámica absoluta no se consigue a escala
      reducida**. El modelo tendría que ser tan grande como el prototipo, que
      es tanto como no tener modelo.

      **b) Solo la temperatura fija.** Ahora la densidad queda libre, y la
      condición es

      $$
      \lambda = \frac{\rho_p}{\rho_m}
      $$

      Sí se puede, presurizando el modelo. A temperatura constante la densidad
      es proporcional a la presión, así que un modelo a escala $1{:}4$ necesita
      cuatro veces la presión del prototipo.

      **Y esto no es un ejercicio de papel.** Los túneles de viento
      criogénicos y presurizados existen exactamente por esta cuenta: para
      ensayar un perfil a su Mach de vuelo y a su Reynolds de vuelo a la vez,
      con un modelo que quepa en el laboratorio, hay que jugar con la densidad
      —subiendo la presión— o con la temperatura —bajándola, que sube $\rho$ y
      baja $\mu$—. Cuando no se puede, se elige cuál de los dos números
      respetar y se corrige el otro, que es lo que se llama semejanza
      **restringida**.

  # ── 7 (5 %) · La sección hidráulicamente óptima de un canal rectangular.
  #    Deducción corta con un final que se recuerda: b = 2y, R = y/2.
  - id: exflu2223-ord-7-la-seccion-optima-del-canal-rectangular
    titulo: La sección óptima de un canal rectangular, deducida
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen pide la
      deducción y no publica desarrollo.
    nivel: examen
    enunciado: |
      Deducir de forma clara y concisa cuál es la sección hidráulicamente
      óptima en un canal de sección rectangular de ancho $b$.
    pide: La relación entre el ancho y el calado que hace máximo el caudal.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Sección hidráulicamente óptima» quiere decir que, para un área dada,
          el caudal es máximo. Con la fórmula de Manning,
          $Q = \dfrac{1}{n}A R_h^{2/3} S^{1/2}$, ¿qué hay que hacer?
        opciones:
          - texto: >-
              Minimizar el perímetro mojado, porque con $A$, $n$ y $S$ fijos
              el caudal solo crece si crece $R_h = A/P$
            correcta: true
            mensaje: |
              Eso es. Todo el problema se reduce a un mínimo de $P$ con $A$
              constante, que es un problema de geometría, no de hidráulica.
              Y por eso la respuesta —el semicírculo, y en rectángulo el
              medio cuadrado— no depende ni del caudal ni de la pendiente.
          - texto: >-
              Maximizar el área, porque el caudal es proporcional a ella
            mensaje: |
              El área está **fija** por hipótesis: es el enunciado del
              problema de optimización. Si se pudiera agrandar, la respuesta
              sería «un canal infinito» y no habría nada que deducir.
          - texto: >-
              Maximizar la pendiente
            mensaje: |
              La pendiente la impone el terreno, no el proyectista, y además
              tampoco es lo que se pregunta. La sección óptima es una
              propiedad de la **forma**.

      - tipo: calcular
        titulo: La relación entre ancho y calado
        pregunta: |
          En el óptimo, ¿cuánto vale el cociente $b/y$ entre el ancho y el
          calado?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Lo has puesto al revés: el óptimo es un rectángulo el doble de
              ancho que de hondo, es decir **medio cuadrado**, no el doble de
              hondo que de ancho.
          - valor: '1'
            mensaje: |
              El cuadrado no es el óptimo. Con $A$ fija, $P = b + 2y$ cuenta
              **dos** paredes laterales y **un** fondo, y esa asimetría es la
              que desplaza el óptimo hacia el rectángulo tumbado.
          - valor: '4'
            mensaje: |
              Has llegado a $b = 4y$, que sale si se cuentan cuatro lados
              como en un conducto cerrado. En un canal la superficie libre no
              roza, así que el perímetro mojado son tres lados.
        pista: |
          Escribe $P$ en función de $y$ sola usando $A = by$, y anula la
          derivada.
        desarrollo: |
          $$
          A = by \;\Longrightarrow\; b = \frac{A}{y}
          \qquad
          P = b + 2y = \frac{A}{y} + 2y
          $$
          $$
          \frac{dP}{dy} = -\frac{A}{y^{2}} + 2 = 0
          \;\Longrightarrow\;
          A = 2y^{2} = by
          \;\Longrightarrow\;
          b = 2y
          $$

      - tipo: calcular
        titulo: Un canal óptimo de ocho metros cuadrados
        pregunta: |
          Si ese canal óptimo tiene que llevar una sección de
          $8\ \text{m}^{2}$, ¿cuál es su radio hidráulico, en metros?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número en metros
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el calado. El radio hidráulico del rectángulo óptimo es
              **la mitad** del calado, que es el resultado que conviene
              recordar.
          - valor: '0.5'
            mensaje: |
              Has dividido el calado entre cuatro. $R_h = A/P$ con $A = 8$ y
              $P = b+2y = 4+4 = 8$, así que $R_h = 1$ m.
        pista: |
          Con $b = 2y$ y $A = 2y^{2} = 8$ sale el calado, y de ahí el
          perímetro.
        desarrollo: |
          $$
          2y^{2} = 8 \;\Longrightarrow\; y = 2\ \text{m}
          \qquad b = 4\ \text{m}
          \qquad P = 4 + 4 = 8\ \text{m}
          $$
          $$
          R_h = \frac{A}{P} = \frac{8}{8} = 1\ \text{m} = \frac{y}{2}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $A$, $n$ y $S$ dados, maximizar $Q$ es maximizar $R_h = A/P$,
              es decir minimizar el perímetro mojado.
          - texto: >-
              En un rectángulo $P = A/y + 2y$, y anulando la derivada respecto
              del calado sale $A = 2y^{2}$.
          - texto: >-
              Como $A = by$, eso equivale a $b = 2y$, y entonces
              $R_h = y/2$.
          - texto: >-
              El rectángulo óptimo es la mejor sección posible para un canal,
              mejor que cualquier otra forma.
            trampa: true
            mensaje: |
              Es el mejor **rectángulo**, no la mejor sección. Entre todas
              las formas gana el **semicírculo**, y entre los trapecios el
              medio hexágono, porque el problema de fondo es «mínimo
              perímetro para un área dada» y ahí manda la circunferencia. El
              rectángulo se usa porque es fácil de encofrar, no porque sea
              óptimo en absoluto.
    resolucion: |
      **El planteamiento.** Con la fórmula de Manning,

      $$
      Q = \frac{1}{n}\,A\,R_h^{2/3}\,S^{1/2}
      = \frac{1}{n}\,\frac{A^{5/3}}{P^{2/3}}\,S^{1/2}
      $$

      Para un área $A$ dada —y con $n$ y $S$ impuestos por el material y por
      el terreno— el caudal solo depende del **perímetro mojado**, y crece al
      disminuirlo. Así que «sección hidráulicamente óptima» significa
      exactamente «perímetro mojado mínimo para el área dada».

      **La deducción.** En un rectángulo de ancho $b$ y calado $y$, la
      superficie libre no roza, así que el perímetro son tres lados:

      $$
      A = by
      \qquad
      P = b + 2y = \frac{A}{y} + 2y
      $$
      $$
      \frac{dP}{dy} = -\frac{A}{y^{2}} + 2 = 0
      \;\Longrightarrow\;
      A = 2y^{2}
      \;\Longrightarrow\;
      b = 2y
      $$

      La segunda derivada, $2A/y^{3} > 0$, confirma que es un mínimo.

      **El resultado que hay que recordar.** El rectángulo óptimo es **medio
      cuadrado**: el doble de ancho que de hondo. Y su radio hidráulico sale
      redondo:

      $$
      R_h = \frac{A}{P} = \frac{2y^{2}}{4y} = \frac{y}{2}
      $$

      Media profundidad, igual que en el semicírculo óptimo y que en el medio
      hexágono. No es casualidad: **toda sección hidráulicamente óptima tiene
      $R_h = y/2$**, porque todas ellas se pueden circunscribir a un
      semicírculo con centro en la superficie libre.

  # ── 8 (15 %) · Una red con tres tuberías y un depósito que, en vez de
  #    recibir, alimenta. La boquilla se lleva la suma de los dos caudales.
  - id: exflu2223-ord-8-la-red-con-un-deposito-que-alimenta
    titulo: La red donde el segundo depósito no recibe, sino que aporta
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la instalación de la imagen se bombea un fluido de densidad relativa
      $s = 0{,}93$ y viscosidad $1{,}47$ cSt. Las lecturas del vacuómetro y
      manómetro de la imagen son de $322\ \text{mmcHg}$ y $4{,}2$ bar,
      respectivamente, mientras que la lectura del manómetro del depósito B es
      de 32 mca. Sabiendo que la potencia bruta de la bomba es de 7 kW y su
      rendimiento del 66 %, calcular:

      **a)** Caudales circulantes.

      Sabiendo que el diámetro de la boquilla es de 50 mm y su coeficiente $k$
      adimensional es $0{,}1$, calcular:

      **b)** Presión dinámica en la salida de la boquilla (bar) y cota a la
      que está colocada.

      Nota: los conductos 0, 1 y 3 son de hierro forjado y el 2 es de PVC.

      | tubería | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | $L$ (m) | 0 | 52 | 65 | 22 |
      | $D$ (mm) | 125 | 125 | 175 | 50 |

      El depósito A, abierto, tiene la superficie a la cota 15 y alimenta la
      aspiración (conducto 0). Tras la bomba, el conducto 1 llega al nudo N;
      de N salen el conducto 2, que termina en la boquilla C, y el conducto 3,
      que baja al depósito B, cerrado, con la superficie a la cota 40.
    pide: Los tres caudales, la cota de la boquilla y su presión dinámica.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se conocen las lecturas del vacuómetro y del manómetro que flanquean
          la bomba, y su potencia. ¿Qué se puede sacar de ahí, y en qué orden?
        opciones:
          - texto: >-
              Primero la altura manométrica, restando las dos lecturas; y con
              ella y la potencia útil, el caudal que pasa por la bomba
            correcta: true
            mensaje: |
              Eso es, y es la puerta de entrada al problema. Los dos
              conductos que flanquean la bomba tienen el mismo diámetro, así
              que no hay término cinético y $H_m$ es la diferencia de las dos
              lecturas en metros de fluido. Después,
              $Q = P_{util}/(\gamma H_m)$.
          - texto: >-
              Directamente el caudal, porque la potencia es
              $\gamma Q H_m$ y $H_m$ es dato
            mensaje: |
              $H_m$ no es dato: hay que construirlo con las dos lecturas. Y
              cuidado con el vacuómetro, que marca presión **por debajo** de
              la atmosférica y por tanto se suma al restar.
          - texto: >-
              La pérdida de carga del conducto 0, que es la diferencia entre
              el depósito A y el vacuómetro
            mensaje: |
              El conducto 0 tiene longitud cero, así que no hay pérdida
              alguna. Lo que separa al depósito A del vacuómetro es la cota y
              la altura cinética, no el rozamiento.

      - tipo: calcular
        titulo: La altura manométrica de la bomba
        pregunta: |
          ¿Cuánto vale $H_m$, en metros de columna de fluido?
        respuesta:
          tipo: magnitud
          valor: '50.79 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '41.38 m'
            mensaje: |
              Has restado la lectura del vacuómetro en vez de sumarla. Un
              vacuómetro marca cuánto está la presión **por debajo** de la
              atmosférica, así que su presión relativa es negativa y al
              hacer $p_{imp}-p_{asp}$ las dos se suman.
          - valor: '47.24 m'
            mensaje: |
              Has usado el peso específico del agua. El fluido tiene
              $s = 0{,}93$, así que
              $\gamma = 9114\ \text{N/m}^{3}$ y la misma presión son más
              metros de columna.
        pista: |
          $322$ mm de mercurio son $0{,}322\cdot 13{,}6\cdot 9800$ pascales, y
          con signo negativo.
        desarrollo: |
          $$
          p_{asp} = -0{,}322\cdot 13{,}6\cdot 9800 = -42916\ \text{Pa}
          \qquad
          p_{imp} = 420000\ \text{Pa}
          $$
          $$
          H_m = \frac{420000+42916}{0{,}93\cdot 9800} = 50{,}79\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal que pasa por la bomba
        pregunta: |
          ¿Cuánto vale $Q_1$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '9.98 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '15.12 l/s'
            mensaje: |
              Has usado los 7 kW brutos. La potencia que llega al fluido es
              la útil, $7\cdot 0{,}66 = 4{,}62$ kW.
          - valor: '22.91 l/s'
            mensaje: |
              Has dividido por el rendimiento en vez de multiplicar. La
              potencia bruta es la que se paga y la útil es la que se
              aprovecha, así que la útil es **menor**.
        pista: |
          $P_{util} = \gamma\,Q\,H_m$.
        desarrollo: |
          $$
          Q_1 = \frac{7000\cdot 0{,}66}{9114\cdot 50{,}79}
          = 9{,}98\cdot 10^{-3}\ \text{m}^{3}/\text{s}
          $$

      - tipo: reconocer
        pregunta: |
          El depósito B está a la cota 40 y su manómetro marca 32 mca, mientras
          que el nudo N queda a una altura piezométrica de 65,5 m. ¿Qué hace
          el conducto 3?
        opciones:
          - texto: >-
              Lleva fluido **desde** B **hasta** N, porque la altura
              piezométrica de B es mayor
            correcta: true
            mensaje: |
              Exacto, y es lo que hay que ver antes de escribir ninguna
              ecuación. $40 + 32\cdot 9800/9114 = 74{,}41$ m frente a
              $65{,}49$ del nudo: B está más alto en energía, así que aporta
              caudal. La boquilla se lleva la suma de los dos.
          - texto: >-
              Lleva fluido desde N hasta B, porque B está a mayor cota
            mensaje: |
              La cota no decide sola: decide la altura **piezométrica**, que
              es cota más presión. B está a 40 m de cota pero además
              presurizado con 32 mca, y eso lo pone por encima del nudo.
          - texto: >-
              No circula nada, porque B es un depósito cerrado
            mensaje: |
              Cerrado no quiere decir aislado: está conectado por el conducto
              3 y presurizado, que es justo lo que lo convierte en una
              fuente.

      - tipo: calcular
        titulo: El caudal que aporta el depósito B
        pregunta: |
          ¿Cuánto vale $Q_3$, en l/s?
        respuesta:
          tipo: magnitud
          valor: '8.30 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '7.09 l/s'
            mensaje: |
              Has sumado los 32 mca directamente a la cota 40. Son metros de
              columna de **agua**, y hay que pasarlos a metros de fluido:
              $32\cdot 9800/9114 = 34{,}41$ m.
          - valor: '18.28 l/s'
            mensaje: |
              Ese es el caudal del conducto 2, que es la suma de los otros
              dos. $Q_3$ es lo que aporta B por su cuenta.
        pista: |
          La altura piezométrica en N sale de la línea de energía: cota de A,
          más $H_m$, menos la pérdida del conducto 1. Lo que sobra hasta B es
          la pérdida del conducto 3, y de ahí se despeja el caudal.
        desarrollo: |
          Con $Q_1 = 9{,}98$ l/s en el conducto 1 (hierro forjado,
          $\varepsilon = 0{,}006$ cm, $D = 125$ mm) sale $v = 0{,}813$ m/s,
          $Re = 6{,}9\cdot 10^{4}$, $f = 0{,}0213$ y

          $$
          h_{f1} = 0{,}0213\,\frac{52}{0{,}125}\,\frac{0{,}813^{2}}{19{,}6}
          = 0{,}30\ \text{m}
          $$
          $$
          H_N = 15 + 50{,}79 - 0{,}30 = 65{,}49\ \text{m}
          $$
          $$
          H_B = 40 + \frac{32\cdot 9800}{9114} = 74{,}41\ \text{m}
          \qquad
          h_{f3} = 74{,}41-65{,}49 = 8{,}92\ \text{m}
          $$

          Y despejando en el conducto 3 ($D = 50$ mm, $L = 22$ m, hierro
          forjado) sale $v = 4{,}23$ m/s, es decir $Q_3 = 8{,}30$ l/s.

      - tipo: calcular
        titulo: La cota de la boquilla
        pregunta: |
          ¿A qué cota está colocada la boquilla C, en metros?
        respuesta:
          tipo: magnitud
          valor: '60.42 m'
          tolerancia: 0.02
          formato: una cota, con su unidad
        distractores:
          - valor: '69.35 m'
            mensaje: |
              Has partido de la altura piezométrica del depósito B en vez de
              la del nudo. Entre B y N se pierden 8,92 m en el conducto 3, y
              esa es justamente la pérdida que mueve el caudal.
          - valor: '63.97 m'
            mensaje: |
              Has hecho pasar por la boquilla solo el caudal de la bomba. Por
              el conducto 2 va la **suma**, $9{,}98+8{,}30 = 18{,}28$ l/s, y
              con ella la velocidad de salida casi se duplica.
        pista: |
          Desde el nudo hasta la salida se pierden el rozamiento del conducto
          2, la pérdida de la boquilla y la altura cinética que se lleva el
          chorro.
        desarrollo: |
          Con $Q_2 = 18{,}28$ l/s en el conducto 2 (PVC, $D = 175$ mm) sale
          $h_{f2} = 0{,}20$ m, y en la boquilla de 50 mm

          $$
          v_c = \frac{0{,}01828}{0{,}0019635} = 9{,}31\ \text{m/s}
          \qquad
          \frac{v_c^{2}}{2g} = 4{,}42\ \text{m}
          $$
          $$
          z_c = 65{,}49 - 0{,}20 - 4{,}42 - 0{,}1\cdot 4{,}42
          = 60{,}42\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión dinámica del chorro
        pregunta: |
          ¿Cuánto vale la presión dinámica a la salida de la boquilla, en bar?
        respuesta:
          tipo: numero
          valor: '0.403'
          tolerancia: 0.005
          formato: un número en bar
        distractores:
          - valor: '0.433'
            mensaje: |
              Has usado la densidad del agua. El fluido tiene
              $\rho = 930\ \text{kg/m}^{3}$.
          - valor: '0.0027'
            mensaje: |
              Has usado la velocidad del conducto 2, no la del chorro. La
              boquilla estrecha de 175 a 50 mm y multiplica la velocidad por
              doce.
        pista: |
          Presión dinámica es $\tfrac12\rho v^{2}$, con la velocidad de
          salida.
        desarrollo: |
          $$
          \frac{1}{2}\rho v_c^{2} = 0{,}5\cdot 930\cdot 9{,}31^{2}
          = 40300\ \text{Pa} = 0{,}403\ \text{bar}
          $$

      - tipo: justificar
        pregunta: Ordena el análisis de la red. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos lecturas de la bomba dan $H_m = 50{,}79$ m, y con la
              potencia útil, $Q_1 = 9{,}98$ l/s.
          - texto: >-
              El depósito B, presurizado, tiene una altura piezométrica de
              74,41 m frente a los 65,49 del nudo, así que **aporta** 8,30
              l/s en vez de recibirlos.
          - texto: >-
              Por el conducto 2 va la suma, 18,28 l/s, y la boquilla la
              descarga a 9,31 m/s desde la cota 60,42.
          - texto: >-
              Como el depósito B está a la cota 40 y el nudo por debajo, el
              fluido baja hacia B por gravedad.
            trampa: true
            mensaje: |
              El nudo N **no** está por debajo: su altura piezométrica es
              65,49 m. Y aunque lo estuviera, quien decide el sentido no es
              la cota sino la altura piezométrica completa. Es el error más
              caro de este ejercicio, porque cambia el signo de $Q_3$ y con
              él el caudal de la boquilla, la velocidad de salida y las dos
              respuestas del apartado b).
    resolucion: |
      **a) Los tres caudales.**

      La bomba es la puerta de entrada. Los conductos 0 y 1 tienen el mismo
      diámetro, así que no hay término cinético y la altura manométrica es la
      diferencia de las dos lecturas. Ojo al vacuómetro, que marca presión por
      debajo de la atmosférica:

      $$
      H_m = \frac{420000 + 42916}{9114} = 50{,}79\ \text{m}
      \qquad
      Q_1 = \frac{7000\cdot 0{,}66}{9114\cdot 50{,}79} = 9{,}98\ \text{l/s}
      $$

      Con ese caudal, el conducto 1 (hierro forjado, 125 mm, 52 m) pierde
      $0{,}30$ m, y la línea de energía en el nudo queda en

      $$
      H_N = 15 + 50{,}79 - 0{,}30 = 65{,}49\ \text{m}
      $$

      **Y aquí está la decisión del ejercicio.** El depósito B está a la cota
      40 y su manómetro marca 32 mca, que en metros de este fluido son 34,41:

      $$
      H_B = 40 + 34{,}41 = 74{,}41\ \text{m} \;>\; 65{,}49\ \text{m}
      $$

      B está por encima del nudo en energía, así que **no recibe caudal: lo
      aporta**. La pérdida disponible en el conducto 3 es $8{,}92$ m, y
      despejando en 22 m de tubería de 50 mm sale $Q_3 = 8{,}30$ l/s.

      Por continuidad, la boquilla se lleva la suma:

      $$
      Q_2 = 9{,}98 + 8{,}30 = 18{,}28\ \text{l/s}
      $$

      **b) La boquilla.** El conducto 2 (PVC, 175 mm, 65 m) pierde $0{,}20$ m,
      y la boquilla de 50 mm descarga a

      $$
      v_c = 9{,}31\ \text{m/s}
      \qquad
      \frac{v_c^{2}}{2g} = 4{,}42\ \text{m}
      $$
      $$
      z_c = 65{,}49 - 0{,}20 - 4{,}42 - 0{,}44 = 60{,}42\ \text{m}
      \qquad
      \frac{1}{2}\rho v_c^{2} = 0{,}403\ \text{bar}
      $$

      **Lo que hay que llevarse.** Un depósito conectado a una red no es
      necesariamente un consumidor. Lo que decide si aporta o recibe es su
      altura piezométrica frente a la del nudo, y en un depósito cerrado esa
      altura la puede subir la presión tanto como la cota. Aquí los 32 mca del
      manómetro valen 34 metros de tubería, más que los 40 de cota, y
      convierten a B en la segunda fuente de la instalación.

  # ── 9 (15 %) · Un circuito cerrado con Hazen-Williams. Presurizar el
  #    depósito no cambia nada, porque es a la vez origen y destino.
  - id: exflu2223-ord-9-el-circuito-cerrado-de-filtrado
    titulo: El circuito cerrado donde presurizar el depósito no sirve de nada
    fuente: >-
      Ejercicio 9 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      El depósito de agua abierto a la atmósfera de la figura está provisto de
      un sistema de filtrado de impurezas que consta de una turbobomba, una
      válvula regulable V, un filtro F, y tres tuberías de acero galvanizado
      de 250 mm de diámetro. La tubería de aspiración $L_1$ tiene una longitud
      de 10 m, mientras que las longitudes de las tuberías $L_2$ y $L_3$ son
      5 m y 25 m respectivamente. Utilizando la expresión de **Hazen-Williams**
      para el cálculo de las pérdidas de carga, se pide responder a las
      siguientes preguntas:

      **a)** Explicar razonadamente cómo se determinaría la curva
      característica de la turbobomba mediante el método de la variación de la
      curva característica de la instalación. Indicar los elementos de la
      instalación sobre los que se deberá actuar durante dicho procedimiento.
      Indicar asimismo explícitamente cómo y con qué instrumento se podrían
      registrar o medir las variables relevantes en el proceso. Acompañar la
      explicación con una representación gráfica del proceso en función de
      dichas variables.

      **b)** Deducir la expresión analítica de la curva característica de la
      instalación para un caso en el que el factor de paso del filtro sea
      $k = 5$ y la longitud equivalente de la válvula V totalmente abierta
      fuera de 1 m.

      **c)** Si la expresión analítica de la curva característica $H_m$-$Q$ de
      la turbobomba de la figura fuera
      $H_{m,tb} = 30 - 3{,}5\cdot 10^{-4}\,Q^{2}$ (mca; l/s), determinar
      analíticamente el punto de funcionamiento de la instalación.

      **d)** ¿Cómo variará ese punto de funcionamiento si el depósito se
      cierra y se presuriza a $1{,}2\ \text{kg/cm}^{2}$?

      El circuito es cerrado: el agua sale del depósito por $L_1$, pasa por la
      bomba, la válvula V, $L_2$, el filtro F y $L_3$, y vuelve al mismo
      depósito.
    pide: La curva de la instalación, el punto de funcionamiento y el efecto de presurizar.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua sale del depósito y vuelve al mismo depósito. ¿Qué tiene de
          particular la curva de la instalación?
        opciones:
          - texto: >-
              Que no tiene altura geométrica: arranca en el origen, porque
              toda la altura manométrica se gasta en pérdidas
            correcta: true
            mensaje: |
              Eso es. Origen y destino son el mismo punto, con la misma cota
              y la misma presión, así que $H_{geo} = 0$ y la curva es
              $H = \sum h_f$, que pasa por $(0,0)$. Es la firma de un
              circuito cerrado.
          - texto: >-
              Que las pérdidas se anulan al volver al punto de partida
            mensaje: |
              Las pérdidas nunca se anulan: son energía degradada, y van
              siempre en el mismo sentido. Lo que se anula es el término de
              **altura geométrica**, que sí depende del punto de partida y
              del de llegada.
          - texto: >-
              Que la bomba no hace falta
            mensaje: |
              Hace toda la falta: es lo único que compensa las pérdidas. Sin
              ella el agua se pararía. Lo que ocurre es que su trabajo se va
              entero en rozamiento y no en subir el agua.

      - tipo: calcular
        titulo: El coeficiente de Hazen-Williams
        pregunta: |
          Para tubería de acero galvanizado de 250 mm, ¿qué $C_{HW}$ da el
          cuadro n.º 25?
        respuesta:
          tipo: numero
          valor: '130'
          tolerancia: 1
          formato: un número
        distractores:
          - valor: '140'
            mensaje: |
              Esa es la banda siguiente,
              $1{,}5\cdot 10^{-5} < \varepsilon/D \le 2\cdot 10^{-4}$. Aquí
              $\varepsilon = 0{,}015$ cm y $D = 250$ mm, así que
              $\varepsilon/D = 6\cdot 10^{-4}$ y cae en la de 130.
          - valor: '120'
            mensaje: |
              Esa es la banda $10^{-3} < \varepsilon/D \le 4\cdot 10^{-3}$, y
              haría falta una tubería más estrecha o más rugosa. Con
              $6\cdot 10^{-4}$ todavía estamos en la de 130.
        pista: |
          El cuadro n.º 25 asigna el coeficiente por **bandas de rugosidad
          relativa**, no por material. Hay que calcular $\varepsilon/D$
          primero.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{0{,}00015}{0{,}25}
          = 6\cdot 10^{-4}
          $$

          que cae en la banda
          $2\cdot 10^{-4} < \varepsilon/D \le 10^{-3}$, a la que el cuadro
          asigna $C_{HW} = 130$.

      - tipo: calcular
        titulo: El término de rozamiento de la curva
        pregunta: |
          Escrita como $h = a\cdot 10^{-4}\,Q^{1{,}852} + b\cdot 10^{-4}\,Q^{2}$
          con $Q$ en l/s, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1.267'
          tolerancia: 0.008
          formato: un número
        distractores:
          - valor: '1.237'
            mensaje: |
              Te has dejado la válvula. Su longitud equivalente es 1 m, así
              que la longitud total no es $10+5+25 = 40$ sino **41** m.
          - valor: '1.469'
            mensaje: |
              Has usado $C_{HW} = 120$. Con $\varepsilon/D = 6\cdot 10^{-4}$
              la banda del cuadro es la de 130, y el coeficiente entra
              elevado a $1{,}852$, así que un salto de banda mueve el
              resultado un 16 %.
        pista: |
          $J_1 = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D_{mm}^{4{,}87})$, y la
          longitud incluye la equivalente de la válvula.
        desarrollo: |
          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}
          {130^{1{,}852}\cdot 250^{4{,}87}}
          = 3{,}094\cdot 10^{-6}
          $$
          $$
          h_f = J_1\,L\,Q^{1{,}852} = 3{,}094\cdot 10^{-6}\cdot 41\,Q^{1{,}852}
          = 1{,}267\cdot 10^{-4}\,Q^{1{,}852}
          $$

      - tipo: calcular
        titulo: El término del filtro
        pregunta: |
          Y en la misma expresión, ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '1.059'
          tolerancia: 0.008
          formato: un número
        distractores:
          - valor: '0.212'
            mensaje: |
              Has olvidado el factor $k = 5$ del filtro. Ese $0{,}212$ es la
              altura cinética sola.
          - valor: '105.9'
            mensaje: |
              Te has dejado el paso de litros por segundo a metros cúbicos
              por segundo. Como el caudal va al cuadrado, el error es de
              $10^{6}$ y aquí se ve como un factor 100 tras sacar el
              $10^{-4}$.
        pista: |
          $k\,v^{2}/2g$ con $v = Q/A$ y $A = \pi\,0{,}25^{2}/4$, con $Q$ en
          l/s.
        desarrollo: |
          $$
          A = 0{,}049087\ \text{m}^{2}
          \qquad
          v = \frac{Q/1000}{0{,}049087} = 2{,}0372\cdot 10^{-2}\,Q
          $$
          $$
          k\,\frac{v^{2}}{2g} = 5\,\frac{(2{,}0372\cdot 10^{-2})^{2}}{19{,}6}\,Q^{2}
          = 1{,}059\cdot 10^{-4}\,Q^{2}
          $$

      - tipo: calcular
        titulo: El punto de funcionamiento
        pregunta: |
          ¿Qué caudal circula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '242.04 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '272 l/s'
            mensaje: |
              Te has dejado el filtro. Su término, $1{,}059\cdot 10^{-4}Q^{2}$,
              es de hecho el **mayor** de los dos a este caudal: 6,20 m
              frente a 3,30 del rozamiento.
          - valor: '256.5 l/s'
            mensaje: |
              Te has dejado el rozamiento de las tuberías y has cruzado la
              bomba solo con el filtro.
        pista: |
          Igualar la curva de la bomba con la de la instalación y resolver
          por tanteo, porque el exponente $1{,}852$ no deja despejar.
        desarrollo: |
          $$
          30 - 3{,}5\cdot 10^{-4}Q^{2}
          = 1{,}267\cdot 10^{-4}Q^{1{,}852} + 1{,}059\cdot 10^{-4}Q^{2}
          $$

          Tanteando, en $Q = 242{,}04$ l/s los dos lados valen $9{,}50$ m.

      - tipo: calcular
        titulo: La altura del punto de funcionamiento
        pregunta: |
          ¿Y qué altura manométrica da la bomba ahí, en metros?
        respuesta:
          tipo: magnitud
          valor: '9.496 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '20.5 m'
            mensaje: |
              Ese es el término que **resta** en la curva de la bomba,
              $3{,}5\cdot 10^{-4}Q^{2}$, no la altura. Hay que restarlo de
              los 30 m de altura a caudal nulo.
          - valor: '30 m'
            mensaje: |
              Esa es la altura a caudal cero, el punto donde la bomba
              trabajaría con la válvula cerrada del todo. Con 242 l/s
              circulando le quedan 9,5.
        pista: |
          Sustituir el caudal en cualquiera de las dos curvas.
        desarrollo: |
          $$
          H_m = 30 - 3{,}5\cdot 10^{-4}\cdot 242{,}04^{2}
          = 30 - 20{,}504 = 9{,}496\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              El agua sale del depósito y vuelve al mismo depósito, así que el
              origen y el destino son el mismo punto.
          - texto: >-
              Al presurizarlo, la presión sube igual en el punto de salida y
              en el de llegada, y en la ecuación de la instalación se resta
              consigo misma.
          - texto: >-
              La curva de la instalación no cambia, ni tampoco la de la bomba,
              así que el punto de funcionamiento se queda donde estaba.
          - texto: >-
              Aun así conviene presurizar, porque el caudal no cambia pero la
              bomba tiene que dar más altura.
            trampa: true
            mensaje: |
              La bomba da exactamente la misma altura: 9,496 m, la que hace
              falta para vencer las pérdidas. Lo único que sí cambia
              presurizar —y no es poco— es el **NPSH disponible** en la
              aspiración, que sube 12 metros y aleja la cavitación. Pero eso
              es otra pregunta, y el punto de funcionamiento no se mueve.
    resolucion: |
      **a) Determinar la curva de la bomba variando la de la instalación.** Se
      actúa sobre la **válvula V**, que es el único elemento regulable. Con la
      bomba en marcha se va cerrando la válvula por pasos; cada posición
      cambia la curva de la instalación —la hace más empinada— y el punto de
      funcionamiento se desplaza a lo largo de la curva de la bomba, que no se
      mueve. En cada posición se anota la pareja de valores.

      Se miden dos cosas. El **caudal**, con un caudalímetro en la línea —un
      venturímetro, un rotámetro o un electromagnético—. Y la **altura
      manométrica**, con dos manómetros, uno en la aspiración y otro en la
      impulsión de la bomba, restando sus lecturas y corrigiendo la diferencia
      de cotas y de alturas cinéticas si los diámetros no son iguales.

      Llevando las parejas $(Q, H_m)$ a un diagrama se obtiene, punto a punto,
      la curva característica de la bomba. Gráficamente: un haz de parábolas
      de instalación cada vez más empinadas, todas partiendo del origen porque
      el circuito es cerrado, y la curva de la bomba es **la línea que une los
      cortes**.

      **b) La curva de la instalación.** Circuito cerrado, luego
      $H_{geo} = 0$. Longitud total $10+5+25 = 40$ m más el metro equivalente
      de la válvula, 41 m. Con $\varepsilon = 0{,}015$ cm y $D = 250$ mm,
      $\varepsilon/D = 6\cdot 10^{-4}$, que en el cuadro n.º 25 cae en la
      banda de $C_{HW} = 130$:

      $$
      J_1 = \frac{1{,}2117\cdot 10^{10}}{130^{1{,}852}\,250^{4{,}87}}
      = 3{,}094\cdot 10^{-6}
      $$
      $$
      H_{mi} = 1{,}267\cdot 10^{-4}\,Q^{1{,}852}
      + 1{,}059\cdot 10^{-4}\,Q^{2}
      \qquad (\text{mca}; \text{l/s})
      $$

      donde el segundo sumando es el filtro, $k\,v^{2}/2g$ con $k = 5$.

      **c) El punto de funcionamiento.** Igualando con la curva de la bomba y
      tanteando —el exponente $1{,}852$ no deja despejar—:

      $$
      Q = 242{,}04\ \text{l/s}
      \qquad
      H_m = 9{,}496\ \text{m}
      $$

      Merece la pena mirar el reparto: de esos 9,5 metros, **6,20 se los lleva
      el filtro** y solo 3,30 el rozamiento de los 41 metros de tubería. Un
      accesorio con $k = 5$ pesa más que toda la conducción.

      **d) Presurizar el depósito.** No cambia nada. El agua sale del depósito
      y vuelve al mismo depósito, así que la presión aparece con el mismo
      valor en los dos extremos de la ecuación de la instalación y se cancela.
      La curva de la instalación es idéntica, la de la bomba también, y el
      punto de funcionamiento se queda en $242{,}04$ l/s y $9{,}496$ m.

      Lo que sí cambia —y por eso se presurizan los circuitos cerrados de
      verdad— es el NPSH disponible en la aspiración, que sube en los
      $1{,}2\ \text{kg/cm}^{2}$, es decir 12 metros. Pero eso afecta a la
      cavitación, no al punto de funcionamiento.

      **Un apartado que no se publica resuelto.** El examen tiene un apartado
      e) que pide la cota máxima de la turbobomba con $NPSH_{req} = 0{,}35$
      kg/cm², $p_{at} \approx 0{,}97$ atm y $p_v = 20$ mbar, y publica
      $z \le 14{,}47$ m. Nuestra reconstrucción da $15{,}52$ m, y la
      diferencia de 1,05 m no se explica con ninguna de las lecturas
      probadas: ni restando la altura cinética, ni tomando la atmósfera en
      bar, ni cambiando la banda del coeficiente. Se deja fuera antes que
      publicar un número que no cuadra.

