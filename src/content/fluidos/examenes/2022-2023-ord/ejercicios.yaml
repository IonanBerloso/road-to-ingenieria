        veredicto: |
          Si tus dos prismas tienen los cinco puntos, el apartado a) está hecho
          y el b) sale de él. El tercero es el que distingue este ejercicio: el
          fluido 2 tiene gas encima, y ese gas no está a la presión atmosférica
          sino por debajo, porque el plano de cargas está en C.

      - tipo: calcular
        titulo: La fuerza horizontal del fluido de la izquierda
        pregunta: |
          ¿Cuánto vale la componente horizontal que $s_1$ ejerce sobre BC, en
          kN?
        respuesta:
          tipo: magnitud
          valor: '13.72 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4.70 kN'
            mensaje: |
              Te has dejado el manómetro Bourdon. Los $2{,}30$ mca de gas
              sobre la superficie equivalen a $1{,}92$ m más de fluido 1, y
              eso casi triplica la presión sobre el tramo.
          - valor: '11.43 kN'
            mensaje: |
              Has convertido mal los $2{,}30$ mca. Son metros de columna de
              **agua**, así que la presión es $2{,}30\cdot 9800 = 22540$ Pa;
              para pasarlos a metros de fluido 1 hay que dividir entre
              $\gamma_1 = 11760$, no tomarlos como 2,30 m de $s_1$.
        pista: |
          Es la presión en el centro de gravedad de la **proyección vertical**
          del tramo, que es un rectángulo de $R_1$ por $b$.
        desarrollo: |
          El plano de cargas de $s_1$ está $p_1/\gamma_1$ por encima de su
          superficie libre:

          $$
          \frac{2{,}30\cdot 9800}{11760} = 1{,}9167\ \text{m}
          \qquad
          z_{PC} = 1{,}2 + 1{,}9167 = 3{,}1167\ \text{m}
          $$
          $$
          F_H = \gamma_1\,(3{,}1167-0{,}2)\cdot R_1 b
          = 11760\cdot 2{,}9167\cdot 0{,}4 = 13720\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza vertical del fluido de la izquierda
        pregunta: |
          ¿Cuánto vale la componente vertical que $s_1$ ejerce sobre BC, en
          kN?
        respuesta:
          tipo: magnitud
          valor: '13.18 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '14.66 kN'
            mensaje: |
              Has tomado el prisma como un rectángulo entero, sin descontar
              el cuarto de círculo. El volumen que pesa sobre el tramo es
              $R_1 z_{PC} - \pi R_1^{2}/4$ por unidad de anchura.
          - valor: '1.48 kN'
            mensaje: |
              Ese es el peso del cuarto de círculo de fluido, que es
              justamente lo que hay que **restar** del prisma completo, no el
              resultado.
        pista: |
          El fluido 1 está **por debajo** del tramo, así que la vertical es
          el peso del volumen imaginario que va del arco hasta el plano de
          cargas, y apunta hacia arriba.
        desarrollo: |
          $$
          V = \Bigl(R_1 z_{PC} - \frac{\pi R_1^{2}}{4}\Bigr) b
          = 0{,}4\cdot 3{,}1167 - 0{,}12566 = 1{,}1210\ \text{m}^{3}
          $$
          $$
          F_V = \gamma_1 V = 11760\cdot 1{,}1210 = 13183\ \text{N}\ (\uparrow)
          $$

      - tipo: calcular
        titulo: Las dos fuerzas del fluido de la derecha
        pregunta: |
          ¿Cuánto vale la componente **vertical** que $s_2$ ejerce sobre BC,
          en newton?
        respuesta:
          tipo: magnitud
          valor: '985.2 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '269.2 N'
            mensaje: |
              Has puesto el plano de cargas de $s_2$ a la cota de B en vez de
              a la de C. El manómetro abierto lo sitúa 900 mm por debajo de
              la superficie libre, es decir justo en C.
          - valor: '627.2 N'
            mensaje: |
              Esa es la componente **horizontal**. La vertical vale
              $\gamma_2 R_1 b\,(\pi R_1/4)$, que sale 985 N.
        pista: |
          Con el plano de cargas en la cota de C, el volumen de presiones es
          exactamente el cuarto de círculo, y la fuerza apunta hacia arriba
          porque la presión es negativa.
        desarrollo: |
          $$
          F_H = \gamma_2\,|0-0{,}2|\cdot R_1 b
          = 7840\cdot 0{,}2\cdot 0{,}4 = 627{,}2\ \text{N}\ (\rightarrow)
          $$
          $$
          F_V = \gamma_2 R_1 b\,\frac{\pi R_1}{4}
          = 7840\cdot 0{,}4\cdot 0{,}31416 = 985{,}2\ \text{N}\ (\uparrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El fluido de la izquierda tiene el plano de cargas a 3,12 m y
              empuja el tramo hacia la derecha y hacia arriba.
          - texto: >-
              El de la derecha lo tiene a la cota de C, así que su presión
              sobre BC es negativa y **tira** del tramo hacia la derecha y
              hacia arriba también.
          - texto: >-
              Sumando, el tramo recibe 14,35 kN hacia la derecha y 14,17 kN
              hacia arriba.
          - texto: >-
              Los datos $d_1 = 2{,}00$ m y $d_2 = 3{,}00$ m son los que fijan
              la altura del plano de cargas del fluido 1.
            trampa: true
            mensaje: |
              No intervienen en ningún sitio. La altura del plano de cargas
              del fluido 1 la fijan $h_1$ y la lectura del Bourdon; $d_1$ y
              $d_2$ son las dimensiones del depósito y aquí solo sirven para
              dibujar. **Un examen que da datos de sobra está comprobando que
              sabes cuáles pintan**, y este da dos.
    resolucion: |
      **Lo primero es situar los dos planos de cargas**, porque el resto es
      geometría.

      **El de la izquierda.** El Bourdon marca $P_1 = 2{,}30$ mca sobre la
      superficie libre de $s_1$, que está a $h_1 = 1{,}2$ m del suelo. En
      metros de fluido 1:

      $$
      \frac{2{,}30\cdot 9800}{1{,}2\cdot 9800} = 1{,}9167\ \text{m}
      \qquad
      z_{PC,1} = 1{,}2 + 1{,}9167 = 3{,}1167\ \text{m}
      $$

      **El de la derecha.** El manómetro abierto lo sitúa a la cota de C, es
      decir 900 mm por debajo de la superficie de $s_2$: el gas encerrado
      está en depresión. Sobre todo el tramo BC la presión relativa del
      fluido 2 es **negativa**.

      **b) Las cuatro fuerzas.** Con $R_1 = 0{,}4$ m, $b = 1$ m,
      $\gamma_1 = 11760$ y $\gamma_2 = 7840\ \text{N/m}^{3}$:

      | | horizontal | vertical |
      |---|---|---|
      | fluido 1 | $13{,}72$ kN $(\rightarrow)$ | $13{,}18$ kN $(\uparrow)$ |
      | fluido 2 | $627{,}2$ N $(\rightarrow)$ | $985{,}2$ N $(\uparrow)$ |
      | **total** | $14{,}35$ kN | $14{,}17$ kN |

      La horizontal de cada fluido es la presión en el centro de gravedad de
      la proyección vertical del tramo, un rectángulo de $0{,}4\times 1$ m. La
      vertical es el peso del volumen de presiones: para el fluido 1, el
      prisma que va del arco hasta su plano de cargas, menos el cuarto de
      círculo; para el fluido 2, con el plano de cargas justo en C, el volumen
      se reduce **exactamente** al cuarto de círculo.

      **Y aquí está lo que enseña el ejercicio.** Uno espera que dos fluidos a
      ambos lados de una pared se contrarresten. Aquí no: los dos empujan en
      el mismo sentido. El de la izquierda porque presiona; el de la derecha
      porque, al estar su plano de cargas por debajo de la pared, **succiona**.
      Un depósito en depresión no descarga la pared que lo separa del vecino:
      la carga más.

      **Sobre la lectura de la figura.** Que el plano de cargas del fluido 2
      esté a la cota de C es lo que fija el manómetro abierto del dibujo, y lo
      confirman los dos resultados publicados, que salen exactos con esa
      hipótesis y con ninguna otra: $627{,}2$ N y $985{,}2$ N.

  # ── 4 (10 %) · Compresibilidad a 3.050 bar. La fórmula lineal ya no vale,
  #    y el agujero que se llena es más pequeño que el aceite que se compra.
  - id: exflu2223-ord-4-el-aceite-que-sostiene-la-chatarra
    titulo: El aceite que sostiene quinientas cincuenta toneladas
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En la imagen hay un cubo para acumular chatarra sostenido por un
      cilindro que se rellena con un aceite de mala calidad. El diámetro del
      cilindro es de 15 cm y su longitud es de 490 mm. La masa del cubo es de
      550 kg y la masa de la chatarra que se puede introducir en su interior
      es de 550 toneladas. El peso del cilindro es irrelevante.

      Cuando el cubo está vacío, el cilindro se llena completamente de aceite.
      A continuación, se introduce la chatarra dentro del cubo:

      **a)** Calcular cuántos litros se reducirá el volumen de aceite del
      cilindro desde que el cubo está vacío hasta que se llena de chatarra.

      Se va a realizar la compra de una nueva botella de aceite de las mismas
      propiedades,

      **b)** ¿Cuál deberá ser el volumen de la nueva botella de aceite para
      llenar completamente el cilindro estando el cubo lleno de chatarra?

      Datos: $s_{aceite} = 0{,}87$ [-]; Viscosidad del aceite
      $\nu_{aceite} = 68$ [cst]; Coeficiente de compresibilidad cúbico del
      aceite $\alpha_{aceite} = 1{,}667\cdot 10^{-10}$ [Pa$^{-1}$].

      **Notas nuestras.** La imagen del cuadernillo no se reproduce: es un
      cubo lleno de chatarra apoyado sobre el vástago de un cilindro vertical
      lleno de aceite, que sostiene todo el peso.
    pide: Cuánto se encoge el aceite, y cuánto aceite hay que comprar para reponerlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la viscosidad del aceite, $68\ \text{cSt}$. ¿Para
          qué hace falta aquí?
        opciones:
          - texto: >-
              Para nada: no hay movimiento, así que la viscosidad no
              interviene en ningún sitio
            correcta: true
            mensaje: |
              Exacto. Es un dato de sobra, y reconocerlo es parte del
              ejercicio. La viscosidad solo aparece cuando hay velocidades
              distintas en capas contiguas; aquí el aceite está quieto y lo
              único que se le pide es sostener una carga.
          - texto: >-
              Para calcular la densidad, que depende de la viscosidad
            mensaje: |
              No dependen una de otra. La densidad la da $s = 0{,}87$, y de
              hecho tampoco hace falta: el ejercicio se resuelve con la
              presión, el volumen y $\alpha$.
          - texto: >-
              Para saber cuánto tarda el aceite en comprimirse
            mensaje: |
              La compresión de un líquido no es un proceso viscoso con un
              tiempo de relajación: es instantánea a efectos del problema.
              Lo que sí depende de la viscosidad es la velocidad con que el
              aceite **entraría** por un conducto, y eso no se pregunta.

      - tipo: calcular
        titulo: El incremento de presión
        pregunta: |
          ¿Cuánto sube la presión del aceite al cargar las 550 toneladas de
          chatarra, en bar?
        respuesta:
          tipo: numero
          valor: '3050'
          tolerancia: 5
          formato: un número en bar
        distractores:
          - valor: '3.05'
            mensaje: |
              Has tomado las 550 **toneladas** como 550 kilos. Con esa carga
              la presión sería de tres bares y el aceite no se enteraría; lo
              que hace interesante al ejercicio es precisamente que son mil
              veces más.
          - valor: '311'
            mensaje: |
              Parece que has dividido entre un área diez veces mayor. El
              diámetro es 15 cm, así que
              $A = \pi\cdot 0{,}15^{2}/4 = 0{,}01767\ \text{m}^{2}$.
        pista: |
          Es el peso de la chatarra repartido sobre la sección del cilindro.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
          $$
          $$
          \Delta p = \frac{550000\cdot 9{,}8}{0{,}017671}
          = 3{,}050\cdot 10^{8}\ \text{Pa} = 3050\ \text{bar}
          $$

      - tipo: calcular
        titulo: Los litros que faltan
        pregunta: |
          ¿Cuánto se reduce el volumen del aceite, en litros?
        respuesta:
          tipo: numero
          valor: '0.429'
          tolerancia: 0.003
          formato: un número en litros
        distractores:
          - valor: '0.440'
            mensaje: |
              Has usado la fórmula lineal $\Delta V = \alpha V\Delta p$. A
              3.050 bar el producto $\alpha\Delta p$ vale $0{,}0508$, que ya
              no es despreciable frente a 1, y la exponencial se separa de la
              recta un 2,5 %. Con
              $\Delta V = V_0\,(1-e^{-\alpha\Delta p})$ salen 0,429.
          - valor: '0.000429'
            mensaje: |
              Ese es el resultado en metros cúbicos. Un metro cúbico son mil
              litros.
        pista: |
          El volumen del cilindro son $8{,}659$ litros, y la ley de
          compresibilidad integrada es
          $V = V_0\,e^{-\alpha\Delta p}$.
        desarrollo: |
          $$
          V_0 = 0{,}017671\cdot 0{,}49 = 8{,}659\ \text{l}
          \qquad
          \alpha\,\Delta p = 1{,}667\cdot 10^{-10}\cdot 3{,}0501\cdot 10^{8}
          = 0{,}050845
          $$
          $$
          \Delta V = V_0\bigl(1-e^{-0{,}050845}\bigr)
          = 8{,}659\cdot 0{,}049574 = 0{,}429\ \text{l}
          $$

      - tipo: calcular
        titulo: La botella que hay que comprar
        pregunta: |
          ¿Qué volumen debe tener la botella nueva, en litros?
        respuesta:
          tipo: numero
          valor: '0.452'
          tolerancia: 0.003
          formato: un número en litros
        distractores:
          - valor: '0.429'
            mensaje: |
              Ese es el hueco **dentro** del cilindro, con el aceite ya
              comprimido. El aceite de la botella está a presión
              atmosférica, así que ocupa más: al meterlo se encogerá lo
              mismo que se encogió el que ya estaba.
          - valor: '0.408'
            mensaje: |
              Has multiplicado por $e^{-\alpha\Delta p}$ en vez de dividir.
              El aceite de la botella se **comprime** al entrar, así que hay
              que comprar más de 0,429 l, no menos.
        pista: |
          El mismo factor de antes, pero al revés: la botella está a presión
          atmosférica.
        desarrollo: |
          $$
          V_{bot} = \Delta V\,e^{\alpha\Delta p}
          = 0{,}429\cdot 1{,}0522 = 0{,}452\ \text{l}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Las 550 toneladas sobre $0{,}0177\ \text{m}^{2}$ dan 3.050 bar,
              una presión enorme para una máquina pequeña.
          - texto: >-
              A esa presión $\alpha\Delta p = 0{,}051$, y la fórmula lineal ya
              se equivoca en un 2,5 %.
          - texto: >-
              El hueco que queda dentro mide 0,429 l, pero hay que comprar
              0,452 porque el aceite de la botella está sin comprimir.
          - texto: >-
              Como el aceite se comprime, el cilindro baja $0{,}429/A = 2{,}4$
              cm, que es la carrera perdida del émbolo.
            trampa: true
            mensaje: |
              La cuenta está bien hecha —$0{,}429$ l entre
              $0{,}0177\ \text{m}^{2}$ son 2,4 cm— pero la conclusión no se
              sigue del enunciado, que dice que el cilindro **se rellena** de
              aceite y no habla de émbolo ni de carrera. Y el orden de
              magnitud sí es la lección real: dos centímetros y medio de
              hundimiento por la sola compresibilidad del aceite explican por
              qué en hidráulica de precisión se purga hasta la última burbuja
              y se elige el fluido por su módulo, no por su precio.
    resolucion: |
      **a) Los litros que se pierden.** El aceite soporta el peso de la
      chatarra repartido sobre la sección del cilindro:

      $$
      A = \frac{\pi\,0{,}15^{2}}{4} = 0{,}017671\ \text{m}^{2}
      \qquad
      \Delta p = \frac{550000\cdot 9{,}8}{0{,}017671} = 3050\ \text{bar}
      $$

      Con el volumen del cilindro $V_0 = A\cdot 0{,}49 = 8{,}659$ l, y la ley
      de compresibilidad integrada —no la lineal, que a esta presión ya se
      queda corta—:

      $$
      \Delta V = V_0\bigl(1-e^{-\alpha\Delta p}\bigr)
      = 8{,}659\bigl(1-e^{-0{,}050845}\bigr) = 0{,}429\ \text{l}
      $$

      **b) La botella.** Esos 0,429 litros son el hueco medido **dentro** del
      cilindro, es decir con el aceite ya comprimido a 3.050 bar. El aceite
      que se compra está a presión atmosférica y se encogerá al entrar, así
      que hace falta más:

      $$
      V_{bot} = \Delta V\,e^{\alpha\Delta p} = 0{,}452\ \text{l}
      $$

      **Dos cosas que llevarse.** La primera, que la fórmula lineal
      $\Delta V = \alpha V\Delta p$ da 0,440 l y la exacta 0,429: a tres mil
      bares la aproximación de siempre se sale un 2,5 %, y este ejercicio
      está puesto justo por encima de esa frontera. La segunda, que el
      agujero y el aceite que lo llena **no miden lo mismo**, y la diferencia
      —23 mililitros— es exactamente el aceite que se comprimirá al entrar.

      Y un dato del enunciado que no se usa: la viscosidad de 68 cSt. No hay
      movimiento, así que no pinta nada.

  # ── 5 (10 %) · Un venturímetro que primero dice hacia dónde va el fluido.
  #    Y la trampa del fluido manométrico, que aquí es el ligero.
  - id: exflu2223-ord-5-el-venturimetro-que-dice-hacia-donde-va
    titulo: El venturímetro que primero dice hacia dónde va el fluido
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Para el venturímetro de la imagen:

      **a)** Indicar claramente cuál es la dirección del flujo y **deducir la
      expresión del caudal**.

      En el sistema representado en la imagen intervienen agua y glicol
      ($s = 1{,}1$). Los coeficientes del rotámetro y del venturímetro son
      $0{,}86$ y $0{,}97$, respectivamente. Sabiendo que el caudal real
      circulante por la instalación es de $100\ \text{l/s}$,

      **b)** Obtener la lectura del manómetro.

      **c)** Obtener la lectura del rotámetro.

      DATOS: $D_1 = 300$ mm; $D_2 = 250$ mm.

