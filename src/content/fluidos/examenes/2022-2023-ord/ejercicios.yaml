      <figcaption>

      El depósito del ejercicio, redibujado. d₁, d₂, h₁, h₂ y R₁ van a la misma escala; dónde está la pared a lo largo del depósito y por dónde va el tubo del manómetro abierto, el enunciado no lo dice.

      </figcaption>
      </figure>

      **Notas nuestras.** El tramo BC es un cuarto de circunferencia con el
      centro en el pie de la pared, abombado hacia el compartimento de la
      derecha: el fluido $s_1$ llena el cuarto de círculo. El manómetro
      abierto sale del suelo del compartimento de la derecha, y en su rama
      abierta el fluido $s_2$ llega justo a la altura del suelo del depósito,
      la de C.
    pide: Las componentes horizontal y vertical que cada fluido ejerce sobre BC.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro de la derecha coloca el plano de cargas del fluido 2 a
          la cota de C, es decir **por debajo** de todo el tramo BC. ¿Qué
          significa eso?
        opciones:
          - texto: >-
              Que la presión del fluido 2 sobre BC es negativa, y sus fuerzas
              apuntan hacia fuera del fluido en vez de hacia la pared
            correcta: true
            mensaje: |
              Eso es, y es lo que hace especial a este ejercicio. El gas
              encerrado sobre $s_2$ está en depresión, la presión relativa en
              todo BC es negativa, y el fluido de la derecha **tira** del
              tramo en lugar de empujarlo. Resultado: sus fuerzas van en el
              mismo sentido que las del fluido de la izquierda.
          - texto: >-
              Que el fluido 2 no ejerce ninguna fuerza sobre BC
            mensaje: |
              Ejerce, y no es despreciable. Que la presión sea negativa no la
              anula: le cambia el signo. Son 627 N y 985 N.
          - texto: >-
              Que el compartimento de la derecha está vacío
            mensaje: |
              Está lleno hasta $h_2 = 900$ mm de fluido $s_2$. Lo que está en
              depresión es el **gas** que hay encima, y por eso el plano de
              cargas cae por debajo de la superficie libre.

      - tipo: dibujar
        consigna: |
          Los prismas de presiones acotados sobre la pared ABC, que es lo que
          pide el apartado a): el de cada fluido por separado, con el gas que
          tiene encima, en kPa o en metros de columna. En cada vértice del
          prisma, su valor.
        comprueba:
          - punto: >-
              Fluido 1: un rectángulo de 22,54 kPa desde A hasta su lámina, a
              1,2 m del suelo, porque encima hay gas a $P_1 = 2{,}30$ mca; y
              debajo un trapecio que crece hasta 31,95 kPa en B.
            porque: >-
              En un gas la presión es la misma a cualquier altura, y en la
              lámina el líquido arranca con la del gas, no con cero. El
              trapecio crece con $\gamma_1 = 11\,760\ \text{N/m}^{3}$: 0,8 m
              de fluido 1 son 9,41 kPa más. Los 2,30 mca son de agua:
              $2{,}30\cdot 9800 = 22\,540$ Pa.
          - punto: >-
              Fluido 1 sobre el arco: perpendicular al arco y dibujado dentro
              del cuarto de círculo, con cada flecha en la línea del centro
              pero apuntando hacia fuera, hacia el arco; de 31,95 kPa en B a
              36,65 kPa en C.
            porque: >-
              La presión actúa siempre normal a la superficie, y en un arco la
              normal pasa por el centro: el prisma no es un trapecio con los
              lados horizontales. En B el arco es horizontal y la presión es
              vertical; en C es al revés.
          - punto: >-
              Fluido 2: presión **negativa**, $-7{,}06$ kPa desde A hasta su
              lámina, a 0,9 m, que se reduce hasta $-3{,}14$ kPa en B y hasta
              cero en C.
            porque: >-
              El manómetro abierto deja el fluido 2 al nivel del suelo en la
              rama abierta: su plano de cargas está en C, por debajo de toda la
              pared, así que el gas de ese compartimento está a
              $-0{,}9\cdot 7840 = -7056$ Pa. Si tu prisma del fluido 2 empieza
              en cero en su lámina, has puesto el plano de cargas donde no
              está.
          - punto: >-
              El prisma del fluido 2 con las flechas **saliendo** de la pared
              hacia el fluido 2: tira de ella, hacia la derecha y hacia fuera
              del arco, en el mismo sentido en que empuja el fluido 1.
            porque: >-
              Es lo que tiene de particular el ejercicio: los dos fluidos cargan
              la pared en el mismo sentido y las fuerzas del apartado b) se
              suman. Un prisma negativo dibujado como uno positivo lleva a
              restar dos fuerzas que se suman.
          - punto: >-
              El valor en cada vértice: 22,54 en A y en la lámina, 31,95 en B y
              36,65 en C para el fluido 1; $-7{,}06$, $-7{,}06$, $-3{,}14$ y 0
              para el fluido 2.
            porque: >-
              «Acotados» es la palabra del enunciado, en negrita: un prisma sin
              valores es un dibujo de la forma, y la forma sola no se puntúa.
              Son además los números con los que se calculan las fuerzas del
              apartado b).
        figura: |
          <svg viewBox="0 0 470 330" role="img" width="470" height="330" aria-labelledby="exflu2223o3-prismas-t exflu2223o3-prismas-d">
            <title id="exflu2223o3-prismas-t">Los prismas de presiones sobre la pared ABC del ejercicio 3: a la izquierda el del fluido 1 con su gas, a la derecha el del fluido 2, en depresión</title>
            <desc id="exflu2223o3-prismas-d">Dos dibujos de la misma pared ABC, a la misma escala de longitudes: el tramo recto AB de 1,6 metros y el cuarto de circunferencia BC de 0,4 metros de radio, con el centro en el pie de la pared. Izquierda, el fluido 1 y el gas que lo presuriza: sobre AB, del lado izquierdo, un rectángulo de 22,54 kilopascales desde A hasta la lámina, a 1,2 metros del suelo, y debajo un trapecio que crece hasta 31,95 kilopascales en B; sobre el arco, dentro del cuarto de círculo, el prisma es perpendicular al arco, se extiende del arco hacia el centro y crece desde 31,95 kilopascales en B hasta 36,65 en C. Las flechas empujan la pared hacia la derecha y hacia fuera del cuarto de círculo. Derecha, el fluido 2, con su gas en depresión: presión negativa de 7,06 kilopascales desde A hasta su lámina, a 0,9 metros, que se reduce hasta 3,14 negativos en B y a cero en C, donde está su plano de cargas. Se dibuja del lado del fluido 2 y sus flechas se alejan de la pared, porque el fluido tira de ella: también hacia la derecha y hacia fuera del arco. Cada dibujo tiene su propia escala de presiones.</desc>
