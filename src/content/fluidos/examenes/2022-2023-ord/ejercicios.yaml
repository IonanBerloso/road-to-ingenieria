            <text class="exflu2223o9-curvas-n" x="300" y="161.7" text-anchor="start" fill="var(--ink)">242; 9,5</text>
          </svg>
        veredicto: |
          Si tu dibujo tiene los cinco puntos, la parte gráfica del apartado a)
          está; el texto que la acompaña es el primer párrafo de la resolución.
          Es el procedimiento de la práctica 25 del guion, la obtención de la
          curva característica de una bomba en el banco.

      - tipo: calcular
        titulo: El coeficiente de Hazen-Williams
        pregunta: |
          Para tubería de acero galvanizado de 250 mm, ¿qué $C_{HW}$ da el
          cuadro n.º 25?
        respuesta:
          tipo: numero
          valor: '130'
          tolerancia: 1
          formato: un número
        distractores:
          - valor: '140'
            mensaje: |
              Esa es la banda siguiente,
              $1{,}5\cdot 10^{-5} < \varepsilon/D \le 2\cdot 10^{-4}$. Aquí
              $\varepsilon = 0{,}015$ cm y $D = 250$ mm, así que
              $\varepsilon/D = 6\cdot 10^{-4}$ y cae en la de 130.
          - valor: '120'
            mensaje: |
              Esa es la banda $10^{-3} < \varepsilon/D \le 4\cdot 10^{-3}$, y
              haría falta una tubería más estrecha o más rugosa. Con
              $6\cdot 10^{-4}$ todavía estamos en la de 130.
        pista: |
          El cuadro n.º 25 asigna el coeficiente por **bandas de rugosidad
          relativa**, no por material. Hay que calcular $\varepsilon/D$
          primero.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{0{,}00015}{0{,}25}
          = 6\cdot 10^{-4}
          $$

          que cae en la banda
          $2\cdot 10^{-4} < \varepsilon/D \le 10^{-3}$, a la que el cuadro
          asigna $C_{HW} = 130$.

      - tipo: calcular
        titulo: El término de rozamiento de la curva
        pregunta: |
          Escrita como $h = a\cdot 10^{-4}\,Q^{1{,}852} + b\cdot 10^{-4}\,Q^{2}$
          con $Q$ en l/s, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1.267'
          tolerancia: 0.008
          formato: un número
        distractores:
          - valor: '1.237'
            mensaje: |
              Te has dejado la válvula. Su longitud equivalente es 1 m, así
              que la longitud total no es $10+5+25 = 40$ sino **41** m.
          - valor: '1.469'
            mensaje: |
              Has usado $C_{HW} = 120$. Con $\varepsilon/D = 6\cdot 10^{-4}$
              la banda del cuadro es la de 130, y el coeficiente entra
              elevado a $1{,}852$, así que un salto de banda mueve el
              resultado un 16 %.
        pista: |
          $J_1 = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D_{mm}^{4{,}87})$, y la
          longitud incluye la equivalente de la válvula.
        desarrollo: |
          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}
          {130^{1{,}852}\cdot 250^{4{,}87}}
          = 3{,}094\cdot 10^{-6}
          $$
          $$
          h_f = J_1\,L\,Q^{1{,}852} = 3{,}094\cdot 10^{-6}\cdot 41\,Q^{1{,}852}
          = 1{,}267\cdot 10^{-4}\,Q^{1{,}852}
          $$

      - tipo: calcular
        titulo: El término del filtro
        pregunta: |
          Y en la misma expresión, ¿cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '1.059'
          tolerancia: 0.008
          formato: un número
        distractores:
          - valor: '0.212'
            mensaje: |
              Has olvidado el factor $k = 5$ del filtro. Ese $0{,}212$ es la
              altura cinética sola.
          - valor: '105.9'
            mensaje: |
              Te has dejado el paso de litros por segundo a metros cúbicos
              por segundo. Como el caudal va al cuadrado, el error es de
              $10^{6}$ y aquí se ve como un factor 100 tras sacar el
              $10^{-4}$.
        pista: |
          $k\,v^{2}/2g$ con $v = Q/A$ y $A = \pi\,0{,}25^{2}/4$, con $Q$ en
          l/s.
        desarrollo: |
          $$
          A = 0{,}049087\ \text{m}^{2}
          \qquad
          v = \frac{Q/1000}{0{,}049087} = 2{,}0372\cdot 10^{-2}\,Q
          $$
          $$
          k\,\frac{v^{2}}{2g} = 5\,\frac{(2{,}0372\cdot 10^{-2})^{2}}{19{,}6}\,Q^{2}
          = 1{,}059\cdot 10^{-4}\,Q^{2}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) en papel: la curva de la instalación deducida, desde
          el balance entre los dos extremos hasta la expresión con sus
          coeficientes. El enunciado pide la «expresión analítica», en negrita,
          y el resultado impreso la da en la forma
          $H_{mi} = a\,Q^{1{,}852} + b\,Q^{2}$, sin término independiente:
          escribe también por qué no lo tiene.
        rubrica: curva-caracteristica-de-la-instalacion
        veredicto: |
          Si en tu folio están los puntos que la rúbrica marca como mínimos,
          tienes la curva que se corta con la bomba en el c) y la que no cambia
          en el d). El término independiente es cero porque el agua sale del
          depósito y vuelve a él: escrito así, con su porqué, el apartado d)
          está contestado antes de llegar a él.

      - tipo: calcular
        titulo: El punto de funcionamiento
        pregunta: |
          ¿Qué caudal circula, en l/s?
        respuesta:
          tipo: magnitud
          valor: '242.04 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '272 l/s'
            mensaje: |
              Te has dejado el filtro. Su término, $1{,}059\cdot 10^{-4}Q^{2}$,
              es de hecho el **mayor** de los dos a este caudal: 6,20 m
              frente a 3,30 del rozamiento.
          - valor: '256.5 l/s'
            mensaje: |
              Te has dejado el rozamiento de las tuberías y has cruzado la
              bomba solo con el filtro.
        pista: |
          Igualar la curva de la bomba con la de la instalación y resolver
          por tanteo, porque el exponente $1{,}852$ no deja despejar.
        desarrollo: |
          $$
          30 - 3{,}5\cdot 10^{-4}Q^{2}
          = 1{,}267\cdot 10^{-4}Q^{1{,}852} + 1{,}059\cdot 10^{-4}Q^{2}
          $$

          Tanteando, en $Q = 242{,}04$ l/s los dos lados valen $9{,}50$ m.

      - tipo: calcular
        titulo: La altura del punto de funcionamiento
        pregunta: |
          ¿Y qué altura manométrica da la bomba ahí, en metros?
        respuesta:
          tipo: magnitud
          valor: '9.496 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '20.5 m'
            mensaje: |
              Ese es el término que **resta** en la curva de la bomba,
              $3{,}5\cdot 10^{-4}Q^{2}$, no la altura. Hay que restarlo de
              los 30 m de altura a caudal nulo.
          - valor: '30 m'
            mensaje: |
              Esa es la altura a caudal cero, el punto donde la bomba
              trabajaría con la válvula cerrada del todo. Con 242 l/s
              circulando le quedan 9,5.
        pista: |
          Sustituir el caudal en cualquiera de las dos curvas.
        desarrollo: |
          $$
          H_m = 30 - 3{,}5\cdot 10^{-4}\cdot 242{,}04^{2}
          = 30 - 20{,}504 = 9{,}496\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              El agua sale del depósito y vuelve al mismo depósito, así que el
              origen y el destino son el mismo punto.
          - texto: >-
              Al presurizarlo, la presión sube igual en el punto de salida y
              en el de llegada, y en la ecuación de la instalación se resta
              consigo misma.
          - texto: >-
              La curva de la instalación no cambia, ni tampoco la de la bomba,
              así que el punto de funcionamiento se queda donde estaba.
          - texto: >-
              Aun así conviene presurizar, porque el caudal no cambia pero la
              bomba tiene que dar más altura.
            trampa: true
            mensaje: |
              La bomba da exactamente la misma altura: 9,496 m, la que hace
              falta para vencer las pérdidas. Lo único que sí cambia
              presurizar —y no es poco— es el **NPSH disponible** en la
              aspiración, que sube 12 metros y aleja la cavitación. Pero eso
              es otra pregunta, y el punto de funcionamiento no se mueve.

      - tipo: reconocer
        pregunta: |
          El apartado e) pide dónde **instalar** la bomba para que no cavite.
          ¿Qué condición de NPSH se usa?
        opciones:
          - texto: >-
              $NPSH_{\text{disp}} > 1{,}3\cdot NPSH_{\text{req}}$: es el
              criterio de diseño, con un margen de seguridad
            correcta: true
            mensaje: |
              Eso es. La diapositiva 21 del tema 25 distingue dos casos: con la
              instalación **en funcionamiento**, basta
              $NPSH_{\text{disp}} > NPSH_{\text{req}}$ para saber si cavita;
              al **diseñarla** se adopta una carga de seguridad,
              $NPSH_{\text{disp}} > 1{,}3\cdot NPSH_{\text{req}}$. Elegir la
              cota de la bomba es diseñar, y la diapositiva 22 hace esta misma
              cuenta con el 1,3.
          - texto: >-
              $NPSH_{\text{disp}} > NPSH_{\text{req}}$, porque es la condición
              para que no cavite
            mensaje: |
              Es la condición para una instalación que ya funciona: dice si
              cavita o no. Aquí se decide dónde ponerla, y para eso el curso
              pide margen, el 1,3 de la diapositiva 21. Sin él la bomba sube a
              15,52 m, un metro más de lo que publica el examen.
          - texto: >-
              $NPSH_{\text{disp}} = 0$, que es cuando el agua empieza a hervir
            mensaje: |
              El NPSH disponible es lo que le sobra al agua por encima de la
              presión de vapor a la entrada de la bomba, y tiene que cubrir lo
              que pide la bomba, el requerido, que no es cero. Con cero la
              bomba iría a 19 m y cavitaría.

      - tipo: calcular
        titulo: Las pérdidas de la aspiración
        pregunta: |
          En el punto de funcionamiento del apartado c), ¿cuánto se pierde en
          la tubería de aspiración, en metros?
        respuesta:
          tipo: magnitud
          valor: '0.804 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '3.297 m'
            mensaje: |
              Has usado los 41 m de toda la tubería. La aspiración es solo
              $L_1$, los 10 m que van del depósito a la bomba: lo demás está
              detrás de la bomba y no entra en el NPSH disponible.
          - valor: '0.884 m'
            mensaje: |
              Has sumado el metro equivalente de la válvula. La válvula V va
              detrás de la bomba, en la impulsión: en la aspiración solo están
              los 10 m de $L_1$.
        pista: |
          $h_f = J_1\,L_1\,Q^{1{,}852}$, con el $J_1$ del apartado b) y
          $Q = 242{,}04$ l/s.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 3{,}094\cdot 10^{-6}\cdot 10\cdot 242{,}04^{1{,}852}
          = 0{,}804\ \text{m}
          $$

      - tipo: calcular
        titulo: La cota máxima de la turbobomba
        pregunta: |
          ¿A qué cota máxima se puede instalar la turbobomba, en metros? La
          lámina del depósito está a la cota 10.
        respuesta:
          tipo: magnitud
          valor: '14.47 m'
          tolerancia: 0.005
          formato: una cota, con su unidad
        distractores:
          - valor: '15.52 m'
            mensaje: |
              Te has quedado en $NPSH_{\text{disp}} = NPSH_{\text{req}}$, sin
              margen. Eso sirve para comprobar una instalación que ya
              funciona; para decidir dónde se instala la bomba se diseña con
              $1{,}3\cdot NPSH_{\text{req}}$, que son $0{,}3\cdot 3{,}5 = 1{,}05$
              m menos.
          - valor: '4.47 m'
            mensaje: |
              Esa es la altura de la bomba sobre la lámina del depósito, no su
              cota. La lámina está a la cota 10, y el enunciado pregunta la
              cota.
          - valor: '5.78 m'
            mensaje: |
              Has metido en la aspiración todas las pérdidas del circuito, los
              9,50 m del punto de funcionamiento. En el NPSH disponible solo
              entran las que hay entre el depósito y la bomba: 0,80 m.
        pista: |
          El NPSH disponible,
          $p_{\text{atm}}/\gamma - p_v/\gamma + z_{\text{lámina}} - z_{\text{bomba}} - h_{f,\text{asp}}$,
          igualado a $1{,}3\cdot NPSH_{\text{req}}$. Con $g = 9{,}8$, un kg/cm²
          son 10 m de columna de agua.
        desarrollo: |
          $$
          \frac{p_{\text{atm}}}{\gamma} = \frac{0{,}97\cdot 101\,325}{9800}
          = 10{,}029\ \text{m}
          \qquad
          \frac{p_v}{\gamma} = \frac{2000}{9800} = 0{,}204\ \text{m}
          \qquad
          NPSH_{\text{req}} = 3{,}5\ \text{m}
          $$
          $$
          z_{\text{max}} = 10 + 10{,}029 - 0{,}204 - 0{,}804 - 1{,}3\cdot 3{,}5
          = 14{,}47\ \text{m}
          $$

          Que es lo impreso. Sin el 1,3 saldrían 15,52 m.
    resolucion: |
      **a) Determinar la curva de la bomba variando la de la instalación.** Se
      actúa sobre la **válvula V**, que es el único elemento regulable. Con la
      bomba en marcha se va cerrando la válvula por pasos; cada posición
      cambia la curva de la instalación —la hace más empinada— y el punto de
      funcionamiento se desplaza a lo largo de la curva de la bomba, que no se
      mueve. En cada posición se anota la pareja de valores.

      Se miden dos cosas. El **caudal**, con un caudalímetro en la línea —un
      venturímetro, un rotámetro o un electromagnético—. Y la **altura
      manométrica**, con dos manómetros, uno en la aspiración y otro en la
      impulsión de la bomba, restando sus lecturas y corrigiendo la diferencia
      de cotas y de alturas cinéticas si los diámetros no son iguales.

      Llevando las parejas $(Q, H_m)$ a un diagrama se obtiene, punto a punto,
      la curva característica de la bomba. Gráficamente: un haz de parábolas
      de instalación cada vez más empinadas, todas partiendo del origen porque
      el circuito es cerrado, y la curva de la bomba es **la línea que une los
      cortes**.

      **b) La curva de la instalación.** Circuito cerrado, luego
      $H_{geo} = 0$. Longitud total $10+5+25 = 40$ m más el metro equivalente
      de la válvula, 41 m. Con $\varepsilon = 0{,}015$ cm y $D = 250$ mm,
      $\varepsilon/D = 6\cdot 10^{-4}$, que en el cuadro n.º 25 cae en la
      banda de $C_{HW} = 130$:

      $$
      J_1 = \frac{1{,}2117\cdot 10^{10}}{130^{1{,}852}\,250^{4{,}87}}
      = 3{,}094\cdot 10^{-6}
      $$
      $$
      H_{mi} = 1{,}267\cdot 10^{-4}\,Q^{1{,}852}
      + 1{,}059\cdot 10^{-4}\,Q^{2}
      \qquad (\text{mca}; \text{l/s})
      $$

      donde el segundo sumando es el filtro, $k\,v^{2}/2g$ con $k = 5$.

      **c) El punto de funcionamiento.** Igualando con la curva de la bomba y
      tanteando —el exponente $1{,}852$ no deja despejar—:

      $$
      Q = 242{,}04\ \text{l/s}
      \qquad
      H_m = 9{,}496\ \text{m}
      $$

      Merece la pena mirar el reparto: de esos 9,5 metros, **6,20 se los lleva
      el filtro** y solo 3,30 el rozamiento de los 41 metros de tubería. Un
      accesorio con $k = 5$ pesa más que toda la conducción.

      **d) Presurizar el depósito.** No cambia nada. El agua sale del depósito
      y vuelve al mismo depósito, así que la presión aparece con el mismo
      valor en los dos extremos de la ecuación de la instalación y se cancela.
      La curva de la instalación es idéntica, la de la bomba también, y el
      punto de funcionamiento se queda en $242{,}04$ l/s y $9{,}496$ m.

      Lo que sí cambia —y por eso se presurizan los circuitos cerrados de
      verdad— es el NPSH disponible en la aspiración, que sube en los
      $1{,}2\ \text{kg/cm}^{2}$, es decir 12 metros. Pero eso afecta a la
      cavitación, no al punto de funcionamiento.

      **e) La cota máxima de la bomba.** Es la cuenta de la diapositiva 22
      del tema 25. El NPSH disponible depende de la instalación; el
      requerido, de la bomba. Y como aquí se decide dónde instalarla —se
      diseña, no se comprueba una instalación que ya funciona—, se exige el
      margen de la diapositiva 21:
      $NPSH_{\text{disp}} > 1{,}3\cdot NPSH_{\text{req}}$. La lámina está
      a la cota 10, y en la aspiración
      solo están los 10 m de $L_1$, recorridos por el caudal del apartado c):

      $$
      h_{f,\text{asp}} = 3{,}094\cdot 10^{-6}\cdot 10\cdot 242{,}04^{1{,}852}
      = 0{,}804\ \text{m}
      $$
      $$
      \frac{p_{\text{atm}}}{\gamma} - \frac{p_v}{\gamma} + 10 - z
      - h_{f,\text{asp}} = 1{,}3\cdot NPSH_{\text{req}}
      $$
      $$
      10{,}029 - 0{,}204 + 10 - z - 0{,}804 = 1{,}3\cdot 3{,}5
      \;\Longrightarrow\;
      z_{\text{max}} = 14{,}47\ \text{m}
      $$

      Que es lo que publica el examen. Sin el 1,3 salen 15,52 m, y la
      diferencia, 1,05 m, es justo $0{,}3\cdot NPSH_{\text{req}}$: con la
      instalación funcionando basta
      $NPSH_{\text{disp}} > NPSH_{\text{req}}$ para saber si cavita, pero
      para decidir a qué cota se pone la bomba se deja el margen. El tema 25
      lo cuenta en [Cavitación y NPSH](/road-to-ingenieria/fluidos/t25-bombeo/#cavitación-y-npsh).

