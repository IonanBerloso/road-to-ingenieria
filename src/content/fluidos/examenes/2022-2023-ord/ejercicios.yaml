ejercicios:
  # ── 1 (10 %) · Micromanómetro de dos líquidos inmiscibles. El aparato que
  #    multiplica por diez la lectura de un piezómetro de agua.
  - id: exflu2223-ord-1-el-micromanometro-de-dos-liquidos
    titulo: El micromanómetro que multiplica la lectura por diez
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 1 de junio de 2023 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un micromanómetro de líquidos inmiscibles está formado por dos depósitos
      abiertos a la atmósfera, unidos mediante un tubo en U. Dicho
      micromanómetro contiene dos líquidos manométricos cuyas densidades
      relativas son $s_1 = 1$ y $s_2 = 0{,}9$, respectivamente. Se pide:

      **a)** Representar esquemáticamente la situación inicial del
      micromanómetro, cuando los dos depósitos están abiertos a la atmósfera.

      **b)** Si el menisco de separación se desplaza 5 cm, calcular el
      incremento de presión (mm.c.a) que se habrá producido en uno de los
      depósitos. La sección de los depósitos es muy grande frente a la del
      tubo. Representar esquemáticamente la situación final del
      micromanómetro.

      **c)** Calcular el grado de sensibilidad del micromanómetro.
    pide: El incremento de presión que corresponde a 5 cm de menisco, y la sensibilidad del aparato.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las secciones de los dos depósitos son **muy grandes** frente a la
          del tubo. ¿Para qué sirve esa hipótesis?
        opciones:
          - texto: >-
              Para poder suponer que los niveles de los depósitos no se mueven,
              y que todo el desplazamiento ocurre en el tubo
            correcta: true
            mensaje: |
              Eso es. El volumen que recorre el menisco a lo largo del tubo
              repartido sobre una sección grande es una bajada de nivel
              despreciable, así que las dos superficies libres se quedan
              donde estaban y la única incógnita es el menisco.
          - texto: >-
              Para que la presión sea la misma en los dos depósitos
            mensaje: |
              La presión de los dos depósitos es justamente lo que se quiere
              diferenciar. Lo que la hipótesis congela son los **niveles**,
              no las presiones.
          - texto: >-
              Para que los dos líquidos no se mezclen
            mensaje: |
              Que no se mezclen es que son **inmiscibles**, y eso es un dato
              aparte que da nombre al aparato. La sección grande no tiene
              nada que ver con la miscibilidad.

      - tipo: calcular
        titulo: El incremento de presión
        pregunta: |
          Con el menisco desplazado $5\ \text{cm}$, ¿cuántos milímetros de
          columna de agua ha subido la presión de ese depósito?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.05
          formato: un número en mm de columna de agua
        distractores:
          - valor: '50'
            mensaje: |
              Has dado el desplazamiento del menisco, no la presión. Los
              50 mm de recorrido equivalen a **5** mm de columna de agua, y
              esa reducción de diez a uno es precisamente lo que hace útil
              al aparato.
          - valor: '45'
            mensaje: |
              Parece que has multiplicado por $s_2 = 0{,}9$ en vez de por la
              **diferencia** $s_1 - s_2 = 0{,}1$. El líquido ligero no empuja
              solo: compite con el pesado, y lo que queda es la resta.
          - valor: '95'
            mensaje: |
              Has sumado las dos densidades relativas en vez de restarlas. Al
              subir el menisco, una columna de $s_1$ sustituye a una columna
              de $s_2$, así que lo que se gana es la **diferencia** de pesos
              específicos.
        pista: |
          Al desplazarse el menisco, una columna de líquido pesado sustituye
          a una de líquido ligero en la misma altura. Lo que cambia es
          $\gamma_1 - \gamma_2$.
        desarrollo: |
          $$
          \Delta p = d\,(\gamma_1-\gamma_2)
          = 0{,}05\,(9800-8820) = 49\ \text{Pa}
          $$
          $$
          \frac{\Delta p}{\gamma_{ag}} = \frac{49}{9800}
          = 0{,}005\ \text{m} = 5\ \text{mm.c.a}
          $$

      - tipo: dibujar
        consigna: |
          Los dos esquemas que piden los apartados a) y b), uno al lado del
          otro y a la misma escala: el micromanómetro con los dos depósitos
          abiertos a la atmósfera, y el mismo aparato cuando la presión de uno
          de los depósitos ha subido y el menisco de separación se ha
          desplazado 5 cm. Los dos líquidos, distinguidos.
        comprueba:
          - punto: >-
              Una sola interfaz, dentro de uno de los tubos: el líquido de
              $s_1 = 1$ en su depósito y en el fondo de la U, y el de
              $s_2 = 0{,}9$ en su depósito y en su tubo, hasta el menisco.
            porque: >-
              Es lo que hace inmiscibles a los dos líquidos y lo que da la
              lectura: el menisco de separación es lo único que se mueve. Con
              los dos líquidos mezclados en la U, o con una interfaz en cada
              rama, el aparato dibujado es otro.
          - punto: >-
              En el dibujo inicial, la columna de $s_2$ sobre la interfaz más
              alta que la de $s_1$, en la proporción $h_2 = h_1/0{,}9$.
            porque: >-
              Con los dos depósitos abiertos, las dos columnas pesan lo mismo a
              la altura de la interfaz, $\gamma_1 h_1 = \gamma_2 h_2$, y el
              líquido ligero necesita más altura. Las dos superficies libres a
              la misma cota son un aparato que no está en equilibrio.
          - punto: >-
              En el dibujo final, la sobrepresión sobre uno de los depósitos y
              el menisco desplazado 5 cm a lo largo del tubo, alejándose de ese
              depósito, con la posición inicial marcada.
            porque: >-
              Los 5 cm son la lectura, y sin la posición de partida no se ve
              desde dónde se miden. En la figura la sobrepresión va sobre el
              depósito de $s_2$ y el menisco baja por su tubo; sobre el de
              $s_1$ subiría por el mismo tubo. Las dos valen: el enunciado dice
              «en uno de los depósitos».
          - punto: >-
              Los niveles de los depósitos, iguales en los dos dibujos.
            porque: >-
              Es la hipótesis impresa en el apartado b): «la sección de los
              depósitos es muy grande frente a la del tubo». El volumen que
              recorre el menisco se reparte en una sección grande y los niveles
              no se mueven de forma apreciable; por eso la presión sale solo de
              $d$ y de $\gamma_1 - \gamma_2$.
          - punto: >-
              Depósitos anchos y tubo estrecho, que se vea la diferencia de
              secciones.
            porque: >-
              Esa diferencia es la que justifica el punto anterior. Dibujados
              del mismo ancho, el dibujo contradice la hipótesis que usa la
              cuenta.
        figura: |
          <svg viewBox="0 0 400 350" role="img" width="400" height="350" aria-labelledby="exflu2223o1-mic-t exflu2223o1-mic-d">
            <title id="exflu2223o1-mic-t">El micromanómetro de líquidos inmiscibles del ejercicio 1: a la izquierda con los dos depósitos abiertos, a la derecha con la sobrepresión que baja la interfaz 5 cm</title>
            <desc id="exflu2223o1-mic-d">Dos dibujos del mismo aparato, a la misma escala. En cada uno, dos depósitos anchos unidos por un tubo estrecho en U. El de la izquierda contiene el líquido de densidad relativa 1, que llena también el fondo de la U y sube por el tubo de la derecha; el de la derecha contiene el de densidad relativa 0,9, que baja por su tubo hasta la interfaz. En el dibujo a), con los dos depósitos abiertos, la columna de s = 1 sobre la interfaz mide 18 centímetros y la de s = 0,9 mide 20, más alta porque pesa menos. En el dibujo b), una sobrepresión de 5 milímetros de columna de agua, 49 pascales, actúa sobre el depósito del líquido de 0,9, y la interfaz ha bajado 5 centímetros por su tubo, desde la posición de antes, marcada con trazos. Los niveles de los depósitos no se mueven, porque su sección es muy grande frente a la del tubo. Las alturas de las columnas son elegidas: el enunciado no las da.</desc>
