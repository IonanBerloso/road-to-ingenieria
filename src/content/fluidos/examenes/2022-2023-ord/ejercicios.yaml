      <figcaption>

      El circuito del ejercicio, redibujado: sale del depósito, pasa por la bomba, la válvula V y el filtro F, y vuelve al depósito por abajo.

      </figcaption>
      </figure>

      **Notas nuestras.** En la figura del cuadernillo la lámina del depósito
      está marcada con la cota 10, y la bomba va en la tubería de arriba, por
      encima de ella. La válvula V está detrás de la bomba, en la impulsión:
      la aspiración es solo la tubería 1.
    pide: La curva de la instalación, el punto de funcionamiento, el efecto de presurizar y la cota máxima de la bomba.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua sale del depósito y vuelve al mismo depósito. ¿Qué tiene de
          particular la curva de la instalación?
        opciones:
          - texto: >-
              Que no tiene altura geométrica: arranca en el origen, porque
              toda la altura manométrica se gasta en pérdidas
            correcta: true
            mensaje: |
              Eso es. Origen y destino son el mismo punto, con la misma cota
              y la misma presión, así que $H_{geo} = 0$ y la curva es
              $H = \sum h_f$, que pasa por $(0,0)$. Es la firma de un
              circuito cerrado.
          - texto: >-
              Que las pérdidas se anulan al volver al punto de partida
            mensaje: |
              Las pérdidas nunca se anulan: son energía degradada, y van
              siempre en el mismo sentido. Lo que se anula es el término de
              **altura geométrica**, que sí depende del punto de partida y
              del de llegada.
          - texto: >-
              Que la bomba no hace falta
            mensaje: |
              Hace toda la falta: es lo único que compensa las pérdidas. Sin
              ella el agua se pararía. Lo que ocurre es que su trabajo se va
              entero en rozamiento y no en subir el agua.

      - tipo: dibujar
        consigna: |
          La representación gráfica que pide el apartado a), en unos ejes
          $H_m$–$Q$ (m; l/s): varias curvas de la instalación, una por cada
          posición de la válvula V, sus cortes con la curva de la bomba, y la
          curva de la bomba sacada de esos cortes. Con los datos de los
          apartados b) y c) sale a escala; sin ellos, cualitativa.
        comprueba:
          - punto: >-
              Lo único que se toca es la válvula V, y se va cerrando por
              pasos.
            porque: >-
              Es el único elemento regulable de la instalación, y el enunciado
              pide en negrita «los elementos de la instalación sobre los que se
              deberá actuar». La bomba no se toca: su curva es lo que se quiere
              medir.
          - punto: >-
              Las curvas de la instalación saliendo todas del origen, cada vez
              más empinadas al cerrar V.
            porque: >-
              El circuito sale del depósito y vuelve a él, así que el término
              independiente es cero; cerrar la válvula sube el coeficiente de
              $Q^{2}$, no el término independiente. Curvas que suben en
              paralelo son lo que pasaría en una instalación con dos depósitos
              al subir o presurizar el de llegada, no al cerrar una válvula; y
              en esta, con uno solo, ni eso: es el apartado d).
          - punto: >-
              Un punto por cada posición de la válvula: el primero con V
              abierta, 242 l/s y 9,5 m con los datos del apartado c), y los
              demás hacia caudales menores.
            porque: >-
              Con V abierta la instalación es la del apartado b) y el corte es
              el punto de funcionamiento. Cerrando, el punto recorre la curva
              de la bomba hacia la izquierda, hacia los 30 m a caudal nulo. Más
              allá de 242 l/s no se llega sin quitar pérdidas, y en esta
              instalación no hay ninguna que quitar.
          - punto: >-
              La curva de la bomba dibujada al final, uniendo los puntos.
            porque: >-
              Es el método: la curva no se conoce de antemano, sale de los
              cortes. Dibujarla primero y marcar encima los puntos es dibujar
              el apartado c), no el a).
          - punto: >-
              Los ejes con lo que se mide: $Q$, con un caudalímetro en la línea,
              y $H_m$, con el vacuómetro de la aspiración y el manómetro de la
              impulsión.
            porque: >-
              El enunciado pide «cómo y con qué instrumento», en negrita. La
              altura manométrica es la diferencia de las dos lecturas en metros
              de agua, corregida con la diferencia de cotas de las tomas y de
              alturas cinéticas si no son iguales.
        figura: |
          <svg viewBox="0 0 380 290" role="img" width="380" height="290" aria-labelledby="exflu2223o9-curvas-t exflu2223o9-curvas-d">
            <title id="exflu2223o9-curvas-t">Cómo se saca la curva de la bomba variando la de la instalación: cinco curvas de la instalación y sus cinco cortes</title>
            <desc id="exflu2223o9-curvas-d">Una gráfica de altura manométrica en metros, de 0 a 32, frente al caudal en litros por segundo, de 0 a 300. Cinco curvas de la instalación del ejercicio 9, todas saliendo del origen porque el circuito es cerrado: la de la válvula V abierta del todo, la más tendida, que llega a 9,5 metros en 242 litros por segundo, y cuatro más, cada vez más empinadas, que son la misma instalación con la válvula más cerrada. Cada una marca un punto: 242, 200, 150, 100 y 50 litros por segundo, con 9,5, 16, 22,1, 26,5 y 29,1 metros. Una curva de trazos une los cinco puntos y llega a 30 metros con caudal nulo: es la curva característica de la bomba, 30 − 3,5·10⁻⁴·Q², que es lo que se busca. Cada punto se mide con el caudalímetro, para Q, y con el vacuómetro y el manómetro de la bomba, para la altura.</desc>
