# **Los nueve ejercicios**, reconstruidos hasta aterrizar en el resultado
# impreso. Del cuadernillo «Exámenes 2020-2025» del departamento.
#
# Porcentajes impresos: 10 / 10 / 15 / 10 / 10 / 10 / 5 / 15 / 15, sin
# reparto por competencia, así que van sin `puntos`.
#
# **Con una excepción declarada dentro del ejercicio 9**, y queda dicha
# aquí también. Su apartado e) pide la cota máxima de la turbobomba con
# NPSH requerido de 0,35 kg/cm², atmósfera de 0,97 atm y tensión de vapor
# de 20 mbar. Con esos datos y las pérdidas de la aspiración calculadas
# por Hazen-Williams sale $z \le 15{,}52$ m, y el examen publica 14,47.
# La diferencia son 1,05 m y no se ha encontrado la lectura que la
# explique: ni restando la altura cinética (14,28), ni con la atmósfera
# en bar (15,39), ni cambiando la banda del coeficiente (15,39). Los
# otros cuatro apartados salen exactos, así que el ejercicio se publica
# **sin** ese apartado y con el hueco dicho. §13 caso 2.
#
# Lo que este examen aporta al corpus:
#
# - **Un tramo circular con un fluido a cada lado** (ej. 3), y los dos
#   empujan en el mismo sentido: el de la izquierda porque presiona y el
#   de la derecha porque **succiona**. Es el primer ejercicio del corpus
#   donde el plano de cargas cae por debajo de la superficie estudiada y
#   las fuerzas cambian de signo.
# - **Compresibilidad con la fórmula exponencial** (ej. 4): la lineal da
#   0,440 l y la exacta 0,429, y a 3.050 bar la diferencia ya se ve. Y el
#   remate: el agujero mide 0,429 l pero hay que comprar 0,452.
# - **Un venturímetro que dice hacia dónde va el fluido** (ej. 5) antes de
#   decir cuánto: la línea piezométrica solo puede bajar en el sentido del
#   flujo, y eso decide la dirección sin más datos.
# - **Una red con tres tuberías y un depósito que alimenta** (ej. 8): el
#   depósito B, presurizado, no recibe caudal sino que lo aporta, y la
#   boquilla se lleva la suma de los dos.
# - **Un circuito cerrado** (ej. 9), donde presurizar el depósito no
#   cambia nada porque es a la vez origen y destino.
