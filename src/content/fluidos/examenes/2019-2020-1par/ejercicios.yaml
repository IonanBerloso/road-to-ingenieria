        <desc id="fp5d">Un tanque cerrado con forma de T. La parte de arriba,
        entre las cotas noventa centímetros y metro cuarenta, tiene sección
        cuadrada de lado L. La de abajo, por debajo de los noventa centímetros,
        es un tubo de sección circular de diámetro D que baja hasta la cota
        cero, donde hay un orificio de diámetro d mucho menor. El agua llega
        inicialmente hasta la cota metro veinte, así que por encima queda una
        cámara de aire atrapado.</desc>

