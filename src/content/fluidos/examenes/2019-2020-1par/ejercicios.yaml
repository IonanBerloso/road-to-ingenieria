ejercicios:
  # ── 1 (18 %) · El aire del que se extrae la mitad y se calienta. La
  #    trampa está en qué significa «el doble de la temperatura».
  - id: exflu1920-1par-1-el-aire-que-se-calienta-a-medio-llenar
    titulo: Media masa de aire al doble de temperatura, y qué doble es ese
    fuente: >-
      Ejercicio 1 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Inicialmente se tiene un recipiente cerrado rígido que contiene
      $m_0 = 5{,}6$ kg de aire a una presión absoluta de $P_0 = 9{,}6$ bar y
      una temperatura de $T_0 = 25$ ºC. Se extrae la mitad de la masa de aire
      y se calienta la masa restante ($m_1 = m_0/2$) hasta el doble de la
      temperatura inicial ($T_1 = 2\cdot T_0$). Se conocen los siguientes
      datos del aire: $P_{atm} = 10{,}3$ m.c.a. y la constante
      $R_{aire} = 287\ \text{N}\cdot\text{m/(kg}\cdot\text{K)}$. Se pide:

      **a)** Calcular el volumen del recipiente (m³) y la densidad del aire en
      el instante inicial ($t_0$).

      **b)** Calcular la presión manométrica del aire (kg/cm²) en el instante
      final ($t_1$).

      En el extremo superior del recipiente hay un pistón. Se acciona el
      pistón hacia abajo hasta que el volumen del recipiente se reduce un
      15%. La variación de presión producida es de 225 kPa. Ambas
      variaciones son respecto a las condiciones del instante $t_1$. Se pide:

      **c)** Calcular el módulo de elasticidad volumétrico del aire (MPa).

      **Notas nuestras.** El ejercicio no trae figura. *El impreso escribe
      «10.3 m.c.a.» con punto decimal; va con coma.*
    pide: El volumen y la densidad iniciales, la presión final y el módulo de elasticidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice $T_1 = 2\,T_0$ con $T_0 = 25$ ºC. ¿Qué temperatura
          es esa?
        opciones:
          - texto: >-
              50 ºC, es decir 323 K; el doble se aplica al número que da el
              enunciado y **después** se pasa a absolutos
            correcta: true
            mensaje: |
              Eso es lo que hace el examen, y es lo que hay que ver. «El doble
              de la temperatura inicial» se refiere al dato tal como está
              escrito: 25 ºC. Después, para meterlo en la ley de los gases,
              hay que pasarlo a kelvin. Duplicar los 298 K daría 596 y una
              presión más del doble.
          - texto: >-
              596 K, porque la ley de los gases exige temperaturas absolutas
            mensaje: |
              La ley las exige, sí, pero eso no significa que «el doble de
              25 ºC» sean 596 K. Con esa lectura la presión final sale 8,77
              kg/cm² en vez de 4,279, y no es lo que publica el examen.
          - texto: >-
              Da igual: la presión no depende de la escala de temperatura
            mensaje: |
              Depende, y mucho. La ley de los gases es lineal en la
              temperatura **absoluta**, así que un factor 2 sobre grados
              Celsius y un factor 2 sobre kelvin son dos operaciones
              distintas y dan resultados distintos.

      - tipo: calcular
        titulo: El volumen del recipiente
        pregunta: |
          ¿Qué volumen tiene el recipiente, en m³?
        respuesta:
          tipo: numero
          valor: '0.499'
          tolerancia: 0.005
          formato: un número en metros cúbicos
        distractores:
          - valor: '5.6'
            mensaje: |
              Esa es la masa de aire, en kilogramos. El volumen sale de la ley
              de los gases con la presión y la temperatura absolutas.
          - valor: '0.0499'
            mensaje: |
              Te has dejado un factor diez. Comprueba el paso de bares a
              pascales: 9,6 bar son $9{,}6\cdot 10^{5}$ Pa.
        pista: |
          $pV = mRT$, con $T_0 = 298$ K y la presión **absoluta**.
        desarrollo: |
          $$
          V = \frac{m\,R\,T}{p} = \frac{5{,}6\cdot 287\cdot 298}{9{,}6\cdot 10^{5}}
          = 0{,}499\ \text{m}^{3}
          $$
          $$
          \rho = \frac{5{,}6}{0{,}499} = 11{,}22\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La presión manométrica final
        pregunta: |
          Con la mitad de la masa y el doble de temperatura, ¿cuánto marca un
          manómetro, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '4.279'
          tolerancia: 0.02
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '8.77'
            mensaje: |
              Has duplicado la temperatura **absoluta**, 298 K, en vez del
              dato en grados Celsius. Con 596 K la presión final coincidiría
              con la inicial, 9,6 bar absolutos, y el manómetro marcaría 8,77.
          - valor: '5.31'
            mensaje: |
              Esa es la presión **absoluta**, $520$ kPa. La pregunta pide la
              manométrica, así que hay que descontar la atmósfera: 10,3 mca
              son 100,94 kPa.
        pista: |
          $p_1 = m_1 R T_1/V$ con $T_1 = 50$ ºC $= 323$ K, y después réstale
          la atmósfera.
        desarrollo: |
          $$
          p_1 = \frac{2{,}8\cdot 287\cdot 323}{0{,}499} = 520{,}3\ \text{kPa}
          $$
          $$
          p_{man} = 520{,}3-100{,}94 = 419{,}3\ \text{kPa}
          = 4{,}279\ \text{kg/cm}^{2}
          $$

      - tipo: calcular
        titulo: El módulo de elasticidad volumétrico
        pregunta: |
          ¿Cuánto vale $K$, en MPa?
        respuesta:
          tipo: numero
          valor: '1.38'
          tolerancia: 0.02
          formato: un número en megapascales
        distractores:
          - valor: '1.5'
            mensaje: |
              Has usado la fórmula lineal, $K = \Delta p/(\Delta V/V)$. Un
              15 % de reducción de volumen es demasiado para linealizar: la
              expresión exacta, $\Delta V/V = 1-e^{-\Delta p/K}$, da 1,38.
          - valor: '0.225'
            mensaje: |
              Esos son los 225 kPa en megapascales, es decir la variación de
              presión. Falta dividirla por la variación relativa de volumen.
        pista: |
          $\Delta V/V = 1 - e^{-\Delta p/K}$, con $\Delta V/V = 0{,}15$.
        desarrollo: |
          $$
          0{,}15 = 1-e^{-225000/K}
          \;\Longrightarrow\;
          \frac{225000}{K} = -\ln 0{,}85 = 0{,}16252
          $$
          $$
          K = 1{,}384\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con 5,6 kg a 9,6 bar absolutos y 298 K, el recipiente mide
              0,499 m³ y el aire pesa 11,22 kg/m³.
          - texto: >-
              Con la mitad de masa a 50 ºC —el doble del dato en Celsius— la
              presión absoluta baja a 520 kPa y el manómetro marca 4,279
              kg/cm².
          - texto: >-
              Reducir el volumen un 15 % cuesta 225 kPa, y con la expresión
              exponencial eso da $K = 1{,}38$ MPa.
          - texto: >-
              El módulo de elasticidad del aire es una constante del gas, así
              que ese 1,38 MPa valdría también en el instante inicial.
            trampa: true
            mensaje: |
              En un gas no es una constante: depende de la presión y del
              proceso. Para un gas ideal en compresión isoterma, $K$ **es la
              propia presión**, y en una adiabática es $\gamma$ veces la
              presión; así que en el instante inicial, con 9,6 bar absolutos
              en vez de 520 kPa, el aire sería más rígido. El 1,38 MPa sale
              del dato del enunciado, los 225 kPa para un 15 %, y vale para
              esa compresión. La diferencia con un líquido —donde $K$ sí es
              prácticamente constante y vale gigapascales— es la razón de que
              un gas se comprima y un líquido no.
    resolucion: |
      **a) El recipiente.** Ley de los gases con la presión absoluta y
      $T_0 = 298$ K:

      $$
      V = \frac{5{,}6\cdot 287\cdot 298}{9{,}6\cdot 10^{5}} = 0{,}499\ \text{m}^{3}
      \qquad
      \rho = 11{,}22\ \text{kg/m}^{3}
      $$

      **b) La presión final, y la trampa.** El enunciado dice $T_1 = 2T_0$ con
      $T_0 = 25$ ºC. Eso son **50 ºC**, es decir 323 K: el doble se aplica al
      dato tal como viene, y la conversión a absolutos se hace después, al
      entrar en la ley de los gases. Con la mitad de la masa:

      $$
      p_1 = \frac{2{,}8\cdot 287\cdot 323}{0{,}499} = 520{,}3\ \text{kPa abs}
      $$
      $$
      p_{man} = 520{,}3-100{,}94 = 4{,}279\ \text{kg/cm}^{2}
      $$

      Quien duplique los 298 K obtiene 596 K, y entonces la presión final
      coincide **exactamente** con la inicial —la mitad de masa al doble de
      temperatura absoluta— y el manómetro marcaría 8,77. Es un resultado tan
      redondo que invita a creérselo; por eso conviene fijarse en qué doble
      pide el enunciado.

      **c) El módulo de elasticidad.** Un 15 % de reducción de volumen es
      demasiado para la fórmula lineal:

      $$
      \frac{\Delta V}{V} = 1-e^{-\Delta p/K} = 0{,}15
      \qquad
      K = \frac{225\,000}{-\ln 0{,}85} = 1{,}38\ \text{MPa}
      $$

      La lineal daría 1,5: un 8 % más.

      **Y una comprobación de sensatez.** $1{,}38$ MPa frente a los
      $2{,}2\cdot 10^{3}$ MPa del agua: **mil seiscientas veces menos**. Ese
      número es toda la diferencia entre un gas y un líquido, y es la razón
      de que en hidráulica se hable de fluidos incompresibles sin sonrojarse.

  # ── 2 (20 %) · Un laboratorio submarino, y la profundidad máxima antes de
  #    que el mar entre por el acceso.
  - id: exflu1920-1par-2-el-laboratorio-submarino
    titulo: El laboratorio submarino, y hasta dónde puede bajar
    fuente: >-
      Ejercicio 2 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra el diseño de un laboratorio de observación submarino
      diseñado para situarse en el fondo de un mar poco profundo, estando la
      base del laboratorio a una profundidad de diseño de $Z = 39{,}5$ m. El
      laboratorio tendrá forma de medio cilindro de radio $R = 5{,}8$ m. Tal y
      como muestra la figura, el acceso al laboratorio se hará por una
      conducción horizontal con terminación vertical, y para garantizar que se
      puede acceder de esta forma el aire del laboratorio deberá estar
      presurizado. La altura total del acceso vertical será de $H = 4{,}1$ m.
      Durante el diseño se considerará que la presión atmosférica sobre la
      superficie libre del mar es de 1 atm y el peso específico del agua de
      mar es de $1025\ \text{kg/m}^{3}$. Se pide:

      **a)** Calcular la presión absoluta que deberá tener el aire del
      laboratorio para que la columna de agua del acceso vertical sea de
      $h = 2{,}9$ m.

      **b)** Calcular la presión que indicará el manómetro tipo Bourdon A en
      dicha configuración (kg/cm²).

      **c)** Deducir la profundidad máxima $Z_{\text{máx}}$ permitida para que
      manteniendo la presión del laboratorio antes calculada constante se
      evite derramar agua al interior del laboratorio desde la columna de
      acceso.

      **d)** Considérese que cambia el peso específico del agua de mar.
      Calcular el valor (kg/m³) que debería tomar para que manteniendo fijas
      la presión del aire del laboratorio y la profundidad $Z = 39{,}5$ m, se
      de la condición límite de no derrame descrita en el apartado anterior.

      **Notas nuestras.** La figura, redibujada abajo, dice esto: el mar, con
      $s = 1{,}025$, y $Z$ medida desde su superficie libre hasta la base del
      laboratorio; el medio cilindro apoyado en el fondo, con $R$ de la base a
      la coronación, y en la coronación, por fuera, el manómetro Bourdon A; la
      conducción de acceso entra por el pie del medio cilindro y sube en una
      columna vertical de altura $H$ desde la base, con el agua a la altura $h$
      dentro. *El peso específico va en «kg/m³» porque ese kg es un
      kilopondio: son $1025\cdot 9{,}8$ N/m³, y el resultado del d) se da
      igual. El impreso escribe «se de»; es «se dé».*

      <figure class="figura-examen">
      <svg viewBox="34 20 372 262" role="img" width="440" height="310"
           aria-labelledby="fp2t fp2d">
        <title id="fp2t">El laboratorio submarino de medio cilindro y su columna de acceso</title>
        <desc id="fp2d">Un laboratorio de observación submarina con forma de
        medio cilindro de radio R descansa sobre el fondo del mar, a una
        profundidad Z medida desde la superficie libre. El interior está lleno
        de aire a presión. El acceso se hace por una conducción horizontal que
        llega desde fuera por el fondo, entra por el pie del medio cilindro y
        termina en una columna vertical de altura total H que sube dentro del
        laboratorio; dentro de esa columna el agua sube una altura h, menor
        que H, y por encima queda el aire. En la coronación del laboratorio,
        por fuera, hay un manómetro tipo Bourdon, marcado A.</desc>

        <rect x="34" y="40" width="372" height="212" fill="var(--live)" fill-opacity=".12"/>
        <line x1="34" y1="40" x2="406" y2="40" stroke="var(--live)" stroke-width="1.6"/>
        <text x="40" y="34" font-size="10" fill="var(--faint)">Aire</text>
        <text x="330" y="62" font-size="10.5" fill="var(--live)">s = 1,025</text>

        <path d="M175 252 A 81 81 0 0 1 337 252 Z" fill="var(--panel)"
              stroke="var(--ink)" stroke-width="2.4"/>
        <text x="300" y="230" font-size="11" fill="var(--faint)">Aire a presión</text>

        <line x1="34" y1="252" x2="406" y2="252" stroke="var(--ink)" stroke-width="2"/>
        <g stroke="var(--faint)" stroke-width="1">
          <path d="M46 252 L38 262 M66 252 L58 262 M86 252 L78 262 M106 252 L98 262 M126 252 L118 262 M146 252 L138 262 M354 252 L346 262 M374 252 L366 262 M394 252 L386 262"/>
        </g>

        <rect x="140" y="240" width="74" height="12" fill="var(--live)" fill-opacity=".4"/>
        <rect x="196" y="211" width="18" height="29" fill="var(--live)" fill-opacity=".4"/>
        <path d="M140 240 L196 240 L196 195 M214 195 L214 252" fill="none"
              stroke="var(--ink)" stroke-width="2"/>
        <text x="134" y="250" text-anchor="end" font-size="10" fill="var(--faint)">acceso</text>

        <line x1="230" y1="195" x2="230" y2="252" stroke="var(--faint)" stroke-width="1"/>
        <line x1="224" y1="195" x2="236" y2="195" stroke="var(--faint)" stroke-width="1"/>
        <line x1="224" y1="252" x2="236" y2="252" stroke="var(--faint)" stroke-width="1"/>
        <text x="240" y="212" font-size="10.5" fill="var(--faint)">H = 4,1 m</text>
        <line x1="186" y1="211" x2="186" y2="252" stroke="var(--live)" stroke-width="1"/>
        <line x1="180" y1="211" x2="192" y2="211" stroke="var(--live)" stroke-width="1"/>
        <text x="176" y="226" text-anchor="end" font-size="10.5" fill="var(--live)">h = 2,9 m</text>

        <line x1="80" y1="40" x2="80" y2="252" stroke="var(--faint)" stroke-width="1"/>
        <line x1="74" y1="40" x2="86" y2="40" stroke="var(--faint)" stroke-width="1"/>
        <line x1="74" y1="252" x2="86" y2="252" stroke="var(--faint)" stroke-width="1"/>
        <text x="90" y="150" font-size="11" fill="var(--faint)">Z = 39,5 m</text>

        <line x1="256" y1="252" x2="256" y2="171" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="248" y="186" text-anchor="end" font-size="10" fill="var(--faint)">R = 5,8 m</text>

        <circle cx="256" cy="163" r="9" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M256 172 L256 178 M256 163 L261 158" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="270" y="160" font-size="11" fill="var(--ink)">A</text>
      </svg>
      <figcaption>

      La columna de acceso es la clave: mientras el agua **no rebose por su
      borde superior**, el laboratorio está seco. Por eso el apartado c) es una
      profundidad máxima, y por eso la respuesta sale de comparar h con H y no
      de ninguna fuerza.

      </figcaption>
      </figure>
    pide: La presión del aire del laboratorio, la lectura del manómetro y las dos condiciones límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la presión que debe tener el aire del laboratorio?
        opciones:
          - texto: >-
              La altura a la que se quiere que se quede el agua dentro del
              tubo de acceso: en esa interfaz, la presión del aire iguala a la
              del mar
            correcta: true
            mensaje: |
              Eso es. El tubo de acceso está abierto al mar por abajo, así que
              el agua sube por él hasta donde la presión del aire la frena. Si
              se quiere que se quede a 2,9 m del fondo, el aire tiene que
              valer lo que vale el mar a esa cota.
          - texto: >-
              La profundidad de la base, 39,5 m
            mensaje: |
              Si el aire valiera lo que el mar en la base, el agua no subiría
              nada por el tubo. Lo que fija la presión es dónde se quiere el
              menisco, y eso es 2,9 m más arriba.
          - texto: >-
              La altura del acceso, 4,1 m
            mensaje: |
              Los 4,1 m son el **límite**: si el agua llegara ahí, se
              derramaría dentro. La configuración de diseño deja el menisco en
              2,9, con 1,2 m de margen.

      - tipo: calcular
        titulo: La presión del aire del laboratorio
        pregunta: |
          ¿Qué presión absoluta debe tener el aire, en Pa?
        respuesta:
          tipo: magnitud
          valor: '468972 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '498103 Pa'
            mensaje: |
              Esa es la presión absoluta del mar en la **base**, a 39,5 m. El
              aire vale lo que el mar a la cota del menisco, 2,9 m más arriba.
          - valor: '367647 Pa'
            mensaje: |
              Esa es la presión **manométrica** del aire. El apartado pide la
              absoluta, así que hay que sumarle la atmósfera.
        pista: |
          El menisco está a $39{,}5-2{,}9 = 36{,}6$ m de profundidad, y ahí la
          presión del aire iguala a la del mar.
        desarrollo: |
          $$
          p = p_{atm}+\gamma_{mar}\,(Z-h)
          = 101\,325 + 1025\cdot 9{,}8\cdot 36{,}6 = 468\,972\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro A
        pregunta: |
          ¿Qué marca el Bourdon A, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '0.29725'
          tolerancia: 0.003
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '3.752'
            mensaje: |
              Esa es la presión manométrica del aire respecto de la
              **atmósfera**. El manómetro A está en la coronación y compara el
              aire del laboratorio con el mar que tiene al otro lado de la
              chapa, a 33,7 m de profundidad.
          - valor: '4.785'
            mensaje: |
              Esa es la presión absoluta del aire pasada a kg/cm². Un
              manómetro Bourdon mide diferencias, no absolutos.
        pista: |
          El Bourdon está en la coronación, a $Z - R = 33{,}7$ m de
          profundidad, y compara el aire de dentro con el mar de fuera a esa
          cota.
        desarrollo: |
          $$
          p_{mar}(33{,}7) = 101\,325 + 1025\cdot 9{,}8\cdot 33{,}7
          = 439\,841\ \text{Pa}
          $$
          $$
          p_A = p_{aire}-p_{mar}(33{,}7) = 468\,972-439\,841 = 29\,131\ \text{Pa}
          $$
          $$
          \frac{29\,131}{98\,000} = 0{,}29725\ \text{kg/cm}^{2}
          $$

          que son $R-h = 2{,}9$ m de agua de mar: lo que hay entre la cota del
          menisco del acceso y la coronación.

      - tipo: calcular
        titulo: La profundidad máxima
        pregunta: |
          ¿Hasta qué profundidad puede bajar el laboratorio sin que entre
          agua, en metros?
        respuesta:
          tipo: magnitud
          valor: '40.7 m'
          tolerancia: 0.02
          formato: una profundidad, con su unidad
        distractores:
          - valor: '39.5 m'
            mensaje: |
              Esa es la profundidad de diseño, la de partida. El laboratorio
              todavía tiene 1,2 m de margen en el tubo de acceso antes de que
              el agua desborde.
          - valor: '43.6 m'
            mensaje: |
              Has sumado los 4,1 m del acceso entero. El margen no es la
              altura del acceso sino lo que le queda libre: $4{,}1-2{,}9 =
              1{,}2$ m.
        pista: |
          Con la presión del aire fija, el menisco está siempre a la misma
          **profundidad**; el límite es que llegue al borde del acceso.
        desarrollo: |
          Con $p_{aire}$ constante, el menisco se queda siempre a 36,6 m de
          profundidad. El agua desborda cuando ese menisco alcanza la boca
          del acceso, es decir cuando la base está 4,1 m más abajo:

          $$
          Z_{max} = 36{,}6+4{,}1 = 40{,}7\ \text{m}
          $$

      - tipo: calcular
        titulo: El peso específico límite
        pregunta: |
          Con la base a 39,5 m y la misma presión de aire, ¿qué peso
          específico del agua de mar deja el menisco justo en el borde del
          acceso? En kg/m³, como el enunciado: kilopondios por metro cúbico.
        respuesta:
          tipo: numero
          valor: '1059.75'
          tolerancia: 1
          formato: un número en kilopondios por metro cúbico
        distractores:
          - valor: '10385.5'
            mensaje: |
              Ese es el peso específico en N/m³. El enunciado lo da, y lo
              pide, en «kg/m³», que son kilopondios por metro cúbico: falta
              dividir entre 9,8.
          - valor: '1351.8'
            mensaje: |
              Has repartido la presión **absoluta** del aire entre los 35,4 m
              de columna. Por encima de la lámina del mar también hay una
              atmósfera, así que la columna solo tiene que sostener la
              diferencia, 367 647 Pa.
        pista: |
          Con la base a 39,5 m, el borde del acceso está a
          $39{,}5-4{,}1 = 35{,}4$ m de profundidad, y ahí tiene que quedar el
          menisco.
        desarrollo: |
          $$
          101\,325+\gamma\cdot 35{,}4 = 468\,972
          \;\Longrightarrow\;
          \gamma = \frac{367\,647}{35{,}4} = 10\,385{,}5\ \text{N/m}^{3}
          $$
          $$
          \frac{10\,385{,}5}{9{,}8} = 1059{,}75\ \text{kg/m}^{3}
          $$

          en kilopondios, que es como lo imprime el examen: un 3,4 % más que
          los 1025 de partida.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión del aire iguala a la del mar a la cota del menisco,
              36,6 m: 468.972 Pa absolutos.
          - texto: >-
              El Bourdon A, en la coronación, compara ese aire con el mar de
              fuera a 33,7 m: la diferencia son 2,9 m de agua de mar, 0,297
              kg/cm².
          - texto: >-
              Con la presión fija, el menisco se queda a 36,6 m de
              profundidad, así que el laboratorio puede bajar hasta que la
              boca del acceso llegue ahí: 40,7 m.
          - texto: >-
              Con agua más densa, el laboratorio podría bajar más antes de
              inundarse.
            trampa: true
            mensaje: |
              Al revés, y es el apartado d). Con agua más densa, la misma
              presión de aire equilibra **menos** columna, así que el menisco
              sube dentro del tubo y el margen se acorta. El peso específico
              límite para la profundidad de diseño es 1059,75 kg/m³: por
              encima de ese, el laboratorio a 39,5 m ya se inunda.
    resolucion: |
      **a) La presión del aire.** El tubo de acceso está abierto al mar por
      abajo, así que el agua sube por él hasta que la presión del aire la
      detiene. Con el menisco a $2{,}9$ m sobre el fondo, su profundidad es
      $39{,}5-2{,}9 = 36{,}6$ m, y ahí la presión del aire iguala a la del
      mar:

      $$
      p_{aire} = 101\,325 + 1025\cdot 9{,}8\cdot 36{,}6 = 468\,972\ \text{Pa}
      $$

      **b) El manómetro A.** Está en la coronación, por fuera, a
      $Z-R = 33{,}7$ m de profundidad, y compara el aire del laboratorio con
      el mar que tiene al otro lado de la chapa:

      $$
      p_A = 468\,972-439\,841 = 29\,131\ \text{Pa} = 0{,}297\ \text{kg/cm}^{2}
      $$

      Son $R-h = 2{,}9$ m de agua de mar: el aire de dentro vale lo que el mar
      a la cota del menisco, y el de fuera en la coronación está 2,9 m más
      arriba. Que salgan los mismos 2,9 m que la columna del acceso es cosa de
      los números del enunciado, porque $R = 5{,}8$ es justo el doble de $h$;
      con otro radio el manómetro marcaría otra cosa.

      **c) La profundidad máxima.** Con la presión del aire fija, el menisco
      se mantiene siempre a 36,6 m de profundidad, pase lo que pase con el
      laboratorio. Lo que se mueve es el laboratorio, y el agua desborda
      cuando la boca del acceso —4,1 m sobre la base— alcanza esa cota:

      $$
      Z_{max} = 36{,}6+4{,}1 = 40{,}7\ \text{m}
      $$

      **d) El peso específico límite.** Manteniendo $Z = 39{,}5$ m y la misma
      presión de aire, el límite es que el menisco llegue a los 4,1 m, es
      decir a $35{,}4$ m de profundidad:

      $$
      101\,325+\gamma\cdot 35{,}4 = 468\,972
      \;\Longrightarrow\;
      \gamma = 10\,386\ \text{N/m}^{3} = 1059{,}75\ \text{kg/m}^{3}
      $$

      con el «kg» del enunciado, que es un kilopondio.

      **Lo que enseña.** El laboratorio no tiene puerta: lo que lo mantiene
      seco es una burbuja de aire a presión, y el «margen de seguridad» es
      literalmente un metro y veinte de tubo vacío. Un metro y veinte más de
      profundidad, o un 3,4 % más de peso específico en el agua, y el mar
      entra. Es el mismo principio de la campana de buceo, con el número
      puesto.

  # ── 3 (20 %) · Una boquilla alimentada por dos depósitos, con la potencia
  #    de la bomba fija y el depósito presurizado como incógnita.
  - id: exflu1920-1par-3-la-boquilla-alimentada-por-dos-depositos
    titulo: La boquilla que alimentan dos depósitos, con la bomba a potencia fija
    fuente: >-
      Ejercicio 3 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      En el sistema de la figura, se suministra agua a la boquilla B desde
      los depósitos A y C. El diámetro de la boquilla es $d = 25$ mm. No
      considerar las pérdidas de carga en la boquilla. Inicialmente la válvula
      V está cerrada. Se pide:

      **a)** Altura manométrica que debe aportar la bomba para que el chorro
      que sale por la boquilla B alcance una altura $h = 7$ m de altura.
      Determinar asimismo la potencia útil de la bomba.

      **b)** Potencia del chorro (W).

      Se desea aumentar la velocidad del chorro a $v_B = 20{,}5$ m/s. Para
      ello se abre totalmente la válvula V
      ($K_{\text{válvula totalmente abierta}} = 0$). Suponiendo constante la
      potencia útil de la bomba, se pide:

      **c)** Caudal que debe bombear la bomba $Q_1$ (l/s).

      **d)** Presión $P_C$ (kg/cm²).

      **Notas nuestras.** Junto a la figura, redibujada abajo, el examen trae
      esta tabla:

      | Tubería | L (m) | D (mm) | k (adimensional) |
      |---|---|---|---|
      | 1 | 750 | 80 | 190 |
      | 2 | 500 | 80 | 125 |
      | 3 | 200 | 70 | 40 |

      En la figura, la lámina del depósito A está en la cota 70 y la bomba
      está a su salida; la tubería 1 sube de la bomba al nudo N. El depósito
      C, cerrado y con un manómetro encima, tiene la lámina en la cota 105, y
      de él baja la tubería 3, con la válvula V, hasta el mismo nudo. De N
      sale la tubería 2 hasta la boquilla B, en la cota 75, que lanza el
      chorro hacia arriba. En la figura la bomba también lleva la letra B.

      <figure class="figura-examen">
      <svg viewBox="-16 34 452 268" role="img" width="440" height="261"
           aria-labelledby="fp3t fp3d">
        <title id="fp3t">La red que alimenta la boquilla B desde los depósitos A y C</title>
        <desc id="fp3d">Una boquilla B recibe agua de dos depósitos. El depósito
        A está abajo a la izquierda, en la cota setenta, y a su salida hay una
        bomba; de ahí sale la tubería 1, que sube hasta el nudo N. El depósito
        C está arriba a la izquierda, cerrado y presurizado, con su lámina en
        la cota ciento cinco y un manómetro encima; de su salida arranca la
        tubería 3, con la válvula V, que baja hasta el mismo nudo N. Del nudo
        N sale la tubería 2 hasta la boquilla B, que está en la cota setenta y
        cinco y lanza el chorro a la atmósfera.</desc>

        <rect x="70" y="72" width="80" height="38" fill="var(--live)" fill-opacity=".22"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="70" y1="72" x2="150" y2="72" stroke="var(--live)" stroke-width="1.4"/>
        <text x="110" y="96" text-anchor="middle" font-size="12" fill="var(--ink)">C</text>
        <circle cx="128" cy="60" r="8" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M128 68 L128 72 M128 60 L132 56" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M158 66 L176 66 M158 72 L176 72 M158 78 L176 78" stroke="var(--faint)" stroke-width="1"/>
        <text x="182" y="70" font-size="10" fill="var(--faint)">cota 105</text>

        <path d="M150 104 L172 104 L258 206" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <path d="M166 98 L178 110 M178 98 L166 110" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="164" y="126" font-size="11" fill="var(--ink)">V</text>
        <text x="204" y="140" font-size="12" fill="var(--faint)">3</text>

        <rect x="70" y="248" width="80" height="36" fill="var(--live)" fill-opacity=".22"
              stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="70" y1="248" x2="150" y2="248" stroke="var(--live)" stroke-width="1.4"/>
        <text x="110" y="272" text-anchor="middle" font-size="12" fill="var(--ink)">A</text>
        <path d="M44 242 L62 242 M44 248 L62 248 M44 254 L62 254" stroke="var(--faint)" stroke-width="1"/>
        <text x="40" y="238" text-anchor="end" font-size="10" fill="var(--faint)">cota 70</text>

        <path d="M150 264 L190 264 M214 264 L240 264 L258 206" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <circle cx="202" cy="264" r="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <path d="M192 278 L212 278" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="202" y="296" text-anchor="middle" font-size="10" fill="var(--faint)">bomba</text>
        <text x="244" y="238" font-size="12" fill="var(--faint)">1</text>

        <circle cx="258" cy="206" r="4.5" fill="var(--ink)"/>
        <text x="240" y="202" text-anchor="end" font-size="12" fill="var(--ink)">N</text>

        <path d="M258 206 L336 152" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="290" y="196" font-size="12" fill="var(--faint)">2</text>

        <path d="M328 152 L344 152 L340 134 L332 134 Z" fill="var(--ink)" opacity=".75"/>
        <path d="M336 130 L330 104 M336 130 L336 100 M336 130 L342 104"
              stroke="var(--live)" stroke-width="1.6"/>
        <text x="352" y="150" font-size="12" fill="var(--ink)">B</text>
        <path d="M356 122 L374 122 M356 128 L374 128 M356 134 L374 134" stroke="var(--faint)" stroke-width="1"/>
        <text x="378" y="126" font-size="10" fill="var(--faint)">cota 75</text>
      </svg>
      <figcaption>

      Con la válvula V cerrada el depósito C **no aporta nada** y toda el agua
      viene de A. Al abrirla entra un tercer caudal en el nudo, y el signo de
      ese caudal —si C aporta o recibe— es lo que hay que decidir antes de
      escribir ninguna ecuación.

      </figcaption>
      </figure>
    pide: La altura y la potencia de la bomba, y luego el reparto de caudales y la presión de C.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado c) se pide **más** chorro con la **misma** potencia
          útil. ¿Qué le pasa al caudal de la bomba?
        opciones:
          - texto: >-
              Baja, porque con la potencia fija el producto $Q\,H_m$ es
              constante y ahora hace falta mucha más altura
            correcta: true
            mensaje: |
              Eso es, y es lo que hace bonito el ejercicio. La boquilla pasa
              de 11,7 a 20,5 m/s, así que el nudo necesita mucha más energía;
              con $P = \gamma Q H_m$ fija, si $H_m$ sube, $Q$ baja. El caudal
              que falta hasta el de la boquilla lo pone el depósito C.
          - texto: >-
              Sube, porque la boquilla necesita más caudal
            mensaje: |
              La boquilla sí necesita más caudal —pasa de 5,75 a 10,06 l/s—
              pero no tiene por qué darlo la bomba: al abrir la válvula entra
              en juego el depósito C. Y la bomba, a potencia fija, no puede
              dar más caudal **y** más altura a la vez.
          - texto: >-
              Se queda igual, porque la potencia no cambia
            mensaje: |
              La potencia es el producto de caudal por altura. Que el producto
              no cambie no significa que los factores no cambien; de hecho
              aquí se mueven los dos, en sentidos contrarios.

      - tipo: calcular
        titulo: La altura manométrica inicial
        pregunta: |
          Con la válvula cerrada y un chorro de 7 m, ¿cuánto vale $H_m$, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '33.03 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '12 m'
            mensaje: |
              Te has dejado las pérdidas. Los factores de paso son enormes
              —190 y 125— porque incluyen el rozamiento de 750 y 500 m de
              tubería: entre los dos se llevan 21 metros.
          - valor: '26.03 m'
            mensaje: |
              Te has dejado la altura del chorro. La boquilla no descarga a
              velocidad nula: los 7 metros que sube el chorro son energía
              cinética que la bomba tiene que poner.
        pista: |
          $h = 7$ m fija la velocidad de salida, y con ella el caudal y las
          pérdidas. Después, energía entre A y la salida de la boquilla.
        desarrollo: |
          $$
          v_B = \sqrt{2g\cdot 7} = 11{,}71\ \text{m/s}
          \qquad
          Q = 5{,}75\ \text{l/s}
          \qquad
          \frac{v_{1,2}^{2}}{2g} = 0{,}0668\ \text{m}
          $$
          $$
          70 + H_m = 75 + 7 + (190+125)\cdot 0{,}0668
          \;\Longrightarrow\;
          H_m = 33{,}03\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia del chorro
        pregunta: |
          ¿Cuánta potencia se lleva el chorro, en W?
        respuesta:
          tipo: magnitud
          valor: '394.43 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1861.07 W'
            mensaje: |
              Esa es la potencia **útil de la bomba**. El chorro solo se lleva
              la quinta parte: el resto se ha ido en subir el agua cinco
              metros y, sobre todo, en las pérdidas.
          - valor: '1466.6 W'
            mensaje: |
              Esa es la diferencia entre la potencia de la bomba y la del
              chorro, es decir lo que se pierde por el camino. Lo que se pide
              es lo que llega al chorro.
        pista: |
          $P = \gamma\,Q\,(v_B^{2}/2g)$.
        desarrollo: |
          $$
          P_{chorro} = 9800\cdot 5{,}75\cdot 10^{-3}\cdot 7 = 394{,}4\ \text{W}
          $$

          frente a los $1861$ W de la bomba: un rendimiento de instalación del
          **21 %**.

      - tipo: calcular
        titulo: El caudal que bombea la bomba
        pregunta: |
          Con el chorro a 20,5 m/s y la potencia útil fija, ¿cuánto bombea la
          bomba, en l/s?
        respuesta:
          tipo: magnitud
          valor: '3.37 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '10.06 l/s'
            mensaje: |
              Ese es el caudal que sale por la **boquilla**. La bomba solo
              pone un tercio; los otros dos tercios los aporta el depósito C
              por la tubería 3.
          - valor: '5.75 l/s'
            mensaje: |
              Ese es el caudal del apartado a), con la válvula cerrada. Al
              abrirla, la bomba pasa a dar menos caudal y más altura.
        pista: |
          $P = \gamma Q_1 H_m$ con $P$ fija, y la energía en el nudo N sale
          de la boquilla. Queda una ecuación en $Q_1$.
        desarrollo: |
          $$
          v_B = 20{,}5 \Rightarrow Q_B = 10{,}06\ \text{l/s}
          \qquad
          H_N = 75+21{,}44+125\cdot 0{,}2045 = 122{,}0\ \text{m}
          $$
          $$
          70+\frac{1861{,}07}{9800\,Q_1} - 190\,\frac{v_1^{2}}{2g} = 122{,}0
          \;\Longrightarrow\;
          Q_1 = 3{,}37\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La presión del depósito C
        pregunta: |
          ¿A qué presión está el depósito C, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '2.32'
          tolerancia: 0.03
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '1.7'
            mensaje: |
              Esos son los 17 metros que le faltan a la cota de C —105— para
              llegar a la energía del nudo, 122. Falta añadir la pérdida de la
              tubería 3, que con 6,7 l/s son 6,17 m más.
          - valor: '0'
            mensaje: |
              Si C estuviera abierto a la atmósfera, su energía sería 105 m,
              menos que los 122 del nudo, y el agua iría de N a C en vez de al
              revés. Tiene que estar presurizado.
        pista: |
          $Q_3 = Q_B - Q_1$, y con él la pérdida de la tubería 3. Después,
          energía desde C hasta el nudo.
        desarrollo: |
          $$
          Q_3 = 10{,}06-3{,}37 = 6{,}69\ \text{l/s}
          \qquad
          40\,\frac{v_3^{2}}{2g} = 6{,}17\ \text{m}
          $$
          $$
          105+\frac{p_C}{\gamma} = 122{,}0+6{,}17
          \;\Longrightarrow\;
          \frac{p_C}{\gamma} = 23{,}17\ \text{m}
          $$
          $$
          p_C = 227{,}1\ \text{kPa} = 2{,}32\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la válvula cerrada, un chorro de 7 m exige 33,03 m de bomba
              y 1.861 W, de los que el chorro se lleva solo 394.
          - texto: >-
              Al pedir 20,5 m/s, el nudo necesita 122 m de energía, y la bomba
              —a potencia fija— responde con más altura y menos caudal: 3,37
              l/s.
          - texto: >-
              Los 6,69 l/s que faltan los pone el depósito C, que para ello ha
              de estar a 2,32 kg/cm².
          - texto: >-
              Como la bomba da menos caudal que antes, la instalación es menos
              eficiente en el segundo caso.
            trampa: true
            mensaje: |
              Es al revés: el chorro pasa de 394 a 2.115 W con la misma
              potencia de bomba, porque ahora buena parte de la energía la
              pone gratis el depósito C. La instalación no es menos eficiente:
              es que ha dejado de depender solo de la bomba. Medir la
              eficiencia por el caudal de la bomba en vez de por lo que sale
              del chorro es mirar la mitad del sistema.
    resolucion: |
      **a) Con la válvula cerrada.** La altura del chorro fija todo lo demás:

      $$
      v_B = \sqrt{2g\cdot 7} = 11{,}71\ \text{m/s}
      \qquad
      Q = 5{,}75\ \text{l/s}
      $$

      Los factores de paso de las tuberías 1 y 2 —190 y 125— ya incluyen el
      rozamiento de sus 750 y 500 metros, y a esa velocidad se llevan 21
      metros de los 33:

      $$
      70+H_m = 75+7+315\cdot 0{,}0668
      \qquad
      H_m = 33{,}03\ \text{m}
      \qquad
      P_{util} = 1861\ \text{W}
      $$

      **b) El chorro** se lleva $394{,}4$ W: el **21 %** de lo que da la
      bomba. El resto se va en subir cinco metros y en rozamiento.

      **c) Con la válvula abierta.** Aquí está la idea. La boquilla a 20,5 m/s
      pide 10,06 l/s y deja el nudo en 122 m de energía. La bomba, con la
      potencia útil congelada, tiene que dar esa altura, y para eso baja su
      caudal:

      $$
      70+\frac{1861}{9800\,Q_1}-190\frac{v_1^{2}}{2g} = 122
      \qquad
      Q_1 = 3{,}37\ \text{l/s}
      $$

      **d) El depósito C** pone los $6{,}69$ l/s que faltan, y para ello tiene
      que estar presurizado:

      $$
      p_C = 2{,}32\ \text{kg/cm}^{2}
      $$

      **Lo que hay que llevarse.** Una bomba a potencia constante es una
      hipérbola: puede dar mucho caudal con poca altura o poca altura con
      mucho caudal, pero no las dos. Cuando la instalación pide más altura, la
      bomba **retrocede** por su curva y el sistema tiene que buscar el caudal
      en otra parte. Aquí lo encuentra en un depósito elevado y presurizado, y
      el chorro pasa de 394 a 2.115 W sin tocar la bomba.

  # ── 4 (25 %) · Un tubo submarino partido en dos medias cañas que el helio
  #    tiende a abrir.
  - id: exflu1920-1par-4-el-tubo-de-helio-que-tiende-a-abrirse
    titulo: El tubo de helio partido en dos, y la junta que lo aguanta
    fuente: >-
      Ejercicio 4 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra un nuevo sistema para transportar helio en estado
      gaseoso a 10 bar bajo un fluido. El tubo consta de 2 medios-tubos, las
      dos partes tienen un radio $R = 2{,}5$ m, están articuladas
      independientemente en el punto A, hacen contacto en el punto B pero no
      están unidos. El tubo está ubicado a una profundidad de $h = 55$ m. El
      peso de cada fragmento del tubo es de 50 kg por metro de profundidad y
      su centro de gravedad se encuentra a $3\cdot R/5$ del centro de la
      circunferencia. Despreciando el espesor de la tubería y tomando una
      tubería con una longitud de 1,75 m,

      **a)** Dibujar los prismas de presiones acotados de la fuerza
      hidrostática realizada por ambos fluidos sobre las paredes del tubo. Es
      suficiente con estudiar solo una parte del tubo.

      **b)** Calcular la fuerza (kN) hidrostática horizontal y vertical
      resultante ejercida por los fluidos en las paredes del tubo. Es
      suficiente con estudiar solo una parte del tubo.

      **c)** ¿Funcionará este sistema de tubos analizado para transportar a
      He? Razona la respuesta.

      Ahora se analizará un caso en el que el nivel del fluido exterior ha
      aumentado. Tomando $h = 200$ m,

      **d)** Calcular las reacciones (kN) en el punto A. ¿Qué fuerza (kN)
      sufrirá la junta ubicada en el punto B?

      **Datos**: $s = 1{,}75$; $\rho_{aire} = 1{,}2\ \text{kg/m}^{3}$;
      $\rho_{He} = 0{,}2\ \text{kg/m}^{3}$.

      **Notas nuestras.** La figura, redibujada abajo, dice esto: la lámina
      libre del fluido de densidad relativa $s$, con aire encima; $h$ medida
      desde la lámina hasta A, el punto más alto del tubo; en A, un soporte
      fijo en forma de V del que cuelgan las dos mitades; B, el punto más
      bajo, donde las dos mitades se tocan; y dentro, el helio. A la derecha
      trae cuatro croquis de ayuda con centros de gravedad: cuarto de esfera
      ($3R/8$), cilindro cortado en bisel ($R/4$ y $5R/8$),
      semicírculo ($4R/3\pi$) y cuarto de círculo ($4R/3\pi$). «50 kg por
      metro de profundidad» es por metro de tubo, en la dirección
      perpendicular al dibujo, y ese kg es un kilopondio: $50\cdot 9{,}8$ N
      por metro.

      <figure class="figura-examen">
      <svg viewBox="30 26 300 226" role="img" width="400" height="301"
           aria-labelledby="fp4t fp4d">
        <title id="fp4t">El tubo de helio partido en dos medias cañas, sumergido</title>
        <desc id="fp4d">Un tubo de sección circular de radio R está sumergido en
        un fluido de densidad relativa uno con setenta y cinco. Su punto más
        alto, A, queda a una profundidad h por debajo de la superficie libre,
        y cuelga de un soporte fijo en forma de V que baja desde la superficie.
        El tubo no es de una pieza: son dos medias cañas cortadas por un plano
        vertical, articuladas cada una por su lado en A y en contacto —pero no
        unidas— en el punto B, que es el más bajo. Dentro circula helio a
        presión.</desc>

        <rect x="30" y="46" width="300" height="206" fill="var(--live)" fill-opacity=".12"/>
        <line x1="30" y1="46" x2="330" y2="46" stroke="var(--live)" stroke-width="1.6"/>
        <text x="36" y="40" font-size="10" fill="var(--faint)">Aire</text>
        <text x="270" y="66" font-size="10.5" fill="var(--live)">s = 1,75</text>

        <path d="M180 94 L148 34 M180 94 L212 34" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
