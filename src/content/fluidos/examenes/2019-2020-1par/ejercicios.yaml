ejercicios:
  # ── 1 (18 %) · El aire del que se extrae la mitad y se calienta. La
  #    trampa está en qué significa «el doble de la temperatura».
  - id: exflu1920-1par-1-el-aire-que-se-calienta-a-medio-llenar
    titulo: Media masa de aire al doble de temperatura, y qué doble es ese
    fuente: >-
      Ejercicio 1 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Inicialmente se tiene un recipiente cerrado rígido que contiene
      $m_0 = 5{,}6$ kg de aire a una presión absoluta de $p_0 = 9{,}6$ bar y
      una temperatura de $T_0 = 25$ ºC. Se extrae la mitad de la masa de aire
      y se calienta la masa restante ($m_1 = m_0/2$) hasta el doble de la
      temperatura inicial ($T_1 = 2\,T_0$). Se conocen los siguientes datos
      del aire: $p_{atm} = 10{,}3$ m.c.a. y la constante
      $R_{aire} = 287\ \text{N}\cdot\text{m/(kg}\cdot\text{K)}$. Se pide:

      **a)** Calcular el volumen del recipiente (m³) y la densidad del aire en
      el instante inicial.

      **b)** Calcular la presión manométrica del aire (kg/cm²) en el instante
      final.

      En el extremo superior del recipiente hay un pistón. Se acciona el
      pistón hacia abajo hasta que el volumen del recipiente se reduce un
      15 %. La variación de presión producida es de 225 kPa. Ambas
      variaciones son respecto a las condiciones del instante $t_1$. Se pide:

      **c)** Calcular el módulo de elasticidad volumétrico del aire (MPa).
    pide: El volumen y la densidad iniciales, la presión final y el módulo de elasticidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice $T_1 = 2\,T_0$ con $T_0 = 25$ ºC. ¿Qué temperatura
          es esa?
        opciones:
          - texto: >-
              50 ºC, es decir 323 K; el doble se aplica al número que da el
              enunciado y **después** se pasa a absolutos
            correcta: true
            mensaje: |
              Eso es lo que hace el examen, y es lo que hay que ver. «El doble
              de la temperatura inicial» se refiere al dato tal como está
              escrito: 25 ºC. Después, para meterlo en la ley de los gases,
              hay que pasarlo a kelvin. Duplicar los 298 K daría 596 y una
              presión más del doble.
          - texto: >-
              596 K, porque la ley de los gases exige temperaturas absolutas
            mensaje: |
              La ley las exige, sí, pero eso no significa que «el doble de
              25 ºC» sean 596 K. Con esa lectura la presión final sale 8,77
              kg/cm² en vez de 4,279, y no es lo que publica el examen.
          - texto: >-
              Da igual: la presión no depende de la escala de temperatura
            mensaje: |
              Depende, y mucho. La ley de los gases es lineal en la
              temperatura **absoluta**, así que un factor 2 sobre grados
              Celsius y un factor 2 sobre kelvin son dos operaciones
              distintas y dan resultados distintos.

      - tipo: calcular
        titulo: El volumen del recipiente
        pregunta: |
          ¿Qué volumen tiene el recipiente, en m³?
        respuesta:
          tipo: numero
          valor: '0.499'
          tolerancia: 0.005
          formato: un número en metros cúbicos
        distractores:
          - valor: '5.6'
            mensaje: |
              Esa es la masa de aire, en kilogramos. El volumen sale de la ley
              de los gases con la presión y la temperatura absolutas.
          - valor: '0.0499'
            mensaje: |
              Te has dejado un factor diez. Comprueba el paso de bares a
              pascales: 9,6 bar son $9{,}6\cdot 10^{5}$ Pa.
        pista: |
          $pV = mRT$, con $T_0 = 298$ K y la presión **absoluta**.
        desarrollo: |
          $$
          V = \frac{m\,R\,T}{p} = \frac{5{,}6\cdot 287\cdot 298}{9{,}6\cdot 10^{5}}
          = 0{,}499\ \text{m}^{3}
          $$
          $$
          \rho = \frac{5{,}6}{0{,}499} = 11{,}22\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La presión manométrica final
        pregunta: |
          Con la mitad de la masa y el doble de temperatura, ¿cuánto marca un
          manómetro, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '4.279'
          tolerancia: 0.02
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '8.77'
            mensaje: |
              Has duplicado la temperatura **absoluta**, 298 K, en vez del
              dato en grados Celsius. Con 596 K la presión final coincidiría
              con la inicial, 9,6 bar absolutos, y el manómetro marcaría 8,77.
          - valor: '5.31'
            mensaje: |
              Esa es la presión **absoluta**, $520$ kPa. La pregunta pide la
              manométrica, así que hay que descontar la atmósfera: 10,3 mca
              son 100,94 kPa.
        pista: |
          $p_1 = m_1 R T_1/V$ con $T_1 = 50$ ºC $= 323$ K, y después réstale
          la atmósfera.
        desarrollo: |
          $$
          p_1 = \frac{2{,}8\cdot 287\cdot 323}{0{,}499} = 520{,}3\ \text{kPa}
          $$
          $$
          p_{man} = 520{,}3-100{,}94 = 419{,}3\ \text{kPa}
          = 4{,}279\ \text{kg/cm}^{2}
          $$

      - tipo: calcular
        titulo: El módulo de elasticidad volumétrico
        pregunta: |
          ¿Cuánto vale $K$, en MPa?
        respuesta:
          tipo: numero
          valor: '1.38'
          tolerancia: 0.02
          formato: un número en megapascales
        distractores:
          - valor: '1.5'
            mensaje: |
              Has usado la fórmula lineal, $K = \Delta p/(\Delta V/V)$. Un
              15 % de reducción de volumen es demasiado para linealizar: la
              expresión exacta, $\Delta V/V = 1-e^{-\Delta p/K}$, da 1,38.
          - valor: '0.225'
            mensaje: |
              Esos son los 225 kPa en megapascales, es decir la variación de
              presión. Falta dividirla por la variación relativa de volumen.
        pista: |
          $\Delta V/V = 1 - e^{-\Delta p/K}$, con $\Delta V/V = 0{,}15$.
        desarrollo: |
          $$
          0{,}15 = 1-e^{-225000/K}
          \;\Longrightarrow\;
          \frac{225000}{K} = -\ln 0{,}85 = 0{,}16252
          $$
          $$
          K = 1{,}384\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con 5,6 kg a 9,6 bar absolutos y 298 K, el recipiente mide
              0,499 m³ y el aire pesa 11,22 kg/m³.
          - texto: >-
              Con la mitad de masa a 50 ºC —el doble del dato en Celsius— la
              presión absoluta baja a 520 kPa y el manómetro marca 4,279
              kg/cm².
          - texto: >-
              Reducir el volumen un 15 % cuesta 225 kPa, y con la expresión
              exponencial eso da $K = 1{,}38$ MPa.
          - texto: >-
              El módulo de elasticidad del aire es una constante del gas, así
              que ese 1,38 MPa valdría también en el instante inicial.
            trampa: true
            mensaje: |
              No es una constante: para un gas ideal en compresión isoterma,
              $K$ **es la propia presión**. A 520 kPa absolutos, el módulo
              «exacto» sería 0,52 MPa; el 1,38 que sale aquí es un valor
              medio sobre una compresión del 15 %, que es mucha. La diferencia
              con un líquido —donde $K$ sí es prácticamente constante y vale
              gigapascales— es la razón de que un gas se comprima y un líquido
              no.
    resolucion: |
      **a) El recipiente.** Ley de los gases con la presión absoluta y
      $T_0 = 298$ K:

      $$
      V = \frac{5{,}6\cdot 287\cdot 298}{9{,}6\cdot 10^{5}} = 0{,}499\ \text{m}^{3}
      \qquad
      \rho = 11{,}22\ \text{kg/m}^{3}
      $$

      **b) La presión final, y la trampa.** El enunciado dice $T_1 = 2T_0$ con
      $T_0 = 25$ ºC. Eso son **50 ºC**, es decir 323 K: el doble se aplica al
      dato tal como viene, y la conversión a absolutos se hace después, al
      entrar en la ley de los gases. Con la mitad de la masa:

      $$
      p_1 = \frac{2{,}8\cdot 287\cdot 323}{0{,}499} = 520{,}3\ \text{kPa abs}
      $$
      $$
      p_{man} = 520{,}3-100{,}94 = 4{,}279\ \text{kg/cm}^{2}
      $$

      Quien duplique los 298 K obtiene 596 K, y entonces la presión final
      coincide **exactamente** con la inicial —la mitad de masa al doble de
      temperatura absoluta— y el manómetro marcaría 8,77. Es un resultado tan
      redondo que invita a creérselo; por eso conviene fijarse en qué doble
      pide el enunciado.

      **c) El módulo de elasticidad.** Un 15 % de reducción de volumen es
      demasiado para la fórmula lineal:

      $$
      \frac{\Delta V}{V} = 1-e^{-\Delta p/K} = 0{,}15
      \qquad
      K = \frac{225\,000}{-\ln 0{,}85} = 1{,}38\ \text{MPa}
      $$

      La lineal daría 1,5: un 9 % más.

      **Y una comprobación de sensatez.** $1{,}38$ MPa frente a los
      $2{,}2\cdot 10^{3}$ MPa del agua: **mil seiscientas veces menos**. Ese
      número es toda la diferencia entre un gas y un líquido, y es la razón
      de que en hidráulica se hable de fluidos incompresibles sin sonrojarse.

  # ── 2 (20 %) · Un laboratorio submarino, y la profundidad máxima antes de
  #    que el mar entre por el acceso.
  - id: exflu1920-1par-2-el-laboratorio-submarino
    titulo: El laboratorio submarino, y hasta dónde puede bajar
    fuente: >-
      Ejercicio 2 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se diseña un laboratorio de observación submarino para situarse en el
      fondo de un mar poco profundo, estando la base del laboratorio a una
      profundidad de diseño de $Z = 39{,}5$ m. El laboratorio tendrá forma de
      medio cilindro de radio $R = 5{,}8$ m. El acceso al laboratorio se hará
      por una conducción horizontal con terminación vertical, y para
      garantizar que se puede acceder de esta forma el aire del laboratorio
      deberá estar presurizado. La altura total del acceso vertical será de
      $H = 4{,}1$ m. Durante el diseño se considerará que la presión
      atmosférica sobre la superficie libre del mar es de 1 atm y la densidad
      del agua de mar $1025\ \text{kg/m}^{3}$. Se pide:

      **a)** Calcular la presión **absoluta** que deberá tener el aire del
      laboratorio para que la columna de agua del acceso vertical sea de
      $h = 2{,}9$ m.

      **b)** Calcular la presión que indicará el manómetro tipo Bourdon A en
      dicha configuración (kg/cm²).

      **c)** Deducir la profundidad máxima $Z_{máx}$ permitida para que,
      manteniendo la presión del laboratorio antes calculada constante, se
      evite derramar agua al interior del laboratorio desde la columna de
      acceso.

      **d)** Considérese que cambia la densidad del agua de mar. Calcular el
      valor que debería tomar para que, manteniendo fijas la presión del aire
      del laboratorio y la profundidad $Z = 39{,}5$ m, se dé la condición
      límite de no derrame descrita en el apartado anterior.

      En la figura, el acceso vertical arranca del fondo marino y el
      manómetro A mide la presión del aire del laboratorio respecto del agua
      exterior a la cota de la base.
    pide: La presión del aire del laboratorio, la lectura del manómetro y las dos condiciones límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la presión que debe tener el aire del laboratorio?
        opciones:
          - texto: >-
              La altura a la que se quiere que se quede el agua dentro del
              tubo de acceso: en esa interfaz, la presión del aire iguala a la
              del mar
            correcta: true
            mensaje: |
              Eso es. El tubo de acceso está abierto al mar por abajo, así que
              el agua sube por él hasta donde la presión del aire la frena. Si
              se quiere que se quede a 2,9 m del fondo, el aire tiene que
              valer lo que vale el mar a esa cota.
          - texto: >-
              La profundidad de la base, 39,5 m
            mensaje: |
              Si el aire valiera lo que el mar en la base, el agua no subiría
              nada por el tubo. Lo que fija la presión es dónde se quiere el
              menisco, y eso es 2,9 m más arriba.
          - texto: >-
              La altura del acceso, 4,1 m
            mensaje: |
              Los 4,1 m son el **límite**: si el agua llegara ahí, se
              derramaría dentro. La configuración de diseño deja el menisco en
              2,9, con 1,2 m de margen.

      - tipo: calcular
        titulo: La presión del aire del laboratorio
        pregunta: |
          ¿Qué presión absoluta debe tener el aire, en Pa?
        respuesta:
          tipo: magnitud
          valor: '468972 Pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '498103 Pa'
            mensaje: |
              Esa es la presión absoluta del mar en la **base**, a 39,5 m. El
              aire vale lo que el mar a la cota del menisco, 2,9 m más arriba.
          - valor: '367647 Pa'
            mensaje: |
              Esa es la presión **manométrica** del aire. El apartado pide la
              absoluta, así que hay que sumarle la atmósfera.
        pista: |
          El menisco está a $39{,}5-2{,}9 = 36{,}6$ m de profundidad, y ahí la
          presión del aire iguala a la del mar.
        desarrollo: |
          $$
          p = p_{atm}+\gamma_{mar}\,(Z-h)
          = 101\,325 + 1025\cdot 9{,}8\cdot 36{,}6 = 468\,972\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro A
        pregunta: |
          ¿Qué marca el Bourdon A, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '0.29725'
          tolerancia: 0.003
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '3.752'
            mensaje: |
              Esa es la presión manométrica del aire respecto de la
              **atmósfera**. El manómetro A compara el aire del laboratorio
              con el agua que hay justo al otro lado de la pared, a la cota de
              la base.
          - valor: '4.784'
            mensaje: |
              Esa es la presión absoluta del aire pasada a kg/cm². Un
              manómetro Bourdon mide diferencias, no absolutos.
        pista: |
          Compara el aire del laboratorio con el mar a la cota de la base: la
          diferencia son exactamente los 2,9 m de columna del acceso.
        desarrollo: |
          $$
          p_A = p_{mar}(39{,}5)-p_{aire} = 498\,103-468\,972 = 29\,131\ \text{Pa}
          $$
          $$
          \frac{29\,131}{98\,000} = 0{,}29725\ \text{kg/cm}^{2}
          $$

          que son, exactamente, $2{,}9$ m de agua de mar.

      - tipo: calcular
        titulo: La profundidad máxima
        pregunta: |
          ¿Hasta qué profundidad puede bajar el laboratorio sin que entre
          agua, en metros?
        respuesta:
          tipo: magnitud
          valor: '40.7 m'
          tolerancia: 0.02
          formato: una profundidad, con su unidad
        distractores:
          - valor: '39.5 m'
            mensaje: |
              Esa es la profundidad de diseño, la de partida. El laboratorio
              todavía tiene 1,2 m de margen en el tubo de acceso antes de que
              el agua desborde.
          - valor: '43.6 m'
            mensaje: |
              Has sumado los 4,1 m del acceso entero. El margen no es la
              altura del acceso sino lo que le queda libre: $4{,}1-2{,}9 =
              1{,}2$ m.
        pista: |
          Con la presión del aire fija, el menisco está siempre a la misma
          **profundidad**; el límite es que llegue al borde del acceso.
        desarrollo: |
          Con $p_{aire}$ constante, el menisco se queda siempre a 36,6 m de
          profundidad. El agua desborda cuando ese menisco alcanza la boca
          del acceso, es decir cuando la base está 4,1 m más abajo:

          $$
          Z_{max} = 36{,}6+4{,}1 = 40{,}7\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión del aire iguala a la del mar a la cota del menisco,
              36,6 m: 468.972 Pa absolutos.
          - texto: >-
              El manómetro A compara ese aire con el mar a la cota de la base,
              y su lectura son exactamente los 2,9 m de columna: 0,297 kg/cm².
          - texto: >-
              Con la presión fija, el menisco se queda a 36,6 m de
              profundidad, así que el laboratorio puede bajar hasta que la
              boca del acceso llegue ahí: 40,7 m.
          - texto: >-
              Con agua más densa, el laboratorio podría bajar más antes de
              inundarse.
            trampa: true
            mensaje: |
              Al revés, y es el apartado d). Con agua más densa, la misma
              presión de aire equilibra **menos** columna, así que el menisco
              sube dentro del tubo y el margen se acorta. La densidad límite
              para la profundidad de diseño es 1.059,75 kg/m³: por encima de
              esa, el laboratorio a 39,5 m ya se inunda.
    resolucion: |
      **a) La presión del aire.** El tubo de acceso está abierto al mar por
      abajo, así que el agua sube por él hasta que la presión del aire la
      detiene. Con el menisco a $2{,}9$ m sobre el fondo, su profundidad es
      $39{,}5-2{,}9 = 36{,}6$ m, y ahí la presión del aire iguala a la del
      mar:

      $$
      p_{aire} = 101\,325 + 1025\cdot 9{,}8\cdot 36{,}6 = 468\,972\ \text{Pa}
      $$

      **b) El manómetro A.** Compara el aire del laboratorio con el agua que
      hay al otro lado de la pared, a la cota de la base:

      $$
      p_A = 498\,103-468\,972 = 29\,131\ \text{Pa} = 0{,}297\ \text{kg/cm}^{2}
      $$

      Que son, exactamente, los 2,9 metros de columna del acceso. No es
      casualidad: el manómetro está midiendo esa columna.

      **c) La profundidad máxima.** Con la presión del aire fija, el menisco
      se mantiene siempre a 36,6 m de profundidad, pase lo que pase con el
      laboratorio. Lo que se mueve es el laboratorio, y el agua desborda
      cuando la boca del acceso —4,1 m sobre la base— alcanza esa cota:

      $$
      Z_{max} = 36{,}6+4{,}1 = 40{,}7\ \text{m}
      $$

      **d) La densidad límite.** Manteniendo $Z = 39{,}5$ m y la misma presión
      de aire, el límite es que el menisco llegue a los 4,1 m, es decir a
      $35{,}4$ m de profundidad:

      $$
      101\,325+\gamma\cdot 35{,}4 = 468\,972
      \;\Longrightarrow\;
      \gamma = 10\,386\ \text{N/m}^{3}
      \;\Longrightarrow\;
      \rho = 1059{,}75\ \text{kg/m}^{3}
      $$

      **Lo que enseña.** El laboratorio no tiene puerta: lo que lo mantiene
      seco es una burbuja de aire a presión, y el «margen de seguridad» es
      literalmente un metro y veinte de tubo vacío. Un metro más de
      profundidad, o un 3 % más de salinidad, y el mar entra. Es el mismo
      principio de la campana de buceo, con el número puesto.

  # ── 3 (20 %) · Una boquilla alimentada por dos depósitos, con la potencia
  #    de la bomba fija y el depósito presurizado como incógnita.
  - id: exflu1920-1par-3-la-boquilla-alimentada-por-dos-depositos
    titulo: La boquilla que alimentan dos depósitos, con la bomba a potencia fija
    fuente: >-
      Ejercicio 3 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se suministra agua a la boquilla B desde los depósitos A y C. El
      diámetro de la boquilla es $d = 25$ mm. No considerar las pérdidas de
      carga en la boquilla. Inicialmente la válvula V está cerrada. Se pide:

      **a)** Altura manométrica que debe aportar la bomba para que el chorro
      que sale por la boquilla B alcance una altura $h = 7$ m. Determinar
      asimismo la potencia útil de la bomba.

      **b)** Potencia del chorro (W).

      Se desea aumentar la velocidad del chorro a $v_B = 20{,}5$ m/s. Para
      ello se abre totalmente la válvula V ($k_{válvula} = 0$). Suponiendo
      constante la potencia útil de la bomba, se pide:

      **c)** Caudal que debe bombear la bomba $Q_1$ (l/s).

      **d)** Presión $p_C$ (kg/cm²).

      | tubería | $L$ (m) | $D$ (mm) | $k$ |
      |---|---|---|---|
      | 1 | 750 | 80 | 190 |
      | 2 | 500 | 80 | 125 |
      | 3 | 200 | 70 | 40 |

      En la figura, el depósito A está en la cota 70 con la bomba a su salida;
      la tubería 1 sube hasta el nudo N; de N sale la 2 hasta la boquilla B,
      en la cota 75; y la 3 baja desde el depósito C, cerrado y presurizado,
      cuya lámina está en la cota 105.
    pide: La altura y la potencia de la bomba, y luego el reparto de caudales y la presión de C.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado c) se pide **más** chorro con la **misma** potencia
          útil. ¿Qué le pasa al caudal de la bomba?
        opciones:
          - texto: >-
              Baja, porque con la potencia fija el producto $Q\,H_m$ es
              constante y ahora hace falta mucha más altura
            correcta: true
            mensaje: |
              Eso es, y es lo que hace bonito el ejercicio. La boquilla pasa
              de 11,7 a 20,5 m/s, así que el nudo necesita mucha más energía;
              con $P = \gamma Q H_m$ fija, si $H_m$ sube, $Q$ baja. El caudal
              que falta hasta el de la boquilla lo pone el depósito C.
          - texto: >-
              Sube, porque la boquilla necesita más caudal
            mensaje: |
              La boquilla sí necesita más caudal —pasa de 5,75 a 10,06 l/s—
              pero no tiene por qué darlo la bomba: al abrir la válvula entra
              en juego el depósito C. Y la bomba, a potencia fija, no puede
              dar más caudal **y** más altura a la vez.
          - texto: >-
              Se queda igual, porque la potencia no cambia
            mensaje: |
              La potencia es el producto de caudal por altura. Que el producto
              no cambie no significa que los factores no cambien; de hecho
              aquí se mueven los dos, en sentidos contrarios.

      - tipo: calcular
        titulo: La altura manométrica inicial
        pregunta: |
          Con la válvula cerrada y un chorro de 7 m, ¿cuánto vale $H_m$, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '33.03 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '12 m'
            mensaje: |
              Te has dejado las pérdidas. Los factores de paso son enormes
              —190 y 125— porque incluyen el rozamiento de 750 y 500 m de
              tubería: entre los dos se llevan 21 metros.
          - valor: '26.03 m'
            mensaje: |
              Te has dejado la altura del chorro. La boquilla no descarga a
              velocidad nula: los 7 metros que sube el chorro son energía
              cinética que la bomba tiene que poner.
        pista: |
          $h = 7$ m fija la velocidad de salida, y con ella el caudal y las
          pérdidas. Después, energía entre A y la salida de la boquilla.
        desarrollo: |
          $$
          v_B = \sqrt{2g\cdot 7} = 11{,}71\ \text{m/s}
          \qquad
          Q = 5{,}75\ \text{l/s}
          \qquad
          \frac{v_{1,2}^{2}}{2g} = 0{,}0668\ \text{m}
          $$
          $$
          70 + H_m = 75 + 7 + (190+125)\cdot 0{,}0668
          \;\Longrightarrow\;
          H_m = 33{,}03\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia del chorro
        pregunta: |
          ¿Cuánta potencia se lleva el chorro, en W?
        respuesta:
          tipo: magnitud
          valor: '394.43 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1861.07 W'
            mensaje: |
              Esa es la potencia **útil de la bomba**. El chorro solo se lleva
              la quinta parte: el resto se ha ido en subir el agua cinco
              metros y, sobre todo, en las pérdidas.
          - valor: '1466.6 W'
            mensaje: |
              Esa es la diferencia entre la potencia de la bomba y la del
              chorro, es decir lo que se pierde por el camino. Lo que se pide
              es lo que llega al chorro.
        pista: |
          $P = \gamma\,Q\,(v_B^{2}/2g)$.
        desarrollo: |
          $$
          P_{chorro} = 9800\cdot 5{,}75\cdot 10^{-3}\cdot 7 = 394{,}4\ \text{W}
          $$

          frente a los $1861$ W de la bomba: un rendimiento de instalación del
          **21 %**.

      - tipo: calcular
        titulo: El caudal que bombea la bomba
        pregunta: |
          Con el chorro a 20,5 m/s y la potencia útil fija, ¿cuánto bombea la
          bomba, en l/s?
        respuesta:
          tipo: magnitud
          valor: '3.37 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '10.06 l/s'
            mensaje: |
              Ese es el caudal que sale por la **boquilla**. La bomba solo
              pone un tercio; los otros dos tercios los aporta el depósito C
              por la tubería 3.
          - valor: '5.75 l/s'
            mensaje: |
              Ese es el caudal del apartado a), con la válvula cerrada. Al
              abrirla, la bomba pasa a dar menos caudal y más altura.
        pista: |
          $P = \gamma Q_1 H_m$ con $P$ fija, y la energía en el nudo N sale
          de la boquilla. Queda una ecuación en $Q_1$.
        desarrollo: |
          $$
          v_B = 20{,}5 \Rightarrow Q_B = 10{,}06\ \text{l/s}
          \qquad
          H_N = 75+21{,}44+125\cdot 0{,}2045 = 122{,}0\ \text{m}
          $$
          $$
          70+\frac{1861{,}07}{9800\,Q_1} - 190\,\frac{v_1^{2}}{2g} = 122{,}0
          \;\Longrightarrow\;
          Q_1 = 3{,}37\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La presión del depósito C
        pregunta: |
          ¿A qué presión está el depósito C, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '2.32'
          tolerancia: 0.03
          formato: un número en kilos por centímetro cuadrado
        distractores:
          - valor: '1.7'
            mensaje: |
              Esos son los 17 metros que le faltan a la cota de C —105— para
              llegar a la energía del nudo, 122. Falta añadir la pérdida de la
              tubería 3, que con 6,7 l/s son 6,17 m más.
          - valor: '0'
            mensaje: |
              Si C estuviera abierto a la atmósfera, su energía sería 105 m,
              menos que los 122 del nudo, y el agua iría de N a C en vez de al
              revés. Tiene que estar presurizado.
        pista: |
          $Q_3 = Q_B - Q_1$, y con él la pérdida de la tubería 3. Después,
          energía desde C hasta el nudo.
        desarrollo: |
          $$
          Q_3 = 10{,}06-3{,}37 = 6{,}69\ \text{l/s}
          \qquad
          40\,\frac{v_3^{2}}{2g} = 6{,}17\ \text{m}
          $$
          $$
          105+\frac{p_C}{\gamma} = 122{,}0+6{,}17
          \;\Longrightarrow\;
          \frac{p_C}{\gamma} = 23{,}17\ \text{m}
          $$
          $$
          p_C = 227{,}1\ \text{kPa} = 2{,}32\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la válvula cerrada, un chorro de 7 m exige 33,03 m de bomba
              y 1.861 W, de los que el chorro se lleva solo 394.
          - texto: >-
              Al pedir 20,5 m/s, el nudo necesita 122 m de energía, y la bomba
              —a potencia fija— responde con más altura y menos caudal: 3,37
              l/s.
          - texto: >-
              Los 6,69 l/s que faltan los pone el depósito C, que para ello ha
              de estar a 2,32 kg/cm².
          - texto: >-
              Como la bomba da menos caudal que antes, la instalación es menos
              eficiente en el segundo caso.
            trampa: true
            mensaje: |
              Es al revés: el chorro pasa de 394 a 2.115 W con la misma
              potencia de bomba, porque ahora buena parte de la energía la
              pone gratis el depósito C. La instalación no es menos eficiente:
              es que ha dejado de depender solo de la bomba. Medir la
              eficiencia por el caudal de la bomba en vez de por lo que sale
              del chorro es mirar la mitad del sistema.
    resolucion: |
      **a) Con la válvula cerrada.** La altura del chorro fija todo lo demás:

      $$
      v_B = \sqrt{2g\cdot 7} = 11{,}71\ \text{m/s}
      \qquad
      Q = 5{,}75\ \text{l/s}
      $$

      Los factores de paso de las tuberías 1 y 2 —190 y 125— ya incluyen el
      rozamiento de sus 750 y 500 metros, y a esa velocidad se llevan 21
      metros de los 33:

      $$
      70+H_m = 75+7+315\cdot 0{,}0668
      \qquad
      H_m = 33{,}03\ \text{m}
      \qquad
      P_{util} = 1861\ \text{W}
      $$

      **b) El chorro** se lleva $394{,}4$ W: el **21 %** de lo que da la
      bomba. El resto se va en subir cinco metros y en rozamiento.

      **c) Con la válvula abierta.** Aquí está la idea. La boquilla a 20,5 m/s
      pide 10,06 l/s y deja el nudo en 122 m de energía. La bomba, con la
      potencia útil congelada, tiene que dar esa altura, y para eso baja su
      caudal:

      $$
      70+\frac{1861}{9800\,Q_1}-190\frac{v_1^{2}}{2g} = 122
      \qquad
      Q_1 = 3{,}37\ \text{l/s}
      $$

      **d) El depósito C** pone los $6{,}69$ l/s que faltan, y para ello tiene
      que estar presurizado:

      $$
      p_C = 2{,}32\ \text{kg/cm}^{2}
      $$

      **Lo que hay que llevarse.** Una bomba a potencia constante es una
      hipérbola: puede dar mucho caudal con poca altura o poca altura con
      mucho caudal, pero no las dos. Cuando la instalación pide más altura, la
      bomba **retrocede** por su curva y el sistema tiene que buscar el caudal
      en otra parte. Aquí lo encuentra en un depósito elevado y presurizado, y
      el chorro pasa de 394 a 2.115 W sin tocar la bomba.

  # ── 4 (25 %) · Un tubo submarino partido en dos medias cañas que el helio
  #    tiende a abrir.
  - id: exflu1920-1par-4-el-tubo-de-helio-que-tiende-a-abrirse
    titulo: El tubo de helio partido en dos, y la junta que lo aguanta
    fuente: >-
      Ejercicio 4 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Un nuevo sistema transporta helio en estado gaseoso a 10 bar bajo un
      fluido. El tubo consta de 2 medios tubos; las dos partes tienen un radio
      $R = 2{,}5$ m, están articuladas independientemente en el punto A, hacen
      contacto en el punto B pero no están unidos. El tubo está ubicado a una
      profundidad de $h = 55$ m. El peso de cada fragmento del tubo es de 50
      kg por metro de longitud y su centro de gravedad se encuentra a $3R/5$
      del centro de la circunferencia. Despreciando el espesor de la tubería y
      tomando una tubería con una longitud de 1,75 m:

      **a)** Dibujar los prismas de presiones acotados de la fuerza
      hidrostática realizada por ambos fluidos sobre las paredes del tubo. Es
      suficiente con estudiar solo una parte del tubo.

      **b)** Calcular la fuerza (kN) hidrostática horizontal y vertical
      resultante ejercida por los fluidos en las paredes del tubo.

      **c)** ¿Funcionará este sistema de tubos para transportar helio?

      Ahora se analizará un caso en el que el nivel del fluido exterior ha
      aumentado. Tomando $h = 200$ m:

      **d)** Calcular las reacciones (kN) en el punto A. ¿Qué fuerza (kN)
      sufrirá la junta ubicada en el punto B?

      Datos: $s = 1{,}75$; $\rho_{aire} = 1{,}2\ \text{kg/m}^{3}$;
      $\rho_{He} = 0{,}2\ \text{kg/m}^{3}$.

      En la figura, $h$ se mide desde la superficie libre hasta el punto A,
      que es el punto **más alto** del tubo; B es el más bajo, y el corte
      entre las dos medias cañas es vertical.
    pide: Las fuerzas del fluido sobre media caña, si el sistema aguanta y las reacciones a 200 m.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos medias cañas «hacen contacto en B pero no están unidas».
          ¿Qué puede transmitir ese contacto?
        opciones:
          - texto: >-
              Solo compresión: puede empujar una media caña contra la otra,
              pero no tirar de ella
            correcta: true
            mensaje: |
              Eso es, y es todo el apartado c). Si el helio de dentro empuja
              hacia fuera más que el fluido de fuera hacia dentro, el contacto
              en B tendría que **tirar**, y no puede: el tubo se abre. Por eso
              a 55 m no funciona y a 200 sí.
          - texto: >-
              Cualquier fuerza, porque están en contacto
            mensaje: |
              Un contacto sin unión solo transmite compresión. Para transmitir
              tracción haría falta soldarlas, atornillarlas o ponerles una
              junta que trabaje a tracción, y el enunciado dice
              explícitamente que **no están unidos**.
          - texto: >-
              Solo tracción, porque es una junta
            mensaje: |
              Es justo al revés. Una junta atornillada trabajaría a tracción;
              un simple contacto, no. Aquí las dos superficies se tocan y
              nada más.

      - tipo: calcular
        titulo: La fuerza horizontal sobre media caña
        pregunta: |
          A 55 m, ¿cuánto vale la resultante horizontal sobre la media caña
          derecha, en kN?
        respuesta:
          tipo: magnitud
          valor: '121.41 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '8253 kN'
            mensaje: |
              Te has dejado el helio. Lo que empuja la pared es la
              **diferencia** entre la presión exterior y la interior, no la
              exterior sola; y a esta profundidad las dos casi se cancelan.
          - valor: '294.65 kN'
            mensaje: |
              Esa es la componente **vertical**. La horizontal es menor porque
              a 55 m la presión del mar y la del helio casi se igualan.
        pista: |
          La presión neta en el centro del tubo, por la proyección vertical
          $2R\,L$. Y $h$ se mide hasta el punto **más alto**.
        desarrollo: |
          El centro está a $55+2{,}5 = 57{,}5$ m:

          $$
          p_{ext} = 1{,}75\cdot 9800\cdot 57{,}5 = 986\,125\ \text{Pa}
          \qquad
          p_{He} = 10^{6}\ \text{Pa}
          $$
          $$
          F_H = (10^{6}-986\,125)\cdot 2R\,L
          = 13\,875\cdot 8{,}75 = 121{,}41\ \text{kN}\ (\rightarrow)
          $$

          hacia **fuera**: el helio gana.

      - tipo: calcular
        titulo: La fuerza vertical sobre media caña
        pregunta: |
          ¿Y la componente vertical, en kN?
        respuesta:
          tipo: magnitud
          valor: '294.65 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '121.41 kN'
            mensaje: |
              Esa es la horizontal. La vertical es mucho mayor porque el helio
              **no aporta nada** a ella: una presión uniforme sobre media caña
              no tiene resultante vertical, y lo que queda es el empuje del
              fluido exterior.
          - valor: '589.3 kN'
            mensaje: |
              Ese es el empuje sobre el tubo **entero**, las dos medias cañas.
              El enunciado dice que basta con estudiar una parte.
        pista: |
          La presión uniforme del helio no da resultante vertical sobre media
          caña; lo que queda es el empuje de Arquímedes de medio cilindro.
        desarrollo: |
          $$
          F_V = \gamma_{ext}\,\frac{\pi R^{2}}{2}\,L
          = 17\,150\cdot 9{,}817\cdot 1{,}75 = 294{,}65\ \text{kN}\ (\uparrow)
          $$

      - tipo: calcular
        titulo: La fuerza sobre la junta a doscientos metros
        pregunta: |
          Con $h = 200$ m, ¿qué fuerza soporta el contacto en B, en kN?
        respuesta:
          tipo: magnitud
          valor: '10819 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '21638 kN'
            mensaje: |
              Esa es la resultante horizontal sobre **una** media caña entera.
              El contacto en B se lleva la mitad; la otra mitad la absorbe la
              articulación en A.
          - valor: '121.41 kN'
            mensaje: |
              Esa es la fuerza a 55 m, donde el helio casi equilibraba al mar.
              A 200 m la presión exterior es tres veces y media mayor y la
              diferencia se dispara.
        pista: |
          A 200 m gana el mar. Calcula la resultante horizontal y reparte
          entre A y B.
        desarrollo: |
          El centro está a $202{,}5$ m:

          $$
          p_{ext} = 17\,150\cdot 202{,}5 = 3\,472\,875\ \text{Pa}
          $$
          $$
          F_H = (3\,472\,875-10^{6})\cdot 8{,}75 = 21\,638\ \text{kN}
          $$

          repartida entre A y B:

          $$
          R_{Bx} = \frac{21\,638}{2} = 10\,819\ \text{kN}\ (\rightarrow)
          $$

          Y en A, $R_{Ax} = 0$ por simetría y
          $R_{Ay} = 2\,(294{,}65-0{,}86) = 587{,}58$ kN hacia abajo.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              A 55 m, la presión del mar en el eje —986 kPa— es menor que la
              del helio —1.000 kPa—, así que la resultante horizontal apunta
              hacia fuera.
          - texto: >-
              El contacto en B solo puede transmitir compresión, así que no
              puede impedir que las dos mitades se separen.
          - texto: >-
              **No funcionará**: el fluido interior abre el conducto.
          - texto: >-
              Bastaría con bajar la presión del helio para que funcionara a
              cualquier profundidad.
            trampa: true
            mensaje: |
              Bastaría para que funcionara **a esa** profundidad, no a
              cualquiera. Y hay un límite por el otro lado: si el mar aprieta
              demasiado, como a 200 m, la junta soporta diez meganewton y el
              problema pasa a ser de resistencia. Un tubo partido en dos
              medias cañas sin unir solo vale en una **banda** de
              profundidades, y por encima de ella deja de ser un problema de
              apertura para ser uno de aplastamiento.
    resolucion: |
      **b) Las dos fuerzas, a 55 m.** El dato $h$ llega al punto más alto, así
      que el eje del tubo está a $57{,}5$ m.

      La **horizontal** es la diferencia de presiones en el eje por la
      proyección vertical de media caña:

      $$
      F_H = (10^{6}-986\,125)\cdot 2R\,L = 121{,}41\ \text{kN}\ (\rightarrow)
      $$

      La **vertical** es más limpia de lo que parece: una presión uniforme
      —la del helio— no tiene resultante vertical sobre media caña, porque
      las proyecciones de arriba y de abajo se cancelan. Lo único que queda
      es el empuje del fluido exterior sobre medio cilindro:

      $$
      F_V = \gamma_{ext}\,\frac{\pi R^{2}}{2}L = 294{,}65\ \text{kN}\ (\uparrow)
      $$

      **c) ¿Funciona?** No. A 55 m la presión del helio supera a la del mar en
      13,9 kPa, así que la resultante horizontal empuja cada media caña hacia
      **fuera**. El contacto en B solo puede transmitir compresión, no
      tracción: el conducto se abre.

      **d) A 200 m.** Ahora el mar gana con holgura:

      $$
      F_H = (3\,472\,875-10^{6})\cdot 8{,}75 = 21\,638\ \text{kN}
      $$

      que el contacto en B y la articulación en A se reparten a partes
      iguales: $R_{Bx} = 10\,819$ kN. En A, la horizontal se anula por
      simetría entre las dos mitades, y la vertical sostiene el empuje menos
      el peso de las dos medias cañas:

      $$
      R_{Ay} = 2\,(294{,}65-0{,}86) = 587{,}58\ \text{kN}\ (\downarrow)
      $$

      **La banda de profundidades.** Este tubo no funciona a 55 m porque se
      abre, y a 200 funciona pero su junta soporta **diez meganewton**. Es
      decir: solo sirve dentro de una franja, y esa franja la fija la presión
      del gas que transporta. Un conducto submarino de gas no se diseña para
      «el fondo del mar»: se diseña para una profundidad concreta.

  # ── 5 (17 %) · Un vaciado con cambio de sección, integrando por tramos.
  - id: exflu1920-1par-5-el-vaciado-con-cambio-de-seccion
    titulo: El vaciado que cambia de sección a mitad de camino
    fuente: >-
      Ejercicio 5 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Se estudia el vaciado de un tanque cerrado. La parte superior del tanque
      (entre las cotas de 140 cm y 90 cm) tiene una sección cuadrada, con un
      lado $L = 350$ mm; y la inferior (debajo de la cota de 90 cm) tiene una
      sección circular con un diámetro de $D = 150$ mm. El diámetro del
      orificio en el fondo del tanque es $d = 26$ mm y el coeficiente de
      descarga del orificio es $C_D = 0{,}71$.

      **a)** Deducir la expresión para el vaciado de la parte superior del
      tanque (la de sección cuadrada). Cuando comienza a vaciarse, el aire que
      está contenido en su parte superior tiene presión atmosférica y su
      proceso de expansión/compresión es isotermo. La expresión, sin necesidad
      de ser integrada, debe estar lo más simplificada posible.

      Se abre el depósito. Partiendo de los datos de la figura, calcular:

      **b)** Cota de la superficie libre del fluido después de $t = 6{,}5$ s.

      **c)** Cota de la superficie libre del fluido después de $t = 35$ s.

      En la figura, el nivel inicial del agua está en la cota 1,2 m y el
      orificio, en la cota 0.
    pide: La expresión del vaciado con el tanque cerrado, y las dos cotas con el tanque abierto.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tanque cambia de sección en la cota 0,9 m. ¿Cómo afecta eso al
          vaciado?
        opciones:
          - texto: >-
              Hay que integrar en dos tramos, porque el área de la superficie
              libre cambia de golpe al pasar la cota 0,9
            correcta: true
            mensaje: |
              Eso es. La ecuación del vaciado es
              $A(z)\,dz = -C_D A_0\sqrt{2gz}\;dt$, y $A(z)$ vale
              $0{,}1225\ \text{m}^{2}$ arriba y $0{,}0177$ abajo: casi siete
              veces menos. Por debajo de 0,9 el nivel se desploma.
          - texto: >-
              No afecta: lo que manda es la altura, no la sección
            mensaje: |
              La altura manda en la **velocidad** de salida, pero la sección
              manda en la **velocidad de bajada del nivel**. Con siete veces
              menos área, el mismo caudal baja el nivel siete veces más
              deprisa.
          - texto: >-
              Hay que usar la sección media de las dos
            mensaje: |
              No es un promedio: son dos tramos con dos leyes distintas, y hay
              que integrar cada uno por separado y encadenarlos por el tiempo.

      - tipo: calcular
        titulo: La cota a los seis segundos y medio
        pregunta: |
          ¿A qué cota está la superficie libre tras 6,5 s, en cm?
        respuesta:
          tipo: numero
          valor: '110.5'
          tolerancia: 0.5
          formato: un número en centímetros
        distractores:
          - valor: '120'
            mensaje: |
              Esa es la cota inicial. En seis segundos y medio el nivel ha
              bajado casi diez centímetros.
          - valor: '129.7'
            mensaje: |
              Has partido de la cota 1,4 m, que es la del techo del tanque. El
              agua empieza en 1,2.
        pista: |
          Integra $A\,dz = -C_D A_0\sqrt{2gz}\,dt$ con $A$ constante: sale
          $2A(\sqrt{z_0}-\sqrt{z}) = C_D A_0\sqrt{2g}\;t$.
        desarrollo: |
          $$
          C_D A_0\sqrt{2g} = 0{,}71\cdot 5{,}309\cdot 10^{-4}\cdot 4{,}427
          = 1{,}6689\cdot 10^{-3}
          $$
          $$
          2\cdot 0{,}1225\,(\sqrt{1{,}2}-\sqrt{z}) = 1{,}6689\cdot 10^{-3}\cdot 6{,}5
          $$
          $$
          \sqrt{z} = 1{,}05117
          \qquad
          z = 1{,}105\ \text{m}
          $$

      - tipo: calcular
        titulo: Cuánto tarda en llegar al cambio de sección
        pregunta: |
          ¿Cuánto tarda el nivel en bajar de 1,2 a 0,9 m, en segundos?
        respuesta:
          tipo: magnitud
          valor: '21.5 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '6.5 s'
            mensaje: |
              Ese es el tiempo del apartado anterior, en el que el nivel solo
              había bajado a 1,105 m. Faltan otros veinte centímetros.
          - valor: '35 s'
            mensaje: |
              Ese es el tiempo total del apartado c), que incluye también el
              tramo estrecho.
        pista: |
          La misma expresión, con $z$ desde 1,2 hasta 0,9.
        desarrollo: |
          $$
          t_1 = \frac{2\cdot 0{,}1225\,(\sqrt{1{,}2}-\sqrt{0{,}9})}
          {1{,}6689\cdot 10^{-3}} = 21{,}5\ \text{s}
          $$

      - tipo: calcular
        titulo: La cota a los treinta y cinco segundos
        pregunta: |
          ¿A qué cota está la superficie libre tras 35 s, en cm?
        respuesta:
          tipo: numero
          valor: '9.82'
          tolerancia: 0.3
          formato: un número en centímetros
        distractores:
          - valor: '0'
            mensaje: |
              Todavía no se ha vaciado. Al orificio le quedan casi diez
              centímetros de agua encima, y como la velocidad de salida va con
              la raíz de la altura, el final se hace lento.
          - valor: '90'
            mensaje: |
              Esa es la cota del cambio de sección, a la que se llega a los
              21,5 s. En los 13,5 s siguientes el nivel se desploma, porque la
              sección estrecha tiene siete veces menos área.
        pista: |
          A los 21,5 s el nivel está en 0,9 m; los 13,5 s restantes hay que
          integrarlos con la sección circular.
        desarrollo: |
          $$
          2\cdot 0{,}017671\,(\sqrt{0{,}9}-\sqrt{z})
          = 1{,}6689\cdot 10^{-3}\cdot 13{,}455
          $$
          $$
          \sqrt{z} = 0{,}31335
          \qquad
          z = 0{,}0982\ \text{m} = 9{,}82\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el tanque abierto, la ecuación del vaciado es
              $A(z)\,dz = -C_D A_0\sqrt{2gz}\;dt$.
          - texto: >-
              En el tramo cuadrado, $A = 0{,}1225\ \text{m}^{2}$, el nivel baja
              de 1,2 a 0,9 en 21,5 s.
          - texto: >-
              En el circular, con $A = 0{,}0177\ \text{m}^{2}$, los 13,5 s que
              quedan lo llevan hasta 9,82 cm.
          - texto: >-
              Como el tramo estrecho tiene menos sección, el agua sale por el
              orificio más despacio.
            trampa: true
            mensaje: |
              El caudal de salida no depende de la sección del **tanque**:
              depende de la altura y del orificio, $Q = C_D A_0\sqrt{2gz}$.
              Lo que cambia con la sección es la **velocidad a la que baja el
              nivel**, y en el tramo estrecho baja siete veces más deprisa
              para el mismo caudal. De hecho el caudal va disminuyendo, porque
              disminuye la altura.
    resolucion: |
      **a) El tanque cerrado.** Mientras el depósito está cerrado, el aire de
      arriba se expande y su presión baja, así que la carga sobre el orificio
      no es solo la columna. Con expansión isoterma, $p V = p_0 V_0$ y

      $$
      A\,dz = -C_D A_0\sqrt{2g\Bigl(z+\frac{p-p_{atm}}{\gamma}\Bigr)}\;dt
      \qquad
      p = p_{atm}\frac{V_0}{V_0+A\,(z_0-z)}
      $$

      **b) y c) El tanque abierto.** Ahora la carga es solo $z$, y hay que
      integrar por tramos porque la sección cambia:

      $$
      2A\,(\sqrt{z_0}-\sqrt{z}) = C_D A_0\sqrt{2g}\;t
      $$

      | tramo | $A$ (m²) | de | a | tiempo |
      |---|---|---|---|---|
      | cuadrado | 0,1225 | 1,20 m | 0,90 m | 21,5 s |
      | circular | 0,0177 | 0,90 m | 0,098 m | 13,5 s |

      A los **6,5 s** el nivel está en $110{,}5$ cm, y a los **35 s** en
      $9{,}82$ cm.

      **Y el número que enseña el ejercicio.** El primer medio metro de
      descenso cuesta 21 segundos y los ochenta centímetros siguientes solo
      13, pese a que el caudal va **bajando**. La razón no es hidráulica sino
      geométrica: la sección estrecha tiene siete veces menos área, así que el
      mismo caudal la vacía siete veces más deprisa. En un depósito de sección
      variable, la curva de vaciado dice más de la forma del recipiente que
      del orificio.
