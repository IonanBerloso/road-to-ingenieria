      <figcaption>

      Las dos mitades **no están unidas en B**: solo se tocan. Por eso el
      apartado c) tiene respuesta negativa —la presión interior tiende a
      separarlas por abajo— y por eso B aparece marcado aparte en el dibujo.

      </figcaption>
      </figure>
    pide: Las fuerzas del fluido sobre media caña, si el sistema aguanta y las reacciones a 200 m.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos medias cañas «hacen contacto en B pero no están unidas».
          ¿Qué puede transmitir ese contacto?
        opciones:
          - texto: >-
              Solo compresión: puede empujar una media caña contra la otra,
              pero no tirar de ella
            correcta: true
            mensaje: |
              Eso es, y es todo el apartado c). Si el helio de dentro empuja
              hacia fuera más que el fluido de fuera hacia dentro, el contacto
              en B tendría que **tirar**, y no puede: el tubo se abre. Por eso
              a 55 m no funciona y a 200 sí.
          - texto: >-
              Cualquier fuerza, porque están en contacto
            mensaje: |
              Un contacto sin unión solo transmite compresión. Para transmitir
              tracción haría falta soldarlas, atornillarlas o ponerles una
              junta que trabaje a tracción, y el enunciado dice
              explícitamente que **no están unidos**.
          - texto: >-
              Solo tracción, porque es una junta
            mensaje: |
              Es justo al revés. Una junta atornillada trabajaría a tracción;
              un simple contacto, no. Aquí las dos superficies se tocan y
              nada más.

      - tipo: dibujar
        consigna: |
          El apartado a) en papel, para la media caña derecha a 55 m: el
          prisma de presiones del fluido exterior y el del helio sobre su
          pared, acotados, y lo que queda de los dos al restarlos. Dibújalo
          antes de calcular nada: el apartado b) sale de leer lo que queda.
        comprueba:
          - punto: >-
              El prisma del fluido exterior, perpendicular a la pared y
              apuntando hacia dentro, creciendo con la profundidad: 943,25 kPa
              en A, 986,13 kPa a la altura del eje y 1029 kPa en B.
            porque: >-
              Es $\gamma h$ con $\gamma = 1{,}75\cdot 9800 = 17\,150$ N/m³ y
              $h$ medida desde la lámina, no desde A: 55, 57,5 y 60 m. Una
              presión es normal a la pared, y en un círculo todas las normales
              pasan por el centro: el prisma sobre el arco es radial.
          - punto: >-
              El prisma del helio, uniforme: 1000 kPa en toda la pared,
              apuntando hacia fuera.
            porque: >-
              En 5 m de altura el peso del gas cambia su presión en
              $\rho_{He}\,g\,2R = 9{,}8$ Pa, una cienmilésima de los 10 bar: el
              dato $\rho_{He} = 0{,}2$ sirve para comprobarlo, no hace falta en
              ninguna cuenta.
          - punto: >-
              Lo que queda de los dos sobre la proyección vertical AB: 56,75
              kPa hacia fuera en A, cero a 3,31 m por debajo de A y 29 kPa
              hacia dentro en B.
            porque: >-
              La componente horizontal sobre una superficie curva es la de su
              proyección vertical, y restar los prismas antes de integrar evita
              restar dos fuerzas de más de 8000 kN. El cero se acota: es donde
              el fluido iguala al helio, a $10^{6}/17\,150 = 58{,}31$ m de
              profundidad. Integrado, son los 121,41 kN hacia fuera del
              apartado b).
          - punto: >-
              Para la vertical, el medio disco sombreado entre el arco y el
              diámetro AB, con su fuerza hacia arriba: 294,65 kN; y cero del
              helio.
            porque: >-
              El fluido aprieta hacia abajo el cuarto de arriba y hacia arriba
              el de abajo, cada uno con el peso de la columna que tiene encima
              hasta la lámina, 55 m más arriba; lo que no se anula entre los
              dos es el fluido que cabría en el medio cilindro. La presión
              uniforme del helio no deja resultante vertical sobre media caña.
        figura: |
          <svg viewBox="0 0 508 306" role="img" width="508" height="306" aria-labelledby="flu1920-1par-4-prismas-t flu1920-1par-4-prismas-d">
            <title id="flu1920-1par-4-prismas-t">Los prismas de presiones sobre la media caña derecha del tubo de helio, a 55 m, acotados</title>
            <desc id="flu1920-1par-4-prismas-d">Dos dibujos de la media caña derecha del tubo, de 2,5 metros de radio, con A arriba, B abajo y el diámetro AB de trazos. En el primero, los dos prismas, perpendiculares a la pared: por fuera, el del fluido exterior, apuntando hacia dentro y un poco más ancho abajo que arriba, 943,25 kilopascales en A, 986,13 a la altura del eje y 1029,00 en B; por dentro, el del helio, de ancho constante, 1000 kilopascales apuntando hacia fuera. A esta escala los dos casi se tapan. En el segundo, lo que queda de los dos sobre la proyección vertical AB, veinticinco veces más grande: 56,75 kilopascales hacia fuera en A, que bajan en línea recta hasta cero a 3,31 metros por debajo de A y siguen hasta 29,00 kilopascales hacia dentro en B; en total 121,41 kilonewtons hacia fuera. Al lado, el medio disco entre el arco y el diámetro, sombreado, con su fuerza vertical de 294,65 kilonewtons hacia arriba; el helio no da vertical.</desc>
