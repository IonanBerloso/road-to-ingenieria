      - tipo: calcular
        titulo: La fuerza horizontal sobre media caña
        pregunta: |
          A 55 m, ¿cuánto vale la resultante horizontal sobre la media caña
          derecha, en kN?
        respuesta:
          tipo: magnitud
          valor: '121.41 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '8629 kN'
            mensaje: |
              Te has dejado el helio: esa es la fuerza del fluido exterior
              solo, 986 125 Pa en el eje por los 8,75 m² de la proyección. Lo
              que empuja la pared es la **diferencia** entre la presión
              exterior y la interior; y a esta profundidad las dos casi se
              cancelan.
          - valor: '294.65 kN'
            mensaje: |
              Esa es la componente **vertical**. La horizontal es menor porque
              a 55 m la presión del mar y la del helio casi se igualan.
        pista: |
          La presión neta en el centro del tubo, por la proyección vertical
          $2R\,L$. Y $h$ se mide hasta el punto **más alto**.
        desarrollo: |
          El centro está a $55+2{,}5 = 57{,}5$ m:

          $$
          p_{ext} = 1{,}75\cdot 9800\cdot 57{,}5 = 986\,125\ \text{Pa}
          \qquad
          p_{He} = 10^{6}\ \text{Pa}
          $$
          $$
          F_H = (10^{6}-986\,125)\cdot 2R\,L
          = 13\,875\cdot 8{,}75 = 121{,}41\ \text{kN}\ (\rightarrow)
          $$

          hacia **fuera**: el helio gana.

      - tipo: calcular
        titulo: La fuerza vertical sobre media caña
        pregunta: |
          ¿Y la componente vertical, en kN?
        respuesta:
          tipo: magnitud
          valor: '294.65 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '121.41 kN'
            mensaje: |
              Esa es la horizontal. La vertical es mucho mayor porque el helio
              **no aporta nada** a ella: una presión uniforme sobre media caña
              no tiene resultante vertical, y lo que queda es el empuje del
              fluido exterior.
          - valor: '589.3 kN'
            mensaje: |
              Ese es el empuje sobre el tubo **entero**, las dos medias cañas.
              El enunciado dice que basta con estudiar una parte.
        pista: |
          La presión uniforme del helio no da resultante vertical sobre media
          caña; lo que queda es el empuje de Arquímedes de medio cilindro.
        desarrollo: |
          $$
          F_V = \gamma_{ext}\,\frac{\pi R^{2}}{2}\,L
          = 17\,150\cdot 9{,}817\cdot 1{,}75 = 294{,}65\ \text{kN}\ (\uparrow)
          $$

      - tipo: calcular
        titulo: La fuerza sobre la junta a doscientos metros
        pregunta: |
          Con $h = 200$ m, ¿qué fuerza soporta el contacto en B, en kN?
        respuesta:
          tipo: magnitud
          valor: '10819 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '21638 kN'
            mensaje: |
              Esa es la resultante horizontal sobre **una** media caña entera.
              Tomando momentos en A, el contacto en B se lleva la mitad, porque
              está el doble de lejos que el centro por donde pasa la
              resultante; la otra mitad la absorbe la articulación en A.
          - valor: '121.41 kN'
            mensaje: |
              Esa es la fuerza a 55 m, donde el helio casi equilibraba al mar.
              A 200 m la presión exterior es tres veces y media mayor y la
              diferencia se dispara.
        pista: |
          A 200 m gana el mar. Toma momentos en A: la resultante de las
          presiones pasa por el centro O, a $R$ por debajo de A, y el contacto
          B está a $2R$.
        desarrollo: |
          El centro está a $202{,}5$ m:

          $$
          p_{ext} = 17\,150\cdot 202{,}5 = 3\,472\,875\ \text{Pa}
          $$
          $$
          F_H = (3\,472\,875-10^{6})\cdot 8{,}75 = 21\,637{,}7\ \text{kN}\ (\leftarrow)
          $$

          Todas las presiones son normales al arco y pasan por O, así que su
          resultante también: respecto de A, la vertical no tiene brazo y la
          horizontal tiene $R$. El peso de la media caña,
          $W = 50\cdot 1{,}75\cdot 9{,}8 = 857{,}5$ N, está a $3R/5$ del
          centro, en horizontal (con esa lectura sale el resultado impreso).
          Momentos en A:

          $$
          R_{Bx}\cdot 2R = F_H\cdot R + W\cdot\tfrac{3R}{5}
          \;\Longrightarrow\;
          R_{Bx} = \frac{F_H}{2} + 0{,}3\,W = 10\,818{,}8 + 0{,}26
          = 10\,819{,}09\ \text{kN}\ (\rightarrow)
          $$

          Y en A: la horizontal de cada mitad es $F_H - R_{Bx}$, igual y
          contraria en las dos, así que $R_{Ax} = 0$; y la vertical sostiene
          el empuje menos el peso de las dos,
          $R_{Ay} = 2\,(294{,}65-0{,}86) = 587{,}58$ kN hacia abajo.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              A 55 m, la presión del mar en el eje —986 kPa— es menor que la
              del helio —1.000 kPa—, así que la resultante horizontal apunta
              hacia fuera.
          - texto: >-
              El contacto en B solo puede transmitir compresión, así que no
              puede impedir que las dos mitades se separen.
          - texto: >-
              **No funcionará**: el fluido interior abre el conducto.
          - texto: >-
              Bastaría con bajar la presión del helio para que funcionara a
              cualquier profundidad.
            trampa: true
            mensaje: |
              Bastaría para que funcionara **a esa** profundidad, no a
              cualquiera. Y hay un límite por el otro lado: si el mar aprieta
              demasiado, como a 200 m, la junta soporta diez meganewton y el
              problema pasa a ser de resistencia. Un tubo partido en dos
              medias cañas sin unir solo vale en una **banda** de
              profundidades, y por encima de ella deja de ser un problema de
              apertura para ser uno de aplastamiento.
    resolucion: |
      **a) Los prismas, en la media caña derecha.** El fluido exterior empuja
      normal a la pared y hacia dentro con $\gamma h$: 943,25 kPa en A, a 55
      m; 986,13 kPa a la altura del eje; 1029 kPa en B, a 60 m. El helio
      empuja hacia fuera con 1000 kPa en toda la pared. Restados sobre la
      proyección vertical AB, queda un trapecio que cambia de signo: 56,75
      kPa hacia fuera en A, cero a 3,31 m bajo A y 29 kPa hacia dentro en B.
      La vertical es el medio disco entre el arco y AB.

      **b) Las dos fuerzas, a 55 m.** El dato $h$ llega al punto más alto, así
      que el eje del tubo está a $57{,}5$ m.

      La **horizontal** es la diferencia de presiones en el eje por la
      proyección vertical de media caña:

      $$
      F_H = (10^{6}-986\,125)\cdot 2R\,L = 121{,}41\ \text{kN}\ (\rightarrow)
      $$

      La **vertical** es más limpia de lo que parece: una presión uniforme
      —la del helio— no tiene resultante vertical sobre media caña, porque
      las proyecciones de arriba y de abajo se cancelan. Lo único que queda
      es el empuje del fluido exterior sobre medio cilindro:

      $$
      F_V = \gamma_{ext}\,\frac{\pi R^{2}}{2}L = 294{,}65\ \text{kN}\ (\uparrow)
      $$

      **c) ¿Funciona?** No. A 55 m la presión del helio supera a la del mar en
      13,9 kPa, así que la resultante horizontal empuja cada media caña hacia
      **fuera**. El contacto en B solo puede transmitir compresión, no
      tracción: el conducto se abre.

      **d) A 200 m.** Ahora el mar gana con holgura:

      $$
      F_H = (3\,472\,875-10^{6})\cdot 8{,}75 = 21\,637{,}7\ \text{kN}
      $$

      hacia dentro. La resultante de las presiones pasa por el centro O,
      porque todas son normales al arco, y O está a $R$ por debajo de A;
      el contacto B, a $2R$. Con el peso de la media caña a $3R/5$ del
      centro, momentos en A:

      $$
      R_{Bx} = \frac{F_H}{2} + 0{,}3\,W = 10\,818{,}8 + 0{,}26
      = 10\,819{,}09\ \text{kN}\ (\rightarrow)
      $$

      El peso casi no cuenta, pero es lo que da la última cifra impresa. En
      A, la horizontal de cada mitad es igual y contraria a la de la otra, y
      se anula; la vertical sostiene el empuje menos el peso de las dos
      medias cañas:

      $$
      R_{Ay} = 2\,(294{,}65-0{,}86) = 587{,}58\ \text{kN}\ (\downarrow)
      $$

      **La banda de profundidades.** Este tubo no funciona a 55 m porque se
      abre, y a 200 funciona pero su junta soporta **diez meganewton**. Es
      decir: solo sirve dentro de una franja, y esa franja la fija la presión
      del gas que transporta. Un conducto submarino de gas no se diseña para
      «el fondo del mar»: se diseña para una profundidad concreta.

  # ── 5 (17 %) · Un vaciado con cambio de sección, integrando por tramos.
  - id: exflu1920-1par-5-el-vaciado-con-cambio-de-seccion
    titulo: El vaciado que cambia de sección a mitad de camino
    fuente: >-
      Ejercicio 5 · Primer parcial, 8 de mayo de 2020 · Mecánica de Fluidos,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica el
      resultado pero no la resolución.
    nivel: examen
    enunciado: |
      La figura muestra el vaciado de un tanque cerrado. La parte superior del
      tanque (entre las cotas de 140 cm y 90 cm) tiene una sección cuadrada,
      con un lado $L = 350$ mm; y la inferior (debajo de la cota de 90 cm)
      tiene una sección circular con un diámetro de $D = 150$ mm. El diámetro
      del orificio en el fondo del tanque es $d = 26$ mm y el coeficiente de
      descarga del orificio es $C_D = 0{,}71$.

      **a)** **Deduce** la expresión para el vaciado de la parte superior del
      tanque (la de sección cuadrada), **añadiendo los puntos** que consideres
      útiles en la figura. Cuando comienza a vaciarse el aire que está
      contenido en su parte superior tiene presión atmosférica y su proceso
      de expansión/compresión es isotermo. La expresión, sin necesidad de ser
      integrada, debe estar lo más simplificada posible.

      Se abre el depósito. Partiendo de los datos de la figura, calcular:

      **b)** Cota de la superficie libre del fluido después de $t = 6{,}5$ s.

      **c)** Cota de la superficie libre del fluido después de $t = 35$ s.

      **Notas nuestras.** La figura, redibujada abajo, es un tanque en forma
      de T: la parte cuadrada de lado $L$ arriba y la circular de diámetro $D$
      abajo, con el orificio $d$ en el fondo, y a la derecha las cotas 1,4 m
      (el techo), 1,2 m (la lámina al empezar), 0,9 m (el cambio de sección) y
      0 m (el orificio). Por encima de la lámina queda el aire. Las cotas de
      los resultados se miden desde el orificio.

