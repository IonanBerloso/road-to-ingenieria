        <circle cx="180" cy="160" r="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="6"/>
        <text x="180" y="166" text-anchor="middle" font-size="14" fill="var(--faint)">He</text>
        <line x1="180" y1="94" x2="180" y2="226" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="172" y="120" text-anchor="end" font-size="9.5" fill="var(--faint)">corte vertical</text>

        <circle cx="180" cy="94" r="5" fill="var(--ink)"/>
        <text x="190" y="90" font-size="11" fill="var(--ink)">A</text>
        <circle cx="180" cy="226" r="5" fill="var(--flag)"/>
        <text x="190" y="240" font-size="11" fill="var(--flag)">B</text>

        <line x1="118" y1="46" x2="118" y2="94" stroke="var(--faint)" stroke-width="1"/>
        <line x1="112" y1="46" x2="124" y2="46" stroke="var(--faint)" stroke-width="1"/>
        <line x1="112" y1="94" x2="176" y2="94" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
