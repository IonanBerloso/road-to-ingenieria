        <text x="290" y="266" font-size="10" fill="var(--faint)">0 m</text>

        <defs>
          <marker id="fp5a" viewBox="0 0 9 9" refX="4.5" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M9 0 L0 4.5 L9 9 z" fill="var(--faint)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      El cambio de sección a los 90 cm es lo que parte el problema en dos: por
      encima vacía un cuadrado y por debajo un círculo, con la misma ley pero
      distinta área. Y el aire de arriba **está atrapado**, así que se comprime
      mientras baja el nivel.

      </figcaption>
      </figure>
    notas:
      - >-
        **NOTA**: Los resultados sin deducción de la expresión **NO SON
        VÁLIDOS**.
    pide: La expresión del vaciado con el tanque cerrado, y las dos cotas con el tanque abierto.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tanque cambia de sección en la cota 0,9 m. ¿Cómo afecta eso al
          vaciado?
        opciones:
          - texto: >-
              Hay que integrar en dos tramos, porque el área de la superficie
              libre cambia de golpe al pasar la cota 0,9
            correcta: true
            mensaje: |
              Eso es. La ecuación del vaciado es
              $A(z)\,dz = -C_D A_0\sqrt{2gz}\;dt$, y $A(z)$ vale
              $0{,}1225\ \text{m}^{2}$ arriba y $0{,}0177$ abajo: casi siete
              veces menos. Por debajo de 0,9 el nivel se desploma.
          - texto: >-
              No afecta: lo que manda es la altura, no la sección
            mensaje: |
              La altura manda en la **velocidad** de salida, pero la sección
              manda en la **velocidad de bajada del nivel**. Con siete veces
              menos área, el mismo caudal baja el nivel siete veces más
              deprisa.
          - texto: >-
              Hay que usar la sección media de las dos
            mensaje: |
              No es un promedio: son dos tramos con dos leyes distintas, y hay
              que integrar cada uno por separado y encadenarlos por el tiempo.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado a) en papel: la expresión del vaciado del tramo
          cuadrado con el depósito **cerrado**. Marca en la figura los puntos
          que uses —la lámina y la salida del orificio— y escribe la presión
          del aire en función del nivel con la isoterma. El enunciado la
          quiere sin integrar y lo más simplificada posible, y su nota avisa
          de que sin esta deducción los resultados no valen.
        rubrica: tiempo-de-vaciado
        veredicto: |
          Si en tu folio la carga sobre el orificio lleva la presión del aire
          como función del nivel —el aire pasa de 0,2 m de altura a
          $1{,}4 - z$ a temperatura constante— y la ecuación del vaciado queda
          con su signo y sin integrar, tienes el apartado. Si has dejado la
          presión del aire constante, has deducido la del depósito abierto,
          que es la de los apartados siguientes y no la de este.

      - tipo: calcular
        titulo: La cota a los seis segundos y medio
        pregunta: |
          ¿A qué cota está la superficie libre tras 6,5 s, en cm?
        respuesta:
          tipo: numero
          valor: '110.5'
          tolerancia: 0.5
          formato: un número en centímetros
        distractores:
          - valor: '120'
            mensaje: |
              Esa es la cota inicial. En seis segundos y medio el nivel ha
              bajado casi diez centímetros.
          - valor: '129.7'
            mensaje: |
              Has partido de la cota 1,4 m, que es la del techo del tanque. El
              agua empieza en 1,2.
        pista: |
          Integra $A\,dz = -C_D A_0\sqrt{2gz}\,dt$ con $A$ constante: sale
          $2A(\sqrt{z_0}-\sqrt{z}) = C_D A_0\sqrt{2g}\;t$.
        desarrollo: |
          $$
          C_D A_0\sqrt{2g} = 0{,}71\cdot 5{,}309\cdot 10^{-4}\cdot 4{,}427
          = 1{,}6689\cdot 10^{-3}
          $$
          $$
          2\cdot 0{,}1225\,(\sqrt{1{,}2}-\sqrt{z}) = 1{,}6689\cdot 10^{-3}\cdot 6{,}5
          $$
          $$
          \sqrt{z} = 1{,}05117
          \qquad
          z = 1{,}105\ \text{m}
          $$

      - tipo: calcular
        titulo: Cuánto tarda en llegar al cambio de sección
        pregunta: |
          ¿Cuánto tarda el nivel en bajar de 1,2 a 0,9 m, en segundos?
        respuesta:
          tipo: magnitud
          valor: '21.5 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '6.5 s'
            mensaje: |
              Ese es el tiempo del apartado anterior, en el que el nivel solo
              había bajado a 1,105 m. Faltan otros veinte centímetros.
          - valor: '35 s'
            mensaje: |
              Ese es el tiempo total del apartado c), que incluye también el
              tramo estrecho.
        pista: |
          La misma expresión, con $z$ desde 1,2 hasta 0,9.
        desarrollo: |
          $$
          t_1 = \frac{2\cdot 0{,}1225\,(\sqrt{1{,}2}-\sqrt{0{,}9})}
          {1{,}6689\cdot 10^{-3}} = 21{,}5\ \text{s}
          $$

      - tipo: calcular
        titulo: La cota a los treinta y cinco segundos
        pregunta: |
          ¿A qué cota está la superficie libre tras 35 s, en cm?
        respuesta:
          tipo: numero
          valor: '9.82'
          tolerancia: 0.3
          formato: un número en centímetros
        distractores:
          - valor: '0'
            mensaje: |
              Has vaciado con la sección circular desde el principio: con ella
              el tanque entero se vaciaría en 23 s. Pero por encima de la cota
              0,9 la sección es el cuadrado, siete veces mayor, y ese tramo
              solo se acaba a los 21,5 s; a los 35 todavía quedan casi diez
              centímetros sobre el orificio.
          - valor: '73.45'
            mensaje: |
              Has seguido con la sección cuadrada los 35 s enteros. A los
              21,5 s el nivel pasa la cota 0,9 y la sección se estrecha a la
              circular: desde ahí hay que integrar con ella, y el nivel baja
              siete veces más deprisa.
        pista: |
          A los 21,5 s el nivel está en 0,9 m; los 13,5 s restantes hay que
          integrarlos con la sección circular.
        desarrollo: |
          $$
          2\cdot 0{,}017671\,(\sqrt{0{,}9}-\sqrt{z})
          = 1{,}6689\cdot 10^{-3}\cdot 13{,}455
          $$
          $$
          \sqrt{z} = 0{,}31335
          \qquad
          z = 0{,}0982\ \text{m} = 9{,}82\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el tanque abierto, la ecuación del vaciado es
              $A(z)\,dz = -C_D A_0\sqrt{2gz}\;dt$.
          - texto: >-
              En el tramo cuadrado, $A = 0{,}1225\ \text{m}^{2}$, el nivel baja
              de 1,2 a 0,9 en 21,5 s.
          - texto: >-
              En el circular, con $A = 0{,}0177\ \text{m}^{2}$, los 13,5 s que
              quedan lo llevan hasta 9,82 cm.
          - texto: >-
              Como el tramo estrecho tiene menos sección, el agua sale por el
              orificio más despacio.
            trampa: true
            mensaje: |
              El caudal de salida no depende de la sección del **tanque**:
              depende de la altura y del orificio, $Q = C_D A_0\sqrt{2gz}$.
              Lo que cambia con la sección es la **velocidad a la que baja el
              nivel**, y en el tramo estrecho baja siete veces más deprisa
              para el mismo caudal. De hecho el caudal va disminuyendo, porque
              disminuye la altura.
    resolucion: |
      **a) El tanque cerrado.** Mientras el depósito está cerrado, el aire de
      arriba se expande y su presión baja, así que la carga sobre el orificio
      no es solo la columna. Con la lámina en 1 y la salida del orificio en
      2, Bernoulli en un instante y el caudal real dan

      $$
      A\,dz = -C_D A_0\sqrt{2g\Bigl(z+\frac{p-p_{atm}}{\gamma}\Bigr)}\;dt
      $$

      con $A = L^{2}$. El aire empieza a presión atmosférica ocupando los
      0,2 m que hay entre la lámina (1,2 m) y el techo (1,4 m); con la lámina
      en $z$ ocupa $1{,}4-z$, y la isoterma, $p\,(1{,}4-z) = p_{atm}\cdot 0{,}2$,
      da

      $$
      \frac{p-p_{atm}}{\gamma} = -\frac{p_{atm}}{\gamma}\,\frac{1{,}2-z}{1{,}4-z}
      $$

      Separando variables, la expresión que se pide, sin integrar:

      $$
      t = \frac{L^{2}}{C_D A_0\sqrt{2g}}\int_{z}^{1{,}2}
      \sqrt{\frac{1{,}4-\zeta}{\zeta\,(1{,}4-\zeta)-\frac{p_{atm}}{\gamma}\,(1{,}2-\zeta)}}\;d\zeta
      $$

      con $\zeta$ la cota de la lámina mientras baja de 1,2 m a $z$.

      Lo que dice antes de hacer ninguna cuenta: el denominador se anula en
      cuanto la depresión del aire iguala a la columna. Si el fluido fuese
      agua a 1 atm, con $p_{atm}/\gamma = 10{,}33$ m, pasaría en $z = 1{,}174$
      m: el depósito cerrado dejaría de vaciarse tras bajar menos de tres
      centímetros. Por eso los apartados siguientes lo abren.

      **b) y c) El tanque abierto.** Ahora la carga es solo $z$, y hay que
      integrar por tramos porque la sección cambia:

      $$
      2A\,(\sqrt{z_0}-\sqrt{z}) = C_D A_0\sqrt{2g}\;t
      $$

      | tramo | $A$ (m²) | de | a | tiempo |
      |---|---|---|---|---|
      | cuadrado | 0,1225 | 1,20 m | 0,90 m | 21,5 s |
      | circular | 0,0177 | 0,90 m | 0,098 m | 13,5 s |

      A los **6,5 s** el nivel está en $110{,}5$ cm, y a los **35 s** en
      $9{,}82$ cm.

      **Y el número que enseña el ejercicio.** Los primeros treinta
      centímetros de descenso cuestan 21,5 segundos y los ochenta siguientes
      solo 13,5, pese a que el caudal va **bajando**. La razón no es hidráulica sino
      geométrica: la sección estrecha tiene siete veces menos área, así que el
      mismo caudal la vacía siete veces más deprisa. En un depósito de sección
      variable, la curva de vaciado dice más de la forma del recipiente que
      del orificio.
