asignatura: fluidos
curso: '2019-2020'
convocatoria: primer-parcial
fecha: 8 de mayo de 2020
# **Los cinco ejercicios.** Del cuadernillo «Exámenes 2020-2025» del
# departamento, págs. 1 a 4 (7 a 10 del PDF), y el examen más antiguo que
# recoge.
#
# Como el resto del cuadernillo, publica el resultado de cada apartado y
# nada más (`pdfEs: enunciado-con-resultados`), y no imprime reparto por
# competencia sino el porcentaje de cada ejercicio junto a su número: 18 /
# 20 / 20 / 25 / 17, que suman 100 (comprobado en las págs. 7, 8 y 9 del
# PDF). Por eso los ejercicios van sin `puntos`.
#
# Lo que este examen aporta al corpus:
#
# - **Una trampa de temperatura absoluta** (ej. 1): «$T_1 = 2T_0$» con
#   $T_0 = 25$ ºC significa 50 ºC, no 596 K, y la ley de los gases exige
#   pasar a kelvin **después**. Quien duplique los kelvin obtiene 8,77
#   kg/cm² en vez de 4,279.
# - **Un laboratorio submarino** (ej. 2), donde la presión del aire se fija
#   por la columna que se quiere dejar en el acceso, y de ahí sale la
#   profundidad máxima antes de que el mar entre.
# - **Una red con un depósito presurizado como incógnita** (ej. 3): la
#   bomba mantiene su potencia útil, así que al pedirle más chorro da menos
#   caudal, y la diferencia la pone el depósito C.
# - **Un tubo submarino partido en dos medias cañas** (ej. 4) que el helio
#   de dentro tiende a abrir; a 55 m no funciona y a 200 sí, y la junta
#   inferior pasa a soportar diez meganewton.
# - **Un vaciado con cambio de sección** (ej. 5), donde hay que integrar por
#   tramos y saber en cuál se está a los 35 segundos, y cuya nota avisa de
#   que sin la deducción los resultados no valen.
pdf: examenes-2020-2025.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (18%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 18 }
    - { n: 2, puntos: 20 }
    - { n: 3, puntos: 20 }
    - { n: 4, puntos: 25 }
    - { n: 5, puntos: 17 }

ejercicios:
