ejercicios:
  # ── 1 (10 %) · Estática. Es el ejercicio que parece de calentamiento y no lo
  #    es: todo depende de entender que un manómetro mide respecto de lo que
  #    tiene alrededor, y aquí lo que tiene alrededor es un depósito
  #    presurizado a 33 metros de columna.
  - id: exflu2526-ord-1-el-manometro-dentro-del-deposito-presurizado
    titulo: Un manómetro dentro de un depósito presurizado
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución: el desarrollo es nuestro,
      reconstruido y comprobado contra los números impresos.
    nivel: examen
    enunciado: |
      Un fluido de densidad relativa $s = 1{,}2$ se almacena en un depósito de
      diámetro $D = 50\ \text{cm}$ que, a su vez, se encuentra dentro de otro
      depósito, lleno de aire y presurizado $p_1 = 2430\ \text{Torr}$. Para
      controlar la presión del fluido el depósito interior cuenta con un
      manómetro en U con mercurio. Se quiere cambiar este manómetro por un
      manómetro Bourdon ($p_2$) ubicado a la misma altura que el manómetro en
      U, como se puede ver en la imagen.

      a) Determinar la lectura del manómetro $p_2$ ($\text{kg/cm}^{2}$).

      b) Determinar la lectura del manómetro $p_2$ (bar) si midiese presiones
      absolutas.

      c) Determinar las dos lecturas anteriores, si finalmente se decide
      extraer el manómetro fuera del depósito 1, conectado al mismo punto.

      Datos: $a = 4\ \text{cm}$; $R = 10\ \text{cm}$.

      **Notas nuestras.** La imagen del cuadernillo no se reproduce, y dice
      esto. El depósito 1 es el exterior, el del aire a 2430 Torr, y el 2 es el
      interior, el del fluido. El manómetro en U y el Bourdon $p_2$ están los
      dos dentro del depósito 1, y la rama abierta del manómetro en U
      desemboca en su aire. $a$ es la columna del fluido $s$ entre la toma y la
      superficie del mercurio, y $R$ el desnivel del mercurio. Fuera del
      depósito 1, un barómetro marca $75\ \text{cmHg}$.
    pide: Las tres lecturas del manómetro Bourdon, dentro y fuera del depósito exterior.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro Bourdon está **dentro** del depósito 1, que está a
          2430 Torr. ¿Respecto de qué mide?
        opciones:
          - texto: >-
              Respecto del aire que lo rodea, es decir del depósito 1: un
              manómetro relativo mide siempre la diferencia con la presión de
              su entorno
            correcta: true
            mensaje: |
              Exacto, y es todo el ejercicio. La cápsula del Bourdon se deforma
              por la diferencia entre lo que entra por la toma y lo que hay
              fuera de la cápsula; si lo que hay fuera son 33 metros de columna
              de aire comprimido, eso es lo que descuenta.
          - texto: >-
              Respecto de la atmósfera exterior, porque los manómetros son
              siempre relativos a la presión atmosférica
            mensaje: |
              «Relativo» no significa «relativo a la atmósfera»: significa
              relativo **al ambiente del aparato**. Si el aparato está dentro
              de un recinto presurizado, la atmósfera de la calle no interviene.
              Ese es justamente el cambio que introduce el apartado c).
          - texto: >-
              Respecto del vacío, porque el manómetro está sellado
            mensaje: |
              Un manómetro que midiera respecto del vacío sería un manómetro
              **absoluto**, y entonces el apartado b) no tendría sentido como
              pregunta aparte. El Bourdon corriente no está sellado por fuera.

      - tipo: calcular
        titulo: La lectura dentro del depósito
        pregunta: |
          ¿Qué marca el manómetro $p_2$ colocado dentro del depósito 1?
        respuesta:
          tipo: magnitud
          valor: '0.1312 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.436 kg/cm2'
            mensaje: |
              Esa es la presión del fluido **respecto de la atmósfera**, que es
              lo que marcaría el manómetro sacado fuera —el apartado c)—. Dentro
              del depósito 1 el aparato descuenta los 2430 Torr del aire que lo
              rodea.
          - valor: '0.1408 kg/cm2'
            mensaje: |
              Has sumado la columna del fluido $s$ en vez de restarla. Bajando
              de la toma a la superficie del mercurio la presión **aumenta**, y
              subiendo por el mercurio hasta el aire del depósito 1 **baja**:
              los dos términos van con signos contrarios.
        pista: |
          Recorre el manómetro desde la toma hasta la rama abierta y quédate
          solo con las columnas: la del fluido $s$ y la de mercurio. La presión
          del depósito 1 se cancela con la que el manómetro descuenta.
        desarrollo: |
          $$
          p_2 = \gamma_{Hg}R - \gamma_s a
          = 9800\,(13{,}6\cdot 0{,}10 - 1{,}2\cdot 0{,}04)
          $$
          $$
          = 9800\cdot 1{,}312 = 12\,858\ \text{Pa}
          = 0{,}1312\ \text{kg/cm}^{2}
          $$

          Trece centímetros de columna de agua: el manómetro en U y el Bourdon
          miden lo mismo, que es lo que el enunciado quiere comprobar antes de
          cambiar uno por otro.

      - tipo: calcular
        titulo: La misma lectura en absoluto
        pregunta: |
          ¿Y si ese mismo manómetro midiera presiones absolutas?
        respuesta:
          tipo: magnitud
          valor: '4.365 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.368 bar'
            mensaje: |
              Esa es la presión del fluido relativa a la atmósfera. Para pasar
              a absoluta falta sumar la atmosférica del barómetro,
              $75\ \text{cmHg} = 10{,}2$ mca.
          - valor: '1.128 bar'
            mensaje: |
              Has sumado la atmosférica a la lectura del apartado a), y esa
              lectura ya venía descontada del depósito 1. La absoluta se
              construye desde cero: aire del depósito 1, más lo que el fluido
              está por encima de él, más la atmosférica.
        pista: |
          Absoluta $=$ presión del depósito 1 $+$ lectura del apartado a) $+$
          atmosférica local.
        desarrollo: |
          $$
          p_1 = 2430\ \text{Torr} = 33{,}04\ \text{mca}
          \qquad
          p_{at} = 75\ \text{cmHg} = 10{,}20\ \text{mca}
          $$
          $$
          p_{2,\text{abs}} = 33{,}04 + 1{,}31 + 10{,}20 = 44{,}54\ \text{mca}
          = 4{,}37\ \text{bar}
          $$

      - tipo: calcular
        titulo: El manómetro sacado fuera
        pregunta: |
          Si el manómetro se saca del depósito 1 y se conecta al mismo punto,
          ¿qué marca ahora en relativas?
        respuesta:
          tipo: magnitud
          valor: '3.435 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.1312 kg/cm2'
            mensaje: |
              Esa era la lectura de dentro. Al sacarlo, el aparato deja de
              tener alrededor los 2430 Torr del depósito 1 y pasa a tener la
              atmósfera: descuenta 33 metros de columna menos.
          - valor: '4.456 kg/cm2'
            mensaje: |
              Esa es la presión **absoluta**. El manómetro sacado fuera sigue
              siendo relativo: descuenta la atmosférica.
        pista: |
          Es la absoluta del apartado b) menos la atmosférica.
        desarrollo: |
          $$
          p_2 = 44{,}54 - 10{,}20 = 34{,}35\ \text{mca}
          = 3{,}435\ \text{kg/cm}^{2}
          $$

          Y en absolutas sigue marcando lo mismo que antes, **4,37 bar**: la
          presión absoluta del fluido no depende de dónde esté el aparato.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Un manómetro relativo mide la diferencia con la presión de su
              entorno, no con la atmósfera.
          - texto: >-
              Dentro del depósito 1 el entorno son 2430 Torr, así que marca
              solo la columna manométrica: 0,131 kg/cm².
          - texto: >-
              Fuera, el entorno es la atmósfera, y marca 3,44 kg/cm²: veintiséis
              veces más, sin que la presión del fluido haya cambiado en nada.
          - texto: >-
              Por eso, para conocer la presión del fluido, es más fiable el
              manómetro colocado dentro del depósito.
            trampa: true
            mensaje: |
              Los dos dan la misma información si sabes dónde están; ninguno es
              más fiable. Lo que este ejercicio enseña es que **una lectura sin
              su referencia no significa nada**: 0,131 y 3,44 kg/cm² describen
              exactamente el mismo estado del fluido. El error de examen no es
              medir mal, es apuntar el número sin apuntar respecto de qué.

    resolucion: |
      **El único concepto que hay que tener claro.** Un manómetro relativo mide
      la diferencia entre lo que le entra por la toma y **la presión que rodea
      al aparato**. Casi siempre ese entorno es la atmósfera y por eso se dice
      «presión manométrica» como sinónimo de «relativa a la atmósfera»; aquí no
      lo es, y el ejercicio entero vive de esa distinción.

      **a) Dentro.** Recorriendo el manómetro en U desde la toma hasta la rama
      que desemboca en el aire del depósito 1, la presión del depósito se
      cancela contra la que el Bourdon descuenta, y queda solo la columna:

      $$
      p_2 = \gamma_{Hg}R - \gamma_s a = 1{,}312\ \text{mca}
      = 0{,}131\ \text{kg/cm}^{2}
      $$

      **b) En absolutas.** Se suma todo lo que hay debajo: el aire del depósito
      1 (2430 Torr $=$ 33,04 mca), la columna manométrica (1,31) y la
      atmosférica del barómetro (10,20 mca):

      $$
      p_{2,\text{abs}} = 44{,}54\ \text{mca} = 4{,}37\ \text{bar}
      $$

      **c) Fuera.** La presión absoluta del fluido no ha cambiado —el fluido no
      se ha enterado de que han movido el aparato—, así que en absolutas sigue
      marcando 4,37 bar. En relativas, en cambio, ahora descuenta la atmósfera
      en vez del depósito 1:

      $$
      p_2 = 44{,}54 - 10{,}20 = 34{,}35\ \text{mca} = 3{,}44\ \text{kg/cm}^{2}
      $$

      **Los tres números juntos, que es lo que hay que llevarse:**

      | | relativa | absoluta |
      |---|---|---|
      | manómetro dentro del depósito 1 | 0,131 kg/cm² | 4,37 bar |
      | manómetro fuera | 3,44 kg/cm² | 4,37 bar |

      La columna de la derecha es la misma porque describe el fluido. La de la
      izquierda cambia porque describe **una diferencia**, y la diferencia
      depende de con qué se compara.

  # ── 2 (12,5 %) · Bombeo. El ejercicio más completo del examen: hay que
  #    construir la curva de la instalación con Hazen-Williams, cruzarla con
  #    tres bombas, descartar una por caudal y otra por cavitación, y después
  #    calcular lo que cuesta arreglar la que cavita.
  - id: exflu2526-ord-2-elegir-la-bomba-entre-tres
    titulo: Elegir la bomba entre tres, y la que cavita
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se debe elegir una bomba para una instalación de distribución de agua
      potable entre dos depósitos abiertos a la atmósfera y un desnivel entre
      ambos de $40\ \text{m}$, siendo la cota del depósito de origen inferior a
      la de destino. La tubería es de PVC, su diámetro es de $150\ \text{mm}$ y
      su longitud total es de $850\ \text{m}$. La válvula de regulación estará
      en principio abierta siendo $k_0 = 5$.

      Se dispone de tres modelos de bombas cuyas curvas características
      ($H/Q$, $P_{abs}/Q$ y $NPSH_{req}/Q$) han sido proporcionadas por el
      comercial mediante sus correspondientes expresiones analíticas:

      | | $H_m$- $Q$ (mca; l/s) | $P_{abs}$ – $Q$ (kW; l/s) | $NPSH_{req}$ – $Q$ (mca; l/s) |
      |---|---|---|---|
      | **Bomba 1** | $76{,}5 - 0{,}2108\cdot Q^{2}$ | $8 + 0{,}026\cdot Q + 0{,}015\cdot Q^{2}$ | $1{,}8 + 0{,}00611\cdot Q^{2}$ |
      | **Bomba 2** | $83 - 0{,}155\cdot Q^{2}$ | $6 + 0{,}019\cdot Q + 0{,}032\cdot Q^{2}$ | $2 + 0{,}0118\cdot Q^{2}$ |
      | **Bomba 3** | $80 - 0{,}127\cdot Q^{2}$ | $6 + 0{,}0042\cdot Q + 0{,}0112\cdot Q^{2}$ | $2{,}2 + 0{,}0002\cdot Q^{2}$ |

      a) Elegir la bomba que mejor se ajuste a las necesidades del servicio,
      considerando que el caudal mínimo debe ser $14\ \text{l/s}$ y que,
      atendiendo a la topografía, la bomba debe situarse $5\ \text{m}$ por
      encima del depósito inferior. En caso de más de una opción posible,
      elegir aquella de menor coste.

      Se manipula la válvula de regulación en la instalación cuya bomba cavita,
      hasta que desaparece la cavitación.

      b) Calcula analíticamente la pérdida que supone esta maniobra y acompaña
      el cálculo con un esquema gráfico.

      Datos: $\eta_{\text{bomba}} = 75\ \%$; $\eta_{\text{mot.eléctr.}} = 90\ \%$;
      coste del kW·h = 0,2 €; $p_{atm}/\gamma = 10$ mca;
      $p_{vapor}/\gamma = 0{,}2$ mca; $L_{\text{asp}} = 100$ m.
    notas:
      - >-
        **NOTA**: Para el cálculo de las pérdidas, emplear la ecuación de
        Hazen-Williams.
    pide: La bomba elegida, la pérdida que introduce la válvula en la que cavita y su esquema gráfico.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres bombas y dos criterios. ¿En qué orden se aplican?
        opciones:
          - texto: >-
              Primero los criterios de viabilidad —caudal mínimo y ausencia de
              cavitación—, y solo entre las que quedan se compara el coste
            correcta: true
            mensaje: |
              Eso es. El coste solo desempata entre opciones **posibles**; una
              bomba barata que cavita o que no da el caudal no es una opción
              barata, es ninguna opción.
          - texto: >-
              Primero el coste, y después se comprueba si la más barata cumple
            mensaje: |
              Funciona si la más barata cumple, y no es el caso: aquí la de
              menor potencia absorbida es la 3 y **también** es viable, pero
              eso hay que comprobarlo, no suponerlo. El orden que propone la
              opción falla en cuanto la barata no sirve.
          - texto: >-
              Se elige la de mayor altura, porque es la que garantiza llegar al
              depósito superior
            mensaje: |
              La altura a caudal cero no dice nada del punto de funcionamiento:
              la bomba 2 es la de mayor $H_0$ y es la que cavita. Lo que
              importa es dónde corta la curva de la instalación.

      - tipo: calcular
        titulo: El caudal con la bomba 3
        pregunta: |
          ¿Qué caudal da la bomba 3 en esta instalación?
        respuesta:
          tipo: magnitud
          valor: '16.55 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.75 l/s'
            mensaje: |
              Te has quedado con los 40 m de desnivel y has olvidado las
              pérdidas. Los 850 m de tubería más la válvula abierta piden
              4,7 m más a ese caudal, y eso desplaza el corte.
          - valor: '12.58 l/s'
            mensaje: |
              Ese es el caudal de la bomba **1**, y es justamente el que la
              descarta: queda por debajo de los 14 l/s exigidos.
        pista: |
          Curva de la instalación: $40 + J_1 L\,Q^{1{,}852} + k_0 v^{2}/2g$,
          con $C_{HW} = 140$ para el PVC. Iguala a la de la bomba.
        desarrollo: |
          Con $C_{HW} = 140$ (PVC, cuadro n.º 25) y $D = 150$ mm:

          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}{140^{1{,}852}\cdot 150^{4{,}87}}
          = 3{,}245\cdot 10^{-5}
          $$
          $$
          H_{\text{inst}} = 40 + 0{,}02758\,Q^{1{,}852}
          + 8{,}17\cdot 10^{-4}\,Q^{2}
          $$

          Igualando a $80 - 0{,}127Q^{2}$ sale $Q = 16{,}55$ l/s, holgadamente
          por encima de los 14 pedidos.

      - tipo: calcular
        titulo: El NPSH disponible de la bomba 2
        pregunta: |
          Con la bomba 2 en su punto de funcionamiento ($15{,}71$ l/s), ¿de
          cuánto NPSH dispone?
        respuesta:
          tipo: magnitud
          valor: '4.27 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '4.8 mca'
            mensaje: |
              Te has dejado la pérdida de la aspiración. Cien de los 850 m
              están antes de la bomba, y a 15,7 l/s cuestan 0,53 m.
          - valor: '9.27 mca'
            mensaje: |
              Te has dejado los 5 m de cota. La bomba está **por encima** del
              depósito, así que aspira en depresión y esos cinco metros se
              restan.
        pista: |
          Al $p_{at}/\gamma$ hay que restarle la presión de vapor, la cota de
          aspiración y la pérdida de carga de la aspiración. La bomba está
          5 m por encima del depósito.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 3{,}245\cdot 10^{-5}\cdot 100\cdot 15{,}71^{1{,}852}
          = 0{,}53\ \text{m}
          $$
          $$
          NPSH_d = 10 - 0{,}2 - 5 - 0{,}53 = 4{,}27\ \text{mca}
          $$
          $$
          NPSH_{req} = 2 + 0{,}0118\cdot 15{,}71^{2} = 4{,}91\ \text{mca}
          $$

          $NPSH_d < NPSH_{req}$: **la bomba 2 cavita.**

      - tipo: calcular
        titulo: La pérdida que hay que meter en la válvula
        pregunta: |
          Cerrando la válvula hasta que la bomba 2 deje de cavitar, ¿qué
          pérdida adicional hay que introducir?
        respuesta:
          tipo: magnitud
          valor: '8.09 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '8.8 m'
            mensaje: |
              Parece que has cerrado hasta los 14 l/s del caudal mínimo. La
              condición aquí es otra: cerrar **lo justo** para que
              $NPSH_d = NPSH_{req}$, y eso ocurre a 14,15 l/s.
          - valor: '11.98 m'
            mensaje: |
              Has restado a la altura de la bomba solo el desnivel de 40 m, sin
              las pérdidas de la instalación. La válvula únicamente tiene que
              disipar lo que sobra después de descontar todo lo demás.
        pista: |
          Busca el caudal al que $NPSH_d = NPSH_{req}$, y a ese caudal resta:
          lo que da la bomba menos lo que pide la instalación.
        desarrollo: |
          Igualando disponible y requerido,

          $$
          10 - 0{,}2 - 5 - 3{,}245\cdot 10^{-3}Q^{1{,}852}
          = 2 + 0{,}0118\,Q^{2}
          \;\Longrightarrow\;
          Q = 14{,}15\ \text{l/s}
          $$

          y a ese caudal,

          $$
          H_{\text{bomba}} = 83 - 0{,}155\cdot 14{,}15^{2} = 51{,}98\ \text{m}
          \qquad
          H_{\text{inst}} = 43{,}89\ \text{m}
          $$
          $$
          \Delta H_{V} = 51{,}98 - 43{,}89 = 8{,}09\ \text{m}
          $$

          Que es exactamente lo que publica el examen.

      - tipo: dibujar
        consigna: |
          El esquema gráfico que pide el apartado b), en unos ejes $H$–$Q$
          (m; l/s): la curva de la bomba que cavita, la de la instalación con
          la válvula abierta y con la válvula maniobrada, y la pérdida de la
          maniobra como un segmento. Debajo, con el mismo eje de caudales, las
          dos curvas de $NPSH$, que son las que deciden hasta dónde hay que
          cerrar.
        comprueba:
          - punto: >-
              La curva de la **bomba 2**, $83 - 0{,}155\,Q^{2}$, y no la de la 3.
            porque: >-
              La maniobra se hace «en la instalación cuya bomba cavita», y la
              que cavita es la 2. La 3 es la elegida y no cavita, así que no
              hay maniobra que dibujar con ella: con su curva el 8,09 no sale.
          - punto: >-
              La instalación con la válvula abierta, que arranca en 40 m a
              caudal nulo y corta a la bomba 2 en 15,71 l/s.
            porque: >-
              Los 40 m son el desnivel, y la curva sale de ahí porque sin caudal
              no hay pérdidas. El corte es el punto que cavita: sin él no se ve
              de dónde parte la maniobra.
          - punto: >-
              El caudal nuevo, 14,15 l/s, sacado del cruce de $NPSH_d$ y
              $NPSH_{req}$, y no de los 14 l/s del caudal mínimo.
            porque: >-
              La válvula se cierra hasta que desaparece la cavitación, no hasta
              el mínimo del servicio. El panel de abajo lo enseña: al bajar el
              caudal el disponible sube y el requerido baja, y se cruzan en
              14,15. Cerrando hasta 14 l/s se quemarían 8,8 m, más de los
              necesarios.
          - punto: >-
              La instalación con la válvula maniobrada, más empinada, que sale
              también de 40 m y pasa por el punto nuevo (14,15 l/s; 51,98 m).
            porque: >-
              Cerrar la válvula sube el coeficiente de pérdidas de la
              instalación, no su desnivel: la curva sigue saliendo de 40 m y
              solo se empina. Si la tuya sale de más arriba, has dibujado otra
              instalación.
          - punto: >-
              El segmento vertical en 14,15 l/s entre la instalación abierta
              (43,89 m) y la bomba (51,98 m): $\Delta H_V = 8{,}09$ m.
            porque: >-
              Es el resultado del apartado, dibujado: lo que la bomba da a ese
              caudal menos lo que la instalación necesitaría con la válvula
              abierta. Esa diferencia es lo que la válvula tiene que disipar.
        figura: |
          <svg viewBox="0 0 380 468" role="img" width="380" height="468" aria-labelledby="flu2526-2-t flu2526-2-d">
