            <desc id="flu2526-2-d">Dos gráficas con el mismo eje de caudales, Q en litros por segundo de 0 a 24. Arriba, alturas H en metros de 0 a 90: la curva de la bomba 2, que baja desde 83 m a caudal nulo; la curva de la instalación con la válvula abierta, que sale de 40 m y sube despacio, y corta a la bomba en 15,71 l/s, el punto que cavita; y la curva de la instalación con la válvula maniobrada, que sale también de 40 m pero sube mucho más deprisa y corta a la bomba en 14,15 l/s y 51,98 m. A ese caudal, un segmento vertical va de la curva de la instalación abierta, en 43,89 m, a la de la bomba: es la pérdida de la maniobra, 8,09 m. Abajo, NPSH en metros de 0 a 8: el disponible baja despacio desde 4,8 m y el requerido por la bomba 2 sube desde 2 m; se cruzan en 14,15 l/s, y a la derecha de ese caudal la bomba cavita. Una vertical de trazos marca ese caudal en las dos gráficas.</desc>
