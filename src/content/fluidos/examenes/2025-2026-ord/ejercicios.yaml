        <desc id="flu2526-4-d">A la izquierda, un depósito cerrado con un manómetro PA arriba, una capa de aire y debajo el fluido de densidad relativa s1. La altura H va de la lámina libre al eje de la tubería de salida, marcado con una línea de trazos; el depósito lleva una línea de corte porque su altura no está a escala. Del lado derecho del depósito, cerca del fondo, sale la tubería D1, horizontal. Poco antes de la máquina, una sonda baja de una pequeña cámara de aire que lleva encima el manómetro PB: el tubo atraviesa la pared de arriba de la tubería, llega al eje y se dobla hacia la izquierda, con la boca abierta mirando al depósito, de cara al fluido que llega. Dentro del tubo el líquido sube hasta una altura h1 sobre el eje, y por encima hay aire hasta la cámara. Después viene una máquina rotulada T/B con un signo de interrogación, y detrás la tubería D2, del doble de diámetro. En D2 hay una sonda doble en el eje: un tubo abre de frente al flujo y otro, paralelo y con la punta cerrada, tiene orificios en el costado; los dos bajan por debajo de la tubería y forman las dos ramas de un manómetro en U con un líquido de densidad relativa sm en el fondo. Ese líquido queda más bajo en la rama del tubo que abre de frente y más alto en la otra, con un desnivel a. Al final, una válvula y una boquilla de diámetro Dboq que descarga un chorro a la atmósfera. Los diámetros, h1 y a están dibujados en proporción entre sí; la altura del depósito y las longitudes de tubería, no.</desc>
