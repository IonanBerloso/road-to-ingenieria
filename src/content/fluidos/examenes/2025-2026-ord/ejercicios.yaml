        veredicto: >-
          Si tu esquema tiene la bomba 2, las dos instalaciones saliendo de
          40 m y el segmento en 14,15 l/s, el apartado b) está entero: la cuenta
          y el dibujo dicen lo mismo. Si has dibujado la bomba 3, relee el
          enunciado: la maniobra es «en la instalación cuya bomba cavita», y es
          la 2. Si has puesto el segmento en 14 l/s, vuelve al panel de $NPSH$:
          es el que fija el caudal.

      - tipo: justificar
        pregunta: Ordena la elección. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba 1 corta la curva de la instalación en 12,58 l/s, por
              debajo de los 14 exigidos: queda descartada por caudal.
          - texto: >-
              La bomba 2 da 15,71 l/s, pero su $NPSH$ requerido es de 4,91 m
              frente a los 4,27 disponibles: cavita, y queda descartada.
          - texto: >-
              La bomba 3 da 16,55 l/s sin cavitar —2,25 requeridos frente a
              4,21 disponibles— y absorbe 9,14 kW frente a los 14,20 de la 2:
              es la elegida.
          - texto: >-
              Y la bomba 2 sería aceptable cerrando la válvula, porque así deja
              de cavitar y sigue dando más caudal que la 3.
            trampa: true
            mensaje: |
              Cerrando deja de cavitar, sí, pero baja a **14,15 l/s** —menos
              que los 16,55 de la bomba 3— y sigue absorbiendo más potencia.
              Es decir: menos caudal, más consumo y una válvula estrangulada
              disipando 8,09 m de forma permanente. El apartado b) existe
              precisamente para poner número a lo mala que es esa opción.

    resolucion: |
      **La curva de la instalación.** Dos depósitos abiertos con 40 m de
      desnivel, 850 m de PVC y una válvula con $k_0 = 5$. Con
      $C_{HW} = 140$ —el que el cuadro n.º 25 asigna al PVC de 150 mm,
      porque su rugosidad relativa vale $4{,}7\cdot 10^{-5}$ y cae en la
      banda que va de $1{,}5\cdot 10^{-5}$ a $2\cdot 10^{-4}$—:

      $$
      H_{\text{inst}} = 40 + 0{,}02758\,Q^{1{,}852}
      + 8{,}17\cdot 10^{-4}\,Q^{2}
      $$

      **a) El descarte, bomba a bomba.**

      | | $Q$ (l/s) | $NPSH_{req}$ | $NPSH_{disp}$ | $P_{abs}$ | |
      |---|---|---|---|---|---|
      | Bomba 1 | 12,58 | 2,77 | 4,45 | 10,70 kW | **no llega a 14 l/s** |
      | Bomba 2 | 15,71 | 4,91 | 4,27 | 14,20 kW | **cavita** |
      | Bomba 3 | 16,55 | 2,25 | 4,21 | 9,14 kW | **elegida** |

      El $NPSH$ disponible es casi el mismo en las tres —depende de la
      instalación, no de la bomba— y lo que las separa es el requerido, que es
      dato de catálogo. La bomba 2 lo tiene disparado: su
      $0{,}0118\,Q^{2}$ crece sesenta veces más deprisa que el
      $0{,}0002\,Q^{2}$ de la 3.

      Y de propina, la elegida es también la más barata: 9,14 kW absorbidos
      frente a 14,20. **No hay que ceder nada**, lo que no siempre pasa.

      **b) Lo que cuesta rescatar la bomba 2.** Cerrando la válvula el caudal
      baja, y con él la pérdida de aspiración y el $NPSH$ requerido. La
      cavitación desaparece cuando los dos $NPSH$ se igualan, y eso ocurre a
      $Q = 14{,}15$ l/s. A ese caudal la bomba da 51,98 m y la instalación pide
      43,89: la válvula tiene que disipar

      $$
      \Delta H_V = 8{,}09\ \text{m}
      $$

      **Y la lectura de proyecto.** Ocho metros de columna disipados sin parar
      en un tornillo, para conseguir menos caudal del que da la bomba correcta
      y gastando más. Es la ilustración perfecta de por qué el criterio del
      apartado a) es el bueno: **estrangular arregla la cavitación pero no
      arregla la elección.**

      **Y una advertencia sobre el coeficiente de Hazen-Williams.** El PVC
      tiene $\varepsilon = 0{,}0007$ cm, así que con $D = 150$ mm sale
      $\varepsilon/D = 4{,}7\cdot 10^{-5}$: la banda del cuadro n.º 25 que le
      corresponde es $1{,}5\cdot 10^{-5} < \varepsilon/D \le 2\cdot 10^{-4}$,
      es decir $C_{HW} = 140$. **No 150**, que es la banda de las tuberías
      todavía más lisas. Tomar 150 baja las pérdidas un 12 %, mueve el caudal
      de la bomba 3 de 16,55 a 16,68 l/s y da 7,88 m de válvula en vez de los
      8,09 publicados. Con el coeficiente correcto el número sale exacto, y
      esa coincidencia es la mejor comprobación de que la banda es la buena.

  # ── 3 (10 %) · Empuje y gases. Sale del temario habitual: es Arquímedes en
  #    aire, con la densidad del aire calculada por la ley de los gases y
  #    variando con la altura. Un ejercicio bonito y una trampa de unidades: la
  #    masa viene en UTM.
  - id: exflu2526-ord-3-el-globo-aerostatico
    titulo: El globo aerostático, y a qué temperatura hay que calentar el aire
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Los globos aerostáticos vuelan por estar sumergidos en aire de mayor
      densidad.

      El globo aerostático de la imagen es capaz de transportar hasta 6
      personas. El volumen del globo es de $4000\ \text{m}^{3}$ y se mantiene
      constante. Su masa, incluyendo tela, cuerda, canasta y quemadores es de
      $25\ \text{UTM}$. El peso medio por persona es de $75\ \text{kg}$. El
      volumen de la cesta y las personas no influye en el proceso.

      La presión atmosférica se puede calcular con la siguiente expresión:

      $p_{atm} = 1 - 9\cdot 10^{-5}\cdot Z$ [$p_{atm}$ en atm; $Z$ en m]

      La temperatura a nivel del suelo el día elegido para volar es de
      $23\ °C$ y la expresión que define la temperatura en función de la
      altura es:

      $T_Z = T_0 - (2\cdot Z/300)$ [$T$ en °C; $Z$ en m]

      ¿A qué temperatura hay que calentar el aire del interior del globo si
      queremos que se eleve a 825 metros?

      Datos: $R_{\text{aire}} = 287\ \text{J/(kg}\cdot\text{K)}$.
    pide: La temperatura del aire interior para flotar a 825 m.

    pasos:
      - tipo: reconocer
        pregunta: |
          La masa de la estructura viene en **UTM**. ¿Qué es eso?
        opciones:
          - texto: >-
              La unidad técnica de masa: la masa que pesa un kilopondio por cada
              $9{,}8\ \text{m/s}^{2}$, es decir $1\ \text{UTM} = 9{,}8$ kg
            correcta: true
            mensaje: |
              Eso es. Es la unidad de masa del sistema técnico, donde la
              **fuerza** es la magnitud fundamental y la masa la derivada. 25
              UTM son 245 kg, no 25.
          - texto: >-
              Una forma antigua de escribir «tonelada métrica»
            mensaje: |
              No: una tonelada son mil kilos y 25 toneladas de tela y cestería
              no las levanta ningún globo. La UTM vale 9,8 kg.
          - texto: >-
              Lo mismo que el kilogramo, solo que en el sistema técnico
            mensaje: |
              En el sistema técnico el kilogramo es una **fuerza**, el
              kilopondio. La unidad de masa es otra, y es precisamente la que
              hace que $F = ma$ siga siendo cierta con esas unidades:
              $1\ \text{kp} = 1\ \text{UTM}\cdot 9{,}8\ \text{m/s}^{2}$.

      - tipo: calcular
        titulo: La densidad del aire a 825 m
        pregunta: |
          ¿Cuál es la densidad del aire exterior a esa altura?
        respuesta:
          tipo: magnitud
          valor: '1.1245 kg/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '1.1922 kg/m3'
            mensaje: |
              Esa es la del aire a nivel del suelo, con 1 atm y 23 °C. A 825 m
              la presión ha bajado un 7,4 % y la temperatura 5,5 grados: los
              dos efectos van en sentidos contrarios y gana el de la presión.
          - valor: '18.67 kg/m3'
            mensaje: |
              Has metido la temperatura en grados centígrados. La ley de los
              gases pide **kelvin**: $17{,}5\ °C = 290{,}65$ K, y confundirlos
              multiplica la densidad por dieciséis.
        pista: |
          $\rho = p/(RT)$, con la presión y la temperatura evaluadas a 825 m y
          en unidades del SI.
        desarrollo: |
          $$
          p = (1 - 9\cdot 10^{-5}\cdot 825)\ \text{atm} = 0{,}92575\
          \text{atm} = 93\,802\ \text{Pa}
          $$
          $$
          T = 23 - \frac{2\cdot 825}{300} = 17{,}5\ °C = 290{,}65\ \text{K}
          $$
          $$
          \rho = \frac{93\,802}{287\cdot 290{,}65} = 1{,}1245\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La temperatura del aire interior
        pregunta: |
          ¿A qué temperatura, en grados centígrados, hay que calentar el aire
          de dentro? (solo el número)
        respuesta:
          tipo: numero
          valor: '70.6'
          tolerancia: 0.6
          formato: una temperatura en grados centígrados, solo el número
        distractores:
          - valor: '34.2'
            mensaje: |
              Te has dejado a las seis personas. Son $6\cdot 75 = 450$ kg, casi
              el doble de la estructura, y son la razón de que haya que
              calentar tanto.
          - valor: '51.8'
            mensaje: |
              Has tomado las 25 UTM como 25 kg. Son 245 kg: la unidad técnica
              de masa vale $9{,}8$ kilos.
        pista: |
          Equilibrio: el empuje del aire exterior sostiene la estructura, las
          personas y el aire caliente de dentro. Despeja $\rho_{int}$ y vuelve
          a la ley de los gases.
        desarrollo: |
          $$
          \rho_{ext}V = m_{\text{estructura}} + m_{\text{personas}} +
          \rho_{int}V
          $$
          $$
          1{,}1245\cdot 4000 = 245 + 450 + 4000\,\rho_{int}
          \;\Longrightarrow\;
          \rho_{int} = 0{,}9507\ \text{kg/m}^{3}
          $$
          $$
          T_{int} = \frac{p}{R\,\rho_{int}}
          = \frac{93\,802}{287\cdot 0{,}9507} = 343{,}8\ \text{K}
          = 70{,}6\ °C
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              A 825 m el aire exterior está a 17,5 °C y 0,926 atm, de donde
              $\rho_{ext} = 1{,}1245\ \text{kg/m}^{3}$.
          - texto: >-
              El empuje sobre 4000 m³ es de 4498 kg de aire desplazado, y de
              ahí hay que descontar los 695 kg de estructura y pasajeros.
          - texto: >-
              Quedan 3803 kg para 4000 m³, es decir
              $\rho_{int} = 0{,}951\ \text{kg/m}^{3}$, y a la presión de esa
              altura eso son 70,6 °C.
          - texto: >-
              La presión dentro del globo es mayor que fuera, porque el aire
              caliente empuja la tela.
            trampa: true
            mensaje: |
              La presión de dentro es **la misma** que la de fuera, y es lo que
              permite usar la misma $p$ en las dos densidades. El globo tiene
              la boca abierta por abajo, precisamente para que se iguale: si
              estuviera cerrado y presurizado sería un dirigible, y la cuenta
              sería otra. Lo que hace subir al globo no es presión, es
              **densidad**.

    resolucion: |
      **Es Arquímedes, con el aire como fluido.** El empuje vale
      $\rho_{ext}Vg$ y tiene que sostener todo lo que sube: la estructura, la
      gente y el propio aire caliente que llena el globo.

      **La trampa de unidades.** 25 UTM son **245 kg**, no 25. La unidad
      técnica de masa es la que hace que $F = ma$ funcione en el sistema
      técnico, donde el kilogramo es una fuerza. Tomarlas por kilos da 51,8 °C
      en vez de 70,6.

      **El aire de fuera.** A 825 m, $p = 0{,}926$ atm y $T = 17{,}5\ °C$:

      $$
      \rho_{ext} = \frac{p}{RT} = 1{,}1245\ \text{kg/m}^{3}
      $$

      **El equilibrio.**

      $$
      \rho_{ext}V = 245 + 450 + \rho_{int}V
      \;\Longrightarrow\;
      \rho_{int} = 0{,}9507\ \text{kg/m}^{3}
      $$

      y con la **misma** presión —el globo está abierto por abajo—,

      $$
      T_{int} = \frac{p}{R\rho_{int}} = 343{,}8\ \text{K} = 70{,}6\ °C
      $$

      **Lo que el número dice.** Setenta grados para levantar 695 kg con
      4000 m³. Y la sensibilidad es brutal: bajar el aire interior a 60 °C
      reduce el empuje útil en unos 90 kg, más de una persona. Por eso el
      piloto de un globo no regula la altura con un mando: la regula con el
      quemador, y el globo tarda en responder.

  # ── 4 (12,5 %) · Bernoulli y aparatos de medida. Estuvo en `fuera` desde que
  #    entró la convocatoria hasta el 29 de septiembre de 2026, porque se leía
  #    la toma del manómetro P_B como una toma estática y ninguna cuenta daba el
  #    5,67 impreso. Es un Pitot —baja de una cámara de aire, entra en la
  #    tubería y se dobla de cara al flujo—, y con esa lectura salen los dos
  #    números del examen. La prosa que lo explica es la del tema 13, «El caso
  #    del examen: la sonda B», y entra en el mismo commit que este ejercicio.
  - id: exflu2526-ord-4-el-deposito-y-sus-dos-sondas
    titulo: El depósito con boquilla, y qué marca cada una de sus dos sondas
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      En el esquema de la figura se transporta un fluido con densidad relativa
      $s_1 = 1{,}5$ desde el depósito de grandes dimensiones hasta una
      boquilla. Si el chorro de salida tiene una velocidad de
      $10\ \text{m/s}$, se pide:

      a) Calcular la altura $H$ del fluido en el depósito

      b) Calcular la densidad relativa del fluido manométrico $s_m$.

