ejercicios:
  # ── 1 (10 %) · Estática. Es el ejercicio que parece de calentamiento y no lo
  #    es: todo depende de entender que un manómetro mide respecto de lo que
  #    tiene alrededor, y aquí lo que tiene alrededor es un depósito
  #    presurizado a 33 metros de columna.
  - id: exflu2526-ord-1-el-manometro-dentro-del-deposito-presurizado
    titulo: Un manómetro dentro de un depósito presurizado
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución: el desarrollo es nuestro,
      reconstruido y comprobado contra los números impresos.
    nivel: examen
    enunciado: |
      Un fluido de densidad relativa $s = 1{,}2$ se almacena en un depósito de
      diámetro $D = 50\ \text{cm}$ que, a su vez, se encuentra dentro de otro
      depósito, lleno de aire y presurizado $p_1 = 2430\ \text{Torr}$. Para
      controlar la presión del fluido, el depósito interior cuenta con un
      manómetro en U con mercurio, cuya rama abierta desemboca en el aire del
      depósito exterior. Se quiere cambiar este manómetro por un manómetro
      Bourdon ($p_2$) ubicado a la misma altura que el manómetro en U, **dentro
      del depósito exterior**. Se pide:

      a) Determinar la lectura del manómetro $p_2$ ($\text{kg/cm}^{2}$).

      b) Determinar la lectura del manómetro $p_2$ (bar) si midiese presiones
      absolutas.

      c) Determinar las dos lecturas anteriores si finalmente se decide extraer
      el manómetro fuera del depósito 1, conectado al mismo punto.

      Datos: $a = 4\ \text{cm}$ (columna del fluido $s$ entre la toma y la
      superficie del mercurio); $R = 10\ \text{cm}$ (desnivel del mercurio);
      barómetro exterior, $75\ \text{cmHg}$.
    pide: Las tres lecturas del manómetro Bourdon, dentro y fuera del depósito exterior.

    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro Bourdon está **dentro** del depósito 1, que está a
          2430 Torr. ¿Respecto de qué mide?
        opciones:
          - texto: >-
              Respecto del aire que lo rodea, es decir del depósito 1: un
              manómetro relativo mide siempre la diferencia con la presión de
              su entorno
            correcta: true
            mensaje: |
              Exacto, y es todo el ejercicio. La cápsula del Bourdon se deforma
              por la diferencia entre lo que entra por la toma y lo que hay
              fuera de la cápsula; si lo que hay fuera son 33 metros de columna
              de aire comprimido, eso es lo que descuenta.
          - texto: >-
              Respecto de la atmósfera exterior, porque los manómetros son
              siempre relativos a la presión atmosférica
            mensaje: |
              «Relativo» no significa «relativo a la atmósfera»: significa
              relativo **al ambiente del aparato**. Si el aparato está dentro
              de un recinto presurizado, la atmósfera de la calle no interviene.
              Ese es justamente el cambio que introduce el apartado c).
          - texto: >-
              Respecto del vacío, porque el manómetro está sellado
            mensaje: |
              Un manómetro que midiera respecto del vacío sería un manómetro
              **absoluto**, y entonces el apartado b) no tendría sentido como
              pregunta aparte. El Bourdon corriente no está sellado por fuera.

      - tipo: calcular
        titulo: La lectura dentro del depósito
        pregunta: |
          ¿Qué marca el manómetro $p_2$ colocado dentro del depósito 1?
        respuesta:
          tipo: magnitud
          valor: '0.1312 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.436 kg/cm2'
            mensaje: |
              Esa es la presión del fluido **respecto de la atmósfera**, que es
              lo que marcaría el manómetro sacado fuera —el apartado c)—. Dentro
              del depósito 1 el aparato descuenta los 2430 Torr del aire que lo
              rodea.
          - valor: '0.1408 kg/cm2'
            mensaje: |
              Has sumado la columna del fluido $s$ en vez de restarla. Bajando
              de la toma a la superficie del mercurio la presión **aumenta**, y
              subiendo por el mercurio hasta el aire del depósito 1 **baja**:
              los dos términos van con signos contrarios.
        pista: |
          Recorre el manómetro desde la toma hasta la rama abierta y quédate
          solo con las columnas: la del fluido $s$ y la de mercurio. La presión
          del depósito 1 se cancela con la que el manómetro descuenta.
        desarrollo: |
          $$
          p_2 = \gamma_{Hg}R - \gamma_s a
          = 9800\,(13{,}6\cdot 0{,}10 - 1{,}2\cdot 0{,}04)
          $$
          $$
          = 9800\cdot 1{,}312 = 12\,858\ \text{Pa}
          = 0{,}1312\ \text{kg/cm}^{2}
          $$

          Trece centímetros de columna de agua: el manómetro en U y el Bourdon
          miden lo mismo, que es lo que el enunciado quiere comprobar antes de
          cambiar uno por otro.

      - tipo: calcular
        titulo: La misma lectura en absoluto
        pregunta: |
          ¿Y si ese mismo manómetro midiera presiones absolutas?
        respuesta:
          tipo: magnitud
          valor: '4.365 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.368 bar'
            mensaje: |
              Esa es la presión del fluido relativa a la atmósfera. Para pasar
              a absoluta falta sumar la atmosférica del barómetro,
              $75\ \text{cmHg} = 10{,}2$ mca.
          - valor: '1.128 bar'
            mensaje: |
              Has sumado la atmosférica a la lectura del apartado a), y esa
              lectura ya venía descontada del depósito 1. La absoluta se
              construye desde cero: aire del depósito 1, más lo que el fluido
              está por encima de él, más la atmosférica.
        pista: |
          Absoluta $=$ presión del depósito 1 $+$ lectura del apartado a) $+$
          atmosférica local.
        desarrollo: |
          $$
          p_1 = 2430\ \text{Torr} = 33{,}04\ \text{mca}
          \qquad
          p_{at} = 75\ \text{cmHg} = 10{,}20\ \text{mca}
          $$
          $$
          p_{2,\text{abs}} = 33{,}04 + 1{,}31 + 10{,}20 = 44{,}54\ \text{mca}
          = 4{,}37\ \text{bar}
          $$

      - tipo: calcular
        titulo: El manómetro sacado fuera
        pregunta: |
          Si el manómetro se saca del depósito 1 y se conecta al mismo punto,
          ¿qué marca ahora en relativas?
        respuesta:
          tipo: magnitud
          valor: '3.435 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.1312 kg/cm2'
            mensaje: |
              Esa era la lectura de dentro. Al sacarlo, el aparato deja de
              tener alrededor los 2430 Torr del depósito 1 y pasa a tener la
              atmósfera: descuenta 33 metros de columna menos.
          - valor: '4.456 kg/cm2'
            mensaje: |
              Esa es la presión **absoluta**. El manómetro sacado fuera sigue
              siendo relativo: descuenta la atmosférica.
        pista: |
          Es la absoluta del apartado b) menos la atmosférica.
        desarrollo: |
          $$
          p_2 = 44{,}54 - 10{,}20 = 34{,}35\ \text{mca}
          = 3{,}435\ \text{kg/cm}^{2}
          $$

          Y en absolutas sigue marcando lo mismo que antes, **4,37 bar**: la
          presión absoluta del fluido no depende de dónde esté el aparato.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Un manómetro relativo mide la diferencia con la presión de su
              entorno, no con la atmósfera.
          - texto: >-
              Dentro del depósito 1 el entorno son 2430 Torr, así que marca
              solo la columna manométrica: 0,131 kg/cm².
          - texto: >-
              Fuera, el entorno es la atmósfera, y marca 3,44 kg/cm²: veintiséis
              veces más, sin que la presión del fluido haya cambiado en nada.
          - texto: >-
              Por eso, para conocer la presión del fluido, es más fiable el
              manómetro colocado dentro del depósito.
            trampa: true
            mensaje: |
              Los dos dan la misma información si sabes dónde están; ninguno es
              más fiable. Lo que este ejercicio enseña es que **una lectura sin
              su referencia no significa nada**: 0,131 y 3,44 kg/cm² describen
              exactamente el mismo estado del fluido. El error de examen no es
              medir mal, es apuntar el número sin apuntar respecto de qué.

    resolucion: |
      **El único concepto que hay que tener claro.** Un manómetro relativo mide
      la diferencia entre lo que le entra por la toma y **la presión que rodea
      al aparato**. Casi siempre ese entorno es la atmósfera y por eso se dice
      «presión manométrica» como sinónimo de «relativa a la atmósfera»; aquí no
      lo es, y el ejercicio entero vive de esa distinción.

      **a) Dentro.** Recorriendo el manómetro en U desde la toma hasta la rama
      que desemboca en el aire del depósito 1, la presión del depósito se
      cancela contra la que el Bourdon descuenta, y queda solo la columna:

      $$
      p_2 = \gamma_{Hg}R - \gamma_s a = 1{,}312\ \text{mca}
      = 0{,}131\ \text{kg/cm}^{2}
      $$

      **b) En absolutas.** Se suma todo lo que hay debajo: el aire del depósito
      1 (2430 Torr $=$ 33,04 mca), la columna manométrica (1,31) y la
      atmosférica del barómetro (10,20 mca):

      $$
      p_{2,\text{abs}} = 44{,}54\ \text{mca} = 4{,}37\ \text{bar}
      $$

      **c) Fuera.** La presión absoluta del fluido no ha cambiado —el fluido no
      se ha enterado de que han movido el aparato—, así que en absolutas sigue
      marcando 4,37 bar. En relativas, en cambio, ahora descuenta la atmósfera
      en vez del depósito 1:

      $$
      p_2 = 44{,}54 - 10{,}20 = 34{,}35\ \text{mca} = 3{,}44\ \text{kg/cm}^{2}
      $$

      **Los tres números juntos, que es lo que hay que llevarse:**

      | | relativa | absoluta |
      |---|---|---|
      | manómetro dentro del depósito 1 | 0,131 kg/cm² | 4,37 bar |
      | manómetro fuera | 3,44 kg/cm² | 4,37 bar |

      La columna de la derecha es la misma porque describe el fluido. La de la
      izquierda cambia porque describe **una diferencia**, y la diferencia
      depende de con qué se compara.

  # ── 2 (12,5 %) · Bombeo. El ejercicio más completo del examen: hay que
  #    construir la curva de la instalación con Hazen-Williams, cruzarla con
  #    tres bombas, descartar una por caudal y otra por cavitación, y después
  #    calcular lo que cuesta arreglar la que cavita.
  - id: exflu2526-ord-2-elegir-la-bomba-entre-tres
    titulo: Elegir la bomba entre tres, y la que cavita
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se debe elegir una bomba para una instalación de distribución de agua
      potable entre dos depósitos abiertos a la atmósfera y un desnivel entre
      ambos de $40\ \text{m}$, siendo la cota del depósito de origen inferior a
      la de destino. La tubería es de PVC, su diámetro es de $150\ \text{mm}$ y
      su longitud total es de $850\ \text{m}$. La válvula de regulación estará
      en principio abierta, siendo $k_0 = 5$.

      Se dispone de tres modelos de bombas cuyas curvas características han
      sido proporcionadas mediante sus expresiones analíticas
      ($H$ en mca, $P$ en kW, $Q$ en l/s):

      | | $H_m$ | $P_{abs}$ | $NPSH_{req}$ |
      |---|---|---|---|
      | Bomba 1 | $76{,}5 - 0{,}2108\,Q^{2}$ | $8 + 0{,}026Q + 0{,}015Q^{2}$ | $1{,}8 + 0{,}00611\,Q^{2}$ |
      | Bomba 2 | $83 - 0{,}155\,Q^{2}$ | $6 + 0{,}019Q + 0{,}032Q^{2}$ | $2 + 0{,}0118\,Q^{2}$ |
      | Bomba 3 | $80 - 0{,}127\,Q^{2}$ | $6 + 0{,}0042Q + 0{,}0112Q^{2}$ | $2{,}2 + 0{,}0002\,Q^{2}$ |

      a) Elegir la bomba que mejor se ajuste a las necesidades del servicio,
      considerando que el caudal mínimo debe ser $14\ \text{l/s}$ y que,
      atendiendo a la topografía, la bomba debe situarse $5\ \text{m}$ por
      encima del depósito inferior. En caso de más de una opción posible,
      elegir aquella de menor coste.

      Se manipula la válvula de regulación en la instalación cuya bomba cavita,
      hasta que desaparece la cavitación.

      b) Calcular analíticamente la pérdida que supone esta maniobra.

      Datos: $\eta_{\text{bomba}} = 75\ \%$; $\eta_{\text{mot}} = 90\ \%$;
      $p_{at}/\gamma = 10$ mca; $p_{vapor}/\gamma = 0{,}2$ mca;
      $L_{\text{asp}} = 100$ m. Para las pérdidas, Hazen-Williams.
    pide: La bomba elegida y la pérdida que introduce la válvula en la que cavita.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres bombas y dos criterios. ¿En qué orden se aplican?
        opciones:
          - texto: >-
              Primero los criterios de viabilidad —caudal mínimo y ausencia de
              cavitación—, y solo entre las que quedan se compara el coste
            correcta: true
            mensaje: |
              Eso es. El coste solo desempata entre opciones **posibles**; una
              bomba barata que cavita o que no da el caudal no es una opción
              barata, es ninguna opción.
          - texto: >-
              Primero el coste, y después se comprueba si la más barata cumple
            mensaje: |
              Funciona si la más barata cumple, y no es el caso: aquí la de
              menor potencia absorbida es la 3 y **también** es viable, pero
              eso hay que comprobarlo, no suponerlo. El orden que propone la
              opción falla en cuanto la barata no sirve.
          - texto: >-
              Se elige la de mayor altura, porque es la que garantiza llegar al
              depósito superior
            mensaje: |
              La altura a caudal cero no dice nada del punto de funcionamiento:
              la bomba 2 es la de mayor $H_0$ y es la que cavita. Lo que
              importa es dónde corta la curva de la instalación.

      - tipo: calcular
        titulo: El caudal con la bomba 3
        pregunta: |
          ¿Qué caudal da la bomba 3 en esta instalación?
        respuesta:
          tipo: magnitud
          valor: '16.55 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.75 l/s'
            mensaje: |
              Te has quedado con los 40 m de desnivel y has olvidado las
              pérdidas. Los 850 m de tubería más la válvula abierta piden
              4,7 m más a ese caudal, y eso desplaza el corte.
          - valor: '12.58 l/s'
            mensaje: |
              Ese es el caudal de la bomba **1**, y es justamente el que la
              descarta: queda por debajo de los 14 l/s exigidos.
        pista: |
          Curva de la instalación: $40 + J_1 L\,Q^{1{,}852} + k_0 v^{2}/2g$,
          con $C_{HW} = 140$ para el PVC. Iguala a la de la bomba.
        desarrollo: |
          Con $C_{HW} = 140$ (PVC, cuadro n.º 25) y $D = 150$ mm:

          $$
          J_1 = \frac{1{,}2117\cdot 10^{10}}{140^{1{,}852}\cdot 150^{4{,}87}}
          = 3{,}245\cdot 10^{-5}
          $$
          $$
          H_{\text{inst}} = 40 + 0{,}02758\,Q^{1{,}852}
          + 8{,}17\cdot 10^{-4}\,Q^{2}
          $$

          Igualando a $80 - 0{,}127Q^{2}$ sale $Q = 16{,}55$ l/s, holgadamente
          por encima de los 14 pedidos.

      - tipo: calcular
        titulo: El NPSH disponible de la bomba 2
        pregunta: |
          Con la bomba 2 en su punto de funcionamiento ($15{,}81$ l/s), ¿de
          cuánto NPSH dispone?
        respuesta:
          tipo: magnitud
          valor: '4.27 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '4.8 mca'
            mensaje: |
              Te has dejado la pérdida de la aspiración. Cien de los 850 m
              están antes de la bomba, y a 15,8 l/s cuestan 0,47 m.
          - valor: '9.27 mca'
            mensaje: |
              Te has dejado los 5 m de cota. La bomba está **por encima** del
              depósito, así que aspira en depresión y esos cinco metros se
              restan.
        pista: |
          Al $p_{at}/\gamma$ hay que restarle la presión de vapor, la cota de
          aspiración y la pérdida de carga de la aspiración. La bomba está
          5 m por encima del depósito.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 3{,}245\cdot 10^{-5}\cdot 100\cdot 15{,}71^{1{,}852}
          = 0{,}53\ \text{m}
          $$
          $$
          NPSH_d = 10 - 0{,}2 - 5 - 0{,}53 = 4{,}27\ \text{mca}
          $$
          $$
          NPSH_{req} = 2 + 0{,}0118\cdot 15{,}71^{2} = 4{,}91\ \text{mca}
          $$

          $NPSH_d < NPSH_{req}$: **la bomba 2 cavita.**

      - tipo: calcular
        titulo: La pérdida que hay que meter en la válvula
        pregunta: |
          Cerrando la válvula hasta que la bomba 2 deje de cavitar, ¿qué
          pérdida adicional hay que introducir?
        respuesta:
          tipo: magnitud
          valor: '8.09 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '8.8 m'
            mensaje: |
              Parece que has cerrado hasta los 14 l/s del caudal mínimo. La
              condición aquí es otra: cerrar **lo justo** para que
              $NPSH_d = NPSH_{req}$, y eso ocurre a 14,15 l/s.
          - valor: '11.98 m'
            mensaje: |
              Has restado a la altura de la bomba solo el desnivel de 40 m, sin
              las pérdidas de la instalación. La válvula únicamente tiene que
              disipar lo que sobra después de descontar todo lo demás.
        pista: |
          Busca el caudal al que $NPSH_d = NPSH_{req}$, y a ese caudal resta:
          lo que da la bomba menos lo que pide la instalación.
        desarrollo: |
          Igualando disponible y requerido,

          $$
          10 - 0{,}2 - 5 - 3{,}245\cdot 10^{-3}Q^{1{,}852}
          = 2 + 0{,}0118\,Q^{2}
          \;\Longrightarrow\;
          Q = 14{,}15\ \text{l/s}
          $$

          y a ese caudal,

          $$
          H_{\text{bomba}} = 83 - 0{,}155\cdot 14{,}15^{2} = 51{,}98\ \text{m}
          \qquad
          H_{\text{inst}} = 43{,}89\ \text{m}
          $$
          $$
          \Delta H_{V} = 51{,}98 - 43{,}89 = 8{,}09\ \text{m}
          $$

          Que es exactamente lo que publica el examen.

      - tipo: justificar
        pregunta: Ordena la elección. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba 1 corta la curva de la instalación en 12,58 l/s, por
              debajo de los 14 exigidos: queda descartada por caudal.
          - texto: >-
              La bomba 2 da 15,71 l/s, pero su $NPSH$ requerido es de 4,91 m
              frente a los 4,27 disponibles: cavita, y queda descartada.
          - texto: >-
              La bomba 3 da 16,55 l/s sin cavitar —2,25 requeridos frente a
              4,21 disponibles— y absorbe 9,14 kW frente a los 14,20 de la 2:
              es la elegida.
          - texto: >-
              Y la bomba 2 sería aceptable cerrando la válvula, porque así deja
              de cavitar y sigue dando más caudal que la 3.
            trampa: true
            mensaje: |
              Cerrando deja de cavitar, sí, pero baja a **14,15 l/s** —menos
              que los 16,55 de la bomba 3— y sigue absorbiendo más potencia.
              Es decir: menos caudal, más consumo y una válvula estrangulada
              disipando 7,9 m de forma permanente. El apartado b) existe
              precisamente para poner número a lo mala que es esa opción.

    resolucion: |
      **La curva de la instalación.** Dos depósitos abiertos con 40 m de
      desnivel, 850 m de PVC y una válvula con $k_0 = 5$. Con
      $C_{HW} = 140$ —el que el cuadro n.º 25 asigna al PVC de 150 mm,
      porque su rugosidad relativa vale $4{,}7\cdot 10^{-5}$ y cae en la
      banda que va de $1{,}5\cdot 10^{-5}$ a $2\cdot 10^{-4}$—:

      $$
      H_{\text{inst}} = 40 + 0{,}02758\,Q^{1{,}852}
      + 8{,}17\cdot 10^{-4}\,Q^{2}
      $$

      **a) El descarte, bomba a bomba.**

      | | $Q$ (l/s) | $NPSH_{req}$ | $NPSH_{disp}$ | $P_{abs}$ | |
      |---|---|---|---|---|---|
      | Bomba 1 | 12,58 | 2,77 | 4,45 | 10,70 kW | **no llega a 14 l/s** |
      | Bomba 2 | 15,71 | 4,91 | 4,27 | 14,20 kW | **cavita** |
      | Bomba 3 | 16,55 | 2,25 | 4,21 | 9,14 kW | **elegida** |

      El $NPSH$ disponible es casi el mismo en las tres —depende de la
      instalación, no de la bomba— y lo que las separa es el requerido, que es
      dato de catálogo. La bomba 2 lo tiene disparado: su
      $0{,}0118\,Q^{2}$ crece sesenta veces más deprisa que el
      $0{,}0002\,Q^{2}$ de la 3.

      Y de propina, la elegida es también la más barata: 9,14 kW absorbidos
      frente a 14,20. **No hay que ceder nada**, lo que no siempre pasa.

      **b) Lo que cuesta rescatar la bomba 2.** Cerrando la válvula el caudal
      baja, y con él la pérdida de aspiración y el $NPSH$ requerido. La
      cavitación desaparece cuando los dos $NPSH$ se igualan, y eso ocurre a
      $Q = 14{,}15$ l/s. A ese caudal la bomba da 51,98 m y la instalación pide
      43,89: la válvula tiene que disipar

      $$
      \Delta H_V = 8{,}09\ \text{m}
      $$

      **Y la lectura de proyecto.** Ocho metros de columna disipados sin parar
      en un tornillo, para conseguir menos caudal del que da la bomba correcta
      y gastando más. Es la ilustración perfecta de por qué el criterio del
      apartado a) es el bueno: **estrangular arregla la cavitación pero no
      arregla la elección.**

      **Y una advertencia sobre el coeficiente de Hazen-Williams.** El PVC
      tiene $\varepsilon = 0{,}0007$ cm, así que con $D = 150$ mm sale
      $\varepsilon/D = 4{,}7\cdot 10^{-5}$: la banda del cuadro n.º 25 que le
      corresponde es $1{,}5\cdot 10^{-5} < \varepsilon/D \le 2\cdot 10^{-4}$,
      es decir $C_{HW} = 140$. **No 150**, que es la banda de las tuberías
      todavía más lisas. Tomar 150 baja las pérdidas un 12 %, mueve el caudal
      de la bomba 3 de 16,55 a 16,68 l/s y da 7,88 m de válvula en vez de los
      8,09 publicados. Con el coeficiente correcto el número sale exacto, y
      esa coincidencia es la mejor comprobación de que la banda es la buena.

  # ── 3 (10 %) · Empuje y gases. Sale del temario habitual: es Arquímedes en
  #    aire, con la densidad del aire calculada por la ley de los gases y
  #    variando con la altura. Un ejercicio bonito y una trampa de unidades: la
  #    masa viene en UTM.
  - id: exflu2526-ord-3-el-globo-aerostatico
    titulo: El globo aerostático, y a qué temperatura hay que calentar el aire
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      el resultado pero no la resolución.
    nivel: examen
    enunciado: |
      Los globos aerostáticos vuelan por estar sumergidos en aire de mayor
      densidad.

      El globo de la imagen es capaz de transportar hasta 6 personas. El
      volumen del globo es de $4000\ \text{m}^{3}$ y se mantiene constante. Su
      masa, incluyendo tela, cuerda, canasta y quemadores, es de
      $25\ \text{UTM}$. El peso medio por persona es de $75\ \text{kg}$. El
      volumen de la cesta y las personas no influye en el proceso.

      La presión atmosférica se puede calcular con la expresión
      $p_{at} = 1 - 9\cdot 10^{-5}Z$ ($p_{at}$ en atm, $Z$ en m), y la
      temperatura con $T_Z = T_0 - 2Z/300$ ($T$ en °C, $Z$ en m). La
      temperatura a nivel del suelo el día elegido para volar es de $23\ °C$.

      ¿A qué temperatura hay que calentar el aire del interior del globo si
      queremos que se eleve a $825\ \text{m}$?

      Dato: $R_{\text{aire}} = 287\ \text{J/(kg}\cdot\text{K)}$.
    pide: La temperatura del aire interior para flotar a 825 m.

    pasos:
      - tipo: reconocer
        pregunta: |
          La masa de la estructura viene en **UTM**. ¿Qué es eso?
        opciones:
          - texto: >-
              La unidad técnica de masa: la masa que pesa un kilopondio por cada
              $9{,}8\ \text{m/s}^{2}$, es decir $1\ \text{UTM} = 9{,}8$ kg
            correcta: true
            mensaje: |
              Eso es. Es la unidad de masa del sistema técnico, donde la
              **fuerza** es la magnitud fundamental y la masa la derivada. 25
              UTM son 245 kg, no 25.
          - texto: >-
              Una forma antigua de escribir «tonelada métrica»
            mensaje: |
              No: una tonelada son mil kilos y 25 toneladas de tela y cestería
              no las levanta ningún globo. La UTM vale 9,8 kg.
          - texto: >-
              Lo mismo que el kilogramo, solo que en el sistema técnico
            mensaje: |
              En el sistema técnico el kilogramo es una **fuerza**, el
              kilopondio. La unidad de masa es otra, y es precisamente la que
              hace que $F = ma$ siga siendo cierta con esas unidades:
              $1\ \text{kp} = 1\ \text{UTM}\cdot 9{,}8\ \text{m/s}^{2}$.

      - tipo: calcular
        titulo: La densidad del aire a 825 m
        pregunta: |
          ¿Cuál es la densidad del aire exterior a esa altura?
        respuesta:
          tipo: magnitud
          valor: '1.1245 kg/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '1.1922 kg/m3'
            mensaje: |
              Esa es la del aire a nivel del suelo, con 1 atm y 23 °C. A 825 m
              la presión ha bajado un 7,4 % y la temperatura 5,5 grados: los
              dos efectos van en sentidos contrarios y gana el de la presión.
          - valor: '18.67 kg/m3'
            mensaje: |
              Has metido la temperatura en grados centígrados. La ley de los
              gases pide **kelvin**: $17{,}5\ °C = 290{,}65$ K, y confundirlos
              multiplica la densidad por dieciséis.
        pista: |
          $\rho = p/(RT)$, con la presión y la temperatura evaluadas a 825 m y
          en unidades del SI.
        desarrollo: |
          $$
          p = (1 - 9\cdot 10^{-5}\cdot 825)\ \text{atm} = 0{,}92575\
          \text{atm} = 93\,802\ \text{Pa}
          $$
          $$
          T = 23 - \frac{2\cdot 825}{300} = 17{,}5\ °C = 290{,}65\ \text{K}
          $$
          $$
          \rho = \frac{93\,802}{287\cdot 290{,}65} = 1{,}1245\ \text{kg/m}^{3}
          $$

      - tipo: calcular
        titulo: La temperatura del aire interior
        pregunta: |
          ¿A qué temperatura, en grados centígrados, hay que calentar el aire
          de dentro? (solo el número)
        respuesta:
          tipo: numero
          valor: '70.6'
          tolerancia: 0.6
          formato: una temperatura en grados centígrados, solo el número
        distractores:
          - valor: '34.2'
            mensaje: |
              Te has dejado a las seis personas. Son $6\cdot 75 = 450$ kg, casi
              el doble de la estructura, y son la razón de que haya que
              calentar tanto.
          - valor: '51.8'
            mensaje: |
              Has tomado las 25 UTM como 25 kg. Son 245 kg: la unidad técnica
              de masa vale $9{,}8$ kilos.
        pista: |
          Equilibrio: el empuje del aire exterior sostiene la estructura, las
          personas y el aire caliente de dentro. Despeja $\rho_{int}$ y vuelve
          a la ley de los gases.
        desarrollo: |
          $$
          \rho_{ext}V = m_{\text{estructura}} + m_{\text{personas}} +
          \rho_{int}V
          $$
          $$
          1{,}1245\cdot 4000 = 245 + 450 + 4000\,\rho_{int}
          \;\Longrightarrow\;
          \rho_{int} = 0{,}9507\ \text{kg/m}^{3}
          $$
          $$
          T_{int} = \frac{p}{R\,\rho_{int}}
          = \frac{93\,802}{287\cdot 0{,}9507} = 343{,}8\ \text{K}
          = 70{,}6\ °C
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              A 825 m el aire exterior está a 17,5 °C y 0,926 atm, de donde
              $\rho_{ext} = 1{,}1245\ \text{kg/m}^{3}$.
          - texto: >-
              El empuje sobre 4000 m³ es de 4498 kg de aire desplazado, y de
              ahí hay que descontar los 695 kg de estructura y pasajeros.
          - texto: >-
              Quedan 3803 kg para 4000 m³, es decir
              $\rho_{int} = 0{,}951\ \text{kg/m}^{3}$, y a la presión de esa
              altura eso son 70,6 °C.
          - texto: >-
              La presión dentro del globo es mayor que fuera, porque el aire
              caliente empuja la tela.
            trampa: true
            mensaje: |
              La presión de dentro es **la misma** que la de fuera, y es lo que
              permite usar la misma $p$ en las dos densidades. El globo tiene
              la boca abierta por abajo, precisamente para que se iguale: si
              estuviera cerrado y presurizado sería un dirigible, y la cuenta
              sería otra. Lo que hace subir al globo no es presión, es
              **densidad**.

    resolucion: |
      **Es Arquímedes, con el aire como fluido.** El empuje vale
      $\rho_{ext}Vg$ y tiene que sostener todo lo que sube: la estructura, la
      gente y el propio aire caliente que llena el globo.

      **La trampa de unidades.** 25 UTM son **245 kg**, no 25. La unidad
      técnica de masa es la que hace que $F = ma$ funcione en el sistema
      técnico, donde el kilogramo es una fuerza. Tomarlas por kilos da 51,8 °C
      en vez de 70,6.

      **El aire de fuera.** A 825 m, $p = 0{,}926$ atm y $T = 17{,}5\ °C$:

      $$
      \rho_{ext} = \frac{p}{RT} = 1{,}1245\ \text{kg/m}^{3}
      $$

      **El equilibrio.**

      $$
      \rho_{ext}V = 245 + 450 + \rho_{int}V
      \;\Longrightarrow\;
      \rho_{int} = 0{,}9507\ \text{kg/m}^{3}
      $$

      y con la **misma** presión —el globo está abierto por abajo—,

      $$
      T_{int} = \frac{p}{R\rho_{int}} = 343{,}8\ \text{K} = 70{,}6\ °C
      $$

      **Lo que el número dice.** Setenta grados para levantar 695 kg con
      4000 m³. Y la sensibilidad es brutal: bajar el aire interior a 60 °C
      reduce el empuje útil en unos 90 kg, más de una persona. Por eso el
      piloto de un globo no regula la altura con un mando: la regula con el
      quemador, y el globo tarda en responder.

  # ── 5 (10 %) · Canales. El de siempre —dimensionar, redondear al comercial—
  #    con dos vueltas de tuerca: la berma se da como fracción del RADIO, y el
  #    apartado c) cambia la geometría de la sección añadiéndole paredes.
  - id: exflu2526-ord-5-el-canal-con-berma-y-la-pared-de-invierno
    titulo: El canal con berma, y la pared que se levanta en invierno
    fuente: >-
      Ejercicio 5 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se cuenta con un canal semicircular de hormigón en bruto
      ($n = 0{,}015$) con una pendiente de $1{,}2$ milésimas, el cual se ha
      diseñado para que en verano cuente con una berma $b$ de $0{,}22\,R$,
      medida desde la lámina de agua hasta el borde del semicírculo. Se pide:

      a) Calcular el radio $R$ del canal semicircular para que, conservando
      dicha berma, en verano se puedan transportar
      $5400\ \text{m}^{3}/\text{h}$ de caudal.

      b) Si los diámetros comerciales disponibles van en saltos de
      $10\ \text{cm}$, escoger el diámetro para el diseño final.

      Tomando el diámetro logrado, y con el fin de contener el aumento de
      lluvias en invierno, se levanta sobre el semicírculo una pared vertical
      del mismo material. Si para el nivel máximo de lluvias se alcanza una
      altura $h = 0{,}2\ \text{m}$ **por encima del diámetro**, se pide:

      c) Calcular el incremento de caudal porcentual respecto al caudal de
      verano.
    pide: El radio, el diámetro comercial y el incremento porcentual de caudal en invierno.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Berma de $0{,}22\,R$», medida desde la lámina hasta el borde.
          ¿Qué calado es ese, en fracción del diámetro?
        opciones:
          - texto: >-
              $h = 0{,}39\,D$, porque el borde del semicírculo está a $R = D/2$
              y hay que bajar $0{,}22R$
            correcta: true
            mensaje: |
              Eso es: $h = R - 0{,}22R = 0{,}78R = 0{,}39D$. La berma se come
              el 22 % de la altura útil, no del diámetro.
          - texto: >-
              $h = 0{,}78\,D$, que es lo que queda tras descontar la berma
            mensaje: |
              $0{,}78$ es la fracción del **radio**, no del diámetro. Y
              $0{,}78D$ sería imposible en una media caña: por encima de
              $0{,}5D$ ya no hay canal.
          - texto: >-
              $h = 0{,}22\,D$, que es lo que dice el enunciado
            mensaje: |
              $0{,}22R$ es la **berma** —lo que sobra por encima del agua— no
              el calado. El calado es lo que queda por debajo.

      - tipo: calcular
        titulo: El radio necesario
        pregunta: |
          ¿Qué radio hace falta?
        respuesta:
          tipo: magnitud
          valor: '1.008 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.854 m'
            mensaje: |
              Has calculado a sección llena, sin berma. Ese es el radio mínimo
              que pasaría el caudal, pero el enunciado exige que quede el 22 %
              de altura libre.
          - valor: '1.276 m'
            mensaje: |
              Has tomado la berma como $0{,}22\,D$ en vez de $0{,}22\,R$: eso
              deja el calado en $0{,}28D$ y obliga a un canal mucho mayor.
        pista: |
          Con $h/D = 0{,}39$, el segmento mojado da $A$ y $R_H$ en función de
          $D$, y Manning deja todo en $D^{8/3}$.
        desarrollo: |
          $$
          \theta = 2\arccos(1 - 2\cdot 0{,}39) = 2{,}698\ \text{rad}
          $$
          $$
          A = 0{,}2837\,D^{2}
          \qquad
          R_H = 0{,}2103\,D
          $$
          $$
          1{,}5 = \frac{1}{0{,}015}\,0{,}2837D^{2}(0{,}2103D)^{2/3}
          \sqrt{0{,}0012} = 0{,}2316\,D^{8/3}
          $$
          $$
          D = 2{,}015\ \text{m}
          \qquad
          R = 1{,}008\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          ¿Qué diámetro se instala?
        respuesta:
          tipo: magnitud
          valor: '2.1 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '2 m'
            mensaje: |
              Has redondeado hacia abajo. Con 2,00 m el canal no llega a los
              5400 m³/h conservando la berma, y en un dimensionado siempre se
              sube al comercial siguiente.
          - valor: '1.01 m'
            mensaje: |
              Ese es el **radio**. El apartado pide el diámetro, que es el
              doble, y además redondeado al comercial.
        pista: |
          Al múltiplo de 10 cm inmediatamente superior.
        desarrollo: |
          $$
          D = 2{,}015\ \text{m} \;\longrightarrow\; D_{\text{com}} = 2{,}1\
          \text{m}
          $$

      - tipo: calcular
        titulo: El incremento de caudal en invierno
        pregunta: |
          ¿En qué porcentaje aumenta el caudal respecto al de verano? (solo el
          número)
        respuesta:
          tipo: numero
          valor: '130.9'
          tolerancia: 1
          formato: un porcentaje, solo el número
        distractores:
          - valor: '230.9'
            mensaje: |
              Has dado la **razón** entre los dos caudales, no el incremento.
              El caudal de invierno es 2,31 veces el de verano, o sea un 131 %
              más.
          - valor: '106.8'
            mensaje: |
              Has comparado con el caudal que el canal comercial lleva en
              verano —1,675 m³/s, porque 2,1 m es más de lo estrictamente
              necesario— en vez de con el caudal de verano del enunciado, que
              son 1,5 m³/s.
        pista: |
          La sección de invierno es el semicírculo completo más un rectángulo
          de $D\times h$; ojo a que el perímetro mojado también crece.
        desarrollo: |
          $$
          A = \frac{\pi\,2{,}1^{2}}{8} + 2{,}1\cdot 0{,}2 = 2{,}152\
          \text{m}^{2}
          \qquad
          P = \frac{\pi\,2{,}1}{2} + 2\cdot 0{,}2 = 3{,}699\ \text{m}
          $$
          $$
          v = \frac{1}{0{,}015}\,0{,}5817^{2/3}\sqrt{0{,}0012}
          = 1{,}605\ \text{m/s}
          \qquad
          Q = 3{,}463\ \text{m}^{3}/\text{s}
          $$
          $$
          \frac{3{,}463 - 1{,}5}{1{,}5} = 1{,}309 = 130{,}9\ \%
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La berma de $0{,}22R$ deja el calado de verano en $0{,}39\,D$, y
              con eso hacen falta $D = 2{,}015$ m, es decir $R = 1{,}01$.
          - texto: >-
              El comercial siguiente es 2,1 m, con el que en verano cabrían
              1,675 m³/s: sobra un 12 % de capacidad.
          - texto: >-
              Con la pared vertical y 20 cm de lámina por encima del diámetro,
              el caudal sube a 3,46 m³/s: un 131 % más que en verano.
          - texto: >-
              Ese salto se explica porque el área se ha más que duplicado al
              añadir la pared.
            trampa: true
            mensaje: |
              El área pasa de $1{,}12$ a $2{,}15\ \text{m}^{2}$: se dobla justa,
              no más. Lo que hace que el caudal se multiplique por 2,3 es que
              **además sube el radio hidráulico**, de 0,44 a 0,58 m, porque los
              20 cm de pared vertical añaden mucha área y muy poco perímetro.
              Es el mismo motivo por el que un canal profundo rinde más que uno
              ancho.

    resolucion: |
      **a) La berma, que es donde se pierde el ejercicio.** Se da como
      fracción del **radio**: $b = 0{,}22R$, así que el calado es
      $h = 0{,}78R = 0{,}39D$. Con esa relación el segmento mojado vale
      $A = 0{,}2837D^{2}$ y $R_H = 0{,}2103D$, y Manning deja todo en
      $D^{8/3}$:

      $$
      D = 2{,}015\ \text{m}
      \qquad
      R = 1{,}008\ \text{m}
      $$

      **b) El comercial.** 2,1 m, redondeando hacia arriba. Con él, en verano
      cabrían 1,675 m³/s conservando la berma: sobra un 12 %.

      **c) El invierno.** La pared vertical cambia la geometría: la sección
      pasa a ser el semicírculo completo más un rectángulo de $2{,}1\times
      0{,}2$.

      | | $A$ (m²) | $P$ (m) | $R_H$ (m) | $v$ (m/s) | $Q$ (m³/s) |
      |---|---|---|---|---|---|
      | verano ($h = 0{,}39D$) | 1,120 | 2,547 | 0,440 | 1,339 | 1,500 |
      | invierno ($h = D/2 + 0{,}2$) | 2,152 | 3,699 | 0,582 | 1,605 | 3,463 |

      $$
      \frac{3{,}463 - 1{,}500}{1{,}500} = 130{,}9\ \%
      $$

      **Por qué el caudal sube más que el área.** El área se dobla; el caudal
      se multiplica por 2,31. La diferencia la pone el radio hidráulico, que
      sube un 32 % porque los veinte centímetros de pared añaden
      $0{,}42\ \text{m}^{2}$ de sección a cambio de solo $0{,}40$ m de
      perímetro mojado. **Veinte centímetros de muro compran un 131 % de
      caudal**, y ese es el argumento del apartado: es una obra
      ridículamente barata comparada con ensanchar el canal.

  # ── 6 (12,5 %) · Bernoulli + cantidad de movimiento en el mismo ejercicio,
  #    sobre un objeto que todo el mundo ha tenido en la mano. La nota del
  #    examen —«se penalizarán los que no sigan los cinco pasos vistos en
  #    clase»— dice que aquí se evalúa el método tanto como el número.
  - id: exflu2526-ord-6-el-cabezal-de-la-ducha
    titulo: El cabezal de la ducha, y lo que aguanta su fijación
    fuente: >-
      Ejercicio 6 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      El cabezal de una ducha tiene 90 orificios de diámetro $0{,}5\ \text{mm}$.
      El flujo de salida del cabezal forma un ángulo $\alpha = 35°$ con
      respecto a la vertical. La diferencia de cotas entre el mando y la
      entrada del cabezal es de $1{,}2\ \text{m}$, y el diámetro interno del
      tubo flexible es de $10\ \text{mm}$. Las pérdidas que se producen en el
      tubo flexible son de $0{,}1\ \text{bar}$. Sabiendo que el caudal que
      circula por el tubo es de $10\ \text{l/min}$ y que el manómetro colocado
      a la altura de los mandos marca $2\ \text{kg/cm}^{2}$, se pide:

      a) Calcular las pérdidas producidas en el cabezal, cuyo diámetro interno
      es idéntico al del tubo flexible, despreciando la variación de cotas
      entre la entrada y la salida del cabezal.

      b) Calcular las fuerzas en la fijación del cabezal, indicando claramente
      su dirección y sentido.

      Nota: el agua llega al cabezal **subiendo** por el flexible, y sale por
      los orificios hacia abajo, a 35° de la vertical.
    pide: Las pérdidas del cabezal y las dos componentes de la fuerza en su fijación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua sale por 90 agujeros de medio milímetro. ¿Qué velocidad
          tiene ahí, comparada con la del tubo?
        opciones:
          - texto: >-
              Bastante mayor: los 90 orificios juntos suman
              $17{,}7\ \text{mm}^{2}$ frente a los $78{,}5$ del tubo, así que
              la velocidad se multiplica por 4,4
            correcta: true
            mensaje: |
              Exacto, y conviene hacer esa cuenta antes que ninguna otra: son
              90 orificios pero muy pequeños, y en total tienen **menos**
              sección que el tubo. De ahí que la altura cinética de salida sea
              4,5 m y no un detalle despreciable.
          - texto: >-
              Menor, porque hay 90 salidas para un solo tubo de entrada
            mensaje: |
              Lo que cuenta no es cuántas son, sino cuánta sección suman.
              Noventa círculos de 0,5 mm dan $17{,}7\ \text{mm}^{2}$; el tubo
              de 10 mm, $78{,}5$. La salida es cuatro veces más estrecha.
          - texto: >-
              La misma, porque el caudal se conserva
            mensaje: |
              El caudal se conserva, sí, pero la velocidad es caudal partido
              por **sección**, y la sección cambia. Es precisamente esa
              diferencia la que hace que una ducha moje.

      - tipo: calcular
        titulo: Las pérdidas del cabezal
        pregunta: |
          ¿Cuánta carga se pierde dentro del cabezal?
        respuesta:
          tipo: magnitud
          valor: '13.47 mca'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '18.01 mca'
            mensaje: |
              Te has dejado la altura cinética de salida. El agua sale a
              $9{,}43$ m/s, y eso son $4{,}54$ m de carga que **no** son
              pérdida: es energía que se lleva el chorro.
          - valor: '14.49 mca'
            mensaje: |
              Te has dejado los $0{,}1$ bar del flexible. Son 1,02 m de
              columna, y el enunciado los da precisamente para que se
              descuenten aparte de los del cabezal.
        pista: |
          Bernoulli del manómetro a la salida de los orificios: la carga de
          presión de allí se reparte entre subir 1,2 m, la energía cinética del
          chorro, las pérdidas del flexible y las del cabezal.
        desarrollo: |
          $$
          A_{\text{orif}} = 90\,\frac{\pi\,0{,}0005^{2}}{4}
          = 1{,}767\cdot 10^{-5}\ \text{m}^{2}
          \qquad
          v_{\text{sal}} = 9{,}43\ \text{m/s}
          $$
          $$
          20 + 0{,}23 = 1{,}2 + 4{,}54 + 1{,}02 + h_{f,\text{cabezal}}
          $$
          $$
          h_{f,\text{cabezal}} = 13{,}47\ \text{mca}
          $$

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Qué fuerza horizontal soporta la fijación?
        respuesta:
          tipo: magnitud
          valor: '0.9 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1.29 N'
            mensaje: |
              Has usado el coseno donde va el seno. El ángulo se mide desde la
              **vertical**, así que la componente horizontal del chorro lleva
              $\sin 35°$ y la vertical, $\cos 35°$.
          - valor: '1.57 N'
            mensaje: |
              Ese es el módulo completo del flujo de cantidad de movimiento del
              chorro, $\rho Q v_{\text{sal}}$, sin proyectar. Hay que
              descomponerlo.
        pista: |
          En horizontal solo interviene la cantidad de movimiento del chorro de
          salida: no hay presión ni peso en esa dirección.
        desarrollo: |
          $$
          \rho Q v_{\text{sal}} = 1000\cdot 1{,}667\cdot 10^{-4}\cdot 9{,}43
          = 1{,}572\ \text{N}
          $$
          $$
          R_x = 1{,}572\,\sin 35° = 0{,}90\ \text{N}\ (\rightarrow)
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          ¿Y la vertical?
        respuesta:
          tipo: magnitud
          valor: '15.33 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1.64 N'
            mensaje: |
              Solo has contado la cantidad de movimiento. Falta la fuerza de
              presión en la brida de entrada: allí hay $17{,}8$ mca sobre
              $78{,}5\ \text{mm}^{2}$, es decir 13,7 N, y es el término
              dominante.
          - valor: '13.69 N'
            mensaje: |
              Solo has contado la presión. Los términos de cantidad de
              movimiento —el chorro que sale hacia abajo y el agua que entra
              hacia arriba— suman 1,64 N más en el mismo sentido.
        pista: |
          Tres términos, y los tres hacia abajo: la presión de la brida de
          entrada, la cantidad de movimiento que entra subiendo y la que sale
          bajando.
        desarrollo: |
          $$
          \frac{p_e}{\gamma} = 20 - 1{,}2 - 1{,}02 = 17{,}78\ \text{mca}
          \qquad
          p_eA = 13{,}69\ \text{N}
          $$
          $$
          \rho Q v_{\text{ent}} = 0{,}354\ \text{N}
          \qquad
          \rho Q v_{\text{sal}}\cos 35° = 1{,}288\ \text{N}
          $$
          $$
          R_y = 13{,}69 + 0{,}354 + 1{,}288 = 15{,}33\ \text{N}\ (\downarrow)
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 90 orificios suman menos sección que el tubo, así que el agua
              sale a 9,43 m/s y su altura cinética son 4,54 m.
          - texto: >-
              De los 20 mca del manómetro, 1,2 se van en subir, 4,54 se los
              lleva el chorro y 1,02 los pierde el flexible: quedan 13,47 para
              el cabezal.
          - texto: >-
              En la fijación aparecen 0,90 N horizontales y 15,33 verticales
              hacia abajo, de los que 13,69 los pone la presión de la brida.
          - texto: >-
              Como la fuerza vertical es quince veces la horizontal, el chorro
              apenas empuja lateralmente y la ducha no necesita anclaje lateral.
            trampa: true
            mensaje: |
              La comparación está mal hecha, porque los dos números miden cosas
              distintas: los 15,33 N verticales son casi todos **presión** —una
              fuerza que existiría igual con el grifo cerrado y la ducha llena—
              y los 0,90 N horizontales son **todo** empuje del chorro. Si se
              comparan los términos de cantidad de movimiento entre sí, 0,90
              frente a 1,64, la diferencia ya no es de quince veces sino de
              menos del doble.

    resolucion: |
      **Por qué este ejercicio pide «los cinco pasos».** Porque son dos
      teoremas en el mismo enunciado: Bernoulli para el apartado a) y cantidad
      de movimiento para el b), y el segundo necesita un resultado del primero
      —la presión en la brida de entrada—. Saltarse el planteamiento lleva a
      calcular la fuerza con la presión del manómetro, que está 2,2 metros y
      un metro de pérdidas más arriba.

      **a) Las pérdidas del cabezal.** La sección total de salida son
      $17{,}7\ \text{mm}^{2}$, **menos** que los $78{,}5$ del tubo, así que el
      agua acelera de 2,12 a 9,43 m/s. Bernoulli del manómetro a la salida:

      | concepto | mca |
      |---|---|
      | carga de presión en el mando | 20,00 |
      | altura cinética en el tubo | $+0{,}23$ |
      | subir hasta el cabezal | $-1{,}20$ |
      | altura cinética del chorro | $-4{,}54$ |
      | pérdidas del flexible | $-1{,}02$ |
      | **pérdidas del cabezal** | **13,47** |

      Trece metros y medio de columna perdidos en una pieza que cabe en la
      mano. No es un fallo de diseño: es lo que cuesta repartir el caudal en
      noventa chorros finos, y es exactamente el trabajo de una ducha.

      **b) Las fuerzas.** El volumen de control es el cabezal. Entran: la
      presión de la brida y la cantidad de movimiento del agua que sube.
      Salen: noventa chorros a 35° de la vertical, a presión atmosférica.

      $$
      R_x = \rho Q v_{\text{sal}}\sin 35° = 0{,}90\ \text{N}\ (\rightarrow)
      $$
      $$
      R_y = p_eA + \rho Q v_{\text{ent}} + \rho Q v_{\text{sal}}\cos 35°
      = 15{,}33\ \text{N}\ (\downarrow)
      $$

      Los tres términos verticales van en el mismo sentido, y eso es lo que
      hay que ver: la presión empuja el cabezal hacia arriba desde dentro —así
      que la fijación tira hacia abajo—, el agua que entra subiendo hay que
      frenarla, y el chorro que sale bajando hay que acelerarlo. Todo suma.

      **Y el orden de magnitud.** Quince newtons y medio son kilo y medio
      colgando del brazo de la ducha, de los cuales trece y medio son
      simplemente **presión de red**: están ahí aunque no salga agua, en cuanto
      el circuito está lleno y en carga. Por eso una ducha mal fijada gotea por
      la rosca antes de romperse por el chorro.

  # ── 7 (12,5 %) · Semejanza. El ejercicio que enseña lo que casi nunca se
  #    dice: la semejanza absoluta suele ser imposible, y lo interesante es
  #    razonar cuál de los dos números se sacrifica y por qué.
  - id: exflu2526-ord-7-el-submarino-que-no-se-puede-ensayar
    titulo: El submarino autónomo, y la semejanza que no se puede cumplir
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Un equipo de investigación de la Escuela de Ingeniería de Gipuzkoa
      trabaja en el diseño de un submarino autónomo que debe navegar por aguas
      marinas a $10\ °C$. Tendrá una longitud de $4\ \text{m}$ y deberá navegar
      a $5\ \text{m/s}$. Antes de construir el prototipo, se harán pruebas con
      un modelo de $40\ \text{cm}$ en agua dulce a $20\ °C$. Se descartan los
      efectos gravitatorios; los de compresibilidad se omitirán si el número de
      Mach es inferior a $0{,}3$.

      | | prototipo (agua de mar, 10 °C) | modelo (agua dulce, 20 °C) |
      |---|---|---|
      | $L$ | 4 m | 40 cm |
      | $\rho$ | 1025 kg/m³ | 1000 kg/m³ |
      | $\nu$ | $1{,}35\cdot 10^{-6}$ m²/s | $1{,}00\cdot 10^{-6}$ m²/s |
      | $U$ | 5 m/s | ? |
      | $c$ | 1483 m/s | 1481 m/s |
      | $F$ | ? | 50 N (medida) |

      a) Deducir los números adimensionales que caracterizan el problema,
      tomando como variables repetidas $L$, $\rho$ y $U$.

      b) Analizar si es posible cumplir la similitud dinámica absoluta e
      indicar la velocidad a emplear en el modelo.

      c) Deducir la fuerza de arrastre esperada en el prototipo.

      d) Considerando excesiva esa velocidad, se propone sustituir el agua
      dulce por un gas de $\rho = 1{,}18\ \text{kg/m}^{3}$,
      $\nu = 1{,}53\cdot 10^{-5}\ \text{m}^{2}/\text{s}$ y $c = 340$ m/s.
      Deducir la nueva velocidad y discutir su utilidad.
    pide: Los adimensionales, la velocidad del modelo, la fuerza del prototipo y qué pasa al cambiar de fluido.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con $L$, $\rho$ y $U$ como repetidas y las variables $\nu$, $c$ y
          $F$, ¿qué tres parámetros salen?
        opciones:
          - texto: >-
              $c/U$, $\nu/(UL)$ y $F/(\rho U^{2}L^{2})$: los inversos de Mach y
              de Reynolds, y el número de Euler de la fuerza
            correcta: true
            mensaje: |
              Eso es. Cada variable no repetida da un parámetro, y salen
              invertidos respecto de la forma habitual porque las repetidas van
              en el denominador. Un $\pi$ elevado a $-1$ sigue siendo un $\pi$.
          - texto: >-
              Reynolds, Froude y Euler
            mensaje: |
              Froude solo aparece si la gravedad está entre las variables, y el
              enunciado dice expresamente que se descartan los efectos
              gravitatorios: el submarino va sumergido y no genera olas.
          - texto: >-
              Solo dos, porque $c$ y $\nu$ describen las dos el fluido
            mensaje: |
              Describen propiedades **distintas**: $\nu$ la viscosidad y $c$ la
              compresibilidad. El teorema $\pi$ cuenta variables, no conceptos:
              seis variables menos tres magnitudes fundamentales dan tres
              parámetros.

      - tipo: calcular
        titulo: La velocidad del modelo por Reynolds
        pregunta: |
          Igualando Reynolds, ¿a qué velocidad hay que arrastrar el modelo?
        respuesta:
          tipo: magnitud
          valor: '37.04 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '4.99 m/s'
            mensaje: |
              Esa es la que sale de igualar **Mach**, y es la otra mitad del
              apartado b): las dos condiciones piden velocidades que se
              diferencian en un factor siete, y por eso la semejanza absoluta
              es imposible.
          - valor: '50 m/s'
            mensaje: |
              Te has dejado el cociente de viscosidades. El agua dulce a 20 °C
              es un 26 % menos viscosa que la de mar a 10, y eso rebaja la
              velocidad necesaria.
        pista: |
          $U_mL_m/\nu_m = U_pL_p/\nu_p$, y el modelo es diez veces más pequeño.
        desarrollo: |
          $$
          U_m = U_p\,\frac{L_p}{L_m}\,\frac{\nu_m}{\nu_p}
          = 5\cdot 10\cdot\frac{1{,}00}{1{,}35} = 37{,}04\ \text{m/s}
          $$

          Mientras que igualar Mach daría
          $U_m = 5\cdot 1481/1483 = 4{,}99$ m/s. **Las dos no se pueden
          cumplir a la vez**, y como el Mach del prototipo es $0{,}0034$ —muy
          por debajo de $0{,}3$— la compresibilidad se descarta y manda
          Reynolds.

      - tipo: calcular
        titulo: La fuerza en el prototipo
        pregunta: |
          Si en el laboratorio se miden $50\ \text{N}$, ¿qué arrastre tendrá el
          submarino real?
        respuesta:
          tipo: magnitud
          valor: '93.4 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '50 N'
            mensaje: |
              Esa es la del modelo. El adimensional que se conserva es
              $F/(\rho U^{2}L^{2})$, no $F$: al cambiar densidad, velocidad y
              tamaño, la fuerza cambia.
          - valor: '5125 N'
            mensaje: |
              Has escalado con la densidad y el tamaño pero no con la
              velocidad. El prototipo va **más despacio** que el modelo —5
              frente a 37 m/s— y eso divide por 55.
        pista: |
          $\dfrac{F}{\rho U^{2}L^{2}}$ igual en los dos.
        desarrollo: |
          $$
          F_p = F_m\,\frac{\rho_p}{\rho_m}
          \left(\frac{U_p}{U_m}\right)^{2}
          \left(\frac{L_p}{L_m}\right)^{2}
          $$
          $$
          = 50\cdot 1{,}025\cdot\left(\frac{5}{37{,}04}\right)^{2}\cdot 100
          = 93{,}4\ \text{N}
          $$

      - tipo: calcular
        titulo: La velocidad si se cambia a gas
        pregunta: |
          Con el gas de $\nu = 1{,}53\cdot 10^{-5}$, ¿a qué velocidad habría
          que ensayar?
        respuesta:
          tipo: magnitud
          valor: '566.7 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '37.04 m/s'
            mensaje: |
              Esa es la del agua dulce. El gas es quince veces más viscoso en
              términos cinemáticos, y para mantener el mismo Reynolds hay que
              ir quince veces más deprisa, no igual.
          - valor: '4.41 m/s'
            mensaje: |
              Has dividido donde había que multiplicar. Más viscosidad
              cinemática exige **más** velocidad para conservar
              $Re = UL/\nu$.
        pista: |
          El mismo Reynolds, con la viscosidad del gas.
        desarrollo: |
          $$
          U_m = 5\cdot 10\cdot\frac{1{,}53\cdot 10^{-5}}{1{,}35\cdot 10^{-6}}
          = 566{,}7\ \text{m/s}
          $$
          $$
          M = \frac{566{,}7}{340} = 1{,}67
          $$

          Muy por encima de $0{,}3$: el ensayo sería **supersónico** y la
          compresibilidad, que en el prototipo no existe, dominaría el modelo.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los tres adimensionales son $c/U$, $\nu/(UL)$ y
              $F/(\rho U^{2}L^{2})$.
          - texto: >-
              Igualar Reynolds pide 37,04 m/s e igualar Mach, 4,99: la
              semejanza absoluta es imposible.
          - texto: >-
              Como el Mach del prototipo es 0,0034, la compresibilidad se
              descarta, manda Reynolds, y de los 50 N medidos salen 93,4 N en
              el prototipo.
          - texto: >-
              Cambiar el agua por un gas resuelve el problema, porque al bajar
              la densidad baja la velocidad necesaria.
            trampa: true
            mensaje: |
              Lo que fija la velocidad de un ensayo de Reynolds no es la
              densidad sino la viscosidad **cinemática**, y la del gas es
              quince veces mayor que la del agua. La velocidad sube a 566,7
              m/s, con $M = 1{,}67$: el ensayo pasa a ser supersónico y mediría
              un fenómeno —ondas de choque— que en el submarino real no existe.
              Cambiar de fluido para bajar la velocidad exige un fluido de
              **menos** $\nu$, no de menos densidad.

    resolucion: |
      **a) Los tres parámetros.** Seis variables ($F$, $L$, $\rho$, $U$,
      $\nu$, $c$) menos tres magnitudes fundamentales dan tres $\pi$. Con
      $L$, $\rho$ y $U$ repetidas:

      $$
      \pi_1 = \frac{c}{U}
      \qquad
      \pi_2 = \frac{\nu}{UL}
      \qquad
      \pi_3 = \frac{F}{\rho U^{2}L^{2}}
      $$

      es decir el inverso de Mach, el inverso de Reynolds y el coeficiente de
      arrastre. Que salgan invertidos no importa: el inverso de un
      adimensional es otro adimensional.

      **b) La semejanza absoluta es imposible, y por qué.**

      $$
      Re_m = Re_p \;\Longrightarrow\; U_m = 37{,}04\ \text{m/s}
      \qquad
      M_m = M_p \;\Longrightarrow\; U_m = 4{,}99\ \text{m/s}
      $$

      Un factor siete entre las dos: no hay una sola velocidad que cumpla las
      dos condiciones. **Y aquí es donde el ejercicio pide criterio**: el Mach
      del prototipo vale $5/1483 = 0{,}0034$, mil veces por debajo del umbral
      de $0{,}3$, así que la compresibilidad no interviene en el fenómeno
      real y se puede sacrificar. Manda Reynolds: $U_m = 37{,}04$ m/s.

      **c) La fuerza.** Con $\pi_3$ conservado,

      $$
      F_p = 50\cdot 1{,}025\cdot\left(\frac{5}{37{,}04}\right)^{2}\cdot 100
      = 93{,}4\ \text{N}
      $$

      Fíjate en que el prototipo sufre **menos del doble** de arrastre que el
      modelo, siendo diez veces más grande: es porque va siete veces más
      despacio, y la fuerza va con el cuadrado de la velocidad.

      **d) El gas, y por qué es mala idea.** La velocidad de ensayo la fija la
      viscosidad cinemática, y la del gas es quince veces la del agua:

      $$
      U_m = 566{,}7\ \text{m/s}
      \qquad
      M = 1{,}67
      $$

      Supersónico. **El remedio introduce exactamente el efecto que se estaba
      descartando**: en el modelo aparecerían ondas de choque que en el
      submarino real no existen, y el ensayo mediría otro fenómeno. Si se
      quisiera bajar la velocidad habría que ir al revés, a un fluido de menor
      $\nu$ —agua a presión, o glicerina no, que es peor todavía— o
      simplemente aceptar un Reynolds menor y corregir después.

  # ── 8 (15 %) · Pérdidas de carga, el ejercicio de más peso del examen. Es
  #    un tipo II y un tipo III seguidos, con la misma pérdida y dos materiales
  #    distintos. Y empieza con una comprobación que descoloca: el piezómetro
  #    de B marca MÁS que el de A.
  - id: exflu2526-ord-8-el-alcohol-entre-a-y-b
    titulo: El alcohol entre A y B, y hacia dónde va en realidad
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria, 28 de mayo de 2026 · Mecánica de
      Fluidos, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      los resultados pero no la resolución.
    nivel: examen
    enunciado: |
      Se pretende estudiar en el laboratorio un flujo de alcohol etílico
      ($0\ °C$) de peso específico $7732\ \text{N/m}^{3}$ que fluye a través de
      un tubo horizontal de diámetro constante entre dos secciones A y B. En
      las secciones A y B se ha dispuesto un piezómetro abierto con lecturas de
      $H_A = 15\ \text{cm}$ y $H_B = 30\ \text{cm}$. Se pide:

      a) Calcular el caudal en l/s si la tubería comprendida entre las
      secciones A y B es de hierro galvanizado, siendo su diámetro y longitud
      de $10\ \text{cm}$ y $1{,}5\ \text{m}$ respectivamente.

      Si se desea sustituir la tubería entre A y B por una de cobre,
      manteniendo constantes las presiones de los puntos A y B, y siendo el
      nuevo caudal $Q = 25\ \text{l/s}$:

      b) Deducir el diámetro exacto (cm) que debe tener la nueva tubería.

      Dato: viscosidad cinemática del alcohol etílico a $0\ °C$,
      $\nu = 2\cdot 10^{-6}\ \text{m}^{2}/\text{s}$ (ábaco de viscosidades).
    pide: El caudal con la tubería de hierro galvanizado y el diámetro de la de cobre.

    pasos:
      - tipo: reconocer
        pregunta: |
          El piezómetro de B marca el **doble** que el de A. ¿Qué significa?
        opciones:
          - texto: >-
              Que el flujo va de B hacia A: el fluido se mueve siempre hacia la
              cota piezométrica menor
            correcta: true
            mensaje: |
              Eso es, y conviene decirlo antes de calcular nada. Los nombres A
              y B no imponen un sentido; lo impone la energía. La pérdida de
              carga son los 15 cm de diferencia, y van de B a A.
          - texto: >-
              Que hay una bomba entre A y B
            mensaje: |
              Nada en el enunciado dice que la haya, y el tubo es recto, de
              diámetro constante y horizontal. Con esos datos la única
              explicación es que el flujo circule en el sentido contrario al
              que sugiere el orden alfabético.
          - texto: >-
              Que el tubo no está realmente horizontal
            mensaje: |
              Aunque no lo estuviera, el piezómetro abierto mide la cota
              piezométrica, que ya incluye la altura: por eso es el instrumento
              que hay que mirar para saber hacia dónde va el fluido, y no el
              manómetro.

      - tipo: calcular
        titulo: El caudal con hierro galvanizado
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '22.85 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '32.6 l/s'
            mensaje: |
              Has usado los 30 cm del piezómetro de B como pérdida de carga. La
              pérdida es la **diferencia** entre las dos cotas piezométricas,
              15 cm.
          - valor: '27.44 l/s'
            mensaje: |
              Has tomado la tubería como lisa. El hierro galvanizado tiene
              $\varepsilon = 0{,}015$ cm en el cuadro n.º 20, es decir
              $\varepsilon/D = 1{,}5\cdot 10^{-3}$, que es rugosidad de sobra
              para que cuente.
        pista: |
          Tipo II: la pérdida es dato, así que se puede formar $Re\sqrt f$ sin
          conocer la velocidad y entrar al ábaco por arriba.
        desarrollo: |
          $$
          h_f = 0{,}30 - 0{,}15 = 0{,}15\ \text{m}
          \qquad
          \frac{\varepsilon}{D} = \frac{0{,}015}{10} = 1{,}5\cdot 10^{-3}
          $$
          $$
          \sqrt f\,v = \sqrt{\frac{h_f\,D\,2g}{L}}
          = \sqrt{\frac{0{,}15\cdot 0{,}1\cdot 19{,}6}{1{,}5}} = 0{,}4427
          $$
          $$
          Re\sqrt f = 0{,}4427\cdot\frac{0{,}1}{2\cdot 10^{-6}} = 22\,135
          \;\Longrightarrow\;
          f = 0{,}0232
          $$
          $$
          v = \frac{0{,}4427}{\sqrt{0{,}0232}} = 2{,}91\ \text{m/s}
          \qquad
          Q = 22{,}85\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El diámetro de la tubería de cobre
        pregunta: |
          ¿Qué diámetro debe tener la nueva tubería, en milímetros?
        respuesta:
          tipo: magnitud
          valor: '96.7 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '103.5 mm'
            mensaje: |
              Has mantenido la rugosidad del hierro galvanizado. El cobre tiene
              $\varepsilon = 0{,}00015$ cm —cien veces menos— y por eso basta
              una tubería más estrecha para pasar más caudal con la misma
              pérdida.
          - valor: '83.7 mm'
            mensaje: |
              Has usado 30 cm de pérdida en vez de 15. La condición del
              enunciado es que las presiones de A y B **no cambien**, así que
              la pérdida sigue siendo la diferencia entre ellas.
        pista: |
          Tipo III: sin diámetro no hay entrada al ábaco. Supón $f$, despeja
          $D$, calcula $Re$ y $\varepsilon/D$, y repite.
        desarrollo: |
          Con $Q = 0{,}025$, $h_f = 0{,}15$ y $L = 1{,}5$:

          $$
          0{,}15 = f\,\frac{1{,}5}{D}\,\frac{(0{,}03183/D^{2})^{2}}{19{,}6}
          \;\Longrightarrow\;
          D^{5} = 5{,}169\cdot 10^{-4}\,f
          $$

          | $f$ supuesto | $D$ (mm) | $Re$ | $f$ obtenido |
          |---|---|---|---|
          | 0,020 | 100,4 | 158.500 | 0,0163 |
          | 0,0163 | 96,5 | 164.900 | 0,0164 |
          | 0,0164 | 96,7 | 164.600 | 0,0164 |

          $$
          D = 96{,}7\ \text{mm}
          $$

          El examen publica 96,4 mm; la diferencia es del 0,3 %.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El piezómetro de B marca más que el de A, así que el alcohol va
              de B hacia A y la pérdida son los 15 cm de diferencia.
          - texto: >-
              Como la pérdida es dato, el apartado a) es de tipo II: se forma
              $Re\sqrt f = 22.135$ y con $\varepsilon/D = 1{,}5\cdot 10^{-3}$
              el ábaco da $f = 0{,}0232$ y $Q = 22{,}85$ l/s.
          - texto: >-
              El apartado b) es de tipo III: sin diámetro no hay entrada al
              ábaco y hay que iterar, y sale $D = 96{,}7$ mm.
          - texto: >-
              Y el peso específico del alcohol, 7732 N/m³, es lo que hace que
              circule más caudal que si fuera agua.
            trampa: true
            mensaje: |
              El peso específico **no aparece en ningún sitio** de la
              resolución, y es un dato que el examen pone a propósito. La
              pérdida se ha dado ya en metros de columna del propio líquido
              —eso es lo que mide un piezómetro— y Darcy-Weisbach trabaja en
              alturas. Lo que sí interviene del alcohol es su **viscosidad**,
              que decide el Reynolds. El peso específico solo haría falta para
              pasar a presiones o a potencia.

    resolucion: |
      **Lo primero, antes de calcular.** El piezómetro de B marca 30 cm y el de
      A, 15. En un tubo horizontal de sección constante eso significa que el
      fluido va **de B hacia A**, y que la pérdida de carga entre las dos
      secciones son los 15 cm de diferencia. Los nombres no imponen el sentido.

      **a) Tipo II: se conoce la pérdida.** Ese es el caso cómodo, porque
      permite formar $Re\sqrt f$ sin conocer la velocidad:

      $$
      \sqrt f\,v = \sqrt{\frac{h_f D\,2g}{L}} = 0{,}4427
      \qquad
      Re\sqrt f = \frac{0{,}4427\cdot 0{,}1}{2\cdot 10^{-6}} = 22\,135
      $$

      Con $\varepsilon/D = 1{,}5\cdot 10^{-3}$ para el hierro galvanizado
      (cuadro n.º 20), el ábaco da $f = 0{,}0232$, de donde $v = 2{,}91$ m/s y

      $$
      Q = 22{,}85\ \text{l/s}
      $$

      **b) Tipo III: no se conoce el diámetro.** Ahora falta la entrada al
      ábaco por los dos lados —ni $Re$ ni $\varepsilon/D$ se pueden calcular
      sin $D$— así que se itera. En tres vueltas converge a

      $$
      D = 96{,}7\ \text{mm}
      $$

      **Lo que hay que ver comparando los dos apartados.** Con el mismo tubo de
      100 mm, el cobre pasaría más caudal que el hierro galvanizado; aquí se
      pide lo contrario, pasar **más** caudal (25 frente a 22,85 l/s) por un
      tubo **más estrecho** (96,7 frente a 100 mm), y aun así funciona. Toda la
      diferencia la pone la rugosidad: $0{,}00015$ cm del cobre frente a
      $0{,}015$ del galvanizado, cien veces menos, que baja el coeficiente de
      frotamiento de $0{,}0232$ a $0{,}0164$ —un 29 %—.

      **Y el dato que sobra.** El peso específico de 7732 N/m³ no se usa en
      ninguna parte. Está en el enunciado para ver si se distingue lo que hace
      falta de lo que no: el piezómetro ya da la pérdida en metros de columna
      del propio líquido, y Darcy-Weisbach trabaja en alturas. Del alcohol solo
      interviene la viscosidad.

  # ── El «rellenar espacios» de turbomáquinas, que estuvo en `fuera` desde
  #    que entró la convocatoria. El motivo era de FORMATO y no de material:
  #    ocho huecos sin ninguna cuenta, y el esquema exige un paso de cálculo.
  #
  #    Se desbloquea con la técnica que salió en Química el 5 de septiembre de
  #    2026 con los cinco signos de entropía: un paso de cálculo puede contar
  #    en vez de operar. Y aquí hay algo mejor que contar — el propio enunciado
  #    avisa de que cada fallo resta lo mismo que acierta un acierto, y esa es
  #    una cuenta real que cambia cómo se contesta.
  - id: exflu2526-ord-9-ocho-huecos-y-un-descuento
    titulo: Ocho huecos de turbomáquinas, y por qué conviene dejar alguno en blanco
    fuente: >-
      Ejercicio 9 · Convocatoria ordinaria, curso 2025-2026 · Mecánica de
      Fluidos · Escuela de Ingeniería de Gipuzkoa (UPV/EHU), Departamento de
      Ingeniería Energética.
    nivel: examen
    enunciado: |
      **(5 %) Rellenar los espacios. Hay que tener en cuenta que cada
      respuesta incorrecta resta la misma puntuación que la respuesta
      correcta.**

      1. El principio de funcionamiento de las turbomáquinas es ________
      mientras que el de las máquinas de desplazamiento positivo es ________.

      2. Dentro de las turbomáquinas hidráulicas se han visto en el
      laboratorio dos tipos de equipos: ________ y ________.

      3. Las turbinas de reacción son aquellas en las que la energía
      intercambiada es ________ y ________.

      4. El antedistribuidor es un elemento propio de, ¿qué tipo de
      turbomáquinas? ________ (Es necesario una respuesta completa)

      5. Los tipos de sistemas de cierre de una turbobomba son ________ y
      ________.

      6. El prensa-estopas es un cierre que evita que ________.

      7. En una turbina de acción la relación de trabajo Q/H es ________.

      8. En la cámara espiral de una bomba se producen variaciones de energía,
      la presión ________ y la velocidad ________.
    pide: Los ocho huecos, y la estrategia que impone el descuento por fallo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Huecos 1 y 3. ¿Qué distingue una turbina **de reacción** de una de
          acción?
        opciones:
          - texto: Que en la de reacción se intercambian energía cinética y de presión, y en la de acción solo cinética
            correcta: true
            mensaje: |
              Esa es la definición, y de ella cuelgan los huecos 3, 4 y 7. En
              una Pelton el agua sale del inyector ya a presión atmosférica y
              solo lleva velocidad; en una Francis o una Kaplan el rodete
              trabaja además con la caída de presión.
          - texto: Que la de reacción gira más deprisa
            mensaje: |
              La velocidad de giro depende del salto y del caudal, no de la
              familia. Hay turbinas de acción rápidas y de reacción lentas: lo
              que las separa es **qué energía** intercambia el rodete.
          - texto: Que la de acción se usa en centrales y la de reacción en laboratorio
            mensaje: |
              Las dos se usan en centrales, y la elección la decide la
              velocidad específica: Pelton para saltos grandes con poco
              caudal, Francis y Kaplan para lo contrario.
          - texto: Que la de reacción no necesita distribuidor
            mensaje: |
              Al revés: el antedistribuidor y el distribuidor son
              precisamente elementos de las turbinas **de reacción**, y ese es
              el hueco 4.

      - tipo: calcular
        titulo: Lo que te llevas si fallas tres
        pregunta: |
          El enunciado avisa de que cada fallo resta lo mismo que suma un
          acierto. Si contestas los ocho huecos y aciertas cinco, ¿qué
          porcentaje del ejercicio te llevas?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.5
          formato: un número entero, en tanto por ciento
        distractores:
          - valor: '62.5'
            mensaje: |
              Eso es lo que valdrían cinco aciertos **sin descuento**, 5 de 8.
              El enunciado avisa de que los fallos restan, así que hay que
              descontar los tres.
          - valor: '37.5'
            mensaje: |
              Has restado los tres fallos una sola vez sobre el total en vez
              de al numerador. La cuenta es
              $(\text{aciertos} - \text{fallos})/8$, y aquí eso es $2/8$.
          - valor: '5'
            mensaje: |
              El 5 % es lo que vale el **ejercicio entero** sobre el examen. La
              pregunta es qué fracción de ese 5 % te llevas.
        pista: |
          Cada acierto suma uno y cada fallo resta uno, sobre ocho huecos.
        desarrollo: |
          $$
          \frac{5 - 3}{8} \times 100 = 25\ \text{por ciento del ejercicio}
          $$

          Y de ahí sale la estrategia, que es lo que este ejercicio enseña de
          verdad: **contestar un hueco del que no estás seguro es apostar a
          doble o nada.** Con el descuento, cinco de ocho valen lo mismo que
          dos de ocho dejando seis en blanco. Solo compensa contestar cuando
          la probabilidad de acertar pasa del 50 %.

      - tipo: reconocer
        pregunta: |
          Hueco 8. En la **cámara espiral** de una bomba, ¿qué le pasa a la
          presión y a la velocidad?
        opciones:
          - texto: La presión aumenta y la velocidad disminuye
            correcta: true
            mensaje: |
              Eso es. La cámara espiral —la voluta— tiene sección creciente,
              así que funciona como un difusor: recoge el agua que sale del
              rodete a mucha velocidad y la frena, convirtiendo esa energía
              cinética en presión. Es la última etapa de la bomba.
          - texto: La presión disminuye y la velocidad aumenta
            mensaje: |
              Eso es lo que hace una tobera, y es el papel del inyector de una
              Pelton. Una bomba busca lo contrario: entregar presión.
          - texto: Las dos aumentan
            mensaje: |
              No pueden aumentar las dos sin que alguien meta energía, y en la
              cámara espiral no hay álabes móviles: el trabajo se lo ha hecho
              ya el rodete. Lo que hay ahí es una conversión de una a otra.
          - texto: Las dos se mantienen; la cámara solo recoge el caudal
            mensaje: |
              Recoge el caudal, sí, pero con sección creciente. Si la sección
              crece y el caudal es el mismo, la velocidad tiene que bajar — y
              esa energía no desaparece.

      - tipo: justificar
        pregunta: Ordena los ocho huecos, agrupados. Una pieza es falsa.
        piezas:
          - texto: '1 · Las turbomáquinas funcionan por el teorema de Euler; las de desplazamiento positivo, por el principio de Pascal.'
          - texto: '2 y 5 · En el laboratorio se han visto turbobombas y turbinas, y los cierres de una turbobomba son internos y externos.'
          - texto: '3 y 4 · En una turbina de reacción se intercambian energía cinética y de presión, y el antedistribuidor es propio de ellas.'
          - texto: '6 · El prensa-estopas evita que el agua escape al exterior por el eje.'
          - texto: '7 y 8 · En una turbina de acción la relación Q/H es baja, y en la cámara espiral de una bomba la presión aumenta y la velocidad disminuye.'
          - texto: 'El principio de Pascal explica las turbomáquinas porque en ellas la presión también se transmite por igual en todas direcciones.'
            trampa: true
            mensaje: |
              El principio de Pascal explica las máquinas de **desplazamiento
              positivo** —una bomba de pistón, un gato hidráulico—, donde el
              fluido se desplaza encerrado y la presión se transmite. Una
              turbomáquina no encierra el fluido: le cambia el momento
              cinético con un rodete, y eso lo describe el teorema de Euler.
              Confundirlos es invertir el hueco 1 entero.
    resolucion: |
      **Los ocho huecos.**

      | | respuesta |
      |---|---|
      | 1 | el **teorema de Euler** / el **principio de Pascal** |
      | 2 | **turbobombas** y **turbinas** |
      | 3 | energía **cinética** y energía **de presión** |
      | 4 | las **turbinas de reacción** |
      | 5 | **internos** y **externos** |
      | 6 | que el agua **escape al exterior por el eje** |
      | 7 | **baja** |
      | 8 | la presión **aumenta** y la velocidad **disminuye** |

      **La estructura que los ordena.** No son ocho hechos sueltos: son tres
      ideas y sus consecuencias.

      La primera es **qué principio gobierna cada familia**. Una turbomáquina
      cambia el momento cinético del fluido con un rodete, y eso lo describe
      el teorema de Euler. Una máquina de desplazamiento positivo encierra un
      volumen y lo empuja, y ahí manda Pascal. De esa distinción salen los
      huecos 1 y 2.

      La segunda es **acción frente a reacción**, que decide los huecos 3, 4 y
      7. En una turbina de acción el rodete solo recibe energía cinética —el
      agua ya ha perdido su presión en el inyector— y por eso tiene sentido
      para saltos grandes con poco caudal: la relación $Q/H$ es **baja**. En
      una de reacción el rodete trabaja con las dos energías, necesita que el
      agua llegue guiada por todo el contorno, y de ahí el antedistribuidor y
      el distribuidor.

      La tercera es **dónde se convierte una energía en otra**, que da el
      hueco 8. La cámara espiral de una bomba tiene sección creciente y hace
      de difusor: frena el agua que sale del rodete y convierte su velocidad
      en presión. Es lo contrario de una tobera.

      Los huecos 5 y 6 son de laboratorio y se responden con lo que se ha
      visto allí: los cierres son internos y externos, y el prensa-estopas
      impide que el agua salga por el eje.

      **Y la parte que no es de turbomáquinas.** El enunciado avisa en la
      primera línea de que **cada fallo resta lo mismo que suma un acierto**, y
      eso cambia la forma de contestar:

      $$
      \text{nota} = \frac{\text{aciertos} - \text{fallos}}{8}
      $$

      Cinco aciertos y tres fallos dan $2/8 = 25\,\%$ del ejercicio — lo mismo
      que acertar dos y dejar seis en blanco. **Contestar un hueco a medias es
      apostar a doble o nada**, y solo compensa cuando crees tener más del
      50 % de probabilidad de acertar. En un ejercicio que vale el 5 % del
      examen no es una diferencia grande, pero el criterio es el mismo en
      cualquier prueba con descuento y conviene tenerlo decidido antes de
      llegar a él.
