curso: '2025-2026'
convocatoria: ordinaria
fecha: 28 de mayo de 2026
# El primer examen de Mecánica de Fluidos que entra en el sitio, y el más
# cercano a quien empiece 2.º en 2027.
#
# Cuatro cosas de este cuadernillo, dichas antes de que nadie las tenga que
# deducir:
#
# 1. **PUBLICA EL RESULTADO Y NADA MÁS.** No hay resolución oficial. Para cada
#    apartado hay que reconstruir el camino entero y comprobar que aterriza en
#    el número impreso; cuando no aterriza, se dice. Eso lo hace muy distinto
#    de los boletines de Cálculo, donde había solución con la que contrastar.
# 2. **NO PUBLICA REPARTO POR COMPETENCIA**, solo el porcentaje del ejercicio
#    sobre el total: 10 / 12,5 / 10 / 12,5 / 10 / 12,5 / 12,5 / 15 / 5. Por eso
#    los ejercicios van sin el campo `puntos`, que el esquema deja opcional. No
#    se estima lo que no se imprime.
# 3. **Faltan dos de los nueve ejercicios, y no por descuido.**
#
#    - El **4** (depósito → boquilla con manómetro diferencial) no se publica.
#      Reconstruyendo Bernoulli desde la lámina hasta la sección del manómetro
#      p_B —con la presión del aire corregida por los 50 cm de columna del
#      fluido, la altura cinética, el factor de salida k=3 y los 0,24 mca del
#      tramo D1— salen 5,87 m, y el examen publica 5,67. Se ha probado también
#      pasando los 0,24 mca a columna de líquido (5,79 m) y suponiendo que el
#      tubo del manómetro está lleno de aire (5,37 m), y ninguna de las tres
#      lecturas da el número impreso. El apartado b) necesita además una cota
#      del manómetro diferencial que la figura no acota. §13 caso 2: no se
#      publica un enunciado cuya resolución no se sabe reproducir.
#    - El **9** es un «rellenar los espacios» de ocho huecos sobre
#      turbomáquinas. Es contenido de los temas 22 a 25 y va sin cálculo, así
#      que no encaja en el esquema de ejercicio guiado —que exige un paso de
#      COMP2—. Sus ocho afirmaciones están repartidas por la prosa de esos
#      temas; queda anotado como deuda de la ruta, no del examen.
#
# 4. Cada ejercicio de este examen **cruza dos o tres temas**, que es lo normal
#    en Fluidos. Se archiva en el tema que ocupa el tiempo, y el resto se
#    menciona en la resolución.
pdf: 2025-2026-ord.pdf

fuera:
  - n: 4
    motivo: >-
      Un depósito con boquilla y manómetro diferencial. Reconstruyendo
      Bernoulli hasta la sección del manómetro salen 5,87 m y el examen
      publica 5,67; se han probado otras dos lecturas —5,79 y 5,37— y
      ninguna da el número impreso. Además su apartado b) necesita una
      cota del manómetro que la figura no acota.
  - n: 9
    motivo: >-
      Un «rellenar los espacios» de ocho huecos sobre turbomáquinas, sin
      ningún cálculo. Sus ocho afirmaciones están repartidas por la prosa
      de los temas 22 a 25, pero como ejercicio no encaja en el formato
      guiado, que exige un paso de cálculo.

