asignatura: fluidos
curso: '2025-2026'
convocatoria: ordinaria
fecha: 28 de mayo de 2026
# El primer examen de Mecánica de Fluidos que entra en el sitio, y el más
# cercano a quien empiece 2.º en 2027.
#
# Cuatro cosas de este cuadernillo, dichas antes de que nadie las tenga que
# deducir:
#
# 1. **PUBLICA EL RESULTADO Y NADA MÁS.** No hay resolución oficial. Para cada
#    apartado hay que reconstruir el camino entero y comprobar que aterriza en
#    el número impreso; cuando no aterriza, se dice. Eso lo hace muy distinto
#    de los boletines de Cálculo, donde había solución con la que contrastar.
#    Desde el 29 de septiembre de 2026 lo dice el dato: `pdfEs:
#    enunciado-con-resultados`.
# 2. **NO PUBLICA REPARTO POR COMPETENCIA**, solo el porcentaje del ejercicio
#    sobre el total, junto al número: «1. (10%)». Esos porcentajes van en
#    `puntosImpresos`, en su unidad, y suman 100. Los ejercicios van sin el
#    campo `puntos`, que es el reparto por competencias de Cálculo: no se
#    estima lo que no se imprime.
# 3. **Están los nueve.** Dos estuvieron en `fuera`, y los dos por un motivo
#    que resultó no ser de material:
#
#    - El **9**, un «rellenar los espacios» de ocho huecos, hasta el 5 de
#      septiembre de 2026, porque no tenía cálculo. Un paso de cálculo puede
#      contar en vez de operar, y el propio enunciado traía una cuenta: cada
#      fallo resta lo mismo que suma un acierto.
#    - El **4**, el depósito con boquilla y dos sondas, hasta el 29 de
#      septiembre de 2026. Se leía la toma del manómetro P_B como una toma
#      estática, salían 5,87 m frente a los 5,67 impresos, y se dio por
#      irreproducible, con un apartado b) al que supuestamente le faltaba una
#      cota. Las dos cosas eran falsas: esa toma baja de una cámara de aire,
#      entra en la tubería y se dobla de cara al flujo, así que es un Pitot, y
#      con esa lectura salen H = 5,67 m y s_m = 1,61, con la cota a = 10 cm
#      que da el enunciado. Lo explica el tema 13, «El caso del examen: la
#      sonda B», que entra en el mismo commit.
#
#    La lección es la de CLAUDE.md §17: un «no se reproduce» se escribe
#    citando la página renderizada que lo comprueba, y aquí la figura, mirada
#    a 600 ppp, decía otra cosa.
# 4. Cada ejercicio de este examen **cruza dos o tres temas**, que es lo normal
#    en Fluidos. Se archiva en el tema que ocupa el tiempo, y el resto se
#    menciona en la resolución.
pdf: 2025-2026-ord.pdf
pdfEs: enunciado-con-resultados

puntosImpresos:
  fuente: 'junto al número de cada ejercicio: «1. (10%)»'
  unidad: '%'
  reparto:
    - { n: 1, puntos: 10 }
    - { n: 2, puntos: 12.5 }
    - { n: 3, puntos: 10 }
    - { n: 4, puntos: 12.5 }
    - { n: 5, puntos: 10 }
    - { n: 6, puntos: 12.5 }
    - { n: 7, puntos: 12.5 }
    - { n: 8, puntos: 15 }
    - { n: 9, puntos: 5 }

# `fuera` queda vacío: están los nueve (punto 3 de arriba).

