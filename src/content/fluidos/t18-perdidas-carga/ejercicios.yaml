ejercicios:
  # ── NUESTRO (§08). La colección entra directamente a calcular pérdidas, y
  #    da por sabido lo que decide qué fórmula se usa. Este ejercicio es solo
  #    eso: las dos fronteras, y el resultado —que una tubería de acero de
  #    100 mm con agua nunca llega a comportarse como rugosa— explica por qué
  #    casi todos los problemas del capítulo caen en semirrugoso.
  - id: ejflu18-cuando-la-tuberia-deja-de-ser-lisa
    titulo: Las dos fronteras, y por qué casi todo cae en semirrugoso
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería de acero comercial de $100\ \text{mm}$ de diámetro
      circula agua a $20\ °\text{C}$ ($\nu = 10^{-6}\ \text{m}^{2}/\text{s}$).

      La rugosidad de diseño del acero comercial y soldado es
      $\varepsilon = 0{,}006\ \text{cm}$ (cuadro n.º 20 de «Cuadros y
      ábacos»).

      a) Calcular la rugosidad relativa.

      b) Calcular la frontera $Re' = 23/(\varepsilon/D)$, entre comportamiento
      liso y semirrugoso.

      c) Calcular la velocidad a la que la tubería deja de comportarse como
      hidráulicamente lisa.
    pide: La rugosidad relativa, la primera frontera y la velocidad que le corresponde.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es lo que hace que una tubería se comporte como lisa o como
          rugosa?
        opciones:
          - texto: >-
              La comparación entre el espesor de la subcapa laminar y la altura
              de las rugosidades, y como la subcapa adelgaza al subir el
              Reynolds, el mismo tubo cambia de comportamiento
            correcta: true
            mensaje: |
              Eso es, y es la frase del tema: **un tubo no es liso o rugoso,
              se comporta** como uno u otro. La rugosidad relativa es fija; lo
              que cambia con el caudal es la película que la tapa.
          - texto: >-
              El material del que está hecha: el cobre es liso y la fundición
              rugosa
            mensaje: |
              El material fija $\varepsilon$, y con él la rugosidad relativa,
              pero no el comportamiento. Una tubería de fundición a poca
              velocidad puede comportarse como lisa, y una de cobre muy fina a
              gran velocidad, como rugosa.
          - texto: >-
              El régimen: en laminar es lisa y en turbulento, rugosa
            mensaje: |
              En laminar la rugosidad **no interviene en absoluto** —$f = 64/Re$
              y ahí no aparece $\varepsilon$—, así que no es que sea «lisa».
              Y el turbulento se reparte entre los tres comportamientos según
              el Reynolds.

      - tipo: calcular
        titulo: La rugosidad relativa
        pregunta: |
          ¿Cuánto vale $\varepsilon/D$?
        respuesta:
          tipo: numero
          valor: '0.0006'
          tolerancia: 0.000005
          formato: un número sin unidades
        distractores:
          - valor: '0.6'
            mensaje: |
              Has mezclado unidades: la rugosidad en milímetros y el diámetro
              en metros. Es un cociente adimensional, así que las dos van en
              lo mismo: $0{,}006/10$ en cm, o $6\cdot 10^{-5}/0{,}1$ en m.
          - valor: '0.006'
            mensaje: |
              Un factor diez. Comprueba el diámetro: son $100\ \text{mm} =
              10\ \text{cm}$, no 1. La rugosidad relativa de una conducción
              corriente anda siempre en el entorno de $10^{-4}$.
        pista: |
          Las dos magnitudes en la misma unidad, y el resultado sin unidades.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006\ \text{cm}}{10\ \text{cm}}
          = 6\cdot 10^{-4}
          $$

      - tipo: calcular
        titulo: La primera frontera
        pregunta: |
          ¿Para qué número de Reynolds deja la tubería de comportarse como
          lisa?
        respuesta:
          tipo: numero
          valor: '38333'
          tolerancia: 100
          formato: un número sin unidades
        distractores:
          - valor: '933330'
            mensaje: |
              Has usado el 560, que es la **segunda** frontera —la que separa
              semirrugoso de rugoso—. La primera, lisa a semirrugosa, lleva el
              23.
          - valor: '0.000026'
            mensaje: |
              Has dividido al revés: $(\varepsilon/D)/23$ en vez de
              $23/(\varepsilon/D)$. La frontera es un número de Reynolds, así
              que tiene que salir grande, en los miles.
        pista: |
          $Re' = 23/(\varepsilon/D)$, con la rugosidad relativa del apartado
          anterior.
        desarrollo: |
          $$
          Re' = \frac{23}{6\cdot 10^{-4}} = 38\,333
          $$

      - tipo: calcular
        titulo: La velocidad correspondiente
        pregunta: |
          ¿A qué velocidad del agua se alcanza esa frontera?
        respuesta:
          tipo: magnitud
          valor: '0.3833 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '9.333 m/s'
            mensaje: |
              Esa es la velocidad de la **segunda** frontera, la que haría a
              esta tubería hidráulicamente rugosa. Es un dato interesante
              —nueve metros por segundo no se dan en una conducción de agua—
              pero no es lo que se pregunta.
          - valor: '3.833 m/s'
            mensaje: |
              Un factor diez, casi seguro en el diámetro: en $v = Re\,\nu/D$
              hay que meter $D = 0{,}1\ \text{m}$, no $0{,}01$.
        pista: |
          $Re = vD/\nu$, y ahora el Reynolds es el dato.
        desarrollo: |
          $$
          v = \frac{Re'\,\nu}{D} = \frac{38\,333\cdot 10^{-6}}{0{,}1}
          = 0{,}383\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\varepsilon/D = 6\cdot 10^{-4}$, las dos fronteras caen en
              $Re' = 38.333$ y $Re'' = 9{,}33\cdot 10^{5}$.
          - texto: >-
              En agua eso son $0{,}38$ y $9{,}3$ m/s: por encima de cuarenta
              centímetros por segundo la tubería ya no es lisa.
          - texto: >-
              Como las conducciones de agua trabajan entre 1 y 3 m/s, esta
              tubería está casi siempre en la franja semirrugosa, y por eso
              casi todos los problemas se resuelven con Colebrook-White.
          - texto: >-
              Y como el tramo semirrugoso es tan ancho, se puede usar en él la
              fórmula de Blasius, que es explícita y más cómoda.
            trampa: true
            mensaje: |
              Blasius vale **solo** para tubería lisa y $Re \le 10^{5}$; en
              semirrugoso da un valor que no es. Si molesta iterar
              Colebrook-White, lo que se usa es la explícita de Swamee y Jain,
              que sí está pensada para esa franja.

    resolucion: |
      **La rugosidad relativa.**
      $\varepsilon/D = 0{,}006/10 = 6\cdot 10^{-4}$, con la rugosidad de
      diseño del cuadro n.º 20 —que para el acero comercial y soldado es
      $0{,}006\ \text{cm}$, no el valor que dan otros manuales—.

      **Las dos fronteras.**

      $$
      Re' = \frac{23}{6\cdot 10^{-4}} = 38\,333
      \qquad
      Re'' = \frac{560}{6\cdot 10^{-4}} = 9{,}33\cdot 10^{5}
      $$

      **En velocidades de agua**, con $v = Re\,\nu/D$:

      $$
      v' = 0{,}38\ \text{m/s}
      \qquad
      v'' = 9{,}3\ \text{m/s}
      $$

      **Lo que esto significa, que es todo el ejercicio.** Una conducción de
      agua se diseña entre 1 y 3 m/s: por encima se erosiona y da golpe de
      ariete, por debajo hay que poner un tubo enorme. Es decir, esta tubería
      trabaja **siempre** por encima de la primera frontera y **nunca** llega a
      la segunda.

      Traducido: pasa toda su vida en la franja **semirrugosa**. Por eso la
      fórmula que se acaba usando en casi todos los problemas del capítulo es
      Colebrook-White, que es la implícita, y por eso el ábaco de Moody sigue
      siendo útil en vez de una curiosidad histórica.

      Y ojo con la lectura contraria: que el acero comercial no llegue a
      comportarse como rugoso **con agua** no significa que nadie lo haga. Con
      una tubería vieja e incrustada, $\varepsilon$ puede ser cien veces mayor,
      y entonces la segunda frontera baja a velocidades corrientes.

  # ── COLECCIÓN 6.1. Tipo I y laminar: el caso donde la rugosidad no
  #    interviene. Corto, y sirve para fijar que hf sale en metros de columna
  #    DEL FLUIDO, que es lo que se falla al calcular la potencia.
  - id: ejflu18-la-glicerina-y-la-potencia-perdida
    titulo: Glicerina por un tubo de cobre, y la potencia que se pierde
    fuente: >-
      Ejercicio 6.1 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una tubería horizontal de cobre de $100\ \text{m}$ de longitud y
      $100\ \text{mm}$ de diámetro, circula un caudal de $12\ \text{l/s}$ de
      glicerina a $30\ °\text{C}$ ($s = 1{,}547$). Determinar la potencia
      consumida en pérdida de carga.

      Datos de tablas: $\nu_{\text{glicerina a }30°} = 1{,}9\cdot 10^{-4}\ \text{m}^{2}/\text{s}$;
      $\varepsilon_{\text{cobre}} = 0{,}00015\ \text{cm}$.
    pide: La potencia consumida en pérdidas de carga.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de buscar nada en el ábaco: ¿qué hay que calcular primero?
        opciones:
          - texto: >-
              El número de Reynolds, porque si sale laminar el coeficiente es
              directo y la rugosidad ni se mira
            correcta: true
            mensaje: |
              Exacto, y aquí ese atajo se cobra: la glicerina es muy viscosa y
              el Reynolds sale de 804, muy laminar. El dato de la rugosidad del
              cobre que da el enunciado **no se usa**.
          - texto: >-
              La rugosidad relativa, que es la que identifica la curva del
              ábaco
            mensaje: |
              Es una de las dos entradas, sí, pero solo hace falta si el flujo
              es turbulento. Calcular primero el Reynolds puede ahorrarte el
              ábaco entero, como pasa en este ejercicio.
          - texto: >-
              La pérdida de carga con Darcy-Weisbach, y de ahí se despeja todo
              lo demás
            mensaje: |
              Darcy-Weisbach necesita $f$, y $f$ necesita el Reynolds. El orden
              es al revés: velocidad, Reynolds, coeficiente, y por último la
              pérdida.

      - tipo: calcular
        titulo: El número de Reynolds
        pregunta: |
          ¿Qué número de Reynolds tiene la glicerina?
        respuesta:
          tipo: numero
          valor: '804'
          tolerancia: 8
          formato: un número sin unidades
        distractores:
          - valor: '1244'
            mensaje: |
              Has multiplicado por la densidad relativa. La viscosidad
              **cinemática** ya lleva la densidad dentro ($\nu = \mu/\rho$):
              con $\nu$ se usa $Re = vD/\nu$ a secas, sin $s$ ni $\rho$.
          - valor: '8042'
            mensaje: |
              Un factor diez en el diámetro: son $0{,}1\ \text{m}$. Y fíjate en
              que ese valor te habría llevado a turbulento y a buscar el ábaco
              para nada.
        pista: |
          $v = Q/A$ primero, con $A = \pi D^{2}/4$; después $Re = vD/\nu$.
        desarrollo: |
          $$
          v = \frac{0{,}012}{\pi\cdot 0{,}1^{2}/4} = 1{,}53\ \text{m/s}
          \qquad
          Re = \frac{1{,}53\cdot 0{,}1}{1{,}9\cdot 10^{-4}} = 804
          $$

          Por debajo de 2000: **laminar**, y la rugosidad del cobre no
          interviene.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánto vale $h_f$?
        respuesta:
          tipo: magnitud
          valor: '9.5 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14.7 m'
            mensaje: |
              Has multiplicado por la densidad relativa. La pérdida de carga
              sale ya en **metros de columna de glicerina**: la densidad entra
              después, al pasar a presión o a potencia.
          - valor: '2.37 m'
            mensaje: |
              Te falta el factor $L/D = 1000$, o lo has puesto como $L/D = 250$.
              Comprueba: 100 m de tubo entre 0,1 m de diámetro.
        pista: |
          $h_f = f\,\dfrac{L}{D}\,\dfrac{v^{2}}{2g}$, con $f = 64/Re$.
        desarrollo: |
          $$
          f = \frac{64}{804} = 0{,}0796
          $$
          $$
          h_f = 0{,}0796\cdot\frac{100}{0{,}1}\cdot\frac{1{,}53^{2}}{2\cdot 9{,}8}
          = 9{,}5\ \text{m de columna de glicerina}
          $$

      - tipo: calcular
        titulo: La potencia perdida
        pregunta: |
          ¿Qué potencia se consume en esas pérdidas?
        respuesta:
          tipo: magnitud
          valor: '1.73 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1.117 kW'
            mensaje: |
              Has usado $\gamma = 9800$, el del agua. La glicerina tiene
              $s = 1{,}547$, así que su peso específico es
              $1{,}547\cdot 9800 = 15\,161\ \text{N/m}^{3}$. Un 35 % de
              diferencia, y el número equivocado parece igual de razonable.
          - valor: '176.4 W'
            mensaje: |
              Te has dejado la gravedad, o has usado la densidad
              ($\text{kg/m}^{3}$) donde va el peso específico
              ($\text{N/m}^{3}$). La fórmula es
              $\text{Pot} = \gamma\,Q\,h_f$, y $\gamma = \rho g$.
        pista: |
          $\text{Pot} = \gamma\,Q\,h_f$, con $\gamma$ el del fluido que
          circula.
        desarrollo: |
          $$
          \gamma = 1{,}547\cdot 9800 = 15\,161\ \text{N/m}^{3}
          $$
          $$
          \text{Pot} = 15\,161\cdot 0{,}012\cdot 9{,}5 = 1729\ \text{W}
          = 1{,}73\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $v = 1{,}53$ m/s y la viscosidad de la glicerina, el Reynolds
              es 804: régimen laminar.
          - texto: >-
              En laminar $f = 64/Re$ y la rugosidad del cobre que da el
              enunciado no interviene en ningún momento.
          - texto: >-
              Darcy-Weisbach da $h_f = 9{,}5$ metros de columna de glicerina, y
              la potencia es $\gamma Q h_f$ con el peso específico del propio
              fluido.
          - texto: >-
              Como la tubería es horizontal, la pérdida de carga se traduce
              íntegramente en un descenso de la velocidad entre la entrada y la
              salida.
            trampa: true
            mensaje: |
              La velocidad **no cambia**: el diámetro es constante, así que por
              continuidad $v_1 = v_2$. Lo que cae en un tubo horizontal es la
              **presión**, y su caída es exactamente $\gamma h_f$. Que la
              tubería sea horizontal es justo lo que hace que toda la pérdida
              se lea en el manómetro.

    resolucion: |
      **El orden que ahorra trabajo.** Primero la velocidad, después el
      Reynolds, y solo si sale turbulento se va al ábaco.

      $$
      v = \frac{Q}{A} = \frac{0{,}012}{\pi\,0{,}1^{2}/4} = 1{,}53\ \text{m/s}
      \qquad
      Re = \frac{1{,}53\cdot 0{,}1}{1{,}9\cdot 10^{-4}} = 804
      $$

      **Laminar**, así que $f = 64/Re = 0{,}0796$ y el dato de la rugosidad del
      cobre sobra. Es un ejercicio con un dato que no se usa, y eso es
      deliberado del enunciado.

      **La pérdida.**

      $$
      h_f = f\,\frac{L}{D}\,\frac{v^{2}}{2g}
      = 0{,}0796\cdot 1000\cdot\frac{1{,}53^{2}}{19{,}6}
      = 9{,}5\ \text{mc glicerina}
      $$

      **La potencia**, que es lo que pide el enunciado:

      $$
      \text{Pot} = \gamma\,Q\,h_f = (1{,}547\cdot 9800)\cdot 0{,}012\cdot 9{,}5
      = 1{,}73\ \text{kW}
      $$

      **Dónde está la trampa de unidades.** $h_f$ son metros de columna **de
      glicerina**, no de agua, y por eso al pasar a potencia hay que usar el
      peso específico de la glicerina. Con el del agua saldrían 1,12 kW: un
      error del 35 % que no chirría por ningún lado.

  # ── COLECCIÓN 6.2. Tipo II con hf constante: el atajo del Re·√f, que es la
  #    entrada de arriba del ábaco y evita iterar. Es el ejercicio que enseña
  #    el truco del capítulo.
  - id: ejflu18-el-petroleo-y-la-entrada-de-arriba-del-abaco
    titulo: Petróleo entre dos depósitos, y cómo entrar al ábaco sin la velocidad
    fuente: >-
      Ejercicio 6.2 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Mediante una tubería de $150\ \text{m}$ de longitud y $200\ \text{mm}$ de
      diámetro de fundición, se transporta petróleo crudo a $20\ °\text{C}$
      ($s = 0{,}86$), desde el depósito de almacenamiento A hasta el de
      servicio B, presurizado. Se quiere conocer el caudal circulante.
      Despreciar las pérdidas menores.

      Datos: $z_A = 80\ \text{m}$, $z_B = 30\ \text{m}$,
      $p_A = p_{\text{atm}}$, $p_B = 2\ \text{bar}$,
      $\nu = 8{,}4\cdot 10^{-6}\ \text{m}^{2}/\text{s}$,
      $\varepsilon_{\text{fundición}} = 0{,}026\ \text{cm}$.
    pide: El caudal que circula por la tubería.

    pasos:
      - tipo: reconocer
        pregunta: |
          Faltan la velocidad y el caudal, así que no se puede calcular el
          Reynolds. ¿Qué se hace?
        opciones:
          - texto: >-
              Como $h_f$ sale de Bernoulli y es un número, se calcula
              $Re\sqrt f$, que no depende de la velocidad, y se entra al ábaco
              por la escala de arriba
            correcta: true
            mensaje: |
              Ese es el truco del capítulo. La velocidad se cancela al
              multiplicar $\sqrt f = \frac{1}{v}\sqrt{h_f D 2g/L}$ por
              $Re = vD/\nu$, y lo que queda es dato puro. **Sin iterar.**
          - texto: >-
              Se supone $f = 0{,}03$ y se itera hasta que converja
            mensaje: |
              Funciona, y es lo que hay que hacer cuando $h_f$ depende de la
              velocidad. Pero aquí $h_f$ es una constante que sale de
              Bernoulli, y entonces hay un camino directo que evita las
              iteraciones enteras.
          - texto: >-
              Se supone régimen turbulento y tubería rugosa, con lo que $f$
              solo depende de $\varepsilon/D$
            mensaje: |
              Suponer el comportamiento es justo lo que no se puede hacer sin
              comprobarlo: aquí la tubería sale **semirrugosa**, y con la
              fórmula de rugosa el $f$ saldría distinto y el caudal, mal.

      - tipo: calcular
        titulo: La pérdida de carga disponible
        pregunta: |
          ¿Cuánto vale $h_f$?
        respuesta:
          tipo: magnitud
          valor: '26.27 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '30.1 m'
            mensaje: |
              Has convertido los 2 bar con el peso específico del agua. El
              fluido es petróleo, $s = 0{,}86$:
              $p_B/\gamma = 2\cdot 10^{5}/(0{,}86\cdot 9800) = 23{,}73$ m de
              columna de petróleo, no 20,4.
          - valor: '50 m'
            mensaje: |
              Te has dejado la presión del depósito B. La diferencia de cotas
              es 50 m, pero B está presurizado a 2 bar y esa altura hay que
              vencerla también: se resta.
        pista: |
          Bernoulli entre las dos superficies libres: las dos velocidades son
          nulas, $p_A = 0$ manométrica.
        desarrollo: |
          $$
          \frac{p_A}{\gamma} + z_A - h_f = \frac{p_B}{\gamma} + z_B
          $$
          $$
          \frac{p_B}{\gamma} = \frac{2\cdot 10^{5}}{0{,}86\cdot 9800}
          = 23{,}73\ \text{mc petróleo}
          $$
          $$
          h_f = 80 - 23{,}73 - 30 = 26{,}27\ \text{m}
          $$

      - tipo: calcular
        titulo: La entrada de arriba del ábaco
        pregunta: |
          ¿Cuánto vale el producto $Re\sqrt f$?
        respuesta:
          tipo: numero
          valor: '19728'
          tolerancia: 200
          formato: un número sin unidades
        distractores:
          - valor: '0.8286'
            mensaje: |
              Eso es $\sqrt f \cdot v$, que es solo la mitad de la cuenta.
              Falta multiplicarlo por $Re/v = D/\nu$, que es lo que cancela la
              velocidad y deja un número.
          - valor: '23810'
            mensaje: |
              Eso es $D/\nu$, el otro factor solo. El producto de los dos es lo
              que se busca: $0{,}8286 \cdot 23.810$.
        pista: |
          Despeja $\sqrt f$ de Darcy-Weisbach dejando la $v$ fuera, y
          multiplica por $Re = vD/\nu$.
        desarrollo: |
          $$
          \sqrt f = \frac{1}{v}\sqrt{\frac{h_f\,D\,2g}{L}}
          = \frac{1}{v}\sqrt{\frac{26{,}27\cdot 0{,}2\cdot 19{,}6}{150}}
          = \frac{0{,}8286}{v}
          $$
          $$
          Re = \frac{v\,D}{\nu} = \frac{0{,}2\,v}{8{,}4\cdot 10^{-6}} = 23\,810\,v
          $$
          $$
          Re\sqrt f = 0{,}8286\cdot 23\,810 = 1{,}97\cdot 10^{4}
          $$

          La velocidad se ha ido, que es de lo que se trataba.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Con $\varepsilon/D = 0{,}0013$ y ese valor, el ábaco —o
          Colebrook-White— da $f = 0{,}0227$. ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '173 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.3 l/s'
            mensaje: |
              Un factor diez. Comprueba el área: $\pi\cdot 0{,}2^{2}/4 =
              0{,}0314\ \text{m}^{2}$, y $5{,}5\cdot 0{,}0314 = 0{,}173\
              \text{m}^{3}/\text{s}$, que son 173 l/s.
          - valor: '392 l/s'
            mensaje: |
              Has usado el área con el **radio** en vez del diámetro, o has
              olvidado la raíz de $f$. Con $v = 0{,}8286/\sqrt{0{,}0227}$ salen
              5,5 m/s, no 12,5.
        pista: |
          De $\sqrt f = 0{,}8286/v$ sale la velocidad; después $Q = vA$.
        desarrollo: |
          $$
          v = \frac{0{,}8286}{\sqrt{0{,}0227}} = \frac{0{,}8286}{0{,}1507}
          = 5{,}50\ \text{m/s}
          $$
          $$
          Q = v\,A = 5{,}50\cdot\frac{\pi\cdot 0{,}2^{2}}{4}
          = 0{,}173\ \text{m}^{3}/\text{s} = 173\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre las dos superficies libres da la pérdida de carga
              disponible, $h_f = 26{,}27$ m de columna de petróleo.
          - texto: >-
              Como $h_f$ es constante, el producto $Re\sqrt f$ se calcula sin
              conocer la velocidad y sirve de entrada por la escala superior
              del ábaco.
          - texto: >-
              Cortando con la curva $\varepsilon/D = 0{,}0013$ se lee
              $f = 0{,}0227$, y de ahí $v = 5{,}5$ m/s y $Q = 173$ l/s.
          - texto: >-
              Al haber entrado por la escala de arriba, el resultado es
              aproximado y conviene comprobarlo iterando desde $f = 0{,}03$.
            trampa: true
            mensaje: |
              La entrada por $Re\sqrt f$ no es una aproximación: es una
              identidad exacta, y da el mismo punto del ábaco que cualquier
              otro camino. Lo único aproximado es leer una curva a ojo, y eso
              pasa igual entrando por abajo.

    resolucion: |
      **Qué tipo de problema es.** Se conocen $L$, $D$, $\varepsilon$ y $\nu$, y
      se pide el caudal: es un **tipo II**.

      **La pérdida disponible.** Bernoulli entre las superficies libres, con
      velocidades nulas y $p_A$ atmosférica:

      $$
      \frac{p_B}{\gamma} = \frac{2\cdot 10^{5}}{0{,}86\cdot 9800}
      = 23{,}73\ \text{mc petróleo}
      $$
      $$
      h_f = 80 - 23{,}73 - 30 = 26{,}27\ \text{m}
      $$

      **El atajo.** Como $h_f$ es un número y no depende de $v$, se puede
      calcular el producto $Re\sqrt f$ sin conocer la velocidad:

      $$
      Re\sqrt f = \frac{D}{\nu}\sqrt{\frac{h_f\,D\,2g}{L}}
      = 23\,810\cdot 0{,}8286 = 1{,}97\cdot 10^{4}
      $$

      **La lectura.** Con $\varepsilon/D = 0{,}026/20 = 0{,}0013$, el ábaco da
      una tubería **semirrugosa** con $f \approx 0{,}0225$; Colebrook-White da
      el valor exacto, $f = 0{,}0227$.

      **El resultado.**

      $$
      v = \frac{0{,}8286}{\sqrt{0{,}0227}} = 5{,}50\ \text{m/s}
      \qquad
      Q = 173\ \text{l/s}
      $$

      **Una nota sobre la solución oficial.** El boletín escribe en este punto
      $h_f = 26{,}76$ m, pero después usa $0{,}8286$, que es el valor que sale
      con $26{,}27$ —y $26{,}27$ es lo que dan sus propios datos—. Es una
      errata en un paso intermedio: el resultado final del boletín es correcto.

  - id: ejflu18-col64-el-fuel-que-cambia-de-regimen-con-el-termostato
    titulo: El fuel que cambia de régimen con el termostato
    fuente: Ejercicio 6.4 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se dispone de un depósito nodriza despresurizado para alimentar el
      quemador de una caldera de vapor que funciona con fuel-oil (s = 0,82),
      en el cual se calienta el fuel, manteniéndose las temperaturas entre 30
      y 60 °C ($\nu_{30} = 2\cdot 10^{-4}$ m²/s; $\nu_{60} = 2\cdot 10^{-5}$
      m²/s) utilizando unos termostatos que conectan las resistencias
      calefactoras. Mediante una bomba, a través de una tubería de fundición
      de 100 m de longitud y 50 mm de diámetro, se impulsa el fluido hasta el
      quemador. Se pide:

      **Datos:** factor de paso del quemador K = 0,5 (con la energía cinética
      a la salida)

      <figure class="figura-examen">
      <svg viewBox="0 0 580 260" role="img" width="580" height="260"
           aria-labelledby="f64t f64d">
        <title id="f64t">La instalacion: deposito nodriza, bomba y quemador</title>
        <desc id="f64d">Esquema de la instalacion. A la izquierda, un deposito
        abierto con fuel, cuya superficie libre esta en la cota 3. De su parte
        baja sale la tuberia por un orificio de borda; va horizontal hasta la
        bomba, sigue horizontal, sube por un codo, vuelve a girar en otro codo
        y llega horizontal a una valvula de compuerta y al quemador, que
        descarga a la atmosfera en la cota 5. La tuberia es de fundicion, de
        100 m de longitud y 50 mm de diametro.</desc>
        <defs>
          <marker id="m64j" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M60,150 H160 V205 H60 Z" fill="var(--alt)" opacity="0.16" stroke="none"/>
        <path d="M60,140 V205 H160 V140" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="60" y1="150" x2="160" y2="150" stroke="var(--live)" stroke-width="1.5"/>
        <text x="110" y="182" text-anchor="middle" font-size="11" fill="var(--ink)">s = 0,82</text>
        <path d="M40,150 h14 M43,145 h8 l-4,6 z" fill="var(--live)" stroke="var(--live)" stroke-width="1"/>
        <text x="34" y="147" text-anchor="end" font-size="12" fill="var(--ink)">3</text>
        <path d="M160,190 H257 M283,190 H390 V90 H520" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <circle cx="270" cy="190" r="13" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <path d="M252,206 h36 M254,206 l-6,7 M262,206 l-6,7 M270,206 l-6,7 M278,206 l-6,7 M286,206 l-6,7" stroke="var(--faint)" stroke-width="1.2"/>
        <text x="270" y="170" text-anchor="middle" font-size="10" fill="var(--ink)">bomba</text>
        <circle cx="390" cy="190" r="4" fill="var(--alt)"/>
        <circle cx="390" cy="90" r="4" fill="var(--alt)"/>
        <text x="398" y="176" font-size="9.5" fill="var(--alt)">codos de radio medio</text>
        <path d="M412,82 L412,98 L440,82 L440,98 Z" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="426" y1="82" x2="426" y2="70" stroke="var(--ink)" stroke-width="2"/>
        <line x1="418" y1="70" x2="434" y2="70" stroke="var(--ink)" stroke-width="2"/>
        <text x="426" y="60" text-anchor="middle" font-size="9.5" fill="var(--ink)">válvula de compuerta</text>
        <path d="M488,82 L508,87 L508,93 L488,98 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <line x1="510" y1="90" x2="540" y2="90" stroke="var(--live)" stroke-width="2" marker-end="url(#m64j)"/>
        <text x="492" y="116" text-anchor="middle" font-size="10" fill="var(--ink)">quemador</text>
        <path d="M548,90 h14 M551,85 h8 l-4,6 z" fill="var(--live)" stroke="var(--live)" stroke-width="1"/>
        <text x="566" y="87" font-size="12" fill="var(--ink)">5</text>
        <line x1="160" y1="196" x2="176" y2="216" stroke="var(--faint)" stroke-width="1"/>
        <text x="178" y="221" font-size="9.5" fill="var(--faint)">salida por orificio de borda</text>
        <text x="290" y="252" text-anchor="middle" font-size="9.5" fill="var(--faint)">tubería de fundición · 100 m · 50 mm</text>
      </svg>
      <figcaption>Del depósito abierto al quemador: orificio de borda, bomba, dos codos y una válvula de compuerta. La superficie del fuel está en la cota 3 y la boca del quemador en la 5.</figcaption>
      </figure>

      **a)** El diámetro del quemador si el caudal mínimo necesario es de 5 l/s
      y se desea una presión dinámica a la salida del quemador de 328 kPa. Se
      disponen de quemadores de 10, 15, 20 mm de diámetro. Elegir el más
      cercano.

      **b)** Expresión analítica de la altura de la instalación (Hm_i) en
      función del coeficiente de frotamiento f y de la velocidad en la tubería
      V.

      **c)** Potencia útil de la bomba para que en las condiciones más
      desfavorables llegue al quemador el caudal mínimo de 5 l/s.

      **d)** Caudal circulante cuando la temperatura del fuel sea de 60 °C.
      Considerar que se mantiene constante la potencia útil de la bomba.

      **e)** Analizar posibles anomalías en su funcionamiento y formas de
      solución.
    pide: El diámetro del quemador, la potencia útil de la bomba a 30 °C, el caudal a 60 °C y la anomalía que aparece entre las dos temperaturas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) habla de «las condiciones más desfavorables». Entre
          30 y 60 °C, ¿cuál es la desfavorable para la bomba?
        opciones:
          - texto: 30 °C, porque el fuel está diez veces más viscoso y la pérdida de carga es mayor
            correcta: true
            mensaje: |
              Eso es. Con $\nu = 2\cdot 10^{-4}$ m²/s el Reynolds cae a 637 y
              el flujo es laminar, con $f = 64/Re = 0{,}1005$: cinco veces el
              coeficiente de fricción que tendría caliente. Para el mismo
              caudal, la bomba tiene que aportar mucha más altura.
          - texto: 60 °C, porque el fluido circula más deprisa y la fricción crece con la velocidad
            mensaje: |
              El caudal del apartado c) está fijado en 5 l/s, así que la
              velocidad es la misma a las dos temperaturas. Lo que cambia es
              el Reynolds, y con él el coeficiente de fricción.
          - texto: Da igual, porque la pérdida de carga depende del caudal y no de la temperatura
            mensaje: |
              Depende de las dos. La pérdida de carga es
              $f\,(L/D)\,V^{2}/2g$, y $f$ es función del Reynolds, que lleva
              la viscosidad dentro. Entre 30 y 60 °C aquí cambia por un factor
              de diez.

      - tipo: calcular
        titulo: La velocidad a la salida del quemador
        pregunta: |
          Velocidad de salida del quemador para que la presión dinámica sea de
          328 kPa. El fuel tiene s = 0,82.
        respuesta:
          tipo: magnitud
          valor: '28.28 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '25.61 m/s'
            mensaje: |
              Has usado el peso específico del agua. El fuel tiene s = 0,82,
              así que $\gamma = 0{,}82\cdot 9800 = 8036$ N/m³ y la misma
              presión son más metros de columna de fuel.
          - valor: '2.55 m/s'
            mensaje: |
              Esa es la velocidad en la tubería de 50 mm, no en el quemador.
              La presión dinámica de 328 kPa es la de la **salida**, que es
              mucho más estrecha.
        pista: |
          Presión dinámica es energía cinética: $p_{din}/\gamma = V^{2}/2g$.
        desarrollo: |
          $$
          \frac{p_{din}}{\gamma} = \frac{328\cdot 10^{3}}{0{,}82\cdot 9800} = 40{,}816\ \text{mcfuel}
          $$

          $$
          V_{quem} = \sqrt{40{,}816\cdot 19{,}6} = 28{,}284\ \text{m/s}
          $$

          Con los 5 l/s, la sección de salida es
          $A = 5\cdot 10^{-3}/28{,}284 = 1{,}7678\cdot 10^{-4}$ m², es decir
          **d = 15,0 mm**. De los tres quemadores disponibles, el de 15 mm cae
          exactamente encima.

      - tipo: calcular
        titulo: La potencia útil en el caso desfavorable
        pregunta: |
          Potencia útil que debe aportar la bomba para llevar 5 l/s al
          quemador con el fuel a 30 °C. La altura de la instalación es
          $Hm_i = 2 + (187{,}875 + 2000f)\,V^{2}/2g$.
        respuesta:
          tipo: magnitud
          valor: '5.25 kW'
          tolerancia: 0.01
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '2.79 kW'
            mensaje: |
              Te has dejado el término del quemador. Los 1,5 factores de paso
              a la salida van con la velocidad del **quemador**, que es
              $(50/15)^{2} = 11{,}11$ veces la de la tubería: elevada al
              cuadrado, eso son 185 de los 187,875.
          - valor: '6.40 kW'
            mensaje: |
              Has usado el peso específico del agua para pasar de metros a
              vatios. El fluido es fuel: $\gamma = 8036$ N/m³.
          - valor: '3.39 kW'
            mensaje: |
              Has leído f en el ábaco de Moody. Con Re = 637 el flujo es
              **laminar** y no hay que ir al ábaco: $f = 64/Re = 0{,}1005$, el
              triple de lo que daría la zona rugosa.
        pista: |
          Primero $V = Q/A$ en la tubería de 50 mm, luego el Reynolds con
          $\nu_{30}$, y mira si es laminar antes de tocar el ábaco.
        desarrollo: |
          $$
          V = \frac{5\cdot 10^{-3}}{\pi\,0{,}05^{2}/4} = 2{,}546\ \text{m/s} \qquad Re = \frac{2{,}546\cdot 0{,}05}{2\cdot 10^{-4}} = 637
          $$

          Muy por debajo de 2000: flujo laminar, y entonces
          $f = 64/Re = 0{,}1005$ por Hagen-Poiseuille, sin ábaco.

          $$
          Hm_i = 2 + (0{,}1005\cdot 2000 + 187{,}875)\,\frac{2{,}546^{2}}{19{,}6} = 130{,}63\ \text{mcfuel}
          $$

          $$
          P_{util} = Hm_i\,Q\,\gamma = 130{,}63\cdot 5\cdot 10^{-3}\cdot 8036 = 5249\ \text{W}
          $$

      - tipo: calcular
        titulo: El caudal con el fuel caliente
        pregunta: |
          Caudal circulante a 60 °C, manteniendo constante la potencia útil de
          la bomba. La rugosidad relativa de la tubería de fundición es
          $\varepsilon/D = 0{,}0052$.
        respuesta:
          tipo: magnitud
          valor: '5.655 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '5 l/s'
            mensaje: |
              El caudal sí cambia. La bomba entrega la misma **potencia**, no
              el mismo caudal: si la instalación pide menos altura, el punto
              de funcionamiento se desplaza hacia caudales mayores.
          - valor: '6.19 l/s'
            mensaje: |
              Has seguido usando $f = 64/Re$. A 60 °C el Reynolds ronda 7000 y
              el flujo ya es turbulento: Hagen-Poiseuille no vale, y ahí sí
              hay que ir al ábaco con $\varepsilon/D = 0{,}0052$.
          - valor: '8.53 l/s'
            mensaje: |
              Te has dejado el término del quemador en la altura de la
              instalación. Sin esos 185, la instalación pediría muchísima
              menos altura y la bomba daría un caudal que el quemador no puede
              tragar.
        pista: |
          Dos ecuaciones: la instalación,
          $Hm_i = 2 + (187{,}875 + 2000f)V^{2}/2g$, y la bomba,
          $Hm_B = P_{util}/(Q\gamma) = 0{,}6531/Q$. Se itera suponiendo V.
        desarrollo: |
          La bomba, a potencia constante, da

          $$
          Hm_B = \frac{5249}{Q\cdot 8036} = \frac{0{,}6531}{Q}
          $$

          y la instalación sigue pidiendo
          $Hm_i = 2 + (187{,}875 + 2000f)V^{2}/2g$. Hay tres incógnitas —Q, f
          y la altura— y dos ecuaciones, así que se itera: se supone V, se
          calcula $Re = 2500\,V$, se lee f en el ábaco con
          $\varepsilon/D = 0{,}0052$ y se comparan las dos alturas.

          | V [m/s] | Re | f | Hm_i | Hm_B |
          |---|---|---|---|---|
          | 3,00 | 7500 | 0,0397 | 124,7 | 110,9 |
          | 2,85 | 7125 | 0,0400 | 113,0 | 116,7 |
          | **2,88** | **7200** | **0,0399** | **115,3** | **115,5** |

          El corte está en V = 2,88 m/s, es decir **Q = 5,655 l/s**. El fuel
          caliente circula un 13 % más deprisa con la misma bomba.

      - tipo: justificar
        pregunta: Ordena la anomalía que aparece entre las dos temperaturas. Una pieza es falsa.
        piezas:
          - texto: 'A 30 °C el Reynolds vale 637: flujo laminar, con f = 64/Re.'
          - texto: 'A 60 °C, con los 5,655 l/s que sale, el Reynolds es 7200: flujo turbulento, y f se lee en el ábaco.'
          - texto: 'Entre las dos, el termostato hace pasar el flujo por la zona crítica —entre 2000 y 4000— donde el coeficiente de fricción no está definido.'
          - texto: 'Ahí aparece la intermitencia: el caudal salta de un valor a otro sin que nadie toque nada.'
          - texto: 'La solución es subir la temperatura mínima o la potencia de la bomba, para que el Reynolds no baje nunca de 4000.'
          - texto: Como el caudal mínimo está garantizado a 30 °C, la instalación funciona bien en todo el intervalo.
            trampa: true
            mensaje: |
              Que se cumpla en los dos extremos no dice nada de lo que pasa en
              medio, y en medio está la zona crítica. Es un caso raro en el
              que comprobar los dos casos límite **no** basta.
    resolucion: |
      ## El quemador manda en la aritmética

      Lo primero que sorprende de este problema es cuánto pesa un agujero de
      15 mm. La presión dinámica pedida a la salida —328 kPa— fija la
      velocidad de salida:

      $$
      \frac{p_{din}}{\gamma} = \frac{328\,000}{0{,}82\cdot 9800} = 40{,}816\ \text{mcfuel} \;\Longrightarrow\; V_{quem} = 28{,}28\ \text{m/s}
      $$

      y con los 5 l/s, **d = 15 mm**. Pero ese diámetro reaparece en todo lo
      demás, porque la continuidad dice
      $V_{quem} = (50/15)^{2}V_{tub} = 11{,}11\,V_{tub}$, y esa relación entra
      **al cuadrado** en las pérdidas.

      ## b) La altura de la instalación, término a término

      Bernoulli entre la superficie del depósito (cota 3, abierto, velocidad
      nula) y la boca del quemador (cota 5, a la atmósfera):

      $$
      Hm_i = 2 + \sum K_i\,\frac{V_{tub}^{2}}{2g} + (1 + K_{quem})\frac{V_{quem}^{2}}{2g} + f\,\frac{L}{D}\,\frac{V_{tub}^{2}}{2g}
      $$

      Los factores de paso salen del Cuadro nº 24 de la Escuela: orificio de
      borda 1, codo de radio medio 0,75 —hay dos— y válvula de compuerta
      abierta 0,19. Suman 2,69. Y el quemador aporta
      $(1+0{,}5)\cdot 11{,}11^{2} = 185{,}19$, con la energía cinética de
      salida incluida. En total:

      $$
      Hm_i = 2 + (187{,}875 + 2000f)\,\frac{V_{tub}^{2}}{2g}
      $$

      Fíjate en el reparto: de los 187,875, **185 son el quemador**. Los dos
      codos, la válvula y el orificio de borda juntos son el 1,4 % de las
      pérdidas locales. Estrechar de 50 a 15 mm cuesta más que toda la
      instalación.

      ## c) A 30 °C el fuel es un jarabe

      $$
      V = 2{,}546\ \text{m/s} \qquad Re = \frac{2{,}546\cdot 0{,}05}{2\cdot 10^{-4}} = 637
      $$

      637 es laminar sin discusión, y ahí no se va al ábaco: $f = 64/Re$ da
      0,1005. Con eso $Hm_i = 130{,}63$ mcfuel y

      $$
      P_{util} = 130{,}63\cdot 5\cdot 10^{-3}\cdot 8036 = 5{,}249\ \text{kW}
      $$

      ## d) A 60 °C hay que iterar

      Al calentarse el fuel su viscosidad cae un orden de magnitud, la pérdida
      de carga baja y la instalación pide menos altura. La bomba, a potencia
      constante, responde dando más caudal. Como el caudal es desconocido, no
      se conoce ni la velocidad, ni el Reynolds, ni f: hay que cortar las dos
      curvas.

      | | instalación | bomba |
      |---|---|---|
      | ecuación | $Hm_i = 2 + (187{,}875 + 2000f)V^{2}/2g$ | $Hm_B = 0{,}6531/Q$ |
      | forma | crece con Q | cae con Q |

      Iterando sobre V hasta que las dos coincidan sale V = 2,88 m/s,
      Re = 7200, f ≈ 0,040 y **Q = 5,655 l/s**. Un 13 % más de caudal por
      calentar el fuel, con la misma bomba.

      ## e) La anomalía está en medio, no en los extremos

      Y aquí está la lección del problema. Los dos casos calculados funcionan:
      a 30 °C llega el caudal mínimo y a 60 °C llega de sobra. Pero el
      Reynolds pasa de 637 a 7200, y **por el camino cruza la zona crítica**,
      entre 2000 y 4000, donde el flujo no es ni laminar ni turbulento y el
      coeficiente de fricción no está definido.

      Ahí aparece la intermitencia: el flujo salta de un régimen al otro y el
      caudal con él, sin que nadie haya tocado nada. Como el termostato hace
      subir y bajar la temperatura constantemente, la instalación pasaría por
      esa zona una y otra vez.

      Las soluciones son las dos que caben: **subir la temperatura mínima** de
      trabajo, o **subir la potencia de la bomba**, de modo que el Reynolds
      nunca baje de 4000 y todo el intervalo quede en régimen turbulento.

      Merece la pena quedarse con el método: comprobar los dos extremos de un
      rango es lo que se hace casi siempre, y aquí no basta. El fallo vive
      justo en medio.

  - id: ejflu18-col65-el-keroseno-y-la-instalacion-que-envejece
    titulo: El keroseno y la instalación que envejece
    fuente: Ejercicio 6.5 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En una instalación de trasvase de keroseno desde el depósito de
      almacenamiento al depósito de consumo, se quiere instalar una bomba para
      que circule un caudal de 40 l/s de keroseno a 20 °C, de s = 0,802. La
      tubería, de 300 m de longitud, es de fundición, de 150 mm de diámetro, y
      consta de una válvula de retención (DN 75) una válvula de compuerta y 3
      codos comerciales de radio medio. El depósito de consumo está
      presurizado siendo 2,5 kg/cm² la presión que indica el manómetro. Se
      pide:

      <figure class="figura-examen">
      <svg viewBox="0 0 620 285" role="img" width="620" height="285"
           aria-labelledby="f65t f65d">
        <title id="f65t">La instalacion de trasvase de keroseno</title>
        <desc id="f65d">Esquema. Abajo a la izquierda, el deposito de
        almacenamiento, abierto, con la superficie del keroseno en la cota 50.
        De su parte baja sale la tuberia por una salida de angulos vivos, va
        horizontal hasta la bomba, pasa por una valvula de retencion y una
        valvula de compuerta, sube y entra en el deposito de consumo, que esta
        cerrado y presurizado, con un manometro encima y el nivel en la cota
        65.</desc>
