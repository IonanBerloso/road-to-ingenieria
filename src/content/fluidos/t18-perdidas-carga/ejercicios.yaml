        <text x="604" y="90" text-anchor="middle" font-size="12" fill="var(--ink)">65</text>
        <line x1="444" y1="120" x2="494" y2="137" stroke="var(--faint)" stroke-width="1"/>
        <text x="440" y="116" text-anchor="end" font-size="9.5" fill="var(--faint)">entrada a depósito</text>
        <line x1="188" y1="236" x2="202" y2="256" stroke="var(--faint)" stroke-width="1"/>
