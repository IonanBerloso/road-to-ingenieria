      <figcaption>Del depósito abierto de la cota 50 al depósito presurizado de la cota 65. Por el camino, una salida de ángulos vivos, la bomba, una válvula de retención, una de compuerta y tres codos.</figcaption>
      </figure>

      **a)** Calcular la potencia de la bomba a instalar, suponiendo un
      rendimiento del 75 %.

      **b)** Al cabo de 5 años y por necesidades de consumo es necesario
      incrementar la presión del depósito a 3 kg/cm². Por otra parte, la bomba
      ha disminuido su rendimiento al 70 % y tanto la tubería como las piezas
      especiales han envejecido. Se pide calcular el nuevo caudal circulante.

      **Nota:** Utilizar el método de los factores de paso. El envejecimiento
      se tendrá en cuenta tanto para la tubería como para las piezas
      especiales, aplicando el mismo coeficiente para ambos.
    pide: La potencia de la bomba a instalar y el caudal que quedará a los cinco años.
    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro del depósito de consumo marca 2,5 kg/cm². ¿Cuántos
          metros de columna de **keroseno** son?
        opciones:
          - texto: 31,17 m, porque son 25 mca y hay que dividir entre la densidad relativa
            correcta: true
            mensaje: |
              Eso es. Un kg/cm² es un kilopondio por centímetro cuadrado, o sea
              10 mca; 2,5 kg/cm² son 25 mca. Y la misma presión, medida en un
              líquido más ligero, son más metros:
              $25/0{,}802 = 31{,}17$ m de keroseno.
          - texto: 25 m, porque un kg/cm² son 10 m de columna del líquido que sea
            mensaje: |
              Los 10 m de la equivalencia son **de agua**. Al pasarlos a
              columna de keroseno hay que dividir entre s = 0,802, porque el
              keroseno pesa menos y hace falta más altura para la misma
              presión.
          - texto: 20,05 m, multiplicando los 25 mca por la densidad relativa
            mensaje: |
              Al revés. Un líquido más ligero necesita **más** columna, no
              menos: se divide entre s, no se multiplica.

      - tipo: calcular
        titulo: La potencia de la bomba
        pregunta: |
          Potencia de la bomba a instalar con un rendimiento del 75 %. El
          keroseno a 20 °C tiene $\nu = 2{,}2\cdot 10^{-6}$ m²/s y la fundición
          $\varepsilon = 0{,}026$ cm.
        respuesta:
          tipo: magnitud
          valor: '25.2 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '12.1 kW'
            mensaje: |
              Te has dejado la presión del depósito de consumo. Está
              presurizado: el fluido no solo tiene que subir 15 m, tiene que
              entrar contra 31,17 m de columna de keroseno.
          - valor: '18.9 kW'
            mensaje: |
              Esa es la potencia **útil**, la que recibe el fluido. La bomba a
              instalar tiene que dar más, porque solo aprovecha el 75 %: hay
              que dividir, no multiplicar.
          - valor: '31.4 kW'
            mensaje: |
              Has usado el peso específico del agua al pasar de metros a
              vatios. El fluido es keroseno: $\gamma = 0{,}802\cdot 9800$ N/m³.
        pista: |
          Bernoulli entre las dos superficies:
          $Z_A - h_f + Hm_B = Z_C + p_C/\gamma$. Las pérdidas son
          $h_f = (2000f + \sum K)\,V^{2}/2g$.
        desarrollo: |
          Los factores de paso, del Cuadro nº 24: salida de depósito con
          ángulos vivos 0,5; tres codos comerciales de radio medio 0,75 cada
          uno; válvula de retención DN 75 1,5; válvula de compuerta abierta
          0,19; entrada a depósito 1. Suman **5,44**.

          $$
          50 - h_f + Hm_B = 65 + \frac{25}{0{,}802} = 96{,}172 \;\Longrightarrow\; Hm_B = 46{,}172 + h_f
          $$

          $$
          V = \frac{0{,}04}{\pi\,0{,}15^{2}/4} = 2{,}263\ \text{m/s} \qquad Re = \frac{2{,}263\cdot 0{,}15}{2{,}2\cdot 10^{-6}} = 1{,}543\cdot 10^{5}
          $$

          Con $\varepsilon/D = 0{,}0017$, el ábaco de Moody sitúa la tubería en
          la zona semilisa: f = 0,024.

          $$
          h_f = (2000\cdot 0{,}024 + 5{,}44)\,\frac{2{,}263^{2}}{19{,}6} = 13{,}96\ \text{m} \qquad Hm_B = 60{,}14\ \text{mck}
          $$

          $$
          P = \frac{60{,}14\cdot 0{,}04\cdot 0{,}802\cdot 9800}{0{,}75} = 25\,200\ \text{W} = 25{,}2\ \text{kW}
          $$

      - tipo: calcular
        titulo: El caudal a los cinco años
        pregunta: |
          Caudal circulante cinco años después, con el depósito a 3 kg/cm², el
          rendimiento de la bomba en el 70 % y un envejecimiento del 5 % en
          las pérdidas de carga. La bomba sigue consumiendo la misma potencia.
        respuesta:
          tipo: magnitud
          valor: '35.2 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '40 l/s'
            mensaje: |
              El caudal cae. La bomba consume lo mismo pero rinde menos, la
              instalación pide más altura porque el depósito está a más
              presión, y encima las pérdidas han subido: los tres efectos
              empujan en la misma dirección.
          - valor: '37.9 l/s'
            mensaje: |
              Te has dejado la subida de presión del depósito. De 2,5 a
              3 kg/cm² son 6,23 m más de columna de keroseno que la bomba
              tiene que vencer.
          - valor: '45.2 l/s'
            mensaje: |
              Te has dejado la caída de rendimiento. La bomba consume los
              mismos 25,2 kW pero ahora solo entrega el 70 % al fluido: menos
              potencia útil, menos caudal.
        pista: |
          Instalación: $Hm_i = 52{,}41 + (2100f + 5{,}71)V^{2}/2g$. Bomba:
          $Hm_B = 25200\cdot 0{,}7/(Q\gamma) = 2{,}244/Q$. Se itera hasta que
          coincidan.
        desarrollo: |
          Con la nueva presión, $Z_C + p_C/\gamma = 65 + 30/0{,}802 = 102{,}41$
          y la instalación pide

          $$
          Hm_i = 52{,}41 + h_f \qquad h_f = 1{,}05\,(2000f + 5{,}44)\frac{V^{2}}{2g} = (2100f + 5{,}71)\frac{V^{2}}{2g}
          $$

          La bomba, con la misma potencia consumida y el nuevo rendimiento:

          $$
          Hm_B = \frac{25\,200\cdot 0{,}7}{Q\cdot 0{,}802\cdot 9800} = \frac{2{,}244}{Q}
          $$

          Iterando con $V = 56{,}6\,Q$ y $Re = 6{,}82\cdot 10^{4}\,V$:

          | Q [l/s] | V [m/s] | Re | f | Hm_i | Hm_B |
          |---|---|---|---|---|---|
          | 35,0 | 1,98 | 1,35·10⁵ | 0,024 | 63,62 | 64,13 |
          | **35,2** | **1,99** | **1,36·10⁵** | **0,024** | **63,75** | **63,75** |

          Es decir **Q = 35,2 l/s**, un 12 % menos que al principio.

      - tipo: justificar
        pregunta: Ordena por qué el caudal baja de 40 a 35 l/s. Una pieza es falsa.
        piezas:
          - texto: 'La bomba sigue consumiendo 25,2 kW, pero con el rendimiento en el 70 % solo entrega 17,6 kW al fluido en vez de 18,9.'
          - texto: 'La instalación pide más: la presión del depósito sube de 31,17 a 37,41 m de columna de keroseno, seis metros más de altura estática.'
          - texto: 'Y las pérdidas de carga crecen un 5 % por el envejecimiento, tanto en la tubería como en las piezas.'
          - texto: 'Los tres efectos van en el mismo sentido, así que el punto de funcionamiento se desplaza hacia caudales menores: 35,2 l/s.'
          - texto: Como la altura estática ha subido seis metros, el caudal baja en la misma proporción.
            trampa: true
            mensaje: |
              No hay proporción directa. El caudal sale de cortar dos curvas
              —la de la instalación y la de la bomba—, y las dos son no
              lineales. Seis metros más de altura estática sobre sesenta no
              son un 10 % de caudal menos: aquí el efecto total, con todo
              incluido, es del 12 %.
    resolucion: |
      ## Lo que hay que leer antes de calcular

      Este problema tiene tres datos que no están en el enunciado y hay que ir
      a buscarlos a los cuadros de la Escuela:

      - **Los factores de paso** (Cuadro nº 24): salida de depósito con
        ángulos vivos 0,5; codo comercial de radio medio 0,75, y hay tres;
        válvula de retención DN 75 1,5; válvula de compuerta abierta 0,19;
        entrada a depósito 1. **Suman 5,44.**
      - **La viscosidad del keroseno a 20 °C** (ábaco de viscosidades):
        $2{,}2\cdot 10^{-6}$ m²/s.
      - **La rugosidad de la fundición** (Cuadro nº 20): 0,026 cm.

      Y una conversión que se traga a mucha gente: 2,5 kg/cm² son 25 metros de
      columna **de agua**, y al pasarlos a columna de keroseno hay que
      **dividir** entre 0,802, no multiplicar. Salen 31,17 m. Un líquido más
      ligero necesita más altura para dar la misma presión.

      ## a) La bomba a instalar

      Bernoulli entre las dos superficies libres, con el depósito de consumo
      presurizado:

      $$
      50 - h_f + Hm_B = 65 + 31{,}172 \;\Longrightarrow\; Hm_B = 46{,}172 + h_f
      $$

      Con V = 2,263 m/s, Re = 1,543·10⁵ y $\varepsilon/D = 0{,}0017$, el ábaco
      da f = 0,024 (zona semilisa), y

      $$
      h_f = (2000\cdot 0{,}024 + 5{,}44)\frac{2{,}263^{2}}{19{,}6} = 13{,}96\ \text{m}
      $$

      $$
      Hm_B = 60{,}14\ \text{mck} \qquad P = \frac{60{,}14\cdot 0{,}04\cdot 7859{,}6}{0{,}75} = 25{,}2\ \text{kW}
      $$

      Merece la pena mirar el reparto de esos 60 metros: **46,2 son altura
      estática** —15 de desnivel y 31,2 de presión en el depósito— y solo 14
      son fricción. Y de los 14, los 48 puntos de $f\,L/D$ se comen 12,5 y las
      cinco piezas especiales 1,4. En una tubería de 300 m, los accesorios son
      el 10 % de las pérdidas.

      ## b) Cinco años después

      Han cambiado tres cosas y las tres empujan en la misma dirección:

      | | antes | después |
      |---|---|---|
      | presión del depósito | 31,17 mck | 37,41 mck |
      | rendimiento | 75 % | 70 % |
      | pérdidas | $h_{f0}$ | $1{,}05\,h_{f0}$ |

      La instalación pide $Hm_i = 52{,}41 + (2100f + 5{,}71)V^{2}/2g$ y la
      bomba, consumiendo los mismos 25,2 kW, entrega
      $Hm_B = 2{,}244/Q$. No se conoce ni V, ni Re, ni f, así que se itera
      sobre Q hasta que las dos alturas coincidan. Sale **Q = 35,2 l/s**.

      ## Lo que enseña

      Un 12 % menos de caudal, y ninguno de los tres culpables es
      espectacular por sí solo. Es la forma habitual de degradarse de una
      instalación: nadie nota el día en que dejó de dar 40 l/s.

      Y ojo con la tentación de repartir la culpa por proporciones. El caudal
      no baja «un 5 % por el envejecimiento y otro tanto por el rendimiento»:
      sale de cortar dos curvas, las dos no lineales, y la única forma de
      saberlo es iterar. Lo que sí se puede afirmar es la dirección: los tres
      efectos suben la curva de la instalación o bajan la de la bomba, y
      cualquiera de esas dos cosas mueve el corte hacia la izquierda.

  # ── COLECCIÓN 6.6. El mejor del capítulo: los tres tipos de problema de
  #    Moody en un solo enunciado, y un apartado b) cuyo resultado es
  #    deliberadamente absurdo para que el c) tenga sentido.
  - id: ejflu18-col66-la-tuberia-incrustada
    titulo: Una conducción que se ha ido incrustando, y los tres tipos a la vez
    fuente: >-
      Ejercicio 6.6 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una conducción de acero comercial para traída de agua a una fábrica ha
      funcionado holgadamente desde su establecimiento por simple gravedad,
      hasta un determinado momento en que no es capaz de suministrar el caudal
      inicial debido a una incrustación calcárea uniforme a lo largo de toda la
      conducción. Teniendo en cuenta los datos abajo reseñados, se pide:

      a) Caudal inicial en el instante de la implantación.

      b) Rugosidad de la tubería suponiendo que el diámetro interior
      ($800\ \text{mm}$) no varía, y que conduce $500\ \text{l/s}$ solamente.

      c) Esta rugosidad calculada se valora como excesiva, por lo que cabría
      suponer que el diámetro se ha reducido considerablemente por las
      incrustaciones calcáreas. Suponiendo una rugosidad de la tubería
      comercial con las incrustaciones de $\varepsilon = 0{,}5\ \text{cm}$,
      calcular el diámetro útil (mm) de la tubería para el transporte del
      caudal de $500\ \text{l/s}$.

      Datos: agua a $10\ °\text{C}$ ($\nu = 1{,}2\cdot 10^{-6}\
      \text{m}^{2}/\text{s}$); diferencia de cotas piezométricas en los
      extremos de la conducción $= 10\ \text{m}$; diámetro inicial de la
      tubería de acero comercial $D = 800\ \text{mm}$; longitud equivalente
      total $= 1000\ \text{m}$.

      Nota: utilizar en la resolución el ábaco de Moody o las expresiones que
      lo definen.
    pide: El caudal inicial, la rugosidad aparente y el diámetro útil real.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres apartados son de los tres tipos de problema del tema. ¿Cuál
          es cada uno?
        opciones:
          - texto: >-
              a) es tipo II —se busca el caudal—, b) despeja $f$ de
              Darcy-Weisbach y c) es tipo III, con el diámetro como incógnita
            correcta: true
            mensaje: |
              Exacto, y por eso este problema vale por tres. El a) se resuelve
              con el atajo del $Re\sqrt f$, el b) es directo porque se conoce
              el caudal, y el c) obliga a iterar porque sin diámetro no hay
              ninguna entrada al ábaco.
          - texto: >-
              Los tres son de tipo I, porque en todos se conoce la pérdida de
              carga
            mensaje: |
              El tipo I es el que **da** el caudal y pide la pérdida. Aquí la
              pérdida es siempre el dato —los 10 m de diferencia
              piezométrica— y lo que se busca es el caudal, la rugosidad o el
              diámetro.
          - texto: >-
              Los tres son de tipo III, porque la tubería va cambiando
            mensaje: |
              Solo el c) busca un diámetro. En los otros dos el diámetro es un
              dato —los 800 mm— y lo que se busca es el caudal o el
              coeficiente.

      - tipo: calcular
        titulo: El caudal inicial
        pregunta: |
          ¿Qué caudal circulaba cuando la tubería era nueva?
        respuesta:
          tipo: magnitud
          valor: '1802 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1999 l/s'
            mensaje: |
              Has tomado la tubería como **lisa**, ignorando el término de la
              rugosidad en Colebrook-White: así sale $f = 0{,}0099$. Pero
              $Re\sqrt f = 264.000$ con $\varepsilon/D = 7{,}5\cdot 10^{-5}$
              cae en la franja semirrugosa, y ahí los dos términos cuentan:
              $f = 0{,}0122$.
          - valor: '1259 l/s'
            mensaje: |
              Te has dejado el **2** de $2g$: con $\sqrt f\,V =
              \sqrt{h_f D\,g/L} = 0{,}28$ en vez de $0{,}396$ todo baja en un
              factor $\sqrt 2$. La altura cinética lleva $2g$ en el
              denominador, y Darcy-Weisbach la hereda.
        pista: |
          Tipo II con $h_f = 10$ m constante: forma $Re\sqrt f$ y entra al
          ábaco por arriba. $\varepsilon = 0{,}006\ \text{cm}$ para el acero
          comercial.
        desarrollo: |
          $$
          \sqrt f\,V = \sqrt{\frac{10\cdot 0{,}8\cdot 19{,}6}{1000}} = 0{,}396
          \qquad
          Re\sqrt f = 0{,}396\cdot\frac{0{,}8}{1{,}2\cdot 10^{-6}} = 264\,000
          $$
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006}{80} = 7{,}5\cdot 10^{-5}
          \;\Longrightarrow\;
          f = 0{,}0122
          $$
          $$
          V = \frac{0{,}396}{\sqrt{0{,}0122}} = 3{,}585\ \text{m/s}
          \qquad
          Q = 1802\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La rugosidad que haría falta
        pregunta: |
          Si el diámetro no hubiera cambiado, ¿qué rugosidad explicaría que
          solo pasen $500\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '164.6 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.06 mm'
            mensaje: |
              Esa es la rugosidad de la tubería **nueva** —$0{,}006\ \text{cm}
              = 0{,}06\ \text{mm}$, la del cuadro n.º 20—. Es el dato de
              partida del apartado a), no la respuesta: lo que se busca aquí
              es la que haría falta **ahora** para explicar que solo pasen
              500 l/s, y sale casi tres mil veces mayor.
          - valor: '0.1646 mm'
            mensaje: |
              El número está bien y la unidad no. Has despejado
              $\varepsilon = 0{,}206\cdot 0{,}8\ \text{m} = 0{,}1646\
              \text{m}$ y has escrito «mm» sin convertir. Son
              $164{,}6\ \text{mm}$: mil veces más.
        pista: |
          Con el caudal conocido, despeja $f$ de Darcy-Weisbach; después usa
          Karman-Prandtl para tubería rugosa, donde $f$ solo depende de
          $\varepsilon/D$.
        desarrollo: |
          $$
          V = \frac{0{,}5}{\pi\,0{,}8^{2}/4} = 0{,}995\ \text{m/s}
          \qquad
          10 = f\,\frac{1000}{0{,}8}\,\frac{0{,}995^{2}}{19{,}6}
          \;\Longrightarrow\;
          f = 0{,}1585
          $$

          Un $f$ así de alto solo puede ser de tubería **rugosa**, donde

          $$
          \frac{1}{\sqrt f} = 2\log\frac{3{,}71}{\varepsilon/D}
          \;\Longrightarrow\;
          \frac{\varepsilon}{D} = 0{,}206
          \;\Longrightarrow\;
          \varepsilon = 0{,}206\cdot 800 = 165\ \text{mm}
          $$

      - tipo: calcular
        titulo: El diámetro útil que queda
        pregunta: |
          Con $\varepsilon = 0{,}5\ \text{cm}$, ¿qué diámetro útil le queda a
          la tubería?
        respuesta:
          tipo: magnitud
          valor: '594 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '800 mm'
            mensaje: |
              Ese es el diámetro original. La pregunta es cuánto ha quedado
              libre después de las incrustaciones, y la respuesta es unos
              veinte centímetros menos.
          - valor: '573.5 mm'
            mensaje: |
              Te has parado en la primera vuelta. $D = 1{,}156\cdot
              0{,}03^{1/5} = 0{,}5735$ sale del $f = 0{,}03$ **supuesto**, y
              con ese diámetro el ábaco devuelve $0{,}0362$, no $0{,}03$: la
              iteración no ha cerrado. Hay que volver a entrar con el $f$
              obtenido hasta que coincida con el supuesto.
        pista: |
          Sin diámetro no hay ninguna entrada al ábaco: supón $f$, despeja
          $D = 1{,}156\,f^{1/5}$ de Darcy-Weisbach, calcula $Re$ y
          $\varepsilon/D$, y repite.
        desarrollo: |
          Con $Q = 0{,}5$ y $h_f = 10$:

          $$
          10 = f\,\frac{1000}{D}\,\frac{(0{,}6366/D^{2})^{2}}{19{,}6}
          = \frac{20{,}68\,f}{D^{5}}
          \;\Longrightarrow\;
          D = 1{,}156\,f^{1/5}
          $$

          | $f$ supuesto | $D$ (m) | $V$ (m/s) | $Re$ | $\varepsilon/D$ | $f$ obtenido |
          |---|---|---|---|---|---|
          | 0,030 | 0,573 | 1,936 | $9{,}2\cdot 10^{5}$ | 0,0087 | 0,0362 |
          | 0,0362 | 0,595 | 1,796 | $8{,}9\cdot 10^{5}$ | 0,0084 | 0,0358 |
          | 0,0358 | 0,594 | 1,805 | $8{,}9\cdot 10^{5}$ | 0,0084 | 0,0358 |

          $$
          D = 594\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Nueva, la conducción llevaba 1802 l/s por gravedad con los mismos
              10 m de carga.
          - texto: >-
              Si el diámetro no hubiera cambiado, explicar los 500 l/s exigiría
              una rugosidad de 165 mm, que es absurda: sería una quinta parte
              del diámetro.
          - texto: >-
              Por eso el apartado c) cambia de hipótesis: con una rugosidad
              creíble de 5 mm, lo que ha pasado es que el diámetro útil ha
              bajado a 594 mm.
          - texto: >-
              Las dos hipótesis son igual de válidas, y la del apartado b) es
              más sencilla porque no obliga a iterar.
            trampa: true
            mensaje: |
              La del b) no es válida: **165 mm de rugosidad no existen**.
              Significaría rugosidades de dieciséis centímetros dentro de una
              tubería de ochenta, y la propia hipótesis de perfil de velocidades
              dejaría de tener sentido. El apartado b) está en el enunciado
              precisamente para que se vea que es absurda, y el c) para dar la
              explicación buena.

    resolucion: |
      **Este ejercicio vale por tres**, porque sus apartados son los tres tipos
      de problema del tema.

      **a) Tipo II.** La carga es un dato, así que $Re\sqrt f$ se calcula sin
      la velocidad:

      $$
      Re\sqrt f = 264\,000
      \quad
      \frac{\varepsilon}{D} = 7{,}5\cdot 10^{-5}
      \;\Longrightarrow\;
      f = 0{,}0122
      \;\Longrightarrow\;
      Q = 1802\ \text{l/s}
      $$

      **b) Directo.** Con el caudal conocido, $f$ se despeja de
      Darcy-Weisbach y sale $0{,}1585$ — un valor altísimo, que solo puede
      corresponder a tubería rugosa. Invirtiendo Karman-Prandtl:

      $$
      \frac{\varepsilon}{D} = 0{,}206
      \;\Longrightarrow\;
      \varepsilon = 165\ \text{mm}
      $$

      **c) Tipo III.** Sin diámetro no hay ninguna entrada al ábaco, así que se
      itera: $D = 1{,}156\,f^{1/5}$, y en tres vueltas converge a

      $$
      D = 594\ \text{mm}
      $$

      **Por qué el enunciado hace la pregunta absurda del b).** Ciento sesenta
      y cinco milímetros de rugosidad en una tubería de ochocientos significan
      irregularidades de dieciséis centímetros: no es una tubería incrustada,
      es una cueva. El apartado está ahí para que el resultado **se vea
      imposible**, y con él caiga la hipótesis de que el diámetro no ha
      cambiado.

      La explicación buena es la del c): con una rugosidad creíble para la caliza
      —$5\ \text{mm}$— lo que ha pasado es que **la sección se ha estrechado un
      26 %**, de 800 a 594 mm. Y con eso el caudal cae de 1802 a 500 l/s: una
      reducción del diámetro de la cuarta parte se lleva **las tres cuartas
      partes del caudal**, porque en Darcy-Weisbach el diámetro entra a la
      quinta.

      **Es un ejercicio de método más que de números**: enseña que cuando un
      resultado sale absurdo, lo que hay que revisar no es la cuenta sino la
      hipótesis.

  - id: ejflu18-col68-la-ducha-de-campo-y-los-lideres
    titulo: La ducha de campo, y los líderes
    fuente: Ejercicio 6.8 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Los alumnos de Mecánica de Fluidos de la EUP de Donostia-San Sebastián
      construyen una ducha de campo con una cisterna de 220 l, como se muestra
      en la figura. La mayoría de los alumnos se duchan con agua a 12 °C
      (S₁ = 1), pero los líderes calientan el agua a 35 °C (S₂ = 0,99). Ambas
      duchas emplean una tubería de cobre de 15 mm de diámetro interior. El
      nivel en el tanque está 1 m por encima de las 2 descargas B y C.

      <figure class="figura-examen">
      <svg viewBox="0 0 600 300" role="img" width="600" height="300"
           aria-labelledby="f68t f68d">
        <title id="f68t">La ducha de campo: cisterna, las dos tuberias y las dos descargas</title>
        <desc id="f68d">Arriba en el centro, la cisterna abierta con el agua,
        marcada A. De su fondo salen dos tuberias. La 1 va hacia la izquierda
        y baja a la descarga B, la ducha de agua fria. La 2 baja hasta un
        hornillo, da la vuelta, sube y va hacia la derecha hasta la descarga
        C, la ducha caliente. Las dos descargas estan al mismo nivel, un metro
        por debajo de la superficie del agua de la cisterna.</desc>
        <defs>
          <marker id="m68n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M250,55 H350 V110 H250 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M250,32 V110 H350 V32" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="250" y1="55" x2="350" y2="55" stroke="var(--live)" stroke-width="1.5"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="var(--ink)">A</text>
        <path d="M262,110 V128 H170 V145" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <path d="M300,110 V250 H330 V128 H430 V145" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <path d="M164,148 l-5,9 M170,148 l0,10 M176,148 l5,9" stroke="var(--live)" stroke-width="1.4"/>
        <path d="M424,148 l-5,9 M430,148 l0,10 M436,148 l5,9" stroke="var(--live)" stroke-width="1.4"/>
        <text x="184" y="158" font-size="12" fill="var(--ink)">B</text>
        <text x="444" y="158" font-size="12" fill="var(--ink)">C</text>
        <circle cx="215" cy="118" r="10" fill="var(--paper)" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="215" y="122" text-anchor="middle" font-size="11" fill="var(--alt)">1</text>
        <circle cx="385" cy="118" r="10" fill="var(--paper)" stroke="var(--alt)" stroke-width="1.4"/>
        <text x="385" y="122" text-anchor="middle" font-size="11" fill="var(--alt)">2</text>
        <path d="M305,262 l4,-8 M315,262 l4,-8 M325,262 l4,-8" stroke="var(--flag)" stroke-width="2"/>
        <line x1="300" y1="266" x2="332" y2="266" stroke="var(--ink)" stroke-width="2"/>
        <text x="316" y="280" text-anchor="middle" font-size="9.5" fill="var(--flag)">hornillo</text>
        <path d="M120,155 V240 H230 V155" fill="none" stroke="var(--faint)" stroke-width="1.6"/>
        <text x="175" y="205" text-anchor="middle" font-size="12" fill="var(--faint)">12 °C</text>
        <path d="M380,155 V240 H490 V155" fill="none" stroke="var(--faint)" stroke-width="1.6"/>
        <text x="435" y="205" text-anchor="middle" font-size="12" fill="var(--faint)">35 °C</text>
        <line x1="100" y1="145" x2="520" y2="145" stroke="var(--faint)" stroke-width="1" stroke-dasharray="6 4"/>
        <text x="215" y="102" text-anchor="middle" font-size="9.5" fill="var(--faint)">tubería 1: 7 m, 2 codos</text>
        <text x="455" y="102" text-anchor="middle" font-size="9.5" fill="var(--faint)">tubería 2: 9 m, 4 codos</text>
        <line x1="350" y1="55" x2="546" y2="55" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="520" y1="145" x2="546" y2="145" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="540" y1="55" x2="540" y2="145" stroke="var(--faint)" stroke-width="1" marker-start="url(#m68n)" marker-end="url(#m68n)"/>
        <text x="548" y="104" font-size="11" fill="var(--faint)">1 m</text>
      </svg>
      <figcaption>La cisterna reparte por dos caminos. El de la izquierda, corto, va directo a la ducha fría; el de la derecha pasa por el hornillo y es dos metros más largo, con el doble de codos.</figcaption>
      </figure>

      **a)** Indicar las longitudes equivalentes de las piezas colocadas en la
      tubería 1 y los factores de paso de las colocadas en la tubería 2.

      **b)** Calcular el caudal Q₁ que llega a la ducha de los alumnos
      (Hazen-Williams, método de longitud equivalente).

      **c)** Calcular el caudal Q₂ que llega a la ducha de los líderes (Moody,
      método de los factores de paso).

      **Datos.** Tubería 1: salida depósito tipo Borda; 2 codos bruscos 90°;
      longitud L₁ = 7 m; D₁ = 15 mm. Tubería 2: salida depósito tipo Borda;
      4 codos bruscos 90°; longitud L₂ = 9 m; D₂ = 15 mm. Material de las
      tuberías: cobre.
    pide: La longitud equivalente de la tubería 1, y los dos caudales de ducha.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la tubería 1 por longitudes equivalentes y la 2
          por factores de paso. ¿En qué se diferencian los dos métodos?
        opciones:
          - texto: 'En nada de fondo: los dos cuentan la misma pérdida, uno como metros de tubería y el otro como múltiplos de la energía cinética'
            correcta: true
            mensaje: |
              Exacto. La longitud equivalente dice «este codo pierde lo mismo
              que un metro de tubería recta»; el factor de paso dice «este
              codo pierde 1,13 veces la altura cinética». Son la misma pérdida
              contada de dos maneras, y aquí se piden las dos para practicar
              las dos.
          - texto: La longitud equivalente vale en régimen laminar y el factor de paso en turbulento
            mensaje: |
              Ninguno de los dos está atado a un régimen. Lo que sí cambia es
              la fórmula de la pérdida lineal que se use después:
              Hazen-Williams en el apartado b) y Darcy-Weisbach en el c).
          - texto: La longitud equivalente ya incluye la fricción de la tubería y el factor de paso no
            mensaje: |
              La longitud equivalente **se suma** a la longitud real de la
              tubería, no la sustituye: aquí son 7 m de tubo más 2,45 m
              equivalentes de piezas.

      - tipo: calcular
        titulo: La longitud equivalente de la tubería 1
        pregunta: |
          Longitud equivalente total de la tubería 1, sabiendo que el Cuadro nº 23 da 0,45 m para la salida de depósito tipo Borda y 1 m por cada
          codo brusco de 90°.
        respuesta:
          tipo: magnitud
          valor: '9.45 m'
          tolerancia: 0.01
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '2.45 m'
            mensaje: |
              Has sumado solo las piezas. La longitud equivalente **se añade**
              a la tubería real: 7 m de tubo más 2,45 m de piezas.
          - valor: '9 m'
            mensaje: |
              Te has dejado la salida de depósito. El tipo Borda es un tubo
              que entra en el depósito, y es la salida que más pierde de
              todas: 0,45 m equivalentes.
          - valor: '8.45 m'
            mensaje: |
              Has contado un solo codo. Son dos, a 1 m cada uno.
        pista: |
          $L_{eq}^{total} = L_{real} + \sum L_{eq}$ de cada pieza.
        desarrollo: |
          $$
          L_{eq} = 7 + 0{,}45 + 2\cdot 1 = 9{,}45\ \text{m}
          $$

          Y en la tubería 2, con el Cuadro nº 24 de factores de paso: salida
          tipo Borda K = 1 y codo brusco de 90° K = 1,13 por codo, de modo que
          $\sum K = 1 + 4\cdot 1{,}13 = 5{,}52$.

      - tipo: calcular
        titulo: El caudal de la ducha fría
        pregunta: |
          Caudal Q₁ que llega a la ducha de los alumnos, por Hazen-Williams.
          El cobre tiene $C_{HW} = 140$, y como 15 mm no está tabulado se usa
          $J = 1{,}2117\cdot 10^{10}/(C^{1{,}852}D^{4{,}87}) = 2{,}4055$, con
          D en mm y Q en l/s.
        respuesta:
          tipo: magnitud
          valor: '0.18 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s)
        distractores:
          - valor: '0.209 l/s'
            mensaje: |
              Has usado los 7 m de tubería sin sumarle las longitudes
              equivalentes de las piezas. Con 9,45 en vez de 7 el caudal baja
              un 14 %.
          - valor: '0.185 l/s'
            mensaje: |
              Te has dejado la energía cinética de salida. El agua sale por la
              ducha con velocidad: ese $V_B^{2}/2g$ también se come parte del
              metro de altura disponible.
        pista: |
          Bernoulli entre la superficie de la cisterna y la salida:
          $1 = h_f + V_B^{2}/2g$, con $h_f = J\,L_{eq}\,Q^{1{,}852}$ y
          $V_B = 5{,}66\,Q$.
        desarrollo: |
          $$
          Z_A - h_f = \frac{V_B^{2}}{2g} \qquad h_f = 2{,}4055\cdot 9{,}45\cdot Q_1^{1{,}852}
          $$

          Con $V_B = Q_1\cdot 10^{-3}/(\pi\,0{,}015^{2}/4) = 5{,}66\,Q_1$, la
          altura cinética vale $1{,}634\,Q_1^{2}$, y la ecuación queda

          $$
          1{,}634\,Q_1^{2} + 22{,}732\,Q_1^{1{,}852} - 1 = 0
          $$

          Resolviendo por Newton-Raphson, **Q₁ = 0,18 l/s**. El reparto de ese
          metro de altura es revelador: 0,947 m se los lleva la fricción y
          solo 0,053 m quedan como energía cinética.

      - tipo: calcular
        titulo: El caudal de la ducha caliente
        pregunta: |
          Caudal Q₂ que llega a la ducha de los líderes, por Darcy-Weisbach.
          El agua a 35 °C tiene $\nu = 7\cdot 10^{-7}$ m²/s y el cobre
          $\varepsilon/D = 0{,}0001$.
        respuesta:
          tipo: magnitud
          valor: '0.1651 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s)
        distractores:
          - valor: '0.190 l/s'
            mensaje: |
              Te has dejado los factores de paso de las piezas. Cuatro codos
              bruscos y una salida Borda suman 5,52, más que la propia
              tubería en el término $(600f + 6{,}52)$.
          - valor: '0.169 l/s'
            mensaje: |
              Te has dejado la energía cinética de salida. Al pasar $V^{2}/2g$
              al otro lado de Bernoulli, el coeficiente es 6,52, no 5,52.
        pista: |
          $1 = (600f + 6{,}52)V^{2}/2g$. Como la tubería se comporta como
          lisa, $f = 0{,}316/Re^{0{,}25}$ (Blasius) y se itera.
        desarrollo: |
          $$
          h_f = f\,\frac{9}{0{,}015}\frac{V^{2}}{2g} + (1 + 4\cdot 1{,}13)\frac{V^{2}}{2g} \;\Longrightarrow\; 1 = (600f + 6{,}52)\frac{V^{2}}{2g}
          $$

          La tubería se comporta como lisa: la frontera está en
          $Re' = 23/(\varepsilon/D) = 230\,000$ y el Reynolds va a salir del
          orden de 20 000, así que vale Blasius, $f = 0{,}316/Re^{0{,}25}$.

          | f supuesto | V [m/s] | Re | f calculado |
          |---|---|---|---|
          | 0,0250 | 0,9543 | 20 450 | 0,0264 |
          | 0,0264 | 0,9360 | 20 056 | 0,0266 |
          | **0,0266** | **0,9343** | **20 021** | **0,0266** |

          $$
          Q_2 = 0{,}9343\cdot\frac{\pi\,0{,}015^{2}}{4}\cdot 10^{3} = 0{,}1651\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena por qué los líderes se duchan peor. Una pieza es falsa.
        piezas:
          - texto: 'Las dos duchas tienen el mismo metro de altura disponible y el mismo diámetro: lo único que las diferencia es el camino.'
          - texto: 'La tubería 2 es dos metros más larga y lleva cuatro codos en vez de dos, así que pierde más.'
          - texto: 'Con 0,1651 contra 0,1798 l/s, la ducha caliente recibe un 8 % menos de agua.'
          - texto: 'Y calentar el agua no lo compensa: bajar la viscosidad de 12 a 35 °C ayuda un poco, pero no llega a tapar los dos metros y los dos codos de más.'
          - texto: Los líderes reciben menos agua porque el agua caliente es menos densa y pesa menos sobre la salida.
            trampa: true
            mensaje: |
              La densidad se va de la ecuación. Bernoulli está escrito en
              metros de columna del propio fluido, y con la cisterna abierta y
              la salida a la atmósfera el metro de altura es un metro para los
              dos. Lo que la temperatura sí cambia es la **viscosidad**, y por
              ahí ayuda, no estorba.
    resolucion: |
      ## Dos caminos y un metro de altura

      El problema es una comparación disfrazada. Los dos circuitos salen de la
      misma cisterna, tienen el mismo diámetro y disponen del mismo metro de
      desnivel. Lo único que cambia es el camino —7 m y 2 codos contra 9 m y 4
      codos— y la temperatura del agua. Al final, el que tiene el camino corto
      gana.

      ## a) Las piezas, contadas de dos maneras

      **Tubería 1, por longitudes equivalentes** (Cuadro nº 23): salida de
      depósito tipo Borda 0,45 m, codo brusco de 90° 1 m por codo.

      $$
      L_{eq} = 7 + 0{,}45 + 2\cdot 1 = 9{,}45\ \text{m}
      $$

      **Tubería 2, por factores de paso** (Cuadro nº 24): salida Borda K = 1,
      codo brusco de 90° K = 1,13 por codo.

      $$
      \sum K = 1 + 4\cdot 1{,}13 = 5{,}52
      $$

      Conviene fijarse en la salida tipo Borda, que es la que más pierde de
      todas las entradas a una tubería: el tubo se mete **dentro** del
      depósito y la vena se contrae de golpe. El Cuadro nº 24 la pone por
      encima de la salida con ángulos vivos y muy por encima de la
      redondeada.

      Y una advertencia sobre las referencias: el boletín cita «ábaco nº 20» y
      «cuadro nº 21», que en la edición actual de *Cuadros y ábacos* son el
      **nº 23** —longitudes equivalentes— y el **nº 24** —coeficientes K—. Los
      valores son los mismos; la numeración cambió.

      ## b) La ducha de los alumnos

      Bernoulli entre la superficie de la cisterna y la salida de la ducha,
      con la única altura disponible siendo el metro de desnivel:

      $$
      1 = h_f + \frac{V_B^{2}}{2g} \qquad h_f = J\,L_{eq}\,Q_1^{1{,}852}
      $$

      El diámetro de 15 mm no está en el cuadro de Hazen-Williams, así que se
      usa la expresión:

      $$
      J = \frac{1{,}2117\cdot 10^{10}}{140^{1{,}852}\cdot 15^{4{,}87}} = 2{,}4055
      $$

      y con $V_B = 5{,}66\,Q_1$ queda

      $$
      1{,}634\,Q_1^{2} + 22{,}732\,Q_1^{1{,}852} - 1 = 0 \;\Longrightarrow\; Q_1 = 0{,}18\ \text{l/s}
      $$

      **0,18 l/s son 11 litros por minuto**, así que la cisterna de 220 l da
      para unos veinte minutos de ducha. Y el reparto del metro de altura es
      lo que hay que mirar: 0,947 m se pierden en fricción y solo 0,053 m
      salen como velocidad. Esta ducha es casi toda pérdida de carga.

      ## c) La ducha de los líderes

      Aquí se pide Darcy-Weisbach y factores de paso:

      $$
      1 = (600f + 6{,}52)\frac{V^{2}}{2g}
      $$

      —el 600 es $L/D = 9/0{,}015$, el 5,52 son las piezas y el 1 que falta es
      la energía cinética de salida—. Con $\varepsilon/D = 0{,}0001$ la
      frontera de tubería lisa está en $Re' = 23/(\varepsilon/D) = 230\,000$,
      muy por encima del Reynolds de este flujo, así que la tubería se
      comporta como lisa y vale Blasius. Iterando: f = 0,0266, V = 0,9343 m/s,
      **Q₂ = 0,1651 l/s**.

      ## Quién gana, y por qué

      | | tubería 1 | tubería 2 |
      |---|---|---|
      | longitud | 7 m | 9 m |
      | codos | 2 | 4 |
      | temperatura | 12 °C | 35 °C |
      | caudal | **0,1798 l/s** | **0,1651 l/s** |

      Un 8 % menos para los líderes. Y la temperatura juega a su favor —el
      agua caliente es menos viscosa y roza menos—, pero no le llega para
      compensar dos metros más de tubo y dos codos más.

      La tentación es explicarlo por la densidad: el agua caliente pesa menos.
      No es eso. Bernoulli aquí está escrito en metros de columna del propio
      fluido, y con la cisterna abierta y la ducha a la atmósfera el metro de
      desnivel vale un metro para los dos, sea cual sea la densidad. Lo que la
      temperatura cambia es la viscosidad.

      Y una advertencia de método: los dos caudales están calculados con
      **fórmulas distintas** porque el enunciado lo pide así. Hazen-Williams
      es empírica y solo vale para agua; Darcy-Weisbach es general. Comparar
      dos números obtenidos por caminos distintos siempre pide un poco de
      prudencia, aunque aquí la diferencia de método es mucho menor que la
      diferencia de camino.

  # ── COLECCIÓN 6.9. Laminar puro y en dos líneas, con el resultado en
  #    presión por metro. Sirve de contraste con todo lo demás del capítulo.
  - id: ejflu18-col69-el-capilar-de-mercurio
    titulo: Un capilar de mercurio, y la pérdida por metro en régimen laminar
    fuente: >-
      Ejercicio 6.9 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene un tubo de $1\ \text{mm}$ de diámetro por el que fluye mercurio
      a $20\ °\text{C}$, siendo el número de Reynolds de $1600$. Se pide:

      a) Pérdida de energía piezométrica por metro de conducto.

      (Del ábaco de viscosidades, $\nu_{Hg} = 1{,}2\cdot 10^{-7}\
      \text{m}^{2}/\text{s}$; $s_{Hg} = 13{,}6$.)
    pide: La pérdida de presión por metro de tubo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es el Reynolds, no la velocidad. ¿Qué se puede decir de
          entrada?
        opciones:
          - texto: >-
              Que el flujo es laminar —1600 está por debajo de 2000— y por
              tanto $f = 64/Re$, sin mirar la rugosidad
            correcta: true
            mensaje: |
              Eso es, y ahorra el ábaco entero. En laminar la rugosidad no
              interviene: el tubo puede ser de vidrio o de fundición oxidada y
              la pérdida es la misma.
          - texto: >-
              Que hay que entrar en el ábaco de Moody con $Re = 1600$
            mensaje: |
              Se puede, pero es innecesario: en la zona laminar el ábaco es la
              recta $f = 64/Re$ y esa fórmula es exacta. El ábaco solo hace
              falta en turbulento.
          - texto: >-
              Que falta la rugosidad del tubo para poder seguir
            mensaje: |
              No hace falta. Por debajo de $Re = 2000$ el coeficiente de
              frotamiento depende **solo** del Reynolds, y esa es una de las
              conclusiones de Nikuradse.

      - tipo: calcular
        titulo: La pérdida por metro
        pregunta: |
          ¿Cuánta presión se pierde por metro de tubo, en kPa/m?
        respuesta:
          tipo: magnitud
          valor: '10.03 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.7375 kpa'
            mensaje: |
              Has usado el peso específico del agua para pasar de metros de
              columna a presión. El fluido es mercurio: $\gamma = 13{,}6\cdot
              9800 = 133\,280\ \text{N/m}^{3}$.
          - valor: '0.01003 kpa'
            mensaje: |
              Te has dejado el $1/D$ de Darcy-Weisbach. Con $D = 1\ \text{mm}$
              ese factor vale **mil**, y es lo que hace enorme la pérdida en un
              capilar.
        pista: |
          $v = Re\,\nu/D$, después $f = 64/Re$ y Darcy-Weisbach con $L = 1$ m.
          Al final, de metros de columna de mercurio a pascales.
        desarrollo: |
          $$
          v = \frac{Re\,\nu}{D} = \frac{1600\cdot 1{,}2\cdot 10^{-7}}{0{,}001}
          = 0{,}192\ \text{m/s}
          \qquad
          f = \frac{64}{1600} = 0{,}04
          $$
          $$
          \frac{h_f}{L} = f\,\frac{1}{D}\,\frac{v^{2}}{2g}
          = 0{,}04\cdot 1000\cdot\frac{0{,}192^{2}}{19{,}6}
          = 0{,}0752\ \frac{\text{m de Hg}}{\text{m}}
          $$
          $$
          \frac{\Delta p}{L} = 13{,}6\cdot 9800\cdot 0{,}0752
          = 10\,030\ \frac{\text{Pa}}{\text{m}} = 10{,}0\ \frac{\text{kPa}}{\text{m}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $Re = 1600$ el flujo es laminar, así que $f = 64/Re = 0{,}04$
              y la rugosidad no interviene.
          - texto: >-
              La velocidad sale del propio Reynolds, $v = Re\,\nu/D =
              0{,}192$ m/s.
          - texto: >-
              Darcy-Weisbach con $L = 1$ m da $0{,}075$ m de columna de
              mercurio, que son 10 kPa por metro de tubo.
          - texto: >-
              Diez kilopascales por metro es poco: apenas una décima de
              atmósfera.
            trampa: true
            mensaje: |
              Es **muchísimo**: una atmósfera cada diez metros de tubo, y eso
              con el mercurio moviéndose a diecinueve centímetros por segundo.
              La razón es el $1/D$ de Darcy-Weisbach: con un milímetro de
              diámetro ese factor vale mil.

    resolucion: |
      **Todo el ejercicio cabe en tres líneas** porque el régimen es laminar y
      ahí no hay ábaco que consultar:

      $$
      v = \frac{Re\,\nu}{D} = 0{,}192\ \text{m/s}
      \qquad
      f = \frac{64}{Re} = 0{,}04
      $$
      $$
      \frac{h_f}{L} = f\frac{1}{D}\frac{v^{2}}{2g} = 0{,}0752\ \text{m de Hg/m}
      \;\Longrightarrow\;
      \frac{\Delta p}{L} = 10{,}0\ \text{kPa/m}
      $$

      **Y hay una forma cerrada que conviene conocer.** Sustituyendo
      $f = 64/Re$ y $v = Re\,\nu/D$ en Darcy-Weisbach, todo se simplifica:

      $$
      \frac{h_f}{L} = \frac{32\,\nu^{2}\,Re}{g\,D^{3}}
      $$

      Con el diámetro **al cubo** en el denominador. Eso es lo que hace que un
      capilar pierda tanto: reducir el diámetro a la mitad, manteniendo el
      Reynolds, multiplica la pérdida por ocho.

      **Diez kilopascales por metro** significa una atmósfera cada diez metros
      de tubo, y el mercurio va a menos de veinte centímetros por segundo. Es
      el mundo opuesto al de una conducción industrial, y por eso los
      viscosímetros capilares funcionan: la pérdida es tan grande y tan
      predecible que medirla da la viscosidad con precisión.

  # ── COLECCIÓN 6.10. El único del capítulo donde la trampa no está en el
  #    ábaco sino en una conversión: «8 kg/cm² de altura útil» son 80 metros
  #    de columna de AGUA, y el fluido es un aceite. Quien no divida entre
  #    0,85 se deja un 18 % de la distancia.
  - id: ejflu18-col610-las-estaciones-de-bombeo-del-aceite
    titulo: Cada cuánto hay que volver a bombear el aceite
    fuente: >-
      Ejercicio 6.10 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se bombean por una tubería de $0{,}5\ \text{m}$ de diámetro interior de
      acero roblonado con $\varepsilon = 0{,}5\ \text{cm}$,
      $100\ \text{l/s}$ de un aceite de viscosidad $0{,}1$ Poises y peso
      específico relativo $0{,}85$. Si las bombas utilizadas generan una
      altura útil equivalente a $8\ \text{kg/cm}^{2}$, se pide:

      a) Distancia a que deberían situarse dos estaciones de bombeo
      consecutivas.
    pide: La separación entre dos estaciones de bombeo consecutivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba da «una altura útil equivalente a $8\ \text{kg/cm}^{2}$», y
          el fluido es un aceite de densidad relativa $0{,}85$. ¿Cuántos
          metros de columna **de aceite** son?
        opciones:
          - texto: >-
              Más de 80: la equivalencia $1\ \text{kg/cm}^{2} = 10\ \text{m}$
              es de columna de agua, y una columna de aceite tiene que ser
              más alta para dar la misma presión
            correcta: true
            mensaje: |
              Eso es. La presión es $p = \gamma h$, así que para la misma $p$
              un fluido más ligero necesita más altura:
              $h = p/\gamma_{\text{aceite}} = 80/0{,}85 = 94{,}1$ m.
          - texto: >-
              Exactamente 80, porque $1\ \text{kg/cm}^{2}$ son 10 metros de
              columna y da igual el fluido
            mensaje: |
              Los 10 metros son **de agua**. Es la conversión más repetida del
              curso y por eso se aplica sin pensar; pero aquí el peso
              específico es $0{,}85\cdot 9800$, y la altura sale mayor, no
              igual.
          - texto: >-
              Menos de 80, porque el aceite pesa menos y la bomba tiene que
              esforzarse menos
            mensaje: |
              La bomba se esfuerza menos en **potencia**, sí, pero la pregunta
              es de altura. Y una columna de un líquido ligero tiene que ser
              **más** alta para producir la misma presión, no menos: piensa en
              cuánto mide una columna de aire que dé 1 atmósfera.

      - tipo: calcular
        titulo: La altura útil, en metros de aceite
        pregunta: |
          ¿A cuántos metros de columna de aceite equivalen los
          $8\ \text{kg/cm}^{2}$?
        respuesta:
          tipo: magnitud
          valor: '94.12 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '80 m'
            mensaje: |
              Esos son metros de columna de **agua**. La equivalencia
              $1\ \text{kg/cm}^{2} = 10\ \text{mca}$ lleva el agua metida
              dentro; para pasar a columna de aceite hay que dividir entre la
              densidad relativa.
          - valor: '68 m'
            mensaje: |
              Has multiplicado por $0{,}85$ en vez de dividir. Comprueba el
              sentido: si el aceite pesa menos que el agua, su columna tiene
              que ser **más** alta para dar los mismos $8\ \text{kg/cm}^{2}$.
        pista: |
          $p = \gamma h$, con $\gamma = 0{,}85\cdot 9800\ \text{N/m}^{3}$ y
          $p = 8\cdot 9{,}8\cdot 10^{4}\ \text{Pa}$.
        desarrollo: |
          $$
          H = \frac{p}{\gamma} = \frac{8\cdot 9{,}8\cdot 10^{4}}
          {0{,}85\cdot 9800} = 94{,}12\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente de frotamiento
        pregunta: |
          ¿Cuánto vale $f$? La viscosidad cinemática es
          $\nu = \mu/\rho = 0{,}01/850$.
        respuesta:
          tipo: numero
          valor: '0.0405'
          tolerancia: 0.0015
          formato: un número sin unidades
        distractores:
          - valor: '0.002957'
            mensaje: |
              Has usado $f = 64/Re$, que es la fórmula del régimen **laminar**.
              Con $Re = 21.645$ el flujo es turbulento de sobra: la frontera
              está en 2000.
          - valor: '0.0379'
            mensaje: |
              Ese es el valor de la zona **rugosa**, el que da Karman-Prandtl
              con $\varepsilon/D = 0{,}01$ sola. Pero $Re = 21.645$ está por
              debajo de $Re'' = 560/0{,}01 = 56.000$: todavía queda subcapa
              laminar, y el Reynolds sigue contando.
        pista: |
          $\varepsilon/D = 0{,}01$ y $Re = VD/\nu$ con
          $V = 0{,}1/(\pi\,0{,}25^{2})$. Con los dos, al ábaco.
        desarrollo: |
          $$
          V = \frac{0{,}1}{\pi\,0{,}5^{2}/4} = 0{,}509\ \text{m/s}
          \qquad
          \nu = \frac{0{,}01}{850} = 1{,}176\cdot 10^{-5}\ \text{m}^{2}/\text{s}
          $$
          $$
          Re = \frac{0{,}509\cdot 0{,}5}{1{,}176\cdot 10^{-5}} = 21\,645
          \qquad
          \frac{\varepsilon}{D} = \frac{0{,}5}{50} = 0{,}01
          \;\Longrightarrow\;
          f = 0{,}0405
          $$

      - tipo: calcular
        titulo: La separación entre estaciones
        pregunta: |
          ¿Qué longitud de tubería consume exactamente la altura que da una
          estación?
        respuesta:
          tipo: magnitud
          valor: '86540 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '74673 m'
            mensaje: |
              Has gastado los 80 metros de columna de agua en vez de los
              $94{,}12$ de columna de aceite. Son un 15 % menos de altura, y
              como la longitud es proporcional a la altura, un 15 % menos de
              distancia.
          - valor: '93901 m'
            mensaje: |
              La altura está bien; el $f$ es el de la zona rugosa,
              $0{,}0379$, y aquí el flujo es semirrugoso con $f = 0{,}0405$.
              Un 6 % menos de rozamiento da un 6 % más de distancia.
        pista: |
          Toda la altura útil se va en rozamiento: $H = f\,(L/D)\,V^{2}/2g$, y
          la incógnita es $L$.
        desarrollo: |
          $$
          94{,}12 = 0{,}0405\,\frac{L}{0{,}5}\,\frac{0{,}509^{2}}{19{,}6}
          \;\Longrightarrow\;
          L \approx 8{,}7\cdot 10^{4}\ \text{m}
          $$

          Unos **87 km**, que es la cifra que hay que dar. El boletín publica
          86.540 m; la diferencia del 1,5 % viene de leer el ábaco.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba da $8\ \text{kg/cm}^{2}$, que en columna de aceite son
              $94{,}12$ m, no 80.
          - texto: >-
              Con $Re = 21.645$ y $\varepsilon/D = 0{,}01$ el flujo es
              semirrugoso y $f = 0{,}0405$.
          - texto: >-
              Toda esa altura se gasta en rozamiento, y con ella la tubería
              recorre unos 87 km antes de necesitar otra estación.
          - texto: >-
              Si en vez de aceite se bombeara agua, con la misma bomba las
              estaciones podrían separarse todavía más.
            trampa: true
            mensaje: |
              Al revés. Con agua la misma presión de $8\ \text{kg/cm}^{2}$ da
              **80** metros de columna, no 94: menos altura disponible y por
              tanto **menos** distancia. Que el fluido sea ligero juega a
              favor aquí, y es justo lo contrario de lo que la intuición dice.

    resolucion: |
      **La conversión, que es donde está el ejercicio.** La bomba da una
      presión, y el enunciado la expresa en $\text{kg/cm}^{2}$. Pasarla a
      metros exige el peso específico **del fluido que se bombea**:

      $$
      H = \frac{p}{\gamma} = \frac{8\cdot 9{,}8\cdot 10^{4}}{0{,}85\cdot 9800}
      = 94{,}12\ \text{m de aceite}
      $$

      Los $80$ mca de la conversión de memoria son columna de agua. Aquí
      valen un 15 % menos de lo que hace falta.

      **El coeficiente.** $V = 0{,}509$ m/s, $\nu = 1{,}176\cdot 10^{-5}$
      m²/s, $Re = 21.645$. Con $\varepsilon/D = 0{,}01$ el punto cae en la
      franja semirrugosa —$Re'$ vale 2300 y $Re''$, 56.000— y el ábaco da
      $f = 0{,}0405$.

      **La distancia.** La estación siguiente se pone donde el rozamiento se
      ha comido toda la altura:

      $$
      L = \frac{H\,D\,2g}{f\,V^{2}} \approx 8{,}7\cdot 10^{4}\ \text{m}
      $$

      **Sobre el número publicado.** El boletín da 86.540 m; iterando
      Colebrook-White hasta converger salen 87.850. La diferencia es del
      1,5 %, y sale de leer $f = 0{,}0411$ en el ábaco en vez de $0{,}0405$
      —seis diezmilésimas, que en el eje logarítmico del Moody es menos que
      el grosor de la línea—. Las dos respuestas son la misma; se da por
      buena cualquiera de las dos.

      **Y lo que el resultado enseña.** Ochenta y siete kilómetros entre
      estaciones para 100 l/s de aceite. Un oleoducto no se dimensiona por la
      bomba: se dimensiona por cada cuánto puedes permitirte poner una, y esa
      distancia es lo que fija el diámetro.

  - id: ejflu18-col611-cien-metros-de-tubo-de-cinco-milimetros
    titulo: Cien metros de tubo de cinco milímetros
    fuente: Ejercicio 6.11 · Colección de problemas, capítulo 6 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En la instalación esquematizada de la figura circula un fluido de
      viscosidad $\nu = 2{,}5\cdot 10^{-6}$ m²/s. Determinar:

      **a)** Caudal circulante.

      **b)** Comprobar que el flujo es laminar.

      **c)** Longitud **l** a partir de la cual no se puede asegurar que el
      flujo es laminar.

      **Datos:** Diámetro del tubo D = 5 mm. Presión en sección 1:
      $p_1 = 0{,}1$ kg/cm². s = 0,8. No considerar las pérdidas de carga
      menores.

      <figure class="figura-examen">
      <svg viewBox="0 0 560 265" role="img" width="560" height="265"
           aria-labelledby="f611t f611d">
        <title id="f611t">El tubo inclinado, con las secciones 1, 2 y 3</title>
        <desc id="f611d">Un tubo recto y muy largo baja de izquierda a
        derecha. En su extremo alto esta la seccion 1, donde se conoce la
        presion; en el bajo, la seccion 2, un metro por debajo. Del extremo
        bajo sale una boquilla vertical corta hasta la seccion 3, por donde el
        liquido gotea a la atmosfera. La pendiente del dibujo esta muy
        exagerada: en realidad el tubo baja un metro en cien. La longitud l,
        marcada desde la seccion 1, es la incognita del apartado c, asi que su
        tamano en el dibujo no significa nada.</desc>
        <defs>
          <marker id="m611n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M60,60 L400,180 V205" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M396,205 L404,205 L401.5,222 L398.5,222 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <circle cx="400" cy="232" r="2" fill="var(--live)"/>
        <circle cx="400" cy="242" r="2.4" fill="var(--live)"/>
        <circle cx="400" cy="253" r="2.8" fill="var(--live)"/>
        <path d="M55,55 l10,10 M65,55 l-10,10" stroke="var(--flag)" stroke-width="1.6"/>
        <text x="46" y="60" text-anchor="end" font-size="12" fill="var(--ink)">1</text>
        <path d="M395,175 l10,10 M405,175 l-10,10" stroke="var(--flag)" stroke-width="1.6"/>
        <text x="384" y="176" text-anchor="end" font-size="12" fill="var(--ink)">2</text>
        <path d="M395,217 l10,10 M405,217 l-10,10" stroke="var(--flag)" stroke-width="1.6"/>
        <text x="416" y="226" font-size="12" fill="var(--ink)">3</text>
        <path d="M64,72 L150,102" fill="none" stroke="var(--alt)" stroke-width="1.4" marker-start="url(#m611n)" marker-end="url(#m611n)"/>
        <text x="112" y="98" font-size="12" fill="var(--alt)">l</text>
        <text x="230" y="150" text-anchor="middle" font-size="10.5" fill="var(--faint)">L = 100 m</text>
        <line x1="308" y1="147" x2="322" y2="135" stroke="var(--faint)" stroke-width="1"/>
        <text x="326" y="134" font-size="10.5" fill="var(--faint)">D = 5 mm</text>
        <text x="72" y="46" font-size="10.5" fill="var(--faint)">p1 = 0,1 kg/cm²</text>
        <line x1="60" y1="60" x2="480" y2="60" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="400" y1="180" x2="480" y2="180" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="470" y1="60" x2="470" y2="180" stroke="var(--faint)" stroke-width="1" marker-start="url(#m611n)" marker-end="url(#m611n)"/>
        <text x="478" y="124" font-size="10.5" fill="var(--faint)">1 m</text>
      </svg>
      <figcaption>Cien metros de tubo que bajan un metro. La pendiente va muy exagerada para poder dibujarla, y la longitud l es lo que se pregunta, así que lo que mide en el dibujo no significa nada.</figcaption>
      </figure>
    pide: El caudal, el régimen del flujo y hasta dónde se puede garantizar que es laminar.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que no se consideren las pérdidas menores. ¿Qué
          más se puede despreciar aquí, y por qué?
        opciones:
          - texto: Las alturas cinéticas, porque con un caudal tan pequeño valen una décima de milímetro frente a los 2,25 m disponibles
            correcta: true
            mensaje: |
              Eso es. La velocidad va a salir de siete centésimas de metro por
              segundo, así que $V^{2}/2g \approx 2{,}4\cdot 10^{-4}$ m. Frente
              a los 2,25 m de altura motriz es cuatro órdenes de magnitud
              menos: no cambia ni la cuarta cifra.
          - texto: La pérdida de carga, porque el caudal es diminuto
            mensaje: |
              Al revés: **toda** la altura disponible se va en fricción. Un
              tubo de 5 mm y 100 m de largo es un tubo capilar larguísimo, y
              por eso el caudal sale tan pequeño.
          - texto: El desnivel de 1 m, porque es despreciable frente a los 100 m de tubo
            mensaje: |
              Los 100 m son longitud de tubo, no altura. El desnivel de 1 m es
              casi la mitad de la altura motriz —2,25 m en total— y sin él el
              caudal se quedaría en poco más de la mitad.

      - tipo: calcular
        titulo: La velocidad en el tubo
        pregunta: |
          Velocidad del fluido en el tubo de 5 mm. La presión en 1 es
          0,1 kg/cm² y el fluido tiene s = 0,8.
        respuesta:
          tipo: magnitud
          valor: '0.0689 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '0.0613 m/s'
            mensaje: |
              No has pasado la presión a metros de columna del fluido.
              0,1 kg/cm² es 1 mca, y en un líquido de s = 0,8 eso son
              $1/0{,}8 = 1{,}25$ m de columna, no 1 m.
          - valor: '0.0383 m/s'
            mensaje: |
              Te has dejado el desnivel. El tubo baja 1 m entre 1 y 2, y esa
              altura empuja igual que la presión.
          - valor: '0.0551 m/s'
            mensaje: |
              Has multiplicado por la densidad relativa en vez de dividir. Un
              líquido más ligero necesita **más** columna para la misma
              presión.
        pista: |
          Toda la altura motriz se va en fricción laminar:
          $h_f = \dfrac{32\,\nu\,L\,V}{g\,D^{2}}$, que es Hagen-Poiseuille con
          $f = 64/Re$ ya sustituido.
        desarrollo: |
          La altura motriz entre 1 y 3, con la salida a la atmósfera y las
          alturas cinéticas despreciables:

          $$
          H = \frac{p_1}{\gamma} + \Delta z = \frac{1}{0{,}8} + 1 = 2{,}25\ \text{m}
          $$

          Suponiendo régimen laminar, $f = 64/Re$ y Darcy-Weisbach se reduce a
          Hagen-Poiseuille:

          $$
          h_f = \frac{32\,\nu\,L\,V}{g\,D^{2}} = 2{,}25 \;\Longrightarrow\; V = \frac{2{,}25\cdot 9{,}8\cdot 0{,}005^{2}}{32\cdot 2{,}5\cdot 10^{-6}\cdot 100} = 0{,}0689\ \text{m/s}
          $$

          $$
          Q = 0{,}0689\cdot\frac{\pi\,0{,}005^{2}}{4} = 1{,}353\cdot 10^{-6}\ \text{m}^{3}/\text{s} = 1{,}35\cdot 10^{-3}\ \text{l/s}
          $$

          Es decir, **1,35 cm³ por segundo**: menos de cinco litros a la hora.

      - tipo: calcular
        titulo: El Reynolds, que hay que comprobar
        pregunta: |
          Número de Reynolds del flujo, para confirmar que la hipótesis
          laminar era buena.
        respuesta:
          tipo: numero
          valor: '138'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '68.9'
            mensaje: |
              Has usado el radio. El Reynolds de una tubería se define con el
              **diámetro**: $Re = VD/\nu$.
          - valor: '137813'
            mensaje: |
              Has metido el diámetro en milímetros. En
              $Re = VD/\nu$ todo va en unidades SI: D = 0,005 m.
        pista: |
          $Re = VD/\nu$, con todo en unidades SI.
        desarrollo: |
          $$
          Re = \frac{0{,}0689\cdot 0{,}005}{2{,}5\cdot 10^{-6}} = 138
          $$

          Muy por debajo de 2000, así que la hipótesis con la que se ha
          calculado la velocidad se sostiene: el flujo es laminar y
          $f = 64/138 = 0{,}464$. Es un coeficiente de fricción enorme
          comparado con los 0,02 o 0,03 habituales, y explica que un tubo tan
          fino se coma 2,25 m de carga con un caudal de gotas.

      - tipo: justificar
        pregunta: Ordena qué pasa a lo largo del tubo con el régimen. Una pieza es falsa.
        piezas:
          - texto: 'El caudal es el mismo en toda la tubería, así que la velocidad media y el Reynolds valen lo mismo en cualquier sección: 138.'
          - texto: 'Lo que sí cambia con la distancia es el perfil de velocidades: a la entrada es casi uniforme y la capa límite va creciendo desde la pared.'
          - texto: 'Hasta que esa capa límite llena el conducto, el flujo está en transición y el perfil todavía no es la parábola de Poiseuille.'
          - texto: 'Y la propia capa límite deja de ser laminar cuando su Reynolds local, medido con la distancia recorrida, alcanza el valor crítico.'
          - texto: El Reynolds del flujo crece a lo largo del tubo, y por eso a partir de cierta longitud el flujo deja de ser laminar.
            trampa: true
            mensaje: |
              El Reynolds del flujo, $VD/\nu$, no depende de la distancia: el
              caudal, el diámetro y la viscosidad son los mismos de principio
              a fin. Lo que depende de la distancia es el Reynolds **local**
              de la capa límite, $Vx/\nu$, que es otra cosa y es el que
              gobierna el apartado c).
    resolucion: |
      ## Un capilar de cien metros

      Lo primero es hacerse una idea del tamaño. Un tubo de 5 mm y 100 m de
      largo tiene una relación $L/D$ de **20 000**. Con un desnivel de un
      metro y una presión de 0,1 kg/cm², lo que sale es un goteo: 1,35 cm³ por
      segundo, menos de cinco litros a la hora.

      ## a) El caudal

      La altura motriz es la presión de la sección 1 más el desnivel, todo en
      metros de columna **del fluido**:

      $$
      H = \frac{p_1}{\gamma} + \Delta z = \frac{1\ \text{mca}}{0{,}8} + 1 = 1{,}25 + 1 = 2{,}25\ \text{m}
      $$

      Las alturas cinéticas se desprecian, y con razón: la velocidad va a
      salir de 0,069 m/s, así que $V^{2}/2g = 2{,}4\cdot 10^{-4}$ m. Cuatro
      órdenes de magnitud por debajo.

      Suponiendo laminar, $f = 64/Re$, y Darcy-Weisbach se convierte en
      Hagen-Poiseuille:

      $$
      h_f = f\,\frac{L}{D}\frac{V^{2}}{2g} = \frac{64\nu}{VD}\cdot\frac{L}{D}\cdot\frac{V^{2}}{2g} = \frac{32\,\nu\,L\,V}{g\,D^{2}}
      $$

      Igualando a 2,25 m sale **V = 0,0689 m/s** y
      **Q = 1,35·10⁻³ l/s**.

      ## b) La comprobación

      $$
      Re = \frac{0{,}0689\cdot 0{,}005}{2{,}5\cdot 10^{-6}} = 138
      $$

      Laminar sin discusión, así que la hipótesis se sostiene. Y conviene
      mirar el coeficiente de fricción que sale: $f = 64/138 = 0{,}46$, veinte
      veces el de una tubería industrial normal.

      ## c) Y aquí hay que declarar un desacuerdo

      La pregunta —«longitud l a partir de la cual no se puede asegurar que el
      flujo es laminar»— **no se refiere al Reynolds del flujo**, que vale 138
      en todas las secciones y no depende de la distancia. Se refiere a la
      capa límite: según los apuntes de la Escuela (tema 17), a la entrada del
      tubo el perfil es casi uniforme y desde la pared crece una capa límite
      laminar que va engordando; su transición a turbulenta se produce cuando
      el Reynolds **local**, medido con la distancia recorrida,

      $$
      Re_x = \frac{V\,x}{\nu}
      $$

      alcanza el valor crítico.

      El problema está en cuál es ese valor crítico, y aquí las dos fuentes de
      la asignatura no dicen lo mismo:

      | criterio | l |
      |---|---|
      | $Re_x = 3\cdot 10^{5}$ | 10,88 m |
      | $Re_x = 5\cdot 10^{5}$ (mínimo de los apuntes) | 18,14 m |
      | $Re_x = 10^{6}$ (máximo de los apuntes) | 36,28 m |

      **El resultado publicado en el boletín, 10,78 m, se reproduce tomando
      $Re_x = 3\cdot 10^{5}$** —da 10,88 m, un 1 % de diferencia, que es lo
      que cabe en redondear el caudal—. Pero los apuntes de la Escuela dicen
      textualmente que la transición «se verifica para un número de Reynolds
      que oscila entre 500.000 y 1.000.000», lo que llevaría a 18,1 m como
      mínimo.

      No hay forma de resolver la contradicción desde dentro del enunciado, así
      que se deja dicha: **el método es el de arriba, y el número depende del
      criterio de transición que se adopte.** Si en el examen se pide este
      apartado, lo prudente es escribir la expresión $l = Re_{x,cr}\,\nu/V$,
      decir qué valor crítico se está usando y por qué, y dar el número que
      salga.

      Lo que sí queda firme, y es lo que la pregunta quiere enseñar: **el
      Reynolds del conducto y el Reynolds de la capa límite son dos números
      distintos.** El primero decide el régimen del flujo desarrollado y no
      depende de la distancia; el segundo decide cuándo la capa límite deja de
      ser laminar y crece con ella.

  # ── COLECCIÓN 6.13. El «Big Inch» de verdad —el oleoducto que Estados
  #    Unidos construyó en 1942— y el ejercicio más completo del capítulo:
  #    lleva las dos direcciones, potencia a partir del caudal y caudal a
  #    partir de la potencia, y la segunda obliga a iterar al revés.
  - id: ejflu18-col613-el-big-inch
    titulo: El Big Inch, y qué pasa cuando la bomba envejece
    fuente: >-
      Ejercicio 6.13 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El «Big Inch» es un oleoducto de acero comercial de $600\ \text{mm}$ de
      diámetro interior, proyectado para transportar un caudal de
      $47\,000\ \text{m}^{3}$ de petróleo crudo por día, en funcionamiento
      constante y estaciones de bombeo cada $80\ \text{km}$. Se pide:

      a) Potencia bruta necesaria en cada estación ($\eta = 75\ \%$).

      b) Caudal circulante si al cabo de cierto tiempo el rendimiento de las
      bombas ha bajado al $70\ \%$ y el coeficiente de frotamiento de la
      tubería ha aumentado en un $10\ \%$, habiendo conseguido mantener
      constante la potencia bruta de la bomba.

      Datos: peso específico relativo $= 0{,}86$; temperatura
      $= 10\ °\text{C}$; supóngase la conducción horizontal. La viscosidad
      cinemática del crudo a esa temperatura se lee en el ábaco:
      $\nu \approx 10^{-5}\ \text{m}^{2}/\text{s}$.
    pide: La potencia bruta por estación, y el caudal cuando la instalación se degrada.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide «potencia **bruta**» y da un rendimiento del
          75 %. ¿Qué relación hay entre esa potencia y $\gamma Q H$?
        opciones:
          - texto: >-
              $\gamma Q H$ es la potencia útil, la que recibe el fluido, y la
              bruta es mayor: se divide entre el rendimiento
            correcta: true
            mensaje: |
              Eso es. La bomba absorbe más de lo que entrega, y el rendimiento
              mide cuánto se pierde por el camino:
              $P_{\text{bruta}} = \gamma Q H/\eta$.
          - texto: >-
              $\gamma Q H$ es la bruta, y la útil sale de multiplicarla por el
              rendimiento
            mensaje: |
              Está del revés. $\gamma Q H$ es exactamente la energía por
              segundo que **el fluido gana**, es decir la útil. Lo que la
              bomba consume de la red es más, y el rendimiento es el cociente
              entre las dos.
          - texto: >-
              Son la misma potencia; «bruta» y «útil» se refieren a si se mide
              en kW o en CV
            mensaje: |
              No: son dos potencias distintas, y aquí se diferencian en un
              33 %. La unidad no tiene nada que ver — kW y CV son unidades de
              las dos por igual.

      - tipo: calcular
        titulo: La pérdida en un tramo
        pregunta: |
          ¿Cuánta carga pierde el crudo en los 80 km que separan dos
          estaciones?
        respuesta:
          tipo: magnitud
          valor: '454 m'
          tolerancia: 0.04
          formato: una longitud, con su unidad
        distractores:
          - valor: '301.5 m'
            mensaje: |
              Has entrado por el eje derecho del ábaco, como si la tubería
              fuera **rugosa**: eso da $f = 0{,}0120$. Con
              $\varepsilon/D = 10^{-4}$ la frontera rugosa está en
              $Re'' = 5{,}6\cdot 10^{6}$, y aquí el Reynolds es 115.000: muy
              lejos.
          - valor: '551 m'
            mensaje: |
              Un factor diez en la rugosidad. El acero comercial tiene
              $\varepsilon = 0{,}006\ \text{cm}$ en el cuadro n.º 20, no
              $0{,}06$: con $\varepsilon/D = 10^{-3}$ saldría $f = 0{,}0219$ y
              esos 551 m.
        pista: |
          $Q = 47.000/86.400$ m³/s. Con $\varepsilon = 0{,}006$ cm y
          $\nu = 10^{-5}$, al ábaco, y después Darcy-Weisbach con
          $L = 80.000$ m.
        desarrollo: |
          $$
          Q = \frac{47\,000}{86\,400} = 0{,}544\ \text{m}^{3}/\text{s}
          \qquad
          V = \frac{0{,}544}{\pi\,0{,}6^{2}/4} = 1{,}924\ \text{m/s}
          $$
          $$
          Re = \frac{1{,}924\cdot 0{,}6}{10^{-5}} = 1{,}154\cdot 10^{5}
          \qquad
          \frac{\varepsilon}{D} = \frac{0{,}006}{60} = 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0180
          $$
          $$
          h_f = 0{,}0180\,\frac{80\,000}{0{,}6}\,\frac{1{,}924^{2}}{19{,}6}
          = 454\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia bruta por estación
        pregunta: |
          ¿Qué potencia bruta necesita cada estación de bombeo?
        respuesta:
          tipo: magnitud
          valor: '2785 kW'
          tolerancia: 0.04
          formato: una potencia, con su unidad
        distractores:
          - valor: '2081 kW'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q h_f$. Falta dividir entre
              el rendimiento: la bomba consume un tercio más de lo que entrega
              al crudo.
          - valor: '1843 kW'
            mensaje: |
              Viene de haber usado el $f$ de la zona rugosa, $0{,}0120$, en
              vez del semirrugoso $0{,}0180$. La potencia es proporcional a
              $f$, así que el error se traslada entero.
        pista: |
          $P_{\text{bruta}} = \gamma Q h_f/\eta$, con
          $\gamma = 0{,}86\cdot 9800\ \text{N/m}^{3}$.
        desarrollo: |
          $$
          P = \frac{\gamma Q h_f}{\eta}
          = \frac{0{,}86\cdot 9800\cdot 0{,}544\cdot 454}{0{,}75}
          = 2{,}78\cdot 10^{6}\ \text{W}
          $$

      - tipo: calcular
        titulo: El caudal de la instalación envejecida
        pregunta: |
          Con el rendimiento en el 70 %, el coeficiente de frotamiento un
          10 % mayor y la misma potencia bruta, ¿cuánto caudal pasa?
        respuesta:
          tipo: magnitud
          valor: '515 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '544 l/s'
            mensaje: |
              Ese es el caudal de proyecto, el del apartado a). Que la
              potencia bruta se mantenga no significa que el caudal se
              mantenga: la bomba entrega menos al fluido —peor rendimiento— y
              la tubería exige más —más rozamiento—, así que el caudal tiene
              que bajar.
          - valor: '461.6 l/s'
            mensaje: |
              Parece que has escalado el caudal **linealmente** con la
              potencia útil y con el rozamiento. No es lineal: la potencia va
              con $Q^{3}$, porque $h_f$ ya lleva $Q^{2}$ dentro. Un 12 % menos
              de potencia útil no es un 12 % menos de caudal, es un 4 %.
        pista: |
          Escribe $P = \gamma Q h_f/\eta$ con $h_f$ en función de $Q$: sale
          $P \propto Q^{3}$. Después despeja.
        desarrollo: |
          $$
          P = \frac{\gamma}{\eta}\,Q\cdot f'\,\frac{L}{D}\,
          \frac{Q^{2}}{A^{2}\,2g}
          \;\Longrightarrow\;
          Q^{3} = \frac{P\,\eta\,D\,A^{2}\,2g}{\gamma\,f'\,L}
          $$

          Con $P = 2{,}78\cdot 10^{6}$ W, $\eta = 0{,}70$ y
          $f' = 1{,}1\cdot 0{,}0180 = 0{,}0198$:

          $$
          Q = 0{,}515\ \text{m}^{3}/\text{s} = 515\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada estación tiene que vencer 454 m de pérdida y consume
              2785 kW brutos para hacerlo.
          - texto: >-
              Al envejecer, el rendimiento baja del 75 al 70 % y el
              rozamiento sube un 10 %, pero la potencia contratada sigue
              siendo la misma.
          - texto: >-
              Como la potencia va con el cubo del caudal, esas dos pérdidas
              juntas solo se llevan un 5 % del transporte: de 544 a 515 l/s.
          - texto: >-
              Y como la caída es tan pequeña, la degradación de la
              instalación apenas cuesta dinero.
            trampa: true
            mensaje: |
              La caída de **caudal** es pequeña; el coste no. Se sigue pagando
              la misma potencia por mover un 5 % menos de crudo, y eso es un
              5 % más de energía por metro cúbico transportado, todos los días
              y en cada una de las estaciones. La misma ley del cubo que
              amortigua el caudal es la que hace cara la ineficiencia.

    resolucion: |
      **Por qué este ejercicio va el último del capítulo.** Recorre las dos
      direcciones del cálculo de conducciones: de caudal a potencia, que es
      directo, y de potencia a caudal, que no lo es.

      **a) De caudal a potencia.** $Q = 47.000/86.400 = 0{,}544$ m³/s,
      $V = 1{,}924$ m/s, $Re = 1{,}15\cdot 10^{5}$, y con
      $\varepsilon/D = 10^{-4}$ el ábaco da $f = 0{,}0180$. La pérdida en los
      80 km es de 454 m de columna de crudo, y la potencia bruta,

      $$
      P = \frac{0{,}86\cdot 9800\cdot 0{,}544\cdot 454}{0{,}75}
      = 2785\ \text{kW}
      $$

      **b) De potencia a caudal.** Aquí está lo que hay que ver: si se
      sustituye $h_f$ por su expresión, la potencia queda proporcional a
      $Q^{3}$. Eso cambia toda la intuición del apartado — un cambio grande
      en la potencia se traduce en uno pequeño en el caudal, y al revés.

      $$
      Q = \sqrt[3]{\frac{P\,\eta\,D\,A^{2}\,2g}{\gamma\,f'\,L}}
      = 515\ \text{l/s}
      $$

      **Lo que sale de comparar los dos apartados.** El rendimiento cae un
      6,7 % relativo y el rozamiento sube un 10 %: entre las dos, la potencia
      útil disponible baja un 15 %. Y el caudal solo baja un **5,3 %**,
      porque la raíz cúbica amortigua. Esa es la razón de que un oleoducto
      degradado siga funcionando sin que se note: el síntoma no aparece en el
      caudal, aparece en la factura.

      **Sobre la viscosidad, y por qué la tolerancia de este ejercicio es más
      ancha.** El crudo a 10 °C no está en ningún cuadro numérico: se lee en
      el ábaco de viscosidades, y de ahí sale $\nu \approx 10^{-5}$ m²/s. Con
      ese valor la potencia sale 2775 kW frente a los 2785 publicados —un
      0,4 %—, que es la precisión con la que se lee una escala logarítmica a
      ojo.

      Y hay una segunda holgura, más interesante. $Re = 1{,}15\cdot 10^{5}$
      queda **por debajo** de la primera frontera, $Re' = 23/10^{-4} =
      2{,}3\cdot 10^{5}$: según el criterio del tema, la tubería todavía se
      comporta como lisa. Si se toma así, $f = 0{,}0175$ y la potencia sale
      2688 kW. Colebrook-White completo, que es lo que reproduce el número
      del boletín, da $0{,}0180$ y 2785 kW. La diferencia es del 3,5 %, y las
      dos lecturas son defendibles: por eso este paso admite un 4 % en vez
      del 2 % habitual. **La frontera no es una pared, es el sitio donde el
      segundo término empieza a no importar** — y aquí todavía importa un
      poco.

  # ── COLECCIÓN 6.15. Tipo II con el atajo del Re·√f, igual que el 6.2 pero
  #    con cota: sirve para ver que el método no cambia.
  - id: ejflu18-col615-el-fueloil-entre-a-y-b
    titulo: Fuel-oil entre dos puntos con presión y cota conocidas
    fuente: >-
      Ejercicio 6.15 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Los puntos $A$ y $B$ de una conducción están unidos por una tubería de
      acero comercial de $15\ \text{cm}$ de diámetro interior y
      $1200\ \text{m}$ de longitud. El punto $B$ está situado $15\ \text{m}$
      por encima de $A$ y las presiones en $A$ y $B$ son respectivamente
      $8{,}6$ y $3{,}4\ \text{kg/cm}^{2}$. Se pide:

      a) Caudal de fuel-oil a $21\ °\text{C}$ que circulará entre $A$ y $B$.

      Datos: viscosidad $= 3{,}83\cdot 10^{-6}\ \text{m}^{2}/\text{s}$;
      densidad relativa $s = 0{,}854$.
    pide: El caudal de fuel-oil que circula.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de problema es y qué permite resolverlo sin iterar?
        opciones:
          - texto: >-
              Tipo II con $h_f$ constante: se puede calcular $Re\sqrt f$ sin
              conocer la velocidad y entrar al ábaco por la escala de arriba
            correcta: true
            mensaje: |
              Exacto. La pérdida sale entera de las presiones y las cotas, así
              que es un número; y con un número, la velocidad se cancela en el
              producto $Re\sqrt f$.
          - texto: >-
              Tipo I: se conocen el caudal y la geometría
            mensaje: |
              El caudal es justamente la incógnita. Lo que se conoce es la
              pérdida de carga, y eso es el tipo II.
          - texto: >-
              Tipo III, porque hay que iterar para encontrar el diámetro
            mensaje: |
              El diámetro es un dato, 15 cm. El tipo III es cuando hay que
              dimensionar la tubería, y ese sí obliga a iterar siempre.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánta carga se pierde entre $A$ y $B$?
        respuesta:
          tipo: magnitud
          valor: '45.89 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '60.89 m'
            mensaje: |
              Te has dejado la cota. $B$ está $15\ \text{m}$ más alto, y esos
              quince metros los paga el fluido con presión: no son pérdida por
              rozamiento.
          - valor: '38.06 m'
            mensaje: |
              Has usado el peso específico del agua. El fuel-oil tiene
              $s = 0{,}854$, así que la misma diferencia de presión equivale a
              más metros de su columna.
        pista: |
          $h_f = (p_A - p_B)/\gamma - \Delta z$, con $\gamma$ del fuel-oil.
        desarrollo: |
          $$
          \frac{p_A-p_B}{\gamma} = \frac{5{,}2\cdot 98\,000}{0{,}854\cdot 9800}
          = 60{,}89\ \text{mcl}
          $$
          $$
          h_f = 60{,}89 - 15 = 45{,}89\ \text{mcl}
          $$

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '41.77 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '48.63 l/s'
            mensaje: |
              Has usado los $60{,}89\ \text{m}$ como pérdida, sin descontar la
              cota. Con más carga disponible sale más caudal, pero esos quince
              metros se los lleva la altura, no el rozamiento.
          - valor: '37.75 l/s'
            mensaje: |
              Has convertido la diferencia de presiones con el peso específico
              del agua en vez del del fuel-oil, así que la pérdida te ha salido
              corta: $38{,}06$ en vez de $45{,}89$ metros de columna.
        pista: |
          $Re\sqrt f = \dfrac{D}{\nu}\sqrt{\dfrac{h_f\,D\,2g}{L}}$, y con
          $\varepsilon/D$ se lee $f$.
        desarrollo: |
          $$
          \sqrt f\,V = \sqrt{\frac{45{,}89\cdot 0{,}15\cdot 19{,}6}{1200}}
          = 0{,}3353
          \qquad
          Re\sqrt f = 0{,}3353\cdot\frac{0{,}15}{3{,}83\cdot 10^{-6}} = 13\,132
          $$
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006}{15} = 4\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0201
          $$
          $$
          V = \frac{0{,}3353}{\sqrt{0{,}0201}} = 2{,}36\ \text{m/s}
          \qquad
          Q = 41{,}8\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              De las presiones y la cota sale la pérdida de carga: 45,89 metros
              de columna de fuel-oil.
          - texto: >-
              Como es un número, se puede formar $Re\sqrt f = 13.132$ sin
              conocer la velocidad, y entrar al ábaco por arriba.
          - texto: >-
              Con $\varepsilon/D = 4\cdot 10^{-4}$ sale $f = 0{,}0201$ y de
              ahí $V = 2{,}36$ m/s, es decir 41,8 l/s.
          - texto: >-
              Como el punto $B$ está más alto y a menos presión, el fluido
              podría estar circulando en cualquiera de los dos sentidos.
            trampa: true
            mensaje: |
              El Bernoulli de $A$ es $60{,}89$ y el de $B$, $15$: la energía
              total es mayor en $A$, así que el flujo va de $A$ a $B$ y no hay
              ambigüedad. Es la misma comprobación del ejercicio 3.10, y aquí
              además la pérdida sale positiva, que es la señal de que el
              sentido supuesto es el bueno.

    resolucion: |
      **La pérdida de carga sale de restar los dos Bernoullis**, y el término
      de cota hay que descontarlo porque no es rozamiento:

      $$
      h_f = \frac{p_A-p_B}{\gamma} - \Delta z = 60{,}89 - 15 = 45{,}89\ \text{mcl}
      $$

      **Con la pérdida conocida, el atajo del tipo II**:

      $$
      Re\sqrt f = \frac{D}{\nu}\sqrt{\frac{h_f D\,2g}{L}} = 13\,132
      \qquad
      \frac{\varepsilon}{D} = 4\cdot 10^{-4}
      \;\Longrightarrow\;
      f = 0{,}0201
      $$
      $$
      Q = 41{,}8\ \text{l/s}
      $$

      **Es el mismo método del ejercicio 6.2**, con una diferencia que conviene
      notar: allí los dos extremos eran superficies libres y la pérdida salía
      de cotas y presiones de depósito; aquí son dos puntos de la propia
      tubería y salen de dos manómetros. **El método no cambia** — lo único que
      hace falta es que $h_f$ resulte ser un número y no una función de la
      velocidad.

      Y la señal de que el planteamiento es coherente: $h_f$ sale **positiva**.
      Si hubiera salido negativa, el flujo iría al revés y habría que rehacer
      el planteamiento cambiando el signo de la cota.
