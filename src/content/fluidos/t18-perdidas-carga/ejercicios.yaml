ejercicios:
  # ── NUESTRO (§08). La colección entra directamente a calcular pérdidas, y
  #    da por sabido lo que decide qué fórmula se usa. Este ejercicio es solo
  #    eso: las dos fronteras, y el resultado —que una tubería de acero de
  #    100 mm con agua nunca llega a comportarse como rugosa— explica por qué
  #    casi todos los problemas del capítulo caen en semirrugoso.
  - id: ejflu18-cuando-la-tuberia-deja-de-ser-lisa
    titulo: Las dos fronteras, y por qué casi todo cae en semirrugoso
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería de acero comercial de $100\ \text{mm}$ de diámetro
      circula agua a $20\ °\text{C}$ ($\nu = 10^{-6}\ \text{m}^{2}/\text{s}$).

      La rugosidad de diseño del acero comercial y soldado es
      $\varepsilon = 0{,}006\ \text{cm}$ (cuadro n.º 20 de «Cuadros y
      ábacos»).

      a) Calcular la rugosidad relativa.

      b) Calcular la frontera $Re' = 23/(\varepsilon/D)$, entre comportamiento
      liso y semirrugoso.

      c) Calcular la velocidad a la que la tubería deja de comportarse como
      hidráulicamente lisa.
    pide: La rugosidad relativa, la primera frontera y la velocidad que le corresponde.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es lo que hace que una tubería se comporte como lisa o como
          rugosa?
        opciones:
          - texto: >-
              La comparación entre el espesor de la subcapa laminar y la altura
              de las rugosidades, y como la subcapa adelgaza al subir el
              Reynolds, el mismo tubo cambia de comportamiento
            correcta: true
            mensaje: |
              Eso es, y es la frase del tema: **un tubo no es liso o rugoso,
              se comporta** como uno u otro. La rugosidad relativa es fija; lo
              que cambia con el caudal es la película que la tapa.
          - texto: >-
              El material del que está hecha: el cobre es liso y la fundición
              rugosa
            mensaje: |
              El material fija $\varepsilon$, y con él la rugosidad relativa,
              pero no el comportamiento. Una tubería de fundición a poca
              velocidad puede comportarse como lisa, y una de cobre muy fina a
              gran velocidad, como rugosa.
          - texto: >-
              El régimen: en laminar es lisa y en turbulento, rugosa
            mensaje: |
              En laminar la rugosidad **no interviene en absoluto** —$f = 64/Re$
              y ahí no aparece $\varepsilon$—, así que no es que sea «lisa».
              Y el turbulento se reparte entre los tres comportamientos según
              el Reynolds.

      - tipo: calcular
        titulo: La rugosidad relativa
        pregunta: |
          ¿Cuánto vale $\varepsilon/D$?
        respuesta:
          tipo: numero
          valor: '0.0006'
          tolerancia: 0.000005
          formato: un número sin unidades
        distractores:
          - valor: '0.6'
            mensaje: |
              Has mezclado unidades: la rugosidad en milímetros y el diámetro
              en metros. Es un cociente adimensional, así que las dos van en
              lo mismo: $0{,}006/10$ en cm, o $6\cdot 10^{-5}/0{,}1$ en m.
          - valor: '0.006'
            mensaje: |
              Un factor diez. Comprueba el diámetro: son $100\ \text{mm} =
              10\ \text{cm}$, no 1. La rugosidad relativa de una conducción
              corriente anda siempre en el entorno de $10^{-4}$.
        pista: |
          Las dos magnitudes en la misma unidad, y el resultado sin unidades.
        desarrollo: |
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006\ \text{cm}}{10\ \text{cm}}
          = 6\cdot 10^{-4}
          $$

      - tipo: calcular
        titulo: La primera frontera
        pregunta: |
          ¿Para qué número de Reynolds deja la tubería de comportarse como
          lisa?
        respuesta:
          tipo: numero
          valor: '38333'
          tolerancia: 100
          formato: un número sin unidades
        distractores:
          - valor: '933330'
            mensaje: |
              Has usado el 560, que es la **segunda** frontera —la que separa
              semirrugoso de rugoso—. La primera, lisa a semirrugosa, lleva el
              23.
          - valor: '0.000026'
            mensaje: |
              Has dividido al revés: $(\varepsilon/D)/23$ en vez de
              $23/(\varepsilon/D)$. La frontera es un número de Reynolds, así
              que tiene que salir grande, en los miles.
        pista: |
          $Re' = 23/(\varepsilon/D)$, con la rugosidad relativa del apartado
          anterior.
        desarrollo: |
          $$
          Re' = \frac{23}{6\cdot 10^{-4}} = 38\,333
          $$

      - tipo: calcular
        titulo: La velocidad correspondiente
        pregunta: |
          ¿A qué velocidad del agua se alcanza esa frontera?
        respuesta:
          tipo: magnitud
          valor: '0.3833 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '9.333 m/s'
            mensaje: |
              Esa es la velocidad de la **segunda** frontera, la que haría a
              esta tubería hidráulicamente rugosa. Es un dato interesante
              —nueve metros por segundo no se dan en una conducción de agua—
              pero no es lo que se pregunta.
          - valor: '3.833 m/s'
            mensaje: |
              Un factor diez, casi seguro en el diámetro: en $v = Re\,\nu/D$
              hay que meter $D = 0{,}1\ \text{m}$, no $0{,}01$.
        pista: |
          $Re = vD/\nu$, y ahora el Reynolds es el dato.
        desarrollo: |
          $$
          v = \frac{Re'\,\nu}{D} = \frac{38\,333\cdot 10^{-6}}{0{,}1}
          = 0{,}383\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\varepsilon/D = 6\cdot 10^{-4}$, las dos fronteras caen en
              $Re' = 38.333$ y $Re'' = 9{,}33\cdot 10^{5}$.
          - texto: >-
              En agua eso son $0{,}38$ y $9{,}3$ m/s: por encima de cuarenta
              centímetros por segundo la tubería ya no es lisa.
          - texto: >-
              Como las conducciones de agua trabajan entre 1 y 3 m/s, esta
              tubería está casi siempre en la franja semirrugosa, y por eso
              casi todos los problemas se resuelven con Colebrook-White.
          - texto: >-
              Y como el tramo semirrugoso es tan ancho, se puede usar en él la
              fórmula de Blasius, que es explícita y más cómoda.
            trampa: true
            mensaje: |
              Blasius vale **solo** para tubería lisa y $Re \le 10^{5}$; en
              semirrugoso da un valor que no es. Si molesta iterar
              Colebrook-White, lo que se usa es la explícita de Swamee y Jain,
              que sí está pensada para esa franja.

    resolucion: |
      **La rugosidad relativa.**
      $\varepsilon/D = 0{,}006/10 = 6\cdot 10^{-4}$, con la rugosidad de
      diseño del cuadro n.º 20 —que para el acero comercial y soldado es
      $0{,}006\ \text{cm}$, no el valor que dan otros manuales—.

      **Las dos fronteras.**

      $$
      Re' = \frac{23}{6\cdot 10^{-4}} = 38\,333
      \qquad
      Re'' = \frac{560}{6\cdot 10^{-4}} = 9{,}33\cdot 10^{5}
      $$

      **En velocidades de agua**, con $v = Re\,\nu/D$:

      $$
      v' = 0{,}38\ \text{m/s}
      \qquad
      v'' = 9{,}3\ \text{m/s}
      $$

      **Lo que esto significa, que es todo el ejercicio.** Una conducción de
      agua se diseña entre 1 y 3 m/s: por encima se erosiona y da golpe de
      ariete, por debajo hay que poner un tubo enorme. Es decir, esta tubería
      trabaja **siempre** por encima de la primera frontera y **nunca** llega a
      la segunda.

      Traducido: pasa toda su vida en la franja **semirrugosa**. Por eso la
      fórmula que se acaba usando en casi todos los problemas del capítulo es
      Colebrook-White, que es la implícita, y por eso el ábaco de Moody sigue
      siendo útil en vez de una curiosidad histórica.

      Y ojo con la lectura contraria: que el acero comercial no llegue a
      comportarse como rugoso **con agua** no significa que nadie lo haga. Con
      una tubería vieja e incrustada, $\varepsilon$ puede ser cien veces mayor,
      y entonces la segunda frontera baja a velocidades corrientes.

  # ── COLECCIÓN 6.1. Tipo I y laminar: el caso donde la rugosidad no
  #    interviene. Corto, y sirve para fijar que hf sale en metros de columna
  #    DEL FLUIDO, que es lo que se falla al calcular la potencia.
  - id: ejflu18-la-glicerina-y-la-potencia-perdida
    titulo: Glicerina por un tubo de cobre, y la potencia que se pierde
    fuente: >-
      Ejercicio 6.1 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una tubería horizontal de cobre de $100\ \text{m}$ de longitud y
      $100\ \text{mm}$ de diámetro, circula un caudal de $12\ \text{l/s}$ de
      glicerina a $30\ °\text{C}$ ($s = 1{,}547$). Determinar la potencia
      consumida en pérdida de carga.

      Datos de tablas: $\nu_{\text{glicerina a }30°} = 1{,}9\cdot 10^{-4}\ \text{m}^{2}/\text{s}$;
      $\varepsilon_{\text{cobre}} = 0{,}00015\ \text{cm}$.
    pide: La potencia consumida en pérdidas de carga.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de buscar nada en el ábaco: ¿qué hay que calcular primero?
        opciones:
          - texto: >-
              El número de Reynolds, porque si sale laminar el coeficiente es
              directo y la rugosidad ni se mira
            correcta: true
            mensaje: |
              Exacto, y aquí ese atajo se cobra: la glicerina es muy viscosa y
              el Reynolds sale de 804, muy laminar. El dato de la rugosidad del
              cobre que da el enunciado **no se usa**.
          - texto: >-
              La rugosidad relativa, que es la que identifica la curva del
              ábaco
            mensaje: |
              Es una de las dos entradas, sí, pero solo hace falta si el flujo
              es turbulento. Calcular primero el Reynolds puede ahorrarte el
              ábaco entero, como pasa en este ejercicio.
          - texto: >-
              La pérdida de carga con Darcy-Weisbach, y de ahí se despeja todo
              lo demás
            mensaje: |
              Darcy-Weisbach necesita $f$, y $f$ necesita el Reynolds. El orden
              es al revés: velocidad, Reynolds, coeficiente, y por último la
              pérdida.

      - tipo: calcular
        titulo: El número de Reynolds
        pregunta: |
          ¿Qué número de Reynolds tiene la glicerina?
        respuesta:
          tipo: numero
          valor: '804'
          tolerancia: 8
          formato: un número sin unidades
        distractores:
          - valor: '1244'
            mensaje: |
              Has multiplicado por la densidad relativa. La viscosidad
              **cinemática** ya lleva la densidad dentro ($\nu = \mu/\rho$):
              con $\nu$ se usa $Re = vD/\nu$ a secas, sin $s$ ni $\rho$.
          - valor: '8042'
            mensaje: |
              Un factor diez en el diámetro: son $0{,}1\ \text{m}$. Y fíjate en
              que ese valor te habría llevado a turbulento y a buscar el ábaco
              para nada.
        pista: |
          $v = Q/A$ primero, con $A = \pi D^{2}/4$; después $Re = vD/\nu$.
        desarrollo: |
          $$
          v = \frac{0{,}012}{\pi\cdot 0{,}1^{2}/4} = 1{,}53\ \text{m/s}
          \qquad
          Re = \frac{1{,}53\cdot 0{,}1}{1{,}9\cdot 10^{-4}} = 804
          $$

          Por debajo de 2000: **laminar**, y la rugosidad del cobre no
          interviene.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánto vale $h_f$?
        respuesta:
          tipo: magnitud
          valor: '9.5 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14.7 m'
            mensaje: |
              Has multiplicado por la densidad relativa. La pérdida de carga
              sale ya en **metros de columna de glicerina**: la densidad entra
              después, al pasar a presión o a potencia.
          - valor: '2.37 m'
            mensaje: |
              Te falta el factor $L/D = 1000$, o lo has puesto como $L/D = 250$.
              Comprueba: 100 m de tubo entre 0,1 m de diámetro.
        pista: |
          $h_f = f\,\dfrac{L}{D}\,\dfrac{v^{2}}{2g}$, con $f = 64/Re$.
        desarrollo: |
          $$
          f = \frac{64}{804} = 0{,}0796
          $$
          $$
          h_f = 0{,}0796\cdot\frac{100}{0{,}1}\cdot\frac{1{,}53^{2}}{2\cdot 9{,}8}
          = 9{,}5\ \text{m de columna de glicerina}
          $$

      - tipo: calcular
        titulo: La potencia perdida
        pregunta: |
          ¿Qué potencia se consume en esas pérdidas?
        respuesta:
          tipo: magnitud
          valor: '1.73 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1.117 kW'
            mensaje: |
              Has usado $\gamma = 9800$, el del agua. La glicerina tiene
              $s = 1{,}547$, así que su peso específico es
              $1{,}547\cdot 9800 = 15\,161\ \text{N/m}^{3}$. Un 35 % de
              diferencia, y el número equivocado parece igual de razonable.
          - valor: '176.4 W'
            mensaje: |
              Te has dejado la gravedad, o has usado la densidad
              ($\text{kg/m}^{3}$) donde va el peso específico
              ($\text{N/m}^{3}$). La fórmula es
              $\text{Pot} = \gamma\,Q\,h_f$, y $\gamma = \rho g$.
        pista: |
          $\text{Pot} = \gamma\,Q\,h_f$, con $\gamma$ el del fluido que
          circula.
        desarrollo: |
          $$
          \gamma = 1{,}547\cdot 9800 = 15\,161\ \text{N/m}^{3}
          $$
          $$
          \text{Pot} = 15\,161\cdot 0{,}012\cdot 9{,}5 = 1729\ \text{W}
          = 1{,}73\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $v = 1{,}53$ m/s y la viscosidad de la glicerina, el Reynolds
              es 804: régimen laminar.
          - texto: >-
              En laminar $f = 64/Re$ y la rugosidad del cobre que da el
              enunciado no interviene en ningún momento.
          - texto: >-
              Darcy-Weisbach da $h_f = 9{,}5$ metros de columna de glicerina, y
              la potencia es $\gamma Q h_f$ con el peso específico del propio
              fluido.
          - texto: >-
              Como la tubería es horizontal, la pérdida de carga se traduce
              íntegramente en un descenso de la velocidad entre la entrada y la
              salida.
            trampa: true
            mensaje: |
              La velocidad **no cambia**: el diámetro es constante, así que por
              continuidad $v_1 = v_2$. Lo que cae en un tubo horizontal es la
              **presión**, y su caída es exactamente $\gamma h_f$. Que la
              tubería sea horizontal es justo lo que hace que toda la pérdida
              se lea en el manómetro.

    resolucion: |
      **El orden que ahorra trabajo.** Primero la velocidad, después el
      Reynolds, y solo si sale turbulento se va al ábaco.

      $$
      v = \frac{Q}{A} = \frac{0{,}012}{\pi\,0{,}1^{2}/4} = 1{,}53\ \text{m/s}
      \qquad
      Re = \frac{1{,}53\cdot 0{,}1}{1{,}9\cdot 10^{-4}} = 804
      $$

      **Laminar**, así que $f = 64/Re = 0{,}0796$ y el dato de la rugosidad del
      cobre sobra. Es un ejercicio con un dato que no se usa, y eso es
      deliberado del enunciado.

      **La pérdida.**

      $$
      h_f = f\,\frac{L}{D}\,\frac{v^{2}}{2g}
      = 0{,}0796\cdot 1000\cdot\frac{1{,}53^{2}}{19{,}6}
      = 9{,}5\ \text{mc glicerina}
      $$

      **La potencia**, que es lo que pide el enunciado:

      $$
      \text{Pot} = \gamma\,Q\,h_f = (1{,}547\cdot 9800)\cdot 0{,}012\cdot 9{,}5
      = 1{,}73\ \text{kW}
      $$

      **Dónde está la trampa de unidades.** $h_f$ son metros de columna **de
      glicerina**, no de agua, y por eso al pasar a potencia hay que usar el
      peso específico de la glicerina. Con el del agua saldrían 1,12 kW: un
      error del 35 % que no chirría por ningún lado.

  # ── COLECCIÓN 6.2. Tipo II con hf constante: el atajo del Re·√f, que es la
  #    entrada de arriba del ábaco y evita iterar. Es el ejercicio que enseña
  #    el truco del capítulo.
  - id: ejflu18-el-petroleo-y-la-entrada-de-arriba-del-abaco
    titulo: Petróleo entre dos depósitos, y cómo entrar al ábaco sin la velocidad
    fuente: >-
      Ejercicio 6.2 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Mediante una tubería de $150\ \text{m}$ de longitud y $200\ \text{mm}$ de
      diámetro de fundición, se transporta petróleo crudo a $20\ °\text{C}$
      ($s = 0{,}86$), desde el depósito de almacenamiento A hasta el de
      servicio B, presurizado. Se quiere conocer el caudal circulante.
      Despreciar las pérdidas menores.

      Datos: $z_A = 80\ \text{m}$, $z_B = 30\ \text{m}$,
      $p_A = p_{\text{atm}}$, $p_B = 2\ \text{bar}$,
      $\nu = 8{,}4\cdot 10^{-6}\ \text{m}^{2}/\text{s}$,
      $\varepsilon_{\text{fundición}} = 0{,}026\ \text{cm}$.
    pide: El caudal que circula por la tubería.

    pasos:
      - tipo: reconocer
        pregunta: |
          Faltan la velocidad y el caudal, así que no se puede calcular el
          Reynolds. ¿Qué se hace?
        opciones:
          - texto: >-
              Como $h_f$ sale de Bernoulli y es un número, se calcula
              $Re\sqrt f$, que no depende de la velocidad, y se entra al ábaco
              por la escala de arriba
            correcta: true
            mensaje: |
              Ese es el truco del capítulo. La velocidad se cancela al
              multiplicar $\sqrt f = \frac{1}{v}\sqrt{h_f D 2g/L}$ por
              $Re = vD/\nu$, y lo que queda es dato puro. **Sin iterar.**
          - texto: >-
              Se supone $f = 0{,}03$ y se itera hasta que converja
            mensaje: |
              Funciona, y es lo que hay que hacer cuando $h_f$ depende de la
              velocidad. Pero aquí $h_f$ es una constante que sale de
              Bernoulli, y entonces hay un camino directo que evita las
              iteraciones enteras.
          - texto: >-
              Se supone régimen turbulento y tubería rugosa, con lo que $f$
              solo depende de $\varepsilon/D$
            mensaje: |
              Suponer el comportamiento es justo lo que no se puede hacer sin
              comprobarlo: aquí la tubería sale **semirrugosa**, y con la
              fórmula de rugosa el $f$ saldría distinto y el caudal, mal.

      - tipo: calcular
        titulo: La pérdida de carga disponible
        pregunta: |
          ¿Cuánto vale $h_f$?
        respuesta:
          tipo: magnitud
          valor: '26.27 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '30.1 m'
            mensaje: |
              Has convertido los 2 bar con el peso específico del agua. El
              fluido es petróleo, $s = 0{,}86$:
              $p_B/\gamma = 2\cdot 10^{5}/(0{,}86\cdot 9800) = 23{,}73$ m de
              columna de petróleo, no 20,4.
          - valor: '50 m'
            mensaje: |
              Te has dejado la presión del depósito B. La diferencia de cotas
              es 50 m, pero B está presurizado a 2 bar y esa altura hay que
              vencerla también: se resta.
        pista: |
          Bernoulli entre las dos superficies libres: las dos velocidades son
          nulas, $p_A = 0$ manométrica.
        desarrollo: |
          $$
          \frac{p_A}{\gamma} + z_A - h_f = \frac{p_B}{\gamma} + z_B
          $$
          $$
          \frac{p_B}{\gamma} = \frac{2\cdot 10^{5}}{0{,}86\cdot 9800}
          = 23{,}73\ \text{mc petróleo}
          $$
          $$
          h_f = 80 - 23{,}73 - 30 = 26{,}27\ \text{m}
          $$

      - tipo: calcular
        titulo: La entrada de arriba del ábaco
        pregunta: |
          ¿Cuánto vale el producto $Re\sqrt f$?
        respuesta:
          tipo: numero
          valor: '19728'
          tolerancia: 200
          formato: un número sin unidades
        distractores:
          - valor: '0.8286'
            mensaje: |
              Eso es $\sqrt f \cdot v$, que es solo la mitad de la cuenta.
              Falta multiplicarlo por $Re/v = D/\nu$, que es lo que cancela la
              velocidad y deja un número.
          - valor: '23810'
            mensaje: |
              Eso es $D/\nu$, el otro factor solo. El producto de los dos es lo
              que se busca: $0{,}8286 \cdot 23.810$.
        pista: |
          Despeja $\sqrt f$ de Darcy-Weisbach dejando la $v$ fuera, y
          multiplica por $Re = vD/\nu$.
        desarrollo: |
          $$
          \sqrt f = \frac{1}{v}\sqrt{\frac{h_f\,D\,2g}{L}}
          = \frac{1}{v}\sqrt{\frac{26{,}27\cdot 0{,}2\cdot 19{,}6}{150}}
          = \frac{0{,}8286}{v}
          $$
          $$
          Re = \frac{v\,D}{\nu} = \frac{0{,}2\,v}{8{,}4\cdot 10^{-6}} = 23\,810\,v
          $$
          $$
          Re\sqrt f = 0{,}8286\cdot 23\,810 = 1{,}97\cdot 10^{4}
          $$

          La velocidad se ha ido, que es de lo que se trataba.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Con $\varepsilon/D = 0{,}0013$ y ese valor, el ábaco —o
          Colebrook-White— da $f = 0{,}0227$. ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '173 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '17.3 l/s'
            mensaje: |
              Un factor diez. Comprueba el área: $\pi\cdot 0{,}2^{2}/4 =
              0{,}0314\ \text{m}^{2}$, y $5{,}5\cdot 0{,}0314 = 0{,}173\
              \text{m}^{3}/\text{s}$, que son 173 l/s.
          - valor: '392 l/s'
            mensaje: |
              Has usado el área con el **radio** en vez del diámetro, o has
              olvidado la raíz de $f$. Con $v = 0{,}8286/\sqrt{0{,}0227}$ salen
              5,5 m/s, no 12,5.
        pista: |
          De $\sqrt f = 0{,}8286/v$ sale la velocidad; después $Q = vA$.
        desarrollo: |
          $$
          v = \frac{0{,}8286}{\sqrt{0{,}0227}} = \frac{0{,}8286}{0{,}1507}
          = 5{,}50\ \text{m/s}
          $$
          $$
          Q = v\,A = 5{,}50\cdot\frac{\pi\cdot 0{,}2^{2}}{4}
          = 0{,}173\ \text{m}^{3}/\text{s} = 173\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre las dos superficies libres da la pérdida de carga
              disponible, $h_f = 26{,}27$ m de columna de petróleo.
          - texto: >-
              Como $h_f$ es constante, el producto $Re\sqrt f$ se calcula sin
              conocer la velocidad y sirve de entrada por la escala superior
              del ábaco.
          - texto: >-
              Cortando con la curva $\varepsilon/D = 0{,}0013$ se lee
              $f = 0{,}0227$, y de ahí $v = 5{,}5$ m/s y $Q = 173$ l/s.
          - texto: >-
              Al haber entrado por la escala de arriba, el resultado es
              aproximado y conviene comprobarlo iterando desde $f = 0{,}03$.
            trampa: true
            mensaje: |
              La entrada por $Re\sqrt f$ no es una aproximación: es una
              identidad exacta, y da el mismo punto del ábaco que cualquier
              otro camino. Lo único aproximado es leer una curva a ojo, y eso
              pasa igual entrando por abajo.

    resolucion: |
      **Qué tipo de problema es.** Se conocen $L$, $D$, $\varepsilon$ y $\nu$, y
      se pide el caudal: es un **tipo II**.

      **La pérdida disponible.** Bernoulli entre las superficies libres, con
      velocidades nulas y $p_A$ atmosférica:

      $$
      \frac{p_B}{\gamma} = \frac{2\cdot 10^{5}}{0{,}86\cdot 9800}
      = 23{,}73\ \text{mc petróleo}
      $$
      $$
      h_f = 80 - 23{,}73 - 30 = 26{,}27\ \text{m}
      $$

      **El atajo.** Como $h_f$ es un número y no depende de $v$, se puede
      calcular el producto $Re\sqrt f$ sin conocer la velocidad:

      $$
      Re\sqrt f = \frac{D}{\nu}\sqrt{\frac{h_f\,D\,2g}{L}}
      = 23\,810\cdot 0{,}8286 = 1{,}97\cdot 10^{4}
      $$

      **La lectura.** Con $\varepsilon/D = 0{,}026/20 = 0{,}0013$, el ábaco da
      una tubería **semirrugosa** con $f \approx 0{,}0225$; Colebrook-White da
      el valor exacto, $f = 0{,}0227$.

      **El resultado.**

      $$
      v = \frac{0{,}8286}{\sqrt{0{,}0227}} = 5{,}50\ \text{m/s}
      \qquad
      Q = 173\ \text{l/s}
      $$

      **Una nota sobre la solución oficial.** El boletín escribe en este punto
      $h_f = 26{,}76$ m, pero después usa $0{,}8286$, que es el valor que sale
      con $26{,}27$ —y $26{,}27$ es lo que dan sus propios datos—. Es una
      errata en un paso intermedio: el resultado final del boletín es correcto.

  # ── COLECCIÓN 6.9. Laminar puro y en dos líneas, con el resultado en
  #    presión por metro. Sirve de contraste con todo lo demás del capítulo.
  - id: ejflu18-col69-el-capilar-de-mercurio
    titulo: Un capilar de mercurio, y la pérdida por metro en régimen laminar
    fuente: >-
      Ejercicio 6.9 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene un tubo de $1\ \text{mm}$ de diámetro por el que fluye mercurio
      a $20\ °\text{C}$, siendo el número de Reynolds de $1600$. Se pide:

      a) Pérdida de energía piezométrica por metro de conducto.

      (Del ábaco de viscosidades, $\nu_{Hg} = 1{,}2\cdot 10^{-7}\
      \text{m}^{2}/\text{s}$; $s_{Hg} = 13{,}6$.)
    pide: La pérdida de presión por metro de tubo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es el Reynolds, no la velocidad. ¿Qué se puede decir de
          entrada?
        opciones:
          - texto: >-
              Que el flujo es laminar —1600 está por debajo de 2000— y por
              tanto $f = 64/Re$, sin mirar la rugosidad
            correcta: true
            mensaje: |
              Eso es, y ahorra el ábaco entero. En laminar la rugosidad no
              interviene: el tubo puede ser de vidrio o de fundición oxidada y
              la pérdida es la misma.
          - texto: >-
              Que hay que entrar en el ábaco de Moody con $Re = 1600$
            mensaje: |
              Se puede, pero es innecesario: en la zona laminar el ábaco es la
              recta $f = 64/Re$ y esa fórmula es exacta. El ábaco solo hace
              falta en turbulento.
          - texto: >-
              Que falta la rugosidad del tubo para poder seguir
            mensaje: |
              No hace falta. Por debajo de $Re = 2000$ el coeficiente de
              frotamiento depende **solo** del Reynolds, y esa es una de las
              conclusiones de Nikuradse.

      - tipo: calcular
        titulo: La pérdida por metro
        pregunta: |
          ¿Cuánta presión se pierde por metro de tubo, en kPa/m?
        respuesta:
          tipo: magnitud
          valor: '10.03 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.7375 kpa'
            mensaje: |
              Has usado el peso específico del agua para pasar de metros de
              columna a presión. El fluido es mercurio: $\gamma = 13{,}6\cdot
              9800 = 133\,280\ \text{N/m}^{3}$.
          - valor: '0.01003 kpa'
            mensaje: |
              Te has dejado el $1/D$ de Darcy-Weisbach. Con $D = 1\ \text{mm}$
              ese factor vale **mil**, y es lo que hace enorme la pérdida en un
              capilar.
        pista: |
          $v = Re\,\nu/D$, después $f = 64/Re$ y Darcy-Weisbach con $L = 1$ m.
          Al final, de metros de columna de mercurio a pascales.
        desarrollo: |
          $$
          v = \frac{Re\,\nu}{D} = \frac{1600\cdot 1{,}2\cdot 10^{-7}}{0{,}001}
          = 0{,}192\ \text{m/s}
          \qquad
          f = \frac{64}{1600} = 0{,}04
          $$
          $$
          \frac{h_f}{L} = f\,\frac{1}{D}\,\frac{v^{2}}{2g}
          = 0{,}04\cdot 1000\cdot\frac{0{,}192^{2}}{19{,}6}
          = 0{,}0752\ \frac{\text{m de Hg}}{\text{m}}
          $$
          $$
          \frac{\Delta p}{L} = 13{,}6\cdot 9800\cdot 0{,}0752
          = 10\,030\ \frac{\text{Pa}}{\text{m}} = 10{,}0\ \frac{\text{kPa}}{\text{m}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $Re = 1600$ el flujo es laminar, así que $f = 64/Re = 0{,}04$
              y la rugosidad no interviene.
          - texto: >-
              La velocidad sale del propio Reynolds, $v = Re\,\nu/D =
              0{,}192$ m/s.
          - texto: >-
              Darcy-Weisbach con $L = 1$ m da $0{,}075$ m de columna de
              mercurio, que son 10 kPa por metro de tubo.
          - texto: >-
              Diez kilopascales por metro es poco: apenas una décima de
              atmósfera.
            trampa: true
            mensaje: |
              Es **muchísimo**: una atmósfera cada diez metros de tubo, y eso
              con el mercurio moviéndose a diecinueve centímetros por segundo.
              La razón es el $1/D$ de Darcy-Weisbach: con un milímetro de
              diámetro ese factor vale mil.

    resolucion: |
      **Todo el ejercicio cabe en tres líneas** porque el régimen es laminar y
      ahí no hay ábaco que consultar:

      $$
      v = \frac{Re\,\nu}{D} = 0{,}192\ \text{m/s}
      \qquad
      f = \frac{64}{Re} = 0{,}04
      $$
      $$
      \frac{h_f}{L} = f\frac{1}{D}\frac{v^{2}}{2g} = 0{,}0752\ \text{m de Hg/m}
      \;\Longrightarrow\;
      \frac{\Delta p}{L} = 10{,}0\ \text{kPa/m}
      $$

      **Y hay una forma cerrada que conviene conocer.** Sustituyendo
      $f = 64/Re$ y $v = Re\,\nu/D$ en Darcy-Weisbach, todo se simplifica:

      $$
      \frac{h_f}{L} = \frac{32\,\nu^{2}\,Re}{g\,D^{3}}
      $$

      Con el diámetro **al cubo** en el denominador. Eso es lo que hace que un
      capilar pierda tanto: reducir el diámetro a la mitad, manteniendo el
      Reynolds, multiplica la pérdida por ocho.

      **Diez kilopascales por metro** significa una atmósfera cada diez metros
      de tubo, y el mercurio va a menos de veinte centímetros por segundo. Es
      el mundo opuesto al de una conducción industrial, y por eso los
      viscosímetros capilares funcionan: la pérdida es tan grande y tan
      predecible que medirla da la viscosidad con precisión.

  # ── COLECCIÓN 6.15. Tipo II con el atajo del Re·√f, igual que el 6.2 pero
  #    con cota: sirve para ver que el método no cambia.
  - id: ejflu18-col615-el-fueloil-entre-a-y-b
    titulo: Fuel-oil entre dos puntos con presión y cota conocidas
    fuente: >-
      Ejercicio 6.15 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Los puntos $A$ y $B$ de una conducción están unidos por una tubería de
      acero comercial de $15\ \text{cm}$ de diámetro interior y
      $1200\ \text{m}$ de longitud. El punto $B$ está situado $15\ \text{m}$
      por encima de $A$ y las presiones en $A$ y $B$ son respectivamente
      $8{,}6$ y $3{,}4\ \text{kg/cm}^{2}$. Se pide:

      a) Caudal de fuel-oil a $21\ °\text{C}$ que circulará entre $A$ y $B$.

      Datos: viscosidad $= 3{,}83\cdot 10^{-6}\ \text{m}^{2}/\text{s}$;
      densidad relativa $s = 0{,}854$.
    pide: El caudal de fuel-oil que circula.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de problema es y qué permite resolverlo sin iterar?
        opciones:
          - texto: >-
              Tipo II con $h_f$ constante: se puede calcular $Re\sqrt f$ sin
              conocer la velocidad y entrar al ábaco por la escala de arriba
            correcta: true
            mensaje: |
              Exacto. La pérdida sale entera de las presiones y las cotas, así
              que es un número; y con un número, la velocidad se cancela en el
              producto $Re\sqrt f$.
          - texto: >-
              Tipo I: se conocen el caudal y la geometría
            mensaje: |
              El caudal es justamente la incógnita. Lo que se conoce es la
              pérdida de carga, y eso es el tipo II.
          - texto: >-
              Tipo III, porque hay que iterar para encontrar el diámetro
            mensaje: |
              El diámetro es un dato, 15 cm. El tipo III es cuando hay que
              dimensionar la tubería, y ese sí obliga a iterar siempre.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          ¿Cuánta carga se pierde entre $A$ y $B$?
        respuesta:
          tipo: magnitud
          valor: '45.89 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '60.89 m'
            mensaje: |
              Te has dejado la cota. $B$ está $15\ \text{m}$ más alto, y esos
              quince metros los paga el fluido con presión: no son pérdida por
              rozamiento.
          - valor: '38.06 m'
            mensaje: |
              Has usado el peso específico del agua. El fuel-oil tiene
              $s = 0{,}854$, así que la misma diferencia de presión equivale a
              más metros de su columna.
        pista: |
          $h_f = (p_A - p_B)/\gamma - \Delta z$, con $\gamma$ del fuel-oil.
        desarrollo: |
          $$
          \frac{p_A-p_B}{\gamma} = \frac{5{,}2\cdot 98\,000}{0{,}854\cdot 9800}
          = 60{,}89\ \text{mcl}
          $$
          $$
          h_f = 60{,}89 - 15 = 45{,}89\ \text{mcl}
          $$

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '41.77 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '48.63 l/s'
            mensaje: |
              Has usado los $60{,}89\ \text{m}$ como pérdida, sin descontar la
              cota. Con más carga disponible sale más caudal, pero esos quince
              metros se los lleva la altura, no el rozamiento.
          - valor: '37.75 l/s'
            mensaje: |
              Has convertido la diferencia de presiones con el peso específico
              del agua en vez del del fuel-oil, así que la pérdida te ha salido
              corta: $38{,}06$ en vez de $45{,}89$ metros de columna.
        pista: |
          $Re\sqrt f = \dfrac{D}{\nu}\sqrt{\dfrac{h_f\,D\,2g}{L}}$, y con
          $\varepsilon/D$ se lee $f$.
        desarrollo: |
          $$
          \sqrt f\,V = \sqrt{\frac{45{,}89\cdot 0{,}15\cdot 19{,}6}{1200}}
          = 0{,}3353
          \qquad
          Re\sqrt f = 0{,}3353\cdot\frac{0{,}15}{3{,}83\cdot 10^{-6}} = 13\,132
          $$
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006}{15} = 4\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0201
          $$
          $$
          V = \frac{0{,}3353}{\sqrt{0{,}0201}} = 2{,}36\ \text{m/s}
          \qquad
          Q = 41{,}8\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              De las presiones y la cota sale la pérdida de carga: 45,89 metros
              de columna de fuel-oil.
          - texto: >-
              Como es un número, se puede formar $Re\sqrt f = 13.132$ sin
              conocer la velocidad, y entrar al ábaco por arriba.
          - texto: >-
              Con $\varepsilon/D = 4\cdot 10^{-4}$ sale $f = 0{,}0201$ y de
              ahí $V = 2{,}36$ m/s, es decir 41,8 l/s.
          - texto: >-
              Como el punto $B$ está más alto y a menos presión, el fluido
              podría estar circulando en cualquiera de los dos sentidos.
            trampa: true
            mensaje: |
              El Bernoulli de $A$ es $60{,}89$ y el de $B$, $15$: la energía
              total es mayor en $A$, así que el flujo va de $A$ a $B$ y no hay
              ambigüedad. Es la misma comprobación del ejercicio 3.10, y aquí
              además la pérdida sale positiva, que es la señal de que el
              sentido supuesto es el bueno.

    resolucion: |
      **La pérdida de carga sale de restar los dos Bernoullis**, y el término
      de cota hay que descontarlo porque no es rozamiento:

      $$
      h_f = \frac{p_A-p_B}{\gamma} - \Delta z = 60{,}89 - 15 = 45{,}89\ \text{mcl}
      $$

      **Con la pérdida conocida, el atajo del tipo II**:

      $$
      Re\sqrt f = \frac{D}{\nu}\sqrt{\frac{h_f D\,2g}{L}} = 13\,132
      \qquad
      \frac{\varepsilon}{D} = 4\cdot 10^{-4}
      \;\Longrightarrow\;
      f = 0{,}0201
      $$
      $$
      Q = 41{,}8\ \text{l/s}
      $$

      **Es el mismo método del ejercicio 6.2**, con una diferencia que conviene
      notar: allí los dos extremos eran superficies libres y la pérdida salía
      de cotas y presiones de depósito; aquí son dos puntos de la propia
      tubería y salen de dos manómetros. **El método no cambia** — lo único que
      hace falta es que $h_f$ resulte ser un número y no una función de la
      velocidad.

      Y la señal de que el planteamiento es coherente: $h_f$ sale **positiva**.
      Si hubiera salido negativa, el flujo iría al revés y habría que rehacer
      el planteamiento cambiando el signo de la cota.

  # ── COLECCIÓN 6.6. El mejor del capítulo: los tres tipos de problema de
  #    Moody en un solo enunciado, y un apartado b) cuyo resultado es
  #    deliberadamente absurdo para que el c) tenga sentido.
  - id: ejflu18-col66-la-tuberia-incrustada
    titulo: Una conducción que se ha ido incrustando, y los tres tipos a la vez
    fuente: >-
      Ejercicio 6.6 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una conducción de acero comercial para traída de agua a una fábrica ha
      funcionado holgadamente desde su establecimiento por simple gravedad,
      hasta un determinado momento en que no es capaz de suministrar el caudal
      inicial debido a una incrustación calcárea uniforme a lo largo de toda la
      conducción. Teniendo en cuenta los datos abajo reseñados, se pide:

      a) Caudal inicial en el instante de la implantación.

      b) Rugosidad de la tubería suponiendo que el diámetro interior
      ($800\ \text{mm}$) no varía, y que conduce $500\ \text{l/s}$ solamente.

      c) Esta rugosidad calculada se valora como excesiva, por lo que cabría
      suponer que el diámetro se ha reducido considerablemente por las
      incrustaciones calcáreas. Suponiendo una rugosidad de la tubería
      comercial con las incrustaciones de $\varepsilon = 0{,}5\ \text{cm}$,
      calcular el diámetro útil (mm) de la tubería para el transporte del
      caudal de $500\ \text{l/s}$.

      Datos: agua a $10\ °\text{C}$ ($\nu = 1{,}2\cdot 10^{-6}\
      \text{m}^{2}/\text{s}$); diferencia de cotas piezométricas en los
      extremos de la conducción $= 10\ \text{m}$; diámetro inicial de la
      tubería de acero comercial $D = 800\ \text{mm}$; longitud equivalente
      total $= 1000\ \text{m}$.

      Nota: utilizar en la resolución el ábaco de Moody o las expresiones que
      lo definen.
    pide: El caudal inicial, la rugosidad aparente y el diámetro útil real.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres apartados son de los tres tipos de problema del tema. ¿Cuál
          es cada uno?
        opciones:
          - texto: >-
              a) es tipo II —se busca el caudal—, b) despeja $f$ de
              Darcy-Weisbach y c) es tipo III, con el diámetro como incógnita
            correcta: true
            mensaje: |
              Exacto, y por eso este problema vale por tres. El a) se resuelve
              con el atajo del $Re\sqrt f$, el b) es directo porque se conoce
              el caudal, y el c) obliga a iterar porque sin diámetro no hay
              ninguna entrada al ábaco.
          - texto: >-
              Los tres son de tipo I, porque en todos se conoce la pérdida de
              carga
            mensaje: |
              El tipo I es el que **da** el caudal y pide la pérdida. Aquí la
              pérdida es siempre el dato —los 10 m de diferencia
              piezométrica— y lo que se busca es el caudal, la rugosidad o el
              diámetro.
          - texto: >-
              Los tres son de tipo III, porque la tubería va cambiando
            mensaje: |
              Solo el c) busca un diámetro. En los otros dos el diámetro es un
              dato —los 800 mm— y lo que se busca es el caudal o el
              coeficiente.

      - tipo: calcular
        titulo: El caudal inicial
        pregunta: |
          ¿Qué caudal circulaba cuando la tubería era nueva?
        respuesta:
          tipo: magnitud
          valor: '1802 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1999 l/s'
            mensaje: |
              Has tomado la tubería como **lisa**, ignorando el término de la
              rugosidad en Colebrook-White: así sale $f = 0{,}0099$. Pero
              $Re\sqrt f = 264.000$ con $\varepsilon/D = 7{,}5\cdot 10^{-5}$
              cae en la franja semirrugosa, y ahí los dos términos cuentan:
              $f = 0{,}0122$.
          - valor: '1259 l/s'
            mensaje: |
              Te has dejado el **2** de $2g$: con $\sqrt f\,V =
              \sqrt{h_f D\,g/L} = 0{,}28$ en vez de $0{,}396$ todo baja en un
              factor $\sqrt 2$. La altura cinética lleva $2g$ en el
              denominador, y Darcy-Weisbach la hereda.
        pista: |
          Tipo II con $h_f = 10$ m constante: forma $Re\sqrt f$ y entra al
          ábaco por arriba. $\varepsilon = 0{,}006\ \text{cm}$ para el acero
          comercial.
        desarrollo: |
          $$
          \sqrt f\,V = \sqrt{\frac{10\cdot 0{,}8\cdot 19{,}6}{1000}} = 0{,}396
          \qquad
          Re\sqrt f = 0{,}396\cdot\frac{0{,}8}{1{,}2\cdot 10^{-6}} = 264\,000
          $$
          $$
          \frac{\varepsilon}{D} = \frac{0{,}006}{80} = 7{,}5\cdot 10^{-5}
          \;\Longrightarrow\;
          f = 0{,}0122
          $$
          $$
          V = \frac{0{,}396}{\sqrt{0{,}0122}} = 3{,}585\ \text{m/s}
          \qquad
          Q = 1802\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La rugosidad que haría falta
        pregunta: |
          Si el diámetro no hubiera cambiado, ¿qué rugosidad explicaría que
          solo pasen $500\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '164.6 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.06 mm'
            mensaje: |
              Esa es la rugosidad de la tubería **nueva** —$0{,}006\ \text{cm}
              = 0{,}06\ \text{mm}$, la del cuadro n.º 20—. Es el dato de
              partida del apartado a), no la respuesta: lo que se busca aquí
              es la que haría falta **ahora** para explicar que solo pasen
              500 l/s, y sale casi tres mil veces mayor.
          - valor: '0.1646 mm'
            mensaje: |
              El número está bien y la unidad no. Has despejado
              $\varepsilon = 0{,}206\cdot 0{,}8\ \text{m} = 0{,}1646\
              \text{m}$ y has escrito «mm» sin convertir. Son
              $164{,}6\ \text{mm}$: mil veces más.
        pista: |
          Con el caudal conocido, despeja $f$ de Darcy-Weisbach; después usa
          Karman-Prandtl para tubería rugosa, donde $f$ solo depende de
          $\varepsilon/D$.
        desarrollo: |
          $$
          V = \frac{0{,}5}{\pi\,0{,}8^{2}/4} = 0{,}995\ \text{m/s}
          \qquad
          10 = f\,\frac{1000}{0{,}8}\,\frac{0{,}995^{2}}{19{,}6}
          \;\Longrightarrow\;
          f = 0{,}1585
          $$

          Un $f$ así de alto solo puede ser de tubería **rugosa**, donde

          $$
          \frac{1}{\sqrt f} = 2\log\frac{3{,}71}{\varepsilon/D}
          \;\Longrightarrow\;
          \frac{\varepsilon}{D} = 0{,}206
          \;\Longrightarrow\;
          \varepsilon = 0{,}206\cdot 800 = 165\ \text{mm}
          $$

      - tipo: calcular
        titulo: El diámetro útil que queda
        pregunta: |
          Con $\varepsilon = 0{,}5\ \text{cm}$, ¿qué diámetro útil le queda a
          la tubería?
        respuesta:
          tipo: magnitud
          valor: '594 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '800 mm'
            mensaje: |
              Ese es el diámetro original. La pregunta es cuánto ha quedado
              libre después de las incrustaciones, y la respuesta es unos
              veinte centímetros menos.
          - valor: '573.5 mm'
            mensaje: |
              Te has parado en la primera vuelta. $D = 1{,}156\cdot
              0{,}03^{1/5} = 0{,}5735$ sale del $f = 0{,}03$ **supuesto**, y
              con ese diámetro el ábaco devuelve $0{,}0362$, no $0{,}03$: la
              iteración no ha cerrado. Hay que volver a entrar con el $f$
              obtenido hasta que coincida con el supuesto.
        pista: |
          Sin diámetro no hay ninguna entrada al ábaco: supón $f$, despeja
          $D = 1{,}156\,f^{1/5}$ de Darcy-Weisbach, calcula $Re$ y
          $\varepsilon/D$, y repite.
        desarrollo: |
          Con $Q = 0{,}5$ y $h_f = 10$:

          $$
          10 = f\,\frac{1000}{D}\,\frac{(0{,}6366/D^{2})^{2}}{19{,}6}
          = \frac{20{,}68\,f}{D^{5}}
          \;\Longrightarrow\;
          D = 1{,}156\,f^{1/5}
          $$

          | $f$ supuesto | $D$ (m) | $V$ (m/s) | $Re$ | $\varepsilon/D$ | $f$ obtenido |
          |---|---|---|---|---|---|
          | 0,030 | 0,573 | 1,936 | $9{,}2\cdot 10^{5}$ | 0,0087 | 0,0362 |
          | 0,0362 | 0,595 | 1,796 | $8{,}9\cdot 10^{5}$ | 0,0084 | 0,0358 |
          | 0,0358 | 0,594 | 1,805 | $8{,}9\cdot 10^{5}$ | 0,0084 | 0,0358 |

          $$
          D = 594\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Nueva, la conducción llevaba 1802 l/s por gravedad con los mismos
              10 m de carga.
          - texto: >-
              Si el diámetro no hubiera cambiado, explicar los 500 l/s exigiría
              una rugosidad de 165 mm, que es absurda: sería una quinta parte
              del diámetro.
          - texto: >-
              Por eso el apartado c) cambia de hipótesis: con una rugosidad
              creíble de 5 mm, lo que ha pasado es que el diámetro útil ha
              bajado a 594 mm.
          - texto: >-
              Las dos hipótesis son igual de válidas, y la del apartado b) es
              más sencilla porque no obliga a iterar.
            trampa: true
            mensaje: |
              La del b) no es válida: **165 mm de rugosidad no existen**.
              Significaría rugosidades de dieciséis centímetros dentro de una
              tubería de ochenta, y la propia hipótesis de perfil de velocidades
              dejaría de tener sentido. El apartado b) está en el enunciado
              precisamente para que se vea que es absurda, y el c) para dar la
              explicación buena.

    resolucion: |
      **Este ejercicio vale por tres**, porque sus apartados son los tres tipos
      de problema del tema.

      **a) Tipo II.** La carga es un dato, así que $Re\sqrt f$ se calcula sin
      la velocidad:

      $$
      Re\sqrt f = 264\,000
      \quad
      \frac{\varepsilon}{D} = 7{,}5\cdot 10^{-5}
      \;\Longrightarrow\;
      f = 0{,}0122
      \;\Longrightarrow\;
      Q = 1802\ \text{l/s}
      $$

      **b) Directo.** Con el caudal conocido, $f$ se despeja de
      Darcy-Weisbach y sale $0{,}1585$ — un valor altísimo, que solo puede
      corresponder a tubería rugosa. Invirtiendo Karman-Prandtl:

      $$
      \frac{\varepsilon}{D} = 0{,}206
      \;\Longrightarrow\;
      \varepsilon = 165\ \text{mm}
      $$

      **c) Tipo III.** Sin diámetro no hay ninguna entrada al ábaco, así que se
      itera: $D = 1{,}156\,f^{1/5}$, y en tres vueltas converge a

      $$
      D = 594\ \text{mm}
      $$

      **Por qué el enunciado hace la pregunta absurda del b).** Ciento sesenta
      y cinco milímetros de rugosidad en una tubería de ochocientos significan
      irregularidades de dieciséis centímetros: no es una tubería incrustada,
      es una cueva. El apartado está ahí para que el resultado **se vea
      imposible**, y con él caiga la hipótesis de que el diámetro no ha
      cambiado.

      La explicación buena es la del c): con una rugosidad creíble para la caliza
      —$5\ \text{mm}$— lo que ha pasado es que **la sección se ha estrechado un
      26 %**, de 800 a 594 mm. Y con eso el caudal cae de 1802 a 500 l/s: una
      reducción del diámetro de la cuarta parte se lleva **las tres cuartas
      partes del caudal**, porque en Darcy-Weisbach el diámetro entra a la
      quinta.

      **Es un ejercicio de método más que de números**: enseña que cuando un
      resultado sale absurdo, lo que hay que revisar no es la cuenta sino la
      hipótesis.

  # ── COLECCIÓN 6.10. El único del capítulo donde la trampa no está en el
  #    ábaco sino en una conversión: «8 kg/cm² de altura útil» son 80 metros
  #    de columna de AGUA, y el fluido es un aceite. Quien no divida entre
  #    0,85 se deja un 18 % de la distancia.
  - id: ejflu18-col610-las-estaciones-de-bombeo-del-aceite
    titulo: Cada cuánto hay que volver a bombear el aceite
    fuente: >-
      Ejercicio 6.10 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se bombean por una tubería de $0{,}5\ \text{m}$ de diámetro interior de
      acero roblonado con $\varepsilon = 0{,}5\ \text{cm}$,
      $100\ \text{l/s}$ de un aceite de viscosidad $0{,}1$ Poises y peso
      específico relativo $0{,}85$. Si las bombas utilizadas generan una
      altura útil equivalente a $8\ \text{kg/cm}^{2}$, se pide:

      a) Distancia a que deberían situarse dos estaciones de bombeo
      consecutivas.
    pide: La separación entre dos estaciones de bombeo consecutivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba da «una altura útil equivalente a $8\ \text{kg/cm}^{2}$», y
          el fluido es un aceite de densidad relativa $0{,}85$. ¿Cuántos
          metros de columna **de aceite** son?
        opciones:
          - texto: >-
              Más de 80: la equivalencia $1\ \text{kg/cm}^{2} = 10\ \text{m}$
              es de columna de agua, y una columna de aceite tiene que ser
              más alta para dar la misma presión
            correcta: true
            mensaje: |
              Eso es. La presión es $p = \gamma h$, así que para la misma $p$
              un fluido más ligero necesita más altura:
              $h = p/\gamma_{\text{aceite}} = 80/0{,}85 = 94{,}1$ m.
          - texto: >-
              Exactamente 80, porque $1\ \text{kg/cm}^{2}$ son 10 metros de
              columna y da igual el fluido
            mensaje: |
              Los 10 metros son **de agua**. Es la conversión más repetida del
              curso y por eso se aplica sin pensar; pero aquí el peso
              específico es $0{,}85\cdot 9800$, y la altura sale mayor, no
              igual.
          - texto: >-
              Menos de 80, porque el aceite pesa menos y la bomba tiene que
              esforzarse menos
            mensaje: |
              La bomba se esfuerza menos en **potencia**, sí, pero la pregunta
              es de altura. Y una columna de un líquido ligero tiene que ser
              **más** alta para producir la misma presión, no menos: piensa en
              cuánto mide una columna de aire que dé 1 atmósfera.

      - tipo: calcular
        titulo: La altura útil, en metros de aceite
        pregunta: |
          ¿A cuántos metros de columna de aceite equivalen los
          $8\ \text{kg/cm}^{2}$?
        respuesta:
          tipo: magnitud
          valor: '94.12 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '80 m'
            mensaje: |
              Esos son metros de columna de **agua**. La equivalencia
              $1\ \text{kg/cm}^{2} = 10\ \text{mca}$ lleva el agua metida
              dentro; para pasar a columna de aceite hay que dividir entre la
              densidad relativa.
          - valor: '68 m'
            mensaje: |
              Has multiplicado por $0{,}85$ en vez de dividir. Comprueba el
              sentido: si el aceite pesa menos que el agua, su columna tiene
              que ser **más** alta para dar los mismos $8\ \text{kg/cm}^{2}$.
        pista: |
          $p = \gamma h$, con $\gamma = 0{,}85\cdot 9800\ \text{N/m}^{3}$ y
          $p = 8\cdot 9{,}8\cdot 10^{4}\ \text{Pa}$.
        desarrollo: |
          $$
          H = \frac{p}{\gamma} = \frac{8\cdot 9{,}8\cdot 10^{4}}
          {0{,}85\cdot 9800} = 94{,}12\ \text{m}
          $$

      - tipo: calcular
        titulo: El coeficiente de frotamiento
        pregunta: |
          ¿Cuánto vale $f$? La viscosidad cinemática es
          $\nu = \mu/\rho = 0{,}01/850$.
        respuesta:
          tipo: numero
          valor: '0.0405'
          tolerancia: 0.0015
          formato: un número sin unidades
        distractores:
          - valor: '0.002957'
            mensaje: |
              Has usado $f = 64/Re$, que es la fórmula del régimen **laminar**.
              Con $Re = 21.645$ el flujo es turbulento de sobra: la frontera
              está en 2000.
          - valor: '0.0379'
            mensaje: |
              Ese es el valor de la zona **rugosa**, el que da Karman-Prandtl
              con $\varepsilon/D = 0{,}01$ sola. Pero $Re = 21.645$ está por
              debajo de $Re'' = 560/0{,}01 = 56.000$: todavía queda subcapa
              laminar, y el Reynolds sigue contando.
        pista: |
          $\varepsilon/D = 0{,}01$ y $Re = VD/\nu$ con
          $V = 0{,}1/(\pi\,0{,}25^{2})$. Con los dos, al ábaco.
        desarrollo: |
          $$
          V = \frac{0{,}1}{\pi\,0{,}5^{2}/4} = 0{,}509\ \text{m/s}
          \qquad
          \nu = \frac{0{,}01}{850} = 1{,}176\cdot 10^{-5}\ \text{m}^{2}/\text{s}
          $$
          $$
          Re = \frac{0{,}509\cdot 0{,}5}{1{,}176\cdot 10^{-5}} = 21\,645
          \qquad
          \frac{\varepsilon}{D} = \frac{0{,}5}{50} = 0{,}01
          \;\Longrightarrow\;
          f = 0{,}0405
          $$

      - tipo: calcular
        titulo: La separación entre estaciones
        pregunta: |
          ¿Qué longitud de tubería consume exactamente la altura que da una
          estación?
        respuesta:
          tipo: magnitud
          valor: '86540 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '74673 m'
            mensaje: |
              Has gastado los 80 metros de columna de agua en vez de los
              $94{,}12$ de columna de aceite. Son un 15 % menos de altura, y
              como la longitud es proporcional a la altura, un 15 % menos de
              distancia.
          - valor: '93901 m'
            mensaje: |
              La altura está bien; el $f$ es el de la zona rugosa,
              $0{,}0379$, y aquí el flujo es semirrugoso con $f = 0{,}0405$.
              Un 6 % menos de rozamiento da un 6 % más de distancia.
        pista: |
          Toda la altura útil se va en rozamiento: $H = f\,(L/D)\,V^{2}/2g$, y
          la incógnita es $L$.
        desarrollo: |
          $$
          94{,}12 = 0{,}0405\,\frac{L}{0{,}5}\,\frac{0{,}509^{2}}{19{,}6}
          \;\Longrightarrow\;
          L \approx 8{,}7\cdot 10^{4}\ \text{m}
          $$

          Unos **87 km**, que es la cifra que hay que dar. El boletín publica
          86.540 m; la diferencia del 1,5 % viene de leer el ábaco.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba da $8\ \text{kg/cm}^{2}$, que en columna de aceite son
              $94{,}12$ m, no 80.
          - texto: >-
              Con $Re = 21.645$ y $\varepsilon/D = 0{,}01$ el flujo es
              semirrugoso y $f = 0{,}0405$.
          - texto: >-
              Toda esa altura se gasta en rozamiento, y con ella la tubería
              recorre unos 87 km antes de necesitar otra estación.
          - texto: >-
              Si en vez de aceite se bombeara agua, con la misma bomba las
              estaciones podrían separarse todavía más.
            trampa: true
            mensaje: |
              Al revés. Con agua la misma presión de $8\ \text{kg/cm}^{2}$ da
              **80** metros de columna, no 94: menos altura disponible y por
              tanto **menos** distancia. Que el fluido sea ligero juega a
              favor aquí, y es justo lo contrario de lo que la intuición dice.

    resolucion: |
      **La conversión, que es donde está el ejercicio.** La bomba da una
      presión, y el enunciado la expresa en $\text{kg/cm}^{2}$. Pasarla a
      metros exige el peso específico **del fluido que se bombea**:

      $$
      H = \frac{p}{\gamma} = \frac{8\cdot 9{,}8\cdot 10^{4}}{0{,}85\cdot 9800}
      = 94{,}12\ \text{m de aceite}
      $$

      Los $80$ mca de la conversión de memoria son columna de agua. Aquí
      valen un 15 % menos de lo que hace falta.

      **El coeficiente.** $V = 0{,}509$ m/s, $\nu = 1{,}176\cdot 10^{-5}$
      m²/s, $Re = 21.645$. Con $\varepsilon/D = 0{,}01$ el punto cae en la
      franja semirrugosa —$Re'$ vale 2300 y $Re''$, 56.000— y el ábaco da
      $f = 0{,}0405$.

      **La distancia.** La estación siguiente se pone donde el rozamiento se
      ha comido toda la altura:

      $$
      L = \frac{H\,D\,2g}{f\,V^{2}} \approx 8{,}7\cdot 10^{4}\ \text{m}
      $$

      **Sobre el número publicado.** El boletín da 86.540 m; iterando
      Colebrook-White hasta converger salen 87.850. La diferencia es del
      1,5 %, y sale de leer $f = 0{,}0411$ en el ábaco en vez de $0{,}0405$
      —seis diezmilésimas, que en el eje logarítmico del Moody es menos que
      el grosor de la línea—. Las dos respuestas son la misma; se da por
      buena cualquiera de las dos.

      **Y lo que el resultado enseña.** Ochenta y siete kilómetros entre
      estaciones para 100 l/s de aceite. Un oleoducto no se dimensiona por la
      bomba: se dimensiona por cada cuánto puedes permitirte poner una, y esa
      distancia es lo que fija el diámetro.

  # ── COLECCIÓN 6.13. El «Big Inch» de verdad —el oleoducto que Estados
  #    Unidos construyó en 1942— y el ejercicio más completo del capítulo:
  #    lleva las dos direcciones, potencia a partir del caudal y caudal a
  #    partir de la potencia, y la segunda obliga a iterar al revés.
  - id: ejflu18-col613-el-big-inch
    titulo: El Big Inch, y qué pasa cuando la bomba envejece
    fuente: >-
      Ejercicio 6.13 · Colección de Problemas, capítulo 6 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El «Big Inch» es un oleoducto de acero comercial de $600\ \text{mm}$ de
      diámetro interior, proyectado para transportar un caudal de
      $47\,000\ \text{m}^{3}$ de petróleo crudo por día, en funcionamiento
      constante y estaciones de bombeo cada $80\ \text{km}$. Se pide:

      a) Potencia bruta necesaria en cada estación ($\eta = 75\ \%$).

      b) Caudal circulante si al cabo de cierto tiempo el rendimiento de las
      bombas ha bajado al $70\ \%$ y el coeficiente de frotamiento de la
      tubería ha aumentado en un $10\ \%$, habiendo conseguido mantener
      constante la potencia bruta de la bomba.

      Datos: peso específico relativo $= 0{,}86$; temperatura
      $= 10\ °\text{C}$; supóngase la conducción horizontal. La viscosidad
      cinemática del crudo a esa temperatura se lee en el ábaco:
      $\nu \approx 10^{-5}\ \text{m}^{2}/\text{s}$.
    pide: La potencia bruta por estación, y el caudal cuando la instalación se degrada.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide «potencia **bruta**» y da un rendimiento del
          75 %. ¿Qué relación hay entre esa potencia y $\gamma Q H$?
        opciones:
          - texto: >-
              $\gamma Q H$ es la potencia útil, la que recibe el fluido, y la
              bruta es mayor: se divide entre el rendimiento
            correcta: true
            mensaje: |
              Eso es. La bomba absorbe más de lo que entrega, y el rendimiento
              mide cuánto se pierde por el camino:
              $P_{\text{bruta}} = \gamma Q H/\eta$.
          - texto: >-
              $\gamma Q H$ es la bruta, y la útil sale de multiplicarla por el
              rendimiento
            mensaje: |
              Está del revés. $\gamma Q H$ es exactamente la energía por
              segundo que **el fluido gana**, es decir la útil. Lo que la
              bomba consume de la red es más, y el rendimiento es el cociente
              entre las dos.
          - texto: >-
              Son la misma potencia; «bruta» y «útil» se refieren a si se mide
              en kW o en CV
            mensaje: |
              No: son dos potencias distintas, y aquí se diferencian en un
              33 %. La unidad no tiene nada que ver — kW y CV son unidades de
              las dos por igual.

      - tipo: calcular
        titulo: La pérdida en un tramo
        pregunta: |
          ¿Cuánta carga pierde el crudo en los 80 km que separan dos
          estaciones?
        respuesta:
          tipo: magnitud
          valor: '454 m'
          tolerancia: 0.04
          formato: una longitud, con su unidad
        distractores:
          - valor: '301.5 m'
            mensaje: |
              Has entrado por el eje derecho del ábaco, como si la tubería
              fuera **rugosa**: eso da $f = 0{,}0120$. Con
              $\varepsilon/D = 10^{-4}$ la frontera rugosa está en
              $Re'' = 5{,}6\cdot 10^{6}$, y aquí el Reynolds es 115.000: muy
              lejos.
          - valor: '551 m'
            mensaje: |
              Un factor diez en la rugosidad. El acero comercial tiene
              $\varepsilon = 0{,}006\ \text{cm}$ en el cuadro n.º 20, no
              $0{,}06$: con $\varepsilon/D = 10^{-3}$ saldría $f = 0{,}0219$ y
              esos 551 m.
        pista: |
          $Q = 47.000/86.400$ m³/s. Con $\varepsilon = 0{,}006$ cm y
          $\nu = 10^{-5}$, al ábaco, y después Darcy-Weisbach con
          $L = 80.000$ m.
        desarrollo: |
          $$
          Q = \frac{47\,000}{86\,400} = 0{,}544\ \text{m}^{3}/\text{s}
          \qquad
          V = \frac{0{,}544}{\pi\,0{,}6^{2}/4} = 1{,}924\ \text{m/s}
          $$
          $$
          Re = \frac{1{,}924\cdot 0{,}6}{10^{-5}} = 1{,}154\cdot 10^{5}
          \qquad
          \frac{\varepsilon}{D} = \frac{0{,}006}{60} = 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0180
          $$
          $$
          h_f = 0{,}0180\,\frac{80\,000}{0{,}6}\,\frac{1{,}924^{2}}{19{,}6}
          = 454\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia bruta por estación
        pregunta: |
          ¿Qué potencia bruta necesita cada estación de bombeo?
        respuesta:
          tipo: magnitud
          valor: '2785 kW'
          tolerancia: 0.04
          formato: una potencia, con su unidad
        distractores:
          - valor: '2081 kW'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q h_f$. Falta dividir entre
              el rendimiento: la bomba consume un tercio más de lo que entrega
              al crudo.
          - valor: '1843 kW'
            mensaje: |
              Viene de haber usado el $f$ de la zona rugosa, $0{,}0120$, en
              vez del semirrugoso $0{,}0180$. La potencia es proporcional a
              $f$, así que el error se traslada entero.
        pista: |
          $P_{\text{bruta}} = \gamma Q h_f/\eta$, con
          $\gamma = 0{,}86\cdot 9800\ \text{N/m}^{3}$.
        desarrollo: |
          $$
          P = \frac{\gamma Q h_f}{\eta}
          = \frac{0{,}86\cdot 9800\cdot 0{,}544\cdot 454}{0{,}75}
          = 2{,}78\cdot 10^{6}\ \text{W}
          $$

      - tipo: calcular
        titulo: El caudal de la instalación envejecida
        pregunta: |
          Con el rendimiento en el 70 %, el coeficiente de frotamiento un
          10 % mayor y la misma potencia bruta, ¿cuánto caudal pasa?
        respuesta:
          tipo: magnitud
          valor: '515 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '544 l/s'
            mensaje: |
              Ese es el caudal de proyecto, el del apartado a). Que la
              potencia bruta se mantenga no significa que el caudal se
              mantenga: la bomba entrega menos al fluido —peor rendimiento— y
              la tubería exige más —más rozamiento—, así que el caudal tiene
              que bajar.
          - valor: '461.6 l/s'
            mensaje: |
              Parece que has escalado el caudal **linealmente** con la
              potencia útil y con el rozamiento. No es lineal: la potencia va
              con $Q^{3}$, porque $h_f$ ya lleva $Q^{2}$ dentro. Un 12 % menos
              de potencia útil no es un 12 % menos de caudal, es un 4 %.
        pista: |
          Escribe $P = \gamma Q h_f/\eta$ con $h_f$ en función de $Q$: sale
          $P \propto Q^{3}$. Después despeja.
        desarrollo: |
          $$
          P = \frac{\gamma}{\eta}\,Q\cdot f'\,\frac{L}{D}\,
          \frac{Q^{2}}{A^{2}\,2g}
          \;\Longrightarrow\;
          Q^{3} = \frac{P\,\eta\,D\,A^{2}\,2g}{\gamma\,f'\,L}
          $$

          Con $P = 2{,}78\cdot 10^{6}$ W, $\eta = 0{,}70$ y
          $f' = 1{,}1\cdot 0{,}0180 = 0{,}0198$:

          $$
          Q = 0{,}515\ \text{m}^{3}/\text{s} = 515\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada estación tiene que vencer 454 m de pérdida y consume
              2785 kW brutos para hacerlo.
          - texto: >-
              Al envejecer, el rendimiento baja del 75 al 70 % y el
              rozamiento sube un 10 %, pero la potencia contratada sigue
              siendo la misma.
          - texto: >-
              Como la potencia va con el cubo del caudal, esas dos pérdidas
              juntas solo se llevan un 5 % del transporte: de 544 a 515 l/s.
          - texto: >-
              Y como la caída es tan pequeña, la degradación de la
              instalación apenas cuesta dinero.
            trampa: true
            mensaje: |
              La caída de **caudal** es pequeña; el coste no. Se sigue pagando
              la misma potencia por mover un 5 % menos de crudo, y eso es un
              5 % más de energía por metro cúbico transportado, todos los días
              y en cada una de las estaciones. La misma ley del cubo que
              amortigua el caudal es la que hace cara la ineficiencia.

    resolucion: |
      **Por qué este ejercicio va el último del capítulo.** Recorre las dos
      direcciones del cálculo de conducciones: de caudal a potencia, que es
      directo, y de potencia a caudal, que no lo es.

      **a) De caudal a potencia.** $Q = 47.000/86.400 = 0{,}544$ m³/s,
      $V = 1{,}924$ m/s, $Re = 1{,}15\cdot 10^{5}$, y con
      $\varepsilon/D = 10^{-4}$ el ábaco da $f = 0{,}0180$. La pérdida en los
      80 km es de 454 m de columna de crudo, y la potencia bruta,

      $$
      P = \frac{0{,}86\cdot 9800\cdot 0{,}544\cdot 454}{0{,}75}
      = 2785\ \text{kW}
      $$

      **b) De potencia a caudal.** Aquí está lo que hay que ver: si se
      sustituye $h_f$ por su expresión, la potencia queda proporcional a
      $Q^{3}$. Eso cambia toda la intuición del apartado — un cambio grande
      en la potencia se traduce en uno pequeño en el caudal, y al revés.

      $$
      Q = \sqrt[3]{\frac{P\,\eta\,D\,A^{2}\,2g}{\gamma\,f'\,L}}
      = 515\ \text{l/s}
      $$

      **Lo que sale de comparar los dos apartados.** El rendimiento cae un
      6,7 % relativo y el rozamiento sube un 10 %: entre las dos, la potencia
      útil disponible baja un 15 %. Y el caudal solo baja un **5,3 %**,
      porque la raíz cúbica amortigua. Esa es la razón de que un oleoducto
      degradado siga funcionando sin que se note: el síntoma no aparece en el
      caudal, aparece en la factura.

      **Sobre la viscosidad, y por qué la tolerancia de este ejercicio es más
      ancha.** El crudo a 10 °C no está en ningún cuadro numérico: se lee en
      el ábaco de viscosidades, y de ahí sale $\nu \approx 10^{-5}$ m²/s. Con
      ese valor la potencia sale 2775 kW frente a los 2785 publicados —un
      0,4 %—, que es la precisión con la que se lee una escala logarítmica a
      ojo.

      Y hay una segunda holgura, más interesante. $Re = 1{,}15\cdot 10^{5}$
      queda **por debajo** de la primera frontera, $Re' = 23/10^{-4} =
      2{,}3\cdot 10^{5}$: según el criterio del tema, la tubería todavía se
      comporta como lisa. Si se toma así, $f = 0{,}0175$ y la potencia sale
      2688 kW. Colebrook-White completo, que es lo que reproduce el número
      del boletín, da $0{,}0180$ y 2785 kW. La diferencia es del 3,5 %, y las
      dos lecturas son defendibles: por eso este paso admite un 4 % en vez
      del 2 % habitual. **La frontera no es una pared, es el sitio donde el
      segundo término empieza a no importar** — y aquí todavía importa un
      poco.
