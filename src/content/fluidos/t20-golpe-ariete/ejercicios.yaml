ejercicios:
  # ── NUESTRO (§08). La colección tiene diecisiete ejercicios de este tema y
  #    todos empiezan ya con la celeridad calculada o con el material dado. Este
  #    aísla la decisión de proyecto: la misma conducción en dos materiales, y
  #    con el mismo tiempo de cierre uno resulta lento y el otro rápido.
  - id: ejflu20-el-material-decide-el-golpe
    titulo: La misma tubería en acero y en PVC, y el mismo cierre
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una conducción de $800\ \text{m}$ de longitud, $300\ \text{mm}$ de
      diámetro interior y $10\ \text{mm}$ de espesor lleva agua a
      $2\ \text{m/s}$. Una válvula en su extremo se cierra en
      $2\ \text{s}$.

      Calcular la sobrepresión por golpe de ariete en dos supuestos:

      a) La tubería es de **acero** ($k = 0{,}5$).

      b) La tubería es de **PVC** ($k = 33$).

      Usar la fórmula de Allievi para la celeridad,
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: La celeridad y la sobrepresión en cada material, clasificando el cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de tocar ninguna fórmula de golpe, ¿qué hay que calcular?
        opciones:
          - texto: >-
              La celeridad, y con ella $T = 2L/a$, para comparar con el tiempo
              de cierre y saber si es rápido o lento
            correcta: true
            mensaje: |
              Ese es el orden y no admite atajos: sin $T$ no se sabe qué
              fórmula toca, y las dos dan números creíbles. En este ejercicio,
              además, la clasificación **no es la misma** en los dos
              materiales.
          - texto: >-
              La sobrepresión con Allievi, que es el valor máximo, y quedarse
              del lado de la seguridad
            mensaje: |
              Es defendible como criterio de proyecto conservador, pero no es
              lo que se pide ni lo que corrige el examen: si el cierre es
              lento, el golpe **no llega** a ese valor y Allievi da un número
              que no ocurre.
          - texto: >-
              La pérdida de carga de la conducción, que hay que sumar a la
              sobrepresión
            mensaje: |
              La pérdida de carga es del régimen permanente y no interviene en
              el cálculo del golpe. Lo que sí se le suma al golpe es la presión
              **estática**, para obtener la presión máxima que ve la tubería.

      - tipo: calcular
        titulo: La celeridad en el acero
        pregunta: |
          ¿Cuánto vale la celeridad de la onda en la tubería de acero?
        respuesta:
          tipo: magnitud
          valor: '1244 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2556 m/s'
            mensaje: |
              Te has dejado el $48{,}3$ del denominador. Ese término representa
              la compresibilidad del propio fluido y está siempre: sin él la
              celeridad saldría mayor que la del sonido en el agua libre
              (1425 m/s), que es imposible.
          - valor: '1425 m/s'
            mensaje: |
              Esa es la velocidad del sonido en el agua, es decir la celeridad
              con tubería **rígida**. La real es siempre menor, porque el tubo
              también se dilata y eso deja entrar más fluido: la onda avanza
              más despacio.
        pista: |
          $D/e = 300/10 = 30$, y $k = 0{,}5$ para el acero.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 30}}
          = \frac{9900}{\sqrt{63{,}3}} = \frac{9900}{7{,}96}
          = 1244\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el acero
        pregunta: |
          Con $T_c = 2\ \text{s}$, ¿qué sobrepresión aparece en la tubería de
          acero?
        respuesta:
          tipo: magnitud
          valor: '163.3 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '253.9 mca'
            mensaje: |
              Has aplicado Allievi, pero aquí el cierre es **lento**:
              $T = 2L/a = 1{,}29\ \text{s}$, menos que los 2 s de cierre. La
              onda estabilizadora vuelve antes de que la válvula acabe de
              cerrar, así que el golpe no llega a completarse. Toca Michaud.
          - valor: '81.63 mca'
            mensaje: |
              Esa es la fórmula de Jouguet, $Lv/gT_c$, que da la mitad que
              Michaud. Las dos están en el temario, pero la que se usa para
              dimensionar —y la que se pide salvo que el enunciado nombre a
              Jouguet— es Michaud.
        pista: |
          Calcula $T = 2L/a$ y compáralo con los 2 s antes de elegir fórmula.
        desarrollo: |
          $$
          T = \frac{2L}{a} = \frac{1600}{1244} = 1{,}29\ \text{s}
          $$

          Como $T_c = 2 > 1{,}29$, el cierre es **lento** y se usa Michaud:

          $$
          \Delta H = \frac{2Lv}{g\,T_c} = \frac{2\cdot 800\cdot 2}{9{,}8\cdot 2}
          = 163{,}3\ \text{mca}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el PVC
        pregunta: |
          Y con la misma conducción en PVC y el mismo cierre de 2 s, ¿cuánto
          vale la sobrepresión?
        respuesta:
          tipo: magnitud
          valor: '62.7 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '163.3 mca'
            mensaje: |
              Has vuelto a usar Michaud, pero en PVC la clasificación **cambia**:
              la celeridad baja a 307 m/s, así que $T = 2L/a = 5{,}2\ \text{s}$
              y los 2 s de cierre ahora son **rápidos**. Toca Allievi. Es el
              punto del ejercicio.
          - valor: '627 mca'
            mensaje: |
              Un factor diez en la celeridad: $9900/\sqrt{1038} = 307$ m/s, no
              3070. Comprueba la raíz: $48{,}3 + 33\cdot 30 = 1038$.
        pista: |
          Recalcula $a$ con $k = 33$ y vuelve a comparar $T$ con los 2 s. La
          respuesta a «¿rápido o lento?» no tiene por qué ser la misma.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 33\cdot 30}} = \frac{9900}{\sqrt{1038{,}3}}
          = 307\ \text{m/s}
          $$
          $$
          T = \frac{1600}{307} = 5{,}21\ \text{s}
          $$

          Ahora $T_c = 2 < 5{,}21$: el cierre es **rápido** y toca Allievi.

          $$
          \Delta H = \frac{a\,v}{g} = \frac{307\cdot 2}{9{,}8} = 62{,}7\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El PVC es cuatro veces más flexible en términos de celeridad: 307
              m/s frente a los 1244 del acero.
          - texto: >-
              Con el mismo cierre de 2 s, en acero resulta lento (Michaud) y en
              PVC rápido (Allievi), porque la clasificación depende de la
              celeridad.
          - texto: >-
              Aun aplicando Allievi, que es la fórmula del golpe completo, el
              PVC sufre 62,7 mca frente a los 163,3 del acero con la fórmula
              más suave.
          - texto: >-
              Como en PVC el cierre resulta rápido, el golpe es más severo que
              en acero: la clasificación de «rápido» siempre implica más
              sobrepresión.
            trampa: true
            mensaje: |
              «Rápido» significa que el golpe llega a **su** máximo, no que ese
              máximo sea grande. El máximo de Allievi es proporcional a $a$, y
              la $a$ del PVC es cuatro veces menor. Por eso el PVC sale mejor
              parado incluso con la fórmula más desfavorable.

    resolucion: |
      **El orden.** Celeridad, periodo, clasificación, y solo entonces fórmula.
      Saltarse el tercer paso es el error del tema, y en este ejercicio se
      castiga solo: la clasificación **cambia** entre los dos materiales.

      **Acero** ($k = 0{,}5$, $D/e = 30$):

      $$
      a = \frac{9900}{\sqrt{63{,}3}} = 1244\ \text{m/s}
      \qquad
      T = \frac{1600}{1244} = 1{,}29\ \text{s}
      $$

      $T_c = 2 > T$: cierre **lento**, Michaud.

      $$
      \Delta H = \frac{2\cdot 800\cdot 2}{9{,}8\cdot 2} = 163{,}3\ \text{mca}
      $$

      **PVC** ($k = 33$):

      $$
      a = \frac{9900}{\sqrt{1038{,}3}} = 307\ \text{m/s}
      \qquad
      T = \frac{1600}{307} = 5{,}21\ \text{s}
      $$

      $T_c = 2 < T$: cierre **rápido**, Allievi.

      $$
      \Delta H = \frac{307\cdot 2}{9{,}8} = 62{,}7\ \text{mca}
      $$

      **Las dos lecturas.**

      La primera es de proyecto: **el PVC sufre menos de la tercera parte del
      golpe**, y eso con la fórmula desfavorable. Un material flexible se
      dilata más, deja entrar más fluido por el extremo de aguas arriba, la
      onda avanza más despacio y el golpe es menor. Misma razón por la que una
      pared delgada golpea menos que una gruesa.

      La segunda es de método, y es la que se examina: **«rápido» y «lento» no
      describen la válvula, describen la relación entre la válvula y la
      tubería**. Los mismos dos segundos son lentos en acero y rápidos en PVC.
      Por eso no se puede clasificar leyendo el enunciado: hay que calcular
      $2L/a$.

  # ── COLECCIÓN 7.3. La misma tubería con dos tiempos de cierre, uno a cada
  #    lado de la frontera. Es el ejercicio que la escuela usa para enseñar la
  #    clasificación, y sus dos apartados difieren en un factor de dos.
  - id: ejflu20-la-misma-valvula-en-cuatro-y-en-dos-segundos
    titulo: La misma válvula cerrada en cuatro segundos y en dos
    fuente: >-
      Ejercicio 7.3 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una conducción de $1200\ \text{m}$ de longitud y $400\ \text{mm}$ de
      diámetro se transporta un caudal de $200\ \text{l/s}$ de agua. Se conoce
      que la tubería, de $8\ \text{mm}$ de espesor, es de acero cuyo módulo de
      elasticidad es de $2\cdot 10^{7}\ \text{N/cm}^{2}$. Si se cierra una
      válvula dispuesta en su extremo final se desea conocer la sobrepresión
      producida por golpe de ariete:

      a) Si el cierre se efectúa en $4\ \text{s}$.

      b) Si el cierre se realiza en $2\ \text{s}$.
    pide: La sobrepresión en cada uno de los dos tiempos de cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da el módulo de elasticidad, no el coeficiente $k$.
          ¿Cómo se pasa de uno al otro?
        opciones:
          - texto: >-
              $k = 10^{7}/E$ con $E$ en N/cm², lo que aquí da $k = 0{,}5$: el
              valor tabulado del acero
            correcta: true
            mensaje: |
              Eso es, y comprobar que coincide con el de la tabla es una buena
              costumbre: si el $k$ que sale no se parece a ninguno de la lista,
              casi seguro hay un lío de unidades en $E$.
          - texto: >-
              $k = E/10^{7}$, que da 2
            mensaje: |
              Es la inversa. Fíjate en el sentido físico: $k$ tiene que ser
              **pequeño** para un material rígido, porque un material rígido da
              celeridad alta y $k$ está en el denominador. El acero, que es de
              lo más rígido de la tabla, tiene el $k$ más pequeño.
          - texto: >-
              No hace falta $k$: con $E$ se usa directamente la fórmula de
              Joukowski
            mensaje: |
              Se puede, y da el mismo resultado. Pero entonces hay que meter
              también $K$ y $\rho$ del agua y cuidar las unidades de los dos
              módulos. La forma de Allievi ya lleva todo eso dentro y es la que
              usa la asignatura.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuál es la celeridad de la onda?
        respuesta:
          tipo: magnitud
          valor: '1156 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1425 m/s'
            mensaje: |
              Esa es la del sonido en el agua libre, o lo que saldría con
              $D/e = 0$. Aquí $D/e = 50$ y con $k = 0{,}5$ el denominador sube
              de 48,3 a 73,3.
          - valor: '813 m/s'
            mensaje: |
              Has usado $k = 2$, es decir $E/10^{7}$ en vez de $10^{7}/E$. El
              acero es de los materiales más rígidos de la tabla, así que le
              corresponde el $k$ más **pequeño**: 0,5. Con 2 estarías tratando
              la tubería como si fuera casi de hormigón.
        pista: |
          $k = 10^{7}/(2\cdot 10^{7}) = 0{,}5$ y $D/e = 50$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 50}}
          = \frac{9900}{\sqrt{73{,}3}} = 1156\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El cierre en cuatro segundos
        pregunta: |
          ¿Qué sobrepresión aparece si la válvula se cierra en 4 s?
        respuesta:
          tipo: magnitud
          valor: '955 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1840 kpa'
            mensaje: |
              Has aplicado Allievi. Con $T = 2L/a = 2{,}08\ \text{s}$ y un
              cierre de 4 s, la onda estabilizadora vuelve cuando la válvula
              lleva la mitad del recorrido: el cierre es **lento** y el golpe
              no se completa.
          - valor: '477.5 kpa'
            mensaje: |
              Es la fórmula de Jouguet, que da la mitad de Michaud. Para
              dimensionar se usa Michaud, que es la conservadora, salvo que el
              enunciado pida expresamente la otra.
        pista: |
          Primero $T = 2L/a$, después la comparación, y solo entonces la
          fórmula. La velocidad es $Q/A$ con $A = \pi\,0{,}4^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}2}{\pi\cdot 0{,}4^{2}/4} = 1{,}59\ \text{m/s}
          \qquad
          T = \frac{2\cdot 1200}{1156} = 2{,}08\ \text{s}
          $$

          $T_c = 4 > 2{,}08$: cierre **lento**, Michaud.

          $$
          \Delta H = \frac{2Lv}{g\,T_c} = \frac{2\cdot 1200\cdot 1{,}59}{9{,}8\cdot 4}
          = 97{,}4\ \text{mca}
          $$
          $$
          \Delta p = 97{,}4\cdot 9800 = 955\ \text{kPa}
          $$

      - tipo: calcular
        titulo: El cierre en dos segundos
        pregunta: |
          ¿Y si se cierra en 2 s?
        respuesta:
          tipo: magnitud
          valor: '1840 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1910 kpa'
            mensaje: |
              Has usado Michaud con $T_c = 2$. Fíjate en lo justo que va:
              $T = 2{,}08\ \text{s}$ y el cierre es de 2, así que por ocho
              centésimas el cierre es **rápido** y toca Allievi. Los dos
              números se parecen precisamente porque el caso está en la
              frontera.
          - valor: '955 kpa'
            mensaje: |
              Ese es el resultado del apartado anterior. Al reducir el tiempo
              de cierre a la mitad el golpe **no** puede quedarse igual: o se
              duplica, si sigue siendo lento, o se planta en el máximo de
              Allievi, que es lo que pasa aquí.
        pista: |
          Vuelve a comparar: 2 s contra los 2,08 s del periodo.
        desarrollo: |
          $T_c = 2 < 2{,}08$: cierre **rápido**, Allievi.

          $$
          \Delta H = \frac{a\,v}{g} = \frac{1156\cdot 1{,}59}{9{,}8}
          = 187{,}8\ \text{mca}
          $$
          $$
          \Delta p = 187{,}8\cdot 9800 = 1840\ \text{kPa}
          $$

          Casi el doble que en el apartado a), por cerrar dos segundos antes.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $k = 0{,}5$ y $D/e = 50$, la celeridad es de 1156 m/s y el
              periodo de ida y vuelta, $T = 2L/a = 2{,}08$ s.
          - texto: >-
              Cerrando en 4 s el cierre es lento y Michaud da 97,4 mca; en 2 s
              es rápido y Allievi da 187,8 mca.
          - texto: >-
              Al pasar de 4 a 2 segundos el golpe casi se duplica, y a partir
              de 2,08 s hacia abajo ya no crece más: 187,8 mca es el techo.
          - texto: >-
              Si se cerrara en 0,5 s el golpe sería cuatro veces el de 2 s,
              porque Michaud es inversamente proporcional al tiempo de cierre.
            trampa: true
            mensaje: |
              Michaud ya no aplica por debajo de $T = 2{,}08$ s: ahí el cierre
              es rápido y manda Allievi, que **no depende del tiempo de
              cierre**. Cerrar en medio segundo da exactamente los mismos 187,8
              mca que cerrar en dos. El golpe tiene techo, y por eso acelerar
              el cierre por debajo de $2L/a$ no empeora nada — igual que
              alargarlo un poco tampoco mejora nada hasta pasar esa frontera.

    resolucion: |
      **La celeridad.** El enunciado da $E$, no $k$:
      $k = 10^{7}/(2\cdot 10^{7}) = 0{,}5$, que es el valor tabulado del acero.
      Con $D/e = 50$:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 25}} = 1156\ \text{m/s}
      $$

      **La frontera.** $T = 2L/a = 2{,}08\ \text{s}$. Los dos apartados están
      uno a cada lado, y eso es deliberado del enunciado.

      **a) Cierre en 4 s: lento.** Con $v = Q/A = 1{,}59\ \text{m/s}$,

      $$
      \Delta H = \frac{2Lv}{g\,T_c} = 97{,}4\ \text{mca} = 955\ \text{kPa}
      $$

      **b) Cierre en 2 s: rápido.**

      $$
      \Delta H = \frac{a\,v}{g} = 187{,}8\ \text{mca} = 1840\ \text{kPa}
      $$

      **Lo que enseña la comparación.** Casi el doble de presión por dos
      segundos. Y el matiz que se suele pasar por alto: **por debajo de los
      2,08 s ya no crece más**. Allievi no lleva el tiempo de cierre dentro
      porque, una vez que la válvula acaba antes de que vuelva la onda, da
      igual cuánto antes acabe: el golpe ya está completo.

      Eso convierte $2L/a$ en el dato de proyecto. Alargar el cierre de 0,5 s a
      2 s no sirve de nada en esta conducción; pasar de 2 a 4 s baja el golpe a
      la mitad. **Toda la mejora está al otro lado de esa frontera**, y por eso
      lo primero que se calcula es dónde cae.

      **Nota sobre los números.** El boletín redondea la velocidad a 1,6 m/s y
      publica 960 y 1850 kPa; con $v = 1{,}59$ exacta salen 955 y 1840. La
      diferencia es del 0,5 %.

  # ── COLECCIÓN 7.5 y 7.6, juntos porque el enunciado es el mismo y solo
  #    cambia el límite de sobrepresión. Por separado el 7.6 parece un error
  #    de imprenta; juntos enseñan lo único que importa del tema: hay un
  #    techo, y por debajo de él no hay maniobra que valga.
  - id: ejflu20-col75-cuanto-tiene-que-durar-el-cierre
    titulo: Cuánto tiene que durar el cierre, y el límite que no se puede pedir
    fuente: >-
      Ejercicios 7.5 y 7.6 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En una tubería de acero, de $3\ \text{mm}$ de espesor, $350\ \text{mm}$
      de diámetro y $1500\ \text{m}$ de longitud, circula un caudal de agua
      $Q = 250\ \text{l/s}$.

      a) (7.5) ¿Cuánto debe durar la maniobra de cierre de una válvula situada
      en el extremo final de la tubería, para que la sobrepresión no exceda de
      $80\ \text{mca}$?

      b) (7.6) ¿Y para que no exceda de $300\ \text{mca}$? Razonar la
      respuesta.

      Dato: $k_{\text{acero}} = 0{,}5$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tiempo de cierre para cada límite de sobrepresión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué decide si hay que usar Allievi o
          Micheaud?
        opciones:
          - texto: >-
              Comparar el tiempo de cierre con $2L/a$, el tiempo que tarda la
              onda en ir y volver
            correcta: true
            mensaje: |
              Eso es. Si la válvula termina de cerrar **antes** de que vuelva
              la onda, el cierre es rápido y la sobrepresión es la máxima que
              el sistema puede dar, la de Allievi. Si le da tiempo a volver,
              la onda reflejada alivia y vale Micheaud.
          - texto: >-
              Si el cierre dura menos de un segundo es rápido, y si dura más,
              lento
            mensaje: |
              No hay un umbral absoluto: depende de la tubería. Los tres
              segundos que son «lentos» en una tubería de 1500 m son
              rapidísimos en una de laboratorio de 3 m, donde la onda va y
              vuelve en quince milésimas.
          - texto: >-
              El material: en tuberías rígidas el cierre siempre es rápido
            mensaje: |
              El material entra en $a$, y con ella en $2L/a$, pero no decide
              nada por sí solo. Una tubería de acero muy larga tiene un
              tiempo crítico grande y admite cierres lentos sin problema.

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿Cuánto vale la celeridad $a$?
        respuesta:
          tipo: magnitud
          valor: '959 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$: eso es
              $9900/\sqrt{48{,}3}$, la celeridad en agua dentro de una tubería
              **infinitamente rígida**. Es el techo teórico; ninguna tubería
              real llega.
          - valor: '394 m/s'
            mensaje: |
              Has usado $k = 5$, que es el del hormigón armado. El acero es
              $k = 0{,}5$: diez veces más rígido, y por eso la onda va más del
              doble de rápido.
        pista: |
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$, con $D$ y $e$ en las mismas
          unidades.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot\dfrac{350}{3}}}
          = \frac{9900}{\sqrt{106{,}63}} = 959\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El tiempo de cierre para 80 mca
        pregunta: |
          ¿Cuánto tiene que durar el cierre para que la sobrepresión no pase
          de $80\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '9.94 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '3.13 s'
            mensaje: |
              Ese es el tiempo crítico $2L/a$, la frontera entre cierre rápido
              y lento. Cerrar en ese tiempo da la sobrepresión **máxima**, 254
              mca, no 80.
          - valor: '4.97 s'
            mensaje: |
              Te has dejado el 2 de Micheaud. La expresión es
              $\Delta H = 2Lv/(g\,T)$, con el 2 porque la onda recorre la
              tubería dos veces.
        pista: |
          Micheaud despejando el tiempo, con
          $v = Q/A$ y $A = \pi\,0{,}35^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}25}{\pi\,0{,}35^{2}/4} = 2{,}60\ \text{m/s}
          $$
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{2\cdot 1500\cdot 2{,}60}
          {9{,}8\cdot 80} = 9{,}94\ \text{s}
          $$

          Y hay que comprobarlo: $9{,}94 > 2L/a = 3{,}13$, así que el cierre
          es efectivamente lento y Micheaud vale.

      - tipo: calcular
        titulo: La sobrepresión máxima que esta tubería puede dar
        pregunta: |
          ¿Cuál es la mayor sobrepresión posible, cierre la válvula como
          cierre?
        respuesta:
          tipo: magnitud
          valor: '254 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '2492 mca'
            mensaje: |
              Te has dejado la gravedad. Allievi es $\Delta H = a\,v/g$: el
              resultado son metros de columna, y para eso hay que dividir
              entre $g$.
          - valor: '24.5 mca'
            mensaje: |
              Has usado el caudal, $0{,}25$, donde va la **velocidad**,
              $2{,}60$ m/s. En Allievi entra la velocidad del agua, no el
              caudal.
        pista: |
          Es la de Allievi: el cierre instantáneo, cuando la onda no tiene
          tiempo de volver.
        desarrollo: |
          $$
          \Delta H_{\max} = \frac{a\,v}{g} = \frac{959\cdot 2{,}60}{9{,}8}
          = 254\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Aplicando Micheaud a los 300 mca sale $T = 2{,}65$ s.
          - texto: >-
              Pero $2{,}65$ s es **menor** que el tiempo crítico de
              $3{,}13$ s, así que ese cierre no sería lento y Micheaud no le
              aplica: la cuenta se contradice a sí misma.
          - texto: >-
              Lo que ocurre es que esta tubería no puede dar 300 mca ni
              cerrando de golpe: su techo es la sobrepresión de Allievi,
              254 mca.
          - texto: >-
              Por tanto hay que reducir el espesor de la tubería para que la
              sobrepresión pueda llegar a los 300 mca pedidos.
            trampa: true
            mensaje: |
              Nadie quiere **llegar** a 300 mca: el enunciado pide no
              excederlos. Y no se exceden nunca, así que la respuesta es
              «cualquier tiempo de cierre vale». Que un límite de diseño esté
              por encima del máximo físico es una buena noticia, no un
              problema a resolver.

    resolucion: |
      **Los dos ejercicios son el mismo enunciado con dos límites, y por eso
      van juntos.** El 7.5 tiene respuesta numérica y el 7.6 no, y esa
      diferencia es lo que hay que entender.

      **La celeridad.** Con $k = 0{,}5$ para el acero y $D/e = 350/3$:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 58{,}33}} = 959\ \text{m/s}
      $$

      de donde el **tiempo crítico** $2L/a = 3000/959 = 3{,}13$ s. Ese número
      es la referencia de todo lo demás.

      **a) Para 80 mca.** Micheaud despejando el tiempo da $T = 9{,}94$ s. Y
      se comprueba: $9{,}94 > 3{,}13$, cierre lento, la fórmula era la buena.

      **b) Para 300 mca, y por qué no hay respuesta.** Repitiendo la cuenta
      sale $T = 2{,}65$ s… que es **menor** que el tiempo crítico. La cuenta
      se ha aplicado fuera de su dominio: para tiempos por debajo de 3,13 s el
      cierre es rápido y la sobrepresión ya no depende del tiempo, sino que
      vale lo que dice Allievi:

      $$
      \Delta H_{\max} = \frac{a\,v}{g} = 254\ \text{mca}
      $$

      **Doscientos cincuenta y cuatro es el techo de esta tubería.** Con este
      caudal y este material no hay maniobra —ni el cierre instantáneo— que
      produzca 300 mca. La respuesta al 7.6 es: cualquier tiempo de cierre
      cumple la condición.

      **La regla que sale de aquí, y que vale para todo el tema.** Micheaud
      solo es válida por encima del tiempo crítico. Si al despejar el tiempo
      sale uno menor, **no se acepta el resultado**: se vuelve atrás, se
      calcula Allievi y se compara. Es el mismo tipo de comprobación que
      exigir que un caudal salga positivo.

  # ── COLECCIÓN 7.8. La misma cuenta de siempre a escala de central
  #    hidroeléctrica real. Sirve para ver que quinientos metros de
  #    sobrepresión no son un caso de laboratorio: es lo que aguanta una
  #    tubería forzada de verdad.
  - id: ejflu20-col78-la-tuberia-forzada-de-villarino
    titulo: La tubería forzada de Villariño, y sus quinientos metros de golpe
    fuente: >-
      Ejercicio 7.8 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La tubería forzada de la central hidroeléctrica de Villariño (Salamanca)
      es de hormigón armado ($C_{\text{material}} = 5$). Tiene una longitud de
      $15\ \text{km}$, el diámetro interior es de $7{,}5\ \text{m}$ y el
      espesor de $50\ \text{cm}$. El máximo caudal de agua es de
      $287\ \text{m}^{3}/\text{s}$. Se pide:

      a) Si la válvula de mariposa situada al final de la tubería se cierra en
      $40\ \text{s}$, calcular el valor de la sobrepresión generada por golpe
      de ariete.

      b) Explicar dos maneras de atenuar dicha sobrepresión.

      Dato: $a = 9900/\sqrt{48{,}3 + C_{\text{mat}}\,D/e}$.
    pide: La sobrepresión al cerrar en 40 s, y dos formas de atenuarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tubería mide 15 km y el cierre dura 40 s. ¿Qué esperas antes de
          calcular?
        opciones:
          - texto: >-
              Que el tiempo crítico sea grande —decenas de segundos— porque la
              tubería es larguísima, así que 40 s podría ser un cierre lento
            correcta: true
            mensaje: |
              Bien planteado. $2L/a$ con 30 km de recorrido y una onda de unos
              900 m/s sale del orden de 33 s: los 40 s quedan justo por
              encima, y el cierre es lento por poco.
          - texto: >-
              Que 40 s es muchísimo tiempo, así que la sobrepresión será
              despreciable
            mensaje: |
              Cuarenta segundos son muchos en una tubería de casa y muy pocos
              en una de quince kilómetros. Va a salir una sobrepresión de casi
              500 metros de columna: nada despreciable.
          - texto: >-
              Que el cierre es rápido, porque una válvula de mariposa cierra
              de golpe
            mensaje: |
              «Rápido» y «lento» no describen la válvula, sino la comparación
              entre su tiempo y el de ida y vuelta de la onda. Aquí hay que
              calcular $2L/a$ antes de decidir.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuánto vale $a$ en esta tubería?
        respuesta:
          tipo: magnitud
          valor: '892 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1325 m/s'
            mensaje: |
              Has usado $k = 0{,}5$, el del acero. La tubería es de hormigón
              armado y su coeficiente es 5: diez veces más deformable, y por
              eso la onda va un tercio más despacio.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$. Eso es la celeridad en agua
              confinada en una tubería indeformable, el límite superior que
              ningún material alcanza.
        pista: |
          $D/e = 7{,}5/0{,}5$, las dos en metros.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 5\cdot\dfrac{7{,}5}{0{,}5}}}
          = \frac{9900}{\sqrt{123{,}3}} = 892\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          ¿Qué sobrepresión genera el cierre en 40 s?
        respuesta:
          tipo: magnitud
          valor: '497 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '591 mca'
            mensaje: |
              Esa es la de Allievi, la del cierre rápido. Aquí
              $2L/a = 33{,}6$ s y el cierre dura 40: la onda vuelve antes de
              que la válvula termine, y parte del golpe se alivia. Va
              Micheaud.
          - valor: '249 mca'
            mensaje: |
              Te has dejado el 2 de Micheaud. La onda recorre los 15 km de
              ida y otros 15 de vuelta: $\Delta H = 2Lv/(g\,T)$.
        pista: |
          Compara primero 40 s con $2L/a$; después aplica la fórmula que
          corresponda, con $v = 287/(\pi\,7{,}5^{2}/4)$.
        desarrollo: |
          $$
          v = \frac{287}{\pi\,7{,}5^{2}/4} = 6{,}50\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{30\,000}{892} = 33{,}6\ \text{s} < 40
          $$

          Cierre **lento**, luego Micheaud:

          $$
          \Delta H = \frac{2\cdot 15\,000\cdot 6{,}50}{9{,}8\cdot 40}
          = 497\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión y las dos medidas. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $a = 892$ m/s el tiempo crítico es de 33,6 s, y el cierre de
              40 s queda por encima: es lento, y la sobrepresión son 497 mca.
          - texto: >-
              La primera forma de atenuarlo es alargar el cierre: como
              Micheaud es inversamente proporcional al tiempo, doblarlo a 80 s
              deja la sobrepresión en 249 mca.
          - texto: >-
              La segunda es acortar la longitud efectiva con una chimenea de
              equilibrio, que refleja la onda mucho antes de que llegue al
              embalse.
          - texto: >-
              Y una tercera, siempre válida, es aumentar el espesor de la
              tubería, que reduce la sobrepresión generada.
            trampa: true
            mensaje: |
              Aumentar el espesor hace la tubería **más rígida**, sube la
              celeridad y con ella la sobrepresión de Allievi: empeora el
              golpe, no lo atenúa. Lo que sí consigue es que la tubería
              **aguante** más, que es otra cosa. Confundir «reducir la carga»
              con «resistir la carga» es el error típico del tema.

    resolucion: |
      **Los números.** $v = 6{,}50$ m/s, $a = 892$ m/s, tiempo crítico
      $2L/a = 33{,}6$ s. El cierre de 40 s queda por encima —por poco— así
      que es lento y vale Micheaud:

      $$
      \Delta H = \frac{2Lv}{g\,T} = 497\ \text{mca}
      $$

      Casi medio kilómetro de columna de agua, unos **49 bar**, encima de la
      presión de servicio que la tubería ya tiene. Por eso una tubería forzada
      lleva el espesor que lleva.

      **Y qué pasa si se cierra un poco más deprisa.** A 33,6 s el cierre pasa
      a rápido y la sobrepresión se congela en la de Allievi,
      $a\,v/g = 591$ mca. Es decir: entre 40 y 33,6 segundos la sobrepresión
      sube un 19 %, y por debajo ya no sube más. **El diseño de la maniobra
      vive todo en esa franja.**

      **Dos maneras de atenuarlo.**

      1. **Alargar la maniobra.** Micheaud va con $1/T$: cerrar en 80 s en vez
         de 40 deja la sobrepresión en la mitad. Es la medida más barata y la
         primera que se toma, con el límite de que la turbina no puede quedar
         sin control demasiado tiempo.

      2. **Chimenea de equilibrio.** Un depósito abierto intercalado en la
         conducción. La onda de presión se refleja allí en vez de en el
         embalse, y en la fórmula lo que cuenta pasa a ser la distancia
         válvula-chimenea, no los 15 km. Es lo que hace el ejercicio 7.16 de
         la colección, donde la chimenea se coloca para poder cerrar en 30 s.

      También valen un volante de inercia en el grupo, una válvula de
      descarga sincronizada o un calderín antiariete. Lo que **no** vale es
      engrosar la tubería: eso la hace más rígida, sube la celeridad y empeora
      el golpe, aunque a cambio la tubería lo resista mejor.

  # ── COLECCIÓN 7.9. Los dos tubos del laboratorio de la escuela. Es el
  #    ejercicio que rompe la intuición de que el golpe de ariete es cosa de
  #    grandes instalaciones: tres metros de tubo y trece milésimas de
  #    segundo, y el fenómeno está entero.
  - id: ejflu20-col79-los-dos-tubos-del-laboratorio
    titulo: Tres metros de tubo, y el golpe de ariete entero
    fuente: >-
      Ejercicio 7.9 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En el laboratorio hay dos tuberías, una de PVC
      ($D_i = 28{,}4\ \text{mm}$, $e = 1{,}8\ \text{mm}$) y otra de cobre
      ($D_i = 26\ \text{mm}$, $e = 1{,}0\ \text{mm}$), ambas de longitud
      $L = 3\ \text{m}$. Si circula un caudal de $1{,}5\ \text{l/s}$ por cada
      tubería, se pide, determinar primeramente en ambos casos qué tipo de
      cierre es, y calcular:

      a) La sobrepresión generada en la tubería de PVC al cerrar la válvula de
      bola situada al final de la tubería, si el tiempo de cierre ha sido
      $0{,}1\ \text{s}$.

      b) Tiempo que ha durado el cierre de la válvula accionada
      neumáticamente situada al final de la tubería de cobre, si se ha medido
      una sobrepresión de $135\ \text{mca}$.

      Datos: $k_{\text{PVC}} = 33$; $k_{\text{cobre}} = 0{,}8$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tipo de cierre en los dos casos, la sobrepresión en el PVC y el tiempo en el cobre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos tubos miden 3 m. ¿Qué orden de magnitud tiene su tiempo
          crítico?
        opciones:
          - texto: >-
              Milésimas de segundo, porque la onda recorre seis metros a
              varios cientos de metros por segundo
            correcta: true
            mensaje: |
              Eso es, y es lo que hace este ejercicio distinto: en el PVC son
              14 milésimas y en el cobre, 5. Cualquier cierre manual es
              «lento» a esa escala.
          - texto: >-
              Del orden de un segundo, como en cualquier instalación
            mensaje: |
              El tiempo crítico no tiene un valor típico: es $2L/a$, y con
              $L = 3$ m sale mil veces menor que en una conducción de
              kilómetros. Ese es todo el contenido del ejercicio.
          - texto: >-
              No se puede saber sin conocer el caudal
            mensaje: |
              El tiempo crítico no depende del caudal: solo de la longitud y
              de la celeridad, que a su vez depende del material y de la
              geometría del tubo. El caudal entra después, en la
              sobrepresión.

      - tipo: calcular
        titulo: La celeridad en el PVC
        pregunta: |
          ¿Cuánto vale $a$ en el tubo de PVC?
        respuesta:
          tipo: magnitud
          valor: '415 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1191 m/s'
            mensaje: |
              Esa es la del **cobre**. El PVC tiene $k = 33$ frente a
              $0{,}8$: se deforma cuarenta veces más, y la onda va a un
              tercio de velocidad.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$, que aquí es el que domina:
              vale 520 frente a los 48,3 del agua. En un tubo de plástico
              fino, la elasticidad del tubo manda sobre la del agua.
        pista: |
          $D/e = 28{,}4/1{,}8$, y $k = 33$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 33\cdot\dfrac{28{,}4}{1{,}8}}}
          = \frac{9900}{\sqrt{569}} = 415\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el PVC
        pregunta: |
          Cerrando en $0{,}1\ \text{s}$, ¿qué sobrepresión aparece?
        respuesta:
          tipo: magnitud
          valor: '14.5 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '100.3 mca'
            mensaje: |
              Esa es la de Allievi. Comprueba el tiempo crítico:
              $2L/a = 6/415 = 0{,}014$ s, y el cierre ha durado $0{,}1$, siete
              veces más. Es un cierre lento y la onda reflejada alivia casi
              todo el golpe.
          - valor: '7.25 mca'
            mensaje: |
              Te has dejado el 2 de Micheaud: la onda recorre los tres metros
              de ida y otros tres de vuelta.
        pista: |
          $v = 1{,}5\cdot 10^{-3}/(\pi\,0{,}0284^{2}/4)$, y compara
          $0{,}1$ con $2L/a$.
        desarrollo: |
          $$
          v = \frac{1{,}5\cdot 10^{-3}}{\pi\,0{,}0284^{2}/4}
          = 2{,}37\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{6}{415} = 0{,}0145\ \text{s} < 0{,}1
          $$
          $$
          \Delta H = \frac{2\cdot 3\cdot 2{,}37}{9{,}8\cdot 0{,}1}
          = 14{,}5\ \text{mca}
          $$

      - tipo: calcular
        titulo: El tiempo de la válvula neumática
        pregunta: |
          En el tubo de cobre se han medido $135\ \text{mca}$. ¿Cuánto duró
          el cierre?
        respuesta:
          tipo: magnitud
          valor: '0.0128 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '0.00504 s'
            mensaje: |
              Ese es el tiempo crítico del cobre, $2L/a = 6/1191$. Cerrar en
              ese tiempo daría la sobrepresión de Allievi, 343 mca, mucho más
              de los 135 medidos.
          - valor: '0.00641 s'
            mensaje: |
              Te has dejado el 2 de Micheaud. Y fíjate en lo que habría
              pasado si no: $0{,}0064$ s es **mayor** que el tiempo crítico
              de $0{,}0050$, así que el resultado no se habría delatado solo.
              Aquí hay que hacer bien la fórmula, no confiar en que el
              disparate salte a la vista.
        pista: |
          Micheaud despejando $T$, con la velocidad y la celeridad del cobre.
        desarrollo: |
          $$
          v = \frac{1{,}5\cdot 10^{-3}}{\pi\,0{,}026^{2}/4}
          = 2{,}83\ \text{m/s}
          \qquad
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}8\cdot 26}} = 1191\ \text{m/s}
          $$
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{6\cdot 2{,}83}{9{,}8\cdot 135}
          = 0{,}0128\ \text{s}
          $$

          Y se comprueba: $0{,}0128 > 2L/a = 0{,}0050$. Cierre lento.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos cierres son lentos, porque los tiempos críticos son de
              14 y 5 milésimas de segundo y las maniobras duran más.
          - texto: >-
              El PVC, con $k = 33$, tiene una celeridad de 415 m/s frente a
              los 1191 del cobre: el tubo de plástico absorbe la onda
              deformándose.
          - texto: >-
              Cerrando en 0,1 s el PVC da 14,5 mca; el cobre necesita cerrar
              en 12,8 milésimas para llegar a 135.
          - texto: >-
              Como el PVC da menos sobrepresión que el cobre, es siempre el
              material más seguro frente al golpe de ariete.
            trampa: true
            mensaje: |
              Menos sobrepresión, sí, pero también mucha menos resistencia. Lo
              que hay que comparar no es el golpe sino el golpe **frente a lo
              que el tubo aguanta**. Un tubo de PVC fino puede reventar con
              una sobrepresión que a uno de cobre no le hace nada. Los 14,5
              mca de aquí son cómodos; los 100 de Allievi, si la válvula
              cerrara de golpe, ya no lo serían tanto.

    resolucion: |
      **Por qué este ejercicio merece la pena.** El golpe de ariete se explica
      siempre con centrales y conducciones de kilómetros, y eso hace pensar
      que es un fenómeno de escala grande. Aquí hay tres metros de tubo en una
      mesa de laboratorio y el fenómeno está entero, solo que todo ocurre mil
      veces más deprisa.

      **Los tiempos críticos.** $2L/a$ vale $0{,}0145$ s en el PVC y
      $0{,}0050$ en el cobre. Cualquier maniobra humana —una válvula de bola
      girada a mano tarda décimas— es «lenta» a esa escala, y por eso los dos
      cierres lo son.

      **a) El PVC.** $v = 2{,}37$ m/s, $a = 415$ m/s, $T = 0{,}1$ s:

      $$
      \Delta H = \frac{2Lv}{g\,T} = 14{,}5\ \text{mca}
      $$

      **b) El cobre.** Despejando el tiempo de Micheaud con
      $\Delta H = 135$ mca: $T = 0{,}0128$ s. Una válvula neumática sí llega
      a esos tiempos; una manual, no.

      **Lo que separa los dos materiales.** El coeficiente $k$ vale 33 en el
      PVC y 0,8 en el cobre, y ese es prácticamente todo el término del
      denominador: el agua aporta 48,3 y el tubo de PVC, 520. **En un tubo de
      plástico delgado la onda va a la velocidad que le deja el tubo, no la
      que le deja el agua.** En el cobre ocurre lo contrario: 20,8 frente a
      48,3, y la celeridad se acerca a la del agua libre.

      Esa es la razón física de que las instalaciones domésticas de plástico
      den golpes de ariete mucho más suaves que las antiguas de cobre, y de
      que el golpe seco al cerrar un grifo se oiga en unas casas y en otras
      no.

  # ── COLECCIÓN 7.13. El único del capítulo que pide diseñar la maniobra en
  #    los dos sentidos: primero comprobar qué pasa con el cierre que hay, y
  #    después decidir cuál hace falta. Y el apartado b) exige razonar antes
  #    de calcular, que es lo que el examen suele puntuar aparte.
  - id: ejflu20-col713-la-maniobra-que-hay-que-disenar
    titulo: Comprobar el cierre que hay, y diseñar el que hace falta
    fuente: >-
      Ejercicio 7.13 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una conducción de $1200\ \text{m}$ de longitud y $400\ \text{mm}$ de
      diámetro se transporta un caudal de $200\ \text{l/s}$ de agua. Se conoce
      que la tubería de $12\ \text{mm}$ de espesor es de fundición, cuyo
      módulo de elasticidad es $10\cdot 10^{6}\ \text{N/cm}^{2}$.

      a) Si se cierra una válvula dispuesta en su extremo final en
      $2\ \text{s}$, determinar qué tipo de cierre es y calcular la
      sobrepresión producida por golpe de ariete.

      b) Si se quiere limitar la sobrepresión a $100\ \text{m.c.a.}$, ¿qué
      tipo de cierre será necesario? Justificarlo sin realizar ningún cálculo
      y, si es posible, determinar a continuación el tiempo que debe durar la
      maniobra de cierre de la válvula.

      Dato: $k_{\text{fundición}} = 1$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tipo de cierre y la sobrepresión, y el tiempo necesario para bajar a 100 mca.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) pide justificar **sin calcular** qué tipo de cierre
          hará falta para bajar de 177,9 a 100 mca. ¿Cuál es el argumento?
        opciones:
          - texto: >-
              Tiene que ser lento, porque la sobrepresión del cierre rápido es
              la máxima posible y ya está por encima de 100
            correcta: true
            mensaje: |
              Exacto, y ese es todo el razonamiento. Allievi da el techo; si
              el techo son 177,9 y el objetivo son 100, hay que bajar de él,
              y lo único que baja de él es alargar la maniobra.
          - texto: >-
              Tiene que ser rápido, porque cerrar antes deja menos tiempo para
              que suba la presión
            mensaje: |
              Es justo al revés, y es la intuición que hay que corregir. Cerrar
              deprisa **impide** que la onda reflejada alivie el golpe: el
              cierre rápido da la sobrepresión máxima, no la mínima.
          - texto: >-
              No se puede saber sin calcular la nueva celeridad
            mensaje: |
              La celeridad no cambia: depende de la tubería y del fluido, no
              de la maniobra. Lo único que se puede tocar es el tiempo.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: magnitud
          valor: '1096 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1228 m/s'
            mensaje: |
              Has usado $k = 0{,}5$, el del hierro y el acero. La fundición
              tiene $k = 1$: es más frágil y menos rígida, y la onda va algo
              más despacio.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$, que aquí aporta 33,3 frente
              a los 48,3 del agua. En una tubería metálica gruesa los dos
              términos son del mismo orden, y ninguno se puede despreciar.
        pista: |
          $D/e = 400/12$ y $k = 1$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 1\cdot\dfrac{400}{12}}}
          = \frac{9900}{\sqrt{81{,}63}} = 1096\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión del cierre en 2 s
        pregunta: |
          ¿Qué sobrepresión produce cerrar en $2\ \text{s}$?
        respuesta:
          tipo: magnitud
          valor: '178 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '195 mca'
            mensaje: |
              Has aplicado Micheaud. Comprueba el tiempo crítico:
              $2L/a = 2400/1096 = 2{,}19$ s, y el cierre dura 2. Es **rápido**
              —por poco— y por tanto va Allievi.
          - valor: '712 mca'
            mensaje: |
              La velocidad. Has usado el radio donde va el diámetro en el área:
              $A = \pi\,0{,}4^{2}/4 = 0{,}1257\ \text{m}^{2}$, y de ahí
              $v = 1{,}59$ m/s, no 6,37.
        pista: |
          Primero $2L/a$ y la comparación; después la fórmula que toque.
        desarrollo: |
          $$
          v = \frac{0{,}2}{\pi\,0{,}4^{2}/4} = 1{,}59\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{2400}{1096} = 2{,}19\ \text{s} > 2
          $$

          Cierre **rápido**, luego Allievi:

          $$
          \Delta H = \frac{a\,v}{g} = \frac{1096\cdot 1{,}59}{9{,}8}
          = 178\ \text{mca}
          $$

      - tipo: calcular
        titulo: El tiempo para bajar a 100 mca
        pregunta: |
          ¿Cuánto tiene que durar la maniobra para no pasar de
          $100\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '3.9 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '2.19 s'
            mensaje: |
              Ese es el tiempo crítico. Cerrar exactamente ahí sigue dando la
              sobrepresión de Allievi, 178 mca. Hay que pasarse holgadamente
              de él.
          - valor: '1.95 s'
            mensaje: |
              Te has dejado el 2 de Micheaud, y el resultado se delata solo:
              $1{,}95$ s es **menor** que el tiempo crítico de $2{,}19$, así
              que no puede ser el tiempo de un cierre lento.
        pista: |
          Micheaud despejando $T$, y después comprobar que sale mayor que
          $2L/a$.
        desarrollo: |
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{2400\cdot 1{,}59}{9{,}8\cdot 100}
          = 3{,}9\ \text{s}
          $$

          Comprobación: $3{,}9 > 2{,}19$. Es un cierre lento, la fórmula era
          la buena.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $a = 1096$ m/s el tiempo crítico es de 2,19 s, y el cierre
              de 2 s queda por debajo: es rápido, y la sobrepresión es la de
              Allievi, 178 mca.
          - texto: >-
              Para bajar a 100 mca hace falta un cierre lento, porque 178 es
              el máximo que la instalación puede dar y solo se baja de él
              alargando la maniobra.
          - texto: >-
              Micheaud da $T = 3{,}9$ s, que es mayor que el tiempo crítico:
              el resultado es coherente con la hipótesis de cierre lento.
          - texto: >-
              Bastaría con cerrar en 2,2 s, apenas dos décimas más, para
              quedar del lado lento y cumplir el límite.
            trampa: true
            mensaje: |
              Quedar del lado lento no basta: hay que quedar **suficientemente**
              lento. En $T = 2{,}2$ s Micheaud da 177,3 mca, prácticamente lo
              mismo que Allievi, porque justo en la frontera las dos fórmulas
              coinciden. La sobrepresión no cae de golpe al cruzar el tiempo
              crítico: baja como $1/T$ a partir de ahí, y para llegar a 100
              hacen falta 3,9 s.

    resolucion: |
      **a) El cierre que hay.** $v = 1{,}59$ m/s, $a = 1096$ m/s, tiempo
      crítico $2L/a = 2{,}19$ s. El cierre de 2 s queda **por debajo**: es
      rápido, y la sobrepresión es la máxima que la instalación puede dar,

      $$
      \Delta H = \frac{a\,v}{g} = 178\ \text{mca}
      $$

      Por dos décimas de segundo. Si la maniobra hubiera durado 2,2 s el
      cierre sería lento… y la sobrepresión, 177,3 mca: prácticamente la
      misma. **En la frontera las dos fórmulas dan el mismo valor**, y de
      hecho tienen que darlo: sustituyendo $T = 2L/a$ en Micheaud sale
      exactamente Allievi. La frontera no es un salto, es un empalme.

      **b) El razonamiento antes del cálculo.** Allievi es el techo. Si el
      techo son 178 mca y el objetivo son 100, hay que bajar de él, y lo único
      que baja de él es alargar el cierre: **tiene que ser lento**. Eso se
      responde sin tocar la calculadora, y el enunciado lo pide así a
      propósito.

      Y entonces sí, Micheaud:

      $$
      T = \frac{2Lv}{g\,\Delta H} = 3{,}9\ \text{s}
      $$

      con la comprobación obligatoria: $3{,}9 > 2{,}19$, coherente.

      **La estructura que se repite en todo el capítulo.** Calcular $a$,
      calcular $2L/a$, comparar, elegir fórmula, y **comprobar al final que
      el resultado no contradice la elección**. Los ejercicios 7.5 y 7.6 son
      la misma secuencia; el 7.6 existe precisamente para enseñar qué hacer
      cuando la comprobación falla.
