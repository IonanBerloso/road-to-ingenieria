      </figure>
    pide: La sobrepresión del golpe, la tensión que produce en el acero y hasta dónde puede bajar la presión al otro lado de la válvula.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cuando la válvula se cierra al volver el agua, ¿qué columna de agua
          es la que se frena y genera el golpe?
        opciones:
          - texto: Los 2000 m de la tubería 2, que es por donde vuelve el agua desde B
            correcta: true
            mensaje: |
              Eso es. El agua retorna de B hacia A, así que la que llega a la
              válvula y se detiene es la de la tubería 2. Los 100 m de la 1
              están al otro lado de la válvula y no participan en la
              sobrepresión.
          - texto: Los 100 m de la tubería 1, que es la que está aguas abajo de la válvula
            mensaje: |
              «Aguas abajo» en el retorno es hacia A, sí, pero ahí el agua se
              **aleja** de la válvula: no se frena contra ella, se separa. Lo
              que golpea es la columna que empuja desde B.
          - texto: Los 2100 m de las dos juntas, porque la tubería es continua
            mensaje: |
              La válvula corta la tubería en dos. Lo que hay a un lado se
              detiene contra ella —y genera sobrepresión— y lo que hay al otro
              se separa, generando depresión. Son dos fenómenos distintos, y de
              eso va el apartado c).

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          Sobrepresión del golpe de ariete, en mca, con un cierre de 5 s.
        respuesta:
          tipo: magnitud
          valor: '355 mca'
          tolerancia: 0.01
          formato: una presión con su unidad (mca, kPa o bar)
        distractores:
          - valor: '422 mca'
            mensaje: |
              Has usado Allievi. El tiempo de ida y vuelta de la onda es
              $2L/a = 4{,}21$ s y el cierre dura 5: es cierre **lento**, así
              que la onda de descarga vuelve antes de terminar y la
              sobrepresión no llega al valor de Allievi. Va por poco, pero va.
          - valor: '17.8 mca'
            mensaje: |
              Has usado los 100 m de la tubería 1. La que golpea es la 2, de
              2000 m.
          - valor: '178 mca'
            mensaje: |
              Te has dejado el 2 de Micheaud. La onda recorre la tubería dos
              veces.
        pista: |
          Primero $a$ con la fórmula tabulada, después se compara $2L/a$ con
          los 5 s de cierre y solo entonces se elige la fórmula.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 600/5}} = \frac{9900}{\sqrt{108{,}3}} = 951{,}3\ \text{m/s}
          $$

          $$
          v = \frac{1{,}23}{\pi\,0{,}6^{2}/4} = 4{,}35\ \text{m/s} \qquad \frac{2L}{a} = \frac{4000}{951{,}3} = 4{,}21\ \text{s}
          $$

          El cierre dura 5 s, más que 4,21: **cierre lento**, y por tanto
          Micheaud.

          $$
          \Delta H = \frac{2Lv}{g\,t} = \frac{2\cdot 2000\cdot 4{,}35}{9{,}8\cdot 5} = 355{,}1\ \text{mca}
          $$

          El margen es estrecho —5 contra 4,21 s— y conviene verlo: si la
          válvula cerrara medio segundo antes, la fórmula ya no sería esta.

      - tipo: calcular
        titulo: La tensión en el acero
        pregunta: |
          Tensión de tracción en la pared de la tubería, en kg/cm², producida
          por esa sobrepresión.
        respuesta:
          tipo: magnitud
          valor: '2131 kg/cm2'
          tolerancia: 0.01
          formato: una tensión con su unidad (kg/cm², MPa o Pa)
        distractores:
          - valor: '4261 kg/cm2'
            mensaje: |
              Te has dejado el 2 del denominador. La pared trabaja por sus
              **dos** lados: $\sigma = pD/(2e)$.
          - valor: '213 kg/cm2'
            mensaje: |
              Un factor de diez. Conviene rehacer la conversión: 355 mca son
              3480 kPa, y $pD/(2e) = 3{,}48\cdot 10^{6}\cdot 60 = 209$ MPa.
        pista: |
          De la ayuda, $e = pD/(2\sigma)$, así que
          $\sigma = pD/(2e)$.
        desarrollo: |
          $$
          p = 355{,}1\cdot 9800 = 3{,}48\ \text{MPa}
          $$

          $$
          \sigma = \frac{p\,D}{2e} = \frac{3{,}48\cdot 10^{6}\cdot 0{,}6}{2\cdot 0{,}005} = 209\ \text{MPa} = 2131\ \text{kg/cm}^{2}
          $$

          Frente a los 2600 admisibles: **aguanta**, con un 18 % de margen. Y
          si se le suman los 44 m de columna estática que hay entre B y la
          válvula, la tensión sube a 2395 kg/cm² y sigue aguantando, ya con
          solo un 8 %.

      - tipo: justificar
        pregunta: Ordena qué pasa al otro lado de la válvula. Una pieza es falsa.
        piezas:
          - texto: 'La válvula parte la tubería en dos: en la tubería 2 el agua se detiene contra ella y la presión sube.'
          - texto: 'En la tubería 1, en cambio, el agua que ya había pasado sigue alejándose y deja un hueco detrás.'
          - texto: 'Ese hueco solo se puede llenar bajando la presión, y la presión absoluta no puede ser negativa.'
          - texto: 'Así que el límite es el cero absoluto, o sea una presión manométrica de menos una atmósfera, y en la práctica se llega antes a la tensión de vapor y el agua cavita.'
          - texto: La depresión aguas abajo es del mismo valor que la sobrepresión aguas arriba, 355 mca por debajo de la atmosférica.
            trampa: true
            mensaje: |
              La simetría del golpe de ariete se rompe justo aquí. Hacia arriba
              la presión puede subir lo que haga falta, pero hacia abajo hay un
              **suelo físico**: cero absoluto. Una depresión de 355 mca
              significaría una presión absoluta de menos 345 mca, que no
              existe.
    resolucion: |
      ## Una válvula que resuelve un problema y crea otro

      El planteamiento es honesto: sin válvula de retención, cada corte de luz
      vacía el depósito B por gravedad. Con ella, el vaciado se evita. Pero
      parar dos kilómetros de agua en marcha tiene un precio, y el problema
      consiste en ponerle número.

      ## a) Rápido o lento, esa es la primera pregunta

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 120}} = 951{,}3\ \text{m/s} \qquad v = 4{,}35\ \text{m/s}
      $$

      El tiempo de ida y vuelta de la onda es $2L/a = 4{,}21$ s y el cierre
      dura 5. Por **ocho décimas de segundo**, el cierre es lento y vale
      Micheaud:

      $$
      \Delta H = \frac{2\cdot 2000\cdot 4{,}35}{9{,}8\cdot 5} = 355{,}1\ \text{mca}
      $$

      Con Allievi habrían salido 422. La diferencia entre las dos, 67 mca, la
      decide un margen de 0,8 s en el cierre de una clapeta que nadie controla:
      es exactamente el tipo de dato que conviene mirar dos veces.

      ## b) Lo que aguanta el tubo

      $$
      \sigma = \frac{p\,D}{2e} = \frac{3{,}48\cdot 10^{6}\cdot 0{,}6}{0{,}01} = 209\ \text{MPa} = 2131\ \text{kg/cm}^{2}
      $$

      Contra los 2600 admisibles, **aguanta**. Y aguanta también si se cuenta
      la columna estática: entre B (cota 50) y la válvula (cota 6) hay 44 m,
      que suben la tensión a 2395 kg/cm². El margen pasa del 18 % al 8 %, así
      que la respuesta no cambia pero la holgura sí.

      Merece la pena ver de dónde sale ese 209 MPa: la relación $D/2e$ vale
      **60**. Una tubería de pared delgada multiplica por sesenta la presión
      que lleva dentro, y por eso el espesor es lo primero que se calcula.

      ## c) Y el otro lado, que es donde está la trampa

      La válvula parte la tubería en dos y les hace cosas opuestas. Aguas
      arriba —la tubería 2— el agua se detiene contra ella y la presión sube.
      Aguas abajo —hacia A— el agua que ya había pasado sigue su camino y deja
      un hueco.

      Ese hueco solo se puede llenar bajando la presión, y ahí aparece el
      límite que no tiene la sobrepresión: **la presión absoluta no puede ser
      negativa**. El mínimo teórico es el cero absoluto, o sea

      $$
      p_{min} = -p_{atm}
      $$

      en manométrica. Y en la práctica ni siquiera eso: al llegar a la tensión
      de vapor —unos 0,24 mca a 20 °C— el agua hierve, se forma una bolsa de
      vapor y la columna se separa. Cuando esa bolsa colapsa, el agua vuelve a
      juntarse de golpe y produce **otro** golpe de ariete, esta vez sin
      ninguna válvula que lo module.

      Esa asimetría es la idea que hay que llevarse: el golpe de ariete sube
      todo lo que haga falta y baja solo hasta cero. Por eso las depresiones
      dan menos números y más problemas.

  - id: ejflu20-col715-el-canal-de-montana-y-la-valvula-automatica
    titulo: El canal de montaña, y la válvula que se quiere automática
    fuente: Ejercicio 7.15 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Al diseñar la instalación de montaña que se muestra en la figura, el
      embalse A y el depósito B se unirán mediante un canal, cuya tipología se
      muestra en la figura. El canal es de madera sin cepillar y la pendiente
      es de 1,5 milésimas. Como hay una gran variación de caudal entre el
      invierno y el verano se quiere lograr que en verano el nivel del agua no
      supere el 45 % del diámetro.

      **a)** Si el caudal medio en verano es de 440 l/s, calcula el nivel de
      agua h y la velocidad de flujo vc. Los diámetros comerciales aumentan
      cada 10 cm.

