        inyector. En un punto de la tuberia se levanta una chimenea de
        equilibrio, un tubo vertical abierto por arriba que, al cerrar el
        inyector, recoge el agua que no cabe y acorta la longitud que sufre el
        golpe de ariete.</desc>
