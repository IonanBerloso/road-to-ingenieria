    pide: El nivel y la velocidad en el canal en verano, el espesor comercial de la tubería y si conviene cerrar la válvula en diez segundos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con 440 l/s en verano, ¿qué parte de la sección lleva el agua, y
          respecto de qué se mide el 45 %?
        opciones:
          - texto: Solo la media caña del fondo, y el 45 % es de su diámetro D
            correcta: true
            mensaje: |
              Eso es. El cajón ancho está ahí para las crecidas del invierno; el
              caudal pequeño del verano se queda en la media caña, y ahí la
              sección es la de un conducto circular parcialmente lleno.
          - texto: El cajón entero, y el 45 % es de su altura 2D
            mensaje: |
              Con 440 l/s en un cajón de nueve metros de ancho el calado sería
              de centímetros: por eso está la media caña. Y el enunciado dice
              «del diámetro», que es el de la media caña — el cajón no tiene
              diámetro.
          - texto: La media caña, pero el 45 % se mide sobre el radio
            mensaje: |
              Dice diámetro. La diferencia no es de matiz: sobre el radio, el
              tope sería la mitad y ningún diámetro comercial daría el caudal.
          - texto: Media caña y cajón a la vez, sumando las dos áreas
            mensaje: |
              Solo si el agua rebasara la solera plana, y precisamente lo que
              se está imponiendo es que en verano no llegue.

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          Diámetro D de la media caña, en metros, sabiendo que los comerciales
          van de 10 en 10 cm.
        respuesta:
          tipo: magnitud
          valor: '1.1 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m o cm)
        distractores:
          - valor: '1.05 m'
            mensaje: |
              Ese es el diámetro exacto que deja el agua justo en el 45 %, pero
              no es comercial. Los comerciales van de 10 en 10 cm, así que hay
              que subir al siguiente.
          - valor: '1 m'
            mensaje: |
              Con un metro el agua sube al 48,5 % del diámetro, por encima del
              tope. Comprueba el calado antes de quedarte con el diámetro.
          - valor: '1.2 m'
            mensaje: |
              Ese cumple, pero no es el que pide el enunciado. Se busca el
              **menor** diámetro comercial que respete el 45 %, no cualquiera
              que lo respete.
        pista: |
          Manning en sección circular parcialmente llena, con n de madera sin
          cepillar. Se prueba diámetro a diámetro y se mira el cociente h/D.
        desarrollo: |
          Madera sin cepillar, cuadro nº 26: $n = 0{,}013$. La pendiente es
          $I = 0{,}0015$.

          Para cada diámetro se resuelve el calado que da 440 l/s y se mira
          si $h/D$ pasa del 45 %:

          | D | h | h/D |
          |---|---|---|
          | 1,00 m | 48,5 cm | 48,5 % — se pasa |
          | 1,10 m | 46,2 cm | 42,0 % — vale |
          | 1,20 m | 44,4 cm | 37,0 % — vale, pero sobra |

          El menor que cumple es **D = 1,10 m**. El diámetro exacto que dejaría
          el agua justo en el 45 % es 1,05 m, y como no es comercial hay que
          redondear hacia arriba, no hacia abajo.

      - tipo: calcular
        titulo: El nivel de verano
        pregunta: |
          Nivel de agua h dentro de la media caña, en centímetros.
        respuesta:
          tipo: magnitud
          valor: '46.3 cm'
          tolerancia: 0.02
          formato: una longitud con su unidad (cm o m)
        distractores:
          - valor: '48.5 cm'
            mensaje: |
              Ese es el calado con D = 1,00 m, el diámetro que se descarta
              precisamente porque deja el agua por encima del 45 %.
          - valor: '44.4 cm'
            mensaje: |
              Ese es el calado con D = 1,20 m. Cumple, pero el diámetro elegido
              es el menor que cumple, no el siguiente.
          - valor: '49.5 cm'
            mensaje: |
              Eso es el 45 % de 1,10 m, o sea el **tope**, no el nivel. El
              caudal no llega hasta el tope: se queda más de tres centímetros
              por debajo, y ese margen es lo que se gana al subir de 1,05 a
              1,10.
        pista: |
          Con D ya elegido, la incógnita es el ángulo mojado. Se puede resolver
          por tanteo con Manning o entrar en el cuadro nº 27 con el cociente
          entre el caudal y el de sección llena.
        desarrollo: |
          A sección llena, con D = 1,10 m,

          $$
          Q_{ll} = \frac{1}{n}\,A\,R_h^{2/3}\sqrt{I} = \frac{1}{0{,}013}\cdot 0{,}9503\cdot 0{,}275^{2/3}\cdot\sqrt{0{,}0015} = 1{,}197\ \text{m}^3/\text{s}
          $$

          El cociente es $Q_c/Q_{ll} = 0{,}440/1{,}197 = 0{,}368$, y con él el
          cuadro nº 27 da $h/D \approx 0{,}42$, es decir

          $$
          h = 0{,}42\cdot 1{,}10 = 0{,}462\ \text{m}
          $$

          Son 46,2 cm, y el boletín publica 46,3. Resolviendo Manning
          directamente por tanteo salen 46,1 cm: la misma respuesta con la
          precisión que el cuadro permite leer.

      - tipo: calcular
        titulo: La velocidad en el canal
        pregunta: |
          Velocidad del flujo en el canal en verano, en m/s.
        respuesta:
          tipo: magnitud
          valor: '1.17 m/s'
          tolerancia: 0.02
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '1.26 m/s'
            mensaje: |
              Esa es la velocidad a sección llena. Con la media caña a menos de
              la mitad el radio hidráulico es menor, y la velocidad también.
          - valor: '0.926 m/s'
            mensaje: |
              Has dividido entre el área de la media caña **llena**. El agua no
              llena la media caña: llega al 42 % del diámetro.
        pista: |
          Con h y D conocidos sale el área del segmento circular, y la
          velocidad es el caudal partido por ella.
        desarrollo: |
          Con $D = 1{,}10$ m y $h = 46{,}2$ cm, el ángulo mojado vale

          $$
          \theta = 2\arccos\!\left(1 - \frac{2h}{D}\right) = 2{,}818\ \text{rad}
          $$

          $$
          A = \frac{r^{2}}{2}(\theta - \operatorname{sen}\theta) = 0{,}3782\ \text{m}^{2} \qquad v_c = \frac{0{,}440}{0{,}3782} = 1{,}16\ \text{m/s}
          $$

          El boletín publica 1,17, que es lo que sale entrando por el cuadro
          nº 27 en vez de resolviendo Manning a mano. La diferencia es de un
          uno por ciento y las dos lecturas son la misma respuesta.

          Y conviene fijarse en el orden de magnitud: la velocidad a sección
          llena sería 1,26 m/s, apenas un 8 % más. En un conducto circular la
          velocidad es casi plana entre el 40 % y el 100 % de llenado, y por eso
          el criterio de diseño se pone sobre el calado y no sobre ella.

      - tipo: calcular
        titulo: El espesor de la tubería
        pregunta: |
          Espesor comercial de la tubería de acero, en milímetros, con el
          cierre manual de 25 segundos.
        respuesta:
          tipo: magnitud
          valor: '14 mm'
          tolerancia: 0.02
          formato: una longitud con su unidad (mm)
        distractores:
          - valor: '12 mm'
            mensaje: |
              El cálculo da 12,07 mm, y esas siete centésimas lo deciden todo:
              12 mm **no llega**, así que hay que subir al siguiente múltiplo
              de 2. Un espesor se redondea siempre hacia arriba.
          - valor: '10.9 mm'
            mensaje: |
              Has usado solo la presión estática. Falta la sobrepresión del
              golpe, que son 158 mca más.
          - valor: '8.7 mm'
            mensaje: |
              Ese es el $pD/2\sigma$ pelado, sin el milímetro de corrosión ni
              el margen de fabricación de 1,25. Los dos están en la ayuda y los
              dos suman.
        pista: |
          La presión en la válvula es la estática más la del golpe. Antes de
          elegir fórmula de golpe hay que comparar el tiempo de cierre con el
          de ida y vuelta de la onda.
        desarrollo: |
          **La longitud y la velocidad.** Entre B y C hay 1300 m de desnivel al
          18 %, así que

          $$
          L = \frac{1300}{0{,}18} = 7222\ \text{m} \qquad v = \frac{0{,}390}{\pi\,0{,}43^{2}/4} = 2{,}686\ \text{m/s}
          $$

          **Qué fórmula.** Con un espesor del orden de 14 mm la celeridad es
          $a = 9900/\sqrt{48{,}3 + 0{,}5\cdot 430/14} = 1241$ m/s, y el viaje de
          ida y vuelta dura $2L/a = 11{,}6$ s. El cierre manual dura 25 s, mucho
          más: **cierre lento**, y por tanto Micheaud.

          $$
          \Delta H = \frac{2Lv}{g\,t} = \frac{2\cdot 7222\cdot 2{,}686}{9{,}8\cdot 25} = 158{,}3\ \text{mca}
          $$

          **La presión en la válvula.** A los 1300 mca estáticos se le suman
          esos 158,3, es decir 1458,3 mca, o sea 14,29 MPa.

          $$
          e = \left(\frac{14{,}29\cdot 10^{6}\cdot 0{,}43}{2\cdot 355\cdot 10^{6}} + 0{,}001\right)1{,}25 = 12{,}07\ \text{mm}
          $$

          Múltiplos de 2 mm: **14 mm**. Y el bucle cierra — con 14 mm la
          celeridad es la que se supuso, así que el cierre sigue siendo lento y
          el cálculo se sostiene.

      - tipo: justificar
        pregunta: Ordena la respuesta al cliente sobre el cierre en 10 s. Una pieza es falsa.
        piezas:
          - texto: 'Con el espesor ya elegido, e = 14 mm, la celeridad es 1241 m/s y la onda tarda 2L/a = 11,6 s en ir y volver.'
          - texto: 'Cerrar en 10 s es menos que esos 11,6 s, así que el cierre deja de ser lento y pasa a ser rápido: manda Allievi.'
          - texto: 'La sobrepresión sube de 158 a 340 mca, más del doble, y la presión en la válvula pasa de 1458 a 1640 mca.'
          - texto: 'Con esa presión, Barlow pide 13,4 mm, y la tubería de 14 mm que ya se había elegido los tiene: el cambio es aceptable.'
          - texto: 'Cerrando en 10 s en vez de 25, Micheaud da 396 mca, y ese es el valor que hay que llevar a Barlow.'
            trampa: true
            mensaje: |
              Micheaud ya no vale. Su hipótesis es que la onda de descarga
              vuelve **antes** de que la válvula termine de cerrar, y con 10 s
              no vuelve. Aplicada fuera de su rango da 396 mca, un 16 % por
              encima de la verdad. Aquí, por suerte, el espesor comercial sale
              igual —13,8 mm redondea también a 14—, pero el margen que informa
              es falso, 0,2 mm en vez de 0,6, y con la tubería un poco más
              larga la conclusión se habría dado la vuelta por una fórmula
              usada donde no toca.
    resolucion: |
      ## Tres problemas encadenados por una decisión

      Este ejercicio pone un canal, una tubería y un golpe de ariete en el mismo
      enunciado, y lo interesante es que no son tres problemas sueltos: el
      espesor que se calcula al final depende de un diámetro que se elige al
      principio.

      ## a) Un canal con dos regímenes

      La sección no es caprichosa. Un cajón de nueve metros de ancho es lo que
      hace falta para las crecidas del invierno, pero con 440 l/s el agua
      formaría una lámina de centímetros repartida por toda la solera: mucha
      superficie mojada, poco radio hidráulico, velocidad baja y sedimentos
      depositándose. La media caña del fondo concentra el caudal pequeño en una
      sección circular y le devuelve la velocidad.

      Así que el problema del verano es un conducto circular parcialmente
      lleno. Con $n = 0{,}013$ e $I = 0{,}0015$, se tantea:

      | D | h | h/D | vc |
      |---|---|---|---|
      | 1,00 m | 48,5 cm | 48,5 % | 1,17 m/s |
      | **1,10 m** | **46,3 cm** | **42,0 %** | **1,17 m/s** |
      | 1,20 m | 44,4 cm | 37,0 % | 1,16 m/s |

      El primero que cumple el 45 % es **D = 1,10 m**, con **h = 46,3 cm** y
      **vc = 1,17 m/s**.

      Fíjate en la última columna: la velocidad es la misma en los tres. En un
      conducto circular la velocidad apenas se mueve entre el 40 % y el 100 %
      de llenado, porque el radio hidráulico crece muy poco. Por eso el
      criterio de diseño se pone sobre el calado y no sobre la velocidad — la
      velocidad no distingue.

      ## b) El espesor, y por qué 12 no vale

      Los 1300 m de desnivel entre B y C son la clave del problema. La presión
      estática en la válvula son ya 1300 mca, es decir 127 bar, y el
      golpe de ariete solo añade un 12 % más:

      $$
      L = \frac{1300}{0{,}18} = 7222\ \text{m} \qquad v = 2{,}686\ \text{m/s} \qquad \Delta H = \frac{2Lv}{9{,}8\cdot 25} = 158{,}3\ \text{mca}
      $$

      Con 1458,3 mca en la válvula, Barlow da 12,07 mm. Y ahí está la gracia del
      apartado: los espesores comerciales son múltiplos de 2 mm, así que el
      candidato natural sería 12… y **no llega por siete centésimas de
      milímetro**. Hay que ir a 14.

      Un espesor se redondea siempre hacia arriba, sin discutirlo, porque hacia
      abajo el que paga es el tubo. Y conviene ver de dónde salen los tres
      términos de la fórmula: $pD/2\sigma$ son 8,7 mm de resistencia pura, el
      milímetro de corrosión es lo que se va a comer el óxido en la vida de la
      instalación, y el 1,25 es lo que la fábrica no garantiza. Quitando los
      dos últimos saldría 8,7 mm, un 28 % menos, y ese es exactamente el tipo
      de recorte que hace que una tubería reviente a los quince años.

      ## c) La respuesta al cliente, con valores

      El cliente quiere cerrar en 10 s y no acepta opiniones. Se le dan
      números.

      Con el espesor de 14 mm, la celeridad de la onda es

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 430/14}} = 1241\ \text{m/s} \qquad \frac{2L}{a} = 11{,}6\ \text{s}
      $$

      Diez segundos es **menos** que 11,6, así que el cierre pasa de lento a
      rápido y cambia la fórmula: ya no vale Micheaud, manda Allievi.

      $$
      \Delta H = \frac{a\,v}{g} = \frac{1241\cdot 2{,}686}{9{,}8} = 340\ \text{mca}
      $$

      La sobrepresión se dobla. Pero la presión total en la válvula pasa de
      1458 a 1640 mca, que es solo un 12 % más, porque los 1300 estáticos
      dominan. Y Barlow con esa presión pide 13,4 mm.

      **La tubería de 14 mm ya los tiene.** El cambio es aceptable, y no porque
      la sobrepresión sea pequeña —se ha doblado— sino porque el redondeo al
      múltiplo de 2 mm había dejado 1,9 mm de margen sin querer. Esa es la
      respuesta honesta al cliente: se puede hacer, y se puede hacer **con la
      tubería que ya estaba proyectada**, no porque el golpe dé igual.

      Y una advertencia sobre el método. Si alguien aplica Micheaud a los 10 s
      por inercia obtiene 396 mca y un espesor necesario de 13,8 mm: redondea
      igual a 14 y llega a la misma conclusión, así que el error **no se ve en
      el resultado**. Pero el margen que informa es 0,2 mm en vez de 0,6, y
      basta con que la tubería fuera algo más larga para que ese 16 % de
      sobrepresión inventada le hiciera decir que no a un cambio que sí se
      puede hacer. Un acierto por casualidad no es un acierto.
