        <line x1="390" y1="36" x2="390" y2="68" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="265" y="32" text-anchor="middle" font-size="11" fill="var(--faint)">x</text>
        <text x="250" y="196" text-anchor="middle" font-size="10.5" fill="var(--faint)">L = 10 km · D = 630 mm · e = 10 mm</text>
      </svg>
      <figcaption>Diez kilómetros de tubería forzada entre el embalse y la central. La chimenea de equilibrio es un tubo abierto por arriba que se levanta en un punto del recorrido; lo que se pide es a qué distancia del embalse ponerla.</figcaption>
      </figure>
    pide: El tiempo de cierre sin chimenea, la distancia a la que instalarla y la velocidad del sonido en el agua.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para limitar la sobrepresión a 40 mca hay dos fórmulas. ¿Cuál se usa
          y por qué?
        opciones:
          - texto: La de Micheaud, porque el cierre va a resultar mucho más lento que el tiempo de ida y vuelta de la onda
            correcta: true
            mensaje: |
              Eso es. La onda tarda $2L/a = 18{,}5$ s en ir y volver; si el
              cierre dura más que eso, la onda de descarga llega antes de
              terminar y la sobrepresión no alcanza el valor de Allievi. Aquí
              el cierre sale de 205 s, así que Micheaud es la buena — y hay que
              comprobarlo después, no antes.
          - texto: La de Allievi, porque es la que da la sobrepresión máxima y hay que ir del lado seguro
            mensaje: |
              Allievi con estos datos da $av/g = 443$ mca, once veces el límite,
              y **no depende del tiempo de cierre**: con ella el apartado a) no
              tendría solución. Allievi describe el cierre rápido, no el lento.
          - texto: Las dos dan lo mismo, porque en la frontera coinciden
            mensaje: |
              Coinciden **solo** en la frontera $T = 2L/a$. Para tiempos
              mayores Micheaud da menos y para menores no vale: por eso hay que
              decidir en cuál de los dos lados se está.

      - tipo: calcular
        titulo: El tiempo de cierre
        pregunta: |
          Tiempo de cierre del inyector, en minutos, para que la sobrepresión
          no pase de 40 mca sin chimenea.
        respuesta:
          tipo: magnitud
          valor: '3.41 min'
          tolerancia: 0.01
          formato: un tiempo con su unidad (min o s)
        distractores:
          - valor: '1.71 min'
            mensaje: |
              Te has dejado el 2 de Micheaud. La onda recorre la tubería
              **dos** veces —ida y vuelta—, y por eso la fórmula lleva $2L$.
          - valor: '0.31 min'
            mensaje: |
              Eso es $2L/a = 18{,}5$ s, el tiempo que tarda la onda en ir y
              volver. Es la **frontera** entre cierre rápido y lento, no la
              respuesta: cerrar en ese tiempo daría los 443 mca de Allievi.
        pista: |
          $\Delta H = 2Lv/(g\,T)$, con $v = Q/A$. Y después hay que comprobar
          que el T obtenido es mayor que $2L/a$.
        desarrollo: |
          $$
          v = \frac{1{,}25}{\pi\,0{,}63^{2}/4} = 4{,}01\ \text{m/s}
          $$

          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{2\cdot 10\,000\cdot 4{,}01}{9{,}8\cdot 40} = 204{,}6\ \text{s} = 3{,}41\ \text{min}
          $$

          Y la comprobación, que es la parte que el enunciado pide razonar:
          $2L/a = 18{,}5$ s, muy por debajo de los 204,6. El cierre es lento y
          Micheaud vale.

      - tipo: calcular
        titulo: Dónde poner la chimenea
        pregunta: |
          Distancia desde el embalse a la que hay que instalar la chimenea de
          equilibrio para poder cerrar en 30 s sin pasar de 40 mca.
        respuesta:
          tipo: magnitud
          valor: '8534 m'
          tolerancia: 0.01
          formato: una distancia con su unidad (m o km)
        distractores:
          - valor: '1466 m'
            mensaje: |
              Esa es la longitud que queda **entre la chimenea y la turbina**,
              que es la que sufre el golpe. La pregunta es la distancia desde
              el embalse: $10\,000 - 1466$.
          - valor: '5000 m'
            mensaje: |
              La mitad no sale de ningún cálculo. La longitud que puede
              soportar el golpe con 30 s de cierre es la que despeja Micheaud:
              1466 m.
        pista: |
          La chimenea corta el golpe de ariete: solo sufre el tramo que va de
          ella a la turbina. Se despeja esa longitud de Micheaud con T = 30 s.
        desarrollo: |
          La chimenea es un tubo abierto por arriba: cuando la onda llega a
          ella, la sobrepresión se descarga subiendo el nivel, y aguas arriba
          la tubería ya no se entera. Así que la longitud que interviene en el
          golpe es la que va **de la chimenea a la turbina**:

          $$
          L' = \frac{g\,\Delta H\,T}{2v} = \frac{9{,}8\cdot 40\cdot 30}{2\cdot 4{,}01} = 1466\ \text{m}
          $$

          $$
          x = 10\,000 - 1466 = 8534\ \text{m desde el embalse}
          $$

          Y se comprueba otra vez el régimen: $2L'/a = 2{,}7$ s, muy por debajo
          de los 30 s de cierre. Sigue siendo cierre lento.

      - tipo: calcular
        titulo: La velocidad del sonido en el agua
        pregunta: |
          Velocidad del sonido en el seno del fluido.
        respuesta:
          tipo: magnitud
          valor: '1449 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '1082 m/s'
            mensaje: |
              Esa es la **celeridad de la onda en la tubería**, que es menor
              porque el tubo se deforma y absorbe parte del golpe. La pregunta
              es por el sonido en el fluido, o sea el numerador de la fórmula
              solo.
          - valor: '938 m/s'
            mensaje: |
              Esa es la celeridad por la fórmula tabulada de Allievi con
              k = 1 para fundición. Aquí el enunciado da el módulo de
              elasticidad, así que toca la forma general, y además lo que se
              pregunta es el sonido en el agua.
        pista: |
          En el numerador de la ayuda está el sonido en el fluido; el
          denominador es la corrección por la elasticidad del tubo.
        desarrollo: |
          $$
          c = \sqrt{\frac{K}{\rho}} = \sqrt{\frac{2{,}1\cdot 10^{9}}{1000}} = 1449{,}1\ \text{m/s}
          $$

          Y con el tubo, la celeridad de la onda baja a

          $$
          a = \frac{1449{,}1}{\sqrt{1 + (K/E)(D/e)}} = \frac{1449{,}1}{1{,}339} = 1082\ \text{m/s}
          $$

          Un 25 % menos. Esa diferencia es toda la fundición flexándose.

      - tipo: justificar
        pregunta: Ordena qué hace la chimenea de equilibrio. Una pieza es falsa.
        piezas:
          - texto: 'Sin chimenea, cerrar en 30 s daría una sobrepresión de 273 mca: casi siete veces el límite.'
          - texto: 'La chimenea es un tubo abierto por arriba, así que cuando la onda de presión llega a ella el agua sube y la sobrepresión se descarga a la atmósfera.'
          - texto: 'De la chimenea hacia el embalse, la tubería ya no sufre el golpe: la longitud que interviene pasa de 10 000 a 1466 m.'
          - texto: 'Y como la sobrepresión de Micheaud es proporcional a esa longitud, dividirla por siete divide la sobrepresión por siete.'
          - texto: La chimenea permite además cerrar más deprisa de los 2L/a de la tubería entera, porque el agua ya no tiene que frenarse.
            trampa: true
            mensaje: |
              El agua sigue teniendo que frenarse: la chimenea no la detiene,
              la desvía. Lo que cambia es **cuánta columna de agua** participa
              en el frenado, y por eso la frontera de cierre rápido pasa de
              18,5 a 2,7 s. Frenar sigue costando lo mismo por metro de
              tubería.
    resolucion: |
      ## La primera decisión no es una fórmula, es cuál de las dos

      El enunciado da las dos y pide razonar. La diferencia está en el tiempo
      que tarda la onda en ir hasta el embalse y volver:

      $$
      \frac{2L}{a} = \frac{20\,000}{1082} = 18{,}5\ \text{s}
      $$

      Si el inyector se cierra **más deprisa** que eso, la onda de descarga no
      ha vuelto todavía cuando el cierre termina, y la sobrepresión llega al
      máximo de Allievi, $av/g = 443$ mca. Si se cierra **más despacio**, la
      onda vuelve a tiempo y frena la subida: es Micheaud, y entonces la
      sobrepresión depende del tiempo.

      Como se quieren 40 mca y Allievi daría 443, el cierre tiene que ser
      lento a la fuerza. Se usa Micheaud, se calcula T y **después se
      comprueba** que efectivamente sale mayor que 18,5 s.

      ## a) El tiempo, y por qué es inaceptable

      $$
      T = \frac{2Lv}{g\,\Delta H} = \frac{2\cdot 10\,000\cdot 4{,}01}{9{,}8\cdot 40} = 204{,}6\ \text{s} = 3{,}41\ \text{min}
      $$

      Tres minutos y medio para cerrar un inyector. Una central tiene que poder
      responder a un disparo de la red en segundos, así que el número es
      correcto y a la vez inservible: de ahí el apartado b).

      ## b) La chimenea, y qué es lo que acorta

      Una chimenea de equilibrio es un tubo vertical abierto por arriba. Cuando
      la onda de presión llega a ella, el agua sube por el tubo en vez de
      comprimirse, y la sobrepresión se descarga contra la atmósfera. **Aguas
      arriba de la chimenea, la tubería no se entera del golpe.**

      Así que en Micheaud ya no entra L sino la longitud que queda entre la
      chimenea y la turbina:

      $$
      L' = \frac{g\,\Delta H\,T}{2v} = \frac{9{,}8\cdot 40\cdot 30}{2\cdot 4{,}01} = 1466\ \text{m} \;\Longrightarrow\; x = 8534\ \text{m}
      $$

      Es decir, la chimenea va **muy cerca de la central**: a 8,5 km del
      embalse, en el último 15 % del recorrido. Tiene sentido, porque lo que
      hay que proteger es el tramo corto que queda por debajo.

      ## c) Dos velocidades que no son la misma

      Aquí está el detalle que el enunciado quiere separar:

      | | valor |
      |---|---|
      | sonido en el agua, $\sqrt{K/\rho}$ | **1449 m/s** |
      | celeridad de la onda en la tubería, $a$ | 1082 m/s |

      La onda de presión viaja **más despacio que el sonido en el agua** porque
      la tubería se deforma: parte de la energía que debería ir en comprimir el
      líquido se va en dilatar el tubo. Con una tubería infinitamente rígida
      las dos coincidirían.

      Y ese 25 % de diferencia no es un detalle académico: es exactamente lo
      que separa la frontera de cierre rápido en 18,5 s de los 13,8 que saldrían
      con la tubería rígida.

  - id: ejflu20-col717-la-valvula-de-retencion-que-recibe-el-golpe
    titulo: La válvula de retención que recibe el golpe
    fuente: Ejercicio 7.17 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La instalación de bombeo de la figura está ubicada en una zona donde el
      corte en el suministro eléctrico sin previo aviso es frecuente. Cuando
      ocurre esto la bomba se para y el agua retorna por gravedad desde el
      depósito B al A, vaciándose el depósito B.

      Para evitar el vaciado del depósito B, se ha decidido instalar una
      válvula de retención aguas abajo de la bomba, de clapeta. Cuando se
      bombea agua la válvula está abierta, pero cuando el flujo retorna en el
      sentido contrario, el flujo cierra la válvula.

      Se desea estudiar la sobrepresión generada por golpe de ariete. La
      tubería es de acero (k = 0,5), de 600 mm de diámetro interior y 5 mm de
      espesor. La tensión de tracción admisible del acero es
      $\sigma = 2600$ kg/cm². Si el caudal de retorno es 1,23 m³/s y el cierre
      de la válvula dura 5 s, se pide:

      **a)** Valor de la sobrepresión generada por golpe de ariete, en mca.

      **b)** Tensión de tracción a la que se somete a la tubería de acero.
      ¿Aguantará la tubería?

      **c)** Razonar cuál será la presión mínima que alcanzará el flujo aguas
      abajo de la válvula.

      **Ayuda:**

      $$
      a = \frac{9900}{\sqrt{48{,}3 + k\,D/e}} \qquad e = \frac{p\,D}{2\,\sigma}
      $$

      Allievi: $\Delta H = a\,v/g$ · Micheaud: $\Delta H = 2Lv/(g\,t)$

