      </figure>

      La superficie libre del depósito B está en la cota zB = 1550 m. Del
      depósito sale una tubería de acero con un diámetro de 430 mm y una
      pendiente del 18 %. En el camino hay una válvula de guillotina a una
      altitud de zC = 250 m, y aguas abajo de la válvula, a una altitud de
      zD = 200 m, una pequeña central hidroeléctrica con una turbina Pelton con
      dos inyectores para turbinar el agua que transporta la tubería. Después
      de la central, se vierte el agua en el río a una altitud de zE = 100 m.
      Si el caudal que se transportará a través de la tubería debe ser de
      390 l/s y el cierre de la válvula, manualmente, se realizará en 25
      segundos:

      **b)** Calcular el grosor de la tubería utilizando la expresión de Barlow
      y seleccionar el espesor comercial adecuado sabiendo que son múltiplos de
      2 mm. Explicar y razonar el procedimiento.

      **c)** El cliente desea que la válvula se cierre automáticamente en 10
      segundos. Explicar con valores si es una buena idea o no. El cliente no
      aceptará opiniones contrarias que no estén respaldadas con valores.

      **Ayuda:**

      $$
      e = \left(\frac{p\,D}{2\sigma} + m\right) c
      $$

      con $\sigma$ la tensión admisible del material (355 MPa), $m$ el aumento
      debido a la corrosión (1 mm) y $c$ el margen de fabricación (1,25).

      $$
      a = \frac{9900}{\sqrt{48{,}3 + k\,D/e}}
      $$

      Allievi: $\Delta H = a\,v/g$ · Micheaud: $\Delta H = 2Lv/(g\,t)$

