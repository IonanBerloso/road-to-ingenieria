ejercicios:
  # ── NUESTRO (§08). La colección tiene diecisiete ejercicios de este tema y
  #    todos empiezan ya con la celeridad calculada o con el material dado. Este
  #    aísla la decisión de proyecto: la misma conducción en dos materiales, y
  #    con el mismo tiempo de cierre uno resulta lento y el otro rápido.
  - id: ejflu20-el-material-decide-el-golpe
    titulo: La misma tubería en acero y en PVC, y el mismo cierre
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una conducción de $800\ \text{m}$ de longitud, $300\ \text{mm}$ de
      diámetro interior y $10\ \text{mm}$ de espesor lleva agua a
      $2\ \text{m/s}$. Una válvula en su extremo se cierra en
      $2\ \text{s}$.

      Calcular la sobrepresión por golpe de ariete en dos supuestos:

      a) La tubería es de **acero** ($k = 0{,}5$).

      b) La tubería es de **PVC** ($k = 33$).

      Usar la fórmula de Allievi para la celeridad,
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: La celeridad y la sobrepresión en cada material, clasificando el cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de tocar ninguna fórmula de golpe, ¿qué hay que calcular?
        opciones:
          - texto: >-
              La celeridad, y con ella $T = 2L/a$, para comparar con el tiempo
              de cierre y saber si es rápido o lento
            correcta: true
            mensaje: |
              Ese es el orden y no admite atajos: sin $T$ no se sabe qué
              fórmula toca, y las dos dan números creíbles. En este ejercicio,
              además, la clasificación **no es la misma** en los dos
              materiales.
          - texto: >-
              La sobrepresión con Allievi, que es el valor máximo, y quedarse
              del lado de la seguridad
            mensaje: |
              Es defendible como criterio de proyecto conservador, pero no es
              lo que se pide ni lo que corrige el examen: si el cierre es
              lento, el golpe **no llega** a ese valor y Allievi da un número
              que no ocurre.
          - texto: >-
              La pérdida de carga de la conducción, que hay que sumar a la
              sobrepresión
            mensaje: |
              La pérdida de carga es del régimen permanente y no interviene en
              el cálculo del golpe. Lo que sí se le suma al golpe es la presión
              **estática**, para obtener la presión máxima que ve la tubería.

      - tipo: calcular
        titulo: La celeridad en el acero
        pregunta: |
          ¿Cuánto vale la celeridad de la onda en la tubería de acero?
        respuesta:
          tipo: magnitud
          valor: '1244 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2556 m/s'
            mensaje: |
              Te has dejado el $48{,}3$ del denominador. Ese término representa
              la compresibilidad del propio fluido y está siempre: sin él la
              celeridad saldría mayor que la del sonido en el agua libre
              (1425 m/s), que es imposible.
          - valor: '1425 m/s'
            mensaje: |
              Esa es la velocidad del sonido en el agua, es decir la celeridad
              con tubería **rígida**. La real es siempre menor, porque el tubo
              también se dilata y eso deja entrar más fluido: la onda avanza
              más despacio.
        pista: |
          $D/e = 300/10 = 30$, y $k = 0{,}5$ para el acero.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 30}}
          = \frac{9900}{\sqrt{63{,}3}} = \frac{9900}{7{,}96}
          = 1244\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el acero
        pregunta: |
          Con $T_c = 2\ \text{s}$, ¿qué sobrepresión aparece en la tubería de
          acero?
        respuesta:
          tipo: magnitud
          valor: '163.3 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '253.9 mca'
            mensaje: |
              Has aplicado Allievi, pero aquí el cierre es **lento**:
              $T = 2L/a = 1{,}29\ \text{s}$, menos que los 2 s de cierre. La
              onda estabilizadora vuelve antes de que la válvula acabe de
              cerrar, así que el golpe no llega a completarse. Toca Michaud.
          - valor: '81.63 mca'
            mensaje: |
              Esa es la fórmula de Jouguet, $Lv/gT_c$, que da la mitad que
              Michaud. Las dos están en el temario, pero la que se usa para
              dimensionar —y la que se pide salvo que el enunciado nombre a
              Jouguet— es Michaud.
        pista: |
          Calcula $T = 2L/a$ y compáralo con los 2 s antes de elegir fórmula.
        desarrollo: |
          $$
          T = \frac{2L}{a} = \frac{1600}{1244} = 1{,}29\ \text{s}
          $$

          Como $T_c = 2 > 1{,}29$, el cierre es **lento** y se usa Michaud:

          $$
          \Delta H = \frac{2Lv}{g\,T_c} = \frac{2\cdot 800\cdot 2}{9{,}8\cdot 2}
          = 163{,}3\ \text{mca}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el PVC
        pregunta: |
          Y con la misma conducción en PVC y el mismo cierre de 2 s, ¿cuánto
          vale la sobrepresión?
        respuesta:
          tipo: magnitud
          valor: '62.7 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '163.3 mca'
            mensaje: |
              Has vuelto a usar Michaud, pero en PVC la clasificación **cambia**:
              la celeridad baja a 307 m/s, así que $T = 2L/a = 5{,}2\ \text{s}$
              y los 2 s de cierre ahora son **rápidos**. Toca Allievi. Es el
              punto del ejercicio.
          - valor: '627 mca'
            mensaje: |
              Un factor diez en la celeridad: $9900/\sqrt{1038} = 307$ m/s, no
              3070. Comprueba la raíz: $48{,}3 + 33\cdot 30 = 1038$.
        pista: |
          Recalcula $a$ con $k = 33$ y vuelve a comparar $T$ con los 2 s. La
          respuesta a «¿rápido o lento?» no tiene por qué ser la misma.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 33\cdot 30}} = \frac{9900}{\sqrt{1038{,}3}}
          = 307\ \text{m/s}
          $$
          $$
          T = \frac{1600}{307} = 5{,}21\ \text{s}
          $$

          Ahora $T_c = 2 < 5{,}21$: el cierre es **rápido** y toca Allievi.

          $$
          \Delta H = \frac{a\,v}{g} = \frac{307\cdot 2}{9{,}8} = 62{,}7\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El PVC es cuatro veces más flexible en términos de celeridad: 307
              m/s frente a los 1244 del acero.
          - texto: >-
              Con el mismo cierre de 2 s, en acero resulta lento (Michaud) y en
              PVC rápido (Allievi), porque la clasificación depende de la
              celeridad.
          - texto: >-
              Aun aplicando Allievi, que es la fórmula del golpe completo, el
              PVC sufre 62,7 mca frente a los 163,3 del acero con la fórmula
              más suave.
          - texto: >-
              Como en PVC el cierre resulta rápido, el golpe es más severo que
              en acero: la clasificación de «rápido» siempre implica más
              sobrepresión.
            trampa: true
            mensaje: |
              «Rápido» significa que el golpe llega a **su** máximo, no que ese
              máximo sea grande. El máximo de Allievi es proporcional a $a$, y
              la $a$ del PVC es cuatro veces menor. Por eso el PVC sale mejor
              parado incluso con la fórmula más desfavorable.

    resolucion: |
      **El orden.** Celeridad, periodo, clasificación, y solo entonces fórmula.
      Saltarse el tercer paso es el error del tema, y en este ejercicio se
      castiga solo: la clasificación **cambia** entre los dos materiales.

      **Acero** ($k = 0{,}5$, $D/e = 30$):

      $$
      a = \frac{9900}{\sqrt{63{,}3}} = 1244\ \text{m/s}
      \qquad
      T = \frac{1600}{1244} = 1{,}29\ \text{s}
      $$

      $T_c = 2 > T$: cierre **lento**, Michaud.

      $$
      \Delta H = \frac{2\cdot 800\cdot 2}{9{,}8\cdot 2} = 163{,}3\ \text{mca}
      $$

      **PVC** ($k = 33$):

      $$
      a = \frac{9900}{\sqrt{1038{,}3}} = 307\ \text{m/s}
      \qquad
      T = \frac{1600}{307} = 5{,}21\ \text{s}
      $$

      $T_c = 2 < T$: cierre **rápido**, Allievi.

      $$
      \Delta H = \frac{307\cdot 2}{9{,}8} = 62{,}7\ \text{mca}
      $$

      **Las dos lecturas.**

      La primera es de proyecto: **el PVC sufre menos de la tercera parte del
      golpe**, y eso con la fórmula desfavorable. Un material flexible se
      dilata más, deja entrar más fluido por el extremo de aguas arriba, la
      onda avanza más despacio y el golpe es menor. Misma razón por la que una
      pared delgada golpea menos que una gruesa.

      La segunda es de método, y es la que se examina: **«rápido» y «lento» no
      describen la válvula, describen la relación entre la válvula y la
      tubería**. Los mismos dos segundos son lentos en acero y rápidos en PVC.
      Por eso no se puede clasificar leyendo el enunciado: hay que calcular
      $2L/a$.

  # ── COLECCIÓN 7.3. La misma tubería con dos tiempos de cierre, uno a cada
  #    lado de la frontera. Es el ejercicio que la escuela usa para enseñar la
  #    clasificación, y sus dos apartados difieren en un factor de dos.
  - id: ejflu20-la-misma-valvula-en-cuatro-y-en-dos-segundos
    titulo: La misma válvula cerrada en cuatro segundos y en dos
    fuente: >-
      Ejercicio 7.3 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una conducción de $1200\ \text{m}$ de longitud y $400\ \text{mm}$ de
      diámetro se transporta un caudal de $200\ \text{l/s}$ de agua. Se conoce
      que la tubería, de $8\ \text{mm}$ de espesor, es de acero cuyo módulo de
      elasticidad es de $2\cdot 10^{7}\ \text{N/cm}^{2}$. Si se cierra una
      válvula dispuesta en su extremo final se desea conocer la sobrepresión
      producida por golpe de ariete:

      a) Si el cierre se efectúa en $4\ \text{s}$.

      b) Si el cierre se realiza en $2\ \text{s}$.
    pide: La sobrepresión en cada uno de los dos tiempos de cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da el módulo de elasticidad, no el coeficiente $k$.
          ¿Cómo se pasa de uno al otro?
        opciones:
          - texto: >-
              $k = 10^{7}/E$ con $E$ en N/cm², lo que aquí da $k = 0{,}5$: el
              valor tabulado del acero
            correcta: true
            mensaje: |
              Eso es, y comprobar que coincide con el de la tabla es una buena
              costumbre: si el $k$ que sale no se parece a ninguno de la lista,
              casi seguro hay un lío de unidades en $E$.
          - texto: >-
              $k = E/10^{7}$, que da 2
            mensaje: |
              Es la inversa. Fíjate en el sentido físico: $k$ tiene que ser
              **pequeño** para un material rígido, porque un material rígido da
              celeridad alta y $k$ está en el denominador. El acero, que es de
              lo más rígido de la tabla, tiene el $k$ más pequeño.
          - texto: >-
              No hace falta $k$: con $E$ se usa directamente la fórmula de
              Joukowski
            mensaje: |
              Se puede, y da el mismo resultado. Pero entonces hay que meter
              también $K$ y $\rho$ del agua y cuidar las unidades de los dos
              módulos. La forma de Allievi ya lleva todo eso dentro y es la que
              usa la asignatura.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuál es la celeridad de la onda?
        respuesta:
          tipo: magnitud
          valor: '1156 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1425 m/s'
            mensaje: |
              Esa es la del sonido en el agua libre, o lo que saldría con
              $D/e = 0$. Aquí $D/e = 50$ y con $k = 0{,}5$ el denominador sube
              de 48,3 a 73,3.
          - valor: '813 m/s'
            mensaje: |
              Has usado $k = 2$, es decir $E/10^{7}$ en vez de $10^{7}/E$. El
              acero es de los materiales más rígidos de la tabla, así que le
              corresponde el $k$ más **pequeño**: 0,5. Con 2 estarías tratando
              la tubería como si fuera casi de hormigón.
        pista: |
          $k = 10^{7}/(2\cdot 10^{7}) = 0{,}5$ y $D/e = 50$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot 50}}
          = \frac{9900}{\sqrt{73{,}3}} = 1156\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El cierre en cuatro segundos
        pregunta: |
          ¿Qué sobrepresión aparece si la válvula se cierra en 4 s?
        respuesta:
          tipo: magnitud
          valor: '955 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1840 kpa'
            mensaje: |
              Has aplicado Allievi. Con $T = 2L/a = 2{,}08\ \text{s}$ y un
              cierre de 4 s, la onda estabilizadora vuelve cuando la válvula
              lleva la mitad del recorrido: el cierre es **lento** y el golpe
              no se completa.
          - valor: '477.5 kpa'
            mensaje: |
              Es la fórmula de Jouguet, que da la mitad de Michaud. Para
              dimensionar se usa Michaud, que es la conservadora, salvo que el
              enunciado pida expresamente la otra.
        pista: |
          Primero $T = 2L/a$, después la comparación, y solo entonces la
          fórmula. La velocidad es $Q/A$ con $A = \pi\,0{,}4^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}2}{\pi\cdot 0{,}4^{2}/4} = 1{,}59\ \text{m/s}
          \qquad
          T = \frac{2\cdot 1200}{1156} = 2{,}08\ \text{s}
          $$

          $T_c = 4 > 2{,}08$: cierre **lento**, Michaud.

          $$
          \Delta H = \frac{2Lv}{g\,T_c} = \frac{2\cdot 1200\cdot 1{,}59}{9{,}8\cdot 4}
          = 97{,}4\ \text{mca}
          $$
          $$
          \Delta p = 97{,}4\cdot 9800 = 955\ \text{kPa}
          $$

      - tipo: calcular
        titulo: El cierre en dos segundos
        pregunta: |
          ¿Y si se cierra en 2 s?
        respuesta:
          tipo: magnitud
          valor: '1840 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1910 kpa'
            mensaje: |
              Has usado Michaud con $T_c = 2$. Fíjate en lo justo que va:
              $T = 2{,}08\ \text{s}$ y el cierre es de 2, así que por ocho
              centésimas el cierre es **rápido** y toca Allievi. Los dos
              números se parecen precisamente porque el caso está en la
              frontera.
          - valor: '955 kpa'
            mensaje: |
              Ese es el resultado del apartado anterior. Al reducir el tiempo
              de cierre a la mitad el golpe **no** puede quedarse igual: o se
              duplica, si sigue siendo lento, o se planta en el máximo de
              Allievi, que es lo que pasa aquí.
        pista: |
          Vuelve a comparar: 2 s contra los 2,08 s del periodo.
        desarrollo: |
          $T_c = 2 < 2{,}08$: cierre **rápido**, Allievi.

          $$
          \Delta H = \frac{a\,v}{g} = \frac{1156\cdot 1{,}59}{9{,}8}
          = 187{,}8\ \text{mca}
          $$
          $$
          \Delta p = 187{,}8\cdot 9800 = 1840\ \text{kPa}
          $$

          Casi el doble que en el apartado a), por cerrar dos segundos antes.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $k = 0{,}5$ y $D/e = 50$, la celeridad es de 1156 m/s y el
              periodo de ida y vuelta, $T = 2L/a = 2{,}08$ s.
          - texto: >-
              Cerrando en 4 s el cierre es lento y Michaud da 97,4 mca; en 2 s
              es rápido y Allievi da 187,8 mca.
          - texto: >-
              Al pasar de 4 a 2 segundos el golpe casi se duplica, y a partir
              de 2,08 s hacia abajo ya no crece más: 187,8 mca es el techo.
          - texto: >-
              Si se cerrara en 0,5 s el golpe sería cuatro veces el de 2 s,
              porque Michaud es inversamente proporcional al tiempo de cierre.
            trampa: true
            mensaje: |
              Michaud ya no aplica por debajo de $T = 2{,}08$ s: ahí el cierre
              es rápido y manda Allievi, que **no depende del tiempo de
              cierre**. Cerrar en medio segundo da exactamente los mismos 187,8
              mca que cerrar en dos. El golpe tiene techo, y por eso acelerar
              el cierre por debajo de $2L/a$ no empeora nada — igual que
              alargarlo un poco tampoco mejora nada hasta pasar esa frontera.

    resolucion: |
      **La celeridad.** El enunciado da $E$, no $k$:
      $k = 10^{7}/(2\cdot 10^{7}) = 0{,}5$, que es el valor tabulado del acero.
      Con $D/e = 50$:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 25}} = 1156\ \text{m/s}
      $$

      **La frontera.** $T = 2L/a = 2{,}08\ \text{s}$. Los dos apartados están
      uno a cada lado, y eso es deliberado del enunciado.

      **a) Cierre en 4 s: lento.** Con $v = Q/A = 1{,}59\ \text{m/s}$,

      $$
      \Delta H = \frac{2Lv}{g\,T_c} = 97{,}4\ \text{mca} = 955\ \text{kPa}
      $$

      **b) Cierre en 2 s: rápido.**

      $$
      \Delta H = \frac{a\,v}{g} = 187{,}8\ \text{mca} = 1840\ \text{kPa}
      $$

      **Lo que enseña la comparación.** Casi el doble de presión por dos
      segundos. Y el matiz que se suele pasar por alto: **por debajo de los
      2,08 s ya no crece más**. Allievi no lleva el tiempo de cierre dentro
      porque, una vez que la válvula acaba antes de que vuelva la onda, da
      igual cuánto antes acabe: el golpe ya está completo.

      Eso convierte $2L/a$ en el dato de proyecto. Alargar el cierre de 0,5 s a
      2 s no sirve de nada en esta conducción; pasar de 2 a 4 s baja el golpe a
      la mitad. **Toda la mejora está al otro lado de esa frontera**, y por eso
      lo primero que se calcula es dónde cae.

      **Nota sobre los números.** El boletín redondea la velocidad a 1,6 m/s y
      publica 960 y 1850 kPa; con $v = 1{,}59$ exacta salen 955 y 1840. La
      diferencia es del 0,5 %.

  # ── COLECCIÓN 7.5 y 7.6, juntos porque el enunciado es el mismo y solo
  #    cambia el límite de sobrepresión. Por separado el 7.6 parece un error
  #    de imprenta; juntos enseñan lo único que importa del tema: hay un
  #    techo, y por debajo de él no hay maniobra que valga.
  - id: ejflu20-col75-cuanto-tiene-que-durar-el-cierre
    titulo: Cuánto tiene que durar el cierre, y el límite que no se puede pedir
    fuente: >-
      Ejercicios 7.5 y 7.6 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En una tubería de acero, de $3\ \text{mm}$ de espesor, $350\ \text{mm}$
      de diámetro y $1500\ \text{m}$ de longitud, circula un caudal de agua
      $Q = 250\ \text{l/s}$.

      a) (7.5) ¿Cuánto debe durar la maniobra de cierre de una válvula situada
      en el extremo final de la tubería, para que la sobrepresión no exceda de
      $80\ \text{mca}$?

      b) (7.6) ¿Y para que no exceda de $300\ \text{mca}$? Razonar la
      respuesta.

      Dato: $k_{\text{acero}} = 0{,}5$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tiempo de cierre para cada límite de sobrepresión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué decide si hay que usar Allievi o
          Micheaud?
        opciones:
          - texto: >-
              Comparar el tiempo de cierre con $2L/a$, el tiempo que tarda la
              onda en ir y volver
            correcta: true
            mensaje: |
              Eso es. Si la válvula termina de cerrar **antes** de que vuelva
              la onda, el cierre es rápido y la sobrepresión es la máxima que
              el sistema puede dar, la de Allievi. Si le da tiempo a volver,
              la onda reflejada alivia y vale Micheaud.
          - texto: >-
              Si el cierre dura menos de un segundo es rápido, y si dura más,
              lento
            mensaje: |
              No hay un umbral absoluto: depende de la tubería. Los tres
              segundos que son «lentos» en una tubería de 1500 m son
              rapidísimos en una de laboratorio de 3 m, donde la onda va y
              vuelve en quince milésimas.
          - texto: >-
              El material: en tuberías rígidas el cierre siempre es rápido
            mensaje: |
              El material entra en $a$, y con ella en $2L/a$, pero no decide
              nada por sí solo. Una tubería de acero muy larga tiene un
              tiempo crítico grande y admite cierres lentos sin problema.

      - tipo: calcular
        titulo: La celeridad de la onda
        pregunta: |
          ¿Cuánto vale la celeridad $a$?
        respuesta:
          tipo: magnitud
          valor: '959 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$: eso es
              $9900/\sqrt{48{,}3}$, la celeridad en agua dentro de una tubería
              **infinitamente rígida**. Es el techo teórico; ninguna tubería
              real llega.
          - valor: '394 m/s'
            mensaje: |
              Has usado $k = 5$, que es el del hormigón armado. El acero es
              $k = 0{,}5$: diez veces más rígido, y por eso la onda va más del
              doble de rápido.
        pista: |
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$, con $D$ y $e$ en las mismas
          unidades.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot\dfrac{350}{3}}}
          = \frac{9900}{\sqrt{106{,}63}} = 959\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El tiempo de cierre para 80 mca
        pregunta: |
          ¿Cuánto tiene que durar el cierre para que la sobrepresión no pase
          de $80\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '9.94 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '3.13 s'
            mensaje: |
              Ese es el tiempo crítico $2L/a$, la frontera entre cierre rápido
              y lento. Cerrar en ese tiempo da la sobrepresión **máxima**, 254
              mca, no 80.
          - valor: '4.97 s'
            mensaje: |
              Te has dejado el 2 de Micheaud. La expresión es
              $\Delta H = 2Lv/(g\,T)$, con el 2 porque la onda recorre la
              tubería dos veces.
        pista: |
          Micheaud despejando el tiempo, con
          $v = Q/A$ y $A = \pi\,0{,}35^{2}/4$.
        desarrollo: |
          $$
          v = \frac{0{,}25}{\pi\,0{,}35^{2}/4} = 2{,}60\ \text{m/s}
          $$
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{2\cdot 1500\cdot 2{,}60}
          {9{,}8\cdot 80} = 9{,}94\ \text{s}
          $$

          Y hay que comprobarlo: $9{,}94 > 2L/a = 3{,}13$, así que el cierre
          es efectivamente lento y Micheaud vale.

      - tipo: calcular
        titulo: La sobrepresión máxima que esta tubería puede dar
        pregunta: |
          ¿Cuál es la mayor sobrepresión posible, cierre la válvula como
          cierre?
        respuesta:
          tipo: magnitud
          valor: '254 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '2492 mca'
            mensaje: |
              Te has dejado la gravedad. Allievi es $\Delta H = a\,v/g$: el
              resultado son metros de columna, y para eso hay que dividir
              entre $g$.
          - valor: '24.5 mca'
            mensaje: |
              Has usado el caudal, $0{,}25$, donde va la **velocidad**,
              $2{,}60$ m/s. En Allievi entra la velocidad del agua, no el
              caudal.
        pista: |
          Es la de Allievi: el cierre instantáneo, cuando la onda no tiene
          tiempo de volver.
        desarrollo: |
          $$
          \Delta H_{\max} = \frac{a\,v}{g} = \frac{959\cdot 2{,}60}{9{,}8}
          = 254\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Aplicando Micheaud a los 300 mca sale $T = 2{,}65$ s.
          - texto: >-
              Pero $2{,}65$ s es **menor** que el tiempo crítico de
              $3{,}13$ s, así que ese cierre no sería lento y Micheaud no le
              aplica: la cuenta se contradice a sí misma.
          - texto: >-
              Lo que ocurre es que esta tubería no puede dar 300 mca ni
              cerrando de golpe: su techo es la sobrepresión de Allievi,
              254 mca.
          - texto: >-
              Por tanto hay que reducir el espesor de la tubería para que la
              sobrepresión pueda llegar a los 300 mca pedidos.
            trampa: true
            mensaje: |
              Nadie quiere **llegar** a 300 mca: el enunciado pide no
              excederlos. Y no se exceden nunca, así que la respuesta es
              «cualquier tiempo de cierre vale». Que un límite de diseño esté
              por encima del máximo físico es una buena noticia, no un
              problema a resolver.

    resolucion: |
      **Los dos ejercicios son el mismo enunciado con dos límites, y por eso
      van juntos.** El 7.5 tiene respuesta numérica y el 7.6 no, y esa
      diferencia es lo que hay que entender.

      **La celeridad.** Con $k = 0{,}5$ para el acero y $D/e = 350/3$:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 58{,}33}} = 959\ \text{m/s}
      $$

      de donde el **tiempo crítico** $2L/a = 3000/959 = 3{,}13$ s. Ese número
      es la referencia de todo lo demás.

      **a) Para 80 mca.** Micheaud despejando el tiempo da $T = 9{,}94$ s. Y
      se comprueba: $9{,}94 > 3{,}13$, cierre lento, la fórmula era la buena.

      **b) Para 300 mca, y por qué no hay respuesta.** Repitiendo la cuenta
      sale $T = 2{,}65$ s… que es **menor** que el tiempo crítico. La cuenta
      se ha aplicado fuera de su dominio: para tiempos por debajo de 3,13 s el
      cierre es rápido y la sobrepresión ya no depende del tiempo, sino que
      vale lo que dice Allievi:

      $$
      \Delta H_{\max} = \frac{a\,v}{g} = 254\ \text{mca}
      $$

      **Doscientos cincuenta y cuatro es el techo de esta tubería.** Con este
      caudal y este material no hay maniobra —ni el cierre instantáneo— que
      produzca 300 mca. La respuesta al 7.6 es: cualquier tiempo de cierre
      cumple la condición.

      **La regla que sale de aquí, y que vale para todo el tema.** Micheaud
      solo es válida por encima del tiempo crítico. Si al despejar el tiempo
      sale uno menor, **no se acepta el resultado**: se vuelve atrás, se
      calcula Allievi y se compara. Es el mismo tipo de comprobación que
      exigir que un caudal salga positivo.

  # ── COLECCIÓN 7.8. La misma cuenta de siempre a escala de central
  #    hidroeléctrica real. Sirve para ver que quinientos metros de
  #    sobrepresión no son un caso de laboratorio: es lo que aguanta una
  #    tubería forzada de verdad.
  - id: ejflu20-col78-la-tuberia-forzada-de-villarino
    titulo: La tubería forzada de Villariño, y sus quinientos metros de golpe
    fuente: >-
      Ejercicio 7.8 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La tubería forzada de la central hidroeléctrica de Villariño (Salamanca)
      es de hormigón armado ($C_{\text{material}} = 5$). Tiene una longitud de
      $15\ \text{km}$, el diámetro interior es de $7{,}5\ \text{m}$ y el
      espesor de $50\ \text{cm}$. El máximo caudal de agua es de
      $287\ \text{m}^{3}/\text{s}$. Se pide:

      a) Si la válvula de mariposa situada al final de la tubería se cierra en
      $40\ \text{s}$, calcular el valor de la sobrepresión generada por golpe
      de ariete.

      b) Explicar dos maneras de atenuar dicha sobrepresión.

      Dato: $a = 9900/\sqrt{48{,}3 + C_{\text{mat}}\,D/e}$.
    pide: La sobrepresión al cerrar en 40 s, y dos formas de atenuarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tubería mide 15 km y el cierre dura 40 s. ¿Qué esperas antes de
          calcular?
        opciones:
          - texto: >-
              Que el tiempo crítico sea grande —decenas de segundos— porque la
              tubería es larguísima, así que 40 s podría ser un cierre lento
            correcta: true
            mensaje: |
              Bien planteado. $2L/a$ con 30 km de recorrido y una onda de unos
              900 m/s sale del orden de 33 s: los 40 s quedan justo por
              encima, y el cierre es lento por poco.
          - texto: >-
              Que 40 s es muchísimo tiempo, así que la sobrepresión será
              despreciable
            mensaje: |
              Cuarenta segundos son muchos en una tubería de casa y muy pocos
              en una de quince kilómetros. Va a salir una sobrepresión de casi
              500 metros de columna: nada despreciable.
          - texto: >-
              Que el cierre es rápido, porque una válvula de mariposa cierra
              de golpe
            mensaje: |
              «Rápido» y «lento» no describen la válvula, sino la comparación
              entre su tiempo y el de ida y vuelta de la onda. Aquí hay que
              calcular $2L/a$ antes de decidir.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuánto vale $a$ en esta tubería?
        respuesta:
          tipo: magnitud
          valor: '892 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1325 m/s'
            mensaje: |
              Has usado $k = 0{,}5$, el del acero. La tubería es de hormigón
              armado y su coeficiente es 5: diez veces más deformable, y por
              eso la onda va un tercio más despacio.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$. Eso es la celeridad en agua
              confinada en una tubería indeformable, el límite superior que
              ningún material alcanza.
        pista: |
          $D/e = 7{,}5/0{,}5$, las dos en metros.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 5\cdot\dfrac{7{,}5}{0{,}5}}}
          = \frac{9900}{\sqrt{123{,}3}} = 892\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          ¿Qué sobrepresión genera el cierre en 40 s?
        respuesta:
          tipo: magnitud
          valor: '497 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '591 mca'
            mensaje: |
              Esa es la de Allievi, la del cierre rápido. Aquí
              $2L/a = 33{,}6$ s y el cierre dura 40: la onda vuelve antes de
              que la válvula termine, y parte del golpe se alivia. Va
              Micheaud.
          - valor: '249 mca'
            mensaje: |
              Te has dejado el 2 de Micheaud. La onda recorre los 15 km de
              ida y otros 15 de vuelta: $\Delta H = 2Lv/(g\,T)$.
        pista: |
          Compara primero 40 s con $2L/a$; después aplica la fórmula que
          corresponda, con $v = 287/(\pi\,7{,}5^{2}/4)$.
        desarrollo: |
          $$
          v = \frac{287}{\pi\,7{,}5^{2}/4} = 6{,}50\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{30\,000}{892} = 33{,}6\ \text{s} < 40
          $$

          Cierre **lento**, luego Micheaud:

          $$
          \Delta H = \frac{2\cdot 15\,000\cdot 6{,}50}{9{,}8\cdot 40}
          = 497\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión y las dos medidas. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $a = 892$ m/s el tiempo crítico es de 33,6 s, y el cierre de
              40 s queda por encima: es lento, y la sobrepresión son 497 mca.
          - texto: >-
              La primera forma de atenuarlo es alargar el cierre: como
              Micheaud es inversamente proporcional al tiempo, doblarlo a 80 s
              deja la sobrepresión en 249 mca.
          - texto: >-
              La segunda es acortar la longitud efectiva con una chimenea de
              equilibrio, que refleja la onda mucho antes de que llegue al
              embalse.
          - texto: >-
              Y una tercera, siempre válida, es aumentar el espesor de la
              tubería, que reduce la sobrepresión generada.
            trampa: true
            mensaje: |
              Aumentar el espesor hace la tubería **más rígida**, sube la
              celeridad y con ella la sobrepresión de Allievi: empeora el
              golpe, no lo atenúa. Lo que sí consigue es que la tubería
              **aguante** más, que es otra cosa. Confundir «reducir la carga»
              con «resistir la carga» es el error típico del tema.

    resolucion: |
      **Los números.** $v = 6{,}50$ m/s, $a = 892$ m/s, tiempo crítico
      $2L/a = 33{,}6$ s. El cierre de 40 s queda por encima —por poco— así
      que es lento y vale Micheaud:

      $$
      \Delta H = \frac{2Lv}{g\,T} = 497\ \text{mca}
      $$

      Casi medio kilómetro de columna de agua, unos **49 bar**, encima de la
      presión de servicio que la tubería ya tiene. Por eso una tubería forzada
      lleva el espesor que lleva.

      **Y qué pasa si se cierra un poco más deprisa.** A 33,6 s el cierre pasa
      a rápido y la sobrepresión se congela en la de Allievi,
      $a\,v/g = 591$ mca. Es decir: entre 40 y 33,6 segundos la sobrepresión
      sube un 19 %, y por debajo ya no sube más. **El diseño de la maniobra
      vive todo en esa franja.**

      **Dos maneras de atenuarlo.**

      1. **Alargar la maniobra.** Micheaud va con $1/T$: cerrar en 80 s en vez
         de 40 deja la sobrepresión en la mitad. Es la medida más barata y la
         primera que se toma, con el límite de que la turbina no puede quedar
         sin control demasiado tiempo.

      2. **Chimenea de equilibrio.** Un depósito abierto intercalado en la
         conducción. La onda de presión se refleja allí en vez de en el
         embalse, y en la fórmula lo que cuenta pasa a ser la distancia
         válvula-chimenea, no los 15 km. Es lo que hace el ejercicio 7.16 de
         la colección, donde la chimenea se coloca para poder cerrar en 30 s.

      También valen un volante de inercia en el grupo, una válvula de
      descarga sincronizada o un calderín antiariete. Lo que **no** vale es
      engrosar la tubería: eso la hace más rígida, sube la celeridad y empeora
      el golpe, aunque a cambio la tubería lo resista mejor.

  # ── COLECCIÓN 7.9. Los dos tubos del laboratorio de la escuela. Es el
  #    ejercicio que rompe la intuición de que el golpe de ariete es cosa de
  #    grandes instalaciones: tres metros de tubo y trece milésimas de
  #    segundo, y el fenómeno está entero.
  - id: ejflu20-col79-los-dos-tubos-del-laboratorio
    titulo: Tres metros de tubo, y el golpe de ariete entero
    fuente: >-
      Ejercicio 7.9 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En el laboratorio hay dos tuberías, una de PVC
      ($D_i = 28{,}4\ \text{mm}$, $e = 1{,}8\ \text{mm}$) y otra de cobre
      ($D_i = 26\ \text{mm}$, $e = 1{,}0\ \text{mm}$), ambas de longitud
      $L = 3\ \text{m}$. Si circula un caudal de $1{,}5\ \text{l/s}$ por cada
      tubería, se pide, determinar primeramente en ambos casos qué tipo de
      cierre es, y calcular:

      a) La sobrepresión generada en la tubería de PVC al cerrar la válvula de
      bola situada al final de la tubería, si el tiempo de cierre ha sido
      $0{,}1\ \text{s}$.

      b) Tiempo que ha durado el cierre de la válvula accionada
      neumáticamente situada al final de la tubería de cobre, si se ha medido
      una sobrepresión de $135\ \text{mca}$.

      Datos: $k_{\text{PVC}} = 33$; $k_{\text{cobre}} = 0{,}8$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tipo de cierre en los dos casos, la sobrepresión en el PVC y el tiempo en el cobre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos tubos miden 3 m. ¿Qué orden de magnitud tiene su tiempo
          crítico?
        opciones:
          - texto: >-
              Milésimas de segundo, porque la onda recorre seis metros a
              varios cientos de metros por segundo
            correcta: true
            mensaje: |
              Eso es, y es lo que hace este ejercicio distinto: en el PVC son
              14 milésimas y en el cobre, 5. Cualquier cierre manual es
              «lento» a esa escala.
          - texto: >-
              Del orden de un segundo, como en cualquier instalación
            mensaje: |
              El tiempo crítico no tiene un valor típico: es $2L/a$, y con
              $L = 3$ m sale mil veces menor que en una conducción de
              kilómetros. Ese es todo el contenido del ejercicio.
          - texto: >-
              No se puede saber sin conocer el caudal
            mensaje: |
              El tiempo crítico no depende del caudal: solo de la longitud y
              de la celeridad, que a su vez depende del material y de la
              geometría del tubo. El caudal entra después, en la
              sobrepresión.

      - tipo: calcular
        titulo: La celeridad en el PVC
        pregunta: |
          ¿Cuánto vale $a$ en el tubo de PVC?
        respuesta:
          tipo: magnitud
          valor: '415 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1191 m/s'
            mensaje: |
              Esa es la del **cobre**. El PVC tiene $k = 33$ frente a
              $0{,}8$: se deforma cuarenta veces más, y la onda va a un
              tercio de velocidad.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$, que aquí es el que domina:
              vale 520 frente a los 48,3 del agua. En un tubo de plástico
              fino, la elasticidad del tubo manda sobre la del agua.
        pista: |
          $D/e = 28{,}4/1{,}8$, y $k = 33$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 33\cdot\dfrac{28{,}4}{1{,}8}}}
          = \frac{9900}{\sqrt{569}} = 415\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión en el PVC
        pregunta: |
          Cerrando en $0{,}1\ \text{s}$, ¿qué sobrepresión aparece?
        respuesta:
          tipo: magnitud
          valor: '14.5 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '100.3 mca'
            mensaje: |
              Esa es la de Allievi. Comprueba el tiempo crítico:
              $2L/a = 6/415 = 0{,}014$ s, y el cierre ha durado $0{,}1$, siete
              veces más. Es un cierre lento y la onda reflejada alivia casi
              todo el golpe.
          - valor: '7.25 mca'
            mensaje: |
              Te has dejado el 2 de Micheaud: la onda recorre los tres metros
              de ida y otros tres de vuelta.
        pista: |
          $v = 1{,}5\cdot 10^{-3}/(\pi\,0{,}0284^{2}/4)$, y compara
          $0{,}1$ con $2L/a$.
        desarrollo: |
          $$
          v = \frac{1{,}5\cdot 10^{-3}}{\pi\,0{,}0284^{2}/4}
          = 2{,}37\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{6}{415} = 0{,}0145\ \text{s} < 0{,}1
          $$
          $$
          \Delta H = \frac{2\cdot 3\cdot 2{,}37}{9{,}8\cdot 0{,}1}
          = 14{,}5\ \text{mca}
          $$

      - tipo: calcular
        titulo: El tiempo de la válvula neumática
        pregunta: |
          En el tubo de cobre se han medido $135\ \text{mca}$. ¿Cuánto duró
          el cierre?
        respuesta:
          tipo: magnitud
          valor: '0.0128 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '0.00504 s'
            mensaje: |
              Ese es el tiempo crítico del cobre, $2L/a = 6/1191$. Cerrar en
              ese tiempo daría la sobrepresión de Allievi, 343 mca, mucho más
              de los 135 medidos.
          - valor: '0.00641 s'
            mensaje: |
              Te has dejado el 2 de Micheaud. Y fíjate en lo que habría
              pasado si no: $0{,}0064$ s es **mayor** que el tiempo crítico
              de $0{,}0050$, así que el resultado no se habría delatado solo.
              Aquí hay que hacer bien la fórmula, no confiar en que el
              disparate salte a la vista.
        pista: |
          Micheaud despejando $T$, con la velocidad y la celeridad del cobre.
        desarrollo: |
          $$
          v = \frac{1{,}5\cdot 10^{-3}}{\pi\,0{,}026^{2}/4}
          = 2{,}83\ \text{m/s}
          \qquad
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}8\cdot 26}} = 1191\ \text{m/s}
          $$
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{6\cdot 2{,}83}{9{,}8\cdot 135}
          = 0{,}0128\ \text{s}
          $$

          Y se comprueba: $0{,}0128 > 2L/a = 0{,}0050$. Cierre lento.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos cierres son lentos, porque los tiempos críticos son de
              14 y 5 milésimas de segundo y las maniobras duran más.
          - texto: >-
              El PVC, con $k = 33$, tiene una celeridad de 415 m/s frente a
              los 1191 del cobre: el tubo de plástico absorbe la onda
              deformándose.
          - texto: >-
              Cerrando en 0,1 s el PVC da 14,5 mca; el cobre necesita cerrar
              en 12,8 milésimas para llegar a 135.
          - texto: >-
              Como el PVC da menos sobrepresión que el cobre, es siempre el
              material más seguro frente al golpe de ariete.
            trampa: true
            mensaje: |
              Menos sobrepresión, sí, pero también mucha menos resistencia. Lo
              que hay que comparar no es el golpe sino el golpe **frente a lo
              que el tubo aguanta**. Un tubo de PVC fino puede reventar con
              una sobrepresión que a uno de cobre no le hace nada. Los 14,5
              mca de aquí son cómodos; los 100 de Allievi, si la válvula
              cerrara de golpe, ya no lo serían tanto.

    resolucion: |
      **Por qué este ejercicio merece la pena.** El golpe de ariete se explica
      siempre con centrales y conducciones de kilómetros, y eso hace pensar
      que es un fenómeno de escala grande. Aquí hay tres metros de tubo en una
      mesa de laboratorio y el fenómeno está entero, solo que todo ocurre mil
      veces más deprisa.

      **Los tiempos críticos.** $2L/a$ vale $0{,}0145$ s en el PVC y
      $0{,}0050$ en el cobre. Cualquier maniobra humana —una válvula de bola
      girada a mano tarda décimas— es «lenta» a esa escala, y por eso los dos
      cierres lo son.

      **a) El PVC.** $v = 2{,}37$ m/s, $a = 415$ m/s, $T = 0{,}1$ s:

      $$
      \Delta H = \frac{2Lv}{g\,T} = 14{,}5\ \text{mca}
      $$

      **b) El cobre.** Despejando el tiempo de Micheaud con
      $\Delta H = 135$ mca: $T = 0{,}0128$ s. Una válvula neumática sí llega
      a esos tiempos; una manual, no.

      **Lo que separa los dos materiales.** El coeficiente $k$ vale 33 en el
      PVC y 0,8 en el cobre, y ese es prácticamente todo el término del
      denominador: el agua aporta 48,3 y el tubo de PVC, 520. **En un tubo de
      plástico delgado la onda va a la velocidad que le deja el tubo, no la
      que le deja el agua.** En el cobre ocurre lo contrario: 20,8 frente a
      48,3, y la celeridad se acerca a la del agua libre.

      Esa es la razón física de que las instalaciones domésticas de plástico
      den golpes de ariete mucho más suaves que las antiguas de cobre, y de
      que el golpe seco al cerrar un grifo se oiga en unas casas y en otras
      no.

  # ── COLECCIÓN 7.13. El único del capítulo que pide diseñar la maniobra en
  #    los dos sentidos: primero comprobar qué pasa con el cierre que hay, y
  #    después decidir cuál hace falta. Y el apartado b) exige razonar antes
  #    de calcular, que es lo que el examen suele puntuar aparte.
  - id: ejflu20-col713-la-maniobra-que-hay-que-disenar
    titulo: Comprobar el cierre que hay, y diseñar el que hace falta
    fuente: >-
      Ejercicio 7.13 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una conducción de $1200\ \text{m}$ de longitud y $400\ \text{mm}$ de
      diámetro se transporta un caudal de $200\ \text{l/s}$ de agua. Se conoce
      que la tubería de $12\ \text{mm}$ de espesor es de fundición, cuyo
      módulo de elasticidad es $10\cdot 10^{6}\ \text{N/cm}^{2}$.

      a) Si se cierra una válvula dispuesta en su extremo final en
      $2\ \text{s}$, determinar qué tipo de cierre es y calcular la
      sobrepresión producida por golpe de ariete.

      b) Si se quiere limitar la sobrepresión a $100\ \text{m.c.a.}$, ¿qué
      tipo de cierre será necesario? Justificarlo sin realizar ningún cálculo
      y, si es posible, determinar a continuación el tiempo que debe durar la
      maniobra de cierre de la válvula.

      Dato: $k_{\text{fundición}} = 1$;
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$.
    pide: El tipo de cierre y la sobrepresión, y el tiempo necesario para bajar a 100 mca.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) pide justificar **sin calcular** qué tipo de cierre
          hará falta para bajar de 177,9 a 100 mca. ¿Cuál es el argumento?
        opciones:
          - texto: >-
              Tiene que ser lento, porque la sobrepresión del cierre rápido es
              la máxima posible y ya está por encima de 100
            correcta: true
            mensaje: |
              Exacto, y ese es todo el razonamiento. Allievi da el techo; si
              el techo son 177,9 y el objetivo son 100, hay que bajar de él,
              y lo único que baja de él es alargar la maniobra.
          - texto: >-
              Tiene que ser rápido, porque cerrar antes deja menos tiempo para
              que suba la presión
            mensaje: |
              Es justo al revés, y es la intuición que hay que corregir. Cerrar
              deprisa **impide** que la onda reflejada alivie el golpe: el
              cierre rápido da la sobrepresión máxima, no la mínima.
          - texto: >-
              No se puede saber sin calcular la nueva celeridad
            mensaje: |
              La celeridad no cambia: depende de la tubería y del fluido, no
              de la maniobra. Lo único que se puede tocar es el tiempo.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: magnitud
          valor: '1096 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1228 m/s'
            mensaje: |
              Has usado $k = 0{,}5$, el del hierro y el acero. La fundición
              tiene $k = 1$: es más frágil y menos rígida, y la onda va algo
              más despacio.
          - valor: '1424 m/s'
            mensaje: |
              Te has dejado el término $k\,D/e$, que aquí aporta 33,3 frente
              a los 48,3 del agua. En una tubería metálica gruesa los dos
              términos son del mismo orden, y ninguno se puede despreciar.
        pista: |
          $D/e = 400/12$ y $k = 1$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 1\cdot\dfrac{400}{12}}}
          = \frac{9900}{\sqrt{81{,}63}} = 1096\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La sobrepresión del cierre en 2 s
        pregunta: |
          ¿Qué sobrepresión produce cerrar en $2\ \text{s}$?
        respuesta:
          tipo: magnitud
          valor: '178 mca'
          tolerancia: 0.02
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: '195 mca'
            mensaje: |
              Has aplicado Micheaud. Comprueba el tiempo crítico:
              $2L/a = 2400/1096 = 2{,}19$ s, y el cierre dura 2. Es **rápido**
              —por poco— y por tanto va Allievi.
          - valor: '712 mca'
            mensaje: |
              La velocidad. Has usado el radio donde va el diámetro en el área:
              $A = \pi\,0{,}4^{2}/4 = 0{,}1257\ \text{m}^{2}$, y de ahí
              $v = 1{,}59$ m/s, no 6,37.
        pista: |
          Primero $2L/a$ y la comparación; después la fórmula que toque.
        desarrollo: |
          $$
          v = \frac{0{,}2}{\pi\,0{,}4^{2}/4} = 1{,}59\ \text{m/s}
          \qquad
          \frac{2L}{a} = \frac{2400}{1096} = 2{,}19\ \text{s} > 2
          $$

          Cierre **rápido**, luego Allievi:

          $$
          \Delta H = \frac{a\,v}{g} = \frac{1096\cdot 1{,}59}{9{,}8}
          = 178\ \text{mca}
          $$

      - tipo: calcular
        titulo: El tiempo para bajar a 100 mca
        pregunta: |
          ¿Cuánto tiene que durar la maniobra para no pasar de
          $100\ \text{mca}$?
        respuesta:
          tipo: magnitud
          valor: '3.9 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '2.19 s'
            mensaje: |
              Ese es el tiempo crítico. Cerrar exactamente ahí sigue dando la
              sobrepresión de Allievi, 178 mca. Hay que pasarse holgadamente
              de él.
          - valor: '1.95 s'
            mensaje: |
              Te has dejado el 2 de Micheaud, y el resultado se delata solo:
              $1{,}95$ s es **menor** que el tiempo crítico de $2{,}19$, así
              que no puede ser el tiempo de un cierre lento.
        pista: |
          Micheaud despejando $T$, y después comprobar que sale mayor que
          $2L/a$.
        desarrollo: |
          $$
          T = \frac{2Lv}{g\,\Delta H} = \frac{2400\cdot 1{,}59}{9{,}8\cdot 100}
          = 3{,}9\ \text{s}
          $$

          Comprobación: $3{,}9 > 2{,}19$. Es un cierre lento, la fórmula era
          la buena.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $a = 1096$ m/s el tiempo crítico es de 2,19 s, y el cierre
              de 2 s queda por debajo: es rápido, y la sobrepresión es la de
              Allievi, 178 mca.
          - texto: >-
              Para bajar a 100 mca hace falta un cierre lento, porque 178 es
              el máximo que la instalación puede dar y solo se baja de él
              alargando la maniobra.
          - texto: >-
              Micheaud da $T = 3{,}9$ s, que es mayor que el tiempo crítico:
              el resultado es coherente con la hipótesis de cierre lento.
          - texto: >-
              Bastaría con cerrar en 2,2 s, apenas dos décimas más, para
              quedar del lado lento y cumplir el límite.
            trampa: true
            mensaje: |
              Quedar del lado lento no basta: hay que quedar **suficientemente**
              lento. En $T = 2{,}2$ s Micheaud da 177,3 mca, prácticamente lo
              mismo que Allievi, porque justo en la frontera las dos fórmulas
              coinciden. La sobrepresión no cae de golpe al cruzar el tiempo
              crítico: baja como $1/T$ a partir de ahí, y para llegar a 100
              hacen falta 3,9 s.

    resolucion: |
      **a) El cierre que hay.** $v = 1{,}59$ m/s, $a = 1096$ m/s, tiempo
      crítico $2L/a = 2{,}19$ s. El cierre de 2 s queda **por debajo**: es
      rápido, y la sobrepresión es la máxima que la instalación puede dar,

      $$
      \Delta H = \frac{a\,v}{g} = 178\ \text{mca}
      $$

      Por dos décimas de segundo. Si la maniobra hubiera durado 2,2 s el
      cierre sería lento… y la sobrepresión, 177,3 mca: prácticamente la
      misma. **En la frontera las dos fórmulas dan el mismo valor**, y de
      hecho tienen que darlo: sustituyendo $T = 2L/a$ en Micheaud sale
      exactamente Allievi. La frontera no es un salto, es un empalme.

      **b) El razonamiento antes del cálculo.** Allievi es el techo. Si el
      techo son 178 mca y el objetivo son 100, hay que bajar de él, y lo único
      que baja de él es alargar el cierre: **tiene que ser lento**. Eso se
      responde sin tocar la calculadora, y el enunciado lo pide así a
      propósito.

      Y entonces sí, Micheaud:

      $$
      T = \frac{2Lv}{g\,\Delta H} = 3{,}9\ \text{s}
      $$

      con la comprobación obligatoria: $3{,}9 > 2{,}19$, coherente.

      **La estructura que se repite en todo el capítulo.** Calcular $a$,
      calcular $2L/a$, comparar, elegir fórmula, y **comprobar al final que
      el resultado no contradice la elección**. Los ejercicios 7.5 y 7.6 son
      la misma secuencia; el 7.6 existe precisamente para enseñar qué hacer
      cuando la comprobación falla.

  # ── COLECCIÓN 7.1. El único del capítulo que no va de golpe de ariete: es
  #    una oscilación libre en un tubo en U, y es el que explica de dónde sale
  #    la idea de que una columna de líquido tiene inercia. Sin esto, el
  #    ariete es una fórmula que se aplica; con esto, es una consecuencia.
  - id: ejflu20-col71-la-columna-que-oscila-en-el-tubo-en-u
    titulo: La columna que oscila en un tubo en U
    fuente: >-
      Ejercicio 7.1 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un líquido se desplaza sin rozamiento oscilatoriamente en el interior de
      un tubo en U en posición vertical. La longitud de la columna de líquido
      es de $1{,}225\ \text{m}$. Cuando la diferencia de cotas entre los dos
      meniscos en contacto con la atmósfera local es de $0{,}5\ \text{m}$, la
      velocidad de la columna es de $1\ \text{m/s}$. Teniendo en cuenta los
      supuestos anteriores, se pide:

      a) La diferencia de cotas máxima entre los meniscos.

      b) La máxima velocidad alcanzada por el líquido en su desplazamiento,
      instante en que se produce y posición de los meniscos.

      c) Periodo de la oscilación.

      Dato: la posición de un menisco respecto del equilibrio obedece a
      $z = Z\cos\left(\sqrt{2g/L}\;t\right)$.
    pide: La diferencia máxima de meniscos, la velocidad máxima y el periodo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la columna oscila con la frecuencia $\sqrt{2g/L}$ y no con
          $\sqrt{g/L}$, como un péndulo?
        opciones:
          - texto: >-
              Porque cuando un menisco sube $z$ el otro baja $z$, así que el
              desnivel que empuja es $2z$ y la fuerza recuperadora es el doble
            correcta: true
            mensaje: |
              Eso es. La fuerza es $\gamma A\,(2z)$ sobre una masa
              $\rho A L$, de donde $\ddot z = -(2g/L)z$. Ese factor 2 es
              geométrico, no físico: sale de que el líquido es
              incompresible y lo que sube por un lado baja por el otro.
          - texto: >-
              Porque hay dos ramas en el tubo y por tanto el doble de masa
            mensaje: |
              La masa que se acelera es toda la columna, $\rho A L$, contada
              una sola vez —$L$ ya es la longitud **total**—. Si el 2 viniera
              de la masa estaría en el denominador y bajaría la frecuencia,
              no la subiría.
          - texto: >-
              Porque la gravedad actúa sobre las dos ramas y hay que sumarla
              dos veces
            mensaje: |
              La gravedad es la misma en todas partes. Lo que se dobla es el
              **desnivel** entre los dos meniscos, que es el que produce la
              diferencia de presiones que empuja.

      - tipo: calcular
        titulo: La diferencia máxima de meniscos
        pregunta: |
          ¿Cuánto llegan a separarse en vertical los dos meniscos?
        respuesta:
          tipo: magnitud
          valor: '0.707 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.5 m'
            mensaje: |
              Ese es el desnivel del **dato**, y no es el máximo: en ese
              instante la columna todavía se mueve a 1 m/s, así que le queda
              recorrido. El máximo es donde la velocidad se anula.
          - valor: '0.354 m'
            mensaje: |
              Esa es la amplitud $Z$ de **un** menisco respecto de su posición
              de equilibrio. La diferencia entre los dos es el doble, porque
              uno sube lo mismo que el otro baja.
        pista: |
          $\omega = \sqrt{2g/L}$. Con $z = 0{,}25$ y $\dot z = 1$ en el mismo
          instante, elimina el tiempo entre $z = Z\cos\omega t$ y
          $\dot z = -Z\omega\sin\omega t$.
        desarrollo: |
          $$
          \omega = \sqrt{\frac{2\cdot 9{,}8}{1{,}225}} = 4\ \text{s}^{-1}
          $$

          En el instante del dato cada menisco está a $z = 0{,}25$ m del
          equilibrio:

          $$
          0{,}25 = Z\cos 4t_1
          \qquad
          1 = 4Z\sin 4t_1
          \;\Longrightarrow\;
          \tan 4t_1 = 1
          \;\Longrightarrow\;
          t_1 = 0{,}196\ \text{s}
          $$
          $$
          Z = \frac{0{,}25}{\cos(\pi/4)} = 0{,}354\ \text{m}
          \qquad
          2Z = 0{,}707\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad máxima
        pregunta: |
          ¿Cuál es la mayor velocidad que alcanza la columna?
        respuesta:
          tipo: magnitud
          valor: '1.414 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1 m/s'
            mensaje: |
              Esa es la velocidad del dato, medida cuando los meniscos ya
              están separados 0,5 m. La máxima se da al pasar por el
              equilibrio, con los dos meniscos a la misma altura.
          - valor: '2 m/s'
            mensaje: |
              Has usado $Z = 0{,}5$ m, que es la **diferencia** entre
              meniscos, no la amplitud de uno. La amplitud es la mitad,
              $0{,}354$ m.
        pista: |
          En un movimiento armónico la velocidad máxima es $Z\omega$, y se da
          al pasar por el equilibrio.
        desarrollo: |
          $$
          v_{\max} = Z\omega = 0{,}354\cdot 4 = 1{,}414\ \text{m/s}
          $$

          Ocurre cuando $\sin 4t = 1$, es decir $t = \pi/8 = 0{,}393$ s, con
          los dos meniscos a la misma altura.

      - tipo: calcular
        titulo: El periodo
        pregunta: |
          ¿Cuánto dura una oscilación completa?
        respuesta:
          tipo: magnitud
          valor: '1.571 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '2.22 s'
            mensaje: |
              Te has dejado el 2 de $2g$: eso es $2\pi\sqrt{L/g}$, el periodo
              que tendría si la fuerza recuperadora fuese la mitad. El 2 sale
              de que los dos meniscos se mueven en sentidos contrarios.
          - valor: '0.785 s'
            mensaje: |
              Eso es **medio** periodo, el tiempo entre un extremo y el otro.
              Una oscilación completa vuelve al punto de partida y con la
              misma velocidad: el doble.
        pista: |
          $T = 2\pi/\omega$, con la $\omega$ que ya has calculado.
        desarrollo: |
          $$
          T = \frac{2\pi}{\omega} = \frac{2\pi}{4} = 1{,}571\ \text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La columna se comporta como un oscilador armónico de pulsación
              $\omega = \sqrt{2g/L} = 4\ \text{s}^{-1}$.
          - texto: >-
              Del dato —$z = 0{,}25$ m con $\dot z = 1$ m/s— salen
              $Z = 0{,}354$ m y un desnivel máximo de 0,707 m.
          - texto: >-
              La velocidad máxima es $Z\omega = 1{,}414$ m/s y ocurre al pasar
              por el equilibrio; el periodo es 1,571 s.
          - texto: >-
              Y como el movimiento es armónico, el periodo depende de la
              amplitud: una oscilación más violenta tarda más en completarse.
            trampa: true
            mensaje: |
              Un armónico simple es **isócrono**: el periodo no depende de la
              amplitud. $T = 2\pi\sqrt{L/2g}$ solo contiene la longitud de la
              columna. Es la misma propiedad que hace útil al péndulo como
              reloj, y aquí significa que el tubo oscila a 1,571 s tanto si
              lo desplazas un centímetro como treinta.

    resolucion: |
      **Por qué este problema está en el capítulo del golpe de ariete.** No
      hay válvula, ni sobrepresión, ni celeridad. Lo que hay es lo que el
      resto del capítulo da por sabido: **una columna de líquido tiene
      inercia, y esa inercia la hace oscilar en vez de pararse.** El golpe de
      ariete es el mismo fenómeno con el líquido comprimido en vez de
      desplazado.

      **La pulsación.** Si un menisco sube $z$, el otro baja $z$: el desnivel
      que empuja es $2z$. La fuerza es $\gamma A\,2z$ sobre una masa
      $\rho A L$, luego

      $$
      \ddot z = -\frac{2g}{L}\,z
      \qquad
      \omega = \sqrt{\frac{2g}{L}} = \sqrt{\frac{19{,}6}{1{,}225}} = 4\
      \text{s}^{-1}
      $$

      Un número redondo, y no por casualidad: el enunciado eligió $L$ para
      que lo fuera.

      **a) La amplitud.** El dato da posición y velocidad en el **mismo**
      instante, y con eso se elimina el tiempo:

      $$
      \tan\omega t_1 = \frac{\dot z}{\omega z} = \frac{1}{4\cdot 0{,}25} = 1
      \;\Longrightarrow\;
      \omega t_1 = \frac{\pi}{4}
      \;\Longrightarrow\;
      Z = \frac{0{,}25}{\cos(\pi/4)} = 0{,}354\ \text{m}
      $$

      El desnivel máximo es $2Z = 0{,}707$ m. Ojo al factor dos, que aquí
      aparece dos veces por motivos distintos: en $\omega$ porque la fuerza es
      doble, y en la respuesta porque se pregunta por la diferencia entre dos
      meniscos y no por el recorrido de uno.

      **b) La velocidad máxima.** $Z\omega = 1{,}414$ m/s, en $t = \pi/8 =
      0{,}393$ s, con los meniscos nivelados. Compruébalo con la energía:
      toda la energía potencial del desnivel máximo se ha convertido en
      cinética.

      **c) El periodo.** $T = 2\pi/\omega = 1{,}571$ s, y **no depende de la
      amplitud**.

      **Lo que este ejercicio deja preparado.** Sin rozamiento la columna
      oscilaría eternamente. Con rozamiento se amortigua, y esa oscilación
      amortiguada es exactamente lo que ocurre en una conducción tras cerrar
      una válvula: la presión sube, baja, vuelve a subir, cada vez menos. La
      chimenea de equilibrio del ejercicio 7.16 es un tubo en U gigante
      puesto ahí a propósito para que oscile despacio.

  # ── COLECCIÓN 7.2. Los dos casos límite, uno en cada apartado: tubería
  #    rígida con líquido incompresible, y tubería rígida con líquido
  #    compresible. El primero da una fórmula que no es la de Micheaud y el
  #    segundo da Allievi por otro camino —la energía— sin nombrarla.
  - id: ejflu20-col72-los-dos-casos-limite
    titulo: Los dos casos límite, y de dónde sale Allievi
    fuente: >-
      Ejercicio 7.2 · Colección de Problemas, capítulo 7 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una conducción de $500\ \text{m}$ de longitud por la que se
      conduce agua a una velocidad de $1{,}2\ \text{m/s}$. Se desea conocer la
      sobrepresión que se producirá si se cierra la válvula situada en su
      extremo final en los supuestos siguientes:

      a) Si la válvula se cerrase en $1\ \text{s}$, la tubería fuese
      totalmente rígida y el líquido fuese totalmente incompresible.

      b) Si la válvula se cerrara instantáneamente, la tubería fuera
      totalmente rígida y se considerase el módulo de elasticidad volumétrico
      del agua $K = 2{,}14\cdot 10^{9}\ \text{N/m}^{2}$.
    pide: La sobrepresión en cada uno de los dos supuestos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el líquido es **totalmente incompresible** y la tubería
          **totalmente rígida**, ¿qué pasa con la onda de presión?
        opciones:
          - texto: >-
              No hay onda: toda la columna frena a la vez, y la sobrepresión
              es la que hace falta para decelerar esa masa en el tiempo de
              cierre
            correcta: true
            mensaje: |
              Exacto, y esa es la clave del apartado a). Sin compresibilidad
              la celeridad sería infinita: la información viaja
              instantáneamente y no hay nada que «vuelva». El problema se
              reduce a $F = ma$ sobre la columna entera.
          - texto: >-
              La onda viaja más despacio, porque un líquido rígido transmite
              peor las perturbaciones
            mensaje: |
              Al revés: cuanto más rígidos el líquido y el tubo, **más
              deprisa** va la onda —$a = \sqrt{K/\rho}$ crece con $K$—. En el
              límite incompresible la celeridad es infinita.
          - texto: >-
              La onda se refleja igual, solo que sin pérdidas
            mensaje: |
              Para que haya onda tiene que haber algo que se deforme y
              devuelva la deformación. Si nada se comprime y nada se dilata,
              no hay medio que soporte la onda.

      - tipo: calcular
        titulo: El caso incompresible
        pregunta: |
          Con la tubería rígida, el líquido incompresible y un cierre de
          $1\ \text{s}$, ¿qué sobrepresión aparece?
        respuesta:
          tipo: magnitud
          valor: '600 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1200 kpa'
            mensaje: |
              Has usado $2L$. Aquí no hay ida y vuelta de ninguna onda: la
              columna que frena mide $L = 500$ m, y punto. El $2L$ de
              Micheaud viene de un recorrido que en este supuesto no existe.
          - valor: '720 kpa'
            mensaje: |
              Parece que has metido $v^{2}$. La deceleración es $v/T$
              —lineal—, así que la fuerza por unidad de área es
              $\rho L\,v/T$, con la velocidad a la primera.
        pista: |
          $F = ma$ sobre la columna: masa $\rho A L$, deceleración $v/T$, y la
          sobrepresión es $F/A$.
        desarrollo: |
          $$
          \Delta p = \frac{F}{A} = \frac{\rho A L\,(v/T)}{A}
          = \frac{\rho L v}{T} = \frac{1000\cdot 500\cdot 1{,}2}{1}
          = 6\cdot 10^{5}\ \text{Pa}
          $$

      - tipo: calcular
        titulo: El caso compresible
        pregunta: |
          Con cierre instantáneo y el agua compresible
          ($K = 2{,}14\cdot 10^{9}$), ¿cuánto sube la presión?
        respuesta:
          tipo: magnitud
          valor: '1755 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1463 kpa'
            mensaje: |
              Eso es $\sqrt{K\rho} = \rho\,a$, que tiene unidades de presión
              partido por velocidad. Falta multiplicar por la velocidad del
              agua, $1{,}2$ m/s.
          - valor: '1.756 kpa'
            mensaje: |
              Has puesto $K/\rho$ donde va $K\rho$. Comprueba las
              dimensiones: $\sqrt{K/\rho}$ es la **celeridad**, en m/s, y
              multiplicada por otra velocidad no da una presión.
        pista: |
          La energía cinética de la columna se convierte en energía de
          deformación: $\frac{1}{2}mv^{2} = \frac{\Delta p^{2}}{2K}\cdot
          \frac{m}{\rho}$.
        desarrollo: |
          El líquido se comprime: el cambio de volumen es
          $\Delta V = V\Delta p/K$ y el incremento medio de presión, la mitad
          del final. Igualando energías,

          $$
          \frac{1}{2}m v^{2} = \frac{\Delta p^{2}}{2K}\,\frac{m}{\rho}
          \;\Longrightarrow\;
          \Delta p = v\sqrt{K\rho}
          $$
          $$
          \Delta p = 1{,}2\sqrt{2{,}14\cdot 10^{9}\cdot 1000}
          = 1{,}755\cdot 10^{6}\ \text{Pa}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin compresibilidad no hay onda, así que la sobrepresión sale de
              $F = ma$ sobre la columna entera: $\rho L v/T = 600$ kPa.
          - texto: >-
              Con el agua compresible y cierre instantáneo, la energía
              cinética se guarda como deformación y sale
              $\Delta p = v\sqrt{K\rho} = 1755$ kPa.
          - texto: >-
              Y ese $\sqrt{K\rho}$ es $\rho\,a$ con $a = \sqrt{K/\rho} = 1463$
              m/s: el apartado b) es Allievi, deducido por energía en vez de
              por cantidad de movimiento.
          - texto: >-
              Como el apartado b) da casi el triple que el a), se ve que
              considerar el líquido compresible siempre agrava el golpe.
            trampa: true
            mensaje: |
              Lo que agrava el golpe en b) no es la compresibilidad, es el
              **cierre instantáneo**. Los dos apartados no comparan lo mismo:
              a) cierra en un segundo y b) en cero. De hecho la
              compresibilidad **suaviza** el fenómeno —es lo que hace finita
              la celeridad y permite que la onda vuelva y alivie—; si el
              apartado a) se cerrara instantáneamente con líquido
              incompresible, la sobrepresión sería infinita.

    resolucion: |
      **Dos supuestos imposibles, y por eso el ejercicio es bueno.** Ni el
      agua es incompresible ni ninguna tubería es rígida. Lo que hacen los dos
      apartados es apagar una variable cada vez para ver qué aporta.

      **a) Sin compresibilidad.** La celeridad sería infinita: al cerrar, toda
      la columna se entera a la vez y frena en bloque. Es un problema de
      dinámica elemental:

      $$
      \Delta p = \frac{\rho L v}{T} = 600\ \text{kPa}
      $$

      Fíjate en que no aparece ni el diámetro ni el material: solo la longitud
      de columna que hay que frenar y el tiempo del que se dispone.

      **b) Con compresibilidad y cierre instantáneo.** Ahora la columna no
      frena en bloque: se comprime contra la válvula. La energía cinética se
      almacena como energía de deformación, y de ahí

      $$
      \Delta p = v\sqrt{K\rho} = 1755\ \text{kPa}
      $$

      **Y aquí está lo que el enunciado no dice.** Ese $\sqrt{K\rho}$ se puede
      escribir $\rho\,a$ con $a = \sqrt{K/\rho} = 1463$ m/s, la velocidad del
      sonido en el agua. Es decir:

      $$
      \Delta p = \rho\,a\,v
      \qquad\text{o, en metros,}\qquad
      \Delta H = \frac{a\,v}{g}
      $$

      **que es exactamente la expresión de Allievi**, la que el resto del
      capítulo usa sin demostrar. Aquí sale por un camino distinto —energía en
      vez de cantidad de movimiento— y sin haberla nombrado.

      **Por qué 1463 m/s y no los 900 o 1100 de los otros problemas.** Porque
      la tubería es rígida. En una real el tubo también se dilata, y eso baja
      la celeridad: es justo lo que mide el término $k\,D/e$ de la fórmula
      $a = 9900/\sqrt{48{,}3 + k\,D/e}$. Con $k\,D/e = 0$ esa expresión da
      $9900/\sqrt{48{,}3} = 1424$ m/s, el mismo número por otra vía.

  - id: ejflu20-col76-el-cierre-que-no-hace-falta-alargar
    titulo: La maniobra de cierre que no hay que alargar
    fuente: >-
      Ejercicio 7.6 · Colección de problemas de Mecánica de Fluidos, Régimen
      variable en tuberías · Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      En una tubería de acero, de $e = 3$ mm de espesor, $D = 350$ mm de
      diámetro y $L = 1500$ m de longitud, circula un caudal de agua
      $Q = 250$ l/s. ¿Cuánto debe durar la maniobra de cierre de una válvula
      situada en el extremo final de la tubería para que la sobrepresión no
      exceda de $300$ mca? Razonar la respuesta.
    pide: El tiempo de cierre necesario, razonando la respuesta.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de despejar ningún tiempo, ¿qué conviene calcular?
        opciones:
          - texto: >-
              El golpe máximo posible, el de Allievi, para ver si el límite de
              300 mca está siquiera al alcance
            correcta: true
            mensaje: |
              Eso es, y es lo que convierte este problema en una pregunta con
              trampa. Allievi es el techo: **ningún cierre, por rápido que sea,
              produce más**. Si el techo ya está por debajo del límite, no hay
              nada que despejar.
          - texto: >-
              Directamente el tiempo, despejando de la fórmula de Michaud con
              $\Delta H = 300$
            mensaje: |
              Es lo que pide el cuerpo, y sale un número — pero un número sin
              sentido. Michaud solo vale en cierre lento, y antes hay que
              comprobar que el problema tiene solución.
          - texto: El periodo $2L/a$, para clasificar el cierre
            mensaje: |
              Hace falta, sí, pero después. Clasificar exige conocer $T_c$, que
              es justo lo que se busca; el techo de Allievi se calcula **sin**
              conocerlo.
      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          ¿Cuánto vale la celeridad de la onda en esta tubería de acero?
        respuesta:
          tipo: magnitud
          valor: 959 m/s
          tolerancia: 0.01
          formato: una celeridad, con su unidad
        distractores:
          - valor: 1425 m/s
            mensaje: |
              Esa es la velocidad del sonido en el agua, o sea la celeridad con
              tubo **rígido**. Aquí el tubo se dilata, y por eso la onda va más
              despacio: hay que meter el término $k\,D/e$.
          - valor: 750 m/s
            mensaje: >-
              Has usado el $k$ del hormigón o del fibrocemento. El acero tiene
              $k = 0{,}5$, el más rígido de la tabla.
        pista: |
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$, con $k = 0{,}5$ para el acero y
          $D/e = 350/3$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 0{,}5\cdot\frac{350}{3}}}
          = \frac{9900}{\sqrt{48{,}3 + 58{,}3}}
          = \frac{9900}{10{,}33} = 959\ \text{m/s}
          $$

          Alta, como corresponde al acero: es el material más rígido de la
          tabla y por eso el que peor golpea.
      - tipo: calcular
        titulo: El golpe máximo posible
        pregunta: |
          ¿Cuál es la mayor sobrepresión que puede producirse en esta tubería?
        respuesta:
          tipo: magnitud
          valor: 254 mca
          tolerancia: 0.01
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: 26 mca
            mensaje: |
              Te has dejado la celeridad: has usado $v^{2}/2g$ o algo parecido.
              Allievi es $a\,v/g$, con la **celeridad de la onda**, no la
              velocidad del agua.
          - valor: 377 mca
            mensaje: >-
              Has usado la velocidad del sonido en el agua, 1425 m/s, en vez de
              la celeridad real de esta tubería.
        pista: |
          Allievi, $\Delta H = a\,v/g$. Y la velocidad sale del caudal y la
          sección.
        desarrollo: |
          $$
          v = \frac{Q}{A} = \frac{0{,}250}{\pi\cdot 0{,}35^{2}/4} = 2{,}60\ \text{m/s}
          $$

          $$
          \Delta H_{max} = \frac{a\,v}{g} = \frac{959\cdot 2{,}60}{9{,}8}
          = 254\ \text{mca}
          $$
      - tipo: reconocer
        pregunta: |
          El techo son $254$ mca y el límite pedido, $300$. ¿Cuál es la
          respuesta?
        opciones:
          - texto: >-
              Que la condición se cumple siempre: la sobrepresión no puede
              llegar a 300 ni cerrando de golpe
            correcta: true
            mensaje: |
              Eso es. El enunciado pide «cuánto debe durar» y la respuesta
              honesta es **no hace falta alargarlo**: 300 mca es inalcanzable
              en esta instalación. Un problema puede tener por respuesta que la
              pregunta no aplica.
          - texto: >-
              Que hay que cerrar en el tiempo que dé exactamente 300 mca con
              Michaud
            mensaje: |
              Michaud da valores **menores** que Allievi, no mayores: alargando
              el cierre la sobrepresión baja de 254, nunca sube a 300. Ese
              tiempo no existe.
          - texto: >-
              Que la tubería está mal dimensionada y hay que cambiarla
            mensaje: |
              Al contrario: aguanta de sobra. Que el golpe máximo esté por
              debajo del límite es una buena noticia, no un problema.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La celeridad sale de la fórmula de Allievi con $k = 0{,}5$ del
              acero: $959$ m/s.
          - texto: >-
              La velocidad del agua sale del caudal y la sección:
              $2{,}60$ m/s.
          - texto: >-
              El golpe de Allievi, $a\,v/g = 254$ mca, es el **techo**: ningún
              cierre produce más.
          - texto: >-
              Como 254 es menor que 300, hay que cerrar más deprisa para
              acercarse al límite y aprovechar la tubería.
            trampa: true
            mensaje: |
              «Aprovechar» la tubería acercándose a su límite de presión no es
              un objetivo: el límite es una cota de seguridad que se procura
              **no** rozar. Y además cerrar más deprisa no sube de 254 — ese es
              el techo. La respuesta es que no hay nada que hacer.
          - texto: >-
              Por tanto la condición se cumple con cualquier tiempo de cierre,
              incluido el instantáneo.
    resolucion: |
      **La idea.** Antes de despejar un tiempo conviene mirar el techo. El
      golpe de Allievi es el **máximo posible**: se alcanza con cierre
      instantáneo y ningún cierre produce más.

      **Las cuentas.** Con $k = 0{,}5$ para el acero y $D/e = 350/3 = 116{,}7$:

      $$
      a = \frac{9900}{\sqrt{48{,}3 + 58{,}3}} = 959\ \text{m/s}
      \qquad
      v = \frac{0{,}250}{\pi\cdot 0{,}35^{2}/4} = 2{,}60\ \text{m/s}
      $$

      $$
      \Delta H_{max} = \frac{959\cdot 2{,}60}{9{,}8} = 254\ \text{mca}
      $$

      **La respuesta.** $254 < 300$, así que **la sobrepresión no puede llegar
      a 300 mca por rápido que se cierre**. No hay ningún tiempo que calcular:
      la condición se cumple sola.

      **Lo que hay que llevarse.** El enunciado pregunta «cuánto debe durar» y
      da por hecho que hay un tiempo. No lo hay, y decirlo es la respuesta
      correcta. Despejar ciegamente de Michaud produce un número — y un número
      que no significa nada, porque Michaud da valores **por debajo** de
      Allievi y nunca podría alcanzar los 300.

  - id: ejflu20-col77-el-cierre-lento-y-su-techo
    titulo: Un cierre lento, y cuánto le faltó para ser rápido
    fuente: >-
      Ejercicio 7.7 · Colección de problemas de Mecánica de Fluidos, Régimen
      variable en tuberías · Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      En una conducción de $1400$ m de longitud y $250$ mm de diámetro circula
      un caudal de agua de $120$ l/s. La tubería es de hormigón armado
      ($k = 5$) y su espesor es de $25$ mm. Si se cierra una válvula situada en
      su extremo final en $3{,}5$ s, calcular el valor de la sobrepresión e
      indicar el tipo de cierre. ¿Cuál es la sobrepresión máxima que se puede
      generar?
    pide: La sobrepresión, el tipo de cierre y la sobrepresión máxima posible.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso, y por qué no se puede saltar?
        opciones:
          - texto: >-
              Calcular $T = 2L/a$ y compararlo con el tiempo de cierre, porque
              es lo que decide qué fórmula se usa
            correcta: true
            mensaje: |
              Ese es el orden que salva el ejercicio. Aquí $T = 2{,}80$ s y el
              cierre dura $3{,}5$: es **lento** por siete décimas. Con Allievi
              saldrían 249 mca en vez de 200, y los dos números parecen
              igual de razonables.
          - texto: >-
              Calcular la velocidad del agua, que hace falta en las dos
              fórmulas
            mensaje: |
              Hace falta, sí, pero no decide nada: aparece igual en Allievi y en
              Michaud. Lo que decide es la comparación de tiempos.
          - texto: >-
              Aplicar Michaud, que es la fórmula conservadora
            mensaje: |
              Michaud es conservadora **frente a Jouguet**, no frente a
              Allievi: da valores menores. Aplicarla sin comprobar el tipo de
              cierre puede subestimar el golpe, que es el error caro.
      - tipo: calcular
        titulo: El periodo de ida y vuelta
        pregunta: |
          ¿Cuánto tarda la onda en ir y volver?
        respuesta:
          tipo: magnitud
          valor: 2.8 s
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: 1.4 s
            mensaje: |
              Ese es $L/a$, el tiempo de **ida**. El periodo que clasifica el
              cierre es el de ida y vuelta, $2L/a$: es cuando vuelve la onda
              estabilizadora.
          - valor: 5.6 s
            mensaje: >-
              Ese es el ciclo completo, $4L/a$. El que se compara con el tiempo
              de cierre es la mitad.
        pista: |
          Primero la celeridad, con $k = 5$ y $D/e = 250/25$. Después,
          $T = 2L/a$.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 5\cdot 10}} = \frac{9900}{9{,}91}
          = 998{,}5\ \text{m/s}
          $$

          $$
          T = \frac{2L}{a} = \frac{2800}{998{,}5} = 2{,}80\ \text{s}
          $$

          Y como $T_c = 3{,}5 > 2{,}80$, el cierre es **lento**. Por siete
          décimas.
      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          ¿Cuánto vale la sobrepresión?
        respuesta:
          tipo: magnitud
          valor: 199.56 mca
          tolerancia: 0.01
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: 249.08 mca
            mensaje: |
              Ese es el golpe de Allievi, el de cierre **rápido**. Aquí el
              cierre es lento por siete décimas de segundo, así que toca
              Michaud. Fíjate en lo poco que chirría el número equivocado.
          - valor: 99.78 mca
            mensaje: >-
              Esa es la fórmula de Jouguet, que da la mitad de Michaud. Las dos
              están en el temario, pero la conservadora —y la que se usa para
              dimensionar— es Michaud.
        pista: |
          Cierre lento, así que Michaud: $\Delta H = 2Lv/(g\,T_c)$.
        desarrollo: |
          $$
          v = \frac{0{,}120}{\pi\cdot 0{,}25^{2}/4} = 2{,}445\ \text{m/s}
          $$

          $$
          \Delta H = \frac{2Lv}{g\,T_c} = \frac{2\cdot 1400\cdot 2{,}445}{9{,}8\cdot 3{,}5}
          = 199{,}56\ \text{mca}
          $$
      - tipo: calcular
        titulo: La sobrepresión máxima posible
        pregunta: |
          ¿Y cuál sería el golpe si la válvula se cerrase de golpe?
        respuesta:
          tipo: magnitud
          valor: 249.08 mca
          tolerancia: 0.01
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: 399.1 mca
            mensaje: >-
              Has doblado el resultado de Michaud. El paso de Michaud a Allievi
              no es un factor dos: es la razón $T_c/(2L/a) = 3{,}5/2{,}8 =
              1{,}25$.
          - valor: 199.56 mca
            mensaje: |
              Ese es el golpe con el cierre de 3,5 s. El máximo se alcanza con
              cierre instantáneo, y entonces manda Allievi, que no depende del
              tiempo.
        pista: |
          El máximo es Allievi, $a\,v/g$, y no depende del tiempo de cierre.
        desarrollo: |
          $$
          \Delta H_{max} = \frac{a\,v}{g} = \frac{998{,}5\cdot 2{,}445}{9{,}8}
          = 249{,}08\ \text{mca}
          $$

          La relación entre los dos es exactamente
          $T_c/(2L/a) = 3{,}5/2{,}80 = 1{,}25$, que es lo que dice Michaud: el
          golpe se reduce en la proporción en que el cierre supera al periodo.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $k = 5$ del hormigón armado y $D/e = 10$, la celeridad sale
              $998{,}5$ m/s.
          - texto: >-
              El periodo de ida y vuelta es $2L/a = 2{,}80$ s, menor que los
              $3{,}5$ s de cierre: **cierre lento**.
          - texto: >-
              Al ser lento se aplica Michaud, y sale $199{,}56$ mca.
          - texto: >-
              Como el cierre es lento, el golpe de Allievi no tiene sentido
              físico en esta instalación y no se puede calcular.
            trampa: true
            mensaje: |
              Allievi se puede calcular siempre: es el **techo** de la
              instalación, el golpe que habría con cierre instantáneo, y el
              propio enunciado lo pide en la última pregunta. Que el cierre
              real sea lento no borra el techo — al contrario, es el número con
              el que se dimensiona por seguridad.
          - texto: >-
              Y el máximo posible, con cierre instantáneo, es Allievi:
              $249{,}08$ mca.
    resolucion: |
      **El orden, que es lo que salva el ejercicio.** Primero la celeridad,
      después el periodo, después la comparación, y **solo entonces** la
      fórmula.

      $$
      a = \frac{9900}{\sqrt{48{,}3+50}} = 998{,}5\ \text{m/s}
      \qquad
      T = \frac{2\cdot 1400}{998{,}5} = 2{,}80\ \text{s}
      $$

      $T_c = 3{,}5 > 2{,}80$: **cierre lento**, por siete décimas de segundo.

      **Las dos respuestas.** Con Michaud,
      $\Delta H = 2\cdot 1400\cdot 2{,}445/(9{,}8\cdot 3{,}5) = 199{,}56$ mca. Y
      el máximo posible, con Allievi, $998{,}5\cdot 2{,}445/9{,}8 = 249{,}08$
      mca.

      **Lo que hay que llevarse.** Los dos números son del mismo orden y
      ninguno chirría: 200 y 249. Por eso el orden importa tanto — equivocarse
      de fórmula aquí no produce un disparate que salte a la vista, produce un
      resultado creíble y falso. Y la diferencia entre los dos es exactamente
      la razón $T_c/(2L/a)$, que es lo que dice Michaud.

  - id: ejflu20-col710-del-golpe-a-la-tension-del-material
    titulo: Del golpe de ariete a la tensión que aguanta el tubo
    fuente: >-
      Ejercicio 7.10 · Colección de problemas de Mecánica de Fluidos, Régimen
      variable en tuberías · Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Una tubería de fibrocemento de $125$ m de longitud, diámetro
      $D = 200$ mm y espesor $e = 12$ mm transporta un caudal de agua de
      $250$ l/s. Si la válvula situada en su extremo final se ha cerrado en
      $3$ s, indicar qué tipo de cierre ha sido y calcular la sobrepresión
      generada por el golpe de ariete.

      Antes del golpe de ariete se ha medido la presión en el interior de la
      tubería mediante un manómetro, con una lectura de $0{,}3$ bar. Sabiendo
      que la sobrepresión generada es la máxima que soporta el material,
      calcular la tensión de tracción admisible del fibrocemento
      ($\text{N/mm}^{2}$).

      Datos: módulo de elasticidad volumétrico del fibrocemento
      $1\,825\,000\ \text{N/cm}^{2}$ y del agua $2{,}2\cdot 10^{9}$ Pa.
    pide: El tipo de cierre, la sobrepresión y la tensión de tracción admisible.
    pasos:
      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          Clasifica el cierre y calcula la sobrepresión.
        respuesta:
          tipo: magnitud
          valor: 67.67 mca
          tolerancia: 0.01
          formato: una sobrepresión, con su unidad
        distractores:
          - valor: 683.5 mca
            mensaje: |
              Ese es el golpe de Allievi, y aquí no toca: con $L = 125$ m la
              onda va y vuelve en tres décimas de segundo, mucho menos que los
              3 s de cierre. El cierre es **lento** con mucho margen.
          - valor: 33.84 mca
            mensaje: >-
              Esa es la fórmula de Jouguet, la mitad de Michaud. La que se usa
              para dimensionar es Michaud.
        pista: |
          Con $k = 5{,}4$ del fibrocemento, calcula $a$, después $2L/a$, y
          compáralo con los 3 s.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3 + 5{,}4\cdot\frac{200}{12}}}
          = \frac{9900}{\sqrt{138{,}3}} = 841{,}8\ \text{m/s}
          $$

          $$
          T = \frac{2\cdot 125}{841{,}8} = 0{,}297\ \text{s}
          $$

          Diez veces menos que los 3 s de cierre: **cierre lento**, sin
          discusión. Con $v = 0{,}250/(\pi\cdot 0{,}2^{2}/4) = 7{,}96$ m/s:

          $$
          \Delta H = \frac{2\cdot 125\cdot 7{,}96}{9{,}8\cdot 3} = 67{,}67\ \text{mca}
          $$

          Ojo a la velocidad: **casi 8 m/s** es altísima para una conducción, y
          es lo que hace que un tubo tan corto dé un golpe apreciable.
      - tipo: reconocer
        pregunta: |
          Para pasar de la presión a la tensión del material, ¿qué hay que
          usar?
        opciones:
          - texto: >-
              La tensión circunferencial de un tubo delgado,
              $\sigma = p\,D/(2e)$
            correcta: true
            mensaje: |
              Eso es. Cortando el tubo por un plano diametral, la presión
              empuja sobre $D$ por unidad de longitud y las dos paredes de
              espesor $e$ la aguantan: de ahí el $2e$ del denominador.
          - texto: >-
              El módulo de elasticidad volumétrico del fibrocemento, que da el
              enunciado
            mensaje: |
              Ese dato sirve para la **celeridad**, no para la tensión —y de
              hecho aquí ni eso, porque la fórmula de Allievi ya lleva su $k$
              tabulado. Es un dato que sobra, y está para ver si se usa donde
              no toca.
          - texto: La presión por la sección del tubo
            mensaje: |
              Eso daría una fuerza axial, la que tira de las bridas. Lo que
              rompe un tubo por golpe de ariete es la tensión
              **circunferencial**, que lo abre a lo largo.
      - tipo: calcular
        titulo: La tensión admisible
        pregunta: |
          Con la presión previa de $0{,}3$ bar más la sobrepresión, ¿cuál es la
          tensión de tracción admisible?
        respuesta:
          tipo: magnitud
          valor: 5.78 N/mm2
          tolerancia: 0.01
          formato: una tensión, con su unidad
        distractores:
          - valor: 5.53 N/mm2
            mensaje: |
              Te has dejado la presión previa de $0{,}3$ bar. El tubo aguanta la
              **suma**: lo que ya había más lo que añade el golpe.
          - valor: 11.55 N/mm2
            mensaje: >-
              Te has dejado el 2 del denominador. La presión la aguantan **dos**
              paredes, no una: $\sigma = pD/(2e)$.
        pista: |
          Suma $0{,}3$ bar y $67{,}67$ mca en pascales, y aplica
          $\sigma = pD/(2e)$.
        desarrollo: |
          $$
          p = 0{,}3\cdot 10^{5} + 67{,}67\cdot 9800 = 30\,000 + 663\,166
          = 693\,166\ \text{Pa}
          $$

          $$
          \sigma = \frac{p\,D}{2e} = \frac{693\,166 \cdot 0{,}2}{2\cdot 0{,}012}
          = 5{,}78\cdot 10^{6}\ \text{Pa} = 5{,}78\ \text{N/mm}^{2}
          $$

          El golpe aporta el 96 % de esa tensión: la presión de servicio previa
          casi no cuenta.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $k = 5{,}4$ del fibrocemento y $D/e = 16{,}7$, la celeridad es
              $841{,}8$ m/s.
          - texto: >-
              El periodo, $0{,}297$ s, es diez veces menor que el tiempo de
              cierre: cierre lento y Michaud.
          - texto: >-
              La sobrepresión sale $67{,}67$ mca, que sumada a los $0{,}3$ bar
              previos da $693$ kPa dentro del tubo.
          - texto: >-
              El módulo de elasticidad del fibrocemento que da el enunciado
              entra en el cálculo de la tensión admisible.
            trampa: true
            mensaje: |
              No entra en ningún sitio de este problema. Serviría para deducir
              el $k$ de la fórmula de Allievi, pero el $k = 5{,}4$ del
              fibrocemento ya está tabulado. Es un dato sobrante, y reconocerlo
              es parte del ejercicio: **no todo lo que da un enunciado se usa**.
          - texto: >-
              La tensión circunferencial de un tubo delgado,
              $\sigma = pD/(2e)$, da $5{,}78\ \text{N/mm}^{2}$.
    resolucion: |
      **El tipo de cierre.** Con $k = 5{,}4$ y $D/e = 16{,}7$,
      $a = 841{,}8$ m/s y $T = 2L/a = 0{,}297$ s. Frente a los 3 s de cierre,
      **lento** con un factor diez de margen.

      **La sobrepresión.** Con $v = 7{,}96$ m/s —altísima para una conducción, y
      es lo que hace que un tubo de solo 125 m golpee de forma apreciable—,

      $$
      \Delta H = \frac{2\cdot 125\cdot 7{,}96}{9{,}8\cdot 3} = 67{,}67\ \text{mca}
      $$

      **La tensión.** La presión total dentro del tubo es la previa más el
      golpe, $30\,000 + 663\,166 = 693\,166$ Pa, y la tensión circunferencial de
      un tubo delgado:

      $$
      \sigma = \frac{p\,D}{2e} = 5{,}78\ \text{N/mm}^{2}
      $$

      **Dos cosas que hay que llevarse.** Una, que el módulo de elasticidad del
      fibrocemento que da el enunciado **no se usa**: serviría para deducir el
      $k$, pero el $k$ ya está tabulado. Reconocer un dato sobrante es parte del
      trabajo. Y otra, el $2e$ del denominador: la presión la aguantan **dos**
      paredes, y olvidarlo dobla la tensión.
  - id: ejflu20-col711-el-diametro-que-obliga-el-cierre
    titulo: El diámetro que sale de exigir que el cierre sea rápido
    fuente: Ejercicio 7.11 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por una tubería de fibrocemento, de espesor $e = 12$ mm y longitud
      $L = 1500$ m, circula agua a 1,5 m/s. Si el tiempo de cierre de una
      válvula situada en el extremo final de la tubería es 3 s, calcular el
      diámetro mínimo de la tubería para que el cierre sea rápido. Los
      diámetros comerciales van de 50 en 50 mm. ¿Cuál es la sobrepresión
      generada (mca)? Enumera y describe brevemente dos elementos que permiten
      atenuar el golpe de ariete.

      Datos: módulo de elasticidad volumétrico del fibrocemento
      1.825.000 N/cm² y del agua $2,2 \cdot 10^{9}$ Pa.
    pide: El diámetro comercial más pequeño que hace rápido el cierre, y el golpe que produce.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide un **diámetro** a partir de una condición sobre el
          **tiempo**. ¿Por dónde entra el diámetro en la condición de cierre
          rápido?
        opciones:
          - texto: |
              Por la celeridad: cierre rápido es $T_c < 2L/a$, y $a$ baja al
              crecer $D$, así que la condición se traduce en un diámetro mínimo
            correcta: true
            mensaje: |
              Ese es el hilo. La condición se escribe sobre el tiempo, pero el
              único sitio donde el diámetro puede tocarla es la celeridad: un
              tubo más ancho con el mismo espesor es más deformable, la onda va
              más despacio, tarda más en ir y volver, y un cierre que era lento
              pasa a ser rápido sin que nadie cambie el tiempo de cierre.
          - texto: El diámetro fija el caudal, y con el caudal sale el tiempo de cierre
            mensaje: |
              El tiempo de cierre no sale de ninguna cuenta: **lo da el
              enunciado**, son 3 s, y es un dato de la válvula. Y el caudal aquí
              tampoco hace falta: el golpe se calcula con la velocidad, que
              también viene dada.
          - texto: |
              No entra: la condición $T_c < 2L/a$ solo tiene longitud y tiempo,
              así que el diámetro se elige por pérdida de carga
            mensaje: |
              Tiene también la $a$, y la $a$ es justo donde vive el diámetro:
              $a = \sqrt{K/\rho} \,/\, \sqrt{1 + (K/E)(D/e)}$. Si $a$ fuera un
              número fijo, este ejercicio no tendría enunciado.
          - texto: Por el espesor, que es lo que aguanta la presión, y el diámetro va detrás
            mensaje: |
              El espesor está dado —12 mm— y no se mueve. Lo que se busca es la
              otra mitad del cociente $D/e$, que es la que queda libre.

      - tipo: calcular
        titulo: La celeridad que como mucho se puede admitir
        pregunta: |
          Para que el cierre sea rápido hace falta $T_c < 2L/a$, o sea
          $a < 2L/T_c$. ¿Cuánto vale ese tope, con $L = 1500$ m y
          $T_c = 3$ s?
        respuesta:
          tipo: magnitud
          valor: '1000 m/s'
          tolerancia: 0.005
          formato: la velocidad en m/s
        distractores:
          - valor: '500 m/s'
            mensaje: |
              Has puesto $L/T_c$ en vez de $2L/T_c$. La onda no hace el camino
              una vez: va hasta el depósito y vuelve, y por eso el periodo lleva
              el 2.
          - valor: '4500 m/s'
            mensaje: |
              Eso es $2Lv/T_c$ o algo por el estilo: te ha entrado la velocidad
              del agua donde no toca. Aquí solo intervienen la longitud y el
              tiempo.
        pista: |
          $2 \cdot 1500 / 3$.
        desarrollo: |
          $$
          a < \frac{2L}{T_c} = \frac{2 \cdot 1500}{3} = 1000 \ \text{m/s}
          $$

          Fíjate en lo que acaba de pasar: la condición ya no habla de tiempos.
          A partir de aquí es un problema de **celeridad**, y la celeridad es
          una fórmula con el diámetro dentro.

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          Con $a = \sqrt{K/\rho} \,/\, \sqrt{1 + (K/E)(D/e)}$, $K = 2,2 \cdot 10^{9}$ Pa,
          $E = 1{,}825 \cdot 10^{10}$ Pa y $e = 12$ mm, ¿cuál es el diámetro
          **comercial** más pequeño que deja la celeridad por debajo de
          1000 m/s?
        respuesta:
          tipo: magnitud
          valor: '150 mm'
          tolerancia: 0.005
          formato: el diámetro en mm
        distractores:
          - valor: '119 mm'
            mensaje: |
              Ese es el diámetro exacto que sale de despejar, y está bien
              calculado. Pero el enunciado dice que los diámetros comerciales
              van de 50 en 50: hay que **subir** al siguiente que exista, no
              quedarse en el número de la calculadora.
          - valor: '100 mm'
            mensaje: |
              Has redondeado hacia abajo. Con 100 mm la celeridad sale por
              encima de 1000 m/s y el cierre vuelve a ser lento: el redondeo
              tiene que ir hacia el lado que **cumple** la condición, no hacia
              el más cercano.
          - valor: '50 mm'
            mensaje: |
              Con 50 mm el tubo es casi rígido —$D/e$ vale 4— y la onda va a más
              de 1300 m/s: el cierre es lento con holgura. Cuanto más estrecho,
              peor para lo que aquí se pide.
        pista: |
          Despeja $D$ de la desigualdad y luego sube al múltiplo de 50 que la
          cumpla.
        desarrollo: |
          $$
          \frac{\sqrt{K/\rho}}{\sqrt{1+(K/E)(D/e)}} < 1000
          \;\Longrightarrow\; \sqrt{1+\tfrac{K}{E}\tfrac{D}{e}} > \frac{1483{,}2}{1000}
          $$

          $$
          1 + 0{,}12055\,\frac{D}{12} > 2{,}200
          \;\Longrightarrow\; D > 119{,}45 \ \text{mm}
          $$

          El siguiente diámetro comercial es **150 mm**.

          Y conviene ver de qué lado va el redondeo. La desigualdad dice
          «más ancho que 119,45», así que subir cumple y bajar no: aquí
          redondear al más cercano —100— daría un tubo que **no** hace lo que
          se pide.

      - tipo: calcular
        titulo: La sobrepresión
        pregunta: |
          Con $D = 150$ mm el cierre ya es rápido. ¿Cuánto vale la sobrepresión,
          en mca?
        respuesta:
          tipo: magnitud
          valor: '143.39 mca'
          tolerancia: 0.005
          formato: la sobrepresión en mca
        distractores:
          - valor: '153.06 mca'
            mensaje: |
              Has usado Michaud. Pero el diámetro se ha elegido precisamente
              para que el cierre sea **rápido**, así que la fórmula que toca es
              Allievi: si aquí saliera Michaud, los tres pasos anteriores no
              habrían servido de nada.
          - valor: '140.81 mca'
            mensaje: |
              Estás muy cerca, y el fallo es fino: has usado la forma de Allievi
              con el coeficiente tabulado del fibrocemento ($k = 5{,}4$) en vez
              de la fórmula general con la $E$ que da el enunciado. Cuando el
              problema te da el módulo de elasticidad, es porque quiere que lo
              uses: la tabla es una aproximación de esa misma cuenta.
          - valor: '95.59 mca'
            mensaje: |
              Te has dejado la velocidad, o has dividido por 1,5 en vez de
              multiplicar. Allievi es $a\,v/g$: el golpe crece con la velocidad
              del agua, no baja.
        pista: |
          $\Delta H = a v / g$ con $a = 936{,}8$ m/s.
        desarrollo: |
          Con $D = 150$ mm y $e = 12$ mm:

          $$
          a = \frac{1483{,}2}{\sqrt{1+0{,}12055 \cdot 12{,}5}} = 936{,}8 \ \text{m/s}
          $$

          $$
          T = \frac{2L}{a} = \frac{3000}{936{,}8} = 3{,}20 \ \text{s} > T_c = 3 \ \text{s}
          $$

          Rápido, por dos décimas. Y entonces:

          $$
          \Delta H = \frac{a v}{g} = \frac{936{,}8 \cdot 1{,}5}{9{,}8} = 143{,}39 \ \text{mca}
          $$

          Catorce bares y medio de más por cerrar una llave en tres segundos.

      - tipo: justificar
        pregunta: |
          El enunciado pide además dos elementos que atenúen el golpe. Ordena
          la respuesta. Una pieza es falsa.
        piezas:
          - texto: |
              **Chimenea de equilibrio**: un depósito abierto conectado a la
              conducción, que recibe el agua sobrante y devuelve la que falta.
              Interrumpe la columna, y la $L$ que interviene en el golpe pasa a
              ser solo la del tramo que queda por debajo.
          - texto: |
              **Calderín antiariete**: un recipiente cerrado con aire a presión.
              El aire se comprime al llegar la onda y se expande después, así
              que absorbe la sobrepresión y también rellena la depresión que
              viene detrás.
          - texto: |
              Los dos hacen lo mismo por el mismo sitio: **dar por dónde
              escapar**, que es una de las tres vías del tema junto con alargar
              el tiempo de cierre y bajar la celeridad.
          - texto: |
              Y engrosar la pared de la tubería, que al ser más resistente
              amortigua mejor la onda y reduce la sobrepresión.
            trampa: true
            mensaje: |
              Al revés, y es un error que se comete precisamente por sentido
              común. Engrosar la pared baja $D/e$, sube la celeridad y **sube**
              el golpe: un tubo más rígido deja menos sitio donde meter el agua
              que llega, así que la presión sube más. Lo que atenúa es lo
              contrario —pared más delgada, material más flexible—, y ese es
              justo el mecanismo que este ejercicio ha usado para pasar de
              cierre lento a rápido en sentido inverso.
    resolucion: |
      **Un problema de diámetro escrito como una condición de tiempo.**

      Lo que hace distinto a este ejercicio es el orden en que se lee. Piden un
      diámetro, y el único dato sobre el diámetro es una condición sobre el
      cierre: que sea rápido. Encadenar las dos cosas es todo el problema.

      **1 · La condición, sin tiempos.** Cierre rápido es $T_c < 2L/a$. Con
      $L$ y $T_c$ dados, eso es un tope para la celeridad:

      $$
      a < \frac{2L}{T_c} = \frac{2 \cdot 1500}{3} = 1000 \ \text{m/s}
      $$

      **2 · La celeridad, con la fórmula que pide el enunciado.** Aquí no vale
      la tabla: el problema da $E = 1{,}825 \cdot 10^{10}$ Pa y
      $K = 2,2 \cdot 10^{9}$ Pa porque quiere la forma general.

      $$
      a = \frac{\sqrt{K/\rho}}{\sqrt{1+(K/E)(D/e)}}
      = \frac{1483{,}2}{\sqrt{1+0{,}12055\,D/12}}
      $$

      Imponiendo el tope, $D > 119{,}45$ mm, y el siguiente comercial es
      **$D = 150$ mm**.

      **3 · El golpe.** Con ese diámetro, $a = 936{,}8$ m/s, $T = 3{,}20$ s —el
      cierre es rápido por dos décimas— y

      $$
      \Delta H = \frac{a v}{g} = \frac{936{,}8 \cdot 1{,}5}{9{,}8}
      = 143{,}39 \ \text{mca}
      $$

      **Lo que conviene no perder de vista.** El ejercicio suena a
      dimensionado, pero lo que está haciendo es **empeorar** la instalación a
      propósito: un tubo más ancho hace el cierre rápido, y un cierre rápido
      es el que más golpea. Nadie diseñaría así. Lo que se está practicando es
      leer la condición al revés, y de paso ver que la frontera entre rápido y
      lento no depende solo de la válvula: depende también de por dónde va el
      agua.

  - id: ejflu20-col712-el-golpe-negativo-y-el-suelo-del-vacio
    titulo: El golpe negativo, y el suelo que la presión no puede cruzar
    fuente: Ejercicio 7.12 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      A través de una tubería de 1250 m de longitud y 300 mm de diámetro se
      transporta un caudal de 80 l/s. El tubo es de acero de 9 mm de espesor.
      Al comienzo de la tubería hay una válvula. La presión del flujo aguas
      abajo de la válvula es 6,4 bar. La válvula se cierra en 3 segundos y se
      produce un golpe de ariete negativo. Se pide:

      a) Calcular la variación de presión por golpe de ariete en el flujo aguas
      abajo de la válvula, indicando el tipo de cierre.

      b) Realizar una gráfica indicando la variación de presión respecto al
      tiempo en el flujo aguas abajo de la válvula. Razonar la gráfica.

      Datos: módulo de elasticidad del acero $2 \cdot 10^{11}$ Pa; del agua,
      $2,2 \cdot 10^{9}$ Pa.
    pide: La variación de presión aguas abajo de la válvula, y el tipo de cierre.
    pasos:
      - tipo: reconocer
        pregunta: |
          La válvula está **al comienzo** de la tubería, y lo que se pide es lo
          que pasa **aguas abajo** de ella. ¿Por qué el golpe sale negativo?
        opciones:
          - texto: |
              Porque aguas abajo el agua se sigue yendo y detrás no llega nada:
              la columna se estira y la presión cae
            correcta: true
            mensaje: |
              Exacto, y es el mismo mecanismo del golpe de siempre visto desde
              el otro lado. Aguas arriba de una válvula que cierra, el agua se
              amontona contra ella y la presión sube. Aguas abajo, el agua que
              ya había pasado sigue su camino por inercia y nadie la repone: se
              queda un hueco, y la presión baja lo mismo que subiría al otro
              lado.
          - texto: Porque la presión de 6,4 bar es menor que la sobrepresión, y la resta sale negativa
            mensaje: |
              Eso es una consecuencia numérica, no la causa. El signo del golpe
              lo decide de qué lado de la válvula estás, y se sabría antes de
              tener ningún número.
          - texto: Porque el cierre es lento, y los cierres lentos producen depresión
            mensaje: |
              No hay tal relación. Rápido o lento decide **cuánto** vale el
              golpe, con qué fórmula; el signo lo decide el lado de la válvula.
              Un cierre rápido aguas abajo también da depresión, y mayor.
          - texto: Porque el agua, al comprimirse, ocupa menos y deja la tubería en depresión
            mensaje: |
              La compresibilidad del agua está en la celeridad, y es lo que hace
              que el golpe sea finito en vez de infinito. Pero no explica el
              signo: aguas arriba el agua también se comprime y ahí la presión
              sube.

      - tipo: calcular
        titulo: La celeridad
        pregunta: |
          Con $K = 2,2 \cdot 10^{9}$ Pa, $E = 2 \cdot 10^{11}$ Pa, $D = 300$ mm
          y $e = 9$ mm, ¿cuánto vale la celeridad?
        respuesta:
          tipo: magnitud
          valor: '1268.8 m/s'
          tolerancia: 0.005
          formato: la celeridad en m/s
        distractores:
          - valor: '1483.2 m/s'
            mensaje: |
              Ese es $\sqrt{K/\rho}$ a secas, o sea la velocidad del sonido en
              el agua con el tubo **infinitamente rígido**. Te has dejado el
              denominador: el acero se deforma, poco pero se deforma, y por eso
              la onda va algo más despacio.
          - valor: '1085.5 m/s'
            mensaje: |
              Has puesto $D/e$ del revés, o has usado el diámetro en metros y el
              espesor en milímetros. $D/e$ es adimensional: 300 entre 9, o 0,3
              entre 0,009, pero las dos en la misma unidad.
        pista: |
          $D/e = 300/9 = 33{,}3$, y $K/E = 0{,}011$.
        desarrollo: |
          $$
          a = \frac{\sqrt{2{,}2\cdot 10^{9}/1000}}{\sqrt{1+0{,}011 \cdot 33{,}33}}
          = \frac{1483{,}2}{\sqrt{1{,}3667}} = 1268{,}8 \ \text{m/s}
          $$

          El acero apenas la baja: de 1483 a 1269, un 14 %. Con PVC, y con el
          mismo $D/e$, se quedaría por debajo de 400.

      - tipo: calcular
        titulo: La variación de presión
        pregunta: |
          Clasifica el cierre y calcula la variación de presión, en mca. El
          caudal es de 80 l/s por una tubería de 300 mm.
        respuesta:
          tipo: magnitud
          valor: '96.24 mca'
          tolerancia: 0.005
          formato: el valor absoluto de la variación, en mca
        distractores:
          - valor: '146.52 mca'
            mensaje: |
              Has usado Allievi, y el cierre aquí es **lento**: el periodo vale
              $2L/a = 1{,}97$ s y la válvula tarda 3 s, así que la onda vuelve
              antes de que termine de cerrarse y se lleva por delante parte del
              golpe. Con cierre lento manda Michaud.
          - valor: '48.12 mca'
            mensaje: |
              Eso es Jouguet, que es la mitad de Michaud. Se usa cuando el
              enunciado lo pide expresamente; aquí no lo pide, y la fórmula de
              cierre lento del tema es Michaud.
          - valor: '340 mca'
            mensaje: |
              Te has dejado el área: 80 l/s no es la velocidad. Con
              $D = 300$ mm el área es $0{,}0707$ m² y la velocidad sale
              1,13 m/s, no 80.
        pista: |
          Primero $v = Q/A$, luego compara $T_c$ con $2L/a$, y solo entonces
          elige fórmula.
        desarrollo: |
          $$
          v = \frac{Q}{A} = \frac{0{,}080}{\pi \cdot 0{,}3^{2}/4}
          = \frac{0{,}080}{0{,}0707} = 1{,}132 \ \text{m/s}
          $$

          $$
          T = \frac{2L}{a} = \frac{2500}{1268{,}8} = 1{,}97 \ \text{s}
          \;<\; T_c = 3 \ \text{s} \;\Longrightarrow\; \textbf{cierre lento}
          $$

          $$
          |\Delta H| = \frac{2Lv}{g\,T_c}
          = \frac{2 \cdot 1250 \cdot 1{,}132}{9{,}8 \cdot 3}
          = 96{,}24 \ \text{mca}
          $$

          Y como el golpe es negativo, lo que hay aguas abajo es
          $-96{,}24$ mca.

      - tipo: justificar
        pregunta: |
          Falta razonar la gráfica del apartado b). Ordena el argumento. Una
          pieza es falsa.
        piezas:
          - texto: |
              La presión de partida aguas abajo es 6,4 bar, o sea 65,3 mca, y
              al cerrar cae de golpe 96,24 mca: la cuenta pide bajar hasta
              $-31$ mca **relativos**, casi tres atmósferas por debajo de la
              presión atmosférica.
          - texto: |
              Eso es imposible. Por debajo del cero absoluto no hay presión, y
              mucho antes —sobre los $-10$ mca relativos— el agua alcanza su
              presión de vapor y hierve en frío.
          - texto: |
              Así que la gráfica **no** baja hasta $-31$: se aplana en torno a
              $-10$ mca y ahí se queda mientras dura la cavitación. Se forma
              una bolsa de vapor que separa la columna.
          - texto: |
              El peligro no es la depresión en sí, sino lo que viene después:
              cuando la bolsa colapsa, las dos columnas chocan y producen una
              sobrepresión que puede superar con mucho a la que se ha evitado.
          - texto: |
              Y como Michaud da menos que Allievi, el cierre lento garantiza que
              la depresión se quede siempre dentro de lo que el agua aguanta.
            trampa: true
            mensaje: |
              Es justo lo que este ejercicio desmiente. Michaud da menos que
              Allievi —96 frente a 147—, sí, pero 96 ya se sale: el suelo no lo
              pone la fórmula, lo pone la presión de vapor del agua, y aquí
              está a 75 mca de la de partida. Alargar el cierre ayuda; que
              **baste** es una cuenta que hay que hacer, no algo que se pueda
              dar por supuesto.
    resolucion: |
      **La parte que se calcula, y la parte que hay que razonar.**

      **a) El número.** Tres pasos en el orden de siempre, y el orden importa:

      $$
      v = \frac{0{,}080}{\pi\cdot 0{,}3^{2}/4} = 1{,}132 \ \text{m/s}
      \qquad
      a = \frac{1483{,}2}{\sqrt{1+0{,}011\cdot 33{,}33}} = 1268{,}8 \ \text{m/s}
      $$

      $$
      T = \frac{2L}{a} = 1{,}97 \ \text{s} < T_c = 3 \ \text{s}
      \;\Longrightarrow\; \text{cierre lento}
      $$

      $$
      |\Delta H| = \frac{2Lv}{g T_c} = 96{,}24 \ \text{mca}
      $$

      Aguas abajo de la válvula el golpe es **negativo**: $-96{,}24$ mca.

      **b) La gráfica, y por qué no es la del libro.** Lo habitual es dibujar
      la onda rectangular: la presión cae el golpe entero, se mantiene $2L/a$,
      sube otro tanto por encima de la inicial, y así. Aquí esa gráfica no se
      puede dibujar, y verlo es el ejercicio.

      La presión de partida son 6,4 bar $= 65{,}3$ mca. Restar 96,24 daría
      $-31$ mca **relativos**, y eso está por debajo del vacío absoluto: no
      existe. Lo que pasa de verdad es que la presión cae hasta la **presión de
      vapor** del agua —del orden de $-10$ mca relativos a temperatura
      ambiente—, ahí se detiene, y el agua empieza a hervir. Se forma una bolsa
      de vapor que separa la columna en dos.

      La gráfica, por tanto, tiene tres tramos: la caída rápida durante el
      cierre, una **meseta plana** en la presión de vapor mientras la bolsa
      existe, y un **pico** cuando la bolsa colapsa y las dos columnas vuelven
      a juntarse. Ese pico es el que rompe tuberías, y puede ser mayor que la
      sobrepresión que uno estaba intentando evitar.

      **La lección, que es de método.** Michaud y Allievi devuelven un número
      sin preguntar de dónde se parte, y por eso hay que comprobar siempre
      **contra qué** se aplica esa variación. Un golpe de 96 mca sobre una
      conducción a 30 bar es una molestia; el mismo golpe sobre una a 6,4 bar,
      y en negativo, es cavitación. El signo y el punto de partida son parte
      del resultado.
  - id: ejflu20-col714-la-misma-tuberia-con-los-dos-cierres
    titulo: La misma tubería, con los dos tipos de cierre
    fuente: Ejercicio 7.14 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Para regar una huerta se recoge agua de lluvia en el depósito A. Mediante
      una tubería de polietileno PE, con un diámetro de 20 mm, una longitud de
      3,5 m y un espesor de 1 mm, se abastece con un caudal de agua de 1,1 l/s
      el sistema de riego. Al final de la tubería se ha instalado una válvula de
      bola V. En un momento dado, se cierra dicha válvula.

      a) Determinar qué tipo de cierre es y cuál será la sobrepresión producida
      por golpe de ariete para los siguientes tiempos de cierre de la válvula:
      0,2 s y 0,01 s. Razonar la respuesta.

      b) Debido a un fallo de fabricación se ha producido una rotura en la
      tubería. El fabricante nos ofrece como compensación una tubería nueva del
      mismo diámetro, de polipropileno (PP) junto con una válvula neumática cuyo
      tiempo de cierre es de 0,02 s. ¿Cuál debe ser el espesor máximo de la
      tubería para que el cierre sea rápido?

      Datos: módulo de elasticidad del agua $2,1 \cdot 10^{9}$ Pa; módulo de
      elasticidad del PE 900 MPa; módulo de elasticidad del polipropileno PP
      1300 MPa.
    pide: El tipo de cierre y la sobrepresión con cada tiempo, y el espesor máximo del tubo nuevo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tubería mide **3,5 metros**. Antes de calcular nada: ¿qué esperas
          de la frontera entre cierre rápido y lento en una instalación tan
          corta?
        opciones:
          - texto: |
              Que sea muy pequeña: $2L/a$ con $L = 3{,}5$ m son centésimas de
              segundo, así que casi cualquier cierre normal será lento
            correcta: true
            mensaje: |
              Eso es, y es la clave del ejercicio. La frontera son 0,033 s. Un
              cierre de 0,2 s —que en una llave de jardín es prácticamente
              instantáneo para quien la cierra— queda seis veces por encima y
              es **lento**. Para llegar a rápido hace falta una válvula
              neumática. Por eso el golpe de ariete grave es un problema de
              conducciones largas: en las cortas la onda vuelve antes de que
              dé tiempo a cerrar.
          - texto: |
              Que sea grande: al ser corta, la onda recorre poca distancia y
              tarda mucho en volver
            mensaje: |
              Al revés. La onda tarda **menos** en volver cuanto más corto es el
              camino: $T = 2L/a$, y $L$ está arriba. Poca distancia, poco
              tiempo.
          - texto: La longitud no entra en la frontera, solo el tiempo de cierre de la válvula
            mensaje: |
              La frontera es exactamente $T_c$ frente a $2L/a$, y ahí está la
              longitud. Lo que no depende de $L$ es el golpe de un cierre
              rápido —Allievi—, y eso es otra cosa.
          - texto: |
              Que dé igual: en tuberías tan cortas el golpe de ariete es
              despreciable
            mensaje: |
              Es justo lo contrario de lo que sale. Con el cierre de 0,01 s el
              golpe pasa de 75 mca, es decir siete atmósferas y media, en un
              tubo de riego de 20 mm. Corto no significa inofensivo.

      - tipo: calcular
        titulo: La celeridad en el tubo de polietileno
        pregunta: |
          Con $K = 2,1 \cdot 10^{9}$ Pa, $E_{PE} = 9 \cdot 10^{8}$ Pa,
          $D = 20$ mm y $e = 1$ mm, ¿cuánto vale la celeridad?
        respuesta:
          tipo: magnitud
          valor: '209.9 m/s'
          tolerancia: 0.005
          formato: la celeridad en m/s
        distractores:
          - valor: '1449 m/s'
            mensaje: |
              Te has quedado en $\sqrt{K/\rho}$, la velocidad del sonido en el
              agua con el tubo rígido. Aquí el denominador no es un retoque:
              $(K/E)(D/e)$ vale 46,7, así que divide la celeridad por casi siete.
              El polietileno es tan blando que la onda va más despacio que en el
              aire.
          - valor: '104.9 m/s'
            mensaje: |
              Has puesto un 2 de más en algún sitio, probablemente confundiendo
              el radio con el diámetro. $D/e$ es 20 entre 1.
        pista: |
          $(K/E)(D/e) = 2{,}333 \cdot 20 = 46{,}67$.
        desarrollo: |
          $$
          a = \frac{\sqrt{2{,}1\cdot 10^{9}/1000}}{\sqrt{1 + 2{,}333\cdot 20}}
          = \frac{1449{,}1}{\sqrt{47{,}67}} = 209{,}9 \ \text{m/s}
          $$

          Y con ella, la frontera:

          $$
          T = \frac{2L}{a} = \frac{7}{209{,}9} = 0{,}033 \ \text{s}
          $$

          Treinta y tres milésimas. Los dos tiempos del enunciado caen uno a
          cada lado.

      - tipo: calcular
        titulo: El cierre de 0,2 s
        pregunta: |
          Con $T_c = 0{,}2$ s, ¿cuánto vale la sobrepresión en mca? El caudal es
          1,1 l/s por una tubería de 20 mm.
        respuesta:
          tipo: magnitud
          valor: '12.5 mca'
          tolerancia: 0.01
          formato: la sobrepresión en mca
        distractores:
          - valor: '74.99 mca'
            mensaje: |
              Has usado Allievi. Pero 0,2 s es seis veces la frontera de
              0,033 s: la onda ha ido y vuelto seis veces antes de que la
              válvula termine de cerrar, así que el cierre es **lento** y manda
              Michaud.
          - valor: '3.5 mca'
            mensaje: |
              Parece que has puesto la velocidad donde va la altura. 3,5 es la
              velocidad del agua en m/s, y también la longitud en metros:
              cuidado, en este ejercicio coinciden por casualidad.
        pista: |
          Primero $v = Q/A$, y luego compara 0,2 con 0,033.
        desarrollo: |
          $$
          v = \frac{0{,}0011}{\pi\cdot 0{,}02^{2}/4} = 3{,}50 \ \text{m/s}
          $$

          $$
          T_c = 0{,}2 \ \text{s} > \frac{2L}{a} = 0{,}033 \ \text{s}
          \;\Longrightarrow\; \textbf{cierre lento}
          $$

          $$
          \Delta H = \frac{2Lv}{g\,T_c}
          = \frac{2\cdot 3{,}5\cdot 3{,}50}{9{,}8\cdot 0{,}2}
          = 12{,}5 \ \text{mca}
          $$

      - tipo: calcular
        titulo: El cierre de 0,01 s
        pregunta: |
          Y ahora con $T_c = 0{,}01$ s. ¿Cuánto vale la sobrepresión, en mca?
        respuesta:
          tipo: magnitud
          valor: '74.99 mca'
          tolerancia: 0.005
          formato: la sobrepresión en mca
        distractores:
          - valor: '250.1 mca'
            mensaje: |
              Has seguido con Michaud, dividiendo entre 0,01 en vez de entre
              0,2. Michaud aquí no vale: 0,01 s está **por debajo** de la
              frontera de 0,033 s, y por debajo de la frontera el golpe ya no
              baja aunque cierres más deprisa. Ese es el sentido físico de
              Allievi.
          - valor: '37.5 mca'
            mensaje: |
              Has multiplicado por 3 en vez de saltar a Allievi. La razón entre
              los dos golpes no es la razón entre los dos tiempos: en cuanto se
              cruza la frontera, la fórmula cambia.
        pista: |
          0,01 es menor que 0,033. Allievi, y no depende de $L$ ni de $T_c$.
        desarrollo: |
          $$
          T_c = 0{,}01 \ \text{s} < 0{,}033 \ \text{s}
          \;\Longrightarrow\; \textbf{cierre rápido}
          $$

          $$
          \Delta H = \frac{a v}{g} = \frac{209{,}9 \cdot 3{,}50}{9{,}8}
          = 74{,}99 \ \text{mca}
          $$

          **Seis veces el anterior**, por cerrar veinte veces más rápido. Y a
          partir de aquí, por mucho que se acorte el tiempo, el golpe se queda
          en 75: Allievi no tiene $T_c$ dentro.

      - tipo: calcular
        titulo: El espesor máximo del tubo de polipropileno
        pregunta: |
          El tubo nuevo es de PP ($E = 1300$ MPa), del mismo diámetro, y la
          válvula cierra en 0,02 s. ¿Cuál es el espesor **máximo** para que el
          cierre siga siendo rápido?
        respuesta:
          tipo: magnitud
          valor: '2 mm'
          tolerancia: 0.02
          formato: el espesor en mm
        distractores:
          - valor: '1 mm'
            mensaje: |
              Has supuesto que el tubo nuevo tiene que ser igual de delgado que
              el viejo. No: el PP es más rígido que el PE —1300 MPa frente a
              900—, así que admite más espesor antes de que la onda se acelere
              demasiado. La cuenta da justo el doble.
          - valor: '4 mm'
            mensaje: |
              Con 4 mm la celeridad sube por encima de 350 m/s, la frontera se
              queda por debajo de 0,02 s y el cierre pasa a ser lento. Cuidado
              con el sentido de la desigualdad: aquí engrosar **estropea** lo
              que se pide.
        pista: |
          Rápido exige $a < 2L/T_c = 350$ m/s. Despeja $e$ de ahí.
        desarrollo: |
          $$
          a < \frac{2L}{T_c} = \frac{7}{0{,}02} = 350 \ \text{m/s}
          $$

          $$
          \frac{1449{,}1}{\sqrt{1+1{,}6154\cdot 20/e}} < 350
          \;\Longrightarrow\; 1 + \frac{32{,}31}{e} > 17{,}14
          $$

          $$
          e < \frac{32{,}31}{16{,}14} = 2{,}00 \ \text{mm}
          $$

          El espesor máximo es **2 mm**.

      - tipo: justificar
        pregunta: |
          El apartado a) pide razonar la respuesta, no solo darla. Ordena el
          razonamiento. Una pieza es falsa.
        piezas:
          - texto: |
              La frontera entre los dos regímenes es $2L/a = 0{,}033$ s, y sale
              tan pequeña porque la tubería mide 3,5 m: la onda va y vuelve
              treinta veces por segundo.
          - texto: |
              Con $T_c = 0{,}2$ s la válvula tarda seis veces más que eso: la
              onda vuelve, se encuentra la válvula todavía abriendo paso, y
              parte del golpe se descarga hacia el depósito. Cierre lento,
              Michaud, 12,5 mca.
          - texto: |
              Con $T_c = 0{,}01$ s la válvula termina de cerrar antes de que la
              onda vuelva: no hay por dónde descargar y el golpe llega entero.
              Cierre rápido, Allievi, 74,99 mca.
          - texto: |
              Y a partir de ahí cerrar aún más deprisa no cambia nada, porque
              Allievi no depende del tiempo de cierre: 74,99 mca es el techo de
              esta instalación.
          - texto: |
              La diferencia entre los dos casos, seis veces, es la razón entre
              los dos tiempos de cierre: veinte veces menos tiempo daría veinte
              veces más golpe si no hubiera un tope.
            trampa: true
            mensaje: |
              La primera parte de la frase es falsa, y por eso la pieza no
              entra: la razón entre 74,99 y 12,5 no es 20 sino 6, que es
              exactamente $0{,}2/0{,}033$ —la razón entre el tiempo de cierre y
              **la frontera**, no entre los dos tiempos de cierre—. Michaud
              solo manda hasta 0,033 s; por debajo de ahí ya no baja de 75, así
              que las diez milésimas últimas no aportan nada.
    resolucion: |
      **Dos cierres, una tubería, y una frontera de treinta milésimas.**

      Lo primero es medir dónde está la frontera, porque todo lo demás depende
      de a qué lado caiga cada caso:

      $$
      a = \frac{\sqrt{K/\rho}}{\sqrt{1+(K/E)(D/e)}}
      = \frac{1449{,}1}{\sqrt{1+2{,}333\cdot 20}} = 209{,}9 \ \text{m/s}
      \qquad
      T = \frac{2L}{a} = 0{,}033 \ \text{s}
      $$

      Con $v = Q/A = 3{,}50$ m/s:

      | $T_c$ | frente a 0,033 s | régimen | fórmula | $\Delta H$ |
      |---|---|---|---|---|
      | 0,2 s | seis veces mayor | lento | Michaud | **12,5 mca** |
      | 0,01 s | tres veces menor | rápido | Allievi | **74,99 mca** |

      **b) El tubo de repuesto.** Ahora el tiempo de cierre está fijado por la
      válvula neumática —0,02 s— y lo que se busca es el tubo. Rápido exige
      $a < 2L/T_c = 350$ m/s, y despejando de la celeridad con
      $E_{PP} = 1{,}3\cdot 10^{9}$ Pa sale $e < 2{,}00$ mm. Espesor máximo,
      **2 mm**.

      **Lo que este ejercicio enseña y no dice.** La tubería del apartado b) es
      **más rígida** que la original —el PP dobla al PE en módulo— y aun así
      admite el doble de espesor. Las dos cosas empujan en el mismo sentido:
      subir $E$ y subir $e$ suben la celeridad. Lo que pasa es que el PP parte
      de más lejos, y por eso le sobra margen.

      Y una advertencia de fondo. Todo el apartado b) consiste en **conseguir**
      un cierre rápido, que es el que más golpea. No es un despiste del
      enunciado: es el ejercicio pidiendo que domines la condición en los dos
      sentidos. En obra, lo que se busca casi siempre es lo contrario.

  - id: ejflu20-col74-el-espesor-que-depende-de-si-mismo
    titulo: El espesor que depende de sí mismo
    fuente: Ejercicio 7.4 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene una central hidroeléctrica que trabaja con un salto bruto de
      350 m y con un caudal de 0,5 m³/s. La tubería forzada es de acero de
      500 mm de diámetro con una pendiente media de 14,5°. Se desea conocer el
      espesor que deberían tener las paredes de la tubería si se adopta un
      cierre del inyector de la turbina Pelton de 5 s.

      Para el cálculo del espesor se empleará la siguiente fórmula de Barlow:

      $$
      e = \left( \frac{p\,D}{2\,\sigma} + m \right) c
      $$

      donde $p$ es la presión máxima de trabajo de la tubería, $\sigma$ la
      tensión admisible de trabajo del material (15 000 N/cm²), $m$ la
      mayoración por corrosión (2 mm) y $c$ la tolerancia de la laminación
      (1,15). En todo caso se adoptará para el espesor en mm un número entero
      si es menor de 10 y número par si lo supera.

      Módulo de elasticidad del acero $E = 2\cdot 10^{7}$ N/cm².
    pide: El espesor de pared de la tubería forzada, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Mira la cadena de dependencias antes de escribir nada: el espesor sale
          de la presión, la presión incluye el golpe de ariete, el golpe sale de
          la celeridad, y la celeridad depende del espesor. ¿Qué se hace con
          eso?
        opciones:
          - texto: |
              Se supone un golpe de partida, se calcula el espesor, se recalcula
              el golpe con ese espesor y se repite hasta que deje de cambiar
            correcta: true
            mensaje: |
              Iterar. Es la única salida cuando una magnitud entra en su propia
              fórmula, y aquí converge deprisa porque el espesor apenas mueve la
              celeridad. El enunciado no lo dice, pero la solución oficial
              arranca con «se supone una sobrepresión del 50 % del salto bruto»
              justo por esto: hay que empezar por algún sitio.
          - texto: |
              Se despeja: se sustituye la celeridad dentro de Michaud, Michaud
              dentro de Barlow, y sale una ecuación en $e$
            mensaje: |
              Se puede intentar, pero el espesor entra bajo una raíz dentro de
              un denominador y luego sale multiplicando: queda una ecuación que
              no se resuelve a mano, y en el examen no hay calculadora. Iterar
              son dos vueltas de aritmética.
          - texto: Se ignora el golpe de ariete y se dimensiona con el salto bruto, que es el dato firme
            mensaje: |
              Sería dimensionar para 350 mca cuando la tubería va a ver 496. El
              golpe de ariete en una central hidroeléctrica no es una corrección
              fina: aquí vale el 42 % de la presión estática.
          - texto: |
              Se toma el caso peor —cierre instantáneo, Allievi— y así no hace
              falta iterar
            mensaje: |
              Es una salida defendible en un anteproyecto, pero da un tubo mucho
              más caro del necesario, y además tampoco libra de iterar: Allievi
              también lleva la celeridad dentro, y la celeridad sigue
              dependiendo del espesor.

      - tipo: calcular
        titulo: El espesor de la primera vuelta
        pregunta: |
          Suponiendo un golpe del 50 % del salto bruto —175 mca—, la presión de
          trabajo es $350 + 175 = 525$ mca. ¿Qué espesor da Barlow, en mm, antes
          de redondear?
        respuesta:
          tipo: magnitud
          valor: '12.16 mm'
          tolerancia: 0.01
          formato: el espesor en mm, sin redondear
        distractores:
          - valor: '8.575 mm'
            mensaje: |
              Ese es solo el primer término, $pD/2\sigma$. Falta sumarle los
              2 mm de corrosión y multiplicar el conjunto por la tolerancia de
              laminación 1,15: los dos son mayoraciones y van fuera.
          - valor: '11.86 mm'
            mensaje: |
              Has multiplicado por 1,15 solo el primer término y luego has
              sumado los 2 mm. El paréntesis de Barlow encierra los dos: la
              tolerancia de laminación afecta a todo el espesor, corrosión
              incluida.
          - valor: '8.1 mm'
            mensaje: |
              Has usado solo el salto bruto, 350 mca, y te has dejado el golpe
              de ariete. La presión de trabajo es la suma de las dos.
        pista: |
          525 mca son $5{,}145\cdot 10^{6}$ Pa, o sea 514,5 N/cm². Y $D$ en cm.
        desarrollo: |
          $$
          p = (350+175)\cdot 9800 = 5{,}145\cdot 10^{6}\ \text{Pa}
          = 514{,}5\ \text{N/cm}^{2}
          $$

          $$
          e = \left(\frac{514{,}5\cdot 50}{2\cdot 15000} + 0{,}2\right)\cdot 1{,}15
          = (0{,}8575 + 0{,}2)\cdot 1{,}15 = 1{,}216\ \text{cm}
          $$

          Es decir 12,16 mm, y por la regla de redondeo del enunciado —número
          par por encima de 10— se adopta **14 mm**.

      - tipo: calcular
        titulo: El golpe de ariete de verdad
        pregunta: |
          Con $e = 14$ mm, la celeridad es
          $a = 9900/\sqrt{48{,}3 + k\,D/e}$ con $k = 10^{7}/E = 0{,}5$. Calcula
          el golpe real, en mca. La longitud de la tubería sale de la pendiente:
          $L = 350/\operatorname{sen}14{,}5°$.
        respuesta:
          tipo: magnitud
          valor: '146 mca'
          tolerancia: 0.01
          formato: la sobrepresión en mca
        distractores:
          - valor: '175 mca'
            mensaje: |
              Ese es el valor **supuesto** de partida, no el calculado. Todo el
              ejercicio consiste en comprobar si la suposición se sostiene, y no
              se sostiene: sobra un 20 %.
          - valor: '316.5 mca'
            mensaje: |
              Has usado Allievi. Pero el periodo es $2L/a = 2{,}3$ s y el cierre
              dura 5 s: la onda vuelve más de dos veces antes de que el inyector
              termine, así que el cierre es **lento** y manda Michaud.
          - valor: '36.5 mca'
            mensaje: |
              Has tomado $L = 350$ m, que es el **salto**, no la longitud de la
              tubería. La tubería baja con una pendiente de 14,5°, así que mide
              $350/\operatorname{sen}14{,}5° = 1398$ m: cuatro veces más.
        pista: |
          $L = 1398$ m, $v = Q/A = 2{,}55$ m/s, y compara $2L/a$ con los 5 s.
        desarrollo: |
          $$
          a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 500/14}} = 1217\ \text{m/s}
          \qquad L = \frac{350}{\operatorname{sen}14{,}5°} = 1398\ \text{m}
          $$

          $$
          T = \frac{2L}{a} = \frac{2796}{1217} = 2{,}30\ \text{s} < 5\ \text{s}
          \;\Longrightarrow\; \text{cierre lento}
          $$

          $$
          v = \frac{0{,}5}{\pi\cdot 0{,}5^{2}/4} = 2{,}55\ \text{m/s}
          \qquad
          \Delta H = \frac{2Lv}{g\,T_c}
          = \frac{2\cdot 1398\cdot 2{,}55}{9{,}8\cdot 5}
          \approx 146\ \text{mca}
          $$

          Menos que los 175 supuestos, así que el tubo de 14 mm está del lado
          seguro… y **de más**: hay que volver a entrar en Barlow.

      - tipo: calcular
        titulo: El espesor definitivo
        pregunta: |
          Repite Barlow con la presión de trabajo real, $350 + 146 = 496$ mca.
          ¿Qué espesor se adopta, en mm, ya redondeado?
        respuesta:
          tipo: magnitud
          valor: '12 mm'
          tolerancia: 0.02
          formato: el espesor comercial en mm
        distractores:
          - valor: '11.62 mm'
            mensaje: |
              Ese es el valor sin redondear, y está bien calculado. Falta
              aplicar la regla del enunciado: por encima de 10 mm se adopta un
              número **par**, así que 12.
          - valor: '14 mm'
            mensaje: |
              Ese era el de la primera vuelta, con el golpe supuesto de 175 mca.
              Con el golpe real de 146 el tubo baja a 12 mm: son dos milímetros
              de acero en 1,4 km de tubería de medio metro, y eso es el ejercicio.
          - valor: '13 mm'
            mensaje: |
              Has redondeado 11,62 al entero más cercano. El enunciado pide otra
              cosa: por encima de 10 mm, un número **par**. La chapa se fabrica
              en pasos pares, y por eso el redondeo del enunciado no es el de la
              aritmética.
        pista: |
          496 mca son 486,1 N/cm². El resto de la fórmula no cambia.
        desarrollo: |
          $$
          e = \left(\frac{486{,}1\cdot 50}{2\cdot 15000}+0{,}2\right)\cdot 1{,}15
          = (0{,}810+0{,}2)\cdot 1{,}15 = 1{,}162\ \text{cm} = 11{,}62\ \text{mm}
          $$

          Redondeando al par siguiente, **12 mm**.

          Y falta cerrar la iteración: con $e = 12$ mm la celeridad baja a
          1191 m/s, el periodo sube a 2,35 s —sigue por debajo de 5— y Michaud
          da otra vez 146 mca, porque **Michaud no lleva la celeridad dentro**.
          La iteración ha convergido en dos vueltas.

      - tipo: justificar
        pregunta: |
          Ordena el argumento que cierra el problema. Una pieza es falsa.
        piezas:
          - texto: |
              Se parte de un golpe supuesto —175 mca, la mitad del salto—
              porque el espesor no se puede calcular sin una presión y la
              presión no se puede calcular sin el espesor.
          - texto: |
              Con ese supuesto sale $e = 14$ mm, y con 14 mm el golpe real
              resulta ser 146 mca: la suposición era conservadora, y sobra tubo.
          - texto: |
              Rehaciendo Barlow con 146 mca sale $e = 12$ mm, y con 12 mm el
              cierre sigue siendo lento, así que Michaud vuelve a dar 146 mca.
          - texto: |
              La iteración ha convergido: el espesor de entrada y el de salida
              coinciden, y el resultado es $e = 12$ mm.
          - texto: |
              Y converge en dos vueltas porque el espesor apenas mueve el golpe:
              al pasar de 14 a 12 mm la celeridad baja de 1217 a 1191 m/s, pero
              el cierre sigue siendo lento y Michaud no depende de la celeridad.
          - texto: |
              Si el cierre hubiera salido rápido la iteración habría convergido
              igual de rápido, porque Allievi tampoco depende del espesor.
            trampa: true
            mensaje: |
              Es al revés, y es lo que hace especial a este problema. Allievi
              es $a v/g$, y $a$ **sí** depende del espesor: con cierre rápido el
              espesor entraría en el golpe, el golpe en el espesor, y la
              iteración sería una de verdad. Aquí converge en dos vueltas
              precisamente porque el cierre es lento y Michaud rompe el bucle.
    resolucion: |
      **Un problema de dimensionado donde la incógnita se calcula a sí misma.**

      El espesor sale de Barlow, Barlow necesita la presión, la presión incluye
      el golpe de ariete, el golpe necesita la celeridad y la celeridad necesita
      el espesor. Se rompe iterando.

      **Vuelta 1.** Se supone un golpe del 50 % del salto: 175 mca. Presión de
      trabajo $525$ mca $= 514{,}5$ N/cm².

      $$
      e = \left(\frac{514{,}5\cdot 50}{30000}+0{,}2\right)1{,}15 = 12{,}16\ \text{mm}
      \;\longrightarrow\; 14\ \text{mm}
      $$

      **Comprobación.** Con $e = 14$ mm:

      $$
      a = \frac{9900}{\sqrt{48{,}3+0{,}5\cdot 500/14}} = 1217\ \text{m/s}
      \qquad
      L = \frac{350}{\operatorname{sen}14{,}5°} = 1398\ \text{m}
      $$

      $$
      T = \frac{2L}{a} = 2{,}30\ \text{s} < T_c = 5\ \text{s}
      \quad\Longrightarrow\quad
      \Delta H = \frac{2Lv}{gT_c} = \frac{2\cdot 1398\cdot 2{,}55}{49} = 146\ \text{mca}
      $$

      **Vuelta 2.** Presión real $496$ mca $= 486{,}1$ N/cm²:

      $$
      e = \left(\frac{486{,}1\cdot 50}{30000}+0{,}2\right)1{,}15 = 11{,}62\ \text{mm}
      \;\longrightarrow\; \mathbf{12\ mm}
      $$

      **Cierre de la iteración.** Con 12 mm, $a = 1191$ m/s y $T = 2{,}35$ s:
      sigue siendo cierre lento, y Michaud —que no lleva la celeridad dentro—
      devuelve otra vez 146 mca. Entrada y salida coinciden: el resultado es
      **12 mm**.

      **Por qué converge tan rápido, que es lo que hay que llevarse.** Porque el
      cierre es lento. Michaud solo tiene longitud, velocidad, gravedad y tiempo
      de cierre: **ninguno depende del espesor**, así que en cuanto se sabe que
      el cierre es lento el golpe queda fijado y la iteración termina. Si el
      cierre hubiera salido rápido, Allievi habría metido la celeridad —y con
      ella el espesor— dentro del golpe, y habrían hecho falta varias vueltas.

      **Una discrepancia de la fuente, dicha en voz alta.** La solución oficial
      escribe el periodo como $T = 2{,}36$ s, y eso sale de usar 14,1° en esa
      línea; con los 14,5° que da el propio enunciado sale 2,30 s. No cambia
      nada —los dos están muy por debajo de los 5 s del cierre y el régimen es
      lento en los dos casos— pero conviene saber de dónde viene la diferencia
      si comparas cifra a cifra con el boletín.

  - id: ejflu20-col716-la-pelton-del-pirineo-y-su-chimenea
    titulo: La Pelton del Pirineo, y su chimenea de equilibrio
    fuente: Ejercicio 7.16 · Colección de problemas, capítulo 7 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En una central hidroeléctrica de los Pirineos hay instalada una turbina
      Pelton. La tubería forzada que va del embalse a la central es de
      fundición, tiene una longitud de L = 10 km, el diámetro interno es
      D = 630 mm y el espesor e = 10 mm. El caudal turbinado es
      Q = 1,25 m³/s. Se pide:

      **a)** Tiempo de cierre (minutos) del inyector de la turbina, para que
      la sobrepresión no supere los 40 mca. Razonar la resolución.

      **b)** Dicho tiempo de cierre se considera excesivo. Se estudia la
      posibilidad de instalar una chimenea de equilibrio en la tubería
      forzada. Calcular a qué distancia del embalse ha de ser instalada la
      chimenea, si se quiere cerrar el inyector en 30 segundos, limitando la
      sobrepresión a 40 mca.

      **c)** ¿Cuál es la velocidad del sonido en el seno del fluido?

      **Datos:** módulo de elasticidad de la fundición,
      $E = 1\,700\,000$ kg/cm²; módulo de compresibilidad del agua,
      $K = 2100$ MPa.

      **Ayuda:**

      $$
      a = \frac{\sqrt{K/\rho}}{\sqrt{1 + (K/E)(D/e)}}
      $$

      Allievi: $\Delta H = a\,v/g$ · Micheaud: $\Delta H = 2Lv/(g\,T_{cierre})$

