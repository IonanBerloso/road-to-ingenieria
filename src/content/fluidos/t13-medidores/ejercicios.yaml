        <path d="M150,240 V286 H190 V266" fill="none" stroke="var(--alt)" stroke-width="4"/>
        <text x="146" y="302" font-size="10" fill="var(--alt)">s3</text>
        <line x1="122" y1="240" x2="122" y2="266" stroke="var(--faint)" stroke-width="1" marker-start="url(#m323n)" marker-end="url(#m323n)"/>
