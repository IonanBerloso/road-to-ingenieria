        <line x1="80" y1="76" x2="240" y2="76" stroke="var(--alt)" stroke-width="1.6"/>
        <text x="160" y="66" text-anchor="middle" font-size="10.5" fill="var(--ink)">aire</text>
        <text x="160" y="150" text-anchor="middle" font-size="10.5" fill="var(--alt)">aceite · S = 0,72</text>
        <circle cx="160" cy="30" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="160" y1="41" x2="160" y2="46" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="176" y="26" font-size="11" fill="var(--ink)">A</text>
        <path d="M248,70 l10,0 l-5,8 z" fill="var(--alt)"/>
        <text x="262" y="76" font-size="11" fill="var(--ink)">B</text>
        <line x1="240" y1="176" x2="264" y2="176" stroke="var(--ink)" stroke-width="2"/>
        <line x1="240" y1="184" x2="264" y2="184" stroke="var(--ink)" stroke-width="2"/>
        <path d="M264,178 H300" fill="none" stroke="var(--alt)" stroke-width="4.4"/>
        <line x1="300" y1="180" x2="322" y2="180" stroke="var(--live)" stroke-width="2" marker-end="url(#m326l)"/>
        <text x="262" y="166" font-size="11" fill="var(--ink)">C</text>
        <text x="248" y="200" font-size="9.5" fill="var(--faint)">Ø 7,5 cm</text>
        <line x1="60" y1="78" x2="60" y2="178" stroke="var(--faint)" stroke-width="1" marker-start="url(#m326n)" marker-end="url(#m326n)"/>
        <line x1="56" y1="76" x2="78" y2="76" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="56" y1="180" x2="78" y2="180" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="52" y="132" text-anchor="end" font-size="10" fill="var(--faint)">2,7 m</text>
        <text x="14" y="234" font-size="9.5" fill="var(--faint)">sección del depósito: 2 m²</text>
      </svg>
      <figcaption>El aire empuja desde arriba y los 2,7 m de aceite añaden lo suyo: la carga que mueve el chorro es la suma de las dos, y el chorro sale ya contraído a un 65 % del orificio.</figcaption>
      </figure>
    pide: La lectura del manómetro, la altura del Pitot en el chorro y el tiempo en bajar un metro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Lo único que se sabe es que el chorro lleva 5,88 kW. ¿Qué es la
          potencia de un chorro libre?
        opciones:
          - texto: Su energía cinética por unidad de tiempo, γ·Q·V²/2g, con Q el caudal real y V la velocidad real
            correcta: true
            mensaje: |
              Eso es. Fuera del orificio la presión es la atmosférica y el
              chorro está a la cota del orificio: toda su energía es cinética.
              Y hay que usar los valores **reales**, los que ya llevan $C_c$ y
              $C_v$ dentro.
          - texto: γ·Q·H, con H la carga total del depósito
            mensaje: |
              Esa sería la potencia que el depósito entrega si no se perdiera
              nada. El chorro lleva menos, porque el orificio se come una parte:
              exactamente el factor $C_v^{2}$.
          - texto: La presión del aire por el caudal
            mensaje: |
              Le falta la parte que aporta el peso del aceite, los 2,7 m, y le
              sobra suponer que la presión se convierte íntegra en velocidad.
              La potencia del chorro es cinética y se mide con su propia
              velocidad.

      - tipo: calcular
        titulo: La carga total sobre el orificio
        pregunta: |
          Carga total $H$ sobre el orificio, en metros de columna de aceite,
          para que el chorro lleve 5,88 kW.
        respuesta:
          tipo: magnitud
          valor: '18.01 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '19.35 m'
            mensaje: |
              Has puesto la velocidad teórica en la potencia. El chorro sale a
              $C_v\sqrt{2gH}$, no a $\sqrt{2gH}$; el factor $C_v^{2} = 0{,}9025$
              está dentro de la cuenta.
          - valor: '25.03 m'
            mensaje: |
              Has usado la sección del orificio sin contraer. El caudal real es
              $C_c C_v A_0\sqrt{2gH}$, y el chorro solo ocupa el 65 % del
              orificio.
          - valor: '13.83 m'
            mensaje: |
              Has usado el peso específico del agua. El fluido es aceite:
              $\gamma = 0{,}72 \cdot 9\,800 = 7\,056$ N/m³.
        pista: |
          $P = \gamma\,Q\,\dfrac{V^{2}}{2g}$ con $Q = C_c C_v A_0\sqrt{2gH}$ y
          $V = C_v\sqrt{2gH}$, así que
          $P = \gamma\,C_c C_v^{3} A_0 \sqrt{2g}\;H^{3/2}$.
        desarrollo: |
          $$
          5\,880 = 7\,056 \cdot 0{,}65 \cdot 0{,}95^{3} \cdot 4{,}418\cdot 10^{-3} \cdot \sqrt{19{,}6}\;H^{3/2} \;\Longrightarrow\; H^{3/2} = 76{,}5
          $$

          $$
          H = 18{,}01\ \text{m de columna de aceite}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro
        pregunta: |
          Presión que marca el manómetro A, en MPa. La lámina está 2,7 m por
          encima del orificio.
        respuesta:
          tipo: magnitud
          valor: '0.108 MPa'
          tolerancia: 0.01
          formato: una presión con su unidad (Pa, kPa o MPa)
        distractores:
          - valor: '0.127 MPa'
            mensaje: |
              Te has olvidado de restar los 2,7 m de aceite. El manómetro solo
              mide la presión del **aire**; el peso de la columna se suma
              después, ya dentro del depósito.
          - valor: '0.0186 MPa'
            mensaje: |
              Has restado al revés, o has tomado los 2,7 m como la carga total.
              Los 2,7 m son una parte pequeña de los 18 m: el aire pone los
              15,3 restantes.
          - valor: '0.150 MPa'
            mensaje: |
              Has convertido con el peso específico del agua. La altura está en
              columna de **aceite**: $p = 15{,}31 \cdot 7\,056$ Pa.
        pista: |
          $H = p_A/\gamma + 2{,}7$, y de ahí $p_A = \gamma\,(H - 2{,}7)$.
        desarrollo: |
          $$
          \frac{p_A}{\gamma} = 18{,}01 - 2{,}7 = 15{,}31\ \text{m} \qquad p_A = 15{,}31 \cdot 7\,056 = 108\,000\ \text{Pa} = 0{,}108\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El Pitot en el chorro
        pregunta: |
          Altura que marcaría un Pitot colocado a la salida del chorro, en
          metros de columna de aceite.
        respuesta:
          tipo: magnitud
          valor: '16.26 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '18.01 m'
            mensaje: |
              Esa es la carga total del depósito. El Pitot mide lo que el
              chorro **conserva** después del orificio, que es $C_v^{2}$ veces
              menos: el 9,75 % se ha perdido por el camino.
          - valor: '17.11 m'
            mensaje: |
              Has multiplicado por $C_v$ una sola vez. El Pitot mide una
              altura de velocidad, $V^{2}/2g$, así que el coeficiente entra al
              cuadrado.
        pista: |
          El Pitot enfrentado al chorro lee $V^{2}/2g$, y
          $V = C_v\sqrt{2gH}$.
        desarrollo: |
          $$
          \frac{V^{2}}{2g} = C_v^{2}\,H = 0{,}9025 \cdot 18{,}01 = 16{,}26\ \text{m}
          $$

          Es el balance del orificio dicho en metros: de los 18,01 m
          disponibles, el chorro se lleva 16,26 y 1,75 se quedan en el
          rozamiento de la contracción.

      - tipo: calcular
        titulo: El tiempo en bajar un metro
        pregunta: |
          Tiempo que tarda la lámina en descender 1 m, con la presión del aire
          mantenida constante en la calculada.
        respuesta:
          tipo: magnitud
          valor: '39.6 s'
          tolerancia: 0.01
          formato: un tiempo con su unidad (s)
        distractores:
          - valor: '39.0 s'
            mensaje: |
              Has supuesto el caudal constante en su valor inicial, 51,3 l/s.
              Baja mientras el nivel baja, así que el tiempo real es un poco
              mayor: hay que integrar.
          - valor: '25.7 s'
            mensaje: |
              Has usado el caudal teórico, sin $C_d$. Del orificio sale un
              61,75 % de lo que saldría sin pérdidas ni contracción.
        pista: |
          $A\,dz = -Q\,dt$ con $Q = C_dA_0\sqrt{2gz}$, y $z$ va de 18,01 a
          17,01 porque la presión del aire no cambia.
        desarrollo: |
          $$
          t = \frac{A}{C_d A_0\sqrt{2g}}\int_{17{,}01}^{18{,}01}\frac{dz}{\sqrt{z}} = \frac{2 \cdot 2\left(\sqrt{18{,}01}-\sqrt{17{,}01}\right)}{0{,}6175 \cdot 4{,}418\cdot 10^{-3} \cdot 4{,}427} = 39{,}6\ \text{s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del orificio. Una pieza es falsa.
        piezas:
          - texto: 'La potencia del chorro es cinética y se calcula con los valores reales, así que en ella aparecen Cc una vez y Cv tres veces.'
          - texto: 'De ahí sale la carga total, 18,01 m de aceite; quitando los 2,7 m de columna queda la presión del aire, 0,108 MPa.'
          - texto: 'Al vaciarse un metro, la carga pasa de 18,01 a 17,01 porque la presión del aire se mantiene: el caudal baja y hay que integrar.'
          - texto: 'Como la presión del aire se mantiene constante, el caudal de salida también, y el tiempo es simplemente el volumen entre el caudal.'
            trampa: true
            mensaje: |
              La presión del aire se mantiene, pero la carga total no: incluye
              la columna de aceite, que se acorta un metro. El caudal cae de
              51,3 a 49,8 l/s. Aquí la diferencia con la cuenta directa es
              pequeña —39,0 frente a 39,6 s— porque un metro sobre 18 es poco;
              en un depósito que se vacía del todo esa misma hipótesis se
              equivoca por completo.
    resolucion: |
      **La cadena, en un orden que no es el de los apartados.** El único dato
      medido es la potencia del chorro, así que de ahí sale todo lo demás.

      **La carga total** (paso previo al apartado a). Fuera del orificio el
      chorro solo tiene energía cinética, y hay que escribirla con los valores
      reales:

      $$
      P = \gamma\,Q\,\frac{V^{2}}{2g}, \qquad Q = C_cC_vA_0\sqrt{2gH}, \qquad V = C_v\sqrt{2gH}
      $$

      $$
      P = \gamma\,C_cC_v^{3}A_0\sqrt{2g}\;H^{3/2} \;\Longrightarrow\; H = 18{,}01\ \text{m de aceite}
      $$

      **El manómetro** (a). De esos 18,01 m, la columna de aceite pone 2,7 y el
      aire el resto:

      $$
      p_A = (18{,}01 - 2{,}7)\cdot 7\,056 = 108\,000\ \text{Pa} = 0{,}108\ \text{MPa}
      $$

      **El Pitot** (b). Mide la altura de velocidad del chorro, que es
      $C_v^{2}$ veces la carga: $0{,}9025 \cdot 18{,}01 = 16{,}26$ m. Publicado:
      16,25.

      **El vaciado** (c). El aire mantiene su presión, pero la columna de
      aceite se acorta, así que la carga baja de 18,01 a 17,01 m:

      $$
      t = \frac{2A\left(\sqrt{H_1}-\sqrt{H_2}\right)}{C_dA_0\sqrt{2g}} = 39{,}6\ \text{s}
      $$

      Publicado: 39,58 s.

      **Los tres coeficientes, y dónde entra cada uno.** $C_c$ solo afecta al
      caudal; $C_v$ afecta a la velocidad, y por tanto entra **al cuadrado** en
      cualquier altura y **al cubo** en la potencia. Por eso la potencia del
      chorro es un dato tan sensible: un error del 1 % en $C_v$ mueve la
      potencia un 3 %.
  - id: ejflu13-col323-tres-manometros-y-un-solo-caudal
    titulo: Tres manómetros distintos midiendo el mismo caudal
    fuente: Ejercicio 3.23 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En el sistema esquematizado en la figura se pide:

      a) Caudal circulante.

      b) Diferencia de niveles R.

