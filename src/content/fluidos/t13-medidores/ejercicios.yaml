ejercicios:
  # ── Los tres son NUESTROS (§08). El capítulo 3 de la colección arranca con
  #    instalaciones completas; estos tres aíslan cada aparato para que la
  #    receta —Bernoulli, hidrostática, igualar— se use una vez por separado.
  - id: ejflu13-el-tubo-de-pitot
    titulo: La velocidad que marca un tubo de Pitot
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería circula agua. Un tubo de Pitot combinado con un
      piezómetro marca una diferencia de $15\ \text{cm}$ en un manómetro de
      mercurio ($s_0 = 13{,}6$).

      Calcular la velocidad del agua en ese punto.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: La velocidad del agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          El Pitot mide la presión total y el piezómetro la estática. ¿Qué
          representa su diferencia?
        opciones:
          - texto: >-
              La presión **dinámica**, $v^{2}/2g$: total menos estática. De
              ahí sale la velocidad
            correcta: true
            mensaje: |
              Eso es. Un aparato solo no da la velocidad: hace falta restar
              dos medidas, y esa resta es exactamente la altura cinética.
          - texto: >-
              La pérdida de carga entre los dos puntos
            mensaje: |
              Están en el **mismo** punto del flujo, así que no hay pérdida
              entre ellos. Lo que los distingue es que uno frena el fluido
              (Pitot) y el otro no (piezómetro).
          - texto: >-
              La diferencia de cotas entre las dos tomas
            mensaje: |
              Las cotas se cancelan al estar los dos en el mismo punto. Lo que
              queda es la energía cinética.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '6.09 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.32 m/s'
            mensaje: |
              Has usado $s_0 = 13{,}6$ sin restarle el 1 del agua. El
              desnivel de mercurio está compensado por agua al otro lado, así
              que el factor es $13{,}6-1 = 12{,}6$.
          - valor: '1.71 m/s'
            mensaje: |
              Has olvidado el factor de densidades: $\sqrt{2gR}$ solo valdría
              si el manómetro fuera del mismo líquido que el flujo, y
              entonces no mediría nada.
        pista: |
          v = √(2·g·R·(s₀/s − 1)), con R = 0,15 m y s₀/s = 13,6.
        desarrollo: |
          $$
          v = \sqrt{2gR\left(\frac{s_0}{s}-1\right)}
          = \sqrt{2\cdot9{,}8\cdot0{,}15\cdot12{,}6} = 6{,}09\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En la boca del Pitot el fluido se estanca: $v = 0$, y el tubo
              marca $P/\gamma + v^{2}/2g$.
          - texto: >-
              El piezómetro marca solo $P/\gamma$, porque su toma es paralela
              al flujo y no lo frena.
          - texto: >-
              La diferencia entre los dos es $v^{2}/2g$.
          - texto: >-
              Recorriendo el manómetro, esa diferencia vale
              $R\left(s_0/s - 1\right) = 0{,}15\cdot12{,}6 = 1{,}89\ \text{mca}$.
          - texto: >-
              $v = \sqrt{2g\cdot1{,}89} = 6{,}09\ \text{m/s}$.
          - texto: >-
              Si se usara un manómetro de agua en vez de mercurio, la lectura
              $R$ sería la misma pero más fácil de leer.
            trampa: true
            mensaje: |
              Con agua a los dos lados el factor $(s_0/s-1)$ vale **cero** y
              el manómetro no marca nada. El líquido manométrico tiene que
              ser distinto —y más denso— que el del flujo: es lo que hace
              posible la medida.

    resolucion: |
      La diferencia entre la presión total (Pitot) y la estática (piezómetro)
      es la altura cinética, y el manómetro la mide:

      $$
      \frac{v^{2}}{2g} = R\left(\frac{s_0}{s}-1\right) = 0{,}15\cdot12{,}6 = 1{,}89\ \text{mca}
      $$
      $$
      \boxed{v = \sqrt{2g\cdot1{,}89} = 6{,}09\ \text{m/s}}
      $$

      > **La misma fórmula sirve para el tubo de Prandtl**, que mete el Pitot
      > y el tubo estático en una sola sonda. Es el que llevan los aviones, y
      > es la razón de que una sonda helada dé velocidades falsas: si se
      > obstruye la toma estática, la resta deja de ser la altura cinética.

  - id: ejflu13-el-venturimetro
    titulo: El caudal que mide un venturímetro
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      En una tubería de $300\ \text{mm}$ por la que circula agua se instala
      un venturímetro con garganta de $150\ \text{mm}$. El manómetro
      diferencial de mercurio ($s_0 = 13{,}6$) marca $R = 25\ \text{cm}$.

      a) Calcular el caudal teórico.

      b) Calcular el caudal real si el coeficiente del venturímetro es
      $C_v = 0{,}98$.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: El caudal teórico y el real.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la fórmula del venturímetro aparece
          $\sqrt{1-(A_2/A_1)^{2}}$ en el denominador. ¿Por qué?
        opciones:
          - texto: >-
              Porque la velocidad aguas arriba **no es cero**: hay que
              descontar la energía cinética que el flujo ya traía
            correcta: true
            mensaje: |
              Eso es. Si la garganta fuera minúscula frente a la tubería, la
              velocidad de entrada sería despreciable y el término
              desaparecería. Con $D_2/D_1 = 0{,}5$ vale $0{,}968$: corrige un
              3 %.
          - texto: >-
              Porque el chorro se contrae en la garganta
            mensaje: |
              Eso es el coeficiente de contracción, y en un venturímetro
              vale **1** precisamente porque el estrechamiento es suave y el
              chorro llena la garganta. El término del denominador es otra
              cosa.
          - texto: >-
              Para convertir el caudal en velocidad
            mensaje: |
              Esa conversión es el $A_2$ que multiplica. El radical corrige
              por la velocidad de aproximación.

      - tipo: calcular
        titulo: La velocidad en la garganta
        pregunta: |
          ¿Cuál es la velocidad teórica en la garganta?
        respuesta:
          tipo: magnitud
          valor: '8.115 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '7.858 m/s'
            mensaje: |
              Te has dejado el denominador $\sqrt{1-(A_2/A_1)^{2}}$, que aquí
              vale $0{,}968$ y sube el resultado un 3 %.
          - valor: '2.213 m/s'
            mensaje: |
              Has olvidado el factor $(s_0/s-1) = 12{,}6$ del manómetro de
              mercurio.
        pista: |
          v₂ = √(2·g·R·12,6) dividido por √(1 − (A₂/A₁)²), con A₂/A₁ = 0,25.
        desarrollo: |
          $$
          \frac{A_2}{A_1} = \left(\frac{150}{300}\right)^{2} = 0{,}25
          \qquad
          \sqrt{1-0{,}25^{2}} = 0{,}968
          $$
          $$
          v_{2t} = \frac{\sqrt{2\cdot9{,}8\cdot0{,}25\cdot12{,}6}}{0{,}968}
          = \frac{7{,}858}{0{,}968} = 8{,}115\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          Con $C_v = 0{,}98$, ¿cuál es el caudal real?
        respuesta:
          tipo: magnitud
          valor: '140.5 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '143.4 l/s'
            mensaje: |
              Ese es el caudal **teórico**, sin aplicar el coeficiente. El
              real es un 2 % menor: $0{,}98\cdot143{,}4$.
          - valor: '562 l/s'
            mensaje: |
              Has usado el área de la tubería ($300\ \text{mm}$) en vez de la
              de la garganta. La velocidad calculada es la de la garganta, así
              que va con $A_2$.
        pista: |
          Q = Cv · v₂ · A₂, con A₂ = π·0,15²/4.
        desarrollo: |
          $$
          A_2 = \frac{\pi\cdot0{,}15^{2}}{4} = 0{,}01767\ \text{m}^{2}
          $$
          $$
          Q_t = 8{,}115\cdot0{,}01767 = 0{,}1434\ \text{m}^{3}/\text{s}
          \qquad
          Q_r = 0{,}98\cdot143{,}4 = 140{,}5\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la tubería y la garganta, más continuidad, más
              hidrostática en el manómetro.
          - texto: >-
              La lectura del manómetro da
              $R(s_0/s-1) = 0{,}25\cdot12{,}6 = 3{,}15\ \text{mca}$ de
              diferencia de alturas piezométricas.
          - texto: >-
              $v_{2t} = \sqrt{2g\cdot3{,}15}/\sqrt{1-0{,}25^{2}} = 8{,}115\ \text{m/s}$.
          - texto: >-
              $Q_t = v_{2t}A_2 = 143{,}4\ \text{l/s}$ y
              $Q_r = 0{,}98\,Q_t = 140{,}5\ \text{l/s}$.
          - texto: >-
              En un venturímetro $C_c = 1$, así que su único coeficiente es el
              de velocidad.
          - texto: >-
              Como el venturímetro está inclinado o no, la lectura $R$
              cambiaría, y por eso hay que dar siempre la cota de las tomas.
            trampa: true
            mensaje: |
              **La inclinación no afecta**: al recorrer el manómetro, los
              términos de cota se cancelan con los del propio conducto. Por
              eso la fórmula solo tiene $R$ y no aparece $z$ — y por eso un
              venturímetro se puede montar en vertical sin recalcular nada.

    resolucion: |
      $$
      \boxed{v_{2t} = \frac{\sqrt{2gR(s_0/s-1)}}{\sqrt{1-(A_2/A_1)^{2}}}
      = \frac{7{,}858}{0{,}968} = 8{,}115\ \text{m/s}}
      $$
      $$
      \boxed{Q_t = 143{,}4\ \text{l/s}}
      \qquad
      \boxed{Q_r = C_v\,Q_t = 140{,}5\ \text{l/s}}
      $$

      > **Los tres ingredientes, siempre los mismos.** Bernoulli da la
      > relación entre presión y velocidad; la continuidad relaciona las dos
      > velocidades; y la hidrostática traduce la lectura del manómetro. La
      > fórmula del formulario es el resultado de juntar esas tres, y merece
      > la pena saber deducirla porque el examen a veces pide justo eso.

  - id: ejflu13-orificio-y-vaciado
    titulo: Un orificio, sus coeficientes y cuánto tarda en vaciarse el depósito
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito abierto de $6\ \text{m}^{2}$ de sección tiene en el fondo
      un orificio de $80\ \text{mm}$ de diámetro, con
      $C_v = 0{,}98$ y $C_c = 0{,}62$. El nivel inicial es de
      $4\ \text{m}$.

      a) Calcular el caudal real que sale al principio.

      b) Calcular el tiempo que tarda en vaciarse por completo.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: El caudal real inicial y el tiempo de vaciado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «se vacía», así que el nivel baja. ¿Se puede
          usar Bernoulli?
        opciones:
          - texto: >-
              Sí, **en cada instante**: el nivel baja tan despacio que el
              flujo se puede tratar como permanente en cada momento, y luego
              se integra
            correcta: true
            mensaje: |
              Eso es la cuarta hipótesis levantada del tema 12. La ecuación
              del vaciado sale de igualar lo que sale por el orificio con lo
              que desciende el nivel, y después integrar.
          - texto: >-
              No: Bernoulli exige régimen permanente y aquí no lo hay
            mensaje: |
              Estrictamente no lo hay, pero la variación es lenta y esa es
              justamente la hipótesis que se puede relajar. Si no, no habría
              forma de resolver ningún vaciado.
          - texto: >-
              Sí, porque el depósito es grande y el nivel no cambia
            mensaje: |
              El nivel **sí** cambia: por eso el depósito se vacía. Lo que
              permite usar Bernoulli no es que no cambie, sino que cambie
              despacio.

      - tipo: calcular
        titulo: El caudal real inicial
        pregunta: |
          ¿Qué caudal sale con el nivel en $4\ \text{m}$?
        respuesta:
          tipo: magnitud
          valor: '27.04 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '44.51 l/s'
            mensaje: |
              Ese es el caudal **teórico**, $A_0\sqrt{2gh}$. Falta multiplicar
              por $C_d = C_vC_c = 0{,}608$.
          - valor: '19.12 l/s'
            mensaje: |
              Te has dejado el 2 de $\sqrt{2gh}$: con $\sqrt{gh}$ sale un
              factor $\sqrt2$ menos. La cota se convierte en altura cinética
              como $h = v^{2}/2g$, y al despejar aparece el 2.
        pista: |
          Q = Cv·Cc·A₀·√(2gh), con A₀ = π·0,08²/4.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot0{,}08^{2}}{4} = 5{,}027\cdot10^{-3}\ \text{m}^{2}
          \qquad
          v_t = \sqrt{2\cdot9{,}8\cdot4} = 8{,}854\ \text{m/s}
          $$
          $$
          Q_r = 0{,}98\cdot0{,}62\cdot5{,}027\cdot10^{-3}\cdot8{,}854
          = 0{,}02704\ \text{m}^{3}/\text{s} = 27{,}04\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El tiempo de vaciado
        pregunta: |
          ¿Cuánto tarda en vaciarse del todo?
        respuesta:
          tipo: magnitud
          valor: '1775 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '887 s'
            mensaje: |
              Eso es el volumen inicial dividido por el caudal inicial, que
              supondría caudal constante. Pero el caudal **disminuye** al
              bajar el nivel, así que tarda el doble.
          - valor: '3550 s'
            mensaje: |
              Un factor 2 de más: la fórmula es
              $t = 2A_{\text{dep}}\sqrt{h}/(C_dA_0\sqrt{2g})$, con el 2 ya
              incluido.
        pista: |
          t = 2·A_dep·(√h_ini − √h_fin) / (C_d·A₀·√(2g)).
        desarrollo: |
          $$
          t = \frac{2\,A_{\text{dep}}\left(\sqrt{h_{\text{ini}}}-\sqrt{h_{\text{fin}}}\right)}
          {C_d\,A_0\sqrt{2g}}
          = \frac{2\cdot6\cdot2}{0{,}608\cdot5{,}027\cdot10^{-3}\cdot4{,}427}
          = 1775\ \text{s}
          $$

          Unos **30 minutos**. Y el doble de lo que daría suponer caudal
          constante, que es la comprobación de que el vaciado se frena.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Torricelli da la velocidad teórica, $v_t = \sqrt{2gh}$, que con
              $h = 4\ \text{m}$ vale $8{,}85\ \text{m/s}$.
          - texto: >-
              El caudal real lleva los dos coeficientes:
              $C_d = C_vC_c = 0{,}608$, y sale $27{,}04\ \text{l/s}$.
          - texto: >-
              Para el vaciado: $Q_r\,dt = -A_{\text{dep}}dh$, y se integra
              entre $4\ \text{m}$ y $0$.
          - texto: >-
              $t = 1775\ \text{s}$, unos treinta minutos.
          - texto: >-
              El tiempo va con $\sqrt{h}$, así que vaciar de 4 a 1 metro tarda
              la mitad que de 1 a 0... no: tarda el doble, porque
              $\sqrt4-\sqrt1 = 1$ y $\sqrt1-\sqrt0 = 1$ son iguales.
            trampa: true
            mensaje: |
              Pieza escrita para tropezar, y los dos números que da son
              correctos pero la conclusión sobra: $\sqrt4-\sqrt1 = 1$ y
              $\sqrt1-\sqrt0 = 1$ son **iguales**, así que los dos tramos
              tardan **lo mismo** — y eso es lo interesante, porque el primero
              tiene tres metros de agua y el segundo solo uno.

    resolucion: |
      **a) El caudal inicial:**

      $$
      \boxed{Q_r = C_vC_c\,A_0\sqrt{2gh} = 0{,}608\cdot5{,}027\cdot10^{-3}\cdot8{,}854
      = 27{,}04\ \text{l/s}}
      $$

      **b) El tiempo**, integrando $Q_r\,dt = -A_{\text{dep}}\,dh$:

      $$
      \boxed{t = \frac{2A_{\text{dep}}\sqrt{h_{\text{ini}}}}{C_dA_0\sqrt{2g}}
      = 1775\ \text{s} \approx 30\ \text{min}}
      $$

      > **Por qué el vaciado tarda el doble de lo que parece.** Con el caudal
      > inicial constante saldrían 887 s; pero el caudal cae con
      > $\sqrt{h}$, y el resultado es exactamente el doble. De ahí también
      > que los últimos centímetros tarden tanto: bajar de 1 a 0 metros lleva
      > el mismo tiempo que bajar de 4 a 1.

  # ── COLECCIÓN 3.15. El sifón limitado por la cavitación: el caudal máximo
  #    no lo pone la geometría sino la presión de vapor en el punto alto.
  - id: ejflu13-col315-el-sifon-limitado-por-la-cavitacion
    titulo: El caudal máximo de un sifón antes de que cavite
    fuente: >-
      Ejercicio 3.15 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un sifón que permite la salida del agua de un recipiente de grandes
      dimensiones está constituido por un tubo de $10\ \text{cm}$ de diámetro,
      en el cual la línea central superior se encuentra $4\ \text{m}$ por
      encima de la superficie libre del depósito. Se pide:

      a) Caudal máximo que puede obtenerse con este dispositivo sin que se
      produzca cavitación.

      b) Cota de salida del sifón con relación al nivel superior del depósito.

      Dato: tensión de vapor máxima del líquido $= 1\ \text{mca}$ (presión
      absoluta); $p_{\text{atm}} = 1\ \text{bar}$.

      Nota: la cavitación teórica se produce en aquel punto en que su presión
      es equivalente a la tensión de vapor máxima del líquido que fluye.
    pide: El caudal máximo sin cavitación y la cota de salida del sifón.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el punto crítico de un sifón y por qué?
        opciones:
          - texto: >-
              En el vértice, porque es donde se juntan la máxima cota y la
              velocidad de circulación: los dos términos restan presión
            correcta: true
            mensaje: |
              Eso es. Bernoulli desde la superficie del depósito hasta el
              vértice: la altura ganada y la energía cinética salen las dos de
              la presión, y por eso allí es mínima.
          - texto: >-
              En la salida, porque es donde el agua va más deprisa
            mensaje: |
              En la salida la presión es la atmosférica —el chorro descarga al
              aire— así que no puede cavitar. Y la velocidad es la misma que en
              el vértice, porque el tubo tiene sección constante.
          - texto: >-
              En la superficie del depósito, porque allí la presión es cero
            mensaje: |
              Allí la presión es la atmosférica, que es la **mayor** de todo el
              recorrido. Desde ahí el sifón solo puede perder presión.

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Qué caudal máximo admite el sifón?
        respuesta:
          tipo: magnitud
          valor: '79.3 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '86.61 l/s'
            mensaje: |
              Te has dejado la tensión de vapor. El límite no es el vacío
              absoluto sino $1\ \text{mca}$ de presión absoluta: por debajo de
              eso el agua hierve.
          - valor: '105.5 l/s'
            mensaje: |
              Te has dejado los $4\ \text{m}$ del vértice. El agua tiene que
              **subir** esa altura antes de bajar, y esos cuatro metros salen
              del mismo presupuesto de presión que la velocidad.
        pista: |
          Bernoulli desde la superficie hasta el vértice, con la presión
          manométrica allí igual a $p_v - p_{\text{atm}}$.
        desarrollo: |
          $$
          p_{\text{atm}} = 1\ \text{bar} = 10{,}2\ \text{mca}
          \qquad
          \frac{p_{\text{vértice}}}{\gamma} = 1 - 10{,}2 = -9{,}2\ \text{mca}
          $$
          $$
          0 = -9{,}2 + \frac{v^{2}}{2g} + 4
          \;\Longrightarrow\;
          \frac{v^{2}}{2g} = 5{,}20\ \text{m}
          \;\Longrightarrow\;
          v = 10{,}10\ \text{m/s}
          $$
          $$
          Q = 10{,}10\cdot\frac{\pi\,0{,}1^{2}}{4} = 0{,}0793\ \text{m}^{3}/\text{s}
          = 79{,}3\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La cota de salida
        pregunta: |
          ¿A qué cota, respecto del nivel del depósito, tiene que estar la
          salida?
        respuesta:
          tipo: magnitud
          valor: '-5.2 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad (y con su signo)
        distractores:
          - valor: '-9.2 m'
            mensaje: |
              Esa es la presión manométrica en el vértice, no una cota. La cota
              de salida sale de Bernoulli entre la superficie y la salida,
              donde la presión vuelve a ser atmosférica.
          - valor: '-1.2 m'
            mensaje: |
              Parece que has restado los 4 m del vértice en vez de dejarlos
              fuera. Entre la superficie y la salida, la altura del vértice no
              interviene: solo entran la cota de salida y la altura cinética.
        pista: |
          Bernoulli entre la superficie del depósito y la salida: las dos a
          presión atmosférica.
        desarrollo: |
          $$
          0 = 0 + \frac{v^{2}}{2g} + z_s
          \;\Longrightarrow\;
          z_s = -\frac{v^{2}}{2g} = -5{,}20\ \text{m}
          $$

          Es decir, la salida tiene que estar $5{,}2\ \text{m}$ **por debajo**
          del nivel del depósito.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto crítico es el vértice: allí la cota y la velocidad
              restan presión a la vez, y allí es donde puede alcanzarse la
              tensión de vapor.
          - texto: >-
              Con $1\ \text{mca}$ absolutos de límite y la atmosférica en
              10,2, la presión manométrica máxima admisible en el vértice es
              $-9{,}2$ mca.
          - texto: >-
              De ahí sale $v = 10{,}1$ m/s y $Q = 79{,}3$ l/s, y la salida
              tiene que estar 5,2 m por debajo del depósito.
          - texto: >-
              Si se bajara aún más la salida, el caudal seguiría creciendo
              mientras el sifón esté cebado.
            trampa: true
            mensaje: |
              Crecería la **velocidad teórica**, sí, pero el vértice ya está en
              el límite: bajar más la salida haría cavitar el sifón, se rompería
              la vena líquida y el caudal **caería**. Los 5,2 m no son una
              elección, son el máximo que la cavitación permite.

    resolucion: |
      **El sifón funciona porque la atmosférica empuja**, y ese es todo su
      límite: no puede aspirar más de lo que la atmósfera da, y ni siquiera
      eso, porque antes el agua hierve.

      **a) El punto crítico y el caudal.** Bernoulli desde la superficie hasta
      el vértice, con la presión allí igual a la de vapor:

      $$
      0 = \underbrace{(1-10{,}2)}_{-9{,}2\ \text{mca}} + \frac{v^{2}}{2g} + 4
      \;\Longrightarrow\;
      \frac{v^{2}}{2g} = 5{,}20\ \text{m}
      \;\Longrightarrow\;
      Q = 79{,}3\ \text{l/s}
      $$

      **b) La cota de salida.** Entre la superficie y la salida, las dos a
      presión atmosférica:

      $$
      z_s = -\frac{v^{2}}{2g} = -5{,}2\ \text{m}
      $$

      **Cómo leer los dos resultados juntos.** El presupuesto de presión del
      sifón es de $10{,}2$ mca —lo que da la atmósfera—, y se gasta en tres
      cosas: $4$ m en subir hasta el vértice, $5{,}2$ en acelerar el agua y
      $1$ mca que hay que dejar sin gastar para que no hierva. Suman
      exactamente $10{,}2$.

      Eso convierte el problema en un reparto: **si se sube el vértice, hay
      que renunciar a caudal**; si se quiere más caudal, hay que bajar el
      vértice. Y por encima de unos $8\ \text{m}$ de vértice ya no queda nada
      para la velocidad: un sifón de agua no puede pasar por encima de esa
      altura, por larga que sea la manguera.

      > **Nota sobre el resultado publicado.** El boletín da $80{,}3$ l/s y
      > $-5{,}3$ m, que corresponden a tomar la atmosférica como
      > $10{,}33\ \text{mca}$ —una atmósfera— en vez de $1\ \text{bar} =
      > 10{,}2$, que es lo que dice el enunciado. La diferencia es del 1,2 % y
      > las dos respuestas se dan por buenas.

  # ── COLECCIÓN 3.14. El mismo sifón, pero con boquilla y con pérdidas, y con
  #    un apartado que invierte la pregunta: hasta dónde se puede subir el
  #    vértice antes de cavitar.
  - id: ejflu13-col314-el-sifon-con-boquilla-y-perdidas
    titulo: Un sifón con boquilla, primero ideal y luego con pérdidas
    fuente: >-
      Ejercicio 3.14 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito cuya lámina de agua está en la cota $4{,}5$ descarga a través
      de una boquilla $S$, por medio del sifón $BCD$. La cota superior
      $z_C = 6\ \text{m}$ y la inferior $z_S = 2\ \text{m}$.

      El sifón es una tubería de $D = 50\ \text{mm}$. El factor de paso de
      pérdidas de carga entre $B$ y $C$ es $K_{BC} = 1$ y entre $C$ y $D$ es
      $K_{CD} = 1{,}2$. El factor de paso adimensional de la boquilla, con la
      energía cinética a la salida, es $K_{\text{boquilla}} = 0{,}1$. Se pide:

      a) $Q$ (l/s) y presión $p_C$ (mca), si se considera el agua fluido
      perfecto.

      b) $Q$ (l/s) y presión $p_C$ (mca), en el caso de fluido viscoso.

      c) Calcular la cota $z_C$ a la que debería estar el punto $C$ para que
      empiece la cavitación, manteniendo todos los demás parámetros
      invariables. Calcular asimismo el $Q$ circulante.

      Datos: $D_{\text{boquilla}} = 25\ \text{mm}$; $D_{\text{tubería}} =
      50\ \text{mm}$; $p_v/\gamma = 1\ \text{mca}$ (absoluta);
      $p_{\text{atm}} = 10\ \text{mca}$.
    pide: El caudal y la presión en C con y sin pérdidas, y la cota límite de cavitación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los factores de paso multiplican a $v^{2}/2g$. ¿A qué velocidad, la
          de la tubería o la de la boquilla?
        opciones:
          - texto: >-
              $K_{BC}$ y $K_{CD}$ a la de la **tubería**, y
              $K_{\text{boquilla}}$ a la de **salida**, que es cuatro veces
              mayor
            correcta: true
            mensaje: |
              Exacto, y el enunciado lo dice: «con la energía cinética a la
              salida». Como las áreas están en relación 4 a 1, las velocidades
              también, y las alturas cinéticas en 16 a 1.
          - texto: >-
              Todos a la velocidad de la tubería
            mensaje: |
              El de la boquilla no: el enunciado especifica que va con la
              energía cinética **a la salida**. Aplicarlo a la de la tubería lo
              haría dieciséis veces menor y prácticamente irrelevante.
          - texto: >-
              Todos a la velocidad de salida, que es la mayor
            mensaje: |
              Las pérdidas de $BC$ y $CD$ ocurren dentro de la tubería de
              50 mm, donde la velocidad es la de la tubería. Aplicarles la de
              salida las multiplicaría por dieciséis.

      - tipo: calcular
        titulo: El caudal con fluido perfecto
        pregunta: |
          ¿Qué caudal circula si se desprecian las pérdidas?
        respuesta:
          tipo: magnitud
          valor: '3.436 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '13.74 l/s'
            mensaje: |
              Has usado el área de la tubería en vez de la de la boquilla. El
              caudal lo fija la sección por la que sale el chorro:
              $25\ \text{mm}$, cuatro veces menos área.
          - valor: '4.346 l/s'
            mensaje: |
              Parece que has usado la cota del vértice, 6 m, en vez de la
              diferencia entre la lámina y la salida. El vértice no interviene
              en el caudal: Bernoulli va de la lámina a la salida.
        pista: |
          Bernoulli de la lámina (4,5) a la salida (2): toda la diferencia se
          convierte en velocidad de salida.
        desarrollo: |
          $$
          4{,}5 - 2 = \frac{v_{\text{boq}}^{2}}{2g}
          \;\Longrightarrow\;
          v_{\text{boq}} = \sqrt{2{,}5\cdot 19{,}6} = 7\ \text{m/s}
          $$
          $$
          Q = 7\cdot\frac{\pi\,0{,}025^{2}}{4} = 3{,}436\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal con pérdidas
        pregunta: |
          ¿Y teniendo en cuenta las pérdidas?
        respuesta:
          tipo: magnitud
          valor: '3.089 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1.892 l/s'
            mensaje: |
              Has aplicado los tres factores de paso a la velocidad de salida.
              Los de la tubería van con la velocidad de la tubería, que es
              cuatro veces menor: su contribución es dieciséis veces más
              pequeña de lo que has puesto.
          - valor: '3.222 l/s'
            mensaje: |
              Te has dejado el factor de la boquilla. Aunque valga solo
              $0{,}1$, va multiplicado por la altura cinética **de salida**,
              que es la grande.
        pista: |
          $2{,}5 = \dfrac{v_{\text{boq}}^{2}}{2g}(1+K_{\text{boq}}) +
          (K_{BC}+K_{CD})\dfrac{v_{\text{tub}}^{2}}{2g}$, con
          $v_{\text{tub}} = v_{\text{boq}}/4$.
        desarrollo: |
          $$
          2{,}5 = \frac{v_{\text{boq}}^{2}}{2g}\left[1 + 0{,}1
          + \frac{1+1{,}2}{16}\right]
          = 1{,}2375\,\frac{v_{\text{boq}}^{2}}{2g}
          $$
          $$
          \frac{v_{\text{boq}}^{2}}{2g} = 2{,}020
          \;\Longrightarrow\;
          v_{\text{boq}} = 6{,}293\ \text{m/s}
          \;\Longrightarrow\;
          Q = 3{,}089\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La cota límite del vértice
        pregunta: |
          ¿A qué cota tendría que estar $C$ para que empezara la cavitación?
        respuesta:
          tipo: magnitud
          valor: '13.25 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14.25 m'
            mensaje: |
              Te has dejado la tensión de vapor: has usado $-10$ mca en $C$,
              es decir el vacío absoluto. El límite es $1\ \text{mca}$
              **absoluto**, así que en manométrica son $-9$.
          - valor: '4.5 m'
            mensaje: |
              Esa es la cota de la lámina. La pregunta es cuánto puede subir el
              vértice por encima de ella: nueve metros menos lo que se lleven
              la velocidad y las pérdidas.
        pista: |
          Bernoulli de la lámina a $C$, con $p_C$ igual a la presión de vapor
          en manométrica, y el caudal del apartado anterior.
        desarrollo: |
          $$
          \frac{p_C}{\gamma} = 1 - 10 = -9\ \text{mca}
          \qquad
          \frac{v_{\text{tub}}^{2}}{2g} = \frac{(6{,}293/4)^{2}}{19{,}6}
          = 0{,}126\ \text{m}
          $$
          $$
          0 = -9 + 0{,}126 + (z_C - 4{,}5) + 1\cdot 0{,}126
          $$
          $$
          z_C = 4{,}5 + 9 - 0{,}252 = 13{,}247\ \text{m}
          $$

          Y el caudal no cambia: sigue siendo $3{,}089\ \text{l/s}$, porque lo
          fijan la lámina y la salida, no el vértice.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El caudal lo fija Bernoulli entre la lámina y la salida: la cota
              del vértice no interviene en él.
          - texto: >-
              Con pérdidas, el caudal baja de 3,436 a 3,089 l/s, un 10 %, y la
              presión en $C$ pasa de $-1{,}656$ a $-1{,}753$ mca.
          - texto: >-
              El vértice podría subir hasta la cota 13,25 antes de cavitar,
              con el mismo caudal circulando.
          - texto: >-
              Como al subir el vértice el agua tiene que remontar más altura,
              el caudal disminuiría.
            trampa: true
            mensaje: |
              No disminuye: el caudal depende solo de la diferencia entre la
              lámina y la salida y de las pérdidas del recorrido, no de lo alto
              que pase por el medio. Lo que sí cambia al subir el vértice es la
              **presión** allí, y por eso hay un límite.

    resolucion: |
      **La idea que ordena los tres apartados**: el caudal lo fijan la lámina y
      la salida; el vértice solo decide si el sifón puede funcionar o no.

      **a) Fluido perfecto.**

      $$
      v_{\text{boq}} = \sqrt{2g(4{,}5-2)} = 7\ \text{m/s}
      \qquad
      Q = 3{,}436\ \text{l/s}
      \qquad
      \frac{p_C}{\gamma} = -1{,}5 - 0{,}156 = -1{,}656\ \text{mca}
      $$

      **b) Con pérdidas.** Los factores de la tubería van con
      $v_{\text{tub}} = v_{\text{boq}}/4$ y el de la boquilla con la de salida:

      $$
      2{,}5 = \frac{v_{\text{boq}}^{2}}{2g}\left[1{,}1 + \frac{2{,}2}{16}\right]
      \;\Longrightarrow\;
      Q = 3{,}089\ \text{l/s}
      \qquad
      \frac{p_C}{\gamma} = -1{,}753\ \text{mca}
      $$

      **c) El límite.** Con $p_C$ en la presión de vapor, $-9$ mca
      manométricos:

      $$
      z_C = 4{,}5 + 9 - 2\cdot 0{,}126 = 13{,}25\ \text{m}
      $$

      **Tres lecturas.**

      La primera: **las pérdidas cuestan un 10 % de caudal** y solo un 6 % de
      presión en el vértice. No son proporcionales porque afectan a tramos
      distintos del recorrido.

      La segunda: **el vértice podría estar nueve metros más arriba**. En este
      sifón la cota de 6 m está muy lejos del límite; el problema del ejercicio
      3.15 era el contrario, con el vértice justo en el límite.

      La tercera, que es la de fondo: **subir el vértice no reduce el caudal**.
      Cuesta trabajo aceptarlo —parece que remontar más altura debería costar
      más— pero el agua que sube por un lado baja por el otro y devuelve lo
      gastado. Lo único que se pierde de verdad son las pérdidas de carga, que
      dependen de la longitud y de las piezas, no de la altura del vértice.

  # ── COLECCIÓN 3.29. Venturímetro vertical: el detalle que enseña es que la
  #    lectura del manómetro NO depende de la inclinación.
  - id: ejflu13-col329-el-venturi-vertical
    titulo: Un venturímetro vertical, y por qué su lectura no sabe que lo es
    fuente: >-
      Ejercicio 3.29 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un líquido de densidad relativa $0{,}8$ fluye hacia arriba a través de un
      Venturi acoplado a una tubería de $300\ \text{mm}$ de diámetro y de
      $150\ \text{mm}$ de garganta, siendo su coeficiente $0{,}98$. La
      diferencia de cotas entre los meniscos en el manómetro es de
      $1{,}16\ \text{m}$, cuyo líquido manométrico tiene un peso específico
      relativo de $1{,}25$. Se pide:

      a) Caudal circulante.

      b) Altura que alcanzaría el líquido en un piezómetro abierto dispuesto en
      la garganta. Considerar la cota constante a lo largo del venturímetro.

      Dato: presión a la entrada del Venturi $= 10\ \text{mca}$.
    pide: El caudal y la altura piezométrica en la garganta.

    pasos:
      - tipo: reconocer
        pregunta: |
          El venturímetro es **vertical**. ¿Cambia eso la fórmula del caudal?
        opciones:
          - texto: >-
              No: el manómetro diferencial mide la diferencia de alturas
              **piezométricas**, y la cota ya está incluida en ella
            correcta: true
            mensaje: |
              Ese es el resultado que hace tan cómodo el venturímetro. Da igual
              cómo esté colocado: lo que el manómetro lee es
              $\Delta(p/\gamma + z)$, que es exactamente lo que Bernoulli
              relaciona con las velocidades.
          - texto: >-
              Sí: hay que sumar la diferencia de cotas entre entrada y garganta
            mensaje: |
              Si se suma, se cuenta dos veces: el manómetro ya la lleva dentro.
              Es el error clásico de los venturímetros inclinados.
          - texto: >-
              Sí, pero solo si el líquido manométrico es más denso que el que
              circula
            mensaje: |
              La densidad del líquido manométrico afecta a la **magnitud** de
              la lectura, no a si la cota entra o no. La independencia de la
              inclinación es geométrica.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '64 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '85.28 l/s'
            mensaje: |
              Has usado $1{,}16\ \text{m}$ directamente como diferencia de
              alturas piezométricas. Hay que corregirla por la densidad del
              líquido manométrico: $\Delta h = R\,(s_m/s - 1) = 0{,}6525$ m.
          - valor: '61.93 l/s'
            mensaje: |
              Te falta corregir por la relación de áreas. El denominador
              $\sqrt{1-(A_2/A_1)^{2}}$ vale $0{,}968$ y sube el resultado un
              3 %.
        pista: |
          $\Delta h = R\,(s_m/s - 1)$, y después la fórmula del venturímetro
          con el factor $\sqrt{1-(A_2/A_1)^{2}}$.
        desarrollo: |
          $$
          \Delta h = 1{,}16\left(\frac{1{,}25}{0{,}8}-1\right) = 0{,}6525\ \text{mcl}
          $$
          $$
          Q = \frac{C\,A_2\sqrt{2g\,\Delta h}}{\sqrt{1-(A_2/A_1)^{2}}}
          = \frac{0{,}98\cdot 0{,}01767\cdot 3{,}576}{0{,}968}
          = 0{,}064\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La altura en el piezómetro de la garganta
        pregunta: |
          ¿Qué altura alcanzaría un piezómetro abierto en la garganta?
        respuesta:
          tipo: magnitud
          valor: '11.87 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '12.5 m'
            mensaje: |
              Esa es la altura a la entrada, $10\ \text{mca}$ pasados a columna
              del líquido. En la garganta la presión es **menor**: el agua se
              ha acelerado.
          - valor: '9.374 m'
            mensaje: |
              No has convertido los $10\ \text{mca}$ de entrada a columna del
              líquido. El fluido tiene $s = 0{,}8$, así que
              $10\ \text{mca} = 12{,}5\ \text{mcl}$: en un líquido más ligero,
              la misma presión levanta más columna.
        pista: |
          Los $10\ \text{mca}$ hay que pasarlos a columna del líquido, y
          después aplicar Bernoulli con las dos alturas cinéticas.
        desarrollo: |
          $$
          \frac{p_1}{\gamma} = \frac{10}{0{,}8} = 12{,}5\ \text{mcl}
          \qquad
          \frac{v_1^{2}}{2g} = 0{,}042
          \qquad
          \frac{v_2^{2}}{2g} = 0{,}668\ \text{m}
          $$
          $$
          \frac{p_2}{\gamma} = 12{,}5 + 0{,}042 - 0{,}668 = 11{,}87\ \text{mcl}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro diferencial mide alturas piezométricas, así que la
              inclinación del venturímetro no interviene en la fórmula del
              caudal.
          - texto: >-
              Corrigiendo la lectura por la densidad del líquido manométrico,
              $\Delta h = 0{,}6525$ mcl, y de ahí $Q = 64$ l/s.
          - texto: >-
              En la garganta el piezómetro subiría 11,87 m: seis decímetros
              menos que a la entrada, que es lo que se ha convertido en
              velocidad.
          - texto: >-
              Como el venturímetro es vertical y el flujo asciende, la presión
              en la garganta es menor por dos motivos: la velocidad y la cota.
            trampa: true
            mensaje: |
              El enunciado dice «considerar la cota constante a lo largo del
              venturímetro», así que la cota no interviene en el apartado b).
              Y aunque interviniera, no cambiaría el caudal: eso es justo lo
              que el manómetro diferencial resuelve solo.

    resolucion: |
      **Lo que mide un manómetro diferencial no es una presión, es una
      diferencia de alturas piezométricas.** Por eso un venturímetro se puede
      poner horizontal, vertical o inclinado y su fórmula no cambia:

      $$
      \Delta h = R\left(\frac{s_m}{s}-1\right)
      = 1{,}16\left(\frac{1{,}25}{0{,}8}-1\right) = 0{,}6525\ \text{mcl}
      $$
      $$
      Q = \frac{C\,A_2\sqrt{2g\Delta h}}{\sqrt{1-(A_2/A_1)^{2}}} = 64\ \text{l/s}
      $$

      **La altura en la garganta**, con los $10\ \text{mca}$ de entrada
      pasados a columna del líquido:

      $$
      \frac{p_2}{\gamma} = 12{,}5 + 0{,}042 - 0{,}668 = 11{,}87\ \text{mcl}
      $$

      **Dos cosas que este ejercicio deja claras.**

      La primera es la independencia de la inclinación, y no es un truco de
      cálculo: es la razón práctica de que el venturímetro sea el medidor de
      caudal más fiable de los tres del tema. Se instala como se pueda y sigue
      midiendo.

      La segunda es el orden de magnitud de la caída: **seis decímetros de
      columna sobre doce metros y medio**, un 5 %. Un venturímetro apenas
      perturba la conducción, y por eso su pérdida permanente es tan pequeña
      comparada con la de un diafragma.

  # ── COLECCIÓN 3.32 y 3.33. Los dos vertederos de referencia, rectangular y
  #    triangular, sobre el mismo canal y la misma carga: la comparación es lo
  #    que enseña.
  - id: ejflu13-col332-los-dos-vertederos
    titulo: El mismo canal con vertedero rectangular y con vertedero en V
    fuente: >-
      Ejercicios 3.32 y 3.33 · Colección de Problemas, capítulo 3 · Mecánica
      de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      **3.32.** Un vertedero horizontal en un canal, cuya anchura es de
      $4\ \text{m}$, tiene una altura sobre la solera del canal
      $H = 1{,}2\ \text{m}$. La profundidad aguas arriba es de $1{,}6\ \text{m}$.
      Estímese el caudal si el vertedero fuera:

      a) De pared delgada ($C_{\text{vertedero}} = 0{,}6$).

      b) De pared gruesa.

      **3.33.** Un vertedero triangular con ángulo $\alpha = 90°$ tiene hasta
      el vértice una altura $H = 1{,}2\ \text{m}$. La profundidad del flujo
      aguas arriba es de $1{,}6\ \text{m}$. Calcúlese el caudal.
    pide: Los caudales de los tres vertederos, con la misma carga.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la «carga» de un vertedero y cuánto vale aquí?
        opciones:
          - texto: >-
              La altura de la lámina **por encima del umbral**:
              $1{,}6 - 1{,}2 = 0{,}4\ \text{m}$
            correcta: true
            mensaje: |
              Eso es, y es lo único que interviene en el caudal. La altura del
              umbral sobre la solera —los 1,2 m— no aparece en ninguna
              fórmula: solo sirve para saber cuál es la carga.
          - texto: >-
              La profundidad del canal aguas arriba, $1{,}6\ \text{m}$
            mensaje: |
              Esa es la profundidad total. Lo que vierte por encima del umbral
              son los $0{,}4\ \text{m}$ que sobresalen, y es esa altura la que
              va en la fórmula.
          - texto: >-
              La altura del umbral, $1{,}2\ \text{m}$
            mensaje: |
              El umbral es el obstáculo, no la lámina que lo supera. Con carga
              cero —agua justo al nivel del umbral— no vertería nada, por alto
              que fuese el umbral.

      - tipo: calcular
        titulo: El vertedero rectangular de pared delgada
        pregunta: |
          ¿Qué caudal pasa por el vertedero rectangular de pared delgada?
        respuesta:
          tipo: magnitud
          valor: '1.792 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '14.34 m3/s'
            mensaje: |
              Has usado la profundidad total, $1{,}6\ \text{m}$, como carga.
              La carga es lo que sobresale del umbral: $0{,}4\ \text{m}$. Y
              como va elevada a $3/2$, el error es enorme.
          - valor: '2.688 m3/s'
            mensaje: |
              Te falta el factor $2/3$ que sale de integrar la velocidad
              torricelliana a lo largo de la lámina vertiente. Sin él, el
              caudal sale un 50 % de más.
        pista: |
          $Q = \dfrac{2}{3}\,C\,b\,\sqrt{2g}\;h^{3/2}$, con $h$ la carga.
        desarrollo: |
          $$
          Q = \frac{2}{3}\cdot 0{,}6\cdot 4\cdot\sqrt{19{,}6}\cdot 0{,}4^{3/2}
          = 1{,}6\cdot 4{,}427\cdot 0{,}253 = 1{,}792\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: El vertedero triangular
        pregunta: |
          Y con el vertedero en V de $90°$ y la misma carga, ¿cuánto pasa?
        respuesta:
          tipo: magnitud
          valor: '0.1434 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '0.3584 m3/s'
            mensaje: |
              Has usado el exponente $3/2$, el del rectangular. En un vertedero
              triangular la anchura crece con la altura, así que aparece una
              potencia más: el exponente es $5/2$.
          - valor: '1.792 m3/s'
            mensaje: |
              Ese es el rectangular. El triangular deja pasar doce veces menos
              con la misma carga, y esa diferencia es justamente para lo que
              sirve.
        pista: |
          $Q = \dfrac{8}{15}\,C\sqrt{2g}\,\tan\dfrac{\alpha}{2}\;h^{5/2}$, con
          $C = 0{,}6$.
        desarrollo: |
          $$
          Q = \frac{8}{15}\cdot 0{,}6\cdot\sqrt{19{,}6}\cdot\tan 45°\cdot 0{,}4^{5/2}
          = 0{,}32\cdot 4{,}427\cdot 0{,}1012 = 0{,}1434\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la misma carga de $0{,}4\ \text{m}$, el vertedero rectangular
              de 4 m deja pasar $1{,}79\ \text{m}^{3}/\text{s}$ y el de pared
              gruesa, $1{,}72$.
          - texto: >-
              El triangular de 90° deja pasar solo $0{,}143$: doce veces menos.
          - texto: >-
              La diferencia viene del exponente: $h^{3/2}$ en el rectangular y
              $h^{5/2}$ en el triangular, porque en este la anchura también
              crece con la carga.
          - texto: >-
              Por eso el vertedero triangular es el que se usa para medir
              caudales grandes: al dejar pasar menos, la lámina sube más y se
              mide mejor.
            trampa: true
            mensaje: |
              Se usa para caudales **pequeños**, y por esa misma razón: como
              el caudal va con $h^{5/2}$, un caudal pequeño produce una carga
              relativamente grande y fácil de leer. Para caudales grandes el
              triangular exigiría una carga enorme, y ahí se usa el
              rectangular.

    resolucion: |
      **La carga es lo único que interviene**, y es lo que sobresale del
      umbral: $h = 1{,}6 - 1{,}2 = 0{,}4\ \text{m}$. La altura del umbral sobre
      la solera no aparece en ninguna fórmula.

      | vertedero | fórmula | caudal |
      |---|---|---|
      | rectangular, pared delgada | $\frac{2}{3}Cb\sqrt{2g}\,h^{3/2}$ | $1{,}79\ \text{m}^{3}/\text{s}$ |
      | rectangular, pared gruesa | $1{,}705\,b\,h^{3/2}$ | $1{,}72$ |
      | triangular de 90° | $\frac{8}{15}C\sqrt{2g}\tan\frac{\alpha}{2}h^{5/2}$ | $0{,}143$ |

      **Los dos rectangulares dan casi lo mismo** —un 4 % de diferencia— y eso
      es tranquilizador: el tipo de coronación afecta poco. Lo que cambia el
      resultado en un factor doce es la **forma de la abertura**.

      **Y el exponente es la razón de todo.** En un vertedero rectangular la
      anchura de la lámina es fija, así que el caudal va con $h^{3/2}$. En un
      triangular la anchura crece proporcionalmente a la altura, y eso añade
      una potencia: $h^{5/2}$.

      La consecuencia práctica está en la sensibilidad. Para medir un caudal
      **pequeño**, el triangular es mucho mejor: como el caudal cae tan deprisa
      con la carga, un caudal reducido produce una lámina que todavía se puede
      leer con precisión. Para caudales grandes pasa lo contrario, y ahí se usa
      el rectangular.

      Por eso los aforadores de laboratorio y de pequeños arroyos son
      triangulares, y los de canal de riego, rectangulares.
