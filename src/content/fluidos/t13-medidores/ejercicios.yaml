        <line x1="316" y1="134" x2="316" y2="188" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M330,126 H322 A6,6 0 0 0 316,132" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M290,134 V204 H316 V188" fill="none" stroke="var(--alt)" stroke-width="3.6"/>
