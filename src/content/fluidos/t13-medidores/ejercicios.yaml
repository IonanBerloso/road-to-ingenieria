      <figcaption>Un manómetro invertido: en lugar de un líquido más pesado abajo, lleva aire arriba. Como el aire no pesa, el desnivel R es directamente la diferencia de presiones, medida en el propio líquido que circula.</figcaption>
      </figure>
    pide: La expresión del caudal, y el caudal para el que las dos presiones estáticas coinciden.
    pasos:
      - tipo: reconocer
        pregunta: |
          El líquido manométrico es **aire**, y las dos ramas del manómetro
          llevan el propio líquido del conducto. ¿Qué relación hay entre la
          lectura $R$ y la diferencia de presiones?
        opciones:
          - texto: Es directa, (p1 − p2)/γ = R, porque el peso del aire de arriba es despreciable
            correcta: true
            mensaje: |
              Eso es. Al recorrer el manómetro, el tramo de aire aporta un
              término $\gamma_{aire}\cdot R$ que frente a $\gamma$ del líquido es
              despreciable, así que la lectura es la diferencia de alturas
              piezométricas sin ningún factor.
          - texto: Hay que multiplicar por la densidad relativa del aire respecto del líquido, unas 800 veces menor
            mensaje: |
              Ese factor aparece cuando el fluido manométrico es el **pesado**
              y va abajo. Aquí el aire va arriba y lo que hace es no pesar: no
              multiplica, se cancela.
          - texto: Hay que dividir entre la densidad relativa del aire, así que R se amplifica unas 800 veces
            mensaje: |
              Eso es lo que pasa cuando el fluido que **circula** es el ligero,
              como en el 3.7. Aquí circula el líquido y el aire está quieto
              arriba: la lectura es 1 a 1.

      - tipo: calcular
        titulo: El factor de la geometría
        pregunta: |
          En la expresión del caudal aparece $1/\sqrt{1-(D_2/D_1)^{4}}$. Para
          hacerte una idea de su tamaño —no es un dato del problema, es una
          comprobación—: ¿cuánto vale si la garganta es la mitad del tubo,
          $D_2 = D_1/2$?
        respuesta:
          tipo: numero
          valor: '1.0328'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1.1547'
            mensaje: |
              Has puesto el cuadrado en vez de la cuarta potencia:
              $1/\sqrt{1-0{,}25}$. La relación de áreas ya es un cuadrado, y en
              la ecuación entra otra vez al cuadrado: sale $(D_2/D_1)^{4}$.
          - valor: '1.0645'
            mensaje: |
              Has olvidado la raíz. El factor multiplica a $\sqrt{2gR}$, así que
              es $1/\sqrt{1-(D_2/D_1)^{4}}$, no $1/(1-(D_2/D_1)^{4})$.
        pista: |
          $(D_2/D_1)^{4} = 0{,}5^{4} = 0{,}0625$.
        desarrollo: |
          $$
          \frac{1}{\sqrt{1-0{,}5^{4}}} = \frac{1}{\sqrt{0{,}9375}} = 1{,}0328
          $$

          Un 3 %: pequeño, pero no cero. Solo se puede despreciar cuando la
          garganta es mucho más estrecha que el tubo.

      - tipo: calcular
        titulo: El caudal que iguala las dos presiones
        pregunta: |
          Caudal circulante para que la presión estática sea la misma en 1 y en
          2.
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.0001
          formato: un número, en m³/s
        distractores:
          - valor: '1.0328'
            mensaje: |
              Ese es el factor geométrico de antes, no un caudal. La pregunta
              es para qué $Q$ el manómetro marcaría $R = 0$.
          - valor: '0.5'
            mensaje: |
              Si circulara cualquier caudal, la garganta iría más deprisa y
              tendría **menos** presión. La única forma de que las dos
              estáticas coincidan es que no circule nada.
        pista: |
          Si $p_1 = p_2$, entonces $R = 0$; y $Q$ es proporcional a
          $\sqrt{R}$.
        desarrollo: |
          $$
          p_1 = p_2 \;\Longrightarrow\; R = 0 \;\Longrightarrow\; Q = C_v A_2 \sqrt{\frac{2g \cdot 0}{1-(D_2/D_1)^{4}}} = 0
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del venturi. Una pieza es falsa.
        piezas:
          - texto: 'Bernoulli entre 1 y 2 sin pérdidas: la diferencia de alturas de velocidad es igual a la diferencia de alturas piezométricas.'
          - texto: 'Con la continuidad, V1 = (A2/A1)·V2, y despejando queda V2 = √(2gR) / √(1 − (D2/D1)⁴).'
          - texto: 'Si circula algo, la garganta va más deprisa y su presión estática baja: p2 < p1 siempre, y las dos nunca se igualan salvo en reposo.'
          - texto: 'Las dos presiones estáticas se igualarían si el venturi fuera lo bastante largo, porque la pérdida de carga compensaría la diferencia de velocidades.'
            trampa: true
            mensaje: |
              Una pérdida de carga solo puede bajar más la presión de aguas
              abajo, nunca subirla: alejaría todavía más $p_2$ de $p_1$. Y la
              deducción se ha hecho sin pérdidas justamente porque el venturi
              es corto y está diseñado para tener muy pocas.
    resolucion: |
      **La expresión** (a). Bernoulli entre 1 y 2, horizontales y sin pérdidas:

      $$
      \frac{V_{2t}^{2} - V_{1t}^{2}}{2g} = \frac{p_1 - p_2}{\gamma}
      $$

      El manómetro es invertido y su fluido es aire, que no pesa: recorriéndolo
      queda $\dfrac{p_1 - p_2}{\gamma} = R$, sin factor ninguno. Con la
      continuidad $V_{1t} = (A_2/A_1)V_{2t}$:

      $$
      V_{2t}^{2}\left[1 - \left(\frac{A_2}{A_1}\right)^{2}\right] = 2gR \;\Longrightarrow\; Q = C_v A_2 \sqrt{\frac{2gR}{1 - \left(\dfrac{D_2}{D_1}\right)^{4}}}
      $$

      **El caudal que iguala las presiones** (b y c). Si $p_1 = p_2$ entonces
      $R = 0$ y $Q = 0$. Y no es una casualidad de la fórmula: es que la
      pregunta solo tiene esa respuesta. En cuanto circula algo, la
      continuidad obliga a que la garganta vaya más deprisa, y Bernoulli obliga
      a que donde hay más velocidad haya menos presión. **$p_2 < p_1$ siempre
      que $Q \neq 0$**, y las dos estáticas no se igualan nunca.

      **Lo que conviene retener del manómetro invertido.** Es el mismo aparato
      del 3.7 puesto al revés, y por eso su factor es el contrario: allí
      circulaba el gas y el líquido manométrico amplificaba la lectura 675
      veces; aquí circula el líquido y el aire hace que la lectura sea 1 a 1.
      La pregunta que decide cuál es cuál: **¿el fluido manométrico pesa más o
      menos que el que circula?**
  - id: ejflu13-col39-la-instalacion-entera-con-cuatro-aparatos-de-medida
    titulo: La instalación entera, con cuatro aparatos de medida
    fuente: Ejercicio 3.9 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Teniendo en cuenta los datos reflejados en la figura, se pide:

      a) Caudal circulante.

      b) Altura manométrica y potencia útil de la bomba.

      c) Diferencia de alturas en los meniscos del manómetro diferencial del
      venturímetro.

      d) Peso específico relativo del líquido manométrico del conjunto Pitot +
      piezómetro abierto.

      e) Altura $R'$ que señalará el manómetro acoplado al Pitot en la salida a
      la atmósfera del sistema.

      f) Altura h que alcanzará el líquido en un piezómetro abierto situado a
      la entrada de la bomba.

