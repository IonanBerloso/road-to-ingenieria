        <path d="M214,70 V52" fill="none" stroke="var(--live)" stroke-width="3.6"/>
        <text x="220" y="20" font-size="9.5" fill="var(--faint)">aire</text>
        <text x="176" y="44" text-anchor="end" font-size="9.5" fill="var(--live)">agua</text>
