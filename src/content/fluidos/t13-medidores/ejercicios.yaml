      <figcaption>Dos medidores en serie sobre el mismo caudal. El de la tubería está calibrado y da el caudal de verdad; el del canal es el que se quiere calibrar, y su coeficiente es el cociente entre los dos.</figcaption>
      </figure>
    pide: El coeficiente del vertedero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa aquí «coeficiente del vertedero», y qué papel juega el
          diafragma de la tubería?
        opciones:
          - texto: Es el cociente entre el caudal real —que da el diafragma, ya calibrado— y el teórico que predice la fórmula del vertedero
            correcta: true
            mensaje: |
              Eso es. Los dos aparatos miden el mismo caudal, pero uno está
              calibrado y el otro no. El diafragma pone el número de verdad y la
              fórmula del vertedero pone la predicción ideal: su cociente es lo
              que hay que averiguar.
          - texto: Es el coeficiente de contracción del vertedero, que se lee en el ábaco como el del diafragma
            mensaje: |
              El coeficiente de un vertedero no está tabulado con la precisión
              del de un diafragma: depende de la forma del labio, de la
              aireación de la lámina y de la instalación. Por eso se calibra en
              el sitio, midiendo con otro aparato que sí lo esté.
          - texto: Es el cociente entre las dos lecturas, 16,5 cm y 11,4 cm
            mensaje: |
              Son alturas de cosas distintas —una carga sobre un vértice y una
              diferencia de meniscos de mercurio— y ni siquiera están en el
              mismo fluido. Lo que se comparan son caudales, no lecturas.

      - tipo: calcular
        titulo: El caudal real, el del diafragma
        pregunta: |
          Caudal que circula, medido con el diafragma. La diferencia de
          meniscos es de 11,4 cm de mercurio y el coeficiente $C$ del ábaco
          nº 15 vale 0,634 para esta relación de secciones.
        respuesta:
          tipo: magnitud
          valor: '7.99 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '8.3 l/s'
            mensaje: |
              Te falta el $-1$ del manómetro diferencial: las dos ramas llevan
              agua sobre el mercurio, así que la altura equivalente es
              $R\,(13{,}6 - 1)$, no $R \cdot 13{,}6$.
          - valor: '25.9 l/s'
            mensaje: |
              Has usado la sección de la tubería, 99 mm. El caudal del diafragma
              se escribe con la sección del **orificio**, 55 mm; la de la
              tubería solo entra a través del coeficiente $C$.
          - valor: '12.6 l/s'
            mensaje: |
              Te has dejado el coeficiente $C = 0{,}634$. Sin él estarías dando
              por buena la descarga teórica del orificio, y un diafragma deja
              pasar bastante menos.
        pista: |
          $\Delta h = 0{,}114\,(13{,}6-1) = 1{,}436$ m de agua, y
          $Q = C\,A_2\sqrt{2g\,\Delta h}$ con $A_2$ la sección del orificio.
        desarrollo: |
          $$
          \Delta h = 0{,}114 \cdot 12{,}6 = 1{,}436\ \text{mca} \qquad A_2 = \frac{\pi \cdot 0{,}055^{2}}{4} = 2{,}376\cdot 10^{-3}\ \text{m}^{2}
          $$

          $$
          Q = 0{,}634 \cdot 2{,}376\cdot 10^{-3}\sqrt{2 \cdot 9{,}8 \cdot 1{,}436} = 7{,}99\cdot 10^{-3}\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El caudal teórico del vertedero
        pregunta: |
          Caudal teórico que predice la fórmula del vertedero triangular con
          $\alpha = 60$ º y una carga de 16,5 cm.
        respuesta:
          tipo: magnitud
          valor: '15.08 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '18.85 l/s'
            mensaje: |
              Has usado $2/3$ en vez de $8/15$. El $2/3$ es del vertedero
              rectangular: en el triangular la anchura crece con la altura y la
              integral da $8/15$.
          - valor: '26.1 l/s'
            mensaje: |
              Te has dejado la tangente del **semiángulo**. La escotadura abre
              60º en total, así que cada lado se separa 30º de la vertical y el
              factor es $\tan 30° = 0{,}577$.
          - valor: '91.4 l/s'
            mensaje: |
              Has puesto $H^{3/2}$, la ley del vertedero rectangular. En el
              triangular la anchura de la lámina también crece con $H$, y el
              exponente es $5/2$.
        pista: |
          $Q_t = \dfrac{8}{15}\sqrt{2g}\,\tan\dfrac{\alpha}{2}\;H^{5/2}$.
        desarrollo: |
          $$
          Q_t = \frac{8}{15}\sqrt{19{,}6}\,\tan 30°\;(0{,}165)^{5/2} = 0{,}5333 \cdot 4{,}427 \cdot 0{,}5774 \cdot 0{,}01106 = 15{,}08\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El coeficiente
        pregunta: |
          Coeficiente del vertedero.
        respuesta:
          tipo: numero
          valor: '0.53'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '1.89'
            mensaje: |
              Lo has puesto del revés. El coeficiente corrige el caudal
              **teórico** hacia abajo: el real siempre es menor, así que va en
              el numerador.
          - valor: '0.69'
            mensaje: |
              Ese es el cociente de las cargas elevado a algo, o una mezcla de
              las dos lecturas. El coeficiente compara caudales: 7,99 frente a
              15,08 l/s.
        pista: |
          $\mu = Q_{real}/Q_{teórico}$.
        desarrollo: |
          $$
          \mu = \frac{7{,}99}{15{,}08} = 0{,}53
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la calibración. Una pieza es falsa.
        piezas:
          - texto: 'Los dos aparatos ven el mismo caudal, porque están en serie: lo que el diafragma mide en la tubería es lo que el vertedero desagua en el canal.'
          - texto: 'El diafragma da el caudal real, 7,99 l/s, con su C leído del ábaco y la altura equivalente de mercurio, 1,436 mca.'
          - texto: 'La fórmula del vertedero triangular predice 15,08 l/s, y el cociente de los dos, 0,53, es el coeficiente buscado.'
          - texto: 'Un coeficiente de 0,53 es sospechosamente bajo: en un aparato bien construido debería salir por encima de 0,9, como en un venturi.'
            trampa: true
            mensaje: |
              Es un valor perfectamente normal para un vertedero triangular
              —los coeficientes de descarga andan por 0,58— y no se compara con
              un venturi. La diferencia es que la fórmula teórica del vertedero
              supone una lámina ideal sin contracción lateral ni rozamiento, y
              la real se contrae por los dos lados; un venturi, en cambio, guía
              el flujo y por eso su coeficiente roza la unidad.
    resolucion: |
      **La idea: calibrar es comparar con algo que ya está calibrado.** El
      diafragma VDI es un aparato normalizado, con su coeficiente tabulado en
      el ábaco nº 15; el vertedero no. Los dos ven el mismo caudal, así que
      basta medir con el bueno y dividir.

      **El caudal real.** El manómetro diferencial lleva mercurio y las dos
      ramas van llenas de agua, así que la altura equivalente es
      $R\,(s_{Hg}-1)$:

      $$
      \Delta h = 0{,}114 \cdot 12{,}6 = 1{,}436\ \text{mca} \qquad Q = C\,A_2\sqrt{2g\,\Delta h} = 7{,}99\ \text{l/s}
      $$

      con $C = 0{,}634$, leído del ábaco nº 15 para
      $A_2/A_1 = (55/99)^{2} = 0{,}31$. La lectura es cómoda porque a partir de
      un Reynolds de unos 40 000 las curvas son horizontales, y aquí sale
      $\mathrm{Re} \approx 10^{5}$.

      **El caudal teórico del vertedero.**

      $$
      Q_t = \frac{8}{15}\sqrt{2g}\,\tan\frac{\alpha}{2}\;H^{5/2} = 15{,}08\ \text{l/s}
      $$

      **El coeficiente.** $\mu = 7{,}99/15{,}08 = 0{,}53$.

      **Dos cosas que conviene no confundir.** La primera, los exponentes:
      el vertedero rectangular va con $H^{3/2}$ y el triangular con
      $H^{5/2}$, porque en el triangular también la anchura crece con la
      carga. Eso hace al triangular mucho más sensible con caudales pequeños,
      que es justo para lo que se usa. La segunda, el ángulo: los 60º son la
      abertura **completa** de la escotadura, y en la fórmula entra
      $\tan(\alpha/2)$.
