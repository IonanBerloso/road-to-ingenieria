ejercicios:
  # ── Los tres son NUESTROS (§08). El capítulo 3 de la colección arranca con
  #    instalaciones completas; estos tres aíslan cada aparato para que la
  #    receta —Bernoulli, hidrostática, igualar— se use una vez por separado.
  - id: ejflu13-el-tubo-de-pitot
    titulo: La velocidad que marca un tubo de Pitot
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por una tubería circula agua. Un tubo de Pitot combinado con un
      piezómetro marca una diferencia de $15\ \text{cm}$ en un manómetro de
      mercurio ($s_0 = 13{,}6$).

      Calcular la velocidad del agua en ese punto.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: La velocidad del agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          El Pitot mide la presión total y el piezómetro la estática. ¿Qué
          representa su diferencia?
        opciones:
          - texto: >-
              La presión **dinámica**, $v^{2}/2g$: total menos estática. De
              ahí sale la velocidad
            correcta: true
            mensaje: |
              Eso es. Un aparato solo no da la velocidad: hace falta restar
              dos medidas, y esa resta es exactamente la altura cinética.
          - texto: >-
              La pérdida de carga entre los dos puntos
            mensaje: |
              Están en el **mismo** punto del flujo, así que no hay pérdida
              entre ellos. Lo que los distingue es que uno frena el fluido
              (Pitot) y el otro no (piezómetro).
          - texto: >-
              La diferencia de cotas entre las dos tomas
            mensaje: |
              Las cotas se cancelan al estar los dos en el mismo punto. Lo que
              queda es la energía cinética.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '6.09 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6.32 m/s'
            mensaje: |
              Has usado $s_0 = 13{,}6$ sin restarle el 1 del agua. El
              desnivel de mercurio está compensado por agua al otro lado, así
              que el factor es $13{,}6-1 = 12{,}6$.
          - valor: '1.71 m/s'
            mensaje: |
              Has olvidado el factor de densidades: $\sqrt{2gR}$ solo valdría
              si el manómetro fuera del mismo líquido que el flujo, y
              entonces no mediría nada.
        pista: |
          v = √(2·g·R·(s₀/s − 1)), con R = 0,15 m y s₀/s = 13,6.
        desarrollo: |
          $$
          v = \sqrt{2gR\left(\frac{s_0}{s}-1\right)}
          = \sqrt{2\cdot9{,}8\cdot0{,}15\cdot12{,}6} = 6{,}09\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En la boca del Pitot el fluido se estanca: $v = 0$, y el tubo
              marca $P/\gamma + v^{2}/2g$.
          - texto: >-
              El piezómetro marca solo $P/\gamma$, porque su toma es paralela
              al flujo y no lo frena.
          - texto: >-
              La diferencia entre los dos es $v^{2}/2g$.
          - texto: >-
              Recorriendo el manómetro, esa diferencia vale
              $R\left(s_0/s - 1\right) = 0{,}15\cdot12{,}6 = 1{,}89\ \text{mca}$.
          - texto: >-
              $v = \sqrt{2g\cdot1{,}89} = 6{,}09\ \text{m/s}$.
          - texto: >-
              Si se usara un manómetro de agua en vez de mercurio, la lectura
              $R$ sería la misma pero más fácil de leer.
            trampa: true
            mensaje: |
              Con agua a los dos lados el factor $(s_0/s-1)$ vale **cero** y
              el manómetro no marca nada. El líquido manométrico tiene que
              ser distinto —y más denso— que el del flujo: es lo que hace
              posible la medida.

    resolucion: |
      La diferencia entre la presión total (Pitot) y la estática (piezómetro)
      es la altura cinética, y el manómetro la mide:

      $$
      \frac{v^{2}}{2g} = R\left(\frac{s_0}{s}-1\right) = 0{,}15\cdot12{,}6 = 1{,}89\ \text{mca}
      $$
      $$
      \boxed{v = \sqrt{2g\cdot1{,}89} = 6{,}09\ \text{m/s}}
      $$

      > **La misma fórmula sirve para el tubo de Prandtl**, que mete el Pitot
      > y el tubo estático en una sola sonda. Es el que llevan los aviones, y
      > es la razón de que una sonda helada dé velocidades falsas: si se
      > obstruye la toma estática, la resta deja de ser la altura cinética.

  - id: ejflu13-el-venturimetro
    titulo: El caudal que mide un venturímetro
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      En una tubería de $300\ \text{mm}$ por la que circula agua se instala
      un venturímetro con garganta de $150\ \text{mm}$. El manómetro
      diferencial de mercurio ($s_0 = 13{,}6$) marca $R = 25\ \text{cm}$.

      a) Calcular el caudal teórico.

      b) Calcular el caudal real si el coeficiente del venturímetro es
      $C_v = 0{,}98$.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: El caudal teórico y el real.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la fórmula del venturímetro aparece
          $\sqrt{1-(A_2/A_1)^{2}}$ en el denominador. ¿Por qué?
        opciones:
          - texto: >-
              Porque la velocidad aguas arriba **no es cero**: hay que
              descontar la energía cinética que el flujo ya traía
            correcta: true
            mensaje: |
              Eso es. Si la garganta fuera minúscula frente a la tubería, la
              velocidad de entrada sería despreciable y el término
              desaparecería. Con $D_2/D_1 = 0{,}5$ vale $0{,}968$: corrige un
              3 %.
          - texto: >-
              Porque el chorro se contrae en la garganta
            mensaje: |
              Eso es el coeficiente de contracción, y en un venturímetro
              vale **1** precisamente porque el estrechamiento es suave y el
              chorro llena la garganta. El término del denominador es otra
              cosa.
          - texto: >-
              Para convertir el caudal en velocidad
            mensaje: |
              Esa conversión es el $A_2$ que multiplica. El radical corrige
              por la velocidad de aproximación.

      - tipo: calcular
        titulo: La velocidad en la garganta
        pregunta: |
          ¿Cuál es la velocidad teórica en la garganta?
        respuesta:
          tipo: magnitud
          valor: '8.115 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '7.858 m/s'
            mensaje: |
              Te has dejado el denominador $\sqrt{1-(A_2/A_1)^{2}}$, que aquí
              vale $0{,}968$ y sube el resultado un 3 %.
          - valor: '2.213 m/s'
            mensaje: |
              Has olvidado el factor $(s_0/s-1) = 12{,}6$ del manómetro de
              mercurio.
        pista: |
          v₂ = √(2·g·R·12,6) dividido por √(1 − (A₂/A₁)²), con A₂/A₁ = 0,25.
        desarrollo: |
          $$
          \frac{A_2}{A_1} = \left(\frac{150}{300}\right)^{2} = 0{,}25
          \qquad
          \sqrt{1-0{,}25^{2}} = 0{,}968
          $$
          $$
          v_{2t} = \frac{\sqrt{2\cdot9{,}8\cdot0{,}25\cdot12{,}6}}{0{,}968}
          = \frac{7{,}858}{0{,}968} = 8{,}115\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          Con $C_v = 0{,}98$, ¿cuál es el caudal real?
        respuesta:
          tipo: magnitud
          valor: '140.5 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '143.4 l/s'
            mensaje: |
              Ese es el caudal **teórico**, sin aplicar el coeficiente. El
              real es un 2 % menor: $0{,}98\cdot143{,}4$.
          - valor: '562 l/s'
            mensaje: |
              Has usado el área de la tubería ($300\ \text{mm}$) en vez de la
              de la garganta. La velocidad calculada es la de la garganta, así
              que va con $A_2$.
        pista: |
          Q = Cv · v₂ · A₂, con A₂ = π·0,15²/4.
        desarrollo: |
          $$
          A_2 = \frac{\pi\cdot0{,}15^{2}}{4} = 0{,}01767\ \text{m}^{2}
          $$
          $$
          Q_t = 8{,}115\cdot0{,}01767 = 0{,}1434\ \text{m}^{3}/\text{s}
          \qquad
          Q_r = 0{,}98\cdot143{,}4 = 140{,}5\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la tubería y la garganta, más continuidad, más
              hidrostática en el manómetro.
          - texto: >-
              La lectura del manómetro da
              $R(s_0/s-1) = 0{,}25\cdot12{,}6 = 3{,}15\ \text{mca}$ de
              diferencia de alturas piezométricas.
          - texto: >-
              $v_{2t} = \sqrt{2g\cdot3{,}15}/\sqrt{1-0{,}25^{2}} = 8{,}115\ \text{m/s}$.
          - texto: >-
              $Q_t = v_{2t}A_2 = 143{,}4\ \text{l/s}$ y
              $Q_r = 0{,}98\,Q_t = 140{,}5\ \text{l/s}$.
          - texto: >-
              En un venturímetro $C_c = 1$, así que su único coeficiente es el
              de velocidad.
          - texto: >-
              Como el venturímetro está inclinado o no, la lectura $R$
              cambiaría, y por eso hay que dar siempre la cota de las tomas.
            trampa: true
            mensaje: |
              **La inclinación no afecta**: al recorrer el manómetro, los
              términos de cota se cancelan con los del propio conducto. Por
              eso la fórmula solo tiene $R$ y no aparece $z$ — y por eso un
              venturímetro se puede montar en vertical sin recalcular nada.

    resolucion: |
      $$
      \boxed{v_{2t} = \frac{\sqrt{2gR(s_0/s-1)}}{\sqrt{1-(A_2/A_1)^{2}}}
      = \frac{7{,}858}{0{,}968} = 8{,}115\ \text{m/s}}
      $$
      $$
      \boxed{Q_t = 143{,}4\ \text{l/s}}
      \qquad
      \boxed{Q_r = C_v\,Q_t = 140{,}5\ \text{l/s}}
      $$

      > **Los tres ingredientes, siempre los mismos.** Bernoulli da la
      > relación entre presión y velocidad; la continuidad relaciona las dos
      > velocidades; y la hidrostática traduce la lectura del manómetro. La
      > fórmula del formulario es el resultado de juntar esas tres, y merece
      > la pena saber deducirla porque el examen a veces pide justo eso.

  - id: ejflu13-orificio-y-vaciado
    titulo: Un orificio, sus coeficientes y cuánto tarda en vaciarse el depósito
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito abierto de $6\ \text{m}^{2}$ de sección tiene en el fondo
      un orificio de $80\ \text{mm}$ de diámetro, con
      $C_v = 0{,}98$ y $C_c = 0{,}62$. El nivel inicial es de
      $4\ \text{m}$.

      a) Calcular el caudal real que sale al principio.

      b) Calcular el tiempo que tarda en vaciarse por completo.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$.
    pide: El caudal real inicial y el tiempo de vaciado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «se vacía», así que el nivel baja. ¿Se puede
          usar Bernoulli?
        opciones:
          - texto: >-
              Sí, **en cada instante**: el nivel baja tan despacio que el
              flujo se puede tratar como permanente en cada momento, y luego
              se integra
            correcta: true
            mensaje: |
              Eso es la cuarta hipótesis levantada del tema 12. La ecuación
              del vaciado sale de igualar lo que sale por el orificio con lo
              que desciende el nivel, y después integrar.
          - texto: >-
              No: Bernoulli exige régimen permanente y aquí no lo hay
            mensaje: |
              Estrictamente no lo hay, pero la variación es lenta y esa es
              justamente la hipótesis que se puede relajar. Si no, no habría
              forma de resolver ningún vaciado.
          - texto: >-
              Sí, porque el depósito es grande y el nivel no cambia
            mensaje: |
              El nivel **sí** cambia: por eso el depósito se vacía. Lo que
              permite usar Bernoulli no es que no cambie, sino que cambie
              despacio.

      - tipo: calcular
        titulo: El caudal real inicial
        pregunta: |
          ¿Qué caudal sale con el nivel en $4\ \text{m}$?
        respuesta:
          tipo: magnitud
          valor: '27.04 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '44.51 l/s'
            mensaje: |
              Ese es el caudal **teórico**, $A_0\sqrt{2gh}$. Falta multiplicar
              por $C_d = C_vC_c = 0{,}608$.
          - valor: '19.12 l/s'
            mensaje: |
              Te has dejado el 2 de $\sqrt{2gh}$: con $\sqrt{gh}$ sale un
              factor $\sqrt2$ menos. La cota se convierte en altura cinética
              como $h = v^{2}/2g$, y al despejar aparece el 2.
        pista: |
          Q = Cv·Cc·A₀·√(2gh), con A₀ = π·0,08²/4.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot0{,}08^{2}}{4} = 5{,}027\cdot10^{-3}\ \text{m}^{2}
          \qquad
          v_t = \sqrt{2\cdot9{,}8\cdot4} = 8{,}854\ \text{m/s}
          $$
          $$
          Q_r = 0{,}98\cdot0{,}62\cdot5{,}027\cdot10^{-3}\cdot8{,}854
          = 0{,}02704\ \text{m}^{3}/\text{s} = 27{,}04\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El tiempo de vaciado
        pregunta: |
          ¿Cuánto tarda en vaciarse del todo?
        respuesta:
          tipo: magnitud
          valor: '1775 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '887 s'
            mensaje: |
              Eso es el volumen inicial dividido por el caudal inicial, que
              supondría caudal constante. Pero el caudal **disminuye** al
              bajar el nivel, así que tarda el doble.
          - valor: '3550 s'
            mensaje: |
              Un factor 2 de más: la fórmula es
              $t = 2A_{\text{dep}}\sqrt{h}/(C_dA_0\sqrt{2g})$, con el 2 ya
              incluido.
        pista: |
          t = 2·A_dep·(√h_ini − √h_fin) / (C_d·A₀·√(2g)).
        desarrollo: |
          $$
          t = \frac{2\,A_{\text{dep}}\left(\sqrt{h_{\text{ini}}}-\sqrt{h_{\text{fin}}}\right)}
          {C_d\,A_0\sqrt{2g}}
          = \frac{2\cdot6\cdot2}{0{,}608\cdot5{,}027\cdot10^{-3}\cdot4{,}427}
          = 1775\ \text{s}
          $$

          Unos **30 minutos**. Y el doble de lo que daría suponer caudal
          constante, que es la comprobación de que el vaciado se frena.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Torricelli da la velocidad teórica, $v_t = \sqrt{2gh}$, que con
              $h = 4\ \text{m}$ vale $8{,}85\ \text{m/s}$.
          - texto: >-
              El caudal real lleva los dos coeficientes:
              $C_d = C_vC_c = 0{,}608$, y sale $27{,}04\ \text{l/s}$.
          - texto: >-
              Para el vaciado: $Q_r\,dt = -A_{\text{dep}}dh$, y se integra
              entre $4\ \text{m}$ y $0$.
          - texto: >-
              $t = 1775\ \text{s}$, unos treinta minutos.
          - texto: >-
              El tiempo va con $\sqrt{h}$, así que vaciar de 4 a 1 metro tarda
              la mitad que de 1 a 0... no: tarda el doble, porque
              $\sqrt4-\sqrt1 = 1$ y $\sqrt1-\sqrt0 = 1$ son iguales.
            trampa: true
            mensaje: |
              Pieza escrita para tropezar, y los dos números que da son
              correctos pero la conclusión sobra: $\sqrt4-\sqrt1 = 1$ y
              $\sqrt1-\sqrt0 = 1$ son **iguales**, así que los dos tramos
              tardan **lo mismo** — y eso es lo interesante, porque el primero
              tiene tres metros de agua y el segundo solo uno.

    resolucion: |
      **a) El caudal inicial:**

      $$
      \boxed{Q_r = C_vC_c\,A_0\sqrt{2gh} = 0{,}608\cdot5{,}027\cdot10^{-3}\cdot8{,}854
      = 27{,}04\ \text{l/s}}
      $$

      **b) El tiempo**, integrando $Q_r\,dt = -A_{\text{dep}}\,dh$:

      $$
      \boxed{t = \frac{2A_{\text{dep}}\sqrt{h_{\text{ini}}}}{C_dA_0\sqrt{2g}}
      = 1775\ \text{s} \approx 30\ \text{min}}
      $$

      > **Por qué el vaciado tarda el doble de lo que parece.** Con el caudal
      > inicial constante saldrían 887 s; pero el caudal cae con
      > $\sqrt{h}$, y el resultado es exactamente el doble. De ahí también
      > que los últimos centímetros tarden tanto: bajar de 1 a 0 metros lleva
      > el mismo tiempo que bajar de 4 a 1.

  # ── COLECCIÓN 3.15. El sifón limitado por la cavitación: el caudal máximo
  #    no lo pone la geometría sino la presión de vapor en el punto alto.
  - id: ejflu13-col329-el-venturi-vertical
    titulo: Un venturímetro vertical, y por qué su lectura no sabe que lo es
    fuente: >-
      Ejercicio 3.29 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un líquido de densidad relativa $0{,}8$ fluye hacia arriba a través de un
      Venturi acoplado a una tubería de $300\ \text{mm}$ de diámetro y de
      $150\ \text{mm}$ de garganta, siendo su coeficiente $0{,}98$. La
      diferencia de cotas entre los meniscos en el manómetro es de
      $1{,}16\ \text{m}$, cuyo líquido manométrico tiene un peso específico
      relativo de $1{,}25$. Se pide:

      a) Caudal circulante.

      b) Altura que alcanzaría el líquido en un piezómetro abierto dispuesto en
      la garganta. Considerar la cota constante a lo largo del venturímetro.

      Dato: presión a la entrada del Venturi $= 10\ \text{mca}$.
    pide: El caudal y la altura piezométrica en la garganta.

    pasos:
      - tipo: reconocer
        pregunta: |
          El venturímetro es **vertical**. ¿Cambia eso la fórmula del caudal?
        opciones:
          - texto: >-
              No: el manómetro diferencial mide la diferencia de alturas
              **piezométricas**, y la cota ya está incluida en ella
            correcta: true
            mensaje: |
              Ese es el resultado que hace tan cómodo el venturímetro. Da igual
              cómo esté colocado: lo que el manómetro lee es
              $\Delta(p/\gamma + z)$, que es exactamente lo que Bernoulli
              relaciona con las velocidades.
          - texto: >-
              Sí: hay que sumar la diferencia de cotas entre entrada y garganta
            mensaje: |
              Si se suma, se cuenta dos veces: el manómetro ya la lleva dentro.
              Es el error clásico de los venturímetros inclinados.
          - texto: >-
              Sí, pero solo si el líquido manométrico es más denso que el que
              circula
            mensaje: |
              La densidad del líquido manométrico afecta a la **magnitud** de
              la lectura, no a si la cota entra o no. La independencia de la
              inclinación es geométrica.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '64 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '85.28 l/s'
            mensaje: |
              Has usado $1{,}16\ \text{m}$ directamente como diferencia de
              alturas piezométricas. Hay que corregirla por la densidad del
              líquido manométrico: $\Delta h = R\,(s_m/s - 1) = 0{,}6525$ m.
          - valor: '61.93 l/s'
            mensaje: |
              Te falta corregir por la relación de áreas. El denominador
              $\sqrt{1-(A_2/A_1)^{2}}$ vale $0{,}968$ y sube el resultado un
              3 %.
        pista: |
          $\Delta h = R\,(s_m/s - 1)$, y después la fórmula del venturímetro
          con el factor $\sqrt{1-(A_2/A_1)^{2}}$.
        desarrollo: |
          $$
          \Delta h = 1{,}16\left(\frac{1{,}25}{0{,}8}-1\right) = 0{,}6525\ \text{mcl}
          $$
          $$
          Q = \frac{C\,A_2\sqrt{2g\,\Delta h}}{\sqrt{1-(A_2/A_1)^{2}}}
          = \frac{0{,}98\cdot 0{,}01767\cdot 3{,}576}{0{,}968}
          = 0{,}064\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La altura en el piezómetro de la garganta
        pregunta: |
          ¿Qué altura alcanzaría un piezómetro abierto en la garganta?
        respuesta:
          tipo: magnitud
          valor: '11.87 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '12.5 m'
            mensaje: |
              Esa es la altura a la entrada, $10\ \text{mca}$ pasados a columna
              del líquido. En la garganta la presión es **menor**: el agua se
              ha acelerado.
          - valor: '9.374 m'
            mensaje: |
              No has convertido los $10\ \text{mca}$ de entrada a columna del
              líquido. El fluido tiene $s = 0{,}8$, así que
              $10\ \text{mca} = 12{,}5\ \text{mcl}$: en un líquido más ligero,
              la misma presión levanta más columna.
        pista: |
          Los $10\ \text{mca}$ hay que pasarlos a columna del líquido, y
          después aplicar Bernoulli con las dos alturas cinéticas.
        desarrollo: |
          $$
          \frac{p_1}{\gamma} = \frac{10}{0{,}8} = 12{,}5\ \text{mcl}
          \qquad
          \frac{v_1^{2}}{2g} = 0{,}042
          \qquad
          \frac{v_2^{2}}{2g} = 0{,}668\ \text{m}
          $$
          $$
          \frac{p_2}{\gamma} = 12{,}5 + 0{,}042 - 0{,}668 = 11{,}87\ \text{mcl}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro diferencial mide alturas piezométricas, así que la
              inclinación del venturímetro no interviene en la fórmula del
              caudal.
          - texto: >-
              Corrigiendo la lectura por la densidad del líquido manométrico,
              $\Delta h = 0{,}6525$ mcl, y de ahí $Q = 64$ l/s.
          - texto: >-
              En la garganta el piezómetro subiría 11,87 m: seis decímetros
              menos que a la entrada, que es lo que se ha convertido en
              velocidad.
          - texto: >-
              Como el venturímetro es vertical y el flujo asciende, la presión
              en la garganta es menor por dos motivos: la velocidad y la cota.
            trampa: true
            mensaje: |
              El enunciado dice «considerar la cota constante a lo largo del
              venturímetro», así que la cota no interviene en el apartado b).
              Y aunque interviniera, no cambiaría el caudal: eso es justo lo
              que el manómetro diferencial resuelve solo.

    resolucion: |
      **Lo que mide un manómetro diferencial no es una presión, es una
      diferencia de alturas piezométricas.** Por eso un venturímetro se puede
      poner horizontal, vertical o inclinado y su fórmula no cambia:

      $$
      \Delta h = R\left(\frac{s_m}{s}-1\right)
      = 1{,}16\left(\frac{1{,}25}{0{,}8}-1\right) = 0{,}6525\ \text{mcl}
      $$
      $$
      Q = \frac{C\,A_2\sqrt{2g\Delta h}}{\sqrt{1-(A_2/A_1)^{2}}} = 64\ \text{l/s}
      $$

      **La altura en la garganta**, con los $10\ \text{mca}$ de entrada
      pasados a columna del líquido:

      $$
      \frac{p_2}{\gamma} = 12{,}5 + 0{,}042 - 0{,}668 = 11{,}87\ \text{mcl}
      $$

      **Dos cosas que este ejercicio deja claras.**

      La primera es la independencia de la inclinación, y no es un truco de
      cálculo: es la razón práctica de que el venturímetro sea el medidor de
      caudal más fiable de los tres del tema. Se instala como se pueda y sigue
      midiendo.

      La segunda es el orden de magnitud de la caída: **seis decímetros de
      columna sobre doce metros y medio**, un 5 %. Un venturímetro apenas
      perturba la conducción, y por eso su pérdida permanente es tan pequeña
      comparada con la de un diafragma.

  # ── COLECCIÓN 3.32 y 3.33. Los dos vertederos de referencia, rectangular y
  #    triangular, sobre el mismo canal y la misma carga: la comparación es lo
  #    que enseña.
  - id: ejflu13-col332-los-dos-vertederos
    titulo: El mismo canal con vertedero rectangular y con vertedero en V
    fuente: >-
      Ejercicios 3.32 y 3.33 · Colección de Problemas, capítulo 3 · Mecánica
      de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      **3.32.** Un vertedero horizontal en un canal, cuya anchura es de
      $4\ \text{m}$, tiene una altura sobre la solera del canal
      $H = 1{,}2\ \text{m}$. La profundidad aguas arriba es de $1{,}6\ \text{m}$.
      Estímese el caudal si el vertedero fuera:

      a) De pared delgada ($C_{\text{vertedero}} = 0{,}6$).

      b) De pared gruesa.

      **3.33.** Un vertedero triangular con ángulo $\alpha = 90°$ tiene hasta
      el vértice una altura $H = 1{,}2\ \text{m}$. La profundidad del flujo
      aguas arriba es de $1{,}6\ \text{m}$. Calcúlese el caudal.
    pide: Los caudales de los tres vertederos, con la misma carga.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la «carga» de un vertedero y cuánto vale aquí?
        opciones:
          - texto: >-
              La altura de la lámina **por encima del umbral**:
              $1{,}6 - 1{,}2 = 0{,}4\ \text{m}$
            correcta: true
            mensaje: |
              Eso es, y es lo único que interviene en el caudal. La altura del
              umbral sobre la solera —los 1,2 m— no aparece en ninguna
              fórmula: solo sirve para saber cuál es la carga.
          - texto: >-
              La profundidad del canal aguas arriba, $1{,}6\ \text{m}$
            mensaje: |
              Esa es la profundidad total. Lo que vierte por encima del umbral
              son los $0{,}4\ \text{m}$ que sobresalen, y es esa altura la que
              va en la fórmula.
          - texto: >-
              La altura del umbral, $1{,}2\ \text{m}$
            mensaje: |
              El umbral es el obstáculo, no la lámina que lo supera. Con carga
              cero —agua justo al nivel del umbral— no vertería nada, por alto
              que fuese el umbral.

      - tipo: calcular
        titulo: El vertedero rectangular de pared delgada
        pregunta: |
          ¿Qué caudal pasa por el vertedero rectangular de pared delgada?
        respuesta:
          tipo: magnitud
          valor: '1.792 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '14.34 m3/s'
            mensaje: |
              Has usado la profundidad total, $1{,}6\ \text{m}$, como carga.
              La carga es lo que sobresale del umbral: $0{,}4\ \text{m}$. Y
              como va elevada a $3/2$, el error es enorme.
          - valor: '2.688 m3/s'
            mensaje: |
              Te falta el factor $2/3$ que sale de integrar la velocidad
              torricelliana a lo largo de la lámina vertiente. Sin él, el
              caudal sale un 50 % de más.
        pista: |
          $Q = \dfrac{2}{3}\,C\,b\,\sqrt{2g}\;h^{3/2}$, con $h$ la carga.
        desarrollo: |
          $$
          Q = \frac{2}{3}\cdot 0{,}6\cdot 4\cdot\sqrt{19{,}6}\cdot 0{,}4^{3/2}
          = 1{,}6\cdot 4{,}427\cdot 0{,}253 = 1{,}792\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: El vertedero triangular
        pregunta: |
          Y con el vertedero en V de $90°$ y la misma carga, ¿cuánto pasa?
        respuesta:
          tipo: magnitud
          valor: '0.1434 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '0.3584 m3/s'
            mensaje: |
              Has usado el exponente $3/2$, el del rectangular. En un vertedero
              triangular la anchura crece con la altura, así que aparece una
              potencia más: el exponente es $5/2$.
          - valor: '1.792 m3/s'
            mensaje: |
              Ese es el rectangular. El triangular deja pasar doce veces menos
              con la misma carga, y esa diferencia es justamente para lo que
              sirve.
        pista: |
          $Q = \dfrac{8}{15}\,C\sqrt{2g}\,\tan\dfrac{\alpha}{2}\;h^{5/2}$, con
          $C = 0{,}6$.
        desarrollo: |
          $$
          Q = \frac{8}{15}\cdot 0{,}6\cdot\sqrt{19{,}6}\cdot\tan 45°\cdot 0{,}4^{5/2}
          = 0{,}32\cdot 4{,}427\cdot 0{,}1012 = 0{,}1434\ \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la misma carga de $0{,}4\ \text{m}$, el vertedero rectangular
              de 4 m deja pasar $1{,}79\ \text{m}^{3}/\text{s}$ y el de pared
              gruesa, $1{,}72$.
          - texto: >-
              El triangular de 90° deja pasar solo $0{,}143$: doce veces menos.
          - texto: >-
              La diferencia viene del exponente: $h^{3/2}$ en el rectangular y
              $h^{5/2}$ en el triangular, porque en este la anchura también
              crece con la carga.
          - texto: >-
              Por eso el vertedero triangular es el que se usa para medir
              caudales grandes: al dejar pasar menos, la lámina sube más y se
              mide mejor.
            trampa: true
            mensaje: |
              Se usa para caudales **pequeños**, y por esa misma razón: como
              el caudal va con $h^{5/2}$, un caudal pequeño produce una carga
              relativamente grande y fácil de leer. Para caudales grandes el
              triangular exigiría una carga enorme, y ahí se usa el
              rectangular.

    resolucion: |
      **La carga es lo único que interviene**, y es lo que sobresale del
      umbral: $h = 1{,}6 - 1{,}2 = 0{,}4\ \text{m}$. La altura del umbral sobre
      la solera no aparece en ninguna fórmula.

      | vertedero | fórmula | caudal |
      |---|---|---|
      | rectangular, pared delgada | $\frac{2}{3}Cb\sqrt{2g}\,h^{3/2}$ | $1{,}79\ \text{m}^{3}/\text{s}$ |
      | rectangular, pared gruesa | $1{,}705\,b\,h^{3/2}$ | $1{,}72$ |
      | triangular de 90° | $\frac{8}{15}C\sqrt{2g}\tan\frac{\alpha}{2}h^{5/2}$ | $0{,}143$ |

      **Los dos rectangulares dan casi lo mismo** —un 4 % de diferencia— y eso
      es tranquilizador: el tipo de coronación afecta poco. Lo que cambia el
      resultado en un factor doce es la **forma de la abertura**.

      **Y el exponente es la razón de todo.** En un vertedero rectangular la
      anchura de la lámina es fija, así que el caudal va con $h^{3/2}$. En un
      triangular la anchura crece proporcionalmente a la altura, y eso añade
      una potencia: $h^{5/2}$.

      La consecuencia práctica está en la sensibilidad. Para medir un caudal
      **pequeño**, el triangular es mucho mejor: como el caudal cae tan deprisa
      con la carga, un caudal reducido produce una lámina que todavía se puede
      leer con precisión. Para caudales grandes pasa lo contrario, y ahí se usa
      el rectangular.

      Por eso los aforadores de laboratorio y de pequeños arroyos son
      triangulares, y los de canal de riego, rectangulares.

  # ── COLECCIÓN 3.30. El único del capítulo donde los tres aparatos del tema
  #    —piezómetro, Pitot y manómetro diferencial— trabajan a la vez y cada
  #    uno mide una cosa distinta. Y el resultado, un coeficiente de 0,65,
  #    explica por qué un diafragma no se usa sin calibrar.
  - id: ejflu13-col330-calibrar-el-diafragma
    titulo: Calibrar un diafragma con tres aparatos a la vez
    fuente: >-
      Ejercicio 3.30 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un diafragma de $50\ \text{mm}$ de diámetro sirve para medir el caudal
      de agua que circula por una tubería horizontal de $80\ \text{mm}$ de
      diámetro. Se desea calibrar el diafragma mediante un piezómetro abierto,
      un Pitot y un manómetro diferencial de mercurio. Para un valor del flujo
      determinado las lecturas son las siguientes:
      $H_{\text{piezómetro}} = 1960\ \text{mm}$;
      $H_{\text{Pitot}} = 2700\ \text{mm}$;
      $R_{\text{manómetro}} = 900\ \text{mm}$. Se pide:

      a) Coeficiente de gasto del diafragma.

      b) Número de Reynolds.

      Dato: viscosidad del agua $= 1\ \text{cSt}$.
    pide: El coeficiente de gasto del diafragma y el número de Reynolds.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres lecturas y cada una mide otra cosa. ¿Cuál da la velocidad
          en la tubería?
        opciones:
          - texto: >-
              La **diferencia** entre el Pitot y el piezómetro, porque el
              Pitot mide la carga total y el piezómetro solo la de presión
            correcta: true
            mensaje: |
              Exacto. Su diferencia es la altura cinética, $v^{2}/2g$, y de
              ahí sale la velocidad sin necesidad de ningún coeficiente. Es la
              medida «limpia» del ejercicio: la que sirve de patrón para
              calibrar el diafragma.
          - texto: >-
              El Pitot, porque es el aparato que mide velocidades
            mensaje: |
              El Pitot mide la carga **total**, presión más velocidad. Su
              lectura sola no dice nada de la velocidad; hace falta restarle
              la presión estática, que es lo que da el piezómetro.
          - texto: >-
              El manómetro diferencial, porque las diferencias de presión son
              proporcionales al cuadrado de la velocidad
            mensaje: |
              Ese mide la caída de presión **a través del diafragma**, que es
              precisamente la que queremos relacionar con el caudal. Si la
              usáramos para obtener la velocidad estaríamos suponiendo el
              coeficiente que buscamos.

      - tipo: calcular
        titulo: El caudal real
        pregunta: |
          ¿Qué caudal circula de verdad por la tubería?
        respuesta:
          tipo: magnitud
          valor: '19.14 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '36.6 l/s'
            mensaje: |
              Has usado los 2700 mm del Pitot como altura cinética. La carga
              total incluye la presión: la parte que corresponde a la
              velocidad es la **diferencia**, $2700 - 1960 = 740$ mm.
          - valor: '7.48 l/s'
            mensaje: |
              Parece que has usado el diámetro del diafragma, 50 mm, para
              calcular el caudal. La velocidad medida por Pitot y piezómetro
              es la de la **tubería**, así que va con los 80 mm.
        pista: |
          $v^{2}/2g = H_{\text{Pitot}} - H_{\text{piez}}$, y después
          $Q = v\,\pi D^{2}/4$ con $D = 80$ mm.
        desarrollo: |
          $$
          \frac{v^{2}}{2g} = 2{,}700 - 1{,}960 = 0{,}740\ \text{m}
          \;\Longrightarrow\;
          v = \sqrt{19{,}6\cdot 0{,}740} = 3{,}808\ \text{m/s}
          $$
          $$
          Q = 3{,}808\cdot\frac{\pi\,0{,}08^{2}}{4} = 19{,}14\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El coeficiente de gasto
        pregunta: |
          ¿Cuánto vale el coeficiente de gasto del diafragma?
        respuesta:
          tipo: numero
          valor: '0.654'
          tolerancia: 0.01
          formato: un número sin unidades
        distractores:
          - valor: '2.32'
            mensaje: |
              Te has dejado el mercurio. Los 900 mm de desnivel del manómetro
              no son 900 mm de columna de agua: hay que multiplicar por
              $s_{Hg} - 1 = 12{,}6$, y salen 11,34 m. Y fíjate en que un
              coeficiente de gasto **mayor que 1 es imposible**: el aparato no
              puede dejar pasar más de lo que la teoría permite.
          - valor: '1.249'
            mensaje: |
              Has usado los 2700 mm del Pitot como altura cinética en vez de
              la diferencia con el piezómetro. Otra vez sale mayor que 1, que
              es la señal de que algo va mal.
        pista: |
          $C_d = Q_{\text{real}}/Q_{\text{teórico}}$, con
          $Q_{\text{teórico}} = A_{\text{diaf}}\sqrt{2g\,\Delta h}$ y
          $\Delta h = R\,(s_{Hg}-1)$.
        desarrollo: |
          $$
          \Delta h = 0{,}9\,(13{,}6 - 1) = 11{,}34\ \text{m de agua}
          $$
          $$
          Q_{\text{teo}} = \frac{\pi\,0{,}05^{2}}{4}\sqrt{19{,}6\cdot 11{,}34}
          = 29{,}27\ \text{l/s}
          $$
          $$
          C_d = \frac{19{,}14}{29{,}27} = 0{,}654
          $$

      - tipo: calcular
        titulo: El número de Reynolds
        pregunta: |
          ¿Cuánto vale $Re$ en la tubería?
        respuesta:
          tipo: numero
          valor: '304700'
          tolerancia: 2000
          formato: un número sin unidades
        distractores:
          - valor: '190400'
            mensaje: |
              Has usado el diámetro del diafragma. El Reynolds que caracteriza
              el flujo de la conducción se calcula con el diámetro de la
              **tubería**, 80 mm, y con su velocidad.
          - valor: '487500'
            mensaje: |
              Parece que has mezclado la velocidad de la garganta con el
              diámetro del diafragma, o al revés. Las dos magnitudes tienen
              que ser de la misma sección: $v = 3{,}81$ m/s con $D = 0{,}08$ m.
        pista: |
          $1\ \text{cSt} = 10^{-6}\ \text{m}^{2}/\text{s}$.
        desarrollo: |
          $$
          Re = \frac{v\,D}{\nu} = \frac{3{,}808\cdot 0{,}08}{10^{-6}}
          = 3{,}05\cdot 10^{5}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Pitot menos piezómetro da la altura cinética, 0,740 m, y con
              ella la velocidad real: 3,81 m/s y 19,14 l/s.
          - texto: >-
              El manómetro de mercurio da la caída a través del diafragma,
              $0{,}9\cdot 12{,}6 = 11{,}34$ m de agua, de la que saldrían
              29,27 l/s teóricos.
          - texto: >-
              El cociente entre los dos es el coeficiente de gasto, 0,65: el
              diafragma deja pasar dos tercios de lo que la teoría le
              atribuye.
          - texto: >-
              Y ese 0,65 es una propiedad del aparato, así que servirá para
              cualquier caudal y cualquier fluido que pase por él.
            trampa: true
            mensaje: |
              Depende del **número de Reynolds**, y por eso el apartado b)
              pide calcularlo: la calibración vale en el entorno de
              $Re = 3\cdot 10^{5}$. Por encima de unos $10^{5}$ el
              coeficiente se estabiliza bastante y la aproximación es
              razonable, pero a Reynolds bajos cae en picado. Un caudalímetro
              se calibra en su rango de trabajo, no de una vez para siempre.

    resolucion: |
      **Tres aparatos, tres medidas distintas.** Es lo que hace bueno a este
      ejercicio: obliga a decir qué mide cada uno antes de tocar un número.

      | aparato | lectura | qué mide |
      |---|---|---|
      | piezómetro | 1960 mm | la carga de presión, $p/\gamma$ |
      | Pitot | 2700 mm | la carga total, $p/\gamma + v^{2}/2g$ |
      | manómetro diferencial | 900 mm Hg | la caída a través del diafragma |

      **El caudal patrón.** La diferencia entre el Pitot y el piezómetro es la
      altura cinética, y de ahí sale la velocidad **sin ningún coeficiente**:
      $v = 3{,}808$ m/s, $Q = 19{,}14$ l/s. Este es el caudal de verdad, el
      que sirve de referencia.

      **El caudal que el diafragma cree ver.** Con $\Delta h = 11{,}34$ m de
      agua y su propia sección, la teoría daría 29,27 l/s.

      $$
      C_d = \frac{19{,}14}{29{,}27} = 0{,}654
      $$

      **Qué significa ese 0,65.** El chorro que atraviesa el diafragma se
      contrae por detrás —la vena contracta— y además pierde por fricción, así
      que pasa un tercio menos de lo que la ecuación ideal predice. **Un
      diafragma sin calibrar sobreestima el caudal en un 50 %**, y por eso
      todo caudalímetro de obstrucción lleva su coeficiente.

      **Una nota sobre la fórmula teórica.** Aquí se ha usado
      $Q_{\text{teo}} = A_2\sqrt{2g\Delta h}$, sin el factor de velocidad de
      aproximación $1/\sqrt{1-\beta^{4}}$. Es la convención de la colección, y
      es la que reproduce el 0,65 publicado. Incluyendo ese factor el
      coeficiente saldría 0,602, y sería igual de correcto: **el coeficiente
      no significa nada sin decir con qué fórmula teórica se ha comparado.**

  # ── COLECCIÓN 3.31. Dos aparatos encadenados: un orificio que fija el
  #    caudal y un vertedero que lo tiene que evacuar. Es el ejercicio que
  #    obliga a ver que en una instalación el caudal lo manda uno y el resto
  #    se adapta.
  - id: ejflu13-col331-del-orificio-al-vertedero
    titulo: Del orificio al vertedero, y quién manda el caudal
    fuente: >-
      Ejercicio 3.31 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El agua evacuada a través de un orificio de $15\ \text{cm}$ de diámetro
      ($C_d = 0{,}6$), bajo una altura de carga de $3\ \text{m}$, pasa a un
      canal rectangular y por un vertedero con contracciones. El canal tiene
      $1{,}8\ \text{m}$ de ancho y el vertedero $0{,}3\ \text{m}$, siendo
      $1{,}50\ \text{m}$ la altura de su umbral sobre la solera del canal.

      Determinar la profundidad del agua sobre la solera del canal, en metros.
    pide: La profundidad del agua sobre la solera del canal.

    pasos:
      - tipo: reconocer
        pregunta: |
          El orificio y el vertedero están en serie. ¿Quién fija el caudal y
          quién se adapta?
        opciones:
          - texto: >-
              Lo fija el orificio, porque su carga de 3 m es un dato; el
              vertedero se adapta subiendo la lámina hasta poder evacuarlo
            correcta: true
            mensaje: |
              Eso es. El orificio tiene todos sus datos y da un caudal
              cerrado. El vertedero es el que tiene la incógnita, y lo que
              ajusta es su carga.
          - texto: >-
              Lo fija el vertedero, porque es el que está aguas abajo y
              controla la salida
            mensaje: |
              Estar aguas abajo no da el mando. El vertedero solo podría
              limitar el caudal si se ahogara, y aquí desagua libremente: se
              limita a evacuar lo que le llega, con la lámina que haga falta.
          - texto: >-
              Ninguno: hay que resolver las dos ecuaciones a la vez porque el
              nivel del canal afecta al orificio
            mensaje: |
              Afectaría si el orificio descargara **sumergido**, con el nivel
              del canal por encima de él. Aquí el orificio descarga a la
              atmósfera con una carga fija de 3 m, así que su caudal no
              depende de lo que pase después.

      - tipo: calcular
        titulo: El caudal del orificio
        pregunta: |
          ¿Qué caudal sale por el orificio?
        respuesta:
          tipo: magnitud
          valor: '81.3 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '135.5 l/s'
            mensaje: |
              Te has dejado el coeficiente de gasto. El $C_d = 0{,}6$ recoge
              la contracción de la vena y la fricción: por un orificio sale
              siempre bastante menos de lo que dice Torricelli.
          - valor: '57.5 l/s'
            mensaje: |
              Te has dejado el 2 de $\sqrt{2gH}$. La velocidad de salida es
              la de caída libre desde la carga: $\sqrt{2gH}$, no $\sqrt{gH}$.
        pista: |
          $Q = C_d\,A\sqrt{2gH}$, con $A$ la sección del orificio y $H$ la
          carga.
        desarrollo: |
          $$
          Q = 0{,}6\cdot\frac{\pi\,0{,}15^{2}}{4}\sqrt{2\cdot 9{,}8\cdot 3}
          = 0{,}6\cdot 0{,}01767\cdot 7{,}668 = 81{,}3\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La lámina sobre el umbral
        pregunta: |
          ¿Cuánta agua hay por encima del umbral del vertedero?
        respuesta:
          tipo: magnitud
          valor: '0.329 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.279 m'
            mensaje: |
              Has usado la longitud del vertedero tal cual, sin descontar las
              contracciones. Con dos contracciones laterales la longitud
              efectiva es $L - 0{,}2h$, y ese descuento importa mucho aquí
              porque el vertedero es estrecho: 30 cm frente a 33 de lámina.
          - valor: '0.15 m'
            mensaje: |
              Comprueba el orden de magnitud: con esa lámina el vertedero
              evacuaría 29 l/s, poco más de un tercio de lo que le llega. Tiene que
              subir bastante más.
        pista: |
          Francis con contracciones: $Q = 1{,}84\,(L - 0{,}1\,n\,h)\,h^{3/2}$,
          con $n = 2$ y $L = 0{,}3$ m. Hay que iterar.
        desarrollo: |
          $$
          0{,}0813 = 1{,}84\,(0{,}3 - 0{,}2h)\,h^{3/2}
          $$

          | $h$ | $L_{\text{ef}}$ | $Q$ (l/s) |
          |---|---|---|
          | 0,30 | 0,240 | 72,6 |
          | 0,33 | 0,234 | 81,6 |
          | 0,329 | 0,234 | 81,3 |

          $$
          h = 0{,}329\ \text{m}
          $$

      - tipo: calcular
        titulo: La profundidad sobre la solera
        pregunta: |
          ¿Qué profundidad tiene el agua medida desde la solera del canal?
        respuesta:
          tipo: magnitud
          valor: '1.829 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.5 m'
            mensaje: |
              Esa es la altura del umbral. Encima del umbral hay 33 cm más de
              agua, que es justamente lo que el vertedero necesita para
              evacuar el caudal.
          - valor: '0.329 m'
            mensaje: |
              Esa es la lámina sobre el umbral. La pregunta es desde la
              **solera**, es decir desde el fondo del canal, y el umbral está
              a 1,50 m de ella.
        pista: |
          La profundidad es el umbral más la lámina.
        desarrollo: |
          $$
          y = 1{,}50 + 0{,}329 = 1{,}829\ \text{m}
          $$

          El boletín publica 1,84 m; la diferencia es del 0,6 %.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El orificio manda: con $C_d = 0{,}6$ y 3 m de carga entrega
              81,3 l/s, y ese caudal no depende de nada de lo que hay aguas
              abajo.
          - texto: >-
              El vertedero tiene que evacuarlo, y para eso necesita 0,329 m de
              lámina sobre su umbral.
          - texto: >-
              Como el umbral está a 1,50 m de la solera, el agua del canal
              llega a 1,83 m de profundidad.
          - texto: >-
              El ancho del canal, 1,8 m, entra en la cuenta porque determina
              la velocidad de aproximación al vertedero.
            trampa: true
            mensaje: |
              El ancho del canal **no se ha usado en ningún sitio**, y es un
              dato que el enunciado da a propósito para ver si se distingue lo
              que hace falta de lo que no. La fórmula de Francis con
              contracciones ya lleva incorporado el efecto de la velocidad de
              aproximación en su coeficiente 1,84; el ancho solo importaría si
              hubiera que corregirla, y con 1,8 m frente a 30 cm de vertedero
              la aproximación es tan lenta que no lo pide.

    resolucion: |
      **Quién manda.** El orificio tiene todos sus datos —diámetro, carga y
      coeficiente— así que su caudal está cerrado antes de mirar el resto:

      $$
      Q = C_d\,A\sqrt{2gH} = 81{,}3\ \text{l/s}
      $$

      El vertedero no puede cambiarlo: solo puede subir su lámina hasta
      evacuarlo.

      **La lámina.** Francis con dos contracciones laterales,

      $$
      Q = 1{,}84\,(L - 0{,}2h)\,h^{3/2}
      $$

      y hay que iterar porque $h$ aparece dos veces. Salen 0,329 m.

      **Cuánto pesan las contracciones aquí.** Sin descontarlas la lámina
      saldría 0,279 m: **cinco centímetros de diferencia, un 18 %**. Y es
      lógico: la corrección resta $0{,}2h = 6{,}6$ cm a una longitud de
      30 cm, o sea el 22 % del vertedero. En un vertedero de tres metros ese
      mismo descuento sería del 2 % y podría despreciarse; en uno de treinta
      centímetros, no.

      **La profundidad.** $1{,}50 + 0{,}329 = 1{,}83$ m sobre la solera. El
      boletín publica 1,84.

      **Y el dato que sobra.** El ancho del canal, 1,8 m, no interviene. Está
      en el enunciado como en el examen: para que haya que decidir qué se usa.

  # ── COLECCIÓN 3.33. Tres líneas, y sirve para fijar la ley de potencia
  #    5/2 del vertedero triangular, que es lo que lo hace bueno midiendo
  #    caudales pequeños y malo midiendo grandes.
  - id: ejflu13-col333-el-vertedero-triangular
    titulo: El vertedero triangular, y la potencia cinco medios
    fuente: >-
      Ejercicio 3.33 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un vertedero triangular con ángulo $\alpha = 90°$ tiene hasta el vértice
      una altura $H = 1{,}2\ \text{m}$. La profundidad del flujo aguas arriba
      es de $1{,}6\ \text{m}$. Calcúlese el caudal.

      Dato: $C_d = 0{,}6$.
    pide: El caudal que evacua el vertedero.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da dos alturas: 1,2 m hasta el vértice y 1,6 m de
          profundidad. ¿Cuál es la carga del vertedero?
        opciones:
          - texto: >-
              La diferencia, $0{,}4\ \text{m}$: la carga se mide desde el
              vértice de la V hasta la superficie libre
            correcta: true
            mensaje: |
              Eso es. La carga es la altura de agua **que pasa por encima** de
              la escotadura, no la profundidad del canal. El 1,2 solo sirve
              para situar el vértice.
          - texto: >-
              $1{,}6\ \text{m}$, que es la profundidad del agua
            mensaje: |
              Esa es la profundidad del canal. Por debajo del vértice el agua
              está quieta contra la pared del vertedero; solo la lámina que
              queda por encima participa en el desagüe. Usar 1,6 multiplica el
              caudal por 32.
          - texto: >-
              $1{,}2\ \text{m}$, la altura del vértice
            mensaje: |
              Esa es la altura a la que **empieza** la escotadura. La carga se
              cuenta desde ahí hacia arriba: $1{,}6 - 1{,}2 = 0{,}4$ m.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Cuánto caudal evacua?
        respuesta:
          tipo: magnitud
          valor: '143 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '4588 l/s'
            mensaje: |
              Has usado $h = 1{,}6$ m. Con la potencia $5/2$ el error se
              amplifica muchísimo: $(1{,}6/0{,}4)^{2,5} = 32$, y el caudal
              sale treinta y dos veces mayor.
          - valor: '179 l/s'
            mensaje: |
              Has usado el coeficiente $2/3$ del vertedero **rectangular**. El
              triangular lleva $8/15$, que sale de integrar sobre una anchura
              que crece linealmente con la altura en vez de ser constante.
        pista: |
          $Q = \dfrac{8}{15}\,C_d\sqrt{2g}\,\tan\dfrac{\alpha}{2}\,h^{5/2}$,
          con $\alpha = 90°$ y $h$ la carga.
        desarrollo: |
          $$
          Q = \frac{8}{15}\cdot 0{,}6\cdot\sqrt{19{,}6}\cdot\tan 45°\cdot
          0{,}4^{5/2}
          $$
          $$
          = 0{,}32\cdot 4{,}427\cdot 1\cdot 0{,}1012 = 0{,}1434\
          \text{m}^{3}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga es $1{,}6 - 1{,}2 = 0{,}4$ m: solo cuenta el agua que
              pasa por encima del vértice.
          - texto: >-
              Con $\alpha = 90°$ la tangente de la mitad vale 1, y la fórmula
              se queda en $Q = \frac{8}{15}C_d\sqrt{2g}\,h^{5/2}$.
          - texto: >-
              De ahí salen 143 l/s, y el exponente $5/2$ viene de que la
              anchura de la escotadura crece con la altura.
          - texto: >-
              Y como el exponente es mayor que el del rectangular, el
              triangular es más preciso midiendo caudales grandes.
            trampa: true
            mensaje: |
              Es al revés, y es la razón de ser del vertedero en V. Con
              $Q \propto h^{5/2}$ un cambio pequeño de caudal produce un
              cambio **relativamente grande** de lámina cuando la lámina es
              pequeña: por eso mide bien los caudales pequeños. Con caudales
              grandes la lámina crece tanto que el vertedero se vuelve
              inmanejable, y ahí se usa el rectangular, que va con
              $h^{3/2}$.

    resolucion: |
      **La carga, que es la única dificultad.** El enunciado da dos alturas y
      solo una es la carga: $h = 1{,}6 - 1{,}2 = 0{,}4$ m. Confundirlas
      multiplica el resultado por 32, y ese factor sale precisamente del
      exponente $5/2$.

      **La fórmula y de dónde sale.** En una escotadura en V la anchura a la
      altura $y$ es $2(h-y)\tan(\alpha/2)$, y al integrar $v\,dA$ con
      $v = \sqrt{2gy}$ aparece el $8/15$ y la potencia $5/2$:

      $$
      Q = \frac{8}{15}\,C_d\sqrt{2g}\,\tan\frac{\alpha}{2}\,h^{5/2}
      = 143\ \text{l/s}
      $$

      Con $\alpha = 90°$, que es el ángulo estándar, la tangente vale 1 y la
      fórmula se simplifica a $Q = 1{,}417\,h^{5/2}$ para $C_d = 0{,}6$.

      **Por qué el exponente decide el uso.** Compara con el rectangular, que
      va con $h^{3/2}$:

      | | ley | duplicar el caudal sube la lámina |
      |---|---|---|
      | triangular | $h^{5/2}$ | un 32 % |
      | rectangular | $h^{3/2}$ | un 59 % |

      Leído al revés: para el **mismo** error de lectura de la lámina, el
      triangular comete menos error de caudal cuando el caudal es pequeño,
      porque su lámina es proporcionalmente más alta. Es el aforador de los
      arroyos y los laboratorios. Y por lo mismo, con caudales grandes su
      lámina se dispara y deja de ser práctico.
  - id: ejflu13-col35-el-sifon-que-vacia-mas-deprisa-de-lo-que-entra
    titulo: El sifón que vacía más deprisa de lo que entra
    fuente: Ejercicio 3.5 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito rectangular alimentado de forma permanente por un flujo de
      30 l/s de agua, tiene una superficie trasversal de 20 m². Un sifón de
      100 mm de diámetro asegura el vaciado del depósito. Con los datos
      indicados en la figura y partiendo del momento en que se encuentra lleno
      y por tanto el sifón cebado, se pide:

      a) Deducir si el depósito se vaciará, desbordará.

      b) Expresión que proporcione la altura de la lámina de agua en función
      del tiempo.

      c) Deducir si se podrá alcanzar el régimen permanente.

      d) Tiempo que tardará el agua en alcanzar la cota mínima.

      Nota: Despréciense las pérdidas de carga.

      <figure class="figura-examen">
      <svg viewBox="20 28 372 192" role="img" width="430" height="222"
           aria-labelledby="f35t f35d">
        <title id="f35t">El depósito de 20 metros cuadrados con su sifón: la boca en la cota 2, la lámina en la 3 y la salida en la 0</title>
        <desc id="f35d">Un depósito rectangular con el fondo en la cota 1 y el
        agua hasta la cota 3, alimentado por arriba con 30 litros por segundo.
        Un sifón de 100 mm entra por la izquierda: su boca está dentro del agua
        en la cota 2, sube por encima de la pared y baja por fuera hasta
        descargar en la cota 0. Las cotas están a escala.</desc>
        <defs>
          <marker id="m35l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <rect x="120" y="80" width="210" height="80" fill="var(--live)" opacity="0.15"/>
        <line x1="120" y1="80" x2="330" y2="80" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M120,64 V160 H330 V64" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="250" y1="40" x2="250" y2="72" stroke="var(--live)" stroke-width="2" marker-end="url(#m35l)"/>
        <text x="256" y="52" font-size="10" fill="var(--live)">Q = 30 l/s</text>
        <text x="225" y="152" text-anchor="middle" font-size="10" fill="var(--live)">A = 20 m²</text>
        <path d="M150,120 V60 A20,20 0 0 0 110,60 V200" fill="none" stroke="var(--ink)" stroke-width="6.5"/>
        <path d="M150,120 V60 A20,20 0 0 0 110,60 V200" fill="none" stroke="var(--live)" stroke-width="3.6"/>
        <line x1="110" y1="203" x2="110" y2="214" stroke="var(--live)" stroke-width="2" marker-end="url(#m35l)"/>
        <text x="104" y="140" text-anchor="end" font-size="9.5" fill="var(--ink)">sifón Ø 100 mm</text>
        <text x="160" y="114" font-size="9.5" fill="var(--ink)">boca del sifón</text>
        <line x1="116" y1="200" x2="350" y2="200" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="332" y1="160" x2="350" y2="160" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="156" y1="120" x2="350" y2="120" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="332" y1="80" x2="350" y2="80" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="350" y1="80" x2="350" y2="200" stroke="var(--faint)" stroke-width="1"/>
        <path d="M346,80 h8 M346,120 h8 M346,160 h8 M346,200 h8" stroke="var(--faint)" stroke-width="1"/>
        <text x="357" y="84" font-size="9.5" fill="var(--faint)">3,0</text>
        <text x="357" y="124" font-size="9.5" fill="var(--faint)">2,0</text>
        <text x="357" y="164" font-size="9.5" fill="var(--faint)">1,0</text>
        <text x="357" y="204" font-size="9.5" fill="var(--faint)">0,0</text>
      </svg>
      <figcaption>Las cotas a escala, medidas desde la salida del sifón. La boca está en la 2,0: cuando la lámina llega ahí entra aire y el sifón se desceba.</figcaption>
      </figure>
    pide: Si se vacía o desborda, la ley z(t), si hay régimen permanente y cuánto tarda en llegar a la cota mínima.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el depósito lleno, la lámina está a 3 m sobre la salida del sifón
          y a 1 m sobre su boca. ¿Qué caudal saca el sifón en ese instante, y
          qué le pasa al nivel?
        opciones:
          - texto: Torricelli con los 3 m hasta la salida, 60,2 l/s, el doble de lo que entra, así que el nivel baja
            correcta: true
            mensaje: |
              Eso es. La velocidad la manda el desnivel entre la lámina libre y
              el punto donde el chorro sale a la atmósfera, que es la descarga
              en la cota 0: $\sqrt{2g \cdot 3} = 7{,}67$ m/s por 78,5 cm² son
              60,2 l/s. Entran 30: se vacía.
          - texto: Torricelli con el metro de agua que hay sobre la boca, 34,8 l/s, y baja despacio
            mensaje: |
              La boca no es donde el agua sale a la atmósfera: es donde entra
              en el tubo, y ahí la presión no es la atmosférica. El desnivel que
              cuenta es hasta la descarga, 3 m.
          - texto: Justo los 30 l/s que entran, porque en régimen permanente los dos caudales se igualan
            mensaje: |
              El régimen permanente no está garantizado: hay que ver a qué
              nivel se igualarían los caudales, y ese nivel resulta estar por
              debajo de la boca del sifón. Al principio saca el doble de lo que
              entra.

      - tipo: calcular
        titulo: El caudal saliente al empezar
        pregunta: |
          Caudal que saca el sifón con la lámina en la cota 3, sin pérdidas.
        respuesta:
          tipo: magnitud
          valor: '60.2 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '34.8 l/s'
            mensaje: |
              Has usado 1 m, la altura sobre la boca. Torricelli va entre la
              lámina libre y la salida a la atmósfera: 3 m.
          - valor: '49.2 l/s'
            mensaje: |
              Eso es el caudal cuando la lámina ya ha bajado a la cota 2 —el
              que decide si el sifón se desceba—, no el inicial.
          - valor: '240.9 l/s'
            mensaje: |
              Has tomado los 100 mm como radio. Con el diámetro, la sección es
              $\pi \cdot 0{,}1^{2}/4 = 78{,}5$ cm².
        pista: |
          $Q = a\sqrt{2gz}$ con $a = \pi D^{2}/4$ y $z = 3$ m.
        desarrollo: |
          $$
          Q_s = \frac{\pi \cdot 0{,}1^{2}}{4}\sqrt{2 \cdot 9{,}8 \cdot 3} = 0{,}00785 \cdot 7{,}67 = 0{,}0602\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: Dónde estaría el régimen permanente
        pregunta: |
          Cota $z$ de la lámina en la que el caudal saliente igualaría a los
          30 l/s que entran.
        respuesta:
          tipo: magnitud
          valor: '0.744 m'
          tolerancia: 0.01
          formato: una cota con su unidad (m)
        distractores:
          - valor: '0.86 m'
            mensaje: |
              Te has quedado en $\sqrt{z}$. De $0{,}0348\sqrt{z} = 0{,}03$ sale
              $\sqrt{z} = 0{,}863$, y $z = 0{,}744$ m.
          - valor: '1.74 m'
            mensaje: |
              Has medido desde el fondo del depósito. Las cotas de la figura
              van desde la salida del sifón, que es el origen de Torricelli:
              $z = 0{,}744$ m, y está por debajo del fondo.
          - valor: '2 m'
            mensaje: |
              Esa es la boca del sifón, no el equilibrio. El equilibrio sería
              $z = 0{,}744$ m, y como está por debajo de la boca, el sifón se
              desceba antes de llegar: no hay régimen permanente.
        pista: |
          $a\sqrt{2gz} = 0{,}03$ → $0{,}0348\sqrt{z} = 0{,}03$.
        desarrollo: |
          $$
          \sqrt{z} = \frac{0{,}03}{0{,}0348} = 0{,}863 \;\Longrightarrow\; z = 0{,}744\ \text{m}
          $$

          Está por debajo de la boca del sifón (cota 2) y hasta del fondo del
          depósito (cota 1). Cuando la lámina llega a la cota 2 el sifón sigue
          sacando 49,2 l/s, más de lo que entra: entra aire por la boca y se
          desceba. Después, el depósito vuelve a llenarse a 30 l/s hasta la
          cota 3, el sifón se ceba y el ciclo se repite.

      - tipo: calcular
        titulo: El tiempo hasta la cota mínima
        pregunta: |
          Tiempo que tarda la lámina en bajar de la cota 3 a la cota 2, con la
          entrada de 30 l/s funcionando.
        respuesta:
          tipo: magnitud
          valor: '817 s'
          tolerancia: 0.01
          formato: un tiempo con su unidad (s)
        distractores:
          - valor: '366 s'
            mensaje: |
              Has vaciado sin la entrada. Los 30 l/s que siguen entrando frenan
              el descenso más del doble: hay que integrar con el caudal neto.
          - valor: '662 s'
            mensaje: |
              Has supuesto el caudal neto constante en su valor inicial, 30,2
              l/s. El saliente baja con $\sqrt{z}$ y el descenso se va
              frenando.
          - valor: '2674 s'
            mensaje: |
              Has bajado hasta la cota 1, el fondo. La cota mínima es la boca
              del sifón, 2,0: ahí entra aire y deja de salir agua.
        pista: |
          $A\,dz = (Q_e - a\sqrt{2gz})\,dt$. Con $u = \sqrt{z}$ la integral es
          racional: $\int \frac{u\,du}{Q_e - k u}$.
        desarrollo: |
          Con $k = a\sqrt{2g} = 0{,}0348$:

          $$
          t = \int_{3}^{2}\frac{A\,dz}{Q_e - k\sqrt{z}} = \frac{2A}{k^{2}}\Big[(k\sqrt{z} - Q_e) + Q_e\ln(k\sqrt{z} - Q_e)\Big]_{2}^{3} = 817\ \text{s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del sifón. Una pieza es falsa.
        piezas:
          - texto: 'Balance en dt: A dz = (Q entrante − Q saliente) dt, con Q saliente = a√(2gz) y z medida desde la salida del sifón.'
          - texto: 'El régimen permanente exigiría z = 0,744 m, y la boca está en 2,0: el sifón se desceba antes de llegar.'
          - texto: 'Desde la cota 2 el depósito se llena a 30 l/s hasta la 3, el sifón se ceba y el ciclo se repite: es un sifón intermitente.'
          - texto: La altura que cuenta en Torricelli es la del agua sobre la boca del sifón, 1 m al principio, porque por ahí es por donde entra.
            trampa: true
            mensaje: |
              El desnivel que acelera el agua va de la lámina libre al punto
              donde sale a la atmósfera, que es la descarga en la cota 0. La
              boca está sumergida y a presión mayor que la atmosférica; su cota
              solo importa para saber cuándo entra aire.
    resolucion: |
      **Se vacía o se desborda** (a). Con la lámina en la cota 3 el sifón
      descarga en la 0, así que la velocidad de salida es
      $\sqrt{2g \cdot 3} = 7{,}67$ m/s y el caudal $60{,}2$ l/s. Entran 30:
      el nivel baja.

      **La ley del nivel** (b). En un $dt$ el depósito pierde
      $(Q_s - Q_e)\,dt$ de volumen, y $Q_s$ depende del nivel:

      $$
      A\,\frac{dz}{dt} = Q_e - a\sqrt{2gz} = 0{,}03 - 0{,}0348\sqrt{z}
      $$

      Separando variables y con $u = \sqrt{z}$:

      $$
      t = \frac{2A}{k^{2}}\Big[(k\sqrt{z} - Q_e) + Q_e\ln(k\sqrt{z} - Q_e)\Big]_{z}^{3}, \qquad k = 0{,}0348
      $$

      que da $t(z)$; el boletín la escribe con el factor $2A/k^{2} = 33\,030$.

      **Régimen permanente** (c). Los caudales se igualarían en
      $z = (0{,}03/0{,}0348)^{2} = 0{,}744$ m, por debajo de la boca del sifón
      (cota 2) e incluso del fondo (cota 1). No se alcanza: al llegar la
      lámina a la cota 2 el sifón todavía saca 49,2 l/s, entra aire por la
      boca y se desceba. Desde ahí el depósito se llena a 30 l/s —un metro,
      20 m³, en 667 s—, el sifón se ceba de nuevo por vasos comunicantes y
      vuelve a empezar. Es un sifón intermitente.

      **El tiempo** (d). De la cota 3 a la 2:

      $$
      t = 33\,030\,\Big[(0{,}0348\sqrt{z} - 0{,}03) + 0{,}03\ln(0{,}0348\sqrt{z} - 0{,}03)\Big]_{2}^{3} = 817\ \text{s}
      $$

      El boletín publica 817,5 s. Sin la entrada serían 366 s; con el caudal
      neto inicial constante, 662. La entrada de 30 l/s más que duplica el
      tiempo de vaciado.
  - id: ejflu13-col36-los-tres-coeficientes-del-orificio
    titulo: Los tres coeficientes del orificio, y cuál sale de cuál
    fuente: Ejercicio 3.6 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      A partir de un depósito presurizado circula un aceite de densidad relativa
      0,85, a través de un orificio de 8 cm de diámetro, a razón de 24 l/s. El
      diámetro del chorro a la salida es de 5,85 cm, el nivel del aceite es de
      7,5 m por encima del orificio y la presión del aire en la parte superior
      del depósito es de −200 Torr. Se pide:

      a) Coeficientes de velocidad, contracción y gasto del orificio.
    pide: Los coeficientes de contracción, de velocidad y de gasto.
    pasos:
      - tipo: reconocer
        pregunta: |
          La presión del aire sobre el aceite es de −200 Torr. ¿Qué altura de
          líquido es eso, y con qué signo entra en la carga que mueve el chorro?
        opciones:
          - texto: −0,2 · 13,6/0,85 = −3,2 m de aceite. El vacío resta, y la carga útil es 7,5 − 3,2 = 4,3 m
            correcta: true
            mensaje: |
              Eso es. Los Torr se pasan a la columna del líquido en que se
              escribe el Bernoulli, que es el aceite; y una depresión sobre la
              superficie frena la salida, así que resta.
          - texto: −0,2 · 13,6 = −2,72 m, pasando los Torr a metros de columna de agua
            mensaje: |
              Son metros de **agua**, y el Bernoulli va en metros de aceite:
              faltaría dividir entre 0,85. Con 2,72 la velocidad teórica sale
              9,68 m/s en vez de 9,18.
          - texto: No entra. El orificio está en el líquido y solo cuenta el nivel, 7,5 m
            mensaje: |
              La presión del aire empuja —o aquí, tira de— la superficie libre,
              y eso se transmite al orificio. Con la superficie a presión
              atmosférica sí bastaría el nivel; con −200 Torr, no.

      - tipo: calcular
        titulo: La contracción
        pregunta: |
          Coeficiente de contracción $C_c$ del orificio.
        respuesta:
          tipo: numero
          valor: '0.535'
          tolerancia: 0.003
          formato: un número, sin unidad
        distractores:
          - valor: '0.731'
            mensaje: |
              Es el cociente de diámetros. La contracción se define con
              **áreas**: $(5{,}85/8)^{2} = 0{,}535$.
          - valor: '1.87'
            mensaje: |
              Lo has invertido. El chorro es más estrecho que el orificio, así
              que $C_c = A_{chorro}/A_0$ es menor que uno.
        pista: |
          $C_c = A_{chorro}/A_0 = (d/D)^{2}$.
        desarrollo: |
          $$
          C_c = \left(\frac{5{,}85}{8}\right)^{2} = 0{,}535
          $$

      - tipo: calcular
        titulo: La velocidad teórica
        pregunta: |
          Velocidad teórica del chorro, por Bernoulli entre la superficie y el
          orificio, sin pérdidas.
        respuesta:
          tipo: magnitud
          valor: '9.18 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '12.12 m/s'
            mensaje: |
              Has ignorado la depresión del aire. Los −200 Torr son −3,2 m de
              aceite sobre la superficie: la carga es 4,3 m, no 7,5.
          - valor: '14.5 m/s'
            mensaje: |
              Has sumado la presión del aire en vez de restarla. Es negativa:
              es un vacío que frena el chorro, no un empuje.
          - valor: '9.68 m/s'
            mensaje: |
              Has convertido los Torr a metros de agua, 2,72 m, y el Bernoulli
              va en aceite: 2,72/0,85 = 3,2 m.
        pista: |
          $V_t = \sqrt{2g\,(H + p_1/\gamma)}$, con $p_1/\gamma$ negativo.
        desarrollo: |
          $$
          \frac{p_1}{\gamma} = \frac{-0{,}2 \cdot 13\,600}{850} = -3{,}2\ \text{m} \qquad V_t = \sqrt{2 \cdot 9{,}8 \cdot (7{,}5 - 3{,}2)} = 9{,}18\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad real, y su coeficiente
        pregunta: |
          Coeficiente de velocidad $C_v$. La velocidad real sale del caudal y
          de la sección del **chorro**.
        respuesta:
          tipo: numero
          valor: '0.973'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '0.52'
            mensaje: |
              Has dividido el caudal entre la sección del orificio, 8 cm. La
              velocidad real es la del chorro, que ya está contraído a 5,85 cm:
              $0{,}024/0{,}00269 = 8{,}93$ m/s.
          - valor: '1.03'
            mensaje: |
              Lo has invertido. La velocidad real nunca supera la teórica:
              $C_v = V_r/V_t$ es menor que uno.
        pista: |
          $V_r = Q/A_{chorro}$ y $C_v = V_r/V_t$.
        desarrollo: |
          $$
          V_r = \frac{0{,}024}{\pi \cdot 0{,}0585^{2}/4} = 8{,}93\ \text{m/s} \qquad C_v = \frac{8{,}93}{9{,}18} = 0{,}97
          $$

      - tipo: calcular
        titulo: El coeficiente de gasto
        pregunta: |
          Coeficiente de gasto $C_d$ del orificio.
        respuesta:
          tipo: numero
          valor: '0.52'
          tolerancia: 0.006
          formato: un número, sin unidad
        distractores:
          - valor: '0.97'
            mensaje: |
              Has tomado $C_d = C_v$, sin la contracción. El caudal real es
              velocidad real **por sección real**, y las dos son menores que
              las teóricas.
          - valor: '0.535'
            mensaje: |
              Has tomado $C_d = C_c$, sin el coeficiente de velocidad. Falta el
              3 % de velocidad que el chorro pierde.
        pista: |
          $C_d = C_c \cdot C_v$, y también $C_d = Q_r/Q_t$ con
          $Q_t = V_t A_0$.
        desarrollo: |
          $$
          C_d = C_c \cdot C_v = 0{,}535 \cdot 0{,}973 = 0{,}52 \qquad \text{o bien}\qquad C_d = \frac{0{,}024}{9{,}18 \cdot \pi \cdot 0{,}08^{2}/4} = \frac{24}{46{,}1} = 0{,}52
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del orificio. Una pieza es falsa.
        piezas:
          - texto: 'El chorro se contrae: Cc = (5,85/8)² = 0,535, área real entre área del orificio.'
          - texto: 'La velocidad teórica sale del Bernoulli con la carga neta, 7,5 − 3,2 = 4,3 m de aceite: 9,18 m/s.'
          - texto: 'Cd = Cc · Cv = 0,52, y coincide con el cociente de caudales: 24 l/s reales frente a 46,1 teóricos.'
          - texto: Como el aire del depósito está en depresión, el chorro sale más rápido que a presión atmosférica, porque el vacío tira del líquido hacia fuera.
            trampa: true
            mensaje: |
              Al revés: el vacío sobre la superficie **retiene** el líquido. La
              carga baja de 7,5 a 4,3 m y la velocidad teórica de 12,1 a 9,2
              m/s. Un depósito presurizado por encima de la atmosférica sí
              aceleraría el chorro; uno en depresión lo frena.
    resolucion: |
      **Tres coeficientes y tres definiciones.** La contracción compara
      secciones, la velocidad compara velocidades y el gasto compara caudales;
      y como el caudal es sección por velocidad, el tercero es el producto de
      los otros dos.

      **La carga que mueve el chorro.** Los −200 Torr sobre la superficie son
      $-0{,}2 \cdot 13\,600/850 = -3{,}2$ m de aceite. Bernoulli entre la
      superficie y el orificio, sin pérdidas:

      $$
      V_t = \sqrt{2g\,(7{,}5 - 3{,}2)} = 9{,}18\ \text{m/s}
      $$

      **Los tres números.**

      $$
      C_c = \left(\frac{5{,}85}{8}\right)^{2} = 0{,}535 \qquad C_v = \frac{Q/A_{chorro}}{V_t} = \frac{8{,}93}{9{,}18} = 0{,}97 \qquad C_d = C_c C_v = 0{,}52
      $$

      El boletín publica 0,534, 0,97 y 0,517; el último sale de multiplicar
      los dos primeros ya redondeados, y el cociente directo de caudales,
      $24/46{,}1$, da 0,520.

      **El error que más cae.** Dividir el caudal entre la sección del
      orificio para sacar la velocidad real: da 4,78 m/s y un $C_v$ de 0,52,
      que es en realidad el $C_d$. El chorro que sale ya mide 5,85 cm, no 8, y
      la velocidad real se mide en él.
  - id: ejflu13-col37-el-pitot-en-aire-y-el-manometro-que-lo-multiplica
    titulo: El Pitot en aire, y el manómetro que multiplica la lectura
    fuente: Ejercicio 3.7 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El fluido que circula a través del tubo de la figura es aire
      ($\gamma_{aire} = 12$ N/m³) y el flujo del manómetro es aceite rojo Meriam
      ($S_{aceite} = 0{,}827$). Suponiendo que no hay pérdidas, calcular el
      flujo volumétrico $Q$ en m³/s.

      Datos: $D_1 = 10$ cm; $D_2 = 6$ cm; $R = 8$ cm; $h_{f12} = 0$.

      <figure class="figura-examen">
      <svg viewBox="0 20 400 252" role="img" width="430" height="271"
           aria-labelledby="f37t f37d">
        <title id="f37t">El conducto que se estrecha, con el Pitot en la sección ancha y la toma de pared en la garganta, unidos por un manómetro de aceite</title>
        <desc id="f37d">Un conducto horizontal de 10 cm de diámetro que se
        estrecha a 6 cm. En la sección ancha, la 1, hay un tubo de Pitot cuya
        boca está enfrentada al flujo; en la garganta, la sección 2, hay una
        toma en la pared. Los dos bajan a un manómetro en U con aceite rojo. El
        aceite está más bajo en la rama del Pitot, porque ahí la presión es
        mayor, y los dos meniscos se separan una altura R de 8 cm.</desc>
        <defs>
          <marker id="m37l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M40,60 H200 L250,90 H392" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M40,160 H200 L250,130 H392" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="150" y1="70" x2="196" y2="70" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m37l)"/>
        <text x="146" y="64" text-anchor="end" font-size="10" fill="var(--live)">aire</text>
        <text x="46" y="80" font-size="10" fill="var(--faint)">1 · Ø 10 cm</text>
        <text x="330" y="82" font-size="10" fill="var(--faint)">2 · Ø 6 cm</text>
        <path d="M96,110 H114 A6,6 0 0 1 120,116 V218" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="126" y="104" font-size="9.5" fill="var(--ink)">Pitot, boca contra el flujo</text>
        <line x1="300" y1="130" x2="300" y2="186" stroke="var(--ink)" stroke-width="2"/>
        <text x="306" y="150" font-size="9.5" fill="var(--ink)">toma en la pared</text>
        <path d="M120,218 V254 H300 V186" fill="none" stroke="var(--flag)" stroke-width="4"/>
        <line x1="128" y1="218" x2="230" y2="218" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="230" y1="186" x2="292" y2="186" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="224" y1="186" x2="224" y2="218" stroke="var(--faint)" stroke-width="1"/>
        <path d="M220,186 h8 M220,218 h8" stroke="var(--faint)" stroke-width="1"/>
        <text x="232" y="206" font-size="10" fill="var(--faint)">R = 8 cm</text>
        <text x="150" y="268" font-size="9.5" fill="var(--flag)">aceite rojo, S = 0,827</text>
      </svg>
      <figcaption>El Pitot, en la sección ancha, mide la presión total; la toma de la garganta mide la estática de allí. El aceite baja en la rama del Pitot porque esa presión es mayor, y esos 8 cm son toda la altura de velocidad de la garganta.</figcaption>
      </figure>
    pide: El flujo volumétrico Q.
    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro une la boca del Pitot, que está en la sección ancha, con
          una toma en la pared de la garganta. ¿Qué diferencia mide, y por qué
          da la velocidad de la garganta sin más cuentas?
        opciones:
          - texto: La presión total de 1 menos la estática de 2, que por Bernoulli es exactamente la altura de velocidad de la garganta
            correcta: true
            mensaje: |
              Eso es, y es toda la gracia del montaje. En la boca del Pitot el
              aire se para, así que ahí está la carga total de 1; y la carga
              total se conserva hasta 2 porque no hay pérdidas. Restarle la
              estática de 2 deja $V_2^{2}/2g$ pelada, sin ninguna corrección de
              secciones.
          - texto: La diferencia de presiones estáticas entre 1 y 2, como en un venturi
            mensaje: |
              Si las dos tomas fueran de pared, sí, y entonces habría que
              corregir con $1/\sqrt{1-(D_2/D_1)^{4}}$ porque en la sección 1 el
              aire ya lleva velocidad. La toma de 1 no es de pared: está
              enfrentada al flujo y mide la total, que es lo que evita esa
              corrección.
          - texto: La pérdida de carga entre las dos secciones, que aquí el enunciado dice que es nula
            mensaje: |
              Si midiera eso, con $h_{f12} = 0$ el manómetro marcaría cero y no
              marca 8 cm. Lo que separa a las dos tomas no es la pérdida: es
              que una lee la presión total y la otra solo la estática.

      - tipo: calcular
        titulo: La lectura, en columna de aire
        pregunta: |
          Los 8 cm de aceite del manómetro, ¿a cuántos metros de columna de
          **aire** equivalen? El aire pesa 12 N/m³ y el aceite 0,827 · 9800.
        respuesta:
          tipo: magnitud
          valor: '53.95 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '5.43 m'
            mensaje: |
              Has usado la densidad del aceite, 827 kg/m³, donde va su peso
              específico, 8 104,6 N/m³. Son magnitudes distintas y se llevan un
              factor $g$: la columna sale 9,8 veces más corta.
          - valor: '0.066 m'
            mensaje: |
              Has multiplicado por la densidad relativa en vez de dividir entre
              la del aire. La conversión va al revés: la misma presión, medida
              en un fluido 675 veces más ligero, da una columna 675 veces más
              alta.
        pista: |
          $\Delta h_{aire} = R\left(\dfrac{\gamma_{aceite}}{\gamma_{aire}} - 1\right)$,
          con $\gamma_{aceite} = 0{,}827 \cdot 9\,800 = 8\,104{,}6$ N/m³.
        desarrollo: |
          $$
          \Delta h = 0{,}08\left(\frac{0{,}827 \cdot 9\,800}{12} - 1\right) = 0{,}08 \cdot 674{,}4 = 53{,}95\ \text{m de columna de aire}
          $$

      - tipo: calcular
        titulo: La velocidad en la garganta
        pregunta: |
          Velocidad del aire en la sección 2, la de 6 cm.
        respuesta:
          tipo: magnitud
          valor: '32.52 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '1.25 m/s'
            mensaje: |
              Has tomado los 8 cm como altura de velocidad, sin pasarlos a
              columna de aire. La gracia del manómetro es justamente esa: 8 cm
              de aceite son 54 m de aire.
          - valor: '46 m/s'
            mensaje: |
              Has multiplicado por dos dentro de la raíz de más:
              $V = \sqrt{2g\Delta h}$, con $2g = 19{,}6$, no $4g$.
        pista: |
          Toda la altura medida es altura de velocidad:
          $V = \sqrt{2g\,\Delta h}$.
        desarrollo: |
          $$
          V_2 = \sqrt{2 \cdot 9{,}8 \cdot 53{,}95} = 32{,}52\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Flujo volumétrico $Q$ que circula por el conducto.
        respuesta:
          tipo: magnitud
          valor: '0.0919 m3/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (m³/s)
        distractores:
          - valor: '0.2554 m3/s'
            mensaje: |
              Has multiplicado la velocidad de la garganta por la sección
              ancha, la de 10 cm. La velocidad que has calculado es la de la
              sección 2, y va con el área de la sección 2.
          - valor: '0.0986 m3/s'
            mensaje: |
              Has aplicado la corrección de venturi $1/\sqrt{1-(D_2/D_1)^{4}}$.
              Aquí no toca, y esa es la diferencia con un venturi: como la toma
              de 1 mide la presión **total**, la lectura ya es la altura de
              velocidad de 2 entera.
        pista: |
          $Q = V_2 A_2$ con $A_2 = \pi \cdot 0{,}06^{2}/4$.
        desarrollo: |
          $$
          Q = 32{,}52 \cdot \frac{\pi \cdot 0{,}06^{2}}{4} = 0{,}0919\ \text{m}^{3}\text{/s} = 91{,}9\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del Pitot. Una pieza es falsa.
        piezas:
          - texto: 'El Pitot de la sección ancha mide la carga total, y como no hay pérdidas esa carga total es también la de la garganta.'
          - texto: 'Restarle la estática de la garganta deja su altura de velocidad; los 8 cm de aceite son 53,95 m de columna de aire.'
          - texto: 'De ahí V2 = √(2g · 53,95) = 32,52 m/s, y Q = V2·A2 con el área de la garganta, 6 cm.'
          - texto: 'Como el aire es muy ligero, 8 cm de aceite son una presión pequeñísima y el caudal sale pequeño: por eso el aparato es poco sensible con gases.'
            trampa: true
            mensaje: |
              Al revés, y es la idea del problema. Que el aire sea ligero hace
              el manómetro **más** sensible: la misma presión que en agua
              movería 6,6 cm, en aire son 54 m de columna. 8 cm de aceite
              corresponden a 32,5 m/s, una velocidad grande.
    resolucion: |
      **Qué mide cada toma.** La de la sección ancha está enfrentada al flujo:
      ahí el aire se para y lo que hay es la carga **total** de 1. La de la
      garganta es una toma de pared y lee solo la **estática** de 2. Y como no
      hay pérdidas, la carga total de 1 es también la de 2:

      $$
      \frac{p_3}{\gamma} = \frac{p_1}{\gamma} + \frac{V_1^{2}}{2g} = \frac{p_2}{\gamma} + \frac{V_2^{2}}{2g} \;\Longrightarrow\; \frac{p_3 - p_2}{\gamma} = \frac{V_2^{2}}{2g}
      $$

      La lectura del manómetro es, sin ninguna corrección, la altura de
      velocidad de la garganta.

      **La lectura, en el fluido que circula.** El manómetro está lleno de
      aceite y el conducto de aire, así que hay que convertir:

      $$
      \Delta h = R\left(\frac{\gamma_{ac}}{\gamma_{aire}} - 1\right) = 0{,}08\left(\frac{8\,104{,}6}{12} - 1\right) = 53{,}95\ \text{m de aire}
      $$

      **La velocidad y el caudal.**

      $$
      V_2 = \sqrt{2g \cdot 53{,}95} = 32{,}52\ \text{m/s} \qquad Q = 32{,}52 \cdot \frac{\pi \cdot 0{,}06^{2}}{4} = 0{,}0919\ \text{m}^{3}\text{/s}
      $$

      que es lo que publica el boletín, $91{,}94 \cdot 10^{-3}$ m³/s.

      **Por qué esto se hace así con gases.** El factor
      $\gamma_{ac}/\gamma_{aire} = 675$ es lo que hace el aparato utilizable:
      una presión que en un manómetro de agua movería 6,6 cm de columna, aquí
      se lee como 8 cm de aceite sobre una escala cómoda. El precio es que un
      error de 1 mm en la lectura son 0,67 m de aire, y hay que leer con
      cuidado.

      **Y el dato que no se usa.** El diámetro $D_1 = 10$ cm no interviene en
      ninguna cuenta, y eso es lo que hay que ver: si las dos tomas fueran de
      pared —un venturi— haría falta corregir con
      $1/\sqrt{1-(D_2/D_1)^{4}}$, aquí un 1,7 %. Poner la toma de 1 contra el
      flujo es lo que quita esa corrección de en medio.
  - id: ejflu13-col38-el-venturi-con-aire-y-la-lectura-que-no-puede-anularse
    titulo: El venturi con aire, y la lectura que nunca se anula
    fuente: Ejercicio 3.8 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Para el venturi de la figura, se pide:

      a) Deducir la expresión del caudal $Q = f(C_v, D_1, D_2, R)$. Líquido
      manométrico: aire.

      b) Caudal circulante para que la presión estática sea la misma en las dos
      secciones (1 y 2).

      c) Razonar la respuesta anterior.

      <figure class="figura-examen">
