      <figcaption>Todo a la misma escala, cotas y lecturas incluidas. Los tres aparatos miden en tres fluidos distintos: mercurio, aire y un líquido desconocido; y de los tres, solo el primero da un dato nuevo.</figcaption>
      </figure>
    pide: El caudal, la lectura R del manómetro de aire y el peso específico relativo del tercer líquido.
    pasos:
      - tipo: reconocer
        pregunta: |
          Tres manómetros y tres preguntas. ¿Cuál de los tres es el único que
          aporta un dato del que se pueda partir?
        opciones:
          - texto: El de mercurio, porque su otra rama está abierta a la atmósfera y da una presión absoluta de referencia
            correcta: true
            mensaje: |
              Eso es. Los otros dos son **diferenciales**: unen dos puntos de la
              propia instalación, así que su lectura depende del caudal en vez
              de darlo. El de mercurio tiene una rama abierta, y por eso su
              medida se puede anclar a la atmósfera.
          - texto: El invertido de aire, porque el aire no pesa y su lectura es directa
            mensaje: |
              Que la lectura sea directa no la hace un dato: R es justamente
              una de las incógnitas. Ese manómetro une un Pitot y una toma de
              pared de la misma tubería, así que mide la altura de velocidad,
              que todavía no se conoce.
          - texto: El del líquido s3, porque tiene dos cotas acotadas, 0,2 y 0,6 m
            mensaje: |
              Tiene dos cotas pero también una incógnita, $s_3$: su ecuación
              relaciona dos cosas que no se saben. Sirve al final, cuando la
              velocidad ya está calculada.

      - tipo: calcular
        titulo: La carga total en la tubería
        pregunta: |
          Carga total (altura de Bernoulli respecto del eje de la tubería
          horizontal) que mide el Pitot de la izquierda, en mca. El menisco de
          su rama está 0,5 m por debajo del eje y la otra rama está abierta.
        respuesta:
          tipo: magnitud
          valor: '6.3 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '6.8 m'
            mensaje: |
              Te ha faltado descontar el medio metro de agua que hay entre el
              eje y el menisco. El recorrido baja 0,5 m en agua y sube 0,5 m en
              mercurio: $13{,}6 \cdot 0{,}5 - 0{,}5 = 6{,}3$.
          - valor: '5.8 m'
            mensaje: |
              Has restado dos veces el medio metro, o has usado 12,6 en lugar
              de 13,6. El coeficiente 12,6 aparece cuando las dos ramas llevan
              agua encima del mercurio; aquí una está abierta.
          - valor: '0.5 m'
            mensaje: |
              Esa es la lectura, no la carga. Medio metro de mercurio son 6,8
              metros de agua: el mercurio pesa 13,6 veces más.
        pista: |
          Recorre el manómetro desde el Pitot: baja 0,5 m en agua, sube 0,5 m
          en mercurio y sale a la atmósfera.
        desarrollo: |
          $$
          \frac{p_t}{\gamma} + 0{,}5 - 13{,}6 \cdot 0{,}5 = 0 \;\Longrightarrow\; \frac{p_t}{\gamma} = 6{,}3\ \text{mca}
          $$

          Y esa es la carga total del tramo horizontal, porque un Pitot mide
          presión más altura de velocidad.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Caudal circulante. La boquilla, de 50 mm, descarga a la atmósfera 5 m
          por debajo del eje de la tubería, y no hay pérdidas.
        respuesta:
          tipo: magnitud
          valor: '29.2 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '22.2 l/s'
            mensaje: |
              Te has dejado los 5 m de caída. La boquilla está más abajo, así
              que a la carga de la tubería hay que sumarle el desnivel: 11,3 m
              en total, no 6,3.
          - valor: '116.8 l/s'
            mensaje: |
              Has usado el diámetro de la tubería, 100 mm, con la velocidad de
              la boquilla. La velocidad que sale del Bernoulli es la de la
              salida, y va con los 50 mm.
          - valor: '87.3 l/s'
            mensaje: |
              Has interpretado los 0,5 m como la lectura de un Pitot con
              piezómetro, $V^{2}/2g = 0{,}5 \cdot 12{,}6$. Ese montaje tiene las
              dos ramas conectadas a la tubería; aquí una está abierta al aire,
              y lo que mide es la carga total, no la de velocidad.
        pista: |
          Bernoulli del eje de la tubería a la salida de la boquilla:
          $6{,}3 + 5 = V_b^{2}/2g$.
        desarrollo: |
          $$
          V_b = \sqrt{2g \cdot 11{,}3} = 14{,}87\ \text{m/s} \qquad Q = 14{,}87 \cdot \frac{\pi \cdot 0{,}05^{2}}{4} = 0{,}0292\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: La lectura del manómetro de aire
        pregunta: |
          Diferencia de niveles $R$ en el manómetro invertido, en centímetros.
        respuesta:
          tipo: magnitud
          valor: '70.5 cm'
          tolerancia: 0.01
          formato: una longitud con su unidad (cm o m)
        distractores:
          - valor: '1128 cm'
            mensaje: |
              Esa es la altura de velocidad de la **boquilla**. El manómetro
              está en la tubería de 100 mm, donde el agua va cuatro veces más
              despacio y la altura de velocidad es dieciséis veces menor.
          - valor: '5.6 cm'
            mensaje: |
              Has dividido por 12,6, como si el manómetro llevara mercurio. Su
              fluido es aire: no pesa, y la lectura es la propia diferencia de
              alturas piezométricas.
        pista: |
          Une un Pitot y una toma de pared de la misma sección: su diferencia
          es $V^{2}/2g$, y como el fluido manométrico es aire, la lectura la da
          entera.
        desarrollo: |
          $$
          V = \frac{0{,}0292}{\pi \cdot 0{,}1^{2}/4} = 3{,}72\ \text{m/s} \qquad R = \frac{V^{2}}{2g} = \frac{3{,}72^{2}}{19{,}6} = 0{,}705\ \text{m} = 70{,}5\ \text{cm}
          $$

      - tipo: calcular
        titulo: El líquido desconocido
        pregunta: |
          Peso específico relativo $s_3$ del líquido del tercer manómetro, que
          une un Pitot y una toma de pared del tramo descendente y cuya lectura
          es 0,6 m.
        respuesta:
          tipo: numero
          valor: '2.176'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '1.176'
            mensaje: |
              Te falta el $+1$: la ecuación del manómetro diferencial da
              $s_3 - 1$, no $s_3$. Un líquido con $s = 1{,}176$ existiría, pero
              no es el que cumple esta lectura.
          - valor: '19.8'
            mensaje: |
              Has usado la velocidad de la boquilla. El aparato está en el tramo
              descendente, que sigue siendo de 100 mm.
          - valor: '2.51'
            mensaje: |
              Has metido los 0,2 m en la cuenta. No entran: al comparar
              **alturas piezométricas** la diferencia de cotas entre las dos
              tomas se cancela sola, y lo que queda es la altura de velocidad.
        pista: |
          $\dfrac{V^{2}}{2g} = R_3\,(s_3 - 1)$, con $R_3 = 0{,}6$ m y la misma
          velocidad de antes.
        desarrollo: |
          $$
          s_3 = 1 + \frac{V^{2}/2g}{0{,}6} = 1 + \frac{0{,}705}{0{,}6} = 2{,}176
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de los tres aparatos. Una pieza es falsa.
        piezas:
          - texto: 'El manómetro de mercurio, con una rama abierta, da la carga total del tramo horizontal: 6,3 mca.'
          - texto: 'Con esa carga y los 5 m de caída, la boquilla descarga con 11,3 m de energía y salen 29,2 l/s.'
          - texto: 'Los otros dos son diferenciales entre un Pitot y una toma de pared, así que los dos miden la misma cosa: la altura de velocidad de la tubería de 100 mm.'
          - texto: 'Como el tramo descendente está 5 m más abajo, la presión allí es mayor y por eso la lectura del tercer manómetro, 0,6 m, es menor que los 0,705 m del segundo.'
            trampa: true
            mensaje: |
              La presión sí es mayor abajo, pero eso no cambia la lectura de un
              manómetro **diferencial**: la cota se cancela al comparar alturas
              piezométricas. Los dos aparatos miden los mismos 0,705 m de
              altura de velocidad, y sus lecturas difieren solo porque uno
              lleva aire —lectura 1 a 1— y el otro un líquido con $s = 2{,}176$,
              que la reduce en el factor $s_3 - 1 = 1{,}176$.
    resolucion: |
      **Por dónde se entra.** Tres manómetros, y solo uno tiene una rama
      abierta a la atmósfera: el de mercurio. Los otros dos unen dos puntos de
      la propia instalación, así que su lectura **depende** del caudal en vez de
      darlo. Ese es el orden del problema.

      **La carga total** (paso previo al apartado a). Recorriendo el manómetro
      desde la boca del Pitot: se baja 0,5 m en agua y se sube 0,5 m en
      mercurio hasta la atmósfera.

      $$
      \frac{p_t}{\gamma} = 13{,}6 \cdot 0{,}5 - 0{,}5 = 6{,}3\ \text{mca}
      $$

      **El caudal** (a). De ahí a la boquilla, 5 m más abajo y a la atmósfera:

      $$
      6{,}3 + 5 = \frac{V_b^{2}}{2g} \;\Longrightarrow\; V_b = 14{,}87\ \text{m/s} \qquad Q = 29{,}2\ \text{l/s}
      $$

      **Las dos lecturas** (b y c). Los dos manómetros que faltan miden **lo
      mismo**: la altura de velocidad de la tubería de 100 mm,
      $V^{2}/2g = 3{,}72^{2}/19{,}6 = 0{,}705$ m. Lo que cambia es el fluido en
      que la escriben:

      $$
      R = 0{,}705\ \text{m} = 70{,}5\ \text{cm} \qquad s_3 = 1 + \frac{0{,}705}{0{,}6} = 2{,}176
      $$

      **Lo que se aprende comparando los tres.** Un manómetro diferencial entre
      un Pitot y una toma de pared mide siempre $V^{2}/2g$, **sea cual sea la
      cota de las tomas**: al comparar alturas piezométricas la diferencia de
      alturas se cancela. Por eso el aparato del tramo descendente, 5 m más
      abajo, no lee nada distinto del de arriba. Y el factor que convierte esa
      altura en lectura es siempre $s_{man}/s_{fluido} - 1$: vale 12,6 con
      mercurio, 1,176 con este líquido y 1 con aire. Ahí está toda la elección
      de un fluido manométrico: cuanto más se parezca al que circula, más larga
      es la lectura y más fino el aparato.
  - id: ejflu13-col334-calibrar-un-vertedero-en-v-con-un-diafragma
    titulo: Calibrar un vertedero en V con un diafragma
    fuente: Ejercicio 3.34 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En un vertedero en V con ángulo $\alpha = 60$ º colocado en un canal, la
      medida de la altura de carga resultó ser de 16,5 cm. El caudal de agua
      bombeado al canal se midió por medio de un orificio o diafragma VDI, de
      55 mm de diámetro colocado en una tubería de 99 mm, resultando una
      diferencia de meniscos en el manómetro diferencial de mercurio aplicado a
      dicho orificio de 11,4 cm. Se pide:

      a) Calcular el coeficiente del vertedero (factor de corrección del caudal
      teórico).

      <figure class="figura-examen">
