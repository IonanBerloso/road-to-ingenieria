      <figcaption>La instalación de un tirón. Cada aparato mide una cosa distinta y en su propio fluido: el venturímetro un desnivel de aire, el manómetro 3 kilos, el conjunto de abajo 0,5 m de un líquido desconocido y el Pitot del chorro una columna de mercurio.</figcaption>
      </figure>
    pide: El caudal, la altura y potencia de la bomba, las tres lecturas de los manómetros y la altura del piezómetro de aspiración.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay seis apartados y solo un dato de presión medido: los 3 kg/cm² del
          manómetro de impulsión. ¿Entre qué dos puntos se plantea Bernoulli
          para sacar el caudal?
        opciones:
          - texto: Entre 2, donde está el manómetro, y 3, la salida del chorro, porque en 3 la presión es la atmosférica
            correcta: true
            mensaje: |
              Eso es. En 2 se conoce la presión y en 3 se conoce que vale cero
              relativa; las dos velocidades están ligadas por la continuidad,
              así que queda una sola incógnita. La bomba se queda fuera de ese
              tramo, que es justo lo que hace falta: todavía no se sabe cuánta
              energía da.
          - texto: Entre el depósito 0 y la salida 3, aprovechando que las dos presiones son atmosféricas
            mensaje: |
              Entre 0 y 3 está la bomba, y su altura es una incógnita. Ese
              Bernoulli tiene dos incógnitas —el caudal y $H_m$— y no se puede
              resolver todavía.
          - texto: Entre el depósito 0 y el punto 1, la entrada de la bomba
            mensaje: |
              Ese tramo sirve —y es el del apartado f)— pero no da el caudal:
              en 1 no se conoce ninguna presión. Es el último paso, no el
              primero.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          Caudal circulante. En 2 la tubería tiene 200 mm y el manómetro marca
          3 kg/cm²; el eje está en la cota 3 y el manómetro, 0,1 m por encima.
          La boquilla de salida tiene 80 mm y descarga en la cota 3.
        respuesta:
          tipo: magnitud
          valor: '123.7 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '122.1 l/s'
            mensaje: |
              Has aplicado Torricelli con la boquilla de 80 mm y la carga de
              30,1 m, olvidando restar la altura de velocidad que el agua ya
              lleva en la tubería de 200. Con secciones tan parecidas —una es
              6,25 veces la otra— ese término resta un 1,3 %.
          - valor: '386.6 l/s'
            mensaje: |
              Has usado la sección de la boquilla con la velocidad de la
              tubería, o al revés. La velocidad que sale del Bernoulli es la de
              la sección 2, y va con el área de la sección 2.
          - valor: '30.1 l/s'
            mensaje: |
              Te has quedado con la altura de presión, 30,1 m, en vez del
              caudal. Falta pasar de carga a velocidad y de velocidad a caudal.
        pista: |
          $p_2/\gamma = 3 \cdot 10 + 0{,}1 = 30{,}1$ mca. Bernoulli 2-3, con la
          misma cota: $p_2/\gamma + V_2^{2}/2g = V_3^{2}/2g$, y
          $V_3 = (200/80)^{2}V_2$.
        desarrollo: |
          $$
          30{,}1 + \frac{V_2^{2}}{2g} = \left(\frac{0{,}2}{0{,}08}\right)^{4}\frac{V_2^{2}}{2g} \;\Longrightarrow\; V_2 = 3{,}937\ \text{m/s}
          $$

          $$
          Q = 3{,}937 \cdot \frac{\pi \cdot 0{,}2^{2}}{4} = 0{,}12368\ \text{m}^{3}\text{/s} = 123{,}7\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La potencia útil de la bomba
        pregunta: |
          Potencia útil de la bomba. La lámina del depósito está en la cota 4 y
          está quieta.
        respuesta:
          tipo: magnitud
          valor: '36.23 kW'
          tolerancia: 0.01
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '35.27 kW'
            mensaje: |
              Te has dejado la altura de velocidad de la sección 2 en el
              Bernoulli de la bomba. Son 0,79 m sobre 29,89: poco, pero
              alrededor de un kilovatio.
          - valor: '41.08 kW'
            mensaje: |
              Has olvidado que el depósito ya aporta 4 m de cota. La bomba solo
              tiene que dar la diferencia, no la energía total del punto 2.
          - valor: '3.7 kW'
            mensaje: |
              Te falta el peso específico: $P = \gamma Q H_m$, con
              $\gamma = 9\,800$ N/m³.
        pista: |
          $B_0 + H_m = B_2$, es decir
          $4 + H_m = 3 + 30{,}1 + V_2^{2}/2g$. Después,
          $P = \gamma Q H_m$.
        desarrollo: |
          $$
          H_m = 3 + 30{,}1 + \frac{3{,}937^{2}}{19{,}6} - 4 = 29{,}89\ \text{mca}
          $$

          $$
          P = 9\,800 \cdot 0{,}12368 \cdot 29{,}89 = 36{,}23\ \text{kW}
          $$

      - tipo: calcular
        titulo: La lectura del venturímetro
        pregunta: |
          Diferencia $R$ entre los meniscos del manómetro diferencial del
          venturímetro, que es de aire. La tubería tiene 400 mm, la garganta
          200 y $C_v = 0{,}98$.
        respuesta:
          tipo: magnitud
          valor: '0.772 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '0.741 m'
            mensaje: |
              Te has dejado el $C_v = 0{,}98$. Como está al cuadrado en el
              despeje de $R$, olvidarlo cambia la lectura un 4 %.
          - valor: '0.823 m'
            mensaje: |
              Te has dejado el factor $1 - (D_2/D_1)^{4}$. Aquí la garganta es
              la mitad del tubo, así que vale 0,9375: un 6,7 % que no se puede
              despreciar.
        pista: |
          $Q = C_v A_2 \sqrt{\dfrac{2gR}{1-(D_2/D_1)^{4}}}$, y aquí se despeja
          $R$.
        desarrollo: |
          $$
          0{,}12368 = 0{,}98 \cdot \frac{\pi \cdot 0{,}2^{2}}{4}\sqrt{\frac{2gR}{1-(0{,}2/0{,}4)^{4}}} \;\Longrightarrow\; R = 0{,}772\ \text{m}
          $$

      - tipo: calcular
        titulo: El líquido desconocido
        pregunta: |
          Peso específico relativo $s$ del líquido manométrico del conjunto
          Pitot + piezómetro que cuelga de la tubería de 200 mm, cuya lectura
          es 0,5 m.
        respuesta:
          tipo: numero
          valor: '2.58'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1.58'
            mensaje: |
              Te falta el $+1$. La ecuación del manómetro es
              $V^{2}/2g = R\,(s/s_1 - 1)$: lo que despejas es $s/s_1 - 1$, y hay
              que devolverle la unidad.
          - valor: '62.8'
            mensaje: |
              Has usado la velocidad del chorro, 24,6 m/s. El conjunto está
              montado en la tubería de 200 mm, donde el agua va a 3,94 m/s.
        pista: |
          El conjunto mide la altura de velocidad de la tubería:
          $V_2^{2}/2g = R\,(s/s_1 - 1)$ con $s_1 = 1$ (agua) y $R = 0{,}5$ m.
        desarrollo: |
          $$
          s = \frac{V_2^{2}}{2gR} + 1 = \frac{3{,}937^{2}}{19{,}6 \cdot 0{,}5} + 1 = 2{,}58
          $$

      - tipo: justificar
        pregunta: Ordena la lectura de los cuatro aparatos. Una pieza es falsa.
        piezas:
          - texto: 'El caudal sale del tramo 2-3, que es el único donde se conoce una presión en cada extremo y no hay bomba en medio.'
          - texto: 'El venturímetro y el conjunto Pitot + piezómetro miden los dos una diferencia de presión, pero uno lleva aire (lectura 1 a 1) y el otro un líquido más pesado que el agua (lectura reducida).'
          - texto: 'El Pitot de la salida se lee contra el mercurio, y da $R'' = (V_3^{2}/2g - 0{,}5)/13{,}6 = 2{,}23$ m.'
          - texto: 'Como la boquilla es seis veces y media más estrecha que la tubería, la velocidad del chorro es seis veces y media mayor.'
            trampa: true
            mensaje: |
              La razón de **áreas** es 6,25, y esa es la razón de velocidades:
              $V_3 = 6{,}25 \cdot 3{,}937 = 24{,}6$ m/s. La razón de
              **diámetros** es 2,5. Confundirlas es el error más caro de este
              problema, porque la velocidad entra al cuadrado en todas las
              alturas.
    resolucion: |
      **El caudal** (a). El único tramo con las dos presiones conocidas y sin
      bomba en medio es el 2-3: en 2 el manómetro da
      $p_2/\gamma = 3 \cdot 10 + 0{,}1 = 30{,}1$ mca, y en 3 el chorro sale a la
      atmósfera. Las dos secciones están a la misma cota y la continuidad liga
      las velocidades:

      $$
      30{,}1 + \frac{V_2^{2}}{2g} = \left(\frac{0{,}2}{0{,}08}\right)^{4}\frac{V_2^{2}}{2g} \;\Longrightarrow\; V_2 = 3{,}937\ \text{m/s} \qquad Q = 123{,}68\ \text{l/s}
      $$

      **La bomba** (b). Ahora sí, con el caudal conocido:

      $$
      4 + H_m = 3 + 30{,}1 + \frac{3{,}937^{2}}{19{,}6} \;\Longrightarrow\; H_m = 29{,}89\ \text{mca} \qquad P = 36{,}23\ \text{kW}
      $$

      **Los tres aparatos que quedan.** Cada uno mide lo mismo —una diferencia
      de presiones— en un fluido distinto, y por eso cada lectura tiene su
      factor:

      | aparato | qué mide | lectura |
      |---|---|---|
      | venturímetro, aire | la diferencia de estáticas 1-garganta | $R = 0{,}772$ m |
      | Pitot + piezómetro, líquido desconocido | la altura de velocidad de la tubería | $s = 2{,}58$ |
      | Pitot del chorro, mercurio | la altura de velocidad del chorro | $R' = 2{,}23$ m |

      $$
      R = 0{,}772\ \text{m} \qquad s = \frac{3{,}937^{2}}{19{,}6 \cdot 0{,}5} + 1 = 2{,}58 \qquad R' = \frac{V_3^{2}/2g - 0{,}5}{13{,}6} = \frac{30{,}9 - 0{,}5}{13{,}6} = 2{,}23\ \text{m}
      $$

      con $V_3 = (0{,}2/0{,}08)^{2} \cdot 3{,}937 = 24{,}6$ m/s.

      **El piezómetro de aspiración** (f). Entre la lámina del depósito y la
      entrada de la bomba no hay pérdidas, y allí la tubería sigue siendo de
      400 mm, así que el agua va despacio:

      $$
      V_1 = \frac{0{,}12368}{\pi \cdot 0{,}4^{2}/4} = 0{,}984\ \text{m/s} \qquad 4 = 3 + (h + 0{,}2) + \frac{0{,}984^{2}}{2g} \;\Longrightarrow\; h = 0{,}75\ \text{m}
      $$

      **Lo que este problema enseña de una vez.** Que un aparato de medida no
      da presiones: da **desniveles de su propio fluido**, y hasta que no se
      dice en qué fluido está la lectura no significa nada. Los mismos
      0,5 metros son 0,79 mca si el líquido tiene $s = 2{,}58$, y los mismos
      2,23 metros son 30,4 mca por ser de mercurio.
  - id: ejflu13-col326-la-potencia-del-chorro-que-da-la-presion-del-aire
    titulo: La potencia del chorro, que delata la presión del aire
    fuente: Ejercicio 3.26 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      A través de un orificio de 7,5 cm de diámetro, cuyos coeficientes de
      velocidad y contracción valen 0,95 y 0,65 respectivamente, fluye aceite
      de 0,72 de densidad relativa. Se pide:

      a) Lectura del manómetro A, si la potencia del chorro es de 5,88 kW.

      b) Altura en el Pitot si éste fuese colocado a la salida del chorro.

      c) Tiempo que tardará en descender la lámina superior 1 m, si se mantiene
      constante la presión del aire y es equivalente a la calculada en a).

      Dato: sección trasversal del depósito = 2 m².

      <figure class="figura-examen">
      <svg viewBox="0 0 330 252" role="img" width="360" height="275"
           aria-labelledby="f326t f326d">
        <title id="f326t">El depósito de aceite presurizado, con el manómetro A arriba y el orificio C a 2,7 m de la lámina</title>
        <desc id="f326d">Un depósito cerrado con una cámara de aire en la parte
        alta, sobre la que se apoya el manómetro A. Debajo, el aceite: su
        lámina libre es el punto B y el orificio de salida, el punto C, está
        2,7 metros más abajo, en la pared derecha. Por él sale un chorro
        horizontal, dibujado ya contraído respecto del orificio.</desc>
        <defs>
          <marker id="m326l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m326n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="80" y="46" width="160" height="30" fill="var(--panel)"/>
        <rect x="80" y="76" width="160" height="140" fill="var(--alt)" opacity="0.18"/>
