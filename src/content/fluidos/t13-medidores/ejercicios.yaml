        <path d="M230,122 H290 V102 H310 V122 H380" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="244" y1="90" x2="278" y2="90" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m334l)"/>
        <text x="232" y="50" font-size="9.5" fill="var(--faint)">Ø 99 mm</text>
