ejercicios:
  # ── El primero es NUESTRO (§08). La colección de problemas abre con un
  #    cuerpo que «pesa 50 kg» en otro planeta, y ese enunciado solo se puede
  #    leer bien si antes se ha visto la diferencia entre masa y peso en un
  #    caso donde no haya nada más en juego.
  - id: ejflu1-masa-peso-y-el-kilogramo-de-dos-caras
    titulo: El mismo cuerpo, dos planetas y tres números
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un bidón de aceite tiene una masa de $200\ \text{kg}$.

      a) ¿Cuánto pesa en la Tierra, en newtons?

      b) ¿Cuánto pesa en la Luna ($g = 1{,}61\ \text{m/s}^{2}$)?

      c) ¿Cuál es su masa en la Luna?

      Tomar $g = 9{,}8\ \text{m/s}^{2}$ en la Tierra.
    pide: Los dos pesos y la masa, cada uno con su unidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿cuál de las tres respuestas se sabe sin
          hacer ninguna cuenta?
        opciones:
          - texto: >-
              La masa en la Luna: es la misma, $200\ \text{kg}$. La masa no
              depende de dónde esté el cuerpo
            correcta: true
            mensaje: |
              Eso es. La masa mide cuánta materia hay; el peso mide con qué
              fuerza tira de ella la gravedad del sitio. Cambiar de planeta
              cambia lo segundo y nunca lo primero.
          - texto: >-
              El peso en la Luna, que es la sexta parte del de la Tierra
            mensaje: |
              Es aproximadamente cierto ($9{,}8/1{,}61 \approx 6{,}1$), pero
              eso ya es una cuenta, y con los datos del enunciado se puede
              hacer exacta. Lo que se sabe sin calcular es la masa.
          - texto: >-
              Ninguna: las tres dependen de la gravedad
            mensaje: |
              La masa no. Es el único de los tres números que viaja contigo
              sin cambiar, y por eso los balances de materia se hacen con
              masas y no con pesos.

      - tipo: calcular
        titulo: El peso en la Tierra
        pregunta: |
          ¿Cuánto pesa el bidón en la Tierra?
        respuesta:
          tipo: magnitud
          valor: '1960 N'
          tolerancia: 0.01
          formato: un peso, con su unidad
        distractores:
          - valor: '200 N'
            mensaje: |
              Ese es el número de la masa con la unidad del peso pegada
              detrás. El peso es $W = m\,g = 200 \cdot 9{,}8$, y sale casi
              dos mil newtons.
          - valor: '20.41 N'
            mensaje: |
              Has dividido entre la gravedad en vez de multiplicar. Se
              divide cuando te dan el peso y buscas la masa; aquí es al
              revés.
        pista: |
          W = m·g, con g = 9,8 m/s². Y la unidad del peso es el newton.
        desarrollo: |
          $$
          W = m\,g = 200 \cdot 9{,}8 = 1960\ \text{N}
          $$

          En kilopondios serían $200\ \text{kp}$, que es exactamente el
          número de la masa. **Esa coincidencia es la que causa toda la
          confusión de este tema**, y solo ocurre en la Tierra.

      - tipo: calcular
        titulo: El peso en la Luna
        pregunta: |
          ¿Y en la Luna?
        respuesta:
          tipo: magnitud
          valor: '322 N'
          tolerancia: 0.01
          formato: un peso, con su unidad
        distractores:
          - valor: '200 N'
            mensaje: |
              El peso cambia con la gravedad: $W = 200 \cdot 1{,}61$. Lo que
              no cambia son los $200\ \text{kg}$ de masa.
          - valor: '124.22 N'
            mensaje: |
              Eso es $200/1{,}61$: has dividido. El peso es masa **por**
              gravedad.
        pista: |
          El mismo W = m·g, cambiando solo la gravedad.
        desarrollo: |
          $$
          W_{\text{Luna}} = 200 \cdot 1{,}61 = 322\ \text{N}
          $$

          Un sexto largo del peso terrestre, con la misma masa.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              La masa es un dato del cuerpo: $200\ \text{kg}$ en los dos
              sitios.
          - texto: >-
              El peso es una fuerza, $W = m\,g$, y se mide en newtons.
          - texto: >-
              En la Tierra: $200 \cdot 9{,}8 = 1960\ \text{N}$, que son
              $200\ \text{kp}$.
          - texto: >-
              En la Luna: $200 \cdot 1{,}61 = 322\ \text{N}$, que son
              $32{,}9\ \text{kp}$.
          - texto: >-
              Comprobación de sentido: menos gravedad, menos peso, misma
              masa.
          - texto: >-
              Como en la Luna pesa menos, allí también tiene menos masa: la
              masa es el peso dividido por la gravedad terrestre.
            trampa: true
            mensaje: |
              La masa **no** se define dividiendo por la gravedad terrestre:
              se define como la cantidad de materia, y es un invariante. Lo
              que la fórmula $m = W/g$ dice es que si conoces el peso en un
              sitio, tienes que dividir por la gravedad **de ese sitio** para
              recuperarla — y entonces sale $200\ \text{kg}$ tanto en la
              Tierra como en la Luna.

    resolucion: |
      **La masa no viaja.** $m = 200\ \text{kg}$ en los dos sitios: es la
      cantidad de materia del bidón, y ninguna gravedad la cambia.

      **El peso sí**, porque es la fuerza con la que tira la gravedad del
      lugar:

      $$
      W_{\text{Tierra}} = 200 \cdot 9{,}8 = \boxed{1960\ \text{N}}
      \qquad
      W_{\text{Luna}} = 200 \cdot 1{,}61 = \boxed{322\ \text{N}}
      $$

      **Y el detalle que hace tropezar a todo el mundo:** en la Tierra el peso
      en kilopondios vale $200\ \text{kp}$, el mismo número que la masa en
      kilogramos. Por eso los enunciados escriben «pesa 200 kg» sin sentirse
      culpables, y por eso en cuanto el problema se va a otro planeta hay que
      leer con lupa.

      > **La regla que se lleva a todos los temas siguientes.** En cuanto un
      > enunciado diga «pesa X kg», tradúcelo a newtons antes de hacer nada:
      > $X\ \text{kp} = 9{,}8X\ \text{N}$. Si el problema transcurre en la
      > Tierra no habrás perdido nada; si no, acabas de salvar el ejercicio.

  - id: ejflu1-col11-el-cuerpo-en-otro-planeta
    titulo: Un cuerpo que pesa cincuenta kilos donde la gravedad es otra
    fuente: >-
      Ejercicio 1.1 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Un cuerpo pesa $50\ \text{kg}$ en un planeta cuya gravedad es
      $3{,}5\ \text{m/s}^{2}$ siendo su densidad $2.500\ \text{kg/m}^{3}$. Se
      pide:

      a) Volumen y masa del cuerpo.

      b) Peso del cuerpo en la tierra.

      Nota: Realícese el problema en el sistema internacional (SI).
    pide: El volumen y la masa, y el peso en la Tierra.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «pesa 50 kg». ¿Qué significa exactamente?
        opciones:
          - texto: >-
              Que su peso son $50\ \text{kp} = 490\ \text{N}$: es el
              kilogramo-fuerza del Sistema Técnico
            correcta: true
            mensaje: |
              Eso es, y es la clave de todo el ejercicio. Con esos $490\ \text{N}$
              y la gravedad del planeta sale la masa: $490/3{,}5 = 140\ \text{kg}$,
              casi el triple del número del enunciado.
          - texto: >-
              Que su masa son $50\ \text{kg}$
            mensaje: |
              Eso es lo que dice el símbolo «kg» en el SI, pero el verbo del
              enunciado es **pesar**, y la nota final («realícese en el SI»)
              está avisando de que el dato no viene en el SI. Si tomas
              $m = 50\ \text{kg}$, el volumen te sale $0{,}02\ \text{m}^{3}$
              en lugar de $0{,}056$.
          - texto: >-
              Que pesaría $50\ \text{kg}$ si estuviera en la Tierra
            mensaje: |
              Eso sería reinterpretar el dato: el enunciado dice que pesa 50
              kg **en ese planeta**. Lo que hay que traducir es la unidad, no
              el lugar.

      - tipo: calcular
        titulo: La masa del cuerpo
        pregunta: |
          Con el peso en newtons y la gravedad del planeta, ¿cuál es la masa?
        respuesta:
          tipo: magnitud
          valor: '140 kg'
          tolerancia: 0.01
          formato: una masa, con su unidad
        distractores:
          - valor: '50 kg'
            mensaje: |
              Ese es el número del enunciado leído como si «kg» fuera masa.
              Son kilopondios: $50 \cdot 9{,}8 = 490\ \text{N}$, y
              $m = 490/3{,}5 = 140\ \text{kg}$.
          - valor: '17.86 kg'
            mensaje: |
              Has dividido los $50$ del enunciado entre $3{,}5$ sin pasarlos
              antes a newtons. Faltaba multiplicar por $9{,}8$.
        pista: |
          Primero el peso en newtons (50 kp × 9,8) y después m = W/g con la g del planeta.
        desarrollo: |
          $$
          W = 50\ \text{kp} = 50 \cdot 9{,}8 = 490\ \text{N}
          \qquad
          m = \frac{W}{g} = \frac{490}{3{,}5} = 140\ \text{kg}
          $$

          **Y la comprobación de sentido:** el planeta tira menos que la
          Tierra, así que para pesar lo mismo hace falta más materia. Si la
          masa te sale menor que 50 kg, has dividido donde tocaba
          multiplicar.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con esa masa y la densidad del enunciado, ¿qué volumen ocupa?
        respuesta:
          tipo: magnitud
          valor: '0.056 m^3'
          tolerancia: 0.01
          formato: un volumen, con su unidad
        distractores:
          - valor: '0.02 m^3'
            mensaje: |
              Es el volumen que sale con $m = 50\ \text{kg}$, es decir,
              arrastrando el error de leer el peso como masa. Con
              $140\ \text{kg}$: $140/2500 = 0{,}056\ \text{m}^{3}$.
          - valor: '350000 m^3'
            mensaje: |
              Has multiplicado por la densidad en vez de dividir. La densidad
              es masa **entre** volumen, así que el volumen es masa
              **entre** densidad.
        pista: |
          ρ = m/V, y aquí la incógnita es V. Con la masa en kg y ρ en kg/m³.
        desarrollo: |
          $$
          V = \frac{m}{\rho} = \frac{140}{2500} = 0{,}056\ \text{m}^{3}
          = 56\ \text{l}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Pesa 50 kg» son $50\ \text{kp}$, o sea $490\ \text{N}$.
          - texto: >-
              $m = W/g = 490/3{,}5 = 140\ \text{kg}$, y la masa no depende
              del planeta.
          - texto: >-
              $V = m/\rho = 140/2500 = 0{,}056\ \text{m}^{3}$.
          - texto: >-
              En la Tierra: $W = m\,g = 140 \cdot 9{,}8 = 1372\ \text{N}$.
          - texto: >-
              Comprobación: en la Tierra pesa $140\ \text{kp}$, más que los
              $50\ \text{kp}$ del planeta, porque allí la gravedad es menor.
          - texto: >-
              El volumen también cambia al llegar a la Tierra, porque el
              cuerpo pesa más y se comprime.
            trampa: true
            mensaje: |
              El volumen es una propiedad geométrica del cuerpo: no cambia
              porque cambie la gravedad. La compresibilidad existe —es el
              tema 2— pero responde a la **presión** aplicada, no al peso
              propio, y en un sólido de este tipo es despreciable.

    resolucion: |
      **a) Masa y volumen.** El dato «pesa 50 kg» está en el Sistema Técnico:

      $$
      W = 50\ \text{kp} = 490\ \text{N}
      \quad\Rightarrow\quad
      m = \frac{W}{g_{\text{planeta}}} = \frac{490}{3{,}5} = \boxed{140\ \text{kg}}
      $$

      $$
      V = \frac{m}{\rho} = \frac{140}{2500} = \boxed{0{,}056\ \text{m}^{3}}
      $$

      **b) Peso en la Tierra.** La masa es la misma; lo que cambia es $g$:

      $$
      W_{\text{Tierra}} = 140 \cdot 9{,}8 = \boxed{1372\ \text{N}}
      $$

      > **Por qué la colección abre con este problema.** No enseña ninguna
      > fórmula: enseña a leer. Los tres datos del enunciado están en tres
      > sistemas distintos —el peso en técnico, la gravedad y la densidad en
      > el SI— y la nota «realícese en el SI» es la única pista de que hay
      > algo que traducir. En el examen esa traducción no viene avisada.

  - id: ejflu1-col19-armstrong-en-la-luna
    titulo: Armstrong, que perdió masa pero no la que parece
    fuente: >-
      Ejercicio 1.9 · Colección de problemas de Mecánica de Fluidos,
      Propiedades de los fluidos · Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Neil Armstrong, primer hombre que pisó la luna, pesaba antes de partir
      para la luna $78\ \text{kg}$ y en el viaje perdió una masa de
      $2\ \text{kg}$. Se pide:

      a) Peso de Armstrong en el momento de pisar la luna.

      b) Masa del mismo en dicho momento.

      Dato: Gravedad lunar $= 1{,}61\ \text{m/s}^{2}$.
    pide: El peso en la Luna y la masa en ese momento.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado mezcla las dos magnitudes a propósito: «pesaba 78 kg»
          y «perdió una masa de 2 kg». ¿Cuál es la masa de partida?
        opciones:
          - texto: >-
              $78\ \text{kg}$: pesaba $78\ \text{kp}$ en la Tierra, y en la
              Tierra el peso en kp y la masa en kg dan el mismo número
            correcta: true
            mensaje: |
              Eso es. $78\ \text{kp} = 764{,}4\ \text{N}$, y dividido entre
              $9{,}8$ vuelve a dar $78\ \text{kg}$. La coincidencia solo
              funciona en la Tierra, y aquí funciona porque el dato es
              terrestre.
          - texto: >-
              $764{,}4\ \text{kg}$, que es el peso en newtons
            mensaje: |
              Eso es el peso, en newtons, no la masa. La masa se obtiene
              dividiendo por la gravedad terrestre y vuelve a dar $78$.
          - texto: >-
              No se puede saber sin conocer su volumen
            mensaje: |
              El volumen no hace falta: la masa sale del peso y de la
              gravedad. El volumen entraría si preguntaran por la densidad.

      - tipo: calcular
        titulo: La masa al llegar
        pregunta: |
          ¿Cuál es su masa al pisar la Luna?
        respuesta:
          tipo: magnitud
          valor: '76 kg'
          tolerancia: 0.005
          formato: una masa, con su unidad
        distractores:
          - valor: '78 kg'
            mensaje: |
              Esa es la masa de partida: el enunciado dice que perdió
              $2\ \text{kg}$ **de masa** durante el viaje.
          - valor: '47.2 kg'
            mensaje: |
              Has dividido por la gravedad lunar. La masa no se divide por
              nada al cambiar de astro: se conserva.
        pista: |
          La masa de partida menos los 2 kg que perdió. La Luna no interviene aquí.
        desarrollo: |
          $$
          m = 78 - 2 = 76\ \text{kg}
          $$

          La gravedad lunar **no entra** en este apartado. Entra en el otro.

      - tipo: calcular
        titulo: El peso en la Luna
        pregunta: |
          ¿Cuánto pesa allí?
        respuesta:
          tipo: magnitud
          valor: '122.36 N'
          tolerancia: 0.01
          formato: un peso, con su unidad
        distractores:
          - valor: '124.97 N'
            mensaje: |
              Has usado los $78\ \text{kg}$ de partida en vez de los $76$
              que le quedan: $76 \cdot 1{,}61 = 122{,}36\ \text{N}$.
          - valor: '744.8 N'
            mensaje: |
              Eso es el peso en la Tierra con la masa nueva
              ($76 \cdot 9{,}8$). En la Luna la gravedad es
              $1{,}61\ \text{m/s}^{2}$.
        pista: |
          W = m·g con la masa que le queda y la gravedad lunar.
        desarrollo: |
          $$
          W = m\,g_{\text{Luna}} = 76 \cdot 1{,}61 = 122{,}36\ \text{N}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Pesaba 78 kg» en la Tierra: $78\ \text{kp}$, y por tanto
              $m = 78\ \text{kg}$.
          - texto: >-
              Pierde $2\ \text{kg}$ de masa: al llegar tiene
              $76\ \text{kg}$.
          - texto: >-
              Peso en la Luna: $76 \cdot 1{,}61 = 122{,}36\ \text{N}$.
          - texto: >-
              En kilopondios serían $12{,}5\ \text{kp}$: allí «pesa» doce
              kilos y medio de los de la báscula.
          - texto: >-
              Como perdió 2 kg, en la Luna también habría perdido 2 kg de
              peso respecto a lo que habría pesado allí antes de salir.
            trampa: true
            mensaje: |
              No: perder $2\ \text{kg}$ de **masa** se traduce en perder
              $2 \cdot 1{,}61 = 3{,}22\ \text{N}$ de peso lunar, no
              «$2\ \text{kg}$ de peso». La pérdida de peso depende de dónde
              esté; la de masa, no. Es el mismo enredo del enunciado, ahora
              al revés.

    resolucion: |
      **a) y b), en el orden en que salen.** El dato de partida es terrestre,
      así que los $78\ \text{kp}$ dan $78\ \text{kg}$ de masa. Perdidos
      $2\ \text{kg}$:

      $$
      \boxed{m = 76\ \text{kg}}
      \qquad
      \boxed{W_{\text{Luna}} = 76 \cdot 1{,}61 = 122{,}36\ \text{N}}
      $$

      > **Un enunciado escrito para confundir, y está bien que lo esté.**
      > Dice «pesaba 78 kg» (peso, en unidades técnicas) y «perdió una masa de
      > 2 kg» (masa, en unidades del SI) en la misma frase. Quien no tenga
      > separadas las dos magnitudes restará y multiplicará en el orden
      > equivocado. Quien las tenga separadas verá que el apartado b) no
      > necesita la gravedad lunar para nada.
