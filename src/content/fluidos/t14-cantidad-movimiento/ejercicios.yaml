ejercicios:
  # ── NUESTRO (§08). El teorema se enuncia en este tema y se aplica en el 15;
  #    este ejercicio es el caso mínimo —un codo— donde ya aparecen los dos
  #    términos, el de presión y el de cantidad de movimiento, y se ve cuál
  #    de los dos manda.
  - id: ejflu14-el-codo-y-su-anclaje
    titulo: La fuerza sobre un codo, y cuál de los dos términos manda
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por un codo de $90°$ situado en un plano horizontal, de
      $200\ \text{mm}$ de diámetro constante, circulan $80\ \text{l/s}$ de
      agua. El manómetro a la entrada marca $3\ \text{bar}$, y se desprecian
      las pérdidas.

      a) Calcular la velocidad del agua.

      b) Calcular la fuerza que el agua ejerce sobre el codo.

      Tomar $\rho = 1000\ \text{kg/m}^{3}$.
    pide: La velocidad y la resultante sobre el codo, con su dirección.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerzas exteriores hay que meter en el primer miembro del TCM?
        opciones:
          - texto: >-
              Las de presión sobre las dos secciones ($pA$) y la reacción del
              codo. El peso no, porque el codo está en horizontal
            correcta: true
            mensaje: |
              Eso es, y las de presión son las que casi siempre se olvidan
              —además de ser aquí las que mandan, unas cuarenta y seis veces
              mayores que el término de cantidad de movimiento—.
          - texto: >-
              Solo la reacción del codo: las presiones ya están en Bernoulli
            mensaje: |
              Bernoulli y el TCM son ecuaciones distintas y las presiones
              entran en las dos. En el TCM la presión aparece como **fuerza**
              sobre las secciones del volumen de control, $p\,A$.
          - texto: >-
              Las de presión y el peso del agua del codo
            mensaje: |
              El peso es vertical y el codo está en un plano horizontal, así
              que no tiene componente en los ejes del problema. Si el codo
              estuviera en vertical, sí habría que contarlo.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '2.546 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2 m/s'
            mensaje: |
              Has usado $A = D^{2}$ o similar. El área es
              $\pi D^{2}/4 = 0{,}0314\ \text{m}^{2}$, y
              $v = 0{,}08/0{,}0314$.
          - valor: '0.637 m/s'
            mensaje: |
              Has usado $\pi D^{2}$ sin dividir entre 4: el área sale cuatro
              veces mayor y la velocidad, cuatro veces menor.
        pista: |
          v = Q/A con A = π·0,2²/4.
        desarrollo: |
          $$
          A = \frac{\pi\cdot0{,}2^{2}}{4} = 0{,}0314\ \text{m}^{2}
          \qquad
          v = \frac{0{,}08}{0{,}0314} = 2{,}546\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La resultante sobre el codo
        pregunta: |
          ¿Cuál es el módulo de la fuerza que el agua ejerce sobre el codo?
        respuesta:
          tipo: magnitud
          valor: '13.62 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '9.63 kN'
            mensaje: |
              Esa es una de las dos componentes. La resultante de dos fuerzas
              iguales y perpendiculares es $\sqrt2$ veces mayor:
              $9{,}63\sqrt2 = 13{,}62\ \text{kN}$.
          - valor: '0.288 kN'
            mensaje: |
              Solo has contado el término de cantidad de movimiento
              ($\rho Q v$ en cada eje). Falta el de presión, $pA$, que aquí es
              cuarenta y seis veces mayor.
        pista: |
          Cada componente vale p·A + ρ·Q·v, y la resultante es √2 veces una de ellas.
        desarrollo: |
          $$
          p\,A = 300\,000\cdot0{,}0314 = 9{,}42\ \text{kN}
          \qquad
          \rho Q v = 1000\cdot0{,}08\cdot2{,}546 = 0{,}204\ \text{kN}
          $$
          $$
          R_x = R_y = 9{,}42+0{,}204 = 9{,}63\ \text{kN}
          \qquad
          |R| = 9{,}63\sqrt2 = 13{,}62\ \text{kN}
          $$

          Dirigida **hacia fuera de la esquina**, a $45°$: es la que tiene que
          aguantar el macizo de anclaje.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v = Q/A = 2{,}546\ \text{m/s}$, la misma a la entrada y a la
              salida porque el diámetro no cambia.
          - texto: >-
              Sin pérdidas y en horizontal, Bernoulli deja $p_2 = p_1$.
          - texto: >-
              Eje $x$: $p A + R_x = \rho Q(0-v)$; eje $y$:
              $-pA + R_y = \rho Q(v-0)$.
          - texto: >-
              Cada componente de la fuerza sobre el codo vale
              $pA+\rho Qv = 9{,}63\ \text{kN}$.
          - texto: >-
              Resultante $13{,}62\ \text{kN}$ a $45°$, hacia fuera de la
              esquina.
          - texto: >-
              Como el diámetro no cambia, la velocidad tampoco, y por eso la
              fuerza sobre el codo es nula.
            trampa: true
            mensaje: |
              El **módulo** de la velocidad no cambia, pero su **dirección**
              sí, y la cantidad de movimiento es un vector: pasar de $+x$ a
              $+y$ es un cambio grande. Además está el término de presión, que
              aquí es el dominante y existe aunque el fluido ni se moviera.

    resolucion: |
      $$
      \boxed{v = \frac{Q}{A} = 2{,}546\ \text{m/s}}
      $$
      $$
      R_x = R_y = pA + \rho Qv = 9{,}42+0{,}20 = 9{,}63\ \text{kN}
      \qquad
      \boxed{|R| = 13{,}62\ \text{kN} \text{ a } 45°}
      $$

      > **Cuál de los dos términos manda, y por qué importa.** Aquí la presión
      > aporta $9{,}42\ \text{kN}$ y la cantidad de movimiento $0{,}20$:
      > **cuarenta y seis veces menos**. Quien se deje el término $pA$ no
      > comete un error del 2 %, se equivoca por completo. Y al revés: en un
      > chorro libre, donde $p = 0$, el único término es el de cantidad de
      > movimiento.

  # ── COLECCIÓN 4.13. La reacción de un chorro contra la fuerza estática del
  #    tapón que lo tapaba: la comparación es el ejercicio entero.
  - id: ejflu14-col413-la-reaccion-del-chorro
    titulo: La reacción de un chorro comparada con lo que aguantaba el tapón
    fuente: >-
      Ejercicio 4.13 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito cilíndrico de $5\ \text{m}$ de altura y $1\ \text{m}$ de
      diámetro está lleno de agua y tiene un orificio situado a $3\ \text{m}$
      de la superficie libre de la misma, siendo su diámetro de $3\ \text{cm}$
      y los coeficientes de gasto y velocidad $C_d = 0{,}60$ y
      $C_v = 0{,}98$. Se pide:

      a) Reacción que produce el chorro que fluye por el orificio.

      b) Relación entre la fuerza $F_a$ (calculada) y la fuerza $F_e$
      (estática) aplicada sobre un tapón que impide la salida del chorro.
    pide: La reacción del chorro y su relación con la fuerza estática del tapón.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos coeficientes, $C_d$ y $C_v$. ¿Para qué sirve cada uno?
        opciones:
          - texto: >-
              $C_v$ corrige la **velocidad** de salida y $C_d$ el **caudal**:
              la reacción necesita los dos, porque es $\rho\,Q\,v$
            correcta: true
            mensaje: |
              Exacto, y es lo que hace que este ejercicio no se pueda resolver
              con un solo coeficiente. El caudal sale con $C_d$ y la velocidad
              con $C_v$; multiplicarlos da la reacción.
          - texto: >-
              Son el mismo coeficiente con dos nombres, y basta usar uno
            mensaje: |
              Están relacionados —$C_d = C_v\,C_c$— pero no son el mismo. Aquí
              el de contracción implícito es $0{,}60/0{,}98 = 0{,}61$.
          - texto: >-
              $C_d$ es para el orificio y $C_v$ para el depósito
            mensaje: |
              Los dos son del orificio. Corrigen dos efectos distintos del
              mismo chorro: que la vena se estrecha y que el fluido pierde algo
              de velocidad al pasar.

      - tipo: calcular
        titulo: La reacción del chorro
        pregunta: |
          ¿Qué reacción produce el chorro?
        respuesta:
          tipo: magnitud
          valor: '24.44 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '40.74 n'
            mensaje: |
              Has usado el área geométrica del orificio para el caudal, sin el
              coeficiente de gasto. Solo el 60 % de esa sección lleva agua de
              verdad.
          - valor: '24.94 n'
            mensaje: |
              Ese es el resultado en **kilopondios** con la etiqueta de
              newtons — o casi: la reacción son $2{,}49\ \text{kp}$, que en
              newtons son $24{,}4$. Cuidado con el orden de magnitud.
        pista: |
          $F = \rho\,Q\,v$, con $Q = C_d A\sqrt{2gh}$ y $v = C_v\sqrt{2gh}$.
        desarrollo: |
          $$
          \sqrt{2gh} = \sqrt{19{,}6\cdot 3} = 7{,}668\ \text{m/s}
          $$
          $$
          v = 0{,}98\cdot 7{,}668 = 7{,}515\ \text{m/s}
          \qquad
          Q = 0{,}60\cdot 7{,}069\cdot 10^{-4}\cdot 7{,}668 = 3{,}252\ \text{l/s}
          $$
          $$
          F = \rho\,Q\,v = 1000\cdot 3{,}252\cdot 10^{-3}\cdot 7{,}515
          = 24{,}4\ \text{N} = 2{,}49\ \text{kp}
          $$

      - tipo: calcular
        titulo: La relación con la fuerza estática
        pregunta: |
          ¿Cuánto vale $F_a/F_e$?
        respuesta:
          tipo: numero
          valor: '1.176'
          tolerancia: 0.02
          formato: un número sin unidades
        distractores:
          - valor: '0.8503'
            mensaje: |
              Has dividido al revés. La reacción del chorro es **mayor** que la
              fuerza que aguantaba el tapón, y ese es el resultado que hace
              interesante el problema.
          - valor: '2'
            mensaje: |
              Ese sería el valor teórico ideal, con $C_d = C_v = 1$:
              $\rho Q v/(\gamma h A) = 2$. Los coeficientes reales lo bajan a
              1,18.
        pista: |
          La fuerza estática es $\gamma\,h\,A$ con el área **geométrica** del
          orificio.
        desarrollo: |
          $$
          F_e = \gamma\,h\,A = 9800\cdot 3\cdot 7{,}069\cdot 10^{-4}
          = 20{,}78\ \text{N}
          $$
          $$
          \frac{F_a}{F_e} = \frac{24{,}44}{20{,}78} = 1{,}176
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción del chorro es $\rho Q v$, y necesita los dos
              coeficientes: $C_d$ para el caudal y $C_v$ para la velocidad.
          - texto: >-
              Sale $24{,}4$ N, mientras que el tapón que impedía la salida
              soportaba solo $20{,}8$.
          - texto: >-
              Es decir, **al destapar el orificio el empuje aumenta** un 18 %,
              no disminuye.
          - texto: >-
              Con coeficientes perfectos la relación sería 1, porque la
              cantidad de movimiento que sale iguala a la fuerza que la
              generaba.
            trampa: true
            mensaje: |
              Con coeficientes perfectos la relación sería **2**, no 1:
              $\rho Q v = \rho A(2gh) = 2\gamma h A$. Es un resultado clásico y
              sorprendente, y los coeficientes reales solo lo bajan a 1,18.

    resolucion: |
      **La reacción.** Con los dos coeficientes en su sitio:

      $$
      v = C_v\sqrt{2gh} = 7{,}515\ \text{m/s}
      \qquad
      Q = C_d A\sqrt{2gh} = 3{,}25\ \text{l/s}
      $$
      $$
      F_a = \rho\,Q\,v = 24{,}4\ \text{N} = 2{,}49\ \text{kp}
      $$

      **La comparación**, que es lo que el enunciado busca:

      $$
      F_e = \gamma\,h\,A = 20{,}8\ \text{N}
      \qquad
      \frac{F_a}{F_e} = 1{,}18
      $$

      **Al quitar el tapón, el depósito empuja más, no menos.** Es
      contraintuitivo: parece que si el agua sale, la fuerza debería
      desaparecer. Lo que ocurre es que el tapón soportaba la presión
      hidrostática sobre su área, y el chorro en movimiento devuelve una
      reacción mayor.

      **El caso ideal lo explica.** Con $C_d = C_v = 1$,

      $$
      F = \rho\,Q\,v = \rho\,A\,v^{2} = \rho A\,(2gh) = 2\,\gamma h A = 2F_e
      $$

      **exactamente el doble**. Los coeficientes reales —que reducen el caudal
      un 40 % y la velocidad un 2 %— lo bajan a 1,18, pero el resultado
      cualitativo se mantiene: **el chorro empuja más que la presión estática
      que lo produce.**

      Es el mismo factor 2 que aparece en el álabe de 180° del tema 15, y por
      la misma razón: la cantidad de movimiento se cuenta dos veces, una en la
      velocidad y otra en el caudal, y las dos crecen con $\sqrt h$.
