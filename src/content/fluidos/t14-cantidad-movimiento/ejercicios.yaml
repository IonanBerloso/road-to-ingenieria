      <figcaption>La grava entra en la cinta cayendo y sale corriendo en horizontal: cambia de dirección por completo, y ese giro es lo que carga los rodillos.</figcaption>
      </figure>
    pide: Las dos componentes de la fuerza que la grava ejerce sobre la banda.
    pasos:
      - tipo: reconocer
        pregunta: |
          El volumen de control es la grava que hay **encima de la cinta**. ¿Qué
          entra y qué sale de él, y en qué dirección?
        opciones:
          - texto: Entra cayendo, con velocidad vertical, y sale en horizontal a 5 m/s con la cinta
            correcta: true
            mensaje: |
              Eso es. La grava entra por arriba con la velocidad que trae de la
              caída y sale por el extremo arrastrada por la cinta. Su cantidad
              de movimiento gira 90°, y eso exige fuerza en los dos ejes.
          - texto: Entra y sale en horizontal, porque la cinta es horizontal
            mensaje: |
              La cinta sí es horizontal, pero la grava no llega por ella: llega
              **cayendo** desde la tolva, dos metros más arriba. Esa velocidad
              vertical es la que carga los rodillos hacia abajo.
          - texto: Entra a 1 m/s, la velocidad con la que deja la tolva
            mensaje: |
              Con 1 m/s sale de la tolva, pero después cae dos metros libremente
              y llega bastante más rápido: $\sqrt{1^{2}+2gh} = 6{,}34$ m/s.

      - tipo: calcular
        titulo: La velocidad con la que aterriza
        pregunta: |
          Velocidad con la que la grava llega a la cinta, tras dejar la tolva a
          1 m/s y caer 2 m.
        respuesta:
          tipo: magnitud
          valor: '6.34 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '6.26 m/s'
            mensaje: |
              Te has dejado la velocidad inicial. Sale de la tolva ya con 1 m/s;
              hay que componerla con la de caída, y en energía eso significa
              sumar los **cuadrados**.
          - valor: '7.26 m/s'
            mensaje: |
              Has sumado la velocidad inicial a la de caída directamente. Las
              velocidades no se suman: se suman las alturas de velocidad, y por
              eso va $\sqrt{V_1^{2}+2gh}$.
        pista: |
          Caída libre: $\dfrac{V_1^{2}}{2g} + h = \dfrac{V_2^{2}}{2g}$.
        desarrollo: |
          $$
          V_2 = \sqrt{V_1^{2} + 2gh} = \sqrt{1 + 39{,}2} = 6{,}34\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          Componente horizontal de la fuerza que la grava ejerce sobre la
          banda, en newtons.
        respuesta:
          tipo: magnitud
          valor: '20408 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '200000 N'
            mensaje: |
              Has usado el peso específico como si fuera densidad. El gasto
              másico es $\gamma Q/g = 20\,000 \cdot 2/9{,}8 = 4\,082$ kg/s, no
              40 000.
          - valor: '4082 N'
            mensaje: |
              Ese es el gasto másico en kg/s, no la fuerza. Falta
              multiplicarlo por la velocidad de salida.
          - valor: '25879 N'
            mensaje: |
              Has usado la velocidad de llegada, 6,34 m/s, en el eje
              horizontal. Esa es vertical: en x lo que cuenta es la velocidad
              con la que la grava **sale**, la de la cinta.
        pista: |
          En el eje x no entra cantidad de movimiento —la grava llega
          cayendo—, así que $R_x = \rho\,Q\,V_3$ con $\rho = \gamma/g$.
        desarrollo: |
          $$
          R_x = \frac{\gamma\,Q\,V_3}{g} = \frac{20\,000 \cdot 2 \cdot 5}{9{,}8} = 20\,408\ \text{N}
          $$

      - tipo: calcular
        titulo: El peso que la cinta soporta
        pregunta: |
          Peso de la grava que hay en cada instante sobre la cinta, de 3 m de
          longitud, en newtons.
        respuesta:
          tipo: magnitud
          valor: '24000 N'
          tolerancia: 0.01
          formato: un peso con su unidad (N o kN)
        distractores:
          - valor: '40000 N'
            mensaje: |
              Has multiplicado el peso específico por el caudal sin más. Eso es
              un peso **por segundo**, no un peso: hay que multiplicarlo por el
              tiempo que la grava tarda en recorrer la cinta, $3/5 = 0{,}6$ s.
          - valor: '120000 N'
            mensaje: |
              Has multiplicado el peso específico por el caudal y por la
              longitud, sin dividir entre la velocidad. El volumen sobre la
              cinta es $Q\,L/V_3$, y esa división es la que da los metros
              cúbicos.
        pista: |
          La capa de grava viaja a 5 m/s, así que tarda $L/V_3$ en cruzar la
          cinta y el volumen que hay encima es $Q\,L/V_3$.
        desarrollo: |
          $$
          \forall = \frac{Q}{V_3}\,L = \frac{2}{5} \cdot 3 = 1{,}2\ \text{m}^{3} \qquad W = 20\,000 \cdot 1{,}2 = 24\,000\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          Componente vertical de la fuerza que la grava ejerce sobre la banda,
          en newtons.
        respuesta:
          tipo: magnitud
          valor: '49879 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '25879 N'
            mensaje: |
              Te has dejado el peso de la grava que hay encima. La cinta aguanta
              dos cosas a la vez: el impacto de la que cae y el peso de la que
              ya está.
          - valor: '24000 N'
            mensaje: |
              Ese es solo el peso. Falta el impacto de la que va cayendo, que
              son otros 25 879 N: más que el peso.
          - valor: '28082 N'
            mensaje: |
              Has usado la velocidad de la tolva, 1 m/s, en vez de la de
              llegada. La grava cae dos metros y llega a 6,34.
        pista: |
          $R_y - W = \rho\,Q\,\big(0 - (-V_2)\big)$, es decir
          $R_y = \rho\,Q\,V_2 + W$.
        desarrollo: |
          $$
          R_y = \frac{20\,000 \cdot 2 \cdot 6{,}34}{9{,}8} + 24\,000 = 25\,879 + 24\,000 = 49\,879\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el balance de la cinta. Una pieza es falsa.
        piezas:
          - texto: 'El volumen de control es la grava que está sobre la cinta: entra por arriba cayendo a 6,34 m/s y sale por el extremo a 5 m/s en horizontal.'
          - texto: 'En el eje x no hay cantidad de movimiento entrante, así que la fuerza es solo la de la grava que sale: 20 408 N.'
          - texto: 'En el eje y hay que sumar dos cosas distintas: el peso de la grava que hay encima y el frenado de la que cae.'
          - texto: 'La fuerza vertical y la horizontal salen del mismo caudal y de velocidades parecidas, 6,34 y 5 m/s, así que son del mismo orden.'
            trampa: true
            mensaje: |
              Los términos de cantidad de movimiento sí son parecidos —25 879
              contra 20 408— pero en el eje y se suma además el **peso** de la
              grava que hay encima, 24 000 N, que no tiene equivalente
              horizontal. El resultado es 49 879 frente a 20 408: dos veces y
              media.
    resolucion: |
      **Un problema de fluidos sin fluido, y por eso enseña.** La grava no es
      agua, pero el teorema de la cantidad de movimiento no pregunta qué es lo
      que se mueve: solo necesita un gasto y unas velocidades de entrada y
      salida.

      **La velocidad de llegada.** La grava sale de la tolva a 1 m/s y cae 2 m:

      $$
      V_2 = \sqrt{1^{2} + 2 \cdot 9{,}8 \cdot 2} = 6{,}34\ \text{m/s}
      $$

      **El eje horizontal.** La grava llega cayendo, así que no aporta cantidad
      de movimiento en x; toda la que sale hay que dársela:

      $$
      R_x = \frac{\gamma\,Q\,V_3}{g} = \frac{20\,000 \cdot 2 \cdot 5}{9{,}8} = 20\,408\ \text{N}
      $$

      **El eje vertical**, donde hay dos cosas. Primero el peso de la grava que
      está encima en cada instante: la capa cruza los 3 m en 0,6 s, así que hay
      1,2 m³ sobre la cinta y pesan 24 000 N. Y después el frenado de la que
      cae:

      $$
      R_y = \frac{\gamma\,Q\,V_2}{g} + W = 25\,879 + 24\,000 = 49\,879\ \text{N}
      $$

      Sobre la banda, por reacción: 20 408 N en el sentido del movimiento y
      49 879 N hacia abajo.

      **Lo que conviene mirar.** El impacto de la grava que cae, 25 879 N, es
      **mayor que el peso de toda la que hay encima**, 24 000. Los rodillos de
      una cinta de este tipo no se dimensionan por lo que transportan: se
      dimensionan por lo que reciben, y por eso las tolvas se colocan lo más
      bajas posible. Bajar la caída de 2 m a 0,5 m dejaría $V_2$ en 3,3 m/s y
      el impacto en 13 500 N, casi la mitad.

  - id: ejflu14-col47-el-cono-y-el-codo-en-plano-vertical
    titulo: El cono y el codo, en plano vertical
    fuente: Ejercicio 4.7 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En una instalación de una tubería ha sido necesario colocar en un plano
      vertical un cono de reducción y un codo de 45°. La presión en el punto
      anterior al comienzo de la reducción es de 2 kg/cm². Se pide:

      **a)** Componentes en la dirección vertical y horizontal, y la
      resultante de la fuerza que comunica el agua al conjunto.

      **Datos:** caudal = 20 l/s. D₁ = 200 mm, D₂ = D₃ = 100 mm;
      z₂ − z₁ = 0,50 m, z₃ − z₁ = 1,0 m.

      **Nota:** téngase en cuenta el peso y las energías cinéticas.

