ejercicios:
  # ── NUESTRO (§08). El teorema se enuncia en este tema y se aplica en el 15;
  #    este ejercicio es el caso mínimo —un codo— donde ya aparecen los dos
  #    términos, el de presión y el de cantidad de movimiento, y se ve cuál
  #    de los dos manda.
  - id: ejflu14-el-codo-y-su-anclaje
    titulo: La fuerza sobre un codo, y cuál de los dos términos manda
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Por un codo de $90°$ situado en un plano horizontal, de
      $200\ \text{mm}$ de diámetro constante, circulan $80\ \text{l/s}$ de
      agua. El manómetro a la entrada marca $3\ \text{bar}$, y se desprecian
      las pérdidas.

      a) Calcular la velocidad del agua.

      b) Calcular la fuerza que el agua ejerce sobre el codo.

      Tomar $\rho = 1000\ \text{kg/m}^{3}$.
    pide: La velocidad y la resultante sobre el codo, con su dirección.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerzas exteriores hay que meter en el primer miembro del TCM?
        opciones:
          - texto: >-
              Las de presión sobre las dos secciones ($pA$) y la reacción del
              codo. El peso no, porque el codo está en horizontal
            correcta: true
            mensaje: |
              Eso es, y las de presión son las que casi siempre se olvidan
              —además de ser aquí las que mandan, unas cuarenta y seis veces
              mayores que el término de cantidad de movimiento—.
          - texto: >-
              Solo la reacción del codo: las presiones ya están en Bernoulli
            mensaje: |
              Bernoulli y el TCM son ecuaciones distintas y las presiones
              entran en las dos. En el TCM la presión aparece como **fuerza**
              sobre las secciones del volumen de control, $p\,A$.
          - texto: >-
              Las de presión y el peso del agua del codo
            mensaje: |
              El peso es vertical y el codo está en un plano horizontal, así
              que no tiene componente en los ejes del problema. Si el codo
              estuviera en vertical, sí habría que contarlo.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '2.546 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2 m/s'
            mensaje: |
              Has usado $A = D^{2}$ o similar. El área es
              $\pi D^{2}/4 = 0{,}0314\ \text{m}^{2}$, y
              $v = 0{,}08/0{,}0314$.
          - valor: '0.637 m/s'
            mensaje: |
              Has usado $\pi D^{2}$ sin dividir entre 4: el área sale cuatro
              veces mayor y la velocidad, cuatro veces menor.
        pista: |
          v = Q/A con A = π·0,2²/4.
        desarrollo: |
          $$
          A = \frac{\pi\cdot0{,}2^{2}}{4} = 0{,}0314\ \text{m}^{2}
          \qquad
          v = \frac{0{,}08}{0{,}0314} = 2{,}546\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La resultante sobre el codo
        pregunta: |
          ¿Cuál es el módulo de la fuerza que el agua ejerce sobre el codo?
        respuesta:
          tipo: magnitud
          valor: '13.62 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '9.63 kN'
            mensaje: |
              Esa es una de las dos componentes. La resultante de dos fuerzas
              iguales y perpendiculares es $\sqrt2$ veces mayor:
              $9{,}63\sqrt2 = 13{,}62\ \text{kN}$.
          - valor: '0.288 kN'
            mensaje: |
              Solo has contado el término de cantidad de movimiento
              ($\rho Q v$ en cada eje). Falta el de presión, $pA$, que aquí es
              cuarenta y seis veces mayor.
        pista: |
          Cada componente vale p·A + ρ·Q·v, y la resultante es √2 veces una de ellas.
        desarrollo: |
          $$
          p\,A = 300\,000\cdot0{,}0314 = 9{,}42\ \text{kN}
          \qquad
          \rho Q v = 1000\cdot0{,}08\cdot2{,}546 = 0{,}204\ \text{kN}
          $$
          $$
          R_x = R_y = 9{,}42+0{,}204 = 9{,}63\ \text{kN}
          \qquad
          |R| = 9{,}63\sqrt2 = 13{,}62\ \text{kN}
          $$

          Dirigida **hacia fuera de la esquina**, a $45°$: es la que tiene que
          aguantar el macizo de anclaje.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v = Q/A = 2{,}546\ \text{m/s}$, la misma a la entrada y a la
              salida porque el diámetro no cambia.
          - texto: >-
              Sin pérdidas y en horizontal, Bernoulli deja $p_2 = p_1$.
          - texto: >-
              Eje $x$: $p A + R_x = \rho Q(0-v)$; eje $y$:
              $-pA + R_y = \rho Q(v-0)$.
          - texto: >-
              Cada componente de la fuerza sobre el codo vale
              $pA+\rho Qv = 9{,}63\ \text{kN}$.
          - texto: >-
              Resultante $13{,}62\ \text{kN}$ a $45°$, hacia fuera de la
              esquina.
          - texto: >-
              Como el diámetro no cambia, la velocidad tampoco, y por eso la
              fuerza sobre el codo es nula.
            trampa: true
            mensaje: |
              El **módulo** de la velocidad no cambia, pero su **dirección**
              sí, y la cantidad de movimiento es un vector: pasar de $+x$ a
              $+y$ es un cambio grande. Además está el término de presión, que
              aquí es el dominante y existe aunque el fluido ni se moviera.

    resolucion: |
      $$
      \boxed{v = \frac{Q}{A} = 2{,}546\ \text{m/s}}
      $$
      $$
      R_x = R_y = pA + \rho Qv = 9{,}42+0{,}20 = 9{,}63\ \text{kN}
      \qquad
      \boxed{|R| = 13{,}62\ \text{kN} \text{ a } 45°}
      $$

      > **Cuál de los dos términos manda, y por qué importa.** Aquí la presión
      > aporta $9{,}42\ \text{kN}$ y la cantidad de movimiento $0{,}20$:
      > **cuarenta y seis veces menos**. Quien se deje el término $pA$ no
      > comete un error del 2 %, se equivoca por completo. Y al revés: en un
      > chorro libre, donde $p = 0$, el único término es el de cantidad de
      > movimiento.

  - id: ejflu14-col41-la-pieza-de-dos-boquillas-y-lo-que-aguanta-la-brida
    titulo: La pieza de dos boquillas, y lo que aguanta la brida
    fuente: Ejercicio 4.1 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Una pieza especial consta de dos boquillas de diámetro 22 mm, que
      descargan a la atmósfera cada una un caudal de 9 l/s. Esta pieza está
      unida en B a una tubería de hierro galvanizado de 125 mm de diámetro.
      Tanto la tubería principal como la pieza especial se encuentran apoyadas
      en un plano horizontal. Se pide, despreciando las pérdidas de carga en la
      pieza especial:

      a) Presión en B (Pa).

      b) Esfuerzos (Fuerzas $F_X$, $F_Y$) que se producen en la unión.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 290" role="img" width="460" height="290"
           aria-labelledby="f41t f41d">
        <title id="f41t">La pieza vista en planta: entra por B y sale por dos boquillas, una hacia arriba y otra hacia la izquierda</title>
        <desc id="f41d">Vista en planta de una pieza apoyada en un plano
        horizontal. Por la brida B entra una tubería de 125 milímetros que viene
        de la izquierda. Dentro de la pieza el caudal se parte en dos ramas de
        22 milímetros: la primera sale por la boquilla 1, orientada hacia
        arriba del dibujo, y la segunda recorre la pieza hasta salir por la
        boquilla 2, orientada hacia la izquierda. Las dos descargan a la
        atmósfera. Están acotadas las distancias de 1,8 y 2 metros en
        horizontal y de 0,5 y 0,6 metros en vertical.</desc>
        <defs>
          <marker id="m41l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m41n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M30,138 H150 V162 H30 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="150" y1="126" x2="150" y2="174" stroke="var(--ink)" stroke-width="5"/>
        <text x="140" y="120" text-anchor="end" font-size="11" fill="var(--ink)">B</text>
        <text x="40" y="132" font-size="9.5" fill="var(--faint)">Ø 125 mm</text>
        <line x1="56" y1="150" x2="120" y2="150" stroke="var(--live)" stroke-width="2" marker-end="url(#m41l)"/>
        <text x="60" y="180" font-size="9.5" fill="var(--live)">Q = 18 l/s</text>
        <path d="M154,138 H300 V70 H322 V162 H196 V230 H322" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <path d="M154,162 H300" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <path d="M300,70 V54 h22 V70" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="311" y1="50" x2="311" y2="20" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m41l)"/>
        <text x="318" y="34" font-size="10" fill="var(--ink)">1 · Ø 22 · 9 l/s</text>
        <path d="M196,222 h-22 V238 h22" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="170" y1="230" x2="132" y2="230" stroke="var(--live)" stroke-width="2.4" marker-end="url(#m41l)"/>
        <text x="126" y="234" text-anchor="end" font-size="10" fill="var(--ink)">2 · Ø 22 · 9 l/s</text>
        <line x1="152" y1="104" x2="309" y2="104" stroke="var(--faint)" stroke-width="1" marker-start="url(#m41n)" marker-end="url(#m41n)"/>
        <text x="230" y="98" text-anchor="middle" font-size="10" fill="var(--faint)">1,8 m</text>
        <line x1="152" y1="268" x2="322" y2="268" stroke="var(--faint)" stroke-width="1" marker-start="url(#m41n)" marker-end="url(#m41n)"/>
        <text x="238" y="282" text-anchor="middle" font-size="10" fill="var(--faint)">2 m</text>
        <line x1="352" y1="58" x2="352" y2="146" stroke="var(--faint)" stroke-width="1" marker-start="url(#m41n)" marker-end="url(#m41n)"/>
        <line x1="326" y1="56" x2="356" y2="56" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="326" y1="150" x2="356" y2="150" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="358" y="106" font-size="10" fill="var(--faint)">0,5 m</text>
        <line x1="352" y1="154" x2="352" y2="230" stroke="var(--faint)" stroke-width="1" marker-start="url(#m41n)" marker-end="url(#m41n)"/>
        <line x1="326" y1="232" x2="356" y2="232" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="358" y="196" font-size="10" fill="var(--faint)">0,6 m</text>
        <line x1="170" y1="150" x2="200" y2="150" stroke="var(--faint)" stroke-width="1"/>
        <line x1="182" y1="138" x2="182" y2="162" stroke="var(--faint)" stroke-width="1"/>
        <text x="204" y="146" font-size="9" fill="var(--faint)">x</text>
        <text x="176" y="134" font-size="9" fill="var(--faint)">y</text>
      </svg>
      <figcaption>Vista en planta: el plano del dibujo es horizontal, así que el peso no interviene y las dos boquillas empujan en direcciones perpendiculares entre sí.</figcaption>
      </figure>
    pide: La presión en B y las dos componentes del esfuerzo en la unión.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza está apoyada en un plano **horizontal** y las cotas de las
          tres secciones son iguales. ¿Qué simplifica eso?
        opciones:
          - texto: Que el peso no entra en el balance de fuerzas horizontales y que el Bernoulli se queda sin términos de cota
            correcta: true
            mensaje: |
              Eso es. El dibujo es una **planta**, no un alzado: las «alturas»
              de la figura son distancias horizontales. El peso es
              perpendicular al plano del problema y no aparece en $F_X$ ni en
              $F_Y$; y como $z_B = z_1 = z_2$, el Bernoulli solo relaciona
              presión y velocidad.
          - texto: Que las dos boquillas descargan a la misma presión, así que sus velocidades son iguales
            mensaje: |
              Las velocidades son iguales, sí, pero no por eso: es porque las
              dos boquillas tienen el mismo diámetro y el mismo caudal. Que
              estén a la misma cota es lo que quita los términos $z$ del
              Bernoulli.
          - texto: Que las fuerzas de las dos boquillas se anulan entre sí
            mensaje: |
              No se anulan: se anularían si salieran en direcciones opuestas.
              Aquí una descarga hacia arriba del dibujo y la otra hacia la
              izquierda, o sea **perpendiculares**, y cada una carga un eje
              distinto.

      - tipo: calcular
        titulo: La presión en la brida
        pregunta: |
          Presión manométrica en B, en pascales. Por la tubería de 125 mm entran
          18 l/s y cada boquilla de 22 mm descarga 9.
        respuesta:
          tipo: magnitud
          valor: '279200 Pa'
          tolerancia: 0.01
          formato: una presión con su unidad (Pa, kPa o mca)
        distractores:
          - valor: '4484000 Pa'
            mensaje: |
              Has tomado los 22 mm como radio. La boquilla mide 22 mm de
              diámetro, y como la velocidad va al cuadrado, ese descuido
              multiplica la presión por dieciséis.
          - valor: '246600 Pa'
            mensaje: |
              Has restado las velocidades antes de elevarlas al cuadrado. El
              Bernoulli resta los **cuadrados**: $(V_1^{2}-V_B^{2})/2g$, no
              $(V_1-V_B)^{2}/2g$. Aquí se lleva un 12 %.
          - valor: '1120000 Pa'
            mensaje: |
              Has metido en la boquilla los 18 l/s enteros. Como la velocidad
              va al cuadrado, doblar el caudal cuadruplica la presión.
        pista: |
          Bernoulli de B a una boquilla, con la misma cota y presión nula a la
          salida: $p_B/\gamma = (V_1^{2} - V_B^{2})/2g$.
        desarrollo: |
          $$
          V_1 = \frac{4 \cdot 0{,}009}{\pi \cdot 0{,}022^{2}} = 23{,}68\ \text{m/s} \qquad V_B = \frac{4 \cdot 0{,}018}{\pi \cdot 0{,}125^{2}} = 1{,}47\ \text{m/s}
          $$

          $$
          \frac{p_B}{\gamma} = \frac{23{,}68^{2} - 1{,}47^{2}}{19{,}6} = 28{,}49\ \text{mca} \qquad p_B = 279\,200\ \text{Pa}
          $$

      - tipo: calcular
        titulo: El esfuerzo en el eje del tubo
        pregunta: |
          Componente $F_X$ del esfuerzo en la unión, en newtons. El eje x es el
          de la tubería de entrada, y la boquilla 2 descarga en sentido
          contrario a él.
        respuesta:
          tipo: magnitud
          valor: '3666 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N o kN)
        distractores:
          - valor: '3426 N'
            mensaje: |
              Esa es solo la fuerza de presión, $p_B A_B$. Falta el término de
              cantidad de movimiento: la boquilla 2 escupe hacia atrás y el
              chorro de entrada frena, y las dos cosas suman otros 240 N.
          - valor: '3187 N'
            mensaje: |
              Has restado el término de cantidad de movimiento en vez de
              sumarlo. La boquilla 2 sale en $-x$, así que su cantidad de
              movimiento saliente es negativa y **aumenta** el esfuerzo.
          - valor: '213 N'
            mensaje: |
              Ese es $F_Y$. En el eje x manda la presión de la brida, que es
              dieciséis veces mayor.
        pista: |
          $p_B A_B + R_x = \rho\,(-q V_2 - Q V_B)$, con $A_B = \pi
          \cdot 0{,}125^{2}/4$.
        desarrollo: |
          $$
          p_B A_B = 279\,200 \cdot 0{,}012272 = 3\,426\ \text{N}
          $$

          $$
          R_x = -3\,426 + 1\,000\,(-0{,}009 \cdot 23{,}68 - 0{,}018 \cdot 1{,}47) = -3\,426 - 240 = -3\,666\ \text{N}
          $$

          El signo dice que la pieza empuja al fluido hacia $-x$; sobre la
          brida, la reacción son 3 666 N hacia $+x$.

      - tipo: calcular
        titulo: El esfuerzo transversal
        pregunta: |
          Componente $F_Y$ del esfuerzo en la unión, en newtons. La boquilla 1
          descarga en el sentido $+y$.
        respuesta:
          tipo: magnitud
          valor: '213 N'
          tolerancia: 0.01
          formato: una fuerza con su unidad (N)
        distractores:
          - valor: '426 N'
            mensaje: |
              Has contado las dos boquillas en el eje y. Solo la 1 descarga en
              esa dirección; la 2 sale en $-x$ y carga el otro eje.
          - valor: '3639 N'
            mensaje: |
              Has metido la fuerza de presión también en y. La brida es
              perpendicular al eje x: su presión empuja solo en x.
        pista: |
          En y no hay presión aplicada ni caudal entrante:
          $R_y = \rho\,q\,V_1$.
        desarrollo: |
          $$
          R_y = 1\,000 \cdot 0{,}009 \cdot 23{,}68 = 213\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: 'Bernoulli da la presión en B, porque de la brida a las boquillas no hay pérdidas ni cambio de cota.'
          - texto: 'El volumen de control encierra la pieza: sus fuerzas exteriores son la presión de la brida y la reacción del apoyo sobre el fluido.'
          - texto: 'En x la ecuación lleva la presión, la salida de la boquilla 2 en sentido negativo y la entrada por B; en y, solo la salida de la boquilla 1.'
          - texto: 'Como el caudal se reparte por igual entre las dos boquillas, los esfuerzos en los dos ejes también salen iguales.'
            trampa: true
            mensaje: |
              Salen 3 666 N y 213 N: diecisiete veces distintos. El caudal se
              reparte igual, pero en el eje x actúa además la fuerza de presión
              de la brida, 3 426 N, que no tiene equivalente en y. Los términos
              de cantidad de movimiento sí son parecidos: 240 N contra 213.
    resolucion: |
      **Primero, leer bien la figura.** Es una **planta**: el plano del dibujo
      es horizontal, así que arriba y abajo del papel son direcciones
      horizontales y el peso queda fuera del problema. Las tres secciones están
      a la misma cota.

      **La presión en B** (a). Bernoulli de la brida a cualquiera de las dos
      boquillas, sin pérdidas y con presión nula a la salida:

      $$
      V_1 = 23{,}68\ \text{m/s} \qquad V_B = 1{,}47\ \text{m/s} \qquad \frac{p_B}{\gamma} = \frac{23{,}68^{2}-1{,}47^{2}}{19{,}6} = 28{,}49\ \text{mca}
      $$

      $$
      p_B = 279\,200\ \text{Pa}
      $$

      **Los esfuerzos** (b). Volumen de control encerrando la pieza; fuerzas
      exteriores, la presión de la brida y la acción del apoyo:

      $$
      p_BA_B + R_x = \rho\left(-q V_2 - Q V_B\right) \;\Longrightarrow\; R_x = -3\,426 - 240 = -3\,666\ \text{N}
      $$

      $$
      R_y = \rho\,q\,V_1 = 213\ \text{N}
      $$

      Sobre la brida: $F_X = 3\,666$ N y $F_Y = 213$ N.

      **Lo que hay que retener: quién manda en cada eje.** En x el esfuerzo lo
      pone casi entero la **presión** —3 426 de 3 666 N, el 93 %— y la cantidad
      de movimiento solo añade 240. En y no hay presión aplicada, así que los
      213 N son cantidad de movimiento pura. Por eso una brida de este tipo
      falla a tracción longitudinal mucho antes que a cortadura, y por eso los
      cálculos que solo miran el chorro se quedan cortos por un factor quince.

      **Dos erratas del boletín, avisadas.** En su desarrollo escribe
      «$-3\,246{,}3$» donde ha calculado 3 426,3 —una transposición de cifras—
      y más abajo «$V_B = 1{,}67$» donde antes había obtenido 1,47. Ninguna de
      las dos afecta al resultado final, que publica bien: 3 666 N y 213 N.
  - id: ejflu14-col42-la-cinta-de-grava-y-el-peso-que-lleva-encima
    titulo: La cinta de grava, y el peso que lleva encima
    fuente: Ejercicio 4.2 · Colección de problemas, capítulo 4 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Sobre la banda transportadora que se mueve a una velocidad de 5 m/s, se
      depositan 2 m³/s de grava. La grava tiene un peso específico de 20 kN/m³.
      Ésta deja la tolva a una velocidad de 1 m/s y a continuación tiene una
      caída libre de una altura media de $h = 2$ m, tal como indica la figura.
      Calcular:

      a) La componente horizontal y vertical de la fuerza que ejerce la grava
      sobre la banda transportadora.

      Nota: despreciar la fricción de los rodillos.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 300" role="img" width="440" height="300"
           aria-labelledby="f42t f42d">
        <title id="f42t">La tolva que deja caer la grava dos metros sobre una cinta de tres metros que corre a cinco metros por segundo</title>
        <desc id="f42d">Una tolva descarga grava a un metro por segundo. La
        grava cae libremente dos metros de altura media y aterriza sobre una
        cinta transportadora de tres metros de longitud que se mueve a cinco
        metros por segundo, apoyada en dos rodillos de medio metro. Al final de
        la cinta la grava sale despedida y cae a un montón.</desc>
        <defs>
          <marker id="m42l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
          <marker id="m42n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <path d="M120,20 H196 V54 L172,78 H144 L120,54 Z" fill="var(--alt)" opacity="0.25" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="204" y="40" font-size="10.5" fill="var(--ink)">tolva · grava</text>
