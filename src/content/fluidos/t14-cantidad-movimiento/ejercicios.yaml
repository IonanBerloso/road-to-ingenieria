        <line x1="336" y1="120" x2="336" y2="320" stroke="var(--faint)" stroke-width="1" marker-start="url(#m47n)" marker-end="url(#m47n)"/>
        <text x="342" y="224" font-size="10.5" fill="var(--faint)">1,00 m</text>
        <line x1="180" y1="362" x2="220" y2="362" stroke="var(--faint)" stroke-width="1" marker-start="url(#m47n)" marker-end="url(#m47n)"/>
        <text x="172" y="366" text-anchor="end" font-size="10.5" fill="var(--faint)">200 mm</text>
        <text x="186" y="206" text-anchor="end" font-size="10.5" fill="var(--faint)">100 mm</text>
        <circle cx="152" cy="300" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="161" y1="300" x2="181" y2="300" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="140" y="304" text-anchor="end" font-size="10.5" fill="var(--ink)">2 kg/cm²</text>
      </svg>
      <figcaption>El agua entra por abajo por la sección ancha, se acelera en el cono y sale un metro más arriba desviada cuarenta y cinco grados. Está dibujado a escala, cotas y diámetros.</figcaption>
      </figure>
    pide: Las dos componentes y la resultante de la fuerza que el agua ejerce sobre el conjunto.
    pasos:
      - tipo: reconocer
        pregunta: |
          La presión en la salida, ¿cómo es respecto de los 2 kg/cm² de la
          entrada?
        opciones:
          - texto: 'Menor, y por dos motivos: el agua se ha acelerado y además ha subido un metro'
            correcta: true
            mensaje: |
              Eso es. La aceleración de 0,64 a 2,55 m/s cuesta 3,0 kPa y el
              metro de subida cuesta 9,8: en total 12,8 kPa menos. El
              desnivel pesa **tres veces más** que la aceleración, aunque el
              diámetro se reduzca a la mitad.
          - texto: Menor, solo por la aceleración del agua al estrecharse el conducto
            mensaje: |
              El plano es vertical y la salida está un metro más arriba: esa
              cota se paga con presión, y en este caso es el término
              dominante.
          - texto: Igual, porque no hay pérdidas de carga
            mensaje: |
              Sin pérdidas se conserva la **energía**, no la presión. Aquí la
              energía se reparte de otra forma: menos presión, más velocidad y
              más cota.

      - tipo: calcular
        titulo: La presión en la salida
        pregunta: |
          Presión manométrica en la sección 3, un metro por encima de la
          entrada.
        respuesta:
          tipo: magnitud
          valor: '183.2 kPa'
          tolerancia: 0.01
          formato: una presión con su unidad (kPa, Pa o kg/cm²)
        distractores:
          - valor: '193 kPa'
            mensaje: |
              Te has dejado la cota. La salida está un metro más arriba, y ese
              metro cuesta 9,8 kPa: aquí es el término mayor de los dos.
          - valor: '208.8 kPa'
            mensaje: |
              Has sumado la altura cinética en vez de restarla, o has puesto
              la cota con el signo cambiado. Subiendo y acelerando, la presión
              solo puede bajar.
        pista: |
          $p_3 = p_1 + \frac{\rho}{2}(V_1^{2} - V_3^{2}) + \gamma(z_1 - z_3)$.
        desarrollo: |
          $$
          V_1 = \frac{0{,}020}{0{,}031416} = 0{,}637\ \text{m/s} \qquad V_3 = \frac{0{,}020}{0{,}007854} = 2{,}546\ \text{m/s}
          $$

          $$
          p_3 = 196\,000 + 500\,(0{,}405 - 6{,}485) - 9800\cdot 1{,}0 = 183\,160\ \text{Pa}
          $$

          De los 12,8 kPa que se pierden, **9,8 son la cota** y solo 3,0 la
          aceleración.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          Componente horizontal de la fuerza que el agua ejerce sobre el
          conjunto.
        respuesta:
          tipo: magnitud
          valor: '1.05 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '1.49 kN'
            mensaje: |
              No has proyectado. Los 1489 N de la salida van a 45°, así que su
              componente horizontal es $1489\cos 45° = 1053$ N.
          - valor: '1.11 kN'
            mensaje: |
              Has usado una presión de salida demasiado alta, probablemente
              por dejarte el metro de cota en el Bernoulli.
        pista: |
          Solo la salida tiene componente horizontal: la entrada es vertical y
          el peso también.
        desarrollo: |
          En la salida, presión más cantidad de movimiento:

          $$
          p_3A_3 + \dot m V_3 = 1438{,}5 + 50{,}9 = 1489{,}4\ \text{N}
          $$

          y como el chorro sale a 45° hacia la izquierda, la reacción sobre la
          pieza tiene componente horizontal

          $$
          F_x = 1489{,}4\cdot\cos 45° = 1053\ \text{N} = 1{,}05\ \text{kN}
          $$

      - tipo: calcular
        titulo: La componente vertical
        pregunta: |
          Componente vertical de la fuerza, contando el peso del agua
          contenida en la pieza.
        respuesta:
          tipo: magnitud
          valor: '4.99 kN'
          tolerancia: 0.02
          formato: una fuerza con su unidad (kN o N)
        distractores:
          - valor: '5.12 kN'
            mensaje: |
              Te has dejado el peso del agua, que el enunciado pide contar
              expresamente: 13 litros son 128 N, un 2,5 % del total.
          - valor: '6.17 kN'
            mensaje: |
              Te has dejado la salida entera. Por la sección 3 se van 1489 N,
              de los que 1053 son verticales.
        pista: |
          $F_y = (p_1A_1 + \dot mV_1) - (p_3A_3 + \dot mV_3)\cos 45° - W$.
        desarrollo: |
          Por la entrada:

          $$
          p_1A_1 + \dot mV_1 = 6157{,}5 + 12{,}7 = 6170{,}3\ \text{N}
          $$

          El peso: el cono es un tronco de 0,5 m de altura entre radios de 100
          y 50 mm, o sea 9,16 litros, y el codo sube otro medio metro con
          100 mm, unos 3,93 litros más. En total **13,1 litros, 128 N**.

          $$
          F_y = 6170{,}3 - 1053 - 128 = 4989\ \text{N} = 4{,}99\ \text{kN}
          $$

          Y la resultante,
          $\sqrt{1053^{2} + 4989^{2}} = 5099$ N = **5,10 kN**, inclinada 78°
          respecto de la horizontal.

      - tipo: justificar
        pregunta: Ordena qué manda en esta fuerza. Una pieza es falsa.
        piezas:
          - texto: 'Por la entrada llegan 6170 N: 6158 de presión sobre los 314 cm² de la sección de 200 mm y solo 13 de cantidad de movimiento.'
          - texto: 'Por la salida se van 1489 N, de los que 1438 son presión: aunque la sección se ha reducido a la cuarta parte, la presión apenas ha bajado.'
          - texto: 'El peso del agua contenida, 128 N, resta en vertical y no aparece en horizontal.'
          - texto: 'La resultante son 5,10 kN, casi vertical: la pieza tira hacia arriba y un poco hacia la derecha.'
          - texto: Con un caudal tan pequeño, la cantidad de movimiento es lo que decide la fuerza.
            trampa: true
            mensaje: |
              Es al revés: con 20 l/s la cantidad de movimiento es de 13 N a la
              entrada y 51 a la salida, frente a los 6158 y 1438 de presión.
              **La presión manda por dos órdenes de magnitud.** Con un caudal
              grande y poca presión sería al contrario.
    resolucion: |
      ## Dos términos muy desiguales

      Antes de calcular nada conviene ver el orden de magnitud. Con 20 l/s en
      una tubería de 200 mm, la velocidad es de 0,64 m/s: prácticamente nada.
      Con 2 kg/cm² de presión, en cambio, sobre los 314 cm² de la sección
      salen 6158 N.

      | | presión | cantidad de movimiento |
      |---|---|---|
      | entrada | 6158 N | 13 N |
      | salida | 1438 N | 51 N |

      **La presión manda por dos órdenes de magnitud.** Este es un problema de
      empuje de presión con una corrección de cantidad de movimiento, no al
      revés.

      ## La presión de salida

      $$
      p_3 = p_1 + \frac{\rho}{2}(V_1^{2} - V_3^{2}) + \gamma(z_1 - z_3) = 196\,000 - 3040 - 9800 = 183{,}2\ \text{kPa}
      $$

      Y aquí hay otra sorpresa de la misma clase: de los 12,8 kPa que se
      pierden, **9,8 son el metro de subida** y solo 3,0 la aceleración. El
      cono reduce el diámetro a la mitad —la velocidad se multiplica por
      cuatro— y aun así pesa menos que un metro de altura.

      ## El peso, que el enunciado pide contar

      El cono está completamente determinado: un tronco de 0,5 m entre radios
      de 100 y 50 mm son 9,16 litros. Del codo el enunciado solo dice que sube
      otro medio metro con 100 mm de diámetro; tomándolo como un tramo de esa
      longitud salen 3,93 litros más.

      Con esos **13,1 litros —128 N—** se reproducen los tres resultados
      publicados a la vez, lo que es una buena señal de que la hipótesis es la
      que el boletín usó. Aun así conviene dejarla dicha: la geometría exacta
      del codo no está en el enunciado.

      ## El resultado

      $$
      F_x = 1{,}05\ \text{kN} \qquad F_y = 4{,}99\ \text{kN} \qquad |F| = 5{,}10\ \text{kN}
      $$

      La resultante va casi vertical, a 78° de la horizontal. Tiene sentido:
      la entrada, que es de donde viene casi toda la fuerza, es vertical, y lo
      que la desvía es una salida que se lleva solo la cuarta parte.

      Y el peso, esos 128 N, es el 2,5 % de la componente vertical. Un 2,5 %
      no cambia el dimensionamiento de un anclaje, pero el enunciado pide
      contarlo y hay que contarlo: la costumbre de despreciar el peso viene de
      los problemas en plano horizontal, donde efectivamente no entra.

  # ── COLECCIÓN 4.13. La reacción de un chorro contra la fuerza estática del
  #    tapón que lo tapaba: la comparación es el ejercicio entero.
  - id: ejflu14-col413-la-reaccion-del-chorro
    titulo: La reacción de un chorro comparada con lo que aguantaba el tapón
    fuente: >-
      Ejercicio 4.13 · Colección de Problemas, capítulo 4 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito cilíndrico de $5\ \text{m}$ de altura y $1\ \text{m}$ de
      diámetro está lleno de agua y tiene un orificio situado a $3\ \text{m}$
      de la superficie libre de la misma, siendo su diámetro de $3\ \text{cm}$
      y los coeficientes de gasto y velocidad $C_d = 0{,}60$ y
      $C_v = 0{,}98$. Se pide:

      a) Reacción que produce el chorro que fluye por el orificio.

      b) Relación entre la fuerza $F_a$ (calculada) y la fuerza $F_e$
      (estática) aplicada sobre un tapón que impide la salida del chorro.
    pide: La reacción del chorro y su relación con la fuerza estática del tapón.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos coeficientes, $C_d$ y $C_v$. ¿Para qué sirve cada uno?
        opciones:
          - texto: >-
              $C_v$ corrige la **velocidad** de salida y $C_d$ el **caudal**:
              la reacción necesita los dos, porque es $\rho\,Q\,v$
            correcta: true
            mensaje: |
              Exacto, y es lo que hace que este ejercicio no se pueda resolver
              con un solo coeficiente. El caudal sale con $C_d$ y la velocidad
              con $C_v$; multiplicarlos da la reacción.
          - texto: >-
              Son el mismo coeficiente con dos nombres, y basta usar uno
            mensaje: |
              Están relacionados —$C_d = C_v\,C_c$— pero no son el mismo. Aquí
              el de contracción implícito es $0{,}60/0{,}98 = 0{,}61$.
          - texto: >-
              $C_d$ es para el orificio y $C_v$ para el depósito
            mensaje: |
              Los dos son del orificio. Corrigen dos efectos distintos del
              mismo chorro: que la vena se estrecha y que el fluido pierde algo
              de velocidad al pasar.

      - tipo: calcular
        titulo: La reacción del chorro
        pregunta: |
          ¿Qué reacción produce el chorro?
        respuesta:
          tipo: magnitud
          valor: '24.44 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '40.74 n'
            mensaje: |
              Has usado el área geométrica del orificio para el caudal, sin el
              coeficiente de gasto. Solo el 60 % de esa sección lleva agua de
              verdad.
          - valor: '24.94 n'
            mensaje: |
              Ese es el resultado en **kilopondios** con la etiqueta de
              newtons — o casi: la reacción son $2{,}49\ \text{kp}$, que en
              newtons son $24{,}4$. Cuidado con el orden de magnitud.
        pista: |
          $F = \rho\,Q\,v$, con $Q = C_d A\sqrt{2gh}$ y $v = C_v\sqrt{2gh}$.
        desarrollo: |
          $$
          \sqrt{2gh} = \sqrt{19{,}6\cdot 3} = 7{,}668\ \text{m/s}
          $$
          $$
          v = 0{,}98\cdot 7{,}668 = 7{,}515\ \text{m/s}
          \qquad
          Q = 0{,}60\cdot 7{,}069\cdot 10^{-4}\cdot 7{,}668 = 3{,}252\ \text{l/s}
          $$
          $$
          F = \rho\,Q\,v = 1000\cdot 3{,}252\cdot 10^{-3}\cdot 7{,}515
          = 24{,}4\ \text{N} = 2{,}49\ \text{kp}
          $$

      - tipo: calcular
        titulo: La relación con la fuerza estática
        pregunta: |
          ¿Cuánto vale $F_a/F_e$?
        respuesta:
          tipo: numero
          valor: '1.176'
          tolerancia: 0.02
          formato: un número sin unidades
        distractores:
          - valor: '0.8503'
            mensaje: |
              Has dividido al revés. La reacción del chorro es **mayor** que la
              fuerza que aguantaba el tapón, y ese es el resultado que hace
              interesante el problema.
          - valor: '2'
            mensaje: |
              Ese sería el valor teórico ideal, con $C_d = C_v = 1$:
              $\rho Q v/(\gamma h A) = 2$. Los coeficientes reales lo bajan a
              1,18.
        pista: |
          La fuerza estática es $\gamma\,h\,A$ con el área **geométrica** del
          orificio.
        desarrollo: |
          $$
          F_e = \gamma\,h\,A = 9800\cdot 3\cdot 7{,}069\cdot 10^{-4}
          = 20{,}78\ \text{N}
          $$
          $$
          \frac{F_a}{F_e} = \frac{24{,}44}{20{,}78} = 1{,}176
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción del chorro es $\rho Q v$, y necesita los dos
              coeficientes: $C_d$ para el caudal y $C_v$ para la velocidad.
          - texto: >-
              Sale $24{,}4$ N, mientras que el tapón que impedía la salida
              soportaba solo $20{,}8$.
          - texto: >-
              Es decir, **al destapar el orificio el empuje aumenta** un 18 %,
              no disminuye.
          - texto: >-
              Con coeficientes perfectos la relación sería 1, porque la
              cantidad de movimiento que sale iguala a la fuerza que la
              generaba.
            trampa: true
            mensaje: |
              Con coeficientes perfectos la relación sería **2**, no 1:
              $\rho Q v = \rho A(2gh) = 2\gamma h A$. Es un resultado clásico y
              sorprendente, y los coeficientes reales solo lo bajan a 1,18.

    resolucion: |
      **La reacción.** Con los dos coeficientes en su sitio:

      $$
      v = C_v\sqrt{2gh} = 7{,}515\ \text{m/s}
      \qquad
      Q = C_d A\sqrt{2gh} = 3{,}25\ \text{l/s}
      $$
      $$
      F_a = \rho\,Q\,v = 24{,}4\ \text{N} = 2{,}49\ \text{kp}
      $$

      **La comparación**, que es lo que el enunciado busca:

      $$
      F_e = \gamma\,h\,A = 20{,}8\ \text{N}
      \qquad
      \frac{F_a}{F_e} = 1{,}18
      $$

      **Al quitar el tapón, el depósito empuja más, no menos.** Es
      contraintuitivo: parece que si el agua sale, la fuerza debería
      desaparecer. Lo que ocurre es que el tapón soportaba la presión
      hidrostática sobre su área, y el chorro en movimiento devuelve una
      reacción mayor.

      **El caso ideal lo explica.** Con $C_d = C_v = 1$,

      $$
      F = \rho\,Q\,v = \rho\,A\,v^{2} = \rho A\,(2gh) = 2\,\gamma h A = 2F_e
      $$

      **exactamente el doble**. Los coeficientes reales —que reducen el caudal
      un 40 % y la velocidad un 2 %— lo bajan a 1,18, pero el resultado
      cualitativo se mantiene: **el chorro empuja más que la presión estática
      que lo produce.**

      Es el mismo factor 2 que aparece en el álabe de 180° del tema 15, y por
      la misma razón: la cantidad de movimiento se cuenta dos veces, una en la
      velocidad y otra en el caudal, y las dos crecen con $\sqrt h$.