        <text x="204" y="144" text-anchor="middle" font-size="10" fill="var(--faint)">3 m</text>
        <line x1="90" y1="192" x2="90" y2="216" stroke="var(--faint)" stroke-width="1" marker-start="url(#m42n)" marker-end="url(#m42n)"/>
