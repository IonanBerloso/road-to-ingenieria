        <path d="M150,90 A30,30 0 0 0 128.8,98.8" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="158" y="94" font-size="11" fill="var(--faint)">45°</text>
        <line x1="224" y1="320" x2="304" y2="320" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="214" y1="220" x2="304" y2="220" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="154" y1="120" x2="344" y2="120" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
