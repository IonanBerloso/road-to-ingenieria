ejercicios:
  # ── El primero es NUESTRO (§08). El capítulo 2 de la colección arranca con un
  #    gato hidráulico que exige momentos antes que Pascal, y con un
  #    micromanómetro de dos líquidos: ninguno de los dos se puede leer sin
  #    haber recorrido antes un tubo en U sencillo.
  - id: ejflu4-recorrer-un-tubo-en-u
    titulo: Recorrer un tubo en U, tramo a tramo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito cerrado contiene agua. De su parte inferior sale un tubo que
      baja $0{,}4\ \text{m}$ hasta un manómetro en U con mercurio
      ($s = 13{,}6$), cuya otra rama está abierta a la atmósfera. El mercurio
      de la rama abierta está $15\ \text{cm}$ **más alto** que el de la rama
      del depósito.

      Calcular la presión manométrica del aire encerrado sobre el agua, en mca
      y en bar.

      Tomar $\gamma_{\text{agua}} = 9800\ \text{N/m}^{3}$.
    pide: La presión manométrica del aire, en metros de columna de agua y en bares.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se recorre desde la superficie libre del mercurio (atmósfera, presión
          cero manométrica) hasta el aire del depósito. ¿Con qué signos?
        opciones:
          - texto: >-
              Bajando por el mercurio se suma y subiendo por el agua se resta:
              $0 + 0{,}15\cdot13{,}6 - 0{,}4\cdot1 = p_{\text{aire}}/\gamma$
            correcta: true
            mensaje: |
              Eso es. Se camina desde donde se conoce la presión hasta donde no,
              sumando al bajar y restando al subir, y con la densidad relativa
              de cada tramo.
          - texto: >-
              Se suman los dos tramos, porque los dos están por debajo del
              depósito
            mensaje: |
              El signo no lo pone dónde esté el tramo, sino **hacia dónde se
              camina**: el de mercurio se recorre bajando (suma) y el de agua,
              subiendo hacia el depósito (resta).
          - texto: >-
              Se restan los dos, porque la presión del aire es menor que la
              atmosférica
            mensaje: |
              Eso sería suponer el resultado antes de calcularlo. Y aquí sale
              positiva: $2{,}04 - 0{,}4 = 1{,}64\ \text{mca}$.

      - tipo: calcular
        titulo: Lo que aportan los 15 cm de mercurio
        pregunta: |
          ¿A cuántos metros de columna de agua equivalen $15\ \text{cm}$ de
          mercurio?
        respuesta:
          tipo: magnitud
          valor: '2.04 mca'
          tolerancia: 0.01
          formato: una presión en columna de agua, con su unidad
        distractores:
          - valor: '0.15 mca'
            mensaje: |
              Son 15 cm **de mercurio**, y el mercurio pesa 13,6 veces más que
              el agua: $0{,}15 \cdot 13{,}6 = 2{,}04\ \text{mca}$.
          - valor: '0.011 mca'
            mensaje: |
              Has dividido entre 13,6 en vez de multiplicar. Para pasar de
              columna de un líquido pesado a columna de agua se **multiplica**
              por su densidad relativa.
        pista: |
          h(mca) = h(mcHg) × s(Hg), con s = 13,6.
        desarrollo: |
          $$
          0{,}15\ \text{mcHg} \cdot 13{,}6 = 2{,}04\ \text{mca}
          = 2{,}04 \cdot 9800 = 19\,992\ \text{Pa}
          $$

      - tipo: calcular
        titulo: La presión del aire
        pregunta: |
          Restando el tramo de agua, ¿cuál es la presión manométrica del aire?
        respuesta:
          tipo: magnitud
          valor: '1.64 mca'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '2.44 mca'
            mensaje: |
              Has sumado el tramo de agua en vez de restarlo. Desde el
              manómetro hasta el depósito se **sube**, y subiendo la presión
              baja.
          - valor: '2.04 mca'
            mensaje: |
              Ese es el aporte del mercurio solo. Falta descontar los
              $0{,}4\ \text{m}$ de agua que hay que subir hasta el depósito.
        pista: |
          2,04 mca del mercurio menos 0,4 m de agua (s = 1).
        desarrollo: |
          $$
          \frac{p_{\text{aire}}}{\gamma} = 0 + 0{,}15\cdot13{,}6 - 0{,}4\cdot1
          = 1{,}64\ \text{mca}
          $$
          $$
          p_{\text{aire}} = 1{,}64 \cdot 9800 = 16\,072\ \text{Pa} = 0{,}161\ \text{bar}
          $$

      - tipo: justificar
        pregunta: |
          Ordena el recorrido. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de la rama abierta: presión manométrica $0$.
          - texto: >-
              Bajando los $15\ \text{cm}$ de mercurio se suma
              $0{,}15\cdot13{,}6 = 2{,}04\ \text{mca}$.
          - texto: >-
              Subiendo los $0{,}4\ \text{m}$ de agua hasta el depósito se resta
              $0{,}4\ \text{mca}$.
          - texto: >-
              Resultado: $1{,}64\ \text{mca} = 0{,}161\ \text{bar}$ de presión
              manométrica del aire.
          - texto: >-
              La presión es la misma en todo el aire del depósito, porque en un
              gas la variación con la altura es despreciable.
          - texto: >-
              El tramo horizontal que une el depósito con el manómetro habría
              que sumarlo también si midiera varios metros.
            trampa: true
            mensaje: |
              Un tramo horizontal **nunca** aporta: la presión solo cambia con
              la diferencia de cota. Puede medir cien metros y da igual — algo
              que se usa constantemente en los esquemas de instalación, donde
              los tubos van y vienen.

    resolucion: |
      Se recorre desde la atmósfera hasta el aire del depósito, sumando al
      bajar y restando al subir, y con la densidad relativa de cada tramo:

      $$
      \frac{p_{\text{aire}}}{\gamma} = 0 + \underbrace{0{,}15\cdot13{,}6}_{\text{bajo por Hg}}
      - \underbrace{0{,}4\cdot1}_{\text{subo por agua}} = 1{,}64\ \text{mca}
      $$

      $$
      \boxed{p_{\text{aire}} = 1{,}64\ \text{mca} = 16\,072\ \text{Pa} = 0{,}161\ \text{bar}}
      $$

      > **Los tres hábitos que evitan casi todos los fallos de manometría.**
      > Uno: escribir el recorrido en **mca**, no en pascales, y multiplicar
      > por $9800$ solo al final. Dos: anotar el signo mirando si se sube o se
      > baja, no si el tramo «está arriba o abajo». Tres: cambiar la densidad
      > relativa al cambiar de fluido — el error más caro es arrastrar el
      > 13,6 a un tramo de agua.

  - id: ejflu4-col21-el-gato-hidraulico
    titulo: El gato hidráulico, que empieza por una palanca
    fuente: >-
      Ejercicio 2.1 · Colección de problemas de Mecánica de Fluidos, Estática
      de los fluidos y fuerzas sobre superficies · Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Un gato hidráulico tiene las dimensiones que se muestran en la figura
      adjunta. Si se ejerce una fuerza $F$ de $100\ \text{N}$ en la palanca
      del gato, se pide:

      a) Presión ejercida en $A_1$ expresada en bar.

      b) Carga $F_2$ que puede soportar el gato expresado en daN.

      <figure class="figura-examen">
      <svg viewBox="-24 26 470 208" role="img" width="440" height="195"
           aria-labelledby="fc21t fc21d">
        <title id="fc21t">El gato hidráulico, con su palanca y sus dos émbolos</title>
        <desc id="fc21d">Un gato hidráulico. Una palanca apoyada en el punto C
        recibe la fuerza F de cien newton en su extremo, a treinta y tres
        centímetros del apoyo, y empuja el émbolo pequeño, que está a solo tres
        centímetros del apoyo. El émbolo pequeño, de un centímetro y medio de
        diámetro, comprime el aceite del cilindro; ese aceite pasa al cilindro
        grande, de cinco centímetros de diámetro, cuyo émbolo levanta la carga
        F dos. La palanca multiplica la fuerza una vez y la diferencia de
        secciones la multiplica otra.</desc>

        <path d="M60 70 L212 70" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
        <path d="M198 62 L212 78 L184 78 Z" fill="var(--ink)" opacity=".8"/>
        <text x="216" y="80" font-size="11" fill="var(--ink)">C</text>

        <line x1="66" y1="42" x2="66" y2="62" stroke="var(--alt)" stroke-width="2.4"
              marker-end="url(#fc21f)"/>
        <text x="46" y="52" text-anchor="end" font-size="11" fill="var(--alt)">F = 100 N</text>

        <line x1="66" y1="94" x2="196" y2="94" stroke="var(--faint)" stroke-width="1"/>
        <line x1="66" y1="88" x2="66" y2="100" stroke="var(--faint)" stroke-width="1"/>
        <line x1="196" y1="88" x2="196" y2="100" stroke="var(--faint)" stroke-width="1"/>
        <text x="130" y="110" text-anchor="middle" font-size="10.5" fill="var(--faint)">33 cm</text>
        <line x1="164" y1="56" x2="196" y2="56" stroke="var(--faint)" stroke-width="1"/>
        <line x1="164" y1="50" x2="164" y2="62" stroke="var(--faint)" stroke-width="1"/>
        <text x="180" y="46" text-anchor="middle" font-size="10.5" fill="var(--faint)">3 cm</text>

        <rect x="152" y="70" width="24" height="46" fill="var(--ink)" opacity=".65"/>
        <rect x="146" y="116" width="36" height="54" fill="var(--alt)" fill-opacity=".22"
              stroke="var(--ink)" stroke-width="2"/>
        <text x="140" y="146" text-anchor="end" font-size="10.5" fill="var(--faint)">Ø₁ = 1,5 cm</text>

        <path d="M146 170 L146 200 L322 200 L322 150" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M182 170 L182 194 L316 194" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <rect x="150" y="172" width="170" height="26" fill="var(--alt)" fill-opacity=".22"/>
        <text x="240" y="216" text-anchor="middle" font-size="10.5" fill="var(--alt)">aceite</text>

        <rect x="278" y="98" width="88" height="52" fill="var(--alt)" fill-opacity=".22"
              stroke="var(--ink)" stroke-width="2"/>
        <rect x="272" y="86" width="100" height="14" fill="var(--ink)" opacity=".65"/>
        <text x="382" y="130" font-size="10.5" fill="var(--faint)">Ø₂ = 5 cm</text>

        <line x1="322" y1="72" x2="322" y2="52" stroke="var(--alt)" stroke-width="2.4"
              marker-end="url(#fc21f)"/>
        <text x="332" y="60" font-size="11" fill="var(--alt)">F₂</text>

        <defs>
          <marker id="fc21f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/>
          </marker>
        </defs>
      </svg>
      <figcaption>

      Hay **dos multiplicaciones seguidas** y conviene no mezclarlas: primero
      la palanca, que convierte 100 N en 33/3 veces más sobre el émbolo
      pequeño, y después Pascal, que reparte esa presión sobre una sección
      once veces mayor. El error típico es aplicar solo una de las dos.

      </figcaption>
      </figure>
    pide: La presión en el émbolo pequeño, en bares, y la carga que soporta el grande, en decanewtons.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de Pascal hay un paso que no es de fluidos. ¿Cuál?
        opciones:
          - texto: >-
              La palanca: tomando momentos respecto al apoyo $C$,
              $F\cdot0{,}33 = F_1\cdot0{,}03$, así que la fuerza que llega al
              émbolo es once veces mayor que la aplicada
            correcta: true
            mensaje: |
              Eso es. El gato multiplica dos veces: primero por la palanca
              ($\times 11$) y después por la relación de áreas ($\times 11{,}1$).
              El total pasa de $100\ \text{N}$ a más de una tonelada.
          - texto: >-
              Ninguno: la fuerza de $100\ \text{N}$ actúa directamente sobre
              $A_1$
            mensaje: |
              Entonces el dato de los $33$ y los $3\ \text{cm}$ sobraría, y en
              un enunciado no sobra nada. La palanca multiplica la fuerza por
              $33/3 = 11$ antes de que llegue al fluido.
          - texto: >-
              Calcular el área del émbolo grande
            mensaje: |
              Hace falta, pero para el apartado b). El primer paso es la
              palanca: sin ella no se sabe qué fuerza entra en el fluido.

      - tipo: calcular
        titulo: La presión en el émbolo pequeño
        pregunta: |
          Con $F_1 = 1100\ \text{N}$ sobre un émbolo de $1{,}5\ \text{cm}$ de
          diámetro, ¿qué presión hay?
        respuesta:
          tipo: magnitud
          valor: '62.2 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '5.66 bar'
            mensaje: |
              Has usado $100\ \text{N}$ en vez de los $1100\ \text{N}$ que
              produce la palanca. La relación de brazos es $33/3 = 11$.
          - valor: '15.6 bar'
            mensaje: |
              Has usado el diámetro donde va el radio: el área es
              $\pi D^{2}/4$, no $\pi D^{2}$. Con
              $A_1 = 1{,}767\cdot10^{-4}\ \text{m}^{2}$ salen 62,2 bar.
        pista: |
          F₁ = 100·0,33/0,03; A₁ = π·0,015²/4; y P = F₁/A₁.
        desarrollo: |
          $$
          F_1 = \frac{100 \cdot 0{,}33}{0{,}03} = 1100\ \text{N}
          \qquad
          A_1 = \frac{\pi \cdot 0{,}015^{2}}{4} = 1{,}767\cdot10^{-4}\ \text{m}^{2}
          $$
          $$
          P_1 = \frac{1100}{1{,}767\cdot10^{-4}} = 6\,224\,727\ \text{Pa} = 62{,}2\ \text{bar}
          $$

      - tipo: calcular
        titulo: La carga que soporta
        pregunta: |
          Por Pascal, $P_2 = P_1$. ¿Qué carga soporta el émbolo de
          $5\ \text{cm}$?
        respuesta:
          tipo: magnitud
          valor: '1222 daN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12222 daN'
            mensaje: |
              Ese es el valor en newtons ($12\,222\ \text{N}$). El enunciado
              pide decanewtons: $1\ \text{daN} = 10\ \text{N}$.
          - valor: '110 daN'
            mensaje: |
              Has multiplicado $F_1$ por la razón de diámetros
              ($5/1{,}5 = 3{,}33$) en vez de por la de áreas, que va al
              cuadrado: $(5/1{,}5)^{2} = 11{,}1$.
        pista: |
          F₂ = P₁·A₂, con A₂ = π·0,05²/4. Y el resultado, en daN.
        desarrollo: |
          $$
          A_2 = \frac{\pi\cdot0{,}05^{2}}{4} = 1{,}963\cdot10^{-3}\ \text{m}^{2}
          \qquad
          F_2 = 62{,}2\cdot10^{5} \cdot 1{,}963\cdot10^{-3} = 12\,222\ \text{N}
          $$
          $$
          F_2 = 1222{,}2\ \text{daN}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en la palanca: $F\cdot0{,}33 = F_1\cdot0{,}03$, luego
              $F_1 = 1100\ \text{N}$.
          - texto: >-
              $P_1 = F_1/A_1 = 62{,}2\ \text{bar}$, con
              $A_1 = \pi\varnothing_1^{2}/4$.
          - texto: >-
              Teorema de Pascal: la presión se transmite íntegra,
              $P_2 = P_1$.
          - texto: >-
              $F_2 = P_2 A_2 = 12\,222\ \text{N} = 1222{,}2\ \text{daN}$.
          - texto: >-
              Multiplicación total: $\times11$ por la palanca y $\times11{,}1$
              por las áreas, de $100\ \text{N}$ a más de doce mil.
          - texto: >-
              Como la fuerza se multiplica por 122, el gato entrega 122 veces
              más energía de la que recibe.
            trampa: true
            mensaje: |
              La energía no se multiplica: se conserva. El émbolo grande sube
              122 veces menos de lo que baja el pequeño ($A_1l_1 = A_2l_2$), y
              el producto fuerza por desplazamiento es el mismo. Un gato
              cambia la escala de la fuerza, no crea trabajo.

    resolucion: |
      **a) La presión.** Primero la palanca, que no es un problema de fluidos:

      $$
      \sum M_C = 0:\quad F\cdot0{,}33 = F_1\cdot0{,}03
      \quad\Rightarrow\quad F_1 = 1100\ \text{N}
      $$

      $$
      \boxed{P_1 = \frac{F_1}{A_1} = \frac{1100}{\pi\cdot0{,}015^{2}/4}
      = 6{,}22\cdot10^{6}\ \text{Pa} = 62{,}2\ \text{bar}}
      $$

      **b) La carga.** Por Pascal, $P_2 = P_1$:

      $$
      \boxed{F_2 = P_2\,A_2 = 62{,}2\cdot10^{5}\cdot\frac{\pi\cdot0{,}05^{2}}{4}
      = 12\,222\ \text{N} = 1222{,}2\ \text{daN}}
      $$

      > **Dos multiplicaciones seguidas, y una trampa de unidades.** La
      > palanca multiplica por $11$ y las áreas por $11{,}1$: entre las dos,
      > una fuerza de mano levanta más de una tonelada. La trampa está en el
      > enunciado, que pide bares en un apartado y **decanewtons** en el otro:
      > dos unidades que no son del SI y que hay que convertir al final.

  - id: ejflu4-col23-seis-unidades-de-presion
    titulo: Un depósito con tres manómetros, y seis unidades de presión
    fuente: >-
      Ejercicio 2.3 · Colección de problemas de Mecánica de Fluidos, Estática
      de los fluidos y fuerzas sobre superficies · Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Basándose en la figura adjunta, calcular:

      a) Presión que marca el mano-vacuómetro 1 (kg/cm²).

      b) Presión absoluta del aire B (bar).

      c) Presión que marca el manómetro 2 (kPa).

      d) Si $h = 0{,}75\ \text{m}$, calcular la presión de vapor del mercurio
      encerrado en la parte superior del barómetro de Hg (baria).

      <figure class="figura-examen">
      <svg viewBox="-54 30 570 250" role="img" width="440" height="193"
           aria-labelledby="fc23t fc23d">
        <title id="fc23t">El depósito dentro del depósito, con sus tres aparatos y el barómetro de mercurio</title>
        <desc id="fc23d">Un depósito exterior abierto a la atmósfera contiene
        agua, y sobre ella una cámara de aire llamada B. Dentro de él, sumergido,
        hay un segundo depósito cerrado que contiene aire, llamado A, encima de
        un baño de mercurio; en ese mercurio se apoya un barómetro de altura h.
        Hay tres aparatos: el manómetro 3, en la tapa del depósito interior,
        que mide manométricas; el manómetro 2, conectado al agua del depósito
        exterior, que mide absolutas; y el mano-vacuómetro 1, arriba a la
        derecha, conectado a la cámara B mediante un tubo que baja medio metro
        y después una columna de un metro ochenta de un líquido de densidad
        relativa tres y medio.</desc>

        <rect x="60" y="140" width="240" height="90" fill="var(--live)" fill-opacity=".18"/>
        <path d="M60 70 L60 230 L300 230 L300 70" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="60" y1="140" x2="300" y2="140" stroke="var(--live)" stroke-width="1.4"/>
        <text x="80" y="106" font-size="10.5" fill="var(--faint)">Aire (B)</text>
        <text x="80" y="222" font-size="10.5" fill="var(--live)">s = 1</text>
        <text x="180" y="60" text-anchor="middle" font-size="10" fill="var(--faint)">presión exterior</text>

        <rect x="120" y="180" width="130" height="40" fill="var(--flag)" fill-opacity=".25"/>
        <rect x="120" y="100" width="130" height="120" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="140" y="126" font-size="10.5" fill="var(--faint)">Aire (A)</text>
        <text x="212" y="206" font-size="10" fill="var(--flag)">s = 13,6</text>

        <path d="M178 200 L178 118 L188 118 L188 200" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M183 198 L183 124" stroke="var(--flag)" stroke-width="6" opacity=".5"/>
        <line x1="200" y1="124" x2="200" y2="180" stroke="var(--faint)" stroke-width="1"/>
        <line x1="194" y1="124" x2="206" y2="124" stroke="var(--faint)" stroke-width="1"/>
        <line x1="194" y1="180" x2="206" y2="180" stroke="var(--faint)" stroke-width="1"/>
        <text x="210" y="156" font-size="10.5" fill="var(--faint)">h</text>

        <circle cx="150" cy="88" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M150 97 L150 100 M150 88 L155 83" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="164" y="86" font-size="10" fill="var(--ink)">manómetro 3</text>

        <circle cx="42" cy="180" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M51 180 L60 180 M42 180 L47 175" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="30" y="200" text-anchor="end" font-size="10" fill="var(--ink)">manómetro 2</text>

        <path d="M300 140 L330 140 L330 108 L352 108 L352 244 L392 244 L392 96"
              fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M352 190 L352 240 Q352 244 356 244 L388 244 Q392 244 392 240 L392 152"
              fill="none" stroke="var(--alt)" stroke-width="5" opacity=".45"/>
        <text x="400" y="256" font-size="10" fill="var(--alt)">s = 3,5</text>

        <circle cx="392" cy="80" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M392 89 L392 96 M392 80 L397 75" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="406" y="78" font-size="10" fill="var(--ink)">mano-vacuómetro 1</text>

        <line x1="424" y1="140" x2="424" y2="152" stroke="var(--faint)" stroke-width="1"/>
        <line x1="418" y1="140" x2="430" y2="140" stroke="var(--faint)" stroke-width="1"/>
        <line x1="418" y1="152" x2="430" y2="152" stroke="var(--faint)" stroke-width="1"/>
        <text x="434" y="150" font-size="10" fill="var(--faint)">0,5 m</text>
        <line x1="424" y1="152" x2="424" y2="190" stroke="var(--alt)" stroke-width="1"/>
        <line x1="418" y1="190" x2="430" y2="190" stroke="var(--alt)" stroke-width="1"/>
        <text x="434" y="176" font-size="10" fill="var(--alt)">1,8 m</text>
      </svg>
      <figcaption>

      Hay **un depósito dentro de otro**, y cada aparato mide contra algo
      distinto: el 3 contra el aire B que lo rodea, el 2 en absolutas, y el
      mano-vacuómetro 1 contra la atmósfera del final del tubo. Ordenar quién
      mide contra quién es la mitad del ejercicio; la otra mitad son las seis
      unidades.

      </figcaption>
      </figure>

      Datos: el mano-vacuómetro 1 mide presiones manométricas; el manómetro 2
      mide presiones absolutas; el manómetro 3 mide manométricas; presión de
      la atmósfera exterior $= 750\ \text{Torr}$; presión del manómetro
      $3 = 7\ \text{mca}$. Del mano-vacuómetro 1 baja un tramo de
      $0{,}5\ \text{m}$ y otro de $1{,}8\ \text{m}$ de un líquido de
      $s = 3{,}5$.
    pide: Las cuatro presiones, cada una en la unidad que pide su apartado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) da negativo. ¿Qué significa eso, y es un error?
        opciones:
          - texto: >-
              No es un error: es un **vacío**. El aparato es un
              mano-vacuómetro y mide manométricas, así que puede marcar por
              debajo de la atmosférica
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado lo llama mano-vacuómetro y no
              manómetro. En absoluta ese mismo punto vale $3{,}4\ \text{mca}$,
              que es positivo: lo que no existe es una presión absoluta
              negativa.
          - texto: >-
              Es un error de signo al recorrer el manómetro
            mensaje: |
              El recorrido está bien: desde el aparato se **baja**
              $0{,}5\ \text{m}$ y luego $1{,}8\ \text{m}$ de un líquido de
              $s = 3{,}5$ hasta la atmósfera, así que
              $p_1/\gamma = -0{,}5-1{,}8\cdot3{,}5$. El negativo es físico.
          - texto: >-
              Significa que el depósito está vacío
            mensaje: |
              «Vacío» aquí no quiere decir sin fluido: quiere decir a menos
              presión que la atmosférica. El depósito tiene aire, pero
              enrarecido.

      - tipo: calcular
        titulo: El mano-vacuómetro 1
        pregunta: |
          ¿Qué marca, en kg/cm²?
        respuesta:
          tipo: magnitud
          valor: '-0.68 kg/cm2'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.68 kg/cm2'
            mensaje: |
              El signo es parte de la respuesta: el aparato marca **vacío**.
              Al recorrer se baja, y bajando desde el punto hacia la
              atmósfera hay que restar.
          - valor: '-6.8 kg/cm2'
            mensaje: |
              Son $-6{,}8$ **mca**, y $1\ \text{kg/cm}^{2} = 10\ \text{mca}$:
              $-0{,}68\ \text{kg/cm}^{2}$.
        pista: |
          p₁/γ = −0,5 − 1,8·3,5 en mca, y después 1 kg/cm² = 10 mca.
        desarrollo: |
          $$
          \frac{p_1}{\gamma} + 0{,}5 + 1{,}8\cdot3{,}5 = 0
          \quad\Rightarrow\quad
          \frac{p_1}{\gamma} = -6{,}8\ \text{mca} = -0{,}68\ \text{kg/cm}^{2}
          $$

      - tipo: calcular
        titulo: La presión absoluta del aire B
        pregunta: |
          Con la atmosférica de $750\ \text{Torr}$, ¿cuál es la presión
          absoluta de B en bar?
        respuesta:
          tipo: magnitud
          valor: '0.3332 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1.0332 bar'
            mensaje: |
              Has sumado la atmosférica sin restar el vacío: la manométrica es
              **negativa**, $-6{,}8\ \text{mca}$. Absoluta
              $= 10{,}2-6{,}8 = 3{,}4\ \text{mca}$.
          - valor: '1.6664 bar'
            mensaje: |
              Has sumado los $6{,}8$ en vez de restarlos.
              $10{,}2 + (-6{,}8) = 3{,}4\ \text{mca} = 0{,}3332\ \text{bar}$.
        pista: |
          750 Torr = 0,75·13,6 = 10,2 mca. Y p_abs = p_atm + p_man.
        desarrollo: |
          $$
          p_{\text{atm}} = 750\ \text{Torr} = 0{,}75\cdot13{,}6 = 10{,}2\ \text{mca}
          $$
          $$
          p_B^{\text{abs}} = 10{,}2 + (-6{,}8) = 3{,}4\ \text{mca}
          = 3{,}4\cdot\frac{9800}{10^{5}} = 0{,}3332\ \text{bar}
          $$

      - tipo: calcular
        titulo: El manómetro 2
        pregunta: |
          El manómetro 2 mide absolutas y está bajo el aire A, con el
          manómetro 3 marcando $7\ \text{mca}$ manométricos respecto de B.
          ¿Cuánto marca, en kPa?
        respuesta:
          tipo: magnitud
          valor: '101.92 kPa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '68.6 kPa'
            mensaje: |
              Son los $7\ \text{mca}$ del manómetro 3 solos. Como el 2 mide
              **absolutas**, hay que sumarle la presión absoluta de B:
              $7 + 3{,}4 = 10{,}4\ \text{mca}$.
          - valor: '35.28 kPa'
            mensaje: |
              Has restado en vez de sumar: $7 + 3{,}4 = 10{,}4\ \text{mca}$,
              que son $101{,}92\ \text{kPa}$.
        pista: |
          p₂ = p₃(man) + p_B(abs) = 7 + 3,4 mca, y después a kPa.
        desarrollo: |
          $$
          p_2^{\text{abs}} = p_3^{\text{man}} + p_B^{\text{abs}}
          = 7 + 3{,}4 = 10{,}4\ \text{mca}
          = 10{,}4\cdot\frac{9800}{10^{3}} = 101{,}92\ \text{kPa}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución, incluido el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              a) $p_1/\gamma = -0{,}5-1{,}8\cdot3{,}5 = -6{,}8\ \text{mca}
              = -0{,}68\ \text{kg/cm}^{2}$.
          - texto: >-
              b) $p_{\text{atm}} = 750\ \text{Torr} = 10{,}2\ \text{mca}$, y
              $p_B^{\text{abs}} = 10{,}2-6{,}8 = 3{,}4\ \text{mca} = 0{,}3332\ \text{bar}$.
          - texto: >-
              c) $p_2^{\text{abs}} = 7+3{,}4 = 10{,}4\ \text{mca} = 101{,}92\ \text{kPa}$.
          - texto: >-
              d) En el barómetro: $p_A^{\text{abs}} - h\cdot13{,}6 = p_v(\text{Hg})$,
              o sea $10{,}4 - 0{,}75\cdot13{,}6 = 0{,}2\ \text{mca}$.
          - texto: >-
              d) $0{,}2\ \text{mca} = 1960\ \text{Pa} = 19\,600\ \text{baria}$,
              porque $1\ \text{baria} = 0{,}1\ \text{Pa}$.
          - texto: >-
              d) La presión de vapor sale positiva, y podría haber salido
              negativa si la columna de mercurio fuera más alta: significaría
              que el vacío es mejor.
            trampa: true
            mensaje: |
              Una presión **absoluta** nunca es negativa, y la de vapor lo es
              por definición. Si la cuenta diera negativa, el dato sería
              imposible: la columna de mercurio no puede superar la altura que
              la presión absoluta del depósito es capaz de sostener.

    resolucion: |
      **a)** Recorriendo desde el aparato hasta la atmósfera:

      $$
      \boxed{\frac{p_1}{\gamma} = -0{,}5-1{,}8\cdot3{,}5 = -6{,}8\ \text{mca}
      = -0{,}68\ \text{kg/cm}^{2}}
      $$

      **b)** Con $p_{\text{atm}} = 750\ \text{Torr} = 10{,}2\ \text{mca}$:

      $$
      \boxed{p_B^{\text{abs}} = 10{,}2-6{,}8 = 3{,}4\ \text{mca} = 0{,}3332\ \text{bar}}
      $$

      **c)** El manómetro 2 mide absolutas:

      $$
      \boxed{p_2^{\text{abs}} = 7+3{,}4 = 10{,}4\ \text{mca} = 101{,}92\ \text{kPa}}
      $$

      **d)** En la cámara del barómetro:

      $$
      p_v(\text{Hg}) = 10{,}4 - 0{,}75\cdot13{,}6 = 0{,}2\ \text{mca}
      = 1960\ \text{Pa}
      \quad\Rightarrow\quad
      \boxed{19\,600\ \text{baria}}
      $$

      > **Seis unidades de presión en cuatro apartados**: kg/cm², bar, kPa,
      > baria, Torr y mca. No es capricho del enunciado: es exactamente lo
      > que hace este ejercicio, comprobar que sabes moverte entre ellas. La
      > estrategia que lo hace fácil es **trabajar entero en mca** y convertir
      > solo al escribir cada respuesta.

  # ── COLECCIÓN 2.7. El más corto del capítulo, y sirve de calentamiento:
  #    pasar una presión a altura de columna de un fluido que no es agua, y
  #    sumar la atmosférica.
  - id: ejflu4-col27-la-columna-de-keroseno
    titulo: Cuántos metros de keroseno son dos mil pascales
    fuente: >-
      Ejercicio 2.7 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El keroseno tiene una densidad relativa de $0{,}81$. ¿Qué altura de
      columna de keroseno equivale a una presión de $2000\ \text{Pa}$? Si la
      presión atmosférica es de $750\ \text{mm}$ de Hg, calcular la presión
      absoluta en bar.
    pide: La altura de columna de keroseno y la presión absoluta en bar.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la misma presión da alturas distintas según el líquido?
        opciones:
          - texto: >-
              Porque lo que pesa es la columna, y un líquido más ligero
              necesita más altura para pesar lo mismo
            correcta: true
            mensaje: |
              Eso es. $p = \gamma h$: con $\gamma$ menor hace falta $h$ mayor.
              El keroseno es un 19 % más ligero que el agua, así que su columna
              es un 23 % más alta para la misma presión.
          - texto: >-
              Porque cada líquido transmite la presión de forma distinta
            mensaje: |
              Todos los líquidos transmiten la presión igual —eso es Pascal—.
              Lo que cambia es cuánto pesa cada metro de columna, y eso lo
              decide el peso específico.
          - texto: >-
              Porque la presión atmosférica actúa distinto sobre cada uno
            mensaje: |
              La atmosférica actúa igual sobre todos y por eso se cancela al
              trabajar en presiones manométricas. La diferencia está en el
              peso propio de la columna.

      - tipo: calcular
        titulo: La altura de columna
        pregunta: |
          ¿Qué altura de keroseno equivale a $2000\ \text{Pa}$?
        respuesta:
          tipo: magnitud
          valor: '0.2519 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.2041 m'
            mensaje: |
              Has usado el peso específico del agua. El keroseno tiene
              $\gamma = 0{,}81\cdot 9800 = 7938\ \text{N/m}^{3}$, y al ser más
              ligero la columna sale **más alta**, no más baja.
          - valor: '0.1653 m'
            mensaje: |
              Has multiplicado por la densidad relativa en vez de dividir.
              Comprueba el sentido: cuanto más ligero el líquido, más columna
              hace falta.
        pista: |
          $h = p/\gamma$, con $\gamma = s\cdot 9800$.
        desarrollo: |
          $$
          h = \frac{p}{\gamma} = \frac{2000}{0{,}81\cdot 9800}
          = \frac{2000}{7938} = 0{,}252\ \text{m de columna de keroseno}
          $$

      - tipo: calcular
        titulo: La presión absoluta
        pregunta: |
          ¿Cuál es la presión absoluta, en bar?
        respuesta:
          tipo: magnitud
          valor: '1.019 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.02 bar'
            mensaje: |
              Esa es solo la manométrica, los 2000 Pa. La absoluta es la
              manométrica **más** la atmosférica, que aquí son casi un bar
              entero.
          - valor: '0.9792 bar'
            mensaje: |
              Has restado la manométrica en vez de sumarla. Los 2000 Pa son
              una sobrepresión sobre la atmosférica, no un vacío.
        pista: |
          $750\ \text{mmHg}$ pasados a pascales, más los 2000 Pa.
        desarrollo: |
          $$
          p_{\text{atm}} = 750\ \text{mmHg} = 750\cdot 133{,}2\ \text{Pa}
          = 99\,924\ \text{Pa}
          $$
          $$
          p_{\text{abs}} = 99\,924 + 2000 = 101\,924\ \text{Pa} = 1{,}019\ \text{bar}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La altura de columna equivalente sale de $p = \gamma h$, con el
              peso específico del líquido de que se trate.
          - texto: >-
              Con keroseno, $\gamma = 7938\ \text{N/m}^{3}$ y
              $h = 0{,}252\ \text{m}$: más que si fuera agua, porque pesa
              menos.
          - texto: >-
              La absoluta se obtiene sumando la atmosférica, 99.924 Pa, y da
              1,019 bar.
          - texto: >-
              Como el keroseno es más ligero, su presión absoluta también es
              menor que la que daría el agua.
            trampa: true
            mensaje: |
              La presión es la misma —2000 Pa manométricos— la produzca el
              líquido que la produzca; lo único que cambia es **cuántos metros
              de columna** hacen falta. La absoluta sale igual con cualquier
              fluido: 1,019 bar.

    resolucion: |
      **Dos preguntas de una línea cada una, y las dos son de definición.**

      $$
      h = \frac{p}{\gamma} = \frac{2000}{0{,}81\cdot 9800} = 0{,}252\ \text{mck}
      $$
      $$
      p_{\text{abs}} = 750\ \text{mmHg} + 2000\ \text{Pa}
      = 99\,924 + 2000 = 1{,}019\ \text{bar}
      $$

      **La notación «mck» no es un capricho.** Los metros de columna solo
      significan algo si se dice de qué líquido: 0,252 metros de columna de
      **keroseno** son 2000 Pa, pero 0,252 metros de columna de agua serían
      2470. Por eso los enunciados de esta asignatura escriben siempre mca,
      mcl o mck, y merece la pena copiar esa costumbre.

      **Y una comprobación rápida**: la atmosférica ronda siempre 1 bar, así
      que una presión absoluta que salga muy lejos de ese valor con solo 2 kPa
      de manométrica indica que algo se ha sumado mal.

  # ── COLECCIÓN 2.11. Un problema de tres líneas con una idea que no se
  #    olvida: el indicador no mide nivel, mide presión en el fondo.
  - id: ejflu4-col211-el-indicador-de-gasolina
    titulo: El indicador de gasolina que miente porque hay agua en el fondo
    fuente: >-
      Ejercicio 2.11 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El indicador de gasolina ($s = 0{,}68$) de un coche marca
      proporcionalmente a la presión manométrica del fondo del depósito. Si el
      depósito tiene $30\ \text{cm}$ de altura y contiene accidentalmente
      $3\ \text{cm}$ de agua, se pide:

      a) Altura de aire que habrá en la parte superior del depósito cuando el
      indicador señale erróneamente que se encuentra lleno.
    pide: La altura de aire que quedará cuando el indicador marque «lleno».

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué presión corresponde a la marca de «lleno»?
        opciones:
          - texto: >-
              La de $30\ \text{cm}$ de gasolina, porque es lo que habría en el
              fondo con el depósito lleno y sin agua
            correcta: true
            mensaje: |
              Exacto. El indicador se taró con gasolina, así que su marca de
              «lleno» corresponde a $0{,}30\cdot 0{,}68 = 0{,}204$ mca. Con
              agua dentro, esa presión se alcanza antes.
          - texto: >-
              La de $30\ \text{cm}$ de agua
            mensaje: |
              El indicador está calibrado para el líquido que el depósito debe
              contener, que es gasolina. Con agua saldría 0,30 mca, casi un
              50 % más.
          - texto: >-
              La de $30\ \text{cm}$ menos los $3\ \text{cm}$ de agua
            mensaje: |
              La marca de «lleno» es un valor **fijo** del indicador: se
              estableció al fabricarlo y no sabe que hay agua. Lo que cambia
              con el agua es cuánto líquido hace falta para alcanzarla.

      - tipo: calcular
        titulo: La altura de aire
        pregunta: |
          ¿Cuánto aire quedará arriba cuando el indicador marque «lleno»?
        respuesta:
          tipo: magnitud
          valor: '1.41 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '3 cm'
            mensaje: |
              Has supuesto que el agua desplaza su propia altura de gasolina.
              No es así: el agua pesa más, así que 3 cm de agua «valen» más de
              3 cm de gasolina y el hueco que queda es menor.
          - valor: '4.41 cm'
            mensaje: |
              Parece que has sumado los 3 cm de agua al hueco en vez de
              contarlos como líquido. El agua ocupa depósito: la altura total
              llena es agua más gasolina.
        pista: |
          Iguala la presión del fondo con agua y gasolina a la presión de
          «lleno», $0{,}30\cdot 0{,}68$ mca.
        desarrollo: |
          Presión de la marca «lleno», en mca:

          $$
          p_{\text{lleno}} = 0{,}30\cdot 0{,}68 = 0{,}204\ \text{mca}
          $$

          Con $3\ \text{cm}$ de agua y $h$ de gasolina encima:

          $$
          0{,}03\cdot 1 + h\cdot 0{,}68 = 0{,}204
          \;\Longrightarrow\;
          h = 0{,}2559\ \text{m} = 25{,}59\ \text{cm}
          $$
          $$
          \text{aire} = 30 - 3 - 25{,}59 = 1{,}41\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El indicador no mide nivel: mide la presión del fondo, y su marca
              de «lleno» equivale a 30 cm de gasolina, es decir 0,204 mca.
          - texto: >-
              Con 3 cm de agua debajo, esa presión se alcanza con solo 25,59 cm
              de gasolina encima.
          - texto: >-
              Total de líquido, 28,59 cm, y por tanto 1,41 cm de aire: el
              indicador marca lleno con el depósito sin llenar.
          - texto: >-
              El error del indicador sería el mismo si en vez de agua hubiera
              entrado un líquido más ligero que la gasolina.
            trampa: true
            mensaje: |
              Con un líquido **más ligero** el error iría al revés: haría falta
              más columna para alcanzar la presión de «lleno», así que el
              indicador marcaría de menos y el depósito rebosaría antes de
              señalar lleno. El sentido del error lo pone el signo de la
              diferencia de densidades.

    resolucion: |
      **La frase que hay que leer despacio** es «marca proporcionalmente a la
      presión manométrica del fondo». No mide nivel: mide presión. Y como se
      taró con gasolina, su marca de «lleno» equivale a

      $$
      p_{\text{lleno}} = \gamma_g\cdot 0{,}30 = 0{,}204\ \text{mca}
      $$

      **Con agua debajo, esa presión llega antes**, porque el agua pesa un 47 %
      más que la gasolina:

      $$
      0{,}03 + 0{,}68\,h = 0{,}204
      \;\Longrightarrow\;
      h = 25{,}59\ \text{cm}
      \;\Longrightarrow\;
      \text{aire} = 1{,}41\ \text{cm}
      $$

      **El resultado, leído como ingeniería:** tres centímetros de agua en el
      fondo hacen que el depósito marque lleno estando un 4,7 % vacío. No
      parece mucho, pero es un error **sistemático y silencioso**: el conductor
      creerá siempre que lleva más combustible del que lleva, y el sensor no
      tiene forma de avisar.

      Es el mismo principio de todos los medidores de nivel por presión, que
      son los más baratos y los más usados: funcionan perfectamente **mientras
      el líquido sea el que se supone**.

  # ── COLECCIÓN 2.15. Manómetro dentro de un depósito presurizado: la cadena
  #    de referencias de presión, que es lo que el tema 4 quiere enseñar.
  - id: ejflu4-col215-el-manometro-dentro-del-deposito
    titulo: Un manómetro dentro de otro depósito, y contra qué mide cada uno
    fuente: >-
      Ejercicio 2.15 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      La lectura del manómetro A colocado en el interior de un depósito
      presurizado es de $0{,}9\ \text{kg/cm}^{2}$. Otro manómetro B, colocado
      en el exterior del depósito presurizado y conectado con él, marca
      $1{,}4\ \text{kg/cm}^{2}$, y un barómetro aneroide señala
      $750\ \text{torr}$. Se pide:

      a) Presión absoluta del depósito interior en torr.

      b) Ídem en kPa.
    pide: La presión absoluta del depósito interior, en torr y en kPa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Contra qué mide cada manómetro?
        opciones:
          - texto: >-
              A mide contra el aire del depósito que lo rodea; B, contra la
              atmósfera. Por eso hay que encadenar las tres lecturas
            correcta: true
            mensaje: |
              Ese es el ejercicio entero. **Un manómetro mide siempre contra el
              ambiente en el que está**, y el de A está dentro de un depósito
              presurizado, no en la atmósfera.
          - texto: >-
              Los dos miden contra la atmósfera, así que la presión interior es
              directamente $0{,}9\ \text{kg/cm}^{2}$ absolutos
            mensaje: |
              Si A midiera contra la atmósfera, el enunciado no necesitaría
              decir que está «colocado en el interior». Esa frase es el dato
              clave: su cero es la presión del depósito exterior.
          - texto: >-
              A mide absoluta y B manométrica, porque A está dentro
            mensaje: |
              Estar dentro no convierte un manómetro en absoluto. Un manómetro
              mide siempre diferencias respecto de lo que tiene alrededor; el
              que mide contra el vacío es el barómetro o un sensor absoluto.

      - tipo: calcular
        titulo: La presión absoluta en kilopascales
        pregunta: |
          ¿Cuál es la presión absoluta del depósito interior, en kPa?
        respuesta:
          tipo: magnitud
          valor: '325.3 kpa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '188.1 kpa'
            mensaje: |
              Solo has sumado la lectura de A a la atmosférica. Falta la de B:
              el depósito exterior está a $1{,}4\ \text{kg/cm}^{2}$ sobre la
              atmósfera, y A mide **sobre eso**.
          - valor: '225.4 kpa'
            mensaje: |
              Has sumado las dos lecturas pero has olvidado la atmosférica. La
              pregunta pide presión **absoluta**, así que hay que añadir los
              750 torr del barómetro.
        pista: |
          Encadena: absoluta interior = A + B + atmosférica, todo en la misma
          unidad.
        desarrollo: |
          $$
          p_{\text{abs}} = \underbrace{0{,}9}_{A} + \underbrace{1{,}4}_{B}
          = 2{,}3\ \frac{\text{kg}}{\text{cm}^{2}} = 225\,400\ \text{Pa}
          \quad\text{(manométrica)}
          $$
          $$
          p_{\text{atm}} = 750\ \text{torr} = 99\,924\ \text{Pa}
          $$
          $$
          p_{\text{abs}} = 225\,400 + 99\,924 = 325\,324\ \text{Pa}
          = 325{,}3\ \text{kPa}
          $$

      - tipo: calcular
        titulo: Y en torr
        pregunta: |
          ¿Cuánto es eso en torr?
        respuesta:
          tipo: magnitud
          valor: '2442 torr'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '1692 torr'
            mensaje: |
              Te has dejado la atmosférica al convertir: has pasado solo la
              parte manométrica. La absoluta incluye los 750 torr.
          - valor: '325.3 torr'
            mensaje: |
              Ese es el número en kilopascales con la etiqueta cambiada. Un
              torr son $133{,}2\ \text{Pa}$, así que el número en torr es unas
              siete veces y media el de kPa.
        pista: |
          $1\ \text{torr} = 133{,}2\ \text{Pa}$.
        desarrollo: |
          $$
          \frac{325\,324}{133{,}2} = 2442\ \text{torr}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un manómetro mide contra el ambiente que lo rodea, y el A está
              dentro de un depósito presurizado.
          - texto: >-
              Por tanto la manométrica del depósito interior respecto de la
              atmósfera es la suma de las dos lecturas, $2{,}3\
              \text{kg/cm}^{2}$.
          - texto: >-
              Sumando el barómetro sale $325{,}3$ kPa absolutos, que son
              2442 torr.
          - texto: >-
              Si el barómetro marcase menos —por ejemplo en un día de borrasca—
              la presión absoluta del depósito interior no cambiaría.
            trampa: true
            mensaje: |
              Cambiaría: la absoluta es la suma de las manométricas **más la
              atmosférica**, así que con menos atmosférica sale menos absoluta.
              Lo que no cambiaría son las lecturas de los manómetros, que miden
              diferencias.

    resolucion: |
      **Una sola idea, encadenada dos veces.** Un manómetro mide contra lo que
      tiene alrededor:

      $$
      p_{\text{interior}} = \underbrace{p_A}_{\text{sobre el depósito exterior}}
      + \underbrace{p_B}_{\text{sobre la atmósfera}}
      + \underbrace{p_{\text{atm}}}_{\text{sobre el vacío}}
      $$
      $$
      = 0{,}9 + 1{,}4\ \frac{\text{kg}}{\text{cm}^{2}} + 750\ \text{torr}
      = 225{,}4 + 99{,}9 = 325{,}3\ \text{kPa} = 2442\ \text{torr}
      $$

      **La frase que decide el ejercicio** es «colocado en el interior». Sin
      ella, A mediría contra la atmósfera y la respuesta sería otra. Es un
      recordatorio de que en los enunciados de presión **la posición del
      instrumento es un dato**, no una descripción.

      Y la escalera de referencias que este problema construye —vacío,
      atmósfera, depósito exterior, depósito interior— es exactamente la que
      hay que tener en la cabeza cada vez que aparezca la palabra «absoluta».

  # ── COLECCIÓN 2.18. El barómetro con aire dentro. Mezcla hidrostática con
  #    la ley de Boyle y es el más elegante del capítulo.
  - id: ejflu4-col218-el-barometro-defectuoso
    titulo: Un barómetro con aire dentro, y cómo se corrige
    fuente: >-
      Ejercicio 2.18 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un barómetro defectuoso por la presencia de aire en la cámara de vacío
      registra una presión de $72\ \text{cm}$ cuando la presión real es de
      $76\ \text{cm}$. Si el extremo superior del tubo está a $100\ \text{cm}$
      sobre el mercurio de la cubeta, ¿cuál es el verdadero valor de la presión
      atmosférica cuando el barómetro marca $68\ \text{cm}$? ¿Por qué?
      Supóngase $T$ constante.
    pide: La presión atmosférica real cuando el barómetro marca 68 cm, y por qué.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué un barómetro con aire dentro marca de menos?
        opciones:
          - texto: >-
              Porque el aire atrapado empuja hacia abajo la columna: la
              atmosférica tiene que sostener el mercurio **y** vencer esa
              presión
            correcta: true
            mensaje: |
              Eso es. En un barómetro perfecto la cámara está al vacío y toda
              la atmosférica sostiene la columna. Con aire dentro, parte de la
              atmosférica se gasta comprimiéndolo y la columna sube menos.
          - texto: >-
              Porque el aire pesa y añade su peso a la columna de mercurio
            mensaje: |
              El peso de unos centímetros cúbicos de aire es despreciable
              frente al del mercurio. Lo que importa no es su peso sino su
              **presión**, que empuja sobre la superficie superior de la
              columna.
          - texto: >-
              Porque el aire disuelve mercurio y baja su densidad
            mensaje: |
              No hay ningún efecto químico. El fenómeno es puramente mecánico:
              una presión de gas actuando sobre el extremo cerrado de la
              columna.

      - tipo: calcular
        titulo: La presión del aire atrapado, al principio
        pregunta: |
          Cuando marca 72 con la real de 76, ¿qué presión tiene el aire
          atrapado, en cm de Hg?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.05
          formato: un número en centímetros de mercurio
        distractores:
          - valor: '28'
            mensaje: |
              Esa es la **longitud** de la cámara de aire, $100 - 72$. Su
              presión es otra cosa: la diferencia entre lo que debería marcar y
              lo que marca.
          - valor: '76'
            mensaje: |
              Esa es la atmosférica real. El aire atrapado solo soporta la
              diferencia: lo que le falta a la columna para llegar a su altura
              correcta.
        pista: |
          Equilibrio en la superficie del mercurio de la cubeta:
          $p_{\text{atm}} = h + p_{\text{aire}}$.
        desarrollo: |
          $$
          p_{\text{atm}} = h + p_{\text{aire}}
          \;\Longrightarrow\;
          p_{\text{aire}} = 76 - 72 = 4\ \text{cm de Hg}
          $$

          Y la cámara mide $100 - 72 = 28\ \text{cm}$.

      - tipo: calcular
        titulo: La presión atmosférica real
        pregunta: |
          ¿Cuál es la atmosférica verdadera cuando el barómetro marca
          $68\ \text{cm}$?
        respuesta:
          tipo: numero
          valor: '71.5'
          tolerancia: 0.2
          formato: un número en centímetros de mercurio
        distractores:
          - valor: '72'
            mensaje: |
              Has supuesto que el aire mantiene su presión de 4 cm. No la
              mantiene: al bajar la columna, la cámara se alarga de 28 a 32 cm
              y el aire se expande, así que su presión **baja** a 3,5.
          - valor: '68'
            mensaje: |
              Esa es la lectura, no la presión real. El barómetro marca de
              menos justamente porque hay aire empujando; la real es siempre
              mayor que lo que marca.
        pista: |
          Boyle con $T$ constante: $p\,L$ se conserva. La cámara pasa de
          $100-72$ a $100-68$.
        desarrollo: |
          $$
          p_1 L_1 = p_2 L_2
          \;\Longrightarrow\;
          4\cdot 28 = p_2\cdot 32
          \;\Longrightarrow\;
          p_2 = 3{,}5\ \text{cm de Hg}
          $$
          $$
          p_{\text{atm}} = 68 + 3{,}5 = 71{,}5\ \text{cm de Hg}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La atmosférica sostiene la columna y además vence la presión del
              aire atrapado: $p_{\text{atm}} = h + p_{\text{aire}}$.
          - texto: >-
              En la primera medida, el aire está a 4 cm de Hg ocupando 28 cm de
              tubo, así que el producto $pL$ vale 112.
          - texto: >-
              Al marcar 68 la cámara mide 32 cm, el aire baja a 3,5 cm de Hg y
              la atmosférica real es 71,5.
          - texto: >-
              El error del barómetro es constante, 4 cm, así que basta sumar 4
              a cualquier lectura para corregirlo.
            trampa: true
            mensaje: |
              El error **no** es constante: depende de la lectura, porque la
              cámara de aire cambia de longitud. Aquí es de 4 cm cuando marca
              72 y de 3,5 cuando marca 68. Un barómetro con aire no se corrige
              con una constante, se corrige con Boyle.

    resolucion: |
      **Dos ecuaciones, y ninguna de las dos es nueva.**

      La primera es hidrostática pura: la atmosférica tiene que sostener la
      columna **y** vencer la presión del aire atrapado.

      $$
      p_{\text{atm}} = h + p_{\text{aire}}
      $$

      La segunda es Boyle, porque la temperatura no cambia y la masa de aire
      tampoco:

      $$
      p_{\text{aire}}\cdot L_{\text{cámara}} = \text{cte}
      $$

      **Con la primera medida** se calibra el defecto:
      $p_{\text{aire}} = 76-72 = 4$ cm sobre una cámara de $100-72 = 28$ cm,
      así que el producto vale 112.

      **Con la segunda**, la cámara mide $100-68 = 32$ cm y por tanto

      $$
      p_{\text{aire}} = \frac{112}{32} = 3{,}5\ \text{cm}
      \;\Longrightarrow\;
      p_{\text{atm}} = 68 + 3{,}5 = 71{,}5\ \text{cm de Hg}
      $$

      **El «¿por qué?» del enunciado tiene respuesta corta:** el barómetro
      marca siempre **de menos**, y con un error que **no es constante**. Al
      bajar la presión atmosférica la columna baja, la cámara se alarga, el
      aire se expande y su presión disminuye — así que el error se reduce. Un
      barómetro contaminado no se arregla sumando una constante: hay que
      conocer la geometría del tubo y aplicar Boyle en cada lectura.

      Y por eso los barómetros de mercurio se llenan hirviendo el mercurio
      dentro del tubo: para expulsar hasta la última burbuja.

  # ── COLECCIÓN 2.2. Manómetro con ensanchamiento: el único del capítulo
  #    donde hay que contar el volumen desplazado antes de escribir la
  #    ecuación del manómetro.
  - id: ejflu4-col22-el-manometro-con-ensanchamiento
    titulo: Un manómetro con un ensanchamiento, y el nivel que casi no se mueve
    fuente: >-
      Ejercicio 2.2 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un manómetro está formado por un tubo en U de $5\ \text{mm}$ de
      diámetro. Contiene aceite ($s = 0{,}85$) y mercurio ($s = 13{,}6$),
      estando las dos ramas en posición vertical. La rama derecha termina en un
      ensanchamiento de $\varnothing = 25\ \text{mm}$. Este ensanchamiento
      contiene solo aceite, y la superficie de separación entre aceite y
      mercurio se encuentra en esta parte de la derecha, de $5\ \text{mm}$ de
      diámetro. La rama izquierda solo contiene Hg, estando su parte superior
      abierta a la atmósfera.

      Si la rama derecha se conecta a un depósito que contiene gas a presión,
      se observa que la superficie de separación aceite-Hg desciende
      $2\ \text{cm}$. Calcular la presión del gas en Pa si la superficie del
      aceite permanece en la zona ensanchada.
    pide: La presión del gas, en pascales.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si la interfaz baja 2 cm, ¿cuánto sube el nivel del aceite en el
          ensanchamiento?
        opciones:
          - texto: >-
              Muy poco: el mismo volumen repartido en una sección veinticinco
              veces mayor, así que sube $(5/25)^{2}\cdot 2 = 0{,}08\ \text{cm}$
            correcta: true
            mensaje: |
              Exacto, y es la razón de ser del ensanchamiento: hace que una
              rama se pueda tomar prácticamente como de nivel fijo. Aquí no se
              desprecia del todo, pero se ve que aporta menos de un milímetro.
          - texto: >-
              También 2 cm, porque el líquido es incompresible
            mensaje: |
              Incompresible significa que el **volumen** se conserva, no la
              altura. Ese volumen, al pasar a una sección veinticinco veces
              mayor, produce una altura veinticinco veces menor.
          - texto: >-
              4 cm, el doble, como en un manómetro en U normal
            mensaje: |
              En un tubo en U de sección constante lo que se dobla es la
              **diferencia de niveles** entre las dos ramas, no el ascenso de
              una. Y aquí las secciones ni siquiera son iguales.

      - tipo: calcular
        titulo: El ascenso en el ensanchamiento
        pregunta: |
          ¿Cuánto sube el aceite en la parte ancha?
        respuesta:
          tipo: magnitud
          valor: '0.8 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4 mm'
            mensaje: |
              Has usado la relación de diámetros, $5/25 = 1/5$. Lo que conserva
              el volumen son las **áreas**, que van con el cuadrado:
              $(1/5)^{2} = 1/25$.
          - valor: '20 mm'
            mensaje: |
              Ese es el descenso de la interfaz. El ensanchamiento hace que el
              nivel de arriba se mueva mucho menos, que es precisamente para lo
              que está.
        pista: |
          Volumen desplazado igual en las dos secciones:
          $A_{\text{tubo}}\,R = A_{\text{ancho}}\,y$.
        desarrollo: |
          $$
          y = R\left(\frac{d}{D}\right)^{2}
          = 20\cdot\left(\frac{5}{25}\right)^{2} = 20\cdot 0{,}04
          = 0{,}8\ \text{mm}
          $$

      - tipo: calcular
        titulo: La presión del gas
        pregunta: |
          ¿Qué presión tiene el gas?
        respuesta:
          tipo: magnitud
          valor: '5158 pa'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '5505 pa'
            mensaje: |
              Has sumado la columna de aceite en vez de restarla. El aceite
              está del lado del gas: su peso **ayuda** a empujar el mercurio,
              así que descuenta presión al gas.
          - valor: '2668 pa'
            mensaje: |
              Has contado un solo descenso de mercurio. Cuando la interfaz de
              la rama derecha baja 2 cm, el mercurio de la izquierda sube otros
              2: la diferencia de niveles cambia en **4 cm**.
        pista: |
          Recorre el manómetro desde el gas hasta la atmósfera sumando y
          restando columnas, y trabaja en mca.
        desarrollo: |
          En metros de columna de agua, recorriendo desde el gas:

          $$
          \frac{p_{\text{gas}}}{\gamma}
          = \underbrace{2R\cdot s_{Hg}}_{\text{el mercurio que hay que levantar}}
          - \underbrace{(R+y)\,s_{\text{aceite}}}_{\text{el aceite que ayuda}}
          $$
          $$
          = 0{,}04\cdot 13{,}6 - 0{,}0208\cdot 0{,}85
          = 0{,}544 - 0{,}0177 = 0{,}526\ \text{mca}
          $$
          $$
          p_{\text{gas}} = 0{,}526\cdot 9800 = 5158\ \text{Pa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El volumen que abandona la rama de 5 mm reaparece en el
              ensanchamiento, y como la sección es 25 veces mayor, el nivel
              solo sube 0,8 mm.
          - texto: >-
              Al bajar la interfaz 2 cm, el mercurio de la rama abierta sube
              otros 2: la diferencia de niveles de mercurio cambia en 4 cm.
          - texto: >-
              Recorriendo el manómetro, el gas tiene que levantar esos 4 cm de
              mercurio menos lo que aporta la columna de aceite: 0,526 mca, o
              sea 5158 Pa.
          - texto: >-
              La columna de aceite es tan pequeña que se podría despreciar sin
              cambiar apreciablemente el resultado.
            trampa: true
            mensaje: |
              Aporta 0,0177 mca de 0,544: un **3,3 %** del resultado. Con la
              tolerancia habitual del 2 % eso ya se sale, así que no se puede
              despreciar. Lo que sí es casi despreciable es el ascenso $y$ en
              el ensanchamiento, que aporta un 0,15 %.

    resolucion: |
      **Dos pasos, y el primero es de geometría, no de presiones.**

      El aceite que sale del tramo estrecho tiene que caber en el
      ensanchamiento, y como este es veinticinco veces más ancho en área, el
      nivel sube veinticinco veces menos:

      $$
      y = R\left(\frac{5}{25}\right)^{2} = 0{,}8\ \text{mm}
      $$

      **El segundo es la ecuación del manómetro.** Al bajar la interfaz 2 cm en
      la rama de la derecha, el mercurio de la izquierda sube otros 2: la
      diferencia de niveles de mercurio es de **4 cm**.

      $$
      \frac{p_{\text{gas}}}{\gamma} = 2R\,s_{Hg} - (R+y)\,s_{\text{aceite}}
      = 0{,}544 - 0{,}0177 = 0{,}526\ \text{mca}
      $$
      $$
      p_{\text{gas}} = 5158\ \text{Pa}
      $$

      **Para qué sirve el ensanchamiento**, que es lo que el enunciado quiere
      que se entienda: en un manómetro en U corriente hay que leer **dos**
      niveles y los dos se mueven. Con un depósito ancho en una rama, ese nivel
      apenas cambia —aquí 0,8 mm frente a 20— y basta leer uno solo, con la
      escala fija. Es el principio del manómetro de cubeta y del barómetro de
      Fortin.

      **Y el detalle que sí hay que contar dos veces**: los 2 cm que baja la
      interfaz son 2 cm que sube el mercurio del otro lado. Quien escriba 2 cm
      de diferencia en vez de 4 se equivoca en la mitad del término principal.
