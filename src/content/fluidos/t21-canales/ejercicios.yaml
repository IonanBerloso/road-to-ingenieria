        <text x="245" y="290" text-anchor="middle" font-size="10" fill="var(--faint)">0,3 m</text>
        <text x="212" y="212" font-size="10" fill="var(--ink)">banqueta</text>
        <text x="134" y="266" text-anchor="end" font-size="10" fill="var(--ink)">media caña</text>
      </svg>
      <figcaption>Un cajón de 0,5 por 0,6 con una media caña de 10 cm de radio labrada en el fondo. Cuando no llueve, el agua negra circula solo por ella; cuando llueve, el cajón entero trabaja.</figcaption>
      </figure>
    pide: El caudal máximo del colector, el de la media caña sola, y el calado y la velocidad con 8 l/s.
    pasos:
      - tipo: reconocer
        pregunta: |
          El colector podría haberse hecho con el fondo plano. ¿Para qué sirve
          labrarle una media caña?
        opciones:
          - texto: Para que con caudales pequeños el agua tenga calado y velocidad suficientes y no deje sedimentos
            correcta: true
            mensaje: |
              Eso es. Con 8 l/s repartidos en 50 cm de fondo plano el agua iría
              a unos centímetros de calado y muy despacio; concentrada en una
              media caña de 20 cm alcanza casi 9 cm de calado y 0,59 m/s, que
              es la velocidad mínima habitual para que no sedimente la materia
              en suspensión.
          - texto: Para aumentar el caudal máximo del colector
            mensaje: |
              Lo aumenta muy poco: de 429 a 448 l/s, un 4 %. Si el objetivo
              fuera el caudal punta no compensaría labrarla; lo que se busca es
              el comportamiento con caudal **mínimo**.
          - texto: Para que el colector no entre en carga cuando llueve
            mensaje: |
              Que entre en carga o no depende del calado frente a la altura del
              cajón, y la media caña apenas cambia eso. Su papel está en el otro
              extremo del rango de caudales.

      - tipo: calcular
        titulo: El caudal máximo del colector
        pregunta: |
          Caudal máximo que el colector puede transportar sin entrar en carga,
          en l/s. La sección es el cajón de 0,5 × 0,6 m más la media caña de
          10 cm de radio.
        respuesta:
          tipo: magnitud
          valor: '447.8 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '429.5 l/s'
            mensaje: |
              Te has dejado la media caña. Aporta poca área —157 cm² de los
              3 157— pero también aporta perímetro, y el balance neto son 18 l/s
              más.
          - valor: '467.7 l/s'
            mensaje: |
              Has contado el fondo de la media caña como si fuera plano, 0,2 m,
              en vez de como el arco que es. El arco mide $\pi R = 0{,}314$ m:
              más perímetro mojado, menos caudal.
          - valor: '922 l/s'
            mensaje: |
              Te has dejado las dos paredes en el perímetro mojado. Miden 0,6 m
              cada una y son la mayor parte del rozamiento.
        pista: |
          $A = \pi R^{2}/2 + 0{,}5 \cdot 0{,}6$ y
          $P = \pi R + 0{,}3 + 2 \cdot 0{,}6$; después, Manning.
        desarrollo: |
          $$
          A = 0{,}0157 + 0{,}30 = 0{,}3157\ \text{m}^{2} \qquad P = 0{,}3142 + 0{,}3 + 1{,}2 = 1{,}8142\ \text{m}
          $$

          $$
          Q = \frac{1}{0{,}013}\,0{,}3157\left(\frac{0{,}3157}{1{,}8142}\right)^{2/3}\sqrt{0{,}0035} = 0{,}4478\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El caudal de la media caña
        pregunta: |
          Caudal máximo que puede transportar la media caña sola, en l/s.
        respuesta:
          tipo: magnitud
          valor: '9.7 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s)
        distractores:
          - valor: '19.4 l/s'
            mensaje: |
              Has usado el círculo entero. La media caña es medio círculo: la
              mitad de área y la mitad de perímetro —el radio hidráulico es el
              mismo, $R/2$— así que la mitad de caudal.
          - valor: '15.4 l/s'
            mensaje: |
              Has tomado $R_h = R$. Para un semicírculo lleno,
              $R_h = \dfrac{\pi R^{2}/2}{\pi R} = \dfrac{R}{2} = 0{,}05$ m.
        pista: |
          $A = \pi R^{2}/2$, $P = \pi R$, así que $R_h = R/2$.
        desarrollo: |
          $$
          Q = \frac{1}{0{,}013}\,0{,}0157\,(0{,}05)^{2/3}\sqrt{0{,}0035} = 9{,}70\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El calado en hora punta
        pregunta: |
          Calado $h_c$ cuando el colector lleva los 8 l/s de aguas negras, en
          centímetros. La media caña es la mitad inferior de un círculo de
          200 mm.
        respuesta:
          tipo: magnitud
          valor: '8.95 cm'
          tolerancia: 0.01
          formato: un calado con su unidad (cm o m)
        distractores:
          - valor: '10 cm'
            mensaje: |
              Ese es el radio, es decir, la media caña justo llena. A sección
              llena lleva 9,7 l/s, y aquí circulan 8: el calado tiene que ser
              algo menor.
          - valor: '2.59 cm'
            mensaje: |
              Has repartido los 8 l/s por los 50 cm de anchura del cajón. No
              llegan hasta ahí: mientras el calado no supere los 10 cm de la
              media caña, el agua circula solo por ella.
        pista: |
          Sección circular parcialmente llena: con $y = h/D$,
          $\theta = 2\arccos(1-2y)$,
          $A = \frac{D^{2}}{8}(\theta - \sin\theta)$ y
          $P = \frac{D\theta}{2}$. Se tantea $y$ hasta que Manning dé 8 l/s.
        desarrollo: |
          Tanteando, $y = h/D = 0{,}4475$, es decir $h_c = 8{,}95$ cm:

          $$
          \theta = 2{,}930\ \text{rad} \qquad A = 0{,}01361\ \text{m}^{2} \qquad P = 0{,}2930\ \text{m}
          $$

          $$
          Q = \frac{1}{0{,}013}\,0{,}01361\,(0{,}04645)^{2/3}\sqrt{0{,}0035} = 8{,}0\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La velocidad en hora punta
        pregunta: |
          Velocidad del flujo con esos 8 l/s, en m/s.
        respuesta:
          tipo: magnitud
          valor: '0.588 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '0.0253 m/s'
            mensaje: |
              Has dividido el caudal entre el área de la sección **completa**.
              El agua solo ocupa 136 cm² de la media caña, no los 3 157 del
              colector entero.
          - valor: '0.509 m/s'
            mensaje: |
              Has usado el área de la media caña llena, 157 cm². Con 8 l/s no
              va llena: ocupa 136 cm².
        pista: |
          $V = Q/A$ con el área realmente mojada, o directamente
          $V = \frac{1}{n}R_h^{2/3}\sqrt{J}$.
        desarrollo: |
          $$
          V = \frac{0{,}008}{0{,}01361} = 0{,}588\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena el estudio del colector. Una pieza es falsa.
        piezas:
          - texto: 'A sección completa, el área es la del cajón más la de la media caña, y el perímetro incluye el arco, la banqueta y las dos paredes.'
          - texto: 'La media caña llena lleva 9,7 l/s, porque su radio hidráulico es R/2 igual que el de una tubería llena de diámetro D es D/4.'
          - texto: 'Con 8 l/s el agua no llena la media caña: hay que tantear el calado en la sección circular parcial.'
          - texto: 'La media caña se labra para aumentar el caudal punta del colector, que sin ella sería un 4 % menor.'
            trampa: true
            mensaje: |
              El 4 % es cierto —429 frente a 448 l/s— pero no es la razón. Se
              labra para el otro extremo del rango: con caudal mínimo,
              concentrar el agua en 20 cm en vez de repartirla en 50 le da
              calado y velocidad suficientes para arrastrar los sólidos. Sin
              media caña, esos mismos 8 l/s irían a 2,6 cm de calado y sedimentarían.
    resolucion: |
      **La sección, contada por partes.** El colector es un cajón de
      $0{,}5 \times 0{,}6$ m con una media caña semicircular de $R = 0{,}1$ m
      labrada en la mitad izquierda de su fondo; los 30 cm restantes son una
      banqueta plana.

      **A sección llena** (a). Área y perímetro mojado:

      $$
      A = \frac{\pi R^{2}}{2} + 0{,}5 \cdot 0{,}6 = 0{,}3157\ \text{m}^{2} \qquad P = \pi R + 0{,}3 + 2 \cdot 0{,}6 = 1{,}8142\ \text{m}
      $$

      $$
      Q = \frac{1}{n}A\,R_h^{2/3}\sqrt{J} = 447{,}8\ \text{l/s}
      $$

      **La media caña sola** (b). Un semicírculo lleno tiene
      $R_h = R/2 = 0{,}05$ m:

      $$
      Q = \frac{1}{0{,}013}\,0{,}0157\,(0{,}05)^{2/3}\sqrt{0{,}0035} = 9{,}70\ \text{l/s}
      $$

      **En hora punta** (c). Los 8 l/s son menos que 9,7, así que la media caña
      no va llena y hay que tantear en la sección circular parcial. Sale
      $h_c = 8{,}95$ cm y $V = 0{,}588$ m/s. El boletín publica 448,6 l/s;
      9,7 l/s; 8,92 cm y 0,586 m/s.

      **Para qué está la media caña, que es la pregunta que el enunciado no
      hace.** El colector tiene que servir a dos regímenes que se llevan mal:
      448 l/s cuando llueve y 8 cuando no, una relación de **cincuenta y seis a
      uno**. Con el fondo plano, esos 8 l/s se repartirían en 50 cm de anchura,
      irían a unos 2,6 cm de calado y a una velocidad tan baja que la materia en
      suspensión sedimentaría y el colector se atascaría entre lluvia y lluvia.

      Concentrarlos en una media caña de 20 cm los sube a 8,95 cm de calado y
      0,59 m/s, que es justo el orden de la velocidad mínima de autolimpieza
      que se exige en saneamiento. La media caña no está para llevar más agua:
      está para que la poca que hay circule bien.

  - id: ejflu21-col811-cinco-secciones-y-una-tabla-a-medio-llenar
    titulo: Cinco secciones y una tabla a medio llenar
    fuente: Ejercicio 8.11 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Conocidos los siguientes datos para canales de igual material, pendiente y
      caudal, definir y justificar cuál de las secciones de la tabla es la
      sección hidráulicamente óptima.

      | | $R_H$ [m] | A [m²] | P [m] | v [m/s] |
      |---|---|---|---|---|
      | Sección 1 | | 3,629 | | |
      | Sección 2 | 0,737 | | 4,633 | |
      | Sección 3 | 0,674 | | | |
      | Sección 4 | 0,711 | 3,501 | | |
      | Sección 5 | | | 5,800 | 1,605 |

      <figure class="figura-examen">
      <svg viewBox="0 0 440 280" role="img" width="440" height="280"
           aria-labelledby="f811t f811d">
        <title id="f811t">Las cinco secciones situadas por su perímetro mojado y su radio hidráulico</title>
        <desc id="f811d">Gráfica con el perímetro mojado en el eje horizontal y
        el radio hidráulico en el vertical. Las cinco secciones se alinean en
        una curva descendente: cuanto mayor es el perímetro, menor es el radio
        hidráulico. La sección 2 queda arriba a la izquierda, con el menor
        perímetro y el mayor radio; la 5 abajo a la derecha, con el mayor
        perímetro y el menor radio. Las secciones 1 y 3 caen prácticamente en
        el mismo punto.</desc>
        <line x1="60" y1="230" x2="410" y2="230" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="60" y1="230" x2="60" y2="40" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="235" y="262" text-anchor="middle" font-size="10" fill="var(--faint)">perímetro mojado P [m]</text>
        <text x="24" y="130" font-size="10" fill="var(--faint)" transform="rotate(-90 24 130)" text-anchor="middle">RH [m]</text>
        <line x1="70" y1="230" x2="70" y2="234" stroke="var(--faint)" stroke-width="1"/>
        <text x="70" y="246" text-anchor="middle" font-size="9" fill="var(--faint)">4,5</text>
        <line x1="177" y1="230" x2="177" y2="234" stroke="var(--faint)" stroke-width="1"/>
        <text x="177" y="246" text-anchor="middle" font-size="9" fill="var(--faint)">5,0</text>
        <line x1="283" y1="230" x2="283" y2="234" stroke="var(--faint)" stroke-width="1"/>
        <text x="283" y="246" text-anchor="middle" font-size="9" fill="var(--faint)">5,5</text>
        <line x1="390" y1="230" x2="390" y2="234" stroke="var(--faint)" stroke-width="1"/>
        <text x="390" y="246" text-anchor="middle" font-size="9" fill="var(--faint)">6,0</text>
        <line x1="56" y1="220" x2="60" y2="220" stroke="var(--faint)" stroke-width="1"/>
        <text x="52" y="224" text-anchor="end" font-size="9" fill="var(--faint)">0,62</text>
        <line x1="56" y1="163" x2="60" y2="163" stroke="var(--faint)" stroke-width="1"/>
        <text x="52" y="167" text-anchor="end" font-size="9" fill="var(--faint)">0,67</text>
        <line x1="56" y1="106" x2="60" y2="106" stroke="var(--faint)" stroke-width="1"/>
        <text x="52" y="110" text-anchor="end" font-size="9" fill="var(--faint)">0,72</text>
        <path d="M98,86 L160,116 L258,158 L260,159 L347,193" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="4 3"/>
        <circle cx="98" cy="86" r="6" fill="var(--live)"/>
        <text x="106" y="78" font-size="10.5" fill="var(--live)">2 · la óptima</text>
        <circle cx="160" cy="116" r="4.5" fill="var(--alt)"/>
        <text x="168" y="112" font-size="10" fill="var(--ink)">4</text>
        <circle cx="260" cy="159" r="4.5" fill="var(--alt)"/>
        <text x="268" y="152" font-size="10" fill="var(--ink)">1 y 3</text>
        <circle cx="347" cy="193" r="4.5" fill="var(--alt)"/>
        <text x="355" y="190" font-size="10" fill="var(--ink)">5</text>
      </svg>
      <figcaption>Con el mismo caudal, material y pendiente, las cinco secciones caen en una sola curva descendente: más perímetro, menos radio hidráulico. La mejor es la que está más arriba y más a la izquierda.</figcaption>
      </figure>
    pide: Cuál de las cinco secciones es la hidráulicamente óptima, y por qué.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las cinco secciones llevan el mismo caudal con el mismo material y la
          misma pendiente. ¿Qué magnitud es igual en todas?
        opciones:
          - texto: El producto $A\,R_H^{2/3}$, porque es lo único que queda de Manning cuando n, J y Q coinciden
            correcta: true
            mensaje: |
              Eso es. De $Q = \frac{1}{n}A R_H^{2/3}\sqrt J$, con $n$, $J$ y $Q$
              comunes, el factor de sección $A R_H^{2/3}$ vale lo mismo en las
              cinco. Esa igualdad, junto con $R_H = A/P$, basta para completar
              toda la tabla.
          - texto: El área, porque el caudal es el mismo
            mensaje: |
              El caudal es el mismo pero las velocidades no, así que las áreas
              tampoco: van de 3,42 a 3,74 m². Lo que coincide es el producto
              $A R_H^{2/3}$.
          - texto: La velocidad, porque dependen del mismo material y pendiente
            mensaje: |
              La velocidad depende además del radio hidráulico:
              $v = \frac{1}{n}R_H^{2/3}\sqrt J$. Con radios distintos, las
              velocidades son distintas.

      - tipo: calcular
        titulo: El factor de sección común
        pregunta: |
          Valor del factor de sección $A\,R_H^{2/3}$, común a las cinco. La
          sección 2 tiene $R_H$ = 0,737 m y P = 4,633 m.
        respuesta:
          tipo: numero
          valor: '2.786'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '3.416'
            mensaje: |
              Ese es el área de la sección 2, $R_H \cdot P$. Falta multiplicarla
              por $R_H^{2/3}$.
          - valor: '2.517'
            mensaje: |
              Has multiplicado por $R_H$ en vez de por $R_H^{2/3}$. El exponente
              dos tercios de Manning no es decorativo: aquí cambia el factor un
              10 %.
        pista: |
          $A = R_H\,P$ y después $A\,R_H^{2/3}$.
        desarrollo: |
          $$
          A_2 = 0{,}737 \cdot 4{,}633 = 3{,}415\ \text{m}^{2} \qquad A_2R_H^{2/3} = 3{,}415 \cdot 0{,}816 = 2{,}786
          $$

          Con la sección 4 se comprueba:
          $3{,}501 \cdot 0{,}711^{2/3} = 2{,}789$. La diferencia es del 0,1 %:
          los datos son consistentes.

      - tipo: calcular
        titulo: El caudal que llevan todas
        pregunta: |
          Caudal común, en m³/s. La sección 5 tiene P = 5,800 m y v = 1,605 m/s.
        respuesta:
          tipo: magnitud
          valor: '6 m3/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (m³/s o l/s)
        distractores:
          - valor: '9.31 m3/s'
            mensaje: |
              Has multiplicado la velocidad por el perímetro. El caudal es
              velocidad por **área**, y el área de la 5 sale de
              $A = R_H P$ una vez conocido su radio.
          - valor: '4.47 m3/s'
            mensaje: |
              Has usado el factor de sección como si fuera un área. El área de
              la sección 5 es 3,737 m²: sale de despejar $R_H$ de
              $P\,R_H^{5/3} = 2{,}786$.
        pista: |
          $A = R_HP$, así que el factor de sección es $P\,R_H^{5/3}$: de ahí
          sale $R_H$ de la sección 5, luego su área y luego $Q = vA$.
        desarrollo: |
          $$
          R_H^{5/3} = \frac{2{,}786}{5{,}800} = 0{,}4804 \;\Longrightarrow\; R_H = 0{,}644\ \text{m} \qquad A = 0{,}644 \cdot 5{,}800 = 3{,}737\ \text{m}^{2}
          $$

          $$
          Q = 1{,}605 \cdot 3{,}737 = 6{,}00\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El perímetro de la sección 4
        pregunta: |
          Perímetro mojado de la sección 4, en metros. Tiene $R_H$ = 0,711 m y
          A = 3,501 m².
        respuesta:
          tipo: magnitud
          valor: '4.924 m'
          tolerancia: 0.01
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '2.489 m'
            mensaje: |
              Has multiplicado en vez de dividir. De $R_H = A/P$ se despeja
              $P = A/R_H$, y el perímetro siempre es mayor que el área cuando el
              radio hidráulico es menor que uno.
          - valor: '3.918 m'
            mensaje: |
              Has usado el factor de sección donde va el área. $P = A/R_H$ con
              el área de la propia sección, 3,501 m².
        pista: |
          $P = A/R_H$, directamente.
        desarrollo: |
          $$
          P_4 = \frac{3{,}501}{0{,}711} = 4{,}924\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad de la sección óptima
        pregunta: |
          Velocidad en la sección 2, en m/s.
        respuesta:
          tipo: magnitud
          valor: '1.757 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '1.605 m/s'
            mensaje: |
              Esa es la de la sección 5, la más lenta de las cinco. La 2 tiene
              menos área para el mismo caudal, así que va más rápida.
          - valor: '1.295 m/s'
            mensaje: |
              Has dividido el caudal entre el perímetro. La velocidad es caudal
              entre **área**: $6/3{,}415$.
        pista: |
          $v = Q/A$ con el caudal común y el área de la sección 2.
        desarrollo: |
          $$
          v_2 = \frac{6{,}00}{3{,}415} = 1{,}757\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: 'Con n, J y Q comunes, el factor de sección A·RH^(2/3) es el mismo en las cinco, y con RH = A/P la tabla se completa entera.'
          - texto: 'La sección 2 resulta tener a la vez el mayor radio hidráulico, la menor área, el menor perímetro y la mayor velocidad: es la óptima por los cuatro criterios a la vez.'
          - texto: 'Las secciones 1 y 3 salen prácticamente iguales —RH de 0,673 y 0,674, áreas de 3,629 y 3,626—, lo que confirma que el método es consistente.'
          - texto: 'La sección 5 es la peor porque es la que menos velocidad tiene, y con menos velocidad hace falta más pendiente para el mismo caudal.'
            trampa: true
            mensaje: |
              Es la peor, sí, pero la pendiente es **dato** y es la misma en las
              cinco: no hace falta más. Lo que la sección 5 necesita para llevar
              los mismos 6 m³/s es más **área** —3,74 frente a 3,42 m²— y sobre
              todo más perímetro, 5,80 frente a 4,63 m. Más excavación y más
              revestimiento para el mismo servicio.
    resolucion: |
      **Lo que hace resoluble la tabla.** Con el mismo material, la misma
      pendiente y el mismo caudal, la fórmula de Manning deja una sola cantidad
      común:

      $$
      Q = \frac{1}{n}A\,R_H^{2/3}\sqrt J \;\Longrightarrow\; A\,R_H^{2/3} = \frac{Q\,n}{\sqrt J} = \text{constante}
      $$

      Con eso y con $R_H = A/P$, cada fila se completa a partir de un solo dato.

      **El factor de sección** sale de la fila 2, que trae dos datos:

      $$
      A_2 = 0{,}737 \cdot 4{,}633 = 3{,}415 \qquad A_2R_H^{2/3} = 2{,}786
      $$

      y la fila 4 lo confirma: $3{,}501 \cdot 0{,}711^{2/3} = 2{,}789$.

      **La tabla completa**, con $Q = 6{,}00$ m³/s deducido de la fila 5:

      | | $R_H$ [m] | A [m²] | P [m] | v [m/s] |
      |---|---|---|---|---|
      | Sección 1 | 0,673 | 3,629 | 5,391 | 1,653 |
      | **Sección 2** | **0,737** | **3,415** | **4,633** | **1,757** |
      | Sección 3 | 0,674 | 3,626 | 5,380 | 1,655 |
      | Sección 4 | 0,711 | 3,501 | 4,924 | 1,714 |
      | Sección 5 | 0,644 | 3,737 | 5,800 | 1,605 |

      **La respuesta.** La **sección 2** es la hidráulicamente óptima, y lo es
      por los cuatro criterios a la vez: mayor radio hidráulico, menor área,
      menor perímetro mojado y mayor velocidad. No es casualidad que coincidan:
      con el factor de sección fijo, más radio hidráulico obliga a menos área, y
      menos área con más radio obliga a menos perímetro.

      **Dos comprobaciones que conviene hacer siempre.** La primera: las
      secciones 1 y 3 salen prácticamente idénticas, lo que dice que los datos
      de partida son consistentes entre sí. La segunda, y es la que da sentido
      al problema: entre la mejor y la peor de las cinco hay un **25 % más de
      perímetro** para el mismo servicio. Eso es un 25 % más de revestimiento y
      de mantenimiento en toda la longitud del canal, que en obra hidráulica es
      la partida que decide.
