      <figcaption>Menos perímetro para la misma área significa menos rozamiento con las paredes: por eso la sección óptima es la que más caudal lleva con la misma excavación.</figcaption>
      </figure>
    pide: La relación b/l de la sección hidráulicamente óptima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la sección que menos perímetro mojado tiene, para un área
          dada, es la que más caudal lleva?
        opciones:
          - texto: Porque el caudal de Manning crece con el radio hidráulico A/P, y con A fija eso significa P mínimo
            correcta: true
            mensaje: |
              Eso es. $Q = \dfrac{1}{n}A\,R_h^{2/3}\sqrt{J}$, y $R_h = A/P$: con
              el área fijada, minimizar el perímetro es maximizar el caudal. Y
              físicamente tiene sentido: el perímetro es donde el agua roza.
          - texto: Porque con menos perímetro el canal es más barato de excavar
            mensaje: |
              Es una ventaja real, pero no la razón hidráulica. Lo que decide el
              caudal es el radio hidráulico, y la excavación la fija el área,
              que aquí se mantiene constante.
          - texto: Porque menos perímetro significa más velocidad, y el caudal es velocidad por área
            mensaje: |
              La conclusión es correcta pero el orden está al revés: la
              velocidad crece porque crece el radio hidráulico, y el radio crece
              porque baja el perímetro. Sin nombrar $R_h$ la explicación se queda
              a medias.

      - tipo: calcular
        titulo: La solera óptima frente al talud
        pregunta: |
          En la sección óptima con $\theta$ = 60º —la más habitual en canales de
          tierra—, ¿cuánto vale la relación $b/l$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '0.5'
            mensaje: |
              Has usado $1-\cos\theta$ sin el factor 2. La relación es
              $b/l = 2(1-\cos\theta)$, y con 60º da exactamente 1.
          - valor: '1.73'
            mensaje: |
              Has usado la tangente. La relación sale de comparar
              $b = 2y\tan(\theta/2)$ con $l = y/\sin\theta$, y al dividir queda
              $2(1-\cos\theta)$.
        pista: |
          $b/l = 2(1-\cos\theta)$. Con $\theta = 60°$, $\cos 60° = 0{,}5$.
        desarrollo: |
          $$
          \frac{b}{l} = 2\,(1-\cos 60°) = 2 \cdot 0{,}5 = 1
          $$

          Es decir: **la solera mide lo mismo que cada talud**. La sección
          óptima con 60º es medio hexágono regular.

      - tipo: calcular
        titulo: El radio hidráulico de la sección óptima
        pregunta: |
          Cociente $R_h/y$ de cualquier sección trapecial óptima, sea cual sea
          su ángulo.
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1'
            mensaje: |
              Eso diría que el radio hidráulico es el calado, y el radio
              hidráulico siempre es menor: es área partido por perímetro, y el
              perímetro incluye la solera y los dos taludes.
          - valor: '0.25'
            mensaje: |
              Ese es el valor de $R_h/D$ de una tubería circular a sección
              llena, otra cosa. Para la trapecial óptima sale $y/2$.
        pista: |
          Sustituye $b = 2y(\sqrt{1+m^{2}}-m)$ en $A$ y en $P$ y divide; todo se
          simplifica.
        desarrollo: |
          Con $m$ el talud horizontal por unidad de calado:

          $$
          A = y^{2}\left(2\sqrt{1+m^{2}}-m\right) \qquad P = 2y\left(2\sqrt{1+m^{2}}-m\right)
          $$

          $$
          R_h = \frac{A}{P} = \frac{y}{2}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: 'Con el área fija, el caudal de Manning es máximo cuando el perímetro mojado es mínimo, porque Rh = A/P.'
          - texto: 'Escribiendo P en función del calado con A constante y derivando, sale b = 2y(√(1+m²) − m).'
          - texto: 'Dividiendo esa solera entre la longitud del talud queda b/l = 2(1 − cos θ), que con 60º vale 1: medio hexágono regular.'
          - texto: 'Como la sección óptima tiene Rh = y/2 sea cual sea el ángulo, todas las secciones óptimas llevan el mismo caudal.'
            trampa: true
            mensaje: |
              $R_h = y/2$ es común a todas, pero el **área** no: con
              $\theta = 60°$ vale $1{,}732\,y^{2}$ y con paredes verticales
              —$\theta = 90°$, el rectángulo óptimo— sube a $2\,y^{2}$. Y como
              el caudal es $\frac{1}{n}A\,R_h^{2/3}\sqrt J$, a igualdad de
              calado manda el área: el rectángulo lleva un 15 % más. Si aun así
              los canales de tierra se hacen a 60º es por otro motivo, y no
              hidráulico: la tierra no se sostiene vertical.
    resolucion: |
      **Qué se está optimizando, y por qué.** El caudal de Manning es

      $$
      Q = \frac{1}{n}\,A\,R_h^{2/3}\sqrt{J} \qquad R_h = \frac{A}{P}
      $$

      Con el área fijada —que es lo que cuesta excavar— el caudal solo depende
      del perímetro, y cuanto menos perímetro, menos superficie de rozamiento.

      **La deducción.** Con talud $m$ (horizontal por unidad de calado):

      $$
      A = by + my^{2} \qquad P = b + 2y\sqrt{1+m^{2}}
      $$

      Despejando $b$ de la primera y sustituyendo en la segunda,
      $P = A/y - my + 2y\sqrt{1+m^{2}}$, y derivando respecto de $y$ con $A$
      constante:

      $$
      -\frac{A}{y^{2}} - m + 2\sqrt{1+m^{2}} = 0 \;\Longrightarrow\; A = y^{2}\left(2\sqrt{1+m^{2}}-m\right)
      $$

      $$
      b = 2y\left(\sqrt{1+m^{2}}-m\right)
      $$

      **La relación pedida.** Con $l = y\sqrt{1+m^{2}} = y/\sin\theta$ y
      $b = 2y\tan(\theta/2)$:

      $$
      \frac{b}{l} = 2\sin\theta\,\tan\frac{\theta}{2} = 2\,(1-\cos\theta)
      $$

      **Dos consecuencias que conviene memorizar.** La primera: con
      $\theta = 60°$ sale $b = l$, es decir, **medio hexágono regular** — la
      forma que usan casi todos los canales de tierra, porque 60º es además el
      talud que aguanta sin derrumbarse. La segunda, y vale para cualquier
      ángulo:

      $$
      R_h = \frac{y}{2}
      $$

      **toda sección trapecial óptima tiene el radio hidráulico igual a la mitad
      de su calado.** Es la forma más rápida de comprobar si un canal está bien
      dimensionado: se mide el calado, se calcula $A/P$ y se compara.

  - id: ejflu21-col86-del-canal-rectangular-al-tunel-circular
    titulo: Del canal rectangular al túnel circular
    fuente: Ejercicio 8.6 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      El canal rectangular que se muestra en la figura cambia a una tubería
      circular de diámetro D a medida que atraviesa un túnel en una montaña.
      Determinar el diámetro D si el material y la pendiente permanecen iguales
      y el flujo debe llenar completamente la tubería.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 220" role="img" width="440" height="220"
           aria-labelledby="f86t f86d">
        <title id="f86t">El canal rectangular de anchura b y calado b medios, y la tubería circular de diámetro D que lo sustituye</title>
        <desc id="f86d">A la izquierda, la sección de un canal rectangular de
        anchura b cuyo calado es la mitad de esa anchura. A la derecha, la
        sección de una tubería circular de diámetro D que circula a sección
        llena y que debe transportar el mismo caudal, con el mismo material y la
        misma pendiente.</desc>
        <defs>
          <marker id="m86n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
        </defs>
        <rect x="40" y="80" width="150" height="75" fill="var(--live)" opacity="0.18"/>
        <path d="M40,60 V155 H190 V60" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="40" y1="80" x2="190" y2="80" stroke="var(--live)" stroke-width="1.6"/>
        <path d="M110,70 l9,0 l-4.5,7 z" fill="var(--live)"/>
        <line x1="50" y1="172" x2="180" y2="172" stroke="var(--faint)" stroke-width="1" marker-start="url(#m86n)" marker-end="url(#m86n)"/>
        <line x1="40" y1="159" x2="40" y2="178" stroke="var(--faint)" stroke-width="1"/>
        <line x1="190" y1="159" x2="190" y2="178" stroke="var(--faint)" stroke-width="1"/>
        <text x="115" y="192" text-anchor="middle" font-size="11" fill="var(--faint)">b</text>
        <line x1="212" y1="84" x2="212" y2="151" stroke="var(--faint)" stroke-width="1" marker-start="url(#m86n)" marker-end="url(#m86n)"/>
        <line x1="194" y1="82" x2="216" y2="82" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="194" y1="153" x2="216" y2="153" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="220" y="122" font-size="11" fill="var(--faint)">b/2</text>
        <text x="94" y="52" font-size="10" fill="var(--ink)">canal</text>
        <circle cx="350" cy="118" r="56" fill="var(--live)" opacity="0.18" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="294" y1="118" x2="406" y2="118" stroke="var(--faint)" stroke-width="1" marker-start="url(#m86n)" marker-end="url(#m86n)"/>
        <text x="350" y="112" text-anchor="middle" font-size="11" fill="var(--faint)">D</text>
        <text x="350" y="52" text-anchor="middle" font-size="10" fill="var(--ink)">túnel · sección llena</text>
      </svg>
      <figcaption>El mismo caudal, el mismo material y la misma pendiente: lo único que cambia es la forma. Y la forma decide cuánto perímetro hay que mojar para llevar la misma agua.</figcaption>
      </figure>
    pide: El diámetro de la tubería en función de la anchura del canal.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si el material, la pendiente y el caudal son los mismos en las dos
          secciones, ¿qué magnitud tiene que coincidir?
        opciones:
          - texto: El producto $A\,R_h^{2/3}$, que es lo único que queda de la fórmula de Manning cuando n y J son comunes
            correcta: true
            mensaje: |
              Eso es. $Q = \dfrac{1}{n}A R_h^{2/3}\sqrt{J}$: con $n$ y $J$
              iguales a los dos lados, igualar los caudales es igualar
              $A\,R_h^{2/3}$. Ese producto se llama a veces «factor de sección».
          - texto: El área, porque el caudal es velocidad por área
            mensaje: |
              Las áreas serían iguales si las velocidades lo fueran, y no lo
              son: la tubería llena tiene otro radio hidráulico y por tanto otra
              velocidad. Lo que coincide es el producto $A R_h^{2/3}$.
          - texto: El radio hidráulico, porque de él depende la velocidad
            mensaje: |
              Si coincidieran los radios hidráulicos coincidirían las
              velocidades, y entonces harían falta áreas iguales: dos
              condiciones para una incógnita. Solo se puede imponer una, y es
              sobre el producto.

      - tipo: calcular
        titulo: El factor de sección del canal
        pregunta: |
          Valor de $A\,R_h^{2/3}$ del canal rectangular, cuya anchura es $b$ y
          cuyo calado es $b/2$. Se pide el coeficiente que multiplica a $b$
          elevado a ocho tercios.
        respuesta:
          tipo: numero
          valor: '0.198'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '0.315'
            mensaje: |
              Te has dejado la solera en el perímetro mojado, o has usado
              $P = 2y$ solo. En un canal rectangular el agua roza contra las dos
              paredes **y** el fondo: $P = b + 2y = 2b$.
          - valor: '0.5'
            mensaje: |
              Ese es el área sola, $b \cdot b/2$. Falta multiplicarla por
              $R_h^{2/3}$.
        pista: |
          $A = b\cdot b/2$, $P = b + 2\,(b/2) = 2b$ y $R_h = A/P = b/4$.
        desarrollo: |
          $$
          A\,R_h^{2/3} = \frac{b^{2}}{2}\left(\frac{b}{4}\right)^{2/3} = \frac{b^{8/3}}{2 \cdot 4^{2/3}} = 0{,}198\,b^{8/3}
          $$

      - tipo: calcular
        titulo: El diámetro del túnel
        pregunta: |
          Diámetro D de la tubería: el coeficiente que multiplica a $b$.
        respuesta:
          tipo: numero
          valor: '0.844'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '0.798'
            mensaje: |
              Has igualado las áreas en vez del factor de sección:
              $\pi D^{2}/4 = b^{2}/2$. Las áreas no coinciden porque las
              velocidades tampoco.
          - valor: '0.710'
            mensaje: |
              Has usado $R_h = D/2$ para la tubería llena. A sección llena el
              radio hidráulico de un círculo es $A/P = D/4$: el diámetro entre
              cuatro, no entre dos.
          - valor: '1.177'
            mensaje: |
              Has tomado el canal como cuadrado, de calado $b$ en vez de $b/2$.
              Con esa lectura la tubería tendría que ser más ancha que el canal.
        pista: |
          Igualar los factores de sección:
          $0{,}198\,b^{8/3} = \dfrac{\pi D^{2}}{4}\left(\dfrac{D}{4}\right)^{2/3}$,
          y despejar elevando a $3/8$.
        desarrollo: |
          $$
          \frac{b^{2}}{2}\left(\frac{b}{4}\right)^{2/3} = \frac{\pi D^{2}}{4}\left(\frac{D}{4}\right)^{2/3} \;\Longrightarrow\; \frac{b^{8/3}}{2} = \frac{\pi\,D^{8/3}}{4}
          $$

          $$
          D = b\left(\frac{2}{\pi}\right)^{3/8} = 0{,}844\,b
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Con n y J comunes, igualar caudales es igualar el factor de sección A·Rh^(2/3).'
          - texto: 'El canal rectangular de anchura b y calado b/2 tiene Rh = b/4, y la tubería llena también tiene Rh = D/4: los cuatros se cancelan.'
          - texto: 'Queda b^(8/3)/2 = πD^(8/3)/4, y de ahí D = b(2/π)^(3/8) = 0,844 b.'
          - texto: 'Como el diámetro sale menor que la anchura del canal, la tubería tiene menos área y el agua va más deprisa por ella.'
            trampa: true
            mensaje: |
              Sale menor que $b$, pero eso no dice nada del área. La tubería
              tiene $A = 0{,}559\,b^{2}$ contra los $0{,}5\,b^{2}$ del canal: un
              12 % **más**. Y como lleva el mismo caudal, el agua va un 11 % más
              **despacio**. Necesita más sección porque su radio hidráulico es
              menor —$0{,}211\,b$ frente a $0{,}25\,b$—, y lo es porque una
              tubería llena roza por todo su contorno mientras que el canal
              tiene una lámina libre que no roza.
    resolucion: |
      **Lo que se conserva.** Con el mismo material y la misma pendiente, la
      fórmula de Manning se reduce a igualar el **factor de sección**:

      $$
      Q = \frac{1}{n}A\,R_h^{2/3}\sqrt{J} \;\Longrightarrow\; A_{canal}\,R_{h,canal}^{2/3} = A_{tubo}\,R_{h,tubo}^{2/3}
      $$

      **Los dos factores.** El canal rectangular de anchura $b$ y calado $b/2$
      es, además, el rectángulo hidráulicamente óptimo: su perímetro mojado es
      $b + 2(b/2) = 2b$ y su radio hidráulico $b/4$. La tubería llena tiene
      $R_h = D/4$. Los cuatros se cancelan:

      $$
      \frac{b^{2}}{2}\,b^{2/3} = \frac{\pi D^{2}}{4}\,D^{2/3} \;\Longrightarrow\; D = b\left(\frac{2}{\pi}\right)^{3/8} = 0{,}844\,b
      $$

      **Por qué el túnel necesita más sección, y no menos.** El diámetro sale
      menor que $b$, pero el área no: $0{,}559\,b^{2}$ frente a $0{,}5\,b^{2}$,
      un 12 % **más**. El agua va un 11 % más despacio, y la razón es el radio
      hidráulico: $0{,}211\,b$ en la tubería contra $0{,}25\,b$ en el canal.

      Y eso, que parece contradecir la fama del círculo, tiene una explicación
      de una línea: **un canal abierto tiene una lámina libre que no roza**. Su
      perímetro mojado son $2b$ para $0{,}5b^{2}$ de área; el de la tubería
      llena, $2{,}65\,b$ para $0{,}56\,b^{2}$. Por metro cuadrado de agua, la
      tubería moja un 18 % más de pared. El círculo es la forma óptima entre
      las **cerradas**; en cuanto se permite una superficie libre, el canal
      gana.

      **Y la advertencia que este problema deja pendiente.** La tubería está
      calculada para ir **exactamente llena**, y ese es el punto de
      funcionamiento más incómodo que existe: un poco más de caudal y entra en
      carga —deja de ser un canal—, y un poco menos y baja al régimen de sección
      parcial, donde curiosamente lleva **más** caudal que llena. Un túnel así
      se diseña siempre con resguardo.
  - id: ejflu21-col85-el-colector-de-gros-y-su-media-cana
    titulo: El colector de Gros, y por qué lleva una media caña
    fuente: Ejercicio 8.5 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se desea conocer el funcionamiento del colector de la figura, que recoge
      las aguas negras y de lluvia del barrio de Gros. La pendiente del colector
      J es de 3,5 milésimas y el coeficiente de Manning n = 0,013. Se pide:

      a) Caudal máximo total (l/s) que puede transportar el colector sin entrar
      en carga.

      b) Caudal máximo (l/s) que puede transportar la sección semicircular
      (media caña).

      c) En hora punta (14 horas), en un momento en que no llueve, se sabe que
      el colector transporta 8 l/s de aguas negras (residuales). Calcular el
      calado $h_c$ y la velocidad del flujo V.

