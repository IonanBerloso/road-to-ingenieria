ejercicios:
  # ── NUESTRO (§08). La deducción de la sección óptima rectangular cayó tal
  #    cual en junio de 2023 («deducir de forma clara y concisa cuál es la
  #    sección hidráulicamente óptima en un canal rectangular de ancho b»),
  #    y la colección solo trae el caso trapecial general. Este la aísla y le
  #    pone números para que se vea cuánto se gana de verdad.
  - id: ejflu21-la-seccion-optima-y-cuanto-se-gana
    titulo: El semicuadrado, y cuánto se gana de verdad con él
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Se quiere conducir $3\ \text{m}^{3}/\text{s}$ por un canal rectangular de
      hormigón en bruto ($n = 0{,}015$) con una pendiente de **1 milésima**.

      a) Calcular el calado y la solera de la **sección hidráulicamente
      óptima**.

      b) Calcular la velocidad del agua.

      c) Si esa misma sección se construyera con el doble de pendiente, ¿qué
      caudal transportaría?
    pide: Las dimensiones de la sección óptima, su velocidad y el caudal con doble pendiente.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la sección de mínimo perímetro mojado es también la de
          mínima área?
        opciones:
          - texto: >-
              Porque Manning deja $A^{5/3}/P^{2/3}$ constante para $Q$, $n$ y
              $J$ dados, y de ahí $A = k\,P^{2/5}$: las dos crecen juntas
            correcta: true
            mensaje: |
              Exacto, y por eso la sección hidráulicamente óptima es a la vez
              la más barata: menos área es menos excavación y menos perímetro
              es menos revestimiento. No hay que elegir entre las dos cosas.
          - texto: >-
              Porque el radio hidráulico es $A/P$, y si $P$ baja, $A$ tiene que
              bajar para que $R_H$ no cambie
            mensaje: |
              $R_H$ **sí** cambia: de hecho la sección óptima es justamente la
              que lo hace máximo. El argumento correcto no pasa por suponer
              nada constante a mano, sale de la propia fórmula de Manning.
          - texto: >-
              Porque el perímetro mojado y el área son proporcionales en
              cualquier figura geométrica
            mensaje: |
              No lo son: al alargar un rectángulo a área constante el perímetro
              crece sin límite. Lo que liga las dos aquí no es la geometría, es
              la condición de que el caudal sea el mismo.

      - tipo: calcular
        titulo: El calado óptimo
        pregunta: |
          ¿Cuál es el calado de la sección óptima?
        respuesta:
          tipo: magnitud
          valor: '1.047 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.88 m'
            mensaje: |
              Has usado $R_H = h$. En la sección óptima el radio hidráulico es
              $R_H = A/P = 2h^{2}/4h = h/2$, la mitad del calado. Es una de las
              cosas que hace cómoda esta sección, y también una de las que más
              se olvida.
          - valor: '1.5 m'
            mensaje: |
              Parece que has tomado $b = h$ en vez de $b = 2h$. La condición de
              óptimo es que la solera sea el **doble** del calado: el
              semicuadrado, no el cuadrado.
        pista: |
          En la óptima, $A = 2h^{2}$ y $R_H = h/2$. Sustituye en Manning y
          despeja: te queda $h$ elevado a $8/3$.
        desarrollo: |
          $$
          Q = \frac{1}{n}\,A\,R_H^{2/3}\,J^{1/2}
          \;\Longrightarrow\;
          A\,R_H^{2/3} = \frac{n\,Q}{\sqrt J}
          = \frac{0{,}015\cdot 3}{\sqrt{0{,}001}} = 1{,}423
          $$
          $$
          2h^{2}\left(\frac{h}{2}\right)^{2/3} = 1{,}423
          \;\Longrightarrow\;
          h^{8/3} = \frac{1{,}423\cdot 2^{2/3}}{2} = 1{,}129
          \;\Longrightarrow\;
          h = 1{,}047\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '1.369 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2.739 m/s'
            mensaje: |
              Has dividido entre $h^{2}$ en vez de entre $A = 2h^{2}$. La
              solera es el doble del calado, así que el área es dos veces el
              cuadrado del calado.
          - valor: '0.685 m/s'
            mensaje: |
              Un factor dos al revés: has usado $A = 4h^{2}$, que sería
              $b = 4h$. En la óptima $b = 2h$ y $A = 2h^{2} = 2{,}19\
              \text{m}^{2}$.
        pista: |
          $v = Q/A$, con $A = 2h^{2}$.
        desarrollo: |
          $$
          A = 2h^{2} = 2\cdot 1{,}047^{2} = 2{,}19\ \text{m}^{2}
          \qquad
          v = \frac{3}{2{,}19} = 1{,}37\ \text{m/s}
          $$

      - tipo: calcular
        titulo: Con el doble de pendiente
        pregunta: |
          Manteniendo la misma sección, ¿qué caudal llevaría con $J = 2$
          milésimas?
        respuesta:
          tipo: magnitud
          valor: '4.243 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '6 m3/s'
            mensaje: |
              El caudal no es proporcional a la pendiente. En Manning la
              pendiente entra bajo raíz: al duplicarla, el caudal se multiplica
              por $\sqrt2 = 1{,}41$, no por 2.
          - valor: '3.78 m3/s'
            mensaje: |
              Parece que has aplicado un exponente $2/3$ a la pendiente. El
              $2/3$ es del radio hidráulico; la pendiente lleva $1/2$.
        pista: |
          Todo lo demás igual, $Q \propto \sqrt J$.
        desarrollo: |
          $$
          \frac{Q_2}{Q_1} = \sqrt{\frac{J_2}{J_1}} = \sqrt2
          \qquad
          Q_2 = 3\sqrt2 = 4{,}24\ \text{m}^{3}/\text{s}
          $$

          Y el aviso de proyecto: con ese caudal la velocidad subiría a
          $1{,}94\ \text{m/s}$, cerca del límite habitual de 2 m/s por erosión.

      - tipo: justificar
        pregunta: Ordena la deducción, que es la que cayó en junio de 2023. Una pieza es falsa.
        piezas:
          - texto: >-
              De Manning, $A^{5/3}/P^{2/3}$ es constante para $Q$, $n$ y $J$
              dados, luego $A = kP^{2/5}$: el área es mínima cuando lo es el
              perímetro.
          - texto: >-
              En un rectángulo, eliminando la solera queda $P = A/h + 2h$, y
              anulando la derivada respecto al calado sale $A = 2h^{2}$.
          - texto: >-
              Como $A = bh$, eso significa $b = 2h$: la sección óptima es el
              semicuadrado, con $R_H = h/2$.
          - texto: >-
              Y como es la de mínimo perímetro, también es la de mínima
              velocidad, lo que reduce la erosión de la solera.
            trampa: true
            mensaje: |
              Al revés: con el caudal fijo y el área mínima, la velocidad
              $v = Q/A$ es **máxima**. La sección óptima es la más barata y la
              que más rinde por metro de contorno, pero es también la que más
              rápido hace ir el agua; por eso el límite de velocidad se
              comprueba **después** de dimensionarla.

    resolucion: |
      **La deducción, que es lo que se examina.** De Manning,

      $$
      Q = \frac{1}{n}\,\frac{A^{5/3}}{P^{2/3}}\,J^{1/2}
      \;\Longrightarrow\;
      \frac{A^{5/3}}{P^{2/3}} = \text{cte}
      \;\Longrightarrow\;
      A = k\,P^{2/5}
      $$

      Área mínima y perímetro mínimo son la misma condición. En un rectángulo,
      $P = A/h + 2h$, y derivando respecto al calado:

      $$
      \frac{\partial P}{\partial h} = -\frac{A}{h^{2}} + 2 = 0
      \;\Longrightarrow\;
      A = 2h^{2} = bh
      \;\Longrightarrow\;
      b = 2h
      $$

      **El semicuadrado.** Y su radio hidráulico es $R_H = h/2$.

      **Los números.** Con $nQ/\sqrt J = 1{,}423$:

      $$
      2h^{2}\left(\frac{h}{2}\right)^{2/3} = 1{,}423
      \;\Longrightarrow\;
      h = 1{,}05\ \text{m}
      \qquad
      b = 2{,}09\ \text{m}
      \qquad
      A = 2{,}19\ \text{m}^{2}
      $$
      $$
      v = \frac{3}{2{,}19} = 1{,}37\ \text{m/s}
      $$

      **Con doble pendiente**, $Q = 3\sqrt2 = 4{,}24\ \text{m}^{3}/\text{s}$.

      **Cuánto se gana en realidad.** Si en vez de la óptima se impusiera una
      solera de 4 m, el calado bajaría a 0,60 m y el área subiría a
      $2{,}39\ \text{m}^{2}$: un **9 % más de excavación** para llevar el mismo
      caudal. No es espectacular, y conviene saberlo: la sección óptima merece
      la pena, pero no tanto como para sacrificar por ella una restricción real
      de anchura o de calado. Casi todos los canales que se construyen no son
      óptimos, y no están mal proyectados por eso.

  # ── COLECCIÓN 8.2. Problema de diseño completo: la óptima, la berma, la
  #    comprobación de velocidad y —el apartado que enseña de verdad— el
  #    quinto grado que sale al fijar la solera.
  - id: ejflu21-el-canal-de-doce-metros-cubicos
    titulo: Diseñar un canal para doce metros cúbicos por segundo
    fuente: >-
      Ejercicio 8.2 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se desea diseñar un canal de sección rectangular, con una pendiente de
      $0{,}5$ milésimas, $Q = 12\ \text{m}^{3}/\text{s}$ y material hormigón en
      bruto ($n = 0{,}015$), donde la velocidad del agua no supere los
      $2\ \text{m/s}$.

      a) Calcular la base $b$, para el caso de sección hidráulicamente óptima
      ($b = 2h$).

      b) Calcular la altura $H$, con una berma del 15 %.

      c) Comprobar el condicionante de la velocidad.

      d) Si la canalización, en un tramo importante, toma una pendiente mayor
      (1 milésima), calcular la nueva profundidad $h$ del agua en el canal.
    pide: La base, la altura total con berma, la comprobación de velocidad y el nuevo calado.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado d) la pendiente se duplica y la solera sigue siendo la
          misma. ¿Qué le pasa al calado?
        opciones:
          - texto: >-
              Baja, porque con más pendiente el agua va más deprisa y el mismo
              caudal cabe en menos sección
            correcta: true
            mensaje: |
              Eso es, y conviene saberlo **antes** de iterar: te da el sentido
              en el que buscar y te avisa si el tanteo se va por otro lado.
          - texto: >-
              Sube, porque más pendiente significa más energía y más agua
            mensaje: |
              El caudal es el mismo dato en los dos apartados: 12 m³/s. Lo que
              cambia con la pendiente no es cuánta agua hay, es a qué velocidad
              va, y a más velocidad hace falta menos sección.
          - texto: >-
              No cambia: el calado lo fija el caudal y la solera, no la
              pendiente
            mensaje: |
              La pendiente está dentro de Manning, así que sí interviene. Si no
              lo hiciera, un canal horizontal llevaría el mismo caudal que uno
              inclinado, y no lleva ninguno.

      - tipo: calcular
        titulo: La base de la sección óptima
        pregunta: |
          ¿Cuánto mide la solera?
        respuesta:
          tipo: magnitud
          valor: '4 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2 m'
            mensaje: |
              Ese es el **calado**. La pregunta es la solera, que en la sección
              óptima es el doble: $b = 2h = 4$ m.
          - valor: '3.37 m'
            mensaje: |
              Casi seguro has usado $R_H = h$ en vez de $h/2$. En el
              semicuadrado, $R_H = 2h^{2}/4h = h/2$.
        pista: |
          $A\,R_H^{2/3} = nQ/\sqrt J$, con $A = 2h^{2}$ y $R_H = h/2$.
        desarrollo: |
          $$
          A\,R_H^{2/3} = \frac{0{,}015\cdot 12}{\sqrt{0{,}0005}} = 8{,}05
          $$
          $$
          2h^{2}\left(\frac{h}{2}\right)^{2/3} = 8{,}05
          \;\Longrightarrow\;
          h^{8/3} = \frac{8{,}05\cdot 2^{2/3}}{2} = 6{,}39
          \;\Longrightarrow\;
          h = 2{,}00\ \text{m}
          $$
          $$
          b = 2h = 4\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura total con berma
        pregunta: |
          Con una berma del 15 %, ¿qué altura hay que darle al canal?
        respuesta:
          tipo: magnitud
          valor: '2.3 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.3 m'
            mensaje: |
              Eso es solo la berma. La altura del canal es el calado **más** el
              resguardo: $2 + 0{,}3$.
          - valor: '4.6 m'
            mensaje: |
              Has aplicado la berma sobre la solera, no sobre el calado. La
              berma es el resguardo vertical por encima de la lámina de agua.
        pista: |
          La berma es un resguardo sobre el calado: $H = h\,(1 + 0{,}15)$.
        desarrollo: |
          $$
          H = h + 0{,}15\,h = 2 + 0{,}3 = 2{,}3\ \text{m}
          $$

          El agua ocupa 2 m y los 30 cm de arriba quedan vacíos, para oleaje,
          para una crecida pequeña y para que el canal no rebose al primer
          imprevisto.

      - tipo: calcular
        titulo: El nuevo calado con doble pendiente
        pregunta: |
          Con $J = 1$ milésima y la misma solera de 4 m, ¿cuál es el calado?
        respuesta:
          tipo: magnitud
          valor: '1.556 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2 m'
            mensaje: |
              Ese es el calado del apartado a), con la pendiente antigua. Al
              duplicar la pendiente el agua va más deprisa y necesita menos
              sección: el calado tiene que **bajar**.
          - valor: '1.414 m'
            mensaje: |
              Parece que has aplicado $h/\sqrt2$, como si el calado escalara
              con la raíz de la pendiente. No lo hace: al cambiar $h$ cambian
              el área **y** el perímetro, y la relación no es una potencia
              simple. Hay que resolver la ecuación.
        pista: |
          $A^{5/3}/P^{2/3} = nQ/\sqrt J$, con $A = 4h$ y $P = 4 + 2h$. Eleva al
          cubo y resuelve por tanteo: la solución está entre 1,5 y 1,6.
        desarrollo: |
          $$
          \frac{A^{5/3}}{P^{2/3}} = \frac{0{,}015\cdot 12}{\sqrt{0{,}001}}
          = 5{,}69
          \;\Longrightarrow\;
          A^{5} = 5{,}69^{3}\,P^{2} = 184{,}4\,P^{2}
          $$
          $$
          (4h)^{5} = 184{,}4\,(4+2h)^{2}
          \;\Longrightarrow\;
          h^{5} - 0{,}72\,h^{2} - 2{,}88\,h - 2{,}88 = 0
          $$

          Un quinto grado: se resuelve por tanteo o Newton-Raphson, y da
          $h = 1{,}556\ \text{m}$.

          Comprobación hacia atrás, que cuesta treinta segundos: con
          $A = 6{,}22\ \text{m}^{2}$ y $P = 7{,}11\ \text{m}$,
          $R_H = 0{,}875$, y Manning devuelve $Q = 12\ \text{m}^{3}/\text{s}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La sección óptima sale de $A R_H^{2/3} = nQ/\sqrt J = 8{,}05$ con
              $A = 2h^{2}$ y $R_H = h/2$: da $h = 2$ m y $b = 4$ m.
          - texto: >-
              Con la berma del 15 % el canal se construye de 2,3 m de altura, y
              la velocidad, $12/8 = 1{,}5$ m/s, cumple el límite de 2 m/s.
          - texto: >-
              Al duplicar la pendiente con la misma solera queda un polinomio
              de quinto grado en $h$, que por tanteo da 1,556 m.
          - texto: >-
              Con ese calado menor la velocidad también baja, porque el área
              mojada es menor.
            trampa: true
            mensaje: |
              El caudal es el mismo y el área es menor, así que la velocidad
              **sube**: $12/6{,}22 = 1{,}93$ m/s frente a los 1,5 de antes. Y
              es justo el apartado que habría que revisar, porque queda a un
              pelo del límite de 2 m/s que impone el enunciado.

    resolucion: |
      **a) La sección óptima.**

      $$
      A\,R_H^{2/3} = \frac{n\,Q}{\sqrt J} = \frac{0{,}015\cdot 12}{\sqrt{0{,}0005}}
      = 8{,}05
      $$

      Con $A = 2h^{2}$ y $R_H = h/2$ sale $h = 2\ \text{m}$ y
      $b = 4\ \text{m}$.

      **b) La berma.** $H = 2{,}3\ \text{m}$. Los 30 cm de resguardo no llevan
      agua: son para oleaje y para no rebosar a la primera.

      **c) La velocidad.** $v = 12/(4\cdot 2) = 1{,}5\ \text{m/s}$, por debajo
      de los 2 m/s exigidos. Cumple.

      **d) El tramo de más pendiente.** Con $J = 0{,}001$ y $b = 4$ fija:

      $$
      h^{5} - 0{,}72\,h^{2} - 2{,}88\,h - 2{,}88 = 0
      \;\Longrightarrow\;
      h = 1{,}556\ \text{m}
      $$

      **Y lo que el enunciado no pide pero un proyectista miraría.** Con ese
      calado, $A = 6{,}22\ \text{m}^{2}$ y la velocidad sube a
      $1{,}93\ \text{m/s}$. Sigue cumpliendo, pero por tres centésimas. El
      apartado d) es exactamente la situación en la que la comprobación del
      apartado c) deja de ser un trámite: **cada vez que cambia la pendiente,
      hay que volver a comprobar la velocidad**.

      Y ojo con la berma en ese tramo: el calado baja a 1,56 m, así que el
      canal de 2,3 m de altura va sobrado. Es el otro lado del mismo cambio.

  # ── COLECCIÓN 8.7. El apartado c) es el que vale: pone el rectángulo y el
  #    semicírculo uno al lado del otro con el mismo material, la misma
  #    pendiente y el mismo caudal, y pregunta cuál es mejor. Es la
  #    comparación que el tema afirma y casi nunca se hace con números.
  - id: ejflu21-col87-el-rectangulo-y-la-media-cana
    titulo: El canal rectangular y la media caña, con los mismos datos
    fuente: >-
      Ejercicio 8.7 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un canal rectangular de cemento sin acabado (coeficiente de Manning
      $n = 0{,}014$) tiene $2{,}5\ \text{m}$ de ancho. La pendiente de la
      solera es de $1{,}5$ milésimas. Se pide:

      a) Calado o altura del agua para un caudal de $6\ \text{m}^{3}/\text{s}$.

      b) Si la sección del canal fuese semicircular y fuese a sección llena,
      calcular el diámetro.

      c) ¿Cuál de las dos opciones es mejor? ¿Por qué?
    pide: El calado del canal rectangular, el diámetro del semicircular y cuál conviene.

    pasos:
      - tipo: reconocer
        pregunta: |
          En Manning, $Q = \frac{1}{n}A\,R_H^{2/3}\sqrt{J}$. ¿Qué es $R_H$ en
          un canal rectangular con el agua a calado $h$?
        opciones:
          - texto: >-
              El área mojada dividida entre el perímetro **mojado**:
              $bh/(b + 2h)$, contando la solera y las dos paredes pero no la
              superficie libre
            correcta: true
            mensaje: |
              Eso es, y las dos precisiones importan: la superficie libre no
              roza con nada y no entra en el perímetro; las dos paredes sí, y
              de ahí el 2.
          - texto: >-
              El calado, $h$, porque es la profundidad hidráulica
            mensaje: |
              El radio hidráulico solo coincide con una profundidad en un
              canal infinitamente ancho, donde las paredes no cuentan. Aquí
              $b = 2{,}5$ m y el calado va a salir de 1,2: las paredes son la
              mitad del perímetro.
          - texto: >-
              El área mojada dividida entre el perímetro total de la sección,
              incluida la superficie libre
            mensaje: |
              La superficie libre está en contacto con el aire, no con la
              pared: no aporta rozamiento y por eso no se cuenta. Es la
              diferencia entre «perímetro mojado» y «perímetro», y el nombre
              lo dice.

      - tipo: calcular
        titulo: El calado del canal rectangular
        pregunta: |
          ¿Qué calado alcanza el agua con $6\ \text{m}^{3}/\text{s}$?
        respuesta:
          tipo: magnitud
          valor: '1.2 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.918 m'
            mensaje: |
              Has tomado $R_H = h$. Con $b = 2{,}5$ m eso ignora las paredes,
              y el radio hidráulico real es $bh/(b+2h) = 0{,}61$ m, la mitad
              del calado.
          - valor: '1.056 m'
            mensaje: |
              Perímetro mojado $b + h$: te has dejado una pared. Son dos, y el
              agua roza con las dos.
        pista: |
          $6 = \frac{1}{0{,}014}\,(2{,}5h)\left(\frac{2{,}5h}{2{,}5+2h}
          \right)^{2/3}\sqrt{0{,}0015}$. Se itera sobre $h$.
        desarrollo: |
          Agrupando lo que no depende de $h$:
          $\frac{1}{0{,}014}\sqrt{0{,}0015} = 2{,}766$.

          | $h$ | $A$ | $P$ | $R_H$ | $Q$ |
          |---|---|---|---|---|
          | 1,00 | 2,50 | 4,50 | 0,556 | 4,66 |
          | 1,20 | 3,00 | 4,90 | 0,612 | 5,99 |
          | 1,21 | 3,03 | 4,92 | 0,615 | 6,06 |

          $$
          h = 1{,}2\ \text{m}
          $$

      - tipo: calcular
        titulo: El diámetro de la media caña
        pregunta: |
          ¿Qué diámetro necesita la sección semicircular a sección llena?
        respuesta:
          tipo: magnitud
          valor: '2.68 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '2.26 m'
            mensaje: |
              Has usado $R_H = D/2$, el radio geométrico. El radio
              **hidráulico** de un semicírculo a sección llena es
              $A/P = (\pi D^{2}/8)/(\pi D/2) = D/4$: la mitad del geométrico.
              Que los dos se llamen «radio» es una coincidencia de nombres.
          - valor: '2.07 m'
            mensaje: |
              Parece que has usado el área del círculo completo,
              $\pi D^{2}/4$. La sección es media caña: por debajo del diámetro
              solo hay medio círculo, $\pi D^{2}/8$.
        pista: |
          A sección llena, $A = \pi D^{2}/8$, $P = \pi D/2$ y por tanto
          $R_H = D/4$. Todo queda en función de $D$.
        desarrollo: |
          $$
          6 = \frac{1}{0{,}014}\,\frac{\pi D^{2}}{8}
          \left(\frac{D}{4}\right)^{2/3}\sqrt{0{,}0015}
          = 0{,}4311\,D^{8/3}
          $$
          $$
          D^{8/3} = 13{,}92
          \;\Longrightarrow\;
          D = 2{,}68\ \text{m}
          $$

      - tipo: calcular
        titulo: Cuánto se ahorra con la media caña
        pregunta: |
          ¿Qué porcentaje de perímetro mojado ahorra la media caña respecto
          del rectángulo? (solo el número)
        respuesta:
          tipo: numero
          valor: '14'
          tolerancia: 1
          formato: un porcentaje, solo el número
        distractores:
          - valor: '5.7'
            mensaje: |
              Ese es el ahorro de **área**: de 3,00 a 2,83 m². También es
              cierto y también cuenta, pero se pregunta por el perímetro
              mojado, que es el que mide el rozamiento y el revestimiento: de
              4,90 a 4,21 m.
          - valor: '45'
            mensaje: |
              Parece que has usado el diámetro, 2,68, como perímetro. El
              perímetro mojado de la media caña es media circunferencia:
              $\pi D/2 = 4{,}21$ m.
        pista: |
          Rectángulo: $P = b + 2h$. Media caña: $P = \pi D/2$.
        desarrollo: |
          $$
          P_{\text{rect}} = 2{,}5 + 2\cdot 1{,}2 = 4{,}90\ \text{m}
          \qquad
          P_{\text{semi}} = \frac{\pi\cdot 2{,}68}{2} = 4{,}21\ \text{m}
          $$
          $$
          \frac{4{,}90 - 4{,}21}{4{,}90} = 0{,}141 = 14\ \%
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Con el mismo material, la misma pendiente y el mismo caudal, el
              rectángulo necesita 3,00 m² de sección y 4,90 m de perímetro
              mojado.
          - texto: >-
              La media caña de 2,68 m necesita 2,83 m² y 4,21 m: un 6 % menos
              de área y un 14 % menos de perímetro.
          - texto: >-
              Menos perímetro es menos rozamiento y menos área es menos
              excavación y menos hormigón, así que la media caña es mejor por
              las dos razones a la vez.
          - texto: >-
              Y como la media caña es la sección hidráulicamente óptima, el
              rectángulo nunca puede competir con ella por mucho que se
              ajusten sus proporciones.
            trampa: true
            mensaje: |
              La primera parte es verdad —el semicírculo es la óptima
              absoluta— pero la conclusión está mal medida. El rectángulo de
              este enunciado **no** está optimizado: la sección óptima
              rectangular es $b = 2h$, y aquí $b = 2{,}5$ con $h = 1{,}2$, es
              decir casi exactamente eso. Es decir que la comparación se está
              haciendo con el mejor rectángulo posible, y aun así el
              semicírculo gana un 14 %. **Ese** es el argumento, no que el
              rectángulo no pueda competir.

    resolucion: |
      **a) El calado.** Manning con $A = 2{,}5h$ y $P = 2{,}5 + 2h$ no se
      despeja: hay que iterar. Con $h = 1{,}2$ m sale $Q = 5{,}99$
      m³/s, que es el caudal pedido.

      **b) El diámetro.** A sección llena el semicírculo deja todo en función
      de $D$, porque $A = \pi D^{2}/8$ y $R_H = D/4$:

      $$
      Q = 0{,}4311\,D^{8/3} = 6
      \;\Longrightarrow\;
      D = 2{,}68\ \text{m}
      $$

      Aquí sí hay despeje directo, y es la razón de que las secciones
      circulares se calculen más rápido que las rectangulares.

      **c) Cuál es mejor, con números.**

      | | área | perímetro mojado | $R_H$ |
      |---|---|---|---|
      | rectángulo $2{,}5\times 1{,}2$ | 3,00 m² | 4,90 m | 0,612 m |
      | media caña $D = 2{,}68$ | 2,83 m² | 4,21 m | 0,670 m |

      La media caña gana en las tres columnas: menos área —menos excavación y
      menos material—, menos perímetro —menos rozamiento— y más radio
      hidráulico, que es la otra cara de lo mismo.

      **Y el detalle que hace honesta la comparación.** El rectángulo del
      enunciado está prácticamente en su óptimo: la sección rectangular
      óptima cumple $b = 2h$, y aquí $2{,}5 \approx 2\cdot 1{,}2$. Así que no
      se está comparando el semicírculo con un rectángulo mal hecho, sino con
      el mejor rectángulo posible. El 14 % de ahorro es real y es el techo de
      lo que se puede ganar cambiando la forma.

      **Por qué entonces se siguen haciendo canales rectangulares.** Porque
      un encofrado plano es mucho más barato que una media caña de dos metros
      y medio de diámetro, y porque un rectángulo se limpia con una pala. El
      14 % hidráulico se paga en obra, y esa es una decisión que el cálculo
      no toma.

  # ── COLECCIÓN 8.9. El problema tipo del tema: dimensionar a sección llena,
  #    redondear al diámetro comercial y VOLVER a calcular el calado real, que
  #    ya no es el de la sección llena. Es el único de la colección que usa el
  #    cuadro nº 27 tal como está pensado.
  - id: ejflu21-col89-el-colector-de-hormigon
    titulo: Dimensionar la media caña, y volver atrás a por el calado
    fuente: >-
      Ejercicio 8.9 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar el diámetro de un canal semicircular, de hormigón en bruto
      (coeficiente de Manning $n = 0{,}015$). El caudal
      $Q = 2\ \text{m}^{3}/\text{s}$. La pendiente del canal es $J = 8$
      milésimas. Los diámetros comerciales van de 100 en 100 mm. Una vez
      seleccionado el diámetro, calcular el calado y la velocidad del flujo.
    pide: El diámetro comercial, y el calado y la velocidad reales con ese diámetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se dimensiona a sección llena y sale un diámetro; se redondea al
          comercial superior. ¿Por qué hay que **volver** a calcular el
          calado?
        opciones:
          - texto: >-
              Porque con el diámetro comercial, mayor que el justo, el caudal
              de diseño ya no llena la sección: el agua se queda por debajo
            correcta: true
            mensaje: |
              Exacto. La sección llena se usó solo para dimensionar. Una vez
              elegido el tubo, el caudal real es el que es y encuentra su
              propio calado de equilibrio, más bajo.
          - texto: >-
              Porque al redondear hacia arriba la velocidad baja y hay que
              comprobar que no sedimenta
            mensaje: |
              Es una consecuencia, y hay que comprobarla, pero no es la razón.
              La razón es geométrica: el calado ya no es $D/2$ y todo —área,
              perímetro, radio hidráulico— cambia con él.
          - texto: >-
              No hace falta: a sección llena el calado es $D/2$ por definición
            mensaje: |
              A sección llena sí, pero la sección **no** va llena. Se
              dimensionó suponiendo que iría, se redondeó hacia arriba, y con
              el diámetro comercial sobra hueco.

      - tipo: calcular
        titulo: El diámetro a sección llena
        pregunta: |
          ¿Qué diámetro llenaría exactamente la media caña con
          $2\ \text{m}^{3}/\text{s}$?
        respuesta:
          tipo: magnitud
          valor: '1.33 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.12 m'
            mensaje: |
              $R_H = D/2$. El radio hidráulico de un semicírculo a sección
              llena es $A/P = D/4$, no el radio geométrico.
          - valor: '1.03 m'
            mensaje: |
              Parece que has usado el área del círculo completo. Media caña es
              medio círculo: $A = \pi D^{2}/8$.
        pista: |
          $Q = \frac{1}{n}\,\frac{\pi D^{2}}{8}\left(\frac{D}{4}\right)^{2/3}
          \sqrt{J}$, todo en función de $D$.
        desarrollo: |
          $$
          2 = \frac{1}{0{,}015}\,\frac{\pi D^{2}}{8}
          \left(\frac{D}{4}\right)^{2/3}\sqrt{0{,}008}
          = 0{,}9293\,D^{8/3}
          $$
          $$
          D^{8/3} = 2{,}152
          \;\Longrightarrow\;
          D = 1{,}33\ \text{m}
          $$

          Y como los comerciales van de 100 en 100 mm, se sube a
          $D = 1{,}4$ m.

      - tipo: calcular
        titulo: El caudal que cabe en el tubo elegido
        pregunta: |
          Con $D = 1{,}4\ \text{m}$, ¿qué caudal llevaría la media caña a
          sección llena?
        respuesta:
          tipo: magnitud
          valor: '2.28 m3/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '4.56 m3/s'
            mensaje: |
              Ese es el de la **tubería** llena, el círculo completo. Es
              exactamente el doble, porque al pasar de medio círculo a círculo
              entero el área se dobla y el radio hidráulico no cambia. Ese
              número hace falta después, pero no es el de aquí.
          - valor: '3.62 m3/s'
            mensaje: |
              $R_H = D/2$ otra vez. Con $D/4 = 0{,}35$ m sale $2{,}28$.
        pista: |
          La misma expresión del paso anterior, ahora con $D$ conocido.
        desarrollo: |
          $$
          Q_{\text{ll}} = 0{,}9293\cdot 1{,}4^{8/3} = 2{,}28\
          \text{m}^{3}/\text{s}
          $$

          Sobra un 14 % de capacidad, que es lo que cuesta redondear al
          comercial siguiente.

      - tipo: calcular
        titulo: El calado real
        pregunta: |
          ¿A qué calado circulan los $2\ \text{m}^{3}/\text{s}$?
        respuesta:
          tipo: magnitud
          valor: '0.65 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.7 m'
            mensaje: |
              Ese es el calado a sección llena, $D/2$. El caudal de diseño es
              un 12 % menor que el que cabe, así que el agua se queda por
              debajo del diámetro.
          - valor: '1.09 m'
            mensaje: |
              Has entrado en el cuadro n.º 27 con $Q_c/Q_{\text{ll}} = 0{,}88$
              y multiplicado por $D$ el valor de $h_c/H_{\text{ll}}$ de esa
              fila. Ojo con la referencia del cuadro: es la **tubería** llena,
              no la media caña llena, y por tanto
              $Q_c/Q_{\text{ll}} = 2/4{,}56 = 0{,}44$.
        pista: |
          El cuadro n.º 27 relaciona $Q_c/Q_{\text{ll}}$ con $h_c/D$, y su
          referencia es la **tubería** a sección llena: $4{,}56$
          m³/s.
        desarrollo: |
          $$
          \frac{Q_c}{Q_{\text{ll}}} = \frac{2}{4{,}56} = 0{,}44
          \;\Longrightarrow\;
          \frac{h_c}{D} = 0{,}464
          \;\Longrightarrow\;
          h_c = 0{,}464\cdot 1{,}4 = 0{,}65\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad real
        pregunta: |
          ¿A qué velocidad circula el agua?
        respuesta:
          tipo: magnitud
          valor: '2.87 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2.96 m/s'
            mensaje: |
              Esa es la velocidad a sección llena. La real es algo menor:
              el cuadro da $v_c/v_{\text{ll}} = 0{,}968$ para
              $Q_c/Q_{\text{ll}} = 0{,}44$.
          - valor: '2.6 m/s'
            mensaje: |
              Has dividido el caudal entre el área de la media caña **llena**,
              $0{,}77\ \text{m}^{2}$. El agua no llega arriba: a
              $h = 0{,}65$ m su área es $0{,}70\ \text{m}^{2}$, y ahí sí sale
              $2/0{,}70 = 2{,}87$ m/s.
        pista: |
          O con $v_c/v_{\text{ll}}$ del cuadro n.º 27, o dividiendo el caudal
          entre el área mojada real. Las dos tienen que dar lo mismo.
        desarrollo: |
          $$
          v_{\text{ll}} = \frac{1}{0{,}015}\,0{,}35^{2/3}\sqrt{0{,}008}
          = 2{,}96\ \text{m/s}
          $$
          $$
          v_c = 0{,}968\cdot 2{,}96 = 2{,}87\ \text{m/s}
          $$

          Comprobación por el otro camino: el área mojada a
          $h = 0{,}65$ m vale $0{,}70\ \text{m}^{2}$, y
          $2/0{,}70 = 2{,}87$ m/s. Cuadra.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              A sección llena harían falta 1,33 m, y como los comerciales van
              de 100 en 100 mm se instala el de 1,4.
          - texto: >-
              Con 1,4 m la media caña admite 2,28 m³/s, un 14 % más de lo
              necesario, así que los 2 m³/s no la llenan.
          - texto: >-
              Entrando en el cuadro n.º 27 con
              $Q_c/Q_{\text{ll}} = 2/4{,}56 = 0{,}44$ salen $h_c = 0{,}65$ m y
              $v_c = 2{,}87$ m/s.
          - texto: >-
              Y como el calado real es menor que el de proyecto, la velocidad
              también baja, lo que reduce el riesgo de erosión.
            trampa: true
            mensaje: |
              La velocidad baja poquísimo —de 2,96 a 2,87 m/s, un 3 %— y esa
              es la propiedad más útil de las secciones circulares: **la
              velocidad es casi independiente del calado** en un rango
              amplísimo. El cuadro lo dice: entre el 30 % y el 100 % del
              caudal, $v_c/v_{\text{ll}}$ se mueve solo entre 0,875 y 1,14 —y
              de hecho **pasa de 1**, porque en torno al 90 % del caudal el
              radio hidráulico es mayor que a sección llena—. Por eso los
              colectores se hacen circulares: arrastran los sólidos igual de
              bien con caudal alto que con caudal bajo.

    resolucion: |
      **La secuencia, que es la del tema entero.** Dimensionar a sección
      llena → redondear al comercial → volver atrás y calcular el calado real.
      El tercer paso es el que se olvida, y es el que da la respuesta que se
      pregunta.

      **1 · El diámetro.** A sección llena todo queda en $D$:

      $$
      Q = \frac{1}{n}\,\frac{\pi D^{2}}{8}\left(\frac{D}{4}\right)^{2/3}
      \sqrt{J} = 0{,}9293\,D^{8/3} = 2
      \;\Longrightarrow\;
      D = 1{,}33\ \text{m}
      $$

      Comercial: **1,4 m**, con el que caben 2,28 m³/s.

      **2 · El calado.** Aquí entra el cuadro n.º 27, y hay que leerlo con
      cuidado: sus relaciones están referidas a la **tubería** a sección
      llena, no a la media caña. Y resulta que
      $Q_{\text{tubería llena}} = 2\,Q_{\text{media caña llena}}$ exactamente,
      porque al cerrar el círculo el área se dobla y el radio hidráulico
      —$D/4$ en los dos casos— no cambia. Así que la referencia es 4,56
      m³/s:

      $$
      \frac{Q_c}{Q_{\text{ll}}} = 0{,}44
      \;\Longrightarrow\;
      \frac{h_c}{D} = 0{,}464,\quad \frac{v_c}{v_{\text{ll}}} = 0{,}968
      $$
      $$
      h_c = 0{,}65\ \text{m}
      \qquad
      v_c = 2{,}87\ \text{m/s}
      $$

      **3 · La comprobación, que no cuesta nada.** El área mojada a 0,65 m es
      un segmento circular de 0,70 m², y $2/0{,}70 = 2{,}87$ m/s. Los dos
      caminos coinciden, lo que dice que el cuadro se ha leído bien.

      **Lo que hay que llevarse.** De los 2,28 m³/s que caben se usan 2, un
      88 %, y con eso el agua sube al 46 % del diámetro. **La relación entre
      caudal y calado no es proporcional ni de lejos**: en una sección
      circular el último tramo de altura aporta muchísimo caudal, porque es
      donde la sección es más ancha. Ese es todo el contenido del cuadro
      n.º 27, y es la razón de que exista.

  # ── COLECCIÓN 8.20. El apartado c) es distinto de todo lo demás del
  #    capítulo: no pide calcular, pide **elegir**, y con tres variables a la
  #    vez. Es el ejercicio que enseña qué hace cada término de Manning y
  #    hacia dónde empuja.
  - id: ejflu21-col820-el-canal-de-desague-de-la-central
    titulo: El canal de desagüe, y elegir las tres variables a la vez
    fuente: >-
      Ejercicio 8.20 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      El agua turbinada en una central del Pirineo se descarga al canal de
      desagüe, para devolverla al río. El canal es de hormigón en bruto, de
      sección rectangular y de $1\ \text{m}$ de ancho. El caudal es
      $1{,}25\ \text{m}^{3}/\text{s}$. Se pide:

      a) Pendiente de la solera del canal (milésimas), para que el calado sea
      de $0{,}5\ \text{m}$.

      b) Velocidad del agua en el canal.

      c) El canal es antiguo y está en mal estado, por lo que se ha decidido
      renovarlo. Se puede elegir el material, la pendiente (9, 15 ó 20
      milésimas) y la sección transversal del canal. Elegir de forma
      justificada las tres variables para que la velocidad del agua en el
      canal sea **máxima**. Calcular dicha velocidad máxima.

      Materiales disponibles (cuadro n.º 26): hormigón acabado 0,012;
      hormigón en bruto 0,015; arena 0,020; mampostería 0,026; tierra 0,026;
      tierra con piedras o hierba 0,035; piedras 0,037; rocas medias 0,042;
      rocas grandes 0,060.
    pide: La pendiente y la velocidad actuales, y las tres elecciones que hacen máxima la velocidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          En $v = \frac{1}{n}R_H^{2/3}\sqrt{J}$, ¿hacia dónde hay que mover
          cada variable para que la velocidad sea máxima?
        opciones:
          - texto: >-
              $n$ lo más pequeño posible, $J$ lo más grande posible y la
              sección la que maximice el radio hidráulico
            correcta: true
            mensaje: |
              Exacto, y las tres son independientes: no hay que ceder en una
              para ganar en otra. Por eso el apartado se puede resolver
              variable a variable.
          - texto: >-
              $n$ grande, porque un canal más rugoso frena menos al tener más
              superficie de contacto
            mensaje: |
              El coeficiente de Manning está en el **denominador**: más
              rugoso, menos velocidad. Es lo contrario de lo que dice la
              opción, y además más superficie de contacto es más rozamiento,
              no menos.
          - texto: >-
              La sección más grande posible, porque cabe más agua
            mensaje: |
              El caudal está fijado en 1,25 m³/s: agrandar la sección solo
              reparte ese caudal en más área y baja la velocidad. Lo que hay
              que maximizar no es el área, es el **radio hidráulico** —área
              partido por perímetro mojado— y eso pide la sección óptima, que
              es la más pequeña.

      - tipo: calcular
        titulo: La velocidad actual
        pregunta: |
          Con $1\ \text{m}$ de ancho y $0{,}5\ \text{m}$ de calado, ¿a qué
          velocidad va el agua?
        respuesta:
          tipo: magnitud
          valor: '2.5 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.25 m/s'
            mensaje: |
              Has dividido entre $1\ \text{m}^{2}$: has usado el ancho como
              área. El área mojada es ancho por calado, $1\cdot 0{,}5 =
              0{,}5\ \text{m}^{2}$.
          - valor: '0.63 m/s'
            mensaje: |
              Parece que has usado el perímetro mojado, $2$ m, como si fuera
              el área. El perímetro sirve para el radio hidráulico, no para
              la continuidad.
        pista: |
          Este apartado no necesita Manning: es continuidad, $v = Q/A$.
        desarrollo: |
          $$
          A = 1\cdot 0{,}5 = 0{,}5\ \text{m}^{2}
          \qquad
          v = \frac{1{,}25}{0{,}5} = 2{,}5\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La pendiente actual
        pregunta: |
          ¿Qué pendiente tiene la solera, en milésimas? (solo el número)
        respuesta:
          tipo: numero
          valor: '8.93'
          tolerancia: 0.1
          formato: un número en milésimas, sin unidades
        distractores:
          - valor: '94.5'
            mensaje: |
              Te ha faltado elevar al cuadrado. Manning lleva $\sqrt J$: de
              despejar sale $\sqrt J = 0{,}0945$, y la pendiente es su
              cuadrado, $0{,}00893$.
          - valor: '22.5'
            mensaje: |
              Parece que has usado $R_H = h = 0{,}5$ m. El radio hidráulico
              es $A/P = 0{,}5/2 = 0{,}25$ m, la mitad del calado: en un canal
              de un metro de ancho las dos paredes son la mitad del perímetro.
        pista: |
          $v = \frac{1}{n}R_H^{2/3}\sqrt J$ con $v$ ya conocida, y despeja $J$
          sin olvidar que va bajo raíz.
        desarrollo: |
          $$
          R_H = \frac{0{,}5}{1 + 2\cdot 0{,}5} = 0{,}25\ \text{m}
          $$
          $$
          \sqrt J = \frac{v\,n}{R_H^{2/3}}
          = \frac{2{,}5\cdot 0{,}015}{0{,}3969} = 0{,}0945
          \;\Longrightarrow\;
          J = 8{,}93\ \text{milésimas}
          $$

      - tipo: calcular
        titulo: El diámetro del canal renovado
        pregunta: |
          Con hormigón acabado, 20 milésimas de pendiente y sección
          semicircular a sección llena, ¿qué diámetro hace falta?
        respuesta:
          tipo: magnitud
          valor: '0.866 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '0.729 m'
            mensaje: |
              $R_H = D/2$. En un semicírculo a sección llena
              $R_H = A/P = D/4$, la mitad del radio geométrico.
          - valor: '0.667 m'
            mensaje: |
              Parece que has usado el área del círculo entero,
              $\pi D^{2}/4$. La sección es media caña: $\pi D^{2}/8$.
        pista: |
          $Q = \frac{1}{n}\frac{\pi D^{2}}{8}\left(\frac{D}{4}\right)^{2/3}
          \sqrt{J}$, con $n = 0{,}012$ y $J = 0{,}020$.
        desarrollo: |
          $$
          1{,}25 = \frac{1}{0{,}012}\,\frac{\pi D^{2}}{8}
          \left(\frac{D}{4}\right)^{2/3}\sqrt{0{,}020}
          = 1{,}8366\,D^{8/3}
          $$
          $$
          D^{8/3} = 0{,}6806
          \;\Longrightarrow\;
          D = 0{,}866\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad máxima
        pregunta: |
          ¿Cuál es entonces la velocidad máxima alcanzable?
        respuesta:
          tipo: magnitud
          valor: '4.25 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '4 m/s'
            mensaje: |
              Parece que has mantenido la sección rectangular óptima
              —$b = 2h$— en vez de pasar a la media caña. Con los mismos $n$ y
              $J$ da 4,00 m/s: el semicírculo solo aporta el último 6 %, pero
              lo aporta, y el enunciado pide el máximo.
          - valor: '3.59 m/s'
            mensaje: |
              Parece que te has quedado en el hormigón **en bruto**,
              $n = 0{,}015$. Pasar a acabado, $0{,}012$, sube la velocidad de
              3,59 a 4,25 sin tocar nada más: es la elección más rentable de
              las tres.
        pista: |
          $v = Q/A$, con el área de la media caña llena de diámetro 0,866 m.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}866^{2}}{8} = 0{,}294\ \text{m}^{2}
          \qquad
          v = \frac{1{,}25}{0{,}294} = 4{,}25\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la justificación del apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El coeficiente de Manning está en el denominador, así que se
              elige el material más liso disponible: hormigón acabado,
              $n = 0{,}012$.
          - texto: >-
              La pendiente entra bajo raíz en el numerador, así que se elige
              la mayor de las tres ofrecidas: 20 milésimas.
          - texto: >-
              Y la sección se elige por su radio hidráulico, que es máximo en
              la hidráulicamente óptima; entre todas las formas, la óptima
              absoluta es el semicírculo.
          - texto: >-
              Las tres elecciones son la misma que se haría para maximizar el
              caudal, así que el canal más rápido es también el de mayor
              capacidad.
            trampa: true
            mensaje: |
              El caudal está **fijado** en 1,25 m³/s: no se está maximizando
              nada de eso. Y las dos optimizaciones no coinciden: si lo que se
              quisiera fuera capacidad, la sección se haría más grande, y eso
              baja la velocidad. Aquí se busca lo contrario —la sección más
              pequeña que aún pase el caudal— y por eso sale la óptima.

    resolucion: |
      **a) y b), que van al revés de como parece.** El calado y el ancho dan
      el área, y el área con el caudal da la velocidad **sin usar Manning**:
      $v = 1{,}25/0{,}5 = 2{,}5$ m/s. Solo entonces se entra en Manning, con
      $v$ conocida, para despejar la pendiente:

      $$
      R_H = \frac{0{,}5}{2} = 0{,}25\ \text{m}
      \qquad
      J = \left(\frac{2{,}5\cdot 0{,}015}{0{,}25^{2/3}}\right)^{2}
      = 8{,}93\ \text{milésimas}
      $$

      El orden importa: quien empieza por Manning se encuentra con dos
      incógnitas y se atasca.

      **c) Las tres elecciones, una por término.** La fórmula
      $v = \frac{1}{n}R_H^{2/3}\sqrt J$ tiene tres factores y cada variable
      toca uno solo, así que se decide por separado:

      | variable | dónde entra | elección |
      |---|---|---|
      | material | $1/n$ | hormigón acabado, $n = 0{,}012$ |
      | pendiente | $\sqrt J$ | 20 milésimas, la mayor ofrecida |
      | sección | $R_H^{2/3}$ | semicircular, la óptima absoluta |

      Y entonces se dimensiona: $D = 0{,}866$ m, $A = 0{,}294$ m², y

      $$
      v = \frac{1{,}25}{0{,}294} = 4{,}25\ \text{m/s}
      $$

      **Cuánto aporta cada decisión, que es lo que el ejercicio no dice y
      conviene ver.** Se parte del canal original y se cambia una cosa cada
      vez, redimensionando el calado para que sigan pasando los mismos
      1,25 m³/s:

      | | $n$ | $J$ (‰) | sección | $v$ (m/s) |
      |---|---|---|---|---|
      | original | 0,015 | 8,93 | rect. $1\times 0{,}50$ | 2,50 |
      | + pendiente | 0,015 | 20 | rect. $1\times 0{,}37$ | 3,36 |
      | + material | 0,012 | 20 | rect. $1\times 0{,}32$ | 3,95 |
      | + sección | 0,012 | 20 | media caña $D = 0{,}87$ | **4,25** |

      La pendiente es la palanca más fuerte —vale ella sola tanto como las
      otras dos juntas— y es también la única que muchas veces no se puede
      elegir: la marca el terreno. La forma es la que menos aporta, un 8 %, y
      es la más cara de construir. **Ese orden es el que hay que tener en la
      cabeza antes de optimizar nada.**

      **Y el aviso que este ejercicio no pide pero un proyecto sí.** Cuatro
      metros y cuarto por segundo en hormigón es mucho: el límite habitual
      para no erosionar anda entre 2 y 3 m/s en hormigón corriente. El
      enunciado pide maximizar la velocidad como ejercicio de manejo de la
      fórmula; en obra, la pregunta suele ser la contraria — cómo mantenerla
      por debajo de un tope sin que el canal sedimente.

  # ── COLECCIÓN 8.13. El más completo del capítulo: la óptima rectangular, la
  #    media caña equivalente, la comparación, y de propina un apartado de
  #    sección parcialmente llena con el cuadro nº 27. Cuatro apartados que
  #    son los cuatro tipos de pregunta del tema.
  - id: ejflu21-col813-los-cuatro-apartados-del-tema
    titulo: La óptima, la media caña, cuál es mejor, y el calado real
    fuente: >-
      Ejercicio 8.13 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un canal rectangular de hormigón acabado tiene una pendiente de 2
      milésimas y lleva un caudal de $5\ \text{m}^{3}/\text{s}$.

      a) Calcular la altura de calado si la sección es la hidráulicamente
      óptima.

      b) Si la sección del canal fuese semicircular y fuese a sección llena,
      calcular el diámetro.

      c) ¿Cuál de las dos opciones es hidráulicamente mejor? ¿Por qué?

      d) Suponiendo un diámetro $D = 2{,}5\ \text{m}$ para la sección
      semicircular, y si el caudal se reduce a $3\ \text{m}^{3}/\text{s}$,
      calcular el calado $h_c$ y la velocidad del flujo $v_c$.
    pide: El calado óptimo, el diámetro equivalente, cuál conviene y el calado real con 3 m³/s.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la sección rectangular hidráulicamente óptima, ¿cuánto vale el
          radio hidráulico en función del calado?
        opciones:
          - texto: >-
              $R_H = h/2$, porque la óptima cumple $b = 2h$ y entonces
              $A/P = 2h^{2}/4h$
            correcta: true
            mensaje: |
              Eso es, y conviene sabérselo: en la óptima rectangular el radio
              hidráulico es siempre la mitad del calado, sin importar el
              caudal ni el material. Es lo que permite dejar Manning en
              función de una sola incógnita.
          - texto: >-
              $R_H = h$, porque en un canal ancho el radio hidráulico tiende
              al calado
            mensaje: |
              Eso vale para un canal **muy** ancho, donde las paredes no
              cuentan. La óptima es justo lo contrario: la más estrecha
              posible, con $b = 2h$, y ahí las paredes son la mitad del
              perímetro mojado.
          - texto: >-
              $R_H = h/4$, como en una sección circular
            mensaje: |
              El $D/4$ es del círculo. En el rectángulo óptimo,
              $A = 2h^{2}$ y $P = 2h + 2h = 4h$, de donde $R_H = h/2$.

      - tipo: calcular
        titulo: El calado de la sección óptima
        pregunta: |
          ¿Qué calado tiene el canal rectangular óptimo?
        respuesta:
          tipo: magnitud
          valor: '1.024 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.861 m'
            mensaje: |
              Has usado $R_H = h$ en vez de $h/2$. El radio hidráulico
              pequeño es lo que obliga a un calado mayor: con $R_H = h$ la
              sección parece rendir más de lo que rinde.
          - valor: '1.469 m'
            mensaje: |
              Parece que has tomado $b = h$ —sección cuadrada— en vez de
              $b = 2h$. La óptima es el **semicuadrado**: ancha el doble que
              alta.
        pista: |
          En la óptima, $A = 2h^{2}$ y $R_H = h/2$. Sustituye en Manning y
          te queda $h$ elevado a $8/3$.
        desarrollo: |
          $$
          5 = \frac{1}{0{,}012}\,2h^{2}\left(\frac{h}{2}\right)^{2/3}
          \sqrt{0{,}002} = 4{,}695\,h^{8/3}
          $$
          $$
          h^{8/3} = 1{,}065
          \;\Longrightarrow\;
          h = 1{,}024\ \text{m}
          \qquad
          b = 2{,}048\ \text{m}
          $$

          El boletín escribe «$h = 1{,}02$ mm»; es una errata evidente por
          metros.

      - tipo: calcular
        titulo: El diámetro de la media caña
        pregunta: |
          ¿Qué diámetro necesitaría la sección semicircular a sección llena?
        respuesta:
          tipo: magnitud
          valor: '2.242 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.885 m'
            mensaje: |
              $R_H = D/2$. En un semicírculo lleno,
              $A/P = (\pi D^{2}/8)/(\pi D/2) = D/4$.
          - valor: '1.729 m'
            mensaje: |
              Parece que has usado el área del círculo completo. La media caña
              tiene $\pi D^{2}/8$, no $\pi D^{2}/4$.
        pista: |
          $A = \pi D^{2}/8$ y $R_H = D/4$, y todo queda en función de $D$.
        desarrollo: |
          $$
          5 = \frac{1}{0{,}012}\,\frac{\pi D^{2}}{8}
          \left(\frac{D}{4}\right)^{2/3}\sqrt{0{,}002} = 0{,}5808\,D^{8/3}
          $$
          $$
          D^{8/3} = 8{,}609
          \;\Longrightarrow\;
          D = 2{,}242\ \text{m}
          $$

      - tipo: calcular
        titulo: El calado con el caudal reducido
        pregunta: |
          Con $D = 2{,}5\ \text{m}$ y solo $3\ \text{m}^{3}/\text{s}$, ¿a qué
          calado circula el agua?
        respuesta:
          tipo: magnitud
          valor: '0.8 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1.25 m'
            mensaje: |
              Ese es el calado a sección llena, $D/2$. Con 2,5 m de diámetro
              la media caña admitiría 6,69 m³/s, más del doble de lo que
              circula.
          - valor: '1.173 m'
            mensaje: |
              Has entrado en el cuadro n.º 27 con
              $Q_c/Q_{\text{ll}} = 3/6{,}69 = 0{,}449$, tomando como
              referencia la media caña llena. El cuadro está referido a la
              **tubería** llena, que lleva el doble: $3/13{,}37 = 0{,}224$.
              Y el resultado se delata solo: 1,17 m es más que el radio, así
              que el agua se saldría del canal.
        pista: |
          Calcula primero el caudal a tubería llena con $D = 2{,}5$ m, que es
          el doble del de la media caña llena, y entra con él en el cuadro
          n.º 27.
        desarrollo: |
          $$
          Q_{\text{semi,ll}} = 0{,}5808\cdot 2{,}5^{8/3} = 6{,}69\
          \text{m}^{3}/\text{s}
          \qquad
          Q_{\text{tub,ll}} = 13{,}37\ \text{m}^{3}/\text{s}
          $$
          $$
          \frac{Q_c}{Q_{\text{ll}}} = \frac{3}{13{,}37} = 0{,}224
          \;\Longrightarrow\;
          \frac{h_c}{D} = 0{,}322
          \;\Longrightarrow\;
          h_c = 0{,}80\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad con el caudal reducido
        pregunta: |
          ¿Y a qué velocidad?
        respuesta:
          tipo: magnitud
          valor: '2.197 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2.72 m/s'
            mensaje: |
              Esa es la velocidad a sección llena. Con el canal a un tercio de
              su capacidad, el radio hidráulico baja y la velocidad con él —un
              19 %, que es poco para semejante caída de caudal—.
          - valor: '1.22 m/s'
            mensaje: |
              Has dividido los $3\ \text{m}^{3}/\text{s}$ entre el área de la
              media caña **llena**, $2{,}45\ \text{m}^{2}$. El agua solo
              ocupa $1{,}37\ \text{m}^{2}$.
        pista: |
          El área mojada a $h_c = 0{,}80$ m, o el cociente
          $v_c/v_{\text{ll}}$ del cuadro n.º 27.
        desarrollo: |
          $$
          A_c = 1{,}37\ \text{m}^{2}
          \qquad
          v_c = \frac{3}{1{,}37} = 2{,}20\ \text{m/s}
          $$

          El boletín publica $h_c = 0{,}798$ m y $v_c = 2{,}185$ m/s; la
          diferencia con estos números es del 0,9 % y del 0,5 %.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              La óptima rectangular es $2{,}05\times 1{,}02$: área
              $2{,}10\ \text{m}^{2}$ y perímetro mojado $4{,}10$ m.
          - texto: >-
              La media caña equivalente tiene $D = 2{,}24$ m: área
              $1{,}97\ \text{m}^{2}$ y perímetro mojado $3{,}52$ m.
          - texto: >-
              La semicircular gana en las dos, así que es hidráulicamente
              mejor: menos perímetro es menos rozamiento y menos área es menos
              obra.
          - texto: >-
              Y su ventaja crece cuanto menos lleno vaya el canal, porque una
              sección redonda concentra el agua en el fondo.
            trampa: true
            mensaje: |
              Ocurre lo contrario. La ventaja del semicírculo es máxima
              **lleno**, que es cuando su radio hidráulico es máximo. A poco
              calado la lámina se extiende sobre un fondo curvo y muy ancho en
              relación con su profundidad, y el radio hidráulico se hunde: en
              el apartado d), con el canal a un 45 % de su caudal, $R_H$ baja
              de 0,625 a 0,453 m.

    resolucion: |
      **a) La óptima rectangular.** Con $A = 2h^{2}$ y $R_H = h/2$, Manning
      deja una sola incógnita:

      $$
      h = 1{,}024\ \text{m}
      \qquad
      b = 2{,}048\ \text{m}
      $$

      **b) La media caña equivalente.** $D = 2{,}242$ m.

      **c) Cuál es mejor.**

      | | área | perímetro mojado | $R_H$ |
      |---|---|---|---|
      | rectángulo óptimo | 2,10 m² | 4,10 m | 0,512 m |
      | media caña | 1,97 m² | 3,52 m | 0,561 m |

      El semicírculo gana un 6 % de área y un 14 % de perímetro. Y la
      comparación es honesta porque el rectángulo está en **su** óptimo: el
      semicírculo no le gana a un rectángulo mal hecho, le gana al mejor
      rectángulo que existe. Es la sección hidráulicamente óptima absoluta, y
      la razón es la misma por la que la pompa de jabón es esférica: encierra
      el máximo de área con el mínimo de contorno.

      **d) El apartado que cambia de pregunta.** Aquí el canal ya está
      construido —$D = 2{,}5$ m, más grande que los 2,24 necesarios— y el
      caudal ha bajado a 3 m³/s. La sección deja de estar llena y hay que ir
      al cuadro n.º 27, **con la tubería llena como referencia**:

      $$
      \frac{Q_c}{Q_{\text{ll}}} = \frac{3}{13{,}37} = 0{,}224
      \;\Longrightarrow\;
      h_c = 0{,}80\ \text{m}
      \qquad
      v_c = 2{,}20\ \text{m/s}
      $$

      **Y el número que hay que mirar.** El caudal ha bajado un 55 % respecto
      del de sección llena y la velocidad solo un 19 %. Esa es la propiedad
      que hace insustituibles a las secciones circulares en saneamiento: el
      colector que se dimensiona para la tormenta sigue arrastrando los
      sólidos el día que solo lleva aguas negras.

  # ── COLECCIÓN 8.15. Tres líneas, y la única sección en V del capítulo. Vale
  #    para comprobar que el radio hidráulico se sabe deducir y no solo
  #    recordar: aquí no hay fórmula que memorizar.
  - id: ejflu21-col815-el-canal-en-v
    titulo: El canal en V, donde no hay fórmula que recordar
    fuente: >-
      Ejercicio 8.15 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un canal abierto en forma de V, siendo el ángulo $90°$, transporta
      $45\ \text{l/s}$ cuando la profundidad es de $h = 230\ \text{mm}$.
      Calcular la pendiente del canal en milésimas.

      Dato: coeficiente de Manning $n = 0{,}013$.
    pide: La pendiente del canal, en milésimas.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una V de $90°$ con el vértice abajo y calado $h$, ¿cuánto valen
          el área y el perímetro mojados?
        opciones:
          - texto: >-
              $A = h^{2}$ y $P = 2h\sqrt2$, porque la superficie libre mide
              $2h$ de ancho y cada pared, $h\sqrt2$
            correcta: true
            mensaje: |
              Eso es. Con $90°$ entre las paredes, cada una forma $45°$ con la
              vertical: el ancho a la altura $h$ es $2h$ y el área del
              triángulo, $\frac{1}{2}\cdot 2h\cdot h = h^{2}$.
          - texto: >-
              $A = h^{2}/2$ y $P = 2h$, tomando la base igual al calado
            mensaje: |
              La base del triángulo no es $h$: es el ancho de la superficie
              libre, que con $90°$ vale $2h$. Y las paredes son las
              hipotenusas, no los catetos.
          - texto: >-
              $A = h^{2}$ y $P = 2h$, contando solo la proyección vertical de
              las paredes
            mensaje: |
              El perímetro mojado es la longitud real de pared en contacto con
              el agua, no su proyección. Cada pared inclinada $45°$ mide
              $h\sqrt2 = 1{,}41h$.

      - tipo: calcular
        titulo: El radio hidráulico
        pregunta: |
          ¿Cuánto vale $R_H$ con $h = 230\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '0.0813 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.115 m'
            mensaje: |
              Has usado $P = 2h$, sin el $\sqrt2$ de las paredes inclinadas.
              El perímetro real es un 41 % mayor.
          - valor: '0.23 m'
            mensaje: |
              Ese es el calado, no el radio hidráulico. En una V el radio
              hidráulico es bastante menor que la profundidad:
              $h^{2}/(2h\sqrt2) = h/(2\sqrt2) = 0{,}354\,h$.
        pista: |
          $R_H = A/P = h^{2}/(2h\sqrt2)$, y sale una fracción fija de $h$.
        desarrollo: |
          $$
          A = h^{2} = 0{,}0529\ \text{m}^{2}
          \qquad
          P = 2h\sqrt2 = 0{,}6505\ \text{m}
          $$
          $$
          R_H = \frac{0{,}0529}{0{,}6505} = 0{,}0813\ \text{m}
          = \frac{h}{2\sqrt2}
          $$

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuál es la pendiente del canal, en milésimas? (solo el número)
        respuesta:
          tipo: numero
          valor: '3.47'
          tolerancia: 0.05
          formato: un número en milésimas, sin unidades
        distractores:
          - valor: '2.19'
            mensaje: |
              Viene de haber usado $P = 2h$: con el perímetro corto el radio
              hidráulico sale mayor, el canal parece rendir más y hace falta
              menos pendiente.
          - valor: '35'
            mensaje: |
              Un factor diez, casi seguro por haber tomado $A = h^{2}/2$: al
              reducir el área a la mitad, la velocidad se dobla y la pendiente
              necesaria se multiplica por cuatro… y el radio hidráulico
              también cambia, con lo que el error se amplifica.
        pista: |
          $v = Q/A$ primero, y después Manning despejando $J$ — que va bajo
          raíz.
        desarrollo: |
          $$
          v = \frac{0{,}045}{0{,}0529} = 0{,}851\ \text{m/s}
          $$
          $$
          \sqrt J = \frac{v\,n}{R_H^{2/3}}
          = \frac{0{,}851\cdot 0{,}013}{0{,}0813^{2/3}} = 0{,}0589
          \;\Longrightarrow\;
          J = 3{,}47\ \text{milésimas}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $90°$ de abertura, $A = h^{2} = 0{,}0529$ m² y
              $P = 2h\sqrt2 = 0{,}65$ m.
          - texto: >-
              El radio hidráulico es $h/(2\sqrt2) = 0{,}081$ m, apenas un
              tercio del calado.
          - texto: >-
              De ahí $v = 0{,}85$ m/s y una pendiente de 3,47 milésimas.
          - texto: >-
              Y como el radio hidráulico es tan pequeño, la sección en V es la
              más eficiente para caudales pequeños.
            trampa: true
            mensaje: |
              Radio hidráulico pequeño es **ineficiencia**, no eficiencia: en
              Manning $R_H$ está en el numerador. La V se usa por otras
              razones —es fácil de excavar, y mantiene calado apreciable con
              caudales muy pequeños, que es lo que la hace buena como
              vertedero de aforo— pero hidráulicamente es de las peores
              formas.

    resolucion: |
      **La geometría, que es todo el ejercicio.** Con $90°$ de abertura y el
      vértice abajo, cada pared forma $45°$ con la vertical. A la profundidad
      $h$ la superficie libre mide $2h$ de ancho, así que

      $$
      A = \frac{1}{2}(2h)(h) = h^{2}
      \qquad
      P = 2\,h\sqrt2
      \qquad
      R_H = \frac{h}{2\sqrt2} = 0{,}354\,h
      $$

      Aquí no hay fórmula que recordar: hay que dibujar la sección. Los dos
      errores típicos —olvidar el $\sqrt2$ y tomar la base igual al calado—
      salen los dos de no dibujarla.

      **El cálculo.** $v = Q/A = 0{,}851$ m/s, y Manning despejando la
      pendiente:

      $$
      J = \left(\frac{v\,n}{R_H^{2/3}}\right)^{2} = 3{,}47\ \text{milésimas}
      $$

      **Y una comparación que sitúa el resultado.** Los mismos 45 l/s por una
      media caña de la misma área ($D = 0{,}367$ m) tendrían
      $R_H = 0{,}092$ m frente a los 0,081 de la V: un 13 % más, y con ello
      un 15 % menos de pendiente necesaria. **La V paga en pendiente lo que
      ahorra en excavación**, y por eso se usa en cunetas y acequias
      pequeñas y casi nunca en conducciones largas.

  # ── COLECCIÓN 8.16. Corto, y con una trampa de lectura que vale por todo el
  #    ejercicio: la restricción está en el 70 % del RADIO, no del diámetro.
  #    Quien lea «diámetro» dimensiona un canal un 35 % más pequeño.
  - id: ejflu21-col816-el-foso-del-castillo
    titulo: La acequia del foso, y el 70 % de qué
    fuente: >-
      Ejercicio 8.16 · Colección de Problemas, capítulo 8 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Mediante un canal semicircular de madera cepillada, cuya pendiente es 5
      milésimas, se desea suministrar un caudal de $6\ \text{m}^{3}/\text{s}$
      de agua al foso que rodea un castillo. Calcular el diámetro exacto del
      canal para que el calado sea como máximo el $70\ \%$ del **radio**.

      Dato: madera cepillada, $n = 0{,}012$ (cuadro n.º 26).
    pide: El diámetro exacto del canal.

    pasos:
      - tipo: reconocer
        pregunta: |
          «El calado será como máximo el 70 % del radio». ¿Qué fracción del
          diámetro es eso, y cuánto se llena la media caña?
        opciones:
          - texto: >-
              $h = 0{,}35\,D$, y como la media caña llena hasta $D/2$, la
              sección va al 70 % de su altura útil
            correcta: true
            mensaje: |
              Exacto. En una media caña la altura máxima **es** el radio, así
              que «70 % del radio» significa siete décimas de lo que cabe: el
              30 % restante es la berma.
          - texto: >-
              $h = 0{,}7\,D$, porque en un canal circular el calado se mide
              siempre sobre el diámetro
            mensaje: |
              El enunciado dice radio con todas las letras, y además $0{,}7D$
              sería imposible en una media caña: por encima de $D/2$ ya no hay
              canal. Este error da un diámetro un 35 % menor.
          - texto: >-
              $h = 0{,}35\,D$, y la sección va al 35 % de su altura útil
            mensaje: |
              La fracción de $D$ está bien y la de la altura útil, no. La
              altura útil de una media caña es $D/2 = 0{,}5D$, y
              $0{,}35/0{,}5 = 0{,}70$.

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Qué diámetro exacto hace falta?
        respuesta:
          tipo: magnitud
          valor: '2.57 m'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '1.666 m'
            mensaje: |
              Has tomado el 70 % del **diámetro**. Además de contradecir el
              enunciado, es geométricamente imposible: una media caña no llega
              a $0{,}7D$ de calado, porque su borde está en $0{,}5D$.
          - valor: '2.022 m'
            mensaje: |
              Has calculado a sección llena, $h = D/2$, sin dejar berma. Ese
              es el diámetro mínimo que pasaría el caudal, pero el enunciado
              exige que sobre un 30 % de altura.
        pista: |
          Con $h/D = 0{,}35$, el ángulo del segmento es
          $\theta = 2\arccos(1 - 2\cdot 0{,}35)$, y de ahí $A$ y $P$ en
          función de $D$.
        desarrollo: |
          $$
          \theta = 2\arccos(0{,}3) = 2{,}532\ \text{rad}
          $$
          $$
          A = \frac{D^{2}}{8}(\theta - \sin\theta) = 0{,}2447\,D^{2}
          \qquad
          P = \frac{D\theta}{2} = 1{,}266\,D
          \qquad
          R_H = 0{,}1933\,D
          $$
          $$
          6 = \frac{1}{0{,}012}\,0{,}2447D^{2}\,(0{,}1933D)^{2/3}
          \sqrt{0{,}005} = 0{,}4822\,D^{8/3}
          $$
          $$
          D^{8/3} = 12{,}44
          \;\Longrightarrow\;
          D = 2{,}57\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              «El 70 % del radio» es $h = 0{,}35\,D$: la media caña va a siete
              décimas de su altura útil y deja tres de berma.
          - texto: >-
              Con esa relación, el segmento mojado da $A = 0{,}2447\,D^{2}$ y
              $R_H = 0{,}1933\,D$.
          - texto: >-
              Manning deja todo en $D^{8/3}$ y sale $D = 2{,}57$ m; a sección
              llena habrían bastado 2,02.
          - texto: >-
              La berma del 30 % obliga por tanto a un diámetro un 30 % mayor.
            trampa: true
            mensaje: |
              Un 27 %, no un 30, y la coincidencia es engañosa: la relación no
              es proporcional. El caudal va con $D^{8/3}$ y con la forma del
              segmento a la vez, así que reservar tres décimas de altura no
              cuesta tres décimas de diámetro. Aquí cae cerca por casualidad;
              con una berma del 50 % el diámetro subiría un 63 %, no un 50.

    resolucion: |
      **La trampa está en una palabra.** «El 70 % del radio». En una media
      caña el calado máximo es el radio, así que la condición es
      $h = 0{,}7\cdot D/2 = 0{,}35\,D$. Leer «diámetro» donde dice «radio» da
      $D = 1{,}67$ m —un 35 % menos— y además pide una geometría imposible,
      porque una media caña no tiene dónde poner un calado de $0{,}7D$.

      **La geometría del segmento.** Con $h/D = 0{,}35$:

      $$
      \theta = 2\arccos\!\left(1 - \frac{2h}{D}\right) = 2{,}532\ \text{rad}
      \qquad
      A = 0{,}2447\,D^{2}
      \qquad
      R_H = 0{,}1933\,D
      $$

      **Manning.** Todo queda en $D$, y se despeja directo:

      $$
      D^{8/3} = \frac{6}{0{,}4822} = 12{,}44
      \;\Longrightarrow\;
      D = 2{,}57\ \text{m}
      $$

      **Lo que cuesta la berma.** A sección llena bastarían 2,02 m; con la
      berma hacen falta 2,57, un 27 % más de diámetro y un 62 % más de área
      excavada. Es mucho, y es la razón de que las bermas se justifiquen y no
      se pongan por costumbre: aquí la del 30 % está para que una crecida
      —o una hoja atravesada— no desborde la acequia dentro del recinto del
      castillo.
  - id: ejflu21-col84-el-calado-que-sale-de-una-razon
    titulo: El calado que sale de una razón, no de un despeje
    fuente: Ejercicio 8.4 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un canal de sección circular de diámetro 0,8 m está construido de un
      material con un coeficiente de Manning $n = 0{,}020$ y conduce 200 l/s.
      Calcular la altura de calado y la velocidad si la pendiente de la solera
      es 1 por 1200.
    pide: El calado de la lámina de agua y la velocidad del flujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Manning da el caudal a partir del calado. Aquí te dan el caudal y
          piden el calado. ¿Por qué no se despeja y ya está?
        opciones:
          - texto: |
              Porque el calado entra en el área y en el perímetro a través de un
              arco de circunferencia, y de ahí no sale despejado
            correcta: true
            mensaje: |
              Eso es. En un rectángulo el área es $bh$ y se puede despejar; en
              un círculo parcialmente lleno el calado entra dentro de un
              $\arccos$, y luego el resultado va elevado a $2/3$. No hay
              despeje. Por eso este caso se resuelve con el cuadro de razones,
              que es una forma de tener la inversa ya calculada.
          - texto: Porque falta la pendiente, y sin ella Manning no se puede usar
            mensaje: |
              La pendiente está dada: 1 por 1200, es decir $J = 8{,}33 \cdot 10^{-4}$.
              Lo que falta no es un dato, es el despeje.
          - texto: |
              Porque el caudal de 200 l/s está en litros y Manning necesita el
              sistema internacional
            mensaje: |
              Hay que pasarlo a m³/s, sí, pero eso es una conversión, no la
              dificultad. Con el caudal en las unidades correctas el calado
              sigue sin despejarse.
          - texto: |
              Porque en un canal circular no vale Manning: hay que usar
              Darcy-Weisbach como en las tuberías
            mensaje: |
              Manning vale siempre que haya lámina libre, y aquí la hay: el tubo
              no va lleno. Darcy-Weisbach es para conducciones en carga, donde
              la presión empuja; en un canal lo único que empuja es la gravedad.

      - tipo: calcular
        titulo: El caudal a sección llena
        pregunta: |
          El primer paso es el único que sí es directo: ¿cuánto llevaría esta
          tubería **llena**? Recuerda que el radio hidráulico de un círculo
          lleno es $D/4$. Da el resultado en l/s.
        respuesta:
          tipo: magnitud
          valor: '248.1 l/s'
          tolerancia: 0.005
          formato: el caudal a sección llena, en l/s
        distractores:
          - valor: '124.1 l/s'
            mensaje: |
              Has usado $R = D/8$, que es el radio hidráulico de la **media**
              sección. Lleno, el área es $\pi D^{2}/4$ y el perímetro $\pi D$:
              el cociente es $D/4$.
          - valor: '496.2 l/s'
            mensaje: |
              Parece que has usado $R = D/2$, el radio geométrico. El radio
              hidráulico no es el radio: es área entre perímetro mojado, y para
              un círculo lleno sale la mitad de eso.
        pista: |
          $A = \pi D^{2}/4$, $R = D/4$, $J = 1/1200$.
        desarrollo: |
          $$
          Q_{ll} = \frac{1}{0{,}020}\cdot\frac{\pi\,0{,}8^{2}}{4}
                   \cdot\left(\frac{0{,}8}{4}\right)^{2/3}
                   \cdot\sqrt{\frac{1}{1200}}
                 = 0{,}2481\ \text{m}^{3}/\text{s}
          $$

          Es decir 248,1 l/s. La tubería lleva 200, así que no va llena: va al
          80 % de su capacidad, y eso es lo que hay que traducir a calado.

      - tipo: calcular
        titulo: El calado
        pregunta: |
          La razón $Q_c/Q_{ll}$ vale 0,806. Entrando con ella en el cuadro de
          sección circular sale $h_c/D = 0{,}68$. ¿Cuál es el calado, en metros?
        respuesta:
          tipo: magnitud
          valor: '0.544 m'
          tolerancia: 0.01
          formato: el calado en metros
        distractores:
          - valor: '0.645 m'
            mensaje: |
              Has multiplicado el diámetro por la razón de **caudales** (0,806)
              en vez de por la de calados (0,68). Son dos números distintos y el
              cuadro sirve precisamente para pasar del uno al otro: el caudal no
              crece proporcionalmente al calado.
          - valor: '0.68 m'
            mensaje: |
              0,68 es la razón $h_c/D$, no el calado. Falta multiplicarla por el
              diámetro. Y fíjate en que 0,68 m sería casi el diámetro entero:
              imposible como lectura directa.
        pista: |
          $h_c = 0{,}68 \cdot D$.
        desarrollo: |
          $$
          \frac{Q_c}{Q_{ll}} = \frac{200}{248{,}1} = 0{,}806
          \;\longrightarrow\;
          \frac{h_c}{D} = 0{,}68
          \;\longrightarrow\;
          h_c = 0{,}68\cdot 0{,}8 = 0{,}544\ \text{m}
          $$

          Fíjate en la asimetría: llevando el **80 %** del caudal, el agua está
          al **68 %** de la altura. La tubería aprovecha mejor de lo que parece
          la parte de arriba.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          El mismo cuadro da $V_c/V_{ll} = 1{,}11$ para ese calado. ¿Cuál es la
          velocidad del flujo, en m/s?
        respuesta:
          tipo: magnitud
          valor: '0.55 m/s'
          tolerancia: 0.02
          formato: la velocidad en m/s
        distractores:
          - valor: '0.444 m/s'
            mensaje: |
              Has **dividido** entre 1,11 en vez de multiplicar. Y el sentido
              físico avisa: la razón es mayor que 1, así que el agua va **más
              deprisa** que si el tubo fuera lleno, no menos.
          - valor: '0.368 m/s'
            mensaje: |
              Parece que has hecho $Q/A$ con el área **llena**. El área mojada
              es menor que la llena, así que la velocidad sale mayor: 1,50 m² no,
              0,364 m².
        pista: |
          Primero $V_{ll} = Q_{ll}/A_{ll}$, y luego multiplica por 1,11.
        desarrollo: |
          $$
          V_{ll} = \frac{Q_{ll}}{A_{ll}} = \frac{0{,}2481}{0{,}5027}
                 = 0{,}493\ \text{m/s}
          \qquad
          V_c = 1{,}11\cdot 0{,}493 = 0{,}55\ \text{m/s}
          $$

          **Va más deprisa medio vacía que llena.** No es un error de lectura:
          al bajar de lleno a 0,68 se pierde algo de área pero se pierde
          proporcionalmente más perímetro mojado —desaparece toda la bóveda—,
          el radio hidráulico sube y con él la velocidad.

      - tipo: justificar
        pregunta: |
          Ordena el argumento de por qué el cuadro sirve para cualquier tubería.
          Una pieza es falsa.
        piezas:
          - texto: |
              El caudal a calado $h$ y el caudal a sección llena se calculan
              los dos con Manning, con **la misma** $n$ y la misma $J$.
          - texto: |
              Al dividir el uno entre el otro, $n$ y $\sqrt{J}$ se cancelan, y
              el diámetro también: lo que queda depende únicamente de $h/D$.
          - texto: |
              Por eso una sola curva vale para una acequia de 25 cm de PVC y
              para un colector de hormigón de metro y medio, y por eso el
              procedimiento es siempre el mismo: calcular $Q_{ll}$, formar la
              razón, entrar al cuadro.
          - texto: |
              Y hay un punto que se puede comprobar de cabeza: a media tubería
              el radio hidráulico es el mismo que lleno, así que la velocidad no
              cambia y el caudal es exactamente la mitad.
          - texto: |
              Como las razones no dependen del material, tampoco depende de él
              el calado: dos tuberías del mismo diámetro con el mismo caudal
              llevan el agua a la misma altura aunque una sea de hormigón y otra
              de tierra.
            trampa: true
            mensaje: |
              La primera mitad es cierta y la conclusión no se sigue. Las
              **razones** no dependen del material, pero $Q_{ll}$ sí: con una
              $n$ mayor la tubería llena lleva menos, la razón $Q_c/Q_{ll}$ sale
              mayor para el mismo caudal, y el calado sube. Un canal de tierra
              lleva la misma agua más alta que uno de hormigón.
    resolucion: |
      **Tres pasos, y el segundo no es una cuenta sino una lectura.**

      **1 · El caudal a sección llena**, que es lo único directo, porque un
      círculo lleno tiene $R = D/4$:

      $$
      Q_{ll} = \frac{1}{0{,}020}\cdot 0{,}5027\cdot 0{,}2^{2/3}
               \cdot\sqrt{1/1200} = 248{,}1\ \text{l/s}
      $$

      **2 · La razón, y el cuadro.**

      $$
      \frac{Q_c}{Q_{ll}} = \frac{200}{248{,}1} = 0{,}806
      \;\longrightarrow\;
      \frac{h_c}{D} = 0{,}68
      \;\qquad\;
      \frac{V_c}{V_{ll}} = 1{,}11
      $$

      **3 · Deshacer las razones.**

      $$
      h_c = 0{,}68\cdot 0{,}8 = 0{,}544\ \text{m}
      \qquad
      V_c = 1{,}11\cdot\frac{0{,}2481}{0{,}5027} = 0{,}55\ \text{m/s}
      $$

      **Los dos números raros, dichos aparte.** El primero: con el 80 % del
      caudal el agua está al 68 % de la altura. El segundo, y es el que más
      choca: **la velocidad es mayor que a sección llena**. Los dos tienen la
      misma explicación. Al no llenar el tubo desaparece la bóveda, que es
      perímetro mojado —rozamiento— sin apenas aportar área. El radio
      hidráulico sube, y con él la velocidad.

      Llevado al extremo, eso significa que el caudal máximo de una tubería
      **no** se da llena, sino sobre el 94 % del calado, con un 7,6 % más que
      llena. Está en el error típico del tema, y aquí lo estás viendo empezar.

  - id: ejflu21-col83-el-diametro-y-la-condicion-de-calado
    titulo: El diámetro que impone una condición de calado
    fuente: Ejercicio 8.3 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se desean conducir 120 l/s de agua con una pendiente de 1 milésima.

      a) Elegir el diámetro de la tubería de hormigón centrifugado
      ($n = 0{,}015$) para que se cumpla la relación $h_c/D \le 0{,}75$.
      Diámetros disponibles: 40, 45, 50 y 60 cm.

      b) Calcular el calado $h_c$ y la relación $h_c/D$.
    pide: El diámetro comercial, el calado y la relación de calado que resulta.
    pasos:
      - tipo: reconocer
        pregunta: |
          La condición está sobre el **calado** y lo que se elige es el
          **diámetro**. ¿Cómo se pasa de una cosa a la otra?
        opciones:
          - texto: |
              Traduciendo la condición de calado a una condición de caudal con
              el cuadro: $h_c/D = 0{,}75$ corresponde a $Q_c/Q_{ll} = 0{,}91$,
              y de ahí sale el $Q_{ll}$ mínimo
            correcta: true
            mensaje: |
              Ese es el giro del problema, y es el mismo cuadro leído al revés
              que en el ejercicio anterior. Allí se entraba con caudal y salía
              calado; aquí se entra con calado y sale caudal. La condición
              «no pases del 75 % de altura» se convierte en «no pases del 91 %
              de tu capacidad», y esa sí se puede imponer sobre el diámetro.
          - texto: |
              Calculando el calado para cada uno de los cuatro diámetros y
              quedándose con el primero que cumpla
            mensaje: |
              Funciona, y es más trabajo: son cuatro cuadros en vez de uno. Y
              además es más frágil, porque hay que leer bien las cuatro veces.
              Traducir la condición una sola vez deja el resto en aritmética.
          - texto: |
              Imponiendo que el calado sea 0,75 veces el diámetro dentro de la
              fórmula de Manning y despejando $D$
            mensaje: |
              Ahí está el problema de siempre: con $h = 0{,}75D$ el área y el
              perímetro siguen llevando el arco de circunferencia, y $D$ no sale
              despejado de dentro de un $\arccos$ y una potencia $2/3$ a la vez.
          - texto: |
              La condición $h_c/D \le 0{,}75$ no afecta al diámetro: es una
              recomendación de ventilación del colector
            mensaje: |
              Sí afecta, y mucho: es la que descarta los tres diámetros
              pequeños. Que además tenga sentido constructivo —dejar aire
              arriba— no la hace menos vinculante.

      - tipo: calcular
        titulo: El caudal a sección llena mínimo
        pregunta: |
          Con $h_c/D = 0{,}75$ el cuadro da $Q_c/Q_{ll} = 0{,}91$. Si la
          tubería tiene que llevar 120 l/s sin pasar de ahí, ¿cuál es el
          $Q_{ll}$ mínimo, en l/s?
        respuesta:
          tipo: magnitud
          valor: '131.9 l/s'
          tolerancia: 0.005
          formato: el caudal a sección llena, en l/s
        distractores:
          - valor: '109.2 l/s'
            mensaje: |
              Has multiplicado por 0,91 en vez de dividir. Piensa en el sentido:
              la tubería tiene que poder llevar **más** que 120 llena, porque
              solo se le va a pedir el 91 % de su capacidad.
          - valor: '160 l/s'
            mensaje: |
              Parece que has dividido entre 0,75, que es la razón de calados. La
              condición sobre el calado se traduce a una condición sobre el
              caudal, y ahí el número es 0,91, no 0,75.
        pista: |
          $Q_{ll} \ge 120/0{,}91$.
        desarrollo: |
          $$
          \frac{Q_c}{Q_{ll}} \le 0{,}91
          \;\Longrightarrow\;
          Q_{ll} \ge \frac{120}{0{,}91} = 131{,}9\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Cuál es el diámetro comercial más pequeño cuyo $Q_{ll}$ llega a
          131,9 l/s, con $n = 0{,}015$ y $J = 1$ milésima? Da el diámetro en cm.
        respuesta:
          tipo: magnitud
          valor: '60 cm'
          tolerancia: 0.02
          formato: el diámetro en cm
        distractores:
          - valor: '50 cm'
            mensaje: |
              El de 50 cm da $Q_{ll} = 103{,}5$ l/s, y ni siquiera llega a los
              120 que hay que transportar: iría lleno y aun así se quedaría
              corto. Es el salto de 50 a 60 el que resuelve el ejercicio, y por
              eso el enunciado ofrece esos cuatro y no otros.
          - valor: '45 cm'
            mensaje: |
              78,1 l/s a sección llena, muy lejos. Fíjate en cómo crece el
              caudal con el diámetro: va con $D^{8/3}$, así que subir de 45 a 60
              —un tercio más de diámetro— más que duplica el caudal.
        pista: |
          Prueba los cuatro. El caudal crece con $D^{8/3}$, muy deprisa.
        desarrollo: |
          | $D$ | $Q_{ll}$ |
          |---|---|
          | 40 cm | 57,1 l/s |
          | 45 cm | 78,1 l/s |
          | 50 cm | 103,5 l/s |
          | **60 cm** | **168,3 l/s** |

          Solo el de 60 cm supera los 131,9 l/s necesarios. Y no por poco: le
          sobra un 28 %.

      - tipo: calcular
        titulo: El calado que resulta
        pregunta: |
          Con $D = 60$ cm, la razón real es $Q_c/Q_{ll} = 120/168{,}3 = 0{,}713$,
          que el cuadro traduce en $h_c/D = 0{,}624$. ¿Cuál es el calado, en cm?
        respuesta:
          tipo: magnitud
          valor: '37.4 cm'
          tolerancia: 0.02
          formato: el calado en cm
        distractores:
          - valor: '45 cm'
            mensaje: |
              45 cm es $0{,}75 \cdot 60$, o sea el calado **límite** que se
              impuso al principio. El real es menor, porque el diámetro elegido
              tenía margen de sobra: la condición se cumple con holgura.
          - valor: '42.8 cm'
            mensaje: |
              Has usado 0,713, la razón de caudales, en vez de 0,624, la de
              calados. Es el mismo cambio que en el ejercicio anterior: el
              cuadro existe justamente para no confundirlas.
        pista: |
          $h_c = 0{,}624 \cdot 60$ cm.
        desarrollo: |
          $$
          h_c = 0{,}624\cdot 60 = 37{,}4\ \text{cm}
          \qquad
          \frac{h_c}{D} = 0{,}62 \;<\; 0{,}75 \quad\checkmark
          $$

          La condición se cumple con margen, y era de esperar: el salto de
          diámetros comerciales de 50 a 60 cm es grande, así que el que cumple
          cumple sobrado.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado a). Una pieza es falsa.
        piezas:
          - texto: |
              La condición se da sobre el calado, así que lo primero es
              traducirla a caudal: $h_c/D = 0{,}75$ es $Q_c/Q_{ll} = 0{,}91$.
          - texto: |
              De ahí sale la capacidad mínima que se le pide a la tubería:
              $Q_{ll} \ge 120/0{,}91 = 131{,}9$ l/s.
          - texto: |
              De los cuatro diámetros disponibles solo el de 60 cm la alcanza
              —168,3 l/s—, así que ese es el elegido.
          - texto: |
              Y con él la condición se cumple de sobra: el calado real queda en
              0,62 del diámetro, trece puntos por debajo del límite.
          - texto: |
              El de 50 cm se descarta por incumplir la condición de calado, pero
              serviría si no existiera esa condición, porque su capacidad a
              sección llena supera los 120 l/s que hay que llevar.
            trampa: true
            mensaje: |
              No los supera: el de 50 cm da 103,5 l/s a sección llena, por
              debajo de los 120 que hay que transportar. Ni siquiera lleno
              serviría, así que no lo descarta la condición de calado: lo
              descarta la capacidad. La condición solo hace falta para pensar
              **antes** de probar diámetros.
    resolucion: |
      **El mismo cuadro, leído en el otro sentido.**

      En el problema anterior se entraba con el caudal y salía el calado. Aquí
      la incógnita es el diámetro, y la condición viene dada sobre el calado:
      hay que traducirla.

      **a) El diámetro.**

      $$
      \frac{h_c}{D} \le 0{,}75
      \;\longrightarrow\;
      \frac{Q_c}{Q_{ll}} \le 0{,}91
      \;\longrightarrow\;
      Q_{ll} \ge \frac{120}{0{,}91} = 131{,}9\ \text{l/s}
      $$

      Con $n = 0{,}015$ y $J = 10^{-3}$, los cuatro diámetros dan 57,1 · 78,1 ·
      103,5 · 168,3 l/s. **$D = 60$ cm.**

      **b) El calado real.**

      $$
      \frac{Q_c}{Q_{ll}} = \frac{120}{168{,}3} = 0{,}713
      \;\longrightarrow\;
      \frac{h_c}{D} = 0{,}62
      \;\longrightarrow\;
      h_c = 37{,}4\ \text{cm}
      $$

      **Lo que enseña sobre diámetros comerciales.** El caudal crece con
      $D^{8/3}$: subir un escalón de diámetro no es un ajuste fino, es un salto
      grande. Aquí el de 50 cm no llega ni a mover el caudal pedido y el de 60
      le sobra un 28 %. Por eso en estos problemas nunca sale «justo»: lo
      normal es descartar el anterior por poco o por mucho y aceptar el
      siguiente con holgura.

  - id: ejflu21-col812-la-acequia-con-el-nivel-limitado
    titulo: La acequia con el nivel limitado
    fuente: Ejercicio 8.12 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Diseñar un canal semicircular, de madera sin cepillar, con una pendiente
      de 10 milésimas, para que pueda transportar un caudal de 400 l/s. El
      nivel de agua no debe superar el 38 % del diámetro. Calcular el nivel de
      agua $h$ y la velocidad del flujo $v_c$. Diámetros comerciales: 70, 80,
      90, 100, 110 y 120 cm.

      El coeficiente de Manning de la madera sin cepillar es $n = 0{,}013$.
    pide: El diámetro comercial, el nivel de agua y la velocidad del flujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          «El nivel de agua no debe superar el 38 % del diámetro.» ¿Qué papel
          juega esa frase en el diseño?
        opciones:
          - texto: |
              Fija el punto de trabajo: el diámetro se elige para que el caudal
              de diseño quepa **sin pasar** de ese calado, no para que quepa a
              secas
            correcta: true
            mensaje: |
              Exacto. Sin esa frase bastaría el tubo más pequeño que llevase
              400 l/s. Con ella hay que buscar el más pequeño que lleve 400 l/s
              **estando solo al 38 %**, que es bastante mayor. Lo que sobra
              arriba es la berma o resguardo, y no es desperdicio: es lo que
              absorbe una avenida y lo que ventila el canal.
          - texto: |
              Es una condición sobre la velocidad disfrazada, para que el agua
              no erosione la madera
            mensaje: |
              La erosión se limita con una condición sobre la velocidad, y
              cuando la hay el enunciado la dice en m/s. Esta habla de altura.
          - texto: |
              Significa que hay que calcular con un caudal un 38 % del de
              diseño
            mensaje: |
              Al revés de dos maneras. El 38 % es de la **altura**, no del
              caudal, y el caudal de diseño se transporta entero: lo que se
              limita es a qué altura lo hace.
          - texto: |
              Es el margen de error de la fórmula de Manning para canales de
              madera
            mensaje: |
              Manning no lleva margen de error tabulado por materiales: la
              incertidumbre está dentro de la $n$. Esto es una condición de
              diseño puesta por quien encarga el canal.

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          Al 38 % del calado, una tubería lleva el 30,6 % de lo que llevaría
          llena. ¿Cuál es el diámetro comercial más pequeño que transporta los
          400 l/s en esas condiciones? Da el diámetro en cm.
        respuesta:
          tipo: magnitud
          valor: '80 cm'
          tolerancia: 0.02
          formato: el diámetro en cm
        distractores:
          - valor: '70 cm'
            mensaje: |
              El de 70 cm llevaría 926 l/s lleno, más que de sobra… pero al 38 %
              del calado solo lleva 284 l/s, y hacen falta 400. Es justamente el
              error que la condición de nivel está ahí para provocar: sobra
              capacidad y falta altura.
          - valor: '90 cm'
            mensaje: |
              El de 90 cumple —555 l/s al 38 %—, pero no es el más pequeño que
              lo hace: el de 80 da 405 l/s, que ya pasa de los 400. Se pide el
              mínimo, y aquí la diferencia es un tubo un 27 % más caro en
              material.
        pista: |
          $Q_{ll}$ para cada diámetro, multiplicado por 0,306, comparado con 400.
        desarrollo: |
          | $D$ | $Q_{ll}$ | al 38 % del calado |
          |---|---|---|
          | 70 cm | 926 l/s | 284 l/s |
          | **80 cm** | **1322 l/s** | **405 l/s** |
          | 90 cm | 1810 l/s | 555 l/s |

          El de 80 cm es el primero que pasa de 400, y por muy poco: 405 l/s
          contra 400. **$D = 80$ cm.**

      - tipo: calcular
        titulo: El nivel de agua y la velocidad
        pregunta: |
          Con $D = 80$ cm la razón real es $Q_c/Q_{ll} = 400/1322 = 0{,}3025$,
          que corresponde a $h/D = 0{,}377$. ¿Cuál es el nivel de agua, en
          metros?
        respuesta:
          tipo: magnitud
          valor: '0.30 m'
          tolerancia: 0.02
          formato: el nivel de agua en metros
        distractores:
          - valor: '0.242 m'
            mensaje: |
              Has usado 0,3025 —la razón de caudales— como razón de calados. En
              esta zona baja del cuadro las dos se separan mucho: al 37,7 % de
              altura solo va el 30,2 % del caudal, porque el fondo del tubo es
              estrecho.
          - valor: '0.377 m'
            mensaje: |
              0,377 es la **razón** $h/D$, no una longitud: falta multiplicarla
              por el diámetro. Y hay una comprobación que lo caza sola: 0,377 m
              sería casi la mitad de un tubo de 80 cm, cuando la condición
              obligaba a quedarse por debajo del 38 % de la altura.
        pista: |
          $h = 0{,}377\cdot 0{,}80$.
        desarrollo: |
          $$
          h = 0{,}377\cdot 0{,}80 = 0{,}30\ \text{m}
          \qquad
          v_c = \frac{V_c}{V_{ll}}\cdot V_{ll} = 0{,}876\cdot 2{,}63 = 2{,}30\ \text{m/s}
          $$

          El nivel queda en 30 cm, justo por debajo de los 30,4 cm que permitía
          la condición. Que salga tan ajustado no es casualidad: el de 80 cm era
          el diámetro **mínimo** que cumplía, así que trabaja casi en el límite.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del diseño. Una pieza es falsa.
        piezas:
          - texto: |
              La condición de nivel convierte el problema: no basta con que el
              tubo pueda llevar 400 l/s, tiene que llevarlos sin pasar del 38 %
              de su altura.
          - texto: |
              Al 38 % del calado una tubería circular lleva solo el 30,6 % de su
              caudal a sección llena, así que hace falta una capacidad de
              $400/0{,}306 = 1307$ l/s.
          - texto: |
              El menor diámetro comercial que la alcanza es el de 80 cm, con
              1322 l/s a sección llena.
          - texto: |
              Con él, el nivel real queda en 30 cm —el 37,7 % del diámetro,
              justo por debajo del límite— y la velocidad en 2,30 m/s.
          - texto: |
              La velocidad de 2,30 m/s es menor que la que tendría el mismo tubo
              a sección llena, porque al ir con menos agua hay menos empuje.
            trampa: true
            mensaje: |
              El número es correcto —2,30 frente a 2,63 llena— y la razón es
              falsa, que es lo que hay que cazar. No es «menos empuje»: en un
              canal el empuje por unidad de peso lo pone la pendiente y no
              cambia. Es el **radio hidráulico**, que al 38 % de calado vale
              menos que lleno porque el fondo estrecho es casi todo perímetro
              mojado. Y prueba de que la explicación falsa no vale: entre el 50 %
              y el 94 % de calado la velocidad es **mayor** que llena, con la
              misma pendiente y menos agua.
    resolucion: |
      **Un diseño donde manda la altura, no la capacidad.**

      La condición «el nivel no debe superar el 38 % del diámetro» es la que
      hace el problema. Sin ella, el tubo de 70 cm sobraría: lleva 926 l/s
      lleno contra los 400 que se piden. Con ella no llega, porque a esa altura
      solo lleva 284.

      **El diámetro.** Al 38 % de calado, $Q_c/Q_{ll} = 0{,}306$. Hace falta
      entonces

      $$
      Q_{ll} \ge \frac{400}{0{,}306} = 1307\ \text{l/s}
      $$

      y con $n = 0{,}013$ y $J = 10^{-2}$ el primer diámetro comercial que la
      alcanza es **80 cm** (1322 l/s).

      **El punto de trabajo real.**

      $$
      \frac{Q_c}{Q_{ll}} = \frac{400}{1322} = 0{,}3025
      \;\longrightarrow\;
      \frac{h}{D} = 0{,}377
      \;\longrightarrow\;
      h = 0{,}30\ \text{m}
      \qquad
      v_c = 2{,}30\ \text{m/s}
      $$

      **Por qué el enunciado limita el nivel.** Un canal que va casi lleno no
      tiene margen. Y en sección circular hay una razón añadida, que es el
      error típico del tema: el caudal máximo no se da lleno sino sobre el 94 %
      del calado, así que un canal calculado para ir lleno trabaja pasado el
      máximo, donde subir el nivel **baja** el caudal. Las bermas del 15 %, del
      30 % o el 38 % de este enunciado son todas la misma precaución escrita
      con números distintos.

  - id: ejflu21-col818-la-pendiente-que-se-deduce-del-calado
    titulo: La pendiente que se deduce del calado
    fuente: Ejercicio 8.18 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Por un canal de arena, de sección circular y 1,6 m de diámetro, discurre
      un caudal de agua de 3,7 m³/s. El calado del flujo es de 1,12 m. Se pide:

      a) Calcular la pendiente exacta del canal en milésimas y la velocidad del
      flujo.

      En otro punto de la instalación se pretende instalar un canal con la
      sección hidráulicamente óptima rectangular, con una pendiente de 5
      milésimas. El caudal de agua y el material del canal se mantienen igual
      que en el apartado anterior. Se pide:

      b) Calcular las dimensiones de la sección transversal del canal.

      El coeficiente de Manning de la arena es $n = 0{,}020$.
    pide: La pendiente y la velocidad del canal circular, y las dimensiones del rectángulo óptimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Este problema no se resuelve con el cuadro de razones, aunque el canal
          sea circular. ¿Por qué?
        opciones:
          - texto: |
              Porque aquí el calado es un **dato**: con $h$ y $D$ conocidos, el
              área y el perímetro se calculan directamente y Manning se despeja
              en $J$
            correcta: true
            mensaje: |
              Eso es. El cuadro sirve para lo que no se despeja, que es sacar el
              calado del caudal. Al revés —del calado a todo lo demás— la
              geometría es directa: el ángulo sale de un $\arccos$, el área y el
              perímetro salen del ángulo, y $J$ sale despejada de Manning
              elevando al cuadrado. El cuadro aquí solo daría error de lectura.
          - texto: |
              Porque el cuadro solo vale para tuberías de hormigón, y esta es de
              arena
            mensaje: |
              El cuadro no depende del material: es justamente su gracia, las
              razones se calculan dividiendo y la $n$ se cancela. Lo que cambia
              aquí es qué se conoce y qué se busca.
          - texto: Porque el canal no es cerrado, y el cuadro es para tuberías
            mensaje: |
              «Canal de sección circular» y «tubería que no va llena» son lo
              mismo desde el punto de vista hidráulico: hay lámina libre y la
              geometría mojada es un segmento circular. El cuadro valdría.
          - texto: |
              Porque falta la pendiente, y sin ella no se puede calcular el
              radio hidráulico
            mensaje: |
              El radio hidráulico es pura geometría: área entre perímetro
              mojado. No necesita la pendiente para nada — y por eso se puede
              calcular primero y despejar la pendiente después.

      - tipo: calcular
        titulo: El radio hidráulico
        pregunta: |
          Con $D = 1{,}6$ m y $h = 1{,}12$ m, el ángulo mojado es
          $\theta = 2\arccos(1-2h/D) = 3{,}965$ rad. ¿Cuánto vale el radio
          hidráulico, en metros?
        respuesta:
          tipo: magnitud
          valor: '0.474 m'
          tolerancia: 0.01
          formato: el radio hidráulico en metros
        distractores:
          - valor: '0.4 m'
            mensaje: |
              0,4 m es $D/4$, el radio hidráulico a **sección llena**. Aquí el
              tubo va al 70 % y el radio hidráulico es mayor, no igual: falta la
              bóveda, que es perímetro sin área.
          - valor: '0.8 m'
            mensaje: |
              0,8 m es el radio geométrico. El hidráulico es área entre
              perímetro mojado, y no coincide con ningún radio de la figura.
          - valor: '1.503 m'
            mensaje: |
              Eso es el área en m², no el radio. Falta dividir entre el
              perímetro mojado, 3,172 m.
        pista: |
          $A = (D^{2}/8)(\theta-\operatorname{sen}\theta)$ y $P = D\theta/2$.
        desarrollo: |
          $$
          A = \frac{1{,}6^{2}}{8}\,(3{,}965 - \operatorname{sen}3{,}965)
            = 0{,}32\cdot 4{,}698 = 1{,}503\ \text{m}^{2}
          $$

          $$
          P = \frac{1{,}6\cdot 3{,}965}{2} = 3{,}172\ \text{m}
          \qquad
          R = \frac{1{,}503}{3{,}172} = 0{,}474\ \text{m}
          $$

          Nota que $\operatorname{sen}3{,}965$ es **negativo** ($-0{,}726$), así
          que en la resta se suma. Es el fallo de signo más habitual de esta
          fórmula, y se detecta solo: si el área te sale menor que la mitad del
          círculo con el tubo al 70 %, has restado donde tocaba sumar.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          Despeja $J$ de Manning y da la pendiente **en milésimas**.
        respuesta:
          tipo: magnitud
          valor: '6.56 mm/m'
          tolerancia: 0.01
          formato: la pendiente en milésimas, o sea en mm/m
        distractores:
          - valor: '81.0 mm/m'
            mensaje: |
              Te has dejado el cuadrado. De Manning sale $\sqrt{J} = 0{,}081$, y
              lo que se pide es $J$: hay que elevar al cuadrado, y sale
              $6{,}56\cdot 10^{-3}$.
          - valor: '2.19 mm/m'
            mensaje: |
              Parece que has usado el área o el radio a sección llena. Con la
              geometría real —$A = 1{,}503$ m², $R = 0{,}474$ m— sale 6,56.
        pista: |
          $\sqrt{J} = Q n / (A R^{2/3})$, y una milésima es $10^{-3}$.
        desarrollo: |
          $$
          \sqrt{J} = \frac{Q\,n}{A\,R^{2/3}}
                   = \frac{3{,}7\cdot 0{,}020}{1{,}503\cdot 0{,}474^{2/3}}
                   = \frac{0{,}074}{0{,}9128} = 0{,}0810
          $$

          $$
          J = 0{,}0810^{2} = 6{,}56\cdot 10^{-3} = 6{,}56\ \text{milésimas}
          $$

          Y la velocidad, que ya no necesita a Manning para nada:

          $$
          V = \frac{Q}{A} = \frac{3{,}7}{1{,}503} = 2{,}46\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La solera del rectángulo óptimo
        pregunta: |
          El apartado b) cambia a sección rectangular **hidráulicamente
          óptima**, con $J = 5$ milésimas, mismo caudal y mismo material.
          ¿Cuánto mide la solera $b$, en metros?
        respuesta:
          tipo: magnitud
          valor: '1.866 m'
          tolerancia: 0.01
          formato: la solera en metros
        distractores:
          - valor: '0.933 m'
            mensaje: |
              Eso es el calado $h$, no la solera. En el rectángulo óptimo
              $b = 2h$: el canal es el doble de ancho que de hondo, media
              cuadrado. Está calculado bien, pero has contestado la otra mitad.
          - valor: '3.731 m'
            mensaje: |
              Has puesto $h = b/2$ del revés, o has multiplicado dos veces por 2.
              El óptimo rectangular es ancho y poco profundo: $b = 2h$, no
              $h = 2b$.
        pista: |
          En el óptimo, $b = 2h$ y $R = h/2$. Sustituye en Manning y despeja $h$.
        desarrollo: |
          En el rectángulo hidráulicamente óptimo la solera es el doble del
          calado, y entonces el radio hidráulico es la mitad del calado:

          $$
          A = 2h^{2}
          \qquad
          R = \frac{2h^{2}}{2h+2h} = \frac{h}{2}
          $$

          $$
          3{,}7 = \frac{1}{0{,}020}\cdot 2h^{2}\cdot\left(\frac{h}{2}\right)^{2/3}
                  \cdot\sqrt{0{,}005}
          \;\Longrightarrow\;
          h = 0{,}933\ \text{m}
          $$

          $$
          b = 2h = 1{,}866\ \text{m}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la comparación entre las dos secciones. Una pieza es falsa.
        piezas:
          - texto: |
              El canal circular lleva 3,7 m³/s a 2,46 m/s con una pendiente de
              6,56 milésimas y un área mojada de 1,503 m².
          - texto: |
              El rectángulo óptimo lleva el mismo caudal con una pendiente
              menor —5 milésimas— y una sección de 1,866 × 0,933 m, es decir
              1,741 m².
          - texto: |
              Es decir: el rectángulo mueve el mismo caudal con **menos
              pendiente**, y a cambio necesita **más sección** y va más despacio
              —2,13 m/s frente a 2,46—. Menos desnivel se paga con más
              excavación, y esa es la elección real.
          - texto: |
              Y eso deja claro que «hidráulicamente óptima» no significa «la
              mejor de todas las secciones»: significa la mejor **dentro de su
              tipología**. El rectángulo óptimo sigue siendo peor que un
              semicírculo.
          - texto: |
              Como el rectángulo es el óptimo, con la misma pendiente de 6,56
              milésimas llevaría más caudal que el circular con menos área: el
              óptimo lo es frente a cualquier sección.
            trampa: true
            mensaje: |
              El óptimo lo es **dentro de su familia**: entre todos los
              rectángulos, el de $b = 2h$ es el que menos perímetro mojado tiene
              para un área dada. No lo es frente a otras formas. El semicírculo
              gana a cualquier rectángulo, porque de todas las figuras es la que
              menos perímetro encierra por unidad de área, y por eso los
              enunciados que buscan lo mejor de verdad piden media caña.
    resolucion: |
      **Dos secciones, y el cuadro no hace falta en ninguna.**

      **a) El canal circular.** El calado es dato, así que la geometría es
      directa. Con $y = h/D = 0{,}70$:

      $$
      \theta = 2\arccos(1-2y) = 3{,}965\ \text{rad}
      \qquad
      A = \frac{D^{2}}{8}(\theta-\operatorname{sen}\theta) = 1{,}503\ \text{m}^{2}
      \qquad
      P = \frac{D\theta}{2} = 3{,}172\ \text{m}
      $$

      $$
      R = 0{,}474\ \text{m}
      \qquad
      \sqrt{J} = \frac{Qn}{AR^{2/3}} = 0{,}0810
      \qquad
      J = 6{,}56\ \text{milésimas}
      $$

      $$
      V = \frac{Q}{A} = 2{,}46\ \text{m/s}
      $$

      **b) El rectángulo óptimo.** $b = 2h$, $R = h/2$, y Manning con
      $J = 5$ milésimas:

      $$
      3{,}7 = \frac{2h^{2}}{0{,}020}\left(\frac{h}{2}\right)^{2/3}\sqrt{0{,}005}
      \;\Longrightarrow\;
      h = 0{,}933\ \text{m}
      \qquad
      b = 1{,}866\ \text{m}
      $$

      **Lo que compara el problema sin decirlo.** Los dos llevan 3,7 m³/s, y
      así quedan:

      | | pendiente | área | velocidad |
      |---|---|---|---|
      | circular, $D = 1{,}6$ m | 6,56 milésimas | 1,503 m² | 2,46 m/s |
      | rectángulo óptimo | 5 milésimas | 1,741 m² | 2,13 m/s |

      El rectángulo se conforma con **menos pendiente** y a cambio pide **más
      sección**. No es una casualidad ni una contradicción: menos pendiente es
      menos empuje, menos velocidad, y para el mismo caudal eso obliga a más
      área. La elección real es esa — desnivel de terreno contra volumen de
      excavación—, y ningún criterio hidráulico la decide solo.

      Y una advertencia sobre la palabra «óptima». Es óptima **entre los
      rectángulos**, no entre todas las formas. La forma que menos perímetro
      mojado tiene para un área dada es siempre el semicírculo, y por eso los
      enunciados que buscan de verdad lo mejor piden media caña. «Óptima» aquí
      es una condición de forma, como decir «cuadrado»: no es un superlativo.
  - id: ejflu21-col88-la-condicion-que-no-decide
    titulo: La acequia de PVC, y la condición que no decide nada
    fuente: Ejercicio 8.8 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Diseñar una acequia semicircular de PVC, que con una pendiente de 16
      milésimas tenga una capacidad hidráulica de 230 l/s. Es necesaria una
      berma mínima del 15 % del diámetro. La velocidad de circulación no puede
      ser superior a 3,5 m/s. Diámetros comerciales: 25, 30, 35, 40, 45, 50, 60,
      70 y 80 cm.

      El coeficiente de Manning del PVC es $n = 0{,}009$.
    pide: El diámetro comercial, la velocidad de circulación y la relación de calado.
    pasos:
      - tipo: reconocer
        pregunta: |
          La acequia es **semicircular**: media caña, no un tubo entero. ¿Qué
          significa entonces «berma mínima del 15 % del diámetro»?
        opciones:
          - texto: |
              Que el agua no puede pasar del 35 % del diámetro, porque la
              acequia solo llega hasta la mitad y hay que dejar libre un 15 %
            correcta: true
            mensaje: |
              Eso es. Una media caña de diámetro $D$ tiene su borde a $D/2$; si
              hay que dejar un 15 % de $D$ sin agua, el calado máximo es
              $0{,}5D - 0{,}15D = 0{,}35D$. Es la cuenta que más se falla de
              este enunciado, y no por difícil: por leer «berma del 15 %» y
              restar el 15 % de la mitad en vez del 15 % del diámetro.
          - texto: Que el agua no puede pasar del 85 % del diámetro
            mensaje: |
              Eso valdría para un tubo cerrado, donde el agua sí puede llegar
              hasta $D$. Aquí la acequia es media caña: por encima de $D/2$ no
              hay canal, hay aire.
          - texto: Que el calado no puede pasar del 15 % del diámetro
            mensaje: |
              La berma es lo que se deja **libre**, no lo que se llena. Con esa
              lectura harían falta tubos enormes: al 15 % del calado una sección
              circular apenas lleva el 6 % de su capacidad.
          - texto: |
              Que hay que dejar 15 cm de resguardo por encima de la lámina de
              agua
            mensaje: |
              Sería así si el enunciado diera una longitud. Dice «del 15 % del
              diámetro», así que la berma crece con el tubo: 3,75 cm en el de 25
              y 12 cm en el de 80.

      - tipo: calcular
        titulo: El diámetro comercial
        pregunta: |
          Al 35 % del calado una sección circular lleva el 26,3 % de su caudal a
          sección llena. ¿Cuál es el diámetro comercial más pequeño que
          transporta 230 l/s cumpliendo la berma? Da el diámetro en cm.
        respuesta:
          tipo: magnitud
          valor: '60 cm'
          tolerancia: 0.02
          formato: el diámetro en cm
        distractores:
          - valor: '35 cm'
            mensaje: |
              El de 35 cm sí llega en caudal —267 l/s a sección llena, más que
              los 230— pero lo hace con el agua al 72 % de la altura, o sea muy
              por encima del borde de una media caña. Es el error que la berma
              está ahí para evitar: comprobar la capacidad y olvidar el nivel.
          - valor: '50 cm'
            mensaje: |
              Con 50 cm el calado queda al 39,8 % del diámetro, todavía por
              encima del 35 % que permite la berma. Falta un escalón.
          - valor: '70 cm'
            mensaje: |
              El de 70 cumple, pero no es el más pequeño que lo hace: el de 60
              deja el agua al 30,7 %, dentro del límite. Se pide el mínimo.
        pista: |
          $Q_{ll} \ge 230/0{,}263$, y luego comprueba el calado de cada uno.
        desarrollo: |
          | $D$ | $Q_{ll}$ | $h/D$ que resulta | ¿berma? |
          |---|---|---|---|
          | 35 cm | 267 l/s | 0,717 | no |
          | 40 cm | 381 l/s | 0,561 | no |
          | 45 cm | 521 l/s | 0,465 | no |
          | 50 cm | 690 l/s | 0,398 | no |
          | **60 cm** | **1122 l/s** | **0,307** | **sí** |

          Hace falta el de 60 cm, que a sección llena llevaría casi cinco veces
          el caudal de diseño. No es despilfarro: es lo que cuesta llevar el
          agua a media caña y con resguardo.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          Con $D = 60$ cm y $h/D = 0{,}303$, ¿cuál es la velocidad de
          circulación, en m/s?
        respuesta:
          tipo: magnitud
          valor: '3.094 m/s'
          tolerancia: 0.02
          formato: la velocidad en m/s
        distractores:
          - valor: '3.968 m/s'
            mensaje: |
              Esa es la velocidad a **sección llena**. A este calado el radio
              hidráulico es bastante menor que $D/4$ —el agua va por el fondo,
              que es estrecho—, así que la velocidad baja: $V/V_{ll} = 0{,}78$.
          - valor: '0.813 m/s'
            mensaje: |
              Parece $Q/A_{ll}$: el caudal repartido en el área **llena**. El
              área mojada es mucho menor, así que la velocidad real es casi
              cuatro veces mayor.
        pista: |
          $V_{ll} = (1/n)(D/4)^{2/3}\sqrt{J}$, y luego por $V/V_{ll} = 0{,}78$.
        desarrollo: |
          $$
          V_{ll} = \frac{1}{0{,}009}\left(\frac{0{,}60}{4}\right)^{2/3}
                   \sqrt{0{,}016} = 3{,}967\ \text{m/s}
          $$

          $$
          v_c = 0{,}780 \cdot 3{,}967 = 3{,}094\ \text{m/s} \;<\; 3{,}5 \quad\checkmark
          $$

      - tipo: justificar
        pregunta: |
          El enunciado impone dos condiciones. Ordena lo que se puede decir
          sobre ellas. Una pieza es falsa.
        piezas:
          - texto: |
              La berma es la que decide: obliga a que el calado no pase del
              35 % del diámetro, y eso descarta los cuatro diámetros que van de
              35 a 50 cm aunque los cuatro tengan capacidad de sobra.
          - texto: |
              El límite de velocidad, en cambio, **no descarta ninguno**: los
              cinco diámetros que llevan los 230 l/s lo hacen entre 3,12 y
              3,17 m/s, todos por debajo de 3,5.
          - texto: |
              Y esa constancia tiene explicación: al subir el diámetro sube la
              velocidad a sección llena, pero baja el calado relativo y con él
              la razón $V/V_{ll}$. Los dos efectos casi se cancelan.
          - texto: |
              Así que la respuesta al diseño es 60 cm por la berma, y el límite
              de velocidad hay que comprobarlo igual — pero saber que no manda
              ahorra volver atrás.
          - texto: |
              Si en vez de PVC la acequia fuera de hormigón en bruto, la
              velocidad seguiría siendo la misma: la $n$ se cancela al formar
              las razones del cuadro.
            trampa: true
            mensaje: |
              Lo que se cancela son las **razones** $Q/Q_{ll}$ y $V/V_{ll}$, no
              las velocidades. Con $n = 0{,}015$ en vez de 0,009 la velocidad a
              sección llena cae de 3,97 a 2,38 m/s, el mismo caudal necesita más
              calado, y todo el diseño cambia. La independencia del cuadro
              respecto del material es real y muy útil, y confundirla con
              independencia de los resultados es el error que produce.
    resolucion: |
      **Un diseño con dos condiciones, y solo una de las dos manda.**

      **La berma, primero, porque es la que aprieta.** Media caña de diámetro
      $D$ tiene su borde a $D/2$; dejando libre el 15 % de $D$, el calado
      máximo es $0{,}35D$. Al 35 % de calado una sección circular lleva el
      26,3 % de su caudal lleno, así que

      $$
      Q_{ll} \ge \frac{230}{0{,}263} = 875\ \text{l/s}
      $$

      El primer diámetro comercial que la alcanza es **60 cm**, con 1122 l/s.

      **El punto de trabajo.**

      $$
      \frac{Q_c}{Q_{ll}} = \frac{230}{1122} = 0{,}205
      \;\longrightarrow\;
      \frac{h_c}{D} \approx 0{,}30
      \;\longrightarrow\;
      h_c = 18\ \text{cm}
      $$

      $$
      v_c = 0{,}780\cdot 3{,}967 = 3{,}09\ \text{m/s} \;<\; 3{,}5 \quad\checkmark
      $$

      **Lo que se aprende comprobando la otra condición.** El límite de
      velocidad no descarta ningún diámetro: los cinco candidatos van entre
      3,12 y 3,17 m/s. Está puesto porque en una acequia real hay que
      comprobarlo —por encima de unos 3 m/s el agua empieza a arrastrar
      material— pero en este problema no decide.

      Y merece la pena entender **por qué la velocidad apenas cambia con el
      diámetro**. Al ensanchar el tubo sube $V_{ll}$, que va con $D^{2/3}$;
      pero el mismo caudal ocupa una fracción menor de la sección, el calado
      relativo baja y con él la razón $V/V_{ll}$. Los dos efectos se cancelan
      casi exactamente. Es una regla útil para el examen: **en estos problemas
      la velocidad se mueve poco, y el diámetro lo decide casi siempre la
      condición de nivel.**

  - id: ejflu21-col819-la-pendiente-o-el-material
    titulo: Bajar la pendiente, o cambiar de material
    fuente: Ejercicio 8.19 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se desea diseñar un canal circular de hormigón en bruto ($n = 0{,}015$),
      con una pendiente de 5 milésimas, para que por él circule un caudal de
      agua de 50 l/s. Se pide:

      a) Determinar el diámetro del canal si los diámetros comerciales van de 5
      en 5 cm.

      b) Calcular la altura de calado de la lámina de agua.

      c) Si el canal fuera semicircular, determinar la pendiente del canal para
      que transportara el mismo caudal (50 l/s).

      d) Si la pendiente obtenida se considera demasiado grande, ¿qué
      coeficiente de Manning se debería emplear en el diseño del canal para
      reducir dicha pendiente? ¿Por qué? Opciones: $n = 0{,}009$ o
      $n = 0{,}035$.
    pide: El diámetro comercial, el calado, y qué material baja la pendiente.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) no impone ninguna condición de calado ni de velocidad.
          ¿Qué criterio queda entonces para elegir el diámetro?
        opciones:
          - texto: |
              Que quepa: el menor diámetro comercial cuya capacidad a sección
              llena supere los 50 l/s
            correcta: true
            mensaje: |
              Con esto basta cuando no hay más condiciones, y conviene ver que
              es un caso **excepcional** en este capítulo: casi todos los demás
              enunciados imponen una berma o un nivel máximo precisamente para
              que no valga el criterio fácil. Aquí sí vale.
          - texto: El que dé exactamente 50 l/s a sección llena
            mensaje: |
              Los diámetros comerciales van de 5 en 5 cm, así que ninguno dará
              exactamente 50: siempre habrá que subir al siguiente y aceptar
              margen. Pedir el ajuste exacto es pedir un tubo a medida.
          - texto: El que haga que el agua vaya a menos de 3 m/s
            mensaje: |
              Es una condición razonable en obra y aquí **no está en el
              enunciado**. Añadir condiciones que no están es tan grave como
              saltarse las que están: cambia la respuesta.
          - texto: |
              El más grande de la lista, porque así se garantiza que nunca se
              desborde
            mensaje: |
              Y sería el más caro con diferencia. Diseñar es elegir el mínimo
              que cumple, no el que no puede fallar: para eso están las bermas,
              que dan margen sin pagar tres escalones de diámetro.

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Cuál es el diámetro comercial más pequeño que lleva 50 l/s a sección
          llena, con $n = 0{,}015$ y $J = 5$ milésimas? Da el diámetro en cm.
        respuesta:
          tipo: magnitud
          valor: '30 cm'
          tolerancia: 0.02
          formato: el diámetro en cm
        distractores:
          - valor: '25 cm'
            mensaje: |
              El de 25 cm da 36,4 l/s a sección llena: se queda a un 27 % de lo
              que hace falta. Y como iría lleno, no hay forma de sacarle más.
          - valor: '20 cm'
            mensaje: |
              20,1 l/s, menos de la mitad. Fíjate en lo deprisa que crece: el
              caudal va con $D^{8/3}$, así que pasar de 20 a 30 cm —un 50 % más
              de diámetro— casi triplica la capacidad.
        pista: |
          $Q_{ll} = (1/n)(\pi D^{2}/4)(D/4)^{2/3}\sqrt{J}$, y prueba 20, 25, 30.
        desarrollo: |
          | $D$ | $Q_{ll}$ |
          |---|---|
          | 20 cm | 20,1 l/s |
          | 25 cm | 36,4 l/s |
          | **30 cm** | **59,3 l/s** |

          **$D = 30$ cm**, con un 19 % de margen sobre los 50 l/s pedidos.

      - tipo: calcular
        titulo: El calado
        pregunta: |
          Con $D = 30$ cm la razón es $Q_c/Q_{ll} = 50/59{,}3 = 0{,}844$, que
          corresponde a $h_c/D = 0{,}702$. ¿Cuál es el calado, en cm?
        respuesta:
          tipo: magnitud
          valor: '21.06 cm'
          tolerancia: 0.02
          formato: el calado en cm
        distractores:
          - valor: '25.3 cm'
            mensaje: |
              Has multiplicado el diámetro por 0,844, que es la razón de
              **caudales**. La de calados es 0,702, y la diferencia entre las
              dos es justo lo que aporta el cuadro.
          - valor: '15 cm'
            mensaje: |
              15 cm es la mitad del diámetro, es decir el tubo a media sección.
              Ahí llevaría 29,6 l/s, bastante menos de los 50 que se piden.
        pista: |
          $h_c = 0{,}702\cdot 30$ cm.
        desarrollo: |
          $$
          h_c = 0{,}702 \cdot 30 = 21{,}06\ \text{cm}
          $$

          El tubo va al 70 % de su altura. Es un punto de trabajo alto —queda
          poco resguardo— y es la consecuencia directa de que el enunciado no
          impusiera ninguna berma: el diámetro se eligió solo por capacidad, y
          el resultado es un canal casi lleno.

      - tipo: justificar
        pregunta: |
          Responde al apartado d). Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: |
              En Manning, $Q = (1/n)\,A\,R^{2/3}\sqrt{J}$: para un caudal y una
              geometría fijos, $\sqrt{J}$ es proporcional a $n$.
          - texto: |
              Así que reducir la pendiente exige reducir la $n$: hay que
              elegir el material **más liso**, y entre las dos opciones ese es
              $n = 0{,}009$.
          - texto: |
              El efecto no es pequeño: como $J$ va con $n^{2}$, pasar de 0,015 a
              0,009 divide la pendiente necesaria por 2,8.
          - texto: |
              Y tiene sentido físico directo: un canal más liso opone menos
              rozamiento, así que necesita menos desnivel para que el agua baje
              a la velocidad que hace falta.
          - texto: |
              La otra opción, $n = 0{,}035$, correspondería a un material más
              rugoso, que frena más el agua y por eso permite bajar la pendiente
              sin que se desborde.
            trampa: true
            mensaje: |
              Frena más el agua, sí, y por eso hace falta **más** pendiente, no
              menos: con $n = 0{,}035$ la pendiente necesaria se multiplica por
              5,4. La confusión viene de mezclar dos preguntas — «¿qué frena el
              agua?» y «¿qué desnivel hace falta?»— que apuntan en sentidos
              opuestos.
    resolucion: |
      **a) y b) · El diámetro y el calado.**

      Sin condición de nivel, el criterio es el mínimo que quepa:

      | $D$ | $Q_{ll}$ |
      |---|---|
      | 20 cm | 20,1 l/s |
      | 25 cm | 36,4 l/s |
      | **30 cm** | **59,3 l/s** |

      $$
      \frac{Q_c}{Q_{ll}} = \frac{50}{59{,}3} = 0{,}844
      \;\longrightarrow\;
      \frac{h_c}{D} = 0{,}702
      \;\longrightarrow\;
      h_c = 21{,}06\ \text{cm}
      $$

      **c) · La pendiente de la sección semicircular.** Una media caña que va
      llena tiene $A = \pi D^{2}/8$ y $R = D/4$, así que con el mismo diámetro
      de 30 cm:

      $$
      \sqrt{J} = \frac{Q\,n}{A\,R^{2/3}}
               = \frac{0{,}050\cdot 0{,}015}{0{,}03534\cdot 0{,}075^{2/3}}
               = 0{,}1193
      \;\Longrightarrow\;
      J = 14{,}2\ \text{milésimas}
      $$

      > **Una discrepancia con el boletín, dicha en voz alta.** El resultado
      > publicado para este apartado es **15 milésimas**, y la cuenta directa da
      > 14,2 — un 5 % de diferencia. No se ha tocado ningún dato para hacerla
      > desaparecer (§10). La explicación más probable es un redondeo al alza a
      > un valor de obra, pero es una suposición y como tal queda dicha: si
      > comparas cifra a cifra con el boletín, la diferencia está aquí y no en
      > tu cuenta.

      El salto sí es real e importante: de 5 milésimas a más de 14. La media
      caña necesita casi el triple de pendiente para el mismo caudal, porque a
      igualdad de diámetro tiene la mitad de área.

      **d) · Qué material.** Con caudal y geometría fijos, $\sqrt{J} \propto n$,
      luego $J \propto n^{2}$:

      | $n$ | $J$ necesaria |
      |---|---|
      | 0,009 | 5,1 milésimas |
      | 0,015 | 14,2 milésimas |
      | 0,035 | 77 milésimas |

      **$n = 0{,}009$**, el más liso. Y el efecto es enorme porque va al
      cuadrado: elegir bien el material puede ahorrar más desnivel que
      cualquier ajuste de sección.
  - id: ejflu21-col81-la-seccion-trapecial-que-menos-perimetro-gasta
    titulo: La sección trapecial que menos perímetro gasta
    fuente: Ejercicio 8.1 · Colección de problemas, capítulo 8 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Calcular la relación entre la solera «b» y la longitud «l» en un canal de
      sección trapezoidal de ángulo $\theta$, para obtener la sección
      hidráulicamente óptima, es decir aquella sección que para transportar un
      determinado caudal Q, en un canal de pendiente J y material n, necesita
      menos Área y menos Perímetro mojado.

