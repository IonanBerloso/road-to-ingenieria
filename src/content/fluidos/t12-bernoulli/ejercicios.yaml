      <figcaption>Las cotas a escala. Los dos manómetros de la bomba son el punto de partida: su diferencia es la altura que la bomba da, y con la potencia sale el caudal sin haber tocado todavía ninguna tubería.</figcaption>
      </figure>
    pide: Los cuatro caudales con sus sentidos, la cota del quemador y la presión del depósito D.
    pasos:
      - tipo: reconocer
        pregunta: |
          No se conoce ningún caudal. ¿Qué se puede calcular primero con lo que
          hay?
        opciones:
          - texto: El caudal de la bomba, porque sus dos manómetros dan su altura y su potencia útil es dato
            correcta: true
            mensaje: |
              Eso es. La diferencia de los dos manómetros es la altura que la
              bomba entrega, y con la potencia útil el caudal sale de
              $P = \gamma\,Q\,H_m$. Es el único sitio de la instalación donde
              hay dos presiones medidas.
          - texto: El caudal de la tubería 2, porque su factor de paso es dato
            mensaje: |
              El factor de paso relaciona la pérdida con el caudal, pero no se
              conoce ninguna de las dos: es una ecuación con dos incógnitas. Se
              resuelve **después**, cuando el nudo tenga su Bernoulli.
          - texto: El caudal de la tubería 1, con su potencia perdida de 6,3 kW
            mensaje: |
              La potencia perdida da el producto $Q \cdot h_f$, y las dos son
              incógnitas. Con la bomba es distinto: ahí la altura se **mide**
              con los dos manómetros.

      - tipo: calcular
        titulo: El caudal que bombea
        pregunta: |
          Caudal por la bomba, en l/s. Sus manómetros marcan 0,6 y 9,6 kg/cm² y
          entrega el 75 % de sus 100 kW.
        respuesta:
          tipo: magnitud
          valor: '85 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '106.3 l/s'
            mensaje: |
              Has usado la altura en metros de columna de **agua**, 90, junto
              con el peso específico del combustible. O una cosa o la otra: en
              este líquido, 9 kg/cm² son $9 \cdot 10/0{,}8 = 112{,}5$ metros, y
              con menos altura sale más caudal para la misma potencia.
          - valor: '113.4 l/s'
            mensaje: |
              Has usado la potencia bruta, 100 kW. Al fluido solo le llegan 75:
              el otro cuarto se lo queda la bomba.
          - valor: '79.7 l/s'
            mensaje: |
              Has tomado los 9,6 kg/cm² como altura de la bomba. Lo que entrega
              es la **diferencia** entre salida y entrada: 9,6 − 0,6.
        pista: |
          $H_m = (9{,}6 - 0{,}6)\ \text{kg/cm}^{2}$, y un kg/cm² son 10 mca, que
          en un líquido de $s = 0{,}8$ son 12,5 m.
        desarrollo: |
          $$
          H_m = 9 \cdot \frac{10}{0{,}8} = 112{,}5\ \text{m de combustible} \qquad \gamma = 0{,}8 \cdot 9\,800 = 7\,840\ \text{N/m}^{3}
          $$

          $$
          Q = \frac{0{,}75 \cdot 100\,000}{7\,840 \cdot 112{,}5} = 0{,}085\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El Bernoulli en el nudo
        pregunta: |
          Altura de Bernoulli en el nudo N, en metros de columna de
          combustible. La bomba está en la cota 25 y la tubería 3, de 250 mm,
          pierde 5,35 mca.
        respuesta:
          tipo: magnitud
          valor: '39.34 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '37.99 m'
            mensaje: |
              Has sumado los 5,35 tal cual. Están en metros de columna de
              **agua**: en combustible son $5{,}35/0{,}8 = 6{,}69$ m, más,
              porque el combustible es más ligero.
          - valor: '32.65 m'
            mensaje: |
              Ese es el Bernoulli de la entrada de la bomba. N está aguas
              arriba: tiene que estar más alto, porque de N a A se pierde.
          - valor: '14.34 m'
            mensaje: |
              Te has dejado la cota de la bomba, 25 m. El manómetro mide solo la
              presión; la energía del punto lleva además su altura.
        pista: |
          $B_A = 25 + 0{,}6 \cdot 12{,}5 + V_3^{2}/2g$ y
          $B_N = B_A + h_{f3}$, con $h_{f3} = 5{,}35/0{,}8$.
        desarrollo: |
          $$
          V_3 = \frac{0{,}085}{\pi \cdot 0{,}25^{2}/4} = 1{,}73\ \text{m/s} \qquad B_A = 25 + 7{,}5 + 0{,}15 = 32{,}65\ \text{m}
          $$

          $$
          B_N = 32{,}65 + \frac{5{,}35}{0{,}8} = 32{,}65 + 6{,}69 = 39{,}34\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal de la tubería 2
        pregunta: |
          Caudal por la tubería 2, de 100 mm y factor de paso 8, que comunica el
          nudo con el depósito abierto E, en la cota 37.
        respuesta:
          tipo: magnitud
          valor: '18.8 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '117.5 l/s'
            mensaje: |
              Has usado la sección de la tubería 3, de 250 mm. La 2 es de 100.
          - valor: '4.25 l/s'
            mensaje: |
              Has usado la diferencia de cotas sin más, 39,34 − 37 = 2,34, pero
              dividida entre 8 dos veces, o te has dejado el $2g$ al despejar la
              velocidad.
          - valor: '25.6 l/s'
            mensaje: |
              Has tomado la cota de E como 35, o te has dejado la altura de
              velocidad de la tubería 3 al calcular el nudo. Con $B_N$ bien la
              pérdida de la 2 es 2,34 m.
        pista: |
          $h_{f2} = B_N - 37$ porque E está abierto y quieto; después,
          $h_{f2} = K_2 V_2^{2}/2g$.
        desarrollo: |
          $$
          h_{f2} = 39{,}34 - 37 = 2{,}34\ \text{m} \qquad \frac{V_2^{2}}{2g} = \frac{2{,}34}{8} = 0{,}292\ \text{m} \qquad V_2 = 2{,}39\ \text{m/s}
          $$

          $$
          Q_2 = 2{,}39 \cdot \frac{\pi \cdot 0{,}10^{2}}{4} = 18{,}8\ \text{l/s}
          $$

          Y como $B_N > 37$, el combustible va **del nudo hacia E**: la tubería
          2 llena el depósito abierto. La 1 trae entonces
          $85 + 18{,}8 = 103{,}8$ l/s.

      - tipo: calcular
        titulo: La cota del quemador
        pregunta: |
          Cota Z del quemador C, que pulveriza a la atmósfera por una boquilla
          de 50 mm.
        respuesta:
          tipo: magnitud
          valor: '41.8 m'
          tolerancia: 0.01
          formato: una cota con su unidad (m)
        distractores:
          - valor: '137.4 m'
            mensaje: |
              Te has dejado la altura de velocidad del chorro. Por una boquilla
              de 50 mm salen 85 l/s a 43,3 m/s: son 95,6 m de altura de
              velocidad, casi toda la energía disponible.
          - valor: '49.5 m'
            mensaje: |
              Te has dejado la pérdida de la tubería 4, 7,73 m de combustible.
          - valor: '145.15 m'
            mensaje: |
              Ese es el Bernoulli a la salida de la bomba, no la cota del
              quemador. Falta descontar lo que se pierde por el camino y lo que
              el chorro se lleva en velocidad.
        pista: |
          $B_S = 25 + 9{,}6 \cdot 12{,}5 + V_4^{2}/2g$;
          $h_{f4} = P_4/(\gamma Q)$; y en C queda
          $Z + V_C^{2}/2g$.
        desarrollo: |
          $$
          B_S = 25 + 120 + 0{,}15 = 145{,}15\ \text{m} \qquad h_{f4} = \frac{5\,150}{7\,840 \cdot 0{,}085} = 7{,}73\ \text{m}
          $$

          $$
          V_C = \frac{0{,}085}{\pi \cdot 0{,}05^{2}/4} = 43{,}3\ \text{m/s} \qquad \frac{V_C^{2}}{2g} = 95{,}63\ \text{m}
          $$

          $$
          Z = 145{,}15 - 7{,}73 - 95{,}63 = 41{,}8\ \text{m}
          $$

      - tipo: calcular
        titulo: La presión del depósito D
        pregunta: |
          Presión que marca el manómetro de D, en kPa. Su lámina está en la
          cota 22 y la tubería 1 pierde 6,3 kW llevando 103,8 l/s.
        respuesta:
          tipo: magnitud
          valor: '196.6 kPa'
          tolerancia: 0.01
          formato: una presión con su unidad (kPa o kg/cm²)
        distractores:
          - valor: '245.8 kPa'
            mensaje: |
              Has usado el peso específico del agua para pasar de metros a
              pascales. La columna es de combustible:
              $\gamma = 7\,840$ N/m³.
          - valor: '135.9 kPa'
            mensaje: |
              Te has dejado la pérdida de la tubería 1, 7,74 m. Es la que
              obliga a presurizar D: sin ella bastaría bastante menos.
          - valor: '369.1 kPa'
            mensaje: |
              Has olvidado restar la cota de D, 22 m. El manómetro mide la
              presión del gas, no la energía total del depósito.
        pista: |
          $h_{f1} = P_1/(\gamma\,Q_1)$, $B_D = B_N + h_{f1}$ y
          $p_D = (B_D - 22)\,\gamma$.
        desarrollo: |
          $$
          h_{f1} = \frac{6\,300}{7\,840 \cdot 0{,}1038} = 7{,}74\ \text{m} \qquad B_D = 39{,}34 + 7{,}74 = 47{,}08\ \text{m}
          $$

          $$
          p_D = (47{,}08 - 22) \cdot 7\,840 = 196\,600\ \text{Pa} = 196{,}6\ \text{kPa} = 2{,}01\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena el recorrido del problema. Una pieza es falsa.
        piezas:
          - texto: 'Los dos manómetros de la bomba dan su altura, 112,5 m de combustible, y con la potencia útil sale el caudal: 85 l/s.'
          - texto: 'Bajando por la tubería 3 hasta el nudo se llega a BN = 39,34 m, y ese número reparte el resto.'
          - texto: 'Como BN supera la cota de E, la tubería 2 sale del nudo y llena el depósito abierto: de los 103,8 l/s que trae la 1, 18,8 se van a E y 85 al quemador.'
          - texto: 'La cota del quemador sale de restar al Bernoulli de la bomba solo la pérdida de la tubería 4, porque en C el combustible sale a la atmósfera y allí la presión es cero.'
            trampa: true
            mensaje: |
              La presión es cero, pero la **velocidad** no: el chorro sale por
              50 mm a 43,3 m/s, y esos 95,6 m de altura de velocidad son el 70 %
              de todo lo que la bomba ha entregado. Olvidarlos coloca el
              quemador a 137 m en vez de a 42.
    resolucion: |
      **Por dónde se entra.** No hay ningún caudal dado, y las tres potencias
      perdidas dan productos $Q \cdot h_f$ con las dos incógnitas dentro. El
      único sitio donde hay una altura **medida** es la bomba: sus dos
      manómetros.

      $$
      H_m = (9{,}6 - 0{,}6)\cdot\frac{10}{0{,}8} = 112{,}5\ \text{m} \qquad Q = \frac{75\,000}{7\,840 \cdot 112{,}5} = 85\ \text{l/s}
      $$

      **Hacia atrás, hasta el nudo.**

      $$
      B_A = 25 + 7{,}5 + 0{,}15 = 32{,}65 \qquad B_N = 32{,}65 + \frac{5{,}35}{0{,}8} = 39{,}34\ \text{m}
      $$

      **El reparto** (a). Como $B_N = 39{,}34 > 37$, la tubería 2 **sale** del
      nudo y llena el depósito abierto E:

      $$
      h_{f2} = 2{,}34\ \text{m} \qquad Q_2 = 18{,}8\ \text{l/s} \qquad Q_1 = 85 + 18{,}8 = 103{,}8\ \text{l/s}
      $$

      Sentidos: de D al nudo por la 1; del nudo a E por la 2; del nudo a la
      bomba por la 3; y de la bomba al quemador por la 4.

      **El quemador** (b).

      $$
      B_S = 145{,}15 \qquad h_{f4} = 7{,}73 \qquad \frac{V_C^{2}}{2g} = 95{,}63 \qquad Z = 41{,}8\ \text{m}
      $$

      El boletín publica 41,75; la diferencia son cinco centímetros de
      redondeo.

      **El depósito D** (c).

      $$
      h_{f1} = 7{,}74\ \text{m} \qquad B_D = 47{,}08 \qquad p_D = 196{,}6\ \text{kPa} = 2{,}01\ \text{kg/cm}^{2}
      $$

      **Lo que hay que ver, y no es un número.** El quemador está en la cota
      41,8 y la bomba entrega 112,5 m: parecería que sobra energía de largo.
      No sobra: **el 70 % de lo que la bomba pone se lo lleva el chorro en
      velocidad**, porque pulverizar exige salir a 43 m/s por una boquilla de
      50 mm. Un quemador es, en balance de energía, mucho más parecido a una
      lanza de incendios que a una tubería de riego.

  - id: ejflu12-col319-dos-bombas-que-confluyen-en-un-nudo
    titulo: Dos bombas que confluyen en un nudo
    fuente: Ejercicio 3.19 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En el esquema de la figura se muestra un sistema de bombeo donde las
      bombas $B_1$ y $B_2$ elevan un caudal $Q_3 = 15$ l/s de un hidrocarburo de
      densidad $\rho = 860$ kg/m³, de los depósitos A y B al depósito C.
      Calcular:

      a) La altura útil o manométrica que aporta la bomba $B_1$ si un
      caudalímetro a la salida del depósito A marca 5 l/s y se sabe que la
      potencia total absorbida por la bomba $B_1$ es de 2320 W, con un
      rendimiento $\eta_{B1} = 0{,}8$.

      b) Bernoulli en el nudo N en unidades de energía por unidad de peso.

      c) La potencia perdida en la tubería 1, debido a la viscosidad del
      hidrocarburo.

      d) El factor de paso (adimensional) de pérdidas de carga de la tubería 2,
      si se desea instalar una bomba ($B_2$) que aporte al fluido una altura
      útil o manométrica de 30 mc hidrocarburo.

      e) La pérdida de carga en la tubería 3, en mc agua.

      Datos: $K_1$ (tubería 1) = 79; $\varnothing_1$ = 80 mm;
      $\varnothing_2$ = 100 mm; $\varnothing_3$ = 125 mm.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 282" role="img" width="440" height="282"
           aria-labelledby="f319t f319d">
