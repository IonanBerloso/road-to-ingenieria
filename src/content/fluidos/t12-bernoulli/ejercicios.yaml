ejercicios:
  # ── Los dos son NUESTROS (§08). Bernoulli no tiene capítulo propio en la
  #    colección: se examina siempre dentro de un medidor (tema 13) o de una
  #    instalación (temas 19 y 25). Aquí se usa sola, primero sin pérdidas y
  #    después con ellas y con una bomba.
  - id: ejflu12-torricelli-y-la-potencia-del-chorro
    titulo: El chorro de un depósito, y la potencia que lleva
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito abierto de grandes dimensiones tiene una boquilla de
      $50\ \text{mm}$ de diámetro situada $5\ \text{m}$ por debajo de la
      superficie libre. El chorro sale a la atmósfera.

      a) Calcular la velocidad de salida, suponiendo fluido perfecto.

      b) Calcular el caudal.

      c) Calcular la potencia que lleva el chorro.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$ y $\gamma = 9800\ \text{N/m}^{3}$.
    pide: La velocidad de salida, el caudal y la potencia del chorro.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se aplica Bernoulli entre la superficie libre (1) y la salida de la
          boquilla (2). ¿Qué vale cada término?
        opciones:
          - texto: >-
              En 1: $v_1 \approx 0$ (depósito grande) y $P_1 = 0$
              (manométrica, abierto). En 2: $P_2 = 0$ (sale a la atmósfera).
              Solo quedan la cota y la velocidad de salida
            correcta: true
            mensaje: |
              Eso es, y por eso queda $z_1 - z_2 = v_2^{2}/2g$, es decir
              $v = \sqrt{2gH}$: la fórmula de Torricelli. Es Bernoulli con
              tres términos anulados.
          - texto: >-
              En 2 la presión es la del agua a $5\ \text{m}$, o sea
              $0{,}49\ \text{bar}$
            mensaje: |
              Esa sería la presión **dentro** del depósito a esa profundidad,
              con el orificio cerrado. Al salir el chorro a la atmósfera, su
              presión es la atmosférica: manométrica cero. Esa energía de
              presión es justo la que se ha convertido en velocidad.
          - texto: >-
              $v_1$ no se puede despreciar sin saber el área del depósito
            mensaje: |
              El enunciado dice «de grandes dimensiones», que es la forma
              habitual de autorizar $v_1 \approx 0$: por continuidad, la
              velocidad de descenso del nivel es despreciable frente a la del
              chorro.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad sale el chorro?
        respuesta:
          tipo: magnitud
          valor: '9.9 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '49 m/s'
            mensaje: |
              Eso es $2gH$ sin la raíz. La velocidad es
              $\sqrt{2gH} = \sqrt{98} = 9{,}9\ \text{m/s}$.
          - valor: '7 m/s'
            mensaje: |
              Eso es $\sqrt{gH} = \sqrt{49}$: falta el factor 2. La cota se
              convierte en $v^{2}/2g$, así que $v = \sqrt{2gH}$.
        pista: |
          Torricelli: v = √(2·g·H), con H = 5 m.
        desarrollo: |
          $$
          z_1 = z_2 + \frac{v_2^{2}}{2g}
          \quad\Rightarrow\quad
          v = \sqrt{2gH} = \sqrt{2\cdot9{,}8\cdot5} = 9{,}9\ \text{m/s}
          $$

          **Y una lectura que conviene tener:** es la misma velocidad que
          alcanzaría un cuerpo dejado caer desde $5\ \text{m}$. Bernoulli sin
          pérdidas es exactamente la conservación de la energía mecánica.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal sale por la boquilla?
        respuesta:
          tipo: magnitud
          valor: '19.44 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '0.495 l/s'
            mensaje: |
              Has usado el diámetro como si fuera el área. $A = \pi D^{2}/4
              = 1{,}963\cdot10^{-3}\ \text{m}^{2}$, y $Q = vA$.
          - valor: '77.75 l/s'
            mensaje: |
              Has usado $\pi D^{2}$ sin dividir entre 4: el área sale cuatro
              veces mayor.
        pista: |
          Q = v·A, con A = π·0,05²/4.
        desarrollo: |
          $$
          A = \frac{\pi\cdot0{,}05^{2}}{4} = 1{,}963\cdot10^{-3}\ \text{m}^{2}
          \qquad
          Q = 9{,}9\cdot1{,}963\cdot10^{-3} = 0{,}01944\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La potencia del chorro
        pregunta: |
          ¿Qué potencia lleva ese chorro?
        respuesta:
          tipo: magnitud
          valor: '952 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '190 W'
            mensaje: |
              Has usado $\gamma Q v$ o algo parecido. La potencia es
              $\gamma Q B$, y aquí el Bernoulli del chorro es su altura
              cinética, $v^{2}/2g = 5\ \text{m}$.
          - valor: '95240 W'
            mensaje: |
              Un factor cien: el caudal son $0{,}01944\ \text{m}^{3}/\text{s}$,
              no $1{,}944$.
        pista: |
          Pot = γ·Q·B, y el Bernoulli del chorro es v²/2g = 5 m.
        desarrollo: |
          $$
          \text{Pot} = \gamma\,Q\,\frac{v^{2}}{2g}
          = 9800\cdot0{,}01944\cdot5 = 952\ \text{W}
          $$

          Toda la energía potencial de la que partió ($5\ \text{m}$) está
          ahora en forma cinética: sin pérdidas, la altura se conserva y solo
          cambia de nombre.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la superficie y la boquilla, con
              $v_1\approx0$, $P_1 = P_2 = 0$ manométricas.
          - texto: >-
              Queda $H = v^{2}/2g$, de donde $v = \sqrt{2gH} = 9{,}9\ \text{m/s}$.
          - texto: >-
              $Q = vA = 19{,}44\ \text{l/s}$.
          - texto: >-
              $\text{Pot} = \gamma Q\,v^{2}/2g = 952\ \text{W}$.
          - texto: >-
              Es aplicable la misma constante de Bernoulli a todas las líneas
              de corriente porque todas arrancan en la superficie libre.
          - texto: >-
              Si la boquilla fuera más ancha, la velocidad de salida sería
              mayor, porque saldría más caudal.
            trampa: true
            mensaje: |
              La velocidad de salida **no depende del diámetro**: solo de la
              altura, $v=\sqrt{2gH}$. Lo que cambia con el diámetro es el
              caudal ($Q = vA$) y con él la potencia. Es la diferencia entre
              «a qué velocidad sale» y «cuánto sale».

    resolucion: |
      Bernoulli entre la superficie libre y la salida, con
      $v_1\approx0$ y presiones manométricas nulas en los dos extremos:

      $$
      \boxed{v = \sqrt{2gH} = 9{,}9\ \text{m/s}}
      \qquad
      \boxed{Q = vA = 19{,}44\ \text{l/s}}
      \qquad
      \boxed{\text{Pot} = \gamma Q\frac{v^{2}}{2g} = 952\ \text{W}}
      $$

      > **Torricelli no es una fórmula aparte que memorizar.** Es Bernoulli
      > con tres de sus cinco términos anulados por el enunciado: depósito
      > grande, abierto arriba y descargando a la atmósfera. Si el depósito
      > estuviera presurizado, el término $P_1/\gamma$ volvería, y la
      > velocidad sería $\sqrt{2g(H+P_1/\gamma)}$.

  - id: ejflu12-la-bomba-y-su-rendimiento
    titulo: Una bomba, su altura manométrica y la potencia que consume
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una bomba eleva $30\ \text{l/s}$ de agua entre dos depósitos abiertos,
      salvando un desnivel de $22\ \text{m}$. Las pérdidas de carga en las
      tuberías son $h_f = 3\ \text{m}$.

      a) ¿Qué altura manométrica debe dar la bomba?

      b) ¿Cuál es su potencia hidráulica?

      c) Si su rendimiento es del $70\ \%$, ¿qué potencia consume?

      Tomar $\gamma = 9800\ \text{N/m}^{3}$.
    pide: La altura manométrica, la potencia hidráulica y la absorbida.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aplicando Bernoulli generalizada entre las dos superficies libres,
          ¿qué queda?
        opciones:
          - texto: >-
              $H_m = \Delta z + h_f$: la bomba tiene que dar el desnivel
              **más** las pérdidas, porque en las dos superficies la presión
              y la velocidad son nulas
            correcta: true
            mensaje: |
              Eso es. $B_1 + H_m - h_f = B_2$, y con $P$ y $v$ nulos en los
              dos extremos queda $H_m = (z_2-z_1) + h_f = 25\ \text{m}$.
          - texto: >-
              $H_m = \Delta z - h_f$: las pérdidas descuentan
            mensaje: |
              Al revés: las pérdidas son energía que **se va**, así que la
              bomba tiene que aportarlas además del desnivel. Con el signo
              cambiado el agua no llegaría arriba.
          - texto: >-
              $H_m = \Delta z$, y las pérdidas se compensan solas
            mensaje: |
              No se compensan con nada: son energía disipada en calor. Si la
              bomba solo diera $22\ \text{m}$, el caudal sería menor que el
              pedido.

      - tipo: calcular
        titulo: La altura manométrica
        pregunta: |
          ¿Qué altura tiene que dar la bomba?
        respuesta:
          tipo: magnitud
          valor: '25 m'
          tolerancia: 0.01
          formato: una altura, con su unidad
        distractores:
          - valor: '22 m'
            mensaje: |
              Ese es solo el desnivel. Hay que sumarle los $3\ \text{m}$ de
              pérdidas: la bomba paga las dos cosas.
          - valor: '19 m'
            mensaje: |
              Has restado las pérdidas. Se suman: son energía que el flujo
              pierde y que alguien tiene que reponer.
        pista: |
          H_m = Δz + h_f.
        desarrollo: |
          $$
          B_1 + H_m - h_f = B_2
          \quad\Rightarrow\quad
          H_m = (z_2-z_1) + h_f = 22+3 = 25\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia hidráulica
        pregunta: |
          ¿Qué potencia entrega al agua?
        respuesta:
          tipo: magnitud
          valor: '7.35 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '6.47 kW'
            mensaje: |
              Has usado los $22\ \text{m}$ de desnivel en vez de los
              $25\ \text{m}$ de altura manométrica. La potencia hidráulica se
              calcula con lo que la bomba **da**, no con lo que el desnivel
              pide.
          - valor: '10.5 kW'
            mensaje: |
              Esa es la potencia **absorbida**, que sale de dividir por el
              rendimiento. La hidráulica es $\gamma Q H_m$, sin dividir.
        pista: |
          Pot = γ·Q·H_m, con Q en m³/s.
        desarrollo: |
          $$
          \text{Pot}_h = \gamma\,Q\,H_m = 9800\cdot0{,}03\cdot25 = 7350\ \text{W} = 7{,}35\ \text{kW}
          $$

      - tipo: calcular
        titulo: La potencia consumida
        pregunta: |
          Con un rendimiento del $70\ \%$, ¿cuánta potencia absorbe?
        respuesta:
          tipo: magnitud
          valor: '10.5 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '5.145 kW'
            mensaje: |
              Has multiplicado por $0{,}7$ en vez de dividir. La bomba consume
              **más** de lo que entrega: la absorbida es mayor que la
              hidráulica.
          - valor: '7.35 kW'
            mensaje: |
              Esa es la hidráulica. Con rendimiento $0{,}7$, la absorbida es
              $7{,}35/0{,}7 = 10{,}5\ \text{kW}$.
        pista: |
          η = Pot útil / Pot bruta, así que la bruta es la útil dividida por η.
        desarrollo: |
          $$
          \eta = \frac{\text{Pot}_h}{\text{Pot}_{\text{abs}}}
          \quad\Rightarrow\quad
          \text{Pot}_{\text{abs}} = \frac{7{,}35}{0{,}7} = 10{,}5\ \text{kW}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli generalizada con bomba:
              $B_1 + H_m - h_f = B_2$.
          - texto: >-
              En las dos superficies libres $P = 0$ y $v \approx 0$, así que
              $B_1 = z_1$ y $B_2 = z_2$.
          - texto: >-
              $H_m = 22+3 = 25\ \text{m}$.
          - texto: >-
              $\text{Pot}_h = \gamma Q H_m = 7{,}35\ \text{kW}$.
          - texto: >-
              $\text{Pot}_{\text{abs}} = 7{,}35/0{,}7 = 10{,}5\ \text{kW}$, y la
              diferencia, $3{,}15\ \text{kW}$, se pierde en el motor y en la
              propia bomba.
          - texto: >-
              De los $10{,}5\ \text{kW}$ consumidos, $3\ \text{m}$ de altura se
              pierden por fricción, así que el rendimiento ya incluye las
              pérdidas de carga de la tubería.
            trampa: true
            mensaje: |
              Son dos pérdidas distintas y no hay que mezclarlas. Las de
              carga ($3\ \text{m}$) ocurren **en la tubería** y ya están
              dentro de $H_m$; el rendimiento del $70\ \%$ mide lo que se
              pierde **dentro de la máquina**. Contarlas dos veces es el error
              clásico del tema 25.

    resolucion: |
      $$
      \boxed{H_m = \Delta z + h_f = 25\ \text{m}}
      $$
      $$
      \boxed{\text{Pot}_h = \gamma Q H_m = 7{,}35\ \text{kW}}
      \qquad
      \boxed{\text{Pot}_{\text{abs}} = \frac{7{,}35}{0{,}7} = 10{,}5\ \text{kW}}
      $$

      > **Dónde está cada pérdida.** Las de carga están en la **tubería** y se
      > pagan con altura manométrica; las del rendimiento están en la
      > **máquina** y se pagan con potencia de más. La cadena completa es:
      > $10{,}5\ \text{kW}$ del enchufe → $7{,}35$ al agua → de esos, $0{,}88$
      > se disipan por fricción y el resto sube el agua.

  # ── COLECCIÓN 3.10. Corto y conceptual: el flujo va del Bernoulli mayor al
  #    menor, y ni la presión ni la cota deciden por separado.
  - id: ejflu12-col310-hacia-donde-va-el-flujo
    titulo: Hacia dónde va el flujo cuando la presión y la cota discrepan
    fuente: >-
      Ejercicio 3.10 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En un punto $A$ de una tubería que transporta aceite de densidad relativa
      $0{,}9$, el diámetro es $150\ \text{mm}$ y la presión
      $0{,}7\ \text{kg/cm}^{2}$. En otro punto $B$ de la misma conducción,
      situado $5\ \text{m}$ más alto que el anterior, de $300\ \text{mm}$ de
      diámetro, su presión vale $-0{,}2\ \text{kg/cm}^{2}$ para un caudal de
      $28\ \text{l/s}$. Se pide:

      a) Determinar la dirección del flujo.
    pide: En qué sentido circula el aceite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué decide el sentido del flujo en una conducción?
        opciones:
          - texto: >-
              El Bernoulli total: el fluido va del punto de mayor energía al de
              menor, porque las pérdidas solo pueden restar
            correcta: true
            mensaje: |
              Exacto. Es la única lectura que no falla: la energía total no
              puede aumentar en el sentido del flujo, así que basta compararla
              en los dos puntos.
          - texto: >-
              La presión: el fluido va de donde hay más presión a donde hay
              menos
            mensaje: |
              Aquí eso acertaría por casualidad, pero es falso en general: un
              fluido puede ir de menos presión a más presión si baja de cota o
              si se frena, como pasa en el difusor de un venturímetro.
          - texto: >-
              La cota: el fluido siempre baja
            mensaje: |
              Cualquier bomba desmiente eso, y también un sifón. Lo que no
              puede subir es la **energía total** sin una máquina que la
              aporte.

      - tipo: calcular
        titulo: El Bernoulli en A
        pregunta: |
          ¿Cuánto vale la energía total en $A$, en metros de columna de aceite?
        respuesta:
          tipo: magnitud
          valor: '7.906 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '7.143 m'
            mensaje: |
              Has usado el peso específico del agua para pasar la presión a
              altura. El fluido es aceite, $\gamma = 0{,}9\cdot 9800 =
              8820\ \text{N/m}^{3}$, y por eso su columna es más alta.
          - valor: '12.91 m'
            mensaje: |
              Has puesto los $5\ \text{m}$ de cota en $A$. Es $B$ el que está
              más alto: el enunciado dice «situado 5 m más alto que el
              anterior», así que $z_A = 0$ y $z_B = 5$.
        pista: |
          $B = p/\gamma + v^{2}/2g + z$, con $\gamma$ del aceite y $z_A = 0$.
        desarrollo: |
          $$
          v_A = \frac{0{,}028}{\pi\,0{,}15^{2}/4} = 1{,}585\ \text{m/s}
          \qquad
          \frac{p_A}{\gamma} = \frac{0{,}7\cdot 98\,000}{8820} = 7{,}778\ \text{mcl}
          $$
          $$
          B_A = 7{,}778 + \frac{1{,}585^{2}}{19{,}6} + 0 = 7{,}906\ \text{mcl}
          $$

      - tipo: calcular
        titulo: El Bernoulli en B
        pregunta: |
          ¿Y en $B$?
        respuesta:
          tipo: magnitud
          valor: '2.786 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '-2.214 m'
            mensaje: |
              Te has dejado la cota. $B$ está $5\ \text{m}$ más alto que $A$, y
              esos cinco metros son energía de posición que hay que sumar.
          - valor: '7.786 m'
            mensaje: |
              Has tomado la presión de $B$ como positiva. Es
              $-0{,}2\ \text{kg/cm}^{2}$: el punto está en depresión, y ese
              signo es justo lo que hace interesante el problema.
        pista: |
          Mismo cálculo, con $z_B = 5$ y la presión **negativa**.
        desarrollo: |
          $$
          v_B = \frac{0{,}028}{\pi\,0{,}3^{2}/4} = 0{,}396\ \text{m/s}
          \qquad
          \frac{p_B}{\gamma} = \frac{-0{,}2\cdot 98\,000}{8820} = -2{,}222\ \text{mcl}
          $$
          $$
          B_B = -2{,}222 + 0{,}008 + 5 = 2{,}786\ \text{mcl}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El sentido del flujo lo decide la energía total, porque el
              rozamiento solo puede hacerla disminuir.
          - texto: >-
              En $A$ vale 7,906 mcl y en $B$, 2,786: la diferencia son 5,12 m
              de pérdida de carga entre los dos puntos.
          - texto: >-
              Por tanto el aceite circula **de $A$ a $B$**, subiendo cinco
              metros y perdiendo presión por el camino.
          - texto: >-
              Como en $B$ la presión es negativa, el flujo no puede ir hacia
              allí: un fluido no circula hacia una depresión.
            trampa: true
            mensaje: |
              Circula perfectamente, y es lo que pasa aquí. La depresión de $B$
              es consecuencia de haber subido 5 m y haber perdido carga por el
              camino, no un impedimento. Lo único que no puede hacer el fluido
              es ganar energía total sin una máquina.

    resolucion: |
      **La única comparación que vale es la del Bernoulli completo**, porque
      las pérdidas de carga solo pueden restar: la energía total nunca crece en
      el sentido del flujo.

      $$
      B_A = \frac{p_A}{\gamma} + \frac{v_A^{2}}{2g} + z_A
      = 7{,}778 + 0{,}128 + 0 = 7{,}906\ \text{mcl}
      $$
      $$
      B_B = -2{,}222 + 0{,}008 + 5 = 2{,}786\ \text{mcl}
      $$

      **$B_A > B_B$, luego el aceite va de $A$ a $B$**, y por el camino pierde
      $5{,}12\ \text{m}$ de carga.

      **Los tres términos discrepan y por eso el problema tiene gracia.**
      Mirando solo la presión, el flujo iría de $A$ a $B$; mirando solo la
      cota, de $B$ a $A$; y la altura cinética, que es la menor de las tres,
      también apunta de $A$ a $B$. Cuando dos criterios parciales se
      contradicen, el que manda es siempre la suma.

      **Y dos detalles que conviene fijar.**

      El primero: la presión se pasa a altura con el peso específico **del
      fluido que circula**, no con el del agua. Con agua saldría $7{,}143$ en
      vez de $7{,}778$, y en un problema donde se comparan dos números parecidos
      eso puede cambiar la respuesta.

      El segundo, al revés: **la altura cinética aquí es irrelevante**. Vale
      13 cm en $A$ y 8 mm en $B$, frente a más de cinco metros de diferencia
      entre los dos Bernoullis. Calcularla es correcto y cuesta poco, pero
      conviene ver que no es la que decide — en una conducción, salvo en
      boquillas y gargantas, el término cinético casi nunca manda.

  # ── COLECCIÓN 3.11. El más corto del capítulo, y el que mejor enseña que
  #    la boquilla convierte presión en velocidad al cuadrado.
  - id: ejflu12-col311-la-presion-antes-de-la-boquilla
    titulo: Qué presión hay antes de una boquilla de manguera
    fuente: >-
      Ejercicio 3.11 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una manguera de $75\ \text{mm}$ de diámetro termina en una boquilla de
      $35\ \text{mm}$ de diámetro. Si el caudal fluyente es $20\ \text{l/s}$
      de agua, despreciando las pérdidas, se pide:

      a) Presión aguas arriba de la boquilla.
    pide: La presión en la manguera, justo antes de la boquilla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué presión hay a la salida de la boquilla?
        opciones:
          - texto: >-
              Cero manométrica: el chorro sale a la atmósfera y su presión es la
              atmosférica
            correcta: true
            mensaje: |
              Eso es, y es lo que cierra el problema. Un chorro libre está a la
              presión del ambiente en el que sale; toda la presión de la
              manguera se ha convertido en velocidad.
          - texto: >-
              La misma que en la manguera, porque el caudal es el mismo
            mensaje: |
              El caudal es el mismo pero la velocidad no: la boquilla es cuatro
              veces y media más estrecha en área. Y donde crece la velocidad,
              cae la presión.
          - texto: >-
              No se puede saber sin conocer la longitud de la manguera
            mensaje: |
              La longitud importaría para las pérdidas, y el enunciado dice que
              se desprecian. Lo que fija la presión de salida es que el chorro
              descarga al aire.

      - tipo: calcular
        titulo: La presión
        pregunta: |
          ¿Qué presión hay aguas arriba de la boquilla?
        respuesta:
          tipo: magnitud
          valor: '21 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '22.05 mca'
            mensaje: |
              Te has dejado la altura cinética de la manguera. Bernoulli
              iguala **las dos**: $p/\gamma + v_1^{2}/2g = v_2^{2}/2g$, así que
              hay que restar la de aguas arriba.
          - valor: '1.046 mca'
            mensaje: |
              Has usado la velocidad de la manguera en los dos sitios. La
              boquilla la multiplica por $(75/35)^{2} = 4{,}59$, y como la
              altura va con el cuadrado, la diferencia es enorme.
        pista: |
          Bernoulli entre la manguera y la salida, misma cota y presión de
          salida nula.
        desarrollo: |
          $$
          v_1 = \frac{0{,}02}{\pi\,0{,}075^{2}/4} = 4{,}53\ \text{m/s}
          \qquad
          v_2 = \frac{0{,}02}{\pi\,0{,}035^{2}/4} = 20{,}79\ \text{m/s}
          $$
          $$
          \frac{p_1}{\gamma} = \frac{v_2^{2}-v_1^{2}}{2g}
          = \frac{432{,}1-20{,}5}{19{,}6} = 21{,}0\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El chorro sale a la atmósfera, así que su presión manométrica es
              nula y toda la energía de presión se ha vuelto cinética.
          - texto: >-
              La boquilla multiplica la velocidad por $(75/35)^{2} = 4{,}59$, y
              la altura cinética por su cuadrado, más de veinte veces.
          - texto: >-
              La presión necesaria aguas arriba es la diferencia de alturas
              cinéticas: 21 mca, es decir algo más de 2 bar.
          - texto: >-
              Si se estrechara más la boquilla, la presión necesaria bajaría,
              porque saldría menos agua.
            trampa: true
            mensaje: |
              Con el mismo caudal, una boquilla más estrecha exige **más**
              presión, porque la velocidad de salida crece. Lo que sí ocurre en
              una instalación real es que al estrechar la boquilla baja el
              caudal — pero eso es otro problema, con la curva de la bomba de
              por medio.

    resolucion: |
      **Bernoulli entre la manguera y el chorro**, misma cota, sin pérdidas y
      con la salida a presión atmosférica:

      $$
      \frac{p_1}{\gamma} + \frac{v_1^{2}}{2g} = 0 + \frac{v_2^{2}}{2g}
      \;\Longrightarrow\;
      \frac{p_1}{\gamma} = \frac{v_2^{2}-v_1^{2}}{2g}
      $$
      $$
      v_1 = 4{,}53\ \text{m/s}
      \qquad
      v_2 = 20{,}79\ \text{m/s}
      \qquad
      \frac{p_1}{\gamma} = 21{,}0\ \text{mca}
      $$

      **Veintiún metros de columna de agua, es decir algo más de dos bar**,
      para veinte litros por segundo por una manguera. Ese es el orden de
      magnitud de una lanza de bombero, y explica por qué hacen falta dos
      personas para sujetarla.

      **La relación que hay que ver** es que la boquilla multiplica la
      velocidad por la relación de áreas —$(75/35)^{2} = 4{,}59$— y la energía
      cinética por el cuadrado de eso, veintiuna veces. Toda esa energía sale
      de la presión, así que estrechar la boquilla **encarece** el bombeo, no
      lo abarata.

  # ── COLECCIÓN 3.12. Bernoulli con máquinas repartidas a lo largo de una
  #    conducción larga: la distancia entre bombas la fija la presión que
  #    aguanta la tubería.
  - id: ejflu12-col312-la-distancia-entre-bombas
    titulo: A qué distancia hay que poner las bombas de un oleoducto
    fuente: >-
      Ejercicio 3.12 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una tubería horizontal de $60\ \text{cm}$ de diámetro transporta
      $440\ \text{l/s}$ de un aceite de densidad relativa $0{,}825$. A lo largo
      de la conducción hay instaladas cuatro bombas iguales, siendo las
      presiones a la entrada y salida de cada una $-0{,}56$ y
      $25\ \text{kg/cm}^{2}$ respectivamente. Si la pérdida de carga es de
      $60\ \text{mcl}$ cada $1.000\ \text{m}$, se pide:

      a) Distancia existente entre las bombas.
    pide: La distancia entre dos bombas consecutivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tubería es horizontal y de diámetro constante. ¿Qué simplifica eso?
        opciones:
          - texto: >-
              Que la cota y la altura cinética son iguales en todos los puntos,
              así que toda la pérdida de carga se ve como caída de presión
            correcta: true
            mensaje: |
              Exacto. Con $z$ y $v$ constantes, Bernoulli se reduce a
              $p_1/\gamma - h_f = p_2/\gamma$: la presión y la energía se
              mueven juntas.
          - texto: >-
              Que no hay pérdidas de carga
            mensaje: |
              Las hay, y el enunciado las da: 60 mcl por cada kilómetro. Que la
              tubería sea horizontal no elimina el rozamiento.
          - texto: >-
              Que las cuatro bombas dan la misma altura
            mensaje: |
              La dan porque son iguales y trabajan entre las mismas presiones,
              no porque la tubería sea horizontal. Y ese dato no hace falta
              para responder.

      - tipo: calcular
        titulo: La caída de presión disponible
        pregunta: |
          ¿Cuántos metros de columna de aceite se pueden perder entre dos
          bombas?
        respuesta:
          tipo: magnitud
          valor: '309.8 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '255.6 m'
            mensaje: |
              Has convertido los $\text{kg/cm}^{2}$ a metros de columna de
              **agua**. El fluido es aceite, $\gamma = 0{,}825\cdot 9800$, y su
              columna es más alta para la misma presión.
          - valor: '302.9 m'
            mensaje: |
              Te has dejado la depresión de la entrada. La caída aprovechable
              va desde $+25$ hasta $-0{,}56\ \text{kg/cm}^{2}$: son $25{,}56$
              de diferencia, no 25.
        pista: |
          La diferencia entre la salida de una bomba y la entrada de la
          siguiente, pasada a metros de columna de **aceite**.
        desarrollo: |
          $$
          \Delta p = 25 - (-0{,}56) = 25{,}56\ \frac{\text{kg}}{\text{cm}^{2}}
          = 2\,504\,880\ \text{Pa}
          $$
          $$
          h_f = \frac{2\,504\,880}{0{,}825\cdot 9800} = 309{,}8\ \text{mcl}
          $$

      - tipo: calcular
        titulo: La distancia
        pregunta: |
          ¿Qué distancia hay entre bombas?
        respuesta:
          tipo: magnitud
          valor: '5164 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4260 m'
            mensaje: |
              Has usado la columna de agua en vez de la de aceite. La pérdida
              está dada en **mcl** —metros de columna del líquido que
              circula— y la presión hay que pasarla a esa misma unidad.
          - valor: '18590 m'
            mensaje: |
              Has multiplicado por 60 en vez de dividir. La pérdida son 60
              metros **cada mil**: cuantos más metros de carga haya
              disponibles, más lejos se puede poner la bomba siguiente, pero
              divididos entre 60.
        pista: |
          $60\ \text{mcl}$ por cada $1000\ \text{m}$.
        desarrollo: |
          $$
          L = \frac{309{,}8}{60}\cdot 1000 = 5164\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la tubería horizontal y de sección constante, toda la pérdida
              de carga se traduce en caída de presión.
          - texto: >-
              Entre la salida de una bomba y la entrada de la siguiente hay
              $25{,}56\ \text{kg/cm}^{2}$, es decir 309,8 metros de columna de
              aceite.
          - texto: >-
              A 60 mcl por kilómetro, eso da 5.164 m entre bombas: unos cinco
              kilómetros.
          - texto: >-
              El caudal de $440\ \text{l/s}$ y el diámetro de 60 cm son los
              datos que fijan la pérdida de carga unitaria.
            trampa: true
            mensaje: |
              La pérdida unitaria **la da el enunciado**: 60 mcl cada 1000 m.
              El caudal y el diámetro no se usan en ningún momento — están para
              que el problema parezca más largo de lo que es, y reconocer los
              datos que sobran es parte de resolverlo.

    resolucion: |
      **Con la tubería horizontal y de diámetro constante**, la cota y la
      velocidad son las mismas en todas partes, así que Bernoulli se reduce a

      $$
      \frac{p_1}{\gamma} - h_f = \frac{p_2}{\gamma}
      $$

      **La carga disponible entre dos bombas** es la diferencia entre la
      presión de salida de una y la de entrada de la siguiente:

      $$
      h_f = \frac{(25+0{,}56)\cdot 98\,000}{0{,}825\cdot 9800} = 309{,}8\ \text{mcl}
      $$
      $$
      L = \frac{309{,}8}{60}\cdot 1000 = 5164\ \text{m}
      $$

      **Cinco kilómetros entre bombas**, y eso es un dato de proyecto real: en
      un oleoducto la separación de las estaciones de bombeo la fija la presión
      que la tubería aguanta. Con 25 kg/cm² de salida —unas 25 atmósferas— y
      una pérdida de 60 metros por kilómetro, la conducción llega hasta ahí.

      **Y dos observaciones sobre los datos.** El caudal y el diámetro **no se
      usan**: la pérdida unitaria viene dada. Y la presión de entrada es
      **negativa**, $-0{,}56\ \text{kg/cm}^{2}$: la bomba aspira. Contar solo
      los 25 y olvidar esa depresión acorta la distancia en 113 metros — poco,
      pero es dinero en tubería.
  - id: ejflu12-col31-el-aire-que-se-ensancha-y-no-frena-tanto
    titulo: El aire que se ensancha, y no frena lo que parece
    fuente: Ejercicio 3.1 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por un conducto fluye aire. En la sección A el diámetro es de 100 mm, la
      temperatura 15 ºC, la presión 3 kg/cm² y la velocidad 25 m/s. En la
      sección B el diámetro es de 200 mm, la temperatura −5 ºC y la presión
      1,5 kg/cm². Se pide:

      a) Velocidad en la sección B.

      b) Caudal en peso.

      Dato: constante del aire $R_{aire} = 287{,}14$ m·N/(kg·K).
    pide: La velocidad en la sección ancha y el caudal en peso de la conducción.
    pasos:
      - tipo: reconocer
        pregunta: |
          El conducto pasa de 100 a 200 mm, o sea que la sección se
          **cuadruplica**. Sin calcular nada, ¿qué le pasa a la velocidad?
        opciones:
          - texto: |
              Baja, pero **menos** de cuatro veces: el aire también se expande,
              y un gas menos denso ocupa más sitio para el mismo gasto másico
            correcta: true
            mensaje: |
              Ese es el punto del ejercicio. Si el fluido fuera agua, cuadruplicar
              la sección dividiría la velocidad por cuatro y punto. Aquí el aire
              pasa de 4,78 a 3,23 kg/m³ —se expande un 48 %— y esa expansión
              tiene que salir por algún sitio: sale como velocidad. En vez de
              6,25 m/s queda en 9,26.
          - texto: Baja exactamente cuatro veces, a 6,25 m/s, por continuidad
            mensaje: |
              Eso es continuidad **volumétrica**, y solo vale si la densidad no
              cambia. Aquí cambia mucho: el aire pierde la mitad de su presión
              y se enfría veinte grados. Lo que se conserva siempre es el gasto
              **másico**, $\rho A V$, no el volumétrico.
          - texto: |
              Sube, porque al bajar la presión el aire se acelera como en un
              venturi
            mensaje: |
              En un venturi la presión baja **porque** el fluido se acelera al
              estrecharse, y aquí el conducto se ensancha. La velocidad baja;
              lo que discutimos es cuánto.
          - texto: |
              No se puede saber sin conocer las pérdidas de carga del tramo
            mensaje: |
              Las pérdidas afectan a la energía, y la continuidad no es una
              ecuación de energía: es de conservación de la masa. Lo que entra
              sale, se pierda carga o no.

      - tipo: calcular
        titulo: La densidad en la sección A
        pregunta: |
          Con $\rho = p/(R\,T)$ y $p_{atm} = 1{,}033$ kg/cm², ¿cuánto vale la
          densidad del aire en A? Cuidado con dos cosas a la vez.
        respuesta:
          tipo: magnitud
          valor: '4.78 kg/m3'
          tolerancia: 0.01
          formato: la densidad en kg/m³
        distractores:
          - valor: '3.56 kg/m3'
            mensaje: |
              Has usado los 3 kg/cm² tal cual. Esa es la lectura de un
              manómetro, o sea presión **relativa**: la ley de los gases pide
              la absoluta, que es $3 + 1{,}033 = 4{,}033$ kg/cm². Es el error
              más caro de este ejercicio porque no chirría — 3,56 kg/m³ es un
              valor perfectamente creíble para aire comprimido.
          - valor: '91.8 kg/m3'
            mensaje: |
              Has metido la temperatura en grados centígrados. La ley de los
              gases necesita kelvin, así que 15 ºC son 288 K. Y aquí el fallo sí
              chirría: 91,8 kg/m³ es aire más denso que el aceite.
          - valor: '0.0000488 kg/m3'
            mensaje: |
              Te has dejado la conversión de kg/cm² a pascales. Un kg/cm² es un
              kilopondio por centímetro cuadrado, o sea $9{,}8\cdot 10^{4}$ Pa
              — ese «kg» es una fuerza, no una masa.
        pista: |
          $p_{abs} = (3+1{,}033)\cdot 9{,}8\cdot 10^{4}$ Pa y $T = 288$ K.
        desarrollo: |
          $$
          \rho_A = \frac{p_A}{R\,T_A}
                 = \frac{(3+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot(15+273)}
                 = \frac{395\,234}{82\,696} = 4{,}78\ \text{kg/m}^{3}
          $$

          Dos conversiones y las dos se olvidan: la presión a **absoluta** y la
          temperatura a **kelvin**. Y una tercera que no es conversión sino
          lectura: en los enunciados de esta escuela **kg/cm² es una presión**,
          no una masa por unidad de área. Ese «kg» es un kilopondio, y equivale
          a 9,8·10⁴ Pa.

      - tipo: calcular
        titulo: La velocidad en B
        pregunta: |
          En B la densidad sale 3,23 kg/m³. Con el gasto másico conservado,
          ¿cuál es la velocidad en la sección B, en m/s?
        respuesta:
          tipo: magnitud
          valor: '9.26 m/s'
          tolerancia: 0.01
          formato: la velocidad en m/s
        distractores:
          - valor: '6.25 m/s'
            mensaje: |
              Ese es el resultado de $A_A V_A = A_B V_B$, o sea de conservar el
              **volumen**. Solo vale con densidad constante. Aquí el aire se
              expande de 4,78 a 3,23 kg/m³ y esa expansión aporta velocidad: la
              real es un 48 % mayor que 6,25, exactamente la razón de densidades.
          - valor: '11.64 m/s'
            mensaje: |
              Las cuentas están bien encadenadas y las densidades mal: parece
              que has usado las presiones relativas en las dos secciones. Como
              el fallo afecta a las dos, no se cancela — la razón
              $\rho_A/\rho_B$ cambia de 1,48 a 1,86.
          - valor: '37.0 m/s'
            mensaje: |
              Has aplicado la razón de densidades y te has dejado la de áreas.
              Y el resultado se descarta sin comprobar nada: el conducto se
              **ensancha**, así que la velocidad no puede salir mayor que los
              25 m/s de partida.
        pista: |
          $\rho_A A_A V_A = \rho_B A_B V_B$, y $A_B/A_A = 4$.
        desarrollo: |
          $$
          \rho_A A_A V_A = \rho_B A_B V_B
          \;\Longrightarrow\;
          V_B = V_A\,\frac{\rho_A}{\rho_B}\,\frac{A_A}{A_B}
              = 25\cdot\frac{4{,}78}{3{,}23}\cdot\frac{1}{4}
              = 9{,}26\ \text{m/s}
          $$

          Escrito así se ven separados los dos efectos: la razón de áreas
          divide por 4, y la de densidades multiplica por 1,48. El resultado neto
          es dividir por 2,7, no por 4.

      - tipo: calcular
        titulo: El caudal en peso
        pregunta: |
          ¿Cuál es el caudal en peso, en N/s?
        respuesta:
          tipo: magnitud
          valor: '9.2 N/s'
          tolerancia: 0.02
          formato: el caudal en peso, en N/s
        distractores:
          - valor: '0.939 N/s'
            mensaje: |
              Eso es el caudal **másico**, en kg/s, y está bien calculado. El
              caudal en peso es ese mismo por $g$: son newtons por segundo, no
              kilogramos por segundo.
          - valor: '0.196 N/s'
            mensaje: |
              Parece que has usado el caudal volumétrico en vez del másico. El
              paso obligatorio es multiplicar por la densidad: sin ella el
              número no tiene masa dentro y no puede tener peso.
        pista: |
          $G = \rho_A A_A V_A \cdot g$, y da igual la sección que elijas.
        desarrollo: |
          $$
          \dot m = \rho_A A_A V_A = 4{,}78\cdot\frac{\pi\,0{,}1^{2}}{4}\cdot 25
                 = 0{,}939\ \text{kg/s}
          $$

          $$
          G = \dot m\, g = 0{,}939\cdot 9{,}8 = 9{,}2\ \text{N/s}
          $$

          Y aquí hay una comprobación gratis que conviene coger la costumbre de
          hacer: el mismo cálculo en la sección B tiene que dar lo mismo.

          $$
          \rho_B A_B V_B = 3{,}23\cdot 0{,}0314\cdot 9{,}26 = 0{,}939\ \text{kg/s}
          \quad\checkmark
          $$

          Si no coincide, el fallo está en las densidades o en la velocidad de
          B, y lo sabes sin mirar la solución.

      - tipo: justificar
        pregunta: |
          Ordena el argumento del apartado a). Una pieza es falsa.
        piezas:
          - texto: |
              Lo que se conserva entre A y B es el **gasto másico**,
              $\rho A V$, porque no entra ni sale aire por las paredes del
              conducto.
          - texto: |
              El gasto **volumétrico** no se conserva: $Q_A = 0{,}196$ m³/s y
              $Q_B = 0{,}291$ m³/s. El aire ocupa un 48 % más de sitio en B
              porque está a menos presión y más frío.
          - texto: |
              Las densidades salen de la ley de los gases con la presión
              **absoluta** —hay que sumar la atmosférica a la lectura del
              manómetro— y la temperatura en kelvin: 4,78 y 3,23 kg/m³.
          - texto: |
              Con eso, $V_B = V_A(\rho_A/\rho_B)(A_A/A_B) = 9{,}26$ m/s: la
              sección divide por cuatro y la expansión multiplica por 1,48.
          - texto: |
              Que el volumen aumente y la masa se conserve significa que en el
              tramo se ha perdido aire; por eso hay que trabajar siempre con el
              gasto másico, que es el único que no se escapa.
            trampa: true
            mensaje: |
              No se pierde aire: no se pierde **nada**. Que el volumen aumente y
              la masa se conserve es justo lo que hace un gas al expandirse —la
              misma masa ocupando más sitio—, y es la definición de que baje la
              densidad. Si se escapara aire, tampoco se conservaría el gasto
              másico y la ecuación que hemos usado no valdría.
    resolucion: |
      **Continuidad cuando el fluido se expande.**

      Con agua, este problema sería una línea: la sección se cuadruplica, la
      velocidad se divide por cuatro, 6,25 m/s. Con aire no, y la diferencia es
      el 48 %.

      **1 · Las densidades**, con la ley de los gases y las dos conversiones que
      se olvidan —presión **absoluta**, temperatura en **kelvin**—:

      $$
      \rho_A = \frac{(3+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot 288}
             = 4{,}78\ \text{kg/m}^{3}
      \qquad
      \rho_B = \frac{(1{,}5+1{,}033)\cdot 9{,}8\cdot 10^{4}}{287{,}14\cdot 268}
             = 3{,}23\ \text{kg/m}^{3}
      $$

      **2 · La continuidad, en masa.**

      $$
      \rho_A A_A V_A = \rho_B A_B V_B
      \;\Longrightarrow\;
      V_B = 25\cdot\frac{4{,}78}{3{,}23}\cdot\frac{1}{4} = 9{,}26\ \text{m/s}
      $$

      **3 · El caudal en peso.**

      $$
      G = \rho_A A_A V_A\, g = 0{,}939\cdot 9{,}8 = 9{,}2\ \text{N/s}
      $$

      **Las tres cosas que este ejercicio pone a prueba, y ninguna es la
      continuidad.** La ecuación es la de siempre. Lo que se falla es lo de
      alrededor:

      - **kg/cm² es una presión**, con un kilopondio dentro: $9{,}8\cdot 10^{4}$ Pa.
      - Y es una presión **relativa**: la ley de los gases quiere la absoluta,
        así que hay que sumar la atmosférica. Olvidarlo cambia la respuesta un
        26 % y produce un número perfectamente creíble.
      - La temperatura, en kelvin. Este sí avisa, porque en B saldría negativa.

      Y una costumbre que ahorra disgustos: **calcular el gasto másico por las
      dos secciones**. Tienen que dar lo mismo, y si no dan lo mismo el error
      está localizado antes de mirar ninguna solución.
  - id: ejflu12-col314-el-sifon-con-boquilla-y-perdidas
    titulo: Un sifón con boquilla, primero ideal y luego con pérdidas
    fuente: >-
      Ejercicio 3.14 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un depósito cuya lámina de agua está en la cota $4{,}5$ descarga a través
      de una boquilla $S$, por medio del sifón $BCD$. La cota superior
      $z_C = 6\ \text{m}$ y la inferior $z_S = 2\ \text{m}$.

      El sifón es una tubería de $D = 50\ \text{mm}$. El factor de paso de
      pérdidas de carga entre $B$ y $C$ es $K_{BC} = 1$ y entre $C$ y $D$ es
      $K_{CD} = 1{,}2$. El factor de paso adimensional de la boquilla, con la
      energía cinética a la salida, es $K_{\text{boquilla}} = 0{,}1$. Se pide:

      a) $Q$ (l/s) y presión $p_C$ (mca), si se considera el agua fluido
      perfecto.

      b) $Q$ (l/s) y presión $p_C$ (mca), en el caso de fluido viscoso.

      c) Calcular la cota $z_C$ a la que debería estar el punto $C$ para que
      empiece la cavitación, manteniendo todos los demás parámetros
      invariables. Calcular asimismo el $Q$ circulante.

      Datos: $D_{\text{boquilla}} = 25\ \text{mm}$; $D_{\text{tubería}} =
      50\ \text{mm}$; $p_v/\gamma = 1\ \text{mca}$ (absoluta);
      $p_{\text{atm}} = 10\ \text{mca}$.
    pide: El caudal y la presión en C con y sin pérdidas, y la cota límite de cavitación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los factores de paso multiplican a $v^{2}/2g$. ¿A qué velocidad, la
          de la tubería o la de la boquilla?
        opciones:
          - texto: >-
              $K_{BC}$ y $K_{CD}$ a la de la **tubería**, y
              $K_{\text{boquilla}}$ a la de **salida**, que es cuatro veces
              mayor
            correcta: true
            mensaje: |
              Exacto, y el enunciado lo dice: «con la energía cinética a la
              salida». Como las áreas están en relación 4 a 1, las velocidades
              también, y las alturas cinéticas en 16 a 1.
          - texto: >-
              Todos a la velocidad de la tubería
            mensaje: |
              El de la boquilla no: el enunciado especifica que va con la
              energía cinética **a la salida**. Aplicarlo a la de la tubería lo
              haría dieciséis veces menor y prácticamente irrelevante.
          - texto: >-
              Todos a la velocidad de salida, que es la mayor
            mensaje: |
              Las pérdidas de $BC$ y $CD$ ocurren dentro de la tubería de
              50 mm, donde la velocidad es la de la tubería. Aplicarles la de
              salida las multiplicaría por dieciséis.

      - tipo: calcular
        titulo: El caudal con fluido perfecto
        pregunta: |
          ¿Qué caudal circula si se desprecian las pérdidas?
        respuesta:
          tipo: magnitud
          valor: '3.436 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '13.74 l/s'
            mensaje: |
              Has usado el área de la tubería en vez de la de la boquilla. El
              caudal lo fija la sección por la que sale el chorro:
              $25\ \text{mm}$, cuatro veces menos área.
          - valor: '4.346 l/s'
            mensaje: |
              Parece que has usado la cota del vértice, 6 m, en vez de la
              diferencia entre la lámina y la salida. El vértice no interviene
              en el caudal: Bernoulli va de la lámina a la salida.
        pista: |
          Bernoulli de la lámina (4,5) a la salida (2): toda la diferencia se
          convierte en velocidad de salida.
        desarrollo: |
          $$
          4{,}5 - 2 = \frac{v_{\text{boq}}^{2}}{2g}
          \;\Longrightarrow\;
          v_{\text{boq}} = \sqrt{2{,}5\cdot 19{,}6} = 7\ \text{m/s}
          $$
          $$
          Q = 7\cdot\frac{\pi\,0{,}025^{2}}{4} = 3{,}436\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal con pérdidas
        pregunta: |
          ¿Y teniendo en cuenta las pérdidas?
        respuesta:
          tipo: magnitud
          valor: '3.089 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '1.892 l/s'
            mensaje: |
              Has aplicado los tres factores de paso a la velocidad de salida.
              Los de la tubería van con la velocidad de la tubería, que es
              cuatro veces menor: su contribución es dieciséis veces más
              pequeña de lo que has puesto.
          - valor: '3.222 l/s'
            mensaje: |
              Te has dejado el factor de la boquilla. Aunque valga solo
              $0{,}1$, va multiplicado por la altura cinética **de salida**,
              que es la grande.
        pista: |
          $2{,}5 = \dfrac{v_{\text{boq}}^{2}}{2g}(1+K_{\text{boq}}) +
          (K_{BC}+K_{CD})\dfrac{v_{\text{tub}}^{2}}{2g}$, con
          $v_{\text{tub}} = v_{\text{boq}}/4$.
        desarrollo: |
          $$
          2{,}5 = \frac{v_{\text{boq}}^{2}}{2g}\left[1 + 0{,}1
          + \frac{1+1{,}2}{16}\right]
          = 1{,}2375\,\frac{v_{\text{boq}}^{2}}{2g}
          $$
          $$
          \frac{v_{\text{boq}}^{2}}{2g} = 2{,}020
          \;\Longrightarrow\;
          v_{\text{boq}} = 6{,}293\ \text{m/s}
          \;\Longrightarrow\;
          Q = 3{,}089\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La cota límite del vértice
        pregunta: |
          ¿A qué cota tendría que estar $C$ para que empezara la cavitación?
        respuesta:
          tipo: magnitud
          valor: '13.25 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14.25 m'
            mensaje: |
              Te has dejado la tensión de vapor: has usado $-10$ mca en $C$,
              es decir el vacío absoluto. El límite es $1\ \text{mca}$
              **absoluto**, así que en manométrica son $-9$.
          - valor: '4.5 m'
            mensaje: |
              Esa es la cota de la lámina. La pregunta es cuánto puede subir el
              vértice por encima de ella: nueve metros menos lo que se lleven
              la velocidad y las pérdidas.
        pista: |
          Bernoulli de la lámina a $C$, con $p_C$ igual a la presión de vapor
          en manométrica, y el caudal del apartado anterior.
        desarrollo: |
          $$
          \frac{p_C}{\gamma} = 1 - 10 = -9\ \text{mca}
          \qquad
          \frac{v_{\text{tub}}^{2}}{2g} = \frac{(6{,}293/4)^{2}}{19{,}6}
          = 0{,}126\ \text{m}
          $$
          $$
          0 = -9 + 0{,}126 + (z_C - 4{,}5) + 1\cdot 0{,}126
          $$
          $$
          z_C = 4{,}5 + 9 - 0{,}252 = 13{,}247\ \text{m}
          $$

          Y el caudal no cambia: sigue siendo $3{,}089\ \text{l/s}$, porque lo
          fijan la lámina y la salida, no el vértice.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El caudal lo fija Bernoulli entre la lámina y la salida: la cota
              del vértice no interviene en él.
          - texto: >-
              Con pérdidas, el caudal baja de 3,436 a 3,089 l/s, un 10 %, y la
              presión en $C$ pasa de $-1{,}656$ a $-1{,}753$ mca.
          - texto: >-
              El vértice podría subir hasta la cota 13,25 antes de cavitar,
              con el mismo caudal circulando.
          - texto: >-
              Como al subir el vértice el agua tiene que remontar más altura,
              el caudal disminuiría.
            trampa: true
            mensaje: |
              No disminuye: el caudal depende solo de la diferencia entre la
              lámina y la salida y de las pérdidas del recorrido, no de lo alto
              que pase por el medio. Lo que sí cambia al subir el vértice es la
              **presión** allí, y por eso hay un límite.

    resolucion: |
      **La idea que ordena los tres apartados**: el caudal lo fijan la lámina y
      la salida; el vértice solo decide si el sifón puede funcionar o no.

      **a) Fluido perfecto.**

      $$
      v_{\text{boq}} = \sqrt{2g(4{,}5-2)} = 7\ \text{m/s}
      \qquad
      Q = 3{,}436\ \text{l/s}
      \qquad
      \frac{p_C}{\gamma} = -1{,}5 - 0{,}156 = -1{,}656\ \text{mca}
      $$

      **b) Con pérdidas.** Los factores de la tubería van con
      $v_{\text{tub}} = v_{\text{boq}}/4$ y el de la boquilla con la de salida:

      $$
      2{,}5 = \frac{v_{\text{boq}}^{2}}{2g}\left[1{,}1 + \frac{2{,}2}{16}\right]
      \;\Longrightarrow\;
      Q = 3{,}089\ \text{l/s}
      \qquad
      \frac{p_C}{\gamma} = -1{,}753\ \text{mca}
      $$

      **c) El límite.** Con $p_C$ en la presión de vapor, $-9$ mca
      manométricos:

      $$
      z_C = 4{,}5 + 9 - 2\cdot 0{,}126 = 13{,}25\ \text{m}
      $$

      **Tres lecturas.**

      La primera: **las pérdidas cuestan un 10 % de caudal** y solo un 6 % de
      presión en el vértice. No son proporcionales porque afectan a tramos
      distintos del recorrido.

      La segunda: **el vértice podría estar nueve metros más arriba**. En este
      sifón la cota de 6 m está muy lejos del límite; el problema del ejercicio
      3.15 era el contrario, con el vértice justo en el límite.

      La tercera, que es la de fondo: **subir el vértice no reduce el caudal**.
      Cuesta trabajo aceptarlo —parece que remontar más altura debería costar
      más— pero el agua que sube por un lado baja por el otro y devuelve lo
      gastado. Lo único que se pierde de verdad son las pérdidas de carga, que
      dependen de la longitud y de las piezas, no de la altura del vértice.

  # ── COLECCIÓN 3.29. Venturímetro vertical: el detalle que enseña es que la
  #    lectura del manómetro NO depende de la inclinación.
  - id: ejflu12-col315-el-sifon-limitado-por-la-cavitacion
    titulo: El caudal máximo de un sifón antes de que cavite
    fuente: >-
      Ejercicio 3.15 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un sifón que permite la salida del agua de un recipiente de grandes
      dimensiones está constituido por un tubo de $10\ \text{cm}$ de diámetro,
      en el cual la línea central superior se encuentra $4\ \text{m}$ por
      encima de la superficie libre del depósito. Se pide:

      a) Caudal máximo que puede obtenerse con este dispositivo sin que se
      produzca cavitación.

      b) Cota de salida del sifón con relación al nivel superior del depósito.

      Dato: tensión de vapor máxima del líquido $= 1\ \text{mca}$ (presión
      absoluta); $p_{\text{atm}} = 1\ \text{bar}$.

      Nota: la cavitación teórica se produce en aquel punto en que su presión
      es equivalente a la tensión de vapor máxima del líquido que fluye.
    pide: El caudal máximo sin cavitación y la cota de salida del sifón.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el punto crítico de un sifón y por qué?
        opciones:
          - texto: >-
              En el vértice, porque es donde se juntan la máxima cota y la
              velocidad de circulación: los dos términos restan presión
            correcta: true
            mensaje: |
              Eso es. Bernoulli desde la superficie del depósito hasta el
              vértice: la altura ganada y la energía cinética salen las dos de
              la presión, y por eso allí es mínima.
          - texto: >-
              En la salida, porque es donde el agua va más deprisa
            mensaje: |
              En la salida la presión es la atmosférica —el chorro descarga al
              aire— así que no puede cavitar. Y la velocidad es la misma que en
              el vértice, porque el tubo tiene sección constante.
          - texto: >-
              En la superficie del depósito, porque allí la presión es cero
            mensaje: |
              Allí la presión es la atmosférica, que es la **mayor** de todo el
              recorrido. Desde ahí el sifón solo puede perder presión.

      - tipo: calcular
        titulo: El caudal máximo
        pregunta: |
          ¿Qué caudal máximo admite el sifón?
        respuesta:
          tipo: magnitud
          valor: '79.3 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '86.61 l/s'
            mensaje: |
              Te has dejado la tensión de vapor. El límite no es el vacío
              absoluto sino $1\ \text{mca}$ de presión absoluta: por debajo de
              eso el agua hierve.
          - valor: '105.5 l/s'
            mensaje: |
              Te has dejado los $4\ \text{m}$ del vértice. El agua tiene que
              **subir** esa altura antes de bajar, y esos cuatro metros salen
              del mismo presupuesto de presión que la velocidad.
        pista: |
          Bernoulli desde la superficie hasta el vértice, con la presión
          manométrica allí igual a $p_v - p_{\text{atm}}$.
        desarrollo: |
          $$
          p_{\text{atm}} = 1\ \text{bar} = 10{,}2\ \text{mca}
          \qquad
          \frac{p_{\text{vértice}}}{\gamma} = 1 - 10{,}2 = -9{,}2\ \text{mca}
          $$
          $$
          0 = -9{,}2 + \frac{v^{2}}{2g} + 4
          \;\Longrightarrow\;
          \frac{v^{2}}{2g} = 5{,}20\ \text{m}
          \;\Longrightarrow\;
          v = 10{,}10\ \text{m/s}
          $$
          $$
          Q = 10{,}10\cdot\frac{\pi\,0{,}1^{2}}{4} = 0{,}0793\ \text{m}^{3}/\text{s}
          = 79{,}3\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La cota de salida
        pregunta: |
          ¿A qué cota, respecto del nivel del depósito, tiene que estar la
          salida?
        respuesta:
          tipo: magnitud
          valor: '-5.2 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad (y con su signo)
        distractores:
          - valor: '-9.2 m'
            mensaje: |
              Esa es la presión manométrica en el vértice, no una cota. La cota
              de salida sale de Bernoulli entre la superficie y la salida,
              donde la presión vuelve a ser atmosférica.
          - valor: '-1.2 m'
            mensaje: |
              Parece que has restado los 4 m del vértice en vez de dejarlos
              fuera. Entre la superficie y la salida, la altura del vértice no
              interviene: solo entran la cota de salida y la altura cinética.
        pista: |
          Bernoulli entre la superficie del depósito y la salida: las dos a
          presión atmosférica.
        desarrollo: |
          $$
          0 = 0 + \frac{v^{2}}{2g} + z_s
          \;\Longrightarrow\;
          z_s = -\frac{v^{2}}{2g} = -5{,}20\ \text{m}
          $$

          Es decir, la salida tiene que estar $5{,}2\ \text{m}$ **por debajo**
          del nivel del depósito.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto crítico es el vértice: allí la cota y la velocidad
              restan presión a la vez, y allí es donde puede alcanzarse la
              tensión de vapor.
          - texto: >-
              Con $1\ \text{mca}$ absolutos de límite y la atmosférica en
              10,2, la presión manométrica máxima admisible en el vértice es
              $-9{,}2$ mca.
          - texto: >-
              De ahí sale $v = 10{,}1$ m/s y $Q = 79{,}3$ l/s, y la salida
              tiene que estar 5,2 m por debajo del depósito.
          - texto: >-
              Si se bajara aún más la salida, el caudal seguiría creciendo
              mientras el sifón esté cebado.
            trampa: true
            mensaje: |
              Crecería la **velocidad teórica**, sí, pero el vértice ya está en
              el límite: bajar más la salida haría cavitar el sifón, se rompería
              la vena líquida y el caudal **caería**. Los 5,2 m no son una
              elección, son el máximo que la cavitación permite.

    resolucion: |
      **El sifón funciona porque la atmosférica empuja**, y ese es todo su
      límite: no puede aspirar más de lo que la atmósfera da, y ni siquiera
      eso, porque antes el agua hierve.

      **a) El punto crítico y el caudal.** Bernoulli desde la superficie hasta
      el vértice, con la presión allí igual a la de vapor:

      $$
      0 = \underbrace{(1-10{,}2)}_{-9{,}2\ \text{mca}} + \frac{v^{2}}{2g} + 4
      \;\Longrightarrow\;
      \frac{v^{2}}{2g} = 5{,}20\ \text{m}
      \;\Longrightarrow\;
      Q = 79{,}3\ \text{l/s}
      $$

      **b) La cota de salida.** Entre la superficie y la salida, las dos a
      presión atmosférica:

      $$
      z_s = -\frac{v^{2}}{2g} = -5{,}2\ \text{m}
      $$

      **Cómo leer los dos resultados juntos.** El presupuesto de presión del
      sifón es de $10{,}2$ mca —lo que da la atmósfera—, y se gasta en tres
      cosas: $4$ m en subir hasta el vértice, $5{,}2$ en acelerar el agua y
      $1$ mca que hay que dejar sin gastar para que no hierva. Suman
      exactamente $10{,}2$.

      Eso convierte el problema en un reparto: **si se sube el vértice, hay
      que renunciar a caudal**; si se quiere más caudal, hay que bajar el
      vértice. Y por encima de unos $8\ \text{m}$ de vértice ya no queda nada
      para la velocidad: un sifón de agua no puede pasar por encima de esa
      altura, por larga que sea la manguera.

      > **Nota sobre el resultado publicado.** El boletín da $80{,}3$ l/s y
      > $-5{,}3$ m, que corresponden a tomar la atmosférica como
      > $10{,}33\ \text{mca}$ —una atmósfera— en vez de $1\ \text{bar} =
      > 10{,}2$, que es lo que dice el enunciado. La diferencia es del 1,2 % y
      > las dos respuestas se dan por buenas.

  # ── COLECCIÓN 3.14. El mismo sifón, pero con boquilla y con pérdidas, y con
  #    un apartado que invierte la pregunta: hasta dónde se puede subir el
  #    vértice antes de cavitar.
  - id: ejflu12-col32-la-pieza-en-y-y-el-flujo-que-se-reparte
    titulo: La pieza en Y, y el flujo que se reparte
    fuente: Ejercicio 3.2 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Por la pieza en Y de la figura circula agua a 20 ºC ($\rho = 1000$ kg/m³).
      El flujo en peso (entrante) en la sección 1 es de 5300 N/s, y la velocidad
      en la sección 3 es de 5 m/s. Calcular:

      a) Velocidad en la sección 1.

      b) Flujo másico saliente en la sección 3.

      c) Velocidad en la sección 2.

      d) Flujo volumétrico en la sección 2.

      <figure class="figura-examen">
      <svg viewBox="0 10 360 280" role="img" width="430" height="334"
           aria-labelledby="f32t f32d">
        <title id="f32t">La pieza en Y: entra por 1, con 450 mm, y sale por 2, de 300 mm, y por 3, de 200 mm</title>
        <desc id="f32d">Un tubo horizontal de 450 mm de diámetro llega por la
        izquierda y se bifurca en dos ramas hacia la derecha: la 2, de 300 mm,
        sube en diagonal, y la 3, de 200 mm, baja en diagonal. Las flechas
        marcan el sentido del flujo, entrando por 1 y saliendo por 2 y 3. Los
        diámetros están dibujados a escala.</desc>
        <defs>
          <marker id="m32l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <line x1="20" y1="150" x2="172" y2="150" stroke="var(--ink)" stroke-width="94"/>
        <line x1="150" y1="150" x2="330" y2="46" stroke="var(--ink)" stroke-width="64"/>
        <line x1="150" y1="150" x2="330" y2="254" stroke="var(--ink)" stroke-width="44"/>
        <line x1="20" y1="150" x2="174" y2="150" stroke="var(--panel)" stroke-width="90"/>
        <line x1="148" y1="150" x2="332" y2="46" stroke="var(--panel)" stroke-width="60"/>
        <line x1="148" y1="150" x2="332" y2="254" stroke="var(--panel)" stroke-width="40"/>
        <line x1="50" y1="150" x2="110" y2="150" stroke="var(--live)" stroke-width="2" marker-end="url(#m32l)"/>
        <line x1="212" y1="112" x2="264" y2="82" stroke="var(--live)" stroke-width="2" marker-end="url(#m32l)"/>
        <line x1="212" y1="188" x2="264" y2="218" stroke="var(--live)" stroke-width="2" marker-end="url(#m32l)"/>
        <text x="58" y="134" font-size="9.5" fill="var(--live)">5 300 N/s</text>
        <text x="22" y="96" font-size="10" fill="var(--ink)">1 · Ø 450 mm</text>
        <text x="140" y="48" font-size="10" fill="var(--ink)">2 · Ø 300 mm</text>
        <text x="140" y="270" font-size="10" fill="var(--ink)">3 · Ø 200 mm · V3 = 5 m/s</text>
      </svg>
      <figcaption>Los tres diámetros a escala. Lo que entra por 1 sale repartido entre 2 y 3, y la sección 2, aunque se lleva menos masa, es la que tiene más velocidad.</figcaption>
      </figure>
    pide: La velocidad en 1, el flujo másico en 3, y la velocidad y el caudal en 2.
    pasos:
      - tipo: reconocer
        pregunta: |
          El dato de entrada es un **flujo en peso**, 5 300 N/s. ¿Qué es, y qué
          hay que hacer con él antes de aplicar la continuidad?
        opciones:
          - texto: Peso por segundo. Dividido entre g da el flujo másico, 540,8 kg/s, que es lo que conserva la continuidad
            correcta: true
            mensaje: |
              Eso es. Newtons por segundo entre 9,8 N/kg son kilogramos por
              segundo, y la continuidad dice que la masa que entra por 1 es la
              que sale por 2 y por 3.
          - texto: Un caudal. 5 300 N/s de agua son 5,3 m³/s, porque un litro pesa 9,8 N
            mensaje: |
              Un litro de agua pesa 9,8 N, así que 5 300 N/s son 5 300/9,8 =
              540,8 litros por segundo, no 5 300. Es un flujo en peso: primero
              se pasa a masa o a volumen dividiendo entre $g$ o entre $\gamma$.
          - texto: Una fuerza sobre la sección 1. Dividida entre el área da la presión de entrada
            mensaje: |
              No es una fuerza: son newtons **por segundo**, un flujo. La presión
              no aparece en este problema; solo la conservación de la masa.

      - tipo: calcular
        titulo: La velocidad de entrada
        pregunta: |
          Velocidad en la sección 1, de 450 mm de diámetro.
        respuesta:
          tipo: magnitud
          valor: '3.4 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '33.3 m/s'
            mensaje: |
              Has usado los 5 300 como si fueran kg/s. Son N/s: entre 9,8 quedan
              540,8 kg/s, y la velocidad es diez veces menor.
          - valor: '0.85 m/s'
            mensaje: |
              Has tomado los 450 mm como radio. Es el diámetro: la sección es
              $\pi \cdot 0{,}45^{2}/4 = 0{,}159$ m², cuatro veces menor que la
              que has usado.
        pista: |
          $\dot m = \rho V A$, con $\dot m_1 = 5\,300/9{,}8$ kg/s y
          $A_1 = \pi D_1^{2}/4$.
        desarrollo: |
          $$
          \dot m_1 = \frac{5\,300}{9{,}8} = 540{,}8\ \text{kg/s} \qquad V_1 = \frac{\dot m_1}{\rho A_1} = \frac{540{,}8}{1\,000 \cdot \pi \cdot 0{,}45^{2}/4} = 3{,}40\ \text{m/s}
          $$

      - tipo: calcular
        titulo: Lo que sale por 3
        pregunta: |
          Flujo másico saliente por la sección 3, de 200 mm, a 5 m/s.
        respuesta:
          tipo: magnitud
          valor: '157.08 kg/s'
          tolerancia: 0.01
          formato: un flujo másico con su unidad (kg/s)
        distractores:
          - valor: '1539 kg/s'
            mensaje: |
              Has multiplicado por $g$. Eso sería el flujo **en peso** de la
              sección 3, en N/s; el másico es $\rho V A$, sin más.
          - valor: '628.3 kg/s'
            mensaje: |
              Has tomado los 200 mm como radio. Con el diámetro, la sección es
              $\pi \cdot 0{,}2^{2}/4 = 0{,}0314$ m².
        pista: |
          $\dot m_3 = \rho V_3 A_3$; aquí lo tienes todo, no hace falta la
          continuidad todavía.
        desarrollo: |
          $$
          \dot m_3 = 1\,000 \cdot 5 \cdot \frac{\pi \cdot 0{,}2^{2}}{4} = 157{,}08\ \text{kg/s}
          $$

      - tipo: calcular
        titulo: La velocidad en 2
        pregunta: |
          Velocidad en la sección 2, de 300 mm.
        respuesta:
          tipo: magnitud
          valor: '5.43 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '7.65 m/s'
            mensaje: |
              Has mandado por la rama 2 todo lo que entra por 1. La rama 3 se
              lleva 157 kg/s: por la 2 pasan $540{,}8 - 157{,}1 = 383{,}7$ kg/s.
          - valor: '3.4 m/s'
            mensaje: |
              Has supuesto que la velocidad se conserva. Lo que se conserva es
              la **masa**; la velocidad de cada rama depende de su sección, y la
              2 es 2,25 veces más estrecha que la 1.
          - valor: '1.36 m/s'
            mensaje: |
              Has tomado los 300 mm como radio. Con el diámetro, la sección es
              $\pi \cdot 0{,}3^{2}/4 = 0{,}0707$ m².
        pista: |
          Continuidad en la bifurcación: $\dot m_1 = \dot m_2 + \dot m_3$.
          Después, $V_2 = \dot m_2/(\rho A_2)$.
        desarrollo: |
          $$
          \dot m_2 = 540{,}8 - 157{,}1 = 383{,}7\ \text{kg/s} \qquad V_2 = \frac{383{,}7}{1\,000 \cdot \pi \cdot 0{,}3^{2}/4} = 5{,}43\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El caudal en 2
        pregunta: |
          Flujo volumétrico por la sección 2.
        respuesta:
          tipo: magnitud
          valor: '0.3838 m3/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (m³/s o l/s)
        distractores:
          - valor: '383.8 m3/s'
            mensaje: |
              Te has saltado la densidad. 383,8 son kilogramos por segundo;
              entre 1 000 kg/m³ quedan 0,3838 m³/s, es decir, 383,8 litros.
          - valor: '0.5408 m3/s'
            mensaje: |
              Eso es el caudal de la sección 1, entero. Por la 2 pasa lo que
              queda después de la rama 3.
        pista: |
          Agua, incompresible: $Q_2 = \dot m_2/\rho$.
        desarrollo: |
          $$
          Q_2 = \frac{\dot m_2}{\rho} = \frac{383{,}7}{1\,000} = 0{,}3838\ \text{m}^{3}\text{/s} = 383{,}8\ \text{l/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la bifurcación. Una pieza es falsa.
        piezas:
          - texto: 'El flujo en peso se convierte en másico dividiendo entre g: 5 300 N/s son 540,8 kg/s.'
          - texto: En cada sección el flujo másico es ρ V A, y lo que sale por 2 y por 3 suma lo que entra por 1.
          - texto: 'Como el agua es incompresible, el caudal en volumen se reparte igual que el másico: Q2 = m2/ρ.'
          - texto: La velocidad en 2 se obtiene restando, V2 = V1 − V3, porque la continuidad es una suma de velocidades.
            trampa: true
            mensaje: |
              La continuidad suma **flujos**, no velocidades. De hecho $V_2 =
              5{,}43$ m/s es mayor que $V_1 = 3{,}4$ aunque por 2 pase menos
              masa que por 1: la sección es 2,25 veces menor.
    resolucion: |
      **Primero, el dato en la unidad buena.** Un flujo en peso de 5 300 N/s es
      un flujo másico de $5\,300/9{,}8 = 540{,}8$ kg/s. Todo lo demás es
      $\dot m = \rho V A$ y la conservación de la masa en la bifurcación.

      **Las cuatro respuestas.**

      $$
      V_1 = \frac{540{,}8}{1\,000 \cdot \pi \cdot 0{,}45^{2}/4} = 3{,}40\ \text{m/s} \qquad \dot m_3 = 1\,000 \cdot 5 \cdot \frac{\pi \cdot 0{,}2^{2}}{4} = 157{,}1\ \text{kg/s}
      $$

      $$
      \dot m_2 = 540{,}8 - 157{,}1 = 383{,}7\ \text{kg/s} \qquad V_2 = \frac{383{,}7}{1\,000 \cdot \pi \cdot 0{,}3^{2}/4} = 5{,}43\ \text{m/s} \qquad Q_2 = 0{,}3838\ \text{m}^{3}\text{/s}
      $$

      Las cuatro coinciden con el boletín (3,4 m/s; 157,08 kg/s; 5,429 m/s;
      0,3838 m³/s).

      **Lo que conviene mirar.** La rama 2 se lleva el 71 % de la masa y aun
      así va más rápida que el tubo de entrada, porque su sección es
      $(300/450)^{2} = 0{,}44$ de la de 1. La continuidad no reparte
      velocidades: reparte masa, y la velocidad de cada rama la fija su
      sección.
  - id: ejflu12-col33-la-bomba-entre-dos-depositos-y-las-perdidas-en-dos-unidades
    titulo: La bomba entre dos depósitos, y las pérdidas en dos unidades
    fuente: Ejercicio 3.3 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En el sistema mostrado en la figura adjunta, la bomba BC debe bombear un
      caudal de 160 l/s de un aceite de densidad relativa 0,762 hacia el
      recipiente D. Sabiendo que la pérdida de energía entre A y B es 2,6 mca y
      entre C y D es de 6,5 mcaceite, se pide:

      a) Potencia útil de la bomba.

      <figure class="figura-examen">
      <svg viewBox="0 0 442 262" role="img" width="442" height="262"
           aria-labelledby="f33t f33d">
        <title id="f33t">El depósito A a 15 m, la bomba BC a 3 m y el depósito D a 60 m, con las dos pérdidas por el camino</title>
        <desc id="f33d">Dos depósitos de aceite y una bomba entre ellos, con
        las cotas a escala: la lámina libre de A está a 15 m, la bomba BC a
        3 m y la lámina libre de D a 60 m. La tubería de aspiración baja de A
        a B con una pérdida de 2,6 metros de columna de agua; la de impulsión
        sube de C a D con una pérdida de 6,5 metros de columna de aceite.</desc>
        <defs>
          <marker id="m33l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <line x1="20" y1="230" x2="400" y2="230" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="420" y="234" font-size="9.5" fill="var(--faint)">0 m</text>
        <rect x="30" y="185" width="100" height="24" fill="var(--live)" opacity="0.15"/>
        <path d="M30,185 v24 h100 v-24" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="30" y1="185" x2="130" y2="185" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M78,176 l8,0 l-4,7 z" fill="var(--live)"/>
        <text x="36" y="203" font-size="10" fill="var(--ink)">A · 15 m</text>
        <rect x="316" y="50" width="84" height="26" fill="var(--live)" opacity="0.15"/>
        <path d="M316,50 v26 h84 v-26" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="316" y1="50" x2="400" y2="50" stroke="var(--live)" stroke-width="1.5"/>
        <path d="M354,41 l8,0 l-4,7 z" fill="var(--live)"/>
        <text x="322" y="68" font-size="10" fill="var(--ink)">D · 60 m</text>
        <path d="M130,205 L200,221" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <rect x="200" y="212" width="50" height="18" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="196" y="246" font-size="10" fill="var(--ink)">B</text>
        <text x="246" y="246" font-size="10" fill="var(--ink)">C</text>
        <text x="256" y="226" font-size="9.5" fill="var(--faint)">3 m</text>
        <path d="M250,221 L316,66" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
        <line x1="150" y1="209" x2="182" y2="216" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m33l)"/>
        <line x1="270" y1="174" x2="290" y2="127" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m33l)"/>
        <text x="30" y="252" font-size="9.5" fill="var(--flag)">hf AB = 2,6 mca</text>
        <text textLength="126" lengthAdjust="spacingAndGlyphs" x="296" y="150" font-size="9.5" fill="var(--flag)">hf CD = 6,5 m de aceite</text>
        <text x="200" y="196" font-size="9.5" fill="var(--live)">Q = 160 l/s · S = 0,762</text>
        <line x1="12" y1="185" x2="12" y2="230" stroke="var(--faint)" stroke-width="1"/>
        <path d="M8,185 h8 M8,230 h8" stroke="var(--faint)" stroke-width="1"/>
        <line x1="410" y1="50" x2="410" y2="230" stroke="var(--faint)" stroke-width="1"/>
        <path d="M406,50 h8 M406,230 h8" stroke="var(--faint)" stroke-width="1"/>
      </svg>
      <figcaption>Las tres cotas a escala: 15, 3 y 60 m. La altura que la bomba tiene que dar es la diferencia entre las dos láminas libres más las dos pérdidas, y la cota de la propia bomba no entra.</figcaption>
      </figure>
    pide: La potencia útil de la bomba.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos pérdidas vienen en unidades distintas: 2,6 **mca** (metros de
          columna de agua) y 6,5 **m de aceite**. ¿Cómo se juntan en el
          Bernoulli, que se escribe en metros de aceite?
        opciones:
          - texto: Pasando los 2,6 mca a metros de aceite, 2,6/0,762 = 3,41 m, porque la misma presión es más altura de un líquido más ligero
            correcta: true
            mensaje: |
              Eso es. Una pérdida de energía es una presión perdida; expresada
              como altura, depende del líquido en que se mida. Los mismos
              pascales que son 2,6 m de agua son 3,41 m de aceite.
          - texto: Sumándolas tal cual, 9,1 m, porque un metro de columna es un metro
            mensaje: |
              Un metro de agua y un metro de aceite no son la misma energía por
              newton: el agua pesa un 31 % más. Los 2,6 mca son 25 480 Pa, y
              eso, en aceite, son 3,41 m, no 2,6.
          - texto: Multiplicando los 2,6 por 0,762, 1,98 m, porque el aceite es más ligero
            mensaje: |
              Al revés. Como el aceite es más ligero, hace falta **más** altura
              de aceite para la misma presión: se divide entre 0,762, no se
              multiplica.

      - tipo: calcular
        titulo: La altura que da la bomba
        pregunta: |
          Altura manométrica $H_m$ de la bomba, en metros de aceite.
        respuesta:
          tipo: magnitud
          valor: '54.91 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '54.1 m'
            mensaje: |
              Has sumado los 2,6 mca sin convertirlos. En metros de aceite son
              $2{,}6/0{,}762 = 3{,}41$: casi un metro de diferencia.
          - valor: '45 m'
            mensaje: |
              Es la diferencia de cotas entre las dos láminas, 60 − 15. A eso
              hay que añadir las dos pérdidas, que también las paga la bomba.
          - valor: '66.9 m'
            mensaje: |
              Has hecho intervenir la cota de la bomba, 3 m. No entra: la
              altura manométrica sale del Bernoulli entre las dos láminas
              libres, y lo que la bomba está más baja lo gana en la aspiración
              y lo devuelve en la impulsión.
        pista: |
          Bernoulli de A a D, en metros de aceite:
          $z_A - h_{f,AB} + H_m - h_{f,CD} = z_D$.
        desarrollo: |
          $$
          15 - \frac{2{,}6}{0{,}762} + H_m - 6{,}5 = 60 \;\Longrightarrow\; H_m = 45 + 3{,}41 + 6{,}5 = 54{,}91\ \text{m de aceite}
          $$

      - tipo: calcular
        titulo: La potencia útil
        pregunta: |
          Potencia útil de la bomba.
        respuesta:
          tipo: magnitud
          valor: '65.61 kW'
          tolerancia: 0.01
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '86.1 kW'
            mensaje: |
              Has usado el peso específico del agua. Es aceite:
              $\gamma = 0{,}762 \cdot 9\,800 = 7\,468$ N/m³, un 24 % menos.
          - valor: '53.8 kW'
            mensaje: |
              Has puesto solo los 45 m de desnivel. Las pérdidas también las
              vence la bomba: la altura útil es 54,91 m.
          - valor: '6.69 kW'
            mensaje: |
              Has dividido entre $g$. El peso específico $\gamma$ ya es peso por
              volumen, no masa: $P = \gamma Q H_m$ da directamente vatios.
        pista: |
          $P = \gamma\,Q\,H_m$ con el $\gamma$ del aceite y $Q$ en m³/s.
        desarrollo: |
          $$
          P = \gamma Q H_m = 0{,}762 \cdot 9\,800 \cdot 0{,}160 \cdot 54{,}91 = 65\,610\ \text{W} = 65{,}6\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la bomba. Una pieza es falsa.
        piezas:
          - texto: 'Bernoulli entre las dos láminas libres, en metros de aceite: 15 − 3,41 + Hm − 6,5 = 60.'
          - texto: Los 2,6 mca se pasan a aceite dividiendo entre 0,762, porque los mismos pascales son más altura de un líquido más ligero.
          - texto: 'Potencia útil = γ Q Hm con el γ del aceite, 7 468 N/m³: 65,6 kW.'
          - texto: Como la bomba está en la cota 3, su altura manométrica es 60 − 3 = 57 m más las pérdidas de la impulsión.
            trampa: true
            mensaje: |
              La cota de la bomba no entra. Los 3 m aparecen en los dos tramos:
              se ganan bajando de A a B y se pagan subiendo de C a D, y se
              cancelan. $H_m$ solo depende de las dos láminas libres y de las
              pérdidas totales.
    resolucion: |
      **Las unidades antes que la ecuación.** Las dos pérdidas están dadas en
      líquidos distintos. El Bernoulli se escribe en metros de aceite, así que
      los 2,6 mca se convierten: $2{,}6/0{,}762 = 3{,}41$ m de aceite. Es el
      único paso en que se puede fallar, y el boletín lo hace explícito.

      **Bernoulli de lámina a lámina.** En A y en D la velocidad es nula y la
      presión es la atmosférica, así que solo quedan cotas, pérdidas y bomba:

      $$
      15 - 3{,}41 + H_m - 6{,}5 = 60 \;\Longrightarrow\; H_m = 54{,}91\ \text{m de aceite}
      $$

      **La potencia útil**, con el peso específico del aceite:

      $$
      P = 0{,}762 \cdot 9\,800 \cdot 0{,}160 \cdot 54{,}91 = 65\,610\ \text{W}
      $$

      El boletín publica 65,61 kW.

      **Lo que no entra.** La cota de la bomba, 3 m, no aparece en ningún
      sitio: se gana en la aspiración y se paga en la impulsión. Sí entraría
      si se preguntara por la presión en la brida de aspiración, que es otro
      problema — el de la cavitación.
  - id: ejflu12-col34-la-red-que-se-resuelve-desde-el-final
    titulo: La red que se resuelve desde el final
    fuente: Ejercicio 3.4 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      El abastecimiento de agua a un núcleo parte de un depósito A ubicado en
      la cota 300, el cual suministra agua a un sistema de riego a través de
      una boquilla, a un depósito presurizado E y a un depósito abierto F, tal
      como muestra la figura. Se pide:

      a) Caudales circulantes por las tuberías 1, 2, 3, 4 y 5.

      Datos: Factor de paso de 1 = 500; pérdida de potencia en 2 = 4.900 W;
      $h_{f3}$ = 3 mca; pérdida de carga en 4 = 514,71 Torr; pérdida de
      potencia en 5 = 490 W; diámetro de salida de la boquilla = 65,5 mm.

