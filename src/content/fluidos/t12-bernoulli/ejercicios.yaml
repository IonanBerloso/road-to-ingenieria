        <text x="292" y="180" font-size="10" fill="var(--ink)">E · 210</text>
        <text x="292" y="196" font-size="9.5" fill="var(--alt)">PE = 30 mca</text>
        <path d="M100,52 Q124,90 150,110" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="26" y="122" font-size="9.5" fill="var(--ink)">1 · Ø 400 mm</text>
        <text x="26" y="134" font-size="9.5" fill="var(--flag)">K1 = 500</text>
        <circle cx="150" cy="110" r="3.5" fill="var(--live)"/>
        <text x="144" y="102" text-anchor="end" font-size="10" fill="var(--ink)">N</text>
        <path d="M150,110 V74 H236" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
