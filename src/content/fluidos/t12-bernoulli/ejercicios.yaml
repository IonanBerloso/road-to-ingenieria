        <desc id="f319d">Tres depósitos a distinta altura, dibujados a escala:
        A en la cota 20, B en la cota 35 y C en la cota 40, este último cerrado
        y con un manómetro que marca 0,86 kilos por centímetro cuadrado. De A
        sale la tubería 1, que pasa por la bomba B uno y sube al nudo N; de B
        sale la tubería 2, que pasa por la bomba B dos y llega también a N; y
        de N sale la tubería 3, que sube hasta C.</desc>
        <defs>
          <marker id="m319l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <rect x="14" y="220" width="96" height="34" fill="var(--alt)" opacity="0.18"/>
        <path d="M14,220 v34 h96 v-34" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="14" y1="220" x2="110" y2="220" stroke="var(--alt)" stroke-width="1.5"/>
        <path d="M56,211 l9,0 l-4.5,7 z" fill="var(--alt)"/>
