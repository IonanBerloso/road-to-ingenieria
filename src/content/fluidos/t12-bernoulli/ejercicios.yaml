        <line x1="112" y1="190" x2="416" y2="190" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="112" y1="240" x2="416" y2="240" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
