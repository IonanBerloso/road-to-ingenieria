        <text x="580" y="252" font-size="10.5" fill="var(--faint)">40</text>
        <line x1="178" y1="340" x2="574" y2="340" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="580" y="344" font-size="10.5" fill="var(--faint)">30</text>
