      <figcaption>Aire a presión sobre gasolina y gasolina sobre agua, y un tubo de 25 mm que descarga al aire libre. Las alturas están a escala; el tubo, no, porque a escala no se vería.</figcaption>
      </figure>
    pide: El caudal de salida y el tiempo que tarda el nivel en bajar medio metro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se suman el aire, la gasolina y el agua para saber la energía
          disponible en el tubo de descarga?
        opciones:
          - texto: 'Pasándolo todo a metros de columna de agua: 15 del aire, 0,816 de la gasolina y 1,5 del agua'
            correcta: true
            mensaje: |
              Eso es. Cada capa aporta $\gamma h$, y al dividir entre el peso
              específico del **agua** —que es el fluido que sale— la gasolina
              cuenta solo por 0,68 de su altura. En total 17,32 m.
          - texto: 'Sumando las alturas tal cual: 15 + 1,2 + 1,5 = 17,7 m'
            mensaje: |
              La gasolina pesa un 32 % menos que el agua, así que 1,2 m de
              gasolina no son 1,2 m de columna de agua sino 0,816. La
              diferencia es medio metro sobre diecisiete, poca cosa aquí, pero
              el método importa.
          - texto: 'Solo con el aire y el agua: la gasolina flota y no empuja'
            mensaje: |
              Flotar no la exime de pesar. La gasolina descansa sobre el agua y
              todo su peso se transmite hacia abajo: por eso aporta sus 0,816 m
              de columna equivalente.

      - tipo: calcular
        titulo: El caudal de salida
        pregunta: |
          Caudal que sale por el tubo de 25 mm en las condiciones de la
          figura, con Cc = 1 y factor de paso 1,5.
        respuesta:
          tipo: magnitud
          valor: '5.72 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '9.04 l/s'
            mensaje: |
              Te has dejado el factor de paso. El tubo pierde 1,5 veces la
              altura cinética, así que la energía disponible se reparte entre
              2,5 alturas cinéticas, no una.
          - valor: '7.38 l/s'
            mensaje: |
              Has contado el factor de paso pero no la energía cinética con la
              que el agua sale. El denominador es $1 + K = 2{,}5$, no $K$.
          - valor: '2.69 l/s'
            mensaje: |
              No has convertido la presión del aire. 1,5 kg/cm² no son 1,5 m de
              columna sino **15**, y son el 87 % de la carga disponible.
        pista: |
          $H = (1+K)\dfrac{V^{2}}{2g}$, con H la carga total en el tubo
          expresada en metros de columna de agua.
        desarrollo: |
          La carga en el tubo, toda en metros de columna de agua:

          $$
          H = \frac{p_{aire}}{\gamma} + s\,h_1 + h_2 = 15 + 0{,}68\cdot 1{,}2 + 1{,}5 = 17{,}316\ \text{m}
          $$

          Y como el tubo se come 1,5 alturas cinéticas y el agua sale con
          otra:

          $$
          V = \sqrt{\frac{2gH}{1+K}} = \sqrt{\frac{19{,}6\cdot 17{,}316}{2{,}5}} = 11{,}65\ \text{m/s}
          $$

          $$
          Q = V\,C_c\,a = 11{,}65\cdot 4{,}909\cdot 10^{-4} = 5{,}72\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El tiempo de bajada
        pregunta: |
          Tiempo que tarda el nivel en descender 0,5 m, suponiendo constante
          la presión del aire.
        respuesta:
          tipo: magnitud
          valor: '69.16 s'
          tolerancia: 0.02
          formato: un tiempo con su unidad (s o min)
        distractores:
          - valor: '34.6 s'
            mensaje: |
              Te has dejado el 2 de la integral. Al integrar
              $\mathrm{d}h/\sqrt{H}$ aparece $2\sqrt{H}$, no $\sqrt{H}$.
          - valor: '210.7 s'
            mensaje: |
              Ese es el tiempo de vaciar el metro y medio de agua entero, que
              es el apartado c). El d) pide solo los primeros 0,5 m, y son los
              más rápidos porque la carga es mayor.
        pista: |
          $A_t\,\mathrm{d}h = -C_c\,a\,V\,\mathrm{d}t$, con V función de la
          altura de agua que queda.
        desarrollo: |
          Al bajar el nivel, la capa de gasolina baja con él sin cambiar de
          espesor: lo que adelgaza es el agua. Con $h$ la altura de agua que
          queda,

          $$
          H(h) = 15 + 0{,}816 + h = 15{,}816 + h
          $$

          y el balance de volumen en el depósito da

          $$
          A_t\,\mathrm{d}h = -C_c\,a\sqrt{\frac{2g}{1+K}}\sqrt{H}\ \mathrm{d}t
          $$

          $$
          t = \frac{A_t}{C_c\,a}\sqrt{\frac{1+K}{2g}}\cdot 2\left[\sqrt{H(h_i)} - \sqrt{H(h_f)}\right]
          $$

          Con $A_t/a = 1600$, entre $h = 1{,}5$ y $h = 1{,}0$:

          $$
          t = 1600\cdot 0{,}3571\cdot 2\,(4{,}1613 - 4{,}1007) = 69{,}16\ \text{s}
          $$

      - tipo: justificar
        pregunta: Ordena por qué el vaciado va tan igualado al principio. Una pieza es falsa.
        piezas:
          - texto: 'La carga en el tubo son 17,32 m, de los que 15 los pone el aire y solo 2,32 los dos líquidos.'
          - texto: 'Al bajar el nivel medio metro, la carga pasa de 17,32 a 16,82 m: menos de un 3 %.'
          - texto: 'Como la velocidad va con la raíz de la carga, cae un 1,5 % escaso, de 11,65 a 11,48 m/s.'
          - texto: 'Por eso el resultado exacto, 69,16 s, se parece tanto al que saldría suponiendo el caudal constante, 68,66 s.'
          - texto: Si se despresurizara el depósito el tiempo apenas cambiaría, porque el aire solo aporta presión estática.
            trampa: true
            mensaje: |
              Cambiaría muchísimo. Sin los 15 m del aire la carga sería de 2,32
              m en vez de 17,32, la velocidad caería a la raíz de esa
              proporción —de 11,65 a 4,26 m/s— y el tiempo se multiplicaría
              por más de dos y medio. **El aire es el 87 % de la carga**: es lo
              que hace funcionar la descarga.
    resolucion: |
      ## Todo a metros de columna de agua

      Lo primero es sumar bien. En el tubo de descarga hay tres cosas
      empujando: el aire comprimido, la gasolina y el agua. Como el fluido que
      sale es agua, todo se pasa a metros de columna de agua:

      | | aporta |
      |---|---|
      | aire, 1,5 kg/cm² | 15,000 m |
      | gasolina, 1,2 m con s = 0,68 | 0,816 m |
      | agua, 1,5 m | 1,500 m |
      | **total** | **17,316 m** |

      La gasolina flota, pero eso no la exime de pesar: su peso se transmite
      íntegro al agua de debajo. Lo que sí cambia es que cada metro suyo vale
      0,68 metros de agua.

      ## a) y b) La velocidad y el caudal

      El tubo tiene un factor de paso de 1,5, y además el agua sale con
      velocidad. De la carga disponible, una parte se pierde en el tubo y otra
      se va como energía cinética:

      $$
      H = (1 + K)\frac{V^{2}}{2g} \;\Longrightarrow\; V = \sqrt{\frac{2gH}{1+K}} = 11{,}65\ \text{m/s}
      $$

      $$
      Q = 11{,}65\cdot 4{,}909\cdot 10^{-4} = 5{,}72\ \text{l/s}
      $$

      Ese $1 + K$ del denominador es el error más frecuente del problema. Con
      solo K saldría 7,38 l/s y sin nada, 9,04.

      ## c) y d) El tiempo

      Al vaciarse, la gasolina baja con el nivel sin cambiar de espesor: lo que
      adelgaza es la capa de agua. Con $h$ la altura de agua que queda,
      $H = 15{,}816 + h$, y el balance de volumen da

      $$
      t = \frac{A_t}{C_c\,a}\sqrt{\frac{1+K}{2g}}\cdot 2\left[\sqrt{H_i} - \sqrt{H_f}\right]
      $$

      La relación de áreas es exactamente **1600** —un metro contra 25
      milímetros—, y entre 1,5 y 1,0 m de agua salen **69,16 s**.

      ## Por qué el resultado se parece tanto al caso trivial

      Si uno supusiera el caudal constante e igual al inicial, saldrían
      68,66 s: un 0,7 % menos. Y no es casualidad.

      La carga son 17,32 m, de los que **15 los pone el aire**. Al bajar el
      nivel medio metro, la carga solo cae a 16,82 —menos de un 3 %— y la
      velocidad, que va con la raíz, cae un 1,5 %. Con una variación tan
      pequeña, la integral y la aproximación casi coinciden.

      Eso también dice cuál es la pieza que manda: **el aire es el 87 % de la
      carga**. Sin él, la descarga iría a 4,26 m/s en vez de 11,65, y el mismo
      medio metro tardaría dos veces y media más. Un depósito presurizado no
      se vacía como uno abierto, y la diferencia no es un matiz.
