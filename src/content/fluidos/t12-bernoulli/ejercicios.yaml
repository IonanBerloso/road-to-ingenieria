      <figcaption>Las cuatro cotas a escala. El depósito D está cerrado y sus 294 kilopascales lo colocan, en energía, por encima del nudo: por eso la tubería 6 no sale de N, entra en él.</figcaption>
      </figure>
    pide: El caudal turbinado, la altura de la bomba, el Bernoulli en N, los caudales de la boquilla y de la 6 con su sentido, el diámetro de la boquilla y la potencia del chorro.
    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito D está a la cota 10 y su manómetro marca 294 kPa,
          mientras que el nudo N tendrá poco más de 32 m de energía. ¿Hacia
          dónde circula el agua por la tubería 6?
        opciones:
          - texto: De D hacia N, porque la energía de D es 40 mca y supera a la del nudo
            correcta: true
            mensaje: |
              Eso es. 294 kPa son 30 mca, que sobre la cota 10 dan 40 mca de
              Bernoulli. El agua va de más energía a menos, así que D
              **alimenta** al nudo en vez de recibir de él.
          - texto: De N hacia D, porque el nudo está aguas abajo de la bomba y el agua bombeada tiene que ir a algún sitio
            mensaje: |
              El agua bombeada va a algún sitio, sí: a la boquilla. Pero eso no
              decide el sentido de la 6; lo decide comparar energías, y D tiene
              40 mca contra los 32,6 del nudo.
          - texto: De N hacia D, porque D está más bajo, en la cota 10, y el agua cae
            mensaje: |
              La cota sola no decide nada cuando hay presión: D está cerrado y
              presurizado. Lo que se comparan son alturas de Bernoulli, y ahí D
              gana por más de siete metros.

      - tipo: calcular
        titulo: El caudal que turbina
        pregunta: |
          Caudal que llega al depósito B. La turbina tiene 40 kW de potencia
          bruta, y la pérdida de la tubería 2 está dada en metros de un líquido
          de $s = 0{,}8$.
        respuesta:
          tipo: magnitud
          valor: '206.1 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '212 l/s'
            mensaje: |
              Has sumado los 2,75 tal cual. Están dados en metros de un líquido
              de $s = 0{,}8$: en agua son $2{,}75 \cdot 0{,}8 = 2{,}2$ m, menos,
              porque el agua pesa más.
          - valor: '219.9 l/s'
            mensaje: |
              Has dividido entre 0,8 en vez de multiplicar. Para la misma
              presión hacen falta **más** metros del líquido ligero, así que al
              pasar a agua la altura baja.
          - valor: '181.4 l/s'
            mensaje: |
              Has tomado 0,3 kg/cm² como 0,3 mca. Un kilo por centímetro
              cuadrado son 10 metros de agua: la pérdida de la tubería 1 son
              3 m, y con 0,3 la turbina se queda con 2,7 m de más.
        pista: |
          Bernoulli de A a B: $30 - h_{f1} - H_t - h_{f2} = 5$, y
          $Pot_{bruta} = \gamma\,Q\,H_t$.
        desarrollo: |
          $$
          h_{f1} = 3\ \text{mca} \qquad h_{f2} = 2{,}75 \cdot 0{,}8 = 2{,}2\ \text{mca} \qquad H_t = 30 - 3 - 2{,}2 - 5 = 19{,}8\ \text{mca}
          $$

          $$
          Q = \frac{40\,000}{9\,800 \cdot 19{,}8} = 0{,}2061\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: La altura de la bomba
        pregunta: |
          Altura manométrica de la bomba, con 80 kW brutos, rendimiento 0,75 y
          210 l/s.
        respuesta:
          tipo: magnitud
          valor: '29.15 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '38.87 m'
            mensaje: |
              Has usado la potencia bruta. Al fluido solo llega la útil, el 75 %
              de los 80 kW.
          - valor: '21.86 m'
            mensaje: |
              Has multiplicado por el rendimiento dos veces, o lo has aplicado a
              una potencia que ya era útil. $P_{\text{útil}} = 0{,}75 \cdot 80 = 60$ kW.
        pista: |
          $P_{\text{útil}} = \eta\,P_{bruta} = \gamma\,Q\,H_m$.
        desarrollo: |
          $$
          H_m = \frac{0{,}75 \cdot 80\,000}{9\,800 \cdot 0{,}210} = \frac{60\,000}{2\,058} = 29{,}15\ \text{mca}
          $$

      - tipo: calcular
        titulo: El Bernoulli en el nudo
        pregunta: |
          Altura de Bernoulli en el nudo N, en mca.
        respuesta:
          tipo: magnitud
          valor: '32.61 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '34.15 m'
            mensaje: |
              Te has dejado las dos pérdidas del camino, la de la 3 y la de la
              4. Suman metro y medio.
          - valor: '33.18 m'
            mensaje: |
              Te falta la pérdida de la tubería 3:
              $K_3 V_3^{2}/2g = 4 \cdot 0{,}1425 = 0{,}57$ m, con
              $V_3 = 1{,}67$ m/s en los 400 mm.
          - valor: '27.61 m'
            mensaje: |
              Has olvidado que el depósito B aporta su cota, 5 m. La bomba parte
              de ahí, no del cero.
        pista: |
          $B_N = z_B - h_{f3} + H_m - h_{f4}$, con
          $h_{f4} = P_4/(\gamma Q)$.
        desarrollo: |
          $$
          V_3 = \frac{0{,}210}{\pi \cdot 0{,}4^{2}/4} = 1{,}671\ \text{m/s} \qquad h_{f3} = 4\,\frac{1{,}671^{2}}{19{,}6} = 0{,}57\ \text{m}
          $$

          $$
          h_{f4} = \frac{2\,000}{9\,800 \cdot 0{,}210} = 0{,}97\ \text{m} \qquad B_N = 5 - 0{,}57 + 29{,}15 - 0{,}97 = 32{,}61\ \text{mca}
          $$

      - tipo: calcular
        titulo: Lo que aporta la tubería 6
        pregunta: |
          Caudal por la tubería 6, que pierde 3 kW.
        respuesta:
          tipo: magnitud
          valor: '41.4 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '13.5 l/s'
            mensaje: |
              Has tomado la cota de D sin la presión: $32{,}61 - 10 = 22{,}6$ m
              de pérdida. Son 7,39: D está presurizado y su Bernoulli es 40.
          - valor: '117.3 l/s'
            mensaje: |
              Has usado la presión sola, 30 mca, como Bernoulli de D, olvidando
              su cota. Con eso la diferencia sale 2,61 m y el caudal se
              multiplica casi por tres.
        pista: |
          $B_D = 10 + 294\,000/9\,800 = 40$ mca; $h_{f6} = B_D - B_N$ y
          $Q_6 = P_6/(\gamma\,h_{f6})$.
        desarrollo: |
          $$
          h_{f6} = 40 - 32{,}61 = 7{,}39\ \text{m} \qquad Q_6 = \frac{3\,000}{9\,800 \cdot 7{,}39} = 0{,}0414\ \text{m}^{3}\text{/s}
          $$

          Y como entra en el nudo, por la boquilla salen
          $210 + 41{,}4 = 251{,}4$ l/s.

      - tipo: calcular
        titulo: El diámetro de la boquilla
        pregunta: |
          Diámetro de la boquilla de riego, que descarga a la atmósfera en la
          cota 15 y cuya pérdida es $0{,}1\,V_b^{2}/2g$.
        respuesta:
          tipo: magnitud
          valor: '136.5 mm'
          tolerancia: 0.01
          formato: un diámetro con su unidad (mm o m)
        distractores:
          - valor: '133.2 mm'
            mensaje: |
              Te has dejado la pérdida de la propia boquilla. El factor 0,1
              significa que los 16,59 m disponibles no van enteros a velocidad:
              se reparten entre la altura de velocidad y la propia pérdida, así
              que $1{,}1\,V_b^{2}/2g = 16{,}59$ y no $V_b^{2}/2g = 16{,}59$.
          - valor: '124.1 mm'
            mensaje: |
              Has usado solo los 210 l/s de la bomba. Por la boquilla salen
              también los 41,4 que entran por la 6: 251,4 l/s.
          - valor: '68.2 mm'
            mensaje: |
              Ese es el radio. De $A_b = Q/V_b$ se pasa al diámetro con
              $d = \sqrt{4A_b/\pi}$.
        pista: |
          $B_N - h_{f5} = 15 + (1 + 0{,}1)\dfrac{V_b^{2}}{2g}$, y después
          $A_b = Q_5/V_b$.
        desarrollo: |
          $$
          V_5 = \frac{0{,}2514}{\pi \cdot 0{,}45^{2}/4} = 1{,}581\ \text{m/s} \qquad h_{f5} = 8\,\frac{1{,}581^{2}}{19{,}6} = 1{,}02\ \text{m}
          $$

          $$
          32{,}61 - 1{,}02 - 15 = 1{,}1\,\frac{V_b^{2}}{2g} \;\Longrightarrow\; \frac{V_b^{2}}{2g} = 15{,}08 \;\Longrightarrow\; V_b = 17{,}19\ \text{m/s}
          $$

          $$
          A_b = \frac{0{,}2514}{17{,}19} = 0{,}01463\ \text{m}^{2} \qquad d = 0{,}1365\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el recorrido de la instalación. Una pieza es falsa.
        piezas:
          - texto: 'La turbina se resuelve sola: entre las dos láminas de A y B solo hay cotas y pérdidas conocidas, y su potencia bruta da el caudal.'
          - texto: 'Con el caudal bombeado y las pérdidas de la 3 y la 4, el nudo N queda en 32,61 mca, y ese número decide todo lo que viene después.'
          - texto: 'D, presurizado, tiene 40 mca: aporta 41,4 l/s al nudo, así que por la boquilla salen 251,4.'
          - texto: 'La potencia del chorro es la potencia útil de la bomba menos las pérdidas de las tuberías 3, 4 y 5, porque toda el agua viene de ella.'
            trampa: true
            mensaje: |
              No toda: 41,4 de los 251,4 l/s los pone el depósito D, con su
              propia energía. El chorro lleva 37,1 kW y la bomba solo entrega
              60 kW útiles menos pérdidas; la cuenta no cierra sin contar lo que
              aporta D.
    resolucion: |
      **Tres bloques independientes, y en este orden.** La turbina se resuelve
      sola; después la bomba; y solo entonces el nudo, que es donde se juntan
      las tres tuberías que quedan.

      **La turbina** (a). Entre las dos láminas libres:

      $$
      30 - 3 - H_t - 2{,}2 = 5 \;\Longrightarrow\; H_t = 19{,}8\ \text{mca} \qquad Q = \frac{40\,000}{9\,800 \cdot 19{,}8} = 206{,}1\ \text{l/s}
      $$

      Ojo a las dos unidades del enunciado: $0{,}3$ kg/cm² son 3 mca, y los
      2,75 metros de un líquido de $s = 0{,}8$ son 2,2 mca.

      **La bomba y el nudo** (b y c).

      $$
      H_m = \frac{0{,}75 \cdot 80\,000}{9\,800 \cdot 0{,}210} = 29{,}15\ \text{mca} \qquad B_N = 5 - 0{,}57 + 29{,}15 - 0{,}97 = 32{,}61\ \text{mca}
      $$

      **El sentido de la tubería 6** (d), que es la pregunta con trampa. D está
      **cerrado**: sus 294 kPa son 30 mca, que sobre la cota 10 dan 40 mca de
      Bernoulli, siete metros y medio por encima del nudo. Así que la 6 no sale
      de N: **entra**.

      $$
      Q_6 = \frac{3\,000}{9\,800 \cdot 7{,}39} = 41{,}4\ \text{l/s} \qquad Q_{boquilla} = 210 + 41{,}4 = 251{,}4\ \text{l/s}
      $$

      **La boquilla** (e y f).

      $$
      1{,}1\,\frac{V_b^{2}}{2g} = 32{,}61 - 1{,}02 - 15 = 16{,}59 \;\Longrightarrow\; \frac{V_b^{2}}{2g} = 15{,}08\ \text{m} \qquad d = 136{,}5\ \text{mm}
      $$

      $$
      P_{chorro} = \gamma\,Q\,\frac{V_b^{2}}{2g} = 9\,800 \cdot 0{,}2514 \cdot 15{,}08 = 37{,}15\ \text{kW}
      $$

      Los seis coinciden con el boletín.

      **Lo que este problema enseña y no se olvida.** Que el sentido de
      circulación **no se supone: se calcula**. Un depósito más bajo puede
      alimentar a uno más alto si está presurizado, y aquí pasa exactamente
      eso. Si se hubiera dado por hecho que la 6 sale del nudo, el caudal de
      la boquilla habría salido 168,6 l/s en vez de 251,4, y con él el
      diámetro y la potencia: tres apartados arrastrando el mismo error de
      lectura.
  - id: ejflu12-col321-el-combustible-repartido-en-tres-servicios
    titulo: El combustible repartido en tres servicios
    fuente: Ejercicio 3.21 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene la instalación de la figura con el fin de vehicular un
      combustible de peso específico relativo s = 0,8 desde el depósito
      inferior A, abierto a la atmósfera, hacia 3 servicios: un depósito
      superior abierto (C), un quemador que alimenta una caldera de vapor (D) y
      un depósito presurizado (E). Teniendo en cuenta los datos indicados, se
      pide:

      **a)** Bernoulli en el nudo N (BN) en mcl y en J/m³.

      **b)** Potencia útil que suministra la bomba, en kW.

      **c)** Caudal Q4, en l/s.

      **d)** Presión a la entrada de la boquilla (PF) en kg/cm².

      **e)** Sentido de circulación del flujo en 5.

      **f)** Potencia perdida en la tubería 5, en W por metro de tubería.

      **Datos:** Q1 = 12 l/s; Q3 = 5 l/s; D4 = 75 mm; Dboquilla = 25 mm;
      PE = 0,7 mcHg (700 Torr); L5 = 34 m.

      **Pérdidas:** Tubería 1 = 1,6 mca; Tubería 2 = 1 kg/cm²;
      Tubería 3 = 313,6 W; Tubería 4: K4 = 130; Boquilla: Kboquilla = 1,1.

