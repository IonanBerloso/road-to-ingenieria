        <line x1="336" y1="148" x2="358" y2="148" stroke="var(--live)" stroke-width="2" marker-end="url(#m321)"/>
        <line x1="310" y1="192" x2="310" y2="214" stroke="var(--live)" stroke-width="2" marker-end="url(#m321)"/>
