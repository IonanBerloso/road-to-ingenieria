ejercicios:
  # ── Los dos son NUESTROS (§08). Bernoulli no tiene capítulo propio en la
  #    colección: se examina siempre dentro de un medidor (tema 13) o de una
  #    instalación (temas 19 y 25). Aquí se usa sola, primero sin pérdidas y
  #    después con ellas y con una bomba.
  - id: ejflu12-torricelli-y-la-potencia-del-chorro
    titulo: El chorro de un depósito, y la potencia que lleva
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un depósito abierto de grandes dimensiones tiene una boquilla de
      $50\ \text{mm}$ de diámetro situada $5\ \text{m}$ por debajo de la
      superficie libre. El chorro sale a la atmósfera.

      a) Calcular la velocidad de salida, suponiendo fluido perfecto.

      b) Calcular el caudal.

      c) Calcular la potencia que lleva el chorro.

      Tomar $g = 9{,}8\ \text{m/s}^{2}$ y $\gamma = 9800\ \text{N/m}^{3}$.
    pide: La velocidad de salida, el caudal y la potencia del chorro.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se aplica Bernoulli entre la superficie libre (1) y la salida de la
          boquilla (2). ¿Qué vale cada término?
        opciones:
          - texto: >-
              En 1: $v_1 \approx 0$ (depósito grande) y $P_1 = 0$
              (manométrica, abierto). En 2: $P_2 = 0$ (sale a la atmósfera).
              Solo quedan la cota y la velocidad de salida
            correcta: true
            mensaje: |
              Eso es, y por eso queda $z_1 - z_2 = v_2^{2}/2g$, es decir
              $v = \sqrt{2gH}$: la fórmula de Torricelli. Es Bernoulli con
              tres términos anulados.
          - texto: >-
              En 2 la presión es la del agua a $5\ \text{m}$, o sea
              $0{,}49\ \text{bar}$
            mensaje: |
              Esa sería la presión **dentro** del depósito a esa profundidad,
              con el orificio cerrado. Al salir el chorro a la atmósfera, su
              presión es la atmosférica: manométrica cero. Esa energía de
              presión es justo la que se ha convertido en velocidad.
          - texto: >-
              $v_1$ no se puede despreciar sin saber el área del depósito
            mensaje: |
              El enunciado dice «de grandes dimensiones», que es la forma
              habitual de autorizar $v_1 \approx 0$: por continuidad, la
              velocidad de descenso del nivel es despreciable frente a la del
              chorro.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad sale el chorro?
        respuesta:
          tipo: magnitud
          valor: '9.9 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '49 m/s'
            mensaje: |
              Eso es $2gH$ sin la raíz. La velocidad es
              $\sqrt{2gH} = \sqrt{98} = 9{,}9\ \text{m/s}$.
          - valor: '7 m/s'
            mensaje: |
              Eso es $\sqrt{gH} = \sqrt{49}$: falta el factor 2. La cota se
              convierte en $v^{2}/2g$, así que $v = \sqrt{2gH}$.
        pista: |
          Torricelli: v = √(2·g·H), con H = 5 m.
        desarrollo: |
          $$
          z_1 = z_2 + \frac{v_2^{2}}{2g}
          \quad\Rightarrow\quad
          v = \sqrt{2gH} = \sqrt{2\cdot9{,}8\cdot5} = 9{,}9\ \text{m/s}
          $$

          **Y una lectura que conviene tener:** es la misma velocidad que
          alcanzaría un cuerpo dejado caer desde $5\ \text{m}$. Bernoulli sin
          pérdidas es exactamente la conservación de la energía mecánica.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal sale por la boquilla?
        respuesta:
          tipo: magnitud
          valor: '19.44 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '0.495 l/s'
            mensaje: |
              Has usado el diámetro como si fuera el área. $A = \pi D^{2}/4
              = 1{,}963\cdot10^{-3}\ \text{m}^{2}$, y $Q = vA$.
          - valor: '77.75 l/s'
            mensaje: |
              Has usado $\pi D^{2}$ sin dividir entre 4: el área sale cuatro
              veces mayor.
        pista: |
          Q = v·A, con A = π·0,05²/4.
        desarrollo: |
          $$
          A = \frac{\pi\cdot0{,}05^{2}}{4} = 1{,}963\cdot10^{-3}\ \text{m}^{2}
          \qquad
          Q = 9{,}9\cdot1{,}963\cdot10^{-3} = 0{,}01944\ \text{m}^{3}/\text{s}
          $$

      - tipo: calcular
        titulo: La potencia del chorro
        pregunta: |
          ¿Qué potencia lleva ese chorro?
        respuesta:
          tipo: magnitud
          valor: '952 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '190 W'
            mensaje: |
              Has usado $\gamma Q v$ o algo parecido. La potencia es
              $\gamma Q B$, y aquí el Bernoulli del chorro es su altura
              cinética, $v^{2}/2g = 5\ \text{m}$.
          - valor: '95240 W'
            mensaje: |
              Un factor cien: el caudal son $0{,}01944\ \text{m}^{3}/\text{s}$,
              no $1{,}944$.
        pista: |
          Pot = γ·Q·B, y el Bernoulli del chorro es v²/2g = 5 m.
        desarrollo: |
          $$
          \text{Pot} = \gamma\,Q\,\frac{v^{2}}{2g}
          = 9800\cdot0{,}01944\cdot5 = 952\ \text{W}
          $$

          Toda la energía potencial de la que partió ($5\ \text{m}$) está
          ahora en forma cinética: sin pérdidas, la altura se conserva y solo
          cambia de nombre.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli entre la superficie y la boquilla, con
              $v_1\approx0$, $P_1 = P_2 = 0$ manométricas.
          - texto: >-
              Queda $H = v^{2}/2g$, de donde $v = \sqrt{2gH} = 9{,}9\ \text{m/s}$.
          - texto: >-
              $Q = vA = 19{,}44\ \text{l/s}$.
          - texto: >-
              $\text{Pot} = \gamma Q\,v^{2}/2g = 952\ \text{W}$.
          - texto: >-
              Es aplicable la misma constante de Bernoulli a todas las líneas
              de corriente porque todas arrancan en la superficie libre.
          - texto: >-
              Si la boquilla fuera más ancha, la velocidad de salida sería
              mayor, porque saldría más caudal.
            trampa: true
            mensaje: |
              La velocidad de salida **no depende del diámetro**: solo de la
              altura, $v=\sqrt{2gH}$. Lo que cambia con el diámetro es el
              caudal ($Q = vA$) y con él la potencia. Es la diferencia entre
              «a qué velocidad sale» y «cuánto sale».

    resolucion: |
      Bernoulli entre la superficie libre y la salida, con
      $v_1\approx0$ y presiones manométricas nulas en los dos extremos:

      $$
      \boxed{v = \sqrt{2gH} = 9{,}9\ \text{m/s}}
      \qquad
      \boxed{Q = vA = 19{,}44\ \text{l/s}}
      \qquad
      \boxed{\text{Pot} = \gamma Q\frac{v^{2}}{2g} = 952\ \text{W}}
      $$

      > **Torricelli no es una fórmula aparte que memorizar.** Es Bernoulli
      > con tres de sus cinco términos anulados por el enunciado: depósito
      > grande, abierto arriba y descargando a la atmósfera. Si el depósito
      > estuviera presurizado, el término $P_1/\gamma$ volvería, y la
      > velocidad sería $\sqrt{2g(H+P_1/\gamma)}$.

  - id: ejflu12-la-bomba-y-su-rendimiento
    titulo: Una bomba, su altura manométrica y la potencia que consume
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una bomba eleva $30\ \text{l/s}$ de agua entre dos depósitos abiertos,
      salvando un desnivel de $22\ \text{m}$. Las pérdidas de carga en las
      tuberías son $h_f = 3\ \text{m}$.

      a) ¿Qué altura manométrica debe dar la bomba?

      b) ¿Cuál es su potencia hidráulica?

      c) Si su rendimiento es del $70\ \%$, ¿qué potencia consume?

      Tomar $\gamma = 9800\ \text{N/m}^{3}$.
    pide: La altura manométrica, la potencia hidráulica y la absorbida.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aplicando Bernoulli generalizada entre las dos superficies libres,
          ¿qué queda?
        opciones:
          - texto: >-
              $H_m = \Delta z + h_f$: la bomba tiene que dar el desnivel
              **más** las pérdidas, porque en las dos superficies la presión
              y la velocidad son nulas
            correcta: true
            mensaje: |
              Eso es. $B_1 + H_m - h_f = B_2$, y con $P$ y $v$ nulos en los
              dos extremos queda $H_m = (z_2-z_1) + h_f = 25\ \text{m}$.
          - texto: >-
              $H_m = \Delta z - h_f$: las pérdidas descuentan
            mensaje: |
              Al revés: las pérdidas son energía que **se va**, así que la
              bomba tiene que aportarlas además del desnivel. Con el signo
              cambiado el agua no llegaría arriba.
          - texto: >-
              $H_m = \Delta z$, y las pérdidas se compensan solas
            mensaje: |
              No se compensan con nada: son energía disipada en calor. Si la
              bomba solo diera $22\ \text{m}$, el caudal sería menor que el
              pedido.

      - tipo: calcular
        titulo: La altura manométrica
        pregunta: |
          ¿Qué altura tiene que dar la bomba?
        respuesta:
          tipo: magnitud
          valor: '25 m'
          tolerancia: 0.01
          formato: una altura, con su unidad
        distractores:
          - valor: '22 m'
            mensaje: |
              Ese es solo el desnivel. Hay que sumarle los $3\ \text{m}$ de
              pérdidas: la bomba paga las dos cosas.
          - valor: '19 m'
            mensaje: |
              Has restado las pérdidas. Se suman: son energía que el flujo
              pierde y que alguien tiene que reponer.
        pista: |
          H_m = Δz + h_f.
        desarrollo: |
          $$
          B_1 + H_m - h_f = B_2
          \quad\Rightarrow\quad
          H_m = (z_2-z_1) + h_f = 22+3 = 25\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia hidráulica
        pregunta: |
          ¿Qué potencia entrega al agua?
        respuesta:
          tipo: magnitud
          valor: '7.35 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '6.47 kW'
            mensaje: |
              Has usado los $22\ \text{m}$ de desnivel en vez de los
              $25\ \text{m}$ de altura manométrica. La potencia hidráulica se
              calcula con lo que la bomba **da**, no con lo que el desnivel
              pide.
          - valor: '10.5 kW'
            mensaje: |
              Esa es la potencia **absorbida**, que sale de dividir por el
              rendimiento. La hidráulica es $\gamma Q H_m$, sin dividir.
        pista: |
          Pot = γ·Q·H_m, con Q en m³/s.
        desarrollo: |
          $$
          \text{Pot}_h = \gamma\,Q\,H_m = 9800\cdot0{,}03\cdot25 = 7350\ \text{W} = 7{,}35\ \text{kW}
          $$

      - tipo: calcular
        titulo: La potencia consumida
        pregunta: |
          Con un rendimiento del $70\ \%$, ¿cuánta potencia absorbe?
        respuesta:
          tipo: magnitud
          valor: '10.5 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '5.145 kW'
            mensaje: |
              Has multiplicado por $0{,}7$ en vez de dividir. La bomba consume
              **más** de lo que entrega: la absorbida es mayor que la
              hidráulica.
          - valor: '7.35 kW'
            mensaje: |
              Esa es la hidráulica. Con rendimiento $0{,}7$, la absorbida es
              $7{,}35/0{,}7 = 10{,}5\ \text{kW}$.
        pista: |
          η = Pot útil / Pot bruta, así que la bruta es la útil dividida por η.
        desarrollo: |
          $$
          \eta = \frac{\text{Pot}_h}{\text{Pot}_{\text{abs}}}
          \quad\Rightarrow\quad
          \text{Pot}_{\text{abs}} = \frac{7{,}35}{0{,}7} = 10{,}5\ \text{kW}
          $$

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              Bernoulli generalizada con bomba:
              $B_1 + H_m - h_f = B_2$.
          - texto: >-
              En las dos superficies libres $P = 0$ y $v \approx 0$, así que
              $B_1 = z_1$ y $B_2 = z_2$.
          - texto: >-
              $H_m = 22+3 = 25\ \text{m}$.
          - texto: >-
              $\text{Pot}_h = \gamma Q H_m = 7{,}35\ \text{kW}$.
          - texto: >-
              $\text{Pot}_{\text{abs}} = 7{,}35/0{,}7 = 10{,}5\ \text{kW}$, y la
              diferencia, $3{,}15\ \text{kW}$, se pierde en el motor y en la
              propia bomba.
          - texto: >-
              De los $10{,}5\ \text{kW}$ consumidos, $3\ \text{m}$ de altura se
              pierden por fricción, así que el rendimiento ya incluye las
              pérdidas de carga de la tubería.
            trampa: true
            mensaje: |
              Son dos pérdidas distintas y no hay que mezclarlas. Las de
              carga ($3\ \text{m}$) ocurren **en la tubería** y ya están
              dentro de $H_m$; el rendimiento del $70\ \%$ mide lo que se
              pierde **dentro de la máquina**. Contarlas dos veces es el error
              clásico del tema 25.

    resolucion: |
      $$
      \boxed{H_m = \Delta z + h_f = 25\ \text{m}}
      $$
      $$
      \boxed{\text{Pot}_h = \gamma Q H_m = 7{,}35\ \text{kW}}
      \qquad
      \boxed{\text{Pot}_{\text{abs}} = \frac{7{,}35}{0{,}7} = 10{,}5\ \text{kW}}
      $$

      > **Dónde está cada pérdida.** Las de carga están en la **tubería** y se
      > pagan con altura manométrica; las del rendimiento están en la
      > **máquina** y se pagan con potencia de más. La cadena completa es:
      > $10{,}5\ \text{kW}$ del enchufe → $7{,}35$ al agua → de esos, $0{,}88$
      > se disipan por fricción y el resto sube el agua.

  # ── COLECCIÓN 3.10. Corto y conceptual: el flujo va del Bernoulli mayor al
  #    menor, y ni la presión ni la cota deciden por separado.
  - id: ejflu12-col310-hacia-donde-va-el-flujo
    titulo: Hacia dónde va el flujo cuando la presión y la cota discrepan
    fuente: >-
      Ejercicio 3.10 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      En un punto $A$ de una tubería que transporta aceite de densidad relativa
      $0{,}9$, el diámetro es $150\ \text{mm}$ y la presión
      $0{,}7\ \text{kg/cm}^{2}$. En otro punto $B$ de la misma conducción,
      situado $5\ \text{m}$ más alto que el anterior, de $300\ \text{mm}$ de
      diámetro, su presión vale $-0{,}2\ \text{kg/cm}^{2}$ para un caudal de
      $28\ \text{l/s}$. Se pide:

      a) Determinar la dirección del flujo.
    pide: En qué sentido circula el aceite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué decide el sentido del flujo en una conducción?
        opciones:
          - texto: >-
              El Bernoulli total: el fluido va del punto de mayor energía al de
              menor, porque las pérdidas solo pueden restar
            correcta: true
            mensaje: |
              Exacto. Es la única lectura que no falla: la energía total no
              puede aumentar en el sentido del flujo, así que basta compararla
              en los dos puntos.
          - texto: >-
              La presión: el fluido va de donde hay más presión a donde hay
              menos
            mensaje: |
              Aquí eso acertaría por casualidad, pero es falso en general: un
              fluido puede ir de menos presión a más presión si baja de cota o
              si se frena, como pasa en el difusor de un venturímetro.
          - texto: >-
              La cota: el fluido siempre baja
            mensaje: |
              Cualquier bomba desmiente eso, y también un sifón. Lo que no
              puede subir es la **energía total** sin una máquina que la
              aporte.

      - tipo: calcular
        titulo: El Bernoulli en A
        pregunta: |
          ¿Cuánto vale la energía total en $A$, en metros de columna de aceite?
        respuesta:
          tipo: magnitud
          valor: '7.906 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '7.143 m'
            mensaje: |
              Has usado el peso específico del agua para pasar la presión a
              altura. El fluido es aceite, $\gamma = 0{,}9\cdot 9800 =
              8820\ \text{N/m}^{3}$, y por eso su columna es más alta.
          - valor: '12.91 m'
            mensaje: |
              Has puesto los $5\ \text{m}$ de cota en $A$. Es $B$ el que está
              más alto: el enunciado dice «situado 5 m más alto que el
              anterior», así que $z_A = 0$ y $z_B = 5$.
        pista: |
          $B = p/\gamma + v^{2}/2g + z$, con $\gamma$ del aceite y $z_A = 0$.
        desarrollo: |
          $$
          v_A = \frac{0{,}028}{\pi\,0{,}15^{2}/4} = 1{,}585\ \text{m/s}
          \qquad
          \frac{p_A}{\gamma} = \frac{0{,}7\cdot 98\,000}{8820} = 7{,}778\ \text{mcl}
          $$
          $$
          B_A = 7{,}778 + \frac{1{,}585^{2}}{19{,}6} + 0 = 7{,}906\ \text{mcl}
          $$

      - tipo: calcular
        titulo: El Bernoulli en B
        pregunta: |
          ¿Y en $B$?
        respuesta:
          tipo: magnitud
          valor: '2.786 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '-2.214 m'
            mensaje: |
              Te has dejado la cota. $B$ está $5\ \text{m}$ más alto que $A$, y
              esos cinco metros son energía de posición que hay que sumar.
          - valor: '7.786 m'
            mensaje: |
              Has tomado la presión de $B$ como positiva. Es
              $-0{,}2\ \text{kg/cm}^{2}$: el punto está en depresión, y ese
              signo es justo lo que hace interesante el problema.
        pista: |
          Mismo cálculo, con $z_B = 5$ y la presión **negativa**.
        desarrollo: |
          $$
          v_B = \frac{0{,}028}{\pi\,0{,}3^{2}/4} = 0{,}396\ \text{m/s}
          \qquad
          \frac{p_B}{\gamma} = \frac{-0{,}2\cdot 98\,000}{8820} = -2{,}222\ \text{mcl}
          $$
          $$
          B_B = -2{,}222 + 0{,}008 + 5 = 2{,}786\ \text{mcl}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              El sentido del flujo lo decide la energía total, porque el
              rozamiento solo puede hacerla disminuir.
          - texto: >-
              En $A$ vale 7,906 mcl y en $B$, 2,786: la diferencia son 5,12 m
              de pérdida de carga entre los dos puntos.
          - texto: >-
              Por tanto el aceite circula **de $A$ a $B$**, subiendo cinco
              metros y perdiendo presión por el camino.
          - texto: >-
              Como en $B$ la presión es negativa, el flujo no puede ir hacia
              allí: un fluido no circula hacia una depresión.
            trampa: true
            mensaje: |
              Circula perfectamente, y es lo que pasa aquí. La depresión de $B$
              es consecuencia de haber subido 5 m y haber perdido carga por el
              camino, no un impedimento. Lo único que no puede hacer el fluido
              es ganar energía total sin una máquina.

    resolucion: |
      **La única comparación que vale es la del Bernoulli completo**, porque
      las pérdidas de carga solo pueden restar: la energía total nunca crece en
      el sentido del flujo.

      $$
      B_A = \frac{p_A}{\gamma} + \frac{v_A^{2}}{2g} + z_A
      = 7{,}778 + 0{,}128 + 0 = 7{,}906\ \text{mcl}
      $$
      $$
      B_B = -2{,}222 + 0{,}008 + 5 = 2{,}786\ \text{mcl}
      $$

      **$B_A > B_B$, luego el aceite va de $A$ a $B$**, y por el camino pierde
      $5{,}12\ \text{m}$ de carga.

      **Los tres términos discrepan y por eso el problema tiene gracia.**
      Mirando solo la presión, el flujo iría de $A$ a $B$; mirando solo la
      cota, de $B$ a $A$; y la altura cinética, que es la menor de las tres,
      también apunta de $A$ a $B$. Cuando dos criterios parciales se
      contradicen, el que manda es siempre la suma.

      **Y dos detalles que conviene fijar.**

      El primero: la presión se pasa a altura con el peso específico **del
      fluido que circula**, no con el del agua. Con agua saldría $7{,}143$ en
      vez de $7{,}778$, y en un problema donde se comparan dos números parecidos
      eso puede cambiar la respuesta.

      El segundo, al revés: **la altura cinética aquí es irrelevante**. Vale
      13 cm en $A$ y 8 mm en $B$, frente a más de cinco metros de diferencia
      entre los dos Bernoullis. Calcularla es correcto y cuesta poco, pero
      conviene ver que no es la que decide — en una conducción, salvo en
      boquillas y gargantas, el término cinético casi nunca manda.

  # ── COLECCIÓN 3.11. El más corto del capítulo, y el que mejor enseña que
  #    la boquilla convierte presión en velocidad al cuadrado.
  - id: ejflu12-col311-la-presion-antes-de-la-boquilla
    titulo: Qué presión hay antes de una boquilla de manguera
    fuente: >-
      Ejercicio 3.11 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una manguera de $75\ \text{mm}$ de diámetro termina en una boquilla de
      $35\ \text{mm}$ de diámetro. Si el caudal fluyente es $20\ \text{l/s}$
      de agua, despreciando las pérdidas, se pide:

      a) Presión aguas arriba de la boquilla.
    pide: La presión en la manguera, justo antes de la boquilla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué presión hay a la salida de la boquilla?
        opciones:
          - texto: >-
              Cero manométrica: el chorro sale a la atmósfera y su presión es la
              atmosférica
            correcta: true
            mensaje: |
              Eso es, y es lo que cierra el problema. Un chorro libre está a la
              presión del ambiente en el que sale; toda la presión de la
              manguera se ha convertido en velocidad.
          - texto: >-
              La misma que en la manguera, porque el caudal es el mismo
            mensaje: |
              El caudal es el mismo pero la velocidad no: la boquilla es cuatro
              veces y media más estrecha en área. Y donde crece la velocidad,
              cae la presión.
          - texto: >-
              No se puede saber sin conocer la longitud de la manguera
            mensaje: |
              La longitud importaría para las pérdidas, y el enunciado dice que
              se desprecian. Lo que fija la presión de salida es que el chorro
              descarga al aire.

      - tipo: calcular
        titulo: La presión
        pregunta: |
          ¿Qué presión hay aguas arriba de la boquilla?
        respuesta:
          tipo: magnitud
          valor: '21 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '22.05 mca'
            mensaje: |
              Te has dejado la altura cinética de la manguera. Bernoulli
              iguala **las dos**: $p/\gamma + v_1^{2}/2g = v_2^{2}/2g$, así que
              hay que restar la de aguas arriba.
          - valor: '1.046 mca'
            mensaje: |
              Has usado la velocidad de la manguera en los dos sitios. La
              boquilla la multiplica por $(75/35)^{2} = 4{,}59$, y como la
              altura va con el cuadrado, la diferencia es enorme.
        pista: |
          Bernoulli entre la manguera y la salida, misma cota y presión de
          salida nula.
        desarrollo: |
          $$
          v_1 = \frac{0{,}02}{\pi\,0{,}075^{2}/4} = 4{,}53\ \text{m/s}
          \qquad
          v_2 = \frac{0{,}02}{\pi\,0{,}035^{2}/4} = 20{,}79\ \text{m/s}
          $$
          $$
          \frac{p_1}{\gamma} = \frac{v_2^{2}-v_1^{2}}{2g}
          = \frac{432{,}1-20{,}5}{19{,}6} = 21{,}0\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El chorro sale a la atmósfera, así que su presión manométrica es
              nula y toda la energía de presión se ha vuelto cinética.
          - texto: >-
              La boquilla multiplica la velocidad por $(75/35)^{2} = 4{,}59$, y
              la altura cinética por su cuadrado, más de veinte veces.
          - texto: >-
              La presión necesaria aguas arriba es la diferencia de alturas
              cinéticas: 21 mca, es decir algo más de 2 bar.
          - texto: >-
              Si se estrechara más la boquilla, la presión necesaria bajaría,
              porque saldría menos agua.
            trampa: true
            mensaje: |
              Con el mismo caudal, una boquilla más estrecha exige **más**
              presión, porque la velocidad de salida crece. Lo que sí ocurre en
              una instalación real es que al estrechar la boquilla baja el
              caudal — pero eso es otro problema, con la curva de la bomba de
              por medio.

    resolucion: |
      **Bernoulli entre la manguera y el chorro**, misma cota, sin pérdidas y
      con la salida a presión atmosférica:

      $$
      \frac{p_1}{\gamma} + \frac{v_1^{2}}{2g} = 0 + \frac{v_2^{2}}{2g}
      \;\Longrightarrow\;
      \frac{p_1}{\gamma} = \frac{v_2^{2}-v_1^{2}}{2g}
      $$
      $$
      v_1 = 4{,}53\ \text{m/s}
      \qquad
      v_2 = 20{,}79\ \text{m/s}
      \qquad
      \frac{p_1}{\gamma} = 21{,}0\ \text{mca}
      $$

      **Veintiún metros de columna de agua, es decir algo más de dos bar**,
      para veinte litros por segundo por una manguera. Ese es el orden de
      magnitud de una lanza de bombero, y explica por qué hacen falta dos
      personas para sujetarla.

      **La relación que hay que ver** es que la boquilla multiplica la
      velocidad por la relación de áreas —$(75/35)^{2} = 4{,}59$— y la energía
      cinética por el cuadrado de eso, veintiuna veces. Toda esa energía sale
      de la presión, así que estrechar la boquilla **encarece** el bombeo, no
      lo abarata.

  # ── COLECCIÓN 3.12. Bernoulli con máquinas repartidas a lo largo de una
  #    conducción larga: la distancia entre bombas la fija la presión que
  #    aguanta la tubería.
  - id: ejflu12-col312-la-distancia-entre-bombas
    titulo: A qué distancia hay que poner las bombas de un oleoducto
    fuente: >-
      Ejercicio 3.12 · Colección de Problemas, capítulo 3 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una tubería horizontal de $60\ \text{cm}$ de diámetro transporta
      $440\ \text{l/s}$ de un aceite de densidad relativa $0{,}825$. A lo largo
      de la conducción hay instaladas cuatro bombas iguales, siendo las
      presiones a la entrada y salida de cada una $-0{,}56$ y
      $25\ \text{kg/cm}^{2}$ respectivamente. Si la pérdida de carga es de
      $60\ \text{mcl}$ cada $1.000\ \text{m}$, se pide:

      a) Distancia existente entre las bombas.
    pide: La distancia entre dos bombas consecutivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tubería es horizontal y de diámetro constante. ¿Qué simplifica eso?
        opciones:
          - texto: >-
              Que la cota y la altura cinética son iguales en todos los puntos,
              así que toda la pérdida de carga se ve como caída de presión
            correcta: true
            mensaje: |
              Exacto. Con $z$ y $v$ constantes, Bernoulli se reduce a
              $p_1/\gamma - h_f = p_2/\gamma$: la presión y la energía se
              mueven juntas.
          - texto: >-
              Que no hay pérdidas de carga
            mensaje: |
              Las hay, y el enunciado las da: 60 mcl por cada kilómetro. Que la
              tubería sea horizontal no elimina el rozamiento.
          - texto: >-
              Que las cuatro bombas dan la misma altura
            mensaje: |
              La dan porque son iguales y trabajan entre las mismas presiones,
              no porque la tubería sea horizontal. Y ese dato no hace falta
              para responder.

      - tipo: calcular
        titulo: La caída de presión disponible
        pregunta: |
          ¿Cuántos metros de columna de aceite se pueden perder entre dos
          bombas?
        respuesta:
          tipo: magnitud
          valor: '309.8 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '255.6 m'
            mensaje: |
              Has convertido los $\text{kg/cm}^{2}$ a metros de columna de
              **agua**. El fluido es aceite, $\gamma = 0{,}825\cdot 9800$, y su
              columna es más alta para la misma presión.
          - valor: '302.9 m'
            mensaje: |
              Te has dejado la depresión de la entrada. La caída aprovechable
              va desde $+25$ hasta $-0{,}56\ \text{kg/cm}^{2}$: son $25{,}56$
              de diferencia, no 25.
        pista: |
          La diferencia entre la salida de una bomba y la entrada de la
          siguiente, pasada a metros de columna de **aceite**.
        desarrollo: |
          $$
          \Delta p = 25 - (-0{,}56) = 25{,}56\ \frac{\text{kg}}{\text{cm}^{2}}
          = 2\,504\,880\ \text{Pa}
          $$
          $$
          h_f = \frac{2\,504\,880}{0{,}825\cdot 9800} = 309{,}8\ \text{mcl}
          $$

      - tipo: calcular
        titulo: La distancia
        pregunta: |
          ¿Qué distancia hay entre bombas?
        respuesta:
          tipo: magnitud
          valor: '5164 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4260 m'
            mensaje: |
              Has usado la columna de agua en vez de la de aceite. La pérdida
              está dada en **mcl** —metros de columna del líquido que
              circula— y la presión hay que pasarla a esa misma unidad.
          - valor: '18590 m'
            mensaje: |
              Has multiplicado por 60 en vez de dividir. La pérdida son 60
              metros **cada mil**: cuantos más metros de carga haya
              disponibles, más lejos se puede poner la bomba siguiente, pero
              divididos entre 60.
        pista: |
          $60\ \text{mcl}$ por cada $1000\ \text{m}$.
        desarrollo: |
          $$
          L = \frac{309{,}8}{60}\cdot 1000 = 5164\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la tubería horizontal y de sección constante, toda la pérdida
              de carga se traduce en caída de presión.
          - texto: >-
              Entre la salida de una bomba y la entrada de la siguiente hay
              $25{,}56\ \text{kg/cm}^{2}$, es decir 309,8 metros de columna de
              aceite.
          - texto: >-
              A 60 mcl por kilómetro, eso da 5.164 m entre bombas: unos cinco
              kilómetros.
          - texto: >-
              El caudal de $440\ \text{l/s}$ y el diámetro de 60 cm son los
              datos que fijan la pérdida de carga unitaria.
            trampa: true
            mensaje: |
              La pérdida unitaria **la da el enunciado**: 60 mcl cada 1000 m.
              El caudal y el diámetro no se usan en ningún momento — están para
              que el problema parezca más largo de lo que es, y reconocer los
              datos que sobran es parte de resolverlo.

    resolucion: |
      **Con la tubería horizontal y de diámetro constante**, la cota y la
      velocidad son las mismas en todas partes, así que Bernoulli se reduce a

      $$
      \frac{p_1}{\gamma} - h_f = \frac{p_2}{\gamma}
      $$

      **La carga disponible entre dos bombas** es la diferencia entre la
      presión de salida de una y la de entrada de la siguiente:

      $$
      h_f = \frac{(25+0{,}56)\cdot 98\,000}{0{,}825\cdot 9800} = 309{,}8\ \text{mcl}
      $$
      $$
      L = \frac{309{,}8}{60}\cdot 1000 = 5164\ \text{m}
      $$

      **Cinco kilómetros entre bombas**, y eso es un dato de proyecto real: en
      un oleoducto la separación de las estaciones de bombeo la fija la presión
      que la tubería aguanta. Con 25 kg/cm² de salida —unas 25 atmósferas— y
      una pérdida de 60 metros por kilómetro, la conducción llega hasta ahí.

      **Y dos observaciones sobre los datos.** El caudal y el diámetro **no se
      usan**: la pérdida unitaria viene dada. Y la presión de entrada es
      **negativa**, $-0{,}56\ \text{kg/cm}^{2}$: la bomba aspira. Contar solo
      los 25 y olvidar esa depresión acorta la distancia en 113 metros — poco,
      pero es dinero en tubería.
