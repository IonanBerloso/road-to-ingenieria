      <figcaption>Las tres cotas a escala. La boquilla es lo único de la instalación donde se conocen a la vez la presión y la salida a la atmósfera: por eso el problema empieza por el final.</figcaption>
      </figure>
    pide: La velocidad de la boquilla, los tres caudales, la altura de la bomba y su potencia bruta.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres tuberías y ningún caudal dado. ¿Por qué se puede empezar por
          la boquilla?
        opciones:
          - texto: 'Porque en E se conoce la presión y en la salida se conoce que es cero: dos puntos y una sola incógnita'
            correcta: true
            mensaje: |
              Eso es. El manómetro de E da 3,2 kg/cm² y el chorro sale a la
              atmósfera; la continuidad liga las dos velocidades. Es el único
              tramo de la instalación con esa propiedad.
          - texto: Porque el caudal de la boquilla es el mayor de los tres y determina a los demás
            mensaje: |
              Ni es el mayor —por la boquilla salen 17,8 l/s y por la tubería 1
              pasan 50,2— ni la razón sería esa. Lo que la hace resoluble es
              tener dos presiones conocidas, no su tamaño.
          - texto: Porque el depósito D está presurizado y su presión se propaga hasta la boquilla
            mensaje: |
              D y la boquilla están en ramas distintas del nudo C: la presión de
              D no llega a la boquilla. Lo que comparten es el Bernoulli de C, y
              a ese se llega **desde** la boquilla, no al revés.

      - tipo: calcular
        titulo: La velocidad del chorro
        pregunta: |
          Velocidad de salida por la boquilla, de 30 mm, sabiendo que en E —en
          la tubería de 100 mm, justo antes— la presión es de 3,2 kg/cm².
        respuesta:
          tipo: magnitud
          valor: '25.15 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad
        distractores:
          - valor: '17.78 m/s'
            mensaje: |
              Te has dejado el 2 de $\sqrt{2gh}$. Es el error más caro de
              Torricelli, porque no desentona: da una velocidad perfectamente
              creíble, un 30 % baja.
          - valor: '7.95 m/s'
            mensaje: |
              Has tomado 3,2 kg/cm² como 3,2 mca. Un kilo por centímetro
              cuadrado son 10 metros de agua, así que la carga es 32 m.
          - valor: '26.26 m/s'
            mensaje: |
              Has puesto la relación de diámetros al cuadrado en vez de a la
              cuarta. La razón de **áreas** ya es un cuadrado, y en el balance
              de alturas de velocidad entra otra vez al cuadrado.
        pista: |
          Bernoulli de E a la salida, misma cota:
          $32 + V_3^{2}/2g = V_b^{2}/2g$, con
          $V_3 = (30/100)^{2}V_b$.
        desarrollo: |
          $$
          \frac{V_b^{2}}{2g}\left[1 - \left(\frac{30}{100}\right)^{4}\right] = 32 \;\Longrightarrow\; V_b = \sqrt{\frac{2g \cdot 32}{0{,}9919}} = 25{,}15\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El Bernoulli en el nudo
        pregunta: |
          Altura de Bernoulli en el nudo C, en mca.
        respuesta:
          tipo: magnitud
          valor: '50.1 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '42.26 m'
            mensaje: |
              Ese es el Bernoulli de E. De C a E se pierden todavía 7,84 m por
              la tubería 3, y C está aguas arriba: tiene que estar más alto.
          - valor: '132 m'
            mensaje: |
              Has pasado de $V_b$ a $V_3$ con la razón de diámetros, 0,3, en vez
              de la de áreas, 0,09. Como $h_{f3}$ va con el cuadrado de $V_3$,
              el error se multiplica por cien: 87 m de pérdida en vez de 7,8.
          - valor: '40.1 m'
            mensaje: |
              Te has olvidado de la cota de E, 10 m. La presión y la velocidad
              no son toda la energía: falta la altura.
        pista: |
          $B_E = 10 + 32 + V_3^{2}/2g$ y $B_C = B_E + h_{f3}$, con
          $h_{f3} = 30\,V_3^{2}/2g$ y $V_3 = 2{,}26$ m/s.
        desarrollo: |
          $$
          V_3 = \left(\frac{30}{100}\right)^{2} \cdot 25{,}15 = 2{,}26\ \text{m/s} \qquad \frac{V_3^{2}}{2g} = 0{,}261\ \text{m} \qquad h_{f3} = 30 \cdot 0{,}261 = 7{,}84\ \text{m}
          $$

          $$
          B_C = (10 + 32 + 0{,}26) + 7{,}84 = 50{,}10\ \text{mca}
          $$

      - tipo: calcular
        titulo: Los tres caudales
        pregunta: |
          Caudal por la tubería 2, que sube al depósito D y disipa 4 kW.
        respuesta:
          tipo: magnitud
          valor: '32.4 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '27.0 l/s'
            mensaje: |
              Has tomado la cota de D sin su manómetro. D está cerrado: los
              24,5 kPa son 2,5 mca más, y su Bernoulli es 37,5.
          - valor: '17.8 l/s'
            mensaje: |
              Ese es el caudal de la tubería 3, el que sale por la boquilla. La
              tubería 2 lleva el resto.
          - valor: '50.2 l/s'
            mensaje: |
              Ese es el total, el de la tubería 1. En el nudo C se reparte entre
              las dos ramas.
        pista: |
          $h_{f2} = B_C - B_D$ con $B_D = 35 + 24{,}5/9{,}8$, y
          $Q_2 = P_2/(\gamma\,h_{f2})$.
        desarrollo: |
          $$
          B_D = 35 + 2{,}5 = 37{,}5\ \text{mca} \qquad h_{f2} = 50{,}10 - 37{,}5 = 12{,}60\ \text{m}
          $$

          $$
          Q_2 = \frac{4\,000}{9\,800 \cdot 12{,}60} = 0{,}0324\ \text{m}^{3}\text{/s}
          $$

          Y con $Q_3 = 25{,}15 \cdot \pi \cdot 0{,}03^{2}/4 = 17{,}8$ l/s, la
          tubería 1 lleva $32{,}4 + 17{,}8 = 50{,}2$ l/s.

      - tipo: calcular
        titulo: La bomba
        pregunta: |
          Potencia bruta de la bomba, con rendimiento 0,75.
        respuesta:
          tipo: magnitud
          valor: '32.05 kW'
          tolerancia: 0.01
          formato: una potencia con su unidad (W o kW)
        distractores:
          - valor: '24.02 kW'
            mensaje: |
              Esa es la potencia útil. La bruta es la que consume la bomba: se
              divide entre el rendimiento, no se multiplica.
          - valor: '31.53 kW'
            mensaje: |
              Te has dejado la pérdida de la tubería 1. Son 0,75 mca —medio
              metro de un líquido de $s = 1{,}5$— y aunque parezcan poco, la
              bomba los paga.
          - valor: '11.35 kW'
            mensaje: |
              Has usado el caudal de la boquilla. Por la bomba pasan los 50,2
              l/s de la tubería 1, que es la suma de las dos ramas.
        pista: |
          $2 - h_{f1} + H_m = B_C$ con $h_{f1} = 0{,}5 \cdot 1{,}5$ mca, y
          después $P_{bruta} = \gamma Q_1 H_m/\eta$.
        desarrollo: |
          $$
          H_m = 50{,}10 - 2 + 0{,}75 = 48{,}85\ \text{mca}
          $$

          $$
          P_{bruta} = \frac{9\,800 \cdot 0{,}0502 \cdot 48{,}85}{0{,}75} = 32{,}05\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el recorrido del problema. Una pieza es falsa.
        piezas:
          - texto: 'La boquilla es el punto de partida: presión conocida a un lado y atmósfera al otro dan la velocidad del chorro, 25,15 m/s, y con ella el caudal de la tubería 3.'
          - texto: 'Subiendo por la 3 hasta el nudo se llega a BC = 50,10 mca, y esa es la cifra que ata las otras dos ramas.'
          - texto: 'La rama de D da su caudal por la potencia disipada, y la suma de las dos ramas es lo que pasa por la bomba.'
          - texto: 'Como la pérdida de la tubería 1 está dada en metros de un líquido de s = 1,5, en agua son 0,5/1,5 = 0,33 m.'
            trampa: true
            mensaje: |
              Al revés: se multiplica. Medio metro de un líquido que pesa vez y
              media lo que el agua es la misma presión que 0,75 m de agua. La
              regla, y sirve siempre: al pasar a un fluido **más pesado** la
              altura **baja**.
    resolucion: |
      **El problema se recorre al revés.** No hay ningún caudal dado, así que
      hay que buscar el punto donde se conozcan dos presiones: la boquilla, con
      3,2 kg/cm² a la entrada y la atmósfera a la salida.

      **La boquilla y la tubería 3** (a y parte de b).

      $$
      \frac{V_b^{2}}{2g}\left[1-\left(\frac{30}{100}\right)^{4}\right] = 32 \;\Longrightarrow\; V_b = 25{,}15\ \text{m/s} \qquad Q_3 = 17{,}8\ \text{l/s}
      $$

      **Subiendo al nudo.**

      $$
      B_E = 10 + 32 + 0{,}26 = 42{,}26 \qquad h_{f3} = 30 \cdot 0{,}261 = 7{,}84 \qquad B_C = 50{,}10\ \text{mca}
      $$

      **La rama de D** (resto de b). D está cerrado, así que su energía no es su
      cota:

      $$
      B_D = 35 + 2{,}5 = 37{,}5 \qquad h_{f2} = 12{,}60\ \text{m} \qquad Q_2 = \frac{4\,000}{9\,800 \cdot 12{,}60} = 32{,}4\ \text{l/s}
      $$

      **La bomba** (c y d). Por ella pasa la suma, 50,2 l/s:

      $$
      H_m = 50{,}10 - 2 + 0{,}75 = 48{,}85\ \text{mca} \qquad P_{bruta} = \frac{9\,800 \cdot 0{,}0502 \cdot 48{,}85}{0{,}75} = 32{,}05\ \text{kW}
      $$

      Los cuatro coinciden con el boletín.

      **Las tres unidades que hay que traducir, y las tres están puestas a
      propósito.** $0{,}5$ metros de un líquido de $s = 1{,}5$ son 0,75 mca —se
      multiplica—; $3{,}2$ kg/cm² son 32 mca; y $24{,}5$ kPa son 2,5 mca. Ningún
      dato del enunciado viene en la unidad en que se usa.
  - id: ejflu12-col317-dos-depositos-iguales-que-no-aportan-lo-mismo
    titulo: Dos depósitos a la misma altura que no aportan lo mismo
    fuente: Ejercicio 3.17 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Dos depósitos A y B, de altura constante, abastecen mediante las tuberías
      1 y 2 a la tubería maestra 3, suministradora, a su vez, de la turbina T. A
      la salida de ésta el agua sale al exterior a través de una boquilla E, de
      100 mm de diámetro. Se pide:

      a) Caudal $Q_2$ que aporta el depósito B.

      b) Caudal $Q_3$ que se suministra a la turbina.

      c) Altura puesta a disposición de la turbina.

      d) Potencia útil de la turbina si su rendimiento es 0,9.

      e) Presión que indicará el manómetro D situado a la salida de la turbina.

      Datos: Pérdidas en 1 = 1 kW; Factor de paso de 2 = 13,328; factor de paso
      de 3 = 9,8; $Q_1$ = 50 l/s; $D_1$ = 200 mm; $D_2$ = 150 mm;
      $D_3$ = 300 mm.

      Nota: Despréciense las pérdidas en la boquilla.

