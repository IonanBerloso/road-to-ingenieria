        <text x="108" y="44" text-anchor="end" font-size="9" fill="var(--faint)">30</text>
        <text x="108" y="194" text-anchor="end" font-size="9" fill="var(--faint)">15</text>
        <text x="108" y="244" text-anchor="end" font-size="9" fill="var(--faint)">10</text>
        <text x="108" y="294" text-anchor="end" font-size="9" fill="var(--faint)">5</text>
