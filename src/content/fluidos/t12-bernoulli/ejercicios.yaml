      <figcaption>Una bomba y tres servicios que se reparten lo que sube. Las cotas van en metros; los círculos numeran las tuberías y los dos manómetros marcan dónde se mide la presión.</figcaption>
      </figure>
    pide: La carga en el nudo, la potencia de la bomba, el caudal del quemador, la presión antes de la boquilla y qué hace la tubería 5.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres ramas saliendo de N y ningún caudal conocido en dos de
          ellas. ¿Por cuál se empieza para obtener la carga del nudo?
        opciones:
          - texto: Por la 3, porque C está abierto en una cota conocida y de esa rama se dan el caudal y la pérdida
            correcta: true
            mensaje: |
              Eso es. La rama 3 tiene los dos extremos determinados —la lámina
              de C en la cota 55 y una pérdida que se puede calcular con Q3—,
              así que da la carga del nudo sin necesitar nada más. Las otras
              dos ramas solo se pueden resolver después.
          - texto: Por la 4, porque la boquilla descarga a la atmósfera
            mensaje: |
              Descarga a la atmósfera, sí, pero su caudal es incógnita y la
              pérdida depende de él. Esa rama tiene dos incógnitas hasta que se
              conozca la carga del nudo.
          - texto: Por la 5, porque la presión de E está dada
            mensaje: |
              La presión de E fija la carga en su extremo, pero no el caudal, y
              en esa rama ni siquiera se sabe todavía hacia dónde circula.
          - texto: Por la 1 y la 2, subiendo desde A con el caudal de la bomba
            mensaje: |
              Se podría si se conociera la altura que da la bomba, y es
              justamente lo que pide el apartado b). Ese camino va al revés: la
              bomba se calcula **después** de saber la carga del nudo.

      - tipo: calcular
        titulo: La carga en el nudo
        pregunta: |
          Bernoulli en el nudo N, en metros de columna de líquido.
        respuesta:
          tipo: magnitud
          valor: '63 m'
          tolerancia: 0.02
          formato: una altura de carga con su unidad (m)
        distractores:
          - valor: '55 m'
            mensaje: |
              Esa es la cota de C. Para que el líquido suba de N a C hace falta
              carga **de más**, justo la que se pierde por el camino.
          - valor: '47 m'
            mensaje: |
              Has restado la pérdida en vez de sumarla. El flujo va de N hacia
              C, así que N tiene que estar por encima.
        pista: |
          Los 313,6 W de la tubería 3 son una potencia. Se pasan a metros
          dividiendo por el peso específico y por el caudal de esa rama.
        desarrollo: |
          El peso específico del combustible es
          $\gamma = 0{,}8\cdot 1000\cdot 9{,}8 = 7840$ N/m³. La pérdida de la
          tubería 3, en metros:

          $$
          h_{f3} = \frac{P}{\gamma\,Q_3} = \frac{313{,}6}{7840\cdot 0{,}005} = 8\ \text{mcl}
          $$

          Y como C está abierto con la lámina en la cota 55,

          $$
          B_N = 55 + 8 = 63\ \text{mcl} \qquad B_N\,\gamma = 63\cdot 7840 = 493\,920\ \text{J/m}^{3}
          $$

          Las dos formas dicen lo mismo. La segunda es literalmente energía por
          unidad de volumen, y la primera es esa energía dividida por el peso
          específico — por eso se mide en metros **de ese líquido**, no de agua.

      - tipo: calcular
        titulo: La potencia útil de la bomba
        pregunta: |
          Potencia útil que suministra la bomba, en kW.
        respuesta:
          tipo: magnitud
          valor: '4.468 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '3.105 kW'
            mensaje: |
              Te has dejado las pérdidas de las tuberías 1 y 2. La bomba tiene
              que vencer el desnivel **y** lo que se pierde por el camino.
          - valor: '4.196 kW'
            mensaje: |
              Has sumado las pérdidas sin convertirlas. Los 1,6 mca y el
              1 kg/cm² están en columna de **agua**; en columna de este
              combustible son 2 y 12,5 m, porque pesa un 20 % menos y hace
              falta más altura para la misma presión.
        pista: |
          Bernoulli de A a N pasando por la bomba, todo en metros de columna de
          líquido. Cuidado con las unidades de las dos pérdidas.
        desarrollo: |
          Las dos pérdidas vienen en unidades de agua y hay que pasarlas a
          columna de combustible:

          $$
          h_{f1} = \frac{1{,}6}{0{,}8} = 2\ \text{mcl} \qquad h_{f2} = \frac{10}{0{,}8} = 12{,}5\ \text{mcl}
          $$

          —el kg/cm² son 10 mca—. Con A abierto en la cota 30 y el nudo en 63:

          $$
          H_b = (63 - 30) + 2 + 12{,}5 = 47{,}5\ \text{mcl}
          $$

          $$
          P = \gamma\,Q_1\,H_b = 7840\cdot 0{,}012\cdot 47{,}5 = 4468{,}8\ \text{W}
          $$

      - tipo: calcular
        titulo: El caudal del quemador
        pregunta: |
          Caudal Q4 que va al quemador, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '4.07 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '6.185 l/s'
            mensaje: |
              Solo has contado el K4 de la tubería. Faltan la pérdida de la
              boquilla y la energía cinética con la que sale el chorro, y las
              dos van con la velocidad **de la boquilla**, que es nueve veces
              la de la tubería.
          - valor: '4.764 l/s'
            mensaje: |
              Te falta la energía cinética del chorro. El combustible sale de
              la boquilla a 8,3 m/s y se lleva esa energía; no es una pérdida,
              pero consume carga igual.
        pista: |
          La boquilla es de 25 mm y la tubería de 75: la sección es nueve veces
          menor, así que la velocidad es nueve veces mayor y su altura, 81
          veces.
        desarrollo: |
          Entre el nudo (63 mcl) y la salida de la boquilla (cota 50, a la
          atmósfera):

          $$
          63 - 50 = K_4\frac{v_4^{2}}{2g} + K_b\frac{v_b^{2}}{2g} + \frac{v_b^{2}}{2g}
          $$

          Con $v_b = 9\,v_4$ por continuidad, los dos últimos términos valen
          $(1{,}1 + 1)\cdot 81 = 170{,}1$ veces $v_4^{2}/2g$, de modo que

          $$
          13 = (130 + 170{,}1)\frac{v_4^{2}}{2g} \;\Longrightarrow\; \frac{v_4^{2}}{2g} = 0{,}0433\ \text{m}
          $$

          $$
          v_4 = 0{,}921\ \text{m/s} \qquad A_4 = \frac{\pi\,0{,}075^{2}}{4} = 4{,}42\cdot 10^{-3}\ \text{m}^{2}
          $$

          y el producto de los dos es el caudal, 4,07 l/s.

          Fíjate en el reparto: los 130 de la tubería y los 170 de la boquilla
          son del mismo orden, y sin embargo la boquilla no tiene ningún
          $K$ grande. Todo su peso viene del factor 81 que introduce el cambio
          de sección.

      - tipo: calcular
        titulo: La presión antes de la boquilla
        pregunta: |
          Presión a la entrada de la boquilla, en kg/cm².
        respuesta:
          tipo: magnitud
          valor: '0.586 kg/cm2'
          tolerancia: 0.02
          formato: una presión con su unidad (kg/cm², mca o kPa)
        distractores:
          - valor: '1.04 kg/cm2'
            mensaje: |
              Te has dejado la pérdida de la tubería 4. De los 13 m de
              diferencia entre el nudo y la boquilla, 5,63 se los come la
              tubería antes de llegar.
          - valor: '0.732 kg/cm2'
            mensaje: |
              Has pasado de metros a kg/cm² como si fuera agua. Son metros de
              **combustible**, y cada uno vale 0,8 metros de agua.
        pista: |
          En F, justo antes de la boquilla, la carga es la del nudo menos lo
          que se ha perdido en la 4; de ahí se restan la cota y la altura de
          velocidad.
        desarrollo: |
          $$
          h_{f4} = 130\cdot 0{,}0433 = 5{,}63\ \text{mcl}
          $$

          $$
          \frac{p_F}{\gamma} = 63 - 5{,}63 - 50 - 0{,}0433 = 7{,}325\ \text{mcl}
          $$

          Eso son $7{,}325\cdot 0{,}8 = 5{,}86$ mca, y como 1 kg/cm² equivale a
          10 mca,

          $$
          p_F = 0{,}586\ \text{kg/cm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta sobre la tubería 5. Una pieza es falsa.
        piezas:
          - texto: 'En E la presión son 0,7 m de mercurio, que son 9,52 mca y, en columna de este combustible, 11,9 m.'
          - texto: 'Su cota piezométrica es entonces 40 más 11,9, o sea 51,9 mcl, por debajo de los 63 del nudo.'
          - texto: 'Luego el flujo va de N a E, y por continuidad lleva 12 menos 5 menos 4,07, es decir 2,93 l/s.'
          - texto: 'Con 11,1 mcl de pérdida repartidos en 34 m, se disipan 7,5 W por cada metro de tubería.'
          - texto: Como E está presurizado y el nudo no, el flujo tiene que ir de E hacia N.
            trampa: true
            mensaje: |
              Estar presurizado no basta: lo que decide el sentido es la cota
              piezométrica, que suma cota y presión. E tiene 11,9 m de presión
              pero está 10 m más abajo, así que se queda en 51,9 contra los 63
              del nudo. El flujo va de N a E.
    resolucion: |
      ## Una instalación que hay que resolver por el sitio correcto

      Del nudo N salen tres ramas y en dos de ellas no se conoce el caudal. Si
      se intenta empezar por la bomba, aparecen dos incógnitas a la vez —la
      altura de la bomba y la carga del nudo— y no se sale. La entrada está en
      la **rama 3**, que es la única con los dos extremos determinados: la
      lámina de C en la cota 55 y una pérdida que se calcula con el caudal
      dado.

      ## a) La carga del nudo, a partir de una potencia

      La pérdida de la tubería 3 viene dada en vatios, que es una forma
      inhabitual y muy útil de darla: se pasa a metros dividiendo por el peso
      que atraviesa la tubería cada segundo.

      $$
      \gamma = 0{,}8\cdot 1000\cdot 9{,}8 = 7840\ \text{N/m}^{3} \qquad h_{f3} = \frac{313{,}6}{7840\cdot 0{,}005} = 8\ \text{mcl}
      $$

      $$
      B_N = 55 + 8 = 63\ \text{mcl} = 493\,920\ \text{J/m}^{3}
      $$

      Los J/m³ no son un adorno del enunciado: son lo que Bernoulli mide de
      verdad, energía por unidad de volumen. Los metros aparecen al dividir por
      $\gamma$, y por eso **siempre son metros de un líquido concreto**. En
      este problema esa distinción decide dos apartados.

      ## b) La bomba, y el peligro de las unidades

      Las dos pérdidas del tramo de impulsión vienen en unidades de agua —1,6
      mca y 1 kg/cm²— y el balance se está escribiendo en columna de
      combustible. Como el combustible pesa un 20 % menos, la misma pérdida de
      presión necesita **más** metros:

      $$
      h_{f1} = 2\ \text{mcl} \qquad h_{f2} = 12{,}5\ \text{mcl}
      $$

      $$
      H_b = 33 + 2 + 12{,}5 = 47{,}5\ \text{mcl} \qquad P = 7840\cdot 0{,}012\cdot 47{,}5 = 4468{,}8\ \text{W}
      $$

      es decir 4,47 kW. Quien sume 1,6 y 10 sin convertirlas se queda en
      4,20 kW, un 6 % por
      debajo. No es un error grande en el número, pero es un error de concepto
      que en otro problema puede ser enorme.

      ## c) y d) El quemador, donde manda la sección

      La boquilla es de 25 mm y la tubería de 75: la sección es nueve veces
      menor y la velocidad nueve veces mayor, así que la altura de velocidad se
      multiplica por 81. Los dos términos de la boquilla —su pérdida y la
      energía que se lleva el chorro— pesan juntos

      $$
      (1{,}1 + 1)\cdot 81 = 170{,}1
      $$

      contra los 130 de toda la tubería 4. **Una pieza de dos centímetros y
      medio consume más carga que la conducción entera**, y no porque su $K$
      sea grande —vale 1,1— sino por el cambio de sección.

      $$
      13 = 300{,}1\,\frac{v_4^{2}}{2g} \;\Longrightarrow\; Q_4 = 4{,}07\ \text{l/s}
      $$

      Y con eso la presión justo antes de la boquilla:

      $$
      \frac{p_F}{\gamma} = 63 - 5{,}63 - 50 - 0{,}04 = 7{,}33\ \text{mcl}
      $$

      que son 5,86 mca, o sea 0,586 kg/cm².

      ## e) y f) La tubería 5, que hay que mirar dos veces

      La pregunta del sentido tiene truco. E está presurizado y el nudo no, así
      que la intuición dice que el flujo saldría de E. Pero lo que decide es la
      cota piezométrica, que suma cota y presión:

      $$
      H_E = 40 + \frac{0{,}7\cdot 13{,}6}{0{,}8} = 40 + 11{,}9 = 51{,}9\ \text{mcl}
      $$

      Contra los 63 del nudo, E queda once metros por debajo: **el flujo va de N
      a E**. La presión de E es real —11,9 m de columna de combustible— pero no
      compensa los diez metros que le faltan de cota.

      El caudal sale de la continuidad, sin más cuentas hidráulicas:
      $12 - 5 - 4{,}07 = 2{,}93$ l/s. Y la potencia disipada por metro:

      $$
      \frac{P}{L} = \frac{\gamma\,Q_5\,h_{f5}}{L_5} = \frac{7840\cdot 0{,}00293\cdot 11{,}1}{34} = 7{,}5\ \text{W/m}
      $$

      Esa cifra es la que un proyectista mira: 7,5 W por metro es calor que se
      queda en el suelo y factura que se paga. En los 34 metros son 255 W
      permanentes, un 5,7 % de todo lo que entrega la bomba, gastados en una
      sola rama que lleva la cuarta parte del caudal.

  - id: ejflu12-col325-el-deposito-de-dos-liquidos-que-se-vacia
    titulo: El depósito de dos líquidos que se vacía
    fuente: Ejercicio 3.25 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En el depósito de la figura el tubo de descarga tiene un factor de paso
      de 1,5. Se pide:

      **a)** Deducir la expresión de la velocidad de salida del agua.

      **b)** Caudal del agua que fluye en las condiciones de la figura.

      **c)** Deducir la expresión que permita conocer el tiempo de vaciado del
      depósito.

      **d)** Tiempo que tardará en descender el nivel de los líquidos 0,5 m,
      suponiendo constante la presión del aire.

