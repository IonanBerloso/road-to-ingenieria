        <line x1="112" y1="118" x2="140" y2="112" stroke="var(--live)" stroke-width="1.6" marker-end="url(#m34l)"/>
      </svg>
      <figcaption>La red entera. Se resuelve de derecha a izquierda: los depósitos E y F fijan la cota de energía en D, de ahí sale la de N, y solo entonces se pueden repartir los caudales.</figcaption>
      </figure>
    pide: Los caudales por las cinco tuberías.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ninguna tubería da su caudal directamente. ¿Por dónde se empieza, y
          por qué?
        opciones:
          - texto: Por el final, en F, que es el único punto con la energía conocida sin depender de ningún caudal
            correcta: true
            mensaje: |
              Eso es. En F la lámina está abierta y quieta, así que su energía
              es su cota, 250. Como la pérdida de la tubería 4 es un dato fijo
              —514,71 Torr, sin depender del caudal— se sube hasta D y de ahí
              se va desenredando todo hacia atrás.
          - texto: Por A, sumando pérdidas hacia adelante hasta cada depósito
            mensaje: |
              Se puede plantear así, pero no se puede **resolver**: en cuanto
              sales de A la pérdida de la tubería 1 depende de su caudal, que
              es una de las incógnitas. Desde F, en cambio, las dos primeras
              pérdidas son datos.
          - texto: Por la boquilla, que al descargar a la atmósfera fija la velocidad de salida
            mensaje: |
              La boquilla descarga a la atmósfera, sí, pero su velocidad
              depende del caudal que le llegue, que es lo que se busca. Su
              ecuación hace falta, pero como segunda pieza, no como primera.

      - tipo: calcular
        titulo: La energía en el nudo D
        pregunta: |
          Cota de energía en D, en mca. La pérdida de la tubería 4 son
          514,71 Torr y F está en la cota 250.
        respuesta:
          tipo: magnitud
          valor: '257 m'
          tolerancia: 0.01
          formato: una altura de energía con su unidad (m o mca)
        distractores:
          - valor: '243 m'
            mensaje: |
              Has restado la pérdida en vez de sumarla. El agua va de D **hacia**
              F, así que D tiene que estar más alto en energía: pierde 7 m por
              el camino.
          - valor: '250.5 m'
            mensaje: |
              Has pasado los Torr a mca dividiendo entre 13,6 en vez de
              multiplicando. Un Torr es un milímetro de mercurio, y el mercurio
              pesa 13,6 veces más que el agua: 514,71 mm de Hg son 7 000 mm de
              agua.
        pista: |
          $B_D - h_{f4} = B_F$, y $B_F = z_F = 250$ porque la lámina está
          abierta y quieta. Los Torr son mm de mercurio.
        desarrollo: |
          $$
          h_{f4} = 514{,}71 \cdot 10^{-3} \cdot 13{,}6 = 7\ \text{mca} \qquad B_D = 250 + 7 = 257\ \text{mca}
          $$

      - tipo: calcular
        titulo: El caudal de la tubería 5
        pregunta: |
          Caudal por la tubería 5, que va de D al depósito presurizado E (cota
          210, presión 30 mca) y disipa 490 W.
        respuesta:
          tipo: magnitud
          valor: '2.94 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '10.6 l/s'
            mensaje: |
              Has olvidado la presión de E. Su energía no es su cota: es
              $210 + 30 = 240$ mca, y la pérdida es 17 m, no 47.
          - valor: '0.3 l/s'
            mensaje: |
              Te falta el peso específico. La potencia disipada es
              $P = \gamma\,Q\,h_f$: hay que dividir entre $9\,800 \cdot 17$, no
              solo entre 17.
        pista: |
          $h_{f5} = B_D - B_E$ con $B_E = z_E + p_E/\gamma$, y
          $P = \gamma Q h_f$.
        desarrollo: |
          $$
          h_{f5} = 257 - (210 + 30) = 17\ \text{mca} \qquad Q_5 = \frac{490}{9\,800 \cdot 17} = 2{,}94 \cdot 10^{-3}\ \text{m}^{3}\text{/s}
          $$

      - tipo: calcular
        titulo: El caudal de la tubería 1
        pregunta: |
          Caudal por la tubería 1, de 400 mm. El «factor de paso» $K_1 = 500$
          significa $h_{f1} = K_1 V_1^{2}/2g$.
        respuesta:
          tipo: magnitud
          valor: '157.4 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '282.8 l/s'
            mensaje: |
              Has tomado $h_f = K Q^{2}$. El factor de paso multiplica la
              **altura de velocidad**, no el caudal al cuadrado: primero sale
              $V_1 = \sqrt{2g\,h_{f1}/K_1} = 1{,}25$ m/s y después
              $Q_1 = V_1 A_1$.
          - valor: '106.6 l/s'
            mensaje: |
              Te has dejado la pérdida de la 4 en el camino de A a F. La cadena
              es $B_A - h_{f1} - h_{f3} - h_{f4} = B_F$: tres pérdidas, no dos.
          - valor: '629.7 l/s'
            mensaje: |
              Has tomado los 400 mm como radio. La sección es
              $\pi \cdot 0{,}4^{2}/4 = 0{,}1257$ m².
        pista: |
          Bernoulli de A a F por el camino 1-3-4:
          $300 - h_{f1} - 3 - 7 = 250$. De ahí $h_{f1}$, luego $V_1$, luego
          $Q_1$.
        desarrollo: |
          $$
          h_{f1} = 300 - 3 - 7 - 250 = 40\ \text{mca} \qquad V_1 = \sqrt{\frac{2 \cdot 9{,}8 \cdot 40}{500}} = 1{,}252\ \text{m/s}
          $$

          $$
          Q_1 = 1{,}252 \cdot \frac{\pi \cdot 0{,}4^{2}}{4} = 0{,}1574\ \text{m}^{3}\text{/s} = 157{,}4\ \text{l/s}
          $$

      - tipo: calcular
        titulo: El caudal del riego
        pregunta: |
          Caudal por la tubería 2, la del riego. Su pérdida vale
          $h_{f2} = 4\,900/(\gamma Q_2)$ y la boquilla descarga a la atmósfera
          en la cota 200 por un diámetro de 65,5 mm, así que
          $B_C = 200 + V_C^{2}/2g$.
        respuesta:
          tipo: magnitud
          valor: '111 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '8.4 l/s'
            mensaje: |
              Es la otra raíz de la cúbica, y también la cumple: con 8,4 l/s la
              tubería 2 disiparía 59,7 m y la boquilla apenas tendría
              velocidad. Se descarta porque un riego que pierde el 60 % de los
              260 m disponibles en la conducción y deja el resto sin
              aprovechar no es una instalación: la solución física es la de
              caudal alto.
          - valor: '46.4 l/s'
            mensaje: |
              Ese es el caudal de la tubería 3, el que queda **después** de
              restar el riego. Aquí se pide el del riego.
          - valor: '157.4 l/s'
            mensaje: |
              Ese es todo lo que entra por la 1. Del nudo N salen dos ramas y el
              riego solo se lleva una parte.
        pista: |
          $B_A - h_{f1} - h_{f2} = B_C$, es decir
          $300 - 40 - 0{,}5/Q_2 = 200 + 4\,493{,}5\,Q_2^{2}$, con $Q_2$ en
          m³/s. Es una cúbica: $4\,493{,}5\,Q_2^{3} - 60\,Q_2 + 0{,}5 = 0$.
        desarrollo: |
          $$
          V_C = \frac{Q_2}{\pi \cdot 0{,}0655^{2}/4} = 296{,}8\,Q_2 \qquad B_C = 200 + \frac{(296{,}8\,Q_2)^{2}}{2g} = 200 + 4\,493{,}5\,Q_2^{2}
          $$

          $$
          260 - \frac{0{,}5}{Q_2} = 200 + 4\,493{,}5\,Q_2^{2} \;\Longrightarrow\; 4\,493{,}5\,Q_2^{3} - 60\,Q_2 + 0{,}5 = 0 \;\Longrightarrow\; Q_2 = 0{,}111\ \text{m}^{3}\text{/s}
          $$

      - tipo: justificar
        pregunta: Ordena el reparto de caudales. Una pieza es falsa.
        piezas:
          - texto: 'En el nudo N: lo que entra por 1 sale por 2 y por 3, así que Q3 = 157,4 − 111 = 46,4 l/s.'
          - texto: 'En el nudo D: Q3 se reparte entre 4 y 5, así que Q4 = 46,4 − 2,95 = 43,5 l/s.'
          - texto: 'La red se resuelve desde F hacia atrás porque allí la energía es conocida y las pérdidas de 4 y de 3 son datos que no dependen del caudal.'
          - texto: 'Como la tubería 5 disipa 490 W y la 2 disipa 4 900 W, por la 2 pasa diez veces más caudal que por la 5.'
            trampa: true
            mensaje: |
              La potencia disipada es $\gamma Q h_f$: depende del caudal **y**
              de la pérdida. Por la 2 pasan 111 l/s y por la 5 pasan 2,94, que
              son 38 veces más, no 10; lo que iguala la cuenta es que la 5
              pierde 17 m y la 2 solo 4,5.
    resolucion: |
      **La idea entera: se empieza por donde no hay incógnitas.** En F la
      lámina está abierta y quieta, así que su energía es su cota, 250 mca. Y
      las pérdidas de las tuberías 4 y 3 son datos fijos, no funciones del
      caudal. Eso permite subir hasta D y hasta A sin saber todavía ningún
      caudal.

      **De F hacia atrás.**

      $$
      h_{f4} = 0{,}51471 \cdot 13{,}6 = 7\ \text{mca} \qquad B_D = 250 + 7 = 257\ \text{mca}
      $$

      $$
      h_{f5} = B_D - B_E = 257 - (210 + 30) = 17\ \text{mca} \qquad Q_5 = \frac{490}{9\,800 \cdot 17} = 2{,}95\ \text{l/s}
      $$

      $$
      h_{f1} = 300 - 3 - 7 - 250 = 40\ \text{mca} \qquad V_1 = \sqrt{\frac{2g \cdot 40}{500}} = 1{,}252\ \text{m/s} \qquad Q_1 = 157{,}4\ \text{l/s}
      $$

      **El riego, que es el único que da una ecuación no lineal.** La energía
      en N ya se conoce: $300 - 40 = 260$ mca. De N a C se pierde
      $h_{f2} = 4\,900/(\gamma Q_2) = 0{,}5/Q_2$, y en C queda la cota más la
      altura de velocidad de la boquilla:

      $$
      4\,493{,}5\,Q_2^{3} - 60\,Q_2 + 0{,}5 = 0 \;\Longrightarrow\; Q_2 = 111\ \text{l/s}
      $$

      **Y los dos nudos.** $Q_3 = Q_1 - Q_2 = 46{,}4$ l/s y
      $Q_4 = Q_3 - Q_5 = 43{,}5$ l/s. Los cinco coinciden con el boletín.

      **Dos avisos.** El primero, el factor de paso: $K_1 = 500$ multiplica la
      **altura de velocidad**, no el caudal al cuadrado; con la otra lectura
      salen 283 l/s por la tubería 1 y toda la red se descuadra. El segundo,
      la cúbica del riego tiene **dos raíces positivas**, 111 l/s y 8,4 l/s, y
      las dos cumplen la ecuación. La segunda corresponde a una tubería que se
      come 60 de los 260 m disponibles: es matemática válida y física
      absurda, y conviene saber que está ahí para no quedarse con ella si el
      método numérico arranca cerca de cero.
  - id: ejflu12-col319-dos-bombas-que-confluyen-en-un-nudo
    titulo: Dos bombas que confluyen en un nudo
    fuente: Ejercicio 3.19 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En el esquema de la figura se muestra un sistema de bombeo donde las
      bombas $B_1$ y $B_2$ elevan un caudal $Q_3 = 15$ l/s de un hidrocarburo de
      densidad $\rho = 860$ kg/m³, de los depósitos A y B al depósito C.
      Calcular:

      a) La altura útil o manométrica que aporta la bomba $B_1$ si un
      caudalímetro a la salida del depósito A marca 5 l/s y se sabe que la
      potencia total absorbida por la bomba $B_1$ es de 2320 W, con un
      rendimiento $\eta_{B1} = 0{,}8$.

      b) Bernoulli en el nudo N en unidades de energía por unidad de peso.

      c) La potencia perdida en la tubería 1, debido a la viscosidad del
      hidrocarburo.

      d) El factor de paso (adimensional) de pérdidas de carga de la tubería 2,
      si se desea instalar una bomba ($B_2$) que aporte al fluido una altura
      útil o manométrica de 30 mc hidrocarburo.

      e) La pérdida de carga en la tubería 3, en mc agua.

      Datos: $K_1$ (tubería 1) = 79; $\varnothing_1$ = 80 mm;
      $\varnothing_2$ = 100 mm; $\varnothing_3$ = 125 mm.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 282" role="img" width="440" height="282"
           aria-labelledby="f319t f319d">
        <title id="f319t">Los dos depósitos de partida, sus dos bombas y el nudo N desde el que sube la tubería 3 al depósito presurizado C</title>
        <desc id="f319d">Tres depósitos a distinta altura, dibujados a escala:
        A en la cota 20, B en la cota 35 y C en la cota 40, este último cerrado
        y con un manómetro que marca 0,86 kilos por centímetro cuadrado. De A
        sale la tubería 1, que pasa por la bomba B uno y sube al nudo N; de B
        sale la tubería 2, que pasa por la bomba B dos y llega también a N; y
        de N sale la tubería 3, que sube hasta C.</desc>
        <defs>
          <marker id="m319l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <rect x="14" y="220" width="96" height="34" fill="var(--alt)" opacity="0.18"/>
        <path d="M14,220 v34 h96 v-34" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="14" y1="220" x2="110" y2="220" stroke="var(--alt)" stroke-width="1.5"/>
        <path d="M56,211 l9,0 l-4.5,7 z" fill="var(--alt)"/>
        <text x="20" y="240" font-size="10" fill="var(--ink)">A · cota 20</text>
        <rect x="336" y="100" width="98" height="34" fill="var(--alt)" opacity="0.18"/>
        <path d="M336,100 v34 h98 v-34" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <line x1="336" y1="100" x2="434" y2="100" stroke="var(--alt)" stroke-width="1.5"/>
        <path d="M380,91 l9,0 l-4.5,7 z" fill="var(--alt)"/>
        <text x="342" y="120" font-size="10" fill="var(--ink)">B · cota 35</text>
        <rect x="196" y="60" width="98" height="34" fill="var(--alt)" opacity="0.2"/>
        <path d="M196,60 h98 v34 h-98 z" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="202" y="80" font-size="10" fill="var(--ink)">C · cota 40</text>
        <circle cx="245" cy="34" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="245" y1="45" x2="245" y2="60" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="262" y="32" font-size="9.5" fill="var(--flag)">P = 0,86 kg/cm²</text>
        <path d="M110,238 H128" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="140" cy="238" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="134" y="264" font-size="10" fill="var(--ink)">B1</text>
        <path d="M151,238 H166 L230,172" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="176" y="216" font-size="10" fill="var(--ink)">1</text>
        <text x="158" y="252" font-size="9" fill="var(--faint)">Ø 80 · K1 = 79</text>
        <line x1="184" y1="212" x2="206" y2="190" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m319l)"/>
        <circle cx="234" cy="170" r="4" fill="var(--live)"/>
        <text x="228" y="162" text-anchor="end" font-size="11" fill="var(--ink)">N</text>
        <path d="M236,166 L245,94" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="248" y="130" font-size="10" fill="var(--ink)">3</text>
        <text x="248" y="142" font-size="9" fill="var(--faint)">Ø 125</text>
        <line x1="240" y1="150" x2="243" y2="118" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m319l)"/>
        <path d="M336,124 H312" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="300" cy="130" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="294" y="156" font-size="10" fill="var(--ink)">B2</text>
        <path d="M290,134 L238,168" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="268" y="166" font-size="10" fill="var(--ink)">2</text>
        <text x="278" y="178" font-size="9" fill="var(--faint)">Ø 100</text>
        <line x1="284" y1="140" x2="258" y2="157" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m319l)"/>
        <line x1="120" y1="60" x2="190" y2="60" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="120" y1="100" x2="330" y2="100" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="120" y1="220" x2="180" y2="220" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="116" y="64" text-anchor="end" font-size="9" fill="var(--faint)">40</text>
        <text x="116" y="104" text-anchor="end" font-size="9" fill="var(--faint)">35</text>
        <text x="116" y="224" text-anchor="end" font-size="9" fill="var(--faint)">20</text>
      </svg>
      <figcaption>Las tres cotas a escala. C está cerrado y presurizado, así que su energía no es su cota: los 0,86 kilos añaden diez metros más de hidrocarburo.</figcaption>
      </figure>
    pide: La altura de B1, el Bernoulli en N, la potencia perdida en 1, el factor de paso de 2 y la pérdida de 3.
    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito C está cerrado y su manómetro marca 0,86 kg/cm². ¿Cuánto
          vale su altura de Bernoulli, en metros de columna de hidrocarburo?
        opciones:
          - texto: 50 mch, porque a los 40 de cota hay que sumarle los 0,86 kg/cm² pasados a columna del propio hidrocarburo
            correcta: true
            mensaje: |
              Eso es, y el número no es casual: $0{,}86$ kg/cm² son 8,6 mca, y
              como el hidrocarburo tiene precisamente $s = 0{,}86$, esos 8,6
              metros de agua son 10 metros de hidrocarburo. La coincidencia es
              del enunciado, no de la física.
          - texto: 48,6 mch, los 40 de cota más los 8,6 mca del manómetro
            mensaje: |
              Has mezclado unidades. El Bernoulli se está escribiendo en metros
              de columna de **hidrocarburo**, así que los 8,6 mca hay que
              convertirlos: $8{,}6/0{,}86 = 10$ mch.
          - texto: 40 mch, porque el manómetro mide la presión del gas y esa no es energía del líquido
            mensaje: |
              Sí lo es: la presión del gas se transmite a la lámina y desde ahí
              a todo el líquido. Un depósito presurizado tiene más energía
              disponible que uno abierto a la misma cota, y por eso cuesta más
              bombear hacia él.

      - tipo: calcular
        titulo: La altura de la primera bomba
        pregunta: |
          Altura manométrica de $B_1$, en metros de columna de hidrocarburo.
          Absorbe 2320 W con rendimiento 0,8 y por ella pasan 5 l/s.
        respuesta:
          tipo: magnitud
          valor: '44.04 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '55.05 m'
            mensaje: |
              Has usado la potencia absorbida entera. La que llega al fluido es
              la útil: $2\,320 \cdot 0{,}8 = 1\,856$ W.
          - valor: '37.87 m'
            mensaje: |
              Has usado el peso específico del agua. El líquido es un
              hidrocarburo de 860 kg/m³:
              $\gamma = 860 \cdot 9{,}8 = 8\,428$ N/m³.
          - valor: '14.68 m'
            mensaje: |
              Has usado los 15 l/s del caudal total. Por $B_1$ solo pasan los
              5 l/s que marca el caudalímetro de A; los otros 10 llegan por la
              tubería 2.
        pista: |
          $P_{útil} = \eta\,P_{abs}$ y $P_{útil} = \gamma\,Q_1 H_m$.
        desarrollo: |
          $$
          H_m = \frac{0{,}8 \cdot 2\,320}{860 \cdot 9{,}8 \cdot 0{,}005} = \frac{1\,856}{42{,}14} = 44{,}04\ \text{mch}
          $$

      - tipo: calcular
        titulo: La pérdida de la tubería 1
        pregunta: |
          Pérdida de carga en la tubería 1, en metros de columna de
          hidrocarburo. Es de 80 mm y su factor de paso vale 79.
        respuesta:
          tipo: magnitud
          valor: '3.99 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '78.2 m'
            mensaje: |
              Has multiplicado por la velocidad al cuadrado sin dividir entre
              $2g$. El factor de paso multiplica la **altura** de velocidad,
              $V^{2}/2g$, no $V^{2}$.
          - valor: '35.9 m'
            mensaje: |
              Has usado los 15 l/s. Por la tubería 1 pasan 5, y como la pérdida
              va con el cuadrado de la velocidad, usar el triple de caudal la
              multiplica por nueve.
        pista: |
          $V_1 = Q_1/A_1$ con $A_1 = \pi \cdot 0{,}08^{2}/4$, y
          $h_{f1} = K_1 V_1^{2}/2g$.
        desarrollo: |
          $$
          V_1 = \frac{0{,}005}{5{,}027\cdot 10^{-3}} = 0{,}995\ \text{m/s} \qquad h_{f1} = 79 \cdot \frac{0{,}995^{2}}{19{,}6} = 3{,}99\ \text{mch}
          $$

      - tipo: calcular
        titulo: El Bernoulli en el nudo
        pregunta: |
          Altura de Bernoulli en el nudo N, en metros de columna de
          hidrocarburo.
        respuesta:
          tipo: magnitud
          valor: '60.05 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m)
        distractores:
          - valor: '68.03 m'
            mensaje: |
              Has sumado la pérdida en vez de restarla. La tubería 1 va de A
              hacia N: por el camino se pierde, así que N tiene menos energía
              de la que la bomba entrega.
          - valor: '64.04 m'
            mensaje: |
              Te has dejado la pérdida de la tubería 1. Son casi 4 metros: no es
              un detalle.
          - valor: '50 m'
            mensaje: |
              Ese es el Bernoulli del depósito C. N está aguas arriba de él y
              tiene que estar más alto en energía, porque de N a C todavía se
              pierde algo por la tubería 3.
        pista: |
          $B_N = z_A + H_{m1} - h_{f1}$, con el depósito A abierto y quieto.
        desarrollo: |
          $$
          B_N = 20 + 44{,}04 - 3{,}99 = 60{,}05\ \text{mch}
          $$

      - tipo: calcular
        titulo: El factor de paso de la tubería 2
        pregunta: |
          Factor de paso $K_2$ de la tubería 2, de 100 mm, si $B_2$ aporta 30
          mch. Por ella pasan los 10 l/s que faltan.
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '26.6'
            mensaje: |
              Has usado los 15 l/s. Por la tubería 2 pasan
              $15 - 5 = 10$ l/s: el resto lo aporta la rama de A. Y fíjate en
              qué dirección se equivoca: con más caudal la altura de velocidad
              crece, así que el factor que hace falta para perder los mismos
              4,95 m sale **menor**.
          - valor: '4.94'
            mensaje: |
              Ese es $h_{f2}$ en metros, no el factor. Falta dividirlo entre la
              altura de velocidad, $V_2^{2}/2g = 0{,}0827$ m.
          - valor: '120.2'
            mensaje: |
              Has tomado la cota de B como 40, que es la de C. B está en la 35:
              cinco metros menos de partida son cinco metros menos que perder,
              y el factor se dobla con creces.
        pista: |
          $z_B + H_{m2} - h_{f2} = B_N$, y después
          $K_2 = h_{f2}/(V_2^{2}/2g)$.
        desarrollo: |
          $$
          h_{f2} = 35 + 30 - 60{,}05 = 4{,}95\ \text{mch} \qquad V_2 = \frac{0{,}010}{7{,}854\cdot 10^{-3}} = 1{,}273\ \text{m/s}
          $$

          $$
          K_2 = \frac{4{,}95}{1{,}273^{2}/19{,}6} = \frac{4{,}95}{0{,}0827} = 60
          $$

      - tipo: calcular
        titulo: La pérdida de la tubería 3, en agua
        pregunta: |
          Pérdida de carga en la tubería 3, expresada en metros de columna de
          **agua**.
        respuesta:
          tipo: magnitud
          valor: '8.65 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '10.05 m'
            mensaje: |
              Ese es el valor en metros de columna de hidrocarburo. El enunciado
              lo pide en agua: se multiplica por 0,86, porque hace falta menos
              altura de un líquido más pesado para la misma presión.
          - valor: '11.69 m'
            mensaje: |
              Has dividido entre 0,86 en vez de multiplicar. El agua pesa más,
              así que la misma energía es **menos** metros de agua que de
              hidrocarburo.
          - valor: '20.05 m'
            mensaje: |
              Has tomado la cota de C como 40 sin sumarle la presión del
              manómetro. El depósito está cerrado: su Bernoulli es 50 mch.
        pista: |
          $h_{f3} = B_N - B_C$ en mch, y después se pasa a agua multiplicando
          por 0,86.
        desarrollo: |
          $$
          B_C = 40 + \frac{0{,}86 \cdot 10}{0{,}86} = 50\ \text{mch} \qquad h_{f3} = 60{,}05 - 50 = 10{,}05\ \text{mch}
          $$

          $$
          h_{f3} = 10{,}05 \cdot 0{,}86 = 8{,}65\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del sistema. Una pieza es falsa.
        piezas:
          - texto: 'El caudalímetro reparte el problema: 5 l/s por la rama de A y los 10 restantes por la de B, porque en N confluyen los dos.'
          - texto: 'La rama de A está entera resuelta: cota, bomba y pérdida dan el Bernoulli de N, 60,05 mch, y ese número es el que ata las otras dos ramas.'
          - texto: 'El depósito C, presurizado, tiene un Bernoulli de 50 mch aunque su cota sea 40, y por eso la tubería 3 solo puede perder 10,05 mch.'
          - texto: 'Como las tres tuberías llevan el mismo líquido, sus pérdidas se pueden sumar directamente en mca sin convertir nada.'
            trampa: true
            mensaje: |
              Llevan el mismo líquido, pero el enunciado mezcla unidades a
              propósito: da la altura de $B_2$ en metros de hidrocarburo y pide
              la pérdida de la 3 en metros de agua. Mientras se trabaja en
              **una sola** columna todo se suma; en cuanto aparece la otra hay
              que multiplicar o dividir por 0,86, y ahí es donde se pierden los
              puntos.
    resolucion: |
      **El reparto de caudales, que es lo primero.** Por la rama de A pasan los
      5 l/s del caudalímetro, y como en N confluyen las dos y salen 15, por la
      rama de B pasan 10. Eso ya divide el problema en tres tramos
      independientes.

      **La rama de A, entera** (a, c y b). La bomba entrega
      $0{,}8 \cdot 2\,320 = 1\,856$ W útiles a 5 l/s de un líquido de
      $\gamma = 8\,428$ N/m³:

      $$
      H_{m1} = \frac{1\,856}{8\,428 \cdot 0{,}005} = 44{,}04\ \text{mch} \qquad h_{f1} = 79\,\frac{0{,}995^{2}}{19{,}6} = 3{,}99\ \text{mch}
      $$

      $$
      P_{perdida,1} = \gamma\,Q_1 h_{f1} = 8\,428 \cdot 0{,}005 \cdot 3{,}99 = 168\ \text{W} \qquad B_N = 20 + 44{,}04 - 3{,}99 = 60{,}05\ \text{mch}
      $$

      **La rama de B** (d). Con $B_N$ conocido, la ecuación se vuelve
      inmediata:

      $$
      h_{f2} = 35 + 30 - 60{,}05 = 4{,}95\ \text{mch} \qquad K_2 = \frac{4{,}95}{1{,}273^{2}/19{,}6} = 60
      $$

      **La tubería 3** (e). Aquí está la única trampa del problema: C no está
      abierto.

      $$
      B_C = 40 + 10 = 50\ \text{mch} \qquad h_{f3} = 60{,}05 - 50 = 10{,}05\ \text{mch} = 8{,}65\ \text{mca}
      $$

      Los cinco coinciden con el boletín: 44,04 mch; 60,04 mch; 168,56 W; 60;
      8,6 mca.

      **La coincidencia que conviene ver, para no aprendérsela mal.** El
      manómetro de C marca 0,86 kg/cm², que son 8,6 mca; y como el hidrocarburo
      tiene $s = 0{,}86$, esos 8,6 metros de agua son exactamente 10 metros de
      hidrocarburo. Es una casualidad del enunciado —los dos 0,86 no tienen
      nada que ver entre sí— y está puesta para que se note quién convierte y
      quién copia el número.
  - id: ejflu12-col320-una-turbina-una-bomba-y-un-nudo-que-recibe-por-los-dos-lados
    titulo: Una turbina, una bomba y un nudo que recibe por los dos lados
    fuente: Ejercicio 3.20 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene la instalación de la figura con el fin de vehicular agua desde un
      depósito superior A a uno inferior B, ambos abiertos a la atmósfera,
      pasando por una turbina de Potencia bruta = 40 kW. A continuación se puede
      observar una instalación de bombeo, teniendo la bomba una
      $Pot_B^{bruta}$ = 80 kW y $\eta_B$ = 75 %. Se pide:

      a) Caudal que llega al depósito inferior (B).

      b) Suponiendo que el caudal bombeado sea Q = 210 l/s, hallar la altura
      manométrica o útil de la bomba.

      c) Bernoulli en el nudo N.

      d) Caudal que sale por la boquilla de riego y el de la tubería 6,
      indicando el sentido del flujo.

      e) Diámetro de la boquilla.

      f) Potencia del chorro a la salida de la boquilla.

      Datos: $h_{f1}$ = 0,3 kg/cm²; $h_{f2}$ = 2,75 mcl (s = 0,8); $K_3$ = 4;
      $\varnothing_3$ = 400 mm; $Pot_4^{perdida}$ = 2 kW; $P_D$ = 294 kPa;
      $K_{boquilla}$ = 0,1; $K_5$ = 8; $\varnothing_5$ = 450 mm;
      $Pot_6^{perdida}$ = 3 kW. Las cotas vienen expresadas en metros.

