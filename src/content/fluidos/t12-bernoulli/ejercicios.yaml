        en la cota 200, y la 3, que llega al nudo D. De D salen la 4, que sube
        al depósito abierto F en la cota 250, y la 5, que va al depósito
        presurizado E, en la cota 210 y con 30 metros de columna de presión.
        Junto a cada tubería figura su pérdida.</desc>
        <defs>
          <marker id="m34l" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <rect x="14" y="30" width="86" height="30" fill="var(--live)" opacity="0.15"/>
        <path d="M14,30 v30 h86 v-30" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="14" y1="30" x2="100" y2="30" stroke="var(--live)" stroke-width="1.4"/>
