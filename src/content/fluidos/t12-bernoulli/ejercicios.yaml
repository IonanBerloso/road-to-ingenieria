        <text x="140" y="98" font-size="10" fill="var(--ink)">1</text>
        <text x="156" y="126" text-anchor="end" font-size="9" fill="var(--faint)">Ø 200 · pierde 1 kW</text>
        <line x1="150" y1="84" x2="172" y2="112" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m317l)"/>
        <path d="M220,58 L196,132" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="212" y="98" font-size="10" fill="var(--ink)">2</text>
        <text x="222" y="112" font-size="9" fill="var(--faint)">Ø 150 · K2 = 13,328</text>
        <line x1="212" y1="84" x2="202" y2="114" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m317l)"/>
        <circle cx="192" cy="136" r="4" fill="var(--live)"/>
        <text x="184" y="132" text-anchor="end" font-size="11" fill="var(--ink)">N</text>
        <path d="M192,140 L246,222" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <text x="204" y="184" font-size="10" fill="var(--ink)">3</text>
        <text x="150" y="200" font-size="9" fill="var(--faint)">Ø 300 · K3 = 9,8</text>
        <line x1="212" y1="170" x2="230" y2="198" stroke="var(--live)" stroke-width="1.8" marker-end="url(#m317l)"/>
        <circle cx="256" cy="230" r="13" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
        <text x="240" y="256" text-anchor="end" font-size="10" fill="var(--ink)">turbina</text>
        <path d="M269,230 H310" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="292" cy="204" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="292" y1="215" x2="292" y2="230" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="292" y="190" text-anchor="middle" font-size="11" fill="var(--ink)">D</text>
        <path d="M310,220 L336,224 L336,236 L310,240 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="340" y1="230" x2="382" y2="230" stroke="var(--live)" stroke-width="2" marker-end="url(#m317l)"/>
        <text x="340" y="220" font-size="9" fill="var(--faint)">E · Ø 100</text>
        <line x1="410" y1="32" x2="410" y2="228" stroke="var(--faint)" stroke-width="1" marker-start="url(#m317n)" marker-end="url(#m317n)"/>
        <line x1="334" y1="30" x2="414" y2="30" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="386" y1="230" x2="414" y2="230" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="414" y="134" font-size="10" fill="var(--faint)">100 m</text>
        <text x="386" y="248" font-size="9" fill="var(--faint)">cota 10</text>
      </svg>
      <figcaption>Las dos láminas están a la misma altura, cien metros sobre la boquilla. Por eso los dos depósitos pierden lo mismo hasta el nudo — y por eso el que tiene la tubería más estrecha aporta menos caudal.</figcaption>
      </figure>
    pide: El caudal de B, el de la maestra, la altura y potencia de la turbina y la presión a su salida.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos láminas están a la misma cota y las dos tuberías llegan al
          mismo nudo. ¿Qué se sigue de eso?
        opciones:
          - texto: Que las dos pierden exactamente lo mismo hasta el nudo, aunque lleven caudales distintos
            correcta: true
            mensaje: |
              Eso es. El Bernoulli en N es uno solo, y las dos ramas parten de
              la misma energía: $z_A - h_{f1} = B_N = z_B - h_{f2}$, luego
              $h_{f1} = h_{f2}$. Esa igualdad es la que da el caudal de B sin
              conocer todavía nada más.
          - texto: Que los dos aportan el mismo caudal, 50 l/s cada uno
            mensaje: |
              Aportarían lo mismo si las dos tuberías fueran iguales, y no lo
              son: la 1 tiene 200 mm y la 2, 150. Con la misma pérdida, la más
              estrecha deja pasar menos.
          - texto: Que la energía en el nudo es 110 mca, la cota de las láminas
            mensaje: |
              Eso sería si no se perdiera nada por el camino. La tubería 1
              disipa 1 kW, que a 50 l/s son algo más de dos metros: el nudo
              queda por debajo de las láminas.

      - tipo: calcular
        titulo: La pérdida que comparten
        pregunta: |
          Pérdida de carga en la tubería 1, en mca. Disipa 1 kW llevando
          50 l/s.
        respuesta:
          tipo: magnitud
          valor: '2.04 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '20.4 m'
            mensaje: |
              Te has equivocado en una potencia de diez al pasar los litros a
              metros cúbicos. 50 l/s son 0,050 m³/s.
          - valor: '0.208 m'
            mensaje: |
              Has dividido además entre $g$. El peso específico ya es peso por
              volumen: $h_f = P/(\gamma Q)$ y nada más.
        pista: |
          $P_{perdida} = \gamma\,Q\,h_f$.
        desarrollo: |
          $$
          h_{f1} = \frac{1\,000}{9\,800 \cdot 0{,}050} = 2{,}04\ \text{mca}
          $$

      - tipo: calcular
        titulo: El caudal del depósito B
        pregunta: |
          Caudal $Q_2$ que aporta el depósito B, por una tubería de 150 mm con
          factor de paso 13,328.
        respuesta:
          tipo: magnitud
          valor: '30.6 l/s'
          tolerancia: 0.01
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '54.4 l/s'
            mensaje: |
              Has usado la sección de la tubería 1, de 200 mm. La 2 es de 150 y
              su área es la mitad y pico.
          - valor: '50 l/s'
            mensaje: |
              Has supuesto que las dos ramas llevan lo mismo. Lo que comparten
              es la **pérdida**, no el caudal: con la misma pérdida, la tubería
              más estrecha lleva menos.
          - valor: '6.91 l/s'
            mensaje: |
              Te has dejado el $2g$ al despejar la velocidad de
              $h_f = K V^{2}/2g$.
        pista: |
          $h_{f2} = h_{f1} = 2{,}04$ m, y de $h_{f2} = K_2 V_2^{2}/2g$ sale
          $V_2$; después $Q_2 = V_2 A_2$.
        desarrollo: |
          $$
          \frac{V_2^{2}}{2g} = \frac{2{,}04}{13{,}328} = 0{,}1531\ \text{m} \qquad V_2 = 1{,}733\ \text{m/s}
          $$

          $$
          Q_2 = 1{,}733 \cdot \frac{\pi \cdot 0{,}15^{2}}{4} = 0{,}0306\ \text{m}^{3}\text{/s}
          $$

          Y la maestra lleva $Q_3 = 50 + 30{,}6 = 80{,}6$ l/s.

      - tipo: calcular
        titulo: La altura de la turbina
        pregunta: |
          Altura puesta a disposición de la turbina, en mca. La boquilla, de
          100 mm, descarga a la atmósfera en la cota 10 y sus pérdidas se
          desprecian.
        respuesta:
          tipo: magnitud
          valor: '91.93 m'
          tolerancia: 0.01
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '97.31 m'
            mensaje: |
              Te has dejado la altura de velocidad del chorro. El agua sale a
              10,26 m/s y se lleva 5,37 m que la turbina no aprovecha: es la
              energía que se va por la boquilla.
          - valor: '101.94 m'
            mensaje: |
              Has tomado la boquilla en la cota cero. Está en la 10: los
              depósitos están cien metros por encima de ella, no ciento diez.
          - valor: '81.93 m'
            mensaje: |
              Has restado los 10 m dos veces. La cota de la salida entra una
              sola vez, dentro de su Bernoulli.
        pista: |
          $B_N = 110 - 2{,}04$; de ahí se resta $h_{f3}$ y el Bernoulli de la
          salida, $10 + V_E^{2}/2g$.
        desarrollo: |
          $$
          V_3 = \frac{0{,}0806}{\pi \cdot 0{,}3^{2}/4} = 1{,}140\ \text{m/s} \qquad h_{f3} = 9{,}8 \cdot \frac{1{,}140^{2}}{19{,}6} = 0{,}65\ \text{m}
          $$

          $$
          V_E = \frac{0{,}0806}{\pi \cdot 0{,}1^{2}/4} = 10{,}26\ \text{m/s} \qquad \frac{V_E^{2}}{2g} = 5{,}37\ \text{m}
          $$

          $$
          H_t = (110 - 2{,}04) - 0{,}65 - (10 + 5{,}37) = 91{,}93\ \text{mca}
          $$

      - tipo: calcular
        titulo: La potencia y el manómetro
        pregunta: |
          Presión que indicará el manómetro D, a la salida de la turbina, en
          kPa. Está sobre la tubería de 300 mm, en la cota 10.
        respuesta:
          tipo: magnitud
          valor: '52 kPa'
          tolerancia: 0.01
          formato: una presión con su unidad (kPa, Pa o mca)
        distractores:
          - valor: '52.7 kPa'
            mensaje: |
              Te has dejado la altura de velocidad de la tubería de 300 mm. Es
              pequeña, 0,066 m, pero el manómetro mide presión, no Bernoulli.
          - valor: '150 kPa'
            mensaje: |
              Has olvidado que el punto D está en la cota 10 y la boquilla
              también: lo que queda de energía es lo que se convierte en
              velocidad, no una altura de 15,37 m de presión.
        pista: |
          Después de la turbina no hay pérdidas, así que $B_D = B_E$; y
          $B_D = 10 + p_D/\gamma + V_3^{2}/2g$.
        desarrollo: |
          $$
          B_E = 10 + 5{,}37 = 15{,}37\ \text{mca} \qquad \frac{p_D}{\gamma} = 15{,}37 - 10 - 0{,}066 = 5{,}31\ \text{m}
          $$

          $$
          p_D = 5{,}31 \cdot 9\,800 = 52\,000\ \text{Pa} = 52\ \text{kPa}
          $$

          Y la potencia útil de la turbina es
          $0{,}9 \cdot 9\,800 \cdot 0{,}0806 \cdot 91{,}93 = 65{,}36$ kW.

      - tipo: justificar
        pregunta: Ordena el razonamiento de la instalación. Una pieza es falsa.
        piezas:
          - texto: 'Las dos láminas están a la misma cota, así que las dos ramas pierden lo mismo hasta el nudo: 2,04 mca cada una.'
          - texto: 'Con esa pérdida y su factor de paso, la tubería 2 aporta 30,6 l/s, y la maestra lleva 80,6.'
          - texto: 'La turbina aprovecha lo que queda tras descontar las pérdidas y la energía cinética que el chorro se lleva por la boquilla.'
          - texto: 'Como el manómetro D está justo detrás de la turbina y allí ya no hay pérdidas, marcará cero: toda la energía se la ha llevado la turbina.'
            trampa: true
            mensaje: |
              La turbina se lleva la energía **aprovechable**, no toda: detrás
              queda lo justo para que el agua salga por la boquilla a 10,26
              m/s. En la tubería de 300 mm esa misma energía es casi toda
              presión, 52 kPa, porque allí el agua todavía va despacio.
    resolucion: |
      **La igualdad que abre el problema.** A y B están a la misma cota y las
      dos tuberías mueren en el mismo nudo, así que

      $$
      z_A - h_{f1} = B_N = z_B - h_{f2} \;\Longrightarrow\; h_{f1} = h_{f2}
      $$

      y esa pérdida se conoce, porque la tubería 1 lleva un caudal dado:

      $$
      h_{f1} = \frac{1\,000}{9\,800 \cdot 0{,}050} = 2{,}04\ \text{mca}
      $$

      **El caudal de B** (a y b). Con la misma pérdida y su propio factor:

      $$
      \frac{V_2^{2}}{2g} = \frac{2{,}04}{13{,}328} \;\Longrightarrow\; V_2 = 1{,}733\ \text{m/s} \qquad Q_2 = 30{,}6\ \text{l/s} \qquad Q_3 = 80{,}6\ \text{l/s}
      $$

      **La turbina** (c y d).

      $$
      H_t = (110 - 2{,}04) - 0{,}65 - (10 + 5{,}37) = 91{,}93\ \text{mca} \qquad P = 0{,}9 \cdot 9\,800 \cdot 0{,}0806 \cdot 91{,}93 = 65{,}36\ \text{kW}
      $$

      **El manómetro** (e). Tras la turbina no hay pérdidas, así que su
      Bernoulli es el de la salida:

      $$
      \frac{p_D}{\gamma} = 15{,}37 - 10 - 0{,}066 = 5{,}31\ \text{m} \qquad p_D = 52\ \text{kPa}
      $$

      Los cinco coinciden con el boletín.

      **Lo que conviene mirar dos veces.** La boquilla se lleva 5,37 m de los
      108 disponibles: casi el 5 %, y eso es energía que la turbina no ve.
      Ensanchar la boquilla la recuperaría casi entera —con 200 mm serían 0,34
      m— y ese es exactamente el criterio con el que se dimensiona el tubo de
      aspiración de una turbina real.
  - id: ejflu12-col318-la-bomba-que-dice-su-propio-caudal
    titulo: La bomba que dice su propio caudal
    fuente: Ejercicio 3.18 · Colección de problemas, capítulo 3 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Por la instalación de la figura circula un combustible de peso específico
      relativo $s = 0{,}8$, que mediante una bomba suministra combustible a un
      quemador pulverizador C. La bomba instalada es de 100 kW de potencia
      bruta, con un rendimiento del 75 %. Los manómetros instalados a la entrada
      y salida de la bomba, A y S, marcan 0,6 y 9,6 kg/cm², respectivamente. Se
      pide:

      a) Caudales circulantes por todas las tuberías indicando los sentidos de
      circulación.

      b) Cota del quemador C.

      c) Presión que marcará el manómetro del depósito presurizado D expresada
      en kg/cm² y en kPa.

      Datos:

      - Potencia perdida en la tubería 4 (desde la bomba hasta C) = 5,15 kW.
      - Pérdida de carga en la tubería 3 (desde N hasta la bomba) = 5,35 mca.
      - Potencia perdida en la tubería 1 = 6,3 kW.
      - Factor de paso de la tubería 2 = 8.
      - Cotas expresadas en metros.
      - Diámetro del quemador = 50 mm.

