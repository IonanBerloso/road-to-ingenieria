ejercicios:
  # ── NUESTROS (§08). Dan la curva de la bomba como expresión analítica —que
  #    es como la dan los propios exámenes— y aíslan las dos cuentas que se
  #    repiten en todo el capítulo 9: el punto de funcionamiento y el NPSH.
  #
  #    CORRECCIÓN del 31 de agosto de 2026: aquí decía que los problemas del
  #    capítulo 9 no se podían transcribir porque sus curvas de catálogo «no
  #    entran en el repositorio». Era falso por dos motivos. Las curvas están
  #    en el propio PDF de la colección —anexos, páginas 205 a 216— y se leen
  #    perfectamente extrayendo la imagen. Y §08 no prohíbe usarlas: prohíbe
  #    recortarlas, y manda redibujarlas, que es lo que se hace en el 9.5 de
  #    más abajo.
  - id: ejflu25-el-punto-de-funcionamiento
    titulo: Dónde acaba trabajando la bomba, y lo que cuesta cerrar una válvula
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una instalación de bombeo de agua tiene por curva característica

      $$
      H_{mi} = 42 + 8\cdot 10^{-4}\,Q^{2}
      $$

      y la bomba elegida,

      $$
      H_b = 70 - 2{,}5\cdot 10^{-3}\,Q^{2}
      $$

      con $H$ en metros y $Q$ en l/s. El rendimiento de la bomba en la zona de
      trabajo es del $78\ \%$.

      a) Calcular el caudal y la altura del punto de funcionamiento.

      b) Calcular la potencia absorbida.

      c) El proceso solo necesita $70\ \text{l/s}$. Calcular la pérdida de
      carga que debe introducir la válvula de regulación.
    pide: El punto de funcionamiento, la potencia absorbida y la pérdida de la válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el punto de funcionamiento es la intersección de las dos
          curvas?
        opciones:
          - texto: >-
              Porque la altura que la instalación necesita y la que la bomba da
              son conceptos distintos, pero tienen que valer lo mismo cuando
              esa bomba trabaja en esa instalación
            correcta: true
            mensaje: |
              Eso es, y merece la pena tener las dos ideas separadas: la
              $H_{mi}$ es lo que hace falta para trasegar un caudal, la $H_b$
              es lo que la máquina entrega a ese caudal. Solo coinciden en un
              punto, y ahí se instala el sistema.
          - texto: >-
              Porque es el punto de máximo rendimiento de la bomba
            mensaje: |
              No tiene por qué serlo, y de hecho casi nunca lo es. Al
              seleccionar se intenta que el punto resultante no quede lejos del
              nominal, pero el cruce lo decide la instalación, no el
              rendimiento.
          - texto: >-
              Porque es donde la pérdida de carga iguala a la altura
              geométrica
            mensaje: |
              Eso sería una coincidencia sin significado. Lo que se iguala en
              el punto de funcionamiento son las **dos alturas manométricas**,
              no dos de los sumandos de una de ellas.

      - tipo: calcular
        titulo: El caudal
        pregunta: |
          ¿Qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '92.11 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '105.8 l/s'
            mensaje: |
              Has igualado la curva de la bomba a los 42 m, olvidando que la
              instalación también pierde carga. Los dos términos en $Q^{2}$ se
              suman al despejar: $(8\cdot 10^{-4} + 2{,}5\cdot 10^{-3})Q^{2} = 28$.
          - valor: '145.6 l/s'
            mensaje: |
              Te has dejado la altura piezométrica de la instalación, los 42 m.
              Es lo que hay que vencer aunque el caudal sea cero, y es
              justamente lo que hace que la instalación no pueda tragar el
              caudal máximo de la bomba.
        pista: |
          Iguala las dos expresiones y agrupa los términos en $Q^{2}$.
        desarrollo: |
          $$
          42 + 8\cdot 10^{-4}Q^{2} = 70 - 2{,}5\cdot 10^{-3}Q^{2}
          $$
          $$
          3{,}3\cdot 10^{-3}\,Q^{2} = 28
          \;\Longrightarrow\;
          Q^{2} = 8485
          \;\Longrightarrow\;
          Q = 92{,}1\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura
        pregunta: |
          ¿Qué altura manométrica corresponde a ese caudal?
        respuesta:
          tipo: magnitud
          valor: '48.79 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '42 m'
            mensaje: |
              Esa es la altura piezométrica, la que pide la instalación a
              caudal **nulo**. Con 92 l/s circulando hay además pérdidas de
              carga que vencer.
          - valor: '70 m'
            mensaje: |
              Esa es la altura de la bomba a caudal nulo, es decir con la
              impulsión cerrada del todo. Con caudal, la bomba da menos.
        pista: |
          Sustituye el caudal en cualquiera de las dos curvas: tienen que dar
          lo mismo.
        desarrollo: |
          $$
          H = 42 + 8\cdot 10^{-4}\cdot 8485 = 48{,}8\ \text{m}
          $$

          Y por la otra:
          $70 - 2{,}5\cdot 10^{-3}\cdot 8485 = 48{,}8\ \text{m}$. Coinciden, que
          es la comprobación de que el despeje está bien.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia pide la bomba al motor?
        respuesta:
          tipo: magnitud
          valor: '56.46 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '44.04 kw'
            mensaje: |
              Esa es la potencia **útil**, la que recibe el agua. La absorbida
              incluye lo que se pierde en la máquina: hay que dividir entre el
              rendimiento, no dejarlo así.
          - valor: '34.35 kw'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. La
              absorbida es siempre mayor que la útil.
        pista: |
          $P_a = \gamma\,Q\,H/\eta$, con el caudal en m³/s.
        desarrollo: |
          $$
          P_u = 9800\cdot 0{,}0921\cdot 48{,}8 = 44{,}0\ \text{kW}
          \qquad
          P_a = \frac{44{,}0}{0{,}78} = 56{,}5\ \text{kW}
          $$

      - tipo: calcular
        titulo: La pérdida de la válvula
        pregunta: |
          Para bajar a 70 l/s, ¿qué pérdida tiene que introducir la válvula?
        respuesta:
          tipo: magnitud
          valor: '11.83 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '57.75 m'
            mensaje: |
              Esa es la altura que da la bomba a 70 l/s, no lo que sobra. Hay
              que restarle lo que la instalación necesita a ese mismo caudal,
              45,92 m.
          - valor: '3.92 m'
            mensaje: |
              Esa es la pérdida de carga de la instalación a 70 l/s, que ya
              está contada dentro de su curva. La válvula tiene que disipar la
              **diferencia** entre lo que la bomba da y lo que la instalación
              pide a ese caudal.
        pista: |
          A 70 l/s, calcula lo que da la bomba y lo que pide la instalación. La
          válvula se come la diferencia.
        desarrollo: |
          $$
          H_b(70) = 70 - 2{,}5\cdot 10^{-3}\cdot 4900 = 57{,}75\ \text{m}
          $$
          $$
          H_{mi}(70) = 42 + 8\cdot 10^{-4}\cdot 4900 = 45{,}92\ \text{m}
          $$
          $$
          h_{f,\text{válvula}} = 57{,}75 - 45{,}92 = 11{,}8\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              Igualando las dos curvas sale el punto de funcionamiento: 92,1
              l/s y 48,8 m, que la bomba da y la instalación necesita a la vez.
          - texto: >-
              Ahí la potencia absorbida es de 56,5 kW, un 28 % más que la que
              llega al agua.
          - texto: >-
              Para bajar a 70 l/s hay que cerrar una válvula que disipe 11,8 m,
              es decir 8,1 kW tirados a la basura.
          - texto: >-
              Esa válvula conviene colocarla en la aspiración, para que la
              bomba trabaje ya con el caudal reducido desde el principio.
            trampa: true
            mensaje: |
              Nunca en la aspiración: esa pérdida entra directamente en el
              NPSH disponible y acerca la bomba a la cavitación. La válvula de
              regulación va **siempre en la impulsión**, donde frena el caudal
              igual sin tocar la aspiración.

    resolucion: |
      **El punto de funcionamiento.** Igualando las dos curvas:

      $$
      3{,}3\cdot 10^{-3}\,Q^{2} = 28
      \;\Longrightarrow\;
      Q = 92{,}1\ \text{l/s}
      \qquad
      H = 48{,}8\ \text{m}
      $$

      Comprobado por las dos expresiones, que es como se sabe que el despeje
      está bien.

      **La potencia.**

      $$
      P_a = \frac{9800\cdot 0{,}0921\cdot 48{,}8}{0{,}78} = 56{,}5\ \text{kW}
      $$

      **La válvula.** A 70 l/s la bomba da 57,75 m y la instalación pide 45,92:
      la válvula tiene que disipar **11,8 m**.

      **Y lo que eso significa en dinero**, que es lo que la colección pregunta
      una y otra vez:

      $$
      P_{\text{tirada}} = 9800\cdot 0{,}07\cdot 11{,}8 = 8{,}1\ \text{kW}
      $$

      Ocho kilovatios convertidos en calor dentro de una válvula, de forma
      permanente. A 4500 horas al año y 0,10 €/kWh son unos **3.600 € anuales**
      quemados por estrangular.

      Esa cuenta es la razón industrial de que hoy se regule con **variador de
      frecuencia**: bajar el régimen de giro mueve la curva de la bomba en vez
      de añadir resistencia, y el caudal se reduce sin disipar nada. La válvula
      sigue siendo más barata de instalar, y más cara de tener.

  - id: ejflu25-el-npsh-y-la-cota-de-la-bomba
    titulo: Hasta qué altura se puede subir la bomba antes de que cavite
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Una bomba aspira agua a $20\ °\text{C}$ de un pozo, con su eje
      $4\ \text{m}$ por encima de la lámina libre. La tubería de aspiración
      pierde $1{,}8\ \text{m}$ al caudal de trabajo.

      El fabricante da un $NPSH_{\text{requerido}} = 2{,}8\ \text{mca}$ en ese
      punto.

      Datos: presión atmosférica $10\ \text{mca}$, presión de vapor del agua a
      20 °C $0{,}24\ \text{mca}$ (absoluta).

      a) Calcular el NPSH disponible.

      b) Calcular el NPSH de seguridad y decidir si la instalación es
      aceptable.

      c) Calcular la cota máxima a la que podría montarse la bomba.
    pide: El NPSH disponible, el de seguridad y la cota máxima admisible.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué depende cada uno de los dos NPSH?
        opciones:
          - texto: >-
              El disponible es solo de la instalación y el requerido solo de la
              máquina
            correcta: true
            mensaje: |
              Esa separación es toda la utilidad del concepto: permite comprar
              la bomba y proyectar la instalación por separado, y comprobar al
              final que encajan.
          - texto: >-
              Los dos dependen de la instalación, y el fabricante solo da un
              valor orientativo
            mensaje: |
              El requerido es la energía cinética en un punto **interior** de
              la máquina, $v_D^{2}/2g$: depende de la geometría del rodete y
              del caudal, no de dónde se monte. Por eso lo da el fabricante y
              es un dato firme.
          - texto: >-
              El disponible depende de la bomba, porque es ella la que aspira
            mensaje: |
              La bomba no «aspira» en el sentido de tirar: lo que empuja el
              agua hacia arriba es la presión atmosférica sobre el pozo. Todos
              los términos del NPSH disponible —atmosférica, presión de vapor,
              cota y pérdidas— son de la instalación.

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿Cuánto vale el NPSH disponible?
        respuesta:
          tipo: magnitud
          valor: '3.96 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '4.2 mca'
            mensaje: |
              Te falta restar la presión de vapor. El NPSH es la carga neta
              **sobre la tensión de vapor**: es lo que le sobra al líquido por
              encima del punto en el que herviría.
          - valor: '7.96 mca'
            mensaje: |
              Te falta restar la cota de aspiración. Los 4 m que la bomba está
              por encima del pozo se los tiene que ganar el agua contra la
              gravedad, y salen del mismo presupuesto.
        pista: |
          $NPSH_{\text{disp}} = p_{atm}/\gamma - p_v/\gamma - z - h_f$, todo en
          mca.
        desarrollo: |
          $$
          NPSH_{\text{disp}} = 10 - 0{,}24 - 4 - 1{,}8 = 3{,}96\ \text{mca}
          $$

      - tipo: calcular
        titulo: El NPSH de seguridad
        pregunta: |
          ¿Cuánto margen queda frente a la cavitación?
        respuesta:
          tipo: magnitud
          valor: '1.16 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '6.76 mca'
            mensaje: |
              Has sumado el requerido en vez de restarlo. La relación es
              $NPSH_{\text{disp}} = NPSH_{\text{req}} + NPSH_{\text{seg}}$: el
              margen es lo que sobra **después** de cubrir el requerido.
          - valor: '1.414 mca'
            mensaje: |
              Parece un cociente en vez de una resta. El de seguridad es una
              diferencia, en metros de columna; lo que se compara como cociente
              es el criterio $NPSH_{\text{disp}} > 1{,}3\,NPSH_{\text{req}}$,
              que es otra comprobación.
        pista: |
          Es lo que sobra del disponible después de cubrir el requerido.
        desarrollo: |
          $$
          NPSH_{\text{seg}} = 3{,}96 - 2{,}8 = 1{,}16\ \text{mca}
          $$

          Por encima del mínimo recomendado (0,5 a 0,9 mcl). Y por el otro
          criterio: $1{,}3\cdot 2{,}8 = 3{,}64 < 3{,}96$. **Cumple**, aunque no
          con mucha holgura.

      - tipo: calcular
        titulo: La cota máxima
        pregunta: |
          ¿A qué altura máxima sobre el pozo podría montarse la bomba,
          aplicando el criterio $NPSH_{\text{disp}} > 1{,}3\,NPSH_{\text{req}}$?
        respuesta:
          tipo: magnitud
          valor: '4.32 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '5.16 m'
            mensaje: |
              Has usado el requerido tal cual, sin el coeficiente 1,3. Eso
              dejaría margen cero: sería el punto en el que la bomba empieza
              justo a cavitar, no una cota de proyecto.
          - valor: '6.12 m'
            mensaje: |
              Te has dejado la pérdida de carga de la aspiración. Esos 1,8 m
              salen del mismo presupuesto que la cota, y además crecerían si
              alargaras la tubería para subir la bomba.
        pista: |
          Despeja $z$ de la fórmula del disponible, imponiendo que el
          disponible valga $1{,}3\,NPSH_{\text{req}}$.
        desarrollo: |
          $$
          z_{\max} = \frac{p_{atm}}{\gamma} - \frac{p_v}{\gamma} - h_f
          - 1{,}3\,NPSH_{\text{req}}
          $$
          $$
          z_{\max} = 10 - 0{,}24 - 1{,}8 - 3{,}64 = 4{,}32\ \text{m}
          $$

          Treinta y dos centímetros de margen sobre los 4 m actuales. Y ojo:
          subirla más obligaría a alargar la aspiración, con lo que $h_f$
          crecería y el margen real sería todavía menor.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El NPSH disponible es de la instalación: atmosférica menos tensión
              de vapor, menos cota, menos pérdidas de aspiración. Aquí 3,96 mca.
          - texto: >-
              El requerido lo da el fabricante y es de la máquina: 2,8 mca. El
              margen es la diferencia, 1,16 mca.
          - texto: >-
              Con el criterio de 1,3 veces el requerido, la cota máxima es de
              4,32 m: la instalación cumple, pero con poco margen.
          - texto: >-
              Si se bombeara el mismo caudal de agua a 75 °C, los cuatro
              términos seguirían igual y la instalación seguiría cumpliendo.
            trampa: true
            mensaje: |
              La presión de vapor del agua a 75 °C ronda los 4 mca, no 0,24. El
              disponible se hundiría hasta $10 - 4 - 4 - 1{,}8 = 0{,}2$ mca y
              la bomba cavitaría sin remedio. **La temperatura es el término
              que más se olvida y el que más manda**: por eso las bombas de
              agua caliente se montan en carga, por debajo del depósito.

    resolucion: |
      **El disponible**, que solo depende de la instalación:

      $$
      NPSH_{\text{disp}} = 10 - 0{,}24 - 4 - 1{,}8 = 3{,}96\ \text{mca}
      $$

      **El margen.** $3{,}96 - 2{,}8 = 1{,}16$ mca, por encima del mínimo
      recomendado de 0,5–0,9. Y por el criterio del cociente,
      $3{,}96 > 1{,}3\cdot 2{,}8 = 3{,}64$. Cumple.

      **La cota máxima.**

      $$
      z_{\max} = 10 - 0{,}24 - 1{,}8 - 3{,}64 = 4{,}32\ \text{m}
      $$

      **Cómo leer la fórmula, que es lo que hay que llevarse.** Los cuatro
      términos dicen qué hacer si una bomba cavita, en orden de facilidad:

      1. **bajarla**, o subir el nivel del depósito: ataca la $z$;
      2. **acortar y ensanchar la aspiración**: ataca $h_f$;
      3. **bajar el caudal**: baja $h_f$ **y** el requerido a la vez;
      4. y si nada de eso basta, cambiar de bomba por una de menor requerido.

      Y el término que no se toca pero decide: **la presión de vapor**. A 20 °C
      son 24 centímetros y no molesta; a 75 °C son unos cuatro metros y se come
      el presupuesto entero. Por eso las bombas de agua caliente —las de una
      caldera, por ejemplo— se montan **en carga**, con el depósito por encima,
      y no aspirando.

  # ── COLECCIÓN 9.5. El problema completo de instalación de bombeo, de
  #    principio a fin: curva de la instalación desde los cuadros de la
  #    escuela, selección en el anexo, punto de funcionamiento, NPSH y coste
  #    del estrangulamiento. Es el examen entero en un solo ejercicio.
  - id: ejflu25-col95-la-instalacion-completa
    titulo: Una instalación de bombeo de principio a fin
    fuente: >-
      Ejercicio 9.5 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se eleva agua de un pozo mediante una bomba, situado su eje $4\ \text{m}$
      por encima de la lámina superior de aquel. La tubería de aspiración, de
      $400\ \text{mm}$ de diámetro y $10\ \text{m}$ de longitud, consta de una
      válvula de pie y un codo de $90°$. La tubería de impulsión tiene una
      longitud de $80\ \text{m}$, un diámetro de $200\ \text{mm}$, 2 codos de
      $90°$, una válvula antirretorno, una válvula esférica de regulación, y la
      salida a la atmósfera está $10\ \text{m}$ por encima del eje de la bomba.
      Toda la tubería es de acero comercial, siendo el caudal necesario de
      $60\ \text{l/s}$. Se pide:

      a) Expresión analítica y representación gráfica de la cc de la
      instalación.

      b) Seleccionar la bomba más conveniente entre las aportadas.

      c) Caudal y altura proporcionada por la bomba seleccionada, así como la
      potencia absorbida.

      d) $NPSH_{\text{seguridad}}$ en el punto de funcionamiento.

      e) Pérdida de carga que habría que producir en la válvula esférica para
      que solo circularan $60\ \text{l/s}$. Costo horario producido por el
      maniobrado de la válvula.

      Datos: factores de paso — válvula de pie $K = 8$; codo de $90°$
      $K = 0{,}5$; válvula antirretorno $K = 2{,}5$; válvula esférica abierta
      $K = 0{,}05$; presión de vapor $= 0{,}018\ \text{kg/cm}^{2}$; precio del
      kWh $= 0{,}1$ euro.

      Documentación: curvas características de turbobombas, Anexo I de la
      colección.
    pide: La curva de la instalación, la bomba, el punto de funcionamiento, el NPSH y el coste de estrangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué parte de la curva de la instalación **no** depende del caudal?
        opciones:
          - texto: >-
              Los $14\ \text{m}$ de desnivel entre la lámina del pozo y la
              salida: $4$ hasta el eje de la bomba y $10$ por encima
            correcta: true
            mensaje: |
              Eso es la altura piezométrica de la instalación, lo que hay que
              vencer aunque no circule nada. Los dos depósitos están abiertos,
              así que no hay término de presión que sumar.
          - texto: >-
              Solo los $10\ \text{m}$ de la impulsión
            mensaje: |
              El agua también tiene que subir los $4\ \text{m}$ desde el pozo
              hasta el eje de la bomba. El desnivel total entre las dos láminas
              es de 14 m, y es lo que cuenta.
          - texto: >-
              Nada: todos los términos dependen del caudal
            mensaje: |
              La diferencia de cotas no. Es lo que hace que la curva de la
              instalación **no pase por el origen**, y por eso una bomba nunca
              puede dar caudal si su altura a caudal nulo no supera ese valor.

      - tipo: calcular
        titulo: Las pérdidas en piezas especiales
        pregunta: |
          ¿Cuánto valen las pérdidas menores al caudal de funcionamiento de
          $62{,}4\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '1.023 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.9158 m'
            mensaje: |
              Te has dejado la aspiración. Aporta poco —$0{,}11\ \text{m}$—
              porque su diámetro es doble y la velocidad cuatro veces menor,
              pero su válvula de pie tiene $K = 8$ y cuenta.
          - valor: '0.8216 m'
            mensaje: |
              Te falta la salida a la atmósfera. La energía cinética del chorro
              que descarga se pierde, y eso equivale a un $K = 1$ más en la
              impulsión.
        pista: |
          $\sum K\,v^{2}/2g$ en cada tubería. En la impulsión hay que añadir
          $K = 1$ por la salida.
        desarrollo: |
          $$
          \text{aspiración: } \sum K = 8 + 0{,}5 = 8{,}5
          \qquad
          \text{impulsión: } \sum K = 2\cdot 0{,}5 + 2{,}5 + 0{,}05 + 1 = 4{,}55
          $$

          Con $A_a = 0{,}1257$ y $A_i = 0{,}0314\ \text{m}^{2}$:

          $$
          h_{\text{menores}} = \left(8{,}5\cdot 3{,}231 + 4{,}55\cdot 51{,}69\right)Q^{2}
          = 262{,}7\,Q^{2}\ \ (Q\text{ en m}^{3}/\text{s})
          $$
          $$
          = 2{,}627\cdot 10^{-4}\,Q^{2}\ \ (Q\text{ en l/s})
          \;\Longrightarrow\;
          2{,}627\cdot 10^{-4}\cdot 62{,}4^{2} = 1{,}02\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de la instalación en el punto de funcionamiento
        pregunta: |
          ¿Cuánta altura pide la instalación a $62{,}4\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '16.58 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14 m'
            mensaje: |
              Esa es la altura a caudal **nulo**. Con 62,4 l/s circulando hay
              además $1{,}56\ \text{m}$ de pérdidas en las tuberías y
              $1{,}02$ en las piezas.
          - valor: '15.56 m'
            mensaje: |
              Te has dejado las pérdidas menores. Con cinco piezas especiales y
              una salida a la atmósfera aportan un metro largo, más de la mitad
              de lo que aportan los noventa metros de tubería.
        pista: |
          $H_{mi} = 14 + 7{,}36\cdot 10^{-4}Q^{1{,}852} +
          2{,}63\cdot 10^{-4}Q^{2}$, con $Q$ en l/s.
        desarrollo: |
          Con Hazen-Williams y los coeficientes del cuadro n.º 25
          —$C_{HW} = 140$ en la aspiración y $130$ en la impulsión, según su
          rugosidad relativa—:

          $$
          H_{mi} = 14 + 7{,}36\cdot 10^{-4}\,Q^{1{,}852}
          + 2{,}63\cdot 10^{-4}\,Q^{2}
          $$
          $$
          H_{mi}(62{,}4) = 14 + 1{,}56 + 1{,}02 = 16{,}58\ \text{m}
          $$

          Que es justamente la altura que da la bomba **INP 125/250 con rodete
          de 255 mm** a ese caudal, según el Anexo I: por eso ahí está el punto
          de funcionamiento.

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿Cuánto vale el NPSH disponible en el punto de funcionamiento?
        respuesta:
          tipo: magnitud
          valor: '6.04 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '10.04 mca'
            mensaje: |
              Te has dejado la cota de aspiración. La bomba está $4\ \text{m}$
              **por encima** del pozo, y esos cuatro metros salen del mismo
              presupuesto.
          - valor: '6.22 mca'
            mensaje: |
              Te falta la tensión de vapor. Son solo $0{,}18\ \text{mca}$
              —$0{,}018\ \text{kg/cm}^{2}$— pero el NPSH se define **sobre** la
              presión de vapor, no sobre el cero absoluto.
        pista: |
          $NPSH_{\text{disp}} = p_{atm}/\gamma - p_v/\gamma - z - h_{f,\text{asp}}$.
          Toma $p_{atm} = 10{,}33\ \text{mca}$; las pérdidas de aspiración son
          $0{,}11\ \text{m}$.
        desarrollo: |
          $$
          NPSH_{\text{disp}} = 10{,}33 - 0{,}18 - 4 - 0{,}11 = 6{,}04\ \text{mca}
          $$

          Y con el $NPSH_{\text{req}} = 2{,}8\ \text{mca}$ que se lee en el
          Anexo I para esta bomba a $225\ \text{m}^{3}/\text{h}$:

          $$
          NPSH_{\text{seg}} = 6{,}04 - 2{,}80 = 3{,}24\ \text{mca}
          $$

      - tipo: calcular
        titulo: La pérdida que debe introducir la válvula
        pregunta: |
          Para bajar a $60\ \text{l/s}$, y sabiendo que a ese caudal la bomba
          da $17{,}39\ \text{m}$, ¿qué pérdida debe introducir la válvula?
        respuesta:
          tipo: magnitud
          valor: '1 m'
          tolerancia: 0.05
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.186 m'
            mensaje: |
              Esa es la diferencia entre lo que pide la **instalación** a 62,4
              y a 60 l/s. La válvula tiene que absorber la diferencia entre lo
              que la bomba **da** y lo que la instalación **pide**, los dos al
              caudal nuevo.
          - valor: '17.39 m'
            mensaje: |
              Esa es la altura que da la bomba. Hay que restarle lo que la
              instalación necesita a ese mismo caudal, $16{,}39\ \text{m}$.
        pista: |
          Calcula $H_{mi}$ a 60 l/s y réstalo de los 17,39 m de la bomba.
        desarrollo: |
          $$
          H_{mi}(60) = 14 + 7{,}36\cdot 10^{-4}\cdot 60^{1{,}852}
          + 2{,}63\cdot 10^{-4}\cdot 3600 = 16{,}39\ \text{m}
          $$
          $$
          h_{f,\text{válvula}} = 17{,}39 - 16{,}39 = 1{,}0\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación arranca en 14 m —el desnivel entre las
              dos láminas— y le suma las pérdidas de tubería y de piezas.
          - texto: >-
              Cruzándola con las curvas del Anexo I, la bomba que mejor encaja
              es la INP 125/250 con rodete de 255 mm: 62,4 l/s a 16,5 m con un
              76,5 % de rendimiento.
          - texto: >-
              El NPSH disponible es de 6,04 mca frente a los 2,8 que pide la
              bomba: quedan 3,24 de margen, muy por encima del mínimo.
          - texto: >-
              Como la instalación pide 62,4 l/s y el proceso solo necesita 60,
              lo más barato es estrangular la válvula esférica.
            trampa: true
            mensaje: |
              Estrangular es lo más **fácil**, no lo más barato: la válvula
              disipa energía de forma permanente y la bomba pasa a absorber
              algo más. Lo barato sería tornear el rodete o poner un variador;
              lo que pasa es que 0,015 €/h son 130 € al año y no compensan el
              variador. **La decisión es económica, no técnica**, y depende de
              cuánto se estrangule.

    resolucion: |
      **Este es el problema completo de la asignatura**: curva de instalación,
      selección en catálogo, punto de funcionamiento, comprobación de
      cavitación y coste de la regulación. Los cinco pasos, en orden.

      **a) La curva de la instalación.** Tres términos:

      $$
      H_{mi} = \underbrace{14}_{\Delta z}
      + \underbrace{7{,}36\cdot 10^{-4}\,Q^{1{,}852}}_{\text{tuberías, Hazen-Williams}}
      + \underbrace{2{,}63\cdot 10^{-4}\,Q^{2}}_{\text{piezas especiales}}
      \qquad (Q\text{ en l/s})
      $$

      El primero es el desnivel entre las dos láminas. El segundo sale de los
      cuadros n.º 20 y 25: acero comercial da $\varepsilon = 0{,}006\ \text{cm}$,
      y con $\varepsilon/D$ resultan $C_{HW} = 140$ en la aspiración y $130$ en
      la impulsión. El tercero, de los factores de paso, **con un $K = 1$
      añadido por la salida a la atmósfera**.

      **b) y c) La bomba y el punto.** Cruzando esa curva con las del Anexo I,
      la **INP 125/250 con rodete de 255 mm** corta en

      $$
      Q = 62{,}4\ \text{l/s}
      \qquad
      H = 16{,}5\ \text{m}
      \qquad
      \eta = 76{,}5\ \%
      \qquad
      P_{\text{abs}} = 13{,}3\ \text{kW}
      $$

      **d) El NPSH.**

      $$
      NPSH_{\text{disp}} = 10{,}33 - 0{,}18 - 4 - 0{,}11 = 6{,}04\ \text{mca}
      \;\Longrightarrow\;
      NPSH_{\text{seg}} = 3{,}24\ \text{mca}
      $$

      Con holgura: el mínimo recomendado son 0,5–0,9 mca y el criterio del
      1,3 pediría 3,64 disponibles frente a los 6,04 que hay.

      **e) La válvula.** A 60 l/s la bomba da 17,39 m y la instalación pide
      16,39: la válvula tiene que **quemar 1 metro**. Eso hace que la bomba
      absorba unos 0,15 kW más que en el punto libre, es decir **0,015 €/h**.

      > **Sobre ese último número, con toda la honestidad.** Es la diferencia
      > entre dos potencias absorbidas de trece kilovatios y pico, las dos
      > leídas del anexo. Una diferencia de dos números grandes y parecidos
      > hereda todo el error de la lectura: reproducir el 0,015 exige leer la
      > curva de potencia con una precisión que un escaneo no da. Lo que sí es
      > robusto —y es lo que hay que saber hacer— es el metro de pérdida en la
      > válvula.

      **Y la comprobación que valida todo lo demás.** La curva que sale de los
      cuadros de la escuela es
      $14 + 7{,}363\cdot 10^{-4}Q^{1{,}852} + 2{,}627\cdot 10^{-4}Q^{2}$, y el
      boletín publica $14 + 7{,}3666\cdot 10^{-4}Q^{1{,}852} +
      2{,}626\cdot 10^{-4}Q^{2}$: coinciden en cuatro cifras. Y el
      $NPSH_{\text{req}}$ que hace falta para que salgan los 3,24 publicados es
      $2{,}80\ \text{mca}$, que es exactamente lo que se lee en la curva del
      anexo. **Cuando dos caminos independientes dan el mismo número, la
      lectura del catálogo está bien hecha.**

  # ── COLECCIÓN 9.10. El único del capítulo que da la curva de la bomba como
  #    TABLA en vez de remitir a un anexo, así que se puede resolver entero
  #    sin catálogo. Y tiene una rareza que enseña mucho: el depósito de
  #    llegada está más bajo que el de salida, y aun así hace falta bombear.
  #
  #    Dos cosas que se han cambiado respecto del original y quedan dichas.
  #    Una: el enunciado de la colección dice «en la instalación que muestra
  #    la figura» y pone las cotas en la lista de datos; aquí la disposición
  #    se describe con palabras, con esas mismas cotas, para no depender de
  #    un dibujo. Dos: el apartado c) original pide la longitud de aspiración
  #    que deja NPSH de seguridad 2 mca, y reconstruirlo exige la presión de
  #    vapor, que el enunciado no da; se ha dado la longitud publicada como
  #    dato y se piden las presiones, que sí salen exactas. Está explicado en
  #    la resolución.
  - id: ejflu25-col910-la-bomba-que-empuja-cuesta-abajo
    titulo: La bomba que empuja cuesta abajo, y aun así hace falta
    fuente: >-
      Ejercicio 9.10 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una bomba B eleva agua del depósito A al depósito C. Las láminas
      superiores están en las cotas $z_A = 7\ \text{m}$ y
      $z_C = 3\ \text{m}$, y el eje de la bomba en $z_B = 2\ \text{m}$. La
      tubería es de fundición, de $400\ \text{mm}$ de diámetro, y la longitud
      total entre depósitos es de $3200\ \text{m}$. Las pérdidas en piezas
      especiales son nulas.

      La curva característica de la bomba viene definida por estos puntos:

      | $Q$ (l/s) | 0 | 50 | 100 | 150 | 200 | 250 | 300 |
      |---|---|---|---|---|---|---|---|
      | $H$ (m) | 20 | 19,5 | 18 | 16 | 13 | 9 | 5 |
      | $\eta$ (%) | 0 | 30 | 50 | 60 | 60 | 49 | 32 |
      | $NPSH_{\text{req}}$ (m) | 0 | 0,5 | 1 | 1,8 | 3 | 4,7 | 6 |

      Se pide:

      a) Expresión analítica de la curva característica de la instalación.

      b) Punto de funcionamiento de la bomba y potencia absorbida por el motor
      de arrastre.

      c) Presiones a la entrada y salida de la bomba, sabiendo que la tubería
      de aspiración mide $1819{,}7\ \text{m}$.
    pide: La curva de la instalación, el punto de funcionamiento con su potencia y las presiones en la bomba.

    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito de llegada está **cuatro metros más bajo** que el de
          salida. ¿Para qué hace falta entonces una bomba?
        opciones:
          - texto: >-
              Porque el desnivel favorable de 4 m no llega a compensar los
              3200 m de rozamiento; la bomba aporta la diferencia
            correcta: true
            mensaje: |
              Eso es. La altura geométrica entra en la curva de la instalación
              con signo **menos**, $H = -4 + h_f(Q)$, y lo único que hace es
              desplazar la curva cuatro metros hacia abajo. El rozamiento de
              tres kilómetros se come eso y mucho más.
          - texto: >-
              Porque sin bomba el agua no puede circular por una tubería
              cerrada
            mensaje: |
              Claro que puede: es un sifón, y funciona solo mientras haya
              desnivel favorable. De hecho aquí, con un caudal pequeño, la
              conducción circularía sola. Lo que la bomba compra es
              **caudal**, no movimiento.
          - texto: >-
              Porque la bomba está en la cota 2, por debajo de los dos
              depósitos, y tiene que subir el agua hasta el de llegada
            mensaje: |
              La cota de la bomba no entra en la curva de la instalación:
              entre A y C solo cuentan los dos extremos. Dónde esté la bomba
              importa para el NPSH y para las presiones de sus bridas, no para
              la altura que tiene que dar.

      - tipo: calcular
        titulo: La altura geométrica
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.01
          formato: un número con su signo, en metros
        distractores:
          - valor: '4'
            mensaje: |
              El signo. La instalación va de la cota 7 a la cota 3:
              $H_g = z_C - z_A = 3 - 7 = -4$. Es un desnivel a favor, y por
              eso resta.
          - valor: '1'
            mensaje: |
              Parece que has usado la cota de la bomba, $z_B = 2$, como uno de
              los extremos. La altura geométrica de la instalación va de
              lámina a lámina: de A a C.
        pista: |
          De la lámina de A a la lámina de C, en ese orden.
        desarrollo: |
          $$
          H_g = z_C - z_A = 3 - 7 = -4\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal de funcionamiento
        pregunta: |
          ¿Dónde se cruzan la curva de la bomba y la de la instalación?
        respuesta:
          tipo: magnitud
          valor: '194 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '176 l/s'
            mensaje: |
              Parece que has olvidado el $-4$ y has cruzado la curva de la
              bomba con $h_f$ a secas. Los cuatro metros de desnivel favorable
              bajan la curva de la instalación y por eso el corte se desplaza
              a más caudal: de 176 a 194 l/s.
          - valor: '150 l/s'
            mensaje: |
              Ese es el punto tabulado más cercano por debajo. El corte cae
              **entre** dos filas de la tabla y hay que interpolar: en 150 la
              bomba da 16 m y la instalación pide 6,7; en 200, 13 frente a
              14,3.
        pista: |
          Tabula $H_{\text{inst}} = 1{,}0016\cdot 10^{-3}Q^{1,852} - 4$ para
          los caudales de la tabla y busca dónde cambia el signo de la
          diferencia.
        desarrollo: |
          | $Q$ (l/s) | bomba | instalación | diferencia |
          |---|---|---|---|
          | 150 | 16,0 | 6,73 | $+9{,}27$ |
          | 200 | 13,0 | 14,29 | $-1{,}29$ |
          | 194 | 13,4 | 13,29 | $+0{,}07$ |

          $$
          Q = 194\ \text{l/s}
          \qquad
          H = 13{,}4\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia absorbe el motor de arrastre?
        respuesta:
          tipo: magnitud
          valor: '42.46 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '25.48 kW'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q H$. La absorbida es
              mayor: hay que dividir entre el rendimiento del 60 % que la
              tabla da en ese punto.
          - valor: '70.77 kW'
            mensaje: |
              Has multiplicado por el rendimiento **y** dividido, o has usado
              $\eta = 0{,}36$. En la tabla, entre 150 y 200 l/s el rendimiento
              vale 60 % en los dos extremos, así que en 194 también.
        pista: |
          $P = \gamma Q H/\eta$, con el rendimiento leído en la tabla en el
          punto de funcionamiento.
        desarrollo: |
          $$
          P = \frac{9800\cdot 0{,}194\cdot 13{,}4}{0{,}60}
          = 42\,464\ \text{W} = 42{,}46\ \text{kW}
          $$

      - tipo: calcular
        titulo: La presión a la entrada de la bomba
        pregunta: |
          ¿Qué presión, en mca, hay en la brida de aspiración?
        respuesta:
          tipo: magnitud
          valor: '-4.95 mca'
          tolerancia: 0.02
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '5 mca'
            mensaje: |
              Ese es el desnivel geométrico $z_A - z_B$ y nada más. Falta lo
              que se pierde en 1819,7 m de aspiración —9,83 m— y la altura
              cinética. La presión de entrada sale **negativa**, que es lo
              normal en una bomba que aspira.
          - valor: '-4.83 mca'
            mensaje: |
              Te falta la altura cinética. En la brida el agua ya va a
              1,54 m/s, y esos $v^{2}/2g = 0{,}12$ m salen de la presión.
        pista: |
          Bernoulli de la lámina de A a la brida:
          $z_A = z_B + p/\gamma + v^{2}/2g + h_{f,\text{asp}}$.
        desarrollo: |
          $$
          v = \frac{0{,}194}{\pi\,0{,}4^{2}/4} = 1{,}54\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}12\ \text{m}
          $$
          $$
          h_{f,\text{asp}} = 1{,}0016\cdot 10^{-3}\,
          \frac{1819{,}7}{3200}\,194^{1,852} = 9{,}83\ \text{m}
          $$
          $$
          \frac{p_e}{\gamma} = (7-2) - 9{,}83 - 0{,}12 = -4{,}95\ \text{mca}
          $$

      - tipo: calcular
        titulo: La presión a la salida
        pregunta: |
          ¿Y en la brida de impulsión?
        respuesta:
          tipo: magnitud
          valor: '8.45 mca'
          tolerancia: 0.02
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '13.4 mca'
            mensaje: |
              Esa es la altura que da la bomba, no la presión de salida. La
              bomba **suma** su altura a lo que le llega, y lo que le llega
              son $-4{,}95$ mca.
          - valor: '18.35 mca'
            mensaje: |
              Has sumado el valor absoluto de la presión de entrada en vez de
              su valor. La entrada está en depresión: $-4{,}95 + 13{,}4$, no
              $4{,}95 + 13{,}4$.
        pista: |
          El mismo diámetro a los dos lados, así que la altura cinética no
          cambia: la bomba solo sube la presión.
        desarrollo: |
          $$
          \frac{p_s}{\gamma} = \frac{p_e}{\gamma} + H
          = -4{,}95 + 13{,}4 = 8{,}45\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La instalación baja cuatro metros, así que su curva es
              $H = 1{,}0016\cdot 10^{-3}Q^{1,852} - 4$ y arranca por debajo de
              cero.
          - texto: >-
              Cortando con la curva de la bomba salen 194 l/s y 13,4 m, con un
              rendimiento del 60 % y 42,46 kW absorbidos.
          - texto: >-
              En la brida de aspiración la presión es de $-4{,}95$ mca: la
              bomba trabaja en depresión porque tiene casi dos kilómetros de
              tubería por delante.
          - texto: >-
              Como la presión de entrada es negativa, la bomba está cavitando
              y hay que subirla de cota.
            trampa: true
            mensaje: |
              Presión negativa **no** es cavitación. Cavita cuando la presión
              baja hasta la de vapor, que en agua fría son unos $-10$ mca
              relativos. Aquí quedan cinco metros de margen, y de ahí sale el
              $NPSH$ de seguridad de 2 mca que pide el apartado c) del
              enunciado original. Casi todas las bombas que aspiran trabajan
              con presión negativa en la brida; eso es lo normal, no la
              avería.

    resolucion: |
      **a) La curva de la instalación, y su signo.** Los dos depósitos están
      a cotas 7 y 3, así que la altura geométrica es **negativa**:

      $$
      H = (z_C - z_A) + h_f(Q) = -4 + 1{,}0016\cdot 10^{-3}\,Q^{1,852}
      $$

      con $Q$ en l/s. El coeficiente sale de Hazen-Williams con
      $C_{HW} = 130$ —el que corresponde a la fundición,
      $\varepsilon/D = 6{,}5\cdot 10^{-4}$, según el cuadro n.º 25— y
      $L = 3200$ m. Que empiece en $-4$ significa que **sin bomba la
      conducción ya trasvasaría agua**: haría de sifón hasta el caudal en que
      el rozamiento igualara los cuatro metros, unos 90 l/s. Lo que la bomba
      compra es pasar de 90 a 194.

      **b) El punto de funcionamiento.** Como la curva de la bomba viene
      tabulada, se tabula también la de la instalación y se busca el cruce:
      entre 150 y 200 l/s la diferencia cambia de signo, y afinando sale

      $$
      Q = 194\ \text{l/s}
      \qquad
      H = 13{,}4\ \text{m}
      \qquad
      \eta = 60\ \%
      \qquad
      P = 42{,}46\ \text{kW}
      $$

      El punto cae justo en la meseta de rendimiento —60 % entre 150 y
      200 l/s— que es donde interesa que caiga. Esa comprobación se hace
      siempre: una bomba que trabaja fuera de su meseta está mal elegida
      aunque dé el caudal.

      **c) Las presiones de las bridas.** Con 1819,7 m de aspiración, la
      pérdida hasta la bomba es de 9,83 m, y de los 5 m de desnivel favorable
      no queda nada:

      $$
      \frac{p_e}{\gamma} = 5 - 9{,}83 - 0{,}12 = -4{,}95\ \text{mca}
      \qquad
      \frac{p_s}{\gamma} = -4{,}95 + 13{,}4 = 8{,}45\ \text{mca}
      $$

      **Lo que hay que mirar en esos dos números.** La bomba sube la presión
      13,4 metros de columna, de $-4{,}95$ a $8{,}45$. Toda su altura se
      emplea en eso y en nada más: el diámetro es el mismo a los dos lados, la
      velocidad no cambia y la cota tampoco. **La altura manométrica de una
      bomba es, literalmente, el salto de presión entre sus bridas** cuando
      las dos tienen el mismo diámetro y están a la misma cota — y esa es la
      forma de medirla en una instalación real, con dos manómetros.

      **Una nota sobre el apartado c) original.** El enunciado de la colección
      pide al revés: calcular la longitud de aspiración que deja un $NPSH$ de
      seguridad de 2 mca, y publica 1819,7 m. Reconstruirlo exige la presión
      de vapor del agua, que el enunciado no da; con $P_v = 0{,}5$ mca y el
      $NPSH_{\text{requerido}}$ de la tabla el número sale. Aquí se ha dado la
      longitud como dato para poder calcular las presiones sin depender de esa
      suposición.

  # ── COLECCIÓN 9.12. El otro del capítulo que trae la curva de la bomba como
  #    tabla, y el único que trae también la tabla K–apertura de la válvula:
  #    permite cerrar el ciclo entero, del punto de funcionamiento a la
  #    posición del volante. Y el agua está a 75 °C, con lo que la cavitación
  #    deja de ser un trámite.
  - id: ejflu25-col912-la-caldera-y-el-agua-a-setenta-y-cinco
    titulo: La caldera, el agua a 75 grados y la válvula que hay que cerrar
    fuente: >-
      Ejercicio 9.12 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una bomba B alimenta una caldera C tomando agua a $75\ °\text{C}$ de un
      depósito de nivel constante A. La tubería de aspiración tiene
      $100\ \text{m}$ de longitud y $100\ \text{mm}$ de diámetro. La tubería
      de impulsión tiene $150\ \text{m}$ de longitud y el mismo diámetro
      anterior. Esta última está dotada de una válvula de regulación V que
      permite variar el caudal de la instalación.

      La lámina de A está $1\ \text{m}$ por encima del eje de la bomba, y la
      entrada a la caldera, $7\ \text{m}$ por encima de la lámina de A. Los
      dos recipientes están abiertos a la atmósfera.

      Se desea obtener un caudal de $8\ \text{l/s}$. Considerando un
      coeficiente de fricción de $0{,}02$ para todas las tuberías, y que las
      únicas pérdidas puntuales significativas son las que se producen en la
      válvula V, siendo el proceso isotérmico, calcular:

      a) Expresión analítica de la cc de la instalación.

      b) Punto de funcionamiento de la bomba ($H_m$, $Q$ y potencia
      absorbida).

      c) Presión a la entrada de la bomba. ¿Existiría peligro de cavitación?

      d) Pérdidas de carga que habría que introducir mediante la válvula para
      conseguir el caudal de 8 l/s.

      Curva característica de la bomba:

      | $Q$ (l/s) | 0 | 2 | 4 | 6 | 8 | 10 | 12 | 14 |
      |---|---|---|---|---|---|---|---|---|
      | $H_m$ (m) | 14 | 15 | 14 | 13 | 12 | 9 | 5 | 0 |
      | $\eta$ (%) | 0 | 42 | 58 | 65 | 70 | 62 | 38 | 0 |

      Propiedades del agua a $75\ °\text{C}$: $\rho = 974\ \text{kg/m}^{3}$;
      presión de vapor $P_V = 0{,}368\ \text{kg/cm}^{2}$ (abs).
      $P_{at} = 1\ \text{atm}$.
    pide: La curva de la instalación, el punto de funcionamiento con su potencia, la presión de aspiración y la pérdida que debe meter la válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba, dejada a su aire, va a dar más de los 8 l/s que se
          quieren. ¿Por qué se regula **estrangulando** y no bajándole
          revoluciones?
        opciones:
          - texto: >-
              Porque una válvula es lo que hay: añade pérdida y desplaza el
              punto de funcionamiento hacia la izquierda, aunque toda esa
              pérdida sea energía tirada
            correcta: true
            mensaje: |
              Eso es, y conviene tenerlo claro: **estrangular funciona y es
              caro**. La bomba sigue consumiendo casi lo mismo y la diferencia
              se disipa en la válvula. Es el motivo de que hoy se prefiera un
              variador de frecuencia cuando el caudal varía mucho.
          - texto: >-
              Porque cerrar la válvula reduce la potencia que la bomba
              consume, y así se ahorra
            mensaje: |
              Al estrangular, el punto de funcionamiento sube por la curva de
              la bomba: menos caudal pero **más altura**. El producto
              $\gamma Q H$ baja poco, y el rendimiento suele empeorar. Se
              ahorra mucho menos de lo que parece.
          - texto: >-
              Porque una bomba centrífuga no admite trabajar a caudal
              distinto del nominal
            mensaje: |
              Sí lo admite: recorre toda su curva. Lo que no conviene es
              alejarse mucho de su punto de máximo rendimiento, y por eso el
              ejercicio pide comprobar el rendimiento en el punto de trabajo.

      - tipo: calcular
        titulo: La altura que pide la instalación a 8 l/s
        pregunta: |
          Sin contar la válvula, ¿qué altura necesita la instalación para
          mover $8\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '9.65 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '7 m'
            mensaje: |
              Esa es solo la altura geométrica, de la lámina de A a la entrada
              de la caldera. Faltan los 250 m de tubería, que a 8 l/s piden
              2,65 m más.
          - valor: '2.65 m'
            mensaje: |
              Esas son solo las pérdidas por rozamiento. La bomba tiene además
              que subir el agua 7 m: la curva de la instalación no arranca en
              cero.
        pista: |
          $H = \Delta z + f\,\dfrac{L}{D}\,\dfrac{v^{2}}{2g}$, con
          $L = 100 + 150 = 250$ m y $f = 0{,}02$.
        desarrollo: |
          $$
          v = \frac{0{,}008}{\pi\,0{,}1^{2}/4} = 1{,}019\ \text{m/s}
          \qquad
          h_f = 0{,}02\,\frac{250}{0{,}1}\,\frac{1{,}019^{2}}{19{,}6}
          = 2{,}65\ \text{m}
          $$
          $$
          H = 7 + 2{,}65 = 9{,}65\ \text{m}
          $$

          Y en general, con $Q$ en l/s:
          $H = 7 + 0{,}0414\,Q^{2}$, que es la respuesta al apartado a).

      - tipo: calcular
        titulo: El caudal que la bomba da por su cuenta
        pregunta: |
          Sin tocar la válvula, ¿qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '9.1 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '8 l/s'
            mensaje: |
              Ese es el caudal que se **quiere**, no el que sale. La bomba
              elegida da de más, y por eso el apartado d) pide estrangular:
              si coincidieran, la válvula sobraría.
          - valor: '11.75 l/s'
            mensaje: |
              Parece que has cruzado la curva de la bomba con las pérdidas
              solas, sin los 7 m de altura geométrica. Subir la curva de la
              instalación 7 metros desplaza el corte bastante a la izquierda.
        pista: |
          Tabula $H = 7 + 0{,}0414\,Q^{2}$ frente a la curva de la bomba y
          busca dónde se cruzan.
        desarrollo: |
          | $Q$ (l/s) | bomba | instalación |
          |---|---|---|
          | 8 | 12,0 | 9,65 |
          | 10 | 9,0 | 11,14 |
          | 9,1 | 10,35 | 10,43 |

          $$
          Q = 9{,}1\ \text{l/s}
          \qquad
          H_m = 10{,}4\ \text{m}
          \qquad
          \eta = 65{,}6\ \%
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia absorbe la bomba en ese punto?
        respuesta:
          tipo: magnitud
          valor: '1414 w'
          tolerancia: 0.04
          formato: una potencia, con su unidad
        distractores:
          - valor: '928 w'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q H$. La absorbida es
              mayor: hay que dividir entre el rendimiento del 65,6 % que se
              lee en la tabla interpolando entre 8 y 10 l/s.
          - valor: '2156 w'
            mensaje: |
              Has dividido dos veces entre el rendimiento. Solo se divide una:
              $P = \gamma Q H/\eta$.
        pista: |
          $P = \gamma Q H/\eta$, interpolando el rendimiento en la tabla.
        desarrollo: |
          $$
          \eta = 70 - \frac{1{,}1}{2}(70-62) = 65{,}6\ \%
          $$
          $$
          P = \frac{9800\cdot 0{,}0091\cdot 10{,}4}{0{,}656} = 1414\ \text{W}
          $$

      - tipo: calcular
        titulo: La presión a la entrada de la bomba
        pregunta: |
          ¿Qué presión absoluta hay en la brida de aspiración, en metros de
          columna?
        respuesta:
          tipo: magnitud
          valor: '9.89 mca'
          tolerancia: 0.04
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '11.33 mca'
            mensaje: |
              Te has dejado las pérdidas de la aspiración. Cien de los 250 m
              de tubería están antes de la bomba, y a 9,1 l/s se comen
              1,37 m.
          - valor: '7.89 mca'
            mensaje: |
              Has restado el metro de desnivel en vez de sumarlo. La lámina de
              A está **por encima** del eje de la bomba: la bomba trabaja en
              carga, y eso juega a favor.
        pista: |
          Bernoulli de la lámina de A a la brida, en absolutas:
          $P_{at}/\gamma + \Delta z - h_{f,\text{asp}} - v^{2}/2g$.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 0{,}0414\cdot\frac{100}{250}\cdot 9{,}1^{2}
          = 1{,}37\ \text{m}
          \qquad
          \frac{v^{2}}{2g} = 0{,}07\ \text{m}
          $$
          $$
          \frac{p_e}{\gamma} = 10{,}33 + 1 - 1{,}37 - 0{,}07
          = 9{,}89\ \text{mca (abs)}
          $$

      - tipo: calcular
        titulo: La pérdida que debe meter la válvula
        pregunta: |
          ¿Cuánta pérdida tiene que producir la válvula para dejar el caudal
          en $8\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '2.35 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.75 m'
            mensaje: |
              Has restado a la altura del punto de funcionamiento, 10,4 m. Al
              cerrar la válvula el punto se mueve: a 8 l/s la bomba ya no da
              10,4 sino **12** m, que es lo que hay que leer en su curva.
          - valor: '5 m'
            mensaje: |
              Te has dejado las pérdidas de la tubería a 8 l/s. La válvula
              solo tiene que disipar lo que sobra **después** de descontarlas:
              $12 - 7 - 2{,}65$.
        pista: |
          A 8 l/s, ¿cuánto da la bomba y cuánto pide la instalación? La
          diferencia se la come la válvula.
        desarrollo: |
          $$
          \Delta H_V = H_{\text{bomba}}(8) - H_{\text{inst}}(8)
          = 12 - 9{,}65 = 2{,}35\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación es $H = 7 + 0{,}0414\,Q^{2}$ y corta
              a la de la bomba en 9,1 l/s y 10,4 m, con 1414 W absorbidos.
          - texto: >-
              La presión de aspiración es de 9,89 mca absolutos, y la de
              vapor del agua a 75 °C, $0{,}368\ \text{kg/cm}^{2}$, son
              3,68 mca: hay margen y no cavita.
          - texto: >-
              Para bajar a 8 l/s la válvula tiene que disipar 2,35 m, que a
              ese caudal corresponde a un factor de paso de unos 44.
          - texto: >-
              Y como la válvula solo disipa 2,35 de los 12 m que da la bomba,
              el desperdicio energético del estrangulamiento es pequeño.
            trampa: true
            mensaje: |
              Mira el balance completo. Estrangulando se pasa de 9,1 a 8 l/s
              —un 12 % menos de caudal— y la potencia absorbida apenas baja,
              porque la bomba sube a 12 m de altura. **Se paga casi lo mismo
              por mover un 12 % menos**, y encima 2,35 de cada 12 metros se
              tiran en calor dentro de la válvula. Que el número parezca
              pequeño no lo hace despreciable: es un 20 % de la altura útil,
              todo el día, todos los días.

    resolucion: |
      **a) La curva de la instalación.** Los dos recipientes están abiertos,
      así que solo cuentan el desnivel y el rozamiento:

      $$
      H = 7 + 0{,}02\,\frac{250}{0{,}1}\,\frac{v^{2}}{2g}
      = 7 + 0{,}0414\,Q^{2}
      \qquad (Q\ \text{en l/s})
      $$

      El 7 es de lámina de A a entrada de la caldera; el metro que A está por
      encima de la bomba **no aparece aquí** —la altura de la instalación va
      de superficie a superficie— pero sí aparecerá en el apartado c).

      **b) El punto de funcionamiento.** Cortando con la tabla de la bomba:
      $Q = 9{,}1$ l/s, $H_m = 10{,}4$ m, $\eta = 65{,}6\ \%$ y

      $$
      P = \frac{\gamma Q H}{\eta} = 1414\ \text{W}
      $$

      **c) La aspiración, que es donde este ejercicio se pone interesante.**

      $$
      \frac{p_e}{\gamma} = 10{,}33 + 1 - 1{,}37 - 0{,}07 = 9{,}89\ \text{mca
      absolutos}
      $$

      La presión de vapor del agua **a 75 °C** vale $0{,}368\ \text{kg/cm}^{2}$
      absolutos, es decir **3,68 mca**. Queda margen y no cavita. Pero
      compara: a 20 °C la presión de vapor son 0,24 mca, y aquí son quince
      veces más. **Casi todo el margen de cavitación de una bomba se lo come
      la temperatura**, y por eso las bombas de alimentación de caldera se
      ponen siempre en carga —el metro de desnivel de este enunciado no está
      ahí por casualidad— y nunca aspirando.

      **d) La válvula.** A 8 l/s la bomba da 12 m y la instalación pide 9,65:
      la válvula tiene que disipar **2,35 m**.

      **e) El factor de paso, y una incoherencia del boletín.** Con
      $v = 1{,}019$ m/s a 8 l/s, $v^{2}/2g = 0{,}0529$ m y

      $$
      K = \frac{2{,}35}{0{,}0529} = 44{,}4
      $$

      que en la tabla de la válvula cae entre $K = 45$ (30 % de apertura) y
      $K = 36$ (40 %): **una apertura de un 31 %**. La solución oficial
      publica $K = 35$ y un 41,49 % de apertura, y ese 35 sale de dividir los
      2,35 m entre la altura cinética del **punto de funcionamiento**
      —9,1 l/s— en vez de la del caudal nuevo. Las dos cifras del boletín son
      coherentes entre sí, pero la velocidad que usan no es la que hay cuando
      la válvula ya está cerrada.

      **Una nota sobre el peso específico.** El enunciado da
      $\rho = 974\ \text{kg/m}^{3}$, de donde $\gamma = 9545\ \text{N/m}^{3}$.
      El boletín usa 9800 en todo el problema —por eso salen exactamente
      1414 W y 9,89 mca—. Con el peso específico real saldrían 1377 W y
      10,18 mcl: un 2,7 % de diferencia, que es lo que abre la tolerancia de
      estos dos pasos.
