      <figcaption>Esquema nuestro: el enunciado de este problema no trae figura. En rojo, los dos manómetros y el único dato que falta — la cota del depósito A del que aspira la bomba.</figcaption>
      </figure>
    pide: El reparto de caudales entre la boquilla y el depósito presurizado, y la presión que marca el manómetro de D.
    pasos:
      - tipo: reconocer
        pregunta: |
          El manómetro del sobrepresor marca 490 kPa y la lámina está en la
          cota 24. ¿Qué cota piezométrica tiene B?
        opciones:
          - texto: 74 m; la cota de la lámina más los 50 m que equivalen a la presión del aire
            correcta: true
            mensaje: |
              Eso es. Un sobrepresor es un depósito cerrado con aire a presión
              encima del agua, así que su cota piezométrica es la de la lámina
              **más** lo que empuja el aire. Y 490 kPa son exactamente 50 mca.
          - texto: 24 m; la presión del aire no cuenta porque está por encima del agua
            mensaje: |
              El aire comprimido empuja hacia abajo sobre toda la lámina, y ese
              empuje se transmite al agua entera. Si no contara, el sobrepresor
              no serviría para nada.
          - texto: 50 m; la presión del manómetro, que ya está en metros de columna
            mensaje: |
              Son 50 metros de columna de agua, sí, pero medidos **desde la
              lámina**, que está en la cota 24. La cota piezométrica se cuenta
              desde el mismo cero que las cotas.
          - texto: 26 m; la diferencia entre los 50 m de presión y la cota 24
            mensaje: |
              Los dos términos se suman, no se restan. La presión ayuda a
              empujar el agua hacia los servicios; no se opone a la altura.

      - tipo: calcular
        titulo: La cota piezométrica del nudo
        pregunta: |
          Cota piezométrica del nudo N, en metros, con los 25 l/s circulando.
        respuesta:
          tipo: magnitud
          valor: '58.38 m'
          tolerancia: 0.02
          formato: una cota con su unidad (m)
        distractores:
          - valor: '74 m'
            mensaje: |
              Esa es la cota de B. Entre B y N hay una tubería con su pérdida,
              y con 25 l/s son 15,6 m.
          - valor: '50 m'
            mensaje: |
              Has usado solo la lectura del manómetro y te has dejado la cota
              de la lámina. La cota piezométrica de B son 24 más 50.
        pista: |
          Todo el caudal, los 25 l/s, pasa por la tubería BN antes de
          repartirse.
        desarrollo: |
          $$
          H_B = 24 + \frac{490}{9{,}8} = 74\ \text{mca}
          $$

          $$
          h_{f,BN} = 2{,}5\cdot 10^{4}\cdot 0{,}025^{2} = 15{,}625\ \text{m}
          $$

          $$
          H_N = 74 - 15{,}625 = 58{,}375\ \text{m}
          $$

          Fíjate en el tamaño de esa pérdida: **quince metros y medio en el
          tramo común**, más de la quinta parte de todo lo que el sobrepresor
          tiene almacenado en carga. Es el precio de llevar los 25 l/s juntos
          antes de repartirlos.

      - tipo: calcular
        titulo: El caudal de la boquilla
        pregunta: |
          Caudal que sale por la boquilla C, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '10 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '15.99 l/s'
            mensaje: |
              Te has dejado la boquilla entera. Con 25 mm de diámetro, la
              energía cinética de salida y su factor de paso valen juntos
              232 900 veces el cuadrado del caudal, más que los 150 000 de la
              tubería NC.
          - valor: '11.88 l/s'
            mensaje: |
              Has partido de la cota de B, 74 m, en vez de la del nudo. La
              pérdida de la tubería BN ya se ha gastado antes de llegar a la
              bifurcación.
        pista: |
          En la boquilla hay dos términos con la velocidad de salida: su factor
          de paso y la energía cinética que se lleva el chorro. Los dos van con
          la sección de 25 mm.
        desarrollo: |
          La sección de la boquilla es
          $A = \pi\,0{,}025^{2}/4 = 4{,}909\cdot 10^{-4}$ m², de modo que
          $v = Q/A$ y

          $$
          (1 + 0{,}1)\frac{v^{2}}{2g} = \frac{1{,}1}{A^{2}\,2g}\,Q^{2} = 232\,915\,Q^{2}
          $$

          Sumando la tubería NC:

          $$
          58{,}375 - 20 = (1{,}5\cdot 10^{5} + 232\,915)\,Q_C^{2} \;\Longrightarrow\; Q_C = 10{,}0\ \text{l/s}
          $$

          Y por tanto $Q_D = 25 - 10 = 15$ l/s.

      - tipo: calcular
        titulo: La presión del depósito presurizado
        pregunta: |
          Presión que señala el manómetro del depósito D, en kPa.
        respuesta:
          tipo: magnitud
          valor: '106.6 kPa'
          tolerancia: 0.02
          formato: una presión con su unidad (kPa, mca o bar)
        distractores:
          - valor: '327 kPa'
            mensaje: |
              Te has dejado la pérdida de la tubería ND, que con 15 l/s son
              22,5 m. Es la pérdida más grande de las dos ramas.
          - valor: '229 kPa'
            mensaje: |
              Has calculado la pérdida de la ND con los 10 l/s de la boquilla.
              Por esa rama van los otros 15.
        pista: |
          Desde el nudo hasta la lámina de D hay una pérdida y un desnivel; lo
          que sobra es la presión del aire.
        desarrollo: |
          $$
          h_{f,ND} = 10^{5}\cdot 0{,}015^{2} = 22{,}5\ \text{m}
          $$

          $$
          \frac{p_D}{\gamma} = 58{,}375 - 22{,}5 - 25 = 10{,}875\ \text{mca}
          $$

          y en kilopascales, $10{,}875\cdot 9{,}8 = 106{,}6$ kPa.

          Merece la pena comparar las dos ramas. La boquilla lleva 10 l/s y la
          rama de D, 15, y sin embargo la de D pierde 22,5 m contra los 15 de
          la NC. Lo que hace que la boquilla no se lleve más caudal no es la
          tubería: son los 23 m que consume la propia boquilla en acelerar el
          chorro.

      - tipo: justificar
        pregunta: Ordena por qué los apartados a) y b) no se pueden cerrar con lo que da el enunciado. Una pieza es falsa.
        piezas:
          - texto: 'La altura de la bomba es la cota piezométrica de B más la pérdida de la tubería AB, menos la cota piezométrica de donde aspira.'
          - texto: 'Los dos primeros términos se conocen: 74 mca y 125 m de pérdida con 25 l/s, o sea 199 en total.'
          - texto: 'Pero el enunciado no dice en qué cota está el depósito A, y sin ese dato la resta no se puede hacer.'
          - texto: 'El boletín publica 185 mca, lo que equivale a situar A en la cota 14; con esa altura salen sus 45,32 y 60,43 kW.'
          - texto: Como el enunciado no da la cota de A, se toma cero, y entonces la altura de la bomba son los 185 mca publicados.
            trampa: true
            mensaje: |
              Con A en la cota cero la altura sale **199 mca**, no 185. Tomar
              cero es una suposición razonable, pero hay que decir que es una
              suposición y comprobar que el número que sale no es el publicado.
              Lo que no se puede hacer es dar por buenos los dos a la vez.
    resolucion: |
      ## Un sobrepresor, dos servicios y un dato que falta

      Este ejercicio se resuelve en cadena desde el sobrepresor, y tiene una
      particularidad que conviene decir antes de empezar: **dos de sus cuatro
      apartados no se pueden cerrar con lo que da el enunciado**. Lo veremos al
      final; los otros dos salen exactos.

      ## Qué es la cota piezométrica de un sobrepresor

      Un sobrepresor es un depósito cerrado con una bolsa de aire comprimido
      encima del agua. Su cota piezométrica no es la de la lámina: es la lámina
      **más** lo que empuja el aire.

      $$
      H_B = 24 + \frac{490}{9{,}8} = 24 + 50 = 74\ \text{mca}
      $$

      Esos 50 metros de más son la razón de ser del aparato. Sin ellos, un
      depósito a cota 24 no podría alimentar un depósito presurizado que está
      en la cota 25.

      ## c) El reparto, y por qué la boquilla se lleva menos

      Todo el caudal pasa primero por la tubería común:

      $$
      h_{f,BN} = 2{,}5\cdot 10^{4}\cdot 0{,}025^{2} = 15{,}625\ \text{m} \;\Longrightarrow\; H_N = 58{,}375\ \text{m}
      $$

      A partir de ahí, cada rama tiene su ecuación. La de la boquilla es la
      interesante, porque la boquilla aporta **dos** términos: su factor de
      paso y la energía cinética con la que sale el chorro, los dos con la
      velocidad de los 25 mm.

      $$
      38{,}375 = \left(1{,}5\cdot 10^{5} + \frac{1{,}1}{A^{2}\,2g}\right)Q_C^{2} = (150\,000 + 232\,915)\,Q_C^{2}
      $$

      $$
      Q_C = 10\ \text{l/s} \qquad Q_D = 15\ \text{l/s}
      $$

      El número que hay que mirar es el 232 915: **la boquilla pesa más que
      toda la tubería NC**, y su factor de paso solo vale 0,1. Casi todo ese
      peso es la energía cinética del chorro, que sale a 20 m/s. Es la misma
      lección de siempre con las boquillas: la que manda es la sección, no el
      coeficiente.

      ## d) La presión de D

      $$
      \frac{p_D}{\gamma} = 58{,}375 - 10^{5}\cdot 0{,}015^{2} - 25 = 10{,}875\ \text{mca}
      $$

      es decir 106,6 kPa. Poco más de una atmósfera. Y conviene notar la asimetría: la rama de D
      lleva un 50 % más de caudal que la de C y pierde 22,5 m contra 15, pero
      aun así llega con presión de sobra, porque no tiene que gastar nada en
      acelerar un chorro.

      ## a) y b), y por qué se quedan abiertos

      La altura manométrica de la bomba es

      $$
      H_b = H_B + h_{f,AB} - H_A = 74 + 2\cdot 10^{5}\cdot 0{,}025^{2} - H_A = 199 - H_A
      $$

      Los 125 m de pérdida en la aspiración e impulsión están dados, y los 74
      de B también. Falta $H_A$, y **el enunciado no dice en qué cota está el
      depósito A**. Con A en la cota cero saldrían 199 mca y, con el 75 % de
      rendimiento, 48,76 kW útiles y 65,01 brutos.

      El boletín publica 185 mca, 45,32 kW y 60,43 kW. Los tres son
      consistentes entre sí —$9800\cdot 0{,}025\cdot 185 = 45\,325$ W— y
      corresponden a situar A en la **cota 14**. Ese 14 no aparece por ningún
      lado del enunciado: sale de restar el resultado publicado.

      Así que aquí no hay nada que resolver, sino algo que declarar: el dato
      falta. Y decirlo es más útil que inventarlo, porque quien lo intente en
      un examen se pasará media hora buscando el error en su propia cuenta.

  # ── COLECCIÓN 9.10. El único del capítulo que da la curva de la bomba como
  #    TABLA en vez de remitir a un anexo, así que se puede resolver entero
  #    sin catálogo. Y tiene una rareza que enseña mucho: el depósito de
  #    llegada está más bajo que el de salida, y aun así hace falta bombear.
  #
  #    Dos cosas que se han cambiado respecto del original y quedan dichas.
  #    Una: el enunciado de la colección dice «en la instalación que muestra
  #    la figura» y pone las cotas en la lista de datos; aquí la disposición
  #    se describe con palabras, con esas mismas cotas, para no depender de
  #    un dibujo. Dos: el apartado c) original pide la longitud de aspiración
  #    que deja NPSH de seguridad 2 mca, y reconstruirlo exige la presión de
  #    vapor, que el enunciado no da; se ha dado la longitud publicada como
  #    dato y se piden las presiones, que sí salen exactas. Está explicado en
  #    la resolución.
  - id: ejflu25-col910-la-bomba-que-empuja-cuesta-abajo
    titulo: La bomba que empuja cuesta abajo, y aun así hace falta
    fuente: >-
      Ejercicio 9.10 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una bomba B eleva agua del depósito A al depósito C. Las láminas
      superiores están en las cotas $z_A = 7\ \text{m}$ y
      $z_C = 3\ \text{m}$, y el eje de la bomba en $z_B = 2\ \text{m}$. La
      tubería es de fundición, de $400\ \text{mm}$ de diámetro, y la longitud
      total entre depósitos es de $3200\ \text{m}$. Las pérdidas en piezas
      especiales son nulas.

      La curva característica de la bomba viene definida por estos puntos:

      | $Q$ (l/s) | 0 | 50 | 100 | 150 | 200 | 250 | 300 |
      |---|---|---|---|---|---|---|---|
      | $H$ (m) | 20 | 19,5 | 18 | 16 | 13 | 9 | 5 |
      | $\eta$ (%) | 0 | 30 | 50 | 60 | 60 | 49 | 32 |
      | $NPSH_{\text{req}}$ (m) | 0 | 0,5 | 1 | 1,8 | 3 | 4,7 | 6 |

      Se pide:

      a) Expresión analítica de la curva característica de la instalación.

      b) Punto de funcionamiento de la bomba y potencia absorbida por el motor
      de arrastre.

      c) Presiones a la entrada y salida de la bomba, sabiendo que la tubería
      de aspiración mide $1819{,}7\ \text{m}$.
    pide: La curva de la instalación, el punto de funcionamiento con su potencia y las presiones en la bomba.

    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito de llegada está **cuatro metros más bajo** que el de
          salida. ¿Para qué hace falta entonces una bomba?
        opciones:
          - texto: >-
              Porque el desnivel favorable de 4 m no llega a compensar los
              3200 m de rozamiento; la bomba aporta la diferencia
            correcta: true
            mensaje: |
              Eso es. La altura geométrica entra en la curva de la instalación
              con signo **menos**, $H = -4 + h_f(Q)$, y lo único que hace es
              desplazar la curva cuatro metros hacia abajo. El rozamiento de
              tres kilómetros se come eso y mucho más.
          - texto: >-
              Porque sin bomba el agua no puede circular por una tubería
              cerrada
            mensaje: |
              Claro que puede: es un sifón, y funciona solo mientras haya
              desnivel favorable. De hecho aquí, con un caudal pequeño, la
              conducción circularía sola. Lo que la bomba compra es
              **caudal**, no movimiento.
          - texto: >-
              Porque la bomba está en la cota 2, por debajo de los dos
              depósitos, y tiene que subir el agua hasta el de llegada
            mensaje: |
              La cota de la bomba no entra en la curva de la instalación:
              entre A y C solo cuentan los dos extremos. Dónde esté la bomba
              importa para el NPSH y para las presiones de sus bridas, no para
              la altura que tiene que dar.

      - tipo: calcular
        titulo: La altura geométrica
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.01
          formato: un número con su signo, en metros
        distractores:
          - valor: '4'
            mensaje: |
              El signo. La instalación va de la cota 7 a la cota 3:
              $H_g = z_C - z_A = 3 - 7 = -4$. Es un desnivel a favor, y por
              eso resta.
          - valor: '1'
            mensaje: |
              Parece que has usado la cota de la bomba, $z_B = 2$, como uno de
              los extremos. La altura geométrica de la instalación va de
              lámina a lámina: de A a C.
        pista: |
          De la lámina de A a la lámina de C, en ese orden.
        desarrollo: |
          $$
          H_g = z_C - z_A = 3 - 7 = -4\ \text{m}
          $$

      - tipo: calcular
        titulo: El caudal de funcionamiento
        pregunta: |
          ¿Dónde se cruzan la curva de la bomba y la de la instalación?
        respuesta:
          tipo: magnitud
          valor: '194 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '176 l/s'
            mensaje: |
              Parece que has olvidado el $-4$ y has cruzado la curva de la
              bomba con $h_f$ a secas. Los cuatro metros de desnivel favorable
              bajan la curva de la instalación y por eso el corte se desplaza
              a más caudal: de 176 a 194 l/s.
          - valor: '150 l/s'
            mensaje: |
              Ese es el punto tabulado más cercano por debajo. El corte cae
              **entre** dos filas de la tabla y hay que interpolar: en 150 la
              bomba da 16 m y la instalación pide 6,7; en 200, 13 frente a
              14,3.
        pista: |
          Tabula $H_{\text{inst}} = 1{,}0016\cdot 10^{-3}Q^{1,852} - 4$ para
          los caudales de la tabla y busca dónde cambia el signo de la
          diferencia.
        desarrollo: |
          | $Q$ (l/s) | bomba | instalación | diferencia |
          |---|---|---|---|
          | 150 | 16,0 | 6,73 | $+9{,}27$ |
          | 200 | 13,0 | 14,29 | $-1{,}29$ |
          | 194 | 13,4 | 13,29 | $+0{,}07$ |

          $$
          Q = 194\ \text{l/s}
          \qquad
          H = 13{,}4\ \text{m}
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia absorbe el motor de arrastre?
        respuesta:
          tipo: magnitud
          valor: '42.46 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '25.48 kW'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q H$. La absorbida es
              mayor: hay que dividir entre el rendimiento del 60 % que la
              tabla da en ese punto.
          - valor: '70.77 kW'
            mensaje: |
              Has multiplicado por el rendimiento **y** dividido, o has usado
              $\eta = 0{,}36$. En la tabla, entre 150 y 200 l/s el rendimiento
              vale 60 % en los dos extremos, así que en 194 también.
        pista: |
          $P = \gamma Q H/\eta$, con el rendimiento leído en la tabla en el
          punto de funcionamiento.
        desarrollo: |
          $$
          P = \frac{9800\cdot 0{,}194\cdot 13{,}4}{0{,}60}
          = 42\,464\ \text{W} = 42{,}46\ \text{kW}
          $$

      - tipo: calcular
        titulo: La presión a la entrada de la bomba
        pregunta: |
          ¿Qué presión, en mca, hay en la brida de aspiración?
        respuesta:
          tipo: magnitud
          valor: '-4.95 mca'
          tolerancia: 0.02
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '5 mca'
            mensaje: |
              Ese es el desnivel geométrico $z_A - z_B$ y nada más. Falta lo
              que se pierde en 1819,7 m de aspiración —9,83 m— y la altura
              cinética. La presión de entrada sale **negativa**, que es lo
              normal en una bomba que aspira.
          - valor: '-4.83 mca'
            mensaje: |
              Te falta la altura cinética. En la brida el agua ya va a
              1,54 m/s, y esos $v^{2}/2g = 0{,}12$ m salen de la presión.
        pista: |
          Bernoulli de la lámina de A a la brida:
          $z_A = z_B + p/\gamma + v^{2}/2g + h_{f,\text{asp}}$.
        desarrollo: |
          $$
          v = \frac{0{,}194}{\pi\,0{,}4^{2}/4} = 1{,}54\ \text{m/s}
          \qquad
          \frac{v^{2}}{2g} = 0{,}12\ \text{m}
          $$
          $$
          h_{f,\text{asp}} = 1{,}0016\cdot 10^{-3}\,
          \frac{1819{,}7}{3200}\,194^{1,852} = 9{,}83\ \text{m}
          $$
          $$
          \frac{p_e}{\gamma} = (7-2) - 9{,}83 - 0{,}12 = -4{,}95\ \text{mca}
          $$

      - tipo: calcular
        titulo: La presión a la salida
        pregunta: |
          ¿Y en la brida de impulsión?
        respuesta:
          tipo: magnitud
          valor: '8.45 mca'
          tolerancia: 0.02
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '13.4 mca'
            mensaje: |
              Esa es la altura que da la bomba, no la presión de salida. La
              bomba **suma** su altura a lo que le llega, y lo que le llega
              son $-4{,}95$ mca.
          - valor: '18.35 mca'
            mensaje: |
              Has sumado el valor absoluto de la presión de entrada en vez de
              su valor. La entrada está en depresión: $-4{,}95 + 13{,}4$, no
              $4{,}95 + 13{,}4$.
        pista: |
          El mismo diámetro a los dos lados, así que la altura cinética no
          cambia: la bomba solo sube la presión.
        desarrollo: |
          $$
          \frac{p_s}{\gamma} = \frac{p_e}{\gamma} + H
          = -4{,}95 + 13{,}4 = 8{,}45\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La instalación baja cuatro metros, así que su curva es
              $H = 1{,}0016\cdot 10^{-3}Q^{1,852} - 4$ y arranca por debajo de
              cero.
          - texto: >-
              Cortando con la curva de la bomba salen 194 l/s y 13,4 m, con un
              rendimiento del 60 % y 42,46 kW absorbidos.
          - texto: >-
              En la brida de aspiración la presión es de $-4{,}95$ mca: la
              bomba trabaja en depresión porque tiene casi dos kilómetros de
              tubería por delante.
          - texto: >-
              Como la presión de entrada es negativa, la bomba está cavitando
              y hay que subirla de cota.
            trampa: true
            mensaje: |
              Presión negativa **no** es cavitación. Cavita cuando la presión
              baja hasta la de vapor, que en agua fría son unos $-10$ mca
              relativos. Aquí quedan cinco metros de margen, y de ahí sale el
              $NPSH$ de seguridad de 2 mca que pide el apartado c) del
              enunciado original. Casi todas las bombas que aspiran trabajan
              con presión negativa en la brida; eso es lo normal, no la
              avería.

    resolucion: |
      **a) La curva de la instalación, y su signo.** Los dos depósitos están
      a cotas 7 y 3, así que la altura geométrica es **negativa**:

      $$
      H = (z_C - z_A) + h_f(Q) = -4 + 1{,}0016\cdot 10^{-3}\,Q^{1,852}
      $$

      con $Q$ en l/s. El coeficiente sale de Hazen-Williams con
      $C_{HW} = 130$ —la banda del cuadro n.º 25 en la que cae
      $\varepsilon/D = 0{,}026/40 = 6{,}5\cdot 10^{-4}$; ojo, la banda la fija
      la **rugosidad relativa**, no el material— y
      $L = 3200$ m. Que empiece en $-4$ significa que **sin bomba la
      conducción ya trasvasaría agua**: haría de sifón hasta el caudal en que
      el rozamiento igualara los cuatro metros, unos 90 l/s. Lo que la bomba
      compra es pasar de 90 a 194.

      **b) El punto de funcionamiento.** Como la curva de la bomba viene
      tabulada, se tabula también la de la instalación y se busca el cruce:
      entre 150 y 200 l/s la diferencia cambia de signo, y afinando sale

      $$
      Q = 194\ \text{l/s}
      \qquad
      H = 13{,}4\ \text{m}
      \qquad
      \eta = 60\ \%
      \qquad
      P = 42{,}46\ \text{kW}
      $$

      El punto cae justo en la meseta de rendimiento —60 % entre 150 y
      200 l/s— que es donde interesa que caiga. Esa comprobación se hace
      siempre: una bomba que trabaja fuera de su meseta está mal elegida
      aunque dé el caudal.

      **c) Las presiones de las bridas.** Con 1819,7 m de aspiración, la
      pérdida hasta la bomba es de 9,83 m, y de los 5 m de desnivel favorable
      no queda nada:

      $$
      \frac{p_e}{\gamma} = 5 - 9{,}83 - 0{,}12 = -4{,}95\ \text{mca}
      \qquad
      \frac{p_s}{\gamma} = -4{,}95 + 13{,}4 = 8{,}45\ \text{mca}
      $$

      **Lo que hay que mirar en esos dos números.** La bomba sube la presión
      13,4 metros de columna, de $-4{,}95$ a $8{,}45$. Toda su altura se
      emplea en eso y en nada más: el diámetro es el mismo a los dos lados, la
      velocidad no cambia y la cota tampoco. **La altura manométrica de una
      bomba es, literalmente, el salto de presión entre sus bridas** cuando
      las dos tienen el mismo diámetro y están a la misma cota — y esa es la
      forma de medirla en una instalación real, con dos manómetros.

      **Una nota sobre el apartado c) original.** El enunciado de la colección
      pide al revés: calcular la longitud de aspiración que deja un $NPSH$ de
      seguridad de 2 mca, y publica 1819,7 m. Reconstruirlo exige la presión
      de vapor del agua, que el enunciado no da; con $P_v = 0{,}5$ mca y el
      $NPSH_{\text{requerido}}$ de la tabla el número sale. Aquí se ha dado la
      longitud como dato para poder calcular las presiones sin depender de esa
      suposición.

  - id: ejflu25-col911-los-mil-trescientos-metros-equivalentes
    titulo: Los mil trescientos metros equivalentes
    fuente: Ejercicio 9.11 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se desea elevar un caudal de 100 m³/h de un líquido cuyo peso específico
      relativo es igual a 1,1 y cuya viscosidad es análoga a la del agua, de un
      depósito inferior a otro superior, situados respectivamente en las cotas
      900 y 974.

      La tubería de aspiración tiene una longitud de 30 m, disponiendo de una
      válvula de pie y un codo de 90º. La tubería de impulsión tiene una
      longitud de 1250 m, disponiendo de una válvula antirretorno, una válvula
      esférica para la regulación del caudal, una pieza en T de derivación,
      3 codos de 90º y una válvula de compuerta.

      La tubería seleccionada es de fibrocemento siendo su diámetro de 200 mm.
      Se pide:

      **a)** Expresión analítica de la curva característica de la instalación.

      **b)** Trazar en papel apropiado la cc de la instalación.

      **c)** Seleccionar la turbobomba más conveniente entre aquellas cuyas cc
      se adjuntan. Se entiende por más conveniente aquella que absorba menos
      energía en el punto de funcionamiento que se obtenga sin ninguna
      modificación en el sistema.

      **d)** Punto de funcionamiento de la tb seleccionada trabajando en la
      instalación descrita; es decir: altura manométrica, caudal, rendimiento y
      potencia absorbida.

      **e)** Cota en que deberá disponerse el eje de la tb si se desea obtener
      una carga de seguridad de 1 mcl, si la tensión de vapor es de 0,6 mcl
      (absoluta).

      **Datos de longitudes equivalentes:** válvula de pie 25 m; válvula
      antirretorno 15 m; entrada a depósito 10 m; curva de 90º y T 5 m; válvula
      de compuerta 5 m; salida de depósito 5 m; válvula de mariposa 5 m;
      válvula esférica 1 m.

      **Notas nuestras.** El anexo de curvas de bombas no se puede reproducir
      aquí: la turbobomba del apartado c) es la **INP 65/250 a 2900 rpm con
      rodete de 266 mm**, y su punto de funcionamiento es **29 l/s con 80,3 m y
      un rendimiento del 72 %**. Su NPSH requerido a ese caudal, leído de la
      carta del anexo III, son **5 mca**. Y para el apartado e) hace falta la
      presión atmosférica, que el enunciado no da; se toma la del corpus,
      10 mca de agua.

      <figure class="figura-examen">
      <svg viewBox="0 0 600 384" role="img" width="600" height="384"
           aria-labelledby="f911t f911d">
        <title id="f911t">La elevacion de setenta y cuatro metros</title>
        <desc id="f911d">Abajo a la izquierda, el deposito inferior con la
        lamina en la cota 900. De el sale la tuberia de aspiracion, de 30
