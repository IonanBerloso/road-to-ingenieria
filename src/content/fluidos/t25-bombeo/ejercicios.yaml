        <text x="486" y="182" font-size="11" fill="var(--live)">h</text>
        <line x1="524" y1="252" x2="524" y2="318" stroke="var(--faint)" stroke-width="1" marker-start="url(#m97)" marker-end="url(#m97)"/>
        <line x1="486" y1="252" x2="528" y2="252" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="224" y1="318" x2="528" y2="318" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="520" y="290" text-anchor="end" font-size="10.5" fill="var(--faint)">3 m</text>
        <line x1="180" y1="278" x2="212" y2="278" stroke="var(--live)" stroke-width="2" marker-end="url(#m97f)"/>
      </svg>
      <figcaption>El depósito está enterrado y la boquilla dos metros sobre el suelo, así que la fuente arranca con tres metros de desnivel antes de acelerar nada. El eje vertical va a escala.</figcaption>
      </figure>
    pide: La curva de la instalación, la altura que alcanza el chorro, lo que cuesta la hora de fuente y la pérdida que hay que meter para dejarlo en ocho metros justos.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la curva de la instalación aparecen **dos** términos que van con
          $Q^{2}$ y uno con $Q^{1{,}852}$. ¿Por qué dos y no uno?
        opciones:
          - texto: Porque hay dos secciones distintas; las piezas van con la velocidad de la tubería y la boquilla con la suya
            correcta: true
            mensaje: |
              Eso es. Los factores de paso de las cuatro piezas se aplican a la
              velocidad de los 150 mm; el de la boquilla y la energía cinética
              del chorro, a la de los 80. Como las dos velocidades son
              proporcionales al caudal, los dos términos van con $Q^{2}$, pero
              con coeficientes muy distintos.
          - texto: Porque uno es la aspiración y otro la impulsión
            mensaje: |
              Las dos tuberías tienen el mismo diámetro y el mismo material, así
              que sus pérdidas se suman en un solo término. Lo que las separa no
              es dónde están, sino la sección.
          - texto: Porque uno es la energía cinética y otro la pérdida de la boquilla
            mensaje: |
              Esos dos sí van juntos —los dos con la velocidad de la boquilla—
              y se suman en un único coeficiente, $1 + 0{,}2$. El otro término
              es el de las piezas de la tubería.
          - texto: Porque las pérdidas de carga van con el cuadrado y el desnivel también
            mensaje: |
              El desnivel no depende del caudal. Son los tres metros que hay de
              la lámina de aspiración a la boquilla, y forman la ordenada en el
              origen.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          Coeficiente que multiplica a $Q^{2}$ en la curva de la instalación,
          con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.00323'
          tolerancia: 0.00004
          formato: un número, sin unidad
        distractores:
          - valor: '0.0024232'
            mensaje: |
              Solo has contado la boquilla. Las cuatro piezas de la tubería
              —válvula de pie, válvula de compuerta y tres codos— suman
              K = 4,94 sobre la velocidad de los 150 mm.
          - valor: '0.00080710'
            mensaje: |
              Solo has contado las piezas de la tubería. Falta la boquilla, que
              con 80 mm de diámetro pesa tres veces más que todas ellas juntas.
        pista: |
          Con el caudal en l/s, la altura de velocidad vale
          $2{,}019\cdot 10^{-3}\,Q^{2}$ en la boquilla y
          $1{,}634\cdot 10^{-4}\,Q^{2}$ en la tubería.
        desarrollo: |
          Del cuadro nº 24: válvula de pie con filtro K = 2,5; válvula de
          compuerta abierta K = 0,19; codo comercial de 90º de radio medio
          K = 0,75, y hay tres. En total

          $$
          \sum K = 2{,}5 + 0{,}19 + 3\cdot 0{,}75 = 4{,}94
          $$

          aplicados a la velocidad de la tubería. Y en la boquilla,
          $1 + 0{,}2 = 1{,}2$ veces su propia altura de velocidad. Sumando los
          dos:

          $$
          1{,}2\cdot 2{,}019\cdot 10^{-3} + 4{,}94\cdot 1{,}634\cdot 10^{-4} = 3{,}23\cdot 10^{-3}
          $$

          La boquilla pone 2,42 y las piezas 0,81: **tres cuartas partes del
          término cuadrático son la boquilla**, y eso que su factor de paso es
          el más pequeño de todos. Manda la sección.

          Con la fricción de los 32 m de acero estirado —C = 140— la curva
          completa es

          $$
          H_{mi} = 3 + 3{,}23\cdot 10^{-3}\,Q^{2} + 1{,}037\cdot 10^{-3}\,Q^{1{,}852}
          $$

      - tipo: calcular
        titulo: La altura que alcanza el chorro
        pregunta: |
          Altura del chorro con la bomba seleccionada, que da 64 l/s, en
          metros.
        respuesta:
          tipo: magnitud
          valor: '8.27 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '9.93 m'
            mensaje: |
              Has metido el factor de paso de la boquilla dentro de la altura
              del chorro. Ese 0,2 es lo que se **pierde** en la boquilla; el
              chorro sube solo con la velocidad que le queda al salir.
          - valor: '0.669 m'
            mensaje: |
              Has usado la velocidad de la tubería. El chorro sale por la
              boquilla, de 80 mm, donde la velocidad es tres veces y media
              mayor y su altura doce veces.
        pista: |
          El chorro sube exactamente su altura de velocidad de salida, y esa va
          con la sección de la boquilla.
        desarrollo: |
          $$
          h = \frac{v_c^{2}}{2g} = 2{,}019\cdot 10^{-3}\cdot 64^{2} = 8{,}27\ \text{m}
          $$

          Se pedían 8 y salen 8,27: la bomba de catálogo llega con margen, que
          es lo normal al elegir de una familia discreta de rodetes. Ese
          margen es justo lo que el apartado e) manda quitar.

      - tipo: calcular
        titulo: El coste de una hora de fuente
        pregunta: |
          Coste horario del funcionamiento, en euros por hora.
        respuesta:
          tipo: numero
          valor: '1.74'
          tolerancia: 0.03
          formato: un número, en euros por hora
        distractores:
          - valor: '1.57'
            mensaje: |
              Te has dejado el rendimiento del motor eléctrico. Los dos
              rendimientos se multiplican: 0,74 por 0,9 son 0,666.
          - valor: '1.16'
            mensaje: |
              Esa es la potencia útil, la que llega al agua. De la red entra
              medio kilovatio más por cada uno que se aprovecha.
        pista: |
          La potencia útil sale del caudal y de la altura del punto de
          funcionamiento; la de la red, dividiendo por los dos rendimientos.
        desarrollo: |
          $$
          P_{u} = \gamma\,Q\,H = 9800\cdot 0{,}064\cdot 18{,}52 = 11\,618\ \text{W}
          $$

          $$
          P_{abs} = \frac{11\,618}{0{,}74\cdot 0{,}9} = 17\,444\ \text{W}
          $$

          y a 0,1 euros el kWh, **1,74 euros a la hora**. Una fuente que
          funcione ocho horas al día cuesta unos catorce euros diarios de
          electricidad, y de esos, cuatro y medio son solo el rendimiento del
          grupo.

      - tipo: calcular
        titulo: La pérdida para dejarlo en ocho metros
        pregunta: |
          Pérdida de carga que hay que introducir para que el chorro alcance
          exactamente 8 m, en mca.
        respuesta:
          tipo: magnitud
          valor: '0.7 mca'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (mca o m)
        distractores:
          - valor: '0.503 mca'
            mensaje: |
              Has restado las dos alturas de la **instalación**, la de 64 l/s y
              la de 62,94. Al estrangular, la bomba se mueve por su curva y
              sube a 18,72 m; es contra ese valor contra el que hay que restar.
          - valor: '0.2 mca'
            mensaje: |
              Esa es la subida de la bomba al bajar el caudal, no la pérdida
              que hay que meter. La válvula tiene que absorber toda la
              diferencia entre lo que da la bomba y lo que pide la instalación.
        pista: |
          Primero el caudal que da 8 m justos de chorro; después, en ese
          caudal, lo que da la bomba contra lo que pide la instalación.
        desarrollo: |
          $$
          8 = 2{,}019\cdot 10^{-3}\,Q^{2} \;\Longrightarrow\; Q = 62{,}94\ \text{l/s}
          $$

          En ese caudal la instalación pide

          $$
          H_{mi} = 3 + 3{,}23\cdot 10^{-3}\cdot 62{,}94^{2} + 1{,}037\cdot 10^{-3}\cdot 62{,}94^{1{,}852} = 18{,}02\ \text{m}
          $$

          y la bomba da 18,72 m según su curva. La válvula se queda con la
          diferencia:

          $$
          h_{f,\text{válvula}} = 18{,}72 - 18{,}02 = 0{,}70\ \text{mca}
          $$

      - tipo: justificar
        pregunta: Ordena lo que cuesta ajustar el chorro de 8,27 a 8 m justos. Una pieza es falsa.
        piezas:
          - texto: 'Bajar el chorro 27 centímetros exige bajar el caudal de 64 a 62,94 l/s, poco más de un uno y medio por ciento.'
          - texto: 'Para conseguirlo hay que meter 0,70 mca de pérdida con una válvula, que es un 3,7 % de la altura que da la bomba.'
          - texto: 'Esa energía se disipa en calor: unos 432 W permanentes mientras la fuente funcione.'
          - texto: 'Y la factura no baja, porque el caudal cae un 1,7 % pero la altura de la bomba sube de 18,52 a 18,72.'
          - texto: Estrangular abarata el funcionamiento, porque al bajar el caudal la bomba consume proporcionalmente menos.
            trampa: true
            mensaje: |
              La potencia va con el producto del caudal por la altura, y aquí
              lo que baja uno lo sube la otra: la absorbida pasa de 17,44 a
              17,34 kW, medio punto porcentual. Se paga prácticamente lo mismo
              por un chorro más bajo, y 432 W de lo que se paga se están
              tirando en la válvula.
    resolucion: |
      ## Una fuente que sale con margen, y lo que cuesta quitárselo

      El enunciado pide ocho metros de chorro y la bomba de catálogo da 8,27.
      Todo el interés del problema está en esos veintisiete centímetros de
      más.

      ## a) Dos velocidades en la misma instalación

      La curva de la instalación tiene tres términos y conviene ver de dónde
      sale cada uno.

      | término | qué es | valor |
      |---|---|---|
      | 3 | de la cota −1 a la cota 2 | constante |
      | $2{,}42\cdot 10^{-3}Q^{2}$ | la boquilla, con su K y su energía cinética | 80 mm |
      | $0{,}81\cdot 10^{-3}Q^{2}$ | las cuatro piezas de la tubería | 150 mm |
      | $1{,}04\cdot 10^{-3}Q^{1{,}852}$ | los 32 m de acero estirado | 150 mm |

      Los dos términos cuadráticos existen porque hay **dos secciones**. Y su
      tamaño relativo dice lo que manda: la boquilla, con el factor de paso más
      pequeño de toda la instalación —0,2 contra los 2,5 de la válvula de
      pie—, aporta tres veces más que las cuatro piezas juntas. La sección
      entra al cuadrado y $(150/80)^{4} = 12$.

      $$
      H_{mi} = 3 + 3{,}23\cdot 10^{-3}\,Q^{2} + 1{,}037\cdot 10^{-3}\,Q^{1{,}852}
      $$

      ## b), c) y d) El punto de funcionamiento

      Con la INP 125/315 de rodete 280 mm, la curva de la bomba corta a la de
      la instalación en 64 l/s con 18,5 m y un rendimiento del 74 %. Y ahí el
      chorro sube

      $$
      h = 2{,}019\cdot 10^{-3}\cdot 64^{2} = 8{,}27\ \text{m}
      $$

      La comprobación de que la lectura del catálogo está bien hecha es que la
      curva de la instalación evaluada en 64 l/s da 18,52 m, que es justo la
      altura que el catálogo asigna a la bomba en ese caudal.

      El coste sale de encadenar los dos rendimientos:

      $$
      P_{abs} = \frac{9800\cdot 0{,}064\cdot 18{,}52}{0{,}74\cdot 0{,}9} = 17{,}44\ \text{kW} \;\longrightarrow\; 1{,}74\ \text{euros/h}
      $$

      Merece la pena mirar el reparto: de esos 17,44 kW, 11,6 llegan al agua y
      **5,8 se pierden en la bomba y el motor**. Un tercio. Y del agua, la
      mayor parte se va en acelerar el chorro, que es para lo que existe la
      fuente.

      ## e) Los veintisiete centímetros

      Para 8 m justos hacen falta 62,94 l/s. Ahí la instalación pide 18,02 m y
      la bomba da 18,72, así que la válvula tiene que disipar **0,70 mca**.

      La proporción es lo instructivo: **un 1,7 % menos de caudal cuesta un
      3,7 % de la altura**. Esos 0,70 m sobre 62,94 l/s son 432 W que se
      convierten en calor dentro de la válvula, permanentemente.

      Y la factura no baja. La potencia absorbida pasa de 17,44 a 17,34 kW
      —medio punto porcentual—, porque lo que se ahorra en caudal lo devuelve
      la bomba en altura al moverse por su curva. Se paga prácticamente lo
      mismo por un chorro veintisiete centímetros más bajo.

      Es exactamente la decisión que este problema enseña a plantear. Si los
      ocho metros son un requisito de proyecto, se estrangula y se asume.
      Si son una cifra aproximada, lo barato es dejar la fuente en 8,27 y no
      poner la válvula.

  - id: ejflu25-col98-el-chorro-de-quince-metros-y-lo-que-cuesta-la-hora
    titulo: El chorro de quince metros, y lo que cuesta la hora
    fuente: Ejercicio 9.8 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En la instalación de la figura se quiere obtener un chorro de 15 m de
      altura. La tubería es de acero comercial de 150 mm de diámetro
      concluyendo en la boquilla de 80 mm de diámetro. La longitud equivalente
      de las piezas especiales de la instalación es de 12 m y el coste del kWh
      es de 0,1 euros. Se pide:

      **a)** Expresión analítica de la cc de la instalación.

      **b)** Construcción en papel adecuado de la cci.

      **c)** Selección de la tb más conveniente entre aquellas cuyas cc se
      adjuntan.

      **d)** Caudal y altura manométrica proporcionada por la tb seleccionada,
      así como potencia absorbida por la misma.

      **e)** Altura que alcanzará el chorro con la tb seleccionada.

      **f)** Costo por hora del funcionamiento de la instalación.

      **Datos:** Longitud de la tubería de aspiración = 25 m; ídem de la
      impulsión = 75 m.

      **Nota nuestra:** el anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí. La turbobomba que sale del
      apartado c) es la **INP 125/400 a 1450 rpm con rodete de 408 mm**, y su
      punto de funcionamiento con esta instalación es **87 l/s con 41,5 m y un
      rendimiento del 72 %**. Todo lo demás sale de ahí sin volver al catálogo.

