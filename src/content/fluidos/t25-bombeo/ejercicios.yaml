        <path d="M400,134 V300" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="400" cy="212" r="15" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="400" y="217" text-anchor="middle" font-size="12" fill="var(--ink)">F</text>
        <text x="386" y="176" text-anchor="end" font-size="10" fill="var(--faint)">2 · 20 m · 60 mm</text>
        <text x="386" y="262" text-anchor="end" font-size="10" fill="var(--faint)">filtro</text>
        <path d="M400,134 H560 V300" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M462,124 L478,144 L478,124 L462,144 Z" fill="var(--panel)" stroke="var(--flag)" stroke-width="2"/>
        <text x="470" y="112" text-anchor="middle" font-size="11.5" fill="var(--flag)">V</text>
        <text x="550" y="176" text-anchor="end" font-size="10" fill="var(--faint)">3 · 30 m · 60 mm</text>
        <path d="M560,300 H100 V96" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="400" cy="300" r="4" fill="var(--ink)"/>
        <text x="400" y="320" text-anchor="middle" font-size="11.5" fill="var(--ink)">M</text>
        <text x="230" y="320" text-anchor="middle" font-size="10" fill="var(--faint)">4 · 70 m · 80 mm</text>
        <line x1="330" y1="122" x2="360" y2="122" stroke="var(--live)" stroke-width="2" marker-end="url(#m915)"/>
        <line x1="300" y1="288" x2="270" y2="288" stroke="var(--live)" stroke-width="2" marker-end="url(#m915)"/>
      </svg>
      <figcaption>El agua sale de la piscina, pasa por la bomba y en el nudo N se parte en dos: una rama atraviesa el filtro y la otra lo esquiva por la válvula V. Las dos se juntan en M y vuelven a la piscina. Por eso el filtrado es «parcial».</figcaption>
      </figure>
    pide: La altura que hace falta para filtrar cuatro litros por segundo, la curva con el by-pass cerrado y la potencia de la bomba elegida.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre las tuberías 2 y 3, y para qué sirve la
          válvula V?
        opciones:
          - texto: Están en paralelo entre N y M; la 2 pasa por el filtro y la 3 lo esquiva, y V regula cuánta agua se filtra
            correcta: true
            mensaje: |
              Eso es, y de ahí el «filtrado parcial» del enunciado. Con V
              abierta el agua se reparte y solo una fracción pasa por el
              filtro; con V cerrada se filtra todo el caudal, pero la
              instalación pide mucha más altura.
          - texto: Están en serie; el agua pasa primero por el filtro y luego por la válvula
            mensaje: |
              Si estuvieran en serie, cerrar V pararía la instalación entera.
              El enunciado pide precisamente la curva **con V cerrada**, así
              que tiene que haber otro camino.
          - texto: La 3 es la de retorno a la piscina
            mensaje: |
              La de retorno es la 4, que va de M a la piscina. La 3 va de N a M
              como la 2, solo que por el otro lado.
          - texto: V sirve para vaciar la piscina
            mensaje: |
              V está en un tramo interior del circuito, entre dos nudos que
              siempre tienen agua. Lo que hace es repartir caudal entre las dos
              ramas.

      - tipo: calcular
        titulo: La curva con el by-pass cerrado
        pregunta: |
          Coeficiente que multiplica a $Q^{1{,}852}$ en la curva de la
          instalación con V cerrada, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.2238'
          tolerancia: 0.004
          formato: un número, sin unidad
        distractores:
          - valor: '0.1947'
            mensaje: |
              Te has dejado el 15 % de pérdidas menores. El enunciado las
              evalúa como un porcentaje de las de tubería, así que se multiplica
              todo por 1,15.
          - valor: '0.0861'
            mensaje: |
              Solo has contado la tubería 2. Con V cerrada el agua recorre la
              1, la 2 y la 4; las dos de 80 mm son 130 m y también pierden.
        pista: |
          Con V cerrada el circuito es 1, 2 y 4 en serie. El hierro galvanizado
          tiene 0,015 cm de rugosidad, y con 60 y 80 mm los dos diámetros caen
          en la misma banda del cuadro nº 25.
        desarrollo: |
          Con $\varepsilon = 0{,}015$ cm, la relación $\varepsilon/D$ vale
          $1{,}9\cdot 10^{-3}$ en los 80 mm y $2{,}5\cdot 10^{-3}$ en los 60:
          las dos en la banda de **C = 120**.

          $$
          J_1(80) = 9{,}22\cdot 10^{-4} \qquad J_1(60) = 3{,}74\cdot 10^{-3}
          $$

          Con V cerrada el agua recorre las tuberías 1, 2 y 4:

          $$
          k = 1{,}15\left[9{,}22\cdot 10^{-4}\,(60+70) + 3{,}74\cdot 10^{-3}\cdot 20\right] = 0{,}2238
          $$

          Y el filtro añade su propio término: 2940 Pa entre 9800 son
          $0{,}3\,Q^{2}$ metros. La curva completa es

          $$
          H_{mi} = 0{,}2238\,Q^{1{,}852} + 0{,}3\,Q^{2}
          $$

          **Sin término independiente**, porque el circuito devuelve el agua a
          la misma piscina de la que la saca: no hay desnivel que vencer, solo
          rozamiento.

      - tipo: calcular
        titulo: La altura para filtrar cuatro litros por segundo
        pregunta: |
          Altura manométrica que debe aportar la bomba para que se filtren
          4 l/s con la válvula V abierta, en mca.
        respuesta:
          tipo: magnitud
          valor: '19.43 mca'
          tolerancia: 0.02
          formato: una altura con su unidad (mca o m)
        distractores:
          - valor: '7.72 mca'
            mensaje: |
              Esa es la altura con la válvula **cerrada** y 4 l/s circulando.
              Con V abierta pasa mucha más agua por la instalación —casi 12
              l/s— y las tuberías 1 y 4 pierden en consecuencia.
          - valor: '6.48 mca'
            mensaje: |
              Te has dejado el filtro. Con 4 l/s pierde 4,8 m él solo, más de
              cuatro veces lo que pierde la tubería que lo lleva.
        pista: |
          Las dos ramas entre N y M tienen la misma pérdida de carga. Con 4 l/s
          por el filtro se calcula ese salto, y de ahí sale el caudal de la
          rama 3.
        desarrollo: |
          Por la rama del filtro, con 4 l/s:

          $$
          \Delta H_{NM} = 1{,}15\cdot 3{,}74\cdot 10^{-3}\cdot 20\cdot 4^{1{,}852} + 0{,}3\cdot 4^{2} = 1{,}12 + 4{,}80 = 5{,}92\ \text{m}
          $$

          El by-pass tiene el mismo salto y 30 m de la misma tubería, así que

          $$
          Q_3 = \left(\frac{5{,}92}{1{,}15\cdot 3{,}74\cdot 10^{-3}\cdot 30}\right)^{1/1{,}852} = 7{,}89\ \text{l/s}
          $$

          El caudal total es $4 + 7{,}89 = 11{,}89$ l/s, y con él las tuberías 1
          y 4 pierden 13,5 m. Sumando el salto entre nudos,

          $$
          H_{mi} = 13{,}51 + 5{,}92 = 19{,}43\ \text{mca}
          $$

          Fíjate en el reparto de caudales: **por el by-pass va el doble que por
          el filtro**, y eso que su tubería es un 50 % más larga. Es lo que
          hace el filtro con sus 4,8 m de pérdida.

      - tipo: calcular
        titulo: La potencia de la bomba elegida
        pregunta: |
          Potencia bruta que absorbe la bomba en el punto de funcionamiento del
          apartado d), en kW. Ahí el caudal es de 13,3 l/s, la altura 79,5 mca
          y el rendimiento 66 %.
        respuesta:
          tipo: magnitud
          valor: '15.7 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '10.36 kW'
            mensaje: |
              Esa es la potencia útil, la que llega al agua. La bruta se obtiene
              dividiendo por el rendimiento.
          - valor: '6.84 kW'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. La bruta es
              siempre la mayor de las dos.
        pista: |
          La potencia útil sale del caudal y la altura; la bruta, dividiendo por
          el rendimiento.
        desarrollo: |
          $$
          P = \frac{\gamma\,Q\,H}{\eta} = \frac{9800\cdot 0{,}0133\cdot 79{,}5}{0{,}66} = 15\,700\ \text{W}
          $$

          Y la comprobación de que la bomba está bien leída del catálogo es que
          la curva de la instalación con V cerrada, calculada sin abrirlo, vale

          $$
          0{,}2238\cdot 13{,}3^{1{,}852} + 0{,}3\cdot 13{,}3^{2} = 27{,}0 + 53{,}1 = 80{,}1\ \text{m}
          $$

          en ese caudal, contra los 79,5 que da el catálogo.

      - tipo: justificar
        pregunta: Ordena qué le hace al sistema abrir o cerrar la válvula V. Una pieza es falsa.
        piezas:
          - texto: 'Con V abierta el caudal se reparte entre el filtro y el by-pass, y con 4 l/s filtrados circulan casi 12 en total.'
          - texto: 'Con V cerrada todo el caudal atraviesa el filtro, y como el filtro pierde 0,3·Q² la instalación se empina muchísimo.'
          - texto: 'Por eso la altura pasa de 19,43 mca filtrando 4 l/s a 80 mca filtrando 13,3.'
          - texto: 'Es decir, filtrar más del triple de caudal cuesta cuatro veces más altura, y por eso el sistema se llama de filtrado parcial.'
          - texto: Cerrar V reduce el caudal total, así que la bomba consume menos que con la válvula abierta.
            trampa: true
            mensaje: |
              Depende de la bomba, no de la válvula: el punto de funcionamiento
              lo fija el corte de las dos curvas. Con V cerrada la instalación
              es más exigente, sí, pero la bomba del apartado c) se elige
              precisamente para dar 13 l/s en esas condiciones, y ahí absorbe
              15,7 kW. Comparar consumos exige comparar puntos de
              funcionamiento, no curvas de instalación.
    resolucion: |
      ## Un circuito cerrado, sin desnivel que vencer

      La primera cosa que hay que ver en este problema es que **la curva de la
      instalación no tiene término independiente**. El agua sale de la piscina
      y vuelve a la misma piscina, así que no hay altura geométrica ni presión
      que vencer: todo lo que da la bomba se gasta en rozamiento y en el
      filtro.

      La segunda es la topología. Entre los nudos N y M hay **dos caminos en
      paralelo**: la tubería 2, que atraviesa el filtro, y la 3, que lo esquiva
      por la válvula V. De ahí lo de «filtrado parcial».

      ## b) Con el by-pass cerrado

      Todo el caudal pasa por 1, 2 y 4. Con hierro galvanizado, C = 120 en los
      dos diámetros:

      $$
      k = 1{,}15\left[9{,}22\cdot 10^{-4}\cdot 130 + 3{,}74\cdot 10^{-3}\cdot 20\right] = 0{,}2238
      $$

      $$
      H_{mi} = 0{,}2238\,Q^{1{,}852} + 0{,}3\,Q^{2}
      $$

      El 0,3 sale del filtro: 2940 Pa entre 9800 son 0,3 metros por cada l/s al
      cuadrado.

      ## a) Con el by-pass abierto

      Aquí está lo interesante. Fijando 4 l/s por el filtro, el salto entre N y
      M queda determinado:

      $$
      \Delta H_{NM} = 1{,}12 + 4{,}80 = 5{,}92\ \text{m}
      $$

      —de los cuales **el filtro pone 4,8 y la tubería solo 1,1**—. El by-pass
      tiene que salvar ese mismo salto con 30 m de tubería y sin filtro, así
      que se lleva 7,89 l/s: **casi el doble que el filtro**.

      Con 11,89 l/s en total, las tuberías 1 y 4 pierden 13,5 m, y la bomba
      tiene que dar 19,43 mca.

      ## Lo que cuesta filtrarlo todo

      | | caudal filtrado | caudal total | altura |
      |---|---|---|---|
      | V abierta | 4 l/s | 11,9 l/s | 19,4 m |
      | V cerrada | 13,3 l/s | 13,3 l/s | 80,1 m |

      Triplicar el caudal filtrado multiplica por cuatro la altura. La razón es
      el filtro: su pérdida va con $Q^{2}$ y pasa de 4,8 a 53 metros. **Con V
      cerrada, dos tercios de todo lo que da la bomba se los queda el filtro.**

      Y ahí está la decisión de proyecto que el enunciado plantea sin decirla:
      un sistema de filtrado parcial no filtra menos por descuido, sino porque
      filtrar el caudal entero cuesta cuatro veces más energía. El agua de una
      piscina se recircula muchas veces al día; lo que importa es el volumen
      filtrado al cabo del día, no la fracción filtrada en cada pasada.

  - id: ejflu25-col916-el-medidor-de-codo-y-el-manometro-de-mercurio
    titulo: El medidor de codo, y el manómetro que decide el problema
    fuente: Ejercicio 9.16 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En la instalación de bombeo de la figura, por razones económicas, se
      instala un medidor de codo y un piezómetro a la entrada de la bomba. Se
      ensaya el medidor de codo y se obtiene la curva Q-h, gráficamente
      representada. El líquido trasvasado es agua. Estudiar la posible
      cavitación de la bomba.

      **Datos:** diámetro de la tubería = 50 mm; h = 0,3 m; h₁ = 0,14 m;
      h₂ = 0,49 m; presión de vapor = 0,33 mca (absoluta); NPSH requerido =
      2 mca.

      **Cómo se lee la curva de tarado.** El ensayo del codo da cuatro puntos
      —10 cm → 0,42 l/s; 20 → 1,8; 30 → 4,0; 40 → 7,0— y la lectura del
      problema, h = 30 cm, cae justo sobre uno de ellos: **Q = 4 l/s**.

      **Y cómo se lee el manómetro.** En el dibujo, h₁ va del eje de la tubería
      hasta el mercurio de la rama conectada a ella, y h₂ es el desnivel entre
      las dos superficies de mercurio, con la rama de la tubería **más alta**
      que la abierta. El último paso comprueba que esa lectura es la única
      compatible con la instalación. La presión atmosférica no la da el
      enunciado: se toma la del corpus, 98 kPa = 10 mca, y el cuarto paso mide
      qué pasaría con otra.

      <figure class="figura-examen">
      <svg viewBox="0 0 600 400" role="img" width="600" height="400"
           aria-labelledby="f916t f916d">
        <title id="f916t">La aspiracion con el medidor de codo y el manometro de mercurio</title>
        <desc id="f916d">Abajo a la izquierda, el deposito inferior con la
        lamina en la cota 900. De el sale la tuberia de aspiracion, que sube y
        gira en un codo; del codo cuelga un manometro diferencial en U que
        marca un desnivel h. La tuberia sigue en horizontal hasta la bomba, en
        la cota 905. Antes de la bomba baja un tubo hasta un manometro de
        mercurio en U, abierto por la rama izquierda: h uno es la distancia del
        eje de la tuberia a la superficie de mercurio de la rama conectada, y
        h dos el desnivel entre las dos superficies, con la conectada por
        encima. De la bomba sale la impulsion hacia el deposito superior, en la
        cota 950.</desc>
        <defs>
          <marker id="m916" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
          <marker id="m916f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
