        <desc id="f915d">Arriba a la izquierda, la piscina. De ella sale la
        tuberia hasta la bomba B, y de la bomba la tuberia 1, de 60 metros y 80
        milimetros, hasta el nudo N. De N salen dos ramas en paralelo hasta el
        nudo M, que esta abajo: la 2, de 20 metros y 60 milimetros, que baja
        atravesando el filtro F, y la 3, de 30 metros y 60 milimetros, que va
        por la derecha pasando por la valvula V. De M sale la tuberia 4, de 70
        metros y 80 milimetros, que devuelve el agua a la piscina.</desc>
        <defs>
          <marker id="m915" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M60,40 H230 V96 H60 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M60,40 H230 V96 H60 Z" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="145" y="72" text-anchor="middle" font-size="11.5" fill="var(--ink)">piscina</text>
        <path d="M210,96 V134 H250" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="264" cy="134" r="13" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="264" y="164" text-anchor="middle" font-size="11.5" fill="var(--ink)">B</text>
        <path d="M277,134 H400" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="400" cy="134" r="4" fill="var(--ink)"/>
        <text x="400" y="120" text-anchor="middle" font-size="11.5" fill="var(--ink)">N</text>
