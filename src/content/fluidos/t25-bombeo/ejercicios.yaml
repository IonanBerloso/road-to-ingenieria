      <figcaption>Un sobrepresor que reparte a dos servicios muy distintos: un riego que descarga a la atmósfera por cuatro boquillas y un depósito presurizado que sirve de regulador. El eje vertical va a escala.</figcaption>
      </figure>
    pide: La presión del sobrepresor, el caudal del riego, si se pueden conseguir 65 l/s en E y la potencia de la bomba que alimenta todo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres tuberías saliendo del nudo N y solo un caudal conocido, los
          50 l/s que van a E. ¿Por dónde se entra?
        opciones:
          - texto: Por la rama 3, que con su caudal y la cota piezométrica de E da la del nudo
            correcta: true
            mensaje: |
              Eso es. E tiene su cota y su presión, así que su cota
              piezométrica está fijada; con los 50 l/s se calcula la pérdida de
              la 3 y se sube hasta el nudo. De ahí sale todo lo demás.
          - texto: Por la rama 2, que descarga a la atmósfera en las boquillas
            mensaje: |
              Descarga a la atmósfera, sí, pero su caudal es incógnita y la
              energía cinética de las boquillas depende de él. Esa rama solo se
              puede resolver cuando se conoce la carga del nudo.
          - texto: Por el sobrepresor C, cuya presión hay que calcular
            mensaje: |
              La presión de C es justamente lo que pide el apartado a). Ese
              camino va al revés.
          - texto: Planteando las tres ecuaciones a la vez y resolviendo el sistema
            mensaje: |
              Se puede, pero no hace falta. La red es **abierta** y hay un
              extremo con el caudal fijado, así que se recorre en cadena sin
              resolver ningún sistema.

      - tipo: calcular
        titulo: La pérdida de la rama del regulador
        pregunta: |
          Pérdida de carga de la tubería 3 con los 50 l/s, en mca.
        respuesta:
          tipo: magnitud
          valor: '6.42 mca'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (mca o m)
        distractores:
          - valor: '5.6 mca'
            mensaje: |
              Has usado C = 140. Con acero comercial —rugosidad 0,006 cm— y
              200 mm, la relación $\varepsilon/D$ vale $3\cdot 10^{-4}$, que en
              el cuadro nº 25 cae ya en la banda de C = 130. El 140 es para la
              tubería 1, que es de 300.
          - valor: '0.78 mca'
            mensaje: |
              Has usado el diámetro de la tubería 1, que es de 300 mm. Las
              ramas 2 y 3 son de 200.
        pista: |
          Acero comercial de 200 mm da $\varepsilon/D = 3\cdot 10^{-4}$, y con
          eso el cuadro nº 25 fija el coeficiente de Hazen-Williams.
        desarrollo: |
          Con **C = 130** y 200 mm, $J_1 = 9{,}17\cdot 10^{-6}$:

          $$
          h_{f3} = 9{,}17\cdot 10^{-6}\cdot 500\cdot 50^{1{,}852} = 6{,}42\ \text{mca}
          $$

          Y como la cota piezométrica de E son
          $625 + 20 = 645$ mca —los 2 kg/cm² son 20 m de columna—, la del nudo
          resulta

          $$
          B_N = 645 + 6{,}42 = 651{,}42\ \text{mca}
          $$

      - tipo: calcular
        titulo: El caudal que va al riego
        pregunta: |
          Caudal que circula por la tubería 2 hacia las boquillas, en litros por
          segundo.
        respuesta:
          tipo: magnitud
          valor: '78.47 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '95.81 l/s'
            mensaje: |
              Te has dejado las boquillas. Con 50 mm cada una y el caudal
              repartido entre cuatro, su energía cinética más la pérdida de
              paso valen 1,3 veces la altura de velocidad de salida, y eso pesa
              casi un tercio de la ecuación.
          - valor: '141.16 l/s'
            mensaje: |
              Te has dejado la fricción de los 500 m de la tubería 2. Es el
              término más grande de los dos.
        pista: |
          Del nudo a la salida de las boquillas hay tres cosas: la cota 630, la
          pérdida de la tubería 2 y los 1,3 de la boquilla sobre su altura de
          velocidad.
        desarrollo: |
          Cada boquilla lleva la cuarta parte del caudal por una sección de
          50 mm, así que con Q2 en l/s

          $$
          v_{boq} = 0{,}1273\,Q_2 \qquad \frac{v_{boq}^{2}}{2g} = 8{,}271\cdot 10^{-4}\,Q_2^{2}
          $$

          y la ecuación entre el nudo y la salida es

          $$
          651{,}42 = 630 + 1{,}3\cdot 8{,}271\cdot 10^{-4}\,Q_2^{2} + 9{,}17\cdot 10^{-6}\cdot 500\,Q_2^{1{,}852}
          $$

          $$
          21{,}42 = 1{,}075\cdot 10^{-3}\,Q_2^{2} + 4{,}585\cdot 10^{-3}\,Q_2^{1{,}852}
          $$

          Iterando sale **Q2 = 78,47 l/s**, y con él una velocidad de salida por
          boquilla de 9,99 m/s, prácticamente 10.

      - tipo: calcular
        titulo: La presión del sobrepresor
        pregunta: |
          Presión a la que debe estar el depósito sobrepresor C, en kg/cm².
        respuesta:
          tipo: magnitud
          valor: '3.408 kg/cm2'
          tolerancia: 0.02
          formato: una presión con su unidad (kg/cm², mca o kPa)
        distractores:
          - valor: '3.142 kg/cm2'
            mensaje: |
              Te has dejado la pérdida de la tubería 1. Son solo 2,7 m, pero
              van a favor de C, no en contra.
          - valor: '2.875 kg/cm2'
            mensaje: |
              Has restado la pérdida de la tubería 1 en vez de sumarla. El agua
              va de C al nudo, así que C tiene que estar **por encima** del
              nudo en cota piezométrica.
        pista: |
          Por la tubería 1 pasa la suma de los dos servicios, y es la única de
          300 mm, así que su coeficiente de Hazen-Williams no es el mismo.
        desarrollo: |
          Por la 1 circula $Q_1 = 78{,}47 + 50 = 128{,}47$ l/s. Con 300 mm,
          $\varepsilon/D = 2\cdot 10^{-4}$ y por tanto **C = 140**, con
          $J_1 = 1{,}10\cdot 10^{-6}$:

          $$
          h_{f1} = 1{,}10\cdot 10^{-6}\cdot 300\cdot 128{,}47^{1{,}852} = 2{,}66\ \text{mca}
          $$

          Y como el agua va de C al nudo,

          $$
          620 + \frac{p_C}{\gamma} = 651{,}42 + 2{,}66 \;\Longrightarrow\; \frac{p_C}{\gamma} = 34{,}08\ \text{mca}
          $$

          es decir **3,408 kg/cm²**. Fíjate en el tamaño de esa pérdida: 2,66 m
          en trescientos metros, con el caudal mayor de toda la instalación.
          Los 300 mm de esa tubería hacen que el tramo que más caudal lleva sea
          el que menos pierde.

      - tipo: calcular
        titulo: La potencia de la bomba
        pregunta: |
          Potencia absorbida por la bomba en el punto de funcionamiento del
          apartado d), en kW. Ahí el caudal es de 144 l/s, la altura 67,5 m y
          el rendimiento 80,4 %.
        respuesta:
          tipo: magnitud
          valor: '118.5 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '95.3 kW'
            mensaje: |
              Esa es la potencia útil. La absorbida se obtiene dividiendo por
              el rendimiento.
          - valor: '76.6 kW'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. La
              absorbida es siempre la mayor de las dos.
        pista: |
          La potencia útil sale del caudal y la altura; la absorbida,
          dividiendo por el rendimiento.
        desarrollo: |
          $$
          P = \frac{\gamma\,Q\,H}{\eta} = \frac{9800\cdot 0{,}144\cdot 67{,}5}{0{,}804} = 118\,478\ \text{W}
          $$

          y el coste del metro cúbico, con 144 l/s —que son 518,4 m³ por hora—
          y el kWh a 0,1 euros, sale de dividir 11,85 euros a la hora entre
          esos 518,4 m³: **0,023 euros el metro cúbico**.

          La comprobación de que la bomba está bien leída es que la curva de la
          instalación, calculada sin abrir el catálogo, vale
          $55 + 1{,}256\cdot 10^{-3}\cdot 144^{1{,}852} = 67{,}5$ m en ese
          caudal.

      - tipo: justificar
        pregunta: Ordena por qué no se pueden llevar 65 l/s a E sin tocar nada. Una pieza es falsa.
        piezas:
          - texto: 'Con 65 l/s la pérdida de la tubería 3 sube de 6,42 a 10,44 m, así que el nudo tendría que estar en 655,44.'
          - texto: 'Pero el sobrepresor está en 654,08 de cota piezométrica, contando sus 34,08 m de presión sobre la cota 620.'
          - texto: 'Es decir, el nudo tendría que estar más alto que el depósito que lo alimenta, y eso no puede ser.'
          - texto: 'Para conseguirlo hay que subir la presión de C, que es el único parámetro libre del sistema.'
          - texto: Bastaría con cerrar parcialmente la rama 2 para desviar caudal hacia la 3, sin tocar la presión de C.
            trampa: true
            mensaje: |
              Estrangular la 2 sí desvía caudal, pero **sube la cota del nudo**,
              y con el nudo más alto llega **menos** agua a E, no más. La rama 3
              va del nudo hacia abajo: cuanto más alto el nudo, más caudal —eso
              sí—, pero la carga que lo empuja sale de C, y C no da para tanto.
              Lo que hay que comprobar es siempre si el depósito de cabecera
              tiene carga suficiente, y aquí no la tiene.
    resolucion: |
      ## Una red abierta con dos servicios muy distintos

      El sobrepresor C alimenta dos cosas que no se parecen en nada: un riego
      que descarga a la atmósfera por cuatro boquillas y un depósito
      presurizado que hace de regulador. La única rama con caudal fijado es la
      del regulador, y por ahí se entra.

      ## a) y b) De E hacia atrás

      La cota piezométrica de E es su cota más su presión:
      $625 + 20 = 645$ mca. Subiendo por la tubería 3 con los 50 l/s,

      $$
      h_{f3} = 9{,}17\cdot 10^{-6}\cdot 500\cdot 50^{1{,}852} = 6{,}42 \;\Longrightarrow\; B_N = 651{,}42\ \text{mca}
      $$

      Con el nudo conocido, la rama del riego se resuelve sola. Cada boquilla
      lleva un cuarto del caudal por 50 mm, y su factor de paso y su energía
      cinética suman 1,3 veces la altura de velocidad:

      $$
      21{,}42 = 1{,}075\cdot 10^{-3}\,Q_2^{2} + 4{,}585\cdot 10^{-3}\,Q_2^{1{,}852} \;\Longrightarrow\; Q_2 = 78{,}47\ \text{l/s}
      $$

      con 9,99 m/s en cada boquilla. Y sumando los dos servicios,
      $Q_1 = 128{,}47$ l/s, que por la tubería 1 —la única de 300 mm— solo
      pierde 2,66 m en trescientos metros.

      $$
      \frac{p_C}{\gamma} = 651{,}42 + 2{,}66 - 620 = 34{,}08\ \text{mca} = 3{,}408\ \text{kg/cm}^{2}
      $$

      **Merece la pena mirar el reparto de pérdidas.** La tubería 1 lleva
      128 l/s y pierde 2,66 m; la 3 lleva 50 y pierde 6,42; la 2 lleva 78 y
      pierde 14,8. La que más caudal transporta es la que menos pierde, porque
      es la única gruesa. En Hazen-Williams el diámetro pesa a la 4,87, y aquí
      se ve de una tacada.

      ## c) El límite del sistema

      Para llevar 65 l/s a E harían falta 10,44 m de pérdida en la 3, y por
      tanto un nudo en 655,44. Pero con los 34,08 m de presión que tiene C, su
      cota piezométrica es 654,08: **el nudo tendría que estar más alto que el
      depósito que lo alimenta**. No se puede, y la única salida es subir la
      presión del sobrepresor.

      Es la comprobación que este apartado enseña a hacer: antes de calcular un
      caudal nuevo, mirar si la cabecera tiene carga para él.

      ## d) y e) La bomba, y el caudal exacto

      Con C a 3,5 kg/cm² su cota piezométrica es 655, y la curva de la
      instalación de bombeo queda

      $$
      H_{mi} = 55 + 1{,}256\cdot 10^{-3}\,Q^{1{,}852}
      $$

      —los 137 m equivalentes salen de los 100 de tubería más 10 de la válvula
      de pie, 10 de los dos codos, 15 del antirretorno y 2 de la compuerta—.

      El punto de funcionamiento cae en 144 l/s con 67,5 m, y la comprobación
      es que la curva de la instalación evaluada ahí da exactamente esos 67,5.
      La bomba absorbe 118,5 kW y el agua sale a **0,023 euros el metro
      cúbico**.

      Pero se querían 125 l/s, no 144. Para bajar al caudal exacto hay dos
      caminos, y el enunciado los pide los dos:

      - **cerrar parcialmente la válvula de compuerta**, que a 125 l/s tendría
        que disipar $70 - 64{,}6 = 5{,}4$ mca;
      - o **subir la presión del sobrepresor** en esos mismos 5,4 mca, es decir
        0,54 kg/cm² más.

      No son equivalentes. La válvula tira los 5,4 m en calor; subir la presión
      de C los aprovecha en el servicio. Cuando hay un sobrepresor de por
      medio, regular con él es casi siempre mejor que estrangular.

  - id: ejflu25-col94-la-bomba-a-dos-mil-metros-de-altitud
    titulo: La bomba a dos mil metros de altitud
    fuente: Ejercicio 9.4 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      El caudal máximo que se prevé en una impulsión es de 28 l/s. Se ha
      seleccionado una bomba cuya característica NPSH requerido es la indicada
      en la figura. Si la temperatura máxima prevista en el agua es de 20 ºC
      (Pv abs = 0,023 bar), hallar la cota del eje de la bomba (ZD) si la
      instalación está a 2000 m sobre el nivel del mar
      (Patm abs = 0,795 bar). La pérdida de carga en la tubería de aspiración,
      incluidos los accesorios, es de 0,2 mca.

      **Ayuda:** Adoptar como criterio NPSH seguridad = 0,5 mca.

      **Nota nuestra:** la figura del enunciado es la curva de NPSH requerido
      del fabricante, que no se puede reproducir aquí. La lectura que hace la
      propia resolución del boletín es **NPSH requerido = 6,5 mca para
      28 l/s**, y es la que se usa abajo. La figura que sí dibujamos es la de
      la instalación, para fijar respecto de qué se mide la altura Z.

      <figure class="figura-examen">
      <svg viewBox="0 0 520 300" role="img" width="520" height="300"
           aria-labelledby="f94t f94d">
        <title id="f94t">La bomba por encima de la lamina del deposito</title>
        <desc id="f94d">A la izquierda, el deposito de aspiracion, abierto a la
        atmosfera, con su lamina libre en la cota 2000. De el sale la tuberia
        de aspiracion, que sube hasta el eje de la bomba, situado una altura Z
        por encima de esa lamina. Esa Z es la incognita, y la figura marca que
        se mide de la lamina al eje.</desc>
        <defs>
          <marker id="m94" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
          <marker id="m94f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M40,190 H190 V262 H40 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M40,174 V262 H190 V174" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="40" y1="190" x2="190" y2="190" stroke="var(--live)" stroke-width="1.6"/>
        <text x="115" y="226" text-anchor="middle" font-size="11.5" fill="var(--ink)">agua a 20 °C</text>
        <text x="115" y="166" text-anchor="middle" font-size="10.5" fill="var(--faint)">lámina libre · cota 2000</text>
        <path d="M120,240 V250 H240 V130" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="254" cy="130" r="16" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M270,130 H420" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <text x="254" y="102" text-anchor="middle" font-size="11" fill="var(--ink)">bomba</text>
        <text x="286" y="120" font-size="10" fill="var(--faint)">impulsión · 28 l/s</text>
        <text x="150" y="284" text-anchor="middle" font-size="10" fill="var(--faint)">aspiración · pérdida 0,2 mca</text>
        <line x1="330" y1="190" x2="330" y2="130" stroke="var(--live)" stroke-width="1" marker-start="url(#m94)" marker-end="url(#m94)"/>
        <line x1="194" y1="190" x2="334" y2="190" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="272" y1="130" x2="334" y2="130" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="338" y="164" font-size="12" fill="var(--live)">Z</text>
        <text x="338" y="180" font-size="10" fill="var(--faint)">la incógnita</text>
        <line x1="196" y1="262" x2="224" y2="256" stroke="var(--live)" stroke-width="2" marker-end="url(#m94f)"/>
      </svg>
      <figcaption>La altura Z se mide de la lámina libre al eje de la bomba, y es lo único que el proyectista puede elegir. Todo lo demás —la altitud, la temperatura del agua, la tubería y la bomba— viene dado.</figcaption>
      </figure>
    pide: A qué altura sobre la lámina se puede poner el eje de la bomba sin que cavite.
    pasos:
      - tipo: reconocer
        pregunta: |
          El NPSH disponible mide la energía que le sobra al agua en la
          aspiración por encima de su tensión de vapor. ¿Qué términos lo forman
          y con qué signo?
        opciones:
          - texto: La presión atmosférica, menos la altura del eje, menos la pérdida de aspiración, menos la tensión de vapor
            correcta: true
            mensaje: |
              Eso es. Solo hay un término que suma —la atmósfera, que es la que
              empuja el agua hacia arriba— y tres que restan. Subir la bomba,
              apretar la tubería o calentar el agua reducen los tres el margen
              disponible.
          - texto: La presión atmosférica más la altura del eje, menos las pérdidas
            mensaje: |
              La altura resta. La bomba está **por encima** de la lámina, así
              que el agua tiene que subir hasta ella, y esa subida se la paga
              la atmósfera.
          - texto: La altura manométrica de la bomba menos la tensión de vapor
            mensaje: |
              La altura manométrica es lo que la bomba **da**; el NPSH mira lo
              que le llega a su entrada. Son dos cosas independientes: una
              bomba de mucha altura puede cavitar igual.
          - texto: La presión atmosférica menos la altura del eje, sin más
            mensaje: |
              Faltan dos. La pérdida de la tubería de aspiración también se
              come margen antes de llegar a la bomba, y hay que dejar el agua
              por encima de su tensión de vapor, no en cero absoluto.

      - tipo: calcular
        titulo: El NPSH disponible que hace falta
        pregunta: |
          NPSH disponible mínimo que debe garantizar la instalación, en mca.
        respuesta:
          tipo: magnitud
          valor: '7 mca'
          tolerancia: 0.02
          formato: una altura con su unidad (mca o m)
        distractores:
          - valor: '6.5 mca'
            mensaje: |
              Ese es el requerido por la bomba, sin el margen de seguridad. La
              curva del fabricante es el límite en que la bomba **empieza** a
              cavitar; nadie proyecta justo en el límite.
          - valor: '6 mca'
            mensaje: |
              Has restado el margen de seguridad en vez de sumarlo. La
              seguridad se pide **por encima** de lo que exige la bomba.
        pista: |
          El criterio de diseño es NPSH disponible igual o mayor que el
          requerido más el de seguridad.
        desarrollo: |
          $$
          NPSH_d \ge NPSH_r + NPSH_s = 6{,}5 + 0{,}5 = 7\ \text{mca}
          $$

          Los 6,5 salen de la curva del fabricante leída en el caudal máximo
          previsto, 28 l/s, que es donde el NPSH requerido es mayor. Proyectar
          con el caudal medio sería proyectar para el día que no pasa nada.

      - tipo: calcular
        titulo: La altura del eje sobre la lámina
        pregunta: |
          Altura Z a la que se puede colocar el eje de la bomba por encima de
          la lámina, en metros.
        respuesta:
          tipo: magnitud
          valor: '0.675 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m o cm)
        distractores:
          - valor: '2.9 m'
            mensaje: |
              Has usado la presión atmosférica a nivel del mar, 10,33 mca. A
              2000 m son 8,11, y esos 2,2 metros que faltan salen justo del
              margen para subir la bomba.
          - valor: '0.877 m'
            mensaje: |
              Te has dejado la pérdida de la tubería de aspiración, 0,2 mca.
              Parece poca cosa, y aquí se lleva casi un tercio de la altura
              disponible.
        pista: |
          Se despeja Z de la expresión del NPSH disponible, con todas las
          presiones en metros de columna de agua.
        desarrollo: |
          $$
          \frac{p_{atm}}{\gamma} = \frac{0{,}795\cdot 10^{5}}{9800} = 8{,}11\ \text{mca} \qquad \frac{p_v}{\gamma} = \frac{0{,}023\cdot 10^{5}}{9800} = 0{,}235\ \text{mca}
          $$

          $$
          NPSH_d = \frac{p_{atm}}{\gamma} - Z - h_{f,asp} - \frac{p_v}{\gamma} = 7
          $$

          $$
          Z = 8{,}11 - 0{,}235 - 0{,}2 - 7 = 0{,}675\ \text{m}
          $$

          Y la cota del eje, con la lámina en 2000, es
          $Z_D = 2000{,}675$ m.

      - tipo: justificar
        pregunta: Ordena qué margen queda y de qué depende. Una pieza es falsa.
        piezas:
          - texto: 'A 2000 m de altitud la atmósfera solo empuja 8,11 mca, contra los 10,33 del nivel del mar.'
          - texto: 'De esos 8,11, la bomba se reserva 7 para no cavitar y la tubería se lleva 0,2 más.'
          - texto: 'Quedan 67 centímetros para subir el eje por encima del agua, y ni uno más.'
          - texto: 'Es decir, a esa altitud la bomba tiene que ir prácticamente a ras del agua, o mejor por debajo.'
          - texto: Subiendo la temperatura del agua se ganaría margen, porque el agua caliente fluye mejor.
            trampa: true
            mensaje: |
              Al revés, y es el error más caro de este tema. El agua caliente
              tiene **más** tensión de vapor: a 20 ºC son 0,235 mca y a 60 ºC
              pasan de 2, con lo que el margen se comería casi dos metros más y
              la bomba tendría que ir bajo el nivel del agua. Que fluya mejor
              no tiene nada que ver con cavitar.
    resolucion: |
      ## Un problema corto que decide dónde va la bomba

      Toda la cavitación cabe en una resta. La atmósfera empuja el agua hacia
      la bomba, y de ese empuje hay que descontar tres cosas antes de que llegue
      a los álabes: lo que cuesta subirla, lo que se pierde por el camino y lo
      que hace falta dejar para que no hierva.

      $$
      NPSH_d = \frac{p_{atm}}{\gamma} - Z - h_{f,asp} - \frac{p_v}{\gamma}
      $$

      ## Los cuatro números

      | término | valor |
      |---|---|
      | atmósfera a 2000 m | 8,11 mca |
      | tensión de vapor a 20 ºC | 0,235 mca |
      | pérdida de aspiración | 0,2 mca |
      | NPSH requerido más seguridad | 7 mca |
      | **queda para Z** | **0,675 m** |

      $$
      Z_D = 2000 + 0{,}675 = 2000{,}675\ \text{m}
      $$

      ## Lo que el número dice de verdad

      Sesenta y siete centímetros. A dos mil metros de altitud, esta bomba
      apenas se puede levantar del agua.

      Y merece la pena ver de dónde sale ese apuro. A nivel del mar la
      atmósfera valdría 10,33 mca y la misma cuenta daría 2,9 m de margen:
      **la altitud se lleva más de dos metros**, más de tres cuartas partes de
      lo que había. Es el dato que decide la solución, y viene de fuera de la
      hidráulica.

      El segundo que más pesa es el NPSH requerido de la bomba, 6,5 mca. Otra
      bomba con la misma altura manométrica pero mejor diseño de entrada podría
      pedir 4, y entonces habría 3,2 m de margen. **Elegir bien la bomba vale
      más que apretar la tubería de aspiración**, que aquí solo aporta 0,2 mca.

      Y la temperatura, que en este enunciado es benigna, es la que más se
      olvida. A 20 ºC la tensión de vapor son 0,235 mca; a 60 ºC pasa de 2, y
      la bomba tendría que ir por debajo del nivel del agua. Por eso las bombas
      de agua caliente se instalan siempre en carga, nunca en aspiración.

  # ── COLECCIÓN 9.5. El problema completo de instalación de bombeo, de
  #    principio a fin: curva de la instalación desde los cuadros de la
  #    escuela, selección en el anexo, punto de funcionamiento, NPSH y coste
  #    del estrangulamiento. Es el examen entero en un solo ejercicio.
  - id: ejflu25-col95-la-instalacion-completa
    titulo: Una instalación de bombeo de principio a fin
    fuente: >-
      Ejercicio 9.5 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se eleva agua de un pozo mediante una bomba, situado su eje $4\ \text{m}$
      por encima de la lámina superior de aquel. La tubería de aspiración, de
      $400\ \text{mm}$ de diámetro y $10\ \text{m}$ de longitud, consta de una
      válvula de pie y un codo de $90°$. La tubería de impulsión tiene una
      longitud de $80\ \text{m}$, un diámetro de $200\ \text{mm}$, 2 codos de
      $90°$, una válvula antirretorno, una válvula esférica de regulación, y la
      salida a la atmósfera está $10\ \text{m}$ por encima del eje de la bomba.
      Toda la tubería es de acero comercial, siendo el caudal necesario de
      $60\ \text{l/s}$. Se pide:

      a) Expresión analítica y representación gráfica de la cc de la
      instalación.

      b) Seleccionar la bomba más conveniente entre las aportadas.

      c) Caudal y altura proporcionada por la bomba seleccionada, así como la
      potencia absorbida.

      d) $NPSH_{\text{seguridad}}$ en el punto de funcionamiento.

      e) Pérdida de carga que habría que producir en la válvula esférica para
      que solo circularan $60\ \text{l/s}$. Costo horario producido por el
      maniobrado de la válvula.

      Datos: factores de paso — válvula de pie $K = 8$; codo de $90°$
      $K = 0{,}5$; válvula antirretorno $K = 2{,}5$; válvula esférica abierta
      $K = 0{,}05$; presión de vapor $= 0{,}018\ \text{kg/cm}^{2}$; precio del
      kWh $= 0{,}1$ euro.

      Documentación: curvas características de turbobombas, Anexo I de la
      colección.
    pide: La curva de la instalación, la bomba, el punto de funcionamiento, el NPSH y el coste de estrangular.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué parte de la curva de la instalación **no** depende del caudal?
        opciones:
          - texto: >-
              Los $14\ \text{m}$ de desnivel entre la lámina del pozo y la
              salida: $4$ hasta el eje de la bomba y $10$ por encima
            correcta: true
            mensaje: |
              Eso es la altura piezométrica de la instalación, lo que hay que
              vencer aunque no circule nada. Los dos depósitos están abiertos,
              así que no hay término de presión que sumar.
          - texto: >-
              Solo los $10\ \text{m}$ de la impulsión
            mensaje: |
              El agua también tiene que subir los $4\ \text{m}$ desde el pozo
              hasta el eje de la bomba. El desnivel total entre las dos láminas
              es de 14 m, y es lo que cuenta.
          - texto: >-
              Nada: todos los términos dependen del caudal
            mensaje: |
              La diferencia de cotas no. Es lo que hace que la curva de la
              instalación **no pase por el origen**, y por eso una bomba nunca
              puede dar caudal si su altura a caudal nulo no supera ese valor.

      - tipo: calcular
        titulo: Las pérdidas en piezas especiales
        pregunta: |
          ¿Cuánto valen las pérdidas menores al caudal de funcionamiento de
          $62{,}4\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '1.023 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.9158 m'
            mensaje: |
              Te has dejado la aspiración. Aporta poco —$0{,}11\ \text{m}$—
              porque su diámetro es doble y la velocidad cuatro veces menor,
              pero su válvula de pie tiene $K = 8$ y cuenta.
          - valor: '0.8216 m'
            mensaje: |
              Te falta la salida a la atmósfera. La energía cinética del chorro
              que descarga se pierde, y eso equivale a un $K = 1$ más en la
              impulsión.
        pista: |
          $\sum K\,v^{2}/2g$ en cada tubería. En la impulsión hay que añadir
          $K = 1$ por la salida.
        desarrollo: |
          $$
          \text{aspiración: } \sum K = 8 + 0{,}5 = 8{,}5
          \qquad
          \text{impulsión: } \sum K = 2\cdot 0{,}5 + 2{,}5 + 0{,}05 + 1 = 4{,}55
          $$

          Con $A_a = 0{,}1257$ y $A_i = 0{,}0314\ \text{m}^{2}$:

          $$
          h_{\text{menores}} = \left(8{,}5\cdot 3{,}231 + 4{,}55\cdot 51{,}69\right)Q^{2}
          = 262{,}7\,Q^{2}\ \ (Q\text{ en m}^{3}/\text{s})
          $$
          $$
          = 2{,}627\cdot 10^{-4}\,Q^{2}\ \ (Q\text{ en l/s})
          \;\Longrightarrow\;
          2{,}627\cdot 10^{-4}\cdot 62{,}4^{2} = 1{,}02\ \text{m}
          $$

      - tipo: calcular
        titulo: La altura de la instalación en el punto de funcionamiento
        pregunta: |
          ¿Cuánta altura pide la instalación a $62{,}4\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '16.58 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '14 m'
            mensaje: |
              Esa es la altura a caudal **nulo**. Con 62,4 l/s circulando hay
              además $1{,}56\ \text{m}$ de pérdidas en las tuberías y
              $1{,}02$ en las piezas.
          - valor: '15.56 m'
            mensaje: |
              Te has dejado las pérdidas menores. Con cinco piezas especiales y
              una salida a la atmósfera aportan un metro largo, más de la mitad
              de lo que aportan los noventa metros de tubería.
        pista: |
          $H_{mi} = 14 + 7{,}36\cdot 10^{-4}Q^{1{,}852} +
          2{,}63\cdot 10^{-4}Q^{2}$, con $Q$ en l/s.
        desarrollo: |
          Con Hazen-Williams y los coeficientes del cuadro n.º 25
          —$C_{HW} = 140$ en la aspiración y $130$ en la impulsión, según su
          rugosidad relativa—:

          $$
          H_{mi} = 14 + 7{,}36\cdot 10^{-4}\,Q^{1{,}852}
          + 2{,}63\cdot 10^{-4}\,Q^{2}
          $$
          $$
          H_{mi}(62{,}4) = 14 + 1{,}56 + 1{,}02 = 16{,}58\ \text{m}
          $$

          Que es justamente la altura que da la bomba **INP 125/250 con rodete
          de 255 mm** a ese caudal, según el Anexo I: por eso ahí está el punto
          de funcionamiento.

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿Cuánto vale el NPSH disponible en el punto de funcionamiento?
        respuesta:
          tipo: magnitud
          valor: '6.04 mca'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '10.04 mca'
            mensaje: |
              Te has dejado la cota de aspiración. La bomba está $4\ \text{m}$
              **por encima** del pozo, y esos cuatro metros salen del mismo
              presupuesto.
          - valor: '6.22 mca'
            mensaje: |
              Te falta la tensión de vapor. Son solo $0{,}18\ \text{mca}$
              —$0{,}018\ \text{kg/cm}^{2}$— pero el NPSH se define **sobre** la
              presión de vapor, no sobre el cero absoluto.
        pista: |
          $NPSH_{\text{disp}} = p_{atm}/\gamma - p_v/\gamma - z - h_{f,\text{asp}}$.
          Toma $p_{atm} = 10{,}33\ \text{mca}$; las pérdidas de aspiración son
          $0{,}11\ \text{m}$.
        desarrollo: |
          $$
          NPSH_{\text{disp}} = 10{,}33 - 0{,}18 - 4 - 0{,}11 = 6{,}04\ \text{mca}
          $$

          Y con el $NPSH_{\text{req}} = 2{,}8\ \text{mca}$ que se lee en el
          Anexo I para esta bomba a $225\ \text{m}^{3}/\text{h}$:

          $$
          NPSH_{\text{seg}} = 6{,}04 - 2{,}80 = 3{,}24\ \text{mca}
          $$

      - tipo: calcular
        titulo: La pérdida que debe introducir la válvula
        pregunta: |
          Para bajar a $60\ \text{l/s}$, y sabiendo que a ese caudal la bomba
          da $17{,}39\ \text{m}$, ¿qué pérdida debe introducir la válvula?
        respuesta:
          tipo: magnitud
          valor: '1 m'
          tolerancia: 0.05
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.186 m'
            mensaje: |
              Esa es la diferencia entre lo que pide la **instalación** a 62,4
              y a 60 l/s. La válvula tiene que absorber la diferencia entre lo
              que la bomba **da** y lo que la instalación **pide**, los dos al
              caudal nuevo.
          - valor: '17.39 m'
            mensaje: |
              Esa es la altura que da la bomba. Hay que restarle lo que la
              instalación necesita a ese mismo caudal, $16{,}39\ \text{m}$.
        pista: |
          Calcula $H_{mi}$ a 60 l/s y réstalo de los 17,39 m de la bomba.
        desarrollo: |
          $$
          H_{mi}(60) = 14 + 7{,}36\cdot 10^{-4}\cdot 60^{1{,}852}
          + 2{,}63\cdot 10^{-4}\cdot 3600 = 16{,}39\ \text{m}
          $$
          $$
          h_{f,\text{válvula}} = 17{,}39 - 16{,}39 = 1{,}0\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación arranca en 14 m —el desnivel entre las
              dos láminas— y le suma las pérdidas de tubería y de piezas.
          - texto: >-
              Cruzándola con las curvas del Anexo I, la bomba que mejor encaja
              es la INP 125/250 con rodete de 255 mm: 62,4 l/s a 16,5 m con un
              76,5 % de rendimiento.
          - texto: >-
              El NPSH disponible es de 6,04 mca frente a los 2,8 que pide la
              bomba: quedan 3,24 de margen, muy por encima del mínimo.
          - texto: >-
              Como la instalación pide 62,4 l/s y el proceso solo necesita 60,
              lo más barato es estrangular la válvula esférica.
            trampa: true
            mensaje: |
              Estrangular es lo más **fácil**, no lo más barato: la válvula
              disipa energía de forma permanente y la bomba pasa a absorber
              algo más. Lo barato sería tornear el rodete o poner un variador;
              lo que pasa es que 0,015 €/h son 130 € al año y no compensan el
              variador. **La decisión es económica, no técnica**, y depende de
              cuánto se estrangule.

    resolucion: |
      **Este es el problema completo de la asignatura**: curva de instalación,
      selección en catálogo, punto de funcionamiento, comprobación de
      cavitación y coste de la regulación. Los cinco pasos, en orden.

      **a) La curva de la instalación.** Tres términos:

      $$
      H_{mi} = \underbrace{14}_{\Delta z}
      + \underbrace{7{,}36\cdot 10^{-4}\,Q^{1{,}852}}_{\text{tuberías, Hazen-Williams}}
      + \underbrace{2{,}63\cdot 10^{-4}\,Q^{2}}_{\text{piezas especiales}}
      \qquad (Q\text{ en l/s})
      $$

      El primero es el desnivel entre las dos láminas. El segundo sale de los
      cuadros n.º 20 y 25: acero comercial da $\varepsilon = 0{,}006\ \text{cm}$,
      y con $\varepsilon/D$ resultan $C_{HW} = 140$ en la aspiración y $130$ en
      la impulsión. El tercero, de los factores de paso, **con un $K = 1$
      añadido por la salida a la atmósfera**.

      **b) y c) La bomba y el punto.** Cruzando esa curva con las del Anexo I,
      la **INP 125/250 con rodete de 255 mm** corta en

      $$
      Q = 62{,}4\ \text{l/s}
      \qquad
      H = 16{,}5\ \text{m}
      \qquad
      \eta = 76{,}5\ \%
      \qquad
      P_{\text{abs}} = 13{,}3\ \text{kW}
      $$

      **d) El NPSH.**

      $$
      NPSH_{\text{disp}} = 10{,}33 - 0{,}18 - 4 - 0{,}11 = 6{,}04\ \text{mca}
      \;\Longrightarrow\;
      NPSH_{\text{seg}} = 3{,}24\ \text{mca}
      $$

      Con holgura: el mínimo recomendado son 0,5–0,9 mca y el criterio del
      1,3 pediría 3,64 disponibles frente a los 6,04 que hay.

      **e) La válvula.** A 60 l/s la bomba da 17,39 m y la instalación pide
      16,39: la válvula tiene que **quemar 1 metro**. Eso hace que la bomba
      absorba unos 0,15 kW más que en el punto libre, es decir **0,015 €/h**.

      > **Sobre ese último número, con toda la honestidad.** Es la diferencia
      > entre dos potencias absorbidas de trece kilovatios y pico, las dos
      > leídas del anexo. Una diferencia de dos números grandes y parecidos
      > hereda todo el error de la lectura: reproducir el 0,015 exige leer la
      > curva de potencia con una precisión que un escaneo no da. Lo que sí es
      > robusto —y es lo que hay que saber hacer— es el metro de pérdida en la
      > válvula.

      **Y la comprobación que valida todo lo demás.** La curva que sale de los
      cuadros de la escuela es
      $14 + 7{,}363\cdot 10^{-4}Q^{1{,}852} + 2{,}627\cdot 10^{-4}Q^{2}$, y el
      boletín publica $14 + 7{,}3666\cdot 10^{-4}Q^{1{,}852} +
      2{,}626\cdot 10^{-4}Q^{2}$: coinciden en cuatro cifras. Y el
      $NPSH_{\text{req}}$ que hace falta para que salgan los 3,24 publicados es
      $2{,}80\ \text{mca}$, que es exactamente lo que se lee en la curva del
      anexo. **Cuando dos caminos independientes dan el mismo número, la
      lectura del catálogo está bien hecha.**

  - id: ejflu25-col96-la-turbobomba-elegida-y-la-valvula-que-cuesta-dinero
    titulo: La turbobomba elegida, y la válvula que cuesta dinero
    fuente: Ejercicio 9.6 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se dispone de una instalación con el fin de elevar un determinado caudal
      de un líquido cuyo peso específico relativo es de 1,2, de un depósito
      inferior B, abierto a la atmósfera, a otro superior C, presurizado.
      Conocidos los datos que figuran al pie, se pide:

      **a)** Expresión analítica y representación gráfica de la curva
      característica de la instalación.

      **b)** Seleccionar la turbobomba (tb) más adecuada, entre aquellas cuyas
      cc se adjuntan, si se desea obtener un caudal de 20 l/s. Se considera como
      tb más adecuada aquella que absorbe menos potencia.

      **c)** Punto de funcionamiento resultante con la tb seleccionada (Q, H y
      η).

      **d)** Potencia absorbida en el punto de funcionamiento.

      **e)** Pérdida de energía que habría que producir puntualmente mediante el
      maniobrado de una válvula, para que el caudal circulante fuese justo el
      requerido (20 l/s).

      **f)** Costo anual de dicha maniobra si la instalación funcionara 4500
      horas/año y el valor del kWh fuese de 0,1 euros.

      **g)** NPSH de seguridad en el punto de funcionamiento sin maniobrado de
      válvula.

      **Datos:** ZB = 667 m; ZD = 670,89 m; ZC = 680 m; PC(abs) = 235,2 kPa;
      Lasp = 100 m; Limp = 500 m; tensión de vapor del líquido a la temperatura
      de trabajo Pv = 0,5 mcl (abs); material de la tubería: acero comercial;
      diámetro D = 150 mm.

      **Nota:** Despréciense las pérdidas de carga en las piezas especiales.

      **Notas nuestras.** El anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí; lo que sí se puede es traer sus
      lecturas. La turbobomba que sale del apartado b) es la **INP 80/315 a
      1450 rpm con rodete de 320 mm** —el boletín la nombra «80/135», que es un
      lapsus: en el anexo II no hay tal modelo y sí el 80/315, cuya familia de
      rodetes incluye el de 320—. Estos son los puntos de su curva
      característica, leídos del anexo:

      | Q (m³/h) | 0 | 20 | 40 | 50 | 60 | 70 | 72 | 77 | 80 |
      |---|---|---|---|---|---|---|---|---|---|
      | H (m) | 34,0 | 34,0 | 33,9 | 33,5 | 33,0 | 32,2 | 32,0 | 31,5 | 31,3 |

      Su rendimiento en el punto de funcionamiento es del **72,7 %** y su NPSH
      requerido a ese caudal, **2 mca**. Y hay un dato que el enunciado no da y
      hace falta: la presión atmosférica del lugar. El apartado g) se trata en
      el último paso.

