    pide: El factor de fricción del crudo, la pérdida de la instalación, el término estático y de dónde sale la presión atmosférica que hace falta.
    pasos:
      - tipo: reconocer
        pregunta: |
          Todos los demás problemas del capítulo usan Hazen-Williams. Este da su
          resultado en la forma $3750\,f\,v^{2}/2g$, es decir Darcy-Weisbach.
          ¿Por qué?
        opciones:
          - texto: Porque el líquido no es agua; Hazen-Williams es una fórmula empírica calibrada para agua y aquí la viscosidad es diez veces mayor
            correcta: true
            mensaje: |
              Eso es. Hazen-Williams no tiene dentro ninguna viscosidad: su
              coeficiente C solo depende de la rugosidad relativa, y eso vale
              mientras el fluido sea agua a temperatura ordinaria. Con un crudo
              de $10^{-5}$ m²/s el Reynolds baja a 17 000 y el factor de
              fricción depende mucho de él.
          - texto: Porque el diámetro es de 200 mm y Hazen-Williams no lo cubre
            mensaje: |
              El cuadro nº 25 cubre 200 mm sin problema; de hecho medio capítulo
              lo usa. Lo que cambia aquí es el fluido.
          - texto: Porque hay que calcular el NPSH, y para eso hace falta Darcy
            mensaje: |
              El NPSH no depende del método de pérdidas: se calcula igual con
              uno u otro. El motivo del cambio es el fluido.
          - texto: Porque la instalación tiene dos depósitos presurizados
            mensaje: |
              La presión de los depósitos entra en la ordenada en el origen, no
              en el término de pérdidas. El método de cálculo de la fricción es
              independiente de ella.

      - tipo: calcular
        titulo: El factor de fricción
        pregunta: |
          Factor de fricción de Darcy en el punto de funcionamiento, con
          27,4 l/s.
        respuesta:
          tipo: numero
          valor: '0.0276'
          tolerancia: 0.0006
          formato: un número, sin unidad
        distractores:
          - valor: '0.01802'
            mensaje: |
              Has usado la viscosidad del agua. El crudo a 14 ºC es diez veces
              más viscoso, así que el Reynolds baja de 174 000 a 17 000 y el
              factor de fricción sube más de un 50 %.
          - valor: '0.01494'
            mensaje: |
              Ese es el valor de la zona rugosa, el que sale de la rugosidad
              relativa sola. Con Reynolds de 17 000 la tubería no está en esa
              zona ni de lejos: el término viscoso de Colebrook domina.
        pista: |
          Con $\nu = 1{,}04\cdot 10^{-5}$ m²/s y 200 mm, el Reynolds sale del
          orden de 17 000. La rugosidad del acero comercial es 0,006 cm.
        desarrollo: |
          $$
          v = \frac{0{,}0274}{\pi\,0{,}2^{2}/4} = 0{,}872\ \text{m/s} \qquad Re = \frac{0{,}872\cdot 0{,}2}{1{,}04\cdot 10^{-5}} = 16\,772
          $$

          Con $\varepsilon/D = 3\cdot 10^{-4}$, Colebrook da **f = 0,0276**.

          Merece la pena comparar: con agua, a la misma velocidad, el Reynolds
          sería 174 000 y f valdría 0,018. **La viscosidad del crudo encarece
          la tubería un 53 %**, y por eso aquí no vale Hazen-Williams.

      - tipo: calcular
        titulo: La pérdida de carga
        pregunta: |
          Pérdida de carga total de los 750 m de tubería en el punto de
          funcionamiento, en metros de columna de líquido.
        respuesta:
          tipo: magnitud
          valor: '4.02 m'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (m o mcl)
        distractores:
          - valor: '2.62 m'
            mensaje: |
              Has usado el factor de fricción del agua. Con el crudo la pérdida
              es un 53 % mayor.
          - valor: '2.17 m'
            mensaje: |
              Has usado el factor de la zona rugosa. Con Reynolds de 17 000 la
              tubería está en régimen de transición y f es casi el doble.
        pista: |
          Los 150 m de aspiración y los 600 de impulsión son la misma tubería,
          así que $L/D$ vale 3750.
        desarrollo: |
          $$
          h_f = f\,\frac{L}{D}\,\frac{v^{2}}{2g} = 0{,}0276\cdot 3750\cdot 0{,}0388 = 4{,}02\ \text{mcl}
          $$

          Cuatro metros en setecientos cincuenta de tubería: **un 5 % de lo que
          da la bomba**. Con 0,87 m/s de velocidad, incluso un crudo viscoso
          cuesta poco de transportar; lo caro son los sesenta metros de
          desnivel.

      - tipo: calcular
        titulo: El término estático
        pregunta: |
          Ordenada en el origen de la curva de la instalación, en metros de
          columna de líquido. Toma la presión atmosférica como 91,45 kPa.
        respuesta:
          tipo: magnitud
          valor: '69.32 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mcl)
        distractores:
          - valor: '54.07 m'
            mensaje: |
              Te has dejado la presión del depósito superior. F está a 220 kPa
              absolutos, y contra esa presión hay que meter el crudo.
          - valor: '80.17 m'
            mensaje: |
              Has tomado los 220 kPa como manométricos. El enunciado dice
              **absoluta**, así que primero hay que descontarle la atmósfera.
        pista: |
          Son tres términos: el desnivel, la presión de F —que se opone— y la
          de B —que ayuda—, las dos en columna de crudo.
        desarrollo: |
          El peso específico del crudo es
          $\gamma = 0{,}86\cdot 9800 = 8428$ N/m³, y la presión de F en
          manométrica son $220 - 91{,}45 = 128{,}55$ kPa.

          $$
          H_0 = (960 - 900) + \frac{128\,550}{8428} - \frac{50\,000}{8428} = 60 + 15{,}25 - 5{,}93 = 69{,}32\ \text{mcl}
          $$

          La de B se resta porque empuja desde el depósito de partida, y la de
          F se suma porque hay que vencerla. Y con la pérdida,
          $H_{mi}(27{,}4) = 69{,}32 + 4{,}02 = 73{,}34$ m, que son los 73,4 que
          el catálogo asigna a la bomba en ese caudal: **la comprobación de que
          la viscosidad se ha leído bien del ábaco**.

      - tipo: justificar
        pregunta: Ordena de dónde sale la presión atmosférica de 91,45 kPa, que el enunciado no da. Una pieza es falsa.
        piezas:
          - texto: 'El enunciado da la presión de F como absoluta, así que hace falta la atmosférica para pasarla a manométrica.'
          - texto: 'Del término estático publicado, 69,32, se despeja: la atmosférica tiene que valer 91,45 kPa.'
          - texto: 'Y ese número tiene sentido físico: es la atmósfera tipo a los novecientos y pico metros de altitud a los que está la instalación.'
          - texto: 'El apartado d) lo corrobora dentro de la precisión con que se lee la carta de NPSH del anexo.'
          - texto: 'Como el 9.6 usa 94 kPa y el 9.11 usa 98, la colección emplea siempre el mismo valor y aquí también.'
            trampa: true
            mensaje: |
              Justo al revés: **cada problema implica una atmosférica
              distinta**. El 9.6 cuadra con 94 kPa en la cota 680, el 9.11 con
              los 98 de la conversión de siempre y este con 91,45 en la cota
              960. No hay una convención única en la colección, y por eso cada
              ejercicio tiene que decir con cuál está trabajando.
    resolucion: |
      ## El único problema del capítulo que no es agua

      Todos los demás usan Hazen-Williams, que es una fórmula empírica sin
      viscosidad dentro: su coeficiente C solo mira la rugosidad relativa. Eso
      vale mientras el fluido sea agua. Aquí es petróleo crudo a 14 ºC, diez
      veces más viscoso, y hay que volver a Darcy-Weisbach y al ábaco de
      viscosidades.

      Del ábaco nº 5, el crudo a 14 ºC tiene

      $$
      \nu = 1{,}04\cdot 10^{-5}\ \text{m}^{2}/\text{s}
      $$

      $$
      v = 0{,}872\ \text{m/s} \qquad Re = 16\,772 \qquad f = 0{,}0276
      $$

      Con agua, a la misma velocidad, el Reynolds sería 174 000 y f valdría
      0,018: **la viscosidad encarece la tubería un 53 %**. Ese es exactamente
      el error que se cometería aplicando Hazen-Williams sin pensar.

      ## a) La curva

      $$
      H_{mi} = 69{,}32 + 3750\,f\,\frac{v^{2}}{2g}
      $$

      El término independiente tiene tres piezas y conviene verlas por
      separado:

      | concepto | mcl |
      |---|---|
      | desnivel de B a F | +60,00 |
      | presión de F, manométrica | +15,25 |
      | presión de B, que ayuda | −5,93 |
      | **total** | **69,32** |

      ## c) El punto, y la comprobación

      $$
      h_f = 0{,}0276\cdot 3750\cdot 0{,}0388 = 4{,}02\ \text{mcl} \;\Longrightarrow\; H_{mi}(27{,}4) = 73{,}34\ \text{m}
      $$

      contra los **73,4 mcl** que el catálogo asigna a la bomba en ese caudal.
      Coinciden en la primera decimal, y esa coincidencia es la prueba de que
      la lectura del ábaco —el único dato que no está en el enunciado— es la
      buena. Si la viscosidad estuviera mal leída, el punto no cuadraría.

      Fíjate también en el reparto: de los 73,4 m, **69,3 son estáticos y solo
      4 son fricción**. Con 0,87 m/s por una tubería de 200 mm, ni siquiera un
      crudo viscoso cuesta gran cosa de mover; lo que cuesta es subirlo sesenta
      metros y meterlo contra la presión de F.

      ## La presión atmosférica, que no está escrita

      Para pasar los 220 kPa absolutos de F a manométrica hace falta la
      atmosférica, y el enunciado no la da. Del término estático publicado se
      despeja: **91,45 kPa**, que es la atmósfera tipo a los novecientos y pico
      metros a los que está la obra.

      > **Y una advertencia que sale de comparar los tres problemas del
      > capítulo que la necesitan.** El 9.6 cuadra con 94 kPa en la cota 680,
      > el 9.11 con los 98 kPa de la conversión de siempre —10 mca— y este con
      > 91,45 en la cota 960. **No hay una convención única en la colección**,
      > y ninguno de los tres enunciados la escribe. Por eso cada ejercicio de
      > los tres dice explícitamente con cuál está trabajando: es un dato
      > deducido del resultado, y callarlo sería publicarlo como si fuera del
      > enunciado.
  # ── COLECCIÓN 9.14. El primero del capítulo que usa de verdad el anexo de
  #    curvas —la INP 65/200 del anexo 3— y el único que termina con la
  #    bomba **cavitando**: no se pide comprobar que va bien, se pide
  #    comprobar, y sale mal. Ese es su valor.
  - id: ejflu25-col914-la-bomba-que-cavita
    titulo: La instalación completa, y la bomba que acaba cavitando
    fuente: >-
      Ejercicio 9.14 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una instalación de bombeo para elevar un líquido de
      $s = 1{,}2$ y viscosidad similar a la del agua, cuyas características
      son las siguientes:

      - Cota del depósito inferior, $180\ \text{m}$.
      - Cota del depósito superior, $200\ \text{m}$.
      - Presión en el depósito superior, $235{,}2\ \text{kPa}$.
      - Cota del eje de la bomba, $183\ \text{m}$.
      - Tubería de acero comercial de $100\ \text{mm}$ de diámetro.
      - Longitud equivalente total de la aspiración, $30\ \text{m}$.
      - Longitud equivalente total de la impulsión, $125\ \text{m}$.
      - Presión de vapor del líquido (absoluta), $1{,}6\ \text{kPa}$.

      Se pide:

      a) Seleccionar la bomba necesaria para que circule un caudal de
      $20\ \text{l/s}$.

      b) Determinar el punto de funcionamiento de la instalación
      ($H$, $Q$, $\eta$) y la potencia absorbida (kW).

      c) Estudiar la cavitación de la bomba.

      e) ¿Qué marcará un vacuómetro colocado en la tubería de aspiración a la
      entrada de la bomba?

      Dato de catálogo (anexo 3 de la colección): la **INP 65/200 a 2900 rpm
      con rodete de 200 mm** pasa por $H \approx 51$ m con
      $\eta \approx 74{,}5\ \%$ a $73{,}8\ \text{m}^{3}/\text{h}$, y su
      $NPSH$ requerido en ese punto ronda los $4$ m.
    pide: El punto de funcionamiento con su potencia, el estudio de cavitación y la lectura del vacuómetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito superior está presurizado a $235{,}2\ \text{kPa}$. ¿Cómo
          entra eso en la curva de la instalación?
        opciones:
          - texto: >-
              Como altura añadida al desnivel, y convertida a columna **del
              líquido que se bombea**: $235{,}2/(1{,}2\cdot 9{,}8) = 20$ mcl
            correcta: true
            mensaje: |
              Eso es. La altura piezométrica de la instalación es
              $\Delta z + \Delta p/\gamma$, y ese $\gamma$ es el del fluido que
              circula, no el del agua. Aquí casualmente sale un número redondo,
              20 m, que se suma a los otros 20 de desnivel.
          - texto: >-
              Como $235{,}2/9{,}8 = 24$ m, porque las presiones se pasan a
              metros de columna de agua
            mensaje: |
              «Metros de columna de agua» es una unidad de presión cómoda, pero
              la ecuación de Bernoulli trabaja en columna **del fluido del
              problema**. Con $s = 1{,}2$ la misma presión son menos metros:
              20 en vez de 24.
          - texto: >-
              No entra: la presión del depósito de llegada no afecta a la
              bomba, solo el desnivel
            mensaje: |
              Afecta, y mucho: aquí **duplica** la altura piezométrica. Bombear
              a un depósito presurizado es como bombearlo veinte metros más
              arriba.

      - tipo: calcular
        titulo: La altura piezométrica de la instalación
        pregunta: |
          ¿Cuál es el término independiente de la curva de la instalación?
        respuesta:
          tipo: magnitud
          valor: '40 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '20 m'
            mensaje: |
              Te has quedado con el desnivel de cotas y has olvidado la presión
              del depósito superior, que vale otros 20 m de columna del
              líquido.
          - valor: '44 m'
            mensaje: |
              Has convertido los $235{,}2$ kPa a columna de **agua**, 24 m. El
              líquido tiene $s = 1{,}2$, así que la misma presión son 20 m de
              su columna.
        pista: |
          $\Delta z + \Delta p/\gamma$, con $\gamma = 1{,}2\cdot 9800$.
        desarrollo: |
          $$
          H_{\text{piez}} = (200 - 180) + \frac{235\,200}{1{,}2\cdot 9800}
          = 20 + 20 = 40\ \text{m}
          $$

      - tipo: calcular
        titulo: La pérdida de carga en el punto de funcionamiento
        pregunta: |
          Con la bomba del anexo la instalación se estabiliza en
          $20{,}5\ \text{l/s}$. ¿Cuánta carga se pierde por rozamiento?
        respuesta:
          tipo: magnitud
          valor: '10.19 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '1.97 m'
            mensaje: |
              Esa es solo la pérdida de la **aspiración**, los 30 m
              equivalentes. La curva de la instalación cuenta los 155 m
              completos: aspiración más impulsión.
          - valor: '8.22 m'
            mensaje: |
              Solo has contado la impulsión, los 125 m. Los 30 de la aspiración
              también son tubería y también pierden.
        pista: |
          $L_{\text{eq}} = 30 + 125 = 155$ m, $\varepsilon = 0{,}006$ cm para
          el acero comercial, y $\nu \approx 10^{-6}$.
        desarrollo: |
          $$
          v = \frac{0{,}0205}{\pi\,0{,}1^{2}/4} = 2{,}61\ \text{m/s}
          \qquad
          Re = 2{,}61\cdot 10^{5}
          \qquad
          \frac{\varepsilon}{D} = 6\cdot 10^{-4}
          \;\Longrightarrow\;
          f = 0{,}0189
          $$
          $$
          h_f = 0{,}0189\,\frac{155}{0{,}1}\,\frac{2{,}61^{2}}{19{,}6}
          = 10{,}19\ \text{m}
          $$

          Y la instalación pide $40 + 10{,}19 = 50{,}2$ m, que es donde corta
          la curva de la bomba: los 51 m del catálogo, leídos a ojo.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia absorbe la bomba?
        respuesta:
          tipo: magnitud
          valor: '16.5 kw'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '12.29 kw'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q H$. La absorbida se
              obtiene dividiendo entre el rendimiento del 74,5 % que da la
              curva.
          - valor: '13.75 kw'
            mensaje: |
              Has usado el peso específico del agua. El líquido tiene
              $s = 1{,}2$, así que su $\gamma$ es $11\,760\ \text{N/m}^{3}$ y
              todo pesa un 20 % más.
        pista: |
          $P = \gamma Q H/\eta$, con $\gamma$ del líquido y el rendimiento del
          catálogo.
        desarrollo: |
          $$
          P = \frac{1{,}2\cdot 9800\cdot 0{,}0205\cdot 51}{0{,}745}
          = 16\,500\ \text{W} = 16{,}5\ \text{kW}
          $$

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          ¿De cuánto NPSH dispone la bomba?
        respuesta:
          tipo: magnitud
          valor: '3.51 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '5.48 m'
            mensaje: |
              Te has dejado la pérdida de la aspiración, 1,97 m. Son los 30 m
              equivalentes que hay entre el depósito y la bomba, y en el NPSH
              cuentan enteros.
          - valor: '6.51 m'
            mensaje: |
              Te has dejado los 3 m de cota. La bomba está a 183 y el depósito
              a 180: aspira **en depresión**, y eso es lo que más margen le
              quita.
        pista: |
          $\dfrac{p_{at} - p_v}{\gamma} - z_{\text{asp}} - h_{f,\text{asp}}$,
          con $\gamma$ del líquido y las presiones en absolutas.
        desarrollo: |
          $$
          \frac{p_{at}}{\gamma} = \frac{101\,325}{11\,760} = 8{,}62\ \text{mcl}
          \qquad
          \frac{p_v}{\gamma} = \frac{1600}{11\,760} = 0{,}14\ \text{mcl}
          $$
          $$
          NPSH_d = 8{,}62 - 0{,}14 - 3 - 1{,}97 = 3{,}51\ \text{mcl}
          $$

          Y el catálogo pide unos 4 m en ese punto: **la bomba cavita.**

      - tipo: calcular
        titulo: La lectura del vacuómetro
        pregunta: |
          ¿Qué marca un vacuómetro a la entrada de la bomba, en metros de
          columna del líquido?
        respuesta:
          tipo: magnitud
          valor: '-5.32 m'
          tolerancia: 0.05
          formato: una presión en metros de columna, con su signo y su unidad
        distractores:
          - valor: '-4.97 m'
            mensaje: |
              Te falta la altura cinética. En la brida el líquido ya va a
              $2{,}61$ m/s, y esos $0{,}35$ m salen también de la presión.
          - valor: '-13.54 m'
            mensaje: |
              Has usado los 155 m de tubería. Antes de la bomba solo hay 30: el
              resto está en la impulsión, aguas abajo.
        pista: |
          Bernoulli del depósito inferior a la brida, en relativas:
          $-z_{\text{asp}} - h_{f,\text{asp}} - v^{2}/2g$.
        desarrollo: |
          $$
          \frac{p_e}{\gamma} = -3 - 1{,}97 - 0{,}35 = -5{,}32\ \text{mcl}
          $$

          El boletín publica $5{,}49$; la diferencia del 3 % viene de leer el
          caudal en el ábaco.

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La instalación pide $40 + 10{,}2 = 50{,}2$ m a 20,5 l/s, y ahí
              corta la curva de la INP 65/200 con rodete de 200 mm.
          - texto: >-
              Con $\eta = 74{,}5\ \%$ y el peso específico del líquido, la
              potencia absorbida son 16,5 kW.
          - texto: >-
              Pero el NPSH disponible son 3,51 m frente a los 4 que pide el
              catálogo: **la bomba cavita**.
          - texto: >-
              La solución es cambiar a una bomba más grande, que tenga más
              altura disponible.
            trampa: true
            mensaje: |
              Una bomba más grande empeora el problema: a más caudal, más
              pérdida en la aspiración y más $NPSH$ requerido. La cavitación no
              se arregla desde la bomba, se arregla desde la **aspiración**:
              bajar la bomba —los 3 m de desnivel son casi todo el déficit—,
              acortar o ensanchar la tubería de aspiración, o quitarle
              accesorios. Aquí bastaría con poner la bomba a la cota 180 en vez
              de 183.

    resolucion: |
      **Por qué este ejercicio importa más que los otros del capítulo.** Los
      demás terminan con la bomba funcionando. Este termina con la bomba
      **cavitando**, y el enunciado no lo avisa: dice «estudiar la
      cavitación», y estudiarla incluye la posibilidad de que salga mal.

      **La curva de la instalación.** Dos términos independientes del caudal:
      el desnivel de 20 m y la presión del depósito superior, que en columna
      del líquido son otros 20:

      $$
      H = 40 + h_f(Q)
      $$

      **El punto de funcionamiento.** Con $L_{eq} = 155$ m,
      $\varepsilon = 0{,}006$ cm y $\nu \approx 10^{-6}$, a 20,5 l/s salen
      $f = 0{,}0189$ y $h_f = 10{,}2$ m, así que la instalación pide 50,2 m.
      La INP 65/200 con rodete de 200 mm a 2900 rpm pasa justo por ahí —51 m
      en el ábaco— con un rendimiento del 74,5 %:

      $$
      P = \frac{\gamma Q H}{\eta} = 16{,}5\ \text{kW}
      $$

      **La cavitación.**

      $$
      NPSH_d = \frac{p_{at} - p_v}{\gamma} - z_{\text{asp}}
      - h_{f,\text{asp}} = 8{,}62 - 0{,}14 - 3 - 1{,}97 = 3{,}51\ \text{mcl}
      $$

      frente a los $\approx 4$ m que pide la curva. **Cavita**, y por poco:
      medio metro.

      **Y ahí está la lección de proyecto.** Mira de dónde se ha ido el
      margen: la presión atmosférica aportaba 8,62 m, y de ellos 3 se los ha
      llevado poner la bomba tres metros por encima del depósito y 1,97 la
      tubería de aspiración. **El único término que el proyectista no controla
      —la atmosférica— es el que da todo el margen; los dos que se lo comen
      son decisiones suyas.** Bajar la bomba a la cota del depósito
      resolvería el problema entero sin tocar la máquina.

      **Una nota sobre el peso específico.** Aparece en tres sitios y en los
      tres hay que acordarse de que $s = 1{,}2$: al pasar los 235,2 kPa a
      metros, al calcular la potencia y al pasar la atmosférica y la presión
      de vapor a columna. Usar 9800 en cualquiera de los tres da un resultado
      plausible y equivocado.

  - id: ejflu25-col915-el-filtrado-de-la-piscina-y-su-by-pass
    titulo: El filtrado de la piscina, y su by-pass
    fuente: Ejercicio 9.15 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Un importante complejo deportivo posee el sistema de filtrado parcial del
      agua indicado en el esquema de la figura. Los datos de las tuberías de
      hierro galvanizado son:

      | tubería | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | D (mm) | 80 | 60 | 60 | 80 |
      | L (m) | 60 | 20 | 30 | 70 |

      Se suponen en todos los tramos unas pérdidas menores que se evalúan como
      el 15 % de las pérdidas en la tubería. La pérdida de carga en el filtro se
      puede suponer P = 2940·Q², donde P (Pa) y Q (l/s). Se pide:

      **a)** Altura manométrica que debería aportar una bomba a instalar para
      filtrar 4 l/s cuando la válvula V está abierta.

      **b)** Calcular la expresión de la curva característica de la instalación
      cuando la válvula V está cerrada.

      **c)** Elegir la bomba más adecuada para que en el caso b) circule un
      caudal Q = 13 l/s.

      **d)** Calcular el punto de funcionamiento en este caso c): Hm, Q,
      potencia bruta y rendimiento de la bomba.

      **e)** Si el punto de funcionamiento no coincide con el deseado y
      manteniendo la válvula V cerrada, indicar razonadamente la forma de
      conseguir que circule el caudal de 13 l/s.

      **Nota nuestra:** el anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí. La bomba que sale del apartado
      c) es la **50/250 a 2900 rpm con rodete de 256 mm**, y su punto de
      funcionamiento con la instalación del caso b) es **13,3 l/s con 79,5 mca y
      un rendimiento del 66 %**.

      <figure class="figura-examen">
      <svg viewBox="0 0 620 360" role="img" width="620" height="360"
           aria-labelledby="f915t f915d">
