        <text x="190" y="348" font-size="10" fill="var(--faint)">L = 25 m</text>
        <text x="300" y="272" font-size="10" fill="var(--faint)">L = 75 m</text>
        <text x="416" y="166" font-size="10" fill="var(--faint)">boquilla 80 mm · cota 11</text>
        <line x1="470" y1="168" x2="470" y2="60" stroke="var(--live)" stroke-width="1" marker-start="url(#m98)" marker-end="url(#m98)"/>
        <line x1="440" y1="60" x2="474" y2="60" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="440" y1="168" x2="474" y2="168" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="478" y="118" font-size="11" fill="var(--live)">z</text>
        <line x1="540" y1="168" x2="540" y2="288" stroke="var(--faint)" stroke-width="1" marker-start="url(#m98)" marker-end="url(#m98)"/>
        <line x1="478" y1="168" x2="544" y2="168" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="164" y1="288" x2="544" y2="288" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="536" y="232" text-anchor="end" font-size="10.5" fill="var(--faint)">10 m</text>
        <text x="40" y="240" font-size="10" fill="var(--faint)">acero comercial · D = 150 mm · 12 m equivalentes de piezas</text>
        <line x1="190" y1="318" x2="222" y2="318" stroke="var(--live)" stroke-width="2" marker-end="url(#m98f)"/>
      </svg>
      <figcaption>Cien metros de tubería y una boquilla de ochenta milímetros para levantar quince metros de chorro. El desnivel entre la lámina y la boquilla es solo de diez.</figcaption>
      </figure>
    pide: La curva de la instalación, la altura que alcanza el chorro, la potencia que absorbe la bomba y lo que cuesta cada hora de funcionamiento.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la curva de esta instalación, el término que va con $Q^{2}$ es
          exactamente la altura de velocidad de la boquilla, sin ningún factor
          de paso delante. ¿Por qué?
        opciones:
          - texto: Porque las piezas ya están contadas como 12 m de longitud equivalente, y a la boquilla el enunciado no le da factor de paso
            correcta: true
            mensaje: |
              Eso es. El método de la longitud equivalente mete las piezas
              dentro del término de fricción, así que no aparecen aparte. Y del
              chorro solo queda la energía cinética con la que sale, que no es
              una pérdida sino energía que la fuente entrega.
          - texto: Porque la boquilla no pierde carga al ser convergente
            mensaje: |
              Toda boquilla real pierde algo; lo que pasa es que **este**
              enunciado no da su factor de paso, así que no hay nada que
              contar. En el 9.7, por ejemplo, sí lo da y vale 0,2.
          - texto: Porque los 12 m equivalentes ya incluyen la boquilla
            mensaje: |
              Los 12 m equivalentes son de las piezas de la tubería —codos,
              válvulas— y se aplican con la velocidad de los 150 mm. La
              boquilla tiene su propia sección y no se puede meter ahí.
          - texto: Porque la energía cinética de salida se desprecia en las fuentes
            mensaje: |
              En una fuente es justo al revés: la energía cinética de salida
              **es** el producto. Los 15 m de chorro son esa energía cinética,
              y son la mitad de todo lo que da la bomba.

      - tipo: calcular
        titulo: El coeficiente de fricción de la instalación
        pregunta: |
          Coeficiente que multiplica a $Q^{1{,}852}$ en la curva de la
          instalación, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.0041665'
          tolerancia: 0.00005
          formato: un número, sin unidad
        distractores:
          - valor: '0.0037223'
            mensaje: |
              Te has dejado los 12 m equivalentes de las piezas. Sobre 100 m de
              tubería son un 12 % más de pérdida, que no es despreciable.
          - valor: '0.0032384'
            mensaje: |
              Solo has contado la impulsión. Los 25 m de aspiración también
              pierden carga, y la bomba tiene que darla igual.
        pista: |
          La longitud de cálculo es la real más la equivalente de las piezas, y
          las dos tuberías tienen el mismo diámetro.
        desarrollo: |
          Acero comercial de 150 mm da $\varepsilon/D = 4\cdot 10^{-4}$ y por
          tanto **C = 130**, con $J_1 = 3{,}72\cdot 10^{-5}$. La longitud de
          cálculo son los 25 de aspiración, los 75 de impulsión y los 12
          equivalentes:

          $$
          k = 3{,}72\cdot 10^{-5}\cdot 112 = 4{,}17\cdot 10^{-3}
          $$

          Y con el desnivel de 10 m —de la cota 1 a la 11— y la energía
          cinética de la boquilla, la curva completa es

          $$
          H_{mi} = 10 + 4{,}17\cdot 10^{-3}\,Q^{1{,}852} + 2{,}019\cdot 10^{-3}\,Q^{2}
          $$

      - tipo: calcular
        titulo: La altura que pide la instalación en el punto de funcionamiento
        pregunta: |
          Altura manométrica que necesita la instalación con los 87 l/s del
          punto de funcionamiento, en metros.
        respuesta:
          tipo: magnitud
          valor: '41.5 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '26.3 m'
            mensaje: |
              Te has dejado la energía cinética de la boquilla. Es el término
              más grande de los tres y es, literalmente, para lo que existe la
              fuente.
          - valor: '10 m'
            mensaje: |
              Ese es solo el desnivel entre la lámina y la boquilla. Con eso el
              agua llegaría arriba, pero sin velocidad y sin haber pagado la
              fricción de los cien metros.
        pista: |
          Se evalúan los tres términos de la curva en 87 l/s y se suman.
        desarrollo: |
          $$
          H_{mi}(87) = 10 + 4{,}17\cdot 10^{-3}\cdot 87^{1{,}852} + 2{,}019\cdot 10^{-3}\cdot 87^{2} = 41{,}58\ \text{m}
          $$

          que son los 41,5 m que el catálogo asigna a la bomba en ese caudal.
          **Esa coincidencia es la comprobación de que la selección está bien
          hecha**: la curva de la instalación se calcula sin tocar el catálogo,
          y si el corte no cayera donde el catálogo dice, algo se habría leído
          mal.

          El reparto de esos 41,5 m merece un vistazo:

          | concepto | metros |
          |---|---|
          | desnivel | 10,0 |
          | fricción en 112 m equivalentes | 16,3 |
          | energía cinética del chorro | 15,3 |

      - tipo: calcular
        titulo: La altura del chorro
        pregunta: |
          Altura que alcanzará el chorro con la bomba seleccionada, en metros.
        respuesta:
          tipo: magnitud
          valor: '15.3 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '41.5 m'
            mensaje: |
              Esa es la altura que da la bomba. De ella, diez metros suben el
              agua hasta la boquilla y dieciséis se pierden en la tubería; solo
              el resto sale convertido en velocidad.
          - valor: '1.24 m'
            mensaje: |
              Has usado la velocidad de la tubería. El chorro sale por la
              boquilla, de 80 mm, y su altura de velocidad es doce veces mayor.
        pista: |
          El chorro sube su altura de velocidad de salida, y esa se calcula con
          la sección de la boquilla.
        desarrollo: |
          $$
          h = 2{,}019\cdot 10^{-3}\cdot 87^{2} = 15{,}3\ \text{m}
          $$

          Se pedían 15 y salen 15,3: la bomba de catálogo llega con un 2 % de
          margen, que es lo normal al elegir de una familia discreta de
          rodetes.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          Potencia absorbida por la bomba en el punto de funcionamiento, en kW.
        respuesta:
          tipo: magnitud
          valor: '49.14 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '35.4 kW'
            mensaje: |
              Esa es la potencia útil, la que llega al agua. La absorbida se
              obtiene dividiendo por el rendimiento.
          - valor: '25.5 kW'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. La
              absorbida es siempre la mayor de las dos.
        pista: |
          La potencia útil sale del caudal y de la altura; la absorbida,
          dividiendo por el 72 %.
        desarrollo: |
          $$
          P_{u} = 9800\cdot 0{,}087\cdot 41{,}5 = 35\,391\ \text{W}
          $$

          $$
          P_{abs} = \frac{35\,391}{0{,}72} = 49\,154\ \text{W}
          $$

          y a 0,1 euros el kWh, **4,92 euros por hora de fuente**.

      - tipo: justificar
        pregunta: Ordena en qué se van los 41,5 m que da la bomba. Una pieza es falsa.
        piezas:
          - texto: 'Diez metros suben el agua de la lámina, en la cota 1, a la boquilla, en la 11.'
          - texto: 'Dieciséis y pico se pierden en los 112 m equivalentes de tubería de 150 mm.'
          - texto: 'Y los 15,3 que quedan salen convertidos en velocidad, que es exactamente lo que sube el chorro.'
          - texto: 'Es decir, de cada tres metros que da la bomba, algo más de uno se pierde por el camino.'
          - texto: La fricción se podría eliminar acortando la tubería, y entonces el chorro subiría los 41,5 m que da la bomba.
            trampa: true
            mensaje: |
              No subiría a 41,5. Al bajar la pérdida, la instalación pide menos
              y el punto de funcionamiento **se desplaza a la derecha**: sube
              el caudal, y con él la energía cinética y la propia fricción.
              La bomba, además, da menos altura a más caudal. Las dos curvas se
              vuelven a cortar en otro sitio, y el chorro sube algo, pero ni de
              lejos hasta la altura de la bomba parada.
    resolucion: |
      ## Una fuente donde la mitad de la energía es el chorro

      El reparto de los 41,5 metros que da la bomba dice todo lo que hay que
      entender de esta instalación:

      | concepto | metros | del total |
      |---|---|---|
      | desnivel de la lámina a la boquilla | 10,0 | 24 % |
      | fricción en 112 m equivalentes | 16,3 | 39 % |
      | energía cinética del chorro | 15,3 | 37 % |

      **Más de un tercio de lo que entrega la bomba se pierde por el camino**,
      y otro tercio largo sale por el aire. Solo la cuarta parte se emplea en
      subir el agua.

      ## a) La curva de la instalación

      La longitud de cálculo son 112 m: los 25 de aspiración, los 75 de
      impulsión y los 12 equivalentes de las piezas. Con acero comercial de
      150 mm, C = 130.

      $$
      H_{mi} = 10 + 4{,}17\cdot 10^{-3}\,Q^{1{,}852} + 2{,}019\cdot 10^{-3}\,Q^{2}
      $$

      El término cuadrático no lleva factor de paso delante porque las piezas
      ya están contadas como longitud equivalente y el enunciado no da ninguna
      K para la boquilla. Lo que queda es la energía cinética pura del chorro,
      que en una fuente no es una pérdida: es el producto.

      ## c), d) y e) El punto de funcionamiento

      Con la INP 125/400 de rodete 408 mm, el corte cae en 87 l/s. Y ahí está
      la comprobación que hace fiable la lectura del catálogo:

      $$
      H_{mi}(87) = 10 + 16{,}29 + 15{,}28 = 41{,}58\ \text{m}
      $$

      contra los 41,5 m que el catálogo le asigna a la bomba en ese caudal. La
      curva de la instalación se calcula sin abrir el anexo, así que si las dos
      no coincidieran, la bomba o el rodete estarían mal elegidos.

      El chorro sube su altura de velocidad,

      $$
      h = 2{,}019\cdot 10^{-3}\cdot 87^{2} = 15{,}3\ \text{m}
      $$

      justo por encima de los 15 pedidos, y la bomba absorbe

      $$
      P = \frac{9800\cdot 0{,}087\cdot 41{,}5}{0{,}72} = 49{,}15\ \text{kW}
      $$

      ## f) Casi cinco euros la hora

      A 0,1 euros el kWh son **4,92 euros por hora**. Una fuente encendida ocho
      horas al día cuesta unos 39 euros diarios, más de mil al mes.

      Y ahí está la conversación de proyecto que este problema plantea sin
      decirlo. De esos 49 kW, **13,7 se los lleva el rendimiento del grupo** y
      **16,3 la fricción de la tubería**. Subir el diámetro de 150 a 200 mm
      dividiría esa pérdida por más de cuatro —el diámetro entra elevado a
      4,87— y con ella una buena parte de la factura, para siempre, a cambio de
      una obra que se hace una vez. En una instalación que va a estar encendida
      miles de horas al año, la tubería barata es la cara.

  - id: ejflu25-col99-el-sobrepresor-que-reparte-a-dos-servicios
    titulo: El sobrepresor que reparte a dos servicios
    fuente: Ejercicio 9.9 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En una fábrica se dispone para su abastecimiento de agua de una bomba que
      alimenta a un sobrepresor (B), cuya cota de lámina de agua es 24 y la
      presión que indica el manómetro es 490 kPa. El sobrepresor alimenta los
      servicios de la fábrica consistentes en una boquilla C, de 25 mm de
      diámetro situada en la cota 20 y un depósito presurizado (D) cuya cota de
      lámina de agua es 25. Se pide:

      **a)** Altura manométrica de la bomba para que el caudal suministrado al
      sobrepresor sea de 25 l/s.

      **b)** Potencia útil y bruta de la bomba si su rendimiento es del 75 %.

      **c)** Reparto de caudales a cada uno de los servicios, si el caudal
      conjunto es de 25 l/s.

      **d)** Presión señalada en el manómetro.

      **Datos:** Factor de paso de la boquilla K = 0,1 con la energía cinética
      de salida; pérdida de carga en AB = 2·10⁵·Q²; ídem en BN = 2,5·10⁴·Q²;
      ídem en NC = 1,5·10⁵·Q²; ídem en ND = 10⁵·Q² (caudal en m³/s y pérdidas
      en mca).

