      </svg>
      <figcaption>El depósito está diecisiete metros por encima de la boquilla, así que el agua baja sola. La bomba solo tiene que añadir lo que falte para que el chorro suba lo que se quiere. Dibujado con z = 22.</figcaption>
      </figure>
    pide: La curva de la instalación con z dentro, la altura del chorro sin bomba y la que hay que dar para llegar a treinta metros.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con z = 22 m, el término independiente de la curva de la instalación
          vale $5 - 22 = -17$ m. ¿Qué significa que sea negativo?
        opciones:
          - texto: Que el depósito está por encima de la boquilla y aporta 17 m de carga por gravedad
            correcta: true
            mensaje: |
              Eso es. La altura manométrica de la instalación es lo que hay que
              **añadir**, y aquí la gravedad ya pone 17 m. La bomba solo tiene
              que cubrir lo que falte para el chorro y las pérdidas.
          - texto: Que la instalación no funciona y hay que invertir el sentido
            mensaje: |
              Funciona perfectamente, y de hecho el apartado b) demuestra que
              con la bomba parada ya sale un chorro de once metros. Una altura
              manométrica negativa a caudal cero solo dice que sobra energía.
          - texto: Que hay que restar 17 m a lo que dé la bomba
            mensaje: |
              Ya está restado: los 17 m están dentro de la curva de la
              instalación. Restarlos otra vez sería contarlos dos veces.
          - texto: Que la boquilla está en cota negativa
            mensaje: |
              La boquilla está en la cota 5, positiva. Lo que es negativo es la
              **diferencia** entre ella y la lámina del depósito, que está más
              arriba.

      - tipo: calcular
        titulo: El coeficiente de la boquilla
        pregunta: |
          Coeficiente que multiplica a $Q^{2}$ en la curva de la instalación,
          con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.032309'
          tolerancia: 0.0004
          formato: un número, sin unidad
        distractores:
          - valor: '0.00082715'
            mensaje: |
              Has usado la sección de la tubería, de 100 mm. La energía
              cinética que hay que contar es la del chorro, que sale por los
              40 mm de la boquilla.
          - valor: '0.026532'
            mensaje: |
              Ese es el coeficiente de la fricción, el que va con
              $Q^{1{,}852}$. El cuadrático es el de la boquilla y son dos
              términos distintos.
        pista: |
          La boquilla no tiene factor de paso en este enunciado, así que el
          término cuadrático es solo la energía cinética de salida.
        desarrollo: |
          La sección de la boquilla es
          $A = \pi\,0{,}04^{2}/4 = 1{,}257\cdot 10^{-3}$ m², de modo que con el
          caudal en litros por segundo

          $$
          v_c = 0{,}796\,Q \qquad \frac{v_c^{2}}{2g} = 3{,}231\cdot 10^{-2}\,Q^{2}
          $$

          Y con la fricción —90 m de acero comercial de 100 mm, que dan
          C = 130 y $J_1 = 2{,}68\cdot 10^{-4}$, más un 10 % de pérdidas
          menores— la curva completa es

          $$
          H_{mi} = 5 - z + 2{,}653\cdot 10^{-2}\,Q^{1{,}852} + 3{,}231\cdot 10^{-2}\,Q^{2}
          $$

          Fíjate en el tamaño relativo: con el mismo caudal, **la altura de
          velocidad en la boquilla es treinta y nueve veces la de la tubería**,
          porque su sección es 6,25 veces menor y eso entra al cuadrado.

      - tipo: calcular
        titulo: El chorro con la bomba parada
        pregunta: |
          Altura que alcanza el chorro con z = 22 m y sin bomba, en metros.
        respuesta:
          tipo: magnitud
          valor: '11.09 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m)
        distractores:
          - valor: '17 m'
            mensaje: |
              Esos son los 17 m de desnivel enteros, como si la tubería no
              perdiera nada. Se pierden casi seis por el camino, y solo el
              resto sale convertido en velocidad.
          - valor: '0.28 m'
            mensaje: |
              Has usado la velocidad de la tubería. El chorro sale por la
              boquilla, seis veces y cuarto más estrecha, y su altura de
              velocidad es casi cuarenta veces mayor.
        pista: |
          Sin bomba, la altura manométrica de la instalación es cero, y de ahí
          sale el caudal. La altura del chorro es su altura de velocidad.
        desarrollo: |
          Con la bomba parada, $H_{mi} = 0$:

          $$
          17 = 2{,}653\cdot 10^{-2}\,Q^{1{,}852} + 3{,}231\cdot 10^{-2}\,Q^{2}
          $$

          y tanteando sale $Q = 18{,}53$ l/s. De los 17 m disponibles, 5,91 se
          los come la tubería y los otros

          $$
          h = 3{,}231\cdot 10^{-2}\cdot 18{,}53^{2} = 11{,}09\ \text{m}
          $$

          salen por el aire. **Un tercio del desnivel se pierde en noventa
          metros de tubería de 100 mm.**

      - tipo: calcular
        titulo: La altura que hay que pedirle a la bomba
        pregunta: |
          Altura manométrica que debe dar la bomba para que el chorro llegue a
          30 m con z = 22, en metros.
        respuesta:
          tipo: magnitud
          valor: '27.86 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '30 m'
            mensaje: |
              Esos son los metros de chorro, pero la bomba no tiene que darlos
              todos: el depósito ya pone 17 por gravedad. En cambio hay que
              sumar los casi 15 de fricción.
          - valor: '71.9 m'
            mensaje: |
              Has sumado la cota del depósito en vez de restarla. El depósito
              está por encima de la boquilla y ayuda, no estorba.
        pista: |
          Primero el caudal que da 30 m de chorro; después se evalúa la curva
          de la instalación en ese caudal.
        desarrollo: |
          $$
          30 = 3{,}231\cdot 10^{-2}\,Q^{2} \;\Longrightarrow\; Q = 30{,}47\ \text{l/s}
          $$

          $$
          H_{mi} = -17 + 2{,}653\cdot 10^{-2}\cdot 30{,}47^{1{,}852} + 30 = 27{,}86\ \text{m}
          $$

          Es decir: el chorro pide 30 m de energía cinética y la tubería otros
          14,9 de pérdida, pero el depósito regala 17. La bomba solo tiene que
          poner los 27,9 restantes.

      - tipo: justificar
        pregunta: Ordena qué pasa al instalar la bomba de catálogo. Una pieza es falsa.
        piezas:
          - texto: 'Para un chorro de 30 m hacen falta 30,47 l/s y una bomba que dé 27,86 m.'
          - texto: 'La bomba de catálogo que cubre eso es la INP 65/160 con rodete de 177 mm, y llega con margen.'
          - texto: 'El punto de funcionamiento cae en 31,6 l/s y unos 30,4 mca, algo por encima de lo pedido.'
          - texto: 'Con ese caudal el chorro sube 32,3 m en vez de 30, que es lo normal al elegir de una familia discreta de rodetes.'
          - texto: Como la bomba da más altura de la necesaria, el chorro subiría los 30,4 m que marca su curva.
            trampa: true
            mensaje: |
              La altura de la bomba no es la del chorro. De esos 30,4 m, la
              instalación se lleva primero la fricción y devuelve los 17 del
              desnivel; lo que sube el chorro es solo la energía cinética que
              le queda al salir, y esa se calcula con el caudal y la sección de
              la boquilla.
    resolucion: |
      ## Una instalación donde la gravedad ya hace parte del trabajo

      El depósito está en la cota z y la boquilla en la 5. Con z = 22, el agua
      baja diecisiete metros antes de salir, así que la bomba parte con ventaja
      — y el apartado b) lo demuestra: **con la bomba estropeada la fuente
      sigue funcionando**, con un chorro de once metros.

      ## a) La curva, con z dentro

      $$
      H_{mi} = 5 - z + 2{,}653\cdot 10^{-2}\,Q^{1{,}852} + 3{,}231\cdot 10^{-2}\,Q^{2}
      $$

      El término independiente es la diferencia de cotas, con signo: negativo
      cuando el depósito está arriba. El de $Q^{1{,}852}$ son los 90 m de
      acero comercial de 100 mm —C = 130— con el 10 % de pérdidas menores. Y
      el cuadrático es la energía cinética del chorro, sin ningún factor de
      paso porque el enunciado no le da ninguno a la boquilla.

      Los dos coeficientes cuentan una historia: **el de la boquilla es 1,2
      veces el de la tubería**, y eso que la tubería mide noventa metros y la
      boquilla es una pieza. La sección entra a la cuarta potencia.

      ## b) La fuente sin bomba

      Con $H_{mi} = 0$,

      $$
      17 = 2{,}653\cdot 10^{-2}\,Q^{1{,}852} + 3{,}231\cdot 10^{-2}\,Q^{2} \;\Longrightarrow\; Q = 18{,}53\ \text{l/s}
      $$

      y el chorro sube

      $$
      h = 3{,}231\cdot 10^{-2}\cdot 18{,}53^{2} = 11{,}09\ \text{m}
      $$

      El reparto de los 17 metros de desnivel: **5,91 se los queda la tubería y
      11,09 salen por el aire**. Un tercio de la energía disponible se pierde
      en el camino, y eso con la bomba parada — es decir, sin que nadie la
      pague.

      ## c) y d) Lo que hay que añadir para llegar a treinta

      Un chorro de 30 m necesita 30,47 l/s, y a ese caudal la instalación pide

      $$
      H_{mi} = -17 + 14{,}86 + 30 = 27{,}86\ \text{m}
      $$

      Merece la pena ver el balance completo, porque es contraintuitivo: para
      **triplicar** la altura del chorro —de 11 a 30 m— basta con una bomba de
      28 m, cuando el desnivel gratuito ya valía 17. La razón es que subir el
      caudal de 18,5 a 30,5 l/s multiplica por 2,7 la energía cinética pero
      solo por 2,5 la pérdida, y el desnivel sigue regalando los mismos 17
      metros pase lo que pase.

      Con la bomba de catálogo el punto de funcionamiento cae en 31,6 l/s y
      unos 30,4 mca, y ahí el chorro sube 32,3 m: por encima de los 30 pedidos,
      como suele pasar al elegir de una familia discreta de rodetes.

  - id: ejflu25-col919-llenar-la-piscina-con-la-red-y-una-bomba
    titulo: Llenar la piscina con la red, y con una bomba
    fuente: Ejercicio 9.19 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La instalación de la figura toma agua de la red general a una presión
      P0/γ = 25 mca para llenar una piscina de 48 m³ de capacidad. Toda la
      instalación, incluyendo el punto de acometida «O» y el de descarga «D»,
      se encuentra en una cota 0 m. La tubería de diámetro D = 25 mm es de PVC.
      Las válvulas A, B y C completamente abiertas tienen un coeficiente de
      pérdidas de carga K = 4 (adimensional) y la descarga D, KD = 2
      (adimensional). Se pide:

      **a)** Calcular analíticamente el caudal desaguado por la descarga D
      suponiendo que la bomba no ha sido instalada (**Darcy-Weisbach**).

      **b)** Suponiendo que la bomba está funcionando, siendo su curva
      característica la siguiente: Hb (mca) = 15 − 480000·Q² (Q en m³/s)

      **b1)** Obtener la expresión analítica de la altura manométrica de la
      instalación Hmi = f(Q) (**Hazen-Williams**).

      **b2)** Obtener gráficamente el punto de funcionamiento de la instalación
      (H, Q).

      **b3)** Calcular el tiempo de llenado de la piscina.

      **b4)** Si el tiempo de llenado son 8 horas, los rendimientos de la bomba
      y del motor eléctrico son ηbomba = 0,9; ηme = 0,75 y el precio del
      kWh = 0,32 euros, calcular el costo del llenado de la piscina.

      **Datos:** LAB = 10 m; LCD = 40 m.

