      </svg>
      <figcaption>El medidor de codo da el caudal sin más aparato que un tubo en U; el manómetro de mercurio da la presión en la aspiración. Con esos dos números se decide si la bomba cavita.</figcaption>
      </figure>
    pide: El caudal que da el codo, la presión en la aspiración, el NPSH disponible y por qué la lectura del manómetro no admite otra interpretación.
    pasos:
      - tipo: reconocer
        pregunta: |
          El medidor de codo no trae fórmula: el enunciado adjunta una curva de
          tarado obtenida en ensayo. ¿Por qué se tara y no se calcula?
        opciones:
          - texto: Porque lo que desequilibra las presiones es el giro del fluido en el codo, y eso depende de la geometría concreta de cada codo
            correcta: true
            mensaje: |
              Exacto. En un venturi o en un diafragma la contracción está
              normalizada y el coeficiente se tabula. En un codo lo que separa
              las presiones de la cara exterior y la interior es la fuerza
              centrífuga sobre el fluido al girar, y eso depende del radio de
              curvatura, de la rugosidad y del perfil de velocidades que
              llegue: cada codo es el suyo. Por eso el medidor de codo es
              baratísimo —no hay que instalar nada, el codo ya estaba— y por
              eso hay que tararlo.
          - texto: Porque el líquido es agua y las fórmulas de los medidores solo valen para gases
            mensaje: |
              Al revés: los medidores diferenciales están pensados justamente
              para líquidos incompresibles. El motivo del tarado es geométrico,
              no del fluido.
          - texto: Porque el caudal es muy pequeño y las fórmulas fallan por debajo de 10 l/s
            mensaje: |
              No hay ningún umbral así. Un venturi de 50 mm con 4 l/s se
              calcularía perfectamente con su coeficiente de tablas.
          - texto: Porque la curva sale de un tubo en U y los tubos en U no se pueden calcular
            mensaje: |
              El tubo en U sí se calcula, y de hecho el manómetro de mercurio de
              este mismo problema se resuelve con la ecuación de la
              hidrostática. Lo que no se calcula es la relación entre ese
              desnivel y el caudal que pasa por el codo.

      - tipo: calcular
        titulo: La velocidad en la aspiración
        pregunta: |
          Con el caudal que da la curva para h = 30 cm, velocidad del agua en
          la tubería de aspiración.
        respuesta:
          tipo: magnitud
          valor: '2.037 m/s'
          tolerancia: 0.01
          formato: una velocidad con su unidad (m/s)
        distractores:
          - valor: '0.917 m/s'
            mensaje: |
              Has leído la curva en el punto de 20 cm. La lectura del enunciado
              es h = 0,3 m, es decir 30 cm, y ahí hay otro punto de ensayo:
              4 l/s.
          - valor: '0.509 m/s'
            mensaje: |
              Has tomado los 50 mm como radio. Son el diámetro, así que el área
              es cuatro veces menor y la velocidad cuatro veces mayor.
        pista: |
          Los 50 mm son el diámetro, no el radio.
        desarrollo: |
          $$
          A = \frac{\pi\,0{,}05^{2}}{4} = 1{,}963\cdot 10^{-3}\ \text{m}^2 \qquad v = \frac{0{,}004}{1{,}963\cdot 10^{-3}} = 2{,}04\ \text{m/s}
          $$

          Y la altura de velocidad, que hará falta enseguida:
          $v^{2}/2g = 0{,}212$ m. Es pequeña, pero en un cálculo de cavitación
          **suma**, así que no se desprecia.

      - tipo: calcular
        titulo: La presión en la aspiración
        pregunta: |
          Presión manométrica a la entrada de la bomba, en metros de columna de
          agua.
        respuesta:
          tipo: magnitud
          valor: '-6.804 mca'
          tolerancia: 0.005
          formato: una presión con su unidad (mca), con su signo
        distractores:
          - valor: '-2.254 mca'
            mensaje: |
              Has cambiado los papeles de h₁ y h₂: has tomado h₁ como el
              desnivel de mercurio y h₂ como la bajada de agua. El último paso
              de este ejercicio demuestra que esa lectura es imposible, y lo
              hace sin mirar la solución.
          - valor: '-6.66 mca'
            mensaje: |
              Te has dejado los 14 cm de agua que hay entre el eje de la
              tubería y la superficie del mercurio. Son poca cosa al lado de
              los 6,66 m del mercurio, pero están.
        pista: |
          Baja desde el eje de la tubería por agua hasta el mercurio, cruza el
          mercurio hasta la otra superficie y sal a la atmósfera. Cada tramo
          suma si baja y resta si sube.
        desarrollo: |
          Recorriendo el manómetro desde la entrada E hasta la rama abierta:

          $$
          \frac{p_E}{\gamma} + h_1 + 13{,}6\,h_2 = 0
          $$

          $$
          \frac{p_E}{\gamma} = -0{,}14 - 13{,}6\cdot 0{,}49 = -0{,}14 - 6{,}66 = -6{,}80\ \text{mca}
          $$

          Casi siete metros de vacío. En términos absolutos son 3,20 mca, menos
          de un tercio de atmósfera: la bomba está trabajando cerca del límite,
          que es exactamente lo que el problema quiere que se compruebe.

      - tipo: calcular
        titulo: El NPSH disponible
        pregunta: |
          NPSH disponible en la instalación, tomando la presión atmosférica
          como 10 mca.
        respuesta:
          tipo: magnitud
          valor: '3.08 mca'
          tolerancia: 0.01
          formato: una altura de presión con su unidad (mca)
        distractores:
          - valor: '2.87 mca'
            mensaje: |
              Te has dejado la altura de velocidad. El NPSH se define sobre la
              **energía** del líquido a la entrada, no sobre su presión: los
              0,212 m de $v^{2}/2g$ entran sumando.
          - valor: '3.41 mca'
            mensaje: |
              No has descontado la presión de vapor. El NPSH es justamente el
              margen que le queda al líquido **por encima** de su presión de
              vapor; sin ese descuento no estás midiendo nada.
        pista: |
          $NPSH_d = \dfrac{p_E}{\gamma}\bigg|_{abs} + \dfrac{v^2}{2g} - \dfrac{p_v}{\gamma}$,
          y la presión absoluta es la atmosférica más la manométrica, que aquí
          es negativa.
        desarrollo: |
          $$
          NPSH_d = (10 - 6{,}804) + 0{,}212 - 0{,}33 = 3{,}08\ \text{mca}
          $$

          Contra los 2 mca que pide la bomba: sobran **1,08 mca**. La bomba
          **no cavita**, que es el resultado publicado.

          Conviene ver cuánto de ese margen depende de un dato que el enunciado
          no da. Si en vez de los 10 mca de costumbre se toma la atmósfera tipo
          a la cota 905 —90,9 kPa, es decir 9,28 mca— el NPSH disponible baja a
          **2,36 mca**. Sigue sin cavitar, pero el margen se queda en 36 cm. El
          veredicto no cambia; la tranquilidad, sí.

      - tipo: justificar
        pregunta: |
          El dibujo del manómetro admite, a primera vista, dos lecturas: que h₂
          sea el desnivel de mercurio o que lo sea h₁. Ordena la demostración
          de que solo una de las dos puede ser cierta.
        piezas:
          - texto: 'Entre la lámina del depósito inferior (cota 900, atmósfera, velocidad despreciable) y la entrada de la bomba (cota 905), Bernoulli da $0 = 5 + p_E/\gamma + v^2/2g + h_f$.'
          - texto: 'Despejando las pérdidas de la aspiración: $h_f = -5 - p_E/\gamma - 0{,}212$.'
          - texto: 'Con la lectura de h₂ como desnivel de mercurio, $p_E/\gamma = -6{,}804$ y salen $h_f = 1{,}59$ m.'
          - texto: 'Esos 1,59 m son 7,5 veces la altura de velocidad: una válvula de pie con filtro, un codo, la entrada y unos metros de tubería de 50 mm. Perfectamente normal.'
          - texto: 'Con la lectura alternativa, $p_E/\gamma = -2{,}254$ y saldrían $h_f = -2{,}96$ m: pérdidas negativas, una tubería que le regala carga al agua.'
          - texto: 'La lectura buena es la que reproduce el «No cavita» publicado, porque la otra daría un NPSH disponible por debajo del requerido.'
            trampa: true
            mensaje: |
              Las dos lecturas dan «no cavita»: con la buena el NPSH disponible
              es 3,08 mca y con la alternativa saldrían 7,63, y las dos superan
              los 2 mca requeridos. El resultado publicado **no distingue**
              entre ellas, y por eso hace falta el balance de la aspiración. Y
              aunque distinguiera: elegir la lectura que cuadra con la solución
              es ajustar, no demostrar.
        veredicto: |
          Cuando la figura no decide, decide la física. Casi siempre hay una
          **segunda ecuación que el problema no pedía** —aquí, el balance de la
          aspiración— capaz de descartar las lecturas imposibles. Ajustar el
          dato hasta que cuadre con el resultado publicado no demuestra nada,
          porque cualquier lectura se puede forzar.
    resolucion: |
      ## Dos aparatos baratos y una decisión

      El problema no pide un caudal ni una altura: pide un **veredicto**. Y
      para llegar a él hacen falta las dos lecturas que el enunciado adjunta,
      la curva del codo y el manómetro de mercurio.

      ## El caudal, de la curva de tarado

      El medidor de codo no tiene fórmula: se tara. Con h = 30 cm la curva da
      **Q = 4 l/s**, que además es uno de los cuatro puntos de ensayo.

      $$
      A = \frac{\pi\,0{,}05^{2}}{4} = 1{,}963\cdot 10^{-3}\ \text{m}^2 \qquad v = 2{,}04\ \text{m/s} \qquad \frac{v^{2}}{2g} = 0{,}212\ \text{m}
      $$

      ## La presión, del manómetro de mercurio

      $$
      \frac{p_E}{\gamma} = -h_1 - 13{,}6\,h_2 = -0{,}14 - 6{,}66 = -6{,}80\ \text{mca}
      $$

      ## El veredicto

      $$
      NPSH_d = (10 - 6{,}804) + 0{,}212 - 0{,}33 = 3{,}08\ \text{mca} \;>\; 2\ \text{mca}
      $$

      | término | mca |
      |---|---|
      | atmosférica | +10,00 |
      | presión en la entrada | −6,80 |
      | altura de velocidad | +0,21 |
      | presión de vapor | −0,33 |
      | **NPSH disponible** | **3,08** |

      **No cavita**, con 1,08 mca de margen.

      ## Lo que el enunciado no dice, y cuánto importa

      La presión atmosférica no aparece por ningún lado. Con los 10 mca de
      costumbre el margen es de 1,08 mca; con la atmósfera tipo a la cota 905
      —90,9 kPa, 9,28 mca— baja a 0,36. El veredicto es el mismo con las dos,
      y por eso el problema se puede cerrar sin decidir cuál usaba el autor.

      > **Y una ambigüedad más, esta sí decisiva.** El dibujo del manómetro
      > admite dos lecturas de h₁ y h₂, y llevan a presiones muy distintas:
      > −6,80 mca y −2,25. Ninguna de las dos hace cavitar la bomba, así que el
      > resultado publicado no sirve para elegir. Lo que sí sirve es el balance
      > de energía de la aspiración: con la primera salen 1,59 m de pérdidas y
      > con la segunda **−2,96**, que es imposible. El paso de justificación lo
      > desarrolla.

  - id: ejflu25-col917-el-tramo-estrecho-y-la-tuberia-en-paralelo
    titulo: El tramo estrecho, y la tubería en paralelo
    fuente: Ejercicio 9.17 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se proyecta una instalación de bombeo para trasvasar agua desde un
      depósito en la cota 130 a otro presurizado en la cota 200. Las tuberías
      son de acero comercial, de 200 mm de diámetro, a excepción del tramo CD
      (tubería 2), cuyo diámetro es de 150 mm, como se indica en la figura.
      Longitudes: L1 = 175 m; L2 = 70 m; L3 = 270 m. Despreciando las pérdidas
      menores, se pide:

      **a)** Expresión analítica de la cc de la instalación Hi = f(Q).
      Representar dicha curva en el papel adecuado.

      **b)** Seleccionar la bomba más apropiada de forma que al depósito E
      llegue como mínimo un caudal de 66 l/s.

      **c)** Punto de funcionamiento (H, Q, η) de la instalación de bombeo.

      **d)** Se decide colocar una tubería de 150 mm de diámetro y 50 m de
      longitud en paralelo con la 2 en el tramo CD. Obtener la nueva curva
      analítica de la instalación Hi = f(Q).

      **Nota:** Utilícese el método de H. Williams.

      **Nota nuestra:** el anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí. La bomba que sale del apartado
      b) es la **80-250 bF con rodete de 271 mm**, y su punto de funcionamiento
      con esta instalación es **71 l/s con 97,8 m y un rendimiento del 80,4 %**.
      El resto sale sin volver al catálogo.

