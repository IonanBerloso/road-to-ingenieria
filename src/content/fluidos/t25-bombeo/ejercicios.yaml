        <line x1="440" y1="140" x2="540" y2="140" stroke="var(--live)" stroke-width="1.6"/>
        <text x="490" y="176" text-anchor="middle" font-size="12" fill="var(--ink)">B</text>
        <line x1="424" y1="140" x2="424" y2="210" stroke="var(--faint)" stroke-width="1" marker-start="url(#m91)" marker-end="url(#m91)"/>
        <line x1="214" y1="210" x2="428" y2="210" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="428" y1="140" x2="444" y2="140" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="418" y="178" text-anchor="end" font-size="11" fill="var(--faint)">10 m</text>
        <line x1="152" y1="262" x2="188" y2="262" stroke="var(--live)" stroke-width="2" marker-end="url(#m91f)"/>
      </svg>
      <figcaption>Diez metros de desnivel y setecientos de tubería en dos diámetros. La bomba está justo a la salida de A, y el depósito B es el que más tarde se presurizará.</figcaption>
      </figure>
    pide: La curva de la instalación, el punto de funcionamiento con su potencia, y qué pasa al presurizar el depósito de llegada.
    pasos:
      - tipo: reconocer
        pregunta: |
          La curva de la instalación tiene la forma
          $H_{mi} = 10 + k\,Q^{1{,}852}$. ¿Qué es ese 10?
        opciones:
          - texto: La altura que la bomba tiene que dar aunque no circule nada, es decir el desnivel entre las dos láminas
            correcta: true
            mensaje: |
              Eso es. Con caudal cero no hay pérdidas, pero el líquido sigue
              teniendo que subir diez metros. Esa ordenada en el origen es la
              parte de la instalación que no depende del caudal, y es la que se
              mueve cuando se presuriza un depósito.
          - texto: La pérdida de carga de la instalación con el caudal de diseño
            mensaje: |
              Las pérdidas son el otro término, el que va con
              $Q^{1{,}852}$. Este es constante: no cambia con el caudal.
          - texto: La longitud equivalente de las piezas especiales
            mensaje: |
              El enunciado dice expresamente que se desprecian las pérdidas
              menores. Y aunque no las despreciara, irían dentro del término
              que depende del caudal.
          - texto: La altura manométrica de la bomba con la válvula cerrada
            mensaje: |
              Esa es la de la **bomba**, y vale 38 m según su tabla. La de la
              instalación con caudal cero es otra cosa: lo que hace falta, no
              lo que se puede dar.

      - tipo: calcular
        titulo: El coeficiente de pérdidas de la instalación
        pregunta: |
          Coeficiente k de la curva de la instalación, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.020434'
          tolerancia: 0.0002
          formato: un número, sin unidad
        distractores:
          - valor: '0.001834'
            mensaje: |
              Solo has contado la tubería 1. La 2 es más larga y más estrecha,
              y aporta diez veces más pérdida que la 1.
          - valor: '0.012025'
            mensaje: |
              Has cruzado las longitudes con los diámetros. La 1 mide 200 m y
              es de 200 mm; la 2 mide 500 m y es de 150.
        pista: |
          Fibrocemento tiene 0,01 cm de rugosidad. Con 200 y 150 mm las dos
          caen en la misma banda del cuadro nº 25.
        desarrollo: |
          Con $\varepsilon = 0{,}01$ cm, la relación $\varepsilon/D$ vale
          $5\cdot 10^{-4}$ en la tubería 1 y $6{,}6\cdot 10^{-4}$ en la 2: las
          dos dan **C = 130**.

          $$
          J_1 = 9{,}17\cdot 10^{-6} \qquad J_1' = 3{,}72\cdot 10^{-5}
          $$

          $$
          k = 9{,}17\cdot 10^{-6}\cdot 200 + 3{,}72\cdot 10^{-5}\cdot 500 = 0{,}020434
          $$

          de modo que la curva de la instalación es
          $H_{mi} = 10 + 0{,}020434\,Q^{1{,}852}$, con Q en l/s y H en metros de
          columna de **líquido**, no de agua.

          Fíjate en el reparto: la tubería 1 aporta 0,0018 y la 2 aporta 0,0186.
          **Diez veces más**, y eso que solo es dos veces y media más larga. La
          diferencia la hace el diámetro, que entra elevado a 4,87.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          Potencia absorbida por la bomba en el punto de funcionamiento, en kW.
          Ahí el caudal es de 42,5 l/s, la altura 31 m y el rendimiento 76 %.
        respuesta:
          tipo: magnitud
          valor: '20.39 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '16.99 kW'
            mensaje: |
              Has usado el peso específico del agua. El líquido pesa un 20 %
              más, y la potencia va con el peso que se eleva.
          - valor: '15.49 kW'
            mensaje: |
              Esa es la potencia útil. La absorbida se obtiene **dividiendo**
              por el rendimiento, no multiplicando.
        pista: |
          El peso específico del líquido es 1,2 veces el del agua, y la
          potencia absorbida es la útil dividida por el rendimiento.
        desarrollo: |
          El punto de funcionamiento es el corte de las dos curvas. Con la de
          la instalación creciendo y la de la bomba bajando, se cruzan en

          $$
          Q = 42{,}5\ \text{l/s} \qquad H_m = 31\ \text{m} \qquad \eta = 76\ \%
          $$

          $$
          P_{abs} = \frac{\gamma\,Q\,H}{\eta} = \frac{1{,}2\cdot 9800\cdot 0{,}0425\cdot 31}{0{,}76} = 20\,387\ \text{W}
          $$

      - tipo: calcular
        titulo: La instalación con B presurizado
        pregunta: |
          Nueva ordenada en el origen de la curva de la instalación al
          presurizar B a 0,5 kg/cm², en metros de columna de líquido.
        respuesta:
          tipo: magnitud
          valor: '14.17 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m)
        distractores:
          - valor: '15 m'
            mensaje: |
              Has sumado los 5 metros de columna de **agua** que equivalen a
              0,5 kg/cm². La instalación se mide en columna del líquido, que
              pesa un 20 % más: los mismos 5 mca son solo 4,17 mcl.
          - valor: '16 m'
            mensaje: |
              Has multiplicado por 1,2 en vez de dividir. Un líquido más pesado
              necesita **menos** metros de columna para dar la misma presión.
        pista: |
          0,5 kg/cm² son 5 mca. Hay que pasarlos a metros de columna de este
          líquido antes de sumarlos.
        desarrollo: |
          $$
          \frac{p_B}{\gamma} = \frac{0{,}5\cdot 10}{1{,}2} = 4{,}17\ \text{mcl}
          $$

          $$
          H_{mi}' = 10 + 4{,}17 + 0{,}020434\,Q^{1{,}852} = 14{,}17 + 0{,}020434\,Q^{1{,}852}
          $$

          La curva **no cambia de forma**: se desplaza hacia arriba
          paralelamente a sí misma, 4,17 m en todos los caudales. Por eso el
          nuevo punto de funcionamiento se desplaza hacia la izquierda sobre la
          curva de la bomba, hasta Q = 39 l/s, H = 32,4 m y un rendimiento de
          77,2 %.

      - tipo: calcular
        titulo: La presión que pararía el trasvase
        pregunta: |
          Presión manométrica en B para la cual dejaría de circular líquido, en
          kPa.
        respuesta:
          tipo: magnitud
          valor: '330 kPa'
          tolerancia: 0.02
          formato: una presión con su unidad (kPa, mca o kg/cm²)
        distractores:
          - valor: '274 kPa'
            mensaje: |
              Has convertido los 28 metros como si fueran de agua. Son de este
              líquido, que pesa un 20 % más, así que la presión que producen es
              mayor.
          - valor: '447 kPa'
            mensaje: |
              Te has dejado los 10 m de desnivel. De los 38 que da la bomba a
              caudal cero, diez ya se los lleva la altura geométrica; solo los
              28 restantes se pueden convertir en presión en B.
        pista: |
          Deja de circular cuando las dos curvas ya no se cortan, y eso ocurre
          cuando la ordenada en el origen de la instalación alcanza la de la
          bomba.
        desarrollo: |
          La bomba a caudal cero da 38 mcl, y ese es el techo. Si la ordenada
          en el origen de la instalación llega a 38, las dos curvas se tocan
          solo en Q = 0 y no hay punto de funcionamiento con caudal.

          $$
          \frac{p_B}{\gamma} = 38 - 10 = 28\ \text{mcl}
          $$

          $$
          p_B = 28\cdot 1{,}2\cdot 9800 = 329\,280\ \text{Pa}
          $$

          es decir 330 kPa, unos 3,4 kg/cm².

      - tipo: justificar
        pregunta: Ordena qué le hace al sistema presurizar el depósito de llegada. Una pieza es falsa.
        piezas:
          - texto: 'Presurizar B añade una carga que no depende del caudal, así que sube la ordenada en el origen de la instalación.'
          - texto: 'La curva se desplaza hacia arriba paralelamente a sí misma, sin cambiar de pendiente.'
          - texto: 'El corte con la curva de la bomba se mueve hacia la izquierda, así que el caudal baja y la altura sube.'
          - texto: 'Y hay un tope: cuando la ordenada en el origen alcanza los 38 m que da la bomba parada, el caudal se hace cero.'
          - texto: Presurizar B empina la curva de la instalación, porque aumenta la pérdida de carga en la tubería.
            trampa: true
            mensaje: |
              La presión de B no toca la tubería. La pérdida sigue siendo la
              misma para cada caudal, así que la pendiente no cambia: lo que
              cambia es el punto de partida. Empinar la curva es lo que hace
              una **válvula**, y son dos efectos distintos que conviene no
              mezclar.
    resolucion: |
      ## Dos tuberías, una bomba y una cuestión de columna

      El problema es un trasvase corriente, pero tiene dos detalles que lo
      hacen valioso: el líquido no es agua, y el depósito de llegada se puede
      presurizar. Los dos obligan a tener claro en qué unidades se está
      trabajando.

      ## a) La curva de la instalación

      Fibrocemento en los dos tramos y C = 130 en los dos, porque
      $\varepsilon/D$ vale $5\cdot 10^{-4}$ y $6{,}6\cdot 10^{-4}$, las dos en
      la misma banda.

      $$
      k = 9{,}17\cdot 10^{-6}\cdot 200 + 3{,}72\cdot 10^{-5}\cdot 500 = 0{,}020434
      $$

      $$
      H_{mi} = 10 + 0{,}020434\,Q^{1{,}852}
      $$

      El reparto entre las dos tuberías merece un vistazo: la 1 pone 0,0018 y
      la 2 pone 0,0186. **La tubería estrecha aporta diez veces más pérdida**
      siendo solo dos veces y media más larga. En Hazen-Williams el diámetro
      entra elevado a 4,87, así que bajar de 200 a 150 mm multiplica la pérdida
      unitaria por cuatro.

      Y una cosa que el enunciado no subraya y conviene decir: esos metros son
      **metros de columna del líquido**, no de agua. Mientras todo el problema
      se escriba así, la densidad 1,2 no aparece por ningún lado — hasta que
      haya que convertir una presión o calcular una potencia.

      ## b) y c) El punto de funcionamiento

      La curva de la bomba es plana en 38 m hasta los 20 l/s y luego cae; la de
      la instalación arranca en 10 y sube. Se cortan en

      $$
      Q = 42{,}5\ \text{l/s} \qquad H_m = 31\ \text{m} \qquad \eta = 76\ \%
      $$

      $$
      P_{abs} = \frac{1{,}2\cdot 9800\cdot 0{,}0425\cdot 31}{0{,}76} = 20\,387\ \text{W}
      $$

      es decir 20,39 kW. Aquí sí entra el 1,2: la potencia es peso por altura, y este líquido pesa
      un 20 % más que el agua. Quien use 9800 se queda en 16,99 kW, un 17 % por
      debajo, y compra un motor que se quema.

      ## d) Presurizar B, y qué le hace a la curva

      $$
      \frac{p_B}{\gamma} = \frac{0{,}5\cdot 10}{1{,}2} = 4{,}17\ \text{mcl}
      $$

      Los 0,5 kg/cm² son 5 metros de columna de agua, pero solo 4,17 de este
      líquido — porque hace falta menos altura de un líquido pesado para dar la
      misma presión.

      Y el efecto sobre la curva es el que hay que entender: **se desplaza hacia
      arriba paralelamente**, sin cambiar de pendiente, porque la presión de B
      no depende del caudal. El nuevo corte queda en Q = 39 l/s, H = 32,4 m y
      η = 77,2 %.

      Compárese con lo que haría una válvula: esa empina la curva, porque su
      pérdida sí crece con el caudal. Dos formas de reducir el caudal, con dos
      geometrías distintas y consecuencias energéticas distintas.

      ## e) El tope

      Si la ordenada en el origen sube lo suficiente, las dos curvas dejan de
      cortarse en un caudal positivo. El límite es la altura que la bomba da a
      caudal cero, 38 mcl, de la cual diez ya están comprometidos en el
      desnivel:

      $$
      \frac{p_B}{\gamma} = 28\ \text{mcl} \;\Longrightarrow\; p_B = 28\cdot 1{,}2\cdot 9800 = 329\,280\ \text{Pa}
      $$

      Unos 3,4 kg/cm². Por encima de eso la bomba giraría sin trasvasar nada,
      calentando el líquido que tiene dentro — que es exactamente la situación
      que hay que evitar y la razón de que las instalaciones lleven un caudal
      mínimo de recirculación.

  - id: ejflu25-col92-la-fuente-de-chorro-regulable
    titulo: La fuente de chorro regulable
    fuente: Ejercicio 9.2 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se quiere diseñar una fuente formada por un solo chorro vertical, de
      altura variable. La salida del chorro se sitúa 3 m por encima de la
      lámina de agua del depósito despresurizado de alimentación A.

      Se proyecta una instalación de bombeo que suministra el caudal necesario
      a la fuente, formada por una tubería de hierro galvanizado de 175 mm de
      diámetro y una longitud equivalente total de 75 m. La boquilla de salida
      del chorro, de 80 mm de diámetro, tiene un factor de paso de 0,8 con la
      energía cinética de salida. Se pide:

      **a)** Dibujar el esquema de la instalación y calcular la expresión
      analítica de la curva característica de dicha instalación.

      **b)** Seleccionar la bomba más adecuada para que la altura del chorro
      sea como mínimo de 8 m.

      **c)** Calcular el punto de funcionamiento (Q, H), el rendimiento de la
      bomba, la potencia absorbida y el costo por m³ si el precio del kWh es de
      0,11 euros.

      **d)** Si se quiere que en intervalos determinados la altura del chorro
      disminuya a 5 m, hallar la pérdida de carga que habrá que introducir
      mediante una válvula de regulación de caudal.

      **Nota nuestra:** el apartado b) se resuelve mirando el catálogo de
      curvas de bombas del anexo, que no se puede reproducir aquí. La bomba que
      elige la propia resolución del boletín es la **150-250bF a 1400 rpm con
      rodete de 256 mm**, y estos son los puntos de su curva característica tal
      como los da esa resolución. Con ellos se pueden hacer los apartados c) y
      d) enteros.

      | Q (l/s) | 40 | 50 | 60 | 70 | 80 | 90 |
      |---|---|---|---|---|---|---|
      | H (m) | 22 | 22 | 22 | 21,8 | 21 | 19,7 |

      <figure class="figura-examen">
      <svg viewBox="0 0 560 340" role="img" width="560" height="340"
           aria-labelledby="f92t f92d">
        <title id="f92t">La fuente, su boquilla y el chorro</title>
        <desc id="f92d">A la izquierda el deposito A, abierto a la atmosfera.
        De el sale la tuberia de hierro galvanizado, de 175 milimetros y 75
        metros de longitud equivalente, que pasa por la bomba y sube hasta la
        boquilla de 80 milimetros, situada tres metros por encima de la lamina
        de A. De la boquilla sale el chorro vertical, cuya altura h es lo que
        se quiere regular. El eje vertical esta a escala, con diez pixeles por
        metro.</desc>
        <defs>
          <marker id="m92" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
          <marker id="m92f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M40,220 H180 V284 H40 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M40,206 V284 H180 V206" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="40" y1="220" x2="180" y2="220" stroke="var(--live)" stroke-width="1.6"/>
        <text x="110" y="250" text-anchor="middle" font-size="12" fill="var(--ink)">A</text>
        <text x="110" y="200" text-anchor="middle" font-size="10.5" fill="var(--faint)">lámina libre</text>
        <path d="M180,266 H236" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="250" cy="266" r="14" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="250" y="298" text-anchor="middle" font-size="10.5" fill="var(--ink)">bomba</text>
