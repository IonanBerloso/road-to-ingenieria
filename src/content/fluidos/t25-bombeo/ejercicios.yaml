        <text x="526" y="180" text-anchor="end" font-size="10.5" fill="var(--faint)">13 m</text>
        <line x1="330" y1="217" x2="330" y2="280" stroke="var(--faint)" stroke-width="1" marker-start="url(#m96)" marker-end="url(#m96)"/>
        <line x1="326" y1="217" x2="404" y2="217" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="324" y="252" text-anchor="end" font-size="10.5" fill="var(--faint)">3,89 m</text>
        <text x="60" y="200" font-size="10" fill="var(--faint)">acero comercial · D = 150 mm · s = 1,2</text>
        <line x1="230" y1="256" x2="230" y2="228" stroke="var(--live)" stroke-width="2" marker-end="url(#m96f)"/>
      </svg>
      <figcaption>La bomba está a ras de suelo y el depósito de aspiración, enterrado: por eso hay que subir el líquido casi cuatro metros antes de empezar, y por eso el apartado g) es la parte delicada del problema.</figcaption>
      </figure>
    pide: La curva de la instalación, la potencia en el punto de funcionamiento, lo que cuesta estrangular a 20 l/s y el margen que queda contra la cavitación.
    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito C está presurizado a 235,2 kPa **absolutos**. ¿Qué altura
          de columna hay que sumarle a su cota de 680 para escribir la curva de
          la instalación?
        opciones:
          - texto: Unos 12 m; se resta primero la atmosférica y el resto se pasa a columna de este líquido
            correcta: true
            mensaje: |
              Eso es. Bernoulli se escribe en presiones manométricas, así que
              primero se descuenta la atmósfera, y el resto se divide por el
              peso específico **del líquido**, que es 1,2 veces el del agua.
          - texto: 20 m; la presión absoluta dividida por el peso específico del líquido
            mensaje: |
              Ese es el valor absoluto, y es correcto como tal —235 200 entre
              11 760 son 20 mcl—, pero en la curva de la instalación entra la
              manométrica. Si no se resta la atmósfera, el depósito de arriba
              parece ocho metros más alto de lo que es.
          - texto: 24 m; la presión dividida por el peso específico del agua
            mensaje: |
              Dos errores en uno: no has restado la atmosférica y has usado el
              peso específico del agua. Toda la instalación se escribe en
              metros de columna de este líquido.
          - texto: 13 m; la diferencia de cotas ya lo incluye
            mensaje: |
              Los 13 m son la diferencia de cotas entre C y B, y la presión de
              C es algo aparte que se suma encima. Son dos términos distintos y
              los dos van en la ordenada en el origen.

      - tipo: calcular
        titulo: El coeficiente de pérdidas
        pregunta: |
          Coeficiente de la curva de la instalación que multiplica a
          $Q^{1{,}852}$, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.02233'
          tolerancia: 0.0002
          formato: un número, sin unidad
        distractores:
          - valor: '0.018611'
            mensaje: |
              Solo has contado la impulsión. La aspiración son otros 100 m de
              la misma tubería, y también pierden.
          - valor: '0.019469'
            mensaje: |
              Has usado C = 140. Con acero comercial —rugosidad 0,006 cm— y
              150 mm, la relación $\varepsilon/D$ vale $4\cdot 10^{-4}$, que en
              el cuadro nº 25 cae en la banda de C = 130.
        pista: |
          Los 100 m de aspiración y los 500 de impulsión son la misma tubería,
          así que se suman antes de aplicar Hazen-Williams.
        desarrollo: |
          Acero comercial tiene $\varepsilon = 0{,}006$ cm, de modo que con
          150 mm sale $\varepsilon/D = 4\cdot 10^{-4}$ y **C = 130**, con
          $J_1 = 3{,}72\cdot 10^{-5}$. Sobre los 600 m totales:

          $$
          k = 3{,}72\cdot 10^{-5}\cdot 600 = 0{,}02233
          $$

          Y con la ordenada en el origen —13 m de cota más 12,01 de presión en
          C— la curva de la instalación queda

          $$
          H_{mi} = 25{,}01 + 0{,}02233\,Q^{1{,}852}
          $$

          en metros de columna de líquido y con Q en l/s.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          Potencia absorbida en el punto de funcionamiento, en kW. Ahí el
          caudal es de 21,4 l/s y el rendimiento del 72,7 %.
        respuesta:
          tipo: magnitud
          valor: '10.9 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '9.09 kW'
            mensaje: |
              Has usado el peso específico del agua. El líquido pesa un 20 %
              más y la potencia va con el peso que se eleva.
          - valor: '7.93 kW'
            mensaje: |
              Esa es la potencia útil. La absorbida se obtiene dividiendo por
              el rendimiento, no multiplicando.
        pista: |
          La altura del punto de funcionamiento sale de la propia curva de la
          instalación evaluada en 21,4 l/s.
        desarrollo: |
          La curva de la bomba y la de la instalación se cortan en 21,4 l/s, y
          ahí la instalación pide

          $$
          H = 25{,}01 + 0{,}02233\cdot 21{,}4^{1{,}852} = 31{,}5\ \text{mcl}
          $$

          que es exactamente lo que da la bomba a 77 m³/h según su curva. Esa
          coincidencia es la comprobación de que la lectura del catálogo está
          bien hecha.

          $$
          P = \frac{\gamma\,Q\,H}{\eta} = \frac{11\,760\cdot 0{,}0214\cdot 31{,}5}{0{,}727} = 10\,906\ \text{W}
          $$

      - tipo: calcular
        titulo: La pérdida que hay que meter con la válvula
        pregunta: |
          Pérdida de energía que habría que producir con la válvula para que
          circularan justo 20 l/s, en metros de columna de líquido.
        respuesta:
          tipo: magnitud
          valor: '1.3 m'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (m o mca)
        distractores:
          - valor: '0.765 m'
            mensaje: |
              Has restado las dos alturas de la **instalación**, la de 21,4 l/s
              y la de 20. Pero al cerrar la válvula la bomba se mueve por su
              curva y sube a 32,0 m; es contra ese valor contra el que hay que
              restar.
          - valor: '0.524 m'
            mensaje: |
              Has mezclado los dos caudales: la altura de la bomba a 20 l/s
              contra la altura de la instalación a 21,4. Las dos curvas se
              evalúan en el **mismo** caudal, el nuevo.
        pista: |
          A 20 l/s —que son 72 m³/h— la bomba da 32,0 m según su curva y la
          instalación necesita menos. La válvula se come la diferencia.
        desarrollo: |
          $$
          H_{mi}(20) = 25{,}01 + 0{,}02233\cdot 20^{1{,}852} = 30{,}74\ \text{mcl}
          $$

          Y 20 l/s son 72 m³/h, donde la curva de la bomba vale 32,03 m. Por
          tanto

          $$
          h_{f,\text{válvula}} = 32{,}03 - 30{,}74 = 1{,}29\ \text{mcl}
          $$

          que es el 1,3 que publica el boletín.

          Merece la pena ver lo pequeña que es la corrección de caudal: pasar
          de 21,4 a 20 l/s —un 6,5 % menos— cuesta 1,3 m de estrangulamiento
          permanente. Las curvas son planas ahí, y por eso regular con válvula
          es tan ineficiente en esta zona.

      - tipo: calcular
        titulo: El coste anual de la maniobra
        pregunta: |
          Coste anual de la energía que disipa la válvula, en euros, con 4500
          horas al año y el kWh a 0,1 euros.
        respuesta:
          tipo: numero
          valor: '137.7'
          tolerancia: 2
          formato: un número, en euros
        distractores:
          - valor: '189.3'
            mensaje: |
              Has dividido por el rendimiento de la bomba. La energía que se
              disipa en la válvula es la que ya está en el líquido: se cuenta
              como potencia útil perdida, no como potencia absorbida de más.
          - valor: '147.2'
            mensaje: |
              Has usado el caudal del punto de funcionamiento sin válvula. Con
              la válvula puesta circulan 20 l/s, que es de lo que se trata.
        pista: |
          La potencia disipada es el peso del líquido que pasa por segundo por
          los metros que se le quitan.
        desarrollo: |
          $$
          P = \gamma\,Q\,h_{f,\text{válvula}} = 11\,760\cdot 0{,}020\cdot 1{,}3 = 306\ \text{W}
          $$

          En 4500 horas son 1376 kWh, y a 0,1 euros el kWh, **137,7 euros al
          año**.

          Trescientos vatios permanentes por bajar un 6,5 % el caudal. No es
          una cifra grande en sí, pero es dinero que se paga por calentar el
          líquido, y se paga todos los años que la instalación funcione así.

      - tipo: calcular
        titulo: El margen contra la cavitación
        pregunta: |
          NPSH de seguridad en el punto de funcionamiento, en metros de columna
          de líquido. Toma la presión atmosférica del lugar como 94 kPa.
        respuesta:
          tipo: magnitud
          valor: '0.52 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mcl)
        distractores:
          - valor: '1.14 m'
            mensaje: |
              Has usado la atmosférica a nivel del mar. La instalación está a
              680 m de altitud y ahí la atmósfera empuja medio metro de columna
              menos, que es más de lo que sobra de margen.
          - valor: '1.6 m'
            mensaje: |
              Te has dejado la pérdida de la tubería de aspiración, que con
              21,4 l/s en 100 m son 1,08 m.
        pista: |
          El NPSH disponible es la atmosférica menos la altura del eje sobre la
          lámina, menos la pérdida de aspiración, menos la tensión de vapor. El
          de seguridad es lo que sobra sobre el requerido.
        desarrollo: |
          $$
          \frac{p_{atm}}{\gamma} = \frac{94\,000}{11\,760} = 7{,}99\ \text{mcl} \qquad z = 670{,}89 - 667 = 3{,}89\ \text{m}
          $$

          $$
          h_{f,asp} = 3{,}72\cdot 10^{-5}\cdot 100\cdot 21{,}4^{1{,}852} = 1{,}08\ \text{mcl}
          $$

          $$
          NPSH_d = 7{,}99 - 3{,}89 - 1{,}08 - 0{,}5 = 2{,}52\ \text{mcl}
          $$

          y con los 2 mca que pide la bomba a ese caudal,

          $$
          NPSH_s = 2{,}52 - 2 = 0{,}52\ \text{mcl}
          $$

          Medio metro de margen. Es poco, y lo que se lo come es la posición de
          la bomba: los 3,89 m que hay del agua al eje son casi la mitad de lo
          que empuja la atmósfera.

      - tipo: justificar
        pregunta: Ordena de dónde sale la presión atmosférica de 94 kPa, que el enunciado no da. Una pieza es falsa.
        piezas:
          - texto: 'El enunciado no dice la presión atmosférica, y hace falta en dos sitios: la presión de C es absoluta y el NPSH también.'
          - texto: 'Del apartado a) se puede despejar: para que la ordenada en el origen valga los 25,01 publicados, la atmosférica tiene que ser 94,0 kPa.'
          - texto: 'Y del apartado g) sale otra vez lo mismo: para que el NPSH de seguridad valga 0,52, la atmosférica tiene que ser 94,0 kPa.'
          - texto: 'Dos ecuaciones independientes dan el mismo número, así que el dato está confirmado, no supuesto — y coincide con la atmósfera tipo a 680 m de altitud.'
          - texto: Con la atmosférica a nivel del mar sale lo mismo, porque la presión de C ya viene medida en el lugar.
            trampa: true
            mensaje: |
              No sale lo mismo, y por eso el dato importa. Con 101,3 kPa la
              ordenada en el origen sería 24,38 en vez de 25,01 y el NPSH de
              seguridad 1,14 en vez de 0,52: **más del doble de margen**. En
              una instalación que se queda en medio metro, eso es la diferencia
              entre proyectar bien y proyectar sobre el papel.
    resolucion: |
      ## El problema que abre el anexo de bombas

      Este es el primero del capítulo que obliga a leer el catálogo de curvas
      de bombas, y por eso conviene decir cómo se comprueba una lectura de
      catálogo, que es la parte que suele dar miedo.

      La respuesta es que **no hay que fiarse: se contrasta**. La curva de la
      instalación se calcula sin tocar el catálogo, y su valor en el caudal
      publicado tiene que coincidir con la altura publicada. Aquí:

      $$
      H_{mi}(21{,}4) = 25{,}01 + 0{,}02233\cdot 21{,}4^{1{,}852} = 31{,}51\ \text{mcl}
      $$

      contra los 31,5 mcl que da la curva de la bomba en 77 m³/h. Coinciden en
      la primera decimal, así que la bomba, el rodete y el punto están bien
      leídos.

      ## a) La curva, y el dato que no está

      El término de fricción es directo: 600 m —los 100 de aspiración más los
      500 de impulsión— de acero comercial de 150 mm, con C = 130.

      $$
      k = 3{,}72\cdot 10^{-5}\cdot 600 = 0{,}02233
      $$

      El término independiente tiene más miga. Son los 13 m de cota más la
      presión de C, que viene en **absolutos**:

      $$
      \frac{p_C}{\gamma} = \frac{235\,200 - p_{atm}}{11\,760}
      $$

      Y ahí falta un dato. Con la atmosférica a nivel del mar salen 24,38 y el
      boletín publica 25,01; el número cuadra con
      **$p_{atm} = 94{,}0$ kPa**, que es la atmósfera tipo a los 680 m de
      altitud a los que está el depósito C. El enunciado no lo dice.

      Lo que convierte esa deducción en un dato fiable es que **el apartado g)
      la confirma por otro camino**: para que el NPSH de seguridad valga los
      0,52 publicados hace falta exactamente la misma presión. Dos ecuaciones
      independientes, el mismo número.

      ## c) y d) El punto de funcionamiento

      $$
      Q = 21{,}4\ \text{l/s} \qquad H = 31{,}5\ \text{mcl} \qquad \eta = 72{,}7\ \%
      $$

      $$
      P = \frac{11\,760\cdot 0{,}0214\cdot 31{,}5}{0{,}727} = 10{,}9\ \text{kW}
      $$

      El 1,2 del peso específico entra aquí y en ningún sitio más de la curva:
      quien use 9800 se queda en 9,09 kW, un 17 % por debajo, y elige un motor
      pequeño.

      ## e) y f) Lo que cuesta bajar un 6,5 % el caudal

      Se querían 20 l/s y la instalación da 21,4. Para bajar esa diferencia hay
      que estrangular, y la válvula tiene que disipar

      $$
      h_f = 32{,}03 - 30{,}74 = 1{,}29\ \text{mcl}
      $$

      —la altura de la bomba a 72 m³/h contra lo que la instalación necesita a
      ese caudal—. Son 306 W permanentes, 1376 kWh al año, **137,7 euros**.

      Y la proporción es la lección: **un 6,5 % menos de caudal cuesta un 4 %
      de la altura entera**, para siempre. Con las dos curvas casi planas en
      esa zona, la válvula tiene que trabajar mucho para mover poco. Si el
      caudal exacto importara de verdad, saldría más barato recortar el rodete
      —de 320 a 310 mm— que estrangular todos los días.

      ## g) Medio metro de margen

      $$
      NPSH_d = \frac{94\,000}{11\,760} - 3{,}89 - 1{,}08 - 0{,}5 = 2{,}52\ \text{mcl}
      $$

      y con los 2 mca que exige la bomba, quedan **0,52 mcl**.

      Es un margen escaso, y conviene ver quién se lo come. La atmósfera aporta
      7,99 m; de ahí, 3,89 se van en subir el líquido desde el depósito
      enterrado hasta el eje de la bomba —casi la mitad—, 1,08 en la tubería de
      aspiración y 0,5 en la tensión de vapor. Bajar la bomba dos metros
      duplicaría el margen y no costaría nada más que excavar; subirla dos
      metros la haría cavitar.

  - id: ejflu25-col97-la-fuente-del-jardin-y-los-ocho-metros-exactos
    titulo: La fuente del jardín, y los ocho metros exactos
    fuente: Ejercicio 9.7 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se quiere diseñar una fuente para decorar un jardín, formada por un solo
      chorro que alcance desde el punto de salida una altura de 8 m. Para ello
      es necesaria una instalación de bombeo, en la que el depósito de
      aspiración se encuentra en el subsuelo encontrándose su lámina de agua en
      la cota −1 y a la presión atmosférica. La salida de la boquilla se dispone
      en la cota 2, siendo su diámetro 80 mm, con un factor de paso de 0,2 con
      la energía cinética de salida. Se pide:

      **a)** Expresión analítica de la curva característica de la instalación,
      dibujándola en papel adecuado.

      **b)** Seleccionar la bomba más conveniente entre aquellas cuyas cc se
      adjuntan, determinando el punto de funcionamiento (Q, H y η).

      **c)** Altura que alcanzará el chorro con la bomba seleccionada.

      **d)** Costo horario del funcionamiento de la fuente si el precio del kWh
      es de 0,1 euros, siendo 0,9 el rendimiento del motor eléctrico.

      **e)** Pérdida de carga que habrá que introducir puntualmente en la
      instalación si se quiere alcanzar la altura exacta de 8 m.

      **Datos:** Tuberías de acero estirado de 150 mm de diámetro; tubería de
      aspiración: longitud = 7 m; tiene intercalada una válvula de pie con
      filtro y un codo de 90º de radio medio; tubería de impulsión:
      longitud = 25 m; tiene intercalada una válvula de compuerta y dos codos de
      90º de radio medio.

      **Nota:** Para el cálculo de las pérdidas de carga en las piezas
      especiales utilícese el método de los factores de paso.

      **Nota nuestra:** el anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí. La bomba que sale del apartado
      b) es la **INP 125/315 a 1450 rpm con rodete de 280 mm**, y su punto de
      funcionamiento con esta instalación es **64 l/s con 18,5 m y un
      rendimiento del 74 %**. A 62,94 l/s su curva da 18,72 m. Con eso se pueden
      hacer los apartados c), d) y e) enteros.

