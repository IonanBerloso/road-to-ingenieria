        <text x="288" y="288" font-size="10" fill="var(--faint)">hierro galvanizado · D = 175 mm · Leq = 75 m</text>
        <path d="M412,196 L420,180 L428,196 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <text x="436" y="206" font-size="10" fill="var(--faint)">boquilla 80 mm</text>
        <text x="436" y="219" font-size="10" fill="var(--faint)">K = 0,8</text>
        <path d="M420,178 C418,152 416,130 420,110 C424,130 422,152 420,178 Z" fill="var(--live)" opacity="0.3" stroke="none"/>
        <path d="M420,110 C412,124 404,144 400,170 M420,110 C428,124 436,144 440,170" fill="none" stroke="var(--live)" stroke-width="1.4"/>
        <line x1="360" y1="220" x2="360" y2="190" stroke="var(--faint)" stroke-width="1" marker-start="url(#m92)" marker-end="url(#m92)"/>
        <line x1="184" y1="220" x2="364" y2="220" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="356" y1="190" x2="416" y2="190" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="354" y="210" text-anchor="end" font-size="10.5" fill="var(--faint)">3 m</text>
        <line x1="470" y1="190" x2="470" y2="110" stroke="var(--live)" stroke-width="1" marker-start="url(#m92)" marker-end="url(#m92)"/>
        <line x1="444" y1="110" x2="474" y2="110" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="424" y1="190" x2="474" y2="190" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="478" y="154" font-size="11" fill="var(--live)">h</text>
        <line x1="196" y1="278" x2="224" y2="278" stroke="var(--live)" stroke-width="2" marker-end="url(#m92f)"/>
      </svg>
      <figcaption>La altura del chorro es la altura de velocidad con la que sale de la boquilla, y regularla es regular el caudal. El eje vertical va a escala, diez píxeles por metro.</figcaption>
      </figure>
    pide: La curva de la instalación, el punto de funcionamiento con su potencia y coste, y la pérdida que hay que meter para bajar el chorro a cinco metros.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre la altura h que alcanza el chorro y lo que
          pasa en la boquilla?
        opciones:
          - texto: h es la altura de velocidad del chorro al salir, porque toda esa energía se convierte en altura
            correcta: true
            mensaje: |
              Eso es. El chorro sale hacia arriba y sube hasta que se le acaba
              la velocidad, así que $h = v_c^{2}/2g$. Es la misma idea del
              cuerpo lanzado hacia arriba, y por eso la altura de la fuente se
              regula con el caudal y nada más.
          - texto: h es la altura manométrica de la bomba menos los tres metros de la boquilla
            mensaje: |
              La bomba tiene que dar además la energía cinética y las pérdidas.
              De su altura solo llega al chorro lo que queda después de todo
              eso, y no es una resta directa.
          - texto: h depende del factor de paso 0,8 de la boquilla
            mensaje: |
              El 0,8 dice cuánta energía se **pierde** en la boquilla, no
              cuánta sale. Lo que sube el chorro es la velocidad que
              efectivamente tiene al salir.
          - texto: h es la presión justo antes de la boquilla, en metros de columna
            mensaje: |
              Esa presión es la que **produce** la velocidad, pero parte se va
              en la pérdida de la boquilla. El chorro sube lo que le queda de
              velocidad, no lo que había de presión.

      - tipo: calcular
        titulo: El caudal que da un chorro de ocho metros
        pregunta: |
          Caudal necesario para que el chorro alcance 8 m, en litros por
          segundo.
        respuesta:
          tipo: magnitud
          valor: '62.94 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '46.91 l/s'
            mensaje: |
              Has usado los 8 m junto con el factor de paso, como si el chorro
              subiera $1{,}8\,v^{2}/2g$. La pérdida de la boquilla no empuja el
              chorro: se queda por el camino.
          - valor: '49.76 l/s'
            mensaje: |
              Has restado los 3 m de la boquilla a los 8 del chorro. Los tres
              metros son la cota a la que está la salida, no algo que el chorro
              tenga que recorrer dos veces.
        pista: |
          Con 80 mm de diámetro, la altura de velocidad en función del caudal
          en l/s es $2{,}019\cdot 10^{-3}\,Q^{2}$.
        desarrollo: |
          La sección de la boquilla es
          $A = \pi\,0{,}08^{2}/4 = 5{,}027\cdot 10^{-3}$ m², de modo que con el
          caudal en litros por segundo

          $$
          v_c = 0{,}1989\,Q \qquad \frac{v_c^{2}}{2g} = 2{,}019\cdot 10^{-3}\,Q^{2}
          $$

          Y como el chorro sube exactamente su altura de velocidad,

          $$
          8 = 2{,}019\cdot 10^{-3}\,Q^{2} \;\Longrightarrow\; Q = 62{,}94\ \text{l/s}
          $$

      - tipo: calcular
        titulo: La altura que pide la instalación
        pregunta: |
          Altura manométrica que necesita la instalación con ese caudal, en
          metros.
        respuesta:
          tipo: magnitud
          valor: '20.23 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '11 m'
            mensaje: |
              Has sumado los 3 m de cota y los 8 del chorro. Falta la pérdida
              de la boquilla —otros 6,4 m, porque su factor de paso es 0,8— y
              los 2,8 m de la tubería.
          - valor: '17.4 m'
            mensaje: |
              Te has dejado la pérdida de la tubería. Son solo 2,8 m en 75 m
              equivalentes, pero cuentan.
        pista: |
          Bernoulli entre la lámina de A y la salida de la boquilla. Los
          términos de la boquilla —su pérdida y la energía cinética— van los
          dos con la misma velocidad.
        desarrollo: |
          Entre A y la salida C:

          $$
          H_{mi} = 3 + (1 + 0{,}8)\frac{v_c^{2}}{2g} + h_{f,\text{tubería}}
          $$

          El hierro galvanizado tiene $\varepsilon = 0{,}015$ cm, así que con
          175 mm sale $\varepsilon/D = 8{,}57\cdot 10^{-4}$ y **C = 130**, con
          $J_1 = 1{,}76\cdot 10^{-5}$. Sobre 75 m equivalentes:

          $$
          H_{mi} = 3 + 3{,}634\cdot 10^{-3}\,Q^{2} + 1{,}32\cdot 10^{-3}\,Q^{1{,}852}
          $$

          Esa es la curva característica de la instalación que pide el apartado
          a). Con Q = 62,94 l/s:

          $$
          H_{mi} = 3 + 14{,}40 + 2{,}82 = 20{,}23\ \text{m}
          $$

          Y ahí está lo característico de una fuente: **de los 20 m, catorce y
          medio se los lleva la boquilla** —ocho de chorro y seis y pico de
          pérdida— y solo 2,8 son fricción de tubería. Una instalación de
          bombeo normal es justo al revés.

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          Potencia absorbida por la bomba en el punto de funcionamiento, en kW.
          Ahí el caudal es de 66 l/s, la altura 21,8 m y el rendimiento 79 %.
        respuesta:
          tipo: magnitud
          valor: '17.85 kW'
          tolerancia: 0.02
          formato: una potencia con su unidad (kW o W)
        distractores:
          - valor: '14.1 kW'
            mensaje: |
              Esa es la potencia **útil**, la que llega al agua. La absorbida es
              mayor, porque la bomba no es perfecta: se divide por el
              rendimiento, no se multiplica.
          - valor: '11.14 kW'
            mensaje: |
              Has multiplicado por el rendimiento en vez de dividir. Absorbida
              es siempre la mayor de las dos.
        pista: |
          La potencia útil sale del peso de agua por la altura; la absorbida es
          esa dividida por el rendimiento.
        desarrollo: |
          El punto de funcionamiento es donde se cortan las dos curvas. La de
          la bomba vale 22 m hasta los 60 l/s y baja despacio a partir de ahí;
          la de la instalación crece deprisa. Se cruzan en

          $$
          Q = 66\ \text{l/s} \qquad H = 21{,}8\ \text{m} \qquad \eta = 79\ \%
          $$

          $$
          P_{abs} = \frac{\gamma\,Q\,H}{\eta} = \frac{9800\cdot 0{,}066\cdot 21{,}8}{0{,}79} = 17\,848\ \text{W}
          $$

          A 0,11 euros el kWh y 237,6 m³ por hora, eso son 0,0083 euros por
          metro cúbico bombeado.

      - tipo: calcular
        titulo: La válvula que baja el chorro a cinco metros
        pregunta: |
          Pérdida de carga que hay que introducir con la válvula, en mca.
        respuesta:
          tipo: magnitud
          valor: '8.17 mca'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (mca o m)
        distractores:
          - valor: '6.4 mca'
            mensaje: |
              Has restado las dos alturas de instalación, la de 8 m de chorro y
              la de 5. Pero al cerrar la válvula la bomba **no se queda donde
              estaba**: se mueve por su curva hasta 22 m.
          - valor: '13.83 mca'
            mensaje: |
              Eso es lo que pide la instalación con el caudal nuevo, no lo que
              tiene que disipar la válvula. La válvula se come la **diferencia**
              entre lo que da la bomba en ese caudal y esos 13,83.
        pista: |
          Primero el caudal que da 5 m de chorro; después, en ese caudal, lo
          que da la bomba y lo que pide la instalación. La válvula se come la
          diferencia.
        desarrollo: |
          $$
          5 = 2{,}019\cdot 10^{-3}\,Q^{2} \;\Longrightarrow\; Q = 49{,}76\ \text{l/s}
          $$

          En ese caudal, la curva de la bomba todavía va por 22 m —es plana
          hasta los 60 l/s— y la instalación pide

          $$
          H_{mi} = 3 + 3{,}634\cdot 10^{-3}\cdot 49{,}76^{2} + 1{,}32\cdot 10^{-3}\cdot 49{,}76^{1{,}852} = 13{,}83\ \text{m}
          $$

          La diferencia se la tiene que comer la válvula:

          $$
          h_{f,\text{válvula}} = 22 - 13{,}83 = 8{,}17\ \text{mca}
          $$

          La curva de la instalación se cierra en abanico: la válvula la
          empina, y el corte con la de la bomba se desplaza hacia caudales
          menores.

      - tipo: justificar
        pregunta: Ordena qué está pasando cuando se regula la fuente con la válvula. Una pieza es falsa.
        piezas:
          - texto: 'Para bajar el chorro de 8,8 a 5 m hay que bajar el caudal de 66 a 49,76 l/s.'
          - texto: 'La válvula lo consigue metiendo 8,17 mca de pérdida, que empinan la curva de la instalación hasta cortar la de la bomba en ese caudal.'
          - texto: 'La bomba sigue dando 22 m y consumiendo casi lo mismo, porque en esa zona su curva es plana.'
          - texto: 'Es decir, la energía que se gasta en la válvula no vuelve: se disipa en calor y se paga igual.'
          - texto: Al cerrar la válvula la bomba consume menos, porque tiene que mover menos caudal.
            trampa: true
            mensaje: |
              Baja algo, pero mucho menos de lo que parece. La potencia va con
              el producto del caudal por la altura, y aquí el caudal baja un
              25 % mientras la altura **sube** de 21,8 a 22. Y una parte
              creciente de esa potencia se está tirando en la válvula. Regular
              estrangulando es la forma cara de regular: la barata es cambiar
              la velocidad de giro.
    resolucion: |
      ## Una instalación donde casi todo es energía cinética

      Una fuente es un caso raro de instalación de bombeo, y el reparto de la
      altura lo dice todo. Con el chorro a 8 metros:

      | concepto | metros | del total |
      |---|---|---|
      | cota de la boquilla | 3 | 15 % |
      | energía cinética del chorro | 8 | 40 % |
      | pérdida de la boquilla | 6,4 | 32 % |
      | fricción en los 75 m de tubería | 2,8 | 14 % |
      | **total** | **20,23** | |

      **La fricción de la tubería es la partida más pequeña.** En una
      instalación de bombeo corriente sería la mayor con diferencia. Aquí el
      trabajo de la bomba es acelerar agua, no transportarla.

      ## a) La curva de la instalación

      La boquilla es de 80 mm, así que con el caudal en litros por segundo

      $$
      v_c = 0{,}1989\,Q \qquad \frac{v_c^{2}}{2g} = 2{,}019\cdot 10^{-3}\,Q^{2}
      $$

      Bernoulli entre la lámina de A y la salida del chorro, contando la
      energía cinética que se lleva y la pérdida de la boquilla:

      $$
      H_{mi} = 3 + 1{,}8\,\frac{v_c^{2}}{2g} + h_{f} = 3 + 3{,}634\cdot 10^{-3}\,Q^{2} + 1{,}32\cdot 10^{-3}\,Q^{1{,}852}
      $$

      con Hazen-Williams y C = 130 para el hierro galvanizado de 175 mm.

      Fíjate en los dos exponentes. El término de la boquilla va con
      $Q^{2}$ y el de la tubería con $Q^{1{,}852}$, casi lo mismo — pero el
      coeficiente del primero es **casi tres veces mayor**. Por eso la curva de
      esta instalación es tan empinada, y por eso la bomba, que tiene la suya
      casi plana, corta en un punto muy definido.

      ## b) y c) El punto de funcionamiento

      Para que el chorro llegue a 8 m hacen falta 62,94 l/s y 20,23 m. La bomba
      150-250bF con rodete de 256 mm da 22 m en esa zona, así que sobra un
      poco: el punto de funcionamiento real queda en

      $$
      Q = 66\ \text{l/s} \qquad H = 21{,}8\ \text{m} \qquad \eta = 79\ \% \qquad P_{abs} = 17{,}85\ \text{kW}
      $$

      y el chorro sube 8,8 m en vez de 8. Es lo normal al elegir de catálogo:
      se coge la que llega, y llega con margen.

      El coste sale de dividir la potencia por el caudal horario: 17,85 kW a
      0,11 euros el kWh son 1,96 euros a la hora, y en esa hora se mueven
      237,6 m³. Es decir **0,0083 euros por metro cúbico**, menos de un céntimo.
      Una fuente que funcione ocho horas al día cuesta unos dieciséis euros
      diarios de electricidad.

      ## d) Regular con una válvula, y lo que cuesta

      Para bajar el chorro a 5 m hace falta reducir el caudal a 49,76 l/s. En
      ese caudal la instalación solo pide 13,83 m y la bomba sigue dando 22, de
      modo que la válvula tiene que disipar

      $$
      h_{f,\text{válvula}} = 22 - 13{,}83 = 8{,}17\ \text{mca}
      $$

      Y ahí está la lección. Esos 8,17 metros son **más de un tercio de todo lo
      que la bomba entrega**, y se convierten en calor dentro de la válvula. La
      potencia absorbida apenas baja, porque el caudal cae un 25 % pero la
      altura sube de 21,8 a 22.

      Regular estrangulando es la forma cara de regular. La barata es cambiar
      la velocidad de giro de la bomba, que mueve la curva entera hacia abajo
      en vez de empinar la de la instalación. Pero un variador cuesta dinero el
      primer día, y una válvula cuesta dinero todos los días — que es
      exactamente el tipo de decisión que este problema está enseñando a
      plantear.

  - id: ejflu25-col93-el-sobrepresor-el-riego-y-el-deposito-regulador
    titulo: El sobrepresor, el riego y el depósito regulador
    fuente: Ejercicio 9.3 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene una instalación compuesta, formada por un depósito sobrepresor C
      que alimenta a dos servicios consistentes en un sistema de riego D,
      formado por 4 boquillas iguales en paralelo, y un depósito presurizado E,
      que sirve de regulador para alimentar otros servicios. Por otra parte, el
      depósito sobrepresor está alimentado por una instalación de bombeo, como
      se indica en la figura.

      **a)** Calcular la PC a que deberá estar sometido el depósito sobrepresor,
      para que el caudal que alimente el depósito E sea de 50 l/s.

      **b)** Indicar (en las condiciones anteriores) el caudal circulante por la
      tubería (2) que alimenta a las boquillas y la velocidad de salida por cada
      boquilla.

      **c)** Circunstancialmente se quiere incrementar el caudal que llega al
      depósito E a 65 l/s. Indicar las formas de conseguirlo.

      **d)** Suponiendo que la presión del depósito sobrepresor C es de
      3,5 kg/cm², seleccionar la bomba necesaria para suministrar un caudal de
      125 l/s, desde el depósito A a dicho sobrepresor C. Determinar el punto de
      funcionamiento (Q, H, η), la potencia absorbida y el costo del m³ de agua
      bombeado, si el kWh cuesta 0,1 euro.

      **e)** Con la bomba seleccionada instalada, indicar de qué formas se puede
      conseguir el caudal exacto deseado de 125 l/s.

      **Datos:** Cotas: A = 600 m; C = 620 m; D = 630 m; E = 625 m. Tuberías de
      acero comercial; D1 = 300 mm; D0 = D2 = D3 = 200 mm; L1 = 300 m;
      L2 = L3 = 500 m; L0 = 100 m. PE = 2 kg/cm². Boquillas (4): D = 50 mm;
      factor de paso de pérdidas de carga de la boquilla K = 0,3 con la energía
      cinética a la salida. Despreciar la pérdida de carga en el colector que
      reparte el flujo a las boquillas. Longitudes equivalentes de piezas
      especiales: válvula de pie = 10 m; codo de 90º = 5 m; válvula
      antirretorno = 15 m; válvula de compuerta abierta = 2 m.

      **Nota nuestra:** el anexo de curvas de bombas no se puede reproducir
      aquí. La bomba que sale del apartado d) es la **200/500 a 1450 rpm con
      rodete de 450 mm**, y estos son los puntos de su curva característica tal
      como los da la resolución del boletín:

      | Q (l/s) | 100 | 111,1 | 125 | 138,9 | 150 | 166,7 | 200 |
      |---|---|---|---|---|---|---|---|
      | H (m) | 72 | 71 | 70 | 68 | 66 | 63,5 | 56 |

      Su punto de funcionamiento con esta instalación es **144 l/s, 67,5 m y un
      rendimiento del 80,4 %**.

