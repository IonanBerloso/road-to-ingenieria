      </figure>
    pide: La curva de la instalación, la altura en el punto de funcionamiento y cómo cambia la curva al desdoblar el tramo estrecho.
    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito E está presurizado a 98 kPa y su lámina en la cota 200,
          frente a la 130 de A. ¿Cuál es la ordenada en el origen de la curva
          de la instalación?
        opciones:
          - texto: 80 m; los 70 de desnivel más los 10 que equivalen a los 98 kPa
            correcta: true
            mensaje: |
              Eso es. La bomba tiene que subir el agua setenta metros **y
              además** meterla contra la presión del depósito, que en columna
              de agua son exactamente 10 m.
          - texto: 70 m; la presión de E no cuenta porque el agua entra por debajo
            mensaje: |
              Cuenta siempre. El aire comprimido del depósito empuja hacia
              abajo sobre la lámina y esa presión se transmite al punto de
              entrada, sea cual sea.
          - texto: 60 m; la presión de E ayuda a que el agua entre
            mensaje: |
              Ayudaría si estuviera en el depósito de partida. En el de llegada
              se opone: hay que vencerla.
          - texto: 200 m; la cota del depósito de llegada
            mensaje: |
              Las cotas absolutas no importan, solo su diferencia. Lo que la
              bomba tiene que salvar son los 70 m que van de una lámina a la
              otra.

      - tipo: calcular
        titulo: El coeficiente de pérdidas
        pregunta: |
          Coeficiente que multiplica a $Q^{1{,}852}$ en la curva de la
          instalación, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.0066847'
          tolerancia: 0.00008
          formato: un número, sin unidad
        distractores:
          - valor: '0.0040805'
            mensaje: |
              Te has dejado el tramo CD. Son solo 70 m de los 515 totales, pero
              al ser de 150 mm pesan casi tanto como los otros 445 juntos.
          - valor: '0.0058286'
            mensaje: |
              Has usado C = 140. Con acero comercial —rugosidad 0,006 cm— y
              200 mm, la relación $\varepsilon/D$ vale $3\cdot 10^{-4}$, que en
              el cuadro nº 25 ya cae en la banda de C = 130.
        pista: |
          Los tramos 1 y 3 son de 200 mm y se pueden sumar; el 2 va aparte
          porque su diámetro es otro.
        desarrollo: |
          Con acero comercial, $\varepsilon = 0{,}006$ cm, y **C = 130** en los
          dos diámetros:

          $$
          J_1(200) = 9{,}17\cdot 10^{-6} \qquad J_1(150) = 3{,}72\cdot 10^{-5}
          $$

          $$
          k = 9{,}17\cdot 10^{-6}\cdot (175 + 270) + 3{,}72\cdot 10^{-5}\cdot 70 = 6{,}685\cdot 10^{-3}
          $$

          y la curva completa es
          $H_{mi} = 80 + 6{,}685\cdot 10^{-3}\,Q^{1{,}852}$.

          El reparto es lo que hay que ver: los 445 m de 200 mm ponen
          $4{,}08\cdot 10^{-3}$ y los **70 m de 150 mm ponen
          $2{,}61\cdot 10^{-3}$**. Un tramo que es el 14 % de la longitud
          aporta el 39 % de la pérdida, y de ahí sale todo el apartado d).

      - tipo: calcular
        titulo: La altura en el punto de funcionamiento
        pregunta: |
          Altura manométrica que necesita la instalación con los 71 l/s del
          punto de funcionamiento, en metros.
        respuesta:
          tipo: magnitud
          valor: '97.8 m'
          tolerancia: 0.02
          formato: una altura con su unidad (m o mca)
        distractores:
          - valor: '87.9 m'
            mensaje: |
              Te has dejado los 10 m de la presión de E. La pérdida está bien
              —17,9 m— pero la ordenada en el origen son 80, no 70.
          - valor: '80 m'
            mensaje: |
              Esa es la altura con caudal cero. Con 71 l/s circulando hay
              además casi dieciocho metros de pérdida.
        pista: |
          Se evalúa la curva de la instalación en 71 l/s.
        desarrollo: |
          $$
          H_{mi}(71) = 80 + 6{,}685\cdot 10^{-3}\cdot 71^{1{,}852} = 80 + 17{,}9 = 97{,}9\ \text{m}
          $$

          que son los 97,8 m que el catálogo asigna a la bomba en ese caudal.
          **Esa coincidencia es la comprobación de la selección**: la curva de
          la instalación se calcula sin abrir el anexo, y si el corte no cayera
          donde el catálogo dice, la bomba o el rodete estarían mal elegidos.

      - tipo: calcular
        titulo: La curva con el tramo desdoblado
        pregunta: |
          Nuevo coeficiente de $Q^{1{,}852}$ al poner en paralelo con la
          tubería 2 otra de 150 mm y 50 m.
        respuesta:
          tipo: numero
          valor: '0.00469'
          tolerancia: 0.00008
          formato: un número, sin unidad
        distractores:
          - valor: '0.0085473'
            mensaje: |
              Has sumado los 50 m nuevos a los 70 viejos como si fueran en
              serie. En paralelo el caudal se reparte y la pérdida **baja**, no
              sube.
          - valor: '0.0059417'
            mensaje: |
              Has sustituido la tubería vieja por la nueva en vez de ponerlas
              en paralelo. Las dos siguen ahí y las dos llevan caudal.
        pista: |
          En paralelo las dos tuberías tienen la misma pérdida de carga, y de
          ahí sale cómo se reparte el caudal entre ellas.
        desarrollo: |
          Las dos ramas del tramo CD tienen el mismo diámetro y el mismo
          material, así que la igualdad de pérdidas es

          $$
          70\,Q_a^{1{,}852} = 50\,Q_b^{1{,}852} \;\Longrightarrow\; \frac{Q_a}{Q_b} = \left(\frac{50}{70}\right)^{1/1{,}852} = 0{,}834
          $$

          Es decir, por la vieja va el 45,5 % del caudal y por la nueva el
          54,5 %. La pérdida del tramo pasa a ser

          $$
          3{,}72\cdot 10^{-5}\cdot 70\cdot 0{,}455^{1{,}852} = 6{,}05\cdot 10^{-4}
          $$

          contra los $2{,}61\cdot 10^{-3}$ de antes: **se divide por más de
          cuatro**. Sumando los 445 m de 200 mm, que no cambian,

          $$
          H_{mi} = 80 + 4{,}69\cdot 10^{-3}\,Q^{1{,}852}
          $$

      - tipo: justificar
        pregunta: Ordena qué se gana desdoblando el tramo CD. Una pieza es falsa.
        piezas:
          - texto: 'El tramo CD es el 14 % de la longitud y aporta el 39 % de la pérdida, porque su diámetro es 150 y el resto 200.'
          - texto: 'Poniendo 50 m de 150 mm en paralelo, el caudal se reparte y la pérdida del tramo se divide por más de cuatro.'
          - texto: 'La curva de la instalación baja del 6,69 al 4,69 por mil, y con los 71 l/s de antes pediría 92,6 m en vez de 97,9.'
          - texto: 'Como la instalación pide menos, el corte con la curva de la bomba se desplaza a la derecha y circula más caudal.'
          - texto: Duplicando el tramo con una tubería igual se dividiría la pérdida por dos, porque cada una llevaría la mitad del caudal.
            trampa: true
            mensaje: |
              Por dos no: por **más de tres**. Cada rama llevaría la mitad del
              caudal, y la pérdida va con $Q^{1{,}852}$, así que se
              multiplicaría por $0{,}5^{1{,}852} = 0{,}277$. Ese exponente es
              justamente lo que hace que desdoblar tuberías rinda tanto.
    resolucion: |
      ## Setenta metros que valen por cuatrocientos

      La instalación tiene 515 m de tubería, y 445 de ellos son de 200 mm. Los
      otros 70, entre C y D, son de 150. Ese detalle decide el problema entero.

      $$
      k = \underbrace{9{,}17\cdot 10^{-6}\cdot 445}_{4{,}08\cdot 10^{-3}} + \underbrace{3{,}72\cdot 10^{-5}\cdot 70}_{2{,}61\cdot 10^{-3}} = 6{,}685\cdot 10^{-3}
      $$

      **El 14 % de la longitud aporta el 39 % de la pérdida.** En
      Hazen-Williams el diámetro entra elevado a 4,87, así que pasar de 200 a
      150 mm multiplica la pérdida por metro por cuatro.

      ## a), b) y c) La curva y el punto

      $$
      H_{mi} = 80 + 6{,}685\cdot 10^{-3}\,Q^{1{,}852}
      $$

      —80 m de ordenada en el origen: 70 de desnivel y 10 de la presión de E—.
      Con la bomba de catálogo el corte cae en 71 l/s, y ahí la instalación
      pide

      $$
      H_{mi}(71) = 80 + 17{,}9 = 97{,}9\ \text{m}
      $$

      contra los 97,8 m que el catálogo asigna a la bomba en ese caudal. Es la
      comprobación de que la selección está bien leída.

      ## d) Desdoblar en vez de sustituir

      La solución que propone el enunciado no es cambiar la tubería estrecha
      por una gruesa, sino **poner otra al lado**. Las dos ramas tienen la
      misma pérdida de carga —es la condición del paralelo— y de ahí sale el
      reparto:

      $$
      70\,Q_a^{1{,}852} = 50\,Q_b^{1{,}852} \;\Longrightarrow\; Q_a = 0{,}455\,Q
      $$

      Por la vieja, más larga, va menos caudal. Y como cada rama lleva menos de
      la mitad de lo que llevaba una sola, la pérdida del tramo se desploma:

      $$
      2{,}61\cdot 10^{-3} \;\longrightarrow\; 6{,}05\cdot 10^{-4}
      $$

      un factor de 4,3. La curva de la instalación queda

      $$
      H_{mi} = 80 + 4{,}69\cdot 10^{-3}\,Q^{1{,}852}
      $$

      Con los mismos 71 l/s, la instalación pediría ahora 92,6 m en vez de
      97,9: **más de cinco metros menos**. Como la bomba sigue siendo la
      misma, el punto de funcionamiento se desplaza a la derecha —más caudal,
      algo menos de altura— y ese caudal de más es lo que se compra con los
      50 m de tubería.

      ## Por qué desdoblar rinde tanto

      La clave está en el exponente. Si en vez de 50 m se pusieran otros 70
      —una tubería idéntica—, cada rama llevaría la mitad del caudal y la
      pérdida se multiplicaría por $0{,}5^{1{,}852} = 0{,}277$: **se dividiría
      por más de tres, no por dos**. Es el mismo motivo por el que una red
      mallada pierde mucho menos que una ramificada con el mismo metraje.

  - id: ejflu25-col918-el-deposito-que-ayuda-y-el-chorro-que-hay-que-subir
    titulo: El depósito que ayuda, y el chorro que hay que subir
    fuente: Ejercicio 9.18 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      La instalación de la figura está formada por un depósito, cuya cota de la
      lámina superior está representada por la variable z, y una bomba que
      alimentan a un chorro situado en la cota 5 m, siendo el diámetro de la
      boquilla de 40 mm. Teniendo en cuenta que la longitud de la tubería es de
      90 m, la tubería es de acero comercial, de diámetro 100 mm y las pérdidas
      menores se pueden considerar un 10 % de las pérdidas de la tubería, se
      pide:

      **a)** Altura manométrica de la instalación en función únicamente de 2
      variables, Q = caudal circulante y z = cota de la lámina superior,
      Hi = f(Q, z).

      **b)** Si z = 22 m y la bomba está estropeada, no aportando por tanto
      energía, calcular h, es decir la altura que alcanza el chorro.

      **c)** Con z = 22 m, seleccionar la bomba más adecuada para que h = 30 m.

      **d)** Calcular el punto de funcionamiento de la instalación con la bomba
      elegida.

      **Nota nuestra:** el anexo de curvas de bombas es un catálogo de
      fabricante y no se puede reproducir aquí. La bomba que sale del apartado
      c) es la **INP 65/160 a 2900 rpm con rodete de 177 mm**, y el punto de
      funcionamiento que da el boletín es **31,6 l/s con 30,4 mca**.

