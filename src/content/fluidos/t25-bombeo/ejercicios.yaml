        salen 1250 metros de impulsion, con una valvula antirretorno, una
        esferica de regulacion, una T de derivacion, tres codos y una valvula
        de compuerta, hasta el deposito superior, cuya lamina esta en la cota
        974. El eje vertical esta a escala.</desc>
        <defs>
          <marker id="m911" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--faint)"/></marker>
          <marker id="m911f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--live)"/></marker>
        </defs>
        <path d="M40,320 H180 V372 H40 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M40,306 V372 H180 V306" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="40" y1="320" x2="180" y2="320" stroke="var(--live)" stroke-width="1.6"/>
        <text x="58" y="350" font-size="10.5" fill="var(--ink)">cota 900</text>
