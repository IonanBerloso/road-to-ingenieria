        <circle cx="250" cy="336" r="13" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.2"/>
        <text x="250" y="368" text-anchor="middle" font-size="10.5" fill="var(--ink)">bomba</text>
        <path d="M262,330 L420,124" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M420,124 H436" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <path d="M436,80 H560 V136 H436 Z" fill="var(--live)" opacity="0.16" stroke="none"/>
        <path d="M436,66 V136 H560 V66" fill="none" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="436" y1="80" x2="560" y2="80" stroke="var(--live)" stroke-width="1.6"/>
        <text x="498" y="112" text-anchor="middle" font-size="10.5" fill="var(--ink)">cota 974</text>
        <text x="120" y="304" font-size="10" fill="var(--faint)">aspiración 30 m</text>
        <text x="298" y="248" text-anchor="end" font-size="10" fill="var(--faint)">impulsión 1250 m</text>
        <text x="298" y="262" text-anchor="end" font-size="10" fill="var(--faint)">fibrocemento · D = 200 mm · s = 1,1</text>
        <line x1="580" y1="80" x2="580" y2="320" stroke="var(--faint)" stroke-width="1" marker-start="url(#m911)" marker-end="url(#m911)"/>
        <line x1="564" y1="80" x2="584" y2="80" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="184" y1="320" x2="584" y2="320" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="574" y="204" text-anchor="end" font-size="11" fill="var(--faint)">74 m</text>
        <line x1="146" y1="330" x2="180" y2="330" stroke="var(--live)" stroke-width="2" marker-end="url(#m911f)"/>
      </svg>
      <figcaption>Setenta y cuatro metros de desnivel y mil doscientos ochenta de tubería. Las piezas especiales añaden otros ochenta y uno en longitud equivalente, y elegir cuáles se cuentan es la mitad del apartado a).</figcaption>
      </figure>
    pide: La curva de la instalación, la pérdida en el punto de funcionamiento y a qué altura sobre el agua puede ir el eje de la bomba.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla de longitudes equivalentes trae ocho piezas, pero en esta
          instalación no aparecen todas. ¿Cuáles se cuentan?
        opciones:
          - texto: Las seis que nombra el enunciado, más la entrada al depósito superior; la salida de depósito no, porque la válvula de pie ya la incluye
            correcta: true
            mensaje: |
              Eso es. La válvula de pie va sumergida en el depósito inferior y
              hace de entrada a la tubería, así que contar además una «salida de
              depósito» sería contarla dos veces. La entrada al superior, en
              cambio, sí ocurre y son 10 m.
          - texto: Las ocho de la tabla, porque están todas tabuladas
            mensaje: |
              La tabla es un catálogo de piezas posibles, no la lista de esta
              instalación. Aquí no hay ninguna válvula de mariposa, por ejemplo.
          - texto: Solo las seis que nombra el enunciado
            mensaje: |
              Falta la entrada al depósito superior. El enunciado no la nombra
              porque no es una pieza que se compre, pero la pérdida existe: el
              agua llega con velocidad y la pierde entera al entrar.
          - texto: Todas menos la válvula esférica, que está abierta
            mensaje: |
              El enunciado dice que es «para la regulación del caudal», y la
              tabla le da 1 m. Aunque sea poco, se cuenta como todas las demás.

      - tipo: calcular
        titulo: El coeficiente de pérdidas
        pregunta: |
          Coeficiente que multiplica a $Q^{1{,}852}$ en la curva de la
          instalación, con el caudal en l/s.
        respuesta:
          tipo: numero
          valor: '0.01248'
          tolerancia: 0.0002
          formato: un número, sin unidad
        distractores:
          - valor: '0.0117372'
            mensaje: |
              Solo has contado los 1280 m de tubería. Las piezas especiales
              suman 81 m equivalentes, un 6 % más de longitud.
          - valor: '0.0108795'
            mensaje: |
              Has usado C = 140. Con fibrocemento —rugosidad 0,01 cm— y 200 mm,
              la relación $\varepsilon/D$ vale $5\cdot 10^{-4}$, que en el
              cuadro nº 25 cae en la banda de C = 130.
        pista: |
          La longitud de cálculo es la real más la equivalente de todas las
          piezas que hay de verdad en la instalación.
        desarrollo: |
          En la aspiración: 30 m de tubería, 25 de la válvula de pie y 5 del
          codo, **60 m**. En la impulsión: 1250 de tubería, 15 del
          antirretorno, 1 de la esférica, 5 de la T, 15 de los tres codos, 5 de
          la compuerta y 10 de la entrada al depósito, **1301 m**. En total
          1361 m.

          Con fibrocemento de 200 mm, $\varepsilon/D = 5\cdot 10^{-4}$ y por
          tanto **C = 130**, con $J_1 = 9{,}17\cdot 10^{-6}$:

          $$
          k = 9{,}17\cdot 10^{-6}\cdot 1361 = 1{,}248\cdot 10^{-2}
          $$

          y la curva de la instalación,
          $H_{mi} = 74 + 1{,}248\cdot 10^{-2}\,Q^{1{,}852}$, en metros de
          columna del líquido.

      - tipo: calcular
        titulo: La pérdida en el punto de funcionamiento
        pregunta: |
          Pérdida de carga total de la instalación con los 29 l/s del punto de
          funcionamiento, en metros de columna de líquido.
        respuesta:
          tipo: magnitud
          valor: '6.38 m'
          tolerancia: 0.02
          formato: una pérdida de carga con su unidad (m o mcl)
        distractores:
          - valor: '6.0 m'
            mensaje: |
              Te has dejado los 81 m equivalentes de las piezas especiales.
          - valor: '5.57 m'
            mensaje: |
              Has usado C = 140. Con 200 mm de fibrocemento la banda del cuadro
              nº 25 es la de C = 130.
        pista: |
          Se evalúa el término de fricción de la curva en 29 l/s.
        desarrollo: |
          $$
          h_f = 1{,}248\cdot 10^{-2}\cdot 29^{1{,}852} = 6{,}38\ \text{mcl}
          $$

          y por tanto $H_{mi}(29) = 74 + 6{,}38 = 80{,}38$ m, que son los 80,3
          que el catálogo asigna a la bomba en ese caudal. **Esa coincidencia
          es la comprobación de la selección.**

          Y merece la pena verlo en proporción: **más de mil trescientos metros
          de tubería pierden solo seis metros y pico**, un 8 % de lo que da la
          bomba. Con 200 mm y 29 l/s la velocidad es de 0,92 m/s, y a esa
          velocidad una tubería casi no cuesta.

      - tipo: calcular
        titulo: La altura del eje sobre la lámina
        pregunta: |
          Altura a la que puede colocarse el eje de la bomba por encima de la
          lámina del depósito inferior, en metros.
        respuesta:
          tipo: magnitud
          valor: '2.21 m'
          tolerancia: 0.02
          formato: una longitud con su unidad (m o mcl)
        distractores:
          - valor: '2.49 m'
            mensaje: |
              Te has dejado la pérdida de la tubería de aspiración. Son solo
              28 cm, pero salen de los mismos metros de margen.
          - valor: '3.21 m'
            mensaje: |
              Te has dejado el metro de carga de seguridad que pide el
              enunciado. El NPSH requerido es el límite en que la bomba
              **empieza** a cavitar; nadie proyecta ahí.
        pista: |
          El NPSH disponible es la atmosférica menos la altura del eje, la
          pérdida de aspiración y la tensión de vapor, todo en columna de este
          líquido. Y tiene que superar al requerido en un metro.
        desarrollo: |
          El peso específico del líquido es
          $\gamma = 1{,}1\cdot 9800 = 10\,780$ N/m³, así que la atmósfera —10 m
          de columna de agua— vale

          $$
          \frac{p_{atm}}{\gamma} = \frac{98\,000}{10\,780} = 9{,}09\ \text{mcl}
          $$

          La pérdida de los 60 m equivalentes de aspiración con 29 l/s es

          $$
          h_{f,asp} = 9{,}17\cdot 10^{-6}\cdot 60\cdot 29^{1{,}852} = 0{,}28\ \text{mcl}
          $$

          y con los 5 mca de NPSH requerido y el metro de seguridad,

          $$
          z = 9{,}09 - 0{,}28 - 0{,}6 - 5 - 1 = 2{,}21\ \text{m}
          $$

          es decir, el eje en la **cota 902,2**. Dos metros escasos de margen
          para una bomba que da ochenta: casi todo lo que empuja la atmósfera
          se lo lleva el NPSH que la bomba exige.

      - tipo: justificar
        pregunta: Ordena el cálculo de la potencia, y qué le pasa al resultado publicado. Una pieza es falsa.
        piezas:
          - texto: 'La potencia útil es el peso del líquido que se eleva por segundo, por la altura: 10 780 por 0,029 por 80,3.'
          - texto: 'Son 25,1 kW útiles, y con el 72 % de rendimiento, 34,9 kW absorbidos.'
          - texto: 'El boletín publica 31,7 kW, que es exactamente lo que sale usando el peso específico del agua en vez del del líquido.'
          - texto: 'La propia colección lo hace bien en el 9.1, donde escribe el 1,2 del líquido dentro de la fórmula de la potencia.'
          - texto: Los 31,7 kW son correctos porque la altura manométrica ya viene en metros de columna de agua.
            trampa: true
            mensaje: |
              No viene en columna de agua: la curva de la instalación se ha
              escrito con el desnivel en metros y las pérdidas de
              Hazen-Williams, y eso son **metros de columna del líquido**. Para
              pasar altura a energía hay que multiplicar por el peso específico
              de ese mismo líquido, que pesa un 10 % más que el agua.
    resolucion: |
      ## Mil trescientos metros que casi no pesan

      Lo primero que sorprende de este problema es lo poco que cuesta la
      tubería. Hay 1280 m de conducción y 81 más en longitud equivalente de
      piezas, y con 29 l/s todo eso pierde **6,38 metros**: un 8 % de lo que
      entrega la bomba. Los otros 74 son desnivel puro.

      La razón es la velocidad. Con 200 mm y 29 l/s el agua va a 0,92 m/s, y a
      esa velocidad Hazen-Williams cobra muy poco. Es lo contrario de las
      fuentes de este mismo capítulo, donde la fricción se llevaba un tercio.

      ## a) Qué piezas se cuentan

      El apartado tiene más miga de la que parece, porque la tabla trae ocho
      piezas y la instalación solo usa siete —y una de ellas, la entrada al
      depósito superior, no la nombra el enunciado—.

      | tramo | concepto | m |
      |---|---|---|
      | aspiración | tubería | 30 |
      | | válvula de pie | 25 |
      | | codo de 90º | 5 |
      | impulsión | tubería | 1250 |
      | | válvula antirretorno | 15 |
      | | válvula esférica | 1 |
      | | T de derivación | 5 |
      | | 3 codos de 90º | 15 |
      | | válvula de compuerta | 5 |
      | | entrada a depósito | 10 |
      | **total** | | **1361** |

      La que **no** se cuenta es la «salida de depósito» de 5 m: la válvula de
      pie va sumergida y ya hace de embocadura. Contarla sería contar dos veces
      la misma pérdida, y se nota — el coeficiente saldría 1,2526·10⁻² en vez
      de 1,2480·10⁻², que es el publicado.

      $$
      H_{mi} = 74 + 1{,}248\cdot 10^{-2}\,Q^{1{,}852}
      $$

      > **Un desajuste que conviene decir.** El boletín publica el término
      > independiente como **73,925** y la diferencia de cotas es
      > $974 - 900 = 74$ exactos. Esos siete centímetros y medio no salen de
      > ningún dato del enunciado, y como no cambian ninguna respuesta —la
      > altura en el punto de funcionamiento sale 80,38 con 74 y 80,30 con
      > 73,925, y el catálogo da 80,3— aquí se usa el 74.

      ## d) y e) El punto, y dónde va la bomba

      Con la INP 65/250 de rodete 266 mm el corte cae en 29 l/s y 80,3 m. La
      comprobación es que la curva de la instalación, calculada sin abrir el
      catálogo, vale 80,38 ahí.

      Para el eje de la bomba, todo en columna de este líquido:

      $$
      z = \frac{98\,000}{10\,780} - h_{f,asp} - \frac{p_v}{\gamma} - NPSH_r - 1 = 9{,}09 - 0{,}28 - 0{,}6 - 5 - 1 = 2{,}21\ \text{m}
      $$

      El eje va en la **cota 902,2**. Y el reparto es la lección: de los 9,09 m
      que empuja la atmósfera, **cinco se los lleva el NPSH que exige la
      bomba** y uno el margen de seguridad. Quedan dos escasos para levantarla
      del agua. Una bomba con mejor entrada —NPSH requerido de 3 en vez de
      5— daría cuatro metros de margen, y eso vale más que cualquier cosa que
      se haga con la tubería de aspiración, que aquí solo pesa 28 centímetros.

      ## Y la potencia, donde el boletín se despista

      $$
      P = \frac{\gamma\,Q\,H}{\eta} = \frac{10\,780\cdot 0{,}029\cdot 80{,}3}{0{,}72} = 34{,}9\ \text{kW}
      $$

      El boletín publica **31,7 kW**, que es exactamente lo que sale usando
      9800 en vez de 10 780: se ha quedado el peso específico del agua. La
      propia colección lo hace bien en el 9.1, donde escribe el 1,2 del líquido
      dentro de la fórmula. Aquí, con s = 1,1, la diferencia son 3,2 kW —un
      10 %— y en la elección de un motor eso se nota.

  # ── COLECCIÓN 9.12. El otro del capítulo que trae la curva de la bomba como
  #    tabla, y el único que trae también la tabla K–apertura de la válvula:
  #    permite cerrar el ciclo entero, del punto de funcionamiento a la
  #    posición del volante. Y el agua está a 75 °C, con lo que la cavitación
  #    deja de ser un trámite.
  - id: ejflu25-col912-la-caldera-y-el-agua-a-setenta-y-cinco
    titulo: La caldera, el agua a 75 grados y la válvula que hay que cerrar
    fuente: >-
      Ejercicio 9.12 · Colección de Problemas, capítulo 9 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Una bomba B alimenta una caldera C tomando agua a $75\ °\text{C}$ de un
      depósito de nivel constante A. La tubería de aspiración tiene
      $100\ \text{m}$ de longitud y $100\ \text{mm}$ de diámetro. La tubería
      de impulsión tiene $150\ \text{m}$ de longitud y el mismo diámetro
      anterior. Esta última está dotada de una válvula de regulación V que
      permite variar el caudal de la instalación.

      La lámina de A está $1\ \text{m}$ por encima del eje de la bomba, y la
      entrada a la caldera, $7\ \text{m}$ por encima de la lámina de A. Los
      dos recipientes están abiertos a la atmósfera.

      Se desea obtener un caudal de $8\ \text{l/s}$. Considerando un
      coeficiente de fricción de $0{,}02$ para todas las tuberías, y que las
      únicas pérdidas puntuales significativas son las que se producen en la
      válvula V, siendo el proceso isotérmico, calcular:

      a) Expresión analítica de la cc de la instalación.

      b) Punto de funcionamiento de la bomba ($H_m$, $Q$ y potencia
      absorbida).

      c) Presión a la entrada de la bomba. ¿Existiría peligro de cavitación?

      d) Pérdidas de carga que habría que introducir mediante la válvula para
      conseguir el caudal de 8 l/s.

      Curva característica de la bomba:

      | $Q$ (l/s) | 0 | 2 | 4 | 6 | 8 | 10 | 12 | 14 |
      |---|---|---|---|---|---|---|---|---|
      | $H_m$ (m) | 14 | 15 | 14 | 13 | 12 | 9 | 5 | 0 |
      | $\eta$ (%) | 0 | 42 | 58 | 65 | 70 | 62 | 38 | 0 |

      Propiedades del agua a $75\ °\text{C}$: $\rho = 974\ \text{kg/m}^{3}$;
      presión de vapor $P_V = 0{,}368\ \text{kg/cm}^{2}$ (abs).
      $P_{at} = 1\ \text{atm}$.
    pide: La curva de la instalación, el punto de funcionamiento con su potencia, la presión de aspiración y la pérdida que debe meter la válvula.

    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba, dejada a su aire, va a dar más de los 8 l/s que se
          quieren. ¿Por qué se regula **estrangulando** y no bajándole
          revoluciones?
        opciones:
          - texto: >-
              Porque una válvula es lo que hay: añade pérdida y desplaza el
              punto de funcionamiento hacia la izquierda, aunque toda esa
              pérdida sea energía tirada
            correcta: true
            mensaje: |
              Eso es, y conviene tenerlo claro: **estrangular funciona y es
              caro**. La bomba sigue consumiendo casi lo mismo y la diferencia
              se disipa en la válvula. Es el motivo de que hoy se prefiera un
              variador de frecuencia cuando el caudal varía mucho.
          - texto: >-
              Porque cerrar la válvula reduce la potencia que la bomba
              consume, y así se ahorra
            mensaje: |
              Al estrangular, el punto de funcionamiento sube por la curva de
              la bomba: menos caudal pero **más altura**. El producto
              $\gamma Q H$ baja poco, y el rendimiento suele empeorar. Se
              ahorra mucho menos de lo que parece.
          - texto: >-
              Porque una bomba centrífuga no admite trabajar a caudal
              distinto del nominal
            mensaje: |
              Sí lo admite: recorre toda su curva. Lo que no conviene es
              alejarse mucho de su punto de máximo rendimiento, y por eso el
              ejercicio pide comprobar el rendimiento en el punto de trabajo.

      - tipo: calcular
        titulo: La altura que pide la instalación a 8 l/s
        pregunta: |
          Sin contar la válvula, ¿qué altura necesita la instalación para
          mover $8\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '9.65 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '7 m'
            mensaje: |
              Esa es solo la altura geométrica, de la lámina de A a la entrada
              de la caldera. Faltan los 250 m de tubería, que a 8 l/s piden
              2,65 m más.
          - valor: '2.65 m'
            mensaje: |
              Esas son solo las pérdidas por rozamiento. La bomba tiene además
              que subir el agua 7 m: la curva de la instalación no arranca en
              cero.
        pista: |
          $H = \Delta z + f\,\dfrac{L}{D}\,\dfrac{v^{2}}{2g}$, con
          $L = 100 + 150 = 250$ m y $f = 0{,}02$.
        desarrollo: |
          $$
          v = \frac{0{,}008}{\pi\,0{,}1^{2}/4} = 1{,}019\ \text{m/s}
          \qquad
          h_f = 0{,}02\,\frac{250}{0{,}1}\,\frac{1{,}019^{2}}{19{,}6}
          = 2{,}65\ \text{m}
          $$
          $$
          H = 7 + 2{,}65 = 9{,}65\ \text{m}
          $$

          Y en general, con $Q$ en l/s:
          $H = 7 + 0{,}0414\,Q^{2}$, que es la respuesta al apartado a).

      - tipo: calcular
        titulo: El caudal que la bomba da por su cuenta
        pregunta: |
          Sin tocar la válvula, ¿qué caudal circula?
        respuesta:
          tipo: magnitud
          valor: '9.1 l/s'
          tolerancia: 0.02
          formato: un caudal, con su unidad
        distractores:
          - valor: '8 l/s'
            mensaje: |
              Ese es el caudal que se **quiere**, no el que sale. La bomba
              elegida da de más, y por eso el apartado d) pide estrangular:
              si coincidieran, la válvula sobraría.
          - valor: '11.75 l/s'
            mensaje: |
              Parece que has cruzado la curva de la bomba con las pérdidas
              solas, sin los 7 m de altura geométrica. Subir la curva de la
              instalación 7 metros desplaza el corte bastante a la izquierda.
        pista: |
          Tabula $H = 7 + 0{,}0414\,Q^{2}$ frente a la curva de la bomba y
          busca dónde se cruzan.
        desarrollo: |
          | $Q$ (l/s) | bomba | instalación |
          |---|---|---|
          | 8 | 12,0 | 9,65 |
          | 10 | 9,0 | 11,14 |
          | 9,1 | 10,35 | 10,43 |

          $$
          Q = 9{,}1\ \text{l/s}
          \qquad
          H_m = 10{,}4\ \text{m}
          \qquad
          \eta = 65{,}6\ \%
          $$

      - tipo: calcular
        titulo: La potencia absorbida
        pregunta: |
          ¿Qué potencia absorbe la bomba en ese punto?
        respuesta:
          tipo: magnitud
          valor: '1414 w'
          tolerancia: 0.04
          formato: una potencia, con su unidad
        distractores:
          - valor: '928 w'
            mensaje: |
              Esa es la potencia **útil**, $\gamma Q H$. La absorbida es
              mayor: hay que dividir entre el rendimiento del 65,6 % que se
              lee en la tabla interpolando entre 8 y 10 l/s.
          - valor: '2156 w'
            mensaje: |
              Has dividido dos veces entre el rendimiento. Solo se divide una:
              $P = \gamma Q H/\eta$.
        pista: |
          $P = \gamma Q H/\eta$, interpolando el rendimiento en la tabla.
        desarrollo: |
          $$
          \eta = 70 - \frac{1{,}1}{2}(70-62) = 65{,}6\ \%
          $$
          $$
          P = \frac{9800\cdot 0{,}0091\cdot 10{,}4}{0{,}656} = 1414\ \text{W}
          $$

      - tipo: calcular
        titulo: La presión a la entrada de la bomba
        pregunta: |
          ¿Qué presión absoluta hay en la brida de aspiración, en metros de
          columna?
        respuesta:
          tipo: magnitud
          valor: '9.89 mca'
          tolerancia: 0.04
          formato: una presión, en metros de columna, con su unidad
        distractores:
          - valor: '11.33 mca'
            mensaje: |
              Te has dejado las pérdidas de la aspiración. Cien de los 250 m
              de tubería están antes de la bomba, y a 9,1 l/s se comen
              1,37 m.
          - valor: '7.89 mca'
            mensaje: |
              Has restado el metro de desnivel en vez de sumarlo. La lámina de
              A está **por encima** del eje de la bomba: la bomba trabaja en
              carga, y eso juega a favor.
        pista: |
          Bernoulli de la lámina de A a la brida, en absolutas:
          $P_{at}/\gamma + \Delta z - h_{f,\text{asp}} - v^{2}/2g$.
        desarrollo: |
          $$
          h_{f,\text{asp}} = 0{,}0414\cdot\frac{100}{250}\cdot 9{,}1^{2}
          = 1{,}37\ \text{m}
          \qquad
          \frac{v^{2}}{2g} = 0{,}07\ \text{m}
          $$
          $$
          \frac{p_e}{\gamma} = 10{,}33 + 1 - 1{,}37 - 0{,}07
          = 9{,}89\ \text{mca (abs)}
          $$

      - tipo: calcular
        titulo: La pérdida que debe meter la válvula
        pregunta: |
          ¿Cuánta pérdida tiene que producir la válvula para dejar el caudal
          en $8\ \text{l/s}$?
        respuesta:
          tipo: magnitud
          valor: '2.35 m'
          tolerancia: 0.02
          formato: una altura, con su unidad
        distractores:
          - valor: '0.75 m'
            mensaje: |
              Has restado a la altura del punto de funcionamiento, 10,4 m. Al
              cerrar la válvula el punto se mueve: a 8 l/s la bomba ya no da
              10,4 sino **12** m, que es lo que hay que leer en su curva.
          - valor: '5 m'
            mensaje: |
              Te has dejado las pérdidas de la tubería a 8 l/s. La válvula
              solo tiene que disipar lo que sobra **después** de descontarlas:
              $12 - 7 - 2{,}65$.
        pista: |
          A 8 l/s, ¿cuánto da la bomba y cuánto pide la instalación? La
          diferencia se la come la válvula.
        desarrollo: |
          $$
          \Delta H_V = H_{\text{bomba}}(8) - H_{\text{inst}}(8)
          = 12 - 9{,}65 = 2{,}35\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: >-
              La curva de la instalación es $H = 7 + 0{,}0414\,Q^{2}$ y corta
              a la de la bomba en 9,1 l/s y 10,4 m, con 1414 W absorbidos.
          - texto: >-
              La presión de aspiración es de 9,89 mca absolutos, y la de
              vapor del agua a 75 °C, $0{,}368\ \text{kg/cm}^{2}$, son
              3,68 mca: hay margen y no cavita.
          - texto: >-
              Para bajar a 8 l/s la válvula tiene que disipar 2,35 m, que a
              ese caudal corresponde a un factor de paso de unos 44.
          - texto: >-
              Y como la válvula solo disipa 2,35 de los 12 m que da la bomba,
              el desperdicio energético del estrangulamiento es pequeño.
            trampa: true
            mensaje: |
              Mira el balance completo. Estrangulando se pasa de 9,1 a 8 l/s
              —un 12 % menos de caudal— y la potencia absorbida apenas baja,
              porque la bomba sube a 12 m de altura. **Se paga casi lo mismo
              por mover un 12 % menos**, y encima 2,35 de cada 12 metros se
              tiran en calor dentro de la válvula. Que el número parezca
              pequeño no lo hace despreciable: es un 20 % de la altura útil,
              todo el día, todos los días.

    resolucion: |
      **a) La curva de la instalación.** Los dos recipientes están abiertos,
      así que solo cuentan el desnivel y el rozamiento:

      $$
      H = 7 + 0{,}02\,\frac{250}{0{,}1}\,\frac{v^{2}}{2g}
      = 7 + 0{,}0414\,Q^{2}
      \qquad (Q\ \text{en l/s})
      $$

      El 7 es de lámina de A a entrada de la caldera; el metro que A está por
      encima de la bomba **no aparece aquí** —la altura de la instalación va
      de superficie a superficie— pero sí aparecerá en el apartado c).

      **b) El punto de funcionamiento.** Cortando con la tabla de la bomba:
      $Q = 9{,}1$ l/s, $H_m = 10{,}4$ m, $\eta = 65{,}6\ \%$ y

      $$
      P = \frac{\gamma Q H}{\eta} = 1414\ \text{W}
      $$

      **c) La aspiración, que es donde este ejercicio se pone interesante.**

      $$
      \frac{p_e}{\gamma} = 10{,}33 + 1 - 1{,}37 - 0{,}07 = 9{,}89\ \text{mca
      absolutos}
      $$

      La presión de vapor del agua **a 75 °C** vale $0{,}368\ \text{kg/cm}^{2}$
      absolutos, es decir **3,68 mca**. Queda margen y no cavita. Pero
      compara: a 20 °C la presión de vapor son 0,24 mca, y aquí son quince
      veces más. **Casi todo el margen de cavitación de una bomba se lo come
      la temperatura**, y por eso las bombas de alimentación de caldera se
      ponen siempre en carga —el metro de desnivel de este enunciado no está
      ahí por casualidad— y nunca aspirando.

      **d) La válvula.** A 8 l/s la bomba da 12 m y la instalación pide 9,65:
      la válvula tiene que disipar **2,35 m**.

      **e) El factor de paso, y una incoherencia del boletín.** Con
      $v = 1{,}019$ m/s a 8 l/s, $v^{2}/2g = 0{,}0529$ m y

      $$
      K = \frac{2{,}35}{0{,}0529} = 44{,}4
      $$

      que en la tabla de la válvula cae entre $K = 45$ (30 % de apertura) y
      $K = 36$ (40 %): **una apertura de un 31 %**. La solución oficial
      publica $K = 35$ y un 41,49 % de apertura, y ese 35 sale de dividir los
      2,35 m entre la altura cinética del **punto de funcionamiento**
      —9,1 l/s— en vez de la del caudal nuevo. Las dos cifras del boletín son
      coherentes entre sí, pero la velocidad que usan no es la que hay cuando
      la válvula ya está cerrada.

      **Una nota sobre el peso específico.** El enunciado da
      $\rho = 974\ \text{kg/m}^{3}$, de donde $\gamma = 9545\ \text{N/m}^{3}$.
      El boletín usa 9800 en todo el problema —por eso salen exactamente
      1414 W y 9,89 mca—. Con el peso específico real saldrían 1377 W y
      10,18 mcl: un 2,7 % de diferencia, que es lo que abre la tolerancia de
      estos dos pasos.

  - id: ejflu25-col913-el-petroleo-crudo-y-el-unico-darcy-del-capitulo
    titulo: El petróleo crudo, y el único Darcy del capítulo
    fuente: Ejercicio 9.13 · Colección de problemas, capítulo 9 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      Se tiene la instalación de la figura con el fin de elevar un caudal mínimo
      de 25 l/s de petróleo crudo a 14 ºC. Se pide:

      **a)** Representación gráfica de la curva característica de la
      instalación.

      **b)** Selección de la bomba más conveniente entre aquellas cuyas curvas
      características se adjuntan, válidas para petróleo.

      **c)** Punto de funcionamiento de la bomba seleccionada en la instalación
      descrita.

      **d)** Cota del eje de la bomba.

      **e)** Presión a que habría que someter el depósito superior para obtener
      el caudal de 25 l/s.

      **Datos:** Cotas: ZB = 900 m; ZF = 960 m. Presiones: PB = 50 kPa;
      PF (absoluta) = 220 kPa. Tuberías: longitudes: aspiración = 150 m,
      impulsión = 600 m; diámetro = 200 mm; material: acero comercial; presión
      de vapor del petróleo = 3 mcl (abs); NPSH de seguridad en el punto de
      funcionamiento = 1 mcl; peso específico relativo del petróleo s = 0,86.

      **Notas nuestras.** El anexo de curvas de bombas no se puede reproducir
      aquí: la bomba del apartado b) es la **INP 65/250 con rodete de 256 mm**,
      y su punto de funcionamiento es **27,4 l/s con 73,4 mcl**. La viscosidad
      cinemática del petróleo crudo a 14 ºC, leída del ábaco nº 5, es
      $\nu = 1{,}04\cdot 10^{-5}$ m²/s. Y la presión atmosférica, que el
      enunciado no da, es **91,45 kPa**; el último paso explica de dónde sale.

