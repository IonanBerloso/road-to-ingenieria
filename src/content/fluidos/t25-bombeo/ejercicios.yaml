        <line x1="520" y1="304" x2="628" y2="304" stroke="var(--live)" stroke-width="1.6"/>
        <text x="574" y="340" text-anchor="middle" font-size="11.5" fill="var(--ink)">E</text>
        <text x="574" y="284" text-anchor="middle" font-size="10" fill="var(--faint)">cota 625 · 2 kg/cm²</text>
