    pide: El caudal sin bomba y con ella, el tiempo de llenado y lo que cuesta la electricidad.
    pasos:
      - tipo: reconocer
        pregunta: |
          La curva de la instalación sale con el término independiente
          **negativo**, −25. ¿Qué significa eso?
        opciones:
          - texto: Que la red ya aporta 25 mca, así que a caudales pequeños no hace falta bomba ninguna
            correcta: true
            mensaje: |
              Eso es. La ordenada en el origen de la instalación es lo que hay
              que aportar con caudal cero, y aquí es negativo porque el agua ya
              llega con presión. La bomba solo entra a partir del caudal en que
              esos 25 mca dejan de bastar.
          - texto: Que la instalación está mal planteada, porque una altura no puede ser negativa
            mensaje: |
              La altura **manométrica de la instalación** sí puede serlo. Lo
              que dice es que sobra energía, y una bomba con altura negativa es
              simplemente una bomba que no hace falta.
          - texto: Que hay que restar 25 mca a la altura de la bomba al final
            mensaje: |
              Ya está restado: los 25 están dentro de la curva de la
              instalación. Restarlos otra vez los contaría dos veces.
          - texto: Que la piscina está 25 m por debajo de la acometida
            mensaje: |
              El enunciado dice que **todo está en la cota 0**. Los 25 mca son
              presión de la red, no desnivel.

      - tipo: calcular
        titulo: El caudal sin bomba
        pregunta: |
          Caudal que desagua por D sin bomba, en litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '1.491 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '2.904 l/s'
            mensaje: |
              Solo has contado las piezas. Los 50 m de tubería de 25 mm pesan
              más que las cuatro piezas juntas, y sin ellos el caudal sale al
              doble.
          - valor: '1.778 l/s'
            mensaje: |
              Solo has contado la fricción de la tubería. Las tres válvulas y
              la descarga suman K = 14, que no es despreciable.
        pista: |
          Toda la instalación está en la cota 0 y la descarga es libre, así que
          los 25 mca se reparten entre la fricción de los 50 m y las cuatro
          piezas.
        desarrollo: |
          La sección es $A = 4{,}909\cdot 10^{-4}$ m², y con el caudal en
          litros por segundo $v = 2{,}037\,Q$, de modo que
          $v^{2}/2g = 0{,}2117\,Q^{2}$.

          $$
          25 = \left(\sum K + f\,\frac{L}{D}\right)\frac{v^{2}}{2g} \qquad \sum K = 3\cdot 4 + 2 = 14
          $$

          El PVC es prácticamente liso, así que con Reynolds del orden de
          $7\cdot 10^{4}$ sale $f = 0{,}0193$ y $fL/D = 38{,}6$. Iterando,

          $$
          v = 3{,}05\ \text{m/s} \qquad Q = 1{,}49\ \text{l/s}
          $$

          Fíjate en el reparto: la tubería pone 38,6 y las piezas 14. **Los 50
          metros de tubo pesan casi tres veces lo que las cuatro piezas**, y eso
          que son tres válvulas enteras. Con 25 mm de diámetro, la tubería
          siempre gana.

      - tipo: calcular
        titulo: El caudal con la bomba
        pregunta: |
          Caudal en el punto de funcionamiento con la bomba trabajando, en
          litros por segundo.
        respuesta:
          tipo: magnitud
          valor: '1.7 l/s'
          tolerancia: 0.02
          formato: un caudal con su unidad (l/s o m³/s)
        distractores:
          - valor: '1.491 l/s'
            mensaje: |
              Ese es el caudal sin bomba. La bomba sí aporta algo —13,6 mca en
              el punto de funcionamiento—, aunque el caudal solo suba un 13 %.
          - valor: '3.408 l/s'
            mensaje: |
              Has despreciado la fricción de la tubería y te has quedado con
              las piezas. Con la bomba dentro, ese error casi duplica el
              caudal.
        pista: |
          Se igualan la curva de la bomba y la de la instalación. Cuidado con
          las unidades del caudal: la de la bomba viene en m³/s y la de la
          instalación en l/s.
        desarrollo: |
          Por Hazen-Williams, PVC de 25 mm da
          $\varepsilon/D = 6\cdot 10^{-4}$ y por tanto C = 130, con
          $J_1 = 0{,}2293$. Sobre los 50 m:

          $$
          H_{mi} = -25 + 2{,}9644\,Q^{2} + 11{,}465\,Q^{1{,}852}
          $$

          con Q en l/s. Igualando con la curva de la bomba, que en esas mismas
          unidades es $H_b = 15 - 0{,}48\,Q^{2}$:

          $$
          40 = 3{,}4444\,Q^{2} + 11{,}465\,Q^{1{,}852} \;\Longrightarrow\; Q = 1{,}69\ \text{l/s}
          $$

          y la altura, $H = 15 - 0{,}48\cdot 1{,}69^{2} = 13{,}63$ mca.

      - tipo: calcular
        titulo: El tiempo de llenado
        pregunta: |
          Tiempo que tarda en llenarse la piscina con la bomba funcionando, en
          horas.
        respuesta:
          tipo: magnitud
          valor: '7.9 h'
          tolerancia: 0.02
          formato: un tiempo con su unidad (h, min o s)
        distractores:
          - valor: '8.94 h'
            mensaje: |
              Has usado el caudal sin bomba. Una hora más de llenado es
              justamente lo que compra la bomba.
          - valor: '3.91 h'
            mensaje: |
              Has usado el caudal sin la fricción de la tubería. Ese caudal no
              existe: los 50 m de tubo están ahí.
        pista: |
          Cuarenta y ocho metros cúbicos al caudal del punto de
          funcionamiento.
        desarrollo: |
          $$
          t = \frac{48}{1{,}687\cdot 10^{-3}} = 28\,453\ \text{s}
          $$

          es decir 7 h 54 min 13 s. El boletín publica 7 h 54 min 16 s: la
          diferencia son tres segundos de redondeo en el caudal.

      - tipo: calcular
        titulo: El coste del llenado
        pregunta: |
          Coste de la electricidad para llenar la piscina en 8 horas, en euros.
        respuesta:
          tipo: numero
          valor: '0.832'
          tolerancia: 0.02
          formato: un número, en euros
        distractores:
          - valor: '0.571'
            mensaje: |
              Esa es la potencia útil, sin dividir por ningún rendimiento. Entre
              la bomba y el motor se pierde un tercio de lo que se paga.
          - valor: '0.635'
            mensaje: |
              Has aplicado solo el rendimiento de la bomba. El motor eléctrico
              tiene el suyo, 0,75, y los dos se multiplican.
        pista: |
          La potencia absorbida de la red es la útil dividida por el producto
          de los dos rendimientos.
        desarrollo: |
          Con 48 m³ en 8 horas el caudal es 1,667 l/s y la bomba da
          $H = 15 - 0{,}48\cdot 1{,}667^{2} = 13{,}67$ mca.

          $$
          P = \frac{\gamma\,Q\,H}{\eta_b\,\eta_{me}} = \frac{9800\cdot 1{,}667\cdot 10^{-3}\cdot 13{,}67}{0{,}9\cdot 0{,}75} = 331\ \text{W}
          $$

          En 8 horas son 2,65 kWh, y a 0,32 euros el kWh, **0,85 euros**. El
          boletín publica 0,832; la diferencia, un 2 %, sale de con qué caudal
          se evalúa la altura de la bomba.

          Ochenta y cinco céntimos por 48 000 litros. La electricidad de
          bombear no es lo caro de una piscina.

      - tipo: justificar
        pregunta: Ordena qué aporta realmente la bomba en esta instalación. Una pieza es falsa.
        piezas:
          - texto: 'Sin bomba, los 25 mca de la red ya mueven 1,491 l/s por los cincuenta metros de tubo.'
          - texto: 'Con la bomba, que aporta 13,6 mca más, el caudal sube a 1,69 l/s.'
          - texto: 'Es decir, más que duplicar la energía disponible sube el caudal un 13 %, y el llenado pasa de 8,9 a 7,9 horas.'
          - texto: 'La razón es que la pérdida crece casi con el cuadrado del caudal, así que hace falta mucha más altura para muy poco más de caudal.'
          - texto: Con una bomba del doble de altura el caudal se duplicaría, porque la pérdida es proporcional al caudal.
            trampa: true
            mensaje: |
              La pérdida no es proporcional al caudal: va con $Q^{2}$ en las
              piezas y con $Q^{1{,}852}$ en la tubería. Duplicar la carga
              disponible multiplica el caudal por poco más de la raíz de dos, y
              en esta instalación ni eso, porque la bomba pierde altura al
              subir el caudal. El camino corto para más caudal no es más bomba:
              es más diámetro.
    resolucion: |
      ## Una instalación donde la bomba casi sobra

      El resultado más interesante de este problema es la comparación entre sus
      dos apartados.

      | | carga disponible | caudal | tiempo de llenado |
      |---|---|---|---|
      | solo la red | 25 mca | 1,491 l/s | 8 h 56 min |
      | red y bomba | 38,6 mca | 1,687 l/s | 7 h 54 min |

      **Se ha aumentado la energía disponible en un 55 % para ganar un 13 % de
      caudal**, y una hora de llenado. Ese es el precio de meter 48 m³ por una
      tubería de 25 mm.

      ## a) Sin bomba

      Todo está en la cota cero y la descarga es libre, así que los 25 mca de
      la red se gastan enteros en pérdidas:

      $$
      25 = \left(14 + f\,\frac{50}{0{,}025}\right)\frac{v^{2}}{2g}
      $$

      El PVC es liso, y con Reynolds de $7{,}6\cdot 10^{4}$ sale $f = 0{,}0193$,
      de modo que $fL/D = 38{,}6$ contra los 14 de las cuatro piezas. Iterando,
      $Q = 1{,}49$ l/s.

      ## b1) y b2) La curva de la instalación, con su término negativo

      $$
      H_{mi} = -25 + 2{,}9644\,Q^{2} + 11{,}465\,Q^{1{,}852}
      $$

      El −25 es la firma de este problema: la instalación **pide altura
      negativa** hasta 1,49 l/s, que es tanto como decir que hasta ese caudal
      sobra energía y la bomba estorbaría. A partir de ahí la curva cruza el
      cero y sube deprisa.

      Igualando con la de la bomba —cuidado con las unidades, la suya viene en
      m³/s y hay que pasarla a l/s— sale

      $$
      Q = 1{,}69\ \text{l/s} \qquad H = 13{,}63\ \text{mca}
      $$

      ## b3) y b4) Lo que cuesta

      $$
      t = \frac{48}{1{,}687\cdot 10^{-3}} = 28\,453\ \text{s}
      $$

      siete horas y cincuenta y cuatro minutos. Y la electricidad, con los dos
      rendimientos encadenados:

      $$
      P = \frac{9800\cdot 1{,}667\cdot 10^{-3}\cdot 13{,}67}{0{,}675} = 331\ \text{W}
      $$

      Menos de un euro. Conviene ver el otro lado del rendimiento: de esos
      331 W, solo 223 llegan al agua; **un tercio se va en la bomba y el
      motor**, y eso se paga igual. Es lo que hace que en instalaciones que
      funcionan miles de horas al año el rendimiento importe más que el precio
      del equipo.

      ## Lo que este problema enseña de verdad

      Que el diámetro manda. Los 50 m de tubo de 25 mm valen 38,6 en factor de
      paso equivalente; con 32 mm bajan a 28, y con los mismos 25 mca de la red
      —**sin bomba ninguna**— el caudal pasaría de 1,49 a 2,75 l/s. Con 40 mm
      serían 4,7 l/s, tres veces el actual, y la piscina se llenaría en menos
      de tres horas.

      Subir un escalón de diámetro rinde más que instalar la bomba, y un
      segundo escalón rinde más que las dos cosas juntas. Antes de comprar una
      bomba conviene mirar la tubería.
