        densidad relativa 0,8, tres metros de altura. En la superficie de
        separación hay un agujero circular taponado por una esfera de dos metros
        de diámetro, que queda partida por ese plano: media esfera dentro del
        agua y media dentro del aceite. A la izquierda, un manómetro en U mide
        la presión del aceite: marca 0,2 kilopondios por centímetro cuadrado,
        lleva cuarenta centímetros de un líquido de densidad relativa cuatro y
        se conecta al depósito quince centímetros por debajo de ese plano, ya
        dentro del aceite. La
        figura está dibujada a escala.</desc>

