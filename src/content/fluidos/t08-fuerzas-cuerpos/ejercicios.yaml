ejercicios:
  # ── El primero es NUESTRO (§08). El 2.5 de la colección combina empuje con
  #    compresión isoterma del aire, y no se puede entrar en él sin haber
  #    calculado antes un calado sencillo.
  - id: ejflu8-el-calado-de-un-bloque-que-flota
    titulo: Cuánto se hunde un bloque que flota
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la
      colección de problemas.
    nivel: ejemplo
    enunciado: |
      Un bloque de madera de densidad relativa $s = 0{,}6$ y dimensiones
      $0{,}5 \times 0{,}5 \times 0{,}4\ \text{m}$ flota en agua con su cara
      de $0{,}5\times0{,}5$ horizontal.

      a) ¿Cuánto pesa?

      b) ¿Qué volumen queda sumergido?

      c) ¿Cuál es el calado, es decir, la altura sumergida?

      Tomar $\gamma_{\text{agua}} = 9800\ \text{N/m}^{3}$.
    pide: El peso, el volumen sumergido y el calado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El bloque flota en equilibrio. ¿Qué relación hay entre empuje y peso?
        opciones:
          - texto: >-
              Son iguales: $E = W$, y como $E = \gamma\,V_{\text{sumergido}}$,
              el volumen sumergido se ajusta hasta que eso se cumple
            correcta: true
            mensaje: |
              Eso es. Un cuerpo que flota **desaloja su propio peso** en
              líquido. De ahí sale directamente el volumen sumergido, sin
              necesidad de saber la forma.
          - texto: >-
              El empuje es el peso del volumen **total** del bloque
            mensaje: |
              Eso valdría si estuviera completamente sumergido. Al flotar,
              solo desaloja el volumen de la parte que está bajo el agua.
          - texto: >-
              El empuje es mayor que el peso, y por eso flota
            mensaje: |
              Si el empuje fuera mayor, el bloque **subiría**: no estaría en
              equilibrio. Flotar en reposo significa exactamente que los dos
              se igualan.

      - tipo: calcular
        titulo: El peso
        pregunta: |
          ¿Cuánto pesa el bloque?
        respuesta:
          tipo: magnitud
          valor: '588 N'
          tolerancia: 0.01
          formato: un peso, con su unidad
        distractores:
          - valor: '980 N'
            mensaje: |
              Ese es el peso si fuera de agua ($s = 1$). La madera tiene
              $s = 0{,}6$: $\gamma_{\text{madera}} = 0{,}6\cdot9800 = 5880\ \text{N/m}^{3}$.
          - valor: '60 N'
            mensaje: |
              Has multiplicado por la densidad relativa y olvidado el peso
              específico del agua. $W = s\,\gamma\,V = 0{,}6\cdot9800\cdot0{,}1$.
        pista: |
          W = s·γ_agua·V, con V = 0,5·0,5·0,4.
        desarrollo: |
          $$
          V = 0{,}5\cdot0{,}5\cdot0{,}4 = 0{,}1\ \text{m}^{3}
          \qquad
          W = 0{,}6\cdot9800\cdot0{,}1 = 588\ \text{N}
          $$

      - tipo: calcular
        titulo: El calado
        pregunta: |
          ¿Qué altura del bloque queda bajo el agua?
        respuesta:
          tipo: magnitud
          valor: '0.24 m'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.4 m'
            mensaje: |
              Esa es la altura total: se hundiría entera solo si $s = 1$. Con
              $s = 0{,}6$ se hunde el 60 %: $0{,}6\cdot0{,}4 = 0{,}24\ \text{m}$.
          - valor: '0.16 m'
            mensaje: |
              Ese es el francobordo, la parte que **sobresale**
              ($0{,}4-0{,}24$). El calado es la parte sumergida.
        pista: |
          V sumergido = W/γ = 0,06 m³, y el calado es ese volumen entre el área de la base.
        desarrollo: |
          $$
          V_{\text{sum}} = \frac{W}{\gamma} = \frac{588}{9800} = 0{,}06\ \text{m}^{3}
          \qquad
          c = \frac{V_{\text{sum}}}{0{,}5\cdot0{,}5} = 0{,}24\ \text{m}
          $$

          **Y el atajo que conviene reconocer:** con la base constante, la
          fracción sumergida es exactamente la densidad relativa. Un cuerpo de
          $s = 0{,}6$ se hunde el 60 % de su altura, siempre que flote con
          caras paralelas.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              $V = 0{,}1\ \text{m}^{3}$ y $W = s\gamma V = 588\ \text{N}$.
          - texto: >-
              Flota en equilibrio: $E = W$, y $E = \gamma V_{\text{sum}}$.
          - texto: >-
              $V_{\text{sum}} = 588/9800 = 0{,}06\ \text{m}^{3}$, el 60 % del
              total.
          - texto: >-
              Calado $= V_{\text{sum}}/A_{\text{base}} = 0{,}24\ \text{m}$, y
              sobresalen $0{,}16\ \text{m}$.
          - texto: >-
              Con caras paralelas, la fracción sumergida coincide con la
              densidad relativa.
          - texto: >-
              Si el bloque flotara en un líquido más denso, se hundiría más,
              porque el líquido pesa más sobre él.
            trampa: true
            mensaje: |
              Al revés: en un líquido **más denso** hace falta desalojar
              **menos** volumen para conseguir el mismo empuje, así que el
              cuerpo se hunde **menos**. Por eso se flota mejor en agua salada
              que en dulce.

    resolucion: |
      $$
      W = s\,\gamma\,V = 0{,}6\cdot9800\cdot0{,}1 = \boxed{588\ \text{N}}
      $$
      $$
      E = W \Rightarrow V_{\text{sum}} = \frac{588}{9800} = \boxed{0{,}06\ \text{m}^{3}}
      \qquad
      c = \frac{0{,}06}{0{,}25} = \boxed{0{,}24\ \text{m}}
      $$

      > **La frase que resuelve casi todos los problemas de flotación.** Un
      > cuerpo que flota desaloja su propio peso. No hay que calcular
      > presiones ni integrar nada: se iguala $W$ con $\gamma V_{\text{sum}}$
      > y se despeja lo que pidan.

  - id: ejflu8-col25-las-campanas-de-buceo
    titulo: Dos campanas de buceo, con el aire que se comprime dentro
    fuente: >-
      Ejercicio 2.5 · Colección de problemas de Mecánica de Fluidos, Estática
      de los fluidos y fuerzas sobre superficies · Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      Se hacen descender por separado 2 campanas cilíndricas de buceo en agua
      ($s = 1$), de altura $H = 3\ \text{m}$ y sección transversal de
      $0{,}9\ \text{m}^{2}$, en los 2 casos, originalmente llenas de aire
      ($P_0 = 1\ \text{bar}$, $T_0 = 20\ °\text{C}$), ambas cerradas en su
      parte superior y abiertas en la inferior, pero de pesos diferentes
      ($W_1 = 8820\ \text{N}$; $W_2 = 6615\ \text{N}$). Una vez sumergidas en
      el agua, cuando se alcanza el equilibrio, calcular:

      a) Calcular para cada campana, altura $h_1$ y $h_2$ del aire dentro de
      la campana en el equilibrio.

      b) $P_1$ y $P_2$ presiones absolutas en el interior de cada campana
      (bar).

      c) Profundidad $H_1$ y $H_2$ del agua dentro de cada campana por debajo
      de la superficie exterior.

      Dato: la temperatura del aire permanece constante.
    pide: Las alturas de aire, las presiones absolutas y las profundidades del nivel interior.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué determina la altura de aire que queda dentro de cada campana?
        opciones:
          - texto: >-
              El equilibrio de flotación: el empuje lo produce el aire
              atrapado, así que $W = \gamma\,h\,A$ y de ahí sale $h$
            correcta: true
            mensaje: |
              Eso es, y es lo que hace elegante el problema: la campana pesa
              lo que pesa, y el aire se comprime justo hasta que el volumen
              que desaloja equilibra ese peso. **El peso fija el volumen**, y
              después la ley de Boyle fija la presión.
          - texto: >-
              La ley de Boyle, porque el aire se comprime
            mensaje: |
              Boyle da la **presión** una vez conocido el volumen, pero no
              determina el volumen por sí sola: hace falta el equilibrio de
              fuerzas. El orden es primero flotación, después Boyle.
          - texto: >-
              La profundidad a la que se sumerja la campana
            mensaje: |
              La profundidad es una consecuencia, no un dato: es el apartado
              c). La campana se queda a la profundidad en que la presión
              exterior coincide con la del aire de dentro.

      - tipo: calcular
        titulo: La altura de aire en la campana pesada
        pregunta: |
          Para $W_1 = 8820\ \text{N}$, ¿qué altura de aire queda?
        respuesta:
          tipo: magnitud
          valor: '1 m'
          tolerancia: 0.01
          formato: una altura, con su unidad
        distractores:
          - valor: '3 m'
            mensaje: |
              Esa es la altura total de la campana, la que tenía el aire en la
              superficie. Al sumergirse se comprime hasta
              $h_1 = W_1/(\gamma A) = 1\ \text{m}$.
          - valor: '0.9 m'
            mensaje: |
              $0{,}9$ es la **sección** en m². La altura sale de
              $8820/(9800\cdot0{,}9) = 1\ \text{m}$.
        pista: |
          Equilibrio: W = γ·V desalojado = γ·h·A. Despeja h.
        desarrollo: |
          $$
          W_1 = \gamma\,h_1\,A
          \quad\Rightarrow\quad
          h_1 = \frac{8820}{9800\cdot0{,}9} = 1\ \text{m}
          $$

          Y con $W_2 = 6615\ \text{N}$: $h_2 = 0{,}75\ \text{m}$. La campana
          más ligera necesita desalojar menos agua, así que su aire se
          comprime más.

      - tipo: calcular
        titulo: La presión dentro de la campana ligera
        pregunta: |
          Con $h_2 = 0{,}75\ \text{m}$ y compresión isoterma, ¿cuál es $P_2$?
        respuesta:
          tipo: magnitud
          valor: '4 bar'
          tolerancia: 0.01
          formato: una presión absoluta, con su unidad
        distractores:
          - valor: '0.25 bar'
            mensaje: |
              Has invertido la razón. Al **comprimirse** el aire, la presión
              **sube**: $P_2 = P_0 H/h_2 = 1\cdot3/0{,}75 = 4\ \text{bar}$.
          - valor: '3 bar'
            mensaje: |
              $3\ \text{bar}$ es la presión de la campana **pesada**
              ($h_1 = 1\ \text{m}$). La ligera comprime más el aire:
              $3/0{,}75 = 4$.
        pista: |
          Boyle a T constante: P₀·H·A = P₂·h₂·A, y el área se cancela.
        desarrollo: |
          $$
          P_0\,H\,A = P_2\,h_2\,A
          \quad\Rightarrow\quad
          P_2 = \frac{P_0 H}{h_2} = \frac{1\cdot3}{0{,}75} = 4\ \text{bar}
          $$

          Fíjate en que **la sección se cancela**: solo importa la razón de
          alturas. Y la presión es **absoluta**, como siempre que se usa una
          ecuación de estado.

      - tipo: calcular
        titulo: La profundidad del nivel interior
        pregunta: |
          El nivel de agua dentro de la campana pesada está donde la presión
          hidrostática iguala a la del aire ($3\ \text{bar}$ absolutos). ¿A
          qué profundidad?
        respuesta:
          tipo: magnitud
          valor: '20.41 m'
          tolerancia: 0.02
          formato: una profundidad, con su unidad
        distractores:
          - valor: '30.61 m'
            mensaje: |
              A ese número se llega por **dos** caminos equivocados, y da la
              casualidad de que los dos dan lo mismo: usar los
              $3\ \text{bar}$ **absolutos** sin restar la atmósfera
              ($3\cdot10^{5}/9800$), o resolver la campana **ligera**, cuyo
              aire está a $4\ \text{bar}$ ($(4-1)\cdot10^{5}/9800$). Para la
              pesada: $(3-1)\cdot10^{5}/9800 = 20{,}41\ \text{m}$.
          - valor: '10.2 m'
            mensaje: |
              Eso es $1\ \text{bar}$ en metros de agua. La columna la sostiene
              la diferencia entre la presión del aire y la atmosférica, que
              aquí son $2\ \text{bar}$, no uno.
        pista: |
          La hidrostática cuenta desde la superficie: p_man = p_abs − p_atm, y h = p_man/γ.
        desarrollo: |
          $$
          H_1 = \frac{(P_1-P_{\text{atm}})}{\gamma}
          = \frac{(3-1)\cdot10^{5}}{9800} = 20{,}41\ \text{m}
          $$

          Y para la ligera: $(4-1)\cdot10^{5}/9800 = 30{,}61\ \text{m}$.

      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Flotación: $W = \gamma h A$ da $h_1 = 1\ \text{m}$ y
              $h_2 = 0{,}75\ \text{m}$.
          - texto: >-
              b) Boyle isotermo: $P = P_0H/h$ da $P_1 = 3\ \text{bar}$ y
              $P_2 = 4\ \text{bar}$ absolutos.
          - texto: >-
              c) El nivel interior está donde la hidrostática iguala esa
              presión: $H_1 = 20{,}41\ \text{m}$ y $H_2 = 30{,}61\ \text{m}$.
          - texto: >-
              La campana **más ligera** baja más: necesita menos empuje, así
              que comprime más el aire y se equilibra a más profundidad.
          - texto: >-
              Si se conectan las dos por un tubo, el aire se iguala a
              $3{,}43\ \text{bar}$ y los dos niveles quedan a
              $24{,}78\ \text{m}$, sin que cambien $h_1$ ni $h_2$ —que los fija
              el peso de cada campana—.
          - texto: >-
              Como el aire se comprime, la campana pesa más al bajar y por eso
              se hunde.
            trampa: true
            mensaje: |
              Comprimir el aire **no cambia su masa**, así que la campana pesa
              exactamente lo mismo a cualquier profundidad. Lo que cambia es
              el volumen desalojado, y por tanto el empuje. El peso es el dato
              fijo del problema; es el empuje el que se ajusta.

    resolucion: |
      **a) Las alturas de aire**, del equilibrio de flotación
      ($W = \gamma\,h\,A$):

      $$
      \boxed{h_1 = \frac{8820}{9800\cdot0{,}9} = 1\ \text{m}}
      \qquad
      \boxed{h_2 = \frac{6615}{9800\cdot0{,}9} = 0{,}75\ \text{m}}
      $$

      **b) Las presiones**, por compresión isoterma ($PV$ constante):

      $$
      \boxed{P_1 = \frac{1\cdot3}{1} = 3\ \text{bar}}
      \qquad
      \boxed{P_2 = \frac{1\cdot3}{0{,}75} = 4\ \text{bar}}
      $$

      **c) Las profundidades del nivel interior**, igualando con la
      hidrostática exterior:

      $$
      \boxed{H_1 = \frac{2\cdot10^{5}}{9800} = 20{,}41\ \text{m}}
      \qquad
      \boxed{H_2 = \frac{3\cdot10^{5}}{9800} = 30{,}61\ \text{m}}
      $$

      **Y el apartado d), si se conectan.** El aire de las dos se mezcla y
      queda a una presión común. Los pesos no cambian, así que tampoco los
      volúmenes de aire de cada una ($1{,}575\ \text{m}^{3}$ en total), y

      $$
      P_f = \frac{P_1V_1+P_2V_2}{V_1+V_2} = \frac{2{,}7+2{,}7}{1{,}575}
      = 3{,}43\ \text{bar}
      \quad\Rightarrow\quad
      H = \frac{2{,}43\cdot10^{5}}{9800} = 24{,}78\ \text{m}
      $$

      > **Tres físicas en un problema, y en un orden que no se puede
      > cambiar.** Flotación para el volumen, Boyle para la presión,
      > hidrostática para la profundidad. Quien empiece por Boyle se queda
      > con dos incógnitas y una ecuación.

  # ── COLECCIÓN 2.41. El hidrómetro: Arquímedes con el peso constante y el
  #    volumen variable, que es el caso al revés del de la campana.
  - id: ejflu8-col241-el-hidrometro
    titulo: La escala de un hidrómetro, y por qué no es lineal
    fuente: >-
      Ejercicio 2.41 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un hidrómetro pesa $0{,}035\ \text{N}$ y su varilla tiene
      $5\ \text{mm}$ de diámetro. Se pide:

      a) Distancia entre las marcas que señalan los pesos específicos relativos
      de $1{,}0$ y $1{,}1$.
    pide: La distancia entre las dos marcas de la escala.

    pasos:
      - tipo: reconocer
        pregunta: |
          Un hidrómetro flota en líquidos de distinta densidad. ¿Qué se
          mantiene y qué cambia?
        opciones:
          - texto: >-
              Su peso se mantiene, así que el empuje también; lo que cambia es
              el volumen sumergido
            correcta: true
            mensaje: |
              Eso es. Como flota, empuje igual a peso siempre; y como el peso
              es el mismo aparato, $\gamma V$ es constante. En un líquido más
              denso hace falta menos volumen, y el hidrómetro emerge.
          - texto: >-
              El volumen sumergido se mantiene y cambia el empuje
            mensaje: |
              Si el empuje cambiara, el hidrómetro no estaría en equilibrio y
              subiría o bajaría hasta que volviese a igualar al peso. Lo que se
              ajusta para conseguirlo es el volumen sumergido.
          - texto: >-
              Cambian los dos, y por eso la escala no es lineal
            mensaje: |
              El empuje no cambia: siempre vale lo que pesa el aparato. La
              escala no es lineal por otra razón —$V = W/\gamma$ es una
              hipérbola— pero el empuje es constante.

      - tipo: calcular
        titulo: La distancia entre marcas
        pregunta: |
          ¿Qué distancia hay entre la marca de $s = 1{,}0$ y la de
          $s = 1{,}1$?
        respuesta:
          tipo: magnitud
          valor: '16.54 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '18.19 mm'
            mensaje: |
              Has dividido la diferencia de volúmenes entre el área usando el
              volumen de $s = 1{,}1$ como referencia, o has redondeado por otro
              lado. Comprueba: $\Delta V = W/\gamma_1 - W/\gamma_{1,1}$.
          - valor: '4.13 mm'
            mensaje: |
              Has usado el diámetro donde va el radio al calcular el área de la
              varilla: $A = \pi d^{2}/4 = 1{,}96\cdot 10^{-5}\ \text{m}^{2}$.
        pista: |
          $V = W/\gamma$ en cada líquido; la diferencia de volúmenes, repartida
          en la sección de la varilla, da la distancia.
        desarrollo: |
          $$
          V_{1{,}0} = \frac{0{,}035}{9800} = 3{,}571\ \text{cm}^{3}
          \qquad
          V_{1{,}1} = \frac{0{,}035}{1{,}1\cdot 9800} = 3{,}247\ \text{cm}^{3}
          $$
          $$
          \Delta V = 0{,}3247\ \text{cm}^{3}
          \qquad
          A = \frac{\pi\cdot 0{,}5^{2}}{4} = 0{,}1963\ \text{cm}^{2}
          $$
          $$
          \Delta h = \frac{\Delta V}{A} = \frac{0{,}3247}{0{,}1963}
          = 1{,}654\ \text{cm} = 16{,}5\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al flotar, el empuje iguala al peso, que no cambia: por tanto
              $\gamma V$ es constante y $V = W/\gamma$.
          - texto: >-
              De $s = 1{,}0$ a $s = 1{,}1$ el volumen sumergido baja de 3,571 a
              3,247 cm³, una diferencia de 0,325 cm³.
          - texto: >-
              Repartida en la sección de la varilla, $0{,}196\ \text{cm}^{2}$,
              esa diferencia son 16,5 mm de escala.
          - texto: >-
              Como la relación es $V = W/\gamma$, la escala de un hidrómetro es
              lineal en densidad.
            trampa: true
            mensaje: |
              $V = W/\gamma$ es una **hipérbola**, no una recta: la escala se va
              apretando hacia las densidades altas. De 1,0 a 1,1 hay 16,5 mm,
              pero de 1,1 a 1,2 solo 13,8. Por eso las divisiones de un
              hidrómetro real no son equidistantes.

    resolucion: |
      **Arquímedes con el peso fijo.** El hidrómetro flota, así que su empuje
      iguala siempre a su peso; y como el peso no cambia, $\gamma V$ tampoco:

      $$
      V = \frac{W}{\gamma}
      $$

      **Los dos volúmenes.**

      $$
      V_{1{,}0} = \frac{0{,}035}{9800} = 3{,}571\ \text{cm}^{3}
      \qquad
      V_{1{,}1} = \frac{0{,}035}{10\,780} = 3{,}247\ \text{cm}^{3}
      $$

      **La diferencia, repartida en la varilla.**

      $$
      \Delta h = \frac{\Delta V}{\pi d^{2}/4}
      = \frac{0{,}3247}{0{,}1963} = 16{,}5\ \text{mm}
      $$

      **Por qué la varilla es fina**, que es lo que el ejercicio enseña sin
      decirlo: la sensibilidad del instrumento es $\Delta h/\Delta s$, y va con
      $1/A$. Con una varilla de 5 mm hay 16,5 mm de escala por cada décima de
      densidad, que se lee cómodamente; con una de 20 mm serían 1 mm, y el
      aparato no valdría para nada.

      **Y la escala no es lineal.** Como $V = W/\gamma$ es una hipérbola, las
      divisiones se aprietan hacia arriba: 16,5 mm entre 1,0 y 1,1, pero solo
      13,8 entre 1,1 y 1,2. Por eso un hidrómetro se fabrica con la escala
      grabada una a una, no con divisiones equidistantes.

  # ── COLECCIÓN 2.45. Barlow en una esfera, que es el caso donde el factor es
  #    4 y no 2. Va aquí porque el tema 8 ya deduce el del tubo.
  - id: ejflu8-col245-la-esfera-a-presion
    titulo: El espesor de una esfera a presión, y por qué es la mitad que un tubo
    fuente: >-
      Ejercicio 2.45 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Se tiene una esfera hueca de $10\ \text{cm}$ de diámetro interior
      sometida a una presión interna de $50\ \text{kg/cm}^{2}$. Se pide:

      a) Espesor de la pared si la tensión admisible de trabajo es
      $2\ \text{kg/mm}^{2}$.
    pide: El espesor de la pared de la esfera.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se corta una esfera para plantear el equilibrio?
        opciones:
          - texto: >-
              Por un plano diametral: la presión empuja sobre el círculo
              $\pi D^{2}/4$ y la pared resiste con la corona
              $\pi D\,e$
            correcta: true
            mensaje: |
              Eso es. Y como cualquier plano diametral da lo mismo, la esfera
              tiene una única tensión, igual en todas direcciones. Es lo que la
              hace la forma óptima para un recipiente a presión.
          - texto: >-
              Por un plano que contenga al eje, como en un tubo
            mensaje: |
              Una esfera no tiene eje: todos los planos diametrales son
              equivalentes. En un tubo sí lo hay, y por eso su tensión
              circunferencial y su tensión longitudinal son distintas.
          - texto: >-
              No hace falta cortar: la tensión es la presión por el área
              interior
            mensaje: |
              La tensión es una fuerza por unidad de área **de pared**, no de
              superficie interior. Hay que aislar media esfera y equilibrar la
              fuerza de presión con la que resiste el material cortado.

      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Qué espesor debe tener la pared?
        respuesta:
          tipo: magnitud
          valor: '6.25 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '12.5 mm'
            mensaje: |
              Has usado la fórmula del **tubo**, $e = pD/2\sigma$. En una
              esfera el denominador es $4\sigma$: la esfera necesita la mitad
              de pared que un tubo del mismo diámetro y presión.
          - valor: '0.0625 mm'
            mensaje: |
              Un factor cien: has mezclado $\text{kg/cm}^{2}$ con
              $\text{kg/mm}^{2}$. Pasa la presión a la misma unidad que la
              tensión: $50\ \text{kg/cm}^{2} = 0{,}5\ \text{kg/mm}^{2}$.
        pista: |
          Equilibrio de media esfera: $p\,\dfrac{\pi D^{2}}{4} =
          \sigma\,\pi D\,e$.
        desarrollo: |
          $$
          p\,\frac{\pi D^{2}}{4} = \sigma\,\pi D\,e
          \;\Longrightarrow\;
          \boxed{e = \frac{p\,D}{4\,\sigma}}
          $$

          Con todo en $\text{kg/mm}^{2}$ y mm:
          $p = 50\ \text{kg/cm}^{2} = 0{,}5\ \text{kg/mm}^{2}$,
          $D = 100\ \text{mm}$, $\sigma = 2\ \text{kg/mm}^{2}$:

          $$
          e = \frac{0{,}5\cdot 100}{4\cdot 2} = 6{,}25\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Aislando media esfera, la presión empuja sobre el círculo
              diametral y la pared resiste sobre la corona de espesor $e$.
          - texto: >-
              Igualando, $e = pD/4\sigma$, que es la mitad del espesor que
              necesitaría un tubo del mismo diámetro y presión.
          - texto: >-
              Con los datos, y pasando todo a $\text{kg/mm}^{2}$, sale
              $e = 6{,}25$ mm.
          - texto: >-
              La esfera necesita menos espesor porque su superficie es menor
              que la de un tubo del mismo diámetro.
            trampa: true
            mensaje: |
              No es cuestión de superficie total: es que **el material trabaja
              en dos direcciones a la vez**. En un tubo, la tensión
              circunferencial resiste ella sola el empuje diametral; en una
              esfera, cualquier corte tiene material repartido en todas las
              direcciones y la carga se reparte. De ahí el 4 en lugar del 2.

    resolucion: |
      **El corte, que es lo único que hay que decidir.** Se aísla media esfera.
      La presión empuja sobre la proyección —un círculo de diámetro $D$— y el
      material cortado es una corona de perímetro $\pi D$ y espesor $e$:

      $$
      p\,\frac{\pi D^{2}}{4} = \sigma\,\pi D\,e
      \;\Longrightarrow\;
      e = \frac{p\,D}{4\sigma}
      $$

      **Con las unidades homogeneizadas**, $p = 0{,}5\ \text{kg/mm}^{2}$ y
      $D = 100\ \text{mm}$:

      $$
      e = \frac{0{,}5\cdot 100}{4\cdot 2} = 6{,}25\ \text{mm}
      $$

      **La comparación con el tubo es el resultado de fondo.** Para un tubo,
      la misma deducción sobre una generatriz da $e = pD/2\sigma$: **el doble**.
      Una esfera aguanta la misma presión con la mitad de pared.

      La razón no es geométrica sino de reparto de carga: en un tubo, la
      tensión circunferencial resiste ella sola, mientras que en una esfera
      cualquier plano de corte encuentra material orientado en todas las
      direcciones. Por eso los depósitos de gas a alta presión son esféricos y
      los tanques cilíndricos llevan **fondos abombados**: el cilindro es más
      fácil de fabricar, pero la esfera es más eficiente en material.

  # ── COLECCIÓN 2.46. Arquímedes con gases: el empuje lo da el aire y hay que
  #    calcular dos densidades con la ecuación de estado.
  - id: ejflu8-col246-el-globo-de-hidrogeno
    titulo: Cuánto puede pesar la carcasa de un globo de hidrógeno
    fuente: >-
      Ejercicio 2.46 · Colección de Problemas, capítulo 2 · Mecánica de
      Fluidos, UPV/EHU
    nivel: practica
    enunciado: |
      Un globo esférico de $12\ \text{m}$ de diámetro está abierto en su parte
      inferior y es llenado de hidrógeno. Teniendo en cuenta que la lectura
      barométrica es $710\ \text{torr}$ y la temperatura de $20\ °\text{C}$, se
      pide:

      a) Peso de la carcasa del globo para que se mantenga en equilibrio.

      Datos: $R_{H} = 4.124\ \text{N}\cdot\text{m}/(\text{kg}\cdot\text{K})$;
      $R_{\text{aire}} = 287{,}14\ \text{N}\cdot\text{m}/(\text{kg}\cdot\text{K})$.
    pide: El peso máximo de la carcasa para que el globo se sostenga.

    pasos:
      - tipo: reconocer
        pregunta: |
          El globo está **abierto por abajo**. ¿Qué implica eso para el
          hidrógeno de dentro?
        opciones:
          - texto: >-
              Que está a la misma presión que el aire exterior, así que las dos
              densidades se calculan con la misma presión
            correcta: true
            mensaje: |
              Exacto, y es el detalle que hace resoluble el problema. Si
              estuviera cerrado y presurizado haría falta un dato más. Abierto,
              la presión interior es la atmosférica y solo cambia el gas.
          - texto: >-
              Que el hidrógeno se escapa y hay que contar una pérdida
            mensaje: |
              El hidrógeno es mucho más ligero que el aire, así que se queda
              arriba y no se derrama por la abertura inferior. Es el mismo
              principio de un globo aerostático.
          - texto: >-
              Que dentro hay una mezcla de aire e hidrógeno
            mensaje: |
              El problema supone el globo lleno de hidrógeno puro. La abertura
              está para igualar presiones, no para mezclar: por eso los dos
              gases están a 710 torr.

      - tipo: calcular
        titulo: Las dos densidades
        pregunta: |
          ¿Cuánto vale la densidad del aire exterior?
        respuesta:
          tipo: magnitud
          valor: '1.124 kg/m3'
          tolerancia: 0.02
          formato: una densidad, con su unidad
        distractores:
          - valor: '1.204 kg/m3'
            mensaje: |
              Has usado $760\ \text{torr}$ en vez de $710$. El barómetro marca
              710: el globo está en altura o hay baja presión, y el aire es
              algo menos denso de lo normal.
          - valor: '0.07824 kg/m3'
            mensaje: |
              Esa es la densidad del **hidrógeno**, calculada con su constante
              $R$. La del aire lleva $R = 287{,}14$, catorce veces menor, y por
              eso su densidad es catorce veces mayor.
        pista: |
          $\rho = p/(R\,T)$, con $p$ absoluta en pascales y $T$ en kelvin.
        desarrollo: |
          $$
          p = 710\ \text{torr} = 710\cdot 133{,}2 = 94\,595\ \text{Pa}
          \qquad
          T = 293\ \text{K}
          $$
          $$
          \rho_{\text{aire}} = \frac{94\,595}{287{,}14\cdot 293}
          = 1{,}124\ \frac{\text{kg}}{\text{m}^{3}}
          \qquad
          \rho_{H} = \frac{94\,595}{4124\cdot 293}
          = 0{,}0782\ \frac{\text{kg}}{\text{m}^{3}}
          $$

      - tipo: calcular
        titulo: El peso de la carcasa
        pregunta: |
          ¿Cuánto puede pesar la carcasa?
        respuesta:
          tipo: magnitud
          valor: '9271 n'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '9964 n'
            mensaje: |
              Te has olvidado de restar el peso del hidrógeno. El globo tiene
              que sostener **también** el gas que lleva dentro: el empuje se
              reparte entre la carcasa y el hidrógeno.
          - valor: '693.7 n'
            mensaje: |
              Ese es el peso del hidrógeno, no lo que sobra para la carcasa. La
              carcasa se lleva la diferencia entre el empuje y el peso del gas.
        pista: |
          Empuje del aire desplazado menos peso del hidrógeno, con el volumen
          de la esfera $\pi D^{3}/6$.
        desarrollo: |
          $$
          V = \frac{\pi D^{3}}{6} = \frac{\pi\cdot 12^{3}}{6}
          = 904{,}8\ \text{m}^{3}
          $$
          $$
          W_{\text{carcasa}} = (\rho_{\text{aire}} - \rho_H)\,V\,g
          = (1{,}124-0{,}0782)\cdot 904{,}8\cdot 9{,}8
          = 9271\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al estar abierto por abajo, el hidrógeno está a la presión
              atmosférica, así que las dos densidades salen de la misma presión
              y temperatura.
          - texto: >-
              Con la ecuación de estado, $\rho_{\text{aire}} = 1{,}124$ y
              $\rho_H = 0{,}078\ \text{kg/m}^{3}$: el hidrógeno es catorce
              veces más ligero.
          - texto: >-
              El empuje menos el peso del gas deja $9271\ \text{N}$ para la
              carcasa, unos 946 kilopondios.
          - texto: >-
              Si en vez de hidrógeno se usara helio, que es el doble de pesado,
              la carga útil se reduciría a la mitad.
            trampa: true
            mensaje: |
              Se reduciría muy poco. Lo que sostiene el globo es la
              **diferencia** de densidades: con hidrógeno, $1{,}124-0{,}078 =
              1{,}046$; con helio, $1{,}124-0{,}156 = 0{,}968$. Un 7 % menos,
              no la mitad. Por eso se usa helio pese a ser más pesado: es casi
              igual de eficaz y no arde.

    resolucion: |
      **Arquímedes también funciona en el aire**, y este ejercicio es la prueba
      de que el «fluido» del tema 8 no tiene que ser líquido.

      **Las dos densidades**, con la ecuación de estado y la **misma** presión,
      porque el globo está abierto:

      $$
      \rho = \frac{p}{R\,T}
      \qquad
      \rho_{\text{aire}} = 1{,}124
      \qquad
      \rho_{H} = 0{,}0782\ \frac{\text{kg}}{\text{m}^{3}}
      $$

      **El equilibrio.** El empuje es el peso del aire desplazado; hay que
      sostener el hidrógeno y la carcasa:

      $$
      \underbrace{\rho_{\text{aire}} V g}_{\text{empuje}}
      = \underbrace{\rho_H V g}_{\text{gas}} + W_{\text{carcasa}}
      \;\Longrightarrow\;
      W_{\text{carcasa}} = (\rho_{\text{aire}}-\rho_H)\,V\,g = 9271\ \text{N}
      $$

      **Novecientos cuarenta y seis kilos** para un globo de doce metros. Es
      poco: la carcasa, las cuerdas, la barquilla y los tripulantes tienen que
      caber ahí. Y explica por qué los dirigibles eran enormes: el empuje va
      con $D^{3}$ y la tela con $D^{2}$, así que la carga útil solo aparece a
      partir de cierto tamaño.

      **El detalle del hidrógeno frente al helio**, que es la pregunta natural:
      el helio es el doble de denso, pero como lo que cuenta es la
      **diferencia** con el aire, la pérdida de capacidad es de apenas un 7 %.
      A cambio no arde. Después del *Hindenburg* nadie discutió el intercambio.

  - id: ejflu8-col26-la-cupula-y-los-seis-pernos
    titulo: La cúpula que el agua intenta levantar, y los seis pernos que la sujetan
    fuente: >-
      Ejercicio 2.6 · Colección de problemas de Mecánica de Fluidos, Estática
      de los fluidos y fuerzas sobre superficies · Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · Departamento de Ingeniería Energética.
    nivel: practica
    enunciado: |
      La cúpula semiesférica de la figura pesa $31$ kN y se encuentra sujeta al
      suelo mediante seis pernos igualmente espaciados y resistentes. Se pide:

      **a)** Fuerza que soporta cada tornillo.
      **b)** Diámetro de cada perno si la tensión admisible de trabajo del
      material de que están constituidos es de $9{,}58\ \text{kg/mm}^{2}$.
      **c)** Altura alcanzada por el agua en el tubo para que se produjera la
      rotura de los pernos, si su tensión de rotura es de
      $40\ \text{kg/mm}^{2}$.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 300" role="img" aria-labelledby="fc26t fc26d">
        <title id="fc26t">Cúpula semiesférica anclada al suelo con un tubo vertical encima</title>
        <desc id="fc26d">Una cúpula semiesférica de dos metros de radio, apoyada sobre el suelo y llena de agua. De su clave sale un tubo vertical de cuatro metros, también lleno de agua, así que la superficie libre queda seis metros por encima del suelo. La cúpula está sujeta al suelo por seis pernos igualmente espaciados; en la sección se ven dos de ellos, uno a cada lado. El agua empuja la cúpula hacia arriba y los pernos y el peso la retienen.</desc>

        <line x1="20" y1="248" x2="400" y2="248" stroke="var(--ink)" stroke-width="2"/>
        <path d="M20 248 L20 258 M40 248 L40 258 M60 248 L60 258 M80 248 L80 258 M100 248 L100 258 M120 248 L120 258 M140 248 L140 258 M160 248 L160 258 M180 248 L180 258 M200 248 L200 258 M220 248 L220 258 M240 248 L240 258 M260 248 L260 258 M280 248 L280 258 M300 248 L300 258 M320 248 L320 258 M340 248 L340 258 M360 248 L360 258 M380 248 L380 258" stroke="var(--faint)" stroke-width="1"/>

        <path d="M120 248 A 90 90 0 0 1 300 248 Z" fill="var(--live)" fill-opacity=".14" stroke="var(--ink)" stroke-width="2.4"/>
        <text x="210" y="222" font-size="11" text-anchor="middle" fill="var(--live)">agua</text>

        <rect x="200" y="68" width="20" height="92" fill="var(--live)" fill-opacity=".14" stroke="var(--ink)" stroke-width="2"/>
        <line x1="196" y1="68" x2="224" y2="68" stroke="var(--live)" stroke-width="2"/>
        <text x="230" y="66" font-size="10" fill="var(--live)">superficie libre</text>

        <line x1="150" y1="240" x2="150" y2="262" stroke="var(--ink)" stroke-width="2.4"/>
        <rect x="142" y="232" width="16" height="10" fill="var(--ink)"/>
        <line x1="270" y1="240" x2="270" y2="262" stroke="var(--ink)" stroke-width="2.4"/>
        <rect x="262" y="232" width="16" height="10" fill="var(--ink)"/>
        <text x="150" y="278" font-size="10" text-anchor="middle" fill="var(--ink)">seis pernos</text>

        <line x1="252" y1="196" x2="292" y2="176" stroke="var(--faint)" stroke-width="1"/>
        <text x="296" y="174" font-size="10" fill="var(--faint)">R = 2 m</text>

        <line x1="86" y1="68" x2="86" y2="248" stroke="var(--faint)" stroke-width="1"/>
        <line x1="82" y1="68" x2="90" y2="68" stroke="var(--faint)" stroke-width="1"/>
        <line x1="82" y1="248" x2="90" y2="248" stroke="var(--faint)" stroke-width="1"/>
        <text transform="rotate(-90 72 158)" x="72" y="158" font-size="10" text-anchor="middle" fill="var(--faint)">6 m</text>

        <line x1="336" y1="68" x2="336" y2="158" stroke="var(--faint)" stroke-width="1"/>
        <line x1="332" y1="68" x2="340" y2="68" stroke="var(--faint)" stroke-width="1"/>
        <line x1="332" y1="158" x2="340" y2="158" stroke="var(--faint)" stroke-width="1"/>
        <text x="344" y="116" font-size="10" fill="var(--faint)">4 m</text>
      </svg>
      <figcaption>

      El tubo mide 4 m y la cúpula 2 de radio, así que la superficie libre
      queda a **6 m del suelo**. Esa es la cota que manda, no la altura de la
      cúpula.

      </figcaption>
      </figure>
    pide: La fuerza por perno, su diámetro mínimo y la altura de agua que los rompería.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para la componente vertical sobre la cúpula, ¿qué volumen hay que
          pesar?
        opciones:
          - texto: >-
              El del cilindro que va de la cúpula hasta la superficie libre,
              **menos** el de la propia semiesfera
            correcta: true
            mensaje: |
              Eso es. La componente vertical sobre una superficie curva es el
              peso del volumen de líquido que hay entre ella y la superficie
              libre. Aquí ese volumen es el cilindro de radio $R$ y altura
              $6$ m al que se le quita la media esfera.
          - texto: El de la semiesfera, que es el agua que hay dentro
            mensaje: |
              Ese es el agua que la cúpula contiene, no la que la empuja. La
              vertical se calcula con el volumen **hasta la superficie libre**,
              y aquí la superficie libre está seis metros por encima.
          - texto: El del tubo, que es por donde entra la presión
            mensaje: |
              El tubo aporta la **cota**, no el volumen. Da igual que sea de 2
              cm o de 2 m de diámetro: lo que cuenta es a qué altura deja la
              superficie libre. Es la paradoja hidrostática.
      - tipo: calcular
        titulo: El empuje vertical
        pregunta: |
          ¿Cuánto vale la componente vertical del empuje sobre la cúpula?
        respuesta:
          tipo: magnitud
          valor: 574702 N
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: 738274 N
            mensaje: |
              Te has quedado con el cilindro entero, sin restarle la
              semiesfera. El agua no ocupa ese casquete: ahí está la cúpula.
          - valor: 164212 N
            mensaje: |
              Has pesado solo la semiesfera. Eso sería el agua contenida, no la
              que empuja; el empuje se cuenta hasta la superficie libre.
        pista: |
          $F_V = \gamma\left(\pi R^{2}h - \tfrac{1}{2}\cdot\tfrac{4}{3}\pi
          R^{3}\right)$, con $h = 6$ m y $R = 2$ m.
        desarrollo: |
          $$
          F_V = \left(\pi R^{2}\,h - \frac{1}{2}\cdot\frac{4}{3}\pi R^{3}\right)\gamma
          = \left(\pi\cdot 2^{2}\cdot 6 - \frac{1}{2}\cdot\frac{4}{3}\pi\cdot 2^{3}\right)9800
          $$

          $$
          F_V = (75{,}40 - 16{,}76)\cdot 9800 = 574\,702\ \text{N}
          $$

          Casi 60 m³ de agua imaginaria empujando hacia arriba, y la mayor
          parte de ese volumen **no existe**: es el hueco que ocuparía el agua
          si la cúpula no estuviera.
      - tipo: calcular
        titulo: La fuerza en cada perno
        pregunta: |
          ¿Qué fuerza soporta cada uno de los seis pernos?
        respuesta:
          tipo: magnitud
          valor: 90617 N
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: 95784 N
            mensaje: |
              Te has olvidado del peso de la cúpula. Los 31 kN también tiran
              hacia abajo y ayudan a los pernos: $6F_t = F_V - W$.
          - valor: 100950 N
            mensaje: |
              Has **sumado** el peso en vez de restarlo. El peso va en el mismo
              sentido que los pernos, hacia abajo, así que descarga a los
              pernos en vez de cargarlos.
        pista: |
          Equilibrio vertical de la cúpula: hacia arriba $F_V$; hacia abajo, su
          peso y los seis pernos.
        desarrollo: |
          $$
          \sum F_y = 0
          \;\Longrightarrow\;
          F_V = W + 6F_t
          \;\Longrightarrow\;
          F_t = \frac{574\,702 - 31\,000}{6} = 90\,617\ \text{N}
          $$

          Noventa kilonewton por perno, unas nueve toneladas. Y el peso propio
          de la cúpula solo descuenta un 5 %.
      - tipo: calcular
        titulo: El diámetro mínimo
        pregunta: |
          Con $\sigma_{adm} = 9{,}58\ \text{kg/mm}^{2}$, ¿qué diámetro mínimo
          necesita cada perno?
        respuesta:
          tipo: magnitud
          valor: 35 mm
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: 110 mm
            mensaje: |
              Te has dejado la conversión de kilopondios: $9{,}58$ kg/mm² son
              $9{,}58 \cdot 9{,}8 = 93{,}9$ N/mm². Sin ella la tensión sale
              casi diez veces menor y el perno, tres veces más gordo.
          - valor: 17.5 mm
            mensaje: >-
              Has despejado el radio y lo has dado como diámetro. En
              $\sigma = 4F/(\pi D^{2})$ lo que sale es $D$.
        pista: |
          La sección del perno trabaja a tracción:
          $\sigma = F_t/S = 4F_t/(\pi D^{2}) \le \sigma_{adm}$.
        desarrollo: |
          $$
          D_{min} = \left[\frac{4F_t}{\pi\,\sigma_{adm}}\right]^{1/2}
          = \left[\frac{4\cdot 90\,617}{\pi \cdot 9{,}58 \cdot 9{,}8}\right]^{1/2}
          = 35\ \text{mm}
          $$

          El $9{,}8$ del denominador es lo que convierte los kilopondios por
          milímetro cuadrado en newton por milímetro cuadrado. Sin él, el
          resultado se va tres veces.
      - tipo: calcular
        titulo: La altura que rompería los pernos
        pregunta: |
          Con $\sigma_{rot} = 40\ \text{kg/mm}^{2}$, ¿hasta qué altura sobre el
          suelo tendría que llegar el agua para romperlos?
        respuesta:
          tipo: magnitud
          valor: 20 m
          tolerancia: 0.02
          formato: una altura sobre el suelo, con su unidad
        distractores:
          - valor: 25 m
            mensaje: |
              Has olvidado restar el volumen de la semiesfera al del cilindro,
              igual que en el primer apartado. La cúpula sigue quitando sus
              16,8 m³.
          - valor: 14 m
            mensaje: >-
              Esa es la altura del tubo, no la del agua sobre el suelo. El
              enunciado pregunta la cota total; el tubo tendría que medir 18 m
              porque la cúpula ya pone 2.
        pista: |
          Primero, qué fuerza rompe un perno de 35 mm. Después, qué $F_V$ hace
          falta para eso. Y de ahí, qué altura da ese $F_V$.
        desarrollo: |
          **La fuerza de rotura de un perno**, con la sección ya fijada en
          $35$ mm:

          $$
          F_t = \sigma_{rot}\,\frac{\pi D^{2}}{4}
          = 40 \cdot 9{,}8 \cdot \frac{\pi \cdot 35^{2}}{4} = 377\,148\ \text{N}
          $$

          **El empuje que haría falta** para llegar a esa fuerza en los seis:

          $$
          F_V = W + 6F_t = 31\,000 + 6\cdot 377\,148 = 2\,293\,888\ \text{N}
          $$

          **Y la altura que da ese empuje**, con la misma expresión del
          principio:

          $$
          \left(\pi\cdot 2^{2}\,h - \frac{1}{2}\cdot\frac{4}{3}\pi\cdot 2^{3}\right)9800
          = 2\,293\,888
          \;\Longrightarrow\;
          \boxed{h = 19{,}96 \approx 20\ \text{m}}
          $$

          Medidos **desde el suelo**: el tubo tendría que medir 18 m, porque la
          cúpula ya aporta los otros 2.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La componente vertical sobre la cúpula es el peso del volumen de
              agua entre ella y la superficie libre.
          - texto: >-
              Ese volumen es el cilindro de radio 2 m y 6 m de alto menos la
              media esfera, o sea $75{,}4 - 16{,}8 = 58{,}6$ m³.
          - texto: >-
              En el equilibrio vertical, el empuje sube y el peso propio más
              los seis pernos bajan, así que $6F_t = F_V - W$.
          - texto: >-
              Como el tubo es estrecho, aporta poco volumen y por eso su altura
              casi no influye en el empuje.
            trampa: true
            mensaje: |
              Es la paradoja hidrostática al revés. La altura del tubo **es lo
              que manda**: fija la cota de la superficie libre y con ella la
              presión en toda la cúpula. Lo que no influye es su **diámetro**.
              Con 4 m de tubo el empuje es de 575 kN; con 18, de 2294.
          - texto: >-
              Con la fuerza por perno y la tensión admisible, la sección
              necesaria sale de $\sigma = 4F_t/(\pi D^{2})$.
    resolucion: |
      **La idea.** El agua no empuja la cúpula hacia arriba con el peso del
      agua que hay dentro, sino con el peso del volumen que habría **entre la
      cúpula y la superficie libre**. Y la superficie libre está en lo alto del
      tubo, seis metros por encima del suelo.

      **El empuje.** Ese volumen es el cilindro de radio $R = 2$ m y altura
      $6$ m menos la media esfera:

      $$
      F_V = \left(\pi\cdot 2^{2}\cdot 6 - \frac{1}{2}\cdot\frac{4}{3}\pi\cdot 2^{3}\right)9800
      = 574\,702\ \text{N}
      $$

      **Los pernos.** El equilibrio vertical da $F_V = W + 6F_t$, luego
      $F_t = (574\,702 - 31\,000)/6 = 90\,617$ N cada uno. Con
      $\sigma_{adm} = 9{,}58$ kg/mm² $= 93{,}9$ N/mm², la sección pide
      $D_{min} = 35$ mm.

      **La rotura.** Un perno de 35 mm rompe a
      $F_t = 40\cdot 9{,}8\cdot\pi\cdot 35^{2}/4 = 377\,148$ N, lo que exige
      $F_V = 2\,293\,888$ N y, deshaciendo la primera cuenta,
      $h = 19{,}96 \approx 20$ m **medidos desde el suelo**.

      **Lo que hay que llevarse.** Dos cosas. Una, que el volumen que se pesa
      en gran parte **no existe**: es el hueco que ocuparía el agua si la
      cúpula no estuviera. Y otra, la paradoja hidrostática: lo que manda es la
      **altura** del tubo, no su diámetro. Un tubo de dos centímetros con 18 m
      de agua dentro rompe seis pernos de 35 mm.
  - id: ejflu08-col236-la-esfera-que-tapona-entre-el-agua-y-el-aceite
    titulo: La esfera que tapona entre el agua y el aceite
    fuente: Ejercicio 2.36 · Colección de problemas, capítulo 2 · Mecánica de Fluidos, UPV/EHU
    nivel: examen
    enunciado: |
      En el depósito de la figura las dos secciones se encuentran totalmente
      aisladas una de la otra, mediante una superficie horizontal y una esfera
      de 2 m de diámetro que actúa de obturador. Se pide:

      a) Dibujar los prismas de presiones correspondientes a las fuerzas
      verticales que actúan sobre la esfera.

      b) Módulo y sentido de dichas fuerzas.

      c) Resultante de las fuerzas horizontales y verticales que obran sobre la
      esfera.

      d) Peso que deberá tener la esfera para alcanzar el equilibrio, y peso
      específico si fuese maciza.

      Dato: presión atmosférica 740 mm.c.Hg.

      <figure class="figura-examen">
