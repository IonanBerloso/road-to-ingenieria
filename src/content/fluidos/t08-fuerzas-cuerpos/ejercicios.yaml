      </svg>
      <figcaption>

      La esfera tiene **media cara en el agua y media en el aceite**, y el plano
      de separación pasa por su ecuador. Cada fluido la empuja desde su lado, y
      el problema es comparar los dos empujes.

      </figcaption>
      </figure>
    pide: Los empujes verticales sobre la esfera, su resultante horizontal, y el peso que la equilibra.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) pregunta por la resultante de las fuerzas
          **horizontales** sobre la esfera. ¿Cuánto vale, y por qué?
        opciones:
          - texto: |
              Cero, por simetría: la esfera es de revolución respecto del eje
              vertical, así que a cada trozo de superficie le corresponde otro
              idéntico al otro lado
            correcta: true
            mensaje: |
              Exacto, y conviene verlo sin calcular. En un plano horizontal
              cualquiera, la esfera se corta en una circunferencia, y la presión
              es la misma en todos sus puntos porque están todos a la misma
              profundidad. Empujes iguales en todas las direcciones
              horizontales: suma cero. Vale para cualquier cuerpo de revolución
              con el eje vertical, y ahorra medio problema.
          - texto: |
              La diferencia entre el empuje del agua y el del aceite, proyectada
              en horizontal
            mensaje: |
              Esa diferencia existe y es **vertical**: es la que da los 13,17 kN
              del apartado d). En horizontal no queda nada, y no por
              compensación entre los dos fluidos, sino porque cada uno se
              compensa consigo mismo.
          - texto: |
              No se puede saber sin conocer la posición del centro de presiones
            mensaje: |
              El centro de presiones importa para los momentos, no para la
              resultante. Y aquí ni siquiera hace falta: la simetría de
              revolución cancela la resultante horizontal sea cual sea la
              presión.
          - texto: |
              Cero solo si los dos fluidos tuvieran la misma densidad
            mensaje: |
              No hace falta. Cada hemisferio se cancela consigo mismo dentro de
              su propio fluido: el de arriba con el agua y el de abajo con el
              aceite. Que las densidades sean distintas afecta a lo vertical.

      - tipo: calcular
        titulo: El empuje del agua, hacia abajo
        pregunta: |
          El agua está a 1,011 bar absolutos en la tapa y la atmosférica son
          740 mm de Hg. ¿Qué fuerza vertical ejerce el agua sobre la media
          esfera superior, en kN?
        respuesta:
          tipo: magnitud
          valor: '110.4 kN'
          tolerancia: 0.01
          formato: la fuerza en kN
        distractores:
          - valor: '420.2 kN'
            mensaje: |
              Has usado la presión **absoluta** de 1,011 bar. En un problema de
              fuerzas sobre una superficie hay que trabajar con presiones
              manométricas: la atmosférica actúa también por fuera y se
              cancela. Y aquí la manométrica es diminuta —2 473 Pa— porque el
              depósito está casi a la atmosférica.
          - valor: '130.9 kN'
            mensaje: |
              Te has dejado de restar el casquete. El volumen que carga sobre la
              media esfera no es el cilindro entero de 4 m: hay que quitarle lo
              que ocupa la propia esfera, $\tfrac{2}{3}\pi R^{3} = 2{,}09$ m³.
          - valor: '102.6 kN'
            mensaje: |
              Has olvidado la presión de la tapa. Es pequeña —0,25 mca— pero
              son 7,8 kN sobre 3,14 m², y el enunciado se molesta en darte la
              atmosférica precisamente para que la calcules.
        pista: |
          Manométrica en la tapa $= 1{,}011\cdot 10^{5} - 0{,}740\cdot 13{,}6\cdot 9800$,
          y el volumen es $A\cdot 4 - \tfrac{2}{3}\pi R^{3}$.
        desarrollo: |
          $$
          p_{atm} = 0{,}740\cdot 13{,}6\cdot 9800 = 98\,627\ \text{Pa}
          \qquad
          p_{tapa} = 1{,}011\cdot 10^{5} - 98\,627 = 2\,473\ \text{Pa}
          $$

          La fuerza hacia abajo es el peso del agua que hay verticalmente encima
          de la media esfera, más lo que aporta la presión de la tapa sobre la
          proyección:

          $$
          F_{\downarrow} = p_{tapa}A + \gamma_{w}\left(4A - \frac{2}{3}\pi R^{3}\right)
          $$

          $$
          = 2473\cdot 3{,}1416 + 9800\,(12{,}566 - 2{,}094) = 110{,}4\ \text{kN}
          $$

      - tipo: calcular
        titulo: La presión del aceite en el plano
        pregunta: |
          El manómetro en U marca $P_0 = 0{,}2$ kg/cm², lleva 40 cm de un
          líquido de $s = 4$ y se conecta al depósito 15 cm **por debajo** del
          plano de separación, ya dentro del aceite. ¿Cuál es la presión
          manométrica del aceite en ese plano, en kPa?
        respuesta:
          tipo: magnitud
          valor: '34.10 kPa'
          tolerancia: 0.01
          formato: la presión manométrica en kPa
        distractores:
          - valor: '35.28 kPa'
            mensaje: |
              Te has dejado los 15 cm de aceite. Al subir por el ramal el fluido
              pierde altura de presión: son 1 176 Pa menos. Poco, pero cambia el
              tercer dígito de todo lo que viene después.
          - valor: '19.6 kPa'
            mensaje: |
              Eso es $P_0$ a secas, 0,2 kg/cm². El manómetro en U está ahí
              precisamente porque la presión en el depósito **no** es la que
              marca la esfera del aparato: hay 40 cm de un líquido cuatro veces
              más denso que el agua entre medias.
          - valor: '2.74 kPa'
            mensaje: |
              Has restado la columna de $s = 4$ en vez de sumarla. Bajando por
              el ramal del manómetro la presión **aumenta**; el signo se decide
              mirando si se sube o se baja, no por dónde esté dibujado el tubo.
        pista: |
          $P_0 + 4\gamma_{w}(0{,}40) - 0{,}8\gamma_{w}(0{,}15)$, con
          $P_0 = 0{,}2\cdot 9{,}8\cdot 10^{4}$ Pa.
        desarrollo: |
          Recuerda que **kg/cm² es una presión**, con un kilopondio dentro:
          $0{,}2\ \text{kg/cm}^{2} = 19\,600$ Pa, o sea 2 mca.

          $$
          p = 19\,600 + 4\cdot 9800\cdot 0{,}40 - 0{,}8\cdot 9800\cdot 0{,}15
          $$

          $$
          = 19\,600 + 15\,680 - 1\,176 = 34\,104\ \text{Pa} = 34{,}10\ \text{kPa}
          $$

          Son 0,348 kg/cm², bastante más que los 0,2 que marca el aparato: los
          40 cm de líquido pesado valen ellos solos 1,6 mca.

      - tipo: calcular
        titulo: El empuje del aceite, hacia arriba
        pregunta: |
          ¿Qué fuerza vertical ejerce el aceite sobre la media esfera inferior,
          en kN?
        respuesta:
          tipo: magnitud
          valor: '123.6 kN'
          tolerancia: 0.01
          formato: la fuerza en kN
        distractores:
          - valor: '107.1 kN'
            mensaje: |
              Te has dejado el casquete inferior. La media esfera **sobresale
              hacia abajo** dentro del aceite, así que hay que **sumar** el
              empuje sobre ese volumen: $\gamma_{ac}\tfrac{2}{3}\pi R^{3}$, unos
              16,4 kN.
          - valor: '90.7 kN'
            mensaje: |
              Has restado el casquete en vez de sumarlo. Compara con el
              hemisferio de arriba: allí el agua está **por encima** y el
              casquete resta; aquí el aceite está **por debajo** y suma. Los dos
              signos salen de la misma regla —el volumen entre la superficie y
              el plano piezométrico— aplicada a cada lado.
          - valor: '127.7 kN'
            mensaje: |
              Parece que has usado el peso específico del agua para el casquete.
              El de abajo es aceite: $0{,}8\cdot 9800 = 7\,840$ N/m³.
        pista: |
          $F_{\uparrow} = p\,A + \gamma_{ac}\tfrac{2}{3}\pi R^{3}$.
        desarrollo: |
          $$
          F_{\uparrow} = 34\,104\cdot 3{,}1416 + 7840\cdot 2{,}0944
                       = 107{,}1 + 16{,}4 = 123{,}6\ \text{kN}
          $$

          El aceite gana. Y merece la pena ver por qué, porque no es obvio: la
          columna de agua es más alta y más densa, pero el aceite está a más
          presión —34,1 kPa contra los 41,7 kPa del agua en el plano… que
          tampoco—. Lo que decide es el **casquete**: al agua le resta 20,5 kN y
          al aceite le suma 16,4. Casi 37 kN de diferencia solo por qué lado
          sobresale la esfera.

      - tipo: calcular
        titulo: El peso específico de la esfera
        pregunta: |
          Para el equilibrio, la esfera tiene que pesar la diferencia. Si fuese
          maciza, ¿qué peso específico tendría, en N/m³?
        respuesta:
          tipo: magnitud
          valor: '3143 N/m3'
          tolerancia: 0.01
          formato: el peso específico en N/m³
        distractores:
          - valor: '6287 N/m3'
            mensaje: |
              Has dividido entre el volumen de **media** esfera. La esfera es
              entera aunque el plano la parta: $\tfrac{4}{3}\pi R^{3} = 4{,}19$ m³.
          - valor: '55850 N/m3'
            mensaje: |
              Parece que has sumado los dos empujes en vez de restarlos. Uno
              apunta hacia abajo y el otro hacia arriba: para el equilibrio lo
              que cuenta es cuánto sobra del de abajo.
          - valor: '9800 N/m3'
            mensaje: |
              9 800 N/m³ es el peso específico del agua. La esfera resulta ser
              mucho más ligera —3 143, la tercera parte— y tiene sentido: está
              sujeta entre dos fluidos que la empujan hacia arriba en neto.
        pista: |
          $W = F_{\uparrow} - F_{\downarrow}$, y luego entre
          $\tfrac{4}{3}\pi R^{3}$.
        desarrollo: |
          $$
          W = 123{,}6 - 110{,}4 = 13{,}17\ \text{kN}
          $$

          $$
          \gamma_{esfera} = \frac{13\,162}{\tfrac{4}{3}\pi\,1^{3}}
                          = \frac{13\,162}{4{,}189} = 3\,143\ \text{N/m}^{3}
          $$

          Es la tercera parte del agua: un material muy ligero, del orden de una
          madera de balsa o un plástico espumado. Tiene sentido — el neto de los
          dos empujes tira de la esfera hacia arriba, así que para que no salga
          disparada solo hace falta un peso pequeño.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: |
              La resultante **horizontal** es cero por simetría de revolución, y
              eso se sabe sin calcular nada.
          - texto: |
              El agua empuja hacia abajo con 110,4 kN: la presión de la tapa
              sobre la proyección, más el peso del agua que hay encima del
              casquete —que es el cilindro de 4 m **menos** el casquete—.
          - texto: |
              El aceite empuja hacia arriba con 123,6 kN: su presión en el plano
              por la proyección, **más** el empuje sobre el casquete inferior,
              porque este sobresale hacia abajo.
          - texto: |
              La diferencia, 13,17 kN hacia arriba, es lo que tiene que pesar la
              esfera; repartido en sus 4,19 m³ da 3 143 N/m³.
          - texto: |
              Y como el aceite es menos denso que el agua pero empuja más, queda
              claro que en un obturador siempre manda el fluido de abajo.
            trampa: true
            mensaje: |
              La observación es correcta y la conclusión, inventada. Aquí el
              aceite gana por dos motivos concretos —su presión en el plano y,
              sobre todo, que el casquete le **suma** donde al agua le resta— y
              ninguno de los dos es una regla general. Bastaría subir un poco la
              presión de la cámara de agua para invertirlo. Una regla que salga
              de un solo caso no es una regla: es ese caso.
    resolucion: |
      **Una esfera partida por la mitad entre dos fluidos.**

      El plano de separación pasa por el ecuador de la esfera, así que hay medio
      obturador en cada cámara y hay que tratar cada mitad con su fluido.

      **c) Lo horizontal, primero, porque es gratis.** La esfera es un cuerpo de
      revolución con el eje vertical: cualquier plano horizontal la corta en una
      circunferencia cuyos puntos están todos a la misma profundidad, así que
      los empujes horizontales se cancelan de dos en dos. **Resultante
      horizontal = 0**, sin calcular nada.

      **b) El empuje del agua, hacia abajo.**

      $$
      p_{tapa} = 1{,}011\cdot 10^{5} - 0{,}740\cdot 13{,}6\cdot 9800 = 2\,473\ \text{Pa}
      $$

      $$
      F_{\downarrow} = p_{tapa}A + \gamma_{w}\left(4A - \tfrac{2}{3}\pi R^{3}\right)
                     = 110{,}4\ \text{kN}
      $$

      **El empuje del aceite, hacia arriba.** Antes hay que leer el manómetro,
      recordando que kg/cm² es una presión con un kilopondio dentro:

      $$
      p_{ac} = 19\,600 + 4\cdot 9800\cdot 0{,}40 - 0{,}8\cdot 9800\cdot 0{,}15
             = 34\,104\ \text{Pa}
      $$

      $$
      F_{\uparrow} = p_{ac}A + \gamma_{ac}\,\tfrac{2}{3}\pi R^{3}
                   = 107{,}1 + 16{,}4 = 123{,}6\ \text{kN}
      $$

      **d) El peso.**

      $$
      W = 123{,}6 - 110{,}4 = 13{,}17\ \text{kN}
      \qquad
      \gamma = \frac{13\,162}{4{,}189} = 3\,143\ \text{N/m}^{3}
      $$

      **Lo que hay que llevarse, y es una sola idea con dos caras.**

      El casquete esférico **resta arriba y suma abajo**, y esos dos signos son
      la mitad del problema. Arriba, el agua carga sobre la media esfera el
      cilindro de 4 metros **menos** lo que la esfera ocupa: −20,5 kN. Abajo, el
      aceite empuja el casquete que sobresale hacia él: +16,4 kN. Entre las dos
      cosas hay casi 37 kN de diferencia debidos únicamente a **hacia dónde
      sobresale la esfera**, y son los que deciden el resultado.

      La regla que los unifica es siempre la misma: la fuerza vertical sobre una
      superficie curva es el peso del volumen de fluido comprendido entre esa
      superficie y su plano piezométrico. Lo único que cambia es si ese volumen
      queda por encima —empuja hacia abajo— o por debajo —empuja hacia arriba—.

      Y una nota sobre las presiones. La cámara de agua está a 1,011 bar
      **absolutos**, es decir apenas 0,25 mca por encima de la atmosférica: el
      dato viene así para obligarte a restar la atmosférica. Si lo usas tal
      cual, la fuerza sale casi cuatro veces mayor y el problema entero se cae.
