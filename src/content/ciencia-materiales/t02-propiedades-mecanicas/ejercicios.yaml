41.2"/><circle class="cm2-d229-o" cx="199.2" cy="54.9" r="4.4"/><text class="cm2-d229-l" x="207.2" y="74.9" text-anchor="start" fill="var(--flag)">σy = 744 MPa</text><path class="cm2-d229-g" d="M74.7 55.5L92.2 126.3"/><text class="cm2-d229-n" x="62" y="52" text-anchor="start" fill="var(--d1)">E = 197,6 GPa</text><text class="cm2-d229-n" x="168" y="125.7" text-anchor="start" fill="var(--alt)">paralela desde 0,002</text></g>
          </svg>
        veredicto: >-
          Si en tu detalle la recta llega a unos 600 MPa antes de tumbarse y
          la paralela corta hacia 744, lo demás son lecturas. Si tu recta sale
          mucho más tendida, mira si has dibujado el aluminio de las tablas en
          vez del ensayo: la curva es la de los datos.

      - tipo: justificar
        pregunta: Ordena la lectura del ensayo. Una pieza es falsa.
        piezas:
          - texto: >-
              Hasta 76 200 N el cociente entre tensión y deformación se
              mantiene en unos 198 GPa: ese es el tramo elástico.
          - texto: >-
              La paralela por 0,002 corta la curva entre 92 700 y 102 500 N,
              a unos 744 MPa.
          - texto: >-
              La carga máxima, 160 400 N, da 1246,5 MPa, y la probeta rompe
              tras alargarse un 11,5 %.
          - texto: >-
              Con el límite elástico y el módulo, la resiliencia es
              $\sigma_y^{2}/2E = 1{,}40\ \text{MPa}$.
          - texto: >-
              El módulo elástico vale 70 GPa, porque la probeta es de
              aluminio.
            trampa: true
            mensaje: |
              El módulo se lee del ensayo, no del nombre del material. Estos
              datos dan 198 GPa, y ese número es el que manda: es justo lo que
              el apartado b) pide calcular.
    resolucion: |
      **La curva.** Longitudes entre mil, $l_0 = 50{,}80\ \text{mm}$ y
      $A_0 = \pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$. Algunos puntos:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 76200 | 592,2 | 0,0030 |
      | 92700 | 720,4 | 0,0050 |
      | 102500 | 796,6 | 0,0075 |
      | 128300 | 997,1 | 0,020 |
      | 160400 | 1246,5 | 0,070 |
      | 124700 | 969,1 | 0,115 |

      **b) Módulo.** Recto hasta 76 200 N: $E = 197{,}6\ \text{GPa}$.

      **c) Límite elástico.** La paralela por 0,002 corta la curva a
      $\sigma_y = 744\ \text{MPa}$.

      **d) Resistencia a tracción.** $160\,400/128{,}7 = 1246{,}5\ \text{MPa}$.

      **e) Ductilidad.** $(56{,}642 - 50{,}80)/50{,}80 = 11{,}5\ \%$, tomando
      el último punto medido como la rotura.

      **f) Resiliencia.** $744^{2}/(2\cdot 197\,600) = 1{,}40\ \text{MPa}$.

      > **Estos datos no son de un aluminio.** Una aleación de aluminio tiene
      > unos 70 GPa de módulo y una resistencia de unos cientos de MPa. Aquí
      > salen 198 GPa y 1250 MPa, que son las cifras de un acero de alta
      > resistencia: parecen los datos de un ensayo de acero con el nombre del
      > material cambiado. El ejercicio pide calcular con la tabla, y así se
      > ha hecho; el aviso es para que el número no te haga dudar de tu cuenta.

      **Lo que hay que llevarse.** Las propiedades se leen del ensayo, no del
      nombre de la probeta. Si el módulo que sale no se parece al de las
      tablas, primero se revisan las unidades —aquí, el $10^{3}$ del
      encabezado—, y si están bien, manda el dato.
  - id: ejcm2-col230-la-huella-de-la-bola-brinell
    titulo: La huella de la bola Brinell, y al revés
    fuente: >-
      Ejercicio 2.30 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un penetrador Brinnel de $10\ \text{mm}$ de diámetro crea una huella de
      $2{,}5\ \text{mm}$ sobre un acero al aplicarle una carga de
      $1000\ \text{kg}$. Calcula la dureza Brinell de dicho acero. ¿Cuál será
      el diámetro de la huella si al aplicarle una carga de $500\ \text{kg}$
      presenta una dureza Brinell de $300$?

      $$
      HB = \frac{2P}{\pi D\left(D - \sqrt{D^{2} - d^{2}}\right)}
      $$

      - $P$: carga aplicada (kg)
      - $D$: diámetro de la punta (mm)
      - $d$: diámetro de la huella (mm)
      - $h$: altura de la huella (mm)
    pide: La dureza Brinell del acero y el diámetro de la segunda huella.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la misma bola y la misma carga, ¿qué indica una huella más
          grande?
        opciones:
          - texto: >-
              Un material más blando: la carga se reparte sobre más superficie
              y HB baja
            correcta: true
            mensaje: |
              Eso es. HB es la carga dividida entre la superficie del casquete
              que deja la bola. Más huella con la misma carga es menos
              resistencia a ser penetrado.
          - texto: >-
              Un material más duro, porque ha aguantado una huella mayor
            mensaje: |
              Al revés. Un material duro se deja penetrar poco: la bola apenas
              entra y la huella es pequeña.
          - texto: >-
              Nada: la dureza depende solo de la carga aplicada
            mensaje: |
              La carga es la misma en los dos casos; lo que cambia es la
              huella, y la dureza sale precisamente de compararlas: carga
              entre superficie.

      - tipo: calcular
        titulo: La dureza del acero
        pregunta: |
          ¿Cuánto vale la dureza Brinell del acero con la huella de
          $2{,}5\ \text{mm}$?
        respuesta:
          tipo: numero
          valor: '200.5'
          tolerancia: 1
          formato: un número, sin unidades
        distractores:
          - valor: '100.2'
            mensaje: |
              Te has dejado el 2 del numerador. La fórmula del tema es
              $2P$ entre $\pi D(D - \sqrt{D^{2}-d^{2}})$.
          - valor: '629.8'
            mensaje: |
              Te has dejado el $\pi$ del denominador. Sin él la superficie de
              la huella sale tres veces menor y la dureza tres veces mayor.
        pista: |
          Empieza por la raíz: $\sqrt{10^{2} - 2{,}5^{2}} = \sqrt{93{,}75}$.
        desarrollo: |
          $$
          \sqrt{100 - 6{,}25} = 9{,}6825
          \qquad
          D - \sqrt{D^{2}-d^{2}} = 0{,}3175
          $$

          $$
          HB = \frac{2\cdot 1000}{\pi\cdot 10\cdot 0{,}3175} = 200{,}5
          $$

      - tipo: calcular
        titulo: La segunda huella
        pregunta: |
          Con $500\ \text{kg}$ y una dureza de $300$, ¿qué diámetro tiene la
          huella?
        respuesta:
          tipo: magnitud
          valor: '1.453 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '2.11 mm'
            mensaje: |
              Te has quedado en $d^{2} = 2{,}11$. Falta la raíz: la huella
              mide $\sqrt{2{,}11} = 1{,}45\ \text{mm}$.
          - valor: '1.03 mm'
            mensaje: |
              Te has dejado el 2 de $2P$ al despejar. El paréntesis vale
              $2P/(\pi D\,HB) = 0{,}1061$, no la mitad.
          - valor: '0.835 mm'
            mensaje: |
              Has escalado la primera huella en proporción a la carga y a la
              dureza. La relación no es lineal: la superficie del casquete
              crece aproximadamente con $d^{2}$, no con $d$.
        pista: |
          Despeja por capas: primero $D - \sqrt{D^{2}-d^{2}} = 2P/(\pi D\,HB)$,
          luego la raíz y al final $d$.
        desarrollo: |
          $$
          D - \sqrt{D^{2}-d^{2}} = \frac{2\cdot 500}{\pi\cdot 10\cdot 300}
          = 0{,}1061
          $$

          $$
          \sqrt{100 - d^{2}} = 9{,}8939
          \qquad
          100 - d^{2} = 97{,}889
          \qquad
          d = \sqrt{2{,}111} = 1{,}45\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena lo que dice cada cifra. Una pieza es falsa.
        piezas:
          - texto: >-
              HB es la carga entre la superficie del casquete que deja la
              bola, y por eso una huella mayor da menos dureza.
          - texto: >-
              Con 1000 kg y una huella de 2,5 mm, el acero tiene HB = 200,5.
          - texto: >-
              Para que 500 kg den HB = 300, el casquete tiene que medir
              500/300 = 1,67 mm², y eso es una huella de 1,45 mm.
          - texto: >-
              Si fuera el mismo acero de antes, con la mitad de carga la
              dureza saldría la mitad, unos 100.
            trampa: true
            mensaje: |
              La dureza es una propiedad del material, no de la carga. Con la
              mitad de carga el mismo acero dejaría una huella más pequeña y
              la dureza seguiría rondando 200. Que salga 300 dice que el
              segundo material es más duro.
    resolucion: |
      **La dureza del acero.**

      $$
      HB = \frac{2\cdot 1000}{\pi\cdot 10\left(10 - \sqrt{100 - 6{,}25}\right)}
      = \frac{2000}{\pi\cdot 10\cdot 0{,}3175} = 200{,}5
      $$

      **La segunda huella.** Se despeja por capas:

      $$
      10 - \sqrt{100 - d^{2}} = \frac{2\cdot 500}{\pi\cdot 10\cdot 300} = 0{,}1061
      $$

      $$
      d^{2} = 100 - 9{,}8939^{2} = 2{,}111
      \qquad
      d = 1{,}45\ \text{mm}
      $$

      Son los dos valores del listado.

      **Lo que hay que llevarse.** La fórmula es carga entre superficie de la
      huella, escrita con los dos diámetros. Al despejar $d$ conviene ir por
      capas —paréntesis, raíz, cuadrado— porque es donde se pierden el 2 y la
      raíz. Y la dureza no cambia con la carga: si cambia, es que ha cambiado
      el material.

  - id: ejcm2-teoria-ductilidad-frente-a-tenacidad
    titulo: Ductilidad y tenacidad, escritas y separadas
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre las diapositivas 38 a 41 y
      55 del Tema 2, «Propiedades mecánicas de los materiales» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. No es de examen ni del listado: el
      material del curso no trae ningún examen de teoría. La cuenta usa el
      material del problema 2.16.
    nivel: practica
    enunciado: |
      Una pregunta de teoría, para contestar **por escrito**, en papel y sin
      mirar el tema:

      **«Define la ductilidad y la tenacidad de un material, di cómo se mide
      cada una en un ensayo de tracción y explica por qué no son la misma
      propiedad.»**

      Escríbela de verdad antes de empezar los pasos: la pregunta de
      reconocimiento y la cuenta dan pistas de lo que tiene que aparecer.
      Distinguir las dos palabras cuando te las dan y explicar la diferencia
      desde cero son dos habilidades distintas, y una pregunta de teoría
      escrita pide la segunda.
    pide: La respuesta escrita, y después la comparación con la rúbrica.
    pasos:
      - tipo: reconocer
        pregunta: |
          Dos curvas tensión-deformación rompen a la misma deformación, pero
          una va todo el ensayo al doble de tensión que la otra. ¿Qué tienen
          igual?
        opciones:
          - texto: La ductilidad, y solo la ductilidad
            correcta: true
            mensaje: |
              Eso es. La ductilidad es cuánto se deforma plásticamente hasta
              romper, y las dos rompen en el mismo sitio. La tenacidad es el
              área bajo la curva, y la de arriba encierra el doble. Son las
              curvas 2 y 3 de la diapositiva 40: casi igual de largas, «muy
              tenaz» la alta y «tenaz» la baja.
          - texto: La tenacidad, porque rompen con la misma deformación
            mensaje: |
              Es la confusión que la diapositiva 40 avisa con todas las letras:
              «no confundir ductilidad y tenacidad». Romper con la misma
              deformación iguala la longitud de las curvas, no su área, y la
              tenacidad es el área.
          - texto: Las dos, porque ductilidad y tenacidad van siempre juntas
            mensaje: |
              No van juntas: la diapositiva 41 lo enseña con los composites,
              de ductilidad media y tenacidad alta. Aquí la ductilidad es la
              misma y el área, el doble.
          - texto: Ninguna, porque al ir a otra tensión cambia todo
            mensaje: |
              La tensión cambia la altura de la curva, no dónde acaba. La
              ductilidad se lee en el eje de deformaciones, y ahí las dos
              terminan en el mismo punto.

      - tipo: calcular
        titulo: La tenacidad del material del 2.16
        pregunta: |
          El material hipotético del problema 2.16 sube en recta hasta
          $100\ \text{MPa}$, con $\varepsilon_y = 0{,}00143$, y después fluye
          a $100\ \text{MPa}$ hasta romper en $\varepsilon = 0{,}0114$. ¿Cuánto
          vale su tenacidad, el área bajo la curva hasta la rotura?
        respuesta:
          tipo: magnitud
          valor: '1.07 MPa'
          tolerancia: 0.02
          formato: una energía por unidad de volumen, en MPa y con la unidad
        distractores:
          - valor: '0.0714 MPa'
            mensaje: |
              Esa es la resiliencia, el triángulo bajo el tramo elástico,
              $\sigma_y^{2}/2E$. La tenacidad llega hasta la rotura: falta
              sumar el rectángulo de la meseta, que es casi toda el área.
          - valor: '1.14 MPa'
            mensaje: |
              Has multiplicado 100 MPa por la deformación de rotura, como si
              la curva fuera un rectángulo desde el origen. El primer tramo es
              un triángulo: sobra la mitad de $100\cdot 0{,}00143$.
          - valor: '0.997 MPa'
            mensaje: |
              Has contado solo el rectángulo de la meseta,
              $100\cdot(0{,}0114 - 0{,}00143)$. Falta el triángulo del tramo
              elástico, $\tfrac12\cdot 100\cdot 0{,}00143 = 0{,}07$: es poco,
              pero es parte del área hasta la rotura.
          - valor: '0.571 MPa'
            mensaje: |
              Has tomado el área entera como un triángulo,
              $\tfrac12\cdot 100\cdot 0{,}0114$. Solo es triángulo el tramo
              elástico; la meseta es un rectángulo.
        pista: |
          El área son dos piezas: el triángulo del tramo elástico y el
          rectángulo de la meseta, de base $0{,}0114 - 0{,}00143$ y altura
          $100\ \text{MPa}$.
        desarrollo: |
          $$
          U_T = \tfrac12\cdot 100\cdot 0{,}00143
          + 100\cdot(0{,}0114 - 0{,}00143)
          = 0{,}07 + 1{,}00 = 1{,}07\ \text{MPa}
          $$

          Un MPa por una deformación, que no tiene unidad, es un MPa, y
          $1\ \text{MPa} = 1\ \text{MJ/m}^{3}$: la probeta absorbe 1,07 MJ por
          metro cúbico hasta romper. La resiliencia, el triángulo, es solo
          0,07, un 7 % de la tenacidad. Y si todas las tensiones de esta curva
          fueran la mitad, rompería en el mismo 0,0114 —la misma ductilidad—
          con la mitad de área: la mitad de tenacidad.

      - tipo: redactar
        que: definicion
        consigna: |
          Contesta por escrito, en ocho o diez líneas y sin mirar el tema:

          **«Define la ductilidad y la tenacidad de un material, di cómo se
          mide cada una en un ensayo de tracción y explica por qué no son la
          misma propiedad.»**

          Si te ayuda, acompáñalo de un croquis con dos curvas; la explicación
          tiene que entenderse igual sin él.
        rubrica:
          - punto: >-
              Defines la ductilidad como la deformación plástica que el
              material soporta hasta la fractura
            porque: >-
              Es la definición de la diapositiva 38: «grado de deformación
              plástica que soporta un material hasta el punto F». Decir «lo
              que se estira» a secas se queda corto: la definición habla de
              deformación plástica y de llegar hasta la rotura.
            minimo: true
          - punto: >-
              Dices cómo se mide la ductilidad: con el alargamiento relativo o
              con la reducción de área, y su fórmula
            porque: >-
              Son las dos medidas de la diapositiva 38,
              $\%EL = (l_f - l_0)/l_0\cdot 100$ y
              $\%AR = (A_0 - A_f)/A_0\cdot 100$. La pregunta pide cómo se mide,
              y una definición sin su medida se queda en una palabra.
            minimo: true
          - punto: >-
              Defines la tenacidad como la energía total que absorbe el
              material hasta la fractura
            porque: >-
              Diapositiva 40, casi palabra por palabra: «energía total que
              puede absorber el material hasta fractura». La palabra que no
              puede faltar es «energía»: la ductilidad es una deformación y la
              tenacidad una energía, y ahí empieza la diferencia.
            minimo: true
          - punto: >-
              Dices que en el ensayo de tracción la tenacidad es el área bajo
              la curva tensión-deformación hasta la rotura
            porque: >-
              Es cómo se mide en tracción (diapositiva 40); esa diapositiva y
              la 53 nombran también los ensayos de impacto. Sin el área no se
              puede explicar la diferencia: la ductilidad se lee en el eje
              horizontal y la tenacidad, en el área.
            minimo: true
          - punto: >-
              Explicas la diferencia con un caso: dos curvas que rompen a la
              misma deformación y a distinta tensión tienen la misma ductilidad
              y distinta tenacidad
            porque: >-
              Es la figura de la diapositiva 40, con sus curvas 2 y 3: casi
              igual de largas, «muy tenaz» la alta y «tenaz» la baja. «Son
              distintas» lo puede escribir cualquiera; el caso de las dos
              curvas es lo que demuestra que lo has entendido.
            minimo: true
          - punto: >-
              Dices que la tenacidad depende a la vez de a qué tensión se
              deforma el material y de cuánto se deforma
            porque: >-
              El área crece con lo alta que va la curva y con lo lejos que
              llega. La curva 1 de la diapositiva 40, empinada y corta, sube
              más que las otras dos y es la «poco tenaz»; y una curva muy larga
              pegada al eje también encierra poca área.
          - punto: >-
              Nombras el ejemplo de los composites: ductilidad media y
              tenacidad alta
            porque: >-
              Es la frase con que cierra la diapositiva 41, y es una familia
              real de materiales que separa las dos propiedades. No es
              imprescindible si ya has dado el caso de las dos curvas, pero lo
              refuerza.
          - punto: >-
              Si mencionas la resiliencia, la distingues: es el área solo hasta
              el límite elástico
            porque: >-
              Diapositivas 39 y 55. En el material del 2.16 la resiliencia es
              0,07 MPa y la tenacidad 1,07: confundirlas es equivocarse en un
              factor quince.
        veredicto: |
          Con los cinco mínimos la respuesta está completa y cabe en diez
          líneas. Si te falta el caso de las dos curvas, lo que has escrito son
          dos definiciones una detrás de otra, y la pregunta pedía también por
          qué no son lo mismo.

      - tipo: justificar
        pregunta: Ordena el argumento de la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La ductilidad es la deformación plástica que soporta el material
              hasta romper, y se mide con el alargamiento relativo o con la
              reducción de área.
          - texto: >-
              La tenacidad es la energía total que absorbe hasta romper; en el
              ensayo de tracción, el área bajo la curva hasta la fractura.
          - texto: >-
              Dos curvas que rompen a la misma deformación tienen la misma
              ductilidad, pero la que va a más tensión encierra más área y es
              más tenaz.
          - texto: >-
              Por eso la tenacidad depende a la vez de la tensión y de la
              deformación, y un composite puede tener ductilidad media y
              tenacidad alta.
          - texto: >-
              Como la tenacidad es un área, de dos materiales el más dúctil es
              siempre el más tenaz, porque su curva llega más lejos.
            trampa: true
            mensaje: |
              Llegar más lejos alarga la base del área, pero la altura cuenta
              igual. El material del 2.16 encierra 1,07 MPa; uno el doble de
              dúctil con la misma forma de curva y a un cuarto de tensión
              encerraría la mitad. Es la confusión que la diapositiva 40 avisa.
    resolucion: |
      **La pregunta de reconocimiento.** Dos curvas que rompen a la misma
      deformación tienen la misma ductilidad; si una va al doble de tensión,
      encierra el doble de área y es el doble de tenaz.

      **La cuenta.** La curva del 2.16 es un triángulo y un rectángulo:

      $$
      U_T = \tfrac12\cdot 100\cdot 0{,}00143 + 100\cdot(0{,}0114 - 0{,}00143)
      = 1{,}07\ \text{MPa} = 1{,}07\ \text{MJ/m}^{3}
      $$

      De eso, la resiliencia —el triángulo— es 0,07 MPa.

      **La respuesta escrita, como se puede redactar.**

      > La **ductilidad** es el grado de deformación plástica que un material
      > soporta hasta la fractura. Se mide con el alargamiento relativo,
      > $\%EL = (l_f - l_0)/l_0\cdot 100$, o con la reducción de área,
      > $\%AR = (A_0 - A_f)/A_0\cdot 100$. La **tenacidad** es la energía
      > total que absorbe hasta la fractura; en el ensayo de tracción es el
      > área bajo la curva tensión-deformación hasta la rotura, y también se
      > mide con ensayos de impacto. No son lo mismo: la ductilidad es una
      > deformación y se lee en el eje horizontal, y la tenacidad es un área,
      > que depende también de a qué tensión se deforma el material. Dos
      > curvas que rompen a la misma deformación tienen la misma ductilidad,
      > pero la que va a más tensión es más tenaz. La tenacidad depende a la
      > vez de a qué tensión se deforma el material y de cuánto; los
      > composites, por ejemplo, tienen ductilidad media y tenacidad alta.

      Son nueve líneas y están los cinco mínimos, más dos de los puntos que
      suman.

      > **Lo que enseña.** Las dos palabras se confunden porque las dos
      > crecen cuando la curva es larga. La tenacidad crece además con la
      > altura de la curva, y eso es lo que el caso de las dos curvas hace
      > visible.

  - id: ejcm2-teoria-la-tension-real-hasta-la-estriccion
    titulo: Por qué la tensión real con σ(1+ε) solo vale hasta el cuello
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre las diapositivas 37, 44 y 45
      del Tema 2, «Propiedades mecánicas de los materiales» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. No es de examen ni del listado: el
      material del curso no trae ningún examen de teoría. Las cuentas usan los
      datos del problema 2.28.
    nivel: practica
    enunciado: |
      Una pregunta de teoría, para contestar **por escrito**, en papel y sin
      mirar el tema:

      **«Deduce la relación $\sigma_T = \sigma\,(1+\varepsilon)$ entre la
      tensión real y la nominal, di qué hipótesis usa y explica hasta qué
      punto del ensayo de tracción se puede aplicar.»**

      Las diapositivas dan la fórmula con su hipótesis y no escriben hasta
      dónde vale; su figura de la 45 lo apunta al marcar M′ en la curva real,
      el punto que corresponde a la carga máxima M. El problema 2.28 lo cobra:
      en la fractura del cobre la fórmula da 577 MPa y la tensión real son
      715.

      Escríbela antes de empezar los pasos: la pregunta de reconocimiento y
      las cuentas dan pistas de lo que tiene que aparecer.
    pide: La deducción escrita, con su hipótesis y su límite, y después la comparación con la rúbrica.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para pasar de $\sigma_T = F/A_i$ a $\sigma\,(1+\varepsilon)$ se usa
          $A_i\,l_i = A_0\,l_0$. Además de que el volumen no cambia, ¿qué hay
          que suponer para que esa $A_i$ sea la sección de la probeta en
          cualquier punto?
        opciones:
          - texto: >-
              Que la probeta se deforma por igual en toda su longitud, con la
              misma sección en todas partes
            correcta: true
            mensaje: |
              Eso es. $A_0 l_0/l_i$ es la sección **media** de la probeta, y
              es la de verdad mientras todas las secciones son iguales. Eso se
              cumple hasta la carga máxima: la diapositiva 37 dice que hasta M
              la deformación es uniforme.
          - texto: Que el material sigue en la zona elástica
            mensaje: |
              Al revés: la fórmula sirve sobre todo en la zona plástica, donde
              la sección se estrecha de verdad y la diferencia entre la real y
              la nominal se nota. En la zona elástica las dos casi coinciden.
          - texto: Que la carga no baja durante el ensayo
            mensaje: |
              Tienta, porque en tracción la carga empieza a bajar justo en M,
              a la vez que aparece el cuello (diapositivas 37 y 44). Pero la
              bajada es una consecuencia del cuello, no la hipótesis de la
              fórmula: lo que la fórmula necesita es que todas las secciones
              sean iguales, y eso es lo que el cuello rompe.
          - texto: Nada más, porque con el volumen constante vale hasta la rotura
            mensaje: |
              El volumen se sigue conservando en el cuello, y aun así la
              fórmula falla. $A_0 l_0/l_i$ es la sección media, y desde la
              estricción la del cuello es mucho menor: en la rotura del 2.28,
              70,9 mm² frente a 87,9.

      - tipo: calcular
        titulo: La tensión real en la carga máxima
        pregunta: |
          En la carga máxima del 2.28 la probeta todavía se deforma por igual:
          $\sigma = 415{,}5\ \text{MPa}$ y $\varepsilon = 0{,}25$. ¿Cuánto vale
          ahí la tensión real?
        respuesta:
          tipo: magnitud
          valor: '519 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '415.5 MPa'
            mensaje: |
              Esa es la nominal, la del enunciado. La real divide la misma
              carga entre la sección de ese instante, que ya es un 20 % menor
              que la inicial: tiene que salir mayor.
          - valor: '332 MPa'
            mensaje: |
              Has dividido entre $(1+\varepsilon)$ en vez de multiplicar. La
              sección se estrecha al estirar, así que en tracción la tensión
              real es **mayor** que la nominal.
          - valor: '715 MPa'
            mensaje: |
              Esa es la tensión real en la **rotura**, con la sección del
              cuello. En la carga máxima todavía no hay cuello, y la sección
              es la media, $A_0/1{,}25$.
        pista: |
          Hasta la carga máxima vale $\sigma_T = \sigma\,(1+\varepsilon)$.
        desarrollo: |
          $$
          \sigma_T = 415{,}5\cdot(1 + 0{,}25) = 519\ \text{MPa}
          $$

          Con el área sale lo mismo, que es la prueba de que aquí la fórmula
          vale: la sección en ese instante es
          $A_0/1{,}25 = 132{,}7/1{,}25 = 106{,}2\ \text{mm}^{2}$, y
          $55\,150/106{,}2 = 519\ \text{MPa}$.

      - tipo: calcular
        titulo: La sección que supone la fórmula en la rotura
        pregunta: |
          En la rotura del 2.28, $\varepsilon = 0{,}51$ y la sección medida en
          el cuello es $70{,}9\ \text{mm}^{2}$. ¿Qué sección da por hecha la
          fórmula $\sigma\,(1+\varepsilon)$, es decir, cuánto vale
          $A_0/(1+\varepsilon)$?
        respuesta:
          tipo: magnitud
          valor: '87.9 mm2'
          tolerancia: 0.02
          formato: una sección, con su unidad
        distractores:
          - valor: '70.9 mm2'
            mensaje: |
              Esa es la que se **mide** en el cuello. La pregunta es la que da
              por hecha la fórmula: la sección media de la probeta, que ya no
              es la del cuello.
          - valor: '200 mm2'
            mensaje: |
              Has multiplicado por $(1+\varepsilon)$. Al estirar, la sección se
              estrecha: con el volumen constante, $A = A_0\,l_0/l$, y eso es
              dividir.
        pista: |
          $A_i = A_0\,l_0/l_i = A_0/(1+\varepsilon)$, con
          $A_0 = 132{,}7\ \text{mm}^{2}$.
        desarrollo: |
          $$
          A = \frac{132{,}7}{1{,}51} = 87{,}9\ \text{mm}^{2}
          $$

          La fórmula supone 87,9 mm² y en el cuello quedan 70,9: da por hecha
          un 24 % más de sección de la que hay. Con esa sección de más, la
          tensión sale corta,
          $50\,700/87{,}9 = 577\ \text{MPa}$ frente a
          $50\,700/70{,}9 = 715\ \text{MPa}$, un 19 % por debajo.

      - tipo: redactar
        que: deduccion
        consigna: |
          Contesta por escrito, en diez o doce líneas y sin mirar el tema:

          **«Deduce la relación $\sigma_T = \sigma\,(1+\varepsilon)$ entre la
          tensión real y la nominal, di qué hipótesis usa y explica hasta qué
          punto del ensayo de tracción se puede aplicar.»**
        rubrica:
          - punto: >-
              Defines la tensión real con la sección instantánea,
              $\sigma_T = F/A_i$, frente a la nominal, $\sigma = F/A_0$
            porque: >-
              Es el punto de partida de la diapositiva 45, y la razón de que
              exista la tensión real: la nominal divide entre una sección que
              ya no existe (diapositiva 44).
            minimo: true
          - punto: >-
              Escribes la hipótesis: el volumen no cambia,
              $A_i\,l_i = A_0\,l_0$
            porque: >-
              Es la única hipótesis que la diapositiva 45 escribe, «si, a lo
              largo del ensayo, ΔV = 0». Sin ella no hay forma de sacar la
              sección de la longitud.
            minimo: true
          - punto: >-
              Haces la cuenta: $A_i = A_0\,l_0/l_i$ y
              $l_i/l_0 = 1+\varepsilon$, así que
              $\sigma_T = \dfrac{F}{A_0}\,\dfrac{l_i}{l_0} = \sigma\,(1+\varepsilon)$
            porque: >-
              Es la deducción que pide la pregunta, y son dos líneas. Escribir
              la fórmula sin la cuenta es contestar a otra pregunta: la de
              recordarla.
            minimo: true
          - punto: >-
              Dices que $A_0\,l_0/l_i$ es la sección media, y que solo es la
              sección real si la probeta se deforma por igual en toda su
              longitud
            porque: >-
              Es la hipótesis que la fórmula usa sin escribirla. $l_i$ es la
              longitud de toda la zona medida, así que la cuenta reparte el
              estrechamiento por igual entre todas las secciones.
            minimo: true
          - punto: >-
              Dices que eso se cumple hasta la carga máxima, M, y deja de
              cumplirse con la estricción, cuando la deformación se concentra
              en el cuello
            porque: >-
              Diapositiva 37: «hasta llegar a M, toda la deformación de la
              probeta en su parte estrecha es uniforme», y «desde la formación
              de la estricción, toda la deformación se acumula en ese punto».
              Es la respuesta a «hasta qué punto», y las diapositivas no la
              escriben junto a la fórmula: hay que juntar la 37 y la 45. La
              figura de la 45 lo apunta sin decirlo, al marcar en la curva real
              el punto M′, que corresponde a M.
            minimo: true
          - punto: >-
              Aclaras que lo que falla no es la conservación del volumen sino
              la uniformidad
            porque: >-
              El volumen se sigue conservando en el cuello; lo que pasa es que
              la sección del cuello es mucho menor que la media, y la fórmula
              solo ve la media. Echarle la culpa al volumen es la pieza falsa
              del paso de ordenar de este ejercicio.
          - punto: >-
              Dices qué se hace pasada la estricción: medir la sección del
              cuello y calcular $\sigma_T = F/A_i$ con ella
            porque: >-
              Es lo que hace el 2.28 en la fractura, con la sección de 0,95 cm
              de diámetro, y salen 715 MPa. La definición de la diapositiva 45
              vale siempre; la que deja de valer es el atajo.
          - punto: >-
              Das el tamaño del error con un caso: en la rotura del cobre del
              2.28, $\sigma\,(1+\varepsilon)$ da 577 MPa y la real es 715
            porque: >-
              El número convierte la advertencia en un hecho, y el signo del
              error tiene sentido: la fórmula supone más sección de la que
              queda en el cuello, así que se queda corta, un 19 %.
        veredicto: |
          Los cinco mínimos son la deducción entera: definición, hipótesis,
          cuenta, la hipótesis escondida y su límite. Si has escrito la cuenta
          perfecta y no has dicho dónde deja de valer, tienes media pregunta, y
          es justo la mitad que el problema 2.28 cobra.

      - tipo: justificar
        pregunta: Ordena la deducción y su límite. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión real divide la carga entre la sección de cada
              instante: $\sigma_T = F/A_i$.
          - texto: >-
              Si el volumen no cambia, $A_i\,l_i = A_0\,l_0$, y la sección es
              $A_i = A_0/(1+\varepsilon)$.
          - texto: >-
              Sustituyendo, $\sigma_T = \sigma\,(1+\varepsilon)$.
          - texto: >-
              Esa $A_i$ es la sección media: coincide con la real mientras la
              deformación es uniforme, hasta la carga máxima.
          - texto: >-
              Desde la estricción la deformación se concentra en el cuello, su
              sección es menor que la media, y la tensión real se calcula con
              la sección medida.
          - texto: >-
              Desde la estricción la fórmula falla porque el cuello pierde
              volumen.
            trampa: true
            mensaje: |
              El volumen se conserva también en el cuello. Lo que falla es que
              la sección deja de ser la misma en toda la probeta: la cuenta usa
              la longitud total, que reparte el estrechamiento por igual, y el
              cuello se lleva casi todo.
    resolucion: |
      **La pregunta de reconocimiento.** Además del volumen constante, la
      fórmula supone que la probeta se deforma por igual en toda su longitud:
      $A_0\,l_0/l_i$ es la sección media, y solo es la real si todas las
      secciones son iguales.

      **Las dos cuentas, con el cobre del 2.28.** En la carga máxima la
      fórmula vale:

      $$
      \sigma_T = 415{,}5\cdot 1{,}25 = 519\ \text{MPa}
      \qquad
      \frac{55\,150}{132{,}7/1{,}25} = 519\ \text{MPa}
      $$

      En la rotura ya no: la fórmula supone una sección de
      $132{,}7/1{,}51 = 87{,}9\ \text{mm}^{2}$, y en el cuello quedan
      $70{,}9\ \text{mm}^{2}$. Por eso da 577 MPa donde la real es 715.

      **La respuesta escrita, como se puede redactar.**

      > La tensión nominal divide la carga entre la sección inicial,
      > $\sigma = F/A_0$; la **tensión real**, entre la sección de cada
      > instante, $\sigma_T = F/A_i$. Si el volumen no cambia durante el
      > ensayo, $A_i\,l_i = A_0\,l_0$, y como $l_i/l_0 = 1+\varepsilon$,
      > queda $\sigma_T = (F/A_0)\,(l_i/l_0) = \sigma\,(1+\varepsilon)$.
      > Pero $A_0\,l_0/l_i$ es la sección **media** de la probeta, porque
      > $l_i$ es la longitud de toda la zona medida. Coincide con la sección
      > real mientras la deformación es uniforme, y eso ocurre hasta la carga
      > máxima, M. Desde ahí aparece la estricción: la deformación se
      > concentra en el cuello, cuya sección es menor que la media, y la
      > fórmula se queda corta. El volumen se sigue conservando; lo que falla
      > es la uniformidad. Pasada la estricción, la tensión real se calcula
      > con la sección medida en el cuello. En la rotura de la probeta de
      > cobre del problema 2.28, la fórmula da 577 MPa y la real es 715.

      Cabe en doce líneas con la cuenta, y están los cinco mínimos y los tres
      puntos que suman.

      > **Lo que enseña.** Una fórmula deducida lleva sus hipótesis dentro
      > aunque no se escriban. Esta tiene dos: la que la diapositiva dice
      > —el volumen constante— y la que no dice —la deformación uniforme—.
      > La que falla es la segunda.

  - id: ejcm2-teoria-fractura-ductil-frente-a-fragil
    titulo: Una rotura dúctil y una frágil, contadas por escrito
    fuente: >-
      Ejercicio propio · Road to Ingeniería, sobre las diapositivas 27, 37, 38
      y 54 del Tema 2, «Propiedades mecánicas de los materiales» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. No es de examen ni del listado: el
      material del curso no trae ningún examen de teoría. La cuenta usa el
      material del problema 2.16.
    nivel: practica
    enunciado: |
      Una pregunta de teoría, para contestar **por escrito**, en papel y sin
      mirar el tema:

      **«Explica la diferencia entre una fractura dúctil y una fractura
      frágil: cómo se reconoce cada una en la curva tensión-deformación y en
      la probeta rota.»**

      Las diapositivas lo tratan en poco espacio —una definición, una cifra y
      los dibujos de probetas y curvas de la 38, y una frase sobre la fatiga
      en la 54—, y de ahí sale todo lo que la rúbrica pide.

      Escríbela antes de empezar los pasos: la pregunta de reconocimiento y
      la cuenta dan pistas de lo que tiene que aparecer.
    pide: La respuesta escrita, y después la comparación con la rúbrica.
    pasos:
      - tipo: reconocer
        pregunta: |
          En una probeta ya rota, ¿qué dice que la rotura ha sido dúctil?
        opciones:
          - texto: >-
              Un cuello: la probeta se ha estrechado antes de romper, y la
              sección de rotura es mucho menor que la inicial
            correcta: true
            mensaje: |
              Eso es. El cuello es deformación plástica que se ve a simple
              vista. La diapositiva 38 dibuja la probeta dúctil con su cuello,
              y la muy dúctil con el cuello estrechado casi hasta un punto.
          - texto: Una rotura limpia, sin estrechamiento
            mensaje: |
              Esa es la frágil. La diapositiva 38 la dibuja partida en dos
              trozos sin cuello, porque antes de romper apenas ha habido
              deformación plástica.
          - texto: Que haya roto a una tensión muy alta
            mensaje: |
              La tensión de rotura habla de resistencia, no de ductilidad. La
              curva c) del problema 2.23 es muy resistente y frágil a la vez.
          - texto: Que haya roto por fatiga
            mensaje: |
              Al contrario: la diapositiva 54 dice que la rotura por fatiga
              tiene aspecto frágil incluso en metales dúctiles, porque apenas
              lleva deformación plástica asociada.

      - tipo: calcular
        titulo: El alargamiento del material del 2.16
        pregunta: |
          El material del 2.16 fluye en una meseta siete veces más larga que
          su tramo elástico: rompe en $\varepsilon = 0{,}0114$ con la carga
          puesta, y al romper recupera la parte elástica, $0{,}00143$. ¿Qué
          alargamiento relativo, en porcentaje, se mediría en la probeta rota?
        respuesta:
          tipo: numero
          valor: '1.0'
          # Absoluta, de 0,94 a 1,06: la pregunta pide la probeta rota, sin
          # la parte elástica. Deja fuera 1,14, la deformación con la carga
          # puesta, igual que el 2.28 da por mala la longitud de 7,67 cm y
          # pide la final, 7,65.
          tolerancia: 0.06
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '0.01'
            mensaje: |
              Esa es la deformación, sin pasar a porcentaje. Multiplica por
              100: el alargamiento relativo se da en %.
          - valor: '1.14'
            mensaje: |
              Ese es el alargamiento con la carga todavía puesta,
              $0{,}0114\cdot 100$. Al romper desaparece la carga y la probeta
              recupera su parte elástica, $0{,}00143$: en la probeta rota queda
              la deformación plástica, un 1,0 %. Es la misma distinción que el
              2.28 hace entre los 7,67 cm de la rotura y los 7,65 de la
              longitud final.
          - valor: '8'
            mensaje: |
              Ese 8 es cuántas veces cabe la deformación elástica en la de
              rotura, no un porcentaje. En porcentaje,
              $0{,}0114\cdot 100 = 1{,}14$ con la carga puesta, y un 1 % en la
              probeta rota.
        pista: |
          En la probeta rota queda la deformación plástica,
          $0{,}0114 - 0{,}00143$. Pásala a porcentaje.
        desarrollo: |
          $$
          \%EL = (0{,}0114 - 0{,}00143)\cdot 100 = 1{,}0\ \%
          $$

          Con la carga puesta sería un 1,14 %; en la probeta rota ya no está la
          parte elástica, y queda el 1,0 %. Las dos cifras quedan muy por
          debajo del 5 %: **por el criterio de
          la diapositiva 38, este material es frágil**, aunque tenga una meseta
          plástica siete veces más larga que su tramo elástico. El 5 % no es
          poco: es diez veces la deformación elástica de la mayoría de los
          metales, que según la diapositiva 27 llega hasta 0,005.

      - tipo: redactar
        que: definicion
        consigna: |
          Contesta por escrito, en ocho o diez líneas y sin mirar el tema:

          **«Explica la diferencia entre una fractura dúctil y una fractura
          frágil: cómo se reconoce cada una en la curva tensión-deformación y
          en la probeta rota.»**

          Puedes acompañarlo de un croquis de las dos curvas y de las dos
          probetas rotas.
        rubrica:
          - punto: >-
              Dices que lo que las separa es la deformación plástica antes de
              romper: mucha en la dúctil, poca en la frágil
            porque: >-
              Es la definición de la diapositiva 38: el dúctil «soporta elevada
              deformación antes de la fractura» y el frágil, «poca deformación
              hasta rotura». Lo demás —la curva, la probeta— son consecuencias
              de esto.
            minimo: true
          - punto: >-
              Das el criterio numérico: frágil si el alargamiento relativo es
              menor del 5 %
            porque: >-
              Es la única cifra que da la diapositiva 38, y convierte «poca» en
              algo que se comprueba. Y no es poco: en la mayoría de los
              metales la deformación elástica llega hasta 0,005, un 0,5 %
              (diapositiva 27), así que un 5 % es diez veces eso.
            minimo: true
          - punto: >-
              Describes la curva del frágil: casi una recta hasta la rotura,
              sin zona plástica apreciable
            porque: >-
              Es el «gráfico material frágil» de la diapositiva 38: la recta
              elástica que termina en la fractura.
            minimo: true
          - punto: >-
              Describes la curva del dúctil: tras el tramo elástico, una zona
              plástica larga antes de romper
            porque: >-
              Es el «gráfico material dúctil» de la diapositiva 38 y la curva
              de la 37, que sube hasta el máximo M y baja hasta la rotura en F.
              La bajada es la estricción vista en la curva nominal.
            minimo: true
          - punto: >-
              Describes la probeta frágil: rota sin estrecharse, con la sección
              de rotura casi igual a la inicial
            porque: >-
              Así la dibuja la diapositiva 38: dos trozos sin cuello. Sin
              deformación plástica no hay estricción, y la reducción de área es
              casi nula.
            minimo: true
          - punto: >-
              Describes la probeta dúctil: con estricción, un cuello donde se
              ha concentrado la deformación y por donde rompe
            porque: >-
              Diapositivas 37 y 38: desde la carga máxima la deformación se
              acumula en el cuello y la fractura ocurre en él. La muy dúctil de
              la diapositiva 38 estrecha el cuello casi hasta un punto.
            minimo: true
          - punto: >-
              Dices que la frágil rompe sin aviso y la dúctil avisa, porque se
              deforma a la vista antes de romper
            porque: >-
              Es la consecuencia práctica de la diferencia. La diapositiva 54
              la dice para la fatiga: rompe
              «sin previo aviso» y con «aspecto frágil», porque apenas hay
              deformación plástica.
          - punto: >-
              Avisas de que una rotura por fatiga parece frágil aunque el metal
              sea dúctil
            porque: >-
              Diapositiva 54, casi con esas palabras. El aspecto de la rotura
              dice cómo ha roto la pieza, no de qué material es.
        veredicto: |
          Con los seis mínimos tienes la definición, la cifra y las dos formas
          de reconocerla: en la curva y en la probeta. Si solo has contado las
          curvas, te falta la mitad que se ve sin ensayo, la probeta rota.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que separa las dos fracturas es la deformación plástica antes
              de romper: mucha en la dúctil y poca en la frágil, por debajo del
              5 % de alargamiento.
          - texto: >-
              En la curva, la frágil es casi una recta que acaba en la rotura,
              y la dúctil sigue una zona plástica larga.
          - texto: >-
              En la probeta, la frágil rompe sin estrecharse y la dúctil forma
              un cuello y rompe por él.
          - texto: >-
              Por eso la dúctil avisa antes de romper y la frágil no, y una
              rotura por fatiga parece frágil aunque el metal sea dúctil.
          - texto: >-
              Una fractura es frágil cuando el material rompe a poca tensión, y
              dúctil cuando aguanta mucha.
            trampa: true
            mensaje: |
              Eso es resistencia, no ductilidad. La curva c) del problema 2.23
              es resistente y frágil: rompe muy alto, pero enseguida. Lo que
              clasifica la fractura es cuánto se deforma antes de romper, no a
              qué tensión.
    resolucion: |
      **La pregunta de reconocimiento.** Lo que delata una rotura dúctil en
      la probeta es el cuello: se ha estrechado antes de romper.

      **La cuenta.** El material del 2.16 rompe en 0,0114 y recupera 0,00143:

      $$
      \%EL = (0{,}0114 - 0{,}00143)\cdot 100 = 1{,}0\ \%
      $$

      Menos del 5 %: frágil por el criterio de la diapositiva 38, aunque su
      meseta plástica sea siete veces más larga que el tramo elástico.

      **La respuesta escrita, como se puede redactar.**

      > Lo que separa una fractura dúctil de una frágil es la **deformación
      > plástica** que hay antes de romper: mucha en la dúctil y poca en la
      > frágil, que se define como la que rompe con un alargamiento relativo
      > menor del **5 %**. En la curva tensión-deformación, el frágil es casi
      > una recta que termina en la rotura, sin zona plástica apreciable; el
      > dúctil, tras el tramo elástico, sigue una zona plástica larga, sube
      > hasta el máximo y baja hasta la rotura. En la probeta rota, la frágil
      > se parte sin estrecharse, con la sección de rotura casi igual a la
      > inicial; la dúctil forma una **estricción**, un cuello donde se
      > concentra la deformación y por donde rompe. Por eso la rotura dúctil
      > avisa, deformándose a la vista, y la frágil no. Y el aspecto engaña
      > con la fatiga: una pieza de metal dúctil rota por fatiga parece
      > frágil, porque apenas hay deformación plástica.

      Son diez líneas, con los seis mínimos y los dos puntos que suman.

      > **Lo que enseña.** Frágil no quiere decir débil ni «sin nada de
      > plasticidad»: quiere decir que rompe con poca deformación, y el
      > umbral del 5 % es diez veces la deformación elástica de la mayoría
      > de los metales.
