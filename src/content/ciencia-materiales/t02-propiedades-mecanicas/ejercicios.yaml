            <g transform="translate(0 238)"><text class="cm2-d216-l" x="2" y="-5" fill="var(--live)">c) y d) cargar y descargar</text><path class="cm2-d216-eje" d="M22 167.2L318 167.2M48.9 174L48.9 22"/><path class="cm2-d216-eje" d="M115.6 163.7L115.6 170.7"/><path class="cm2-d216-eje" d="M199.3 163.7L199.3 170.7"/><path class="cm2-d216-eje" d="M282.9 163.7L282.9 170.7"/><path class="cm2-d216-eje" d="M45.4 76.6L52.4 76.6"/><path class="cm2-d216-eje" d="M45.4 53.8L52.4 53.8"/><g class="cm2-d216-n"><text x="115.6" y="182.2" text-anchor="middle">0,00114</text><text x="199.3" y="182.2" text-anchor="middle">0,00257</text><text x="282.9" y="182.2" text-anchor="middle">0,004</text><text x="41.9" y="80.2" text-anchor="end">79,9</text><text x="41.9" y="57.4" text-anchor="end">100</text><text x="318" y="159.2" text-anchor="end">ε</text><text x="54.9" y="32">σ (MPa)</text></g><path class="cm2-d216-dproc" d="M48.9 167.2L115.6 76.6"/><path class="cm2-d216-c" d="M48.9 167.2L132.5 53.8L282.9 53.8"/><path class="cm2-d216-c" d="M282.9 53.8L209.4 153.6"/><path class="cm2-d216-punta" fill="var(--d1)" d="M209.4 153.6L218.1 148.7L211.5 143.8Z"/><path class="cm2-d216-c" d="M209.4 153.6L199.3 167.2"/><circle class="cm2-d216-pt" cx="282.9" cy="53.8" r="4"/><circle class="cm2-d216-pt" cx="199.3" cy="167.2" r="4"/><text class="cm2-d216-l" x="282.9" y="44.8" text-anchor="end" fill="var(--d1)">c) 251 mm</text><text class="cm2-d216-n" x="257.5" y="99.1" text-anchor="start" fill="var(--d1)">descarga</text><text class="cm2-d216-n" x="257.5" y="111.1" text-anchor="start" fill="var(--d1)">paralela</text><text class="cm2-d216-l" x="193.3" y="160.2" text-anchor="end" fill="var(--d1)">250,64 mm</text><path class="cm2-d216-g" d="M48.9 76.6L115.6 76.6"/><path class="cm2-d216-g" d="M115.6 167.2L115.6 76.6"/><circle class="cm2-d216-o2" cx="115.6" cy="76.6" r="4"/><text class="cm2-d216-l" x="123.6" y="80.6" text-anchor="start" fill="var(--alt)">d) sube y baja aquí</text></g>
          </svg>
        veredicto: >-
          Si la descarga del apartado c) te ha salido paralela a la recta y
          cortando el eje en 0,00257, tienes el problema entero en el dibujo:
          lo que se queda es la deformación total menos la elástica. Si te ha
          vuelto al origen, vuelve a la primera pregunta de este ejercicio
          antes de seguir.

      - tipo: justificar
        pregunta: Ordena por qué las dos barras terminan distinto. Una pieza es falsa.
        piezas:
          - texto: >-
              La barra del apartado d) trabaja a 79,9 MPa, por debajo del
              límite elástico: se alarga 0,29 mm y al descargar vuelve a medir
              250,00 mm.
          - texto: >-
              La del apartado c) llega a una deformación de 0,004, que está en
              la meseta plástica, a 100 MPa.
          - texto: >-
              Al descargarla recupera solo la parte elástica, 0,357 mm, y se
              queda en 250,64 mm.
          - texto: >-
              Por eso, en la estructura de un edificio el material tiene que
              trabajar en la región elástica, por debajo de 100 MPa.
          - texto: >-
              La barra del apartado c) vuelve a 250 mm, porque la descarga es
              siempre elástica.
            trampa: true
            mensaje: |
              La descarga es elástica, sí, y precisamente por eso solo
              devuelve la deformación elástica. La plástica, 0,643 mm, no la
              deshace ninguna descarga: por eso se llama permanente.
    resolucion: |
      **a) El diagrama.** Dos tramos rectos. Primero una recta desde el origen
      de pendiente $E = 70\ \text{GPa}$ hasta el límite elástico:

      $$
      \varepsilon_y = \frac{100}{70\,000} = 1{,}429\cdot 10^{-3}
      $$

      Después, una horizontal a $100\ \text{MPa}$ —la meseta plástica, que
      deforma sin aumentar la tensión— hasta la fractura, en
      $8\,\varepsilon_y = 0{,}0114$. Si se lee que el 8 cuenta solo la parte
      plástica, la fractura queda en $9\,\varepsilon_y = 0{,}0129$; no cambia
      ninguno de los apartados siguientes.

      **b) El edificio.** En la región elástica, el primer tramo, por debajo
      de $100\ \text{MPa}$. Una estructura que plastifica se queda deformada
      para siempre.

      **c) Estirada hasta 251 mm.** $\varepsilon = 1/250 = 0{,}004$, en plena
      meseta. Al descargar se baja por una recta paralela a la elástica y se
      recupera $\varepsilon_y$:

      $$
      l_f = 251 - 250\cdot 1{,}429\cdot 10^{-3} = 251 - 0{,}357
      = 250{,}64\ \text{mm}
      $$

      En el gráfico: subida por la recta, avance por la meseta hasta 0,004 y
      bajada paralela a la recta hasta $\varepsilon = 0{,}00257$ con tensión
      nula.

      > El listado da **250,65 mm** porque redondea $\varepsilon_y$ a
      > $0{,}0014$ antes de multiplicar: $250\cdot 0{,}0014 = 0{,}35$. Sin
      > redondear salen 250,64 mm. La diferencia son siete milésimas de
      > milímetro, y la casilla acepta los dos.

      **d) Con 4000 kg.** El peso es $39\,200\ \text{N}$ y la sección
      $490{,}9\ \text{mm}^{2}$:

      $$
      \sigma = 79{,}9\ \text{MPa} < 100
      \qquad
      \Delta l = \frac{79{,}9}{70\,000}\cdot 250 = 0{,}285\ \text{mm}
      $$

      Con carga mide $250{,}29\ \text{mm}$ y al descargar vuelve a
      $250{,}00\ \text{mm}$: en el gráfico sube y baja por la misma recta, sin
      llegar a la meseta.

      **Lo que hay que llevarse.** Deformación permanente = deformación total
      − deformación elástica recuperable. La descarga no devuelve la barra a
      su origen: la devuelve a su origen **menos** lo que ha plastificado.

  - id: ejcm2-col217-el-acero-y-los-otros-tres
    titulo: El acero, y qué harían los otros tres con la misma carga
    fuente: >-
      Ejercicio 2.17 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero de $160\ \text{mm}$ de longitud y
      $12\ \text{mm}$ de diámetro se deforma por efecto de una fuerza de
      $30000\ \text{N}$. ¿Cuál es el alargamiento producido? Calcula la
      reducción de diámetro. ¿Cuáles de los materiales de la tabla soportarán
      deformación plástica bajo la misma carga? ¿Cuáles mayor elongación que el
      acero? ¿Y mayor reducción en diámetro? Razona las respuestas.

      | Material | Módulo Young (MPa · $10^{3}$) | Lím. elástico (MPa) | Resist. máx. (MPa) | Coeficiente de Poisson |
      |---|---|---|---|---|
      | Aleación aluminio | 69 | 255 | 420 | 0,33 |
      | Aleación titanio | 107 | 827 | 862 | 0,36 |
      | Latón | 101 | 345 | 420 | 0,35 |
      | Acero | 205 | 550 | 700 | 0,27 |
    pide: El alargamiento y el cambio de diámetro de la probeta de acero, y qué materiales plastifican, se alargan más o estrechan más.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro probetas reciben la misma carga con la misma sección.
          ¿Qué hay que comparar para saber cuál se deforma plásticamente?
        opciones:
          - texto: >-
              La tensión, que es la misma para todas, con el límite elástico de
              cada material
            correcta: true
            mensaje: |
              Eso es. Misma fuerza y misma sección dan la misma tensión, así
              que se calcula una vez y se pone al lado de la columna del
              límite elástico.
          - texto: >-
              La tensión con la resistencia máxima de cada material
            mensaje: |
              La resistencia máxima marca cuándo empieza la estricción, no
              cuándo empieza la deformación permanente. Eso lo marca el
              límite elástico, bastante antes.
          - texto: >-
              El módulo de Young: plastifica el que lo tenga más bajo
            mensaje: |
              El módulo dice cuánto se estira en la zona elástica, no dónde
              acaba esa zona. El latón tiene casi el mismo módulo que el
              titanio y un límite elástico 2,4 veces menor.
          - texto: >-
              Los 30000 N directamente con el límite elástico
            mensaje: |
              El límite elástico es una tensión, en MPa, es decir en N/mm².
              Antes de comparar hay que dividir la carga entre la sección.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta?
        respuesta:
          tipo: magnitud
          valor: '265.3 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '66.3 MPa'
            mensaje: |
              Has usado los 12 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 6^{2}$, y con $\pi\cdot 12^{2}$ el área sale cuatro
              veces mayor y la tensión cuatro veces menor.
          - valor: '1061 MPa'
            mensaje: |
              Has tomado 6 mm como diámetro, es decir, has partido por dos
              dos veces. $A_0 = \pi d^{2}/4 = \pi\cdot 12^{2}/4 = 113{,}1\
              \text{mm}^{2}$.
        pista: |
          $\sigma = F/A_0$, con $A_0 = \pi d^{2}/4$ en mm² para que salga en
          MPa.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 12^{2}}{4} = 113{,}1\ \text{mm}^{2}
          \qquad
          \sigma = \frac{30\,000}{113{,}1} = 265{,}3\ \text{MPa}
          $$

          Por debajo de los 550 MPa del acero: su deformación es elástica y
          vale Hooke.

      - tipo: calcular
        titulo: El alargamiento del acero
        pregunta: |
          ¿Cuánto se alarga la probeta de acero?
        respuesta:
          tipo: magnitud
          valor: '0.207 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '207 mm'
            mensaje: |
              Te has dejado el $10^{3}$ del encabezado de la tabla. El módulo
              del acero son 205 000 MPa, no 205: con él la probeta se
              alargaría más que su propia longitud.
          - valor: '0.00129 mm'
            mensaje: |
              Esa es la deformación unitaria, $\varepsilon = \sigma/E$, que
              no tiene unidades. El alargamiento es esa deformación por la
              longitud inicial, 160 mm.
        pista: |
          $\varepsilon = \sigma/E$ y $\Delta l = \varepsilon\,l_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{265{,}3}{205\,000} = 1{,}294\cdot 10^{-3}
          \qquad
          \Delta l = 1{,}294\cdot 10^{-3}\cdot 160 = 0{,}207\ \text{mm}
          $$

      - tipo: calcular
        titulo: El cambio de diámetro
        pregunta: |
          ¿Cuánto cambia el diámetro? Dalo con su signo,
          $\Delta d = d_f - d_0$.
        respuesta:
          tipo: magnitud
          valor: '-0.00419 mm'
          tolerancia: 0.02
          formato: un cambio de longitud con su signo y su unidad
        distractores:
          - valor: '0.00419 mm'
            mensaje: |
              El número es bueno y el signo no. En tracción la probeta se
              alarga y **adelgaza**: el diámetro final es menor que el
              inicial, así que $\Delta d$ es negativo.
          - valor: '-0.0155 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has multiplicado la
              deformación axial por el diámetro tal cual. La transversal es
              $\varepsilon_x = -\nu\,\varepsilon_z$, un 27 % de la axial en el
              acero.
          - valor: '-0.0559 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud,
              160 mm. Es una deformación del **diámetro**: se multiplica por
              los 12 mm.
        pista: |
          $\varepsilon_x = -\nu\,\varepsilon_z$ y $\Delta d = \varepsilon_x\,d_0$.
        desarrollo: |
          $$
          \varepsilon_x = -0{,}27\cdot 1{,}294\cdot 10^{-3} = -3{,}494\cdot 10^{-4}
          $$

          $$
          \Delta d = -3{,}494\cdot 10^{-4}\cdot 12 = -4{,}19\cdot 10^{-3}\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación con los otros tres materiales. Una pieza es falsa.
        piezas:
          - texto: >-
              Las cuatro probetas soportan la misma tensión, 265,3 MPa, porque
              la carga y la sección son las mismas.
          - texto: >-
              Solo la aleación de aluminio tiene el límite elástico por debajo,
              255 MPa: es la única que se deforma plásticamente.
          - texto: >-
              Las otras tres tienen un módulo menor que el acero, así que con
              la misma tensión se alargan más.
          - texto: >-
              Y tienen además un coeficiente de Poisson mayor, así que su
              diámetro se reduce más.
          - texto: >-
              El titanio se alarga menos que el acero, porque su límite
              elástico es mucho mayor.
            trampa: true
            mensaje: |
              El límite elástico dice hasta dónde llega la zona elástica, no
              cuánto se estira dentro de ella. Eso lo dice el módulo: 107 GPa
              frente a 205. El titanio se alarga 0,397 mm, casi el doble que
              el acero.
    resolucion: |
      **La tensión, común a las cuatro.**

      $$
      A_0 = \frac{\pi\cdot 12^{2}}{4} = 113{,}1\ \text{mm}^{2}
      \qquad
      \sigma = \frac{30\,000}{113{,}1} = 265{,}3\ \text{MPa}
      $$

      **El acero.** Está por debajo de sus 550 MPa, así que vale Hooke:

      $$
      \varepsilon_z = \frac{265{,}3}{205\,000} = 1{,}294\cdot 10^{-3}
      \qquad
      \Delta l = \varepsilon_z\,l_0 = 0{,}207\ \text{mm}
      $$

      $$
      \Delta d = -\nu\,\varepsilon_z\,d_0 = -0{,}27\cdot 1{,}294\cdot 10^{-3}\cdot 12
      = -4{,}19\cdot 10^{-3}\ \text{mm}
      $$

      El listado da $-4{,}18\cdot 10^{-3}$; la diferencia es de redondeo, un
      0,3 %, y la casilla acepta los dos.

      **Los otros tres, con la misma tensión.**

      | material | ¿plastifica? | $\Delta l$ (mm) | $\Delta d$ (mm) |
      |---|---|---|---|
      | aluminio | sí, 265 > 255 | más de 0,615 | más de 0,0152 |
      | titanio | no | 0,397 | 0,0107 |
      | latón | no | 0,420 | 0,0110 |
      | acero | no | 0,207 | 0,0042 |

      Plastifica **la aleación de aluminio**. Se alargan más que el acero
      **todos**, porque todos tienen menor módulo; y el aluminio, que además
      plastifica, más todavía de lo que dice Hooke. Y estrechan más **todos**,
      porque a mayor alargamiento se suma un Poisson mayor.

      **Lo que hay que llevarse.** Tres columnas, tres preguntas: el límite
      elástico decide si plastifica, el módulo cuánto se alarga y el Poisson
      cuánto adelgaza. Mezclarlas es el error que este ejercicio busca.
  - id: ejcm2-col218-seis-metales-y-ninguno-vale
    titulo: Seis metales, y ninguno vale
    fuente: >-
      Ejercicio 2.18 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica metálica de $12{,}7\ \text{mm}$ de diámetro y
      $254\ \text{mm}$ de longitud presenta únicamente deformación elástica al
      ser sometida a una carga de tracción de $3{,}5\ \text{t}$. Si el
      alargamiento debe ser menor de $0{,}08\ \text{mm}$. ¿Cuáles de los
      metales de la tabla serían adecuados? Además, si la máxima disminución
      del diámetro que puede sufrir es de $1{,}2\times 10^{-3}\ \text{mm}$.
      ¿Cuáles de los metales de la tabla serían adecuados y por qué?

      | Metal | Límite elástico (MPa) | Módulo elástico (MPa · $10^{3}$) | Coeficiente de Poisson |
      |---|---|---|---|
      | Aleación aluminio | 250 | 70 | 0,33 |
      | Latón | 345 | 100 | 0,35 |
      | Cobre | 207 | 110 | 0,35 |
      | Aleación magnesio | 170 | 45 | 0,29 |
      | Acero | 550 | 206 | 0,27 |
      | Aleación titanio | 850 | 105 | 0,36 |
    pide: Qué metales cumplen la condición de alargamiento y cuáles la de disminución del diámetro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para la condición del alargamiento, ¿cuál es la forma más rápida de
          revisar los seis metales?
        opciones:
          - texto: >-
              Calcular el módulo mínimo que la cumpliría y compararlo con la
              columna de módulos: una sola cuenta vale para todos
            correcta: true
            mensaje: |
              Eso es. Con la misma tensión y la misma longitud, el
              alargamiento solo depende de $E$. Despejas el $E$ que da justo
              0,08 mm y lees la columna.
          - texto: >-
              Calcular el alargamiento de cada uno con su límite elástico
            mensaje: |
              El límite elástico no entra en la ley de Hooke. El alargamiento
              bajo esta carga depende de la tensión y del módulo; el límite
              solo dice si la fórmula se puede usar.
          - texto: >-
              Elegir el de mayor límite elástico, que será el que menos se
              alargue
            mensaje: |
              El alargamiento elástico lo decide el módulo. El titanio tiene
              el mayor límite de la tabla y se alarga casi el doble que el
              acero.
          - texto: >-
              Descartar los que plastifican; los que quedan valen
            mensaje: |
              Ese es el primer filtro, no el último. El acero no plastifica y
              aun así se alarga 0,33 mm, cuatro veces lo que permite el
              enunciado.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta con las $3{,}5\ \text{t}$?
        respuesta:
          tipo: magnitud
          valor: '270.8 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '27.6 MPa'
            mensaje: |
              Has tomado las 3,5 t como 3500 N. Una tonelada colgada pesa
              $1000\cdot 9{,}8 = 9800\ \text{N}$: la carga es de
              $34\,300\ \text{N}$.
          - valor: '67.7 MPa'
            mensaje: |
              Has usado los 12,7 mm como radio. Son el diámetro: la sección
              es $\pi\cdot 6{,}35^{2} = 126{,}7\ \text{mm}^{2}$.
        pista: |
          $F = 3500\cdot 9{,}8$ y $A_0 = \pi d^{2}/4$.
        desarrollo: |
          $$
          F = 3500\cdot 9{,}8 = 34\,300\ \text{N}
          \qquad
          A_0 = \pi\cdot 6{,}35^{2} = 126{,}7\ \text{mm}^{2}
          $$

          $$
          \sigma = \frac{34\,300}{126{,}7} = 270{,}8\ \text{MPa}
          $$

          El aluminio (250), el cobre (207) y el magnesio (170) quedan por
          debajo: con ellos la deformación no sería solo elástica.

      - tipo: calcular
        titulo: El módulo que haría falta
        pregunta: |
          ¿Qué módulo elástico mínimo necesitaría el metal para alargarse
          menos de $0{,}08\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '859700 MPa'
          tolerancia: 0.02
          formato: un módulo elástico, en MPa y con la unidad
        distractores:
          - valor: '3385 MPa'
            mensaje: |
              Has dividido la tensión entre los 0,08 mm como si fueran la
              deformación. La deformación es adimensional: 0,08 entre la
              longitud, 254 mm.
          - valor: '42980 MPa'
            mensaje: |
              Has dividido el alargamiento entre el diámetro. La deformación
              longitudinal va con la longitud de la probeta, 254 mm; el
              diámetro solo entra en la deformación transversal.
        pista: |
          $\varepsilon_{\text{máx}} = 0{,}08/254$, y $E_{\text{mín}} = \sigma/\varepsilon_{\text{máx}}$.
        desarrollo: |
          $$
          \varepsilon_{\text{máx}} = \frac{0{,}08}{254} = 3{,}15\cdot 10^{-4}
          \qquad
          E_{\text{mín}} = \frac{270{,}8}{3{,}15\cdot 10^{-4}}
          = 8{,}60\cdot 10^{5}\ \text{MPa}
          $$

          Son 860 GPa. El mayor de la tabla, el acero, tiene 206: ningún
          metal se acerca.

      - tipo: calcular
        titulo: Lo que estrecha el acero
        pregunta: |
          El acero es el que menos estrecha: mayor módulo y menor Poisson.
          ¿Cuánto disminuye su diámetro?
        respuesta:
          tipo: magnitud
          valor: '0.00451 mm'
          tolerancia: 0.02
          formato: una disminución, en positivo y con su unidad
        distractores:
          - valor: '-0.00451 mm'
            mensaje: |
              El número es el bueno. Pero se pregunta la **disminución**, que
              ya lleva el sentido en el nombre: se escribe en positivo, igual
              que el límite de $1{,}2\times 10^{-3}$ del enunciado.
          - valor: '0.0167 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson. La deformación
              transversal es $\nu$ veces la axial, un 27 % en el acero, no la
              axial entera.
          - valor: '0.0901 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud,
              254 mm. Es el **diámetro** el que cambia: se multiplica por los
              12,7 mm.
        pista: |
          $\varepsilon_z = \sigma/E$, $|\varepsilon_x| = \nu\,\varepsilon_z$
          y la disminución es $|\varepsilon_x|\,d_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{270{,}8}{206\,000} = 1{,}314\cdot 10^{-3}
          \qquad
          |\Delta d| = 0{,}27\cdot 1{,}314\cdot 10^{-3}\cdot 12{,}7
          = 4{,}51\cdot 10^{-3}\ \text{mm}
          $$

          Casi cuatro veces los $1{,}2\cdot 10^{-3}$ permitidos. Y si el que
          menos estrecha no cumple, no cumple ninguno.

      - tipo: justificar
        pregunta: Ordena por qué no vale ninguno. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es 270,8 MPa: el aluminio, el cobre y el magnesio ni
              siquiera se quedan en la zona elástica.
          - texto: >-
              Para alargarse menos de 0,08 mm haría falta un módulo de
              860 GPa, y el mayor de la tabla es el del acero, 206 GPa.
          - texto: >-
              El acero, que es el que menos estrecha, pierde 4,5·10⁻³ mm de
              diámetro: casi cuatro veces lo permitido.
          - texto: >-
              El acero es el adecuado, porque es el único que cumple las dos
              condiciones de deformación.
            trampa: true
            mensaje: |
              Es el que más se acerca, pero no cumple ninguna: se alarga
              0,33 mm, cuatro veces 0,08, y estrecha $4{,}5\cdot 10^{-3}$ mm,
              casi cuatro veces el límite. «El mejor de la tabla» no es lo
              mismo que «adecuado».
    resolucion: |
      **La tensión.** $F = 3500\cdot 9{,}8 = 34\,300\ \text{N}$ sobre
      $126{,}7\ \text{mm}^{2}$:

      $$
      \sigma = 270{,}8\ \text{MPa}
      $$

      Aluminio, cobre y magnesio tienen el límite elástico por debajo:
      plastifican y quedan fuera desde el principio.

      **El alargamiento.** El que cumpla necesita

      $$
      E \ge \frac{\sigma}{0{,}08/254} = 8{,}60\cdot 10^{5}\ \text{MPa} = 860\ \text{GPa}
      $$

      y ninguno se acerca. Material a material, con Hooke:

      | metal | $\Delta l$ (mm) | disminución de $d$ (mm) |
      |---|---|---|
      | latón | 0,688 | $1{,}20\cdot 10^{-2}$ |
      | acero | 0,334 | $4{,}51\cdot 10^{-3}$ |
      | titanio | 0,655 | $1{,}18\cdot 10^{-2}$ |

      **El diámetro.** Todos pasan del $1{,}2\cdot 10^{-3}$ permitido, incluido
      el acero. La respuesta es la del listado: **ninguno**, por las dos
      condiciones.

      **Lo que hay que llevarse.** Cuando todos los candidatos soportan la
      misma tensión, cada condición se convierte en un umbral sobre una sola
      columna: el alargamiento, sobre el módulo; el estrechamiento, sobre
      $\nu/E$. Una cuenta por condición, y no seis.
  - id: ejcm2-col219-la-tabla-en-psi
    titulo: La tabla en psi, y el único que cumple
    fuente: >-
      Ejercicio 2.19 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta de $380\ \text{mm}$ de longitud y $10\ \text{mm}$ de diámetro
      se somete a tracción. Si la probeta no debe sufrir deformación plástica
      ni un alargamiento superior a $0{,}9\ \text{mm}$ al aplicarle una carga
      de $24500\ \text{N}$, ¿cuáles de los metales de la siguiente tabla
      podrían ser adecuados? Razona tu respuesta.
      ($1\ \text{psi} = 0{,}007\ \text{MPa}$).

      | Material | $E$ (psi) · $10^{6}$ | Límite elástico (psi) | Resistencia a tracción (psi) |
      |---|---|---|---|
      | Aleación de aluminio | 10 | 37000 | 61000 |
      | Latón | 14,6 | 50000 | 61000 |
      | Cobre | 16 | 30000 | 40000 |
      | Acero | 30 | 65000 | 80000 |
    pide: Qué metales no se deforman plásticamente y cuáles, además, se alargan 0,9 mm o menos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla está en psi y la carga en newtons. ¿Qué haces antes de
          comparar nada?
        opciones:
          - texto: >-
              Pasar la tabla a MPa con 1 psi = 0,007 MPa, sin olvidar el 10⁶
              de la columna del módulo
            correcta: true
            mensaje: |
              Eso es. Los límites elásticos se multiplican por 0,007 tal cual;
              el módulo, además, lleva el $10^{6}$ del encabezado: el latón
              tiene 14,6 millones de psi, es decir 102 200 MPa.
          - texto: >-
              Nada: psi y MPa son las dos unidades de tensión y se comparan
              directamente
            mensaje: |
              Miden lo mismo pero no valen lo mismo. Un psi son 0,007 MPa,
              unas 143 veces menos: los 50 000 psi del latón son 350 MPa.
          - texto: >-
              Multiplicar por 0,007 todas las columnas tal como están escritas
            mensaje: |
              Con el módulo no basta: la columna va en psi·10⁶. Si pasas el
              14,6 del latón sin el millón, te sale un módulo de 0,1 MPa y un
              alargamiento de kilómetros.
          - texto: >-
              Comparar la tensión con la resistencia a tracción
            mensaje: |
              El enunciado pide que no haya deformación plástica, y eso lo
              marca el límite elástico. La resistencia a tracción está mucho
              más arriba y no es el criterio.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta?
        respuesta:
          tipo: magnitud
          valor: '311.9 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '78 MPa'
            mensaje: |
              Has usado los 10 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 5^{2} = 78{,}5\ \text{mm}^{2}$, cuatro veces menos.
          - valor: '1248 MPa'
            mensaje: |
              Has partido el diámetro por dos y además has dividido entre
              cuatro. O $\pi r^{2}$ con el radio, o $\pi d^{2}/4$ con el
              diámetro; las dos cosas a la vez, no.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 5^{2}\ \text{mm}^{2}$.
        desarrollo: |
          $$
          A_0 = \pi\cdot 5^{2} = 78{,}54\ \text{mm}^{2}
          \qquad
          \sigma = \frac{24\,500}{78{,}54} = 311{,}9\ \text{MPa}
          $$

          Pasada a MPa, la tabla da límites de 259 (aluminio), 350 (latón),
          210 (cobre) y 455 (acero). Aluminio y cobre plastifican.

      - tipo: calcular
        titulo: El alargamiento del latón
        pregunta: |
          El latón no plastifica. ¿Cuánto se alarga?
        respuesta:
          tipo: magnitud
          valor: '1.16 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '0.00812 mm'
            mensaje: |
              Has usado el módulo en psi como si fuera en MPa: 14,6 millones
              en vez de 102 200. Sale un alargamiento 143 veces menor y el
              latón parecería perfecto.
          - valor: '0.29 mm'
            mensaje: |
              Arrastras la tensión calculada con el diámetro como radio. Con
              la sección buena, 78,5 mm², la tensión es 311,9 MPa y el
              alargamiento cuatro veces mayor.
        pista: |
          $E_{\text{latón}} = 14{,}6\cdot 10^{6}\cdot 0{,}007 = 102\,200\ \text{MPa}$,
          y $\Delta l = \sigma\,l_0/E$.
        desarrollo: |
          $$
          \Delta l = \frac{311{,}9}{102\,200}\cdot 380 = 1{,}16\ \text{mm}
          $$

          Más de 0,9 mm: el latón se descarta aunque no plastifique.

      - tipo: justificar
        pregunta: Ordena el razonamiento que deja solo al acero. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es 311,9 MPa. El aluminio (259 MPa) y el cobre
              (210 MPa) tienen el límite elástico por debajo: plastifican.
          - texto: >-
              Quedan el latón (350 MPa) y el acero (455 MPa), que trabajan en
              la zona elástica.
          - texto: >-
              El latón, con 102 200 MPa de módulo, se alarga 1,16 mm, más de
              los 0,9 permitidos.
          - texto: >-
              El acero, con 210 000 MPa, se alarga 0,56 mm: es el único que
              cumple las dos condiciones.
          - texto: >-
              El latón también cumple, porque su resistencia a tracción,
              427 MPa, queda muy por encima de la tensión.
            trampa: true
            mensaje: |
              La resistencia a tracción no es ninguna de las dos condiciones.
              El latón pasa la primera por su límite elástico, sí, pero se
              alarga 1,16 mm y la segunda lo deja fuera.
    resolucion: |
      **La tabla en MPa.** Con $1\ \text{psi} = 0{,}007\ \text{MPa}$:

      | material | $E$ (MPa) | límite elástico (MPa) |
      |---|---|---|
      | aluminio | 70 000 | 259 |
      | latón | 102 200 | 350 |
      | cobre | 112 000 | 210 |
      | acero | 210 000 | 455 |

      **La tensión.**

      $$
      \sigma = \frac{24\,500}{\pi\cdot 5^{2}} = 311{,}9\ \text{MPa}
      $$

      **Sin deformación plástica.** Aluminio y cobre tienen el límite por
      debajo de 311,9: fuera.

      **Alargamiento de 0,9 mm como mucho.** Haría falta

      $$
      E \ge \frac{311{,}9}{0{,}9/380} = 131\,700\ \text{MPa}
      $$

      El latón se queda en 102 200 y se alarga 1,16 mm; el acero, con
      210 000, se alarga 0,56 mm. Solo cumple **el acero**, que es el
      resultado del listado.

      **Lo que hay que llevarse.** Una tabla en unidades inglesas no cambia el
      método, pero añade dos sitios donde equivocarse: el factor de
      conversión y el multiplicador escondido en el encabezado. El segundo es
      el que más se olvida.
  - id: ejcm2-col220-tres-condiciones-y-el-peso
    titulo: Tres condiciones, y el peso para desempatar
    fuente: >-
      Ejercicio 2.20 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra cilíndrica de $120\ \text{mm}$ de longitud y $15\ \text{mm}$
      de diámetro se deforma bajo una carga de $30000\ \text{N}$. Si no debe
      sufrir deformación plástica y además el alargamiento nunca debe superar
      los $0{,}22\ \text{mm}$, ¿cuáles de los materiales de la tabla serían
      adecuados? Y si además, la máxima disminución del diámetro que puede
      sufrir es de $1{,}2\times 10^{-2}\ \text{mm}$, ¿cuáles de los materiales
      de la tabla serían adecuados? Y si además el peso es un factor muy
      importante, ¿qué material elegirías?

      | Material | Módulo elástico (MPa · $10^{3}$) | Límite elástico (MPa) | Poisson | Densidad (g/cm³) |
      |---|---|---|---|---|
      | Aleación aluminio | 70 | 250 | 0,33 | 2,80 |
      | Aleación titanio | 105 | 850 | 0,36 | 4,50 |
      | Acero | 205 | 550 | 0,27 | 7,86 |
    pide: Qué materiales cumplen cada condición y cuál se elige si el peso importa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres condiciones y, al final, un criterio de peso. ¿En qué orden
          se aplican?
        opciones:
          - texto: >-
              Primero las tres condiciones, y el peso solo entre los que las
              cumplen
            correcta: true
            mensaje: |
              Eso es. Las condiciones son eliminatorias; el peso es un
              desempate. Un material ligero que se alarga de más no sirve,
              por poco que pese.
          - texto: >-
              Primero el peso, y luego se comprueba el más ligero
            mensaje: |
              El más ligero es el aluminio, y es justo el que no cumple el
              alargamiento. Empezar por el desempate te obliga a volver atrás.
          - texto: >-
              Solo el alargamiento, que es la condición más exigente
            mensaje: |
              Que una condición descarte a uno no dice nada de las demás. Cada
              una mira una columna distinta —límite, módulo, Poisson— y
              pueden descartar a materiales distintos.
          - texto: >-
              Gana el de mayor módulo específico, $E/\rho$
            mensaje: |
              El módulo específico mide rigidez por unidad de peso, y aquí
              daría el acero. Pero lo que se pide son unos límites fijos:
              cumplidos, la rigidez que sobra no cuenta, y entre los que
              cumplen pesa menos el titanio.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la barra?
        respuesta:
          tipo: magnitud
          valor: '169.8 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '42.4 MPa'
            mensaje: |
              Has usado los 15 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 7{,}5^{2} = 176{,}7\ \text{mm}^{2}$.
          - valor: '679 MPa'
            mensaje: |
              Has partido el diámetro por dos y además has dividido entre
              cuatro. O $\pi r^{2}$ con el radio, o $\pi d^{2}/4$ con el
              diámetro; las dos a la vez, no.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 7{,}5^{2}$.
        desarrollo: |
          $$
          A_0 = \pi\cdot 7{,}5^{2} = 176{,}7\ \text{mm}^{2}
          \qquad
          \sigma = \frac{30\,000}{176{,}7} = 169{,}8\ \text{MPa}
          $$

          Por debajo de los tres límites elásticos: ninguno plastifica.

      - tipo: calcular
        titulo: El alargamiento del aluminio
        pregunta: |
          ¿Cuánto se alarga la barra si es de aleación de aluminio?
        respuesta:
          tipo: magnitud
          valor: '0.291 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '0.00243 mm'
            mensaje: |
              Esa es la deformación unitaria, $\sigma/E$, que no tiene
              unidades. Falta multiplicarla por la longitud, 120 mm.
          - valor: '291 mm'
            mensaje: |
              Te has dejado el $10^{3}$ del encabezado. El módulo del aluminio
              son 70 000 MPa, no 70.
        pista: |
          $\Delta l = \sigma\,l_0/E$, con $E = 70\,000\ \text{MPa}$.
        desarrollo: |
          $$
          \Delta l = \frac{169{,}8}{70\,000}\cdot 120 = 0{,}291\ \text{mm} > 0{,}22
          $$

          El aluminio queda fuera. El titanio se alarga 0,194 mm y el acero
          0,099 mm: los dos cumplen.

      - tipo: calcular
        titulo: Lo que estrecha el titanio
        pregunta: |
          ¿Cuánto disminuye el diámetro de la barra de titanio?
        respuesta:
          tipo: magnitud
          valor: '0.00873 mm'
          tolerancia: 0.02
          formato: una disminución, en positivo y con su unidad
        distractores:
          - valor: '0.0243 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson. La deformación
              transversal es $\nu$ veces la axial: un 36 % en el titanio.
          - valor: '0.0698 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud. Lo
              que cambia es el diámetro: se multiplica por los 15 mm.
        pista: |
          $\varepsilon_z = \sigma/E$, disminución $= \nu\,\varepsilon_z\,d_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{169{,}8}{105\,000} = 1{,}617\cdot 10^{-3}
          \qquad
          0{,}36\cdot 1{,}617\cdot 10^{-3}\cdot 15 = 8{,}73\cdot 10^{-3}\ \text{mm}
          $$

          Por debajo de $1{,}2\cdot 10^{-2}$. El acero estrecha
          $3{,}35\cdot 10^{-3}$ mm: también cumple.

      - tipo: calcular
        titulo: Lo que pesa la barra de titanio
        pregunta: |
          ¿Cuánto pesa la barra si es de titanio?
        respuesta:
          tipo: magnitud
          valor: '95.4 g'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '166.7 g'
            mensaje: |
              Esa es la del acero, con 7,86 g/cm³. La de titanio, con
              4,50 g/cm³, pesa un 43 % menos: por eso gana el desempate.
          - valor: '381.7 g'
            mensaje: |
              Has calculado el volumen con los 15 mm como radio. El volumen es
              $\pi\cdot 7{,}5^{2}\cdot 120\ \text{mm}^{3}$, cuatro veces menos.
        pista: |
          $V = A_0\,l_0$ en cm³, y $m = \rho\,V$.
        desarrollo: |
          $$
          V = 176{,}7\cdot 120 = 21\,206\ \text{mm}^{3} = 21{,}21\ \text{cm}^{3}
          \qquad
          m = 4{,}50\cdot 21{,}21 = 95{,}4\ \text{g}
          $$

      - tipo: justificar
        pregunta: Ordena la elección. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión, 169,8 MPa, está por debajo de los tres límites
              elásticos: ninguno plastifica.
          - texto: >-
              El aluminio se alarga 0,291 mm, más de 0,22: se descarta.
          - texto: >-
              Titanio y acero estrechan 8,7·10⁻³ y 3,4·10⁻³ mm, los dos por
              debajo de 1,2·10⁻² mm: siguen los dos.
          - texto: >-
              Si el peso importa, gana el titanio: 95 g frente a los 167 del
              acero.
          - texto: >-
              Si el peso importa, el mejor es el aluminio, que es el más
              ligero de los tres.
            trampa: true
            mensaje: |
              El peso desempata entre los que cumplen, y el aluminio ya se
              había caído por el alargamiento. Por ligero que sea, una barra
              que se alarga 0,29 mm donde se permiten 0,22 no sirve.
    resolucion: |
      **La tensión.**

      $$
      \sigma = \frac{30\,000}{\pi\cdot 7{,}5^{2}} = 169{,}8\ \text{MPa}
      $$

      Los tres límites (250, 850 y 550 MPa) están por encima: **ninguno
      plastifica**.

      **Las dos condiciones de deformación.**

      | material | $\Delta l$ (mm) | disminución de $d$ (mm) |
      |---|---|---|
      | aluminio | **0,291** | $1{,}20\cdot 10^{-2}$ |
      | titanio | 0,194 | $8{,}73\cdot 10^{-3}$ |
      | acero | 0,099 | $3{,}35\cdot 10^{-3}$ |

      El aluminio pasa de 0,22 mm: **se descarta**. Titanio y acero cumplen
      las dos. El aluminio, de paso, se queda justo en el borde del diámetro
      —$1{,}2005\cdot 10^{-2}$—, pero ya estaba fuera.

      **El peso.** Con la misma barra, de $21{,}21\ \text{cm}^{3}$, el titanio
      pesa 95 g y el acero 167 g. Se elige **el titanio**, que es el resultado
      del listado.

      **Lo que hay que llevarse.** Las condiciones eliminan; el criterio de
      peso ordena lo que queda. Aplicarlos al revés lleva directo al
      aluminio, que es el más ligero y el único que no sirve.
  - id: ejcm2-col221-el-acero-del-muelle
    titulo: El límite elástico que necesita un muelle
    fuente: >-
      Ejercicio 2.21 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Para poder ser empleado como muelle un acero debe presentar un módulo de
      resiliencia mínimo de $2{,}07\ \text{MPa}$. ¿Cuál será entonces el valor
      mínimo de límite elástico? Dato: $E=205\cdot 10^{3}\ \text{MPa}$.
    pide: El límite elástico mínimo del acero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es el módulo de resiliencia en el diagrama tensión-deformación?
        opciones:
          - texto: >-
              El área bajo la curva hasta el límite elástico: la energía por
              unidad de volumen que el material devuelve al descargar
            correcta: true
            mensaje: |
              Eso es. Es justo lo que se le pide a un muelle: absorber
              energía al deformarse y devolverla entera, sin quedarse
              deformado.
          - texto: >-
              El área bajo toda la curva, hasta la rotura
            mensaje: |
              Esa es la tenacidad. Un muelle no puede plastificar, así que la
              energía que cuenta es la que devuelve, la de la zona elástica.
          - texto: >-
              La pendiente del tramo elástico
            mensaje: |
              La pendiente es el módulo de Young, la rigidez. La resiliencia
              es un área, y por eso sale en MPa, que es lo mismo que MJ/m³:
              energía por volumen.
          - texto: >-
              La tensión máxima que aguanta el material
            mensaje: |
              Esa es la resistencia a tracción, y está en la zona plástica. La
              resiliencia se queda antes, en el límite elástico.

      - tipo: calcular
        titulo: El límite elástico mínimo
        pregunta: |
          ¿Qué límite elástico mínimo necesita el acero?
        respuesta:
          tipo: magnitud
          valor: '921 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '651 MPa'
            mensaje: |
              Te has dejado el 2 del denominador. El área es un triángulo:
              $U_r = \tfrac{1}{2}\,\sigma_y\,\varepsilon_y = \sigma_y^{2}/2E$,
              así que al despejar el 2 pasa multiplicando.
          - valor: '461 MPa'
            mensaje: |
              Has pasado el 2 dividiendo en vez de multiplicando. Si
              $U_r = \sigma_y^{2}/2E$, entonces $\sigma_y^{2} = 2E\,U_r$.
          - valor: '29.1 MPa'
            mensaje: |
              Has puesto el módulo en GPa, 205, con la resiliencia en MPa.
              Las dos tienen que ir en la misma unidad: 205 000 MPa.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$, despejando $\sigma_y$.
        desarrollo: |
          $$
          \sigma_y = \sqrt{2\,E\,U_r} = \sqrt{2\cdot 205\,000\cdot 2{,}07}
          = \sqrt{848\,700} = 921\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un muelle trabaja solo en la zona elástica, y la energía que
              devuelve por unidad de volumen es el módulo de resiliencia.
          - texto: >-
              Con el tramo elástico recto, esa área es un triángulo de base
              $\varepsilon_y$ y altura $\sigma_y$, es decir $\sigma_y^{2}/2E$.
          - texto: >-
              Despejando sale 921 MPa, y es un mínimo: con más límite elástico
              la resiliencia crece con el cuadrado.
          - texto: >-
              Con un acero de módulo de Young mayor bastaría un límite
              elástico menor.
            trampa: true
            mensaje: |
              Al revés. $E$ está en el denominador: un módulo mayor hace el
              triángulo más estrecho y baja la resiliencia, así que haría
              falta **más** límite elástico. Un buen muelle quiere límite
              alto y módulo no demasiado alto.
    resolucion: |
      **Qué es la resiliencia.** El área bajo la curva hasta el límite
      elástico. Con el tramo elástico recto es un triángulo:

      $$
      U_r = \frac{1}{2}\,\sigma_y\,\varepsilon_y = \frac{\sigma_y^{2}}{2E}
      $$

      **El límite elástico.** Despejando:

      $$
      \sigma_y = \sqrt{2\,E\,U_r} = \sqrt{2\cdot 205\,000\cdot 2{,}07}
      = 921\ \text{MPa}
      $$

      Es el resultado del listado. Y es un **mínimo**: la resiliencia crece
      con el cuadrado del límite elástico, así que cualquier acero con más de
      921 MPa sirve.

      **Lo que hay que llevarse.** Para guardar energía elástica importa
      mucho más el límite elástico que la rigidez, porque entra al cuadrado.
      Por eso los aceros de muelle son aceros de límite elástico muy alto, no
      aceros especialmente rígidos: el módulo de todos los aceros es casi el
      mismo.
  - id: ejcm2-col222-las-dos-medidas-de-la-ductilidad
    titulo: Las dos medidas de la ductilidad
    fuente: >-
      Ejercicio 2.22 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta de $12{,}8\ \text{mm}$ de diámetro y $50{,}8\ \text{mm}$ de
      longitud se somete a tracción hasta rotura. En el punto de rotura el
      diámetro es de $6{,}6\ \text{mm}$ y la longitud de $72{,}14\ \text{mm}$.
      Calcula la ductilidad en forma de reducción porcentual de área y
      alargamiento porcentual relativo.
    pide: La reducción de área y el alargamiento, en porcentaje.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué se calculan las dos medidas de la ductilidad?
        opciones:
          - texto: >-
              Con las dimensiones en rotura, referidas a las iniciales:
              $(l_f-l_0)/l_0$ y $(A_0-A_f)/A_0$
            correcta: true
            mensaje: |
              Eso es. Las dos comparan la probeta rota con la probeta de
              partida, y las dos se dividen entre la inicial.
          - texto: >-
              La reducción de área, con los diámetros: $(d_0-d_f)/d_0$
            mensaje: |
              El área va con el **cuadrado** del diámetro. Con los diámetros
              a secas sale un 48 %, y el área se ha reducido mucho más.
          - texto: >-
              Las dos, divididas entre las dimensiones finales
            mensaje: |
              Por definición se refieren a la probeta inicial: son cuánto ha
              cambiado respecto de lo que había. Dividir entre la final da
              otro número y no es el que se pide.

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la reducción de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '73.4'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '48.4'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área de
              un círculo va con $d^{2}$: $(6{,}6/12{,}8)^{2} = 0{,}266$, así
              que queda un 26,6 % del área y se ha perdido el 73,4 %.
          - valor: '276'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la inicial, y por eso nunca pasa del 100 %.
        pista: |
          $\%AR = \left(1 - \dfrac{d_f^{2}}{d_0^{2}}\right)\cdot 100$, porque
          el $\pi/4$ se va.
        desarrollo: |
          $$
          \%AR = \frac{A_0 - A_f}{A_0}\cdot 100
          = \left(1 - \left(\frac{6{,}6}{12{,}8}\right)^{2}\right)\cdot 100
          = 73{,}4\ \%
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento porcentual relativo?
        respuesta:
          tipo: numero
          valor: '42.0'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '29.6'
            mensaje: |
              Has dividido entre la longitud final, 72,14. El alargamiento
              relativo se refiere a la inicial, 50,8 mm.
          - valor: '142'
            mensaje: |
              Has calculado $l_f/l_0$ por cien sin restar la longitud inicial.
              Eso dice que la probeta mide el 142 % de lo que medía; lo que se
              ha **alargado** es el 42 %.
        pista: |
          $\%EL = \dfrac{l_f - l_0}{l_0}\cdot 100$.
        desarrollo: |
          $$
          \%EL = \frac{72{,}14 - 50{,}8}{50{,}8}\cdot 100
          = \frac{21{,}34}{50{,}8}\cdot 100 = 42{,}0\ \%
          $$

      - tipo: justificar
        pregunta: Ordena lo que dicen los dos números. Una pieza es falsa.
        piezas:
          - texto: >-
              La probeta se ha alargado un 42 % respecto de su longitud
              inicial.
          - texto: >-
              En la sección de rotura queda un 26,6 % del área: se ha perdido
              el 73,4 %.
          - texto: >-
              Las dos medidas están muy por encima del 5 % que separa lo
              frágil de lo dúctil: es un material muy dúctil.
          - texto: >-
              Como la reducción de área sale mayor que el alargamiento, la
              probeta ha perdido volumen al romper.
            trampa: true
            mensaje: |
              El volumen se conserva. Las dos cifras miden sitios distintos:
              el alargamiento es un promedio sobre toda la longitud, y la
              reducción de área se mide en el cuello, donde la estricción ha
              concentrado casi toda la deformación final.
    resolucion: |
      **Reducción de área.** El $\pi/4$ se simplifica y queda el cociente de
      diámetros al cuadrado:

      $$
      \%AR = \left(1 - \left(\frac{6{,}6}{12{,}8}\right)^{2}\right)\cdot 100
      = 73\ \%
      $$

      **Alargamiento relativo.**

      $$
      \%EL = \frac{72{,}14 - 50{,}8}{50{,}8}\cdot 100 = 42\ \%
      $$

      Son los dos valores del listado.

      **Lo que hay que llevarse.** Las dos son medidas de ductilidad, pero no
      miden lo mismo ni tienen por qué coincidir. El alargamiento reparte la
      deformación por toda la probeta; la reducción de área la mide en el
      cuello, que es donde se ha acumulado tras la estricción. Por eso, en un
      material dúctil, la reducción de área suele salir mayor.
  - id: ejcm2-col223-seis-curvas-sin-numeros
    titulo: Seis curvas sin un solo número
    fuente: >-
      Ejercicio 2.23 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica resultado:
      es un ejercicio de dibujo, y cada curva se ha contrastado con las
      definiciones de las transparencias del tema.
    nivel: practica
    enunciado: |
      Dibuja el diagrama tensión-deformación característico de un material:

      a) Rígido, resistente, tenaz y dúctil.

      b) Elástico y tenaz.

      c) Rígido, resistente y frágil.

      d) Rígido, poco resistente y frágil.

      e) Elástico, poco resistente y frágil.

      f) Elástico y resiliente.
    pide: La forma de cada una de las seis curvas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de dibujar, ¿en qué parte de la curva se ve que un material es
          «rígido»?
        opciones:
          - texto: >-
              En la pendiente del tramo elástico: rígido es módulo de Young
              alto, una recta empinada
            correcta: true
            mensaje: |
              Eso es. Y «elástico», en este ejercicio, es lo contrario: recta
              tendida, que se deforma mucho elásticamente con poca tensión.
          - texto: >-
              En la altura máxima que alcanza la curva
            mensaje: |
              La altura máxima es la resistencia a tracción: eso es
              «resistente». Un material puede ser muy rígido y poco
              resistente, como el caso d).
          - texto: >-
              En lo larga que es la curva antes de romper
            mensaje: |
              La longitud es la deformación a rotura: eso es «dúctil», o
              «frágil» si la curva acaba enseguida.
          - texto: >-
              En el área bajo la curva
            mensaje: |
              El área es energía: hasta la rotura es la tenacidad y hasta el
              límite elástico, la resiliencia. La rigidez es una pendiente, no
              un área.

      - tipo: calcular
        titulo: Lo que la pendiente hace con la resiliencia
        pregunta: |
          Dos materiales tienen el mismo límite elástico, y uno tiene la mitad
          de módulo de Young que el otro: es el más «elástico». ¿Por cuánto se
          multiplica su módulo de resiliencia respecto del otro?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.05
          formato: un número, el factor
        distractores:
          - valor: '0.5'
            mensaje: |
              Lo has invertido. $U_r = \sigma_y^{2}/2E$ lleva el módulo en el
              denominador: con la mitad de $E$, el triángulo llega a la misma
              altura con el doble de base, y su área se dobla.
          - valor: '1'
            mensaje: |
              Misma altura no es misma área. El triángulo de la resiliencia
              tiene de base $\varepsilon_y = \sigma_y/E$, y con la mitad de
              módulo esa base se dobla.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$: el límite elástico no cambia y el
          módulo se divide entre dos.
        desarrollo: |
          $$
          \frac{U_r'}{U_r} = \frac{\sigma_y^{2}/(2\cdot E/2)}{\sigma_y^{2}/(2E)} = 2
          $$

          Por eso el f) es «elástico **y** resiliente»: una recta tendida que
          llega alto encierra mucha área antes de plastificar.

      - tipo: dibujar
        consigna: |
          Dibuja las seis curvas en seis ejes pequeños, con $\varepsilon$ en
          horizontal y $\sigma$ en vertical, y **con la misma escala en los
          seis**: no hay números, así que lo único que compara una curva con
          otra es esa escala común. Marca cada fractura con un punto y sombrea
          el área que da nombre a la curva cuando la haya.
        comprueba:
          - punto: >-
              Las pendientes iniciales dicen quién es rígido: empinadas en a),
              c) y d), tendidas en b), e) y f).
            porque: >-
              Rígido es módulo de Young alto: la diapositiva 14 relaciona el
              módulo con la rigidez del material. «Elástico», en este
              ejercicio, es lo contrario: módulo bajo, mucha deformación
              elástica con poca tensión. La tabla resumen de la diapositiva 55
              pone también el límite elástico junto a la rigidez, pero aquí no
              puede ser esa la lectura, porque el d) es rígido y poco
              resistente a la vez. Dar la misma pendiente a las tres rígidas y
              otra a las tres elásticas ayuda a compararlas; lo que no puede
              pasar es que una elástica salga más empinada que una rígida.
          - punto: >-
              c), d) y e) terminan casi al acabar la recta, sin zona plástica
              apreciable.
            porque: >-
              Frágil es soportar poca deformación hasta la rotura, menos de un
              5 % de alargamiento (diapositiva 38 del tema). La misma
              diapositiva dibuja el material frágil como una recta que acaba
              en la fractura.
          - punto: >-
              La altura separa c) de d): la misma recta empinada, pero c) llega
              muy alto y d) rompe abajo. e) también rompe abajo.
            porque: >-
              Resistente es la tensión máxima de la curva, la resistencia a
              tracción. Rigidez y resistencia son lecturas distintas: d) es tan
              rígido como c) y mucho menos resistente.
          - punto: >-
              a) y b) largas y con mucha área debajo, las dos a una tensión
              apreciable hasta el final; a) además alta, porque es resistente.
            porque: >-
              Tenacidad es el área bajo la curva hasta la fractura
              (diapositiva 40). a) es tenaz porque es resistente y dúctil a la
              vez. b) tiene la recta tendida, y la forma natural de darle
              mucha área es una zona plástica larga que no se hunde. Una curva
              muy larga pero pegada al eje es dúctil y encierra poca área.
          - punto: >-
              f): la recta tendida sube hasta un límite elástico alto, y el
              triángulo de debajo es grande.
            porque: >-
              Resiliencia es el área bajo el tramo elástico,
              $U_r = \sigma_y^{2}/2E$ (diapositiva 39). Con el módulo bajo la
              recta llega a la misma altura con más deformación, y con el
              límite alto el triángulo crece por los dos lados. Lo que pasa
              después del límite elástico no lo fija el enunciado; por eso en
              la figura va a trazos.
        figura: |
          <svg viewBox="0 0 342 444" role="img" width="342" height="444" aria-labelledby="cm2-d223-t cm2-d223-d">
            <title id="cm2-d223-t">Las seis curvas tensión-deformación del problema 2.23, con la misma escala</title>
            <desc id="cm2-d223-d">Seis gráficas pequeñas, en dos columnas, todas con los mismos ejes de tensión y deformación y sin números. Solo hay dos pendientes iniciales: una recta casi vertical para los rígidos, a, c y d, y una recta tendida para los elásticos, b, e y f. a: recta empinada que llega alto y sigue una zona plástica larga hasta romper al final del eje, con el área de debajo sombreada como tenacidad. b: recta tendida que plastifica a media altura y sigue igual de larga que a, con el área sombreada. c: recta empinada que llega muy alto y rompe casi al acabar la recta. d: la misma recta empinada, que rompe muy abajo. e: la recta tendida, que rompe muy abajo y enseguida. f: la recta tendida que sube hasta un límite elástico alto, con el triángulo de debajo sombreado como resiliencia; lo que sigue está a trazos porque el enunciado no lo fija. Cada fractura va marcada con un punto.</desc>
