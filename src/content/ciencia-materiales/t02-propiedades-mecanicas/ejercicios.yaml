            <g transform="translate(174 316)"><text class="cm2-d223-l" x="2" y="-5" fill="var(--live)">f)</text><path class="cm2-d223-eje" d="M12 112.5L156 112.5M22.7 116L22.7 12"/><g class="cm2-d223-n"><text x="156" y="104.5" text-anchor="end">ε</text><text x="28.7" y="22">σ</text></g><path class="cm2-d223-f2" d="M22.7 112.5L89.3 42L89.3 112.5Z"/><path class="cm2-d223-c" d="M22.7 112.5L89.3 42"/><path class="cm2-d223-g" d="M89.3 42L100 38.4L116 37.6"/><path class="cm2-d223-g" d="M60 30.5L70.7 90.4"/><text class="cm2-d223-n" x="44" y="26.1" text-anchor="start" fill="var(--alt)">resiliencia</text></g>
          </svg>
        veredicto: >-
          Pon las seis una al lado de otra: si cada adjetivo se lee en un solo
          sitio —la pendiente, la altura, la longitud, el área entera o el
          triángulo del principio—, el dibujo está bien. Cuidado con fiarlo
          todo a la longitud en b): larga no es tenaz si va pegada al eje.

      - tipo: justificar
        pregunta: Ordena cómo es cada curva. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Recta empinada, curva alta y muy larga: mucha área debajo, y
              rompe tras una gran deformación plástica.
          - texto: >-
              c) y d) Recta empinada que rompe poco después del límite
              elástico; la c) alta y la d) baja.
          - texto: >-
              e) Recta tendida y baja, y rotura casi al acabar la recta.
          - texto: >-
              f) Recta tendida que llega a un límite elástico alto: mucha área
              bajo el tramo elástico.
          - texto: >-
              b) Elástico y tenaz es lo mismo que elástico y dúctil: una curva
              muy larga ya lo cumple.
            trampa: true
            mensaje: |
              Tenacidad es área, no longitud: las transparencias lo dicen con
              todas las letras, «no confundir ductilidad y tenacidad». Una
              curva larga pero muy baja encierra poca área. Para ser tenaz
              hace falta deformarse mucho **y** a una tensión apreciable.
    resolucion: |
      **Cómo se lee cada adjetivo.** Cada uno vive en una parte distinta de la
      curva:

      | adjetivo | dónde se ve |
      |---|---|
      | rígido / elástico | pendiente del tramo recto: alta / baja |
      | resistente / poco resistente | altura máxima de la curva |
      | dúctil / frágil | deformación a la que rompe: mucha / poca |
      | tenaz | área bajo toda la curva |
      | resiliente | área bajo el tramo elástico |

      **Las seis curvas.**

      a) Recta muy empinada, que sube alto y sigue una zona plástica larga
      antes de romper. Mucha área: es tenaz porque es resistente y dúctil a
      la vez.

      b) Recta tendida, y después una zona plástica larga a una tensión
      apreciable, de modo que el área total sea grande.

      c) Recta muy empinada que llega muy alto y rompe casi al acabar, sin
      zona plástica apreciable.

      d) Igual de empinada que la c), pero rompe mucho antes, a poca tensión.

      e) Recta tendida y corta: rompe a poca tensión y enseguida.

      f) Recta tendida que llega a un límite elástico alto. Como
      $U_r = \sigma_y^{2}/2E$, módulo bajo y límite alto dan mucha área bajo
      el tramo elástico.

      **Lo que hay que llevarse.** El diagrama tiene cinco lecturas
      —pendiente, altura, longitud y dos áreas— y cada adjetivo es una sola
      de ellas. El error típico es mezclar las dos que más se parecen: dúctil
      es longitud, tenaz es área.
  - id: ejcm2-col224-la-tension-real-en-el-cuello
    titulo: La tensión real en el cuello de rotura
    fuente: >-
      Ejercicio 2.24 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero de $12{,}8\ \text{mm}$
      ($0{,}505\ \text{plg}$) de diámetro se somete a tracción hasta rotura,
      siendo su resistencia a tracción en rotura de $460\ \text{MPa}$
      ($167000\ \text{psi}$). Si el diámetro de la probeta en el punto de
      rotura es de $10{,}7\ \text{mm}$ ($0{,}422\ \text{plg}$), indica:

      a) Ductilidad (porcentaje de disminución de área).

      b) Tensión real de rotura.
    pide: La reducción de área y la tensión real en el punto de rotura.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tensión real de rotura, ¿con qué se calcula?
        opciones:
          - texto: >-
              Con la carga de rotura dividida entre la sección en el punto de
              rotura, la de 10,7 mm
            correcta: true
            mensaje: |
              Eso es. La tensión real se refiere al área que hay en cada
              momento, y en la rotura esa área es la del cuello.
          - texto: >-
              Con la carga de rotura dividida entre la sección inicial
            mensaje: |
              Eso da la tensión **nominal**, que son precisamente los 460 MPa
              del enunciado. La real usa el área que queda.
          - texto: >-
              Con $\sigma_T = \sigma\,(1+\varepsilon)$
            mensaje: |
              Esa fórmula supone que la probeta se estira por igual en toda su
              longitud, y eso deja de ser cierto con la estricción. En la
              rotura la deformación se concentra en el cuello: hay que ir al
              área.

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la disminución de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '30.1'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '16.4'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área va
              con $d^{2}$: $(10{,}7/12{,}8)^{2} = 0{,}699$, y se ha perdido el
              30 %.
          - valor: '43.1'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la sección inicial.
        pista: |
          $\%AR = \left(1 - (d_f/d_0)^{2}\right)\cdot 100$.
        desarrollo: |
          $$
          \%AR = \left(1 - \left(\frac{10{,}7}{12{,}8}\right)^{2}\right)\cdot 100
          = (1 - 0{,}699)\cdot 100 = 30{,}1\ \%
          $$

      - tipo: calcular
        titulo: La tensión real de rotura
        pregunta: |
          ¿Cuánto vale la tensión real en el punto de rotura?
        respuesta:
          tipo: magnitud
          valor: '658 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '321 MPa'
            mensaje: |
              Has invertido el cociente de áreas. El área real es **menor**
              que la inicial, así que la tensión real sale **mayor** que la
              nominal: se multiplica por $A_0/A_f$, no por $A_f/A_0$.
          - valor: '550 MPa'
            mensaje: |
              Has multiplicado por el cociente de diámetros sin elevarlo al
              cuadrado. Las áreas van con $d^{2}$: el factor es
              $(12{,}8/10{,}7)^{2} = 1{,}431$.
          - valor: '599 MPa'
            mensaje: |
              Has usado $\sigma(1+\varepsilon)$ poniendo la reducción de área
              como deformación. Esa fórmula no vale tras la estricción, y la
              reducción de área no es una deformación longitudinal.
        pista: |
          $F = 460\cdot A_0$ es la misma carga; $\sigma_T = F/A_f$, es decir
          $\sigma_T = 460\,(d_0/d_f)^{2}$.
        desarrollo: |
          $$
          F = 460\cdot \pi\cdot 6{,}4^{2} = 460\cdot 128{,}7 = 59\,190\ \text{N}
          \qquad
          A_f = \pi\cdot 5{,}35^{2} = 89{,}9\ \text{mm}^{2}
          $$

          $$
          \sigma_T = \frac{59\,190}{89{,}9} = 658\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena por qué la tensión real sale mayor. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga en la rotura es una sola, 59 190 N: la de los 460 MPa
              sobre la sección inicial.
          - texto: >-
              En el cuello la sección es 89,9 mm², un 30 % menos que los
              128,7 mm² iniciales.
          - texto: >-
              La misma carga sobre menos área da más tensión: 658 MPa.
          - texto: >-
              La tensión real es menor que la nominal, porque en la rotura el
              material ya se ha debilitado.
            trampa: true
            mensaje: |
              Tras la estricción la carga baja, sí, pero el área baja más
              deprisa. En tracción la tensión real nunca es menor que la
              nominal: el material de verdad se está endureciendo, y lo que
              la curva nominal esconde es solo que la sección se estrecha.
    resolucion: |
      **a) Ductilidad.**

      $$
      \%AR = \left(1 - \left(\frac{10{,}7}{12{,}8}\right)^{2}\right)\cdot 100
      = 30\ \%
      $$

      **b) Tensión real de rotura.** La carga es la misma; cambia el área
      sobre la que se reparte:

      $$
      \sigma_T = \frac{F}{A_f} = 460\cdot\left(\frac{12{,}8}{10{,}7}\right)^{2}
      = 460\cdot 1{,}431 = 658\ \text{MPa}
      $$

      Son los dos valores del listado.

      > **Una errata en el enunciado.** 460 MPa son unos 66 700 psi, no
      > 167 000: esos serían 1151 MPa. El resultado del listado, 658 MPa, sale
      > con los 460 MPa, así que la cifra que manda es esa. En psi, los
      > 658 MPa son unos 95 500 psi; el listado imprime 95 700, una diferencia
      > de conversión del 0,2 %.

      **Lo que hay que llevarse.** La tensión nominal divide entre un área que
      ya no existe. Hasta la estricción la diferencia es pequeña; en la
      rotura es de un 43 %, y es entonces cuando la curva nominal parece decir
      que el material se debilita cuando en realidad se está endureciendo.

  - id: ejcm2-col225-la-curva-del-laton
    titulo: Cuatro lecturas de la curva de un latón
    fuente: >-
      Ejercicio 2.25 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dada la curva $\sigma$-$\varepsilon$ para el latón, calcula:

      a) El módulo elástico.

      b) El límite elástico para una deformación de $0{,}002$.

      c) La carga máxima que puede soportar una probeta de $12{,}8\ \text{mm}$
      de diámetro.

      d) El máximo incremento de longitud que puede soportar una probeta de
      longitud inicial $254\ \text{mm}$, al ser sometida a una tensión de
      $345\ \text{MPa}$.
    pide: El módulo, el límite elástico, la carga máxima y el alargamiento a 345 MPa, leídos en la curva.
    pasos:
      - tipo: reconocer
        pregunta: |
          El módulo elástico es la pendiente del tramo recto. ¿Dónde se lee en
          la «Curva tensión-deformación de un latón» de este tema?
        opciones:
          - texto: >-
              En el recuadro, el tramo inicial ampliado, con la deformación de
              0 a 0,005
            correcta: true
            mensaje: |
              Eso es. En la curva grande el tramo elástico ocupa menos de
              0,005 de un eje que llega a 0,40: se ve casi vertical y no se le
              puede medir la pendiente. El recuadro está justo para eso.
          - texto: >-
              En la curva grande, del origen al codo que hay hacia 0,01 y
              250 MPa
            mensaje: |
              A esa escala el codo no es el final del tramo recto: el latón deja
              de ser elástico mucho antes, hacia 0,002. Esa pendiente sale de
              unos 25 GPa, la cuarta parte del módulo de verdad.
          - texto: >-
              Dividiendo el límite elástico entre 0,002, que es donde empieza
              la paralela
            mensaje: |
              El 0,002 es el desplazamiento de la paralela, no la deformación
              elástica en el límite. A 250 MPa la parte elástica es
              250/93 800 = 0,0027, así que esa cuenta infla el módulo hasta
              125 GPa.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          Lee un punto de la recta del recuadro. ¿Cuánto vale el módulo
          elástico?
        respuesta:
          tipo: magnitud
          valor: '93.8 GPa'
          tolerancia: 0.05
          formato: un módulo, con su unidad
        distractores:
          - valor: '24.7 GPa'
            mensaje: |
              Has medido la pendiente en la curva grande, del origen a
              $(0{,}01;\ 247\ \text{MPa})$. Ese tramo no es recto: a esa escala
              la curva ya se ha tumbado. El tramo elástico solo se ve en el
              recuadro.
          - valor: '125 GPa'
            mensaje: |
              Has dividido 250 MPa entre 0,002. El 0,002 es de dónde sale la
              paralela, no la deformación que tiene la probeta en el límite
              elástico. La pendiente se mide con un punto de la recta.
        pista: |
          En el recuadro, la recta pasa por $150\ \text{MPa}$ con una
          deformación de $0{,}0016$.
        desarrollo: |
          $$
          E = \frac{\Delta\sigma}{\Delta\varepsilon} = \frac{150 - 0}{0{,}0016 - 0}
          = 93\,750\ \text{MPa} \approx 93{,}8\ \text{GPa}
          $$

          Vale cualquier punto del tramo recto. La pendiente se lee con un
          margen de unos pocos gigapascales, y la casilla lo tiene en cuenta.

      - tipo: calcular
        titulo: El límite elástico
        pregunta: |
          Traza desde $\varepsilon = 0{,}002$ una paralela a la recta elástica.
          ¿A qué tensión corta la curva del recuadro?
        respuesta:
          tipo: magnitud
          valor: '250 MPa'
          tolerancia: 0.04
          formato: una tensión, con su unidad
        distractores:
          - valor: '183 MPa'
            mensaje: |
              Esa es la tensión de la curva **en** $\varepsilon = 0{,}002$. El
              límite convencional no se lee ahí: se lee donde la **paralela**
              trazada desde 0,002 corta la curva, bastante más a la derecha.
          - valor: '49 MPa'
            mensaje: |
              Has leído $\varepsilon = 0{,}002$ en la curva grande, donde el
              tramo inicial es una recta casi vertical que no se puede leer. La
              paralela se traza en el recuadro, que tiene la escala para ello.
        pista: |
          La paralela sube con la pendiente $E$ desde $(0{,}002;\ 0)$. Sigue
          subiendo hasta que toque la curva.
        desarrollo: |
          La paralela es $\sigma = E\,(\varepsilon - 0{,}002)$, y corta la curva
          del recuadro cerca de su extremo derecho, hacia
          $\varepsilon = 0{,}0047$:

          $$
          \sigma_y = 93\,800\cdot(0{,}00467 - 0{,}002) \approx 250\ \text{MPa}
          $$

          Es el valor que rotula la propia figura.

      - tipo: calcular
        titulo: La carga máxima
        pregunta: |
          La resistencia a la tracción, el máximo de la curva, está rotulada
          como 450 MPa. ¿Qué carga máxima soporta la probeta de 12,8 mm de
          diámetro?
        respuesta:
          tipo: magnitud
          valor: '57900 N'
          tolerancia: 0.03
          formato: una fuerza, con su unidad
        distractores:
          - valor: '231600 N'
            mensaje: |
              Has usado 12,8 mm como radio. Es el diámetro: el área es
              $\pi\cdot 6{,}4^{2}$, cuatro veces menos.
          - valor: '32170 N'
            mensaje: |
              Has multiplicado por el límite elástico, 250 MPa. Esa es la carga
              a la que empieza a deformarse para siempre, no la máxima: la
              curva sigue subiendo hasta 450.
        pista: |
          $F_{\max} = \sigma_{\text{TS}}\,A_0$, con el área **inicial** de la
          probeta.
        desarrollo: |
          $$
          F_{\max} = 450\cdot\pi\cdot 6{,}4^{2} = 450\cdot 128{,}7
          = 57\,906\ \text{N} \approx 5{,}79\cdot 10^{4}\ \text{N}
          $$

          Se usa el área inicial porque la tensión de la curva es la
          ingenieril: carga entre sección inicial.

      - tipo: calcular
        titulo: El alargamiento a 345 MPa
        pregunta: |
          ¿Qué deformación tiene la curva a 345 MPa, y cuánto se alarga
          entonces la probeta de 254 mm?
        respuesta:
          tipo: magnitud
          valor: '15.24 mm'
          tolerancia: 0.04
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.934 mm'
            mensaje: |
              Has usado la ley de Hooke, $345/93\,800\cdot 254$. A 345 MPa el
              latón ya ha pasado el límite elástico, y ahí la deformación no es
              $\sigma/E$: es mucho mayor, y se lee en la curva.
          - valor: '68.6 mm'
            mensaje: |
              Has leído la deformación del máximo de la curva, 0,27. El
              «máximo incremento» del enunciado es el que alcanza la probeta
              **a 345 MPa**, no el de la resistencia a la tracción.
        pista: |
          345 MPa es el punto A de la curva. Lee su deformación en el eje de
          abajo y multiplícala por $l_0$.
        desarrollo: |
          El punto A está en $\varepsilon \approx 0{,}06$:

          $$
          \Delta l = \varepsilon\,l_0 = 0{,}06\cdot 254 = 15{,}2\ \text{mm}
          $$

          Leyendo la curva con más detalle sale 0,062 y 15,7 mm, dentro del
          margen de una lectura a ojo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El módulo es la pendiente de la recta del recuadro: 150 MPa entre
              0,0016, unos 93,8 GPa.
          - texto: >-
              El límite elástico sale de la paralela trazada desde 0,002: corta
              la curva a 250 MPa.
          - texto: >-
              La carga máxima es la resistencia a la tracción por el área
              inicial: 450 · π · 6,4² = 5,79·10⁴ N.
          - texto: >-
              A 345 MPa la curva está en el punto A, con ε ≈ 0,06, y la probeta
              se alarga 0,06 · 254 = 15,2 mm.
          - texto: >-
              A 345 MPa el alargamiento sale de la ley de Hooke:
              345/93 800 · 254 = 0,93 mm.
            trampa: true
            mensaje: |
              345 MPa está por encima del límite elástico, 250 MPa. Pasado ese
              punto la curva se tumba y la deformación crece mucho más deprisa
              que $\sigma/E$: Hooke da una deformación dieciséis veces menor
              que la real. Por encima del límite, la deformación se lee en la
              curva.
    resolucion: |
      Todas las lecturas son de la «Curva tensión-deformación de un latón» de
      este tema.

      **a) El módulo elástico.** El tramo elástico solo se ve en el recuadro.
      Su recta pasa por $150\ \text{MPa}$ a $\varepsilon = 0{,}0016$:

      $$
      E = \frac{150}{0{,}0016} = 93\,750\ \text{MPa} \approx 93{,}8\ \text{GPa}
      $$

      **b) El límite elástico.** Se traza desde $\varepsilon = 0{,}002$ una
      paralela a esa recta, $\sigma = E\,(\varepsilon - 0{,}002)$. Corta la
      curva hacia $\varepsilon = 0{,}0047$, a $\sigma_y = 250\ \text{MPa}$.

      **c) La carga máxima.** Es la resistencia a la tracción, 450 MPa, por el
      área inicial de la probeta:

      $$
      F_{\max} = 450\cdot\pi\cdot 6{,}4^{2} = 5{,}79\cdot 10^{4}\ \text{N}
      $$

      **d) El alargamiento a 345 MPa.** Está por encima del límite elástico,
      así que la deformación no es $\sigma/E$: se lee en la curva, y es el
      punto A, con $\varepsilon \approx 0{,}06$:

      $$
      \Delta l = 0{,}06\cdot 254 = 15{,}2\ \text{mm}
      $$

      Coincide con los cuatro resultados del listado.

      > El máximo de la curva, medido sobre el trazo, queda en unos 441 MPa, un
      > 2 % por debajo de su rótulo de 450 MPa. Se usa el rótulo, que es el
      > dato que la figura da escrito; con 441 saldrían 56 700 N, y la casilla
      > acepta los dos.

  - id: ejcm2-col226-una-probeta-de-laton-en-zona-elastica
    titulo: Una probeta del mismo latón, en zona elástica
    fuente: >-
      Ejercicio 2.26 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Supongamos un latón que presenta la curva $\sigma$-$\varepsilon$ del
      ejercicio 2.25. Una probeta de $10\ \text{mm}$ de diámetro y
      $101{,}6\ \text{mm}$ de longitud se somete a tracción con una carga de
      $10000\ \text{N}$. Si el coeficiente de Poisson es de $0{,}35$ calcula:

      a) alargamiento de la probeta,

      b) disminución del diámetro.
    pide: El alargamiento de la probeta y cuánto baja su diámetro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de usar la ley de Hooke con el módulo del 2.25, ¿qué hay que
          comprobar?
        opciones:
          - texto: >-
              Que la tensión, la carga entre la sección, no pase del límite
              elástico del latón, 250 MPa
            correcta: true
            mensaje: |
              Eso es. $\sigma = E\,\varepsilon$ solo vale en el tramo recto de
              la curva. Si la tensión pasara de 250 MPa habría que leer la
              deformación en la curva, como en el apartado d) del 2.25.
          - texto: >-
              Que la carga no pase de la carga máxima del 2.25, 5,79·10⁴ N
            mensaje: |
              Esa carga es la de rotura de otra probeta, de 12,8 mm. Y aunque la
              probeta no rompa, por encima del límite elástico Hooke ya no vale:
              la frontera que importa es el límite elástico, no la rotura.
          - texto: >-
              Nada: si el enunciado da el coeficiente de Poisson, la
              deformación es elástica
            mensaje: |
              El coeficiente de Poisson relaciona la deformación lateral con la
              axial, pero no garantiza nada sobre la tensión. Que la probeta
              trabaje en zona elástica hay que comprobarlo con los números.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta de 10 mm con 10 000 N?
        respuesta:
          tipo: magnitud
          valor: '127.3 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '31.8 MPa'
            mensaje: |
              Has usado 10 mm como radio, o $\pi d^{2}$ sin dividir entre 4. La
              sección es $\pi\cdot 5^{2} = 78{,}5\ \text{mm}^{2}$.
        pista: |
          $\sigma = F/A_0$, con $A_0 = \pi d_0^{2}/4$. Newton entre milímetro
          cuadrado es megapascal.
        desarrollo: |
          $$
          \sigma = \frac{10\,000}{\pi\cdot 5^{2}} = \frac{10\,000}{78{,}54} = 127{,}3\ \text{MPa}
          $$

          Por debajo de los 250 MPa del límite elástico: zona elástica.

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          Con el módulo del 2.25, $E = 93{,}8\ \text{GPa}$, ¿cuánto se alarga la
          probeta de 101,6 mm?
        respuesta:
          tipo: magnitud
          valor: '0.138 mm'
          tolerancia: 0.04
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.524 mm'
            mensaje: |
              Has sacado el módulo de la curva grande, unos 25 GPa. Esa
              pendiente no es la del tramo elástico, que solo se ve en el
              recuadro: allí el módulo es 93,8 GPa.
          - valor: '0.0345 mm'
            mensaje: |
              Arrastras la sección mal calculada: con 10 mm como radio la
              tensión sale cuatro veces menor, y el alargamiento también.
        pista: |
          $\varepsilon = \sigma/E$ y $\Delta l = \varepsilon\,l_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{127{,}3}{93\,800} = 1{,}357\cdot 10^{-3}
          \qquad
          \Delta l = 1{,}357\cdot 10^{-3}\cdot 101{,}6 = 0{,}138\ \text{mm}
          $$

      - tipo: calcular
        titulo: La disminución del diámetro
        pregunta: |
          Con $\nu = 0{,}35$, ¿cuánto se reduce el diámetro de 10 mm?
        respuesta:
          tipo: magnitud
          valor: '0.00475 mm'
          tolerancia: 0.04
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.0136 mm'
            mensaje: |
              Te has saltado el coeficiente de Poisson: has encogido el
              diámetro en la misma proporción en que se alarga la probeta. La
              contracción lateral es solo el 35 % de la axial.
          - valor: '0.0483 mm'
            mensaje: |
              Has multiplicado la deformación lateral por la **longitud**,
              101,6 mm. La deformación lateral se aplica al diámetro, 10 mm.
          - valor: '0.0388 mm'
            mensaje: |
              Has dividido entre $\nu$ en vez de multiplicar. La deformación
              lateral es **menor** que la axial: $\varepsilon_x = -\nu\,\varepsilon_z$.
        pista: |
          $\varepsilon_x = -\nu\,\varepsilon_z$ y $\Delta d = \varepsilon_x\,d_0$.
        desarrollo: |
          $$
          \varepsilon_x = -0{,}35\cdot 1{,}357\cdot 10^{-3} = -4{,}75\cdot 10^{-4}
          $$

          $$
          \Delta d = -4{,}75\cdot 10^{-4}\cdot 10 = -4{,}75\cdot 10^{-3}\ \text{mm}
          $$

          El signo dice que el diámetro baja. El listado da 4,9·10⁻³; la
          resolución explica de dónde sale, y la casilla acepta los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              σ = 10 000/(π · 5²) = 127,3 MPa, por debajo de los 250 MPa del
              límite elástico: la probeta trabaja en zona elástica.
          - texto: >-
              ε = 127,3/93 800 = 1,36·10⁻³, y Δl = ε · 101,6 = 0,138 mm.
          - texto: >-
              La deformación lateral es −ν ε = −4,75·10⁻⁴, y el diámetro baja
              4,75·10⁻³ mm.
          - texto: >-
              El diámetro se reduce en la misma proporción en que se alarga la
              probeta: 1,36·10⁻³ · 10 = 0,0136 mm.
            trampa: true
            mensaje: |
              Eso sería un coeficiente de Poisson de 1. La contracción lateral
              es solo una fracción $\nu$ de la deformación axial: aquí el 35 %,
              y el diámetro baja 4,75·10⁻³ mm.
    resolucion: |
      **Primero, si es elástico.** La tensión es

      $$
      \sigma = \frac{10\,000}{\pi\cdot 5^{2}} = 127{,}3\ \text{MPa}
      $$

      por debajo de los 250 MPa de límite elástico que da la curva del 2.25.
      Vale la ley de Hooke con $E = 93\,800\ \text{MPa}$.

      **a) El alargamiento.**

      $$
      \varepsilon_z = \frac{127{,}3}{93\,800} = 1{,}357\cdot 10^{-3}
      \qquad
      \Delta l = 1{,}357\cdot 10^{-3}\cdot 101{,}6 = 0{,}138\ \text{mm}
      $$

      **b) La disminución del diámetro.**

      $$
      \Delta d = -\nu\,\varepsilon_z\,d_0 = -0{,}35\cdot 1{,}357\cdot 10^{-3}\cdot 10
      = -4{,}75\cdot 10^{-3}\ \text{mm}
      $$

      El diámetro baja $4{,}75\cdot 10^{-3}$ mm. El a) coincide con los
      0,14 mm del listado.

      > El listado publica $4{,}9\cdot 10^{-3}$ mm para el b). Sale de redondear
      > antes la deformación: con $\varepsilon_z \approx 0{,}0014$, que es
      > 0,14 mm entre 101,6, queda $0{,}35\cdot 0{,}0014\cdot 10 = 4{,}9\cdot 10^{-3}$.
      > Sin redondear sale 4,75, un 3 % menos. La casilla acepta los dos.

  - id: ejcm2-col227-la-curva-del-magnesio
    titulo: La curva de la aleación de magnesio, punto a punto
    fuente: >-
      Ejercicio 2.27 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      Una probeta de una aleación de magnesio de sección rectangular
      $3{,}2\ \text{mm} \times 19{,}1\ \text{mm}$ se deforma a tracción.
      Construye la curva tensión-deformación a partir de los datos de la tabla
      y calcula:

      | Carga (N) | Longitud (mm) |
      |---|---|
      | 0 | 63,5 |
      | 1380 | 63,53 |
      | 2780 | 63,58 |
      | 5630 | 63,63 |
      | 7430 | 63,7 |
      | 8140 | 63,75 |
      | 9870 | 64,14 |
      | 12850 | 65,41 |
      | 14100 | 66,68 |
      | 14340 | 67,92 |
      | 13830 | 69,22 |
      | 12500 | 70,49 |

      a) Módulo elástico.

      b) Límite elástico a deformación de $0{,}002$.

      c) Resistencia a tracción de la aleación.

      d) Alargamiento relativo porcentual.

      e) ¿Cuáles serán las nuevas dimensiones de la sección al soportar
      $8000\ \text{N}$, si su coeficiente de Poisson es de $0{,}29$?
    pide: El módulo, el límite elástico, la resistencia a tracción, el alargamiento y las dimensiones de la sección bajo 8000 N.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se pasa de la tabla a la curva tensión-deformación?
        opciones:
          - texto: >-
              Cada carga entre la sección inicial, 61,12 mm², y cada
              alargamiento entre la longitud inicial, 63,5 mm
            correcta: true
            mensaje: |
              Eso es: $\sigma = F/A_0$ y $\varepsilon = (l - l_0)/l_0$. Es la
              curva nominal, y sobre ella se definen el módulo, el límite
              elástico y la resistencia a tracción.
          - texto: >-
              Cada carga entre la sección inicial, y cada longitud de la tabla
              como deformación
            mensaje: |
              63,53 es una longitud, no una deformación. La deformación es lo
              que se ha alargado respecto de la inicial: $0{,}03/63{,}5$.
          - texto: >-
              Cada carga entre la sección de ese momento, que va menguando
            mensaje: |
              Eso da la tensión real, y la tabla no dice cuánto mide la
              sección en cada punto. La curva que se pide es la nominal, con
              la sección inicial.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico? Tómalo del tramo recto del
          principio.
        respuesta:
          tipo: magnitud
          valor: '45000 MPa'
          # Los datos no fijan E mejor que un ±10 %: las longitudes vienen a la
          # centésima de milímetro, así que la deformación de los primeros
          # puntos tiene un error de 1,6·10⁻⁴, y el primero sale con un 33 %.
          # Con 0,12 entran el punto de 5630 N (45,0 GPa) y la regresión de los
          # cuatro primeros (40,2 GPa); los dos distractores quedan a más del
          # 90 %.
          tolerancia: 0.12
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '1858 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. Esa recta atraviesa
              toda la zona plástica: el módulo es la pendiente del tramo
              **recto** del principio, antes de que la curva se doble.
          - valor: '3371 MPa'
            mensaje: |
              Has tomado el punto de carga máxima. Ahí la deformación es casi
              toda plástica, y la ley de Hooke hace rato que no vale.
        pista: |
          Calcula $\sigma/\varepsilon$ en los primeros puntos. El que está más
          lejos del origen sin haberse doblado todavía es el más fiable.
        desarrollo: |
          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 1380 | 22,6 | 0,00047 | 47,8 |
          | 2780 | 45,5 | 0,00126 | 36,1 |
          | 5630 | 92,1 | 0,00205 | 45,0 |
          | 7430 | 121,6 | 0,00315 | 38,6 |
          | 8140 | 133,2 | 0,00394 | 33,8 |

          Los dos primeros bailan mucho: con la longitud a la centésima, el
          primer alargamiento es 0,03 mm y un error de 0,01 es un 33 %. El de
          5630 N ya es fiable y da $E \approx 45\ \text{GPa}$, que es el
          módulo típico del magnesio. A partir de 7430 N el cociente baja: la
          curva se está doblando.

      - tipo: calcular
        titulo: El límite elástico
        pregunta: |
          Con la paralela al tramo elástico trazada por $\varepsilon = 0{,}002$,
          ¿cuánto vale el límite elástico?
        respuesta:
          tipo: magnitud
          valor: '139 MPa'
          tolerancia: 0.04
          formato: una tensión, con su unidad
        distractores:
          - valor: '89.3 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. El 0,002 es donde
              **empieza** la paralela, en el eje de deformaciones; el límite
              es donde esa paralela corta a la curva, bastante más a la
              derecha.
          - valor: '234.6 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico está donde empieza la deformación plástica, muy
              por debajo.
        pista: |
          La paralela es $\sigma = E\,(\varepsilon - 0{,}002)$. Busca entre qué
          dos puntos de la tabla pasa de estar por debajo de la curva a estar
          por encima.
        desarrollo: |
          Con $E = 45\,000\ \text{MPa}$, la paralela queda por debajo de la
          curva en el punto de 8140 N y por encima en el de 9870 N. Entre los
          dos, la curva es $\sigma = 133{,}2 + 4609\,(\varepsilon - 0{,}00394)$,
          y el corte está en

          $$
          \varepsilon = 0{,}00508
          \qquad
          \sigma_y = 45\,000\cdot(0{,}00508 - 0{,}002) = 138\ \text{MPa}
          $$

          Con $E = 40\ \text{GPa}$ sale 140 MPa: el límite elástico apenas
          depende de cuál de los dos módulos se use.

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '234.6 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '204.5 MPa'
            mensaje: |
              Esa es la tensión del último punto, el de rotura. Tras la
              estricción la carga baja; la resistencia a tracción es la
              tensión **máxima**, la de 14 340 N.
        pista: |
          La carga máxima de la tabla entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{14\,340}{3{,}2\cdot 19{,}1} = \frac{14\,340}{61{,}12}
          = 234{,}6\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento relativo porcentual?
        respuesta:
          tipo: numero
          valor: '11.0'
          # Absoluta: acepta 11,0 (longitud en rotura, la fórmula del curso) y
          # 10,6 (restando la recuperación elástica, que es lo riguroso).
          tolerancia: 0.6
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '9.92'
            mensaje: |
              Has dividido entre la longitud final, 70,49 mm. El alargamiento
              relativo se refiere a la longitud inicial, 63,5 mm.
          - valor: '6.96'
            mensaje: |
              Has usado la longitud de la carga máxima, 67,92 mm. Eso es solo
              el alargamiento uniforme, hasta la estricción; la ductilidad
              cuenta hasta la rotura, en el último punto.
        pista: |
          $\%EL = (l_f - l_0)/l_0\cdot 100$, con $l_f$ la longitud en rotura,
          el último punto.
        desarrollo: |
          $$
          \%EL = \frac{70{,}49 - 63{,}5}{63{,}5}\cdot 100 = 11{,}0\ \%
          $$

          En rigor, al romper la probeta recupera su parte elástica,
          $204{,}5/45\,000 = 0{,}45\ \%$, y el alargamiento permanente sería
          un 10,6 %. Las transparencias usan la longitud en rotura, y la
          casilla acepta los dos.

      - tipo: calcular
        titulo: El lado ancho bajo 8000 N
        pregunta: |
          Con $8000\ \text{N}$, ¿cuánto cambia el lado de $19{,}1\ \text{mm}$?
          Dalo con su signo.
        respuesta:
          tipo: magnitud
          valor: '-0.0161 mm'
          # Relativa amplia por lo mismo que el módulo: con E = 40 GPa sale
          # -0,0181, un 12 % más. Los distractores quedan a más del 200 %.
          tolerancia: 0.13
          formato: un cambio de longitud con su signo y su unidad
        distractores:
          - valor: '0.0161 mm'
            mensaje: |
              El número es bueno y el signo no. En tracción la sección
              **mengua**: los dos lados se acortan, así que el cambio es
              negativo.
          - valor: '-0.0556 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has aplicado la
              deformación axial al lado de la sección. La transversal es
              $\nu$ veces la axial, un 29 %.
          - valor: '-0.192 mm'
            mensaje: |
              Has dividido entre el Poisson en vez de multiplicar.
              $\nu = -\varepsilon_x/\varepsilon_z$, así que
              $\varepsilon_x = -\nu\,\varepsilon_z$, más pequeña que la axial.
        pista: |
          $\sigma = 8000/61{,}12$; compruébala contra el límite elástico,
          $\varepsilon_z = \sigma/E$ y $\varepsilon_x = -\nu\,\varepsilon_z$.
        desarrollo: |
          $$
          \sigma = \frac{8000}{61{,}12} = 130{,}9\ \text{MPa} < 139\ \text{MPa}
          $$

          Está en la zona elástica y vale Hooke:

          $$
          \varepsilon_z = \frac{130{,}9}{45\,000} = 2{,}91\cdot 10^{-3}
          \qquad
          \varepsilon_x = -0{,}29\cdot 2{,}91\cdot 10^{-3} = -8{,}44\cdot 10^{-4}
          $$

          $$
          \Delta b = 19{,}1\cdot(-8{,}44\cdot 10^{-4}) = -0{,}0161\ \text{mm}
          \qquad
          \Delta a = 3{,}2\cdot(-8{,}44\cdot 10^{-4}) = -0{,}0027\ \text{mm}
          $$

          La sección queda en $3{,}197 \times 19{,}084\ \text{mm}$.

      - tipo: justificar
        pregunta: Ordena la lectura de la curva. Una pieza es falsa.
        piezas:
          - texto: >-
              El tramo recto da un módulo de unos 45 GPa; los dos primeros
              puntos, medidos a la centésima de milímetro, dispersan mucho.
          - texto: >-
              La paralela trazada por 0,002 corta la curva a unos 139 MPa: ese
              es el límite elástico.
          - texto: >-
              La carga máxima, 14 340 N, da la resistencia a tracción:
              234,6 MPa.
          - texto: >-
              Con 8000 N la tensión es 130,9 MPa, por debajo del límite
              elástico, así que las nuevas dimensiones salen de Hooke y
              Poisson.
          - texto: >-
              La resistencia a tracción es la tensión del último punto,
              porque es donde rompe la probeta.
            trampa: true
            mensaje: |
              El último punto es la rotura, a 204,5 MPa. Tras la estricción
              la carga baja, así que la tensión nominal en rotura es menor que
              la máxima. La resistencia a tracción es el máximo de la curva.
    resolucion: |
      **La curva.** Sección $A_0 = 3{,}2\cdot 19{,}1 = 61{,}12\ \text{mm}^{2}$
      y $l_0 = 63{,}5\ \text{mm}$:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 1380 | 22,6 | 0,00047 |
      | 2780 | 45,5 | 0,00126 |
      | 5630 | 92,1 | 0,00205 |
      | 7430 | 121,6 | 0,00315 |
      | 8140 | 133,2 | 0,00394 |
      | 9870 | 161,5 | 0,0101 |
      | 12850 | 210,2 | 0,0301 |
      | 14100 | 230,7 | 0,0501 |
      | 14340 | 234,6 | 0,0696 |
      | 13830 | 226,3 | 0,0901 |
      | 12500 | 204,5 | 0,1101 |

      **a) Módulo.** Del tramo recto, $E \approx 45\ \text{GPa}$. Los datos
      no dan más precisión: una regresión con los cuatro primeros puntos sale
      40 GPa, y el primer punto solo, 48.

      **b) Límite elástico.** La paralela $\sigma = 45\,000(\varepsilon -
      0{,}002)$ corta la curva entre 8140 y 9870 N:
      $\sigma_y \approx 139\ \text{MPa}$.

      **c) Resistencia a tracción.**
      $R_m = 14\,340/61{,}12 = 234{,}6\ \text{MPa}$.

      **d) Alargamiento.** $\%EL = (70{,}49 - 63{,}5)/63{,}5 = 11{,}0\ \%$;
      descontando la recuperación elástica en la rotura, 10,6 %.

      **e) La sección con 8000 N.** $\sigma = 130{,}9\ \text{MPa}$, en zona
      elástica, con una deformación transversal de

      $$
      \varepsilon_x = -0{,}29\cdot\frac{130{,}9}{45\,000} = -8{,}44\cdot 10^{-4}
      $$

      y la sección pasa a $3{,}197 \times 19{,}084\ \text{mm}$.

      **Lo que hay que llevarse.** Unos datos reales no dan un módulo de
      cuatro cifras. Cuando las longitudes se miden a la centésima, los
      primeros puntos son los menos fiables; se usa el más alejado que siga
      en la recta, y conviene decir con qué punto se ha hecho.
  - id: ejcm2-col228-la-probeta-de-cobre-entera
    titulo: La probeta de cobre, del primer punto a la rotura
    fuente: >-
      Ejercicio 2.28 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      En la siguiente tabla se presentan los datos obtenidos al ensayar una
      probeta estándar de cobre de $1{,}3\ \text{cm}$ de diámetro:

      | Carga (N) | Longitud (cm) | Carga (N) | Longitud (cm) |
      |---|---|---|---|
      | 0 | 5,08 | 46700 | 5,1816 |
      | 13350 | 5,0842 | 53400 | 5,7404 |
      | 26700 | 5,0884 | 55150 | 6,35 (carga max.) |
      | 33360 | 5,0905 | 50700 | 7,67 (rotura) |
      | 40000 | 5,1028 | | |

      La longitud final de la probeta es $7{,}65\ \text{cm}$ y su diámetro
      $0{,}95\ \text{cm}$. Dibuja la curva tensión-deformación
      ($\sigma$-$\varepsilon$) y calcula el límite elástico a $0{,}2\ \%$ de
      deformación, la resistencia a tracción, el módulo elástico, el
      alargamiento relativo (%), la reducción de área (%), la tensión nominal y
      real en el punto de fractura.
    pide: El límite elástico, la resistencia a tracción, el módulo, el alargamiento, la reducción de área y las tensiones nominal y real en la fractura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al final hay dos longitudes: 7,67 cm en la rotura y 7,65 cm de
          longitud final. ¿Cuál va en el alargamiento relativo?
        opciones:
          - texto: >-
              7,65 cm, la de la probeta rota y recompuesta, sin la parte
              elástica
            correcta: true
            mensaje: |
              Eso es. Al romper, la carga desaparece y la probeta recupera su
              deformación elástica. El alargamiento relativo mide lo que
              queda: la deformación permanente.
          - texto: >-
              7,67 cm, la del instante de la rotura
            mensaje: |
              Esa longitud es con la carga todavía puesta, e incluye la parte
              elástica que se recupera al romper. Aquí son dos décimas de
              milímetro, pero el enunciado da la final a propósito.
          - texto: >-
              6,35 cm, la de la carga máxima
            mensaje: |
              Esa es la deformación uniforme, hasta que empieza la estricción.
              La ductilidad cuenta la deformación hasta la rotura.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico?
        respuesta:
          tipo: magnitud
          valor: '121700 MPa'
          tolerancia: 0.02
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '67150 MPa'
            mensaje: |
              Has usado el punto de 40 000 N, que ya se ha salido de la recta.
              Los tres primeros dan el mismo cociente, 121,6 GPa; el cuarto
              da la mitad, y eso es la señal de que ha empezado a plastificar.
          - valor: '749 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. El módulo es la
              pendiente del tramo recto del principio, no de la curva entera.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 6{,}5^{2}\ \text{mm}^{2}$, y
          $\varepsilon = (l-l_0)/l_0$. Mira en qué puntos $\sigma/\varepsilon$
          se mantiene.
        desarrollo: |
          $A_0 = \pi\cdot 6{,}5^{2} = 132{,}7\ \text{mm}^{2}$ y
          $l_0 = 5{,}08\ \text{cm}$:

          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 13350 | 100,6 | 0,000827 | 121,7 |
          | 26700 | 201,2 | 0,001654 | 121,7 |
          | 33360 | 251,3 | 0,002067 | 121,6 |
          | 40000 | 301,4 | 0,004488 | 67,1 |

          Los tres primeros están en la recta: $E = 121{,}7\ \text{GPa}$.

      - tipo: calcular
        titulo: El límite elástico al 0,2 %
        pregunta: |
          ¿Cuánto vale el límite elástico con el criterio del 0,2 %?
        respuesta:
          tipo: magnitud
          valor: '301 MPa'
          tolerancia: 0.03
          formato: una tensión, con su unidad
        distractores:
          - valor: '243 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. Ahí es donde
              **empieza** la paralela; el límite es donde la paralela corta a
              la curva.
          - valor: '415.5 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico marca el principio de la deformación plástica.
        pista: |
          La paralela es $\sigma = 121\,700\,(\varepsilon - 0{,}002)$.
          Compárala con la curva en el punto de 33 360 N y en el de 40 000 N.
        desarrollo: |
          En el punto de 33 360 N la paralela vale $121\,700\cdot 0{,}000067 =
          8\ \text{MPa}$, muy por debajo de la curva. En el de 40 000 N vale
          $121\,700\cdot 0{,}002488 = 302{,}8\ \text{MPa}$, justo por encima
          de los 301,4 de la curva. El corte está casi encima de ese punto:

          $$
          \sigma_y \approx 301\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '415.5 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '382 MPa'
            mensaje: |
              Esa es la tensión en la rotura. Después de la carga máxima la
              carga baja; la resistencia a tracción es el máximo, 55 150 N.
          - valor: '1662 MPa'
            mensaje: |
              Has calculado la sección con el radio y además dividido entre
              cuatro. O $\pi r^{2}$ o $\pi d^{2}/4$: la sección es 132,7 mm².
        pista: |
          La carga máxima entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{55\,150}{132{,}7} = 415{,}5\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento relativo, en porcentaje?
        respuesta:
          tipo: numero
          valor: '50.6'
          tolerancia: 0.25
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '51.0'
            mensaje: |
              Has usado la longitud en la rotura, 7,67 cm, con la carga
              puesta. La longitud final es 7,65: la de la probeta rota, cuando
              ya ha recuperado su parte elástica.
          - valor: '25.0'
            mensaje: |
              Has usado la longitud de la carga máxima, 6,35 cm. Eso es el
              alargamiento uniforme; la ductilidad se mide en la rotura.
          - valor: '33.6'
            mensaje: |
              Has dividido entre la longitud final. El alargamiento relativo
              se refiere a la inicial, 5,08 cm.
        pista: |
          $\%EL = (l_f - l_0)/l_0\cdot 100$ con $l_f = 7{,}65\ \text{cm}$.
        desarrollo: |
          $$
          \%EL = \frac{7{,}65 - 5{,}08}{5{,}08}\cdot 100 = 50{,}6\ \%
          $$

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la reducción de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '46.6'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '26.9'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área va
              con $d^{2}$: $(0{,}95/1{,}3)^{2} = 0{,}534$.
          - valor: '87.3'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la sección inicial, y por eso nunca pasa del 100 %.
        pista: |
          $\%AR = \left(1 - (d_f/d_0)^{2}\right)\cdot 100$.
        desarrollo: |
          $$
          \%AR = \left(1 - \left(\frac{0{,}95}{1{,}3}\right)^{2}\right)\cdot 100
          = 46{,}6\ \%
          $$

      - tipo: calcular
        titulo: La tensión real en la fractura
        pregunta: |
          ¿Cuánto vale la tensión **real** en el punto de fractura?
        respuesta:
          tipo: magnitud
          valor: '715 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '382 MPa'
            mensaje: |
              Esa es la nominal, que también se pide: la carga de rotura
              entre la sección inicial. La real divide entre la sección del
              cuello, 70,9 mm².
          - valor: '577 MPa'
            mensaje: |
              Has usado $\sigma_T = \sigma(1+\varepsilon)$. Esa relación
              supone que la probeta se estira por igual en toda su longitud, y
              deja de valer con la estricción. En la fractura hay que ir al
              área.
          - valor: '204 MPa'
            mensaje: |
              Has invertido el cociente de áreas. La sección del cuello es
              menor, así que la tensión real sale **mayor** que la nominal.
        pista: |
          $\sigma_T = F_{\text{rotura}}/A_f$ con $A_f = \pi\cdot 4{,}75^{2}$.
        desarrollo: |
          $$
          \sigma_{\text{nominal}} = \frac{50\,700}{132{,}7} = 382\ \text{MPa}
          $$

          $$
          A_f = \pi\cdot 4{,}75^{2} = 70{,}9\ \text{mm}^{2}
          \qquad
          \sigma_T = \frac{50\,700}{70{,}9} = 715\ \text{MPa}
          $$

      - tipo: dibujar
        consigna: |
          Dibuja la curva $\sigma$–$\varepsilon$ con los puntos de la tabla
          pasados a tensión y deformación nominales,
          $A_0 = 132{,}7\ \text{mm}^{2}$ y $l_0 = 50{,}8\ \text{mm}$. A la
          escala de la curva entera el tramo elástico es una raya vertical,
          así que haz además un detalle del principio, hasta
          $\varepsilon \approx 0{,}006$, con la paralela del 0,2 %.
        comprueba:
          - punto: >-
              Los ejes con su magnitud y su unidad: $\varepsilon$, sin unidad,
              en horizontal y hasta algo más de 0,5, y $\sigma$ en MPa en
              vertical, hasta unos 450.
            porque: >-
              La tabla da cargas en newtons y longitudes en centímetros, y el
              enunciado pide la curva tensión-deformación. Carga frente a
              longitud da la misma forma con otros números, y ninguna de las
              propiedades que se piden se lee en esos ejes.
          - punto: >-
              En el detalle, los tres primeros puntos alineados con el origen
              en una recta de pendiente $E = 121{,}7\ \text{GPa}$, y el de
              40 000 N ya fuera de ella.
            porque: >-
              El módulo es la pendiente del tramo recto, y el dibujo es lo que
              dice qué puntos forman ese tramo: el cuarto da un cociente de
              67 GPa porque ya ha plastificado. En la curva entera no se ve,
              porque los cinco primeros puntos caen en el mismo milímetro.
          - punto: >-
              La paralela a la recta elástica trazada desde
              $\varepsilon = 0{,}002$, cortando la curva junto al punto de
              40 000 N: $\sigma_y \approx 301\ \text{MPa}$.
            porque: >-
              El criterio del 0,2 % es una construcción gráfica, y el enunciado
              la pide con esas palabras. La paralela empieza en 0,002 del eje;
              el límite está donde corta a la curva. Leer la curva en 0,002 da
              243 MPa, que es el primer error del paso del límite elástico.
          - punto: >-
              El máximo, 415,5 MPa en $\varepsilon = 0{,}25$, marcado como
              resistencia a tracción, y la curva bajando a partir de ahí.
            porque: >-
              Hasta la carga máxima la probeta se deforma por igual; desde ahí
              empieza la estricción y la deformación se concentra en el cuello
              (diapositiva 37 del tema). La curva nominal baja porque divide
              la carga entre la sección inicial, no porque el material se
              ablande.
          - punto: >-
              La rotura marcada al final de la curva, a 382 MPa y
              $\varepsilon = 0{,}51$.
            porque: >-
              Es la tensión nominal de fractura que pide el enunciado. La real,
              715 MPa, no va en esta curva: sale de dividir la misma carga
              entre la sección del cuello, y la curva que se dibuja es la
              nominal.
        figura: |
          <svg viewBox="0 0 340 442" role="img" width="340" height="442" aria-labelledby="cm2-d228-t cm2-d228-d">
