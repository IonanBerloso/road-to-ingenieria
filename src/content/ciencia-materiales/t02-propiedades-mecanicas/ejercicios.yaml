ejercicios:
  - id: ejcm2-de-la-fuerza-al-alargamiento
    titulo: De la fuerza a la tensión, y de la tensión al alargamiento
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ley de Hooke del
      Tema 2 de la asignatura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una barra de acero de $20\ \text{mm}$ de diámetro y $2\ \text{m}$ de
      longitud soporta una carga de tracción de $31{,}4\ \text{kN}$. Con
      $E = 200\ \text{GPa}$, y suponiendo que la deformación es elástica,
      calcula la tensión en la barra y su alargamiento.
    pide: La tensión y el alargamiento de la barra.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para la tensión hace falta una sección. ¿Cuál?
        opciones:
          - texto: La sección transversal, el círculo de 20 mm de diámetro
            correcta: true
            mensaje: |
              Eso es. La fuerza actúa perpendicular a esa sección, y la tensión
              es la fuerza repartida sobre ella:
              $A_0 = \pi d^{2}/4 = 314{,}2\ \text{mm}^{2}$.
          - texto: La superficie lateral de la barra, que es la que está en contacto con el aire
            mensaje: |
              La superficie lateral no soporta la carga: la carga la atraviesa
              a lo largo. La tensión de tracción se reparte sobre la sección
              perpendicular a la fuerza.
          - texto: Un círculo de 20 mm de radio
            mensaje: |
              Los 20 mm son el **diámetro**. Con 20 de radio la sección sería
              cuatro veces mayor y la tensión, cuatro veces menor.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la barra?
        respuesta:
          tipo: magnitud
          valor: '99.95 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '25 MPa'
            mensaje: |
              Has calculado la sección como $\pi d^{2}$, con el diámetro donde
              iba el radio. La sección de un círculo es $\pi r^{2}$, o
              $\pi d^{2}/4$: cuatro veces menos de lo que has puesto.
          - valor: '0.09995 MPa'
            mensaje: |
              Mil veces de menos: has dejado la fuerza en kilonewtons. Con los
              milímetros cuadrados, la fuerza tiene que ir en newtons para que
              salgan megapascales: 31 400 N.
        pista: |
          $\sigma = F/A_0$, con $F$ en newtons y $A_0$ en milímetros cuadrados.
        desarrollo: |
          $$
          A_0 = \frac{\pi \cdot 20^{2}}{4} = 314{,}16\ \text{mm}^{2}
          \qquad
          \sigma = \frac{31\,400}{314{,}16} = 99{,}95\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga la barra?
        respuesta:
          tipo: magnitud
          valor: '1 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1000 mm'
            mensaje: |
              Has mezclado megapascales con gigapascales: $100/200$ da una
              deformación de 0,5, un 50 %, que ningún acero aguanta en la zona
              elástica. El módulo son $200\,000\ \text{MPa}$.
          - valor: '0.5 mm'
            mensaje: |
              Has multiplicado la deformación por un metro, no por dos. El
              alargamiento es la deformación por la longitud **inicial**
              entera: 2000 mm.
        pista: |
          $\varepsilon = \sigma/E$, y después $\Delta l = \varepsilon\,l_0$.
        desarrollo: |
          $$
          \varepsilon = \frac{99{,}95}{200\,000} = 5{,}0\cdot 10^{-4}
          \qquad
          \Delta l = 5{,}0\cdot 10^{-4} \cdot 2000 = 1{,}0\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La fuerza se reparte sobre la sección transversal: eso da una tensión de unos 100 MPa.'
          - texto: 'En la zona elástica la deformación es la tensión partida por el módulo, 5·10⁻⁴.'
          - texto: 'Y el alargamiento es esa deformación por la longitud inicial: un milímetro en dos metros.'
          - texto: 'Con el doble de sección y la misma fuerza, la barra se alargaría lo mismo, porque la fuerza no ha cambiado.'
            trampa: true
            mensaje: |
              Se alargaría la mitad. La deformación responde a la **tensión**,
              no a la fuerza: con el doble de sección, la misma fuerza da la
              mitad de tensión y la mitad de alargamiento.
    resolucion: |
      **Primero la tensión, que es lo que el material nota.** La carga se
      reparte sobre la sección transversal:

      $$
      A_0 = \frac{\pi \cdot 20^{2}}{4} = 314{,}16\ \text{mm}^{2}
      \qquad
      \sigma = \frac{31\,400}{314{,}16} = 99{,}95\ \text{MPa}
      $$

      **Después la ley de Hooke**, con el módulo en las mismas unidades que la
      tensión, $200\ \text{GPa} = 200\,000\ \text{MPa}$:

      $$
      \varepsilon = \frac{99{,}95}{200\,000} = 5{,}0\cdot 10^{-4}
      \qquad
      \Delta l = 5{,}0\cdot 10^{-4} \cdot 2000 = 1{,}0\ \text{mm}
      $$

      Un milímetro en dos metros. Es lo que se estira un acero trabajando a una
      tensión corriente, y sirve de referencia: si un problema de este tipo te
      da centímetros, algo se ha escrito en otras unidades.

  - id: ejcm2-lo-que-queda-al-descargar
    titulo: Lo que se queda estirado al soltar
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la recuperación
      elástica del Tema 2 de la asignatura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una barra de $200\ \text{mm}$ de un material con
      $E = 100\ \text{GPa}$ y límite elástico de $200\ \text{MPa}$, que una vez
      pasado ese límite se deforma sin que aumente la tensión, se estira hasta
      medir $201\ \text{mm}$. Después se descarga. ¿Cuánto se queda estirada?
    pide: El alargamiento permanente después de descargar.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al descargar, ¿qué parte de la deformación se recupera?
        opciones:
          - texto: Solo la elástica, y la barra baja por una recta paralela a la zona elástica
            correcta: true
            mensaje: |
              Exacto. La deformación total es la plástica más la elástica. Al
              soltar se recupera la elástica, con la misma pendiente $E$, y la
              plástica se queda.
          - texto: Toda, porque al quitar la carga desaparece la tensión
            mensaje: |
              Eso solo pasa si la barra no ha salido de la zona elástica. Aquí
              ha pasado el límite elástico, y la parte plástica es permanente:
              no se recupera al quitar la carga.
          - texto: Nada, porque una vez que plastifica la deformación ya es permanente entera
            mensaje: |
              La parte elástica se recupera siempre, también después de
              plastificar. Por eso una pieza doblada «rebota» un poco al
              soltarla.

      - tipo: calcular
        titulo: La deformación que se recupera
        pregunta: |
          ¿Cuánto se acorta la barra al descargar?
        respuesta:
          tipo: magnitud
          valor: '0.4 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1 mm'
            mensaje: |
              Eso sería recuperar el alargamiento entero, como si no hubiera
              pasado el límite elástico. Solo se recupera la parte elástica:
              la que corresponde a los 200 MPa del límite.
          - valor: '0.6 mm'
            mensaje: |
              Eso es lo que se **queda**, no lo que se recupera. Has cambiado
              las dos partes de sitio.
        pista: |
          La parte elástica es la del límite elástico: $\varepsilon_y = \sigma_y/E$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{200}{100\,000} = 0{,}002
          \qquad
          0{,}002 \cdot 200 = 0{,}4\ \text{mm}
          $$

      - tipo: calcular
        titulo: El alargamiento permanente
        pregunta: |
          ¿Cuánto se queda estirada la barra después de descargar?
        respuesta:
          tipo: magnitud
          valor: '0.6 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.4 mm'
            mensaje: |
              Esa es la parte que se **recupera**. Lo que se queda es el resto:
              el milímetro total menos esos 0,4.
          - valor: '1 mm'
            mensaje: |
              Ese es el alargamiento con la carga puesta. Al soltar se recupera
              la parte elástica —0,4 mm—, así que no se queda estirada entero:
              solo la plástica.
        pista: |
          Deformación total, menos la elástica que se recupera.
        desarrollo: |
          $$
          \Delta l_{\text{perm}} = 1 - 0{,}4 = 0{,}6\ \text{mm}
          $$

          La barra vuelve a 200,6 mm, no a 200.

      - tipo: justificar
        pregunta: Ordena lo que le pasa a la barra. Una pieza es falsa.
        piezas:
          - texto: 'La barra se estira hasta una deformación total de 0,005, más que los 0,002 del límite elástico.'
          - texto: 'Al descargar recupera la parte elástica, 0,002, por una recta paralela a la zona elástica.'
          - texto: 'Se queda con la parte plástica: 0,003, o sea 0,6 mm.'
          - texto: 'Al descargar vuelve por la misma curva por la que se cargó, y por eso acaba en el origen.'
            trampa: true
            mensaje: |
              Solo en la zona elástica se vuelve por el mismo camino. Una vez
              pasado el límite, la descarga va por una recta **paralela** a la
              elástica y no llega al origen: corta el eje en la deformación
              plástica, que es la que se queda.
    resolucion: |
      **La deformación total es la suma de la plástica y la elástica**, y al
      descargar solo se recupera la segunda. La barra se ha estirado hasta:

      $$
      \varepsilon = \frac{1}{200} = 0{,}005
      $$

      La parte elástica es la del límite elástico, y es la que se recupera:

      $$
      \varepsilon_y = \frac{200}{100\,000} = 0{,}002
      \qquad
      0{,}002 \cdot 200 = 0{,}4\ \text{mm}
      $$

      Lo que queda es la plástica:

      $$
      \Delta l_{\text{perm}} = 1 - 0{,}4 = 0{,}6\ \text{mm}
      $$

      La barra vuelve a 200,6 mm. Al soltar recorre una recta **paralela** a
      la zona elástica, con la misma pendiente $E$, que corta el eje en la
      deformación plástica. Es la figura del tema, y es el problema 2.16 de la
      colección con otros números.

  - id: ejcm2-col21-la-deformacion-de-una-barra-de-acero
    titulo: La deformación de una barra de acero
    fuente: >-
      Ejercicio 2.1 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra de $10\ \text{mm}$ de diámetro de un acero es sometida a una
      carga de tracción de $50000\ \text{N}$. Sabiendo que el módulo elástico,
      $E$, es de $200\ \text{GPa}$, calcula la deformación elástica que
      experimenta la probeta.
    pide: La deformación elástica de la barra, que es un número sin unidades.
    pasos:
      - tipo: reconocer
        pregunta: |
          Te dan una fuerza y te piden una deformación. ¿Qué hay que calcular
          antes de usar la ley de Hooke?
        opciones:
          - texto: >-
              La tensión, dividiendo la fuerza entre la sección inicial de la
              barra
            correcta: true
            mensaje: |
              Eso es. La ley de Hooke, $\sigma = E\,\varepsilon$, relaciona la
              deformación con la **tensión**, no con la fuerza. Primero
              $\sigma = F/A_0$ y después se despeja $\varepsilon$.
          - texto: >-
              Nada: la deformación es la fuerza partida por el módulo elástico
            mensaje: |
              Las unidades no cuadran: newtons entre megapascales dan milímetros
              cuadrados, no una deformación. La barra no responde a la fuerza
              sino a la fuerza **por unidad de área**.
          - texto: >-
              La longitud de la barra, porque sin ella no hay deformación
            mensaje: |
              La longitud hace falta para pasar de deformación a alargamiento,
              $\Delta l = \varepsilon\,l_0$. Aquí piden $\varepsilon$ misma, que
              es adimensional y no depende de lo larga que sea la barra.

      - tipo: calcular
        titulo: La tensión en la barra
        pregunta: |
          ¿Qué tensión soporta la barra?
        respuesta:
          tipo: magnitud
          valor: '636.6 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '159.2 MPa'
            mensaje: |
              Has usado los $10\ \text{mm}$ como radio. Son el diámetro: el
              radio es 5, y como el área va al cuadrado, tomar el diámetro por
              radio divide la tensión entre cuatro.
          - valor: '5000 MPa'
            mensaje: |
              Has dividido entre $10\ \text{mm}^{2}$, como si el área fuera el
              diámetro a secas. La sección de una barra circular es
              $\pi d^{2}/4$.
        pista: |
          $A_0 = \pi d^{2}/4$ en milímetros cuadrados, y entonces
          $\sigma = F/A_0$ sale directamente en MPa, porque
          $1\ \text{MPa} = 1\ \text{N/mm}^{2}$.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 10^{2}}{4} = 78{,}54\ \text{mm}^{2}
          \qquad
          \sigma = \frac{50000}{78{,}54} = 636{,}6\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La deformación
        pregunta: |
          ¿Cuánto vale la deformación elástica $\varepsilon$?
        respuesta:
          tipo: numero
          valor: '0.003183'
          tolerancia: 0.00005
          formato: un número sin unidades, por ejemplo 1.5e-3
        distractores:
          - valor: '3.183'
            mensaje: |
              Has dividido megapascales entre gigapascales. El módulo hay que
              pasarlo a las mismas unidades que la tensión:
              $200\ \text{GPa} = 200000\ \text{MPa}$. Una deformación de 3 sería
              que la barra se estira el triple de su longitud, y ningún acero
              aguanta eso en régimen elástico.
          - valor: '0.000796'
            mensaje: |
              Arrastras la tensión de haber tomado el diámetro como radio. Con
              el área buena, $78{,}54\ \text{mm}^{2}$, la tensión es cuatro veces
              mayor y la deformación también.
        pista: |
          $\varepsilon = \sigma/E$, con los dos en MPa.
        desarrollo: |
          $$
          \varepsilon = \frac{\sigma}{E} = \frac{636{,}6}{200000}
          = 3{,}18\cdot 10^{-3}
          $$

          Es un 0,318 %: tres milímetros por cada metro de barra.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La sección inicial es $\pi d^{2}/4 = 78{,}54\ \text{mm}^{2}$, y
              con ella la tensión vale $636{,}6\ \text{MPa}$.
          - texto: >-
              Con $E = 200000\ \text{MPa}$, la ley de Hooke da
              $\varepsilon = \sigma/E = 3{,}18\cdot 10^{-3}$.
          - texto: >-
              La deformación es adimensional —milímetros entre milímetros—, y
              no depende de la longitud de la barra.
          - texto: >-
              Una barra del mismo acero pero del doble de diámetro se
              deformaría la mitad con la misma carga.
            trampa: true
            mensaje: |
              El diámetro entra **al cuadrado** en la sección. El doble de
              diámetro es cuatro veces más área, cuatro veces menos tensión y
              cuatro veces menos deformación, no la mitad.
    resolucion: |
      **La tensión.** La ley de Hooke habla de tensión, así que lo primero es
      pasar la fuerza a tensión con la sección inicial:

      $$
      A_0 = \frac{\pi d^{2}}{4} = \frac{\pi\cdot 10^{2}}{4} = 78{,}54\ \text{mm}^{2}
      \qquad
      \sigma = \frac{F}{A_0} = \frac{50000}{78{,}54} = 636{,}6\ \text{MPa}
      $$

      **La deformación.** Con el módulo en las mismas unidades,
      $E = 200\ \text{GPa} = 200000\ \text{MPa}$:

      $$
      \varepsilon = \frac{\sigma}{E} = \frac{636{,}6}{200000} = 3{,}18\cdot 10^{-3}
      $$

      Coincide con el resultado del listado. Es un 0,318 %.

      **Lo que hay que llevarse.** Dos costumbres que salvan medio tema:
      trabaja en newtons y milímetros, que dan la tensión directamente en MPa,
      y pasa siempre el módulo a MPa antes de dividir. El fallo de dejar los
      GPa da un 3,18 sin exponente, que es el mismo número con mil veces más
      de deformación.

  - id: ejcm2-col22-la-elongacion-de-una-pieza-de-cobre
    titulo: La elongación de una pieza de cobre
    fuente: >-
      Ejercicio 2.2 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una pieza de cobre de $305\ \text{mm}$ de longitud inicial se ensaya a
      tracción con una tensión de $276\ \text{MPa}$. Suponiendo que toda la
      deformación causada es elástica, calcula la elongación de la pieza.
      Módulo elástico del Cu: $11\cdot 10^{4}\ \text{MPa}$.
    pide: El alargamiento de la pieza, en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          Esta vez el enunciado da directamente la tensión. ¿Qué dos
          relaciones llevan de ella al alargamiento?
        opciones:
          - texto: >-
              La ley de Hooke para sacar la deformación, y la definición de
              deformación para pasar a milímetros
            correcta: true
            mensaje: |
              Exacto: $\varepsilon = \sigma/E$ y después
              $\Delta l = \varepsilon\,l_0$. Juntas dan
              $\Delta l = \sigma\,l_0/E$.
          - texto: >-
              La tensión entre la longitud, y el resultado entre el módulo
            mensaje: |
              Dividir la tensión entre la longitud no tiene sentido físico: la
              longitud **multiplica**. Una pieza el doble de larga, con la misma
              deformación unitaria, se alarga el doble.
          - texto: >-
              Hace falta la sección de la pieza para calcular la fuerza primero
            mensaje: |
              La fuerza solo sirve para llegar a la tensión, y la tensión ya te
              la dan. Por eso el enunciado no dice ni la sección ni la carga.

      - tipo: calcular
        titulo: La elongación
        pregunta: |
          ¿Cuánto se alarga la pieza?
        respuesta:
          tipo: magnitud
          valor: '0.765 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '7.65 mm'
            mensaje: |
              Has tomado el módulo como $11\cdot 10^{3}$. Es
              $11\cdot 10^{4} = 110000\ \text{MPa}$: un exponente menos da diez
              veces más alargamiento.
          - valor: '0.00251 mm'
            mensaje: |
              Eso es la deformación, $\varepsilon = 2{,}51\cdot 10^{-3}$, con
              milímetros pegados. Falta multiplicar por la longitud inicial,
              $305\ \text{mm}$.
        pista: |
          $\Delta l = \dfrac{\sigma\,l_0}{E}$, con la longitud en milímetros.
        desarrollo: |
          $$
          \varepsilon = \frac{276}{110000} = 2{,}509\cdot 10^{-3}
          \qquad
          \Delta l = 2{,}509\cdot 10^{-3}\cdot 305 = 0{,}765\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Toda la deformación es elástica, así que vale la ley de Hooke:
              $\varepsilon = \sigma/E = 2{,}51\cdot 10^{-3}$.
          - texto: >-
              El alargamiento es la deformación por la longitud inicial:
              $\Delta l = 2{,}51\cdot 10^{-3}\cdot 305 = 0{,}765\ \text{mm}$.
          - texto: >-
              Al retirar la tensión, la pieza vuelve a sus $305\ \text{mm}$.
          - texto: >-
              Si la pieza tuviera el doble de sección, con la misma tensión se
              alargaría la mitad.
            trampa: true
            mensaje: |
              Con la misma **tensión** el alargamiento no cambia: la sección
              solo entra al pasar de fuerza a tensión. Una pieza el doble de
              gruesa necesita el doble de fuerza para llegar a
              $276\ \text{MPa}$, pero una vez ahí se estira lo mismo.
    resolucion: |
      **La deformación.** Con la hipótesis de que todo es elástico:

      $$
      \varepsilon = \frac{\sigma}{E} = \frac{276}{11\cdot 10^{4}} = 2{,}509\cdot 10^{-3}
      $$

      **El alargamiento.** De la definición $\varepsilon = \Delta l/l_0$:

      $$
      \Delta l = \varepsilon\,l_0 = 2{,}509\cdot 10^{-3}\cdot 305 = 0{,}765\ \text{mm}
      $$

      Coincide con el resultado del listado.

      **Lo que hay que llevarse.** La fórmula compacta
      $\Delta l = \sigma\,l_0/E$ dice todo el tema en una línea: más tensión y
      más longitud alargan más; más módulo, menos. La sección no aparece,
      porque ya está dentro de la tensión.

  - id: ejcm2-col23-la-longitud-inicial-de-una-probeta-de-niquel
    titulo: La longitud inicial de una probeta de níquel
    fuente: >-
      Ejercicio 2.3 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se aplica una carga de $8900\ \text{N}$ a una probeta cilíndrica de
      níquel de $10{,}2\ \text{mm}$ de diámetro y se requiere que únicamente
      sufra deformación elástica (módulo elástico
      $= 20{,}7\cdot 10^{4}\ \text{MPa}$). ¿Cuál es la longitud de la probeta antes de la
      deformación, si el alargamiento elástico máximo es de
      $0{,}22\ \text{mm}$?
    pide: La longitud inicial de la probeta, en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí la incógnita es la longitud inicial. ¿Por dónde se llega a ella?
        opciones:
          - texto: >-
              Por la deformación: la carga da la tensión, Hooke da
              $\varepsilon$, y $l_0 = \Delta l/\varepsilon$
            correcta: true
            mensaje: |
              Eso es. La deformación no depende de la longitud, así que se
              puede calcular sin conocerla. Luego el alargamiento máximo fija
              cuánta longitud cabe.
          - texto: >-
              Multiplicando el alargamiento por la deformación
            mensaje: |
              Es la relación al revés. $\varepsilon = \Delta l/l_0$, así que
              $l_0 = \Delta l/\varepsilon$: se **divide**. Multiplicar daría
              una longitud de diezmilésimas de milímetro.
          - texto: >-
              No se puede: faltan datos de la longitud en el enunciado
            mensaje: |
              No faltan. La deformación unitaria sale de la carga, el diámetro y
              el módulo, y el alargamiento te lo dan. Con esas dos cosas la
              longitud queda fijada.

      - tipo: calcular
        titulo: La deformación
        pregunta: |
          ¿Cuánto vale la deformación elástica de la probeta?
        respuesta:
          tipo: numero
          valor: '0.000526'
          tolerancia: 0.000005
          formato: un número sin unidades, por ejemplo 5e-4
        distractores:
          - valor: '0.0001315'
            mensaje: |
              Has usado los $10{,}2\ \text{mm}$ como radio. Con el área cuatro
              veces mayor, la tensión y la deformación salen cuatro veces
              menores.
          - valor: '0.00526'
            mensaje: |
              Has tomado el módulo como $20{,}7\cdot 10^{3}$. Es
              $20{,}7\cdot 10^{4} = 207000\ \text{MPa}$.
        pista: |
          $\sigma = F/(\pi d^{2}/4)$ y después $\varepsilon = \sigma/E$.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 10{,}2^{2}}{4} = 81{,}71\ \text{mm}^{2}
          \qquad
          \sigma = \frac{8900}{81{,}71} = 108{,}9\ \text{MPa}
          $$

          $$
          \varepsilon = \frac{108{,}9}{207000} = 5{,}26\cdot 10^{-4}
          $$

      - tipo: calcular
        titulo: La longitud inicial
        pregunta: |
          ¿Qué longitud tenía la probeta?
        respuesta:
          tipo: magnitud
          valor: '418.1 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '1672 mm'
            mensaje: |
              Arrastras el diámetro tomado como radio: con una deformación
              cuatro veces menor, la longitud sale cuatro veces mayor.
          - valor: '41.8 mm'
            mensaje: |
              Arrastras el módulo con un exponente de menos. Con
              $E = 207000\ \text{MPa}$ la deformación es diez veces menor y la
              probeta, diez veces más larga.
        pista: |
          $l_0 = \Delta l/\varepsilon$.
        desarrollo: |
          $$
          l_0 = \frac{\Delta l}{\varepsilon} = \frac{0{,}22}{5{,}262\cdot 10^{-4}}
          = 418{,}1\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              La deformación unitaria depende de la tensión y del módulo, no de
              la longitud, así que se calcula primero:
              $\varepsilon = 5{,}26\cdot 10^{-4}$.
          - texto: >-
              Como $\Delta l = \varepsilon\,l_0$, la longitud que corresponde a
              un alargamiento de $0{,}22\ \text{mm}$ es
              $l_0 = 0{,}22/\varepsilon \approx 418\ \text{mm}$.
          - texto: >-
              Una probeta más larga, con la misma carga, se alargaría más de
              $0{,}22\ \text{mm}$: $418\ \text{mm}$ es la longitud máxima.
          - texto: >-
              Una probeta más larga soportaría peor la carga y acabaría
              deformándose plásticamente.
            trampa: true
            mensaje: |
              La plasticidad la decide la **tensión**, $108{,}9\ \text{MPa}$, y
              la tensión no depende de la longitud. Una probeta más larga se
              alarga más milímetros, pero cada milímetro de ella está igual de
              cargado.
    resolucion: |
      **La tensión y la deformación.** Ninguna de las dos necesita la longitud:

      $$
      A_0 = \frac{\pi\cdot 10{,}2^{2}}{4} = 81{,}71\ \text{mm}^{2}
      \qquad
      \sigma = \frac{8900}{81{,}71} = 108{,}9\ \text{MPa}
      \qquad
      \varepsilon = \frac{108{,}9}{207000} = 5{,}262\cdot 10^{-4}
      $$

      **La longitud.** El alargamiento es la deformación por la longitud, así
      que:

      $$
      l_0 = \frac{\Delta l}{\varepsilon} = \frac{0{,}22}{5{,}262\cdot 10^{-4}}
      = 418{,}1\ \text{mm}
      $$

      El listado publica $417{,}9\ \text{mm}$. La diferencia, de dos décimas
      en cuatrocientos milímetros, es del redondeo intermedio: si se toma
      $\varepsilon = 5{,}265\cdot 10^{-4}$ sale exactamente 417,9. Las dos
      cifras son la misma respuesta.

      **Lo que hay que llevarse.** Aquí el alargamiento es un límite, y la
      longitud que sale es la **máxima**: una probeta más larga se estiraría
      más de $0{,}22\ \text{mm}$ con la misma carga.

  - id: ejcm2-col24-un-hilo-de-titanio-en-pulgadas
    titulo: Un hilo de titanio, en pulgadas y libras
    fuente: >-
      Ejercicio 2.4 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Consideramos un hilo cilíndrico de titanio con un diámetro de
      $0{,}12\ \text{in}$ (pulgadas) y una longitud de $1000$ pulgadas. ¿Qué
      alargamiento experimentará cuando se le aplica una carga de
      $112\ \text{lb}_\text{f}$ (libras)? Supón que la deformación es
      elástica. Dato: Módulo elástico del Ti: $15{,}5\cdot 10^{6}\ \text{psi}$
      (libras por pulgada cuadrada).
    pide: El alargamiento del hilo, en pulgadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Todo viene en unidades anglosajonas. ¿Hace falta pasarlo al Sistema
          Internacional?
        opciones:
          - texto: >-
              No: libras entre pulgadas cuadradas ya son psi, así que el
              sistema es coherente y el alargamiento sale en pulgadas
            correcta: true
            mensaje: |
              Exacto. Lo que importa es que las unidades sean coherentes entre
              sí, no que sean del SI. Fuerza en $\text{lb}_\text{f}$ y área en
              $\text{in}^{2}$ dan tensión en psi, que es la unidad del módulo.
          - texto: >-
              Sí, todo a newtons y milímetros, o la ley de Hooke no vale
            mensaje: |
              Hooke vale en cualquier sistema coherente. Convertir no está mal,
              pero son cuatro conversiones y cuatro ocasiones de equivocarse
              para acabar en el mismo resultado.
          - texto: >-
              Solo el módulo, porque los psi no son una unidad de tensión
            mensaje: |
              Sí lo son: el propio enunciado lo dice, libras por pulgada
              cuadrada. Es fuerza entre área, igual que un megapascal es un
              newton por milímetro cuadrado.

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga el hilo?
        respuesta:
          tipo: magnitud
          valor: '0.639 in'
          tolerancia: 0.02
          formato: una longitud, con su unidad (in, o mm si lo conviertes)
        distractores:
          - valor: '0.1597 in'
            mensaje: |
              Has usado $0{,}12$ como radio. Es el diámetro: el radio es
              $0{,}06\ \text{in}$, y al ir al cuadrado el error divide el
              alargamiento entre cuatro.
          - valor: '0.0639 in'
            mensaje: |
              Se te ha ido una coma al elevar al cuadrado:
              $0{,}06^{2} = 0{,}0036$, no $0{,}036$. Con un área diez veces
              mayor, el alargamiento sale diez veces menor.
        pista: |
          $A_0 = \pi d^{2}/4$ en $\text{in}^{2}$, $\sigma = F/A_0$ en psi y
          $\Delta l = \sigma\,l_0/E$.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 0{,}12^{2}}{4} = 0{,}01131\ \text{in}^{2}
          \qquad
          \sigma = \frac{112}{0{,}01131} = 9903\ \text{psi}
          $$

          $$
          \Delta l = \frac{\sigma\,l_0}{E} = \frac{9903\cdot 1000}{15{,}5\cdot 10^{6}}
          = 0{,}639\ \text{in}
          $$

          En milímetros son $16{,}2\ \text{mm}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Libras, pulgadas y psi forman un sistema coherente, así que se
              trabaja sin convertir.
          - texto: >-
              La tensión es $112/(\pi\cdot 0{,}12^{2}/4) = 9903\ \text{psi}$.
          - texto: >-
              La deformación vale $9903/15{,}5\cdot 10^{6} = 6{,}39\cdot 10^{-4}$,
              y por mil pulgadas de hilo da $0{,}639\ \text{in}$.
          - texto: >-
              La deformación sale en pulgadas por pulgada, así que es distinta
              de la que saldría en milímetros por milímetro.
            trampa: true
            mensaje: |
              La deformación es adimensional: pulgadas entre pulgadas o
              milímetros entre milímetros dan el mismo $6{,}39\cdot 10^{-4}$.
              Solo el alargamiento, que sí tiene unidades, cambia de cifra al
              convertir.
    resolucion: |
      **Las unidades.** Fuerza en $\text{lb}_\text{f}$, longitudes en pulgadas
      y módulo en psi —libras por pulgada cuadrada— forman un sistema
      coherente. No hace falta convertir nada.

      **La tensión.**

      $$
      A_0 = \frac{\pi\cdot 0{,}12^{2}}{4} = 0{,}01131\ \text{in}^{2}
      \qquad
      \sigma = \frac{112}{0{,}01131} = 9903\ \text{psi}
      $$

      **El alargamiento.**

      $$
      \varepsilon = \frac{9903}{15{,}5\cdot 10^{6}} = 6{,}39\cdot 10^{-4}
      \qquad
      \Delta l = 6{,}39\cdot 10^{-4}\cdot 1000 = 0{,}639\ \text{in}
      $$

      Coincide con el resultado del listado. Son unos $16{,}2\ \text{mm}$ en un
      hilo de 25 metros.

      **Lo que hay que llevarse.** Las fórmulas no saben de sistemas de
      unidades, solo de coherencia. Si fuerza, área y módulo casan entre sí,
      la cuenta sale directa; mezclar libras con megapascales es donde se
      rompe.

  - id: ejcm2-col25-la-tension-de-una-carga-en-kilos
    titulo: La tensión de una carga dada en kilos
    fuente: >-
      Ejercicio 2.5 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra metálica de $1{,}25\ \text{cm}$ de diámetro está sometida a
      una carga de $2500\ \text{kg}$. Calcula la tensión que soporta la barra
      en MPa.
    pide: La tensión en la barra, en megapascales.
    pasos:
      - tipo: reconocer
        pregunta: |
          La carga viene en kilogramos. ¿Qué hay que hacer con ella?
        opciones:
          - texto: >-
              Pasarla a newtons multiplicando por $g$: es el peso de una masa
              de 2500 kg
            correcta: true
            mensaje: |
              Eso es. Un kilogramo es masa; lo que tira de la barra es su peso,
              $F = m\,g = 2500\cdot 9{,}8 = 24500\ \text{N}$.
          - texto: >-
              Nada: un kilo de carga es un newton
            mensaje: |
              Un kilogramo pesa unos $9{,}8\ \text{N}$, no uno. Tomarlo como un
              newton da una tensión casi diez veces menor que la real.
          - texto: >-
              Dividirla entre $g$, porque la tensión se da en unidades de masa
            mensaje: |
              Al revés: la tensión es fuerza entre área, y para pasar de masa a
              fuerza se **multiplica** por $g$.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la barra?
        respuesta:
          tipo: magnitud
          valor: '199.6 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '20.4 MPa'
            mensaje: |
              Has dividido 2500 entre el área, sin pasar los kilos a newtons.
              Falta multiplicar por $g = 9{,}8\ \text{m/s}^{2}$.
          - valor: '49.9 MPa'
            mensaje: |
              Has usado $12{,}5\ \text{mm}$ como radio. Es el diámetro: el
              radio es $6{,}25\ \text{mm}$.
          - valor: '19964 MPa'
            mensaje: |
              Has dejado el diámetro en centímetros. Newtons entre centímetros
              cuadrados no son megapascales: para que salgan MPa el área tiene
              que ir en $\text{mm}^{2}$, y
              $1{,}25\ \text{cm} = 12{,}5\ \text{mm}$.
        pista: |
          $F = m\,g$, $A_0 = \pi d^{2}/4$ con $d$ en milímetros, y
          $\sigma = F/A_0$.
        desarrollo: |
          $$
          F = 2500\cdot 9{,}8 = 24500\ \text{N}
          \qquad
          A_0 = \frac{\pi\cdot 12{,}5^{2}}{4} = 122{,}7\ \text{mm}^{2}
          $$

          $$
          \sigma = \frac{24500}{122{,}7} = 199{,}6\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga de 2500 kg es una masa; la fuerza sobre la barra es su
              peso, $24500\ \text{N}$.
          - texto: >-
              Con el diámetro en milímetros, $A_0 = 122{,}7\ \text{mm}^{2}$, y
              newtons entre milímetros cuadrados son megapascales.
          - texto: >-
              $\sigma = 24500/122{,}7 \approx 200\ \text{MPa}$.
          - texto: >-
              Si la barra fuera más larga, con la misma carga la tensión sería
              menor.
            trampa: true
            mensaje: |
              La tensión es fuerza entre **sección**, y la longitud no aparece.
              Una barra más larga se alarga más milímetros, pero soporta la
              misma tensión.
    resolucion: |
      **La fuerza.** El enunciado da una masa colgada. Lo que carga la barra
      es su peso:

      $$
      F = m\,g = 2500\cdot 9{,}8 = 24500\ \text{N}
      $$

      **La sección, en milímetros.** Para que la tensión salga en MPa,
      $1{,}25\ \text{cm} = 12{,}5\ \text{mm}$:

      $$
      A_0 = \frac{\pi\cdot 12{,}5^{2}}{4} = 122{,}7\ \text{mm}^{2}
      \qquad
      \sigma = \frac{24500}{122{,}7} = 199{,}6\ \text{MPa} \approx 200\ \text{MPa}
      $$

      Coincide con el resultado del listado. Con $g = 9{,}81$ sale 199,8: la
      misma respuesta.

      **Lo que hay que llevarse.** En este tema las cargas llegan en kilos o
      en toneladas con mucha frecuencia. Son masas, y antes de dividir por
      nada hay que multiplicarlas por $g$.

  - id: ejcm2-col26-el-diametro-que-permite-un-alargamiento
    titulo: El diámetro que permite un alargamiento dado
    fuente: >-
      Ejercicio 2.6 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra metálica cilíndrica de módulo
      $E = 20{,}7\cdot 10^{4}\ \text{MPa}$ y límite elástico de
      $310\ \text{MPa}$ va a ser sometida a una carga de $11000\ \text{N}$. Si
      la longitud de la barra es de $510\ \text{mm}$, ¿cuál debe ser el
      diámetro para permitir un alargamiento de $0{,}38\ \text{mm}$?
    pide: El diámetro de la barra, en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da un límite elástico y un alargamiento. ¿Cuál de los
          dos fija el diámetro?
        opciones:
          - texto: >-
              El alargamiento, que fija la deformación y con ella la tensión;
              el límite elástico solo sirve para comprobar que Hooke vale
            correcta: true
            mensaje: |
              Eso es. De $0{,}38\ \text{mm}$ en $510\ \text{mm}$ sale
              $\varepsilon$, de Hooke sale $\sigma$ y de la carga, el área.
              Después se mira que esa $\sigma$ quede por debajo de
              $310\ \text{MPa}$; si no, Hooke no se podría usar.
          - texto: >-
              El límite elástico: el área es la carga partida por
              $310\ \text{MPa}$
            mensaje: |
              Eso da el diámetro mínimo para que la barra **no plastifique**,
              que es otra pregunta. Con ese diámetro la barra se estiraría más
              de $0{,}38\ \text{mm}$.
          - texto: >-
              Los dos a la vez, así que el problema tiene dos soluciones
            mensaje: |
              El diámetro que da exactamente $0{,}38\ \text{mm}$ es uno solo. El
              límite elástico no es una segunda ecuación: es una condición que
              ese diámetro tiene que cumplir.

      - tipo: calcular
        titulo: La tensión que corresponde al alargamiento
        pregunta: |
          ¿Qué tensión produce un alargamiento de $0{,}38\ \text{mm}$ en esta
          barra?
        respuesta:
          tipo: magnitud
          valor: '154.2 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '310 MPa'
            mensaje: |
              Ese es el límite elástico, un techo que la tensión no puede
              pasar. La tensión que da $0{,}38\ \text{mm}$ hay que calcularla
              con Hooke.
          - valor: '78660 MPa'
            mensaje: |
              Has multiplicado el módulo por el alargamiento en milímetros. La
              ley de Hooke va con la **deformación**, que es el alargamiento
              partido por la longitud: $0{,}38/510$.
        pista: |
          $\varepsilon = \Delta l/l_0$ y $\sigma = E\,\varepsilon$.
        desarrollo: |
          $$
          \varepsilon = \frac{0{,}38}{510} = 7{,}451\cdot 10^{-4}
          \qquad
          \sigma = 207000\cdot 7{,}451\cdot 10^{-4} = 154{,}2\ \text{MPa}
          $$

          Por debajo de $310\ \text{MPa}$: la deformación es elástica y Hooke
          vale.

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Qué diámetro debe tener la barra?
        respuesta:
          tipo: magnitud
          valor: '9.53 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '4.76 mm'
            mensaje: |
              Ese es el radio. De $A = \pi r^{2}$ sale $r$; el diámetro es el
              doble.
          - valor: '6.72 mm'
            mensaje: |
              Has partido la carga entre el límite elástico. Ese es el diámetro
              más pequeño que aguanta sin plastificar, y con él la barra se
              estiraría $0{,}76\ \text{mm}$, el doble de lo permitido.
        pista: |
          $A_0 = F/\sigma$ y $d = \sqrt{4A_0/\pi}$.
        desarrollo: |
          $$
          A_0 = \frac{11000}{154{,}2} = 71{,}32\ \text{mm}^{2}
          \qquad
          d = \sqrt{\frac{4\cdot 71{,}32}{\pi}} = 9{,}53\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El alargamiento permitido fija la deformación,
              $\varepsilon = 0{,}38/510 = 7{,}45\cdot 10^{-4}$.
          - texto: >-
              Con Hooke, esa deformación pide una tensión de
              $154{,}2\ \text{MPa}$, que está por debajo del límite elástico:
              la hipótesis elástica se sostiene.
          - texto: >-
              La sección que da esa tensión con $11000\ \text{N}$ es
              $71{,}3\ \text{mm}^{2}$, es decir un diámetro de
              $9{,}53\ \text{mm}$.
          - texto: >-
              Una barra más delgada también valdría, porque seguiría por debajo
              del límite elástico.
            trampa: true
            mensaje: |
              Seguiría siendo elástica hasta $6{,}72\ \text{mm}$, sí, pero se
              alargaría **más** de $0{,}38\ \text{mm}$: menos sección, más
              tensión, más deformación. Aquí manda el alargamiento, y
              $9{,}53\ \text{mm}$ es el diámetro mínimo.
    resolucion: |
      **La deformación y la tensión.** El alargamiento permitido fija la
      deformación, y Hooke la tensión:

      $$
      \varepsilon = \frac{\Delta l}{l_0} = \frac{0{,}38}{510} = 7{,}451\cdot 10^{-4}
      \qquad
      \sigma = E\,\varepsilon = 207000\cdot 7{,}451\cdot 10^{-4} = 154{,}2\ \text{MPa}
      $$

      Como $154{,}2 < 310\ \text{MPa}$, la barra trabaja en régimen elástico
      y el uso de Hooke está justificado.

      **El diámetro.**

      $$
      A_0 = \frac{F}{\sigma} = \frac{11000}{154{,}2} = 71{,}32\ \text{mm}^{2}
      \qquad
      d = \sqrt{\frac{4A_0}{\pi}} = 9{,}53\ \text{mm}
      $$

      Coincide con el resultado del listado.

      **Lo que hay que llevarse.** Cuando un enunciado da dos límites —de
      tensión y de alargamiento— hay que ver cuál manda. Aquí el de
      alargamiento pide $9{,}53\ \text{mm}$ y el de tensión solo
      $6{,}72\ \text{mm}$: manda el más exigente, y el otro se comprueba.

  - id: ejcm2-col27-el-modulo-de-cortadura-de-un-magnesio
    titulo: El módulo de cortadura de una aleación de magnesio
    fuente: >-
      Ejercicio 2.7 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      A una probeta de una aleación de magnesio con sección rectangular
      ($h = 10\ \text{mm}$) se le realiza un ensayo de cortadura. En el ensayo
      se mide un desplazamiento reversible, bajo una tensión de cortadura de
      $\tau = 18\ \text{MPa}$, de $\Delta x = 0{,}01\ \text{mm}$ en la
      dirección de la tensión. Calcula el valor del módulo de cortadura o
      módulo de Coulomb.

      *La figura del listado muestra un bloque de altura $h$ con la base
      fija. Sobre su cara superior, de área $S$, actúa una fuerza $F$
      paralela a ella; esa cara se desplaza $\Delta x$ en la dirección de
      $F$, y las caras laterales se inclinan un ángulo $\theta$ respecto de
      la vertical.*
    pide: El módulo de cortadura G, en megapascales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En cortadura, ¿qué papel hace la deformación y cómo se calcula?
        opciones:
          - texto: >-
              Es la deformación angular, $\gamma = \tan\theta = \Delta x/h$, y
              se relaciona con la tensión por $\tau = G\,\gamma$
            correcta: true
            mensaje: |
              Eso es. En cortadura la cara no se aleja, se **desliza**. La
              deformación es la tangente del ángulo que se inclina el bloque, y
              el papel de $E$ lo hace $G$.
          - texto: >-
              Es $\Delta x$ directamente, porque ya es un desplazamiento
            mensaje: |
              Un desplazamiento tiene unidades; una deformación no. Igual que
              en tracción se divide el alargamiento entre la longitud, aquí se
              divide el deslizamiento entre la altura.
          - texto: >-
              Es el ángulo $\theta$ en grados
            mensaje: |
              La deformación de cortadura es $\tan\theta$, un número puro. En
              grados el ángulo sale $0{,}057$, casi sesenta veces más que la
              tangente, y el módulo sale sesenta veces más bajo.

      - tipo: calcular
        titulo: La deformación angular
        pregunta: |
          ¿Cuánto vale $\gamma$?
        respuesta:
          tipo: numero
          valor: '0.001'
          tolerancia: 0.00002
          formato: un número sin unidades
        distractores:
          - valor: '1000'
            mensaje: |
              Has dividido al revés, la altura entre el desplazamiento. La
              deformación es lo que se desplaza la cara por cada milímetro de
              altura: $\Delta x/h$.
          - valor: '0.0573'
            mensaje: |
              Eso es el ángulo en grados. La deformación es $\tan\theta$, que
              para ángulos tan pequeños coincide con el ángulo **en radianes**:
              $0{,}001$.
        pista: |
          $\gamma = \tan\theta = \Delta x/h$, con las dos longitudes en
          milímetros.
        desarrollo: |
          $$
          \gamma = \frac{\Delta x}{h} = \frac{0{,}01}{10} = 1\cdot 10^{-3}
          $$

      - tipo: calcular
        titulo: El módulo de Coulomb
        pregunta: |
          ¿Cuánto vale $G$?
        respuesta:
          tipo: magnitud
          valor: '18000 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad (en MPa)
        distractores:
          - valor: '1800 MPa'
            mensaje: |
              Has dividido la tensión entre $\Delta x$ sin pasar por la
              altura. $G = \tau/\gamma$, y $\gamma = 0{,}01/10$, no $0{,}01$.
          - valor: '314 MPa'
            mensaje: |
              Has usado el ángulo en grados. La deformación de cortadura es la
              tangente, adimensional, y aquí vale $10^{-3}$.
          - valor: '0.018 MPa'
            mensaje: |
              Arrastras la deformación calculada al revés, $h/\Delta x$. Un
              módulo de 0,018 MPa sería más blando que una goma.
        pista: |
          $G = \tau/\gamma$.
        desarrollo: |
          $$
          G = \frac{\tau}{\gamma} = \frac{18}{10^{-3}} = 18000\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El desplazamiento es reversible, así que la deformación es
              elástica y vale $\tau = G\,\gamma$.
          - texto: >-
              La deformación angular es
              $\gamma = \Delta x/h = 0{,}01/10 = 10^{-3}$.
          - texto: >-
              $G = 18/10^{-3} = 18000\ \text{MPa}$, que es $18\ \text{GPa}$.
          - texto: >-
              Como las aleaciones de magnesio tienen $E \approx 45000\ \text{MPa}$,
              este resultado es imposible: $G$ tendría que valer lo mismo que
              $E$.
            trampa: true
            mensaje: |
              $G$ y $E$ no valen lo mismo: $E = 2G(1+\nu)$, así que $G$ es
              algo menos de la mitad de $E$. Con $\nu = 0{,}29$,
              $45000/(2\cdot 1{,}29) \approx 17400\ \text{MPa}$, muy cerca de
              lo que ha salido. El resultado es razonable.
    resolucion: |
      **La deformación de cortadura.** La cara superior desliza
      $\Delta x = 0{,}01\ \text{mm}$ sobre una altura de $10\ \text{mm}$:

      $$
      \gamma = \tan\theta = \frac{\Delta x}{h} = \frac{0{,}01}{10} = 1\cdot 10^{-3}
      $$

      **El módulo.** El desplazamiento es reversible, así que es elástico y
      vale la ley de Hooke de la cortadura:

      $$
      G = \frac{\tau}{\gamma} = \frac{18}{10^{-3}} = 18000\ \text{MPa}
      $$

      Coincide con el resultado del listado.

      **Lo que hay que llevarse.** La cortadura es la tracción con otros
      nombres: $\tau$ en lugar de $\sigma$, $\gamma$ en lugar de
      $\varepsilon$ y $G$ en lugar de $E$. Y la deformación, igual que allí,
      es un desplazamiento **partido por una longitud**: aquí la altura del
      bloque. El dato de la sección no hace falta porque la tensión ya viene
      dada.

  - id: ejcm2-col28-el-coeficiente-de-poisson-desde-el-diametro
    titulo: El coeficiente de Poisson a partir del diámetro
    fuente: >-
      Ejercicio 2.8 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de $10\ \text{mm}$ de diámetro se deforma
      elásticamente por tracción. Así, para una carga de
      $14996{,}5\ \text{N}$ se obtiene una disminución del diámetro de
      $7\cdot 10^{-3}\ \text{mm}$. Siendo el módulo elástico del material de
      $10^{5}\ \text{MPa}$, calcula el coeficiente de Poisson.
    pide: El coeficiente de Poisson, que es un número sin unidades.
    pasos:
      - tipo: reconocer
        pregunta: |
          El coeficiente de Poisson compara dos deformaciones. ¿Cuáles, y de
          dónde sale cada una?
        opciones:
          - texto: >-
              La transversal, del cambio de diámetro, y la axial, de la carga
              con Hooke; $\nu = -\varepsilon_x/\varepsilon_z$
            correcta: true
            mensaje: |
              Eso es. La transversal sale directa, $\Delta d/d_0$. La axial no
              la mide nadie aquí: se obtiene de la tensión y del módulo.
          - texto: >-
              El cambio de diámetro y el alargamiento, en milímetros
            mensaje: |
              Poisson compara deformaciones **unitarias**, no desplazamientos.
              Además, el alargamiento no te lo dan: faltaría la longitud.
          - texto: >-
              La tensión y la deformación axial
            mensaje: |
              Ese cociente es el módulo elástico, $E = \sigma/\varepsilon$, y
              ya te lo dan. Poisson relaciona la deformación de lado con la de
              frente.

      - tipo: calcular
        titulo: La deformación axial
        pregunta: |
          ¿Cuánto vale $\varepsilon_z$, la deformación en la dirección de la
          carga?
        respuesta:
          tipo: numero
          valor: '0.001909'
          tolerancia: 0.00002
          formato: un número sin unidades, por ejemplo 1.5e-3
        distractores:
          - valor: '0.000477'
            mensaje: |
              Has tomado los $10\ \text{mm}$ como radio. Con el área cuatro
              veces mayor, la tensión y la deformación salen cuatro veces
              menores.
          - valor: '0.0007'
            mensaje: |
              Esa es la deformación **transversal**, $7\cdot 10^{-3}/10$. La
              axial no sale del diámetro: sale de la carga, con
              $\sigma = F/A_0$ y Hooke.
        pista: |
          $\sigma = F/(\pi d^{2}/4)$ y $\varepsilon_z = \sigma/E$.
        desarrollo: |
          $$
          \sigma = \frac{14996{,}5}{78{,}54} = 190{,}9\ \text{MPa}
          \qquad
          \varepsilon_z = \frac{190{,}9}{10^{5}} = 1{,}909\cdot 10^{-3}
          $$

      - tipo: calcular
        titulo: El coeficiente de Poisson
        pregunta: |
          ¿Cuánto vale $\nu$?
        respuesta:
          tipo: numero
          valor: '0.3666'
          tolerancia: 0.005
          formato: un número sin unidades
        distractores:
          - valor: '3.666'
            mensaje: |
              Has puesto el cambio de diámetro, $7\cdot 10^{-3}\ \text{mm}$,
              sin dividir entre el diámetro inicial. La deformación transversal
              es $\Delta d/d_0 = 7\cdot 10^{-4}$. Un Poisson por encima de 0,5
              no existe en un material isótropo.
          - valor: '-0.3666'
            mensaje: |
              Te has dejado el signo menos de la definición. En tracción
              $\varepsilon_x < 0$ y $\varepsilon_z > 0$, y el menos de
              $\nu = -\varepsilon_x/\varepsilon_z$ está justo para que $\nu$
              salga positivo.
          - valor: '2.728'
            mensaje: |
              Has dividido al revés, la axial entre la transversal. Poisson es
              la transversal partida por la axial.
          - valor: '1.466'
            mensaje: |
              Arrastras la deformación axial del diámetro tomado como radio.
        pista: |
          $\varepsilon_x = \Delta d/d_0 = -7\cdot 10^{-4}$ y
          $\nu = -\varepsilon_x/\varepsilon_z$.
        desarrollo: |
          $$
          \varepsilon_x = \frac{-7\cdot 10^{-3}}{10} = -7\cdot 10^{-4}
          \qquad
          \nu = -\frac{\varepsilon_x}{\varepsilon_z}
          = \frac{7\cdot 10^{-4}}{1{,}909\cdot 10^{-3}} = 0{,}367
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La deformación axial sale de la carga: $\sigma = 190{,}9\ \text{MPa}$
              y $\varepsilon_z = \sigma/E = 1{,}909\cdot 10^{-3}$.
          - texto: >-
              La transversal sale del diámetro:
              $\varepsilon_x = -7\cdot 10^{-3}/10 = -7\cdot 10^{-4}$.
          - texto: >-
              $\nu = -\varepsilon_x/\varepsilon_z = 0{,}367$, un valor típico de
              un metal.
          - texto: >-
              Para calcular $\nu$ haría falta además la longitud de la probeta,
              que el enunciado no da.
            trampa: true
            mensaje: |
              No hace falta: Poisson compara deformaciones unitarias, y la
              axial sale de $\sigma/E$ sin pasar por ninguna longitud. La
              longitud solo haría falta para dar el alargamiento en milímetros.
    resolucion: |
      **La deformación axial.** No se mide: se calcula con la carga.

      $$
      A_0 = \frac{\pi\cdot 10^{2}}{4} = 78{,}54\ \text{mm}^{2}
      \qquad
      \sigma = \frac{14996{,}5}{78{,}54} = 190{,}9\ \text{MPa}
      \qquad
      \varepsilon_z = \frac{190{,}9}{10^{5}} = 1{,}909\cdot 10^{-3}
      $$

      **La deformación transversal.** El diámetro disminuye, así que es
      negativa:

      $$
      \varepsilon_x = \frac{\Delta d}{d_0} = \frac{-7\cdot 10^{-3}}{10} = -7\cdot 10^{-4}
      $$

      **El coeficiente de Poisson.**

      $$
      \nu = -\frac{\varepsilon_x}{\varepsilon_z}
      = \frac{7\cdot 10^{-4}}{1{,}909\cdot 10^{-3}} = 0{,}3666
      $$

      El listado da 0,366, que es este mismo valor cortado en la tercera cifra.

      **Lo que hay que llevarse.** Un Poisson siempre sale entre 0 y 0,5 en
      un material isótropo, y en los metales ronda 0,3. Si te sale 3,7 o
      negativo, no es el material: es que falta dividir por $d_0$ o falta el
      signo menos.

  - id: ejcm2-col29-la-longitud-inicial-tras-una-compresion
    titulo: La longitud inicial tras una compresión
    fuente: >-
      Ejercicio 2.9 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se deforma por compresión una probeta cilíndrica de una aleación
      metálica. Los diametros inicial y final de la probeta son $30{,}00$ y
      $30{,}04\ \text{mm}$, respectivamente, y la longitud al final del ensayo
      es de $105{,}20\ \text{mm}$. Calcula la longitud inicial de la probeta,
      suponiendo que toda la deformación ha sido elástica. Datos:
      $E = 65{,}5\cdot 10^{3}\ \text{MPa}$ y
      $G = 25{,}4\cdot 10^{3}\ \text{MPa}$.
    pide: La longitud inicial de la probeta, en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para pasar del cambio de diámetro al cambio de longitud hace falta
          el coeficiente de Poisson, y el enunciado no lo da. ¿De dónde sale?
        opciones:
          - texto: >-
              De la relación entre las tres constantes elásticas de un material
              isótropo, $E = 2G(1+\nu)$
            correcta: true
            mensaje: |
              Eso es. Por eso el enunciado da $G$ en un problema de
              compresión: no es para la cortadura, es para sacar $\nu$.
          - texto: >-
              Se toma 0,3, que es lo típico de un metal
            mensaje: |
              Sería una estimación, y aquí no hace falta estimar: con $E$ y $G$
              el coeficiente está fijado. Además, el resultado depende mucho
              de $\nu$, y con 0,3 la longitud ya no coincide.
          - texto: >-
              No hace falta: en compresión el diámetro y la longitud cambian lo
              mismo
            mensaje: |
              Cambian en proporción $\nu$, no igual. Si fuera lo mismo, $\nu$
              valdría 1, y eso no lo cumple ningún material isótropo.

      - tipo: calcular
        titulo: El coeficiente de Poisson
        pregunta: |
          ¿Cuánto vale $\nu$?
        respuesta:
          tipo: numero
          valor: '0.2894'
          tolerancia: 0.003
          formato: un número sin unidades
        distractores:
          - valor: '1.579'
            mensaje: |
              Te has dejado el 2 de $E = 2G(1+\nu)$. Un Poisson mayor que 0,5
              es imposible en un material isótropo, y eso ya avisa.
          - valor: '2.289'
            mensaje: |
              Has despejado con el signo cambiado: de $E/(2G) = 1+\nu$ sale
              $\nu = E/(2G) - 1$, restando el uno, no sumándolo.
        pista: |
          $\nu = \dfrac{E}{2G} - 1$.
        desarrollo: |
          $$
          \nu = \frac{E}{2G} - 1 = \frac{65{,}5}{2\cdot 25{,}4} - 1 = 0{,}2894
          $$

      - tipo: calcular
        titulo: La deformación axial
        pregunta: |
          ¿Cuánto vale la deformación en la dirección de la carga,
          $\varepsilon_z$, con su signo?
        respuesta:
          tipo: numero
          valor: '-0.004608'
          tolerancia: 0.0001
          formato: un número sin unidades, con su signo
        distractores:
          - valor: '0.004608'
            mensaje: |
              El valor es bueno y el signo no. Es una **compresión**: la
              probeta se acorta, así que $\varepsilon_z < 0$. El diámetro, en
              cambio, crece, y por eso $\varepsilon_x > 0$.
          - valor: '-0.000386'
            mensaje: |
              Has multiplicado por $\nu$ en vez de dividir. De
              $\nu = -\varepsilon_x/\varepsilon_z$ sale
              $\varepsilon_z = -\varepsilon_x/\nu$: la axial es la
              **mayor** de las dos.
        pista: |
          $\varepsilon_x = (30{,}04 - 30{,}00)/30{,}00$ y
          $\varepsilon_z = -\varepsilon_x/\nu$.
        desarrollo: |
          $$
          \varepsilon_x = \frac{30{,}04 - 30{,}00}{30{,}00} = 1{,}333\cdot 10^{-3}
          \qquad
          \varepsilon_z = -\frac{1{,}333\cdot 10^{-3}}{0{,}2894} = -4{,}608\cdot 10^{-3}
          $$

      - tipo: calcular
        titulo: La longitud inicial
        pregunta: |
          ¿Qué longitud tenía la probeta antes del ensayo?
        respuesta:
          tipo: magnitud
          valor: '105.69 mm'
          tolerancia: 0.001
          formato: una longitud, con su unidad y dos decimales
        distractores:
          - valor: '104.72 mm'
            mensaje: |
              Arrastras el signo de la deformación. Con $\varepsilon_z$
              positivo la probeta habría empezado **más corta** de lo que
              acaba, y eso es una tracción. En compresión la longitud inicial
              tiene que ser mayor que $105{,}20\ \text{mm}$.
          - valor: '0.487 mm'
            mensaje: |
              Eso es lo que se ha acortado la probeta, $l_0 - l_f$. El
              enunciado pide la longitud inicial entera: súmale los
              $105{,}20\ \text{mm}$.
        pista: |
          $l_f = l_0\,(1+\varepsilon_z)$, así que
          $l_0 = l_f/(1+\varepsilon_z)$.
        desarrollo: |
          $$
          l_0 = \frac{l_f}{1+\varepsilon_z} = \frac{105{,}20}{1 - 4{,}608\cdot 10^{-3}}
          = 105{,}69\ \text{mm}
          $$

          La probeta se ha acortado $0{,}49\ \text{mm}$, mientras su diámetro
          crecía $0{,}04$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El material es isótropo, así que $E = 2G(1+\nu)$ da
              $\nu = 0{,}289$.
          - texto: >-
              El diámetro crece, luego $\varepsilon_x = +1{,}33\cdot 10^{-3}$, y
              la deformación axial es $\varepsilon_z = -\varepsilon_x/\nu = -4{,}61\cdot 10^{-3}$.
          - texto: >-
              La longitud final es $l_0(1+\varepsilon_z)$, y de ahí
              $l_0 = 105{,}69\ \text{mm}$, mayor que la final, como debe ser en
              compresión.
          - texto: >-
              Da igual dividir entre $1+\varepsilon_z$ o entre
              $1-\varepsilon_z$: la deformación es tan pequeña que el signo no
              se nota.
            trampa: true
            mensaje: |
              Se nota, y mucho: $105{,}69$ frente a $104{,}72\ \text{mm}$, casi
              un milímetro. El signo decide si la probeta era más larga o más
              corta que al final, que es justo lo que pregunta el problema.
    resolucion: |
      **El coeficiente de Poisson.** No lo dan, pero con $E$ y $G$ de un
      material isótropo está fijado:

      $$
      \nu = \frac{E}{2G} - 1 = \frac{65{,}5\cdot 10^{3}}{2\cdot 25{,}4\cdot 10^{3}} - 1
      = 0{,}2894
      $$

      **Las dos deformaciones.** En compresión el diámetro crece, así que la
      transversal es positiva y la axial, negativa:

      $$
      \varepsilon_x = \frac{30{,}04 - 30{,}00}{30{,}00} = 1{,}333\cdot 10^{-3}
      \qquad
      \varepsilon_z = -\frac{\varepsilon_x}{\nu} = -4{,}608\cdot 10^{-3}
      $$

      **La longitud inicial.**

      $$
      l_0 = \frac{l_f}{1+\varepsilon_z} = \frac{105{,}20}{0{,}995392}
      = 105{,}69\ \text{mm}
      $$

      El listado da $105{,}68\ \text{mm}$; la cuenta da $105{,}687$, así que
      es el mismo valor con la última cifra cortada en vez de redondeada.

      **Lo que hay que llevarse.** Dos cosas. $G$ no aparece por la
      cortadura: aparece para sacar $\nu$, que es lo que hacía falta. Y en
      compresión los signos se dan la vuelta —la probeta se acorta y se
      ensancha—, y el signo de $\varepsilon_z$ es precisamente lo que decide
      el resultado.

  - id: ejcm2-col210-alargamiento-y-cambio-de-diametro
    titulo: El alargamiento y el cambio de diámetro de un acero
    fuente: >-
      Ejercicio 2.10 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero de $15{,}2\ \text{mm}$ de diámetro y
      $250\ \text{mm}$ de longitud se deforma elásticamente con una fuerza de
      $48900\ \text{N}$. Determina el alargamiento en la dirección de la
      fuerza aplicada y el cambio de diámetro de la probeta. Datos:
      $E = 20{,}7\cdot 10^{4}\ \text{MPa}$; $\nu = 0{,}35$.
    pide: El alargamiento y el cambio de diámetro, en milímetros y con su signo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Una vez tienes la deformación axial, ¿cómo se llega al cambio de
          diámetro?
        opciones:
          - texto: >-
              Con Poisson, $\varepsilon_x = -\nu\,\varepsilon_z$, y después
              $\Delta d = \varepsilon_x\,d_0$
            correcta: true
            mensaje: |
              Eso es. Poisson da la deformación transversal **unitaria**, y
              para pasarla a milímetros se multiplica por el diámetro, que es
              la longitud transversal.
          - texto: >-
              $\Delta d = -\nu\,\Delta l$
            mensaje: |
              Poisson relaciona deformaciones unitarias, no milímetros. Así
              estarías multiplicando por la longitud, $250\ \text{mm}$, donde
              va el diámetro, $15{,}2$: el resultado sale dieciséis veces
              grande.
          - texto: >-
              No cambia: en régimen elástico el diámetro se mantiene
            mensaje: |
              Cambia, y en régimen elástico también. Toda deformación axial
              lleva una transversal de signo contrario; el coeficiente de
              Poisson mide cuánta.

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga la probeta?
        respuesta:
          tipo: magnitud
          valor: '0.3255 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.0814 mm'
            mensaje: |
              Has usado $15{,}2\ \text{mm}$ como radio. Con el área cuatro
              veces mayor, el alargamiento sale cuatro veces menor.
          - valor: '3.255 mm'
            mensaje: |
              Has tomado el módulo como $20{,}7\cdot 10^{3}$. Es
              $20{,}7\cdot 10^{4} = 207000\ \text{MPa}$.
        pista: |
          $\sigma = F/A_0$, $\varepsilon_z = \sigma/E$ y
          $\Delta l = \varepsilon_z\,l_0$.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 15{,}2^{2}}{4} = 181{,}5\ \text{mm}^{2}
          \qquad
          \sigma = \frac{48900}{181{,}5} = 269{,}5\ \text{MPa}
          $$

          $$
          \varepsilon_z = \frac{269{,}5}{207000} = 1{,}302\cdot 10^{-3}
          \qquad
          \Delta l = 1{,}302\cdot 10^{-3}\cdot 250 = 0{,}325\ \text{mm}
          $$

      - tipo: calcular
        titulo: El cambio de diámetro
        pregunta: |
          ¿Cuánto cambia el diámetro? Da el resultado con su signo.
        respuesta:
          tipo: magnitud
          valor: '-0.00693 mm'
          tolerancia: 0.02
          formato: una longitud con su signo y su unidad
        distractores:
          - valor: '0.00693 mm'
            mensaje: |
              El valor es bueno y el signo no. La probeta se estira, así que
              adelgaza: el diámetro **disminuye** y $\Delta d$ es negativo.
          - valor: '-0.1139 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud,
              $250\ \text{mm}$. El cambio de diámetro es la deformación
              transversal por el **diámetro**, $15{,}2\ \text{mm}$.
          - valor: '-0.0198 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has usado la deformación
              axial como si fuera la transversal. Falta multiplicar por 0,35.
        pista: |
          $\varepsilon_x = -\nu\,\varepsilon_z$ y $\Delta d = \varepsilon_x\,d_0$.
        desarrollo: |
          $$
          \varepsilon_x = -0{,}35\cdot 1{,}302\cdot 10^{-3} = -4{,}557\cdot 10^{-4}
          \qquad
          \Delta d = -4{,}557\cdot 10^{-4}\cdot 15{,}2 = -6{,}93\cdot 10^{-3}\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es $269{,}5\ \text{MPa}$ y la deformación axial,
              $1{,}302\cdot 10^{-3}$.
          - texto: >-
              Multiplicada por la longitud, da un alargamiento de
              $0{,}325\ \text{mm}$.
          - texto: >-
              La deformación transversal es $-\nu$ veces la axial, y por el
              diámetro da $\Delta d = -0{,}007\ \text{mm}$: la probeta adelgaza.
          - texto: >-
              Como la probeta se alarga y adelgaza, su volumen se mantiene
              exactamente constante.
            trampa: true
            mensaje: |
              Solo se conservaría con $\nu = 0{,}5$. Con $\nu = 0{,}35$ el
              volumen crece un poco: la variación relativa es
              $\varepsilon_z(1-2\nu) = 1{,}302\cdot 10^{-3}\cdot 0{,}3$, unas
              cuatro diezmilésimas. La conservación del volumen es cosa de la
              deformación **plástica**.
    resolucion: |
      **La deformación axial y el alargamiento.**

      $$
      A_0 = \frac{\pi\cdot 15{,}2^{2}}{4} = 181{,}5\ \text{mm}^{2}
      \qquad
      \sigma = \frac{48900}{181{,}5} = 269{,}5\ \text{MPa}
      $$

      $$
      \varepsilon_z = \frac{269{,}5}{207000} = 1{,}302\cdot 10^{-3}
      \qquad
      \Delta l = \varepsilon_z\,l_0 = 1{,}302\cdot 10^{-3}\cdot 250 = 0{,}325\ \text{mm}
      $$

      **El cambio de diámetro.** Con Poisson, y multiplicando por el diámetro,
      no por la longitud:

      $$
      \varepsilon_x = -\nu\,\varepsilon_z = -4{,}557\cdot 10^{-4}
      \qquad
      \Delta d = \varepsilon_x\,d_0 = -4{,}557\cdot 10^{-4}\cdot 15{,}2
      = -6{,}93\cdot 10^{-3}\ \text{mm}
      $$

      Coincide con el resultado del listado: $0{,}325\ \text{mm}$ y
      $-0{,}007\ \text{mm}$.

      **Lo que hay que llevarse.** El signo del cambio de diámetro no es un
      adorno: dice que la probeta adelgaza. Y Poisson se aplica siempre a
      deformaciones unitarias; los milímetros vienen después, cada uno con su
      longitud de referencia.

  - id: ejcm2-col211-el-diametro-a-traccion-y-a-compresion
    titulo: El diámetro final a tracción y a compresión
    fuente: >-
      Ejercicio 2.11 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra de $10\ \text{mm}$ de diámetro de una aleación de aluminio es
      sometida a una carga de tracción de $6\ \text{kN}$. Calcula el diámetro
      final si la deformación es totalmente elástica. Igualmente calcula el
      diámetro final de la barra si se somete a una carga de compresión de
      $6\ \text{kN}$. Datos: $E = 70\ \text{GPa}$, $\nu = 0{,}33$.
    pide: El diámetro final en los dos casos, en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          La misma carga, una vez tirando y otra empujando. ¿Qué cambia entre
          los dos casos?
        opciones:
          - texto: >-
              Solo el signo: a tracción el diámetro baja y a compresión sube,
              en la misma cantidad
            correcta: true
            mensaje: |
              Eso es. En régimen elástico el material responde igual en los
              dos sentidos, así que $|\Delta d|$ es el mismo y solo cambia hacia
              dónde va.
          - texto: >-
              A compresión el diámetro también baja, porque la barra se aplasta
            mensaje: |
              Al aplastarla se acorta, y lo que se acorta en longitud se
              compensa **ensanchándose**. Es el mismo Poisson que a tracción,
              con los dos signos dados la vuelta.
          - texto: >-
              A compresión hace falta otro coeficiente de Poisson
            mensaje: |
              El coeficiente es una propiedad del material, y en régimen
              elástico vale lo mismo tirando que empujando. Lo que cambia de
              signo son las deformaciones, no $\nu$.

      - tipo: calcular
        titulo: El cambio de diámetro a tracción
        pregunta: |
          ¿Cuánto cambia el diámetro con la carga de tracción? Da el
          resultado con su signo.
        respuesta:
          tipo: magnitud
          valor: '-0.0036 mm'
          tolerancia: 0.02
          formato: una longitud con su signo y su unidad
        distractores:
          - valor: '0.0036 mm'
            mensaje: |
              El valor es bueno y el signo no. A tracción la barra se estira y
              adelgaza: el diámetro **baja**.
          - valor: '-0.0109 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has tomado la
              deformación axial como si fuera la transversal. Falta
              multiplicar por 0,33.
          - valor: '-3.6 mm'
            mensaje: |
              Has dividido megapascales entre gigapascales. Con
              $E = 70000\ \text{MPa}$ la deformación es mil veces menor; un
              diámetro que baja 3,6 mm sería una barra casi partida.
        pista: |
          $\sigma = F/A_0$, $\varepsilon_z = \sigma/E$,
          $\varepsilon_x = -\nu\,\varepsilon_z$ y $\Delta d = \varepsilon_x\,d_0$.
        desarrollo: |
          $$
          \sigma = \frac{6000}{78{,}54} = 76{,}39\ \text{MPa}
          \qquad
          \varepsilon_z = \frac{76{,}39}{70000} = 1{,}091\cdot 10^{-3}
          $$

          $$
          \varepsilon_x = -0{,}33\cdot 1{,}091\cdot 10^{-3} = -3{,}601\cdot 10^{-4}
          \qquad
          \Delta d = -3{,}601\cdot 10^{-4}\cdot 10 = -3{,}60\cdot 10^{-3}\ \text{mm}
          $$

      - tipo: calcular
        titulo: El diámetro final a tracción
        pregunta: |
          ¿Qué diámetro tiene la barra bajo la carga de tracción?
        respuesta:
          tipo: magnitud
          valor: '9.9964 mm'
          tolerancia: 0.00015
          formato: una longitud, con su unidad y al menos tres decimales
        distractores:
          - valor: '10.0036 mm'
            mensaje: |
              Has sumado el cambio de diámetro en vez de restarlo. A tracción
              la barra adelgaza: el diámetro final es **menor** que
              $10\ \text{mm}$.
        pista: |
          $d_f = d_0 + \Delta d$, con $\Delta d$ negativo.
        desarrollo: |
          $$
          d_f = 10 - 0{,}0036 = 9{,}9964\ \text{mm}
          $$

      - tipo: calcular
        titulo: El diámetro final a compresión
        pregunta: |
          ¿Y bajo la carga de compresión de $6\ \text{kN}$?
        respuesta:
          tipo: magnitud
          valor: '10.0036 mm'
          tolerancia: 0.00015
          formato: una longitud, con su unidad y al menos tres decimales
        distractores:
          - valor: '9.9964 mm'
            mensaje: |
              Es el diámetro de tracción. A compresión la barra se acorta y se
              **ensancha**: el cambio es el mismo, con el signo al revés.
        pista: |
          Ahora $\varepsilon_z < 0$, así que $\varepsilon_x > 0$ y el diámetro
          crece.
        desarrollo: |
          $$
          \varepsilon_z = -1{,}091\cdot 10^{-3}
          \qquad
          \Delta d = +3{,}60\cdot 10^{-3}\ \text{mm}
          \qquad
          d_f = 10{,}0036\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es $76{,}4\ \text{MPa}$ en valor absoluto, igual en los
              dos casos, y la deformación axial, $1{,}09\cdot 10^{-3}$.
          - texto: >-
              La transversal es $\nu$ veces la axial y de signo contrario, así
              que el diámetro cambia $3{,}6\cdot 10^{-3}\ \text{mm}$.
          - texto: >-
              A tracción el diámetro baja a $9{,}996\ \text{mm}$ y a compresión
              sube a $10{,}004\ \text{mm}$.
          - texto: >-
              A compresión la tensión es negativa, así que el coeficiente de
              Poisson también se vuelve negativo.
            trampa: true
            mensaje: |
              $\nu$ es una propiedad del material y no tiene signo que dependa
              de la carga. Cambian de signo las **dos** deformaciones a la vez,
              y por eso su cociente, con el menos de la definición, sigue
              siendo $+0{,}33$.
    resolucion: |
      **La deformación axial.** Con la carga en newtons y el módulo en MPa:

      $$
      \sigma = \frac{6000}{\pi\cdot 10^{2}/4} = 76{,}39\ \text{MPa}
      \qquad
      \varepsilon_z = \frac{76{,}39}{70000} = 1{,}091\cdot 10^{-3}
      $$

      **El cambio de diámetro.**

      $$
      \Delta d = -\nu\,\varepsilon_z\,d_0 = -0{,}33\cdot 1{,}091\cdot 10^{-3}\cdot 10
      = -3{,}60\cdot 10^{-3}\ \text{mm}
      $$

      **Los dos diámetros.** A tracción, $d_f = 10 - 0{,}0036 = 9{,}9964\ \text{mm}$.
      A compresión todas las deformaciones cambian de signo:
      $d_f = 10 + 0{,}0036 = 10{,}0036\ \text{mm}$.

      Coincide con el resultado del listado: $9{,}996$ y $10{,}004\ \text{mm}$.

      **Lo que hay que llevarse.** Los cambios son de cuatro milésimas sobre
      diez milímetros, y por eso el diámetro final hay que darlo con cuatro
      decimales o no se ve nada. Lo que el ejercicio enseña es el signo: tirar
      adelgaza y empujar ensancha.

  - id: ejcm2-col212-la-carga-maxima-sin-deformacion-plastica
    titulo: La carga máxima sin deformación plástica en un latón
    fuente: >-
      Ejercicio 2.12 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Para un latón con un módulo elástico de $10{,}3\cdot 10^{4}\ \text{MPa}$
      la deformación plástica comienza para una tensión de
      $345\ \text{MPa}$.

      a) ¿Cuál es la carga máxima que se le puede aplicar a una probeta de
      $130\ \text{mm}^{2}$ de sección sin que sufra deformación plástica?

      b) Si la longitud inicial de la probeta es de $76\ \text{mm}$, ¿Cuál es
      el alargamiento máximo sin que sufra deformación plástica?
    pide: La carga máxima en newtons y el alargamiento máximo en milímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          «La deformación plástica comienza para una tensión de 345 MPa.»
          ¿Qué propiedad es esa?
        opciones:
          - texto: >-
              El límite elástico: la mayor tensión que aguanta el latón sin
              deformarse de forma permanente
            correcta: true
            mensaje: |
              Eso es. Por debajo de $345\ \text{MPa}$ vale Hooke y la probeta
              recupera su longitud; por encima, parte de la deformación se
              queda.
          - texto: >-
              La resistencia a tracción, la tensión a la que rompe
            mensaje: |
              La resistencia a tracción es el **máximo** de la curva, mucho
              después de que empiece la plasticidad. El comienzo de la
              deformación plástica es el límite elástico.
          - texto: >-
              El módulo elástico expresado de otra forma
            mensaje: |
              El módulo es una pendiente, el cociente entre tensión y
              deformación, y aquí vale $103000\ \text{MPa}$. Los
              $345\ \text{MPa}$ son un punto de la curva, no su inclinación.

      - tipo: calcular
        titulo: La carga máxima
        pregunta: |
          ¿Qué carga máxima admite la probeta sin plastificar?
        respuesta:
          tipo: magnitud
          valor: '44850 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2.65 N'
            mensaje: |
              Has dividido la tensión entre el área. La tensión es fuerza
              **entre** área, así que la fuerza es tensión **por** área.
          - valor: '13390000 N'
            mensaje: |
              Has multiplicado el área por el módulo elástico. La carga límite
              la fija el límite elástico, $345\ \text{MPa}$; el módulo no dice
              dónde empieza la plasticidad.
        pista: |
          $F_{max} = \sigma_y\,A_0$, con MPa por $\text{mm}^{2}$ dando newtons.
        desarrollo: |
          $$
          F_{max} = 345\cdot 130 = 44850\ \text{N}
          $$

      - tipo: calcular
        titulo: El alargamiento máximo
        pregunta: |
          ¿Cuánto se alarga la probeta de $76\ \text{mm}$ justo al llegar al
          límite elástico?
        respuesta:
          tipo: magnitud
          valor: '0.2546 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.546 mm'
            mensaje: |
              Has tomado el módulo como $10{,}3\cdot 10^{3}$. Es
              $10{,}3\cdot 10^{4} = 103000\ \text{MPa}$.
          - valor: '0.00335 mm'
            mensaje: |
              Esa es la deformación, $\varepsilon = 3{,}35\cdot 10^{-3}$. Falta
              multiplicarla por la longitud inicial, $76\ \text{mm}$.
        pista: |
          $\Delta l = \sigma_y\,l_0/E$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{345}{103000} = 3{,}350\cdot 10^{-3}
          \qquad
          \Delta l = 3{,}350\cdot 10^{-3}\cdot 76 = 0{,}2546\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La plasticidad empieza en $345\ \text{MPa}$, que es el límite
              elástico del latón.
          - texto: >-
              La carga que produce esa tensión en $130\ \text{mm}^{2}$ es
              $44850\ \text{N}$, la máxima sin deformación permanente.
          - texto: >-
              Hasta ahí vale Hooke: $\varepsilon = 345/103000$, y en
              $76\ \text{mm}$ eso son $0{,}2546\ \text{mm}$.
          - texto: >-
              Una probeta más larga del mismo latón admitiría menos carga antes
              de plastificar.
            trampa: true
            mensaje: |
              La plasticidad la decide la tensión, y la tensión es carga entre
              **sección**: la longitud no aparece. Una probeta más larga admite
              la misma carga; lo que cambia es que se alarga más milímetros
              antes de llegar al límite.
    resolucion: |
      **a) La carga máxima.** La deformación plástica empieza en el límite
      elástico, $\sigma_y = 345\ \text{MPa}$. La carga que lo alcanza es:

      $$
      F_{max} = \sigma_y\,A_0 = 345\cdot 130 = 44850\ \text{N}
      $$

      **b) El alargamiento máximo.** Hasta el límite elástico vale Hooke:

      $$
      \Delta l_{max} = \frac{\sigma_y\,l_0}{E} = \frac{345\cdot 76}{103000}
      = 0{,}2546\ \text{mm}
      $$

      Coincide con el resultado del listado.

      **Lo que hay que llevarse.** El límite elástico fija dos cosas a la
      vez: la carga máxima, que depende de la sección, y el alargamiento
      máximo, que depende de la longitud. Son dos preguntas distintas con la
      misma tensión detrás.

  - id: ejcm2-col213-una-barra-y-una-carga-de-setenta-toneladas
    titulo: Una barra de acero y una carga de setenta toneladas
    fuente: >-
      Ejercicio 2.13 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado
      de los apartados a) y b), contra el que está contrastado el desarrollo;
      el c) no lo publica.
    nivel: practica
    enunciado: |
      Una barra cilíndrica de $40\ \text{mm}$ de diámetro y $0{,}50\ \text{m}$
      de longitud es elongada a tracción:

      a) ¿Cuál será el alargamiento que presenta la barra al aplicarle una
      carga de $400\ \text{kN}$?

      b) ¿Qué carga máxima podrá aplicarse a la barra sin experimentar
      deformación plástica?

      c) ¿Podrá soportar una carga de $70\ \text{t}$? Razona la respuesta.

      Datos: $E = 20{,}7\cdot 10^{4}\ \text{MPa}$; límite elástico:
      $450\ \text{MPa}$; resistencia a tracción: $550\ \text{MPa}$;
      resistencia a fractura: $500\ \text{MPa}$.
    pide: El alargamiento con 400 kN, la carga máxima elástica y si la barra aguanta 70 t.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da tres tensiones. Para decidir si la barra **rompe**
          bajo una carga fija, ¿con cuál hay que comparar?
        opciones:
          - texto: >-
              Con la resistencia a tracción, $550\ \text{MPa}$, que es la
              tensión máxima que la barra puede soportar
            correcta: true
            mensaje: |
              Eso es. Mientras la tensión quede por debajo del máximo de la
              curva, la barra encuentra un punto de equilibrio. El límite
              elástico dice si la deformación será permanente, no si rompe.
          - texto: >-
              Con el límite elástico, $450\ \text{MPa}$
            mensaje: |
              Pasar el límite elástico significa deformación **permanente**,
              no rotura. Entre $450$ y $550\ \text{MPa}$ la barra se queda
              estirada pero entera.
          - texto: >-
              Con la resistencia a fractura, $500\ \text{MPa}$, porque es la
              tensión a la que rompe
            mensaje: |
              Es la tensión nominal **en el instante** de romper, y se alcanza
              después del máximo, cuando la estricción ya ha reducido la carga
              que la barra aguanta. Para llegar ahí la barra tiene que pasar
              antes por $550\ \text{MPa}$.

      - tipo: calcular
        titulo: El alargamiento con 400 kN
        pregunta: |
          ¿Cuánto se alarga la barra con $400\ \text{kN}$?
        respuesta:
          tipo: magnitud
          valor: '0.769 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.192 mm'
            mensaje: |
              Has usado los $40\ \text{mm}$ como radio. Con el área cuatro
              veces mayor, el alargamiento sale cuatro veces menor.
          - valor: '7.69 mm'
            mensaje: |
              Has tomado el módulo como $20{,}7\cdot 10^{3}$. Es
              $20{,}7\cdot 10^{4} = 207000\ \text{MPa}$.
        pista: |
          Primero la tensión, y comprueba que está por debajo de
          $450\ \text{MPa}$ antes de usar Hooke. La longitud, en milímetros.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 40^{2}}{4} = 1256{,}6\ \text{mm}^{2}
          \qquad
          \sigma = \frac{400000}{1256{,}6} = 318{,}3\ \text{MPa} < 450
          $$

          $$
          \Delta l = \frac{318{,}3\cdot 500}{207000} = 0{,}769\ \text{mm}
          $$

      - tipo: calcular
        titulo: La carga máxima sin deformación plástica
        pregunta: |
          ¿Qué carga máxima admite la barra sin plastificar?
        respuesta:
          tipo: magnitud
          valor: '565487 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '691150 N'
            mensaje: |
              Has usado la resistencia a tracción. Con esa carga la barra está
              en el máximo de la curva, a punto de formar cuello: hace rato
              que ha plastificado. El límite de lo elástico es
              $450\ \text{MPa}$.
          - valor: '628319 N'
            mensaje: |
              Has usado la resistencia a fractura. La deformación plástica
              empieza mucho antes, en el límite elástico, $450\ \text{MPa}$.
          - valor: '2261947 N'
            mensaje: |
              Has usado los $40\ \text{mm}$ como radio. El radio es 20, y el
              área, $1256{,}6\ \text{mm}^{2}$.
        pista: |
          $F_{max} = \sigma_y\,A_0$.
        desarrollo: |
          $$
          F_{max} = 450\cdot 1256{,}6 = 565487\ \text{N}
          $$

      - tipo: calcular
        titulo: La tensión con 70 toneladas
        pregunta: |
          ¿Qué tensión produce una carga de $70\ \text{t}$ en la barra?
        respuesta:
          tipo: magnitud
          valor: '546 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '55.7 MPa'
            mensaje: |
              Has tomado $70000\ \text{kg}$ como si fueran newtons. Setenta
              toneladas son una masa; su peso es
              $70000\cdot 9{,}8 = 686000\ \text{N}$.
          - valor: '136.5 MPa'
            mensaje: |
              Has usado los $40\ \text{mm}$ como radio. Con el área buena, la
              tensión es cuatro veces mayor.
        pista: |
          $F = m\,g$ con $m = 70000\ \text{kg}$, y $\sigma = F/A_0$.
        desarrollo: |
          $$
          F = 70000\cdot 9{,}8 = 686000\ \text{N}
          \qquad
          \sigma = \frac{686000}{1256{,}6} = 545{,}9\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Setenta toneladas pesan $686000\ \text{N}$, que en esta sección
              dan $546\ \text{MPa}$.
          - texto: >-
              Como $546 > 450\ \text{MPa}$, la barra pasa el límite elástico y
              queda deformada permanentemente.
          - texto: >-
              Como $546 < 550\ \text{MPa}$, no llega a la tensión máxima que
              puede soportar: la barra aguanta la carga sin romperse.
          - texto: >-
              Como $546\ \text{MPa}$ supera la resistencia a fractura,
              $500\ \text{MPa}$, la barra se rompe.
            trampa: true
            mensaje: |
              La resistencia a fractura es la tensión nominal **al final** del
              ensayo, después del máximo, cuando la estricción ha hecho caer la
              carga. Para llegar a ella la barra tiene que superar antes los
              $550\ \text{MPa}$ del máximo, y $546$ no llega. Que 500 sea menor
              que 546 no significa nada: los dos números están en tramos
              distintos de la curva.
    resolucion: |
      **a) El alargamiento.** La sección y la tensión:

      $$
      A_0 = \frac{\pi\cdot 40^{2}}{4} = 1256{,}6\ \text{mm}^{2}
      \qquad
      \sigma = \frac{400000}{1256{,}6} = 318{,}3\ \text{MPa}
      $$

      Está por debajo de $450\ \text{MPa}$, así que vale Hooke:

      $$
      \Delta l = \frac{\sigma\,l_0}{E} = \frac{318{,}3\cdot 500}{207000} = 0{,}769\ \text{mm}
      $$

      **b) La carga máxima elástica.**

      $$
      F_{max} = \sigma_y\,A_0 = 450\cdot 1256{,}6 = 565487\ \text{N}
      $$

      Los dos coinciden con el resultado del listado: $0{,}77\ \text{mm}$ y
      $565487\ \text{N}$.

      **c) Las setenta toneladas.** Son una masa; su peso es
      $686000\ \text{N}$ y la tensión, $545{,}9\ \text{MPa}$. Se compara con
      las tres tensiones del enunciado, cada una para lo suyo:

      - Supera el límite elástico, $450\ \text{MPa}$: la barra se deforma
        plásticamente y no recuperará su longitud.
      - No llega a la resistencia a tracción, $550\ \text{MPa}$: la barra no
        alcanza el máximo de la curva, así que se estira hasta el punto en que
        su endurecimiento equilibra la carga y ahí se queda.

      Por tanto **sí la soporta, pero con deformación permanente**. El listado
      no publica este apartado; esta es nuestra respuesta, razonada con la
      curva de tracción del tema.

      **Lo que hay que llevarse.** La resistencia a fractura engaña: es menor
      que la resistencia a tracción porque se mide con la sección inicial
      después de la estricción. Bajo una carga fija, la frontera entre
      aguantar y romper es el **máximo** de la curva.

  - id: ejcm2-col214-un-cable-de-acero-con-un-cuerpo-colgado
    titulo: Un cable de acero con un cuerpo colgado
    fuente: >-
      Ejercicio 2.14 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un cuerpo de $50\ \text{kg}$ se suspende de un cable de acero de
      $4\ \text{m}$ de longitud y $2\ \text{mm}$ de diámetro. Se sabe que el
      límite elástico del acero es de $250\ \text{N/mm}^{2}$, que el módulo de
      Young es de $2\cdot 10^{5}\ \text{N/mm}^{2}$ y que el coeficiente de
      Poisson es $0{,}28$.

      a) Calcula el alargamiento del cable y contracción transversal del
      mismo.

      b) Determina el módulo de elasticidad que debería tener el cable si
      fuese de otro material, para reducir a la mitad la deformación
      (longitudinal) bajo la misma carga.

      c) Si se duplicara la carga en el cable de acero original, ¿qué
      sucedería? ¿Qué área debería de tener la sección del cable para que
      bajo esa carga trabajara en régimen elástico?
    pide: El alargamiento y la contracción del cable, el módulo necesario y el área mínima con la carga doble.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular el alargamiento, ¿qué hay que comprobar?
        opciones:
          - texto: >-
              Que la tensión del peso quede por debajo del límite elástico,
              porque solo entonces vale Hooke
            correcta: true
            mensaje: |
              Eso es. Aquí sale $156\ \text{MPa}$ frente a
              $250\ \text{N/mm}^{2}$, así que el cable trabaja en régimen
              elástico. En el apartado c) esa comprobación va a fallar, y ahí
              está la pregunta.
          - texto: >-
              Nada: un cable colgado siempre trabaja en régimen elástico
            mensaje: |
              Depende de la carga. El propio apartado c) duplica el peso, y
              entonces el cable pasa el límite elástico.
          - texto: >-
              Que el peso no supere el módulo de Young
            mensaje: |
              El módulo no es un límite, es una pendiente: dice cuánto se
              estira el cable por cada megapascal, no hasta dónde aguanta. El
              límite es el elástico.

      - tipo: calcular
        titulo: El alargamiento del cable
        pregunta: |
          ¿Cuánto se alarga el cable?
        respuesta:
          tipo: magnitud
          valor: '3.12 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.318 mm'
            mensaje: |
              Has tomado los 50 kg como 50 N. El cuerpo pesa
              $50\cdot 9{,}8 = 490\ \text{N}$.
          - valor: '0.78 mm'
            mensaje: |
              Has usado los $2\ \text{mm}$ como radio. El radio es 1, y el área,
              $3{,}14\ \text{mm}^{2}$.
        pista: |
          $F = m\,g$, $\sigma = F/A_0$ y $\Delta l = \sigma\,l_0/E$ con la
          longitud en milímetros.
        desarrollo: |
          $$
          F = 50\cdot 9{,}8 = 490\ \text{N}
          \qquad
          \sigma = \frac{490}{\pi\cdot 1^{2}} = 156{,}0\ \text{MPa} < 250
          $$

          $$
          \varepsilon_z = \frac{156{,}0}{2\cdot 10^{5}} = 7{,}80\cdot 10^{-4}
          \qquad
          \Delta l = 7{,}80\cdot 10^{-4}\cdot 4000 = 3{,}12\ \text{mm}
          $$

      - tipo: calcular
        titulo: La contracción transversal
        pregunta: |
          ¿Cuánto cambia el diámetro del cable? Da el resultado con su signo.
        respuesta:
          tipo: magnitud
          valor: '-0.000437 mm'
          # 10 %: la colección imprime −0,0004 mm, con una sola cifra, y esa
          # respuesta también tiene que valer (§17: la tolerancia la decide lo
          # que se publica como bueno, no el distractor)
          tolerancia: 0.1
          formato: una longitud con su signo y su unidad
        distractores:
          - valor: '0.000437 mm'
            mensaje: |
              El valor es bueno y el signo no. El cable se estira y adelgaza:
              el diámetro **baja**.
          - valor: '-0.873 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud del
              cable. El cambio de diámetro es la transversal por el
              **diámetro**, $2\ \text{mm}$.
          - valor: '-0.00156 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson. Falta multiplicar la
              deformación axial por 0,28.
        pista: |
          $\Delta d = -\nu\,\varepsilon_z\,d_0$.
        desarrollo: |
          $$
          \Delta d = -0{,}28\cdot 7{,}80\cdot 10^{-4}\cdot 2 = -4{,}37\cdot 10^{-4}\ \text{mm}
          $$

      - tipo: calcular
        titulo: El módulo que reduce la deformación a la mitad
        pregunta: |
          ¿Qué módulo de elasticidad haría falta para que la misma carga
          deformara el cable la mitad?
        respuesta:
          tipo: magnitud
          valor: '4e5 MPa'
          tolerancia: 0.02
          formato: una tensión, en MPa o en N/mm2
        distractores:
          - valor: '1e5 MPa'
            mensaje: |
              Has dividido el módulo entre dos. La deformación es
              $\sigma/E$: para que baje a la mitad con la misma tensión, $E$
              tiene que **doblarse**.
        pista: |
          Con la misma carga y la misma sección, $\sigma$ no cambia y
          $\varepsilon = \sigma/E$.
        desarrollo: |
          $$
          \frac{\varepsilon}{2} = \frac{\sigma}{E'}
          \;\Longrightarrow\;
          E' = 2E = 4\cdot 10^{5}\ \text{N/mm}^{2}
          $$

      - tipo: calcular
        titulo: La tensión con la carga doble
        pregunta: |
          Si se duplica la carga en el cable original, ¿qué tensión soporta?
        respuesta:
          tipo: magnitud
          valor: '312 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '156 MPa'
            mensaje: |
              Esa es la tensión con la carga original. Con el doble de peso y
              la misma sección, la tensión se dobla.
          - valor: '31.8 MPa'
            mensaje: |
              Has tomado los 100 kg como 100 N. Falta multiplicar por
              $g = 9{,}8$.
        pista: |
          $\sigma = 2F/A_0$, con $F = 490\ \text{N}$.
        desarrollo: |
          $$
          \sigma = \frac{980}{3{,}1416} = 311{,}9\ \text{MPa} > 250\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El área mínima con la carga doble
        pregunta: |
          ¿Qué sección mínima tendría que tener el cable para trabajar en
          régimen elástico con la carga doble?
        respuesta:
          tipo: magnitud
          valor: '3.92 mm2'
          tolerancia: 0.02
          formato: un área, con su unidad
        distractores:
          - valor: '1.96 mm2'
            mensaje: |
              Has usado la carga original, $490\ \text{N}$. La pregunta es con
              la carga duplicada, $980\ \text{N}$.
          - valor: '0.4 mm2'
            mensaje: |
              Has dividido 100 kg entre el límite elástico sin pasarlos a
              newtons. El peso son $980\ \text{N}$.
        pista: |
          $A_{min} = F/\sigma_y$, con $\sigma_y = 250\ \text{N/mm}^{2}$.
        desarrollo: |
          $$
          A_{min} = \frac{980}{250} = 3{,}92\ \text{mm}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Con el doble de carga la tensión pasa a $312\ \text{MPa}$, por
              encima del límite elástico de $250\ \text{N/mm}^{2}$.
          - texto: >-
              El cable se deforma plásticamente: al quitar la carga no vuelve a
              sus 4 m.
          - texto: >-
              Para seguir en régimen elástico hace falta una sección de al
              menos $980/250 = 3{,}92\ \text{mm}^{2}$.
          - texto: >-
              Con la carga doble el cable se alarga el doble, $6{,}24\ \text{mm}$.
            trampa: true
            mensaje: |
              Eso sería verdad si siguiera siendo elástico, y no lo es: pasa el
              límite elástico, Hooke deja de valer y el alargamiento ya no es
              proporcional a la carga. Con los datos del enunciado no se puede
              calcular; haría falta la curva de tracción entera.
    resolucion: |
      **a) Alargamiento y contracción.** El peso es $490\ \text{N}$ y la
      sección, $\pi\cdot 1^{2} = 3{,}14\ \text{mm}^{2}$:

      $$
      \sigma = \frac{490}{3{,}1416} = 156{,}0\ \text{MPa} < 250
      \qquad
      \varepsilon_z = \frac{156{,}0}{2\cdot 10^{5}} = 7{,}80\cdot 10^{-4}
      $$

      $$
      \Delta l = 7{,}80\cdot 10^{-4}\cdot 4000 = 3{,}12\ \text{mm}
      \qquad
      \Delta d = -0{,}28\cdot 7{,}80\cdot 10^{-4}\cdot 2 = -4{,}37\cdot 10^{-4}\ \text{mm}
      $$

      **b) El módulo.** Misma carga y misma sección, misma tensión. Para que
      $\varepsilon = \sigma/E$ baje a la mitad, $E' = 2E = 4\cdot 10^{5}\ \text{N/mm}^{2}$.

      **c) La carga doble.** La tensión sube a $311{,}9\ \text{MPa}$, por
      encima del límite elástico: el cable plastifica y queda alargado para
      siempre. Para evitarlo:

      $$
      A_{min} = \frac{2F}{\sigma_y} = \frac{980}{250} = 3{,}92\ \text{mm}^{2}
      $$

      Todo coincide con el resultado del listado: $3{,}12\ \text{mm}$,
      $-0{,}0004\ \text{mm}$ —que es nuestro $-4{,}37\cdot 10^{-4}$ con una
      sola cifra—, $4\cdot 10^{5}$ y $\ge 3{,}92\ \text{mm}^{2}$.

      **Lo que hay que llevarse.** La comprobación del límite elástico no es un
      trámite del principio: es la que decide si el resto de fórmulas del tema
      se pueden usar. En a) pasa y en c) no, y el apartado c) consiste
      justamente en darse cuenta.

  - id: ejcm2-col215-una-varilla-colgada-y-su-sustituta
    titulo: Una varilla colgada, y la que la sustituiría
    fuente: >-
      Ejercicio 2.15 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un acero tiene un módulo de elasticidad de $200\ \text{GPa}$ y un límite
      elástico de $360\ \text{MPa}$. Una varilla de este material de
      $12\ \text{mm}^{2}$ de sección y $80\ \text{cm}$ de longitud se cuelga
      verticalmente con una carga en el extremo de $1800\ \text{N}$.

      a) ¿Recuperará la varilla la longitud inicial cuando se le quite la
      carga?

      b) Calcula el alargamiento en estas condiciones.

      c) Determina el diámetro mínimo de una barra de este material que
      sometida a una carga de $5104\ \text{N}$ no experimente deformación
      permanente.

      d) Si se quisiera reducir a la mitad la elongación bajo carga
      utilizando una varilla similar, pero de otro material en las mismas
      condiciones empleadas con la varilla de acero, ¿qué valor mínimo de
      módulo de elasticidad tendría que tener este nuevo material?
    pide: Si recupera su longitud, el alargamiento, el diámetro mínimo y el módulo necesario.
    pasos:
      - tipo: reconocer
        pregunta: |
          Apartado a): ¿qué decide si la varilla recupera su longitud al
          quitar la carga?
        opciones:
          - texto: >-
              Que la tensión quede por debajo del límite elástico, porque
              entonces toda la deformación es elástica y reversible
            correcta: true
            mensaje: |
              Eso es. La deformación elástica dura lo que dura la carga. Si la
              tensión no pasa de $360\ \text{MPa}$, no queda nada permanente.
          - texto: >-
              Que el alargamiento sea pequeño comparado con la longitud
            mensaje: |
              Un alargamiento pequeño puede ser ya plástico: lo que cuenta no
              son los milímetros sino la tensión frente al límite elástico.
          - texto: >-
              Que la carga sea menor que el módulo de elasticidad
            mensaje: |
              Se comparan cosas que no son comparables: una carga en newtons y
              un módulo en pascales. Y el módulo no marca ningún límite, marca
              la pendiente de la curva.

      - tipo: calcular
        titulo: La tensión en la varilla
        pregunta: |
          ¿Qué tensión soporta la varilla?
        respuesta:
          tipo: magnitud
          valor: '150 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '21600 MPa'
            mensaje: |
              Has multiplicado la carga por la sección. La tensión es carga
              **entre** sección.
          - valor: '15.9 MPa'
            mensaje: |
              Has tomado los $12\ \text{mm}^{2}$ como si fueran un diámetro de
              $12\ \text{mm}$. El enunciado ya da la sección: no hace falta
              calcular ningún área.
        pista: |
          $\sigma = F/A_0$, con la sección que da el enunciado.
        desarrollo: |
          $$
          \sigma = \frac{1800}{12} = 150\ \text{MPa} < 360\ \text{MPa}
          $$

          Está por debajo del límite elástico: la varilla recupera su
          longitud.

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga la varilla?
        respuesta:
          tipo: magnitud
          valor: '0.6 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '600 mm'
            mensaje: |
              Has dividido megapascales entre gigapascales. Con
              $E = 200000\ \text{MPa}$ el alargamiento es mil veces menor.
          - valor: '0.06 mm'
            mensaje: |
              Has dejado la longitud en centímetros y le has puesto
              milímetros. Son $800\ \text{mm}$.
        pista: |
          $\Delta l = \sigma\,l_0/E$, todo en MPa y milímetros.
        desarrollo: |
          $$
          \Delta l = \frac{150\cdot 800}{200000} = 0{,}6\ \text{mm}
          $$

      - tipo: calcular
        titulo: El diámetro mínimo con 5104 N
        pregunta: |
          ¿Qué diámetro mínimo necesita una barra de este acero para aguantar
          $5104\ \text{N}$ sin deformación permanente?
        respuesta:
          tipo: magnitud
          valor: '4.25 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.12 mm'
            mensaje: |
              Ese es el radio: el mismo número sale de despejar de
              $A = \pi r^{2}$, o de olvidar el 4 en $A = \pi d^{2}/4$. El
              diámetro es el doble.
          - valor: '18.05 mm'
            mensaje: |
              Te has dejado la raíz cuadrada: $18{,}05$ es $d^{2}$, en
              $\text{mm}^{2}$.
        pista: |
          $A_{min} = F/\sigma_y$ y $d = \sqrt{4A_{min}/\pi}$.
        desarrollo: |
          $$
          A_{min} = \frac{5104}{360} = 14{,}18\ \text{mm}^{2}
          \qquad
          d_{min} = \sqrt{\frac{4\cdot 14{,}18}{\pi}} = 4{,}25\ \text{mm}
          $$

      - tipo: calcular
        titulo: El módulo del material sustituto
        pregunta: |
          ¿Qué módulo mínimo necesita el nuevo material para que la varilla se
          alargue la mitad en las mismas condiciones?
        respuesta:
          tipo: magnitud
          valor: '400000 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad (en MPa)
        distractores:
          - valor: '100000 MPa'
            mensaje: |
              Has dividido el módulo entre dos. El alargamiento es
              $\sigma\,l_0/E$: para que baje a la mitad con la misma tensión y
              la misma longitud, $E$ tiene que **doblarse**.
          - valor: '400 MPa'
            mensaje: |
              El número es el bueno en gigapascales, pero le has puesto MPa.
              $400\ \text{GPa} = 400000\ \text{MPa}$.
        pista: |
          Misma carga, sección y longitud: $\Delta l$ es inversamente
          proporcional a $E$.
        desarrollo: |
          $$
          \frac{\Delta l}{2} = \frac{\sigma\,l_0}{E'}
          \;\Longrightarrow\;
          E' = 2E = 400\ \text{GPa} = 400000\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es $150\ \text{MPa}$, por debajo de $360$: la varilla
              recupera su longitud al descargarla.
          - texto: >-
              En régimen elástico el alargamiento es
              $150\cdot 800/200000 = 0{,}6\ \text{mm}$.
          - texto: >-
              Para $5104\ \text{N}$ sin deformación permanente hace falta una
              sección de $14{,}18\ \text{mm}^{2}$, es decir
              $4{,}25\ \text{mm}$ de diámetro.
          - texto: >-
              Para alargarse la mitad, el material nuevo necesitaría el doble
              de límite elástico, $720\ \text{MPa}$.
            trampa: true
            mensaje: |
              El límite elástico dice hasta dónde se puede cargar sin
              deformación permanente, no cuánto se estira. El alargamiento
              elástico depende del **módulo**: hace falta el doble de $E$,
              $400\ \text{GPa}$. Son las dos propiedades que más se confunden
              del tema.
    resolucion: |
      **a) ¿Recupera la longitud?** La tensión es:

      $$
      \sigma = \frac{F}{A_0} = \frac{1800}{12} = 150\ \text{MPa}
      $$

      Por debajo del límite elástico de $360\ \text{MPa}$: toda la
      deformación es elástica y la varilla vuelve a sus $80\ \text{cm}$.

      **b) El alargamiento.** Con $E = 200000\ \text{MPa}$ y
      $l_0 = 800\ \text{mm}$:

      $$
      \Delta l = \frac{\sigma\,l_0}{E} = \frac{150\cdot 800}{200000} = 0{,}6\ \text{mm}
      $$

      **c) El diámetro mínimo.** La sección que lleva $5104\ \text{N}$ justo
      al límite elástico:

      $$
      A_{min} = \frac{5104}{360} = 14{,}18\ \text{mm}^{2}
      \qquad
      d_{min} = \sqrt{\frac{4A_{min}}{\pi}} = 4{,}25\ \text{mm}
      $$

      **d) El módulo del sustituto.** Misma tensión y misma longitud, así que
      el alargamiento va con $1/E$. Para la mitad, $E' = 2E = 400\ \text{GPa}$.

      Coincide con el resultado del listado: $0{,}6\ \text{mm}$,
      $4{,}25\ \text{mm}$ y $400\ \text{GPa}$.

      **Lo que hay que llevarse.** Módulo y límite elástico responden a
      preguntas distintas. El límite dice **hasta dónde** se puede cargar sin
      daño; el módulo, **cuánto** se estira por el camino. El apartado c) es
      del primero y el d), del segundo.

  - id: ejcm2-col216-la-barra-que-se-queda-mas-larga
    titulo: La barra que se queda más larga al descargarla
    fuente: >-
      Ejercicio 2.16 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un material hipotético presenta un comportamiento mecánico
      elástico-plástico. En la región elástica, el valor del límite elástico es
      $100\ \text{MPa}$ y el del módulo de Young es $70\ \text{GPa}$. Después,
      comienza la región plástica y el material logra una deformación de hasta
      8 veces el valor de la deformación elástica máxima sin aumentar la
      tensión. Finalmente, tiene lugar la fractura.

      a) Representa gráficamente el comportamiento mecánico del material.

      b) Indica en qué región del gráfico debería estar el material trabajando
      en el caso de ser parte de la estructura de un edificio.

      c) Una barra de este material, de $2{,}5\ \text{cm}$ de diámetro y
      $250\ \text{mm}$ de longitud, se somete a un ensayo de tracción hasta
      alcanzar una longitud de $251\ \text{mm}$. Calcula la longitud final de
      la barra después de la descarga. Grafica el proceso.

      d) Si esa misma barra, de $2{,}5\ \text{cm}$ de diámetro y
      $250\ \text{mm}$ de longitud, se hubiera sometido a una carga de tracción
      de $4000\ \text{kg}$, ¿qué longitud hubiera alcanzado antes y después de
      la descarga? Grafica el proceso.
    pide: La deformación elástica máxima, la longitud tras descargar la barra estirada hasta 251 mm y las dos longitudes de la barra cargada con 4000 kg.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra del apartado c) se estira hasta $251\ \text{mm}$ y después
          se le quita la carga. ¿Qué camino sigue en el diagrama al descargar?
        opciones:
          - texto: >-
              Baja por una recta paralela al tramo elástico: recupera solo la
              deformación elástica y conserva la plástica
            correcta: true
            mensaje: |
              Eso es. La descarga es siempre elástica, con la misma pendiente
              $E$ que la carga. Devuelve los enlaces estirados a su sitio,
              pero no deshace lo que ya se ha deslizado.
          - texto: >-
              Vuelve al origen por el mismo camino por el que ha subido
            mensaje: |
              Eso solo pasa si no se ha superado el límite elástico. Con
              251 mm la deformación es 0,004, casi el triple de la elástica
              máxima: la barra está en la meseta plástica.
          - texto: >-
              Se queda en 251 mm, porque ya ha plastificado
            mensaje: |
              La parte elástica se recupera siempre, también después de
              plastificar. Lo que se queda es solo la parte plástica, y eso
              es menos de un milímetro.
          - texto: >-
              La barra rompe, porque ha pasado del límite elástico
            mensaje: |
              Pasar del límite elástico no es romper. La fractura llega al
              final de la meseta, a ocho veces la deformación elástica
              máxima, 0,0114; 0,004 está bastante antes.

      - tipo: calcular
        titulo: La deformación elástica máxima
        pregunta: |
          ¿Cuánto vale la deformación en el límite elástico, $\varepsilon_y$?
        respuesta:
          tipo: numero
          valor: '0.001429'
          # Absoluta: acepta 0,0014 y 0,00143, que es como se redondea a mano,
          # y deja fuera los dos distractores por órdenes de magnitud.
          tolerancia: 0.00003
          formato: un número adimensional
        distractores:
          - valor: '1.429'
            mensaje: |
              Has dividido 100 entre 70 sin pasar el módulo a MPa. Los
              70 GPa son 70 000 MPa: tensión y módulo tienen que ir en la
              misma unidad para que la deformación salga adimensional.
          - valor: '0.01143'
            mensaje: |
              Esa es la deformación a la que rompe, ocho veces la elástica. La
              elástica máxima es el final del tramo recto, donde la tensión
              llega a 100 MPa.
        pista: |
          Ley de Hooke en el límite elástico: $\varepsilon_y = \sigma_y / E$,
          con las dos en MPa.
        desarrollo: |
          $$
          \varepsilon_y = \frac{\sigma_y}{E} = \frac{100}{70\,000}
          = 1{,}429\cdot 10^{-3}
          $$

          La meseta plástica llega hasta $8\,\varepsilon_y = 0{,}0114$, y ahí
          rompe.

      - tipo: calcular
        titulo: Lo que se queda al descargar
        pregunta: |
          La barra del apartado c) llega a $251\ \text{mm}$ y se descarga.
          ¿Cuánto más larga que al principio se queda?
        respuesta:
          tipo: magnitud
          valor: '0.643 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '1 mm'
            mensaje: |
              Has supuesto que no se recupera nada. La descarga devuelve la
              parte elástica, $250\cdot\varepsilon_y = 0{,}357\ \text{mm}$,
              aunque la barra haya plastificado.
          - valor: '0.357 mm'
            mensaje: |
              Esa es la parte que se **recupera**, la elástica. La que se
              queda es la otra: el milímetro total menos esos 0,357.
        pista: |
          Deformación permanente = deformación total − deformación elástica
          recuperable. La elástica, en la meseta, es $\varepsilon_y$ entera.
        desarrollo: |
          La deformación total es $\varepsilon = 1/250 = 0{,}004$, entre
          $\varepsilon_y = 0{,}00143$ y $0{,}0114$: la barra está en la meseta,
          a $100\ \text{MPa}$. Al descargar recupera $\varepsilon_y$:

          $$
          \Delta l_{\text{elástico}} = 250 \cdot 1{,}429\cdot 10^{-3}
          = 0{,}357\ \text{mm}
          $$

          $$
          \Delta l_{\text{permanente}} = 1 - 0{,}357 = 0{,}643\ \text{mm}
          \;\Longrightarrow\; l_f = 250{,}64\ \text{mm}
          $$

      - tipo: calcular
        titulo: La barra cargada con 4000 kg
        pregunta: |
          Con la carga de $4000\ \text{kg}$ del apartado d), ¿cuánto se alarga
          la barra mientras está cargada?
        respuesta:
          tipo: magnitud
          valor: '0.285 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '0.0291 mm'
            mensaje: |
              Has tomado los 4000 kg como si fueran 4000 N. Es una masa
              colgada: su peso es $4000\cdot 9{,}8 = 39\,200\ \text{N}$, casi
              diez veces más.
          - valor: '0.0713 mm'
            mensaje: |
              Has usado los 2,5 cm como radio. Son el diámetro: la sección es
              $\pi\cdot 12{,}5^{2}$, no $\pi\cdot 25^{2}$, y con el área cuatro
              veces mayor el alargamiento sale cuatro veces menor.
        pista: |
          Primero la tensión, $\sigma = F/A_0$ con $F = m\,g$, y compárala con
          los 100 MPa del límite elástico antes de usar Hooke.
        desarrollo: |
          $$
          F = 4000\cdot 9{,}8 = 39\,200\ \text{N}
          \qquad
          A_0 = \pi\cdot 12{,}5^{2} = 490{,}9\ \text{mm}^{2}
          $$

          $$
          \sigma = \frac{39\,200}{490{,}9} = 79{,}9\ \text{MPa} < 100\ \text{MPa}
          $$

          Está por debajo del límite: todo es elástico.

          $$
          \Delta l = \frac{\sigma}{E}\,l_0 = \frac{79{,}9}{70\,000}\cdot 250
          = 0{,}285\ \text{mm}
          $$

          Mide $250{,}29\ \text{mm}$ con la carga y vuelve a
          $250{,}00\ \text{mm}$ al quitarla.

      - tipo: justificar
        pregunta: Ordena por qué las dos barras terminan distinto. Una pieza es falsa.
        piezas:
          - texto: >-
              La barra del apartado d) trabaja a 79,9 MPa, por debajo del
              límite elástico: se alarga 0,29 mm y al descargar vuelve a medir
              250,00 mm.
          - texto: >-
              La del apartado c) llega a una deformación de 0,004, que está en
              la meseta plástica, a 100 MPa.
          - texto: >-
              Al descargarla recupera solo la parte elástica, 0,357 mm, y se
              queda en 250,64 mm.
          - texto: >-
              Por eso, en la estructura de un edificio el material tiene que
              trabajar en la región elástica, por debajo de 100 MPa.
          - texto: >-
              La barra del apartado c) vuelve a 250 mm, porque la descarga es
              siempre elástica.
            trampa: true
            mensaje: |
              La descarga es elástica, sí, y precisamente por eso solo
              devuelve la deformación elástica. La plástica, 0,643 mm, no la
              deshace ninguna descarga: por eso se llama permanente.
    resolucion: |
      **a) El diagrama.** Dos tramos rectos. Primero una recta desde el origen
      de pendiente $E = 70\ \text{GPa}$ hasta el límite elástico:

      $$
      \varepsilon_y = \frac{100}{70\,000} = 1{,}429\cdot 10^{-3}
      $$

      Después, una horizontal a $100\ \text{MPa}$ —la meseta plástica, que
      deforma sin aumentar la tensión— hasta la fractura, en
      $8\,\varepsilon_y = 0{,}0114$. Si se lee que el 8 cuenta solo la parte
      plástica, la fractura queda en $9\,\varepsilon_y = 0{,}0129$; no cambia
      ninguno de los apartados siguientes.

      **b) El edificio.** En la región elástica, el primer tramo, por debajo
      de $100\ \text{MPa}$. Una estructura que plastifica se queda deformada
      para siempre.

      **c) Estirada hasta 251 mm.** $\varepsilon = 1/250 = 0{,}004$, en plena
      meseta. Al descargar se baja por una recta paralela a la elástica y se
      recupera $\varepsilon_y$:

      $$
      l_f = 251 - 250\cdot 1{,}429\cdot 10^{-3} = 251 - 0{,}357
      = 250{,}64\ \text{mm}
      $$

      En el gráfico: subida por la recta, avance por la meseta hasta 0,004 y
      bajada paralela a la recta hasta $\varepsilon = 0{,}00257$ con tensión
      nula.

      > El listado da **250,65 mm** porque redondea $\varepsilon_y$ a
      > $0{,}0014$ antes de multiplicar: $250\cdot 0{,}0014 = 0{,}35$. Sin
      > redondear salen 250,64 mm. La diferencia son siete milésimas de
      > milímetro, y la casilla acepta los dos.

      **d) Con 4000 kg.** El peso es $39\,200\ \text{N}$ y la sección
      $490{,}9\ \text{mm}^{2}$:

      $$
      \sigma = 79{,}9\ \text{MPa} < 100
      \qquad
      \Delta l = \frac{79{,}9}{70\,000}\cdot 250 = 0{,}285\ \text{mm}
      $$

      Con carga mide $250{,}29\ \text{mm}$ y al descargar vuelve a
      $250{,}00\ \text{mm}$: en el gráfico sube y baja por la misma recta, sin
      llegar a la meseta.

      **Lo que hay que llevarse.** Deformación permanente = deformación total
      − deformación elástica recuperable. La descarga no devuelve la barra a
      su origen: la devuelve a su origen **menos** lo que ha plastificado.

  - id: ejcm2-col217-el-acero-y-los-otros-tres
    titulo: El acero, y qué harían los otros tres con la misma carga
    fuente: >-
      Ejercicio 2.17 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero de $160\ \text{mm}$ de longitud y
      $12\ \text{mm}$ de diámetro se deforma por efecto de una fuerza de
      $30000\ \text{N}$. ¿Cuál es el alargamiento producido? Calcula la
      reducción de diámetro. ¿Cuáles de los materiales de la tabla soportarán
      deformación plástica bajo la misma carga? ¿Cuáles mayor elongación que el
      acero? ¿Y mayor reducción en diámetro? Razona las respuestas.

      | Material | Módulo Young (MPa · $10^{3}$) | Lím. elástico (MPa) | Resist. máx. (MPa) | Coeficiente de Poisson |
      |---|---|---|---|---|
      | Aleación aluminio | 69 | 255 | 420 | 0,33 |
      | Aleación titanio | 107 | 827 | 862 | 0,36 |
      | Latón | 101 | 345 | 420 | 0,35 |
      | Acero | 205 | 550 | 700 | 0,27 |
    pide: El alargamiento y el cambio de diámetro de la probeta de acero, y qué materiales plastifican, se alargan más o estrechan más.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro probetas reciben la misma carga con la misma sección.
          ¿Qué hay que comparar para saber cuál se deforma plásticamente?
        opciones:
          - texto: >-
              La tensión, que es la misma para todas, con el límite elástico de
              cada material
            correcta: true
            mensaje: |
              Eso es. Misma fuerza y misma sección dan la misma tensión, así
              que se calcula una vez y se pone al lado de la columna del
              límite elástico.
          - texto: >-
              La tensión con la resistencia máxima de cada material
            mensaje: |
              La resistencia máxima marca cuándo empieza la estricción, no
              cuándo empieza la deformación permanente. Eso lo marca el
              límite elástico, bastante antes.
          - texto: >-
              El módulo de Young: plastifica el que lo tenga más bajo
            mensaje: |
              El módulo dice cuánto se estira en la zona elástica, no dónde
              acaba esa zona. El latón tiene casi el mismo módulo que el
              titanio y un límite elástico 2,4 veces menor.
          - texto: >-
              Los 30000 N directamente con el límite elástico
            mensaje: |
              El límite elástico es una tensión, en MPa, es decir en N/mm².
              Antes de comparar hay que dividir la carga entre la sección.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta?
        respuesta:
          tipo: magnitud
          valor: '265.3 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '66.3 MPa'
            mensaje: |
              Has usado los 12 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 6^{2}$, y con $\pi\cdot 12^{2}$ el área sale cuatro
              veces mayor y la tensión cuatro veces menor.
          - valor: '1061 MPa'
            mensaje: |
              Has tomado 6 mm como diámetro, es decir, has partido por dos
              dos veces. $A_0 = \pi d^{2}/4 = \pi\cdot 12^{2}/4 = 113{,}1\
              \text{mm}^{2}$.
        pista: |
          $\sigma = F/A_0$, con $A_0 = \pi d^{2}/4$ en mm² para que salga en
          MPa.
        desarrollo: |
          $$
          A_0 = \frac{\pi\cdot 12^{2}}{4} = 113{,}1\ \text{mm}^{2}
          \qquad
          \sigma = \frac{30\,000}{113{,}1} = 265{,}3\ \text{MPa}
          $$

          Por debajo de los 550 MPa del acero: su deformación es elástica y
          vale Hooke.

      - tipo: calcular
        titulo: El alargamiento del acero
        pregunta: |
          ¿Cuánto se alarga la probeta de acero?
        respuesta:
          tipo: magnitud
          valor: '0.207 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '207 mm'
            mensaje: |
              Te has dejado el $10^{3}$ del encabezado de la tabla. El módulo
              del acero son 205 000 MPa, no 205: con él la probeta se
              alargaría más que su propia longitud.
          - valor: '0.00129 mm'
            mensaje: |
              Esa es la deformación unitaria, $\varepsilon = \sigma/E$, que
              no tiene unidades. El alargamiento es esa deformación por la
              longitud inicial, 160 mm.
        pista: |
          $\varepsilon = \sigma/E$ y $\Delta l = \varepsilon\,l_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{265{,}3}{205\,000} = 1{,}294\cdot 10^{-3}
          \qquad
          \Delta l = 1{,}294\cdot 10^{-3}\cdot 160 = 0{,}207\ \text{mm}
          $$

      - tipo: calcular
        titulo: El cambio de diámetro
        pregunta: |
          ¿Cuánto cambia el diámetro? Dalo con su signo,
          $\Delta d = d_f - d_0$.
        respuesta:
          tipo: magnitud
          valor: '-0.00419 mm'
          tolerancia: 0.02
          formato: un cambio de longitud con su signo y su unidad
        distractores:
          - valor: '0.00419 mm'
            mensaje: |
              El número es bueno y el signo no. En tracción la probeta se
              alarga y **adelgaza**: el diámetro final es menor que el
              inicial, así que $\Delta d$ es negativo.
          - valor: '-0.0155 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has multiplicado la
              deformación axial por el diámetro tal cual. La transversal es
              $\varepsilon_x = -\nu\,\varepsilon_z$, un 27 % de la axial en el
              acero.
          - valor: '-0.0559 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud,
              160 mm. Es una deformación del **diámetro**: se multiplica por
              los 12 mm.
        pista: |
          $\varepsilon_x = -\nu\,\varepsilon_z$ y $\Delta d = \varepsilon_x\,d_0$.
        desarrollo: |
          $$
          \varepsilon_x = -0{,}27\cdot 1{,}294\cdot 10^{-3} = -3{,}494\cdot 10^{-4}
          $$

          $$
          \Delta d = -3{,}494\cdot 10^{-4}\cdot 12 = -4{,}19\cdot 10^{-3}\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación con los otros tres materiales. Una pieza es falsa.
        piezas:
          - texto: >-
              Las cuatro probetas soportan la misma tensión, 265,3 MPa, porque
              la carga y la sección son las mismas.
          - texto: >-
              Solo la aleación de aluminio tiene el límite elástico por debajo,
              255 MPa: es la única que se deforma plásticamente.
          - texto: >-
              Las otras tres tienen un módulo menor que el acero, así que con
              la misma tensión se alargan más.
          - texto: >-
              Y tienen además un coeficiente de Poisson mayor, así que su
              diámetro se reduce más.
          - texto: >-
              El titanio se alarga menos que el acero, porque su límite
              elástico es mucho mayor.
            trampa: true
            mensaje: |
              El límite elástico dice hasta dónde llega la zona elástica, no
              cuánto se estira dentro de ella. Eso lo dice el módulo: 107 GPa
              frente a 205. El titanio se alarga 0,397 mm, casi el doble que
              el acero.
    resolucion: |
      **La tensión, común a las cuatro.**

      $$
      A_0 = \frac{\pi\cdot 12^{2}}{4} = 113{,}1\ \text{mm}^{2}
      \qquad
      \sigma = \frac{30\,000}{113{,}1} = 265{,}3\ \text{MPa}
      $$

      **El acero.** Está por debajo de sus 550 MPa, así que vale Hooke:

      $$
      \varepsilon_z = \frac{265{,}3}{205\,000} = 1{,}294\cdot 10^{-3}
      \qquad
      \Delta l = \varepsilon_z\,l_0 = 0{,}207\ \text{mm}
      $$

      $$
      \Delta d = -\nu\,\varepsilon_z\,d_0 = -0{,}27\cdot 1{,}294\cdot 10^{-3}\cdot 12
      = -4{,}19\cdot 10^{-3}\ \text{mm}
      $$

      El listado da $-4{,}18\cdot 10^{-3}$; la diferencia es de redondeo, un
      0,3 %, y la casilla acepta los dos.

      **Los otros tres, con la misma tensión.**

      | material | ¿plastifica? | $\Delta l$ (mm) | $\Delta d$ (mm) |
      |---|---|---|---|
      | aluminio | sí, 265 > 255 | más de 0,615 | más de 0,0152 |
      | titanio | no | 0,397 | 0,0107 |
      | latón | no | 0,420 | 0,0110 |
      | acero | no | 0,207 | 0,0042 |

      Plastifica **la aleación de aluminio**. Se alargan más que el acero
      **todos**, porque todos tienen menor módulo; y el aluminio, que además
      plastifica, más todavía de lo que dice Hooke. Y estrechan más **todos**,
      porque a mayor alargamiento se suma un Poisson mayor.

      **Lo que hay que llevarse.** Tres columnas, tres preguntas: el límite
      elástico decide si plastifica, el módulo cuánto se alarga y el Poisson
      cuánto adelgaza. Mezclarlas es el error que este ejercicio busca.
  - id: ejcm2-col218-seis-metales-y-ninguno-vale
    titulo: Seis metales, y ninguno vale
    fuente: >-
      Ejercicio 2.18 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica metálica de $12{,}7\ \text{mm}$ de diámetro y
      $254\ \text{mm}$ de longitud presenta únicamente deformación elástica al
      ser sometida a una carga de tracción de $3{,}5\ \text{t}$. Si el
      alargamiento debe ser menor de $0{,}08\ \text{mm}$. ¿Cuáles de los
      metales de la tabla serían adecuados? Además, si la máxima disminución
      del diámetro que puede sufrir es de $1{,}2\times 10^{-3}\ \text{mm}$.
      ¿Cuáles de los metales de la tabla serían adecuados y por qué?

      | Metal | Límite elástico (MPa) | Módulo elástico (MPa · $10^{3}$) | Coeficiente de Poisson |
      |---|---|---|---|
      | Aleación aluminio | 250 | 70 | 0,33 |
      | Latón | 345 | 100 | 0,35 |
      | Cobre | 207 | 110 | 0,35 |
      | Aleación magnesio | 170 | 45 | 0,29 |
      | Acero | 550 | 206 | 0,27 |
      | Aleación titanio | 850 | 105 | 0,36 |
    pide: Qué metales cumplen la condición de alargamiento y cuáles la de disminución del diámetro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para la condición del alargamiento, ¿cuál es la forma más rápida de
          revisar los seis metales?
        opciones:
          - texto: >-
              Calcular el módulo mínimo que la cumpliría y compararlo con la
              columna de módulos: una sola cuenta vale para todos
            correcta: true
            mensaje: |
              Eso es. Con la misma tensión y la misma longitud, el
              alargamiento solo depende de $E$. Despejas el $E$ que da justo
              0,08 mm y lees la columna.
          - texto: >-
              Calcular el alargamiento de cada uno con su límite elástico
            mensaje: |
              El límite elástico no entra en la ley de Hooke. El alargamiento
              bajo esta carga depende de la tensión y del módulo; el límite
              solo dice si la fórmula se puede usar.
          - texto: >-
              Elegir el de mayor límite elástico, que será el que menos se
              alargue
            mensaje: |
              El alargamiento elástico lo decide el módulo. El titanio tiene
              el mayor límite de la tabla y se alarga casi el doble que el
              acero.
          - texto: >-
              Descartar los que plastifican; los que quedan valen
            mensaje: |
              Ese es el primer filtro, no el último. El acero no plastifica y
              aun así se alarga 0,33 mm, cuatro veces lo que permite el
              enunciado.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta con las $3{,}5\ \text{t}$?
        respuesta:
          tipo: magnitud
          valor: '270.8 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '27.6 MPa'
            mensaje: |
              Has tomado las 3,5 t como 3500 N. Una tonelada colgada pesa
              $1000\cdot 9{,}8 = 9800\ \text{N}$: la carga es de
              $34\,300\ \text{N}$.
          - valor: '67.7 MPa'
            mensaje: |
              Has usado los 12,7 mm como radio. Son el diámetro: la sección
              es $\pi\cdot 6{,}35^{2} = 126{,}7\ \text{mm}^{2}$.
        pista: |
          $F = 3500\cdot 9{,}8$ y $A_0 = \pi d^{2}/4$.
        desarrollo: |
          $$
          F = 3500\cdot 9{,}8 = 34\,300\ \text{N}
          \qquad
          A_0 = \pi\cdot 6{,}35^{2} = 126{,}7\ \text{mm}^{2}
          $$

          $$
          \sigma = \frac{34\,300}{126{,}7} = 270{,}8\ \text{MPa}
          $$

          El aluminio (250), el cobre (207) y el magnesio (170) quedan por
          debajo: con ellos la deformación no sería solo elástica.

      - tipo: calcular
        titulo: El módulo que haría falta
        pregunta: |
          ¿Qué módulo elástico mínimo necesitaría el metal para alargarse
          menos de $0{,}08\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '859700 MPa'
          tolerancia: 0.02
          formato: un módulo elástico, en MPa y con la unidad
        distractores:
          - valor: '3385 MPa'
            mensaje: |
              Has dividido la tensión entre los 0,08 mm como si fueran la
              deformación. La deformación es adimensional: 0,08 entre la
              longitud, 254 mm.
          - valor: '42980 MPa'
            mensaje: |
              Has dividido el alargamiento entre el diámetro. La deformación
              longitudinal va con la longitud de la probeta, 254 mm; el
              diámetro solo entra en la deformación transversal.
        pista: |
          $\varepsilon_{\text{máx}} = 0{,}08/254$, y $E_{\text{mín}} = \sigma/\varepsilon_{\text{máx}}$.
        desarrollo: |
          $$
          \varepsilon_{\text{máx}} = \frac{0{,}08}{254} = 3{,}15\cdot 10^{-4}
          \qquad
          E_{\text{mín}} = \frac{270{,}8}{3{,}15\cdot 10^{-4}}
          = 8{,}60\cdot 10^{5}\ \text{MPa}
          $$

          Son 860 GPa. El mayor de la tabla, el acero, tiene 206: ningún
          metal se acerca.

      - tipo: calcular
        titulo: Lo que estrecha el acero
        pregunta: |
          El acero es el que menos estrecha: mayor módulo y menor Poisson.
          ¿Cuánto disminuye su diámetro?
        respuesta:
          tipo: magnitud
          valor: '0.00451 mm'
          tolerancia: 0.02
          formato: una disminución, en positivo y con su unidad
        distractores:
          - valor: '-0.00451 mm'
            mensaje: |
              El número es el bueno. Pero se pregunta la **disminución**, que
              ya lleva el sentido en el nombre: se escribe en positivo, igual
              que el límite de $1{,}2\times 10^{-3}$ del enunciado.
          - valor: '0.0167 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson. La deformación
              transversal es $\nu$ veces la axial, un 27 % en el acero, no la
              axial entera.
          - valor: '0.0901 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud,
              254 mm. Es el **diámetro** el que cambia: se multiplica por los
              12,7 mm.
        pista: |
          $\varepsilon_z = \sigma/E$, $|\varepsilon_x| = \nu\,\varepsilon_z$
          y la disminución es $|\varepsilon_x|\,d_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{270{,}8}{206\,000} = 1{,}314\cdot 10^{-3}
          \qquad
          |\Delta d| = 0{,}27\cdot 1{,}314\cdot 10^{-3}\cdot 12{,}7
          = 4{,}51\cdot 10^{-3}\ \text{mm}
          $$

          Casi cuatro veces los $1{,}2\cdot 10^{-3}$ permitidos. Y si el que
          menos estrecha no cumple, no cumple ninguno.

      - tipo: justificar
        pregunta: Ordena por qué no vale ninguno. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es 270,8 MPa: el aluminio, el cobre y el magnesio ni
              siquiera se quedan en la zona elástica.
          - texto: >-
              Para alargarse menos de 0,08 mm haría falta un módulo de
              860 GPa, y el mayor de la tabla es el del acero, 206 GPa.
          - texto: >-
              El acero, que es el que menos estrecha, pierde 4,5·10⁻³ mm de
              diámetro: casi cuatro veces lo permitido.
          - texto: >-
              El acero es el adecuado, porque es el único que cumple las dos
              condiciones de deformación.
            trampa: true
            mensaje: |
              Es el que más se acerca, pero no cumple ninguna: se alarga
              0,33 mm, cuatro veces 0,08, y estrecha $4{,}5\cdot 10^{-3}$ mm,
              casi cuatro veces el límite. «El mejor de la tabla» no es lo
              mismo que «adecuado».
    resolucion: |
      **La tensión.** $F = 3500\cdot 9{,}8 = 34\,300\ \text{N}$ sobre
      $126{,}7\ \text{mm}^{2}$:

      $$
      \sigma = 270{,}8\ \text{MPa}
      $$

      Aluminio, cobre y magnesio tienen el límite elástico por debajo:
      plastifican y quedan fuera desde el principio.

      **El alargamiento.** El que cumpla necesita

      $$
      E \ge \frac{\sigma}{0{,}08/254} = 8{,}60\cdot 10^{5}\ \text{MPa} = 860\ \text{GPa}
      $$

      y ninguno se acerca. Material a material, con Hooke:

      | metal | $\Delta l$ (mm) | disminución de $d$ (mm) |
      |---|---|---|
      | latón | 0,688 | $1{,}20\cdot 10^{-2}$ |
      | acero | 0,334 | $4{,}51\cdot 10^{-3}$ |
      | titanio | 0,655 | $1{,}18\cdot 10^{-2}$ |

      **El diámetro.** Todos pasan del $1{,}2\cdot 10^{-3}$ permitido, incluido
      el acero. La respuesta es la del listado: **ninguno**, por las dos
      condiciones.

      **Lo que hay que llevarse.** Cuando todos los candidatos soportan la
      misma tensión, cada condición se convierte en un umbral sobre una sola
      columna: el alargamiento, sobre el módulo; el estrechamiento, sobre
      $\nu/E$. Una cuenta por condición, y no seis.
  - id: ejcm2-col219-la-tabla-en-psi
    titulo: La tabla en psi, y el único que cumple
    fuente: >-
      Ejercicio 2.19 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta de $380\ \text{mm}$ de longitud y $10\ \text{mm}$ de diámetro
      se somete a tracción. Si la probeta no debe sufrir deformación plástica
      ni un alargamiento superior a $0{,}9\ \text{mm}$ al aplicarle una carga
      de $24500\ \text{N}$, ¿cuáles de los metales de la siguiente tabla
      podrían ser adecuados? Razona tu respuesta.
      ($1\ \text{psi} = 0{,}007\ \text{MPa}$).

      | Material | $E$ (psi) · $10^{6}$ | Límite elástico (psi) | Resistencia a tracción (psi) |
      |---|---|---|---|
      | Aleación de aluminio | 10 | 37000 | 61000 |
      | Latón | 14,6 | 50000 | 61000 |
      | Cobre | 16 | 30000 | 40000 |
      | Acero | 30 | 65000 | 80000 |
    pide: Qué metales no se deforman plásticamente y cuáles, además, se alargan 0,9 mm o menos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla está en psi y la carga en newtons. ¿Qué haces antes de
          comparar nada?
        opciones:
          - texto: >-
              Pasar la tabla a MPa con 1 psi = 0,007 MPa, sin olvidar el 10⁶
              de la columna del módulo
            correcta: true
            mensaje: |
              Eso es. Los límites elásticos se multiplican por 0,007 tal cual;
              el módulo, además, lleva el $10^{6}$ del encabezado: el latón
              tiene 14,6 millones de psi, es decir 102 200 MPa.
          - texto: >-
              Nada: psi y MPa son las dos unidades de tensión y se comparan
              directamente
            mensaje: |
              Miden lo mismo pero no valen lo mismo. Un psi son 0,007 MPa,
              unas 143 veces menos: los 50 000 psi del latón son 350 MPa.
          - texto: >-
              Multiplicar por 0,007 todas las columnas tal como están escritas
            mensaje: |
              Con el módulo no basta: la columna va en psi·10⁶. Si pasas el
              14,6 del latón sin el millón, te sale un módulo de 0,1 MPa y un
              alargamiento de kilómetros.
          - texto: >-
              Comparar la tensión con la resistencia a tracción
            mensaje: |
              El enunciado pide que no haya deformación plástica, y eso lo
              marca el límite elástico. La resistencia a tracción está mucho
              más arriba y no es el criterio.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la probeta?
        respuesta:
          tipo: magnitud
          valor: '311.9 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '78 MPa'
            mensaje: |
              Has usado los 10 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 5^{2} = 78{,}5\ \text{mm}^{2}$, cuatro veces menos.
          - valor: '1248 MPa'
            mensaje: |
              Has partido el diámetro por dos y además has dividido entre
              cuatro. O $\pi r^{2}$ con el radio, o $\pi d^{2}/4$ con el
              diámetro; las dos cosas a la vez, no.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 5^{2}\ \text{mm}^{2}$.
        desarrollo: |
          $$
          A_0 = \pi\cdot 5^{2} = 78{,}54\ \text{mm}^{2}
          \qquad
          \sigma = \frac{24\,500}{78{,}54} = 311{,}9\ \text{MPa}
          $$

          Pasada a MPa, la tabla da límites de 259 (aluminio), 350 (latón),
          210 (cobre) y 455 (acero). Aluminio y cobre plastifican.

      - tipo: calcular
        titulo: El alargamiento del latón
        pregunta: |
          El latón no plastifica. ¿Cuánto se alarga?
        respuesta:
          tipo: magnitud
          valor: '1.16 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '0.00812 mm'
            mensaje: |
              Has usado el módulo en psi como si fuera en MPa: 14,6 millones
              en vez de 102 200. Sale un alargamiento 143 veces menor y el
              latón parecería perfecto.
          - valor: '0.29 mm'
            mensaje: |
              Arrastras la tensión calculada con el diámetro como radio. Con
              la sección buena, 78,5 mm², la tensión es 311,9 MPa y el
              alargamiento cuatro veces mayor.
        pista: |
          $E_{\text{latón}} = 14{,}6\cdot 10^{6}\cdot 0{,}007 = 102\,200\ \text{MPa}$,
          y $\Delta l = \sigma\,l_0/E$.
        desarrollo: |
          $$
          \Delta l = \frac{311{,}9}{102\,200}\cdot 380 = 1{,}16\ \text{mm}
          $$

          Más de 0,9 mm: el latón se descarta aunque no plastifique.

      - tipo: justificar
        pregunta: Ordena el razonamiento que deja solo al acero. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión es 311,9 MPa. El aluminio (259 MPa) y el cobre
              (210 MPa) tienen el límite elástico por debajo: plastifican.
          - texto: >-
              Quedan el latón (350 MPa) y el acero (455 MPa), que trabajan en
              la zona elástica.
          - texto: >-
              El latón, con 102 200 MPa de módulo, se alarga 1,16 mm, más de
              los 0,9 permitidos.
          - texto: >-
              El acero, con 210 000 MPa, se alarga 0,56 mm: es el único que
              cumple las dos condiciones.
          - texto: >-
              El latón también cumple, porque su resistencia a tracción,
              427 MPa, queda muy por encima de la tensión.
            trampa: true
            mensaje: |
              La resistencia a tracción no es ninguna de las dos condiciones.
              El latón pasa la primera por su límite elástico, sí, pero se
              alarga 1,16 mm y la segunda lo deja fuera.
    resolucion: |
      **La tabla en MPa.** Con $1\ \text{psi} = 0{,}007\ \text{MPa}$:

      | material | $E$ (MPa) | límite elástico (MPa) |
      |---|---|---|
      | aluminio | 70 000 | 259 |
      | latón | 102 200 | 350 |
      | cobre | 112 000 | 210 |
      | acero | 210 000 | 455 |

      **La tensión.**

      $$
      \sigma = \frac{24\,500}{\pi\cdot 5^{2}} = 311{,}9\ \text{MPa}
      $$

      **Sin deformación plástica.** Aluminio y cobre tienen el límite por
      debajo de 311,9: fuera.

      **Alargamiento de 0,9 mm como mucho.** Haría falta

      $$
      E \ge \frac{311{,}9}{0{,}9/380} = 131\,700\ \text{MPa}
      $$

      El latón se queda en 102 200 y se alarga 1,16 mm; el acero, con
      210 000, se alarga 0,56 mm. Solo cumple **el acero**, que es el
      resultado del listado.

      **Lo que hay que llevarse.** Una tabla en unidades inglesas no cambia el
      método, pero añade dos sitios donde equivocarse: el factor de
      conversión y el multiplicador escondido en el encabezado. El segundo es
      el que más se olvida.
  - id: ejcm2-col220-tres-condiciones-y-el-peso
    titulo: Tres condiciones, y el peso para desempatar
    fuente: >-
      Ejercicio 2.20 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra cilíndrica de $120\ \text{mm}$ de longitud y $15\ \text{mm}$
      de diámetro se deforma bajo una carga de $30000\ \text{N}$. Si no debe
      sufrir deformación plástica y además el alargamiento nunca debe superar
      los $0{,}22\ \text{mm}$, ¿cuáles de los materiales de la tabla serían
      adecuados? Y si además, la máxima disminución del diámetro que puede
      sufrir es de $1{,}2\times 10^{-2}\ \text{mm}$, ¿cuáles de los materiales
      de la tabla serían adecuados? Y si además el peso es un factor muy
      importante, ¿qué material elegirías?

      | Material | Módulo elástico (MPa · $10^{3}$) | Límite elástico (MPa) | Poisson | Densidad (g/cm³) |
      |---|---|---|---|---|
      | Aleación aluminio | 70 | 250 | 0,33 | 2,80 |
      | Aleación titanio | 105 | 850 | 0,36 | 4,50 |
      | Acero | 205 | 550 | 0,27 | 7,86 |
    pide: Qué materiales cumplen cada condición y cuál se elige si el peso importa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres condiciones y, al final, un criterio de peso. ¿En qué orden
          se aplican?
        opciones:
          - texto: >-
              Primero las tres condiciones, y el peso solo entre los que las
              cumplen
            correcta: true
            mensaje: |
              Eso es. Las condiciones son eliminatorias; el peso es un
              desempate. Un material ligero que se alarga de más no sirve,
              por poco que pese.
          - texto: >-
              Primero el peso, y luego se comprueba el más ligero
            mensaje: |
              El más ligero es el aluminio, y es justo el que no cumple el
              alargamiento. Empezar por el desempate te obliga a volver atrás.
          - texto: >-
              Solo el alargamiento, que es la condición más exigente
            mensaje: |
              Que una condición descarte a uno no dice nada de las demás. Cada
              una mira una columna distinta —límite, módulo, Poisson— y
              pueden descartar a materiales distintos.
          - texto: >-
              Gana el de mayor módulo específico, $E/\rho$
            mensaje: |
              El módulo específico mide rigidez por unidad de peso, y aquí
              daría el acero. Pero lo que se pide son unos límites fijos:
              cumplidos, la rigidez que sobra no cuenta, y entre los que
              cumplen pesa menos el titanio.

      - tipo: calcular
        titulo: La tensión
        pregunta: |
          ¿Qué tensión soporta la barra?
        respuesta:
          tipo: magnitud
          valor: '169.8 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '42.4 MPa'
            mensaje: |
              Has usado los 15 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 7{,}5^{2} = 176{,}7\ \text{mm}^{2}$.
          - valor: '679 MPa'
            mensaje: |
              Has partido el diámetro por dos y además has dividido entre
              cuatro. O $\pi r^{2}$ con el radio, o $\pi d^{2}/4$ con el
              diámetro; las dos a la vez, no.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 7{,}5^{2}$.
        desarrollo: |
          $$
          A_0 = \pi\cdot 7{,}5^{2} = 176{,}7\ \text{mm}^{2}
          \qquad
          \sigma = \frac{30\,000}{176{,}7} = 169{,}8\ \text{MPa}
          $$

          Por debajo de los tres límites elásticos: ninguno plastifica.

      - tipo: calcular
        titulo: El alargamiento del aluminio
        pregunta: |
          ¿Cuánto se alarga la barra si es de aleación de aluminio?
        respuesta:
          tipo: magnitud
          valor: '0.291 mm'
          tolerancia: 0.02
          formato: un alargamiento, con su unidad
        distractores:
          - valor: '0.00243 mm'
            mensaje: |
              Esa es la deformación unitaria, $\sigma/E$, que no tiene
              unidades. Falta multiplicarla por la longitud, 120 mm.
          - valor: '291 mm'
            mensaje: |
              Te has dejado el $10^{3}$ del encabezado. El módulo del aluminio
              son 70 000 MPa, no 70.
        pista: |
          $\Delta l = \sigma\,l_0/E$, con $E = 70\,000\ \text{MPa}$.
        desarrollo: |
          $$
          \Delta l = \frac{169{,}8}{70\,000}\cdot 120 = 0{,}291\ \text{mm} > 0{,}22
          $$

          El aluminio queda fuera. El titanio se alarga 0,194 mm y el acero
          0,099 mm: los dos cumplen.

      - tipo: calcular
        titulo: Lo que estrecha el titanio
        pregunta: |
          ¿Cuánto disminuye el diámetro de la barra de titanio?
        respuesta:
          tipo: magnitud
          valor: '0.00873 mm'
          tolerancia: 0.02
          formato: una disminución, en positivo y con su unidad
        distractores:
          - valor: '0.0243 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson. La deformación
              transversal es $\nu$ veces la axial: un 36 % en el titanio.
          - valor: '0.0698 mm'
            mensaje: |
              Has multiplicado la deformación transversal por la longitud. Lo
              que cambia es el diámetro: se multiplica por los 15 mm.
        pista: |
          $\varepsilon_z = \sigma/E$, disminución $= \nu\,\varepsilon_z\,d_0$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{169{,}8}{105\,000} = 1{,}617\cdot 10^{-3}
          \qquad
          0{,}36\cdot 1{,}617\cdot 10^{-3}\cdot 15 = 8{,}73\cdot 10^{-3}\ \text{mm}
          $$

          Por debajo de $1{,}2\cdot 10^{-2}$. El acero estrecha
          $3{,}35\cdot 10^{-3}$ mm: también cumple.

      - tipo: calcular
        titulo: Lo que pesa la barra de titanio
        pregunta: |
          ¿Cuánto pesa la barra si es de titanio?
        respuesta:
          tipo: magnitud
          valor: '95.4 g'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '166.7 g'
            mensaje: |
              Esa es la del acero, con 7,86 g/cm³. La de titanio, con
              4,50 g/cm³, pesa un 43 % menos: por eso gana el desempate.
          - valor: '381.7 g'
            mensaje: |
              Has calculado el volumen con los 15 mm como radio. El volumen es
              $\pi\cdot 7{,}5^{2}\cdot 120\ \text{mm}^{3}$, cuatro veces menos.
        pista: |
          $V = A_0\,l_0$ en cm³, y $m = \rho\,V$.
        desarrollo: |
          $$
          V = 176{,}7\cdot 120 = 21\,206\ \text{mm}^{3} = 21{,}21\ \text{cm}^{3}
          \qquad
          m = 4{,}50\cdot 21{,}21 = 95{,}4\ \text{g}
          $$

      - tipo: justificar
        pregunta: Ordena la elección. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión, 169,8 MPa, está por debajo de los tres límites
              elásticos: ninguno plastifica.
          - texto: >-
              El aluminio se alarga 0,291 mm, más de 0,22: se descarta.
          - texto: >-
              Titanio y acero estrechan 8,7·10⁻³ y 3,4·10⁻³ mm, los dos por
              debajo de 1,2·10⁻² mm: siguen los dos.
          - texto: >-
              Si el peso importa, gana el titanio: 95 g frente a los 167 del
              acero.
          - texto: >-
              Si el peso importa, el mejor es el aluminio, que es el más
              ligero de los tres.
            trampa: true
            mensaje: |
              El peso desempata entre los que cumplen, y el aluminio ya se
              había caído por el alargamiento. Por ligero que sea, una barra
              que se alarga 0,29 mm donde se permiten 0,22 no sirve.
    resolucion: |
      **La tensión.**

      $$
      \sigma = \frac{30\,000}{\pi\cdot 7{,}5^{2}} = 169{,}8\ \text{MPa}
      $$

      Los tres límites (250, 850 y 550 MPa) están por encima: **ninguno
      plastifica**.

      **Las dos condiciones de deformación.**

      | material | $\Delta l$ (mm) | disminución de $d$ (mm) |
      |---|---|---|
      | aluminio | **0,291** | $1{,}20\cdot 10^{-2}$ |
      | titanio | 0,194 | $8{,}73\cdot 10^{-3}$ |
      | acero | 0,099 | $3{,}35\cdot 10^{-3}$ |

      El aluminio pasa de 0,22 mm: **se descarta**. Titanio y acero cumplen
      las dos. El aluminio, de paso, se queda justo en el borde del diámetro
      —$1{,}2005\cdot 10^{-2}$—, pero ya estaba fuera.

      **El peso.** Con la misma barra, de $21{,}21\ \text{cm}^{3}$, el titanio
      pesa 95 g y el acero 167 g. Se elige **el titanio**, que es el resultado
      del listado.

      **Lo que hay que llevarse.** Las condiciones eliminan; el criterio de
      peso ordena lo que queda. Aplicarlos al revés lleva directo al
      aluminio, que es el más ligero y el único que no sirve.
  - id: ejcm2-col221-el-acero-del-muelle
    titulo: El límite elástico que necesita un muelle
    fuente: >-
      Ejercicio 2.21 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Para poder ser empleado como muelle un acero debe presentar un módulo de
      resiliencia mínimo de $2{,}07\ \text{MPa}$. ¿Cuál será entonces el valor
      mínimo de límite elástico? Dato: $E=205\cdot 10^{3}\ \text{MPa}$.
    pide: El límite elástico mínimo del acero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es el módulo de resiliencia en el diagrama tensión-deformación?
        opciones:
          - texto: >-
              El área bajo la curva hasta el límite elástico: la energía por
              unidad de volumen que el material devuelve al descargar
            correcta: true
            mensaje: |
              Eso es. Es justo lo que se le pide a un muelle: absorber
              energía al deformarse y devolverla entera, sin quedarse
              deformado.
          - texto: >-
              El área bajo toda la curva, hasta la rotura
            mensaje: |
              Esa es la tenacidad. Un muelle no puede plastificar, así que la
              energía que cuenta es la que devuelve, la de la zona elástica.
          - texto: >-
              La pendiente del tramo elástico
            mensaje: |
              La pendiente es el módulo de Young, la rigidez. La resiliencia
              es un área, y por eso sale en MPa, que es lo mismo que MJ/m³:
              energía por volumen.
          - texto: >-
              La tensión máxima que aguanta el material
            mensaje: |
              Esa es la resistencia a tracción, y está en la zona plástica. La
              resiliencia se queda antes, en el límite elástico.

      - tipo: calcular
        titulo: El límite elástico mínimo
        pregunta: |
          ¿Qué límite elástico mínimo necesita el acero?
        respuesta:
          tipo: magnitud
          valor: '921 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '651 MPa'
            mensaje: |
              Te has dejado el 2 del denominador. El área es un triángulo:
              $U_r = \tfrac{1}{2}\,\sigma_y\,\varepsilon_y = \sigma_y^{2}/2E$,
              así que al despejar el 2 pasa multiplicando.
          - valor: '461 MPa'
            mensaje: |
              Has pasado el 2 dividiendo en vez de multiplicando. Si
              $U_r = \sigma_y^{2}/2E$, entonces $\sigma_y^{2} = 2E\,U_r$.
          - valor: '29.1 MPa'
            mensaje: |
              Has puesto el módulo en GPa, 205, con la resiliencia en MPa.
              Las dos tienen que ir en la misma unidad: 205 000 MPa.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$, despejando $\sigma_y$.
        desarrollo: |
          $$
          \sigma_y = \sqrt{2\,E\,U_r} = \sqrt{2\cdot 205\,000\cdot 2{,}07}
          = \sqrt{848\,700} = 921\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un muelle trabaja solo en la zona elástica, y la energía que
              devuelve por unidad de volumen es el módulo de resiliencia.
          - texto: >-
              Con el tramo elástico recto, esa área es un triángulo de base
              $\varepsilon_y$ y altura $\sigma_y$, es decir $\sigma_y^{2}/2E$.
          - texto: >-
              Despejando sale 921 MPa, y es un mínimo: con más límite elástico
              la resiliencia crece con el cuadrado.
          - texto: >-
              Con un acero de módulo de Young mayor bastaría un límite
              elástico menor.
            trampa: true
            mensaje: |
              Al revés. $E$ está en el denominador: un módulo mayor hace el
              triángulo más estrecho y baja la resiliencia, así que haría
              falta **más** límite elástico. Un buen muelle quiere límite
              alto y módulo no demasiado alto.
    resolucion: |
      **Qué es la resiliencia.** El área bajo la curva hasta el límite
      elástico. Con el tramo elástico recto es un triángulo:

      $$
      U_r = \frac{1}{2}\,\sigma_y\,\varepsilon_y = \frac{\sigma_y^{2}}{2E}
      $$

      **El límite elástico.** Despejando:

      $$
      \sigma_y = \sqrt{2\,E\,U_r} = \sqrt{2\cdot 205\,000\cdot 2{,}07}
      = 921\ \text{MPa}
      $$

      Es el resultado del listado. Y es un **mínimo**: la resiliencia crece
      con el cuadrado del límite elástico, así que cualquier acero con más de
      921 MPa sirve.

      **Lo que hay que llevarse.** Para guardar energía elástica importa
      mucho más el límite elástico que la rigidez, porque entra al cuadrado.
      Por eso los aceros de muelle son aceros de límite elástico muy alto, no
      aceros especialmente rígidos: el módulo de todos los aceros es casi el
      mismo.
  - id: ejcm2-col222-las-dos-medidas-de-la-ductilidad
    titulo: Las dos medidas de la ductilidad
    fuente: >-
      Ejercicio 2.22 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta de $12{,}8\ \text{mm}$ de diámetro y $50{,}8\ \text{mm}$ de
      longitud se somete a tracción hasta rotura. En el punto de rotura el
      diámetro es de $6{,}6\ \text{mm}$ y la longitud de $72{,}14\ \text{mm}$.
      Calcula la ductilidad en forma de reducción porcentual de área y
      alargamiento porcentual relativo.
    pide: La reducción de área y el alargamiento, en porcentaje.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué se calculan las dos medidas de la ductilidad?
        opciones:
          - texto: >-
              Con las dimensiones en rotura, referidas a las iniciales:
              $(l_f-l_0)/l_0$ y $(A_0-A_f)/A_0$
            correcta: true
            mensaje: |
              Eso es. Las dos comparan la probeta rota con la probeta de
              partida, y las dos se dividen entre la inicial.
          - texto: >-
              La reducción de área, con los diámetros: $(d_0-d_f)/d_0$
            mensaje: |
              El área va con el **cuadrado** del diámetro. Con los diámetros
              a secas sale un 48 %, y el área se ha reducido mucho más.
          - texto: >-
              Las dos, divididas entre las dimensiones finales
            mensaje: |
              Por definición se refieren a la probeta inicial: son cuánto ha
              cambiado respecto de lo que había. Dividir entre la final da
              otro número y no es el que se pide.

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la reducción de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '73.4'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '48.4'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área de
              un círculo va con $d^{2}$: $(6{,}6/12{,}8)^{2} = 0{,}266$, así
              que queda un 26,6 % del área y se ha perdido el 73,4 %.
          - valor: '276'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la inicial, y por eso nunca pasa del 100 %.
        pista: |
          $\%AR = \left(1 - \dfrac{d_f^{2}}{d_0^{2}}\right)\cdot 100$, porque
          el $\pi/4$ se va.
        desarrollo: |
          $$
          \%AR = \frac{A_0 - A_f}{A_0}\cdot 100
          = \left(1 - \left(\frac{6{,}6}{12{,}8}\right)^{2}\right)\cdot 100
          = 73{,}4\ \%
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento porcentual relativo?
        respuesta:
          tipo: numero
          valor: '42.0'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '29.6'
            mensaje: |
              Has dividido entre la longitud final, 72,14. El alargamiento
              relativo se refiere a la inicial, 50,8 mm.
          - valor: '142'
            mensaje: |
              Has calculado $l_f/l_0$ por cien sin restar la longitud inicial.
              Eso dice que la probeta mide el 142 % de lo que medía; lo que se
              ha **alargado** es el 42 %.
        pista: |
          $\%EL = \dfrac{l_f - l_0}{l_0}\cdot 100$.
        desarrollo: |
          $$
          \%EL = \frac{72{,}14 - 50{,}8}{50{,}8}\cdot 100
          = \frac{21{,}34}{50{,}8}\cdot 100 = 42{,}0\ \%
          $$

      - tipo: justificar
        pregunta: Ordena lo que dicen los dos números. Una pieza es falsa.
        piezas:
          - texto: >-
              La probeta se ha alargado un 42 % respecto de su longitud
              inicial.
          - texto: >-
              En la sección de rotura queda un 26,6 % del área: se ha perdido
              el 73,4 %.
          - texto: >-
              Las dos medidas están muy por encima del 5 % que separa lo
              frágil de lo dúctil: es un material muy dúctil.
          - texto: >-
              Como la reducción de área sale mayor que el alargamiento, la
              probeta ha perdido volumen al romper.
            trampa: true
            mensaje: |
              El volumen se conserva. Las dos cifras miden sitios distintos:
              el alargamiento es un promedio sobre toda la longitud, y la
              reducción de área se mide en el cuello, donde la estricción ha
              concentrado casi toda la deformación final.
    resolucion: |
      **Reducción de área.** El $\pi/4$ se simplifica y queda el cociente de
      diámetros al cuadrado:

      $$
      \%AR = \left(1 - \left(\frac{6{,}6}{12{,}8}\right)^{2}\right)\cdot 100
      = 73\ \%
      $$

      **Alargamiento relativo.**

      $$
      \%EL = \frac{72{,}14 - 50{,}8}{50{,}8}\cdot 100 = 42\ \%
      $$

      Son los dos valores del listado.

      **Lo que hay que llevarse.** Las dos son medidas de ductilidad, pero no
      miden lo mismo ni tienen por qué coincidir. El alargamiento reparte la
      deformación por toda la probeta; la reducción de área la mide en el
      cuello, que es donde se ha acumulado tras la estricción. Por eso, en un
      material dúctil, la reducción de área suele salir mayor.
  - id: ejcm2-col223-seis-curvas-sin-numeros
    titulo: Seis curvas sin un solo número
    fuente: >-
      Ejercicio 2.23 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica resultado:
      es un ejercicio de dibujo, y cada curva se ha contrastado con las
      definiciones de las transparencias del tema.
    nivel: practica
    enunciado: |
      Dibuja el diagrama tensión-deformación característico de un material:

      a) Rígido, resistente, tenaz y dúctil.

      b) Elástico y tenaz.

      c) Rígido, resistente y frágil.

      d) Rígido, poco resistente y frágil.

      e) Elástico, poco resistente y frágil.

      f) Elástico y resiliente.
    pide: La forma de cada una de las seis curvas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de dibujar, ¿en qué parte de la curva se ve que un material es
          «rígido»?
        opciones:
          - texto: >-
              En la pendiente del tramo elástico: rígido es módulo de Young
              alto, una recta empinada
            correcta: true
            mensaje: |
              Eso es. Y «elástico», en este ejercicio, es lo contrario: recta
              tendida, que se deforma mucho elásticamente con poca tensión.
          - texto: >-
              En la altura máxima que alcanza la curva
            mensaje: |
              La altura máxima es la resistencia a tracción: eso es
              «resistente». Un material puede ser muy rígido y poco
              resistente, como el caso d).
          - texto: >-
              En lo larga que es la curva antes de romper
            mensaje: |
              La longitud es la deformación a rotura: eso es «dúctil», o
              «frágil» si la curva acaba enseguida.
          - texto: >-
              En el área bajo la curva
            mensaje: |
              El área es energía: hasta la rotura es la tenacidad y hasta el
              límite elástico, la resiliencia. La rigidez es una pendiente, no
              un área.

      - tipo: calcular
        titulo: Lo que la pendiente hace con la resiliencia
        pregunta: |
          Dos materiales tienen el mismo límite elástico, y uno tiene la mitad
          de módulo de Young que el otro: es el más «elástico». ¿Por cuánto se
          multiplica su módulo de resiliencia respecto del otro?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.05
          formato: un número, el factor
        distractores:
          - valor: '0.5'
            mensaje: |
              Lo has invertido. $U_r = \sigma_y^{2}/2E$ lleva el módulo en el
              denominador: con la mitad de $E$, el triángulo llega a la misma
              altura con el doble de base, y su área se dobla.
          - valor: '1'
            mensaje: |
              Misma altura no es misma área. El triángulo de la resiliencia
              tiene de base $\varepsilon_y = \sigma_y/E$, y con la mitad de
              módulo esa base se dobla.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$: el límite elástico no cambia y el
          módulo se divide entre dos.
        desarrollo: |
          $$
          \frac{U_r'}{U_r} = \frac{\sigma_y^{2}/(2\cdot E/2)}{\sigma_y^{2}/(2E)} = 2
          $$

          Por eso el f) es «elástico **y** resiliente»: una recta tendida que
          llega alto encierra mucha área antes de plastificar.

      - tipo: justificar
        pregunta: Ordena cómo es cada curva. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Recta empinada, curva alta y muy larga: mucha área debajo, y
              rompe tras una gran deformación plástica.
          - texto: >-
              c) y d) Recta empinada que rompe poco después del límite
              elástico; la c) alta y la d) baja.
          - texto: >-
              e) Recta tendida y baja, y rotura casi al acabar la recta.
          - texto: >-
              f) Recta tendida que llega a un límite elástico alto: mucha área
              bajo el tramo elástico.
          - texto: >-
              b) Elástico y tenaz es lo mismo que elástico y dúctil: una curva
              muy larga ya lo cumple.
            trampa: true
            mensaje: |
              Tenacidad es área, no longitud: las transparencias lo dicen con
              todas las letras, «no confundir ductilidad y tenacidad». Una
              curva larga pero muy baja encierra poca área. Para ser tenaz
              hace falta deformarse mucho **y** a una tensión apreciable.
    resolucion: |
      **Cómo se lee cada adjetivo.** Cada uno vive en una parte distinta de la
      curva:

      | adjetivo | dónde se ve |
      |---|---|
      | rígido / elástico | pendiente del tramo recto: alta / baja |
      | resistente / poco resistente | altura máxima de la curva |
      | dúctil / frágil | deformación a la que rompe: mucha / poca |
      | tenaz | área bajo toda la curva |
      | resiliente | área bajo el tramo elástico |

      **Las seis curvas.**

      a) Recta muy empinada, que sube alto y sigue una zona plástica larga
      antes de romper. Mucha área: es tenaz porque es resistente y dúctil a
      la vez.

      b) Recta tendida, y después una zona plástica larga a una tensión
      apreciable, de modo que el área total sea grande.

      c) Recta muy empinada que llega muy alto y rompe casi al acabar, sin
      zona plástica apreciable.

      d) Igual de empinada que la c), pero rompe mucho antes, a poca tensión.

      e) Recta tendida y corta: rompe a poca tensión y enseguida.

      f) Recta tendida que llega a un límite elástico alto. Como
      $U_r = \sigma_y^{2}/2E$, módulo bajo y límite alto dan mucha área bajo
      el tramo elástico.

      **Lo que hay que llevarse.** El diagrama tiene cinco lecturas
      —pendiente, altura, longitud y dos áreas— y cada adjetivo es una sola
      de ellas. El error típico es mezclar las dos que más se parecen: dúctil
      es longitud, tenaz es área.
  - id: ejcm2-col224-la-tension-real-en-el-cuello
    titulo: La tensión real en el cuello de rotura
    fuente: >-
      Ejercicio 2.24 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero de $12{,}8\ \text{mm}$
      ($0{,}505\ \text{plg}$) de diámetro se somete a tracción hasta rotura,
      siendo su resistencia a tracción en rotura de $460\ \text{MPa}$
      ($167000\ \text{psi}$). Si el diámetro de la probeta en el punto de
      rotura es de $10{,}7\ \text{mm}$ ($0{,}422\ \text{plg}$), indica:

      a) Ductilidad (porcentaje de disminución de área).

      b) Tensión real de rotura.
    pide: La reducción de área y la tensión real en el punto de rotura.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tensión real de rotura, ¿con qué se calcula?
        opciones:
          - texto: >-
              Con la carga de rotura dividida entre la sección en el punto de
              rotura, la de 10,7 mm
            correcta: true
            mensaje: |
              Eso es. La tensión real se refiere al área que hay en cada
              momento, y en la rotura esa área es la del cuello.
          - texto: >-
              Con la carga de rotura dividida entre la sección inicial
            mensaje: |
              Eso da la tensión **nominal**, que son precisamente los 460 MPa
              del enunciado. La real usa el área que queda.
          - texto: >-
              Con $\sigma_T = \sigma\,(1+\varepsilon)$
            mensaje: |
              Esa fórmula supone que la probeta se estira por igual en toda su
              longitud, y eso deja de ser cierto con la estricción. En la
              rotura la deformación se concentra en el cuello: hay que ir al
              área.

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la disminución de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '30.1'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '16.4'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área va
              con $d^{2}$: $(10{,}7/12{,}8)^{2} = 0{,}699$, y se ha perdido el
              30 %.
          - valor: '43.1'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la sección inicial.
        pista: |
          $\%AR = \left(1 - (d_f/d_0)^{2}\right)\cdot 100$.
        desarrollo: |
          $$
          \%AR = \left(1 - \left(\frac{10{,}7}{12{,}8}\right)^{2}\right)\cdot 100
          = (1 - 0{,}699)\cdot 100 = 30{,}1\ \%
          $$

      - tipo: calcular
        titulo: La tensión real de rotura
        pregunta: |
          ¿Cuánto vale la tensión real en el punto de rotura?
        respuesta:
          tipo: magnitud
          valor: '658 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '321 MPa'
            mensaje: |
              Has invertido el cociente de áreas. El área real es **menor**
              que la inicial, así que la tensión real sale **mayor** que la
              nominal: se multiplica por $A_0/A_f$, no por $A_f/A_0$.
          - valor: '550 MPa'
            mensaje: |
              Has multiplicado por el cociente de diámetros sin elevarlo al
              cuadrado. Las áreas van con $d^{2}$: el factor es
              $(12{,}8/10{,}7)^{2} = 1{,}431$.
          - valor: '599 MPa'
            mensaje: |
              Has usado $\sigma(1+\varepsilon)$ poniendo la reducción de área
              como deformación. Esa fórmula no vale tras la estricción, y la
              reducción de área no es una deformación longitudinal.
        pista: |
          $F = 460\cdot A_0$ es la misma carga; $\sigma_T = F/A_f$, es decir
          $\sigma_T = 460\,(d_0/d_f)^{2}$.
        desarrollo: |
          $$
          F = 460\cdot \pi\cdot 6{,}4^{2} = 460\cdot 128{,}7 = 59\,190\ \text{N}
          \qquad
          A_f = \pi\cdot 5{,}35^{2} = 89{,}9\ \text{mm}^{2}
          $$

          $$
          \sigma_T = \frac{59\,190}{89{,}9} = 658\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena por qué la tensión real sale mayor. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga en la rotura es una sola, 59 190 N: la de los 460 MPa
              sobre la sección inicial.
          - texto: >-
              En el cuello la sección es 89,9 mm², un 30 % menos que los
              128,7 mm² iniciales.
          - texto: >-
              La misma carga sobre menos área da más tensión: 658 MPa.
          - texto: >-
              La tensión real es menor que la nominal, porque en la rotura el
              material ya se ha debilitado.
            trampa: true
            mensaje: |
              Tras la estricción la carga baja, sí, pero el área baja más
              deprisa. En tracción la tensión real nunca es menor que la
              nominal: el material de verdad se está endureciendo, y lo que
              la curva nominal esconde es solo que la sección se estrecha.
    resolucion: |
      **a) Ductilidad.**

      $$
      \%AR = \left(1 - \left(\frac{10{,}7}{12{,}8}\right)^{2}\right)\cdot 100
      = 30\ \%
      $$

      **b) Tensión real de rotura.** La carga es la misma; cambia el área
      sobre la que se reparte:

      $$
      \sigma_T = \frac{F}{A_f} = 460\cdot\left(\frac{12{,}8}{10{,}7}\right)^{2}
      = 460\cdot 1{,}431 = 658\ \text{MPa}
      $$

      Son los dos valores del listado.

      > **Una errata en el enunciado.** 460 MPa son unos 66 700 psi, no
      > 167 000: esos serían 1151 MPa. El resultado del listado, 658 MPa, sale
      > con los 460 MPa, así que la cifra que manda es esa. En psi, los
      > 658 MPa son unos 95 500 psi; el listado imprime 95 700, una diferencia
      > de conversión del 0,2 %.

      **Lo que hay que llevarse.** La tensión nominal divide entre un área que
      ya no existe. Hasta la estricción la diferencia es pequeña; en la
      rotura es de un 43 %, y es entonces cuando la curva nominal parece decir
      que el material se debilita cuando en realidad se está endureciendo.
  - id: ejcm2-col227-la-curva-del-magnesio
    titulo: La curva de la aleación de magnesio, punto a punto
    fuente: >-
      Ejercicio 2.27 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      Una probeta de una aleación de magnesio de sección rectangular
      $3{,}2\ \text{mm} \times 19{,}1\ \text{mm}$ se deforma a tracción.
      Construye la curva tensión-deformación a partir de los datos de la tabla
      y calcula:

      | Carga (N) | Longitud (mm) |
      |---|---|
      | 0 | 63,5 |
      | 1380 | 63,53 |
      | 2780 | 63,58 |
      | 5630 | 63,63 |
      | 7430 | 63,7 |
      | 8140 | 63,75 |
      | 9870 | 64,14 |
      | 12850 | 65,41 |
      | 14100 | 66,68 |
      | 14340 | 67,92 |
      | 13830 | 69,22 |
      | 12500 | 70,49 |

      a) Módulo elástico.

      b) Límite elástico a deformación de $0{,}002$.

      c) Resistencia a tracción de la aleación.

      d) Alargamiento relativo porcentual.

      e) ¿Cuáles serán las nuevas dimensiones de la sección al soportar
      $8000\ \text{N}$, si su coeficiente de Poisson es de $0{,}29$?
    pide: El módulo, el límite elástico, la resistencia a tracción, el alargamiento y las dimensiones de la sección bajo 8000 N.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se pasa de la tabla a la curva tensión-deformación?
        opciones:
          - texto: >-
              Cada carga entre la sección inicial, 61,12 mm², y cada
              alargamiento entre la longitud inicial, 63,5 mm
            correcta: true
            mensaje: |
              Eso es: $\sigma = F/A_0$ y $\varepsilon = (l - l_0)/l_0$. Es la
              curva nominal, y sobre ella se definen el módulo, el límite
              elástico y la resistencia a tracción.
          - texto: >-
              Cada carga entre la sección inicial, y cada longitud de la tabla
              como deformación
            mensaje: |
              63,53 es una longitud, no una deformación. La deformación es lo
              que se ha alargado respecto de la inicial: $0{,}03/63{,}5$.
          - texto: >-
              Cada carga entre la sección de ese momento, que va menguando
            mensaje: |
              Eso da la tensión real, y la tabla no dice cuánto mide la
              sección en cada punto. La curva que se pide es la nominal, con
              la sección inicial.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico? Tómalo del tramo recto del
          principio.
        respuesta:
          tipo: magnitud
          valor: '45000 MPa'
          # Los datos no fijan E mejor que un ±10 %: las longitudes vienen a la
          # centésima de milímetro, así que la deformación de los primeros
          # puntos tiene un error de 1,6·10⁻⁴, y el primero sale con un 33 %.
          # Con 0,12 entran el punto de 5630 N (45,0 GPa) y la regresión de los
          # cuatro primeros (40,2 GPa); los dos distractores quedan a más del
          # 90 %.
          tolerancia: 0.12
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '1858 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. Esa recta atraviesa
              toda la zona plástica: el módulo es la pendiente del tramo
              **recto** del principio, antes de que la curva se doble.
          - valor: '3371 MPa'
            mensaje: |
              Has tomado el punto de carga máxima. Ahí la deformación es casi
              toda plástica, y la ley de Hooke hace rato que no vale.
        pista: |
          Calcula $\sigma/\varepsilon$ en los primeros puntos. El que está más
          lejos del origen sin haberse doblado todavía es el más fiable.
        desarrollo: |
          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 1380 | 22,6 | 0,00047 | 47,8 |
          | 2780 | 45,5 | 0,00126 | 36,1 |
          | 5630 | 92,1 | 0,00205 | 45,0 |
          | 7430 | 121,6 | 0,00315 | 38,6 |
          | 8140 | 133,2 | 0,00394 | 33,8 |

          Los dos primeros bailan mucho: con la longitud a la centésima, el
          primer alargamiento es 0,03 mm y un error de 0,01 es un 33 %. El de
          5630 N ya es fiable y da $E \approx 45\ \text{GPa}$, que es el
          módulo típico del magnesio. A partir de 7430 N el cociente baja: la
          curva se está doblando.

      - tipo: calcular
        titulo: El límite elástico
        pregunta: |
          Con la paralela al tramo elástico trazada por $\varepsilon = 0{,}002$,
          ¿cuánto vale el límite elástico?
        respuesta:
          tipo: magnitud
          valor: '139 MPa'
          tolerancia: 0.04
          formato: una tensión, con su unidad
        distractores:
          - valor: '89.3 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. El 0,002 es donde
              **empieza** la paralela, en el eje de deformaciones; el límite
              es donde esa paralela corta a la curva, bastante más a la
              derecha.
          - valor: '234.6 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico está donde empieza la deformación plástica, muy
              por debajo.
        pista: |
          La paralela es $\sigma = E\,(\varepsilon - 0{,}002)$. Busca entre qué
          dos puntos de la tabla pasa de estar por debajo de la curva a estar
          por encima.
        desarrollo: |
          Con $E = 45\,000\ \text{MPa}$, la paralela queda por debajo de la
          curva en el punto de 8140 N y por encima en el de 9870 N. Entre los
          dos, la curva es $\sigma = 133{,}2 + 4609\,(\varepsilon - 0{,}00394)$,
          y el corte está en

          $$
          \varepsilon = 0{,}00508
          \qquad
          \sigma_y = 45\,000\cdot(0{,}00508 - 0{,}002) = 138\ \text{MPa}
          $$

          Con $E = 40\ \text{GPa}$ sale 140 MPa: el límite elástico apenas
          depende de cuál de los dos módulos se use.

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '234.6 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '204.5 MPa'
            mensaje: |
              Esa es la tensión del último punto, el de rotura. Tras la
              estricción la carga baja; la resistencia a tracción es la
              tensión **máxima**, la de 14 340 N.
        pista: |
          La carga máxima de la tabla entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{14\,340}{3{,}2\cdot 19{,}1} = \frac{14\,340}{61{,}12}
          = 234{,}6\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento relativo porcentual?
        respuesta:
          tipo: numero
          valor: '11.0'
          # Absoluta: acepta 11,0 (longitud en rotura, la fórmula del curso) y
          # 10,6 (restando la recuperación elástica, que es lo riguroso).
          tolerancia: 0.6
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '9.92'
            mensaje: |
              Has dividido entre la longitud final, 70,49 mm. El alargamiento
              relativo se refiere a la longitud inicial, 63,5 mm.
          - valor: '6.96'
            mensaje: |
              Has usado la longitud de la carga máxima, 67,92 mm. Eso es solo
              el alargamiento uniforme, hasta la estricción; la ductilidad
              cuenta hasta la rotura, en el último punto.
        pista: |
          $\%EL = (l_f - l_0)/l_0\cdot 100$, con $l_f$ la longitud en rotura,
          el último punto.
        desarrollo: |
          $$
          \%EL = \frac{70{,}49 - 63{,}5}{63{,}5}\cdot 100 = 11{,}0\ \%
          $$

          En rigor, al romper la probeta recupera su parte elástica,
          $204{,}5/45\,000 = 0{,}45\ \%$, y el alargamiento permanente sería
          un 10,6 %. Las transparencias usan la longitud en rotura, y la
          casilla acepta los dos.

      - tipo: calcular
        titulo: El lado ancho bajo 8000 N
        pregunta: |
          Con $8000\ \text{N}$, ¿cuánto cambia el lado de $19{,}1\ \text{mm}$?
          Dalo con su signo.
        respuesta:
          tipo: magnitud
          valor: '-0.0161 mm'
          # Relativa amplia por lo mismo que el módulo: con E = 40 GPa sale
          # -0,0181, un 12 % más. Los distractores quedan a más del 200 %.
          tolerancia: 0.13
          formato: un cambio de longitud con su signo y su unidad
        distractores:
          - valor: '0.0161 mm'
            mensaje: |
              El número es bueno y el signo no. En tracción la sección
              **mengua**: los dos lados se acortan, así que el cambio es
              negativo.
          - valor: '-0.0556 mm'
            mensaje: |
              Te has dejado el coeficiente de Poisson: has aplicado la
              deformación axial al lado de la sección. La transversal es
              $\nu$ veces la axial, un 29 %.
          - valor: '-0.192 mm'
            mensaje: |
              Has dividido entre el Poisson en vez de multiplicar.
              $\nu = -\varepsilon_x/\varepsilon_z$, así que
              $\varepsilon_x = -\nu\,\varepsilon_z$, más pequeña que la axial.
        pista: |
          $\sigma = 8000/61{,}12$; compruébala contra el límite elástico,
          $\varepsilon_z = \sigma/E$ y $\varepsilon_x = -\nu\,\varepsilon_z$.
        desarrollo: |
          $$
          \sigma = \frac{8000}{61{,}12} = 130{,}9\ \text{MPa} < 139\ \text{MPa}
          $$

          Está en la zona elástica y vale Hooke:

          $$
          \varepsilon_z = \frac{130{,}9}{45\,000} = 2{,}91\cdot 10^{-3}
          \qquad
          \varepsilon_x = -0{,}29\cdot 2{,}91\cdot 10^{-3} = -8{,}44\cdot 10^{-4}
          $$

          $$
          \Delta b = 19{,}1\cdot(-8{,}44\cdot 10^{-4}) = -0{,}0161\ \text{mm}
          \qquad
          \Delta a = 3{,}2\cdot(-8{,}44\cdot 10^{-4}) = -0{,}0027\ \text{mm}
          $$

          La sección queda en $3{,}197 \times 19{,}084\ \text{mm}$.

      - tipo: justificar
        pregunta: Ordena la lectura de la curva. Una pieza es falsa.
        piezas:
          - texto: >-
              El tramo recto da un módulo de unos 45 GPa; los dos primeros
              puntos, medidos a la centésima de milímetro, dispersan mucho.
          - texto: >-
              La paralela trazada por 0,002 corta la curva a unos 139 MPa: ese
              es el límite elástico.
          - texto: >-
              La carga máxima, 14 340 N, da la resistencia a tracción:
              234,6 MPa.
          - texto: >-
              Con 8000 N la tensión es 130,9 MPa, por debajo del límite
              elástico, así que las nuevas dimensiones salen de Hooke y
              Poisson.
          - texto: >-
              La resistencia a tracción es la tensión del último punto,
              porque es donde rompe la probeta.
            trampa: true
            mensaje: |
              El último punto es la rotura, a 204,5 MPa. Tras la estricción
              la carga baja, así que la tensión nominal en rotura es menor que
              la máxima. La resistencia a tracción es el máximo de la curva.
    resolucion: |
      **La curva.** Sección $A_0 = 3{,}2\cdot 19{,}1 = 61{,}12\ \text{mm}^{2}$
      y $l_0 = 63{,}5\ \text{mm}$:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 1380 | 22,6 | 0,00047 |
      | 2780 | 45,5 | 0,00126 |
      | 5630 | 92,1 | 0,00205 |
      | 7430 | 121,6 | 0,00315 |
      | 8140 | 133,2 | 0,00394 |
      | 9870 | 161,5 | 0,0101 |
      | 12850 | 210,2 | 0,0301 |
      | 14100 | 230,7 | 0,0501 |
      | 14340 | 234,6 | 0,0696 |
      | 13830 | 226,3 | 0,0901 |
      | 12500 | 204,5 | 0,1101 |

      **a) Módulo.** Del tramo recto, $E \approx 45\ \text{GPa}$. Los datos
      no dan más precisión: una regresión con los cuatro primeros puntos sale
      40 GPa, y el primer punto solo, 48.

      **b) Límite elástico.** La paralela $\sigma = 45\,000(\varepsilon -
      0{,}002)$ corta la curva entre 8140 y 9870 N:
      $\sigma_y \approx 139\ \text{MPa}$.

      **c) Resistencia a tracción.**
      $R_m = 14\,340/61{,}12 = 234{,}6\ \text{MPa}$.

      **d) Alargamiento.** $\%EL = (70{,}49 - 63{,}5)/63{,}5 = 11{,}0\ \%$;
      descontando la recuperación elástica en la rotura, 10,6 %.

      **e) La sección con 8000 N.** $\sigma = 130{,}9\ \text{MPa}$, en zona
      elástica, con una deformación transversal de

      $$
      \varepsilon_x = -0{,}29\cdot\frac{130{,}9}{45\,000} = -8{,}44\cdot 10^{-4}
      $$

      y la sección pasa a $3{,}197 \times 19{,}084\ \text{mm}$.

      **Lo que hay que llevarse.** Unos datos reales no dan un módulo de
      cuatro cifras. Cuando las longitudes se miden a la centésima, los
      primeros puntos son los menos fiables; se usa el más alejado que siga
      en la recta, y conviene decir con qué punto se ha hecho.
  - id: ejcm2-col228-la-probeta-de-cobre-entera
    titulo: La probeta de cobre, del primer punto a la rotura
    fuente: >-
      Ejercicio 2.28 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      En la siguiente tabla se presentan los datos obtenidos al ensayar una
      probeta estándar de cobre de $1{,}3\ \text{cm}$ de diámetro:

      | Carga (N) | Longitud (cm) | Carga (N) | Longitud (cm) |
      |---|---|---|---|
      | 0 | 5,08 | 46700 | 5,1816 |
      | 13350 | 5,0842 | 53400 | 5,7404 |
      | 26700 | 5,0884 | 55150 | 6,35 (carga max.) |
      | 33360 | 5,0905 | 50700 | 7,67 (rotura) |
      | 40000 | 5,1028 | | |

      La longitud final de la probeta es $7{,}65\ \text{cm}$ y su diámetro
      $0{,}95\ \text{cm}$. Dibuja la curva tensión-deformación
      ($\sigma$-$\varepsilon$) y calcula el límite elástico a $0{,}2\ \%$ de
      deformación, la resistencia a tracción, el módulo elástico, el
      alargamiento relativo (%), la reducción de área (%), la tensión nominal y
      real en el punto de fractura.
    pide: El límite elástico, la resistencia a tracción, el módulo, el alargamiento, la reducción de área y las tensiones nominal y real en la fractura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al final hay dos longitudes: 7,67 cm en la rotura y 7,65 cm de
          longitud final. ¿Cuál va en el alargamiento relativo?
        opciones:
          - texto: >-
              7,65 cm, la de la probeta rota y recompuesta, sin la parte
              elástica
            correcta: true
            mensaje: |
              Eso es. Al romper, la carga desaparece y la probeta recupera su
              deformación elástica. El alargamiento relativo mide lo que
              queda: la deformación permanente.
          - texto: >-
              7,67 cm, la del instante de la rotura
            mensaje: |
              Esa longitud es con la carga todavía puesta, e incluye la parte
              elástica que se recupera al romper. Aquí son dos décimas de
              milímetro, pero el enunciado da la final a propósito.
          - texto: >-
              6,35 cm, la de la carga máxima
            mensaje: |
              Esa es la deformación uniforme, hasta que empieza la estricción.
              La ductilidad cuenta la deformación hasta la rotura.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico?
        respuesta:
          tipo: magnitud
          valor: '121700 MPa'
          tolerancia: 0.02
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '67150 MPa'
            mensaje: |
              Has usado el punto de 40 000 N, que ya se ha salido de la recta.
              Los tres primeros dan el mismo cociente, 121,6 GPa; el cuarto
              da la mitad, y eso es la señal de que ha empezado a plastificar.
          - valor: '749 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. El módulo es la
              pendiente del tramo recto del principio, no de la curva entera.
        pista: |
          $\sigma = F/A_0$ con $A_0 = \pi\cdot 6{,}5^{2}\ \text{mm}^{2}$, y
          $\varepsilon = (l-l_0)/l_0$. Mira en qué puntos $\sigma/\varepsilon$
          se mantiene.
        desarrollo: |
          $A_0 = \pi\cdot 6{,}5^{2} = 132{,}7\ \text{mm}^{2}$ y
          $l_0 = 5{,}08\ \text{cm}$:

          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 13350 | 100,6 | 0,000827 | 121,7 |
          | 26700 | 201,2 | 0,001654 | 121,7 |
          | 33360 | 251,3 | 0,002067 | 121,6 |
          | 40000 | 301,4 | 0,004488 | 67,1 |

          Los tres primeros están en la recta: $E = 121{,}7\ \text{GPa}$.

      - tipo: calcular
        titulo: El límite elástico al 0,2 %
        pregunta: |
          ¿Cuánto vale el límite elástico con el criterio del 0,2 %?
        respuesta:
          tipo: magnitud
          valor: '301 MPa'
          tolerancia: 0.03
          formato: una tensión, con su unidad
        distractores:
          - valor: '243 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. Ahí es donde
              **empieza** la paralela; el límite es donde la paralela corta a
              la curva.
          - valor: '415.5 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico marca el principio de la deformación plástica.
        pista: |
          La paralela es $\sigma = 121\,700\,(\varepsilon - 0{,}002)$.
          Compárala con la curva en el punto de 33 360 N y en el de 40 000 N.
        desarrollo: |
          En el punto de 33 360 N la paralela vale $121\,700\cdot 0{,}000067 =
          8\ \text{MPa}$, muy por debajo de la curva. En el de 40 000 N vale
          $121\,700\cdot 0{,}002488 = 302{,}8\ \text{MPa}$, justo por encima
          de los 301,4 de la curva. El corte está casi encima de ese punto:

          $$
          \sigma_y \approx 301\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '415.5 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '382 MPa'
            mensaje: |
              Esa es la tensión en la rotura. Después de la carga máxima la
              carga baja; la resistencia a tracción es el máximo, 55 150 N.
          - valor: '1662 MPa'
            mensaje: |
              Has calculado la sección con el radio y además dividido entre
              cuatro. O $\pi r^{2}$ o $\pi d^{2}/4$: la sección es 132,7 mm².
        pista: |
          La carga máxima entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{55\,150}{132{,}7} = 415{,}5\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El alargamiento relativo
        pregunta: |
          ¿Cuánto vale el alargamiento relativo, en porcentaje?
        respuesta:
          tipo: numero
          valor: '50.6'
          tolerancia: 0.25
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '51.0'
            mensaje: |
              Has usado la longitud en la rotura, 7,67 cm, con la carga
              puesta. La longitud final es 7,65: la de la probeta rota, cuando
              ya ha recuperado su parte elástica.
          - valor: '25.0'
            mensaje: |
              Has usado la longitud de la carga máxima, 6,35 cm. Eso es el
              alargamiento uniforme; la ductilidad se mide en la rotura.
          - valor: '33.6'
            mensaje: |
              Has dividido entre la longitud final. El alargamiento relativo
              se refiere a la inicial, 5,08 cm.
        pista: |
          $\%EL = (l_f - l_0)/l_0\cdot 100$ con $l_f = 7{,}65\ \text{cm}$.
        desarrollo: |
          $$
          \%EL = \frac{7{,}65 - 5{,}08}{5{,}08}\cdot 100 = 50{,}6\ \%
          $$

      - tipo: calcular
        titulo: La reducción de área
        pregunta: |
          ¿Cuánto vale la reducción de área, en porcentaje?
        respuesta:
          tipo: numero
          valor: '46.6'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '26.9'
            mensaje: |
              Has usado los diámetros sin elevarlos al cuadrado. El área va
              con $d^{2}$: $(0{,}95/1{,}3)^{2} = 0{,}534$.
          - valor: '87.3'
            mensaje: |
              Has dividido entre el área final. La reducción de área se
              refiere a la sección inicial, y por eso nunca pasa del 100 %.
        pista: |
          $\%AR = \left(1 - (d_f/d_0)^{2}\right)\cdot 100$.
        desarrollo: |
          $$
          \%AR = \left(1 - \left(\frac{0{,}95}{1{,}3}\right)^{2}\right)\cdot 100
          = 46{,}6\ \%
          $$

      - tipo: calcular
        titulo: La tensión real en la fractura
        pregunta: |
          ¿Cuánto vale la tensión **real** en el punto de fractura?
        respuesta:
          tipo: magnitud
          valor: '715 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '382 MPa'
            mensaje: |
              Esa es la nominal, que también se pide: la carga de rotura
              entre la sección inicial. La real divide entre la sección del
              cuello, 70,9 mm².
          - valor: '577 MPa'
            mensaje: |
              Has usado $\sigma_T = \sigma(1+\varepsilon)$. Esa relación
              supone que la probeta se estira por igual en toda su longitud, y
              deja de valer con la estricción. En la fractura hay que ir al
              área.
          - valor: '204 MPa'
            mensaje: |
              Has invertido el cociente de áreas. La sección del cuello es
              menor, así que la tensión real sale **mayor** que la nominal.
        pista: |
          $\sigma_T = F_{\text{rotura}}/A_f$ con $A_f = \pi\cdot 4{,}75^{2}$.
        desarrollo: |
          $$
          \sigma_{\text{nominal}} = \frac{50\,700}{132{,}7} = 382\ \text{MPa}
          $$

          $$
          A_f = \pi\cdot 4{,}75^{2} = 70{,}9\ \text{mm}^{2}
          \qquad
          \sigma_T = \frac{50\,700}{70{,}9} = 715\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del ensayo. Una pieza es falsa.
        piezas:
          - texto: >-
              Hasta 33 360 N tensión y deformación son proporcionales: el
              módulo es 121,7 GPa.
          - texto: >-
              La paralela por 0,002 corta la curva junto al punto de
              40 000 N: el límite elástico es de unos 301 MPa.
          - texto: >-
              El máximo, 55 150 N, da la resistencia a tracción: 415,5 MPa.
          - texto: >-
              En la fractura la nominal baja a 382 MPa y la real sube a
              715 MPa, porque la sección del cuello es un 47 % menor.
          - texto: >-
              La tensión real en la fractura sale de $\sigma(1+\varepsilon)$,
              con la deformación en la rotura.
            trampa: true
            mensaje: |
              Esa relación supone deformación uniforme y se rompe con la
              estricción: da 577 MPa, un 19 % por debajo. Tras el máximo, la
              tensión real se calcula con el área, que es el dato que el
              enunciado da para eso.
    resolucion: |
      **La curva.** $A_0 = \pi\cdot 6{,}5^{2} = 132{,}7\ \text{mm}^{2}$ y
      $l_0 = 50{,}8\ \text{mm}$:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 13350 | 100,6 | 0,00083 |
      | 26700 | 201,2 | 0,00165 |
      | 33360 | 251,3 | 0,00207 |
      | 40000 | 301,4 | 0,00449 |
      | 46700 | 351,8 | 0,0200 |
      | 53400 | 402,3 | 0,130 |
      | 55150 | 415,5 | 0,250 |
      | 50700 | 382,0 | 0,510 |

      **Módulo elástico.** Los tres primeros puntos dan el mismo cociente:
      $E = 121{,}7\ \text{GPa}$.

      **Límite elástico al 0,2 %.** La paralela corta la curva casi en el
      punto de 40 000 N: $\sigma_y \approx 301\ \text{MPa}$.

      **Resistencia a tracción.** $55\,150/132{,}7 = 415{,}5\ \text{MPa}$.

      **Alargamiento relativo.** Con la longitud final, no con la de rotura:
      $(7{,}65 - 5{,}08)/5{,}08 = 50{,}6\ \%$.

      **Reducción de área.** $1 - (0{,}95/1{,}3)^{2} = 46{,}6\ \%$.

      **Tensiones en la fractura.** Nominal, $50\,700/132{,}7 = 382\ \text{MPa}$;
      real, $50\,700/70{,}9 = 715\ \text{MPa}$.

      **Lo que hay que llevarse.** Las dos longitudes finales del enunciado no
      son redundantes: 7,67 cm es con carga y 7,65 sin ella, y su diferencia,
      0,02 cm, es la recuperación elástica en la rotura. Y la tensión real
      casi dobla a la nominal, que es lo que la estricción esconde.
  - id: ejcm2-col229-el-aluminio-que-parece-acero
    titulo: El aluminio cuyos datos parecen de acero
    fuente: >-
      Ejercicio 2.29 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de aluminio de $12{,}8\ \text{mm}$ de diámetro y
      $50{,}80\ \text{mm}$ de longitud se somete a tracción. Los datos
      carga-alargamiento se indican en la siguiente tabla:

      a) Representa la curva $\sigma$-$\varepsilon$.

      b) Calcula el módulo elástico.

      c) Calcula el límite elástico para una deformación de $0{,}002$.

      d) Calcula la resistencia a tracción.

      e) ¿Cuanto vale la ductilidad en forma de alargamiento relativo
      porcentual?

      f) Calcula el módulo de resiliencia.

      | Carga (N) | Longitud (mm) · $10^{3}$ | Carga (N) | Longitud (mm) · $10^{3}$ |
      |---|---|---|---|
      | 12700 | 50825 | 119400 | 51562 |
      | 25400 | 50851 | 128300 | 51816 |
      | 38100 | 50876 | 149700 | 52832 |
      | 50800 | 50902 | 159000 | 53848 |
      | 76200 | 50952 | 160400 | 54356 |
      | 89100 | 51003 | 159500 | 54864 |
      | 92700 | 51054 | 151500 | 55880 |
      | 102500 | 51181 | 124700 | 56642 |
      | 107800 | 51308 | Rotura | |
    pide: El módulo, el límite elástico, la resistencia a tracción, el alargamiento y el módulo de resiliencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          La columna de longitudes está multiplicada por $10^{3}$. ¿Qué
          longitud es el 50825 del primer punto?
        opciones:
          - texto: >-
              50,825 mm: lo escrito es la longitud en milésimas de milímetro
            correcta: true
            mensaje: |
              Eso es. El encabezado dice que el número es la longitud por
              mil, así que hay que dividir entre mil. El alargamiento es
              $50{,}825 - 50{,}80 = 0{,}025\ \text{mm}$.
          - texto: >-
              50 825 mm
            mensaje: |
              Sería una probeta de cincuenta metros. «Longitud (mm) · 10³»
              quiere decir que lo escrito es la longitud multiplicada por mil:
              para recuperarla se divide.
          - texto: >-
              0,025 mm, que es el alargamiento
            mensaje: |
              La columna da la longitud, no el alargamiento. El alargamiento
              es la diferencia con la inicial, que en este punto sí vale
              0,025 mm.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico?
        respuesta:
          tipo: magnitud
          valor: '197600 MPa'
          tolerancia: 0.02
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '70000 MPa'
            mensaje: |
              Ese es el módulo típico de un aluminio, y no sale de estos
              datos. El módulo se lee del ensayo: el cociente
              $\sigma/\varepsilon$ del tramo recto da casi 200 GPa.
          - valor: '8427 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. El módulo es la
              pendiente del tramo recto del principio, no de la curva entera.
        pista: |
          $A_0 = \pi\cdot 6{,}4^{2}$; calcula $\sigma/\varepsilon$ en los
          primeros puntos y mira hasta dónde se mantiene.
        desarrollo: |
          $A_0 = \pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$ y
          $l_0 = 50{,}80\ \text{mm}$:

          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 12700 | 98,7 | 0,00049 | 200,6 |
          | 25400 | 197,4 | 0,00100 | 196,6 |
          | 38100 | 296,1 | 0,00150 | 197,9 |
          | 50800 | 394,8 | 0,00201 | 196,6 |
          | 76200 | 592,2 | 0,00299 | 197,9 |
          | 89100 | 692,4 | 0,00400 | 173,3 |

          Recto hasta 76 200 N. La regresión de esos cinco puntos da
          $E = 197{,}6\ \text{GPa}$.

      - tipo: calcular
        titulo: El límite elástico
        pregunta: |
          Con la paralela por $\varepsilon = 0{,}002$, ¿cuánto vale el límite
          elástico?
        respuesta:
          tipo: magnitud
          valor: '744 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '393 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. Ahí empieza la
              paralela; el límite es donde la paralela corta a la curva.
          - valor: '1246.5 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico marca dónde empieza la deformación plástica.
        pista: |
          La paralela es $\sigma = 197\,600\,(\varepsilon - 0{,}002)$. Corta la
          curva entre los puntos de 92 700 y 102 500 N.
        desarrollo: |
          En el punto de 92 700 N ($\varepsilon = 0{,}0050$) la paralela vale
          594 MPa, por debajo de los 720 de la curva; en el de 102 500 N
          ($\varepsilon = 0{,}0075$) vale 1087, por encima de 797. Entre los
          dos, la curva es $\sigma = 720{,}4 + 30\,464\,(\varepsilon - 0{,}005)$,
          y el corte:

          $$
          \varepsilon = 0{,}00576
          \qquad
          \sigma_y = 197\,600\cdot(0{,}00576 - 0{,}002) = 744\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '1246.5 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '969 MPa'
            mensaje: |
              Esa es la tensión del último punto, antes de la rotura. La
              resistencia a tracción es la tensión máxima, la de 160 400 N.
          - valor: '311.6 MPa'
            mensaje: |
              Has usado los 12,8 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$.
        pista: |
          La carga máxima de la tabla entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{160\,400}{128{,}7} = 1246{,}5\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La ductilidad
        pregunta: |
          ¿Cuánto vale el alargamiento relativo porcentual?
        respuesta:
          tipo: numero
          valor: '11.5'
          # Absoluta: acepta 11,5 (longitud del último punto, la fórmula del
          # curso) y 11,0 (restando la recuperación elástica).
          tolerancia: 0.6
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '10.3'
            mensaje: |
              Has dividido entre la longitud final, 56,642 mm. El
              alargamiento relativo se refiere a la inicial, 50,80 mm.
          - valor: '111.5'
            mensaje: |
              Has calculado $l_f/l_0$ por cien sin restar. Eso dice que la
              probeta mide el 111,5 % de lo que medía; lo que se ha alargado
              es el 11,5 %.
        pista: |
          El último punto medido, 56 642, es la longitud justo antes de la
          rotura. $\%EL = (l_f - l_0)/l_0\cdot 100$.
        desarrollo: |
          $$
          \%EL = \frac{56{,}642 - 50{,}80}{50{,}80}\cdot 100 = 11{,}5\ \%
          $$

          Descontando la recuperación elástica en la rotura,
          $969/197\,600 = 0{,}49\ \%$, quedaría un 11,0 %. La casilla acepta
          los dos.

      - tipo: calcular
        titulo: El módulo de resiliencia
        pregunta: |
          ¿Cuánto vale el módulo de resiliencia?
        respuesta:
          tipo: magnitud
          valor: '1.40 MPa'
          # Arrastra el ±2 % del límite elástico al cuadrado: con E entre 195 y
          # 200 GPa sale de 1,38 a 1,42.
          tolerancia: 0.05
          formato: una energía por unidad de volumen, en MPa y con la unidad
        distractores:
          - valor: '2.80 MPa'
            mensaje: |
              Te has dejado el ½. El área bajo el tramo elástico es un
              triángulo: $U_r = \sigma_y^{2}/2E$.
          - valor: '3.93 MPa'
            mensaje: |
              Has usado la resistencia a tracción. La resiliencia llega solo
              hasta el límite elástico: es la energía que se devuelve al
              descargar, y más allá hay deformación permanente.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$, con las dos en MPa.
        desarrollo: |
          $$
          U_r = \frac{744^{2}}{2\cdot 197\,600} = 1{,}40\ \text{MPa}
          = 1{,}40\ \text{MJ/m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del ensayo. Una pieza es falsa.
        piezas:
          - texto: >-
              Hasta 76 200 N el cociente entre tensión y deformación se
              mantiene en unos 198 GPa: ese es el tramo elástico.
          - texto: >-
              La paralela por 0,002 corta la curva entre 92 700 y 102 500 N,
              a unos 744 MPa.
          - texto: >-
              La carga máxima, 160 400 N, da 1246,5 MPa, y la probeta rompe
              tras alargarse un 11,5 %.
          - texto: >-
              Con el límite elástico y el módulo, la resiliencia es
              $\sigma_y^{2}/2E = 1{,}40\ \text{MPa}$.
          - texto: >-
              El módulo elástico vale 70 GPa, porque la probeta es de
              aluminio.
            trampa: true
            mensaje: |
              El módulo se lee del ensayo, no del nombre del material. Estos
              datos dan 198 GPa, y ese número es el que manda: es justo lo que
              el apartado b) pide calcular.
    resolucion: |
      **La curva.** Longitudes entre mil, $l_0 = 50{,}80\ \text{mm}$ y
      $A_0 = \pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$. Algunos puntos:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 76200 | 592,2 | 0,0030 |
      | 92700 | 720,4 | 0,0050 |
      | 102500 | 796,6 | 0,0075 |
      | 128300 | 997,1 | 0,020 |
      | 160400 | 1246,5 | 0,070 |
      | 124700 | 969,1 | 0,115 |

      **b) Módulo.** Recto hasta 76 200 N: $E = 197{,}6\ \text{GPa}$.

      **c) Límite elástico.** La paralela por 0,002 corta la curva a
      $\sigma_y = 744\ \text{MPa}$.

      **d) Resistencia a tracción.** $160\,400/128{,}7 = 1246{,}5\ \text{MPa}$.

      **e) Ductilidad.** $(56{,}642 - 50{,}80)/50{,}80 = 11{,}5\ \%$, tomando
      el último punto medido como la rotura.

      **f) Resiliencia.** $744^{2}/(2\cdot 197\,600) = 1{,}40\ \text{MPa}$.

      > **Estos datos no son de un aluminio.** Una aleación de aluminio tiene
      > unos 70 GPa de módulo y una resistencia de unos cientos de MPa. Aquí
      > salen 198 GPa y 1250 MPa, que son las cifras de un acero de alta
      > resistencia: parecen los datos de un ensayo de acero con el nombre del
      > material cambiado. El ejercicio pide calcular con la tabla, y así se
      > ha hecho; el aviso es para que el número no te haga dudar de tu cuenta.

      **Lo que hay que llevarse.** Las propiedades se leen del ensayo, no del
      nombre de la probeta. Si el módulo que sale no se parece al de las
      tablas, primero se revisan las unidades —aquí, el $10^{3}$ del
      encabezado—, y si están bien, manda el dato.
  - id: ejcm2-col230-la-huella-de-la-bola-brinell
    titulo: La huella de la bola Brinell, y al revés
    fuente: >-
      Ejercicio 2.30 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un penetrador Brinnel de $10\ \text{mm}$ de diámetro crea una huella de
      $2{,}5\ \text{mm}$ sobre un acero al aplicarle una carga de
      $1000\ \text{kg}$. Calcula la dureza Brinell de dicho acero. ¿Cuál será
      el diámetro de la huella si al aplicarle una carga de $500\ \text{kg}$
      presenta una dureza Brinell de $300$?

      $$
      HB = \frac{2P}{\pi D\left(D - \sqrt{D^{2} - d^{2}}\right)}
      $$

      - $P$: carga aplicada (kg)
      - $D$: diámetro de la punta (mm)
      - $d$: diámetro de la huella (mm)
      - $h$: altura de la huella (mm)
    pide: La dureza Brinell del acero y el diámetro de la segunda huella.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la misma bola y la misma carga, ¿qué indica una huella más
          grande?
        opciones:
          - texto: >-
              Un material más blando: la carga se reparte sobre más superficie
              y HB baja
            correcta: true
            mensaje: |
              Eso es. HB es la carga dividida entre la superficie del casquete
              que deja la bola. Más huella con la misma carga es menos
              resistencia a ser penetrado.
          - texto: >-
              Un material más duro, porque ha aguantado una huella mayor
            mensaje: |
              Al revés. Un material duro se deja penetrar poco: la bola apenas
              entra y la huella es pequeña.
          - texto: >-
              Nada: la dureza depende solo de la carga aplicada
            mensaje: |
              La carga es la misma en los dos casos; lo que cambia es la
              huella, y la dureza sale precisamente de compararlas: carga
              entre superficie.

      - tipo: calcular
        titulo: La dureza del acero
        pregunta: |
          ¿Cuánto vale la dureza Brinell del acero con la huella de
          $2{,}5\ \text{mm}$?
        respuesta:
          tipo: numero
          valor: '200.5'
          tolerancia: 1
          formato: un número, sin unidades
        distractores:
          - valor: '100.2'
            mensaje: |
              Te has dejado el 2 del numerador. La fórmula del tema es
              $2P$ entre $\pi D(D - \sqrt{D^{2}-d^{2}})$.
          - valor: '629.8'
            mensaje: |
              Te has dejado el $\pi$ del denominador. Sin él la superficie de
              la huella sale tres veces menor y la dureza tres veces mayor.
        pista: |
          Empieza por la raíz: $\sqrt{10^{2} - 2{,}5^{2}} = \sqrt{93{,}75}$.
        desarrollo: |
          $$
          \sqrt{100 - 6{,}25} = 9{,}6825
          \qquad
          D - \sqrt{D^{2}-d^{2}} = 0{,}3175
          $$

          $$
          HB = \frac{2\cdot 1000}{\pi\cdot 10\cdot 0{,}3175} = 200{,}5
          $$

      - tipo: calcular
        titulo: La segunda huella
        pregunta: |
          Con $500\ \text{kg}$ y una dureza de $300$, ¿qué diámetro tiene la
          huella?
        respuesta:
          tipo: magnitud
          valor: '1.453 mm'
          tolerancia: 0.02
          formato: un diámetro, con su unidad
        distractores:
          - valor: '2.11 mm'
            mensaje: |
              Te has quedado en $d^{2} = 2{,}11$. Falta la raíz: la huella
              mide $\sqrt{2{,}11} = 1{,}45\ \text{mm}$.
          - valor: '1.03 mm'
            mensaje: |
              Te has dejado el 2 de $2P$ al despejar. El paréntesis vale
              $2P/(\pi D\,HB) = 0{,}1061$, no la mitad.
          - valor: '0.835 mm'
            mensaje: |
              Has escalado la primera huella en proporción a la carga y a la
              dureza. La relación no es lineal: la superficie del casquete
              crece aproximadamente con $d^{2}$, no con $d$.
        pista: |
          Despeja por capas: primero $D - \sqrt{D^{2}-d^{2}} = 2P/(\pi D\,HB)$,
          luego la raíz y al final $d$.
        desarrollo: |
          $$
          D - \sqrt{D^{2}-d^{2}} = \frac{2\cdot 500}{\pi\cdot 10\cdot 300}
          = 0{,}1061
          $$

          $$
          \sqrt{100 - d^{2}} = 9{,}8939
          \qquad
          100 - d^{2} = 97{,}889
          \qquad
          d = \sqrt{2{,}111} = 1{,}45\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena lo que dice cada cifra. Una pieza es falsa.
        piezas:
          - texto: >-
              HB es la carga entre la superficie del casquete que deja la
              bola, y por eso una huella mayor da menos dureza.
          - texto: >-
              Con 1000 kg y una huella de 2,5 mm, el acero tiene HB = 200,5.
          - texto: >-
              Para que 500 kg den HB = 300, el casquete tiene que medir
              500/300 = 1,67 mm², y eso es una huella de 1,45 mm.
          - texto: >-
              Si fuera el mismo acero de antes, con la mitad de carga la
              dureza saldría la mitad, unos 100.
            trampa: true
            mensaje: |
              La dureza es una propiedad del material, no de la carga. Con la
              mitad de carga el mismo acero dejaría una huella más pequeña y
              la dureza seguiría rondando 200. Que salga 300 dice que el
              segundo material es más duro.
    resolucion: |
      **La dureza del acero.**

      $$
      HB = \frac{2\cdot 1000}{\pi\cdot 10\left(10 - \sqrt{100 - 6{,}25}\right)}
      = \frac{2000}{\pi\cdot 10\cdot 0{,}3175} = 200{,}5
      $$

      **La segunda huella.** Se despeja por capas:

      $$
      10 - \sqrt{100 - d^{2}} = \frac{2\cdot 500}{\pi\cdot 10\cdot 300} = 0{,}1061
      $$

      $$
      d^{2} = 100 - 9{,}8939^{2} = 2{,}111
      \qquad
      d = 1{,}45\ \text{mm}
      $$

      Son los dos valores del listado.

      **Lo que hay que llevarse.** La fórmula es carga entre superficie de la
      huella, escrita con los dos diámetros. Al despejar $d$ conviene ir por
      capas —paréntesis, raíz, cuadrado— porque es donde se pierden el 2 y la
      raíz. Y la dureza no cambia con la carga: si cambia, es que ha cambiado
      el material.
