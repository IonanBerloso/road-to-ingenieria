          </svg>
        veredicto: >-
          Si tu curva tiene la raya casi vertical del principio, el codo hacia
          300 MPa, el máximo en 0,25 y la bajada hasta 0,51, y al lado el
          detalle con la paralela, tienes el dibujo que se pide, y de él salen
          tres respuestas: el módulo, el límite elástico y la resistencia a
          tracción.

      - tipo: justificar
        pregunta: Ordena la lectura del ensayo. Una pieza es falsa.
        piezas:
          - texto: >-
              Hasta 33 360 N tensión y deformación son proporcionales: el
              módulo es 121,7 GPa.
          - texto: >-
              La paralela por 0,002 corta la curva junto al punto de
              40 000 N: el límite elástico es de unos 301 MPa.
          - texto: >-
              El máximo, 55 150 N, da la resistencia a tracción: 415,5 MPa.
          - texto: >-
              En la fractura la nominal baja a 382 MPa y la real sube a
              715 MPa, porque la sección del cuello es un 47 % menor.
          - texto: >-
              La tensión real en la fractura sale de $\sigma(1+\varepsilon)$,
              con la deformación en la rotura.
            trampa: true
            mensaje: |
              Esa relación supone deformación uniforme y se rompe con la
              estricción: da 577 MPa, un 19 % por debajo. Tras el máximo, la
              tensión real se calcula con el área, que es el dato que el
              enunciado da para eso.
    resolucion: |
      **La curva.** $A_0 = \pi\cdot 6{,}5^{2} = 132{,}7\ \text{mm}^{2}$ y
      $l_0 = 50{,}8\ \text{mm}$:

      | carga (N) | $\sigma$ (MPa) | $\varepsilon$ |
      |---|---|---|
      | 13350 | 100,6 | 0,00083 |
      | 26700 | 201,2 | 0,00165 |
      | 33360 | 251,3 | 0,00207 |
      | 40000 | 301,4 | 0,00449 |
      | 46700 | 351,8 | 0,0200 |
      | 53400 | 402,3 | 0,130 |
      | 55150 | 415,5 | 0,250 |
      | 50700 | 382,0 | 0,510 |

      **Módulo elástico.** Los tres primeros puntos dan el mismo cociente:
      $E = 121{,}7\ \text{GPa}$.

      **Límite elástico al 0,2 %.** La paralela corta la curva casi en el
      punto de 40 000 N: $\sigma_y \approx 301\ \text{MPa}$.

      **Resistencia a tracción.** $55\,150/132{,}7 = 415{,}5\ \text{MPa}$.

      **Alargamiento relativo.** Con la longitud final, no con la de rotura:
      $(7{,}65 - 5{,}08)/5{,}08 = 50{,}6\ \%$.

      **Reducción de área.** $1 - (0{,}95/1{,}3)^{2} = 46{,}6\ \%$.

      **Tensiones en la fractura.** Nominal, $50\,700/132{,}7 = 382\ \text{MPa}$;
      real, $50\,700/70{,}9 = 715\ \text{MPa}$.

      **Lo que hay que llevarse.** Las dos longitudes finales del enunciado no
      son redundantes: 7,67 cm es con carga y 7,65 sin ella, y su diferencia,
      0,02 cm, es la recuperación elástica en la rotura. Y la tensión real
      casi dobla a la nominal, que es lo que la estricción esconde.
  - id: ejcm2-col229-el-aluminio-que-parece-acero
    titulo: El aluminio cuyos datos parecen de acero
    fuente: >-
      Ejercicio 2.29 · Tema 2, «Propiedades mecánicas. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado no publica el resultado;
      los valores son nuestros, calculados con los datos de la tabla.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de aluminio de $12{,}8\ \text{mm}$ de diámetro y
      $50{,}80\ \text{mm}$ de longitud se somete a tracción. Los datos
      carga-alargamiento se indican en la siguiente tabla:

      a) Representa la curva $\sigma$-$\varepsilon$.

      b) Calcula el módulo elástico.

      c) Calcula el límite elástico para una deformación de $0{,}002$.

      d) Calcula la resistencia a tracción.

      e) ¿Cuanto vale la ductilidad en forma de alargamiento relativo
      porcentual?

      f) Calcula el módulo de resiliencia.

      | Carga (N) | Longitud (mm) · $10^{3}$ | Carga (N) | Longitud (mm) · $10^{3}$ |
      |---|---|---|---|
      | 12700 | 50825 | 119400 | 51562 |
      | 25400 | 50851 | 128300 | 51816 |
      | 38100 | 50876 | 149700 | 52832 |
      | 50800 | 50902 | 159000 | 53848 |
      | 76200 | 50952 | 160400 | 54356 |
      | 89100 | 51003 | 159500 | 54864 |
      | 92700 | 51054 | 151500 | 55880 |
      | 102500 | 51181 | 124700 | 56642 |
      | 107800 | 51308 | Rotura | |
    pide: El módulo, el límite elástico, la resistencia a tracción, el alargamiento y el módulo de resiliencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          La columna de longitudes está multiplicada por $10^{3}$. ¿Qué
          longitud es el 50825 del primer punto?
        opciones:
          - texto: >-
              50,825 mm: lo escrito es la longitud en milésimas de milímetro
            correcta: true
            mensaje: |
              Eso es. El encabezado dice que el número es la longitud por
              mil, así que hay que dividir entre mil. El alargamiento es
              $50{,}825 - 50{,}80 = 0{,}025\ \text{mm}$.
          - texto: >-
              50 825 mm
            mensaje: |
              Sería una probeta de cincuenta metros. «Longitud (mm) · 10³»
              quiere decir que lo escrito es la longitud multiplicada por mil:
              para recuperarla se divide.
          - texto: >-
              0,025 mm, que es el alargamiento
            mensaje: |
              La columna da la longitud, no el alargamiento. El alargamiento
              es la diferencia con la inicial, que en este punto sí vale
              0,025 mm.

      - tipo: calcular
        titulo: El módulo elástico
        pregunta: |
          ¿Cuánto vale el módulo elástico?
        respuesta:
          tipo: magnitud
          valor: '197600 MPa'
          tolerancia: 0.02
          formato: un módulo, en MPa y con la unidad
        distractores:
          - valor: '70000 MPa'
            mensaje: |
              Ese es el módulo típico de un aluminio, y no sale de estos
              datos. El módulo se lee del ensayo: el cociente
              $\sigma/\varepsilon$ del tramo recto da casi 200 GPa.
          - valor: '8427 MPa'
            mensaje: |
              Has unido el origen con el punto de rotura. El módulo es la
              pendiente del tramo recto del principio, no de la curva entera.
        pista: |
          $A_0 = \pi\cdot 6{,}4^{2}$; calcula $\sigma/\varepsilon$ en los
          primeros puntos y mira hasta dónde se mantiene.
        desarrollo: |
          $A_0 = \pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$ y
          $l_0 = 50{,}80\ \text{mm}$:

          | carga (N) | $\sigma$ (MPa) | $\varepsilon$ | $\sigma/\varepsilon$ (GPa) |
          |---|---|---|---|
          | 12700 | 98,7 | 0,00049 | 200,6 |
          | 25400 | 197,4 | 0,00100 | 196,6 |
          | 38100 | 296,1 | 0,00150 | 197,9 |
          | 50800 | 394,8 | 0,00201 | 196,6 |
          | 76200 | 592,2 | 0,00299 | 197,9 |
          | 89100 | 692,4 | 0,00400 | 173,3 |

          Recto hasta 76 200 N. La regresión de esos cinco puntos da
          $E = 197{,}6\ \text{GPa}$.

      - tipo: calcular
        titulo: El límite elástico
        pregunta: |
          Con la paralela por $\varepsilon = 0{,}002$, ¿cuánto vale el límite
          elástico?
        respuesta:
          tipo: magnitud
          valor: '744 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '393 MPa'
            mensaje: |
              Has leído la curva en $\varepsilon = 0{,}002$. Ahí empieza la
              paralela; el límite es donde la paralela corta a la curva.
          - valor: '1246.5 MPa'
            mensaje: |
              Esa es la resistencia a tracción, el máximo de la curva. El
              límite elástico marca dónde empieza la deformación plástica.
        pista: |
          La paralela es $\sigma = 197\,600\,(\varepsilon - 0{,}002)$. Corta la
          curva entre los puntos de 92 700 y 102 500 N.
        desarrollo: |
          En el punto de 92 700 N ($\varepsilon = 0{,}0050$) la paralela vale
          594 MPa, por debajo de los 720 de la curva; en el de 102 500 N
          ($\varepsilon = 0{,}0075$) vale 1087, por encima de 797. Entre los
          dos, la curva es $\sigma = 720{,}4 + 30\,464\,(\varepsilon - 0{,}005)$,
          y el corte:

          $$
          \varepsilon = 0{,}00576
          \qquad
          \sigma_y = 197\,600\cdot(0{,}00576 - 0{,}002) = 744\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La resistencia a tracción
        pregunta: |
          ¿Cuánto vale la resistencia a tracción?
        respuesta:
          tipo: magnitud
          valor: '1246.5 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '969 MPa'
            mensaje: |
              Esa es la tensión del último punto, antes de la rotura. La
              resistencia a tracción es la tensión máxima, la de 160 400 N.
          - valor: '311.6 MPa'
            mensaje: |
              Has usado los 12,8 mm como radio. Son el diámetro: la sección es
              $\pi\cdot 6{,}4^{2} = 128{,}7\ \text{mm}^{2}$.
        pista: |
          La carga máxima de la tabla entre la sección inicial.
        desarrollo: |
          $$
          R_m = \frac{160\,400}{128{,}7} = 1246{,}5\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La ductilidad
        pregunta: |
          ¿Cuánto vale el alargamiento relativo porcentual?
        respuesta:
          tipo: numero
          valor: '11.5'
          # Absoluta: acepta 11,5 (longitud del último punto, la fórmula del
          # curso) y 11,0 (restando la recuperación elástica).
          tolerancia: 0.6
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '10.3'
            mensaje: |
              Has dividido entre la longitud final, 56,642 mm. El
              alargamiento relativo se refiere a la inicial, 50,80 mm.
          - valor: '111.5'
            mensaje: |
              Has calculado $l_f/l_0$ por cien sin restar. Eso dice que la
              probeta mide el 111,5 % de lo que medía; lo que se ha alargado
              es el 11,5 %.
        pista: |
          El último punto medido, 56 642, es la longitud justo antes de la
          rotura. $\%EL = (l_f - l_0)/l_0\cdot 100$.
        desarrollo: |
          $$
          \%EL = \frac{56{,}642 - 50{,}80}{50{,}80}\cdot 100 = 11{,}5\ \%
          $$

          Descontando la recuperación elástica en la rotura,
          $969/197\,600 = 0{,}49\ \%$, quedaría un 11,0 %. La casilla acepta
          los dos.

      - tipo: calcular
        titulo: El módulo de resiliencia
        pregunta: |
          ¿Cuánto vale el módulo de resiliencia?
        respuesta:
          tipo: magnitud
          valor: '1.40 MPa'
          # Arrastra el ±2 % del límite elástico al cuadrado: con E entre 195 y
          # 200 GPa sale de 1,38 a 1,42.
          tolerancia: 0.05
          formato: una energía por unidad de volumen, en MPa y con la unidad
        distractores:
          - valor: '2.80 MPa'
            mensaje: |
              Te has dejado el ½. El área bajo el tramo elástico es un
              triángulo: $U_r = \sigma_y^{2}/2E$.
          - valor: '3.93 MPa'
            mensaje: |
              Has usado la resistencia a tracción. La resiliencia llega solo
              hasta el límite elástico: es la energía que se devuelve al
              descargar, y más allá hay deformación permanente.
        pista: |
          $U_r = \dfrac{\sigma_y^{2}}{2E}$, con las dos en MPa.
        desarrollo: |
          $$
          U_r = \frac{744^{2}}{2\cdot 197\,600} = 1{,}40\ \text{MPa}
          = 1{,}40\ \text{MJ/m}^{3}
          $$

      - tipo: dibujar
        consigna: |
          Representa la curva $\sigma$–$\varepsilon$ con los diecisiete
          puntos de la tabla y el origen: las longitudes, divididas entre mil,
          $A_0 = 128{,}7\ \text{mm}^{2}$ y $l_0 = 50{,}80\ \text{mm}$. Como en
          el 2.28, haz también un detalle del principio, hasta
          $\varepsilon \approx 0{,}01$, para ver el tramo recto y trazar la
          paralela del 0,2 %.
        comprueba:
          - punto: >-
              Los ejes con su magnitud y su unidad: $\varepsilon$ hasta algo
              más de 0,115 y $\sigma$ en MPa hasta unos 1300.
            porque: >-
              Con el $10^{3}$ del encabezado mal leído —la longitud en
              milésimas comparada con $l_0$ en milímetros— la deformación sale
              cerca de 1000 y la curva no cabe en ningún eje razonable. Los
              1300 MPa son los que salen de la tabla, aunque no sean de un
              aluminio: se dibuja lo que da el ensayo.
          - punto: >-
              En el detalle, los cinco primeros puntos sobre una recta que pasa
              por el origen, de pendiente $E = 197{,}6\ \text{GPa}$, y el de
              89 100 N ya separándose.
            porque: >-
              El módulo se lee en el tramo recto y el dibujo dice dónde acaba:
              el cociente del sexto punto baja a 173 GPa. Y esa pendiente es la
              de la tabla, casi el triple de los 70 GPa de un aluminio: la
              recta se dibuja con el dato, no con el nombre del material.
          - punto: >-
              La paralela desde $\varepsilon = 0{,}002$, cortando la curva
              entre los puntos de 92 700 y 102 500 N, a unos 744 MPa.
            porque: >-
              Es el límite elástico del apartado c). Aquí el corte cae entre
              dos puntos, así que se lee sobre el tramo que los une. Leer la
              curva en 0,002 da 393 MPa, que es donde la paralela empieza, no
              donde corta.
          - punto: >-
              El máximo, 1246,5 MPa en $\varepsilon = 0{,}07$, y la bajada
              hasta el último punto, 969 MPa en $\varepsilon = 0{,}115$, donde
              rompe.
            porque: >-
              El máximo es la resistencia a tracción del apartado d), y la
              abscisa del último punto es el 11,5 % del apartado e). Una curva
              cortada en el máximo pierde casi un 40 % del alargamiento.
        figura: |
          <svg viewBox="0 0 340 442" role="img" width="340" height="442" aria-labelledby="cm2-d229-t cm2-d229-d">
            <title id="cm2-d229-t">La curva tensión-deformación de la probeta del problema 2.29, entera y con el tramo inicial ampliado</title>
            <desc id="cm2-d229-d">Dos gráficas a escala con los diecisiete puntos de la tabla y el origen, unidos por tramos rectos. Arriba, la curva entera: deformación de 0 a 0,12 y tensión de 0 a 1300 megapascales. Sube casi en vertical hasta unos 600 megapascales, se curva, llega al máximo de 1246,5 megapascales en deformación 0,07, que es la resistencia a tracción, y baja hasta el último punto, 969 megapascales en deformación 0,115, donde rompe: el alargamiento es del 11,5 %. Abajo, el tramo inicial hasta deformación 0,0105: los cinco primeros puntos sobre una recta de pendiente 197,6 gigapascales, que es el módulo, y la paralela a trazos desde deformación 0,002, que corta la curva entre los puntos de 92 700 y 102 500 newtons, en 744 megapascales: el límite elástico.</desc>
