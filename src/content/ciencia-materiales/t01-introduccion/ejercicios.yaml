ejercicios:
  - id: ejcm1-cinco-solidos-y-lo-que-los-mantiene-unidos
    titulo: Cinco sólidos, y lo que mantiene unido a cada uno
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre los cuatro tipos de
      sólidos cristalinos del Tema 1 de la asignatura. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      Para cada uno de estos cinco sólidos —cloruro sódico, diamante, hierro,
      hielo y cloruro de cesio—, di qué fuerza mantiene unidas sus partículas y
      a qué tipo de sólido cristalino pertenece.
    pide: El tipo de sólido de cada uno, y cuántos hay de cada clase.
    pasos:
      - tipo: reconocer
        pregunta: |
          Empieza por el cloruro sódico. ¿Qué lo mantiene unido?
        opciones:
          - texto: La atracción entre iones de carga contraria, porque es un metal unido a un no metal
            correcta: true
            mensaje: |
              Eso es. El sodio cede un electrón y el cloro lo acepta: quedan
              un catión y un anión que se atraen, y se ordenan en una red
              iónica. Es un sólido **iónico**.
          - texto: Electrones compartidos entre el sodio y el cloro
            mensaje: |
              Compartir electrones es el enlace covalente, y se da entre no
              metales. El sodio es un metal que retiene muy poco su electrón:
              no lo comparte, lo cede.
          - texto: Una nube de electrones libres, como en los metales
            mensaje: |
              La nube de electrones es del enlace metálico, que se forma entre
              átomos metálicos. En el cloruro sódico solo uno de los dos es un
              metal, y el otro le quita el electrón.
          - texto: Fuerzas entre moléculas de cloruro sódico
            mensaje: |
              El cloruro sódico sólido no está hecho de moléculas sueltas: es
              una red continua de iones. Las fuerzas entre moléculas son las de
              los sólidos moleculares, como el hielo.

      - tipo: calcular
        titulo: Los sólidos iónicos
        pregunta: |
          De los cinco, ¿cuántos son sólidos iónicos?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el cloruro de cesio. Es el mismo caso que el
              cloruro sódico: un metal, el cesio, cede su electrón al cloro. Es
              uno de los dos ejemplos de sólido iónico del tema.
          - valor: '3'
            mensaje: |
              Has contado uno de más. El diamante es carbono con carbono, y el
              hielo son moléculas de agua: ninguno de los dos tiene iones.
        pista: |
          Busca los que juntan un metal con un no metal.
        desarrollo: |
          El cloruro sódico y el cloruro de cesio: los dos juntan un metal
          que cede electrones con el cloro, que los acepta. Son **2**.

      - tipo: calcular
        titulo: Los que se sostienen con un enlace secundario
        pregunta: |
          ¿Cuántos de los cinco se mantienen unidos, como sólido, por un enlace
          secundario?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              El hielo. Dentro de cada molécula de agua el enlace es
              covalente, pero lo que une unas moléculas con otras en el sólido
              son los puentes de hidrógeno, que son un enlace secundario.
          - valor: '2'
            mensaje: |
              Has contado el diamante. El diamante no tiene moléculas: cada
              átomo de carbono está unido a sus vecinos por enlaces
              covalentes, en una red que ocupa todo el cristal.
        pista: |
          Un enlace secundario actúa entre moléculas. ¿Cuál de los cinco está
          hecho de moléculas separadas?
        desarrollo: |
          Solo el hielo, que es un sólido **molecular**: sus moléculas se unen
          por puentes de hidrógeno. El diamante es covalente, el hierro
          metálico y los dos cloruros iónicos.

      - tipo: justificar
        pregunta: Ordena por qué el hielo funde a cero grados y el diamante no. Una pieza es falsa.
        piezas:
          - texto: 'En el diamante, cada átomo de carbono está unido a sus vecinos por enlaces covalentes en una red continua.'
          - texto: 'En el hielo, las moléculas de agua se unen entre sí por puentes de hidrógeno, que son un enlace secundario.'
          - texto: 'Fundir el hielo solo exige romper esos enlaces secundarios, que son mucho más débiles que los primarios.'
          - texto: 'El hielo es un sólido covalente, porque el enlace entre el oxígeno y el hidrógeno es covalente.'
            trampa: true
            mensaje: |
              Dentro de la molécula, sí. Pero lo que mantiene unido **el
              sólido** es la atracción entre moléculas, así que el hielo es un
              sólido molecular. Si fuera covalente como el diamante, no
              fundiría a cero grados.
    resolucion: |
      **Lo primero es preguntar entre qué átomos se forma el enlace**, porque
      eso decide casi siempre el tipo de sólido:

      | sólido | átomos | lo mantiene unido | tipo |
      |---|---|---|---|
      | cloruro sódico | metal y no metal | atracción entre iones | iónico |
      | cloruro de cesio | metal y no metal | atracción entre iones | iónico |
      | diamante | carbono con carbono | enlace covalente | covalente |
      | hierro | metal | enlace metálico | metálico |
      | hielo | moléculas de agua | puentes de hidrógeno | molecular |

      Hay **dos iónicos** y **uno molecular**. El que más se confunde es el
      hielo: su molécula es covalente por dentro, pero el sólido se sostiene
      con enlaces secundarios entre moléculas, y por eso funde tan fácil.

  - id: ejcm1-la-alumina-que-se-vuelve-transparente
    titulo: La alúmina que se vuelve transparente
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el ejemplo de la
      alúmina con óxido de magnesio del Tema 1 de la asignatura. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Al calentar polvo de alúmina, $\text{Al}_2\text{O}_3$, a temperatura
      elevada, se obtiene una pieza opaca. Si antes de calentarlo se le añade
      un 0,1 % de óxido de magnesio, $\text{MgO}$, la pieza sale transparente.

      a) ¿Por qué sale opaca la primera?

      b) Para preparar 250 g de polvo con ese 0,1 % de óxido de magnesio,
      ¿cuánto óxido de magnesio hace falta?
    pide: El motivo de la opacidad y la masa de óxido de magnesio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué sale opaca la alúmina sin aditivo?
        opciones:
          - texto: Porque al unirse los granos del polvo queda aire atrapado entre ellos
            correcta: true
            mensaje: |
              Exacto. Los poros entre los granos dispersan la luz. Con el 0,1 %
              de óxido de magnesio la pieza queda totalmente homogénea, sin
              poros, y la luz pasa.
          - texto: Porque es un cerámico, y los cerámicos son opacos
            mensaje: |
              Los cerámicos pueden ser transparentes u opacos: el vidrio es un
              cerámico y es transparente. Y este mismo ejemplo lo desmiente,
              porque la misma alúmina sale transparente con el aditivo.
          - texto: Porque es cristalina, y los materiales cristalinos no dejan pasar la luz
            mensaje: |
              El orden de los átomos no decide eso. La diferencia entre las dos
              piezas no está en el nivel atómico sino en el microscópico: en
              si quedan huecos entre los granos.
          - texto: Porque el óxido de magnesio cambia su composición química
            mensaje: |
              Con un 0,1 % la composición casi no cambia. Lo que cambia es la
              estructura: el aditivo deja la pieza homogénea, sin poros.

      - tipo: calcular
        titulo: El óxido de magnesio que hace falta
        pregunta: |
          ¿Cuánto óxido de magnesio llevan 250 g de polvo con un 0,1 %?
        respuesta:
          tipo: magnitud
          valor: '0.25 g'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '25 g'
            mensaje: |
              Has tomado el 0,1 % como si fuera 0,1 veces la masa, es decir un
              10 %. Un 0,1 % es una milésima: 250 entre mil.
          - valor: '2.5 g'
            mensaje: |
              Eso sería un 1 %, diez veces más de lo que dice el enunciado. Un
              0,1 % es 0,001 veces la masa.
        pista: |
          Un tanto por ciento es una fracción de cien: un 0,1 % es 0,001.
        desarrollo: |
          $$
          m_{\text{MgO}} = 0{,}001 \cdot 250 = 0{,}25\ \text{g}
          $$

      - tipo: justificar
        pregunta: Ordena por qué cambia tanto la pieza con tan poco aditivo. Una pieza es falsa.
        piezas:
          - texto: 'Sin aditivo, al calentar el polvo los granos se unen pero queda aire atrapado entre ellos.'
          - texto: 'Esos poros dispersan la luz, y la pieza sale opaca.'
          - texto: 'Con un 0,1 % de óxido de magnesio la pieza queda totalmente homogénea, y deja pasar la luz.'
          - texto: 'El óxido de magnesio cambia la composición de la alúmina, y un compuesto distinto tiene propiedades distintas.'
            trampa: true
            mensaje: |
              Un cuarto de gramo en 250 apenas cambia la composición. Lo que
              cambia es la **estructura a nivel microscópico**: con poros o sin
              ellos. Es la idea central del tema, las propiedades no son del
              compuesto sino de cómo está organizado.
    resolucion: |
      **Es el ejemplo del tema de que la estructura manda más que la
      composición.** La alúmina sin aditivo y la que lleva el óxido de magnesio
      son, a efectos prácticos, el mismo compuesto:

      $$
      m_{\text{MgO}} = 0{,}001 \cdot 250 = 0{,}25\ \text{g}
      $$

      Un cuarto de gramo en 250. Lo que cambia es la estructura a **nivel
      microscópico**: sin aditivo, al unirse los granos queda aire atrapado
      entre ellos, los poros dispersan la luz y la pieza sale opaca; con el
      aditivo queda totalmente homogénea y sale transparente.

  - id: ejcm1-la-tabla-de-los-seis-materiales
    titulo: La tabla de los seis materiales
    fuente: >-
      Ejercicio de clase que cierra el Tema 1, «Introducción a la ciencia de
      los materiales» · Ciencia de Materiales, UPV/EHU, curso 2025-2026. La
      propia diapositiva lleva la solución debajo de la tabla en blanco, y el
      desarrollo está contrastado contra ella.
    nivel: practica
    enunciado: |
      Completa la siguiente tabla:

      | MATERIAL | TIPO DE ENLACE (a) | TIPO DE ESTRUCTURA (b) | PROPIEDADES (c) | APLICACIÓN (d) |
      |---|---|---|---|---|
      | Bronce | | | | |
      | Aluminio | | | | |
      | Poliestireno | | | | |
      | Latón | | | | |
      | Vidrio | | | | |
      | Cloruro de sodio | | | | |

      (a) Referido al enlace químico entre los átomos del material.
      (b) Referido al ordenamiento entre los átomos del material.
      (c) Al menos dos propiedades.
      (d) Al menos una aplicación.
    pide: El enlace, la estructura, dos propiedades y una aplicación de cada material.
    pasos:
      - tipo: reconocer
        pregunta: |
          El bronce y el latón son aleaciones de cobre, con estaño el primero y
          con cinc el segundo. ¿Qué enlace tienen?
        opciones:
          - texto: Metálico, porque son mezclas de metales
            correcta: true
            mensaje: |
              Eso es. Una aleación de metales sigue siendo un metal: sus átomos
              están unidos por enlace metálico y ordenados en una red
              cristalina. Por eso los dos son dúctiles y conducen.
          - texto: Iónico, porque juntan dos elementos distintos
            mensaje: |
              Que haya dos elementos no hace iónico un enlace. El iónico se
              forma entre un metal y un **no metal**; aquí los dos son metales,
              y ninguno le arranca el electrón al otro.
          - texto: Covalente, porque los átomos comparten electrones al alearse
            mensaje: |
              Compartir electrones entre dos átomos concretos es el enlace
              covalente, propio de los no metales. En los metales los
              electrones no se comparten de dos en dos: forman una nube común.
          - texto: Depende de la proporción de cobre que lleve cada una
            mensaje: |
              La proporción cambia las propiedades, no el tipo de enlace. Con
              más o menos estaño o cinc, sigue siendo una aleación metálica.

      - tipo: calcular
        titulo: Los materiales cristalinos
        pregunta: |
          De los seis materiales de la tabla, ¿cuántos tienen estructura
          cristalina?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Has contado como cristalino el vidrio o el poliestireno, y los dos
              son **amorfos**. El vidrio es el ejemplo de sólido amorfo por
              excelencia: transparente no quiere decir ordenado.
          - valor: '6'
            mensaje: |
              No todos los sólidos son cristalinos. El vidrio y el poliestireno
              son amorfos: sus átomos no tienen orden de largo alcance.
        pista: |
          Busca los dos que no tienen orden de largo alcance: un vidrio y un
          plástico.
        desarrollo: |
          Cristalinos son el bronce, el aluminio, el latón y el cloruro de
          sodio: **4**. El vidrio y el poliestireno son amorfos.

      - tipo: calcular
        titulo: Los materiales con enlace metálico
        pregunta: |
          ¿Y cuántos tienen enlace metálico?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Solo has contado el aluminio. El bronce y el latón son aleaciones
              de cobre, y una aleación de metales sigue teniendo enlace
              metálico.
          - valor: '4'
            mensaje: |
              Has contado de más. El cloruro de sodio junta un metal con un no
              metal: su enlace es iónico, no metálico.
        pista: |
          Una aleación de metales cuenta como metal.
        desarrollo: |
          El bronce, el aluminio y el latón: **3**.

      - tipo: justificar
        pregunta: Ordena la fila del vidrio. Una pieza es falsa.
        piezas:
          - texto: 'El vidrio es sobre todo sílice, y sus átomos se unen por enlace covalente e iónico.'
          - texto: 'Sus átomos no tienen orden de largo alcance: es un sólido amorfo.'
          - texto: 'Es transparente y aislante, y se usa para vasos y ventanas.'
          - texto: 'Es transparente porque sus átomos están perfectamente ordenados, como en un cristal.'
            trampa: true
            mensaje: |
              Es justo al revés: el vidrio es **amorfo**, sin orden de largo
              alcance. Que deje pasar la luz no depende de que sus átomos estén
              ordenados; la alúmina del tema lo enseña por el otro lado, opaca
              o transparente según tenga poros o no.
    resolucion: |
      La solución que trae la propia diapositiva:

      | material | enlace | estructura | propiedades | aplicación |
      |---|---|---|---|---|
      | bronce | metálico | cristalina | dúctil, conductor | campana |
      | aluminio | metálico | cristalina | no se corroe, ligero | envasado |
      | poliestireno | covalente | amorfa | maleable, ligero | film |
      | latón | metálico | cristalina | dúctil, conductor | bisutería |
      | vidrio | covalente e iónico | amorfa | transparente, aislante | vaso |
      | cloruro de sodio | iónico | cristalina | duro, frágil | alimentación |

      **Lo que la tabla enseña si se lee por columnas.** Los tres metálicos son
      cristalinos, y comparten propiedades: dúctiles y conductores. Los dos
      amorfos son un plástico y un vidrio, y ninguno conduce. Y el único iónico
      es duro y frágil, como los cerámicos. Las propiedades y las aplicaciones
      admiten más de una respuesta —el enunciado pide «al menos» dos y una—,
      pero el enlace y la estructura no.

  - id: ejcm1-simulacro-la-cadena-y-las-escalas
    titulo: Simulacro del test · la cadena y las escalas
    fuente: Simulacro propio · Road to Ingeniería. Las preguntas salen del Tema 1 de la asignatura, pero no son las del test, porque qué pregunta el test no está en el material y no se adivina. Del formato del test no consta nada en el material, así que esto no lo imita. Repasa los contenidos mínimos, que son lo que sí está acotado.
    nivel: practica
    enunciado: |
      Seis preguntas del tipo que cae en el test de contenidos mínimos, sobre
      la primera mitad del tema: qué estudia la ciencia de materiales, las
      cuatro escalas de la estructura y los dos ejemplos que el tema usa para
      explicarlas.

      Contéstalas seguidas, sin mirar el tema. Si fallas alguna, el diagnóstico
      te dice **por qué** esa opción es la equivocada, que es lo que hay que
      llevarse.
    pide: Las seis respuestas, y el razonamiento de la última.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la diferencia entre la **ciencia** de materiales y la
          **ingeniería** de materiales?
        opciones:
          - texto: >-
              La ciencia estudia la relación entre estructura y propiedades; la
              ingeniería parte de las propiedades que hacen falta y diseña la
              estructura que las da
            correcta: true
            mensaje: |
              Eso es: la misma relación recorrida en los dos sentidos. La
              ciencia va de la estructura a las propiedades y la ingeniería, de
              las propiedades a la estructura.
          - texto: La ciencia trabaja en el laboratorio y la ingeniería en la fábrica
            mensaje: |
              No es una diferencia de sitio, es de dirección. Las dos pueden
              hacerse en cualquier parte; lo que cambia es de qué se parte y a
              qué se llega.
          - texto: La ciencia estudia materiales nuevos y la ingeniería los que ya existen
            mensaje: |
              Tampoco. La ingeniería diseña materiales nuevos continuamente
              —las superaleaciones de níquel son un ejemplo del propio tema—, y
              la ciencia estudia los de siempre.
      - tipo: reconocer
        pregunta: |
          Las aleaciones de aluminio son dúctiles y las de magnesio, frágiles.
          Los dos son metales ligeros con el mismo tipo de enlace. ¿A qué nivel
          de la estructura se decide esa diferencia?
        opciones:
          - texto: Al nivel atómico, en cómo se ordenan los átomos
            correcta: true
            mensaje: |
              Sí. El aluminio ordena sus átomos en una red cúbica y el magnesio
              en una hexagonal, y eso cambia cómo deslizan unos planos de
              átomos sobre otros al deformarse. El porqué exacto es el tema 3.
          - texto: Al nivel subatómico, porque tienen distinto número de electrones
            mensaje: |
              En el nivel subatómico se decide el **tipo de enlace**, y el
              enunciado dice que los dos tienen el mismo. Si la diferencia
              estuviera ahí, el enlace no sería el mismo.
          - texto: Al nivel microscópico, en el tamaño de los granos
            mensaje: |
              Ese es el nivel del otro ejemplo del tema, el de la alúmina
              opaca y la transparente. Aquí lo que cambia es la red en la que
              se colocan los átomos, un nivel más abajo.
      - tipo: reconocer
        pregunta: |
          Al polvo de alúmina se le añade un 0,1 % de óxido de magnesio antes
          de calentarlo y la pieza sale transparente en vez de opaca. ¿Qué
          enseña ese ejemplo?
        opciones:
          - texto: >-
              Que las propiedades no las decide la composición sino la
              estructura, aquí a nivel microscópico
            correcta: true
            mensaje: |
              Exacto, y es la idea que sostiene la asignatura entera. La
              composición apenas ha cambiado —una décima de un uno por
              ciento—; lo que ha cambiado es que ya no quedan poros con aire
              entre los granos.
          - texto: Que el óxido de magnesio es transparente y le da su transparencia
            mensaje: |
              Con un 0,1 % no se le da ninguna propiedad por aportación: lo que
              hace el óxido de magnesio es que la pieza quede homogénea al
              calentarla, sin aire atrapado.
          - texto: Que la alúmina pura es opaca y hay que impurificarla siempre
            mensaje: |
              La alúmina no es opaca «por naturaleza»: es opaca **cuando quedan
              poros**. El ejemplo va de eso, no de una propiedad fija del
              compuesto.
      - tipo: calcular
        titulo: Cuántas familias de propiedades
        pregunta: |
          El tema enumera las familias de propiedades de un material —la
          respuesta a un estímulo externo—. ¿Cuántas son?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Cuatro son los **niveles de la estructura** —subatómico,
              atómico, microscópico y macroscópico— y también las familias de
              materiales. Las de propiedades son más.
          - valor: '3'
            mensaje: |
              Tres son los enlaces primarios. Las familias de propiedades son
              el doble.
        pista: |
          Mecánicas, eléctricas, térmicas… y tres más.
        desarrollo: |
          Mecánicas, eléctricas, térmicas, magnéticas, ópticas y químicas:
          **6**.
      - tipo: reconocer
        pregunta: |
          ¿Qué es una **propiedad** de un material, según el tema?
        opciones:
          - texto: La respuesta del material a un estímulo externo
            correcta: true
            mensaje: |
              Esa es la definición, y conviene decirla con esas palabras. Una
              propiedad no es algo que el material «tiene» en el vacío: es lo
              que hace cuando algo le ocurre.
          - texto: Una característica química que se deduce de su fórmula
            mensaje: |
              Justo lo contrario de lo que el tema demuestra con la alúmina y
              con el acero de la lima y el del clip, que pueden tener la misma
              composición y comportarse al revés.
          - texto: El valor numérico que aparece en las tablas del fabricante
            mensaje: |
              El valor tabulado es una medida de la propiedad, no la propiedad.
              Y depende del procesado, por eso el mismo compuesto da valores
              distintos.
      - tipo: justificar
        pregunta: |
          Ordena la cadena que ordena la asignatura. Una pieza es falsa.
        piezas:
          - texto: 'El **procesado** —fundir, laminar, calentar, templar— cambia la estructura del material.'
          - texto: 'La **estructura**, en sus cuatro niveles, fija las propiedades.'
          - texto: 'Las **propiedades** deciden el comportamiento de la pieza en servicio.'
          - texto: 'Por eso la cadena se escribe procesado → estructura → propiedades → comportamiento, y el curso entero es aprender a recorrerla en los dos sentidos.'
          - texto: 'Y como la composición química está en el primer eslabón, dos piezas con la misma fórmula se comportan igual.'
            trampa: true
            mensaje: |
              La composición no es ningún eslabón de la cadena: lo que el
              procesado cambia es la **estructura**, no la fórmula. Dos piezas
              con la misma composición y distinto procesado tienen distinta
              estructura y se comportan distinto — el acero de una lima y el de
              un clip.
        veredicto: |
          Si te sabes la cadena y las cuatro escalas, tienes contestada media
          prueba: casi todo lo demás del tema cuelga de ahí.
    resolucion: |
      **Las seis, en corto.**

      ### 1 · Ciencia e ingeniería

      La **ciencia** de materiales estudia la relación entre estructura y
      propiedades. La **ingeniería** la usa al revés: parte de las propiedades
      que hacen falta y diseña la estructura que las da. Es la misma relación
      en los dos sentidos.

      ### 2 · Aluminio y magnesio → nivel atómico

      Mismo enlace, distinta red: cúbica el aluminio, hexagonal el magnesio. La
      diferencia está en **cómo se ordenan los átomos**.

      ### 3 · La alúmina → nivel microscópico

      Con un 0,1 % de óxido de magnesio la pieza queda homogénea y sin poros, y
      pasa de opaca a transparente. **La composición apenas cambia; cambia la
      estructura.**

      ### 4 · Seis familias de propiedades

      Mecánicas, eléctricas, térmicas, magnéticas, ópticas y químicas.

      ### 5 · Qué es una propiedad

      **La respuesta del material a un estímulo externo.**

      ### 6 · La cadena

      $$
      \text{procesado} \rightarrow \text{estructura} \rightarrow
      \text{propiedades} \rightarrow \text{comportamiento}
      $$

      Y los cuatro niveles a los que se mira la estructura: subatómico,
      atómico, microscópico y macroscópico.

      > **Lo que enseña.** Las tres primeras preguntas son la misma con tres
      > disfraces: dónde se decide una propiedad. La respuesta nunca es «en la
      > composición».

  - id: ejcm1-simulacro-enlaces-y-familias
    titulo: Simulacro del test · enlaces, sólidos y familias
    fuente: Simulacro propio · Road to Ingeniería. Las preguntas salen del Tema 1 de la asignatura, pero no son las del test, porque qué pregunta el test no está en el material y no se adivina. Del formato del test no consta nada en el material, así que esto no lo imita. Repasa los contenidos mínimos, que son lo que sí está acotado.
    nivel: practica
    enunciado: |
      Seis preguntas más, sobre la segunda mitad del tema: los enlaces
      primarios y secundarios, cristalino frente a amorfo, la clasificación de
      los sólidos cristalinos y las cuatro familias de materiales.

      Es la parte del tema con más datos que memorizar, y por eso la que más
      se presta a un test.
    pide: Las seis respuestas, y el razonamiento de la última.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de enlace primario se forma entre un **metal** y un **no
          metal**?
        opciones:
          - texto: Iónico — el metal cede electrones y el no metal los acepta
            correcta: true
            mensaje: |
              Sí. Se forman iones de signo contrario que se atraen, y el
              ejemplo del tema es el cloruro sódico.
          - texto: Covalente — comparten los electrones entre los dos
            mensaje: |
              El covalente es entre **no metales**, que atraen los electrones
              de forma parecida y por eso los comparten en vez de cedérselos.
          - texto: Metálico — los electrones quedan libres en una nube
            mensaje: |
              El metálico es entre **metales**. Hace falta que todos retengan
              poco los electrones para que queden libres.
      - tipo: reconocer
        pregunta: |
          El hielo. Dentro de cada molécula de agua, el oxígeno y los
          hidrógenos comparten electrones. ¿Qué clase de sólido cristalino es?
        opciones:
          - texto: Molecular, porque lo que mantiene unido el sólido son los puentes de hidrógeno
            correcta: true
            mensaje: |
              Exacto, y es el error típico que el tema se molesta en desmentir.
              Lo que clasifica un sólido no es el enlace de dentro de sus
              moléculas, sino **lo que mantiene unidas unas moléculas con
              otras**.
          - texto: Covalente, porque el enlace O–H es covalente
            mensaje: |
              Ese es el enlace de dentro de la molécula. Para fundir el hielo
              no hay que romperlo: basta con separar unas moléculas de otras,
              rompiendo los puentes de hidrógeno, que son débiles. Por eso
              funde a cero grados y el diamante no funde a ninguna temperatura
              razonable.
          - texto: Iónico, porque el agua se disocia en H⁺ y OH⁻
            mensaje: |
              Esa disociación es minúscula y ocurre en el agua líquida. El
              sólido no está hecho de iones colocados en una red.
      - tipo: calcular
        titulo: Contar los sólidos moleculares
        pregunta: |
          De esta lista, ¿cuántos son **sólidos moleculares**? Hielo, diamante,
          cloruro de cesio, hierro, grafito, fluoruro de calcio.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Has contado uno de más, y lo más probable es que sea el grafito.
              El grafito es **covalente**, como el diamante: los dos son
              carbono unido por enlaces covalentes, sin moléculas separadas.
          - valor: '3'
            mensaje: |
              Solo uno de los seis se mantiene unido por fuerzas entre
              moléculas. Repasa la tabla: dos son iónicos, dos covalentes y uno
              metálico.
        pista: |
          Busca el único que está hecho de moléculas separadas, unidas entre sí
          por enlaces secundarios.
        desarrollo: |
          Solo el **hielo**. El cloruro de cesio y el fluoruro de calcio son
          iónicos; el diamante y el grafito, covalentes; el hierro, metálico.
      - tipo: reconocer
        pregunta: |
          ¿Qué quiere decir que un sólido sea **amorfo**?
        opciones:
          - texto: >-
              Que no tiene orden de largo alcance — sus partículas solo
              guardan cierto orden entre vecinas
            correcta: true
            mensaje: |
              Eso es. El cristalino repite el mismo patrón a lo largo de todo
              el material; el amorfo solo tiene orden de corto alcance. El
              vidrio es el ejemplo de siempre.
          - texto: Que no tiene forma definida y se deforma con facilidad
            mensaje: |
              «Amorfo» habla del orden **interno**, no de la forma exterior ni
              de lo blando que sea. El vidrio es amorfo y es rígido y frágil.
          - texto: Que está formado por varias fases mezcladas
            mensaje: |
              Eso describe a un material compuesto o a una microestructura de
              varias fases, que es otra cosa. Un amorfo puede ser de una sola
              fase.
      - tipo: reconocer
        pregunta: |
          ¿Qué familia de materiales es **aislante del calor y la
          electricidad, resiste altas temperaturas y es dura y frágil**?
        opciones:
          - texto: Los cerámicos
            correcta: true
            mensaje: |
              Sí, con enlace iónico o covalente entre metales y no metales.
              Óxidos como la sílice, nitruros, carburos; y también la arcilla,
              el cemento y el vidrio.
          - texto: Los polímeros
            mensaje: |
              Los polímeros también conducen poco, pero son **ligeros y
              flexibles**, no duros y frágiles, y no resisten altas
              temperaturas: es justo lo que los descarta para eso.
          - texto: Los compuestos
            mensaje: |
              Un compuesto no tiene propiedades propias de familia: las suyas
              salen de las de sus componentes. Por eso no se le puede asignar
              esa lista.
      - tipo: justificar
        pregunta: |
          Ordena lo que decide qué enlace se forma. Una pieza es falsa.
        piezas:
          - texto: 'Lo decide la **electronegatividad**, que es la tendencia de un átomo a atraer electrones.'
          - texto: 'Un átomo que los retiene poco frente a otro que los atrae mucho: el primero los cede y sale un enlace **iónico**.'
          - texto: 'Dos átomos que los atraen de forma parecida los comparten, y sale un enlace **covalente**.'
          - texto: 'Muchos átomos que los retienen poco los dejan libres en una nube común, y sale un enlace **metálico**.'
          - texto: 'Y los enlaces secundarios, Van der Waals y puentes de hidrógeno, se forman por la misma razón y son igual de fuertes.'
            trampa: true
            mensaje: |
              Los secundarios son **mucho más débiles** que los primarios, y
              esa es justo la razón de que el hielo funda a cero grados. Actúan
              además entre moléculas, no entre átomos.
        veredicto: |
          Las tres filas de la tabla de enlaces primarios y las cuatro de la de
          sólidos cristalinos son el bloque con más preguntas posibles del
          tema. Vale la pena saberlas de corrido.
    resolucion: |
      **Las seis, en corto.**

      ### 1 · Metal + no metal → iónico

      El metal cede y el no metal acepta. Covalente es entre no metales, y
      metálico entre metales.

      ### 2 · El hielo es molecular

      El enlace O–H de dentro de la molécula es covalente, pero lo que mantiene
      unido **el sólido** son los puentes de hidrógeno entre moléculas. Por eso
      funde a cero grados.

      ### 3 · Un solo sólido molecular

      | sólido | clase |
      |---|---|
      | hielo | **molecular** |
      | diamante, grafito | covalentes |
      | cloruro de cesio, fluoruro de calcio | iónicos |
      | hierro | metálico |

      ### 4 · Amorfo

      Sin **orden de largo alcance**: el patrón no se repite a lo largo de todo
      el material, solo hay orden entre vecinos. El vidrio.

      ### 5 · Cerámicos

      Aislantes, resisten altas temperaturas, duros y frágiles. Enlace iónico
      y/o covalente entre metales y no metales.

      ### 6 · La electronegatividad decide el enlace

      Y los enlaces secundarios —Van der Waals y puentes de hidrógeno— son
      entre moléculas y **mucho más débiles** que los primarios.

      > **Lo que enseña.** Las dos preguntas que más se fallan son la del hielo
      > y la de contar sólidos, y las dos por lo mismo: confundir el enlace que
      > hay **dentro** de una molécula con el que mantiene unido **el sólido**.

  - id: ejcm1-escribir-los-minimos
    titulo: Escribirlo, que es como cae
    fuente: Simulacro propio · Road to Ingeniería. El formato sale del test previo de la
      práctica 2, que es de la misma profesora y usa pregunta abierta y relacionar. No son
      las preguntas del test de mínimos, que no están en el material.
    nivel: practica
    enunciado: |
      Tres preguntas para contestar **por escrito**, en papel y sin mirar el
      tema. Son del tipo que el test previo de la práctica 2 plantea —abiertas
      y de relacionar—, y todas van de los contenidos mínimos del tema 1.

      Escríbelas de verdad antes de abrir la rúbrica. Reconocer una respuesta
      buena entre tres opciones y saber escribirla desde cero no son la misma
      habilidad, y la segunda es la que no se puede fingir.
    pide: Las tres respuestas escritas, y después la comparación con la rúbrica.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir nada: si te piden «explica la relación entre
          estructura y propiedades», ¿qué tiene que aparecer sí o sí para que
          la respuesta valga?
        opciones:
          - texto: >-
              Un ejemplo concreto en el que la composición no cambia y la
              propiedad sí
            correcta: true
            mensaje: |
              Eso es lo que separa haberlo entendido de haberlo leído. La
              afirmación «la estructura decide las propiedades» la puede
              escribir cualquiera; lo que la demuestra es la alúmina que pasa
              de opaca a transparente con un 0,1 % de óxido de magnesio, o el
              aluminio dúctil frente al magnesio frágil.
          - texto: La definición exacta de estructura y de propiedad, con sus palabras
            mensaje: |
              Las definiciones ayudan, pero solas no contestan a la pregunta:
              se puede recitar las dos y no haber relacionado nada. Hace falta
              el caso que enseña la relación.
          - texto: La lista de las seis familias de propiedades
            mensaje: |
              Eso es enumerar, no relacionar. Enumerar es lo que se hace cuando
              no se sabe qué contestar, y un corrector lo distingue a la
              primera.
      - tipo: calcular
        titulo: Cuántos niveles hay que nombrar
        pregunta: |
          Si la pregunta es «¿a qué escalas se mira la estructura de un
          material?», ¿cuántas hay que nombrar para que esté completa?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Dos son las que el tema usa en sus ejemplos —el atómico del
              aluminio y el microscópico de la alúmina—, pero la pregunta es
              por todas las que hay.
          - valor: '6'
            mensaje: |
              Seis son las familias de propiedades. Los niveles de la
              estructura son menos.
        pista: |
          De lo más pequeño a lo más grande, empezando dentro del átomo.
        desarrollo: |
          Cuatro: **subatómico, atómico, microscópico y macroscópico**. Y una
          respuesta completa dice qué se mira en cada uno, no solo el nombre.
      - tipo: redactar
        consigna: |
          Contesta por escrito, en cinco o seis líneas y sin mirar el tema
          —esta es la pregunta larga—:

          **«Explica por qué las propiedades de un material no dependen solo de
          su composición química. Pon un ejemplo.»**
        rubrica:
          - punto: Dices que las propiedades dependen de la estructura, y no solo de qué átomos hay
            porque: >-
              Es la tesis de la pregunta. Si no aparece escrita, todo lo demás
              queda como una anécdota suelta y el corrector no tiene qué dar
              por bueno.
          - punto: Nombras a qué escala ocurre lo que cuentas, de las cuatro que hay
            porque: >-
              Es lo que distingue una respuesta de la asignatura de una
              respuesta de sentido común. «Depende de cómo esté hecho» lo dice
              cualquiera; «se decide en el nivel microscópico» lo dice quien ha
              estudiado el tema.
          - punto: Pones uno de los dos ejemplos del tema, con su número
            porque: >-
              La alúmina que pasa de opaca a transparente con un 0,1 % de óxido
              de magnesio, o el aluminio cúbico y dúctil frente al magnesio
              hexagonal y frágil. El número —el 0,1 %, las dos redes— es lo que
              demuestra que te acuerdas del caso y no solo de la moraleja.
          - punto: Dices que lo que cambia la estructura es el procesado
            porque: >-
              Cierra el argumento y enlaza con la cadena que ordena la
              asignatura. Sin esto la respuesta explica que la estructura manda,
              pero no de dónde sale esa estructura ni por qué se puede
              controlar.
        veredicto: |
          Si tu respuesta tiene los cuatro puntos, cabe en seis líneas y no le
          sobra nada. Si te has ido a las ocho, mira cuál de las frases no
          estaba en la rúbrica: casi siempre es una definición de más.
      - tipo: justificar
        pregunta: |
          Ordena el argumento de la respuesta larga. Una pieza es falsa.
        piezas:
          - texto: 'Las propiedades de un material salen de su **estructura**, o sea de cómo están colocados y agrupados sus átomos.'
          - texto: 'La estructura se mira a cuatro escalas, y cada propiedad se decide en una de ellas.'
          - texto: 'Con un 0,1 % de óxido de magnesio la alúmina pasa de opaca a transparente, y eso ocurre a nivel **microscópico**.'
          - texto: 'La composición apenas ha cambiado y la propiedad óptica es la contraria, así que no la decide la composición.'
          - texto: 'Y esa estructura la fija el **procesado**, que es el primer eslabón de la cadena.'
          - texto: 'Como la alúmina transparente lleva óxido de magnesio, en realidad sí es otro compuesto y por eso tiene otras propiedades.'
            trampa: true
            mensaje: |
              Es la salida fácil, y es justo lo que el ejemplo desmonta. Un 0,1 %
              es una milésima parte del material; si eso bastara para cambiar una
              propiedad óptica, el argumento valdría para cualquier cosa. Lo que
              hace el óxido de magnesio no es aportar transparencia, es evitar que
              queden poros al calentar.
        veredicto: |
          Ese es el orden de la respuesta escrita, y por eso este paso va antes
          de la rúbrica: si el argumento no se sostiene ordenado, tampoco se
          sostiene redactado.
    resolucion: |
      **Las tres, y la larga escrita entera.**

      ### 1 · Qué tiene que aparecer

      Un **ejemplo concreto** en el que la composición no cambia y la propiedad
      sí. La tesis sola no demuestra nada.

      ### 2 · Cuatro niveles

      Subatómico, atómico, microscópico y macroscópico.

      ### 3 · La respuesta larga, como se puede escribir

      > Las propiedades de un material no salen de su composición química sino
      > de su **estructura**, es decir, de cómo están colocados y agrupados sus
      > átomos. La estructura se mira a cuatro escalas —subatómica, atómica,
      > microscópica y macroscópica— y cada propiedad se decide en una de
      > ellas. Por ejemplo, si se calienta polvo de alúmina la pieza sale
      > **opaca**, porque quedan poros con aire entre los granos; si antes se le
      > añade un **0,1 % de óxido de magnesio**, la pieza queda homogénea y sale
      > **transparente**. La composición apenas ha cambiado y la propiedad
      > óptica es la contraria, y lo que ha cambiado es la estructura a nivel
      > **microscópico**. Y esa estructura la fija el **procesado**, que es el
      > primer eslabón de la cadena procesado → estructura → propiedades →
      > comportamiento.

      Son seis líneas y están los cuatro puntos de la rúbrica.

      > **Lo que enseña.** El ejemplo con su número es lo que más pesa y lo
      > primero que se olvida. «La alúmina puede ser opaca o transparente» vale
      > la mitad que «con un 0,1 % de óxido de magnesio la alúmina pasa de
      > opaca a transparente».

