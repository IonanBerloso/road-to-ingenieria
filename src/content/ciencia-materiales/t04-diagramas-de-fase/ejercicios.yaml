ejercicios:
  - id: ejcm4-la-palanca-en-el-punto-b
    titulo: Cuánto líquido queda en el punto B
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el punto B que usan las
      diapositivas del Tema 4 de la asignatura para explicar la regla de la
      palanca. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una aleación cobre-níquel con un 35 % en peso de Ni está a 1245 °C. En el
      diagrama de la figura 5, a esa temperatura el liquidus corta en un 32 % de
      Ni y el solidus en un 43 %. ¿Qué fases hay, de qué composición es cada una
      y qué fracción de la aleación es líquida?
    pide: Las fases, la composición del líquido y la fracción de líquido.
    pasos:
      - tipo: reconocer
        pregunta: |
          El punto (35 % Ni, 1245 °C) cae entre el liquidus y el solidus. ¿Qué
          hay ahí?
        opciones:
          - texto: Líquido y sólido alfa a la vez, cada uno con su propia composición
            correcta: true
            mensaje: |
              Eso es. Entre las dos líneas la aleación está a medio fundir: una
              parte es líquida y otra es sólido alfa, y ninguna de las dos tiene
              la composición global del 35 %.
          - texto: Una sola fase de composición 35 % Ni, a medio camino entre líquido y sólido
            mensaje: |
              No existe una fase «a medio camino». Hay dos fases distintas en
              equilibrio, y la del 35 % es la aleación entera, no ninguna de
              ellas.
          - texto: Solo sólido, porque el punto está por debajo del liquidus
            mensaje: |
              Por debajo del liquidus empieza a haber sólido, pero hasta cruzar
              el solidus queda líquido. Todo es sólido solo por debajo de la
              línea de abajo.

      - tipo: calcular
        titulo: La composición del líquido
        pregunta: |
          ¿Qué porcentaje de Ni tiene el líquido?
        respuesta:
          tipo: numero
          valor: '32'
          tolerancia: 1
          formato: el porcentaje de Ni, sin el símbolo
        distractores:
          - valor: '43'
            mensaje: |
              Ese es el sólido. La isoterma corta primero al liquidus, que es
              la frontera con la región del líquido, y ahí se lee su
              composición: 32 %.
          - valor: '35'
            mensaje: |
              Esa es la composición de la aleación entera. Las dos fases se
              reparten el níquel de forma desigual: el sólido se queda con más
              y el líquido con menos.
        pista: |
          Se traza la isoterma de 1245 °C y se lee dónde corta al liquidus.
        desarrollo: |
          La isoterma corta al liquidus en $C_L = 32\ \%$ de Ni y al solidus en
          $C_\alpha = 43\ \%$.

      - tipo: calcular
        titulo: La fracción de líquido
        pregunta: |
          ¿Qué fracción en masa de la aleación es líquida?
        respuesta:
          tipo: numero
          valor: '0.727'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.273'
            mensaje: |
              Has cogido el segmento del lado del líquido, de 32 a 35. La
              palanca va al revés: la fracción de líquido es el segmento del
              lado **contrario**, de 35 a 43, entre la isoterma entera.
          - valor: '0.35'
            mensaje: |
              Esa es la composición de la aleación escrita como fracción. La
              fracción de cada fase sale de la palanca, no de la composición.
        pista: |
          $W_L = \dfrac{C_\alpha - C_0}{C_\alpha - C_L}$: el segmento opuesto
          entre la isoterma entera.
        desarrollo: |
          $$
          W_L = \frac{C_\alpha - C_0}{C_\alpha - C_L} = \frac{43 - 35}{43 - 32} = \frac{8}{11} = 0{,}727
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Se traza la isoterma de 1245 °C por el punto de la aleación, de liquidus a solidus.'
          - texto: 'Los extremos dan las composiciones de las fases: 32 % el líquido y 43 % el sólido.'
          - texto: 'La fracción de líquido es el segmento del lado del sólido, de 35 a 43, entre los 11 de la isoterma: 0,73.'
          - texto: 'La fracción de líquido es el segmento que va del punto al liquidus, porque es el lado del líquido.'
            trampa: true
            mensaje: |
              Es el error de la palanca, y por eso se llama así: el peso de
              cada lado es el brazo del **otro**. Si la aleación estuviera casi
              encima del liquidus, su brazo del lado líquido sería casi cero, y
              sin embargo sería casi toda líquida.
    resolucion: |
      **Primero dónde cae el punto.** A 35 % de Ni y 1245 °C está entre el
      liquidus y el solidus: líquido y sólido alfa en equilibrio.

      **Después las composiciones**, en los extremos de la isoterma:
      $C_L = 32\ \%$ de Ni y $C_\alpha = 43\ \%$.

      **Y la cantidad de cada fase, con la palanca.** Cada fase pesa lo que
      mide el brazo del lado contrario:

      $$
      W_L = \frac{C_\alpha - C_0}{C_\alpha - C_L} = \frac{43 - 35}{11} = 0{,}727
      \qquad
      W_\alpha = \frac{C_0 - C_L}{C_\alpha - C_L} = \frac{35 - 32}{11} = 0{,}273
      $$

      Tres cuartas partes de la aleación siguen líquidas. Comprobación: el
      níquel de las dos fases tiene que dar el de la aleación,
      $0{,}727 \cdot 32 + 0{,}273 \cdot 43 = 35{,}0$.

  - id: ejcm4-la-ferrita-de-un-acero-hipoeutectoide
    titulo: La ferrita de un acero con 0,40 % de carbono, contada de dos maneras
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre los aceros
      hipoeutectoides del Tema 4 de la asignatura. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      Un acero al carbono con un 0,40 % en peso de C se enfría despacio desde
      la austenita hasta justo por debajo de 727 °C. Con el diagrama de la
      figura 6, calcula la fracción de ferrita proeutectoide y la fracción de
      ferrita total.
    pide: La ferrita proeutectoide y la ferrita total, como fracciones en masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con 0,40 % de C, ¿qué se forma antes de llegar a 727 °C?
        opciones:
          - texto: Ferrita proeutectoide, porque el acero tiene menos carbono que el eutectoide
            correcta: true
            mensaje: |
              Exacto. Con menos de 0,76 % de C el acero es hipoeutectoide: al
              cruzar la línea de 800 y pico grados empieza a salir ferrita de
              la austenita, y la austenita que queda se va enriqueciendo en
              carbono hasta 0,76 %.
          - texto: Cementita proeutectoide, porque hay carbono de sobra
            mensaje: |
              Eso pasa en un acero **hipereutectoide**, con más de 0,76 %. Con
              0,40 % el carbono no llega ni al del eutectoide.
          - texto: Nada, porque toda la austenita se transforma de golpe en perlita a 727 °C
            mensaje: |
              Solo un acero con exactamente 0,76 % pasa de austenita a perlita
              sin nada antes. Con 0,40 % se forma primero ferrita.
      - tipo: calcular
        titulo: La ferrita proeutectoide
        pregunta: |
          ¿Qué fracción en masa del acero es ferrita proeutectoide?
        respuesta:
          tipo: numero
          valor: '0.488'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.512'
            mensaje: |
              Esa es la perlita. Has puesto en el numerador el brazo del lado
              de la ferrita, de 0,022 a 0,40; la ferrita es el brazo del otro
              lado, de 0,40 a 0,76.
          - valor: '0.943'
            mensaje: |
              Esa es la ferrita **total**, la que sale de la palanca entre
              0,022 y 6,70. La proeutectoide es solo la que se forma antes del
              eutectoide, y su palanca termina en 0,76.
        pista: |
          Para los microconstituyentes, la palanca va de 0,022 a 0,76:
          $W_{\alpha,\text{pro}} = \dfrac{0{,}76 - C_0}{0{,}76 - 0{,}022}$.
        desarrollo: |
          $$
          W_{\alpha,\text{pro}} = \frac{0{,}76 - 0{,}40}{0{,}76 - 0{,}022} = \frac{0{,}36}{0{,}738} = 0{,}488
          $$

          El resto, 0,512, es perlita.

      - tipo: calcular
        titulo: La ferrita total
        pregunta: |
          ¿Y qué fracción en masa es ferrita en total, contando la de la perlita?
        respuesta:
          tipo: numero
          valor: '0.943'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.488'
            mensaje: |
              Esa es solo la proeutectoide. La perlita también es casi toda
              ferrita, y para contarla hay que hacer la palanca de las
              **fases**, que llega hasta la cementita, 6,70.
          - valor: '0.057'
            mensaje: |
              Esa es la cementita. Has cogido el brazo del lado de la ferrita,
              de 0,022 a 0,40; la ferrita es el brazo del otro lado.
        pista: |
          Para las fases, la palanca va de la ferrita a la cementita:
          $W_\alpha = \dfrac{6{,}70 - C_0}{6{,}70 - 0{,}022}$.
        desarrollo: |
          $$
          W_\alpha = \frac{6{,}70 - 0{,}40}{6{,}70 - 0{,}022} = \frac{6{,}30}{6{,}678} = 0{,}943
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Con 0,40 % de C el acero es hipoeutectoide, y antes de 727 °C se forma ferrita proeutectoide.'
          - texto: 'Para los microconstituyentes la palanca va de 0,022 a 0,76: un 48,8 % de ferrita proeutectoide y un 51,2 % de perlita.'
          - texto: 'Para las fases va de 0,022 a 6,70: un 94,3 % de ferrita en total, porque la perlita es casi toda ferrita.'
          - texto: 'La ferrita total es la proeutectoide, porque la perlita es otro microconstituyente distinto.'
            trampa: true
            mensaje: |
              La perlita es un microconstituyente, pero está hecha de dos
              **fases**: láminas de ferrita y de cementita. La ferrita total
              suma la proeutectoide y la de dentro de la perlita, y por eso
              pasa de 0,49 a 0,94.
    resolucion: |
      **Hay dos palancas, y la pregunta decide cuál.** Por debajo de 727 °C el
      acero tiene dos fases —ferrita y cementita— pero se ve con dos
      microconstituyentes —ferrita proeutectoide y perlita—.

      **Los microconstituyentes** se reparten entre 0,022 y el eutectoide, 0,76,
      porque la perlita es lo que sale de la austenita de 0,76 %:

      $$
      W_{\alpha,\text{pro}} = \frac{0{,}76 - 0{,}40}{0{,}76 - 0{,}022} = 0{,}488
      \qquad
      W_{\text{perlita}} = 0{,}512
      $$

      **Las fases** se reparten entre la ferrita y la cementita, 6,70:

      $$
      W_\alpha = \frac{6{,}70 - 0{,}40}{6{,}70 - 0{,}022} = 0{,}943
      \qquad
      W_{\text{Fe}_3\text{C}} = 0{,}057
      $$

      La diferencia, 0,943 − 0,488 = 0,455, es la ferrita que está dentro de la
      perlita. Confundir las dos palancas es el error que más se repite en los
      problemas de aceros.

  - id: ejcm4-col41-seis-aleaciones-y-sus-fases
    titulo: Seis aleaciones, seis puntos del diagrama
    fuente: >-
      Ejercicio 4.1 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Cita las fases presentes y sus composiciones en las siguientes aleaciones:

      a) 85 % Sn - 15 % Pb a 150 °C. (Ver figura 1)

      b) 20 % Pb -80 % Mg a 400 °C. (Ver figura 2)

      c) 50 % Ag - 50 % Cu a 800 °C. (Ver figura 3)

      d) 2,12 kg Zn - 1,88 kg Cu a 500 °C. (Ver figura 4)

      e) 8,2 mol Ni y 4,3 mol Cu a 1250 °C. (Ver figura 5)

      f) 90 % Zn - 10 % Cu a 400 oC. (Ver figura 4)
    pide: >-
      Qué fases hay en cada una de las seis aleaciones y la composición de cada
      fase, en porcentaje en masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de leer ninguna línea: en el apartado b) el punto (20 % Pb,
          400 °C) cae dentro del campo α de la figura 2. ¿Qué composición
          tiene la fase α?
        opciones:
          - texto: >-
              La de la aleación, 20 % Pb, porque es la única fase que hay
            correcta: true
            mensaje: |
              Eso es. En un campo monofásico toda la aleación es esa fase, así
              que su composición es $C_0$. Las líneas del diagrama solo se
              leen cuando el punto cae en un campo de dos fases.
          - texto: >-
              La del solvus a 400 °C, unos 31,6 % Pb
            mensaje: |
              El solvus es el **límite** de plomo que α admite a 400 °C. Tu
              aleación tiene menos plomo que ese límite, y por eso está todo
              disuelto. El solvus se leería si el punto cayera en
              $\alpha + \text{Mg}_2\text{Pb}$.
          - texto: >-
              La mitad de la de la aleación, porque el plomo se reparte entre
              dos fases
            mensaje: |
              No hay dos fases entre las que repartir: a 400 °C y 20 % Pb solo
              hay α. El reparto, con la regla de la palanca, se hace en los
              campos bifásicos.

      - tipo: calcular
        titulo: La fase α del apartado a)
        pregunta: |
          A 150 °C, la aleación de 85 % Sn cae en el campo α + β de la figura
          1. ¿Qué composición tiene la fase α, en % Sn?
        respuesta:
          tipo: numero
          valor: '10.2'
          tolerancia: 2
          formato: un porcentaje en masa de Sn, sin el símbolo
        distractores:
          - valor: '18.3'
            mensaje: |
              Ese es el extremo de la isoterma eutéctica, a 183 °C. La
              composición de α cambia con la temperatura: a 150 °C el solvus
              está bastante más a la izquierda. La isoterma se traza a la
              temperatura del enunciado, no a la del rótulo más cercano.
          - valor: '85'
            mensaje: |
              Esa es la composición de la aleación, $C_0$. En un campo
              bifásico ninguna de las dos fases la tiene: la isoterma cruza el
              campo y cada fase está en uno de sus extremos.
        pista: |
          Traza la horizontal de 150 °C y síguela hacia la izquierda desde el
          punto hasta la primera línea que corte, que es el solvus de α.
        desarrollo: |
          La isoterma de 150 °C corta el solvus de α hacia el 10 % Sn y el de
          β hacia el 98 %:

          $$
          C_\alpha \approx 10\ \%\ \text{Sn} \qquad C_\beta \approx 98\ \%\ \text{Sn}
          $$

          El listado lee 12 y 99. Es la misma línea leída con menos detalle, y
          la casilla acepta las dos lecturas.

      - tipo: calcular
        titulo: El líquido del apartado c)
        pregunta: |
          A 800 °C, la aleación de 50 % Ag cae en el campo α + L de la figura
          3. ¿Qué composición tiene el líquido, en % Ag?
        respuesta:
          tipo: numero
          valor: '67.5'
          tolerancia: 1.5
          formato: un porcentaje en masa de Ag, sin el símbolo
        distractores:
          - valor: '50'
            mensaje: |
              Esa es la composición de la aleación. El líquido está en el
              extremo derecho de la isoterma, sobre el liquidus, y es bastante
              más rico en plata que la aleación.
          - valor: '76.7'
            mensaje: |
              La isoterma de 800 °C corta **dos** liquidus: el de α + L hacia
              el 67 % Ag y el de β + L hacia el 77 %. Tu punto está en α + L,
              así que el líquido está en el borde de ese campo, que es el
              primer corte a la derecha.
        pista: |
          Desde el punto (50 % Ag, 800 °C), ve hacia la derecha por la
          horizontal hasta la primera línea que toques.
        desarrollo: |
          Por la izquierda la isoterma toca el solidus de α en el 8 % Ag, y por
          la derecha el liquidus en el 67 %:

          $$
          C_\alpha \approx 8\ \%\ \text{Ag} \qquad C_L \approx 67\ \%\ \text{Ag}
          $$

          El listado lee 68.

      - tipo: calcular
        titulo: De kilos a porcentaje, apartado d)
        pregunta: |
          El eje de abajo de la figura 4 está en % en masa de Zn. ¿Qué
          composición tiene la aleación de 2,12 kg de Zn y 1,88 kg de Cu?
        respuesta:
          tipo: numero
          valor: '53'
          tolerancia: 0.5
          formato: un porcentaje en masa de Zn, sin el símbolo
        distractores:
          - valor: '47'
            mensaje: |
              Ese es el porcentaje de cobre. El eje de la figura 4 lleva el %
              de **Zn**, así que el punto hay que situarlo en 53, no en 47.
          - valor: '52.3'
            mensaje: |
              Has pasado a moles, y eso da el porcentaje **atómico** de Zn. El
              eje de abajo de la figura 4 está en % en masa; el de arriba, en %
              atómico, es otra escala. Con masas se divide masa entre masa.
        pista: |
          $C_0 = m_{\text{Zn}}/(m_{\text{Zn}} + m_{\text{Cu}})$, con las dos
          masas en la misma unidad.
        desarrollo: |
          $$
          C_0 = \frac{2{,}12}{2{,}12 + 1{,}88}\cdot 100 = \frac{2{,}12}{4{,}00}\cdot 100 = 53\ \%\ \text{Zn}
          $$

          A 500 °C ese punto cae en β + γ: la isoterma corta el borde de β
          hacia el 49 % Zn y el de γ hacia el 58 %.

      - tipo: calcular
        titulo: De moles a porcentaje en masa, apartado e)
        pregunta: |
          Con $M_{\text{Ni}} = 58{,}69\ \text{g/mol}$ y
          $M_{\text{Cu}} = 63{,}55\ \text{g/mol}$, ¿qué composición en % en
          masa de Ni tiene la aleación de 8,2 mol de Ni y 4,3 mol de Cu?
        respuesta:
          tipo: numero
          valor: '63.8'
          tolerancia: 0.5
          formato: un porcentaje en masa de Ni, sin el símbolo
        distractores:
          - valor: '65.6'
            mensaje: |
              Has dividido moles entre moles: $8{,}2/12{,}5$ es la fracción
              **atómica** de Ni. El eje que se usa es el de % en masa, y para
              llegar a él cada cantidad se multiplica por su masa molar antes
              de dividir.
          - valor: '36.2'
            mensaje: |
              Ese es el porcentaje de cobre. La figura 5 lleva en el eje el %
              en masa de **Ni**, que es el 63,8 %.
        pista: |
          Pasa cada cantidad a gramos, $m = n\,M$, y divide la masa de Ni
          entre la masa total.
        desarrollo: |
          $$
          m_{\text{Ni}} = 8{,}2\cdot 58{,}69 = 481{,}3\ \text{g}
          \qquad
          m_{\text{Cu}} = 4{,}3\cdot 63{,}55 = 273{,}3\ \text{g}
          $$

          $$
          C_0 = \frac{481{,}3}{481{,}3 + 273{,}3}\cdot 100 = 63{,}8\ \%\ \text{Ni}
          $$

      - tipo: reconocer
        pregunta: |
          Con 63,8 % Ni y 1250 °C, ¿dónde cae el punto en la figura 5?
        opciones:
          - texto: >-
              En el campo α: a 1250 °C el solidus está hacia el 44 % Ni, y la
              aleación tiene más níquel que eso
            correcta: true
            mensaje: |
              Eso es. A 1250 °C todo lo que tenga más de un 44 % Ni ya es
              sólido. Hay una sola fase, α, con la composición de la aleación:
              $C_\alpha = 63{,}8\ \%$ Ni.
          - texto: >-
              En α + L, porque 1250 °C está entre la fusión del cobre, 1085 °C,
              y la del níquel, 1453 °C
            mensaje: |
              Estar entre las dos temperaturas de fusión no basta. Cada
              composición funde entre su solidus y su liquidus, y con 63,8 % Ni
              el solidus está hacia 1320 °C: a 1250 °C todavía no ha empezado
              a fundir.
          - texto: >-
              En el líquido, porque a 1250 °C el cobre ya está fundido
            mensaje: |
              El cobre puro funde a 1085 °C, pero aquí no hay cobre puro: hay
              una disolución sólida con un 63,8 % de níquel, que no empieza a
              fundir hasta su solidus.

      - tipo: justificar
        pregunta: Ordena la lectura de los seis apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              Antes de situar d) y e) en su figura, las masas y los moles se
              pasan a % en masa, que es la escala del eje de abajo: 53 % Zn y
              63,8 % Ni.
          - texto: >-
              En b) y en e) el punto cae en un campo monofásico, α, y la fase
              tiene la composición de la aleación.
          - texto: >-
              En a), c), d) y f) cae en un campo bifásico, y las dos
              composiciones se leen donde la isoterma corta los bordes de ese
              campo.
          - texto: >-
              En f) las dos fases, ε y η, tienen el 90 % de Zn de la aleación,
              repartido entre las dos.
            trampa: true
            mensaje: |
              En un campo bifásico ninguna fase tiene la composición de la
              aleación. ε está en el 87 % Zn y η en el 97 %; lo que vale 90 es
              la media de las dos pesada con sus fracciones de masa, que es lo
              que pide el problema 4.5.
    resolucion: |
      **Cómo se lee cada punto.** Se sitúa el punto (composición,
      temperatura). Si cae en un campo de una fase, esa fase tiene la
      composición de la aleación. Si cae en uno de dos, se traza la
      horizontal y las composiciones son los dos cortes con los bordes del
      campo. Antes, d) y e) hay que pasarlos a % en masa:

      $$
      C_0^{(d)} = \frac{2{,}12}{4{,}00}\cdot 100 = 53\ \%\ \text{Zn}
      \qquad
      C_0^{(e)} = \frac{8{,}2\cdot 58{,}69}{8{,}2\cdot 58{,}69 + 4{,}3\cdot 63{,}55}\cdot 100 = 63{,}8\ \%\ \text{Ni}
      $$

      | | aleación | T | campo | composiciones |
      |---|---|---|---|---|
      | a) | 85 % Sn | 150 °C | α + β | $C_\alpha \approx 10$ % Sn, $C_\beta \approx 98$ % Sn |
      | b) | 20 % Pb | 400 °C | α | $C_\alpha = 20$ % Pb |
      | c) | 50 % Ag | 800 °C | α + L | $C_\alpha \approx 8$ % Ag, $C_L \approx 67$ % Ag |
      | d) | 53 % Zn | 500 °C | β + γ | $C_\beta \approx 49$ % Zn, $C_\gamma \approx 58$ % Zn |
      | e) | 63,8 % Ni | 1250 °C | α | $C_\alpha = 63{,}8$ % Ni |
      | f) | 90 % Zn | 400 °C | ε + η | $C_\varepsilon \approx 87$ % Zn, $C_\eta \approx 97$ % Zn |

      En b), el solvus de α a 400 °C está hacia el 31,6 % Pb: con 20 % el
      plomo cabe entero. En e), el solidus a 1250 °C está hacia el 44 % Ni, y
      con 63,8 % la aleación es sólida. En f), el punto está por debajo de la
      isoterma de 424 °C, que es la que separa ε + L de ε + η.

      **Contra el listado.** Las fases coinciden en los seis apartados. Las
      composiciones difieren solo en la lectura: en a) el listado da 12 y 99
      donde se lee 10 y 98; en c), 68 donde se lee 67; en d), 57 donde se lee
      58; y en e) redondea 63,8 a 64. Son diferencias de leer a ojo un
      diagrama de este tamaño, y las casillas aceptan las dos.

      **Lo que hay que llevarse.** La composición de una fase solo coincide
      con la de la aleación cuando no hay otra fase. En cuanto hay dos, cada
      una está en un extremo de la isoterma, y la aleación, en medio.

  - id: ejcm4-col42-un-laton-que-se-enfria
    titulo: Un latón de 74 % Zn que se enfría
    fuente: >-
      Ejercicio 4.2 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      ¿Qué fases y cuál es la composición de las fases al enfriar una aleación:
      74 % Zn - 26 % Cu a 850, 750, 680 y 500 °C? (Ver figura 4).
    pide: Las fases y sus composiciones a cada una de las cuatro temperaturas.
    pasos:
      - tipo: reconocer
        pregunta: |
          A 850 °C, ¿qué hay en la aleación de 74 % Zn?
        opciones:
          - texto: >-
              Solo líquido, con el 74 % de Zn de la aleación
            correcta: true
            mensaje: |
              Eso es. El liquidus de esta composición está hacia 770 °C, y por
              encima de él todo es líquido. Una sola fase: su composición es
              la de la aleación.
          - texto: >-
              γ + L
            mensaje: |
              γ + L empieza al cruzar el liquidus, hacia 770 °C para un 74 %
              de Zn. A 850 °C todavía no ha aparecido ningún sólido.
          - texto: >-
              β + L, porque la figura tiene un campo β + L a esa temperatura
            mensaje: |
              La franja β + L de 850 °C está entre el 53 y el 59 % de Zn, muy a
              la izquierda. Un campo se lee en la vertical de tu composición,
              no a la altura de la temperatura suelta.

      - tipo: calcular
        titulo: El líquido a 750 °C
        pregunta: |
          A 750 °C la aleación está en γ + L. ¿Qué composición tiene el
          líquido, en % Zn?
        respuesta:
          tipo: numero
          valor: '76'
          tolerancia: 1.5
          formato: un porcentaje en masa de Zn, sin el símbolo
        distractores:
          - valor: '74'
            mensaje: |
              Esa es la composición de la aleación. Con dos fases, ninguna la
              tiene: el líquido está en el liquidus, a la derecha del punto.
          - valor: '67.5'
            mensaje: |
              Ese es el extremo de γ, el de la izquierda. El líquido es la
              fase rica en zinc, que funde a menos temperatura, y está en el
              extremo derecho de la isoterma.
        pista: |
          Traza la horizontal de 750 °C. Por la izquierda toca el borde de γ;
          por la derecha, el liquidus.
        desarrollo: |
          $$
          C_\gamma \approx 67{,}5\ \%\ \text{Zn} \qquad C_L \approx 76\ \%\ \text{Zn}
          $$

          El listado lee 68 y 76.

      - tipo: reconocer
        pregunta: |
          Al bajar de 750 a 680 °C, la vertical de 74 % Zn cruza la isoterma
          de 700 °C. ¿En qué campo queda a 680 °C?
        opciones:
          - texto: >-
              δ + L
            correcta: true
            mensaje: |
              Eso es. A 700 °C el γ y el líquido reaccionan y dan δ: es la
              reacción peritéctica $\gamma + L \rightarrow \delta$. Con 74 % Zn
              sobra líquido, y el punto queda a la derecha del campo δ, en
              δ + L.
          - texto: >-
              γ + δ
            mensaje: |
              γ + δ está a la izquierda, entre el 70 y el 73 % de Zn. Con 74 %
              el punto está al otro lado del campo δ: el γ se ha consumido en
              la reacción, y lo que queda junto a δ es líquido.
          - texto: >-
              γ + L, como a 750 °C
            mensaje: |
              γ + L termina en la isoterma de 700 °C. Al cruzarla, el γ
              reacciona con el líquido, y por debajo ya no queda γ para esta
              composición.

      - tipo: calcular
        titulo: El líquido a 680 °C
        pregunta: |
          A 680 °C, en δ + L, ¿qué composición tiene el líquido, en % Zn?
        respuesta:
          tipo: numero
          valor: '82.2'
          tolerancia: 1.5
          formato: un porcentaje en masa de Zn, sin el símbolo
        distractores:
          - valor: '69.6'
            mensaje: |
              Ese es el borde de γ a 680 °C: has leído como si el punto
              estuviera en γ + δ. Con 74 % Zn está a la derecha del campo δ, y
              la otra fase es el líquido, en el liquidus.
          - valor: '74'
            mensaje: |
              Esa es la composición de la aleación, que por casualidad es casi
              la de δ. El líquido está en el otro extremo de la isoterma, sobre
              el liquidus.
        pista: |
          La isoterma de 680 °C, desde el punto hacia la derecha, cruza el
          campo δ + L hasta el liquidus.
        desarrollo: |
          $$
          C_\delta \approx 73{,}5\ \%\ \text{Zn} \qquad C_L \approx 82\ \%\ \text{Zn}
          $$

          El punto está pegado al borde de δ, así que casi todo es δ: la
          palanca da $W_L = (74 - 73{,}5)/(82{,}2 - 73{,}5) \approx 0{,}05$.

      - tipo: calcular
        titulo: La fase ε a 500 °C
        pregunta: |
          A 500 °C la aleación está en γ + ε. ¿Qué composición tiene la fase
          ε, en % Zn?
        respuesta:
          tipo: numero
          valor: '78.4'
          tolerancia: 1.5
          formato: un porcentaje en masa de Zn, sin el símbolo
        distractores:
          - valor: '74'
            mensaje: |
              Esa es la composición de la aleación. En γ + ε las dos fases
              están en los extremos de la isoterma: γ a la izquierda del punto
              y ε a la derecha.
          - valor: '84.7'
            mensaje: |
              Has cruzado el campo ε entero y has leído su otro borde, el que
              da a ε + L. La composición de ε en γ + ε es la del borde que toca
              tu campo, el primero a la derecha del punto.
        pista: |
          A 500 °C, desde 74 % Zn hacia la derecha, la primera línea es el
          borde del campo ε.
        desarrollo: |
          $$
          C_\gamma \approx 69\ \%\ \text{Zn} \qquad C_\varepsilon \approx 78\ \%\ \text{Zn}
          $$

          Son los dos valores del listado.

      - tipo: justificar
        pregunta: Ordena lo que le pasa a la aleación al enfriarse. Una pieza es falsa.
        piezas:
          - texto: >-
              A 850 °C todo es líquido, con el 74 % de Zn de la aleación.
          - texto: >-
              Al cruzar el liquidus, hacia 770 °C, aparece γ; a 750 °C hay γ
              con 68 % Zn y líquido con 76 %.
          - texto: >-
              A 700 °C, γ y líquido dan δ; a 680 °C hay δ con 74 % Zn y un poco
              de líquido con 82 %.
          - texto: >-
              A 500 °C, tras la reacción eutectoide de 560 °C, hay γ con 69 %
              Zn y ε con 78 %.
          - texto: >-
              A 500 °C todavía queda algo del líquido de 82 % Zn, porque el
              líquido rico en zinc es el último en solidificar.
            trampa: true
            mensaje: |
              Con 74 % Zn el último líquido desaparece hacia 666 °C, al
              cruzar el borde del campo δ. Entre esa temperatura y 560 °C todo
              es δ, y a 560 °C δ se descompone en γ + ε. A 500 °C la aleación
              es sólida entera.
    resolucion: |
      Se baja por la vertical de 74 % Zn en la figura 4 y, a cada
      temperatura, se mira en qué campo cae el punto.

      **850 °C.** Por encima del liquidus, que para esta composición está
      hacia 770 °C. Una fase: líquido con $C_L = 74\ \%$ Zn.

      **750 °C.** Campo γ + L. La isoterma toca el borde de γ y el liquidus:

      $$
      C_\gamma \approx 68\ \%\ \text{Zn} \qquad C_L \approx 76\ \%\ \text{Zn}
      $$

      **680 °C.** A 700 °C se ha cruzado la isoterma peritéctica,
      $\gamma + L \rightarrow \delta$, y como la aleación está a la derecha
      del δ que se forma, sobra líquido. Campo δ + L:

      $$
      C_\delta \approx 73{,}5\ \%\ \text{Zn} \qquad C_L \approx 82\ \%\ \text{Zn}
      $$

      El listado escribe $C_\delta = 74\ \%$: el borde de δ está a medio punto
      de la aleación, y por eso casi toda ella es δ.

      **500 °C.** Por debajo de la isoterma eutectoide de 560 °C,
      $\delta \rightarrow \gamma + \varepsilon$. Campo γ + ε:

      $$
      C_\gamma \approx 69\ \%\ \text{Zn} \qquad C_\varepsilon \approx 78\ \%\ \text{Zn}
      $$

      Las cuatro temperaturas coinciden con el listado.

      **Lo que hay que llevarse.** En un diagrama con fases intermedias, cada
      campo bifásico está encajado entre dos monofásicos, y sus dos fases son
      siempre las de esos dos vecinos. Mirar qué hay a cada lado del punto en
      la horizontal dice qué dos fases hay, antes de leer ningún número.

  - id: ejcm4-col43-resistente-y-ductil-a-la-vez
    titulo: Un cobre-níquel resistente y dúctil a la vez
    fuente: >-
      Ejercicio 4.3 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se intenta fabricar una aleación cobre-níquel con una resistencia a la
      tracción mínima de $350\ \text{MPa}$ (50,750 psi) y una ductilidad del
      48 % EL. ¿Es posible? En caso afirmativo, ¿cuál debe ser la
      composición? En caso negativo, ¿por qué?
    pide: Si hay una composición que cumpla las dos condiciones, y cuál es.
    pasos:
      - tipo: reconocer
        pregunta: |
          La resistencia tiene un máximo hacia el 60 % de Ni y la ductilidad un
          mínimo hacia el 55 %. ¿Qué hay que hacer con las dos curvas?
        opciones:
          - texto: >-
              Buscar en cada curva el tramo que cumple su condición y quedarse
              con la composición que está en los dos a la vez
            correcta: true
            mensaje: |
              Eso es. Cada condición deja un conjunto de composiciones, y la
              respuesta es la intersección. Si no hay, no es posible; si la
              hay, esa es la composición.
          - texto: >-
              Nada: como la resistencia es máxima donde la ductilidad es
              mínima, las dos condiciones son incompatibles
            mensaje: |
              Es verdad en el centro del diagrama, pero no en los extremos. La
              ductilidad vuelve a subir hacia el níquel puro, y ahí la
              resistencia sigue por encima de 350 MPa casi hasta el final.
          - texto: >-
              Elegir la composición de máxima resistencia, 60 % de Ni, que es
              la que más margen da
            mensaje: |
              Da margen en resistencia y ninguno en ductilidad: con un 60 % de
              Ni el alargamiento es de un 30 %, muy lejos del 48 %.

      - tipo: calcular
        titulo: El tramo dúctil del lado del cobre
        pregunta: |
          Por el lado del cobre, ¿hasta qué porcentaje de Ni se mantiene la
          ductilidad en el 48 % o más?
        respuesta:
          tipo: numero
          valor: '8.3'
          tolerancia: 1.5
          formato: un porcentaje de níquel, sin el símbolo
        distractores:
          - valor: '24'
            mensaje: |
              Ese es el corte de la **otra** curva: la resistencia llega a
              350 MPa con un 24 % de Ni. La ductilidad se lee en la gráfica de
              la derecha.
          - valor: '98'
            mensaje: |
              Ese es el tramo del lado del níquel, donde la ductilidad vuelve a
              pasar del 48 %. Aquí se pide el del lado del cobre, a la
              izquierda.
        pista: |
          En la gráfica de la ductilidad, sigue la línea del 48 % desde la
          izquierda hasta que la curva la corte.
        desarrollo: |
          La curva de la ductilidad baja del 48 % hacia un 8 % de Ni. Ahí la
          resistencia es de unos 280 MPa, muy por debajo de 350: por el lado
          del cobre no hay ninguna composición que cumpla las dos.

      - tipo: calcular
        titulo: La composición
        pregunta: |
          ¿Qué composición cumple a la vez los 350 MPa y el 48 % de
          alargamiento?
        respuesta:
          tipo: numero
          valor: '98'
          tolerancia: 1
          formato: un porcentaje de níquel, sin el símbolo
        distractores:
          - valor: '24'
            mensaje: |
              Con un 24 % de Ni la resistencia llega justo a 350 MPa, pero la
              ductilidad es de un 38 %. Cumple una condición y no la otra.
          - valor: '8'
            mensaje: |
              Con un 8 % de Ni la ductilidad llega al 48 %, pero la
              resistencia se queda en unos 280 MPa. Por el lado del cobre no
              hay solape.
          - valor: '60'
            mensaje: |
              Es el máximo de la resistencia, y a la vez casi el mínimo de la
              ductilidad, un 30 %. Es la peor composición para esta pareja de
              condiciones.
        pista: |
          Mira el extremo del níquel: ¿hasta dónde llega la resistencia por
          encima de 350 MPa, y desde dónde pasa la ductilidad del 48 %?
        desarrollo: |
          La resistencia se mantiene por encima de 350 MPa hasta un 98,5 % de
          Ni, y la ductilidad pasa del 48 % desde un 98 %. Las dos se cumplen
          en la franja entre 98 y 98,5 %: $C_0 \approx 98\ \%$ Ni.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La resistencia pasa de 350 MPa entre un 24 % y un 98,5 % de Ni.
          - texto: >-
              La ductilidad llega al 48 % solo en los extremos: por debajo de un
              8 % de Ni o por encima de un 98 %.
          - texto: >-
              Por el lado del cobre no hay solape: con un 8 % de Ni la
              resistencia es de unos 280 MPa.
          - texto: >-
              Por el lado del níquel las dos se cumplen entre un 98 % y un
              98,5 % de Ni: es posible, con C₀ ≈ 98 % Ni.
          - texto: >-
              La máxima resistencia cae donde la ductilidad es mínima, así que
              no es posible.
            trampa: true
            mensaje: |
              Eso es cierto en el centro del diagrama, pero descarta demasiado
              pronto. Hacia el níquel puro la ductilidad vuelve a subir,
              mientras la resistencia baja despacio y todavía está en 350 MPa
              con un 98,5 % de Ni.
    resolucion: |
      Las dos curvas son las de la figura «Resistencia y ductilidad del
      cobre-níquel según la composición», de este tema.

      **Lo que deja cada condición.**

      - Resistencia de al menos 350 MPa: entre un **24 %** y un **98,5 %**
        de Ni. La curva tiene su máximo, unos 420 MPa, hacia el 60 %.
      - Ductilidad de al menos un 48 %: solo en los extremos, por debajo de
        un **8 %** de Ni o por encima de un **98 %**. En el centro baja hasta
        un 30 %.

      **La intersección.** Por el lado del cobre no hay solape: con un 8 % de
      Ni la resistencia es de unos 280 MPa. Por el lado del níquel, las dos se
      cumplen en una franja estrecha, entre 98 y 98,5 % de Ni.

      **Respuesta: sí es posible, con $C_0 \approx 98\ \%$ Ni**, como da el
      listado. La franja es de medio punto, así que en la práctica la
      composición está muy ajustada.

      Los 50,750 psi del enunciado llevan la coma de millar a la inglesa: son
      cincuenta mil setecientos cincuenta psi, el equivalente de 350 MPa.

  - id: ejcm4-col44-un-liquido-y-un-solido-que-no-casan
    titulo: Un líquido y un sólido que no pueden estar juntos
    fuente: >-
      Ejercicio 4.4 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En una aleación cobre-níquel, ¿es posible tener en equilibrio una fase
      líquida de composición 80 % Cu - 20 % Ni y una fase α de composición
      37 % Ni - 63 % Cu? En caso afirmativo, ¿a qué temperatura? En caso
      negativo, ¿por qué? (Ver figura 5).
    pide: Si ese líquido y esa fase α pueden coexistir y, si no, por qué.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tienen que cumplir las composiciones de un líquido y un sólido
          para estar en equilibrio en la región α + L?
        opciones:
          - texto: >-
              Ser los dos extremos de la misma isoterma: el líquido sobre el
              liquidus y el sólido sobre el solidus, a la misma temperatura
            correcta: true
            mensaje: |
              Eso es. A cada temperatura hay **una** pareja posible. Fijar la
              composición del líquido fija la temperatura, y con ella la
              composición del sólido.
          - texto: >-
              Que el sólido tenga más níquel que el líquido
            mensaje: |
              Es necesario —el sólido siempre es más rico en el metal que funde
              más alto— pero no suficiente. Hay infinitas parejas así, y solo
              una por temperatura está en equilibrio.
          - texto: >-
              Que la aleación quede entre las dos composiciones
            mensaje: |
              Eso lo necesita la regla de la palanca para que las dos
              fracciones salgan positivas, pero no dice si las dos fases pueden
              coexistir. Primero va el equilibrio; las cantidades, después.

      - tipo: calcular
        titulo: La temperatura del líquido de 20 % Ni
        pregunta: |
          ¿A qué temperatura está en el liquidus un líquido de 20 % Ni?
        respuesta:
          tipo: magnitud
          valor: '1193 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '1159 °C'
            mensaje: |
              Has leído el **solidus** en 20 % Ni. Esa es la temperatura a la
              que un sólido de 20 % Ni empieza a fundir; el líquido de esa
              composición vive en la línea de arriba, el liquidus.
          - valor: '1222 °C'
            mensaje: |
              Esa es la temperatura de la otra fase: la del sólido de 37 % Ni
              sobre el solidus. Si las dos fases estuvieran en equilibrio, las
              dos temperaturas coincidirían, y no coinciden.
        pista: |
          Sube por la vertical de 20 % Ni hasta la primera línea, la de
          arriba.
        desarrollo: |
          La vertical de 20 % Ni corta el liquidus hacia 1193 °C:

          $$
          T \approx 1193\ ^{\circ}\text{C}
          $$

      - tipo: calcular
        titulo: El sólido que acompaña a ese líquido
        pregunta: |
          A esa temperatura, ¿qué composición tiene la fase α en equilibrio con
          el líquido, en % Ni?
        respuesta:
          tipo: numero
          valor: '29.2'
          tolerancia: 1.5
          formato: un porcentaje en masa de Ni, sin el símbolo
        distractores:
          - valor: '37'
            mensaje: |
              Ese es el sólido del enunciado, y es justo lo que hay que
              comprobar, no un dato de partida. A 1193 °C el solidus no pasa
              por 37 % Ni.
          - valor: '20'
            mensaje: |
              Esa es la composición del líquido. El sólido está en el otro
              extremo de la isoterma, sobre el solidus, con más níquel.
        pista: |
          Traza la horizontal de 1193 °C y léela donde corta el solidus.
        desarrollo: |
          $$
          C_\alpha (1193\ ^{\circ}\text{C}) \approx 29\ \%\ \text{Ni} \neq 37\ \%\ \text{Ni}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un líquido de 20 % Ni solo puede estar en equilibrio con un
              sólido a la temperatura en que su composición está en el
              liquidus, unos 1193 °C.
          - texto: >-
              A 1193 °C el solidus pasa por el 29 % Ni: esa es la única α que
              puede acompañar a ese líquido.
          - texto: >-
              Visto desde el sólido: una α de 37 % Ni está en el solidus hacia
              1222 °C, y ahí el líquido tiene un 26 % Ni, no un 20 %.
          - texto: >-
              Luego no es posible: las dos composiciones no son extremos de la
              misma isoterma.
          - texto: >-
              Es posible a una temperatura intermedia, hacia 1208 °C, entre la
              del líquido y la del sólido.
            trampa: true
            mensaje: |
              A 1208 °C el líquido de equilibrio tiene un 23 % Ni y el sólido
              un 33 %: ninguno de los dos es el del enunciado. En una región
              bifásica de un sistema binario, a presión fija, la temperatura
              decide las dos composiciones a la vez, y no hay temperatura que
              dé la pareja 20 y 37.
    resolucion: |
      **La condición.** En la región α + L, el líquido y el sólido en
      equilibrio son los dos extremos de una misma isoterma. Dar la
      composición de uno fija la temperatura, y la temperatura fija la del
      otro.

      **Desde el líquido.** Un líquido de 20 % Ni está en el liquidus hacia
      1193 °C. A esa temperatura el solidus está en:

      $$
      C_\alpha \approx 29\ \%\ \text{Ni}
      $$

      **Desde el sólido**, para comprobarlo. Una α de 37 % Ni está en el
      solidus hacia 1222 °C, y a esa temperatura el liquidus está en el 26 %
      Ni, no en el 20 %.

      Por los dos lados sale lo mismo: **no es posible**. El líquido de 20 %
      Ni pide una α de 29 % Ni, que es el resultado del listado.

      **Lo que hay que llevarse.** En un campo bifásico las composiciones de
      las fases no son libres: la isoterma las ata. Lo que cambia con la
      composición de la aleación son las **cantidades** de cada fase, nunca
      sus composiciones.

  - id: ejcm4-col45-las-fracciones-de-las-seis-aleaciones
    titulo: Cuánto hay de cada fase en las seis aleaciones
    fuente: >-
      Ejercicio 4.5 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Determina las cantidades relativas (fracciones de masa) de las fases
      presentes en las aleaciones y temperaturas del problema 4.1.
    pide: >-
      Las fracciones de masa de las fases en las seis aleaciones del 4.1, que
      son a) 85 % Sn a 150 °C, b) 20 % Pb a 400 °C, c) 50 % Ag a 800 °C,
      d) 2,12 kg de Zn con 1,88 kg de Cu a 500 °C, e) 8,2 mol de Ni con
      4,3 mol de Cu a 1250 °C y f) 90 % Zn a 400 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          En un campo α + β, la isoterma corta en $C_\alpha$ y $C_\beta$ y la
          aleación está en $C_0$. ¿Cuál es la fracción de masa de α?
        opciones:
          - texto: >-
              $W_\alpha = (C_\beta - C_0)/(C_\beta - C_\alpha)$
            correcta: true
            mensaje: |
              Eso es. El segmento **opuesto**: el que va desde $C_0$ hasta el
              extremo de β. Cuanto más cerca está el punto de α, más largo es
              ese segmento y más α hay.
          - texto: >-
              $W_\alpha = (C_0 - C_\alpha)/(C_\beta - C_\alpha)$
            mensaje: |
              Ese es el segmento del lado de α, y da la fracción de **β**. Es
              el error más repetido del tema: si el punto estuviera encima de
              $C_\alpha$, esta fórmula daría cero α, justo al revés.
          - texto: >-
              $W_\alpha = C_0/100$
            mensaje: |
              Eso confunde composición con cantidad. $C_0$ dice cuánto de un
              componente tiene la aleación, no cuánto de cada fase hay. Las
              fracciones de las fases salen de dónde está $C_0$ **dentro** de
              la isoterma.

      - tipo: reconocer
        pregunta: |
          En los apartados b) y e) el punto cae en el campo α. ¿Cuánto vale
          $W_\alpha$?
        opciones:
          - texto: >-
              1: toda la aleación es α
            correcta: true
            mensaje: |
              Eso es. Con una sola fase no hay isoterma que cortar ni palanca
              que aplicar: la fracción de esa fase es la unidad.
          - texto: >-
              La palanca entre la aleación y el solvus
            mensaje: |
              La palanca necesita dos fases en los extremos. El solvus es un
              borde del campo α, no una fase que coexista con tu punto: a
              400 °C y 20 % Pb no hay $\text{Mg}_2\text{Pb}$.
          - texto: >-
              0,2 en b) y 0,64 en e), las composiciones de las aleaciones
            mensaje: |
              Otra vez composición en lugar de cantidad. Que la aleación tenga
              un 20 % de Pb no dice nada de cuánta α hay: hay toda.

      - tipo: calcular
        titulo: La fracción de α en el apartado a)
        pregunta: |
          A 150 °C la isoterma corta en $C_\alpha \approx 10\ \%$ Sn y
          $C_\beta \approx 98\ \%$ Sn, y la aleación tiene 85 % Sn. ¿Cuánto
          vale $W_\alpha$?
        respuesta:
          tipo: numero
          valor: '0.155'
          tolerancia: 0.03
          formato: una fracción de masa, entre 0 y 1
        distractores:
          - valor: '0.85'
            mensaje: |
              Has usado el segmento del lado de α, y eso da $W_\beta$. El punto
              está muy cerca de β, así que casi todo es β y muy poco α: la
              fracción de α es el segmento corto, de 85 a 98.
          - valor: '0.945'
            mensaje: |
              Has puesto $C_0 = 15$, que es el porcentaje de **Pb**. El eje de
              la figura 1 va en % de Sn, y en esa escala la aleación está en el
              85: las tres composiciones de la palanca tienen que estar en la
              misma escala.
        pista: |
          $W_\alpha = (C_\beta - C_0)/(C_\beta - C_\alpha)$.
        desarrollo: |
          $$
          W_\alpha = \frac{98{,}1 - 85}{98{,}1 - 10{,}2} = 0{,}15
          \qquad
          W_\beta = 1 - W_\alpha = 0{,}85
          $$

          Con las lecturas del listado, 12 y 99, sale 0,16. Las dos entran en
          la casilla.

      - tipo: calcular
        titulo: La fracción de líquido en el apartado c)
        pregunta: |
          A 800 °C, con $C_\alpha \approx 8\ \%$ Ag, $C_L \approx 67\ \%$ Ag y
          $C_0 = 50\ \%$ Ag, ¿cuánto vale $W_L$?
        respuesta:
          tipo: numero
          valor: '0.705'
          tolerancia: 0.03
          formato: una fracción de masa, entre 0 y 1
        distractores:
          - valor: '0.295'
            mensaje: |
              Has cogido el segmento del lado del líquido, y eso da $W_\alpha$.
              El punto está más cerca del líquido que de α, así que hay más
              líquido: la fracción de L es el segmento largo, de 8 a 50.
          - valor: '0.5'
            mensaje: |
              Has tomado la composición como cantidad: que la aleación tenga
              un 50 % de plata no significa que la mitad sea líquida.
        pista: |
          $W_L = (C_0 - C_\alpha)/(C_L - C_\alpha)$: el segmento del lado de
          α.
        desarrollo: |
          $$
          W_L = \frac{50 - 8{,}2}{67{,}1 - 8{,}2} = 0{,}71
          \qquad
          W_\alpha = 0{,}29
          $$

          El listado, con 8 y 68, da 0,70 y 0,30.

      - tipo: calcular
        titulo: La fracción de ε en el apartado f)
        pregunta: |
          A 400 °C, con $C_\varepsilon \approx 87\ \%$ Zn,
          $C_\eta \approx 97\ \%$ Zn y $C_0 = 90\ \%$ Zn, ¿cuánto vale
          $W_\varepsilon$?
        respuesta:
          tipo: numero
          valor: '0.71'
          tolerancia: 0.03
          formato: una fracción de masa, entre 0 y 1
        distractores:
          - valor: '0.29'
            mensaje: |
              Ese es el segmento del lado de ε, que da $W_\eta$. El punto está
              más cerca de ε, así que hay más ε: su fracción es el segmento de
              90 a 97.
          - valor: '0.072'
            mensaje: |
              Has dividido entre 97, la composición de η, en lugar de entre la
              longitud de la isoterma, $97 - 87$. El denominador de la palanca
              es siempre la distancia entre las dos fases.
        pista: |
          $W_\varepsilon = (C_\eta - C_0)/(C_\eta - C_\varepsilon)$.
        desarrollo: |
          $$
          W_\varepsilon = \frac{97{,}0 - 90}{97{,}0 - 87{,}2} = 0{,}71
          \qquad
          W_\eta = 0{,}29
          $$

          El listado, con 87 y 97, da 0,70 y 0,30.

      - tipo: justificar
        pregunta: Ordena la palanca del apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              La aleación tiene 53 % Zn, y a 500 °C la isoterma corta el borde
              de β hacia el 49 % Zn y el de γ hacia el 58 %.
          - texto: >-
              La fracción de β es el segmento opuesto, del punto a γ:
              $W_\beta = (57{,}7 - 53)/(57{,}7 - 49{,}2) \approx 0{,}55$.
          - texto: >-
              $W_\gamma = 1 - W_\beta \approx 0{,}45$, y el balance de zinc
              cierra: $0{,}55\cdot 49{,}2 + 0{,}45\cdot 57{,}7 \approx 53$.
          - texto: >-
              Como el punto está más cerca del borde de β, la fracción de β es
              la pequeña: el segmento corto va con la fase de ese lado.
            trampa: true
            mensaje: |
              Es al revés. El punto siempre está más cerca de la fase que más
              abunda, y la fracción de β es el segmento opuesto, de 53 a 57,7,
              que es el largo.
    resolucion: |
      **La regla de la palanca.** En un campo bifásico, la fracción de cada
      fase es el segmento de isoterma **opuesto** a ella, dividido entre la
      isoterma entera:

      $$
      W_\alpha = \frac{C_\beta - C_0}{C_\beta - C_\alpha}
      \qquad
      W_\beta = \frac{C_0 - C_\alpha}{C_\beta - C_\alpha}
      $$

      En un campo monofásico no hay palanca: la fracción de esa fase es 1.
      Con las composiciones del 4.1:

      | | campo | isoterma | fracciones | listado |
      |---|---|---|---|---|
      | a) | α + β | 10,2 y 98,1 % Sn | $W_\alpha = 0{,}15$, $W_\beta = 0{,}85$ | 0,16 y 0,84 |
      | b) | α | | $W_\alpha = 1$ | 1,00 |
      | c) | α + L | 8,2 y 67,1 % Ag | $W_\alpha = 0{,}29$, $W_L = 0{,}71$ | 0,30 y 0,70 |
      | d) | β + γ | 49,2 y 57,7 % Zn | $W_\beta = 0{,}55$, $W_\gamma = 0{,}45$ | 0,50 y 0,50 |
      | e) | α | | $W_\alpha = 1$ | 1,00 |
      | f) | ε + η | 87,2 y 97,0 % Zn | $W_\varepsilon = 0{,}71$, $W_\eta = 0{,}29$ | 0,70 y 0,30 |

      **Contra el listado.** Coinciden todas salvo d), y ahí la diferencia es
      de lectura. El listado lee la isoterma en 49 y 57, y con eso sale
      exactamente mitad y mitad; leída con más detalle va de 49,2 a 57,7 y da
      0,55 y 0,45. La isoterma de d) mide solo ocho puntos y medio, así que un
      punto de diferencia al leer un borde mueve la fracción en una décima.
      Por eso d) no tiene casilla propia: cualquier cosa entre 0,50 y 0,55 es
      una lectura honrada de la figura.

      **Lo que hay que llevarse.** El punto está siempre más cerca de la fase
      que más abunda. Si al terminar la palanca la fase cercana te sale
      pequeña, has cambiado los segmentos.

  - id: ejcm4-col46-fundir-la-mitad-de-una-soldadura
    titulo: Fundir la mitad de un plomo-estaño, por dos caminos
    fuente: >-
      Ejercicio 4.6 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una muestra de 2 kg de una aleación 85 % Pb - 15 % Sn se calienta a
      200 °C, temperatura a la cual se encuentra totalmente como disolución
      sólida en fase α (figura 1). La aleación debe ser fundida de modo que el
      50 % de la muestra sea líquida y el 50 % restante permanezca como fase α
      sólida. Esto puede conseguirse calentando la aleación o modificando la
      composición manteniendo constante la temperatura.

      a) ¿A qué temperatura se debe calentar la probeta?

      b) ¿Cuánto estaño se debe añadir a 2 kg de muestra a 200 °C para
      conseguir este estado?
    pide: La temperatura del apartado a) y la masa de estaño que hay que añadir en el b).
    pasos:
      - tipo: reconocer
        pregunta: |
          Mitad líquido y mitad α. ¿Qué dice eso de la isoterma?
        opciones:
          - texto: >-
              Que la aleación está justo en el punto medio de la isoterma:
              $C_0 = (C_\alpha + C_L)/2$
            correcta: true
            mensaje: |
              Eso es. Si los dos segmentos de la palanca miden lo mismo, las
              dos fracciones valen 0,5. Se busca la isoterma cuyo punto medio
              es la composición de la aleación.
          - texto: >-
              Que la temperatura está a medio camino entre el solidus y el
              liquidus de la aleación
            mensaje: |
              La palanca mide distancias en **composición**, a lo largo de la
              horizontal, no en temperatura. Solidus y liquidus no son rectas
              paralelas, y la media de sus temperaturas no da mitad y mitad.
          - texto: >-
              Que el líquido tiene la mitad de estaño que la aleación
            mensaje: |
              Es al revés en los dos sentidos: el líquido tiene **más**
              estaño que la aleación, y la mitad es la cantidad de cada fase,
              no su composición.

      - tipo: calcular
        titulo: La temperatura del apartado a)
        pregunta: |
          ¿A qué temperatura hay que calentar la aleación de 15 % Sn para que
          sea mitad líquido y mitad α?
        respuesta:
          tipo: magnitud
          valor: '279 °C'
          tolerancia: 0.009
          formato: una temperatura, con su unidad
        distractores:
          - valor: '262 °C'
            mensaje: |
              Esa es la media entre el solidus, 235 °C, y el liquidus, 289 °C,
              de la aleación. La palanca no reparte temperaturas sino
              composiciones: a 262 °C la isoterma va de 12,6 a 27 % Sn y solo
              hay un 17 % de líquido.
          - valor: '289 °C'
            mensaje: |
              Ahí la vertical de 15 % Sn toca el liquidus: es la temperatura a
              la que funde **toda** la aleación, no la mitad.
          - valor: '235 °C'
            mensaje: |
              Ahí la vertical toca el solidus: es donde **empieza** a formarse
              líquido, con una fracción nula todavía.
        pista: |
          Prueba isotermas. A cada temperatura lee $C_\alpha$ y $C_L$ y mira si
          su media es 15: a 270 °C sale 17,5, y a 285 °C, 13.
        desarrollo: |
          A 278 °C la isoterma corta el solidus en 10,2 % Sn y el liquidus en
          20,0 %:

          $$
          \frac{10{,}2 + 20{,}0}{2} = 15{,}1
          \qquad
          W_L = \frac{15 - 10{,}2}{20{,}0 - 10{,}2} = 0{,}49
          $$

          Así que $T \approx 278\ ^{\circ}\text{C}$. El listado da 280 °C; la
          casilla acepta las dos.

      - tipo: calcular
        titulo: La composición que hace falta a 200 °C
        pregunta: |
          Si la temperatura se queda en 200 °C, ¿qué composición tiene que
          alcanzar la aleación, en % Sn, para ser mitad líquido y mitad α?
        respuesta:
          tipo: numero
          valor: '37.3'
          tolerancia: 1.5
          formato: un porcentaje en masa de Sn, sin el símbolo
        distractores:
          - valor: '40.1'
            mensaje: |
              Has usado 18,3 y 61,9, que son los extremos del eutéctico, a
              183 °C. La isoterma que manda es la de 200 °C, y ahí α y líquido
              tienen otras composiciones: 17,3 y 56 % Sn.
          - valor: '56.2'
            mensaje: |
              Esa es la composición del **líquido** a 200 °C. Si la aleación
              llegara a 56 % Sn estaría encima del liquidus y sería todo
              líquido; la mitad se consigue en el punto medio de la isoterma.
        pista: |
          A 200 °C lee los dos extremos de la isoterma, α y líquido, y toma su
          media.
        desarrollo: |
          A 200 °C, $C_\alpha \approx 17{,}3\ \%$ Sn y $C_L \approx 56{,}2\ \%$
          Sn:

          $$
          C_0' = \frac{17{,}3 + 56{,}2}{2} = 36{,}7\ \%\ \text{Sn}
          $$

          Leyendo 18 y 58 sale 38. Las dos lecturas entran en la casilla.

      - tipo: calcular
        titulo: El estaño que hay que añadir
        pregunta: |
          ¿Cuántos kilos de estaño hay que añadir a los 2 kg para que la
          aleación llegue a esa composición?
        respuesta:
          tipo: magnitud
          valor: '0.71 kg'
          tolerancia: 0.045
          formato: una masa, con su unidad
        distractores:
          - valor: '0.43 kg'
            mensaje: |
              Has calculado como si la masa total se quedara en 2 kg:
              $2\cdot(0{,}367 - 0{,}15)$. Al añadir estaño la muestra pesa más,
              y el porcentaje se calcula sobre la masa nueva. Lo que se
              conserva es el plomo.
          - valor: '0.99 kg'
            mensaje: |
              Ese es el estaño **total** de la aleación nueva, contando los
              0,30 kg que ya tenía. Lo que se pide es cuánto hay que añadir.
          - valor: '0.84 kg'
            mensaje: |
              Arrastras la composición del 40,1 %, sacada de los extremos del
              eutéctico. Con la isoterma de 200 °C la composición es 36,7 % y
              hacen falta menos kilos.
        pista: |
          El plomo no cambia: $0{,}85\cdot 2 = 1{,}70\ \text{kg}$. En la
          aleación nueva ese plomo es el $100 - C_0'$ por ciento del total.
        desarrollo: |
          $$
          m_{\text{total}} = \frac{1{,}70}{1 - 0{,}367} = 2{,}686\ \text{kg}
          \qquad
          m_{\text{Sn,añadido}} = 2{,}686 - 2 = 0{,}69\ \text{kg}
          $$

          Con la lectura de 38 % sale 0,74 kg, que es el valor del listado.

      - tipo: justificar
        pregunta: Ordena los dos caminos. Una pieza es falsa.
        piezas:
          - texto: >-
              Mitad y mitad significa que la aleación está en el punto medio de
              la isoterma.
          - texto: >-
              Calentando, se sube por la vertical de 15 % Sn hasta la isoterma
              cuyo punto medio es 15: hacia 278 °C.
          - texto: >-
              Añadiendo estaño a 200 °C, la aleación se lleva al punto medio de
              la isoterma de 200 °C, hacia el 37 % Sn.
          - texto: >-
              El plomo se conserva, 1,70 kg, y con él sale la masa nueva y el
              estaño añadido, unos 0,7 kg.
          - texto: >-
              En los dos caminos el líquido tiene la misma composición, porque
              los dos acaban en mitad y mitad.
            trampa: true
            mensaje: |
              La composición del líquido la fija la isoterma, no la fracción.
              A 278 °C el líquido tiene un 20 % Sn; a 200 °C, un 56 %. Mitad y
              mitad solo dice que la aleación está en medio de cada isoterma.
    resolucion: |
      **La idea.** Mitad líquido y mitad α quiere decir que los dos segmentos
      de la palanca son iguales, así que la aleación está en el punto medio de
      la isoterma:

      $$
      W_L = \frac{C_0 - C_\alpha}{C_L - C_\alpha} = 0{,}5
      \;\Longleftrightarrow\;
      C_0 = \frac{C_\alpha + C_L}{2}
      $$

      **a) Calentando.** Con $C_0 = 15\ \%$ Sn fijo, se busca la isoterma
      cuyo punto medio es 15. A 278 °C el solidus está en 10,2 % Sn y el
      liquidus en 20,0 %, que dan 15,1 de media: $T \approx 278\ ^{\circ}\text{C}$.
      El listado da 280 °C, que es la misma lectura redondeada.

      **b) Añadiendo estaño.** Con la temperatura fija en 200 °C, las
      composiciones de las fases ya están decididas —17,3 % Sn para α y
      56,2 % para el líquido— y lo que se mueve es la aleación, hasta el punto
      medio:

      $$
      C_0' = \frac{17{,}3 + 56{,}2}{2} = 36{,}7\ \%\ \text{Sn}
      $$

      El plomo no cambia al añadir estaño, así que:

      $$
      m_{\text{total}} = \frac{0{,}85\cdot 2}{1 - 0{,}367} = 2{,}686\ \text{kg}
      \qquad
      m_{\text{Sn,añadido}} = 0{,}69\ \text{kg}
      $$

      **Contra el listado.** El listado da 0,74 kg, que es lo que sale si la
      isoterma de 200 °C se lee en 18 y 58 % Sn: punto medio en 38 %, masa
      total $1{,}70/0{,}62 = 2{,}742$ kg. La diferencia es de lectura y la
      cuenta la amplifica: cada punto de composición mueve el resultado unos
      0,04 kg. La casilla acepta de 0,68 a 0,74 kg.

      **Lo que hay que llevarse.** Los dos caminos tocan cosas distintas.
      Calentando, la aleación se queda quieta y la isoterma sube hasta
      centrarse en ella. Añadiendo estaño, la isoterma se queda quieta y es la
      aleación la que se desplaza hasta su centro.

  - id: ejcm4-col47-la-temperatura-de-mitad-y-mitad
    titulo: La temperatura a la que queda mitad y mitad
    fuente: >-
      Ejercicio 4.7 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una aleación 30 % Sn - 70 % Pb se calienta a una temperatura comprendida
      en la región α+líquido (Ver figura 1). Si la fracción de cada fase es
      0,5, calcula:

      a) La temperatura de la aleación.

      b) Las composiciones de las dos fases.
    pide: La temperatura y las composiciones de α y del líquido.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Entre qué temperaturas está en la región α + L la aleación de 30 %
          Sn?
        opciones:
          - texto: >-
              Entre 183 °C, la isoterma eutéctica, y unos 257 °C, donde su
              vertical toca el liquidus
            correcta: true
            mensaje: |
              Eso es. Con 30 % Sn la aleación está a la derecha de 18,3 %, así
              que por debajo de 183 °C es α + β, y por encima del liquidus, todo
              líquido. La temperatura buscada está entre esas dos.
          - texto: >-
              Entre 183 °C y 327 °C, la fusión del plomo
            mensaje: |
              327 °C es donde funde el plomo **puro**. Una aleación de 30 % Sn
              es completamente líquida bastante antes, en cuanto su vertical
              toca el liquidus, hacia 257 °C.
          - texto: >-
              Entre el solidus de α y el liquidus, como en una aleación de
              15 % Sn
            mensaje: |
              Con 30 % Sn la vertical no corta el solidus de α: pasa a la
              derecha de su extremo, 18,3 %, y el primer líquido aparece de
              golpe en la isoterma eutéctica, a 183 °C.

      - tipo: calcular
        titulo: La temperatura
        pregunta: |
          ¿A qué temperatura las fracciones de α y de líquido son 0,5?
        respuesta:
          tipo: magnitud
          valor: '228 °C'
          tolerancia: 0.009
          formato: una temperatura, con su unidad
        distractores:
          - valor: '220 °C'
            mensaje: |
              Esa es la media entre 183 y 257 °C. La palanca mide sobre la
              horizontal, en composición: a 220 °C la isoterma va de 16 a
              47,5 % Sn, su punto medio es 31,8 y hay menos líquido del que
              pides.
          - valor: '257 °C'
            mensaje: |
              Ahí la vertical de 30 % Sn toca el liquidus: es la temperatura a
              la que la aleación es **toda** líquida, $W_L = 1$.
          - valor: '183 °C'
            mensaje: |
              Esa es la isoterma eutéctica, donde aparece el primer líquido.
              Justo por encima, $W_L = (30 - 18{,}3)/(61{,}9 - 18{,}3) = 0{,}27$:
              todavía no es la mitad.
        pista: |
          Busca la isoterma cuyo punto medio es 30. A 220 °C la media sale
          31,8 y a 230 °C sale 29,1: está entre las dos.
        desarrollo: |
          A 227 °C la isoterma corta el solidus en 15,6 % Sn y el liquidus en
          44,2 %:

          $$
          \frac{15{,}6 + 44{,}2}{2} = 29{,}9
          \qquad
          W_L = \frac{30 - 15{,}6}{44{,}2 - 15{,}6} = 0{,}50
          $$

          El listado da 230 °C; la casilla acepta de 224 a 232.

      - tipo: calcular
        titulo: La composición de α
        pregunta: |
          A esa temperatura, ¿qué composición tiene la fase α, en % Sn?
        respuesta:
          tipo: numero
          valor: '15.3'
          tolerancia: 1.5
          formato: un porcentaje en masa de Sn, sin el símbolo
        distractores:
          - valor: '18.3'
            mensaje: |
              Ese es el extremo de α en el eutéctico, a 183 °C. A 227 °C el
              solidus de α está más a la izquierda: α admite menos estaño a
              más temperatura en este tramo.
          - valor: '30'
            mensaje: |
              Esa es la composición de la aleación. La fase α está en el
              extremo izquierdo de la isoterma, sobre el solidus.
        pista: |
          Lee dónde corta la isoterma de la temperatura anterior al solidus de
          α.
        desarrollo: |
          $$
          C_\alpha \approx 15{,}6\ \%\ \text{Sn}
          $$

          El listado lee 15.

      - tipo: calcular
        titulo: La composición del líquido
        pregunta: |
          ¿Y la del líquido, en % Sn?
        respuesta:
          tipo: numero
          valor: '43.2'
          tolerancia: 1.5
          formato: un porcentaje en masa de Sn, sin el símbolo
        distractores:
          - valor: '61.9'
            mensaje: |
              Ese es el líquido eutéctico, a 183 °C. A la temperatura del
              problema el liquidus está mucho más a la izquierda.
          - valor: '30'
            mensaje: |
              Esa es la composición de la aleación. Con dos fases, el líquido
              está en el extremo derecho de la isoterma, sobre el liquidus.
        pista: |
          Si las dos fracciones son 0,5, la aleación está en el centro:
          $C_L = 2\,C_0 - C_\alpha$. Compruébalo con la lectura del liquidus.
        desarrollo: |
          $$
          C_L = 2\cdot 30 - 15{,}6 = 44{,}4\ \%\ \text{Sn}
          $$

          que es lo que da la lectura directa del liquidus, 44,2 %. El listado
          lee 42.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La aleación de 30 % Sn está en α + L entre 183 °C y unos
              257 °C.
          - texto: >-
              Con fracciones iguales, la aleación está en el punto medio de la
              isoterma: se busca la temperatura donde $(C_\alpha + C_L)/2 = 30$.
          - texto: >-
              Eso pasa hacia 227 °C, con α de 15,6 % Sn y líquido de 44,2 %.
          - texto: >-
              La temperatura es la media de 183 y 257 °C, porque la fracción de
              líquido crece de 0 a 1 de forma proporcional a la temperatura.
            trampa: true
            mensaje: |
              Ni empieza en 0 ni crece en proporción a la temperatura. Justo
              por encima de 183 °C ya hay un 27 % de líquido, el que da la
              reacción eutéctica, y la palanca mide en composición, con dos
              líneas que no son rectas. La media de temperaturas da 220 °C, y
              ahí la fracción de líquido todavía es 0,45.
    resolucion: |
      **Dónde buscar.** Con 30 % Sn la aleación está a la derecha del extremo
      de α en el eutéctico, 18,3 %. Por eso entra en α + L en la isoterma de
      183 °C y sale al liquidus hacia 257 °C.

      **a) La temperatura.** Fracciones iguales quieren decir segmentos
      iguales: la aleación está en el punto medio de la isoterma. Probando
      isotermas:

      | T | $C_\alpha$ | $C_L$ | punto medio |
      |---|---|---|---|
      | 220 °C | 16,1 | 47,5 | 31,8 |
      | 227 °C | 15,6 | 44,2 | 29,9 |
      | 230 °C | 15,4 | 42,8 | 29,1 |

      El punto medio es 30 hacia $T \approx 227\ ^{\circ}\text{C}$.

      **b) Las composiciones.**

      $$
      C_\alpha \approx 15{,}6\ \%\ \text{Sn}
      \qquad
      C_L \approx 44{,}2\ \%\ \text{Sn}
      $$

      **Contra el listado.** El listado da 230 °C, $C_\alpha = 15$ y
      $C_L = 42$ % Sn. Es la misma lectura con menos detalle, y conviene notar
      que su pareja no está exactamente centrada: $(15 + 42)/2 = 28{,}5$, que
      daría un 56 % de líquido. Las casillas aceptan las dos lecturas.

      **Lo que hay que llevarse.** Con una fracción dada, lo que se busca no es
      una temperatura, sino una isoterma con una forma: aquella en la que la
      aleación cae en el sitio que pide la palanca. Para mitad y mitad, en el
      centro.

  - id: ejcm4-col48-un-cuproniquel-que-se-funde
    titulo: Un cuproníquel que se funde poco a poco
    fuente: >-
      Ejercicio 4.8 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una aleación 70 % Ni - 30 % Cu se calienta lentamente desde 1300 °C. (Ver
      figura 5).

      a) ¿A qué temperatura empieza a formarse líquido?

      b) ¿Cuál es la composición de esta fase líquida? Dibuja la microestructura.

      c) ¿A qué temperatura desaparece el último sólido?

      d) ¿Cuál es la composición de la última fracción sólida? Dibuja la
      microestructura.
    pide: >-
      Las temperaturas a las que aparece el primer líquido y desaparece el
      último sólido, las composiciones de ese líquido y ese sólido, y cómo es
      la microestructura en cada momento.
    pasos:
      - tipo: reconocer
        pregunta: |
          A 1300 °C la aleación de 70 % Ni es sólida. Al calentarla, ¿qué línea
          cruza primero?
        opciones:
          - texto: >-
              El solidus: por encima de él empieza a haber líquido
            correcta: true
            mensaje: |
              Eso es. El solidus es la frontera de abajo de α + L: al cruzarlo
              aparece la primera gota de líquido. El liquidus, más arriba, es
              donde desaparece el último sólido.
          - texto: >-
              El liquidus, que es donde el metal se vuelve líquido
            mensaje: |
              El liquidus es donde **termina** de fundir. Una aleación no
              funde de golpe como un metal puro: funde entre dos
              temperaturas, y la de abajo es el solidus.
          - texto: >-
              Ninguna: funde entera a una sola temperatura, entre la del Cu y
              la del Ni
            mensaje: |
              Eso solo lo hacen los metales puros y las composiciones
              especiales, como un eutéctico. En un sistema isomorfo toda
              aleación funde en un intervalo.

      - tipo: calcular
        titulo: El primer líquido
        pregunta: |
          ¿A qué temperatura empieza a formarse líquido?
        respuesta:
          tipo: magnitud
          valor: '1347 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '1378 °C'
            mensaje: |
              Has leído el **liquidus** en 70 % Ni. Esa es la temperatura a la
              que desaparece el último sólido, la del apartado c).
          - valor: '1196 °C'
            mensaje: |
              Has subido por la vertical de 30 %, que es el cobre. El eje de la
              figura 5 va en % de **Ni**, y la aleación está en 70.
        pista: |
          Sube por la vertical de 70 % Ni hasta la primera línea, el solidus.
        desarrollo: |
          La vertical de 70 % Ni corta el solidus hacia 1344 °C. El listado
          lee 1350 °C, y la casilla acepta las dos lecturas.

      - tipo: calcular
        titulo: La composición del primer líquido
        pregunta: |
          ¿Qué composición tiene ese primer líquido, en % Ni?
        respuesta:
          tipo: numero
          valor: '59'
          tolerancia: 1.5
          formato: un porcentaje en masa de Ni, sin el símbolo
        distractores:
          - valor: '70'
            mensaje: |
              Esa es la composición de la aleación, que en el solidus sigue
              siendo la del sólido. El líquido está en el otro extremo de la
              isoterma, sobre el liquidus, y es más pobre en níquel.
          - valor: '46'
            mensaje: |
              Has leído el liquidus a 1300 °C, la temperatura de partida. El
              líquido aparece más arriba, a la temperatura del solidus, y ahí
              es donde se traza la isoterma.
        pista: |
          Traza la horizontal de la temperatura del apartado a) hacia la
          izquierda, hasta el liquidus.
        desarrollo: |
          $$
          C_L (1344\ ^{\circ}\text{C}) \approx 59\ \%\ \text{Ni}
          $$

          Coincide con el listado.

      - tipo: reconocer
        pregunta: |
          ¿Cómo es la microestructura justo cuando empieza a formarse líquido?
        opciones:
          - texto: >-
              Granos de α con 70 % Ni y, en sus bordes, las primeras gotas de
              líquido con 59 % Ni
            correcta: true
            mensaje: |
              Eso es. En el solidus la fracción de líquido es prácticamente
              nula: la microestructura sigue siendo de granos de α, y el
              líquido aparece como una película finísima entre ellos.
          - texto: >-
              Granos de α con 59 % Ni rodeados de líquido con 70 % Ni
            mensaje: |
              Tienes las composiciones cambiadas. El líquido es la fase pobre
              en níquel, que funde más fácilmente; el sólido es el rico.
          - texto: >-
              Mitad granos de α y mitad líquido, los dos con 70 % Ni
            mensaje: |
              En el solidus todavía no hay casi líquido, y en un campo
              bifásico las dos fases no pueden tener la composición de la
              aleación: una está por encima y otra por debajo.

      - tipo: calcular
        titulo: El último sólido
        pregunta: |
          ¿A qué temperatura desaparece el último sólido?
        respuesta:
          tipo: magnitud
          valor: '1379 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '1344 °C'
            mensaje: |
              Esa es la del solidus, donde aparece el primer líquido. El
              último sólido desaparece al llegar al liquidus, más arriba.
          - valor: '1453 °C'
            mensaje: |
              Esa es la fusión del níquel puro. El último sólido es rico en
              níquel, pero no es níquel puro: desaparece en cuanto la vertical
              de 70 % Ni toca el liquidus.
        pista: |
          Sigue subiendo por la vertical de 70 % Ni hasta la segunda línea.
        desarrollo: |
          La vertical de 70 % Ni corta el liquidus hacia 1378 °C. El listado
          lee 1380 °C.

      - tipo: calcular
        titulo: La composición del último sólido
        pregunta: |
          ¿Qué composición tiene la última fracción sólida, en % Ni?
        respuesta:
          tipo: numero
          valor: '78.5'
          tolerancia: 1.5
          formato: un porcentaje en masa de Ni, sin el símbolo
        distractores:
          - valor: '70'
            mensaje: |
              Esa es la del líquido, que en el liquidus ya tiene la
              composición de la aleación. El sólido está en el otro extremo de
              la isoterma, sobre el solidus.
          - valor: '100'
            mensaje: |
              El último sólido es el más rico en níquel, pero no es níquel
              puro: es la α que el solidus marca a esa temperatura.
        pista: |
          Traza la horizontal de 1378 °C hacia la derecha, hasta el solidus.
        desarrollo: |
          $$
          C_\alpha (1378\ ^{\circ}\text{C}) \approx 79\ \%\ \text{Ni}
          $$

          El listado lee 78.

      - tipo: reconocer
        pregunta: |
          ¿Cómo es la microestructura justo antes de que desaparezca el último
          sólido?
        opciones:
          - texto: >-
              Líquido con 70 % Ni y unos pocos granos pequeños de α con 79 % Ni
            correcta: true
            mensaje: |
              Eso es. En el liquidus casi todo es líquido, con la composición
              de la aleación, y quedan restos de α ricos en níquel a punto de
              disolverse.
          - texto: >-
              Líquido con 79 % Ni y restos de α con 70 % Ni
            mensaje: |
              Composiciones cambiadas otra vez: el sólido es siempre la fase
              rica en níquel. Aquí el líquido tiene ya la composición de la
              aleación.
          - texto: >-
              Granos grandes de α con 70 % Ni y algo de líquido entre ellos
            mensaje: |
              Esa imagen es la del principio de la fusión, cerca del solidus.
              En el liquidus la situación es la contraria: mucho líquido y muy
              poco sólido.

      - tipo: justificar
        pregunta: Ordena lo que pasa al calentar. Una pieza es falsa.
        piezas:
          - texto: >-
              Hasta unos 1344 °C la aleación es toda α, con 70 % Ni.
          - texto: >-
              Al cruzar el solidus aparece un líquido de 59 % Ni, más pobre en
              níquel que la aleación.
          - texto: >-
              Mientras sube la temperatura, el líquido y el sólido se
              enriquecen en níquel siguiendo el liquidus y el solidus, y cada
              vez hay más líquido.
          - texto: >-
              Hacia 1378 °C desaparece el último sólido, con 79 % Ni, y queda
              líquido de 70 % Ni.
          - texto: >-
              El sólido conserva su 70 % Ni durante toda la fusión: lo único
              que cambia es cuánto hay.
            trampa: true
            mensaje: |
              Con calentamiento lento, en equilibrio, el sólido cambia de
              composición todo el rato: va por el solidus de 70 a 79 % Ni. Si
              no lo hiciera, la aleación dejaría de estar en equilibrio.
    resolucion: |
      Se sube por la vertical de 70 % Ni en la figura 5.

      **a) Primer líquido.** La vertical corta el solidus hacia 1344 °C. El
      listado lee 1350 °C.

      **b) Su composición.** La isoterma de esa temperatura corta el liquidus
      en $C_L \approx 59\ \%$ Ni. La microestructura son granos de α de 70 %
      Ni con una película finísima de líquido de 59 % Ni en los bordes: la
      fracción de líquido es todavía nula.

      **c) Último sólido.** La vertical corta el liquidus hacia 1378 °C. El
      listado lee 1380 °C.

      **d) Su composición.** La isoterma de 1378 °C corta el solidus en
      $C_\alpha \approx 79\ \%$ Ni (el listado lee 78). La microestructura es
      casi toda líquido de 70 % Ni, con unos pocos granos pequeños de α de
      79 % Ni a punto de desaparecer.

      Entre las dos temperaturas, líquido y sólido se enriquecen en níquel a
      la vez: el líquido va por el liquidus de 59 a 70 % Ni y el sólido por el
      solidus de 70 a 79 %, y la palanca pasa de todo sólido a todo líquido.

      **Lo que hay que llevarse.** En el solidus la aleación sigue teniendo la
      composición del sólido, y la del líquido se lee en la otra línea. En el
      liquidus, al revés. La composición de la aleación está siempre en uno de
      los extremos en esos dos instantes, nunca en los dos.

  - id: ejcm4-col49-un-plomo-magnesio-que-se-enfria
    titulo: Un plomo-magnesio que se enfría hasta el eutéctico
    fuente: >-
      Ejercicio 4.9 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Esquematiza las microestructuras, indicando la composición aproximada,
      obtenidas al enfriar lentamente una aleación 85 % Pb - 15 % Mg a las
      siguientes temperaturas: 600, 500, 270 y 200 °C. (Ver figura 2).
    pide: >-
      Qué fases hay a cada temperatura, su composición aproximada y cómo es la
      microestructura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Por debajo del liquidus aparece $\text{Mg}_2\text{Pb}$, que en la
          figura 2 es una línea vertical en 81 % Pb. ¿Qué composición tiene
          esa fase?
        opciones:
          - texto: >-
              Siempre 81 % Pb, a cualquier temperatura
            correcta: true
            mensaje: |
              Eso es. Es un compuesto con una fórmula fija: dos átomos de Mg
              por uno de Pb, que en masa es el 81 % de plomo. Una línea
              vertical no tiene anchura, y su composición no cambia con la
              temperatura.
          - texto: >-
              La que marque el liquidus a cada temperatura
            mensaje: |
              El liquidus da la composición del **líquido**. La del compuesto
              no se lee en ninguna curva: es la de su línea vertical.
          - texto: >-
              La de la aleación, 85 % Pb, porque es la fase que se forma
              primero
            mensaje: |
              La primera fase sólida en formarse no tiene por qué tener la
              composición de la aleación. Aquí es un compuesto de 81 % Pb, y
              el plomo que sobra se queda en el líquido.

      - tipo: calcular
        titulo: El líquido a 500 °C
        pregunta: |
          A 500 °C la aleación está en $L + \text{Mg}_2\text{Pb}$. ¿Qué
          composición tiene el líquido, en % Pb?
        respuesta:
          tipo: numero
          valor: '87.5'
          tolerancia: 1.5
          formato: un porcentaje en masa de Pb, sin el símbolo
        distractores:
          - valor: '85'
            mensaje: |
              Esa es la composición de la aleación. Al formarse
              $\text{Mg}_2\text{Pb}$, que tiene menos plomo, el líquido que
              queda se enriquece en plomo: está a la derecha del punto.
          - valor: '81'
            mensaje: |
              Esa es la del compuesto. El líquido está en el otro extremo de
              la isoterma, sobre el liquidus.
        pista: |
          Desde (85 % Pb, 500 °C) ve hacia la derecha por la horizontal hasta
          el liquidus.
        desarrollo: |
          $$
          C_L \approx 87\ \%\ \text{Pb}
          \qquad
          C_{\text{Mg}_2\text{Pb}} = 81\ \%\ \text{Pb}
          $$

          El listado lee 88. La casilla acepta las dos lecturas.

      - tipo: reconocer
        pregunta: |
          Entre 500 y 270 °C se sigue formando $\text{Mg}_2\text{Pb}$. ¿Qué le
          pasa al líquido?
        opciones:
          - texto: >-
              Se enriquece en plomo siguiendo el liquidus, hasta cerca de
              97 % Pb a 270 °C
            correcta: true
            mensaje: |
              Eso es. Cada cristal de $\text{Mg}_2\text{Pb}$ que se forma se
              lleva más magnesio que el que le toca, y el líquido que queda es
              cada vez más rico en plomo, hasta acercarse al eutéctico.
          - texto: >-
              Conserva el 85 % Pb de la aleación mientras quede líquido
            mensaje: |
              Solo si no se formara nada. El compuesto tiene 81 % Pb, menos
              que la aleación, y el balance obliga al líquido a quedarse con
              el plomo sobrante.
          - texto: >-
              Se empobrece en plomo hasta llegar a 81 %, la composición del
              compuesto
            mensaje: |
              Va en el sentido contrario: el líquido se aleja del compuesto,
              por el liquidus hacia la derecha, hasta el eutéctico.

      - tipo: calcular
        titulo: La fase β a 200 °C
        pregunta: |
          A 200 °C, por debajo del eutéctico, las fases son β y
          $\text{Mg}_2\text{Pb}$. ¿Qué composición tiene β, en % Pb?
        respuesta:
          tipo: numero
          valor: '99.2'
          tolerancia: 1.5
          formato: un porcentaje en masa de Pb, sin el símbolo
        distractores:
          - valor: '97'
            mensaje: |
              Ese es el líquido eutéctico, el que había justo antes de
              solidificar. Al pasar por 250 °C ese líquido se ha convertido en
              β y $\text{Mg}_2\text{Pb}$, y β está en su propio borde, casi
              plomo puro.
          - valor: '81'
            mensaje: |
              Esa es la del compuesto, que es la otra fase. β es la disolución
              sólida rica en plomo, pegada al borde derecho de la figura.
        pista: |
          A 200 °C la isoterma, hacia la derecha, termina en el borde del campo
          β, muy cerca del 100 %.
        desarrollo: |
          $$
          C_\beta \approx 99\ \%\ \text{Pb}
          \qquad
          C_{\text{Mg}_2\text{Pb}} = 81\ \%\ \text{Pb}
          $$

          Coincide con el listado.

      - tipo: reconocer
        pregunta: |
          ¿Cómo es la microestructura a 200 °C?
        opciones:
          - texto: >-
              Cristales grandes de $\text{Mg}_2\text{Pb}$ primario, formados
              antes del eutéctico, rodeados de microconstituyente eutéctico, β
              y $\text{Mg}_2\text{Pb}$ en láminas finas
            correcta: true
            mensaje: |
              Eso es. El compuesto que se formó entre 525 y 250 °C queda como
              cristales grandes, unos tres cuartos de la masa. El líquido que
              quedaba, con la composición eutéctica, solidifica de golpe en la
              mezcla fina de las dos fases.
          - texto: >-
              Todo eutéctico, láminas finas de β y $\text{Mg}_2\text{Pb}$
            mensaje: |
              Eso sería una aleación de composición eutéctica, hacia 97 % Pb.
              La de 85 % Pb forma antes mucho compuesto primario, y el
              eutéctico solo ocupa el hueco que deja el último líquido.
          - texto: >-
              Granos de β con un poco de $\text{Mg}_2\text{Pb}$ precipitado
              dentro
            mensaje: |
              Eso es lo que se ve en una aleación casi de plomo puro, a la
              derecha del eutéctico. Con 85 % Pb la fase que domina es el
              compuesto, no β.

      - tipo: justificar
        pregunta: Ordena el enfriamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A 600 °C todo es líquido, con 85 % Pb: el liquidus de esta
              composición está hacia 525 °C.
          - texto: >-
              A 500 °C hay cristales de $\text{Mg}_2\text{Pb}$, con 81 % Pb, en
              un líquido de 87 % Pb.
          - texto: >-
              A 270 °C sigue habiendo $\text{Mg}_2\text{Pb}$ y líquido, que ya
              tiene un 97 % Pb, casi el eutéctico.
          - texto: >-
              A 200 °C el último líquido ha dado eutéctico, β de 99 % Pb y
              $\text{Mg}_2\text{Pb}$, alrededor de los cristales primarios.
          - texto: >-
              A 200 °C la fase β tiene 85 % Pb, porque recoge el plomo de la
              aleación entera.
            trampa: true
            mensaje: |
              β está en el borde de su campo, en 99 % Pb, como cualquier fase
              de un campo bifásico. El 85 % Pb es la media de β y del
              compuesto, pesada con sus fracciones.
    resolucion: |
      Se baja por la vertical de 85 % Pb en la figura 2.

      **600 °C.** Por encima del liquidus, que para esta composición está
      hacia 525 °C. Todo líquido, $C_L = 85\ \%$ Pb.

      **500 °C.** Campo $L + \text{Mg}_2\text{Pb}$. Se forman cristales del
      compuesto y el líquido se enriquece en plomo:

      $$
      C_L \approx 87\ \%\ \text{Pb}
      \qquad
      C_{\text{Mg}_2\text{Pb}} = 81\ \%\ \text{Pb}
      $$

      Por la palanca, un tercio de la masa ya es compuesto.

      **270 °C.** Sigue en $L + \text{Mg}_2\text{Pb}$, con el líquido cerca
      del eutéctico: $C_L \approx 97\ \%$ Pb. Ahora el compuesto es casi tres
      cuartos de la masa.

      **200 °C.** Al pasar por la isoterma eutéctica, hacia 250 °C, el líquido
      que quedaba solidifica en β y $\text{Mg}_2\text{Pb}$. Las fases son:

      $$
      C_\beta \approx 99\ \%\ \text{Pb}
      \qquad
      C_{\text{Mg}_2\text{Pb}} = 81\ \%\ \text{Pb}
      $$

      La microestructura: cristales grandes de $\text{Mg}_2\text{Pb}$
      primario rodeados de eutéctico, láminas finas de β y compuesto.

      **Contra el listado.** Coincide en las cuatro temperaturas; a 500 °C el
      listado lee 88 donde aquí se lee 87.

      **Lo que hay que llevarse.** El diagrama Pb-Mg son dos eutécticos
      pegados por el compuesto. A la derecha de la línea de 81 % el
      $\text{Mg}_2\text{Pb}$ hace el papel de α, y todo se lee como en el
      sistema Pb-Sn.

  - id: ejcm4-col410-lo-que-cabe-a-200-grados
    titulo: Lo que admite cada metal a 200 grados
    fuente: >-
      Ejercicio 4.10 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      A 200 °C, ¿cuál es la solubilidad máxima de: a) Pb en Sn y b) Sn en Pb?
      (Ver figura 1).
    pide: >-
      El porcentaje máximo de Pb que admite la fase rica en Sn, y el de Sn que
      admite la fase rica en Pb, a 200 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Solubilidad máxima de Pb en Sn» a 200 °C. ¿Dónde se lee?
        opciones:
          - texto: >-
              En el borde del campo β a 200 °C, pasado a % de Pb
            correcta: true
            mensaje: |
              Eso es. β es el estaño con plomo disuelto, y su borde marca
              cuánto plomo admite como mucho a esa temperatura. El eje da % Sn,
              así que el plomo es lo que falta hasta 100.
          - texto: >-
              En el borde del campo α a 200 °C
            mensaje: |
              α es el **plomo** con estaño disuelto: su borde da la solubilidad
              de Sn en Pb, que es el apartado b).
          - texto: >-
              En los extremos del eutéctico, 18,3 y 97,8 % Sn
            mensaje: |
              Esos valores son los de 183 °C. La pregunta fija 200 °C, y los
              bordes de los campos se leen a esa temperatura.

      - tipo: calcular
        titulo: El plomo que admite el estaño
        pregunta: |
          ¿Cuál es la solubilidad máxima de Pb en Sn a 200 °C, en % Pb?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 1.5
          formato: un porcentaje en masa de Pb, sin el símbolo
        distractores:
          - valor: '97.6'
            mensaje: |
              Has leído bien el borde de β, pero lo has dejado en % de Sn. La
              pregunta es cuánto **plomo** admite: $100 - 97{,}6$.
          - valor: '17.3'
            mensaje: |
              Ese es el borde de α, que da el estaño que admite el plomo. Aquí
              se pregunta al revés, el plomo que admite el estaño.
        pista: |
          A 200 °C, el borde de β está muy cerca del eje derecho. Léelo en % Sn
          y réstalo de 100.
        desarrollo: |
          $$
          100 - 97{,}6 = 2{,}4\ \%\ \text{Pb}
          $$

          El listado da 2 %.

      - tipo: calcular
        titulo: El estaño que admite el plomo
        pregunta: |
          ¿Cuál es la solubilidad máxima de Sn en Pb a 200 °C, en % Sn?
        respuesta:
          tipo: numero
          valor: '17.5'
          tolerancia: 1.5
          formato: un porcentaje en masa de Sn, sin el símbolo
        distractores:
          - valor: '82.7'
            mensaje: |
              Ese es el plomo de la fase α, no el estaño. El borde de α a
              200 °C está en 17,3 % Sn, y la solubilidad que se pide es esa.
          - valor: '56.2'
            mensaje: |
              Has seguido la isoterma hasta el liquidus. El borde de α es la
              primera línea que se toca desde la izquierda: más estaño que ese
              ya no cabe en α y aparece líquido.
        pista: |
          A 200 °C, desde la izquierda, la primera línea que corta la
          horizontal es el borde de α.
        desarrollo: |
          $$
          C_\alpha^{\text{máx}} (200\ ^{\circ}\text{C}) \approx 17{,}3\ \%\ \text{Sn}
          $$

          El listado da 18 %.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La solubilidad de Pb en Sn es el borde de β: a 200 °C está en
              97,6 % Sn, o sea, 2,4 % Pb.
          - texto: >-
              La de Sn en Pb es el borde de α: a 200 °C, 17,3 % Sn.
          - texto: >-
              El máximo absoluto de las dos es a 183 °C, 18,3 % Sn en α y 2,2 %
              Pb en β; a 200 °C son algo menores.
          - texto: >-
              A 200 °C, una aleación con más Sn del que admite α forma α + β.
            trampa: true
            mensaje: |
              A 200 °C estás por encima del eutéctico: al otro lado del borde
              de α está α + L. El estaño que α no admite se va al líquido; α +
              β solo aparece por debajo de 183 °C.
    resolucion: |
      **Qué se lee.** La solubilidad máxima de un metal en otro a una
      temperatura es el borde del campo monofásico del segundo a esa
      temperatura. β es estaño con plomo disuelto; α, plomo con estaño
      disuelto.

      **a) Pb en Sn.** A 200 °C el borde de β está en 97,6 % Sn:

      $$
      100 - 97{,}6 = 2{,}4\ \%\ \text{Pb}
      $$

      **b) Sn en Pb.** A 200 °C el borde de α, que ahí es el solidus, está
      en:

      $$
      C_\alpha \approx 17{,}3\ \%\ \text{Sn}
      $$

      **Contra el listado.** El listado da 2 % y 18 %. Son lecturas más
      gruesas de las mismas líneas; el 18 queda entre los 17,3 de 200 °C y
      los 18,3 del eutéctico, y las casillas aceptan las dos.

      **Lo que hay que llevarse.** Por encima del eutéctico, lo que no cabe en
      α o en β no precipita como la otra fase sólida: se va al líquido. El
      mismo borde es un solidus por encima de 183 °C y un solvus por debajo.

  - id: ejcm4-col411-fases-y-microconstituyentes-de-una-plata-cobre
    titulo: Fases y microconstituyentes de una plata-cobre
    fuente: >-
      Ejercicio 4.11 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dada una aleación Ag - Cu que contiene 25 % Ag - 75 % Cu a 775 °C,
      determina las fracciones de masa de:

      a) Las fases α y β.

      b) Los microconstituyentes α primario y eutéctico.

      c) El microconstituyente α eutéctico. (Ver figura 3).
    pide: >-
      Las fracciones de masa de las fases α y β, de los microconstituyentes α
      primario y eutéctico, y de la α que hay dentro del eutéctico.
    pasos:
      - tipo: reconocer
        pregunta: |
          A 775 °C la aleación está cuatro grados por debajo de la isoterma
          eutéctica. ¿Entre qué extremos va la palanca de las **fases**, y
          entre cuáles la de los **microconstituyentes**?
        opciones:
          - texto: >-
              Fases, entre α (8,0 % Ag) y β (91,2 % Ag); microconstituyentes,
              entre α (8,0 % Ag) y el eutéctico (71,9 % Ag)
            correcta: true
            mensaje: |
              Eso es. Las fases que hay son α y β, así que su palanca va de
              punta a punta de la isoterma. El eutéctico es una mezcla con la
              composición media del último líquido, 71,9 % Ag, y ese es el
              extremo de la palanca de microconstituyentes.
          - texto: >-
              Las dos entre α (8,0 % Ag) y β (91,2 % Ag), porque por debajo de
              779 °C ya no queda líquido
            mensaje: |
              Para las fases, sí. Pero el eutéctico no es β: es una mezcla de
              α y β que salió del líquido de 71,9 % Ag y conserva esa
              composición media. Con β de extremo volverías a sacar la
              fracción de fases.
          - texto: >-
              Las dos entre α (8,0 % Ag) y el eutéctico (71,9 % Ag), porque es
              lo que se ve al microscopio
            mensaje: |
              Para los microconstituyentes, sí. Pero la fase β existe —en
              láminas, dentro del eutéctico— y tiene 91,2 % Ag. Si cortas la
              palanca de fases en 71,9 cuentas el eutéctico entero como si
              fuera β.

      - tipo: calcular
        titulo: a) La fracción de fase α
        pregunta: |
          ¿Qué fracción de la masa es fase α, contando toda la α que haya?
        respuesta:
          tipo: numero
          valor: '0.796'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.204'
            mensaje: |
              Esa es $W_\beta$: has puesto arriba el brazo que va de $C_0$
              hacia α. La fracción de una fase es el brazo **opuesto**, el que
              va de $C_0$ hasta la otra fase: $91{,}2 - 25$.
          - valor: '0.734'
            mensaje: |
              Esa es la fracción del microconstituyente α primario: has
              cortado la palanca en el eutéctico, 71,9 % Ag. Te piden la
              **fase** α, y también hay α dentro del eutéctico.
        pista: |
          $W_\alpha = \dfrac{C_\beta - C_0}{C_\beta - C_\alpha}$, con los
          extremos de la isoterma eutéctica.
        desarrollo: |
          $$
          W_\alpha = \frac{91{,}2 - 25}{91{,}2 - 8{,}0} = \frac{66{,}2}{83{,}2} = 0{,}796
          \qquad
          W_\beta = 1 - 0{,}796 = 0{,}204
          $$

      - tipo: calcular
        titulo: b) El α primario
        pregunta: |
          ¿Qué fracción de la masa es microconstituyente α primario? El
          eutéctico es el resto.
        respuesta:
          tipo: numero
          valor: '0.734'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.796'
            mensaje: |
              Esa es la fracción de **fase** α, que incluye la α de dentro del
              eutéctico. El α primario es solo el que se formó antes de llegar
              a 779 °C: su palanca termina en 71,9 % Ag, no en 91,2.
          - valor: '0.266'
            mensaje: |
              Esa es la fracción de eutéctico. Has tomado el brazo que va de α
              a $C_0$; para el α primario se usa el que va de $C_0$ al
              eutéctico, $71{,}9 - 25$.
        pista: |
          $W_{\alpha'} = \dfrac{C_{\text{E}} - C_0}{C_{\text{E}} - C_\alpha}$,
          y $W_{\text{E}} = 1 - W_{\alpha'}$.
        desarrollo: |
          $$
          W_{\alpha'} = \frac{71{,}9 - 25}{71{,}9 - 8{,}0} = \frac{46{,}9}{63{,}9} = 0{,}734
          \qquad
          W_{\text{E}} = 1 - 0{,}734 = 0{,}266
          $$

      - tipo: calcular
        titulo: c) La α que está dentro del eutéctico
        pregunta: |
          ¿Qué fracción de la masa total es α eutéctico?
        respuesta:
          tipo: numero
          valor: '0.062'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.266'
            mensaje: |
              Ese es el eutéctico entero, y el eutéctico no es solo α: son
              láminas de α y de β. Solo una parte de ese 0,266 es α.
          - valor: '0.204'
            mensaje: |
              Esa es la β del eutéctico, que además es toda la β de la
              aleación: β solo aparece dentro del eutéctico. Lo que falta
              hasta 0,266 es la α.
        pista: |
          Toda la α menos la α primaria: $W_{\alpha\text{E}} = W_\alpha - W_{\alpha'}$.
        desarrollo: |
          $$
          W_{\alpha\text{E}} = W_\alpha - W_{\alpha'} = 0{,}796 - 0{,}734 = 0{,}062
          $$

          Por el otro camino sale lo mismo. El eutéctico tiene la proporción
          de α que da la palanca desde su propia composición,
          $(91{,}2 - 71{,}9)/(91{,}2 - 8{,}0) = 0{,}232$, así que
          $0{,}266 \cdot 0{,}232 = 0{,}062$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A 775 °C hay dos fases, α y β, con las composiciones de los
              extremos de la isoterma, 8,0 y 91,2 % Ag.
          - texto: >-
              La palanca de fases da 0,796 de α y 0,204 de β.
          - texto: >-
              El α primario se formó antes del eutéctico. Su palanca acaba en
              71,9 % Ag y da 0,734; el eutéctico es el 0,266 restante.
          - texto: >-
              La α que falta, 0,062, está en láminas dentro del eutéctico,
              junto con toda la β.
          - texto: >-
              Como el eutéctico tiene α y β, la mitad de su 0,266 es α: 0,133.
            trampa: true
            mensaje: |
              Las láminas no van a medias. La proporción la fija la palanca
              desde 71,9 % Ag, que está mucho más cerca de β que de α: el
              eutéctico es un 23 % de α y un 77 % de β. Por eso la α
              eutéctica es solo 0,062.
    resolucion: |
      **Las fases.** A 775 °C la aleación está justo debajo de la isoterma
      eutéctica, en la región α + β. Los extremos son los de la isoterma:

      $$
      W_\alpha = \frac{91{,}2 - 25}{91{,}2 - 8{,}0} = 0{,}796
      \qquad
      W_\beta = 0{,}204
      $$

      **Los microconstituyentes.** Con 25 % Ag la aleación es
      hipoeutéctica: al enfriar sale primero α, y el líquido que queda llega
      a 71,9 % Ag y se convierte en eutéctico. La palanca de
      microconstituyentes acaba en el eutéctico:

      $$
      W_{\alpha'} = \frac{71{,}9 - 25}{71{,}9 - 8{,}0} = 0{,}734
      \qquad
      W_{\text{E}} = 0{,}266
      $$

      **La α eutéctica** es la diferencia entre toda la α y la primaria:

      $$
      W_{\alpha\text{E}} = 0{,}796 - 0{,}734 = 0{,}062
      $$

      Coincide con el listado en a) y b), que da 0,80 / 0,20 y 0,73 / 0,27.
      En c) el listado da 0,07: es la resta de los dos valores ya
      redondeados, $0{,}80 - 0{,}73$. Sin redondear sale 0,062, y la casilla
      acepta las dos cifras.

      **Lo que hay que llevarse.** Fase y microconstituyente no son lo mismo,
      y aquí se ve con números: hay 0,796 de fase α pero solo 0,734 de α
      primario. La diferencia está escondida dentro del eutéctico.

  - id: ejcm4-col412-la-composicion-que-dan-beta-primario-y-eutectico
    titulo: La composición que dan el β primario y el eutéctico
    fuente: >-
      Ejercicio 4.12 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La microestructura de una aleación Pb - Sn a 180 °C consta de β
      primario y eutéctico. Determina la composición global de la aleación
      sabiendo que las fracciones de masa de estos dos microconstituyentes
      son 0,57 y 0,43, respectivamente. (Ver figura 1).
    pide: La composición global de la aleación, en porcentaje de Sn.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay β primario. ¿Qué dice eso de la composición de la aleación?
        opciones:
          - texto: >-
              Que es hipereutéctica, entre 61,9 y 97,8 % Sn, y la palanca de
              microconstituyentes va del eutéctico a β
            correcta: true
            mensaje: |
              Eso es. Solo sale β antes que el eutéctico si el líquido
              empieza a la derecha del punto eutéctico. Entonces la palanca
              va de $C_{\text{E}} = 61{,}9$ a $C_\beta = 97{,}8$.
          - texto: >-
              Que es hipoeutéctica, entre 18,3 y 61,9 % Sn
            mensaje: |
              A la izquierda del eutéctico lo primero que solidifica es α, no
              β. Una aleación hipoeutéctica tiene α primario y eutéctico.
          - texto: >-
              Nada: a 180 °C todas las aleaciones entre 18,3 y 97,8 % Sn son α
              + β, así que la palanca va de 18,3 a 97,8
            mensaje: |
              Eso vale para las **fases**. Aquí te dan fracciones de
              microconstituyentes, y el eutéctico no es una fase: tiene
              composición media 61,9 % Sn, y ese es el extremo.

      - tipo: calcular
        titulo: La composición global
        pregunta: |
          ¿Qué porcentaje de Sn tiene la aleación?
        respuesta:
          tipo: numero
          valor: '82.4'
          tolerancia: 1
          formato: un porcentaje de Sn, sin el símbolo
        distractores:
          - valor: '77.3'
            mensaje: |
              Has puesto 0,43 donde iba 0,57: con 77,3 % Sn habría más
              eutéctico que β primario. La fracción de β primario es el brazo
              que va del eutéctico a $C_0$, y ese brazo es el 57 % de la
              palanca.
          - valor: '63.6'
            mensaje: |
              Has usado la palanca de **fases**, de α (18,3) a β (97,8). El
              0,57 es de β primario, un microconstituyente, y su palanca
              empieza en el eutéctico, 61,9.
        pista: |
          $W_{\beta'} = \dfrac{C_0 - C_{\text{E}}}{C_\beta - C_{\text{E}}} = 0{,}57$,
          y se despeja $C_0$.
        desarrollo: |
          $$
          0{,}57 = \frac{C_0 - 61{,}9}{97{,}8 - 61{,}9}
          \;\Longrightarrow\;
          C_0 = 61{,}9 + 0{,}57\cdot 35{,}9 = 82{,}4\ \%\ \text{Sn}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay β primario, así que la aleación es hipereutéctica: está entre
              61,9 y 97,8 % Sn.
          - texto: >-
              Los microconstituyentes se reparten con la palanca entre el
              eutéctico (61,9) y β (97,8).
          - texto: >-
              El β primario es el brazo de 61,9 a C₀, que es el 57 % de 35,9:
              C₀ = 82,4 % Sn.
          - texto: >-
              Como a 180 °C ya no hay líquido, la composición del eutéctico no
              sirve y la palanca va de α (18,3) a β (97,8).
            trampa: true
            mensaje: |
              El líquido ya no está, pero el eutéctico que dejó conserva su
              composición media, 61,9 % Sn. La palanca de 18,3 a 97,8 es la de
              las fases, y da 63,6 % Sn, que no es la respuesta.
    resolucion: |
      **Qué lado del eutéctico.** Si hay β primario, el líquido empezó a la
      derecha del punto eutéctico: la aleación es hipereutéctica. El β
      primario solidificó entre la línea de líquidus y 183 °C, y el líquido
      restante, de 61,9 % Sn, dio el eutéctico.

      **La palanca de microconstituyentes** va del eutéctico a β:

      $$
      W_{\beta'} = \frac{C_0 - 61{,}9}{97{,}8 - 61{,}9} = 0{,}57
      \;\Longrightarrow\;
      C_0 = 61{,}9 + 0{,}57\cdot 35{,}9 = 82{,}4\ \%\ \text{Sn}
      $$

      Coincide con el listado. Que el análisis se haga a 180 °C y no justo
      debajo de 183 °C no cambia nada: las fracciones de microconstituyentes
      quedan fijadas en la reacción eutéctica. Con $C_\beta = 97{,}7$, que es
      lo que marca la figura a 180 °C, sale 82,3.

      **Lo que hay que llevarse.** El enunciado habla de microconstituyentes,
      y eso decide el extremo de la palanca. Leer «a 180 °C todo es α + β» y
      usar la palanca de fases da 63,6 % Sn, un número razonable y falso.

  - id: ejcm4-col413-una-aleacion-que-no-acaba-de-fundir
    titulo: Una aleación que no acaba de fundir en el horno
    fuente: >-
      Ejercicio 4.13 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un trabajador introduce 12 kg de una aleación con un 30 % en peso de Sn
      (Sn - Pb) en un horno eléctrico a 183,5 oC y observa que la aleación no
      se funde completamente. Responde a las siguientes preguntas utilizando
      el diagrama de fases del sistema (Sn - Pb):

      a) ¿Cuál es la cantidad máxima de masa fundida que puede obtenerse a la
      temperatura del horno?

      b) ¿A qué temperatura debe estar el horno para que se funda toda la
      aleación?

      c) La temperatura del horno es fija y al trabajador se le ha ocurrido
      añadir Sn puro a la aleación para conseguir la fusión total. ¿Cuántos
      kg de estaño ha añadido para conseguirlo?

      d) Una vez fundida la aleación, el trabajador añade otros 11 kg de Sn y,
      de nuevo, comprueba que aparecen una fase líquida y una fase sólida.
      ¿En qué proporción aparecerán?

      e) Por último, el trabajador apaga el horno y decide enfriar lentamente
      la aleación en su interior, para analizar su microestructura a
      temperatura ambiente. Haz un esquema de la microestructura que el
      empleado verá al microscopio y calcula las fracciones de las fases y
      microcomponentes que aparecerán en ella. (Ver figura 1).
    pide: >-
      La masa fundida a 183,5 °C, la temperatura de fusión total, el estaño
      que hay que añadir, la proporción de líquido tras añadir 11 kg más, y la
      microestructura final con sus fracciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con 30 % Sn y a 183,5 °C, ¿dónde está la aleación en el diagrama?
        opciones:
          - texto: >-
              En α + L, medio grado por encima de la isoterma eutéctica: α de
              18,3 % Sn y líquido de 61,9 % Sn
            correcta: true
            mensaje: |
              Eso es. Por eso no funde entera: a esa temperatura el líquido
              solo puede tener 61,9 % Sn, y con 30 % Sn en total no llega para
              que todo sea líquido. El resto se queda como α.
          - texto: >-
              Por debajo de la eutéctica, así que todavía no ha fundido nada
            mensaje: |
              La eutéctica está a 183 °C y el horno a 183,5: medio grado por
              encima. Ya ha fundido todo lo que era eutéctico, y el enunciado
              dice que ve líquido.
          - texto: >-
              En la región líquida, y lo que pasa es que el horno necesita más
              tiempo
            mensaje: |
              El diagrama es de equilibrio: dice lo que hay cuando ya no
              cambia nada. A 30 % Sn la línea de líquidus está muy por encima
              de 183,5 °C, así que por mucho que espere seguirá habiendo α.

      - tipo: calcular
        titulo: a) La masa fundida
        pregunta: |
          ¿Cuántos kilogramos de líquido hay, como mucho, a 183,5 °C?
        respuesta:
          tipo: magnitud
          valor: '3.22 kg'
          tolerancia: 0.03
          formato: una masa, con su unidad
        distractores:
          - valor: '8.78 kg'
            mensaje: |
              Esa es la masa de α sólida. Has tomado el brazo de $C_0$ hasta
              el líquido; la fracción de líquido es el brazo **opuesto**, de α
              a $C_0$: $30 - 18{,}3$.
          - valor: '3.6 kg'
            mensaje: |
              Ese es el estaño que contiene la aleación, el 30 % de 12 kg. No
              funde «el estaño»: funde un líquido de 61,9 % Sn, y cuánto hay
              de él lo dice la palanca.
        pista: |
          $W_{\text{L}} = \dfrac{C_0 - C_\alpha}{C_{\text{L}} - C_\alpha}$,
          con $C_\alpha = 18{,}3$ y $C_{\text{L}} = 61{,}9$.
        desarrollo: |
          $$
          W_{\text{L}} = \frac{30 - 18{,}3}{61{,}9 - 18{,}3} = \frac{11{,}7}{43{,}6} = 0{,}268
          \qquad
          m_{\text{L}} = 0{,}268\cdot 12 = 3{,}22\ \text{kg}
          $$

      - tipo: calcular
        titulo: b) La temperatura de fusión total
        pregunta: |
          ¿A qué temperatura tiene que estar el horno para que funda toda la
          aleación de 30 % Sn?
        respuesta:
          tipo: magnitud
          valor: '253 °C'
          tolerancia: 0.02
          formato: una temperatura, con su unidad
        distractores:
          - valor: '183 °C'
            mensaje: |
              Esa es la temperatura a la que **empieza** a fundir, la
              eutéctica. Para que no quede sólido hay que subir hasta la línea
              de líquidus, que a 30 % Sn está bastante más arriba.
          - valor: '327 °C'
            mensaje: |
              Ese es el punto de fusión del plomo puro. La aleación funde
              antes: con 30 % Sn la línea de líquidus ya ha bajado unos setenta
              grados.
        pista: |
          Sube en vertical desde 30 % Sn hasta cortar la línea de líquidus, la
          que separa α + L de la región líquida.
        desarrollo: |
          La vertical de 30 % Sn corta la línea de líquidus hacia
          $250$–$257\ ^{\circ}\text{C}$. Por encima de esa temperatura
          toda la aleación es líquida.

      - tipo: calcular
        titulo: c) El estaño que funde la aleación a 183,5 °C
        pregunta: |
          ¿Cuántos kilogramos de Sn hay que añadir para que, a 183,5 °C, todo
          sea líquido?
        respuesta:
          tipo: magnitud
          valor: '10.05 kg'
          tolerancia: 0.03
          formato: una masa, con su unidad
        distractores:
          - valor: '3.83 kg'
            mensaje: |
              Has calculado el 61,9 − 30 = 31,9 % de los 12 kg de partida,
              como si la masa total no creciera. Al añadir estaño crece todo,
              y el componente que no cambia es el plomo: 8,4 kg.
          - valor: '22.05 kg'
            mensaje: |
              Esa es la masa total de la aleación cuando ya funde entera. Lo
              que se ha añadido es la diferencia con los 12 kg de partida.
        pista: |
          El plomo no cambia: $12\cdot 0{,}70 = 8{,}4\ \text{kg}$. Esos 8,4 kg
          tienen que ser el 38,1 % de la aleación nueva.
        desarrollo: |
          $$
          m_{\text{total}} = \frac{8{,}4}{1 - 0{,}619} = 22{,}05\ \text{kg}
          \qquad
          m_{\text{Sn añadido}} = 22{,}05 - 12 = 10{,}05\ \text{kg}
          $$

      - tipo: calcular
        titulo: d) La proporción de líquido con 11 kg más de estaño
        pregunta: |
          Con los 11 kg de Sn añadidos, ¿qué porcentaje de la masa es líquido?
        respuesta:
          tipo: numero
          valor: '64.7'
          tolerancia: 1.5
          formato: un porcentaje de líquido, sin el símbolo
        distractores:
          - valor: '35.3'
            mensaje: |
              Ese es el porcentaje de β. Has tomado el brazo de $C_0$ hacia el
              líquido; el del líquido es el opuesto, de $C_0$ a β:
              $97{,}8 - 74{,}6$.
          - valor: '95.6'
            mensaje: |
              Has sumado los 11 kg a los 12 de partida y te has olvidado de los
              10 kg del apartado c). Así la aleación sale con 63,5 % Sn, casi
              en el eutéctico; con todo lo añadido tiene 74,6 % Sn.
        pista: |
          Primero la composición: $3{,}6 + 10{,}05 + 11$ kg de Sn en
          $33{,}05$ kg. Después la palanca entre $C_{\text{L}} = 61{,}9$ y
          $C_\beta = 97{,}8$.
        desarrollo: |
          $$
          C_0 = \frac{3{,}6 + 10{,}05 + 11}{22{,}05 + 11}\cdot 100 = 74{,}6\ \%\ \text{Sn}
          $$

          A 183,5 °C y con 74,6 % Sn la aleación está en β + L:

          $$
          W_{\text{L}} = \frac{97{,}8 - 74{,}6}{97{,}8 - 61{,}9} = \frac{23{,}2}{35{,}9} = 0{,}647
          $$

      - tipo: reconocer
        pregunta: |
          e) Se enfría lentamente hasta temperatura ambiente. ¿Qué verá el
          empleado al microscopio?
        opciones:
          - texto: >-
              Granos grandes de β primario rodeados de eutéctico laminar, con
              láminas alternas de α y β
            correcta: true
            mensaje: |
              Eso es. Con 74,6 % Sn la aleación es hipereutéctica: el β que
              ya había a 183,5 °C es el primario, y el líquido de 61,9 % Sn se
              convierte en eutéctico al cruzar los 183 °C.
          - texto: >-
              Granos de α primario rodeados de eutéctico laminar
            mensaje: |
              Eso es lo que se ve a la izquierda del eutéctico. La aleación
              tiene 74,6 % Sn, a la derecha: lo primero que solidificó fue β.
          - texto: >-
              Solo eutéctico laminar, porque ha pasado por la isoterma
              eutéctica
            mensaje: |
              Solo sale eutéctico entero con 61,9 % Sn exacto. Aquí antes de
              la isoterma ya había un 35 % de β sólido, y ese β sigue ahí como
              microconstituyente propio.

      - tipo: calcular
        titulo: e) La fase α a temperatura ambiente
        pregunta: |
          A temperatura ambiente, ¿qué fracción de la masa es fase α? Toma α
          con 2 % Sn y β con 99 % Sn, que es donde acaban las dos solvus.
        respuesta:
          tipo: numero
          valor: '0.252'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.292'
            mensaje: |
              Has usado los extremos de la isoterma eutéctica, 18,3 y 97,8.
              Esos valen a 183 °C. Al enfriar, las dos solvus se abren y a
              temperatura ambiente α tiene un 2 % Sn y β un 99 %.
          - valor: '0.646'
            mensaje: |
              Esa es la fracción de **eutéctico**, un microconstituyente. El
              eutéctico no es α: son láminas de α y de β, y la mayor parte de
              su masa es β.
          - valor: '0.748'
            mensaje: |
              Esa es $W_\beta$. Has tomado el brazo de α a $C_0$; la fracción
              de α es el brazo opuesto, de $C_0$ a β: $99 - 74{,}6$.
        pista: |
          $W_\alpha = \dfrac{C_\beta - C_0}{C_\beta - C_\alpha}$ con los
          extremos a temperatura ambiente.
        desarrollo: |
          $$
          W_\alpha = \frac{99 - 74{,}6}{99 - 2} = \frac{24{,}4}{97} = 0{,}252
          \qquad
          W_\beta = 0{,}748
          $$

      - tipo: calcular
        titulo: e) El β primario
        pregunta: |
          ¿Qué fracción de la masa es microconstituyente β primario?
        respuesta:
          tipo: numero
          valor: '0.353'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.748'
            mensaje: |
              Esa es la **fase** β, que cuenta también la β de las láminas del
              eutéctico. El β primario es solo el que se formó antes de
              183 °C, y su palanca empieza en el eutéctico, 61,9.
          - valor: '0.647'
            mensaje: |
              Esa es la fracción de eutéctico. Has tomado el brazo que va de
              $C_0$ a β; para el β primario es el que va del eutéctico a
              $C_0$: $74{,}6 - 61{,}9$.
        pista: |
          $W_{\beta'} = \dfrac{C_0 - C_{\text{E}}}{C_\beta - C_{\text{E}}}$,
          con los extremos de la isoterma eutéctica, que es donde se reparten.
        desarrollo: |
          $$
          W_{\beta'} = \frac{74{,}6 - 61{,}9}{97{,}8 - 61{,}9} = \frac{12{,}7}{35{,}9} = 0{,}353
          \qquad
          W_{\text{E}} = 0{,}647
          $$

          Coincide con la fracción de líquido del apartado d): ese líquido es
          el que se hace eutéctico.

      - tipo: justificar
        pregunta: Ordena la historia de la aleación. Una pieza es falsa.
        piezas:
          - texto: >-
              A 183,5 °C, con 30 % Sn, hay α de 18,3 % Sn y líquido de 61,9 %
              Sn; la palanca da 3,22 kg de líquido.
          - texto: >-
              Para fundirla entera a esa temperatura hay que llegar a 61,9 %
              Sn, y como el plomo no cambia hacen falta 10 kg de estaño.
          - texto: >-
              Con 11 kg más la aleación tiene 74,6 % Sn y queda en β + L, con
              un 65 % de líquido.
          - texto: >-
              Al enfriar, ese líquido da eutéctico y el β que había queda como
              β primario, un 35 % de la masa.
          - texto: >-
              Como la aleación tiene 74,6 % Sn, a temperatura ambiente es un
              74,6 % de fase β.
            trampa: true
            mensaje: |
              La composición no es la fracción de fase. La β tiene 99 % Sn y la
              α 2 %, así que para que la media salga 74,6 hace falta un 74,8 %
              de β: sale parecido por casualidad, y en otra aleación no
              saldría.
    resolucion: |
      **a) A 183,5 °C.** La aleación está en α + L, medio grado por encima de
      la eutéctica. La palanca da la fracción de líquido:

      $$
      W_{\text{L}} = \frac{30 - 18{,}3}{61{,}9 - 18{,}3} = 0{,}268
      \qquad
      m_{\text{L}} = 0{,}268\cdot 12 = 3{,}22\ \text{kg}
      $$

      **b) Fusión total.** Hay que llegar a la línea de líquidus en la
      vertical de 30 % Sn. El listado lee 250 °C; la lectura cuidadosa de la
      figura da 257 °C. La casilla acepta las dos.

      **c) Estaño añadido.** Para que todo sea líquido a 183,5 °C, la
      aleación tiene que tener 61,9 % Sn. El plomo no cambia:

      $$
      m_{\text{total}} = \frac{12\cdot 0{,}70}{1 - 0{,}619} = 22{,}05\ \text{kg}
      \qquad
      m_{\text{Sn}} = 22{,}05 - 12 = 10{,}05\ \text{kg}
      $$

      **d) Otros 11 kg de Sn.** La aleación pasa a
      $24{,}65/33{,}05 = 74{,}6\ \%\ \text{Sn}$, en β + L:

      $$
      W_{\text{L}} = \frac{97{,}8 - 74{,}6}{97{,}8 - 61{,}9} = 0{,}647
      $$

      **e) A temperatura ambiente.** Granos de β primario en una matriz de
      eutéctico laminar α + β. Las fases, con los extremos de las solvus a
      temperatura ambiente, y los microconstituyentes, con los de la
      isoterma eutéctica:

      $$
      W_\alpha = \frac{99 - 74{,}6}{99 - 2} = 0{,}252
      \qquad
      W_\beta = 0{,}748
      \qquad
      W_{\beta'} = \frac{74{,}6 - 61{,}9}{97{,}8 - 61{,}9} = 0{,}353
      \qquad
      W_{\text{E}} = 0{,}647
      $$

      El listado da 3,22 kg, 250 °C, 10 kg, 64 % de líquido y 0,255 /
      0,745 / 0,340 / 0,660. Todo coincide dentro de la lectura del
      diagrama. El 0,340 del β primario sale de poner $C_\beta = 99$ —el
      extremo a temperatura ambiente— junto a $C_{\text{E}} = 61{,}9$. Los
      microconstituyentes se reparten en la isoterma eutéctica, donde β
      tiene 97,8; aquí la diferencia es de una centésima y la casilla acepta
      las dos. En el 4.19 ese mismo atajo cambia el resultado entero.

      **Lo que hay que llevarse.** Al añadir un componente, el que no se
      toca es el que fija la masa nueva. Y la fracción de líquido de d) es
      exactamente el eutéctico de e): el líquido que queda al llegar a
      183 °C es el que se convierte en eutéctico.

  - id: ejcm4-col414-alfa-y-mg2pb-en-una-proporcion-dada
    titulo: α y Mg₂Pb en una proporción dada
    fuente: >-
      Ejercicio 4.14 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      A partir de una aleación magnesio-plomo de composición 30 % Pb - 70 Mg,
      ¿es posible tener fase α en equilibrio con fase Mg₂Pb con una masa de
      7,39 y 3,81 kg, respectivamente? En caso afirmativo, ¿cuál es la
      temperatura de la aleación? En caso negativo, explica la causa. (Ver
      figura 2).
    pide: Si es posible, y en ese caso la temperatura de la aleación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se decide si esas dos masas son posibles?
        opciones:
          - texto: >-
              Con la palanca se saca qué composición tendría que tener la α;
              si esa composición está en la solvus de α, es posible, y la
              solvus da la temperatura
            correcta: true
            mensaje: |
              Eso es. El Mg₂Pb tiene composición fija, 81 % Pb, y la α no: su
              composición baja por la solvus al enfriar. Cada temperatura da
              una proporción distinta, y la pregunta es si alguna da esta.
          - texto: >-
              Es imposible: α y Mg₂Pb solo están juntas en la isoterma
              eutéctica, a 465 °C
            mensaje: |
              La región α + Mg₂Pb ocupa todo lo que hay debajo de la isoterma
              y a la izquierda de 81 % Pb, hasta temperatura ambiente. La
              isoterma es solo su techo.
          - texto: >-
              Siempre es posible: bajando la temperatura se consigue
              cualquier proporción
            mensaje: |
              No cualquiera. La α puede ir de 41 % Pb a casi 0, así que la
              fracción de Mg₂Pb tiene un techo y un suelo. Si la palanca
              pidiera una α fuera de ese intervalo, sería imposible.

      - tipo: calcular
        titulo: La composición que tendría que tener la α
        pregunta: |
          ¿Qué porcentaje de Pb tiene que tener la α para que haya 7,39 kg de
          α y 3,81 kg de Mg₂Pb?
        respuesta:
          tipo: numero
          valor: '3.8'
          tolerancia: 0.3
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '28.3'
            mensaje: |
              Has tomado el Mg₂Pb con 33,3 % Pb, que es su composición
              **atómica** —un átomo de Pb de cada tres—, la del eje de arriba.
              La palanca va en masa, y en masa el Mg₂Pb tiene 81 % Pb.
          - valor: '-68.9'
            mensaje: |
              Has cambiado las fracciones de sitio: 0,660 al Mg₂Pb y 0,340 a la
              α. Una composición negativa es la señal. Con 30 % Pb la
              aleación está mucho más cerca de α que del Mg₂Pb, así que la α
              es la fase mayoritaria.
        pista: |
          Balance de plomo: $C_0 = W_\alpha C_\alpha + W_{\text{Mg}_2\text{Pb}}\,C_{\text{Mg}_2\text{Pb}}$,
          con $W_\alpha = 7{,}39/11{,}2$.
        desarrollo: |
          $$
          W_\alpha = \frac{7{,}39}{11{,}2} = 0{,}660
          \qquad
          W_{\text{Mg}_2\text{Pb}} = \frac{3{,}81}{11{,}2} = 0{,}340
          $$

          $$
          30 = 0{,}660\,C_\alpha + 0{,}340\cdot 81
          \;\Longrightarrow\;
          C_\alpha = \frac{30 - 27{,}56}{0{,}660} = 3{,}7\ \%\ \text{Pb}
          $$

          Con 80,7 % Pb para el Mg₂Pb, que es donde la figura dibuja la
          vertical, sale 3,9.

      - tipo: calcular
        titulo: La temperatura
        pregunta: |
          ¿A qué temperatura tiene la α esa composición?
        respuesta:
          tipo: magnitud
          valor: '191 °C'
          tolerancia: 0.022
          formato: una temperatura, con su unidad
        distractores:
          - valor: '465 °C'
            mensaje: |
              Esa es la isoterma eutéctica. Ahí la α tiene 41 % Pb y la
              aleación de 30 % Pb todavía está en α sola. La proporción que
              te piden aparece mucho más abajo, cuando la α ya ha expulsado
              casi todo su plomo.
          - valor: '627 °C'
            mensaje: |
              Has cortado la línea de sólidus, la de arriba de la región α. A
              3,8 % Pb hay dos fronteras: la sólidus, donde empieza a fundir,
              y la solvus, donde empieza a salir Mg₂Pb. La que separa α de α +
              Mg₂Pb es la de abajo.
        pista: |
          Busca 3,8 % Pb en la solvus de α, la curva que baja desde 41 % Pb
          en la isoterma hasta casi 0 a temperatura ambiente.
        desarrollo: |
          La solvus de α pasa por 3,6 % Pb a 190 °C y por 4,3 % Pb a 200 °C.
          Para $C_\alpha = 3{,}7$–$3{,}9$ la temperatura es de unos
          $190\ ^{\circ}\text{C}$.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La aleación de 30 % Pb tiene 11,2 kg, y las fracciones serían
              0,660 de α y 0,340 de Mg₂Pb.
          - texto: >-
              El Mg₂Pb tiene composición fija, 81 % Pb, así que el balance de
              plomo fija la de la α, 3,8 % Pb.
          - texto: >-
              Una α de 3,8 % Pb está en la solvus: es posible, y ocurre hacia
              190 °C.
          - texto: >-
              Como el Mg₂Pb es un compuesto de composición fija, su fracción
              es la misma a cualquier temperatura por debajo de 465 °C.
            trampa: true
            mensaje: |
              El Mg₂Pb no cambia de composición, pero la α sí: baja por la
              solvus al enfriar y expulsa plomo, que sale como más Mg₂Pb. Por
              eso la fracción de Mg₂Pb crece al bajar la temperatura, y por
              eso hay una temperatura concreta que da esta proporción.
    resolucion: |
      **Las fracciones.** La masa total es $7{,}39 + 3{,}81 = 11{,}2$ kg:

      $$
      W_\alpha = 0{,}660
      \qquad
      W_{\text{Mg}_2\text{Pb}} = 0{,}340
      $$

      **La α que haría falta.** El Mg₂Pb tiene 81 % Pb, siempre. El balance
      de plomo fija la composición de la α:

      $$
      30 = 0{,}660\,C_\alpha + 0{,}340\cdot 81
      \;\Longrightarrow\;
      C_\alpha = 3{,}7\ \%\ \text{Pb}
      $$

      **¿Existe esa α?** Sí: la solvus de α baja desde 41 % Pb a 465 °C
      hasta casi 0, y pasa por 3,7 % Pb hacia 190 °C. Es posible, y la
      aleación está a unos 190 °C.

      Coincide con el listado, que da 190 °C. La lectura cuidadosa de la
      figura da 191 °C, y la casilla acepta las dos.

      **Lo que hay que llevarse.** Por debajo de la isoterma las fracciones
      de α y Mg₂Pb cambian con la temperatura aunque el compuesto no cambie:
      lo que se mueve es la α. La palanca da la composición, y la solvus, la
      temperatura.

  - id: ejcm4-col415-la-temperatura-desde-la-que-se-templo
    titulo: La temperatura desde la que se templó
    fuente: >-
      Ejercicio 4.15 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se templa rápidamente, con el fin de mantener la microestructura, una
      aleación 60 % Pb - 40 % Mg desde una elevada temperatura hasta
      temperatura ambiente. Esta microestructura consiste en fase α y Mg₂Pb,
      cuyas respectivas fracciones de masa son 0,42 y 0,58. Determina la
      temperatura aproximada desde la que se ha templado. (Ver figura 2).
    pide: La temperatura desde la que se templó la aleación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el temple permite saber la temperatura?
        opciones:
          - texto: >-
              Porque congela las fracciones de equilibrio de la temperatura
              desde la que se templó, y cada temperatura da unas distintas
            correcta: true
            mensaje: |
              Eso es. Enfriando rápido no hay tiempo para que la α expulse
              más plomo, así que a temperatura ambiente se ve lo que había
              arriba. Se busca la temperatura cuya palanca da 0,42 / 0,58.
          - texto: >-
              No lo permite: las fracciones medidas son las de temperatura
              ambiente, que es donde se miran
            mensaje: |
              Eso pasaría enfriando lento. El temple es justo para evitarlo:
              la microestructura se queda como estaba a la temperatura de
              partida.
          - texto: >-
              Porque el Mg₂Pb solo se forma en la isoterma eutéctica, y esa
              es la temperatura
            mensaje: |
              El Mg₂Pb también sale de la α al bajar por la solvus, así que su
              fracción depende de la temperatura. Si todo fuera de la
              isoterma, la fracción sería la misma a cualquier temperatura.

      - tipo: calcular
        titulo: La composición de la α
        pregunta: |
          ¿Qué porcentaje de Pb tiene la α para que las fracciones sean 0,42 y
          0,58?
        respuesta:
          tipo: numero
          valor: '31.2'
          tolerancia: 1
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '44.9'
            mensaje: |
              Has cambiado las fracciones de sitio: 0,42 al Mg₂Pb. La α de
              este sistema no pasa nunca de 41 % Pb, así que un 44,9 no está
              en el diagrama. La señal de que los brazos estaban cruzados.
        pista: |
          $W_\alpha = \dfrac{C_{\text{Mg}_2\text{Pb}} - C_0}{C_{\text{Mg}_2\text{Pb}} - C_\alpha} = 0{,}42$,
          y se despeja $C_\alpha$.
        desarrollo: |
          $$
          0{,}42 = \frac{81 - 60}{81 - C_\alpha}
          \;\Longrightarrow\;
          81 - C_\alpha = \frac{21}{0{,}42} = 50
          \;\Longrightarrow\;
          C_\alpha = 31\ \%\ \text{Pb}
          $$

          Con 80,7 % Pb para el Mg₂Pb sale 31,4.

      - tipo: calcular
        titulo: La temperatura de temple
        pregunta: |
          ¿Desde qué temperatura se templó?
        respuesta:
          tipo: magnitud
          valor: '398 °C'
          tolerancia: 0.015
          formato: una temperatura, con su unidad
        distractores:
          - valor: '514 °C'
            mensaje: |
              Has cortado la línea de sólidus, la frontera de arriba de α. A
              31 % Pb hay dos: la sólidus (α / α + L) y la solvus (α / α +
              Mg₂Pb). Aquí hay α y Mg₂Pb, no líquido: la que vale es la solvus.
          - valor: '465 °C'
            mensaje: |
              Esa es la isoterma eutéctica. Ahí la α tiene 41 % Pb y la
              fracción de α sería 0,53, no 0,42. Hay que bajar hasta que la α
              tenga 31 % Pb.
        pista: |
          Busca 31 % Pb en la solvus de α, la curva que baja desde el extremo
          izquierdo de la isoterma eutéctica.
        desarrollo: |
          La solvus pasa por 31,6 % Pb a 400 °C y por 30 % Pb a 390 °C. Para
          $C_\alpha = 31$–$31{,}4$ la temperatura es de unos
          $400\ ^{\circ}\text{C}$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El temple congela la microestructura: 0,42 de α y 0,58 de Mg₂Pb
              son las fracciones de equilibrio de la temperatura de partida.
          - texto: >-
              Con el Mg₂Pb en 81 % Pb, la palanca pide una α de 31 % Pb.
          - texto: >-
              La solvus de α pasa por 31 % Pb hacia 400 °C: esa es la
              temperatura desde la que se templó.
          - texto: >-
              Si se hubiera enfriado despacio, a temperatura ambiente se
              verían las mismas fracciones, 0,42 y 0,58.
            trampa: true
            mensaje: |
              Enfriando despacio la α seguiría la solvus hasta casi 0 % Pb, y
              todo ese plomo saldría como Mg₂Pb. A temperatura ambiente
              quedaría alrededor de un 26 % de α. Por eso el temple es la
              clave del problema.
    resolucion: |
      **Qué dice el temple.** La microestructura templada conserva las
      fracciones de equilibrio de la temperatura desde la que se templó. Hay
      que encontrar la temperatura a la que la palanca da 0,42 de α.

      **La composición de la α.** Con el Mg₂Pb en 81 % Pb:

      $$
      0{,}42 = \frac{81 - 60}{81 - C_\alpha}
      \;\Longrightarrow\;
      C_\alpha = 81 - \frac{21}{0{,}42} = 31\ \%\ \text{Pb}
      $$

      **La temperatura.** La solvus de α pasa por 31 % Pb hacia 400 °C. Se
      templó desde unos 400 °C.

      Coincide con el listado, que da 400 °C. La lectura cuidadosa de la
      figura da entre 397 y 399 °C, y la casilla acepta cualquier valor a
      unos diez grados de ahí.

      **Lo que hay que llevarse.** Es el 4.14 al revés: allí se daban las
      masas en equilibrio y aquí las fracciones de un temple, pero en los dos
      la palanca da la composición de la α y la solvus la convierte en una
      temperatura.

  - id: ejcm4-col416-alfa-primaria-y-alfa-total-que-no-casan
    titulo: Una α primaria y una α total que no casan
    fuente: >-
      Ejercicio 4.16 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      A partir de 6,7 kg de una aleación Pb-Mg, ¿es posible tener 4,23 kg de α
      primaria y 6 kg de α total a 460 °C? Justifica la respuesta. (Ver
      figura 2).
    pide: Si esas dos masas son compatibles, justificándolo con números.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se comprueba si los dos datos son compatibles?
        opciones:
          - texto: >-
              Cada dato da una composición de la aleación con su palanca; si
              las dos composiciones no coinciden, es imposible
            correcta: true
            mensaje: |
              Eso es. La α total sale de la palanca de fases, entre α y Mg₂Pb.
              La α primaria sale de la de microconstituyentes, entre α y el
              eutéctico. Una aleación solo tiene una composición.
          - texto: >-
              Es posible, porque 4,23 kg de α primaria es menos que 6 kg de α
              total
            mensaje: |
              Es una condición necesaria, no suficiente. Que la α primaria sea
              menor que la total es obligatorio, pero además cada cantidad fija
              la composición de la aleación, y las dos tienen que dar la misma.
          - texto: >-
              Es posible si las dos fracciones están entre 0 y 1
            mensaje: |
              0,631 y 0,896 están las dos entre 0 y 1, y aun así no casan. Las
              dos fracciones no son independientes: para una composición dada,
              la palanca las fija a las dos.

      - tipo: calcular
        titulo: La composición que da la α total
        pregunta: |
          Si hay 6 kg de α total en 6,7 kg a 460 °C, ¿qué porcentaje de Pb
          tiene la aleación?
        respuesta:
          tipo: numero
          valor: '44.7'
          tolerancia: 1
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '76.5'
            mensaje: |
              Has puesto la fracción de α en el brazo que va de α a $C_0$. Ese
              brazo es el del Mg₂Pb. La fracción de α es el que va de $C_0$ al
              Mg₂Pb: $80{,}7 - C_0$.
        pista: |
          A 460 °C la α tiene 40,5 % Pb y el Mg₂Pb 80,7 %.
          $W_\alpha = \dfrac{80{,}7 - C_0}{80{,}7 - 40{,}5} = \dfrac{6}{6{,}7}$.
        desarrollo: |
          $$
          \frac{6}{6{,}7} = 0{,}896 = \frac{80{,}7 - C_0}{80{,}7 - 40{,}5}
          \;\Longrightarrow\;
          C_0 = 80{,}7 - 0{,}896\cdot 40{,}2 = 44{,}7\ \%\ \text{Pb}
          $$

      - tipo: calcular
        titulo: La composición que da la α primaria
        pregunta: |
          Si hay 4,23 kg de α primaria en 6,7 kg, ¿qué porcentaje de Pb tiene
          la aleación?
        respuesta:
          tipo: numero
          valor: '50.4'
          tolerancia: 1
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '55.3'
            mensaje: |
              Has usado la palanca de **fases**, con el Mg₂Pb de extremo. La α
              primaria es un microconstituyente, y el otro microconstituyente
              es el eutéctico, de 66,5 % Pb: ese es el extremo.
          - valor: '57.1'
            mensaje: |
              Has cruzado los brazos: con 0,631 en el brazo de α a $C_0$
              saldría una aleación con más eutéctico que α primaria. La
              fracción de α primaria es el brazo que va de $C_0$ al
              eutéctico.
        pista: |
          $W_{\alpha'} = \dfrac{C_{\text{E}} - C_0}{C_{\text{E}} - C_\alpha}$,
          con $C_{\text{E}} = 66{,}5$ y $C_\alpha = 41$, los extremos de la
          isoterma eutéctica.
        desarrollo: |
          $$
          \frac{4{,}23}{6{,}7} = 0{,}631 = \frac{66{,}5 - C_0}{66{,}5 - 41}
          \;\Longrightarrow\;
          C_0 = 66{,}5 - 0{,}631\cdot 25{,}5 = 50{,}4\ \%\ \text{Pb}
          $$

      - tipo: justificar
        pregunta: Ordena la justificación. Una pieza es falsa.
        piezas:
          - texto: >-
              La α total es una fase: su palanca va de la α (40,5 % Pb) al
              Mg₂Pb (80,7 % Pb) y da una aleación de 44,7 % Pb.
          - texto: >-
              La α primaria es un microconstituyente: su palanca va de la α
              (41 % Pb) al eutéctico (66,5 % Pb) y da 50,4 % Pb.
          - texto: >-
              Una aleación tiene una sola composición, así que los dos datos
              no pueden darse a la vez.
          - texto: >-
              Como la α primaria es menor que la α total, los dos datos son
              compatibles.
            trampa: true
            mensaje: |
              Eso solo dice que no son absurdos. Con 50,4 % Pb, que es lo que
              pide la α primaria, la α total sería 0,754 de 6,7 kg, o sea
              5,05 kg, no 6. Los dos datos piden aleaciones distintas.
    resolucion: |
      **Por la α total.** A 460 °C la aleación está en α + Mg₂Pb, con la α
      en 40,5 % Pb y el Mg₂Pb en 80,7 %:

      $$
      \frac{6}{6{,}7} = \frac{80{,}7 - C_0}{80{,}7 - 40{,}5}
      \;\Longrightarrow\;
      C_0 = 44{,}7\ \%\ \text{Pb}
      $$

      **Por la α primaria.** Los microconstituyentes se reparten en la
      isoterma eutéctica, entre la α de 41 % Pb y el eutéctico de 66,5 %:

      $$
      \frac{4{,}23}{6{,}7} = \frac{66{,}5 - C_0}{66{,}5 - 41}
      \;\Longrightarrow\;
      C_0 = 50{,}4\ \%\ \text{Pb}
      $$

      **No casan.** Cada dato pide una aleación distinta, así que no es
      posible. Visto al revés: la aleación de 50,4 % Pb tendría a 460 °C

      $$
      W_\alpha = \frac{80{,}7 - 50{,}4}{80{,}7 - 40{,}5} = 0{,}754
      \quad\Longrightarrow\quad
      0{,}754\cdot 6{,}7 = 5{,}05\ \text{kg de } \alpha \text{ total, no 6}
      $$

      Coincide con el listado: «No es posible. Partiendo de ambos datos, se
      llega a valores de Co diferentes». Con 41 y 67 % Pb para los extremos
      —la lectura redonda de la figura— salen 45,2 y 50,6: la conclusión no
      cambia.

      **Lo que hay que llevarse.** La α primaria y la α total no son dos
      datos libres. Dada la composición, la palanca de fases fija una y la de
      microconstituyentes la otra.

  - id: ejcm4-col417-el-diagrama-plomo-magnesio-explicado
    titulo: El diagrama plomo-magnesio, explicado
    fuente: >-
      Ejercicio 4.17 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      Explica el diagrama de fases Pb-Mg (ver figura 2), indicando las fases y
      puntos invariantes presentes en el mismo.
    pide: Las fases del diagrama Pb-Mg y sus puntos invariantes, con lo que ocurre en cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la línea vertical en 81 % Pb?
        opciones:
          - texto: >-
              El compuesto intermedio Mg₂Pb, de composición fija, que parte el
              diagrama en dos diagramas eutécticos: Mg–Mg₂Pb y Mg₂Pb–Pb
            correcta: true
            mensaje: |
              Eso es. Un compuesto tiene una estequiometría, así que en el
              diagrama es una línea y no una región. Cada mitad se lee como un
              diagrama eutéctico sencillo, con el Mg₂Pb haciendo de componente
              puro.
          - texto: >-
              Una disolución sólida intermedia, que admite un intervalo de
              composiciones alrededor de 81 % Pb
            mensaje: |
              Una disolución sólida ocupa una región con anchura, como la α
              de la izquierda. El Mg₂Pb es una línea: no admite más plomo ni
              menos que el de su fórmula.
          - texto: >-
              La frontera entre la zona donde manda el magnesio y la zona
              donde manda el plomo
            mensaje: |
              Esa frontera estaría en 50 % y no es una línea del diagrama.
              Esta vertical es una sustancia: el compuesto Mg₂Pb, con 2 átomos
              de Mg por cada uno de Pb.

      - tipo: reconocer
        pregunta: |
          ¿Qué ocurre en los puntos invariantes del diagrama?
        opciones:
          - texto: >-
              Dos eutécticos —a 465 °C, L → α + Mg₂Pb, y a 250 °C, L → Mg₂Pb
              + β— y la fusión congruente del Mg₂Pb en el máximo M, hacia
              550 °C
            correcta: true
            mensaje: |
              Eso es. En cada eutéctico coexisten tres fases, y el líquido da
              los dos sólidos de su mitad. En M el compuesto funde sin cambiar
              de composición: sólido y líquido de 81 % Pb.
          - texto: >-
              Dos eutécticos que dan α + β, uno a cada lado del Mg₂Pb
            mensaje: |
              α y β no están nunca en contacto: el Mg₂Pb está en medio. El
              eutéctico de la izquierda da α + Mg₂Pb, y el de la derecha,
              Mg₂Pb + β.
          - texto: >-
              Un eutéctico a 465 °C y un peritéctico en el máximo M
            mensaje: |
              En un peritéctico un sólido y un líquido dan otro sólido. En M
              no pasa eso: el Mg₂Pb funde y da un líquido de su misma
              composición, que es una fusión congruente.

      - tipo: calcular
        titulo: La composición del Mg₂Pb
        pregunta: |
          Con $M_{\text{Mg}} = 24{,}31$ y $M_{\text{Pb}} = 207{,}2$ g/mol, ¿qué
          porcentaje **en masa** de Pb tiene el Mg₂Pb?
        respuesta:
          tipo: numero
          valor: '81.0'
          tolerancia: 0.5
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '33.3'
            mensaje: |
              Ese es el porcentaje **atómico**: un átomo de Pb de cada tres.
              Es el que marca el eje de arriba de la figura. El de abajo, el
              que se usa en las palancas, va en masa, y el Pb pesa ocho veces
              más que el Mg.
          - valor: '89.5'
            mensaje: |
              Te has dejado el subíndice: has puesto un Mg en vez de dos. En
              el Mg₂Pb hay $2\cdot 24{,}31 = 48{,}62$ g de Mg por cada mol.
        pista: |
          $\%\,\text{Pb} = \dfrac{M_{\text{Pb}}}{M_{\text{Pb}} + 2M_{\text{Mg}}}\cdot 100$.
        desarrollo: |
          $$
          \%\,\text{Pb} = \frac{207{,}2}{207{,}2 + 2\cdot 24{,}31}\cdot 100
          = \frac{207{,}2}{255{,}82}\cdot 100 = 81{,}0
          $$

          Es la vertical de la figura, que cae justo a la derecha del 80.

      - tipo: calcular
        titulo: La temperatura del eutéctico del lado del magnesio
        pregunta: |
          ¿A qué temperatura ocurre la reacción L → α + Mg₂Pb?
        respuesta:
          tipo: magnitud
          valor: '465 °C'
          tolerancia: 0.015
          formato: una temperatura, con su unidad
        distractores:
          - valor: '250 °C'
            mensaje: |
              Esa es la isoterma del otro eutéctico, el del lado del plomo,
              donde el líquido da Mg₂Pb + β. La de α + Mg₂Pb es la horizontal
              larga de la mitad izquierda.
          - valor: '546 °C'
            mensaje: |
              Ese es el máximo M, donde funde el Mg₂Pb. No es un eutéctico:
              ahí solo hay dos fases, sólido y líquido de la misma
              composición.
        pista: |
          Es la horizontal que va desde el extremo de la región α hasta la
          vertical del Mg₂Pb.
        desarrollo: |
          La isoterma de la mitad izquierda está a unos
          $465\ ^{\circ}\text{C}$, entre la α de 41 % Pb y el Mg₂Pb, con el
          punto eutéctico hacia 66,5 % Pb.

      - tipo: justificar
        pregunta: Ordena la explicación del diagrama. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay cuatro fases: el líquido, la α rica en Mg, el compuesto
              Mg₂Pb y la β rica en Pb.
          - texto: >-
              El Mg₂Pb, con 81 % Pb, parte el diagrama en dos eutécticos
              sencillos.
          - texto: >-
              A 465 °C el líquido de unos 66,5 % Pb da α de 41 % Pb y Mg₂Pb;
              a 250 °C el de unos 97 % Pb da Mg₂Pb y β.
          - texto: >-
              En M, hacia 550 °C, el Mg₂Pb funde de forma congruente, sin
              cambiar de composición.
          - texto: >-
              En M coexisten tres fases, como en un eutéctico, y por eso es un
              punto invariante.
            trampa: true
            mensaje: |
              En M solo hay dos fases, el Mg₂Pb sólido y el líquido, y tienen
              la misma composición. Es invariante porque es un máximo de
              fusión, no porque haya tres fases. Los puntos de tres fases son
              los dos eutécticos.
    resolucion: |
      **Las fases.** Hay cuatro:

      - **L**, el líquido, en toda la parte de arriba.
      - **α**, una disolución sólida de Pb en Mg. Disuelve mucho plomo a
        alta temperatura, hasta 41 % Pb a 465 °C, y casi nada a
        temperatura ambiente.
      - **Mg₂Pb**, un compuesto intermedio de composición fija: la vertical
        de 81 % Pb.
      - **β**, una disolución sólida de Mg en Pb, estrecha, pegada al borde
        derecho.

      Las regiones de dos fases son α + L, L + Mg₂Pb (a los dos lados de M),
      α + Mg₂Pb, β + L y Mg₂Pb + β.

      **La composición del compuesto.** En masa:

      $$
      \%\,\text{Pb} = \frac{207{,}2}{207{,}2 + 2\cdot 24{,}31}\cdot 100 = 81{,}0
      $$

      **Los puntos invariantes.**

      - **Eutéctico del lado del Mg**, a unos 465 °C:
        L (≈ 66,5 % Pb) → α (41 % Pb) + Mg₂Pb (81 % Pb).
      - **Eutéctico del lado del Pb**, a unos 250 °C:
        L (≈ 97 % Pb) → Mg₂Pb + β (≈ 99 % Pb).
      - **Fusión congruente del Mg₂Pb** en el máximo M, hacia 550 °C: el
        compuesto funde y da un líquido de su misma composición.
      - Y los puntos de fusión de los componentes puros: el Mg hacia 650 °C
        y el Pb a 327 °C.

      **Cómo se lee.** El Mg₂Pb se comporta como un componente puro más.
      Entre 0 y 81 % Pb el diagrama es un eutéctico Mg–Mg₂Pb, y entre 81 y
      100 % Pb, otro eutéctico Mg₂Pb–Pb. Cada problema de este diagrama se
      resuelve en su mitad, con la vertical del compuesto de extremo.

      La colección no imprime resultado; esta resolución es nuestra. Las
      temperaturas y composiciones sin rótulo en la figura están leídas
      sobre ella.

  - id: ejcm4-col418-una-aleacion-con-50-de-plomo-al-enfriar
    titulo: Una aleación con 50 % de plomo, enfriándose
    fuente: >-
      Ejercicio 4.18 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      Considerando el diagrama de fases Pb-Mg (ver figura 2), esquematiza las
      microestructuras y determina las composiciones de las fases y
      fracciones de masa de los microconstituyentes presentes al enfriar una
      aleación que contiene un 50 % en masa de Pb, desde el estado líquido
      hasta las siguientes temperaturas: 500 °C, $T_{\text{E}}$ ± 1 °C y
      200 °C.
    pide: >-
      Las fases con sus composiciones, y las fracciones de microconstituyentes,
      a 500 °C, justo encima y debajo de la eutéctica, y a 200 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con 50 % Pb, ¿qué microconstituyentes tendrá la aleación por debajo
          de la isoterma eutéctica?
        opciones:
          - texto: >-
              α primario y eutéctico (α + Mg₂Pb): la aleación está entre 41 y
              66,5 % Pb, en el lado hipoeutéctico
            correcta: true
            mensaje: |
              Eso es. Al enfriar sale primero α, y el líquido que queda se
              enriquece en plomo hasta 66,5 % Pb. Al cruzar 465 °C ese
              líquido da el eutéctico.
          - texto: >-
              Mg₂Pb primario y eutéctico
            mensaje: |
              Eso le pasa a una aleación entre 66,5 y 81 % Pb, a la derecha
              del punto eutéctico. Con 50 % Pb lo que corta primero es la
              líquidus del lado de α.
          - texto: >-
              α y Mg₂Pb sueltos, sin eutéctico, porque la aleación está a la
              izquierda del Mg₂Pb
            mensaje: |
              Eso le pasa a una aleación con menos de 41 % Pb, que solidifica
              entera como α y después precipita Mg₂Pb. Con 50 % Pb la
              aleación corta la isoterma eutéctica y queda líquido que se
              convierte en eutéctico.

      - tipo: calcular
        titulo: A 500 °C, la composición del líquido
        pregunta: |
          A 500 °C la aleación está en α + L. ¿Qué porcentaje de Pb tiene el
          líquido?
        respuesta:
          tipo: numero
          valor: '61.7'
          tolerancia: 1.5
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '34.2'
            mensaje: |
              Has leído la sólidus: esa es la composición de la α. El líquido
              se lee en la otra punta de la isoterma, en la línea de
              líquidus.
          - valor: '50'
            mensaje: |
              Esa es la composición de la aleación entera. En una región de
              dos fases ninguna de las dos tiene la composición global: el
              líquido está más cargado de plomo y la α menos.
        pista: |
          Traza la horizontal de 500 °C y lee dónde corta la línea de
          líquidus, a la derecha de 50 % Pb.
        desarrollo: |
          La isoterma de 500 °C corta la sólidus en 34,2 % Pb, que es la α, y
          la líquidus en 61,7 % Pb, que es el líquido.

      - tipo: calcular
        titulo: A 500 °C, la α primaria
        pregunta: |
          A 500 °C, ¿qué fracción de la masa es α?
        respuesta:
          tipo: numero
          valor: '0.425'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.575'
            mensaje: |
              Esa es la fracción de líquido. Has tomado el brazo de α a $C_0$;
              la fracción de α es el opuesto, de $C_0$ al líquido:
              $61{,}7 - 50$.
        pista: |
          $W_\alpha = \dfrac{C_{\text{L}} - C_0}{C_{\text{L}} - C_\alpha}$.
        desarrollo: |
          $$
          W_\alpha = \frac{61{,}7 - 50}{61{,}7 - 34{,}2} = \frac{11{,}7}{27{,}5} = 0{,}425
          \qquad
          W_{\text{L}} = 0{,}575
          $$

          Aquí fase y microconstituyente coinciden: todo el sólido es α
          primario.

      - tipo: calcular
        titulo: Justo debajo de la eutéctica, el α primario
        pregunta: |
          A $T_{\text{E}} - 1$ °C, ¿qué fracción de la masa es
          microconstituyente α primario?
        respuesta:
          tipo: numero
          valor: '0.647'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.773'
            mensaje: |
              Esa es la fracción de **fase** α, con la palanca que acaba en el
              Mg₂Pb. El α primario es solo el que se formó antes de la
              isoterma; la α de las láminas del eutéctico no cuenta.
          - valor: '0.353'
            mensaje: |
              Esa es la fracción de eutéctico. Has tomado el brazo de α a
              $C_0$; el del α primario va de $C_0$ al eutéctico:
              $66{,}5 - 50$.
        pista: |
          Justo encima de $T_{\text{E}}$ hay α de 41 % Pb y líquido de 66,5 %.
          Justo debajo, ese líquido es el eutéctico, así que
          $W_{\alpha'} = \dfrac{66{,}5 - 50}{66{,}5 - 41}$.
        desarrollo: |
          $$
          W_{\alpha'} = \frac{66{,}5 - 50}{66{,}5 - 41} = \frac{16{,}5}{25{,}5} = 0{,}647
          \qquad
          W_{\text{E}} = 0{,}353
          $$

          A $T_{\text{E}} + 1$ °C son las mismas cifras, pero la segunda es
          líquido: 0,647 de α (41 % Pb) y 0,353 de L (66,5 % Pb).

      - tipo: calcular
        titulo: A 200 °C, la fase α
        pregunta: |
          A 200 °C, ¿qué fracción de la masa es **fase** α?
        respuesta:
          tipo: numero
          valor: '0.402'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.773'
            mensaje: |
              Has usado la α de 41 % Pb, la de la isoterma eutéctica. A 200 °C
              la α ha bajado por la solvus hasta 4,3 % Pb: ha expulsado casi
              todo su plomo como Mg₂Pb.
          - valor: '0.647'
            mensaje: |
              Esa es la fracción del microconstituyente α primario. Te piden
              la fase α a 200 °C, que es otra palanca: entre la α de 4,3 % Pb y
              el Mg₂Pb.
        pista: |
          A 200 °C la α tiene 4,3 % Pb y el Mg₂Pb 80,7 %.
        desarrollo: |
          $$
          W_\alpha = \frac{80{,}7 - 50}{80{,}7 - 4{,}3} = \frac{30{,}7}{76{,}4} = 0{,}402
          \qquad
          W_{\text{Mg}_2\text{Pb}} = 0{,}598
          $$

      - tipo: reconocer
        pregunta: |
          ¿Cómo es la microestructura a 200 °C?
        opciones:
          - texto: >-
              Granos de α primario, con finos precipitados de Mg₂Pb dentro,
              rodeados de eutéctico laminar α + Mg₂Pb
            correcta: true
            mensaje: |
              Eso es. Los microconstituyentes son los de justo debajo de la
              eutéctica, 0,647 y 0,353. Al bajar por la solvus, la α expulsa
              plomo, que precipita como Mg₂Pb dentro de los granos.
          - texto: >-
              Granos de α primario y eutéctico, igual que justo debajo de la
              eutéctica, sin nada nuevo
            mensaje: |
              Los microconstituyentes son los mismos, pero la α no se queda
              quieta: pasa de 41 a 4,3 % Pb, y ese plomo tiene que ir a
              algún sitio. Sale como Mg₂Pb, en precipitados dentro de la α.
          - texto: >-
              Granos de Mg₂Pb rodeados de α, porque a 200 °C hay más Mg₂Pb que α
            mensaje: |
              Que haya 0,598 de fase Mg₂Pb no cambia cómo se formó la
              microestructura. La mayor parte de ese Mg₂Pb está en las
              láminas del eutéctico y en los precipitados, no en granos
              propios.

      - tipo: justificar
        pregunta: Ordena el enfriamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A 500 °C hay α de 34,2 % Pb y líquido de 61,7 % Pb, con 0,425 de
              α primario.
          - texto: >-
              Justo encima de la eutéctica hay 0,647 de α (41 % Pb) y 0,353 de
              líquido (66,5 % Pb).
          - texto: >-
              Justo debajo, ese líquido es eutéctico: 0,647 de α primario y
              0,353 de eutéctico α + Mg₂Pb.
          - texto: >-
              A 200 °C la α tiene 4,3 % Pb; las fases son 0,402 de α y 0,598 de
              Mg₂Pb.
          - texto: >-
              A 200 °C el α primario ha bajado a 0,402, porque las fracciones
              de microconstituyentes siguen a la solvus igual que las de fase.
            trampa: true
            mensaje: |
              0,402 es la fracción de **fase** α. Los microconstituyentes se
              reparten en la reacción eutéctica y ahí se quedan: el α primario
              sigue siendo 0,647, ahora con precipitados de Mg₂Pb dentro.
    resolucion: |
      Con 50 % Pb la aleación está en la mitad Mg–Mg₂Pb, entre la α de
      41 % Pb y el punto eutéctico de 66,5 % Pb: es hipoeutéctica.

      **500 °C: α + L.** La isoterma corta la sólidus en 34,2 % Pb y la
      líquidus en 61,7 %:

      $$
      W_\alpha = \frac{61{,}7 - 50}{61{,}7 - 34{,}2} = 0{,}425
      \qquad
      W_{\text{L}} = 0{,}575
      $$

      Granos de α primario flotando en el líquido.

      **$T_{\text{E}}$ + 1 °C: α + L.** Hay α de 41 % Pb y líquido de
      66,5 %:

      $$
      W_\alpha = \frac{66{,}5 - 50}{66{,}5 - 41} = 0{,}647
      \qquad
      W_{\text{L}} = 0{,}353
      $$

      **$T_{\text{E}}$ − 1 °C.** Ese líquido ha dado el eutéctico. Las fases
      son α (41 % Pb) y Mg₂Pb (80,7 %):

      $$
      W_\alpha = \frac{80{,}7 - 50}{80{,}7 - 41} = 0{,}773
      \qquad
      W_{\text{Mg}_2\text{Pb}} = 0{,}227
      $$

      Y los microconstituyentes, 0,647 de α primario y 0,353 de eutéctico
      laminar α + Mg₂Pb.

      **200 °C.** La α ha bajado por la solvus hasta 4,3 % Pb:

      $$
      W_\alpha = \frac{80{,}7 - 50}{80{,}7 - 4{,}3} = 0{,}402
      \qquad
      W_{\text{Mg}_2\text{Pb}} = 0{,}598
      $$

      Los microconstituyentes siguen siendo 0,647 de α primario y 0,353 de
      eutéctico. El plomo que ha soltado la α sale como Mg₂Pb, en finos
      precipitados dentro de los granos de α primario y en las láminas del
      eutéctico.

      La colección no imprime resultado; esta resolución es nuestra. Las
      composiciones están leídas sobre la figura, que no rotula los puntos de
      este diagrama.

      **Lo que hay que llevarse.** Justo debajo de la eutéctica la fracción
      de eutéctico es la de líquido de justo encima. Y a partir de ahí las
      fases siguen cambiando con la solvus, pero los microconstituyentes ya
      no.

  - id: ejcm4-col419-la-composicion-que-da-el-analisis-del-laboratorio
    titulo: La composición que da el análisis del laboratorio
    fuente: >-
      Ejercicio 4.19 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica un resultado
      que no se reproduce con el método del tema; la resolución explica de
      dónde sale y por qué no vale.
    nivel: practica
    enunciado: |
      Considerando el diagrama de fases Pb-Mg (ver figura 2), una muestra de
      400 g de dicha aleación con composición desconocida ha sido analizada
      en el laboratorio a 300 °C y se ha detectado que contiene (en
      porcentaje másico): 44,4 % de α proeutéctico y 55,6 % de
      microconsituyente eutéctico. Halla la composición de la aleación.
      ¿Cuál es la cantidad total (en gramos) de fase α en la muestra? ¿Cuánto
      Pb (en gramos) hay en la fase α? Dibuja la microestructura de la
      muestra.
    pide: >-
      La composición de la aleación, la masa de fase α a 300 °C, el plomo que
      hay en esa α y la microestructura.
    pasos:
      - tipo: reconocer
        pregunta: |
          El análisis se hace a 300 °C. ¿Entre qué extremos va la palanca de
          los microconstituyentes?
        opciones:
          - texto: >-
              Entre la α de la isoterma eutéctica (41 % Pb) y el eutéctico
              (66,5 % Pb), porque las proporciones se fijan en la reacción
              eutéctica
            correcta: true
            mensaje: |
              Eso es. Debajo de 465 °C ya no se forma α primario nuevo ni
              eutéctico nuevo. Lo que pasa al bajar a 300 °C ocurre dentro de
              cada microconstituyente: la α expulsa plomo como Mg₂Pb, y la
              composición media de cada uno no cambia.
          - texto: >-
              Entre la α a 300 °C (16,7 % Pb) y el eutéctico (66,5 % Pb),
              porque el análisis es a 300 °C
            mensaje: |
              Mezcla dos temperaturas. El 66,5 % es la composición del
              eutéctico, que se fijó a 465 °C; el 16,7 % es la de la α a
              300 °C, sin los precipitados que ha soltado. Un balance así
              pierde por el camino el plomo de esos precipitados.
          - texto: >-
              Entre la α a 300 °C (16,7 % Pb) y el Mg₂Pb (80,7 % Pb)
            mensaje: |
              Esa es la palanca de **fases** a 300 °C. Sirve para la segunda
              pregunta, la masa de α, pero no para los microconstituyentes:
              el eutéctico no es Mg₂Pb.

      - tipo: calcular
        titulo: La composición de la aleación
        pregunta: |
          ¿Qué porcentaje de Pb tiene la aleación?
        respuesta:
          tipo: numero
          valor: '55.2'
          tolerancia: 1.5
          formato: un porcentaje de Pb, sin el símbolo
        distractores:
          - valor: '44.8'
            mensaje: |
              Es el resultado del listado, y sale de poner en la palanca la α
              a 300 °C, 17 % Pb, junto al eutéctico de 67 %. Esa palanca
              mezcla dos temperaturas. Con 44,8 % Pb la aleación tendría
              0,85 de α primario, no 0,444.
          - valor: '52.3'
            mensaje: |
              Has cruzado los brazos: con 0,444 en el brazo de α a $C_0$ te
              sale el eutéctico, no el α primario. La fracción de α primario
              es el brazo que va de $C_0$ al eutéctico.
        pista: |
          $W_{\alpha'} = \dfrac{C_{\text{E}} - C_0}{C_{\text{E}} - C_{\alpha\text{E}}} = 0{,}444$,
          con $C_{\alpha\text{E}} = 41$ y $C_{\text{E}} = 66{,}5$.
        desarrollo: |
          $$
          0{,}444 = \frac{66{,}5 - C_0}{66{,}5 - 41}
          \;\Longrightarrow\;
          C_0 = 66{,}5 - 0{,}444\cdot 25{,}5 = 55{,}2\ \%\ \text{Pb}
          $$

          Es lo mismo que un balance de plomo: el α primario tiene de media
          41 % Pb y el eutéctico 66,5 %, así que
          $0{,}444\cdot 41 + 0{,}556\cdot 66{,}5 = 55{,}2$.

      - tipo: calcular
        titulo: La masa de fase α a 300 °C
        pregunta: |
          ¿Cuántos gramos de fase α hay en la muestra, a 300 °C?
        respuesta:
          tipo: magnitud
          valor: '159.6 g'
          tolerancia: 0.03
          formato: una masa, con su unidad
        distractores:
          - valor: '226.25 g'
            mensaje: |
              Es la cifra del listado, que arrastra su composición de 44,8 %
              Pb. Con la palanca de fases a 300 °C está bien planteada, pero
              la aleación no tiene 44,8 % Pb sino 55,2.
          - valor: '177.6 g'
            mensaje: |
              Ese es el 44,4 % de 400 g: solo el α primario, y con su masa de
              465 °C. La fase α incluye también la de las láminas del
              eutéctico, y a 300 °C toda ella ha perdido plomo.
          - valor: '257 g'
            mensaje: |
              Has usado la α de 41 % Pb, la de la isoterma eutéctica. A 300 °C
              la α ha bajado por la solvus hasta 16,7 % Pb, y la palanca de
              fases se hace con ese valor.
        pista: |
          Palanca de fases a 300 °C, entre la α (16,7 % Pb) y el Mg₂Pb
          (80,7 % Pb), con la composición que acabas de calcular.
        desarrollo: |
          $$
          W_\alpha = \frac{80{,}7 - 55{,}2}{80{,}7 - 16{,}7} = \frac{25{,}5}{64{,}0} = 0{,}399
          \qquad
          m_\alpha = 0{,}399\cdot 400 = 159{,}6\ \text{g}
          $$

      - tipo: calcular
        titulo: El plomo que hay en la α
        pregunta: |
          ¿Cuántos gramos de Pb hay dentro de la fase α?
        respuesta:
          tipo: magnitud
          valor: '26.9 g'
          tolerancia: 0.05
          formato: una masa, con su unidad
        distractores:
          - valor: '38.5 g'
            mensaje: |
              Es la cifra del listado: el 17 % de sus 226,25 g de α. El
              porcentaje es el bueno, pero la masa de α viene de una
              composición de la aleación que no se sostiene.
          - valor: '220.7 g'
            mensaje: |
              Ese es todo el plomo de la muestra, el 55,2 % de 400 g. La mayor
              parte está en el Mg₂Pb; en la α solo queda el 16,7 % de su
              masa.
          - valor: '65.4 g'
            mensaje: |
              Has tomado la α con 41 % Pb. Esa es su composición a 465 °C; a
              300 °C tiene 16,7 % Pb.
        pista: |
          La masa de α por su composición a 300 °C: $m_\alpha\cdot C_\alpha$.
        desarrollo: |
          $$
          m_{\text{Pb en }\alpha} = 159{,}6\cdot 0{,}167 = 26{,}7\ \text{g}
          $$

          Con la α leída en 17 % Pb sale 27,1 g.

      - tipo: reconocer
        pregunta: |
          ¿Qué microestructura verá el laboratorio a 300 °C?
        opciones:
          - texto: >-
              Granos de α proeutéctico, con finos precipitados de Mg₂Pb,
              rodeados de eutéctico laminar α + Mg₂Pb, algo más de la mitad de
              la muestra
            correcta: true
            mensaje: |
              Eso es. Es una aleación hipoeutéctica del lado del Mg: α
              primario y eutéctico, 44 y 56 %. Los precipitados salen al bajar
              la α por la solvus desde 465 °C.
          - texto: >-
              Granos de Mg₂Pb proeutéctico en una matriz de eutéctico
            mensaje: |
              Eso sería una aleación entre 66,5 y 81 % Pb. El enunciado dice
              α proeutéctico, así que la aleación está a la izquierda del
              punto eutéctico.
          - texto: >-
              Solo granos de α con Mg₂Pb precipitado, sin eutéctico
            mensaje: |
              Eso le pasa a una aleación con menos de 41 % Pb, que no llega a
              cortar la isoterma eutéctica. Aquí hay un 55,6 % de eutéctico.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las proporciones de α primario y eutéctico se fijan en la
              reacción eutéctica, y ya no cambian al enfriar.
          - texto: >-
              El α primario tiene de media 41 % Pb y el eutéctico 66,5 %, así
              que la aleación tiene 0,444 · 41 + 0,556 · 66,5 = 55,2 % Pb.
          - texto: >-
              A 300 °C las fases son α de 16,7 % Pb y Mg₂Pb de 80,7 %: hay
              0,399 de α, 159,6 g.
          - texto: >-
              El plomo de esa α es el 16,7 % de 159,6 g, unos 27 g.
          - texto: >-
              Como el análisis es a 300 °C, la palanca de microconstituyentes
              se hace con la α a 300 °C, 16,7 % Pb, y el eutéctico, 66,5 %.
            trampa: true
            mensaje: |
              Es el atajo que da el 44,8 % del listado. El 66,5 % es de
              465 °C y el 16,7 % de 300 °C: el balance pierde el plomo que la
              α primaria ha soltado como precipitados. La palanca de
              microconstituyentes se hace siempre en la isoterma eutéctica.
    resolucion: |
      **La composición.** Los microconstituyentes se reparten en la reacción
      eutéctica, y al bajar a 300 °C ya no cambian: cada uno pierde o gana
      fases por dentro, pero su composición media se queda. La palanca va de
      la α de la isoterma, 41 % Pb, al eutéctico, 66,5 %:

      $$
      0{,}444 = \frac{66{,}5 - C_0}{66{,}5 - 41}
      \;\Longrightarrow\;
      C_0 = 55{,}2\ \%\ \text{Pb}
      $$

      **La fase α a 300 °C.** Ahora sí, palanca de fases a 300 °C, con la α
      en 16,7 % Pb y el Mg₂Pb en 80,7 %:

      $$
      W_\alpha = \frac{80{,}7 - 55{,}2}{80{,}7 - 16{,}7} = 0{,}399
      \qquad
      m_\alpha = 159{,}6\ \text{g}
      \qquad
      m_{\text{Pb en }\alpha} = 159{,}6\cdot 0{,}167 = 26{,}7\ \text{g}
      $$

      **La microestructura.** Granos de α proeutéctico, con finos
      precipitados de Mg₂Pb dentro, en una matriz de eutéctico laminar
      α + Mg₂Pb: 44 % y 56 % de la muestra.

      > **El listado da 44,8 % Pb, 226,25 g y 38,5 g, y no se reproduce con
      > el método del tema.** Las tres cifras salen exactas de una palanca
      > híbrida, $C_0 = 67 - 0{,}444\,(67 - 17)$, que pone la α **a 300 °C**
      > (17 % Pb) junto al eutéctico **de 465 °C** (67 % Pb). Esa cuenta es
      > un balance de plomo en el que el α primario tiene 17 % Pb y el
      > eutéctico 67 %, y el plomo que la α primaria ha soltado como Mg₂Pb al
      > bajar de 465 a 300 °C no está en ningún sitio.
      >
      > La prueba de que no vale: con 44,8 % Pb, la palanca de las
      > transparencias —$W_{\alpha,\text{pro}} = (C_{\text{E}} - C_0)/(C_{\text{E}} - C_\alpha)$,
      > con los extremos de la isoterma— da 0,85 de α proeutéctico, no el
      > 0,444 que dice el enunciado. Con 55,2 % Pb da exactamente 0,444.
      >
      > Las otras dos cifras están bien calculadas a partir de la primera: el
      > fallo es solo la composición, y lo arrastran.
      >
      > El mismo atajo, en pequeño, está en el apartado e) del 4.13. Si en
      > clase se resuelve así, pregúntalo antes del examen: aquí se da la
      > cuenta que casa con la fórmula del tema, que es la única que devuelve
      > el 0,444 del enunciado.

      **Lo que hay que llevarse.** En cuanto el problema dice
      «microconstituyente», la palanca se hace en la isoterma eutéctica,
      diga el enunciado la temperatura que diga. La temperatura del análisis
      solo entra en la palanca de fases.

  - id: ejcm4-col420-la-ferrita-y-la-cementita-de-la-perlita
    titulo: La ferrita y la cementita de la perlita
    fuente: >-
      Ejercicio 4.20 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcula las fracciones de masa de la ferrita $\alpha$ y de la cementita
      en la perlita. (Ver figura 6).
    pide: Las fracciones de masa de ferrita y de cementita dentro de la perlita.
    pasos:
      - tipo: reconocer
        pregunta: |
          La perlita es lo que da la austenita de 0,76 % C al cruzar los
          727 °C. ¿Dónde se aplica la regla de la palanca para saber qué tiene
          dentro?
        opciones:
          - texto: >-
              En 0,76 % C, justo por debajo de 727 °C, entre la ferrita
              (0,022 % C) y la cementita (6,70 % C)
            correcta: true
            mensaje: |
              Eso es. La perlita tiene la composición de la austenita que la
              forma, 0,76 % C, y está hecha de dos fases, ferrita y cementita.
              La palanca va entre las composiciones de esas dos fases.
          - texto: >-
              En 0,76 % C, entre la ferrita (0,022 % C) y el eutectoide
              (0,76 % C)
            mensaje: |
              Esa es la palanca de los **microconstituyentes** de un acero
              hipoeutectoide: ferrita proeutectoide contra perlita. En 0,76 % C
              da perlita al 100 %, que es verdad y no dice qué hay dentro de
              ella.
          - texto: >-
              En 0,76 % C, entre la austenita del eutéctico (2,14 % C) y la
              cementita (6,70 % C)
            mensaje: |
              Ese es el tramo del eutéctico, a 1147 °C, y 0,76 ni siquiera cae
              dentro. La perlita se forma a 727 °C, y a esa temperatura lo que
              hay a los dos lados es ferrita y cementita.

      - tipo: calcular
        titulo: La ferrita de la perlita
        pregunta: |
          ¿Qué fracción de la perlita es ferrita $\alpha$?
        respuesta:
          tipo: numero
          valor: '0.8895'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.1105'
            mensaje: |
              Has puesto la palanca al revés. La fracción de ferrita es el
              brazo **opuesto** a la ferrita, de 0,76 hasta la cementita:
              $6{,}70 - 0{,}76$. Con el brazo del lado de la ferrita sale la
              cementita.
          - valor: '0'
            mensaje: |
              Has usado la palanca de los microconstituyentes, entre 0,022 y
              0,76. En 0,76 esa palanca da cero ferrita **proeutectoide**, y es
              cierto: un acero eutectoide no tiene. Pero la ferrita de dentro de
              la perlita es otra, y se saca con los extremos de las fases,
              0,022 y 6,70.
        pista: |
          $W_{\alpha} = (6{,}70 - 0{,}76)/(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          W_{\alpha} = \frac{6{,}70 - 0{,}76}{6{,}70 - 0{,}022}
          = \frac{5{,}94}{6{,}678} = 0{,}889
          $$

      - tipo: calcular
        titulo: La cementita de la perlita
        pregunta: |
          ¿Y qué fracción de la perlita es cementita?
        respuesta:
          tipo: numero
          valor: '0.1105'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.8895'
            mensaje: |
              Palanca al revés: eso es la ferrita. La cementita es el brazo
              del lado de la ferrita, de 0,022 a 0,76, porque cuanto más cerca
              está la perlita de la ferrita, menos cementita tiene.
          - valor: '0'
            mensaje: |
              Has usado la palanca de los microconstituyentes del lado
              hipereutectoide, entre 0,76 y 6,70: en 0,76 da cero cementita
              **proeutectoide**. La cementita de la perlita no es
              proeutectoide, está en las láminas, y sale con la palanca de
              fases.
        pista: |
          Las dos fracciones suman 1, o bien
          $W_{\text{Fe}_3\text{C}} = (0{,}76 - 0{,}022)/(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          W_{\text{Fe}_3\text{C}} = \frac{0{,}76 - 0{,}022}{6{,}70 - 0{,}022}
          = \frac{0{,}738}{6{,}678} = 0{,}111
          $$

          Y $0{,}889 + 0{,}111 = 1$.

      - tipo: justificar
        pregunta: Ordena lo que dicen las dos fracciones. Una pieza es falsa.
        piezas:
          - texto: >-
              La perlita tiene la composición de la austenita que la forma,
              0,76 % C.
          - texto: >-
              Está hecha de dos fases, ferrita y cementita, en láminas
              alternas.
          - texto: >-
              La palanca entre 0,022 y 6,70 da un 89 % de ferrita y un 11 % de
              cementita.
          - texto: >-
              La perlita es una tercera fase, de 0,76 % C, que aparece por
              debajo de 727 °C.
            trampa: true
            mensaje: |
              La perlita no es una fase: es un **microconstituyente**, una
              mezcla de dos fases con una forma reconocible. Por debajo de
              727 °C solo hay dos fases, ferrita y cementita, y por eso la
              palanca de fases nunca termina en 0,76.
    resolucion: |
      **Dónde se aplica la palanca.** La perlita sale de la austenita
      eutectoide, así que su composición global es 0,76 % C. Justo por debajo
      de 727 °C, en esa composición, conviven ferrita de 0,022 % C y cementita
      de 6,70 % C:

      $$
      W_{\alpha} = \frac{6{,}70 - 0{,}76}{6{,}70 - 0{,}022} = \frac{5{,}94}{6{,}678} = 0{,}89
      $$

      $$
      W_{\text{Fe}_3\text{C}} = \frac{0{,}76 - 0{,}022}{6{,}70 - 0{,}022} = \frac{0{,}738}{6{,}678} = 0{,}11
      $$

      Son los dos valores del listado. Si tomas la ferrita como hierro puro,
      0 % C, salen 0,887 y 0,113: la misma cifra a dos decimales, y la casilla
      acepta las dos.

      **Lo que hay que llevarse.** Estos dos números se usan en todo lo que
      viene: cualquier masa de perlita lleva dentro un 89 % de ferrita y un
      11 % de cementita. Con ellos se pasa de microconstituyentes a fases sin
      volver al diagrama.

  - id: ejcm4-col421-el-carbono-desde-la-cementita
    titulo: El carbono de un acero, desde su cementita
    fuente: >-
      Ejercicio 4.21 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      ¿Cuál es el porcentaje de carbono de un acero al carbono si la fracción
      de cementita es de 0,10? (Ver figura 6).
    pide: El contenido en carbono del acero, en porcentaje en masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          La fracción de cementita que da el enunciado, ¿con qué palanca se
          convierte en carbono?
        opciones:
          - texto: >-
              Con la de las fases, entre la ferrita (0,022 % C) y la cementita
              (6,70 % C)
            correcta: true
            mensaje: |
              Eso es. «Cementita» a secas es la fase entera, esté donde esté:
              dentro de la perlita o fuera. Su fracción la da la palanca entre
              las dos fases que hay por debajo de 727 °C.
          - texto: >-
              Con la de los microconstituyentes, entre 0,76 y 6,70, porque es
              cementita proeutectoide
            mensaje: |
              El enunciado no dice proeutectoide. Leída así sale un acero de
              1,35 % C, en el que la cementita **total** sería bastante más
              del 10 %.
          - texto: >-
              Con la palanca entre 0,022 y 0,76, porque es un acero
            mensaje: |
              Esa palanca separa ferrita proeutectoide y perlita, no fases.
              Con 0,76 como extremo, un 10 % de cementita daría un acero de
              0,096 % C, y un acero así casi no tiene cementita.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.6898'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '0.67'
            mensaje: |
              Has tomado la ferrita como hierro puro, 0 % C:
              $0{,}10\cdot 6{,}70 = 0{,}67$. La ferrita disuelve hasta
              0,022 % C, y aquí esas dos centésimas se notan en la segunda
              cifra. El listado usa 0,022, que es lo que imprime la figura.
          - valor: '6.032'
            mensaje: |
              Palanca al revés: has puesto el 0,10 en el brazo del lado de la
              cementita. La fracción de cementita crece cuando $C_0$ se acerca
              a 6,70, así que un 10 % deja el acero cerca de la ferrita, no de
              la cementita.
          - valor: '0.0958'
            mensaje: |
              Has usado 0,76 como extremo en vez de 6,70. La cementita es la
              fase de 6,70 % C; 0,76 es la composición de la perlita, que no
              es una fase.
          - valor: '1.354'
            mensaje: |
              Has leído el 0,10 como cementita proeutectoide y has usado la
              palanca entre 0,76 y 6,70. El enunciado habla de la cementita a
              secas, que es la total.
        pista: |
          $W_{\text{Fe}_3\text{C}} = (C_0 - 0{,}022)/(6{,}70 - 0{,}022) = 0{,}10$,
          y se despeja $C_0$.
        desarrollo: |
          $$
          0{,}10 = \frac{C_0 - 0{,}022}{6{,}70 - 0{,}022}
          \;\Longrightarrow\;
          C_0 = 0{,}022 + 0{,}10\cdot 6{,}678 = 0{,}69\ \%\ \text{C}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La cementita total la da la palanca de fases,
              $W_{\text{Fe}_3\text{C}} = (C_0 - 0{,}022)/6{,}678$.
          - texto: >-
              Con $W_{\text{Fe}_3\text{C}} = 0{,}10$ sale $C_0 = 0{,}69$ % C.
          - texto: >-
              Como 0,69 es menor que 0,76, el acero es hipoeutectoide: ferrita
              proeutectoide y perlita.
          - texto: >-
              Si el acero tiene cementita, es hipereutectoide.
            trampa: true
            mensaje: |
              Todo acero con más de 0,022 % C tiene cementita por debajo de
              727 °C, porque la perlita la lleva dentro. Lo que distingue a un
              hipereutectoide es la cementita **proeutectoide**, la que se
              forma antes de 727 °C, y eso pasa solo por encima de 0,76 % C.
    resolucion: |
      **La palanca que toca.** «Fracción de cementita» es la fase entera, así
      que va con los extremos de las fases, la ferrita y la cementita:

      $$
      W_{\text{Fe}_3\text{C}} = \frac{C_0 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}10
      $$

      **El carbono.** Despejando:

      $$
      C_0 = 0{,}022 + 0{,}10\cdot 6{,}678 = 0{,}69\ \%\ \text{C}
      $$

      Coincide con el listado. Es un acero hipoeutectoide, y su 10 % de
      cementita está toda dentro de la perlita.

      Con 0,02 en vez de 0,022 sale 0,688, y la casilla lo acepta. Con la
      ferrita como hierro puro sale 0,67, que ya es otra segunda cifra: aquí
      la solubilidad de la ferrita, por pequeña que sea, se nota.

      **Lo que hay que llevarse.** Antes de elegir extremos, lee de qué es la
      fracción: si es de una **fase** (ferrita, cementita), la palanca va de
      0,022 a 6,70; si es de un **microconstituyente** (perlita, algo
      proeutectoide), uno de los extremos es 0,76.

  - id: ejcm4-col422-la-fase-proeutectoide-desde-las-fracciones
    titulo: La fase proeutectoide, desde las fracciones de fase
    fuente: >-
      Ejercicio 4.22 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      ¿Cuál es la fase proeutectoide de un acero al carbono cuyas fracciones
      másicas de ferrita y de cementita son 0,92 y 0,08, respectivamente? ¿Por
      qué? (Ver figura 6).
    pide: El contenido en carbono del acero y cuál es su fase proeutectoide.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué decide cuál es la fase proeutectoide de un acero?
        opciones:
          - texto: >-
              Dónde queda su carbono respecto del eutectoide, 0,76 % C
            correcta: true
            mensaje: |
              Eso es. Por debajo de 0,76 la austenita suelta ferrita antes de
              llegar a 727 °C; por encima suelta cementita. Así que primero hay
              que sacar $C_0$ de las fracciones.
          - texto: >-
              Cuál de las dos fases es mayoritaria
            mensaje: |
              La ferrita es mayoritaria en **todos** los aceros: incluso con
              2 % C pasa del 70 %. Que haya un 92 % de ferrita no dice de qué
              lado del eutectoide está el acero.
          - texto: >-
              Si hay cementita o no
            mensaje: |
              Hay cementita en cualquier acero de más de 0,022 % C, dentro de la
              perlita. Tenerla no la hace proeutectoide.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.5562'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '6.166'
            mensaje: |
              Palanca al revés. La cementita crece hacia 6,70, así que un 8 %
              de cementita deja el acero cerca de la ferrita:
              $C_0 = 0{,}022 + 0{,}08\cdot 6{,}678$.
          - valor: '0.081'
            mensaje: |
              Has usado 0,76 como extremo en lugar de 6,70. Las fracciones que
              da el enunciado son de fases, y la fase cementita tiene
              6,70 % C.
          - valor: '0.536'
            mensaje: |
              Has tomado la ferrita como hierro puro, 0 % C. La figura le da
              0,022 % C, y con ese valor sale el 0,56 del listado.
        pista: |
          $W_{\text{Fe}_3\text{C}} = (C_0 - 0{,}022)/(6{,}70 - 0{,}022) = 0{,}08$.
        desarrollo: |
          $$
          C_0 = 0{,}022 + 0{,}08\cdot(6{,}70 - 0{,}022) = 0{,}556\ \%\ \text{C}
          $$

          Con la ferrita sale lo mismo, $6{,}70 - 0{,}92\cdot 6{,}678 = 0{,}556$,
          porque las dos fracciones suman 1.

      - tipo: reconocer
        pregunta: |
          Con $C_0 = 0{,}56$ % C, ¿cuál es la fase proeutectoide?
        opciones:
          - texto: >-
              La ferrita: el acero es hipoeutectoide
            correcta: true
            mensaje: |
              Eso es. 0,56 queda por debajo de 0,76, así que al enfriar la
              austenita cruza primero la región α + γ y suelta ferrita antes
              de llegar a 727 °C.
          - texto: >-
              La cementita, porque el acero tiene un 8 % de ella
            mensaje: |
              Ese 8 % es la cementita total, y aquí está toda dentro de la
              perlita. Solo hay cementita proeutectoide por encima de
              0,76 % C.
          - texto: >-
              La perlita, que es lo primero que aparece
            mensaje: |
              La perlita no es una fase, y no es lo primero: se forma **a**
              727 °C con la austenita que queda. Lo proeutectoide es lo que
              sale antes.
          - texto: >-
              Ninguna: es un acero eutectoide
            mensaje: |
              Un eutectoide tiene 0,76 % C y 0,11 de cementita. Aquí hay 0,08,
              menos, y eso lo deja por debajo.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la palanca de fases, $W_{\text{Fe}_3\text{C}} = 0{,}08$ da
              $C_0 = 0{,}56$ % C.
          - texto: >-
              0,56 es menor que 0,76: el acero es hipoeutectoide.
          - texto: >-
              Al enfriar, la austenita entra en la región α + γ y suelta
              ferrita antes de 727 °C. Esa es la ferrita proeutectoide.
          - texto: >-
              Al llegar a 727 °C, la austenita que queda se transforma en
              ferrita proeutectoide.
            trampa: true
            mensaje: |
              La austenita que queda a 727 °C tiene ya 0,76 % C y se
              transforma en **perlita**. La ferrita proeutectoide es la que se
              ha formado antes, al cruzar la región α + γ.
    resolucion: |
      **El carbono.** Ferrita y cementita son fases, así que la palanca va de
      0,022 a 6,70:

      $$
      C_0 = 0{,}022 + 0{,}08\cdot(6{,}70 - 0{,}022) = 0{,}56\ \%\ \text{C}
      $$

      Es el valor del listado. Con la ferrita, $6{,}70 - 0{,}92\cdot 6{,}678$,
      sale lo mismo.

      **La fase proeutectoide.** 0,56 está por debajo del eutectoide, 0,76 %
      C: el acero es **hipoeutectoide** y su fase proeutectoide es la
      **ferrita**. Al enfriar, la austenita entra en la región α + γ y suelta
      ferrita en los bordes de grano; la austenita que llega a 727 °C, ya con
      0,76 % C, se hace perlita.

      El listado imprime solo el 0,56 % C. El «¿por qué?» del enunciado es
      esta comparación con 0,76.

      **Lo que hay que llevarse.** La fracción de ferrita no decide nada por
      sí sola: es mayoritaria en todos los aceros. Lo que decide es $C_0$
      frente a 0,76, y el ejercicio siguiente lo demuestra con un acero que
      tiene un 88 % de ferrita y es hipereutectoide.

  - id: ejcm4-col423-hipo-o-hiper-con-un-88-de-ferrita
    titulo: Hipo o hipereutectoide, con un 88 % de ferrita
    fuente: >-
      Ejercicio 4.23 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Las fracciones másicas de la ferrita y de la cementita de un acero al
      carbono son 0,88 y 0,12, respectivamente. Justifica si es un acero hipo o
      hipereutectoide. (Ver figura 6).
    pide: El contenido en carbono y si el acero es hipo o hipereutectoide.
    pasos:
      - tipo: reconocer
        pregunta: |
          Te dan fracciones de **fases**. ¿Qué palanca las pasa a carbono?
        opciones:
          - texto: >-
              La de las fases, entre 0,022 y 6,70 % C
            correcta: true
            mensaje: |
              Eso es. Ferrita y cementita son las dos fases por debajo de
              727 °C, y sus fracciones se leen entre sus composiciones.
          - texto: >-
              La de los microconstituyentes, entre 0,022 y 0,76
            mensaje: |
              Esa separa ferrita **proeutectoide** y perlita. Aquí la ferrita
              es la total, la de dentro y la de fuera de la perlita.
          - texto: >-
              Ninguna: con un 88 % de ferrita ya se ve que es hipoeutectoide
            mensaje: |
              Es justo lo que este ejercicio desmonta. La perlita sola tiene un
              89 % de ferrita, así que un 88 % está pegado al eutectoide, y
              hay que hacer la cuenta para saber de qué lado.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.8234'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '5.899'
            mensaje: |
              Palanca al revés: el 0,12 de cementita va en el brazo del lado de
              la ferrita, $C_0 - 0{,}022$, no en el de la cementita.
          - valor: '0.1106'
            mensaje: |
              Has usado 0,76 como extremo. La cementita es la fase de 6,70 %
              C; con 0,76 estarías tratando la perlita como si fuera la
              cementita.
          - valor: '1.473'
            mensaje: |
              Has leído el 0,12 como cementita proeutectoide, con la palanca
              entre 0,76 y 6,70. El enunciado da la cementita a secas, la
              total, y va con la palanca de fases.
        pista: |
          $C_0 = 0{,}022 + 0{,}12\cdot(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          C_0 = 0{,}022 + 0{,}12\cdot 6{,}678 = 0{,}823\ \%\ \text{C}
          $$

      - tipo: reconocer
        pregunta: |
          Con $C_0 = 0{,}82$ % C, ¿qué acero es?
        opciones:
          - texto: >-
              Hipereutectoide, porque está por encima de 0,76 % C
            correcta: true
            mensaje: |
              Eso es. Su fase proeutectoide es la cementita, que se forma en
              los bordes de grano de la austenita antes de 727 °C.
          - texto: >-
              Hipoeutectoide, porque la ferrita es mayoritaria
            mensaje: |
              La ferrita es mayoritaria en todo acero. El eutectoide mismo
              tiene un 89 %; este tiene un 88 %, **menos** ferrita que la
              perlita pura, y eso lo pone por encima de 0,76.
          - texto: >-
              Eutectoide, porque 0,82 está muy cerca de 0,76
            mensaje: |
              Cerca no es igual. Por encima de 0,76 hay cementita
              proeutectoide aunque sea poca: aquí
              $(0{,}82 - 0{,}76)/5{,}94$, alrededor de un 1 %.
          - texto: >-
              Una fundición, porque tiene más de un 10 % de cementita
            mensaje: |
              Las fundiciones empiezan en torno al 2,1 % C, y aquí hay 0,82. Un
              12 % de cementita es una cifra corriente en un acero.

      - tipo: justificar
        pregunta: Ordena la justificación. Una pieza es falsa.
        piezas:
          - texto: >-
              La palanca de fases con $W_{\text{Fe}_3\text{C}} = 0{,}12$ da
              $C_0 = 0{,}82$ % C.
          - texto: >-
              La perlita tiene 0,11 de cementita. Con 0,12, el acero tiene más
              cementita que la perlita, y por tanto más carbono que el
              eutectoide.
          - texto: >-
              Por encima de 0,76 % C el acero es hipereutectoide, y su fase
              proeutectoide es la cementita.
          - texto: >-
              Con un 88 % de ferrita, la ferrita tiene que ser la fase
              proeutectoide.
            trampa: true
            mensaje: |
              Que la ferrita sea mayoritaria no dice nada: en este acero
              **toda** la ferrita está dentro de la perlita. Lo que decide es
              la comparación con 0,76, o con el 0,11 de cementita de la
              perlita.
    resolucion: |
      **El carbono.** Con la palanca de fases:

      $$
      C_0 = 0{,}022 + 0{,}12\cdot(6{,}70 - 0{,}022) = 0{,}82\ \%\ \text{C}
      $$

      **La clasificación.** 0,82 es mayor que 0,76, así que el acero es
      **hipereutectoide**. Coincide con el listado.

      Hay una forma de verlo sin despejar: la perlita tiene un 11 % de
      cementita (ejercicio 4.20). Este acero tiene un 12 %, **más** que la
      perlita, luego tiene más carbono que el eutectoide. Y su 88 % de ferrita
      es **menos** que el 89 % de la perlita, que dice lo mismo desde el otro
      lado.

      Con 0,02 para la ferrita sale 0,822, y con el eutectoide en 0,8, como
      usan otros libros, el veredicto no cambia.

      **Lo que hay que llevarse.** La trampa del ejercicio es un 88 % de
      ferrita en un acero hipereutectoide. Para clasificar se compara con
      0,76, nunca con cuál de las dos fases abunda más.

  - id: ejcm4-col424-el-carbono-desde-la-ferrita-proeutectoide
    titulo: El carbono desde la ferrita proeutectoide y la perlita
    fuente: >-
      Ejercicio 4.24 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La microestructura de un acero al carbono consta de ferrita
      proeutectoide y de perlita. Las fracciones de masa de estos
      microconstituyentes son 0,20 y 0,80, respectivamente. Determina el
      porcentaje de carbono del acero. (Ver figura 6).
    pide: El contenido en carbono del acero.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ahora las fracciones son de **microconstituyentes**. ¿Entre qué
          composiciones va la palanca?
        opciones:
          - texto: >-
              Entre 0,022 (ferrita proeutectoide) y 0,76 (perlita)
            correcta: true
            mensaje: |
              Eso es. Justo por debajo de 727 °C, un hipoeutectoide es ferrita
              proeutectoide de 0,022 % C y perlita de 0,76 % C. En esta
              palanca la perlita hace el papel de una «fase» de 0,76.
          - texto: >-
              Entre 0,022 y 6,70, como siempre
            mensaje: |
              Esa es la palanca de fases, y da la ferrita **total**. El 0,20
              es solo la ferrita proeutectoide: la perlita tiene más ferrita
              dentro.
          - texto: >-
              Entre 0,76 y 6,70
            mensaje: |
              Esa es la palanca de un hipereutectoide, perlita contra cementita
              proeutectoide. Aquí hay ferrita proeutectoide, así que el acero
              está por debajo de 0,76.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.6124'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '0.1696'
            mensaje: |
              Palanca al revés. La ferrita proeutectoide es el brazo
              **opuesto**, de $C_0$ a 0,76: cuanto más cerca de 0,76, menos
              ferrita proeutectoide. Tu acero tendría un 80 % de ella, no un
              20 %.
          - valor: '5.364'
            mensaje: |
              Has tomado el 0,20 como la ferrita total y has usado la palanca
              de fases, entre 0,022 y 6,70. El 0,20 es solo la ferrita
              proeutectoide; la de la perlita no está contada ahí.
          - valor: '1.948'
            mensaje: |
              Has usado la palanca del lado hipereutectoide, entre 0,76 y
              6,70, para el 80 % de perlita. Si hay ferrita proeutectoide, el
              acero es hipoeutectoide, y la palanca va del otro lado de 0,76.
        pista: |
          $W_{\alpha,\text{pro}} = (0{,}76 - C_0)/(0{,}76 - 0{,}022) = 0{,}20$.
        desarrollo: |
          $$
          W_{\alpha,\text{pro}} = \frac{0{,}76 - C_0}{0{,}76 - 0{,}022} = 0{,}20
          \;\Longrightarrow\;
          C_0 = 0{,}76 - 0{,}20\cdot 0{,}738 = 0{,}612\ \%\ \text{C}
          $$

          Con la perlita sale lo mismo: $C_0 = 0{,}022 + 0{,}80\cdot 0{,}738 = 0{,}612$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Ferrita proeutectoide y perlita son los microconstituyentes de un
              acero hipoeutectoide.
          - texto: >-
              Su palanca va de 0,022 a 0,76, y con un 20 % de ferrita
              proeutectoide da $C_0 = 0{,}61$ % C.
          - texto: >-
              Con el 80 % de perlita sale el mismo número, que es la
              comprobación.
          - texto: >-
              La ferrita total del acero es el 20 %, la proeutectoide.
            trampa: true
            mensaje: |
              La perlita también lleva ferrita, un 89 % de su masa. La ferrita
              total es $0{,}20 + 0{,}80\cdot 0{,}889 = 0{,}91$: el 20 % es solo
              la parte que se formó antes de 727 °C.
    resolucion: |
      **La palanca de microconstituyentes.** Justo por debajo de 727 °C este
      acero es ferrita proeutectoide (0,022 % C) y perlita (0,76 % C):

      $$
      W_{\alpha,\text{pro}} = \frac{0{,}76 - C_0}{0{,}76 - 0{,}022} = 0{,}20
      \;\Longrightarrow\;
      C_0 = 0{,}76 - 0{,}20\cdot 0{,}738 = 0{,}61\ \%\ \text{C}
      $$

      Con la perlita, $0{,}022 + 0{,}80\cdot 0{,}738$, sale lo mismo. Es el
      valor del listado. Con la ferrita como hierro puro sale 0,608, y la
      casilla lo acepta: aquí la diferencia no pasa de la tercera cifra.

      **Una comprobación con las fases.** La palanca de fases da una ferrita
      total de $(6{,}70 - 0{,}612)/6{,}678 = 0{,}912$, y por
      microconstituyentes es $0{,}20 + 0{,}80\cdot 0{,}889 = 0{,}911$. Las dos
      cuentas describen el mismo acero.

      **Lo que hay que llevarse.** Si el dato es de un microconstituyente, uno
      de los extremos de la palanca es 0,76. Y la ferrita proeutectoide es
      solo una parte de la ferrita: el resto está dentro de la perlita.

  - id: ejcm4-col425-existe-ese-acero
    titulo: Un acero que existe si los dos datos dicen lo mismo
    fuente: >-
      Ejercicio 4.25 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      ¿Existe un acero con fracción másica de ferrita y de cementita
      proeutectoide de 0,846 y 0,049, respectivamente? (Ver figura 6).
    pide: Si ese acero existe y, si existe, su contenido en carbono.
    pasos:
      - tipo: reconocer
        pregunta: |
          Una fracción es de ferrita y la otra de cementita **proeutectoide**.
          ¿Cómo se leen?
        opciones:
          - texto: >-
              La ferrita es la fase entera (palanca de 0,022 a 6,70) y la
              cementita proeutectoide es un microconstituyente (palanca de 0,76
              a 6,70)
            correcta: true
            mensaje: |
              Eso es. Son dos datos de naturaleza distinta y cada uno va con su
              palanca. Si el acero existe, las dos tienen que dar el mismo
              $C_0$.
          - texto: >-
              Las dos son proeutectoides: ferrita proeutectoide y cementita
              proeutectoide
            mensaje: |
              Ningún acero tiene las dos. Por debajo de 0,76 % C la
              proeutectoide es la ferrita, y por encima la cementita. Si hay
              cementita proeutectoide, toda la ferrita está dentro de la
              perlita.
          - texto: >-
              Las dos son fases, y como no suman 1 el acero no existe
            mensaje: |
              No tienen por qué sumar 1: la cementita proeutectoide es solo una
              parte de la cementita. Lo que falta hasta 1, el 0,105, es la
              cementita de dentro de la perlita.

      - tipo: calcular
        titulo: El carbono, desde la ferrita
        pregunta: |
          ¿Qué contenido en carbono da la fracción de ferrita, 0,846?
        respuesta:
          tipo: numero
          valor: '1.0504'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '1.675'
            mensaje: |
              Has usado la palanca de microconstituyentes, entre 0,76 y 6,70,
              para la ferrita. La ferrita es una fase: su palanca va de 0,022 a
              6,70.
          - valor: '5.672'
            mensaje: |
              Palanca al revés. La ferrita es el brazo opuesto a la ferrita,
              $6{,}70 - C_0$, así que $C_0 = 6{,}70 - 0{,}846\cdot 6{,}678$.
          - valor: '1.032'
            mensaje: |
              Has tomado la ferrita como hierro puro, 0 % C. Aquí importa: con
              ese valor este camino da 1,03 y el otro 1,05, y concluirías que
              el acero no existe. Con el 0,022 de la figura los dos coinciden.
        pista: |
          $W_{\alpha} = (6{,}70 - C_0)/(6{,}70 - 0{,}022) = 0{,}846$.
        desarrollo: |
          $$
          C_0 = 6{,}70 - 0{,}846\cdot(6{,}70 - 0{,}022) = 6{,}70 - 5{,}650
          = 1{,}050\ \%\ \text{C}
          $$

      - tipo: calcular
        titulo: El carbono, desde la cementita proeutectoide
        pregunta: |
          ¿Y qué contenido en carbono da la cementita proeutectoide, 0,049?
        respuesta:
          tipo: numero
          valor: '1.0511'
          tolerancia: 0.01
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '0.349'
            mensaje: |
              Has usado la palanca de fases, que da la cementita **total**. La
              proeutectoide es un microconstituyente: su palanca va de 0,76 a
              6,70.
          - valor: '6.409'
            mensaje: |
              Palanca al revés. La cementita proeutectoide es el brazo del lado
              de la perlita, $C_0 - 0{,}76$: crece a medida que el acero se
              aleja del eutectoide.
        pista: |
          $W_{\text{Fe}_3\text{C},\text{pro}} = (C_0 - 0{,}76)/(6{,}70 - 0{,}76) = 0{,}049$.
        desarrollo: |
          $$
          C_0 = 0{,}76 + 0{,}049\cdot(6{,}70 - 0{,}76) = 0{,}76 + 0{,}291
          = 1{,}051\ \%\ \text{C}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la palanca de fases, $W_{\alpha} = 0{,}846$ da
              $C_0 = 1{,}050$ % C.
          - texto: >-
              Con la de microconstituyentes,
              $W_{\text{Fe}_3\text{C},\text{pro}} = 0{,}049$ da
              $C_0 = 1{,}051$ % C.
          - texto: >-
              Los dos caminos dan el mismo acero, así que existe. Tiene
              1,05 % C y es hipereutectoide.
          - texto: >-
              0,846 y 0,049 no suman 1, así que ese acero no puede existir.
            trampa: true
            mensaje: |
              Solo suman 1 las fracciones de **un mismo reparto**: ferrita más
              cementita total, o perlita más cementita proeutectoide. Estos dos
              datos son de repartos distintos. El 0,105 que falta es la
              cementita de la perlita, y está en su sitio.
    resolucion: |
      **Cómo se decide.** Cada dato fija un $C_0$ con su propia palanca. Si
      los dos coinciden, el acero existe; si no, no.

      **Desde la ferrita**, que es una fase:

      $$
      C_0 = 6{,}70 - 0{,}846\cdot(6{,}70 - 0{,}022) = 1{,}050\ \%\ \text{C}
      $$

      **Desde la cementita proeutectoide**, que es un microconstituyente:

      $$
      C_0 = 0{,}76 + 0{,}049\cdot(6{,}70 - 0{,}76) = 1{,}051\ \%\ \text{C}
      $$

      Coinciden: **sí existe, con 1,05 % C**, como dice el listado. Es
      hipereutectoide, y eso encaja con que tenga cementita proeutectoide.

      **Una tercera comprobación.** La perlita es $1 - 0{,}049 = 0{,}951$, y
      lleva un 11,05 % de cementita: $0{,}951\cdot 0{,}1105 = 0{,}105$. Es
      exactamente lo que falta para cerrar el reparto de fases,
      $1 - 0{,}846 - 0{,}049 = 0{,}105$.

      > Este ejercicio es sensible a los invariantes. Con la ferrita como
      > hierro puro, el primer camino da 1,03 y el segundo 1,05, y concluirías
      > que el acero no existe. Con el eutectoide en 0,8, como en otros libros,
      > salen 1,05 y 1,09. Los datos están hechos con los valores de la
      > figura, 0,022, 0,76 y 6,70, y solo con ellos cuadran.

      **Lo que hay que llevarse.** Para saber si un acero existe no se suman
      fracciones: se calcula $C_0$ por cada dato y se comparan.

  - id: ejcm4-col426-tres-kilos-y-medio-de-austenita
    titulo: Tres kilos y medio de austenita con 0,95 % C
    fuente: >-
      Ejercicio 4.26 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Si se enfrían $3{,}5\ \text{kg}$ de austenita con 0,95 wt % C hasta
      temperaturas inferiores a 727 °C. (Ver figura 6).

      a) ¿Cuál es la fase proeutectoide?

      b) ¿Cuántos kilogramos de ferrita y de cementita se forman?

      c) ¿Cuántos kilogramos de perlita y de fase proeutectoide se forman?
    pide: >-
      La fase proeutectoide y las masas de ferrita, cementita, perlita y fase
      proeutectoide.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la fase proeutectoide de este acero?
        opciones:
          - texto: >-
              La cementita, porque 0,95 % C está por encima del eutectoide
            correcta: true
            mensaje: |
              Eso es. El acero es hipereutectoide: al enfriar, la austenita
              cruza la línea de la cementita y la suelta en los bordes de grano
              antes de llegar a 727 °C.
          - texto: >-
              La ferrita, porque es la fase que más abunda
            mensaje: |
              Abundar no la hace proeutectoide. La ferrita abunda en todos los
              aceros, y aquí está toda dentro de la perlita.
          - texto: >-
              La perlita
            mensaje: |
              La perlita se forma **a** 727 °C, no antes, y no es una fase sino
              un microconstituyente.

      - tipo: calcular
        titulo: La ferrita
        pregunta: |
          ¿Cuántos kilogramos de ferrita se forman?
        respuesta:
          tipo: magnitud
          valor: '3.014 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '0.486 kg'
            mensaje: |
              Palanca al revés: eso es la cementita. La ferrita es el brazo del
              lado de la cementita, $6{,}70 - 0{,}95$.
          - valor: '3.388 kg'
            mensaje: |
              Has usado 0,76 como extremo, y eso da la **perlita**. La ferrita
              es una fase y va con la palanca de 0,022 a 6,70.
        pista: |
          $m_{\alpha} = 3{,}5\cdot(6{,}70 - 0{,}95)/(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          m_{\alpha} = 3{,}5\cdot\frac{6{,}70 - 0{,}95}{6{,}70 - 0{,}022}
          = 3{,}5\cdot 0{,}861 = 3{,}01\ \text{kg}
          $$

      - tipo: calcular
        titulo: La cementita
        pregunta: |
          ¿Cuántos kilogramos de cementita se forman?
        respuesta:
          tipo: magnitud
          valor: '0.4864 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '3.014 kg'
            mensaje: |
              Palanca al revés: eso es la ferrita. La cementita es el brazo del
              lado de la ferrita, $0{,}95 - 0{,}022$.
          - valor: '0.112 kg'
            mensaje: |
              Eso es solo la cementita **proeutectoide**. La pregunta es por la
              fase entera, que incluye también la de las láminas de la perlita.
        pista: |
          $m_{\text{Fe}_3\text{C}} = 3{,}5\cdot(0{,}95 - 0{,}022)/6{,}678$, o
          $3{,}5 - m_{\alpha}$.
        desarrollo: |
          $$
          m_{\text{Fe}_3\text{C}} = 3{,}5\cdot\frac{0{,}95 - 0{,}022}{6{,}678}
          = 3{,}5\cdot 0{,}139 = 0{,}49\ \text{kg}
          $$

      - tipo: calcular
        titulo: La perlita
        pregunta: |
          ¿Cuántos kilogramos de perlita se forman?
        respuesta:
          tipo: magnitud
          valor: '3.388 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '0.112 kg'
            mensaje: |
              Palanca al revés: eso es la cementita proeutectoide. La perlita
              es el brazo opuesto a la perlita, $6{,}70 - 0{,}95$.
          - valor: '4.401 kg'
            mensaje: |
              Has tratado el acero como hipoeutectoide, con la palanca entre
              0,022 y 0,76. Da más perlita que acero hay, que es la señal:
              con 0,95 % C la palanca va entre 0,76 y 6,70.
        pista: |
          $m_{\text{perlita}} = 3{,}5\cdot(6{,}70 - 0{,}95)/(6{,}70 - 0{,}76)$.
        desarrollo: |
          $$
          m_{\text{perlita}} = 3{,}5\cdot\frac{6{,}70 - 0{,}95}{6{,}70 - 0{,}76}
          = 3{,}5\cdot 0{,}968 = 3{,}39\ \text{kg}
          $$

      - tipo: calcular
        titulo: La cementita proeutectoide
        pregunta: |
          ¿Cuántos kilogramos de cementita proeutectoide se forman?
        respuesta:
          tipo: magnitud
          valor: '0.112 kg'
          tolerancia: 0.12
          formato: una masa, con su unidad
        distractores:
          - valor: '0.486 kg'
            mensaje: |
              Esa es la cementita **total**, la de la palanca de fases. La
              proeutectoide es solo la que queda fuera de la perlita, y sale
              con la palanca entre 0,76 y 6,70.
          - valor: '3.388 kg'
            mensaje: |
              Palanca al revés: eso es la perlita. La cementita proeutectoide
              es el brazo del lado de la perlita, $0{,}95 - 0{,}76$.
        pista: |
          $m_{\text{Fe}_3\text{C},\text{pro}} = 3{,}5\cdot(0{,}95 - 0{,}76)/(6{,}70 - 0{,}76)$,
          o $3{,}5 - m_{\text{perlita}}$.
        desarrollo: |
          $$
          m_{\text{Fe}_3\text{C},\text{pro}} = 3{,}5\cdot\frac{0{,}95 - 0{,}76}{5{,}94}
          = 3{,}5\cdot 0{,}032 = 0{,}112\ \text{kg}
          $$

          El listado da 0,10 kg porque redondea la fracción a 0,03 antes de
          multiplicar. La casilla acepta los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              0,95 es mayor que 0,76: el acero es hipereutectoide, y su fase
              proeutectoide es la cementita.
          - texto: >-
              La palanca de fases, de 0,022 a 6,70, da 3,01 kg de ferrita y
              0,49 kg de cementita.
          - texto: >-
              La de microconstituyentes, de 0,76 a 6,70, da 3,39 kg de perlita
              y 0,11 kg de cementita proeutectoide.
          - texto: >-
              Como el acero es hipereutectoide, no tiene ferrita.
            trampa: true
            mensaje: |
              Tiene 3,01 kg de ferrita: toda la de la perlita, que es un 89 %
              ferrita. Lo que no tiene es ferrita **proeutectoide**.
    resolucion: |
      **a) La fase proeutectoide.** 0,95 % C está por encima del eutectoide,
      0,76: el acero es hipereutectoide y la fase proeutectoide es la
      **cementita**.

      **b) Las fases.** Palanca entre la ferrita y la cementita:

      $$
      m_{\alpha} = 3{,}5\cdot\frac{6{,}70 - 0{,}95}{6{,}70 - 0{,}022} = 3{,}01\ \text{kg}
      \qquad
      m_{\text{Fe}_3\text{C}} = 3{,}5\cdot\frac{0{,}95 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}49\ \text{kg}
      $$

      **c) Los microconstituyentes.** Palanca entre la perlita y la cementita
      proeutectoide:

      $$
      m_{\text{perlita}} = 3{,}5\cdot\frac{6{,}70 - 0{,}95}{6{,}70 - 0{,}76} = 3{,}39\ \text{kg}
      \qquad
      m_{\text{Fe}_3\text{C},\text{pro}} = 3{,}5\cdot\frac{0{,}95 - 0{,}76}{6{,}70 - 0{,}76} = 0{,}112\ \text{kg}
      $$

      > El listado da **3,40 kg** de perlita y **0,10 kg** de cementita
      > proeutectoide. Salen de redondear las fracciones a dos decimales antes
      > de multiplicar: $0{,}97\cdot 3{,}5 = 3{,}395$ y $0{,}03\cdot 3{,}5 = 0{,}105$.
      > Sin redondear son 3,39 y 0,112. En la perlita la diferencia es de un
      > 0,3 %; en la cementita proeutectoide, que es poca masa, el mismo
      > redondeo la mueve un 10 %. La casilla acepta las dos versiones.

      **La comprobación.** La cementita de la perlita es
      $3{,}388\cdot 0{,}1105 = 0{,}374$ kg, y sumada a la proeutectoide da
      $0{,}374 + 0{,}112 = 0{,}486$ kg: la cementita total del apartado b).

      **Lo que hay que llevarse.** Fases y microconstituyentes son dos
      repartos de la misma masa, cada uno con su palanca. En un
      hipereutectoide la palanca de microconstituyentes va de 0,76 a 6,70.

  - id: ejcm4-col427-seis-kilos-de-austenita-con-045-c
    titulo: Seis kilos de austenita con 0,45 % C
    fuente: >-
      Ejercicio 4.27 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Si se enfrían $6\ \text{kg}$ de austenita con 0,45 % C hasta
      temperaturas inferiores a 727 °C. (Ver figura 6).

      a) ¿Cuál es la fase proeutectoide?

      b) ¿Cuántos kilogramos de ferrita y de cementita se forman?

      c) ¿Cuántos kilogramos de perlita y de fase proeutectoide se forman?
    pide: >-
      La fase proeutectoide y las masas de ferrita, cementita, perlita y fase
      proeutectoide.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la fase proeutectoide de este acero?
        opciones:
          - texto: >-
              La ferrita, porque 0,45 % C está por debajo del eutectoide
            correcta: true
            mensaje: |
              Eso es. El acero es hipoeutectoide: al enfriar, la austenita
              entra en la región α + γ y suelta ferrita antes de 727 °C.
          - texto: >-
              La cementita, porque es la fase dura que aparece primero
            mensaje: |
              La cementita proeutectoide solo aparece por encima de 0,76 % C.
              Con 0,45 toda la cementita del acero estará dentro de la perlita.
          - texto: >-
              Ninguna, porque 0,45 es un acero de bajo carbono
            mensaje: |
              «Bajo carbono» no es una categoría del diagrama. Cualquier acero
              que no tenga exactamente 0,76 % C tiene una fase proeutectoide.

      - tipo: calcular
        titulo: La ferrita
        pregunta: |
          ¿Cuántos kilogramos de ferrita se forman?
        respuesta:
          tipo: magnitud
          valor: '5.616 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '2.520 kg'
            mensaje: |
              Eso es solo la ferrita **proeutectoide**, la de la palanca entre
              0,022 y 0,76. La pregunta es por la fase entera, que incluye la
              ferrita de dentro de la perlita.
          - valor: '0.3845 kg'
            mensaje: |
              Palanca al revés: eso es la cementita. La ferrita es el brazo del
              lado de la cementita, $6{,}70 - 0{,}45$.
        pista: |
          $m_{\alpha} = 6\cdot(6{,}70 - 0{,}45)/(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          m_{\alpha} = 6\cdot\frac{6{,}70 - 0{,}45}{6{,}678} = 6\cdot 0{,}936
          = 5{,}62\ \text{kg}
          $$

          El listado da 5,64 kg porque redondea la fracción a 0,94. La casilla
          acepta los dos.

      - tipo: calcular
        titulo: La cementita
        pregunta: |
          ¿Cuántos kilogramos de cementita se forman?
        respuesta:
          tipo: magnitud
          valor: '0.3845 kg'
          tolerancia: 0.07
          formato: una masa, con su unidad
        distractores:
          - valor: '3.480 kg'
            mensaje: |
              Has usado 0,76 como extremo en vez de 6,70, y eso da la
              **perlita**. La cementita es la fase de 6,70 % C.
          - valor: '5.616 kg'
            mensaje: |
              Palanca al revés: eso es la ferrita. La cementita es el brazo del
              lado de la ferrita, $0{,}45 - 0{,}022$.
        pista: |
          $m_{\text{Fe}_3\text{C}} = 6\cdot(0{,}45 - 0{,}022)/6{,}678$, o
          $6 - m_{\alpha}$.
        desarrollo: |
          $$
          m_{\text{Fe}_3\text{C}} = 6\cdot\frac{0{,}45 - 0{,}022}{6{,}678}
          = 6\cdot 0{,}0641 = 0{,}385\ \text{kg}
          $$

          El listado da 0,36 kg porque redondea la fracción a 0,06. En una
          masa tan pequeña eso es un 6 %, y la casilla acepta los dos.

      - tipo: calcular
        titulo: La perlita
        pregunta: |
          ¿Cuántos kilogramos de perlita se forman?
        respuesta:
          tipo: magnitud
          valor: '3.480 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '2.520 kg'
            mensaje: |
              Palanca al revés: eso es la ferrita proeutectoide. La perlita es
              el brazo del lado de la ferrita, $0{,}45 - 0{,}022$.
          - valor: '0.3845 kg'
            mensaje: |
              Has usado la palanca de fases y has sacado la cementita. La
              perlita no es cementita: es ferrita y cementita juntas, y su
              palanca va de 0,022 a 0,76.
        pista: |
          $m_{\text{perlita}} = 6\cdot(0{,}45 - 0{,}022)/(0{,}76 - 0{,}022)$.
        desarrollo: |
          $$
          m_{\text{perlita}} = 6\cdot\frac{0{,}45 - 0{,}022}{0{,}738}
          = 6\cdot 0{,}580 = 3{,}48\ \text{kg}
          $$

      - tipo: calcular
        titulo: La ferrita proeutectoide
        pregunta: |
          ¿Cuántos kilogramos de ferrita proeutectoide se forman?
        respuesta:
          tipo: magnitud
          valor: '2.520 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '5.616 kg'
            mensaje: |
              Esa es la ferrita **total**, la de la palanca de fases. La
              proeutectoide es solo la que se formó antes de 727 °C, fuera de
              la perlita.
          - valor: '3.480 kg'
            mensaje: |
              Palanca al revés: eso es la perlita. La ferrita proeutectoide es
              el brazo del lado de la perlita, $0{,}76 - 0{,}45$.
        pista: |
          $m_{\alpha,\text{pro}} = 6 - m_{\text{perlita}}$, o
          $6\cdot(0{,}76 - 0{,}45)/0{,}738$.
        desarrollo: |
          $$
          m_{\alpha,\text{pro}} = 6\cdot\frac{0{,}76 - 0{,}45}{0{,}738}
          = 6\cdot 0{,}420 = 2{,}52\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              0,45 es menor que 0,76: el acero es hipoeutectoide, y su fase
              proeutectoide es la ferrita.
          - texto: >-
              La palanca de fases da 5,62 kg de ferrita y 0,38 kg de
              cementita.
          - texto: >-
              La de microconstituyentes, de 0,022 a 0,76, da 3,48 kg de perlita
              y 2,52 kg de ferrita proeutectoide.
          - texto: >-
              En un hipoeutectoide toda la ferrita es proeutectoide, así que la
              ferrita total y la proeutectoide son la misma.
            trampa: true
            mensaje: |
              La perlita lleva ferrita dentro: $3{,}48\cdot 0{,}889 = 3{,}10$
              kg. Proeutectoide más eutectoide, $2{,}52 + 3{,}10 = 5{,}62$ kg,
              que es la ferrita total.
    resolucion: |
      **a) La fase proeutectoide.** 0,45 % C está por debajo de 0,76: el acero
      es hipoeutectoide y la fase proeutectoide es la **ferrita**.

      **b) Las fases.** Palanca entre la ferrita y la cementita:

      $$
      m_{\alpha} = 6\cdot\frac{6{,}70 - 0{,}45}{6{,}70 - 0{,}022} = 5{,}62\ \text{kg}
      \qquad
      m_{\text{Fe}_3\text{C}} = 6\cdot\frac{0{,}45 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}385\ \text{kg}
      $$

      > El listado da **5,64 kg** de ferrita y **0,36 kg** de cementita. Salen
      > de redondear las fracciones a 0,94 y 0,06 antes de multiplicar por
      > 6 kg. Sin redondear son 5,62 y 0,385. Es el mismo redondeo que en el
      > ejercicio 4.26, y la casilla acepta las dos versiones.

      **c) Los microconstituyentes.** Palanca entre la ferrita proeutectoide y
      la perlita:

      $$
      m_{\text{perlita}} = 6\cdot\frac{0{,}45 - 0{,}022}{0{,}76 - 0{,}022} = 3{,}48\ \text{kg}
      \qquad
      m_{\alpha,\text{pro}} = 6\cdot\frac{0{,}76 - 0{,}45}{0{,}76 - 0{,}022} = 2{,}52\ \text{kg}
      $$

      Son los dos valores del listado.

      **La comprobación.** La perlita es un 89 % ferrita:
      $3{,}48\cdot 0{,}889 = 3{,}10$ kg de ferrita eutectoide. Más la
      proeutectoide, $3{,}10 + 2{,}52 = 5{,}62$ kg, que es la ferrita total del
      apartado b).

      **Lo que hay que llevarse.** Es el espejo del 4.26: en un
      hipoeutectoide la palanca de microconstituyentes va de 0,022 a 0,76, y
      la cementita está toda dentro de la perlita.

  - id: ejcm4-col428-la-ferrita-eutectoide-de-un-acero-de-03-c
    titulo: La ferrita eutectoide de un acero de 0,3 % C
    fuente: >-
      Ejercicio 4.28 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Considera $1{,}5\ \text{kg}$ de acero al carbono con 0,3 % C enfriados
      hasta temperatura justamente inferior al eutectoide. (Ver figura 6).

      a) ¿Cuántos kilogramos de ferrita proeutectoide se forman?

      b) ¿Cuántos kilogramos de ferrita eutectoide se forman?

      c) ¿Cuántos kilogramos de cementita se forman?
    pide: Las masas de ferrita proeutectoide, ferrita eutectoide y cementita.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la ferrita eutectoide, y cómo se saca?
        opciones:
          - texto: >-
              La que está dentro de la perlita: la ferrita total menos la
              proeutectoide
            correcta: true
            mensaje: |
              Eso es. La palanca de fases da la ferrita total y la de
              microconstituyentes la proeutectoide. La diferencia es la
              ferrita de las láminas de la perlita.
          - texto: >-
              La ferrita total, la de la palanca de fases
            mensaje: |
              La total incluye también la proeutectoide, que se formó antes de
              727 °C y fuera de la perlita. La eutectoide es solo la que salió
              en la reacción eutectoide.
          - texto: >-
              La perlita entera, porque es el microconstituyente eutectoide
            mensaje: |
              La perlita lleva ferrita y cementita. La ferrita eutectoide es
              solo su parte de ferrita, un 89 % de ella.

      - tipo: calcular
        titulo: La ferrita proeutectoide
        pregunta: |
          ¿Cuántos kilogramos de ferrita proeutectoide se forman?
        respuesta:
          tipo: magnitud
          valor: '0.935 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '0.565 kg'
            mensaje: |
              Palanca al revés: eso es la perlita. La ferrita proeutectoide es
              el brazo del lado de la perlita, $0{,}76 - 0{,}3$.
          - valor: '1.438 kg'
            mensaje: |
              Esa es la ferrita **total**, la de la palanca de fases. La
              proeutectoide sale con la de microconstituyentes, entre 0,022 y
              0,76.
        pista: |
          $m_{\alpha,\text{pro}} = 1{,}5\cdot(0{,}76 - 0{,}3)/(0{,}76 - 0{,}022)$.
        desarrollo: |
          $$
          m_{\alpha,\text{pro}} = 1{,}5\cdot\frac{0{,}76 - 0{,}3}{0{,}738}
          = 1{,}5\cdot 0{,}623 = 0{,}935\ \text{kg}
          $$

      - tipo: calcular
        titulo: La ferrita eutectoide
        pregunta: |
          ¿Cuántos kilogramos de ferrita eutectoide se forman?
        respuesta:
          tipo: magnitud
          valor: '0.503 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '1.438 kg'
            mensaje: |
              Esa es la ferrita total. Le falta restar la proeutectoide, que
              no se formó en la reacción eutectoide.
          - valor: '0.565 kg'
            mensaje: |
              Eso es la perlita entera. La perlita lleva también su cementita;
              la ferrita eutectoide es solo el 89 % de esos 0,565 kg.
        pista: |
          Ferrita total con la palanca de fases, menos la proeutectoide.
        desarrollo: |
          $$
          m_{\alpha} = 1{,}5\cdot\frac{6{,}70 - 0{,}3}{6{,}678} = 1{,}438\ \text{kg}
          \qquad
          m_{\alpha,\text{eut}} = 1{,}438 - 0{,}935 = 0{,}503\ \text{kg}
          $$

          O desde la perlita: $0{,}565\cdot 0{,}889 = 0{,}503$ kg.

      - tipo: calcular
        titulo: La cementita
        pregunta: |
          ¿Cuántos kilogramos de cementita se forman?
        respuesta:
          tipo: magnitud
          valor: '0.0624 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '1.438 kg'
            mensaje: |
              Palanca al revés: eso es la ferrita. La cementita es el brazo del
              lado de la ferrita, $0{,}3 - 0{,}022$.
          - valor: '0.565 kg'
            mensaje: |
              Has usado 0,76 como extremo en lugar de 6,70, y eso da la
              perlita. La cementita es la fase de 6,70 % C.
          - valor: '0.0672 kg'
            mensaje: |
              Has tomado la ferrita como hierro puro, 0 % C. En una masa tan
              pequeña eso se nota: la figura da 0,022 % C a la ferrita, y con
              él sale 0,062 kg.
        pista: |
          $m_{\text{Fe}_3\text{C}} = 1{,}5\cdot(0{,}3 - 0{,}022)/(6{,}70 - 0{,}022)$.
        desarrollo: |
          $$
          m_{\text{Fe}_3\text{C}} = 1{,}5\cdot\frac{0{,}3 - 0{,}022}{6{,}678}
          = 1{,}5\cdot 0{,}0416 = 0{,}0624\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La palanca de microconstituyentes da 0,935 kg de ferrita
              proeutectoide y 0,565 kg de perlita.
          - texto: >-
              La de fases da 1,438 kg de ferrita total y 0,062 kg de cementita.
          - texto: >-
              La ferrita eutectoide es la diferencia, 0,503 kg, y es el 89 % de
              la perlita.
          - texto: >-
              La cementita de este acero es cementita proeutectoide.
            trampa: true
            mensaje: |
              En un hipoeutectoide no hay cementita proeutectoide: toda está en
              las láminas de la perlita. Por eso
              $0{,}565\cdot 0{,}1105 = 0{,}062$ kg, lo mismo que da la palanca
              de fases.
    resolucion: |
      **a) La ferrita proeutectoide.** Con 0,3 % C el acero es hipoeutectoide.
      Palanca de microconstituyentes:

      $$
      m_{\alpha,\text{pro}} = 1{,}5\cdot\frac{0{,}76 - 0{,}3}{0{,}76 - 0{,}022} = 0{,}935\ \text{kg}
      $$

      El resto, 0,565 kg, es perlita.

      **b) La ferrita eutectoide.** Es la de dentro de la perlita. Se saca
      restando a la ferrita total la proeutectoide:

      $$
      m_{\alpha} = 1{,}5\cdot\frac{6{,}70 - 0{,}3}{6{,}70 - 0{,}022} = 1{,}438\ \text{kg}
      \qquad
      m_{\alpha,\text{eut}} = 1{,}438 - 0{,}935 = 0{,}503\ \text{kg}
      $$

      **c) La cementita.**

      $$
      m_{\text{Fe}_3\text{C}} = 1{,}5\cdot\frac{0{,}3 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}062\ \text{kg}
      $$

      > El listado da **0,933**, **0,504** y **0,063 kg**. Esos valores salen
      > con 0,02 para la ferrita, en vez del 0,022 de la figura, y con las
      > fracciones redondeadas a tres decimales: $0{,}622\cdot 1{,}5 = 0{,}933$
      > y $0{,}958\cdot 1{,}5 - 0{,}933 = 0{,}504$. Las diferencias no pasan
      > del 1 %, y la casilla acepta las dos versiones.

      **La comprobación.** En un hipoeutectoide toda la cementita está en la
      perlita: $0{,}565\cdot 0{,}1105 = 0{,}062$ kg, y la ferrita eutectoide es
      el resto de la perlita, $0{,}565 - 0{,}062 = 0{,}503$ kg. Cuadra.

      **Lo que hay que llevarse.** «Eutectoide» pegado a una fase es la parte
      de esa fase que está dentro de la perlita. Se saca por diferencia, o
      multiplicando la perlita por su 89 % de ferrita.

  - id: ejcm4-col429-la-cementita-de-las-laminas
    titulo: La cementita de las láminas de un acero hipereutectoide
    fuente: >-
      Ejercicio 4.29 · Tema 4, «Diagramas de fase. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Del estudio metalográfico de un acero hipereutectoide se obtiene que un
      porcentaje del área de la imagen (figura 6), que se corresponde al
      10,225 % en masa, corresponde a cementita en láminas dentro del
      microconstituyente eutectoide.

      a) Calcula la composición del acero.

      b) Dibuja las microestructuras de equilibrio de este acero al enfriar
      lentamente desde austenita, indicando las fases y los
      microconstituyentes presentes en cada caso.

      c) Si se disponen de $50\ \text{kg}$ de hierro, determina qué cantidad de
      cementita habría que añadir para obtener la composición de este acero.
    pide: >-
      La composición del acero, la secuencia de microestructuras al enfriar y
      la cementita que hay que añadir a 50 kg de hierro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es exactamente ese 10,225 % en masa?
        opciones:
          - texto: >-
              La cementita eutectoide: la de las láminas de la perlita, que es
              el 11,05 % de la perlita
            correcta: true
            mensaje: |
              Eso es. «En láminas dentro del microconstituyente eutectoide» es
              la cementita de la perlita, y solo esa. Dividiendo entre su
              proporción dentro de la perlita sale cuánta perlita hay.
          - texto: >-
              La cementita total del acero
            mensaje: |
              Leída así, la palanca de fases da 0,70 % C, que es un acero
              **hipo**eutectoide, y el enunciado dice hiper. La total incluye
              la proeutectoide, y el dato es solo la de las láminas.
          - texto: >-
              La cementita proeutectoide
            mensaje: |
              La proeutectoide está en los bordes de grano, fuera de la
              perlita. El enunciado dice «en láminas dentro del
              microconstituyente eutectoide»: esa es la de la perlita.

      - tipo: calcular
        titulo: La fracción de perlita
        pregunta: |
          ¿Qué fracción del acero es perlita?
        respuesta:
          tipo: numero
          valor: '0.9253'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.8978'
            mensaje: |
              Has tomado el 10,225 % como cementita proeutectoide y la perlita
              como el resto, $1 - 0{,}10225$. Pero esa cementita está dentro
              de la perlita, no fuera.
          - valor: '0.115'
            mensaje: |
              Has dividido entre la **ferrita** de la perlita, 0,889. La
              perlita es un 11,05 % cementita, y es entre eso entre lo que hay
              que dividir.
        pista: |
          La perlita es un $0{,}738/6{,}678 = 11{,}05\ \%$ cementita, así que
          $W_{\text{perlita}}\cdot 0{,}1105 = 0{,}10225$.
        desarrollo: |
          $$
          W_{\text{perlita}} = \frac{0{,}10225}{0{,}1105} = 0{,}925
          $$

      - tipo: calcular
        titulo: La composición del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '1.204'
          tolerancia: 0.02
          formato: un porcentaje en masa de carbono, sin el símbolo
        distractores:
          - valor: '1.367'
            mensaje: |
              Has tratado el 10,225 % como cementita proeutectoide:
              $0{,}76 + 0{,}10225\cdot 5{,}94$. Es la cementita de las
              láminas, dentro de la perlita, y la proeutectoide es otra.
          - valor: '0.705'
            mensaje: |
              Has tratado el 10,225 % como la cementita total. Sale un acero
              hipoeutectoide, y el enunciado dice que es hiper: esa
              contradicción es la señal de que el dato es otra cosa.
        pista: |
          En un hipereutectoide,
          $W_{\text{perlita}} = (6{,}70 - C_0)/(6{,}70 - 0{,}76)$.
        desarrollo: |
          $$
          C_0 = 6{,}70 - 0{,}9253\cdot(6{,}70 - 0{,}76) = 1{,}204\ \%\ \text{C}
          $$

      - tipo: reconocer
        pregunta: |
          Al enfriar lentamente este acero desde austenita, ¿qué secuencia de
          microestructuras aparece?
        opciones:
          - texto: >-
              Austenita; hacia 860 °C empieza a salir cementita proeutectoide
              en los bordes de grano; por debajo de 727 °C, perlita rodeada de
              esa red de cementita
            correcta: true
            mensaje: |
              Eso es. Por debajo de 727 °C las fases son ferrita y cementita, y
              los microconstituyentes perlita (92,5 %) y cementita
              proeutectoide (7,5 %).
          - texto: >-
              Austenita; ferrita proeutectoide en los bordes de grano; por
              debajo de 727 °C, perlita y ferrita
            mensaje: |
              Esa es la secuencia de un hipoeutectoide. Con 1,2 % C la
              austenita cruza la línea de la cementita, no la región α + γ.
          - texto: >-
              Austenita, que a 727 °C pasa entera a perlita
            mensaje: |
              Eso solo le pasa al acero de 0,76 % C. Este tiene carbono de más,
              y lo suelta como cementita antes de llegar a 727 °C.
          - texto: >-
              Austenita que a 1147 °C da el eutéctico
            mensaje: |
              El eutéctico solo aparece por encima de 2,14 % C, en las
              fundiciones. Un acero de 1,2 % C no toca la línea de 1147 °C.

      - tipo: calcular
        titulo: La cementita que hay que añadir
        pregunta: |
          ¿Cuánta cementita hay que añadir a 50 kg de hierro para tener este
          acero?
        respuesta:
          tipo: magnitud
          valor: '10.95 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '8.955 kg'
            mensaje: |
              Has tomado los 50 kg como la masa final: 0,6 kg de carbono, que
              van en 8,96 kg de cementita. Pero la cementita que añades también
              pesa, y el 1,2 % es de los $50 + m$ kg del final.
          - valor: '0.607 kg'
            mensaje: |
              Eso es el carbono que habría que añadir si fuera carbono puro. Se
              añade cementita, que solo es un 6,70 % carbono.
        pista: |
          El carbono lo aporta solo la cementita:
          $0{,}067\,m = 0{,}012\,(50 + m)$.
        desarrollo: |
          $$
          \frac{6{,}70\,m}{50 + m} = 1{,}204
          \;\Longrightarrow\;
          m = \frac{50\cdot 1{,}204}{6{,}70 - 1{,}204} = 10{,}95\ \text{kg}
          $$

          Con 1,2 exacto sale $60/5{,}5 = 10{,}91$ kg. La casilla acepta los
          dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Toda la cementita de las láminas está en la perlita, que es un
              11,05 % cementita.
          - texto: >-
              Así, $W_{\text{perlita}} = 0{,}10225/0{,}1105 = 0{,}925$, y la
              palanca de 0,76 a 6,70 da $C_0 = 1{,}20$ % C.
          - texto: >-
              Para llegar a 1,2 % C con 50 kg de hierro hay que añadir unos
              10,9 kg de cementita, y la masa final sube a unos 61 kg.
          - texto: >-
              La cementita que hay que añadir es la que lleva el 1,2 % de
              50 kg de carbono: 0,6 kg de carbono en 8,96 kg de cementita.
            trampa: true
            mensaje: |
              El 1,2 % es de la masa **final**, que incluye la cementita
              añadida. Con 8,96 kg el acero pesaría 58,96 kg y tendría
              $0{,}6/58{,}96 = 1{,}02$ % C.
    resolucion: |
      **a) La composición.** El 10,225 % es la cementita **eutectoide**, la
      de las láminas de la perlita. La perlita tiene siempre la misma
      proporción de cementita:

      $$
      \frac{0{,}76 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}1105
      \qquad
      W_{\text{perlita}} = \frac{0{,}10225}{0{,}1105} = 0{,}925
      $$

      Y en un hipereutectoide la perlita es el brazo de la cementita en la
      palanca de 0,76 a 6,70:

      $$
      C_0 = 6{,}70 - 0{,}9253\cdot(6{,}70 - 0{,}76) = 1{,}204\ \%\ \text{C}
      $$

      Coincide con el listado. Leer el dato como cementita total daría 0,70 %
      C, un hipoeutectoide, y como proeutectoide 1,37 % C. Y con la ferrita
      como hierro puro saldría 1,35: aquí el 0,022 importa.

      **b) Las microestructuras.** Por encima de la línea de la cementita el
      acero es **austenita**. Al cruzarla, hacia 860 °C, empieza a salir
      **cementita proeutectoide** en los bordes de grano. A 727 °C la
      austenita que queda, ya con 0,76 % C, se transforma en **perlita**. Por
      debajo, la microestructura es perlita (92,5 %) rodeada de una red de
      cementita proeutectoide (7,5 %), y las fases son ferrita y cementita.

      **c) La cementita que hay que añadir.** Todo el carbono entra con la
      cementita, que es un 6,70 % C:

      $$
      \frac{6{,}70\,m}{50 + m} = 1{,}20
      \;\Longrightarrow\;
      m = \frac{50\cdot 1{,}20}{6{,}70 - 1{,}20} = 10{,}9\ \text{kg}
      $$

      Con el 1,204 sin redondear sale 10,95 kg. La casilla acepta los dos.

      > El listado etiqueta el 10,9 kg como «b)», pero es la respuesta del
      > apartado **c)**. El b) es un dibujo y no tiene resultado numérico.

      **Lo que hay que llevarse.** Antes de elegir palanca, localiza en la
      microestructura de qué cementita te hablan: la de la perlita, la de los
      bordes de grano o la total. Cada una da un acero distinto.
