            <text class="f-cm6-col61-perfiles-l" x="237" y="118" text-anchor="middle" fill="var(--alt)">d) 8660, agua</text>
          </svg>
        veredicto: |
          Si tus cuatro perfiles tienen sus siete puntos, la forma de U y el
          cruce entre a) y c), están bien. Si los has dibujado en ejes
          separados, compáralos con los números de la tabla: lo que tiene que
          quedar es que el medio y el diámetro fijan las distancias, y el
          acero, la dureza a esas distancias.

      - tipo: justificar
        pregunta: Ordena cómo se dibuja cualquiera de los cuatro perfiles. Una pieza es falsa.
        piezas:
          - texto: >-
              En la gráfica del medio de temple, la del aceite en a) y la del
              agua en b), c) y d), se lee con el diámetro la distancia Jominy
              equivalente de las cuatro posiciones.
          - texto: >-
              Cada distancia se lleva a la curva de templabilidad del acero, y
              da la dureza de esa posición.
          - texto: >-
              Se dibuja la dureza frente a la posición en la sección: una U, más
              alta en la superficie que en el centro.
          - texto: >-
              En c) y d) la gráfica del agua cubre los 90 y los 100 mm; el 100 es
              su borde de arriba, donde terminan las cuatro curvas.
          - texto: >-
              La superficie de cualquier probeta es el extremo templado, así que
              su dureza es siempre la del principio de la curva.
            trampa: true
            mensaje: |
              La superficie se enfría deprisa, pero no como el extremo de la
              probeta Jominy. En el caso a) equivale a 12,8 mm, y su dureza es
              47 HRC, no los 57 del principio de la curva. Solo en barras finas
              y en agua se acerca al extremo, como en b), con 1,35 mm.
    resolucion: |
      **El procedimiento es el mismo en los cuatro casos.** Con el diámetro,
      en la gráfica de su medio de temple —«Distancia Jominy equivalente de un
      cilindro templado en aceite» para a) y la del agua para b), c) y d)— se
      leen las distancias Jominy equivalentes de la superficie, los tres
      cuartos del radio, la mitad del radio y el centro. Cada distancia se lleva
      a la curva de templabilidad del acero: los 86xx están en «Curvas de
      templabilidad de cuatro aceros 86xx con distinto carbono», y el 5140, en
      «Curvas de templabilidad de cinco aceros con 0,40 % de C».

      | caso | | superficie | ¾ R | ½ R | centro |
      |---|---|---|---|---|---|
      | a) 8640, 75 mm, aceite | distancia | 12,8 mm | 17,8 mm | 21,6 mm | 25,5 mm |
      | | dureza | 47,3 HRC | 41,6 HRC | 38,8 HRC | 36,6 HRC |
      | b) 5140, 50 mm, agua | distancia | 1,35 mm | 5,3 mm | 8,6 mm | 10,1 mm |
      | | dureza | 56,8 HRC | 53,5 HRC | 47,7 HRC | 45,2 HRC |
      | c) 8630, 90 mm, agua | distancia | 3,3 mm | 10,0 mm | 17,1 mm | 21,8 mm |
      | | dureza | 49,9 HRC | 36,9 HRC | 29,7 HRC | 27,2 HRC |
      | d) 8660, 100 mm, agua | distancia | 3,4 mm | 11,0 mm | 19,8 mm | 25,9 mm |
      | | dureza | 63,9 HRC | 61,5 HRC | 56,7 HRC | 52,7 HRC |

      El perfil es cada fila de durezas puesta sobre la sección, simétrica a
      los dos lados del centro: superficie, ¾ R, ½ R, centro, ½ R, ¾ R,
      superficie.

      **Qué dice cada perfil.** En a), una U baja: en aceite y con 75 mm ni la
      superficie es martensita entera. En b), martensita casi entera fuera y
      12 HRC menos en el centro: el 5140 es poco templable. En c), una caída
      brusca en la capa de fuera y un interior blando: el 8630 tiene poco
      carbono y su curva cae enseguida. En d), un perfil alto y poco hondo, todo
      por encima de 50 HRC: el 8660 es a la vez duro y templable.

      **Tres lecturas en el límite.** En b), la superficie de 50 mm en agua
      equivale a 1,35 mm, antes de la primera lectura del ensayo, a 1,6 mm: se
      toma el valor con el que arranca la curva. En d), 100 mm es el borde de
      arriba de la gráfica del agua, y se lee en el último punto de cada curva.
      Y el 8660 empieza por encima de 60 HRC, fuera de la cuadrícula. La
      gráfica del agua cubre los 90 y los 100 mm; la del aceite no los cubriría
      en el centro, cuya curva termina hacia 83 mm.

      **El 8640 sale dos veces.** Está en las dos gráficas de curvas y no
      coinciden del todo: a las distancias de a) se separan menos de 1 HRC. La
      tabla da la media.

      **Lo que hay que llevarse.** El perfil depende de las tres cosas a la
      vez: el medio y el diámetro fijan las distancias, y el acero, la dureza a
      esas distancias. El mismo diámetro en otro medio, o el mismo medio con
      otro acero, dibuja otro perfil.

  - id: ejcm6-col62-el-8640-y-cuatro-aceros-contra-50-hrc
    titulo: El 8640 en agua y en aceite, y cuatro aceros 86xx contra 50 HRC
    fuente: >-
      Ejercicio 6.2 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección imprime el resultado del apartado b),
      contra el que está contrastado el desarrollo; el del a) no lo imprime, y
      esa resolución es nuestra.
    nivel: practica
    enunciado: |
      a) Dado un acero AISI 8640, dibuja el perfil de dureza radial para una
      probeta cilíndrica de 50 mm de diámetro, para: i) temple en agua, y ii)
      temple en aceite

      b) Al austenizar y templar una probeta cilíndrica de 50 mm de diámetro,
      debe tener como mínimo una dureza de 50 HRC en la superficie y el centro.
      Dados los aceros AISI 8660, 8640, 8630, y 8620, analiza cuál o cuáles
      cumplen la condición, i) en agua, y ii) en aceite.
    pide: >-
      Los dos perfiles de dureza del 8640, en agua y en aceite, y qué aceros de
      los cuatro llegan a 50 HRC en la superficie y en el centro con cada medio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de leer nada: el mismo 8640 de 50 mm, templado en agua y en
          aceite. ¿Cómo serán los dos perfiles?
        opciones:
          - texto: >-
              El de aceite, más bajo en todas las posiciones
            correcta: true
            mensaje: |
              Eso es. En aceite todas las posiciones se enfrían más despacio y
              equivalen a distancias Jominy mayores: la superficie pasa de 1,35
              a 7,1 mm y el centro de 10,1 a 15,5. Sobre una curva que baja, eso
              es menos dureza en todas partes. Si además sale más hondo depende
              de la curva del acero: con el 8640 sí, y con el 8630 de esta misma
              barra, no.
          - texto: >-
              Iguales, porque el acero es el mismo y la templabilidad solo
              depende del acero
            mensaje: |
              La templabilidad solo depende del acero, sí: por eso la curva del
              8640 es la misma en los dos casos. Pero el medio cambia a qué punto
              de esa curva equivale cada posición, y eso cambia la dureza.
          - texto: >-
              El de aceite, más alto, porque un temple menos brusco deja la pieza
              sin tensiones
            mensaje: |
              Menos brusco es, precisamente, menos martensita. El aceite se usa
              para no agrietar la pieza, no para endurecerla más: en aceite cada
              posición sale más blanda que en agua.

      - tipo: calcular
        titulo: La superficie en agua
        pregunta: |
          a) i) En agua, ¿qué dureza tiene la superficie?
        respuesta:
          tipo: numero
          valor: '57'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '54'
            mensaje: |
              Has leído la superficie en la gráfica del **aceite**, a 7,1 mm. En
              agua la superficie de 50 mm equivale a 1,35 mm, casi el extremo
              templado.
          - valor: '50.5'
            mensaje: |
              Esa es la dureza del centro en agua. La superficie es la curva de
              más a la izquierda de la gráfica del agua.
        pista: |
          En la gráfica del agua, a 50 mm, la superficie equivale a 1,35 mm.
          Usa la curva del 8640 de la gráfica de los 86xx, que es la del
          apartado b).
        desarrollo: |
          A 1,35 mm, el 8640 está en **57,1 HRC**: martensita casi entera.

      - tipo: calcular
        titulo: El centro en agua
        pregunta: |
          ¿Y el centro, en agua?
        respuesta:
          tipo: numero
          valor: '50.5'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '43.6'
            mensaje: |
              Has leído el centro en la gráfica del **aceite**, a 15,5 mm. En
              agua el centro de 50 mm equivale a 10,1 mm.
          - valor: '36.8'
            mensaje: |
              Has leído el 8640 a 25 mm, el radio de la barra. La distancia que
              va a la curva es la de la probeta Jominy, y la gráfica del agua da
              10,1 mm para este centro.
          - valor: '57'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua.
        pista: |
          La curva del centro de la gráfica del agua corta los 50 mm hacia
          10 mm.
        desarrollo: |
          El centro de 50 mm en agua equivale a **10,1 mm**, y ahí el 8640 está
          en **50,5 HRC**. La otra curva del 8640, la de «Curvas de
          templabilidad de cinco aceros con 0,40 % de C», da 51,3. Las dos están
          por encima de 50, y eso va a importar en el apartado b).

      - tipo: calcular
        titulo: La superficie en aceite
        pregunta: |
          a) ii) En aceite, ¿qué dureza tiene la superficie?
        respuesta:
          tipo: numero
          valor: '54'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '57'
            mensaje: |
              Esa es la superficie en **agua**. En aceite la superficie de 50 mm
              equivale a 7,1 mm, y la curva ya ha bajado algo.
          - valor: '43.6'
            mensaje: |
              Esa es la dureza del centro en aceite. La superficie es la curva de
              más a la izquierda de la gráfica del aceite.
        pista: |
          En la gráfica del aceite, a 50 mm, la superficie equivale a unos
          7,1 mm.
        desarrollo: |
          La superficie de 50 mm en aceite equivale a **7,1 mm**, y ahí el 8640
          está en **53,9 HRC**.

      - tipo: calcular
        titulo: El centro en aceite
        pregunta: |
          ¿Y el centro, en aceite?
        respuesta:
          tipo: numero
          valor: '43.6'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '50.5'
            mensaje: |
              Ese es el centro en **agua**. En aceite el centro de 50 mm equivale
              a 15,5 mm, bastante más lejos del extremo templado.
          - valor: '36.8'
            mensaje: |
              Has leído el 8640 a 25 mm, el radio de la barra. La distancia del
              centro es la de la gráfica del aceite, 15,5 mm.
          - valor: '54'
            mensaje: |
              Esa es la superficie en aceite. El centro es la curva de más a la
              derecha.
        pista: |
          La curva del centro de la gráfica del aceite, a 50 mm: unos 15,5 mm.
        desarrollo: |
          El centro equivale a **15,5 mm**, y el 8640 está ahí en **43,6 HRC**:
          44,2 en la otra curva.

      - tipo: dibujar
        consigna: |
          Dibuja los dos perfiles radiales del apartado a) en unos mismos
          ejes: la dureza, en HRC, frente a la posición en la sección de la
          probeta, de −25 a 25 mm, con el centro en 0. Marca los siete puntos
          de cada uno —la superficie, los tres cuartos y la mitad del radio a
          cada lado, y el centro— y rotula cuál es el del agua y cuál el del
          aceite.
        comprueba:
          - punto: >-
              Los puntos en su sitio: la superficie en ±25 mm, ¾ R en ±18,75,
              ½ R en ±12,5 y el centro en 0
            porque: >-
              Con un diámetro concreto el eje ya va en milímetros, y ¾ R y ½ R
              quedan a 18,75 y 12,5 mm del centro. Las posiciones no están
              repartidas a partes iguales entre la superficie y el centro.
          - punto: >-
              Agua: 57,1, 55,2, 52,3 y 50,5 HRC, de la superficie al centro.
              Aceite: 53,9, 48,7, 45,5 y 43,6
            porque: >-
              Son las lecturas de la resolución, con la curva del 8640 de los
              86xx. La otra curva del 8640, la de los aceros con 0,40 % de C,
              se aparta de ella 1 HRC como mucho, y eso no cambia el dibujo.
          - punto: >-
              La curva del aceite va por debajo de la del agua en todas las
              posiciones, y es más honda: cae unos 10 HRC frente a unos 7
            porque: >-
              El acero es el mismo; lo que cambia es el medio. En aceite cada
              posición equivale a un punto de la probeta Jominy más alejado del
              extremo templado, y sobre una curva que baja eso es menos dureza
              en todas partes. Que además salga más honda es cosa de esta
              barra, no una regla: en agua sus cuatro posiciones caen entre
              1,35 y 10,1 mm, en el principio casi plano de la curva del 8640,
              y en aceite entre 7,1 y 15,5 mm, donde ya cae deprisa. El 8630
              de esta misma barra hace lo contrario: 15,5 HRC de caída en agua
              y 11,5 en aceite.
          - punto: >-
              Si marcas los 50 HRC, el centro del agua queda justo encima y el
              del aceite, muy por debajo
            porque: >-
              Es el apartado b) leído en el dibujo: el 8640 cumple en agua por
              medio punto y no cumple en aceite. Un dibujo bien hecho deja ver
              el resultado antes de hacer la cuenta.
        figura: |
          <svg viewBox="0 0 440 280" role="img" width="440" height="280" aria-labelledby="f-cm6-col62-perfiles-t f-cm6-col62-perfiles-d">
            <title id="f-cm6-col62-perfiles-t">Los perfiles radiales del 8640 de 50 mm, en agua y en aceite</title>
            <desc id="f-cm6-col62-perfiles-d">Dureza Rockwell C, de 40 a 60, frente a la posición en la sección de una probeta de 50 mm, de menos 25 a 25 mm, con el centro en 0 y la mitad y los tres cuartos del radio a 12,5 y 18,75 mm a cada lado. Dos curvas en U, simétricas, con sus siete puntos. La del agua va de 57,1 HRC en la superficie a 55,2, 52,3 y 50,5 en el centro. La del aceite va por debajo en todas las posiciones, de 53,9 a 48,7, 45,5 y 43,6, y es más honda: cae 10,3 HRC frente a los 6,6 del agua. Una línea discontinua horizontal marca los 50 HRC del apartado b): el centro en agua queda medio punto por encima y el centro en aceite, más de seis por debajo.</desc>
