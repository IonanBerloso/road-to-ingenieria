ejercicios:
  - id: ejcm6-el-centro-de-un-cilindro-templado
    titulo: La dureza en el centro de un cilindro templado
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el perfil de dureza
      del Tema 6 de la asignatura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cilindro de acero 4340 de 75 mm de diámetro se austeniza y se templa
      en agua. Con las gráficas del tema —la de temple en agua y las curvas de
      templabilidad de los aceros con 0,40 % de C—, ¿qué dureza tiene en el
      centro?
    pide: La distancia Jominy equivalente del centro y su dureza.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué orden se usan las dos gráficas?
        opciones:
          - texto: Primero la del agua, para pasar del centro a una distancia Jominy; después la curva del 4340, para pasar de esa distancia a una dureza
            correcta: true
            mensaje: |
              Eso es. La gráfica del medio de temple traduce una posición de
              la pieza a la distancia de la probeta Jominy que se enfría igual,
              y la curva de templabilidad del acero da la dureza de esa
              distancia.
          - texto: Directamente la curva del 4340, con 37,5 mm, que es la distancia del centro a la superficie
            mensaje: |
              La distancia de la curva de templabilidad es la de la probeta
              Jominy, no una distancia dentro de la pieza. El centro de este
              cilindro no se enfría como el punto a 37,5 mm de la probeta, sino
              como el que dice la gráfica del agua.
          - texto: La del aceite, porque es la que corresponde a aceros aleados
            mensaje: |
              La gráfica se elige por el medio de temple, no por el acero. El
              cilindro se ha templado en agua.

      - tipo: calcular
        titulo: La distancia Jominy equivalente
        pregunta: |
          ¿A qué distancia del extremo templado de la probeta Jominy equivale el
          centro del cilindro?
        respuesta:
          tipo: numero
          valor: '16.7'
          tolerancia: 1.5
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '2.9'
            mensaje: |
              Esa es la curva de la **superficie**. El centro es la curva de
              más a la derecha: la posición que más tarda en enfriarse.
          - valor: '25.5'
            mensaje: |
              Has leído en la gráfica del aceite. El cilindro se ha templado en
              agua, que enfría más deprisa: la distancia equivalente es menor.
        pista: |
          En la gráfica del agua, sube desde 75 mm de diámetro hasta la curva
          del centro y baja al eje.
        desarrollo: |
          La curva del centro corta la horizontal de 75 mm de diámetro hacia
          los **16,7 mm** de distancia equivalente.

      - tipo: calcular
        titulo: La dureza del centro
        pregunta: |
          ¿Qué dureza tiene el centro del cilindro?
        respuesta:
          tipo: numero
          valor: '54'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '57'
            mensaje: |
              Esa es la dureza del extremo templado, la de la superficie. El
              centro se lee a 16,7 mm, donde la curva del 4340 ya ha bajado un
              poco.
          - valor: '35'
            mensaje: |
              Esa es la curva de un 5140, no la del 4340. A 16,7 mm el 4340
              apenas ha perdido dureza: es el más templable de la gráfica.
        pista: |
          En la curva del 4340, a 16,7 mm del extremo templado.
        desarrollo: |
          A 16,7 mm la curva del 4340 está hacia **54 HRC**, con más de un 80 %
          de martensita según el eje de la derecha.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El centro de un cilindro de 75 mm templado en agua se enfría como el punto a unos 16,7 mm del extremo de la probeta Jominy.'
          - texto: 'A esa distancia, la curva del 4340 da unos 54 HRC.'
          - texto: 'El 4340 es tan templable que el centro sale casi tan duro como la superficie.'
          - texto: 'El centro está a 37,5 mm de la superficie, así que su dureza se lee a 37,5 mm en la curva.'
            trampa: true
            mensaje: |
              La curva de templabilidad no habla de distancias dentro de la
              pieza, sino de la probeta Jominy. El paso por la gráfica del medio
              de temple es justamente el que convierte una posición de la pieza
              en una velocidad de enfriamiento equivalente.
    resolucion: |
      **Dos gráficas, en este orden.** La del temple en agua convierte el
      centro de un cilindro de 75 mm en una distancia Jominy equivalente: la
      curva del centro corta los 75 mm hacia los **16,7 mm**.

      **Con esa distancia, la curva del acero.** A 16,7 mm del extremo
      templado, el 4340 está hacia **54 HRC**, más de un 80 % de martensita.

      El resultado dice mucho del acero: el centro de una pieza gruesa sale
      casi tan duro como la superficie. Con un 1040 el mismo cálculo daría
      poco más de 20 HRC en el centro: por eso los aceros aleados se eligen
      para piezas gruesas.

  - id: ejcm6-a-que-temperatura-se-normaliza
    titulo: A qué temperatura se normaliza un 1040
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el normalizado del
      Tema 6, con el diagrama hierro-carburo de hierro del Tema 4. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un acero AISI 1040 laminado tiene los granos de tamaño irregular y se
      quiere normalizar. En el diagrama hierro-carburo de hierro del tema 4, la
      línea A3 pasa por un 0,37 % de C a 800 °C y por un 0,46 % a 780 °C. ¿A
      partir de qué temperatura se normaliza?
    pide: La temperatura crítica superior del acero y la mínima de normalizado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Respecto a qué línea se fija la temperatura de normalizado de este
          acero?
        opciones:
          - texto: La A3, la temperatura crítica superior, porque es un acero hipoeutectoide
            correcta: true
            mensaje: |
              Exacto. Con un 0,40 % de C es hipoeutectoide, y su frontera con
              la austenita sola es la A3. El normalizado se hace de 55 a 85 °C
              por encima.
          - texto: La A1, los 727 °C del eutectoide, porque es la temperatura crítica
            mensaje: |
              La A1 es la crítica **inferior**. Justo por encima de ella el
              acero aún tiene ferrita sin disolver; normalizar exige
              austenizarlo entero, por encima de la crítica superior.
          - texto: La Acm, porque es la línea de la cementita
            mensaje: |
              La Acm es la crítica superior de los aceros **hipereutectoides**,
              los de más de 0,76 % de C. Este tiene 0,40 %.

      - tipo: calcular
        titulo: La temperatura crítica superior
        pregunta: |
          ¿A qué temperatura corta la línea A3 al 0,40 % de C?
        respuesta:
          tipo: magnitud
          valor: '793 °C'
          tolerancia: 0.008
          formato: una temperatura, con su unidad
        distractores:
          - valor: '727 °C'
            mensaje: |
              Esa es la A1, la isoterma eutectoide. La A3 de un 0,40 % de C está
              bastante más arriba: entre 780 y 800 °C.
          - valor: '912 °C'
            mensaje: |
              Ahí nace la A3, pero en el hierro puro, con 0 % de C. Con carbono
              la línea baja; hay que leerla en el 0,40 %.
        pista: |
          Interpola entre los dos puntos que da el enunciado.
        desarrollo: |
          $$
          T_{A3} = 800 - (0{,}40 - 0{,}37)\cdot\frac{800 - 780}{0{,}46 - 0{,}37}
          = 800 - 6{,}7 = 793\ ^{\circ}\text{C}
          $$

      - tipo: calcular
        titulo: La temperatura mínima de normalizado
        pregunta: |
          ¿Cuál es la temperatura mínima a la que se normaliza?
        respuesta:
          tipo: magnitud
          valor: '848 °C'
          tolerancia: 0.008
          formato: una temperatura, con su unidad
        distractores:
          - valor: '782 °C'
            mensaje: |
              Has sumado los 55 °C a la A1, 727 °C. El normalizado se cuenta
              desde la crítica **superior**, la A3.
          - valor: '808 °C'
            mensaje: |
              Has usado el margen del recocido total, que es de 15 °C. El del
              normalizado es mayor: de 55 a 85 °C por encima de la A3.
        pista: |
          De 55 a 85 °C por encima de la A3.
        desarrollo: |
          $$
          T_{\text{norm}} = 793 + 55 = 848\ ^{\circ}\text{C}
          $$

          Es decir, entre unos 848 y 878 °C, y después se enfría al aire.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Un 1040 tiene un 0,40 % de C: es hipoeutectoide y su crítica superior es la A3.'
          - texto: 'Interpolando en el diagrama, la A3 del 0,40 % está hacia 793 °C.'
          - texto: 'Se normaliza de 55 a 85 °C por encima, entre unos 848 y 878 °C, y se enfría al aire para sacar perlita fina.'
          - texto: 'Basta con pasar de 727 °C, porque a partir de ahí ya aparece austenita.'
            trampa: true
            mensaje: |
              A partir de 727 °C aparece austenita, pero convive con ferrita
              hasta la A3. Normalizar exige austenizar el acero **entero**,
              para que al enfriar salga perlita fina de grano homogéneo en toda
              la pieza.
    resolucion: |
      **El 1040 es hipoeutectoide**, con un 0,40 % de C, así que su
      temperatura crítica superior es la A3. Interpolando entre los dos puntos
      de la línea:

      $$
      T_{A3} = 800 - (0{,}40 - 0{,}37)\cdot\frac{20}{0{,}09} = 793\ ^{\circ}\text{C}
      $$

      **El normalizado se hace de 55 a 85 °C por encima**, entre unos 848 y
      878 °C, para austenizar el acero entero; después se enfría al aire y sale
      perlita fina con el grano igualado. Un recocido total, en cambio, se
      quedaría más cerca, de 15 a 40 °C por encima, y se enfriaría dentro del
      horno.

  - id: ejcm6-col61-cuatro-perfiles-de-dureza
    titulo: Cuatro perfiles de dureza, cada uno con sus dos gráficas
    fuente: >-
      Ejercicio 6.1 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección no imprime resultado; la resolución es
      nuestra.
    nivel: practica
    enunciado: |
      Dibuja el perfil de dureza en los siguientes casos:

      a) Temple de una probeta de 75 mm de diámetro de acero 8640 en aceite.

      b) Temple de una probeta de 50 mm de diámetro de acero 5140 en agua.

      c) Temple de una probeta de 90 mm de diámetro de acero 8630 en agua.

      d) Temple de una probeta de 100 mm de diámetro de acero 8660 en agua.
    pide: >-
      La dureza en la superficie, a tres cuartos del radio, a la mitad del radio
      y en el centro de cada probeta, leída con la gráfica de su medio de temple
      y la curva de templabilidad de su acero, y la forma del perfil que dibujan.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el caso a) la probeta de 8640 se templa en aceite. ¿Con qué gráfica
          se pasa de un punto de la probeta a su distancia Jominy equivalente?
        opciones:
          - texto: >-
              Con «Distancia Jominy equivalente de un cilindro templado en
              aceite», porque la gráfica se elige por el medio en que se templa
              la pieza
            correcta: true
            mensaje: |
              Eso es. Hay una gráfica por medio porque el mismo punto de la
              misma barra se enfría más despacio en aceite que en agua. El acero
              entra después, con su curva de templabilidad.
          - texto: >-
              Con la del agua, porque el ensayo Jominy siempre se templa con un
              chorro de agua
            mensaje: |
              El chorro de agua es del ensayo, y ya está dentro de la curva de
              templabilidad. La gráfica de diámetros traduce el temple de **tu**
              pieza, y la tuya va al aceite: con la del agua saldría una
              distancia menor y una dureza que la pieza no tiene.
          - texto: >-
              Con ninguna: la dureza del centro se lee directamente en la curva
              del 8640, a 37,5 mm, que es el radio
            mensaje: |
              La distancia de la curva de templabilidad es la de la probeta
              Jominy, no una distancia dentro de tu barra. Sin la gráfica del
              medio no hay forma de saber a qué punto de la probeta Jominy
              equivale el centro.

      - tipo: calcular
        titulo: La superficie del caso a)
        pregunta: |
          ¿Qué dureza tiene la superficie de la probeta del caso a)?
        respuesta:
          tipo: numero
          valor: '47.3'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '56.5'
            mensaje: |
              Has leído la superficie en la gráfica del **agua**, donde a 75 mm
              cae hacia 2,9 mm. La probeta va al aceite, y ahí su superficie
              equivale a 12,8 mm: bastante más lejos del extremo templado, y
              bastante más blanda.
          - valor: '36.6'
            mensaje: |
              Esa es la dureza del **centro**: has cogido la curva de más a la
              derecha de la gráfica del aceite. La de la superficie es la de más
              a la izquierda.
        pista: |
          En la gráfica del aceite, sube por los 75 mm hasta la curva de la
          superficie y baja al eje: unos 12,8 mm. Con esa distancia, entra en la
          curva del 8640.
        desarrollo: |
          La curva de la superficie corta los 75 mm hacia **12,8 mm**. A esa
          distancia el 8640 está hacia **47 HRC**: 46,9 en «Curvas de
          templabilidad de cuatro aceros 86xx con distinto carbono» y 47,7 en
          «Curvas de templabilidad de cinco aceros con 0,40 % de C», que traen
          cada una su curva del 8640. La casilla acepta las dos.

      - tipo: calcular
        titulo: El centro del caso a)
        pregunta: |
          ¿Y qué dureza tiene el centro?
        respuesta:
          tipo: numero
          valor: '36.6'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '47.3'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del aceite, la de la posición que más tarda en
              enfriarse: a 75 mm cae hacia 25,5 mm.
          - valor: '42.7'
            mensaje: |
              Has leído el centro en la gráfica del **agua**, donde a 75 mm cae
              en 16,7 mm. En aceite el centro equivale a 25,5 mm, y a esa
              distancia el 8640 ha bajado bastante más.
          - valor: '33.1'
            mensaje: |
              Has leído la curva del 8640 a 37,5 mm, el radio de la barra. Esa
              distancia no es un sitio de la pieza: la de la curva es la de la
              probeta Jominy, y la da la gráfica del aceite, 25,5 mm.
        pista: |
          La curva del centro de la gráfica del aceite, a 75 mm, y esa
          distancia en la curva del 8640.
        desarrollo: |
          El centro de 75 mm en aceite equivale a **25,5 mm**, y ahí el 8640
          está hacia **36,6 HRC**: 36,9 en una curva y 36,4 en la otra.

      - tipo: reconocer
        pregunta: |
          Con unos 47 HRC en la superficie y 36,6 en el centro, ¿qué perfil
          dibuja el caso a)?
        opciones:
          - texto: >-
              Una U baja y abierta: ni la superficie llega a martensita entera,
              que en un acero con 0,40 % de C son unos 56 HRC, y hacia el centro
              pierde otros 10
            correcta: true
            mensaje: |
              Eso es. En aceite, la superficie de una barra de 75 mm equivale a
              12,8 mm del extremo templado, y a esa distancia el 8640 ya ha
              perdido casi 10 HRC. Los dos puntos de en medio, 41,6 y 38,8 HRC,
              completan una U que baja poco a poco.
          - texto: >-
              Plana, porque en aceite toda la barra se enfría despacio y a la
              misma velocidad
            mensaje: |
              Toda la barra se enfría más despacio que en agua, pero no a la
              misma velocidad: la superficie equivale a 12,8 mm y el centro a
              25,5. Esa diferencia son los 10 HRC que separan los dos extremos
              del perfil.
          - texto: >-
              Una U con la superficie a 57 HRC, porque la superficie siempre sale
              con martensita entera
            mensaje: |
              La superficie solo se acerca al extremo templado en barras finas
              templadas en agua. En una de 75 mm templada en aceite equivale a
              12,8 mm, y ahí el 8640 está en 47 HRC: la superficie tampoco es
              martensita entera.

      - tipo: calcular
        titulo: La superficie del caso b)
        pregunta: |
          Caso b), un 5140 de 50 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '56.8'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '50.6'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 50 mm
              equivale a 7,1 mm. En agua equivale a 1,35 mm: prácticamente el
              extremo templado.
          - valor: '45.2'
            mensaje: |
              Esa es la dureza del centro. En la gráfica del agua, la curva de
              la superficie es la de más a la izquierda, la que empieza justo en
              50 mm.
        pista: |
          En la gráfica del agua, la curva de la superficie empieza
          precisamente en 50 mm, hacia 1,35 mm. La curva del 5140 empieza en
          1,6 mm, la primera lectura del ensayo: toma su valor de arranque.
        desarrollo: |
          La superficie de 50 mm en agua equivale a **1,35 mm**, un poco antes
          de donde empieza la curva del 5140, que arranca en 1,6 mm con
          **56,8 HRC**. Más cerca del extremo la dureza no puede subir de la de
          martensita entera, así que se toma ese valor.

      - tipo: calcular
        titulo: El centro del caso b)
        pregunta: |
          ¿Y qué dureza tiene el centro del 5140?
        respuesta:
          tipo: numero
          valor: '45.2'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '38.4'
            mensaje: |
              Has leído el centro en la gráfica del **aceite**, donde equivale a
              15,5 mm. La probeta va al agua, y ahí su centro equivale a 10,1 mm.
          - valor: '32'
            mensaje: |
              Has leído el 5140 a 25 mm, el radio de la barra. La distancia que
              se lleva a la curva es la de la probeta Jominy, y la da la gráfica
              del agua: 10,1 mm.
          - valor: '56.8'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua.
        pista: |
          En la gráfica del agua, a 50 mm, la curva del centro cae hacia 10 mm.
        desarrollo: |
          El centro de 50 mm en agua equivale a **10,1 mm**, y ahí el 5140 está
          en **45,2 HRC**.

      - tipo: reconocer
        pregunta: |
          Con 56,8 HRC en la superficie y 45,2 en el centro, ¿qué perfil dibuja
          el caso b)?
        opciones:
          - texto: >-
              Martensita casi entera en la superficie y una caída de unos 12 HRC
              hacia el centro, casi toda entre la superficie y la mitad del radio
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 5,3 mm, el 5140 tiene 53,5 HRC,
              y a la mitad del radio, 8,6 mm, 47,7: casi toda la caída pasa en
              la mitad de fuera. El 5140 es poco templable, y ni el agua salva
              el centro de 50 mm.
          - texto: >-
              Plana a 57 HRC, porque el agua es el temple más enérgico
            mensaje: |
              El agua da el temple más enérgico, pero el centro de 50 mm sigue
              equivaliendo a 10 mm, y a esa distancia la curva del 5140 ha caído
              a 45. Lo que no aguanta es el acero: su curva es de las que caen
              antes.
          - texto: >-
              Más dura en el centro, porque el centro es el último en enfriarse
              y tiene más tiempo para endurecer
            mensaje: |
              Es al revés. Más tiempo es más difusión del carbono, y eso da
              perlita o bainita, más blandas que la martensita. Cuanto más
              despacio se enfría un punto, más blando sale.

      - tipo: calcular
        titulo: La superficie del caso c)
        pregunta: |
          Caso c), un 8630 de 90 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '49.9'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '29.8'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 90 mm
              equivale a 16,9 mm. En agua equivale a 3,3 mm.
          - valor: '56.4'
            mensaje: |
              Has leído la curva del **8640**, la de encima en la gráfica de los
              86xx. La del 8630 es la de 0,3 % de C, la tercera empezando por
              arriba.
        pista: |
          En la gráfica del agua, a 90 mm, la superficie cae hacia 3,3 mm. En
          la gráfica de los 86xx, la curva del 8630.
        desarrollo: |
          La superficie equivale a **3,3 mm**, y ahí el 8630 está en
          **49,9 HRC**. A 3,3 mm su curva ya ha perdido casi 3 HRC respecto al
          extremo templado.

      - tipo: calcular
        titulo: El centro del caso c)
        pregunta: |
          ¿Y qué dureza tiene el centro del 8630?
        respuesta:
          tipo: numero
          valor: '27.2'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '49.9'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua: a 90 mm cae hacia 21,8 mm.
          - valor: '23.5'
            mensaje: |
              Has leído el 8630 a 45 mm, el radio de la barra. La distancia de la
              curva es la de la probeta Jominy, y para el centro de esta barra la
              gráfica del agua da 21,8 mm.
        pista: |
          La curva del centro de la gráfica del agua, a 90 mm: unos 21,8 mm.
        desarrollo: |
          El centro de 90 mm en agua equivale a **21,8 mm**, y el 8630 está ahí
          en **27,2 HRC**. En la gráfica del aceite ni siquiera se podría leer:
          su curva del centro termina hacia 83 mm.

      - tipo: reconocer
        pregunta: |
          Con 49,9 HRC en la superficie y 27,2 en el centro, ¿qué perfil dibuja
          el caso c)?
        opciones:
          - texto: >-
              Una caída brusca en la capa de fuera, de 50 a 37 HRC antes de los
              tres cuartos del radio, y casi plana y blanda hacia dentro
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 10 mm, el 8630 ya está en
              36,9 HRC, y a la mitad, 17,1 mm, en 29,7. Su curva cae deprisa en
              los primeros milímetros y después se aplana, y el perfil copia esa
              forma.
          - texto: >-
              Una U suave y alta, porque es un acero aleado y en agua templa
              entero
            mensaje: |
              La aleación da templabilidad, pero no la misma a todos. Con un
              0,3 % de C la martensita del 8630 no pasa de 52 HRC ni en el
              extremo, y su curva cae deprisa: a 90 mm, casi toda la sección
              queda por debajo de 37.
          - texto: >-
              No se puede dibujar, porque 90 mm se sale de la gráfica del agua
            mensaje: |
              La gráfica del agua llega a 100 mm, y las cuatro curvas cruzan los
              90. Lo que no llega a 90 es la curva del centro de la gráfica del
              aceite, que termina hacia 83 mm, pero esta probeta va al agua.

      - tipo: calcular
        titulo: La superficie del caso d)
        pregunta: |
          Caso d), un 8660 de 100 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '63.9'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '56.6'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 100 mm
              equivale a unos 20 mm. En agua equivale a 3,4 mm.
          - valor: '52.7'
            mensaje: |
              Esa es la dureza del centro. La superficie es la curva de más a la
              izquierda de la gráfica del agua.
        pista: |
          La gráfica del agua llega justo a 100 mm: las cuatro curvas terminan
          en su borde de arriba. La de la superficie termina hacia 3,4 mm.
        desarrollo: |
          En el borde de arriba, 100 mm, la superficie equivale a **3,4 mm**, y
          ahí el 8660 está en **63,9 HRC**. Su curva empieza por encima de
          60 HRC: hay que leerla por encima de la última línea de la cuadrícula.

      - tipo: calcular
        titulo: El centro del caso d)
        pregunta: |
          ¿Y qué dureza tiene el centro del 8660?
        respuesta:
          tipo: numero
          valor: '52.7'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '63.9'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua, que en 100 mm termina hacia 26 mm.
          - valor: '42'
            mensaje: |
              Has leído el 8660 a 50 mm, el radio de la barra, que es el final
              de su curva. La distancia que se lleva a la curva es la de la
              probeta Jominy: para este centro, unos 26 mm.
        pista: |
          La curva del centro de la gráfica del agua termina, en 100 mm, hacia
          26 mm.
        desarrollo: |
          El centro de 100 mm en agua equivale a unos **26 mm**, y el 8660 está
          ahí en **52,7 HRC**.

      - tipo: reconocer
        pregunta: |
          Con 63,9 HRC en la superficie y 52,7 en el centro, ¿qué perfil dibuja
          el caso d)?
        opciones:
          - texto: >-
              Alto y poco caído: todo por encima de 50 HRC, incluso el centro de
              una barra de 100 mm
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 11 mm, el 8660 tiene 61,5 HRC,
              y a la mitad, 19,8 mm, 56,7. Con un 0,6 % de C su martensita es
              muy dura y su curva cae despacio. Otra cosa es que convenga: con
              tanto carbono el agua puede agrietar la pieza, y para eso está el
              aceite.
          - texto: >-
              No se puede leer, porque 100 mm es el borde de la gráfica y las
              curvas terminan ahí
            mensaje: |
              Las curvas terminan ahí porque ahí termina la gráfica, pero su
              último punto está justo en 100 mm. Es la lectura más al límite de
              la colección, y es válida; lo que no se podría leer es un diámetro
              mayor.
          - texto: >-
              Muy caído, como el del caso c), porque cuanto más gruesa es la
              barra más cae el perfil
            mensaje: |
              Un diámetro mayor lleva todas las posiciones más lejos del extremo
              templado, pero cuánto baja la dureza lo decide la curva del acero.
              La del 8660 a 26 mm aún está en 52,7; la del 8630, a 21,8 mm, ya
              estaba en 27.

      - tipo: justificar
        pregunta: Ordena cómo se dibuja cualquiera de los cuatro perfiles. Una pieza es falsa.
        piezas:
          - texto: >-
              En la gráfica del medio de temple, la del aceite en a) y la del
              agua en b), c) y d), se lee con el diámetro la distancia Jominy
              equivalente de las cuatro posiciones.
          - texto: >-
              Cada distancia se lleva a la curva de templabilidad del acero, y
              da la dureza de esa posición.
          - texto: >-
              Se dibuja la dureza frente a la posición en la sección: una U, más
              alta en la superficie que en el centro.
          - texto: >-
              En c) y d) la gráfica del agua cubre los 90 y los 100 mm; el 100 es
              su borde de arriba, donde terminan las cuatro curvas.
          - texto: >-
              La superficie de cualquier probeta es el extremo templado, así que
              su dureza es siempre la del principio de la curva.
            trampa: true
            mensaje: |
              La superficie se enfría deprisa, pero no como el extremo de la
              probeta Jominy. En el caso a) equivale a 12,8 mm, y su dureza es
              47 HRC, no los 57 del principio de la curva. Solo en barras finas
              y en agua se acerca al extremo, como en b), con 1,35 mm.
    resolucion: |
      **El procedimiento es el mismo en los cuatro casos.** Con el diámetro,
      en la gráfica de su medio de temple —«Distancia Jominy equivalente de un
      cilindro templado en aceite» para a) y la del agua para b), c) y d)— se
      leen las distancias Jominy equivalentes de la superficie, los tres
      cuartos del radio, la mitad del radio y el centro. Cada distancia se lleva
      a la curva de templabilidad del acero: los 86xx están en «Curvas de
      templabilidad de cuatro aceros 86xx con distinto carbono», y el 5140, en
      «Curvas de templabilidad de cinco aceros con 0,40 % de C».

      | caso | | superficie | ¾ R | ½ R | centro |
      |---|---|---|---|---|---|
      | a) 8640, 75 mm, aceite | distancia | 12,8 mm | 17,8 mm | 21,6 mm | 25,5 mm |
      | | dureza | 47,3 HRC | 41,6 HRC | 38,8 HRC | 36,6 HRC |
      | b) 5140, 50 mm, agua | distancia | 1,35 mm | 5,3 mm | 8,6 mm | 10,1 mm |
      | | dureza | 56,8 HRC | 53,5 HRC | 47,7 HRC | 45,2 HRC |
      | c) 8630, 90 mm, agua | distancia | 3,3 mm | 10,0 mm | 17,1 mm | 21,8 mm |
      | | dureza | 49,9 HRC | 36,9 HRC | 29,7 HRC | 27,2 HRC |
      | d) 8660, 100 mm, agua | distancia | 3,4 mm | 11,0 mm | 19,8 mm | 25,9 mm |
      | | dureza | 63,9 HRC | 61,5 HRC | 56,7 HRC | 52,7 HRC |

      El perfil es cada fila de durezas puesta sobre la sección, simétrica a
      los dos lados del centro: superficie, ¾ R, ½ R, centro, ½ R, ¾ R,
      superficie.

      **Qué dice cada perfil.** En a), una U baja: en aceite y con 75 mm ni la
      superficie es martensita entera. En b), martensita casi entera fuera y
      12 HRC menos en el centro: el 5140 es poco templable. En c), una caída
      brusca en la capa de fuera y un interior blando: el 8630 tiene poco
      carbono y su curva cae enseguida. En d), un perfil alto y poco hondo, todo
      por encima de 50 HRC: el 8660 es a la vez duro y templable.

      **Tres lecturas en el límite.** En b), la superficie de 50 mm en agua
      equivale a 1,35 mm, antes de la primera lectura del ensayo, a 1,6 mm: se
      toma el valor con el que arranca la curva. En d), 100 mm es el borde de
      arriba de la gráfica del agua, y se lee en el último punto de cada curva.
      Y el 8660 empieza por encima de 60 HRC, fuera de la cuadrícula. La
      gráfica del agua cubre los 90 y los 100 mm; la del aceite no los cubriría
      en el centro, cuya curva termina hacia 83 mm.

      **El 8640 sale dos veces.** Está en las dos gráficas de curvas y no
      coinciden del todo: a las distancias de a) se separan menos de 1 HRC. La
      tabla da la media.

      **Lo que hay que llevarse.** El perfil depende de las tres cosas a la
      vez: el medio y el diámetro fijan las distancias, y el acero, la dureza a
      esas distancias. El mismo diámetro en otro medio, o el mismo medio con
      otro acero, dibuja otro perfil.

  - id: ejcm6-col62-el-8640-y-cuatro-aceros-contra-50-hrc
    titulo: El 8640 en agua y en aceite, y cuatro aceros 86xx contra 50 HRC
    fuente: >-
      Ejercicio 6.2 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección imprime el resultado del apartado b),
      contra el que está contrastado el desarrollo; el del a) no lo imprime, y
      esa resolución es nuestra.
    nivel: practica
    enunciado: |
      a) Dado un acero AISI 8640, dibuja el perfil de dureza radial para una
      probeta cilíndrica de 50 mm de diámetro, para: i) temple en agua, y ii)
      temple en aceite

      b) Al austenizar y templar una probeta cilíndrica de 50 mm de diámetro,
      debe tener como mínimo una dureza de 50 HRC en la superficie y el centro.
      Dados los aceros AISI 8660, 8640, 8630, y 8620, analiza cuál o cuáles
      cumplen la condición, i) en agua, y ii) en aceite.
    pide: >-
      Los dos perfiles de dureza del 8640, en agua y en aceite, y qué aceros de
      los cuatro llegan a 50 HRC en la superficie y en el centro con cada medio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de leer nada: el mismo 8640 de 50 mm, templado en agua y en
          aceite. ¿Cómo serán los dos perfiles?
        opciones:
          - texto: >-
              El de aceite, más bajo en todas las posiciones y más caído hacia el
              centro
            correcta: true
            mensaje: |
              Eso es. En aceite todas las posiciones se enfrían más despacio y
              equivalen a distancias Jominy mayores: la superficie pasa de 1,35
              a 7,1 mm y el centro de 10,1 a 15,5. Sobre una curva que baja, eso
              es menos dureza en todas partes.
          - texto: >-
              Iguales, porque el acero es el mismo y la templabilidad solo
              depende del acero
            mensaje: |
              La templabilidad solo depende del acero, sí: por eso la curva del
              8640 es la misma en los dos casos. Pero el medio cambia a qué punto
              de esa curva equivale cada posición, y eso cambia la dureza.
          - texto: >-
              El de aceite, más alto, porque un temple menos brusco deja la pieza
              sin tensiones
            mensaje: |
              Menos brusco es, precisamente, menos martensita. El aceite se usa
              para no agrietar la pieza, no para endurecerla más: en aceite cada
              posición sale más blanda que en agua.

      - tipo: calcular
        titulo: La superficie en agua
        pregunta: |
          a) i) En agua, ¿qué dureza tiene la superficie?
        respuesta:
          tipo: numero
          valor: '57'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '54'
            mensaje: |
              Has leído la superficie en la gráfica del **aceite**, a 7,1 mm. En
              agua la superficie de 50 mm equivale a 1,35 mm, casi el extremo
              templado.
          - valor: '50.5'
            mensaje: |
              Esa es la dureza del centro en agua. La superficie es la curva de
              más a la izquierda de la gráfica del agua.
        pista: |
          En la gráfica del agua, a 50 mm, la superficie equivale a 1,35 mm.
          Usa la curva del 8640 de la gráfica de los 86xx, que es la del
          apartado b).
        desarrollo: |
          A 1,35 mm, el 8640 está en **57,1 HRC**: martensita casi entera.

      - tipo: calcular
        titulo: El centro en agua
        pregunta: |
          ¿Y el centro, en agua?
        respuesta:
          tipo: numero
          valor: '50.5'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '43.6'
            mensaje: |
              Has leído el centro en la gráfica del **aceite**, a 15,5 mm. En
              agua el centro de 50 mm equivale a 10,1 mm.
          - valor: '36.8'
            mensaje: |
              Has leído el 8640 a 25 mm, el radio de la barra. La distancia que
              va a la curva es la de la probeta Jominy, y la gráfica del agua da
              10,1 mm para este centro.
          - valor: '57'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua.
        pista: |
          La curva del centro de la gráfica del agua corta los 50 mm hacia
          10 mm.
        desarrollo: |
          El centro de 50 mm en agua equivale a **10,1 mm**, y ahí el 8640 está
          en **50,5 HRC**. La otra curva del 8640, la de «Curvas de
          templabilidad de cinco aceros con 0,40 % de C», da 51,3. Las dos están
          por encima de 50, y eso va a importar en el apartado b).

      - tipo: calcular
        titulo: La superficie en aceite
        pregunta: |
          a) ii) En aceite, ¿qué dureza tiene la superficie?
        respuesta:
          tipo: numero
          valor: '54'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '57'
            mensaje: |
              Esa es la superficie en **agua**. En aceite la superficie de 50 mm
              equivale a 7,1 mm, y la curva ya ha bajado algo.
          - valor: '43.6'
            mensaje: |
              Esa es la dureza del centro en aceite. La superficie es la curva de
              más a la izquierda de la gráfica del aceite.
        pista: |
          En la gráfica del aceite, a 50 mm, la superficie equivale a unos
          7,1 mm.
        desarrollo: |
          La superficie de 50 mm en aceite equivale a **7,1 mm**, y ahí el 8640
          está en **53,9 HRC**.

      - tipo: calcular
        titulo: El centro en aceite
        pregunta: |
          ¿Y el centro, en aceite?
        respuesta:
          tipo: numero
          valor: '43.6'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '50.5'
            mensaje: |
              Ese es el centro en **agua**. En aceite el centro de 50 mm equivale
              a 15,5 mm, bastante más lejos del extremo templado.
          - valor: '36.8'
            mensaje: |
              Has leído el 8640 a 25 mm, el radio de la barra. La distancia del
              centro es la de la gráfica del aceite, 15,5 mm.
          - valor: '54'
            mensaje: |
              Esa es la superficie en aceite. El centro es la curva de más a la
              derecha.
        pista: |
          La curva del centro de la gráfica del aceite, a 50 mm: unos 15,5 mm.
        desarrollo: |
          El centro equivale a **15,5 mm**, y el 8640 está ahí en **43,6 HRC**:
          44,2 en la otra curva.

      - tipo: reconocer
        pregunta: |
          b) El mínimo es 50 HRC en la superficie y en el centro. Para cada
          medio, ¿qué punto hay que mirar?
        opciones:
          - texto: >-
              El centro, porque se enfría más despacio que la superficie y
              siempre sale más blando: si el centro llega a 50, la superficie
              también
            correcta: true
            mensaje: |
              Eso es. Con el mismo umbral en los dos puntos, decide el centro,
              que es el que equivale a más distancia Jominy. La superficie solo
              sirve para descartar antes, como pasa con el 8620.
          - texto: >-
              La superficie, porque es donde se mide la dureza de una pieza
            mensaje: |
              La condición pide los dos puntos, y la superficie es el fácil:
              siempre es la parte más dura de la sección. Un acero puede pasar de
              50 en la superficie y quedarse muy lejos en el centro, como el 8630
              en agua.
          - texto: >-
              Los dos por separado, porque cualquiera de los dos puede ser el que
              falle
            mensaje: |
              Con el mismo umbral para los dos, no. El centro equivale siempre a
              más distancia Jominy que la superficie, y la curva siempre baja: si
              falla la superficie, el centro falla también. Otra cosa son los
              umbrales distintos, como en el 6.4.

      - tipo: calcular
        titulo: El 8660 en el centro, en aceite
        pregunta: |
          El caso más exigente es el centro en aceite, a 15,5 mm. ¿Qué dureza
          tiene ahí el 8660?
        respuesta:
          tipo: numero
          valor: '59.4'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '62'
            mensaje: |
              Has llevado a la curva el centro de la gráfica del **agua**,
              10,1 mm. En aceite el centro está a 15,5 mm, y ahí el 8660 ha
              bajado un poco más.
          - valor: '43.6'
            mensaje: |
              Esa es la curva del **8640**, la de 0,4 % de C. La del 8660 es la
              de más arriba, la de 0,6 % de C.
          - valor: '53.4'
            mensaje: |
              Has leído el 8660 a 25 mm, el radio de la barra. La distancia del
              centro es la de la gráfica del aceite, 15,5 mm.
        pista: |
          La curva del 8660 es la de arriba en la gráfica de los 86xx; léela a
          15,5 mm.
        desarrollo: |
          A 15,5 mm, el 8660 está en **59,4 HRC**. Pasa de 50 con holgura en el
          punto más desfavorable, así que cumple en agua y en aceite.

      - tipo: reconocer
        pregunta: |
          Con lo que salió en el apartado a), ¿cumple el 8640? ¿Y en aceite?
        opciones:
          - texto: >-
              En agua sí, por poco, con 50,5 HRC en el centro. En aceite no: el
              centro se queda en 43,6
            correcta: true
            mensaje: |
              Eso es, y es lo que imprime la colección. El sí del agua es fino:
              0,5 HRC por encima del límite, menos de lo que se puede afinar
              leyendo la gráfica. La otra curva del 8640 da 51,3 y también
              cumple, así que el veredicto aguanta.
          - texto: >-
              En los dos medios, porque la superficie pasa de 50 en agua y en
              aceite
            mensaje: |
              La superficie pasa en los dos, con 57,1 y 53,9, pero la condición
              pide también el centro, y en aceite se queda en 43,6.
          - texto: >-
              En ninguno, porque en agua el centro queda justo en el límite, y
              eso no es cumplir
            mensaje: |
              El mínimo es 50 HRC, y el centro da 50,5 con una curva y 51,3 con
              la otra: las dos lecturas cumplen. Es un veredicto por poco, y
              conviene decirlo, pero es un sí.

      - tipo: reconocer
        pregunta: |
          El 8630 templado en agua llega a 52,4 HRC en la superficie. ¿Cumple en
          agua?
        opciones:
          - texto: >-
              No se sabe hasta mirar el centro, que es el que decide
            correcta: true
            mensaje: |
              Eso es. La superficie ya pasa, pero el centro de 50 mm en agua
              equivale a 10,1 mm, y la curva del 8630 cae deprisa. Hay que leerlo.
          - texto: >-
              Sí, porque la superficie ya pasa de 50 HRC
            mensaje: |
              Cumplir en la superficie es la mitad de la condición, y la mitad
              fácil. La otra mitad es el centro.
          - texto: >-
              No, porque un acero con un 0,3 % de C nunca llega a 50 HRC
            mensaje: |
              Su martensita sí llega: en el extremo templado el 8630 pasa de
              52 HRC, y la superficie en agua lo confirma. Lo que hay que mirar
              es si aguanta hasta el centro.

      - tipo: calcular
        titulo: El 8630 en el centro, en agua
        pregunta: |
          ¿Qué dureza tiene el 8630 en el centro, templado en agua?
        respuesta:
          tipo: numero
          valor: '36.9'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '52.4'
            mensaje: |
              Esa es su superficie en agua, a 1,35 mm. El centro equivale a
              10,1 mm.
          - valor: '30.8'
            mensaje: |
              Has leído el centro de la gráfica del **aceite**, 15,5 mm. En agua
              el centro de 50 mm equivale a 10,1 mm.
        pista: |
          La curva del 8630, la de 0,3 % de C, a 10,1 mm.
        desarrollo: |
          A 10,1 mm, el 8630 está en **36,9 HRC**. No cumple en agua, y en
          aceite, con el centro a 15,5 mm, menos todavía.

      - tipo: calcular
        titulo: El 8620 en la superficie, en agua
        pregunta: |
          ¿Y el 8620 en la superficie, templado en agua, que es su punto más
          favorable?
        respuesta:
          tipo: numero
          valor: '43.5'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '52.4'
            mensaje: |
              Esa es la curva del **8630**, la de encima. La del 8620 es la de
              abajo del todo, la de 0,2 % de C.
          - valor: '31.7'
            mensaje: |
              Has leído la superficie en la gráfica del **aceite**, a 7,1 mm. En
              agua equivale a 1,35 mm.
        pista: |
          La curva del 8620, la más baja de la gráfica de los 86xx, casi en su
          arranque.
        desarrollo: |
          A 1,35 mm, casi en el extremo templado, el 8620 da **43,5 HRC**. Si no
          llega a 50 en el mejor punto y con el mejor medio, no cumple en
          ninguno.

      - tipo: justificar
        pregunta: Ordena el análisis del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Con el mismo mínimo en los dos puntos decide el centro, que se
              enfría más despacio y siempre sale más blando.
          - texto: >-
              En agua, el centro de 50 mm equivale a 10,1 mm: el 8660 da 62 HRC y
              el 8640, 50,5; el 8630 se queda en 36,9 y el 8620, en 27.
          - texto: >-
              En aceite equivale a 15,5 mm: el 8660 da 59,4 y el 8640 baja a
              43,6.
          - texto: >-
              Cumplen en agua el 8660 y el 8640; en aceite, solo el 8660.
          - texto: >-
              El 8620 no cumple porque es poco templable: su martensita no llega
              al centro.
            trampa: true
            mensaje: |
              No llega a 50 ni en la superficie en agua, que se enfría casi como
              el extremo templado: 43,5 HRC. Lo que le falta no es templabilidad
              sino carbono. Con un 0,2 % de C ni su martensita llega a 50 HRC, y
              eso no lo arregla ningún medio de temple.
    resolucion: |
      **a) Los dos perfiles.** Con la gráfica de cada medio a 50 mm y la curva
      del 8640 de «Curvas de templabilidad de cuatro aceros 86xx con distinto
      carbono»:

      | medio | | superficie | ¾ R | ½ R | centro |
      |---|---|---|---|---|---|
      | agua | distancia | 1,35 mm | 5,3 mm | 8,6 mm | 10,1 mm |
      | | dureza | 57,1 HRC | 55,2 HRC | 52,3 HRC | 50,5 HRC |
      | aceite | distancia | 7,1 mm | 11,4 mm | 13,9 mm | 15,5 mm |
      | | dureza | 53,9 HRC | 48,7 HRC | 45,5 HRC | 43,6 HRC |

      En agua el perfil es una U alta y poco honda, de 57 a 50,5 HRC; en
      aceite, más baja y más honda, de 54 a 43,6. La curva del 8640 de la otra
      gráfica, la de los cinco aceros con 0,40 % de C, da hasta 1 HRC más en
      cada punto.

      **b) Quién llega a 50 HRC.** Con el mismo mínimo en la superficie y en
      el centro, decide el centro. Las lecturas, en HRC:

      | acero | agua, superficie | agua, centro | aceite, superficie | aceite, centro | cumple |
      |---|---|---|---|---|---|
      | 8660 | 64,1 | 62,0 | 63,1 | 59,4 | en agua y en aceite |
      | 8640 | 57,1 | 50,5 | 53,9 | 43,6 | solo en agua |
      | 8630 | 52,4 | 36,9 | 42,3 | 30,8 | no |
      | 8620 | 43,5 | 26,9 | 31,7 | 22,6 | no |

      Las distancias son las del apartado a): 1,35 y 10,1 mm en agua, 7,1 y
      15,5 mm en aceite.

      **Contra la colección.** Coincide en los cuatro aceros. El sí del 8640
      en agua es por 0,5 HRC con esta curva y por 1,3 con la otra: es el
      veredicto más fino del ejercicio, y aguanta con las dos.

      **Lo que hay que llevarse.** El 8620 y el 8630 fallan por motivos
      distintos. El 8620 falla hasta en la superficie en agua, y no por
      templabilidad: su martensita, con un 0,2 % de C, no pasa de 44 HRC. El
      8630 llega en la superficie, pero su curva cae antes de llegar al centro.

  - id: ejcm6-col63-el-diametro-de-un-4140-en-aceite
    titulo: El diámetro de un 4140 con un 80 % de martensita en el centro
    fuente: >-
      Ejercicio 6.3 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta cilíndrica de acero 4140 se ha austenizado y templado en
      aceite. ¿Cuál es el diámetro más adecuado, si en el centro el 80 % de la
      microestructura es martensita?
    pide: >-
      El diámetro de la probeta cuyo centro, templado en aceite, queda con un
      80 % de martensita.
    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí se da el resultado, un 80 % de martensita en el centro, y se pide
          la pieza. ¿En qué orden se usan las gráficas?
        opciones:
          - texto: >-
              Al revés que para un perfil: del porcentaje de martensita a la
              dureza, de la dureza a una distancia Jominy en la curva del 4140, y
              de esa distancia al diámetro en la curva del centro del aceite
            correcta: true
            mensaje: |
              Eso es. Es el camino de siempre recorrido hacia atrás. Cada gráfica
              traduce una cosa en otra, y se puede leer en los dos sentidos.
          - texto: >-
              Primero la del aceite, entrando con 80 en el eje del diámetro
            mensaje: |
              El 80 es un porcentaje de martensita, no un diámetro: el diámetro
              es lo que se pide. El dato que tienes es del acero, y por eso se
              empieza por su curva.
          - texto: >-
              Solo la curva del 4140, porque el diámetro es el doble de la
              distancia a la que tiene un 80 % de martensita
            mensaje: |
              La distancia de la curva es la de la probeta Jominy, no el radio de
              la pieza. Para pasar de ella a un diámetro hace falta la gráfica del
              aceite.

      - tipo: calcular
        titulo: La dureza de un 80 % de martensita
        pregunta: |
          ¿Qué dureza corresponde a un 80 % de martensita en este acero?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '45.1'
            mensaje: |
              Has calculado el 80 % de la dureza máxima, 0,8 · 56,4. El
              porcentaje de martensita no es un porcentaje de la dureza: la
              escala de la derecha dice qué dureza da cada porcentaje, y el 80 %
              está en unos 50 HRC.
          - valor: '56.4'
            mensaje: |
              Esa es la flecha del 100 %, la de arriba de la escala. El 80 % es la
              de en medio.
        pista: |
          La escala de la derecha de «Curvas de templabilidad de cinco aceros
          con 0,40 % de C» da el porcentaje de martensita. El 4140 tiene un
          0,40 % de C, así que vale para él.
        desarrollo: |
          La flecha del 80 % apunta a **50 HRC**. Las otras dos: el 100 %, a
          unos 56,4, y el 50 %, a unos 42,5.

      - tipo: calcular
        titulo: La distancia Jominy de 50 HRC
        pregunta: |
          ¿A qué distancia del extremo templado baja el 4140 a 50 HRC?
        respuesta:
          tipo: numero
          valor: '15.9'
          tolerancia: 1.5
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '11.2'
            mensaje: |
              Esa es la curva del **8640**, que baja a 50 HRC antes. La del 4140
              es la que queda por encima de ella y por debajo de la del 4340.
          - valor: '22.2'
            mensaje: |
              Has buscado 45 HRC, que es el 80 % de la dureza máxima. El 80 % de
              martensita son 50 HRC, y a 50 el 4140 llega hacia los 16 mm.
        pista: |
          Traza la horizontal de 50 HRC y mira dónde corta la curva del 4140.
        desarrollo: |
          La curva del 4140 cruza los 50 HRC hacia los **15,9 mm**. Entre 13 y
          14 mm todavía está en unos 52 HRC.

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Qué diámetro tiene la barra cuyo centro, templado en aceite, equivale
          a 15,9 mm?
        respuesta:
          tipo: numero
          valor: '51'
          tolerancia: 3
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '72'
            mensaje: |
              Has leído en la gráfica del **agua**, donde el centro equivale a
              15,9 mm con unos 72 mm de diámetro. La probeta va al aceite, que
              enfría más despacio: el mismo centro se alcanza con una barra más
              fina.
          - valor: '86.5'
            mensaje: |
              Has leído la curva de la **superficie** del aceite. El dato del
              enunciado es del centro, que es la curva de más a la derecha.
          - valor: '32'
            mensaje: |
              Has doblado la distancia Jominy como si fuera el radio. Los
              15,9 mm son de la probeta Jominy, no de tu barra: el diámetro sale
              de la gráfica del aceite.
        pista: |
          En la gráfica del aceite, sube por los 15,9 mm hasta la curva del
          centro y lee el diámetro.
        desarrollo: |
          La curva del centro pasa por 15,5 mm a 50 mm de diámetro y por
          16,2 mm a 52 mm. Por 15,9 mm pasa hacia los **51 mm**. La colección
          da 52: es la misma lectura, y la casilla acepta las dos.

      - tipo: reconocer
        pregunta: |
          ¿Por qué ese es «el diámetro más adecuado»?
        opciones:
          - texto: >-
              Porque es el mayor cuyo centro todavía llega al 80 % de
              martensita: uno más grueso se quedaría por debajo
            correcta: true
            mensaje: |
              Eso es. Al crecer el diámetro, el centro se enfría más despacio,
              equivale a más distancia Jominy y sale con menos martensita. Uno
              más fino tendría más del 80 %; uno más grueso, menos.
          - texto: >-
              Porque es el único diámetro que se puede templar en aceite; con
              otro habría que usar agua
            mensaje: |
              Cualquier diámetro se puede templar en aceite. Lo que cambia es
              cuánta martensita queda en el centro: la curva del centro de la
              gráfica del aceite va de 15 a 83 mm.
          - texto: >-
              Porque con él la pieza entera, y no solo el centro, tiene un 80 %
              de martensita
            mensaje: |
              El centro es el punto más lento de la sección. La superficie de
              esta barra equivale a unos 7 mm, y ahí el 4140 tiene unos 55 HRC:
              bastante más del 80 % de martensita.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En los aceros con 0,40 % de C, un 80 % de martensita son unos
              50 HRC, según la escala de la derecha de sus curvas.
          - texto: >-
              La curva del 4140 baja a 50 HRC hacia los 15,9 mm del extremo
              templado.
          - texto: >-
              En la gráfica del aceite, la curva del centro pasa por 15,9 mm con
              unos 51 mm de diámetro.
          - texto: >-
              Con más diámetro el centro se enfriaría más despacio y tendría
              menos del 80 % de martensita.
          - texto: >-
              Un 80 % de martensita es el 80 % de la dureza máxima: 0,8 · 56,4 =
              45 HRC.
            trampa: true
            mensaje: |
              La dureza no crece en proporción a la martensita, y por eso la
              gráfica trae su propia escala: el 50 % de martensita está en
              42,5 HRC, no en 28. Con 45 HRC se llegaría a 22 mm y a una barra de
              unos 68 mm, con mucha menos martensita en el centro de la pedida.
    resolucion: |
      **El camino, hacia atrás.** Un perfil se dibuja de la pieza a la dureza.
      Aquí se da la dureza, en forma de martensita, y se pide la pieza.

      **Del 80 % de martensita a la dureza.** La escala de la derecha de
      «Curvas de templabilidad de cinco aceros con 0,40 % de C» vale para esos
      aceros, y el 4140 es uno de ellos. El 80 % está en **50 HRC**.

      **De la dureza a la distancia Jominy.** La curva del 4140 cruza los
      50 HRC hacia los **15,9 mm** del extremo templado.

      **De la distancia al diámetro.** En «Distancia Jominy equivalente de un
      cilindro templado en aceite», la curva del centro pasa por 15,5 mm a
      50 mm de diámetro y por 16,2 mm a 52 mm. Por 15,9 mm pasa hacia
      **51 mm**.

      **Contra la colección.** Imprime «52 mm aproximadamente». La diferencia
      es de lectura: en esa zona de la curva, un milímetro de diámetro son
      0,3 mm de distancia Jominy. La casilla acepta las dos.

      **Lo que hay que llevarse.** «El más adecuado» es un límite: el diámetro
      máximo que todavía da un 80 % de martensita en el centro. Más fino, más
      martensita; más grueso, menos.

  - id: ejcm6-col64-cuatro-aceros-para-38-mm-en-aceite
    titulo: Cuatro aceros para una probeta de 38 mm templada en aceite
    fuente: >-
      Ejercicio 6.4 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una probeta de acero de 38 mm de diámetro se ha templado en aceite. Las
      durezas en la superficie y en el centro deben ser superiores a 50 y
      40 HRC, respectivamente. Indica cuál o cuáles de los siguientes aceros
      cumplen dicha condición: AISI 1040, 5140, 8640, 4340.
    pide: >-
      Qué aceros de los cuatro superan 50 HRC en la superficie y 40 HRC en el
      centro de una probeta de 38 mm templada en aceite.
    pasos:
      - tipo: reconocer
        pregunta: |
          La condición pide 50 HRC en la superficie y 40 en el centro. ¿Qué hay
          que leer?
        opciones:
          - texto: >-
              Los dos puntos, porque los umbrales son distintos y cumplir en el
              centro no garantiza cumplir en la superficie
            correcta: true
            mensaje: |
              Eso es. Con 10 HRC más de exigencia en la superficie, un acero
              puede pasar de 40 en el centro y quedarse por debajo de 50 fuera.
              Hay que mirar los dos.
          - texto: >-
              Solo el centro, que es el que se enfría más despacio
            mensaje: |
              Eso vale cuando el mínimo es el mismo en los dos puntos, como en el
              6.2. Aquí la superficie pide 50 y el centro 40: la superficie puede
              fallar aunque el centro cumpla.
          - texto: >-
              Solo la superficie, porque es la que pide la dureza más alta
            mensaje: |
              La superficie pide más, pero también es la que más deprisa se
              enfría. El centro, con menos exigencia y peor enfriamiento, puede
              fallar por su lado.

      - tipo: calcular
        titulo: La distancia de la superficie
        pregunta: |
          En la gráfica del aceite, ¿a qué distancia Jominy equivale la
          superficie de una barra de 38 mm?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 1.5
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '8.7'
            mensaje: |
              Esa es la curva de los tres cuartos del radio, la siguiente hacia
              la derecha. La superficie es la primera por la izquierda.
          - valor: '11.9'
            mensaje: |
              Esa es la curva del centro, la de más a la derecha.
        pista: |
          Traza la horizontal de 38 mm en «Distancia Jominy equivalente de un
          cilindro templado en aceite» y mira dónde corta la curva de la
          superficie, la de más a la izquierda.
        desarrollo: |
          La superficie de 38 mm equivale a unos **5 mm** del extremo templado.

      - tipo: calcular
        titulo: La distancia del centro
        pregunta: |
          ¿Y a qué distancia equivale el centro?
        respuesta:
          tipo: numero
          valor: '11.9'
          tolerancia: 1.5
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '7.4'
            mensaje: |
              Has leído en la gráfica del **agua**, donde el centro de 38 mm
              equivale a 7,4 mm. La probeta va al aceite.
          - valor: '5'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha.
          - valor: '19'
            mensaje: |
              19 mm es el radio de la barra, lo que hay del centro a la
              superficie. La distancia que se busca es la de la probeta Jominy, y
              la da la gráfica.
        pista: |
          La misma horizontal de 38 mm, hasta la curva del centro.
        desarrollo: |
          El centro equivale a **11,9 mm**.

      - tipo: reconocer
        pregunta: |
          Los cuatro aceros tienen un 0,40 % de C y empiezan su curva casi a la
          misma dureza. ¿Qué decide cuál cumple?
        opciones:
          - texto: >-
              Lo deprisa que cae cada curva, la templabilidad, que la pone la
              aleación
            correcta: true
            mensaje: |
              Eso es. El carbono pone la dureza del extremo templado, y es casi
              la misma en los cuatro. A 5 y a 12 mm ya no: ahí cada curva ha
              caído según su aleación.
          - texto: >-
              Nada: con el mismo carbono dan la misma dureza, y cumplen los cuatro
              o ninguno
            mensaje: |
              Es confundir dureza con templabilidad. Dan la misma dureza en el
              extremo templado, pero la probeta no es el extremo: su superficie
              equivale a 5 mm y su centro a 11,9. Ahí el 1040 y el 4340 están a
              17 y a 31 HRC de distancia.
          - texto: >-
              El que más carbono tenga, porque el carbono es lo que endurece la
              martensita
            mensaje: |
              El carbono endurece la martensita, pero los cuatro tienen el mismo,
              un 0,40 %. Lo que los separa es cuánto aguantan la dureza lejos del
              extremo templado.

      - tipo: calcular
        titulo: El 1040 en la superficie
        pregunta: |
          ¿Qué dureza tiene el 1040 en la superficie, a unos 5 mm?
        respuesta:
          tipo: numero
          valor: '39.7'
          tolerancia: 2
          formato: en HRC, solo el número
        distractores:
          - valor: '56'
            mensaje: |
              Has leído la curva del **4140**, que a 5 mm apenas ha bajado. La
              del 1040 es la que se desploma nada más empezar: a 5 mm ya ha
              perdido unos 15 HRC.
          - valor: '24.7'
            mensaje: |
              Ese es el 1040 en el centro, a 11,9 mm. En la superficie, a 5 mm,
              está algo más arriba, pero tampoco llega a 50.
        pista: |
          La curva del 1040 es la que cae casi vertical en los primeros
          milímetros.
        desarrollo: |
          A 5 mm, el 1040 está en unos **39,7 HRC**. Ahí la curva es tan
          empinada que medio milímetro mueve la lectura casi 2 HRC, pero ninguna
          lectura razonable llega a 50: el 1040 no cumple ni en la superficie.

      - tipo: calcular
        titulo: El 5140 en el centro
        pregunta: |
          ¿Y el 5140 en el centro, a 11,9 mm?
        respuesta:
          tipo: numero
          valor: '42.6'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '50'
            mensaje: |
              Has llevado a la curva el centro de la gráfica del **agua**,
              7,4 mm. En aceite el centro está a 11,9 mm, y ahí el 5140 ha bajado
              más.
          - valor: '35.5'
            mensaje: |
              Has leído el 5140 a 19 mm, el radio de la barra. La distancia del
              centro es la de la gráfica del aceite, 11,9 mm.
          - valor: '54'
            mensaje: |
              Esa es la superficie del 5140, a 5 mm. El centro está a 11,9 mm.
        pista: |
          La curva del 5140 es la más baja de las cuatro que siguen en pie
          pasados los 10 mm.
        desarrollo: |
          A 11,9 mm, el 5140 está en **42,6 HRC**. En la superficie, a 5 mm,
          tiene 53,9.

      - tipo: reconocer
        pregunta: |
          Con 53,9 HRC en la superficie y 42,6 en el centro, ¿cumple el 5140?
        opciones:
          - texto: >-
              Sí, en los dos puntos, aunque en el centro con solo 2,6 HRC de
              margen
            correcta: true
            mensaje: |
              Eso es, y coincide con la colección. Es el más justo de los tres
              que cumplen: el 8640 da 55,6 y 49,0, y el 4340, 57,0 y 55,8.
          - texto: >-
              No, porque en el centro no llega a 50 HRC
            mensaje: |
              El centro pide 40, no 50: los 50 son de la superficie. Con umbrales
              distintos, cada punto se compara con el suyo.
          - texto: >-
              No, porque la curva del 5140 cae por debajo de 40 HRC hacia los
              14 mm
            mensaje: |
              Cae a 40 hacia los 14 mm, pero el centro de esta probeta equivale
              a 11,9, antes de ese punto. Con una barra de unos 45 mm el centro
              llegaría a 14 mm, y entonces el 5140 dejaría de cumplir.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En aceite, la superficie de 38 mm equivale a unos 5 mm Jominy y el
              centro a 11,9 mm.
          - texto: >-
              El 1040 cae enseguida: a 5 mm ya está en unos 40 HRC, y no cumple
              ni en la superficie.
          - texto: >-
              El 5140 da 53,9 y 42,6: cumple, con poco margen en el centro.
          - texto: >-
              El 8640, con 55,6 y 49,0, y el 4340, con 57,0 y 55,8, cumplen con
              holgura.
          - texto: >-
              Los cuatro tienen un 0,40 % de C, así que dan la misma dureza y
              cumplen los cuatro.
            trampa: true
            mensaje: |
              El mismo carbono da la misma dureza en el extremo templado, no en
              la probeta. Su superficie equivale a 5 mm, y a esa distancia el
              1040 ya ha caído 15 HRC: la templabilidad la pone la aleación, y el
              1040 no la tiene.
    resolucion: |
      **Las dos distancias.** En «Distancia Jominy equivalente de un cilindro
      templado en aceite», a 38 mm, la superficie equivale a unos **5 mm** y el
      centro a unos **11,9 mm**. Los umbrales son distintos, así que se miran
      los dos puntos.

      **Las cuatro curvas.** Los cuatro aceros están en «Curvas de
      templabilidad de cinco aceros con 0,40 % de C». En HRC:

      | acero | superficie, 5 mm | ¿más de 50? | centro, 11,9 mm | ¿más de 40? | cumple |
      |---|---|---|---|---|---|
      | 1040 | 39,7 | no | 24,7 | no | no |
      | 5140 | 53,9 | sí | 42,6 | sí | sí |
      | 8640 | 55,6 | sí | 49,0 | sí | sí |
      | 4340 | 57,0 | sí | 55,8 | sí | sí |

      **Contra la colección.** Coincide en los cuatro. El 5140 es el único con
      poco margen: 2,6 HRC en el centro. El 8640 de la otra gráfica, la de los
      86xx, da 55,5 y 48,1 y también cumple.

      **Lo que hay que llevarse.** Los cuatro tienen el mismo carbono y
      empiezan a la misma altura. El 1040 falla a los 5 mm, y lo que lo separa
      de los otros tres es la aleación: la templabilidad, no la dureza.
