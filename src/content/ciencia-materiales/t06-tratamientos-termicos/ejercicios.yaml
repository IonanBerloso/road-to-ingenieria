ejercicios:
  - id: ejcm6-el-centro-de-un-cilindro-templado
    titulo: La dureza en el centro de un cilindro templado
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el perfil de dureza
      del Tema 6 de la asignatura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cilindro de acero 4340 de 75 mm de diámetro se austeniza y se templa
      en agua. Con las gráficas del tema —la de temple en agua y las curvas de
      templabilidad de los aceros con 0,40 % de C—, ¿qué dureza tiene en el
      centro?
    pide: La distancia Jominy equivalente del centro y su dureza.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué orden se usan las dos gráficas?
        opciones:
          - texto: Primero la del agua, para pasar del centro a una distancia Jominy; después la curva del 4340, para pasar de esa distancia a una dureza
            correcta: true
            mensaje: |
              Eso es. La gráfica del medio de temple traduce una posición de
              la pieza a la distancia de la probeta Jominy que se enfría igual,
              y la curva de templabilidad del acero da la dureza de esa
              distancia.
          - texto: Directamente la curva del 4340, con 37,5 mm, que es la distancia del centro a la superficie
            mensaje: |
              La distancia de la curva de templabilidad es la de la probeta
              Jominy, no una distancia dentro de la pieza. El centro de este
              cilindro no se enfría como el punto a 37,5 mm de la probeta, sino
              como el que dice la gráfica del agua.
          - texto: La del aceite, porque es la que corresponde a aceros aleados
            mensaje: |
              La gráfica se elige por el medio de temple, no por el acero. El
              cilindro se ha templado en agua.

      - tipo: calcular
        titulo: La distancia Jominy equivalente
        pregunta: |
          ¿A qué distancia del extremo templado de la probeta Jominy equivale el
          centro del cilindro?
        respuesta:
          tipo: numero
          valor: '16.7'
          tolerancia: 1.5
          formato: en mm, solo el número, leído de la gráfica
        distractores:
          - valor: '2.9'
            mensaje: |
              Esa es la curva de la **superficie**. El centro es la curva de
              más a la derecha: la posición que más tarda en enfriarse.
          - valor: '25.5'
            mensaje: |
              Has leído en la gráfica del aceite. El cilindro se ha templado en
              agua, que enfría más deprisa: la distancia equivalente es menor.
        pista: |
          En la gráfica del agua, sube desde 75 mm de diámetro hasta la curva
          del centro y baja al eje.
        desarrollo: |
          La curva del centro corta la horizontal de 75 mm de diámetro hacia
          los **16,7 mm** de distancia equivalente.

      - tipo: calcular
        titulo: La dureza del centro
        pregunta: |
          ¿Qué dureza tiene el centro del cilindro?
        respuesta:
          tipo: numero
          valor: '54'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '57'
            mensaje: |
              Esa es la dureza del extremo templado, la de la superficie. El
              centro se lee a 16,7 mm, donde la curva del 4340 ya ha bajado un
              poco.
          - valor: '35'
            mensaje: |
              Esa es la curva de un 5140, no la del 4340. A 16,7 mm el 4340
              apenas ha perdido dureza: es el más templable de la gráfica.
        pista: |
          En la curva del 4340, a 16,7 mm del extremo templado.
        desarrollo: |
          A 16,7 mm la curva del 4340 está hacia **54 HRC**, con más de un 80 %
          de martensita según el eje de la derecha.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El centro de un cilindro de 75 mm templado en agua se enfría como el punto a unos 16,7 mm del extremo de la probeta Jominy.'
          - texto: 'A esa distancia, la curva del 4340 da unos 54 HRC.'
          - texto: 'El 4340 es tan templable que el centro sale casi tan duro como la superficie.'
          - texto: 'El centro está a 37,5 mm de la superficie, así que su dureza se lee a 37,5 mm en la curva.'
            trampa: true
            mensaje: |
              La curva de templabilidad no habla de distancias dentro de la
              pieza, sino de la probeta Jominy. El paso por la gráfica del medio
              de temple es justamente el que convierte una posición de la pieza
              en una velocidad de enfriamiento equivalente.
    resolucion: |
      **Dos gráficas, en este orden.** La del temple en agua convierte el
      centro de un cilindro de 75 mm en una distancia Jominy equivalente: la
      curva del centro corta los 75 mm hacia los **16,7 mm**.

      **Con esa distancia, la curva del acero.** A 16,7 mm del extremo
      templado, el 4340 está hacia **54 HRC**, más de un 80 % de martensita.

      El resultado dice mucho del acero: el centro de una pieza gruesa sale
      casi tan duro como la superficie. Con un 1040 el mismo cálculo daría
      poco más de 20 HRC en el centro: por eso los aceros aleados se eligen
      para piezas gruesas.

  - id: ejcm6-a-que-temperatura-se-normaliza
    titulo: A qué temperatura se normaliza un 1040
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el normalizado del
      Tema 6, con el diagrama hierro-carburo de hierro del Tema 4. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un acero AISI 1040 laminado tiene los granos de tamaño irregular y se
      quiere normalizar. En el diagrama hierro-carburo de hierro del tema 4, la
      línea A3 pasa por un 0,37 % de C a 800 °C y por un 0,46 % a 780 °C. ¿A
      partir de qué temperatura se normaliza?
    pide: La temperatura crítica superior del acero y la mínima de normalizado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Respecto a qué línea se fija la temperatura de normalizado de este
          acero?
        opciones:
          - texto: La A3, la temperatura crítica superior, porque es un acero hipoeutectoide
            correcta: true
            mensaje: |
              Exacto. Con un 0,40 % de C es hipoeutectoide, y su frontera con
              la austenita sola es la A3. El normalizado se hace de 55 a 85 °C
              por encima.
          - texto: La A1, los 727 °C del eutectoide, porque es la temperatura crítica
            mensaje: |
              La A1 es la crítica **inferior**. Justo por encima de ella el
              acero aún tiene ferrita sin disolver; normalizar exige
              austenizarlo entero, por encima de la crítica superior.
          - texto: La Acm, porque es la línea de la cementita
            mensaje: |
              La Acm es la crítica superior de los aceros **hipereutectoides**,
              los de más de 0,76 % de C. Este tiene 0,40 %.

      - tipo: calcular
        titulo: La temperatura crítica superior
        pregunta: |
          ¿A qué temperatura corta la línea A3 al 0,40 % de C?
        respuesta:
          tipo: magnitud
          valor: '793 °C'
          tolerancia: 0.008
          formato: una temperatura, con su unidad
        distractores:
          - valor: '727 °C'
            mensaje: |
              Esa es la A1, la isoterma eutectoide. La A3 de un 0,40 % de C está
              bastante más arriba: entre 780 y 800 °C.
          - valor: '912 °C'
            mensaje: |
              Ahí nace la A3, pero en el hierro puro, con 0 % de C. Con carbono
              la línea baja; hay que leerla en el 0,40 %.
        pista: |
          Interpola entre los dos puntos que da el enunciado.
        desarrollo: |
          $$
          T_{A3} = 800 - (0{,}40 - 0{,}37)\cdot\frac{800 - 780}{0{,}46 - 0{,}37}
          = 800 - 6{,}7 = 793\ ^{\circ}\text{C}
          $$

      - tipo: calcular
        titulo: La temperatura mínima de normalizado
        pregunta: |
          ¿Cuál es la temperatura mínima a la que se normaliza?
        respuesta:
          tipo: magnitud
          valor: '848 °C'
          tolerancia: 0.008
          formato: una temperatura, con su unidad
        distractores:
          - valor: '782 °C'
            mensaje: |
              Has sumado los 55 °C a la A1, 727 °C. El normalizado se cuenta
              desde la crítica **superior**, la A3.
          - valor: '808 °C'
            mensaje: |
              Has usado el margen del recocido total, que es de 15 °C. El del
              normalizado es mayor: de 55 a 85 °C por encima de la A3.
        pista: |
          De 55 a 85 °C por encima de la A3.
        desarrollo: |
          $$
          T_{\text{norm}} = 793 + 55 = 848\ ^{\circ}\text{C}
          $$

          Es decir, entre unos 848 y 878 °C, y después se enfría al aire.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Un 1040 tiene un 0,40 % de C: es hipoeutectoide y su crítica superior es la A3.'
          - texto: 'Interpolando en el diagrama, la A3 del 0,40 % está hacia 793 °C.'
          - texto: 'Se normaliza de 55 a 85 °C por encima, entre unos 848 y 878 °C, y se enfría al aire para sacar perlita fina.'
          - texto: 'Basta con pasar de 727 °C, porque a partir de ahí ya aparece austenita.'
            trampa: true
            mensaje: |
              A partir de 727 °C aparece austenita, pero convive con ferrita
              hasta la A3. Normalizar exige austenizar el acero **entero**,
              para que al enfriar salga perlita fina de grano homogéneo en toda
              la pieza.
    resolucion: |
      **El 1040 es hipoeutectoide**, con un 0,40 % de C, así que su
      temperatura crítica superior es la A3. Interpolando entre los dos puntos
      de la línea:

      $$
      T_{A3} = 800 - (0{,}40 - 0{,}37)\cdot\frac{20}{0{,}09} = 793\ ^{\circ}\text{C}
      $$

      **El normalizado se hace de 55 a 85 °C por encima**, entre unos 848 y
      878 °C, para austenizar el acero entero; después se enfría al aire y sale
      perlita fina con el grano igualado. Un recocido total, en cambio, se
      quedaría más cerca, de 15 a 40 °C por encima, y se enfriaría dentro del
      horno.

  - id: ejcm6-col61-cuatro-perfiles-de-dureza
    titulo: Cuatro perfiles de dureza, cada uno con sus dos gráficas
    fuente: >-
      Ejercicio 6.1 · Tema 6, «Tratamientos térmicos. Problemas» · Ciencia de
      Materiales, UPV/EHU, curso 2025-2026. La colección no imprime resultado; la resolución es
      nuestra.
    nivel: practica
    enunciado: |
      Dibuja el perfil de dureza en los siguientes casos:

      a) Temple de una probeta de 75 mm de diámetro de acero 8640 en aceite.

      b) Temple de una probeta de 50 mm de diámetro de acero 5140 en agua.

      c) Temple de una probeta de 90 mm de diámetro de acero 8630 en agua.

      d) Temple de una probeta de 100 mm de diámetro de acero 8660 en agua.
    pide: >-
      La dureza en la superficie, a tres cuartos del radio, a la mitad del radio
      y en el centro de cada probeta, leída con la gráfica de su medio de temple
      y la curva de templabilidad de su acero, y la forma del perfil que dibujan.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el caso a) la probeta de 8640 se templa en aceite. ¿Con qué gráfica
          se pasa de un punto de la probeta a su distancia Jominy equivalente?
        opciones:
          - texto: >-
              Con «Distancia Jominy equivalente de un cilindro templado en
              aceite», porque la gráfica se elige por el medio en que se templa
              la pieza
            correcta: true
            mensaje: |
              Eso es. Hay una gráfica por medio porque el mismo punto de la
              misma barra se enfría más despacio en aceite que en agua. El acero
              entra después, con su curva de templabilidad.
          - texto: >-
              Con la del agua, porque el ensayo Jominy siempre se templa con un
              chorro de agua
            mensaje: |
              El chorro de agua es del ensayo, y ya está dentro de la curva de
              templabilidad. La gráfica de diámetros traduce el temple de **tu**
              pieza, y la tuya va al aceite: con la del agua saldría una
              distancia menor y una dureza que la pieza no tiene.
          - texto: >-
              Con ninguna: la dureza del centro se lee directamente en la curva
              del 8640, a 37,5 mm, que es el radio
            mensaje: |
              La distancia de la curva de templabilidad es la de la probeta
              Jominy, no una distancia dentro de tu barra. Sin la gráfica del
              medio no hay forma de saber a qué punto de la probeta Jominy
              equivale el centro.

      - tipo: calcular
        titulo: La superficie del caso a)
        pregunta: |
          ¿Qué dureza tiene la superficie de la probeta del caso a)?
        respuesta:
          tipo: numero
          valor: '47.3'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '56.5'
            mensaje: |
              Has leído la superficie en la gráfica del **agua**, donde a 75 mm
              cae hacia 2,9 mm. La probeta va al aceite, y ahí su superficie
              equivale a 12,8 mm: bastante más lejos del extremo templado, y
              bastante más blanda.
          - valor: '36.6'
            mensaje: |
              Esa es la dureza del **centro**: has cogido la curva de más a la
              derecha de la gráfica del aceite. La de la superficie es la de más
              a la izquierda.
        pista: |
          En la gráfica del aceite, sube por los 75 mm hasta la curva de la
          superficie y baja al eje: unos 12,8 mm. Con esa distancia, entra en la
          curva del 8640.
        desarrollo: |
          La curva de la superficie corta los 75 mm hacia **12,8 mm**. A esa
          distancia el 8640 está hacia **47 HRC**: 46,9 en «Curvas de
          templabilidad de cuatro aceros 86xx con distinto carbono» y 47,7 en
          «Curvas de templabilidad de cinco aceros con 0,40 % de C», que traen
          cada una su curva del 8640. La casilla acepta las dos.

      - tipo: calcular
        titulo: El centro del caso a)
        pregunta: |
          ¿Y qué dureza tiene el centro?
        respuesta:
          tipo: numero
          valor: '36.6'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '47.3'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del aceite, la de la posición que más tarda en
              enfriarse: a 75 mm cae hacia 25,5 mm.
          - valor: '42.7'
            mensaje: |
              Has leído el centro en la gráfica del **agua**, donde a 75 mm cae
              en 16,7 mm. En aceite el centro equivale a 25,5 mm, y a esa
              distancia el 8640 ha bajado bastante más.
          - valor: '33.1'
            mensaje: |
              Has leído la curva del 8640 a 37,5 mm, el radio de la barra. Esa
              distancia no es un sitio de la pieza: la de la curva es la de la
              probeta Jominy, y la da la gráfica del aceite, 25,5 mm.
        pista: |
          La curva del centro de la gráfica del aceite, a 75 mm, y esa
          distancia en la curva del 8640.
        desarrollo: |
          El centro de 75 mm en aceite equivale a **25,5 mm**, y ahí el 8640
          está hacia **36,6 HRC**: 36,9 en una curva y 36,4 en la otra.

      - tipo: reconocer
        pregunta: |
          Con unos 47 HRC en la superficie y 36,6 en el centro, ¿qué perfil
          dibuja el caso a)?
        opciones:
          - texto: >-
              Una U baja y abierta: ni la superficie llega a martensita entera,
              que en un acero con 0,40 % de C son unos 56 HRC, y hacia el centro
              pierde otros 10
            correcta: true
            mensaje: |
              Eso es. En aceite, la superficie de una barra de 75 mm equivale a
              12,8 mm del extremo templado, y a esa distancia el 8640 ya ha
              perdido casi 10 HRC. Los dos puntos de en medio, 41,6 y 38,8 HRC,
              completan una U que baja poco a poco.
          - texto: >-
              Plana, porque en aceite toda la barra se enfría despacio y a la
              misma velocidad
            mensaje: |
              Toda la barra se enfría más despacio que en agua, pero no a la
              misma velocidad: la superficie equivale a 12,8 mm y el centro a
              25,5. Esa diferencia son los 10 HRC que separan los dos extremos
              del perfil.
          - texto: >-
              Una U con la superficie a 57 HRC, porque la superficie siempre sale
              con martensita entera
            mensaje: |
              La superficie solo se acerca al extremo templado en barras finas
              templadas en agua. En una de 75 mm templada en aceite equivale a
              12,8 mm, y ahí el 8640 está en 47 HRC: la superficie tampoco es
              martensita entera.

      - tipo: calcular
        titulo: La superficie del caso b)
        pregunta: |
          Caso b), un 5140 de 50 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '56.8'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '50.6'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 50 mm
              equivale a 7,1 mm. En agua equivale a 1,35 mm: prácticamente el
              extremo templado.
          - valor: '45.2'
            mensaje: |
              Esa es la dureza del centro. En la gráfica del agua, la curva de
              la superficie es la de más a la izquierda, la que empieza justo en
              50 mm.
        pista: |
          En la gráfica del agua, la curva de la superficie empieza
          precisamente en 50 mm, hacia 1,35 mm. La curva del 5140 empieza en
          1,6 mm, la primera lectura del ensayo: toma su valor de arranque.
        desarrollo: |
          La superficie de 50 mm en agua equivale a **1,35 mm**, un poco antes
          de donde empieza la curva del 5140, que arranca en 1,6 mm con
          **56,8 HRC**. Más cerca del extremo la dureza no puede subir de la de
          martensita entera, así que se toma ese valor.

      - tipo: calcular
        titulo: El centro del caso b)
        pregunta: |
          ¿Y qué dureza tiene el centro del 5140?
        respuesta:
          tipo: numero
          valor: '45.2'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '38.4'
            mensaje: |
              Has leído el centro en la gráfica del **aceite**, donde equivale a
              15,5 mm. La probeta va al agua, y ahí su centro equivale a 10,1 mm.
          - valor: '32'
            mensaje: |
              Has leído el 5140 a 25 mm, el radio de la barra. La distancia que
              se lleva a la curva es la de la probeta Jominy, y la da la gráfica
              del agua: 10,1 mm.
          - valor: '56.8'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua.
        pista: |
          En la gráfica del agua, a 50 mm, la curva del centro cae hacia 10 mm.
        desarrollo: |
          El centro de 50 mm en agua equivale a **10,1 mm**, y ahí el 5140 está
          en **45,2 HRC**.

      - tipo: reconocer
        pregunta: |
          Con 56,8 HRC en la superficie y 45,2 en el centro, ¿qué perfil dibuja
          el caso b)?
        opciones:
          - texto: >-
              Martensita casi entera en la superficie y una caída de unos 12 HRC
              hacia el centro, casi toda entre la superficie y la mitad del radio
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 5,3 mm, el 5140 tiene 53,5 HRC,
              y a la mitad del radio, 8,6 mm, 47,7: casi toda la caída pasa en
              la mitad de fuera. El 5140 es poco templable, y ni el agua salva
              el centro de 50 mm.
          - texto: >-
              Plana a 57 HRC, porque el agua es el temple más enérgico
            mensaje: |
              El agua da el temple más enérgico, pero el centro de 50 mm sigue
              equivaliendo a 10 mm, y a esa distancia la curva del 5140 ha caído
              a 45. Lo que no aguanta es el acero: su curva es de las que caen
              antes.
          - texto: >-
              Más dura en el centro, porque el centro es el último en enfriarse
              y tiene más tiempo para endurecer
            mensaje: |
              Es al revés. Más tiempo es más difusión del carbono, y eso da
              perlita o bainita, más blandas que la martensita. Cuanto más
              despacio se enfría un punto, más blando sale.

      - tipo: calcular
        titulo: La superficie del caso c)
        pregunta: |
          Caso c), un 8630 de 90 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '49.9'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '29.8'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 90 mm
              equivale a 16,9 mm. En agua equivale a 3,3 mm.
          - valor: '56.4'
            mensaje: |
              Has leído la curva del **8640**, la de encima en la gráfica de los
              86xx. La del 8630 es la de 0,3 % de C, la tercera empezando por
              arriba.
        pista: |
          En la gráfica del agua, a 90 mm, la superficie cae hacia 3,3 mm. En
          la gráfica de los 86xx, la curva del 8630.
        desarrollo: |
          La superficie equivale a **3,3 mm**, y ahí el 8630 está en
          **49,9 HRC**. A 3,3 mm su curva ya ha perdido casi 3 HRC respecto al
          extremo templado.

      - tipo: calcular
        titulo: El centro del caso c)
        pregunta: |
          ¿Y qué dureza tiene el centro del 8630?
        respuesta:
          tipo: numero
          valor: '27.2'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '49.9'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua: a 90 mm cae hacia 21,8 mm.
          - valor: '23.5'
            mensaje: |
              Has leído el 8630 a 45 mm, el radio de la barra. La distancia de la
              curva es la de la probeta Jominy, y para el centro de esta barra la
              gráfica del agua da 21,8 mm.
        pista: |
          La curva del centro de la gráfica del agua, a 90 mm: unos 21,8 mm.
        desarrollo: |
          El centro de 90 mm en agua equivale a **21,8 mm**, y el 8630 está ahí
          en **27,2 HRC**. En la gráfica del aceite ni siquiera se podría leer:
          su curva del centro termina hacia 83 mm.

      - tipo: reconocer
        pregunta: |
          Con 49,9 HRC en la superficie y 27,2 en el centro, ¿qué perfil dibuja
          el caso c)?
        opciones:
          - texto: >-
              Una caída brusca en la capa de fuera, de 50 a 37 HRC antes de los
              tres cuartos del radio, y casi plana y blanda hacia dentro
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 10 mm, el 8630 ya está en
              36,9 HRC, y a la mitad, 17,1 mm, en 29,7. Su curva cae deprisa en
              los primeros milímetros y después se aplana, y el perfil copia esa
              forma.
          - texto: >-
              Una U suave y alta, porque es un acero aleado y en agua templa
              entero
            mensaje: |
              La aleación da templabilidad, pero no la misma a todos. Con un
              0,3 % de C la martensita del 8630 no pasa de 52 HRC ni en el
              extremo, y su curva cae deprisa: a 90 mm, casi toda la sección
              queda por debajo de 37.
          - texto: >-
              No se puede dibujar, porque 90 mm se sale de la gráfica del agua
            mensaje: |
              La gráfica del agua llega a 100 mm, y las cuatro curvas cruzan los
              90. Lo que no llega a 90 es la curva del centro de la gráfica del
              aceite, que termina hacia 83 mm, pero esta probeta va al agua.

      - tipo: calcular
        titulo: La superficie del caso d)
        pregunta: |
          Caso d), un 8660 de 100 mm templado en agua. ¿Qué dureza tiene la
          superficie?
        respuesta:
          tipo: numero
          valor: '63.9'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '56.6'
            mensaje: |
              Has leído la gráfica del **aceite**, donde la superficie de 100 mm
              equivale a unos 20 mm. En agua equivale a 3,4 mm.
          - valor: '52.7'
            mensaje: |
              Esa es la dureza del centro. La superficie es la curva de más a la
              izquierda de la gráfica del agua.
        pista: |
          La gráfica del agua llega justo a 100 mm: las cuatro curvas terminan
          en su borde de arriba. La de la superficie termina hacia 3,4 mm.
        desarrollo: |
          En el borde de arriba, 100 mm, la superficie equivale a **3,4 mm**, y
          ahí el 8660 está en **63,9 HRC**. Su curva empieza por encima de
          60 HRC: hay que leerla por encima de la última línea de la cuadrícula.

      - tipo: calcular
        titulo: El centro del caso d)
        pregunta: |
          ¿Y qué dureza tiene el centro del 8660?
        respuesta:
          tipo: numero
          valor: '52.7'
          tolerancia: 1.5
          formato: en HRC, solo el número
        distractores:
          - valor: '63.9'
            mensaje: |
              Esa es la superficie. El centro es la curva de más a la derecha de
              la gráfica del agua, que en 100 mm termina hacia 26 mm.
          - valor: '42'
            mensaje: |
              Has leído el 8660 a 50 mm, el radio de la barra, que es el final
              de su curva. La distancia que se lleva a la curva es la de la
              probeta Jominy: para este centro, unos 26 mm.
        pista: |
          La curva del centro de la gráfica del agua termina, en 100 mm, hacia
          26 mm.
        desarrollo: |
          El centro de 100 mm en agua equivale a unos **26 mm**, y el 8660 está
          ahí en **52,7 HRC**.

      - tipo: reconocer
        pregunta: |
          Con 63,9 HRC en la superficie y 52,7 en el centro, ¿qué perfil dibuja
          el caso d)?
        opciones:
          - texto: >-
              Alto y poco caído: todo por encima de 50 HRC, incluso el centro de
              una barra de 100 mm
            correcta: true
            mensaje: |
              Eso es. A tres cuartos del radio, 11 mm, el 8660 tiene 61,5 HRC,
              y a la mitad, 19,8 mm, 56,7. Con un 0,6 % de C su martensita es
              muy dura y su curva cae despacio. Otra cosa es que convenga: con
              tanto carbono el agua puede agrietar la pieza, y para eso está el
              aceite.
          - texto: >-
              No se puede leer, porque 100 mm es el borde de la gráfica y las
              curvas terminan ahí
            mensaje: |
              Las curvas terminan ahí porque ahí termina la gráfica, pero su
              último punto está justo en 100 mm. Es la lectura más al límite de
              la colección, y es válida; lo que no se podría leer es un diámetro
              mayor.
          - texto: >-
              Muy caído, como el del caso c), porque cuanto más gruesa es la
              barra más cae el perfil
            mensaje: |
              Un diámetro mayor lleva todas las posiciones más lejos del extremo
              templado, pero cuánto baja la dureza lo decide la curva del acero.
              La del 8660 a 26 mm aún está en 52,7; la del 8630, a 21,8 mm, ya
              estaba en 27.

      - tipo: dibujar
        consigna: |
          Dibuja los cuatro perfiles de dureza: la dureza, en HRC, en el eje
          vertical, y en el horizontal la posición en la sección, de una
          superficie a la otra pasando por el centro, con la superficie, los
          tres cuartos del radio, la mitad del radio y el centro marcados a
          los dos lados. Cada uno en sus ejes, con su diámetro, o los cuatro
          en unos mismos ejes con el radio como unidad, que es como mejor se
          comparan. Las durezas de ¾ R y ½ R están en la tabla de la
          resolución.
        comprueba:
          - punto: >-
              Siete puntos por perfil, simétricos: superficie, ¾ R, ½ R,
              centro, ½ R, ¾ R y superficie, con ¾ R más cerca de la
              superficie que ½ R
            porque: >-
              Las gráficas del medio de temple dan cuatro posiciones, y la
              sección las tiene a los dos lados del centro. ¾ R está a tres
              cuartos del radio contados desde el centro, a un cuarto de la
              superficie: repartir las posiciones a partes iguales deforma el
              perfil justo donde más cae.
          - punto: >-
              Forma de U en los cuatro: más dura la superficie, más blando el
              centro
            porque: >-
              En un cilindro templado la superficie se enfría más deprisa que
              el centro y sale más dura (diapositiva 19 del tema 6). Un perfil
              más duro por dentro es el error de pensar que enfriar más tiempo
              endurece más: más tiempo es más difusión y menos martensita.
          - punto: >-
              d) por encima de todos y de 50 HRC en toda la sección, de 63,9 a
              52,7; b), de 56,8 a 45,2
            porque: >-
              Son las dos barras más duras: el 8660 por su carbono,
              que sube la dureza de la martensita, y el 5140 porque va al agua
              y su barra es la más fina. Si tu b) sale plano a 57, has
              olvidado que el centro de 50 mm en agua equivale a unos 10 mm del
              extremo templado.
          - punto: >-
              a) una U baja y abierta, de 47,3 a 36,6, sin llegar a 50 ni en
              la superficie
            porque: >-
              Es la única probeta templada en aceite, y en aceite la superficie
              de 75 mm ya equivale a 12,8 mm del extremo templado: la
              superficie tampoco es martensita entera.
          - punto: >-
              c) cruza a la a): empieza más arriba en la superficie, con
              49,9 HRC, cae a 36,9 en ¾ R y a 29,7 en ½ R, y de ahí al centro
              se aplana hasta 27,2
            porque: >-
              Es el perfil que enseña que la dureza de la superficie no ordena
              los perfiles. El 8630 tiene poco carbono y una curva que cae
              enseguida, así que en una barra de 90 mm casi toda la sección
              queda blanda aunque se temple en agua.
        figura: |
          <svg viewBox="0 0 440 300" role="img" width="440" height="300" aria-labelledby="f-cm6-col61-perfiles-t f-cm6-col61-perfiles-d">
            <title id="f-cm6-col61-perfiles-t">Los cuatro perfiles de dureza del problema 6.1</title>
            <desc id="f-cm6-col61-perfiles-d">Dureza Rockwell C, de 20 a 65, frente a la posición en la sección de cada probeta, con el radio como unidad: la superficie en los dos extremos, los tres cuartos del radio y la mitad del radio a cada lado, y el centro en medio. Cuatro curvas en forma de U, simétricas, con sus siete puntos marcados. La d), un 8660 de 100 mm en agua, es la más alta: de 63,9 HRC en la superficie a 52,7 en el centro. La b), un 5140 de 50 mm en agua, baja de 56,8 a 45,2. La a), un 8640 de 75 mm en aceite, baja poco a poco de 47,3 a 36,6. La c), un 8630 de 90 mm en agua, empieza en 49,9, por encima de la a), cae de golpe a 36,9 en los tres cuartos del radio, sigue bajando hasta 29,7 en la mitad del radio y se aplana hasta 27,2 en el centro: las curvas a) y c) se cruzan entre la superficie y los tres cuartos del radio.</desc>
