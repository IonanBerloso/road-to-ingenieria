ejercicios:
  - id: ejcm9-cuantos-meros-tiene-una-cadena
    titulo: Cuántos meros tiene una cadena de polietileno
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el grado de
      polimerización del Tema 9. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un polietileno tiene una masa molar media de 100 000 g/mol. Con masas
      atómicas de 12,01 g/mol para el carbono y 1,008 g/mol para el hidrógeno,
      ¿cuál es su grado de polimerización?
    pide: La masa molar del mero y el grado de polimerización.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el mero del polietileno?
        opciones:
          - texto: C₂H₄, la unidad que se repite al abrirse el doble enlace del etileno
            correcta: true
            mensaje: |
              Eso es. En la cadena $-(\text{CH}_2-\text{CH}_2)_n-$ la unidad que se
              repite tiene dos carbonos y cuatro hidrógenos, los mismos átomos
              que el etileno.
          - texto: CH₂, porque la cadena es una sucesión de grupos CH₂
            mensaje: |
              La cadena sí es una sucesión de CH₂, pero el mero es la unidad
              que aporta cada monómero, el etileno, con **dos** carbonos. Con
              CH₂ saldría el doble de meros.
          - texto: C₂H₆, el etano
            mensaje: |
              El etano no polimeriza: no tiene doble enlace que abrir. El
              monómero es el etileno, C₂H₄, y el mero tiene sus mismos átomos.

      - tipo: calcular
        titulo: La masa molar del mero
        pregunta: |
          ¿Cuál es la masa molar del mero?
        respuesta:
          tipo: numero
          valor: '28.05'
          tolerancia: 0.05
          formato: en g/mol, solo el número
        distractores:
          - valor: '14.03'
            mensaje: |
              Esa es la del grupo CH₂, medio mero. El mero del polietileno es
              C₂H₄.
        pista: |
          Dos carbonos y cuatro hidrógenos.
        desarrollo: |
          $$
          m = 2\cdot 12{,}01 + 4\cdot 1{,}008 = 28{,}05\ \text{g/mol}
          $$

      - tipo: calcular
        titulo: El grado de polimerización
        pregunta: |
          ¿Cuántos meros tiene de media cada cadena?
        respuesta:
          tipo: numero
          valor: '3565'
          tolerancia: 20
          formato: un número entero, aproximado
        distractores:
          - valor: '7128'
            mensaje: |
              Has dividido entre la masa del CH₂, 14,03. Así cuentas grupos CH₂,
              que son el doble que meros.
        pista: |
          $n = \overline{M}/m$.
        desarrollo: |
          $$
          n = \frac{100\,000}{28{,}05} = 3565
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El mero del polietileno es C₂H₄, de 28,05 g/mol.'
          - texto: 'El grado de polimerización es la masa molar media entre la del mero: unos 3565.'
          - texto: 'Es una media: en el mismo polietileno hay cadenas más largas y más cortas.'
          - texto: 'Todas las cadenas tienen exactamente 3565 meros, porque el polímero es puro.'
            trampa: true
            mensaje: |
              La polimerización no fabrica cadenas iguales: cada una crece
              hasta que algo la detiene. Por eso se da una masa molar **media**,
              y el grado de polimerización también es una media.
    resolucion: |
      **El mero es C₂H₄**, la unidad que aporta cada etileno al abrir su doble
      enlace:

      $$
      m = 2\cdot 12{,}01 + 4\cdot 1{,}008 = 28{,}05\ \text{g/mol}
      $$

      **El grado de polimerización es cuántos meros caben en la masa molar
      media:**

      $$
      n = \frac{100\,000}{28{,}05} = 3565
      $$

      Unos 3600 meros por cadena, de media. Con dos carbonos por mero, la
      columna vertebral de una cadena tiene más de 7000 átomos de carbono en
      fila: por eso las cadenas se enredan tanto.

  - id: ejcm9-la-cristalinidad-desde-la-densidad
    titulo: La cristalinidad de un polímero, desde su densidad
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la cristalinidad del
      Tema 9. Las densidades son datos del ejemplo. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      Una muestra de un polímero tiene una densidad de 0,940 g/cm³. Ese mismo
      polímero, totalmente cristalino, tendría 1,000 g/cm³, y totalmente amorfo,
      0,870 g/cm³. ¿Qué porcentaje de la muestra es cristalino?
    pide: El porcentaje de cristalinidad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la densidad sirve para medir la cristalinidad?
        opciones:
          - texto: Porque en las zonas cristalinas las cadenas están más apretadas, y cuanta más zona cristalina, más densa la muestra
            correcta: true
            mensaje: |
              Exacto. La densidad de la muestra queda entre la del polímero
              amorfo y la del cristalino, y dónde cae dice cuánto hay de cada
              cosa.
          - texto: Porque las zonas cristalinas tienen átomos más pesados
            mensaje: |
              Los átomos son los mismos en las dos zonas. Lo que cambia es cómo
              de juntas están las cadenas: en las cristalinas, plegadas y
              ordenadas, caben más en el mismo volumen.
          - texto: Porque los polímeros amorfos no tienen densidad definida
            mensaje: |
              Un amorfo tiene su densidad, la de este polímero es 0,870 g/cm³.
              Simplemente es menor que la del cristalino.

      - tipo: calcular
        titulo: El porcentaje de cristalinidad
        pregunta: |
          ¿Qué porcentaje de la muestra es cristalino?
        respuesta:
          tipo: numero
          valor: '57.3'
          tolerancia: 0.6
          formato: el porcentaje, sin el símbolo
        distractores:
          - valor: '53.8'
            mensaje: |
              Has hecho la proporción lineal en densidades,
              $(0{,}940 - 0{,}870)/(1{,}000 - 0{,}870)$. La fórmula lleva
              además el cociente $\rho_c/\rho_s$, porque lo que se cuenta es
              masa, no volumen.
          - valor: '42.7'
            mensaje: |
              Ese es el porcentaje **amorfo**: el resto hasta 100.
        pista: |
          $\dfrac{\rho_c\,(\rho_s - \rho_a)}{\rho_s\,(\rho_c - \rho_a)}\cdot 100$.
        desarrollo: |
          $$
          \frac{1{,}000\,(0{,}940 - 0{,}870)}{0{,}940\,(1{,}000 - 0{,}870)}\cdot 100
          = \frac{0{,}070}{0{,}1222}\cdot 100 = 57{,}3\ \%
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La densidad de la muestra cae entre la del amorfo y la del cristalino.'
          - texto: 'La fórmula de la cristalinidad, en masa, da un 57,3 % de parte cristalina.'
          - texto: 'El resto, un 42,7 %, son zonas amorfas donde las cadenas están enredadas al azar.'
          - texto: 'Con más cristalinidad la muestra sería menos rígida, porque las zonas cristalinas son más blandas.'
            trampa: true
            mensaje: |
              Es al revés: en las zonas cristalinas las cadenas están
              ordenadas y apretadas, y se sujetan mejor entre sí. Más
              cristalinidad da un polímero más denso, más rígido y más
              resistente.
    resolucion: |
      **La densidad dice cuánta muestra es cristalina**, porque las zonas
      cristalinas son más densas que las amorfas. La fórmula cuenta masa, y por
      eso lleva el cociente de densidades delante:

      $$
      \%\,\text{cristalinidad} = \frac{\rho_c\,(\rho_s - \rho_a)}{\rho_s\,(\rho_c - \rho_a)}\cdot 100
      = \frac{1{,}000\cdot 0{,}070}{0{,}940\cdot 0{,}130}\cdot 100 = 57{,}3\ \%
      $$

      Algo más de la mitad de la muestra es cristalina. La cuenta lineal en
      densidades, sin ese cociente, daría el porcentaje en **volumen**, 53,8 %:
      menos, porque la parte cristalina ocupa menos sitio para la misma masa.
