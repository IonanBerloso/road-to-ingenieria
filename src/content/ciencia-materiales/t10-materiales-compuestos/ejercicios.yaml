ejercicios:
  - id: ejcm10-el-modulo-en-las-dos-direcciones
    titulo: El módulo de un compuesto, a lo largo y a lo ancho
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la regla de las
      mezclas del Tema 10, con módulos típicos de fibra de vidrio y de resina
      epoxi. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un compuesto tiene un 50 % en volumen de fibra de vidrio continua y
      alineada, de módulo 69 GPa, en una matriz epoxi de 3,4 GPa. ¿Cuál es su
      módulo de elasticidad en la dirección de las fibras? ¿Y perpendicular a
      ellas?
    pide: El módulo longitudinal y el transversal.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cargado en la dirección de las fibras, ¿qué tienen en común la fibra
          y la matriz?
        opciones:
          - texto: La deformación, porque están pegadas y se estiran juntas
            correcta: true
            mensaje: |
              Eso es: isodeformación. Con la misma deformación, cada fase
              aporta rigidez según su módulo y su fracción de volumen, y los
              módulos se suman pesados.
          - texto: La tensión, porque la carga es la misma
            mensaje: |
              La tensión igual es el caso **perpendicular** a las fibras. En la
              dirección de las fibras, la fibra, más rígida, soporta mucha más
              tensión que la matriz con la misma deformación.
          - texto: El módulo, porque el compuesto es un solo material
            mensaje: |
              Cada fase conserva su módulo: 69 y 3,4 GPa. Lo que se calcula es
              el módulo **efectivo** del conjunto.

      - tipo: calcular
        titulo: El módulo longitudinal
        pregunta: |
          ¿Cuál es el módulo en la dirección de las fibras?
        respuesta:
          tipo: magnitud
          valor: '36.2 GPa'
          tolerancia: 0.01
          formato: un módulo, con su unidad
        distractores:
          - valor: '6.48 GPa'
            mensaje: |
              Ese es el transversal, el de las inversas. En la dirección de las
              fibras se suman los módulos directamente, pesados con el volumen.
        pista: |
          $E_{\text{long}} = E_m V_m + E_f V_f$.
        desarrollo: |
          $$
          E_{\text{long}} = 3{,}4\cdot 0{,}5 + 69\cdot 0{,}5 = 1{,}7 + 34{,}5 = 36{,}2\ \text{GPa}
          $$

      - tipo: calcular
        titulo: El módulo transversal
        pregunta: |
          ¿Y perpendicular a las fibras?
        respuesta:
          tipo: magnitud
          valor: '6.48 GPa'
          tolerancia: 0.01
          formato: un módulo, con su unidad
        distractores:
          - valor: '36.2 GPa'
            mensaje: |
              Esa es la media directa, que solo vale en la dirección de las
              fibras. Perpendicular a ellas la matriz se deforma casi sola, y
              se suman las inversas.
          - valor: '0.154 GPa'
            mensaje: |
              Te has quedado en la suma de las inversas. Falta darle la vuelta:
              el módulo es $1/0{,}154$.
        pista: |
          $1/E_{\text{trans}} = V_m/E_m + V_f/E_f$.
        desarrollo: |
          $$
          \frac{1}{E_{\text{trans}}} = \frac{0{,}5}{3{,}4} + \frac{0{,}5}{69} = 0{,}1471 + 0{,}0072 = 0{,}1543
          \qquad
          E_{\text{trans}} = 6{,}48\ \text{GPa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'En la dirección de las fibras las dos fases se estiran igual, y los módulos se suman pesados: 36,2 GPa.'
          - texto: 'Perpendicular a ellas soportan la misma tensión, y se suman las inversas: 6,48 GPa.'
          - texto: 'El compuesto es más de cinco veces más rígido a lo largo de las fibras que a lo ancho.'
          - texto: 'Como la mitad es fibra, el módulo es la media de los dos en cualquier dirección.'
            trampa: true
            mensaje: |
              La media pesada solo vale en la dirección de las fibras.
              Perpendicular a ellas la matriz blanda se deforma casi sola, y el
              módulo se queda cerca del de la matriz: 6,48 GPa, no 36,2.
    resolucion: |
      **En la dirección de las fibras, isodeformación**: los módulos se suman
      pesados con el volumen.

      $$
      E_{\text{long}} = 3{,}4\cdot 0{,}5 + 69\cdot 0{,}5 = 36{,}2\ \text{GPa}
      $$

      **Perpendicular, isotensión**: se suman las inversas.

      $$
      \frac{1}{E_{\text{trans}}} = \frac{0{,}5}{3{,}4} + \frac{0{,}5}{69}
      \qquad
      E_{\text{trans}} = 6{,}48\ \text{GPa}
      $$

      El mismo material es más de cinco veces más rígido en una dirección que
      en la otra. Por eso las piezas de compuesto se diseñan con las fibras
      donde van las cargas.

  - id: ejcm10-la-carga-que-llevan-las-fibras
    titulo: Qué parte de la carga llevan las fibras
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el reparto de la carga
      en un compuesto de fibras del Tema 10. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      En el mismo compuesto —50 % de fibra de vidrio de 69 GPa en epoxi de
      3,4 GPa—, cargado en la dirección de las fibras, ¿qué fracción de la
      carga llevan las fibras?
    pide: La fracción de la carga que soportan las fibras.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la misma deformación, ¿de qué depende la tensión de cada fase?
        opciones:
          - texto: De su módulo, porque cada una sigue la ley de Hooke con la misma deformación
            correcta: true
            mensaje: |
              Exacto. $\sigma = E\,\varepsilon$ con la misma $\varepsilon$: la
              fibra, veinte veces más rígida, soporta veinte veces más tensión.
          - texto: De su fracción de volumen, y la tensión es igual en las dos
            mensaje: |
              La tensión igual es el caso transversal. Aquí la igual es la
              deformación, y la tensión de cada fase va con su módulo.
          - texto: Solo de la matriz, porque es la que recibe la carga
            mensaje: |
              La matriz recibe la carga y se la pasa a las fibras por la
              superficie: así funcionan precisamente los compuestos de fibras.

      - tipo: calcular
        titulo: La fracción de la carga en las fibras
        pregunta: |
          ¿Qué fracción de la carga llevan las fibras?
        respuesta:
          tipo: numero
          valor: '0.953'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.5'
            mensaje: |
              Esa es su fracción de volumen. La carga no se reparte por volumen
              sino por rigidez: cada fase lleva su módulo por su volumen.
          - valor: '20.3'
            mensaje: |
              Esa es la relación entre la carga de las fibras y la de la matriz,
              $F_f/F_m$. La fracción del total es $F_f/(F_f + F_m)$.
        pista: |
          $\dfrac{F_f}{F_f + F_m} = \dfrac{E_f V_f}{E_f V_f + E_m V_m}$.
        desarrollo: |
          $$
          \frac{F_f}{F_f + F_m} = \frac{69\cdot 0{,}5}{69\cdot 0{,}5 + 3{,}4\cdot 0{,}5}
          = \frac{34{,}5}{36{,}2} = 0{,}953
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'En la dirección de las fibras, fibra y matriz se estiran lo mismo.'
          - texto: 'Cada una lleva una carga proporcional a su módulo por su volumen: 34,5 frente a 1,7.'
          - texto: 'Las fibras llevan el 95 % de la carga, aunque solo sean la mitad del volumen.'
          - texto: 'Como hay tanta fibra como matriz, cada una lleva la mitad de la carga.'
            trampa: true
            mensaje: |
              Con la misma deformación, lleva más carga la fase más rígida. La
              fibra es veinte veces más rígida que la resina y, con el mismo
              volumen, lleva veinte veces más carga.
    resolucion: |
      **Con la misma deformación, cada fase lleva una carga proporcional a su
      módulo por su volumen:**

      $$
      \frac{F_f}{F_f + F_m} = \frac{E_f V_f}{E_f V_f + E_m V_m}
      = \frac{34{,}5}{34{,}5 + 1{,}7} = 0{,}953
      $$

      Las fibras llevan el 95 % de la carga siendo la mitad del volumen. La
      matriz está para sujetarlas y pasarles la carga, no para llevarla: por
      eso un compuesto se diseña pensando en las fibras.
