ejercicios:
  - id: ejcm8-cuantos-oxigenos-rodean-al-magnesio
    titulo: Cuántos oxígenos rodean a un ion de magnesio
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la relación de radios
      del Tema 8, con radios iónicos de tabla. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      En la magnesia, MgO, el ion Mg²⁺ tiene un radio de 0,072 nm y el O²⁻, de
      0,140 nm. ¿Cuál es la relación de radios? ¿Qué número de coordinación
      tiene el magnesio?
    pide: La relación de radios y el número de coordinación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué radio va en el numerador?
        opciones:
          - texto: El del catión, el Mg²⁺, porque es el pequeño y lo que se pregunta es cuántos aniones caben a su alrededor
            correcta: true
            mensaje: |
              Eso es. La relación de radios compara el catión con el anión que
              lo rodea: $r_{\text{Mg}}/r_{\text{O}}$, que sale menor que 1.
          - texto: El del anión, porque es el más grande
            mensaje: |
              Al revés sale 1,94, un número mayor que 1 que no cae en ningún
              tramo de la tabla. La relación va del catión al anión.
          - texto: Da igual, porque la coordinación sale la misma
            mensaje: |
              No da igual: los tramos de la tabla están escritos para
              $r_{\text{catión}}/r_{\text{anión}}$, entre 0 y 1. Con la división
              al revés no hay tramo que leer.

      - tipo: calcular
        titulo: La relación de radios
        pregunta: |
          ¿Cuánto vale la relación de radios?
        respuesta:
          tipo: numero
          valor: '0.514'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '1.944'
            mensaje: |
              Has dividido el anión entre el catión. La relación va al revés:
              0,072 entre 0,140.
        pista: |
          $r_{\text{Mg}^{2+}}/r_{\text{O}^{2-}}$.
        desarrollo: |
          $$
          \frac{r_{\text{Mg}^{2+}}}{r_{\text{O}^{2-}}} = \frac{0{,}072}{0{,}140} = 0{,}514
          $$

      - tipo: calcular
        titulo: El número de coordinación
        pregunta: |
          ¿Cuántos oxígenos rodean a cada magnesio?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              La coordinación 4 es para relaciones entre 0,225 y 0,414. Con
              0,514 el magnesio es lo bastante grande para tocar a seis
              oxígenos a la vez.
          - valor: '8'
            mensaje: |
              Para ocho hace falta una relación de más de 0,732, como la del
              cloruro de cesio. Con 0,514, ocho oxígenos no tocarían todos al
              magnesio.
        pista: |
          0,514 está entre 0,414 y 0,732.
        desarrollo: |
          Entre 0,414 y 0,732 la coordinación es **6**, octaédrica: la
          estructura de la sal gema, la misma que la del NaCl.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La relación de radios del catión al anión es 0,072/0,140 = 0,514.'
          - texto: 'Cae entre 0,414 y 0,732, el tramo de la coordinación 6.'
          - texto: 'Cada magnesio tiene seis oxígenos alrededor, en octaedro: la estructura de la sal gema.'
          - texto: 'Cuanto más grande es el catión, menos aniones caben a su alrededor.'
            trampa: true
            mensaje: |
              Es al revés: un catión más grande tiene más superficie alrededor
              y le caben más aniones tocándolo. Por eso la coordinación sube
              con la relación de radios, de 4 a 6 y a 8.
    resolucion: |
      **La relación de radios, del catión al anión:**

      $$
      \frac{r_{\text{Mg}^{2+}}}{r_{\text{O}^{2-}}} = \frac{0{,}072}{0{,}140} = 0{,}514
      $$

      **Cae entre 0,414 y 0,732**, así que cada Mg²⁺ se rodea de **seis**
      oxígenos, en octaedro. Es la estructura de la sal gema: los oxígenos
      forman una red FCC y los magnesios ocupan todos sus huecos octaédricos,
      que es por lo que la magnesia y el NaCl tienen la misma celda.

  - id: ejcm8-la-raya-que-rompe-una-placa
    titulo: La raya que le quita resistencia a una placa cerámica
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la fragilidad de los
      cerámicos del Tema 8. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una placa de alúmina rompe a 300 MPa, y su grieta más grande mide 10 μm.
      Al manipularla se le hace una raya que actúa como una grieta de 40 μm.
      Si la resistencia es inversamente proporcional a la raíz cuadrada del
      tamaño de la grieta más grande, ¿a qué tensión rompe ahora?
    pide: La nueva resistencia de la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué grieta decide la resistencia de la placa?
        opciones:
          - texto: La más grande, porque es donde la tensión se concentra más y por donde empieza la rotura
            correcta: true
            mensaje: |
              Exacto. Un cerámico rompe en cuanto una grieta empieza a crecer,
              y la primera en hacerlo es la más grande. Desde la raya, esa es
              la de 40 μm.
          - texto: La media de todas las grietas de la placa
            mensaje: |
              La rotura no hace medias: empieza en el peor sitio. Una sola
              grieta grande basta, aunque todas las demás sean pequeñas.
          - texto: La primera que tenía, la de 10 μm, porque la raya solo es superficial
            mensaje: |
              Una raya en la superficie es justamente la peor grieta posible:
              la tracción en la superficie la abre. Desde que existe, manda
              ella.

      - tipo: calcular
        titulo: La nueva resistencia
        pregunta: |
          ¿A qué tensión rompe ahora la placa?
        respuesta:
          tipo: magnitud
          valor: '150 MPa'
          tolerancia: 0.02
          formato: una tensión, con su unidad
        distractores:
          - valor: '75 MPa'
            mensaje: |
              Has dividido entre 4, como si la resistencia fuera inversamente
              proporcional al tamaño. Va con la **raíz**: una grieta cuatro
              veces mayor divide la resistencia entre dos.
          - valor: '600 MPa'
            mensaje: |
              Has multiplicado en vez de dividir. Una grieta mayor tiene que dar
              **menos** resistencia, no más.
        pista: |
          $\sigma_2 = \sigma_1\,\sqrt{a_1/a_2}$.
        desarrollo: |
          $$
          \sigma_2 = 300\cdot\sqrt{\frac{10}{40}} = 300\cdot 0{,}5 = 150\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La rotura empieza en la grieta más grande, que ahora es la raya de 40 μm.'
          - texto: 'La resistencia va con la inversa de la raíz del tamaño: una grieta cuatro veces mayor la divide entre dos.'
          - texto: 'La placa pasa a romper a 150 MPa, la mitad que antes.'
          - texto: 'Como el material es el mismo, la resistencia no cambia: una raya no cambia la alúmina.'
            trampa: true
            mensaje: |
              En un metal eso sería casi verdad, porque la deformación plástica
              redondea la punta de la grieta. En un cerámico la resistencia no
              es solo del material: es del material **con su grieta más
              grande**, y la raya la ha cambiado.
    resolucion: |
      **Manda la grieta más grande**, que desde la raya es la de 40 μm. Con la
      resistencia inversamente proporcional a la raíz de su tamaño:

      $$
      \frac{\sigma_2}{\sigma_1} = \sqrt{\frac{a_1}{a_2}} = \sqrt{\frac{10}{40}} = 0{,}5
      \qquad
      \sigma_2 = 150\ \text{MPa}
      $$

      Una raya cuatro veces mayor que la grieta que había basta para quitarle a
      la placa la mitad de su resistencia. Es la razón de que los cerámicos se
      manipulen con cuidado, de que su resistencia se trate con estadística y
      de que el vidrio templado funcione: su superficie comprimida mantiene
      cerradas precisamente esas rayas.
