# El simulacro del examen de los temas 1 a 6 de Ciencia de Materiales (fase
# H3, 29 de septiembre de 2026). NO es una convocatoria: el material no trae
# ningún examen de teoría y problemas, y este lo montamos con ejercicios del
# curso ya publicados en sus temas. Por eso vive en `simulacros/` y no en
# `examenes/`, y `esPropia` lo saca de todo lo que cuenta convocatorias.
#
# La forma es la del examen de verdad (guía del alumnado 2025-2026, pág. 13):
# un 40 % de teoría y un 60 % de problemas, con un mínimo de 4,0 en cada
# parte. El peso, el mínimo y el tope salen del catálogo (`partes[].sub`).
#
# Los problemas, uno de cada bloque grande del listado, como pidió la
# auditoría del 27 de septiembre: tracción (T2), trabajo en frío (T3), Fe-C
# (T4) y templabilidad (T6). La teoría, dos preguntas de escribir de las que
# entraron en la fase H1.
asignatura: ciencia-materiales
curso: '2025-2026'
convocatoria: simulacro
propio:
  titulo: Simulacro del examen de los temas 1 a 6
  aviso: |
    **No es un examen que haya caído.** El material de la asignatura no trae
    ningún examen de teoría y problemas, así que este lo hemos montado
    nosotros con lo que sí hay: cuatro problemas del listado de la profesora,
    tal cual, y dos preguntas de teoría escrita nuestras.

    Tiene la forma del examen de verdad: un 40 % de teoría y un 60 % de
    problemas, con calculadora científica y regla (guía del alumnado
    2025-2026, pág. 13), y sin apuntes, porque la normativa los prohíbe salvo
    que se diga lo contrario. Lo que el material no dice es cuánto dura ni
    cómo son las preguntas de teoría: el reloj es la regla de 30 minutos por
    ejercicio, y la teoría es de escribir, como la que piden los propios
    problemas del listado.
  partes:
    - sub: teoria
      n: [1, 2]
    - sub: problemas
      n: [3, 4, 5, 6]
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Los cuatro problemas son los
  del listado de la profesora, transcritos tal cual en su tema, y las dos
  preguntas de teoría son nuestras.
ejercicios:
  - id: ejcm2-teoria-ductilidad-frente-a-tenacidad
    tema: t02-propiedades-mecanicas
  - id: ejcm6-teoria-recocido-normalizado-temple
    tema: t06-tratamientos-termicos
  - id: ejcm2-col228-la-probeta-de-cobre-entera
    tema: t02-propiedades-mecanicas
  - id: ejcm3-col327-una-lamina-de-aluminio-para-un-fuselaje
    tema: t03-estructura-cristalina
  - id: ejcm4-col427-seis-kilos-de-austenita-con-045-c
    tema: t04-diagramas-de-fase
  - id: ejcm6-col63-el-diametro-de-un-4140-en-aceite
    tema: t06-tratamientos-termicos
