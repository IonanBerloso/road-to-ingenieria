# El simulacro del primer entregable de Ciencia de Materiales, temas 2 y 3
# (fase H3, 29 de septiembre de 2026). No es una convocatoria: ver el
# simulacro del examen, en `../2025-2026-simulacro/examen.yaml`.
#
# El entregable de verdad es un control individual CON APUNTES (presentación
# de la asignatura 2025-2026, diap. 19; el de los temas 2 y 3 fue el 24 de
# octubre). Tres problemas del listado que no están en el simulacro del
# examen, para que los dos se puedan hacer sin repetir.
asignatura: ciencia-materiales
curso: '2025-2026'
convocatoria: simulacro-entregable-1
propio:
  titulo: Simulacro del primer entregable, temas 2 y 3
  aviso: |
    **No es un control que haya caído.** Los entregables son dos controles
    individuales con apuntes (presentación de la asignatura, diap. 19); el de
    los temas 2 y 3 fue el 24 de octubre de 2025, y el material no trae
    ninguno. Este lo hemos montado con tres problemas del listado de la
    profesora, tal cual, que no están en el simulacro del examen.

    El material no dice cuánto dura: el reloj es la regla de 30 minutos por
    ejercicio.
  conApuntes: true
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Los tres problemas son los
  del listado de la profesora, transcritos tal cual en su tema.
ejercicios:
  - id: ejcm2-col229-el-aluminio-que-parece-acero
    tema: t02-propiedades-mecanicas
  - id: ejcm2-col230-la-huella-de-la-bola-brinell
    tema: t02-propiedades-mecanicas
  - id: ejcm3-col324-hilar-recocer-hilar
    tema: t03-estructura-cristalina
