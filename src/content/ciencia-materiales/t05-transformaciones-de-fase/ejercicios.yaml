ejercicios:
  - id: ejcm5-cuanto-tarda-la-mitad
    titulo: Cuánto tarda en transformarse la mitad
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ecuación de Avrami
      del Tema 5 de la asignatura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      A temperatura constante, la fracción transformada de una aleación sigue
      la ecuación de Avrami con $k = 0{,}01$ y $n = 2$, con el tiempo en
      segundos:

      $$
      y = 1 - e^{-0{,}01\,t^{2}}
      $$

      ¿Cuánto tarda en transformarse la mitad? ¿Cuál es la velocidad de la
      transformación?
    pide: El tiempo de media transformación y la velocidad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué valor de $y$ corresponde a «la mitad transformada»?
        opciones:
          - texto: y = 0,5, porque y es la fracción de material ya transformado
            correcta: true
            mensaje: |
              Eso es. $y$ va de 0, nada transformado, a 1, todo. La mitad es
              $y = 0{,}5$, y el tiempo que tarda en llegar ahí es $t_{0,5}$.
          - texto: y = 50, porque es un porcentaje
            mensaje: |
              En la ecuación de Avrami $y$ es una fracción entre 0 y 1, no un
              porcentaje: con $y = 50$ la exponencial tendría que ser negativa,
              y no lo es nunca.
          - texto: y = 1/2 de k, porque la mitad afecta a la constante
            mensaje: |
              La constante $k$ es del material y la temperatura, y no cambia
              con lo transformado. Lo que vale la mitad es $y$.

      - tipo: calcular
        titulo: El tiempo de media transformación
        pregunta: |
          ¿Cuánto vale $t_{0,5}$?
        respuesta:
          tipo: magnitud
          valor: '8.33 s'
          tolerancia: 0.02
          formato: un tiempo, con su unidad
        distractores:
          - valor: '69.3 s'
            mensaje: |
              Eso es $t^{2}$, no $t$: te falta la raíz. Con $n = 2$ el tiempo
              va elevado al cuadrado dentro de la exponencial.
          - valor: '7.07 s'
            mensaje: |
              Has despejado sin el logaritmo, como si $e^{-kt^{2}} = 0{,}5$
              diera $kt^{2} = 0{,}5$. Hay que tomar logaritmos:
              $k t^{2} = \ln 2 = 0{,}693$.
        pista: |
          $0{,}5 = 1 - e^{-kt^{2}}$ lleva a $e^{-kt^{2}} = 0{,}5$, y de ahí
          $k t^{2} = \ln 2$.
        desarrollo: |
          $$
          e^{-0{,}01\,t^{2}} = 0{,}5
          \;\Longrightarrow\;
          t^{2} = \frac{\ln 2}{0{,}01} = 69{,}3
          \;\Longrightarrow\;
          t_{0,5} = 8{,}33\ \text{s}
          $$

      - tipo: calcular
        titulo: La velocidad de la transformación
        pregunta: |
          Con el convenio del tema, ¿cuál es la velocidad de la
          transformación?
        respuesta:
          tipo: numero
          valor: '0.12'
          tolerancia: 0.003
          formato: en s⁻¹, solo el número
        distractores:
          - valor: '8.33'
            mensaje: |
              Ese es el tiempo, no la velocidad. El convenio es el inverso:
              cuanto más tarda, más lenta.
          - valor: '0.06'
            mensaje: |
              Has partido la mitad entre el tiempo, $0{,}5/t_{0,5}$. La
              velocidad del convenio es $1/t_{0,5}$ a secas.
        pista: |
          $v = 1/t_{0,5}$.
        desarrollo: |
          $$
          v = \frac{1}{t_{0,5}} = \frac{1}{8{,}33} = 0{,}12\ \text{s}^{-1}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La mitad transformada es y = 0,5, y eso deja la exponencial en 0,5.'
          - texto: 'Tomando logaritmos, 0,01·t² = ln 2, así que t vale 8,33 s.'
          - texto: 'La velocidad es el inverso de ese tiempo: 0,12 por segundo.'
          - texto: 'La velocidad es la pendiente de la curva en S en su punto más alto.'
            trampa: true
            mensaje: |
              Arriba la curva ya está plana: casi todo está transformado y no
              queda qué transformar. El convenio del tema no mira ninguna
              pendiente: es el inverso del tiempo de media transformación.
    resolucion: |
      **La mitad es $y = 0{,}5$.** Despejando el tiempo con logaritmos:

      $$
      e^{-0{,}01\,t^{2}} = 0{,}5
      \;\Longrightarrow\;
      0{,}01\,t^{2} = \ln 2
      \;\Longrightarrow\;
      t_{0,5} = \sqrt{69{,}3} = 8{,}33\ \text{s}
      $$

      **Y la velocidad, por convenio, es su inverso:**

      $$
      v = \frac{1}{t_{0,5}} = 0{,}12\ \text{s}^{-1}
      $$

      Se toma la mitad y no el final porque la curva en S se acerca a 1 sin
      llegar nunca: el «final» no tiene un tiempo definido, y la mitad sí.

  - id: ejcm5-la-velocidad-que-da-martensita
    titulo: La velocidad que da martensita, y la que no llega
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, con las velocidades del
      resumen del Tema 5 de la asignatura para un acero eutectoide. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Según el resumen del tema, un acero eutectoide enfriado de forma continua
      da perlita por debajo de 35 °C/s, perlita y martensita entre 35 y
      140 °C/s, y solo martensita por encima de 140 °C/s. Una pieza de ese
      acero se enfría a 60 °C/s. ¿Qué microestructura tiene? ¿Cuál es la
      velocidad crítica de enfriamiento del acero?
    pide: La microestructura a 60 °C/s y la velocidad crítica.
    pasos:
      - tipo: reconocer
        pregunta: |
          A 60 °C/s, ¿qué se obtiene?
        opciones:
          - texto: Perlita y martensita, porque 60 está entre 35 y 140 °C/s
            correcta: true
            mensaje: |
              Exacto. La curva de enfriamiento corta la región de la perlita
              pero no la atraviesa entera: una parte de la austenita da
              perlita, y la que queda se transforma en martensita al bajar de
              la línea M.
          - texto: Solo martensita, porque es un enfriamiento rápido
            mensaje: |
              «Rápido» no basta: para que no se forme nada de perlita la curva
              tiene que pasar por delante de la nariz, y eso pide más de
              140 °C/s. A 60 °C/s la corta.
          - texto: Bainita, porque la velocidad es intermedia
            mensaje: |
              En un acero al carbono, el enfriamiento continuo no da bainita:
              la austenita que no ha dado perlita llega sin transformarse a la
              línea M. La bainita aparece en continuo en aceros aleados, como
              el 4340.

      - tipo: calcular
        titulo: La velocidad crítica
        pregunta: |
          ¿Cuál es la velocidad crítica de enfriamiento de este acero?
        respuesta:
          tipo: numero
          valor: '140'
          tolerancia: 1
          formato: en °C/s, solo el número
        distractores:
          - valor: '35'
            mensaje: |
              Esa es la velocidad por debajo de la cual todo es perlita. La
              crítica es la otra frontera: la **mínima** para que todo sea
              martensita.
          - valor: '60'
            mensaje: |
              Esa es la velocidad de la pieza, que da una mezcla. La crítica es
              la mínima que ya no deja formar nada de perlita.
        pista: |
          La velocidad crítica es la mínima que da martensita entera.
        desarrollo: |
          Por encima de 140 °C/s todo es martensita y por debajo ya aparece
          perlita: la velocidad crítica es **140 °C/s**.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'A 60 °C/s la curva de enfriamiento corta la región de la perlita sin atravesarla entera.'
          - texto: 'La austenita que no ha dado perlita se transforma en martensita al pasar la línea M.'
          - texto: 'La velocidad crítica es la mínima que da solo martensita: 140 °C/s.'
          - texto: 'La velocidad crítica es 35 °C/s, porque a partir de ahí ya empieza a salir martensita.'
            trampa: true
            mensaje: |
              A partir de 35 °C/s empieza a salir **algo** de martensita, pero
              la crítica es la que da martensita **entera**, sin nada de
              perlita: 140 °C/s. Es la que importa para templar.
    resolucion: |
      **A 60 °C/s sale perlita y martensita.** La velocidad está entre las dos
      fronteras del resumen: la curva de enfriamiento entra en la región de la
      perlita pero sale antes de que termine, y la austenita que queda llega a
      la línea M y da martensita.

      **La velocidad crítica es 140 °C/s**: la mínima que no deja formarse nada
      de perlita. En el diagrama de enfriamiento continuo es la curva que pasa
      rozando la nariz. Por encima, todo es martensita; por debajo, ya hay
      perlita.

      Los aceros aleados mueven la nariz hacia la derecha, y con ella esta
      velocidad hacia abajo: por eso se templan con menos agua, o en aceite.

  - id: ejcm5-col51-ocho-caminos-sobre-el-isotermico
    titulo: Ocho caminos sobre el diagrama isotérmico del acero de 1,13 % C
    fuente: >-
      Ejercicio 5.1 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      A partir del diagrama de transformación isotérmica para una aleación de
      acero con 1,13 % C, determine la microestructura final de una muestra que
      ha sido sometida a los siguientes tratamientos. En cada caso, suponga que
      la muestra comienza a 920 oC y que se ha mantenido a esta temperatura el
      tiempo suficiente para lograr una estructura austenítica completa y
      homogénea.

      a) Enfríe rápidamente a 250 °C, manténgalo durante 10³ s, luego témplelo
      hasta T ambiente.

      b) Enfríe rápidamente a 775 °C, manténgalo durante 500 s, luego témplelo
      hasta T ambiente.

      c) Enfríe rápidamente a 400 °C, manténgalo durante 500 s, luego témplelo
      hasta T ambiente.

      d) Enfríe rápidamente a 700 °C, manténgalo a esta T durante 10⁵ s, luego
      témplelo hasta T ambiente.

      e) Enfríe rápidamente a 650 °C, manténgalo a esta T durante 3 s, enfríelo
      rápidamente a 400 °C, manténgalo durante 25 s, luego témplelo hasta T
      ambiente.

      f) Enfríe rápidamente a 350 °C, manténgalo durante 300 s, luego témplelo
      hasta T ambiente.

      g) Enfríe rápidamente a 675 °C, manténgalo durante 7 s, luego témplelo
      hasta T ambiente.

      h) Enfríe rápidamente a 600 °C, manténgalo a esta T durante 7 s,
      enfríelo rápidamente a 450 °C, manténgalo a esta T durante 4 s, luego
      témplelo hasta T ambiente.
    pide: La microestructura final de cada uno de los ocho tratamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) Se mantiene a 250 °C durante 10³ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Martensita
            correcta: true
            mensaje: |
              Eso es. A 250 °C la curva de inicio de la bainita está hacia
              1,6·10³ s, un poco a la derecha de 10³: durante el tramo no se
              forma nada. Y 250 °C está por encima de M (inicio), 195 °C, así que
              tampoco martensita. Toda la austenita llega al temple.
          - texto: Bainita y martensita
            mensaje: |
              Has puesto la curva de inicio a la izquierda de 10³ s. En la
              escala logarítmica, a 250 °C está hacia 1,6·10³ s: por poco, pero
              10³ s no llega. Sin bainita, el temple lo hace todo martensita.
          - texto: Martensita revenida, porque ha pasado 10³ s a 250 °C
            mensaje: |
              Revenir es calentar una martensita que ya existe. Durante el
              tramo no hay martensita que revenir: 250 °C está por encima de
              M (inicio), y lo que hay es austenita esperando. La martensita sale
              después, en el temple, y nadie la calienta.

      - tipo: reconocer
        pregunta: |
          b) Se mantiene a 775 °C durante 500 s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Martensita y cementita proeutectoide
            correcta: true
            mensaje: |
              Eso es. 775 °C está por encima de 727 °C, en la región A + C. A
              esa temperatura la cementita proeutectoide empieza hacia 2 s, y en
              500 s sale. Perlita no puede salir por encima del eutectoide, así
              que la austenita que queda se templa y da martensita.
          - texto: Martensita
            mensaje: |
              Te olvidas de la región A + C, la de encima de la isoterma de
              727 °C. En un acero hipereutectoide ahí sale cementita
              proeutectoide, y a 775 °C empieza hacia los 2 s.
          - texto: Cementita proeutectoide y perlita gruesa
            mensaje: |
              La perlita sale de la reacción eutectoide, y a 775 °C estás por
              encima de 727 °C: no hay perlita posible. La austenita que no se
              ha hecho cementita solo puede acabar en martensita al templar.

      - tipo: reconocer
        pregunta: |
          c) Se mantiene a 400 °C durante 500 s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Bainita
            correcta: true
            mensaje: |
              Eso es. A 400 °C, por debajo de la línea discontinua de unos
              567 °C, sale bainita. Empieza hacia 2,4 s y termina hacia 115 s: a
              los 500 s no queda austenita, y el temple no encuentra nada que
              transformar.
          - texto: Bainita y martensita
            mensaje: |
              Eso pasaría templando antes de la curva de final. A 400 °C la
              bainita termina hacia 115 s, y 500 s queda bastante a la derecha:
              no queda austenita para la martensita.
          - texto: Perlita fina
            mensaje: |
              400 °C está por debajo de la línea discontinua de unos 567 °C que
              separa la perlita de la bainita. Por debajo de la nariz, la
              austenita da bainita.

      - tipo: reconocer
        pregunta: |
          d) Se mantiene a 700 °C durante 10⁵ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Perlita gruesa y cementita proeutectoide
            correcta: true
            mensaje: |
              Eso es. A 700 °C la cementita empieza hacia 0,6 s, la perlita
              hacia 8 s y todo termina hacia 140 s. 10⁵ s está muy a la
              derecha: no queda austenita. Y a 700 °C, entre 620 y 727 °C, la
              perlita sale gruesa.
          - texto: Perlita fina y cementita proeutectoide
            mensaje: |
              Fina o gruesa lo decide la temperatura. A 700 °C, cerca del
              eutectoide, la difusión es rápida y las láminas salen gruesas; la
              fina sale entre unos 540 y 620 °C.
          - texto: Perlita gruesa, cementita proeutectoide y martensita
            mensaje: |
              Para que haya martensita tiene que quedar austenita al templar. A
              700 °C la transformación termina hacia 140 s, y 10⁵ s es casi mil
              veces más.
          - texto: Esferoidita, porque son casi 28 horas a 700 °C
            mensaje: |
              La esferoidita no sale en el diagrama isotérmico: su cinética no
              está en él. Lo que el diagrama dice es perlita gruesa y cementita.
              Es verdad que 10⁵ s a 700 °C se parecen mucho a la receta de la
              esferoidita, unas 24 h a 700 °C; si en clase lo plantean así,
              pregúntalo, pero leyendo el diagrama la respuesta es la del
              listado.

      - tipo: reconocer
        pregunta: |
          e) 3 s a 650 °C, después 25 s a 400 °C, y temple. ¿Qué
          microestructura queda?
        opciones:
          - texto: Perlita gruesa, cementita proeutectoide, bainita y martensita
            correcta: true
            mensaje: |
              Eso es. A 650 °C la perlita empieza hacia 0,9 s y termina hacia
              5 s: a los 3 s hay cementita, algo de perlita gruesa y austenita. A
              400 °C esa austenita empieza a dar bainita hacia 2,4 s y va por la
              mitad hacia 20 s: a los 25 s queda algo sin transformar, y el
              temple la hace martensita.
          - texto: Perlita gruesa, cementita proeutectoide y martensita
            mensaje: |
              Te falta el tramo de 400 °C. Allí la bainita empieza hacia 2,4 s,
              y 25 s queda bastante a la derecha: parte de la austenita que
              quedaba se hace bainita.
          - texto: Perlita gruesa, cementita proeutectoide y bainita
            mensaje: |
              A 400 °C la bainita no termina hasta unos 115 s. A los 25 s apenas
              ha pasado la mitad, y la austenita que queda da martensita en el
              temple.
          - texto: Bainita y martensita
            mensaje: |
              Lo que se forma a 650 °C no se deshace al bajar. A los 3 s ya se
              ha cruzado la curva de inicio de la perlita, así que la perlita y
              la cementita se quedan hasta el final.

      - tipo: reconocer
        pregunta: |
          f) Se mantiene a 350 °C durante 300 s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Bainita y martensita
            correcta: true
            mensaje: |
              Eso es. A 350 °C la bainita empieza hacia 56 s, va por la mitad
              hacia 240 s y termina hacia 575 s. A los 300 s se ha pasado la
              mitad pero no el final: la austenita que queda se hace martensita.
          - texto: Bainita
            mensaje: |
              A 350 °C la curva de final está hacia 575 s, a la derecha de 300.
              Templar antes del final deja austenita, y la austenita da
              martensita.
          - texto: Martensita
            mensaje: |
              La curva de inicio a 350 °C está hacia 56 s, así que a los 300 s
              ya hay bainita, y más de la mitad.

      - tipo: reconocer
        pregunta: |
          g) Se mantiene a 675 °C durante 7 s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Perlita gruesa, cementita proeutectoide y martensita
            correcta: true
            mensaje: |
              Eso es. A 675 °C la cementita empieza hacia 0,5 s, la perlita
              hacia 2 s y todo termina hacia 13 s. A los 7 s se está en medio:
              hay cementita, perlita gruesa y austenita, y el temple hace
              martensita con la austenita.
          - texto: Perlita gruesa y cementita proeutectoide
            mensaje: |
              Eso sería habiendo cruzado la curva de final, y a 675 °C está
              hacia 13 s. Con 7 s queda austenita, y el temple la hace
              martensita.
          - texto: Cementita proeutectoide y martensita
            mensaje: |
              A 675 °C la perlita empieza hacia 2 s: a los 7 s ya ha empezado, y
              lo que se ha hecho perlita no se convierte en martensita.
          - texto: Perlita fina, cementita proeutectoide y martensita
            mensaje: |
              675 °C está por encima de 620 °C: la perlita sale gruesa. La fina
              es de más abajo, entre unos 540 y 620 °C.

      - tipo: reconocer
        pregunta: |
          h) 7 s a 600 °C, después 4 s a 450 °C, y temple. ¿Qué
          microestructura queda?
        opciones:
          - texto: Perlita fina y cementita proeutectoide
            correcta: true
            mensaje: |
              Eso es. A 600 °C todo termina hacia 1,9 s, así que a los 7 s no
              queda austenita. El tramo de 450 °C y el temple no encuentran nada
              que transformar. Y a 600 °C la perlita es fina.
          - texto: Perlita fina, cementita proeutectoide, bainita y martensita
            mensaje: |
              Es el camino de e) sin mirar el diagrama. A 600 °C la curva de
              final está hacia 1,9 s, y 7 s queda a su derecha: toda la
              austenita se ha transformado antes de bajar a 450 °C.
          - texto: Perlita gruesa y cementita proeutectoide
            mensaje: |
              600 °C está por debajo de 620 °C: la perlita sale fina. La gruesa
              se forma más cerca del eutectoide.

      - tipo: calcular
        titulo: Cuándo termina la transformación a 675 °C
        pregunta: |
          Para decidir el apartado g): a 675 °C, ¿cuánto tarda la
          transformación en llegar a la curva de final?
        respuesta:
          tipo: magnitud
          valor: '13 s'
          tolerancia: 0.4
          formato: un tiempo, con su unidad
        distractores:
          - valor: '2 s'
            mensaje: |
              Esa es la curva de inicio de la perlita. La de final es la última
              que corta la horizontal, hacia 13 s: la transformación tarda casi
              una década más en terminar que en empezar.
          - valor: '0.45 s'
            mensaje: |
              Esa es la curva de inicio de la cementita proeutectoide, la
              primera que se cruza. Lo primero que sale a 675 °C es cementita,
              pero la transformación termina en la curva de final, hacia 13 s.
        pista: |
          Traza la horizontal de 675 °C y síguela hasta la última curva que
          corta, la de final.
        desarrollo: |
          La horizontal de 675 °C corta la curva de la cementita hacia 0,45 s,
          la de inicio de la perlita hacia 2 s y la de final hacia
          $10^{1{,}1} \approx 13\ \text{s}$. Los 7 s de g) caen entre las dos
          últimas: la transformación está a medias. La escala es logarítmica, y
          la casilla acepta cualquier lectura razonable de esa curva.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado e). Una pieza es falsa.
        piezas:
          - texto: 'A 650 °C, a los 3 s se han cruzado el inicio de la cementita y el de la perlita, pero no el final: hay cementita, perlita gruesa y austenita.'
          - texto: 'Al bajar a 400 °C solo sigue transformándose la austenita que quedaba, ahora en bainita.'
          - texto: 'A los 25 s a 400 °C se ha pasado la mitad de la bainita, pero no el final, que está hacia 115 s.'
          - texto: 'El temple hace martensita con la austenita que queda: perlita gruesa, cementita, bainita y martensita.'
          - texto: 'Al bajar a 400 °C, la perlita formada a 650 °C se transforma en bainita, porque 400 °C es la temperatura de la bainita.'
            trampa: true
            mensaje: |
              Lo que ya se ha formado no se deshace. La bainita sale de la
              austenita, no de la perlita: a 400 °C la perlita y la cementita se
              quedan como están, y solo cambia la austenita que no se había
              transformado.
    resolucion: |
      **Cómo se lee cada camino.** Una bajada vertical, que no deja formar
      nada; un tramo horizontal, en el que se mira qué curvas se cruzan antes de
      que se acabe el tiempo; y el temple final, que hace martensita con toda
      la austenita que quede. Lo que se forma en un tramo no se deshace en el
      siguiente.

      Estas son las lecturas sobre el diagrama:

      | apartado | tramo | lo que se cruza | queda |
      |---|---|---|---|
      | a) | 250 °C, 10³ s | nada: la bainita empieza hacia 1,6·10³ s | M |
      | b) | 775 °C, 500 s | la cementita, hacia 2 s; perlita no hay por encima de 727 °C | M + C |
      | c) | 400 °C, 500 s | inicio y final de la bainita, hacia 2,4 y 115 s | B |
      | d) | 700 °C, 10⁵ s | cementita, perlita y final, hacia 140 s | P gruesa + C |
      | e), 1.º | 650 °C, 3 s | cementita y perlita, sin llegar al final (hacia 5 s) | P gruesa + C + austenita |
      | e), 2.º | 400 °C, 25 s | inicio y mitad de la bainita, hacia 2,4 y 20 s | + B, y el resto M |
      | f) | 350 °C, 300 s | inicio y mitad, sin llegar al final (hacia 575 s) | B + M |
      | g) | 675 °C, 7 s | cementita y perlita, sin llegar al final (hacia 13 s) | P gruesa + C + M |
      | h) | 600 °C, 7 s | todo: el final está hacia 1,9 s | P fina + C |

      Las ocho coinciden con el listado: a) M; b) M y C proeutectoide; c) B;
      d) P gruesa y C; e) P gruesa, C, B y M; f) B y M; g) P gruesa, C y M;
      h) P fina y C.

      **Fina o gruesa lo decide la temperatura del tramo**: gruesa entre unos
      620 y 727 °C, fina entre unos 540 y 620 °C. Por eso d), e) y g) dan
      gruesa y h) da fina.

      Los tiempos están leídos en escala logarítmica y son órdenes de magnitud.
      Lo que decide cada apartado no es la cifra exacta, sino de qué lado de
      una curva cae el tiempo del enunciado.

  - id: ejcm5-col52-cinco-tratamientos-para-el-acero-de-113
    titulo: Cinco tratamientos para el acero de 1,13 % C
    fuente: >-
      Ejercicio 5.2 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      A partir del diagrama de transformación isotérmica para una aleación de
      hierro-carbono con 1,13 % C, determine los tratamientos
      (temperatura-tiempo) para producir las siguientes microestructuras:

      a) Cementita proeutectoide y perlita gruesa.

      b) Esferoidita.

      c) Perlita fina y bainita.

      d) Martensita.

      e) Martensita revenida.
    pide: Un camino de temperatura y tiempo para cada una de las cinco microestructuras.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) ¿Qué tratamiento da cementita proeutectoide y perlita gruesa?
        opciones:
          - texto: Enfriar rápidamente a 700 °C, mantener 10³ s y enfriar hasta la temperatura ambiente
            correcta: true
            mensaje: |
              Eso es. A 700 °C la cementita empieza hacia 0,6 s, la perlita
              hacia 8 s y todo termina hacia 140 s. Con 10³ s se cruza la curva
              de final con margen, y a 700 °C la perlita sale gruesa. Después da
              igual cómo se enfríe: ya no queda austenita.
          - texto: Enfriar rápidamente a 700 °C, mantener 30 s y templar
            mensaje: |
              Es demasiado poco tiempo. A 700 °C la curva de final está hacia
              140 s: a los 30 s queda austenita, y el temple la hace martensita.
              Saldrían cementita, perlita gruesa y martensita.
          - texto: Enfriar rápidamente a 600 °C, mantener 10 s y enfriar
            mensaje: |
              A 600 °C todo se transforma, pero la perlita sale fina: está por
              debajo de 620 °C. La gruesa pide un tramo más cerca del
              eutectoide.
          - texto: Enfriar rápidamente a 775 °C, mantener 10³ s y templar
            mensaje: |
              A 775 °C, por encima de 727 °C, solo sale la cementita: la perlita
              no puede formarse por encima del eutectoide. El temple deja
              cementita y martensita, que es el apartado b) del 5.1.

      - tipo: reconocer
        pregunta: |
          b) ¿Cómo se consigue esferoidita?
        opciones:
          - texto: Conseguir primero perlita, como en a), y después calentarla a unos 700 °C durante un día
            correcta: true
            mensaje: |
              Eso es. La esferoidita no sale de la austenita: sale de la perlita
              o de la bainita, calentadas por debajo del eutectoide mucho
              tiempo, del orden de 700 °C durante 24 h. La cementita pasa de
              láminas a bolitas.
          - texto: Enfriar rápidamente a 700 °C y mantener 10³ s
            mensaje: |
              Ese es el tratamiento de a), y da perlita gruesa, en láminas. La
              esferoidita no tiene región propia en el diagrama isotérmico,
              porque su cinética no está en él: hace falta un segundo
              tratamiento, muy largo, sobre la perlita ya formada.
          - texto: Enfriar rápidamente a 400 °C y mantener 10³ s
            mensaje: |
              Eso da bainita, con la cementita en agujas finas. La bainita puede
              acabar en esferoidita, pero solo si después se calienta hacia
              700 °C durante mucho tiempo, y eso tampoco sale en el diagrama.

      - tipo: reconocer
        pregunta: |
          c) ¿Qué tratamiento da perlita fina y bainita?
        opciones:
          - texto: >-
              Enfriar rápidamente a 600 °C, mantener menos de 1 s, bajar
              rápidamente a 400 °C, mantener 10³ s y enfriar
            correcta: true
            mensaje: |
              Eso es. A 600 °C la perlita empieza hacia 0,4 s y termina hacia
              1,9 s: parando hacia 0,8 s, en la curva del 50 %, queda la mitad de
              perlita fina y la mitad de austenita. A 400 °C esa austenita da
              bainita, que termina hacia 115 s: con 10³ s no queda nada para el
              temple. En este acero, a 600 °C sale antes algo de cementita
              proeutectoide, como en el 5.1 h).
          - texto: >-
              Enfriar rápidamente a 600 °C, mantener 10 s, bajar a 400 °C y
              mantener 10³ s
            mensaje: |
              Es demasiado tiempo a 600 °C. La transformación termina allí hacia
              1,9 s: a los 10 s no queda austenita que bajar a 400 °C, y sale
              perlita fina con cementita, sin nada de bainita.
          - texto: >-
              Enfriar rápidamente a 600 °C, mantener 0,8 s, bajar a 400 °C,
              mantener 30 s y templar
            mensaje: |
              Templas antes de la curva de final. A 400 °C la bainita termina
              hacia 115 s: a los 30 s queda austenita, y el temple la hace
              martensita. Sobra una fase.
          - texto: >-
              Enfriar rápidamente a 400 °C, mantener 10³ s, subir a 600 °C y
              mantener 1 s
            mensaje: |
              El orden de los tramos importa. A 400 °C toda la austenita se hace
              bainita, y la bainita no se convierte en perlita al subir: la
              perlita solo sale de la austenita.

      - tipo: reconocer
        pregunta: |
          d) ¿Qué tratamiento da martensita?
        opciones:
          - texto: >-
              Enfriar sin detenerse desde 920 °C hasta la temperatura ambiente,
              tan deprisa que el camino pase a la izquierda de la nariz
            correcta: true
            mensaje: |
              Eso es. La nariz está hacia 0,3 s y unos 560 °C. Si la bajada no
              la toca, la austenita llega entera a M (inicio), 195 °C, y por
              debajo de M (90 %), 78 °C, casi toda es martensita.
          - texto: Enfriar rápidamente a 250 °C, mantener 10⁴ s y templar
            mensaje: |
              A 250 °C la bainita empieza hacia 1,6·10³ s y va por la mitad
              hacia 5·10³ s: con 10⁴ s sale sobre todo bainita, y solo el resto
              se hace martensita. Parando a 250 °C hay que templar antes de
              1,6·10³ s, como en el apartado a) del 5.1.
          - texto: Enfriar rápidamente a 700 °C, mantener 1 s y templar
            mensaje: |
              A 700 °C la cementita proeutectoide empieza hacia 0,6 s: con 1 s
              ya ha salido algo, y el resultado es martensita con cementita.

      - tipo: reconocer
        pregunta: |
          e) ¿Qué tratamiento da martensita revenida?
        opciones:
          - texto: >-
              Templar hasta martensita, como en d), calentarla entre unos 250 y
              650 °C durante un tiempo y enfriar
            correcta: true
            mensaje: |
              Eso es. Primero hace falta martensita, y después el revenido: al
              calentarla, el carbono atrapado se difunde y la martensita se
              separa en ferrita con partículas diminutas de cementita.
          - texto: >-
              Enfriar rápidamente a 400 °C y mantener 10³ s, que está dentro del
              intervalo del revenido
            mensaje: |
              400 °C está en el intervalo del revenido, pero revenir es
              calentar martensita. Llegando a 400 °C desde la austenita lo que
              sale es bainita: te has saltado el temple.
          - texto: Templar hasta martensita y calentarla a 800 °C
            mensaje: |
              Por encima de 727 °C la martensita vuelve a ser austenita (con
              cementita, en este acero): se deshace el temple. El revenido se
              hace por debajo del eutectoide, entre unos 250 y 650 °C.

      - tipo: calcular
        titulo: Cuánto hay que esperar a 700 °C
        pregunta: |
          Para el apartado a): a 700 °C, ¿cuánto tiempo hay que mantener como
          mínimo para que no quede austenita?
        respuesta:
          tipo: magnitud
          valor: '140 s'
          tolerancia: 0.4
          formato: un tiempo, con su unidad
        distractores:
          - valor: '8 s'
            mensaje: |
              Esa es la curva de inicio de la perlita. Para que no quede
              austenita hay que llegar a la de final, hacia 140 s; templando a
              los 8 s saldría casi todo martensita.
          - valor: '0.6 s'
            mensaje: |
              Esa es la curva de inicio de la cementita proeutectoide, la
              primera que se cruza. Ahí la transformación solo empieza.
        pista: |
          Traza la horizontal de 700 °C y síguela hasta la última curva que
          corta.
        desarrollo: |
          La horizontal de 700 °C corta la curva de la cementita hacia
          $10^{-0{,}24} \approx 0{,}6\ \text{s}$, la de inicio de la perlita
          hacia $10^{0{,}9} \approx 8\ \text{s}$ y la de final hacia
          $10^{2{,}15} \approx 140\ \text{s}$. Cualquier tiempo por encima vale,
          y 10³ s deja margen.

      - tipo: redactar
        que: deduccion
        consigna: |
          Escribe en el papel los cinco tratamientos como los pondrías en el
          examen, en diez o doce líneas. Para cada microestructura: a qué
          temperatura se lleva la austenita, cuánto tiempo se mantiene, cómo
          se termina y, en media frase, qué curva del diagrama decide ese
          tiempo. En b) y en e), además, qué hay que tener antes de empezar.
        rubrica:
          - punto: >-
              Todos los caminos empiezan con la austenita entera y homogénea y
              bajan de golpe hasta la temperatura del tramo
            porque: >-
              El diagrama isotérmico solo sirve para caminos de bajada vertical
              y tramo horizontal: así lo construye la diapositiva 10 del tema
              5, con un enfriamiento rápido que conserva la austenita y un
              tratamiento isotermo después. Un camino que baja despacio se lee
              en otro diagrama, el de enfriamiento continuo.
            minimo: true
          - punto: >-
              a) Un tramo por debajo de 727 °C y por encima de unos 620 °C,
              como 700 °C, mantenido hasta pasar la curva de final, y enfriar
            porque: >-
              La perlita gruesa sale entre unos 620 y 727 °C (diapositiva 11),
              y en un acero hipereutectoide como este, antes que la perlita
              sale la cementita proeutectoide (diapositiva 12). Si se templa
              antes de la curva de final, hacia 140 s a 700 °C, la austenita
              que queda se hace martensita y sobra una fase.
            minimo: true
          - punto: >-
              b) La esferoidita se consigue sobre una perlita o una bainita ya
              formadas, calentándolas por debajo del eutectoide mucho tiempo:
              del orden de 700 °C durante un día
            porque: >-
              Es el apartado que más se falla, porque se busca en el diagrama
              y no está: la diapositiva 14 dice que su cinética no se incluye
              en los diagramas de transformación isotérmica. Hace falta un
              segundo tratamiento, largo, sobre algo que ya existe.
            minimo: true
          - punto: >-
              c) Dos tramos, en este orden: uno entre unos 540 y 620 °C, como
              600 °C, cortado entre la curva de inicio de la perlita y la de
              final —a 600 °C, entre unos 0,4 y 1,9 s—, y otro en la zona de la
              bainita, como 400 °C, mantenido hasta pasar su curva de final,
              hacia 115 s
            porque: >-
              La perlita fina sale entre unos 540 y 620 °C (diapositiva 11) y
              la bainita por debajo de 540 °C (diapositiva 13). El primer tramo
              tiene dos topes: antes de unos 0,4 s no ha salido perlita, y
              pasados unos 1,9 s no queda austenita para la bainita. En este
              acero la curva de la cementita llega por debajo de 600 °C, así
              que en ese tramo sale antes algo de cementita proeutectoide, como
              en el apartado h) del 5.1: decirlo suma. Y el orden no se puede
              invertir: la perlita del primer tramo ya no se deshace al bajar,
              y si toda la austenita se ha hecho bainita no queda nada que dé
              perlita.
            minimo: true
          - punto: >-
              d) Enfriar sin detenerse desde la austenita hasta la temperatura
              ambiente, tan deprisa que la bajada pase a la izquierda de la
              nariz
            porque: >-
              La martensita sale al enfriar rápidamente la austenita por debajo
              de su línea M, tan deprisa que no da tiempo a la difusión del
              carbono (diapositiva 15). Si la bajada toca alguna curva de
              inicio, ya no sale martensita sola.
            minimo: true
          - punto: >-
              e) Primero la martensita de d), y después el revenido: calentarla
              entre unos 250 y 650 °C durante un tiempo, y enfriar
            porque: >-
              Revenir es calentar una martensita que ya existe (diapositiva
              23). Llevar la austenita directamente a 400 °C, que está dentro
              de ese intervalo, no da martensita revenida sino bainita.
            minimo: true
          - punto: >-
              Cada tiempo se justifica con la curva que cruza o que no debe
              cruzar: la de inicio, la del 50 % o la de final
            porque: >-
              «700 °C y 10³ s» a secas no dice si lo has leído o adivinado; «a
              700 °C la curva de final está hacia 140 s, y 10³ s la pasa con
              margen», sí. Los tiempos leídos en escala logarítmica admiten
              holgura; de qué lado de cada curva queda el camino, no.
        veredicto: |
          Si tienes los cinco caminos, cada uno con su temperatura, su tiempo y
          la curva que lo decide, y en b) y e) has dicho qué hace falta tener
          antes, la respuesta está completa. Si has buscado la esferoidita en
          el diagrama, vuelve a la diapositiva 14: no está ahí.

      - tipo: justificar
        pregunta: Ordena el tratamiento del apartado e). Una pieza es falsa.
        piezas:
          - texto: 'Primero martensita: enfriar desde 920 °C hasta la temperatura ambiente sin tocar ninguna curva.'
          - texto: 'Después el revenido: calentar la martensita entre unos 250 y 650 °C y mantenerla un tiempo.'
          - texto: 'El carbono atrapado se difunde y la martensita se separa en ferrita con partículas diminutas de cementita.'
          - texto: 'Basta con mantener la austenita a 400 °C, dentro del intervalo del revenido, para tener martensita revenida directamente.'
            trampa: true
            mensaje: |
              Revenir es calentar martensita, y a 400 °C la austenita no es
              martensita: da bainita. El intervalo de temperaturas coincide,
              pero el punto de partida no. Sin temple previo no hay nada que
              revenir.
    resolucion: |
      **Cómo se diseña un tratamiento.** Se elige la temperatura del tramo por
      lo que se quiere que salga, y el tiempo por las curvas que hay que
      cruzar, o que no hay que cruzar. Los tiempos están leídos en escala
      logarítmica y admiten margen; lo que no admite margen es de qué lado de
      cada curva se queda el camino.

      | microestructura | tratamiento | por qué |
      |---|---|---|
      | a) C proeutectoide y P gruesa | 700 °C, 10³ s, y enfriar | a 700 °C todo termina hacia 140 s, y la perlita sale gruesa |
      | b) Esferoidita | la perlita de a), y después unos 700 °C durante un día | la esferoidita sale de la perlita, no de la austenita |
      | c) P fina y B | 600 °C menos de 1 s, 400 °C 10³ s, y enfriar | a 600 °C la perlita termina hacia 1,9 s; a 400 °C la bainita, hacia 115 s |
      | d) Martensita | de 920 °C a temperatura ambiente sin parar | la bajada pasa a la izquierda de la nariz, hacia 0,3 s |
      | e) Martensita revenida | la martensita de d), y después 250 a 650 °C un tiempo | el revenido calienta una martensita que ya existe |

      **Dos matices de c).** El tiempo a 600 °C decide el reparto: parando en
      la curva del 50 %, hacia 0,8 s, sale mitad y mitad. Y a 600 °C la curva de
      la cementita proeutectoide va una décima de segundo por delante de la de
      la perlita, así que en rigor aparece una pizca de cementita que el
      enunciado no nombra. En este acero no hay forma de evitarla por encima de
      la nariz.

      **El error más común es el de b)**: buscar la esferoidita en el
      diagrama. No está, porque su cinética no se dibuja en él. Se consigue
      con un segundo tratamiento, largo y por debajo del eutectoide, sobre una
      perlita o una bainita que ya existen.

  - id: ejcm5-col53-cinco-caminos-sobre-el-4340
    titulo: Cinco caminos sobre el diagrama isotérmico del acero 4340
    fuente: >-
      Ejercicio 5.3 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      A partir del diagrama de transformación isotérmica para un acero aleado
      (tipo 4340), determine la microestructura final de una muestra que ha
      sido sometida a los siguientes tratamientos. En cada caso, suponga que la
      muestra comienza a 920 oC y que se ha mantenido a esta temperatura el
      tiempo suficiente para lograr una estructura austenítica completa y
      homogénea.

      a) Enfríe rápidamente a 600 o, manténgalo durante 10⁵ s, luego témplelo
      hasta temperatura ambiente.

      b) Enfríe rápidamente a 400 oC, manténgalo durante 10⁶ s, luego témplelo
      hasta temperatura ambiente.

      c) Enfríe rápidamente a 400 oC, manténgalo durante 10³ s, luego témplelo
      hasta temperatura ambiente.

      d) Enfríe rápidamente a 300 oC, manténgalo a esta temperatura durante
      10 s, luego témplelo hasta temperatura ambiente.

      e) Enfríe rápidamente a 600 oC, manténgalo a esta temperatura durante
      10⁴ s, luego témplelo hasta temperatura ambiente.
    pide: La microestructura final de cada uno de los cinco tratamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) Se mantiene a 600 °C durante 10⁵ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Ferrita proeutectoide y perlita fina
            correcta: true
            mensaje: |
              Eso es. A 600 °C la ferrita empieza hacia 8·10² s, la perlita
              hacia 3,7·10³ s y todo termina hacia 4·10⁴ s. 10⁵ s cruza la curva
              de final: no queda austenita y el temple no hace nada. El 4340
              tiene 0,40 % C, menos que el eutectoide, y por eso lo proeutectoide
              es ferrita.
          - texto: Cementita proeutectoide y perlita fina
            mensaje: |
              Eso sería el acero de 1,13 % C del 5.1. El 4340 tiene 0,40 % C,
              menos que el eutectoide, y lo que sale antes de la perlita es
              ferrita: la región del diagrama se llama A + F.
          - texto: Ferrita proeutectoide, perlita fina y martensita
            mensaje: |
              Eso es el apartado e), con 10⁴ s. Con 10⁵ s se ha cruzado la curva
              de final, hacia 4·10⁴ s, y no queda austenita para el temple.

      - tipo: reconocer
        pregunta: |
          b) Se mantiene a 400 °C durante 10⁶ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Bainita
            correcta: true
            mensaje: |
              Eso es, aunque por poco. A 400 °C la bainita empieza hacia 22 s y
              va por la mitad hacia 350 s, y la curva de final se tumba hacia
              los 400 °C: a esa temperatura se cruza hacia 7·10⁵ s. 10⁶ s queda
              justo a la derecha, así que prácticamente todo es bainita.
          - texto: Bainita y martensita
            mensaje: |
              Por poco no. La curva de final de la bainita se acerca a 400 °C
              casi en horizontal, y a esa temperatura se cruza hacia 7·10⁵ s, a
              la izquierda de 10⁶ s. Con 10³ s, el apartado c), sí quedaría
              martensita.
          - texto: Perlita fina
            mensaje: |
              400 °C está muy por debajo de la región de la perlita, que en este
              acero se queda por encima de unos 500 °C. Aquí manda la nariz de
              abajo, la de la bainita.

      - tipo: reconocer
        pregunta: |
          c) Se mantiene a 400 °C durante 10³ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Bainita y martensita
            correcta: true
            mensaje: |
              Eso es. La bainita empieza hacia 22 s y va por la mitad hacia
              350 s: a los 10³ s hay algo más de la mitad transformada, y la
              curva de final está a cientos de miles de segundos. La austenita
              que queda se hace martensita en el temple.
          - texto: Bainita
            mensaje: |
              Eso es el apartado b), con 10⁶ s. A 400 °C la curva de final está
              hacia 7·10⁵ s: con 10³ s queda casi la mitad de austenita, y el
              temple la hace martensita.
          - texto: Martensita
            mensaje: |
              La curva de inicio a 400 °C está hacia 22 s: a los 10³ s se ha
              pasado de largo, y más de la mitad es bainita.

      - tipo: reconocer
        pregunta: |
          d) Se mantiene a 300 °C durante 10 s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Martensita
            correcta: true
            mensaje: |
              Eso es. A 300 °C la bainita no empieza hasta unos 40 s, así que en
              10 s no se forma nada; y 300 °C está por encima de M (inicio), unos
              287 °C, así que tampoco martensita. Toda la austenita llega al
              temple.
          - texto: Bainita y martensita
            mensaje: |
              A 300 °C la curva de inicio de la bainita está hacia 40 s. 10 s
              queda a su izquierda: durante el tramo no se forma nada.
          - texto: Bainita, porque 300 °C es temperatura de bainita
            mensaje: |
              Estar a la temperatura de la bainita no basta: hay que esperar a
              que el camino cruce la curva de inicio, y a 300 °C está hacia
              40 s. En 10 s no da tiempo.

      - tipo: reconocer
        pregunta: |
          e) Se mantiene a 600 °C durante 10⁴ s y se templa. ¿Qué
          microestructura queda?
        opciones:
          - texto: Ferrita proeutectoide, perlita fina y martensita
            correcta: true
            mensaje: |
              Eso es. A 600 °C la ferrita empieza hacia 8·10² s y la perlita
              hacia 3,7·10³ s; la curva del 50 % está hacia 1,7·10⁴ s y la de
              final hacia 4·10⁴ s. A los 10⁴ s hay ferrita, algo de perlita y
              más de la mitad de austenita, que el temple hace martensita.
          - texto: Ferrita proeutectoide y martensita
            mensaje: |
              A 600 °C la perlita empieza hacia 3,7·10³ s, y 10⁴ s ya lo ha
              pasado. Ferrita y martensita saldrían parando antes, entre 8·10²
              y 3,7·10³ s.
          - texto: Ferrita proeutectoide y perlita fina
            mensaje: |
              Eso sería cruzada la curva de final, hacia 4·10⁴ s: es el apartado
              a). Con 10⁴ s ni siquiera se ha llegado a la mitad.

      - tipo: calcular
        titulo: Dónde empieza la martensita del 4340
        pregunta: |
          Para el apartado d): ¿a qué temperatura empieza a formarse la
          martensita en este acero?
        respuesta:
          tipo: magnitud
          valor: '287 °C'
          tolerancia: 0.018
          formato: una temperatura, con su unidad
        distractores:
          - valor: '195 °C'
            mensaje: |
              Esa es la M (inicio) del acero de 1,13 % C del 5.1. Cada acero trae
              su propia línea, y en el 4340 está más arriba, hacia 287 °C.
          - valor: '215 °C'
            mensaje: |
              Ese es el valor del resumen del tema, que es del acero eutectoide
              al carbono. En el 4340 la línea M (inicio) está hacia 287 °C: se lee
              en su diagrama, no en el resumen.
          - valor: '242 °C'
            mensaje: |
              Esa es M (50 %), la temperatura a la que ya es martensita la mitad.
              La que marca el inicio es la línea de arriba, M (inicio).
        pista: |
          Busca la horizontal rotulada M (inicio), la más alta de las tres.
        desarrollo: |
          La línea M (inicio) del 4340 está hacia 287 °C, con M (50 %) hacia
          242 °C y M (90 %) hacia 210 °C. El tramo de d) está a 300 °C, por
          encima: durante él la austenita no se hace martensita.

      - tipo: calcular
        titulo: Cuándo termina la transformación a 600 °C
        pregunta: |
          Para los apartados a) y e): a 600 °C, ¿cuánto tarda la transformación
          en llegar a la curva de final?
        respuesta:
          tipo: magnitud
          valor: '43000 s'
          tolerancia: 0.4
          formato: un tiempo, con su unidad
        distractores:
          - valor: '800 s'
            mensaje: |
              Esa es la curva de inicio de la ferrita, la primera que se cruza.
              Ahí la transformación solo empieza.
          - valor: '3700 s'
            mensaje: |
              Esa es la curva de inicio de la perlita, la segunda. La de final
              es la última que corta la horizontal, hacia 4·10⁴ s.
          - valor: '17000 s'
            mensaje: |
              Esa es la curva discontinua del 50 %. A ese tiempo queda la mitad
              de austenita; el final está algo más a la derecha, hacia 4·10⁴ s.
        pista: |
          Traza la horizontal de 600 °C y síguela hasta la última curva que
          corta.
        desarrollo: |
          La horizontal de 600 °C corta la curva de la ferrita hacia
          $8 \cdot 10^{2}\ \text{s}$, la de la perlita hacia
          $3{,}7 \cdot 10^{3}\ \text{s}$, la del 50 % hacia
          $1{,}7 \cdot 10^{4}\ \text{s}$ y la de final hacia
          $10^{4{,}6} \approx 4 \cdot 10^{4}\ \text{s}$. Los 10⁵ s de a) quedan a
          la derecha del final; los 10⁴ s de e), a la izquierda del 50 %.

      - tipo: justificar
        pregunta: Ordena por qué c) y b) no dan lo mismo aunque se hagan a la misma temperatura. Una pieza es falsa.
        piezas:
          - texto: 'A 400 °C la bainita empieza hacia 22 s y va por la mitad hacia 350 s.'
          - texto: 'La curva de final se tumba hacia los 400 °C, y a esa temperatura no se cruza hasta unos 7·10⁵ s.'
          - texto: 'Con 10³ s queda casi la mitad de austenita, que el temple hace martensita: bainita y martensita.'
          - texto: 'Con 10⁶ s se ha cruzado la curva de final: prácticamente todo es bainita.'
          - texto: 'Una vez cruzada la curva de inicio, toda la austenita acaba en bainita aunque se temple enseguida.'
            trampa: true
            mensaje: |
              Cruzar la curva de inicio solo dice que la transformación ha
              empezado. La austenita que no ha tenido tiempo de transformarse
              cuando llega el temple se hace martensita: por eso importa dónde
              está la curva de final.
    resolucion: |
      **El 4340 se lee igual que el acero al carbono, con dos diferencias.**
      Tiene 0,40 % C, así que lo proeutectoide es **ferrita** y no cementita; y
      sus curvas están mucho más a la derecha, con dos narices separadas: la de
      la ferrita y la perlita arriba, la de la bainita abajo.

      | apartado | tramo | lo que se cruza | queda |
      |---|---|---|---|
      | a) | 600 °C, 10⁵ s | ferrita (8·10² s), perlita (3,7·10³ s) y final (4·10⁴ s) | F + P fina |
      | b) | 400 °C, 10⁶ s | inicio (22 s), mitad (350 s) y final (7·10⁵ s) | B |
      | c) | 400 °C, 10³ s | inicio y mitad, sin llegar al final | B + M |
      | d) | 300 °C, 10 s | nada: la bainita empieza hacia 40 s | M |
      | e) | 600 °C, 10⁴ s | ferrita y perlita, sin llegar al 50 % (1,7·10⁴ s) | F + P fina + M |

      **b) está en el filo.** La curva de final de la bainita se acerca a
      400 °C casi en horizontal, y a esa temperatura se cruza hacia 7·10⁵ s,
      muy cerca de 10⁶ s. La lectura da bainita, pero con poco margen: basta
      que la curva esté un par de grados más abajo para que quede algo de
      martensita. Si lo ves resuelto de otra forma en clase, es por eso.

      **d) enseña para qué sirve M (inicio).** A 300 °C el tramo no forma nada,
      ni bainita, que empieza hacia 40 s, ni martensita, porque 300 °C está por
      encima de M (inicio), unos 287 °C. Toda la austenita llega al temple.

      La colección no imprime resultado; esta resolución es nuestra. Los
      tiempos están leídos sobre el diagrama, en escala logarítmica.

  - id: ejcm5-col54-cinco-tratamientos-para-el-4340
    titulo: Cinco tratamientos para el acero 4340
    fuente: >-
      Ejercicio 5.4 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      A partir del diagrama de transformación isotérmica para un acero aleado
      (tipo 4340), determine los tratamientos (temperatura-tiempo) para
      producir las siguientes microestructuras:

      a) Ferrita y perlita fina.

      b) Ferrita, perlita fina y martensita.

      c) Bainita.

      d) Ferrita y martensita.

      e) Ferrita y bainita.
    pide: Un camino de temperatura y tiempo para cada una de las cinco microestructuras.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) ¿Qué tratamiento da ferrita y perlita fina?
        opciones:
          - texto: Enfriar rápidamente a 600 °C, mantener 10⁵ s y enfriar hasta la temperatura ambiente
            correcta: true
            mensaje: |
              Eso es. A 600 °C la ferrita empieza hacia 8·10² s, la perlita
              hacia 3,7·10³ s y todo termina hacia 4·10⁴ s. Con 10⁵ s no queda
              austenita, y el enfriamiento final no forma nada. Es el apartado
              a) del 5.3.
          - texto: Enfriar rápidamente a 600 °C, mantener 10⁴ s y templar
            mensaje: |
              Es poco tiempo. A 10⁴ s ni se ha llegado al 50 %, y la austenita
              que queda se hace martensita: ferrita, perlita y martensita, que
              es el apartado b).
          - texto: Enfriar rápidamente a 400 °C y mantener 10⁶ s
            mensaje: |
              A 400 °C estás en la nariz de abajo, la de la bainita. La ferrita
              y la perlita salen en la de arriba, por encima de unos 550 °C.

      - tipo: reconocer
        pregunta: |
          b) ¿Qué tratamiento da ferrita, perlita fina y martensita?
        opciones:
          - texto: Enfriar rápidamente a 600 °C, mantener 10⁴ s y templar
            correcta: true
            mensaje: |
              Eso es. A 600 °C el tramo cruza el inicio de la ferrita, hacia
              8·10² s, y el de la perlita, hacia 3,7·10³ s, pero no el final,
              hacia 4·10⁴ s. El temple convierte en martensita la austenita que
              queda. Es el apartado e) del 5.3.
          - texto: Enfriar rápidamente a 600 °C, mantener 2·10³ s y templar
            mensaje: |
              A 600 °C la perlita no empieza hasta unos 3,7·10³ s: con 2·10³ s
              solo ha salido ferrita, y el temple da ferrita y martensita. Es
              el tratamiento de d).
          - texto: Enfriar rápidamente a 600 °C, mantener 10⁵ s y templar
            mensaje: |
              Con 10⁵ s se cruza la curva de final, hacia 4·10⁴ s, y ya no queda
              austenita. El temple no encuentra nada que convertir en
              martensita.

      - tipo: reconocer
        pregunta: |
          c) ¿Qué tratamiento da bainita?
        opciones:
          - texto: Enfriar rápidamente a 350 °C, mantener 10⁴ s y enfriar hasta la temperatura ambiente
            correcta: true
            mensaje: |
              Eso es. A 350 °C la bainita empieza hacia 34 s y termina hacia
              2·10³ s: con 10⁴ s no queda austenita, y el enfriamiento final no
              forma martensita.
          - texto: Enfriar rápidamente a 400 °C, mantener 10³ s y templar
            mensaje: |
              Templas antes de la curva de final. A 400 °C la bainita apenas ha
              pasado la mitad a los 10³ s, y el temple deja martensita: es el
              apartado c) del 5.3.
          - texto: Enfriar rápidamente a 450 °C y mantener 10⁶ s
            mensaje: |
              A 450 °C la bainita llega a la mitad hacia 5·10² s, pero la curva
              de final no llega a esa temperatura: se queda por debajo de unos
              400 °C. Ni con 10⁶ s se termina, y el temple deja martensita.
          - texto: Enfriar rápidamente a 250 °C y mantener 10⁴ s
            mensaje: |
              250 °C está por debajo de M (inicio), unos 287 °C: al llegar ya se
              ha hecho martensita una parte de la austenita, y la martensita no
              se deshace esperando.

      - tipo: reconocer
        pregunta: |
          d) ¿Qué tratamiento da ferrita y martensita?
        opciones:
          - texto: Enfriar rápidamente a 650 °C, mantener 10³ s y templar
            correcta: true
            mensaje: |
              Eso es. A 650 °C la ferrita empieza hacia 2·10² s y la perlita no
              empieza hasta unos 3,5·10³ s. Con 10³ s ha salido ferrita y nada
              de perlita, y el temple hace martensita con el resto.
          - texto: Enfriar rápidamente a 650 °C, mantener 10⁴ s y templar
            mensaje: |
              Te pasas de tiempo. A 650 °C la perlita empieza hacia 3,5·10³ s:
              con 10⁴ s ya hay perlita, y sale ferrita, perlita y martensita.
          - texto: Enfriar rápidamente a 650 °C, mantener 100 s y templar
            mensaje: |
              Te quedas corto. A 650 °C la ferrita no empieza hasta unos
              2·10² s: con 100 s no ha salido nada, y el temple lo hace todo
              martensita.

      - tipo: reconocer
        pregunta: |
          e) ¿Qué tratamiento da ferrita y bainita?
        opciones:
          - texto: >-
              Enfriar rápidamente a 650 °C, mantener 10³ s, bajar rápidamente a
              350 °C, mantener 10⁴ s y enfriar
            correcta: true
            mensaje: |
              Eso es. El primer tramo es el de d): solo ferrita. A 350 °C la
              austenita que queda da bainita, que termina hacia 2·10³ s: con
              10⁴ s no queda nada para la martensita.
          - texto: >-
              Enfriar rápidamente a 650 °C, mantener 10³ s, bajar a 350 °C,
              mantener 100 s y templar
            mensaje: |
              Templas antes de la curva de final. A 350 °C la bainita termina
              hacia 2·10³ s: con 100 s queda austenita, y sale ferrita, bainita
              y martensita.
          - texto: >-
              Enfriar rápidamente a 350 °C, mantener 10⁴ s, subir a 650 °C y
              mantener 10³ s
            mensaje: |
              El orden importa. La ferrita tiene que salir de la austenita, y a
              350 °C toda la austenita se ha hecho bainita. Al subir a 650 °C ya
              no hay austenita que dé ferrita.

      - tipo: calcular
        titulo: El tiempo que cabe a 650 °C
        pregunta: |
          Para el apartado d): a 650 °C, ¿cuánto tiempo se puede mantener como
          máximo antes de que empiece la perlita?
        respuesta:
          tipo: magnitud
          valor: '3500 s'
          tolerancia: 0.4
          formato: un tiempo, con su unidad
        distractores:
          - valor: '200 s'
            mensaje: |
              Esa es la curva de inicio de la ferrita: el tiempo **mínimo**,
              el que hace falta para que salga algo de ferrita. El máximo es
              la curva siguiente, la de la perlita, hacia 3,5·10³ s.
          - valor: '13000 s'
            mensaje: |
              Esa es la curva de final, la última que corta la horizontal. Para
              entonces ya hay perlita: la que manda en d) es la de inicio de la
              perlita, hacia 3,5·10³ s.
        pista: |
          Traza la horizontal de 650 °C. Corta primero la curva de la ferrita y
          después la de la perlita: el tramo tiene que acabar entre las dos.
        desarrollo: |
          A 650 °C la ferrita empieza hacia $10^{2{,}3} \approx 2 \cdot 10^{2}\ \text{s}$,
          la perlita hacia $10^{3{,}5} \approx 3{,}5 \cdot 10^{3}\ \text{s}$ y
          la transformación termina hacia $1{,}3 \cdot 10^{4}\ \text{s}$. Para
          ferrita y martensita, el temple tiene que llegar entre la primera y la
          segunda: 10³ s va bien.

      - tipo: redactar
        que: deduccion
        consigna: |
          Escribe los cinco tratamientos para el 4340 como en el examen, en
          diez o doce líneas: para cada microestructura, la temperatura del
          tramo o de los tramos, cuánto se mantiene cada uno, cómo se termina
          —enfriando o templando— y qué curva decide cada tiempo.
        rubrica:
          - punto: >-
              Dices qué tiene de distinto este acero: con 0,40 % de C lo
              proeutectoide es ferrita, y su diagrama tiene dos narices, la de
              la ferrita y la perlita arriba y la de la bainita abajo
            porque: >-
              Es lo que decide en qué zona va cada tramo. El 0,40 % de C lo da
              la diapositiva 20 del tema 5, que dice también que los elementos
              de aleación cambian la forma de las curvas. En el isotérmico del
              4340 la C del acero al carbono (diapositiva 13) se parte en dos
              narices separadas. Quien lee el 4340 como el acero de 1,13 % C
              busca cementita donde sale ferrita.
            minimo: true
          - punto: >-
              a) Un tramo en la nariz de arriba, como 600 °C, mantenido hasta
              pasar la curva de final, hacia 4·10⁴ s —por ejemplo 10⁵ s—, y
              enfriar
            porque: >-
              Pasada la curva de final no queda austenita, y el enfriamiento
              del final no forma nada. Con menos tiempo quedaría austenita, y
              eso es el apartado b).
            minimo: true
          - punto: >-
              b) El mismo tramo, cortado entre el inicio de la perlita, hacia
              3,7·10³ s, y la curva de final —por ejemplo 10⁴ s—, y templar
            porque: >-
              La martensita sale de la austenita que queda sin transformar
              cuando llega el temple (diapositiva 15). Hace falta que ya haya
              ferrita y perlita y que todavía quede austenita.
            minimo: true
          - punto: >-
              c) Un tramo en la nariz de abajo, por encima de la línea M
              (inicio), que en este acero está hacia 287 °C: por ejemplo
              350 °C, mantenido hasta pasar la curva de final de la bainita,
              hacia 2·10³ s
            porque: >-
              La curva de final de la bainita se tumba hacia los 400 °C: a
              400 °C tarda del orden de 7·10⁵ s y a 450 °C no se llega a
              cruzar. Y por debajo de M (inicio) parte de la austenita se hace
              martensita al llegar, y esa martensita ya no se convierte en
              bainita por mucho que se espere.
            minimo: true
          - punto: >-
              d) Un tramo en la nariz de arriba cortado entre el inicio de la
              ferrita y el de la perlita —a 650 °C, entre unos 2·10² y
              3,5·10³ s, por ejemplo 10³ s— y templar
            porque: >-
              Es el apartado donde el tiempo tiene dos topes: el mínimo, para
              que salga ferrita, y el máximo, para que no empiece la perlita.
              El temple convierte el resto en martensita.
            minimo: true
          - punto: >-
              e) Dos tramos, en este orden: el de d) sin templar, y después
              bajar rápido a la nariz de abajo, como 350 °C, y mantener hasta
              pasar el final de la bainita
            porque: >-
              La ferrita y la bainita salen las dos de la austenita, así que el
              orden no se puede invertir: con el tramo de 350 °C primero, toda
              la austenita se haría bainita y al subir no quedaría nada que
              diera ferrita.
            minimo: true
          - punto: >-
              Dices que hay más de un tratamiento válido para cada apartado
            porque: >-
              Vale cualquier temperatura y tiempo que crucen las mismas curvas.
              Decirlo enseña que sabes qué decide el resultado, y te cubre si
              tu temperatura no es la de la solución de clase.
        veredicto: |
          Si cada apartado tiene su tramo en la nariz que toca, su tiempo
          justificado con una curva y el final bien elegido —enfriar o
          templar—, está completo. El fallo que más cuesta es el de c):
          quedarse a 450 °C, donde la curva de final de la bainita no llega, o
          a 400 °C sin esperar a cruzarla, hacia 7·10⁵ s. A 400 °C con 10⁶ s
          sí vale: es el apartado b) del 5.3.

      - tipo: justificar
        pregunta: Ordena el tratamiento del apartado e). Una pieza es falsa.
        piezas:
          - texto: 'A 650 °C la ferrita empieza hacia 2·10² s y la perlita hacia 3,5·10³ s: con 10³ s sale solo ferrita.'
          - texto: 'Se baja rápidamente a 350 °C, y la austenita que queda empieza a dar bainita.'
          - texto: 'A 350 °C la bainita termina hacia 2·10³ s: con 10⁴ s no queda austenita, y el enfriamiento final no forma martensita.'
          - texto: 'El orden da igual: bainita primero a 350 °C y ferrita después a 650 °C da el mismo resultado.'
            trampa: true
            mensaje: |
              La ferrita y la bainita salen las dos de la austenita. Si se hace
              primero el tramo de 350 °C, toda la austenita se hace bainita, y
              al subir a 650 °C no queda austenita para la ferrita.
    resolucion: |
      **Se elige la nariz y después el tiempo.** La de arriba da ferrita y
      perlita, la de abajo bainita; y el temple convierte en martensita lo que
      quede de austenita.

      | microestructura | tratamiento | por qué |
      |---|---|---|
      | a) F y P fina | 600 °C, 10⁵ s, y enfriar | se cruza el final, hacia 4·10⁴ s |
      | b) F, P fina y M | 600 °C, 10⁴ s, y templar | entre el inicio de la perlita (3,7·10³ s) y el final |
      | c) B | 350 °C, 10⁴ s, y enfriar | a 350 °C la bainita termina hacia 2·10³ s |
      | d) F y M | 650 °C, 10³ s, y templar | entre la ferrita (2·10² s) y la perlita (3,5·10³ s) |
      | e) F y B | 650 °C 10³ s, 350 °C 10⁴ s, y enfriar | ferrita arriba; el resto, bainita abajo |

      **La bainita entera pide bajar.** La curva de final de la bainita se
      tumba hacia 400 °C: a 400 °C tarda unos 7·10⁵ s y a 450 °C no llega
      nunca. Por eso c) y e) se hacen a 350 °C, donde termina en un par de
      miles de segundos.

      **a) y b) son el 5.3 al revés**: a) es su apartado a) y b) su apartado
      e). Y d) y e) comparten el primer tramo, porque en los dos hace falta
      ferrita sin perlita.

      Hay más de un tratamiento válido para cada apartado: vale cualquier
      temperatura y tiempo que crucen las mismas curvas. Los de la tabla son
      unos de tantos. La colección no imprime resultado; esta resolución es
      nuestra.

  - id: ejcm5-col55-cinco-curvas-de-enfriamiento
    titulo: Cinco curvas de enfriamiento sobre el acero de 1,13 % C
    fuente: >-
      Ejercicio 5.5 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. El listado publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dado el diagrama de enfriamiento continuo para un acero con 1,13 % C,
      indique la microestructura que se obtendría con cada una de las curvas de
      enfriamiento dibujadas.

      a) Perlita fina y cementita proeutectoide

      b) Martensita

      c) Martensita y cementita proeutectoide

      d) Perlita gruesa y cementita proeutectoide

      e) Martensita, cementita proeutectoide y perlita fina
    pide: >-
      Qué curva da cada una de las cinco microestructuras. En la figura del
      tema las curvas van numeradas del 1, la más rápida, al 5, la más lenta;
      el original no las numera.
    pasos:
      - tipo: reconocer
        pregunta: |
          Una curva de enfriamiento entra en la región de la perlita y sale por
          abajo sin cruzar la curva de final. ¿Qué le pasa a la austenita que
          queda?
        opciones:
          - texto: Sigue siendo austenita hasta la línea M, y allí se hace martensita
            correcta: true
            mensaje: |
              Eso es. En un acero al carbono enfriado de forma continua no se
              forma bainita: la austenita que no ha dado perlita espera sin
              transformarse hasta la línea M.
          - texto: Se hace bainita al bajar de unos 540 °C
            mensaje: |
              En enfriamiento continuo un acero al carbono no da bainita: el
              diagrama no tiene región de bainita. La bainita en continuo es
              cosa de los aceros aleados, como el 4340 del 5.6.
          - texto: Se hace perlita de todas formas, porque la transformación ya había empezado
            mensaje: |
              Empezar no es terminar. Si la curva sale de la región de la
              perlita antes de cruzar la de final, la austenita que queda ya no
              está a temperatura de dar perlita y espera a la línea M.

      - tipo: calcular
        titulo: Qué curva da el apartado a)
        pregunta: |
          ¿Qué curva da a) perlita fina y cementita proeutectoide?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.1
          formato: un número entero del 1 al 5
        distractores:
          - valor: '5'
            mensaje: |
              La curva 5 también da perlita y cementita, pero forma la perlita
              arriba, entre unos 690 y 660 °C, y ahí sale gruesa: es la del
              apartado d).
          - valor: '3'
            mensaje: |
              La curva 3 entra en la región de la perlita pero sale sin cruzar
              la curva de final: queda austenita, que da martensita. Es la del
              apartado e).
        pista: |
          Busca la curva que cruza la curva de final de la perlita, y mira a
          qué temperatura lo hace.
        desarrollo: |
          La curva 4 cruza la de la cementita, entra en la región de la perlita
          hacia 625 °C y cruza la curva de final hacia 550 °C: no queda
          austenita. A esas temperaturas la perlita sale fina.

      - tipo: calcular
        titulo: Qué curva da el apartado b)
        pregunta: |
          ¿Qué curva da b) martensita?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: un número entero del 1 al 5
        distractores:
          - valor: '2'
            mensaje: |
              La curva 2 toca la curva de la cementita proeutectoide antes de
              llegar abajo: da cementita además de martensita. Es la del
              apartado c).
        pista: |
          Busca la curva que llega a la línea M sin tocar ninguna curva de
          transformación.
        desarrollo: |
          La curva 1 es la más rápida y pasa a la izquierda de todas las
          curvas de transformación: la austenita llega entera a la línea M y
          toda se hace martensita.

      - tipo: calcular
        titulo: Qué curva da el apartado c)
        pregunta: |
          ¿Qué curva da c) martensita y cementita proeutectoide?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número entero del 1 al 5
        distractores:
          - valor: '1'
            mensaje: |
              La curva 1 no toca ninguna curva de transformación: no da nada de
              cementita, solo martensita.
          - valor: '3'
            mensaje: |
              La curva 3 cruza la curva de la cementita, pero además entra en
              la región de la perlita: da también perlita fina.
        pista: |
          Busca la curva que cruza la de la cementita proeutectoide y no llega
          a la de inicio de la perlita.
        desarrollo: |
          La curva 2 corta la curva de inicio de la cementita cerca de la
          nariz y pasa rozando la de la perlita sin entrar. Sale algo de
          cementita, y la austenita que queda llega a la línea M.

      - tipo: calcular
        titulo: Qué curva da el apartado d)
        pregunta: |
          ¿Qué curva da d) perlita gruesa y cementita proeutectoide?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número entero del 1 al 5
        distractores:
          - valor: '4'
            mensaje: |
              La curva 4 también lo transforma todo, pero cruza la región de la
              perlita más abajo, entre unos 625 y 550 °C, y ahí la perlita sale
              fina: es la del apartado a).
        pista: |
          La perlita gruesa se forma cerca del eutectoide. Busca la curva que
          cruza la región de la perlita más arriba.
        desarrollo: |
          La curva 5, la más lenta, cruza la curva de la cementita hacia 740 °C,
          entra en la región de la perlita hacia 690 °C y cruza la de final
          hacia 660 °C. A esas temperaturas la perlita sale gruesa.

      - tipo: calcular
        titulo: Qué curva da el apartado e)
        pregunta: |
          ¿Qué curva da e) martensita, cementita proeutectoide y perlita fina?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.1
          formato: un número entero del 1 al 5
        distractores:
          - valor: '2'
            mensaje: |
              La curva 2 cruza la de la cementita pero no entra en la región de
              la perlita: da cementita y martensita, sin perlita.
          - valor: '4'
            mensaje: |
              La curva 4 cruza la curva de final de la perlita: no queda
              austenita para la martensita.
        pista: |
          Busca la curva que entra en la región de la perlita y sale por abajo
          sin cruzar la curva de final.
        desarrollo: |
          La curva 3 cruza la curva de la cementita y la de inicio de la
          perlita, atraviesa la región de la perlita y sale por abajo sin
          llegar a la curva de final. Queda austenita, que se hace martensita
          en la línea M.

      - tipo: justificar
        pregunta: Ordena la lectura de las cinco curvas. Una pieza es falsa.
        piezas:
          - texto: 'La curva 1 no toca ninguna curva de transformación: toda la austenita llega a la línea M y da martensita.'
          - texto: 'La curva 2 cruza solo la de la cementita proeutectoide: cementita y martensita.'
          - texto: 'La curva 3 entra además en la región de la perlita sin llegar al final: cementita, perlita fina y martensita.'
          - texto: 'La 4 cruza la curva de final hacia 550 °C y la 5 hacia 660 °C: las dos dan perlita y cementita, fina la 4 y gruesa la 5.'
          - texto: 'La curva más lenta da la perlita más fina, porque la transformación dura más tiempo.'
            trampa: true
            mensaje: |
              Fina o gruesa lo decide la temperatura a la que se forma la
              perlita, no lo que tarde. La curva más lenta cruza la región de la
              perlita más arriba, cerca del eutectoide, donde la difusión es
              rápida y las láminas salen gruesas.
    resolucion: |
      **Cómo se lee una curva de enfriamiento.** Donde corta a una curva de
      inicio empieza esa transformación, y donde corta a la de final termina.
      Si llega a la línea M con austenita, esa austenita se hace martensita. En
      un acero al carbono no hay bainita en continuo.

      Con las curvas numeradas de la más rápida a la más lenta:

      | curva | qué cruza | microestructura | apartado |
      |---|---|---|---|
      | 1 | nada | martensita | b) |
      | 2 | la de la cementita, y roza la de la perlita sin entrar | martensita y cementita | c) |
      | 3 | cementita e inicio de la perlita, sin llegar al final | martensita, cementita y perlita fina | e) |
      | 4 | todas; la perlita se forma entre unos 625 y 550 °C | perlita fina y cementita | a) |
      | 5 | todas; la perlita se forma entre unos 690 y 660 °C | perlita gruesa y cementita | d) |

      Coincide con el listado, que da el orden de mayor a menor velocidad, de
      izquierda a derecha: b), c), e), a), d).

      **La cementita sale en cuatro de las cinco.** La curva de la cementita
      proeutectoide es la primera que se encuentra cualquier curva que no sea
      la más rápida, porque en un acero hipereutectoide está por encima y a la
      izquierda de la de la perlita. Solo la curva 1 pasa por delante de
      todas.

  - id: ejcm5-col56-la-velocidad-critica-del-4340
    titulo: La velocidad crítica del 4340 y cuatro tratamientos
    fuente: >-
      Ejercicio 5.6 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      Teniendo en cuenta el diagrama TTT de enfriamiento continuo de un acero
      4340:

      a) ¿Cuál es la velocidad crítica de enfriamiento de este acero?

      b) Explique el procedimiento necesario en cada caso para transformar la
      microestructura perlítica de dicho acero en: ferrita-perlita,
      martensita-bainita, esferoidita y martensita-bainita-ferrita.

      c) Indique cuál de las cuatro microestructuras resultantes tendrá la
      mayor dureza y cuál de ellas la menor.
    pide: >-
      La velocidad crítica, el procedimiento para cada una de las cuatro
      microestructuras, y cuál de ellas es la más dura y cuál la más blanda.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) ¿Qué curva de enfriamiento marca la velocidad crítica?
        opciones:
          - texto: La más lenta que no corta ninguna curva de transformación, la que pasa rozando la nariz
            correcta: true
            mensaje: |
              Eso es. La velocidad crítica es la mínima que da martensita
              entera: más despacio, la curva corta alguna nariz y sale otra
              cosa; más deprisa, también sale martensita, pero no hace falta.
          - texto: La que corta la nariz bainítica por la mitad
            mensaje: |
              Esa da bainita antes de llegar a la línea M: martensita y bainita.
              La crítica es la última que **no** la corta.
          - texto: La más lenta que todavía da algo de martensita
            mensaje: |
              Esa es la otra frontera: por debajo de ella ya no hay martensita
              ninguna. La crítica es la que da martensita **entera**.

      - tipo: calcular
        titulo: La velocidad crítica
        pregunta: |
          ¿Cuál es la velocidad crítica de enfriamiento del 4340?
        respuesta:
          tipo: numero
          valor: '8.3'
          tolerancia: 0.5
          formato: en °C/s, solo el número
        distractores:
          - valor: '0.3'
            mensaje: |
              Con 0,3 °C/s la curva corta la nariz bainítica y sale bainita
              antes de la línea M: martensita y bainita. La crítica es la que
              pasa justo por delante de la nariz.
          - valor: '140'
            mensaje: |
              Esa es la velocidad crítica del acero eutectoide al carbono, la
              del resumen del tema. Los elementos de aleación del 4340 retrasan
              las curvas, y la crítica baja a unos 8 °C/s: se puede templar
              mucho más despacio.
        pista: |
          Busca la curva de enfriamiento que toca la punta de la nariz
          bainítica sin entrar en ella.
        desarrollo: |
          La curva de inicio de la bainita tiene la punta hacia 40 s y unos
          420 °C, y por ahí pasa justo la curva rotulada 8,3 °C/s. Las más
          lentas la cortan; las más rápidas no llegan a tocarla. La velocidad
          crítica es **8,3 °C/s**.

      - tipo: reconocer
        pregunta: |
          b) ¿Cómo se pasa de la estructura perlítica a **ferrita-perlita**?
        opciones:
          - texto: >-
              Austenizar —calentar hasta tener solo austenita y mantener— y
              enfriar muy despacio, a unos 0,006 °C/s
            correcta: true
            mensaje: |
              Eso es. La curva de 0,006 °C/s cruza primero la región de la
              ferrita y después la de la perlita, y no llega a la línea M con
              austenita. Es un recocido: enfriar dentro del horno.
          - texto: Austenizar y enfriar a 0,3 °C/s
            mensaje: |
              Esa curva pasa por delante de la ferrita y corta la nariz
              bainítica: da martensita y bainita, sin ferrita ni perlita.
          - texto: Calentarla a unos 700 °C y mantenerla un día
            mensaje: |
              Eso es el tratamiento de la esferoidita: la cementita se junta en
              bolitas y la estructura deja de ser laminar. Para ferrita y
              perlita en láminas hay que pasar por la austenita y enfriar
              despacio.
          - texto: No hace falta austenizar, basta con enfriarla despacio desde donde está
            mensaje: |
              Una pieza perlítica a temperatura ambiente no tiene austenita que
              transformar. Todo cambio de microestructura por enfriamiento
              empieza calentando hasta tener austenita: de ahí parte el
              diagrama de enfriamiento continuo.

      - tipo: reconocer
        pregunta: |
          b) ¿Cómo se pasa de la estructura perlítica a **martensita-bainita**?
        opciones:
          - texto: Austenizar y enfriar a unos 0,3 °C/s
            correcta: true
            mensaje: |
              Eso es. La curva de 0,3 °C/s pasa rozando la región de la ferrita
              sin entrar, corta la nariz bainítica y llega a la línea M con
              austenita: bainita y martensita.
          - texto: Austenizar y enfriar a 8,3 °C/s
            mensaje: |
              Esa es la velocidad crítica: la curva no corta la nariz bainítica
              y todo se hace martensita, sin bainita.
          - texto: Austenizar y enfriar a 0,02 °C/s
            mensaje: |
              Esa es tan lenta que cruza antes la región de la ferrita: da
              martensita, bainita y ferrita. Es la última de las cuatro.
          - texto: Templar la pieza perlítica en agua, sin austenizar
            mensaje: |
              La perlita no se convierte en martensita por enfriarla deprisa: la
              martensita sale de la austenita. Primero hay que calentar hasta
              austenizar.

      - tipo: reconocer
        pregunta: |
          b) ¿Cómo se pasa de la estructura perlítica a **esferoidita**?
        opciones:
          - texto: >-
              Sin austenizar, calentarla justo por debajo de la temperatura
              eutectoide, hacia 700 °C, y mantenerla del orden de un día
            correcta: true
            mensaje: |
              Eso es. La esferoidita sale de la perlita ya formada: la cementita
              pasa de láminas a bolitas para reducir su superficie de contacto
              con la ferrita. No cambian las fases ni sus cantidades, solo su
              forma.
          - texto: Austenizar y enfriar muy despacio, a 0,006 °C/s
            mensaje: |
              Eso da ferrita y perlita en láminas. La esferoidita no sale de
              ninguna curva de enfriamiento: su cinética no está en el
              diagrama.
          - texto: Calentarla por encima de la temperatura eutectoide y mantenerla un día
            mensaje: |
              Por encima del eutectoide la perlita se disuelve en austenita, y
              lo que salga después dependerá de cómo se enfríe. El globulizado
              se hace por debajo, para que la cementita cambie de forma sin
              disolverse.

      - tipo: reconocer
        pregunta: |
          b) ¿Cómo se pasa de la estructura perlítica a
          **martensita-bainita-ferrita**?
        opciones:
          - texto: Austenizar y enfriar a unos 0,02 °C/s
            correcta: true
            mensaje: |
              Eso es. La curva de 0,02 °C/s cruza primero la región de la
              ferrita, después la nariz bainítica, y llega a la línea M con
              austenita todavía: ferrita, bainita y martensita.
          - texto: Austenizar y enfriar a 0,3 °C/s
            mensaje: |
              Esa pasa rozando la región de la ferrita sin entrar: da martensita
              y bainita, sin ferrita.
          - texto: Austenizar y enfriar a 0,006 °C/s
            mensaje: |
              Esa es tan lenta que cruza también la región de la perlita: da
              ferrita y perlita.

      - tipo: redactar
        que: deduccion
        consigna: |
          Escribe el apartado b) como en el examen, en ocho o diez líneas:
          para cada una de las cuatro microestructuras, qué se hace con la
          pieza perlítica —si hay que calentarla, hasta dónde y durante
          cuánto—, a qué velocidad se enfría y qué regiones del diagrama cruza
          esa curva antes de llegar abajo.
        rubrica:
          - punto: >-
              Empiezas diciendo que, salvo para la esferoidita, la pieza
              perlítica primero hay que austenizarla: calentarla hasta tener
              solo austenita y mantenerla hasta que sea homogénea
            porque: >-
              El diagrama de enfriamiento continuo describe lo que le pasa a la
              austenita al enfriarse (diapositivas 17 a 20 del tema 5), y la
              perlita a temperatura ambiente no se transforma por enfriarla
              más. Sin este paso, las otras tres respuestas no tienen de dónde
              partir.
            minimo: true
          - punto: >-
              Ferrita-perlita: austenizar y enfriar muy despacio, como la curva
              de 0,006 °C/s, que cruza la región de la ferrita y después la de
              la perlita
            porque: >-
              Es un enfriamiento lento, del tipo que la diapositiva 18 llama
              recocido total y que la 9 del tema 6 hace dentro del horno
              apagado.
            minimo: true
          - punto: >-
              Martensita-bainita: austenizar y enfriar como la curva de
              0,3 °C/s, que no toca la región de la ferrita, corta la nariz
              bainítica y llega a la línea M con austenita
            porque: >-
              En este acero sale bainita enfriando de forma continua por la
              nariz bainítica que crean los elementos de aleación (diapositiva
              20). En el acero eutectoide al carbono de la diapositiva 17,
              enfriando de forma continua, no se forma bainita.
            minimo: true
          - punto: >-
              Martensita-bainita-ferrita: austenizar y enfriar como la curva de
              0,02 °C/s, que cruza la ferrita, después la nariz bainítica, y
              llega a la línea M con austenita todavía
            porque: >-
              Es la curva intermedia: lo bastante lenta para que salga ferrita
              y lo bastante rápida para que no salga perlita y quede austenita
              para la bainita y la martensita.
            minimo: true
          - punto: >-
              Esferoidita: sin austenizar, calentar la perlita justo por debajo
              de la temperatura eutectoide, del orden de 700 °C, durante mucho
              tiempo, y enfriar
            porque: >-
              La esferoidita sale de una perlita o una bainita ya formadas, y
              su cinética no está en los diagramas (diapositiva 14).
              Austenizar primero disolvería la perlita que se quiere
              globulizar.
            minimo: true
          - punto: >-
              Para cada una nombras la curva que usas por su velocidad y lo
              que cruza, no solo «más deprisa» o «más despacio»
            porque: >-
              Las cuatro las decide qué regiones corta la curva antes de la
              línea M. «Enfriar más despacio» no separa martensita-bainita de
              martensita-bainita-ferrita; «a 0,3 °C/s, que no toca la
              ferrita», sí.
        veredicto: |
          Si has escrito «austenizar» en tres de las cuatro y «sin austenizar»
          en la esferoidita, y cada curva lleva su velocidad y lo que cruza,
          está completo. El error que más se ve es templar la pieza perlítica
          tal cual: sin austenita no hay nada que se haga martensita.

      - tipo: reconocer
        pregunta: |
          c) De las cuatro microestructuras de b), ¿cuál es la más dura y cuál
          la más blanda?
        opciones:
          - texto: La más dura, martensita-bainita; la más blanda, esferoidita
            correcta: true
            mensaje: |
              Eso es. La martensita es la más dura, y martensita-bainita es la
              que más tiene sin nada de ferrita. Los aceros esferoidíticos son
              los más blandos y tenaces: las bolitas de cementita frenan poco a
              las dislocaciones.
          - texto: La más dura, martensita-bainita-ferrita, porque tiene más fases
            mensaje: |
              La ferrita es blanda: cambiar parte de la martensita y la bainita
              por ferrita baja la dureza. Más fases no es más dureza.
          - texto: La más blanda, ferrita-perlita, porque es la de enfriamiento más lento
            mensaje: |
              La perlita en láminas frena a las dislocaciones más que las
              bolitas de la esferoidita, que tiene menos intercaras. La más
              blanda de las cuatro es la esferoidita.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Todas menos la esferoidita empiezan austenizando: sin austenita, el enfriamiento no tiene nada que transformar.'
          - texto: 'La velocidad crítica, 8,3 °C/s, es la curva que roza la nariz bainítica sin cortarla.'
          - texto: 'A 0,3 °C/s se corta la bainita y no la ferrita; a 0,02 °C/s, las dos; a 0,006 °C/s, la ferrita y la perlita.'
          - texto: 'La esferoidita sale de calentar la perlita hacia 700 °C durante un día, sin pasar por la austenita.'
          - texto: 'Para pasar de perlita a martensita basta con enfriar la pieza más deprisa que la velocidad crítica.'
            trampa: true
            mensaje: |
              Enfriar una pieza que ya es perlita no la cambia: la perlita es
              estable a temperatura ambiente. La martensita sale de la austenita,
              así que primero hay que calentar hasta austenizar, y solo entonces
              enfriar deprisa.
    resolucion: |
      **a) La velocidad crítica es 8,3 °C/s.** Es la curva que pasa rozando la
      punta de la nariz bainítica, hacia 40 s y unos 420 °C. Las más lentas
      cortan alguna nariz; esta es la más lenta que no corta ninguna.

      **b) Todo empieza austenizando, menos la esferoidita.** La pieza es
      perlítica y la perlita no se transforma por enfriarla: hay que calentarla
      hasta tener austenita y mantenerla hasta que sea homogénea. Después, la
      velocidad de enfriamiento decide:

      | microestructura | procedimiento | qué cruza la curva |
      |---|---|---|
      | ferrita-perlita | austenizar y enfriar a 0,006 °C/s | la ferrita y la perlita |
      | martensita-bainita | austenizar y enfriar a 0,3 °C/s | la bainita, y la línea M |
      | martensita-bainita-ferrita | austenizar y enfriar a 0,02 °C/s | la ferrita, la bainita y la línea M |
      | esferoidita | sin austenizar, unos 700 °C durante un día | ninguna: no está en el diagrama |

      Las velocidades son las de las curvas dibujadas. Vale cualquier otra que
      cruce las mismas regiones.

      **c) La más dura es martensita-bainita, y la más blanda, esferoidita.**
      La martensita es la microestructura más dura, y esa es la mezcla que más
      tiene sin nada de ferrita. La esferoidita es la más blanda y tenaz, más
      que la perlita, porque sus bolitas de cementita dejan menos intercaras
      que frenen a las dislocaciones.

      La colección no imprime resultado; esta resolución es nuestra.

  - id: ejcm5-col57-un-acero-de-carbono-desconocido
    titulo: Un acero de carbono desconocido, y un temple desde 780 °C
    fuente: >-
      Ejercicio 5.7 · Tema 5, «Transformaciones de fase. Problemas» · Ciencia
      de Materiales, UPV/EHU, curso 2025-2026. La colección no imprime
      resultado; la resolución es nuestra.
    nivel: practica
    enunciado: |
      Una pieza de acero ha llegado a una fábrica. La aleación consiste
      exclusivamente en hierro y carbono, pero se desconoce el porcentaje exacto
      de carbono. Una muestra de dicho acero se mantiene un tiempo suficiente a
      1000 ºC y luego se enfría muy lentamente en condiciones de equilibrio. Al
      analizar la muestra con un microscopio, se observa que consta de 38 % en
      masa de perlita y 62 % en masa de ferrita proeutectoide. (Tema 4, Figura
      6)

      a) Calcule el porcentaje de carbono del acero y dibuja su microestructura.

      b) ¿Cuál es el porcentaje de cementita en la muestra?

      c) Con el objetivo de aumentar la dureza de la muestra, ésta se mantiene
      durante largo tiempo (condiciones de equilibrio) a una temperatura de
      780 oC. Después, se enfría a una velocidad superior a la velocidad
      crítica de enfriamiento. ¿Cuál será la microestructura resultante?
      Indique la composición final de las fases de la muestra de acero.
    pide: >-
      El carbono del acero y su microestructura, el porcentaje de cementita, y
      la microestructura y la composición de las fases tras enfriar desde
      780 °C por encima de la velocidad crítica.
    pasos:
      - tipo: reconocer
        pregunta: |
          a) Del 38 % de perlita hay que sacar el carbono. ¿Qué palanca se usa?
        opciones:
          - texto: La de los microconstituyentes, entre 0,022 y 0,76 % C
            correcta: true
            mensaje: |
              Eso es. La perlita es lo que sale de la austenita eutectoide, de
              0,76 % C, y la ferrita proeutectoide tiene 0,022 %. Justo por
              debajo de 727 °C el acero se reparte entre esos dos extremos.
          - texto: La de las fases, entre 0,022 y 6,70 % C
            mensaje: |
              Esa reparte ferrita y cementita, que son fases. La perlita es un
              microconstituyente —ferrita y cementita en láminas— y su palanca
              termina en el eutectoide, 0,76.
          - texto: La de la isoterma de 1000 °C
            mensaje: |
              A 1000 °C el acero es todo austenita: ahí no hay nada que
              repartir. La perlita y la ferrita proeutectoide se cuentan justo
              por debajo de 727 °C.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.302'
          tolerancia: 0.01
          formato: el porcentaje en masa de C, sin el símbolo
        distractores:
          - valor: '0.289'
            mensaje: |
              Has hecho $0{,}38 \cdot 0{,}76$, como si la ferrita fuera hierro
              puro. La ferrita proeutectoide tiene 0,022 % C, y la palanca
              empieza ahí: $C_0 = 0{,}022 + 0{,}38 \cdot (0{,}76 - 0{,}022)$.
          - valor: '0.48'
            mensaje: |
              Has cambiado los brazos: con tu cuenta la perlita sería el 62 %.
              La perlita crece hacia el lado del eutectoide, así que su fracción
              es el brazo que va de 0,022 al acero.
          - valor: '2.56'
            mensaje: |
              Has usado la palanca de las fases, hasta 6,70. Eso daría un
              hierro fundido, no un acero. La perlita es un microconstituyente,
              y su palanca termina en 0,76.
        pista: |
          $W_{\text{P}} = \dfrac{C_0 - 0{,}022}{0{,}76 - 0{,}022} = 0{,}38$, y
          se despeja $C_0$.
        desarrollo: |
          $$
          C_0 = 0{,}022 + 0{,}38 \cdot (0{,}76 - 0{,}022) = 0{,}022 + 0{,}280 = 0{,}30\ \%\ \text{C}
          $$

      - tipo: reconocer
        pregunta: |
          a) ¿Cómo se dibuja la microestructura de este acero?
        opciones:
          - texto: >-
              Granos claros de ferrita proeutectoide, algo más de la mitad de la
              superficie, con colonias de perlita laminar entre ellos
            correcta: true
            mensaje: |
              Eso es. La ferrita es el 62 %: es la matriz, en granos claros. La
              perlita, el 38 %, ocupa las zonas oscuras entre ellos, en láminas
              alternas de ferrita y cementita.
          - texto: Granos de perlita rodeados por una red fina de ferrita en los bordes
            mensaje: |
              Esa es la de un acero cerca del eutectoide, con poca ferrita
              proeutectoide. Aquí la ferrita es la mayoría, y la perlita ocupa
              las islas.
          - texto: Perlita rodeada por una red de cementita en los bordes de grano
            mensaje: |
              Esa es la de un acero hipereutectoide, con más de 0,76 % C. Con
              0,30 % C lo proeutectoide es ferrita, no cementita.

      - tipo: dibujar
        consigna: |
          Dibuja la microestructura del acero de 0,30 % C tal como se vería al
          microscopio: un círculo de campo con sus granos, y cada
          microconstituyente rotulado con su nombre y su porcentaje. Es lo que
          pide el apartado a) después del carbono.
        comprueba:
          - punto: >-
              Dos microconstituyentes rotulados, ferrita proeutectoide y
              perlita, cada uno con su porcentaje
            porque: >-
              El enunciado da los dos y sus cantidades, 62 % y 38 %, y el
              dibujo tiene que decir cuál es cuál. Sin rótulos, quien lo
              corrige no puede saber si has dibujado este acero o uno
              hipereutectoide.
          - punto: >-
              La ferrita ocupa algo más de la mitad del campo, y la perlita,
              algo más de un tercio
            porque: >-
              La proporción es la respuesta dibujada. Un campo con mitad y
              mitad, o con más perlita que ferrita, es el acero de otro
              problema: con más perlita que ferrita, el carbono pasaría del
              0,39 %.
          - punto: >-
              La ferrita, en granos claros y lisos; la perlita, en colonias con
              láminas paralelas
            porque: >-
              La ferrita proeutectoide es una sola fase, α, sin nada dentro. La
              perlita son dos fases en láminas alternas, ferrita y cementita, y
              las láminas son lo que la identifica al microscopio.
          - punto: >-
              Si dibujas las láminas de cerca, las oscuras de cementita mucho
              más finas que las claras de ferrita
            porque: >-
              La diapositiva 11 del tema 5 da una relación de grosores de
              aproximadamente 8 a 1 entre las capas de ferrita y las de
              cementita. Dibujarlas iguales es dibujar otra proporción de
              fases.
          - punto: >-
              Nada de cementita rodeando los granos
            porque: >-
              Una red de cementita en los bordes de grano es la microestructura
              de un acero hipereutectoide, con más de 0,76 % de C, donde lo
              proeutectoide es cementita. Con 0,30 % lo proeutectoide es
              ferrita.
        figura: |
          <svg viewBox="0 0 440 250" role="img" width="440" height="250" aria-labelledby="f-cm5-col57-micro-t f-cm5-col57-micro-d">
