        veredicto: |
          Si tu dibujo tiene los dos rótulos con sus porcentajes, más ferrita
          que perlita y la perlita en láminas, está bien. Lo que más se escapa
          es la proporción: la perlita llama la atención, se dibuja en medio
          campo y el acero pasa a ser otro.

      - tipo: calcular
        titulo: La cementita de la muestra
        pregunta: |
          b) ¿Qué porcentaje en masa de la muestra es cementita?
        respuesta:
          tipo: numero
          valor: '4.2'
          tolerancia: 0.1
          formato: el porcentaje en masa, sin el símbolo
        distractores:
          - valor: '4.51'
            mensaje: |
              Has hecho $C_0/6{,}70$, como si la ferrita no tuviera carbono. La
              palanca de las fases empieza en la ferrita, 0,022, no en 0.
          - valor: '11.1'
            mensaje: |
              Esa es la cementita que hay **dentro de la perlita**, el 11 % de
              cada colonia. La perlita es solo el 38 % de la muestra: hay que
              multiplicar, y sale 0,38 · 11,1 = 4,2 %.
        pista: |
          La palanca de las fases, de la ferrita a la cementita:
          $W_{\text{Fe}_3\text{C}} = \dfrac{C_0 - 0{,}022}{6{,}70 - 0{,}022}$.
        desarrollo: |
          $$
          W_{\text{Fe}_3\text{C}} = \frac{0{,}302 - 0{,}022}{6{,}70 - 0{,}022} = \frac{0{,}280}{6{,}678} = 0{,}042
          $$

          Un 4,2 %. Sale lo mismo por el otro camino: toda la cementita está en
          la perlita, que tiene un 11,1 % de cementita, y
          $0{,}38 \cdot 0{,}111 = 0{,}042$.

      - tipo: reconocer
        pregunta: |
          c) Se mantiene mucho tiempo a 780 °C. ¿Qué hay en el acero a esa
          temperatura?
        opciones:
          - texto: Ferrita y austenita, porque a 0,30 % C la línea A3 está hacia 820 °C
            correcta: true
            mensaje: |
              Eso es. A 780 °C el acero está por encima de 727 °C, así que la
              perlita ya se ha disuelto en austenita, y por debajo de la línea
              A3, así que queda ferrita. Región α + γ.
          - texto: Solo austenita, porque 780 °C está por encima del eutectoide
            mensaje: |
              Por encima de 727 °C la perlita se hace austenita, pero la ferrita
              proeutectoide no se disuelve entera hasta la línea A3, que a
              0,30 % C está hacia 820 °C. A 780 °C todavía queda ferrita.
          - texto: Ferrita y cementita, como a temperatura ambiente
            mensaje: |
              Esas dos fases conviven por debajo de 727 °C. A 780 °C la perlita
              ya se ha disuelto en austenita.

      - tipo: calcular
        titulo: El carbono de la austenita a 780 °C
        pregunta: |
          c) ¿Qué porcentaje de carbono tiene la austenita a 780 °C?
        respuesta:
          tipo: numero
          valor: '0.46'
          tolerancia: 0.03
          formato: el porcentaje en masa de C, sin el símbolo
        distractores:
          - valor: '0.30'
            mensaje: |
              Esa es la composición del acero entero. En la región α + γ las dos
              fases se reparten el carbono de forma desigual: la ferrita se
              queda casi sin nada y la austenita con más que el acero.
          - valor: '0.76'
            mensaje: |
              Esa es la austenita a 727 °C, la del eutectoide. A 780 °C la
              isoterma corta la línea A3 más a la izquierda, hacia 0,46 %.
          - valor: '0.93'
            mensaje: |
              Ese es el corte con la otra línea, la de la cementita, que queda a
              la derecha del eutectoide. La austenita de un acero de 0,30 % C
              está en el borde de la región α + γ, a la izquierda.
        pista: |
          Traza la isoterma de 780 °C sobre la figura 6 del tema 4 y lee dónde
          corta la línea A3, el borde derecho de la región α + γ.
        desarrollo: |
          A 780 °C la isoterma corta el borde de la ferrita hacia 0,02 % C y la
          línea A3 hacia 0,46 % C:

          $$
          C_\alpha \approx 0{,}02\ \%\ \text{C} \qquad C_\gamma \approx 0{,}46\ \%\ \text{C}
          $$

      - tipo: calcular
        titulo: Cuánta martensita sale
        pregunta: |
          c) Tras enfriar por encima de la velocidad crítica, ¿qué porcentaje
          en masa de la muestra es martensita?
        respuesta:
          tipo: numero
          valor: '64'
          tolerancia: 4
          formato: el porcentaje en masa, sin el símbolo
        distractores:
          - valor: '38'
            mensaje: |
              Ese es el porcentaje de perlita, que es la austenita que había
              justo por encima de 727 °C. A 780 °C se ha disuelto además parte
              de la ferrita, y la austenita ha crecido hasta el 64 %.
          - valor: '100'
            mensaje: |
              Solo sería todo martensita templando desde la austenita entera, y
              a 780 °C todavía queda ferrita. La ferrita no se hace martensita:
              se queda como está.
        pista: |
          Toda la austenita de 780 °C se hace martensita. Su fracción sale de
          la palanca en la isoterma de 780 °C, entre 0,02 y 0,46.
        desarrollo: |
          $$
          W_\gamma = \frac{0{,}30 - 0{,}02}{0{,}46 - 0{,}02} = \frac{0{,}28}{0{,}44} = 0{,}64
          $$

          Un 64 % de austenita, que al templar se hace un 64 % de martensita.
          El otro 36 % es ferrita.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado c). Una pieza es falsa.
        piezas:
          - texto: 'A 780 °C el acero de 0,30 % C está en la región α + γ: ferrita con 0,02 % C y austenita con 0,46 % C.'
          - texto: 'La palanca en esa isoterma da un 64 % de austenita y un 36 % de ferrita.'
          - texto: 'Al enfriar por encima de la velocidad crítica, la austenita se hace martensita sin cambiar de composición.'
          - texto: 'Queda un 64 % de martensita con 0,46 % C y un 36 % de ferrita con 0,02 % C.'
          - texto: 'La martensita tiene el carbono del acero, 0,30 %, porque se forma sin difusión.'
            trampa: true
            mensaje: |
              Sin difusión quiere decir que la martensita conserva el carbono de
              la austenita de la que sale, no el del acero entero. A 780 °C la
              austenita ya tiene 0,46 % C, porque la ferrita se ha quedado con
              casi nada.
    resolucion: |
      **a) El carbono, con la palanca de los microconstituyentes.** Justo por
      debajo de 727 °C el acero se reparte entre la ferrita proeutectoide, de
      0,022 % C, y la perlita, que sale de austenita de 0,76 %:

      $$
      W_{\text{P}} = \frac{C_0 - 0{,}022}{0{,}76 - 0{,}022} = 0{,}38
      \;\Longrightarrow\;
      C_0 = 0{,}022 + 0{,}38 \cdot 0{,}738 = 0{,}30\ \%\ \text{C}
      $$

      Es un acero hipoeutectoide. Al microscopio: granos claros de ferrita
      proeutectoide, el 62 %, y entre ellos colonias oscuras de perlita
      laminar, el 38 %.

      **b) La cementita, con la palanca de las fases**, que va de la ferrita a
      la cementita:

      $$
      W_{\text{Fe}_3\text{C}} = \frac{0{,}302 - 0{,}022}{6{,}70 - 0{,}022} = 0{,}042
      $$

      Un 4,2 %, y toda está dentro de la perlita.

      **c) A 780 °C el acero está en la región α + γ**, entre 727 °C y la línea
      A3, que a 0,30 % C pasa hacia 820 °C. La isoterma de 780 °C, leída sobre
      la figura 6 del tema 4, da ferrita con unos 0,02 % C y austenita con unos
      0,46 % C:

      $$
      W_\gamma = \frac{0{,}30 - 0{,}02}{0{,}46 - 0{,}02} = 0{,}64
      $$

      Al enfriar por encima de la velocidad crítica, la austenita se hace
      martensita **con su propio carbono**, y la ferrita no cambia:

      | fase | cantidad | carbono |
      |---|---|---|
      | martensita | 64 % | 0,46 % C |
      | ferrita | 36 % | 0,02 % C |

      Comprobación: $0{,}64 \cdot 0{,}46 + 0{,}36 \cdot 0{,}02 = 0{,}30$, el
      carbono del acero.

      **Por qué no sale todo martensita.** Templando desde 780 °C se queda un
      tercio de ferrita blanda. Para martensita entera habría que austenizar
      por encima de la línea A3, hacia 820 °C o más, y templar desde ahí.

      La colección no imprime resultado; esta resolución es nuestra. Las
      composiciones a 780 °C están leídas sobre la figura.
