ejercicios:
  - id: ejcm7-lo-que-dice-el-nombre-de-un-acero
    titulo: Lo que dice el nombre de un acero 1045
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la designación de los
      aceros y la regla de la palanca del Tema 4 de la asignatura. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un acero se designa como AISI 1045. ¿Cuánto carbono tiene? Enfriado
      despacio desde la austenita hasta justo por debajo de 727 °C, ¿qué
      fracción de su masa es perlita? Usa los valores del diagrama
      hierro-carburo de hierro del tema 4: 0,022 % de C en la ferrita y
      0,76 % en el eutectoide.
    pide: El carbono del acero y su fracción de perlita.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dicen las cuatro cifras de un AISI 1045?
        opciones:
          - texto: 'Las dos primeras, la familia: 10 es acero al carbono. Las dos últimas, el carbono: 0,45 %'
            correcta: true
            mensaje: |
              Eso es. Las dos últimas cifras son centésimas de punto de
              carbono, así que el 1045 lleva un 0,45 % de C y ningún elemento
              de aleación añadido.
          - texto: Un 10 % de aleantes y un 45 % de hierro
            mensaje: |
              Ninguna cifra es un porcentaje de aleación: el 10 es el número de
              la familia, la de los aceros al carbono. Y un acero es casi todo
              hierro, más del 98 %.
          - texto: Un 1,045 % de carbono
            mensaje: |
              Solo las dos últimas cifras son el carbono. Con más del 0,76 %
              sería además un acero hipereutectoide, y el 1045 no lo es.

      - tipo: calcular
        titulo: El carbono del acero
        pregunta: |
          ¿Qué porcentaje de carbono tiene el acero?
        respuesta:
          tipo: numero
          valor: '0.45'
          tolerancia: 0.005
          formato: el porcentaje de C, sin el símbolo
        distractores:
          - valor: '45'
            mensaje: |
              Son centésimas de punto: «45» es 0,45 %, no 45 %. Un acero con un
              45 % de carbono no existe; la cementita, que es el máximo del
              diagrama, tiene un 6,70 %.
        pista: |
          Las dos últimas cifras, en centésimas.
        desarrollo: |
          $C_0 = 45/100 = 0{,}45\ \%$ de C.

      - tipo: calcular
        titulo: La fracción de perlita
        pregunta: |
          ¿Qué fracción en masa del acero es perlita, justo por debajo de
          727 °C?
        respuesta:
          tipo: numero
          valor: '0.580'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.420'
            mensaje: |
              Esa es la ferrita proeutectoide. Has puesto el brazo del lado de
              la perlita; la perlita es el brazo del otro lado, de 0,022 a
              0,45.
          - valor: '0.064'
            mensaje: |
              Has hecho la palanca hasta la cementita, 6,70. Esa palanca da las
              **fases**; la perlita es un microconstituyente y su palanca acaba
              en el eutectoide, 0,76.
        pista: |
          $W_{\text{perlita}} = \dfrac{C_0 - 0{,}022}{0{,}76 - 0{,}022}$.
        desarrollo: |
          $$
          W_{\text{perlita}} = \frac{0{,}45 - 0{,}022}{0{,}76 - 0{,}022} = \frac{0{,}428}{0{,}738} = 0{,}580
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El 1045 es un acero al carbono con un 0,45 % de C: hipoeutectoide.'
          - texto: 'Antes de 727 °C sale ferrita proeutectoide, y la austenita que queda da perlita.'
          - texto: 'La palanca de los microconstituyentes, de 0,022 a 0,76, da un 58 % de perlita.'
          - texto: 'Un 1045 tiene más perlita que un 1080, porque su número acaba en una cifra más alta.'
            trampa: true
            mensaje: |
              Lo que cuenta son las dos últimas cifras como número: 45 frente a
              80. El 1080 tiene un 0,80 % de C, pasa del eutectoide y es casi
              todo perlita; el 1045 tiene bastante menos.
    resolucion: |
      **El nombre da el carbono.** En AISI 1045, el 10 es la familia de los
      aceros al carbono y el 45, el carbono en centésimas: $C_0 = 0{,}45\ \%$.

      **El diagrama del tema 4 da la microestructura.** Con menos de 0,76 % es
      hipoeutectoide: ferrita proeutectoide y perlita. La palanca de los
      microconstituyentes va de la ferrita al eutectoide:

      $$
      W_{\text{perlita}} = \frac{0{,}45 - 0{,}022}{0{,}76 - 0{,}022} = 0{,}580
      \qquad
      W_{\alpha,\text{pro}} = 0{,}420
      $$

      Algo más de la mitad es perlita. Por eso un acero de medio carbono como
      este es más resistente que uno de bajo carbono, y a la vez se puede
      templar: tiene carbono de sobra para que salga martensita.

  - id: ejcm7-la-masa-que-ahorra-el-aluminio
    titulo: La masa que se ahorra cambiando acero por aluminio
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, con las densidades de tabla
      del Tema 7. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una pieza de acero de 12 kg se rediseña en aluminio con exactamente la
      misma forma y el mismo volumen. Con densidades de 7,87 g/cm³ para el
      acero y 2,70 g/cm³ para el aluminio, ¿cuánto pesa la pieza nueva?
    pide: La masa de la pieza de aluminio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se conserva al cambiar de material?
        opciones:
          - texto: El volumen, así que las masas van en la proporción de las densidades
            correcta: true
            mensaje: |
              Exacto. Misma forma, mismo volumen: $m = \rho V$, y con $V$ fijo
              la masa es proporcional a la densidad.
          - texto: La masa, porque la pieza tiene que hacer el mismo trabajo
            mensaje: |
              Lo que se ha mantenido es la forma. Con la misma masa, una pieza
              de aluminio sería casi tres veces más voluminosa.
          - texto: La resistencia, así que hay que saber cuánto resiste cada uno
            mensaje: |
              Para eso haría falta un rediseño, y el enunciado dice que la forma
              no cambia. Aquí solo interviene la densidad.

      - tipo: calcular
        titulo: La masa de la pieza de aluminio
        pregunta: |
          ¿Cuánto pesa la pieza de aluminio?
        respuesta:
          tipo: magnitud
          valor: '4.12 kg'
          tolerancia: 0.01
          formato: una masa, con su unidad
        distractores:
          - valor: '34.98 kg'
            mensaje: |
              Has dividido al revés, como si el aluminio pesara más. El aluminio
              es más ligero: la pieza nueva tiene que pesar menos que la de
              acero.
          - valor: '7.88 kg'
            mensaje: |
              Eso es lo que se **ahorra**, no lo que pesa la pieza nueva.
        pista: |
          $m_{\text{Al}} = m_{\text{acero}}\,\rho_{\text{Al}}/\rho_{\text{acero}}$.
        desarrollo: |
          $$
          m_{\text{Al}} = 12 \cdot \frac{2{,}70}{7{,}87} = 12 \cdot 0{,}343 = 4{,}12\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Con la misma forma, el volumen es el mismo y la masa es proporcional a la densidad.'
          - texto: 'El aluminio pesa 2,70/7,87 = 0,343 veces lo que el acero: la pieza pasa de 12 a 4,12 kg.'
          - texto: 'Si además debe aguantar la misma carga, habrá que engordarla, porque el aluminio resiste menos.'
          - texto: 'Como pesa un tercio, la pieza de aluminio aguanta también un tercio de la carga.'
            trampa: true
            mensaje: |
              La densidad no dice nada de la resistencia: son propiedades
              distintas. Una aleación de aluminio puede resistir bastante más
              que un tercio de lo que resiste un acero corriente, y por eso la
              cuenta que decide es la resistencia por unidad de masa.
    resolucion: |
      **Con la misma forma, el volumen no cambia**, y la masa va en la
      proporción de las densidades:

      $$
      m_{\text{Al}} = m_{\text{acero}}\,\frac{\rho_{\text{Al}}}{\rho_{\text{acero}}}
      = 12 \cdot \frac{2{,}70}{7{,}87} = 4{,}12\ \text{kg}
      $$

      Se ahorran casi 8 kg, dos tercios de la pieza. Pero la cuenta no dice si
      la pieza nueva aguanta: eso depende de la resistencia de la aleación de
      aluminio, y si no llega, hay que darle más sección. La comparación honesta
      no es de densidades sino de **resistencia por unidad de masa**.
