  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq3-cuatro-moleculas-y-sus-fuerzas
    titulo: Cuatro moléculas, cuáles son polares y qué las une
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se dan cuatro moléculas: CCl₄, CHCl₃, H₂O y NH₃. Decir cuáles son
      polares y qué fuerzas intermoleculares presenta cada una.
    pide: La polaridad de las cuatro y sus fuerzas intermoleculares.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enlace C–Cl es claramente polar, y sin embargo el CCl₄ no lo es.
          ¿Por qué?
        opciones:
          - texto: Porque sus cuatro dipolos son iguales y su geometría tetraédrica los cancela
            correcta: true
            mensaje: |
              Eso es. El momento dipolar es un **vector**, y en un tetraedro
              regular con cuatro sustituyentes iguales la suma de los cuatro da
              cero. Los enlaces siguen siendo polares; la molécula no.
          - texto: Porque el carbono y el cloro tienen la misma electronegatividad
            correcta: false
            mensaje: |
              No la tienen: el cloro es bastante más electronegativo (3,0
              frente a 2,5), y por eso cada enlace C–Cl sí es polar. Lo que
              cancela es la geometría, no la diferencia de electronegatividad.
          - texto: Porque tiene un número par de enlaces
            correcta: false
            mensaje: |
              El número par no basta. El agua tiene dos enlaces y es de las
              moléculas más polares que hay: sus dos dipolos no se cancelan
              porque la molécula es angular, no lineal.
          - texto: Porque el carbono no tiene pares de electrones libres
            correcta: false
            mensaje: |
              Los pares libres influyen en la geometría, pero no son la
              explicación. El metano tampoco tiene pares libres y también es
              apolar; el CHCl₃ tampoco los tiene en el carbono y **sí** es
              polar.

      - tipo: calcular
        titulo: Cuántas son polares
        pregunta: |
          De las cuatro moléculas del enunciado, ¿cuántas son polares?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Te falta el cloroformo. El CHCl₃ es tetraédrico como el CCl₄,
              pero uno de sus cuatro sustituyentes es un hidrógeno: la simetría
              se rompe y los dipolos ya no se cancelan.
          - valor: '4'
            mensaje: |
              El CCl₄ no lo es. Tiene los enlaces más polares de las cuatro y
              la molécula resulta apolar, que es justo la idea de este ejemplo.
        pista: |
          Dibuja los dipolos de cada una y pregúntate si la suma vectorial se
          cierra.
        desarrollo: |
          - **CCl₄**: tetraédrica y simétrica, los cuatro dipolos se cancelan →
            **apolar**.
          - **CHCl₃**: tetraédrica pero con un sustituyente distinto → **polar**.
          - **H₂O**: angular, con dos pares libres empujando → **polar**.
          - **NH₃**: pirámide trigonal, con un par libre arriba → **polar**.

      - tipo: calcular
        titulo: Cuántas tienen enlace de hidrógeno
        pregunta: |
          Y de las cuatro, ¿en cuántas hay enlace de hidrógeno entre sus
          moléculas?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has contado el cloroformo. Es polar y tiene un hidrógeno, pero
              ese hidrógeno cuelga de un **carbono**, no de N, O o F. Sin eso
              no hay enlace de hidrógeno: hay dipolo-dipolo, que es bastante
              más flojo.
          - valor: '1'
            mensaje: |
              El agua no es la única. El amoníaco también lo tiene: su
              hidrógeno cuelga del nitrógeno, que está en la lista de los tres.
        pista: |
          La condición es que el hidrógeno esté unido directamente a N, O o F.
        desarrollo: |
          Solo el **H₂O** y el **NH₃**. La regla no es «que la molécula sea muy
          polar» ni «que tenga hidrógenos»: es que el hidrógeno cuelgue de
          nitrógeno, oxígeno o flúor, que son los tres átomos lo bastante
          pequeños y electronegativos para dejarlo casi desnudo.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La polaridad de una molécula es la suma vectorial de los dipolos de sus enlaces, así que depende de la geometría y no solo de los enlaces.'
          - texto: 'El CCl₄ tiene cuatro enlaces polares iguales en un tetraedro regular, y por eso su suma es cero: solo tiene fuerzas de dispersión.'
          - texto: 'El CHCl₃ es el mismo tetraedro con un sustituyente cambiado, la suma ya no se cierra y aparecen fuerzas dipolo-dipolo.'
          - texto: 'El H₂O y el NH₃ tienen el hidrógeno colgando de O y de N, así que además presentan enlace de hidrógeno.'
          - texto: 'El CHCl₃ hierve por encima del H₂O porque su molécula es mucho más pesada.'
            trampa: true
            mensaje: |
              No hierve por encima: el cloroformo hierve a 61 °C y el agua a
              100, teniendo el cloroformo casi siete veces más masa molar. Esa
              comparación es precisamente la prueba de que el enlace de
              hidrógeno pesa más que la masa. Las fuerzas de dispersión crecen
              con el tamaño, sí, pero aquí no compensan.
    resolucion: |
      ## Enlace polar y molécula polar no son lo mismo

      Es la distinción que más se cobra en este apartado, y el CCl₄ es el
      contraejemplo perfecto: **sus enlaces son los más polares de las cuatro
      moléculas y la molécula es apolar**. El momento dipolar es un vector, y
      cuatro vectores iguales repartidos en un tetraedro regular suman cero.

      | molécula | geometría | ¿polar? | fuerzas intermoleculares |
      |---|---|---|---|
      | CCl₄ | tetraédrica | no | dispersión |
      | CHCl₃ | tetraédrica, un sustituyente distinto | sí | dispersión + dipolo-dipolo |
      | H₂O | angular | sí | + enlace de hidrógeno |
      | NH₃ | pirámide trigonal | sí | + enlace de hidrógeno |

      **La cadena que hay que recorrer siempre, y en este orden:**

      1. Lewis, para saber cuántos pares hay alrededor del átomo central.
      2. La geometría **molecular**, contando los pares libres.
      3. La suma vectorial de los dipolos: ¿se cancela?
      4. Y solo entonces las fuerzas, que se acumulan: dispersión las tiene
         todo; dipolo-dipolo, las polares; enlace de hidrógeno, únicamente si
         hay H unido a N, O o F.

      **El error que decide el ejercicio del examen** es el paso 4 con el
      cloroformo: tiene un hidrógeno y es polar, y aun así no hay enlace de
      hidrógeno, porque ese hidrógeno cuelga de un carbono. Lo que se puntúa no
      es contestar que no, es **decir por qué no**.
  - id: ejfq3-los-escalones-del-ciclo
    titulo: El ciclo del cloruro de magnesio, contando escalones
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura; los datos son valores tabulados
      de uso corriente.
    nivel: ejemplo
    enunciado: |
      Calcular la energía reticular del MgCl₂ con un ciclo de Born-Haber, a
      partir de estos datos, todos en kJ/mol:

      | | |
      |---|---|
      | sublimación del Mg (s) | +148 |
      | disociación del Cl₂ (g) | +244 |
      | 1.ª energía de ionización del Mg | +738 |
      | 2.ª energía de ionización del Mg | +1451 |
      | afinidad electrónica del Cl | −349 |
      | entalpía de formación del MgCl₂ (s) | −641 |
    pide: La energía reticular del MgCl₂, en kJ/mol.

    pasos:
      - tipo: reconocer
        pregunta: |
          El ciclo del NaCl empieza sublimando el sodio. Aquí el cloro no se
          sublima. ¿Por qué?
        opciones:
          - texto: 'Porque el Cl₂ ya es un gas: lo que hay que hacer con él es disociarlo en átomos'
            correcta: true
            mensaje: |
              Exacto, y es la comprobación que hay que hacer **antes** de
              montar cualquier ciclo: mirar en qué estado está cada elemento en
              condiciones estándar. Un sólido se sublima, un gas diatómico se
              disocia, y un elemento que ya es gas monoatómico no necesita ni
              una cosa ni la otra.
          - texto: Porque los no metales nunca se subliman
            correcta: false
            mensaje: |
              Sí lo hacen cuando son sólidos. El yodo es un no metal **sólido**,
              y el ciclo de un yoduro lleva su escalón de sublimación además
              del de disociación. Es justamente el caso que cae en el examen.
          - texto: Porque la sublimación del cloro es despreciable
            correcta: false
            mensaje: |
              No es que sea pequeña: es que no existe en este ciclo. El punto
              de partida del cloro es Cl₂ gaseoso, y de ahí no hay ningún
              cambio de estado que dar.
          - texto: Porque el cloro entra como ion y no como átomo
            correcta: false
            mensaje: |
              Entra como Cl₂ gaseoso, que es su forma estándar. Llegar hasta el
              ion cuesta dos escalones —disociar y luego captar el electrón—, y
              los dos están en el ciclo.

      - tipo: calcular
        titulo: El camino largo hasta los iones gaseosos
        pregunta: |
          Suma los escalones que llevan de los elementos en su estado estándar
          hasta Mg²⁺(g) y 2 Cl⁻(g). ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '1883'
          tolerancia: 3
          formato: la energía en kJ/mol, con su signo
        distractores:
          - valor: '2232'
            mensaje: |
              Has contado una sola afinidad electrónica. Hacen falta **dos**
              cloruros por cada magnesio, así que la afinidad entra dos veces:
              $2\times(-349) = -698$.
          - valor: '432'
            mensaje: |
              Parece que te has dejado la segunda ionización. El magnesio pierde
              **dos** electrones para llegar a Mg²⁺, y el segundo cuesta casi el
              doble que el primero porque ya se arranca de un catión.
          - valor: '2581'
            mensaje: |
              Ese es el total sin restar nada por las afinidades. Captar un
              electrón libera energía, así que los −349 de cada cloro entran
              con su signo negativo.
        pista: |
          Sublimar, disociar, ionizar dos veces y captar dos electrones.
        desarrollo: |
          $$
          148 + 244 + 738 + 1451 + 2\times(-349) = 1883\ \text{kJ/mol}
          $$

          Fíjate en el peso de cada término: las dos ionizaciones solas son
          2189, más que todo lo demás junto.

      - tipo: calcular
        titulo: La energía reticular
        pregunta: |
          Los dos caminos tienen que costar lo mismo. ¿Cuánto vale entonces la
          energía reticular del MgCl₂?
        respuesta:
          tipo: numero
          valor: '2524'
          tolerancia: 5
          formato: la energía reticular en kJ/mol, en valor absoluto
        distractores:
          - valor: '1242'
            mensaje: |
              Has restado la entalpía de formación en vez de sumarla. Es
              negativa, así que restarla suma: $1883 - (-641) = 2524$.
          - valor: '641'
            mensaje: |
              Esa es la entalpía de formación, que es lo que se mide. La
              reticular es lo que se busca, y es cuatro veces mayor: el ciclo
              existe precisamente porque las dos no se parecen.
        pista: |
          El camino corto es la entalpía de formación. Iguala los dos.
        desarrollo: |
          Como la entalpía es función de estado, el camino corto y el largo
          valen lo mismo:

          $$
          \Delta H_f = 1883 - U
          \quad\Rightarrow\quad
          U = 1883 - \Delta H_f = 1883 + 641 = 2524\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Antes de montar el ciclo se mira el estado estándar de cada elemento: el Mg es sólido y hay que sublimarlo, el Cl₂ es gas y hay que disociarlo.'
          - texto: 'La fórmula MgCl₂ dice cuántas veces entra cada escalón: dos ionizaciones para el magnesio y dos afinidades electrónicas, una por cloro.'
          - texto: 'El camino largo hasta los iones gaseosos suma 1883 kJ/mol, dominado por las dos ionizaciones.'
          - texto: 'Igualando los dos caminos, la energía reticular sale 2524 kJ/mol, cuatro veces la entalpía de formación.'
          - texto: 'La energía reticular del MgCl₂ es mayor que la del NaCl porque el magnesio tiene más protones.'
            trampa: true
            mensaje: |
              Es mayor —2524 frente a 788— y el motivo no es el número de
              protones sino la **carga del ion**. La ley de Coulomb multiplica
              las cargas: pasar de Na⁺ a Mg²⁺ dobla el producto, y además el
              Mg²⁺ es más pequeño que el Na⁺, con lo que la distancia también
              juega a favor. Los protones del núcleo no aparecen en esa
              fórmula.
    resolucion: |
      ## El ciclo se monta leyendo la fórmula y la tabla periódica

      Antes de sumar nada hay que decidir **qué escalones tiene** el ciclo, y
      eso no se copia del ejemplo del NaCl: se lee de dos sitios.

      **De la tabla periódica, el estado de cada elemento.** El magnesio es
      sólido: se sublima. El cloro es un gas diatómico: se disocia. Si el no
      metal fuese sólido —el yodo, por ejemplo— habría que sublimarlo *y*
      disociarlo, dos escalones donde el cloro tiene uno.

      **De la fórmula, cuántas veces entra cada uno.** MgCl₂ pide Mg²⁺, o sea
      dos ionizaciones, y dos cloruros, o sea dos afinidades electrónicas.

      Con eso el ciclo queda:

      $$
      \Delta H_f = \Delta H_{\text{sub}} + D + I_1 + I_2 + 2\,AE - U
      $$

      $$
      -641 = 148 + 244 + 738 + 1451 - 698 - U
      \quad\Rightarrow\quad
      U = 2524\ \text{kJ/mol}
      $$

      **Lo que conviene mirar del resultado.** La energía reticular es cuatro
      veces la entalpía de formación en valor absoluto. Eso no es un accidente
      del MgCl₂: la formación es la diferencia pequeña entre dos números
      grandes —lo que cuesta hacer los iones y lo que devuelve juntarlos—, y
      por eso no sirve para estimar la reticular ni al revés. El ciclo no es
      una comodidad, es la única vía.

      **Y la comparación con el NaCl**, que es la pregunta de teoría que
      acompaña siempre: 2524 contra 788. El salto lo explica la ley de
      Coulomb, $E = k\,Q_+Q_-/r$, con las cargas multiplicando: 2×1 frente a
      1×1, y encima con iones más pequeños.


