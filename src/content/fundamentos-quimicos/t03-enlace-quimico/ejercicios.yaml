  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq3-cuatro-moleculas-y-sus-fuerzas
    titulo: Cuatro moléculas, cuáles son polares y qué las une
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se dan cuatro moléculas: CCl₄, CHCl₃, H₂O y NH₃. Decir cuáles son
      polares y qué fuerzas intermoleculares presenta cada una.
    pide: La polaridad de las cuatro y sus fuerzas intermoleculares.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enlace C–Cl es claramente polar, y sin embargo el CCl₄ no lo es.
          ¿Por qué?
        opciones:
          - texto: Porque sus cuatro dipolos son iguales y su geometría tetraédrica los cancela
            correcta: true
            mensaje: |
              Eso es. El momento dipolar es un **vector**, y en un tetraedro
              regular con cuatro sustituyentes iguales la suma de los cuatro da
              cero. Los enlaces siguen siendo polares; la molécula no.
          - texto: Porque el carbono y el cloro tienen la misma electronegatividad
            correcta: false
            mensaje: |
              No la tienen: el cloro es bastante más electronegativo (3,0
              frente a 2,5), y por eso cada enlace C–Cl sí es polar. Lo que
              cancela es la geometría, no la diferencia de electronegatividad.
          - texto: Porque tiene un número par de enlaces
            correcta: false
            mensaje: |
              El número par no basta. El agua tiene dos enlaces y es de las
              moléculas más polares que hay: sus dos dipolos no se cancelan
              porque la molécula es angular, no lineal.
          - texto: Porque el carbono no tiene pares de electrones libres
            correcta: false
            mensaje: |
              Los pares libres influyen en la geometría, pero no son la
              explicación. El metano tampoco tiene pares libres y también es
              apolar; el CHCl₃ tampoco los tiene en el carbono y **sí** es
              polar.

      - tipo: calcular
        titulo: Cuántas son polares
        pregunta: |
          De las cuatro moléculas del enunciado, ¿cuántas son polares?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Te falta el cloroformo. El CHCl₃ es tetraédrico como el CCl₄,
              pero uno de sus cuatro sustituyentes es un hidrógeno: la simetría
              se rompe y los dipolos ya no se cancelan.
          - valor: '4'
            mensaje: |
              El CCl₄ no lo es. Tiene los enlaces más polares de las cuatro y
              la molécula resulta apolar, que es justo la idea de este ejemplo.
        pista: |
          Dibuja los dipolos de cada una y pregúntate si la suma vectorial se
          cierra.
        desarrollo: |
          - **CCl₄**: tetraédrica y simétrica, los cuatro dipolos se cancelan →
            **apolar**.
          - **CHCl₃**: tetraédrica pero con un sustituyente distinto → **polar**.
          - **H₂O**: angular, con dos pares libres empujando → **polar**.
          - **NH₃**: pirámide trigonal, con un par libre arriba → **polar**.

      - tipo: calcular
        titulo: Cuántas tienen enlace de hidrógeno
        pregunta: |
          Y de las cuatro, ¿en cuántas hay enlace de hidrógeno entre sus
          moléculas?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has contado el cloroformo. Es polar y tiene un hidrógeno, pero
              ese hidrógeno cuelga de un **carbono**, no de N, O o F. Sin eso
              no hay enlace de hidrógeno: hay dipolo-dipolo, que es bastante
              más flojo.
          - valor: '1'
            mensaje: |
              El agua no es la única. El amoníaco también lo tiene: su
              hidrógeno cuelga del nitrógeno, que está en la lista de los tres.
        pista: |
          La condición es que el hidrógeno esté unido directamente a N, O o F.
        desarrollo: |
          Solo el **H₂O** y el **NH₃**. La regla no es «que la molécula sea muy
          polar» ni «que tenga hidrógenos»: es que el hidrógeno cuelgue de
          nitrógeno, oxígeno o flúor, que son los tres átomos lo bastante
          pequeños y electronegativos para dejarlo casi desnudo.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La polaridad de una molécula es la suma vectorial de los dipolos de sus enlaces, así que depende de la geometría y no solo de los enlaces.'
          - texto: 'El CCl₄ tiene cuatro enlaces polares iguales en un tetraedro regular, y por eso su suma es cero: solo tiene fuerzas de dispersión.'
          - texto: 'El CHCl₃ es el mismo tetraedro con un sustituyente cambiado, la suma ya no se cierra y aparecen fuerzas dipolo-dipolo.'
          - texto: 'El H₂O y el NH₃ tienen el hidrógeno colgando de O y de N, así que además presentan enlace de hidrógeno.'
          - texto: 'El CHCl₃ hierve por encima del H₂O porque su molécula es mucho más pesada.'
            trampa: true
            mensaje: |
              No hierve por encima: el cloroformo hierve a 61 °C y el agua a
              100, teniendo el cloroformo casi siete veces más masa molar. Esa
              comparación es precisamente la prueba de que el enlace de
              hidrógeno pesa más que la masa. Las fuerzas de dispersión crecen
              con el tamaño, sí, pero aquí no compensan.
    resolucion: |
      ## Enlace polar y molécula polar no son lo mismo

      Es la distinción que más se cobra en este apartado, y el CCl₄ es el
      contraejemplo perfecto: **sus enlaces son los más polares de las cuatro
      moléculas y la molécula es apolar**. El momento dipolar es un vector, y
      cuatro vectores iguales repartidos en un tetraedro regular suman cero.

      | molécula | geometría | ¿polar? | fuerzas intermoleculares |
      |---|---|---|---|
      | CCl₄ | tetraédrica | no | dispersión |
      | CHCl₃ | tetraédrica, un sustituyente distinto | sí | dispersión + dipolo-dipolo |
      | H₂O | angular | sí | + enlace de hidrógeno |
      | NH₃ | pirámide trigonal | sí | + enlace de hidrógeno |

      **La cadena que hay que recorrer siempre, y en este orden:**

      1. Lewis, para saber cuántos pares hay alrededor del átomo central.
      2. La geometría **molecular**, contando los pares libres.
      3. La suma vectorial de los dipolos: ¿se cancela?
      4. Y solo entonces las fuerzas, que se acumulan: dispersión las tiene
         todo; dipolo-dipolo, las polares; enlace de hidrógeno, únicamente si
         hay H unido a N, O o F.

      **El error que decide el ejercicio del examen** es el paso 4 con el
      cloroformo: tiene un hidrógeno y es polar, y aun así no hay enlace de
      hidrógeno, porque ese hidrógeno cuelga de un carbono. Lo que se puntúa no
      es contestar que no, es **decir por qué no**.
  - id: ejfq3-los-escalones-del-ciclo
    titulo: El ciclo del cloruro de magnesio, contando escalones
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura; los datos son valores tabulados
      de uso corriente.
    nivel: ejemplo
    enunciado: |
      Calcular la energía reticular del MgCl₂ con un ciclo de Born-Haber, a
      partir de estos datos, todos en kJ/mol:

      | | |
      |---|---|
      | sublimación del Mg (s) | +148 |
      | disociación del Cl₂ (g) | +244 |
      | 1.ª energía de ionización del Mg | +738 |
      | 2.ª energía de ionización del Mg | +1451 |
      | afinidad electrónica del Cl | −349 |
      | entalpía de formación del MgCl₂ (s) | −641 |
    pide: La energía reticular del MgCl₂, en kJ/mol.

    pasos:
      - tipo: reconocer
        pregunta: |
          El ciclo del NaCl empieza sublimando el sodio. Aquí el cloro no se
          sublima. ¿Por qué?
        opciones:
          - texto: 'Porque el Cl₂ ya es un gas: lo que hay que hacer con él es disociarlo en átomos'
            correcta: true
            mensaje: |
              Exacto, y es la comprobación que hay que hacer **antes** de
              montar cualquier ciclo: mirar en qué estado está cada elemento en
              condiciones estándar. Un sólido se sublima, un gas diatómico se
              disocia, y un elemento que ya es gas monoatómico no necesita ni
              una cosa ni la otra.
          - texto: Porque los no metales nunca se subliman
            correcta: false
            mensaje: |
              Sí lo hacen cuando son sólidos. El yodo es un no metal **sólido**,
              y el ciclo de un yoduro lleva su escalón de sublimación además
              del de disociación. Es justamente el caso que cae en el examen.
          - texto: Porque la sublimación del cloro es despreciable
            correcta: false
            mensaje: |
              No es que sea pequeña: es que no existe en este ciclo. El punto
              de partida del cloro es Cl₂ gaseoso, y de ahí no hay ningún
              cambio de estado que dar.
          - texto: Porque el cloro entra como ion y no como átomo
            correcta: false
            mensaje: |
              Entra como Cl₂ gaseoso, que es su forma estándar. Llegar hasta el
              ion cuesta dos escalones —disociar y luego captar el electrón—, y
              los dos están en el ciclo.

      - tipo: calcular
        titulo: El camino largo hasta los iones gaseosos
        pregunta: |
          Suma los escalones que llevan de los elementos en su estado estándar
          hasta Mg²⁺(g) y 2 Cl⁻(g). ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '1883'
          tolerancia: 3
          formato: la energía en kJ/mol, con su signo
        distractores:
          - valor: '2232'
            mensaje: |
              Has contado una sola afinidad electrónica. Hacen falta **dos**
              cloruros por cada magnesio, así que la afinidad entra dos veces:
              $2\times(-349) = -698$.
          - valor: '432'
            mensaje: |
              Parece que te has dejado la segunda ionización. El magnesio pierde
              **dos** electrones para llegar a Mg²⁺, y el segundo cuesta casi el
              doble que el primero porque ya se arranca de un catión.
          - valor: '2581'
            mensaje: |
              Ese es el total sin restar nada por las afinidades. Captar un
              electrón libera energía, así que los −349 de cada cloro entran
              con su signo negativo.
        pista: |
          Sublimar, disociar, ionizar dos veces y captar dos electrones.
        desarrollo: |
          $$
          148 + 244 + 738 + 1451 + 2\times(-349) = 1883\ \text{kJ/mol}
          $$

          Fíjate en el peso de cada término: las dos ionizaciones solas son
          2189, más que todo lo demás junto.

      - tipo: calcular
        titulo: La energía reticular
        pregunta: |
          Los dos caminos tienen que costar lo mismo. ¿Cuánto vale entonces la
          energía reticular del MgCl₂?
        respuesta:
          tipo: numero
          valor: '2524'
          tolerancia: 5
          formato: la energía reticular en kJ/mol, en valor absoluto
        distractores:
          - valor: '1242'
            mensaje: |
              Has restado la entalpía de formación en vez de sumarla. Es
              negativa, así que restarla suma: $1883 - (-641) = 2524$.
          - valor: '641'
            mensaje: |
              Esa es la entalpía de formación, que es lo que se mide. La
              reticular es lo que se busca, y es cuatro veces mayor: el ciclo
              existe precisamente porque las dos no se parecen.
        pista: |
          El camino corto es la entalpía de formación. Iguala los dos.
        desarrollo: |
          Como la entalpía es función de estado, el camino corto y el largo
          valen lo mismo:

          $$
          \Delta H_f = 1883 - U
          \quad\Rightarrow\quad
          U = 1883 - \Delta H_f = 1883 + 641 = 2524\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Antes de montar el ciclo se mira el estado estándar de cada elemento: el Mg es sólido y hay que sublimarlo, el Cl₂ es gas y hay que disociarlo.'
          - texto: 'La fórmula MgCl₂ dice cuántas veces entra cada escalón: dos ionizaciones para el magnesio y dos afinidades electrónicas, una por cloro.'
          - texto: 'El camino largo hasta los iones gaseosos suma 1883 kJ/mol, dominado por las dos ionizaciones.'
          - texto: 'Igualando los dos caminos, la energía reticular sale 2524 kJ/mol, cuatro veces la entalpía de formación.'
          - texto: 'La energía reticular del MgCl₂ es mayor que la del NaCl porque el magnesio tiene más protones.'
            trampa: true
            mensaje: |
              Es mayor —2524 frente a 788— y el motivo no es el número de
              protones sino la **carga del ion**. La ley de Coulomb multiplica
              las cargas: pasar de Na⁺ a Mg²⁺ dobla el producto, y además el
              Mg²⁺ es más pequeño que el Na⁺, con lo que la distancia también
              juega a favor. Los protones del núcleo no aparecen en esa
              fórmula.
    resolucion: |
      ## El ciclo se monta leyendo la fórmula y la tabla periódica

      Antes de sumar nada hay que decidir **qué escalones tiene** el ciclo, y
      eso no se copia del ejemplo del NaCl: se lee de dos sitios.

      **De la tabla periódica, el estado de cada elemento.** El magnesio es
      sólido: se sublima. El cloro es un gas diatómico: se disocia. Si el no
      metal fuese sólido —el yodo, por ejemplo— habría que sublimarlo *y*
      disociarlo, dos escalones donde el cloro tiene uno.

      **De la fórmula, cuántas veces entra cada uno.** MgCl₂ pide Mg²⁺, o sea
      dos ionizaciones, y dos cloruros, o sea dos afinidades electrónicas.

      Con eso el ciclo queda:

      $$
      \Delta H_f = \Delta H_{\text{sub}} + D + I_1 + I_2 + 2\,AE - U
      $$

      $$
      -641 = 148 + 244 + 738 + 1451 - 698 - U
      \quad\Rightarrow\quad
      U = 2524\ \text{kJ/mol}
      $$

      **Lo que conviene mirar del resultado.** La energía reticular es cuatro
      veces la entalpía de formación en valor absoluto. Eso no es un accidente
      del MgCl₂: la formación es la diferencia pequeña entre dos números
      grandes —lo que cuesta hacer los iones y lo que devuelve juntarlos—, y
      por eso no sirve para estimar la reticular ni al revés. El ciclo no es
      una comodidad, es la única vía.

      **Y la comparación con el NaCl**, que es la pregunta de teoría que
      acompaña siempre: 2524 contra 788. El salto lo explica la ley de
      Coulomb, $E = k\,Q_+Q_-/r$, con las cargas multiplicando: 2×1 frente a
      1×1, y encima con iones más pequeños.

  - id: colfq3-ion19-el-ciclo-del-bromuro-de-calcio
    titulo: El ciclo del bromuro de calcio, con un bromo que empieza líquido
    fuente: >-
      Ejercicio de la lámina 19 · Diapositivas del tema 3, Enlace químico:
      enlace iónico · Fundamentos Químicos de la Ingeniería (25975), Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El material publica la
      resolución, el ciclo dibujado con su balance; el diagnóstico de los
      errores es nuestro.
    nivel: practica
    enunciado: |
      Representa el ciclo de Born-Haber para el bromuro de calcio en estado
      sólido y establece el balance energético para calcular la energía
      reticular partiendo de Ca (*s*) y Br₂ (*l*) como reactivos.
    pide: El ciclo de Born-Haber del CaBr₂ y el balance que da su energía reticular.

    pasos:
      - tipo: reconocer
        pregunta: |
          El bromo entra como Br₂ líquido. ¿Qué hay que hacerle antes de que
          sus átomos puedan captar electrones?
        opciones:
          - texto: >-
              Vaporizarlo y después disociarlo: Br₂(l) → Br₂(g) → 2 Br(g)
            correcta: true
            mensaje: |
              Eso es. Un líquido no se disocia en átomos gaseosos de un salto:
              primero pasa a gas, $\Delta H_v$, y después se rompe la molécula,
              $\Delta H_D$. Son dos escalones donde el cloro del NaCl tiene uno.
          - texto: >-
              Disociarlo directamente, igual que el Cl₂ del ciclo del NaCl
            mensaje: |
              El Cl₂ se disocia directamente porque ya es un gas en condiciones
              estándar. El bromo no: es líquido, y la disociación que dan las
              tablas es la de la molécula gaseosa. Falta la vaporización.
          - texto: >-
              Sublimarlo y después disociarlo
            mensaje: |
              Sublimar es pasar de sólido a gas, y eso es lo que se le hace al
              calcio, o al yodo, que es un halógeno sólido. El bromo es
              líquido: se vaporiza.
          - texto: >-
              Disociar medio mol, ½ΔHD, como en el NaCl
            mensaje: |
              El NaCl lleva un solo cloro por fórmula, así que basta medio mol
              de Cl₂. El CaBr₂ lleva dos bromos: hace falta un mol entero de
              Br₂ para sacar 2 Br(g), y la disociación entra entera.

      - tipo: dibujar
        consigna: |
          Dibuja el ciclo: arriba los reactivos, Ca(s) + Br₂(l), y el producto,
          CaBr₂(s); abajo, escalón a escalón, hasta Ca²⁺(g) + 2 Br⁻(g). Pon el
          nombre de cada flecha, la de la formación y la de la energía
          reticular, y escribe debajo el balance.
        comprueba:
          - punto: Por el lado del calcio hay tres flechas, la sublimación y dos ionizaciones.
            porque: |
              Ca(s) → Ca(g) → Ca⁺(g) → Ca²⁺(g). El bromuro de calcio lleva
              Ca²⁺, así que el calcio pierde dos electrones y hacen falta
              $EI_1$ y $EI_2$. Con una sola el ciclo acaba en Ca⁺, que no es el
              ion del cristal.
          - punto: Por el lado del bromo, la vaporización va antes que la disociación.
            porque: |
              Br₂(l) → Br₂(g) → 2 Br(g). Sin $\Delta H_v$ el ciclo empezaría
              en Br₂ gaseoso, que no es el reactivo del enunciado.
          - punto: La disociación es de un mol entero de Br₂, y la afinidad va multiplicada por dos.
            porque: |
              Hacen falta dos bromuros por cada calcio: un mol de Br₂ da los
              dos átomos, y cada uno capta su electrón. Es $\Delta H_D$ y
              $2\,AE$, no el $\tfrac{1}{2}\Delta H_D$ y la $AE$ sola del NaCl.
          - punto: La formación une los reactivos con el CaBr₂(s) directamente, y la energía reticular une el cristal con los iones gaseosos.
            porque: |
              El ciclo son dos caminos entre los mismos dos estados. El corto
              es $\Delta H^{0}_f$, que se mide; el largo acaba con el paso de
              los iones al cristal, y ese es el que se despeja.
          - punto: 'Debajo, el balance: ΔH°f = ΔHs + EI₁ + EI₂ + ΔHv + ΔHD + 2AE − U.'
            porque: |
              Es la igualdad de los dos caminos. Si escribes $+\Delta H$ en vez
              de $-U$ también vale, siempre que digas que $\Delta H = -U$: el
              escalón que baja al cristal libera lo que cuesta separarlo.
        figura: |
          <svg viewBox="0 0 470 300" role="img" width="470" height="300"
               aria-labelledby="bh3cb-t bh3cb-d">
            <title id="bh3cb-t">El ciclo de Born-Haber del bromuro de calcio</title>
            <desc id="bh3cb-d">Arriba, calcio sólido más bromo líquido, y a la derecha el bromuro de calcio sólido, unidos por la flecha de la entalpía de formación. Por la columna del calcio bajan tres escalones: sublimación hasta calcio gas, primera ionización hasta Ca más y segunda ionización hasta Ca dos más. Por la columna del bromo bajan otros tres: vaporización hasta bromo gas, disociación hasta dos átomos de bromo y dos afinidades electrónicas hasta dos iones bromuro. Desde los iones gaseosos sube al cristal la flecha del delta H de red, y del cristal baja a los iones la energía reticular U, que es la misma con el signo cambiado. Debajo, el balance.</desc>
            <style>
              .bh3cb-t { fill: var(--ink); font-size: 13px; }
              .bh3cb-e { fill: var(--live); font-size: 11px; }
              .bh3cb-p { stroke: var(--live); stroke-width: 1.6; fill: none; }
              .bh3cb-h { stroke: var(--flag); stroke-width: 1.8; fill: none; }
              .bh3cb-u { stroke: var(--alt); stroke-width: 1.8; fill: none; }
              .bh3cb-f { stroke: var(--faint); stroke-width: 1.4; fill: none; }
            </style>
            <text class="bh3cb-t" x="40" y="30">Ca (s)</text>
            <text class="bh3cb-t" x="140" y="30">+</text>
            <text class="bh3cb-t" x="190" y="30">Br₂ (l)</text>
            <text class="bh3cb-t" x="360" y="30">CaBr₂ (s)</text>
            <path class="bh3cb-f" d="M258 25 L352 25" marker-end="url(#bh3cb-mf)"/>
            <text class="bh3cb-e" x="305" y="18" text-anchor="middle" style="fill: var(--faint)">ΔH°f</text>

            <text class="bh3cb-t" x="40" y="100">Ca (g)</text>
            <text class="bh3cb-t" x="140" y="100">+</text>
            <text class="bh3cb-t" x="190" y="100">Br₂ (g)</text>
            <text class="bh3cb-t" x="36" y="170">Ca⁺ (g)</text>
            <text class="bh3cb-t" x="140" y="170">+</text>
            <text class="bh3cb-t" x="186" y="170">2 Br (g)</text>
            <text class="bh3cb-t" x="34" y="240">Ca²⁺ (g)</text>
            <text class="bh3cb-t" x="140" y="240">+</text>
            <text class="bh3cb-t" x="186" y="240">2 Br⁻ (g)</text>

            <path class="bh3cb-p" d="M60 38 L60 84" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="68" y="66">ΔHs</text>
            <path class="bh3cb-p" d="M60 108 L60 154" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="68" y="136">EI₁</text>
            <path class="bh3cb-p" d="M60 178 L60 224" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="68" y="206">EI₂</text>

            <path class="bh3cb-p" d="M212 38 L212 84" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="220" y="66">ΔHv</text>
            <path class="bh3cb-p" d="M212 108 L212 154" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="220" y="136">ΔHD</text>
            <path class="bh3cb-p" d="M212 178 L212 224" marker-end="url(#bh3cb-mp)"/>
            <text class="bh3cb-e" x="220" y="206">2 AE</text>

            <path class="bh3cb-h" d="M262 244 L372 244 L372 42" marker-end="url(#bh3cb-mh)"/>
            <text class="bh3cb-e" x="352" y="150" text-anchor="end" style="fill: var(--flag)">ΔH = −U</text>
            <path class="bh3cb-u" d="M420 40 L420 256 L268 256" marker-end="url(#bh3cb-mu)"/>
            <text class="bh3cb-e" x="428" y="150" style="fill: var(--alt)">U</text>

            <text class="bh3cb-t" x="235" y="288" text-anchor="middle">ΔH°f = ΔHs + EI₁ + EI₂ + ΔHv + ΔHD + 2AE − U</text>
            <defs>
              <marker id="bh3cb-mp" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--live)"/></marker>
              <marker id="bh3cb-mh" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--flag)"/></marker>
              <marker id="bh3cb-mu" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/></marker>
              <marker id="bh3cb-mf" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--faint)"/></marker>
            </defs>
          </svg>

      - tipo: calcular
        titulo: Los escalones del camino largo
        pregunta: |
          ¿Cuántos escalones tiene el camino largo, desde Ca(s) + Br₂(l) hasta
          Ca²⁺(g) + 2 Br⁻(g)? Cuenta las dos afinidades como un solo escalón,
          $2\,AE$, igual que la lámina.
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Son los cuatro del camino largo del NaCl: sublimar, disociar,
              ionizar y captar.
              Aquí hay dos más, y los dos salen de mirar el enunciado: el
              calcio es Ca²⁺ y necesita la segunda ionización, y el bromo es
              líquido y necesita vaporizarse.
          - valor: '5'
            mensaje: |
              Te falta uno de los dos escalones nuevos: la vaporización del
              bromo, porque es líquido, o la segunda ionización del calcio,
              porque el ion del cristal es Ca²⁺. Los dos son obligatorios.
          - valor: '7'
            mensaje: |
              Has contado de más, casi seguro la formación o la energía
              reticular. Esas no son del camino largo: la formación es el
              camino corto, y la reticular es el paso de los iones al cristal,
              que es la incógnita. El camino largo acaba en los iones gaseosos.
        pista: |
          Tres por el calcio (sublimar, ionizar dos veces) y tres por el bromo
          (vaporizar, disociar, captar).
        desarrollo: |
          Por el calcio: $\Delta H_s$, $EI_1$, $EI_2$. Por el bromo:
          $\Delta H_v$, $\Delta H_D$, $2\,AE$. Son seis, dos más que en el ciclo
          del NaCl, y cada uno de los dos que se añaden sale de una línea del
          enunciado: «Ca²⁺» pide la segunda ionización y «Br₂ (*l*)» pide la
          vaporización.

      - tipo: calcular
        titulo: Cuánta disociación entra
        pregunta: |
          En el balance, la energía de disociación del Br₂ entra multiplicada
          por un número. ¿Por cuál?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: un número, entero o decimal
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese ½ es el del NaCl, que solo necesita un átomo de cloro, medio
              mol de Cl₂. El CaBr₂ necesita dos átomos de bromo, y eso es un mol
              entero de Br₂: la disociación entra una vez, entera.
          - valor: '2'
            mensaje: |
              Has doblado la disociación porque hay dos bromos. Pero una sola
              molécula de Br₂ ya da los dos átomos: lo que va por dos es la
              afinidad, un electrón por átomo, no la ruptura de la molécula.
        pista: |
          ¿Cuántas moléculas de Br₂ hacen falta para tener 2 Br(g)?
        desarrollo: |
          $$
          \mathrm{Br_2(g)} \rightarrow 2\,\mathrm{Br(g)} \qquad \Delta H_D
          $$

          Una molécula da los dos átomos que pide la fórmula, así que
          $\Delta H_D$ entra con coeficiente 1. Lo que se multiplica por dos es
          la afinidad: $2\,AE$, un electrón por cada átomo de bromo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de los elementos en su estado estándar: el calcio es
              sólido y el bromo, líquido.
          - texto: >-
              El calcio se sublima y pierde dos electrones: $\Delta H_s$,
              $EI_1$ y $EI_2$.
          - texto: >-
              El bromo se vaporiza, un mol de Br₂ se disocia en 2 Br(g) y cada
              átomo capta un electrón: $\Delta H_v$, $\Delta H_D$ y $2\,AE$.
          - texto: >-
              Los dos caminos cuestan lo mismo:
              $\Delta H^{0}_f = \Delta H_s + EI_1 + EI_2 + \Delta H_v + \Delta H_D + 2AE - U$.
          - texto: >-
              Como el bromo es un halógeno igual que el cloro, su parte del
              ciclo se copia de la del NaCl, con $\tfrac{1}{2}\Delta H_D$ y una
              sola afinidad.
            trampa: true
            mensaje: |
              Ser del mismo grupo no hace el mismo ciclo. El cloro es gas y el
              bromo líquido, así que aquí hay una vaporización que en el NaCl no
              existe. Y la fórmula manda los coeficientes: dos bromos por calcio
              piden $\Delta H_D$ entera y $2\,AE$.
        veredicto: |
          El ciclo se lee en dos sitios: el estado de cada reactivo dice qué
          escalones hay, y la fórmula dice cuántas veces entra cada uno.

    resolucion: |
      **Qué escalones lleva, y por qué.** Antes de dibujar nada se miran dos
      cosas. El **estado de cada reactivo**: el calcio es sólido, se sublima; el
      bromo es líquido, se vaporiza y después se disocia. Y la **fórmula**:
      CaBr₂ pide Ca²⁺, dos ionizaciones, y dos bromuros, un mol entero de Br₂ y
      dos afinidades.

      $$
      \begin{aligned}
      &\mathrm{Ca(s)} \rightarrow \mathrm{Ca(g)} && \Delta H_s \\
      &\mathrm{Ca(g)} \rightarrow \mathrm{Ca^{+}(g)} + \mathrm{e^-} && EI_1 \\
      &\mathrm{Ca^{+}(g)} \rightarrow \mathrm{Ca^{2+}(g)} + \mathrm{e^-} && EI_2 \\
      &\mathrm{Br_2(l)} \rightarrow \mathrm{Br_2(g)} && \Delta H_v \\
      &\mathrm{Br_2(g)} \rightarrow 2\,\mathrm{Br(g)} && \Delta H_D \\
      &2\,\mathrm{Br(g)} + 2\,\mathrm{e^-} \rightarrow 2\,\mathrm{Br^{-}(g)} && 2\,AE \\
      &\mathrm{Ca^{2+}(g)} + 2\,\mathrm{Br^{-}(g)} \rightarrow \mathrm{CaBr_2(s)} && \Delta H = -U
      \end{aligned}
      $$

      **El balance.** La entalpía es función de estado, así que ir de los
      reactivos al cristal cuesta lo mismo por el camino corto que por el
      largo:

      $$
      \Delta H^{0}_f = \Delta H_s + EI_1 + EI_2 + \Delta H_v + \Delta H_D + 2AE - U
      $$

      y de ahí se despeja $U$ en cuanto se tienen los números. Es el balance
      que da la resolución del material, que lo escribe también con
      $+\Delta H$ en lugar de $-U$: son lo mismo, porque bajar de los iones al
      cristal libera lo que cuesta separarlo.

      **Los dos escalones que se olvidan** son justo los que distinguen este
      ciclo del del NaCl, y los dos se leen en el enunciado:

      - la **segunda ionización**, porque el ion es Ca²⁺ y no Ca⁺;
      - la **vaporización**, porque el bromo es líquido. Con yodo, que es
        sólido, sería una sublimación; con cloro, que es gas, no habría nada.

      Y un coeficiente que se copia mal: en el NaCl la disociación va por ½
      porque hay un cloro por fórmula. Aquí hay dos bromos, y un mol de Br₂ da
      exactamente esos dos átomos: $\Delta H_D$ entera.

  - id: colfq3-ion20-la-energia-reticular-del-fluoruro-de-litio
    titulo: La energía reticular del fluoruro de litio, y el flúor que entra a medias
    fuente: >-
      Ejercicio de la lámina 20 · Diapositivas del tema 3, Enlace químico:
      enlace iónico · Fundamentos Químicos de la Ingeniería (25975), Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica la
      solución del ejercicio, pero su tabla de la lámina 18 da 1017 kJ/mol
      para el LiF, y es lo que sale; la lámina 15, con datos de otra fuente,
      da 1036. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcula la energía reticular del compuesto LiF mediante el Ciclo de
      Born-Haber.

      Datos: energía de sublimación del litio = 155,2 kJ/mol, EI₁ del litio =
      520 kJ/mol, energía de disociación del flúor = 150,6 kJ/mol, AE₁ del
      flúor = −328 kJ/mol y entalpía de formación del fluoruro de litio (s) =
      −594,1 kJ/mol.
    pide: La energía reticular del LiF, en kJ/mol.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la energía de disociación del flúor, 150,6 kJ/mol.
          ¿Cuánta entra en el ciclo del LiF?
        opciones:
          - texto: >-
              La mitad, 75,3 kJ/mol: el LiF lleva un solo flúor, y eso es medio
              mol de F₂
            correcta: true
            mensaje: |
              Eso es. La disociación tabulada es la de un mol de F₂, que da dos
              átomos. Un mol de LiF solo necesita uno, así que entra
              $\tfrac{1}{2}\Delta H_D$, igual que el cloro en el ciclo del NaCl.
          - texto: >-
              Entera, 150,6 kJ/mol, porque es el dato que da el enunciado
            mensaje: |
              El dato es por mol de F₂, y el ciclo es por mol de LiF. Con la
              disociación entera estarías rompiendo una molécula de más: la
              energía reticular saldría 75 kJ/mol por encima.
          - texto: >-
              Ninguna, porque el flúor ya es un gas
            mensaje: |
              Que sea gas le ahorra la vaporización, no la disociación. Lo que
              capta el electrón es un átomo de flúor, F(g), y el reactivo es la
              molécula F₂(g): hay que romperla.
          - texto: >-
              El doble, porque la molécula de flúor tiene dos átomos
            mensaje: |
              Es al revés: como una molécula da dos átomos, para un solo flúor
              basta media molécula. El doble solo haría falta con cuatro átomos
              de flúor por fórmula.

      - tipo: calcular
        titulo: El camino largo hasta los iones gaseosos
        pregunta: |
          Suma los escalones que llevan de Li(s) + ½ F₂(g) hasta
          Li⁺(g) + F⁻(g). ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '422.5'
          tolerancia: 1
          formato: la energía en kJ/mol, con su signo y un decimal
        distractores:
          - valor: '497.8'
            mensaje: |
              Has metido la disociación entera, 150,6. El LiF lleva un solo
              átomo de flúor, así que entra la mitad, 75,3:
              $155{,}2 + 520 + 75{,}3 - 328 = 422{,}5$.
          - valor: '1078.5'
            mensaje: |
              Has sumado la afinidad como si fuera positiva. Captar el electrón
              libera energía, y el dato ya viene con su signo, −328: se suma
              tal cual, que es restar 328.
          - valor: '347.2'
            mensaje: |
              Te falta la disociación del flúor. El F₂ es gas, pero es una
              molécula: antes de que el flúor capte un electrón hay que
              romperla, y eso cuesta 75,3 kJ/mol.
        pista: |
          Sublimar el litio, disociar medio mol de F₂, ionizar el litio y
          captar el electrón con el flúor.
        desarrollo: |
          $$
          \Delta H_s + EI_1 + \tfrac{1}{2}\Delta H_D + AE_1 = 155{,}2 + 520 + 75{,}3 - 328 = 422{,}5\ \text{kJ/mol}
          $$

          Hacer los iones sueltos cuesta 422,5 kJ/mol. Lo que falta para
          llegar a −594,1 lo pone el paso de los iones al cristal.

      - tipo: calcular
        titulo: La energía reticular
        pregunta: |
          Iguala los dos caminos. ¿Cuánto vale la energía reticular $U$ del
          LiF?
        respuesta:
          tipo: numero
          valor: '1016.6'
          tolerancia: 1
          formato: la energía reticular en kJ/mol, positiva como la define el tema
        distractores:
          - valor: '1091.9'
            mensaje: |
              Arrastras la disociación entera del paso anterior. Con 75,3 en vez
              de 150,6, el camino largo es 422,5 y la reticular
              $422{,}5 + 594{,}1 = 1016{,}6$.
          - valor: '171.6'
            mensaje: |
              Has pasado el 422,5 al otro lado sin cambiarle el signo:
              $\Delta H = -594{,}1 + 422{,}5 = -171{,}6$, y $U = 171{,}6$. De
              $-594{,}1 = 422{,}5 + \Delta H$ sale
              $\Delta H = -594{,}1 - 422{,}5 = -1016{,}6$, y $U = 1016{,}6$.
          - valor: '-1016.6'
            mensaje: |
              Ese es el $\Delta H$ del último escalón, el de los iones que caen
              al cristal, y es negativo porque libera. La energía reticular es
              la de separarlos, la misma con el signo cambiado: positiva.
        pista: |
          $\Delta H^{0}_f = 422{,}5 + \Delta H$, y $U = -\Delta H$.
        desarrollo: |
          $$
          -594{,}1 = 422{,}5 + \Delta H
          \quad\Longrightarrow\quad
          \Delta H = -1016{,}6\ \text{kJ/mol}
          \quad\Longrightarrow\quad
          U = 1016{,}6\ \text{kJ/mol}
          $$

          Redondeado, 1017 kJ/mol: el valor del LiF en la tabla de la lámina
          18.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El litio es sólido y se sublima; el flúor es un gas diatómico y
              basta disociar medio mol.
          - texto: >-
              Hacer los iones gaseosos cuesta
              $155{,}2 + 520 + 75{,}3 - 328 = 422{,}5$ kJ/mol.
          - texto: >-
              Igualando los dos caminos, el paso de los iones al cristal vale
              $-594{,}1 - 422{,}5 = -1016{,}6$ kJ/mol.
          - texto: >-
              La energía reticular es ese valor con el signo cambiado, 1017
              kJ/mol, el de la tabla de la lámina 18.
          - texto: >-
              Sale menor que la del NaCl, 788 kJ/mol, porque los iones del LiF
              son más ligeros y se atraen menos.
            trampa: true
            mensaje: |
              Sale **mayor**, 1017 frente a 788, y la masa no pinta nada en la
              ley de Coulomb. Las cargas son las mismas en los dos, así que
              decide la distancia: Li⁺ y F⁻ son más pequeños que Na⁺ y Cl⁻,
              están más cerca y se atraen más.
        veredicto: |
          La reticular es mucho mayor que la formación en valor absoluto: la
          formación es la diferencia pequeña entre lo que cuesta hacer los
          iones y lo que devuelve juntarlos.

    resolucion: |
      **Los escalones.** El litio es sólido, se sublima; el flúor es un gas
      diatómico, se disocia, y como el LiF lleva un solo flúor basta medio mol
      de F₂. Un electrón pasa del litio al flúor:

      $$
      \Delta H^{0}_f = \Delta H_s + EI_1 + \tfrac{1}{2}\Delta H_D + AE_1 + \Delta H
      $$

      $$
      -594{,}1 = 155{,}2 + 520 + 75{,}3 - 328 + \Delta H
      \quad\Longrightarrow\quad
      \Delta H = -1016{,}6\ \text{kJ/mol}
      $$

      $$
      U = -\Delta H = \boxed{1016{,}6 \approx 1017\ \text{kJ/mol}}
      $$

      **El contraste.** El material no resuelve este ejercicio, pero trae la
      respuesta en otra lámina: la tabla de la 18 da 1017 kJ/mol para el LiF.
      La tabla de la lámina 15 da 1036, y no es un error de la cuenta: las dos
      tablas vienen de manuales distintos, que usan datos de partida algo
      distintos. Con los del enunciado sale 1017.

      **Los dos sitios donde se cae:**

      - **La disociación entera.** 150,6 es por mol de F₂; el LiF lleva medio.
      - **El signo al despejar.** $U = 422{,}5 - (-594{,}1)$: la formación es
        negativa, y restarla suma.

      **La lectura.** Hacer los iones sueltos cuesta 422,5 kJ/mol y juntarlos
      devuelve 1016,6: el cristal existe porque lo segundo gana de lejos. Y
      gana más que en el NaCl, 788, porque los iones del LiF son más pequeños y
      están más cerca, con las mismas cargas.

  - id: colfq3-ion21a-el-cloruro-de-sodio-y-cuando-conduce
    titulo: El cloruro de sodio, y en qué estado conduce
    fuente: >-
      Primer ejercicio de la lámina 21 · Diapositivas del tema 3, Enlace
      químico: enlace iónico · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica
      solución: la respuesta es nuestra.
    nivel: practica
    enunciado: |
      ¿En cuál de los siguientes estados conduce la electricidad el cloruro de
      sodio? a) sólido, b) fundido y c) disuelto en agua. Responde
      razonadamente.
    pide: En qué estados conduce el NaCl, y por qué.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para que algo conduzca la electricidad tiene que haber cargas que se
          puedan mover. En el cloruro de sodio, ¿qué cargas son?
        opciones:
          - texto: >-
              Los iones Na⁺ y Cl⁻, que solo se mueven si la red se deshace
            correcta: true
            mensaje: |
              Eso es. Los portadores ya existen en el sólido; lo que les falta
              es libertad. Fundir o disolver deshace la red y los suelta.
          - texto: >-
              Electrones libres, como en un metal
            mensaje: |
              En el NaCl el electrón del sodio ha pasado al cloro y se ha
              quedado allí: no hay mar de electrones. Eso es lo que distingue
              un sólido iónico de uno metálico.
          - texto: >-
              Ninguna: el cloruro de sodio es neutro y no puede conducir nunca
            mensaje: |
              El conjunto es neutro, pero está hecho de cargas, Na⁺ y Cl⁻.
              Conducir no exige carga neta; exige cargas que se desplacen.
          - texto: >-
              Los protones del núcleo de los átomos
            mensaje: |
              Los núcleos no se mueven por el material: van con su ion. Lo que
              lleva la corriente en un iónico es el ion entero.

      - tipo: calcular
        titulo: En cuántos estados conduce
        pregunta: |
          De los tres estados del enunciado, ¿en cuántos conduce la
          electricidad el cloruro de sodio?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Solo has contado uno de los dos. Fundido y disuelto pasa lo mismo:
              la red se deshace y los iones quedan libres, en un caso rodeados
              de otros iones y en el otro rodeados de agua.
          - valor: '3'
            mensaje: |
              En el sólido no conduce. Los iones están, pero fijos en sus
              posiciones de la red, y un ion que no se mueve no lleva
              corriente. Es la diferencia con un metal.
        pista: |
          ¿En qué estados pueden moverse los iones?
        desarrollo: |
          En dos, fundido y disuelto. En el sólido los iones ocupan posiciones
          fijas; al fundir la red se deshace, y al disolver cada ion se separa
          y queda rodeado de moléculas de agua. En los dos casos hay iones que
          se mueven.

      - tipo: redactar
        que: deduccion
        consigna: |
          Contesta el ejercicio como en el examen: los tres estados, uno por
          uno, diciendo en cada uno si conduce y por qué.
        rubrica:
          - punto: Dice que la corriente en un iónico la llevan los iones, no los electrones.
            porque: |
              Es la premisa de todo lo demás. Quien escribe «conduce porque
              tiene electrones libres» ha descrito un metal, y esa frase le
              quita el apartado aunque acierte los tres estados.
            minimo: true
          - punto: En el sólido no conduce porque los iones están fijos en la red.
            porque: |
              No basta «no conduce». Lo que se puntúa es el porqué: los
              portadores existen, pero no pueden desplazarse.
            minimo: true
          - punto: Fundido conduce porque la red se deshace y los iones quedan libres.
            porque: |
              Es el mismo argumento con el signo contrario, y enlaza con el
              tema 4: conducir solo fundido es la firma del sólido iónico.
          - punto: Disuelto conduce porque los iones se separan y se mueven entre las moléculas de agua.
            porque: |
              Cuenta nombrar que cada ion queda rodeado de agua. Decir solo
              «el agua conduce» es falso: el agua pura apenas conduce.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              En el cloruro de sodio la corriente la tienen que llevar los
              iones Na⁺ y Cl⁻.
          - texto: >-
              En el sólido los iones ocupan posiciones fijas de la red: no
              conduce.
          - texto: >-
              Al fundirlo la red se deshace y los iones se mueven: conduce.
          - texto: >-
              Al disolverlo en agua los iones se separan, rodeados de moléculas
              de agua, y se mueven: conduce.
          - texto: >-
              Disuelto conduce porque el agua es buena conductora de la
              electricidad.
            trampa: true
            mensaje: |
              El agua pura apenas conduce. Lo que conduce en la disolución son
              los iones del NaCl, que al disolverse quedan libres. Sin ellos,
              en el mismo vaso de agua no pasaría corriente.
        veredicto: |
          Los iones están siempre; lo que cambia de un estado a otro es si se
          pueden mover.

    resolucion: |
      **Lo que lleva la corriente.** En un compuesto iónico no hay electrones
      libres: el electrón del sodio ha pasado al cloro. Las cargas que pueden
      moverse son los propios iones, Na⁺ y Cl⁻, y conducirá en los estados en
      que se puedan desplazar.

      | estado | ¿conduce? | por qué |
      |---|---|---|
      | a) sólido | no | los iones están fijos en sus posiciones de la red |
      | b) fundido | sí | la red se deshace y los iones quedan libres |
      | c) disuelto en agua | sí | los iones se separan, rodeados de agua, y se mueven |

      **El error que cuesta el apartado** es el de «disuelto conduce porque el
      agua conduce». El agua pura es muy mala conductora: lo que conduce son
      los iones que aporta la sal.

      **Y la consecuencia que se usa en el tema 4.** Conducir fundido y no en
      sólido es la firma de un sólido iónico. Un metal conduce ya en sólido,
      porque sus electrones están deslocalizados; un sólido molecular no
      conduce, y la mayoría de los covalentes tampoco (el grafito es la
      excepción).

  - id: colfq3-ion21b-el-cloruro-de-berilio-que-no-se-disuelve
    titulo: El cloruro de berilio, que no se disuelve, y cómo saber si es iónico
    fuente: >-
      Segundo ejercicio de la lámina 21 · Diapositivas del tema 3, Enlace
      químico: enlace iónico · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica
      solución: la respuesta es nuestra. El enunciado escribe «BeCl», y el
      compuesto es BeCl₂. Las electronegatividades son las de la tabla de la
      lámina 6.
    nivel: practica
    enunciado: |
      El berilio y el cloro forman el compuesto químico BeCl. ¿Cómo se puede
      determinar si el compuesto es iónico o no? (El compuesto no se disuelve
      en agua).

      *El enunciado escribe BeCl: el compuesto es BeCl₂. El berilio es del
      grupo 2A y se combina con dos cloros.*
    pide: Un ensayo que diga si el cloruro de berilio es iónico, y qué predice la electronegatividad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El compuesto no se disuelve en agua. ¿Qué ensayo sirve entonces para
          decidir si es iónico?
        opciones:
          - texto: >-
              Fundirlo y ver si el líquido conduce la electricidad
            correcta: true
            mensaje: |
              Eso es. Un iónico no conduce en sólido y sí fundido, porque al
              fundir los iones quedan libres. Como no se puede disolver, el
              fundido es el estado en que sus iones, si los tiene, se moverían.
          - texto: >-
              Ver si el sólido conduce la electricidad
            mensaje: |
              Un sólido iónico tampoco conduce: sus iones están fijos en la red.
              Que el sólido no conduzca no distingue un iónico de un covalente.
          - texto: >-
              Disolverlo en agua y medir la conductividad de la disolución
            mensaje: |
              Es el ensayo habitual, y el enunciado lo descarta a propósito: el
              compuesto no se disuelve. Hay que buscar otra forma de liberar los
              iones, y la única es fundirlo.
          - texto: >-
              No hace falta ensayo: al ser insoluble en agua, no puede ser iónico
            mensaje: |
              Hay compuestos iónicos insolubles, como el carbonato de calcio. La
              solubilidad tiene demasiadas excepciones para decidir el tipo de
              enlace; la conductividad del fundido no.

      - tipo: calcular
        titulo: La diferencia de electronegatividad
        pregunta: |
          Con la tabla de la lámina 6 (Be 1,5; Cl 3,0), ¿cuánto vale la
          diferencia de electronegatividad entre el berilio y el cloro?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.05
          formato: un número positivo, con un decimal
        distractores:
          - valor: '4.5'
            mensaje: |
              Has sumado las dos. Lo que mide lo desigual del reparto es la
              diferencia, $3{,}0 - 1{,}5$.
          - valor: '2.0'
            mensaje: |
              Has tomado 3,5 para el cloro, que es el valor del oxígeno. En la
              tabla de la lámina 6 el cloro tiene 3,0, y la diferencia se queda
              en 1,5.
        pista: |
          Resta la menor de la mayor.
        desarrollo: |
          $$
          \Delta EN = 3{,}0 - 1{,}5 = 1{,}5
          $$

          La lámina 6 da como criterio que un enlace iónico tiene una
          diferencia de aproximadamente 2 o más. Con 1,5 el cloruro de berilio
          queda del lado covalente: se espera que el fundido no conduzca.

      - tipo: calcular
        titulo: La fórmula del compuesto
        pregunta: |
          El berilio es del grupo 2A y el cloro del 7A. ¿Cuál es la fórmula del
          compuesto que forman?
        respuesta:
          tipo: formula
          valor: BeCl2
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: BeCl
            mensaje: |
              Así lo escribe el enunciado, y es una errata. El berilio tiene dos
              electrones de valencia y cada cloro acepta uno: hacen falta dos
              cloros por berilio.
          - valor: Be2Cl
            mensaje: |
              Has cruzado al revés. El berilio aporta dos electrones y el cloro
              toma uno, así que el que va por dos es el cloro, no el berilio.
        pista: |
          El berilio pierde, o comparte, dos electrones; cada cloro toma uno.
        desarrollo: |
          Be²⁺ con Cl⁻ necesita dos cloros para que la carga se cierre:
          BeCl₂. Aunque el enlace no sea iónico, la proporción es la misma:
          el berilio pone dos electrones en juego y cada cloro uno.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Un compuesto iónico no conduce en sólido, pero sí fundido o
              disuelto, porque entonces sus iones se mueven.
          - texto: >-
              Como el compuesto no se disuelve en agua, el ensayo es fundirlo
              y ver si el líquido conduce.
          - texto: >-
              Si el fundido conduce, es iónico; si no, sus átomos comparten
              electrones y es covalente.
          - texto: >-
              La electronegatividad lo anticipa: $3{,}0 - 1{,}5 = 1{,}5$, por
              debajo del 2 que la lámina 6 pide a un enlace iónico.
          - texto: >-
              El berilio es un metal y el cloro un no metal, así que el enlace
              es iónico sin necesidad de ningún ensayo.
            trampa: true
            mensaje: |
              «Metal más no metal» es la regla de andar por casa, y aquí falla:
              la diferencia de electronegatividad es solo de 1,5. El berilio es
              un átomo muy pequeño que retiene sus electrones, y por eso el
              enunciado pregunta cómo **determinarlo**, no cómo suponerlo.
        veredicto: |
          Si no se puede disolver, se funde: el ensayo siempre es liberar los
          iones y ver si llevan corriente.

    resolucion: |
      **El ensayo.** Un compuesto iónico no conduce en estado sólido, porque
      sus iones están fijos en la red, y sí conduce cuando la red se deshace:
      fundido o disuelto. Como este no se disuelve en agua, queda el otro
      camino: **fundirlo y medir si el líquido conduce**. Si conduce, hay
      iones libres y es iónico; si no, es covalente.

      **Lo que predice la electronegatividad.** Con la tabla de la lámina 6,

      $$
      \Delta EN = 3{,}0 - 1{,}5 = 1{,}5
      $$

      por debajo del 2 aproximado que la lámina 6 da para un enlace iónico.
      Así que lo esperable es que el fundido **no** conduzca: el cloruro de
      berilio queda del lado covalente, aunque junte un metal con un no metal.

      **La fórmula.** El enunciado escribe «BeCl», y es una errata: el berilio
      es del grupo 2A y se combina con dos cloros, BeCl₂.

      **Lo que enseña.** «Metal más no metal, iónico» es un atajo, no una ley.
      El berilio es el metal alcalinotérreo más pequeño, retiene sus
      electrones, y con el cloro los comparte. Por eso la pregunta es cómo se
      **determina**: con un ensayo, no con una etiqueta.

  - id: colfq3-ion21c-cuatro-parejas-ionico-o-covalente
    titulo: Cuatro parejas de elementos, y dos que empatan a 2,0
    fuente: >-
      Tercer ejercicio de la lámina 21 · Diapositivas del tema 3, Enlace
      químico: enlace iónico · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica
      solución: la respuesta es nuestra. Las electronegatividades son las de
      la tabla de la lámina 6.
    nivel: practica
    enunciado: |
      Para cada uno de los siguientes pares de elementos, indica si el
      compuesto que se puede formar es iónico o covalente. Escribe la fórmula
      y el nombre de cada compuesto: a) I y Cl, b) Mg y F, c) B y F, d) K y Br.
    pide: Si cada compuesto es iónico o covalente, con su fórmula y su nombre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con la tabla de la lámina 6, B–F y K–Br dan la misma diferencia de
          electronegatividad: $4{,}0 - 2{,}0 = 2{,}0$ y $2{,}8 - 0{,}8 = 2{,}0$.
          ¿Qué los separa?
        opciones:
          - texto: >-
              Qué clase de elementos son: el potasio es un metal alcalino y el
              boro no es un metal
            correcta: true
            mensaje: |
              Eso es. El «aproximadamente 2» de la lámina 6 es una frontera
              borrosa, y justo en ella decide la otra regla: metal con no metal,
              iónico; no metal con no metal, covalente. El KBr es una sal y el
              BF₃ un gas molecular.
          - texto: >-
              Nada: con la misma diferencia, los dos compuestos son del mismo
              tipo
            mensaje: |
              La diferencia de electronegatividad es una guía, no un
              interruptor, y en la frontera no decide. El BF₃ es un gas formado
              por moléculas; el KBr, un sólido iónico que funde a más de 700 °C.
          - texto: >-
              Que el flúor es el más electronegativo, así que el BF₃ es el
              iónico
            mensaje: |
              El flúor es el más electronegativo, pero en la diferencia cuenta
              el otro átomo también. El boro no es un metal, no forma cationes
              B³⁺ estables, y comparte los electrones con el flúor.
          - texto: >-
              El tamaño de la molécula: la más grande es la covalente
            mensaje: |
              El tamaño no decide el tipo de enlace. Lo que decide es si un
              átomo cede de verdad sus electrones al otro, y un metal alcalino
              como el potasio lo hace; el boro no.

      - tipo: calcular
        titulo: Cuántos son iónicos
        pregunta: |
          De los cuatro compuestos, ¿cuántos son iónicos?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has aplicado la regla «diferencia de 2 o más, iónico» a secas, y
              te ha metido el BF₃, que da justo 2,0. Boro y flúor son dos no
              metales: comparten electrones. Los iónicos son el MgF₂ y el KBr.
          - valor: '1'
            mensaje: |
              Te has quedado solo con el MgF₂, que da 2,8. El KBr da 2,0, en la
              frontera, pero es un metal alcalino con un halógeno: una sal
              iónica de libro. En la frontera decide el tipo de elemento.
        pista: |
          Calcula las cuatro diferencias y, donde salga 2,0, mira si hay un
          metal.
        desarrollo: |
          | pareja | diferencia | clase | enlace |
          |---|---|---|---|
          | I y Cl | $3{,}0 - 2{,}5 = 0{,}5$ | no metal + no metal | covalente |
          | Mg y F | $4{,}0 - 1{,}2 = 2{,}8$ | metal + no metal | iónico |
          | B y F | $4{,}0 - 2{,}0 = 2{,}0$ | no metal + no metal | covalente |
          | K y Br | $2{,}8 - 0{,}8 = 2{,}0$ | metal + no metal | iónico |

          Dos iónicos, el MgF₂ y el KBr.

      - tipo: calcular
        titulo: La fórmula del fluoruro de magnesio
        pregunta: |
          El magnesio es del grupo 2A y el flúor del 7A. ¿Cuál es la fórmula del
          compuesto?
        respuesta:
          tipo: formula
          valor: MgF2
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: MgF
            mensaje: |
              Así la carga no se cierra: Mg²⁺ con un solo F⁻ deja una carga
              positiva de sobra. Hacen falta dos fluoruros.
          - valor: Mg2F
            mensaje: |
              Has cruzado al revés. El 2 del magnesio baja al flúor, no al
              revés: un Mg²⁺ y dos F⁻.
        pista: |
          Mg²⁺ y F⁻: ¿cuántos fluoruros neutralizan un magnesio?
        desarrollo: |
          Mg²⁺ y F⁻: dos fluoruros por magnesio, MgF₂, fluoruro de magnesio.

      - tipo: calcular
        titulo: La fórmula del compuesto de boro y flúor
        pregunta: |
          El boro tiene tres electrones de valencia y el flúor siete. ¿Cuál es
          la fórmula del compuesto que forman?
        respuesta:
          tipo: formula
          valor: BF3
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: BF
            mensaje: |
              El boro pone en juego sus tres electrones de valencia y cada flúor
              necesita uno para completar su octeto: son tres flúor, no uno.
          - valor: B3F
            mensaje: |
              Has cruzado al revés. El que va por tres es el flúor: un boro
              comparte un electrón con cada uno de tres flúor.
        pista: |
          Cada flúor comparte un electrón con el boro, y el boro tiene tres.
        desarrollo: |
          Tres enlaces B–F: BF₃, trifluoruro de boro. Es la molécula que el
          tema usa como ejemplo de hibridación $sp^{2}$ y de octeto incompleto:
          el boro se queda con seis electrones.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              I y Cl son dos no metales con una diferencia de 0,5: ICl,
              monocloruro de yodo, covalente.
          - texto: >-
              Mg y F dan una diferencia de 2,8, metal con no metal: MgF₂,
              fluoruro de magnesio, iónico.
          - texto: >-
              B y F son dos no metales: BF₃, trifluoruro de boro, covalente.
          - texto: >-
              K y Br son un metal alcalino y un halógeno: KBr, bromuro de
              potasio, iónico.
          - texto: >-
              B–F y K–Br dan los dos una diferencia de 2,0, así que los dos
              compuestos son del mismo tipo.
            trampa: true
            mensaje: |
              La misma diferencia no hace el mismo enlace cuando se está en la
              frontera. La lámina 6 dice «aproximadamente 2», y justo ahí decide
              si hay un metal que ceda sus electrones: el potasio sí, el boro
              no.
        veredicto: |
          La diferencia de electronegatividad orienta; en la frontera, manda
          saber si hay un metal.

    resolucion: |
      **Las cuatro diferencias**, con la tabla de la lámina 6:

      | pareja | diferencia | compuesto | nombre | enlace |
      |---|---|---|---|---|
      | a) I y Cl | 0,5 | ICl | monocloruro de yodo | covalente |
      | b) Mg y F | 2,8 | MgF₂ | fluoruro de magnesio | iónico |
      | c) B y F | 2,0 | BF₃ | trifluoruro de boro | covalente |
      | d) K y Br | 2,0 | KBr | bromuro de potasio | iónico |

      **Los dos fáciles.** El ICl, con 0,5, es covalente sin discusión: dos
      halógenos que comparten un par. El MgF₂, con 2,8, es iónico sin
      discusión: el magnesio cede sus dos electrones, uno a cada flúor.

      **Los dos que empatan.** Con los valores de la lámina, B–F y K–Br dan
      exactamente 2,0, y la lámina 6 da como criterio «aproximadamente ≥ 2».
      Con eso no se puede decidir, y el ejercicio parece pensado para que se
      note. Decide la otra regla del tema: **metal con no metal, iónico; no
      metal con no metal, covalente**. El potasio es un metal alcalino que
      cede su electrón: KBr es una sal. El boro no es un metal: comparte sus
      tres electrones con tres flúor y el BF₃ es una molécula, la del ejemplo
      de hibridación $sp^{2}$ del tema.

      **Las fórmulas** salen de los electrones que pone en juego cada uno:
      magnesio dos, boro tres, potasio uno, y cada halógeno toma o comparte
      uno.

  - id: colfq3-ion22a-tres-parejas-y-su-energia-reticular
    titulo: Tres parejas de iónicos, y quién gana en energía reticular
    fuente: >-
      Primer ejercicio de la lámina 22 · Diapositivas del tema 3, Enlace
      químico: enlace iónico · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica
      solución: la respuesta es nuestra. La tabla de la lámina 18 confirma las
      dos primeras parejas con números.
    nivel: practica
    enunciado: |
      Para cada uno de los siguientes pares de compuestos iónicos, indica cuál
      de ellos tiene la mayor energía reticular y justifica la respuesta:

      a) KCl o MgO

      b) LiF o LiBr

      c) Mg₃N₂ o NaCl
    pide: El compuesto de mayor energía reticular de cada pareja, justificado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Según $E = k\,\dfrac{Q_{+}Q_{-}}{r}$, ¿qué decide la energía
          reticular?
        opciones:
          - texto: >-
              El producto de las cargas de los iones, que pesa mucho, y la
              distancia entre ellos, que divide
            correcta: true
            mensaje: |
              Eso es. Primero se miran las cargas, porque multiplican; si
              empatan, decide el tamaño de los iones. Es el orden que hay que
              seguir en las tres parejas.
          - texto: >-
              La masa molar del compuesto: cuanto más pesado, más energía
            mensaje: |
              La masa no aparece en la ley de Coulomb. El LiF es mucho más
              ligero que el LiBr y tiene más energía reticular.
          - texto: >-
              El número de iones de la fórmula: cuantos más, más energía
            mensaje: |
              El número de iones cambia algo, pero lo que manda es cuánta carga
              lleva cada uno. El MgO tiene dos iones, igual que el KCl, y su
              energía reticular es más de cinco veces mayor.
          - texto: >-
              La electronegatividad del no metal: cuanto más electronegativo,
              más energía
            mensaje: |
              La electronegatividad dice si el enlace es iónico, no cuánto se
              atraen los iones una vez formados. Para eso hay que mirar sus
              cargas y su distancia.

      - tipo: calcular
        titulo: Cuánto pesan las cargas
        pregunta: |
          Con la tabla de la lámina 18 (MgO 3890 kJ/mol, KCl 699 kJ/mol),
          ¿cuántas veces mayor es la energía reticular del MgO que la del KCl?
        respuesta:
          tipo: numero
          valor: '5.565'
          tolerancia: 0.05
          formato: un número, con dos decimales
        distractores:
          - valor: '0.1797'
            mensaje: |
              Has dividido al revés, 699 entre 3890. Lo que se pregunta es
              cuántas veces cabe la del KCl en la del MgO: la grande arriba.
          - valor: '3191'
            mensaje: |
              Esa es la diferencia, en kJ/mol. La pregunta es cuántas veces
              mayor, y eso es un cociente.
        pista: |
          Divide la del MgO entre la del KCl.
        desarrollo: |
          $$
          \frac{3890}{699} = 5{,}57
          $$

          El producto de cargas pasa de $1 \times 1$ a $2 \times 2$, cuatro
          veces más, y además el Mg²⁺ y el O²⁻ son más pequeños que el K⁺ y el
          Cl⁻: por eso sale más de cuatro.

      - tipo: calcular
        titulo: El producto de cargas del nitruro de magnesio
        pregunta: |
          ¿Cuánto vale el producto de las cargas de los iones, en valor
          absoluto, en el Mg₃N₂?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Has sumado las cargas, 2 + 3. En la ley de Coulomb van
              multiplicando: $|Q_{+}Q_{-}| = 2 \times 3$.
          - valor: '1'
            mensaje: |
              Ese es el del NaCl, con Na⁺ y Cl⁻. En el Mg₃N₂ los iones son Mg²⁺
              y N³⁻.
        pista: |
          El magnesio es Mg²⁺ y el nitrógeno forma N³⁻.
        desarrollo: |
          $$
          |Q_{+}Q_{-}| = 2 \times 3 = 6
          $$

          frente a $1 \times 1 = 1$ en el NaCl. Seis veces más en el numerador
          de Coulomb: el Mg₃N₂ gana de calle.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La energía reticular crece con el producto de las cargas y al
              disminuir la distancia entre los iones.
          - texto: >-
              a) El MgO, con cargas 2+ y 2−, frente a 1+ y 1− del KCl: 3890
              frente a 699 kJ/mol.
          - texto: >-
              b) El LiF: las cargas empatan, y el F⁻ es más pequeño que el Br⁻,
              así que los iones están más cerca. 1017 frente a 787 kJ/mol.
          - texto: >-
              c) El Mg₃N₂: sus cargas, 2+ y 3−, dan un producto seis veces mayor
              que el del NaCl.
          - texto: >-
              b) El LiBr, porque el bromo es más pesado que el flúor y sus iones
              se atraen con más fuerza.
            trampa: true
            mensaje: |
              La masa no está en la ley de Coulomb. Con cargas iguales decide la
              distancia, y el Br⁻ es mucho más grande que el F⁻: en el LiBr los
              iones están más lejos y se atraen menos. La tabla de la lámina 18
              lo confirma, 787 frente a 1017.
        veredicto: |
          Primero las cargas, porque multiplican. Solo si empatan, el tamaño.

    resolucion: |
      **El criterio.** La energía reticular sigue la ley de Coulomb,
      $E = k\,Q_{+}Q_{-}/r$: crece con el **producto de las cargas** y al
      **disminuir la distancia** entre los iones. Las cargas pesan más, porque
      multiplican, así que se miran primero.

      **a) KCl o MgO → MgO.** Las cargas pasan de 1+ y 1− a 2+ y 2−: el
      producto se multiplica por cuatro. Y además el Mg²⁺ y el O²⁻ son más
      pequeños que el K⁺ y el Cl⁻. La tabla de la lámina 18 da 3890 frente a
      699 kJ/mol, más de cinco veces.

      **b) LiF o LiBr → LiF.** Las cargas empatan, 1+ y 1−, así que decide el
      tamaño: el F⁻ es mucho más pequeño que el Br⁻, y en el LiF los iones
      están más cerca. La tabla da 1017 frente a 787 kJ/mol.

      **c) Mg₃N₂ o NaCl → Mg₃N₂.** El magnesio es Mg²⁺ y el nitrógeno forma
      N³⁻: producto de cargas 6, frente a 1 en el NaCl. El material no da el
      número, y no hace falta: con ese factor en el numerador no hay tamaño
      que lo compense.

      **El error que hay que evitar** es razonar con la masa. «El bromo es
      más pesado» no dice nada sobre la atracción entre iones; «el bromuro es
      más grande» sí, y en contra.

  - id: colfq3-ion22b-los-cloruros-alrededor-del-788
    titulo: Tres cloruros alrededor de los 788 del cloruro de sodio
    fuente: >-
      Segundo ejercicio de la lámina 22 · Diapositivas del tema 3, Enlace
      químico: enlace iónico · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no publica
      solución: la respuesta es nuestra. La gráfica de la lámina 16 da las
      cuatro energías reticulares y confirma el orden.
    nivel: practica
    enunciado: |
      Teniendo en cuenta que la energía reticular del cloruro de sodio es 788
      kJ/mol, ordena los siguientes compuestos en orden creciente de energías
      reticulares: cloruro de litio, cloruro de potasio y cloruro de rubidio
      (con respecto al cloruro de sodio).
    pide: El orden creciente de energía reticular de LiCl, KCl y RbCl, situando el NaCl.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los cuatro cloruros tienen el mismo anión y cationes de la misma
          carga, 1+. ¿Qué decide entonces el orden?
        opciones:
          - texto: >-
              El tamaño del catión: cuanto más grande, más lejos del Cl⁻ y menos
              energía reticular
            correcta: true
            mensaje: |
              Eso es. Con las cargas empatadas, solo queda la distancia. Y el
              radio del catión crece al bajar por el grupo 1A: Li⁺ < Na⁺ < K⁺ <
              Rb⁺.
          - texto: >-
              La masa del catión: cuanto más pesado, más energía reticular
            mensaje: |
              La masa no está en la ley de Coulomb. El rubidio es el más
              pesado de los cuatro y es el que tiene la energía reticular más
              baja.
          - texto: >-
              Nada: con las mismas cargas, los cuatro tienen la misma energía
              reticular
            mensaje: |
              Las cargas empatan, pero la distancia no. El Li⁺ es mucho más
              pequeño que el Rb⁺, y eso acerca el anión y sube la energía.
          - texto: >-
              La electronegatividad del metal: cuanto menor, más energía
              reticular
            mensaje: |
              La electronegatividad decide si el enlace es iónico, y los cuatro
              lo son. Una vez hechos los iones, la atracción depende de su
              carga y de su distancia.

      - tipo: calcular
        titulo: Cuántos quedan por debajo del NaCl
        pregunta: |
          De los tres cloruros del enunciado, ¿cuántos tienen menor energía
          reticular que el cloruro de sodio?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has puesto también el de litio por debajo, quizá porque es el más
              ligero. Es el más pequeño, y eso es lo que cuenta: el Li⁺ deja al
              Cl⁻ más cerca que el Na⁺, y su energía reticular es mayor que 788.
          - valor: '1'
            mensaje: |
              Solo has puesto el de rubidio. El potasio también está por debajo
              del sodio en el grupo: K⁺ es más grande que Na⁺, y el KCl tiene
              menos energía reticular que el NaCl.
        pista: |
          Ordena los cationes por tamaño: Li⁺ < Na⁺ < K⁺ < Rb⁺.
        desarrollo: |
          El KCl y el RbCl, cuyos cationes son más grandes que el Na⁺. El LiCl
          queda por encima. La gráfica de la lámina 16 da los números: RbCl
          691, KCl 701, NaCl 788 y LiCl 834 kJ/mol.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Los cuatro cloruros tienen el mismo anión y cationes de carga 1+:
              las cargas empatan.
          - texto: >-
              Decide la distancia, y el radio del catión crece al bajar por el
              grupo: Li⁺ < Na⁺ < K⁺ < Rb⁺.
          - texto: >-
              A catión más grande, iones más separados y menos energía
              reticular.
          - texto: >-
              El orden creciente es RbCl < KCl < NaCl (788 kJ/mol) < LiCl.
          - texto: >-
              El LiCl va el primero porque el litio es el metal más ligero y
              atrae menos al cloruro.
            trampa: true
            mensaje: |
              El litio es el más ligero, pero la masa no entra en la atracción
              entre iones. Es también el más pequeño, y eso sí entra: el Cl⁻
              queda más cerca y la energía reticular es la mayor de las cuatro,
              834 kJ/mol en la lámina 16.
        veredicto: |
          En una misma familia de sales, el ion más pequeño da la red más
          fuerte.

    resolucion: |
      **Lo que se compara.** Los cuatro cloruros comparten el anión, Cl⁻, y
      sus cationes tienen todos carga 1+. Con las cargas empatadas, la
      energía reticular solo depende de la distancia entre los iones, es
      decir, del tamaño del catión. Y ese crece al bajar por el grupo 1A:

      $$
      \mathrm{Li^{+}} < \mathrm{Na^{+}} < \mathrm{K^{+}} < \mathrm{Rb^{+}}
      $$

      A catión más grande, más distancia y menos energía reticular:

      $$
      \boxed{\mathrm{RbCl} < \mathrm{KCl} < \mathrm{NaCl}\ (788) < \mathrm{LiCl}}
      $$

      **Los números**, de la gráfica de la lámina 16: RbCl 691, KCl 701, NaCl
      788 y LiCl 834 kJ/mol. Fíjate en que del KCl al RbCl la diferencia es de
      solo 10 kJ/mol: los cationes grandes ya se parecen mucho en tamaño.

      **Una advertencia sobre las tablas.** El LiCl aparece con tres valores
      en las diapositivas del tema: 853 en la lámina 15, 834 en la 16 y 828 en
      la 18. Vienen de manuales distintos y no cambian el orden, pero conviene
      no mezclar números de tablas distintas en una misma comparación.

  - id: colfq3-inter28-la-hidracina-y-el-enlace-de-hidrogeno
    titulo: Cuatro sustancias con hidrógeno, y solo una con enlace de hidrógeno
    fuente: >-
      Ejercicio de la lámina 28 · Diapositivas del tema 3, Enlace químico:
      fuerzas intermoleculares · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no
      publica solución: la respuesta es nuestra. La lámina escribe «or» por
      «o».
    nivel: practica
    enunciado: |
      ¿En cuál de las siguientes sustancias es probable que los enlaces de
      hidrógeno desempeñen un papel importante en la determinación de sus
      propiedades físicas: metano (CH₄), hidracina (H₂NNH₂), fluoruro de
      metilo (CH₃F) or sulfuro de hidrógeno (H₂S)?

      *La lámina escribe «or» por «o»: es una palabra que se quedó sin
      traducir.*
    pide: Cuál de las cuatro sustancias tiene enlaces de hidrógeno entre sus moléculas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición tiene que cumplir una molécula para formar enlaces de
          hidrógeno con otras iguales?
        opciones:
          - texto: >-
              Tener un hidrógeno unido directamente a N, O o F
            correcta: true
            mensaje: |
              Eso es, y la palabra que decide es **directamente**. Solo esos
              tres átomos son a la vez pequeños y muy electronegativos, y dejan
              el protón casi al descubierto para que lo atraiga un par
              solitario de otra molécula.
          - texto: >-
              Tener hidrógeno y algún átomo de N, O o F en la molécula
            mensaje: |
              Que estén los dos no es suficiente: el hidrógeno tiene que colgar del
              N, del O o del F. En el fluoruro de metilo hay flúor e hidrógenos,
              pero los hidrógenos están unidos al carbono.
          - texto: >-
              Ser polar
            mensaje: |
              Ser polar da fuerzas dipolo-dipolo, no enlace de hidrógeno. El
              H₂S es polar, y el fluoruro de metilo también, y ninguno forma
              enlaces de hidrógeno entre sus moléculas.
          - texto: >-
              Tener muchos hidrógenos
            mensaje: |
              El metano tiene cuatro y no forma ninguno: sus hidrógenos están
              unidos al carbono, que apenas los polariza. Lo que cuenta es a
              qué está unido el hidrógeno, no cuántos hay.

      - tipo: calcular
        titulo: Cuántas lo forman
        pregunta: |
          De las cuatro sustancias, ¿en cuántas hay enlaces de hidrógeno entre
          sus moléculas?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Casi seguro has contado el fluoruro de metilo porque lleva flúor.
              Pero sus tres hidrógenos cuelgan del carbono, no del flúor: ningún
              hidrógeno queda al descubierto. Solo la hidracina tiene H unido a
              N.
          - valor: '3'
            mensaje: |
              Además del fluoruro de metilo, has contado el sulfuro de
              hidrógeno. El azufre no está en la lista: es demasiado grande y
              poco electronegativo. El H₂S es polar, con fuerzas dipolo-dipolo,
              y por eso es un gas a temperatura ambiente y el agua no.
        pista: |
          Mira a qué átomo está unido cada hidrógeno.
        desarrollo: |
          - **CH₄**: H unido a C. No.
          - **H₂NNH₂**: cuatro H unidos a N, y cada N con un par solitario. Sí.
          - **CH₃F**: H unidos a C; el F no lleva ningún H. No.
          - **H₂S**: H unidos a S, que no es N, O ni F. No.

          Una, la hidracina.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El enlace de hidrógeno exige un H unido directamente a N, O o F.
          - texto: >-
              En el metano los hidrógenos cuelgan del carbono: solo hay fuerzas
              de dispersión.
          - texto: >-
              En la hidracina cada nitrógeno lleva dos hidrógenos y un par
              solitario: forma enlaces de hidrógeno.
          - texto: >-
              En el H₂S el hidrógeno está unido al azufre, que no es de la
              lista: hay dipolo-dipolo, no enlace de hidrógeno.
          - texto: >-
              El fluoruro de metilo también forma enlaces de hidrógeno, porque
              tiene flúor, el átomo más electronegativo.
            trampa: true
            mensaje: |
              Tener flúor no basta: el flúor no lleva ningún hidrógeno unido.
              Los tres hidrógenos del CH₃F cuelgan del carbono y no quedan al
              descubierto. Sus moléculas se atraen por dipolo-dipolo y
              dispersión.
        veredicto: |
          No es «tiene H» ni «tiene N, O o F»: es «tiene un H colgando de N, O
          o F».

    resolucion: |
      **La condición.** Una molécula forma enlaces de hidrógeno con otras
      iguales si tiene un **hidrógeno unido directamente a N, O o F**. Esos
      tres átomos, pequeños y muy electronegativos, le quitan al hidrógeno casi
      toda su nube, y el protón que queda atrae el par solitario de una
      molécula vecina.

      | sustancia | el H está unido a | enlace de hidrógeno |
      |---|---|---|
      | metano, CH₄ | C | no |
      | hidracina, H₂NNH₂ | N | **sí** |
      | fluoruro de metilo, CH₃F | C | no |
      | sulfuro de hidrógeno, H₂S | S | no |

      Solo en la **hidracina**. Es la misma interacción que en el amoniaco,
      N–H frente al par solitario de otro nitrógeno, pero con dos nitrógenos
      por molécula.

      **Las dos trampas del enunciado** son a propósito. El fluoruro de metilo
      tiene flúor y el H₂S se parece al agua, y ninguno forma enlaces de
      hidrógeno: en el primero el flúor no lleva hidrógenos, y en el segundo
      el hidrógeno está unido a un átomo, el azufre, demasiado grande. Lo que
      tienen los dos es dipolo-dipolo, además de la dispersión de siempre.

  - id: colfq3-inter37-gasolina-eter-y-ceras
    titulo: La gasolina, el éter y las ceras, explicados por sus fuerzas
    fuente: >-
      Ejercicio de la lámina 37 · Diapositivas del tema 3, Enlace químico:
      fuerzas intermoleculares · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no
      publica solución: la respuesta es nuestra. Las temperaturas de ebullición
      del paso de cálculo son las de la lámina 11 del tema 4.1.3.
    nivel: practica
    enunciado: |
      Explicar cada uno de los siguientes hechos experimentales:

      a) No podemos disolver gasolina en agua pero sí el etanol.

      b) Cuando se derraman unas gotas de dietiléter (“éter”), éste se evapora
      rápidamente; sin embargo, no es así cuando se trata de agua.

      c) Las ceras, cuyas moléculas son prácticamente apolares (fuerzas
      intermoleculares de London), tienen temperaturas de fusión y ebullición
      más altas que sustancias como el metanol, cuyas moléculas interactúan
      mediante puentes de hidrógeno.
    pide: La explicación de los tres hechos a partir de las fuerzas intermoleculares.

    pasos:
      - tipo: reconocer
        pregunta: |
          a) El etanol, CH₃CH₂OH, se mezcla con el agua y la gasolina no. ¿Qué
          tiene el etanol que no tiene la gasolina?
        opciones:
          - texto: >-
              Un grupo O–H, con el que forma enlaces de hidrógeno con el agua
            correcta: true
            mensaje: |
              Eso es. El agua está unida por enlaces de hidrógeno, y para
              meter otra molécula entre las suyas hay que romper algunos. El
              etanol los repone con su O–H; la gasolina, hecha de
              hidrocarburos apolares, no puede. Es «lo semejante disuelve a lo
              semejante» de la lámina 30.
          - texto: >-
              Una masa molar más pequeña
            mensaje: |
              La masa no decide si algo se disuelve. El metano es más ligero
              que el etanol y no se disuelve en agua: lo que cuenta es si
              puede atraer a las moléculas de agua como se atraen entre ellas.
          - texto: >-
              Más fuerzas de dispersión que la gasolina
            mensaje: |
              Es al revés: la gasolina tiene moléculas más grandes y más
              dispersión. Pero la dispersión no sustituye a los enlaces de
              hidrógeno del agua que habría que romper.
          - texto: >-
              Que es un líquido, y los líquidos se mezclan entre sí
            mensaje: |
              La gasolina también es líquida y no se mezcla. Dos líquidos solo
              se mezclan si sus moléculas se atraen de forma parecida.

      - tipo: calcular
        titulo: Cuánto más tarde hierve el agua
        pregunta: |
          b) Con los datos de la lámina 11 del tema 4.1.3, el dietiléter hierve
          a 34,6 °C y el agua a 100 °C. ¿Cuántos grados más alta es la
          temperatura de ebullición del agua?
        respuesta:
          tipo: numero
          valor: '65.4'
          tolerancia: 0.2
          formato: la diferencia en °C, con un decimal
        distractores:
          - valor: '43.7'
            mensaje: |
              Has comparado el éter con el etanol, que hierve a 78,3 °C. La
              pregunta es por el agua, a 100 °C.
          - valor: '134.6'
            mensaje: |
              Has sumado las dos temperaturas. La diferencia es una resta:
              $100 - 34{,}6$.
        pista: |
          Resta la del éter a la del agua.
        desarrollo: |
          $$
          100 - 34{,}6 = 65{,}4\ ^\circ\text{C}
          $$

          Sesenta y cinco grados de diferencia, y hierve más alto el más
          ligero: el éter tiene 74 g/mol y el agua 18. Lo que los separa es el
          enlace de hidrógeno del agua.

      - tipo: redactar
        que: deduccion
        consigna: |
          Explica los tres hechos, cada uno con las fuerzas intermoleculares de
          las sustancias que intervienen.
        rubrica:
          - punto: 'a) Nombra las fuerzas de cada uno: agua y etanol con enlace de hidrógeno, gasolina solo con dispersión.'
            porque: |
              La explicación es de semejanza de fuerzas, y sin nombrarlas no
              hay explicación. «El etanol es polar» se queda corto: lo que
              decide es el O–H.
            minimo: true
          - punto: 'a) Dice que el etanol forma enlaces de hidrógeno con el agua y la gasolina no puede.'
            porque: |
              Es el mecanismo: disolver obliga a romper enlaces de hidrógeno
              del agua, y solo se hace si el soluto los repone.
          - punto: 'b) El éter no tiene H unido a O: sus moléculas se atraen por dipolo-dipolo y dispersión, más débiles que el enlace de hidrógeno del agua.'
            porque: |
              Es el error más común del apartado: el éter tiene oxígeno y
              parece que debería formar enlaces de hidrógeno. Sus hidrógenos
              cuelgan de carbonos.
            minimo: true
          - punto: 'b) Relaciona fuerzas más débiles con presión de vapor más alta y evaporación más rápida.'
            porque: |
              El hecho observado es la evaporación, y el eslabón que falta si
              no se dice es la presión de vapor, o la temperatura de ebullición
              más baja: 34,6 °C frente a 100 °C.
          - punto: 'c) Las ceras son moléculas muy largas, con muchos electrones y mucha superficie de contacto: la suma de sus fuerzas de dispersión supera al enlace de hidrógeno de una molécula pequeña como el metanol.'
            porque: |
              Es el caso que rompe la regla «enlace de hidrógeno gana a
              dispersión», y lo que se puntúa es decir por qué: la dispersión
              crece con el tamaño, como muestran las láminas 16 y 20.
            minimo: true

      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              a) El agua y el etanol forman enlaces de hidrógeno entre sí; la
              gasolina, apolar, no puede, y no se disuelve.
          - texto: >-
              b) El éter no tiene hidrógenos unidos a oxígeno: sus moléculas se
              atraen menos que las del agua y escapan antes.
          - texto: >-
              b) Por eso el éter tiene más presión de vapor y hierve a 34,6 °C,
              y el agua a 100 °C.
          - texto: >-
              c) Las moléculas de cera son cadenas larguísimas: la dispersión,
              sumada a lo largo de toda la cadena, supera al enlace de
              hidrógeno de una molécula tan pequeña como el metanol.
          - texto: >-
              c) Las ceras funden más alto porque la dispersión de London es
              una fuerza más intensa que el enlace de hidrógeno.
            trampa: true
            mensaje: |
              Molécula a molécula, el enlace de hidrógeno es más intenso; la
              tabla de la lámina 32 pone la dispersión entre 1 y 10 kJ/mol y el
              enlace de hidrógeno entre 10 y 40. Lo que pasa en las ceras es que
              cada molécula es enorme y la dispersión se suma a lo largo de
              toda la cadena.
        veredicto: |
          El tipo de fuerza ordena moléculas de tamaño parecido. Cuando el
          tamaño es muy distinto, la dispersión puede ganar por acumulación.

    resolucion: |
      **a) La gasolina no se disuelve en agua y el etanol sí.** Las moléculas
      de agua se mantienen unidas por enlaces de hidrógeno. Para que otra
      sustancia se disuelva, sus moléculas tienen que meterse entre las del
      agua, rompiendo algunos de esos enlaces, y eso solo compensa si el
      soluto atrae al agua de forma parecida. El etanol tiene un grupo O–H y
      forma enlaces de hidrógeno con el agua: se disuelve. La gasolina es una
      mezcla de hidrocarburos apolares, con solo fuerzas de dispersión: no
      repone lo que rompe y no se disuelve. «Lo semejante disuelve a lo
      semejante», como dice la lámina 30.

      **b) El éter se evapora enseguida y el agua no.** El dietiléter,
      CH₃CH₂–O–CH₂CH₃, tiene oxígeno, pero ningún hidrógeno unido a él: sus
      moléculas se atraen por dipolo-dipolo y dispersión. El agua tiene
      enlaces de hidrógeno, mucho más intensos. Moléculas menos sujetas
      escapan antes: el éter tiene una presión de vapor mucho más alta y
      hierve a 34,6 °C, frente a los 100 °C del agua, aunque su masa molar es
      cuatro veces mayor.

      **c) Las ceras, apolares, funden más alto que el metanol.** Aquí parece
      que la regla falla, y no falla: se aplica a moléculas de tamaño
      parecido. Una cera está hecha de cadenas de muchos átomos de carbono,
      como la parafina y el polietileno de la lámina 19. La
      dispersión crece con el número de electrones y con la superficie de
      contacto, y en una cadena así se suma a lo largo de toda la molécula.
      El metanol, CH₃OH, forma enlaces de hidrógeno, pero es una molécula
      diminuta: la suma de muchas atracciones débiles supera a la de pocas
      fuertes.

      **Lo que deja el ejercicio.** Las fuerzas intermoleculares se comparan
      en dos tiempos: primero qué tipos tiene cada sustancia, y después, si
      los tamaños son muy distintos, cuánta dispersión acumula cada una.
