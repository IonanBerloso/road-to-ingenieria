ejercicios:
  # ── Los dos son NUESTROS (§08). El único ejercicio de examen de este tema
  #    encadena seis apartados sobre una molécula con doble enlace, y quien
  #    no haya hecho nunca un Lewis no puede ni empezar. Aquí se recorre la
  #    misma cadena dos veces sobre moléculas de tres y cuatro átomos: una
  #    que sale apolar y otra polar, que es la distinción que más cuesta.
  - id: ejfq3-el-dioxido-de-carbono-entero
    titulo: El dióxido de carbono, de Lewis a la polaridad
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para la molécula de CO₂, recorrer la cadena entera: electrones de
      valencia, número estérico del átomo central, geometría y polaridad.

      **Datos:** números atómicos C (6) y O (8). Electronegatividades
      C = 2,55 y O = 3,44.
    pide: Los electrones de valencia, el número estérico del carbono y si la molécula es polar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de dibujar nada. ¿Cuál de los dos elementos va en el centro y
          por qué?
        opciones:
          - texto: El carbono, por ser el menos electronegativo de los dos
            correcta: true
            mensaje: |
              Eso es. El átomo central es el que comparte con más vecinos, y
              el que menos tira de los electrones es el que mejor lo hace. El
              carbono tiene 2,55 frente a los 3,44 del oxígeno.
          - texto: El oxígeno, porque hay dos y el carbono solo uno
            mensaje: |
              La cantidad no decide: en el agua hay dos hidrógenos y el que va
              al centro es el oxígeno. Lo que decide es la electronegatividad,
              y aquí el oxígeno es el más electronegativo de los dos.
          - texto: El oxígeno, por tener más electrones de valencia
            mensaje: |
              Tener seis electrones de valencia en vez de cuatro no convierte
              a un átomo en central. De hecho es al revés: al oxígeno le
              faltan solo dos para el octeto, así que le basta con dos enlaces
              y no necesita rodearse.

      - tipo: calcular
        titulo: Los electrones de valencia
        pregunta: |
          Sumando lo que aporta cada átomo, ¿cuántos electrones de valencia
          hay que repartir en la estructura de Lewis del CO₂?
        respuesta:
          tipo: numero
          valor: '16'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '22'
            mensaje: |
              Has sumado los electrones **totales** de los tres átomos,
              $6 + 8 + 8$. En Lewis solo entran los de la capa de valencia,
              que son cuatro del carbono y seis de cada oxígeno.
          - valor: '10'
            mensaje: |
              Parece que has contado un solo oxígeno. Hay dos, y cada uno
              aporta sus seis.
          - valor: '24'
            mensaje: |
              Veinticuatro son los electrones que **caben** —ocho por átomo—,
              no los que hay. La diferencia entre las dos cifras es
              justamente lo que se comparte.
        pista: |
          El carbono es del grupo 14 y el oxígeno del 16. Aporta cada uno los
          de su grupo, y hay dos oxígenos.
        desarrollo: |
          $$
          1 \times 4 + 2 \times 6 = 16
          $$

          Y como caben $3 \times 8 = 24$, la diferencia $24 - 16 = 8$ son
          cuatro pares compartidos, es decir cuatro enlaces: dos dobles.

      - tipo: calcular
        titulo: El número estérico del carbono
        pregunta: |
          Con la estructura O=C=O delante, ¿cuál es el número estérico del
          átomo de carbono?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Has contado cada doble enlace como dos. A efectos de geometría
              **un doble enlace cuenta como una sola dirección**, porque el
              enlace $\pi$ se monta encima del $\sigma$ y no apunta a ningún
              sitio nuevo.
          - valor: '3'
            mensaje: |
              Parece que has sumado un par solitario al carbono. El carbono
              del CO₂ no tiene ninguno: sus cuatro electrones de valencia
              están los cuatro compartidos.
        pista: |
          Átomos unidos más pares solitarios, y un doble enlace cuenta por uno.
        desarrollo: |
          Dos átomos unidos y cero pares solitarios:

          $$
          2 + 0 = 2
          $$

          Número estérico 2 significa hibridación $sp$ y geometría lineal, con
          un ángulo O–C–O de 180°.

      - tipo: justificar
        pregunta: Ordena el argumento sobre la polaridad. Una pieza es falsa.
        piezas:
          - texto: 'Cada enlace C=O es polar: la diferencia de electronegatividad es 3,44 − 2,55 = 0,89 y el vector apunta hacia el oxígeno.'
          - texto: El número estérico del carbono es 2, así que la geometría molecular es lineal y los dos oxígenos están a 180°.
          - texto: 'Los dos vectores tienen el mismo módulo y sentidos opuestos: su suma es cero.'
          - texto: 'La molécula es apolar, aunque sus enlaces sean muy polares.'
          - texto: 'Como los dos enlaces son polares, la molécula tiene que ser polar: la polaridad de los enlaces se hereda.'
            trampa: true
            mensaje: |
              Es la confusión que este ejercicio existe para romper. La
              polaridad de la molécula **no se hereda** de sus enlaces: se
              obtiene sumando vectores sobre la geometría. Si la forma es
              simétrica, dipolos muy grandes pueden cancelarse del todo, y eso
              es exactamente lo que le pasa al CO₂.
    resolucion: |
      **El esqueleto.** El carbono va al centro por ser el menos
      electronegativo. Los electrones de valencia son

      $$
      1 \times 4 + 2 \times 6 = 16
      $$

      y con enlaces sencillos el carbono se quedaría con cuatro, muy lejos del
      octeto. Cerrando un doble enlace con cada oxígeno, los tres átomos
      llegan a ocho: la estructura es O=C=O, con dos pares solitarios en cada
      oxígeno.

      **La geometría.** El carbono tiene dos átomos unidos y ningún par
      solitario, así que su número estérico es 2. Eso da hibridación $sp$,
      geometría electrónica lineal y geometría molecular también lineal
      —no hay pares solitarios que esconder—, con un ángulo de 180°.

      **La polaridad, que es lo que enseña el ejercicio.** El enlace C=O es
      claramente polar: hay casi nueve décimas de diferencia de
      electronegatividad, y el vector apunta hacia el oxígeno. Pero los dos
      vectores son iguales y opuestos, así que

      $$
      \vec{\mu}_{\text{total}} = \vec{\mu}_1 + \vec{\mu}_2 = \vec{0}
      $$

      **El CO₂ es apolar teniendo los enlaces más polares de todo este
      ejercicio.** Compáralo con el agua, que tiene enlaces menos polares y sí
      es una molécula polar: la diferencia no está en el enlace, está en la
      forma. El agua es angular y sus dos vectores no se oponen.

      Ese contraste es el que hay que llevarse, porque el examen lo usa: pide
      primero la geometría y después la polaridad, en ese orden, precisamente
      porque la segunda depende de la primera.

  - id: ejfq3-el-amoniaco-y-las-dos-geometrias
    titulo: El amoniaco, y las dos geometrías que no son la misma
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para la molécula de NH₃, determinar el número estérico del nitrógeno,
      su hibridación, la geometría electrónica y la geometría molecular, y
      explicar por qué el ángulo de enlace no es el ideal.

      **Datos:** números atómicos H (1) y N (7).
    pide: El número estérico, las dos geometrías y el motivo de que el ángulo se cierre.

    pasos:
      - tipo: reconocer
        pregunta: |
          El nitrógeno tiene cinco electrones de valencia y forma tres
          enlaces. ¿Qué pasa con los otros dos?
        opciones:
          - texto: Se quedan como un par solitario sobre el nitrógeno
            correcta: true
            mensaje: |
              Exacto, y ese par es el protagonista del ejercicio. No se ve en
              la molécula pero ocupa sitio, empuja a los enlaces y decide
              tanto la forma como el ángulo.
          - texto: Se pierden, porque el nitrógeno solo necesita tres para el octeto
            mensaje: |
              Los electrones de valencia no se pierden al formar una molécula
              neutra: se reparten entre enlaces y pares solitarios. Y la
              cuenta del octeto sale precisamente contando los dos que
              quedan sueltos: tres enlaces dan seis, más dos, ocho.
          - texto: Forman un cuarto enlace con uno de los hidrógenos
            mensaje: |
              Un hidrógeno solo puede formar un enlace, porque solo tiene un
              orbital $1s$ y caben dos electrones. Si el nitrógeno usara ese
              par para enlazar, tendría que ser con un cuarto átomo, y aquí
              no hay ninguno.
          - texto: Se reparten entre los tres enlaces, que pasan a ser parciales
            mensaje: |
              Un enlace covalente comparte pares enteros, no fracciones. Los
              electrones sobrantes se quedan localizados en el átomo, y por
              eso se llaman pares **solitarios**.

      - tipo: calcular
        titulo: El número estérico del nitrógeno
        pregunta: |
          ¿Cuál es el número estérico del átomo de nitrógeno en el NH₃?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has contado solo los átomos unidos. El par solitario **también
              cuenta**, y es justo por eso que la molécula no es trigonal
              plana sino piramidal.
          - valor: '5'
            mensaje: |
              Parece que has contado los dos electrones del par solitario por
              separado. Un par cuenta como **uno**, igual que un enlace cuenta
              como uno aunque lleve dos electrones dentro.
        pista: |
          Átomos unidos más pares solitarios. Hay tres hidrógenos y un par.
        desarrollo: |
          $$
          3 + 1 = 4
          $$

          Número estérico 4 significa hibridación $sp^{3}$ y geometría
          electrónica tetraédrica.

      - tipo: reconocer
        pregunta: |
          Con geometría electrónica tetraédrica, ¿cuál es la geometría
          **molecular** del amoniaco?
        opciones:
          - texto: Pirámide trigonal
            correcta: true
            mensaje: |
              Eso es. La geometría molecular solo mira dónde están los
              átomos, y uno de los cuatro vértices del tetraedro lo ocupa el
              par solitario. Lo que queda es un tetraedro al que le falta un
              vértice.
          - texto: Tetraédrica, la misma que la electrónica
            mensaje: |
              Serían la misma si los cuatro vértices llevaran un átomo. Aquí
              solo hay tres átomos alrededor del nitrógeno; el cuarto vértice
              está ocupado por el par solitario, que no se dibuja.
          - texto: Trigonal plana, porque hay tres enlaces
            mensaje: |
              Tres enlaces darían trigonal plana si el número estérico fuera
              3. Con el par solitario es 4, y eso saca a los hidrógenos del
              plano del nitrógeno: la molécula tiene volumen.
          - texto: Angular, como el agua
            mensaje: |
              Angular es lo que queda cuando hay **dos** pares solitarios y
              dos enlaces, que es el caso del agua. Aquí hay un par y tres
              enlaces.

      - tipo: justificar
        pregunta: Ordena el argumento sobre el ángulo. Una pieza es falsa.
        piezas:
          - texto: El número estérico del nitrógeno es 4, así que la geometría electrónica es tetraédrica y el ángulo ideal sería 109,5°.
          - texto: 'Uno de los cuatro vértices lo ocupa un par solitario: la geometría molecular es una pirámide trigonal.'
          - texto: Un par solitario está sujeto por un solo núcleo, así que se extiende más y repele con más fuerza que un par enlazante.
          - texto: 'Esa repulsión extra aprieta los tres enlaces N–H entre sí y el ángulo baja hasta unos 107°.'
          - texto: El ángulo se cierra porque el par solitario es más pequeño que un enlace y deja hueco a los hidrógenos.
            trampa: true
            mensaje: |
              Es exactamente al revés, y por eso la conclusión saldría al
              revés también. Un par solitario ocupa **más** sitio que un par
              enlazante, no menos, porque no está estirado entre dos núcleos
              sino sujeto por uno solo. Si dejara hueco, el ángulo se abriría.
    resolucion: |
      **La cuenta.** El nitrógeno aporta cinco electrones de valencia y cada
      hidrógeno uno, así que hay ocho para repartir. Tres enlaces N–H se
      llevan seis y quedan dos: un par solitario sobre el nitrógeno. Con eso
      el nitrógeno tiene su octeto y cada hidrógeno sus dos.

      **El número estérico.** Tres átomos unidos más un par solitario:

      $$
      3 + 1 = 4
      $$

      Cuatro significa hibridación $sp^{3}$ y **geometría electrónica
      tetraédrica**.

      **Las dos geometrías.** Aquí está lo que el ejercicio quiere dejar
      claro. La geometría electrónica coloca los cuatro pares en los vértices
      de un tetraedro. La geometría **molecular** solo mira los átomos, y uno
      de esos cuatro vértices no tiene átomo. Lo que queda a la vista es una
      **pirámide trigonal**: el nitrógeno arriba y los tres hidrógenos
      formando la base.

      El temario lo dice con una frase que conviene recordar tal cual: al
      describir la forma de una molécula se indica siempre la geometría
      molecular, no la de los pares de electrones.

      **El ángulo.** El ideal del tetraedro es 109,5°, que es lo que mide el
      metano. En el amoniaco baja a unos 107°, y el motivo es el orden de
      repulsiones:

      $$
      \text{solitario--solitario} \;>\; \text{solitario--enlazante} \;>\; \text{enlazante--enlazante}
      $$

      Un par solitario está sujeto por un solo núcleo, así que su nube se
      extiende más cerca del átomo central y empuja más. Ese empujón aprieta
      los tres enlaces entre sí y cierra el ángulo.

      **La comprobación de que lo has entendido** es predecir el agua sin
      calcularla: dos pares solitarios en vez de uno, geometría molecular
      angular, y un ángulo todavía menor que el del amoniaco. Si el
      razonamiento del amoniaco es el bueno, el del agua sale solo.
