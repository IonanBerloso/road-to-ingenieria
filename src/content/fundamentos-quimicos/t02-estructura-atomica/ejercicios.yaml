ejercicios:
  # ── Los dos primeros son NUESTROS (§08). Los dos ejercicios de examen de
  #    este tema son tablas de cinco y seis columnas que hay que rellenar de
  #    una sentada: no hay por dónde entrar sin haber contado orbitales una
  #    vez y sin haber hecho un Slater sencillo. Aquí se aísla cada cosa.
  - id: ejfq2-cuantos-caben-en-el-nivel-tres
    titulo: Cuántos electrones caben en el nivel n = 3
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para el nivel $n = 3$, determinar cuántos orbitales hay en total y
      cuántos electrones caben en él.
    pide: El número de orbitales del nivel y el número de electrones que admite.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de contar nada. Fijado $n = 3$, ¿qué valores puede tomar
          $\ell$?
        opciones:
          - texto: $0$, $1$ y $2$
            correcta: true
            mensaje: |
              Eso es. La regla es que $\ell$ va de $0$ hasta $n-1$, así que
              con $n = 3$ hay tres formas de orbital disponibles, que se
              escriben $3s$, $3p$ y $3d$.
          - texto: $1$, $2$ y $3$
            mensaje: |
              La cuenta empieza en cero, no en uno. El orbital $s$ es el que
              tiene $\ell = 0$, y existe en todos los niveles: si empezaras en
              $1$ te quedarías sin el $3s$.
          - texto: De $0$ hasta $3$, o sea cuatro valores
            mensaje: |
              El tope es $n-1$, no $n$. Con cuatro valores tendrías un $3f$, y
              los orbitales $f$ no aparecen hasta $n = 4$.

      - tipo: calcular
        titulo: Los orbitales del nivel
        pregunta: |
          Sumando los orbitales de las tres formas, ¿cuántos orbitales hay en
          el nivel $n = 3$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has contado las **formas** —$s$, $p$ y $d$—, no los orbitales.
              Cada forma trae varias orientaciones: el $p$ son tres orbitales
              y el $d$ son cinco.
          - valor: '18'
            mensaje: |
              Ese es el número de **electrones**, que es el doble. Un orbital
              admite dos electrones, así que primero cuentas orbitales y
              después multiplicas.
          - valor: '6'
            mensaje: |
              Parece que has contado $1 + 2 + 3$. El número de orientaciones
              de una forma no es $\ell$ sino $2\ell + 1$, porque $m_\ell$ va
              de $-\ell$ a $+\ell$ pasando por el cero.
        pista: |
          Cada $\ell$ aporta $2\ell + 1$ orbitales. Suma para $\ell = 0$, $1$
          y $2$.
        desarrollo: |
          Para cada forma, el número de orientaciones es $2\ell + 1$:

          $$
          \ell = 0 \rightarrow 1 \qquad \ell = 1 \rightarrow 3 \qquad \ell = 2 \rightarrow 5
          $$

          y el total del nivel es $1 + 3 + 5 = 9$. En general un nivel tiene
          $n^{2}$ orbitales, y aquí $3^{2} = 9$.

      - tipo: calcular
        titulo: Los electrones que caben
        pregunta: |
          ¿Cuántos electrones admite en total el nivel $n = 3$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              Ese es el número de orbitales. Cada uno admite **dos**
              electrones, uno con cada valor de $m_s$, así que el nivel
              admite el doble.
          - valor: '10'
            mensaje: |
              Diez son los electrones que caben solo en los cinco orbitales
              $d$. Faltan los del $3s$ y los del $3p$.
        pista: |
          Nueve orbitales, y en cada uno caben dos electrones.
        desarrollo: |
          Cada orbital admite dos electrones —el principio de exclusión de
          Pauli no deja repetir los cuatro números, y lo único que queda
          libre es $m_s$—, así que

          $$
          2 \times 9 = 18
          $$

          En general, $2n^{2}$.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Con $n = 3$ los valores de $\ell$ son $0$, $1$ y $2$, o sea $3s$, $3p$ y $3d$.
          - texto: Cada $\ell$ aporta $2\ell + 1$ orientaciones, así que hay $1 + 3 + 5 = 9$ orbitales.
          - texto: 'Cada orbital admite dos electrones: en total $2 \times 9 = 18$.'
          - texto: Como en el nivel 3 hay tres formas de orbital, caben tres veces más electrones que en el nivel 1.
            trampa: true
            mensaje: |
              Suena a proporción y no lo es. En el nivel 1 caben 2 electrones
              y en el 3 caben 18, que son **nueve** veces más, no tres. Lo que
              crece como $n^{2}$ es el número de orbitales, no el número de
              formas.
    resolucion: |
      **Las formas disponibles.** El número cuántico $\ell$ está limitado por
      $n$: va de $0$ hasta $n-1$. Con $n = 3$ eso da $\ell = 0, 1, 2$, es
      decir los orbitales $3s$, $3p$ y $3d$.

      **Las orientaciones de cada forma.** Fijado $\ell$, el número cuántico
      $m_\ell$ recorre todos los enteros de $-\ell$ a $+\ell$, el cero
      incluido. Son $2\ell + 1$ valores: uno para el $s$, tres para el $p$ y
      cinco para el $d$.

      $$
      1 + 3 + 5 = 9 \text{ orbitales}
      $$

      **Los electrones.** El cuarto número, $m_s$, solo tiene dos valores, y
      el principio de exclusión de Pauli impide que dos electrones del mismo
      átomo compartan los cuatro. Así que en cada orbital caben exactamente
      dos:

      $$
      2 \times 9 = 18 \text{ electrones}
      $$

      **La forma corta.** Las dos cuentas tienen fórmula cerrada: un nivel
      tiene $n^{2}$ orbitales y admite $2n^{2}$ electrones. Conviene saber de
      dónde sale antes de usarla, porque la pregunta de examen no suele ser
      esta: suele ser descartar un conjunto de números cuánticos, y ahí hace
      falta el razonamiento en cascada, no el resultado.

  - id: ejfq2-el-slater-mas-corto
    titulo: La carga efectiva del sodio, que sirve de patrón
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Calcular por las reglas de Slater la carga nuclear efectiva que siente
      el electrón más externo del sodio, $Z = 11$.
    pide: La carga nuclear efectiva del electrón 3s del sodio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La configuración agrupada en subcapas es
          $(1s^{2})(2s^{2}2p^{6})(3s^{1})$. Miramos el electrón $3s$.
          ¿Cuántos electrones hay en **su mismo grupo**, aparte de él?
        opciones:
          - texto: Ninguno
            correcta: true
            mensaje: |
              Exacto. El grupo $(3s3p)$ contiene un solo electrón, que es
              justamente el que estamos mirando, y un electrón nunca se
              apantalla a sí mismo. Ese término vale cero.
          - texto: Uno, el propio electrón $3s$
            mensaje: |
              Ahí está el fallo más común de Slater. La constante de pantalla
              mide lo que **los demás** interponen; el electrón que estudias
              no se cuenta nunca. Si lo contases, cada cuenta te saldría
              $0{,}35$ de más.
          - texto: Ocho, los del segundo nivel
            mensaje: |
              Esos ocho están en la capa $n-1$, no en el mismo grupo. Sí
              apantallan, pero con $0{,}85$ cada uno, no con $0{,}35$.

      - tipo: calcular
        titulo: La constante de pantalla
        pregunta: |
          Con los ocho electrones de la capa $n-1$ y los dos de más adentro,
          ¿cuánto vale $S$?
        respuesta:
          tipo: numero
          valor: '8.80'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '9.15'
            mensaje: |
              Te has contado a ti mismo, sumando un $0{,}35$ que no toca. El
              electrón que se estudia queda fuera de la cuenta.
          - valor: '10'
            mensaje: |
              Has apantallado con $1{,}00$ los diez electrones internos. Solo
              los de $n-2$ y más adentro tapan del todo; los de la capa
              inmediatamente inferior tapan $0{,}85$.
          - valor: '8.50'
            mensaje: |
              Parece que has puesto $0{,}85$ también a los dos electrones
              $1s$. Esos están en $n-2$, y ahí el peso es $1{,}00$.
        pista: |
          Ocho electrones a $0{,}85$ y dos a $1{,}00$.
        desarrollo: |
          $$
          S = 0 \times 0{,}35 + 8 \times 0{,}85 + 2 \times 1{,}00 = 8{,}80
          $$

      - tipo: calcular
        titulo: La carga efectiva
        pregunta: |
          ¿Qué carga nuclear efectiva siente entonces el electrón $3s$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el resultado de la cuenta ingenua $11 - 10$, restando
              «los electrones internos» sin pesarlos. Da un número redondo y
              parece razonable, pero pierde justo lo que Slater mide: que
              apantallar no es tapar del todo.
          - valor: '1.85'
            mensaje: |
              Sale de haberte contado a ti mismo en el grupo. Revisa $S$.
        pista: |
          $Z_{\text{ef}} = Z - S$, con $Z = 11$.
        desarrollo: |
          $$
          Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Se agrupa la configuración en subcapas: $(1s^{2})(2s^{2}2p^{6})(3s^{1})$.'
          - texto: En el grupo del electrón mirado no queda ningún compañero, así que ese término es cero.
          - texto: Los ocho de la capa $n-1$ aportan $0{,}85$ cada uno y los dos de $n-2$ aportan $1{,}00$.
          - texto: 'La suma da $S = 8{,}80$, y $Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20$.'
          - texto: Como el sodio tiene diez electrones internos, la carga efectiva es la unidad que le queda al catión.
            trampa: true
            mensaje: |
              Es la cuenta ingenua disfrazada de argumento, y además mezcla
              dos cosas: la carga del ion Na$^{+}$ y la carga efectiva del
              átomo neutro. Que las dos den «uno» y «algo parecido a uno» es
              casualidad del sodio; con el cloro la ingenua da $7$ y Slater
              da $6{,}10$.
    resolucion: |
      **Por qué este ejercicio y no otro.** El sodio es el Slater más corto
      que existe con los tres pesos en juego, y además su resultado está
      publicado en los problemas de la asignatura, que dan $Z_{\text{ef}} =
      2{,}20$ para el sodio y $6{,}10$ para el cloro. Sirve de patrón: si
      calculas este y no te da, el fallo está en el método, y arreglarlo aquí
      cuesta un minuto en vez de arruinarte una tabla de cinco columnas.

      **El agrupamiento.** Lo primero, siempre, es escribir la configuración
      partida en los grupos de Slater —$(1s)(2s2p)(3s3p)(3d)(4s4p)\ldots$— y
      señalar en cuál cae el electrón que se estudia. Aquí:

      $$
      (1s^{2})(2s^{2}2p^{6})(3s^{1})
      $$

      **Los tres términos.** El electrón mirado está solo en su grupo, así que
      el término de $0{,}35$ desaparece. Los ocho del segundo nivel están en
      $n-1$ y pesan $0{,}85$. Los dos del primero están en $n-2$ y pesan
      $1{,}00$.

      $$
      S = 8 \times 0{,}85 + 2 \times 1{,}00 = 8{,}80
      $$

      $$
      Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20
      $$

      **Lo que enseña el número.** La cuenta ingenua —quitar los diez
      electrones internos— habría dado $1$. Slater da $2{,}20$, más del
      doble, y esa diferencia es la que explica por qué el sodio no se
      comporta como un átomo con un solo protón. Apantallar no es tapar: los
      electrones internos se mueven, y el de fuera se cuela.

  # ── Y a partir de aquí, los problemas de la colección en su orden (§04).
  #    Los del tema 2 vienen resueltos en el material, así que aquí la
  #    respuesta no es lo nuestro: lo nuestro es el diagnóstico de por dónde
  #    se tuerce la cuenta, que es lo que la solución oficial no da.
  - id: colfq2-7-tres-slater-y-uno-es-distinto
    titulo: Tres cargas efectivas, y una que se calcula con otra tabla
    fuente: >-
      Problema resuelto 7 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      solución; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Calcular la carga nuclear efectiva del último electrón que ha entrado en
      los átomos: ₃₃As, ₅₆Ba, ₂₈Ni
    pide: Las tres cargas nucleares efectivas por las reglas de Slater.

    pasos:
      - tipo: reconocer
        pregunta: |
          De los tres, ¿cuál se calcula con una tabla distinta y por qué?
        opciones:
          - texto: El níquel, porque su último electrón entra en un orbital $d$
            correcta: true
            mensaje: |
              Eso es. Para un electrón $d$ o $f$ desaparece el escalón de
              $0{,}85$: los compañeros de grupo siguen aportando $0{,}35$ y
              **todo lo que queda a la izquierda aporta $1{,}00$**, sin
              distinguir capas.
          - texto: El bario, porque es el más pesado de los tres
            mensaje: |
              El tamaño no cambia las reglas. El bario tiene 56 electrones y
              se calcula igual que el arsénico: su último electrón entra en un
              $6s$, que es un orbital $s$.
          - texto: El arsénico, porque su capa de valencia está semillena
            mensaje: |
              Que el $4p^{3}$ esté semilleno explica su energía de ionización
              alta, no cómo se calcula el apantallamiento. Slater no mira si
              una subcapa está medio llena.
          - texto: Ninguno; las reglas de Slater son las mismas para todos
            mensaje: |
              Hay dos tablas y esa es la mitad del problema. Aplicar la de los
              electrones $s$ y $p$ a un electrón $d$ da un resultado más de
              dos unidades distinto.

      - tipo: calcular
        titulo: El bario
        pregunta: |
          Con la configuración agrupada
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2}4p^{6})(4d^{10})(5s^{2}5p^{6})(6s^{2})$,
          ¿cuánto vale $Z_{\text{ef}}$ del electrón $6s$?
        respuesta:
          tipo: numero
          valor: '2.85'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              Es la cuenta ingenua, $56 - 54$. Trata a los 54 electrones
              internos como si taparan del todo, y los ocho de la capa 5 solo
              tapan $0{,}85$ cada uno.
          - valor: '2.50'
            mensaje: |
              Te has contado a ti mismo. En $(6s^{2})$ hay dos electrones, así
              que el que miramos tiene **un** compañero.
          - valor: '1.65'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho de la capa 5. Esa es la
              capa $n-1$ y su peso es $0{,}85$; el $1{,}00$ empieza en la
              capa 4.
        pista: |
          Un compañero en el grupo, ocho electrones en la capa 5, y los otros
          46 más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 8 \times 0{,}85 + 46 \times 1{,}00 = 53{,}15
          $$

          $$
          Z_{\text{ef}} = 56 - 53{,}15 = 2{,}85
          $$

          Y fíjate en el número: **2,85 sobre 56 protones**. Casi toda la
          carga del núcleo está apantallada, y por eso el bario es un metal
          que cede sus electrones con muchísima facilidad.

      - tipo: calcular
        titulo: El níquel
        pregunta: |
          El níquel, $Z = 28$, tiene la configuración ordenada
          $\ldots 3s^{2}3p^{6}3d^{8}4s^{2}$ y su electrón diferenciador es un
          $3d$. ¿Cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '7.55'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '6.85'
            mensaje: |
              Has contado los dos electrones $4s$. Están en un grupo a la
              **derecha** del $3d$, y los de la derecha no apantallan nada.
          - valor: '7.20'
            mensaje: |
              Te has contado a ti mismo entre los compañeros. En $(3d^{8})$
              hay ocho electrones, así que el que miramos tiene siete.
          - valor: '10'
            mensaje: |
              Es la cuenta ingenua, $28 - 18$, quitando «los electrones
              internos». Slater existe porque apantallar no es tapar del
              todo, y aquí la diferencia es de dos unidades y media.
        pista: |
          Siete compañeros a $0{,}35$ y dieciocho a la izquierda a $1{,}00$.
          Los $4s$ no cuentan.
        desarrollo: |
          $$
          S = 7 \times 0{,}35 + 18 \times 1{,}00 = 20{,}45
          $$

          $$
          Z_{\text{ef}} = 28 - 20{,}45 = 7{,}55
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Para el arsénico y el bario el último electrón entra en un orbital s o p, así que valen los tres pesos: 0,35 en el grupo, 0,85 en la capa n−1 y 1,00 más adentro.'
          - texto: 'Así, el arsénico da S = 4(0,35) + 18(0,85) + 10(1,00) = 26,7 y Zef = 6,3; el bario da S = 53,15 y Zef = 2,85.'
          - texto: 'Para el níquel el último electrón entra en un 3d, y ahí la tabla se acorta a dos pesos.'
          - texto: 'Los dos electrones 4s quedan a la derecha del grupo 3d y no apantallan, así que S = 7(0,35) + 18(1,00) = 20,45 y Zef = 7,55.'
          - texto: 'El níquel tiene la carga efectiva mayor de los tres porque es el que más protones tiene.'
            trampa: true
            mensaje: |
              El níquel tiene 28 protones y el bario 56, o sea la mitad, y
              aun así su carga efectiva es más del doble. Lo que decide no es
              cuántos protones hay sino **cuánto los tapan los electrones de
              dentro**, y el bario tiene 54 tapando frente a los 20 del
              níquel.
    resolucion: |
      **Las dos tablas, que es de lo que va el problema.** Slater no es una
      regla sino dos, y el enunciado ha elegido los tres átomos para que se
      note.

      Si el electrón que se mira está en un $ns$ o un $np$:

      | dónde está el que apantalla | aporta |
      |---|---|
      | a la derecha de su grupo | 0 |
      | en su mismo grupo | 0,35 |
      | en la capa $n-1$ | 0,85 |
      | en $n-2$ o más adentro | 1,00 |

      Si está en un $nd$ o un $nf$, solo quedan dos filas: 0,35 en su grupo y
      **1,00 para todo lo que quede a la izquierda**.

      **₃₃As**, último electrón en $(4s^{2}4p^{3})$:

      $$
      S = 4 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 26{,}70 \quad\Longrightarrow\quad Z_{\text{ef}} = 6{,}30
      $$

      **₅₆Ba**, último electrón en $(6s^{2})$:

      $$
      S = 1 \times 0{,}35 + 8 \times 0{,}85 + 46 \times 1{,}00 = 53{,}15 \quad\Longrightarrow\quad Z_{\text{ef}} = 2{,}85
      $$

      **₂₈Ni**, diferenciador en $(3d^{8})$, con los $4s^{2}$ fuera por estar
      a la derecha:

      $$
      S = 7 \times 0{,}35 + 18 \times 1{,}00 = 20{,}45 \quad\Longrightarrow\quad Z_{\text{ef}} = 7{,}55
      $$

      **Lo que dicen los tres juntos.** El bario tiene el doble de protones
      que el níquel y menos de la mitad de carga efectiva. Esa es toda la
      química del bloque $s$ frente al bloque $d$ en un número: el electrón
      de valencia del bario apenas siente el núcleo, así que se va con nada,
      y el del níquel está mucho más sujeto.

      Y el arsénico, con 33 protones, siente 6,30 — más que el bario con 56.
      **La carga efectiva no crece con el tamaño del átomo**, crece al
      avanzar por un periodo y cae al bajar por un grupo.

  - id: colfq2-10-ordenar-por-electronegatividad
    titulo: Ordenar por electronegatividad, dentro de un grupo y dentro de un periodo
    fuente: >-
      Problema resuelto 10 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      solución; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Ordenar los siguientes elementos en orden creciente de su
      electronegatividad:

      a) Br, Cl, F, I

      b) Cl, S, Na, Al, Mg
    pide: Los dos órdenes crecientes, con el criterio que decide cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos apartados no se resuelven con el mismo criterio. ¿Por qué?
        opciones:
          - texto: Porque en el a los elementos son de un mismo grupo y en el b de un mismo periodo
            correcta: true
            mensaje: |
              Exacto, y ahí está todo. Dentro de un grupo cambia $n$ y no
              hay más que mirar; dentro de un periodo $n$ es el mismo y quien
              decide es la carga efectiva.
          - texto: Porque en el a son halógenos y los halógenos van al revés
            mensaje: |
              Los halógenos no son una excepción a nada. Lo que hace distinto
              al apartado a es que sus cuatro elementos comparten grupo, y eso
              pasaría igual con los alcalinos o los gases nobles.
          - texto: Porque el b tiene metales y los metales no tienen electronegatividad
            mensaje: |
              Sí la tienen, solo que baja: el sodio vale 0,93 y el cloro 3,16.
              Precisamente por eso se pueden ordenar todos juntos.
          - texto: Porque en el b hay cinco elementos y en el a cuatro
            mensaje: |
              El número de elementos no cambia el criterio. Lo que lo cambia
              es si comparten grupo o periodo.

      - tipo: calcular
        titulo: La carga efectiva del aluminio
        pregunta: |
          Para ordenar el apartado b hace falta la carga efectiva de cada uno.
          ¿Cuánto vale la del aluminio, $Z = 13$?
        respuesta:
          tipo: numero
          valor: '3.50'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '3'
            mensaje: |
              La cuenta ingenua, $13 - 10$. Da un número redondo y por eso
              engaña; con ella el aluminio y el boro tendrían la misma carga
              efectiva.
          - valor: '3.15'
            mensaje: |
              Te has contado a ti mismo. El grupo $(3s^{2}3p^{1})$ tiene tres
              electrones, así que el que miramos tiene **dos** compañeros.
          - valor: '2.30'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho electrones del segundo
              nivel. Es la capa $n-1$ y su peso es $0{,}85$.
        pista: |
          Agrupa como $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{1})$. Dos compañeros,
          ocho en $n-1$, dos más adentro.
        desarrollo: |
          $$
          S = 2 \times 0{,}35 + 8 \times 0{,}85 + 2 \times 1{,}00 = 9{,}50
          $$

          $$
          Z_{\text{ef}} = 13 - 9{,}50 = 3{,}50
          $$

          Es el valor que publica la colección, junto con los del resto del
          periodo: Na 2,20 · Mg 2,85 · Al 3,50 · S 5,45 · Cl 6,10. Suben de
          $0{,}65$ en $0{,}65$ por cada protón añadido, que es exactamente
          $1 - 0{,}35$: cada electrón nuevo entra en el mismo grupo y solo
          tapa un tercio de lo que su protón añade.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'En el apartado a los cuatro son del grupo 7A, así que solo cambia n: la electronegatividad sube al bajar n.'
          - texto: 'El orden creciente es I < Br < Cl < F, del que tiene la capa de valencia en n = 5 al que la tiene en n = 2.'
          - texto: 'En el apartado b los cinco son del periodo 3, así que n no distingue y decide la carga efectiva.'
          - texto: 'Con Zef de 2,20 · 2,85 · 3,50 · 5,45 · 6,10, el orden creciente es Na < Mg < Al < S < Cl.'
          - texto: 'El flúor es el más electronegativo de los cuatro del apartado a porque es el que más protones tiene.'
            trampa: true
            mensaje: |
              El flúor tiene 9 protones y el yodo 53, o sea seis veces más, y
              aun así el flúor gana. Lo que lo hace tan electronegativo es que
              su capa de valencia está en $n = 2$, pegada al núcleo. Dentro de
              un grupo manda la distancia, no el número de protones.
    resolucion: |
      **a · Cuatro halógenos, o sea un grupo.** Comparten la estructura de
      valencia —$ns^{2}np^{5}$— y lo único que cambia es $n$. Cuanto mayor es
      $n$, más lejos del núcleo está la capa de valencia y menos tira el átomo
      de los electrones de un enlace:

      $$
      \mathrm{I}\ (5s^{2}5p^{5}) \;<\; \mathrm{Br}\ (4s^{2}4p^{5}) \;<\; \mathrm{Cl}\ (3s^{2}3p^{5}) \;<\; \mathrm{F}\ (2s^{2}2p^{5})
      $$

      **b · Cinco elementos del periodo 3.** Aquí $n$ vale 3 para todos, así
      que no distingue nada y hay que ir a la carga efectiva. Calculándolas
      por Slater:

      | | Na | Mg | Al | S | Cl |
      |---|---|---|---|---|---|
      | configuración | $3s^{1}$ | $3s^{2}$ | $3s^{2}3p^{1}$ | $3s^{2}3p^{4}$ | $3s^{2}3p^{5}$ |
      | $Z_{\text{ef}}$ | 2,20 | 2,85 | 3,50 | 5,45 | 6,10 |

      $$
      \mathrm{Na} < \mathrm{Mg} < \mathrm{Al} < \mathrm{S} < \mathrm{Cl}
      $$

      **El patrón que conviene ver en esa fila.** Cada paso suma $0{,}65$, y
      no es casualidad: al avanzar un puesto en el periodo se añade un protón
      —que suma 1 a $Z$— y un electrón que entra **en el mismo grupo** y solo
      aporta $0{,}35$ de pantalla. El balance es $1 - 0{,}35 = 0{,}65$ por
      escalón.

      Saber eso permite dos cosas. Una, comprobar una cuenta sin repetirla:
      si dos elementos vecinos del mismo periodo no te salen separados por
      0,65, hay un error. Y dos, entender por qué la electronegatividad sube
      tan deprisa de izquierda a derecha y tan despacio de arriba abajo: en un
      periodo el efecto se acumula limpio, en un grupo compiten un $n$ mayor
      con muchos más protones.

      **Y la comparación entre los dos apartados**, que es lo que el problema
      quiere: el flúor gana a todos con solo 9 protones, y el sodio pierde
      con 11. Más protones no significa más electronegativo. Lo que decide es
      cuántos de esos protones **llegan** al electrón de valencia.
