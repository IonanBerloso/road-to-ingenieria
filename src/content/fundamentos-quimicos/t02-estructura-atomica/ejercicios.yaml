ejercicios:
  # ── Los dos primeros son NUESTROS (§08). Los dos ejercicios de examen de
  #    este tema son tablas de cinco y seis columnas que hay que rellenar de
  #    una sentada: no hay por dónde entrar sin haber contado orbitales una
  #    vez y sin haber hecho un Slater sencillo. Aquí se aísla cada cosa.
  - id: ejfq2-cuantos-caben-en-el-nivel-tres
    titulo: Cuántos electrones caben en el nivel n = 3
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para el nivel $n = 3$, determinar cuántos orbitales hay en total y
      cuántos electrones caben en él.
    pide: El número de orbitales del nivel y el número de electrones que admite.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de contar nada. Fijado $n = 3$, ¿qué valores puede tomar
          $\ell$?
        opciones:
          - texto: $0$, $1$ y $2$
            correcta: true
            mensaje: |
              Eso es. La regla es que $\ell$ va de $0$ hasta $n-1$, así que
              con $n = 3$ hay tres formas de orbital disponibles, que se
              escriben $3s$, $3p$ y $3d$.
          - texto: $1$, $2$ y $3$
            mensaje: |
              La cuenta empieza en cero, no en uno. El orbital $s$ es el que
              tiene $\ell = 0$, y existe en todos los niveles: si empezaras en
              $1$ te quedarías sin el $3s$.
          - texto: De $0$ hasta $3$, o sea cuatro valores
            mensaje: |
              El tope es $n-1$, no $n$. Con cuatro valores tendrías un $3f$, y
              los orbitales $f$ no aparecen hasta $n = 4$.

      - tipo: calcular
        titulo: Los orbitales del nivel
        pregunta: |
          Sumando los orbitales de las tres formas, ¿cuántos orbitales hay en
          el nivel $n = 3$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Has contado las **formas** —$s$, $p$ y $d$—, no los orbitales.
              Cada forma trae varias orientaciones: el $p$ son tres orbitales
              y el $d$ son cinco.
          - valor: '18'
            mensaje: |
              Ese es el número de **electrones**, que es el doble. Un orbital
              admite dos electrones, así que primero cuentas orbitales y
              después multiplicas.
          - valor: '6'
            mensaje: |
              Parece que has contado $1 + 2 + 3$. El número de orientaciones
              de una forma no es $\ell$ sino $2\ell + 1$, porque $m_\ell$ va
              de $-\ell$ a $+\ell$ pasando por el cero.
        pista: |
          Cada $\ell$ aporta $2\ell + 1$ orbitales. Suma para $\ell = 0$, $1$
          y $2$.
        desarrollo: |
          Para cada forma, el número de orientaciones es $2\ell + 1$:

          $$
          \ell = 0 \rightarrow 1 \qquad \ell = 1 \rightarrow 3 \qquad \ell = 2 \rightarrow 5
          $$

          y el total del nivel es $1 + 3 + 5 = 9$. En general un nivel tiene
          $n^{2}$ orbitales, y aquí $3^{2} = 9$.

      - tipo: calcular
        titulo: Los electrones que caben
        pregunta: |
          ¿Cuántos electrones admite en total el nivel $n = 3$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              Ese es el número de orbitales. Cada uno admite **dos**
              electrones, uno con cada valor de $m_s$, así que el nivel
              admite el doble.
          - valor: '10'
            mensaje: |
              Diez son los electrones que caben solo en los cinco orbitales
              $d$. Faltan los del $3s$ y los del $3p$.
        pista: |
          Nueve orbitales, y en cada uno caben dos electrones.
        desarrollo: |
          Cada orbital admite dos electrones —el principio de exclusión de
          Pauli no deja repetir los cuatro números, y lo único que queda
          libre es $m_s$—, así que

          $$
          2 \times 9 = 18
          $$

          En general, $2n^{2}$.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Con $n = 3$ los valores de $\ell$ son $0$, $1$ y $2$, o sea $3s$, $3p$ y $3d$.
          - texto: Cada $\ell$ aporta $2\ell + 1$ orientaciones, así que hay $1 + 3 + 5 = 9$ orbitales.
          - texto: 'Cada orbital admite dos electrones: en total $2 \times 9 = 18$.'
          - texto: Como en el nivel 3 hay tres formas de orbital, caben tres veces más electrones que en el nivel 1.
            trampa: true
            mensaje: |
              Suena a proporción y no lo es. En el nivel 1 caben 2 electrones
              y en el 3 caben 18, que son **nueve** veces más, no tres. Lo que
              crece como $n^{2}$ es el número de orbitales, no el número de
              formas.
    resolucion: |
      **Las formas disponibles.** El número cuántico $\ell$ está limitado por
      $n$: va de $0$ hasta $n-1$. Con $n = 3$ eso da $\ell = 0, 1, 2$, es
      decir los orbitales $3s$, $3p$ y $3d$.

      **Las orientaciones de cada forma.** Fijado $\ell$, el número cuántico
      $m_\ell$ recorre todos los enteros de $-\ell$ a $+\ell$, el cero
      incluido. Son $2\ell + 1$ valores: uno para el $s$, tres para el $p$ y
      cinco para el $d$.

      $$
      1 + 3 + 5 = 9 \text{ orbitales}
      $$

      **Los electrones.** El cuarto número, $m_s$, solo tiene dos valores, y
      el principio de exclusión de Pauli impide que dos electrones del mismo
      átomo compartan los cuatro. Así que en cada orbital caben exactamente
      dos:

      $$
      2 \times 9 = 18 \text{ electrones}
      $$

      **La forma corta.** Las dos cuentas tienen fórmula cerrada: un nivel
      tiene $n^{2}$ orbitales y admite $2n^{2}$ electrones. Conviene saber de
      dónde sale antes de usarla, porque la pregunta de examen no suele ser
      esta: suele ser descartar un conjunto de números cuánticos, y ahí hace
      falta el razonamiento en cascada, no el resultado.

  - id: ejfq2-el-cinc-y-sus-dos-configuraciones
    titulo: El cinc, y por qué su configuración se escribe de dos maneras
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el orden de llenado y el
      orden por niveles del tema 2. Es el peldaño que faltaba entre «cuántos
      caben en el nivel tres» y el ejercicio de examen de los cinco elementos.
      No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      El cinc tiene $Z = 30$.

      a) Escribir su configuración electrónica en el **orden de llenado** y
      después **ordenada por niveles**.

      b) Decir cuál es su electrón diferenciador y cuál el más externo.

      c) ¿Qué configuración tiene el ion $\mathrm{Zn^{2+}}$?
    pide: Las dos configuraciones, los dos electrones y la del ion.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve escribir la configuración dos veces, si los
          electrones son los mismos?
        opciones:
          - texto: >-
              Cada orden contesta una pregunta distinta: el de llenado dice
              cuál fue el **último** electrón, y el ordenado por niveles dice
              cuál es el **más externo**
            correcta: true
            mensaje: |
              Exacto, y por eso el enunciado hay que leerlo con cuidado: los
              dos exámenes que existen piden cosas distintas —«el último
              electrón (diferenciador)» uno y «el electrón más externo» el
              otro— y en un metal de transición no son el mismo.
          - texto: >-
              Por costumbre: el orden por niveles es solo una forma más
              ordenada de escribir lo mismo
            mensaje: |
              Es más ordenada, sí, pero no es solo estética. Al reagrupar,
              el subnivel que estaba al final deja de estarlo, y el que queda
              al final es otro. Justamente esa diferencia es la que se
              pregunta.
          - texto: >-
              Porque el orden de llenado está mal y el bueno es el de niveles
            mensaje: |
              Ninguno está mal: describen dos cosas distintas del mismo átomo.
              El de llenado describe **cómo se construyó**; el de niveles,
              **cómo está ahora**.

      - tipo: calcular
        titulo: Los electrones del nivel 3
        pregunta: |
          ¿Cuántos electrones tiene el cinc en el nivel $n=3$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              Has contado solo $3s^{2}3p^{6}$ y te has dejado los diez $3d$.
              Están en el nivel 3 aunque se llenen después del $4s$: **el
              orden de llenado no cambia a qué nivel pertenece cada
              subnivel**.
          - valor: '10'
            mensaje: |
              Esos son solo los $3d$. En el nivel 3 también están los dos $3s$
              y los seis $3p$.
        pista: |
          Suma todos los subniveles que empiezan por 3.
        desarrollo: |
          El orden de llenado da

          $$
          1s^{2}\,2s^{2}\,2p^{6}\,3s^{2}\,3p^{6}\,4s^{2}\,3d^{10}
          $$

          y reagrupando por niveles,

          $$
          1s^{2}\,2s^{2}\,2p^{6}\,3s^{2}\,3p^{6}\,3d^{10}\,4s^{2}
          $$

          En el nivel 3 hay $2+6+10 = 18$ electrones. Y comprobación barata:
          $2+2+6+2+6+2+10 = 30$, que es $Z$. **Si la suma no da $Z$, la
          configuración está mal antes de mirar nada más.**

      - tipo: calcular
        titulo: El nivel del electrón diferenciador
        pregunta: |
          ¿Cuál es el número cuántico principal $n$ del electrón
          diferenciador del cinc?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el del electrón **más externo**, el $4s$. El
              diferenciador es el último que entró **en el orden de llenado**,
              y ahí el último subnivel es el $3d$. Son dos electrones
              distintos y el enunciado elige cuál quiere.
        pista: |
          Mira la configuración en el orden de llenado y quédate con el último
          subnivel.
        desarrollo: |
          En el orden de llenado la configuración termina en $3d^{10}$, así que
          el diferenciador es un $3d$: $n = 3$.

          El más externo, en cambio, es un $4s$, con $n = 4$. **Los dos
          existen, y no son el mismo.** En el arsénico coinciden —los dos son
          $4p$— y por eso mucha gente no descubre nunca que la distinción está
          ahí.

      - tipo: calcular
        titulo: El ion
        pregunta: |
          ¿Cuántos electrones tiene el $\mathrm{Zn^{2+}}$ en el nivel 4?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Has quitado los electrones del $3d$. Un catión pierde primero los
              **más externos**, y esos son los $4s$ — aunque se llenaran antes
              que los $3d$. Es exactamente el caso donde los dos órdenes dan
              respuestas distintas, y por eso este ion se usa tanto de ejemplo.
        pista: |
          ¿De qué subnivel salen los electrones cuando un átomo se convierte
          en catión?
        desarrollo: |
          El $\mathrm{Zn^{2+}}$ pierde los dos $4s$, no dos de los $3d$:

          $$
          \mathrm{Zn^{2+}}:\; 1s^{2}\,2s^{2}\,2p^{6}\,3s^{2}\,3p^{6}\,3d^{10}
          $$

          Así que en el nivel 4 no le queda ninguno, y en el 3 sigue teniendo
          18. La configuración del ion es la del argón más un $3d$ lleno, que
          es una de las razones de que el cinc sea tan estable en estado $+2$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El orden de llenado mete el $4s$ antes que el $3d$, así que la
              configuración construida termina en $3d^{10}$.
          - texto: >-
              Reagrupada por niveles termina en $4s^{2}$, porque el 4 va
              después del 3.
          - texto: >-
              De ahí que el diferenciador sea un $3d$ y el más externo un
              $4s$: dos electrones distintos, con $n=3$ y $n=4$.
          - texto: >-
              Y como el $4s$ se llenó primero, al formar el catión se pierden
              antes los $3d$.
            trampa: true
            mensaje: |
              Al revés: se pierden primero los $4s$, aunque se llenaran antes.
              Llenar y vaciar no siguen el mismo orden, y esa asimetría es la
              que hace que el $\mathrm{Zn^{2+}}$ conserve los diez $3d$. Es el
              detalle que más se falla de todo el apartado.
    resolucion: |
      **a) Las dos configuraciones.**

      | | configuración |
      |---|---|
      | orden de llenado | $1s^{2}\,2s^{2}\,2p^{6}\,3s^{2}\,3p^{6}\,4s^{2}\,3d^{10}$ |
      | ordenada por niveles | $1s^{2}\,2s^{2}\,2p^{6}\,3s^{2}\,3p^{6}\,3d^{10}\,4s^{2}$ |

      Las dos suman 30, que es $Z$.

      **b) Los dos electrones.** El **diferenciador** es el último del orden de
      llenado, un $3d$ con $n=3$. El **más externo** es un $4s$, con $n=4$.

      **c) El ion.** $\mathrm{Zn^{2+}}$ pierde los dos $4s$:
      $[\mathrm{Ar}]\,3d^{10}$.

      **Lo que hay que llevarse.** Una sola idea, con tres caras:

      1. **El orden de llenado y el orden por niveles no son el mismo**, y
         cada uno contesta una pregunta distinta.
      2. **Los exámenes preguntan por los dos electrones**, y con esas
         palabras: uno pide «el último electrón (diferenciador)» y el otro «el
         electrón más externo». Leer cuál te piden antes de agrupar es medio
         ejercicio.
      3. **Llenar y vaciar no siguen el mismo orden.** Entra antes el $4s$ y
         sale antes el $4s$ también. No es una excepción caprichosa: una vez
         que el $3d$ está ocupado, la energía de los dos subniveles se ha
         reordenado.

  - id: ejfq2-el-slater-mas-corto
    titulo: La carga efectiva del sodio, que sirve de patrón
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Calcular por las reglas de Slater la carga nuclear efectiva que siente
      el electrón más externo del sodio, $Z = 11$.
    pide: La carga nuclear efectiva del electrón 3s del sodio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La configuración agrupada en subcapas es
          $(1s^{2})(2s^{2}2p^{6})(3s^{1})$. Miramos el electrón $3s$.
          ¿Cuántos electrones hay en **su mismo grupo**, aparte de él?
        opciones:
          - texto: Ninguno
            correcta: true
            mensaje: |
              Exacto. El grupo $(3s3p)$ contiene un solo electrón, que es
              justamente el que estamos mirando, y un electrón nunca se
              apantalla a sí mismo. Ese término vale cero.
          - texto: Uno, el propio electrón $3s$
            mensaje: |
              Ahí está el fallo más común de Slater. La constante de pantalla
              mide lo que **los demás** interponen; el electrón que estudias
              no se cuenta nunca. Si lo contases, cada cuenta te saldría
              $0{,}35$ de más.
          - texto: Ocho, los del segundo nivel
            mensaje: |
              Esos ocho están en la capa $n-1$, no en el mismo grupo. Sí
              apantallan, pero con $0{,}85$ cada uno, no con $0{,}35$.

      - tipo: calcular
        titulo: La constante de pantalla
        pregunta: |
          Con los ocho electrones de la capa $n-1$ y los dos de más adentro,
          ¿cuánto vale $S$?
        respuesta:
          tipo: numero
          valor: '8.80'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '9.15'
            mensaje: |
              Te has contado a ti mismo, sumando un $0{,}35$ que no toca. El
              electrón que se estudia queda fuera de la cuenta.
          - valor: '10'
            mensaje: |
              Has apantallado con $1{,}00$ los diez electrones internos. Solo
              los de $n-2$ y más adentro tapan del todo; los de la capa
              inmediatamente inferior tapan $0{,}85$.
          - valor: '8.50'
            mensaje: |
              Parece que has puesto $0{,}85$ también a los dos electrones
              $1s$. Esos están en $n-2$, y ahí el peso es $1{,}00$.
        pista: |
          Ocho electrones a $0{,}85$ y dos a $1{,}00$.
        desarrollo: |
          $$
          S = 0 \times 0{,}35 + 8 \times 0{,}85 + 2 \times 1{,}00 = 8{,}80
          $$

      - tipo: calcular
        titulo: La carga efectiva
        pregunta: |
          ¿Qué carga nuclear efectiva siente entonces el electrón $3s$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el resultado de la cuenta ingenua $11 - 10$, restando
              «los electrones internos» sin pesarlos. Da un número redondo y
              parece razonable, pero pierde justo lo que Slater mide: que
              apantallar no es tapar del todo.
          - valor: '1.85'
            mensaje: |
              Sale de haberte contado a ti mismo en el grupo. Revisa $S$.
        pista: |
          $Z_{\text{ef}} = Z - S$, con $Z = 11$.
        desarrollo: |
          $$
          Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Se agrupa la configuración en subcapas: $(1s^{2})(2s^{2}2p^{6})(3s^{1})$.'
          - texto: En el grupo del electrón mirado no queda ningún compañero, así que ese término es cero.
          - texto: Los ocho de la capa $n-1$ aportan $0{,}85$ cada uno y los dos de $n-2$ aportan $1{,}00$.
          - texto: 'La suma da $S = 8{,}80$, y $Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20$.'
          - texto: Como el sodio tiene diez electrones internos, la carga efectiva es la unidad que le queda al catión.
            trampa: true
            mensaje: |
              Es la cuenta ingenua disfrazada de argumento, y además mezcla
              dos cosas: la carga del ion Na$^{+}$ y la carga efectiva del
              átomo neutro. Que las dos den «uno» y «algo parecido a uno» es
              casualidad del sodio; con el cloro la ingenua da $7$ y Slater
              da $6{,}10$.
    resolucion: |
      **Por qué este ejercicio y no otro.** El sodio es el Slater más corto
      que existe con los tres pesos en juego, y además su resultado está
      publicado en los problemas de la asignatura, que dan $Z_{\text{ef}} =
      2{,}20$ para el sodio y $6{,}10$ para el cloro. Sirve de patrón: si
      calculas este y no te da, el fallo está en el método, y arreglarlo aquí
      cuesta un minuto en vez de arruinarte una tabla de cinco columnas.

      **El agrupamiento.** Lo primero, siempre, es escribir la configuración
      partida en los grupos de Slater —$(1s)(2s2p)(3s3p)(3d)(4s4p)\ldots$— y
      señalar en cuál cae el electrón que se estudia. Aquí:

      $$
      (1s^{2})(2s^{2}2p^{6})(3s^{1})
      $$

      **Los tres términos.** El electrón mirado está solo en su grupo, así que
      el término de $0{,}35$ desaparece. Los ocho del segundo nivel están en
      $n-1$ y pesan $0{,}85$. Los dos del primero están en $n-2$ y pesan
      $1{,}00$.

      $$
      S = 8 \times 0{,}85 + 2 \times 1{,}00 = 8{,}80
      $$

      $$
      Z_{\text{ef}} = 11 - 8{,}80 = 2{,}20
      $$

      **Lo que enseña el número.** La cuenta ingenua —quitar los diez
      electrones internos— habría dado $1$. Slater da $2{,}20$, más del
      doble, y esa diferencia es la que explica por qué el sodio no se
      comporta como un átomo con un solo protón. Apantallar no es tapar: los
      electrones internos se mueven, y el de fuera se cuela.
  # ── Los ejemplos de entrada que faltaban, escritos el 5 de septiembre de
  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq2-cinco-iones-con-diez-electrones
    titulo: La serie isoelectrónica del neón
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Los iones N³⁻, O²⁻, F⁻, Na⁺ y Mg²⁺ tienen los cinco diez electrones.
      Ordenarlos de menor a mayor radio iónico y justificar el criterio usado.
    pide: El orden de los cinco iones por radio, y la razón.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los cinco tienen la configuración del neón. ¿Qué decide entonces el
          tamaño?
        opciones:
          - texto: El número de protones, porque los electrones son los mismos
            correcta: true
            mensaje: |
              Eso es. Diez electrones sujetados por doce protones están más
              apretados que diez sujetados por siete: a más carga nuclear,
              menor radio.
          - texto: La carga del ion, porque los negativos son más grandes
            correcta: false
            mensaje: |
              Aquí resulta que el orden que sale es el mismo, y por eso este
              razonamiento engaña tanto. Pero el motivo es otro: dentro de una
              serie isoelectrónica los aniones son mayores **porque tienen
              menos protones**, no porque sean aniones. Compara O²⁻ con S²⁻,
              que tienen la misma carga y tamaños muy distintos.
          - texto: El periodo al que pertenece cada elemento
            correcta: false
            mensaje: |
              Todos los iones de una serie isoelectrónica acaban en la misma
              capa —aquí la del neón, $n = 2$—, así que el periodo del
              elemento de partida no distingue nada.
          - texto: La regla de que un catión es menor que su átomo
            correcta: false
            mensaje: |
              Esa regla compara un ion **con su propio átomo**, no dos iones
              entre sí. Aquí no hay átomos neutros con los que comparar: hay
              cinco iones, y la regla no llega.

      - tipo: calcular
        titulo: El más pequeño
        pregunta: |
          ¿Cuántos protones tiene el menor de los cinco iones?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '7'
            mensaje: |
              Siete protones son los del nitrógeno, que con diez electrones da
              N³⁻: el que **menos** carga nuclear tiene y por tanto el mayor de
              los cinco, no el menor.
          - valor: '10'
            mensaje: |
              Diez son los electrones, que los cinco comparten. Lo que
              distingue es la carga del núcleo, y ahí ninguno de los cinco
              tiene diez: el neón sería el átomo neutro, y no está en la lista.
          - valor: '11'
            mensaje: |
              Once son los del sodio. Va en la dirección buena pero se queda
              uno corto: el magnesio tiene doce y es el que más aprieta.
        pista: |
          El magnesio es el elemento de número atómico mayor de los cinco.
        desarrollo: |
          Los cinco números atómicos son 7, 8, 9, 11 y 12. El mayor es el del
          magnesio, y $\mathrm{Mg^{2+}}$ es el ion más pequeño de la serie:
          doce protones tirando de diez electrones.

      - tipo: calcular
        titulo: Cuántos son cationes
        pregunta: |
          De los cinco iones de la serie, ¿cuántos son cationes?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Son N³⁻, O²⁻ y F⁻ los que tienen carga negativa, o sea tres
              aniones. Cationes solo hay dos: Na⁺ y Mg²⁺.
          - valor: '5'
            mensaje: |
              Un ion no es un catión por el hecho de ser ion. Catión es el de
              carga positiva, y aquí tres de los cinco la tienen negativa.
        pista: |
          Los que están a la izquierda del neón en la tabla han perdido
          electrones; los de la derecha los han ganado.
        desarrollo: |
          Na⁺ y Mg²⁺ son cationes —elementos que **pierden** electrones para
          llegar al neón— y N³⁻, O²⁻ y F⁻ son aniones, que los ganan. La
          frontera es el propio neón: los de antes ganan, los de después
          pierden.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los cinco iones tienen diez electrones, así que la repulsión entre ellos y el apantallamiento son prácticamente los mismos.'
          - texto: 'Lo único que cambia de uno a otro es el número de protones, que va de 7 en el nitrógeno a 12 en el magnesio.'
          - texto: 'Más protones sobre los mismos electrones significa una nube más apretada, o sea menor radio.'
          - texto: 'El orden de menor a mayor es Mg²⁺ < Na⁺ < F⁻ < O²⁻ < N³⁻, que es el de número atómico decreciente.'
          - texto: 'Como los aniones son siempre mayores que los cationes, basta con separar los tres negativos de los dos positivos.'
            trampa: true
            mensaje: |
              Dentro de esta serie el resultado coincide, y por eso la pieza
              parece buena. Pero la afirmación general es falsa: el catión Cs⁺
              es mucho mayor que el anión F⁻. Lo que ordena aquí no es el signo
              de la carga, es la carga nuclear — y da la casualidad de que en
              una serie isoelectrónica las dos cosas van juntas.
    resolucion: |
      ## Cuando las dos reglas de siempre no sirven

      Del radio iónico se aprenden dos reglas —el catión encoge, el anión se
      hincha— y las dos comparan un ion **con su átomo**. En una serie
      isoelectrónica no hay átomo con el que comparar: hay cinco iones con los
      mismos diez electrones, y las reglas no dicen nada.

      Lo que queda es una sola variable:

      | ion | Z | electrones | radio |
      |---|---|---|---|
      | N³⁻ | 7 | 10 | el mayor |
      | O²⁻ | 8 | 10 | |
      | F⁻ | 9 | 10 | |
      | Na⁺ | 11 | 10 | |
      | Mg²⁺ | 12 | 10 | el menor |

      $$
      \mathrm{Mg^{2+}} < \mathrm{Na^{+}} < \mathrm{F^{-}} <
      \mathrm{O^{2-}} < \mathrm{N^{3-}}
      $$

      **Cómo se reconoce una serie isoelectrónica en un examen**, que es la
      mitad del trabajo: se cuentan los electrones de cada ion —número atómico
      menos la carga, con su signo— y si salen todos iguales, se deja de
      razonar con cationes y aniones y se ordena por Z.

      **Y el aviso que este ejemplo prepara.** En el examen los iones no vienen
      todos de la misma serie. El control de 2023-2024 pide ordenar tres, y dos
      de ellos son isoelectrónicos y el tercero no: ahí hay que hacer **dos
      comparaciones distintas**, una dentro de la serie por protones y otra
      fuera, por número de capas. Confundir cuál toca es el error que decide
      ese apartado.


  # ── Y a partir de aquí, los problemas de la colección en su orden (§04).
  #    Los del tema 2 vienen resueltos en el material, así que aquí la
  #    respuesta no es lo nuestro: lo nuestro es el diagnóstico de por dónde
  #    se tuerce la cuenta, que es lo que la solución oficial no da.
  - id: ejfq2-el-potasio-el-cloro-y-sus-dos-iones
    titulo: El potasio, el cloro y sus dos iones, ordenados por tamaño
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el radio atómico e
      iónico del tema 2. El ejemplo anterior compara cinco iones con los mismos
      electrones; este mezcla niveles distintos y compara cada átomo con su
      propio ion, que es la otra mitad del criterio. No es de examen ni de la
      colección.
    nivel: ejemplo
    enunciado: |
      Ordenar de **mayor a menor radio** estas cuatro partículas:

      $$
      \mathrm{K}, \qquad \mathrm{K^{+}}, \qquad \mathrm{Cl}, \qquad
      \mathrm{Cl^{-}}
      $$

      **Datos:** números atómicos: Cl = 17; K = 19.
    pide: El orden de las cuatro por radio, de mayor a menor.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para comparar dos radios, ¿qué se mira primero?
        opciones:
          - texto: >-
              El **nivel** ocupado más alto; solo si coincide se pasa a mirar
              la carga nuclear
            correcta: true
            mensaje: |
              Eso es, y en ese orden. Añadir un nivel es añadir una capa
              entera, y eso pesa más que cualquier diferencia de carga dentro
              del mismo nivel. Por eso el potasio es más grande que el cloro
              aunque tenga **más** protones.
          - texto: >-
              La carga nuclear: a más protones, más atracción y menos radio
            mensaje: |
              Es cierto **a igualdad de nivel**, y por eso decide dentro de una
              serie isoelectrónica. Pero si se aplica sin mirar el nivel, da la
              respuesta contraria en cuanto se comparan dos periodos distintos.
          - texto: >-
              El número de electrones: cuantos más, más grande
            mensaje: |
              Tampoco vale por sí solo. El $\mathrm{K^{+}}$ tiene 18
              electrones y el $\mathrm{Cl}$ tiene 17, y aun así el
              $\mathrm{K^{+}}$ es **más pequeño**: lo que cuenta no es cuántos
              hay, sino cuánta carga los sujeta y en qué nivel están.

      - tipo: calcular
        titulo: Los electrones de los dos iones
        pregunta: |
          ¿Cuántos electrones tienen $\mathrm{K^{+}}$ y $\mathrm{Cl^{-}}$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '19'
            mensaje: |
              Ese es el $Z$ del potasio, o sea sus **protones**. El catión ha
              perdido un electrón: le quedan 18. Y el $\mathrm{Cl^{-}}$ ha
              ganado uno sobre 17, así que también tiene 18.
          - valor: '17'
            mensaje: |
              Ese es el $Z$ del cloro. El anión ha ganado un electrón: 18.
        pista: |
          Un catión con una carga positiva ha perdido un electrón; un anión con
          una carga negativa, ganado.
        desarrollo: |
          $$
          \mathrm{K^{+}}: 19 - 1 = 18
          \qquad
          \mathrm{Cl^{-}}: 17 + 1 = 18
          $$

          Los dos tienen 18: son **isoelectrónicos**, los dos con la
          configuración del argón. Así que entre ellos ya no decide el nivel
          —es el mismo— sino la carga nuclear, y ahí el potasio tiene dos
          protones más para sujetar los mismos dieciocho electrones.

      - tipo: calcular
        titulo: Cuántas son más grandes que el cloro
        pregunta: |
          De las cuatro partículas, ¿cuántas tienen un radio mayor que el del
          $\mathrm{Cl}$ neutro?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Te has quedado solo con el potasio. El $\mathrm{Cl^{-}}$ también
              es mayor que el $\mathrm{Cl}$: al ganar un electrón, la misma
              carga nuclear tiene que sujetar a uno más, la repulsión entre
              ellos crece y la nube se hincha. **Un anión siempre es mayor que
              su átomo.**
          - valor: '3'
            mensaje: |
              Has contado también el $\mathrm{K^{+}}$, y es el más pequeño de
              los cuatro: mismo nivel que el cloro pero con dos protones más y
              un electrón menos.
        pista: |
          Compara una a una: el potasio, el catión y el anión, cada uno contra
          el cloro neutro.
        desarrollo: |
          - **K**: está en el periodo 4, con un nivel más. Mayor. ✓
          - **Cl⁻**: mismo nivel que el cloro, un electrón más y la misma
            carga nuclear. Mayor. ✓
          - **K⁺**: mismo nivel que el cloro, dos protones más y un electrón
            menos. Menor.

          Son **dos**. Y el orden completo queda

          $$
          \mathrm{K} > \mathrm{Cl^{-}} > \mathrm{Cl} > \mathrm{K^{+}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El potasio es el único con el nivel 4 ocupado, así que es el
              mayor de los cuatro sin necesidad de mirar nada más.
          - texto: >-
              Los otros tres se quedan en el nivel 3, así que entre ellos
              decide cuánta carga nuclear sujeta a cuántos electrones.
          - texto: >-
              El anión hincha —misma carga para un electrón más— y el catión
              encoge, y encima el catión es el de mayor Z: por eso queda
              $\mathrm{Cl^{-}} > \mathrm{Cl} > \mathrm{K^{+}}$.
          - texto: >-
              Y como el potasio tiene más protones que el cloro, el
              $\mathrm{K}$ neutro atrae más a sus electrones y por eso queda
              justo por encima del $\mathrm{Cl^{-}}$.
            trampa: true
            mensaje: |
              La conclusión es correcta y el motivo es el contrario. El potasio
              queda arriba **a pesar** de tener más protones, no gracias a
              ello: lo que manda es que tiene un nivel más. Si la carga nuclear
              decidiera por encima del nivel, el potasio sería el más pequeño
              de los cuatro. Cuidado con las explicaciones que aciertan el
              orden por la razón equivocada: en un examen que pide «razonar la
              respuesta», eso es media pregunta perdida.
    resolucion: |
      **Los electrones de cada una.**

      | | Z | electrones | nivel más alto |
      |---|---|---|---|
      | K | 19 | 19 | **4** |
      | Cl⁻ | 17 | 18 | 3 |
      | Cl | 17 | 17 | 3 |
      | K⁺ | 19 | 18 | 3 |

      **El orden.**

      $$
      \mathrm{K} > \mathrm{Cl^{-}} > \mathrm{Cl} > \mathrm{K^{+}}
      $$

      El potasio va primero porque es el único que ocupa el nivel 4. Los otros
      tres comparten nivel, así que entre ellos decide la carga: el anión, con
      la misma carga sujetando un electrón más, se hincha; el catión, con dos
      protones más y un electrón menos, es el más apretado de todos.

      **Lo que hay que llevarse.** El criterio tiene dos reglas y **hay que
      aplicarlas en orden**:

      1. **Primero el nivel.** Añadir una capa gana a cualquier diferencia de
         carga. Por eso el potasio, con más protones que el cloro, es más
         grande.
      2. **Luego, a igualdad de nivel, la carga nuclear frente a los
         electrones.** Aquí es donde entran la serie isoelectrónica —el que
         más $Z$ tiene, más pequeño— y la pareja átomo/ion: el catión encoge y
         el anión se hincha.

      Y una advertencia que vale para todo el bloque: el examen pide
      **razonar**, no solo ordenar. Una ordenación correcta con el motivo
      equivocado —«el potasio es mayor porque tiene más protones»— se corrige
      como lo que es.

  # ── Resueltos 4, 5 y 6: delante de colfq2-7 ──────────────────────────
  - id: colfq2-4-cuatro-masas-atomicas-medias
    titulo: Cromo, neón, oxígeno y estaño, y la media que pesa cada isótopo
    fuente: >-
      Problema resuelto 4 y problemas propuestos 10, 11 y 12 · Problemas
      resueltos y propuestos del tema 2, Estructura atómica · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la resolución del 4 y la respuesta
      final de los otros tres; el desarrollo es nuestro. En el enunciado del
      10 falta el paréntesis que cierra la última línea de datos.
    nivel: practica
    enunciado: |
      **Problema resuelto 4.** El cromo natural está formado por una mezcla
      de isótopos con la siguiente composición:

      4,345% ⁵⁰Cr (masa atómica = 49,946050 uma)

      83,789% ⁵²Cr (masa atómica = 51,940512 uma)

      9,501% ⁵³Cr (masa atómica = 52,940653 uma)

      2,365% ⁵⁴Cr (masa atómica = 53,938885 uma)

      ¿Cuál será la masa atómica del cromo natural?

      **Problema propuesto 10.** El neón natural está formado por una mezcla de
      isótopos con la siguiente composición:

      89,97% ²⁰Ne (masa atómica = 19,99244 uma)

      0,30% ²¹Ne (masa atómica = 20,99385 uma)

      9,73% ²²Ne (masa atómica = 21,99138 uma

      ¿Cuál será la masa atómica del neón natural?

      **Problema propuesto 11.** El oxígeno natural está formado por una mezcla de
      isótopos con la siguiente composición:

      99,759% ¹⁶O (masa atómica = 15,99491 uma)

      0,037% ¹⁷O (masa atómica = 16,99884 uma)

      0,204% ¹⁸O (masa atómica = 17,9972 uma)

      ¿Cuál será la masa atómica del oxígeno natural?

      **Problema propuesto 12.** El estaño natural está formado por una mezcla de
      isótopos con la siguiente composición:

      0,97% ¹¹²Sn (masa atómica = 111,904826 uma)

      0,66% ¹¹⁴Sn (masa atómica = 113,902784 uma)

      0,34% ¹¹⁵Sn (masa atómica = 114,903348 uma)

      14,54% ¹¹⁶Sn (masa atómica = 115,901747 uma)

      7,68% ¹¹⁷Sn (masa atómica = 116,902956 uma)

      24,22% ¹¹⁸Sn (masa atómica = 117,901609 uma)

      8,59% ¹¹⁹Sn (masa atómica = 118,903311 uma)

      32,58% ¹²⁰Sn (masa atómica = 119,902199 uma)

      4,63% ¹²²Sn (masa atómica = 121,903440 uma)

      5,79% ¹²⁴Sn (masa atómica = 123,905274 uma)

      ¿Cuál será la masa atómica del estaño natural?

      *En el problema 10 la última línea de datos no cierra su paréntesis,
      «(masa atómica = 21,99138 uma»: es así en el original.*
    pide: La masa atómica del cromo, el neón, el oxígeno y el estaño naturales.

    pasos:
      - tipo: reconocer
        pregunta: |
          El ⁵²Cr es el 83,789 % del cromo natural y el ⁵⁴Cr solo el
          2,365 %. ¿Cómo entran las cuatro masas en la masa atómica del cromo
          natural?
        opciones:
          - texto: >-
              Cada una multiplicada por su abundancia: es una media ponderada,
              y se divide entre 100, que es lo que suman los porcentajes
            correcta: true
            mensaje: |
              Eso es. Un átomo de cromo cogido al azar es ⁵²Cr ocho veces de
              cada diez, así que su masa tiene que pesar en la media mucho más
              que las otras tres. Masa por porcentaje, suma, y entre 100.
          - texto: Se suman las cuatro y se divide entre 4
            mensaje: |
              Esa es la media aritmética, y trata igual al isótopo del 83,789 %
              que al del 2,365 %. Daría 52,19 uma, y el cromo natural pesa
              casi lo mismo que su isótopo mayoritario, porque es casi todo él.
          - texto: Se toma la del isótopo más abundante, que es el que manda
            mensaje: |
              Manda, pero no es el único. El 16 % restante también pesa y lleva
              la media de 51,9405 a 51,9961. En el estaño, cuyo isótopo mayor
              es solo un tercio del total, esa aproximación falla por más de
              una unidad.
          - texto: >-
              Con los números másicos, 50, 52, 53 y 54, cada uno por su
              abundancia
            mensaje: |
              La ponderación es la buena y los números no. El número másico
              cuenta nucleones y es un entero; la masa del isótopo no lo es, y
              el enunciado la da con seis decimales para que la uses. Con los
              números másicos sale 52,055, casi seis centésimas por encima del
              51,9961 bueno.

      - tipo: calcular
        titulo: El cromo natural
        pregunta: |
          Problema resuelto 4. ¿Cuál es la masa atómica del cromo natural?
        respuesta:
          tipo: numero
          valor: '51.9961'
          tolerancia: 0.01
          formato: la masa en uma, con cuatro cifras decimales
        distractores:
          - valor: '52.1915'
            mensaje: |
              Si te ha salido 52,19, has hecho la media de las cuatro masas sin
              pesarlas:
              $(49{,}946050 + 51{,}940512 + 52{,}940653 + 53{,}938885)/4$. Así
              el ⁵⁴Cr, que es el 2,365 %, cuenta lo mismo que el ⁵²Cr, que es
              el 83,789 %, y la media sube. Si te ha salido 52,06, has
              ponderado con los números másicos, 50, 52, 53 y 54, en vez de con
              las masas; y si 51,94, te has quedado solo con el ⁵²Cr.
          - valor: '5199.61'
            mensaje: |
              Has multiplicado cada masa por su porcentaje y has sumado, pero
              te falta dividir entre 100: los porcentajes suman 100, no 1. Un
              cromo de 5200 uma pesaría como cien átomos.
          - valor: '1299.90'
            mensaje: |
              Has ponderado bien y después has dividido entre 4, el número de
              isótopos, como en una media aritmética. En una media ponderada se
              divide entre la suma de los pesos, que aquí es 100.
        pista: |
          Multiplica cada masa por su porcentaje, suma los cuatro productos y
          divide entre 100.
        desarrollo: |
          Cada masa por su porcentaje:

          $$
          \overline{m} = \frac{49{,}946050 \cdot 4{,}345 + 51{,}940512 \cdot 83{,}789 + 52{,}940653 \cdot 9{,}501 + 53{,}938885 \cdot 2{,}365}{100}
          $$

          $$
          \overline{m} = \frac{217{,}0156 + 4352{,}0436 + 502{,}9891 + 127{,}5655}{100} = \frac{5199{,}6138}{100} = 51{,}9961\ \text{uma}
          $$

          Es el número de la resolución de la colección, 51,9961 uma. Queda
          0,056 por encima del ⁵²Cr: los dos isótopos más pesados tiran hacia
          arriba más de lo que el ⁵⁰Cr tira hacia abajo.

      - tipo: calcular
        titulo: El neón natural
        pregunta: |
          Problema propuesto 10. ¿Cuál es la masa atómica del neón natural?
        respuesta:
          tipo: numero
          valor: '20.1899'
          tolerancia: 0.005
          formato: la masa en uma, con tres o cuatro cifras decimales
        distractores:
          - valor: '20.9926'
            mensaje: |
              Es la media de las tres masas sin pesarlas. Aquí se nota más que
              en el cromo: el ²⁰Ne es casi el 90 % del neón natural, y la media
              aritmética le da el mismo peso que al ²¹Ne, que es el 0,30 %.
              Sale casi una unidad de más.
          - valor: '20.1976'
            mensaje: |
              Si te ha salido 20,198, has ponderado con los números másicos,
              20, 21 y 22, en vez de con las masas de cada isótopo. La
              ponderación es la buena, pero el ²⁰Ne pesa 19,99244 uma y no 20:
              la diferencia está en la tercera cifra decimal, que es justo la
              que publica la colección, 20,190. Si te ha salido 19,99, te has
              quedado solo con el ²⁰Ne: es el 90 %, pero el ²²Ne sube la media
              dos décimas. Y si has escrito 20,2, puede que la cuenta esté bien
              y solo sobre el redondeo: con un decimal no se distingue de este
              error, y por eso se pide con tres o cuatro.
          - valor: '2018.99'
            mensaje: |
              Te falta dividir entre 100. Los porcentajes suman 100, así que
              la suma de los productos hay que devolverla a tanto por uno.
        pista: |
          Como con el cromo: masa por porcentaje, suma, y entre 100.
        desarrollo: |
          $$
          \overline{m} = \frac{19{,}99244 \cdot 89{,}97 + 20{,}99385 \cdot 0{,}30 + 21{,}99138 \cdot 9{,}73}{100}
          $$

          $$
          \overline{m} = \frac{1798{,}7198 + 6{,}2982 + 213{,}9761}{100} = 20{,}1899\ \text{uma}
          $$

          La colección da 20,190 uma: el mismo número, con tres decimales.
          Fíjate en lo cerca que queda del ²⁰Ne, a 0,2: un isótopo del 90 %
          arrastra la media casi hasta él.

      - tipo: calcular
        titulo: El oxígeno natural
        pregunta: |
          Problema propuesto 11. ¿Cuál es la masa atómica del oxígeno natural?
        respuesta:
          tipo: numero
          valor: '15.9994'
          tolerancia: 0.0005
          formato: la masa en uma, con cuatro cifras decimales
        distractores:
          - valor: '16.0045'
            mensaje: |
              Te sale 16 o muy cerca, y el oxígeno natural pesa 15,9994: la
              diferencia está en las cifras decimales, y eso es el problema
              entero. Si te sale 16,0045, has usado los números másicos —16,
              17 y 18— en vez de las masas de cada isótopo; si 15,9949, te has
              quedado solo con el ¹⁶O; y si un número redondo, has redondeado
              antes de tiempo. La masa del ¹⁶O es 15,99491, no 16.
          - valor: '16.997'
            mensaje: |
              Es la media de las tres masas sin pesarlas: le das al ¹⁸O, que es
              el 0,204 %, el mismo peso que al ¹⁶O, que es el 99,759 %. Sale
              casi una unidad de más.
          - valor: '1599.94'
            mensaje: |
              Te falta dividir entre 100: los porcentajes suman 100.
        pista: |
          Con las masas del enunciado, no con los números másicos. Cuatro
          decimales.
        desarrollo: |
          $$
          \overline{m} = \frac{15{,}99491 \cdot 99{,}759 + 16{,}99884 \cdot 0{,}037 + 17{,}9972 \cdot 0{,}204}{100}
          $$

          $$
          \overline{m} = \frac{1595{,}6362 + 0{,}6290 + 3{,}6714}{100} = 15{,}9994\ \text{uma}
          $$

          Es la respuesta de la colección. Que salga por debajo de 16 no es
          un redondeo: la masa del ¹⁶O es 15,99491 uma, porque el número
          másico cuenta nucleones y la masa de un núcleo no es un número
          entero de unidades. Los otros dos isótopos son tan escasos que no
          la levantan hasta 16.

      - tipo: calcular
        titulo: El estaño natural
        pregunta: |
          Problema propuesto 12. Diez isótopos. ¿Cuál es la masa atómica del estaño
          natural?
        respuesta:
          tipo: numero
          valor: '118.7101'
          tolerancia: 0.015
          formato: la masa en uma, con tres cifras decimales
        distractores:
          - valor: '117.6031'
            mensaje: |
              Si te ha salido 117,60, es la media de las diez masas sin
              pesarlas. El ¹²⁰Sn es el 32,58 % y el ¹¹⁵Sn el 0,34 %, y la media
              aritmética los trata igual: sale más de una unidad por debajo.
              Si te ha salido 118,81, has ponderado con los números másicos en
              vez de con las masas; y si 119,90, te has quedado solo con el
              ¹²⁰Sn, que es solo un tercio del total.
          - valor: '11871.01'
            mensaje: |
              Te falta dividir entre 100. Con diez isótopos es fácil perder el
              último paso: los diez porcentajes suman 100.
          - valor: '1187.10'
            mensaje: |
              Has dividido entre 10, el número de isótopos. La suma de los
              productos se divide entre la suma de los pesos, que es 100.
        pista: |
          Diez productos, la suma y entre 100. Comprueba antes que los diez
          porcentajes suman 100.
        desarrollo: |
          | isótopo | % | masa (uma) | masa · % |
          |---|---|---|---|
          | ¹¹²Sn | 0,97 | 111,904826 | 108,5477 |
          | ¹¹⁴Sn | 0,66 | 113,902784 | 75,1758 |
          | ¹¹⁵Sn | 0,34 | 114,903348 | 39,0671 |
          | ¹¹⁶Sn | 14,54 | 115,901747 | 1685,2114 |
          | ¹¹⁷Sn | 7,68 | 116,902956 | 897,8147 |
          | ¹¹⁸Sn | 24,22 | 117,901609 | 2855,5770 |
          | ¹¹⁹Sn | 8,59 | 118,903311 | 1021,3794 |
          | ¹²⁰Sn | 32,58 | 119,902199 | 3906,4136 |
          | ¹²²Sn | 4,63 | 121,903440 | 564,4129 |
          | ¹²⁴Sn | 5,79 | 123,905274 | 717,4115 |
          | suma | 100,00 | | 11 871,0113 |

          $$
          \overline{m} = \frac{11\,871{,}0113}{100} = 118{,}7101\ \text{uma}
          $$

          La colección da 118,710 uma. El ¹²⁰Sn, el más abundante, pesa
          119,90: con solo un tercio del total, los otros dos tercios bajan la
          media más de una unidad.

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada isótopo pesa en la media tanto como abunda: se multiplica su
              masa por su tanto por ciento.
          - texto: >-
              Se suman los productos y se divide entre 100, que es lo que suman
              los porcentajes.
          - texto: >-
              Se usan las masas isotópicas del enunciado y no los números
              másicos: la diferencia está en los decimales, que es donde está
              la respuesta.
          - texto: >-
              La media queda siempre entre la masa del isótopo más ligero y la
              del más pesado, y un isótopo que sea casi todo el elemento la deja
              cerca de su masa.
          - texto: >-
              Como la masa de cada isótopo es su número másico, la media se
              redondea al entero: el oxígeno natural pesa 16 uma.
            trampa: true
            mensaje: |
              Ni la masa de un isótopo es su número másico —el ¹⁶O pesa
              15,99491 uma— ni la media se redondea. La masa atómica del
              oxígeno natural es 15,9994 uma, y es la que viene en la tabla
              periódica.
        veredicto: |
          Una media ponderada: masa por abundancia, suma y entre 100. Los tres
          errores del ejercicio son tres formas de dejar de ponderar.

    resolucion: |
      **La idea.** La masa atómica de un elemento natural es la media de las
      masas de sus isótopos, pero **ponderada**: cada una pesa tanto como
      abunda. Se multiplica cada masa por su porcentaje, se suma y se divide
      entre 100.

      $$
      \overline{m} = \frac{\sum_i m_i \cdot \%_i}{100}
      $$

      | elemento | isótopos | masa media (uma) | la colección |
      |---|---|---|---|
      | cromo | 4 | 51,9961 | 51,9961, en la resolución |
      | neón | 3 | 20,1899 | 20,190 |
      | oxígeno | 3 | 15,9994 | 15,9994 |
      | estaño | 10 | 118,7101 | 118,710 |

      Coinciden las cuatro. En los cuatro elementos los porcentajes suman
      exactamente 100.

      **Dónde se tuerce la cuenta.** Tres errores dan números que parecen
      razonables:

      - **La media aritmética**, sin pesar: trata igual al isótopo del 90 %
        que al del 0,3 %. En el neón da 20,99, casi una unidad de más.
      - **Los números másicos** en lugar de las masas: en el oxígeno da
        16,0045, y la cuarta cifra decimal es justo lo que el problema
        quiere que veas.
      - **Olvidar el 100**: sale un número cien veces mayor, 5199,6 para el
        cromo, que delata el fallo con solo mirarlo.

      **Una comprobación que no cuesta nada.** La media tiene que caer entre
      la masa del isótopo más ligero y la del más pesado, y un isótopo que
      sea casi todo el elemento la deja cerca de su masa. El neón, con el
      ²⁰Ne en un 90 %, queda a 0,2 de él. El estaño, cuyo isótopo mayor es
      solo un tercio del total, queda a 1,2 uma de ese isótopo y a 0,19 del
      ¹¹⁹Sn, que es solo el 8,59 %: la media no tiene por qué caer junto al
      más abundante.

      Si comparas el neón con la tabla periódica, que da 20,18, la
      diferencia no es tuya: sale de las abundancias que da el enunciado. Y
      el paréntesis que falta en su última línea de datos es una errata del
      original, sin efecto en la cuenta.

  - id: colfq2-5-seis-conjuntos-de-numeros-cuanticos
    titulo: Seis conjuntos de números cuánticos, comprobados en cascada
    fuente: >-
      Problema resuelto 5 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      resolución; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      ¿Cuáles de los siguientes números cuánticos definen correctamente a un
      electrón? Decir de qué electrón se trata en caso de que sea correcto.

      (4,3,-1,1/2), (2,4,-2,1/2), (2,0,-1,1/2), (3,1,-1,1/2), (3,2,-1,1/2),
      (3,1,-2,1/2)
    pide: Qué conjuntos son posibles y, en los que lo son, en qué orbital está el electrón.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para decidir si un conjunto $(n, \ell, m_\ell, m_s)$ es posible, ¿en
          qué orden se comprueba?
        opciones:
          - texto: >-
              En cascada: primero $\ell$ contra $n$, después $m_\ell$ contra
              $\ell$ y al final $m_s$, y en cuanto uno falla se para
            correcta: true
            mensaje: |
              Eso es, y es lo que hace la resolución de la colección con cada
              conjunto. Las cotas dependen unas de otras: el tope de $\ell$ lo
              pone $n$, y el de $m_\ell$ lo pone $\ell$.
          - texto: >-
              Cada número por separado contra los valores que puede tomar: $n$
              positivo, $\ell$ desde 0, $m_\ell$ entero y $m_s = \pm 1/2$
            mensaje: |
              Así pasarían los seis. Los límites van encadenados: $m_\ell = -2$
              existe, pero no con $\ell = 1$. Mirando cada número por separado
              eso no se ve nunca.
          - texto: >-
              Primero $m_s$, que es el que más se equivoca, y después los
              otros tres
            mensaje: |
              En los seis conjuntos $m_s$ vale $1/2$, así que ese número no
              descarta ninguno. Lo que decide aquí son las dos cotas en cadena.
          - texto: >-
              Se compara $m_\ell$ con $n$: tiene que ir de $-(n-1)$ a $n-1$
            mensaje: |
              El tope de $m_\ell$ lo pone $\ell$, no $n$. Con esa regla darías
              por buenos $(2,0,-1,1/2)$ y $(3,1,-2,1/2)$, y los dos son
              imposibles.

      - tipo: calcular
        titulo: Cuántos son posibles
        pregunta: |
          ¿Cuántos de los seis conjuntos definen correctamente a un electrón?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Has comprobado $m_\ell$ contra $n$ en lugar de contra $\ell$.
              Así pasan $(2,0,-1,1/2)$ y $(3,1,-2,1/2)$. Pero el tope de
              $m_\ell$ lo pone $\ell$: con $\ell = 0$ solo vale 0, y con
              $\ell = 1$ solo $-1$, 0 y 1.
          - valor: '4'
            mensaje: |
              Te has saltado la primera cota, $\ell$ contra $n$, y has dado por
              bueno $(2,4,-2,1/2)$. Con $n = 2$, $\ell$ solo puede valer 0 o
              1: en el segundo nivel no existe un orbital con $\ell = 4$.
          - valor: '6'
            mensaje: |
              Has dado por buenos los seis, que es lo que sale al comprobar cada
              número por separado. Las cotas van encadenadas, y con ellas caen
              tres.
        pista: |
          Pasa cada conjunto por las dos cotas, en orden:
          $0 \le \ell \le n - 1$ y $-\ell \le m_\ell \le \ell$.
        desarrollo: |
          | conjunto | $\ell$ contra $n$ | $m_\ell$ contra $\ell$ | |
          |---|---|---|---|
          | (4, 3, −1, 1/2) | 3 ≤ 3 | −3 ≤ −1 ≤ 3 | posible |
          | (2, 4, −2, 1/2) | 4 > 1 | no hace falta mirar | imposible |
          | (2, 0, −1, 1/2) | 0 ≤ 1 | −1 ≠ 0 | imposible |
          | (3, 1, −1, 1/2) | 1 ≤ 2 | −1 ≤ −1 ≤ 1 | posible |
          | (3, 2, −1, 1/2) | 2 ≤ 2 | −2 ≤ −1 ≤ 2 | posible |
          | (3, 1, −2, 1/2) | 1 ≤ 2 | −2 < −1 | imposible |

          Tres posibles y tres imposibles, como en la resolución de la
          colección. $m_s = 1/2$ es válido en los seis.

      - tipo: reconocer
        pregunta: |
          $(2,0,-1,1/2)$ tiene $n$ y $\ell$ compatibles. ¿Por qué no define a
          un electrón?
        opciones:
          - texto: >-
              Porque con $\ell = 0$ el único valor de $m_\ell$ es 0: un
              orbital s tiene una sola orientación
            correcta: true
            mensaje: |
              Eso es. $m_\ell$ va de $-\ell$ a $+\ell$, y con $\ell = 0$ ese
              intervalo se queda en el cero. Un orbital s es una esfera: no hay
              orientaciones que distinguir.
          - texto: Porque con $n = 2$ el valor de $\ell$ tiene que ser 1
            mensaje: |
              $\ell = 0$ es perfectamente válido con $n = 2$: es el 2s. El
              conjunto falla un paso después, en $m_\ell$.
          - texto: Porque $m_s = 1/2$ no es compatible con un $m_\ell$ negativo
            mensaje: |
              $m_s$ no depende de $m_\ell$: vale $+1/2$ o $-1/2$ con cualquier
              orientación. El problema es que la orientación $-1$ no existe en
              un orbital s.
          - texto: Sí lo define, y es un electrón 2s
            mensaje: |
              Sería un 2s si $m_\ell$ valiera 0. Con $m_\ell = -1$ el conjunto
              pide una orientación que el orbital s no tiene.

      - tipo: reconocer
        pregunta: |
          ¿De qué electrón se trata en los tres posibles, $(4,3,-1,1/2)$,
          $(3,1,-1,1/2)$ y $(3,2,-1,1/2)$?
        opciones:
          - texto: Un 4f, un 3p y un 3d
            correcta: true
            mensaje: |
              Eso es: $n$ da el número y $\ell$ la letra, con $0 \to s$,
              $1 \to p$, $2 \to d$ y $3 \to f$. Es la respuesta de la colección.
          - texto: Un 4d, un 3s y un 3p
            mensaje: |
              Has empezado a contar las letras en $\ell = 1$, y la s es
              $\ell = 0$. Cada letra te sale corrida un puesto.
          - texto: >-
              Tres electrones s, porque la resolución escribe «s = ½» para el
              cuarto número
            mensaje: |
              Esa «s» es el espín, el cuarto número cuántico, no la letra del
              orbital. La letra la da $\ell$: 3 es f, 1 es p y 2 es d.
          - texto: >-
              Ninguno es un electrón concreto: los números cuánticos solo dan
              el nivel
            mensaje: |
              Dan mucho más: $n$ el nivel, $\ell$ el subnivel, $m_\ell$ el
              orbital y $m_s$ el giro. Con los cuatro el electrón queda
              identificado, que es lo que dice el principio de exclusión de
              Pauli.

      - tipo: calcular
        titulo: El superíndice de la resolución
        pregunta: |
          La resolución escribe «4f (4f³)». Con su convenio —los orbitales se
          ocupan de $m_\ell = -\ell$ a $+\ell$, primero con $+1/2$—, ¿qué
          número de electrón dentro del subnivel 4f es el $(4,3,-1,1/2)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Has recorrido las orientaciones desde $+3$ hacia abajo: 3, 2, 1,
              0, $-1$. El convenio de la colección empieza por $-\ell$: $-3$,
              $-2$, $-1$, y ahí el $-1$ es el tercero.
          - valor: '10'
            mensaje: |
              Has puesto primero los siete electrones con $-1/2$. En el
              convenio de la colección los siete primeros van con $+1/2$, uno
              por orbital, como pide la regla de Hund; los $-1/2$ llegan en la
              segunda vuelta.
        pista: |
          Recorre los orbitales 4f en el orden $m_\ell = -3, -2, -1, \ldots$
          con un electrón de espín $+1/2$ en cada uno.
        desarrollo: |
          Con $+1/2$, los siete orbitales 4f se ocupan en el orden
          $m_\ell = -3, -2, -1, 0, 1, 2, 3$: el $-1$ es el tercero, y por eso
          la colección escribe 4f³. Con el mismo convenio $(3,1,-1,1/2)$ es el
          primer electrón del 3p (3p¹) y $(3,2,-1,1/2)$ el segundo del 3d
          (3d²), que es como los escribe.

          Es un convenio: con el orden contrario los superíndices cambian, pero
          el orbital no.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $(2,4,-2,1/2)$ falla en la primera cota: con $n = 2$, $\ell$
              solo puede ser 0 o 1.
          - texto: >-
              $(2,0,-1,1/2)$ pasa la primera y falla en la segunda: con
              $\ell = 0$, $m_\ell$ solo puede ser 0.
          - texto: >-
              $(3,1,-2,1/2)$ también falla en $m_\ell$: con $\ell = 1$ las
              orientaciones son $-1$, 0 y 1.
          - texto: >-
              Los otros tres pasan las dos cotas: son un 4f, un 3p y un 3d.
          - texto: >-
              $(3,1,-2,1/2)$ es posible, porque con $n = 3$ el valor de
              $m_\ell$ puede llegar a $-2$.
            trampa: true
            mensaje: |
              Es el error de medir $m_\ell$ contra $n$. Con $n = 3$ hay
              orbitales con $m_\ell = -2$, los 3d, pero este conjunto dice
              $\ell = 1$, un 3p, y el 3p solo tiene tres orientaciones.
        veredicto: |
          Tres posibles y tres imposibles, y cada imposible con su cota: uno
          cae en $\ell$ contra $n$ y dos en $m_\ell$ contra $\ell$.

    resolucion: |
      **La regla, en cascada.** Un conjunto $(n, \ell, m_\ell, m_s)$ es
      posible si cumple, en este orden:

      $$
      n \ge 1, \qquad 0 \le \ell \le n - 1, \qquad -\ell \le m_\ell \le \ell, \qquad m_s = \pm\tfrac{1}{2}
      $$

      En cuanto una falla, se para: no hace falta mirar el resto.

      | conjunto | qué pasa | electrón |
      |---|---|---|
      | (4, 3, −1, 1/2) | pasa las dos cotas | 4f |
      | (2, 4, −2, 1/2) | con $n = 2$, $\ell$ solo puede ser 0 o 1 | imposible |
      | (2, 0, −1, 1/2) | con $\ell = 0$, $m_\ell$ solo puede ser 0 | imposible |
      | (3, 1, −1, 1/2) | pasa las dos cotas | 3p |
      | (3, 2, −1, 1/2) | pasa las dos cotas | 3d |
      | (3, 1, −2, 1/2) | con $\ell = 1$, $m_\ell$ va de −1 a 1 | imposible |

      Es la resolución de la colección, conjunto por conjunto. La letra sale
      de $\ell$ —0 s, 1 p, 2 d, 3 f— y el número, de $n$.

      **Los superíndices de la resolución.** Donde escribe «4f³», «3p¹» y
      «3d²» está diciendo qué electrón concreto del subnivel es, con el
      convenio de ocupar los orbitales de $m_\ell = -\ell$ hacia $+\ell$ y
      primero con $+1/2$. El orbital, que es lo que pide el enunciado, no
      depende del convenio.

      **Dónde se cae.** Los dos imposibles «difíciles» son los que tienen un
      $m_\ell$ que existe en otro subnivel del mismo nivel: $-1$ existe en el
      2p y $-2$ en el 3d. Quien compara $m_\ell$ con $n$ en vez de con
      $\ell$ los da por buenos, y por eso la cascada va en ese orden.

  - id: colfq2-6-seis-configuraciones-atomos-e-iones
    titulo: Seis configuraciones, tres átomos y tres iones
    fuente: >-
      Problema resuelto 6 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      resolución; el diagnóstico de los errores es nuestro. En la del As³⁻ el
      2 del 4s² no está en superíndice.
    nivel: practica
    enunciado: |
      Escribir la configuración de las siguientes especies: ₁₁Na, ₃₄Se, ₇₉Au,
      ₂₀Ca⁺², ₃₃As⁻³, ₂₈Ni⁺²
    pide: La configuración electrónica de los tres átomos y de los tres iones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El níquel, ₂₈Ni, es $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{8}4s^{2}$. Para
          formar el Ni²⁺ pierde dos electrones. ¿Cuáles?
        opciones:
          - texto: Los dos 4s, que son los más externos aunque entraran antes que los 3d
            correcta: true
            mensaje: |
              Eso es, y es lo que escribe la colección: para formar los iones
              positivos se pierden los electrones más externos. El Ni²⁺ queda
              en $\ldots 3d^{8}$, con el 3d intacto.
          - texto: Dos 3d, porque fueron los últimos en entrar
            mensaje: |
              El orden de llenado no es el de vaciado. Una vez ocupado el 3d,
              el 4s queda por fuera, y lo que sale primero es lo de fuera: el
              Ni²⁺ es $\ldots 3d^{8}$, no $\ldots 3d^{6}4s^{2}$.
          - texto: Un 4s y un 3d, uno de cada
            mensaje: |
              No hay reparto: salen los dos del nivel más externo, el 4, y el
              3d se queda con sus ocho.
          - texto: Ninguno, porque un catión se forma perdiendo protones
            mensaje: |
              Los protones no se tocan: son los que dicen qué elemento es. Un
              catión es un átomo que ha perdido electrones. El Ni²⁺ sigue
              teniendo 28 protones y le quedan 26 electrones.

      - tipo: calcular
        titulo: Los electrones de cada especie
        pregunta: |
          Antes de escribir nada, se cuenta. ¿Cuántos electrones tiene cada
          especie, en el orden del enunciado?
        respuesta:
          tipo: vector
          valor: '(11, 34, 79, 18, 36, 26)'
          tolerancia: 0.001
          formato: los seis números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(11, 34, 79, 22, 30, 30)'
            mensaje: |
              Has cambiado el signo de las cargas: al Ca²⁺ y al Ni²⁺ les has
              sumado dos electrones y al As³⁻ le has quitado tres. Es al revés:
              la carga positiva dice que faltan electrones y la negativa que
              sobran.
          - valor: '(11, 34, 79, 20, 33, 28)'
            mensaje: |
              Has dado el número atómico de cada uno, que es el de protones. En
              los tres átomos coincide con los electrones, pero los tres iones
              han perdido o ganado: el Ca²⁺ tiene 18, el As³⁻ 36 y el Ni²⁺ 26.
        pista: |
          Electrones = Z − carga, con su signo: al catión se le restan y al
          anión se le suman.
        desarrollo: |
          Los tres átomos tienen tantos electrones como protones: 11, 34 y 79.
          Los iones:

          $$
          \mathrm{Ca^{2+}}: 20 - 2 = 18 \qquad \mathrm{As^{3-}}: 33 + 3 = 36 \qquad \mathrm{Ni^{2+}}: 28 - 2 = 26
          $$

          El Ca²⁺ se queda con los 18 del argón y el As³⁻ con los 36 del
          kriptón: los dos llegan a un gas noble, que es por lo que se forman.
          El Ni²⁺ no llega a ninguno.

      - tipo: reconocer
        pregunta: |
          El oro, ₇₉Au. ¿Cómo termina su configuración ordenada por niveles?
        opciones:
          - texto: $\ldots 4f^{14}\,5s^{2}5p^{6}\,5d^{10}\,6s^{1}$
            correcta: true
            mensaje: |
              Es lo que escribe la colección. El oro es una de las excepciones
              al diagrama de Moeller, como el cobre y la plata: un electrón pasa
              del 6s al 5d y deja el 5d completo.
          - texto: $\ldots 4f^{14}\,5s^{2}5p^{6}\,5d^{9}\,6s^{2}$
            mensaje: |
              Es lo que da el diagrama de Moeller al pie de la letra, y el oro
              no lo cumple: con $5d^{10}6s^{1}$ la subcapa 5d queda completa,
              que es más estable. Así lo escribe la colección, y es la
              configuración real.
          - texto: $\ldots 5s^{2}5p^{6}\,6s^{1}\,4f^{14}\,5d^{10}$
            mensaje: |
              Es la del orden de llenado, con la excepción ya puesta. Está bien
              como primer paso, pero la respuesta se da ordenada por niveles:
              el 4f con el nivel 4 y el 6s al final.
          - texto: $\ldots 4d^{10}\,5s^{2}5p^{6}\,5d^{10}\,6s^{1}$, sin 4f
            mensaje: |
              Te has saltado el $4f^{14}$. En el diagrama de Moeller entra
              entre el 6s y el 5d y es fácil perderlo; sin él los electrones
              suman 65 y no 79.

      - tipo: calcular
        titulo: El nivel 5 del oro
        pregunta: |
          ¿Cuántos electrones tiene el oro en el nivel $n = 5$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '17'
            mensaje: |
              Te ha salido $5d^{9}$: has seguido Moeller sin la excepción. El
              oro pasa un electrón del 6s al 5d, así que el nivel 5 tiene
              $2 + 6 + 10 = 18$.
          - valor: '8'
            mensaje: |
              Has contado solo $5s^{2}5p^{6}$. Los diez 5d también son del
              nivel 5, aunque se llenen después del 6s: el orden de llenado no
              cambia a qué nivel pertenece cada subnivel.
        pista: |
          Suma todos los subniveles que empiezan por 5, con la excepción del
          oro puesta.
        desarrollo: |
          En la configuración ordenada, el nivel 5 es $5s^{2}5p^{6}5d^{10}$:

          $$
          2 + 6 + 10 = 18
          $$

          Y la comprobación de siempre: $2 + 8 + 18 + 32 + 18 + 1 = 79$, que
          es Z. Los niveles 1 a 4 están completos, con el $4f^{14}$ dentro.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El sodio y el selenio se construyen por Moeller: el selenio
              termina en $4s^{2}3d^{10}4p^{4}$, y ordenado por niveles en
              $3d^{10}4s^{2}4p^{4}$.
          - texto: >-
              El oro sigue Moeller hasta el 5d, y ahí un electrón del 6s pasa
              al 5d: $\ldots 5d^{10}6s^{1}$.
          - texto: >-
              Los aniones ganan electrones donde tocaría seguir llenando: el
              As³⁻ completa el 4p y queda con 36, como el kriptón.
          - texto: >-
              Los cationes pierden los más externos: el Ca²⁺ sus dos 4s, y
              queda como el argón; el Ni²⁺ también los dos 4s, y queda en
              $3d^{8}$.
          - texto: >-
              Como el 3d del níquel se llenó después del 4s, el Ni²⁺ pierde dos
              electrones 3d y queda en $3d^{6}4s^{2}$.
            trampa: true
            mensaje: |
              Es la confusión entre llenar y vaciar. El 4s entra antes, pero
              una vez ocupado el 3d queda por fuera, y un catión pierde primero
              lo de fuera. La colección lo dice con esas palabras: se pierden
              los electrones más externos.
        veredicto: |
          Moeller para construir, niveles para escribir, y los cationes pierden
          por fuera.

    resolucion: |
      **Los tres átomos**, construidos por Moeller y escritos por niveles:

      | especie | electrones | configuración ordenada por niveles |
      |---|---|---|
      | ₁₁Na | 11 | $1s^{2}\,2s^{2}2p^{6}\,3s^{1}$ |
      | ₃₄Se | 34 | $1s^{2}\,2s^{2}2p^{6}\,3s^{2}3p^{6}3d^{10}\,4s^{2}4p^{4}$ |
      | ₇₉Au | 79 | $1s^{2}\,2s^{2}2p^{6}\,3s^{2}3p^{6}3d^{10}\,4s^{2}4p^{6}4d^{10}4f^{14}\,5s^{2}5p^{6}5d^{10}\,6s^{1}$ |

      El selenio en el orden de llenado es $\ldots 4s^{2}3d^{10}4p^{4}$, y el
      oro $\ldots 6s^{1}4f^{14}5d^{10}$: la colección escribe las dos formas,
      y la respuesta es la ordenada. El oro no sigue Moeller al pie de la
      letra —daría $5d^{9}6s^{2}$—: pasa un electrón al 5d para completarlo.

      **Los tres iones:**

      | especie | electrones | configuración |
      |---|---|---|
      | ₂₀Ca²⁺ | 18 | $1s^{2}\,2s^{2}2p^{6}\,3s^{2}3p^{6}$ |
      | ₃₃As³⁻ | 36 | $1s^{2}\,2s^{2}2p^{6}\,3s^{2}3p^{6}3d^{10}\,4s^{2}4p^{6}$ |
      | ₂₈Ni²⁺ | 26 | $1s^{2}\,2s^{2}2p^{6}\,3s^{2}3p^{6}3d^{8}$ |

      Coinciden las seis con la resolución de la colección, que en la del
      As³⁻ deja el 2 del $4s^{2}$ sin subir: es una errata de tipografía.

      **Lo que hay que llevarse.** El anión gana por donde se llenaría el
      átomo siguiente; el catión pierde por fuera, y en un metal de
      transición «fuera» es el 4s, no el 3d. Por eso el Ni²⁺ conserva sus
      ocho electrones 3d. El Ca²⁺ y el As³⁻ acaban con la configuración de
      un gas noble; el Ni²⁺ no, y aun así es el ion más habitual del níquel.

  - id: colfq2-7-tres-slater-y-uno-es-distinto
    titulo: Tres cargas efectivas, y una que se calcula con otra tabla
    fuente: >-
      Problema resuelto 7 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      solución; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Calcular la carga nuclear efectiva del último electrón que ha entrado en
      los átomos: ₃₃As, ₅₆Ba, ₂₈Ni
    pide: Las tres cargas nucleares efectivas por las reglas de Slater.

    pasos:
      - tipo: reconocer
        pregunta: |
          De los tres, ¿cuál se calcula con una tabla distinta y por qué?
        opciones:
          - texto: El níquel, porque su último electrón entra en un orbital $d$
            correcta: true
            mensaje: |
              Eso es. Para un electrón $d$ o $f$ desaparece el escalón de
              $0{,}85$: los compañeros de grupo siguen aportando $0{,}35$ y
              **todo lo que queda a la izquierda aporta $1{,}00$**, sin
              distinguir capas.
          - texto: El bario, porque es el más pesado de los tres
            mensaje: |
              El tamaño no cambia las reglas. El bario tiene 56 electrones y
              se calcula igual que el arsénico: su último electrón entra en un
              $6s$, que es un orbital $s$.
          - texto: El arsénico, porque su capa de valencia está semillena
            mensaje: |
              Que el $4p^{3}$ esté semilleno explica su energía de ionización
              alta, no cómo se calcula el apantallamiento. Slater no mira si
              una subcapa está medio llena.
          - texto: Ninguno; las reglas de Slater son las mismas para todos
            mensaje: |
              Hay dos tablas y esa es la mitad del problema. Aplicar la de los
              electrones $s$ y $p$ a un electrón $d$ da un resultado más de
              dos unidades distinto.

      - tipo: calcular
        titulo: El bario
        pregunta: |
          Con la configuración agrupada
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2}4p^{6})(4d^{10})(5s^{2}5p^{6})(6s^{2})$,
          ¿cuánto vale $Z_{\text{ef}}$ del electrón $6s$?
        respuesta:
          tipo: numero
          valor: '2.85'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              Es la cuenta ingenua, $56 - 54$. Trata a los 54 electrones
              internos como si taparan del todo, y los ocho de la capa 5 solo
              tapan $0{,}85$ cada uno.
          - valor: '2.50'
            mensaje: |
              Te has contado a ti mismo. En $(6s^{2})$ hay dos electrones, así
              que el que miramos tiene **un** compañero.
          - valor: '1.65'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho de la capa 5. Esa es la
              capa $n-1$ y su peso es $0{,}85$; el $1{,}00$ empieza en la
              capa 4.
        pista: |
          Un compañero en el grupo, ocho electrones en la capa 5, y los otros
          46 más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 8 \times 0{,}85 + 46 \times 1{,}00 = 53{,}15
          $$

          $$
          Z_{\text{ef}} = 56 - 53{,}15 = 2{,}85
          $$

          Y fíjate en el número: **2,85 sobre 56 protones**. Casi toda la
          carga del núcleo está apantallada, y por eso el bario es un metal
          que cede sus electrones con muchísima facilidad.

      - tipo: calcular
        titulo: El níquel
        pregunta: |
          El níquel, $Z = 28$, tiene la configuración ordenada
          $\ldots 3s^{2}3p^{6}3d^{8}4s^{2}$ y su electrón diferenciador es un
          $3d$. ¿Cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '7.55'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '6.85'
            mensaje: |
              Has contado los dos electrones $4s$. Están en un grupo a la
              **derecha** del $3d$, y los de la derecha no apantallan nada.
          - valor: '7.20'
            mensaje: |
              Te has contado a ti mismo entre los compañeros. En $(3d^{8})$
              hay ocho electrones, así que el que miramos tiene siete.
          - valor: '10'
            mensaje: |
              Es la cuenta ingenua, $28 - 18$, quitando «los electrones
              internos». Slater existe porque apantallar no es tapar del
              todo, y aquí la diferencia es de dos unidades y media.
        pista: |
          Siete compañeros a $0{,}35$ y dieciocho a la izquierda a $1{,}00$.
          Los $4s$ no cuentan.
        desarrollo: |
          $$
          S = 7 \times 0{,}35 + 18 \times 1{,}00 = 20{,}45
          $$

          $$
          Z_{\text{ef}} = 28 - 20{,}45 = 7{,}55
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Para el arsénico y el bario el último electrón entra en un orbital s o p, así que valen los tres pesos: 0,35 en el grupo, 0,85 en la capa n−1 y 1,00 más adentro.'
          - texto: 'Así, el arsénico da S = 4(0,35) + 18(0,85) + 10(1,00) = 26,7 y Zef = 6,3; el bario da S = 53,15 y Zef = 2,85.'
          - texto: 'Para el níquel el último electrón entra en un 3d, y ahí la tabla se acorta a dos pesos.'
          - texto: 'Los dos electrones 4s quedan a la derecha del grupo 3d y no apantallan, así que S = 7(0,35) + 18(1,00) = 20,45 y Zef = 7,55.'
          - texto: 'El níquel tiene la carga efectiva mayor de los tres porque es el que más protones tiene.'
            trampa: true
            mensaje: |
              El níquel tiene 28 protones y el bario 56, o sea la mitad, y
              aun así su carga efectiva es más del doble. Lo que decide no es
              cuántos protones hay sino **cuánto los tapan los electrones de
              dentro**, y el bario tiene 54 tapando frente a los 20 del
              níquel.
    resolucion: |
      **Las dos tablas, que es de lo que va el problema.** Slater no es una
      regla sino dos, y el enunciado ha elegido los tres átomos para que se
      note.

      Si el electrón que se mira está en un $ns$ o un $np$:

      | dónde está el que apantalla | aporta |
      |---|---|
      | a la derecha de su grupo | 0 |
      | en su mismo grupo | 0,35 |
      | en la capa $n-1$ | 0,85 |
      | en $n-2$ o más adentro | 1,00 |

      Si está en un $nd$ o un $nf$, solo quedan dos filas: 0,35 en su grupo y
      **1,00 para todo lo que quede a la izquierda**.

      **₃₃As**, último electrón en $(4s^{2}4p^{3})$:

      $$
      S = 4 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 26{,}70 \quad\Longrightarrow\quad Z_{\text{ef}} = 6{,}30
      $$

      **₅₆Ba**, último electrón en $(6s^{2})$:

      $$
      S = 1 \times 0{,}35 + 8 \times 0{,}85 + 46 \times 1{,}00 = 53{,}15 \quad\Longrightarrow\quad Z_{\text{ef}} = 2{,}85
      $$

      **₂₈Ni**, diferenciador en $(3d^{8})$, con los $4s^{2}$ fuera por estar
      a la derecha:

      $$
      S = 7 \times 0{,}35 + 18 \times 1{,}00 = 20{,}45 \quad\Longrightarrow\quad Z_{\text{ef}} = 7{,}55
      $$

      **Lo que dicen los tres juntos.** El bario tiene el doble de protones
      que el níquel y menos de la mitad de carga efectiva. Esa es toda la
      química del bloque $s$ frente al bloque $d$ en un número: el electrón
      de valencia del bario apenas siente el núcleo, así que se va con nada,
      y el del níquel está mucho más sujeto.

      Y el arsénico, con 33 protones, siente 6,30 — más que el bario con 56.
      **La carga efectiva no crece con el tamaño del átomo**, crece al
      avanzar por un periodo y cae al bajar por un grupo.

  # ── Resueltos 8 y 9: entre colfq2-7 y colfq2-10 ──────────────────────
  - id: colfq2-8-cuatro-configuraciones-cuatro-elementos
    titulo: Cuatro configuraciones, y el elemento, el periodo, el grupo y el tipo de cada una
    fuente: >-
      Problema resuelto 8 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      resolución, que da el periodo, el grupo y el tipo pero no nombra los
      elementos: la identificación y el diagnóstico de los errores son
      nuestros.
    nivel: practica
    enunciado: |
      Dadas las siguientes configuraciones electrónicas, indicar a qué
      elementos corresponden, además de periodo, grupo y tipo de elemento.

      a) 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶5s²

      b) 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶ 4d³5s²

      c) 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s¹

      d) 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶ 4d¹⁰4f⁷5s²5p⁶5d¹6s²
    pide: El elemento, el periodo, el grupo y el tipo de cada configuración.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de sumar nada. ¿De dónde se leen el periodo y el tipo de
          elemento?
        opciones:
          - texto: >-
              El periodo, del $n$ más alto que aparece; el tipo, de la letra
              del subnivel que se está llenando
            correcta: true
            mensaje: |
              Eso es, y es lo que hace la resolución de la colección con las
              cuatro: «el nivel energético más alto es el 5» para el periodo,
              y «el último electrón va a un orbital s, d o f» para el tipo.
              Son dos lecturas distintas y cada una mira un sitio.
          - texto: >-
              Los dos del último electrón que entra: su $n$ es el periodo y su
              letra el tipo
            mensaje: |
              La letra sí sale de ahí; el periodo no. En el b el último
              electrón que entra es un $4d$, y el elemento está en el periodo
              5, porque ya tiene ocupado el $5s$. El periodo es el nivel más
              alto que el átomo ha empezado a llenar.
          - texto: >-
              Del final de la configuración escrita: si termina en $s^{2}$ es
              un alcalinotérreo, y si termina en $s^{1}$ un alcalino
            mensaje: |
              Así los cuatro serían representativos, y solo lo es el a. El b,
              el c y el d tienen electrones $d$ o $f$ entrando por dentro, y
              son de transición aunque la cadena escrita acabe en un $s$. El
              final escrito dice cuál es el nivel más externo, no qué se está
              llenando.

      - tipo: calcular
        titulo: Los cuatro números atómicos
        pregunta: |
          Sumando los superíndices, ¿qué número atómico tiene cada
          configuración, en el orden a, b, c, d?
        respuesta:
          tipo: vector
          valor: '(38, 41, 47, 64)'
          tolerancia: 0.001
          formato: los cuatro números atómicos en el orden a, b, c, d, entre paréntesis y separados por comas
        distractores:
          - valor: '(38, 38, 37, 56)'
            mensaje: |
              Has identificado cada uno por el último subnivel escrito, como
              si fueran representativos: $5s^{2}$ es el estroncio, $5s^{1}$ el
              rubidio y $6s^{2}$ el bario. Pero el b, el c y el d tienen
              electrones $d$ o $f$ por dentro que también cuentan. El número
              atómico es la suma de **todos** los superíndices.
          - valor: '(38, 41, 47, 57)'
            mensaje: |
              El d te ha salido 57, que es el lantano: $5d^{1}6s^{2}$ sin nada
              en el $4f$. Te has saltado el $4f^{7}$, que está escrito entre
              el $4d^{10}$ y el $5s^{2}$ y suma siete electrones más.
        pista: |
          Suma todos los superíndices de cada línea. Los cuatro empiezan igual
          hasta el $4p^{6}$, que ya son 36.
        desarrollo: |
          Hasta el $4p^{6}$ las cuatro comparten 36 electrones, la
          configuración del kriptón. Lo que sigue:

          | | después del $4p^{6}$ | $Z$ | elemento |
          |---|---|---|---|
          | a | $5s^{2}$ | $36 + 2 = 38$ | estroncio |
          | b | $4d^{3}5s^{2}$ | $36 + 5 = 41$ | niobio |
          | c | $4d^{10}5s^{1}$ | $36 + 11 = 47$ | plata |
          | d | $4d^{10}4f^{7}5s^{2}5p^{6}5d^{1}6s^{2}$ | $36 + 28 = 64$ | gadolinio |

          La colección no nombra los elementos; salen de la tabla periódica
          con el número atómico.

      - tipo: calcular
        titulo: Los cuatro periodos
        pregunta: |
          ¿En qué periodo está cada uno, en el orden a, b, c, d?
        respuesta:
          tipo: vector
          valor: '(5, 5, 5, 6)'
          tolerancia: 0.001
          formato: los cuatro periodos en el orden a, b, c, d, entre paréntesis y separados por comas
        distractores:
          - valor: '(5, 4, 4, 4)'
            mensaje: |
              Has tomado el $n$ del electrón diferenciador: $4d$ en el b y el
              c, $4f$ en el d. El periodo no es ese: es el nivel más alto que
              el átomo tiene ocupado, y los tres tienen ya electrones en el
              $5s$ o en el $6s$.
          - valor: '(5, 4, 4, 5)'
            mensaje: |
              En el a, que es representativo, has leído bien el $5s$; en los
              otros tres has tomado el $n$ del último subnivel $d$ o $f$ que
              aparece: $4d$ en el b y el c, $5d$ en el d. Esos subniveles
              quedan por dentro del $s$ de fuera y no dicen el periodo. El
              periodo lo da el $n$ más alto escrito: 5, 5, 5 y 6.
        pista: |
          Busca en cada línea el número más alto delante de una letra.
        desarrollo: |
          El $n$ más alto es 5 en las tres primeras ($5s$) y 6 en la última
          ($6s$): periodos 5, 5, 5 y 6. Son los de la resolución de la
          colección.

      - tipo: reconocer
        pregunta: |
          ¿Y los grupos, en el orden a, b, c, d?
        opciones:
          - texto: a) 2A · b) 5B · c) 1B · d) lantánidos
            correcta: true
            mensaje: |
              Es la resolución de la colección. En el a se cuentan los dos
              electrones del nivel 5. En el b y el c, los del $d$ más los del
              $s$ de fuera: tres más dos, cinco, y diez más uno, once, que es
              la columna que en la notación A/B se llama 1B. El d está
              llenando el $4f$: es un lantánido.
          - texto: a) 2A · b) 2A · c) 1A · d) 2A
            mensaje: |
              Has mirado solo el $s$ de fuera, como si los cuatro fueran
              representativos. Eso vale para el a. En los de transición los
              electrones $d$ también son de valencia y entran en la cuenta: el
              c no es un alcalino, es la plata.
          - texto: a) 2A · b) 3B · c) 8B · d) lantánidos
            mensaje: |
              Has contado solo los electrones $d$: tres en el b y diez en el
              c. En un elemento de transición el grupo cuenta los $d$ **y** los
              $s$ de fuera: $4d^{3}5s^{2}$ son cinco, grupo 5B, y
              $4d^{10}5s^{1}$ son once, grupo 1B.
          - texto: a) 2A · b) 5B · c) 11B · d) lantánidos
            mensaje: |
              La cuenta es la buena y el nombre no. Once electrones de valencia
              es la columna 11, que en la notación A/B de la colección se llama
              **1B**: después de la 8B, que abarca las columnas 8, 9 y 10,
              vienen la 1B y la 2B. Un «11B» no existe.

      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de elemento es cada uno?
        opciones:
          - texto: a) representativo · b) y c) de transición · d) de transición interna
            correcta: true
            mensaje: |
              Eso es. El a llena un $s$; el b y el c, el $4d$; el d, el $4f$.
              Es lo que dice la resolución de la colección.
          - texto: a) representativo · b) de transición · c) representativo · d) de transición interna
            mensaje: |
              El c termina en $5s^{1}$ y por eso parece un alcalino, pero lo
              que se está llenando es el $4d$: la plata es de transición. El
              $5s^{1}$ en lugar de $5s^{2}$ es su excepción, la misma que la del
              cobre: el $4d$ se queda completo a costa de un electrón del
              $5s$.
          - texto: a) representativo · b) y c) de transición · d) de transición, por su electrón $5d$
            mensaje: |
              El $5d^{1}$ despista, pero el subnivel que el gadolinio está
              llenando es el $4f$, con siete electrones. Por eso la colección
              lo pone en los lantánidos, que son de transición interna.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Sumando los superíndices salen 38, 41, 47 y 64: estroncio,
              niobio, plata y gadolinio.
          - texto: >-
              El $n$ más alto es 5 en los tres primeros y 6 en el último: esos
              son los periodos.
          - texto: >-
              El subnivel que se está llenando es un $s$, un $d$, un $d$ y un
              $f$: representativo, dos de transición y uno de transición
              interna.
          - texto: >-
              El grupo se cuenta con los electrones de valencia: $5s^{2}$ da
              2A; $4d^{3}5s^{2}$, cinco, 5B; $4d^{10}5s^{1}$, once, 1B; y el
              $4f$ a medio llenar, los lantánidos.
          - texto: >-
              El c termina en $5s^{1}$, así que es un alcalino del grupo 1A,
              igual que el rubidio.
            trampa: true
            mensaje: |
              Termina en $5s^{1}$, pero tiene diez electrones $4d$ que el
              rubidio no tiene: once más que el kriptón y no uno. Es la plata,
              de transición, y su $5s^{1}$ es la misma excepción que la del
              cobre.
        veredicto: |
          El periodo se lee en el $n$ más alto, el tipo en la letra del
          subnivel que se está llenando, y el grupo contando todos los
          electrones de valencia, los $d$ incluidos.

    resolucion: |
      **Primero se cuenta.** Hasta el $4p^{6}$ las cuatro configuraciones son
      la del kriptón, 36 electrones, y lo que viene después decide:

      | | configuración | $Z$ | elemento | periodo | grupo | tipo |
      |---|---|---|---|---|---|---|
      | a | $[\mathrm{Kr}]\,5s^{2}$ | 38 | Sr | 5 | 2A | representativo |
      | b | $[\mathrm{Kr}]\,4d^{3}5s^{2}$ | 41 | Nb | 5 | 5B | de transición |
      | c | $[\mathrm{Kr}]\,4d^{10}5s^{1}$ | 47 | Ag | 5 | 1B | de transición |
      | d | $[\mathrm{Kr}]\,4d^{10}4f^{7}5s^{2}5p^{6}5d^{1}6s^{2}$ | 64 | Gd | 6 | lantánidos | de transición interna |

      El periodo, el grupo y el tipo coinciden con la resolución de la
      colección, que no nombra los elementos.

      **Tres lecturas, cada una en su sitio.**

      - El **periodo** es el $n$ más alto que aparece, no el del último
        electrón que entra: el b llena el $4d$ y está en el periodo 5.
      - El **tipo** es la letra del subnivel que se está llenando: $s$ o $p$,
        representativo; $d$, de transición; $f$, de transición interna.
      - El **grupo** de un representativo cuenta los electrones del nivel más
        alto; el de uno de transición, los $d$ más los $s$ de fuera. Once es la
        columna 1B.

      **Dos notas que el problema no pide.** El c ya viene escrito con su
      excepción: por el diagrama de Moeller la plata sería $4d^{9}5s^{2}$, y
      la real es $4d^{10}5s^{1}$, como la del cobre. Y el b es la
      configuración que da Moeller para $Z = 41$; la del niobio real es
      $4d^{4}5s^{1}$, otra excepción. Al periodo y al grupo no les cambia
      nada: los electrones de valencia siguen siendo cinco.

  - id: colfq2-9-selenio-y-cesio
    titulo: Dos elementos por su número atómico, y quién gana en ionización y en radio
    fuente: >-
      Problema resuelto 9 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      resolución; las cargas efectivas y el diagnóstico de los errores son
      nuestros.
    nivel: practica
    enunciado: |
      Dados los elementos ₃₄A, ₅₅B, indicar: a) Configuración electrónica de
      los átomos neutros y de los iones que puedan formar, b) Grupo y periodo
      al que pertenecen e identificar dichos elementos, c) ¿Quién presentará
      mayor energía de ionización?, d) ¿Quién presentará mayor radio?
    pide: Las configuraciones de los átomos y de sus iones, el grupo, el periodo y el nombre de cada uno, y cuál tiene mayor energía de ionización y cuál mayor radio.

    pasos:
      - tipo: reconocer
        pregunta: |
          A es $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{10}4s^{2}4p^{4}$ y B termina
          en $\ldots 5s^{2}5p^{6}6s^{1}$. ¿Qué ion forma cada uno?
        opciones:
          - texto: A²⁻ y B⁺
            correcta: true
            mensaje: |
              Eso es. Al A le faltan dos electrones para la configuración del
              gas noble siguiente y los gana; al B le sobra uno y lo cede. Cada
              uno llega al gas noble por el camino más corto, que es lo que
              escribe la colección.
          - texto: A⁶⁺ y B⁺
            mensaje: |
              El A tendría que perder seis electrones, los $4s^{2}4p^{4}$, para
              quedarse con la capa del argón más el $3d^{10}$. Le cuesta mucho
              menos ganar dos y completar el $4p$: el camino corto es el
              anión.
          - texto: A²⁺ y B⁻
            mensaje: |
              Los signos están cambiados. Si al A le **faltan** dos electrones,
              los gana, y ganar electrones da carga negativa. El B cede el que
              le sobra y queda positivo.
          - texto: A²⁻ y B⁷⁻
            mensaje: |
              Al B, para completar el $6p$ como el A completa su $4p$, le
              harían falta siete electrones. Soltar el único $6s$ lo deja con
              la configuración del xenón y cuesta muchísimo menos: el cesio es
              el catión más fácil de toda la tabla.

      - tipo: calcular
        titulo: Los electrones de los dos iones
        pregunta: |
          ¿Cuántos electrones tiene el ion del A y cuántos el del B?
        respuesta:
          tipo: vector
          valor: '(36, 54)'
          tolerancia: 0.001
          formato: los electrones del ion de A y del ion de B, en ese orden, entre paréntesis y separados por comas
        distractores:
          - valor: '(32, 56)'
            mensaje: |
              Has aplicado las cargas al revés: al A²⁻ le has quitado dos
              electrones y al B⁺ le has sumado uno. La carga negativa dice que
              sobran electrones respecto de los protones, así que el A²⁻ tiene
              $34 + 2$.
          - valor: '(28, 54)'
            mensaje: |
              Has formado el A⁶⁺, perdiendo los seis electrones de la capa 4.
              El ion estable del A es el A²⁻, con 36 electrones, la
              configuración del kriptón.
        pista: |
          Electrones = $Z$ − carga, con su signo.
        desarrollo: |
          $$
          \mathrm{A^{2-}}:\ 34 + 2 = 36 \qquad \mathrm{B^{+}}:\ 55 - 1 = 54
          $$

          36 es el kriptón y 54 el xenón: los dos iones tienen configuración
          de gas noble, que es lo que escribe la colección,
          $\ldots 3d^{10}4s^{2}4p^{6}$ para A²⁻ y $\ldots 4d^{10}5s^{2}5p^{6}$
          para B⁺.

      - tipo: reconocer
        pregunta: |
          ¿Grupo, periodo y nombre de cada uno?
        opciones:
          - texto: A, periodo 4 y grupo 6A, el selenio · B, periodo 6 y grupo 1A, el cesio
            correcta: true
            mensaje: |
              Es la resolución de la colección. El periodo es el nivel más alto
              ocupado —4 y 6— y el grupo, los electrones de ese nivel en un
              representativo: $4s^{2}4p^{4}$ son seis y $6s^{1}$ es uno.
          - texto: A, periodo 4 y grupo 6B, el cromo · B, periodo 6 y grupo 1A, el cesio
            mensaje: |
              El $3d^{10}$ del A está completo y por dentro: el último electrón
              entra en un $4p$, así que el A es representativo. El 6B es el
              cromo, $Z = 24$, que tiene diez electrones menos.
          - texto: A, periodo 4 y grupo 4A, el germanio · B, periodo 6 y grupo 1A, el cesio
            mensaje: |
              Has contado solo los cuatro electrones $4p$. En un representativo
              el grupo cuenta todo el nivel más alto, $4s^{2}4p^{4}$: seis, el
              6A. El 4A es el germanio, $Z = 32$.
          - texto: A, periodo 4 y grupo 6A, el selenio · B, periodo 5 y grupo 1A, el rubidio
            mensaje: |
              Has leído el periodo del B en su ion: el B⁺ acaba en $5p^{6}$. El
              átomo neutro tiene el $6s^{1}$ ocupado, así que está en el
              periodo 6. El rubidio, $Z = 37$, es el alcalino del periodo 5.

      - tipo: calcular
        titulo: La carga efectiva del selenio
        pregunta: |
          Con la configuración agrupada
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2}4p^{4})$,
          ¿qué carga nuclear efectiva siente un electrón $4p$ del selenio?
        respuesta:
          tipo: numero
          valor: '6.95'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '6.60'
            mensaje: |
              Te has contado a ti mismo en el grupo $(4s^{2}4p^{4})$. Son seis
              electrones, así que el que miramos tiene **cinco** compañeros,
              no seis.
          - valor: '4.25'
            mensaje: |
              Has apantallado con $1{,}00$ los dieciocho electrones del nivel
              3. Es la capa $n-1$ y su peso es $0{,}85$; el $1{,}00$ empieza en
              la capa 2.
          - valor: '6'
            mensaje: |
              Es la cuenta ingenua, $34 - 28$, quitando los electrones internos
              como si taparan del todo. Los dieciocho de la capa 3 tapan
              $0{,}85$ cada uno, y los cinco compañeros de la 4 también tapan
              algo.
        pista: |
          Cinco compañeros a $0{,}35$, dieciocho en la capa 3 a $0{,}85$ y
          diez más adentro a $1{,}00$.
        desarrollo: |
          $$
          S = 5 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 27{,}05
          \qquad
          Z_{\text{ef}} = 34 - 27{,}05 = 6{,}95
          $$

          La colección no calcula la carga efectiva: razona con la posición
          en la tabla. Este número es el que hay detrás de su «más hacia la
          derecha».

      - tipo: calcular
        titulo: La carga efectiva del cesio
        pregunta: |
          ¿Y la del electrón $6s$ del cesio, con
          $(\ldots)(4d^{10})(5s^{2}5p^{6})(6s^{1})$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '1.85'
            mensaje: |
              Te has contado a ti mismo. En el grupo $(6s^{1})$ no hay nadie
              más que el electrón que miramos, y ese término vale cero.
          - valor: '1'
            mensaje: |
              Es la cuenta ingenua, $55 - 54$, o lo que es lo mismo: los ocho
              de la capa 5 a $1{,}00$. Esa es la capa $n-1$ y pesa $0{,}85$.
        pista: |
          Ningún compañero, ocho electrones en la capa 5 y cuarenta y seis más
          adentro.
        desarrollo: |
          $$
          S = 8 \times 0{,}85 + 46 \times 1{,}00 = 52{,}80
          \qquad
          Z_{\text{ef}} = 55 - 52{,}80 = 2{,}20
          $$

          Lo mismo que el sodio, 2,20: del sodio para abajo todos los
          alcalinos dan ese número por Slater, porque tienen un electrón solo
          con ocho en la capa de debajo. Lo que distingue al cesio es el
          $n = 6$.

      - tipo: reconocer
        pregunta: |
          c) y d). ¿Quién tiene mayor energía de ionización y quién mayor
          radio?
        opciones:
          - texto: Mayor energía de ionización el selenio; mayor radio el cesio
            correcta: true
            mensaje: |
              Eso es, y las dos cosas por la misma pareja de razones: el
              electrón de fuera del selenio está en $n = 4$ y siente 6,95; el
              del cesio está en $n = 6$ y siente 2,20. Más cerca y más sujeto
              cuesta más de arrancar y deja un átomo más pequeño.
          - texto: Mayor energía de ionización el cesio, porque tiene más protones
            mensaje: |
              Tiene 55 frente a 34, pero los electrones de dentro le tapan
              52,80 de esas 55 cargas. Lo que el electrón de fuera siente es
              $Z_{\text{ef}}$, y ahí el cesio se queda en 2,20.
          - texto: Mayor radio el selenio, porque forma un anión grande
            mensaje: |
              El Se²⁻ es mayor que el átomo de selenio, pero la pregunta es por
              los átomos. El cesio tiene seis capas y el selenio cuatro, y con
              menos carga efectiva: es el más grande de los dos con diferencia.
          - texto: El selenio en las dos, porque tiene más carga efectiva
            mensaje: |
              Más carga efectiva sujeta más los electrones, y eso encoge el
              átomo, no lo agranda. La energía de ionización y el radio van en
              sentidos contrarios: el que gana en una pierde en la otra.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A termina en $4s^{2}4p^{4}$: periodo 4, grupo 6A, el selenio.
              Gana dos electrones y forma A²⁻, con la configuración del
              kriptón.
          - texto: >-
              B termina en $6s^{1}$: periodo 6, grupo 1A, el cesio. Cede uno y
              forma B⁺, con la del xenón.
          - texto: >-
              El electrón de fuera del selenio está en $n = 4$ con
              $Z_{\text{ef}} = 6{,}95$; el del cesio, en $n = 6$ con 2,20.
          - texto: >-
              Por eso el selenio tiene la energía de ionización mayor y el
              cesio el radio mayor.
          - texto: >-
              El cesio tiene más energía de ionización porque su electrón
              $6s$ está solo en su orbital y cuesta más separarlo.
            trampa: true
            mensaje: |
              Estar solo en el orbital no lo sujeta más; lo que lo sujeta es la
              carga efectiva, y la del cesio es de las más bajas de la tabla,
              con el electrón en la capa 6. Por eso los alcalinos se ionizan con
              tanta facilidad, y el cesio el que más.
        veredicto: |
          Arriba y a la derecha, energía de ionización; abajo y a la izquierda,
          radio. Y las dos cosas salen de $n$ y de $Z_{\text{ef}}$.

    resolucion: |
      **a · Configuraciones.**

      | | configuración | ion | configuración del ion |
      |---|---|---|---|
      | ₃₄A | $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{4}$ | A²⁻ | $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{6}$ |
      | ₅₅B | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{6}6s^{1}$ | B⁺ | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{6}$ |

      Al A le faltan dos electrones para el gas noble y al B le sobra uno.

      **b · Grupo, periodo y nombre.** A está en el periodo 4 y el grupo 6A:
      el **selenio**. B, en el periodo 6 y el grupo 1A: el **cesio**. Es lo que
      da la colección.

      **c y d · Las dos propiedades.** La colección razona con la posición:
      el selenio está más arriba y más a la derecha. Detrás de esa frase hay
      dos números:

      | | $n$ del electrón de fuera | $Z_{\text{ef}}$ |
      |---|---|---|
      | Se | 4 | $34 - 27{,}05 = 6{,}95$ |
      | Cs | 6 | $55 - 52{,}80 = 2{,}20$ |

      Los dos criterios apuntan al mismo sitio: el electrón del selenio está
      más cerca **y** más sujeto. Por eso el selenio tiene la **mayor energía
      de ionización** y el cesio el **mayor radio**.

      **Lo que conviene ver.** Aquí no hace falta decidir cuál de los dos
      criterios manda, porque coinciden. Cuando no coinciden —un elemento más
      arriba pero más a la izquierda— es cuando hay que pensar, y por eso
      conviene tener los dos números y no solo la flecha de la tabla.

  - id: colfq2-10-ordenar-por-electronegatividad
    titulo: Ordenar por electronegatividad, dentro de un grupo y dentro de un periodo
    fuente: >-
      Problema resuelto 10 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      solución; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Ordenar los siguientes elementos en orden creciente de su
      electronegatividad:

      a) Br, Cl, F, I

      b) Cl, S, Na, Al, Mg
    pide: Los dos órdenes crecientes, con el criterio que decide cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos apartados no se resuelven con el mismo criterio. ¿Por qué?
        opciones:
          - texto: Porque en el a los elementos son de un mismo grupo y en el b de un mismo periodo
            correcta: true
            mensaje: |
              Exacto, y ahí está todo. Dentro de un grupo cambia $n$ y no
              hay más que mirar; dentro de un periodo $n$ es el mismo y quien
              decide es la carga efectiva.
          - texto: Porque en el a son halógenos y los halógenos van al revés
            mensaje: |
              Los halógenos no son una excepción a nada. Lo que hace distinto
              al apartado a es que sus cuatro elementos comparten grupo, y eso
              pasaría igual con los alcalinos o los gases nobles.
          - texto: Porque el b tiene metales y los metales no tienen electronegatividad
            mensaje: |
              Sí la tienen, solo que baja: el sodio vale 0,93 y el cloro 3,16.
              Precisamente por eso se pueden ordenar todos juntos.
          - texto: Porque en el b hay cinco elementos y en el a cuatro
            mensaje: |
              El número de elementos no cambia el criterio. Lo que lo cambia
              es si comparten grupo o periodo.

      - tipo: calcular
        titulo: La carga efectiva del aluminio
        pregunta: |
          Para ordenar el apartado b hace falta la carga efectiva de cada uno.
          ¿Cuánto vale la del aluminio, $Z = 13$?
        respuesta:
          tipo: numero
          valor: '3.50'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '3'
            mensaje: |
              La cuenta ingenua, $13 - 10$. Da un número redondo y por eso
              engaña; con ella el aluminio y el boro tendrían la misma carga
              efectiva.
          - valor: '3.15'
            mensaje: |
              Te has contado a ti mismo. El grupo $(3s^{2}3p^{1})$ tiene tres
              electrones, así que el que miramos tiene **dos** compañeros.
          - valor: '2.30'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho electrones del segundo
              nivel. Es la capa $n-1$ y su peso es $0{,}85$.
        pista: |
          Agrupa como $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{1})$. Dos compañeros,
          ocho en $n-1$, dos más adentro.
        desarrollo: |
          $$
          S = 2 \times 0{,}35 + 8 \times 0{,}85 + 2 \times 1{,}00 = 9{,}50
          $$

          $$
          Z_{\text{ef}} = 13 - 9{,}50 = 3{,}50
          $$

          Es el valor que publica la colección, junto con los del resto del
          periodo: Na 2,20 · Mg 2,85 · Al 3,50 · S 5,45 · Cl 6,10. Suben de
          $0{,}65$ en $0{,}65$ por cada protón añadido, que es exactamente
          $1 - 0{,}35$: cada electrón nuevo entra en el mismo grupo y solo
          tapa un tercio de lo que su protón añade.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'En el apartado a los cuatro son del grupo 7A, así que solo cambia n: la electronegatividad sube al bajar n.'
          - texto: 'El orden creciente es I < Br < Cl < F, del que tiene la capa de valencia en n = 5 al que la tiene en n = 2.'
          - texto: 'En el apartado b los cinco son del periodo 3, así que n no distingue y decide la carga efectiva.'
          - texto: 'Con Zef de 2,20 · 2,85 · 3,50 · 5,45 · 6,10, el orden creciente es Na < Mg < Al < S < Cl.'
          - texto: 'El flúor es el más electronegativo de los cuatro del apartado a porque es el que más protones tiene.'
            trampa: true
            mensaje: |
              El flúor tiene 9 protones y el yodo 53, o sea seis veces más, y
              aun así el flúor gana. Lo que lo hace tan electronegativo es que
              su capa de valencia está en $n = 2$, pegada al núcleo. Dentro de
              un grupo manda la distancia, no el número de protones.
    resolucion: |
      **a · Cuatro halógenos, o sea un grupo.** Comparten la estructura de
      valencia —$ns^{2}np^{5}$— y lo único que cambia es $n$. Cuanto mayor es
      $n$, más lejos del núcleo está la capa de valencia y menos tira el átomo
      de los electrones de un enlace:

      $$
      \mathrm{I}\ (5s^{2}5p^{5}) \;<\; \mathrm{Br}\ (4s^{2}4p^{5}) \;<\; \mathrm{Cl}\ (3s^{2}3p^{5}) \;<\; \mathrm{F}\ (2s^{2}2p^{5})
      $$

      **b · Cinco elementos del periodo 3.** Aquí $n$ vale 3 para todos, así
      que no distingue nada y hay que ir a la carga efectiva. Calculándolas
      por Slater:

      | | Na | Mg | Al | S | Cl |
      |---|---|---|---|---|---|
      | configuración | $3s^{1}$ | $3s^{2}$ | $3s^{2}3p^{1}$ | $3s^{2}3p^{4}$ | $3s^{2}3p^{5}$ |
      | $Z_{\text{ef}}$ | 2,20 | 2,85 | 3,50 | 5,45 | 6,10 |

      $$
      \mathrm{Na} < \mathrm{Mg} < \mathrm{Al} < \mathrm{S} < \mathrm{Cl}
      $$

      **El patrón que conviene ver en esa fila.** Cada paso suma $0{,}65$, y
      no es casualidad: al avanzar un puesto en el periodo se añade un protón
      —que suma 1 a $Z$— y un electrón que entra **en el mismo grupo** y solo
      aporta $0{,}35$ de pantalla. El balance es $1 - 0{,}35 = 0{,}65$ por
      escalón.

      Saber eso permite dos cosas. Una, comprobar una cuenta sin repetirla:
      si dos elementos vecinos del mismo periodo no te salen separados por
      0,65, hay un error. Y dos, entender por qué la electronegatividad sube
      tan deprisa de izquierda a derecha y tan despacio de arriba abajo: en un
      periodo el efecto se acumula limpio, en un grupo compiten un $n$ mayor
      con muchos más protones.

      **Y la comparación entre los dos apartados**, que es lo que el problema
      quiere: el flúor gana a todos con solo 9 protones, y el sodio pierde
      con 11. Más protones no significa más electronegativo. Lo que decide es
      cuántos de esos protones **llegan** al electrón de valencia.

  # ── Resuelto 11: detrás de colfq2-10 ─────────────────────────────────
  - id: colfq2-11-tres-segundas-ionizaciones
    titulo: Potasio, magnesio y galio, y a quién le cuesta más el segundo electrón
    fuente: >-
      Problema resuelto 11 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      resolución, con dos erratas: su tabla y su explicación hablan del
      calcio (₂₀Ca, 4s²) donde el enunciado dice magnesio, y dan 1978,8
      kJ mol⁻¹ para el galio donde el enunciado dice 1978,9. La asignación no
      cambia; el razonamiento con cargas efectivas es nuestro.
    nivel: practica
    enunciado: |
      La 1ª energía de ionización para el potasio, magnesio y galio es 418,8,
      737,7 y 578,8 kJ mol⁻¹, respectivamente. Los valores de 1450,6, 3051,3 y
      1978,9 kJ mol⁻¹ corresponden a valores de la 2ª energía de ionización de
      los elementos anteriores. Asignar a cada elemento su valor de 2ª energía
      de ionización.
    pide: Qué segunda energía de ionización corresponde al potasio, cuál al magnesio y cuál al galio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda ionización arranca un electrón al ion $\mathrm{X^{+}}$,
          no al átomo. ¿Qué electrón sale en cada caso?
        opciones:
          - texto: >-
              Del K⁺ uno $3p$, de una capa completa; del Mg⁺ el $3s$ que le
              queda; del Ga⁺ uno de sus dos $4s$
            correcta: true
            mensaje: |
              Eso es. El K⁺ tiene ya la configuración del argón, así que el
              segundo electrón sale de una capa llena y de un nivel más
              adentro. Por eso el potasio, el más fácil de ionizar la primera
              vez, es el que más cuesta la segunda.
          - texto: >-
              Del K otro $4s$, del Mg otro $3s$ y del Ga otro $4p$
            mensaje: |
              El potasio solo tenía un electrón $4s$ y el galio solo uno $4p$,
              y los dos se fueron en la primera ionización. Al K⁺ le queda un
              argón completo, y al Ga⁺, $3d^{10}4s^{2}$.
          - texto: >-
              Da igual cuál salga: la segunda cuesta más o menos lo mismo que
              la primera, un poco más
            mensaje: |
              Para el magnesio es casi el doble y para el potasio más de siete
              veces más. La segunda energía no se deduce de la primera: depende
              de qué electrón le toca salir, y ahí está el problema entero.

      - tipo: calcular
        titulo: Lo que siente el segundo electrón
        pregunta: |
          Por las reglas de Slater, ¿qué carga efectiva siente el electrón que
          sale en la segunda ionización del K⁺, del Mg⁺ y del Ga⁺, en ese
          orden?
        respuesta:
          tipo: vector
          valor: '(7.75, 3.20, 5.35)'
          tolerancia: 0.02
          formato: las tres cargas efectivas en el orden K⁺, Mg⁺, Ga⁺, con dos decimales, entre paréntesis y separadas por comas
        distractores:
          - valor: '(2.20, 2.85, 5.00)'
            mensaje: |
              Son las cargas efectivas del **primer** electrón, el del átomo
              neutro: $4s$ del K, $3s$ del Mg y $4p$ del Ga. La segunda
              ionización se lo hace al ion, que ya ha perdido uno, y el
              electrón que sale es otro.
          - valor: '(7.40, 2.85, 5.00)'
            mensaje: |
              Te has contado a ti mismo en el grupo de cada electrón. En el K⁺
              el $3p$ tiene siete compañeros, no ocho; en el Mg⁺ el $3s$ está
              solo; en el Ga⁺ el $4s$ tiene uno.
        pista: |
          K⁺ es $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})$; Mg⁺,
          $(1s^{2})(2s^{2}2p^{6})(3s^{1})$; Ga⁺,
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2})$.
        desarrollo: |
          $$
          \mathrm{K^{+}}\ (3p):\ S = 7 \times 0{,}35 + 8 \times 0{,}85 + 2 \times 1{,}00 = 11{,}25 \quad Z_{\text{ef}} = 19 - 11{,}25 = 7{,}75
          $$

          $$
          \mathrm{Mg^{+}}\ (3s):\ S = 8 \times 0{,}85 + 2 \times 1{,}00 = 8{,}80 \quad Z_{\text{ef}} = 12 - 8{,}80 = 3{,}20
          $$

          $$
          \mathrm{Ga^{+}}\ (4s):\ S = 1 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 25{,}65 \quad Z_{\text{ef}} = 31 - 25{,}65 = 5{,}35
          $$

          La colección no hace esta cuenta. Es la que explica su orden: el
          electrón del K⁺ está en $n = 3$ y siente 7,75; el del Ga⁺ está más
          lejos, en $n = 4$, pero siente 5,35; el del Mg⁺, en $n = 3$, solo
          3,20.

      - tipo: calcular
        titulo: El potasio
        pregunta: |
          ¿Cuál es la segunda energía de ionización del potasio?
        respuesta:
          tipo: numero
          valor: '3051.3'
          tolerancia: 0.15
          formato: la energía en kJ/mol, tal como la da el enunciado
        distractores:
          - valor: '1450.6'
            mensaje: |
              Has ordenado las segundas como las primeras: el potasio tiene la
              primera más baja, 418,8, y le has dado también la segunda más
              baja. Pero su segundo electrón sale de la capa completa del
              argón, con $Z_{\text{ef}} = 7{,}75$: es la más alta de las tres.
          - valor: '1978.9'
            mensaje: |
              Esa es la del galio. Al potasio le toca la mayor, porque su
              segundo electrón ya no es de valencia: sale de la capa 3, llena.
        pista: |
          Después de la primera ionización, el K⁺ tiene la configuración de un
          gas noble.
        desarrollo: |
          El K⁺ es $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}$, la del argón. Sacarle otro
          electrón es romper una capa completa: **3051,3 kJ mol⁻¹**, más de
          siete veces la primera. Coincide con la resolución de la colección.

      - tipo: calcular
        titulo: El magnesio
        pregunta: |
          ¿Cuál es la segunda energía de ionización del magnesio?
        respuesta:
          tipo: numero
          valor: '1450.6'
          tolerancia: 0.15
          formato: la energía en kJ/mol, tal como la da el enunciado
        distractores:
          - valor: '3051.3'
            mensaje: |
              Has ordenado las segundas como las primeras: el magnesio tiene la
              primera más alta de los tres, 737,7, y le has dado también la
              segunda más alta. Su segundo electrón es el $3s$ que le queda, de
              valencia todavía: es la más baja.
          - valor: '1978.9'
            mensaje: |
              Esa es la del galio, cuyo electrón $4s$ siente 5,35 de carga
              efectiva. El $3s$ del Mg⁺ siente solo 3,20, y le cuesta menos
              salir aunque esté un nivel más cerca del núcleo.
        pista: |
          Al Mg⁺ le queda un electrón $3s$, que sigue siendo de valencia.
        desarrollo: |
          El Mg⁺ es $1s^{2}2s^{2}2p^{6}3s^{1}$: el segundo electrón es todavía
          de la capa de valencia, y con la carga efectiva más baja de los
          tres, 3,20. Le corresponde **1450,6 kJ mol⁻¹**, menos del doble de
          la primera.

          La resolución de la colección pone en esta fila el calcio,
          «₂₀Ca: 1s²2s²2p⁶3s²3p⁶4s²», con 737,7 y 1450,6. Los números son los
          del magnesio del enunciado; el nombre y la configuración, no. Es una
          errata, y la asignación no cambia.

      - tipo: calcular
        titulo: El galio
        pregunta: |
          ¿Cuál es la segunda energía de ionización del galio?
        respuesta:
          tipo: numero
          valor: '1978.9'
          tolerancia: 0.15
          formato: la energía en kJ/mol, tal como la da el enunciado
        distractores:
          - valor: '3051.3'
            mensaje: |
              Has pensado que al galio, con 31 protones, el que más tiene, le
              toca la más alta. Los protones que cuentan son los que no tapan
              los electrones de dentro: su $4s$ siente 5,35, menos que el $3p$
              del K⁺.
          - valor: '1450.6'
            mensaje: |
              Has pensado que el electrón del Ga⁺ sale de un $4s$ lleno y que
              eso lo hace fácil. El emparejamiento cuenta poco al lado de la
              carga efectiva: 5,35 en el Ga⁺ frente a 3,20 en el Mg⁺.
        pista: |
          Queda en medio: su electrón está más sujeto que el del Mg⁺ y menos
          que el del K⁺.
        desarrollo: |
          El Ga⁺ es $[\mathrm{Ar}]\,3d^{10}4s^{2}$, y sale un $4s$ con
          $Z_{\text{ef}} = 5{,}35$: **1978,9 kJ mol⁻¹**. La tabla de la
          colección imprime 1978,8, una décima menos que su propio
          enunciado; la tolerancia acepta los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La segunda ionización arranca un electrón del ion X⁺: hay que
              mirar su configuración, no la del átomo.
          - texto: >-
              El K⁺ tiene la configuración del argón: su segundo electrón sale
              de una capa llena, con $Z_{\text{ef}} = 7{,}75$. Le toca 3051,3.
          - texto: >-
              Al Ga⁺ le sale un $4s$ con $Z_{\text{ef}} = 5{,}35$: 1978,9.
          - texto: >-
              Al Mg⁺ le queda un $3s$ de valencia con $Z_{\text{ef}} = 3{,}20$:
              la más baja, 1450,6.
          - texto: >-
              Como el magnesio tiene la primera energía más alta de los tres,
              también tiene la segunda más alta.
            trampa: true
            mensaje: |
              Las segundas no siguen el orden de las primeras. El potasio tiene
              la primera más baja y la segunda más alta, porque su segundo
              electrón ya no es de valencia. Es justo lo que el problema quiere
              que veas.
        veredicto: |
          El salto grande aparece cuando el electrón que sale rompe una capa
          completa, y eso le pasa al potasio en la segunda.

    resolucion: |
      **La asignación.**

      | elemento | 1ª EI (kJ mol⁻¹) | ion X⁺ | sale | $Z_{\text{ef}}$ | 2ª EI (kJ mol⁻¹) |
      |---|---|---|---|---|---|
      | K | 418,8 | $[\mathrm{Ar}]$ | un $3p$ | 7,75 | **3051,3** |
      | Mg | 737,7 | $[\mathrm{Ne}]\,3s^{1}$ | el $3s$ | 3,20 | **1450,6** |
      | Ga | 578,8 | $[\mathrm{Ar}]\,3d^{10}4s^{2}$ | un $4s$ | 5,35 | **1978,9** |

      Es la asignación de la colección.

      **Por qué.** La segunda ionización arranca un electrón del ion, así que
      lo que importa es qué le queda al ion. Al K⁺ le queda un gas noble: el
      segundo electrón sale de una capa llena, y cuesta más de siete veces la
      primera. Al Mg⁺ le queda su último electrón de valencia, que sale por
      menos del doble. El Ga⁺ queda en medio: su electrón $4s$ está en un
      nivel más alejado que el $3s$ del magnesio, pero siente bastante más
      carga, 5,35 frente a 3,20: el galio tiene 31 protones y los electrones
      de dentro solo le tapan 25,65.

      La colección lo explica diciendo que el electrón del galio sale de «un
      orbital totalmente ocupado (4s²)» y el otro de un orbital con un solo
      electrón. Es cierto que es así, pero lo que ordena las tres energías es
      la carga efectiva de la tabla, no el emparejamiento.

      **Las dos erratas de la resolución.** Su tabla y su explicación dicen
      calcio donde el enunciado dice magnesio —«₂₀Ca: 1s²2s²2p⁶3s²3p⁶4s²» y
      «un electrón que se encuentra sólo en un orbital (4s¹)»—, y da 1978,8
      para el galio donde el enunciado pone 1978,9. Los valores 737,7 y
      1450,6 son los del magnesio, que al perder su primer electrón queda en
      $3s^{1}$, no en $4s^{1}$. La asignación no cambia.

      **Lo que deja el problema.** La primera energía de ionización no
      predice la segunda. El potasio es el más fácil de ionizar una vez y el
      más difícil dos, y eso es lo que se usa al revés en los propuestos 29 y
      35: un salto grande en la serie dice cuántos electrones de valencia hay.

  # ── Los propuestos, detrás de todo, por su primer número ─────────────

  - id: colfq2-p1-9-protones-neutrones-y-el-simbolo
    titulo: Protones, neutrones y el símbolo de un isótopo, en nueve preguntas cortas
    fuente: >-
      Problemas propuestos 1 a 9 · Problemas resueltos y propuestos del tema
      2, Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no publica
      solución: la respuesta es nuestra. El 7 dice «cada una de los siguientes
      átomos».
    nivel: practica
    enunciado: |
      **1.** ¿Por qué todos los átomos de un elemento tienen el mismo número
      atómico, a pesar de que pueden tener diferentes números de masa?

      **2.** ¿Cómo se llaman los átomos del mismo elemento con diferente
      número másico?

      **3.** Explicar el significado de cada uno de los términos (Z, A y X) en
      el símbolo $^{A}_{Z}\mathrm{X}$.

      **4.** ¿Cuál será el número másico de un átomo de cromo que tiene 28
      neutrones?

      **5.** Calcular el número de neutrones del $^{195}_{78}\mathrm{Pt}$.

      **6.** Para cada una de las siguientes especies, determinar el número de
      protones y el número de neutrones en el núcleo: $^{3}_{2}\mathrm{He}$,
      $^{4}_{2}\mathrm{He}$, $^{24}_{12}\mathrm{Mg}$, $^{25}_{12}\mathrm{Mg}$,
      $^{48}_{22}\mathrm{Ti}$, $^{79}_{35}\mathrm{Br}$,
      $^{195}_{78}\mathrm{Pt}$.

      **7.** Indicar el número de protones, neutrones y electrones en cada una
      de los siguientes átomos: $^{15}_{7}\mathrm{N}$,
      $^{32}_{16}\mathrm{S}$, $^{63}_{29}\mathrm{Cu}$,
      $^{84}_{38}\mathrm{Sr}$, $^{130}_{56}\mathrm{Ba}$,
      $^{186}_{74}\mathrm{W}$, $^{202}_{80}\mathrm{Hg}$.

      **8.** Escribir el símbolo adecuado para cada uno de los siguientes
      isótopos: a) Z = 22, A = 48; b) Z = 48, A =112

      **9.** Escribir el símbolo adecuado para cada uno de los siguientes
      isótopos: a) Z = 25, A=55; b) Z= 38, A = 84

      *En el 7, «cada una de los siguientes átomos» es así en el original:
      debería decir «cada uno».*
    pide: Qué significan Z, A y X, cómo se llaman los isótopos, y los protones, neutrones y electrones de cada especie, con el símbolo de cuatro isótopos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problemas 1 y 3. En $^{A}_{Z}\mathrm{X}$, ¿qué cuenta cada número, y
          por qué Z es el mismo en todos los átomos de un elemento?
        opciones:
          - texto: >-
              Z cuenta los protones, y es lo que define el elemento; A cuenta
              protones más neutrones, y los neutrones pueden variar
            correcta: true
            mensaje: |
              Eso es. Un átomo con 24 protones es cromo, tenga los neutrones
              que tenga: cambiar Z es cambiar de elemento, y X, el símbolo, es
              solo el nombre abreviado de ese Z. Lo que varía entre átomos del
              mismo elemento es el número de neutrones, y con él A.
          - texto: >-
              Z cuenta los electrones, y por eso define las propiedades
              químicas del elemento
            mensaje: |
              Z cuenta protones. En un átomo neutro coincide con los electrones,
              pero un ion tiene los mismos protones y otros electrones, y sigue
              siendo el mismo elemento: el Na⁺ es sodio.
          - texto: >-
              A es la masa atómica del elemento en uma, y Z su posición en la
              tabla
            mensaje: |
              A es un número entero, el número de nucleones de **ese** isótopo.
              La masa atómica de la tabla es la media ponderada de las masas de
              todos los isótopos, y no es entera: el cromo tiene A = 50, 52, 53
              y 54, y su masa atómica es 51,9961 uma.

      - tipo: reconocer
        pregunta: |
          Problema 2. ¿Cómo se llaman los átomos del mismo elemento con
          distinto número másico?
        opciones:
          - texto: Isótopos
            correcta: true
            mensaje: |
              Eso es: mismo Z y distinto A, o sea mismos protones y distintos
              neutrones. «Iso-topo» es «mismo lugar»: ocupan la misma casilla
              de la tabla periódica.
          - texto: Isóbaros
            mensaje: |
              Isóbaros son los de **igual A y distinto Z**, como el ⁴⁰Ar y el
              ⁴⁰Ca: pesan casi lo mismo y son elementos distintos. Aquí es al
              revés.
          - texto: Alótropos
            mensaje: |
              Los alótropos son formas distintas de un mismo elemento en
              estado puro, como el grafito y el diamante, o el O₂ y el O₃. Se
              distinguen por cómo se enlazan los átomos, no por sus núcleos.
          - texto: Isoelectrónicos
            mensaje: |
              Isoelectrónicas son especies con el mismo número de
              **electrones**, como Na⁺ y Ne. Casi siempre son de elementos
              distintos; aquí se habla de núcleos del mismo elemento.

      - tipo: calcular
        titulo: El cromo con 28 neutrones
        pregunta: |
          Problema 4. ¿Cuál es el número másico de ese átomo de cromo?
        respuesta:
          tipo: numero
          valor: '52'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Has restado $28 - 24$. El número másico cuenta protones **y**
              neutrones: se suman, $A = Z + N$.
          - valor: '80'
            mensaje: |
              Has sumado los 28 neutrones a 52, la masa atómica del cromo. A
              los neutrones se les suman los **protones**, que son 24: el
              número atómico, no la masa.
        pista: |
          El cromo tiene $Z = 24$, y $A = Z + N$.
        desarrollo: |
          $$
          A = Z + N = 24 + 28 = 52
          $$

          Es el ⁵²Cr, el isótopo mayoritario del cromo natural: el 83,789 %,
          según el problema resuelto 4.

      - tipo: calcular
        titulo: Los neutrones del platino
        pregunta: |
          Problema 5. ¿Cuántos neutrones tiene el $^{195}_{78}\mathrm{Pt}$?
        respuesta:
          tipo: numero
          valor: '117'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '273'
            mensaje: |
              Has sumado los dos números. El de arriba, 195, ya incluye los
              protones: los neutrones son lo que queda al quitarlos,
              $195 - 78$.
          - valor: '78'
            mensaje: |
              78 es Z, el número de protones. Los neutrones son $A - Z$.
        pista: |
          $N = A - Z$: el de arriba menos el de abajo.
        desarrollo: |
          $$
          N = A - Z = 195 - 78 = 117
          $$

      - tipo: calcular
        titulo: Los neutrones de las siete especies del 6
        pregunta: |
          Problema 6. ¿Cuántos neutrones tiene cada especie, en el orden del
          enunciado?
        respuesta:
          tipo: vector
          valor: '(1, 2, 12, 13, 26, 44, 117)'
          tolerancia: 0.001
          formato: los siete números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(5, 6, 36, 37, 70, 114, 273)'
            mensaje: |
              Has sumado A y Z en cada una. A ya cuenta los protones: los
              neutrones son la diferencia, $A - Z$.
          - valor: '(3, 4, 24, 25, 48, 79, 195)'
            mensaje: |
              Has dado A, el número másico, que son protones más neutrones.
              Quita los protones: el ³He tiene dos protones y **un** neutrón.
        pista: |
          En cada símbolo, el número de arriba menos el de abajo.
        desarrollo: |
          | | ³₂He | ⁴₂He | ²⁴₁₂Mg | ²⁵₁₂Mg | ⁴⁸₂₂Ti | ⁷⁹₃₅Br | ¹⁹⁵₇₈Pt |
          |---|---|---|---|---|---|---|---|
          | protones, Z | 2 | 2 | 12 | 12 | 22 | 35 | 78 |
          | neutrones, A − Z | 1 | 2 | 12 | 13 | 26 | 44 | 117 |

          Las dos parejas de isótopos de la lista, ³He y ⁴He, ²⁴Mg y ²⁵Mg,
          tienen los mismos protones y se diferencian en un neutrón.

      - tipo: calcular
        titulo: Los neutrones de los siete átomos del 7
        pregunta: |
          Problema 7. ¿Cuántos neutrones tiene cada átomo, en el orden del
          enunciado?
        respuesta:
          tipo: vector
          valor: '(8, 16, 34, 46, 74, 112, 122)'
          tolerancia: 0.001
          formato: los siete números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(22, 48, 92, 122, 186, 260, 282)'
            mensaje: |
              Has sumado A y Z. Los neutrones son lo que queda de A al quitar
              los protones: $15 - 7 = 8$ para el nitrógeno.
          - valor: '(7, 16, 29, 38, 56, 74, 80)'
            mensaje: |
              Esos son los protones, Z, el número de abajo. Los neutrones son
              $A - Z$. En el azufre coinciden, 16 y 16, y por eso ese puesto te
              sale bien.
        pista: |
          Como en el 6: el de arriba menos el de abajo.
        desarrollo: |
          $$
          15 - 7 = 8,\quad 32 - 16 = 16,\quad 63 - 29 = 34,\quad 84 - 38 = 46,
          $$

          $$
          130 - 56 = 74,\quad 186 - 74 = 112,\quad 202 - 80 = 122
          $$

      - tipo: calcular
        titulo: Los electrones de los siete átomos del 7
        pregunta: |
          ¿Y cuántos electrones tiene cada uno?
        respuesta:
          tipo: vector
          valor: '(7, 16, 29, 38, 56, 74, 80)'
          tolerancia: 0.001
          formato: los siete números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(8, 16, 34, 46, 74, 112, 122)'
            mensaje: |
              Esos son los neutrones. Los electrones equilibran la carga de
              los **protones**: en un átomo neutro hay tantos electrones como
              protones, y los neutrones no tienen carga que equilibrar.
          - valor: '(15, 32, 63, 84, 130, 186, 202)'
            mensaje: |
              Has dado A. Un átomo neutro tiene tantos electrones como
              protones, Z, no tantos como nucleones.
        pista: |
          Son átomos, no iones: carga total cero.
        desarrollo: |
          Son átomos neutros, así que electrones = protones = Z: 7, 16, 29,
          38, 56, 74 y 80. Los electrones solo se separan de Z en un ion, y
          eso es lo que piden los propuestos 25 y 26.

      - tipo: reconocer
        pregunta: |
          Problemas 8 y 9. ¿Qué símbolos corresponden a Z = 22, A = 48; Z = 48,
          A = 112; Z = 25, A = 55, y Z = 38, A = 84?
        opciones:
          - texto: >-
              $^{48}_{22}\mathrm{Ti}$, $^{112}_{48}\mathrm{Cd}$,
              $^{55}_{25}\mathrm{Mn}$ y $^{84}_{38}\mathrm{Sr}$
            correcta: true
            mensaje: |
              Eso es. El elemento lo decide Z: 22 es el titanio, 48 el cadmio,
              25 el manganeso y 38 el estroncio. A va arriba a la izquierda y Z
              abajo.
          - texto: >-
              $^{48}_{22}\mathrm{Cd}$, $^{112}_{48}\mathrm{Cn}$,
              $^{55}_{25}\mathrm{Cs}$ y $^{84}_{38}\mathrm{Po}$
            mensaje: |
              Has buscado el elemento por A: 48 es el cadmio, 112 el
              copernicio, 55 el cesio y 84 el polonio. Pero el elemento lo da
              el número de protones, Z. Con A se sabe cuántos nucleones tiene,
              no qué es.
          - texto: >-
              $^{22}_{48}\mathrm{Ti}$, $^{48}_{112}\mathrm{Cd}$,
              $^{25}_{55}\mathrm{Mn}$ y $^{38}_{84}\mathrm{Sr}$
            mensaje: |
              Los elementos están bien y los números cambiados de sitio: A,
              el másico, va **arriba** y Z abajo. Así escrito, el titanio
              tendría 48 protones y menos nucleones que protones, que es
              imposible.
          - texto: >-
              $^{48}_{22}\mathrm{Ti}$, $^{112}_{48}\mathrm{Cd}$,
              $^{55}_{25}\mathrm{Mn}$ y $^{84}_{38}\mathrm{Kr}$
            mensaje: |
              El ⁸⁴Kr existe y es el isótopo más abundante del kriptón, pero el
              kriptón tiene Z = 36. Con Z = 38 es el estroncio, y el ⁸⁴Sr es
              uno de sus isótopos escasos. Mismo A, distinto Z: son isóbaros,
              no el mismo átomo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Z cuenta los protones y decide qué elemento es; A cuenta protones
              más neutrones.
          - texto: >-
              Los átomos de un mismo elemento con distinto A son isótopos: se
              diferencian solo en los neutrones.
          - texto: >-
              Los neutrones se sacan restando, $N = A - Z$, y en un átomo
              neutro los electrones son tantos como los protones.
          - texto: >-
              Para escribir el símbolo se busca el elemento por Z y se ponen A
              arriba y Z abajo.
          - texto: >-
              Como el ⁸⁴Kr es el isótopo de A = 84 más conocido, el isótopo con
              Z = 38 y A = 84 es kriptón.
            trampa: true
            mensaje: |
              A no identifica al elemento. Un núcleo con 38 protones es
              estroncio, tenga 46 neutrones o 50. El ⁸⁴Kr y el ⁸⁴Sr tienen el
              mismo número de nucleones y son dos elementos distintos.
        veredicto: |
          Z es el nombre del elemento; A, el de un isótopo concreto. Todo lo
          demás son sumas y restas entre los dos.

    resolucion: |
      **1 y 3 · Lo que dice el símbolo.** En $^{A}_{Z}\mathrm{X}$, **Z** es el
      número atómico, el número de protones; **A** es el número másico,
      protones más neutrones; y **X** es el símbolo del elemento. Z es el que
      define el elemento: todos los átomos de cromo tienen 24 protones, porque
      un átomo con 25 ya es manganeso. Lo que puede cambiar de un átomo a
      otro del mismo elemento es el número de neutrones, y con él A.

      **2 · Isótopos.** Átomos del mismo elemento —mismo Z— con distinto A.

      **4 y 5.**

      $$
      A(\mathrm{Cr}) = 24 + 28 = 52 \qquad N(^{195}\mathrm{Pt}) = 195 - 78 = 117
      $$

      **6 y 7.** Los protones son Z, los neutrones $A - Z$ y, en un átomo
      neutro, los electrones son tantos como los protones.

      | especie | p⁺ | n | e⁻ |
      |---|---|---|---|
      | ³₂He | 2 | 1 | |
      | ⁴₂He | 2 | 2 | |
      | ²⁴₁₂Mg | 12 | 12 | |
      | ²⁵₁₂Mg | 12 | 13 | |
      | ⁴⁸₂₂Ti | 22 | 26 | |
      | ⁷⁹₃₅Br | 35 | 44 | |
      | ¹⁹⁵₇₈Pt | 78 | 117 | |
      | ¹⁵₇N | 7 | 8 | 7 |
      | ³²₁₆S | 16 | 16 | 16 |
      | ⁶³₂₉Cu | 29 | 34 | 29 |
      | ⁸⁴₃₈Sr | 38 | 46 | 38 |
      | ¹³⁰₅₆Ba | 56 | 74 | 56 |
      | ¹⁸⁶₇₄W | 74 | 112 | 74 |
      | ²⁰²₈₀Hg | 80 | 122 | 80 |

      El 6 pregunta solo por el núcleo, y por eso no lleva electrones.

      **8 y 9 · Los símbolos.** El elemento se busca por Z:

      $$
      ^{48}_{22}\mathrm{Ti} \qquad ^{112}_{48}\mathrm{Cd} \qquad ^{55}_{25}\mathrm{Mn} \qquad ^{84}_{38}\mathrm{Sr}
      $$

      **Dónde se tuerce.** Casi todos los errores de este bloque son uno: usar
      A donde va Z. Buscar el elemento por A, sumar A y Z para sacar los
      neutrones, o sumar los neutrones a la masa atómica en vez de al número
      atómico. A cuenta nucleones de un isótopo concreto; Z dice qué elemento
      es.

  - id: colfq2-p13-14-el-germanio-y-el-hidrogeno
    titulo: El fotón que sobra en el germanio, y el hidrógeno con la constante de Rydberg
    fuente: >-
      Problemas propuestos 13 y 14 · Problemas resueltos y propuestos del tema
      2, Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro. Los enunciados no dan h, c
      ni N_A: se usan h = 6,626·10⁻³⁴ J s, c = 3,00·10⁸ m s⁻¹ y
      N_A = 6,022·10²³ mol⁻¹.
    nivel: practica
    enunciado: |
      **13.** La longitud de onda umbral para el germanio es de 268 nm.
      Calcular la energía necesaria para anular la emisión del electrón
      cuando el germanio es iluminado con luz de 250 nm.

      **14.** El valor experimental de la constante de Rydberg para el átomo
      de hidrógeno es de 1,0967758 x 10⁷ m⁻¹. Calcular: a) Energía de
      ionización, expresada en J mol⁻¹, para el átomo de hidrógeno. b)
      Longitud de onda, expresada en nm, de la 1ª línea de la serie de Lyman
      del espectro del átomo de hidrógeno.
    pide: La energía cinética del electrón arrancado al germanio, y la energía de ionización y la primera línea de Lyman del hidrógeno.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 13. ¿Qué es «la energía necesaria para anular la emisión
          del electrón»?
        opciones:
          - texto: >-
              La energía cinética con la que sale el electrón: el fotón de
              250 nm trae $hc/\lambda$, arrancarlo cuesta $hc/\lambda_0$, y lo
              que sobra es lo que hay que quitarle para pararlo
            correcta: true
            mensaje: |
              Eso es. Es la ecuación de Einstein del efecto fotoeléctrico,
              $E_c = h\nu - h\nu_0$, con las frecuencias escritas como
              $c/\lambda$. Para anular la emisión hay que frenar al electrón
              con exactamente esa energía.
          - texto: La energía del fotón de 250 nm, que es la que arranca el electrón
            mensaje: |
              El fotón trae $hc/\lambda$, pero casi toda se gasta en arrancar
              el electrón del metal. Lo que hay que anular es lo que le sobra
              al salir, que es mucho menos: unas quince veces menos.
          - texto: El trabajo de extracción, la energía de un fotón de 268 nm
            mensaje: |
              Esa es la energía mínima para arrancar un electrón: la que
              corresponde a la longitud de onda umbral. Pero el electrón ya ha
              salido; lo que se pregunta es con cuánta energía sobrante lo ha
              hecho.
          - texto: La de un fotón de $268 - 250 = 18$ nm
            mensaje: |
              Las energías se restan; las longitudes de onda, no. La energía es
              $hc/\lambda$, inversamente proporcional a $\lambda$, así que
              restar longitudes da un fotón de 18 nm, del ultravioleta
              extremo, que no tiene nada que ver con el problema.

      - tipo: calcular
        titulo: La energía del electrón del germanio
        pregunta: |
          Problema 13. ¿Cuánta energía hay que quitarle al electrón para
          anular la emisión?
        respuesta:
          tipo: numero
          valor: '5.34e-20'
          tolerancia: 5e-22
          formato: la energía en julios, en notación científica, como 3,5e-19
        distractores:
          - valor: '7.95e-19'
            mensaje: |
              Es la energía del fotón de 250 nm, $hc/\lambda$. Te falta restar
              lo que cuesta arrancar el electrón, $hc/\lambda_0$ con los 268
              nm del umbral.
          - valor: '7.42e-19'
            mensaje: |
              Es el trabajo de extracción, la energía de un fotón de 268 nm. Es
              lo que se gasta en arrancar el electrón; lo que se pregunta es lo
              que le sobra después.
          - valor: '1.10e-17'
            mensaje: |
              Has restado las longitudes de onda, $268 - 250 = 18$ nm, y has
              calculado la energía de ese fotón. Las longitudes no se restan:
              se calcula la energía de cada fotón y se restan las energías.
        pista: |
          $E_c = hc\left(\dfrac{1}{\lambda} - \dfrac{1}{\lambda_0}\right)$, con
          las longitudes en metros. Si calculas las dos energías por separado,
          guarda tres o cuatro cifras antes de restarlas: se parecen tanto que
          la resta se come las primeras, y $7{,}95 - 7{,}42$ solo deja dos.
        desarrollo: |
          $$
          E_{\text{fotón}} = \frac{hc}{\lambda} = \frac{6{,}626\cdot10^{-34}\cdot 3{,}00\cdot10^{8}}{250\cdot10^{-9}} = 7{,}951\cdot10^{-19}\ \text{J}
          $$

          $$
          W_0 = \frac{hc}{\lambda_0} = \frac{6{,}626\cdot10^{-34}\cdot 3{,}00\cdot10^{8}}{268\cdot10^{-9}} = 7{,}417\cdot10^{-19}\ \text{J}
          $$

          $$
          E_c = 7{,}951\cdot10^{-19} - 7{,}417\cdot10^{-19} = 5{,}34\cdot10^{-20}\ \text{J}
          $$

          Es la respuesta de la colección. Con $c = 2{,}998\cdot10^{8}$ sale
          $5{,}337\cdot10^{-20}$, que es el mismo número.

      - tipo: reconocer
        pregunta: |
          Problema 14. ¿A qué salto del electrón corresponde cada apartado?
        opciones:
          - texto: >-
              La ionización es llevar el electrón de $n = 1$ a $n = \infty$; la
              primera línea de Lyman es el salto entre $n = 2$ y $n = 1$
            correcta: true
            mensaje: |
              Eso es. La serie de Lyman es la de los saltos que acaban en
              $n = 1$, y su primera línea es la de menor energía, la que viene
              de $n = 2$. Ionizar es el salto más grande que acaba en $n = 1$:
              el límite de la serie.
          - texto: >-
              La ionización es el salto de $n = 1$ a $n = 2$; la primera línea
              de Lyman, el de $n = \infty$ a $n = 1$
            mensaje: |
              Están cambiadas. Pasar a $n = 2$ es excitar el átomo, no
              ionizarlo: el electrón sigue ligado. Ionizar es sacarlo del todo,
              hasta $n = \infty$, y esa es la última línea de la serie, no la
              primera.
          - texto: >-
              La serie de Lyman es la de los saltos que acaban en $n = 2$, y su
              primera línea viene de $n = 3$
            mensaje: |
              Esa es la serie de Balmer, la visible: su primera línea es la
              roja de 656 nm. La de Lyman acaba en $n = 1$ y cae en el
              ultravioleta.

      - tipo: calcular
        titulo: La energía de ionización del hidrógeno
        pregunta: |
          Problema 14 a). ¿Cuánto vale la energía de ionización del hidrógeno,
          en J mol⁻¹?
        respuesta:
          tipo: numero
          valor: '1.3129e6'
          tolerancia: 5000
          formato: la energía en J/mol, en notación científica, como 1,2e6
        distractores:
          - valor: '2.180e-18'
            mensaje: |
              Si te ha salido $2{,}18\cdot10^{-18}$, es la energía de
              ionización de **un** átomo, $hcR_H$: el enunciado la pide por
              mol, y falta multiplicar por el número de Avogadro. Si te ha
              salido 1313, la has dado en kJ mol⁻¹, y se pide en J mol⁻¹:
              son $1{,}313\cdot10^{6}$.
          - valor: '9.847e5'
            mensaje: |
              Has calculado la energía de la primera línea de Lyman,
              $hcR_H(1 - 1/4)$, por mol. Ionizar es llevar el electrón hasta
              $n = \infty$: el paréntesis vale $1 - 0 = 1$.
        pista: |
          $EI = h\,c\,R_H \left(\dfrac{1}{1^{2}} - \dfrac{1}{\infty^{2}}\right) N_A$.
        desarrollo: |
          $$
          EI = h\,c\,R_H\,N_A = 6{,}626\cdot10^{-34}\cdot 3{,}00\cdot10^{8}\cdot 1{,}0967758\cdot10^{7}\cdot 6{,}022\cdot10^{23}
          $$

          $$
          EI = 2{,}180\cdot10^{-18}\ \text{J/átomo}\times 6{,}022\cdot10^{23} = 1{,}313\cdot10^{6}\ \text{J mol}^{-1}
          $$

          La colección da $1{,}31\cdot10^{6}$ J mol⁻¹. Con
          $c = 2{,}998\cdot10^{8}$ sale $1{,}312\cdot10^{6}$: la tolerancia
          acepta todas.

      - tipo: calcular
        titulo: La primera línea de Lyman
        pregunta: |
          Problema 14 b). ¿Qué longitud de onda tiene, en nm?
        respuesta:
          tipo: numero
          valor: '121.57'
          tolerancia: 0.1
          formato: la longitud de onda en nm, con una cifra decimal
        distractores:
          - valor: '91.18'
            mensaje: |
              Es el límite de la serie, $1/R_H$: el salto desde $n = \infty$,
              que es la ionización del apartado a). La primera línea es la de
              menor energía, la que viene de $n = 2$, y tiene la longitud de
              onda más larga de la serie.
          - valor: '656.5'
            mensaje: |
              Es la primera línea de **Balmer**, $3 \rightarrow 2$, la roja. La
              de Lyman acaba en $n = 1$: $1/\lambda = R_H(1 - 1/4)$.
          - valor: '182.35'
            mensaje: |
              Has puesto $1/n$ en lugar de $1/n^{2}$: $R_H(1 - 1/2)$. En la
              fórmula de Rydberg los niveles van al cuadrado,
              $R_H(1/1^{2} - 1/2^{2}) = \tfrac{3}{4}R_H$.
        pista: |
          $\dfrac{1}{\lambda} = R_H\left(\dfrac{1}{1^{2}} - \dfrac{1}{2^{2}}\right) = \dfrac{3}{4}R_H$.
        desarrollo: |
          $$
          \frac{1}{\lambda} = 1{,}0967758\cdot10^{7}\cdot\frac{3}{4} = 8{,}2258\cdot10^{6}\ \text{m}^{-1}
          \quad\Longrightarrow\quad
          \lambda = 1{,}2157\cdot10^{-7}\ \text{m} = 121{,}57\ \text{nm}
          $$

          La colección da 121,5 nm, y redondeando este número saldría 121,6.
          No se sabe de dónde viene la diferencia: puede haber cortado la
          cifra en vez de redondearla, o haber usado la constante de Rydberg
          de un núcleo infinitamente pesado,
          $R_\infty = 1{,}0973731\cdot10^{7}$ m⁻¹, con la que sale 121,50.
          La tolerancia acepta los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En el germanio, el fotón de 250 nm trae $7{,}95\cdot10^{-19}$ J y
              arrancar el electrón cuesta $7{,}42\cdot10^{-19}$ J, lo del
              umbral de 268 nm.
          - texto: >-
              Lo que sobra, $5{,}34\cdot10^{-20}$ J, es la energía cinética del
              electrón, y es lo que hay que quitarle para anular la emisión.
          - texto: >-
              En el hidrógeno, ionizar es el salto de $n = 1$ a $n = \infty$:
              $hcR_H$ por átomo, $1{,}31\cdot10^{6}$ J mol⁻¹ por mol.
          - texto: >-
              La primera línea de Lyman es el salto $2 \rightarrow 1$:
              $1/\lambda = \tfrac{3}{4}R_H$, o sea 121,6 nm.
          - texto: >-
              La energía cinética del electrón del germanio es la de un fotón
              de 18 nm, la diferencia entre las dos longitudes de onda.
            trampa: true
            mensaje: |
              Se restan energías, no longitudes de onda. Como la energía es
              $hc/\lambda$, una diferencia pequeña de longitudes da una
              diferencia pequeña de energías, y un fotón de 18 nm tendría
              doscientas veces más.
        veredicto: |
          Las energías se suman y se restan; las longitudes de onda, no. Por
          eso todo se pasa a energía, o a $1/\lambda$, antes de operar.

    resolucion: |
      **13 · El germanio.** El fotón de 250 nm trae más energía que la mínima
      para arrancar un electrón, que es la del umbral de 268 nm. Lo que sobra
      se lo lleva el electrón como energía cinética, y es lo que hay que
      quitarle para anular la emisión:

      $$
      E_c = hc\left(\frac{1}{\lambda} - \frac{1}{\lambda_0}\right)
      = 6{,}626\cdot10^{-34}\cdot3{,}00\cdot10^{8}\left(\frac{1}{250\cdot10^{-9}} - \frac{1}{268\cdot10^{-9}}\right)
      = \boxed{5{,}34\cdot10^{-20}\ \text{J}}
      $$

      **14 · El hidrógeno.** La fórmula de Rydberg da la inversa de la
      longitud de onda de cada salto, y multiplicada por $hc$, su energía:

      $$
      \frac{1}{\lambda} = R_H\left(\frac{1}{n_1^{2}} - \frac{1}{n_2^{2}}\right)
      $$

      - a) Ionizar es $n_1 = 1$, $n_2 = \infty$:
        $EI = hcR_H N_A = \boxed{1{,}31\cdot10^{6}\ \text{J mol}^{-1}}$.
      - b) La primera línea de Lyman es $n_1 = 1$, $n_2 = 2$:
        $\lambda = \dfrac{4}{3R_H} = \boxed{121{,}6\ \text{nm}}$.

      Las dos coinciden con la colección, que da 1,31·10⁶ J mol⁻¹ y 121,5 nm.
      La décima del segundo no es un fallo tuyo: 121,5 sale cortando la cifra
      en vez de redondearla, y también con $R_\infty = 1{,}0973731\cdot10^{7}$
      m⁻¹ en lugar del $R_H$ del enunciado.

      **Una comprobación que no cuesta nada.** 121,6 nm está en el
      ultravioleta, y es más larga que el límite de la serie, 91,2 nm: la
      primera línea de una serie es siempre la de menor energía, o sea la de
      mayor longitud de onda.

  - id: colfq2-p15-17-ocho-conjuntos-y-el-oxigeno
    titulo: Ocho conjuntos de números cuánticos, un orbital 3p y los ocho electrones del oxígeno
    fuente: >-
      Problemas propuestos 15, 16 y 17 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra.
    nivel: practica
    enunciado: |
      **15.** ¿Cuáles de los siguientes números cuánticos definen
      correctamente a un electrón? Decir de qué electrón se trata en caso de
      que sea correcto.

      (4,3,-1,1/2), (3,4,-2,1/2), (3,0,-1,1/2), (5,1,-2,1/2), (3,-1,0,1/2),
      (4,1,-1,-1/2), (1,2,-1,1/2), (2,1,-2,1/2)

      **16.** Si un electrón se define con los números cuánticos (3,1,0,1/2)
      ¿en qué nivel, subnivel y orbital se encuentra?¿Cuáles serían los
      números cuánticos para otro electrón que se encuentra en el mismo
      orbital? ¿Qué números cuánticos posibles tendría un electrón del mismo
      nivel y subnivel?

      **17.** Escribir los números cuánticos de todos los electrones del
      átomo de oxígeno (Z=8).
    pide: Qué conjuntos son posibles y qué electrón es cada uno, dónde está el electrón (3,1,0,1/2) y quién puede acompañarlo, y los números cuánticos de los ocho electrones del oxígeno.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 15. El conjunto $(3,-1,0,1/2)$ tiene un $m_\ell = 0$ que
          vale para cualquier $\ell$. ¿Por qué no define a un electrón?
        opciones:
          - texto: >-
              Porque $\ell$ no puede ser negativo: va de $0$ a $n-1$, y los
              valores negativos son cosa de $m_\ell$
            correcta: true
            mensaje: |
              Eso es. $\ell$ da la forma del orbital y empieza en $0$, que es
              el $s$. Los negativos aparecen un número más abajo, en $m_\ell$,
              que va de $-\ell$ a $+\ell$. La cascada se para en el segundo
              número y no hace falta mirar más.
          - texto: >-
              Sí lo define: $\ell$ puede ir de $-(n-1)$ a $n-1$, igual que
              $m_\ell$ va de $-\ell$ a $\ell$
            mensaje: |
              Es trasladar a $\ell$ la regla de $m_\ell$. $\ell$ solo toma
              valores de $0$ a $n-1$; si pudiera ser negativo, habría orbitales
              con forma «menos p», y no existen.
          - texto: >-
              Porque con $m_s = 1/2$ el valor de $\ell$ tiene que ser positivo
            mensaje: |
              $m_s$ no depende de $\ell$ ni de nada: vale $+1/2$ o $-1/2$ en
              cualquier orbital. El conjunto cae antes, en el propio $\ell$.

      - tipo: reconocer
        pregunta: |
          Problema 15. Pasados los ocho conjuntos por la cascada, ¿cuáles
          definen correctamente a un electrón?
        opciones:
          - texto: Solo dos, $(4,3,-1,1/2)$ y $(4,1,-1,-1/2)$
            correcta: true
            mensaje: |
              Eso es: dos posibles y seis imposibles. Caen en $\ell$ contra $n$
              $(3,4,-2,1/2)$, $(3,-1,0,1/2)$ y $(1,2,-1,1/2)$, y en $m_\ell$
              contra $\ell$ $(3,0,-1,1/2)$, $(5,1,-2,1/2)$ y $(2,1,-2,1/2)$. El
              $m_s = -1/2$ del sexto es tan válido como $+1/2$.
          - texto: >-
              Cuatro, $(4,3,-1,1/2)$, $(3,0,-1,1/2)$, $(5,1,-2,1/2)$ y
              $(4,1,-1,-1/2)$
            mensaje: |
              Has dado por buenos $(3,0,-1,1/2)$ y $(5,1,-2,1/2)$: has
              comparado $m_\ell$ con $n$ y no con $\ell$. Con $\ell = 0$ el
              único $m_\ell$ es $0$, y con $\ell = 1$ solo hay $-1$, $0$ y $1$.
          - texto: >-
              Cuatro, $(4,3,-1,1/2)$, $(3,4,-2,1/2)$, $(4,1,-1,-1/2)$ y
              $(1,2,-1,1/2)$
            mensaje: |
              Has dado por buenos $(3,4,-2,1/2)$ y $(1,2,-1,1/2)$: te has
              saltado la primera cota. $\ell$ llega como mucho a $n-1$: en el
              nivel 3 no hay orbitales con $\ell = 4$, y en el nivel 1 solo
              existe el $1s$.
          - texto: Tres, $(4,3,-1,1/2)$, $(3,-1,0,1/2)$ y $(4,1,-1,-1/2)$
            mensaje: |
              Has dado por bueno $(3,-1,0,1/2)$. $\ell$ no puede ser negativo:
              va de $0$ a $n-1$.
          - texto: Dos, $(4,3,-1,1/2)$ y $(3,0,-1,1/2)$
            mensaje: |
              Son dos errores a la vez. $(3,0,-1,1/2)$ es imposible: con
              $\ell = 0$ el único $m_\ell$ es $0$, porque un orbital $s$ tiene
              una sola orientación. Y $(4,1,-1,-1/2)$, que has descartado, es
              posible: $m_s$ vale $+1/2$ o $-1/2$, y los dos son igual de
              válidos. Es un $4p$ con el espín hacia abajo.

      - tipo: reconocer
        pregunta: |
          ¿De qué electrón se trata en los dos posibles, $(4,3,-1,1/2)$ y
          $(4,1,-1,-1/2)$?
        opciones:
          - texto: Un 4f y un 4p
            correcta: true
            mensaje: |
              Eso es: $n$ da el número y $\ell$ la letra, $1 \to p$ y
              $3 \to f$. El signo de $m_s$ no cambia el orbital: el segundo es
              un electrón $4p$ con el espín hacia abajo.
          - texto: Un 4d y un 4s
            mensaje: |
              Has empezado a contar las letras en $\ell = 1$. La $s$ es
              $\ell = 0$, así que $\ell = 1$ es $p$ y $\ell = 3$ es $f$.
          - texto: Solo el primero, un 4f; el segundo tiene el espín negativo y no vale
            mensaje: |
              $m_s = -1/2$ es tan válido como $+1/2$: son los dos giros
              posibles. En cada orbital caben dos electrones precisamente
              porque hay dos valores de $m_s$.

      - tipo: calcular
        titulo: El compañero de orbital
        pregunta: |
          Problema 16. El electrón $(3,1,0,1/2)$ está en el nivel 3, en el
          subnivel $3p$ y en el orbital $3p$ de $m_\ell = 0$. ¿Qué números
          cuánticos tiene el otro electrón que cabe en ese mismo orbital?
        respuesta:
          tipo: vector
          valor: '(3, 1, 0, -1/2)'
          tolerancia: 0.001
          formato: los cuatro números (n, l, ml, ms) entre paréntesis y separados por comas
        distractores:
          - valor: '(3, 1, 0, 1/2)'
            mensaje: |
              Ese es el mismo electrón. Dos electrones de un átomo no pueden
              tener los cuatro números iguales —es el principio de exclusión
              de Pauli—, así que en un mismo orbital el segundo solo puede
              diferir en el espín.
          - valor: '(3, 1, 1, 1/2)'
            mensaje: |
              Con $m_\ell = 1$ el electrón está en **otro** orbital del mismo
              subnivel $3p$. Para estar en el mismo orbital hay que repetir
              $n$, $\ell$ y $m_\ell$, y lo único que queda por cambiar es $m_s$.
        pista: |
          Mismo orbital es mismo $n$, $\ell$ y $m_\ell$.
        desarrollo: |
          Un orbital queda fijado por $(n, \ell, m_\ell) = (3, 1, 0)$. El
          segundo electrón que cabe en él tiene el espín contrario:

          $$
          (3,\ 1,\ 0,\ -1/2)
          $$

      - tipo: calcular
        titulo: Los conjuntos del subnivel 3p
        pregunta: |
          ¿Cuántos conjuntos distintos de números cuánticos admite el subnivel
          $3p$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Tres son los orbitales $3p$, los tres valores de $m_\ell$. Cada
              uno admite dos valores de $m_s$, así que los conjuntos son el
              doble.
          - valor: '18'
            mensaje: |
              Dieciocho son los del nivel 3 entero, con el $3s$ y el $3d$. El
              enunciado pide los del mismo nivel **y** subnivel: $n = 3$ y
              $\ell = 1$ fijos.
        pista: |
          Con $n = 3$ y $\ell = 1$ fijos, $m_\ell$ puede ser $-1$, $0$ o $1$, y
          $m_s$, $\pm 1/2$.
        desarrollo: |
          $$
          (3, 1, -1, \pm\tfrac12) \qquad (3, 1, 0, \pm\tfrac12) \qquad (3, 1, 1, \pm\tfrac12)
          $$

          Seis conjuntos: los seis electrones que caben en el $3p$. Uno es el
          del enunciado, y los otros cinco son los que puede tener un
          electrón distinto de él en el mismo nivel y subnivel.

      - tipo: reconocer
        pregunta: |
          Problema 17. El oxígeno es $1s^{2}2s^{2}2p^{4}$. Ocupando los
          orbitales de $m_\ell = -1$ a $+1$ y primero con $+1/2$, ¿qué números
          cuánticos tienen sus cuatro electrones $2p$?
        opciones:
          - texto: >-
              $(2,1,-1,+\tfrac12)$, $(2,1,0,+\tfrac12)$, $(2,1,1,+\tfrac12)$ y
              $(2,1,-1,-\tfrac12)$
            correcta: true
            mensaje: |
              Eso es. Primero un electrón en cada orbital con el mismo espín
              —la regla de Hund— y el cuarto se empareja en el primero. Quedan
              dos electrones desapareados.
          - texto: >-
              $(2,1,-1,+\tfrac12)$, $(2,1,-1,-\tfrac12)$, $(2,1,0,+\tfrac12)$ y
              $(2,1,0,-\tfrac12)$
            mensaje: |
              Has llenado por parejas, orbital a orbital. Con orbitales de la
              misma energía, los electrones se reparten antes de emparejarse:
              es la regla de Hund. Así el $2p$ del oxígeno se queda sin
              ningún electrón desapareado, y tiene dos.
          - texto: >-
              $(2,1,-1,+\tfrac12)$, $(2,1,0,+\tfrac12)$, $(2,1,1,+\tfrac12)$ y
              $(2,1,2,+\tfrac12)$
            mensaje: |
              Has abierto un cuarto orbital para el cuarto electrón. Con
              $\ell = 1$, $m_\ell$ solo llega a $1$: el $2p$ tiene tres
              orbitales, y el cuarto electrón tiene que emparejarse.
          - texto: >-
              $(2,1,-1,+\tfrac12)$, $(2,1,0,+\tfrac12)$, $(2,1,1,+\tfrac12)$ y
              $(2,1,-1,+\tfrac12)$
            mensaje: |
              El cuarto repite los cuatro números del primero, y el principio
              de exclusión de Pauli no lo permite. Al emparejarse en el orbital
              $m_\ell = -1$ tiene que llevar el espín contrario, $-1/2$.

      - tipo: calcular
        titulo: Los desapareados del oxígeno
        pregunta: |
          ¿Cuántos electrones desapareados tiene el oxígeno?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Has emparejado los cuatro electrones $2p$ de dos en dos. Por la
              regla de Hund se ocupan primero los tres orbitales con un
              electrón cada uno, y solo el cuarto se empareja: quedan dos
              solos.
          - valor: '4'
            mensaje: |
              Has dejado solos los cuatro electrones $2p$, pero el subnivel
              $p$ tiene solo tres orbitales. El cuarto tiene que emparejarse.
        pista: |
          Cuatro electrones en tres orbitales, primero uno en cada uno.
        desarrollo: |
          Los $1s^{2}$ y $2s^{2}$ están emparejados. En el $2p^{4}$ tres
          electrones van cada uno a su orbital y el cuarto se empareja: quedan
          **2** desapareados, los de $m_\ell = 0$ y $m_\ell = 1$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un conjunto es posible si $0 \le \ell \le n-1$ y
              $-\ell \le m_\ell \le \ell$: de los ocho del 15 solo pasan un 4f y
              un 4p.
          - texto: >-
              $n$, $\ell$ y $m_\ell$ fijan el orbital, así que el compañero de
              $(3,1,0,1/2)$ es $(3,1,0,-1/2)$.
          - texto: >-
              El subnivel $3p$ admite seis conjuntos: tres valores de $m_\ell$
              por dos de $m_s$.
          - texto: >-
              En el oxígeno los cuatro $2p$ ocupan primero los tres orbitales
              con el mismo espín, y el cuarto se empareja: dos desapareados.
          - texto: >-
              $(4,1,-1,-1/2)$ no define a un electrón, porque $m_s$ no puede
              ser negativo.
            trampa: true
            mensaje: |
              $m_s$ vale $+1/2$ o $-1/2$, y los dos son igual de válidos: son los
              dos giros del electrón. Es un $4p$ con el espín hacia abajo.
        veredicto: |
          Cuatro números en cascada: $n$ fija el nivel, $\ell$ el subnivel,
          $m_\ell$ el orbital y $m_s$ decide quién es quién dentro de él.

    resolucion: |
      **15 · Los ocho conjuntos, en cascada.** Primero $\ell$ contra $n$,
      después $m_\ell$ contra $\ell$:

      | conjunto | qué pasa | electrón |
      |---|---|---|
      | (4, 3, −1, 1/2) | pasa las dos cotas | 4f |
      | (3, 4, −2, 1/2) | con $n = 3$, $\ell$ llega a 2 | imposible |
      | (3, 0, −1, 1/2) | con $\ell = 0$, $m_\ell$ solo es 0 | imposible |
      | (5, 1, −2, 1/2) | con $\ell = 1$, $m_\ell$ va de −1 a 1 | imposible |
      | (3, −1, 0, 1/2) | $\ell$ no puede ser negativo | imposible |
      | (4, 1, −1, −1/2) | pasa las dos cotas | 4p |
      | (1, 2, −1, 1/2) | con $n = 1$, $\ell$ solo es 0 | imposible |
      | (2, 1, −2, 1/2) | con $\ell = 1$, $m_\ell$ va de −1 a 1 | imposible |

      **16 · El electrón (3,1,0,1/2).** Está en el **nivel 3**, en el
      **subnivel 3p** y en el **orbital 3p de $m_\ell = 0$**, el que se suele
      dibujar como $3p_z$. En ese orbital cabe otro electrón,
      $(3, 1, 0, -1/2)$. En el mismo nivel y subnivel caben seis:

      $$
      (3,1,-1,\pm\tfrac12) \qquad (3,1,0,\pm\tfrac12) \qquad (3,1,1,\pm\tfrac12)
      $$

      **17 · Los ocho electrones del oxígeno**, $1s^{2}2s^{2}2p^{4}$, ocupando
      los orbitales de $m_\ell = -\ell$ a $+\ell$ y primero con $+1/2$, que es
      el convenio del problema resuelto 5:

      | electrón | $n$ | $\ell$ | $m_\ell$ | $m_s$ |
      |---|---|---|---|---|
      | 1s | 1 | 0 | 0 | +1/2 |
      | 1s | 1 | 0 | 0 | −1/2 |
      | 2s | 2 | 0 | 0 | +1/2 |
      | 2s | 2 | 0 | 0 | −1/2 |
      | 2p | 2 | 1 | −1 | +1/2 |
      | 2p | 2 | 1 | 0 | +1/2 |
      | 2p | 2 | 1 | 1 | +1/2 |
      | 2p | 2 | 1 | −1 | −1/2 |

      Con el convenio contrario los $m_\ell$ del $2p$ salen en otro orden, y
      la respuesta es igual de buena. Lo que no cambia con ningún convenio es
      lo que imponen las reglas: ningún conjunto repetido (Pauli) y los tres
      orbitales $2p$ ocupados antes de emparejar (Hund), así que siempre
      quedan dos electrones desapareados.

  - id: colfq2-p18-20-verdadero-o-falso-y-cinco-configuraciones
    titulo: Nueve frases sobre orbitales y niveles, y cinco configuraciones que hay que clasificar
    fuente: >-
      Problemas propuestos 18, 19 y 20 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra.
    nivel: practica
    enunciado: |
      **18.** De las siguientes frases decir cuáles son verdaderas y cuáles
      falsas:

      a) s, p y d son orbitales de la misma forma

      b) Los orbitales s son esféricos y los p lobulares

      c) Todos los orbitales d tienen la misma forma, solo cambian la
      orientación en el espacio

      d) De los orbitales d cuatro tienen la misma energía, el orbital dz² la
      tiene diferente

      e) Los orbitales p tienen la misma forma, pero distinta orientación

      **19.** Señala cuáles de estas afirmaciones son correctas.

      a) El nivel energético, expresado por el primer número cuántico, está
      relacionado con la distancia al núcleo.

      b) El nivel energético viene determinado por las letras s, p, d, f,…

      c) El número máximo de electrones que entran en el tercer nivel
      energético es de 36.

      d) Los electrones se ordenan en los átomos desde dentro hacia fuera,
      llenando completamente todos los niveles antes de poder añadir
      electrones en el siguiente.

      **20.** De las siguientes configuraciones electrónicas, decir cuáles
      corresponden a un átomo en estado fundamental o en estado excitado o son
      imposibles. Justifica la respuesta.

      1s²2s²2p⁶3s²3p⁷

      1s²2s²2p⁶3s²3p³

      1s²2s²2p⁶3s¹

      1s²2s²2p⁶3s³

      1s²2s²2p⁶3s²3p⁶4s²4p¹
    pide: Cuáles de las frases del 18 y del 19 son verdaderas, y si cada configuración del 20 es fundamental, excitada o imposible.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 19 b). ¿Qué dicen las letras s, p, d, f?
        opciones:
          - texto: >-
              El subnivel, es decir el valor de $\ell$ y la forma del orbital;
              el nivel lo da el número que va delante, $n$
            correcta: true
            mensaje: |
              Eso es. En $3d$ el nivel es el 3 y el subnivel el $d$, o sea
              $\ell = 2$. La frase b del 19 atribuye el nivel a las letras, y
              por eso es falsa.
          - texto: El nivel de energía, que por eso se escribe con letras
            mensaje: |
              El nivel es $n$, el número. Hay un $3s$, un $3p$ y un $3d$ en el
              mismo nivel 3: las letras distinguen subniveles dentro de él.
          - texto: El espín del electrón
            mensaje: |
              El espín es $m_s$, $\pm 1/2$, y no tiene letra. Las letras
              traducen $\ell$: $0 \to s$, $1 \to p$, $2 \to d$, $3 \to f$.

      - tipo: reconocer
        pregunta: |
          Problema 18. ¿Cuáles de las cinco frases son verdaderas?
        opciones:
          - texto: Verdaderas la b y la e; falsas la a, la c y la d
            correcta: true
            mensaje: |
              Eso es. La a es falsa porque cada letra es una forma: $s$
              esférico, $p$ de dos lóbulos. La c, porque el $d_{z^2}$ no tiene
              la forma de trébol de los otros cuatro. La d, porque en el átomo
              aislado los cinco $d$ de un mismo nivel tienen la misma energía.
              La c y la d son la misma trampa por los dos lados: mezclar forma
              con energía.
          - texto: Verdaderas la b, la c y la e; falsas la a y la d
            mensaje: |
              Has dado por buena la c. Cuatro de los orbitales $d$ tienen
              cuatro lóbulos en cruz, pero el $d_{z^2}$ no: tiene dos lóbulos
              sobre el eje $z$ y un anillo alrededor. No todos tienen la misma
              forma.
          - texto: Verdaderas la b, la d y la e; falsas la a y la c
            mensaje: |
              Has dado por buena la d. Que el $d_{z^2}$ tenga otra **forma** no
              le da otra **energía**: en un átomo aislado los cinco orbitales
              $d$ de un mismo nivel tienen la misma energía. Solo se separan
              cuando el átomo está rodeado de otros, y eso ya no es este tema.
          - texto: Verdaderas la a y la e; falsas la b, la c y la d
            mensaje: |
              Has cambiado la a por la b. Las letras son justamente formas
              distintas: el orbital $s$ es una esfera y el $p$ tiene dos
              lóbulos. Por eso la a, que los da por iguales, es falsa, y la b,
              que dice eso mismo, es verdadera.

      - tipo: reconocer
        pregunta: |
          Problema 19. ¿Cuáles de las cuatro afirmaciones son correctas?
        opciones:
          - texto: Solo la a
            correcta: true
            mensaje: |
              Eso es. $n$ fija el tamaño del orbital: a mayor $n$, más lejos
              del núcleo está el electrón. La b confunde nivel y subnivel; la c
              da 36 donde en el nivel 3 caben $2 \cdot 3^{2} = 18$,
              $3s^{2}3p^{6}3d^{10}$; y la d olvida que el $4s$ se llena antes
              que el $3d$.
          - texto: La a y la d
            mensaje: |
              Has dado por buena la d. Los niveles no se llenan enteros uno
              tras otro: el $4s$ se ocupa antes que el $3d$, y el potasio tiene
              un electrón en el nivel 4 con el nivel 3 a medio llenar. Por eso
              existe el diagrama de Moeller.
          - texto: La a y la b
            mensaje: |
              Has dado por buena la b. El nivel es el número, $n$; las letras
              dan el subnivel dentro de ese nivel.
          - texto: Solo la c
            mensaje: |
              En el nivel 3 caben $2n^{2} = 2 \cdot 3^{2} = 18$ electrones, no
              36: dos en el $3s$, seis en el $3p$ y diez en el $3d$. Y la a,
              que has descartado, es correcta: el primer número cuántico fija
              el tamaño del orbital, y a mayor $n$, más lejos del núcleo está
              el electrón.

      - tipo: calcular
        titulo: Las imposibles del 20
        pregunta: |
          Problema 20. ¿Cuántas de las cinco configuraciones son imposibles?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Solo has visto el $3p^{7}$. El $3s^{3}$ también es imposible: un
              subnivel $s$ tiene un solo orbital y admite dos electrones, uno
              con cada espín.
          - valor: '3'
            mensaje: |
              Has contado como imposible la última, la del $4p^{1}$. No lo es:
              ese electrón podría estar en el $3d$ y está en el $4p$, que es
              un estado excitado. Imposible es solo lo que viola el principio
              de exclusión.
        pista: |
          Un subnivel $s$ admite 2 electrones y uno $p$, 6.
        desarrollo: |
          $3p^{7}$ pide siete electrones en tres orbitales, y $3s^{3}$ tres en
          uno: las dos rompen el principio de exclusión de Pauli. **Dos.**

      - tipo: calcular
        titulo: El átomo de la última
        pregunta: |
          La última configuración, $\ldots 3s^{2}3p^{6}4s^{2}4p^{1}$, ¿de qué
          número atómico es?
        respuesta:
          tipo: numero
          valor: '21'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '31'
            mensaje: |
              $4s^{2}4p^{1}$ es como termina el galio, pero el galio tiene
              además los diez $3d$ que aquí faltan. Suma los superíndices: son
              21.
          - valor: '3'
            mensaje: |
              Has contado solo los electrones del nivel 4. El número atómico
              es el total, con todos los niveles de dentro.
        pista: |
          Suma todos los superíndices.
        desarrollo: |
          $$
          2 + 2 + 6 + 2 + 6 + 2 + 1 = 21
          $$

          Es el escandio, cuya configuración fundamental es
          $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{1}4s^{2}$.

      - tipo: reconocer
        pregunta: |
          Entonces, ¿qué es $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}4s^{2}4p^{1}$?
        opciones:
          - texto: >-
              Un estado excitado del escandio: su electrón número 21 está en
              el $4p$ cuando le toca el $3d$
            correcta: true
            mensaje: |
              Eso es. En el diagrama de Moeller después del $4s$ va el $3d$, y
              después el $4p$. Nada prohíbe que el electrón esté más arriba:
              solo que así el átomo no está en su estado de menor energía.
          - texto: El estado fundamental, porque todos los subniveles de dentro están llenos
            mensaje: |
              Estarán llenos, pero falta uno: el $3d$, que va antes que el
              $4p$. El fundamental del escandio es $\ldots 3d^{1}4s^{2}$.
          - texto: Imposible, porque no se puede ocupar el $4p$ sin haber llenado el $3d$
            mensaje: |
              No se **suele**, en el estado fundamental; poderse, se puede. Un
              átomo que absorbe energía sube un electrón a un subnivel más
              alto, y eso es justo un estado excitado. Imposible es solo lo que
              no cabe: más de dos electrones por orbital.

      - tipo: justificar
        pregunta: Ordena la clasificación del 20. Una pieza es falsa.
        piezas:
          - texto: >-
              $3p^{7}$ y $3s^{3}$ son imposibles: un subnivel $p$ admite 6
              electrones y uno $s$, 2.
          - texto: >-
              $\ldots 3s^{2}3p^{3}$, 15 electrones, es el fósforo en su estado
              fundamental.
          - texto: >-
              $\ldots 3s^{1}$, 11 electrones, es el sodio en su estado
              fundamental.
          - texto: >-
              $\ldots 4s^{2}4p^{1}$, 21 electrones, es el escandio excitado:
              el electrón que va en el $3d$ está en el $4p$.
          - texto: >-
              $\ldots 4s^{2}4p^{1}$ es el galio en estado fundamental, porque
              así es como termina el galio.
            trampa: true
            mensaje: |
              Termina igual, pero el galio tiene 31 electrones y esta
              configuración 21: le faltan los diez $3d$. Una configuración se
              identifica sumando todos los superíndices, no mirando cómo acaba.
        veredicto: |
          Imposible es romper Pauli; excitado es saltarse el orden de Moeller;
          fundamental, seguirlo. Y antes de nada, sumar los electrones.

    resolucion: |
      **18.** a) falsa · b) verdadera · c) falsa · d) falsa · e) verdadera.

      Las dos que engañan son la c y la d, y engañan por lo mismo: el
      orbital $d_{z^2}$ tiene **otra forma** que los otros cuatro —dos lóbulos
      sobre el eje $z$ y un anillo— pero **la misma energía**. En un átomo
      aislado los orbitales de un mismo subnivel tienen todos la misma
      energía; la forma no la cambia.

      **19.** Solo la a es correcta. La b confunde nivel y subnivel; la c da
      36 donde caben $2 \cdot 3^{2} = 18$; la d niega el diagrama de Moeller,
      que existe porque el $4s$ se llena antes que el $3d$.

      **20.**

      | configuración | electrones | clasificación | por qué |
      |---|---|---|---|
      | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{7}$ | 19 | imposible | un $p$ admite 6 |
      | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{3}$ | 15 | fundamental | el fósforo, por Moeller |
      | $1s^{2}2s^{2}2p^{6}3s^{1}$ | 11 | fundamental | el sodio, por Moeller |
      | $1s^{2}2s^{2}2p^{6}3s^{3}$ | 13 | imposible | un $s$ admite 2 |
      | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}4s^{2}4p^{1}$ | 21 | excitada | el escandio con un electrón en el $4p$ en vez del $3d$ |

      **La regla de las tres casillas.** Una configuración es **imposible** si
      mete en un subnivel más electrones de los que caben —dos por orbital—;
      es **excitada** si caben pero algún electrón está en un subnivel más alto
      que el que le toca por Moeller; y es **fundamental** si sigue Moeller
      con sus excepciones. La última engaña porque termina como el galio: por
      eso se suman los electrones antes de clasificar.

  - id: colfq2-p21-24-configuraciones-e-isoelectronicas
    titulo: Quince configuraciones, las excepciones del molibdeno y la plata, y quién es isoelectrónico con quién
    fuente: >-
      Problemas propuestos 21, 22 y 24 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra. El 22 y el 24 dicen «cuál de
      ellas son».
    nivel: practica
    enunciado: |
      **21.** Escribir la configuración electrónica de los siguientes
      elementos: Ti, Kr, Ni, Sn, Bi.

      **22.** Escribir la configuración electrónica de las siguientes especies
      e indicar cuál de ellas son isoelectrónicas entre sí: Na⁺, Ne, Ni⁺³,
      Mn, O⁻², Mg⁺².

      **24.** Escribir la configuración electrónica de las siguientes especies
      e indicar cuál de ellas son isoelectrónicas entre sí: ₄₇Ag, ₄₂Mo,
      ₂₉Cu⁺, ₅₃I⁻.

      *En el 22 y en el 24, «cuál de ellas son» es así en el original:
      debería decir «cuáles».*
    pide: Las configuraciones de los cinco elementos del 21 y de las diez especies del 22 y del 24, y cuáles son isoelectrónicas entre sí.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 24. El molibdeno está debajo del cromo y la plata debajo
          del cobre. ¿Cómo terminan sus configuraciones?
        opciones:
          - texto: Mo en $4d^{5}5s^{1}$ y Ag en $4d^{10}5s^{1}$
            correcta: true
            mensaje: |
              Eso es: las dos excepciones del cromo y del cobre, una fila más
              abajo. Un electrón del $5s$ pasa al $4d$ para dejarlo a medio
              llenar en el molibdeno y lleno en la plata, que son las dos
              situaciones más estables de un subnivel $d$.
          - texto: Mo en $4d^{4}5s^{2}$ y Ag en $4d^{9}5s^{2}$
            mensaje: |
              Es el diagrama de Moeller al pie de la letra, sin excepciones. El
              molibdeno y la plata hacen lo mismo que el cromo y el cobre de
              encima: pasan un electrón del $5s$ al $4d$.
          - texto: Mo en $4d^{4}5s^{2}$ y Ag en $4d^{10}5s^{1}$
            mensaje: |
              Has aplicado la excepción del cobre a la plata y te has olvidado
              de la del cromo en el molibdeno. Un $d$ a medio llenar,
              $4d^{5}$, también compensa pasar un electrón desde el $5s$.
          - texto: Mo en $4d^{6}$ y Ag en $4d^{11}$
            mensaje: |
              El $4d^{11}$ es imposible, porque un subnivel $d$ admite diez
              electrones. Y la excepción mueve un solo electrón del $5s$, no
              los dos.

      - tipo: calcular
        titulo: El nivel más externo de los cinco del 21
        pregunta: |
          Problema 21. Escritas las cinco configuraciones, ¿cuántos electrones
          tiene cada elemento en su nivel más alto, en el orden Ti, Kr, Ni,
          Sn, Bi?
        respuesta:
          tipo: vector
          valor: '(2, 8, 2, 4, 5)'
          tolerancia: 0.001
          formato: los cinco números en el orden Ti, Kr, Ni, Sn, Bi, entre paréntesis y separados por comas
        distractores:
          - valor: '(2, 6, 2, 2, 3)'
            mensaje: |
              Has contado solo el último subnivel escrito: el $4p^{6}$ del
              kriptón, el $5p^{2}$ del estaño y el $6p^{3}$ del bismuto. El
              nivel más alto incluye también su $s$: $4s^{2}4p^{6}$ son ocho.
          - valor: '(4, 8, 10, 4, 5)'
            mensaje: |
              En el titanio y el níquel has sumado los electrones $3d$ a los
              $4s$. Esos cuatro y diez son los que deciden su grupo, 4B y 8B,
              pero el $3d$ es del nivel 3: en el nivel 4 solo tienen el
              $4s^{2}$.
        pista: |
          Ordena cada configuración por niveles y cuenta los electrones del $n$
          más alto: $s$ y $p$ de ese nivel.
        desarrollo: |
          | | $Z$ | configuración | nivel más alto |
          |---|---|---|---|
          | Ti | 22 | $[\mathrm{Ar}]\,3d^{2}4s^{2}$ | $4s^{2}$: 2 |
          | Kr | 36 | $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{6}$ | $4s^{2}4p^{6}$: 8 |
          | Ni | 28 | $[\mathrm{Ar}]\,3d^{8}4s^{2}$ | $4s^{2}$: 2 |
          | Sn | 50 | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{2}$ | $5s^{2}5p^{2}$: 4 |
          | Bi | 83 | $[\mathrm{Xe}]\,4f^{14}5d^{10}6s^{2}6p^{3}$ | $6s^{2}6p^{3}$: 5 |

          Ninguno de los cinco tiene excepción. En el bismuto conviene
          comprobar la suma, porque es fácil perder el $4f^{14}$:
          $54 + 14 + 10 + 2 + 3 = 83$.

      - tipo: reconocer
        pregunta: |
          Problema 22. El níquel es $[\mathrm{Ar}]\,3d^{8}4s^{2}$. ¿Qué
          configuración tiene el Ni³⁺?
        opciones:
          - texto: $[\mathrm{Ar}]\,3d^{7}$
            correcta: true
            mensaje: |
              Eso es. Salen primero los dos $4s$, los más externos, y el
              tercero ya tiene que salir del $3d$. Es la regla del problema
              resuelto 6 con un electrón más.
          - texto: $[\mathrm{Ar}]\,3d^{5}4s^{2}$
            mensaje: |
              Has quitado los tres electrones del $3d$, por ser los últimos en
              entrar. Los cationes pierden primero los más externos, los $4s$.
              Y fíjate en lo que te ha salido: es la configuración del
              manganeso, que está en la misma lista. Con este error los dos
              parecerían la misma especie.
          - texto: $[\mathrm{Ar}]\,3d^{6}4s^{1}$
            mensaje: |
              Has repartido: uno del $4s$ y dos del $3d$. No hay reparto: se
              vacía entero el $4s$ antes de tocar el $3d$.
          - texto: $[\mathrm{Ar}]\,3d^{8}$
            mensaje: |
              Ese es el Ni²⁺: le has quitado dos electrones. El Ni³⁺ pierde
              tres, y el tercero sale del $3d$.

      - tipo: calcular
        titulo: Los electrones de las seis especies del 22
        pregunta: |
          ¿Cuántos electrones tiene cada especie del 22, en el orden del
          enunciado?
        respuesta:
          tipo: vector
          valor: '(10, 10, 25, 25, 10, 10)'
          tolerancia: 0.001
          formato: los seis números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(12, 10, 31, 25, 6, 14)'
            mensaje: |
              Has aplicado las cargas al revés: a los cationes les has sumado
              electrones y al O²⁻ se los has quitado. Una carga positiva dice
              que **faltan** electrones: el Na⁺ tiene $11 - 1 = 10$.
          - valor: '(11, 10, 28, 25, 8, 12)'
            mensaje: |
              Has dado el número atómico de cada uno, que son los protones.
              Solo en los átomos neutros, el Ne y el Mn, coinciden con los
              electrones.
        pista: |
          Electrones = $Z$ − carga, con su signo.
        desarrollo: |
          $$
          \mathrm{Na^{+}}: 11 - 1 \quad \mathrm{Ne}: 10 \quad \mathrm{Ni^{3+}}: 28 - 3 \quad \mathrm{Mn}: 25 \quad \mathrm{O^{2-}}: 8 + 2 \quad \mathrm{Mg^{2+}}: 12 - 2
          $$

          Cuatro especies con diez electrones y dos con veinticinco.

      - tipo: reconocer
        pregunta: |
          El Ni³⁺ y el Mn tienen los dos 25 electrones. ¿Son isoelectrónicos?
        opciones:
          - texto: >-
              Sí, porque tienen el mismo número de electrones; pero no la misma
              configuración, $[\mathrm{Ar}]\,3d^{7}$ frente a
              $[\mathrm{Ar}]\,3d^{5}4s^{2}$
            correcta: true
            mensaje: |
              Eso es, con la definición del tema: isoelectrónicas son las
              especies con el mismo número de electrones. Y el problema pide
              escribir las configuraciones para que se vea la diferencia: las
              cuatro de diez electrones son las cuatro $1s^{2}2s^{2}2p^{6}$,
              iguales; las dos de veinticinco se reparten distinto.
          - texto: No, porque uno es un ion y el otro un átomo neutro
            mensaje: |
              Entonces el Na⁺ y el Ne tampoco lo serían, y son el ejemplo de
              manual. Ser isoelectrónico no depende de la carga: depende del
              número de electrones.
          - texto: Sí, y además con la misma configuración, $[\mathrm{Ar}]\,3d^{5}4s^{2}$
            mensaje: |
              Para que el Ni³⁺ fuera $3d^{5}4s^{2}$ tendría que haber perdido
              tres electrones $3d$ y conservar los $4s$, y es al revés: un
              catión pierde primero los $4s$. El Ni³⁺ es $3d^{7}$.
          - texto: No, porque son de elementos distintos
            mensaje: |
              Las especies isoelectrónicas son casi siempre de elementos
              distintos: Na⁺, Ne, O²⁻ y Mg²⁺ son cuatro elementos con los
              mismos diez electrones.

      - tipo: calcular
        titulo: Los electrones de las cuatro especies del 24
        pregunta: |
          Problema 24. ¿Cuántos electrones tiene cada especie, en el orden Ag,
          Mo, Cu⁺, I⁻?
        respuesta:
          tipo: vector
          valor: '(47, 42, 28, 54)'
          tolerancia: 0.001
          formato: los cuatro números en el orden Ag, Mo, Cu⁺, I⁻, entre paréntesis y separados por comas
        distractores:
          - valor: '(47, 42, 30, 52)'
            mensaje: |
              Has aplicado las cargas al revés en los dos iones. El Cu⁺ ha
              perdido un electrón, $29 - 1$, y el I⁻ ha ganado uno,
              $53 + 1$.
          - valor: '(47, 42, 29, 53)'
            mensaje: |
              Has dado los números atómicos. En el Cu⁺ y el I⁻ hay que aplicar
              la carga: 28 y 54.
        pista: |
          Los dos primeros son átomos neutros; los dos últimos, iones.
        desarrollo: |
          $$
          \mathrm{Ag}: 47 \qquad \mathrm{Mo}: 42 \qquad \mathrm{Cu^{+}}: 29 - 1 = 28 \qquad \mathrm{I^{-}}: 53 + 1 = 54
          $$

      - tipo: calcular
        titulo: Las parejas isoelectrónicas del 24
        pregunta: |
          ¿Cuántas parejas isoelectrónicas hay entre las cuatro especies del
          24?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Seguramente has emparejado la Ag con el Cu⁺, que tienen los dos
              el subnivel $d$ completo, $4d^{10}$ y $3d^{10}$. Se parecen en
              eso, pero la plata tiene 47 electrones y el Cu⁺ 28.
              Isoelectrónico es tener el mismo número de electrones, no un
              subnivel parecido.
          - valor: '2'
            mensaje: |
              Has emparejado por parecido: la Ag con el Cu⁺, que tienen los
              dos un $d^{10}$ completo, y el Mo con la Ag, que acaban los dos
              en $5s^{1}$. Los cuatro números de electrones, 47, 42, 28 y 54,
              son distintos: no hay ninguna pareja.
        pista: |
          Compara los cuatro números del paso anterior.
        desarrollo: |
          47, 42, 28 y 54: no se repite ninguno. **Ninguna** de las cuatro
          especies es isoelectrónica con otra. El I⁻ sí lo es con el xenón,
          pero el xenón no está en la lista.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Para decidir si dos especies son isoelectrónicas se cuentan sus
              electrones: $Z$ menos la carga.
          - texto: >-
              En el 22, Na⁺, Ne, O²⁻ y Mg²⁺ tienen diez electrones y la misma
              configuración, $1s^{2}2s^{2}2p^{6}$.
          - texto: >-
              Ni³⁺ y Mn tienen 25 cada uno, pero distinta configuración:
              $[\mathrm{Ar}]\,3d^{7}$ y $[\mathrm{Ar}]\,3d^{5}4s^{2}$.
          - texto: >-
              En el 24 los números son 47, 42, 28 y 54: ninguna pareja es
              isoelectrónica.
          - texto: >-
              La Ag y el Cu⁺ son isoelectrónicos porque los dos terminan en
              $d^{10}$.
            trampa: true
            mensaje: |
              Terminar igual no es tener los mismos electrones: la Ag tiene 47
              y el Cu⁺ 28. Lo que comparten es un subnivel $d$ completo,
              $4d^{10}$ en la plata y $3d^{10}$ en el Cu⁺, y eso no dice nada de
              cuántos electrones tiene cada uno.
        veredicto: |
          Isoelectrónico se decide contando, no mirando cómo termina la
          configuración. Y en un catión de transición, los electrones salen
          primero del $s$.

    resolucion: |
      **21 · Cinco elementos**, ordenados por niveles:

      | | $Z$ | configuración |
      |---|---|---|
      | Ti | 22 | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{2}4s^{2}$ |
      | Kr | 36 | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{10}4s^{2}4p^{6}$ |
      | Ni | 28 | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{8}4s^{2}$ |
      | Sn | 50 | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{2}$ |
      | Bi | 83 | $[\mathrm{Xe}]\,4f^{14}5d^{10}6s^{2}6p^{3}$ |

      **22 · Seis especies.**

      | | electrones | configuración |
      |---|---|---|
      | Na⁺ | 10 | $1s^{2}2s^{2}2p^{6}$ |
      | Ne | 10 | $1s^{2}2s^{2}2p^{6}$ |
      | Ni³⁺ | 25 | $[\mathrm{Ar}]\,3d^{7}$ |
      | Mn | 25 | $[\mathrm{Ar}]\,3d^{5}4s^{2}$ |
      | O²⁻ | 10 | $1s^{2}2s^{2}2p^{6}$ |
      | Mg²⁺ | 10 | $1s^{2}2s^{2}2p^{6}$ |

      Son isoelectrónicos entre sí **Na⁺, Ne, O²⁻ y Mg²⁺**, con diez
      electrones y la configuración del neón, y **Ni³⁺ y Mn**, con veinticinco.
      Estos dos tienen el mismo número de electrones pero no la misma
      configuración, porque el níquel pierde primero los $4s$. Quien quita los
      tres electrones del $3d$ le da al Ni³⁺ la configuración del manganeso, y
      con esta pareja en la lista es el error que más cuesta ver.

      **24 · Cuatro especies.**

      | | electrones | configuración |
      |---|---|---|
      | ₄₇Ag | 47 | $[\mathrm{Kr}]\,4d^{10}5s^{1}$ |
      | ₄₂Mo | 42 | $[\mathrm{Kr}]\,4d^{5}5s^{1}$ |
      | ₂₉Cu⁺ | 28 | $[\mathrm{Ar}]\,3d^{10}$ |
      | ₅₃I⁻ | 54 | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{6}$ |

      **Ninguna** es isoelectrónica con otra. El molibdeno y la plata llevan
      las excepciones del cromo y del cobre, una fila más abajo, y el Cu⁺
      pierde su único $4s$: se queda con el $3d^{10}$ completo.

      **Lo que deja el bloque.** Isoelectrónico se decide contando electrones,
      y para contarlos hay que aplicar bien la carga; para escribir la
      configuración de un catión de transición hay que vaciar primero el $s$
      de fuera. Las dos cosas juntas son las que distinguen el Ni³⁺ del
      manganeso.

  - id: colfq2-p23-cuatro-slater-del-periodo-5
    titulo: Cuatro cargas efectivas del periodo 5, y la del cadmio con la otra tabla
    fuente: >-
      Problema propuesto 23 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no publica
      solución: la respuesta es nuestra. El «último electrón» se toma como en
      el problema resuelto 7, el último que entra por el diagrama de Moeller.
    nivel: practica
    enunciado: |
      Calcular la carga nuclear efectiva del último electrón de los
      siguientes elementos: Rb, Sr, Te, Cd.
    pide: La carga nuclear efectiva del último electrón del rubidio, el estroncio, el teluro y el cadmio.

    pasos:
      - tipo: reconocer
        pregunta: |
          El cadmio es $[\mathrm{Kr}]\,4d^{10}5s^{2}$. ¿Cuál es su último
          electrón, y con qué tabla se calcula?
        opciones:
          - texto: >-
              Un $4d$, el último que entra por Moeller, y con la tabla de los
              electrones $d$: $0{,}35$ los del grupo y $1{,}00$ todo lo de la
              izquierda
            correcta: true
            mensaje: |
              Eso es, y es lo que hace la colección con el níquel en el
              problema resuelto 7: su «último electrón que ha entrado» es un
              $3d$, y los $4s$ quedan a la derecha sin contar. El cadmio es el
              mismo caso una fila más abajo.
          - texto: Un $5s$, porque es el que está más fuera
            mensaje: |
              Ese es el electrón **más externo**, y en un elemento de
              transición no es el último que entró. El enunciado pide el
              último, y la colección, con el níquel, toma el $d$.
          - texto: >-
              Un $4d$, pero con la tabla de los $s$ y $p$: $0{,}85$ la capa de
              debajo y $1{,}00$ lo demás
            mensaje: |
              El electrón es el bueno y la tabla no. Para un $d$ desaparece el
              escalón de $0{,}85$: todo lo que queda a la izquierda de su
              grupo aporta $1{,}00$.

      - tipo: calcular
        titulo: El rubidio
        pregunta: |
          Rb, $Z = 37$, $(\ldots)(4s^{2}4p^{6})(5s^{1})$. ¿Cuánto vale
          $Z_{\text{ef}}$ de su electrón $5s$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Es la cuenta ingenua, $37 - 36$: los ocho de la capa 4 a
              $1{,}00$. Esa es la capa $n-1$ y su peso es $0{,}85$.
          - valor: '1.85'
            mensaje: |
              Te has contado a ti mismo. En el grupo $(5s^{1})$ solo está el
              electrón que miramos, y ese término vale cero.
        pista: |
          Ninguno en su grupo, ocho en la capa 4 y veintiocho más adentro.
        desarrollo: |
          $$
          S = 8 \times 0{,}85 + 28 \times 1{,}00 = 34{,}80 \qquad Z_{\text{ef}} = 37 - 34{,}80 = 2{,}20
          $$

      - tipo: calcular
        titulo: El estroncio
        pregunta: |
          Sr, $Z = 38$, $(\ldots)(4s^{2}4p^{6})(5s^{2})$. ¿Cuánto vale
          $Z_{\text{ef}}$ de un electrón $5s$?
        respuesta:
          tipo: numero
          valor: '2.85'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2.50'
            mensaje: |
              Te has contado a ti mismo: en $(5s^{2})$ hay dos electrones, así
              que el que miramos tiene **un** compañero.
          - valor: '1.65'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho de la capa 4. Es la capa
              $n-1$: su peso es $0{,}85$.
          - valor: '2'
            mensaje: |
              Es la cuenta ingenua, $38 - 36$, que trata a todos los internos
              como si taparan del todo y olvida al compañero del $5s$.
        pista: |
          Un compañero, ocho en la capa 4 y veintiocho más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 8 \times 0{,}85 + 28 \times 1{,}00 = 35{,}15 \qquad Z_{\text{ef}} = 38 - 35{,}15 = 2{,}85
          $$

      - tipo: calcular
        titulo: El teluro
        pregunta: |
          Te, $Z = 52$,
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2}4p^{6})(4d^{10})(5s^{2}5p^{4})$.
          ¿Cuánto vale $Z_{\text{ef}}$ de un electrón $5p$?
        respuesta:
          tipo: numero
          valor: '6.95'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '6.60'
            mensaje: |
              Te has contado a ti mismo. En $(5s^{2}5p^{4})$ hay seis
              electrones, así que el que miramos tiene cinco compañeros.
          - valor: '4.25'
            mensaje: |
              Has apantallado con $1{,}00$ los dieciocho de la capa 4, el
              $4s^{2}4p^{6}$ y el $4d^{10}$. Todos son de la capa $n-1$, y
              pesan $0{,}85$ aunque el $4d$ esté en otro grupo.
          - valor: '6'
            mensaje: |
              Es la cuenta ingenua, $52 - 46$: los cuarenta y seis internos
              como si taparan del todo. Los dieciocho de la capa 4 tapan
              $0{,}85$, y los cinco compañeros también tapan algo.
        pista: |
          Cinco compañeros, dieciocho en la capa 4 (con el $4d$) y veintiocho
          más adentro.
        desarrollo: |
          $$
          S = 5 \times 0{,}35 + 18 \times 0{,}85 + 28 \times 1{,}00 = 45{,}05 \qquad Z_{\text{ef}} = 52 - 45{,}05 = 6{,}95
          $$

          Para un electrón $s$ o $p$ la capa $n-1$ es entera, con su $d$: los
          dieciocho de la capa 4 pesan igual.

      - tipo: calcular
        titulo: El cadmio
        pregunta: |
          Cd, $Z = 48$,
          $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{10})(4s^{2}4p^{6})(4d^{10})(5s^{2})$.
          ¿Cuánto vale $Z_{\text{ef}}$ de un electrón $4d$?
        respuesta:
          tipo: numero
          valor: '8.85'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '4.35'
            mensaje: |
              Es la carga efectiva del electrón $5s$, el más externo. El
              último que entra es un $4d$, y con él los $5s$ quedan a la
              derecha y no cuentan.
          - valor: '8.50'
            mensaje: |
              Te has contado a ti mismo. En $(4d^{10})$ el que miramos tiene
              nueve compañeros, no diez.
          - valor: '8.15'
            mensaje: |
              Has contado los dos $5s$ con $0{,}35$ cada uno. Están en un grupo
              a la **derecha** del $4d$, y los de la derecha no apantallan
              nada.
        pista: |
          Nueve compañeros a $0{,}35$, treinta y seis a la izquierda a $1{,}00$
          y los $5s$ fuera.
        desarrollo: |
          $$
          S = 9 \times 0{,}35 + 36 \times 1{,}00 = 39{,}15 \qquad Z_{\text{ef}} = 48 - 39{,}15 = 8{,}85
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Rb y Sr: el último electrón es un $5s$; con ocho en la capa 4 a
              $0{,}85$ y veintiocho a $1{,}00$ salen 2,20 y 2,85.
          - texto: >-
              Te: un $5p$ con cinco compañeros; la capa 4 entera, con el $4d$,
              pesa $0{,}85$, y sale 6,95.
          - texto: >-
              Cd: el último en entrar es un $4d$; con la tabla de los $d$,
              nueve compañeros a $0{,}35$ y treinta y seis a $1{,}00$, sale 8,85.
          - texto: >-
              El rubidio da lo mismo que el sodio y el potasio, y el estroncio
              lo mismo que el magnesio y el calcio: en los grupos 1 y 2, del
              periodo 3 para abajo, Slater no cambia la carga efectiva; cambia
              $n$.
          - texto: >-
              En el cadmio los dos $5s$ apantallan al $4d$ con $0{,}35$ cada
              uno, porque son de su misma capa de valencia.
            trampa: true
            mensaje: |
              Están en un grupo a la derecha del $4d$ en el orden de Slater,
              $(4d)(5s5p)$, y los de la derecha no apantallan. Es el mismo caso
              que los $4s$ del níquel en el problema resuelto 7.
        veredicto: |
          Primero se agrupa y se localiza el electrón; después se elige la
          tabla. El error de tabla y el de contarse a uno mismo son los que
          más se repiten.

    resolucion: |
      **Los cuatro, agrupados.**

      | | último electrón | compañeros × 0,35 | $n-1$ × 0,85 | resto × 1,00 | $S$ | $Z_{\text{ef}}$ |
      |---|---|---|---|---|---|---|
      | Rb, 37 | $5s$ | 0 | 8 | 28 | 34,80 | **2,20** |
      | Sr, 38 | $5s$ | 1 | 8 | 28 | 35,15 | **2,85** |
      | Te, 52 | $5p$ | 5 | 18 | 28 | 45,05 | **6,95** |
      | Cd, 48 | $4d$ | 9 | — | 36 | 39,15 | **8,85** |

      En el cadmio no hay columna de $0{,}85$: para un electrón $d$ todo lo
      de la izquierda aporta $1{,}00$, y los dos $5s$, a la derecha, no
      cuentan.

      **Qué electrón.** El enunciado dice «el último electrón», y la
      colección, en el problema resuelto 7, toma el último que ha entrado:
      para el níquel, un $3d$. Con el cadmio pasa lo mismo, y su último
      electrón es un $4d$. Si se pidiera el más externo, el $5s$, saldría
      $48 - 43{,}65 = 4{,}35$: casi la mitad. Por eso conviene leer qué
      electrón se pide antes de agrupar.

      **Un patrón que ahorra cuentas.** El rubidio da 2,20, como el sodio y
      el potasio, y el estroncio 2,85, como el magnesio y el calcio. En los
      grupos 1 y 2, del periodo 3 para abajo, al bajar un puesto los protones
      nuevos vienen con otros tantos electrones que pasan a tapar del todo, y
      Slater deja la carga efectiva igual: lo que crece es $n$. En los grupos
      del bloque $p$ el patrón empieza un periodo más abajo. El teluro da lo
      mismo que el selenio de encima, 6,95, pero el selenio no da lo mismo
      que el azufre, 5,45: del periodo 3 al 4 entran en la capa de debajo los
      diez $3d$, que tapan $0{,}85$ y no $1{,}00$. Lo mismo del cloro, 6,10,
      al bromo, 7,60, y del aluminio, 3,50, al galio, 5,00. Aun así, en un
      grupo manda $n$ y en un periodo manda $Z_{\text{ef}}$. (Del periodo 2
      al 3 tampoco se cumple: el litio da 1,30 y el sodio 2,20, porque debajo
      del litio solo hay dos electrones.)

  - id: colfq2-p25-26-protones-y-electrones-de-trece-iones
    titulo: Protones y electrones de trece iones, y lo único que cambia la carga
    fuente: >-
      Problemas propuestos 25 y 26 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra.
    nivel: practica
    enunciado: |
      **25.** Indicar el número de protones y electrones que tienen los
      siguientes iones: Rb⁺, Ba⁺², Sn⁺², Fe⁺³, O⁻², P⁻³, Cl⁻.

      **26.** Indicar el número de protones y electrones que tienen los
      siguientes iones: Sc³⁺, Co⁺², I⁻, Mn⁺², N⁻³, Cr⁺³.
    pide: El número de protones y de electrones de cada uno de los trece iones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Cuando un átomo se convierte en ion, ¿qué cambia?
        opciones:
          - texto: >-
              Solo el número de electrones: los protones son los del elemento
              y no se tocan
            correcta: true
            mensaje: |
              Eso es. Los protones son Z y dicen qué elemento es; un ion es el
              mismo elemento con electrones de más o de menos. Un catión los
              ha perdido y un anión los ha ganado.
          - texto: El número de protones, y la carga dice cuántos
            mensaje: |
              Si cambiaran los protones cambiaría el elemento: el Fe³⁺ con 23
              protones sería vanadio. La carga sale de que los electrones ya no
              igualan a los protones, y lo que ha cambiado son los electrones.
          - texto: Protones y electrones a la vez, para que la carga salga
            mensaje: |
              Basta con mover los electrones. La carga es protones menos
              electrones: con los protones fijos, cada electrón que se va suma
              una carga positiva y cada uno que llega, una negativa.
          - texto: El número de neutrones
            mensaje: |
              Los neutrones no tienen carga: quitarlos o ponerlos no cambia la
              carga, cambia el isótopo. Un ion es cuestión de electrones.

      - tipo: calcular
        titulo: Los protones del Fe³⁺
        pregunta: |
          ¿Cuántos protones tiene el ion Fe³⁺?
        respuesta:
          tipo: numero
          valor: '26'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '23'
            mensaje: |
              Has aplicado la carga a los protones. 23 son los **electrones**
              del Fe³⁺; sus protones siguen siendo los 26 del hierro.
          - valor: '29'
            mensaje: |
              Has sumado la carga a los protones. Los protones son Z, 26, y la
              carga solo cuenta en los electrones, y restando: $26 - 3 = 23$.
        pista: |
          Los protones de un ion son el número atómico del elemento.
        desarrollo: |
          El hierro tiene $Z = 26$, y el Fe³⁺ también: **26 protones**. Lo que
          ha cambiado son los electrones, $26 - 3 = 23$. Con los otros doce
          iones pasa lo mismo: los protones son su número atómico.

      - tipo: calcular
        titulo: Los electrones de los siete iones del 25
        pregunta: |
          Problema 25. ¿Cuántos electrones tiene cada ion, en el orden del
          enunciado?
        respuesta:
          tipo: vector
          valor: '(36, 54, 48, 23, 10, 18, 18)'
          tolerancia: 0.001
          formato: los siete números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(38, 58, 52, 29, 6, 12, 16)'
            mensaje: |
              Has aplicado las cargas al revés: a los cationes les has sumado
              electrones y a los aniones se los has quitado. Un catión ha
              **perdido** electrones: el Rb⁺ tiene $37 - 1 = 36$.
          - valor: '(37, 56, 50, 26, 8, 15, 17)'
            mensaje: |
              Esos son los protones, los números atómicos. En un ion los
              electrones ya no coinciden con los protones: esa diferencia es,
              justamente, la carga.
        pista: |
          Electrones = Z − carga: a un catión se le restan y a un anión se le
          suman.
        desarrollo: |
          | | Rb⁺ | Ba²⁺ | Sn²⁺ | Fe³⁺ | O²⁻ | P³⁻ | Cl⁻ |
          |---|---|---|---|---|---|---|---|
          | protones, Z | 37 | 56 | 50 | 26 | 8 | 15 | 17 |
          | electrones | 36 | 54 | 48 | 23 | 10 | 18 | 18 |

      - tipo: calcular
        titulo: Los electrones de los seis iones del 26
        pregunta: |
          Problema 26. ¿Cuántos electrones tiene cada ion, en el orden del
          enunciado?
        respuesta:
          tipo: vector
          valor: '(18, 25, 54, 23, 10, 21)'
          tolerancia: 0.001
          formato: los seis números en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(24, 29, 52, 27, 4, 27)'
            mensaje: |
              Has aplicado las cargas al revés. El Sc³⁺ ha perdido tres
              electrones, $21 - 3 = 18$, y el N³⁻ ha ganado tres,
              $7 + 3 = 10$.
          - valor: '(21, 27, 53, 25, 7, 24)'
            mensaje: |
              Esos son los protones de cada ion, los números atómicos. Falta
              aplicar la carga para tener los electrones.
        pista: |
          Como en el 25: Z menos la carga, con su signo.
        desarrollo: |
          | | Sc³⁺ | Co²⁺ | I⁻ | Mn²⁺ | N³⁻ | Cr³⁺ |
          |---|---|---|---|---|---|---|
          | protones, Z | 21 | 27 | 53 | 25 | 7 | 24 |
          | electrones | 18 | 25 | 54 | 23 | 10 | 21 |

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los protones de un ion son los de su elemento, el número atómico:
              la carga no los toca.
          - texto: >-
              Los electrones son Z menos la carga: un catión tiene menos
              electrones que protones y un anión, más.
          - texto: >-
              Así, el Fe³⁺ tiene 26 protones y 23 electrones, y el P³⁻, 15
              protones y 18 electrones.
          - texto: >-
              Varios iones de las dos listas acaban con los mismos electrones:
              P³⁻, Cl⁻ y Sc³⁺ con 18, O²⁻ y N³⁻ con 10, Fe³⁺ y Mn²⁺ con 23.
          - texto: >-
              Como el Fe³⁺ ha perdido tres cargas, tiene tres protones menos
              que el hierro.
            trampa: true
            mensaje: |
              Ha perdido tres **electrones**. Con tres protones menos ya no
              sería hierro, sería vanadio. La carga positiva sale de que ahora
              los 26 protones solo tienen 23 electrones enfrente.
        veredicto: |
          Protones, el número atómico; electrones, el número atómico menos la
          carga. La carga nunca toca el núcleo.

    resolucion: |
      **La regla.** Un ion es un átomo con electrones de más o de menos. Los
      protones no cambian —son Z, lo que dice qué elemento es— y los
      electrones son

      $$
      e^{-} = Z - q
      $$

      con $q$ la carga con su signo: $+3$ en el Fe³⁺, $-2$ en el O²⁻.

      **25.**

      | ion | protones | electrones |
      |---|---|---|
      | Rb⁺ | 37 | 36 |
      | Ba²⁺ | 56 | 54 |
      | Sn²⁺ | 50 | 48 |
      | Fe³⁺ | 26 | 23 |
      | O²⁻ | 8 | 10 |
      | P³⁻ | 15 | 18 |
      | Cl⁻ | 17 | 18 |

      **26.**

      | ion | protones | electrones |
      |---|---|---|
      | Sc³⁺ | 21 | 18 |
      | Co²⁺ | 27 | 25 |
      | I⁻ | 53 | 54 |
      | Mn²⁺ | 25 | 23 |
      | N³⁻ | 7 | 10 |
      | Cr³⁺ | 24 | 21 |

      **Lo que se ve al juntar las dos listas.** Muchos acaban con el mismo
      número de electrones: P³⁻, Cl⁻ y Sc³⁺ tienen los 18 del argón; O²⁻ y
      N³⁻, los 10 del neón; Ba²⁺ e I⁻, los 54 del xenón; Fe³⁺ y Mn²⁺, 23
      cada uno, y además la misma configuración, $[\mathrm{Ar}]\,3d^{5}$,
      porque los dos pierden primero sus $4s$. Son series isoelectrónicas, y
      dentro de cada una el radio iónico lo ordena el número de protones.

  - id: colfq2-p27-28-de-la-configuracion-al-elemento
    titulo: Cuatro configuraciones con una abreviatura rota, y el elemento 28 con sus iones
    fuente: >-
      Problemas propuestos 27 y 28 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra. En el 27 las tres
      configuraciones largas escriben «2s²p⁶» por «2s²2p⁶», y la primera
      abrevia «(Ar) 4s¹» donde tendría que decir «(Ar) 3d⁵4s¹».
    nivel: practica
    enunciado: |
      **27.** Dadas las siguientes configuraciones electrónicas, indicar a qué
      elementos corresponden, además de periodo, grupo y tipo de elemento.

      1s²2s²p⁶3s²3p⁶3d⁵4s¹ = (Ar) 4s¹

      1s²2s²p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁴= (Kr) 4d¹⁰5s²5p⁴

      1s²2s²p⁶3s²3p⁶3d⁵4s² = (Ar) 3d⁵4s²

      (Rn) 6d¹7s²

      **28.** a) Dado el elemento ₂₈E dar la configuración electrónica, grupo y
      periodo al que pertenece e identificar el elemento.

      b) ¿Qué iones estables puede formar? Dar la configuración electrónica
      de los iones que puede formar.

      *En las tres configuraciones largas del 27 falta el 2 de «2p⁶»: es así
      en el original. Y la primera abreviatura, «(Ar) 4s¹», se ha comido el
      3d⁵: la forma larga suma 24 electrones y «(Ar) 4s¹» solo 19.*
    pide: El elemento, el periodo, el grupo y el tipo de las cuatro configuraciones del 27, y la configuración, el grupo, el periodo, el nombre y los iones del elemento 28.

    pasos:
      - tipo: reconocer
        pregunta: |
          La primera línea del 27 dice
          $1s^{2}2s^{2}p^{6}3s^{2}3p^{6}3d^{5}4s^{1} = (\mathrm{Ar})\ 4s^{1}$.
          ¿Qué pasa con esa igualdad?
        opciones:
          - texto: >-
              A la forma abreviada le falta el $3d^{5}$: $(\mathrm{Ar})\,4s^{1}$
              son 19 electrones, el potasio, y la larga suma 24, el cromo
            correcta: true
            mensaje: |
              Eso es. El argón son 18 electrones, $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}$,
              sin ningún $3d$: todo lo que va después hay que escribirlo. La
              abreviatura correcta es $(\mathrm{Ar})\,3d^{5}4s^{1}$, como la de
              la tercera línea. Es una errata del original, y manda la forma
              larga, que está completa.
          - texto: Son iguales, porque el $(\mathrm{Ar})$ ya incluye el $3d^{5}$
            mensaje: |
              El argón tiene 18 electrones y ninguno en el $3d$: su
              configuración acaba en $3p^{6}$. Lo que el paréntesis abrevia es
              el gas noble anterior, y nada más.
          - texto: >-
              La buena es la corta: es el potasio, y la larga tiene un $3d^{5}$
              de más
            mensaje: |
              La forma larga es la completa y la que se puede comprobar
              sumando: 24. Y además es la configuración real del cromo, con su
              excepción. Una abreviatura se deduce de la larga, no al revés.
          - texto: >-
              La larga está mal: por Moeller tendría que ser $3d^{4}4s^{2}$
            mensaje: |
              Moeller da $3d^{4}4s^{2}$, pero el cromo real es $3d^{5}4s^{1}$:
              un electrón del $4s$ pasa al $3d$ para dejarlo a medio llenar. La
              forma larga está bien; la errata es la abreviatura.

      - tipo: calcular
        titulo: Los cuatro números atómicos del 27
        pregunta: |
          ¿Qué número atómico tiene cada configuración del 27, en su orden?
        respuesta:
          tipo: vector
          valor: '(24, 52, 25, 89)'
          tolerancia: 0.001
          formato: los cuatro números atómicos en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(19, 52, 25, 89)'
            mensaje: |
              Te has fiado de la abreviatura rota de la primera línea,
              $(\mathrm{Ar})\,4s^{1}$, que es el potasio. La forma larga suma
              24: con el $3d^{5}$ que la abreviatura se ha comido, es el
              cromo.
          - valor: '(24, 52, 25, 91)'
            mensaje: |
              En la última has contado el radio, 88, en vez del radón, 86. Rn
              es el radón, el gas noble del periodo 6; Ra es el radio, un
              alcalinotérreo. Entre paréntesis solo se abrevian gases nobles.
        pista: |
          Ar = 18, Kr = 36, Rn = 86. Suma lo que va detrás, y en la primera
          línea usa la forma larga.
        desarrollo: |
          | configuración | $Z$ | elemento |
          |---|---|---|
          | $(\mathrm{Ar})\,3d^{5}4s^{1}$ | $18 + 6 = 24$ | cromo |
          | $(\mathrm{Kr})\,4d^{10}5s^{2}5p^{4}$ | $36 + 16 = 52$ | teluro |
          | $(\mathrm{Ar})\,3d^{5}4s^{2}$ | $18 + 7 = 25$ | manganeso |
          | $(\mathrm{Rn})\,6d^{1}7s^{2}$ | $86 + 3 = 89$ | actinio |

      - tipo: calcular
        titulo: Los cuatro periodos del 27
        pregunta: |
          ¿En qué periodo está cada uno, en el mismo orden?
        respuesta:
          tipo: vector
          valor: '(4, 5, 4, 7)'
          tolerancia: 0.001
          formato: los cuatro periodos en el orden del enunciado, entre paréntesis y separados por comas
        distractores:
          - valor: '(3, 5, 3, 6)'
            mensaje: |
              Has tomado el $n$ del electrón diferenciador: $3d$ en el cromo y
              el manganeso, $6d$ en el actinio. El periodo es el nivel más alto
              ocupado: el $4s$ en los dos primeros, el $7s$ en el actinio.
          - valor: '(4, 5, 4, 6)'
            mensaje: |
              En el actinio has tomado el $n$ del $6d$. El $7s^{2}$ ya está
              ocupado, así que el periodo es el 7.
        pista: |
          El $n$ más alto que aparece en cada una.
        desarrollo: |
          El $n$ más alto es 4 ($4s$), 5 ($5p$), 4 ($4s$) y 7 ($7s$).

      - tipo: reconocer
        pregunta: |
          ¿Y los grupos del 27, en el mismo orden?
        opciones:
          - texto: 6B, 6A, 7B y 3B
            correcta: true
            mensaje: |
              Eso es. En los de transición se cuentan los $d$ más el $s$ de
              fuera: $3d^{5}4s^{1}$ son seis, $3d^{5}4s^{2}$ siete y
              $6d^{1}7s^{2}$ tres. En el teluro, representativo, los del nivel
              más alto: $5s^{2}5p^{4}$, seis.
          - texto: 1A, 6A, 2A y 2A
            mensaje: |
              Has mirado solo el $s$ de fuera en los tres de transición. El
              cromo no es un alcalino ni el manganeso un alcalinotérreo: sus
              electrones $d$ también son de valencia.
          - texto: 5B, 6A, 5B y 1B
            mensaje: |
              Has contado solo los electrones $d$. En un elemento de transición
              el grupo cuenta los $d$ **y** los $s$ de fuera: el cromo tiene
              $5 + 1 = 6$, el manganeso $5 + 2 = 7$ y el actinio $1 + 2 = 3$.
              Y un solo electrón $d$ no da el 1B: el 1B es la columna 11, la
              del cobre, con once electrones de valencia, $d^{10}s^{1}$.
          - texto: 6B, 4A, 7B y 3B
            mensaje: |
              En el teluro has contado solo los cuatro $5p$. En un
              representativo cuenta todo el nivel más alto, $5s^{2}5p^{4}$:
              seis, el 6A, debajo del selenio.

      - tipo: reconocer
        pregunta: |
          Problema 28 a). ¿Configuración, periodo, grupo y nombre del elemento
          ₂₈E?
        opciones:
          - texto: $[\mathrm{Ar}]\,3d^{8}4s^{2}$, periodo 4, grupo 8B, el níquel
            correcta: true
            mensaje: |
              Eso es. Ocho electrones $3d$ más dos $4s$ son diez, que es la
              columna 10: en la notación A/B de la colección, la 8B, que
              abarca las columnas 8, 9 y 10 (hierro, cobalto y níquel).
          - texto: $[\mathrm{Ar}]\,3d^{10}$, periodo 3, grupo 8B, el níquel
            mensaje: |
              Has llenado el $3d$ antes del $4s$, como si los niveles se
              completaran por orden. El $4s$ entra antes que el $3d$, así que
              el níquel tiene $4s^{2}$ y está en el periodo 4.
          - texto: $[\mathrm{Ar}]\,3d^{8}4s^{2}$, periodo 4, grupo 2A, el calcio
            mensaje: |
              Has leído el grupo en el $4s^{2}$ como si fuera representativo.
              El calcio, $Z = 20$, no tiene electrones $3d$; con ocho $3d$ el
              elemento es de transición y los $d$ entran en la cuenta del
              grupo.
          - texto: $[\mathrm{Ar}]\,3d^{8}4s^{2}$, periodo 3, grupo 8B, el níquel
            mensaje: |
              Has tomado el periodo del $3d$, que es donde entra el último
              electrón. El periodo es el nivel más alto ocupado, y el níquel
              tiene el $4s$ lleno: periodo 4.

      - tipo: calcular
        titulo: El 3d de los dos iones del níquel
        pregunta: |
          Problema 28 b). El níquel forma Ni²⁺ y Ni³⁺. ¿Cuántos electrones
          $3d$ tiene cada uno?
        respuesta:
          tipo: vector
          valor: '(8, 7)'
          tolerancia: 0.001
          formato: los electrones 3d del Ni²⁺ y del Ni³⁺, en ese orden, entre paréntesis y separados por comas
        distractores:
          - valor: '(6, 5)'
            mensaje: |
              Has quitado los electrones del $3d$, por ser los últimos en
              entrar. Los cationes pierden primero los más externos, los dos
              $4s$: el Ni²⁺ conserva sus ocho $3d$ y el Ni³⁺ pierde uno.
          - valor: '(7, 6)'
            mensaje: |
              Has repartido: un $4s$ y el resto del $3d$. No hay reparto: se
              vacía entero el $4s$ y solo después se toca el $3d$.
        pista: |
          Primero salen los dos $4s$; el tercero, si hace falta, del $3d$.
        desarrollo: |
          $$
          \mathrm{Ni^{2+}}:\ [\mathrm{Ar}]\,3d^{8} \qquad \mathrm{Ni^{3+}}:\ [\mathrm{Ar}]\,3d^{7}
          $$

          El Ni²⁺ es el ion habitual del níquel, el del problema resuelto 6;
          el Ni³⁺ es el del propuesto 22.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera configuración del 27 suma 24 en su forma larga: es el
              cromo, periodo 4, grupo 6B, de transición, con su excepción
              $3d^{5}4s^{1}$.
          - texto: >-
              La segunda es el teluro, 52, periodo 5, grupo 6A,
              representativo; la tercera, el manganeso, 25, periodo 4, grupo
              7B, de transición.
          - texto: >-
              $(\mathrm{Rn})\,6d^{1}7s^{2}$ es el actinio, 89, periodo 7, y su
              último electrón es un $d$: grupo 3B.
          - texto: >-
              El 28 es el níquel, $[\mathrm{Ar}]\,3d^{8}4s^{2}$; sus iones
              pierden primero los $4s$: Ni²⁺ $3d^{8}$ y Ni³⁺ $3d^{7}$.
          - texto: >-
              La primera configuración es el potasio, porque su abreviatura es
              $(\mathrm{Ar})\,4s^{1}$.
            trampa: true
            mensaje: |
              La abreviatura está rota: se ha comido el $3d^{5}$. La forma larga,
              que es la que se puede sumar, da 24 electrones. Ante una
              igualdad que no cuadra, manda la que se puede comprobar.
        veredicto: |
          Se suma la forma larga, el periodo sale del $n$ más alto y el grupo
          de los electrones de valencia, con los $d$ incluidos en los de
          transición.

    resolucion: |
      **27 · Cuatro configuraciones.**

      | configuración | $Z$ | elemento | periodo | grupo | tipo |
      |---|---|---|---|---|---|
      | $(\mathrm{Ar})\,3d^{5}4s^{1}$ | 24 | Cr | 4 | 6B | de transición |
      | $(\mathrm{Kr})\,4d^{10}5s^{2}5p^{4}$ | 52 | Te | 5 | 6A | representativo |
      | $(\mathrm{Ar})\,3d^{5}4s^{2}$ | 25 | Mn | 4 | 7B | de transición |
      | $(\mathrm{Rn})\,6d^{1}7s^{2}$ | 89 | Ac | 7 | 3B | de transición |

      **Las dos erratas del enunciado.** En las tres formas largas pone
      «2s²p⁶» por «2s²2p⁶», sin efecto en la cuenta. Y la primera abreviatura,
      «(Ar) 4s¹», se ha comido el $3d^{5}$: la larga suma 24 y la corta 19. La
      larga es la que manda, porque es la completa y además es la
      configuración real del cromo, con su excepción.

      **El actinio.** Con el criterio del problema resuelto 8 —el tipo lo da
      el subnivel que se está llenando— el $6d^{1}$ lo hace de transición,
      grupo 3B, debajo del lantano. Es también el primero de la serie de los
      actínidos, y hay tablas que lo ponen con ellos, en la transición
      interna.

      **28 · El elemento 28.** $[\mathrm{Ar}]\,3d^{8}4s^{2}$: periodo 4,
      grupo 8B —la columna 10—, el **níquel**. Sus iones pierden primero los
      $4s$:

      $$
      \mathrm{Ni^{2+}}:\ 1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{8}
      \qquad
      \mathrm{Ni^{3+}}:\ 1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{7}
      $$

      El Ni²⁺ es el más estable. Un metal de transición no busca la
      configuración del gas noble —el níquel tendría que perder diez
      electrones—, así que la regla del «camino corto» de los representativos
      no sirve aquí: sus iones salen de vaciar el $4s$ y, a veces, algún $3d$.

  - id: colfq2-p29-35-el-salto-que-dice-el-grupo
    titulo: Cuatro energías de ionización, el salto que dice el grupo, y el hierro excitado
    fuente: >-
      Problemas propuestos 29 y 35 · Problemas resueltos y propuestos del
      tema 2, Estructura atómica · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no
      publica solución: la respuesta es nuestra. El 29 escribe «a que grupo»,
      sin tilde.
    nivel: practica
    enunciado: |
      **29.** a) Definir energía de ionización.

      b) Las cuatro primeras energías de ionización de un elemento son: 578,
      1817, 2745 y 11577 kJ mol⁻¹ respectivamente, indicar a que grupo de la
      tabla periódica pertenece dicho elemento.

      **35.** Indicar si las siguientes afirmaciones son verdaderas o falsas:

      a) Las cuatro primeras energías de ionización de un elemento X son 801,
      2430, 3660 y 25000 kJ mol⁻¹ respectivamente. Se trata de un elemento del
      grupo segundo de la tabla periódica.

      b) Las configuraciones: 1s²2s²2p⁶3s²3p⁶3d⁶4s² y 1s²2s²2p⁶3s²3p⁶3d⁶4s¹4p¹
      corresponden al mismo elemento.

      *En el 29, «a que grupo» va sin tilde en el original.*
    pide: La definición de energía de ionización, el grupo del elemento del 29, y si son verdaderas las dos afirmaciones del 35.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una serie de energías de ionización sucesivas, ¿dónde se lee el
          grupo del elemento?
        opciones:
          - texto: >-
              En el salto mucho mayor que los demás: los electrones que salen
              antes del salto son los de valencia
            correcta: true
            mensaje: |
              Eso es. Cada ionización cuesta más que la anterior, pero mientras
              salen electrones de valencia el aumento es moderado. Cuando toca
              romper la capa completa de debajo, el coste se dispara. Contando
              las ionizaciones de antes del salto se cuentan los electrones de
              valencia, y con ellos el grupo.
          - texto: 'En la primera energía: cuanto más baja, más a la izquierda'
            mensaje: |
              La primera energía da una idea de la posición, pero no el grupo:
              el galio tiene la primera más baja que el magnesio y está más a
              la derecha, como se ve en el problema resuelto 11. El salto de la
              serie, en cambio, lo dice sin ambigüedad.
          - texto: 'En cuántas energías da el enunciado: cuatro energías, grupo 4A'
            mensaje: |
              El enunciado da cuatro porque con cuatro basta para ver el salto,
              no porque el elemento tenga cuatro electrones de valencia. Si el
              salto está entre la tercera y la cuarta, tiene tres.

      - tipo: calcular
        titulo: Los electrones de valencia del 29
        pregunta: |
          Problema 29 b). ¿Cuántos electrones de valencia tiene el elemento?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Has visto el salto entre la primera y la segunda, que triplica.
              Pero la cuarta es más de cuatro veces la tercera y está en otra
              escala: de 2745 a 11577 hay 8832 kJ mol⁻¹, más de siete veces el
              salto de 578 a 1817. El grande es ese.
          - valor: '4'
            mensaje: |
              Has contado las cuatro energías que da el enunciado. La cuarta es
              justo la que ya no es de valencia: su electrón sale de una capa
              completa, y por eso cuesta cuatro veces más que la tercera.
        pista: |
          Divide cada energía entre la anterior y busca el cociente que se
          sale.
        desarrollo: |
          $$
          \frac{1817}{578} = 3{,}14 \qquad \frac{2745}{1817} = 1{,}51 \qquad \frac{11577}{2745} = 4{,}22
          $$

          El salto está entre la tercera y la cuarta, y en valor absoluto se
          ve todavía mejor: 1239, 928 y 8832 kJ mol⁻¹. Salen tres electrones
          con un coste moderado y el cuarto ya es de una capa completa: **tres
          electrones de valencia, grupo 3A**. Son las energías del aluminio,
          $[\mathrm{Ne}]\,3s^{2}3p^{1}$.

      - tipo: calcular
        titulo: Los electrones de valencia del X del 35
        pregunta: |
          Problema 35 a). Con 801, 2430, 3660 y 25000 kJ mol⁻¹, ¿cuántos
          electrones de valencia tiene X?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Es lo que afirma el enunciado, y por eso es la trampa. El salto
              de la primera a la segunda triplica, pero de la tercera a la
              cuarta se multiplica casi por siete: el salto grande está después
              del **tercer** electrón.
          - valor: '4'
            mensaje: |
              Has contado las cuatro energías. La cuarta ya rompe la capa
              completa: 25000 frente a 3660.
        pista: |
          Los mismos cocientes que en el 29.
        desarrollo: |
          $$
          \frac{2430}{801} = 3{,}03 \qquad \frac{3660}{2430} = 1{,}51 \qquad \frac{25000}{3660} = 6{,}83
          $$

          Tres electrones de valencia: grupo 3A, no el segundo. **La
          afirmación a es falsa.** Son las energías del boro,
          $1s^{2}2s^{2}2p^{1}$, que está encima del aluminio del 29.

      - tipo: reconocer
        pregunta: |
          Problema 35 b). $\ldots 3d^{6}4s^{2}$ y $\ldots 3d^{6}4s^{1}4p^{1}$,
          ¿son del mismo elemento?
        opciones:
          - texto: >-
              Verdadero: las dos tienen 26 electrones; la primera es el hierro
              en su estado fundamental y la segunda, el hierro excitado
            correcta: true
            mensaje: |
              Eso es. El elemento lo dicen los electrones de un átomo neutro, y
              los dos suman 26. En la segunda un electrón del $4s$ ha subido al
              $4p$ absorbiendo energía: es un estado excitado, perfectamente
              posible.
          - texto: 'Falso: tienen configuraciones distintas, así que son elementos distintos'
            mensaje: |
              Un mismo átomo puede tener muchas configuraciones, una
              fundamental y muchas excitadas. Lo que no cambia es el número de
              electrones, y aquí los dos tienen 26.
          - texto: 'Falso: la segunda es imposible, porque deja el $4s$ a medio llenar'
            mensaje: |
              Imposible es meter en un subnivel más electrones de los que
              caben, y aquí no pasa. Dejar el $4s$ con uno y ocupar el $4p$ es
              un estado excitado.
          - texto: Verdadero, y las dos son el estado fundamental del hierro
            mensaje: |
              Son el mismo elemento, pero solo la primera es fundamental. En la
              segunda un electrón ocupa el $4p$ cuando todavía cabe en el
              $4s$.

      - tipo: redactar
        que: definicion
        consigna: |
          Problema 29 a). En papel, como la entregarías en el examen: **la
          definición de energía de ionización**, con la ecuación del proceso.
          Tres o cuatro líneas.
        rubrica:
          - punto: |
              **Es la energía mínima necesaria para arrancar un electrón** de
              un átomo.
            porque: |
              Es el núcleo de la definición. «Mínima» importa: se arranca el
              electrón más débilmente unido, el más externo, y sin darle
              energía cinética de sobra.
            minimo: true
          - punto: |
              **El átomo está aislado, en estado gaseoso**, y en su estado
              fundamental.
            porque: |
              En un sólido o en una disolución el átomo interacciona con sus
              vecinos y la energía sería otra. La definición se refiere al
              átomo solo.
            minimo: true
          - punto: |
              **La ecuación**: $\mathrm{X(g)} \rightarrow \mathrm{X^{+}(g)} + e^{-}$.
            porque: |
              Deja escrito de una vez que es gas, que sale un solo electrón y
              que queda un catión.
          - punto: |
              **Las sucesivas**: la segunda arranca un electrón del
              $\mathrm{X^{+}}$, la tercera del $\mathrm{X^{2+}}$, y cada una es
              mayor que la anterior.
            porque: |
              Es lo que usa el apartado b. Sin esta idea el salto de la serie
              no se puede interpretar.
          - punto: |
              **Las unidades**: kJ mol⁻¹ si es por mol, o eV o J si es por
              átomo; y es siempre positiva, porque cuesta energía.
            porque: |
              Las cuatro energías del apartado b vienen en kJ mol⁻¹, y un
              signo negativo diría que el átomo suelta el electrón por sí solo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada energía de ionización es mayor que la anterior, pero el
              aumento se dispara cuando el electrón que sale rompe una capa
              completa.
          - texto: >-
              En el 29 el salto está entre la tercera y la cuarta, 2745 y
              11577: tres electrones de valencia, grupo 3A.
          - texto: >-
              En el 35 a el salto también está después de la tercera, 3660 y
              25000: grupo 3A, así que la afirmación es falsa.
          - texto: >-
              Las dos configuraciones del 35 b suman 26 electrones: son el
              hierro fundamental y el hierro excitado. Verdadera.
          - texto: >-
              En el 35 a el salto grande es de la primera a la segunda, que
              triplica: un electrón de valencia, grupo 1A.
            trampa: true
            mensaje: |
              Triplicar parece mucho hasta que se mira el último cociente:
              25000 entre 3660 es casi siete. El salto que cuenta es el que se
              sale de la serie, y ese está después del tercer electrón.
        veredicto: |
          En una serie de ionizaciones se buscan los cocientes y se cuenta
          cuántos electrones salen antes del que se dispara.

    resolucion: |
      **29 a · La definición.** La energía de ionización es la energía mínima
      necesaria para arrancar el electrón más débilmente unido de un átomo
      aislado, en estado gaseoso y en su estado fundamental:

      $$
      \mathrm{X(g)} \rightarrow \mathrm{X^{+}(g)} + e^{-}
      $$

      La segunda arranca un electrón del $\mathrm{X^{+}}$, la tercera del
      $\mathrm{X^{2+}}$, y cada una es mayor que la anterior.

      **29 b y 35 a · El salto.** Mientras salen electrones de valencia, cada
      ionización cuesta más que la anterior, y a veces bastante más: en el
      29 la segunda triplica la primera. Cuando toca romper la capa completa
      de debajo, el coste se dispara. Basta con dividir cada energía entre la
      anterior:

      | | $EI_2/EI_1$ | $EI_3/EI_2$ | $EI_4/EI_3$ | electrones de valencia | grupo |
      |---|---|---|---|---|---|
      | 29 | 3,14 | 1,51 | **4,22** | 3 | 3A |
      | 35 a | 3,03 | 1,51 | **6,83** | 3 | 3A |

      En los dos el salto está después del tercer electrón: grupo 3A. El del
      29 es el aluminio y el del 35, el boro. La afirmación 35 a, que dice
      grupo segundo, es **falsa**.

      **35 b · El hierro dos veces.** Las dos configuraciones suman 26
      electrones: son el mismo elemento, el hierro. La primera es su estado
      fundamental; en la segunda un electrón $4s$ ha subido al $4p$, que es un
      estado excitado. La afirmación es **verdadera**.

      **Dónde se tuerce.** El primer cociente, que triplica, parece un salto y
      engaña; el enunciado del 35 a está escrito para eso. La regla no es
      «el primer salto grande», sino «el cociente que se sale de la serie».

  - id: colfq2-p30-calcio-selenio-y-cromo
    titulo: Calcio, selenio y cromo, sus iones y su afinidad electrónica
    fuente: >-
      Problema propuesto 30 · Problemas resueltos y propuestos del tema 2,
      Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no publica
      solución: la respuesta es nuestra. La afinidad electrónica se toma como
      la energía que se desprende al captar el electrón, positiva cuanto más
      favorable.
    nivel: practica
    enunciado: |
      Dados los elementos ₂₀A, ₃₄B y ₂₄C indicar:

      a) Configuración electrónica de los átomos neutros y de los iones más
      estables que pueda formar.

      b) Grupo y periodo al que pertenecen.

      c) Identificar los elementos.

      d) Definir afinidad electrónica y ordenar los elementos en orden
      creciente de su afinidad electrónica. Justificar la respuesta.
    pide: Las configuraciones de los tres átomos y de sus iones, su grupo, su periodo y su nombre, y el orden creciente de su afinidad electrónica.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de ordenar nada. ¿Qué mide la afinidad electrónica?
        opciones:
          - texto: >-
              La energía que se desprende cuando un átomo aislado, en estado
              gaseoso, capta un electrón
            correcta: true
            mensaje: |
              Eso es: $\mathrm{X(g)} + e^{-} \rightarrow \mathrm{X^{-}(g)}$. Es
              la pareja de la energía de ionización, pero al revés: aquella mide
              lo que cuesta **sacar** un electrón y esta lo que se gana al
              **meterlo**.
          - texto: La energía necesaria para arrancar un electrón al átomo
            mensaje: |
              Esa es la energía de ionización, el proceso contrario. La
              afinidad electrónica es lo que pasa cuando el electrón entra.
          - texto: La fuerza con que un átomo atrae los electrones de un enlace
            mensaje: |
              Esa es la electronegatividad, que habla de un átomo enlazado. La
              afinidad electrónica es una energía medida sobre el átomo aislado
              que capta un electrón libre.

      - tipo: calcular
        titulo: Los electrones de los iones del A y del B
        pregunta: |
          A y B forman iones con la configuración de un gas noble. ¿Cuántos
          electrones tiene el ion del A y cuántos el del B?
        respuesta:
          tipo: vector
          valor: '(18, 36)'
          tolerancia: 0.001
          formato: los electrones del ion de A y del ion de B, en ese orden, entre paréntesis y separados por comas
        distractores:
          - valor: '(22, 32)'
            mensaje: |
              Has aplicado las cargas al revés. El A, $[\mathrm{Ar}]\,4s^{2}$,
              **pierde** sus dos $4s$: le quedan 18. El B gana dos para
              completar el $4p$: 36.
          - valor: '(18, 28)'
            mensaje: |
              Al B le has quitado sus seis electrones de la capa 4. Le cuesta
              mucho menos ganar dos y completar el $4p^{6}$: el ion del B es el
              B²⁻, con 36.
        pista: |
          A es $[\mathrm{Ar}]\,4s^{2}$ y B es $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{4}$.
          Cada uno llega al gas noble por el camino más corto.
        desarrollo: |
          $$
          \mathrm{A^{2+}}:\ 20 - 2 = 18 \qquad \mathrm{B^{2-}}:\ 34 + 2 = 36
          $$

          El A²⁺ queda como el argón y el B²⁻ como el kriptón.

      - tipo: calcular
        titulo: El nivel 4 del cromo
        pregunta: |
          C es el cromo, $Z = 24$. ¿Cuántos electrones tiene en el nivel 4?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Es lo que da Moeller, $3d^{4}4s^{2}$, y el cromo no lo cumple: un
              electrón del $4s$ pasa al $3d$ para dejarlo a medio llenar,
              $3d^{5}4s^{1}$. Es la excepción más conocida de la tabla, con la
              del cobre.
          - valor: '6'
            mensaje: |
              Has sumado los $3d$. Esos seis electrones, $3d^{5}4s^{1}$, son los
              de valencia y dan el grupo, 6B, pero el $3d$ es del nivel 3: en el
              nivel 4 solo está el $4s^{1}$.
        pista: |
          El cromo es una de las dos excepciones del periodo 4.
        desarrollo: |
          $$
          \mathrm{Cr}:\ 1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{5}4s^{1}
          $$

          Un solo electrón en el nivel 4. Seis de valencia, contando los $3d$:
          grupo 6B.

      - tipo: reconocer
        pregunta: |
          b) ¿Grupo y periodo de cada uno?
        opciones:
          - texto: Los tres en el periodo 4; A en el grupo 2A, B en el 6A y C en el 6B
            correcta: true
            mensaje: |
              Eso es. El A tiene dos electrones de valencia, $4s^{2}$; el B seis
              en el nivel 4, $4s^{2}4p^{4}$, y es representativo porque su
              $3d^{10}$ está completo; el C tiene seis contando los $d$,
              $3d^{5}4s^{1}$, y es de transición.
          - texto: Los tres en el periodo 4; A en el 2A, B en el 6A y C en el 1A
            mensaje: |
              Has leído el grupo del cromo en su $4s^{1}$, como si fuera un
              alcalino. Sus cinco electrones $3d$ también son de valencia: grupo
              6B.
          - texto: Los tres en el periodo 4; A en el 2A, B en el 6B y C en el 6A
            mensaje: |
              Están cambiados B y C. El B tiene el $3d^{10}$ completo y llena el
              $4p$: es representativo, 6A. El que llena el $3d$ es el C: 6B.
          - texto: A y B en el periodo 4 y C en el 3, por su $3d$
            mensaje: |
              El periodo es el nivel más alto ocupado, y el cromo tiene un
              electrón en el $4s$: periodo 4, como los otros dos.

      - tipo: reconocer
        pregunta: |
          d) Con la afinidad electrónica como energía desprendida, ¿cuál es el
          orden creciente?
        opciones:
          - texto: Ca < Cr < Se
            correcta: true
            mensaje: |
              Eso es. Al selenio le faltan dos electrones para cerrar el $4p$,
              y el que entra lo acerca a completarlo: se desprende mucha
              energía. Al cromo el electrón le entra en el $4s^{1}$ y lo cierra
              en $4s^{2}$: algo se gana. Al calcio el $4s^{2}$ ya está lleno y
              el electrón tiene que ir a un subnivel nuevo: casi no se gana
              nada.
          - texto: Se < Cr < Ca
            mensaje: |
              Con la afinidad como energía desprendida, que es como la pide la
              pregunta, está al revés: el selenio es el que más energía
              desprende al captar un electrón y el calcio casi nada. Pero si tu
              profesor da la afinidad con el signo de la entalpía, negativa
              cuanto más favorable, este es justo el orden creciente de los
              valores, porque el del selenio es el más negativo. Por eso, en el
              examen, di qué convenio usas.
          - texto: Ca < Se < Cr
            mensaje: |
              El $3d^{5}$ a medio llenar del cromo no capta: resiste. El
              electrón que entra va al $4s^{1}$, y eso desprende bastante menos
              que completar casi el $4p$ del selenio.

      - tipo: redactar
        que: definicion
        consigna: |
          d) En papel, como la entregarías en el examen: **la definición de
          afinidad electrónica**, con la ecuación del proceso. Tres líneas.
        rubrica:
          - punto: |
              **Es la energía que se intercambia cuando un átomo capta un
              electrón**, y se toma como desprendida.
            porque: |
              Es el núcleo de la definición, y conviene decir el convenio de
              signo: con él, «mayor afinidad» es «se desprende más energía».
            minimo: true
          - punto: |
              **El átomo está aislado, en estado gaseoso**, y en su estado
              fundamental.
            porque: |
              Como la energía de ionización, se define para el átomo solo, sin
              vecinos que cambien el resultado.
            minimo: true
          - punto: |
              **La ecuación**: $\mathrm{X(g)} + e^{-} \rightarrow \mathrm{X^{-}(g)}$.
            porque: |
              Deja claro que entra un solo electrón y que se forma un anión, y
              distingue el proceso del de la ionización.
          - punto: |
              **Con qué tiene que ver**: con a dónde va el electrón que entra.
              Se gana poco o nada si tiene que abrir un subnivel nuevo o entrar
              en uno a medio llenar; si entra en uno ya empezado, se gana más
              cuanto más carga efectiva siente, y en un mismo periodo esa carga
              crece hacia la derecha.
            porque: |
              Es lo que justifica el orden del apartado d. La afinidad no sigue
              una flecha limpia en la tabla, y la definición sola no basta para
              ordenar.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A es el calcio, $[\mathrm{Ar}]\,4s^{2}$, periodo 4 y grupo 2A;
              forma Ca²⁺, con la configuración del argón.
          - texto: >-
              B es el selenio, $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{4}$, periodo 4 y
              grupo 6A; forma Se²⁻, con la del kriptón.
          - texto: >-
              C es el cromo, $[\mathrm{Ar}]\,3d^{5}4s^{1}$, periodo 4 y grupo 6B.
          - texto: >-
              La afinidad sube de calcio a cromo y a selenio: el calcio tendría
              que abrir un subnivel nuevo, el cromo cierra su $4s$ y el selenio
              se acerca a completar el $4p$.
          - texto: >-
              El cromo forma Cr⁶⁺ porque, como los representativos, busca la
              configuración del gas noble más cercano.
            trampa: true
            mensaje: |
              La regla del gas noble es de los representativos. Un metal de
              transición forma sus iones vaciando el $4s$ y parte del $3d$, y el
              ion más estable del cromo es el Cr³⁺, $[\mathrm{Ar}]\,3d^{3}$. El
              cromo con estado +6 existe en compuestos como los cromatos, pero
              no como el ion más estable.
        veredicto: |
          Los tres en el mismo periodo, y la afinidad sube hacia la derecha,
          con la explicación de qué completa o qué abre el electrón que entra.

    resolucion: |
      **a, b y c · Los tres elementos.**

      | | configuración | ion más estable | periodo | grupo | elemento |
      |---|---|---|---|---|---|
      | ₂₀A | $[\mathrm{Ar}]\,4s^{2}$ | A²⁺, $[\mathrm{Ar}]$ | 4 | 2A | calcio |
      | ₃₄B | $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{4}$ | B²⁻, $[\mathrm{Kr}]$ | 4 | 6A | selenio |
      | ₂₄C | $[\mathrm{Ar}]\,3d^{5}4s^{1}$ | C³⁺, $[\mathrm{Ar}]\,3d^{3}$ | 4 | 6B | cromo |

      El calcio y el selenio forman el ion del gas noble más cercano. El
      cromo no: como metal de transición forma sus iones vaciando el $4s$ y
      parte del $3d$, y el más estable es el Cr³⁺ (también forma Cr²⁺,
      $[\mathrm{Ar}]\,3d^{4}$). Esa elección es nuestra: la colección no
      publica solución.

      **d · La afinidad electrónica** es la energía que se desprende cuando un
      átomo aislado en estado gaseoso capta un electrón,
      $\mathrm{X(g)} + e^{-} \rightarrow \mathrm{X^{-}(g)}$. En orden
      creciente:

      $$
      \mathrm{Ca} < \mathrm{Cr} < \mathrm{Se}
      $$

      Los tres están en el mismo periodo, y lo que decide es a dónde va el
      electrón que entra:

      - **calcio**: su $4s^{2}$ está lleno y el electrón tendría que abrir un
        subnivel nuevo; apenas se gana nada;
      - **cromo**: entra en el $4s^{1}$ y lo cierra en $4s^{2}$; algo se gana;
      - **selenio**: entra en el $4p^{4}$ y lo deja a uno de completarse; es el
        que más energía desprende.

      **Un aviso sobre el signo.** Hay textos que dan la afinidad con el signo
      de la entalpía del proceso, negativa cuando se desprende energía. Con
      ese convenio los valores del selenio son los más negativos y «creciente»
      se lee al revés. El orden de las tendencias es el mismo; lo que cambia
      es el signo con que se escribe, y conviene decir en el examen cuál se
      usa.

  - id: colfq2-p31-32-fluor-contra-calcio-bromo-contra-potasio
    titulo: Flúor contra calcio y bromo contra potasio, y quién gana en cada propiedad
    fuente: >-
      Problemas propuestos 31 y 32 · Problemas resueltos y propuestos del tema
      2, Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no publica
      solución: la respuesta es nuestra.
    nivel: practica
    enunciado: |
      **31.** Dados dos elementos de números atómicos 9 y 20 respectivamente,
      indicar:

      a) Configuración electrónica de cada uno.

      b) Grupo, periodo al que pertenecen e identificar los elementos.

      c) ¿Quién presentará mayor electronegatividad, mayor potencial de
      ionización, mayor afinidad electrónica? Razonar la respuesta.

      **32.** Dados los elementos A y B de número atómico 35 y 19
      respectivamente, indicar:

      a) Configuración electrónica de cada uno.

      b) Grupo, periodo al que pertenecen e identificar los elementos.

      c) ¿Quién presenta mayor electronegatividad, mayor potencial de
      ionización, mayor afinidad electrónica, mayor radio? Razonar la
      respuesta.
    pide: La configuración, el grupo, el periodo y el nombre de los cuatro elementos, y quién gana en cada propiedad dentro de cada pareja.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 31. El 9 es el flúor, $1s^{2}2s^{2}2p^{5}$ (periodo 2, grupo
          7A), y el 20 el calcio, $[\mathrm{Ar}]\,4s^{2}$ (periodo 4, grupo
          2A). No comparten ni grupo ni periodo. ¿Cómo se decide quién gana?
        opciones:
          - texto: >-
              Mirando los dos criterios a la vez: el flúor tiene el electrón de
              fuera en $n = 2$, más cerca, y más carga efectiva, y eso decide
              la electronegatividad y la ionización; la afinidad pide mirar
              además a dónde va el electrón que entra
            correcta: true
            mensaje: |
              Eso es. Cuando dos elementos no comparten grupo ni periodo se
              miran $n$ y $Z_{\text{ef}}$ juntos. Aquí los dos favorecen al
              flúor, que está más arriba **y** más a la derecha: gana en
              electronegatividad y en ionización. En la afinidad también gana,
              pero no solo por eso: al flúor le falta un electrón para cerrar el
              $2p$, y el del calcio tendría que abrir un subnivel nuevo. La
              afinidad no sigue las dos flechas: el cloro tiene más que el
              flúor, aunque esté debajo.
          - texto: >-
              No se puede decidir: las tendencias solo valen dentro de un grupo
              o de un periodo
            mensaje: |
              En electronegatividad y en ionización se puede casi siempre que
              las dos tendencias apunten al mismo lado: el flúor está más
              arriba y más a la derecha, y las dos flechas le dan la victoria
              de sobra. En esas dos, la duda de verdad aparece cuando un
              elemento está más arriba pero más a la izquierda. La afinidad es
              otra cosa, porque no sigue flechas limpias —el carbono tiene más
              que el nitrógeno, que está a su derecha—, y en ella se mira a
              dónde va el electrón que entra.
          - texto: >-
              Por el número de protones: el calcio tiene veinte y el flúor
              nueve, así que el calcio atrae más a sus electrones
            mensaje: |
              Los protones que cuentan son los que no tapan los electrones de
              dentro. Al electrón $4s$ del calcio le llegan 2,85; al $2p$ del
              flúor, 5,20, y además desde más cerca.

      - tipo: calcular
        titulo: La carga efectiva del flúor
        pregunta: |
          Con $(1s^{2})(2s^{2}2p^{5})$, ¿cuánto vale $Z_{\text{ef}}$ de un
          electrón $2p$ del flúor?
        respuesta:
          tipo: numero
          valor: '5.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '4.85'
            mensaje: |
              Si te ha salido 4,85, te has contado a ti mismo: en
              $(2s^{2}2p^{5})$ hay siete electrones, así que el que miramos
              tiene seis compañeros. Si te ha salido 4,90, has apantallado con
              $1{,}00$ los dos $1s$: para un electrón del nivel 2 son la capa
              $n-1$, y pesan $0{,}85$.
          - valor: '7'
            mensaje: |
              Es la cuenta ingenua, $9 - 2$: los dos $1s$ tapando del todo y los
              compañeros sin tapar nada. Los $1s$ están en la capa $n-1$ y tapan
              $0{,}85$ cada uno, y los seis compañeros $0{,}35$.
        pista: |
          Seis compañeros a $0{,}35$ y los dos $1s$, que son la capa $n-1$, a
          $0{,}85$.
        desarrollo: |
          $$
          S = 6 \times 0{,}35 + 2 \times 0{,}85 = 3{,}80 \qquad Z_{\text{ef}} = 9 - 3{,}80 = 5{,}20
          $$

      - tipo: calcular
        titulo: La carga efectiva del calcio
        pregunta: |
          Con $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(4s^{2})$, ¿cuánto vale
          $Z_{\text{ef}}$ de un electrón $4s$ del calcio?
        respuesta:
          tipo: numero
          valor: '2.85'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2.50'
            mensaje: |
              Te has contado a ti mismo: en $(4s^{2})$ el que miramos tiene un
              solo compañero.
          - valor: '1.65'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho de la capa 3. Es la capa
              $n-1$: pesan $0{,}85$.
          - valor: '2'
            mensaje: |
              Es la cuenta ingenua, $20 - 18$. Los ocho de la capa 3 tapan
              $0{,}85$, no $1{,}00$, y el compañero $4s$ también tapa algo.
        pista: |
          Un compañero, ocho en la capa 3 y diez más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 8 \times 0{,}85 + 10 \times 1{,}00 = 17{,}15 \qquad Z_{\text{ef}} = 20 - 17{,}15 = 2{,}85
          $$

      - tipo: reconocer
        pregunta: |
          Problema 31 c). ¿Quién tiene mayor electronegatividad, mayor
          potencial de ionización y mayor afinidad electrónica?
        opciones:
          - texto: El flúor en las tres
            correcta: true
            mensaje: |
              Eso es. Su electrón de fuera está en $n = 2$ y siente 5,20; el del
              calcio está en $n = 4$ y siente 2,85. Más cerca y más sujeto: atrae
              más los electrones del enlace, cuesta más arrancarle uno y gana
              más al captarlo, porque le falta uno para cerrar el $2p$.
          - texto: El flúor en electronegatividad y afinidad; el calcio en potencial de ionización
            mensaje: |
              El potencial de ionización es lo que cuesta arrancar un electrón,
              y al calcio le cuesta poco: su $4s$ está lejos y siente 2,85. Por
              eso el calcio forma Ca²⁺ con tanta facilidad. Aquí las tres las
              gana el flúor, aunque la afinidad no siempre va con las otras
              dos.
          - texto: El calcio en las tres, porque tiene más protones y más capas
            mensaje: |
              Más capas es más lejos del núcleo, y eso rebaja las tres. Y de sus
              veinte protones solo le llegan 2,85 al electrón de fuera.

      - tipo: calcular
        titulo: La carga efectiva del bromo
        pregunta: |
          Problema 32. El 35 es el bromo, $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{5}$.
          ¿Cuánto vale $Z_{\text{ef}}$ de un electrón $4p$?
        respuesta:
          tipo: numero
          valor: '7.60'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '7.25'
            mensaje: |
              Te has contado a ti mismo. En $(4s^{2}4p^{5})$ hay siete
              electrones: el que miramos tiene seis compañeros.
          - valor: '4.90'
            mensaje: |
              Has apantallado con $1{,}00$ los dieciocho del nivel 3, el $3d$
              incluido. Es la capa $n-1$: pesan $0{,}85$.
          - valor: '7'
            mensaje: |
              Es la cuenta ingenua, $35 - 28$, tapando del todo a los internos
              y nada con los compañeros.
        pista: |
          Seis compañeros, dieciocho en la capa 3 y diez más adentro. Es el
          ejemplo que dibuja la teoría del tema.
        desarrollo: |
          $$
          S = 6 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 27{,}40 \qquad Z_{\text{ef}} = 35 - 27{,}40 = 7{,}60
          $$

      - tipo: calcular
        titulo: La carga efectiva del potasio
        pregunta: |
          El 19 es el potasio, $[\mathrm{Ar}]\,4s^{1}$. ¿Cuánto vale
          $Z_{\text{ef}}$ de su electrón $4s$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '1.85'
            mensaje: |
              Te has contado a ti mismo. En $(4s^{1})$ no hay nadie más, y ese
              término vale cero.
          - valor: '1'
            mensaje: |
              Es la cuenta ingenua, $19 - 18$, o los ocho de la capa 3 a
              $1{,}00$. La capa $n-1$ pesa $0{,}85$.
        pista: |
          Ningún compañero, ocho en la capa 3 y diez más adentro.
        desarrollo: |
          $$
          S = 8 \times 0{,}85 + 10 \times 1{,}00 = 16{,}80 \qquad Z_{\text{ef}} = 19 - 16{,}80 = 2{,}20
          $$

      - tipo: reconocer
        pregunta: |
          Problema 32 c). El bromo y el potasio están los dos en el periodo 4.
          ¿Quién gana en cada propiedad?
        opciones:
          - texto: >-
              El bromo en electronegatividad, potencial de ionización y
              afinidad electrónica; el potasio en radio
            correcta: true
            mensaje: |
              Eso es. En el mismo periodo $n$ no distingue y manda
              $Z_{\text{ef}}$: 7,60 frente a 2,20. El bromo sujeta mucho más
              sus electrones, y por eso gana en las tres primeras y es más
              pequeño.
          - texto: El bromo en todo, radio incluido, porque tiene más electrones
            mensaje: |
              Más electrones en el mismo nivel no hacen el átomo más grande si
              la carga efectiva crece más: el bromo los sujeta con 7,60 y el
              potasio con 2,20. En un periodo el radio **baja** hacia la
              derecha.
          - texto: >-
              El bromo en electronegatividad y afinidad; el potasio en potencial
              de ionización, porque su $4s^{1}$ está solo
            mensaje: |
              Estar solo no lo sujeta: al contrario, el $4s^{1}$ del potasio es
              uno de los electrones más fáciles de arrancar de la tabla, con
              2,20 de carga efectiva. El bromo, con 7,60, tiene el potencial
              mucho mayor.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Flúor y calcio no comparten grupo ni periodo, pero el flúor está
              más arriba y más a la derecha: menor $n$ y más carga efectiva,
              5,20 frente a 2,85.
          - texto: >-
              Por eso el flúor gana en electronegatividad, potencial de
              ionización y afinidad electrónica.
          - texto: >-
              Bromo y potasio están en el periodo 4: $n$ no distingue y manda la
              carga efectiva, 7,60 frente a 2,20.
          - texto: >-
              El bromo gana en las tres primeras y el potasio es el de mayor
              radio.
          - texto: >-
              El calcio tiene mayor potencial de ionización que el flúor porque
              tiene más protones.
            trampa: true
            mensaje: |
              Tiene más protones, pero al electrón de fuera solo le llegan 2,85,
              y además desde la capa 4. El flúor le hace sentir 5,20 desde la
              capa 2. El potencial de ionización del flúor es de los más altos
              de la tabla.
        veredicto: |
          En un periodo manda $Z_{\text{ef}}$; entre periodo y grupo distintos
          se miran $n$ y $Z_{\text{ef}}$ juntos, y en electronegatividad e
          ionización, si apuntan al mismo lado, casi siempre ya está. La
          afinidad se mira aparte: depende de a dónde va el electrón que entra.

    resolucion: |
      **a y b · Los cuatro elementos.**

      | $Z$ | configuración | periodo | grupo | elemento | $Z_{\text{ef}}$ |
      |---|---|---|---|---|---|
      | 9 | $1s^{2}2s^{2}2p^{5}$ | 2 | 7A | flúor | 5,20 |
      | 20 | $[\mathrm{Ar}]\,4s^{2}$ | 4 | 2A | calcio | 2,85 |
      | 35 | $[\mathrm{Ar}]\,3d^{10}4s^{2}4p^{5}$ | 4 | 7A | bromo | 7,60 |
      | 19 | $[\mathrm{Ar}]\,4s^{1}$ | 4 | 1A | potasio | 2,20 |

      **31 c · Flúor contra calcio.** No comparten ni grupo ni periodo, así que
      se miran los dos criterios: el electrón de fuera del flúor está en
      $n = 2$ y siente 5,20; el del calcio, en $n = 4$ con 2,85. Los dos
      apuntan al flúor, que tiene **mayor electronegatividad, mayor potencial
      de ionización y mayor afinidad electrónica**. En la afinidad se suma que
      al flúor le falta un electrón para cerrar el $2p$, mientras que el
      calcio tiene el $4s$ lleno y el electrón tendría que abrir un subnivel
      nuevo.

      **32 c · Bromo contra potasio.** Mismo periodo: $n$ no distingue y manda
      $Z_{\text{ef}}$, 7,60 frente a 2,20. El bromo tiene **mayor
      electronegatividad, mayor potencial de ionización y mayor afinidad
      electrónica**; el potasio, **mayor radio**.

      **Lo que tienen en común.** En las dos parejas las tres primeras
      propiedades van juntas y el radio va al revés: el que sujeta más sus
      electrones atrae más los ajenos, cuesta más de ionizar y es más
      pequeño. Las dos parejas se razonan con los mismos dos números, $n$ y
      $Z_{\text{ef}}$, pero no conviene hacer de eso una regla para la
      afinidad, que no siempre va con las otras dos: el cloro tiene más que
      el flúor y el carbono más que el nitrógeno. En ella hay que mirar
      además a dónde va el electrón que entra, como en el propuesto 30.

  - id: colfq2-p33-34-ordenar-por-tamano-ionizacion-y-electronegatividad
    titulo: Ordenar por electronegatividad, volumen y energía de ionización, y cuándo manda cada criterio
    fuente: >-
      Problemas propuestos 33 y 34 · Problemas resueltos y propuestos del tema
      2, Estructura atómica · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección no publica
      solución: la respuesta es nuestra. El «volumen atómico» del 34 se lee
      como el tamaño del átomo, que es lo que ordenan n y la carga efectiva.
    nivel: practica
    enunciado: |
      **33.** Ordena los siguientes grupos de elementos en orden creciente de
      electronegatividad:

      a) C, F, N, Li

      b) Li, Rb, K, Fr

      c) Br, F, At, I

      **34.** Dados los elementos estroncio, magnesio, cloro, silicio, radio,
      azufre y calcio. Ordenar de mayor a menor, razonando la respuesta,
      según:

      a) El volumen atómico.

      b) La energía de ionización.

      c) La electronegatividad.
    pide: Los tres órdenes crecientes de electronegatividad del 33 y los tres órdenes decrecientes del 34.

    pasos:
      - tipo: reconocer
        pregunta: |
          Problema 33. ¿Qué criterio decide en cada apartado?
        opciones:
          - texto: >-
              En el a, la carga efectiva, porque los cuatro son del periodo 2;
              en el b y el c, $n$, porque son de un mismo grupo
            correcta: true
            mensaje: |
              Eso es, como en el problema resuelto 10. Dentro de un periodo
              $n$ es el mismo y decide $Z_{\text{ef}}$; dentro de un grupo
              decide $n$, aunque la carga efectiva también se mueva: del flúor
              al bromo pasa de 5,20 a 7,60, y aun así el bromo es menos
              electronegativo, porque su electrón de fuera está en $n = 4$ y no
              en $n = 2$.
          - texto: 'En los tres, el número atómico: más protones, más electronegativo'
            mensaje: |
              En el a coincide por casualidad; en el b y el c da el orden
              contrario. El francio tiene 87 protones y es el menos
              electronegativo de los cuatro del b: su electrón de fuera está en
              $n = 7$.
          - texto: En los tres, $n$, porque el más pequeño es siempre el más electronegativo
            mensaje: |
              En el a los cuatro tienen $n = 2$, así que $n$ no ordena nada.
              Ahí hace falta la carga efectiva.

      - tipo: calcular
        titulo: Las cargas efectivas del apartado a
        pregunta: |
          Problema 33 a). ¿Qué carga efectiva siente el electrón de fuera del
          Li, del C, del N y del F, en ese orden?
        respuesta:
          tipo: vector
          valor: '(1.30, 3.25, 3.90, 5.20)'
          tolerancia: 0.02
          formato: las cuatro cargas efectivas en el orden Li, C, N, F, con dos decimales, entre paréntesis y separadas por comas
        distractores:
          - valor: '(0.95, 2.90, 3.55, 4.85)'
            mensaje: |
              Te has contado a ti mismo en todos: sale $0{,}35$ menos en cada
              uno. El electrón que se mira no se apantalla: el $2s^{1}$ del
              litio no tiene compañeros, y el $2p$ del flúor tiene seis, no
              siete.
          - valor: '(1.00, 2.95, 3.60, 4.90)'
            mensaje: |
              Has apantallado con $1{,}00$ los dos $1s$. Para un electrón del
              nivel 2, el $1s$ es la capa $n-1$ y pesa $0{,}85$.
        pista: |
          Los dos $1s$ a $0{,}85$ en todos; los compañeros del grupo $(2s2p)$
          a $0{,}35$: ninguno, tres, cuatro y seis.
        desarrollo: |
          | | $Z$ | compañeros | $S$ | $Z_{\text{ef}}$ |
          |---|---|---|---|---|
          | Li | 3 | 0 | $2 \times 0{,}85 = 1{,}70$ | 1,30 |
          | C | 6 | 3 | $3 \times 0{,}35 + 1{,}70 = 2{,}75$ | 3,25 |
          | N | 7 | 4 | $4 \times 0{,}35 + 1{,}70 = 3{,}10$ | 3,90 |
          | F | 9 | 6 | $6 \times 0{,}35 + 1{,}70 = 3{,}80$ | 5,20 |

          Suben $0{,}65$ por cada protón añadido, como en el periodo 3 del
          problema resuelto 10.

      - tipo: reconocer
        pregunta: |
          ¿Cuáles son los tres órdenes crecientes del 33?
        opciones:
          - texto: a) Li < C < N < F · b) Fr < Rb < K < Li · c) At < I < Br < F
            correcta: true
            mensaje: |
              Eso es. En el a sube la carga efectiva de 1,30 a 5,20. En el b y
              el c, la electronegatividad sube al bajar $n$: del francio,
              $n = 7$, al litio, $n = 2$; del astato, $n = 6$, al flúor,
              $n = 2$.
          - texto: a) Li < C < N < F · b) Li < K < Rb < Fr · c) F < Br < I < At
            mensaje: |
              El b y el c están al revés: los has ordenado por número atómico.
              En un grupo, más protones vienen con más capas, y la carga
              efectiva que llega al electrón de fuera crece mucho menos que
              ellos: del flúor al astato los protones pasan de 9 a 85 y la
              carga efectiva de 5,20 a 7,60, mientras el electrón de fuera
              pasa de $n = 2$ a $n = 6$. El que tiene la capa de valencia más
              cerca, el de arriba, es el más electronegativo.
          - texto: a) F < N < C < Li · b) Fr < Rb < K < Li · c) At < I < Br < F
            mensaje: |
              El a está al revés. En un periodo la electronegatividad **sube**
              hacia la derecha, con la carga efectiva. Es el radio el que baja.
          - texto: a) Li < N < C < F · b) Fr < Rb < K < Li · c) At < I < Br < F
            mensaje: |
              Has cambiado de sitio el carbono y el nitrógeno. El nitrógeno
              tiene un protón más y siente $3{,}90$ frente a $3{,}25$: es más
              electronegativo que el carbono.

      - tipo: calcular
        titulo: El periodo 3 del 34
        pregunta: |
          Problema 34. ¿Qué carga efectiva siente el electrón de fuera del Mg,
          del Si, del S y del Cl, en ese orden?
        respuesta:
          tipo: vector
          valor: '(2.85, 4.15, 5.45, 6.10)'
          tolerancia: 0.02
          formato: las cuatro cargas efectivas en el orden Mg, Si, S, Cl, con dos decimales, entre paréntesis y separadas por comas
        distractores:
          - valor: '(2.50, 3.80, 5.10, 5.75)'
            mensaje: |
              Te has contado a ti mismo en los cuatro: sale $0{,}35$ menos en
              cada uno.
          - valor: '(1.65, 2.95, 4.25, 4.90)'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho electrones del nivel 2.
              Son la capa $n-1$: pesan $0{,}85$.
        pista: |
          Ocho a $0{,}85$ y dos a $1{,}00$ en todos; compañeros: uno, tres,
          cinco y seis.
        desarrollo: |
          $$
          \mathrm{Mg}: 12 - 9{,}15 = 2{,}85 \quad \mathrm{Si}: 14 - 9{,}85 = 4{,}15 \quad \mathrm{S}: 16 - 10{,}55 = 5{,}45 \quad \mathrm{Cl}: 17 - 10{,}90 = 6{,}10
          $$

          Tres de ellos están publicados en la colección, en el problema
          resuelto 10: Mg 2,85, S 5,45 y Cl 6,10.

      - tipo: calcular
        titulo: El grupo 2 del 34
        pregunta: |
          ¿Y la del electrón de fuera del Mg, del Ca, del Sr y del Ra, en ese
          orden?
        respuesta:
          tipo: vector
          valor: '(2.85, 2.85, 2.85, 2.85)'
          tolerancia: 0.02
          formato: las cuatro cargas efectivas en el orden Mg, Ca, Sr, Ra, con dos decimales, entre paréntesis y separadas por comas
        distractores:
          - valor: '(2, 2, 2, 2)'
            mensaje: |
              Es la cuenta ingenua, $Z$ menos todos los internos, que da 2 en
              los cuatro. Con Slater sale igual para los cuatro también, pero
              2,85: los ocho de la capa $n-1$ tapan $0{,}85$ y el compañero del
              $s$, $0{,}35$.
          - valor: '(1.65, 1.65, 1.65, 1.65)'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho de la capa $n-1$. Pesan
              $0{,}85$.
        pista: |
          En los cuatro: un compañero, ocho en la capa de debajo y el resto
          más adentro.
        desarrollo: |
          $$
          \mathrm{Ca}: 20 - (0{,}35 + 6{,}80 + 10) = 2{,}85 \qquad \mathrm{Sr}: 38 - (0{,}35 + 6{,}80 + 28) = 2{,}85
          $$

          $$
          \mathrm{Ra}: 88 - (0{,}35 + 6{,}80 + 78) = 2{,}85
          $$

          **La misma en los cuatro.** Bajando por el grupo la carga efectiva
          no cambia, así que lo único que distingue al radio del magnesio es
          $n$: 7 frente a 3.

      - tipo: reconocer
        pregunta: |
          Problema 34 a). ¿Cuál es el orden de mayor a menor volumen atómico?
        opciones:
          - texto: Ra > Sr > Ca > Mg > Si > S > Cl
            correcta: true
            mensaje: |
              Eso es. Los cuatro alcalinotérreos tienen la misma carga efectiva
              y los ordena $n$: el radio, en $n = 7$, es el mayor. Los cuatro
              del periodo 3 tienen el mismo $n$ y los ordena $Z_{\text{ef}}$: el
              magnesio, con 2,85, es el mayor y el cloro, con 6,10, el menor.
          - texto: Cl > S > Si > Mg > Ca > Sr > Ra
            mensaje: |
              Es el orden de la energía de ionización y de la
              electronegatividad, justo el contrario. El tamaño crece al bajar
              por un grupo y al ir hacia la izquierda en un periodo.
          - texto: Ra > Sr > Ca > Cl > S > Si > Mg
            mensaje: |
              El periodo 3 está al revés: has pensado que más electrones en el
              nivel hacen el átomo más grande. Van al mismo nivel y los sujeta
              más carga efectiva, así que el átomo **encoge** hacia la derecha.
          - texto: Mg > Ca > Sr > Ra > Si > S > Cl
            mensaje: |
              El grupo 2 está al revés. Con la misma carga efectiva, más capas
              es más tamaño: el radio es el mayor de los siete, no el menor de
              los alcalinotérreos.

      - tipo: reconocer
        pregunta: |
          Problema 34 b) y c). ¿Cómo quedan la energía de ionización y la
          electronegatividad, de mayor a menor?
        opciones:
          - texto: >-
              Las dos igual, Cl > S > Si > Mg > Ca > Sr > Ra: el orden contrario
              del volumen
            correcta: true
            mensaje: |
              Eso es. Un electrón más cerca y más sujeto cuesta más de arrancar
              y el átomo atrae más los del enlace. Las dos propiedades suben
              hacia arriba y hacia la derecha, justo donde el átomo es más
              pequeño.
          - texto: >-
              Energía de ionización Cl > S > Si > Mg > Ca > Sr > Ra;
              electronegatividad Ra > Sr > Ca > Mg > Si > S > Cl
            mensaje: |
              La electronegatividad va en el mismo sentido que la energía de
              ionización, no al revés: los dos miden lo sujetos que están los
              electrones. El radio es un metal que cede electrones, y es el menos
              electronegativo de los siete.
          - texto: >-
              Las dos igual, Ra > Sr > Ca > Mg > Si > S > Cl, porque más
              protones atraen más
            mensaje: |
              El radio tiene 88 protones, pero a su electrón de fuera le llegan
              2,85 desde la capa 7. El cloro le hace sentir 6,10 desde la capa
              3. Contar protones sin restar los que tapan los internos da el
              orden al revés.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Dentro de un periodo $n$ no cambia y manda la carga efectiva, que
              sube hacia la derecha: 1,30 a 5,20 en el periodo 2, 2,85 a 6,10
              en el 3.
          - texto: >-
              Dentro de un grupo manda $n$, que sube una capa en cada periodo;
              la carga efectiva sube mucho menos que los protones, y del
              magnesio al radio ni se mueve: 2,85.
          - texto: >-
              Más carga efectiva y menor $n$ dan más electronegatividad y más
              energía de ionización, y menos tamaño.
          - texto: >-
              Por eso el 34 a sale al revés que el b y el c: Ra > Sr > Ca > Mg >
              Si > S > Cl en volumen, y Cl > S > Si > Mg > Ca > Sr > Ra en las
              otras dos.
          - texto: >-
              En un grupo el más electronegativo es el de abajo, porque tiene
              más protones.
            trampa: true
            mensaje: |
              Es al revés: el de arriba. El de abajo tiene más protones, pero
              también más capas, y la carga efectiva que llega a su electrón de
              fuera sube mucho menos que los protones: del magnesio al radio es
              siempre 2,85, y del flúor al astato, con 76 protones más,
              pasa de 5,20 a 7,60. Con el electrón más lejos, atrae menos.
        veredicto: |
          Periodo, carga efectiva; grupo, $n$. Y el tamaño va casi siempre al
          revés que la energía de ionización y la electronegatividad; no
          siempre: el aluminio es más pequeño que el magnesio y también más
          fácil de ionizar.

    resolucion: |
      **33 · Electronegatividad creciente.**

      - a) **Li < C < N < F.** Periodo 2: $n$ no distingue y la carga
        efectiva sube, 1,30 · 3,25 · 3,90 · 5,20.
      - b) **Fr < Rb < K < Li.** Grupo 1: manda $n$, y la
        electronegatividad sube al subir por el grupo.
      - c) **At < I < Br < F.** Grupo 7A: lo mismo, del astato ($n = 6$) al
        flúor ($n = 2$).

      Una nota sobre el b: en la escala de Pauling el potasio y el rubidio
      comparten el mismo valor, 0,82, con dos cifras. El orden que se pide es
      el de la tendencia del grupo, que es lo que el problema quiere razonado.

      **34 · Siete elementos en dos familias.** Magnesio, silicio, azufre y
      cloro son del periodo 3; magnesio, calcio, estroncio y radio, del grupo
      2. El magnesio está en las dos y sirve de puente:

      | | periodo | grupo | $n$ | $Z_{\text{ef}}$ |
      |---|---|---|---|---|
      | Ra | 7 | 2A | 7 | 2,85 |
      | Sr | 5 | 2A | 5 | 2,85 |
      | Ca | 4 | 2A | 4 | 2,85 |
      | Mg | 3 | 2A | 3 | 2,85 |
      | Si | 3 | 4A | 3 | 4,15 |
      | S | 3 | 6A | 3 | 5,45 |
      | Cl | 3 | 7A | 3 | 6,10 |

      - a) Volumen atómico, de mayor a menor:
        **Ra > Sr > Ca > Mg > Si > S > Cl**. En el grupo, a igual carga
        efectiva, más capas; en el periodo, a igual $n$, menos carga efectiva.
      - b) Energía de ionización: **Cl > S > Si > Mg > Ca > Sr > Ra**.
      - c) Electronegatividad: **Cl > S > Si > Mg > Ca > Sr > Ra**.

      El b y el c salen iguales, y los dos al revés que el a: lo que sujeta
      más los electrones hace el átomo más pequeño, más difícil de ionizar y
      más electronegativo.

      **Sobre el «volumen atómico».** Se ha leído como el tamaño del átomo,
      que es lo que se razona con $n$ y $Z_{\text{ef}}$. Hay textos antiguos
      que llaman volumen atómico al volumen de un mol del elemento sólido, y
      ese no sigue la misma tendencia en los no metales: si tu profesor lo usa
      así, pregúntalo.
