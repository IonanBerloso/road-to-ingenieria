ejercicios:
  # ── Los dos son NUESTROS (§08). Los dos ejercicios de examen de este tema
  #    empiezan con una constante y siguen con una cuadrática y cinco casos de
  #    Le Chatelier. Aquí se separan: escribir un Kc bien —con volúmenes, no
  #    con moles— y montar una tabla de equilibrio en el caso amable, el que
  #    se resuelve con una raíz y no con la fórmula general.
  - id: ejfq8-moles-no-son-concentraciones
    titulo: Un Kc que sale el doble por no dividir entre el volumen
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un recipiente de **2 litros**, a 25 °C, se alcanza el equilibrio

      $$
      \mathrm{N_2O_4\,(g)} \rightleftharpoons 2\,\mathrm{NO_2\,(g)}
      $$

      y se miden **0,10 mol de N2O4** y **0,20 mol de NO2**.

      Calcular $K_c$.

      **Dato:** $R = 0{,}0821\ \mathrm{atm\,L/(mol\,K)}$.
    pide: La constante de equilibrio Kc.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da moles y el volumen del recipiente. ¿Qué entra en la
          expresión de $K_c$?
        opciones:
          - texto: >-
              Concentraciones, o sea moles divididos entre los 2 litros
            correcta: true
            mensaje: |
              Eso es. La **c** de $K_c$ es de concentración, y por eso el
              volumen tiene que estar en el enunciado: si no hiciera falta, no
              lo darían.
          - texto: >-
              Los moles tal cual, porque el volumen es el mismo para todos
            mensaje: |
              Sería cierto si los exponentes fueran iguales arriba y abajo,
              pero aquí no lo son: el NO2 va al cuadrado. El volumen no se
              cancela y el resultado sale el doble.
          - texto: >-
              Las presiones parciales, calculadas con la ley de los gases
            mensaje: |
              Esas dan $K_p$, que es otra constante — relacionada con esta,
              pero distinta. La pregunta pide $K_c$.
          - texto: >-
              Las fracciones molares
            mensaje: |
              Esas dan otra constante más, $K_x$, que no se usa en esta
              asignatura. $K_c$ va con concentraciones molares.

      - tipo: calcular
        titulo: La constante
        pregunta: ¿Cuánto vale $K_c$?
        respuesta:
          tipo: numero
          valor: '0.200'
          tolerancia: 0.008
          formato: la constante, adimensional, con tres cifras decimales
        distractores:
          - valor: '0.400'
            mensaje: |
              Has usado moles en vez de concentraciones. Como el NO2 va al
              cuadrado y el N2O4 no, el volumen **no se cancela**: queda un
              factor $1/V$ que aquí vale un medio.
          - valor: '5.00'
            mensaje: |
              Lo has puesto del revés, reactivo entre producto. En $K_c$ los
              productos van arriba.
        pista: |
          Divide los moles entre los 2 litros y después aplica la expresión,
          con el 2 de la ecuación como exponente del NO2.
        desarrollo: |
          $$
          [\mathrm{N_2O_4}] = \frac{0{,}10}{2} = 0{,}05\ \mathrm{M}
          \qquad
          [\mathrm{NO_2}] = \frac{0{,}20}{2} = 0{,}10\ \mathrm{M}
          $$
          $$
          K_c = \frac{[\mathrm{NO_2}]^{2}}{[\mathrm{N_2O_4}]}
          = \frac{0{,}10^{2}}{0{,}05} = 0{,}200
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La expresión es $K_c = [\mathrm{NO_2}]^{2}/[\mathrm{N_2O_4}]$,
              con el coeficiente 2 como exponente.
          - texto: >-
              Los moles se pasan a concentración dividiendo entre los 2 L.
          - texto: >-
              Sale $0{,}10^{2}/0{,}05 = 0{,}200$.
          - texto: >-
              Como hay dos moles de gas a la derecha y uno a la izquierda,
              $\Delta n = 1$ y $K_p = K_c\,RT = 4{,}89$ a 25 °C.
          - texto: >-
              Como el volumen es el mismo para las dos especies, se puede usar
              directamente los moles y ahorrarse la división.
            trampa: true
            mensaje: |
              Solo se cancelaría si arriba y abajo hubiera el mismo número de
              factores, y aquí no: el NO2 está al cuadrado y el N2O4 no.

              Queda un $1/V$ suelto, que con $V = 2$ hace que el resultado
              salga **el doble** del correcto. La forma de no equivocarse
              nunca es no plantearse la pregunta: pasar siempre a
              concentración antes de sustituir.
        veredicto: |
          La **c** de $K_c$ es de concentración. Si el enunciado da un
          volumen, es porque hace falta.

    resolucion: |
      **La idea.** Media docena de ejercicios de este tema se pierden en la
      primera línea por sustituir moles donde van concentraciones.

      $$
      [\mathrm{N_2O_4}] = 0{,}05\ \mathrm{M}
      \qquad
      [\mathrm{NO_2}] = 0{,}10\ \mathrm{M}
      \qquad
      \boxed{\;K_c = \frac{0{,}10^{2}}{0{,}05} = 0{,}200\;}
      $$

      **Cuándo se cancela el volumen y cuándo no.** Se cancela si el número
      total de factores es el mismo arriba y abajo, es decir si
      $\Delta n_{\text{gas}} = 0$ — como en el gas de agua,
      $\mathrm{H_2O} + \mathrm{CO} \rightleftharpoons \mathrm{H_2} +
      \mathrm{CO_2}$, dos y dos. Aquí es 2 contra 1 y no se cancela.

      Y esa misma condición es la que decide si $K_p$ y $K_c$ coinciden:

      $$
      K_p = K_c\,(RT)^{\Delta n} = 0{,}200\cdot 0{,}0821\cdot 298{,}15
      = 4{,}89
      $$

      Con $\Delta n = 0$ el paréntesis se eleva a cero, vale 1, y las dos
      constantes son la misma. Es la comprobación que se hace de un vistazo
      antes de calcular nada.

  - id: ejfq8-la-tabla-de-equilibrio
    titulo: La tabla de equilibrio, en el caso que sale con una raíz
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para la reacción

      $$
      \mathrm{H_2\,(g)} + \mathrm{I_2\,(g)} \rightleftharpoons
      2\,\mathrm{HI\,(g)}
      $$

      la constante vale $K_c = 50$ a la temperatura de trabajo.

      Se parte de **1,00 mol de H2 y 1,00 mol de I2 en 1 litro**, sin nada de
      HI. Calcular la concentración de HI en el equilibrio.
    pide: La concentración de yoduro de hidrógeno en el equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se parte solo de reactivos. ¿Cómo se plantea el equilibrio?
        opciones:
          - texto: >-
              Llamando $x$ a lo que reacciona de cada reactivo, y escribiendo
              las tres concentraciones finales en función de $x$
            correcta: true
            mensaje: |
              Eso es la tabla de equilibrio, y es el método de todos los
              ejercicios de este tema. Lo único que cambia de uno a otro es
              hacia dónde se desplaza y qué coeficientes multiplican a $x$.
          - texto: >-
              Suponiendo que la reacción se completa y corrigiendo después
            mensaje: |
              Con $K_c = 50$ la reacción va bastante hacia la derecha, pero no
              del todo. Suponer que se completa da $[\mathrm{HI}] = 2$, y el
              equilibrio real deja 1,56.
          - texto: >-
              Dividiendo la constante entre las concentraciones iniciales
            mensaje: |
              La constante relaciona las concentraciones **en el equilibrio**,
              no las iniciales. Sin la tabla no hay forma de conectar unas con
              otras.
          - texto: >-
              Como $K_c$ es grande, se puede despreciar lo que queda sin
              reaccionar
            mensaje: |
              Esa aproximación vale cuando $K$ es muy grande o muy pequeña,
              del orden de $10^{4}$ o más. Con 50 queda un 22 % sin
              reaccionar: despreciarlo es un error del 22 %.

      - tipo: calcular
        titulo: El HI del equilibrio
        pregunta: ¿Cuánto vale $[\mathrm{HI}]$ en el equilibrio?
        respuesta:
          tipo: numero
          valor: '1.559'
          tolerancia: 0.03
          formato: la concentración en mol/L, con tres cifras decimales
        distractores:
          - valor: '2.000'
            mensaje: |
              Eso es si la reacción fuera completa. Con $K_c = 50$ queda un
              22 % de reactivos sin reaccionar: el equilibrio no es el final.
          - valor: '0.780'
            mensaje: |
              Ese es el valor de $x$, no el del HI. Por cada $x$ que reacciona
              de cada reactivo se forman **dos** de HI.
        pista: |
          Con $[\mathrm{H_2}] = [\mathrm{I_2}] = 1-x$ y
          $[\mathrm{HI}] = 2x$, la expresión queda un cuadrado perfecto
          arriba y abajo: se puede sacar la raíz cuadrada de los dos lados y
          evitar la fórmula general.
        desarrollo: |
          $$
          K_c = \frac{(2x)^{2}}{(1-x)^{2}} = 50
          \;\Longrightarrow\;
          \frac{2x}{1-x} = \sqrt{50} = 7{,}071
          $$
          $$
          2x = 7{,}071 - 7{,}071x
          \;\Longrightarrow\;
          x = \frac{7{,}071}{9{,}071} = 0{,}7795
          $$
          $$
          [\mathrm{HI}] = 2x = 1{,}559\ \mathrm{M}
          \qquad
          [\mathrm{H_2}] = [\mathrm{I_2}] = 0{,}2205\ \mathrm{M}
          $$

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de 1,00 M de cada reactivo y nada de HI, y se llama $x$
              a lo que reacciona de cada uno.
          - texto: >-
              En el equilibrio, $[\mathrm{H_2}] = [\mathrm{I_2}] = 1-x$ y
              $[\mathrm{HI}] = 2x$, con el 2 del coeficiente.
          - texto: >-
              Sustituyendo, $(2x)^{2}/(1-x)^{2} = 50$, que es un cuadrado
              perfecto a los dos lados.
          - texto: >-
              Sacando la raíz, $2x/(1-x) = 7{,}071$, y de ahí $x = 0{,}7795$.
          - texto: >-
              El HI son $2x = 1{,}559$ M, y comprobando sale 50,0.
          - texto: >-
              Como $x$ vale lo que reacciona, la concentración de HI en el
              equilibrio es también $x$.
            trampa: true
            mensaje: |
              Los coeficientes también valen en la tabla. Por cada mol de H2 y
              cada mol de I2 que reaccionan se forman **dos** de HI, así que la
              columna del producto lleva $2x$ y no $x$.

              Es el descuido más frecuente del tema y se detecta solo:
              sustituyendo $x$ en vez de $2x$, el $K_c$ que sale es 12,5 en
              vez de 50, o sea la cuarta parte.
        veredicto: |
          Tabla, coeficientes en su sitio, y comprobar al final sustituyendo.
          Si el $K_c$ no vuelve a salir, la tabla está mal.

    resolucion: |
      **La idea.** Todos los ejercicios de equilibrio se resuelven igual: una
      tabla con lo inicial, lo que cambia y lo final, y sustituir en $K_c$.

      | | H₂ | I₂ | HI |
      |---|---|---|---|
      | inicial | 1,00 | 1,00 | 0 |
      | cambio | $-x$ | $-x$ | $+2x$ |
      | equilibrio | $1-x$ | $1-x$ | $2x$ |

      $$
      K_c = \frac{(2x)^{2}}{(1-x)^{2}} = 50
      $$

      **Y aquí hay un atajo que conviene reconocer:** los dos lados son
      cuadrados perfectos, así que se puede sacar la raíz cuadrada en vez de
      desarrollar una ecuación de segundo grado.

      $$
      \frac{2x}{1-x} = \sqrt{50} = 7{,}071
      \;\Longrightarrow\;
      x = 0{,}7795
      \;\Longrightarrow\;
      \boxed{\;[\mathrm{HI}] = 1{,}559\ \mathrm{M}\;}
      $$

      Funciona porque los dos reactivos parten iguales y sus coeficientes son
      iguales. Cuando no es así —como en el fosgeno de la extraordinaria de
      2024-2025, donde se añade cloro a una mezcla que ya está en
      equilibrio— hay que desarrollar y usar la fórmula general.

      **La comprobación, que vale siempre y cuesta diez segundos:**

      $$
      \frac{1{,}559^{2}}{0{,}2205^{2}} = 50{,}0 \checkmark
      $$

      Si al sustituir no sale la constante de partida, la tabla está mal — casi
      siempre por haberse dejado un coeficiente.

  # ── Y a partir de aquí, los problemas propuestos del tema en el orden de la
  #    colección (§04). La colección publica la respuesta final de cada uno;
  #    el desarrollo, los distractores y los errores típicos son nuestros.
  - id: colfq8-1-la-esterificacion-y-el-volumen-que-se-va
    titulo: La esterificación, y por qué aquí el volumen no aparece
    fuente: >-
      Problema 1 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Al mezclar 1 mol de etanol con 1 mol de ácido acético se encuentra que
      una vez alcanzado el equilibrio hay 2/3 moles de agua y 2/3 moles de
      ester. Calcular: a) Kc, b) Si se parte de 3 moles de alcohol y 1 mol de
      ácido ¿Cuántos moles de ester y de ácido hay en el equilibrio?

      $$
      \mathrm{CH_3\text{-}COOH} + \mathrm{CH_3\text{-}CH_2OH} \;\rightleftharpoons\; \mathrm{CH_3\text{-}COO\text{-}CH_2\text{-}CH_3} + \mathrm{H_2O}
      $$
    pide: La constante de equilibrio y los moles de éster y de ácido al partir de otra mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no dice en qué volumen ocurre la reacción. ¿Es un olvido?
        opciones:
          - texto: No, porque hay el mismo número de moles a los dos lados y el volumen se cancela
            correcta: true
            mensaje: |
              Exacto. $K_c$ se escribe con concentraciones, y cada una lleva un
              $1/V$; con dos moles arriba y dos abajo los cuatro se cancelan.
              Por eso este equilibrio se puede resolver directamente con moles.
          - texto: Sí, y hay que suponer un litro para poder calcular
            mensaje: |
              Un dato supuesto acaba publicado como si fuera medido, y eso es
              lo peor que puede pasarle a una resolución. Además aquí no hace
              falta:
              mira los coeficientes antes de dar nada por perdido, porque el
              volumen se va solo.
          - texto: No, porque en fase líquida las concentraciones no intervienen
            mensaje: |
              Sí intervienen: $K_c$ se define con concentraciones sea cual sea
              la fase. Lo que pasa aquí es otra cosa, y es aritmética: se
              cancelan.
          - texto: No, porque el volumen solo importa si hay gases
            mensaje: |
              El volumen importa siempre que $\Delta n \neq 0$, haya gases o
              no: cambiar el volumen cambia las concentraciones. Lo que ocurre
              aquí es que $\Delta n = 0$.

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: |
          Con 2/3 de mol de éster y de agua en el equilibrio, ¿cuánto vale
          $K_c$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0.25'
            mensaje: |
              Tienes la constante del revés. Arriba van los **productos**
              —éster y agua— y abajo los reactivos que quedan sin reaccionar.
          - valor: '1'
            mensaje: |
              Parece que has puesto las concentraciones iniciales, o que has
              dividido $2/3$ entre $2/3$. Lo que va abajo es lo que **queda**
              de cada reactivo, que es $1 - 2/3 = 1/3$.
          - valor: '0.44'
            mensaje: |
              Eso es $(2/3)^{2}$ a secas, sin dividir. Falta el denominador con
              lo que queda de ácido y de alcohol.
        pista: |
          Si se han formado $2/3$ de cada producto, de cada reactivo quedan
          $1 - 2/3 = 1/3$.
        desarrollo: |
          $$
          K_c = \frac{(2/3)(2/3)}{(1/3)(1/3)} = \frac{4/9}{1/9} = 4
          $$

      - tipo: calcular
        titulo: El éster al partir de tres moles de alcohol
        pregunta: |
          Partiendo de 3 mol de alcohol y 1 mol de ácido, ¿cuántos moles de
          éster hay en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.90'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '0.667'
            mensaje: |
              Ese es el resultado del primer apartado. Al cambiar las
              cantidades de partida cambia el punto de equilibrio, aunque
              $K_c$ siga valiendo 4.
          - valor: '1'
            mensaje: |
              Sería así si la reacción fuera completa: el ácido es el
              limitante y se acabaría entero. Pero es un equilibrio y siempre
              queda algo sin reaccionar — poco, un 10 %, pero queda.
          - valor: '3'
            mensaje: |
              Has tomado el alcohol como limitante. Hay 3 mol de alcohol pero
              solo 1 de ácido, y la reacción va mol a mol.
        pista: |
          Monta la tabla con $x$ moles formados y resuelve
          $\dfrac{x^{2}}{(3-x)(1-x)} = 4$.
        desarrollo: |
          $$
          \frac{x^{2}}{(3-x)(1-x)} = 4 \quad\Longrightarrow\quad x^{2} = 4(3 - 4x + x^{2})
          $$

          $$
          3x^{2} - 16x + 12 = 0 \quad\Longrightarrow\quad x = 0{,}90
          $$

          La otra raíz, $4{,}43$, se descarta: no puede formarse más éster que
          el ácido disponible. Y el ácido que queda es
          $1 - 0{,}90 = 0{,}10$ mol.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Con 1 mol de cada reactivo y 2/3 de cada producto en el equilibrio, de cada reactivo queda 1/3.'
          - texto: 'Como hay dos moles a cada lado de la ecuación, el volumen se cancela y Kc se puede escribir con moles: Kc = (2/3)² / (1/3)² = 4.'
          - texto: 'Al partir de 3 mol de alcohol y 1 de ácido, Kc sigue valiendo 4 porque solo depende de la temperatura.'
          - texto: 'Resolviendo 3x² − 16x + 12 = 0 sale x = 0,90 mol de éster, y quedan 0,10 mol de ácido.'
          - texto: 'Como se ha triplicado el alcohol, la cantidad de éster también se triplica respecto del primer apartado.'
            trampa: true
            mensaje: |
              Un equilibrio no responde en proporción. Triplicar el alcohol
              subió el éster de 0,67 a 0,90 mol, un 35 %, no un 200 %: el
              ácido sigue siendo el limitante y no puede dar más de 1 mol
              hiciera lo que hiciera el alcohol. Es Le Chatelier funcionando,
              pero con rendimientos decrecientes.
    resolucion: |
      **a · La constante.** Lo primero es darse cuenta de que el volumen no
      hace falta. $K_c$ lleva concentraciones, y cada concentración es
      $n/V$; con dos moles arriba y dos abajo, los cuatro $V$ se cancelan y
      se puede trabajar con moles directamente. **Eso solo pasa cuando
      $\Delta n = 0$**, y conviene comprobarlo antes de usarlo.

      Si se han formado $2/3$ de mol de éster, se han consumido $2/3$ de cada
      reactivo y queda $1/3$ de cada uno:

      $$
      K_c = \frac{(2/3)(2/3)}{(1/3)(1/3)} = 4
      $$

      **b · Otra mezcla de partida, la misma constante.** $K_c$ solo depende
      de la temperatura, así que sigue valiendo 4. Con $x$ moles de éster
      formados:

      | | ácido | alcohol | éster | agua |
      |---|---|---|---|---|
      | inicio | 1 | 3 | 0 | 0 |
      | equilibrio | $1-x$ | $3-x$ | $x$ | $x$ |

      $$
      \frac{x^{2}}{(3-x)(1-x)} = 4 \quad\Longrightarrow\quad 3x^{2} - 16x + 12 = 0
      $$

      $$
      x = \frac{16 \pm \sqrt{112}}{6} \quad\Longrightarrow\quad x = 0{,}90 \ \text{o} \ x = 4{,}43
      $$

      **Se descarta la segunda raíz**, y no por gusto: solo hay 1 mol de
      ácido, así que no pueden formarse 4,43 mol de éster. Toda cuadrática de
      equilibrio da dos raíces y siempre hay que decir por qué se tira una.

      $$
      n_{\text{éster}} = 0{,}90\ \mathrm{mol} \qquad n_{\text{ácido}} = 0{,}10\ \mathrm{mol}
      $$

      **Lo que enseña.** Triplicar el alcohol ha subido el éster de 0,67 a
      0,90 mol. Es Le Chatelier —más reactivo empuja hacia los productos—
      pero **no en proporción**: el ácido sigue siendo el limitante y pone el
      techo en 1 mol. Es el argumento industrial de por qué se trabaja con
      exceso de uno de los dos, y por qué llega un punto en que dejar de
      compensar.

  - id: colfq8-3-el-amoniaco-y-el-paso-de-kc-a-kp
    titulo: El amoniaco, y el exponente que decide si Kp sube o baja
    fuente: >-
      Problema 3 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Para determinar la constante, a 700 ºC, de la reacción:

      $$
      \mathrm{N_2\,(g)} + 3\,\mathrm{H_2\,(g)} \;\rightleftharpoons\; 2\,\mathrm{NH_3\,(g)}
      $$

      se han mezclado 0,652 g de hidrógeno y 12,292 g de nitrógeno en un
      recipiente de 1 L. Se ha calculado que el sistema en el equilibrio
      contenía un total de 0,657 moles. Calcular las constantes de equilibrio
      Kc y Kp de dicha reacción, a la temperatura dada.
    pide: Las constantes Kc y Kp a 700 ºC.

    pasos:
      - tipo: reconocer
        pregunta: |
          El único dato del equilibrio es el número **total** de moles.
          ¿Cómo se saca de ahí cuánto ha reaccionado?
        opciones:
          - texto: Porque la reacción consume 4 moles y produce 2, así que el total baja en 2 por cada avance
            correcta: true
            mensaje: |
              Ese es el truco del problema. $\Delta n = 2 - 4 = -2$, así que
              cada mol de avance hace desaparecer dos moles del recuento
              total. La diferencia entre el total inicial y el final, dividida
              entre dos, da el avance.
          - texto: Repartiendo los 0,657 moles a partes iguales entre las tres especies
            mensaje: |
              No hay ninguna razón para que estén repartidos por igual: las
              cantidades iniciales son distintas y los coeficientes también.
              El total es una suma, no un promedio.
          - texto: No se puede; falta saber cuánto amoniaco se ha formado
            mensaje: |
              Sí se puede, y es justo lo que evalúa el problema. El total de
              moles cambia **solo** porque la reacción avanza, así que su
              variación mide el avance.
          - texto: Suponiendo que el hidrógeno se agota, por ser el limitante
            mensaje: |
              En un equilibrio no se agota nada. Y además el total final,
              0,657, es mayor que cero por mucho: si el hidrógeno se hubiera
              agotado el total sería otro.

      - tipo: calcular
        titulo: La constante en concentraciones
        pregunta: |
          Con las masas molares en números redondos —2 para el H₂ y 28 para el
          N₂— y el recipiente de 1 L, ¿cuánto vale $K_c$?
        respuesta:
          tipo: numero
          valor: '6.87'
          tolerancia: 0.05
          formato: un número, con dos decimales
        distractores:
          - valor: '0.146'
            mensaje: |
              Tienes la constante invertida: es el $K_c$ de la
              descomposición del amoniaco, no el de su formación. Los
              productos van arriba.
          - valor: '0.657'
            mensaje: |
              Eso es el total de moles del equilibrio, que es un dato de
              partida y no el resultado.
          - valor: '1.75'
            mensaje: |
              Parece que has olvidado elevar el hidrógeno al cubo. El
              exponente de cada especie en $K_c$ es su coeficiente
              estequiométrico, y el del H₂ es 3.
        pista: |
          El total baja de $0{,}765$ a $0{,}657$, o sea $0{,}108$; divide entre
          2 para el avance y monta la tabla.
        desarrollo: |
          Moles iniciales: $0{,}652/2 = 0{,}326$ de H₂ y $12{,}292/28 = 0{,}439$
          de N₂, en total $0{,}765$.

          Como $\Delta n = -2$, el avance es
          $x = (0{,}765 - 0{,}657)/2 = 0{,}054$.

          | | N₂ | H₂ | NH₃ |
          |---|---|---|---|
          | inicio | 0,439 | 0,326 | 0 |
          | equilibrio | 0,385 | 0,164 | 0,108 |

          Y como el volumen es 1 L, los moles son concentraciones:

          $$
          K_c = \frac{0{,}108^{2}}{0{,}385 \times 0{,}164^{3}} = 6{,}87
          $$

      - tipo: calcular
        titulo: La constante en presiones
        pregunta: |
          Pasando a presiones con $R = 0{,}0821$ y $T = 973$ K, ¿cuánto vale
          $K_p$?
        respuesta:
          tipo: numero
          valor: '1.08e-3'
          tolerancia: 2e-5
          formato: un número en notación científica, como 1,08e-3
        distractores:
          - valor: '6.87'
            mensaje: |
              Ese es $K_c$. Como $\Delta n \neq 0$, las dos constantes no
              coinciden — y aquí se diferencian en cuatro órdenes de magnitud.
          - valor: '0.0860'
            mensaje: |
              Has usado $\Delta n = -1$. Cuenta bien: dos moles de gas a la
              derecha y cuatro a la izquierda, así que $\Delta n = -2$.
          - valor: '43823'
            mensaje: |
              Tienes el signo del exponente al revés, has usado $+2$. Al
              haber menos moles de gas en los productos, $K_p$ tiene que
              salir **menor** que $K_c$, no mayor.
        pista: |
          $K_p = K_c (RT)^{\Delta n}$, con $\Delta n$ contando solo los gases.
        desarrollo: |
          $$
          \Delta n = 2 - (1 + 3) = -2
          $$

          $$
          RT = 0{,}0821 \times 973 = 79{,}88
          $$

          $$
          K_p = 6{,}87 \times 79{,}88^{-2} = \frac{6{,}87}{6381} = 1{,}08 \times 10^{-3}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los moles iniciales son 0,326 de H₂ y 0,439 de N₂, en total 0,765.'
          - texto: 'La reacción consume cuatro moles de gas y produce dos, así que Δn = −2 y el total baja el doble del avance.'
          - texto: 'De 0,765 − 0,657 = 0,108 sale un avance de 0,054, y con él la tabla del equilibrio.'
          - texto: 'Con el recipiente de 1 L los moles son concentraciones, y Kc = 0,108² / (0,385 × 0,164³) = 6,87.'
          - texto: 'Kp = Kc (RT)^Δn = 6,87 × 79,88⁻² = 1,08 × 10⁻³.'
          - texto: 'Kp sale menor que Kc porque las presiones son números más pequeños que las concentraciones.'
            trampa: true
            mensaje: |
              El motivo es el exponente, no el tamaño de los números —a 973 K
              las presiones son de hecho **mayores** que las concentraciones—.
              $K_p$ sale menor porque $\Delta n$ es negativo, así que $(RT)$
              divide en vez de multiplicar. Con $\Delta n$ positivo saldría al
              revés, y con $\Delta n = 0$ las dos serían iguales.
    resolucion: |
      **El dato que parece insuficiente y no lo es.** Lo único que se sabe del
      equilibrio es el número total de moles, 0,657. Sirve porque la reacción
      **cambia** ese total: consume cuatro moles de gas y produce dos, así que
      $\Delta n = -2$ y cada mol de avance hace desaparecer dos del recuento.

      Los iniciales, con las masas molares redondeadas que usa la colección:

      $$
      n_{\mathrm{H_2}} = \frac{0{,}652}{2} = 0{,}326 \qquad n_{\mathrm{N_2}} = \frac{12{,}292}{28} = 0{,}439
      $$

      Total inicial $0{,}765$, y por tanto

      $$
      x = \frac{0{,}765 - 0{,}657}{2} = 0{,}054
      $$

      | | N₂ | H₂ | NH₃ |
      |---|---|---|---|
      | inicio | 0,439 | 0,326 | 0 |
      | cambio | $-x$ | $-3x$ | $+2x$ |
      | equilibrio | 0,385 | 0,164 | 0,108 |

      **Kc.** El recipiente es de 1 L, así que los moles **son** las
      concentraciones. Es una comodidad del enunciado, no una regla general:

      $$
      K_c = \frac{[\mathrm{NH_3}]^{2}}{[\mathrm{N_2}][\mathrm{H_2}]^{3}} = \frac{0{,}108^{2}}{0{,}385 \times 0{,}164^{3}} = 6{,}87
      $$

      **Kp.** Con $T = 700 + 273 = 973$ K:

      $$
      K_p = K_c (RT)^{\Delta n} = 6{,}87 \times (0{,}0821 \times 973)^{-2} = 1{,}08 \times 10^{-3}
      $$

      **Dos avisos que valen para todo el tema.**

      El primero es el **signo del exponente**. Con $\Delta n$ negativo,
      $(RT)$ divide, y como $RT \approx 80$ eso hunde la constante cuatro
      órdenes de magnitud. Antes de dar el número conviene preguntarse hacia
      dónde tiene que ir: menos moles de gas en los productos, $K_p$ menor.

      El segundo es de **masas molares**. Aquí se han usado 2 y 28 porque son
      las que reproducen la respuesta publicada, $6{,}87$. Con los valores de
      tabla —2,016 y 28,014— sale $6{,}31$, un 8 % menos. No es un error de
      nadie: es que en un problema donde se resta $0{,}765 - 0{,}657$, una
      diferencia pequeña entre dos números grandes se amplifica. **Cuando un
      resultado se obtiene restando dos cantidades parecidas, conviene decir
      con qué datos se ha calculado.**

  - id: colfq8-4-la-caliza-y-el-solido-que-no-entra
    titulo: La caliza, y los sólidos que no aparecen en la constante
    fuente: >-
      Problema 4 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      A 1000 K la Kp para la descomposición del CaCO3 (s) en CaO (s) y CO2 (g)
      es de 4 x 10⁻⁵ atm. Se coloca un poco de CaCO3 (s) en un recipiente de
      5 L a 1000 K. Una vez establecido el equilibrio ¿Cuántos gramos de CaO
      (s) se han formado?
    pide: La masa de óxido de calcio formada en el equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción tiene dos sólidos y un gas. ¿Cómo se escribe $K_p$?
        opciones:
          - texto: $K_p = P_{\mathrm{CO_2}}$, porque los sólidos no entran en la constante
            correcta: true
            mensaje: |
              Eso es. Un sólido puro tiene actividad constante —su
              «concentración» no cambia por mucho que haya más o menos—, así
              que no aparece. Por eso $K_p$ de este equilibrio es simplemente
              la presión del dióxido de carbono.
          - texto: $K_p = P_{\mathrm{CO_2}} \cdot [\mathrm{CaO}] / [\mathrm{CaCO_3}]$
            mensaje: |
              Los dos sólidos no van en la expresión. Y fíjate en la
              consecuencia práctica de que sí fueran: la constante dependería
              de cuánta caliza has echado, y una constante no puede depender
              de eso.
          - texto: No se puede escribir, porque falta saber cuánto CaCO₃ hay
            mensaje: |
              Y esa es justo la razón por la que los sólidos no entran: el
              enunciado dice «un poco» a propósito. Mientras quede algo de
              caliza, la presión de equilibrio del CO₂ es la misma.
          - texto: $K_p = P_{\mathrm{CO_2}} \cdot P_{\mathrm{CaO}}$
            mensaje: |
              El CaO es sólido y no ejerce presión parcial. Solo los gases
              aparecen en $K_p$, y aquí el único es el CO₂.

      - tipo: calcular
        titulo: Los moles de gas
        pregunta: |
          Con $P_{\mathrm{CO_2}} = 4 \times 10^{-5}$ atm en 5 L a 1000 K,
          ¿cuántos moles de CO₂ hay?
        respuesta:
          tipo: numero
          valor: '2.44e-6'
          tolerancia: 5e-8
          formato: un número en notación científica, como 1,08e-3
        distractores:
          - valor: '4.87e-7'
            mensaje: |
              Has usado 1 L en vez de 5. El volumen del recipiente entra
              multiplicando en $n = PV/RT$.
          - valor: '1.22e-5'
            mensaje: |
              Parece que has usado 273 K en vez de 1000. La temperatura del
              enunciado es la del equilibrio, no la de condiciones normales.
        pista: |
          $n = \dfrac{PV}{RT}$, con $R = 0{,}0821$ y $T = 1000$ K.
        desarrollo: |
          $$
          n = \frac{4 \times 10^{-5} \times 5}{0{,}0821 \times 1000} = 2{,}44 \times 10^{-6}\ \mathrm{mol}
          $$

      - tipo: calcular
        titulo: Los gramos de óxido
        pregunta: |
          ¿Cuántos gramos de CaO se han formado? Masa molar del CaO,
          56,08 g/mol.
        respuesta:
          tipo: numero
          valor: '1.37e-4'
          tolerancia: 3e-6
          formato: un número en notación científica, como 1,37e-4, en gramos
        distractores:
          - valor: '2.44e-6'
            mensaje: |
              Esos son los moles, no los gramos. Falta multiplicar por la masa
              molar.
          - valor: '2.44e-4'
            mensaje: |
              Has multiplicado por 100, que es la masa molar del CaCO₃, no la
              del CaO. La pregunta es por el óxido formado.
        pista: |
          Por cada mol de CO₂ se forma un mol de CaO. Multiplica por 56,08.
        desarrollo: |
          La estequiometría es uno a uno, así que hay tantos moles de CaO como
          de CO₂:

          $$
          m = 2{,}44 \times 10^{-6} \times 56{,}08 = 1{,}37 \times 10^{-4}\ \mathrm{g}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los sólidos puros no aparecen en la constante, así que Kp = P(CO₂) = 4 × 10⁻⁵ atm.'
          - texto: 'Con esa presión, 5 L y 1000 K, los moles de CO₂ son n = PV/RT = 2,44 × 10⁻⁶.'
          - texto: 'La estequiometría es uno a uno, así que se han formado los mismos moles de CaO.'
          - texto: 'Y en gramos, 2,44 × 10⁻⁶ × 56,08 = 1,37 × 10⁻⁴ g: una cantidad minúscula.'
          - texto: 'Si se pusiera el doble de caliza se formaría el doble de óxido, porque hay el doble de reactivo disponible.'
            trampa: true
            mensaje: |
              No. La presión de equilibrio del CO₂ la fija $K_p$ y nada más, y
              con el mismo volumen y la misma temperatura salen los mismos
              moles de gas — y por tanto los mismos de óxido. Añadir sólido no
              desplaza un equilibrio heterogéneo; es la otra cara de que los
              sólidos no entren en la constante. Lo que sí lo cambiaría es
              cambiar el volumen.
    resolucion: |
      **La regla que hace corto el problema.** En un equilibrio heterogéneo
      los **sólidos puros y los líquidos puros no aparecen en la constante**.
      La razón es que su actividad no cambia: un trozo de caliza tiene la
      misma densidad tanto si hay un gramo como un kilo. Así que aquí

      $$
      K_p = P_{\mathrm{CO_2}} = 4 \times 10^{-5}\ \mathrm{atm}
      $$

      y la presión del CO₂ está fijada por la temperatura, sin más.

      **El resto es gases ideales.**

      $$
      n = \frac{PV}{RT} = \frac{4 \times 10^{-5} \times 5}{0{,}0821 \times 1000} = 2{,}44 \times 10^{-6}\ \mathrm{mol}
      $$

      Y como la descomposición produce un mol de CaO por cada mol de CO₂:

      $$
      m_{\mathrm{CaO}} = 2{,}44 \times 10^{-6} \times 56{,}08 = 1{,}37 \times 10^{-4}\ \mathrm{g}
      $$

      **Lo que hay que ver, y no es el número.** Son 0,137 miligramos: una
      cantidad que no se pesa en una balanza de clase. Y sin embargo el
      proceso industrial de calcinar caliza para hacer cal funciona a escala
      de toneladas. La diferencia está en que **en la industria el CO₂ se
      retira continuamente**: al quitar el producto, el equilibrio nunca se
      alcanza y la reacción sigue avanzando.

      Ese es el uso real de Le Chatelier en este tema, y explica por qué el
      «poco CaCO₃» del enunciado no es un descuido: da igual cuánto pongas,
      porque en un recipiente cerrado el gas se para en la misma presión
      siempre.
