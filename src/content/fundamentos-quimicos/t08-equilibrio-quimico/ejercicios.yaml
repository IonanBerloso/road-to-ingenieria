ejercicios:
  # ── Los dos son NUESTROS (§08). Los dos ejercicios de examen de este tema
  #    empiezan con una constante y siguen con una cuadrática y cinco casos de
  #    Le Chatelier. Aquí se separan: escribir un Kc bien —con volúmenes, no
  #    con moles— y montar una tabla de equilibrio en el caso amable, el que
  #    se resuelve con una raíz y no con la fórmula general.
  - id: ejfq8-moles-no-son-concentraciones
    titulo: Un Kc que sale el doble por no dividir entre el volumen
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un recipiente de **2 litros**, a 25 °C, se alcanza el equilibrio

      $$
      \mathrm{N_2O_4\,(g)} \rightleftharpoons 2\,\mathrm{NO_2\,(g)}
      $$

      y se miden **0,10 mol de N2O4** y **0,20 mol de NO2**.

      Calcular $K_c$.

      **Dato:** $R = 0{,}0821\ \mathrm{atm\,L/(mol\,K)}$.
    pide: La constante de equilibrio Kc.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da moles y el volumen del recipiente. ¿Qué entra en la
          expresión de $K_c$?
        opciones:
          - texto: >-
              Concentraciones, o sea moles divididos entre los 2 litros
            correcta: true
            mensaje: |
              Eso es. La **c** de $K_c$ es de concentración, y por eso el
              volumen tiene que estar en el enunciado: si no hiciera falta, no
              lo darían.
          - texto: >-
              Los moles tal cual, porque el volumen es el mismo para todos
            mensaje: |
              Sería cierto si los exponentes fueran iguales arriba y abajo,
              pero aquí no lo son: el NO2 va al cuadrado. El volumen no se
              cancela y el resultado sale el doble.
          - texto: >-
              Las presiones parciales, calculadas con la ley de los gases
            mensaje: |
              Esas dan $K_p$, que es otra constante — relacionada con esta,
              pero distinta. La pregunta pide $K_c$.
          - texto: >-
              Las fracciones molares
            mensaje: |
              Esas dan otra constante más, $K_x$, que no se usa en esta
              asignatura. $K_c$ va con concentraciones molares.

      - tipo: calcular
        titulo: La constante
        pregunta: ¿Cuánto vale $K_c$?
        respuesta:
          tipo: numero
          valor: '0.200'
          tolerancia: 0.008
          formato: la constante, adimensional, con tres cifras decimales
        distractores:
          - valor: '0.400'
            mensaje: |
              Has usado moles en vez de concentraciones. Como el NO2 va al
              cuadrado y el N2O4 no, el volumen **no se cancela**: queda un
              factor $1/V$ que aquí vale un medio.
          - valor: '5.00'
            mensaje: |
              Lo has puesto del revés, reactivo entre producto. En $K_c$ los
              productos van arriba.
        pista: |
          Divide los moles entre los 2 litros y después aplica la expresión,
          con el 2 de la ecuación como exponente del NO2.
        desarrollo: |
          $$
          [\mathrm{N_2O_4}] = \frac{0{,}10}{2} = 0{,}05\ \mathrm{M}
          \qquad
          [\mathrm{NO_2}] = \frac{0{,}20}{2} = 0{,}10\ \mathrm{M}
          $$
          $$
          K_c = \frac{[\mathrm{NO_2}]^{2}}{[\mathrm{N_2O_4}]}
          = \frac{0{,}10^{2}}{0{,}05} = 0{,}200
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La expresión es $K_c = [\mathrm{NO_2}]^{2}/[\mathrm{N_2O_4}]$,
              con el coeficiente 2 como exponente.
          - texto: >-
              Los moles se pasan a concentración dividiendo entre los 2 L.
          - texto: >-
              Sale $0{,}10^{2}/0{,}05 = 0{,}200$.
          - texto: >-
              Como hay dos moles de gas a la derecha y uno a la izquierda,
              $\Delta n = 1$ y $K_p = K_c\,RT = 4{,}89$ a 25 °C.
          - texto: >-
              Como el volumen es el mismo para las dos especies, se puede usar
              directamente los moles y ahorrarse la división.
            trampa: true
            mensaje: |
              Solo se cancelaría si arriba y abajo hubiera el mismo número de
              factores, y aquí no: el NO2 está al cuadrado y el N2O4 no.

              Queda un $1/V$ suelto, que con $V = 2$ hace que el resultado
              salga **el doble** del correcto. La forma de no equivocarse
              nunca es no plantearse la pregunta: pasar siempre a
              concentración antes de sustituir.
        veredicto: |
          La **c** de $K_c$ es de concentración. Si el enunciado da un
          volumen, es porque hace falta.

    resolucion: |
      **La idea.** Media docena de ejercicios de este tema se pierden en la
      primera línea por sustituir moles donde van concentraciones.

      $$
      [\mathrm{N_2O_4}] = 0{,}05\ \mathrm{M}
      \qquad
      [\mathrm{NO_2}] = 0{,}10\ \mathrm{M}
      \qquad
      \boxed{\;K_c = \frac{0{,}10^{2}}{0{,}05} = 0{,}200\;}
      $$

      **Cuándo se cancela el volumen y cuándo no.** Se cancela si el número
      total de factores es el mismo arriba y abajo, es decir si
      $\Delta n_{\text{gas}} = 0$ — como en el gas de agua,
      $\mathrm{H_2O} + \mathrm{CO} \rightleftharpoons \mathrm{H_2} +
      \mathrm{CO_2}$, dos y dos. Aquí es 2 contra 1 y no se cancela.

      Y esa misma condición es la que decide si $K_p$ y $K_c$ coinciden:

      $$
      K_p = K_c\,(RT)^{\Delta n} = 0{,}200\cdot 0{,}0821\cdot 298{,}15
      = 4{,}89
      $$

      Con $\Delta n = 0$ el paréntesis se eleva a cero, vale 1, y las dos
      constantes son la misma. Es la comprobación que se hace de un vistazo
      antes de calcular nada.

  - id: ejfq8-la-tabla-de-equilibrio
    titulo: La tabla de equilibrio, en el caso que sale con una raíz
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Para la reacción

      $$
      \mathrm{H_2\,(g)} + \mathrm{I_2\,(g)} \rightleftharpoons
      2\,\mathrm{HI\,(g)}
      $$

      la constante vale $K_c = 50$ a la temperatura de trabajo.

      Se parte de **1,00 mol de H2 y 1,00 mol de I2 en 1 litro**, sin nada de
      HI. Calcular la concentración de HI en el equilibrio.
    pide: La concentración de yoduro de hidrógeno en el equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se parte solo de reactivos. ¿Cómo se plantea el equilibrio?
        opciones:
          - texto: >-
              Llamando $x$ a lo que reacciona de cada reactivo, y escribiendo
              las tres concentraciones finales en función de $x$
            correcta: true
            mensaje: |
              Eso es la tabla de equilibrio, y es el método de todos los
              ejercicios de este tema. Lo único que cambia de uno a otro es
              hacia dónde se desplaza y qué coeficientes multiplican a $x$.
          - texto: >-
              Suponiendo que la reacción se completa y corrigiendo después
            mensaje: |
              Con $K_c = 50$ la reacción va bastante hacia la derecha, pero no
              del todo. Suponer que se completa da $[\mathrm{HI}] = 2$, y el
              equilibrio real deja 1,56.
          - texto: >-
              Dividiendo la constante entre las concentraciones iniciales
            mensaje: |
              La constante relaciona las concentraciones **en el equilibrio**,
              no las iniciales. Sin la tabla no hay forma de conectar unas con
              otras.
          - texto: >-
              Como $K_c$ es grande, se puede despreciar lo que queda sin
              reaccionar
            mensaje: |
              Esa aproximación vale cuando $K$ es muy grande o muy pequeña,
              del orden de $10^{4}$ o más. Con 50 queda un 22 % sin
              reaccionar: despreciarlo es un error del 22 %.

      - tipo: calcular
        titulo: El HI del equilibrio
        pregunta: ¿Cuánto vale $[\mathrm{HI}]$ en el equilibrio?
        respuesta:
          tipo: numero
          valor: '1.559'
          tolerancia: 0.03
          formato: la concentración en mol/L, con tres cifras decimales
        distractores:
          - valor: '2.000'
            mensaje: |
              Eso es si la reacción fuera completa. Con $K_c = 50$ queda un
              22 % de reactivos sin reaccionar: el equilibrio no es el final.
          - valor: '0.780'
            mensaje: |
              Ese es el valor de $x$, no el del HI. Por cada $x$ que reacciona
              de cada reactivo se forman **dos** de HI.
        pista: |
          Con $[\mathrm{H_2}] = [\mathrm{I_2}] = 1-x$ y
          $[\mathrm{HI}] = 2x$, la expresión queda un cuadrado perfecto
          arriba y abajo: se puede sacar la raíz cuadrada de los dos lados y
          evitar la fórmula general.
        desarrollo: |
          $$
          K_c = \frac{(2x)^{2}}{(1-x)^{2}} = 50
          \;\Longrightarrow\;
          \frac{2x}{1-x} = \sqrt{50} = 7{,}071
          $$
          $$
          2x = 7{,}071 - 7{,}071x
          \;\Longrightarrow\;
          x = \frac{7{,}071}{9{,}071} = 0{,}7795
          $$
          $$
          [\mathrm{HI}] = 2x = 1{,}559\ \mathrm{M}
          \qquad
          [\mathrm{H_2}] = [\mathrm{I_2}] = 0{,}2205\ \mathrm{M}
          $$

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de 1,00 M de cada reactivo y nada de HI, y se llama $x$
              a lo que reacciona de cada uno.
          - texto: >-
              En el equilibrio, $[\mathrm{H_2}] = [\mathrm{I_2}] = 1-x$ y
              $[\mathrm{HI}] = 2x$, con el 2 del coeficiente.
          - texto: >-
              Sustituyendo, $(2x)^{2}/(1-x)^{2} = 50$, que es un cuadrado
              perfecto a los dos lados.
          - texto: >-
              Sacando la raíz, $2x/(1-x) = 7{,}071$, y de ahí $x = 0{,}7795$.
          - texto: >-
              El HI son $2x = 1{,}559$ M, y comprobando sale 50,0.
          - texto: >-
              Como $x$ vale lo que reacciona, la concentración de HI en el
              equilibrio es también $x$.
            trampa: true
            mensaje: |
              Los coeficientes también valen en la tabla. Por cada mol de H2 y
              cada mol de I2 que reaccionan se forman **dos** de HI, así que la
              columna del producto lleva $2x$ y no $x$.

              Es el descuido más frecuente del tema y se detecta solo:
              sustituyendo $x$ en vez de $2x$, el $K_c$ que sale es 12,5 en
              vez de 50, o sea la cuarta parte.
        veredicto: |
          Tabla, coeficientes en su sitio, y comprobar al final sustituyendo.
          Si el $K_c$ no vuelve a salir, la tabla está mal.

    resolucion: |
      **La idea.** Todos los ejercicios de equilibrio se resuelven igual: una
      tabla con lo inicial, lo que cambia y lo final, y sustituir en $K_c$.

      | | H₂ | I₂ | HI |
      |---|---|---|---|
      | inicial | 1,00 | 1,00 | 0 |
      | cambio | $-x$ | $-x$ | $+2x$ |
      | equilibrio | $1-x$ | $1-x$ | $2x$ |

      $$
      K_c = \frac{(2x)^{2}}{(1-x)^{2}} = 50
      $$

      **Y aquí hay un atajo que conviene reconocer:** los dos lados son
      cuadrados perfectos, así que se puede sacar la raíz cuadrada en vez de
      desarrollar una ecuación de segundo grado.

      $$
      \frac{2x}{1-x} = \sqrt{50} = 7{,}071
      \;\Longrightarrow\;
      x = 0{,}7795
      \;\Longrightarrow\;
      \boxed{\;[\mathrm{HI}] = 1{,}559\ \mathrm{M}\;}
      $$

      Funciona porque los dos reactivos parten iguales y sus coeficientes son
      iguales. Cuando no es así —como en el fosgeno de la extraordinaria de
      2024-2025, donde se añade cloro a una mezcla que ya está en
      equilibrio— hay que desarrollar y usar la fórmula general.

      **La comprobación, que vale siempre y cuesta diez segundos:**

      $$
      \frac{1{,}559^{2}}{0{,}2205^{2}} = 50{,}0 \checkmark
      $$

      Si al sustituir no sale la constante de partida, la tabla está mal — casi
      siempre por haberse dejado un coeficiente.

  # ── Y a partir de aquí, los problemas propuestos del tema en el orden de la
  #    colección (§04). La colección publica la respuesta final de cada uno;
  #    el desarrollo, los distractores y los errores típicos son nuestros.
  - id: colfq8-1-la-esterificacion-y-el-volumen-que-se-va
    titulo: La esterificación, y por qué aquí el volumen no aparece
    fuente: >-
      Problema 1 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Al mezclar 1 mol de etanol con 1 mol de ácido acético se encuentra que
      una vez alcanzado el equilibrio hay 2/3 moles de agua y 2/3 moles de
      ester. Calcular: a) Kc, b) Si se parte de 3 moles de alcohol y 1 mol de
      ácido ¿Cuántos moles de ester y de ácido hay en el equilibrio?

      $$
      \mathrm{CH_3\text{-}COOH} + \mathrm{CH_3\text{-}CH_2OH} \;\rightleftharpoons\; \mathrm{CH_3\text{-}COO\text{-}CH_2\text{-}CH_3} + \mathrm{H_2O}
      $$
    pide: La constante de equilibrio y los moles de éster y de ácido al partir de otra mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no dice en qué volumen ocurre la reacción. ¿Es un olvido?
        opciones:
          - texto: No, porque hay el mismo número de moles a los dos lados y el volumen se cancela
            correcta: true
            mensaje: |
              Exacto. $K_c$ se escribe con concentraciones, y cada una lleva un
              $1/V$; con dos moles arriba y dos abajo los cuatro se cancelan.
              Por eso este equilibrio se puede resolver directamente con moles.
          - texto: Sí, y hay que suponer un litro para poder calcular
            mensaje: |
              Un dato supuesto acaba publicado como si fuera medido, y eso es
              lo peor que puede pasarle a una resolución. Además aquí no hace
              falta:
              mira los coeficientes antes de dar nada por perdido, porque el
              volumen se va solo.
          - texto: No, porque en fase líquida las concentraciones no intervienen
            mensaje: |
              Sí intervienen: $K_c$ se define con concentraciones sea cual sea
              la fase. Lo que pasa aquí es otra cosa, y es aritmética: se
              cancelan.
          - texto: No, porque el volumen solo importa si hay gases
            mensaje: |
              El volumen importa siempre que $\Delta n \neq 0$, haya gases o
              no: cambiar el volumen cambia las concentraciones. Lo que ocurre
              aquí es que $\Delta n = 0$.

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: |
          Con 2/3 de mol de éster y de agua en el equilibrio, ¿cuánto vale
          $K_c$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0.25'
            mensaje: |
              Tienes la constante del revés. Arriba van los **productos**
              —éster y agua— y abajo los reactivos que quedan sin reaccionar.
          - valor: '1'
            mensaje: |
              Parece que has puesto las concentraciones iniciales, o que has
              dividido $2/3$ entre $2/3$. Lo que va abajo es lo que **queda**
              de cada reactivo, que es $1 - 2/3 = 1/3$.
          - valor: '0.44'
            mensaje: |
              Eso es $(2/3)^{2}$ a secas, sin dividir. Falta el denominador con
              lo que queda de ácido y de alcohol.
        pista: |
          Si se han formado $2/3$ de cada producto, de cada reactivo quedan
          $1 - 2/3 = 1/3$.
        desarrollo: |
          $$
          K_c = \frac{(2/3)(2/3)}{(1/3)(1/3)} = \frac{4/9}{1/9} = 4
          $$

      - tipo: calcular
        titulo: El éster al partir de tres moles de alcohol
        pregunta: |
          Partiendo de 3 mol de alcohol y 1 mol de ácido, ¿cuántos moles de
          éster hay en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.90'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '0.667'
            mensaje: |
              Ese es el resultado del primer apartado. Al cambiar las
              cantidades de partida cambia el punto de equilibrio, aunque
              $K_c$ siga valiendo 4.
          - valor: '1'
            mensaje: |
              Sería así si la reacción fuera completa: el ácido es el
              limitante y se acabaría entero. Pero es un equilibrio y siempre
              queda algo sin reaccionar — poco, un 10 %, pero queda.
          - valor: '3'
            mensaje: |
              Has tomado el alcohol como limitante. Hay 3 mol de alcohol pero
              solo 1 de ácido, y la reacción va mol a mol.
        pista: |
          Monta la tabla con $x$ moles formados y resuelve
          $\dfrac{x^{2}}{(3-x)(1-x)} = 4$.
        desarrollo: |
          $$
          \frac{x^{2}}{(3-x)(1-x)} = 4 \quad\Longrightarrow\quad x^{2} = 4(3 - 4x + x^{2})
          $$

          $$
          3x^{2} - 16x + 12 = 0 \quad\Longrightarrow\quad x = 0{,}90
          $$

          La otra raíz, $4{,}43$, se descarta: no puede formarse más éster que
          el ácido disponible. Y el ácido que queda es
          $1 - 0{,}90 = 0{,}10$ mol.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Con 1 mol de cada reactivo y 2/3 de cada producto en el equilibrio, de cada reactivo queda 1/3.'
          - texto: 'Como hay dos moles a cada lado de la ecuación, el volumen se cancela y Kc se puede escribir con moles: Kc = (2/3)² / (1/3)² = 4.'
          - texto: 'Al partir de 3 mol de alcohol y 1 de ácido, Kc sigue valiendo 4 porque solo depende de la temperatura.'
          - texto: 'Resolviendo 3x² − 16x + 12 = 0 sale x = 0,90 mol de éster, y quedan 0,10 mol de ácido.'
          - texto: 'Como se ha triplicado el alcohol, la cantidad de éster también se triplica respecto del primer apartado.'
            trampa: true
            mensaje: |
              Un equilibrio no responde en proporción. Triplicar el alcohol
              subió el éster de 0,67 a 0,90 mol, un 35 %, no un 200 %: el
              ácido sigue siendo el limitante y no puede dar más de 1 mol
              hiciera lo que hiciera el alcohol. Es Le Chatelier funcionando,
              pero con rendimientos decrecientes.
    resolucion: |
      **a · La constante.** Lo primero es darse cuenta de que el volumen no
      hace falta. $K_c$ lleva concentraciones, y cada concentración es
      $n/V$; con dos moles arriba y dos abajo, los cuatro $V$ se cancelan y
      se puede trabajar con moles directamente. **Eso solo pasa cuando
      $\Delta n = 0$**, y conviene comprobarlo antes de usarlo.

      Si se han formado $2/3$ de mol de éster, se han consumido $2/3$ de cada
      reactivo y queda $1/3$ de cada uno:

      $$
      K_c = \frac{(2/3)(2/3)}{(1/3)(1/3)} = 4
      $$

      **b · Otra mezcla de partida, la misma constante.** $K_c$ solo depende
      de la temperatura, así que sigue valiendo 4. Con $x$ moles de éster
      formados:

      | | ácido | alcohol | éster | agua |
      |---|---|---|---|---|
      | inicio | 1 | 3 | 0 | 0 |
      | equilibrio | $1-x$ | $3-x$ | $x$ | $x$ |

      $$
      \frac{x^{2}}{(3-x)(1-x)} = 4 \quad\Longrightarrow\quad 3x^{2} - 16x + 12 = 0
      $$

      $$
      x = \frac{16 \pm \sqrt{112}}{6} \quad\Longrightarrow\quad x = 0{,}90 \ \text{o} \ x = 4{,}43
      $$

      **Se descarta la segunda raíz**, y no por gusto: solo hay 1 mol de
      ácido, así que no pueden formarse 4,43 mol de éster. Toda cuadrática de
      equilibrio da dos raíces y siempre hay que decir por qué se tira una.

      $$
      n_{\text{éster}} = 0{,}90\ \mathrm{mol} \qquad n_{\text{ácido}} = 0{,}10\ \mathrm{mol}
      $$

      **Lo que enseña.** Triplicar el alcohol ha subido el éster de 0,67 a
      0,90 mol. Es Le Chatelier —más reactivo empuja hacia los productos—
      pero **no en proporción**: el ácido sigue siendo el limitante y pone el
      techo en 1 mol. Es el argumento industrial de por qué se trabaja con
      exceso de uno de los dos, y por qué llega un punto en que dejar de
      compensar.

  # ── Los problemas propuestos del tema 8 que faltaban: el 2 y del 5 al 11.
  #    Van cada uno en su sitio del orden de la colección (§04): el 2 entre el
  #    1 y el 3, y del 5 al 11 detrás del 4. La colección publica la respuesta
  #    final de cada uno; el desarrollo, los distractores y los errores típicos
  #    son nuestros. Donde su cifra no sale de los datos, se dice.
  - id: colfq8-2-el-agua-que-deshace-el-ester
    titulo: El agua que deshace el éster, y la que se gasta en deshacerlo
    fuente: >-
      Problema 2 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      La constante de equilibrio a 100 ºC para la formación del acetato de
      etilo a partir de ácido acético y etanol es igual a 4. Calcular la
      cantidad de agua que debe añadirse a 100 g de acetato de etilo para que
      se descompongan 40 g de ester.

      $$
      \mathrm{CH_3\text{-}COOH} + \mathrm{CH_3\text{-}CH_2OH} \;\rightleftharpoons\; \mathrm{CH_3\text{-}COO\text{-}CH_2\text{-}CH_3} + \mathrm{H_2O}
      $$
    pide: La masa de agua que hay que añadir para que se descompongan 40 g del éster.

    pasos:
      - tipo: reconocer
        pregunta: |
          La constante es la de **formación** del éster, y el problema va al
          revés: se echa agua para deshacerlo. ¿Qué haces con el 4?
        opciones:
          - texto: >-
              Lo uso tal cual, con el éster y el agua arriba: es el mismo
              equilibrio, leído desde el otro lado
            correcta: true
            mensaje: |
              Eso es. Un equilibrio no tiene sentido de marcha: la expresión
              $K_c = [\text{éster}][\mathrm{H_2O}]/([\text{ácido}][\text{alcohol}]) = 4$
              vale se llegue desde donde se llegue. Lo único que cambia es qué
              columnas de la tabla empiezan en cero.
          - texto: >-
              Uso 1/4 con esa misma expresión, porque ahora la reacción va
              hacia la izquierda
            mensaje: |
              Mezclas dos cosas. Si escribes la hidrólisis como reacción, su
              constante es 1/4, pero entonces el ácido y el alcohol van arriba.
              Invertir el número sin invertir la expresión da 9,5 g de agua en
              vez de 30.
          - texto: >-
              No se puede usar sin el volumen de la mezcla
            mensaje: |
              Aquí el volumen se cancela: hay dos moles a cada lado, así que
              los cuatro $1/V$ de las concentraciones se van. Por eso el
              enunciado no lo da.
          - texto: >-
              No sirve, porque al principio no hay ácido ni alcohol y el
              cociente sale infinito
            mensaje: |
              Al principio el cociente sí es infinito —ácido y alcohol valen
              cero y están abajo—, y eso solo dice que la reacción irá hacia la
              izquierda. La constante se escribe con las cantidades del
              equilibrio, y ahí sí hay ácido y alcohol: los que salen de los
              40 g de éster que se descomponen.

      - tipo: calcular
        titulo: El agua que queda en el equilibrio
        pregunta: |
          Con 40 g de éster descompuestos (masa molar 88 g/mol), ¿cuántos
          moles de agua tiene que haber en el equilibrio?
        respuesta:
          tipo: numero
          valor: '1.212'
          tolerancia: 0.01
          formato: los moles de agua, con tres cifras decimales
        distractores:
          - valor: '0.0758'
            mensaje: |
              Has usado 1/4 con la expresión de la formación. El 4 va con el
              éster y el agua arriba, que es como lo da el enunciado; con 1/4
              salen 0,076 mol, dieciséis veces menos.
          - valor: '0.727'
            mensaje: |
              Has dejado el éster en 100 g, como si no se descompusiera nada.
              En el equilibrio quedan $100 - 40 = 60$ g, o sea 0,6818 mol, y
              no 1,136.
        pista: |
          Se descomponen $40/88 = 0{,}4545$ mol de éster: se forman otros
          tantos de ácido y de alcohol, y quedan $60/88 = 0{,}6818$ mol de
          éster.
        desarrollo: |
          $$
          n_{\text{ácido}} = n_{\text{alcohol}} = \frac{40}{88} = 0{,}4545 \qquad n_{\text{éster}} = \frac{60}{88} = 0{,}6818
          $$

          Con dos moles a cada lado, los volúmenes se cancelan y la constante
          va con moles:

          $$
          n_{\mathrm{H_2O}} = \frac{4 \cdot 0{,}4545^{2}}{0{,}6818} = 1{,}212\ \text{mol}
          $$

      - tipo: calcular
        titulo: El agua que hay que añadir
        pregunta: |
          ¿Cuántos gramos de agua hay que añadir a los 100 g de éster?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.3
          formato: la masa de agua en gramos, con una cifra decimal
        distractores:
          - valor: '21.8'
            mensaje: |
              Es el agua que queda en el equilibrio, 1,212 mol, pasada a
              gramos. Falta la que se ha gastado: cada mol de éster que se
              descompone consume un mol de agua, y se han descompuesto 0,4545.
          - valor: '9.55'
            mensaje: |
              Sale de usar 1/4 con la expresión de la formación: 0,076 mol de
              agua en el equilibrio, más los 0,4545 gastados. El 4 del
              enunciado va con el éster y el agua arriba.
          - valor: '1.67'
            mensaje: |
              Son los moles de agua, no los gramos. Multiplica por 18.
        pista: |
          El agua que añades es la del equilibrio **más** la que ha reaccionado
          con el éster: un mol por cada mol descompuesto.
        desarrollo: |
          $$
          n_{\text{añadida}} = 1{,}212 + 0{,}4545 = 1{,}667\ \text{mol}
          $$

          $$
          m = 1{,}667 \cdot 18 = 30{,}0\ \text{g}
          $$

          Es la respuesta de la colección. Con fracciones sale redondo:
          $40/33 + 5/11 = 5/3$ mol, exactamente 30 g. Con las masas molares de
          tabla, 88,106 y 18,015 g/mol, salen 29,99 g.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se descomponen 40/88 = 0,4545 mol de éster, y se forman otros
              tantos moles de ácido y de alcohol.
          - texto: >-
              En el equilibrio quedan 60 g de éster, 0,6818 mol.
          - texto: >-
              Con dos moles a cada lado el volumen se cancela, y $K_c = 4$ da
              1,212 mol de agua en el equilibrio.
          - texto: >-
              A esa agua se le suman los 0,4545 mol que se han gastado: 1,667
              mol, 30 g.
          - texto: >-
              El agua que hay que añadir es la que queda en el equilibrio,
              porque el agua no se consume: solo hace de disolvente.
            trampa: true
            mensaje: |
              Aquí el agua es un reactivo de la hidrólisis: cada molécula de
              éster que se rompe gasta una de agua. Si añades solo los 21,8 g
              del equilibrio, la reacción se para antes de romper los 40 g de
              éster.
        veredicto: |
          El agua juega dos papeles: la que se gasta rompiendo el éster y la
          que queda en el equilibrio. Se añaden las dos.

    resolucion: |
      **La reacción, leída al revés.** La constante es la de formación del
      éster, y aquí se parte de éster y agua para romperlo. No hace falta otra
      constante: el equilibrio es el mismo, y en él

      $$
      K_c = \frac{[\text{éster}][\mathrm{H_2O}]}{[\text{ácido}][\text{alcohol}]} = 4
      $$

      Hay dos moles a cada lado, así que el volumen se cancela y todo va con
      moles. Con $n$ moles de agua añadidos y 40 g de éster roto (masa molar
      88 g/mol):

      | | ácido | alcohol | éster | agua |
      |---|---|---|---|---|
      | inicio | 0 | 0 | 1,136 | $n$ |
      | equilibrio | 0,4545 | 0,4545 | 0,6818 | $n - 0{,}4545$ |

      $$
      4 = \frac{0{,}6818\,(n - 0{,}4545)}{0{,}4545^{2}}
      \quad\Longrightarrow\quad
      n - 0{,}4545 = 1{,}212\ \text{mol}
      $$

      $$
      n = 1{,}667\ \text{mol}
      \quad\Longrightarrow\quad
      \boxed{m_{\mathrm{H_2O}} = 30\ \text{g}}
      $$

      Coincide con la colección.

      **El error que da 21,8 g.** Es quedarse con el agua del equilibrio y
      olvidar que el agua es un reactivo más: la hidrólisis gasta un mol de
      agua por cada mol de éster roto. La tabla lo evita sola, si la columna
      del agua se escribe como las otras, con lo que entra y lo que cambia.

      **Lo que enseña, de paso.** Para romper el 40 % del éster hace falta
      bastante más agua de la que pide la estequiometría, 0,4545 mol: casi
      cuatro veces más. Es Le Chatelier en versión práctica: un exceso de un
      reactivo es lo que empuja un equilibrio poco favorable hacia donde se
      quiere.

  - id: colfq8-3-el-amoniaco-y-el-paso-de-kc-a-kp
    titulo: El amoniaco, y el exponente que decide si Kp sube o baja
    fuente: >-
      Problema 3 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Para determinar la constante, a 700 ºC, de la reacción:

      $$
      \mathrm{N_2\,(g)} + 3\,\mathrm{H_2\,(g)} \;\rightleftharpoons\; 2\,\mathrm{NH_3\,(g)}
      $$

      se han mezclado 0,652 g de hidrógeno y 12,292 g de nitrógeno en un
      recipiente de 1 L. Se ha calculado que el sistema en el equilibrio
      contenía un total de 0,657 moles. Calcular las constantes de equilibrio
      Kc y Kp de dicha reacción, a la temperatura dada.
    pide: Las constantes Kc y Kp a 700 ºC.

    pasos:
      - tipo: reconocer
        pregunta: |
          El único dato del equilibrio es el número **total** de moles.
          ¿Cómo se saca de ahí cuánto ha reaccionado?
        opciones:
          - texto: Porque la reacción consume 4 moles y produce 2, así que el total baja en 2 por cada avance
            correcta: true
            mensaje: |
              Ese es el truco del problema. $\Delta n = 2 - 4 = -2$, así que
              cada mol de avance hace desaparecer dos moles del recuento
              total. La diferencia entre el total inicial y el final, dividida
              entre dos, da el avance.
          - texto: Repartiendo los 0,657 moles a partes iguales entre las tres especies
            mensaje: |
              No hay ninguna razón para que estén repartidos por igual: las
              cantidades iniciales son distintas y los coeficientes también.
              El total es una suma, no un promedio.
          - texto: No se puede; falta saber cuánto amoniaco se ha formado
            mensaje: |
              Sí se puede, y es justo lo que evalúa el problema. El total de
              moles cambia **solo** porque la reacción avanza, así que su
              variación mide el avance.
          - texto: Suponiendo que el hidrógeno se agota, por ser el limitante
            mensaje: |
              En un equilibrio no se agota nada. Y además el total final,
              0,657, es mayor que cero por mucho: si el hidrógeno se hubiera
              agotado el total sería otro.

      - tipo: calcular
        titulo: La constante en concentraciones
        pregunta: |
          Con las masas molares en números redondos —2 para el H₂ y 28 para el
          N₂— y el recipiente de 1 L, ¿cuánto vale $K_c$?
        respuesta:
          tipo: numero
          valor: '6.87'
          tolerancia: 0.05
          formato: un número, con dos decimales
        distractores:
          - valor: '0.146'
            mensaje: |
              Tienes la constante invertida: es el $K_c$ de la
              descomposición del amoniaco, no el de su formación. Los
              productos van arriba.
          - valor: '0.657'
            mensaje: |
              Eso es el total de moles del equilibrio, que es un dato de
              partida y no el resultado.
          - valor: '1.75'
            mensaje: |
              Parece que has olvidado elevar el hidrógeno al cubo. El
              exponente de cada especie en $K_c$ es su coeficiente
              estequiométrico, y el del H₂ es 3.
        pista: |
          El total baja de $0{,}765$ a $0{,}657$, o sea $0{,}108$; divide entre
          2 para el avance y monta la tabla.
        desarrollo: |
          Moles iniciales: $0{,}652/2 = 0{,}326$ de H₂ y $12{,}292/28 = 0{,}439$
          de N₂, en total $0{,}765$.

          Como $\Delta n = -2$, el avance es
          $x = (0{,}765 - 0{,}657)/2 = 0{,}054$.

          | | N₂ | H₂ | NH₃ |
          |---|---|---|---|
          | inicio | 0,439 | 0,326 | 0 |
          | equilibrio | 0,385 | 0,164 | 0,108 |

          Y como el volumen es 1 L, los moles son concentraciones:

          $$
          K_c = \frac{0{,}108^{2}}{0{,}385 \times 0{,}164^{3}} = 6{,}87
          $$

      - tipo: calcular
        titulo: La constante en presiones
        pregunta: |
          Pasando a presiones con $R = 0{,}0821$ y $T = 973$ K, ¿cuánto vale
          $K_p$?
        respuesta:
          tipo: numero
          valor: '1.08e-3'
          tolerancia: 2e-5
          formato: un número en notación científica, como 1,08e-3
        distractores:
          - valor: '6.87'
            mensaje: |
              Ese es $K_c$. Como $\Delta n \neq 0$, las dos constantes no
              coinciden — y aquí se diferencian en cuatro órdenes de magnitud.
          - valor: '0.0860'
            mensaje: |
              Has usado $\Delta n = -1$. Cuenta bien: dos moles de gas a la
              derecha y cuatro a la izquierda, así que $\Delta n = -2$.
          - valor: '43823'
            mensaje: |
              Tienes el signo del exponente al revés, has usado $+2$. Al
              haber menos moles de gas en los productos, $K_p$ tiene que
              salir **menor** que $K_c$, no mayor.
        pista: |
          $K_p = K_c (RT)^{\Delta n}$, con $\Delta n$ contando solo los gases.
        desarrollo: |
          $$
          \Delta n = 2 - (1 + 3) = -2
          $$

          $$
          RT = 0{,}0821 \times 973 = 79{,}88
          $$

          $$
          K_p = 6{,}87 \times 79{,}88^{-2} = \frac{6{,}87}{6381} = 1{,}08 \times 10^{-3}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los moles iniciales son 0,326 de H₂ y 0,439 de N₂, en total 0,765.'
          - texto: 'La reacción consume cuatro moles de gas y produce dos, así que Δn = −2 y el total baja el doble del avance.'
          - texto: 'De 0,765 − 0,657 = 0,108 sale un avance de 0,054, y con él la tabla del equilibrio.'
          - texto: 'Con el recipiente de 1 L los moles son concentraciones, y Kc = 0,108² / (0,385 × 0,164³) = 6,87.'
          - texto: 'Kp = Kc (RT)^Δn = 6,87 × 79,88⁻² = 1,08 × 10⁻³.'
          - texto: 'Kp sale menor que Kc porque las presiones son números más pequeños que las concentraciones.'
            trampa: true
            mensaje: |
              El motivo es el exponente, no el tamaño de los números —a 973 K
              las presiones son de hecho **mayores** que las concentraciones—.
              $K_p$ sale menor porque $\Delta n$ es negativo, así que $(RT)$
              divide en vez de multiplicar. Con $\Delta n$ positivo saldría al
              revés, y con $\Delta n = 0$ las dos serían iguales.
    resolucion: |
      **El dato que parece insuficiente y no lo es.** Lo único que se sabe del
      equilibrio es el número total de moles, 0,657. Sirve porque la reacción
      **cambia** ese total: consume cuatro moles de gas y produce dos, así que
      $\Delta n = -2$ y cada mol de avance hace desaparecer dos del recuento.

      Los iniciales, con las masas molares redondeadas que usa la colección:

      $$
      n_{\mathrm{H_2}} = \frac{0{,}652}{2} = 0{,}326 \qquad n_{\mathrm{N_2}} = \frac{12{,}292}{28} = 0{,}439
      $$

      Total inicial $0{,}765$, y por tanto

      $$
      x = \frac{0{,}765 - 0{,}657}{2} = 0{,}054
      $$

      | | N₂ | H₂ | NH₃ |
      |---|---|---|---|
      | inicio | 0,439 | 0,326 | 0 |
      | cambio | $-x$ | $-3x$ | $+2x$ |
      | equilibrio | 0,385 | 0,164 | 0,108 |

      **Kc.** El recipiente es de 1 L, así que los moles **son** las
      concentraciones. Es una comodidad del enunciado, no una regla general:

      $$
      K_c = \frac{[\mathrm{NH_3}]^{2}}{[\mathrm{N_2}][\mathrm{H_2}]^{3}} = \frac{0{,}108^{2}}{0{,}385 \times 0{,}164^{3}} = 6{,}87
      $$

      **Kp.** Con $T = 700 + 273 = 973$ K:

      $$
      K_p = K_c (RT)^{\Delta n} = 6{,}87 \times (0{,}0821 \times 973)^{-2} = 1{,}08 \times 10^{-3}
      $$

      **Dos avisos que valen para todo el tema.**

      El primero es el **signo del exponente**. Con $\Delta n$ negativo,
      $(RT)$ divide, y como $RT \approx 80$ eso hunde la constante cuatro
      órdenes de magnitud. Antes de dar el número conviene preguntarse hacia
      dónde tiene que ir: menos moles de gas en los productos, $K_p$ menor.

      El segundo es de **masas molares**. Aquí se han usado 2 y 28 porque son
      las que reproducen la respuesta publicada, $6{,}87$. Con los valores de
      tabla —2,016 y 28,014— sale $6{,}31$, un 8 % menos. No es un error de
      nadie: es que en un problema donde se resta $0{,}765 - 0{,}657$, una
      diferencia pequeña entre dos números grandes se amplifica. **Cuando un
      resultado se obtiene restando dos cantidades parecidas, conviene decir
      con qué datos se ha calculado.**

  - id: colfq8-4-la-caliza-y-el-solido-que-no-entra
    titulo: La caliza, y los sólidos que no aparecen en la constante
    fuente: >-
      Problema 4 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      A 1000 K la Kp para la descomposición del CaCO3 (s) en CaO (s) y CO2 (g)
      es de 4 x 10⁻⁵ atm. Se coloca un poco de CaCO3 (s) en un recipiente de
      5 L a 1000 K. Una vez establecido el equilibrio ¿Cuántos gramos de CaO
      (s) se han formado?
    pide: La masa de óxido de calcio formada en el equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción tiene dos sólidos y un gas. ¿Cómo se escribe $K_p$?
        opciones:
          - texto: $K_p = P_{\mathrm{CO_2}}$, porque los sólidos no entran en la constante
            correcta: true
            mensaje: |
              Eso es. Un sólido puro tiene actividad constante —su
              «concentración» no cambia por mucho que haya más o menos—, así
              que no aparece. Por eso $K_p$ de este equilibrio es simplemente
              la presión del dióxido de carbono.
          - texto: $K_p = P_{\mathrm{CO_2}} \cdot [\mathrm{CaO}] / [\mathrm{CaCO_3}]$
            mensaje: |
              Los dos sólidos no van en la expresión. Y fíjate en la
              consecuencia práctica de que sí fueran: la constante dependería
              de cuánta caliza has echado, y una constante no puede depender
              de eso.
          - texto: No se puede escribir, porque falta saber cuánto CaCO₃ hay
            mensaje: |
              Y esa es justo la razón por la que los sólidos no entran: el
              enunciado dice «un poco» a propósito. Mientras quede algo de
              caliza, la presión de equilibrio del CO₂ es la misma.
          - texto: $K_p = P_{\mathrm{CO_2}} \cdot P_{\mathrm{CaO}}$
            mensaje: |
              El CaO es sólido y no ejerce presión parcial. Solo los gases
              aparecen en $K_p$, y aquí el único es el CO₂.

      - tipo: calcular
        titulo: Los moles de gas
        pregunta: |
          Con $P_{\mathrm{CO_2}} = 4 \times 10^{-5}$ atm en 5 L a 1000 K,
          ¿cuántos moles de CO₂ hay?
        respuesta:
          tipo: numero
          valor: '2.44e-6'
          tolerancia: 5e-8
          formato: un número en notación científica, como 1,08e-3
        distractores:
          - valor: '4.87e-7'
            mensaje: |
              Has usado 1 L en vez de 5. El volumen del recipiente entra
              multiplicando en $n = PV/RT$.
          - valor: '1.22e-5'
            mensaje: |
              Parece que has usado 273 K en vez de 1000. La temperatura del
              enunciado es la del equilibrio, no la de condiciones normales.
        pista: |
          $n = \dfrac{PV}{RT}$, con $R = 0{,}0821$ y $T = 1000$ K.
        desarrollo: |
          $$
          n = \frac{4 \times 10^{-5} \times 5}{0{,}0821 \times 1000} = 2{,}44 \times 10^{-6}\ \mathrm{mol}
          $$

      - tipo: calcular
        titulo: Los gramos de óxido
        pregunta: |
          ¿Cuántos gramos de CaO se han formado? Masa molar del CaO,
          56,08 g/mol.
        respuesta:
          tipo: numero
          valor: '1.37e-4'
          tolerancia: 3e-6
          formato: un número en notación científica, como 1,37e-4, en gramos
        distractores:
          - valor: '2.44e-6'
            mensaje: |
              Esos son los moles, no los gramos. Falta multiplicar por la masa
              molar.
          - valor: '2.44e-4'
            mensaje: |
              Has multiplicado por 100, que es la masa molar del CaCO₃, no la
              del CaO. La pregunta es por el óxido formado.
        pista: |
          Por cada mol de CO₂ se forma un mol de CaO. Multiplica por 56,08.
        desarrollo: |
          La estequiometría es uno a uno, así que hay tantos moles de CaO como
          de CO₂:

          $$
          m = 2{,}44 \times 10^{-6} \times 56{,}08 = 1{,}37 \times 10^{-4}\ \mathrm{g}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los sólidos puros no aparecen en la constante, así que Kp = P(CO₂) = 4 × 10⁻⁵ atm.'
          - texto: 'Con esa presión, 5 L y 1000 K, los moles de CO₂ son n = PV/RT = 2,44 × 10⁻⁶.'
          - texto: 'La estequiometría es uno a uno, así que se han formado los mismos moles de CaO.'
          - texto: 'Y en gramos, 2,44 × 10⁻⁶ × 56,08 = 1,37 × 10⁻⁴ g: una cantidad minúscula.'
          - texto: 'Si se pusiera el doble de caliza se formaría el doble de óxido, porque hay el doble de reactivo disponible.'
            trampa: true
            mensaje: |
              No. La presión de equilibrio del CO₂ la fija $K_p$ y nada más, y
              con el mismo volumen y la misma temperatura salen los mismos
              moles de gas — y por tanto los mismos de óxido. Añadir sólido no
              desplaza un equilibrio heterogéneo; es la otra cara de que los
              sólidos no entren en la constante. Lo que sí lo cambiaría es
              cambiar el volumen.
    resolucion: |
      **La regla que hace corto el problema.** En un equilibrio heterogéneo
      los **sólidos puros y los líquidos puros no aparecen en la constante**.
      La razón es que su actividad no cambia: un trozo de caliza tiene la
      misma densidad tanto si hay un gramo como un kilo. Así que aquí

      $$
      K_p = P_{\mathrm{CO_2}} = 4 \times 10^{-5}\ \mathrm{atm}
      $$

      y la presión del CO₂ está fijada por la temperatura, sin más.

      **El resto es gases ideales.**

      $$
      n = \frac{PV}{RT} = \frac{4 \times 10^{-5} \times 5}{0{,}0821 \times 1000} = 2{,}44 \times 10^{-6}\ \mathrm{mol}
      $$

      Y como la descomposición produce un mol de CaO por cada mol de CO₂:

      $$
      m_{\mathrm{CaO}} = 2{,}44 \times 10^{-6} \times 56{,}08 = 1{,}37 \times 10^{-4}\ \mathrm{g}
      $$

      **Lo que hay que ver, y no es el número.** Son 0,137 miligramos: una
      cantidad que no se pesa en una balanza de clase. Y sin embargo el
      proceso industrial de calcinar caliza para hacer cal funciona a escala
      de toneladas. La diferencia está en que **en la industria el CO₂ se
      retira continuamente**: al quitar el producto, el equilibrio nunca se
      alcanza y la reacción sigue avanzando.

      Ese es el uso real de Le Chatelier en este tema, y explica por qué el
      «poco CaCO₃» del enunciado no es un descuido: da igual cuánto pongas,
      porque en un recipiente cerrado el gas se para en la misma presión
      siempre.

  - id: colfq8-5-el-solido-que-da-dos-gases
    titulo: Un sólido que da dos gases, y las dos constantes que salen de una presión
    fuente: >-
      Problema 5 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Dado el equilibrio siguiente a 295 K:

      $$
      \mathrm{NH_4HS\,(s)} \;\rightleftharpoons\; \mathrm{NH_3\,(g)} + \mathrm{H_2S\,(g)}
      $$

      La presión parcial de cada gas es de 0,265 atm. Calcular Kp y Kc para
      la reacción
    pide: Las constantes Kp y Kc de la descomposición a 295 K.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción tiene un sólido a la izquierda y dos gases a la derecha.
          ¿Cómo queda $K_p$?
        opciones:
          - texto: >-
              $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$: el sólido no
              entra
            correcta: true
            mensaje: |
              Eso es. Un sólido puro no tiene presión parcial ni una
              concentración que cambie, así que no aparece. La constante es el
              producto de las dos presiones, y como las dos valen 0,265 atm,
              es un cuadrado.
          - texto: >-
              $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}/P_{\mathrm{NH_4HS}}$
            mensaje: |
              El NH4HS es sólido: no ejerce presión parcial. Si entrara, la
              constante dependería de cuánto sólido hay en el recipiente, y no
              depende.
          - texto: >-
              $K_p = P_{\mathrm{NH_3}} + P_{\mathrm{H_2S}}$
            mensaje: |
              Eso es la presión total, 0,53 atm. En una constante las presiones
              se multiplican, cada una elevada a su coeficiente.
          - texto: >-
              No se puede escribir sin saber cuánto NH4HS hay
            mensaje: |
              La cantidad de sólido no entra en la constante: mientras quede
              algo, las presiones de equilibrio son las mismas. Por eso el
              enunciado no la da.

      - tipo: calcular
        titulo: La constante en presiones
        pregunta: ¿Cuánto vale $K_p$?
        respuesta:
          tipo: numero
          valor: '0.0702'
          tolerancia: 0.0005
          formato: la constante en atm², con cuatro cifras decimales
        distractores:
          - valor: '0.53'
            mensaje: |
              Has sumado las dos presiones. En la constante se multiplican:
              $0{,}265 \cdot 0{,}265$.
          - valor: '0.265'
            mensaje: |
              Te has quedado con una sola presión. Los dos gases entran en la
              constante, cada uno con su presión.
        pista: |
          $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$, y las dos valen
          0,265 atm.
        desarrollo: |
          $$
          K_p = 0{,}265 \cdot 0{,}265 = 0{,}0702\ \mathrm{atm^{2}}
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: La constante en concentraciones
        pregunta: |
          Con $R = 0{,}082$ atm·L/(mol·K), ¿cuánto vale $K_c$?
        respuesta:
          tipo: numero
          valor: '1.20e-4'
          tolerancia: 3e-6
          formato: la constante en (mol/L)², en notación científica, como 3,5e-4
        distractores:
          - valor: '41.1'
            mensaje: |
              Has multiplicado por $(RT)^{2}$ en vez de dividir. De
              $K_p = K_c\,(RT)^{\Delta n}$ se despeja $K_c = K_p/(RT)^{2}$: con
              gas en los productos y ninguno en los reactivos, $K_c$ tiene que
              salir menor que $K_p$.
          - valor: '2.90e-3'
            mensaje: |
              Has usado $\Delta n = 1$, restando el sólido. El sólido no cuenta:
              $\Delta n = 2 - 0 = 2$.
          - valor: '1.17e-8'
            mensaje: |
              Has usado $R = 8{,}314$ J/(mol·K). Con presiones en atmósferas y
              concentraciones en mol/L, la R es 0,082 atm·L/(mol·K).
        pista: |
          $K_p = K_c\,(RT)^{\Delta n}$, y en $\Delta n$ solo cuentan los gases.
        desarrollo: |
          $$
          \Delta n = 2 - 0 = 2 \qquad RT = 0{,}082 \cdot 295 = 24{,}19
          $$

          $$
          K_c = \frac{0{,}0702}{24{,}19^{2}} = 1{,}20\cdot 10^{-4}
          $$

          Es la respuesta de la colección, $1{,}2\cdot 10^{-4}$ (mol/L)². Con
          $R = 0{,}08206$ sale $1{,}198\cdot 10^{-4}$: lo mismo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El NH4HS es sólido y no entra en la constante:
              $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$.
          - texto: >-
              Con las dos presiones a 0,265 atm, $K_p = 0{,}265^{2} = 0{,}0702$
              atm².
          - texto: >-
              Solo cuentan los gases: $\Delta n = 2$.
          - texto: >-
              $K_c = K_p/(RT)^{2} = 0{,}0702/24{,}19^{2} = 1{,}2\cdot 10^{-4}$
              (mol/L)².
          - texto: >-
              Como el sólido tiene coeficiente 1, $\Delta n = 2 - 1 = 1$ y
              $K_c = K_p/RT$.
            trampa: true
            mensaje: |
              El sólido tampoco cuenta en $\Delta n$: el exponente de $RT$ sale
              de pasar presiones de gas a concentraciones, y el sólido no
              tiene ni una cosa ni la otra. Con $\Delta n = 1$ sale
              $2{,}9\cdot 10^{-3}$, veinticuatro veces más.
        veredicto: |
          El sólido no está en la constante ni en $\Delta n$, y por la misma
          razón: no tiene presión que pasar a concentración.

    resolucion: |
      **La constante, sin el sólido.** El NH4HS es un sólido puro y no
      aparece: su «concentración» no cambia por mucho que haya más o menos.
      Solo entran los dos gases:

      $$
      K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}} = 0{,}265 \cdot 0{,}265 = 0{,}0702\ \mathrm{atm^{2}}
      $$

      **De Kp a Kc.** Con $\Delta n = 2 - 0 = 2$, contando solo gases:

      $$
      K_c = \frac{K_p}{(RT)^{2}} = \frac{0{,}0702}{(0{,}082 \cdot 295)^{2}} = 1{,}20\cdot 10^{-4}\ (\text{mol/L})^{2}
      $$

      Las dos coinciden con la colección: 0,0702 atm² y $1{,}2\cdot 10^{-4}$
      (mol/L)².

      **Por qué las dos presiones son iguales.** No es un dato casual: si
      todo el gas sale del sólido, sale de uno en uno, un NH3 por cada H2S, y
      las dos presiones van a la par. Es lo que permite, en otros problemas,
      sacar las dos presiones de la constante con una raíz cuadrada.

      **Y el control de sentido.** Con gas en los productos y ninguno en los
      reactivos, $K_c$ tiene que salir menor que $K_p$, porque $RT$ vale 24 y
      va dividiendo al cuadrado. Si sale 41, has multiplicado.

  - id: colfq8-6-el-cloro-que-hay-que-anadir
    titulo: El cloro que hay que añadir para convertir el 90 %, y un sólido que es gas
    fuente: >-
      Problema 6 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. El enunciado escribe PCl3 (s) donde tiene que
      decir PCl3 (g).
    nivel: practica
    enunciado: |
      Una mezcla gaseosa contiene 0,2 moles de pentacloruro de fósforo y 0,4
      moles de tricloruro de fósforo en un recipiente de 100 mL a 240 ºC. Se
      pretende convertir el 90% de tricloruro de fósforo presente en
      pentacloruro de fósforo según la reacción:

      $$
      \mathrm{PCl_3\,(s)} + \mathrm{Cl_2\,(g)} \;\rightleftharpoons\; \mathrm{PCl_5\,(g)}
      $$

      para la cual Kc = 20 mol⁻¹ L a 240 ºC. Para lograr lo anterior: a) ¿Cuál
      será la concentración de cloro en el equilibrio? b) ¿Cuál será el número
      de moles totales de cloro que se debe agregar?

      *La ecuación escribe el tricloruro de fósforo como sólido, PCl3 (s). Es
      gas: la primera frase habla de una mezcla gaseosa, las unidades de Kc
      solo cuadran con dos concentraciones abajo, y la respuesta de la
      colección solo sale si el PCl3 entra en la constante.*
    pide: La concentración de cloro en el equilibrio y los moles totales de cloro que hay que añadir.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación del enunciado escribe PCl3 (s). ¿Entra el PCl3 en la
          constante?
        opciones:
          - texto: >-
              Sí: es un gas, y el (s) es una errata; la propia frase habla de
              una mezcla gaseosa
            correcta: true
            mensaje: |
              Eso es. Con el PCl3 dentro,
              $K_c = [\mathrm{PCl_5}]/([\mathrm{PCl_3}][\mathrm{Cl_2}])$, y las
              unidades lo confirman: mol⁻¹ L es lo que sale con dos
              concentraciones abajo y una arriba. Así se llega a la solución de
              la colección, 0,7 M.
          - texto: >-
              No: es sólido, y los sólidos no entran
            mensaje: |
              Tomado al pie de la letra sale [Cl2] = 0,28 M, que no es la
              solución de la colección. Y el propio enunciado avisa dos veces:
              habla de una mezcla gaseosa y da Kc en mol⁻¹ L, unidades que solo
              cuadran con dos concentraciones abajo.
          - texto: >-
              Entra en Kp pero no en Kc
            mensaje: |
              Una especie entra en las dos constantes o en ninguna: $K_p$ y
              $K_c$ describen el mismo equilibrio, una con presiones y otra
              con concentraciones.
          - texto: >-
              Solo si está en exceso
            mensaje: |
              Estar en exceso no decide nada. Lo que decide si una especie
              entra es su estado: gases y disueltos sí, sólidos y líquidos
              puros no.

      - tipo: calcular
        titulo: El cloro del equilibrio
        pregunta: |
          a) ¿Cuál es la concentración de cloro en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.7'
          tolerancia: 0.005
          formato: la concentración en mol/L, con una cifra decimal
        distractores:
          - valor: '0.28'
            mensaje: |
              Has dejado el PCl3 fuera de la constante, como pide el (s) del
              enunciado: $[\mathrm{Cl_2}] = 5{,}6/20$. Es una errata: el PCl3
              es gas y entra, y con él sale 0,7 M.
          - valor: '0.45'
            mensaje: |
              Te has olvidado del PCl5 que ya había. En el equilibrio hay los
              0,2 mol de partida más los 0,36 que se forman: 0,56 mol, no
              0,36.
          - valor: '7'
            mensaje: |
              Has puesto moles en la constante. Con dos especies abajo y una
              arriba el volumen no se cancela: salen 0,7 mol de cloro, que en
              los 100 mL serían 7 M. Con concentraciones salen 0,07 mol, 0,7 M.
        pista: |
          Convertir el 90 % del PCl3 es gastar 0,36 mol: en el equilibrio
          quedan 0,04 mol de PCl3 y hay 0,56 de PCl5, en 0,1 L.
        desarrollo: |
          $$
          [\mathrm{PCl_5}] = \frac{0{,}2 + 0{,}36}{0{,}1} = 5{,}6\ \text{M} \qquad [\mathrm{PCl_3}] = \frac{0{,}04}{0{,}1} = 0{,}4\ \text{M}
          $$

          $$
          [\mathrm{Cl_2}] = \frac{[\mathrm{PCl_5}]}{K_c\,[\mathrm{PCl_3}]} = \frac{5{,}6}{20 \cdot 0{,}4} = 0{,}7\ \text{M}
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: El cloro que hay que añadir
        pregunta: |
          b) ¿Cuántos moles de cloro hay que añadir en total?
        respuesta:
          tipo: numero
          valor: '0.43'
          tolerancia: 0.005
          formato: los moles de cloro, con dos cifras decimales
        distractores:
          - valor: '0.07'
            mensaje: |
              Es solo el cloro que queda libre en el equilibrio. Falta el que
              se ha gastado en convertir el PCl3: 0,36 mol más.
          - valor: '0.36'
            mensaje: |
              Es solo el cloro que reacciona. Sin cloro sobrante no hay
              equilibrio con el 90 % convertido: la constante exige 0,7 M de
              cloro libre, 0,07 mol en los 100 mL.
          - valor: '1.06'
            mensaje: |
              Has sumado los 0,7 del apartado a) como si fueran moles. Son
              mol/L: en 0,1 L son 0,07 mol.
        pista: |
          El cloro que añades tiene que dar para las dos cosas: el que
          reacciona con el PCl3 y el que se queda libre en el equilibrio.
        desarrollo: |
          $$
          n_{\mathrm{Cl_2}} = 0{,}36 + 0{,}7 \cdot 0{,}1 = 0{,}43\ \text{mol}
          $$

          Es la respuesta de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Convertir el 90 % de 0,4 mol de PCl3 es gastar 0,36 mol: quedan
              0,04 mol de PCl3 y hay 0,56 de PCl5.
          - texto: >-
              En 0,1 L, eso es 0,4 M de PCl3 y 5,6 M de PCl5.
          - texto: >-
              La constante fija el cloro libre: [Cl2] = 5,6/(20 · 0,4) = 0,7 M.
          - texto: >-
              Hay que añadir el cloro que reacciona, 0,36 mol, más el que se
              queda libre, 0,07 mol: 0,43 mol.
          - texto: >-
              Con añadir los 0,36 mol que reaccionan es suficiente: el cloro
              que sobra no pinta nada.
            trampa: true
            mensaje: |
              Sin cloro sobrante el cociente no llega a 20: para sostener 5,6 M
              de PCl5 frente a 0,4 M de PCl3 hace falta 0,7 M de cloro libre.
              Con solo 0,36 mol, la reacción se para antes y convierte menos
              del 90 %.
        veredicto: |
          En un equilibrio, lo que se consume y lo que queda libre se añaden
          por separado. La constante manda sobre lo segundo.

    resolucion: |
      **Una errata antes de empezar.** La ecuación escribe PCl3 (s), pero es
      gas: el enunciado habla de una mezcla gaseosa y la constante se da en
      mol⁻¹ L, que es lo que sale con dos concentraciones abajo. Así que

      $$
      K_c = \frac{[\mathrm{PCl_5}]}{[\mathrm{PCl_3}][\mathrm{Cl_2}]} = 20
      $$

      **Lo que fija el 90 %.** No es un dato del equilibrio de partida sino
      del de llegada: se gastan $0{,}9 \cdot 0{,}4 = 0{,}36$ mol de PCl3, y en
      los 100 mL quedan

      $$
      [\mathrm{PCl_3}] = \frac{0{,}04}{0{,}1} = 0{,}4\ \text{M} \qquad [\mathrm{PCl_5}] = \frac{0{,}56}{0{,}1} = 5{,}6\ \text{M}
      $$

      **a · El cloro libre.** Es la única incógnita de la constante:

      $$
      [\mathrm{Cl_2}] = \frac{5{,}6}{20 \cdot 0{,}4} = \boxed{0{,}7\ \text{M}}
      $$

      **b · El cloro que hay que añadir.** El que reacciona, 0,36 mol, más
      el que queda libre, $0{,}7 \cdot 0{,}1 = 0{,}07$ mol:

      $$
      n = 0{,}36 + 0{,}07 = \boxed{0{,}43\ \text{mol}}
      $$

      Las dos coinciden con la colección.

      **El error de la errata.** Quien toma el (s) al pie de la letra deja el
      PCl3 fuera y obtiene $[\mathrm{Cl_2}] = 5{,}6/20 = 0{,}28$ M. La pista
      para no caer está en las unidades: con el PCl3 fuera,
      $K_c = [\mathrm{PCl_5}]/[\mathrm{Cl_2}]$ no tendría unidades, y el
      enunciado la da en mol⁻¹ L, que pide una concentración más abajo.

  - id: colfq8-7-el-pentacloruro-con-y-sin-cloro
    titulo: El pentacloruro de fósforo, solo y con cloro delante
    fuente: >-
      Problema 7 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Su 14,6 % del apartado b no sale de los datos
      del enunciado, que dan 14,5 %; sale si se redondea la constante a
      0,008. La diferencia no cambia nada y la casilla acepta las dos cifras.
    nivel: practica
    enunciado: |
      A 200 ºC la Kc para la reacción:

      $$
      \mathrm{PCl_5\,(g)} \;\rightleftharpoons\; \mathrm{PCl_3\,(g)} + \mathrm{Cl_2\,(g)}
      $$

      es igual a 0,007927. Hallar a) El grado de disociación del pentacloruro
      de fósforo a dicha temperatura, si en un matraz de 1 L existen 3,125 g
      de pentacloruro de fósforo, b) El grado de disociación de este
      pentacloruro de fósforo si el matraz estaba previamente lleno de 3,125 g
      de pentacloruro de fósforo y cloro en condiciones normales.
    pide: El grado de disociación del PCl5 solo en el matraz, y con el matraz lleno de cloro en condiciones normales.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) el matraz ya tiene cloro antes de que se disocie nada. ¿Qué le
          pasa al grado de disociación?
        opciones:
          - texto: >-
              Baja: el cloro es un producto de la disociación, y el equilibrio
              retrocede
            correcta: true
            mensaje: |
              Eso es. El cloro de partida ya ocupa parte del numerador de la
              constante, y el cociente se alcanza disociando mucho menos: del
              51 % se pasa al 14,5 %.
          - texto: >-
              Sube, porque hay más gas en el matraz
            mensaje: |
              Más gas no empuja en ningún sentido por sí mismo: depende de qué
              gas. El que hay es cloro, uno de los productos, y eso empuja
              hacia el PCl5.
          - texto: >-
              No cambia, porque Kc es la misma
            mensaje: |
              La constante es la misma y el grado no: son cosas distintas.
              $K_c$ fija el cociente, y con cloro de partida ese cociente se
              alcanza con menos PCl5 disociado.
          - texto: >-
              Se hace cero: con cloro presente el PCl5 ya no se disocia
            mensaje: |
              Retrocede, pero no se para: sin PCl3 en el matraz el cociente de
              partida es cero, menor que $K_c$, y algo de PCl5 tiene que
              disociarse para formarlo.

      - tipo: calcular
        titulo: El grado de disociación sin cloro
        pregunta: |
          a) Con el PCl5 solo en el matraz (masa molar 208,2 g/mol), ¿cuál es
          el grado de disociación?
        respuesta:
          tipo: numero
          valor: '50.92'
          tolerancia: 0.1
          formato: el grado de disociación en tanto por ciento, con dos decimales
        distractores:
          - valor: '72.68'
            mensaje: |
              Has despreciado $\alpha$ frente a 1: $\alpha = \sqrt{K_c/c}$. Aquí
              no vale, porque se disocia la mitad; esa aproximación solo sirve
              cuando $\alpha$ sale por debajo del 5 %.
          - valor: '34.56'
            mensaje: |
              Te has dejado el cuadrado de $\alpha$: has resuelto
              $K_c = c\alpha/(1-\alpha)$. Arriba van dos productos, PCl3 y Cl2,
              cada uno $c\alpha$, y abajo $c(1-\alpha)$: simplificando queda
              $c\alpha^{2}/(1-\alpha)$.
        pista: |
          Con $c = 0{,}01501$ M, $K_c = \dfrac{c\alpha^{2}}{1-\alpha}$: la
          ecuación de segundo grado entera, porque $\alpha$ no es pequeño.
        desarrollo: |
          $$
          c = \frac{3{,}125}{208{,}2 \cdot 1} = 0{,}01501\ \text{M}
          $$

          $$
          0{,}007927 = \frac{0{,}01501\,\alpha^{2}}{1-\alpha}
          \quad\Longrightarrow\quad
          0{,}01501\,\alpha^{2} + 0{,}007927\,\alpha - 0{,}007927 = 0
          $$

          $$
          \alpha = 0{,}5091 \;\longrightarrow\; 50{,}91\ \%
          $$

          La colección da 50,92 %, que es lo que sale con la masa molar sin
          redondear, 208,24 g/mol; con 208,5, 50,94 %. La casilla acepta las
          tres.

      - tipo: calcular
        titulo: El cloro de partida
        pregunta: |
          b) ¿Cuántos moles de cloro hay en el matraz de 1 L en condiciones
          normales?
        respuesta:
          tipo: numero
          valor: '0.0446'
          tolerancia: 0.0003
          formato: los moles de cloro, con cuatro cifras decimales
        distractores:
          - valor: '0.0258'
            mensaje: |
              Has calculado los moles a 200 ºC. El matraz se llenó en
              condiciones normales, 0 ºC y 1 atm; al calentarlo cambia la
              presión, no los moles.
          - valor: '0.0409'
            mensaje: |
              Has tomado 25 ºC, que son las condiciones estándar de la
              termodinámica. Las condiciones normales son 0 ºC y 1 atm: 22,4 L
              por mol.
        pista: |
          En condiciones normales, 0 ºC y 1 atm, un mol de gas ocupa 22,4 L.
        desarrollo: |
          $$
          n_{\mathrm{Cl_2}} = \frac{1}{22{,}4} = 0{,}0446\ \text{mol}
          $$

          Con $n = PV/RT$ sale lo mismo:
          $\frac{1 \cdot 1}{0{,}082 \cdot 273} = 0{,}0447$ mol.

      - tipo: calcular
        titulo: El grado de disociación con cloro
        pregunta: |
          b) ¿Cuál es el grado de disociación con ese cloro en el matraz?
        respuesta:
          tipo: numero
          valor: '14.48'
          tolerancia: 0.15
          formato: el grado de disociación en tanto por ciento, con una cifra decimal
        distractores:
          - valor: '50.92'
            mensaje: |
              Es el grado del apartado a), sin el cloro. Ese cloro es producto
              de la disociación y la frena: el grado tiene que salir menor.
          - valor: '15.08'
            mensaje: |
              Has despreciado el cloro que aporta la propia disociación,
              $c\alpha$, frente al de partida. Son 0,0022 mol frente a 0,0446:
              un 5 %, y en el resultado se nota.
          - valor: '21.46'
            mensaje: |
              Sale con los moles de cloro calculados a 200 ºC, 0,0258. El
              matraz se llenó en condiciones normales: 0,0446 mol.
        pista: |
          El cloro del equilibrio es el de partida más el de la disociación.
          Con $V = 1$ L,
          $K_c = \dfrac{\alpha\,(0{,}0446 + 0{,}01501\,\alpha)}{1-\alpha}$.
        desarrollo: |
          $$
          0{,}007927 = \frac{\alpha\,(0{,}0446 + 0{,}01501\,\alpha)}{1-\alpha}
          $$

          $$
          0{,}01501\,\alpha^{2} + 0{,}05253\,\alpha - 0{,}007927 = 0
          \quad\Longrightarrow\quad
          \alpha = 0{,}1449
          $$

          Un 14,5 %. La colección da 14,6 %: con los datos del enunciado
          salen entre 14,47 y 14,49 %, tomes 22,4 L o $RT$ con 0,082 y 273 K,
          y el 14,6 aparece si se redondea la constante a 0,008, que en el
          apartado a) daría 51,07 % y no el 50,92 que publica. No cambia la
          conclusión, y la casilla acepta las dos cifras.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              3,125 g de PCl5 en 1 L son 0,0150 mol/L.
          - texto: >-
              Solo en el matraz se disocia hasta $\alpha = 50{,}9$ %, que sale
              de la cuadrática porque $\alpha$ no es pequeño.
          - texto: >-
              En b) el matraz tiene además 0,0446 mol de cloro: 1 L en
              condiciones normales.
          - texto: >-
              Ese cloro es producto de la disociación: el equilibrio retrocede
              y $\alpha$ baja al 14,5 %.
          - texto: >-
              Como $K_c$ no ha cambiado, el grado de disociación tampoco: sigue
              siendo del 50,9 %.
            trampa: true
            mensaje: |
              La constante es la misma y el grado no. $K_c$ fija el cociente,
              y con cloro de partida el cociente se alcanza disociando mucho
              menos. Es lo mismo que en el tema 9 se llama efecto del ion
              común, aquí con gases.
        veredicto: |
          La constante no cambia; lo que cambia es cuánto hay que disociar
          para llegar a ella.

    resolucion: |
      **a · El PCl5 solo.** Con la masa molar 208,2 g/mol, 3,125 g en 1 L son
      $c = 0{,}01501$ M. Si se disocia una fracción $\alpha$:

      | | PCl5 | PCl3 | Cl2 |
      |---|---|---|---|
      | equilibrio | $c(1-\alpha)$ | $c\alpha$ | $c\alpha$ |

      $$
      K_c = \frac{c\alpha^{2}}{1-\alpha} = 0{,}007927
      \quad\Longrightarrow\quad
      \alpha = 0{,}5091
      $$

      Un 50,91 %; la colección da 50,92 %, con la masa molar sin redondear. Se disocia la mitad, así que la
      aproximación $1 - \alpha \approx 1$ no se puede usar: daría un 72,7 %.

      **b · Con cloro de partida.** El matraz se llenó de cloro en
      condiciones normales, 0 ºC y 1 atm: $1/22{,}4 = 0{,}0446$ mol en 1 L. Ese
      cloro está en el numerador desde el principio:

      $$
      K_c = \frac{c\alpha\,(0{,}0446 + c\alpha)}{c\,(1-\alpha)} = 0{,}007927
      \quad\Longrightarrow\quad
      \alpha = 0{,}1449
      $$

      $$
      \boxed{\alpha = 14{,}5\ \%}
      $$

      **Una diferencia con la colección.** Da 14,6 %. Con los datos del
      enunciado salen entre 14,47 y 14,49 %, con cualquiera de los redondeos
      razonables —22,4 L o 0,082 y 273 K, 208,2 o 208,5 g/mol—. El 14,6 sale
      si se redondea la constante a 0,008, y ese redondeo no es el del
      apartado a), que con 0,008 daría 51,07 %. No cambia nada de lo que el
      problema enseña.

      **Lo que enseña.** El grado de disociación no es una propiedad del
      compuesto: depende de lo que haya alrededor. El mismo PCl5, a la misma
      temperatura y con la misma constante, pasa del 51 % al 14,5 % porque
      uno de sus productos ya estaba en el matraz.

  - id: colfq8-8-la-temperatura-del-cincuenta-por-ciento
    titulo: La temperatura a la que el pentacloruro se disocia a medias
    fuente: >-
      Problema 8 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      La Kp para la reacción

      $$
      \mathrm{PCl_5\,(g)} \;\rightleftharpoons\; \mathrm{PCl_3\,(g)} + \mathrm{Cl_2\,(g)}
      $$

      a 200 ºC es igual a 0,3075 atm. La entalpía de la reacción es de 72648 J
      mol⁻¹. Calcular la temperatura a la cual la disociación del pentacloruro
      de fósforo, a una presión de 3 atm es del 50%.
    pide: La temperatura a la que el PCl5 está disociado al 50 % bajo una presión total de 3 atm.

    pasos:
      - tipo: reconocer
        pregunta: |
          El dato que conecta con otra temperatura es la entalpía. ¿Qué hay
          que calcular antes de usar van't Hoff?
        opciones:
          - texto: >-
              La Kp que corresponde a un 50 % de disociación a 3 atm: es la Kp
              a la temperatura buscada
            correcta: true
            mensaje: |
              Eso es. Van't Hoff relaciona dos constantes a dos temperaturas; la
              segunda constante no la da el enunciado, la da la condición «50 %
              a 3 atm». Con ella, la temperatura es la única incógnita.
          - texto: >-
              Nada: el 50 % se mete directamente en la ecuación de van't Hoff
            mensaje: |
              Van't Hoff no lleva grados de disociación, lleva constantes. El
              50 % hay que traducirlo antes a una Kp.
          - texto: >-
              La Kc a 200 ºC, porque van't Hoff va con Kc
            mensaje: |
              No hace falta cambiar de constante: el enunciado da Kp, y la
              condición del 50 % a 3 atm también se traduce a Kp. Lo único que
              no se puede hacer es mezclar las dos.
          - texto: >-
              La presión a la que el PCl5 se disocia al 50 % a 200 ºC
            mensaje: |
              Esa presión existe, pero no es lo que se pide: la presión está
              fijada en 3 atm y lo que se busca es la temperatura.

      - tipo: calcular
        titulo: La constante a la temperatura buscada
        pregunta: |
          Con un 50 % de disociación y 3 atm de presión total, ¿cuánto vale
          $K_p$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: la constante en atm, con dos decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Has tomado las fracciones molares sobre el mol inicial, sin
              contar que el total pasa a $1 + \alpha$. Cada presión parcial es
              su fracción de $1 + \alpha = 1{,}5$ moles por la presión total.
          - valor: '0.75'
            mensaje: |
              Has escrito $K_p = \alpha^{2}P$, olvidando los moles totales y el
              PCl5 que queda. Con $1-\alpha$, $\alpha$ y $\alpha$ moles sobre
              $1+\alpha$, queda $K_p = \alpha^{2}P/(1-\alpha^{2})$.
          - valor: '0.333'
            mensaje: |
              Te falta la presión: $\alpha^{2}/(1-\alpha^{2})$ son las
              fracciones molares, y cada una se multiplica por los 3 atm.
        pista: |
          Por cada mol inicial de PCl5 quedan $1-\alpha$, y se forman $\alpha$
          de PCl3 y $\alpha$ de Cl2: $1+\alpha$ en total. Cada presión parcial
          es su fracción molar por 3 atm.
        desarrollo: |
          $$
          K_p = \frac{\left(\frac{\alpha}{1+\alpha}P\right)^{2}}{\frac{1-\alpha}{1+\alpha}P} = \frac{\alpha^{2}}{1-\alpha^{2}}\,P
          $$

          $$
          K_p = \frac{0{,}5^{2}}{1 - 0{,}5^{2}} \cdot 3 = 1{,}00\ \text{atm}
          $$

      - tipo: calcular
        titulo: La temperatura
        pregunta: |
          ¿A qué temperatura se da ese 50 %? Usa $R = 8{,}314$ J/(mol·K).
        respuesta:
          tipo: numero
          valor: '232.25'
          tolerancia: 0.25
          formato: la temperatura en grados Celsius, con una cifra decimal
        distractores:
          - valor: '505.3'
            mensaje: |
              Es la temperatura en kelvin, bien calculada. El enunciado da los
              200 ºC en Celsius, y la respuesta se espera igual: resta 273.
          - valor: '171.6'
            mensaje: |
              Te sale una temperatura menor que 200 ºC, y no puede ser: la
              reacción es endotérmica y la constante tiene que subir de 0,3075
              a 1, así que hay que calentar. Has cambiado un signo en van't
              Hoff.
          - valor: '213.5'
            mensaje: |
              Has tomado el logaritmo decimal. Van't Hoff sale de integrar
              $d\ln K/dT$, así que lleva logaritmo neperiano:
              $\ln(1/0{,}3075) = 1{,}179$, no 0,512.
        pista: |
          $\ln\dfrac{K_2}{K_1} = -\dfrac{\Delta H}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right)$,
          con $K_1 = 0{,}3075$ a 473 K y $K_2 = 1$.
        desarrollo: |
          $$
          \ln\frac{1}{0{,}3075} = 1{,}1793
          $$

          $$
          \frac{1}{T_2} = \frac{1}{473} - \frac{1{,}1793 \cdot 8{,}314}{72648} = 1{,}979\cdot 10^{-3}\ \text{K}^{-1}
          $$

          $$
          T_2 = 505{,}3\ \text{K} \;\longrightarrow\; 232{,}3\ ^{\circ}\text{C}
          $$

          La colección da 232,2 ºC, que es lo que sale con $R = 8{,}31$. Según
          se tome $R$ y se reste 273 o 273,15, sale entre 232,1 y 232,3 ºC, y la
          casilla acepta todo ese margen.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con un 50 % de disociación hay, por cada mol inicial, 0,5 mol de
              PCl5, 0,5 de PCl3 y 0,5 de Cl2: 1,5 en total.
          - texto: >-
              A 3 atm, eso da $K_p = 0{,}5^{2}/(1 - 0{,}5^{2}) \cdot 3 = 1$ atm.
          - texto: >-
              La reacción es endotérmica y $K_p$ tiene que subir de 0,3075 a 1:
              la temperatura buscada es mayor que 200 ºC.
          - texto: >-
              Van't Hoff con $\Delta H = 72\,648$ J/mol da $T_2 = 505$ K, unos
              232 ºC.
          - texto: >-
              Como $K_p$ sube, la temperatura tiene que bajar, porque en van't
              Hoff la temperatura va dividiendo.
            trampa: true
            mensaje: |
              Lo que manda es el signo de $\Delta H$. Con $\Delta H > 0$ la
              constante crece con la temperatura: para pasar de 0,3075 a 1 hay
              que calentar. Si te sale menos de 200 ºC, has cambiado un signo
              en la ecuación, y sale 171,6 ºC.
        veredicto: |
          Primero la condición se traduce a una constante; después van't Hoff,
          y el signo de $\Delta H$ dice de antemano si la temperatura sube o
          baja.

    resolucion: |
      **Traducir el 50 % a una constante.** Van't Hoff relaciona constantes,
      no grados de disociación. Por cada mol de PCl5 inicial quedan
      $1-\alpha$ y se forman $\alpha$ de cada producto, $1+\alpha$ moles en
      total; con presión total $P$:

      $$
      K_p = \frac{\alpha^{2}}{1-\alpha^{2}}\,P = \frac{0{,}25}{0{,}75} \cdot 3 = 1{,}00\ \text{atm}
      $$

      **Van't Hoff, con la constante de 200 ºC como referencia.**

      $$
      \ln\frac{1}{0{,}3075} = -\frac{72648}{8{,}314}\left(\frac{1}{T_2} - \frac{1}{473}\right)
      \quad\Longrightarrow\quad
      T_2 = 505{,}3\ \text{K}
      $$

      $$
      \boxed{T_2 \approx 232\ ^{\circ}\text{C}}
      $$

      La colección da 232,2 ºC; con $R = 8{,}314$ sale 232,3 y con 8,31,
      232,2. Es la misma cuenta.

      **La comprobación que se hace sin calcular.** La reacción es
      endotérmica, así que su constante crece con la temperatura. Para
      disociar la mitad a 3 atm hace falta una $K_p$ mayor que la de 200 ºC
      —1 frente a 0,3075—, luego la temperatura tiene que ser mayor. Una
      respuesta por debajo de 200 ºC delata un signo cambiado antes de
      repasar ninguna cuenta.

  - id: colfq8-9-el-etano-y-el-volumen-que-no-cambia
    titulo: Etileno, hidrógeno y etano, y el volumen que no cambia al quitar etano
    fuente: >-
      Problema 9 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. El apartado b no dice qué se mantiene al quitar
      el etano: la respuesta de la colección es la del volumen constante, y
      así se resuelve aquí.
    nivel: practica
    enunciado: |
      Calcular las presiones parciales en el equilibrio:

      $$
      \mathrm{C_2H_4\,(g)} + \mathrm{H_2\,(g)} \;\rightleftharpoons\; \mathrm{C_2H_6\,(g)}
      $$

      cuya Kp, a 298 K, es 3,289 si la presión total en el equilibrio es 1 atm
      y se tiene inicialmente 1 mol de C2H4 y 1 mol de H2.

      b) Una vez alcanzado el equilibrio se eliminan 0,2 moles de C2H6.
      Calcular las nuevas presiones parciales en el equilibrio.
    pide: Las tres presiones parciales en el equilibrio de partida, y las nuevas después de quitar 0,2 mol de etano.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) se quitan 0,2 mol de etano del recipiente. ¿Qué se mantiene
          constante mientras el sistema vuelve al equilibrio?
        opciones:
          - texto: >-
              El volumen y la temperatura: cada presión parcial es proporcional
              a sus moles, y la presión total baja
            correcta: true
            mensaje: |
              Eso es, y es lo que reproduce la solución de la colección: sus
              presiones de b) suman 0,82 atm, no 1. Con $V$ y $T$ fijos,
              $P_i = n_i\,RT/V$, y el factor $RT/V$ sale de a): 1 atm entre
              1,4829 mol.
          - texto: >-
              La presión total, que sigue siendo 1 atm
            mensaje: |
              Si la presión total volviera a 1 atm, las presiones de equilibrio
              serían otra vez las de a): con $P(\mathrm{C_2H_4}) = P(\mathrm{H_2})$
              y 1 atm en total, la constante solo deja una solución. El
              apartado no tendría nada que calcular, y la colección da otras.
          - texto: >-
              Las presiones del C2H4 y del H2, porque no se ha tocado ninguno
              de los dos
            mensaje: |
              Justo después de quitar el etano valen lo mismo, pero el sistema
              ya no está en equilibrio: $Q = 2{,}02$, menor que $K_p$. Para
              volver a él se gasta etileno e hidrógeno.
          - texto: >-
              Nada: hasta Kp cambia, porque hay menos moles
            mensaje: |
              Kp solo depende de la temperatura, y sigue siendo 298 K. Lo que
              cambia al quitar etano es $Q$, y el sistema se mueve hasta
              devolverlo al valor de Kp.

      - tipo: calcular
        titulo: El etileno y el hidrógeno del equilibrio
        pregunta: |
          ¿Cuánto vale la presión parcial del C2H4, que es la misma que la del
          H2?
        respuesta:
          tipo: numero
          valor: '0.3256'
          tolerancia: 0.002
          formato: la presión en atm, con cuatro cifras decimales
        distractores:
          - valor: '0.4669'
            mensaje: |
              Has invertido la constante, con los reactivos arriba. El etano es
              el producto: $K_p = P(\mathrm{C_2H_6})/(P(\mathrm{C_2H_4})\,P(\mathrm{H_2}))$.
          - valor: '0.3333'
            mensaje: |
              Has repartido la atmósfera a partes iguales entre los tres gases.
              No hay por qué: quien decide el reparto es la constante, y con
              3,289 hay algo más de etano que de cada reactivo.
        pista: |
          Con $P(\mathrm{C_2H_4}) = P(\mathrm{H_2}) = p$ y 1 atm en total,
          $P(\mathrm{C_2H_6}) = 1 - 2p$ y $K_p = \dfrac{1-2p}{p^{2}}$.
        desarrollo: |
          $$
          3{,}289 = \frac{1-2p}{p^{2}}
          \quad\Longrightarrow\quad
          3{,}289\,p^{2} + 2p - 1 = 0
          $$

          $$
          p = \frac{-2 + \sqrt{4 + 4 \cdot 3{,}289}}{2 \cdot 3{,}289} = 0{,}3256\ \text{atm}
          $$

          La colección da 0,325 atm: el mismo número, con la cuarta cifra
          cortada.

      - tipo: calcular
        titulo: El etano del equilibrio
        pregunta: |
          ¿Y la presión parcial del C2H6?
        respuesta:
          tipo: numero
          valor: '0.3487'
          tolerancia: 0.002
          formato: la presión en atm, con cuatro cifras decimales
        distractores:
          - valor: '0.0663'
            mensaje: |
              Sale de la constante invertida. El etano es el producto y va
              arriba: con la constante del derecho hay algo más de etano que
              de cada reactivo, 0,3487 frente a 0,3256 atm, y no siete veces
              menos.
          - valor: '0.6744'
            mensaje: |
              Has restado de 1 atm un solo reactivo. Hay dos, cada uno con
              0,3256 atm: $1 - 2 \cdot 0{,}3256$.
        pista: |
          $P(\mathrm{C_2H_6}) = 1 - 2p$.
        desarrollo: |
          $$
          P(\mathrm{C_2H_6}) = 1 - 2 \cdot 0{,}32563 = 0{,}3487\ \text{atm}
          $$

          La colección da 0,3486 atm. Comprobación:
          $0{,}3487/0{,}3256^{2} = 3{,}29$.

      - tipo: calcular
        titulo: El etano tras quitar 0,2 mol
        pregunta: |
          b) Tras quitar 0,2 mol de etano con el volumen y la temperatura
          fijos, ¿cuál es la nueva presión del C2H6 en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.2589'
          tolerancia: 0.002
          formato: la presión en atm, con tres cifras decimales
        distractores:
          - valor: '0.3487'
            mensaje: |
              Es la presión de a), y sale si supones que la presión total
              vuelve a 1 atm. Con el volumen fijo la presión total baja, y el
              sistema solo repone una parte del etano que le quitas.
          - valor: '0.2139'
            mensaje: |
              Es la presión justo después de quitar el etano, antes de que el
              sistema reaccione. Ahí $Q = 2{,}02$, menor que $K_p$: se forma
              etano hasta que el cociente vuelve a 3,289.
          - valor: '0.1487'
            mensaje: |
              Has restado 0,2 atm, como si los moles fueran atmósferas. Con el
              volumen fijo, cada mol vale $1/1{,}4829 = 0{,}6744$ atm: quitar
              0,2 mol es quitar 0,1349 atm.
        pista: |
          En a) hay 0,5171 mol de etano y 0,4829 de cada reactivo, 1,4829 en
          total a 1 atm: cada mol vale $1/1{,}4829$ atm. Quita 0,2 mol, calcula
          $Q$ y deja que avance.
        desarrollo: |
          En a), $x/(2-x) = 0{,}3487$ da $x = 0{,}5171$ mol de etano; quedan
          0,4829 mol de cada reactivo, 1,4829 mol en total a 1 atm. Con el
          volumen fijo, justo después de quitar 0,2 mol:

          $$
          P(\mathrm{C_2H_6}) = \frac{0{,}3171}{1{,}4829} = 0{,}2138 \qquad P(\mathrm{C_2H_4}) = P(\mathrm{H_2}) = 0{,}3256
          $$

          $$
          Q = \frac{0{,}2138}{0{,}3256^{2}} = 2{,}02 < 3{,}289
          $$

          Avanza hacia el etano. Con $z$ la presión que reacciona:

          $$
          3{,}289 = \frac{0{,}2138 + z}{(0{,}3256 - z)^{2}}
          \quad\Longrightarrow\quad
          z = 0{,}0451\ \text{atm}
          $$

          $$
          P(\mathrm{C_2H_6}) = 0{,}2138 + 0{,}0451 = 0{,}2589\ \text{atm}
          $$

          Es la respuesta de la colección, 0,259 atm.

      - tipo: calcular
        titulo: El etileno y el hidrógeno tras quitar el etano
        pregunta: |
          ¿Y la nueva presión del C2H4, igual a la del H2?
        respuesta:
          tipo: numero
          valor: '0.2806'
          tolerancia: 0.002
          formato: la presión en atm, con tres cifras decimales
        distractores:
          - valor: '0.3256'
            mensaje: |
              Es la presión de antes. Sale si no dejas que el sistema reaccione
              o si supones la presión total fija en 1 atm; con el volumen fijo,
              para reponer etano se gastan etileno e hidrógeno.
          - valor: '0.3707'
            mensaje: |
              Has sumado la $z$ en vez de restarla. El sistema avanza hacia el
              etano, así que el etileno y el hidrógeno bajan.
        pista: |
          Cada reactivo pierde la misma presión $z$ que gana el etano.
        desarrollo: |
          $$
          P(\mathrm{C_2H_4}) = P(\mathrm{H_2}) = 0{,}32563 - 0{,}04505 = 0{,}2806\ \text{atm}
          $$

          La colección da 0,28 atm. Comprobación:
          $\frac{0{,}2589}{0{,}2806^{2}} = 3{,}29$, y la presión total baja a
          0,82 atm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En a), con 1 atm en total y $P(\mathrm{C_2H_4}) = P(\mathrm{H_2}) = p$,
              la constante da $p = 0{,}3256$ atm y 0,3487 atm de etano.
          - texto: >-
              Esas presiones son 0,5171 mol de etano y 0,4829 de cada reactivo,
              1,4829 mol en total.
          - texto: >-
              Al quitar 0,2 mol con el volumen fijo, el etano baja a 0,2138 atm
              y $Q = 2{,}02$ queda por debajo de $K_p$.
          - texto: >-
              Se forma etano hasta que el cociente vuelve a 3,289: 0,2589 atm
              de etano y 0,2806 de cada reactivo.
          - texto: >-
              Al quitar etano, el equilibrio lo repone entero y vuelve a haber
              0,3487 atm de etano.
            trampa: true
            mensaje: |
              Le Chatelier dice hacia dónde, no cuánto: el sistema compensa
              solo una parte de lo que le quitas, y el etano sube de 0,2138 a
              0,2589 atm, no a 0,3487. Las presiones de a) solo volverían si
              se mantuviera la presión total en 1 atm, y entonces con menos
              moles en el recipiente.
        veredicto: |
          Q frente a K dice hacia dónde; la tabla, cuánto. Y el volumen fijo
          es lo que hace que la presión total baje.

    resolucion: |
      **a · El equilibrio de partida.** Con 1 mol de cada reactivo, las
      presiones de C2H4 e H2 son iguales, $p$, y la del etano es $1 - 2p$
      porque la total es 1 atm:

      $$
      K_p = \frac{1-2p}{p^{2}} = 3{,}289
      \quad\Longrightarrow\quad
      p = 0{,}3256\ \text{atm}
      \qquad
      P(\mathrm{C_2H_6}) = 0{,}3487\ \text{atm}
      $$

      Coinciden con la colección, 0,325 y 0,3486 atm.

      **b · Qué se mantiene.** El enunciado no lo dice, y hay que decidirlo.
      Si se mantuviera la presión total en 1 atm, la constante devolvería las
      mismas presiones de a): el apartado no tendría nada que calcular. La
      colección da unas presiones que suman 0,82 atm, que es lo que sale **con
      el volumen fijo**. Entonces cada presión es proporcional a sus moles.

      En a) hay 0,5171 mol de etano y 0,4829 de cada reactivo, 1,4829 mol a
      1 atm. Quitando 0,2 mol, el etano baja a 0,2138 atm y

      $$
      Q = \frac{0{,}2138}{0{,}3256^{2}} = 2{,}02 < K_p
      $$

      así que se forma etano. Con $z$ la presión que reacciona:

      $$
      \frac{0{,}2138 + z}{(0{,}3256 - z)^{2}} = 3{,}289
      \quad\Longrightarrow\quad
      z = 0{,}0451
      $$

      $$
      \boxed{P(\mathrm{C_2H_6}) = 0{,}259\ \text{atm} \qquad P(\mathrm{C_2H_4}) = P(\mathrm{H_2}) = 0{,}281\ \text{atm}}
      $$

      Coinciden con la colección, 0,259 y 0,28 atm.

      **Lo que enseña.** Quitar etano desplaza el equilibrio hacia el etano,
      pero no lo repone: de 0,2138 sube a 0,2589, lejos de los 0,3487 de
      antes. Le Chatelier da el sentido; el cuánto lo da la constante.

  - id: colfq8-10-el-tetroxido-diluido-y-con-no2
    titulo: El tetróxido de dinitrógeno, diluido cinco veces y con NO2 añadido
    fuente: >-
      Problema 10 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Su [NO2] del apartado b, 0,00265 M, no cumple la
      constante con su propio [N2O4] de 1,56 × 10⁻³ M; con los datos del
      enunciado sale 2,71 × 10⁻³ M.
    nivel: practica
    enunciado: |
      A 25 ºC la Kc de la disociación del tetróxido de dinitrógeno es 4,66 x
      10⁻³:

      $$
      \mathrm{N_2O_4\,(g)} \;\rightleftharpoons\; 2\,\mathrm{NO_2\,(g)}
      $$

      a) Calcular las concentraciones en el equilibrio de ambos gases, cuando
      se introducen 2,5 g de tetróxido de dinitrógeno en un matraz de 2 L a
      25 ºC

      b) Si se traslada la mezcla de equilibrio a un recipiente de 10 L
      ¿Cuáles serán las nuevas concentraciones de equilibrio después de añadir
      0,20 g de dióxido de nitrógeno?
    pide: Las concentraciones de equilibrio de los dos gases en el matraz de 2 L, y después en el de 10 L con el NO2 añadido.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) la mezcla pasa a 10 L —se diluye cinco veces— y además se le
          añade NO2, que es producto. ¿Hacia dónde se desplaza el equilibrio?
        opciones:
          - texto: >-
              Hacia el NO2: la dilución pesa más que lo añadido, y Q queda por
              debajo de Kc
            correcta: true
            mensaje: |
              Eso es, y no hace falta adivinarlo: justo después del traslado y
              la adición, $Q = 1{,}61\cdot 10^{-3}$, menor que
              $K_c = 4{,}66\cdot 10^{-3}$. Falta producto, así que se disocia
              más N2O4.
          - texto: >-
              Hacia el N2O4, porque se añade producto
            mensaje: |
              Eso sería con el volumen fijo. Aquí además se diluye cinco veces,
              y diluir empuja hacia el lado con más moles de gas, el del NO2.
              Las dos cosas empujan en sentidos contrarios, y lo que decide es
              $Q$ frente a $K_c$.
          - texto: >-
              No se desplaza: los dos efectos se compensan
            mensaje: |
              Compensarse exactamente sería una casualidad, y aquí no ocurre:
              $Q = 1{,}61\cdot 10^{-3}$ frente a $K_c = 4{,}66\cdot 10^{-3}$.
          - texto: >-
              No se puede saber hasta resolver la ecuación
            mensaje: |
              Se puede saber antes, y conviene: con las concentraciones justo
              después del cambio se calcula $Q$, se compara con $K_c$, y eso
              dice el signo de la incógnita antes de montar la tabla.

      - tipo: calcular
        titulo: El NO2 en el matraz de 2 L
        pregunta: |
          a) Con 2,5 g de N2O4 (92 g/mol) en 2 L, ¿cuánto vale $[\mathrm{NO_2}]$
          en el equilibrio?
        respuesta:
          tipo: numero
          valor: '6.88e-3'
          tolerancia: 5e-5
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '5.96e-3'
            mensaje: |
              Te has dejado el 2 del NO2: has escrito $x^{2}$ arriba en vez de
              $(2x)^{2}$, y has dado esa $x$ como concentración. Por cada N2O4
              que se disocia salen **dos** NO2.
          - valor: '7.96e-3'
            mensaje: |
              Has despreciado la $x$ del denominador. Aquí se disocia una
              cuarta parte del N2O4, así que la aproximación no vale: hay que
              resolver la cuadrática entera.
        pista: |
          $c_0 = \dfrac{2{,}5}{92 \cdot 2} = 0{,}01359$ M, y
          $K_c = \dfrac{(2x)^{2}}{c_0 - x}$.
        desarrollo: |
          $$
          c_0 = \frac{2{,}5}{92 \cdot 2} = 0{,}01359\ \text{M}
          $$

          $$
          4{,}66\cdot 10^{-3} = \frac{4x^{2}}{0{,}01359 - x}
          \quad\Longrightarrow\quad
          4x^{2} + 4{,}66\cdot 10^{-3}\,x - 6{,}33\cdot 10^{-5} = 0
          $$

          $$
          x = 3{,}44\cdot 10^{-3} \qquad [\mathrm{NO_2}] = 2x = 6{,}88\cdot 10^{-3}\ \text{M}
          $$

          Es la solución de la colección.

      - tipo: calcular
        titulo: El N2O4 en el matraz de 2 L
        pregunta: |
          ¿Y $[\mathrm{N_2O_4}]$?
        respuesta:
          tipo: numero
          valor: '0.01015'
          tolerancia: 0.0002
          formato: la concentración en mol/L, con cuatro cifras decimales
        distractores:
          - valor: '0.00763'
            mensaje: |
              Sale de olvidar el 2 del NO2 en la constante: la $x$ sale mayor y
              al restarla queda menos N2O4. Con $(2x)^{2}$ arriba, $x$ es
              $3{,}44\cdot 10^{-3}$.
          - valor: '0.01359'
            mensaje: |
              Es la concentración inicial. En el equilibrio se ha disociado una
              parte: $0{,}01359 - 0{,}00344$.
        pista: |
          $[\mathrm{N_2O_4}] = c_0 - x$.
        desarrollo: |
          $$
          [\mathrm{N_2O_4}] = 0{,}01359 - 0{,}00344 = 0{,}01015\ \text{M}
          $$

          La colección lo redondea a 0,01 M, y la casilla lo acepta.

      - tipo: calcular
        titulo: El N2O4 en 10 L con el NO2 añadido
        pregunta: |
          b) ¿Cuánto vale $[\mathrm{N_2O_4}]$ en el nuevo equilibrio, en 10 L y
          con los 0,20 g de NO2 (46 g/mol)?
        respuesta:
          tipo: numero
          valor: '1.58e-3'
          tolerancia: 3e-5
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '1.43e-3'
            mensaje: |
              Es lo que sale si solo se pasa a 10 L, sin añadir el NO2. Los
              0,20 g son 0,00435 mol de NO2 que frenan la disociación.
          - valor: '2.03e-3'
            mensaje: |
              Es la concentración justo después del traslado, antes de que el
              sistema reaccione. Ahí $Q = 1{,}61\cdot 10^{-3}$, menor que
              $K_c$: todavía se disocia más N2O4.
        pista: |
          En 10 L hay 0,02030 mol de N2O4 y $0{,}01375 + 0{,}00435 = 0{,}01810$
          mol de NO2. Calcula $Q$ y plantea la tabla hacia el NO2.
        desarrollo: |
          Justo después del traslado y de añadir $0{,}20/46 = 0{,}00435$ mol de
          NO2:

          $$
          [\mathrm{N_2O_4}] = \frac{0{,}02030}{10} = 2{,}030\cdot 10^{-3} \qquad [\mathrm{NO_2}] = \frac{0{,}01810}{10} = 1{,}810\cdot 10^{-3}
          $$

          $$
          Q = \frac{(1{,}810\cdot 10^{-3})^{2}}{2{,}030\cdot 10^{-3}} = 1{,}61\cdot 10^{-3} < K_c
          $$

          Avanza hacia el NO2. Con $y$ el N2O4 que se disocia:

          $$
          4{,}66\cdot 10^{-3} = \frac{(1{,}810\cdot 10^{-3} + 2y)^{2}}{2{,}030\cdot 10^{-3} - y}
          \quad\Longrightarrow\quad
          y = 4{,}51\cdot 10^{-4}
          $$

          $$
          [\mathrm{N_2O_4}] = 2{,}030\cdot 10^{-3} - 4{,}51\cdot 10^{-4} = 1{,}58\cdot 10^{-3}\ \text{M}
          $$

          La colección da $1{,}56\cdot 10^{-3}$ M: sale de arrastrar el 0,01 M
          redondeado del apartado a), y la casilla lo acepta.

      - tipo: calcular
        titulo: El NO2 en 10 L con el NO2 añadido
        pregunta: |
          ¿Y $[\mathrm{NO_2}]$ en ese nuevo equilibrio?
        respuesta:
          tipo: numero
          valor: '2.71e-3'
          tolerancia: 3e-5
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '2.65e-3'
            mensaje: |
              Es la cifra que imprime la colección, y no cumple la constante:
              con su propio N2O4, $0{,}00265^{2}/1{,}56\cdot 10^{-3}$ da
              $4{,}50\cdot 10^{-3}$, no $4{,}66\cdot 10^{-3}$. De los datos del
              enunciado sale $2{,}71\cdot 10^{-3}$ M.
          - valor: '2.58e-3'
            mensaje: |
              Es lo que sale si solo se pasa a 10 L, sin añadir el NO2. Los
              0,20 g también cuentan: suben el NO2 final.
          - valor: '1.81e-3'
            mensaje: |
              Es la concentración justo después de añadir, antes de que el
              sistema reaccione. Con $Q < K_c$ se disocia más N2O4, y cada uno
              da dos NO2.
        pista: |
          $[\mathrm{NO_2}] = 1{,}810\cdot 10^{-3} + 2y$.
        desarrollo: |
          $$
          [\mathrm{NO_2}] = 1{,}810\cdot 10^{-3} + 2 \cdot 4{,}51\cdot 10^{-4} = 2{,}71\cdot 10^{-3}\ \text{M}
          $$

          Comprobación: $\frac{(2{,}71\cdot 10^{-3})^{2}}{1{,}58\cdot 10^{-3}} = 4{,}65\cdot 10^{-3}$.

          La colección da 0,00265 M, y esa cifra no cumple la constante:
          $\frac{0{,}00265^{2}}{1{,}56\cdot 10^{-3}} = 4{,}50\cdot 10^{-3}$. Con
          su propio $[\mathrm{N_2O_4}]$, la constante da $2{,}70\cdot 10^{-3}$ M.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En 2 L hay 0,01359 M de N2O4 al principio, y la constante da
              $x = 3{,}44\cdot 10^{-3}$: 6,88·10⁻³ M de NO2 y 0,0101 M de N2O4.
          - texto: >-
              Al pasar a 10 L y añadir 0,00435 mol de NO2,
              $Q = 1{,}61\cdot 10^{-3}$, por debajo de $K_c$.
          - texto: >-
              El sistema disocia más N2O4: $y = 4{,}51\cdot 10^{-4}$ M.
          - texto: >-
              Quedan 1,58·10⁻³ M de N2O4 y 2,71·10⁻³ M de NO2, y el cociente
              vuelve a valer 4,66·10⁻³.
          - texto: >-
              Como se añade NO2, que es producto, el equilibrio se desplaza
              hacia el N2O4.
            trampa: true
            mensaje: |
              Eso valdría si solo se añadiera NO2. Aquí antes se diluye cinco
              veces, y diluir empuja hacia el lado con más moles de gas. Manda
              la cuenta: $Q = 1{,}61\cdot 10^{-3} < K_c$, y el sistema va
              hacia el NO2. Si montas la tabla al revés, la incógnita te sale
              negativa: la ecuación corrige el sentido por ti.
        veredicto: |
          Con dos perturbaciones a la vez, Le Chatelier no decide: decide Q.

    resolucion: |
      **a · En el matraz de 2 L.** Con la masa molar 92 g/mol,
      $c_0 = 2{,}5/(92 \cdot 2) = 0{,}01359$ M. Si se disocia $x$:

      $$
      K_c = \frac{(2x)^{2}}{0{,}01359 - x} = 4{,}66\cdot 10^{-3}
      \quad\Longrightarrow\quad
      x = 3{,}44\cdot 10^{-3}
      $$

      $$
      \boxed{[\mathrm{NO_2}] = 6{,}88\cdot 10^{-3}\ \text{M} \qquad [\mathrm{N_2O_4}] = 0{,}0101\ \text{M}}
      $$

      Coinciden con la colección, que redondea el N2O4 a 0,01 M. Se disocia
      una cuarta parte, así que la $x$ del denominador no se puede
      despreciar.

      **b · Diluir y añadir a la vez.** En 10 L quedan 0,02030 mol de N2O4 y
      $0{,}01375 + 0{,}00435 = 0{,}01810$ mol de NO2. Las dos perturbaciones
      empujan en sentidos contrarios, y el cociente dice cuál gana:

      $$
      Q = \frac{(1{,}810\cdot 10^{-3})^{2}}{2{,}030\cdot 10^{-3}} = 1{,}61\cdot 10^{-3} < K_c
      $$

      Gana la dilución: se disocia más N2O4. Con $y$ lo que se disocia,
      $y = 4{,}51\cdot 10^{-4}$ M, y

      $$
      \boxed{[\mathrm{N_2O_4}] = 1{,}58\cdot 10^{-3}\ \text{M} \qquad [\mathrm{NO_2}] = 2{,}71\cdot 10^{-3}\ \text{M}}
      $$

      **Dos diferencias con la colección.** Su $[\mathrm{N_2O_4}]$,
      $1{,}56\cdot 10^{-3}$ M, sale de arrastrar el 0,01 M redondeado de a):
      es la misma cuenta. Su $[\mathrm{NO_2}]$, 0,00265 M, no sale: con su
      propio N2O4 la constante daría 2,70·10⁻³ M, y con los datos del
      enunciado salen 2,71·10⁻³ M.

      **Lo que enseña.** «Se añade producto, luego va hacia los reactivos» es
      la respuesta automática, y aquí es falsa. Cuando dos cambios empujan en
      sentidos opuestos, Le Chatelier no dice cuál gana: lo dice $Q$.

  - id: colfq8-11-el-gas-de-agua-y-la-mezcla-desigual
    titulo: El gas de agua, su constante y una mezcla que no parte de cero
    fuente: >-
      Problema 11 · Problemas propuestos del tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Su composición del apartado b sale de redondear
      a 0,34 atm la presión que reacciona; sin redondear, las cuatro cifras
      cambian en menos de una décima.
    nivel: practica
    enunciado: |
      Dada la reacción:

      $$
      \mathrm{CO_2\,(g)} + \mathrm{H_2\,(g)} \;\rightleftharpoons\; \mathrm{CO\,(g)} + \mathrm{H_2O\,(g)}
      $$

      a 1573 K alcanzado el equilibrio, el 63% de una mezcla equimolecular de
      reactivos se convierte en productos.

      a) Calcular la constante de equilibrio a 1573 K, b) Si se mezclan CO2,
      CO, H2O y H2 a presiones parciales P(CO2) = P(CO) = 2 atm y P(H2O) =
      P(H2) = 1 atm. Calcular la composición del equilibrio expresada como %
      en volumen, a 1573 K.
    pide: La constante de equilibrio a 1573 K, y la composición en volumen del equilibrio al que llega la mezcla de b.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) están los cuatro gases desde el principio. ¿Hacia dónde
          evoluciona la mezcla?
        opciones:
          - texto: >-
              Hacia CO y H2O: $Q_p = \frac{2 \cdot 1}{2 \cdot 1} = 1$, menor que
              $K = 2{,}9$
            correcta: true
            mensaje: |
              Eso es. Faltan productos para llegar al equilibrio, así que se
              gasta CO2 e H2. Hacer esta cuenta antes de montar la tabla dice
              el signo de la incógnita.
          - texto: >-
              Hacia los productos, porque K es mayor que 1
            mensaje: |
              K > 1 dice cómo es el equilibrio, no hacia dónde va una mezcla
              concreta. Eso lo decide $Q$ frente a $K$: con $Q = 5$ iría hacia
              los reactivos aunque K sea 2,9.
          - texto: >-
              Hacia CO2 e H2, porque ya hay CO y H2O desde el principio
            mensaje: |
              Que haya productos al principio no decide nada: lo que decide es
              si hay más o menos de los que el equilibrio admite. Con
              $Q = 1$ frente a $K = 2{,}9$, faltan.
          - texto: >-
              No se mueve: la presión total es 6 atm a los dos lados
            mensaje: |
              La presión total no cambia porque $\Delta n = 0$, pero eso no dice
              nada de la composición. Con $Q$ distinto de $K$ la mezcla se
              mueve, y la presión total se queda en 6 atm mientras lo hace.

      - tipo: calcular
        titulo: La constante
        pregunta: |
          a) ¿Cuánto vale la constante de equilibrio a 1573 K?
        respuesta:
          tipo: numero
          valor: '2.90'
          tolerancia: 0.02
          formato: la constante, con dos decimales
        distractores:
          - valor: '1.70'
            mensaje: |
              Has dividido 0,63 entre 0,37 sin elevar al cuadrado. Arriba van
              los dos productos y abajo los dos reactivos:
              $(0{,}63 \cdot 0{,}63)/(0{,}37 \cdot 0{,}37)$.
          - valor: '0.345'
            mensaje: |
              Tienes la constante del revés. Los productos, CO y H2O, van
              arriba.
          - valor: '0.397'
            mensaje: |
              Es $0{,}63^{2}$ a secas. Falta dividir por lo que queda de cada
              reactivo, 0,37.
        pista: |
          De cada mol de reactivo se convierte 0,63 y queda 0,37. Con dos moles
          de gas a cada lado, el volumen y la presión total se cancelan.
        desarrollo: |
          $$
          K = \frac{0{,}63 \cdot 0{,}63}{0{,}37 \cdot 0{,}37} = 2{,}90
          $$

          Es la respuesta de la colección, 2,9. Como $\Delta n = 0$, es a la vez
          $K_p$ y $K_c$.

      - tipo: calcular
        titulo: La presión que reacciona
        pregunta: |
          b) Con $x$ atm de CO2 que reaccionan, ¿cuánto vale $x$?
        respuesta:
          tipo: numero
          valor: '0.344'
          tolerancia: 0.005
          formato: la presión en atm, con tres cifras decimales
        distractores:
          - valor: '5.815'
            mensaje: |
              Es la otra raíz de la cuadrática, y no puede ser: dejaría
              $2 - x$ y $1 - x$ negativos. De las dos raíces vale la que deja
              las cuatro presiones positivas.
          - valor: '-0.344'
            mensaje: |
              Has usado la constante invertida: con $1/2{,}9$ la cuenta dice
              que la mezcla retrocede. Con los productos arriba, $Q = 1 < K$ y
              la mezcla avanza: $x$ es positiva.
        pista: |
          $K = \dfrac{(2+x)(1+x)}{(2-x)(1-x)}$, con las presiones en atm.
        desarrollo: |
          $$
          2{,}90 = \frac{(2+x)(1+x)}{(2-x)(1-x)}
          \quad\Longrightarrow\quad
          1{,}90\,x^{2} - 11{,}70\,x + 3{,}80 = 0
          $$

          $$
          x = 0{,}344\ \text{atm}
          $$

          La otra raíz, 5,81, se descarta: dejaría presiones negativas.

      - tipo: calcular
        titulo: La composición del equilibrio
        pregunta: |
          ¿Cuál es la composición en volumen del equilibrio?
        respuesta:
          tipo: vector
          valor: '(27.60; 39.07; 22.40; 10.93)'
          tolerancia: 0.1
          formato: los cuatro porcentajes en el orden CO2, CO, H2O, H2, entre paréntesis y separados por punto y coma
        distractores:
          - valor: '(33.33; 33.33; 16.67; 16.67)'
            mensaje: |
              Es la mezcla de partida: 2, 2, 1 y 1 atm sobre 6. Con $Q < K$ la
              mezcla avanza, y hay que calcular primero cuánto.
          - valor: '(1.656; 2.344; 1.344; 0.656)'
            mensaje: |
              Son las presiones parciales en atm, bien calculadas. El % en
              volumen es la fracción molar por cien: cada presión entre los
              6 atm totales.
        pista: |
          La presión total sigue siendo 6 atm, porque hay dos moles de gas a
          cada lado. Cada porcentaje en volumen es su presión parcial entre 6,
          por cien.
        desarrollo: |
          | | CO₂ | CO | H₂O | H₂ |
          |---|---|---|---|---|
          | presión (atm) | 1,656 | 2,344 | 1,344 | 0,656 |
          | % en volumen | 27,60 | 39,07 | 22,40 | 10,93 |

          $$
          \%\,\mathrm{CO_2} = \frac{1{,}656}{6}\cdot 100 = 27{,}60
          $$

          La colección da 27,66 %, 39 %, 22,33 % y 11 %: son las mismas
          cuentas con $x$ redondeada a 0,34, y la casilla las acepta.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En a), de cada mol de reactivo se convierte 0,63 y queda 0,37:
              $K = 0{,}63^{2}/0{,}37^{2} = 2{,}90$.
          - texto: >-
              En b), $Q_p = 1 < K$: la mezcla avanza hacia CO y H2O.
          - texto: >-
              Con $x$ atm que reaccionan, la cuadrática da $x = 0{,}344$; la
              otra raíz deja presiones negativas.
          - texto: >-
              La presión total se queda en 6 atm, y los porcentajes son 27,6 %
              de CO2, 39,1 % de CO, 22,4 % de H2O y 10,9 % de H2.
          - texto: >-
              Como en a) reacciona el 63 %, en b) también reacciona el 63 % de
              cada reactivo.
            trampa: true
            mensaje: |
              El 63 % es de la mezcla de a), equimolecular y sin productos. De
              un apartado a otro se conserva $K$, no el porcentaje de
              conversión: con productos presentes desde el principio, la
              reacción avanza mucho menos. Reaccionan 0,344 atm, un 17 % del
              CO2 y un 34 % del H2.
        veredicto: |
          Lo que viaja de un apartado a otro es la constante, nunca el
          porcentaje que reaccionó.

    resolucion: |
      **a · La constante.** Con una mezcla equimolecular, de cada mol de
      reactivo se convierte 0,63 y queda 0,37. Hay dos moles de gas a cada
      lado, así que el volumen se cancela y $K_p = K_c$:

      $$
      K = \frac{0{,}63^{2}}{0{,}37^{2}} = 2{,}90
      $$

      Es el 2,9 de la colección.

      **b · Hacia dónde va la mezcla.** $Q_p = (2 \cdot 1)/(2 \cdot 1) = 1$,
      menor que $K$: faltan productos, y reacciona CO2 con H2. Con $x$ atm:

      | | CO₂ | H₂ | CO | H₂O |
      |---|---|---|---|---|
      | inicio | 2 | 1 | 2 | 1 |
      | equilibrio | $2-x$ | $1-x$ | $2+x$ | $1+x$ |

      $$
      \frac{(2+x)(1+x)}{(2-x)(1-x)} = 2{,}90
      \quad\Longrightarrow\quad
      x = 0{,}344\ \text{atm}
      $$

      La otra raíz, 5,81, deja presiones negativas. La presión total no
      cambia, 6 atm, y la composición es cada presión entre 6:

      $$
      \boxed{27{,}6\ \%\ \mathrm{CO_2} \quad 39{,}1\ \%\ \mathrm{CO} \quad 22{,}4\ \%\ \mathrm{H_2O} \quad 10{,}9\ \%\ \mathrm{H_2}}
      $$

      La colección da 27,66 %, 39 %, 22,33 % y 11 %: redondea $x$ a 0,34
      antes de dividir, y las cuatro cifras se mueven menos de una décima.

      **Lo que enseña.** De un apartado a otro se conserva la constante, no el
      porcentaje de conversión. En b) ya hay productos desde el principio, y
      la reacción avanza mucho menos que el 63 % de a).

  # ── La autoevaluación del tema 8, en su orden. El material publica la
  #    resolución, manuscrita y escaneada; aquí se contrasta paso a paso. Tiene
  #    dos despistes que no cambian ninguna conclusión —una R de 8,31 donde se
  #    calcula con 0,082 en el 1, y un Δn = 2 donde es 1 en el 3— y se dicen
  #    en la fuente y en la resolución.
  - id: colfq8-auto1-el-sulfuro-de-amonio-que-se-descompone
    titulo: El hidrógeno sulfuro de amonio, cuánto se descompone y qué lo mueve
    fuente: >-
      Problema 1 · Autoevaluación del tema 8, Equilibrio químico · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · El material publica la resolución, manuscrita, que da el
      37,2 %; escribe R = 8,31 donde calcula con 0,082. El diagnóstico de los
      errores es nuestro.
    nivel: practica
    enunciado: |
      El hidrógeno sulfuro de amonio, utilizado en el revelado de fotografías,
      es inestable y se descompone según la siguiente reacción química:

      $$
      \mathrm{NH_4HS\,(s)} \leftrightarrow \mathrm{NH_3\,(g)} + \mathrm{H_2S\,(g)} \qquad \Delta H = 90\ \text{kJ/mol}
      $$

      Si en un recipiente de 2,4 L se introducen 0,06 moles de hidrógeno
      sulfuro de amonio a 20 ºC y teniendo en cuenta que la constante de
      equilibrio, Kp, de la reacción es 0,05 a dicha temperatura:

      **a)** En el equilibrio, ¿cuál será el porcentaje de sólido que se
      descompondrá en amoníaco y sulfuro de hidrógeno?

      **b)** Después de alcanzar el equilibrio anterior, explica brevemente:

      **i)** ¿Cómo influirá en la presión del amoníaco el añadir más cantidad
      de hidrógeno sulfuro de amonio?

      **ii)** ¿Qué ocurrirá si se disminuye a la mitad el volumen del
      recipiente? ¿Y si se aumenta la temperatura?

      **iii)** ¿Cuál será el valor de la constante de equilibrio, Kp, si la
      presión total en el recipiente aumenta 3,5 veces con respecto al valor
      inicial a la temperatura de 20 ºC?
    pide: El porcentaje de sólido que se descompone, y cómo responde el equilibrio a tres cambios.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo queda $K_p$, y qué dice de las presiones de los dos gases?
        opciones:
          - texto: >-
              $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$, y como los dos
              gases salen del sólido uno a uno, cada presión vale
              $\sqrt{K_p}$
            correcta: true
            mensaje: |
              Eso es. El sólido no entra, y todo el gas sale de él a partes
              iguales: $P_{\mathrm{NH_3}} = P_{\mathrm{H_2S}} = p$ y
              $K_p = p^{2}$. Una raíz cuadrada y ya tienes las dos presiones.
          - texto: >-
              $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}/P_{\mathrm{NH_4HS}}$
            mensaje: |
              El NH4HS es sólido: no ejerce presión parcial y no entra en la
              constante. Si entrara, $K_p$ dependería de cuánto sólido hay, y
              el apartado b) i) existe para ver que no.
          - texto: >-
              $K_p = P_{\mathrm{NH_3}} + P_{\mathrm{H_2S}}$, la presión total
            mensaje: |
              En una constante las presiones se multiplican. La presión total
              es la suma, y aquí vale $2\sqrt{0{,}05} = 0{,}447$ atm, no 0,05.
          - texto: >-
              No se puede saber sin conocer cuánto sólido queda
            mensaje: |
              La cantidad de sólido no entra en la constante. Mientras quede
              algo de sólido, las presiones de equilibrio son las mismas.

      - tipo: calcular
        titulo: La presión de cada gas
        pregunta: |
          ¿Cuánto vale la presión del amoníaco en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.2236'
          tolerancia: 0.002
          formato: la presión en atm, con cuatro cifras decimales
        distractores:
          - valor: '0.05'
            mensaje: |
              Has tomado la constante por la presión del amoníaco. La
              constante es el **producto** de las dos presiones, y las dos son
              iguales: cada una es su raíz cuadrada.
          - valor: '0.025'
            mensaje: |
              Has repartido la constante entre los dos gases, como si fuera una
              suma. Es un producto: $p \cdot p = 0{,}05$.
        pista: |
          $K_p = p \cdot p = 0{,}05$.
        desarrollo: |
          $$
          P_{\mathrm{NH_3}} = P_{\mathrm{H_2S}} = \sqrt{0{,}05} = 0{,}2236\ \text{atm}
          $$

      - tipo: calcular
        titulo: El porcentaje descompuesto
        pregunta: |
          a) ¿Qué porcentaje del sólido se descompone?
        respuesta:
          tipo: numero
          valor: '37.2'
          tolerancia: 0.15
          formato: el porcentaje, con una cifra decimal
        distractores:
          - valor: '0.37'
            mensaje: |
              Has usado $R = 8{,}314$ J/(mol·K). Con presiones en atmósferas y
              litros, la R es 0,082 atm·L/(mol·K): con la otra salen cien veces
              menos moles.
          - valor: '74.5'
            mensaje: |
              Has sumado los moles de los dos gases. Cada mol de sólido que se
              descompone da un mol de NH3 **y** uno de H2S, así que el sólido
              descompuesto son los moles de uno solo.
          - valor: '62.8'
            mensaje: |
              Es el porcentaje que queda sin descomponer. Lo que se pide es el
              que se descompone: 37,2 %.
        pista: |
          Los moles de NH3 son los de sólido descompuesto: $n = PV/RT$, con
          2,4 L y 293 K.
        desarrollo: |
          $$
          n = \frac{0{,}2236 \cdot 2{,}4}{0{,}082 \cdot 293} = 0{,}02234\ \text{mol}
          $$

          $$
          \frac{0{,}02234}{0{,}06}\cdot 100 = 37{,}2\ \%
          $$

          Es el resultado del material. Su resolución va por $K_c$ —pasa la
          constante a concentraciones, $8{,}66\cdot 10^{-5}$, y resuelve
          $x^{2}/2{,}4^{2} = K_c$—, que es la misma cuenta.

      - tipo: calcular
        titulo: La constante con la presión 3,5 veces mayor
        pregunta: |
          b) iii) Si la presión total aumenta 3,5 veces a 20 ºC, ¿cuánto vale
          $K_p$?
        respuesta:
          tipo: numero
          valor: '0.05'
          tolerancia: 0.001
          formato: la constante, con dos decimales
        distractores:
          - valor: '0.6125'
            mensaje: |
              Has multiplicado cada presión por 3,5 y la constante por
              $3{,}5^{2}$. Eso es lo que le pasaría al cociente de reacción
              en ese instante, no a la constante: la constante solo depende de
              la temperatura.
          - valor: '0.175'
            mensaje: |
              Has multiplicado la constante por 3,5. La constante no sigue a la
              presión: a 20 ºC vale 0,05 haya la presión que haya.
        pista: |
          ¿De qué depende una constante de equilibrio?
        desarrollo: |
          La constante solo depende de la temperatura, y sigue siendo 20 ºC:
          $K_p = 0{,}05$. Si la presión total sube 3,5 veces sin que cambie la
          temperatura, es que ha entrado otra cosa en el recipiente —un gas
          inerte, más amoníaco—, no que haya cambiado la constante. Es la
          respuesta del material.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) entero, como lo entregarías: para i), ii) y iii), qué
          pasa y por qué, en una o dos frases cada uno.
        rubrica:
          - punto: |
              i) Añadir más NH4HS no cambia la presión del amoníaco.
            porque: |
              Es un sólido: no entra en $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$,
              así que mientras quede algo de sólido las dos presiones siguen en
              0,224 atm. «Se desplaza a la derecha porque hay más reactivo» es
              justo el error que el apartado busca.
            minimo: true
          - punto: |
              ii) Con el volumen a la mitad, el equilibrio se desplaza hacia la
              izquierda, hacia el sólido.
            porque: |
              Al comprimir, las dos presiones se duplican de golpe y el
              cociente pasa a valer cuatro veces $K_p$: sobra gas, que se
              recombina en sólido hasta que las presiones vuelven a 0,224 atm.
              Se descompone la mitad que antes, un 18,6 % en vez de un 37,2 %.
            minimo: true
          - punto: |
              ii) Al subir la temperatura, se desplaza hacia la derecha.
            porque: |
              La descomposición es endotérmica, $\Delta H = +90$ kJ/mol, y
              calentar favorece el sentido que absorbe calor. Es además el
              único de los cambios que modifica la constante: $K_p$ sube.
          - punto: |
              iii) La constante sigue valiendo 0,05 a 20 ºC.
            porque: |
              $K_p$ solo depende de la temperatura. Una presión total mayor a
              la misma temperatura cambia las cantidades, o dice que ha entrado
              otro gas, pero no la constante. Multiplicarla por 3,5 o por
              $3{,}5^{2}$ es confundir la constante con el cociente.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El sólido no entra: $K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}}$,
              y como los dos gases salen del sólido a partes iguales, cada
              presión vale $\sqrt{0{,}05} = 0{,}224$ atm.
          - texto: >-
              En 2,4 L a 293 K, eso son 0,0223 mol de cada gas, los mismos que
              de sólido descompuesto.
          - texto: >-
              Sobre los 0,06 mol iniciales, se descompone el 37,2 %.
          - texto: >-
              Comprimir y calentar mueven el equilibrio; añadir sólido no. Y la
              constante solo la cambia la temperatura.
          - texto: >-
              Al añadir más NH4HS, el equilibrio se desplaza hacia la derecha y
              sube la presión del amoníaco.
            trampa: true
            mensaje: |
              El NH4HS es sólido y no está en la constante: añadir más no
              cambia ningún cociente, y la presión del amoníaco sigue en 0,224
              atm. Es lo mismo que con la caliza del problema 4 de la
              colección: en un
              recipiente cerrado, el gas se para en la misma presión se eche el
              sólido que se eche.
        veredicto: |
          Un sólido fija las presiones de los gases con los que está en
          equilibrio; cuánto sólido haya no importa mientras quede algo.

    resolucion: |
      **a · Cuánto se descompone.** El sólido no entra en la constante, y los
      dos gases salen de él uno a uno, así que sus presiones son iguales:

      $$
      K_p = P_{\mathrm{NH_3}}\cdot P_{\mathrm{H_2S}} = p^{2} = 0{,}05
      \quad\Longrightarrow\quad
      p = 0{,}2236\ \text{atm}
      $$

      Los moles de amoníaco en los 2,4 L son los de sólido descompuesto:

      $$
      n = \frac{0{,}2236 \cdot 2{,}4}{0{,}082 \cdot 293} = 0{,}02234\ \text{mol}
      \qquad
      \boxed{\frac{0{,}02234}{0{,}06} = 37{,}2\ \%}
      $$

      Coincide con el material. Su resolución pasa antes a $K_c$ y escribe
      $0{,}05 = K_c\,(8{,}31 \cdot 293)^{2}$, pero el $8{,}66\cdot 10^{-5}$
      que obtiene es el de $R = 0{,}082$: con 8,31 J/(mol·K) saldría
      $8{,}4\cdot 10^{-9}$ y un 0,37 %. Con presiones en atmósferas, la R es
      0,082.

      **b · Las tres perturbaciones.**

      - **i)** Añadir sólido no hace nada: no está en la constante, y la
        presión del amoníaco sigue en 0,224 atm.
      - **ii)** Con el volumen a la mitad, las presiones se duplican, el
        cociente pasa a $4K_p$ y el equilibrio va hacia el sólido hasta
        recuperar 0,224 atm: se descompone un 18,6 %. Al calentar, como la
        reacción es endotérmica, va hacia los gases y $K_p$ sube.
      - **iii)** $K_p$ sigue valiendo 0,05: solo depende de la temperatura.

      Coinciden con las tres respuestas del material.

      **La idea que ata el problema.** Con un sólido de por medio, la
      constante fija la presión de los gases y nada más. Por eso añadir sólido
      no mueve nada, comprimir obliga a que parte del gas vuelva a ser sólido,
      y, mientras no entre otro gas, la única forma de cambiar la presión
      de equilibrio es cambiar la temperatura.

  - id: colfq8-auto2-el-yoduro-de-hidrogeno-que-no-estaba-en-equilibrio
    titulo: Hidrógeno, yodo y yoduro de hidrógeno, que no empiezan en equilibrio
    fuente: >-
      Problema 2 · Autoevaluación del tema 8, Equilibrio químico · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · El material publica la resolución, manuscrita, que da
      [H2] = [I2] = 6,6 × 10⁻³ M, [HI] = 0,0468 M y Kp = Kc = 50,5; el
      diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      A 448 ºC la constante de equilibrio Kc para la reacción:

      $$
      \mathrm{H_2\,(g)} + \mathrm{I_2\,(g)} \leftrightarrow 2\,\mathrm{HI\,(g)}
      $$

      es 50,5. En un recipiente de 5 L se introducen 0,2 g de H2 (g), 25,4 g
      de I2 (g) y 12,8 g de HI. Determinar: a) en que sentido se da el
      equilibrio, b) calcular las concentraciones en el equilibrio, c)
      calcular Kp , d) Como afecta al equilibrio la eliminación de moles de HI
      (g) y e) Como afecta al equilibrio un aumento de la presión.
    pide: Hacia dónde evoluciona la mezcla, las concentraciones en el equilibrio, Kp, y el efecto de retirar HI y de aumentar la presión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de montar la tabla: ¿está la mezcla en equilibrio, y si no,
          hacia dónde va?
        opciones:
          - texto: >-
              Hay que calcular $Q_c$: vale 1, menor que 50,5, así que avanza
              hacia el HI
            correcta: true
            mensaje: |
              Eso es. Es lo que pide el apartado a), y además dice el signo de
              la incógnita: el H2 y el I2 bajan y el HI sube.
          - texto: >-
              Está en equilibrio, porque están las tres especies
            mensaje: |
              Que estén las tres no dice nada: el equilibrio es un cociente
              concreto, 50,5, y aquí el cociente vale 1.
          - texto: >-
              Va hacia la izquierda, porque ya hay HI desde el principio
            mensaje: |
              Lo que decide no es que haya HI sino si hay más o menos del que
              admite el equilibrio. Con $Q_c = 1$ frente a 50,5, falta HI.
          - texto: >-
              No se puede saber hasta resolver la ecuación
            mensaje: |
              Se sabe antes, con $Q_c$, y conviene: resolver la tabla con el
              sentido equivocado da una incógnita negativa.

      - tipo: calcular
        titulo: El cociente de reacción
        pregunta: |
          a) ¿Cuánto vale $Q_c$ con las cantidades iniciales?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: el cociente, con dos decimales
        distractores:
          - valor: '50'
            mensaje: |
              Te has dejado el cuadrado del HI: $0{,}02/(0{,}02 \cdot 0{,}02)$.
              Y es un error traicionero, porque 50 se parece tanto a 50,5 que
              la mezcla parece estar ya en equilibrio. El 2 de la ecuación es
              exponente.
          - valor: '32.25'
            mensaje: |
              Has metido los gramos en el cociente. Van concentraciones: pasa
              cada masa a moles —2, 254 y 128 g/mol— y divide entre 5 L.
        pista: |
          Pasa las masas a moles —2, 254 y 128 g/mol— y después a
          concentración en los 5 L.
        desarrollo: |
          $$
          n_{\mathrm{H_2}} = \frac{0{,}2}{2} = 0{,}1 \qquad n_{\mathrm{I_2}} = \frac{25{,}4}{254} = 0{,}1 \qquad n_{\mathrm{HI}} = \frac{12{,}8}{128} = 0{,}1
          $$

          $$
          Q_c = \frac{(0{,}1/5)^{2}}{(0{,}1/5)(0{,}1/5)} = 1
          $$

          $Q_c < K_c$: la reacción avanza hacia la derecha, como concluye el
          material.

      - tipo: calcular
        titulo: El hidrógeno del equilibrio
        pregunta: |
          b) ¿Cuánto vale $[\mathrm{H_2}]$ en el equilibrio? Es la misma que
          $[\mathrm{I_2}]$.
        respuesta:
          tipo: numero
          valor: '6.59e-3'
          tolerancia: 1e-4
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '4.93e-3'
            mensaje: |
              Te has dejado el 2 del HI en la tabla: por cada mol de H2 que
              reacciona se forman **dos** de HI, así que la columna del HI es
              $0{,}1 + 2x$ y no $0{,}1 + x$.
          - valor: '0.0329'
            mensaje: |
              Son los moles de H2, no su concentración. Divide entre los 5 L.
          - valor: '0.02'
            mensaje: |
              Es la concentración inicial. La mezcla no estaba en equilibrio:
              reacciona hasta que el cociente llega a 50,5.
        pista: |
          $K_c = \dfrac{(0{,}1+2x)^{2}}{(0{,}1-x)^{2}}$, con moles porque el
          volumen se cancela: los dos lados son cuadrados, y se puede sacar la
          raíz.
        desarrollo: |
          Con dos moles de gas a cada lado, el volumen se cancela y la tabla
          puede ir en moles:

          $$
          \sqrt{50{,}5} = 7{,}106 = \frac{0{,}1 + 2x}{0{,}1 - x}
          \quad\Longrightarrow\quad
          x = \frac{0{,}7106 - 0{,}1}{9{,}106} = 0{,}06706\ \text{mol}
          $$

          $$
          [\mathrm{H_2}] = [\mathrm{I_2}] = \frac{0{,}1 - 0{,}06706}{5} = 6{,}59\cdot 10^{-3}\ \text{M}
          $$

          El material da $6{,}6\cdot 10^{-3}$ M: llega a las dos raíces, 0,067
          y 0,159, y tacha la segunda, que gastaría más H2 del que hay.

      - tipo: calcular
        titulo: El yoduro de hidrógeno del equilibrio
        pregunta: |
          ¿Y $[\mathrm{HI}]$?
        respuesta:
          tipo: numero
          valor: '0.0468'
          tolerancia: 0.0003
          formato: la concentración en mol/L, con cuatro cifras decimales
        distractores:
          - valor: '0.0351'
            mensaje: |
              Sale de olvidar el 2 del HI en la tabla. Por cada $x$ que
              reacciona de H2 se forman $2x$ de HI.
          - valor: '0.234'
            mensaje: |
              Son los moles de HI. En 5 L son 0,0468 M.
        pista: |
          $[\mathrm{HI}] = (0{,}1 + 2x)/5$.
        desarrollo: |
          $$
          [\mathrm{HI}] = \frac{0{,}1 + 2 \cdot 0{,}06706}{5} = 0{,}0468\ \text{M}
          $$

          Es el valor del material. Comprobación:
          $\frac{0{,}0468^{2}}{0{,}00659^{2}} = 50{,}4$.

      - tipo: calcular
        titulo: La constante en presiones
        pregunta: |
          c) ¿Cuánto vale $K_p$ a 448 ºC?
        respuesta:
          tipo: numero
          valor: '50.5'
          tolerancia: 0.05
          formato: la constante, con una cifra decimal
        distractores:
          - valor: '2986'
            mensaje: |
              Has usado $\Delta n = 1$. Hay dos moles de gas a cada lado: el
              I2 también es gas, y $\Delta n = 2 - 2 = 0$.
          - valor: '0.854'
            mensaje: |
              Has usado $\Delta n = -1$. Cuenta los gases: dos a la izquierda,
              H2 e I2, y dos a la derecha. $\Delta n = 0$.
        pista: |
          $K_p = K_c\,(RT)^{\Delta n}$. Cuenta los moles de gas a cada lado.
        desarrollo: |
          $$
          \Delta n = 2 - (1 + 1) = 0
          \quad\Longrightarrow\quad
          K_p = K_c\,(RT)^{0} = K_c = 50{,}5
          $$

          Es la respuesta del material.

      - tipo: justificar
        pregunta: Ordena la resolución, apartados d) y e) incluidos. Una pieza es falsa.
        piezas:
          - texto: >-
              Con 0,1 mol de cada especie, $Q_c = 1 < 50{,}5$: la mezcla avanza
              hacia el HI.
          - texto: >-
              La tabla da $x = 0{,}067$ mol: 6,59·10⁻³ M de H2 y de I2, y
              0,0468 M de HI.
          - texto: >-
              Con dos moles de gas a cada lado, $K_p = K_c = 50{,}5$.
          - texto: >-
              d) Al retirar HI el cociente baja, y el equilibrio avanza hacia
              la derecha para reponerlo.
          - texto: >-
              e) Un aumento de la presión desplaza el equilibrio hacia el HI,
              que es el producto.
            trampa: true
            mensaje: |
              La presión solo desplaza un equilibrio si el número de moles de
              gas cambia, y aquí no: dos a cada lado. Comprimir multiplica las
              tres concentraciones por lo mismo y el cociente no se mueve. Es
              la misma razón por la que $K_p = K_c$.
        veredicto: |
          Con $\Delta n = 0$ pasan tres cosas a la vez: el volumen se cancela
          en la tabla, $K_p = K_c$ y la presión no desplaza nada.

    resolucion: |
      **a · Hacia dónde va.** Con las masas molares 2, 254 y 128 g/mol, hay
      0,1 mol de cada especie, 0,02 M en los 5 L:

      $$
      Q_c = \frac{0{,}02^{2}}{0{,}02 \cdot 0{,}02} = 1 < K_c = 50{,}5
      $$

      Falta HI: la reacción avanza hacia la derecha.

      **b · Las concentraciones.** Con $x$ moles de H2 que reaccionan, y como
      el volumen se cancela:

      $$
      \frac{(0{,}1 + 2x)^{2}}{(0{,}1 - x)^{2}} = 50{,}5
      \quad\Longrightarrow\quad
      \frac{0{,}1 + 2x}{0{,}1 - x} = 7{,}106
      \quad\Longrightarrow\quad
      x = 0{,}0671
      $$

      $$
      \boxed{[\mathrm{H_2}] = [\mathrm{I_2}] = 6{,}59\cdot 10^{-3}\ \text{M} \qquad [\mathrm{HI}] = 0{,}0468\ \text{M}}
      $$

      Coinciden con el material, que desarrolla el cuadrado y tacha la otra
      raíz, 0,159: gastaría más H2 del que hay.

      **c · Kp.** $\Delta n = 0$, así que $K_p = K_c = 50{,}5$.

      **d · Retirar HI.** El cociente baja por debajo de $K_c$ y el sistema
      produce más HI: se desplaza hacia la derecha.

      **e · Aumentar la presión.** No desplaza nada: con dos moles de gas a
      cada lado, comprimir multiplica todas las concentraciones por lo mismo
      y el cociente no cambia.

      Las cinco respuestas coinciden con el material.

      **Un error que merece nombre.** Si al calcular $Q_c$ se olvida el
      cuadrado del HI sale 50, casi 50,5, y la mezcla parece estar ya en
      equilibrio. Todo lo que viene después se hunde por un exponente.

  - id: colfq8-auto3-tres-constantes-un-solido-y-una-combinacion
    titulo: Tres constantes, un sólido que no entra y una reacción que se combina
    fuente: >-
      Problema 3 · Autoevaluación del tema 8, Equilibrio químico · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · El material publica la resolución, manuscrita, que da
      Kp = 3,9 × 10⁻³²; para la descomposición del agua oxigenada escribe
      Δn = 2, donde es 1, sin que cambie su conclusión. El diagnóstico de los
      errores es nuestro.
    nivel: practica
    enunciado: |
      a) Escribir las expresiones de las constantes de equilibrio Kc y Kp para
      el equilibrio:

      $$
      \mathrm{(NH_4)_2Se\,(s)} \leftrightarrow 2\,\mathrm{NH_3(g)} + \mathrm{H_2Se\,(g)}
      $$

      b) Para cuál de las siguientes reacciones las constantes de equilibrio Kc
      y Kp son iguales, justificar la respuesta:

      $$
      2\,\mathrm{H_2O_2\,(ac)} \leftrightarrow 2\,\mathrm{H_2O\,(l)} + \mathrm{O_2\,(g)}
      $$

      $$
      \mathrm{PCl_3\,(g)} + 3\,\mathrm{NH_3(g)} \leftrightarrow 3\,\mathrm{HCl\,(g)} + \mathrm{P(NH_2)_3\,(g)}
      $$

      c) Calcular la constante de equilibrio Kp de la reacción:

      $$
      \mathrm{N_2\,(g)} + \mathrm{O_2\,(g)} + \mathrm{Br_2\,(g)} \leftrightarrow 2\,\mathrm{NOBr\,(g)}
      $$

      a partir de la siguiente información a 298 K:

      $$
      2\,\mathrm{NO\,(g)} + \mathrm{Br_2\,(g)} \leftrightarrow 2\,\mathrm{NOBr\,(g)} \qquad K_c = 2.0
      $$

      $$
      2\,\mathrm{NO\,(g)} \leftrightarrow \mathrm{N_2\,(g)} + \mathrm{O_2\,(g)} \qquad K_c = 2{,}1 \times 10^{30}
      $$
    pide: Las expresiones de Kc y Kp del primer equilibrio, en cuál de las dos reacciones coinciden Kc y Kp, y la Kp de la formación del NOBr.

    pasos:
      - tipo: reconocer
        pregunta: |
          a) ¿Cuáles son las expresiones de las constantes para
          $\mathrm{(NH_4)_2Se\,(s)} \leftrightarrow 2\,\mathrm{NH_3(g)} + \mathrm{H_2Se\,(g)}$?
        opciones:
          - texto: >-
              $K_c = [\mathrm{NH_3}]^{2}[\mathrm{H_2Se}]$ y
              $K_p = P_{\mathrm{NH_3}}^{2}\,P_{\mathrm{H_2Se}}$, sin el sólido
            correcta: true
            mensaje: |
              Eso es, y es lo que escribe el material. El sólido no entra, y el
              2 del amoniaco es exponente en las dos constantes.
          - texto: >-
              $K_c = [\mathrm{NH_3}]^{2}[\mathrm{H_2Se}]/[\mathrm{(NH_4)_2Se}]$,
              y $K_p$ igual con presiones
            mensaje: |
              El seleniuro de amonio es sólido y no entra en ninguna de las
              dos: su «concentración» no cambia por mucho sólido que haya.
          - texto: >-
              $K_c = [\mathrm{NH_3}][\mathrm{H_2Se}]$ y
              $K_p = P_{\mathrm{NH_3}}\,P_{\mathrm{H_2Se}}$
            mensaje: |
              Falta el exponente del amoniaco. Se forman dos moles de NH3 por
              cada uno de H2Se, y el coeficiente 2 va de exponente.
          - texto: >-
              $K_p = K_c$, porque a la izquierda no hay ningún gas
            mensaje: |
              Al revés: a la izquierda no hay gas y a la derecha hay tres
              moles, así que $\Delta n = 3$ y $K_p = K_c\,(RT)^{3}$. No son
              iguales.

      - tipo: calcular
        titulo: El cambio de moles de gas del agua oxigenada
        pregunta: |
          b) ¿Cuánto vale $\Delta n$ de gas en
          $2\,\mathrm{H_2O_2\,(ac)} \leftrightarrow 2\,\mathrm{H_2O\,(l)} + \mathrm{O_2\,(g)}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Es lo que escribe la resolución del material, y no sale: el agua
              es líquida y el agua oxigenada está disuelta, así que el único
              gas es el O2 y $\Delta n = 1 - 0 = 1$. Su conclusión,
              $K_p \neq K_c$, sí es la buena.
          - valor: '3'
            mensaje: |
              Has contado el agua como gas: $2 + 1 - 0$. Está escrita como
              líquido, (l), y en $\Delta n$ solo cuentan los gases.
          - valor: '-1'
            mensaje: |
              Has restado al revés, reactivos menos productos. $\Delta n$ es
              gas de los productos menos gas de los reactivos.
        pista: |
          Solo cuentan los gases: mira el estado que lleva cada especie entre
          paréntesis.
        desarrollo: |
          En la primera solo el O2 es gas:

          $$
          \Delta n = 1 - 0 = 1
          \quad\Longrightarrow\quad
          K_p = K_c\,RT \neq K_c
          $$

          En la segunda todo es gas, con cuatro moles a cada lado:

          $$
          \Delta n = (3 + 1) - (1 + 3) = 0
          \quad\Longrightarrow\quad
          K_p = K_c
          $$

          Así que son iguales en la segunda, como concluye el material.

      - tipo: calcular
        titulo: La constante combinada
        pregunta: |
          c) ¿Cuánto vale $K_c$ de
          $\mathrm{N_2} + \mathrm{O_2} + \mathrm{Br_2} \leftrightarrow 2\,\mathrm{NOBr}$?
        respuesta:
          tipo: numero
          valor: '9.52e-31'
          tolerancia: 5e-33
          formato: la constante, en notación científica, como 3,5e-4
        distractores:
          - valor: '4.2e30'
            mensaje: |
              Has multiplicado las dos constantes tal cual. La segunda
              reacción va al revés de como la necesitas —el N2 y el O2 son
              reactivos en la pedida—, así que entra su inversa.
          - valor: '1.05e30'
            mensaje: |
              Has invertido la que no tocaba. La del NOBr ya va en el sentido
              de la pedida; la que hay que dar la vuelta es la del NO.
        pista: |
          La reacción pedida es la segunda dada la vuelta más la primera.
          Invertir una reacción invierte su constante, y sumar reacciones
          multiplica las constantes.
        desarrollo: |
          $$
          \mathrm{N_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{NO} \qquad K = \frac{1}{2{,}1\cdot 10^{30}}
          $$

          $$
          2\,\mathrm{NO} + \mathrm{Br_2} \rightarrow 2\,\mathrm{NOBr} \qquad K = 2{,}0
          $$

          $$
          K_c = \frac{2{,}0}{2{,}1\cdot 10^{30}} = 9{,}52\cdot 10^{-31}
          $$

          Coincide con la resolución del material. Con las dos cifras que
          traen los datos, $9{,}5\cdot 10^{-31}$: la casilla acepta las dos.

      - tipo: calcular
        titulo: La constante en presiones
        pregunta: |
          ¿Y $K_p$ a 298 K?
        respuesta:
          tipo: numero
          valor: '3.90e-32'
          tolerancia: 5e-34
          formato: la constante, en notación científica, como 3,5e-4
        distractores:
          - valor: '2.33e-29'
            mensaje: |
              Has multiplicado por $RT$ en vez de dividir. Hay tres moles de
              gas a la izquierda y dos a la derecha: $\Delta n = -1$, y $RT$
              va dividiendo.
          - valor: '3.84e-34'
            mensaje: |
              Has usado $R = 8{,}314$ J/(mol·K). Para pasar de concentraciones
              a presiones en atmósferas, la R es 0,082 atm·L/(mol·K).
          - valor: '9.52e-31'
            mensaje: |
              Es $K_c$. Aquí $\Delta n = -1$, así que $K_p$ y $K_c$ no
              coinciden: se diferencian en el factor $RT = 24{,}4$.
        pista: |
          $K_p = K_c\,(RT)^{\Delta n}$, con $\Delta n = 2 - 3 = -1$.
        desarrollo: |
          $$
          \Delta n = 2 - (1 + 1 + 1) = -1
          $$

          $$
          K_p = \frac{9{,}52\cdot 10^{-31}}{0{,}082 \cdot 298} = 3{,}90\cdot 10^{-32}
          $$

          Coincide con el material, $3{,}9\cdot 10^{-32}$.

      - tipo: justificar
        pregunta: Ordena la resolución de b) y c). Una pieza es falsa.
        piezas:
          - texto: >-
              En la del agua oxigenada solo el O2 es gas: $\Delta n = 1$ y
              $K_p = K_c\,RT$.
          - texto: >-
              En la del PCl3 todo es gas, cuatro moles a cada lado:
              $\Delta n = 0$ y $K_p = K_c$.
          - texto: >-
              La reacción de c) es la segunda dada la vuelta más la primera:
              $K_c = 2{,}0/(2{,}1\cdot 10^{30}) = 9{,}52\cdot 10^{-31}$.
          - texto: >-
              Con $\Delta n = -1$, $K_p = K_c/RT = 3{,}9\cdot 10^{-32}$.
          - texto: >-
              En la del agua oxigenada $K_p = K_c$, porque a la izquierda no
              hay ningún gas y las presiones no intervienen.
            trampa: true
            mensaje: |
              Que no haya gas a la izquierda no anula nada: a la derecha hay
              O2, así que $\Delta n = 1$ y $K_p = K_c\,RT$, que a 298 K es
              24 veces mayor. Para que coincidan, los moles de gas tienen que
              ser los mismos a los dos lados.
        veredicto: |
          $\Delta n$ cuenta solo gases, y decide si las dos constantes
          coinciden. Invertir una reacción invierte su constante.

    resolucion: |
      **a · Las expresiones.** El sólido no entra, y el coeficiente del
      amoniaco es exponente:

      $$
      K_c = [\mathrm{NH_3}]^{2}[\mathrm{H_2Se}] \qquad K_p = P_{\mathrm{NH_3}}^{2}\,P_{\mathrm{H_2Se}}
      $$

      **b · Cuándo coinciden.** $K_p = K_c\,(RT)^{\Delta n}$, así que
      coinciden cuando $\Delta n = 0$, contando solo gases. En la del agua
      oxigenada solo el O2 es gas y $\Delta n = 1$: no coinciden. En la del
      PCl3 hay cuatro moles de gas a cada lado y $\Delta n = 0$:
      **coinciden en la segunda**.

      **Una errata del material.** Para la primera escribe «Δn = 2 + 0 − 0 =
      2». Es 1 —el agua líquida y el agua oxigenada disuelta no cuentan—, y
      su conclusión, $K_p \neq K_c$, no cambia.

      **c · La constante combinada.** La reacción pedida es la segunda dada
      la vuelta más la primera, y sumar reacciones multiplica constantes:

      $$
      K_c = 2{,}0 \cdot \frac{1}{2{,}1\cdot 10^{30}} = 9{,}52\cdot 10^{-31}
      $$

      Con $\Delta n = 2 - 3 = -1$:

      $$
      \boxed{K_p = \frac{9{,}52\cdot 10^{-31}}{0{,}082 \cdot 298} = 3{,}9\cdot 10^{-32}}
      $$

      Coincide con el material.

      **Lo que conviene llevarse.** Las tres reglas con que se manipula una
      constante: invertir la reacción invierte la constante, sumar reacciones
      multiplica las constantes, y pasar de $K_c$ a $K_p$ cuesta
      $(RT)^{\Delta n}$ con $\Delta n$ contando solo los gases.

  # ── El ejercicio resuelto del principio de Le Châtelier del tema 8. El
  #    material publica la resolución, en tres láminas; las dos cuentas que la
  #    hacen cuantitativa son nuestras.
  - id: colfq8-lechatelier-el-ozono-y-tres-perturbaciones
    titulo: El oxígeno y el ozono, y tres maneras de empujar un equilibrio
    fuente: >-
      Ejercicio · Principio de Le Châtelier, tema 8, Equilibrio químico ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución; las dos cuentas
      y el diagnóstico de los errores son nuestros.
    nivel: practica
    enunciado: |
      Dado el siguiente equilibrio entre el oxígeno molecular y el ozono:

      $$
      3\,\mathrm{O_2\,(g)} \;\rightleftharpoons\; 2\,\mathrm{O_3(g)} \qquad \Delta H^{o} = 284\ \text{kJ}
      $$

      ¿Cómo influye sobre el equilibrio:

      **a)** Un aumento de la presión del sistema disminuyendo el volumen,

      **b)** Un aumento de la cantidad de ozono

      **c)** Una disminución de la temperatura
    pide: Hacia dónde se desplaza el equilibrio en cada uno de los tres casos, y por qué.

    pasos:
      - tipo: reconocer
        pregunta: |
          a) Se aumenta la presión reduciendo el volumen. ¿Hacia dónde se
          desplaza el equilibrio?
        opciones:
          - texto: >-
              Hacia el ozono: tres moles de gas pasan a dos, y así el sistema
              ocupa menos
            correcta: true
            mensaje: |
              Eso es, y es lo que responde el material: hacia el miembro con
              menos moles gaseosos, de izquierda a derecha.
          - texto: >-
              Hacia el oxígeno, porque el ozono es una molécula más grande
            mensaje: |
              El tamaño de la molécula no cuenta: en un gas ideal cada mol
              ocupa lo mismo, sea O2 u O3. Lo que cuenta es cuántos moles de
              gas hay a cada lado.
          - texto: >-
              No se desplaza, porque la temperatura no cambia
            mensaje: |
              La constante no cambia, sí; pero el cociente de reacción sí, al
              comprimir, y el sistema se mueve para devolverlo a la constante.
          - texto: >-
              Depende del signo de $\Delta H$
            mensaje: |
              El signo de $\Delta H$ decide qué pasa al cambiar la
              temperatura, apartado c). Para la presión solo importan los moles
              de gas.

      - tipo: calcular
        titulo: El cambio de moles de gas
        pregunta: |
          ¿Cuánto vale $\Delta n$ de gas de la reacción, tal como está escrita?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número entero, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              Has restado al revés, reactivos menos productos. $\Delta n$ es lo
              de la derecha menos lo de la izquierda: $2 - 3$.
          - valor: '5'
            mensaje: |
              Has sumado los moles de los dos lados. $\Delta n$ es una
              diferencia: productos menos reactivos.
        pista: |
          Productos menos reactivos, contando solo los gases.
        desarrollo: |
          $$
          \Delta n = 2 - 3 = -1
          $$

          Negativo: el lado del ozono tiene menos moles de gas, y es hacia
          donde empuja una compresión.

      - tipo: calcular
        titulo: El cociente al comprimir
        pregunta: |
          Si el volumen se reduce a la mitad, todas las presiones parciales se
          duplican en el instante. ¿Por cuánto queda multiplicado $Q_p$ en ese
          momento?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: el factor que multiplica a Q, con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              Tienes el cociente del revés. En $Q_p$ el ozono va arriba, al
              cuadrado, y el oxígeno abajo, al cubo: $2^{2}/2^{3}$.
          - valor: '0.125'
            mensaje: |
              Solo has duplicado el oxígeno. El ozono también está en el
              recipiente, y su presión se duplica igual: $2^{2}/2^{3}$.
          - valor: '4'
            mensaje: |
              Solo has duplicado el ozono. El oxígeno está abajo, al cubo, y
              también se duplica: $2^{2}/2^{3}$.
        pista: |
          $Q_p = P_{\mathrm{O_3}}^{2}/P_{\mathrm{O_2}}^{3}$: el numerador queda
          multiplicado por $2^{2}$ y el denominador por $2^{3}$.
        desarrollo: |
          $$
          Q_p' = \frac{(2P_{\mathrm{O_3}})^{2}}{(2P_{\mathrm{O_2}})^{3}} = \frac{2^{2}}{2^{3}}\,Q_p = \frac{Q_p}{2}
          $$

          El cociente se queda en la mitad de $K_p$: falta ozono, y el sistema
          lo forma hasta volver a $K_p$. Es la cuenta que hay detrás de «hacia
          donde haya menos moles de gas».

      - tipo: redactar
        que: deduccion
        consigna: |
          Los tres apartados en papel, como los entregarías: hacia dónde se
          desplaza el equilibrio en cada caso y por qué, en una o dos frases.
        rubrica:
          - punto: |
              a) Hacia el ozono, de izquierda a derecha, porque es el lado con
              menos moles de gas.
            porque: |
              Comprimir sube la presión, y el sistema responde en el sentido
              que la reduce: de tres moles de gas a dos. El número que lo
              sostiene es $\Delta n = -1$, o el cociente que cae a la mitad.
            minimo: true
          - punto: |
              b) Hacia el oxígeno, de derecha a izquierda, consumiendo parte
              del ozono añadido.
            porque: |
              Añadir un producto sube el cociente por encima de la constante,
              y el sistema lo gasta para volver a ella. La constante no cambia.
            minimo: true
          - punto: |
              c) Hacia el oxígeno, porque la reacción es endotérmica.
            porque: |
              Con $\Delta H^{o} = +284$ kJ el calor actúa como un reactivo:
              al enfriar, el sistema va en el sentido que desprende calor, que
              es el inverso.
            minimo: true
          - punto: |
              c) Y además la constante disminuye.
            porque: |
              De las tres perturbaciones, la temperatura es la única que cambia
              la constante; las otras dos cambian el cociente. Decirlo con
              van't Hoff, como el material, es lo que distingue una respuesta
              de manual de una razonada.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado c), como lo hace el material. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción es endotérmica: $\Delta H^{o} = +284$ kJ, y el calor
              actúa como un reactivo más.
          - texto: >-
              Al bajar la temperatura, el sistema responde en el sentido que
              desprende calor: hacia la izquierda, hacia el O2.
          - texto: >-
              Van't Hoff:
              $\ln(K_1/K_2) = -\frac{\Delta H}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)$,
              y con $T_2 < T_1$ el paréntesis es negativo.
          - texto: >-
              Los dos factores negativos dan $\ln(K_1/K_2) > 0$: $K_2 < K_1$, la
              constante baja al enfriar.
          - texto: >-
              Al bajar la temperatura el equilibrio se desplaza, pero la
              constante no cambia, igual que con la presión.
            trampa: true
            mensaje: |
              La temperatura es la única de las tres perturbaciones que cambia
              la constante. La presión y el ozono añadido cambian el cociente,
              y el sistema vuelve a la misma constante; al enfriar, la
              constante nueva es menor, y el sistema se desplaza para llegar a
              ella.
        veredicto: |
          Presión y cantidades mueven el cociente; la temperatura mueve la
          constante.

    resolucion: |
      **a · Más presión, menos volumen.** El equilibrio se desplaza hacia el
      lado con menos moles de gas: de tres de O2 a dos de O3, **hacia la
      derecha**. La cuenta que lo sostiene: con $\Delta n = 2 - 3 = -1$, al
      reducir el volumen a la mitad todas las presiones se duplican y

      $$
      Q_p' = \frac{2^{2}}{2^{3}}\,Q_p = \frac{Q_p}{2} < K_p
      $$

      Falta ozono, y se forma.

      **b · Más ozono.** El cociente sube por encima de la constante y el
      sistema gasta ozono: **hacia la izquierda**.

      **c · Menos temperatura.** Con $\Delta H^{o} = +284$ kJ la reacción es
      endotérmica, y el calor hace de reactivo:

      $$
      3\,\mathrm{O_2} + 284\ \text{kJ} \;\rightleftharpoons\; 2\,\mathrm{O_3}
      $$

      Enfriar es quitar ese «reactivo»: el sistema responde **hacia la
      izquierda**, que es el sentido que desprende calor. Y aquí cambia la
      constante, como muestra el material con van't Hoff:

      $$
      \ln\frac{K_{p1}}{K_{p2}} = -\frac{\Delta H}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right) > 0
      \quad\Longrightarrow\quad
      K_{p2} < K_{p1}
      $$

      porque con $T_2 < T_1$ el paréntesis y el cociente $-\Delta H/R$ son
      negativos los dos. Las tres respuestas coinciden con las del material.

      **Lo que ordena el tema.** Presión y cantidades cambian el cociente, y
      el sistema vuelve a la misma constante. La temperatura cambia la propia
      constante. Por eso en a) y b) la respuesta sale de contar moles, y en c)
      del signo de $\Delta H$.
