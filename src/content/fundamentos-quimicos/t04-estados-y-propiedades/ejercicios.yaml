ejercicios:
  # ── Los dos son NUESTROS (§08). Este tema se examina sin números —dos
  #    preguntas de razonar, media hoja cada una— y eso lo hace engañoso: se
  #    lee en diez minutos y se suspende igual. Los dos ejemplos ponen número
  #    a las dos ideas que el examen da por sabidas: cuánto más débil es lo
  #    intermolecular, y que hervir depende de la presión y no solo del líquido.
  - id: ejfq4-que-se-rompe-al-hervir-agua
    titulo: Qué se rompe cuando hierve el agua, y cuánto cuesta
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Vaporizar un mol de agua cuesta 41 kJ. Romper todos los enlaces O–H de
      un mol de agua cuesta 930 kJ.

      Determinar cuántos moles de agua se podrían vaporizar con la energía
      que costaría romper los enlaces O–H de un solo mol, y explicar qué dice
      esa cifra sobre lo que ocurre al hervir.
    pide: El número de moles vaporizables con 930 kJ, y qué se rompe al hervir.

    pasos:
      - tipo: reconocer
        pregunta: |
          Cuando el agua hierve y se convierte en vapor, ¿qué se rompe?
        opciones:
          - texto: Las fuerzas entre moléculas; las moléculas de agua siguen enteras
            correcta: true
            mensaje: |
              Eso es. El vapor de agua sigue siendo H₂O: lo que se ha vencido
              son los enlaces de hidrógeno y las demás fuerzas
              intermoleculares que mantenían juntas a las moléculas.
          - texto: Los enlaces O–H, y por eso se libera hidrógeno
            mensaje: |
              Si al hervir agua se rompieran los O–H saldría hidrógeno y
              oxígeno gaseosos, y una olla sería una bomba. El vapor que sale
              es agua; solo ha cambiado de estado.
          - texto: Nada, porque un cambio de estado es un proceso físico y no cuesta energía
            mensaje: |
              Es físico, sí, pero cuesta energía: por eso el agua tarda en
              hervir aunque ya esté a 100 °C. Lo que hay que vencer son las
              atracciones entre moléculas.
          - texto: Se rompe la mitad de los enlaces O–H, y por eso cuesta menos
            mensaje: |
              No se rompe ninguno. La diferencia de coste entre los dos
              procesos no viene de romper menos enlaces del mismo tipo, sino
              de romper enlaces de **otro** tipo, mucho más débiles.

      - tipo: calcular
        titulo: La comparación en moles
        pregunta: |
          Con los 930 kJ que costaría romper los enlaces O–H de un mol,
          ¿cuántos moles de agua se podrían vaporizar?
        respuesta:
          tipo: numero
          valor: '22.7'
          tolerancia: 0.1
          formato: un número, con un decimal
        distractores:
          - valor: '889'
            mensaje: |
              Has restado en vez de dividir. La pregunta es cuántas veces cabe
              un coste dentro del otro, y eso es un cociente.
          - valor: '0.044'
            mensaje: |
              Has dividido al revés, $41/930$. Fíjate en qué es lo grande: los
              930 kJ son el presupuesto y los 41 kJ el precio unitario.
          - valor: '971'
            mensaje: |
              Eso es la suma de los dos. Los dos procesos no se encadenan
              aquí: se están comparando.
        pista: |
          Es una división. Presupuesto entre precio por mol.
        desarrollo: |
          $$
          \frac{930}{41} = 22{,}7
          $$

          Con lo que cuesta romper los enlaces internos de un mol se
          vaporizarían casi veintitrés.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Vaporizar un mol de agua cuesta 41 kJ y romper sus enlaces O–H cuesta 930 kJ.
          - texto: 'El cociente es 930/41 = 22,7: lo intramolecular cuesta casi veintitrés veces más que lo intermolecular.'
          - texto: Por eso, al cambiar de estado, se vencen las fuerzas intermoleculares y las moléculas quedan intactas.
          - texto: 'Y por eso también el vapor de agua sigue siendo agua: un cambio de estado no cambia la sustancia.'
          - texto: Como las fuerzas intermoleculares son veintitrés veces más débiles, se pueden despreciar al estudiar el líquido.
            trampa: true
            mensaje: |
              Ser más débiles no es ser despreciables: son **exactamente** las
              que explican que el agua sea líquida a temperatura ambiente
              cuando moléculas parecidas y más pesadas son gases. Despreciarlas
              es quedarse sin poder explicar ni un punto de ebullición.
    resolucion: |
      **Qué se rompe.** Al hervir, el agua pasa de líquido a gas y las
      moléculas de H₂O siguen siendo H₂O. Lo que se vence son las fuerzas
      **intermoleculares** —en el agua, sobre todo enlaces de hidrógeno—, no
      los enlaces covalentes O–H de dentro de cada molécula.

      **La cifra que lo demuestra.** Los dos costes están medidos y no se
      parecen:

      $$
      \frac{930}{41} = 22{,}7
      $$

      Con la energía necesaria para romper los enlaces O–H de un solo mol se
      vaporizarían casi veintitrés moles. Esa proporción es la razón física de
      que un cambio de estado sea barato comparado con una reacción química.

      **Lo que hay que llevarse.** Es la regla general del tema: las fuerzas
      intermoleculares son mucho más débiles que las intramoleculares. El
      temario da la misma comparación con el HCl —431 kJ/mol para disociarlo
      en átomos, 16 kJ/mol para vaporizarlo—, y ahí la razón es todavía mayor.

      Pero débil no es irrelevante. Esas fuerzas débiles son las que deciden
      el punto de fusión, el de ebullición y el estado en que encuentras una
      sustancia a temperatura ambiente, que es justo lo que el examen pregunta.

  - id: ejfq4-donde-hierve-el-agua
    titulo: Dónde hierve el agua, que no siempre es a cien grados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      El agua hierve a 100 °C al nivel del mar. En la cima del Kilimanjaro,
      a 5895 m de altitud, la presión atmosférica es de 350 mmHg y el agua
      hierve a 79 °C.

      Determinar cuántos grados baja la temperatura de ebullición y explicar
      a qué se debe.
    pide: La diferencia de temperatura de ebullición y su causa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa exactamente que un líquido «hierve»?
        opciones:
          - texto: Que su presión de vapor iguala a la presión exterior
            correcta: true
            mensaje: |
              Esa es la definición, y explica todo lo demás. Como la presión
              de vapor sube con la temperatura, basta con bajar la presión
              exterior para que el encuentro se produzca antes.
          - texto: Que ha alcanzado los 100 °C
            mensaje: |
              Cien grados es la temperatura de ebullición **del agua y a
              presión atmosférica normal**, dos condiciones que no siempre se
              cumplen. El dietil éter hierve a 34,6 °C, y el agua del
              Kilimanjaro a 79.
          - texto: Que sus moléculas han roto sus enlaces internos
            mensaje: |
              Eso sería descomponer el agua, no hervirla. Al hervir, las
              moléculas se separan unas de otras pero cada una sigue entera.
          - texto: Que se evapora, que es lo mismo pero más deprisa
            mensaje: |
              No son lo mismo. Un líquido se evapora por la superficie a
              cualquier temperatura; hervir es que se formen burbujas de vapor
              **dentro** del líquido, y eso solo pasa cuando la presión de
              vapor alcanza a la exterior.

      - tipo: calcular
        titulo: La caída de la temperatura de ebullición
        pregunta: |
          ¿Cuántos grados centígrados baja la temperatura de ebullición del
          agua en la cima respecto del nivel del mar?
        respuesta:
          tipo: numero
          valor: '21'
          tolerancia: 0.1
          formato: un número entero, en grados centígrados
        distractores:
          - valor: '79'
            mensaje: |
              Ese es el valor de la temperatura en la cima, no la caída. La
              pregunta es por la diferencia entre las dos.
          - valor: '410'
            mensaje: |
              Has restado las presiones, $760 - 350$. La pregunta es por
              grados, no por milímetros de mercurio; las dos cosas están
              relacionadas pero no son proporcionales.
        pista: |
          Los dos datos están en el enunciado, y la operación es una resta.
        desarrollo: |
          $$
          100 - 79 = 21
          $$

      - tipo: reconocer
        pregunta: |
          Una olla rápida trabaja a unas 2 atm. Siguiendo el mismo
          razonamiento, ¿qué le pasa al agua de dentro?
        opciones:
          - texto: Hierve por encima de 100 °C, y por eso la comida se hace antes
            correcta: true
            mensaje: |
              Exacto, y el temario da la cifra: unos 120 °C. La olla no
              cocina más rápido porque caliente más deprisa, sino porque
              permite que el agua **líquida** llegue a una temperatura que a
              presión normal sería imposible.
          - texto: Hierve por debajo de 100 °C, porque la presión la comprime
            mensaje: |
              Es el sentido contrario. Más presión exterior significa que la
              presión de vapor tiene que llegar más arriba para igualarla, y
              para eso hace falta más temperatura.
          - texto: Hierve igual, a 100 °C, porque eso es una propiedad del agua
            mensaje: |
              La temperatura de ebullición **normal** es una propiedad del
              líquido; la temperatura a la que hierve en un sitio concreto
              depende de la presión de ese sitio. Si no fuera así, la olla
              rápida no serviría para nada.
          - texto: No hierve, porque la presión se lo impide del todo
            mensaje: |
              Se lo impide hasta cierta temperatura, no para siempre. La
              presión de vapor sube sin techo con la temperatura, así que
              siempre acaba alcanzando a la exterior.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Un líquido hierve cuando su presión de vapor iguala a la presión exterior.
          - texto: La presión de vapor de un líquido aumenta siempre al aumentar la temperatura.
          - texto: 'En la cima la presión exterior es de 350 mmHg en vez de 760, así que el encuentro se produce antes: a 79 °C.'
          - texto: 'La caída es de 100 − 79 = 21 °C, y en una olla rápida a 2 atm ocurre lo contrario y el agua llega a unos 120 °C.'
          - texto: En la cima el agua hierve antes porque allí hace más frío y el agua necesita menos energía.
            trampa: true
            mensaje: |
              Mezcla dos cosas y ninguna funciona. La temperatura ambiente no
              entra en la definición de ebullición: lo que decide es la
              **presión**. Y si el argumento fuera cierto, meter una olla en
              el congelador haría hervir el agua antes.
    resolucion: |
      **La definición, que es lo único que hay que saber.** Un líquido hierve
      cuando su presión de vapor iguala a la presión exterior. La temperatura
      de ebullición **normal** es el caso particular en que esa presión
      exterior son 760 mmHg.

      Como la presión de vapor crece siempre con la temperatura, la
      consecuencia es inmediata: si bajas la presión exterior, el encuentro se
      produce a menos temperatura.

      **El número.** En la cima del Kilimanjaro la presión es de 350 mmHg y el
      agua hierve a 79 °C, así que

      $$
      100 - 79 = 21 \text{ °C de caída}
      $$

      **La comprobación en el otro sentido.** Una olla rápida trabaja a unas
      2 atm, y ahí el agua hierve a unos 120 °C. Si el razonamiento del
      Kilimanjaro es el bueno, este sale solo y con el signo contrario: más
      presión exterior, más temperatura hace falta.

      Y de paso explica por qué la olla cocina antes, que no es lo que la
      gente supone. No calienta más deprisa: **permite que el agua líquida
      esté más caliente**. A presión normal el agua no puede pasar de 100 °C
      sin evaporarse, así que la comida nunca ve más de esa temperatura.

      **Por qué esto está en el tema de propiedades y no en otro sitio.**
      Porque la temperatura de ebullición de cada líquido —dietil éter a
      34,6 °C, etanol a 78,3 °C, agua a 100 °C, todas a la misma presión— la
      decide la fuerza de sus fuerzas intermoleculares. El agua hierve la
      última de las tres porque es la única con enlaces de hidrógeno.
