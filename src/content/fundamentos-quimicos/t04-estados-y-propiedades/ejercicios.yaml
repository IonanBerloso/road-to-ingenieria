ejercicios:
  # ── Los dos son NUESTROS (§08). Este tema se examina sin números —dos
  #    preguntas de razonar, media hoja cada una— y eso lo hace engañoso: se
  #    lee en diez minutos y se suspende igual. Los dos ejemplos ponen número
  #    a las dos ideas que el examen da por sabidas: cuánto más débil es lo
  #    intermolecular, y que hervir depende de la presión y no solo del líquido.
  - id: ejfq4-que-se-rompe-al-hervir-agua
    titulo: Qué se rompe cuando hierve el agua, y cuánto cuesta
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Vaporizar un mol de agua cuesta 41 kJ. Romper todos los enlaces O–H de
      un mol de agua cuesta 930 kJ.

      Determinar cuántos moles de agua se podrían vaporizar con la energía
      que costaría romper los enlaces O–H de un solo mol, y explicar qué dice
      esa cifra sobre lo que ocurre al hervir.
    pide: El número de moles vaporizables con 930 kJ, y qué se rompe al hervir.

    pasos:
      - tipo: reconocer
        pregunta: |
          Cuando el agua hierve y se convierte en vapor, ¿qué se rompe?
        opciones:
          - texto: Las fuerzas entre moléculas; las moléculas de agua siguen enteras
            correcta: true
            mensaje: |
              Eso es. El vapor de agua sigue siendo H₂O: lo que se ha vencido
              son los enlaces de hidrógeno y las demás fuerzas
              intermoleculares que mantenían juntas a las moléculas.
          - texto: Los enlaces O–H, y por eso se libera hidrógeno
            mensaje: |
              Si al hervir agua se rompieran los O–H saldría hidrógeno y
              oxígeno gaseosos, y una olla sería una bomba. El vapor que sale
              es agua; solo ha cambiado de estado.
          - texto: Nada, porque un cambio de estado es un proceso físico y no cuesta energía
            mensaje: |
              Es físico, sí, pero cuesta energía: por eso el agua tarda en
              hervir aunque ya esté a 100 °C. Lo que hay que vencer son las
              atracciones entre moléculas.
          - texto: Se rompe la mitad de los enlaces O–H, y por eso cuesta menos
            mensaje: |
              No se rompe ninguno. La diferencia de coste entre los dos
              procesos no viene de romper menos enlaces del mismo tipo, sino
              de romper enlaces de **otro** tipo, mucho más débiles.

      - tipo: calcular
        titulo: La comparación en moles
        pregunta: |
          Con los 930 kJ que costaría romper los enlaces O–H de un mol,
          ¿cuántos moles de agua se podrían vaporizar?
        respuesta:
          tipo: numero
          valor: '22.7'
          tolerancia: 0.1
          formato: un número, con un decimal
        distractores:
          - valor: '889'
            mensaje: |
              Has restado en vez de dividir. La pregunta es cuántas veces cabe
              un coste dentro del otro, y eso es un cociente.
          - valor: '0.044'
            mensaje: |
              Has dividido al revés, $41/930$. Fíjate en qué es lo grande: los
              930 kJ son el presupuesto y los 41 kJ el precio unitario.
          - valor: '971'
            mensaje: |
              Eso es la suma de los dos. Los dos procesos no se encadenan
              aquí: se están comparando.
        pista: |
          Es una división. Presupuesto entre precio por mol.
        desarrollo: |
          $$
          \frac{930}{41} = 22{,}7
          $$

          Con lo que cuesta romper los enlaces internos de un mol se
          vaporizarían casi veintitrés.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Vaporizar un mol de agua cuesta 41 kJ y romper sus enlaces O–H cuesta 930 kJ.
          - texto: 'El cociente es 930/41 = 22,7: lo intramolecular cuesta casi veintitrés veces más que lo intermolecular.'
          - texto: Por eso, al cambiar de estado, se vencen las fuerzas intermoleculares y las moléculas quedan intactas.
          - texto: 'Y por eso también el vapor de agua sigue siendo agua: un cambio de estado no cambia la sustancia.'
          - texto: Como las fuerzas intermoleculares son veintitrés veces más débiles, se pueden despreciar al estudiar el líquido.
            trampa: true
            mensaje: |
              Ser más débiles no es ser despreciables: son **exactamente** las
              que explican que el agua sea líquida a temperatura ambiente
              cuando moléculas parecidas y más pesadas son gases. Despreciarlas
              es quedarse sin poder explicar ni un punto de ebullición.
    resolucion: |
      **Qué se rompe.** Al hervir, el agua pasa de líquido a gas y las
      moléculas de H₂O siguen siendo H₂O. Lo que se vence son las fuerzas
      **intermoleculares** —en el agua, sobre todo enlaces de hidrógeno—, no
      los enlaces covalentes O–H de dentro de cada molécula.

      **La cifra que lo demuestra.** Los dos costes están medidos y no se
      parecen:

      $$
      \frac{930}{41} = 22{,}7
      $$

      Con la energía necesaria para romper los enlaces O–H de un solo mol se
      vaporizarían casi veintitrés moles. Esa proporción es la razón física de
      que un cambio de estado sea barato comparado con una reacción química.

      **Lo que hay que llevarse.** Es la regla general del tema: las fuerzas
      intermoleculares son mucho más débiles que las intramoleculares. El
      temario da la misma comparación con el HCl —431 kJ/mol para disociarlo
      en átomos, 16 kJ/mol para vaporizarlo—, y ahí la razón es todavía mayor.

      Pero débil no es irrelevante. Esas fuerzas débiles son las que deciden
      el punto de fusión, el de ebullición y el estado en que encuentras una
      sustancia a temperatura ambiente, que es justo lo que el examen pregunta.

  - id: ejfq4-donde-hierve-el-agua
    titulo: Dónde hierve el agua, que no siempre es a cien grados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      El agua hierve a 100 °C al nivel del mar. En la cima del Kilimanjaro,
      a 5895 m de altitud, la presión atmosférica es de 350 mmHg y el agua
      hierve a 79 °C.

      Determinar cuántos grados baja la temperatura de ebullición y explicar
      a qué se debe.
    pide: La diferencia de temperatura de ebullición y su causa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa exactamente que un líquido «hierve»?
        opciones:
          - texto: Que su presión de vapor iguala a la presión exterior
            correcta: true
            mensaje: |
              Esa es la definición, y explica todo lo demás. Como la presión
              de vapor sube con la temperatura, basta con bajar la presión
              exterior para que el encuentro se produzca antes.
          - texto: Que ha alcanzado los 100 °C
            mensaje: |
              Cien grados es la temperatura de ebullición **del agua y a
              presión atmosférica normal**, dos condiciones que no siempre se
              cumplen. El dietil éter hierve a 34,6 °C, y el agua del
              Kilimanjaro a 79.
          - texto: Que sus moléculas han roto sus enlaces internos
            mensaje: |
              Eso sería descomponer el agua, no hervirla. Al hervir, las
              moléculas se separan unas de otras pero cada una sigue entera.
          - texto: Que se evapora, que es lo mismo pero más deprisa
            mensaje: |
              No son lo mismo. Un líquido se evapora por la superficie a
              cualquier temperatura; hervir es que se formen burbujas de vapor
              **dentro** del líquido, y eso solo pasa cuando la presión de
              vapor alcanza a la exterior.

      - tipo: calcular
        titulo: La caída de la temperatura de ebullición
        pregunta: |
          ¿Cuántos grados centígrados baja la temperatura de ebullición del
          agua en la cima respecto del nivel del mar?
        respuesta:
          tipo: numero
          valor: '21'
          tolerancia: 0.1
          formato: un número entero, en grados centígrados
        distractores:
          - valor: '79'
            mensaje: |
              Ese es el valor de la temperatura en la cima, no la caída. La
              pregunta es por la diferencia entre las dos.
          - valor: '410'
            mensaje: |
              Has restado las presiones, $760 - 350$. La pregunta es por
              grados, no por milímetros de mercurio; las dos cosas están
              relacionadas pero no son proporcionales.
        pista: |
          Los dos datos están en el enunciado, y la operación es una resta.
        desarrollo: |
          $$
          100 - 79 = 21
          $$

      - tipo: reconocer
        pregunta: |
          Una olla rápida trabaja a unas 2 atm. Siguiendo el mismo
          razonamiento, ¿qué le pasa al agua de dentro?
        opciones:
          - texto: Hierve por encima de 100 °C, y por eso la comida se hace antes
            correcta: true
            mensaje: |
              Exacto, y el temario da la cifra: unos 120 °C. La olla no
              cocina más rápido porque caliente más deprisa, sino porque
              permite que el agua **líquida** llegue a una temperatura que a
              presión normal sería imposible.
          - texto: Hierve por debajo de 100 °C, porque la presión la comprime
            mensaje: |
              Es el sentido contrario. Más presión exterior significa que la
              presión de vapor tiene que llegar más arriba para igualarla, y
              para eso hace falta más temperatura.
          - texto: Hierve igual, a 100 °C, porque eso es una propiedad del agua
            mensaje: |
              La temperatura de ebullición **normal** es una propiedad del
              líquido; la temperatura a la que hierve en un sitio concreto
              depende de la presión de ese sitio. Si no fuera así, la olla
              rápida no serviría para nada.
          - texto: No hierve, porque la presión se lo impide del todo
            mensaje: |
              Se lo impide hasta cierta temperatura, no para siempre. La
              presión de vapor sube sin techo con la temperatura, así que
              siempre acaba alcanzando a la exterior.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: Un líquido hierve cuando su presión de vapor iguala a la presión exterior.
          - texto: La presión de vapor de un líquido aumenta siempre al aumentar la temperatura.
          - texto: 'En la cima la presión exterior es de 350 mmHg en vez de 760, así que el encuentro se produce antes: a 79 °C.'
          - texto: 'La caída es de 100 − 79 = 21 °C, y en una olla rápida a 2 atm ocurre lo contrario y el agua llega a unos 120 °C.'
          - texto: En la cima el agua hierve antes porque allí hace más frío y el agua necesita menos energía.
            trampa: true
            mensaje: |
              Mezcla dos cosas y ninguna funciona. La temperatura ambiente no
              entra en la definición de ebullición: lo que decide es la
              **presión**. Y si el argumento fuera cierto, meter una olla en
              el congelador haría hervir el agua antes.
    resolucion: |
      **La definición, que es lo único que hay que saber.** Un líquido hierve
      cuando su presión de vapor iguala a la presión exterior. La temperatura
      de ebullición **normal** es el caso particular en que esa presión
      exterior son 760 mmHg.

      Como la presión de vapor crece siempre con la temperatura, la
      consecuencia es inmediata: si bajas la presión exterior, el encuentro se
      produce a menos temperatura.

      **El número.** En la cima del Kilimanjaro la presión es de 350 mmHg y el
      agua hierve a 79 °C, así que

      $$
      100 - 79 = 21 \text{ °C de caída}
      $$

      **La comprobación en el otro sentido.** Una olla rápida trabaja a unas
      2 atm, y ahí el agua hierve a unos 120 °C. Si el razonamiento del
      Kilimanjaro es el bueno, este sale solo y con el signo contrario: más
      presión exterior, más temperatura hace falta.

      Y de paso explica por qué la olla cocina antes, que no es lo que la
      gente supone. No calienta más deprisa: **permite que el agua líquida
      esté más caliente**. A presión normal el agua no puede pasar de 100 °C
      sin evaporarse, así que la comida nunca ve más de esa temperatura.

      **Por qué esto está en el tema de propiedades y no en otro sitio.**
      Porque la temperatura de ebullición de cada líquido —dietil éter a
      34,6 °C, etanol a 78,3 °C, agua a 100 °C, todas a la misma presión— la
      decide la fuerza de sus fuerzas intermoleculares. El agua hierve la
      última de las tres porque es la única con enlaces de hidrógeno.
  # ── Los ejemplos de entrada que faltaban, escritos el 5 de septiembre de
  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq4-el-que-conduce-solo-fundido
    titulo: Cuatro sustancias, y la pregunta que hay que hacer primero
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Cuatro sustancias sólidas se ensayan en el laboratorio y se anota lo que
      hacen:

      | | conduce en sólido | conduce fundida | T. de fusión |
      |---|---|---|---|
      | **A** | no | sí | 801 °C |
      | **B** | sí | sí | 1084 °C |
      | **C** | no | no | −57 °C |
      | **D** | no | no | 1610 °C |

      Identificar el tipo de sólido de cada una.
    pide: El tipo de sólido de las cuatro sustancias.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con esta tabla delante, ¿cuál es la primera pregunta que hay que
          hacerse?
        opciones:
          - texto: Si conduce **en estado sólido**, porque eso separa al metal de todos los demás
            correcta: true
            mensaje: |
              Exacto. Solo el metálico tiene electrones libres estando sólido.
              Es la pregunta que más separa de una vez, y por eso va delante.
          - texto: Si tiene la temperatura de fusión alta o baja
            correcta: false
            mensaje: |
              Sirve, pero separa peor: el iónico y el covalente reticular la
              tienen los dos alta, y los metales la tienen de todo — el mercurio
              funde a −39 °C y el wolframio a 3422 °C. Es una pista de segundo
              paso, no de primero.
          - texto: Si conduce fundida
            correcta: false
            mensaje: |
              Esa es la **segunda** pregunta, y solo tiene sentido para las que
              ya han dicho que no conducen en sólido. Hacerla primero mezcla
              metales e iónicos, que son los dos que conducen fundidos.
          - texto: Si es soluble en agua
            correcta: false
            mensaje: |
              La solubilidad tiene demasiadas excepciones para decidir: hay
              iónicos insolubles, como el carbonato de calcio, y moleculares
              muy solubles, como el azúcar.

      - tipo: calcular
        titulo: Cuántas conducen fundidas
        pregunta: |
          De las cuatro sustancias, ¿cuántas conducen la corriente estando
          fundidas?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Solo has contado la A. El metal también conduce fundido: al
              fundirse no pierde sus electrones libres, solo la red ordenada.
              Son dos, la A y la B.
          - valor: '3'
            mensaje: |
              Tres serían si el covalente reticular condujese, y no lo hace ni
              fundido: sus electrones están en enlaces localizados y no hay
              iones que se puedan mover.
        pista: |
          Léelo en la tabla, columna «conduce fundida».
        desarrollo: |
          La A y la B. Y esa columna es la que separa al **iónico** —que solo
          conduce cuando sus iones quedan libres, es decir fundido o disuelto—
          del **covalente reticular** y del **molecular**, que no conducen
          nunca.

      - tipo: calcular
        titulo: La que no encaja en el molde
        pregunta: |
          Una de las cuatro funde por debajo de cero. ¿Cuántos grados por
          debajo del punto de fusión de la sustancia iónica está?
        respuesta:
          tipo: numero
          valor: '858'
          tolerancia: 1
          formato: un número, en grados
        distractores:
          - valor: '744'
            mensaje: |
              Has restado a 801 los 57 en vez de sumárselos. El −57 está por
              **debajo** de cero, así que la distancia hasta 801 es la suma de
              los dos.
          - valor: '1667'
            mensaje: |
              Esa es la distancia hasta el covalente reticular, la D, que funde
              a 1610 °C. La sustancia iónica es la A.
        pista: |
          De −57 a 0 hay 57 grados, y de 0 a 801 hay 801.
        desarrollo: |
          $$
          801 - (-57) = 858\ \text{°C}
          $$

          Casi novecientos grados entre un sólido molecular y uno iónico, y no
          es casualidad: en el molecular se rompen fuerzas intermoleculares, y
          en el iónico hay que deshacer una red de enlaces. Ese salto de orden
          de magnitud es lo que hace de la temperatura de fusión una pista
          fiable **entre esas dos familias**.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La B conduce en estado sólido, y eso solo lo hace el metálico: es cobre, que funde a 1084 °C.'
          - texto: 'La A no conduce en sólido pero sí fundida, que es la firma del iónico: sus iones solo se mueven cuando la red se deshace. Es cloruro de sodio.'
          - texto: 'La C no conduce nunca y funde a −57 °C, así que lo que se rompe al fundirla son fuerzas intermoleculares: es un sólido molecular.'
          - texto: 'La D no conduce nunca y funde a 1610 °C, así que lo que se rompe son enlaces covalentes de una red entera: es covalente reticular, como el cuarzo.'
          - texto: 'Decir que una sustancia «conduce» basta para identificarla, porque cada tipo de sólido conduce de una manera distinta.'
            trampa: true
            mensaje: |
              No basta, y es el fallo que decide el ejercicio del examen. «La A
              conduce» y «la B conduce» son las dos ciertas y describen
              sustancias de familias distintas. Lo que identifica no es que
              conduzca, es **cuándo**: en sólido, solo el metal; solo fundido,
              el iónico.
    resolucion: |
      ## Preguntar en el orden bueno

      Las cuatro familias se separan con dos preguntas, y el orden importa
      porque la primera parte el conjunto en dos mitades desiguales:

      1. **¿Conduce en estado sólido?** Si sí, es **metálico** y se acabó: es
         el único con electrones deslocalizados sin fundir nada.
      2. **Si no, ¿conduce fundido?** Si sí, es **iónico**: los iones existían
         ya, pero estaban presos en la red.
      3. **Si tampoco, decide la temperatura de fusión.** Baja —decenas o pocos
         cientos de grados— es **molecular**; muy alta es **covalente
         reticular**.

      Aplicado a las cuatro:

      | | conduce sólido | conduce fundida | T<sub>f</sub> | tipo |
      |---|---|---|---|---|
      | A | no | sí | 801 °C | iónico (NaCl) |
      | B | sí | sí | 1084 °C | metálico (Cu) |
      | C | no | no | −57 °C | molecular |
      | D | no | no | 1610 °C | covalente reticular (SiO₂) |

      **La distinción que se cobra puntos** es la de las dos primeras columnas.
      Un enunciado que diga solo «conduce la electricidad» no permite decidir
      entre A y B, y por eso los exámenes de esta asignatura nunca lo dicen
      así: dicen «conduce fundido pero no en estado sólido», que es una frase
      entera con la respuesta dentro.

      **Y el matiz de la temperatura de fusión**, que también cae: sirve para
      separar el molecular de los otros tres, pero **no** para ordenar un
      metálico frente a un iónico. Aquí el cobre funde por encima del cloruro
      de sodio, y con otro par de sustancias saldría al revés.

  - id: colfq4-gas16-el-cloro-que-se-comprime
    titulo: El cloro que se comprime a temperatura constante
    fuente: >-
      Pregunta de la lámina 16 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cuatro opciones sin marcar la buena;
      la que sale es la B, 4460 mmHg. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Una muestra de cloro gaseoso ocupa un volumen de 946 mL a una presión de
      726 mmHg. ¿Cuál es la presión del gas (en mmHg) si su volumen se reduce
      a temperatura constante hasta 154 mL?

      A.- 2.42 mmHg

      B.- 4460 mmHg

      C.- ninguno de los anteriores

      D.- no lo he hecho
    pide: La presión del cloro al reducir su volumen a 154 mL.

    pasos:
      - tipo: reconocer
        pregunta: |
          La temperatura y la cantidad de gas no cambian. ¿Qué se conserva
          entre el estado inicial y el final?
        opciones:
          - texto: >-
              El producto $P\,V$: es la ley de Boyle
            correcta: true
            mensaje: |
              Eso es. Con $n$ y $T$ fijos, $PV = nRT$ es una constante, así que
              $P_1V_1 = P_2V_2$. Si el volumen baja, la presión sube en la misma
              proporción.
          - texto: >-
              La presión, porque la temperatura es constante
            mensaje: |
              Temperatura constante no es presión constante. Al apretar el gas
              en menos sitio las moléculas chocan más a menudo con las paredes,
              y la presión sube.
          - texto: >-
              El cociente $P/V$
            mensaje: |
              Eso diría que al bajar el volumen baja la presión, y es al revés:
              presión y volumen son inversamente proporcionales. Lo que se
              conserva es el producto.
          - texto: >-
              Nada: sin conocer los moles no se puede calcular
            mensaje: |
              No hacen falta. Como $n$, $R$ y $T$ son los mismos en los dos
              estados, se cancelan al dividir: $P_1V_1 = P_2V_2$ ya no los
              lleva.

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          ¿Cuánto vale la presión del gas a 154 mL?
        respuesta:
          tipo: magnitud
          valor: '4460 mmHg'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '118.2 mmHg'
            mensaje: |
              Has puesto los volúmenes al revés, $P_1V_2/V_1$. Comprueba el
              sentido: el gas se comprime a la sexta parte, así que la presión
              tiene que subir, no bajar.
          - valor: '726 mmHg'
            mensaje: |
              Has dejado la presión como estaba. A temperatura constante lo que
              no cambia es el producto $PV$; si el volumen baja, la presión
              sube.
        pista: |
          $P_2 = P_1\,\dfrac{V_1}{V_2}$, y los volúmenes pueden ir en mL: se
          cancelan.
        desarrollo: |
          $$
          P_2 = P_1\,\frac{V_1}{V_2} = 726\cdot\frac{946}{154} = 4460\ \text{mmHg}
          $$

          Es la opción B. Los volúmenes no hace falta pasarlos a litros,
          porque solo entra su cociente.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La cantidad de gas y la temperatura son fijas: se cumple la ley
              de Boyle, $P_1V_1 = P_2V_2$.
          - texto: >-
              El volumen se reduce de 946 a 154 mL, unas seis veces menos.
          - texto: >-
              La presión sube en la misma proporción:
              $726 \cdot 946/154 = 4460$ mmHg.
          - texto: >-
              La opción A no puede ser: 2,42 mmHg es menos que la presión de
              partida, y el gas se ha comprimido.
          - texto: >-
              Antes de operar hay que pasar los mililitros a litros, o el
              resultado sale mil veces mayor.
            trampa: true
            mensaje: |
              En la ley de Boyle los volúmenes entran como cociente,
              $V_1/V_2$, y las unidades se cancelan: da lo mismo en mililitros
              que en litros, siempre que los dos estén en la misma.
        veredicto: |
          Un gas comprimido tiene más presión. Esa comprobación de sentido
          descarta la A sin hacer ninguna cuenta.

    resolucion: |
      **Qué ley es.** La cantidad de cloro y la temperatura no cambian, así que
      de $PV = nRT$ solo quedan dos variables y su producto es constante: la
      ley de Boyle.

      $$
      P_1V_1 = P_2V_2
      \quad\Longrightarrow\quad
      P_2 = 726\cdot\frac{946}{154} = \boxed{4460\ \text{mmHg}}
      $$

      Es la opción **B**. No hace falta pasar nada a litros ni a atmósferas:
      los volúmenes entran como cociente y la presión sale en la unidad de la
      de partida.

      **La comprobación que ahorra la cuenta.** El volumen baja a la sexta
      parte, así que la presión tiene que subir unas seis veces: de unos 700 a
      unos 4400 mmHg. Eso descarta la A, que es menor que la de partida, y la
      respuesta con los volúmenes al revés, 118 mmHg, que tiene el mismo
      problema.

  - id: colfq4-gas18-el-monoxido-que-encoge-al-enfriarse
    titulo: El monóxido de carbono que encoge al enfriarse, y los grados que no son kelvin
    fuente: >-
      Pregunta de la lámina 18 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cuatro opciones sin marcar la buena;
      la que sale es la B, 192 K. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Una muestra de monóxido de carbono gaseoso ocupa 3,20 L a 125 °C. ¿A qué
      temperatura ocupará el gas un volumen de 1,54 L si la presión se
      mantiene constante?

      A.- 60°C

      B.- 192 K

      C.- ninguno de los anteriores

      D.- NO LO HE HECHO
    pide: La temperatura a la que el gas ocupa 1,54 L.

    pasos:
      - tipo: reconocer
        pregunta: |
          A presión constante, $V_1/T_1 = V_2/T_2$ (ley de Charles). ¿En qué
          escala tiene que ir la temperatura?
        opciones:
          - texto: >-
              En kelvin: el volumen es proporcional a la temperatura absoluta
            correcta: true
            mensaje: |
              Eso es. La proporcionalidad es con $T$ medida desde el cero
              absoluto. En Celsius el cero es arbitrario, y un gas a 0 °C no
              ocupa volumen cero.
          - texto: >-
              En Celsius, porque es la del enunciado
            mensaje: |
              La lámina 17 lo deja escrito: la recta de Charles corta el eje en
              −273,15 °C, no en 0 °C. Con Celsius, pasar de 10 a 20 °C doblaría
              el volumen, y no lo dobla.
          - texto: >-
              Da igual, porque se cancela en el cociente
            mensaje: |
              Se cancela el factor de una unidad, no un cero desplazado.
              Pasar a kelvin suma 273,15, y un cociente de sumas no es el mismo
              que el de los números sin sumar: sale 60 °C en vez de 192 K.
          - texto: >-
              En kelvin solo si el volumen está en metros cúbicos
            mensaje: |
              Las unidades del volumen se cancelan en el cociente, sean cuales
              sean. La temperatura va en kelvin siempre, porque es la
              proporcionalidad la que lo exige.

      - tipo: calcular
        titulo: La temperatura final
        pregunta: |
          ¿A qué temperatura ocupa el gas 1,54 L?
        respuesta:
          tipo: magnitud
          valor: '191.6 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad (K o °C)
        distractores:
          - valor: '60.2 °C'
            mensaje: |
              Has operado con los 125 °C sin pasarlos a kelvin: es la opción A
              de la lámina. Con $T_1 = 398$ K sale 192 K, que son −81,5 °C: el
              gas tiene que enfriarse mucho para encoger a menos de la mitad.
          - valor: '827.3 K'
            mensaje: |
              Has puesto los volúmenes al revés, $T_1V_1/V_2$. El volumen baja,
              así que la temperatura tiene que bajar también: a presión
              constante van en el mismo sentido.
        pista: |
          $T_2 = T_1\,\dfrac{V_2}{V_1}$, con $T_1 = 125 + 273{,}15$ K.
        desarrollo: |
          $$
          T_2 = T_1\,\frac{V_2}{V_1} = 398{,}15\cdot\frac{1{,}54}{3{,}20} = 191{,}6\ \text{K}
          $$

          Son −81,5 °C. Es la opción B, 192 K. Con 273 en lugar de 273,15 sale
          191,5 K, lo mismo a efectos prácticos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión y la cantidad de gas son fijas: se cumple la ley de
              Charles, $V_1/T_1 = V_2/T_2$.
          - texto: >-
              La temperatura inicial en kelvin es $125 + 273{,}15 = 398{,}15$ K.
          - texto: >-
              $T_2 = 398{,}15 \cdot 1{,}54/3{,}20 = 191{,}6$ K, que son −81,5 °C.
          - texto: >-
              El volumen baja a menos de la mitad, y la temperatura absoluta
              también: van en el mismo sentido.
          - texto: >-
              La opción A también vale, porque 60 °C es la misma temperatura
              escrita en Celsius.
            trampa: true
            mensaje: |
              192 K en Celsius son −81,5 °C, no 60 °C. Los 60 °C salen de
              operar con los grados Celsius como si fueran absolutos, que es el
              error que la opción A está puesta para cazar.
        veredicto: |
          En las leyes de los gases la temperatura va siempre en kelvin, y el
          resultado se puede devolver a Celsius al final.

    resolucion: |
      **Qué ley es.** Presión y cantidad de gas fijas: el volumen es
      proporcional a la temperatura **absoluta**, la ley de Charles.

      $$
      \frac{V_1}{T_1} = \frac{V_2}{T_2}
      \quad\Longrightarrow\quad
      T_2 = (125 + 273{,}15)\cdot\frac{1{,}54}{3{,}20} = \boxed{191{,}6\ \text{K}} = -81{,}5\ ^\circ\text{C}
      $$

      Es la opción **B**, 192 K.

      **La opción A está puesta a propósito.** Si se opera con los 125 °C tal
      cual, sale $125 \cdot 1{,}54/3{,}20 = 60$ °C, que es la A. El volumen
      no es proporcional a la temperatura en Celsius: la recta de Charles de la
      lámina 17 pasa por volumen cero en −273,15 °C, y por eso la cuenta solo
      funciona desde ahí.

      **La comprobación de sentido.** Para que un gas ocupe menos de la mitad
      a la misma presión, su temperatura absoluta tiene que bajar a menos de
      la mitad: de 398 K a 192 K. Los 60 °C, que son 333 K, apenas lo
      enfriarían.

  - id: colfq4-gas20-los-volumenes-del-amoniaco-que-arde
    titulo: Los volúmenes del amoniaco que arde, y un coeficiente que engaña
    fuente: >-
      Pregunta de la lámina 20 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cuatro opciones sin marcar la buena;
      la que sale es la A, 1 volumen, y las láminas 21 a 24 ajustan la
      reacción. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      El amoniaco arde en presencia de oxígeno formando óxido nítrico (NO) y
      vapor de agua. ¿Cuántos volúmenes de NO se obtienen a partir de un
      volumen de amoniaco a la misma temperatura y presión?

      A.- 1

      B.- 4

      C. NINGUNO

      D.- NO LO HE HECHO
    pide: Los volúmenes de NO que da un volumen de amoniaco.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede contestar en volúmenes, sin pasar a moles?
        opciones:
          - texto: >-
              Porque a la misma presión y temperatura, volúmenes iguales de
              gases tienen el mismo número de moles
            correcta: true
            mensaje: |
              Eso es: la ley de Avogadro. Con $P$ y $T$ iguales, $V = nRT/P$ es
              proporcional a $n$, y la proporción de moles de la reacción
              ajustada es también la de volúmenes.
          - texto: >-
              Porque todos los gases tienen la misma masa molar
            mensaje: |
              Tienen masas molares muy distintas: 17 g/mol el NH₃ y 30 el NO. Lo
              que comparten a igual $P$ y $T$ es el volumen que ocupa un mol,
              no lo que pesa.
          - texto: >-
              Porque en una reacción el volumen total se conserva
            mensaje: |
              Se conserva la masa, no el volumen. Aquí mismo entran 9
              volúmenes de gas por cada 10 que salen, contando el vapor de
              agua.
          - texto: >-
              No se puede: hay que pasar a moles con $PV = nRT$
            mensaje: |
              Se podría, pero no hace falta: como $R$, $T$ y $P$ son los mismos
              para todos, se cancelan, y los volúmenes guardan la proporción de
              los moles.

      - tipo: calcular
        titulo: La reacción ajustada
        pregunta: |
          Ajusta $\mathrm{NH_3} + \mathrm{O_2} \rightarrow \mathrm{NO} + \mathrm{H_2O}$
          con coeficientes enteros, los menores posibles. ¿Cuáles son, en ese
          orden?
        respuesta:
          tipo: vector
          valor: '(4, 5, 4, 6)'
          tolerancia: 0.001
          formato: los cuatro coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 1, 1, 1)'
            mensaje: |
              Sin ajustar, el hidrógeno no cuadra: tres a la izquierda y dos a
              la derecha. Empieza por el H y el N, que solo están en un
              reactivo y un producto, y deja el oxígeno para el final.
          - valor: '(2, 3, 2, 3)'
            mensaje: |
              Nitrógeno e hidrógeno cuadran, pero el oxígeno no: 6 a la
              izquierda y 5 a la derecha. Hacen falta 5/2 de O₂, y para quitar
              la fracción se multiplica todo por 2.
        pista: |
          Ajusta H y N primero: 2 NH₃ → 2 NO + 3 H₂O. Cuenta los oxígenos de la
          derecha.
        desarrollo: |
          Con H y N: $2\,\mathrm{NH_3} + \dots \rightarrow 2\,\mathrm{NO} + 3\,\mathrm{H_2O}$.
          A la derecha hay $2 + 3 = 5$ oxígenos, que son $\tfrac{5}{2}$ de O₂,
          como en la lámina 23. Multiplicando por 2:

          $$
          4\,\mathrm{NH_3} + 5\,\mathrm{O_2} \rightarrow 4\,\mathrm{NO} + 6\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: Los volúmenes de NO
        pregunta: |
          ¿Cuántos volúmenes de NO se obtienen por cada volumen de amoniaco?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Es el coeficiente del NO, y es la opción B de la lámina. Pero por
              cada 4 de NO entran 4 de NH₃: la proporción es 4 a 4, uno a uno.
          - valor: '1.5'
            mensaje: |
              Esos son los volúmenes de vapor de agua, 6 por cada 4 de
              amoniaco. La pregunta es por el NO.
          - valor: '1.25'
            mensaje: |
              Esos son los volúmenes de oxígeno que gasta cada volumen de
              amoniaco, 5 por cada 4. El NO sale 4 por cada 4.
        pista: |
          Divide el coeficiente del NO entre el del NH₃.
        desarrollo: |
          $$
          \frac{V_{\mathrm{NO}}}{V_{\mathrm{NH_3}}} = \frac{4}{4} = 1
          $$

          Un volumen de NO por cada volumen de amoniaco: la opción A.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A la misma presión y temperatura, el volumen de un gas es
              proporcional a sus moles: la ley de Avogadro.
          - texto: >-
              La reacción ajustada es
              $4\,\mathrm{NH_3} + 5\,\mathrm{O_2} \rightarrow 4\,\mathrm{NO} + 6\,\mathrm{H_2O}$.
          - texto: >-
              Por cada 4 volúmenes de NH₃ salen 4 de NO: un volumen por volumen.
          - texto: >-
              Con la reacción escrita como en la lámina 24, con 5/2 de O₂, la
              proporción NO/NH₃ es 2/2: la misma.
          - texto: >-
              Se obtienen 4 volúmenes de NO, que es el coeficiente del NO en la
              reacción ajustada.
            trampa: true
            mensaje: |
              El coeficiente solo no dice nada: hay que compararlo con el del
              amoniaco, que también es 4. Si la reacción se escribe con 2 y
              5/2, el NO lleva un 2, y el volumen de NO no ha cambiado.
        veredicto: |
          Lo que da la proporción es el cociente de coeficientes, no el
          coeficiente del producto.

    resolucion: |
      **Por qué se puede contestar en volúmenes.** A la misma presión y temperatura,
      $V = nRT/P$ es proporcional a $n$: la ley de Avogadro. La proporción de
      moles de la reacción ajustada es también la de volúmenes.

      **La reacción.** Ajustando primero H y N, y el oxígeno al final, como en
      las láminas 21 a 24:

      $$
      2\,\mathrm{NH_3} + \tfrac{5}{2}\,\mathrm{O_2} \rightarrow 2\,\mathrm{NO} + 3\,\mathrm{H_2O}
      \quad\text{o, con enteros,}\quad
      4\,\mathrm{NH_3} + 5\,\mathrm{O_2} \rightarrow 4\,\mathrm{NO} + 6\,\mathrm{H_2O}
      $$

      **La respuesta.** Por cada 4 volúmenes de NH₃ salen 4 de NO:

      $$
      \frac{V_{\mathrm{NO}}}{V_{\mathrm{NH_3}}} = \frac{4}{4} = \boxed{1}
      $$

      Es la opción **A**.

      **La B está puesta para cazar un error concreto**: leer el coeficiente
      del NO, 4, sin compararlo con el del amoniaco. La prueba de que ese
      número no significa nada solo es que con la reacción de la lámina 24 el
      coeficiente del NO es 2 y la respuesta no cambia.

  - id: colfq4-gas27-la-masa-molar-de-un-gas-desconocido
    titulo: La masa molar de un gas que solo se conoce por lo que pesa
    fuente: >-
      Pregunta de la lámina 27 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cuatro opciones sin marcar la buena;
      la que sale es la B, 54,6 g/mol. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Un depósito de 2,10 L contiene 4,65 g de un gas a 1,00 atm y 27,0 °C.
      ¿Cuál es la masa molar del gas?

      A.- 4.9 g/mol

      B.- 54,6 g/mol

      C.- ninguno de los anteriores

      D.- NO LO HE HECHO
    pide: La masa molar del gas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se conocen la masa, el volumen, la presión y la temperatura. ¿Cómo
          se llega a la masa molar?
        opciones:
          - texto: >-
              Con $PV = nRT$ se sacan los moles, y la masa molar es la masa
              entre los moles
            correcta: true
            mensaje: |
              Eso es. O en un solo paso, con $n = m/M$:
              $M = mRT/(PV)$, que es la densidad del gas por $RT/P$, como en la
              lámina 26.
          - texto: >-
              Dividiendo la masa entre el volumen
            mensaje: |
              Eso es la densidad, 2,21 g/L, no la masa molar. Para pasar de una
              a otra hace falta la ecuación de los gases: $M = \rho RT/P$.
          - texto: >-
              Con el volumen molar de 22,4 L/mol
            mensaje: |
              Los 22,4 L/mol valen a 0 °C y 1 atm. Este gas está a 27 °C, y un
              mol ocupa más: hay que usar $PV = nRT$ con su temperatura.
          - texto: >-
              No se puede sin saber qué gas es
            mensaje: |
              Se puede, y es justo lo que hace útil la ecuación de los gases:
              el volumen de un gas ideal no depende de qué gas sea, solo de
              cuántos moles hay.

      - tipo: calcular
        titulo: Los moles del depósito
        pregunta: |
          ¿Cuántos moles de gas hay en el depósito?
        respuesta:
          tipo: numero
          valor: '0.08537'
          tolerancia: 0.0005
          formato: los moles, con cuatro decimales
        distractores:
          - valor: '0.9485'
            mensaje: |
              Has puesto la temperatura en Celsius, 27. En $PV = nRT$ va en
              kelvin: $27 + 273 = 300$ K.
          - valor: '11.71'
            mensaje: |
              Has despejado al revés, $RT/(PV)$. Es $n = PV/(RT)$: la presión y
              el volumen arriba.
        pista: |
          $n = \dfrac{PV}{RT}$, con $T = 300$ K y $R = 0{,}082$ atm·L/(mol·K).
        desarrollo: |
          $$
          n = \frac{PV}{RT} = \frac{1{,}00\cdot 2{,}10}{0{,}082\cdot 300} = 0{,}0854\ \text{mol}
          $$

      - tipo: calcular
        titulo: La masa molar
        pregunta: |
          ¿Cuánto vale la masa molar del gas?
        respuesta:
          tipo: numero
          valor: '54.5'
          tolerancia: 0.3
          formato: la masa molar en g/mol, con un decimal
        distractores:
          - valor: '4.9'
            mensaje: |
              Es la opción A de la lámina, y sale de poner 27 °C en vez de 300
              K. Un gas de 4,9 g/mol pesaría poco más que el helio, y 4,65 g
              serían casi un mol: a 1 atm ocuparían más de 20 litros, no 2,10.
          - valor: '0.01835'
            mensaje: |
              Has dividido los moles entre la masa. La masa molar son gramos
              por mol: $4{,}65/0{,}0854$.
        pista: |
          $M = m/n$.
        desarrollo: |
          $$
          M = \frac{m}{n} = \frac{4{,}65}{0{,}08537} = 54{,}5\ \text{g/mol}
          $$

          La opción B da 54,6, que es lo que sale con $R = 0{,}0821$ y
          $T = 300{,}15$ K, los valores que usa la resolución de la lámina 10
          del tema 4.2. La diferencia es de redondeo y cabe en la tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La temperatura va en kelvin: $27{,}0 + 273 = 300$ K.
          - texto: >-
              Los moles salen de $PV = nRT$: $n = 2{,}10/(0{,}082 \cdot 300) = 0{,}0854$ mol.
          - texto: >-
              La masa molar es la masa entre los moles: $4{,}65/0{,}0854 = 54{,}5$ g/mol.
          - texto: >-
              Coincide con la opción B, 54,6 g/mol, salvo el redondeo de $R$ y
              de $T$.
          - texto: >-
              Como el gas está a 1 atm, un mol ocupa 22,4 L y los moles son
              $2{,}10/22{,}4$.
            trampa: true
            mensaje: |
              Los 22,4 L/mol son a 1 atm **y 0 °C**. A 27 °C un mol ocupa 24,6
              L, y con 22,4 saldría una masa molar un 9 % menor, 49,6 g/mol,
              que no es ninguna de las opciones.
        veredicto: |
          La masa molar de un gas desconocido sale de pesarlo y de $PV = nRT$:
          no hace falta saber qué es.

    resolucion: |
      **La idea.** Un gas ideal ocupa lo mismo sea cual sea, así que con $P$,
      $V$ y $T$ se saben los moles; con la masa, la masa molar.

      $$
      n = \frac{PV}{RT} = \frac{1{,}00\cdot 2{,}10}{0{,}082\cdot 300} = 0{,}0854\ \text{mol}
      \qquad
      M = \frac{4{,}65}{0{,}08537} = \boxed{54{,}5\ \text{g/mol}}
      $$

      Es la opción **B**, 54,6 g/mol: es lo que sale con $R = 0{,}0821$ y
      $T = 300{,}15$ K, los valores que usa la resolución de la lámina 10 del
      tema 4.2. La lámina 27 no calcula nada; solo da las opciones.

      **En un solo paso**, con $n = m/M$:

      $$
      M = \frac{m\,R\,T}{P\,V}
      $$

      que es la misma fórmula que da la masa molar desde la densidad, en la
      lámina 26.

      **La A está puesta para el error de siempre**: con 27 en vez de 300 K
      sale 4,9 g/mol. Un gas tan ligero pesaría poco más que el helio, y
      4,65 g de él serían casi un mol, que a 1 atm y 27 °C ocupa 24,6 L: no
      caben en un depósito de 2,10.

  - id: colfq4-gas30-el-co2-que-sale-de-la-glucosa
    titulo: El CO₂ que sale de quemar glucosa, en litros
    fuente: >-
      Pregunta de la lámina 30 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cinco opciones sin marcar la buena, y
      no escribe la reacción que anuncia. La lámina 10 del tema 4.2 resuelve
      el mismo problema, con la reacción, y da 4,76 L, la opción C. El
      diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      ¿Cuál es el volumen de CO₂ producido a 37 °C y 1,00 atm cuando se usan
      5,60 g de glucosa en la siguiente reacción?

      A.- 0,79 L

      B.- 0,56 L

      C.- 4,76 L

      D.- ninguno de los anteriores

      E.- NO LO HE HECHO

      *La lámina anuncia «la siguiente reacción» y no la escribe. Es la de la
      lámina 10 del tema 4.2, donde se resuelve el mismo problema:
      C₆H₁₂O₆ (s) + 6 O₂ (g) → 6 CO₂ (g) + 6 H₂O (l).*
    pide: El volumen de CO₂ que dan 5,60 g de glucosa a 37 °C y 1,00 atm.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué orden se encadenan las cuentas?
        opciones:
          - texto: >-
              Gramos de glucosa → moles de glucosa → moles de CO₂ → litros de
              CO₂ con $PV = nRT$
            correcta: true
            mensaje: |
              Eso es: el esquema de la lámina 10 del tema 4.2. La reacción
              solo habla en moles, así que se entra en moles, se cruza con los
              coeficientes y se sale en litros con la ecuación de los gases.
          - texto: >-
              Gramos de glucosa → litros de glucosa con $PV = nRT$ → litros de
              CO₂
            mensaje: |
              La glucosa es un sólido: $PV = nRT$ no le sirve. La ecuación de
              los gases se aplica al final, al CO₂, que es el gas.
          - texto: >-
              Gramos de glucosa → gramos de CO₂ con los coeficientes → litros
            mensaje: |
              Los coeficientes relacionan moles, no gramos. 1 mol de glucosa da
              6 de CO₂, pero 1 g de glucosa no da 6 g de CO₂.
          - texto: >-
              Con 22,4 L por mol de CO₂, porque está a 1 atm
            mensaje: |
              Los 22,4 L/mol son a 0 °C, y el CO₂ está a 37 °C: un mol ocupa
              25,4 L. Hay que usar $PV = nRT$ con su temperatura.

      - tipo: calcular
        titulo: Los moles de CO₂
        pregunta: |
          Con $M = 180$ g/mol para la glucosa, ¿cuántos moles de CO₂ se forman?
        respuesta:
          tipo: numero
          valor: '0.1867'
          tolerancia: 0.001
          formato: los moles, con tres decimales
        distractores:
          - valor: '0.0311'
            mensaje: |
              Esos son los moles de glucosa, sin pasar por la reacción. Cada mol
              de glucosa da **seis** de CO₂.
          - valor: '0.00519'
            mensaje: |
              Has dividido entre 6 en vez de multiplicar. La glucosa es la que
              lleva el coeficiente 1: por cada mol suyo salen seis de CO₂, así
              que hay más CO₂ que glucosa.
        pista: |
          $n_{\mathrm{glucosa}} = 5{,}60/180$, y la reacción da 6 de CO₂ por
          cada 1 de glucosa.
        desarrollo: |
          $$
          n_{\mathrm{CO_2}} = \frac{5{,}60}{180}\cdot 6 = 0{,}187\ \text{mol}
          $$

          Es el 0,187 de la resolución de la lámina 10 del tema 4.2.

      - tipo: calcular
        titulo: El volumen de CO₂
        pregunta: |
          ¿Qué volumen ocupan a 37 °C y 1,00 atm?
        respuesta:
          tipo: magnitud
          valor: '4.76 L'
          tolerancia: 0.006
          formato: un volumen, con su unidad
        distractores:
          - valor: '0.791 L'
            mensaje: |
              Es la opción A: el volumen de los moles de glucosa, sin
              multiplicar por 6. Cada mol de glucosa quemado da seis de CO₂.
          - valor: '0.566 L'
            mensaje: |
              Es la opción B: has puesto la temperatura en Celsius, 37. En
              $PV = nRT$ va en kelvin, 310 K, y el volumen sale más de ocho
              veces mayor.
        pista: |
          $V = nRT/P$, con $T = 37 + 273$ K.
        desarrollo: |
          $$
          V = \frac{nRT}{P} = \frac{0{,}1867\cdot 0{,}082\cdot 310}{1{,}00} = 4{,}75\ \text{L}
          $$

          La lámina 10 del tema 4.2 da 4,76 L, con $R = 0{,}0821$ y
          $T = 310{,}15$ K: es la opción C, y la diferencia es de redondeo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción es
              $\mathrm{C_6H_{12}O_6} + 6\,\mathrm{O_2} \rightarrow 6\,\mathrm{CO_2} + 6\,\mathrm{H_2O}$.
          - texto: >-
              5,60 g de glucosa son $5{,}60/180 = 0{,}0311$ mol.
          - texto: >-
              Cada mol de glucosa da 6 de CO₂: $0{,}187$ mol.
          - texto: >-
              A 310 K y 1,00 atm ocupan $0{,}187\cdot 0{,}082\cdot 310 = 4{,}75$ L: la opción C.
          - texto: >-
              El agua también es un producto, así que el volumen de gas que sale
              es el doble, 9,5 L.
            trampa: true
            mensaje: |
              El agua sale líquida, $\mathrm{H_2O}\,(l)$, y además la pregunta
              es solo por el CO₂. Sumar el agua sería contar un gas que no hay.
        veredicto: |
          La reacción habla en moles. Se entra en moles, se cruza con los
          coeficientes, y solo al final se pasa a litros.

    resolucion: |
      **La reacción, que la lámina no escribe.** Es la de la lámina 10 del
      tema 4.2:

      $$
      \mathrm{C_6H_{12}O_6\,(s)} + 6\,\mathrm{O_2\,(g)} \rightarrow 6\,\mathrm{CO_2\,(g)} + 6\,\mathrm{H_2O\,(l)}
      $$

      **La cadena.** Gramos de glucosa, moles de glucosa, moles de CO₂ y
      litros de CO₂:

      $$
      n_{\mathrm{CO_2}} = \frac{5{,}60}{180}\cdot 6 = 0{,}187\ \text{mol}
      \qquad
      V = \frac{0{,}1867\cdot 0{,}082\cdot 310}{1{,}00} = \boxed{4{,}75\ \text{L}}
      $$

      La resolución del material da 4,76 L, con $R = 0{,}0821$ y
      $T = 310{,}15$ K: es la opción **C**.

      **Las otras dos opciones son dos errores concretos**, y conviene
      reconocerlos:

      - **A, 0,79 L**: olvidar el 6. Es el volumen que ocuparían los moles de
        glucosa si fuera un gas.
      - **B, 0,56 L**: temperatura en Celsius. Con 37 en vez de 310 el
        volumen sale más de ocho veces más pequeño.

  - id: colfq4-gas31-el-propano-del-gas-natural
    titulo: El propano del gas natural, y su parte de la presión
    fuente: >-
      Pregunta de la lámina 31 · Diapositivas del tema 4.1.2, Estado gaseoso ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La lámina da cuatro opciones sin marcar la buena;
      la que sale es la B, 0,0181 atm. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Una muestra de gas natural contiene 8,24 moles de CH₄, 0,421 moles de
      C₂H₆, y 0,116 moles de C₃H₈. Si la presión total del gas es de 1,37
      atm, ¿cuál es la presión parcial de propano (C₃H₈)?

      A.- 0,15 atm

      B.- 0,0181 atm

      C.- ninguna de las anteriores.

      D.- no lo he hecho
    pide: La presión parcial del propano en la mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          No se conocen ni el volumen ni la temperatura. ¿Cómo se saca la
          presión parcial del propano?
        opciones:
          - texto: >-
              Con la fracción molar: $P_A = X_A\,P_T$
            correcta: true
            mensaje: |
              Eso es: la ley de Dalton de la lámina 29. Cada gas aporta a la
              presión total la misma fracción que aporta a los moles, así que
              los moles y la presión total son todo lo que hace falta.
          - texto: >-
              Con $P_A = n_A RT/V$, y no se puede porque faltan $V$ y $T$
            mensaje: |
              Esa fórmula es correcta, pero no es la única. Dividiéndola por la
              de la presión total, $V$ y $T$ se cancelan y queda
              $P_A/P_T = n_A/n_T$.
          - texto: >-
              Repartiendo la presión total a partes iguales entre los tres
              gases
            mensaje: |
              Cada gas aporta según sus moles, no por igual. Aquí casi todo es
              metano: el propano es poco más del 1 % de la mezcla.
          - texto: >-
              Multiplicando los moles de propano por la presión total
            mensaje: |
              Eso da 0,159, la opción A, y tiene unidades de mol·atm: no es una
              presión. Hay que multiplicar por la **fracción** de moles, no por
              los moles.

      - tipo: calcular
        titulo: La fracción molar del propano
        pregunta: |
          ¿Cuánto vale la fracción molar del propano, $X_{\mathrm{C_3H_8}}$?
        respuesta:
          tipo: numero
          valor: '0.01322'
          tolerancia: 0.0002
          formato: un número entre 0 y 1, con cuatro decimales
        distractores:
          - valor: '0.01408'
            mensaje: |
              Has dividido solo entre los moles de metano, 8,24. La fracción
              molar se toma sobre el total, los tres gases:
              $8{,}24 + 0{,}421 + 0{,}116 = 8{,}777$ mol.
          - valor: '0.116'
            mensaje: |
              Esos son los moles de propano, no su fracción. Hay que dividirlos
              entre los moles totales.
        pista: |
          $X_{\mathrm{C_3H_8}} = n_{\mathrm{C_3H_8}}/n_T$, con los tres gases en
          $n_T$.
        desarrollo: |
          $$
          n_T = 8{,}24 + 0{,}421 + 0{,}116 = 8{,}777\ \text{mol}
          \qquad
          X_{\mathrm{C_3H_8}} = \frac{0{,}116}{8{,}777} = 0{,}0132
          $$

      - tipo: calcular
        titulo: La presión parcial del propano
        pregunta: |
          ¿Cuánto vale la presión parcial del propano?
        respuesta:
          tipo: magnitud
          valor: '0.0181 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.159 atm'
            mensaje: |
              Es la opción A: moles de propano por presión total,
              $0{,}116 \cdot 1{,}37$. Lo que multiplica a la presión total es la
              fracción molar, 0,0132, no los moles.
          - valor: '0.0657 atm'
            mensaje: |
              Esa es la presión parcial del etano, con sus 0,421 moles. El
              propano es el C₃H₈, el de 0,116 moles.
          - valor: '0.0132'
            mensaje: |
              Te has quedado en la fracción molar. Falta multiplicarla por la
              presión total, 1,37 atm.
        pista: |
          $P_{\mathrm{C_3H_8}} = X_{\mathrm{C_3H_8}}\,P_T$.
        desarrollo: |
          $$
          P_{\mathrm{C_3H_8}} = X_{\mathrm{C_3H_8}}\,P_T = 0{,}01322\cdot 1{,}37 = 0{,}0181\ \text{atm}
          $$

          Es la opción B.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por la ley de Dalton, cada gas aporta a la presión total la
              fracción que aporta a los moles: $P_A = X_A\,P_T$.
          - texto: >-
              Los moles totales son $8{,}24 + 0{,}421 + 0{,}116 = 8{,}777$ mol.
          - texto: >-
              La fracción molar del propano es $0{,}116/8{,}777 = 0{,}0132$.
          - texto: >-
              Su presión parcial es $0{,}0132 \cdot 1{,}37 = 0{,}0181$ atm: la
              opción B.
          - texto: >-
              Como el propano es la molécula más pesada, su presión parcial es
              la mayor de las tres.
            trampa: true
            mensaje: |
              La presión parcial depende de los moles, no de la masa de cada
              molécula: a la misma temperatura, todas chocan con la pared con
              la misma energía media. El propano es el que menos moles tiene y
              su presión parcial es la menor.
        veredicto: |
          En una mezcla de gases, la presión se reparte por moles. Lo que pese
          cada molécula no entra.

    resolucion: |
      **La ley que se usa.** En una mezcla, cada gas se comporta como si
      estuviera solo, y su presión parcial es la fracción de la total que le
      corresponde por moles (lámina 29):

      $$
      P_A = X_A\,P_T
      \qquad
      X_A = \frac{n_A}{n_T}
      $$

      Por eso no hacen falta ni el volumen ni la temperatura: se cancelan al
      comparar un gas con el total.

      **Las cuentas.**

      $$
      n_T = 8{,}24 + 0{,}421 + 0{,}116 = 8{,}777\ \text{mol}
      \qquad
      X_{\mathrm{C_3H_8}} = \frac{0{,}116}{8{,}777} = 0{,}0132
      $$

      $$
      P_{\mathrm{C_3H_8}} = 0{,}0132\cdot 1{,}37 = \boxed{0{,}0181\ \text{atm}}
      $$

      Es la opción **B**.

      **La A es el error de multiplicar por los moles**, $0{,}116\cdot 1{,}37 =
      0{,}159$. Además de salir diez veces mayor, no puede ser: el propano es
      poco más del 1 % de los moles, y no puede llevarse el 12 % de la presión.

  - id: colfq4-liq7-la-entalpia-del-mercurio-por-la-recta
    titulo: La entalpía de vaporización del mercurio, sacada de una recta
    fuente: >-
      Problema 7 · Ejercicios del tema 4.1.3, Estado líquido (láminas 15 y
      16) · Fundamentos Químicos de la Ingeniería (25975), Escuela de
      Ingeniería de Gipuzkoa (UPV/EHU) · El material publica la resolución,
      que da 60,6 kJ/mol; la lámina 18 repite el problema como número 6 y da
      59,8 kJ/mol. La diferencia sale de que la lámina 15 redondea 1/T a tres
      cifras antes de ajustar la recta; con 1/T sin redondear sale 59,8. El
      diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Calcular, mediante representación gráfica, la entalpía de vaporización
      del mercurio a partir de los datos de presión de vapor y temperatura que
      se indican:

      | T (°C) | 200 | 250 | 300 | 320 | 340 |
      |---|---|---|---|---|---|
      | P (mm de Hg) | 17,3 | 74,4 | 246,8 | 376,3 | 557,9 |
    pide: La entalpía de vaporización del mercurio, a partir de la recta de Clausius-Clapeyron.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación de Clausius-Clapeyron de la lámina 14 es
          $\log P = b - \dfrac{\Delta H_{vap}}{2{,}303\,R}\,\dfrac{1}{T}$.
          ¿Qué hay que representar para que salga una recta?
        opciones:
          - texto: >-
              $\log P$ frente a $1/T$, con $T$ en kelvin
            correcta: true
            mensaje: |
              Eso es. La ecuación tiene la forma $y = b + m\,x$ con
              $y = \log P$ y $x = 1/T$, y la pendiente es
              $m = -\Delta H_{vap}/(2{,}303\,R)$. De la pendiente sale la
              entalpía.
          - texto: >-
              $P$ frente a $T$
            mensaje: |
              Esa es la curva de presión de vapor de la lámina 10, y no es una
              recta: la presión crece cada vez más deprisa. Para enderezarla
              hay que tomar logaritmos y usar $1/T$.
          - texto: >-
              $\log P$ frente a $T$
            mensaje: |
              El logaritmo endereza la presión, pero la ecuación es lineal en
              $1/T$, no en $T$. Con $T$ en el eje sale una curva.
          - texto: >-
              $\log P$ frente a $1/T$, con $T$ en grados Celsius
            mensaje: |
              La ecuación sale de la termodinámica con la temperatura absoluta.
              Con $1/t$ en Celsius los puntos tampoco caen en una recta, y la
              pendiente que se ajustara no tendría nada que ver con la
              entalpía.

      - tipo: dibujar
        consigna: |
          Construye la tabla de $1/T$ (en K⁻¹) y de $\log P$, con $P$ en
          atmósferas como la resolución del material, y representa los cinco
          puntos. Traza la recta que mejor pasa por ellos y lee su pendiente.
        comprueba:
          - punto: 'En el eje horizontal va 1/T, con T = t + 273: de 0,00211 a 0,00163 K⁻¹.'
            porque: |
              Es la variable que hace lineal la ecuación. Fíjate en que al
              crecer la temperatura $1/T$ **baja**: el punto de 340 °C es el de
              la izquierda.
          - punto: 'En el eje vertical va log P: de −1,64 a −0,13, con P en atmósferas.'
            porque: |
              Con $P$ en mmHg todos los valores suben 2,88, que es
              $\log 760$: la recta se desplaza hacia arriba y la pendiente es la
              misma. La unidad de la presión solo mueve la ordenada.
          - punto: Los cinco puntos quedan alineados, en una recta que baja hacia la derecha.
            porque: |
              Si no están alineados, casi seguro se ha usado $t$ en Celsius o
              $P$ sin logaritmo. Que la recta baje dice que la pendiente es
              negativa, y por tanto $\Delta H_{vap}$ positiva.
          - punto: 'La pendiente sale en torno a −3124 K; la ordenada, en torno a 4,96.'
            porque: |
              Es el ajuste de los cinco puntos. Con los $1/T$ redondeados a
              tres cifras, como en la lámina 15, sale −3165; con dos puntos
              cualesquiera de la recta, algo parecido. La diferencia pasa a la
              entalpía.
        figura: |
          <svg viewBox="0 0 460 300" role="img" width="460" height="300"
               aria-labelledby="hg4cc-t hg4cc-d">
            <title id="hg4cc-t">Recta de Clausius-Clapeyron del mercurio: log P frente a 1/T</title>
            <desc id="hg4cc-d">Ejes: en horizontal, uno partido por T en kelvin a la menos uno, de 0,0016 a 0,0022; en vertical, el logaritmo decimal de la presión en atmósferas, de menos dos a cero. Cinco puntos, de izquierda a derecha los de 340, 320, 300, 250 y 200 grados, bajan alineados desde menos 0,13 hasta menos 1,64. Una recta pasa por todos ellos; su ecuación es log P igual a 4,96 menos 3124 por uno partido por T, y su pendiente es menos 3124 kelvin.</desc>
            <style>
              .hg4cc-eje { stroke: var(--rule); stroke-width: 1.2; fill: none; }
              .hg4cc-rej { stroke: var(--rule); stroke-width: 0.6; fill: none; stroke-dasharray: 2 3; }
              .hg4cc-rec { stroke: var(--live); stroke-width: 2; fill: none; }
              .hg4cc-pt { fill: var(--flag); }
              .hg4cc-n { fill: var(--faint); font-size: 10px; }
              .hg4cc-l { fill: var(--ink); font-size: 11.5px; }
              .hg4cc-e { fill: var(--live); font-size: 11.5px; }
            </style>
            <path class="hg4cc-rej" d="M180 30 L180 250 M300 30 L300 250 M60 85 L420 85 M60 140 L420 140 M60 195 L420 195"/>
            <path class="hg4cc-eje" d="M60 30 L60 250 L420 250"/>
            <g class="hg4cc-n">
              <text x="60" y="266" text-anchor="middle">0,0016</text>
              <text x="180" y="266" text-anchor="middle">0,0018</text>
              <text x="300" y="266" text-anchor="middle">0,0020</text>
              <text x="420" y="266" text-anchor="middle">0,0022</text>
              <text x="54" y="34" text-anchor="end">0</text>
              <text x="54" y="89" text-anchor="end">−0,5</text>
              <text x="54" y="144" text-anchor="end">−1,0</text>
              <text x="54" y="199" text-anchor="end">−1,5</text>
              <text x="54" y="254" text-anchor="end">−2,0</text>
            </g>
            <text class="hg4cc-l" x="240" y="290" text-anchor="middle">1/T (K⁻¹)</text>
            <text class="hg4cc-l" x="16" y="140" text-anchor="middle" transform="rotate(-90 16 140)">log P (atm)</text>
            <path class="hg4cc-rec" d="M60 33.9 L420 240.1"/>
            <g class="hg4cc-pt">
              <circle cx="78.8" cy="44.8" r="4"/>
              <circle cx="111.8" cy="63.6" r="4"/>
              <circle cx="147.1" cy="83.7" r="4"/>
              <circle cx="247.2" cy="141" r="4"/>
              <circle cx="368.5" cy="210.7" r="4"/>
            </g>
            <text class="hg4cc-e" x="250" y="60">log P = 4,96 − 3124 · (1/T)</text>
            <text class="hg4cc-n" x="86" y="40">340 °C</text>
            <text class="hg4cc-n" x="376" y="206">200 °C</text>
          </svg>

      - tipo: calcular
        titulo: La pendiente de la recta
        pregunta: |
          ¿Cuánto vale la pendiente de la recta $\log P$ frente a $1/T$?
        respuesta:
          tipo: numero
          valor: '-3124'
          tolerancia: 45
          formato: la pendiente en K, con su signo
        distractores:
          - valor: '-729'
            mensaje: |
              Has puesto $1/t$ con la temperatura en Celsius. La ecuación pide
              la temperatura absoluta: $T = t + 273$. Con Celsius los puntos ni
              siquiera quedan alineados.
          - valor: '3124'
            mensaje: |
              Signo cambiado. Al crecer $1/T$, es decir, al enfriar, la presión
              de vapor baja: la recta desciende y la pendiente es negativa.
        pista: |
          Con dos puntos alejados vale:
          $m = \dfrac{-0{,}1343 - (-1{,}6428)}{0{,}0016313 - 0{,}0021142}$.
        desarrollo: |
          Con los dos puntos extremos, los de 340 y 200 °C:

          $$
          m = \frac{-0{,}1343 - (-1{,}6428)}{0{,}0016313 - 0{,}0021142} = -3124\ \text{K}
          $$

          El ajuste de los cinco puntos da lo mismo, −3124,4: están
          prácticamente en línea. La lámina 16 da −3165,02 porque ajusta con
          los $1/T$ de la lámina 15, redondeados a tres cifras; la diferencia
          cabe en la tolerancia.

      - tipo: calcular
        titulo: La entalpía de vaporización
        pregunta: |
          De la pendiente, ¿cuánto vale $\Delta H_{vap}$ del mercurio?
        respuesta:
          tipo: numero
          valor: '59.8'
          tolerancia: 0.9
          formato: la entalpía en kJ/mol, con un decimal
        distractores:
          - valor: '25.96'
            mensaje: |
              Te has dejado el 2,303. La ecuación está en logaritmos decimales,
              y la pendiente es $-\Delta H_{vap}/(2{,}303\,R)$, no
              $-\Delta H_{vap}/R$. Ese factor solo desaparece si se representa
              $\ln P$.
          - valor: '0.590'
            mensaje: |
              Has usado $R = 0{,}082$ atm·L/(mol·K). Para una energía en julios
              la constante es la de 8,31 J/(mol·K).
        pista: |
          $\Delta H_{vap} = -m\cdot 2{,}303\cdot R$, con $R = 8{,}31$ J/(mol·K).
        desarrollo: |
          $$
          \Delta H_{vap} = -m\cdot 2{,}303\,R = 3124\cdot 2{,}303\cdot 8{,}31 = 59\,790\ \text{J/mol} = 59{,}8\ \text{kJ/mol}
          $$

          Es la respuesta de la lámina 18. Con la pendiente de la lámina 16,
          −3165,02, sale 60,6 kJ/mol, la de la lámina 16: las dos caben en la
          tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Clausius-Clapeyron es una recta si se representa $\log P$ frente
              a $1/T$, con $T$ en kelvin.
          - texto: >-
              Con los cinco datos, $1/T$ va de 0,00211 a 0,00163 K⁻¹ y
              $\log P$ (atm) de −1,64 a −0,13.
          - texto: >-
              La pendiente de la recta es −3124 K, que es
              $-\Delta H_{vap}/(2{,}303\,R)$.
          - texto: >-
              $\Delta H_{vap} = 3124\cdot 2{,}303\cdot 8{,}31 = 59{,}8$ kJ/mol.
          - texto: >-
              Hay que pasar las presiones a atmósferas antes de tomar
              logaritmos, o la pendiente sale mal.
            trampa: true
            mensaje: |
              Pasar de mmHg a atm resta $\log 760 = 2{,}88$ a todos los
              $\log P$: la recta baja entera y la pendiente no cambia. La
              unidad de la presión solo afecta a la ordenada $b$, y la
              entalpía sale de la pendiente.
        veredicto: |
          De la recta solo importa la pendiente, y la pendiente no depende de
          la unidad de la presión. De la temperatura sí: tiene que ir en
          kelvin.

    resolucion: |
      **La recta.** La ecuación de Clausius-Clapeyron de la lámina 14,

      $$
      \log P = b - \frac{\Delta H_{vap}}{2{,}303\,R}\,\frac{1}{T}
      $$

      es una recta en $x = 1/T$, $y = \log P$, con pendiente
      $m = -\Delta H_{vap}/(2{,}303\,R)$. Así que se construye la tabla y se
      representa:

      | t (°C) | T (K) | 1/T (K⁻¹) | P (atm) | log P |
      |---|---|---|---|---|
      | 200 | 473 | 0,0021142 | 0,02276 | −1,6428 |
      | 250 | 523 | 0,0019120 | 0,09789 | −1,0092 |
      | 300 | 573 | 0,0017452 | 0,32474 | −0,4885 |
      | 320 | 593 | 0,0016863 | 0,49513 | −0,3053 |
      | 340 | 613 | 0,0016313 | 0,73408 | −0,1343 |

      **La pendiente y la entalpía.** Los cinco puntos caen en línea y el
      ajuste da $\log P = 4{,}96 - 3124\,(1/T)$:

      $$
      \Delta H_{vap} = 3124\cdot 2{,}303\cdot 8{,}31 = \boxed{59{,}8\ \text{kJ/mol}}
      $$

      **Dos resultados en el material, y por qué.** La lámina 18 da 59,8
      kJ/mol, lo mismo que aquí. Las láminas 15 y 16 dan 60,6, porque ajustan
      la recta con los $1/T$ redondeados a tres cifras (0,00211, 0,00191…), y
      ese redondeo, que parece inocente, cambia la pendiente un 1,3 %. Con
      pocos datos y muy juntos, conviene no redondear la variable que va en
      el eje. Las dos cifras se aceptan.

      **Una errata de la lámina 18.** Su tabla repite en la columna «P (atm)»
      los valores de $1/T$; la columna de $\log P$ sí está bien.

      **Lo que no importa y lo que sí.** La presión puede ir en mmHg o en atm:
      cambia la ordenada, no la pendiente. La temperatura no: en kelvin, o la
      recta deja de serlo.

  - id: colfq4-liq8-el-eter-de-18-a-32-grados
    titulo: El éter dietílico de 18 a 32 grados, con Clausius-Clapeyron entre dos puntos
    fuente: >-
      Problema 8 · Ejercicios del tema 4.1.3, Estado líquido (lámina 17) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución, que da 657 mm
      de Hg; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      El éter dietílico es un líquido orgánico volátil y muy inflamable que se
      utiliza como disolvente. La presión de vapor del éter dietílico es de
      401 mm de Hg a 18 °C. Calcular la presión de vapor de éter dietílico a
      32 °C. Dato: Entalpía de vaporización del éter dietílico: 26,0 kJ mol⁻¹
    pide: La presión de vapor del éter a 32 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de operar: la presión de vapor a 32 °C, ¿será mayor o menor que
          401 mmHg?
        opciones:
          - texto: >-
              Mayor: la presión de vapor crece siempre con la temperatura
            correcta: true
            mensaje: |
              Eso es, y conviene decidirlo antes de la cuenta, porque es la
              forma más rápida de pillar un signo cambiado. A más temperatura,
              más moléculas tienen energía para escapar.
          - texto: >-
              Menor: al calentar se evapora el líquido y queda menos
            mensaje: |
              La presión de vapor no depende de cuánto líquido quede, mientras
              quede algo: es la del equilibrio a esa temperatura. Y crece al
              calentar.
          - texto: >-
              La misma: la presión de vapor es una propiedad del líquido
            mensaje: |
              Es propia de cada líquido **a cada temperatura**. Precisamente
              lo que pide el problema es cómo cambia con ella.
          - texto: >-
              Depende de la presión atmosférica
            mensaje: |
              La presión exterior decide a qué temperatura hierve, no cuánto
              vale la presión de vapor. Esa es solo del líquido y de la
              temperatura.

      - tipo: calcular
        titulo: El logaritmo del cociente
        pregunta: |
          Con $\log\dfrac{P_2}{P_1} = \dfrac{\Delta H_{vap}}{2{,}303\,R}\left(\dfrac{1}{T_1} - \dfrac{1}{T_2}\right)$,
          ¿cuánto vale $\log(P_2/P_1)$?
        respuesta:
          tipo: numero
          valor: '0.2143'
          tolerancia: 0.002
          formato: un número, con cuatro decimales
        distractores:
          - valor: '-0.2143'
            mensaje: |
              Signo cambiado: te sale una presión menor a más temperatura.
              Revisa el orden de la resta. Con $T_1 = 291$ K y $T_2 = 305$ K,
              $1/T_1 - 1/T_2$ es positivo, y $\log(P_2/P_1)$ también.
          - valor: '0.4935'
            mensaje: |
              Ese es el logaritmo neperiano, $\ln(P_2/P_1)$: te has dejado el
              2,303. No está mal si después deshaces con $e^x$; aquí se pide el
              decimal, que es el que usa la lámina.
        pista: |
          $T_1 = 18 + 273 = 291$ K, $T_2 = 32 + 273 = 305$ K, y
          $\Delta H_{vap} = 26\,000$ J/mol.
        desarrollo: |
          $$
          \log\frac{P_2}{P_1} = \frac{26\,000}{2{,}303\cdot 8{,}31}\left(\frac{1}{291} - \frac{1}{305}\right) = 0{,}2143
          $$

      - tipo: calcular
        titulo: La presión de vapor a 32 °C
        pregunta: |
          ¿Cuánto vale la presión de vapor del éter a 32 °C?
        respuesta:
          tipo: magnitud
          valor: '657 mmHg'
          tolerancia: 0.003
          formato: una presión, con su unidad
        distractores:
          - valor: '244.8 mmHg'
            mensaje: |
              Te sale menor que a 18 °C, y no puede ser: la presión de vapor
              crece con la temperatura. Hay un signo cambiado en la resta de
              las inversas.
          - valor: '401.2 mmHg'
            mensaje: |
              Te sale prácticamente la de partida porque has puesto la entalpía
              en kJ, 26,0, con $R$ en J/(mol·K). Hay que pasarla a julios:
              26 000 J/mol.
        pista: |
          $P_2 = 401\cdot 10^{0{,}2143}$.
        desarrollo: |
          $$
          P_2 = 401\cdot 10^{0{,}2143} = 657\ \text{mmHg}
          $$

          Es el resultado de la resolución del material, 657 mm de Hg. Con
          $R = 8{,}314$ y $T + 273{,}15$ sale 656,4: cabe en la tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión de vapor crece con la temperatura: a 32 °C tiene que
              salir más de 401 mmHg.
          - texto: >-
              Las temperaturas van en kelvin, 291 y 305 K, y la entalpía en
              julios, 26 000 J/mol.
          - texto: >-
              $\log(P_2/P_1) = \frac{26\,000}{2{,}303\cdot 8{,}31}(1/291 - 1/305) = 0{,}2143$.
          - texto: >-
              $P_2 = 401\cdot 10^{0{,}2143} = 657$ mmHg.
          - texto: >-
              Como la temperatura sube de 18 a 32 °C, casi el doble, la presión
              de vapor también casi se duplica.
            trampa: true
            mensaje: |
              En kelvin la temperatura sube de 291 a 305, menos de un 5 %. La
              presión sí sube mucho, un 64 %, pero no porque la temperatura
              se duplique: la presión de vapor crece exponencialmente con
              $1/T$. Los grados Celsius no se pueden comparar como cocientes.
        veredicto: |
          Con dos puntos, Clausius-Clapeyron da el segundo a partir del
          primero. Temperaturas en kelvin, entalpía en julios, y el signo se
          comprueba con el sentido común.

    resolucion: |
      **La ecuación entre dos estados** (lámina 14), escrita para despejar el
      punto nuevo:

      $$
      \log\frac{P_2}{P_1} = \frac{\Delta H_{vap}}{2{,}303\,R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)
      $$

      que es la del tema, $\ln\frac{P_2}{P_1} = -\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2} - \frac{1}{T_1}\right)$,
      con logaritmos decimales. La resolución del material la escribe con
      $\log(P_1/P_2)$ y el signo al otro lado: es la misma.

      **Las cuentas**, con $T$ en kelvin y la entalpía en julios:

      $$
      \log\frac{P_2}{401} = \frac{26\,000}{2{,}303\cdot 8{,}31}\left(\frac{1}{291} - \frac{1}{305}\right) = 0{,}2143
      \quad\Longrightarrow\quad
      P_2 = 401\cdot 10^{0{,}2143} = \boxed{657\ \text{mmHg}}
      $$

      Coincide con la resolución del material.

      **Los tres sitios donde se cae**, por orden de frecuencia:

      - **El signo.** Si sale menos de 401, hay una resta al revés: a más
        temperatura, más presión de vapor.
      - **Los kJ.** Con 26,0 en vez de 26 000 el exponente sale mil veces
        más pequeño y la presión casi no cambia.
      - **El 2,303.** Si se usa $\log$, va; si se usa $\ln$, no. Mezclar un
        logaritmo con la fórmula del otro da un resultado equivocado.

      **La lectura.** Catorce grados más y la presión de vapor sube un 64 %.
      Por eso el éter, que ya a temperatura ambiente tiene más de media
      atmósfera de presión de vapor, se evapora tan deprisa y hierve a solo
      34,6 °C.

  - id: colfq4-liq9-el-benceno-de-7-a-60-grados
    titulo: El benceno de 7,6 a 60,6 grados, con el logaritmo neperiano
    fuente: >-
      Problema 9 · Ejercicios del tema 4.1.3, Estado líquido (lámina 19) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, 331,3 mm
      Hg; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      La presión de vapor del benceno, C₆H₆ (l), es de 40,1 mm Hg a 7,6 °C
      ¿Cuál será su presión de vapor a 60,6 °C? La entalpía de vaporización
      del benceno es de 31,0 kJ mol⁻¹
    pide: La presión de vapor del benceno a 60,6 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación del tema es
          $\ln\dfrac{P_2}{P_1} = -\dfrac{\Delta H_{vap}}{R}\left(\dfrac{1}{T_2} - \dfrac{1}{T_1}\right)$,
          y la de la lámina 14 lleva $\log$ y un 2,303. ¿Qué pasa si se usa una
          en vez de la otra?
        opciones:
          - texto: >-
              Nada, siempre que cada logaritmo vaya con su fórmula: el 2,303 es
              el paso de uno a otro
            correcta: true
            mensaje: |
              Eso es: $\ln x = 2{,}303\log x$. Con $\ln$, sin 2,303 y
              deshaciendo con $e^x$; con $\log$, con 2,303 y deshaciendo con
              $10^x$. Lo que no se puede es mezclar.
          - texto: >-
              La del tema da un resultado 2,303 veces mayor
            mensaje: |
              Las dos dan la misma presión. El 2,303 multiplica en una fórmula y
              en la otra está dentro del logaritmo: se compensan.
          - texto: >-
              Solo vale la de la lámina, porque es la del curso
            mensaje: |
              Son la misma ecuación. La del tema está en logaritmos neperianos,
              la de la lámina en decimales, y $\ln x = 2{,}303\log x$ las une.
          - texto: >-
              La del tema necesita la presión en atmósferas
            mensaje: |
              Con un cociente $P_2/P_1$, la unidad se cancela en las dos
              fórmulas. Vale mmHg, atm o lo que sea, mientras sea la misma.

      - tipo: calcular
        titulo: El logaritmo neperiano del cociente
        pregunta: |
          ¿Cuánto vale $\ln(P_2/P_1)$?
        respuesta:
          tipo: numero
          valor: '2.111'
          tolerancia: 0.005
          formato: un número, con tres decimales
        distractores:
          - valor: '-2.111'
            mensaje: |
              Signo cambiado: saldría una presión menor a más temperatura.
              Fíjate en el menos de delante: $1/T_2 - 1/T_1$ es negativo, y con
              él $\ln(P_2/P_1)$ sale positivo.
          - valor: '0.917'
            mensaje: |
              Ese es el logaritmo decimal: has metido el 2,303 en la fórmula
              del $\ln$. No está mal si después deshaces con $10^x$; con $e^x$
              saldría 100 mmHg, muy lejos de la respuesta.
        pista: |
          $T_1 = 280{,}6$ K, $T_2 = 333{,}6$ K, $\Delta H_{vap} = 31\,000$ J/mol
          y $R = 8{,}314$ J/(mol·K).
        desarrollo: |
          $$
          \ln\frac{P_2}{P_1} = -\frac{31\,000}{8{,}314}\left(\frac{1}{333{,}6} - \frac{1}{280{,}6}\right) = 2{,}111
          $$

      - tipo: calcular
        titulo: La presión de vapor a 60,6 °C
        pregunta: |
          ¿Cuánto vale la presión de vapor del benceno a 60,6 °C?
        respuesta:
          tipo: magnitud
          valor: '331.3 mmHg'
          tolerancia: 0.004
          formato: una presión, con su unidad
        distractores:
          - valor: '4.86 mmHg'
            mensaje: |
              Te sale menor que a 7,6 °C: hay un signo cambiado. La presión de
              vapor crece con la temperatura.
          - valor: '5179 mmHg'
            mensaje: |
              Has deshecho el logaritmo neperiano con $10^x$. El 2,111 es un
              $\ln$: la presión es $40{,}1\cdot e^{2{,}111}$.
          - valor: '40.2 mmHg'
            mensaje: |
              Te sale casi la de partida porque has dejado la entalpía en kJ,
              31,0, con $R$ en J/(mol·K). Son 31 000 J/mol.
        pista: |
          $P_2 = 40{,}1\cdot e^{2{,}111}$.
        desarrollo: |
          $$
          P_2 = 40{,}1\cdot e^{2{,}111} = 331\ \text{mmHg}
          $$

          La colección da 331,3 mm Hg. Según el redondeo de $R$ y de las
          temperaturas sale entre 330,4 y 331,5: la tolerancia acepta todo
          ese intervalo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las temperaturas, en kelvin: $7{,}6 + 273 = 280{,}6$ K y
              $60{,}6 + 273 = 333{,}6$ K.
          - texto: >-
              La entalpía, en julios: 31 000 J/mol.
          - texto: >-
              $\ln(P_2/P_1) = -\frac{31\,000}{8{,}314}(1/333{,}6 - 1/280{,}6) = 2{,}111$.
          - texto: >-
              $P_2 = 40{,}1\cdot e^{2{,}111} = 331$ mmHg: ocho veces la presión
              de partida.
          - texto: >-
              La presión de vapor sale mayor que la atmosférica, así que a
              60,6 °C el benceno ya está hirviendo.
            trampa: true
            mensaje: |
              331 mmHg es menos de media atmósfera, lejos de los 760 que harían
              falta para que hierva a presión normal. El benceno hierve a
              80,1 °C, como da la tabla de la lámina 82 del tema 4.2.
        veredicto: |
          Cada logaritmo con su fórmula: $\ln$ sin 2,303 y con $e^x$, $\log$
          con 2,303 y con $10^x$.

    resolucion: |
      **Con la ecuación del tema**, en logaritmos neperianos:

      $$
      \ln\frac{P_2}{P_1} = -\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2} - \frac{1}{T_1}\right)
      = -\frac{31\,000}{8{,}314}\left(\frac{1}{333{,}6} - \frac{1}{280{,}6}\right) = 2{,}111
      $$

      $$
      P_2 = 40{,}1\cdot e^{2{,}111} = \boxed{331\ \text{mmHg}}
      $$

      La colección da 331,3 mm Hg. Con $R = 8{,}31$ sale 331,5, y con
      $T + 273{,}15$, 330,4: son redondeos, y la tolerancia los acepta.

      **Con la de la lámina 14**, en decimales, el exponente es
      $2{,}111/2{,}303 = 0{,}917$ y $P_2 = 40{,}1\cdot 10^{0{,}917}$: la
      misma presión. Lo único que no vale es cruzar las dos, $\ln$ con
      $10^x$ o $\log$ con $e^x$.

      **La lectura.** En 53 grados la presión de vapor se multiplica por
      ocho. Y aun así, a 60,6 °C el benceno no hierve a presión normal: le
      faltan más de 400 mmHg. Hierve a 80,1 °C, que es donde su presión de
      vapor llega a 760.

  - id: colfq4-liq10-la-presion-que-se-duplica-en-diez-grados
    titulo: Una presión de vapor que se duplica en diez grados, y la entalpía que hay detrás
    fuente: >-
      Problema 10 · Ejercicios del tema 4.1.3, Estado líquido (lámina 19) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, 75,9 kJ
      mol⁻¹; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la entalpía de vaporización de un líquido cuya presión de vapor
      se duplica cuando la temperatura se eleva de 85 °C a 95 °C.
    pide: La entalpía de vaporización del líquido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da ninguna presión. ¿Se puede resolver?
        opciones:
          - texto: >-
              Sí: la ecuación solo necesita el cociente $P_2/P_1$, y es 2
            correcta: true
            mensaje: |
              Eso es. Clausius-Clapeyron entre dos puntos relaciona el
              **cociente** de presiones con las temperaturas. «Se duplica» ya
              es el dato: $P_2/P_1 = 2$, valga lo que valga $P_1$.
          - texto: >-
              No: hace falta al menos una presión de vapor
            mensaje: |
              Las presiones solo entran divididas una por otra. Da igual que el
              líquido pase de 100 a 200 mmHg o de 300 a 600: el cociente es 2 y
              la entalpía sale la misma.
          - texto: >-
              Sí, suponiendo que a 95 °C hierve, a 760 mmHg
            mensaje: |
              No hace falta suponer nada, y la suposición podría ser falsa: el
              enunciado no dice que hierva. El cociente es todo el dato.
          - texto: >-
              Sí, con $P_2 - P_1 = 2$
            mensaje: |
              «Se duplica» es multiplicar por dos, no sumar dos. Y la ecuación
              pide el cociente, no la diferencia.

      - tipo: calcular
        titulo: La diferencia de inversas
        pregunta: |
          ¿Cuánto vale $\dfrac{1}{T_1} - \dfrac{1}{T_2}$, en K⁻¹?
        respuesta:
          tipo: numero
          valor: '7.590e-5'
          tolerancia: 3e-7
          formato: en K⁻¹, en notación científica, como 3,5e-4
        distractores:
          - valor: '1.238e-3'
            mensaje: |
              Has usado 85 y 95 tal cual, en Celsius. La ecuación va con la
              temperatura absoluta: 358 y 368 K. En Celsius la diferencia de
              inversas sale dieciséis veces mayor.
          - valor: '-7.590e-5'
            mensaje: |
              Has restado al revés. $T_1 = 358$ K es la menor, así que $1/T_1$
              es la mayor y la resta $1/T_1 - 1/T_2$ es positiva.
        pista: |
          $T_1 = 85 + 273 = 358$ K y $T_2 = 95 + 273 = 368$ K.
        desarrollo: |
          $$
          \frac{1}{358} - \frac{1}{368} = 7{,}590\cdot 10^{-5}\ \text{K}^{-1}
          $$

          Un número pequeño: dos temperaturas absolutas tan cercanas tienen
          inversas casi iguales. Por eso aquí no conviene redondear.

      - tipo: calcular
        titulo: La entalpía de vaporización
        pregunta: |
          ¿Cuánto vale $\Delta H_{vap}$?
        respuesta:
          tipo: numero
          valor: '75.9'
          tolerancia: 0.2
          formato: la entalpía en kJ/mol, con un decimal
        distractores:
          - valor: '32.96'
            mensaje: |
              Has usado $\log 2$ sin el 2,303. Con logaritmos decimales la
              ecuación lleva $2{,}303\,R$; si prefieres no arrastrarlo, usa
              $\ln 2 = 0{,}693$.
          - valor: '4.65'
            mensaje: |
              Has arrastrado las temperaturas en Celsius. Con 85 y 95 la
              diferencia de inversas sale mucho mayor y la entalpía, dieciséis
              veces más pequeña.
          - valor: '-75.9'
            mensaje: |
              Signo cambiado. Una entalpía de vaporización es siempre positiva:
              evaporar cuesta energía. Si sale negativa, hay una resta de
              inversas al revés.
        pista: |
          $\Delta H_{vap} = \dfrac{R\ln 2}{1/T_1 - 1/T_2}$.
        desarrollo: |
          $$
          \Delta H_{vap} = \frac{R\ln 2}{1/T_1 - 1/T_2} = \frac{8{,}31\cdot 0{,}6931}{7{,}590\cdot 10^{-5}} = 75\,890\ \text{J/mol} = 75{,}9\ \text{kJ/mol}
          $$

          Es la respuesta de la colección. Con $R = 8{,}314$ y $T + 273{,}15$
          sale 76,0: cabe en la tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Se duplica» da el único dato de presión que hace falta:
              $P_2/P_1 = 2$.
          - texto: >-
              Las temperaturas, en kelvin: 358 y 368 K.
          - texto: >-
              De $\ln(P_2/P_1) = \frac{\Delta H_{vap}}{R}(1/T_1 - 1/T_2)$ se
              despeja $\Delta H_{vap} = R\ln 2/(1/T_1 - 1/T_2)$.
          - texto: >-
              $\Delta H_{vap} = 8{,}31\cdot 0{,}693/(7{,}59\cdot 10^{-5}) = 75{,}9$ kJ/mol.
          - texto: >-
              Si la presión se duplica al subir diez grados, se duplicaría
              también al subir otros diez, de 95 a 105 °C.
            trampa: true
            mensaje: |
              Casi, pero no: lo que la ecuación fija es el cociente para una
              misma diferencia de **inversas**, y de 368 a 378 K la diferencia
              de inversas es algo menor. Con esta entalpía, de 95 a 105 °C la
              presión se multiplica por 1,93, no por 2.
        veredicto: |
          Clausius-Clapeyron no necesita presiones, solo su cociente. Y cuanto
          más rápido crece la presión de vapor con la temperatura, mayor es la
          entalpía de vaporización.

    resolucion: |
      **Lo que da el enunciado.** Ninguna presión, pero su cociente:
      $P_2/P_1 = 2$. Es todo lo que pide la ecuación entre dos estados:

      $$
      \ln\frac{P_2}{P_1} = \frac{\Delta H_{vap}}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)
      \quad\Longrightarrow\quad
      \Delta H_{vap} = \frac{R\ln 2}{1/T_1 - 1/T_2}
      $$

      **Las cuentas**, con $T_1 = 358$ K y $T_2 = 368$ K:

      $$
      \Delta H_{vap} = \frac{8{,}31\cdot 0{,}6931}{7{,}590\cdot 10^{-5}} = \boxed{75{,}9\ \text{kJ/mol}}
      $$

      Coincide con la colección. Con la forma decimal de la lámina 14 se
      escribe $\log 2 = 0{,}301$ y se multiplica por $2{,}303\,R$: sale lo
      mismo.

      **La lectura.** Es una entalpía alta, casi el doble de la del agua,
      40,7 kJ/mol según el tema. Tiene sentido: cuanto más cuesta arrancar
      una molécula del líquido, más sensible es la presión de vapor a la
      temperatura, y aquí diez grados bastan para duplicarla.

      **Y una advertencia**: la regla «se duplica cada diez grados» no se
      puede extender alegremente. Lo que la ecuación fija es el cociente para
      una diferencia de inversas, y esa diferencia cambia al subir: de 95 a
      105 °C la misma entalpía da un factor de 1,93.

  - id: colfq4-p3-las-dos-camaras-de-so2-y-oxigeno
    titulo: Dos cámaras, una llave, y el SO₂ que arde con el oxígeno que hay
    fuente: >-
      Problema 3 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 22; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la respuesta final; el desarrollo es
      nuestro. Dos cifras de esa respuesta no salen de los datos: en a) da
      P(O₂) = 0,41 atm, y es 0,21 (0,41 es la presión del SO₃ del apartado
      b); en b) da x(SO₂) = 0,05 y x(SO₃) = 0,95, que redondeadas son 0,06 y
      0,94. Tampoco da la presión total final que pide b), 0,44 atm.
    nivel: practica
    enunciado: |
      Se prepara una mezcla de reacción para la combustión del anhídrido
      sulfuroso abriendo una llave que conecta dos cámaras separadas, una con
      un volumen de 2,12 L llena a 0,75 atm de anhídrido sulfuroso y la otra
      con un volumen de 1,50 L llena a 0,50 atm con oxígeno; los dos gases
      están a 80 °C.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 150" role="img" width="420" height="150"
           aria-labelledby="cam4p3-t cam4p3-d">
        <title id="cam4p3-t">Dos cámaras esféricas unidas por un tubo con una llave</title>
        <desc id="cam4p3-d">A la izquierda, una esfera grande llena de puntos, el anhídrido sulfuroso; a la derecha, otra esfera algo menor, también con puntos, el oxígeno. Las une un tubo estrecho con una llave en el centro. Al abrir la llave, los dos gases ocupan el volumen de las dos cámaras.</desc>
        <style>
          .cam4p3-b { fill: var(--live); fill-opacity: .07; stroke: var(--rule); stroke-width: 1.6; }
          .cam4p3-t { stroke: var(--rule); stroke-width: 1.6; fill: none; }
          .cam4p3-p { fill: var(--faint); }
          .cam4p3-k { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
          .cam4p3-n { fill: var(--faint); font-size: 11px; }
        </style>
        <circle class="cam4p3-b" cx="100" cy="70" r="56"/>
        <circle class="cam4p3-b" cx="318" cy="70" r="48"/>
        <path class="cam4p3-t" d="M155 64 L271 64 M155 76 L271 76"/>
        <rect class="cam4p3-k" x="204" y="58" width="12" height="24" rx="2"/>
        <path class="cam4p3-t" d="M210 58 L210 46"/>
        <g class="cam4p3-p">
          <circle cx="72" cy="44" r="2.2"/><circle cx="96" cy="36" r="2.2"/><circle cx="122" cy="46" r="2.2"/>
          <circle cx="62" cy="68" r="2.2"/><circle cx="88" cy="60" r="2.2"/><circle cx="112" cy="70" r="2.2"/><circle cx="138" cy="66" r="2.2"/>
          <circle cx="74" cy="90" r="2.2"/><circle cx="100" cy="86" r="2.2"/><circle cx="126" cy="92" r="2.2"/>
          <circle cx="90" cy="108" r="2.2"/><circle cx="112" cy="106" r="2.2"/><circle cx="82" cy="76" r="2.2"/>
          <circle cx="300" cy="48" r="2.2"/><circle cx="330" cy="44" r="2.2"/>
          <circle cx="290" cy="72" r="2.2"/><circle cx="318" cy="66" r="2.2"/><circle cx="346" cy="74" r="2.2"/>
          <circle cx="304" cy="96" r="2.2"/><circle cx="334" cy="98" r="2.2"/>
        </g>
        <text class="cam4p3-n" x="100" y="144" text-anchor="middle">2,12 L · 0,75 atm · SO₂</text>
        <text class="cam4p3-n" x="318" y="144" text-anchor="middle">1,50 L · 0,50 atm · O₂</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original, que no lleva rótulos: los de
      debajo son nuestros y repiten los datos del texto.
      </figcaption>
      </figure>

      a) Calcular las fracciones molares y másicas, así como las presiones
      parciales en la mezcla. b) Si se añade un catalizador sobre la mezcla, y
      se produce la reacción completa, formándose anhídrido sulfúrico,
      ¿cuáles serán las fracciones molares en la mezcla final y la presión
      total final a 80 °C?
    pide: Las fracciones molares y másicas y las presiones parciales de la mezcla; y, tras la reacción, las fracciones molares y la presión total.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al abrir la llave, ¿qué volumen ocupa cada gas?
        opciones:
          - texto: >-
              Los dos, el de las dos cámaras juntas: 3,62 L
            correcta: true
            mensaje: |
              Eso es. Un gas ocupa todo el recipiente que tiene a su alcance, y
              en la mezcla cada uno se comporta como si estuviera solo en los
              3,62 L. Es la idea de Dalton.
          - texto: >-
              Cada uno el de su cámara, 2,12 y 1,50 L
            mensaje: |
              Eso sería con la llave cerrada. Abierta, las moléculas de cada
              gas se reparten por las dos cámaras hasta que la mezcla es
              uniforme.
          - texto: >-
              Se reparten el volumen según sus moles
            mensaje: |
              Eso es el «volumen parcial», y no es lo que pasa: en una mezcla
              cada gas llena el recipiente entero. Lo que se reparte según los
              moles es la **presión**.
          - texto: >-
              El SO₂ empuja al oxígeno y se queda con casi todo el volumen,
              porque tiene más presión
            mensaje: |
              Los gases se mezclan, no se empujan como dos líquidos que no se
              mezclan. Al final los dos están en todo el volumen, cada uno con
              su presión parcial.

      - tipo: calcular
        titulo: La fracción molar del SO₂
        pregunta: |
          a) ¿Cuánto vale la fracción molar del SO₂ en la mezcla?
        respuesta:
          tipo: numero
          valor: '0.6795'
          tolerancia: 0.005
          formato: un número entre 0 y 1, con dos o más decimales
        distractores:
          - valor: '0.5856'
            mensaje: |
              Has hecho la fracción con los volúmenes, $2{,}12/3{,}62$. Los
              dos gases no estaban a la misma presión, así que los volúmenes no
              son proporcionales a los moles: el SO₂ estaba a 0,75 atm y el O₂
              a 0,50.
          - valor: '0.60'
            mensaje: |
              Has hecho la fracción con las presiones de partida,
              $0{,}75/(0{,}75 + 0{,}50)$. Cada presión corresponde a un volumen
              distinto: lo que es proporcional a los moles es $P\cdot V$.
        pista: |
          $n = PV/RT$ para cada gas, a la misma $T$. En el cociente $RT$ se
          cancela: $X_{\mathrm{SO_2}} = P_1V_1/(P_1V_1 + P_2V_2)$.
        desarrollo: |
          $$
          n_{\mathrm{SO_2}} = \frac{0{,}75\cdot 2{,}12}{0{,}082\cdot 353} = 0{,}05493\ \text{mol}
          \qquad
          n_{\mathrm{O_2}} = \frac{0{,}50\cdot 1{,}50}{0{,}082\cdot 353} = 0{,}02591\ \text{mol}
          $$

          $$
          X_{\mathrm{SO_2}} = \frac{0{,}05493}{0{,}08084} = 0{,}6795
          \qquad
          X_{\mathrm{O_2}} = 1 - 0{,}6795 = 0{,}3205
          $$

          La colección da 0,68 y 0,32.

      - tipo: calcular
        titulo: La fracción másica del SO₂
        pregunta: |
          a) ¿Cuánto vale la fracción másica del SO₂?
        respuesta:
          tipo: numero
          valor: '0.8092'
          tolerancia: 0.005
          formato: un número entre 0 y 1, con dos o más decimales
        distractores:
          - valor: '0.6795'
            mensaje: |
              Esa es la fracción molar. La másica pesa cada gas: el SO₂, con 64
              g/mol, pesa el doble por mol que el O₂, y su fracción en masa es
              mayor que en moles.
          - valor: '0.7608'
            mensaje: |
              Has tomado para el SO₂ una masa molar de 48, con un solo oxígeno.
              Es $32 + 2\cdot 16 = 64$ g/mol.
        pista: |
          $m = n\cdot M$, con $M_{\mathrm{SO_2}} = 64$ y $M_{\mathrm{O_2}} = 32$ g/mol.
        desarrollo: |
          $$
          m_{\mathrm{SO_2}} = 0{,}05493\cdot 64 = 3{,}516\ \text{g}
          \qquad
          m_{\mathrm{O_2}} = 0{,}02591\cdot 32 = 0{,}829\ \text{g}
          $$

          $$
          w_{\mathrm{SO_2}} = \frac{3{,}516}{3{,}516 + 0{,}829} = 0{,}809
          \qquad
          w_{\mathrm{O_2}} = 0{,}191
          $$

          La colección da 0,81 y 0,19.

      - tipo: calcular
        titulo: La presión parcial del SO₂
        pregunta: |
          a) ¿Cuánto vale la presión parcial del SO₂ en la mezcla?
        respuesta:
          tipo: magnitud
          valor: '0.4392 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.75 atm'
            mensaje: |
              Es la presión que tenía en su cámara. Al abrir la llave ocupa
              3,62 L en vez de 2,12, y su presión baja en la misma proporción.
          - valor: '0.849 atm'
            mensaje: |
              Has multiplicado la fracción molar por la suma de las dos
              presiones de partida, 1,25 atm. Esa suma no es la presión total
              de la mezcla: cada presión era la de un volumen distinto.
        pista: |
          Cada gas se expande a 3,62 L a la misma temperatura: Boyle,
          $P_2 = P_1V_1/V_2$.
        desarrollo: |
          $$
          P_{\mathrm{SO_2}} = \frac{0{,}75\cdot 2{,}12}{3{,}62} = 0{,}4392\ \text{atm}
          $$

          Es lo mismo que $n_{\mathrm{SO_2}}RT/V$. La colección da 0,44 atm.

      - tipo: calcular
        titulo: La presión parcial del oxígeno
        pregunta: |
          a) ¿Y la del oxígeno?
        respuesta:
          tipo: magnitud
          valor: '0.2072 atm'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.41 atm'
            mensaje: |
              Es la cifra que imprime la colección para el O₂, y no sale de los
              datos: 0,50 atm en 1,50 L, al pasar a 3,62 L, tienen que bajar.
              0,41 atm es, en cambio, la presión del SO₃ del apartado b: parece
              copiada de allí.
          - valor: '0.50 atm'
            mensaje: |
              Es la que tenía en su cámara. En la mezcla ocupa 3,62 L y su
              presión baja a menos de la mitad.
        pista: |
          $P_{\mathrm{O_2}} = 0{,}50\cdot 1{,}50/3{,}62$.
        desarrollo: |
          $$
          P_{\mathrm{O_2}} = \frac{0{,}50\cdot 1{,}50}{3{,}62} = 0{,}2072\ \text{atm}
          \qquad
          P_T = 0{,}4392 + 0{,}2072 = 0{,}6464\ \text{atm}
          $$

          Comprobación: $X_{\mathrm{O_2}}\,P_T = 0{,}3205\cdot 0{,}6464 = 0{,}2072$.
          La colección imprime 0,41 atm, y es una errata.

      - tipo: calcular
        titulo: La fracción molar del SO₂ tras la reacción
        pregunta: |
          b) La reacción es
          $2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}$ y es
          completa. ¿Cuánto vale la fracción molar del SO₂ en la mezcla final?
        respuesta:
          tipo: numero
          valor: '0.0566'
          tolerancia: 0.005
          formato: un número entre 0 y 1, con dos o más decimales
        distractores:
          - valor: '0.05'
            mensaje: |
              Es la cifra que da la colección, y con los datos sale 0,057, que
              redondeada es 0,06. La diferencia no es de planteamiento: es de
              redondeo.
          - valor: '0.528'
            mensaje: |
              Has ajustado uno a uno, $\mathrm{SO_2} + \mathrm{O_2} \rightarrow \mathrm{SO_3}$.
              Esa ecuación no cuadra los oxígenos: por cada O₂ reaccionan
              **dos** SO₂.
          - valor: '0.6795'
            mensaje: |
              Es la de antes de reaccionar. Con el catalizador casi todo el SO₂
              se ha convertido en SO₃, y solo queda el que sobra.
        pista: |
          ¿Quién limita? 0,02591 mol de O₂ necesitan 0,05182 mol de SO₂, y hay
          0,05493.
        desarrollo: |
          El O₂ limita: gasta $2\cdot 0{,}02591 = 0{,}05182$ mol de SO₂ y
          forma otros tantos de SO₃. Sobra
          $0{,}05493 - 0{,}05182 = 0{,}00311$ mol de SO₂.

          $$
          X_{\mathrm{SO_2}} = \frac{0{,}00311}{0{,}00311 + 0{,}05182} = 0{,}0566
          $$

          y $X_{\mathrm{SO_3}} = 0{,}943$. La colección da 0,05 y 0,95.

      - tipo: calcular
        titulo: La presión total final
        pregunta: |
          b) ¿Cuánto vale la presión total al final, a 80 °C?
        respuesta:
          tipo: magnitud
          valor: '0.4392 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.6464 atm'
            mensaje: |
              Es la presión total de antes de reaccionar. La reacción convierte
              tres moles de gas en dos, así que al final hay menos moles y
              menos presión.
          - valor: '0.232 atm'
            mensaje: |
              Has formado un SO₃ por cada O₂. La reacción ajustada da **dos**:
              los moles de SO₃ son el doble que los de O₂ gastado.
        pista: |
          Moles finales: el SO₃ formado más el SO₂ que sobra. Mismo volumen,
          3,62 L, y misma temperatura.
        desarrollo: |
          $$
          n_{\text{final}} = 0{,}05182 + 0{,}00311 = 0{,}05493\ \text{mol}
          \qquad
          P_T = \frac{0{,}05493\cdot 0{,}082\cdot 353}{3{,}62} = 0{,}4392\ \text{atm}
          $$

          Sale igual que la presión del SO₂ en a), y no es casualidad: los
          moles finales, SO₃ más SO₂ sobrante, son exactamente los moles de
          SO₂ del principio, porque cada SO₂ o se queda o se convierte en un
          SO₃. Las parciales son $P_{\mathrm{SO_2}} = 0{,}025$ y
          $P_{\mathrm{SO_3}} = 0{,}414$ atm; la colección da 0,02 y 0,41, pero
          no la total que pide el enunciado.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Al abrir la llave, cada gas ocupa los 3,62 L; como $T$ no cambia,
              su presión baja según Boyle.
          - texto: >-
              Los moles son proporcionales a $P\cdot V$: 1,59 para el SO₂ y
              0,75 para el O₂, en atm·L, y de ahí $X_{\mathrm{SO_2}} = 0{,}68$.
          - texto: >-
              Las parciales son 0,44 atm de SO₂ y 0,21 de O₂, y la total 0,65
              atm.
          - texto: >-
              En la reacción limita el O₂: el SO₃ formado es el doble de sus
              moles, y sobra algo de SO₂.
          - texto: >-
              Al final la presión es la misma que antes, porque la masa se
              conserva en la reacción.
            trampa: true
            mensaje: |
              La masa se conserva, pero la presión depende de los **moles**, y
              $2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}$
              convierte tres moles de gas en dos. La presión baja de 0,65 a
              0,44 atm.
        veredicto: |
          Antes de reaccionar se trabaja con presiones o con moles, como
          convenga. Para reaccionar, siempre en moles.

    resolucion: |
      **a · La mezcla.** Al abrir la llave, cada gas ocupa las dos cámaras,
      3,62 L, a la misma temperatura. Los moles son proporcionales a $P\cdot V$,
      y las presiones parciales salen de Boyle:

      | | $n$ (mol) | $X$ | $m$ (g) | $w$ | $P$ (atm) |
      |---|---|---|---|---|---|
      | SO₂ | 0,05493 | 0,680 | 3,516 | 0,809 | 0,439 |
      | O₂ | 0,02591 | 0,320 | 0,829 | 0,191 | 0,207 |
      | total | 0,08084 | 1 | 4,345 | 1 | 0,646 |

      Coinciden con la colección salvo la presión del oxígeno, que la
      colección da como 0,41 atm y es 0,21: con 0,50 atm en 1,50 L, al
      pasar a 3,62 L tiene que bajar a menos de la mitad.

      **b · La reacción.**
      $2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}$. El O₂ es
      el limitante: gasta 0,05182 mol de SO₂, forma 0,05182 de SO₃ y sobran
      0,00311 de SO₂.

      $$
      X_{\mathrm{SO_2}} = 0{,}057
      \qquad
      X_{\mathrm{SO_3}} = 0{,}943
      \qquad
      P_T = \frac{0{,}05493\cdot 0{,}082\cdot 353}{3{,}62} = \boxed{0{,}439\ \text{atm}}
      $$

      La colección da 0,05 y 0,95, que redondeadas desde 0,057 y 0,943
      deberían ser 0,06 y 0,94, y no da la presión total que pide el
      enunciado.

      **La coincidencia que no lo es.** La presión final es igual a la del SO₂
      en la mezcla de partida. Cada molécula de SO₂ acaba como SO₃ o se queda
      sin reaccionar, y el O₂ desaparece entero: al final hay tantos moles
      como SO₂ había al principio, en el mismo volumen y a la misma
      temperatura.

  - id: colfq4-p4-la-mezcla-que-quema-su-monoxido
    titulo: Una mezcla de cuatro gases que quema su monóxido en un recipiente cerrado
    fuente: >-
      Problema 4 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 22; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. La colección calcula con 3,33 mol, que dan su
      98,96 L y su 18,64 atm de N₂; sus O₂ y CO₂ quedan además un 0,7 %
      bajos, por un paso que no hemos podido reconstruir con seguridad. Todas
      caben en la tolerancia. La respuesta no marca el apartado b).
    nivel: practica
    enunciado: |
      Una mezcla gaseosa tiene la siguiente composición en volumen: dióxido de
      carbono: 10,5%, monóxido de carbono: 1,1%, oxígeno: 7,7% y nitrógeno:
      80,7%. Suponiendo comportamiento ideal: a) Calcular el volumen que
      ocupan 100 g de la mezcla gaseosa a 740 mm de Hg de presión y 80 °C de
      temperatura. b) Si la mezcla anterior se calienta a 150 °C en un
      recipiente de 5 L, para que se produzca la reacción, ¿cuáles serán las
      presiones parciales después de finalizada la reacción?
    pide: El volumen de 100 g de mezcla; y las presiones parciales tras quemarse el monóxido en 5 L a 150 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          La composición viene «en volumen». ¿Cómo se usa para pasar a moles?
        opciones:
          - texto: >-
              En un gas, el porcentaje en volumen es el porcentaje en moles:
              $X_{\mathrm{CO_2}} = 0{,}105$
            correcta: true
            mensaje: |
              Eso es. A la misma presión y temperatura, el volumen es
              proporcional a los moles (Avogadro), así que las fracciones en
              volumen son fracciones molares. Es lo que dice el tema del aire
              con un 21 % de O₂.
          - texto: >-
              Es el porcentaje en masa: de los 100 g, 10,5 g son de CO₂
            mensaje: |
              En masa sería otra cosa: el CO₂ pesa más por mol que el N₂, y su
              porcentaje en masa es mayor que en volumen. «En volumen» es en
              moles.
          - texto: >-
              Hay que convertir cada volumen a moles con $PV = nRT$
            mensaje: |
              No hay volúmenes de cada gas, sino porcentajes. Y como todos los
              gases de la mezcla están a la misma $P$ y $T$, el porcentaje en
              volumen ya es el porcentaje en moles.
          - texto: >-
              No sirve para nada hasta conocer la masa de cada gas
            mensaje: |
              Sirve para todo: da las fracciones molares, y con ellas la masa
              molar media de la mezcla y los moles de cada gas.

      - tipo: calcular
        titulo: La masa molar media
        pregunta: |
          ¿Cuánto vale la masa molar media de la mezcla?
        respuesta:
          tipo: numero
          valor: '29.99'
          tolerancia: 0.05
          formato: la masa molar en g/mol, con dos decimales
        distractores:
          - valor: '33.0'
            mensaje: |
              Has hecho la media simple de las cuatro masas molares, 44, 28, 32
              y 28. La media se pondera con la fracción de cada gas, y el 80,7 %
              es nitrógeno.
          - valor: '28.0'
            mensaje: |
              Has tomado toda la mezcla como si fuera nitrógeno. Es la mayor
              parte, pero el CO₂, más pesado, sube la media.
        pista: |
          $\overline{M} = \sum X_i M_i$, con 44, 28, 32 y 28 g/mol.
        desarrollo: |
          $$
          \overline{M} = 0{,}105\cdot 44 + 0{,}011\cdot 28 + 0{,}077\cdot 32 + 0{,}807\cdot 28 = 29{,}99\ \text{g/mol}
          $$

      - tipo: calcular
        titulo: El volumen de 100 g
        pregunta: |
          a) ¿Qué volumen ocupan 100 g de la mezcla a 740 mmHg y 80 °C?
        respuesta:
          tipo: magnitud
          valor: '99.1 L'
          tolerancia: 0.005
          formato: un volumen, con su unidad
        distractores:
          - valor: '0.1304 L'
            mensaje: |
              Has metido 740 como si fueran atmósferas. Con $R = 0{,}082$ la
              presión va en atm: $740/760 = 0{,}974$ atm.
          - valor: '22.47 L'
            mensaje: |
              Has puesto la temperatura en Celsius, 80. En $PV = nRT$ va en
              kelvin, 353 K.
          - valor: '106.2 L'
            mensaje: |
              Has calculado los moles con la masa molar del nitrógeno, 28, para
              toda la mezcla. Con la media, 29,99, hay algo menos de moles.
        pista: |
          $n = 100/29{,}99$, $P = 740/760$ atm y $T = 353$ K.
        desarrollo: |
          $$
          n = \frac{100}{29{,}99} = 3{,}335\ \text{mol}
          \qquad
          V = \frac{nRT}{P} = \frac{3{,}335\cdot 0{,}082\cdot 353}{740/760} = 99{,}1\ \text{L}
          $$

          La colección da 98,96 L, que es lo que sale redondeando los moles a
          3,33 y la presión a 0,974 atm. La diferencia es del 0,2 % y cabe en
          la tolerancia.

      - tipo: calcular
        titulo: El oxígeno que queda
        pregunta: |
          b) A 150 °C arde el monóxido,
          $\mathrm{CO} + \tfrac{1}{2}\,\mathrm{O_2} \rightarrow \mathrm{CO_2}$.
          ¿Cuál es la presión parcial del O₂ al final, en los 5 L?
        respuesta:
          tipo: magnitud
          valor: '1.654 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '1.781 atm'
            mensaje: |
              Es la del oxígeno sin reaccionar. El CO se quema y gasta O₂:
              medio mol por cada mol de CO.
          - valor: '1.527 atm'
            mensaje: |
              Has gastado un O₂ por cada CO. La reacción ajustada lleva medio:
              $\mathrm{CO} + \tfrac{1}{2}\mathrm{O_2}$. El oxígeno sobra de
              largo, y solo se va una parte pequeña.
          - valor: '0.5866 atm'
            mensaje: |
              Has puesto 150 en vez de 423 K. En $PV = nRT$ la temperatura va
              en kelvin.
        pista: |
          $n_{\mathrm{O_2}} = (0{,}077 - 0{,}011/2)\cdot 3{,}335$, y
          $P = nRT/V$ con $T = 423$ K y $V = 5$ L.
        desarrollo: |
          El CO, 0,0367 mol, es el limitante: el O₂ sobra. Se gastan 0,0183
          mol de O₂ y quedan

          $$
          n_{\mathrm{O_2}} = 0{,}2568 - 0{,}0183 = 0{,}2384\ \text{mol}
          \qquad
          P_{\mathrm{O_2}} = \frac{0{,}2384\cdot 0{,}082\cdot 423}{5} = 1{,}654\ \text{atm}
          $$

          La colección da 1,64 atm.

      - tipo: calcular
        titulo: El dióxido de carbono al final
        pregunta: |
          b) ¿Y la presión parcial del CO₂?
        respuesta:
          tipo: magnitud
          valor: '2.683 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '2.429 atm'
            mensaje: |
              Solo has contado el CO₂ de partida. El CO que arde también se
              convierte en CO₂: un mol por cada mol de CO.
          - valor: '0.9514 atm'
            mensaje: |
              Has puesto 150 en vez de 423 K.
        pista: |
          $n_{\mathrm{CO_2}} = (0{,}105 + 0{,}011)\cdot 3{,}335$.
        desarrollo: |
          $$
          n_{\mathrm{CO_2}} = 0{,}3501 + 0{,}0367 = 0{,}3868\ \text{mol}
          \qquad
          P_{\mathrm{CO_2}} = \frac{0{,}3868\cdot 0{,}082\cdot 423}{5} = 2{,}683\ \text{atm}
          $$

          La colección da 2,66 atm.

      - tipo: calcular
        titulo: El nitrógeno al final
        pregunta: |
          b) ¿Y la del N₂?
        respuesta:
          tipo: magnitud
          valor: '18.67 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.9417 atm'
            mensaje: |
              Has usado el volumen del apartado a, 99,1 L. En b) la mezcla está
              en un recipiente de 5 L.
          - valor: '6.621 atm'
            mensaje: |
              Has puesto 150 en vez de 423 K.
        pista: |
          El nitrógeno no reacciona: $n_{\mathrm{N_2}} = 0{,}807\cdot 3{,}335$.
        desarrollo: |
          $$
          n_{\mathrm{N_2}} = 0{,}807\cdot 3{,}335 = 2{,}691\ \text{mol}
          \qquad
          P_{\mathrm{N_2}} = \frac{2{,}691\cdot 0{,}082\cdot 423}{5} = 18{,}67\ \text{atm}
          $$

          La colección da 18,64 atm. La presión total es 23,0 atm: meter
          100 g de gas en 5 L tiene ese precio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La composición en volumen de un gas es su composición en moles.
          - texto: >-
              La masa molar media es 29,99 g/mol: 100 g son 3,335 mol, que a
              0,974 atm y 353 K ocupan 99,1 L.
          - texto: >-
              A 150 °C arde el CO: $\mathrm{CO} + \tfrac{1}{2}\mathrm{O_2} \rightarrow \mathrm{CO_2}$,
              y el CO es el limitante.
          - texto: >-
              Quedan 0,238 mol de O₂, 0,387 de CO₂ y 2,691 de N₂, que en 5 L y
              a 423 K dan 1,65, 2,68 y 18,67 atm.
          - texto: >-
              La presión parcial del nitrógeno baja al quemarse el CO, porque
              la reacción quita moles a la mezcla.
            trampa: true
            mensaje: |
              La reacción quita moles, pero no de nitrógeno: el N₂ no
              interviene. Su presión parcial solo depende de sus moles, del
              volumen y de la temperatura, y no cambia por lo que hagan los
              demás gases. Es lo que dice la ley de Dalton.
        veredicto: |
          En una mezcla que reacciona, cada gas se cuenta por separado en
          moles. Los que no reaccionan conservan los suyos.

    resolucion: |
      **a · El volumen de 100 g.** La composición en volumen es la
      composición en moles, así que la masa molar media es

      $$
      \overline{M} = 0{,}105\cdot 44 + 0{,}011\cdot 28 + 0{,}077\cdot 32 + 0{,}807\cdot 28 = 29{,}99\ \text{g/mol}
      $$

      $$
      n = \frac{100}{29{,}99} = 3{,}335\ \text{mol}
      \qquad
      V = \frac{3{,}335\cdot 0{,}082\cdot 353}{740/760} = \boxed{99{,}1\ \text{L}}
      $$

      La colección da 98,96 L, un 0,2 % menos: es lo que sale redondeando los
      moles a 3,33 y la presión a 0,974 atm.

      **b · La reacción.** El único gas que puede reaccionar con el oxígeno
      es el monóxido: $\mathrm{CO} + \tfrac{1}{2}\,\mathrm{O_2} \rightarrow \mathrm{CO_2}$.
      Hay 0,0367 mol de CO y 0,2568 de O₂: limita el CO, que se consume
      entero.

      | gas | antes (mol) | después (mol) | $P$ a 423 K en 5 L (atm) |
      |---|---|---|---|
      | CO₂ | 0,3501 | 0,3868 | 2,683 |
      | CO | 0,0367 | 0 | 0 |
      | O₂ | 0,2568 | 0,2384 | 1,654 |
      | N₂ | 2,691 | 2,691 | 18,67 |

      La colección da 1,64, 2,66 y 18,64 atm. Con sus 3,33 mol el N₂ sale
      exactamente 18,64; el O₂ y el CO₂ quedan además un 0,7 % por debajo, por
      un paso que no hemos podido reconstruir con seguridad. Las tres caben en
      la tolerancia.

      **Lo que conviene llevarse.** El nitrógeno, que es el 80 % de la mezcla,
      no pinta nada en la reacción, pero se lleva el 80 % de la presión. Y es
      exactamente el caso del reactor cerrado con aire que cae en los
      exámenes: se cuentan los moles de cada gas antes y después, y el
      nitrógeno se copia de una columna a la otra.

  - id: colfq4-p5-amoniaco-y-oxido-cuprico
    titulo: Amoniaco sobre óxido cúprico, y el agua que se condensa al enfriar
    fuente: >-
      Problema 5 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 23; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la respuesta final; el desarrollo es
      nuestro. En c) da P(N₂) = 0,18 atm, y es 0,22 atm, la misma que da ella
      misma en d): el vapor de agua no cambia la presión parcial del
      nitrógeno. El 0,18 coincide con 0,217 − 0,042, como si se hubiera
      restado el vapor.
    nivel: practica
    enunciado: |
      El amoniaco reacciona con óxido cúprico para formar cobre metálico, agua
      y nitrógeno gaseoso. Se introducen 10 L de amoniaco, a 40 °C y 780 mm de
      Hg, con 25 g de óxido cúprico. Se aumenta la temperatura a 300 °C y se
      recogen los productos de reacción en un recipiente de 12 L, a 300 °C.
      a) ¿Cuál será el reactivo limitante? b) Calcular las presiones parciales
      de cada uno de los componentes de la mezcla final. c) ¿Cuáles serían las
      presiones de los componentes de la mezcla final si se recogieran los
      productos de reacción en un recipiente de 12 L a 30 °C? Considerar
      despreciable el vapor de agua formado al enfriar la mezcla a 30 °C. d)
      Resolver la cuestión c) sin despreciar el vapor de agua formado.

      Presión de vapor del agua a 30 °C 31,8 mm de Hg.
    pide: El reactivo limitante; las presiones parciales a 300 °C; y a 30 °C, sin y con el vapor de agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la reacción ajustada?
        opciones:
          - texto: >-
              $2\,\mathrm{NH_3} + 3\,\mathrm{CuO} \rightarrow 3\,\mathrm{Cu} + 3\,\mathrm{H_2O} + \mathrm{N_2}$
            correcta: true
            mensaje: |
              Eso es. Dos nitrógenos a cada lado, seis hidrógenos, tres cobres
              y tres oxígenos. Cada CuO cede su oxígeno a dos hidrógenos del
              amoniaco, y los nitrógenos se juntan de dos en dos.
          - texto: >-
              $\mathrm{NH_3} + \mathrm{CuO} \rightarrow \mathrm{Cu} + \mathrm{H_2O} + \mathrm{N_2}$
            mensaje: |
              Sin ajustar: un nitrógeno a la izquierda y dos a la derecha, tres
              hidrógenos contra dos. Con esos coeficientes el limitante sale
              mal.
          - texto: >-
              $2\,\mathrm{NH_3} + 3\,\mathrm{CuO} \rightarrow 3\,\mathrm{Cu} + 3\,\mathrm{H_2O} + 2\,\mathrm{N}$
            mensaje: |
              El nitrógeno gaseoso es N₂, no átomos sueltos. Los átomos
              cuadran, pero el producto no es el que dice el enunciado.
          - texto: >-
              $2\,\mathrm{NH_3} + \mathrm{CuO} \rightarrow \mathrm{Cu} + 3\,\mathrm{H_2O} + \mathrm{N_2}$
            mensaje: |
              Los oxígenos no cuadran: uno a la izquierda y tres a la derecha.
              Cada agua necesita el oxígeno de un CuO, así que hacen falta tres.

      - tipo: calcular
        titulo: Los moles de amoniaco
        pregunta: |
          ¿Cuántos moles de NH₃ hay en los 10 L a 40 °C y 780 mmHg?
        respuesta:
          tipo: numero
          valor: '0.3999'
          tolerancia: 0.004
          formato: los moles, con tres decimales
        distractores:
          - valor: '303.9'
            mensaje: |
              Has puesto 780 como si fueran atmósferas. Con $R = 0{,}082$ la
              presión va en atm: $780/760 = 1{,}026$ atm.
          - valor: '3.129'
            mensaje: |
              Has puesto la temperatura en Celsius, 40. Va en kelvin: 313 K.
        pista: |
          $n = PV/RT$ con $P = 780/760$ atm y $T = 313$ K.
        desarrollo: |
          $$
          n_{\mathrm{NH_3}} = \frac{(780/760)\cdot 10}{0{,}082\cdot 313} = 0{,}400\ \text{mol}
          $$

      - tipo: calcular
        titulo: El amoniaco que necesitaría todo el óxido
        pregunta: |
          a) Los 25 g de CuO son 0,3145 mol. ¿Cuántos moles de NH₃ harían
          falta para que reaccionase todo?
        respuesta:
          tipo: numero
          valor: '0.2096'
          tolerancia: 0.003
          formato: los moles, con tres decimales
        distractores:
          - valor: '0.4717'
            mensaje: |
              Has multiplicado por 3/2 en vez de por 2/3. La reacción lleva 2
              NH₃ por cada 3 CuO: hace falta menos amoniaco que óxido.
          - valor: '0.3145'
            mensaje: |
              Has tomado uno a uno. La reacción ajustada pide 2 NH₃ por cada 3
              CuO.
        pista: |
          $n_{\mathrm{NH_3}} = \tfrac{2}{3}\,n_{\mathrm{CuO}}$.
        desarrollo: |
          $$
          n_{\mathrm{CuO}} = \frac{25}{79{,}5} = 0{,}3145\ \text{mol}
          \qquad
          \frac{2}{3}\cdot 0{,}3145 = 0{,}2096\ \text{mol de NH}_3
          $$

          Hay 0,400 mol, casi el doble: el amoniaco sobra y **el CuO es el
          limitante**, como da la colección. Sobran
          $0{,}3999 - 0{,}2096 = 0{,}1902$ mol de NH₃.

      - tipo: calcular
        titulo: El amoniaco que sobra, a 300 °C
        pregunta: |
          b) En los 12 L a 300 °C, ¿cuál es la presión parcial del NH₃ que
          sobra?
        respuesta:
          tipo: magnitud
          valor: '0.745 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '1.566 atm'
            mensaje: |
              Has puesto todo el amoniaco inicial. Parte ha reaccionado con el
              óxido: en la mezcla final solo queda el que sobra, 0,190 mol.
          - valor: '0.8938 atm'
            mensaje: |
              Has usado los 10 L del amoniaco. Los productos se recogen en un
              recipiente de 12 L.
        pista: |
          $P = nRT/V$ con $n = 0{,}1902$ mol, $T = 573$ K y $V = 12$ L.
        desarrollo: |
          $$
          P_{\mathrm{NH_3}} = \frac{0{,}1902\cdot 0{,}082\cdot 573}{12} = 0{,}745\ \text{atm}
          $$

          La colección da 0,74 atm.

      - tipo: calcular
        titulo: El agua, a 300 °C
        pregunta: |
          b) ¿Y la presión parcial del vapor de agua?
        respuesta:
          tipo: magnitud
          valor: '1.231 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.821 atm'
            mensaje: |
              Has puesto para el agua los moles del amoniaco que reacciona,
              2/3 del CuO. El agua sale 3 por cada 3 CuO: tantos moles como
              óxido.
          - valor: '2.463 atm'
            mensaje: |
              Has triplicado los moles de NH₃ que reaccionan. Por cada 2 NH₃
              salen 3 H₂O, no 6: el factor es 3/2.
        pista: |
          Se forman 3 H₂O por cada 3 CuO: $n_{\mathrm{H_2O}} = n_{\mathrm{CuO}}$.
        desarrollo: |
          $$
          P_{\mathrm{H_2O}} = \frac{0{,}3145\cdot 0{,}082\cdot 573}{12} = 1{,}231\ \text{atm}
          $$

          La colección da 1,23 atm.

      - tipo: calcular
        titulo: El nitrógeno, a 300 °C
        pregunta: |
          b) ¿Y la del N₂?
        respuesta:
          tipo: magnitud
          valor: '0.4104 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.783 atm'
            mensaje: |
              Has sacado el N₂ del amoniaco inicial, la mitad de 0,400 mol.
              Solo reacciona una parte del amoniaco: el nitrógeno sale del
              limitante, un N₂ por cada 3 CuO.
          - valor: '1.231 atm'
            mensaje: |
              Has puesto un N₂ por cada CuO. La reacción da un solo N₂ por cada
              tres CuO.
        pista: |
          $n_{\mathrm{N_2}} = n_{\mathrm{CuO}}/3$.
        desarrollo: |
          $$
          n_{\mathrm{N_2}} = \frac{0{,}3145}{3} = 0{,}1048\ \text{mol}
          \qquad
          P_{\mathrm{N_2}} = \frac{0{,}1048\cdot 0{,}082\cdot 573}{12} = 0{,}410\ \text{atm}
          $$

          La colección da 0,41 atm. La presión total a 300 °C es 2,39 atm.

      - tipo: calcular
        titulo: El nitrógeno, a 30 °C
        pregunta: |
          c) Recogiendo los productos en 12 L a 30 °C, con el agua condensada
          y su vapor despreciable, ¿cuál es la presión parcial del N₂?
        respuesta:
          tipo: magnitud
          valor: '0.217 atm'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.18 atm'
            mensaje: |
              Es la cifra que da la colección en c), y no sale: con 0,1048 mol
              en 12 L a 303 K son 0,217 atm, lo mismo que da la propia
              colección en d). El 0,18 coincide con restarle al nitrógeno el
              vapor de agua, 0,042 atm, y eso no se hace: cada gas tiene su
              presión parcial.
          - valor: '0.4104 atm'
            mensaje: |
              Es la de 300 °C. A 30 °C los mismos moles en el mismo volumen
              ejercen menos presión: $T$ baja de 573 a 303 K.
        pista: |
          Los moles de N₂ no cambian; solo la temperatura: 303 K.
        desarrollo: |
          $$
          P_{\mathrm{N_2}} = \frac{0{,}1048\cdot 0{,}082\cdot 303}{12} = 0{,}217\ \text{atm}
          \qquad
          P_{\mathrm{NH_3}} = \frac{0{,}1902\cdot 0{,}082\cdot 303}{12} = 0{,}394\ \text{atm}
          $$

          El agua, a 30 °C, se ha condensado. La colección da 0,39 atm para
          el NH₃ y 0,18 para el N₂; la segunda es una errata, porque en d) da
          0,22.

      - tipo: calcular
        titulo: El vapor de agua, a 30 °C
        pregunta: |
          d) Sin despreciar el vapor de agua, ¿cuál es su presión parcial a
          30 °C?
        respuesta:
          tipo: magnitud
          valor: '0.0418 atm'
          tolerancia: 0.05
          formato: una presión, con su unidad
        distractores:
          - valor: '0.651 atm'
            mensaje: |
              Has puesto toda el agua como gas, 0,3145 mol en 12 L a 303 K.
              Eso daría más presión que la de vapor, y el agua no puede estar
              como gas por encima de su presión de vapor: el resto se condensa.
          - valor: '31.8 atm'
            mensaje: |
              Son 31,8 **mmHg**, no atmósferas: $31{,}8/760 = 0{,}0418$ atm.
        pista: |
          Si hay agua líquida, el vapor está a su presión de vapor.
        desarrollo: |
          Toda el agua como gas daría 0,651 atm, muy por encima de los 31,8
          mmHg de su presión de vapor a 30 °C. Así que casi toda se condensa,
          y el vapor que queda está en equilibrio con el líquido:

          $$
          P_{\mathrm{H_2O}} = \frac{31{,}8}{760} = 0{,}0418\ \text{atm}
          $$

          Las otras dos no cambian: 0,394 atm de NH₃ y 0,217 de N₂. La
          colección da 0,04, 0,39 y 0,22.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $2\,\mathrm{NH_3} + 3\,\mathrm{CuO} \rightarrow 3\,\mathrm{Cu} + 3\,\mathrm{H_2O} + \mathrm{N_2}$,
              y el CuO, 0,3145 mol, pide solo 0,210 mol de los 0,400 de NH₃: es
              el limitante.
          - texto: >-
              En la mezcla final hay 0,190 mol de NH₃, 0,3145 de H₂O y 0,105
              de N₂; el cobre es sólido.
          - texto: >-
              A 300 °C en 12 L: 0,745, 1,231 y 0,410 atm.
          - texto: >-
              A 30 °C el agua se condensa; NH₃ y N₂ bajan a 0,394 y 0,217 atm, y
              el vapor, si no se desprecia, está a 31,8 mmHg, 0,042 atm.
          - texto: >-
              Al tener en cuenta el vapor de agua en d), la presión del
              nitrógeno baja, porque el vapor ocupa parte del recipiente.
            trampa: true
            mensaje: |
              En una mezcla de gases cada uno ocupa el recipiente entero y
              ejerce su presión como si estuviera solo. El vapor de agua suma
              su presión a la total, pero no le quita nada al nitrógeno: 0,217
              atm con vapor y sin él.
        veredicto: |
          El sólido no cuenta, el líquido tampoco, y el vapor de un líquido
          presente vale su presión de vapor: ni más ni menos.

    resolucion: |
      **a · El limitante.** Con la reacción ajustada,

      $$
      2\,\mathrm{NH_3} + 3\,\mathrm{CuO} \rightarrow 3\,\mathrm{Cu} + 3\,\mathrm{H_2O} + \mathrm{N_2}
      $$

      hay $n_{\mathrm{NH_3}} = \frac{(780/760)\cdot 10}{0{,}082\cdot 313} = 0{,}400$ mol
      y $n_{\mathrm{CuO}} = 25/79{,}5 = 0{,}3145$ mol. Todo el óxido pide
      $\tfrac{2}{3}\cdot 0{,}3145 = 0{,}210$ mol de NH₃, y hay casi el doble:
      **limita el CuO**.

      **b · A 300 °C, en 12 L.** El cobre es sólido y no cuenta.

      | | moles | $P$ a 573 K (atm) | $P$ a 303 K (atm) |
      |---|---|---|---|
      | NH₃ que sobra | 0,1902 | 0,745 | 0,394 |
      | H₂O | 0,3145 | 1,231 | condensada; 0,042 si no se desprecia |
      | N₂ | 0,1048 | 0,410 | 0,217 |

      **c y d · A 30 °C.** Toda el agua como gas daría 0,651 atm, y su
      presión de vapor a 30 °C es solo 31,8 mmHg = 0,042 atm: casi toda se
      condensa. En c) se desprecia el vapor; en d) se suma su presión de
      vapor. Las presiones del NH₃ y del N₂ son las mismas en los dos
      apartados, porque el vapor no le quita presión a nadie.

      **La errata.** La colección da en c) P(N₂) = 0,18 atm y en d) 0,22. No
      pueden ser distintas: en d) solo se añade un gas más. La buena es 0,22;
      el 0,18 coincide con 0,217 − 0,042, como si se hubiera restado el
      vapor.

      **Lo que deja este problema**, y que cae en los exámenes de reactor
      cerrado: los productos se cuentan en moles, el sólido se queda fuera, y
      el agua, al enfriar, deja de ser un gas más: su presión la fija la
      presión de vapor.

  - id: colfq4-p6-el-amoniaco-de-dos-gases-medidos-distinto
    titulo: Amoniaco a partir de dos gases medidos en condiciones distintas
    fuente: >-
      Problema 6 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 23; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la respuesta final, 27,22 L; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Se mezclan 20 L de nitrógeno a presión de 1 atm y 100 °C con 10 L de
      hidrógeno a presión de 5 atm y 200 °C, los cuales reaccionan según la
      reacción:

      $$
      \mathrm{N_2(g)} + 3\,\mathrm{H_2(g)} \longrightarrow 2\,\mathrm{NH_3(g)}
      $$

      ¿Qué volumen de amoniaco se formará a 2 atm de presión y 500 °C?
    pide: El volumen de amoniaco formado, medido a 2 atm y 500 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción dice «1 volumen de N₂ con 3 de H₂». ¿Se puede aplicar a
          los 20 L y 10 L del enunciado?
        opciones:
          - texto: >-
              No: están medidos a presiones y temperaturas distintas, así que
              hay que pasar cada uno a moles
            correcta: true
            mensaje: |
              Eso es. La proporción en volúmenes solo vale si los gases están a
              la misma $P$ y $T$ (Avogadro). Aquí el hidrógeno está a 5 atm:
              sus 10 L tienen muchos más moles de los que aparentan.
          - texto: >-
              Sí: 10 L de H₂ son menos de lo que piden 20 L de N₂, así que
              salen $\tfrac{2}{3}\cdot 10$ L de amoniaco
            mensaje: |
              Eso sumaría volúmenes medidos en condiciones distintas, que es
              el error del tema. Y además el amoniaco se mide a otra presión y
              otra temperatura: esos 6,7 L no significan nada.
          - texto: >-
              Sí, pero primero hay que sumar los dos volúmenes: 30 L de mezcla
            mensaje: |
              Los volúmenes de gases medidos en condiciones distintas no se
              suman. Se pasa cada uno a moles con **sus** condiciones, y es en
              moles donde se opera.
          - texto: >-
              Solo si se pasan los dos a condiciones normales con 22,4 L/mol
            mensaje: |
              Pasarlos a las mismas condiciones sí arreglaría la comparación,
              pero no hace falta ir a condiciones normales: con
              $n = PV/RT$ para cada uno ya se pueden comparar.

      - tipo: calcular
        titulo: Los moles de nitrógeno
        pregunta: |
          ¿Cuántos moles de N₂ hay en 20 L a 1 atm y 100 °C?
        respuesta:
          tipo: numero
          valor: '0.6539'
          tolerancia: 0.006
          formato: los moles, con tres decimales
        distractores:
          - valor: '2.439'
            mensaje: |
              Has puesto la temperatura en Celsius, 100. Va en kelvin: 373 K.
          - valor: '0.8929'
            mensaje: |
              Has usado 22,4 L/mol, que es el volumen molar a 0 °C. El
              nitrógeno está a 100 °C, y un mol ocupa más: 30,6 L.
        pista: |
          $n = PV/RT$ con $T = 373$ K.
        desarrollo: |
          $$
          n_{\mathrm{N_2}} = \frac{1\cdot 20}{0{,}082\cdot 373} = 0{,}654\ \text{mol}
          $$

      - tipo: calcular
        titulo: Los moles de hidrógeno
        pregunta: |
          ¿Y cuántos moles de H₂ hay en 10 L a 5 atm y 200 °C?
        respuesta:
          tipo: numero
          valor: '1.289'
          tolerancia: 0.01
          formato: los moles, con tres decimales
        distractores:
          - valor: '0.2578'
            mensaje: |
              Te has dejado la presión: el hidrógeno está a 5 atm, no a 1.
              Cinco veces más presión en el mismo volumen son cinco veces más
              moles.
          - valor: '1.635'
            mensaje: |
              Has usado la temperatura del nitrógeno, 373 K. El hidrógeno está
              a 200 °C, 473 K: cada gas con sus condiciones.
        pista: |
          $n = PV/RT$ con $P = 5$ atm y $T = 473$ K.
        desarrollo: |
          $$
          n_{\mathrm{H_2}} = \frac{5\cdot 10}{0{,}082\cdot 473} = 1{,}289\ \text{mol}
          $$

          El N₂ necesitaría $3\cdot 0{,}654 = 1{,}962$ mol de H₂, y solo hay
          1,289: **limita el hidrógeno**, aunque su volumen sea la mitad.

      - tipo: calcular
        titulo: El volumen de amoniaco
        pregunta: |
          ¿Qué volumen ocupa el amoniaco formado a 2 atm y 500 °C?
        respuesta:
          tipo: magnitud
          valor: '27.2 L'
          tolerancia: 0.004
          formato: un volumen, con su unidad
        distractores:
          - valor: '41.45 L'
            mensaje: |
              Has hecho reaccionar todo el nitrógeno, $2\cdot 0{,}654$ mol de
              NH₃. Pero para eso harían falta 1,96 mol de H₂, y solo hay 1,289:
              el limitante es el hidrógeno.
          - valor: '6.667 L'
            mensaje: |
              Has trabajado con volúmenes, $\tfrac{2}{3}\cdot 10$ L. Los gases
              están medidos en condiciones distintas, y el amoniaco en otras:
              hay que pasar por moles.
          - valor: '17.62 L'
            mensaje: |
              Has puesto 500 en vez de 773 K en $V = nRT/P$.
        pista: |
          $n_{\mathrm{NH_3}} = \tfrac{2}{3}\,n_{\mathrm{H_2}}$, y $V = nRT/P$ con
          $T = 773$ K y $P = 2$ atm.
        desarrollo: |
          $$
          n_{\mathrm{NH_3}} = \frac{2}{3}\cdot 1{,}289 = 0{,}8594\ \text{mol}
          \qquad
          V = \frac{0{,}8594\cdot 0{,}082\cdot 773}{2} = 27{,}2\ \text{L}
          $$

          La colección da 27,22 L.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos gases están medidos en condiciones distintas: cada uno se
              pasa a moles con las suyas.
          - texto: >-
              Hay 0,654 mol de N₂ y 1,289 de H₂.
          - texto: >-
              El N₂ pediría 1,962 mol de H₂: el limitante es el hidrógeno.
          - texto: >-
              Se forman $\tfrac{2}{3}\cdot 1{,}289 = 0{,}859$ mol de NH₃, que a 2
              atm y 773 K ocupan 27,2 L.
          - texto: >-
              Como hay 20 L de nitrógeno y solo 10 de hidrógeno, el limitante es
              el hidrógeno por tener menos volumen.
            trampa: true
            mensaje: |
              La conclusión es buena y el motivo no. El volumen no mide la
              cantidad cuando las condiciones son distintas: los 10 L de H₂, a
              5 atm, tienen el doble de moles que los 20 L de N₂. El hidrógeno
              limita porque la reacción pide **tres** por cada nitrógeno.
        veredicto: |
          Con gases en condiciones distintas, el volumen no dice nada hasta
          pasarlo a moles.

    resolucion: |
      **Por qué no se puede operar en volúmenes.** La reacción da la
      proporción en volúmenes solo para gases a la misma presión y
      temperatura. Aquí el nitrógeno está a 1 atm y 100 °C, el hidrógeno a 5
      atm y 200 °C, y el amoniaco se mide a 2 atm y 500 °C. Es el error típico
      del tema: cada gas se pasa a moles con **sus** condiciones.

      $$
      n_{\mathrm{N_2}} = \frac{1\cdot 20}{0{,}082\cdot 373} = 0{,}654\ \text{mol}
      \qquad
      n_{\mathrm{H_2}} = \frac{5\cdot 10}{0{,}082\cdot 473} = 1{,}289\ \text{mol}
      $$

      **El limitante.** Todo el N₂ pediría $3\cdot 0{,}654 = 1{,}962$ mol de
      H₂: no hay tanto. Limita el hidrógeno, aunque en volumen parezca poco y
      en moles sea el doble que el nitrógeno.

      $$
      n_{\mathrm{NH_3}} = \frac{2}{3}\cdot 1{,}289 = 0{,}859\ \text{mol}
      \qquad
      V = \frac{0{,}859\cdot 0{,}082\cdot 773}{2} = \boxed{27{,}2\ \text{L}}
      $$

      Coincide con la colección, 27,22 L.

      **La trampa, en números.** Operando en volúmenes, «10 L de H₂ dan
      2/3·10 L de NH₃», saldrían 6,7 L. El resultado real es cuatro veces
      mayor, porque el hidrógeno estaba comprimido y el amoniaco se mide
      caliente y a solo 2 atm.

  - id: colfq4-p7-el-matraz-que-se-calienta-y-reacciona
    titulo: El matraz de 5 L que se calienta, y el monóxido que se quema dentro
    fuente: >-
      Problema 7 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 24; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la respuesta final; el desarrollo es
      nuestro.
    nivel: practica
    enunciado: |
      En un matraz de 5 L se introducen 1,4 g de monóxido de carbono, 3,2 g de
      oxígeno y 5,6 g de nitrógeno a 27 °C. a) Calcular la presión total y las
      presiones parciales de cada uno de los componentes. b) Si se calienta la
      mezcla a 200 °C, temperatura a la cual el monóxido de carbono reacciona
      con el oxígeno tanto como le es posible ¿Cuáles serán las presiones
      parciales de cada uno de los gases componentes de la mezcla?
    pide: La presión total y las parciales a 27 °C; y las parciales a 200 °C, tras quemarse el monóxido.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b), «el monóxido reacciona con el oxígeno tanto como le es
          posible». ¿Qué quiere decir?
        opciones:
          - texto: >-
              Que la reacción $2\,\mathrm{CO} + \mathrm{O_2} \rightarrow 2\,\mathrm{CO_2}$
              avanza hasta que se acaba el limitante
            correcta: true
            mensaje: |
              Eso es: reacción completa. Hay que ver quién limita, y aquí es el
              CO: 0,05 mol piden solo 0,025 de O₂, y hay 0,1.
          - texto: >-
              Que reacciona todo el oxígeno
            mensaje: |
              El oxígeno sobra: hay 0,1 mol y el CO, con 0,05, solo puede gastar
              0,025. Lo que se agota es el monóxido.
          - texto: >-
              Que reacciona la mitad de cada uno
            mensaje: |
              «Tanto como le es posible» es hasta que se acaba uno de los dos,
              no a medias. Y las cantidades que se gastan las fija la reacción
              ajustada, no un reparto a partes iguales.
          - texto: >-
              Que también reacciona el nitrógeno
            mensaje: |
              El enunciado solo habla del monóxido con el oxígeno. El
              nitrógeno está de acompañante: sus moles no cambian.

      - tipo: calcular
        titulo: La presión total a 27 °C
        pregunta: |
          a) ¿Cuánto vale la presión total en el matraz a 27 °C?
        respuesta:
          tipo: magnitud
          valor: '1.722 atm'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '0.155 atm'
            mensaje: |
              Has puesto la temperatura en Celsius, 27. Va en kelvin: 300 K.
          - valor: '2.214 atm'
            mensaje: |
              Has tomado 16 g/mol para el oxígeno, como si fuera atómico. El
              oxígeno gas es O₂, 32 g/mol: 3,2 g son 0,1 mol, no 0,2.
        pista: |
          Moles: $1{,}4/28$ de CO, $3{,}2/32$ de O₂ y $5{,}6/28$ de N₂. Después,
          $P = nRT/V$ con $T = 300$ K.
        desarrollo: |
          $$
          n_T = 0{,}05 + 0{,}1 + 0{,}2 = 0{,}35\ \text{mol}
          \qquad
          P_T = \frac{0{,}35\cdot 0{,}082\cdot 300}{5} = 1{,}722\ \text{atm}
          $$

          Con $RT/V = 4{,}92$ atm/mol, las parciales son
          $P_{\mathrm{CO}} = 0{,}246$, $P_{\mathrm{O_2}} = 0{,}492$ y
          $P_{\mathrm{N_2}} = 0{,}984$ atm. La colección da 0,25, 0,49, 0,98 y
          1,72.

      - tipo: calcular
        titulo: El oxígeno que queda, a 200 °C
        pregunta: |
          b) Tras la reacción, a 200 °C, ¿cuál es la presión parcial del O₂?
        respuesta:
          tipo: magnitud
          valor: '0.5818 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.7757 atm'
            mensaje: |
              Es la del oxígeno sin reaccionar, solo calentado. Al quemarse, el
              CO gasta medio mol de O₂ por cada mol suyo.
          - valor: '0.3879 atm'
            mensaje: |
              Has gastado un O₂ por cada CO. La reacción es
              $2\,\mathrm{CO} + \mathrm{O_2}$: medio O₂ por CO.
        pista: |
          Se gastan $0{,}05/2 = 0{,}025$ mol de O₂; quedan 0,075. A 473 K,
          $RT/V = 7{,}757$ atm/mol.
        desarrollo: |
          $$
          n_{\mathrm{O_2}} = 0{,}1 - 0{,}025 = 0{,}075\ \text{mol}
          \qquad
          P_{\mathrm{O_2}} = \frac{0{,}075\cdot 0{,}082\cdot 473}{5} = 0{,}582\ \text{atm}
          $$

          La colección da 0,58 atm.

      - tipo: calcular
        titulo: El dióxido de carbono formado
        pregunta: |
          b) ¿Y la presión parcial del CO₂?
        respuesta:
          tipo: magnitud
          valor: '0.3879 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '0.1939 atm'
            mensaje: |
              Has puesto tanto CO₂ como O₂ gastado. La reacción da un CO₂ por
              cada CO: 0,05 mol, no 0,025.
          - valor: '0.246 atm'
            mensaje: |
              Los moles están bien, pero con la temperatura de antes, 300 K. La
              mezcla está ahora a 473 K.
        pista: |
          Se forma un CO₂ por cada CO: 0,05 mol.
        desarrollo: |
          $$
          P_{\mathrm{CO_2}} = \frac{0{,}05\cdot 0{,}082\cdot 473}{5} = 0{,}388\ \text{atm}
          $$

          La colección da 0,39 atm. El N₂, que no reacciona, pasa a
          $0{,}2\cdot 7{,}757 = 1{,}551$ atm, y la colección da 1,55.

      - tipo: calcular
        titulo: La presión total a 200 °C
        pregunta: |
          b) ¿Cuánto vale la presión total al final?
        respuesta:
          tipo: magnitud
          valor: '2.521 atm'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '2.715 atm'
            mensaje: |
              Es la de la mezcla calentada sin reaccionar: 0,35 mol a 473 K. La
              reacción quita moles de gas: tres se convierten en dos.
          - valor: '2.327 atm'
            mensaje: |
              Te salen 0,30 mol, el O₂ de partida más el N₂: has quitado el CO
              sin poner el CO₂ que forma ni restar el O₂ que gasta. El CO se
              convierte en CO₂ mol a mol; lo que se pierde es el O₂ gastado,
              0,025 mol.
        pista: |
          Moles finales: $0{,}075 + 0{,}05 + 0{,}2$.
        desarrollo: |
          $$
          n_T = 0{,}075 + 0{,}05 + 0{,}2 = 0{,}325\ \text{mol}
          \qquad
          P_T = 0{,}325\cdot 7{,}757 = 2{,}521\ \text{atm}
          $$

          La colección da 2,52 atm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay 0,05 mol de CO, 0,1 de O₂ y 0,2 de N₂, que a 300 K en 5 L dan
              1,722 atm en total.
          - texto: >-
              A 200 °C se quema el CO:
              $2\,\mathrm{CO} + \mathrm{O_2} \rightarrow 2\,\mathrm{CO_2}$, y
              el CO es el limitante.
          - texto: >-
              Quedan 0,075 mol de O₂, se forman 0,05 de CO₂ y el N₂ sigue con
              0,2.
          - texto: >-
              A 473 K las parciales son 0,582, 0,388 y 1,551 atm, y la total
              2,521.
          - texto: >-
              La presión total sube de 1,72 a 2,52 atm porque la reacción
              produce más moles de gas de los que gasta.
            trampa: true
            mensaje: |
              Es al revés: la reacción gasta tres moles de gas (dos de CO y
              uno de O₂) y produce dos. La presión sube porque la temperatura
              pasa de 300 a 473 K; sin reacción habría llegado a 2,715 atm.
        veredicto: |
          Dos efectos a la vez: calentar sube la presión y la reacción la baja.
          Para separarlos, se cuentan los moles.

    resolucion: |
      **a · A 27 °C.** Los moles de cada gas y $RT/V = 0{,}082\cdot 300/5 = 4{,}92$ atm/mol:

      | gas | $n$ (mol) | $P$ a 300 K (atm) |
      |---|---|---|
      | CO | 1,4/28 = 0,05 | 0,246 |
      | O₂ | 3,2/32 = 0,1 | 0,492 |
      | N₂ | 5,6/28 = 0,2 | 0,984 |
      | total | 0,35 | 1,722 |

      **b · A 200 °C, tras la reacción.**
      $2\,\mathrm{CO} + \mathrm{O_2} \rightarrow 2\,\mathrm{CO_2}$. El CO se
      agota: gasta 0,025 mol de O₂ y forma 0,05 de CO₂. Con
      $RT/V = 0{,}082\cdot 473/5 = 7{,}757$ atm/mol:

      | gas | $n$ (mol) | $P$ a 473 K (atm) |
      |---|---|---|
      | O₂ | 0,075 | 0,582 |
      | CO₂ | 0,05 | 0,388 |
      | N₂ | 0,2 | 1,551 |
      | total | 0,325 | $\boxed{2{,}521}$ |

      Todas coinciden con la colección: 0,25, 0,49, 0,98 y 1,72 atm en a);
      0,58, 0,39, 1,55 y 2,52 en b).

      **Los dos efectos.** La presión total sube, y no por la reacción: la
      reacción quita 0,025 mol de gas. Sube porque la temperatura pasa de 300
      a 473 K. Sin reaccionar, la mezcla habría llegado a 2,715 atm; la
      reacción la deja en 2,521.

  - id: colfq4-p8-el-recipiente-que-se-vacia-a-medias
    titulo: Un recipiente de 2 L que se llena a presión y se vacía a medias
    fuente: >-
      Problema 8 · Problemas propuestos de estequiometría y reactivo limitante
      en estado gaseoso, tema 4.2 (lámina 24; apuntes, págs. 101-102) ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU) · La colección publica la respuesta final; el desarrollo es
      nuestro.
    nivel: practica
    enunciado: |
      En un recipiente de 2 L de capacidad se recogen 5 L de oxígeno medidos a
      la presión de 2 atm y 10 L de nitrógeno a la presión de 4 atm. Se dejan
      salir 25 L de mezcla gaseosa a la presión de 1 atm. Calcular: a) La
      presión final en el recipiente. b) La masa de oxígeno y nitrógeno
      contenidos al final en el recipiente. La temperatura se ha mantenido
      constante a 25 °C.
    pide: La presión final en el recipiente y las masas de oxígeno y nitrógeno que quedan.

    pasos:
      - tipo: reconocer
        pregunta: |
          Todo pasa a 25 °C. ¿Qué magnitud permite sumar y restar gases que
          están a presiones y volúmenes distintos?
        opciones:
          - texto: >-
              El producto $P\cdot V$, que a temperatura constante es
              proporcional a los moles
            correcta: true
            mensaje: |
              Eso es. $PV = nRT$ con $T$ fija: $PV$ mide la cantidad de gas.
              5 L a 2 atm son 10 atm·L de oxígeno, 10 L a 4 atm son 40 de
              nitrógeno, y 25 L a 1 atm son 25 atm·L que se van.
          - texto: >-
              El volumen: se suman los litros que entran y se restan los que
              salen
            mensaje: |
              Los litros de gases a presiones distintas no se pueden sumar: 5 L
              a 2 atm no son la misma cantidad de gas que 5 L a 4 atm. Además,
              meter 15 L en un recipiente de 2 no tendría sentido.
          - texto: >-
              La presión: se suman las presiones de los dos gases
            mensaje: |
              Cada presión es la de un volumen distinto. Dentro del recipiente
              de 2 L las presiones son otras: 5 y 20 atm.
          - texto: >-
              Ninguna: hay que calcular los moles de cada gas con $PV = nRT$
            mensaje: |
              Se puede, y da lo mismo, pero no hace falta: como $R$ y $T$ son
              los mismos para todos, se puede trabajar con $PV$, y los moles solo se
              necesitan al final para las masas.

      - tipo: calcular
        titulo: La presión antes de dejar salir nada
        pregunta: |
          Con los dos gases dentro de los 2 L, ¿cuál es la presión total?
        respuesta:
          tipo: magnitud
          valor: '25 atm'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '6 atm'
            mensaje: |
              Has sumado las presiones de partida, 2 + 4. Pero cada gas cambia
              de volumen al meterlo en el recipiente: el oxígeno pasa de 5 L a
              2 L y el nitrógeno de 10 L a 2 L, y sus presiones suben.
          - valor: '3 atm'
            mensaje: |
              Has hecho la media de las dos presiones de partida. Lo que se
              suma son las presiones parciales dentro del recipiente, 5 y 20
              atm.
        pista: |
          Boyle para cada gas: $P = P_0V_0/2$.
        desarrollo: |
          $$
          P_{\mathrm{O_2}} = \frac{2\cdot 5}{2} = 5\ \text{atm}
          \qquad
          P_{\mathrm{N_2}} = \frac{4\cdot 10}{2} = 20\ \text{atm}
          \qquad
          P_T = 25\ \text{atm}
          $$

          El oxígeno es la quinta parte de la mezcla: $X_{\mathrm{O_2}} = 0{,}2$.

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          a) Tras dejar salir 25 L de mezcla medidos a 1 atm, ¿cuál es la
          presión en el recipiente?
        respuesta:
          tipo: magnitud
          valor: '12.5 atm'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '0 atm'
            mensaje: |
              Has restado los 25 L de las 25 atm, como si fueran lo mismo. Lo
              que sale son 25 atm·L de gas, y en un recipiente de 2 L eso
              equivale a 12,5 atm.
          - valor: '24 atm'
            mensaje: |
              Has restado solo 1 atm, la presión a la que se miden los gases
              que salen. Lo que sale es la cantidad de 25 L a 1 atm, que en 2 L
              ocuparía a 12,5 atm.
          - valor: '25 atm'
            mensaje: |
              Es la de antes de abrir. Al dejar salir gas, la presión baja.
        pista: |
          $P_{\text{final}}\cdot 2 = 25\cdot 2 - 1\cdot 25$.
        desarrollo: |
          $$
          P_{\text{final}}\cdot 2 = 50 - 25
          \quad\Longrightarrow\quad
          P_{\text{final}} = 12{,}5\ \text{atm}
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: La masa de oxígeno que queda
        pregunta: |
          b) ¿Cuántos gramos de oxígeno quedan en el recipiente?
        respuesta:
          tipo: magnitud
          valor: '6.55 g'
          tolerancia: 0.004
          formato: una masa, con su unidad
        distractores:
          - valor: '13.10 g'
            mensaje: |
              Es todo el oxígeno que se metió. Con la mezcla que sale se va la
              mitad del gas, y el oxígeno con ella, en la misma proporción.
          - valor: '16.37 g'
            mensaje: |
              Has repartido los moles finales a medias entre los dos gases. La
              mezcla es un 20 % de oxígeno y un 80 % de nitrógeno, y lo que sale
              tiene esa misma composición.
        pista: |
          $n_{\text{final}} = 12{,}5\cdot 2/(0{,}082\cdot 298)$, y el 20 % es
          oxígeno.
        desarrollo: |
          $$
          n_{\text{final}} = \frac{12{,}5\cdot 2}{0{,}082\cdot 298} = 1{,}023\ \text{mol}
          \qquad
          m_{\mathrm{O_2}} = 0{,}2\cdot 1{,}023\cdot 32 = 6{,}55\ \text{g}
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: La masa de nitrógeno que queda
        pregunta: |
          b) ¿Y de nitrógeno?
        respuesta:
          tipo: magnitud
          valor: '22.92 g'
          tolerancia: 0.004
          formato: una masa, con su unidad
        distractores:
          - valor: '45.83 g'
            mensaje: |
              Es todo el nitrógeno que se metió. La mitad del gas ha salido, y
              el nitrógeno con él.
          - valor: '11.46 g'
            mensaje: |
              Has usado 14 g/mol, la masa del átomo. El nitrógeno gas es N₂, 28
              g/mol.
        pista: |
          El 80 % de los moles finales, a 28 g/mol.
        desarrollo: |
          $$
          m_{\mathrm{N_2}} = 0{,}8\cdot 1{,}023\cdot 28 = 22{,}92\ \text{g}
          $$

          La colección da 22,91 g; con $R = 0{,}08206$ y $T = 298{,}15$ K
          saldría 22,89. La diferencia es de redondeo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A temperatura constante, $PV$ mide la cantidad de gas: entran 10
              atm·L de O₂ y 40 de N₂.
          - texto: >-
              En los 2 L eso son 5 y 20 atm: 25 atm en total, con un 20 % de
              oxígeno.
          - texto: >-
              Salen 25 atm·L de mezcla, la mitad: la presión baja a 12,5 atm.
          - texto: >-
              Quedan 1,023 mol con la misma composición: 6,55 g de O₂ y 22,92 g
              de N₂.
          - texto: >-
              Al salir la mezcla, se escapa antes el oxígeno, que está a menos
              presión, y dentro queda más nitrógeno.
            trampa: true
            mensaje: |
              La mezcla es homogénea: lo que sale tiene la misma composición
              que lo que queda, un 20 % de oxígeno. Ningún gas «escapa antes»
              por tener menos presión parcial; cada uno sale en proporción a
              sus moles.
        veredicto: |
          A temperatura constante, $P\cdot V$ se suma y se resta como si fueran
          moles. Y lo que sale de una mezcla lleva su misma composición.

    resolucion: |
      **La cantidad de gas, en atm·L.** Con la temperatura fija, $PV = nRT$
      hace que $PV$ sea proporcional a los moles, y se puede sumar y restar:

      | | $P\cdot V$ (atm·L) |
      |---|---|
      | entra O₂: 5 L a 2 atm | 10 |
      | entra N₂: 10 L a 4 atm | 40 |
      | sale mezcla: 25 L a 1 atm | −25 |
      | queda | 25 |

      **a · La presión final.** Los 25 atm·L que quedan están en 2 L:

      $$
      P_{\text{final}} = \frac{25}{2} = \boxed{12{,}5\ \text{atm}}
      $$

      **b · Las masas.** La mezcla que sale tiene la misma composición que la
      que queda, un 20 % de O₂ y un 80 % de N₂ (10 y 40 de 50 atm·L):

      $$
      n_{\text{final}} = \frac{12{,}5\cdot 2}{0{,}082\cdot 298} = 1{,}023\ \text{mol}
      \qquad
      m_{\mathrm{O_2}} = 0{,}2\cdot 1{,}023\cdot 32 = \boxed{6{,}55\ \text{g}}
      \qquad
      m_{\mathrm{N_2}} = 0{,}8\cdot 1{,}023\cdot 28 = \boxed{22{,}92\ \text{g}}
      $$

      Coinciden con la colección: 12,5 atm, 6,55 g y 22,91 g.

      **El atajo que conviene tener.** Este problema no pide ningún mol hasta
      el final. Cuando todo está a la misma temperatura, $P\cdot V$ es la
      cantidad de gas, y los recipientes se llenan y se vacían sumando y
      restando atm·L.

  - id: colfq4-resuelto-el-propilenglicol-anticongelante
    titulo: El propilenglicol anticongelante, del punto de congelación al volumen
    fuente: >-
      Problema resuelto · Propiedades coligativas de las soluciones, tema
      4.2.8 (lámina 83) · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material publica la
      resolución, que da 394,3 mL y 102,74 °C; el diagnóstico de los errores
      es nuestro. Sus constantes se llaman Kf y Kb: el tema las escribe Kc y
      Ke.
    nivel: practica
    enunciado: |
      La mayoría de los anticongelantes son compuestos químicos que se añaden
      al agua de modo que el punto de congelación de lla mezcla sea inferior a
      la temperatura más baja que pueda sufrir el sistema. Además, estos
      compuestos también consiguen que la temperatura de ebullición aumente.
      El propilenglicol (1,2-propanodiol) es uno de los compuestos
      anticongelantes más habituales. Calcula:

      a) El volumen de propilenglicol (C₃H₈O₂) que hay que añadir por cada
      litro de agua, para que la temperatura de congelación de la mezcla sea
      de -10 °C (P = 1 atm).

      b) ¿A qué temperatura empezará a hervir la mezcla preparada (P = 1 atm)?

      - ρ propilenglicol (20 °C) = 1,0361 g/mL
      - ρ agua (20 °C) = 0,9983 g/mL
      - $K_f$ agua = 1,86 °C/molal
      - $K_b$ agua = 0,51 °C/molal

      *«de lla mezcla» es una errata del original por «de la mezcla».*
    pide: El volumen de propilenglicol por litro de agua que congela a −10 °C, y la temperatura a la que hierve esa mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se quiere que congele a −10 °C. ¿Qué concentración fija eso?
        opciones:
          - texto: >-
              La molalidad, por $\Delta T_c = K_c\,m$: hacen falta
              $10/1{,}86$ moles de soluto por kilo de agua
            correcta: true
            mensaje: |
              Eso es. El descenso del punto de congelación es coligativo:
              depende de cuántas partículas hay por kilo de disolvente, y de la
              naturaleza del soluto solo a través de su masa molar, cuando se
              pasa a gramos.
          - texto: >-
              La molaridad, porque se pide un volumen
            mensaje: |
              El volumen es la respuesta final, pero la fórmula del descenso
              crioscópico va con molalidad, moles por kilo de **disolvente**.
              Por eso el problema da la densidad del agua.
          - texto: >-
              La fracción molar, como en la ley de Raoult
            mensaje: |
              La fracción molar es la del descenso de la presión de vapor. Para
              el punto de congelación y el de ebullición, molalidad.
          - texto: >-
              Ninguna: depende de qué soluto sea
            mensaje: |
              Es justo lo contrario: las propiedades coligativas dependen de
              cuántas partículas hay, no de cuáles. El soluto solo entra al
              pasar de moles a gramos y a mililitros.

      - tipo: calcular
        titulo: La molalidad necesaria
        pregunta: |
          a) ¿Qué molalidad hace falta para que la mezcla congele a −10 °C?
        respuesta:
          tipo: numero
          valor: '5.376'
          tolerancia: 0.01
          formato: la molalidad en mol/kg, con tres decimales
        distractores:
          - valor: '19.61'
            mensaje: |
              Has usado la constante ebulloscópica, 0,51. El punto de
              congelación va con la crioscópica, 1,86.
          - valor: '18.6'
            mensaje: |
              Has multiplicado en vez de dividir: $\Delta T_c = K_c\,m$, así
              que $m = \Delta T_c/K_c = 10/1{,}86$.
        pista: |
          $\Delta T_c = 0 - (-10) = 10$ °C, y $m = \Delta T_c/K_c$.
        desarrollo: |
          $$
          m = \frac{\Delta T_c}{K_c} = \frac{10}{1{,}86} = 5{,}376\ \text{mol/kg}
          $$

          Es el 5,376 de la resolución del material.

      - tipo: calcular
        titulo: El volumen de propilenglicol
        pregunta: |
          a) Por cada litro de agua, ¿qué volumen de propilenglicol hay que
          añadir? Su masa molar es 76,11 g/mol.
        respuesta:
          tipo: magnitud
          valor: '394.3 mL'
          tolerancia: 0.002
          formato: un volumen, con su unidad
        distractores:
          - valor: '408.5 mL'
            mensaje: |
              Son los **gramos** de propilenglicol, 408,5 g. Falta pasarlos a
              volumen con su densidad: $408{,}5/1{,}0361$.
          - valor: '1438 mL'
            mensaje: |
              Arrastras la molalidad calculada con la constante
              ebulloscópica. Para congelar a −10 °C va la crioscópica, 1,86.
        pista: |
          1 L de agua son 0,9983 kg; moles $= m\cdot 0{,}9983$; gramos
          $= n\cdot 76{,}11$; mililitros $=$ gramos $/1{,}0361$.
        desarrollo: |
          $$
          n = 5{,}376\cdot 0{,}9983 = 5{,}367\ \text{mol}
          \qquad
          V = \frac{5{,}367\cdot 76{,}11}{1{,}0361} = 394{,}3\ \text{mL}
          $$

          Coincide con la resolución del material. Tomar 1 L de agua como
          1 kg daría 394,9 mL: la densidad del agua afina, pero no cambia la
          respuesta.

      - tipo: calcular
        titulo: La temperatura de ebullición
        pregunta: |
          b) ¿A qué temperatura empieza a hervir la mezcla?
        respuesta:
          tipo: numero
          valor: '102.74'
          tolerancia: 0.05
          formato: la temperatura en °C, con dos decimales
        distractores:
          - valor: '2.74'
            mensaje: |
              Ese es el aumento, $\Delta T_e$. La temperatura de ebullición es
              la del agua pura más ese aumento: $100 + 2{,}74$.
          - valor: '97.26'
            mensaje: |
              Has restado el aumento. Un soluto no volátil **sube** el punto de
              ebullición: la disolución tiene menos presión de vapor y necesita
              más temperatura para llegar a 1 atm.
          - valor: '110.0'
            mensaje: |
              Has usado la constante crioscópica, 1,86. Para la ebullición va
              la ebulloscópica, 0,51.
        pista: |
          $T_e = 100 + K_e\,m$, con la misma molalidad.
        desarrollo: |
          $$
          \Delta T_e = K_e\,m = 0{,}51\cdot 5{,}376 = 2{,}74\ ^\circ\text{C}
          \qquad
          T_e = 100 + 2{,}74 = 102{,}74\ ^\circ\text{C}
          $$

          Es la resolución del material.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Congelar a −10 °C es un descenso de 10 °C, y
              $m = 10/1{,}86 = 5{,}376$ mol/kg.
          - texto: >-
              Un litro de agua son 0,9983 kg: hacen falta 5,367 mol de
              propilenglicol.
          - texto: >-
              Son 408,5 g, que con su densidad ocupan 394,3 mL.
          - texto: >-
              La misma molalidad sube la ebullición $0{,}51\cdot 5{,}376 = 2{,}74$
              °C: hierve a 102,74 °C.
          - texto: >-
              Como el propilenglicol es un líquido, se suman los volúmenes: la
              mezcla ocupa exactamente 1394,3 mL.
            trampa: true
            mensaje: |
              Que los volúmenes se sumen es la aproximación de disolución
              ideal, y a esta concentración no está garantizada; además el
              problema no pide el volumen de la mezcla ni da datos para él.
        veredicto: |
          Un mismo soluto baja la congelación y sube la ebullición, y las dos
          salen de la misma molalidad.

    resolucion: |
      **a · El volumen.** El descenso crioscópico fija la molalidad:

      $$
      m = \frac{\Delta T_c}{K_c} = \frac{10}{1{,}86} = 5{,}376\ \text{mol/kg}
      $$

      Un litro de agua a 20 °C son 0,9983 kg, así que hacen falta
      $5{,}376\cdot 0{,}9983 = 5{,}367$ mol de propilenglicol. Con su masa
      molar y su densidad:

      $$
      V = \frac{5{,}367\cdot 76{,}11}{1{,}0361} = \boxed{394{,}3\ \text{mL}}
      $$

      **b · La ebullición.** La misma molalidad, con la constante
      ebulloscópica:

      $$
      T_e = 100 + 0{,}51\cdot 5{,}376 = \boxed{102{,}74\ ^\circ\text{C}}
      $$

      Las dos coinciden con la resolución del material.

      **Las constantes y su nombre.** El enunciado escribe $K_f$ y $K_b$, de
      *freezing* y *boiling*; el tema, $K_c$ y $K_e$, de crioscópica y
      ebulloscópica. Son las mismas: 1,86 y 0,51 °C·kg/mol para el agua.

      **Una advertencia honesta.** Casi 400 mL de soluto por litro de agua ya
      no es una disolución diluida, y las propiedades coligativas se cumplen
      mejor cuanto más diluida está. El resultado es una buena estimación, no
      una receta exacta, y el problema lo resuelve así.

  - id: colfq4-p22-la-sacarosa-y-la-presion-de-vapor
    titulo: Azúcar en agua, y cuánto baja la presión de vapor
    fuente: >-
      Problema 22 · Problemas propuestos de propiedades coligativas, tema
      4.2.8 (lámina 87; apuntes, págs. 27-28) · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      colección publica la respuesta final, 30,8 mm Hg, y no sale de los
      datos: con ellos la presión es 30,98 mmHg. El 30,8 puede salir de haber
      tomado P₀ = 31,6 en vez de 31,8 (sale 30,79), aunque no es seguro. El
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Se prepara una solución disolviendo 400 g de sacarosa (C₁₂H₂₂O₁₁) en 800
      g de agua ¿Cuál será la presión de vapor de la solución a 30 °C? La
      presión de vapor del agua a 30 °C es de 31,8 mm Hg.
    pide: La presión de vapor de la disolución a 30 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sacarosa no es volátil. ¿Qué relación da la presión de vapor de la
          disolución?
        opciones:
          - texto: >-
              La ley de Raoult: $P = X_{\text{disolvente}}\,P_0$, o lo que es lo
              mismo, $\Delta P = X_{\text{soluto}}\,P_0$
            correcta: true
            mensaje: |
              Eso es. Solo el agua aporta vapor, y lo hace en proporción a su
              fracción molar. El descenso es la presión del agua pura por la
              fracción molar del **soluto**; la lámina 78 escribe «del
              disolvente» al pie, y es una errata que el tema ya señala.
          - texto: >-
              $\Delta P = K\,m$, con la molalidad, como los puntos de
              congelación y ebullición
            mensaje: |
              El descenso de la presión de vapor no va con la molalidad, sino
              con la fracción molar. Son cuatro propiedades coligativas y cada
              una tiene su medida de la concentración.
          - texto: >-
              La presión de vapor es la del agua pura, porque la sacarosa no
              se evapora
            mensaje: |
              Que el soluto no se evapore no significa que no influya: ocupa
              sitio entre las moléculas de agua y deja escapar menos. La
              presión de vapor baja.
          - texto: >-
              $P = P_0$ por la fracción en masa del agua
            mensaje: |
              Raoult va con fracciones molares: lo que cuenta es cuántas
              moléculas de cada clase hay, no cuánto pesan. Una molécula de
              sacarosa pesa diecinueve veces lo que una de agua.

      - tipo: calcular
        titulo: La fracción molar de la sacarosa
        pregunta: |
          ¿Cuánto vale la fracción molar de la sacarosa en la disolución?
        respuesta:
          tipo: numero
          valor: '0.02564'
          tolerancia: 0.0003
          formato: un número entre 0 y 1, con cuatro cifras
        distractores:
          - valor: '0.02632'
            mensaje: |
              Has dividido los moles de sacarosa entre los de agua, sin
              sumarlos. La fracción molar va sobre el total:
              $1{,}170/(1{,}170 + 44{,}44)$.
          - valor: '0.3333'
            mensaje: |
              Esa es la fracción en masa, $400/1200$. La fracción molar cuenta
              moléculas: 1,17 mol de sacarosa frente a 44,4 de agua.
        pista: |
          $n_{\text{sacarosa}} = 400/342$ y $n_{\text{agua}} = 800/18$.
        desarrollo: |
          $$
          n_{\text{sacarosa}} = \frac{400}{342} = 1{,}170\ \text{mol}
          \qquad
          n_{\text{agua}} = \frac{800}{18} = 44{,}44\ \text{mol}
          $$

          $$
          X_{\text{sacarosa}} = \frac{1{,}170}{1{,}170 + 44{,}44} = 0{,}02564
          $$

      - tipo: calcular
        titulo: La presión de vapor de la disolución
        pregunta: |
          ¿Cuál es la presión de vapor de la disolución a 30 °C?
        respuesta:
          tipo: magnitud
          valor: '30.98 mmHg'
          tolerancia: 0.003
          formato: una presión, con su unidad
        distractores:
          - valor: '30.8 mmHg'
            mensaje: |
              Es la respuesta que da la colección, y no sale de los datos. Con
              $X_{\text{agua}} = 0{,}9744$, la presión es
              $0{,}9744\cdot 31{,}8 = 30{,}98$ mmHg. El 30,8 puede salir de
              haber tomado $P_0 = 31{,}6$ en vez de 31,8, que da
              $0{,}9744\cdot 31{,}6 = 30{,}79$; no es seguro, pero con el
              31,8 del enunciado no sale.
          - valor: '0.815 mmHg'
            mensaje: |
              Ese es el descenso, $\Delta P = X_{\text{soluto}}\,P_0$. La
              pregunta es por la presión de vapor de la disolución: la del agua
              pura menos ese descenso.
          - valor: '21.2 mmHg'
            mensaje: |
              Has multiplicado por la fracción en **masa** del agua, 800/1200.
              Raoult va con la fracción molar, y en moles el agua es el 97 % de
              la disolución.
        pista: |
          $P = (1 - X_{\text{sacarosa}})\,P_0$.
        desarrollo: |
          $$
          P = (1 - 0{,}02564)\cdot 31{,}8 = 30{,}98\ \text{mmHg}
          \qquad
          \Delta P = 0{,}02564\cdot 31{,}8 = 0{,}82\ \text{mmHg}
          $$

          La colección da 30,8 mm Hg, que no sale de los datos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La sacarosa no es volátil: el vapor es solo de agua, y sigue la
              ley de Raoult.
          - texto: >-
              Hay 1,170 mol de sacarosa y 44,44 de agua: $X_{\text{sacarosa}} = 0{,}0256$.
          - texto: >-
              La presión de vapor baja $0{,}0256\cdot 31{,}8 = 0{,}82$ mmHg.
          - texto: >-
              La disolución tiene 30,98 mmHg de presión de vapor, frente a 31,8
              del agua pura.
          - texto: >-
              Como hay 400 g de azúcar en 800 de agua, un tercio de la masa, la
              presión de vapor baja un tercio.
            trampa: true
            mensaje: |
              Raoult cuenta moléculas, no gramos. Una molécula de sacarosa pesa
              342 y una de agua 18: los 400 g de azúcar son solo 1,17 mol frente
              a 44,4 de agua. En moles el soluto es el 2,6 %, y eso es lo que
              baja la presión.
        veredicto: |
          Las propiedades coligativas cuentan partículas. Mucha masa de un
          soluto pesado pueden ser muy pocas moléculas.

    resolucion: |
      **La ley.** Con un soluto no volátil, solo el agua aporta vapor, y la
      presión de vapor es la del agua pura por su fracción molar (ley de
      Raoult):

      $$
      P = X_{\text{agua}}\,P_0
      \qquad
      \Delta P = X_{\text{sacarosa}}\,P_0
      $$

      **Las cuentas.**

      $$
      n_{\text{sacarosa}} = \frac{400}{342} = 1{,}170\ \text{mol}
      \qquad
      n_{\text{agua}} = \frac{800}{18} = 44{,}44\ \text{mol}
      \qquad
      X_{\text{sacarosa}} = 0{,}02564
      $$

      $$
      P = (1 - 0{,}02564)\cdot 31{,}8 = \boxed{30{,}98\ \text{mmHg}}
      $$

      **La respuesta de la colección no cuadra.** Da 30,8 mm Hg, y con los
      datos del enunciado sale 30,98, casi 31,0: el descenso es de solo 0,82
      mmHg. El 30,8 puede salir de haber tomado $P_0 = 31{,}6$ en vez de 31,8:
      $0{,}9744\cdot 31{,}6 = 30{,}79$. No es seguro, pero con el 31,8 del
      enunciado no sale.

      **Por qué baja tan poco.** 400 g de azúcar parecen mucho, pero la
      sacarosa pesa 342 g/mol: son 1,17 mol entre 44,4 de agua. Lo que decide
      una propiedad coligativa es el número de partículas, y aquí el soluto es
      solo el 2,6 % de ellas.

  - id: colfq4-p23-la-presion-osmotica-de-un-carbohidrato
    titulo: La presión osmótica de un carbohidrato, y el volumen que no es el del agua
    fuente: >-
      Problema 23 · Problemas propuestos de propiedades coligativas, tema
      4.2.8 (lámina 87; apuntes, págs. 27-28) · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      colección publica la respuesta final, 4,7 atm; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la presión osmótica a 25 °C de una solución que contiene 6,85 g
      de un carbohidrato (masa molecular 342 g mol⁻¹) en 100 g de agua, con
      una densidad de 1,024 g mL⁻¹.
    pide: La presión osmótica de la disolución a 25 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          La presión osmótica es $\pi = M\,R\,T$. ¿Por qué da el enunciado la
          densidad?
        opciones:
          - texto: >-
              Porque $M$ es la molaridad, moles por litro de **disolución**, y
              el volumen de la disolución sale de su masa y su densidad
            correcta: true
            mensaje: |
              Eso es. Se conocen los gramos de agua y de soluto, no el volumen
              de la mezcla: $V = (100 + 6{,}85)/1{,}024$ mL. Sin la densidad
              habría que suponer que el volumen es el del agua, y no lo es.
          - texto: >-
              Para calcular la masa del agua
            mensaje: |
              La masa del agua ya la da el enunciado, 100 g. La densidad es de
              la **disolución**, y sirve para su volumen.
          - texto: >-
              No hace falta: con 100 g de agua el volumen es 100 mL
            mensaje: |
              Esos 100 mL serían los del agua sola. La disolución lleva además
              6,85 g de soluto y tiene otra densidad: su volumen es 104,3 mL.
          - texto: >-
              Para pasar la presión osmótica de atmósferas a pascales
            mensaje: |
              Con $R = 0{,}082$ atm·L/(mol·K) la presión sale directamente en
              atmósferas. La densidad está para el volumen de la disolución.

      - tipo: calcular
        titulo: El volumen de la disolución
        pregunta: |
          ¿Qué volumen ocupa la disolución?
        respuesta:
          tipo: magnitud
          valor: '104.35 mL'
          tolerancia: 0.004
          formato: un volumen, con su unidad
        distractores:
          - valor: '100 mL'
            mensaje: |
              Es el volumen del agua sola. La disolución tiene 106,85 g y una
              densidad de 1,024 g/mL.
          - valor: '97.66 mL'
            mensaje: |
              Has dividido solo los 100 g de agua entre la densidad. La masa de
              la disolución incluye el soluto: $100 + 6{,}85$ g.
        pista: |
          $V = \dfrac{m_{\text{disolución}}}{\rho} = \dfrac{100 + 6{,}85}{1{,}024}$.
        desarrollo: |
          $$
          V = \frac{106{,}85}{1{,}024} = 104{,}35\ \text{mL}
          $$

      - tipo: calcular
        titulo: La molaridad
        pregunta: |
          ¿Cuál es la molaridad del carbohidrato?
        respuesta:
          tipo: numero
          valor: '0.1920'
          tolerancia: 0.002
          formato: la molaridad en mol/L, con tres decimales
        distractores:
          - valor: '0.2003'
            mensaje: |
              Has dividido los moles entre 0,1 L, el volumen del agua. Eso,
              con kilos en vez de litros, es la molalidad; la presión osmótica
              va con la molaridad, sobre el volumen de la disolución.
          - valor: '0.2051'
            mensaje: |
              Has tomado como volumen $100/1{,}024$ mL, sin el soluto. La
              disolución pesa 106,85 g.
        pista: |
          $n = 6{,}85/342$ y $V = 0{,}10435$ L.
        desarrollo: |
          $$
          n = \frac{6{,}85}{342} = 0{,}02003\ \text{mol}
          \qquad
          M = \frac{0{,}02003}{0{,}10435} = 0{,}1920\ \text{mol/L}
          $$

      - tipo: calcular
        titulo: La presión osmótica
        pregunta: |
          ¿Cuánto vale la presión osmótica a 25 °C?
        respuesta:
          tipo: magnitud
          valor: '4.69 atm'
          tolerancia: 0.01
          formato: una presión, con su unidad
        distractores:
          - valor: '4.894 atm'
            mensaje: |
              Has usado 100 mL de volumen, el del agua, o la molalidad en vez
              de la molaridad: las dos cosas dan 0,2003 mol/L. El volumen de la
              disolución es 104,35 mL.
          - valor: '0.3935 atm'
            mensaje: |
              Has puesto la temperatura en Celsius, 25. Va en kelvin: 298 K.
        pista: |
          $\pi = M\,R\,T$ con $T = 298$ K.
        desarrollo: |
          $$
          \pi = M\,R\,T = 0{,}1920\cdot 0{,}082\cdot 298 = 4{,}69\ \text{atm}
          $$

          La colección da 4,7 atm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión osmótica va con la molaridad: $\pi = M\,R\,T$.
          - texto: >-
              La disolución pesa 106,85 g y ocupa $106{,}85/1{,}024 = 104{,}35$ mL.
          - texto: >-
              Hay $6{,}85/342 = 0{,}02003$ mol de carbohidrato: 0,192 mol/L.
          - texto: >-
              $\pi = 0{,}192\cdot 0{,}082\cdot 298 = 4{,}69$ atm.
          - texto: >-
              Como la disolución es muy diluida, la presión osmótica es
              despreciable, apenas unas milésimas de atmósfera.
            trampa: true
            mensaje: |
              Al contrario: casi 5 atm con solo 6,85 g de soluto, la presión de
              una columna de agua de 48 metros. Es la propiedad coligativa que
              más se nota con poco soluto, y por eso es la que se usa para
              medir masas molares.
        veredicto: |
          En la presión osmótica, el volumen es el de la disolución, y la
          densidad está para eso.

    resolucion: |
      **La fórmula y lo que pide.** $\pi = M\,R\,T$, con $M$ la molaridad:
      moles de soluto por litro de **disolución**. El enunciado da la masa
      del agua y la del soluto, así que el volumen sale de la densidad.

      $$
      V = \frac{100 + 6{,}85}{1{,}024} = 104{,}35\ \text{mL}
      \qquad
      n = \frac{6{,}85}{342} = 0{,}02003\ \text{mol}
      \qquad
      M = 0{,}1920\ \text{mol/L}
      $$

      $$
      \pi = 0{,}1920\cdot 0{,}082\cdot 298 = \boxed{4{,}69\ \text{atm}}
      $$

      Coincide con la colección, 4,7 atm.

      **El error más fácil** es tomar 100 mL, el volumen del agua: sale 4,89
      atm. Es un 4 % más, y en un examen es un error de planteamiento, no de
      redondeo.

      **La lectura.** Casi 5 atm con menos de 7 g de azúcar en 100 g de agua.
      La presión osmótica da números grandes con muy poco soluto, y por eso
      es la que se usa para sacar la masa molar de un compuesto al revés:
      midiendo $\pi$ y despejando la masa molar,
      $\text{masa}\cdot R\,T/(\pi\,V)$.

  - id: colfq4-p24-el-naftaleno-en-benceno
    titulo: Naftaleno en benceno, con las constantes y las temperaturas del benceno
    fuente: >-
      Problema 24 · Problemas propuestos de propiedades coligativas, tema
      4.2.8 (lámina 87; apuntes, págs. 27-28) · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      colección publica la respuesta final, Tc = −7,15 °C y Te = 86,25 °C, y
      las dos corresponden a una disolución 2,47 molal, no 2,5: con los datos
      del enunciado salen −7,30 °C y 86,33 °C. El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la temperatura de ebullición y la temperatura de congelación de
      una solución de naftaleno de concentración 2,5 molal en benceno. La
      temperatura de ebullición y de congelación del benceno son 80 y 5,5 °C
      respectivamente, Ke 2,53 °C molal⁻¹ y Kc 5,12 °C molal-1.
    pide: La temperatura de ebullición y la de congelación de la disolución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Desde qué temperaturas se suman y se restan los aumentos?
        opciones:
          - texto: >-
              Desde las del benceno puro, 80 °C y 5,5 °C: el disolvente es el
              benceno
            correcta: true
            mensaje: |
              Eso es. Las propiedades coligativas comparan la disolución con su
              disolvente puro. Aquí el disolvente no es agua, y ni el 100 ni el
              0 pintan nada.
          - texto: >-
              Desde las del agua, 100 °C y 0 °C
            mensaje: |
              Solo si el disolvente fuera agua. En esta disolución no hay agua:
              el naftaleno está disuelto en benceno, que hierve a 80 °C y
              congela a 5,5 °C.
          - texto: >-
              Desde las del naftaleno, porque es el soluto
            mensaje: |
              El soluto no volátil no hierve ni congela en la disolución: lo
              que hierve y congela es el disolvente, con su punto desplazado.
          - texto: >-
              Desde cero: los aumentos son ya las temperaturas
            mensaje: |
              $K_e\,m$ y $K_c\,m$ son **cambios**, $\Delta T$. Hay que
              sumárselos o restárselos a la temperatura del disolvente puro.

      - tipo: calcular
        titulo: La temperatura de ebullición
        pregunta: |
          ¿A qué temperatura hierve la disolución?
        respuesta:
          tipo: numero
          valor: '86.33'
          tolerancia: 0.04
          formato: la temperatura en °C, con dos decimales
        distractores:
          - valor: '86.25'
            mensaje: |
              Es la respuesta de la colección, y sale de una molalidad de 2,47,
              no de 2,5: $(86{,}25 - 80)/2{,}53 = 2{,}47$. Con el 2,5 del
              enunciado, el aumento es $2{,}53\cdot 2{,}5 = 6{,}325$ °C.
          - valor: '92.8'
            mensaje: |
              Has usado la constante crioscópica, 5,12. La ebullición va con la
              ebulloscópica, $K_e = 2{,}53$.
          - valor: '6.325'
            mensaje: |
              Ese es el aumento, $\Delta T_e$. Falta sumárselo a los 80 °C del
              benceno puro.
        pista: |
          $T_e = 80 + K_e\,m$.
        desarrollo: |
          $$
          \Delta T_e = K_e\,m = 2{,}53\cdot 2{,}5 = 6{,}325\ ^\circ\text{C}
          \qquad
          T_e = 80 + 6{,}325 = 86{,}33\ ^\circ\text{C}
          $$

          La colección da 86,25 °C, que corresponde a 2,47 molal.

      - tipo: calcular
        titulo: La temperatura de congelación
        pregunta: |
          ¿A qué temperatura congela?
        respuesta:
          tipo: numero
          valor: '-7.30'
          tolerancia: 0.03
          formato: la temperatura en °C, con su signo y dos decimales
        distractores:
          - valor: '-7.15'
            mensaje: |
              Es la respuesta de la colección, y sale de la misma molalidad de
              2,47 que su temperatura de ebullición:
              $(5{,}5 + 7{,}15)/5{,}12 = 2{,}47$. Con 2,5 molal el descenso es
              12,8 °C.
          - valor: '-12.8'
            mensaje: |
              Has restado el descenso desde 0 °C, como si el disolvente fuera
              agua. El benceno congela a 5,5 °C: $5{,}5 - 12{,}8$.
          - valor: '18.3'
            mensaje: |
              Has sumado el descenso. Un soluto **baja** el punto de
              congelación: le cuesta más al disolvente ordenarse en cristal.
        pista: |
          $T_c = 5{,}5 - K_c\,m$.
        desarrollo: |
          $$
          \Delta T_c = K_c\,m = 5{,}12\cdot 2{,}5 = 12{,}8\ ^\circ\text{C}
          \qquad
          T_c = 5{,}5 - 12{,}8 = -7{,}30\ ^\circ\text{C}
          $$

          La colección da −7,15 °C, que corresponde a 2,47 molal.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El disolvente es el benceno: las temperaturas de referencia son
              80 °C y 5,5 °C.
          - texto: >-
              El punto de ebullición sube $K_e\,m = 2{,}53\cdot 2{,}5 = 6{,}325$ °C:
              86,33 °C.
          - texto: >-
              El de congelación baja $K_c\,m = 5{,}12\cdot 2{,}5 = 12{,}8$ °C:
              −7,30 °C.
          - texto: >-
              El descenso es mayor que el aumento porque la constante
              crioscópica del benceno es mayor que la ebulloscópica.
          - texto: >-
              Con la misma molalidad en agua los cambios serían los mismos,
              porque las propiedades coligativas no dependen de las sustancias.
            trampa: true
            mensaje: |
              No dependen del **soluto**, pero sí del disolvente: sus
              constantes son distintas. En agua, $K_c = 1{,}86$ y
              $K_e = 0{,}51$, y 2,5 molal bajarían la congelación 4,65 °C, no
              12,8.
        veredicto: |
          El soluto da igual; el disolvente, no. Sus constantes y sus
          temperaturas son las de referencia.

    resolucion: |
      **El disolvente manda.** Las propiedades coligativas no dependen de qué
      soluto sea, pero sí del disolvente: de él salen las temperaturas de
      referencia y las constantes. Aquí es el benceno.

      $$
      T_e = 80 + 2{,}53\cdot 2{,}5 = \boxed{86{,}33\ ^\circ\text{C}}
      \qquad
      T_c = 5{,}5 - 5{,}12\cdot 2{,}5 = \boxed{-7{,}30\ ^\circ\text{C}}
      $$

      **La respuesta de la colección es de otra molalidad.** Da
      $T_c = -7{,}15$ °C y $T_e = 86{,}25$ °C. Despejando la molalidad de cada
      una sale lo mismo:

      $$
      \frac{86{,}25 - 80}{2{,}53} = 2{,}47
      \qquad
      \frac{5{,}5 - (-7{,}15)}{5{,}12} = 2{,}47
      $$

      Así que las dos cifras son coherentes entre sí, pero con 2,47 molal, no
      con el 2,5 del enunciado. Con los datos que se leen, salen 86,33 y
      −7,30 °C.

      **Lo que conviene mirar.** El benceno tiene constantes mucho mayores que
      el agua (5,12 frente a 1,86 la crioscópica): la misma molalidad le baja
      el punto de congelación casi tres veces más. Y como congela a 5,5 °C, el
      descenso lo lleva por debajo de cero.
