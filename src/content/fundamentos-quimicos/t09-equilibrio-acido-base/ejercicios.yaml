ejercicios:
  # ── Los dos son NUESTROS (§08). El ejercicio de examen de este tema pide
  #    cuatro pH sobre la misma disolución, y cada uno cae en un régimen
  #    distinto: quien no sabe decidir el régimen no falla una cuenta, falla
  #    las cuatro. Aquí se aísla el ácido débil solo, y después el tampón —con
  #    la comparación que explica para qué sirve.
  - id: ejfq9-un-acido-debil-no-es-un-acido-fuerte-flojo
    titulo: Un ácido débil al 1 %, y el pH que no es 1
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Calcular el pH y el grado de ionización de una disolución de **ácido
      acético 0,10 M**.

      **Dato:** $K_a = 1{,}8\cdot 10^{-5}$.
    pide: El pH de la disolución y el porcentaje de ácido que se ha disociado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el ácido fuera fuerte, el pH sería 1,00. ¿Por qué no lo es?
        opciones:
          - texto: >-
              Porque solo se disocia una fracción pequeña, así que
              $[\mathrm{H^+}]$ es mucho menor que la concentración del ácido
            correcta: true
            mensaje: |
              Exacto. En un ácido fuerte $[\mathrm{H^+}] = C$; en uno débil hay
              un equilibrio y $[\mathrm{H^+}] \ll C$. Aquí se disocia un 1,3 %,
              y el pH pasa de 1,00 a 2,88.
          - texto: >-
              Porque el ácido acético tiene menos hidrógenos disponibles
            mensaje: |
              Tiene cuatro hidrógenos y solo uno es ácido, pero eso no es lo
              que lo hace débil: el clorhídrico tiene uno solo y es fuerte. Lo
              que decide es la **constante**.
          - texto: >-
              Porque la disolución está diluida
            mensaje: |
              Un ácido fuerte 0,10 M también está diluido y da pH 1,00
              exactamente. Lo que cambia aquí no es la dilución.
          - texto: >-
              Porque el agua aporta iones que lo compensan
            mensaje: |
              El agua aporta $10^{-7}$ M, despreciable frente a los
              $1{,}3\cdot 10^{-3}$ del ácido. Solo importa en disoluciones
              muy diluidas, por debajo de $10^{-6}$ M.

      - tipo: calcular
        titulo: El pH
        pregunta: ¿Cuál es el pH de la disolución?
        respuesta:
          tipo: numero
          valor: '2.88'
          tolerancia: 0.06
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '1.00'
            mensaje: |
              Ese es el pH si el ácido fuera **fuerte** y se disociara del
              todo. Con $K_a = 1{,}8\cdot 10^{-5}$ solo se disocia el 1,3 %.
          - valor: '4.74'
            mensaje: |
              Ese es el $\mathrm{p}K_a$, que es el pH de un **tampón** a
              partes iguales, no el de un ácido solo.
        pista: |
          Monta el equilibrio con $x = [\mathrm{H^+}]$:
          $K_a = x^{2}/(C-x)$. Como $C/K_a$ es mucho mayor que 100, puedes
          despreciar la $x$ del denominador.
        desarrollo: |
          $$
          K_a = \frac{x^{2}}{0{,}10-x} \approx \frac{x^{2}}{0{,}10}
          \;\Longrightarrow\;
          x = \sqrt{1{,}8\cdot 10^{-5}\cdot 0{,}10} = 1{,}34\cdot 10^{-3}
          $$
          $$
          \mathrm{pH} = -\log(1{,}33\cdot 10^{-3}) = 2{,}88
          $$
          Sin aproximar sale $1{,}3327\cdot 10^{-3}$: la aproximación se
          equivoca en un 0,7 % y no cambia la segunda cifra del pH.

      - tipo: calcular
        titulo: El grado de ionización
        pregunta: ¿Qué porcentaje del ácido se ha disociado?
        respuesta:
          tipo: numero
          valor: '1.33'
          tolerancia: 0.06
          formato: el porcentaje, con dos cifras decimales
        distractores:
          - valor: '0.13'
            mensaje: |
              Te falta pasar a porcentaje: la fracción es 0,0133, y en
              porcentaje son 1,33.
          - valor: '100'
            mensaje: |
              Eso sería un ácido fuerte. El grado de ionización es justo lo que
              mide cuánto le falta a un ácido para serlo.
        pista: |
          El grado de ionización es la fracción que se ha disociado,
          $\alpha = x/C$, y se suele dar en porcentaje.
        desarrollo: |
          $$
          \alpha = \frac{1{,}33\cdot 10^{-3}}{0{,}10} = 0{,}0133 = 1{,}33\ \%
          $$
          De cada mil moléculas de acético, trece están disociadas y 987 siguen
          enteras.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un ácido débil no se disocia del todo, así que hay un equilibrio
              con su constante $K_a$.
          - texto: >-
              Con $x = [\mathrm{H^+}]$, la expresión es
              $K_a = x^{2}/(C-x)$.
          - texto: >-
              Como $C/K_a$ vale unos 5500, se puede despreciar la $x$ del
              denominador con un error del 0,7 %.
          - texto: >-
              Sale $x = 1{,}33\cdot 10^{-3}$ y pH 2,88, casi dos unidades por
              encima del ácido fuerte.
          - texto: >-
              El grado de ionización es 1,33 %, o sea que 987 de cada 1000
              moléculas siguen enteras.
          - texto: >-
              Como se disocia poco, el pH de un ácido débil es siempre mayor
              que 7.
            trampa: true
            mensaje: |
              Disociarse poco no es no disociarse. Sigue siendo un ácido y el
              pH está por debajo de 7 — aquí 2,88, que es bastante ácido.

              Lo que cambia respecto de un ácido fuerte es **cuánto**: dos
              unidades de pH, o sea cien veces menos protones. Pero el signo de
              la desviación respecto del neutro es el mismo.
        veredicto: |
          Débil significa «poco disociado», no «poco ácido». La diferencia con
          un ácido fuerte de la misma concentración son dos unidades de pH.

    resolucion: |
      **La idea.** Un ácido fuerte se disocia del todo, así que
      $[\mathrm{H^+}] = C$ y el pH sale de un logaritmo. Uno débil establece un
      **equilibrio**, y hay que resolverlo.

      $$
      \mathrm{CH_3COOH} \rightleftharpoons \mathrm{CH_3COO^-} + \mathrm{H^+}
      \qquad
      K_a = \frac{x^{2}}{C-x}
      $$

      Como $C/K_a = \frac{0{,}10}{1{,}8\cdot 10^{-5}} \approx 5500$, muy por encima de
      100, se puede despreciar la $x$ del denominador:

      $$
      x = \sqrt{K_a\,C} = 1{,}34\cdot 10^{-3}
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 2{,}88\;}
      \qquad
      \boxed{\;\alpha = 1{,}33\ \%\;}
      $$

      **Cuándo vale la aproximación y cómo decirlo.** El criterio es
      $C/K_a > 100$. Aquí sobra: sin aproximar sale $1{,}3327\cdot 10^{-3}$ en
      vez de $1{,}3416\cdot 10^{-3}$, un 0,7 % que no llega a mover la segunda
      cifra del pH. En el examen conviene escribir que se ha hecho y por qué —
      cuesta una línea y es lo que separa una aproximación de un descuido.

      **La comparación que da la intuición del tema:**

      | | pH | $[\mathrm{H^+}]$ |
      |---|---|---|
      | HCl 0,10 M | 1,00 | $10^{-1}$ |
      | acético 0,10 M | 2,88 | $1{,}3\cdot 10^{-3}$ |

      Cien veces menos protones a la misma concentración. Eso es lo que
      significa «débil».

  - id: ejfq9-para-que-sirve-un-tampon
    titulo: Un tampón, y el mismo ácido echado en agua
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se prepara una disolución mezclando **50 mL de ácido acético 0,20 M** con
      **50 mL de acetato de sodio 0,20 M**.

      **a)** Calcular su pH.

      **b)** Calcular el pH después de añadir **1 mmol de HCl**, y compararlo
      con el que tendría ese mismo HCl disuelto en 100 mL de agua pura.

      **Dato:** $K_a$ del ácido acético $= 1{,}8\cdot 10^{-5}$.
    pide: El pH del tampón, el pH tras añadir el ácido, y la comparación.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el vaso hay a la vez ácido acético y acetato. ¿Qué fórmula toca?
        opciones:
          - texto: >-
              Henderson-Hasselbalch, porque conviven el ácido débil y su base
              conjugada
            correcta: true
            mensaje: |
              Eso es un tampón, y la señal es exactamente esa: los dos
              presentes a la vez y en cantidades comparables.
          - texto: >-
              La del ácido débil solo, $K_a = x^{2}/(C-x)$
            mensaje: |
              Esa vale cuando el ácido está solo. Aquí el acetato ya está en el
              vaso desde el principio, y desplaza el equilibrio: no se puede
              suponer que la base conjugada solo viene de la disociación.
          - texto: >-
              La de hidrólisis, $K_b = K_w/K_a$
            mensaje: |
              Esa es para cuando **solo** hay sal, en el punto de equivalencia.
              Aquí queda ácido sin neutralizar.
          - texto: >-
              La del ácido fuerte, porque hay HCl
            mensaje: |
              En el apartado a) todavía no hay HCl. Y cuando lo haya, no
              sobrará: el tampón lo absorbe.

      - tipo: calcular
        titulo: El pH del tampón
        pregunta: ¿Cuál es el pH de la mezcla inicial?
        respuesta:
          tipo: numero
          valor: '4.74'
          tolerancia: 0.06
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '2.87'
            mensaje: |
              Ese es el del ácido acético solo a 0,10 M. La presencia del
              acetato desplaza el equilibrio hacia la izquierda y sube el pH
              casi dos unidades.
          - valor: '7.00'
            mensaje: |
              Que haya ácido y base juntos no significa que se neutralicen a
              pH 7: no reaccionan entre sí, son la pareja conjugada. El pH lo
              fija el $\mathrm{p}K_a$.
        pista: |
          Al mezclar, los dos quedan en 0,010 mol cada uno. En Henderson el
          cociente puede ir con moles, porque el volumen es el mismo para los
          dos y se cancela.
        desarrollo: |
          $$
          n(\mathrm{HA}) = 0{,}050\cdot 0{,}20 = 0{,}010\ \text{mol}
          \qquad
          n(\mathrm{A^-}) = 0{,}010\ \text{mol}
          $$
          $$
          \mathrm{pH} = \mathrm{p}K_a + \log\frac{0{,}010}{0{,}010}
          = 4{,}74 + 0 = 4{,}74
          $$

      - tipo: calcular
        titulo: Y después del ácido
        pregunta: |
          Tras añadir 1 mmol de HCl al tampón, ¿cuál es el nuevo pH?
        respuesta:
          tipo: numero
          valor: '4.66'
          tolerancia: 0.06
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '2.00'
            mensaje: |
              Ese es el pH que daría ese HCl en 100 mL de **agua pura**. El
              tampón está para que no pase eso: la caída real es de 0,08
              unidades, no de 4,7.
          - valor: '4.82'
            mensaje: |
              Has sumado el ácido al lado equivocado. El HCl **consume**
              acetato y **genera** acético, así que el cociente baja y el pH
              también.
        pista: |
          El HCl reacciona con la base conjugada: convierte 1 mmol de acetato
          en 1 mmol de acético. Rehaz el cociente y vuelve a Henderson.
        desarrollo: |
          $$
          n(\mathrm{A^-}) = 0{,}010-0{,}001 = 0{,}009
          \qquad
          n(\mathrm{HA}) = 0{,}010+0{,}001 = 0{,}011
          $$
          $$
          \mathrm{pH} = 4{,}74 + \log\frac{0{,}009}{0{,}011} = 4{,}66
          $$
          En agua pura, ese mismo milimol en 100 mL daría
          $[\mathrm{H^+}] = 0{,}010$ y pH **2,00**.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al mezclar quedan 0,010 mol de acético y 0,010 de acetato, o sea
              un tampón a partes iguales.
          - texto: >-
              Con el cociente igual a 1, el logaritmo se anula y el pH es el
              $\mathrm{p}K_a$: 4,74.
          - texto: >-
              El HCl añadido convierte 1 mmol de acetato en acético, así que el
              cociente pasa de 1 a 0,009/0,011.
          - texto: >-
              El pH baja a 4,66: ocho centésimas.
          - texto: >-
              El mismo milimol en agua pura daría pH 2,00, casi cinco unidades
              por debajo.
          - texto: >-
              Como el tampón absorbe el ácido añadido, su pH no cambia en
              absoluto.
            trampa: true
            mensaje: |
              Cambia, poco pero cambia: 0,08 unidades. Un tampón **amortigua**,
              no congela.

              Y esa distinción importa porque tiene un límite: si sigues
              añadiendo ácido, llega un momento en que el acetato se agota y
              entonces el pH se desploma como en el agua. La capacidad
              amortiguadora es finita, y es máxima justo cuando el cociente
              vale 1 — que es donde está este tampón.
        veredicto: |
          Un tampón no fija el pH: lo defiende. Y lo defiende mejor cuanto más
          cerca esté el cociente de 1.

    resolucion: |
      **a) El tampón.** Al mezclar volúmenes iguales de dos disoluciones
      0,20 M quedan 0,010 mol de cada uno:

      $$
      \mathrm{pH} = \mathrm{p}K_a + \log\frac{[\mathrm{A^-}]}{[\mathrm{HA}]}
      = 4{,}74 + \log 1 = \boxed{4{,}74}
      $$

      **Por qué se puede usar moles en el cociente.** Los dos están en el mismo
      volumen, así que al dividir se cancela. Es la única vez en la asignatura
      en que eso vale — en $K_c$, en $K_a$ o en cualquier otra constante hay
      que pasar a concentración sí o sí.

      **b) La prueba de para qué sirve.** El HCl no se queda como tal: reacciona
      con el acetato y lo convierte en acético.

      $$
      \mathrm{A^-}: 0{,}010 \rightarrow 0{,}009
      \qquad
      \mathrm{HA}: 0{,}010 \rightarrow 0{,}011
      $$
      $$
      \mathrm{pH} = 4{,}74 + \log\frac{0{,}009}{0{,}011} = \boxed{4{,}66}
      $$

      Y el mismo milimol en 100 mL de agua pura:

      $$
      [\mathrm{H^+}] = \frac{0{,}001}{0{,}100} = 0{,}010
      \;\Longrightarrow\;
      \mathrm{pH} = \boxed{2{,}00}
      $$

      | | pH final | caída |
      |---|---|---|
      | en el tampón | 4,66 | **0,08** |
      | en agua pura | 2,00 | **5,00** |

      Sesenta veces menos. Eso es lo que hace un tampón, y por eso la sangre
      lleva uno —bicarbonato/carbónico— y cualquier reacción biológica se
      arruinaría sin él.

      **Y su límite**, que es la otra mitad de la idea: el tampón funciona
      mientras queden los dos. Cuando el acetato se agote, el pH caerá igual
      que en el agua. La capacidad es máxima con el cociente en 1, que es
      justo donde se ha preparado este.

  # ── Y a partir de aquí, los problemas propuestos del tema en el orden de la
  #    colección (§04). La colección publica la respuesta final de cada uno;
  #    el desarrollo, los distractores y los errores típicos son nuestros.
  - id: colfq9-1-el-nitroso-al-diluirlo
    titulo: Un ácido débil al que diluir le sube el grado de disociación
    fuente: >-
      Problema 1 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Una solución 1M de HNO2 tiene un 2% de ácido ionizado. Calcular: a) La
      concentración de los iones nitrito, de protones y el pH de la solución,
      b) Si la solución se diluye 10 veces ¿cuál será el grado de disociación
      y el pH?
    pide: Las concentraciones y el pH antes de diluir, y el grado de disociación y el pH después.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da $K_a$: da el grado de disociación. ¿Sirve para
          resolver el apartado b?
        opciones:
          - texto: Sí, porque con el grado y la concentración se calcula $K_a$, que sí es constante
            correcta: true
            mensaje: |
              Ese es el camino. El grado de disociación **cambia** con la
              concentración —es lo que el problema quiere que descubras—, pero
              $K_a$ no. Se saca del apartado a y se reutiliza en el b.
          - texto: No, hace falta buscar la $K_a$ del ácido nitroso en una tabla
            mensaje: |
              No hace falta ninguna tabla: el 2% del enunciado, junto con la
              concentración 1 M, determina $K_a$ por completo. Y en el examen
              no habrá tabla.
          - texto: Sí, y además el grado se mantiene en el 2% al diluir
            mensaje: |
              El grado **no** se mantiene: si se mantuviera, el apartado b no
              tendría nada que calcular. Diluir desplaza el equilibrio hacia
              la disociación, así que el grado sube.
          - texto: Sí, pero solo si la disociación es despreciable frente a la concentración
            mensaje: |
              Esa aproximación es una comodidad de cálculo, no un requisito. Y
              aquí conviene no usarla a ciegas: al diluir, el 6% que sale ya
              no es tan despreciable frente al 100%.

      - tipo: calcular
        titulo: La constante del ácido
        pregunta: |
          Con la solución 1 M disociada al 2 %, ¿cuánto vale $K_a$?
        respuesta:
          tipo: numero
          valor: '4.08e-4'
          tolerancia: 1e-5
          formato: un número en notación científica, como 1,08e-3
        distractores:
          - valor: '0.0204'
            mensaje: |
              Has puesto un solo ion en el numerador. Se disocian **dos**
              especies, el protón y el nitrito, y las dos van multiplicando:
              el numerador es $0{,}02 \times 0{,}02$, no $0{,}02$.
          - valor: '2450'
            mensaje: |
              Tienes la constante del revés. $K_a$ lleva los **productos**
              arriba y el ácido sin disociar abajo; así escrita estarías
              calculando la constante de la reacción inversa.
        pista: |
          $K_a = \dfrac{[\mathrm{H^+}][\mathrm{NO_2^-}]}{[\mathrm{HNO_2}]}$,
          con las tres concentraciones en el equilibrio.
        desarrollo: |
          Si se disocia el 2 % de 1 M, en el equilibrio hay
          $0{,}02$ M de cada ion y $0{,}98$ M de ácido sin disociar:

          $$
          K_a = \frac{0{,}02 \times 0{,}02}{0{,}98} = 4{,}08 \times 10^{-4}
          $$

          La aproximación habitual —despreciar lo disociado en el denominador,
          o sea $K_a \approx C\alpha^{2}$— daría $4{,}00 \times 10^{-4}$. Aquí
          la diferencia es del 2 % y no cambia nada; conviene saber de dónde
          sale para reconocerla cuando sí importe.

      - tipo: calcular
        titulo: El pH tras diluir
        pregunta: |
          Diluida diez veces, la concentración pasa a 0,1 M. ¿Cuál es el pH?
        respuesta:
          tipo: numero
          valor: '2.21'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2.7'
            mensaje: |
              Has sumado una unidad al pH de partida, como si diluir diez
              veces multiplicase por diez la dilución de los protones. No
              funciona con un ácido débil: al diluir, el equilibrio se
              desplaza y **repone** parte de los protones perdidos.
          - valor: '1.7'
            mensaje: |
              Ese es el pH de antes de diluir. Diluir un ácido siempre sube el
              pH, aunque suba menos de lo que parecería.
          - valor: '1'
            mensaje: |
              Has tomado la concentración inicial, $0{,}1$ M, como si fuera la
              de protones, que es tratar el ácido nitroso como si fuera
              fuerte. Solo se disocia el 6 % de ella: los protones son
              $6{,}19 \times 10^{-3}$ M.
        pista: |
          Resuelve $\dfrac{x^{2}}{0{,}1 - x} = K_a$ sin despreciar la $x$ del
          denominador.
        desarrollo: |
          $$
          \frac{x^{2}}{0{,}1 - x} = 4{,}08 \times 10^{-4}
          $$

          $$
          x^{2} + 4{,}08 \times 10^{-4}\,x - 4{,}08 \times 10^{-5} = 0
          $$

          $$
          x = 6{,}19 \times 10^{-3} \quad\Longrightarrow\quad \mathrm{pH} = -\log(6{,}19 \times 10^{-3}) = 2{,}21
          $$

          Y el grado de disociación es
          $\alpha = 6{,}19 \times 10^{-3} / 0{,}1 = 0{,}0619$, es decir el
          6,2 %.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Del apartado a sale la constante, que no depende de la concentración: Ka = 0,02 × 0,02 / 0,98 = 4,08 × 10⁻⁴.'
          - texto: 'Al diluir diez veces la concentración pasa a 0,1 M, y hay que volver a resolver el equilibrio con la misma Ka.'
          - texto: 'La cantidad de protones baja en términos absolutos, de 0,02 M a 6,19 × 10⁻³ M, así que el pH sube de 1,7 a 2,21.'
          - texto: 'Pero la fracción disociada sube, del 2 % al 6,2 %: al haber menos moléculas por unidad de volumen, el equilibrio se desplaza hacia los iones.'
          - texto: 'Como la disolución se ha diluido diez veces, la concentración de protones también se divide entre diez y el pH sube exactamente una unidad.'
            trampa: true
            mensaje: |
              Eso vale para un ácido **fuerte**, que ya estaba disociado del
              todo y no tiene nada más que dar. Un ácido débil tiene reserva
              sin disociar, y al diluir la usa: los protones bajan solo de
              0,02 a 0,0062, un factor de 3,2 y no de 10.
    resolucion: |
      **a · Lo que hay en la solución 1 M.** El ácido nitroso es débil y se
      disocia según

      $$
      \mathrm{HNO_2} \;\rightleftharpoons\; \mathrm{H^+} + \mathrm{NO_2^-}
      $$

      Disociado el 2 % de 1 M, en el equilibrio hay $0{,}02$ M de nitrito y
      $0{,}02$ M de protones —salen de uno en uno—, y quedan $0{,}98$ M de
      ácido entero.

      $$
      \mathrm{pH} = -\log(0{,}02) = 1{,}70
      $$

      **La constante, que es lo que hay que sacar antes de seguir.** El grado
      de disociación depende de la concentración; $K_a$ no. Es el único dato
      que se puede llevar al apartado b:

      $$
      K_a = \frac{0{,}02 \times 0{,}02}{0{,}98} = 4{,}08 \times 10^{-4}
      $$

      **b · Al diluir diez veces.** La concentración inicial pasa a $0{,}1$ M
      y hay que resolver el equilibrio otra vez:

      $$
      \frac{x^{2}}{0{,}1 - x} = 4{,}08 \times 10^{-4} \quad\Longrightarrow\quad x = 6{,}19 \times 10^{-3}
      $$

      $$
      \alpha = \frac{6{,}19 \times 10^{-3}}{0{,}1} = 6{,}2\ \% \qquad \mathrm{pH} = 2{,}21
      $$

      **Lo que enseña el problema, y por eso está el primero de la
      colección.** Dos cosas se mueven en sentidos opuestos y las dos son
      ciertas a la vez:

      - **hay menos protones** que antes —de 0,02 M a 0,0062 M—, así que el
        pH sube;
      - **está disociado en mayor proporción** —del 2 % al 6,2 %—, porque al
        separarse las moléculas les cuesta menos volver a juntarse.

      Es la ley de dilución de Ostwald, y es el error típico del tema: dar por
      hecho que diluir «debilita» el ácido en todos los sentidos. Lo debilita
      en concentración de protones y lo **refuerza** en grado de disociación.

  # ── Los problemas propuestos del tema 9 que faltaban: del 2 al 5, el 8, el
  #    9, el 10 y el 12. Van cada uno en su sitio del orden de la colección
  #    (§04): del 2 al 5 entre el 1 y el 6, el 8, el 9 y el 10 entre el 7 y el
  #    11, y el 12 al final. La colección publica la respuesta final; los
  #    «Ejercicios resueltos del tema 9», manuscritos, desarrollan el 3, el 4,
  #    el 10, el 11 y el 12, y con ellos se ha contrastado cada paso.
  - id: colfq9-2-la-masa-molar-desde-el-ph
    titulo: La masa molar de un ácido, sacada de su pH
    fuente: >-
      Problema 2 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      El pH de una solución de 10 L que contiene 0,333 g de ácido monoprótico
      es 4 ¿Cuál es la masa molecular de dicho ácido? Ka =1,8 x 10⁻⁵
    pide: La masa molecular del ácido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El pH es 4, así que $[\mathrm{H^+}] = 10^{-4}$ M. ¿Es esa la
          concentración del ácido?
        opciones:
          - texto: >-
              No: $10^{-4}$ M es lo que se ha disociado; la concentración del
              ácido sale de $K_a$, $C = x^{2}/K_a + x$
            correcta: true
            mensaje: |
              Eso es. El ácido es débil, así que solo una parte da protones. La
              constante relaciona lo disociado con lo que había, y de ahí sale
              la concentración, y con ella los moles y la masa molar.
          - texto: >-
              Sí, porque $\mathrm{pH} = -\log C$
            mensaje: |
              Eso vale para un ácido fuerte, que se disocia entero. Con una
              $K_a$ de $1{,}8\cdot 10^{-5}$ el ácido es débil, y la
              concentración es seis veces y media mayor que la de protones.
          - texto: >-
              Sí, porque es monoprótico y suelta un solo protón
            mensaje: |
              Monoprótico dice cuántos protones puede soltar cada molécula, no
              cuántas moléculas los sueltan. Siendo débil, la mayoría se queda
              sin disociar.
          - texto: >-
              No se puede saber sin conocer antes la masa molecular
            mensaje: |
              Se puede, y es el orden del problema: primero la concentración, a
              partir del pH y de $K_a$; después los moles, y la masa molecular
              al final.

      - tipo: calcular
        titulo: La concentración del ácido
        pregunta: |
          ¿Cuál es la concentración inicial del ácido?
        respuesta:
          tipo: numero
          valor: '6.56e-4'
          tolerancia: 5e-6
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '5.56e-4'
            mensaje: |
              Has despreciado la $x$ del denominador, $C \approx x^{2}/K_a$.
              Aquí no vale: se disocia un 15 % del ácido, y hay que sumar esos
              $10^{-4}$ M que se han ido en iones.
          - valor: '1e-4'
            mensaje: |
              Has tomado la concentración de protones como la del ácido, que es
              tratarlo como fuerte. Con esta $K_a$ solo se disocia una parte.
        pista: |
          Con $x = 10^{-4}$, $K_a = \dfrac{x^{2}}{C - x}$: despeja $C$.
        desarrollo: |
          $$
          C = \frac{x^{2}}{K_a} + x = \frac{(10^{-4})^{2}}{1{,}8\cdot 10^{-5}} + 10^{-4} = 6{,}56\cdot 10^{-4}\ \text{M}
          $$

          Se disocia $10^{-4}/6{,}56\cdot 10^{-4}$, un 15 %: la aproximación
          habitual no vale aquí.

      - tipo: calcular
        titulo: La masa molecular
        pregunta: |
          ¿Cuál es la masa molecular del ácido?
        respuesta:
          tipo: numero
          valor: '50.80'
          tolerancia: 0.05
          formato: la masa molecular en g/mol, con dos decimales
        distractores:
          - valor: '59.94'
            mensaje: |
              Sale de despreciar la $x$ del denominador: con
              $C = 5{,}56\cdot 10^{-4}$ M hay menos moles y la masa molar sale
              mayor. Con un 15 % disociado, la aproximación no vale.
          - valor: '333'
            mensaje: |
              Es tratar el ácido como fuerte, con $C = 10^{-4}$ M. Es débil: la
              concentración es mayor que la de protones.
          - valor: '508'
            mensaje: |
              Te has olvidado de los 10 L: la concentración es por litro, y
              hay diez. Los moles son $6{,}56\cdot 10^{-4} \cdot 10$.
        pista: |
          Moles $= C \cdot V$, con 10 L. La masa molecular es la masa entre los
          moles.
        desarrollo: |
          $$
          n = 6{,}556\cdot 10^{-4} \cdot 10 = 6{,}556\cdot 10^{-3}\ \text{mol}
          $$

          $$
          M = \frac{0{,}333}{6{,}556\cdot 10^{-3}} = 50{,}79\ \text{g/mol}
          $$

          Es la respuesta de la colección, 50,79 g/mol. Sin redondear la
          concentración sale 50,80.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con pH 4, $[\mathrm{H^+}] = 10^{-4}$ M, que es lo disociado.
          - texto: >-
              De $K_a = x^{2}/(C - x)$ sale $C = 5{,}56\cdot 10^{-4} + 10^{-4} = 6{,}56\cdot 10^{-4}$ M.
          - texto: >-
              En 10 L son $6{,}56\cdot 10^{-3}$ mol.
          - texto: >-
              La masa molecular es $0{,}333/6{,}56\cdot 10^{-3} = 50{,}8$ g/mol.
          - texto: >-
              Como el ácido es débil, se puede despreciar lo disociado frente a
              la concentración, y $C = x^{2}/K_a$.
            trampa: true
            mensaje: |
              Solo si lo disociado es pequeño, y aquí es un 15 %. La
              aproximación da 59,9 g/mol, un 18 % de error. Aquí el camino es
              al revés que de costumbre —se conoce $x$ y se busca $C$—, y la
              suma $x^{2}/K_a + x$ es exacta: no hay nada que aproximar.
        veredicto: |
          Si el dato es el pH y la incógnita es la concentración, la ecuación
          se despeja exacta y no hace falta aproximar.

    resolucion: |
      **Del pH a lo disociado.** Con pH 4, $x = [\mathrm{H^+}] = 10^{-4}$ M.
      Es un ácido débil, así que eso no es su concentración: es lo que se ha
      disociado.

      **De lo disociado a la concentración.** La constante relaciona las dos,
      y aquí se despeja exacta:

      $$
      K_a = \frac{x^{2}}{C - x}
      \quad\Longrightarrow\quad
      C = \frac{x^{2}}{K_a} + x = 5{,}56\cdot 10^{-4} + 10^{-4} = 6{,}56\cdot 10^{-4}\ \text{M}
      $$

      **De la concentración a la masa molecular.** En 10 L hay
      $6{,}56\cdot 10^{-3}$ mol, y

      $$
      \boxed{M = \frac{0{,}333}{6{,}56\cdot 10^{-3}} = 50{,}8\ \text{g/mol}}
      $$

      Coincide con la colección, 50,79 g/mol.

      **La trampa del problema.** La costumbre es despreciar la $x$ del
      denominador, y aquí sale cara: se disocia un 15 % del ácido, y la
      aproximación da 59,9 g/mol. Es un buen ejemplo de por qué conviene
      mirar el grado de disociación antes de aproximar, y no después.

  - id: colfq9-3-el-viraje-del-rojo-de-metilo
    titulo: El rojo de metilo, y dónde empieza y acaba su cambio de color
    fuente: >-
      Problema 3 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, y los
      ejercicios resueltos del tema 9 la desarrollan a mano, con las mismas
      dos cifras; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      El indicador rojo de metilo, rojo en medio ácido y amarillo en medio
      alcalino, tiene una constante de ionización de 7,93 x 10⁻⁶. Si se supone
      que un 6% de la forma roja no ionizada y un 12% de la forma amarilla
      iónica ya no se reconocen por su color, determinar el intervalo de pH
      para el viraje de este indicador.
    pide: El intervalo de pH en el que el indicador cambia de color.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación describe el color del indicador a cada pH?
        opciones:
          - texto: >-
              Henderson-Hasselbalch, con la forma amarilla, Ind⁻, como base y
              la roja, HInd, como ácido
            correcta: true
            mensaje: |
              Eso es. Un indicador es un ácido débil cuyas dos formas tienen
              colores distintos, y el pH fija el cociente entre ellas:
              $\mathrm{pH} = \mathrm{p}K_a + \log([\mathrm{Ind^-}]/[\mathrm{HInd}])$.
          - texto: >-
              La del ácido débil solo, $K_a = x^{2}/(C - x)$
            mensaje: |
              Esa da el pH de una disolución del indicador solo. Aquí el pH lo
              pone la disolución que se valora, y el indicador se limita a
              repartirse entre sus dos formas según ese pH.
          - texto: >-
              Ninguna: un indicador vira siempre en pH 7
            mensaje: |
              Cada indicador vira alrededor de su propio $\mathrm{p}K_a$. El
              rojo de metilo, con $\mathrm{p}K_a = 5{,}10$, vira en medio
              ácido; la fenolftaleína, en medio básico.
          - texto: >-
              La del agua, $K_w = [\mathrm{H^+}][\mathrm{OH^-}]$
            mensaje: |
              El agua fija la relación entre protones e hidroxilos, pero no
              dice nada del indicador. Para repartir el indicador entre sus
              dos formas hace falta su propia constante.

      - tipo: calcular
        titulo: El pKa del indicador
        pregunta: |
          ¿Cuánto vale el $\mathrm{p}K_a$ del rojo de metilo?
        respuesta:
          tipo: numero
          valor: '5.10'
          tolerancia: 0.01
          formato: el pKa, con dos decimales
        distractores:
          - valor: '-5.10'
            mensaje: |
              Te falta el signo menos de la definición:
              $\mathrm{p}K_a = -\log K_a$. Con una constante menor que 1, el
              pKa sale positivo.
          - valor: '8.90'
            mensaje: |
              Es $14 - \mathrm{p}K_a$, el pKb de la forma amarilla. El que
              decide el viraje es el pKa del indicador.
        pista: |
          $\mathrm{p}K_a = -\log K_a$.
        desarrollo: |
          $$
          \mathrm{p}K_a = -\log(7{,}93\cdot 10^{-6}) = 5{,}10
          $$

      - tipo: calcular
        titulo: El extremo ácido del viraje
        pregunta: |
          Por el lado ácido, el amarillo deja de verse cuando la forma iónica
          es el 12 %. ¿A qué pH ocurre?
        respuesta:
          tipo: numero
          valor: '4.235'
          tolerancia: 0.015
          formato: el pH, con dos decimales
        distractores:
          - valor: '3.91'
            mensaje: |
              Has puesto el 6 % en el lado ácido. El 6 % es de la forma
              **roja**, y marca el extremo básico: por debajo de 6 % de rojo ya
              solo se ve amarillo. El extremo ácido lo marca el 12 % de
              amarillo.
          - valor: '4.18'
            mensaje: |
              Has comparado el 12 % con el total, $\log 0{,}12$. En Henderson
              va el cociente entre las dos formas: 12 % de amarillo frente a
              88 % de rojo, $\log(12/88)$.
        pista: |
          Con un 12 % de forma amarilla queda un 88 % de roja:
          $\mathrm{pH} = \mathrm{p}K_a + \log(12/88)$.
        desarrollo: |
          $$
          \mathrm{pH} = 5{,}101 + \log\frac{12}{88} = 5{,}101 - 0{,}865 = 4{,}24
          $$

          Es el extremo que da la colección. Los ejercicios resueltos escriben
          «5,10 − 0,86», con el logaritmo cortado en vez de redondeado: el
          resultado es el mismo.

      - tipo: calcular
        titulo: El extremo básico del viraje
        pregunta: |
          Por el lado básico, el rojo deja de verse cuando la forma no ionizada
          es el 6 %. ¿A qué pH ocurre?
        respuesta:
          tipo: numero
          valor: '6.296'
          tolerancia: 0.015
          formato: el pH, con dos decimales
        distractores:
          - valor: '5.97'
            mensaje: |
              Has puesto el 12 % en el lado básico. Ese es el umbral del
              amarillo, que marca el extremo ácido; el básico lo marca el 6 %
              de rojo, con un 94 % de amarillo.
          - valor: '6.32'
            mensaje: |
              Has comparado el 6 % con el total, $-\log 0{,}06$. En Henderson
              va el cociente entre las dos formas: 94 % de amarillo frente a
              6 % de rojo.
        pista: |
          Con un 6 % de forma roja hay un 94 % de amarilla:
          $\mathrm{pH} = \mathrm{p}K_a + \log(94/6)$.
        desarrollo: |
          $$
          \mathrm{pH} = 5{,}101 + \log\frac{94}{6} = 5{,}101 + 1{,}195 = 6{,}30
          $$

          Es el extremo que da la colección, y la misma cuenta de los
          ejercicios resueltos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El indicador es un ácido débil, HInd rojo e Ind⁻ amarillo, con
              $\mathrm{p}K_a = 5{,}10$.
          - texto: >-
              El pH fija el cociente entre las dos formas:
              $\mathrm{pH} = \mathrm{p}K_a + \log([\mathrm{Ind^-}]/[\mathrm{HInd}])$.
          - texto: >-
              Con un 12 % de amarillo y un 88 % de rojo, el amarillo no se ve:
              pH 4,24.
          - texto: >-
              Con un 6 % de rojo y un 94 % de amarillo, el rojo no se ve: pH
              6,30.
          - texto: >-
              El viraje es simétrico alrededor del pKa, así que va de 4,10 a
              6,10.
            trampa: true
            mensaje: |
              «pKa ± 1» es una regla aproximada, y aquí el propio enunciado la
              desmiente: el ojo necesita un 12 % de amarillo para verlo, pero
              distingue el rojo ya con un 6 %. Con umbrales distintos el
              intervalo sale descentrado, 0,87 por debajo del pKa y 1,20 por
              encima.
        veredicto: |
          El intervalo de viraje sale de los dos umbrales de color, no de una
          regla fija alrededor del pKa.

    resolucion: |
      **Qué es un indicador.** Un ácido débil cuyas dos formas tienen colores
      distintos:

      $$
      \mathrm{HInd} + \mathrm{H_2O} \;\rightleftharpoons\; \mathrm{Ind^-} + \mathrm{H_3O^+}
      \qquad
      \mathrm{p}K_a = -\log(7{,}93\cdot 10^{-6}) = 5{,}10
      $$

      El pH de la disolución fija el cociente entre las dos formas, y con él
      el color:

      $$
      \mathrm{pH} = \mathrm{p}K_a + \log\frac{[\mathrm{Ind^-}]}{[\mathrm{HInd}]}
      $$

      **Los dos extremos.** Por el lado ácido, el amarillo deja de verse con
      un 12 % de forma iónica; por el básico, el rojo deja de verse con un 6 %
      de forma no ionizada:

      $$
      \mathrm{pH}_{\text{ácido}} = 5{,}10 + \log\frac{12}{88} = 4{,}24
      \qquad
      \mathrm{pH}_{\text{básico}} = 5{,}10 + \log\frac{94}{6} = 6{,}30
      $$

      $$
      \boxed{\text{viraje entre pH } 4{,}24 \text{ y } 6{,}30}
      $$

      Coincide con la colección y con los ejercicios resueltos del tema 9,
      que hacen la misma cuenta.

      **Lo que enseña.** El intervalo de viraje no es un dato universal
      «pKa ± 1»: sale de lo que el ojo distingue. Aquí se necesita el doble
      de amarillo que de rojo para verlo, y el intervalo sale descentrado
      hacia el lado básico.

  - id: colfq9-4-dos-acidos-debiles-en-el-mismo-vaso
    titulo: Dos ácidos débiles en el mismo vaso, y los protones que comparten
    fuente: >-
      Problema 4 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, y los
      ejercicios resueltos del tema 9 la desarrollan a mano, con 1,75 × 10⁻⁵
      para el acético donde el enunciado da 1,8 × 10⁻⁵; la diferencia no
      llega a una centésima de pH. El diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      ¿Cuál será el pH de una solución que contiene por litro 0,1 moles de
      ácido acético y 0,1 moles de ácido monocloroacético?

      Ka(CH3-COOH) = 1,8 x 10⁻⁵, Ka (ClCH2-COOH) = 1,6 x 10⁻⁴.
    pide: El pH de la mezcla de los dos ácidos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos ácidos débiles en el mismo vaso. ¿Cómo se combinan sus
          protones?
        opciones:
          - texto: >-
              Los comparten: cada ácido se disocia menos por los protones del
              otro, y $[\mathrm{H^+}]^{2} \approx C_1K_1 + C_2K_2$
            correcta: true
            mensaje: |
              Eso es. Los dos equilibrios tienen el protón en común, así que
              los dos se escriben con el mismo $[\mathrm{H^+}]$. Sumando las
              dos constantes multiplicadas por sus concentraciones sale el
              cuadrado de los protones totales.
          - texto: >-
              Se calcula el pH de cada uno por separado y se suman los
              $[\mathrm{H^+}]$
            mensaje: |
              Así se cuenta dos veces el efecto del protón: cada ácido, en
              presencia del otro, se disocia menos que solo. La suma por
              separado da pH 2,27, y el de verdad es 2,37.
          - texto: >-
              Solo cuenta el más fuerte, y el otro se ignora
            mensaje: |
              Es una buena primera estimación —el cloroacético pone el 90 % de
              los protones—, pero da 2,40 y el problema da las dos constantes
              para que cuentes las dos.
          - texto: >-
              Reaccionan entre sí y se neutralizan
            mensaje: |
              Dos ácidos no se neutralizan: ninguno de los dos acepta protones
              del otro en cantidad apreciable. Conviven, y los dos aportan
              protones.

      - tipo: calcular
        titulo: Los protones de la mezcla
        pregunta: |
          ¿Cuánto vale $[\mathrm{H^+}]$ en la mezcla?
        respuesta:
          tipo: numero
          valor: '4.22e-3'
          tolerancia: 8e-5
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '5.34e-3'
            mensaje: |
              Has calculado los protones de cada ácido por separado y los has
              sumado. Cada uno se disocia menos en presencia del otro: los dos
              equilibrios comparten el mismo $[\mathrm{H^+}]$.
          - valor: '1.34e-3'
            mensaje: |
              Son los protones del acético solo. El monocloroacético es casi
              diez veces más fuerte, y es el que pone la mayoría.
          - valor: '4.0e-3'
            mensaje: |
              Son los protones del monocloroacético solo. No es mala primera
              estimación, porque pone el 90 %, pero el acético aporta el 10 %
              que falta.
        pista: |
          Con $x$ del acético e $y$ del cloroacético, los dos equilibrios
          llevan $x + y$ protones. Sumándolos:
          $(x + y)^{2} = 0{,}1\,(K_1 + K_2)$.
        desarrollo: |
          $$
          K_1 = \frac{x\,(x+y)}{0{,}1} \qquad K_2 = \frac{y\,(x+y)}{0{,}1}
          $$

          $$
          (x+y)^{2} = 0{,}1\,(1{,}8\cdot 10^{-5} + 1{,}6\cdot 10^{-4}) = 1{,}78\cdot 10^{-5}
          $$

          $$
          [\mathrm{H^+}] = \sqrt{1{,}78\cdot 10^{-5}} = 4{,}22\cdot 10^{-3}\ \text{M}
          $$

          Se ha despreciado lo disociado frente a 0,1 M en los dos
          denominadores. Sin aproximar sale $4{,}15\cdot 10^{-3}$ M, y la
          casilla lo acepta.

      - tipo: calcular
        titulo: El pH
        pregunta: |
          ¿Cuál es el pH de la mezcla?
        respuesta:
          tipo: numero
          valor: '2.37'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '2.27'
            mensaje: |
              Sale de sumar los protones de cada ácido calculados por
              separado. En la mezcla, cada uno se disocia menos por los
              protones del otro.
          - valor: '2.87'
            mensaje: |
              Es el pH del acético solo. El monocloroacético, casi diez veces
              más fuerte, domina la mezcla.
          - valor: '2.40'
            mensaje: |
              Es el pH del monocloroacético solo. El acético todavía aporta un
              10 % de los protones, y baja el pH tres centésimas.
        pista: |
          $\mathrm{pH} = -\log[\mathrm{H^+}]$.
        desarrollo: |
          $$
          \mathrm{pH} = -\log(4{,}22\cdot 10^{-3}) = 2{,}37
          $$

          Es la respuesta de la colección. Sin aproximar los denominadores sale
          2,38. Los ejercicios resueltos llegan a 2,37 con $K_a = 1{,}75\cdot 10^{-5}$
          para el acético, en lugar del $1{,}8\cdot 10^{-5}$ del enunciado; la
          diferencia no llega a una centésima.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos ácidos son débiles y comparten el mismo
              $[\mathrm{H^+}] = x + y$.
          - texto: >-
              Despreciando lo disociado frente a 0,1 M, las dos constantes
              sumadas dan $(x+y)^{2} = 0{,}1\,(K_1 + K_2)$.
          - texto: >-
              Sale $[\mathrm{H^+}] = 4{,}22\cdot 10^{-3}$ M y pH 2,37.
          - texto: >-
              El acético aporta solo un 10 % de los protones: la fracción
              $K_1/(K_1 + K_2)$.
          - texto: >-
              Cada ácido da los mismos protones que daría solo, así que se
              suman los dos $[\mathrm{H^+}]$ calculados por separado.
            trampa: true
            mensaje: |
              Cada ácido se disocia menos en presencia del otro, porque el
              protón es producto de los dos equilibrios. Sumar por separado
              cuenta de más: da $5{,}34\cdot 10^{-3}$ M y pH 2,27.
        veredicto: |
          Dos equilibrios con una especie común no se suman por separado: se
          resuelven con esa especie compartida.

    resolucion: |
      **Dos equilibrios, un solo protón.** Con $x$ lo que se disocia del
      acético e $y$ del cloroacético, los dos equilibrios llevan el mismo
      $[\mathrm{H^+}] = x + y$. Despreciando lo disociado frente a 0,1 M:

      $$
      K_1 = \frac{x\,(x+y)}{0{,}1} \qquad K_2 = \frac{y\,(x+y)}{0{,}1}
      $$

      Sumando las dos:

      $$
      (x+y)^{2} = 0{,}1\,(K_1 + K_2) = 1{,}78\cdot 10^{-5}
      \quad\Longrightarrow\quad
      [\mathrm{H^+}] = 4{,}22\cdot 10^{-3}\ \text{M}
      $$

      $$
      \boxed{\mathrm{pH} = 2{,}37}
      $$

      Coincide con la colección y con los ejercicios resueltos del tema 9,
      que hacen la misma suma con $1{,}75\cdot 10^{-5}$ para el acético, en
      lugar del $1{,}8\cdot 10^{-5}$ del enunciado: el pH no se mueve a la
      centésima.

      **Quién pone los protones.** El reparto es el de las constantes:
      el acético aporta $K_1/(K_1 + K_2)$, un 10 %, y el cloroacético el
      90 %. Por eso el monocloroacético solo daría 2,40, muy cerca del
      resultado, y el acético solo, 2,87.

      **Y el error de sumar.** Calcular cada ácido como si estuviera solo y
      sumar sus protones da 2,27: cada ácido, en presencia del otro, se
      disocia menos, porque el protón es producto de los dos equilibrios. Es
      el efecto del ion común, con el ion común puesto por el vecino.

  - id: colfq9-5-el-amoniaco-frente-a-la-sosa
    titulo: El amoniaco en una disolución de sosa, y el amonio que casi no aparece
    fuente: >-
      Problema 5 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Da [NH4⁺] = 2,7 × 10⁻⁵ M, que no sale de los
      datos del enunciado: con amoniaco y sosa a 0,1 M sale exactamente Kb,
      1,8 × 10⁻⁵ M. El pH, 13, sí coincide.
    nivel: practica
    enunciado: |
      Si se añade amoniaco 0,1 M a 1 L de solución de hidróxido sódico 0,1 M
      ¿Cuál será la concentración del ión amonio y el pH, si el volumen de la
      solución permanece constante? Kb(NH4OH) = 1,8 x 10⁻⁵.
    pide: La concentración de ion amonio y el pH de la mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le hace la sosa al equilibrio del amoniaco?
        opciones:
          - texto: >-
              Aporta OH⁻, que es producto de ese equilibrio, y lo desplaza
              hacia el NH3: casi no se forma amonio
            correcta: true
            mensaje: |
              Eso es el efecto del ion común. Con 0,1 M de OH⁻ ya presentes, el
              amoniaco apenas se ioniza: el amonio se queda en el orden de
              $K_b$, unas 75 veces menos que si el amoniaco estuviera solo.
          - texto: >-
              Lo neutraliza: la sosa reacciona con el amoniaco
            mensaje: |
              Son dos bases, y una base no neutraliza a otra. Conviven, y la
              fuerte frena a la débil.
          - texto: >-
              Nada: son dos bases que no se tocan, y cada una va a lo suyo
            mensaje: |
              No reaccionan entre sí, pero comparten el OH⁻, y por eso la
              fuerte frena la ionización de la débil.
          - texto: >-
              Suma sus OH⁻ a los del amoniaco calculados por separado
            mensaje: |
              El amoniaco no da los mismos OH⁻ en presencia de la sosa que
              solo: da muchísimos menos. Sumar por separado cuenta de más.

      - tipo: calcular
        titulo: El ion amonio
        pregunta: |
          ¿Cuál es la concentración de ion amonio?
        respuesta:
          tipo: numero
          valor: '1.8e-5'
          tolerancia: 1e-6
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '2.7e-5'
            mensaje: |
              Es la cifra que imprime la colección, y no sale de los datos del
              enunciado: con $[\mathrm{NH_3}] = [\mathrm{OH^-}] = 0{,}1$ M, la
              constante da exactamente $K_b$, $1{,}8\cdot 10^{-5}$ M. Para que
              salieran 2,7·10⁻⁵ M haría falta vez y media más amoniaco que
              sosa.
          - valor: '1.34e-3'
            mensaje: |
              Es el amonio del amoniaco solo, $\sqrt{K_b C}$. Con la sosa
              delante, el OH⁻ de partida no es cero sino 0,1 M, y la
              ionización cae unas 75 veces.
          - valor: '1.8e-6'
            mensaje: |
              Has multiplicado $K_b$ por la concentración de amoniaco sin
              dividir por la de OH⁻: $[\mathrm{NH_4^+}] = K_b[\mathrm{NH_3}]/[\mathrm{OH^-}]$.
        pista: |
          $K_b = \dfrac{[\mathrm{NH_4^+}][\mathrm{OH^-}]}{[\mathrm{NH_3}]}$, con
          el OH⁻ puesto casi entero por la sosa, 0,1 M.
        desarrollo: |
          El OH⁻ lo pone la sosa, 0,1 M, y el amoniaco apenas se ioniza:

          $$
          [\mathrm{NH_4^+}] = K_b\,\frac{[\mathrm{NH_3}]}{[\mathrm{OH^-}]} = 1{,}8\cdot 10^{-5}\cdot\frac{0{,}1}{0{,}1} = 1{,}8\cdot 10^{-5}\ \text{M}
          $$

          Resolviendo sin aproximar, $x(0{,}1 + x)/(0{,}1 - x) = K_b$, sale lo
          mismo hasta la tercera cifra. La colección da $2{,}7\cdot 10^{-5}$
          M, y esa cifra no sale de los datos del enunciado.

      - tipo: calcular
        titulo: El pH
        pregunta: |
          ¿Cuál es el pH de la mezcla?
        respuesta:
          tipo: numero
          valor: '13'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '11.13'
            mensaje: |
              Es el pH del amoniaco solo. La sosa, base fuerte y a la misma
              concentración, es la que manda: el amoniaco apenas añade nada.
          - valor: '1'
            mensaje: |
              Es el pOH. La disolución es de dos bases: el pH tiene que salir
              muy por encima de 7. $\mathrm{pH} = 14 - 1$.
        pista: |
          El OH⁻ del amoniaco, $1{,}8\cdot 10^{-5}$ M, es despreciable frente
          al 0,1 M de la sosa.
        desarrollo: |
          $$
          \mathrm{pOH} = -\log(0{,}1 + 1{,}8\cdot 10^{-5}) = 1{,}00
          \qquad
          \mathrm{pH} = 14 - 1{,}00 = 13{,}00
          $$

          Es la respuesta de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La sosa es una base fuerte y pone 0,1 M de OH⁻ desde el
              principio.
          - texto: >-
              Ese OH⁻ es producto del equilibrio del amoniaco, y lo desplaza
              hacia el NH3: el amoniaco casi no se ioniza.
          - texto: >-
              De $K_b$ sale $[\mathrm{NH_4^+}] = 1{,}8\cdot 10^{-5} \cdot 0{,}1/0{,}1 = 1{,}8\cdot 10^{-5}$ M.
          - texto: >-
              El pH lo fija la sosa: pOH 1 y pH 13.
          - texto: >-
              El amoniaco se ioniza como si estuviera solo, y sus OH⁻ se suman
              a los de la sosa.
            trampa: true
            mensaje: |
              Solo, el amoniaco 0,1 M daría $1{,}34\cdot 10^{-3}$ M de amonio;
              con la sosa delante da unas 75 veces menos, $1{,}8\cdot 10^{-5}$ M.
              El OH⁻ de la sosa es producto de su equilibrio y lo frena. Es el
              efecto del ion común.
        veredicto: |
          Una base fuerte y una débil juntas: la fuerte fija el pH, y la débil
          apenas se ioniza.

    resolucion: |
      **La sosa manda.** Es una base fuerte, 0,1 M: pone 0,1 M de OH⁻ desde
      el principio. El amoniaco es una base débil cuyo equilibrio

      $$
      \mathrm{NH_3} + \mathrm{H_2O} \;\rightleftharpoons\; \mathrm{NH_4^+} + \mathrm{OH^-}
      $$

      tiene al OH⁻ como producto, así que la sosa lo empuja hacia la
      izquierda: el efecto del ion común.

      **El amonio.** Con $[\mathrm{OH^-}] \approx 0{,}1$ M y
      $[\mathrm{NH_3}] \approx 0{,}1$ M:

      $$
      [\mathrm{NH_4^+}] = K_b\,\frac{[\mathrm{NH_3}]}{[\mathrm{OH^-}]} = \boxed{1{,}8\cdot 10^{-5}\ \text{M}}
      $$

      **El pH.** Lo fija la sosa: pOH = 1 y

      $$
      \boxed{\mathrm{pH} = 13}
      $$

      **Una diferencia con la colección.** Da $[\mathrm{NH_4^+}] = 2{,}7\cdot 10^{-5}$
      M, y esa cifra no sale de los datos del enunciado: con amoniaco y sosa
      a la misma concentración, el cociente $[\mathrm{NH_3}]/[\mathrm{OH^-}]$
      vale 1 y el amonio es exactamente $K_b$. Para que salieran
      $2{,}7\cdot 10^{-5}$ M haría falta vez y media más amoniaco que sosa.
      El pH, 13, sí coincide.

      **Lo que enseña.** Solo, el amoniaco 0,1 M tendría
      $1{,}34\cdot 10^{-3}$ M de amonio; al lado de la sosa, unas 75 veces
      menos.
      Una base fuerte no solo pone su pH: apaga a la débil que tenga al lado.

  - id: colfq9-6-el-acetico-con-y-sin-acetato
    titulo: El mismo ácido, con y sin su sal al lado
    fuente: >-
      Problema 6 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular el grado de ionización y el pH de: a) Una solución 0,05 M de
      ácido acético b) De la misma solución a la que se agregan, por litro,
      0,05 moles de acetato sódico.

      **Dato:** Ka(CH3-COOH) = 1,77 x 10⁻⁵
    pide: El grado de ionización y el pH en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b se añade acetato sódico, que es una sal soluble del
          mismo ácido. ¿Qué hace al equilibrio?
        opciones:
          - texto: Lo desplaza hacia el ácido sin disociar, porque añade producto
            correcta: true
            mensaje: |
              Eso es el efecto del ion común. El acetato es uno de los
              productos del equilibrio, y meter más producto empuja la
              reacción hacia atrás: se disocia menos ácido y hay menos
              protones.
          - texto: Nada, porque el acetato sódico es una sal neutra
            mensaje: |
              «Sal» no significa «inerte». El acetato sódico se disocia por
              completo y suelta acetato, que es exactamente una de las
              especies del equilibrio que estamos estudiando.
          - texto: Lo desplaza hacia los iones, porque añade más soluto
            mensaje: |
              Añadir soluto no desplaza en una dirección u otra por sí solo:
              depende de **qué** soluto. Aquí el que entra está en el lado de
              los productos, así que el desplazamiento va hacia atrás.
          - texto: Lo neutraliza, porque el ion sodio captura los protones
            mensaje: |
              El Na⁺ es el catión de una base fuerte y no reacciona con nada
              en disolución: es un espectador. Quien actúa es el acetato.

      - tipo: calcular
        titulo: El grado de ionización sin la sal
        pregunta: |
          Para la solución 0,05 M de ácido acético sola, ¿cuál es el grado de
          ionización, en tanto por ciento?
        respuesta:
          tipo: numero
          valor: '1.86'
          tolerancia: 0.03
          formato: un número, con dos decimales, en tanto por ciento
        distractores:
          - valor: '0.0186'
            mensaje: |
              Ese es el grado en tanto por uno. El enunciado pide tanto por
              ciento, así que hay que multiplicar por cien.
          - valor: '3.54'
            mensaje: |
              Parece que has doblado el resultado, o que has usado la
              concentración de otro apartado. Comprueba que
              $\alpha = x / C$ con la $C$ de este.
        pista: |
          Resuelve $x^{2}/(0{,}05 - x) = 1{,}77 \times 10^{-5}$ y divide la
          $x$ entre $0{,}05$.
        desarrollo: |
          $$
          \frac{x^{2}}{0{,}05 - x} = 1{,}77 \times 10^{-5} \quad\Longrightarrow\quad x = 9{,}32 \times 10^{-4}
          $$

          $$
          \alpha = \frac{9{,}32 \times 10^{-4}}{0{,}05} = 0{,}0186 = 1{,}86\ \%
          $$

          Y el pH es $-\log(9{,}32 \times 10^{-4}) = 3{,}03$.

      - tipo: calcular
        titulo: El pH con la sal
        pregunta: |
          Con 0,05 moles de acetato sódico por litro, ¿cuál es el pH?
        respuesta:
          tipo: numero
          valor: '4.75'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '3.03'
            mensaje: |
              Ese es el pH sin la sal. Si el acetato no cambiara nada, el
              apartado b no existiría: el ion común sube el pH en más de una
              unidad y tres cuartos.
          - valor: '9.25'
            mensaje: |
              Has calculado el pOH y lo has dado como pH, o has usado $K_b$
              del acetato. La disolución sigue siendo ácida: hay tanto ácido
              como base conjugada, y el ácido es acético.
          - valor: '5.05'
            mensaje: |
              Revisa el cociente de Henderson-Hasselbalch. Como las
              concentraciones de ácido y de sal son iguales, su logaritmo es
              cero y el pH tiene que salir exactamente $\mathrm{p}K_a$.
        pista: |
          Ácido y base conjugada a la misma concentración. ¿Cuánto vale
          entonces $\log([\mathrm{A^-}]/[\mathrm{HA}])$?
        desarrollo: |
          Es una disolución reguladora, y con las dos concentraciones iguales
          Henderson-Hasselbalch se queda en un solo término:

          $$
          \mathrm{pH} = \mathrm{p}K_a + \log\frac{[\mathrm{A^-}]}{[\mathrm{HA}]} = \mathrm{p}K_a + \log 1 = \mathrm{p}K_a
          $$

          $$
          \mathrm{pH} = -\log(1{,}77 \times 10^{-5}) = 4{,}75
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Sola, la solución 0,05 M se disocia hasta x = 9,32 × 10⁻⁴ M, o sea un 1,86 %, y da pH = 3,03.'
          - texto: 'El acetato sódico se disocia por completo y aporta 0,05 M de acetato, que es uno de los productos del equilibrio.'
          - texto: 'Por el efecto del ion común, el equilibrio retrocede y el ácido se disocia mucho menos: el grado cae a 3,54 × 10⁻² %.'
          - texto: 'Con ácido y base conjugada a la misma concentración, el pH es exactamente pKa = 4,75.'
          - texto: 'El grado de ionización cae porque el acetato sódico consume ácido acético al reaccionar con él.'
            trampa: true
            mensaje: |
              No hay reacción entre el acético y su propio acetato: son las
              dos caras del mismo equilibrio. El ácido no se consume, sigue
              ahí entero; lo que pasa es que se disocia menos porque el
              producto ya está presente. Confundir «se desplaza» con «se
              consume» es el error clásico de Le Chatelier.
    resolucion: |
      **a · El ácido solo.** Con $K_a = 1{,}77 \times 10^{-5}$ y $C = 0{,}05$ M:

      $$
      \frac{x^{2}}{0{,}05 - x} = 1{,}77 \times 10^{-5} \quad\Longrightarrow\quad x = 9{,}32 \times 10^{-4}\ \mathrm{M}
      $$

      $$
      \alpha = 1{,}86\ \% \qquad \mathrm{pH} = 3{,}03
      $$

      **b · El ácido con su sal.** El acetato sódico es una sal soluble y se
      disocia del todo, así que aporta $0{,}05$ M de acetato. El sodio es
      espectador. Ahora hay a la vez $0{,}05$ M de ácido y $0{,}05$ M de su
      base conjugada, que es la definición de una **disolución reguladora**.

      $$
      \mathrm{pH} = \mathrm{p}K_a + \log\frac{[\mathrm{A^-}]}{[\mathrm{HA}]} = 4{,}75 + \log 1 = 4{,}75
      $$

      Y el grado de ionización se desploma:
      $\alpha = [\mathrm{H^+}]/C = 1{,}77 \times 10^{-5}/0{,}05 = 3{,}54 \times 10^{-4}$,
      o sea $3{,}54 \times 10^{-2}\ \%$. **Cincuenta veces menos que antes.**

      **Lo que hay que llevarse.** El ácido es el mismo y la concentración es
      la misma; lo único que ha cambiado es que ahora hay producto en el vaso
      desde el principio. Eso empuja el equilibrio hacia atrás —el efecto del
      ion común— y el resultado es una disolución que resiste los cambios de
      pH.

      Y un atajo que conviene reconocer al vuelo: **cuando ácido y base
      conjugada están a la misma concentración, el pH es el $\mathrm{p}K_a$ y
      no hay nada que calcular.** Es el punto medio de una valoración, y en el
      examen aparece más de una vez.

  - id: colfq9-7-la-reguladora-basica
    titulo: Una reguladora básica, y el pOH que hay que acordarse de convertir
    fuente: >-
      Problema 7 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular el pH de una solución 0,1 M en amoniaco y 0,05 M en cloruro
      amónico.

      **Dato:** Kb(NH4OH) = 1,8 x 10⁻⁵
    pide: El pH de la disolución reguladora.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué papel juega cada una de las dos especies del enunciado?
        opciones:
          - texto: El amoniaco es la base y el ion amonio del cloruro amónico es su ácido conjugado
            correcta: true
            mensaje: |
              Exacto, y por eso esto es una reguladora: hay a la vez una base
              débil y su ácido conjugado en cantidades comparables. El cloruro
              se disocia del todo y el ion cloruro es espectador.
          - texto: Los dos son bases, así que sus efectos se suman
            mensaje: |
              El cloruro amónico no es una base: al disolverse suelta NH₄⁺,
              que es un **ácido** débil —cede un protón y se convierte en
              amoniaco—. Los dos no se suman, se compensan.
          - texto: El amoniaco es la base y el cloruro es su ácido conjugado
            mensaje: |
              Casi. El ácido conjugado del amoniaco es el **amonio**, NH₄⁺,
              que es lo que aporta la sal. El cloruro, Cl⁻, viene de un ácido
              fuerte y no participa en nada.
          - texto: El cloruro amónico neutraliza el amoniaco y queda agua y sal
            mensaje: |
              No hay neutralización: no se está mezclando un ácido fuerte con
              una base fuerte, sino una base débil con su propio conjugado.
              Los dos conviven en equilibrio, y de eso vive una reguladora.

      - tipo: calcular
        titulo: El pOH de la mezcla
        pregunta: |
          Aplicando Henderson-Hasselbalch en su forma básica, ¿cuánto vale el
          pOH?
        respuesta:
          tipo: numero
          valor: '4.44'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '5.05'
            mensaje: |
              Tienes el cociente del revés. En la forma básica va
              $\log([\text{ácido}]/[\text{base}])$, o sea amonio entre
              amoniaco: $0{,}05/0{,}1$, que es menor que uno y **resta**.
          - valor: '4.74'
            mensaje: |
              Ese es $\mathrm{p}K_b$ a secas, que sería el pOH si las dos
              concentraciones fueran iguales. Aquí hay el doble de base que de
              ácido, así que el término logarítmico no es cero.
        pista: |
          $\mathrm{pOH} = \mathrm{p}K_b + \log\dfrac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]}$
        desarrollo: |
          $$
          \mathrm{p}K_b = -\log(1{,}8 \times 10^{-5}) = 4{,}74
          $$

          $$
          \mathrm{pOH} = 4{,}74 + \log\frac{0{,}05}{0{,}1} = 4{,}74 - 0{,}30 = 4{,}44
          $$

      - tipo: calcular
        titulo: El pH
        pregunta: |
          ¿Y el pH de la disolución?
        respuesta:
          tipo: numero
          valor: '9.56'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '4.44'
            mensaje: |
              Ese es el pOH, no el pH. Es el descuido más caro de este tema y
              el más fácil de detectar: una disolución de amoniaco tiene que
              salir **básica**, así que un pH por debajo de 7 es imposible
              antes de mirar ninguna cuenta.
          - valor: '8.95'
            mensaje: |
              Sale de invertir el cociente en el paso anterior. Comprueba el
              pOH antes de convertirlo.
        pista: |
          $\mathrm{pH} + \mathrm{pOH} = 14$
        desarrollo: |
          $$
          \mathrm{pH} = 14 - 4{,}44 = 9{,}56
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'El amoniaco es una base débil y el cloruro amónico aporta su ácido conjugado, el ion amonio: la mezcla es una disolución reguladora.'
          - texto: 'pKb = −log(1,8 × 10⁻⁵) = 4,74.'
          - texto: 'Como hay el doble de base que de ácido, el término logarítmico resta 0,30 y el pOH baja a 4,44.'
          - texto: 'Y el pH es 14 − 4,44 = 9,56, básico, que es lo que cabía esperar de una disolución de amoniaco.'
          - texto: 'Al haber más base que ácido, el pOH sube por encima de pKb y la disolución es aún más básica.'
            trampa: true
            mensaje: |
              La conclusión es cierta y el camino está al revés. Más base
              significa **más** básico, o sea pH mayor, o sea pOH **menor**.
              Si el pOH subiera por encima de pKb, el pH bajaría y la
              disolución sería menos básica. Es el signo del logaritmo lo que
              hay que vigilar, y por eso conviene comprobar el sentido antes
              de dar el número.
    resolucion: |
      **Qué hay en el vaso.** Amoniaco, una base débil, y cloruro amónico, una
      sal que al disolverse da NH₄⁺ —el ácido conjugado del amoniaco— y Cl⁻,
      que viene de un ácido fuerte y no hace nada. Base débil más su conjugado
      en cantidades comparables es la definición de **disolución reguladora**.

      **La forma básica de Henderson-Hasselbalch.** Es la misma ecuación de
      siempre, escrita en pOH para no tener que pasar por $K_a$:

      $$
      \mathrm{pOH} = \mathrm{p}K_b + \log\frac{[\text{ácido conjugado}]}{[\text{base}]}
      $$

      $$
      \mathrm{pOH} = 4{,}74 + \log\frac{0{,}05}{0{,}1} = 4{,}74 - 0{,}30 = 4{,}44
      $$

      $$
      \mathrm{pH} = 14 - 4{,}44 = 9{,}56
      $$

      **Las dos comprobaciones que evitan los dos errores del problema.**

      La primera es de **signo**: hay el doble de base que de ácido, así que la
      disolución tiene que ser más básica que si estuvieran igualadas. Con las
      dos iguales el pOH sería $\mathrm{p}K_b = 4{,}74$; aquí sale menor,
      $4{,}44$, y por tanto el pH sale mayor. Cuadra.

      La segunda es de **magnitud**: es amoniaco, así que el pH tiene que
      pasar de 7. Si te sale 4,44 no has hecho mal la cuenta, has olvidado
      convertir el pOH — y eso se ve sin repasar nada.

  - id: colfq9-8-el-acetico-diluido-y-neutralizado
    titulo: El acético, diluido cinco veces y neutralizado justo
    fuente: >-
      Problema 8 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      a) 100 mL de una solución de ácido acético (CH3-COOH) 0,2 M se diluyen
      con 400 mL de agua, calcular el pH de la solución resultante, b)
      Calcular el pH si a los 100 mL de la solución de ácido acético 0,2 M se
      adicionan 200 mL de una solución de hidróxido sódico 0,1 M. Suponer que
      los volúmenes son aditivos. Ka (CH3-COOH) = 1,8 x 10⁻⁵
    pide: El pH del ácido diluido, y el pH al añadirle la sosa.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) se juntan 20 mmol de acético con 20 mmol de sosa. ¿Qué queda en
          el vaso?
        opciones:
          - texto: >-
              Solo acetato de sodio: es el punto de equivalencia, y el acetato
              hidroliza y da pH básico
            correcta: true
            mensaje: |
              Eso es. Los milimoles se igualan, no queda ácido ni sobra sosa, y
              lo que manda es la base conjugada: el pH sale por encima de 7.
          - texto: >-
              Agua y una sal neutra, así que pH 7
            mensaje: |
              Solo sería neutra si el ácido fuera fuerte. El acetato viene de
              un ácido débil, reacciona con el agua y suelta OH⁻.
          - texto: >-
              Un tampón de acético y acetato
            mensaje: |
              Para un tampón tendría que quedar ácido sin neutralizar, y aquí
              la sosa lo gasta entero: 20 mmol contra 20 mmol.
          - texto: >-
              Sosa en exceso, porque se echa el doble de volumen
            mensaje: |
              El doble de volumen, pero a la mitad de concentración: los mismos
              20 mmol. Lo que se compara son los milimoles, no los mililitros.

      - tipo: calcular
        titulo: El pH del ácido diluido
        pregunta: |
          a) ¿Cuál es el pH del ácido después de diluirlo?
        respuesta:
          tipo: numero
          valor: '3.07'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '2.72'
            mensaje: |
              Es el pH del acético 0,2 M, sin diluir. Al añadir 400 mL de agua
              el volumen pasa a 500 mL y la concentración a 0,04 M.
          - valor: '3.02'
            mensaje: |
              Has tomado 400 mL como volumen final. El agua se añade a los
              100 mL que ya había: el total es 500 mL, y la concentración 0,04
              M, no 0,05.
          - valor: '1.40'
            mensaje: |
              Es el pH si el acético fuera fuerte, $-\log 0{,}04$. Es débil: se
              disocia un 2 %.
        pista: |
          La concentración pasa a $0{,}2 \cdot 100/500$. Después, ácido débil
          solo: $[\mathrm{H^+}] = \sqrt{K_a C}$.
        desarrollo: |
          $$
          C = \frac{100 \cdot 0{,}2}{500} = 0{,}04\ \text{M}
          $$

          $$
          [\mathrm{H^+}] = \sqrt{1{,}8\cdot 10^{-5} \cdot 0{,}04} = 8{,}49\cdot 10^{-4}
          \qquad
          \mathrm{pH} = -\log(8{,}49\cdot 10^{-4}) = 3{,}07
          $$

          Es la respuesta de la colección. Sin aproximar sale 3,08, y la
          casilla acepta las dos.

      - tipo: calcular
        titulo: El acetato en el punto de equivalencia
        pregunta: |
          b) Tras añadir la sosa, ¿cuál es la concentración de acetato?
        respuesta:
          tipo: numero
          valor: '0.0667'
          tolerancia: 0.001
          formato: la concentración en mol/L, con cuatro cifras decimales
        distractores:
          - valor: '0.2'
            mensaje: |
              Has dejado el acetato en los 100 mL del ácido. Con la sosa, el
              volumen es $100 + 200 = 300$ mL.
          - valor: '0.1'
            mensaje: |
              Has repartido los 20 mmol en los 200 mL de la sosa. El volumen
              total es la suma de los dos: 300 mL.
        pista: |
          Se forman 20 mmol de acetato, repartidos en 300 mL.
        desarrollo: |
          $$
          n_{\text{ácido}} = 100 \cdot 0{,}2 = 20\ \text{mmol} \qquad n_{\text{sosa}} = 200 \cdot 0{,}1 = 20\ \text{mmol}
          $$

          $$
          [\mathrm{CH_3COO^-}] = \frac{20}{300} = 0{,}0667\ \text{M}
          $$

      - tipo: calcular
        titulo: El pH en el punto de equivalencia
        pregunta: |
          ¿Cuál es el pH de esa disolución?
        respuesta:
          tipo: numero
          valor: '8.78'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '7.00'
            mensaje: |
              Supone que toda neutralización acaba en pH 7. Solo pasa con ácido
              y base fuertes; aquí queda acetato, que es una base, y el pH sube.
          - valor: '9.02'
            mensaje: |
              Sale sin repartir el acetato en los 300 mL: con 0,2 M, en los
              100 mL del ácido, da 9,02; con 0,1 M, en los 200 mL de la sosa,
              8,87. El volumen total es 300 mL: 0,0667 M y pH 8,78.
          - valor: '5.22'
            mensaje: |
              Es el pOH. La disolución es básica: $\mathrm{pH} = 14 - 5{,}22$.
        pista: |
          El acetato hidroliza con $K_b = K_w/K_a$, y
          $[\mathrm{OH^-}] = \sqrt{K_b C}$.
        desarrollo: |
          $$
          K_b = \frac{10^{-14}}{1{,}8\cdot 10^{-5}} = 5{,}56\cdot 10^{-10}
          $$

          $$
          [\mathrm{OH^-}] = \sqrt{5{,}56\cdot 10^{-10} \cdot 0{,}0667} = 6{,}09\cdot 10^{-6}
          $$

          $$
          \mathrm{pOH} = -\log(6{,}09\cdot 10^{-6}) = 5{,}22
          \qquad
          \mathrm{pH} = 14 - 5{,}22 = 8{,}78
          $$

          Es la respuesta de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Al diluir con 400 mL, el acético pasa a 0,04 M en 500 mL, y
              como ácido débil solo da pH 3,07.
          - texto: >-
              b) 100 mL de ácido 0,2 M y 200 mL de sosa 0,1 M son 20 mmol de
              cada uno: el punto de equivalencia.
          - texto: >-
              Queda solo acetato, 20 mmol en 300 mL: 0,0667 M.
          - texto: >-
              El acetato hidroliza con $K_b = 5{,}56\cdot 10^{-10}$: pOH 5,22 y
              pH 8,78.
          - texto: >-
              Como el ácido y la base se han neutralizado exactamente, el pH en
              b) es 7.
            trampa: true
            mensaje: |
              Neutralizar no es quedar neutro. En el punto de equivalencia lo
              que queda es la base conjugada del ácido, y si el ácido era
              débil, su conjugada reacciona con el agua y sube el pH. Solo con
              ácido y base fuertes cae en 7.
        veredicto: |
          En el punto de equivalencia de un ácido débil manda su base
          conjugada: el pH pasa de 7.

    resolucion: |
      **a · El ácido diluido.** Al añadir 400 mL de agua a los 100 mL, la
      concentración baja cinco veces:

      $$
      C = \frac{0{,}2 \cdot 100}{500} = 0{,}04\ \text{M}
      \qquad
      [\mathrm{H^+}] = \sqrt{K_a C} = 8{,}49\cdot 10^{-4}
      \qquad
      \boxed{\mathrm{pH} = 3{,}07}
      $$

      Se disocia un 2 %, así que la aproximación vale.

      **b · Con la sosa.** Antes de ninguna fórmula, los milimoles: 20 de
      ácido y 20 de sosa. Es el punto de equivalencia, y en el vaso solo
      queda acetato, 20 mmol en 300 mL, 0,0667 M. El acetato es la base
      conjugada de un ácido débil, y reacciona con el agua:

      $$
      K_b = \frac{K_w}{K_a} = 5{,}56\cdot 10^{-10}
      \qquad
      [\mathrm{OH^-}] = \sqrt{K_b C} = 6{,}09\cdot 10^{-6}
      $$

      $$
      \boxed{\mathrm{pH} = 14 - 5{,}22 = 8{,}78}
      $$

      Las dos coinciden con la colección.

      **Dos descuidos que este problema caza.** El primero es de volumen: en
      a) el total es 500 mL, no 400, y en b) son 300 mL, no los 100 del ácido.
      El segundo es de concepto: la equivalencia de un ácido débil no cae en
      pH 7, porque lo que queda en el vaso es una base.

  - id: colfq9-9-la-reguladora-de-ph-9
    titulo: Una reguladora de pH 9 hecha con amoniaco y cloruro amónico
    fuente: >-
      Problema 9 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Se quiere preparar 1 L de solución reguladora de pH = 9. ¿Qué volumen de
      amoniaco 0,1 M y cloruro amónico 0,2 M hay que mezclar? Se supone que
      los volúmenes son aditivos. Kb (NH4OH) = 1,8 x 10⁻⁵.
    pide: El volumen de cada disolución que hay que mezclar para tener 1 L de reguladora de pH 9.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma de Henderson-Hasselbalch toca para una reguladora de
          amoniaco?
        opciones:
          - texto: >-
              $\mathrm{pOH} = \mathrm{p}K_b + \log([\mathrm{NH_4^+}]/[\mathrm{NH_3}])$,
              con el pOH que corresponde a pH 9, que es 5
            correcta: true
            mensaje: |
              Eso es. La forma básica da el pOH, y el pH pedido hay que pasarlo
              antes a pOH. Con la ácida sale lo mismo usando el pKa del
              amonio, $14 - 4{,}74 = 9{,}26$.
          - texto: >-
              $\mathrm{pH} = \mathrm{p}K_b + \log([\mathrm{NH_4^+}]/[\mathrm{NH_3}])$,
              con pH 9
            mensaje: |
              Mezcla una forma con la otra: con $\mathrm{p}K_b$ lo que sale es
              el pOH. Poniendo el 9 ahí, el cociente sale de 18 000.
          - texto: >-
              $\mathrm{pH} = \mathrm{p}K_a + \log([\mathrm{NH_4^+}]/[\mathrm{NH_3}])$
            mensaje: |
              El cociente va del revés. En la forma ácida, arriba va la base
              —el amoniaco— y abajo su ácido conjugado, el amonio.
          - texto: >-
              Ninguna: antes hay que saber la concentración total de la
              reguladora
            mensaje: |
              Henderson solo pide el cociente entre las dos especies, y ese
              cociente sale del pH. Las concentraciones de partida sirven
              después, para pasar del cociente a los volúmenes.

      - tipo: calcular
        titulo: El cociente amonio entre amoniaco
        pregunta: |
          ¿Cuánto tiene que valer $[\mathrm{NH_4^+}]/[\mathrm{NH_3}]$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.02
          formato: el cociente, con dos decimales
        distractores:
          - valor: '0.556'
            mensaje: |
              Tienes el cociente del revés: eso es amoniaco entre amonio. Para
              que el pOH suba hasta 5 hace falta más ácido conjugado que base.
          - valor: '18000'
            mensaje: |
              Has puesto el pH, 9, donde va el pOH. Con $\mathrm{p}K_b$ la
              ecuación da el pOH, que aquí es 5.
        pista: |
          Con pH 9, $[\mathrm{OH^-}] = 10^{-5}$ M, y
          $\dfrac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]} = \dfrac{K_b}{[\mathrm{OH^-}]}$.
        desarrollo: |
          $$
          \mathrm{pOH} = 14 - 9 = 5
          $$

          $$
          \frac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]} = \frac{K_b}{[\mathrm{OH^-}]} = \frac{1{,}8\cdot 10^{-5}}{10^{-5}} = 1{,}8
          $$

      - tipo: calcular
        titulo: El volumen de amoniaco
        pregunta: |
          ¿Qué volumen de amoniaco 0,1 M hay que poner?
        respuesta:
          tipo: numero
          valor: '0.526'
          tolerancia: 0.005
          formato: el volumen en litros, con tres cifras decimales
        distractores:
          - valor: '0.783'
            mensaje: |
              Sale del cociente invertido, amoniaco entre amonio igual a 1,8.
              Para pH 9 tiene que haber más amonio que amoniaco.
          - valor: '0.357'
            mensaje: |
              Has repartido los volúmenes en proporción 1,8 a 1, olvidando que
              las dos disoluciones tienen concentraciones distintas. Lo que va
              en proporción 1,8 son los moles: $0{,}2\,V_2 = 1{,}8 \cdot 0{,}1\,V_1$.
          - valor: '0.5'
            mensaje: |
              A partes iguales el cociente de moles sería 2, no 1,8, porque el
              cloruro amónico está al doble de concentración. El pH saldría
              8,95, no 9.
        pista: |
          Con $V_1$ litros de amoniaco y $1 - V_1$ de cloruro amónico, los
          moles tienen que cumplir $0{,}2\,(1 - V_1) = 1{,}8 \cdot 0{,}1\,V_1$.
        desarrollo: |
          El volumen es el mismo para los dos, así que el cociente va con
          moles:

          $$
          \frac{0{,}2\,(1 - V_1)}{0{,}1\,V_1} = 1{,}8
          \quad\Longrightarrow\quad
          0{,}2 = 0{,}38\,V_1
          $$

          $$
          V_1 = \frac{0{,}2}{0{,}38} = 0{,}526\ \text{L}
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: El volumen de cloruro amónico
        pregunta: |
          ¿Y de cloruro amónico 0,2 M?
        respuesta:
          tipo: numero
          valor: '0.474'
          tolerancia: 0.005
          formato: el volumen en litros, con tres cifras decimales
        distractores:
          - valor: '0.217'
            mensaje: |
              Sale del cociente invertido. Para pH 9 el amonio tiene que ser
              1,8 veces el amoniaco, no al revés.
          - valor: '0.643'
            mensaje: |
              Has repartido los volúmenes en proporción 1,8 a 1 sin tener en
              cuenta que el cloruro amónico está al doble de concentración.
        pista: |
          Los dos volúmenes suman 1 L.
        desarrollo: |
          $$
          V_2 = 1 - 0{,}526 = 0{,}474\ \text{L}
          $$

          Comprobación: 0,0948 mol de amonio frente a 0,0526 de amoniaco, un
          cociente de 1,80. Es la respuesta de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              pH 9 es pOH 5, y en la forma básica de Henderson
              $\mathrm{pOH} = \mathrm{p}K_b + \log([\mathrm{NH_4^+}]/[\mathrm{NH_3}])$.
          - texto: >-
              El cociente tiene que valer $K_b/[\mathrm{OH^-}] = 1{,}8$.
          - texto: >-
              Con volúmenes aditivos, los moles cumplen
              $0{,}2\,(1 - V_1) = 1{,}8 \cdot 0{,}1\,V_1$.
          - texto: >-
              Salen 0,526 L de amoniaco y 0,474 L de cloruro amónico.
          - texto: >-
              Como el cociente es 1,8, hay que mezclar 1,8 litros de cloruro
              amónico por cada litro de amoniaco.
            trampa: true
            mensaje: |
              El 1,8 es un cociente de **moles**, no de volúmenes. El cloruro
              amónico está al doble de concentración, así que cada litro suyo
              lleva el doble de moles: hace falta menos volumen del que parece,
              y sale menos de un litro de cloruro por cada litro de amoniaco.
        veredicto: |
          Henderson da el cociente de moles; las concentraciones de partida lo
          convierten en volúmenes.

    resolucion: |
      **El cociente que pide el pH.** pH 9 es pOH 5, y con la forma básica de
      Henderson:

      $$
      \mathrm{pOH} = \mathrm{p}K_b + \log\frac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]}
      \quad\Longrightarrow\quad
      \frac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]} = \frac{K_b}{10^{-5}} = 1{,}8
      $$

      **Del cociente a los volúmenes.** Las dos especies acaban en el mismo
      litro, así que el cociente vale igual con moles. Con $V_1$ litros de
      amoniaco 0,1 M y $1 - V_1$ de cloruro amónico 0,2 M:

      $$
      \frac{0{,}2\,(1 - V_1)}{0{,}1\,V_1} = 1{,}8
      \quad\Longrightarrow\quad
      V_1 = 0{,}526\ \text{L}
      $$

      $$
      \boxed{0{,}526\ \text{L de amoniaco} \qquad 0{,}474\ \text{L de cloruro amónico}}
      $$

      Coinciden con la colección.

      **El error de proporción.** El 1,8 es un cociente de moles. Quien lo
      aplica a los volúmenes mezcla 0,357 L de amoniaco con 0,643 de cloruro,
      y como el cloruro está al doble de concentración, el cociente real le
      sale 3,6 y el pH, 8,7.

  - id: colfq9-10-seis-ph-del-mismo-amoniaco
    titulo: Seis pH del mismo amoniaco, y un régimen distinto en cada uno
    fuente: >-
      Problema 10 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, y los
      ejercicios resueltos del tema 9 la desarrollan a mano, con tres
      despistes: el apartado c empieza escribiendo «100 mL 0,2 M» y calcula
      con el 0,1 M del apartado a; el f va rotulado como «d)», y el e escribe
      9,25 + log(0,051/0,099) = 8,97, cuando con 9,25 sale 8,96. El enunciado escribe «10⁻⁻³M» en el apartado c, con un signo menos
      de más. El diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Calcular el pH de:

      **a)** 200 mL de solución de hidróxido amónico 0,1 M

      **b)** 200 mL de solución de cloruro amónico 0,2 M

      **c)** De la solución a) a la que se añade hidróxido sódico hasta
      concentración 10⁻⁻³M

      **d)** De la mezcla de la solución a) y b)

      **e)** Si a la solución del apartado d) se añade hidróxido sódico hasta
      concentración 10⁻³ M

      **f)** Si a la solución del apartado d) se añade ácido clorhídrico hasta
      concentración 10⁻³ M

      Dato: Kb(NH4OH) = 1,8 x 10⁻⁵.

      *En el apartado c) el exponente lleva un signo menos de más, «10⁻⁻³».
      Es 10⁻³ M, como en los apartados e) y f).*
    pide: El pH de las seis disoluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué hay en el vaso en cada apartado?
        opciones:
          - texto: >-
              a) base débil sola; b) sal que hidroliza, ácida; c) base débil
              con base fuerte; d), e) y f) una reguladora, a la que se añade un
              poco de base o de ácido
            correcta: true
            mensaje: |
              Eso es, y cada régimen tiene su fórmula: $\sqrt{K_b C}$ en a), la
              hidrólisis del amonio en b), el equilibrio con el OH⁻ de la sosa
              en c) y Henderson de d) a f).
          - texto: >-
              d) es una neutralización, porque se mezclan una base y una sal
              ácida
            mensaje: |
              El amonio es el ácido conjugado del amoniaco: no se neutralizan,
              conviven. Base débil más su conjugado es la definición de
              reguladora.
          - texto: >-
              b) es neutra, porque el cloruro amónico es una sal
            mensaje: |
              Una sal no es neutra por ser sal. El NH4⁺ viene de una base débil
              y reacciona con el agua soltando H3O⁺: la disolución es ácida.
          - texto: >-
              e) y f) ya no son reguladoras, porque se añade una base o un
              ácido fuerte
            mensaje: |
              Se añade 10⁻³ M frente a 0,05 M de amoniaco y 0,1 M de amonio: la
              reguladora lo absorbe, y para eso existe. Sigue siendo
              Henderson, con el cociente un poco movido.

      - tipo: calcular
        titulo: El amoniaco solo
        pregunta: |
          a) ¿Cuál es el pH del hidróxido amónico 0,1 M?
        respuesta:
          tipo: numero
          valor: '11.13'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '13'
            mensaje: |
              Es el pH si el amoniaco fuera una base fuerte, con
              $[\mathrm{OH^-}] = 0{,}1$ M. Es débil: se ioniza un 1,3 %.
          - valor: '2.87'
            mensaje: |
              Es el pOH. Una disolución de amoniaco es básica: el pH tiene que
              pasar de 7.
        pista: |
          Base débil sola: $[\mathrm{OH^-}] = \sqrt{K_b C}$.
        desarrollo: |
          $$
          [\mathrm{OH^-}] = \sqrt{1{,}8\cdot 10^{-5} \cdot 0{,}1} = 1{,}34\cdot 10^{-3}
          \qquad
          \mathrm{pOH} = -\log(1{,}34\cdot 10^{-3}) = 2{,}87
          $$

          $$
          \mathrm{pH} = 14 - 2{,}87 = 11{,}13
          $$

          Es la respuesta de la colección y la cuenta de los ejercicios
          resueltos.

      - tipo: calcular
        titulo: El cloruro amónico solo
        pregunta: |
          b) ¿Y el del cloruro amónico 0,2 M?
        respuesta:
          tipo: numero
          valor: '4.98'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '7'
            mensaje: |
              Es tomar la sal como neutra. El amonio viene de una base débil e
              hidroliza: la disolución es ácida.
          - valor: '9.02'
            mensaje: |
              Has calculado bien la hidrólisis pero la has leído como básica,
              dando $14 - 4{,}98$. El amonio suelta H3O⁺, no OH⁻: lo que sale
              de la raíz es $[\mathrm{H_3O^+}]$.
        pista: |
          $\mathrm{NH_4^+} + \mathrm{H_2O} \rightleftharpoons \mathrm{NH_3} + \mathrm{H_3O^+}$,
          con $K_h = K_w/K_b$.
        desarrollo: |
          $$
          K_h = \frac{10^{-14}}{1{,}8\cdot 10^{-5}} = 5{,}56\cdot 10^{-10}
          $$

          $$
          [\mathrm{H_3O^+}] = \sqrt{5{,}56\cdot 10^{-10} \cdot 0{,}2} = 1{,}05\cdot 10^{-5}
          \qquad
          \mathrm{pH} = -\log(1{,}05\cdot 10^{-5}) = 4{,}98
          $$

          Es la respuesta de la colección. Los ejercicios resueltos escriben
          $1{,}04\cdot 10^{-5}$ y llegan al mismo 4,98.

      - tipo: calcular
        titulo: El amoniaco con sosa
        pregunta: |
          c) ¿Cuál es el pH del amoniaco 0,1 M con la sosa a 10⁻³ M?
        respuesta:
          tipo: numero
          valor: '11.28'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '11'
            mensaje: |
              Es el pH de una sola de las dos bases: 11 si solo cuentas la
              sosa, 11,13 si solo cuentas el amoniaco, que es el apartado a).
              Las dos aportan OH⁻: la sosa frena al amoniaco pero no lo apaga,
              y el total, 1,93·10⁻³ M, da 11,28.
          - valor: '11.37'
            mensaje: |
              Has sumado los OH⁻ del amoniaco solo y los de la sosa. Con la
              sosa delante el amoniaco se ioniza menos: el OH⁻ de la sosa es
              producto de su equilibrio y lo frena.
          - valor: '2.72'
            mensaje: |
              Es el pOH. La disolución es básica: $\mathrm{pH} = 14 - 2{,}72$.
        pista: |
          $K_b = \dfrac{x\,(10^{-3} + x)}{0{,}1 - x}$: el OH⁻ total es el de la
          sosa más el del amoniaco.
        desarrollo: |
          $$
          \frac{x\,(10^{-3} + x)}{0{,}1 - x} = 1{,}8\cdot 10^{-5}
          \quad\Longrightarrow\quad
          x^{2} + 1{,}018\cdot 10^{-3}\,x - 1{,}8\cdot 10^{-6} = 0
          $$

          $$
          x = 9{,}26\cdot 10^{-4}
          \qquad
          [\mathrm{OH^-}] = 10^{-3} + 9{,}26\cdot 10^{-4} = 1{,}926\cdot 10^{-3}
          $$

          $$
          \mathrm{pOH} = -\log(1{,}926\cdot 10^{-3}) = 2{,}7153
          \qquad
          \mathrm{pH} = 14 - 2{,}7153 = 11{,}28
          $$

          Es la respuesta de la colección, con la misma cuadrática que los
          ejercicios resueltos.

      - tipo: calcular
        titulo: La mezcla de a) y b)
        pregunta: |
          d) ¿Cuál es el pH de la mezcla de a) y b)?
        respuesta:
          tipo: numero
          valor: '8.95'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '9.56'
            mensaje: |
              Tienes el cociente del revés. Hay el doble de amonio que de
              amoniaco, así que la reguladora queda por debajo del pKa del
              amonio, 9,26, no por encima.
          - valor: '5.05'
            mensaje: |
              Es el pOH. Con amoniaco en el vaso la disolución es básica:
              $\mathrm{pH} = 14 - 5{,}05$.
        pista: |
          20 mmol de amoniaco y 40 de amonio en el mismo vaso: Henderson, con
          el cociente de moles.
        desarrollo: |
          $$
          n(\mathrm{NH_3}) = 200 \cdot 0{,}1 = 20\ \text{mmol}
          \qquad
          n(\mathrm{NH_4^+}) = 200 \cdot 0{,}2 = 40\ \text{mmol}
          $$

          $$
          \mathrm{pOH} = 4{,}745 + \log\frac{40}{20} = 5{,}046
          \qquad
          \mathrm{pH} = 14 - 5{,}046 = 8{,}95
          $$

          Es la respuesta de la colección.

      - tipo: calcular
        titulo: La reguladora con sosa
        pregunta: |
          e) ¿Y si a la mezcla se le añade sosa hasta 10⁻³ M? Usa el pKa del
          amonio con tres decimales, 9,255.
        respuesta:
          tipo: numero
          valor: '8.967'
          tolerancia: 0.008
          formato: el pH, con tres decimales
        distractores:
          - valor: '8.95'
            mensaje: |
              Te sale lo mismo que en d), o algo menos. La sosa convierte
              amonio en amoniaco, así que el cociente sube y el pH también:
              poco, una centésima y pico, pero sube.
          - valor: '11'
            mensaje: |
              Es el pH de la sosa en agua pura. En la reguladora, la sosa
              reacciona con el amonio y el pH apenas se mueve: para eso sirve.
        pista: |
          La sosa pasa 10⁻³ M de amonio a amoniaco: 0,051 M de amoniaco y 0,099
          M de amonio.
        desarrollo: |
          $$
          [\mathrm{NH_3}] = 0{,}05 + 0{,}001 = 0{,}051
          \qquad
          [\mathrm{NH_4^+}] = 0{,}1 - 0{,}001 = 0{,}099
          $$

          $$
          \mathrm{pH} = 9{,}255 + \log\frac{0{,}051}{0{,}099} = 8{,}967
          $$

          Es el 8,97 de la colección. Con el pKa redondeado a 9,25 sale 8,96,
          que es lo que dan los ejercicios resueltos aunque escriban 8,97; la
          casilla acepta los dos; lo que no acepta es 8,95, que sería no
          haber movido nada. Aquí el cambio es de centésimas, y un redondeo
          temprano se lo come.

      - tipo: calcular
        titulo: La reguladora con clorhídrico
        pregunta: |
          f) ¿Y si en lugar de sosa se añade ácido clorhídrico hasta 10⁻³ M?
          Usa el pKa del amonio con tres decimales, 9,255.
        respuesta:
          tipo: numero
          valor: '8.941'
          tolerancia: 0.006
          formato: el pH, con tres decimales
        distractores:
          - valor: '8.95'
            mensaje: |
              Es el pH de d), sin tocar. El ácido convierte amoniaco en amonio,
              así que el cociente baja y el pH también, aunque sea una
              centésima. Si lo que has hecho es mover el cociente con el pKa
              redondeado a 9,26, sale 8,946, que a dos decimales se confunde
              con d): con 9,255 sale 8,94.
          - valor: '3'
            mensaje: |
              Es el pH del clorhídrico en agua pura. En la reguladora, el ácido
              reacciona con el amoniaco y el pH apenas baja.
        pista: |
          El ácido pasa 10⁻³ M de amoniaco a amonio: 0,049 M de amoniaco y
          0,101 M de amonio.
        desarrollo: |
          $$
          \mathrm{pH} = 9{,}255 + \log\frac{0{,}049}{0{,}101} = 8{,}941
          $$

          Es el 8,94 de la colección y de los ejercicios resueltos, que rotulan
          este apartado como «d)». Con el pKa a 9,25 sale 8,936, y la casilla
          lo acepta. Con 9,26 sale 8,946, que a dos decimales es 8,95, el pH de
          d): cuando el cambio es de una centésima, redondear el pKa pesa
          tanto como el propio ácido.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Base débil sola: $[\mathrm{OH^-}] = \sqrt{K_b C}$ y pH 11,13.
          - texto: >-
              b) El amonio hidroliza con $K_w/K_b = 5{,}56\cdot 10^{-10}$, y la
              disolución es ácida: pH 4,98.
          - texto: >-
              c) La sosa aporta OH⁻ y frena al amoniaco: pH 11,28, algo por
              encima de la sosa sola.
          - texto: >-
              d) La mezcla es una reguladora con el doble de amonio que de
              amoniaco: pH 8,95.
          - texto: >-
              e) y f) Al añadir 10⁻³ M de base o de ácido fuertes, el pH pasa a
              ser el de esa base o ese ácido: 11 y 3.
            trampa: true
            mensaje: |
              Eso pasaría en agua pura. En la reguladora, la sosa convierte
              10⁻³ M de amonio en amoniaco y el ácido hace lo contrario: el
              cociente apenas se mueve, y el pH se desplaza poco más de una
              centésima desde el 8,95 de d): 8,97 con la sosa y 8,94 con el
              ácido.
        veredicto: |
          El mismo amoniaco da seis pH distintos porque cada vaso es un
          régimen distinto. Decidir el régimen es la mitad del problema.

    resolucion: |
      **El régimen de cada apartado,** antes de ninguna cuenta: a) base débil
      sola, b) sal ácida, c) base débil con base fuerte, d) reguladora, y e) y
      f) la misma reguladora con un poco de base o de ácido.

      **a · Base débil.**
      $[\mathrm{OH^-}] = \sqrt{1{,}8\cdot 10^{-5} \cdot 0{,}1} = 1{,}34\cdot 10^{-3}$,
      pOH 2,87 y **pH 11,13**.

      **b · Sal ácida.** El NH4⁺ hidroliza con $K_h = K_w/K_b = 5{,}56\cdot 10^{-10}$:
      $[\mathrm{H_3O^+}] = \sqrt{K_h \cdot 0{,}2} = 1{,}05\cdot 10^{-5}$ y
      **pH 4,98**.

      **c · Con sosa.** El OH⁻ de la sosa frena al amoniaco:

      $$
      \frac{x\,(10^{-3} + x)}{0{,}1 - x} = K_b
      \quad\Longrightarrow\quad
      [\mathrm{OH^-}] = 1{,}93\cdot 10^{-3}
      \qquad
      \mathrm{pH} = 11{,}28
      $$

      **d · Reguladora.** 20 mmol de amoniaco y 40 de amonio:
      $\mathrm{pOH} = 4{,}745 + \log 2 = 5{,}05$ y **pH 8,95**.

      **e y f · La reguladora trabajando.** La sosa pasa 10⁻³ M de amonio a
      amoniaco, y el ácido al revés:

      $$
      \mathrm{pH}_e = 9{,}255 + \log\frac{0{,}051}{0{,}099} = 8{,}97
      \qquad
      \mathrm{pH}_f = 9{,}255 + \log\frac{0{,}049}{0{,}101} = 8{,}94
      $$

      Las seis cifras coinciden con la colección. Los ejercicios resueltos
      del tema 9 dan las mismas, salvo que su 8,97 del apartado e está
      calculado con un pKa de 9,25, que da 8,96.

      **Lo que enseña la última pareja.** La misma cantidad de sosa que en
      agua pura daría pH 11 mueve la reguladora poco más de una centésima,
      de 8,954 a 8,967. Es la definición de reguladora, medida. Y por eso
      aquí el pKa se usa con tres decimales: redondeado a 9,26 o a 9,25,
      mueve el resultado media centésima, cuando lo que se quiere ver es un
      cambio de poco más de una.

  - id: colfq9-11-el-hipocloroso-y-su-punto-de-equivalencia
    titulo: Una valoración cuyo punto de equivalencia no está en pH 7
    fuente: >-
      Problema 11 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Se dispone en el laboratorio de un vaso que contiene 30 mL de ácido
      hipocloroso 0,1 M ¿Cuál será su pH?

      Si se realiza una valoración de este ácido con hidróxido sódico 0,2 M,
      calcular: a) el volumen en el punto de equivalencia y b) el pH en el
      punto de equivalencia.

      **Dato:** Ka (HClO) = 3,0 x 10⁻⁸
    pide: El pH inicial, el volumen de sosa en el punto de equivalencia y el pH en ese punto.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el punto de equivalencia se ha gastado exactamente la sosa
          necesaria. ¿Qué queda en el vaso?
        opciones:
          - texto: Hipoclorito, que es una base débil, y por eso el pH pasará de 7
            correcta: true
            mensaje: |
              Eso es lo que este problema existe para enseñar. Todo el ácido
              se ha convertido en su base conjugada, y una base débil en agua
              da pH básico. El punto de equivalencia de un ácido débil **no**
              está en 7.
          - texto: Agua y sal neutra, así que el pH será 7
            mensaje: |
              Sería así valorando un ácido **fuerte**: su base conjugada es
              tan débil que no hace nada. El hipoclorito, en cambio, viene de
              un ácido con $K_a = 3 \times 10^{-8}$, o sea muy débil, y su
              conjugada es apreciablemente básica.
          - texto: Ácido hipocloroso sin reaccionar, porque la sosa se consume antes
            mensaje: |
              El punto de equivalencia es exactamente donde no queda nada del
              ácido de partida: los moles de sosa igualan a los del ácido. Si
              quedara ácido, no sería el punto de equivalencia.
          - texto: Exceso de sosa, así que el pH lo fija el hidróxido sódico
            mensaje: |
              Eso pasa **después** del punto de equivalencia, cuando sigues
              añadiendo sosa. En el punto justo no hay exceso de ninguno de
              los dos.

      - tipo: calcular
        titulo: El volumen de sosa
        pregunta: |
          ¿Qué volumen de NaOH 0,2 M hace falta hasta el punto de
          equivalencia, en mililitros?
        respuesta:
          tipo: numero
          valor: '15'
          tolerancia: 0.1
          formato: un número entero, en mililitros
        distractores:
          - valor: '30'
            mensaje: |
              Ese es el volumen de ácido. La sosa está al **doble** de
              concentración, así que hace falta la mitad de volumen para
              aportar los mismos moles.
          - valor: '60'
            mensaje: |
              Has multiplicado por dos en vez de dividir. Fíjate en cuál de
              las dos disoluciones está más concentrada: la que más
              concentrada esté es la que menos volumen necesita.
          - valor: '3'
            mensaje: |
              Eso son los milimoles de ácido, que es el paso intermedio.
              Falta dividirlos entre la concentración de la sosa.
        pista: |
          Iguala milimoles. $30 \times 0{,}1 = V \times 0{,}2$.
        desarrollo: |
          $$
          30\ \mathrm{mL} \times 0{,}1\ \mathrm{M} = 3\ \mathrm{mmol\ de\ HClO}
          $$

          $$
          V = \frac{3}{0{,}2} = 15\ \mathrm{mL}
          $$

      - tipo: calcular
        titulo: El pH en el punto de equivalencia
        pregunta: |
          En el punto de equivalencia todo el ácido es hipoclorito, repartido
          en los 45 mL totales. ¿Cuál es el pH?
        respuesta:
          tipo: numero
          valor: '10.17'
          tolerancia: 0.03
          formato: un número, con dos decimales
        distractores:
          - valor: '7'
            mensaje: |
              Es la respuesta que sale de suponer que toda valoración termina
              en pH neutro. Solo vale cuando el ácido y la base son los dos
              fuertes; aquí la base conjugada que queda hidroliza y sube el
              pH tres unidades por encima.
          - valor: '3.83'
            mensaje: |
              Ese es el pOH. La disolución es básica, así que el pH tiene que
              quedar por encima de 7.
          - valor: '4.26'
            mensaje: |
              Ese es el pH inicial, antes de añadir nada de sosa. Al terminar
              la valoración ya no queda ácido en el vaso.
        pista: |
          Calcula $K_b$ del hipoclorito con $K_a K_b = 10^{-14}$, y no olvides
          que el volumen ahora es 45 mL.
        desarrollo: |
          La concentración de hipoclorito, ya diluida en los 45 mL:

          $$
          [\mathrm{ClO^-}] = \frac{3\ \mathrm{mmol}}{45\ \mathrm{mL}} = 0{,}0667\ \mathrm{M}
          $$

          Su constante básica:

          $$
          K_b = \frac{10^{-14}}{3{,}0 \times 10^{-8}} = 3{,}33 \times 10^{-7}
          $$

          Y la hidrólisis:

          $$
          [\mathrm{OH^-}] = \sqrt{3{,}33 \times 10^{-7} \times 0{,}0667} = 1{,}49 \times 10^{-4}
          $$

          $$
          \mathrm{pOH} = 3{,}83 \quad\Longrightarrow\quad \mathrm{pH} = 14 - 3{,}83 = 10{,}17
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Al principio hay ácido débil solo, y el pH sale de √(Ka · C) = √(3,0 × 10⁻⁸ × 0,1), o sea pH = 4,26.'
          - texto: 'El punto de equivalencia iguala milimoles: 30 × 0,1 = V × 0,2, así que V = 15 mL.'
          - texto: 'Ahí todo el ácido se ha convertido en hipoclorito, y hay que rediluirlo en los 45 mL totales, lo que da 0,0667 M.'
          - texto: 'El hipoclorito hidroliza con Kb = 10⁻¹⁴ / Ka = 3,33 × 10⁻⁷, y de ahí sale pOH = 3,83 y pH = 10,17.'
          - texto: 'En el punto de equivalencia el ácido y la base se han neutralizado exactamente, así que el pH es 7.'
            trampa: true
            mensaje: |
              Neutralizar no es lo mismo que quedar neutro. En el punto de
              equivalencia las cantidades se igualan, sí, pero lo que queda en
              el vaso es la base conjugada del ácido — y si el ácido era
              débil, su conjugada no lo es tanto y sube el pH. Solo con ácido
              y base fuertes el punto de equivalencia cae en 7.
    resolucion: |
      **El pH de partida.** Ácido débil solo, con $K_a = 3{,}0 \times 10^{-8}$
      y $C = 0{,}1$ M. Con una constante tan pequeña la aproximación es
      holgada:

      $$
      [\mathrm{H^+}] = \sqrt{K_a C} = \sqrt{3{,}0 \times 10^{-9}} = 5{,}48 \times 10^{-5} \quad\Longrightarrow\quad \mathrm{pH} = 4{,}26
      $$

      **a · El volumen del punto de equivalencia.** Se igualan milimoles, no
      volúmenes ni concentraciones:

      $$
      30 \times 0{,}1 = 3\ \mathrm{mmol} \qquad V = \frac{3}{0{,}2} = 15\ \mathrm{mL}
      $$

      **b · El pH en ese punto, que es lo que el problema quiere enseñar.**
      No queda ácido: todo se ha convertido en hipoclorito. Y hay dos cosas
      que se olvidan, las dos por prisa.

      La primera es **rediluir**. Los 3 mmol están ahora en $30 + 15 = 45$ mL,
      no en 30:

      $$
      [\mathrm{ClO^-}] = \frac{3}{45} = 0{,}0667\ \mathrm{M}
      $$

      La segunda es que el hipoclorito **hidroliza**. Es la base conjugada de
      un ácido muy débil, así que su $K_b$ no es despreciable:

      $$
      K_b = \frac{K_w}{K_a} = \frac{10^{-14}}{3{,}0 \times 10^{-8}} = 3{,}33 \times 10^{-7}
      $$

      $$
      [\mathrm{OH^-}] = \sqrt{K_b \cdot C} = 1{,}49 \times 10^{-4} \quad\Longrightarrow\quad \mathrm{pOH} = 3{,}83
      $$

      $$
      \mathrm{pH} = 10{,}17
      $$

      **La regla que sale de aquí, y vale para todas las valoraciones.** El
      punto de equivalencia no está en 7 salvo que ácido y base sean los dos
      fuertes. Lo que hay que preguntarse es **qué queda en el vaso**:

      | se valora | queda | pH del punto |
      |---|---|---|
      | ácido fuerte con base fuerte | sal inerte | 7 |
      | ácido débil con base fuerte | su base conjugada | **mayor que 7** |
      | base débil con ácido fuerte | su ácido conjugado | **menor que 7** |

      Aquí el pH sube más de tres unidades por encima de 7, y no es un caso
      raro: cuanto más débil sea el ácido, más básico será su punto de
      equivalencia.

  - id: colfq9-12-la-aspirina-y-su-punto-de-equivalencia
    titulo: Una aspirina, su constante de acidez y la sosa justa para neutralizarla
    fuente: >-
      Problema 12 · Problemas propuestos del tema 9, Equilibrio ácido-base ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, y los
      ejercicios resueltos del tema 9 desarrollan a mano el apartado a entero
      y dejan el b a medias. En el a escriben 2,5 × 10⁻³ en el denominador de
      Ka, que son los moles y no la concentración, aunque su 4,19 × 10⁻⁴ es el
      de la concentración. El desarrollo del b y el diagnóstico de los errores
      son nuestros.
    nivel: practica
    enunciado: |
      Cada comprimido de aspirina contiene 0,45 g de ácido acetilsalicílico, un
      ácido monoprótico débil (HA), de fórmula C9O4H8. Se disuelve un
      comprimido de aspirina en agua hasta formar 200 mL de solución y se mide
      su pH resultando ser 2,68. a) Determinar el valor de la constante de
      acidez del ácido acetilsalicílico en las condiciones dadas, b) Si se
      añaden 25 mL de NaOH 0,1 M, escribir la reacción que tiene lugar y
      determinar el pH de la solución resultante.
    pide: La constante de acidez del ácido acetilsalicílico, la reacción con la sosa y el pH después de añadirla.

    pasos:
      - tipo: reconocer
        pregunta: |
          En b) se añaden 25 mL de sosa 0,1 M, 2,5 mmol, al comprimido, que
          tiene 2,5 mmol de ácido. ¿Qué queda en el vaso?
        opciones:
          - texto: >-
              Solo la sal, acetilsalicilato de sodio: es el punto de
              equivalencia, y el pH lo pone su hidrólisis
            correcta: true
            mensaje: |
              Eso es. $\mathrm{HA} + \mathrm{NaOH} \rightarrow \mathrm{NaA} + \mathrm{H_2O}$
              gasta los dos enteros, y el A⁻, base conjugada de un ácido débil,
              reacciona con el agua: el pH pasa de 7.
          - texto: >-
              Una reguladora de ácido acetilsalicílico y su sal
            mensaje: |
              Para eso tendría que quedar ácido sin neutralizar, y la sosa lo
              gasta entero: 2,5 mmol contra 2,5 mmol.
          - texto: >-
              Una disolución neutra, porque ácido y base se han neutralizado
            mensaje: |
              Neutralizar no es quedar neutro. El ácido es débil, así que su
              base conjugada hidroliza y sube el pH por encima de 7.
          - texto: >-
              Sosa en exceso, porque la sosa es fuerte
            mensaje: |
              Ser fuerte no hace que sobre: sobra la que pasa de los 2,5 mmol
              del ácido, y aquí se echan exactamente 2,5 mmol.

      - tipo: calcular
        titulo: La constante de acidez
        pregunta: |
          a) Con la masa molar 180 g/mol, ¿cuánto vale $K_a$?
        respuesta:
          tipo: numero
          valor: '4.19e-4'
          tolerancia: 5e-6
          formato: la constante, en notación científica, como 3,5e-4
        distractores:
          - valor: '3.49e-4'
            mensaje: |
              Has despreciado la $x$ del denominador, $K_a \approx x^{2}/C$.
              Aquí no vale: se disocia un 17 % del ácido, y hay que restarlo.
          - valor: '1.06e-2'
            mensaje: |
              Has puesto en el denominador los moles, $2{,}5\cdot 10^{-3}$, en
              vez de la concentración, 0,0125 M. Es la errata de los ejercicios
              resueltos, cuyo resultado sí es el de la concentración.
          - valor: '2.09e-3'
            mensaje: |
              Es la concentración de protones, $10^{-2{,}68}$. La constante se
              calcula con ella: $K_a = x^{2}/(C - x)$.
        pista: |
          $C = \dfrac{0{,}45/180}{0{,}2}$ y $x = 10^{-2{,}68}$; después
          $K_a = \dfrac{x^{2}}{C - x}$.
        desarrollo: |
          $$
          C = \frac{0{,}45/180}{0{,}2} = 0{,}0125\ \text{M}
          \qquad
          x = 10^{-2{,}68} = 2{,}089\cdot 10^{-3}\ \text{M}
          $$

          $$
          K_a = \frac{(2{,}089\cdot 10^{-3})^{2}}{0{,}0125 - 2{,}089\cdot 10^{-3}} = 4{,}19\cdot 10^{-4}
          $$

          Es la respuesta de la colección. Se disocia un 17 %, así que la $x$
          del denominador no se puede despreciar.

      - tipo: calcular
        titulo: El acetilsalicilato en el punto de equivalencia
        pregunta: |
          b) ¿Cuál es la concentración de A⁻ después de añadir la sosa?
        respuesta:
          tipo: numero
          valor: '0.0111'
          tolerancia: 0.0002
          formato: la concentración en mol/L, con cuatro cifras decimales
        distractores:
          - valor: '0.0125'
            mensaje: |
              Has dejado la sal en los 200 mL del comprimido. Con la sosa el
              volumen es $200 + 25 = 225$ mL.
          - valor: '0.1'
            mensaje: |
              Has repartido los 2,5 mmol en los 25 mL de la sosa. El volumen
              total es la suma: 225 mL.
        pista: |
          2,5 mmol de A⁻ en $200 + 25$ mL.
        desarrollo: |
          $$
          n(\mathrm{HA}) = \frac{0{,}45}{180} = 2{,}5\cdot 10^{-3}\ \text{mol}
          \qquad
          n(\mathrm{NaOH}) = 0{,}025 \cdot 0{,}1 = 2{,}5\cdot 10^{-3}\ \text{mol}
          $$

          $$
          [\mathrm{A^-}] = \frac{2{,}5\cdot 10^{-3}}{0{,}225} = 0{,}0111\ \text{M}
          $$

      - tipo: calcular
        titulo: El pH en el punto de equivalencia
        pregunta: |
          ¿Cuál es el pH de la disolución resultante?
        respuesta:
          tipo: numero
          valor: '7.71'
          tolerancia: 0.02
          formato: el pH, con dos decimales
        distractores:
          - valor: '7'
            mensaje: |
              Supone que el punto de equivalencia es neutro. Solo lo es con
              ácido y base fuertes; aquí queda A⁻, base conjugada de un ácido
              débil.
          - valor: '11.33'
            mensaje: |
              Has usado $K_a$ en la hidrólisis. La constante del A⁻ como base
              es $K_b = K_w/K_a = 2{,}39\cdot 10^{-11}$, muchísimo menor.
          - valor: '6.29'
            mensaje: |
              Es el pOH. La disolución es básica: $\mathrm{pH} = 14 - 6{,}29$.
        pista: |
          $K_b = K_w/K_a$ y $[\mathrm{OH^-}] = \sqrt{K_b\,[\mathrm{A^-}]}$.
        desarrollo: |
          $$
          K_b = \frac{10^{-14}}{4{,}19\cdot 10^{-4}} = 2{,}39\cdot 10^{-11}
          $$

          $$
          [\mathrm{OH^-}] = \sqrt{2{,}39\cdot 10^{-11} \cdot 0{,}0111} = 5{,}15\cdot 10^{-7}
          $$

          $$
          \mathrm{pOH} = -\log(5{,}15\cdot 10^{-7}) = 6{,}29
          \qquad
          \mathrm{pH} = 14 - 6{,}29 = 7{,}71
          $$

          Es la respuesta de la colección. Con un OH⁻ tan pequeño empieza a
          contar el del agua: metiéndolo en el balance,
          $[\mathrm{OH^-}]^{2} = K_b\,[\mathrm{A^-}] + K_w$, sale 7,72, y la
          casilla acepta las dos cifras. Sumar a mano $10^{-7}$ a los
          $5{,}15\cdot 10^{-7}$ no vale: el agua se disocia menos en una
          disolución que ya es básica, y así saldría 7,79.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              0,45 g en 200 mL son 0,0125 M, y el pH 2,68 da
              $x = 2{,}09\cdot 10^{-3}$ M disociado.
          - texto: >-
              $K_a = x^{2}/(C - x) = 4{,}19\cdot 10^{-4}$, sin aproximar,
              porque se disocia un 17 %.
          - texto: >-
              $\mathrm{HA} + \mathrm{NaOH} \rightarrow \mathrm{NaA} + \mathrm{H_2O}$:
              2,5 mmol de cada uno, el punto de equivalencia.
          - texto: >-
              El A⁻, 0,0111 M en 225 mL, hidroliza con
              $K_b = 2{,}39\cdot 10^{-11}$: pOH 6,29 y pH 7,71.
          - texto: >-
              En b) queda una reguladora de ácido y sal, y el pH es el
              $\mathrm{p}K_a$, 3,38.
            trampa: true
            mensaje: |
              Para una reguladora tendría que quedar ácido, y la sosa lo gasta
              entero. pH = pKa es el punto medio de la valoración, cuando se ha
              neutralizado la mitad; aquí se ha neutralizado todo, y lo que
              queda es la base conjugada sola.
        veredicto: |
          Contar milimoles antes de nada: 2,5 contra 2,5 es el punto de
          equivalencia, y ahí manda la hidrólisis de la sal.

    resolucion: |
      **a · La constante.** El comprimido tiene $0{,}45/180 = 2{,}5\cdot 10^{-3}$
      mol, 0,0125 M en 200 mL, y el pH da lo disociado:

      $$
      x = 10^{-2{,}68} = 2{,}09\cdot 10^{-3}\ \text{M}
      \qquad
      K_a = \frac{x^{2}}{C - x} = \frac{(2{,}089\cdot 10^{-3})^{2}}{0{,}0125 - 2{,}089\cdot 10^{-3}} = 4{,}19\cdot 10^{-4}
      $$

      Coincide con la colección y con los ejercicios resueltos. Estos escriben
      $2{,}5\cdot 10^{-3} - x$ en el denominador, que son los moles; con ese
      número saldría $1{,}06\cdot 10^{-2}$, y su resultado es el de la
      concentración, 0,0125 M. Se disocia un 17 %: despreciar la $x$ daría
      $3{,}49\cdot 10^{-4}$.

      **b · La reacción y el pH.** La sosa neutraliza el ácido:

      $$
      \mathrm{HA} + \mathrm{NaOH} \rightarrow \mathrm{NaA} + \mathrm{H_2O}
      $$

      Son 2,5 mmol de cada uno: el punto de equivalencia. Queda la sal, 2,5
      mmol en 225 mL, 0,0111 M, y el A⁻ hidroliza:

      $$
      \mathrm{A^-} + \mathrm{H_2O} \;\rightleftharpoons\; \mathrm{HA} + \mathrm{OH^-}
      \qquad
      K_b = \frac{K_w}{K_a} = 2{,}39\cdot 10^{-11}
      $$

      $$
      [\mathrm{OH^-}] = \sqrt{K_b \cdot 0{,}0111} = 5{,}15\cdot 10^{-7}
      \qquad
      \boxed{\mathrm{pH} = 7{,}71}
      $$

      Coincide con la colección. Los ejercicios resueltos dejan este apartado
      en el planteamiento; su última expresión, $x^{2}/(2{,}5 \cdot 0{,}225)$,
      solo da mol/L si la $x$ va en milimoles y el volumen en mililitros.

      **Lo que enseña.** La aspirina es un ácido bastante más fuerte que el
      acético, y aun así su punto de equivalencia es básico. Con un OH⁻ de
      $5\cdot 10^{-7}$ M, cinco veces el del agua pura, empieza a contar el
      agua: con $[\mathrm{OH^-}]^{2} = K_b\,[\mathrm{A^-}] + K_w$ sale 7,72.
