ejercicios:
  # ── Los dos primeros son NUESTROS (§08). Los ejercicios de examen de esta
  #    asignatura encadenan seis o siete apartados a la vez, así que no hay por
  #    dónde entrar: hace falta haber cruzado el puente del mol una sola vez, y
  #    haber pasado de una molaridad a un volumen de frasco una sola vez, antes
  #    de que las dos cosas vengan juntas dentro de una cadena industrial.
  - id: ejfq1-el-puente-del-mol-una-sola-vez
    titulo: Seis gramos de magnesio, y lo que pesa después
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se queman al aire 6,00 g de magnesio y todo el metal se convierte en
      óxido de magnesio:

      $$
      2\,\mathrm{Mg\,(s)} + \mathrm{O_2\,(g)} \rightarrow 2\,\mathrm{MgO\,(s)}
      $$

      Calcular la masa de óxido que se obtiene.

      **Datos:** masas atómicas (u): Mg = 24,31; O = 16,00.
    pide: La masa de óxido de magnesio, en gramos.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción produce **más** masa de óxido que la de magnesio de
          partida. ¿Se está creando materia?
        opciones:
          - texto: >-
              No: la masa que falta la aporta el oxígeno del aire, que también
              entra en la reacción
            correcta: true
            mensaje: |
              Exacto. La masa se conserva contando **todo** lo que entra, y el
              oxígeno entra aunque no lo hayas pesado tú. Los 3,95 g de
              diferencia son precisamente el oxígeno que se ha combinado.
          - texto: >-
              Sí: al oxidarse, el metal gana energía y con ella masa
            mensaje: |
              La equivalencia entre masa y energía existe, pero en una reacción
              química el efecto es de una parte en mil millones: no se mide con
              una balanza. Lo que explica la diferencia es mucho más simple.
          - texto: >-
              No, y por eso la masa de óxido tiene que ser también 6,00 g
            mensaje: |
              La masa total se conserva, pero la del **óxido** no tiene por qué
              ser la del magnesio: al óxido se le ha sumado el oxígeno. Lo que
              se conserva es magnesio + oxígeno = óxido.
          - texto: >-
              Depende de si el aire estaba seco
            mensaje: |
              La humedad podría dar reacciones secundarias, pero el enunciado
              dice que **todo** el metal se convierte en óxido. Con eso, la
              cuenta está cerrada.

      - tipo: calcular
        titulo: La masa de óxido
        pregunta: ¿Cuántos gramos de MgO se obtienen?
        respuesta:
          tipo: numero
          valor: '9.95'
          tolerancia: 0.1
          formato: la masa en gramos, con dos cifras decimales
        distractores:
          - valor: '6.00'
            mensaje: |
              Esa es la masa de magnesio de partida. El óxido pesa más porque
              lleva el oxígeno incorporado: cada átomo de Mg arrastra uno de O.
          - valor: '4.97'
            mensaje: |
              Has dividido entre dos por el coeficiente. Los coeficientes son
              **2 y 2**: hay un MgO por cada Mg, no uno por cada dos.
        pista: |
          Tres pasos y ninguno tiene truco: gramos de Mg a moles, moles de Mg a
          moles de MgO con la proporción de la ecuación, y moles de MgO a
          gramos.
        desarrollo: |
          $$
          n(\mathrm{Mg}) = \frac{6{,}00}{24{,}31} = 0{,}2468\ \text{mol}
          $$
          La ecuación es 2 a 2, así que
          $n(\mathrm{MgO}) = n(\mathrm{Mg})$:
          $$
          m(\mathrm{MgO}) = 0{,}2468\cdot 40{,}31 = 9{,}95\ \text{g}
          $$
          Los 3,95 g de más son el oxígeno que se ha combinado.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 6,00 g de magnesio son 0,2468 mol, dividiendo entre su masa
              atómica.
          - texto: >-
              Los coeficientes 2 y 2 dicen que sale un mol de MgO por cada mol
              de Mg, así que hay 0,2468 mol de óxido.
          - texto: >-
              Multiplicando por la masa molar del MgO, 40,31, salen 9,95 g.
          - texto: >-
              La diferencia, 3,95 g, es el oxígeno que se ha incorporado desde
              el aire.
          - texto: >-
              Como la masa se conserva, los gramos de producto tienen que ser
              iguales a los de magnesio de partida.
            trampa: true
            mensaje: |
              Lo que se conserva es la masa **total**, contando todos los
              reactivos. Aquí entra oxígeno del aire, así que el producto pesa
              más que el metal solo.

              Si el enunciado hubiera dado los gramos de oxígeno, podrías
              comprobarlo sumando: 6,00 de Mg más 3,95 de O son los 9,95 del
              óxido, exactos.
        veredicto: |
          El puente del mol tiene tres tramos, y el del medio —la proporción de
          la ecuación— es el único que cambia de un ejercicio a otro.

    resolucion: |
      **La idea.** Una ecuación ajustada habla de partículas y una balanza
      habla de gramos. El mol traduce entre las dos, y este ejercicio es el
      viaje completo en su versión más corta.

      $$
      n(\mathrm{Mg}) = \frac{6{,}00}{24{,}31} = 0{,}2468\ \text{mol}
      $$

      La proporción de la ecuación es 2 a 2, o sea uno a uno, así que hay
      tantos moles de óxido como de metal. Multiplicando por su masa molar:

      $$
      \boxed{\;m(\mathrm{MgO}) = 0{,}2468\cdot 40{,}31 = 9{,}95\ \text{g}\;}
      $$

      **Comprobación que conviene hacerse siempre:** el óxido pesa 3,95 g más
      que el metal, y eso son exactamente 0,2468 mol de átomos de oxígeno
      —0,2468 × 16,00 = 3,95—. Cuando el balance de masas cuadra, el ejercicio
      está bien.

  - id: ejfq1-el-puente-del-mol-en-las-cuatro-direcciones
    titulo: El puente del mol, cruzado en las cuatro direcciones
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el mol como unidad de
      conversión del tema 1. El ejemplo anterior cruza el puente de gramos a
      gramos; este lo cruza también hacia partículas y hacia volumen, que es la
      otra mitad. No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      Un recipiente contiene $4{,}40\ \text{g}$ de dióxido de carbono,
      $\mathrm{CO_2}$, en condiciones normales.

      a) ¿Cuántos moles hay?

      b) ¿Cuántas moléculas?

      c) ¿Qué volumen ocupa?

      d) ¿Cuántos átomos de oxígeno hay?

      **Datos:** masas atómicas (u): C = 12,01; O = 16,00 ·
      $N_A = 6{,}022\cdot 10^{23}\ \text{mol}^{-1}$ · volumen molar en
      condiciones normales = 22,4 L/mol.
    pide: Los moles, las moléculas, el volumen y los átomos de oxígeno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Gramos, moléculas y litros son tres formas de decir cuánta sustancia
          hay. ¿Qué las conecta?
        opciones:
          - texto: >-
              El **mol**: se pasa siempre por él, nunca de una a otra
              directamente
            correcta: true
            mensaje: |
              Eso es, y por eso conviene dibujarlo como un puente: gramos ↔ mol
              ↔ moléculas, y mol ↔ litros si es gas. **Todas las conversiones
              del tema pasan por el centro**, y quien intenta un atajo de
              gramos a moléculas acaba multiplicando por lo que no es.
          - texto: >-
              La masa molar, que sirve para las tres
            mensaje: |
              La masa molar conecta gramos con moles, y solo eso. Para llegar a
              moléculas hace falta Avogadro, y para llegar a litros, el volumen
              molar. Son tres constantes distintas y cada una cubre un tramo
              del puente.
          - texto: >-
              Nada: hay que medir cada una por su lado
            mensaje: |
              Si fuera así, la química cuantitativa no existiría. La idea
              entera del mol es justamente que **contar partículas se puede
              hacer pesando**, que es lo único que se sabe hacer en un
              laboratorio.

      - tipo: calcular
        titulo: Los moles
        pregunta: |
          ¿Cuántos moles de $\mathrm{CO_2}$ hay?
        respuesta:
          tipo: numero
          valor: '0.1'
          tolerancia: 0.002
          formato: un número, en moles
        distractores:
          - valor: '10'
            mensaje: |
              Has dividido al revés, la masa molar entre la masa. Los moles son
              **gramos partido por gramos por mol**: si tienes menos de la mitad
              de un mol en gramos, no puedes tener diez moles.
          - valor: '4.4'
            mensaje: |
              Eso son los gramos. Un gramo no es un mol: hacen falta 44,01 g
              para tener un mol de $\mathrm{CO_2}$.
        pista: |
          La masa molar del $\mathrm{CO_2}$ es $12{,}01 + 2\cdot 16{,}00$.
        desarrollo: |
          $$
          M = 12{,}01 + 2\cdot 16{,}00 = 44{,}01\ \frac{\text{g}}{\text{mol}}
          \qquad
          n = \frac{4{,}40}{44{,}01} = 0{,}100\ \text{mol}
          $$

          Una décima de mol, que es un número cómodo a propósito: todo lo que
          venga después es «la décima parte de la constante que toque».

      - tipo: calcular
        titulo: Las moléculas
        pregunta: |
          ¿Cuántas moléculas de $\mathrm{CO_2}$ hay?
        respuesta:
          tipo: numero
          valor: '6.02e22'
          tolerancia: 2e20
          formato: un número, en notación científica
        distractores:
          - valor: '6.022e23'
            mensaje: |
              Ese es el número de Avogadro entero, o sea las moléculas que
              habría en **un mol**. Aquí hay una décima parte.
          - valor: '2.65e24'
            mensaje: |
              Has multiplicado los gramos por Avogadro sin pasar por el mol.
              Ese atajo se salta el puente: Avogadro cuenta partículas por
              **mol**, no por gramo.
        pista: |
          Moles por Avogadro.
        desarrollo: |
          $$
          N = 0{,}100\cdot 6{,}022\cdot 10^{23} = 6{,}02\cdot 10^{22}
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Qué volumen ocupa, en litros?
        respuesta:
          tipo: numero
          valor: '2.24'
          tolerancia: 0.02
          formato: un número, en litros
        distractores:
          - valor: '22.4'
            mensaje: |
              Ese es el volumen de **un mol**. Aquí hay 0,100, así que ocupa la
              décima parte.
          - valor: '0.0446'
            mensaje: |
              Has dividido entre 22,4 en vez de multiplicar. El volumen molar
              son litros **por** mol: si tienes moles, se multiplica.
        pista: |
          Moles por volumen molar. Solo vale porque es un gas y está en
          condiciones normales.
        desarrollo: |
          $$
          V = 0{,}100\cdot 22{,}4 = 2{,}24\ \text{L}
          $$

          Y conviene fijarse en lo que este tramo del puente **no** admite: el
          volumen molar solo vale para **gases**, y solo en las condiciones
          para las que se da. Con el mismo enunciado hablando de agua líquida,
          este apartado no tendría respuesta.

      - tipo: calcular
        titulo: Los átomos de oxígeno
        pregunta: |
          ¿Cuántos átomos de oxígeno hay?
        respuesta:
          tipo: numero
          valor: '1.204e23'
          tolerancia: 4e20
          formato: un número, en notación científica
        distractores:
          - valor: '6.02e22'
            mensaje: |
              Esas son las **moléculas**, no los átomos de oxígeno. Cada
              molécula de $\mathrm{CO_2}$ lleva dos, así que hay el doble.
          - valor: '1.806e23'
            mensaje: |
              Has contado los **tres** átomos de la molécula: uno de carbono y
              dos de oxígeno. La pregunta es solo por el oxígeno.
        pista: |
          Mira la fórmula: ¿cuántos oxígenos hay en cada molécula?
        desarrollo: |
          $$
          N_{\mathrm{O}} = 2\cdot 6{,}02\cdot 10^{22} = 1{,}204\cdot 10^{23}
          $$

          El subíndice de la fórmula es un factor de conversión más, y de los
          que más se olvidan: **la fórmula dice cuántos átomos de cada clase
          hay por molécula**, y eso es un tramo del puente tan real como
          Avogadro.

      - tipo: justificar
        pregunta: Ordena el recorrido. Una pieza es falsa.
        piezas:
          - texto: >-
              De gramos a moles se pasa dividiendo por la masa molar: 4,40
              entre 44,01 da 0,100 mol.
          - texto: >-
              De moles a moléculas, multiplicando por Avogadro; de moles a
              litros, por el volumen molar. Las dos salen del mismo 0,100.
          - texto: >-
              Y de moléculas a átomos de oxígeno, multiplicando por el
              subíndice de la fórmula, que es 2.
          - texto: >-
              Como todo sale de los moles, el volumen se podría haber sacado
              también directamente de los gramos, dividiendo por la densidad.
            trampa: true
            mensaje: |
              Se podría, pero **con la densidad del gas**, que aquí no la da
              nadie — y que además depende de la presión y la temperatura. Por
              eso el camino del mol es el que se enseña: usa constantes que no
              cambian con las condiciones, salvo el volumen molar, que las
              lleva escritas en el nombre.
    resolucion: |
      Todo sale de cruzar el puente por el centro:

      $$
      n = \frac{4{,}40}{44{,}01} = 0{,}100\ \text{mol}
      $$

      | se pide | se multiplica por | resultado |
      |---|---|---|
      | moléculas | $N_A = 6{,}022\cdot 10^{23}$ | $6{,}02\cdot 10^{22}$ |
      | litros | 22,4 L/mol | 2,24 L |
      | átomos de O | $N_A$ y el subíndice 2 | $1{,}204\cdot 10^{23}$ |

      **Lo que hay que llevarse.** El mol no es una unidad más: es **el único
      sitio por el que se pasa**. Gramos, partículas y litros no se convierten
      entre sí directamente, y cada tramo tiene su constante —masa molar,
      Avogadro, volumen molar— con su condición de uso.

      Y la de menos condiciones de todas es la que más se olvida: **el
      subíndice de la fórmula**. Contar moléculas y contar átomos no es lo
      mismo, y el enunciado casi nunca lo subraya.

  - id: ejfq1-del-frasco-al-matraz
    titulo: Del frasco al matraz, cruzando la riqueza y la densidad
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      En el laboratorio hay un frasco de ácido clorhídrico comercial con la
      etiqueta: **37 % en masa, densidad 1,18 g/mL**.

      Calcular qué volumen de ese ácido hay que tomar para preparar 250 mL de
      una disolución 0,10 M.

      **Datos:** masas atómicas (u): H = 1,01; Cl = 35,45.
    pide: El volumen de ácido comercial que hay que medir, en mililitros.

    pasos:
      - tipo: reconocer
        pregunta: |
          La etiqueta da dos números, 37 % y 1,18 g/mL. ¿Para qué sirve cada
          uno?
        opciones:
          - texto: >-
              El 37 % pasa de gramos de HCl puro a gramos de disolución, y la
              densidad de gramos de disolución a mililitros
            correcta: true
            mensaje: |
              Eso es, y ese es el orden. Son dos conversiones encadenadas, y
              cada una tiene su dato: la riqueza dice cuánto del frasco es
              ácido de verdad, y la densidad cuánto ocupa lo que pesas.
          - texto: >-
              El 37 % da el volumen y la densidad la concentración
            mensaje: |
              Una riqueza en masa no da volúmenes: relaciona dos masas, la del
              producto puro y la de la disolución que lo contiene.
          - texto: >-
              La densidad sobra: con la riqueza basta para pasar a mililitros
            mensaje: |
              Con la riqueza llegas a **gramos de disolución**, y lo que se
              mide con una pipeta son mililitros. Sin densidad no se puede
              cerrar.
          - texto: >-
              Los dos dicen lo mismo, y se usa el que resulte más cómodo
            mensaje: |
              No: uno relaciona masa con masa y el otro masa con volumen. Hacen
              falta los dos, y en ese orden.

      - tipo: calcular
        titulo: El volumen que hay que medir
        pregunta: ¿Cuántos mililitros del frasco hay que tomar?
        respuesta:
          tipo: numero
          valor: '2.09'
          tolerancia: 0.06
          formato: el volumen en mL, con dos cifras decimales
        distractores:
          - valor: '0.77'
            mensaje: |
              Te has saltado la riqueza. Has convertido a volumen los 0,91 g de
              **ácido puro**, pero en el frasco esos gramos vienen dentro de
              2,46 g de disolución.
          - valor: '2.46'
            mensaje: |
              Esos son los **gramos** de disolución, no los mililitros. Falta
              dividir entre la densidad.
        pista: |
          Empieza por los moles que necesita el matraz, y de ahí hacia atrás:
          gramos de HCl puro, gramos de disolución del frasco, y mililitros.
        desarrollo: |
          $$
          n = 0{,}250\cdot 0{,}10 = 0{,}025\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{HCl}) = 0{,}025\cdot 36{,}46 = 0{,}9115\ \text{g}
          $$
          $$
          m_{\text{disolución}} = \frac{0{,}9115}{0{,}37} = 2{,}464\ \text{g}
          \;\Longrightarrow\;
          V = \frac{2{,}464}{1{,}18} = 2{,}09\ \text{mL}
          $$

      - tipo: justificar
        pregunta: Ordena el procedimiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El matraz de 250 mL a 0,10 M necesita 0,025 mol de HCl.
          - texto: >-
              Esos moles son 0,9115 g de ácido puro, multiplicando por su masa
              molar 36,46.
          - texto: >-
              Como el frasco está al 37 %, esos gramos puros vienen dentro de
              0,9115 / 0,37 = 2,464 g de disolución.
          - texto: >-
              Dividiendo entre la densidad, 2,464 / 1,18 = 2,09 mL, que es lo
              que hay que pipetear.
          - texto: >-
              Se enrasa el matraz con agua hasta los 250 mL, no se añaden
              250 mL de agua.
          - texto: >-
              Como la riqueza es del 37 %, hay que multiplicar los gramos de
              ácido puro por 0,37 para saber cuánta disolución tomar.
            trampa: true
            mensaje: |
              Al revés: se **divide**. Si solo el 37 % del frasco es ácido,
              hace falta **más** disolución que ácido puro, no menos.

              La comprobación mental: multiplicando saldrían 0,34 g de
              disolución para obtener 0,91 g de ácido, o sea más producto que
              recipiente. Cuando un resultado es imposible, el error suele
              estar en el sentido de la división.
        veredicto: |
          Dos conversiones y un enrase. Y la última pieza no es un detalle de
          laboratorio: enrasar a 250 mL y añadir 250 mL de agua dan
          concentraciones distintas.

    resolucion: |
      **La idea.** Un reactivo de laboratorio nunca es puro, y lo que se mide
      con una pipeta son mililitros. Entre «los moles que quiero» y «los
      mililitros que pipeteo» hay dos conversiones, y cada una tiene su dato en
      la etiqueta.

      $$
      \underbrace{0{,}025\ \text{mol}}_{\text{lo que pide el matraz}}
      \;\xrightarrow{\;\times 36{,}46\;}\;
      0{,}9115\ \text{g de HCl}
      \;\xrightarrow{\;\div\,0{,}37\;}\;
      2{,}464\ \text{g de disolución}
      \;\xrightarrow{\;\div\,1{,}18\;}\;
      \boxed{2{,}09\ \text{mL}}
      $$

      **Las dos divisiones van en ese sentido y conviene razonarlo.** Si solo
      el 37 % del frasco es ácido, para tener 0,91 g de ácido hace falta más
      de un gramo de disolución: se divide. Y si cada mililitro pesa 1,18 g,
      para tener 2,46 g hacen falta menos de 2,46 mL: se divide otra vez.

      **Y el detalle de laboratorio que también se pregunta:** esos 2,09 mL se
      echan en el matraz y se **enrasa** con agua hasta la marca de 250 mL. No
      es lo mismo que añadir 250 mL de agua — eso daría 252 mL de disolución y
      una concentración algo menor.

      Este camino, con estos dos datos de etiqueta, es el que cierra casi
      todos los ejercicios largos de la asignatura. En el examen de 2024-2025
      aparece con sulfúrico al 98 %, y en el control de 2023-2024 con sulfúrico
      al 97 %: cambian los números, no el recorrido.
  # ── Los ejemplos de entrada que faltaban, escritos el 5 de septiembre de
  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq1-cruzar-las-cargas-una-vez
    titulo: El sulfato de aluminio, cruzando las cargas
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Escribir la fórmula del sulfato de aluminio y la del sulfato de calcio,
      sabiendo que el aluminio actúa siempre con carga 3+ y el calcio con 2+.
    pide: Las dos fórmulas, con sus subíndices y sus paréntesis si hacen falta.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de cruzar nada hay que saber con qué se cruza. ¿Qué carga
          tiene el ion sulfato?
        opciones:
          - texto: '2−, porque viene del ácido sulfúrico H₂SO₄ al soltar sus dos hidrógenos'
            correcta: true
            mensaje: |
              Exacto, y esa es la forma de no tener que memorizarlo: la carga
              de un oxoanión es el número de hidrógenos que le quita su ácido.
              Del H₂SO₄ salen dos, así que el sulfato es SO₄²⁻.
          - texto: '1−, como el nitrato'
            correcta: false
            mensaje: |
              El nitrato sí es 1−, porque su ácido es el HNO₃ y solo tiene un
              hidrógeno. El sulfúrico tiene dos, y por eso el sulfato es 2−.
              No todos los oxoaniones llevan la misma carga.
          - texto: '3−, como el fosfato'
            correcta: false
            mensaje: |
              El fosfato sí es 3−, y por el mismo motivo: su ácido es el
              H₃PO₄, con tres hidrógenos. El sulfúrico solo tiene dos.
          - texto: '2−, porque el azufre actúa con valencia 2'
            correcta: false
            mensaje: |
              El número está bien y el razonamiento no, y eso se nota en el
              siguiente compuesto. En el SO₄²⁻ el azufre actúa con valencia 6,
              no 2; el 2− es la carga que le queda al **conjunto** después de
              los cuatro oxígenos. Con valencia 2 el azufre daría el sulfuro
              S²⁻, que es otra cosa.

      - tipo: calcular
        titulo: El sulfato de aluminio
        pregunta: |
          Con Al³⁺ y SO₄²⁻, ¿cuál es la fórmula del sulfato de aluminio?
        respuesta:
          tipo: formula
          valor: Al2(SO4)3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Al3(SO4)2
            mensaje: |
              Has cruzado al revés. El subíndice de cada ion es la carga **del
              otro**: el 3 del aluminio baja al sulfato y el 2 del sulfato
              baja al aluminio. Comprueba siempre la cuenta: con tu fórmula
              salen 9+ contra 4−, y eso no es neutro.
          - valor: AlSO4
            mensaje: |
              Sin cruzar nada, la carga no se cierra: 3+ contra 2−. Hacen
              falta dos aluminios (6+) y tres sulfatos (6−) para que la suma
              dé cero.
          - valor: Al2(SO3)3
            mensaje: |
              El cruce está bien y el anión no. Ese es el **sulfito**, con tres
              oxígenos, que viene del ácido sulfuroso. La regla es *-ico → -ato*
              y *-oso → -ito*.
        pista: |
          Dos iones de 3+ y tres de 2− suman lo mismo por los dos lados.
        desarrollo: |
          El mínimo común múltiplo de 3 y 2 es 6, así que hacen falta seis
          cargas de cada signo:

          $$
          2\times(3+) = 6+ \qquad 3\times(2-) = 6-
          $$

          y la fórmula es $\mathrm{Al_2(SO_4)_3}$. El paréntesis es
          obligatorio: sin él, «Al₂SO₄3» no dice que el 3 multiplique al grupo
          entero.

      - tipo: calcular
        titulo: El sulfato de calcio
        pregunta: |
          Ahora con Ca²⁺ y el mismo sulfato. ¿Cuál es la fórmula?
        respuesta:
          tipo: formula
          valor: CaSO4
          formato: la fórmula, simplificada
        distractores:
          - valor: Ca2(SO4)2
            mensaje: |
              Has cruzado sin simplificar. Cruzar da los subíndices 2 y 2, y
              cuando los dos comparten un divisor **hay que dividirlos**: la
              fórmula de un compuesto iónico da siempre la proporción más
              simple, no el número de iones.
          - valor: Ca(SO4)2
            mensaje: |
              Ahí el calcio tendría que ser 4+ para neutralizar dos sulfatos,
              y es 2+. Con cargas iguales y de signo contrario la proporción
              es de uno a uno.
        pista: |
          Las dos cargas son iguales en valor. ¿Qué proporción hace falta?
        desarrollo: |
          Cruzando salen $\mathrm{Ca_2(SO_4)_2}$, y los dos subíndices se
          dividen entre 2:

          $$
          \mathrm{CaSO_4}
          $$

          Es el yeso. Cuando las dos cargas coinciden en valor absoluto, el
          compuesto es siempre uno a uno.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Un compuesto iónico es eléctricamente neutro, así que la suma de las cargas positivas y negativas tiene que dar cero.'
          - texto: 'Cruzar las cargas es la forma rápida de conseguirlo: el subíndice de cada ion es la carga del otro, sin el signo.'
          - texto: 'Con Al³⁺ y SO₄²⁻ salen los subíndices 2 y 3, y como no comparten divisor la fórmula queda Al₂(SO₄)₃.'
          - texto: 'Con Ca²⁺ y SO₄²⁻ salen 2 y 2, que sí comparten divisor, y hay que simplificar a CaSO₄.'
          - texto: 'El paréntesis se pone solo cuando el subíndice del anión es mayor que dos.'
            trampa: true
            mensaje: |
              El paréntesis no depende de cuánto valga el subíndice sino de
              **a qué se lo pones**. Va siempre que el subíndice multiplique a
              un grupo de más de un átomo: en Ba(NO₃)₂ el subíndice es 2 y el
              paréntesis hace falta igual, porque sin él el 2 se leería solo
              sobre el oxígeno.
    resolucion: |
      ## Por qué se cruzan las cargas

      No es un truco: es la forma más corta de imponer que el compuesto sea
      neutro. Si un catión de carga $a+$ se junta con un anión de carga $b-$,
      la neutralidad pide

      $$
      n_{\text{catión}}\cdot a = n_{\text{anión}}\cdot b
      $$

      y la solución entera más pequeña es $n_{\text{catión}} = b$ y
      $n_{\text{anión}} = a$. Eso es exactamente cruzar.

      **El sulfato de aluminio.** Al³⁺ y SO₄²⁻ dan
      $\mathrm{Al_2(SO_4)_3}$: seis cargas positivas contra seis negativas.

      **El sulfato de calcio.** Ca²⁺ y SO₄²⁻ dan de entrada
      $\mathrm{Ca_2(SO_4)_2}$, que **hay que simplificar** a
      $\mathrm{CaSO_4}$. Y ese es el único paso que el cruce no hace solo: la
      fórmula de un iónico no cuenta iones, da la proporción, y la proporción
      va siempre en su forma más simple.

      **Los dos sitios donde esto se cae**, y valen puntos en el examen:

      - Cruzar al revés. Se detecta en un segundo sumando cargas: si no dan
        cero, están cambiadas.
      - Olvidar el paréntesis. `Al₂SO₄3` no es la misma fórmula:
        dice dos aluminios, un azufre y cuarenta y tres oxígenos, si es que
        dice algo.

      Y una consecuencia que sirve para el resto del tema: **la masa molar
      depende de esos subíndices**. Quien escribe AlSO₄ en vez de Al₂(SO₄)₃ no
      pierde solo el apartado de formulación; arrastra una masa molar
      equivocada por toda la cadena estequiométrica.
  - id: ejfq1-ico-y-oso-no-son-numeros
    titulo: Férrico y plúmbico no son el mismo número
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      El hierro actúa con valencias 2 y 3; el plomo, con 2 y 4. Escribir la
      fórmula del óxido férrico y la del óxido plúmbico, y decir cómo se
      nombran los dos en nomenclatura de stock.
    pide: Las dos fórmulas y los dos nombres de stock.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos compuestos llevan el sufijo *-ico*. ¿Qué dice ese sufijo?
        opciones:
          - texto: Que el elemento actúa con la mayor de las valencias que tiene
            correcta: true
            mensaje: |
              Eso es, y la palabra importante es **sus**. El sufijo es
              relativo: no dice un número, dice «la de arriba de las que este
              elemento puede».
          - texto: Que el elemento actúa con valencia 3
            correcta: false
            mensaje: |
              Es la confusión que este ejemplo existe para deshacer. Sale de
              haber visto muchas veces «férrico», donde efectivamente es 3,
              y de generalizarlo. Con el plomo, que tiene 2 y 4, *-ico* vale 4.
          - texto: Que el compuesto es un ácido
            correcta: false
            mensaje: |
              Los ácidos oxácidos también usan *-ico* y *-oso*, pero el sufijo
              no convierte nada en ácido: aquí estamos con óxidos. El sufijo
              solo elige entre las valencias del elemento.
          - texto: Que el elemento actúa con la menor de sus valencias
            correcta: false
            mensaje: |
              Es justo al revés: *-oso* es la menor y *-ico* la mayor. Un
              recurso para no dudar: «oso» y «menor» suenan pequeñas, «ico» va
              arriba.

      - tipo: calcular
        titulo: El óxido férrico
        pregunta: |
          Con el hierro en su valencia mayor y el oxígeno con 2−, ¿cuál es la
          fórmula del óxido férrico?
        respuesta:
          tipo: formula
          valor: Fe2O3
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: FeO
            mensaje: |
              Ese es el óxido ferr**oso**, con el hierro en valencia 2. El
              sufijo *-ico* pide la mayor de las dos, que es 3.
          - valor: Fe3O2
            mensaje: |
              Has cruzado al revés. El 3 del hierro baja al oxígeno y el 2 del
              oxígeno baja al hierro, no al contrario. Súmalas: 9+ contra 4−
              no es neutro.
          - valor: Fe2O4
            mensaje: |
              Los subíndices salen del cruce y luego se simplifican, no se
              multiplican. Con Fe³⁺ y O²⁻ el cruce da directamente 2 y 3.
        pista: |
          Férrico es el hierro de valencia 3.
        desarrollo: |
          Hierro(III) con oxígeno(2−): cruzando, $\mathrm{Fe_2O_3}$. Seis
          cargas de cada signo.

      - tipo: calcular
        titulo: El óxido plúmbico
        pregunta: |
          Mismo sufijo, otro metal. ¿Cuál es la fórmula del óxido plúmbico?
        respuesta:
          tipo: formula
          valor: PbO2
          formato: la fórmula, simplificada
        distractores:
          - valor: Pb2O3
            mensaje: |
              Has usado la valencia 3, que es la del hierro. El plomo tiene 2 y
              4, así que *plúmbico* es 4 — y ahí está toda la gracia del
              ejemplo: el sufijo no es un número fijo.
          - valor: PbO
            mensaje: |
              Ese es el óxido plumb**oso**, con el plomo en su valencia menor.
          - valor: Pb2O4
            mensaje: |
              Es el cruce sin simplificar. Pb⁴⁺ y O²⁻ dan de entrada
              $\mathrm{Pb_2O_4}$, y los dos subíndices se dividen entre 2.
        pista: |
          Las valencias del plomo son 2 y 4. ¿Cuál pide *-ico*?
        desarrollo: |
          Plomo(IV) con oxígeno(2−): cruzando salen $\mathrm{Pb_2O_4}$, que se
          simplifica a

          $$
          \mathrm{PbO_2}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Las dos nomenclaturas dicen lo mismo: la de stock escribe la valencia en números romanos y la tradicional la codifica en el sufijo.'
          - texto: 'El sufijo es relativo al elemento: -ico es la mayor de las valencias que ese elemento tiene, y -oso la menor.'
          - texto: 'Como el hierro tiene 2 y 3, férrico es hierro(III) y su óxido es Fe₂O₃.'
          - texto: 'Como el plomo tiene 2 y 4, plúmbico es plomo(IV) y su óxido es PbO₂.'
          - texto: 'La nomenclatura de stock es más precisa porque la tradicional no puede nombrar elementos con más de dos valencias.'
            trampa: true
            mensaje: |
              La tradicional sí puede: para cuatro valencias tiene los prefijos
              *hipo-* y *per-*, como en hipocloroso, cloroso, clórico y
              perclórico. Lo que la hace peor no es que no llegue, es que
              obliga a saberse de memoria cuántas valencias tiene cada
              elemento antes de poder traducir el sufijo. La de stock te lo
              dice.
    resolucion: |
      ## El sufijo no es un número

      Los dos compuestos de este ejemplo se llaman igual —los dos son
      *-ico*— y tienen fórmulas que no se parecen. Esa es toda la idea:

      | tradicional | valencias del metal | stock | fórmula |
      |---|---|---|---|
      | óxido ferroso | 2 y 3 | óxido de hierro(II) | FeO |
      | óxido férrico | 2 y 3 | óxido de hierro(III) | Fe₂O₃ |
      | óxido plumboso | 2 y 4 | óxido de plomo(II) | PbO |
      | óxido plúmbico | 2 y 4 | óxido de plomo(IV) | PbO₂ |

      Las dos filas de *-ico* llevan valencias distintas, 3 y 4, porque el
      sufijo dice **«la mayor de las suyas»** y las suyas no son las mismas.

      **Cómo se traduce en la dirección difícil.** De la tradicional a la
      fórmula hay que dar un rodeo que la de stock ahorra:

      1. ¿De qué elemento se habla? Del plomo.
      2. ¿Qué valencias tiene el plomo? 2 y 4.
      3. ¿Cuál pide el sufijo? *-ico*, la mayor: 4.
      4. Y ahora se cruza.

      El paso 2 es el que falla, y falla en silencio: quien contesta 3 por
      costumbre obtiene una fórmula perfectamente escrita y equivocada.

      **Por qué esto importa más allá del apartado de formular.** En el final
      de 2024-2025 el enunciado imprime los dos nombres del mismo compuesto
      —«Plomo(II) hidróxido / hidróxido plumboso»— precisamente para que se vea
      que son la misma cosa. Y en los ejercicios de estequiometría la fórmula
      entra en la masa molar: confundir PbO₂ con Pb₂O₃ cambia el resultado de
      toda la cadena.



  # ── Y a partir de aquí, los tres problemas de la autoevaluación del tema,
  #    en su orden (§04). Es el único material de colección del tema 1 y viene
  #    RESUELTO: la hoja de resolución da todos los números intermedios, así
  #    que aquí lo nuestro no es la respuesta sino el diagnóstico.
  - id: colfq1-1-el-sulfato-amonico-y-el-abono
    titulo: El sulfato amónico, y un limitante que no es el que pesa una tonelada
    fuente: >-
      Problema 1 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      La síntesis de sulfato amónico, importante componente de determinados
      fertilizantes nitrogenados, se basa en la siguiente reacción en medio
      acuoso:

      Sulfato cálcico + anhídrido carbónico + amoniaco + agua → carbonato
      cálcico + sulfato amónico

      Calcular:

      **a)** ¿Qué cantidad de sulfato amónico se obtendrá si se dispone de una
      tonelada de sulfato cálcico y 4.870 moles de anhídrido carbónico,
      suponiendo que el rendimiento del proceso es del 90%?

      **b)** ¿Qué volumen de solución de amoníaco del 24% y de densidad
      0,9102 g/cm³ sería necesario emplear por cada tonelada de sulfato
      amónico obtenido? Indicar cuál sería la molaridad y molalidad de la
      solución de amoniaco.

      **c)** ¿Cuál sería el contenido en nitrógeno (%) de un abono que
      estuviera constituido en un 80% por sulfato amónico?
    pide: La masa de sulfato amónico, la concentración de la disolución de amoniaco y el nitrógeno del abono.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da **una tonelada** de sulfato cálcico y 4.870 moles de
          anhídrido carbónico. ¿Cuál es el reactivo limitante?
        opciones:
          - texto: El anhídrido carbónico, porque hay menos moles y la reacción va uno a uno
            correcta: true
            mensaje: |
              Eso es. Una tonelada suena a mucho, pero son
              $10^{6}/136 = 7353$ moles frente a 4870 del CO₂, y la ecuación
              ajustada los consume en proporción 1:1. Manda quien tenga menos
              **moles**, no quien pese más.
          - texto: El sulfato cálcico, porque es el que se da en masa y define la escala
            mensaje: |
              Que un dato venga en toneladas no lo convierte en limitante. Hay
              que pasarlo a moles primero, y al hacerlo salen 7353 frente a
              4870: sobra sulfato cálcico.
          - texto: El amoniaco, porque lleva coeficiente 2
            mensaje: |
              El enunciado no da cantidad de amoniaco: lo pregunta en el
              apartado b. Un reactivo del que no se dice cuánto hay se supone
              en exceso.
          - texto: No se puede saber sin ajustar la ecuación
            mensaje: |
              Ajustarla hace falta, y por eso es el primer paso — pero se
              puede: los dos reactivos con dato entran con coeficiente 1, así
              que basta comparar moles.

      - tipo: calcular
        titulo: El sulfato amónico obtenido
        pregunta: |
          Con un rendimiento del 90 %, ¿cuántas toneladas de sulfato amónico
          se obtienen?
        respuesta:
          tipo: numero
          valor: '0.579'
          tolerancia: 0.005
          formato: un número, con tres decimales, en toneladas
        distractores:
          - valor: '0.643'
            mensaje: |
              Has olvidado el rendimiento. Esos 0,643 T son lo que saldría si
              la reacción fuera completa; solo se aprovecha el 90 %.
          - valor: '0.874'
            mensaje: |
              Has usado el sulfato cálcico como limitante. Son 7353 moles
              frente a 4870 del CO₂, así que el que se acaba primero es el
              segundo.
          - valor: '4383'
            mensaje: |
              Esos son los **moles** de sulfato amónico. Falta multiplicar por
              la masa molar, 132 g/mol, y pasar de gramos a toneladas.
        pista: |
          4.870 moles de CO₂ dan como mucho 4.870 de sulfato amónico. Aplica el
          90 % y multiplica por 132 g/mol.
        desarrollo: |
          $$
          4870 \times 0{,}9 = 4383 \ \mathrm{mol\ de\ (NH_4)_2SO_4}
          $$

          $$
          4383 \times 132 = 578556\ \mathrm{g} = 0{,}579\ \mathrm{T}
          $$

      - tipo: calcular
        titulo: La molaridad de la disolución de amoniaco
        pregunta: |
          Para la disolución del 24 % con densidad 0,9102 g/cm³, ¿cuál es su
          molaridad?
        respuesta:
          tipo: numero
          valor: '12.85'
          tolerancia: 0.05
          formato: un número, con dos decimales, en moles por litro
        distractores:
          - valor: '53.54'
            mensaje: |
              Has usado los 910,2 g de **disolución** como si fueran de
              amoniaco. Solo el 24 % lo es: 218,45 g.
          - valor: '18.58'
            mensaje: |
              Esa es la **molalidad**, que divide entre los kilos de
              disolvente y no entre los litros de disolución. Son dos cosas
              distintas y el enunciado pide las dos.
          - valor: '14.11'
            mensaje: |
              Parece que has dividido entre la masa de disolvente en vez de
              entre el volumen. Comprueba qué va en el denominador de cada una.
        pista: |
          Un litro de disolución pesa 910,2 g. De esos, el 24 % es amoniaco.
        desarrollo: |
          En un litro:

          $$
          0{,}9102 \times 1000 = 910{,}2\ \text{g de disolución}
          $$

          $$
          910{,}2 \times 0{,}24 = 218{,}45\ \mathrm{g\ de\ NH_3}
          $$

          $$
          M = \frac{218{,}45 / 17}{1} = 12{,}85\ \mathrm{M}
          $$

          Y la molalidad usa el disolvente, que es lo que queda:
          $910{,}2 - 218{,}45 = 691{,}75$ g, así que
          $m = 12{,}85 / 0{,}69175 = 18{,}58$ molal.

      - tipo: justificar
        pregunta: Ordena el argumento del apartado c. Una pieza es falsa.
        piezas:
          - texto: 'Cada mol de (NH₄)₂SO₄ pesa 132 g y lleva dos átomos de nitrógeno, o sea 28 g de N.'
          - texto: 'Así que el sulfato amónico puro tiene 28/132 × 100 = 21,21 % de nitrógeno.'
          - texto: 'El abono no es sulfato amónico puro: solo un 80 % lo es.'
          - texto: 'Por tanto su contenido en nitrógeno es 21,21 × 0,80 = 16,97 %.'
          - texto: 'Como el abono tiene un 80 % de sulfato amónico, el otro 20 % también aporta nitrógeno en alguna proporción.'
            trampa: true
            mensaje: |
              El enunciado no dice qué es ese 20 % y no se puede suponer.
              Puede ser carga inerte, otro nutriente o cualquier cosa; lo
              único que se sabe es que el nitrógeno **contabilizado** viene del
              sulfato amónico. Inventarle una aportación al resto sería añadir
              un dato que nadie ha dado.
    resolucion: |
      **a · El limitante, que es el truco del apartado.** Lo primero es
      ajustar:

      $$
      \mathrm{CaSO_4} + \mathrm{CO_2} + 2\,\mathrm{NH_3} + \mathrm{H_2O} \;\longrightarrow\; \mathrm{CaCO_3} + \mathrm{(NH_4)_2SO_4}
      $$

      Y después comparar **moles**, no masas:

      $$
      \frac{10^{6}}{136} = 7353\ \mathrm{mol\ de\ CaSO_4} \qquad 4870\ \mathrm{mol\ de\ CO_2}
      $$

      Los dos entran con coeficiente 1, así que el CO₂ se acaba antes y es el
      limitante. Una tonelada impresiona y no decide nada: lo que decide es el
      recuento de partículas.

      $$
      4870 \times 0{,}9 \times 132 = 578556\ \mathrm{g} = \mathbf{0{,}579\ T}
      $$

      **b · La disolución de amoniaco.** Se razona sobre **un litro**, que es
      lo que hace corto el cálculo:

      | | |
      |---|---|
      | masa de un litro | $0{,}9102 \times 1000 = 910{,}2$ g |
      | amoniaco, el 24 % | $218{,}45$ g |
      | disolvente, el resto | $691{,}75$ g |

      $$
      M = \frac{218{,}45/17}{1\ \mathrm{L}} = 12{,}85\ \mathrm{M} \qquad m = \frac{218{,}45/17}{0{,}69175\ \mathrm{kg}} = 18{,}58\ \mathrm{molal}
      $$

      **La diferencia entre las dos**, que es lo que este apartado evalúa: la
      molaridad divide entre el **volumen de disolución** y la molalidad entre
      la **masa de disolvente**. En una disolución diluida los dos números se
      parecen y no se nota el error; aquí, con un 24 %, se llevan casi seis
      unidades.

      Y el volumen que pide el enunciado sale de los moles de amoniaco
      necesarios para una tonelada de producto —contando el rendimiento del
      90 %— divididos por esa molaridad.

      **c · El nitrógeno del abono, en dos pasos.**

      $$
      \frac{28}{132} \times 100 = 21{,}21
      $$

      es decir, un **21,21 % de nitrógeno** en el sulfato amónico puro.

      $$
      21{,}21 \times 0{,}80 = \mathbf{16{,}97\ \%} \quad\text{en el abono}
      $$

      El 28 sale de que cada fórmula lleva **dos** nitrógenos. Poner 14 es el
      fallo típico y da la mitad.

  - id: colfq1-2-el-sulfurico-que-se-diluye-dos-veces
    titulo: Un ácido concentrado, agua, y después más ácido
    fuente: >-
      Problema 2 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      **a)** Se mezclan 200 mL de una solución de ácido sulfúrico del 98% en
      peso y de densidad 1,844 g/mL con 500 mL de agua. ¿Cuál es la
      concentración de la solución resultante expresada como molaridad,
      molalidad y normalidad?

      **b)** La solución resultante en el apartado a) se mezcla con 300 mL de
      una solución de ácido sulfúrico 2 M. ¿Cuál es la concentración de la
      solución final expresada como molaridad y normalidad?
    pide: La molaridad, molalidad y normalidad de la mezcla, y las de la mezcla final.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al mezclar los 200 mL de ácido con los 500 mL de agua, ¿qué se
          conserva y qué no?
        opciones:
          - texto: Se conservan los moles de soluto; la concentración y el volumen cambian
            correcta: true
            mensaje: |
              Eso es lo único que hay que recordar de una dilución. El soluto
              es el mismo, solo está repartido en más sitio: los moles no se
              tocan y la molaridad baja en la proporción del volumen.
          - texto: Se conserva la molaridad, porque es una propiedad del ácido
            mensaje: |
              La molaridad no es una propiedad del ácido sino de **la
              disolución**. Si se conservara al diluir, diluir no serviría
              para nada.
          - texto: Se conserva la masa de disolución pero no los moles
            mensaje: |
              Es justo al revés. La masa total también se conserva —nada se
              evapora— pero lo que sirve para calcular es que **los moles de
              soluto** siguen siendo los mismos.
          - texto: No se conserva nada; hay que recalcularlo todo desde cero
            mensaje: |
              Si no se conservara nada no habría forma de resolverlo. La
              cantidad de ácido puro que había en los 200 mL sigue estando
              ahí después de añadir agua.

      - tipo: calcular
        titulo: La molaridad tras diluir
        pregunta: |
          ¿Cuál es la molaridad de la disolución resultante del apartado a?
        respuesta:
          tipo: numero
          valor: '5.27'
          tolerancia: 0.02
          formato: un número, con dos decimales, en moles por litro
        distractores:
          - valor: '18.44'
            mensaje: |
              Esa es la molaridad del ácido **concentrado**, antes de añadir el
              agua. Los mismos moles en 0,2 L en vez de en 0,7.
          - valor: '3.688'
            mensaje: |
              Esos son los **moles** de ácido, que es el paso intermedio.
              Falta dividir entre el volumen total en litros.
          - valor: '10.54'
            mensaje: |
              Esa es la **normalidad**, que para el sulfúrico es el doble de la
              molaridad porque cede dos protones.
        pista: |
          Masa de disolución, masa de ácido puro, moles, y divide entre
          $0{,}2 + 0{,}5$ litros.
        desarrollo: |
          $$
          1{,}844 \times 200 = 368{,}8\ \text{g de disolución}
          $$

          $$
          368{,}8 \times 0{,}98 = 361{,}424\ \mathrm{g\ de\ H_2SO_4}
          $$

          $$
          M = \frac{361{,}424/98}{0{,}7} = 5{,}27\ \mathrm{M}
          $$

          Y la normalidad, $N = 5{,}27 \times 2 = 10{,}54$, porque el sulfúrico
          es diprótico.

      - tipo: calcular
        titulo: La molalidad, que no divide por lo mismo
        pregunta: |
          ¿Y la molalidad de esa misma disolución?
        respuesta:
          tipo: numero
          valor: '7.27'
          tolerancia: 0.03
          formato: un número, con dos decimales, en moles por kilo
        distractores:
          - valor: '5.27'
            mensaje: |
              Esa es la molaridad. La molalidad divide entre los **kilos de
              disolvente**, no entre los litros de disolución, y aquí los dos
              números no se parecen.
          - valor: '3.688'
            mensaje: |
              Esos son los moles de soluto. Falta dividir entre la masa de
              disolvente en kilos.
        pista: |
          El disolvente son los 500 g de agua **más** el agua que ya traía la
          disolución concentrada, que es $368{,}8 - 361{,}424$.
        desarrollo: |
          El ácido concentrado no era puro: de sus 368,8 g, solo 361,424 eran
          ácido, así que aportaba $7{,}376$ g de agua.

          $$
          m = \frac{361{,}424/98}{(7{,}376 + 500) \times 10^{-3}} = 7{,}27\ \mathrm{molal}
          $$

          Olvidar esos 7,4 g cambia el resultado en una centésima aquí, pero
          en una disolución más concentrada cambia mucho más: el hábito de
          contarlos es lo que hay que llevarse.

      - tipo: calcular
        titulo: La mezcla final
        pregunta: |
          Añadiendo 300 mL de sulfúrico 2 M a los 700 mL anteriores, ¿cuál es
          la molaridad final?
        respuesta:
          tipo: numero
          valor: '4.288'
          tolerancia: 0.01
          formato: un número, con tres decimales, en moles por litro
        distractores:
          - valor: '3.635'
            mensaje: |
              Has hecho la media de las dos molaridades, $(5{,}27 + 2)/2$. No
              vale: las dos disoluciones aportan volúmenes distintos, así que
              hay que sumar **moles** y dividir entre el volumen total.
          - valor: '7.27'
            mensaje: |
              Has sumado las dos concentraciones. Al mezclar dos disoluciones
              del mismo soluto la concentración final queda **entre** las dos,
              nunca por encima de la mayor.
          - valor: '5.27'
            mensaje: |
              Esa es la del apartado a. Añadir una disolución más diluida tiene
              que bajarla.
        pista: |
          Suma los moles de las dos y divide entre $0{,}7 + 0{,}3$.
        desarrollo: |
          $$
          M = \frac{361{,}424/98 + 2 \times 0{,}3}{0{,}7 + 0{,}3} = \frac{3{,}688 + 0{,}6}{1} = 4{,}288\ \mathrm{M}
          $$

          Y $N = 4{,}288 \times 2 = 8{,}576$.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los 200 mL del concentrado pesan 1,844 × 200 = 368,8 g, de los que el 98 % —361,424 g— es ácido puro.'
          - texto: 'Eso son 3,688 moles, que no cambian al añadir agua: lo único que cambia es el volumen, que pasa a 0,7 L.'
          - texto: 'Así que M = 5,27 y N = 10,54, porque el sulfúrico cede dos protones.'
          - texto: 'La molalidad divide entre el disolvente, que son los 500 g de agua más los 7,376 g que traía el concentrado: 7,27 molal.'
          - texto: 'Al añadir 300 mL de 2 M se suman 0,6 moles más y el volumen pasa a 1 L, así que la molaridad final es 4,288.'
          - texto: 'Al mezclar dos disoluciones del mismo ácido, la concentración final es la media de las dos.'
            trampa: true
            mensaje: |
              Solo si los dos volúmenes fueran iguales, y aquí son 700 y 300
              mL. La media daría 3,635 y el resultado es 4,288: la disolución
              más concentrada aporta más volumen y tira del resultado hacia
              ella. Se suman moles y se divide entre el volumen total, siempre.
    resolucion: |
      **a · Del frasco comercial a la disolución.** Un reactivo comercial se
      describe con dos datos que hay que usar en orden: la **densidad** lleva
      de volumen a masa de disolución, y la **riqueza** de ahí a masa de
      soluto.

      $$
      1{,}844 \times 200 = 368{,}8\ \text{g de disolución} \;\longrightarrow\; \times 0{,}98 = 361{,}424\ \mathrm{g\ de\ H_2SO_4}
      $$

      $$
      n = \frac{361{,}424}{98} = 3{,}688\ \mathrm{mol}
      $$

      Esos moles **no cambian** al añadir agua. Lo que cambia es el volumen:

      $$
      M = \frac{3{,}688}{0{,}7} = 5{,}27\ \mathrm{M} \qquad N = 2M = 10{,}54\ \mathrm{N}
      $$

      **La molalidad, y el detalle que se olvida.** Divide entre los kilos de
      **disolvente**, y el disolvente no son solo los 500 g de agua añadida:
      la disolución concentrada traía ya $368{,}8 - 361{,}424 = 7{,}376$ g.

      $$
      m = \frac{3{,}688}{0{,}507376} = 7{,}27\ \mathrm{molal}
      $$

      **b · Mezclar dos disoluciones del mismo soluto.** Se suman moles y se
      divide entre el volumen total. Nunca se promedian concentraciones:

      $$
      M = \frac{3{,}688 + 2 \times 0{,}3}{1{,}0} = 4{,}288\ \mathrm{M} \qquad N = 8{,}576\ \mathrm{N}
      $$

      **Las tres comprobaciones que salvan el ejercicio.**

      La primera es de **sentido**: al diluir, la molaridad baja; al mezclar
      con algo más diluido, también. Si te sale un número mayor que 5,27 en el
      apartado b, hay un error antes de mirar las cuentas.

      La segunda es la **normalidad**: para el sulfúrico es el doble de la
      molaridad, siempre, porque cede dos protones. Para el clorhídrico serían
      iguales.

      Y la tercera es el **disolvente que ya venía dentro**. Aquí son 7,4 g
      sobre 507 y apenas se nota; en un problema con menos agua añadida
      decidiría la respuesta.

  - id: colfq1-3-la-niacina-y-las-dos-muestras
    titulo: La niacina, y un nitrógeno medido sobre otra muestra
    fuente: >-
      Problema 3 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      La niacina o ácido nicotínico se comercializa en forma de polvo blanco
      cristalino y presenta un peso molecular de 123 g/mol. Este compuesto está
      formado por C, H, O y N. La combustión de 2,50 g de niacina produce
      5,36 g de dióxido de carbono y 0,91 g de agua. Por otro lado, un análisis
      realizado a 3,50 g de muestra con un determinado método analítico
      proporcionó un valor de 1,31 g de dióxido de nitrógeno. Calcular la
      fórmula molecular de la niacina.
    pide: La fórmula molecular de la niacina.

    pasos:
      - tipo: reconocer
        pregunta: |
          La combustión se hace sobre 2,50 g y el análisis de nitrógeno sobre
          3,50 g. ¿Qué hay que hacer con eso?
        opciones:
          - texto: Escalar el nitrógeno a los 2,50 g, para que todo se refiera a la misma muestra
            correcta: true
            mensaje: |
              Ese es el paso que decide el problema. Los porcentajes de una
              fórmula empírica salen de comparar masas **de la misma muestra**,
              así que hay que llevar el nitrógeno de 3,50 a 2,50 g antes de
              comparar nada.
          - texto: Nada; los porcentajes salen igual con cualquier muestra
            mensaje: |
              Salen igual si se calculan **como porcentajes**. Pero aquí se van
              a restar gramos para sacar el oxígeno por diferencia, y para eso
              todas las masas tienen que ser de la misma muestra.
          - texto: Sumar las dos muestras y trabajar con 6,00 g
            mensaje: |
              No son dos partes de un mismo análisis: son dos análisis
              distintos sobre porciones distintas del mismo compuesto. Sumarlas
              no significa nada.
          - texto: Usar 3,50 g para todo, porque es la muestra mayor
            mensaje: |
              Entonces el carbono y el hidrógeno estarían mal escalados. Da
              igual a cuál de las dos se lleve todo — lo que no vale es
              mezclarlas.

      - tipo: calcular
        titulo: Los moles de carbono
        pregunta: |
          De los 5,36 g de CO₂, ¿cuántos moles de átomos de carbono salen?
        respuesta:
          tipo: numero
          valor: '0.1218'
          tolerancia: 0.0005
          formato: un número, con cuatro decimales, en moles
        distractores:
          - valor: '0.4467'
            mensaje: |
              Has dividido entre 12 en vez de entre 44. Los 5,36 g son de
              **dióxido de carbono**, no de carbono: primero moles de CO₂ y
              después, uno a uno, moles de C.
          - valor: '1.4618'
            mensaje: |
              Esos son los **gramos** de carbono, que es el paso siguiente. La
              pregunta es por moles.
          - valor: '0.0609'
            mensaje: |
              Has dividido por dos en algún sitio, quizá contando dos carbonos
              por molécula de CO₂. Solo lleva uno.
        pista: |
          $5{,}36 / 44$, y cada CO₂ lleva un solo carbono.
        desarrollo: |
          $$
          \frac{5{,}36}{44} = 0{,}1218\ \mathrm{mol\ de\ CO_2} = 0{,}1218\ \mathrm{mol\ de\ C}
          $$

          Y en gramos, $0{,}1218 \times 12 = 1{,}4618$ g.

      - tipo: calcular
        titulo: El oxígeno, que no se mide
        pregunta: |
          Con 1,4618 g de C, 0,1011 g de H y 0,2848 g de N en los 2,50 g de
          muestra, ¿cuántos gramos de oxígeno hay?
        respuesta:
          tipo: numero
          valor: '0.6523'
          tolerancia: 0.002
          formato: un número, con cuatro decimales, en gramos
        distractores:
          - valor: '1.8477'
            mensaje: |
              Has sumado los tres en vez de restarlos del total. El oxígeno es
              lo que **sobra** de la muestra una vez descontados los otros.
          - valor: '0.3675'
            mensaje: |
              Parece que has usado 3,50 g como masa de muestra. Todas las
              masas están referidas a los 2,50 g de la combustión.
        pista: |
          El oxígeno no se mide en ninguno de los dos análisis: sale por
          diferencia.
        desarrollo: |
          $$
          2{,}50 - (1{,}4618 + 0{,}1011 + 0{,}2848) = 0{,}6523\ \mathrm{g\ de\ O}
          $$

          Es el único elemento que no se determina: se obtiene restando, y por
          eso arrastra el error de los otros tres.

      - tipo: calcular
        titulo: La fórmula molecular
        pregunta: |
          Dividiendo los cuatro entre el menor y comprobando con la masa
          molecular de 123 g/mol, ¿cuál es la fórmula molecular?
        respuesta:
          tipo: formula
          valor: C6H5NO2
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: C6H5N2O2
            mensaje: |
              Sobra un nitrógeno. Los 0,0203 moles de N son justo el menor de
              los cuatro, así que su subíndice es 1 por construcción.
          - valor: C12H10N2O4
            mensaje: |
              Esa es la empírica multiplicada por dos, y no cuadra con la masa
              molecular: pesaría 246 y el enunciado dice 123. El factor $n$
              sale de dividir la masa molecular entre la de la fórmula
              empírica, y aquí vale 1.
          - valor: C6H6NO2
            mensaje: |
              Has redondeado el hidrógeno hacia arriba. El cociente es
              $0{,}1011/0{,}0203 = 4{,}98$, que redondea a 5 y no a 6, y con 6
              la masa molecular saldría 124.
        pista: |
          Divide los cuatro números de moles entre 0,0203 y redondea. Después
          comprueba que la masa suma 123.
        desarrollo: |
          | | moles | ÷ 0,0203 |
          |---|---|---|
          | C | 0,1218 | 6 |
          | H | 0,1011 | 5 |
          | N | 0,0203 | 1 |
          | O | 0,0408 | 2 |

          La fórmula empírica es $\mathrm{C_6H_5NO_2}$, que pesa
          $12 \times 6 + 5 + 14 + 32 = 123$. Como la masa molecular también es
          123, $n = 1$ y la molecular coincide con la empírica.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'De la combustión de 2,50 g salen 0,1218 mol de C —1,4618 g— y 0,1011 mol de H —0,1011 g—.'
          - texto: 'El nitrógeno se mide sobre 3,50 g, así que hay que escalarlo: 0,3987 g en 3,50 g son 0,2848 g en 2,50 g.'
          - texto: 'El oxígeno sale por diferencia: 2,50 − (1,4618 + 0,1011 + 0,2848) = 0,6523 g, o sea 0,0408 mol.'
          - texto: 'Dividiendo los cuatro entre el menor, 0,0203, salen 6, 5, 1 y 2: la fórmula empírica es C₆H₅NO₂.'
          - texto: 'Esa fórmula pesa 123, igual que la masa molecular del enunciado, así que n = 1 y la molecular es la misma.'
          - texto: 'La fórmula empírica y la molecular son siempre la misma cosa cuando el compuesto es orgánico.'
            trampa: true
            mensaje: |
              Coinciden aquí porque $n$ ha salido 1, y eso es un resultado, no
              una regla. El benceno es C₆H₆ y su empírica es CH; la glucosa es
              C₆H₁₂O₆ y su empírica es CH₂O. Por eso el enunciado da la masa
              molecular: sin ella no se puede saber el factor.
    resolucion: |
      **El paso que decide el problema está en la segunda frase.** La
      combustión se hace sobre **2,50 g** y el análisis de nitrógeno sobre
      **3,50 g**. Son dos muestras distintas del mismo compuesto, y para
      compararlas hay que llevarlas a la misma masa.

      Es exactamente la misma trampa que el ejercicio de la cocaína del control
      de 2023-2024, y por eso conviene reconocerla: cuando un enunciado da dos
      masas de muestra distintas, lo está haciendo a propósito.

      **De la combustión, sobre 2,50 g:**

      $$
      \frac{5{,}36}{44} = 0{,}1218\ \mathrm{mol\ C} \rightarrow 1{,}4618\ \mathrm{g}
      $$

      $$
      \frac{0{,}91}{18} \times 2 = 0{,}1011\ \mathrm{mol\ H} \rightarrow 0{,}1011\ \mathrm{g}
      $$

      El hidrógeno lleva el factor 2 porque cada molécula de agua tiene dos.

      **Del análisis, sobre 3,50 g, y escalado:**

      $$
      \frac{1{,}31}{46} = 0{,}0285\ \mathrm{mol\ N} \rightarrow 0{,}3987\ \mathrm{g\ en\ 3{,}50\ g}
      $$

      $$
      0{,}3987 \times \frac{2{,}50}{3{,}50} = 0{,}2848\ \mathrm{g\ en\ 2{,}50\ g} \rightarrow 0{,}0203\ \mathrm{mol}
      $$

      **El oxígeno, por diferencia**, porque no se mide en ninguno de los dos:

      $$
      2{,}50 - (1{,}4618 + 0{,}1011 + 0{,}2848) = 0{,}6523\ \mathrm{g} \rightarrow 0{,}0408\ \mathrm{mol}
      $$

      **Los cocientes** entre el menor de los cuatro dan 6, 5, 1 y 2, así que
      la empírica es $\mathrm{C_6H_5NO_2}$. Pesa 123, igual que la masa
      molecular del enunciado, luego $n = 1$ y la molecular coincide.

      **Por qué el enunciado da la masa molecular.** Porque la empírica sola no
      basta: dice la **proporción** y no el tamaño. El benceno y el acetileno
      tienen la misma empírica, CH, y son C₆H₆ y C₂H₂. Aquí $n$ ha salido 1 y
      es un resultado, no una regla.

  # ═══════════════════════════════════════════════════════════════════
  # LAS TRES HOJAS DE FORMULACIÓN DEL CURSO, ENTERAS
  # ═══════════════════════════════════════════════════════════════════
  #
  #    180 compuestos en 16 ejercicios, en el orden de cada hoja: primero la
  #    columna de nombrar y después la de formular. Entraron el 28 de
  #    septiembre de 2026 (fase G1 de la auditoría). Hasta ese día este tema
  #    tenía dos ejemplos de entrada y los veinte compuestos de dos controles,
  #    y la ruta culpaba al material de un hueco que el material no tenía.
  #
  #    Las respuestas oficiales —la hoja 3 entera y la «hoja de 58», que
  #    cubre parte de la 1 y los hidróxidos de la 2— están contrastadas una a
  #    una. Donde traen una errata química (AuO₃, RaMnO₄ llamado
  #    permanganato, CdH2(PO4)2), la oficial entra como distractor con un
  #    mensaje honesto y la `fuente` lo dice.
  #
  #    Los transcribieron cuatro agentes, cada uno con una hoja o una columna,
  #    y se revisaron enteros antes de entrar aquí. Al hacerlo encontraron el
  #    fallo del lector de fórmulas que cuenta `lib/quimica.ts`.

  # ── Hoja 1 de formulación, columna de nombrar, en cuatro bloques de diez y
  #    en el orden de la hoja (§04). La hoja de respuestas del material («la
  #    hoja de 58») no sigue esta numeración: cada respuesta se ha casado con
  #    su fórmula a mano, y las dos que no casan (el 28 y el 39) lo dicen su
  #    paso y su `fuente`.
  - id: colfq1-f1-nombrar-del-1-al-10
    titulo: 'Hoja 1 de formulación: nombrar del 1 al 10, óxidos, anhídridos y una sal'
    fuente: >-
      Ejercicios de formulación-1, columna «Escribir el nombre de los
      siguientes compuestos», del 1 al 10 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de respuestas del material publica las del 1, 2, 3, 4 y 10, y las
      cinco coinciden con las de aquí; las de los cinco anhídridos, del 5 al
      9, son nuestras.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      1. Al₂O₃
      2. MnO
      3. Co₂O₃
      4. HgO
      5. SO₂
      6. Br₂O
      7. I₂O₇
      8. P₂O₃
      9. Sb₂O₅
      10. NaCl
    pide: El nombre de los diez compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          Nueve de los diez son combinaciones con el oxígeno. ¿Qué decide si
          su nombre tradicional empieza por «óxido» o por «anhídrido»?
        opciones:
          - texto: 'Que el otro elemento sea un metal (óxido) o un no metal (anhídrido)'
            correcta: true
            mensaje: |
              Eso es. Al, Mn, Co y Hg son metales y dan óxidos; S, Br, I, P y
              Sb son no metales y dan anhídridos. Es lo primero que se mira,
              antes de sacar ningún número de oxidación.
          - texto: 'El número de oxígenos: con tres o más es anhídrido'
            mensaje: |
              El Al₂O₃ y el Co₂O₃ llevan tres oxígenos y son óxidos, y el Br₂O
              lleva uno y es un anhídrido. El número de oxígenos sale del cruce
              de valencias; no dice de qué familia es el compuesto.
          - texto: 'La valencia: por encima de +3 es anhídrido'
            mensaje: |
              El Br₂O es un anhídrido con el bromo a +1, y el P₂O₃ lo es con el
              fósforo a +3. Lo que manda es si el elemento es metal o no metal,
              no cuánto vale su número.
          - texto: 'Que el compuesto sea un gas o un sólido'
            mensaje: |
              El estado físico no entra en el nombre: el SO₂ es un gas y el
              Sb₂O₅ un sólido, y los dos son anhídridos. El nombre sale de la
              fórmula, no de cómo se ve en el frasco.

      - tipo: calcular
        titulo: 'El 1: Al₂O₃'
        pregunta: |
          Nombra el Al₂O₃.
        respuesta:
          tipo: formula
          valor: óxido de aluminio | óxido alumínico | óxido de aluminio(III) | trióxido de dialuminio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido alumínico
            mensaje: |
              El aluminio es un metal, y la combinación de un metal con el
              oxígeno es un óxido. «Anhídrido» es para los no metales, como el
              boro que tiene justo encima en la tabla: el B₂O₃ sí es el
              anhídrido bórico, y el Al₂O₃ se le parece en la fórmula, no en la
              familia.
          - valor: trióxido de aluminio
            mensaje: |
              En la sistemática el prefijo cuenta los átomos de **cada**
              elemento, y aquí hay dos aluminios: trióxido de **di**aluminio.
              «Trióxido de aluminio» sería AlO₃.
        pista: |
          El aluminio solo tiene un estado, +3, y el oxígeno va a −2.
        desarrollo: |
          Aluminio +3 y oxígeno −2, cruzados:
          $2\times(+3) + 3\times(-2) = 0$. Como el aluminio no tiene otro
          estado, no hay sufijo que elegir: óxido de aluminio, u óxido
          alumínico. En sistemática, trióxido de dialuminio. Es la de la hoja
          de respuestas.

      - tipo: calcular
        titulo: 'El 2: MnO'
        pregunta: |
          Nombra el MnO.
        respuesta:
          tipo: formula
          valor: óxido manganoso | óxido de manganeso(II) | monóxido de manganeso | monoóxido de manganeso
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido mangánico
            mensaje: |
              Mangánico es el manganeso a +3, el Mn₂O₃, que es el 16 de la
              columna de formular. Aquí un manganeso compensa un solo oxígeno
              a −2: actúa con +2, y en los óxidos de metal del manganeso ese es
              el -oso.
          - valor: anhídrido manganoso
            mensaje: |
              El curso llama anhídrido manganoso al MnO₂, con el manganeso a +4
              haciendo de no metal. En el MnO actúa con +2, como metal, y la
              combinación es un óxido: óxido manganoso.
          - valor: óxido de manganeso(I)
            mensaje: |
              Uno a uno no quiere decir valencia 1. El oxígeno va a −2, así que
              el manganeso que lo compensa tiene que ser +2: óxido de
              manganeso(II).
        pista: |
          Un solo oxígeno a −2 frente a un solo manganeso. En sus óxidos de
          metal, el manganeso va con -oso a +2 y con -ico a +3.
        desarrollo: |
          Manganeso +2 y oxígeno −2, uno a uno: $(+2) + (-2) = 0$. El curso
          nombra con -oso el óxido de manganeso +2 y con -ico el de +3, el
          Mn₂O₃: este es el óxido manganoso, u óxido de manganeso(II). Es la
          de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 3: Co₂O₃'
        pregunta: |
          Nombra el Co₂O₃.
        respuesta:
          tipo: formula
          valor: óxido cobáltico | óxido de cobalto(III) | trióxido de dicobalto
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido cobaltoso
            mensaje: |
              Cobaltoso es el cobalto a +2, el CoO. Aquí dos cobaltos compensan
              tres oxígenos a −2, o sea −6, y cada uno pone +3: el mayor de sus
              dos estados, que es -ico.
          - valor: óxido de cobalto(VI)
            mensaje: |
              Has cargado a un solo cobalto el −6 de los tres oxígenos, pero
              hay dos cobaltos y se lo reparten: +3 cada uno. El cobalto no
              tiene +6; si la cuenta te lo da, falta dividir entre dos.
          - valor: trióxido de cobalto
            mensaje: |
              Falta el prefijo del cobalto: hay dos, así que es trióxido de
              **di**cobalto. «Trióxido de cobalto» sería CoO₃.
        pista: |
          El cobalto tiene +2 y +3. Reparte entre los dos cobaltos la carga de
          los tres oxígenos.
        desarrollo: |
          Tres oxígenos a −2 suman −6, y dos cobaltos los compensan a +3 cada
          uno: $2\times(+3) + 3\times(-2) = 0$. El +3 es el mayor de los dos
          estados del cobalto: óxido cobáltico, u óxido de cobalto(III). Es la
          de la hoja de respuestas, y el ejemplo que pone el propio curso para
          los óxidos metálicos.

      - tipo: calcular
        titulo: 'El 4: HgO'
        pregunta: |
          Nombra el HgO.
        respuesta:
          tipo: formula
          valor: óxido mercúrico | óxido de mercurio(II) | monóxido de mercurio | monoóxido de mercurio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido mercurioso
            mensaje: |
              Mercurioso es el mercurio a +1, y su óxido es el Hg₂O, con dos
              mercurios por oxígeno. Aquí hay uno para uno: el mercurio pone +2,
              el mayor de sus dos estados, y eso es -ico.
          - valor: óxido de mercurio(I)
            mensaje: |
              Uno a uno no quiere decir valencia 1. El oxígeno va a −2, así que
              el mercurio que lo compensa tiene que ser +2: óxido de
              mercurio(II).
        pista: |
          El mercurio tiene +1 y +2, y aquí compensa él solo un oxígeno a −2.
        desarrollo: |
          Mercurio +2 y oxígeno −2: $(+2) + (-2) = 0$. El +2 es el mayor de los
          dos del mercurio: óxido mercúrico, u óxido de mercurio(II). Es la de
          la hoja de respuestas, y el 36 de la columna de formular es este
          mismo, al revés.

      - tipo: calcular
        titulo: 'El 5: SO₂'
        pregunta: |
          Nombra el SO₂.
        respuesta:
          tipo: formula
          valor: anhídrido sulfuroso | óxido de azufre(IV) | dióxido de azufre | bióxido de azufre
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido sulfúrico
            mensaje: |
              Sulfúrico es el azufre a +6, el SO₃. En el SO₂ dos oxígenos a −2
              suman −4 y el azufre pone +4: el de en medio de sus tres
              estados, +2, +4 y +6, que es el -oso.
          - valor: óxido de azufre(II)
            mensaje: |
              El 2 es el número de oxígenos, no la valencia del azufre. Dos
              oxígenos a −2 suman −4, así que el azufre es +4: óxido de
              azufre(IV).
          - valor: óxido sulfuroso
            mensaje: |
              El número está bien; la familia, no. El azufre es un no metal, y
              en la nomenclatura del curso su combinación con el oxígeno es un
              anhídrido: anhídrido sulfuroso. El «óxido» con -oso o -ico es
              para los metales, como el óxido mercúrico del 4.
        pista: |
          El azufre es un no metal con +2, +4 y +6. Dos oxígenos a −2.
        desarrollo: |
          Dos oxígenos a −2 suman −4, y el azufre pone +4:
          $(+4) + 2\times(-2) = 0$. Con tres estados, el +2 es hipo-…-oso,
          el +4 es -oso y el +6 es -ico: anhídrido sulfuroso, que es el ejemplo
          de la tabla de anhídridos del curso. En Stock, óxido de azufre(IV); en
          sistemática, dióxido de azufre. El 2 de la columna de formular es
          este mismo, al revés.

      - tipo: calcular
        titulo: 'El 6: Br₂O'
        pregunta: |
          Nombra el Br₂O.
        respuesta:
          tipo: formula
          valor: anhídrido hipobromoso | óxido de bromo(I) | monóxido de dibromo | monoóxido de dibromo | óxido de dibromo
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido bromoso
            mensaje: |
              Bromoso es el bromo a +3, el Br₂O₃, que es el 11 de la columna de
              formular. Aquí dos bromos compensan un solo oxígeno a −2: +1 cada
              uno, el más bajo de sus cuatro estados, y a ese le toca
              hipo-…-oso.
          - valor: óxido de bromo(II)
            mensaje: |
              Has cargado a un solo bromo el −2 del oxígeno, pero hay dos
              bromos y se lo reparten: +1 cada uno. Y el bromo ni siquiera
              tiene +2: sus estados positivos son +1, +3, +5 y +7.
        pista: |
          El bromo tiene +1, +3, +5 y +7. Un solo oxígeno a −2 para dos bromos.
        desarrollo: |
          Un oxígeno a −2 repartido entre dos bromos: +1 cada uno,
          $2\times(+1) + (-2) = 0$. Con cuatro estados, el +1 es el primero,
          hipo-…-oso: anhídrido hipobromoso, igual que el Cl₂O es el
          hipocloroso del ejemplo del curso. En Stock, óxido de bromo(I); en
          sistemática, monóxido de dibromo.

      - tipo: calcular
        titulo: 'El 7: I₂O₇'
        pregunta: |
          Nombra el I₂O₇.
        respuesta:
          tipo: formula
          valor: anhídrido periódico | anhídrido peryódico | óxido de yodo(VII) | óxido de iodo(VII) | heptaóxido de diyodo | heptóxido de diyodo | heptaóxido de diiodo | heptóxido de diiodo
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido yódico
            mensaje: |
              Yódico es el yodo a +5, el I₂O₅. Aquí siete oxígenos a −2 suman
              −14 y cada yodo pone +7, el más alto de sus cuatro estados: le
              toca per-…-ico, anhídrido periódico.
          - valor: anhídrido iódico
            mensaje: |
              Iódico, con la grafía del curso, es el yodo a +5, el I₂O₅. Aquí el
              yodo está a +7, el más alto de sus cuatro estados, y falta el
              prefijo per-: anhídrido periódico.
          - valor: heptaóxido de yodo
            mensaje: |
              Falta el prefijo del yodo: hay dos, así que es heptaóxido de
              **di**yodo. «Heptaóxido de yodo» sería IO₇.
        pista: |
          El yodo tiene +1, +3, +5 y +7. Siete oxígenos a −2 para dos yodos.
        desarrollo: |
          Siete oxígenos a −2 suman −14, y cada yodo pone +7:
          $2\times(+7) + 7\times(-2) = 0$. El +7 es el más alto de los cuatro,
          per-…-ico: anhídrido periódico (o peryódico, si se escribe yodo en
          vez de iodo). En Stock, óxido de yodo(VII); en sistemática,
          heptaóxido de diyodo.

      - tipo: calcular
        titulo: 'El 8: P₂O₃'
        pregunta: |
          Nombra el P₂O₃.
        respuesta:
          tipo: formula
          valor: anhídrido fosforoso | óxido de fósforo(III) | trióxido de difósforo
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido fosfórico
            mensaje: |
              Fosfórico es el fósforo a +5, el P₂O₅. Aquí tres oxígenos a −2
              suman −6 y cada fósforo pone +3: el de en medio de sus tres
              estados, +1, +3 y +5, que es el -oso.
          - valor: trióxido de fósforo
            mensaje: |
              Falta el prefijo del fósforo: hay dos, así que es trióxido de
              **di**fósforo. «Trióxido de fósforo» sería PO₃.
        pista: |
          El curso da al fósforo +1, +3 y +5. Tres oxígenos a −2 para dos
          fósforos.
        desarrollo: |
          Tres oxígenos a −2 suman −6, y cada fósforo pone +3:
          $2\times(+3) + 3\times(-2) = 0$. De los tres estados, el +1 es
          hipo-…-oso, el +3 es -oso y el +5 es -ico: anhídrido fosforoso. En
          Stock, óxido de fósforo(III); en sistemática, trióxido de difósforo.
          El 7 de la columna de formular es este mismo al revés, y el 34 de
          allí, el hipofosforoso, es el P₂O.

      - tipo: calcular
        titulo: 'El 9: Sb₂O₅'
        pregunta: |
          Nombra el Sb₂O₅.
        respuesta:
          tipo: formula
          valor: anhídrido antimónico | óxido de antimonio(V) | pentaóxido de diantimonio | pentóxido de diantimonio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: anhídrido antimonioso
            mensaje: |
              Antimonioso es el antimonio a +3, el Sb₂O₃. Aquí cinco oxígenos a
              −2 suman −10 y cada antimonio pone +5, el mayor de sus estados:
              el -ico, anhídrido antimónico.
          - valor: pentaóxido de antimonio
            mensaje: |
              Falta el prefijo del antimonio: hay dos, así que es pentaóxido de
              **di**antimonio. «Pentaóxido de antimonio» sería SbO₅.
        pista: |
          El antimonio va con el fósforo en la tabla del curso, y su estado más
          alto es +5. Cinco oxígenos a −2 para dos antimonios.
        desarrollo: |
          Cinco oxígenos a −2 suman −10, y cada antimonio pone +5:
          $2\times(+5) + 5\times(-2) = 0$. El +5 es el más alto de sus estados,
          así que el sufijo es -ico: anhídrido antimónico. El curso pone el
          antimonio entre los no metales, con el fósforo y el arsénico, y por
          eso es anhídrido y no óxido. En Stock, óxido de antimonio(V); en
          sistemática, pentaóxido de diantimonio.

      - tipo: calcular
        titulo: 'El 10: NaCl'
        pregunta: |
          Nombra el NaCl.
        respuesta:
          tipo: formula
          valor: cloruro sódico | cloruro de sodio | cloruro de sodio(I)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: clorato de sodio
            mensaje: |
              El clorato lleva oxígeno: es el NaClO₃, una oxisal. En el NaCl no
              hay oxígeno, y la sal de un no metal solo, sin oxígeno, se nombra
              con la terminación -uro: cloruro.
          - valor: hipoclorito de sodio
            mensaje: |
              El hipoclorito es el NaClO, el de la lejía: lleva un oxígeno. El
              NaCl no lleva ninguno, así que es una sal binaria y el cloro acaba
              en -uro.
        pista: |
          No hay oxígeno: es una sal binaria. El cloro, frente a un metal, va a
          −1.
        desarrollo: |
          Sodio +1 y cloro −1, uno a uno: $(+1) + (-1) = 0$. Un metal con un no
          metal y sin oxígeno es una sal binaria, y el no metal se nombra con
          la terminación -uro: cloruro sódico, o cloruro de sodio. Es la de la
          hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el método, con el I₂O₇ de ejemplo. Una pieza es falsa.
        piezas:
          - texto: 'Lo primero es la familia: el yodo es un no metal, así que el I₂O₇ es un anhídrido y no un óxido.'
          - texto: 'Después, la neutralidad: siete oxígenos a −2 suman −14, y los dos yodos tienen que poner +14, o sea +7 cada uno.'
          - texto: 'El yodo tiene cuatro estados positivos, +1, +3, +5 y +7, y el +7 es el más alto: le tocan per- y -ico.'
          - texto: 'Así que es el anhídrido periódico, y el nombre de Stock, óxido de yodo(VII), dice el mismo +7 en romanos.'
          - texto: 'La neutralidad se puede ahorrar: el subíndice del oxígeno es siempre la valencia del otro elemento, así que en el SO₂ el azufre actúa con 2.'
            trampa: true
            mensaje: |
              Eso solo funciona cuando el otro elemento lleva un 2 debajo, como
              en el I₂O₇, porque entonces la fórmula es el cruce de valencias
              sin simplificar. El SO₂ viene de simplificar S₂O₄: el azufre
              es +4, y es el anhídrido sulfuroso. La neutralidad no necesita
              saber si se simplificó.
    resolucion: |
      | | fórmula | tradicional | Stock · sistemática |
      |---|---|---|---|
      | 1 | Al₂O₃ | óxido de aluminio | óxido de aluminio · trióxido de dialuminio |
      | 2 | MnO | óxido manganoso | óxido de manganeso(II) · monóxido de manganeso |
      | 3 | Co₂O₃ | óxido cobáltico | óxido de cobalto(III) · trióxido de dicobalto |
      | 4 | HgO | óxido mercúrico | óxido de mercurio(II) · monóxido de mercurio |
      | 5 | SO₂ | anhídrido sulfuroso | óxido de azufre(IV) · dióxido de azufre |
      | 6 | Br₂O | anhídrido hipobromoso | óxido de bromo(I) · monóxido de dibromo |
      | 7 | I₂O₇ | anhídrido periódico | óxido de yodo(VII) · heptaóxido de diyodo |
      | 8 | P₂O₃ | anhídrido fosforoso | óxido de fósforo(III) · trióxido de difósforo |
      | 9 | Sb₂O₅ | anhídrido antimónico | óxido de antimonio(V) · pentaóxido de diantimonio |
      | 10 | NaCl | cloruro sódico | cloruro de sodio |

      **Lo que se lleva uno del bloque.** Antes de ningún número se decide la
      familia: con un metal es un óxido y con un no metal, un anhídrido.
      Después, el número de oxidación sale de la neutralidad y no de leer el
      subíndice del oxígeno: en el SO₂ el azufre es +4 aunque lleve un 2.

      Las respuestas del 1, 2, 3, 4 y 10 son las de la hoja de respuestas del
      material; las de los cinco anhídridos, del 5 al 9, son nuestras.

  - id: colfq1-f1-nombrar-del-11-al-20
    titulo: 'Hoja 1 de formulación: nombrar del 11 al 20, peróxidos, óxidos, hidruros y el amoniaco'
    fuente: >-
      Ejercicios de formulación-1, columna «Escribir el nombre de los
      siguientes compuestos», del 11 al 20 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de respuestas del material publica todas menos la del 14, el H₂S,
      que es nuestra, y coinciden con las de aquí; la del 11 viene escrita
      «Peroxidode litio», con una errata de teclado.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      11. Li₂O₂
      12. MgH₂
      13. NH₃
      14. H₂S
      15. Ag₂O₂
      16. Ag₂O
      17. BaS
      18. BaO
      19. CaO₂
      20. CaH₂
    pide: El nombre de los diez compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el Li₂O₂, si lees los dos oxígenos con −2, el litio te sale +2.
          ¿Qué quiere decir eso?
        opciones:
          - texto: 'Que no es un óxido sino un peróxido: los dos oxígenos van unidos, O₂²⁻, y cada uno lleva −1'
            correcta: true
            mensaje: |
              Eso es. El litio solo tiene +1, así que la lectura con −2 es
              imposible y hay que cambiarla. En el grupo peroxo los dos
              oxígenos comparten la carga 2−, y dos litios a +1 la compensan.
              Es la misma prueba que separa, en este bloque, el Ag₂O₂ del Ag₂O
              y el CaO₂ del BaO.
          - texto: 'Que el litio actúa aquí con +2'
            mensaje: |
              El litio es alcalino y solo tiene +1: no hay compuesto donde
              actúe con +2. Cuando la cuenta te da un número que el elemento no
              tiene, lo que está mal es la suposición de partida, y aquí es la
              de que el oxígeno va a −2.
          - texto: 'Que la fórmula se puede simplificar a LiO'
            mensaje: |
              Simplificar no cambia la proporción, pero rompe el grupo O₂²⁻,
              que es la unidad del compuesto: el curso escribe los peróxidos
              como M₂(O₂)ₓ y avisa de que no se simplifican. Por eso el
              peróxido de litio es Li₂O₂ y no LiO.
          - texto: 'Que es un anhídrido, porque el oxígeno lleva un 2'
            mensaje: |
              Anhídrido es la combinación de un no metal con el oxígeno, y el
              litio es un metal. Un 2 en el oxígeno no dice nada de la familia:
              el PtO₂ del 27 también lo lleva y es un óxido normal.

      - tipo: calcular
        titulo: 'El 11: Li₂O₂'
        pregunta: |
          Nombra el Li₂O₂.
        respuesta:
          tipo: formula
          valor: peróxido de litio | peróxido lítico | peróxido de litio(I) | dióxido de dilitio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de litio
            mensaje: |
              El óxido de litio es el Li₂O, con un solo oxígeno para los dos
              litios. Aquí hay dos: leídos a −2 pondrían el litio a +2, que no
              tiene. Van unidos en el grupo peroxo, O₂²⁻: es un peróxido.
          - valor: óxido de litio(II)
            mensaje: |
              Has leído los dos oxígenos a −2, y entonces el litio sale a +2.
              Pero el litio es alcalino y solo tiene +1: esa cuenta imposible
              es la señal de que aquí el oxígeno va a −1, en el grupo peroxo.
        pista: |
          El litio solo tiene +1. Prueba a leer el oxígeno a −2 y mira qué le
          sale al litio.
        desarrollo: |
          Con el oxígeno a −2 el litio saldría +2, que no tiene. Así que los
          dos oxígenos forman el grupo peroxo, O₂²⁻, con −1 cada uno:
          $2\times(+1) + 2\times(-1) = 0$. Peróxido de litio, sin simplificar
          el O₂. Es la de la hoja de respuestas, que lo escribe «Peroxidode
          litio», con el espacio y la tilde comidos.

      - tipo: calcular
        titulo: 'El 12: MgH₂'
        pregunta: |
          Nombra el MgH₂.
        respuesta:
          tipo: formula
          valor: hidruro de magnesio | hidruro magnésico | hidruro de magnesio(II) | dihidruro de magnesio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido de magnesio
            mensaje: |
              El hidróxido lleva el grupo OH: es el Mg(OH)₂. En el MgH₂ no hay
              oxígeno. El hidrógeno va solo frente al metal, con −1, y eso es
              un hidruro.
          - valor: magnesiuro de hidrógeno
            mensaje: |
              Así se nombraría si el magnesio fuera el negativo, como el cloro
              en el cloruro de hidrógeno. Pero el magnesio es un metal, con +2,
              y el negativo es el hidrógeno, con −1: por eso el nombre es
              hidruro de magnesio.
        pista: |
          Frente a un metal, el hidrógeno actúa con −1. El magnesio tiene +2.
        desarrollo: |
          Magnesio +2 y dos hidrógenos a −1: $(+2) + 2\times(-1) = 0$. Un metal
          con hidrógeno es un hidruro metálico, y como el magnesio tiene un
          solo estado, hidruro de magnesio, o hidruro magnésico. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 13: NH₃'
        pregunta: |
          Nombra el NH₃.
        respuesta:
          tipo: formula
          valor: amoniaco | nitruro de hidrógeno | trihidruro de nitrógeno | azano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: amonio
            mensaje: |
              El amonio es el ion NH₄⁺, con cuatro hidrógenos y carga positiva:
              el del hidróxido amónico, NH₄OH. El NH₃ es una molécula neutra
              con tres, el amoniaco.
          - valor: hidróxido amónico
            mensaje: |
              El hidróxido amónico es el NH₄OH, que es como se escribe el
              amoniaco disuelto en agua. El NH₃ a secas no lleva oxígeno: es el
              amoniaco.
        pista: |
          Los hidruros del boro, el carbono, el silicio, el nitrógeno, el
          fósforo y el arsénico no siguen regla: tienen nombre propio, y el
          curso los da en una lista.
        desarrollo: |
          Nitrógeno −3 y tres hidrógenos a +1: $(-3) + 3\times(+1) = 0$. Los
          hidruros de los grupos 13, 14 y 15 tienen nombre propio en el curso:
          el NH₃ es el amoniaco, o nitruro de hidrógeno. En sistemática,
          trihidruro de nitrógeno. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 14: H₂S'
        pregunta: |
          Nombra el H₂S.
        respuesta:
          tipo: formula
          valor: ácido sulfhídrico | sulfuro de hidrógeno | sulfuro de dihidrógeno | sulfano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido sulfúrico
            mensaje: |
              El sulfúrico es el H₂SO₄, un oxoácido: lleva oxígeno. El H₂S no
              lleva ninguno, así que es un hidrácido, y su nombre acaba en la
              terminación -hídrico: ácido sulfhídrico.
          - valor: hidruro de azufre
            mensaje: |
              «Hidruro» es para cuando el hidrógeno va a −1, frente a un metal.
              Frente al azufre, que es un no metal más electronegativo, el
              hidrógeno va a +1 y el azufre a −2, y el que se nombra con la
              terminación -uro es el azufre: sulfuro de hidrógeno.
          - valor: sulfato de hidrógeno
            mensaje: |
              El sulfato es un oxoanión, SO₄²⁻, y lleva oxígeno. Aquí el azufre
              va solo, a −2, y eso es el sulfuro: sulfuro de hidrógeno.
        pista: |
          El azufre, frente al hidrógeno, va a −2. No hay oxígeno: es un
          hidrácido.
        desarrollo: |
          Azufre −2 y dos hidrógenos a +1: $2\times(+1) + (-2) = 0$. Los
          hidruros de los grupos 16 y 17 son hidrácidos: sulfuro de hidrógeno,
          o ácido sulfhídrico cuando está disuelto en agua, que son los dos
          nombres del ejemplo del curso. En sistemática, sulfuro de
          dihidrógeno. La hoja de respuestas se salta este, y la respuesta es
          nuestra.

      - tipo: calcular
        titulo: 'El 15: Ag₂O₂'
        pregunta: |
          Nombra el Ag₂O₂.
        respuesta:
          tipo: formula
          valor: peróxido de plata | peróxido argéntico | peróxido de plata(I) | dióxido de diplata
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de plata
            mensaje: |
              El óxido de plata es el Ag₂O, el 16, con un solo oxígeno. Aquí hay
              dos para dos platas: leídos a −2 pondrían la plata a +2, que no
              tiene. Es el grupo peroxo, O₂²⁻.
          - valor: óxido de plata(II)
            mensaje: |
              Con los dos oxígenos a −2 la plata te sale +2, pero la plata del
              curso solo tiene +1. Cuando sale un número que el elemento no
              tiene, lo que falla es leer el oxígeno a −2: aquí va a −1.
        pista: |
          La plata solo tiene +1, como los alcalinos. Compara con el 16.
        desarrollo: |
          Con el oxígeno a −2 la plata saldría +2, que no tiene; así que los dos
          oxígenos forman el grupo peroxo, O₂²⁻, con −1 cada uno:
          $2\times(+1) + 2\times(-1) = 0$. Peróxido de plata. Es la de la hoja
          de respuestas, y con los estados del curso, donde la plata solo
          tiene uno, es la única lectura que cuadra.

      - tipo: calcular
        titulo: 'El 16: Ag₂O'
        pregunta: |
          Nombra el Ag₂O.
        respuesta:
          tipo: formula
          valor: óxido de plata | óxido argéntico | óxido de plata(I) | monóxido de diplata | monoóxido de diplata | óxido de diplata
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peróxido de plata
            mensaje: |
              El peróxido es el del 15, Ag₂O₂, con dos oxígenos. Aquí hay uno
              solo a −2 para dos platas, que ponen +1 cada una: la lectura
              normal cuadra y es un óxido.
          - valor: óxido de plata(II)
            mensaje: |
              Has cargado a una sola plata el −2 del oxígeno, pero hay dos
              platas y se lo reparten: +1 cada una, que es el único estado de la
              plata.
        pista: |
          Un oxígeno a −2 para dos platas, y la plata solo tiene +1.
        desarrollo: |
          Dos platas a +1 y un oxígeno a −2: $2\times(+1) + (-2) = 0$. Como la
          plata tiene un solo estado, óxido de plata, u óxido argéntico. En
          sistemática, monóxido de diplata. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 17: BaS'
        pregunta: |
          Nombra el BaS.
        respuesta:
          tipo: formula
          valor: sulfuro de bario | sulfuro bárico | sulfuro de bario(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: sulfato de bario
            mensaje: |
              El sulfato lleva oxígeno: es el BaSO₄, una oxisal. En el BaS el
              azufre va solo, a −2, y la sal de un no metal sin oxígeno se
              nombra con la terminación -uro: sulfuro.
          - valor: sulfito de bario
            mensaje: |
              El sulfito también lleva oxígeno, tres: es el BaSO₃. Sin oxígeno,
              el azufre es el sulfuro, S²⁻.
        pista: |
          No hay oxígeno: es una sal binaria. El azufre, frente a un metal, va
          a −2, y el bario tiene +2.
        desarrollo: |
          Bario +2 y azufre −2, uno a uno: $(+2) + (-2) = 0$. Un metal con un
          no metal y sin oxígeno es una sal binaria: sulfuro de bario, o
          sulfuro bárico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 18: BaO'
        pregunta: |
          Nombra el BaO.
        respuesta:
          tipo: formula
          valor: óxido de bario | óxido bárico | óxido de bario(II) | monóxido de bario | monoóxido de bario
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peróxido de bario
            mensaje: |
              El peróxido de bario es el BaO₂, con dos oxígenos: el 36 de esta
              misma columna y el 5 de la de formular. Aquí hay uno solo, a −2,
              y el bario lo compensa con su +2: es un óxido.
          - valor: óxido de bario(I)
            mensaje: |
              Uno a uno no quiere decir valencia 1. El oxígeno va a −2, y el
              bario, que es alcalinotérreo, tiene +2: los dos se compensan
              justos.
        pista: |
          El bario es alcalinotérreo: +2 siempre. El oxígeno, −2.
        desarrollo: |
          Bario +2 y oxígeno −2: $(+2) + (-2) = 0$. Con un solo estado, óxido
          de bario, u óxido bárico. En sistemática, monóxido de bario. Es la de
          la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 19: CaO₂'
        pregunta: |
          Nombra el CaO₂.
        respuesta:
          tipo: formula
          valor: peróxido de calcio | peróxido cálcico | peróxido de calcio(II) | dióxido de calcio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de calcio
            mensaje: |
              El óxido de calcio es el CaO, con un solo oxígeno. Aquí hay dos
              para un calcio: leídos a −2 pondrían el calcio a +4, que no tiene.
              Es el grupo peroxo, O₂²⁻.
          - valor: óxido de calcio(IV)
            mensaje: |
              Con los dos oxígenos a −2 el calcio te sale +4, pero el calcio es
              alcalinotérreo y solo tiene +2. Esa imposibilidad dice que los dos
              oxígenos van unidos, a −1 cada uno: es un peróxido.
        pista: |
          El calcio solo tiene +2. Prueba a leer el oxígeno a −2 y mira qué le
          sale.
        desarrollo: |
          Con el oxígeno a −2 el calcio saldría +4, que no tiene. Los dos
          oxígenos forman el grupo peroxo, con −1 cada uno:
          $(+2) + 2\times(-1) = 0$. Peróxido de calcio, que es el ejemplo del
          curso. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 20: CaH₂'
        pregunta: |
          Nombra el CaH₂.
        respuesta:
          tipo: formula
          valor: hidruro de calcio | hidruro cálcico | hidruro de calcio(II) | dihidruro de calcio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido de calcio
            mensaje: |
              El hidróxido de calcio es el Ca(OH)₂, con el grupo OH. En el CaH₂
              no hay oxígeno: los dos hidrógenos van solos, a −1, y es un
              hidruro.
          - valor: calciuro de hidrógeno
            mensaje: |
              Así se nombraría si el calcio fuera el negativo. Pero el calcio es
              un metal y lleva +2; el negativo es el hidrógeno, con −1, y por
              eso es hidruro de calcio.
        pista: |
          Frente a un metal, el hidrógeno va a −1. El calcio tiene +2.
        desarrollo: |
          Calcio +2 y dos hidrógenos a −1: $(+2) + 2\times(-1) = 0$. Hidruro de
          calcio, o hidruro cálcico, que es el ejemplo del curso para los
          hidruros metálicos. Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el argumento que separa el Ag₂O₂ del Ag₂O. Una pieza es falsa.
        piezas:
          - texto: 'Se lee el oxígeno a −2 y se saca el número de la plata: en el Ag₂O sale +1, que es el único estado de la plata.'
          - texto: 'En el Ag₂O₂ la misma cuenta da +2, que la plata no tiene: la suposición de partida no vale.'
          - texto: 'Así que los dos oxígenos van unidos en el grupo peroxo, O₂²⁻, con −1 cada uno, y la plata se queda en +1.'
          - texto: 'Por eso el Ag₂O es el óxido de plata y el Ag₂O₂ el peróxido de plata, que es como los publica la hoja de respuestas.'
          - texto: 'Como el Ag₂O₂ lleva dos oxígenos por cada dos platas, se simplifica a AgO y se nombra como un óxido.'
            trampa: true
            mensaje: |
              El grupo peroxo no se simplifica: el curso escribe los peróxidos
              como M₂(O₂)ₓ y lo avisa con todas las letras. Y leerlo como AgO no
              arregla nada: con el oxígeno a −2, la plata seguiría saliendo +2,
              que no tiene.
    resolucion: |
      | | fórmula | tradicional | Stock · sistemática |
      |---|---|---|---|
      | 11 | Li₂O₂ | peróxido de litio | peróxido de litio · dióxido de dilitio |
      | 12 | MgH₂ | hidruro de magnesio | hidruro de magnesio · dihidruro de magnesio |
      | 13 | NH₃ | amoniaco · nitruro de hidrógeno | trihidruro de nitrógeno |
      | 14 | H₂S | ácido sulfhídrico · sulfuro de hidrógeno | sulfuro de dihidrógeno |
      | 15 | Ag₂O₂ | peróxido de plata | peróxido de plata · dióxido de diplata |
      | 16 | Ag₂O | óxido de plata | óxido de plata · monóxido de diplata |
      | 17 | BaS | sulfuro de bario | sulfuro de bario |
      | 18 | BaO | óxido de bario | óxido de bario · monóxido de bario |
      | 19 | CaO₂ | peróxido de calcio | peróxido de calcio · dióxido de calcio |
      | 20 | CaH₂ | hidruro de calcio | hidruro de calcio · dihidruro de calcio |

      **Lo que se lleva uno del bloque.** La prueba del peróxido: se lee el
      oxígeno a −2, y si al metal le sale un número que no tiene, los dos
      oxígenos van unidos en el grupo O₂²⁻, que no se simplifica. Y el
      hidrógeno cambia de signo según lo que tenga enfrente: −1 frente a un
      metal, en los hidruros, y +1 frente a un no metal, en el amoniaco y el
      sulfhídrico.

      Las respuestas son las de la hoja de respuestas del material, salvo la
      del 14, que la hoja se salta y es nuestra. La del 11 viene escrita
      «Peroxidode litio»: una errata de teclado que no cambia el compuesto.

  - id: colfq1-f1-nombrar-del-21-al-30
    titulo: 'Hoja 1 de formulación: nombrar del 21 al 30, seleniuros, peróxidos y un Co₂O₃ repetido'
    fuente: >-
      Ejercicios de formulación-1, columna «Escribir el nombre de los
      siguientes compuestos», del 21 al 30 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de respuestas del material publica las del 21 al 27, la del 29 y la
      del 30, y coinciden con las de aquí. En el sitio del 28 responde un Li₂O,
      «Oxido de litio», que no está en esta hoja; el 28 repite el Co₂O₃ del 3,
      y su nombre es el que la hoja de respuestas da allí.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      21. H₂Te
      22. CaSe
      23. K₂Se
      24. LiCl
      25. Li₂Se
      26. Na₂O₂
      27. PtO₂
      28. Co₂O₃
      29. K₂O
      30. K₂O₂

      *El 28 repite el Co₂O₃ del 3: la hoja lo trae dos veces, y aquí se
      transcribe tal cual.*
    pide: El nombre de los diez compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          El PtO₂, el Na₂O₂ y el K₂O₂ llevan los tres un O₂ en la fórmula.
          ¿Cuáles son peróxidos?
        opciones:
          - texto: 'El Na₂O₂ y el K₂O₂: con el oxígeno a −2 el sodio y el potasio tendrían +2, que no tienen, y el platino sí tiene +4'
            correcta: true
            mensaje: |
              Eso es. La prueba es siempre la misma: leer el oxígeno a −2 y
              mirar si el número que le sale al metal existe. En el PtO₂ el
              platino sale a +4, uno de sus dos estados, así que es un óxido
              normal. En los otros dos sale +2 para un alcalino, que es
              imposible: son peróxidos.
          - texto: 'Los tres, porque los tres llevan O₂'
            mensaje: |
              El O₂ de la fórmula puede ser el grupo peroxo o dos oxígenos
              sueltos a −2, y la fórmula sola no lo dice. En el PtO₂ son dos
              O²⁻: el platino a +4 los compensa, y es el óxido platínico.
          - texto: 'Solo el PtO₂, porque es el único con un solo átomo de metal'
            mensaje: |
              Cuántos átomos de metal lleva no decide nada. Lo que decide es si
              el número de oxidación que sale con el oxígeno a −2 existe: en el
              PtO₂ sale +4, que el platino tiene, así que ese es precisamente el
              que no es peróxido.
          - texto: 'Ninguno: un peróxido tiene que llevar el O₂ entre paréntesis'
            mensaje: |
              El curso escribe la fórmula general como M₂(O₂)ₓ para que se vea
              el grupo, pero los compuestos se escriben sin paréntesis: Na₂O₂,
              CaO₂, H₂O₂. El paréntesis no está en la hoja y no hace falta para
              reconocerlos.

      - tipo: calcular
        titulo: 'El 21: H₂Te'
        pregunta: |
          Nombra el H₂Te.
        respuesta:
          tipo: formula
          valor: ácido telurhídrico | telururo de hidrógeno | telururo de dihidrógeno | telano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido telúrico
            mensaje: |
              El telúrico es un oxoácido, H₂TeO₄: lleva oxígeno. El H₂Te no
              lleva ninguno, así que es un hidrácido y acaba en -hídrico:
              ácido telurhídrico.
          - valor: hidruro de teluro
            mensaje: |
              «Hidruro» es para el hidrógeno a −1, frente a un metal. El teluro
              es un no metal del grupo del azufre: frente a él el hidrógeno va
              a +1 y el teluro a −2, y el nombre es telururo de hidrógeno.
        pista: |
          El teluro es del grupo del azufre y, frente al hidrógeno, va a −2.
        desarrollo: |
          Teluro −2 y dos hidrógenos a +1: $2\times(+1) + (-2) = 0$. Es el
          mismo caso que el H₂S del 14, dos filas más abajo en la tabla:
          telururo de hidrógeno, o ácido telurhídrico en disolución. Es la de
          la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 22: CaSe'
        pregunta: |
          Nombra el CaSe.
        respuesta:
          tipo: formula
          valor: seleniuro de calcio | seleniuro cálcico | seleniuro de calcio(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: selenato de calcio
            mensaje: |
              El selenato lleva oxígeno: es el CaSeO₄, una oxisal. En el CaSe el
              selenio va solo, a −2, y se nombra con la terminación -uro:
              seleniuro.
          - valor: selenito de calcio
            mensaje: |
              El selenito también lleva oxígeno, tres: CaSeO₃. Sin oxígeno, el
              selenio es el seleniuro, Se²⁻.
        pista: |
          El selenio es del grupo del azufre: frente a un metal va a −2. El
          calcio tiene +2.
        desarrollo: |
          Calcio +2 y selenio −2, uno a uno: $(+2) + (-2) = 0$. Seleniuro de
          calcio, o seleniuro cálcico. Es la de la hoja de respuestas, y el
          mismo compuesto que cae para formular en el control de 2023-2024.

      - tipo: calcular
        titulo: 'El 23: K₂Se'
        pregunta: |
          Nombra el K₂Se.
        respuesta:
          tipo: formula
          valor: seleniuro de potasio | seleniuro potásico | seleniuro de potasio(I) | seleniuro de dipotasio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: selenato de potasio
            mensaje: |
              El selenato lleva oxígeno: es el K₂SeO₄. Sin oxígeno, el selenio
              va solo, a −2, y es el seleniuro.
          - valor: seleniuro de potasio(II)
            mensaje: |
              Has cargado a un solo potasio el −2 del selenio, pero hay dos
              potasios y se lo reparten: +1 cada uno, que es el único estado del
              potasio.
        pista: |
          El potasio es alcalino: +1 siempre. El selenio, frente a un metal,
          va a −2.
        desarrollo: |
          Dos potasios a +1 y un selenio a −2: $2\times(+1) + (-2) = 0$.
          Seleniuro de potasio, o seleniuro potásico. En sistemática,
          seleniuro de dipotasio. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 24: LiCl'
        pregunta: |
          Nombra el LiCl.
        respuesta:
          tipo: formula
          valor: cloruro de litio | cloruro lítico | cloruro de litio(I)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: clorato de litio
            mensaje: |
              El clorato lleva oxígeno: es el LiClO₃. El LiCl no lleva ninguno,
              así que es una sal binaria y el cloro acaba en -uro.
          - valor: clorito de litio
            mensaje: |
              El clorito también lleva oxígeno, dos: LiClO₂. Sin oxígeno, el
              cloro es el cloruro, Cl⁻.
        pista: |
          Litio +1 y cloro −1. No hay oxígeno.
        desarrollo: |
          Litio +1 y cloro −1, uno a uno: $(+1) + (-1) = 0$. Sal binaria:
          cloruro de litio, o cloruro lítico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 25: Li₂Se'
        pregunta: |
          Nombra el Li₂Se.
        respuesta:
          tipo: formula
          valor: seleniuro de litio | seleniuro lítico | seleniuro de litio(I) | seleniuro de dilitio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: selenito de litio
            mensaje: |
              El selenito lleva oxígeno: es el Li₂SeO₃. Aquí el selenio va solo,
              a −2, y es el seleniuro.
          - valor: diseleniuro de litio
            mensaje: |
              Has puesto el 2 en el selenio, y es del litio: hay dos litios y
              un selenio. En sistemática, seleniuro de **di**litio;
              «diseleniuro de litio» sería LiSe₂.
        pista: |
          El 2 es del litio. Litio +1, selenio −2.
        desarrollo: |
          Dos litios a +1 y un selenio a −2: $2\times(+1) + (-2) = 0$.
          Seleniuro de litio, o seleniuro lítico. En sistemática, seleniuro de
          dilitio. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 26: Na₂O₂'
        pregunta: |
          Nombra el Na₂O₂.
        respuesta:
          tipo: formula
          valor: peróxido de sodio | peróxido sódico | peróxido de sodio(I) | dióxido de disodio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de sodio
            mensaje: |
              El óxido de sodio es el Na₂O, con un solo oxígeno. Aquí hay dos
              para dos sodios: leídos a −2 pondrían el sodio a +2, que no tiene.
              Es el grupo peroxo, O₂²⁻.
          - valor: óxido de sodio(II)
            mensaje: |
              Con los dos oxígenos a −2 el sodio te sale +2, pero el sodio es
              alcalino y solo tiene +1. Esa cuenta imposible dice que el
              oxígeno va a −1, en el grupo peroxo.
        pista: |
          El sodio solo tiene +1. Lee el oxígeno a −2 y mira qué le sale.
        desarrollo: |
          Con el oxígeno a −2 el sodio saldría +2, que no tiene; los dos
          oxígenos forman el grupo peroxo, a −1 cada uno:
          $2\times(+1) + 2\times(-1) = 0$. Peróxido de sodio, el ejemplo del
          curso, sin simplificar el O₂. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 27: PtO₂'
        pregunta: |
          Nombra el PtO₂.
        respuesta:
          tipo: formula
          valor: óxido platínico | óxido de platino(IV) | dióxido de platino | bióxido de platino
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peróxido de platino
            mensaje: |
              Un O₂ en la fórmula no hace un peróxido. Leído a −2, el oxígeno
              pone el platino a +4, que es uno de sus dos estados: la lectura
              normal cuadra, y es un óxido. El peróxido solo aparece cuando al
              metal le sale un número que no tiene, como al sodio del 26.
          - valor: óxido platinoso
            mensaje: |
              Platinoso es el platino a +2, el PtO. Aquí un platino compensa
              dos oxígenos a −2: +4, el mayor de sus dos estados, que es -ico.
          - valor: óxido de platino(II)
            mensaje: |
              El 2 es el número de oxígenos, no la valencia del platino. Dos
              oxígenos a −2 suman −4, y el platino es +4: óxido de platino(IV).
        pista: |
          El platino tiene +2 y +4. Lee los dos oxígenos a −2 y mira si el
          número que sale existe.
        desarrollo: |
          Dos oxígenos a −2 suman −4, y el platino pone +4:
          $(+4) + 2\times(-2) = 0$. El +4 existe, así que es un óxido normal,
          y como es el mayor de los dos del platino, óxido platínico, u óxido
          de platino(IV). Es la de la hoja de respuestas, y el 25 de la
          columna de formular es este mismo, al revés.

      - tipo: calcular
        titulo: 'El 28: Co₂O₃, otra vez'
        pregunta: |
          Nombra el Co₂O₃ del 28. Es la misma fórmula que la del 3: la hoja la
          trae dos veces.
        respuesta:
          tipo: formula
          valor: óxido cobáltico | óxido de cobalto(III) | trióxido de dicobalto
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de cobalto(II)
            mensaje: |
              El cobalto a +2 es el del CoO. Aquí dos cobaltos compensan tres
              oxígenos a −2: −6 entre dos, +3 cada uno. Óxido de cobalto(III).
          - valor: óxido de cobalto
            mensaje: |
              Falta decir con qué estado actúa, y el cobalto tiene dos: el CoO
              y el Co₂O₃ serían los dos «óxido de cobalto». En Stock va el
              (III); en tradicional, el -ico.
        pista: |
          Lo mismo que en el 3: reparte entre los dos cobaltos la carga de los
          tres oxígenos.
        desarrollo: |
          Mismo compuesto, mismo nombre: cobalto +3,
          $2\times(+3) + 3\times(-2) = 0$, óxido cobáltico u óxido de
          cobalto(III). Una fórmula es un compuesto, esté donde esté en la
          lista. La hoja de respuestas no trae este: en su sitio, entre el
          PtO₂ y el K₂O, responde un Li₂O, «Oxido de litio», que no está en
          esta hoja. El nombre del Co₂O₃ es el que da en el 3.

      - tipo: calcular
        titulo: 'El 29: K₂O'
        pregunta: |
          Nombra el K₂O.
        respuesta:
          tipo: formula
          valor: óxido de potasio | óxido potásico | óxido de potasio(I) | monóxido de dipotasio | monoóxido de dipotasio | óxido de dipotasio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peróxido de potasio
            mensaje: |
              El peróxido es el del 30, K₂O₂, con dos oxígenos. Aquí hay uno
              solo a −2 para dos potasios, que ponen +1 cada uno: la lectura
              normal cuadra y es un óxido.
          - valor: dióxido de potasio
            mensaje: |
              El 2 es del potasio, no del oxígeno: hay dos potasios y un
              oxígeno. En sistemática, óxido de **di**potasio; «dióxido de
              potasio» sería KO₂.
        pista: |
          Un oxígeno a −2 para dos potasios, y el potasio solo tiene +1.
        desarrollo: |
          Dos potasios a +1 y un oxígeno a −2: $2\times(+1) + (-2) = 0$. Óxido
          de potasio, u óxido potásico. En sistemática, monóxido de dipotasio.
          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 30: K₂O₂'
        pregunta: |
          Nombra el K₂O₂.
        respuesta:
          tipo: formula
          valor: peróxido de potasio | peróxido potásico | peróxido de potasio(I) | dióxido de dipotasio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de potasio
            mensaje: |
              El óxido de potasio es el K₂O, el 29, con un solo oxígeno. Aquí
              hay dos para dos potasios: leídos a −2 pondrían el potasio a +2,
              que no tiene. Es el grupo peroxo.
          - valor: óxido de potasio(II)
            mensaje: |
              Con los dos oxígenos a −2 el potasio te sale +2, pero es alcalino
              y solo tiene +1. La cuenta imposible dice que el oxígeno va a −1:
              es un peróxido.
        pista: |
          Compara con el 29: un oxígeno más para los mismos dos potasios.
        desarrollo: |
          Con el oxígeno a −2 el potasio saldría +2, que no tiene; los dos
          oxígenos forman el grupo peroxo, O₂²⁻:
          $2\times(+1) + 2\times(-1) = 0$. Peróxido de potasio. Es la de la
          hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el razonamiento que lee el O₂ del PtO₂ y el del Na₂O₂. Una pieza es falsa.
        piezas:
          - texto: 'Un O₂ en la fórmula no decide nada por sí solo: primero se supone el oxígeno a −2 y se saca el número del metal.'
          - texto: 'En el PtO₂ eso da platino +4, que es uno de sus dos estados: la lectura normal vale, y es un óxido.'
          - texto: 'En el Na₂O₂, en cambio, la misma cuenta da sodio +2, que no tiene: ahí los dos oxígenos van unidos en el grupo peroxo.'
          - texto: 'Con la familia decidida, se nombran: óxido platínico, porque +4 es el mayor de los dos del platino, y peróxido de sodio.'
          - texto: 'Todo compuesto con O₂ en la fórmula es un peróxido, así que el PtO₂ es el peróxido de platino.'
            trampa: true
            mensaje: |
              El O₂ solo es grupo peroxo cuando la lectura normal falla, y en el
              PtO₂ no falla: dos O²⁻ suman −4 y el platino tiene +4. Es un
              óxido, el platínico, y así lo publica la hoja de respuestas.
    resolucion: |
      | | fórmula | tradicional | Stock · sistemática |
      |---|---|---|---|
      | 21 | H₂Te | ácido telurhídrico · telururo de hidrógeno | telururo de dihidrógeno |
      | 22 | CaSe | seleniuro de calcio | seleniuro de calcio |
      | 23 | K₂Se | seleniuro de potasio | seleniuro de potasio · seleniuro de dipotasio |
      | 24 | LiCl | cloruro de litio | cloruro de litio |
      | 25 | Li₂Se | seleniuro de litio | seleniuro de litio · seleniuro de dilitio |
      | 26 | Na₂O₂ | peróxido de sodio | peróxido de sodio · dióxido de disodio |
      | 27 | PtO₂ | óxido platínico | óxido de platino(IV) · dióxido de platino |
      | 28 | Co₂O₃ | óxido cobáltico | óxido de cobalto(III) · trióxido de dicobalto |
      | 29 | K₂O | óxido de potasio | óxido de potasio · monóxido de dipotasio |
      | 30 | K₂O₂ | peróxido de potasio | peróxido de potasio · dióxido de dipotasio |

      **Lo que se lleva uno del bloque.** Un O₂ en la fórmula no hace un
      peróxido: se lee el oxígeno a −2, y solo si al metal le sale un número
      que no tiene —el sodio y el potasio a +2— los dos oxígenos van unidos.
      El PtO₂, con el platino a +4, es un óxido normal.

      **El 28 repite el 3.** La hoja trae el Co₂O₃ dos veces y aquí se
      transcribe tal cual: la misma fórmula es el mismo compuesto, el óxido
      cobáltico. La hoja de respuestas no trae el 28; en su sitio, entre el
      PtO₂ y el K₂O, responde un Li₂O, «Oxido de litio», que no está en esta
      hoja.

  - id: colfq1-f1-nombrar-del-31-al-40
    titulo: 'Hoja 1 de formulación: nombrar del 31 al 40, cinco con hidrógeno y dos parejas de no metales'
    fuente: >-
      Ejercicios de formulación-1, columna «Escribir el nombre de los
      siguientes compuestos», del 31 al 40 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de respuestas del material publica las del 31, 32, 33, 34, 36 y
      40, y coinciden con las de aquí. En el sitio del 39 responde un PbO,
      «Oxido plunboso», y no el PbO₂ de la hoja: es el nombre de otro
      compuesto, y con una errata, plunboso por plumboso. Las del 35, 37, 38 y
      39 son nuestras.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      31. CH₄
      32. BaH₂
      33. HF
      34. HI
      35. H₂O
      36. BaO₂
      37. BN
      38. CS₂
      39. PbO₂
      40. AlCl₃
    pide: El nombre de los diez compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          Cinco de los diez llevan hidrógeno: CH₄, BaH₂, HF, HI y H₂O. ¿Con qué
          número de oxidación actúa el hidrógeno en ellos?
        opciones:
          - texto: 'Con −1 en el BaH₂, frente a un metal, y con +1 en los otros cuatro, frente a un no metal'
            correcta: true
            mensaje: |
              Eso es, y es lo que separa las dos familias. Frente al bario el
              hidrógeno es el más electronegativo y lleva −1: un hidruro.
              Frente al carbono, el flúor, el yodo o el oxígeno lleva +1: en el
              HF y el HI da hidrácidos, y el CH₄ y el H₂O tienen nombre propio.
          - texto: 'Siempre +1, como en los ácidos'
            mensaje: |
              En el BaH₂ no puede ser: el bario es +2, y los dos hidrógenos
              tienen que sumar −2. Frente a un metal el hidrógeno lleva −1, y
              por eso el compuesto se llama hidruro.
          - texto: 'Con −1 cuando va escrito a la derecha y con +1 cuando va a la izquierda'
            mensaje: |
              Funciona con el BaH₂ y el HF, y falla con el CH₄, que lo lleva a
              la derecha y actúa con +1: el carbono es −4. El orden en que se
              escribe el metano es costumbre; lo que decide el signo es si el
              hidrógeno está frente a un metal o frente a un no metal.
          - texto: 'Con −1 en todos, porque todos son hidruros'
            mensaje: |
              Solo el BaH₂ es un hidruro en ese sentido. En el HF el flúor es
              −1, y el hidrógeno tiene que ser +1 para que la molécula sea
              neutra: con los dos a −1 no hay forma de sumar cero.

      - tipo: calcular
        titulo: 'El 31: CH₄'
        pregunta: |
          Nombra el CH₄.
        respuesta:
          tipo: formula
          valor: metano | carburo de hidrógeno | tetrahidruro de carbono
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido carbonhídrico
            mensaje: |
              La terminación -hídrico es solo para los grupos 16 y 17, cuyos
              hidruros son ácidos en agua: HF, HCl, H₂S. El carbono es del grupo
              14, y su hidruro tiene nombre propio: metano.
          - valor: metanol
            mensaje: |
              El metanol es un alcohol, CH₃OH: lleva un grupo OH. El CH₄ es el
              hidrocarburo más sencillo, el metano.
        pista: |
          Es uno de los hidruros con nombre propio de la lista del curso, junto
          al amoniaco y la fosfina.
        desarrollo: |
          Carbono −4 y cuatro hidrógenos a +1: $(-4) + 4\times(+1) = 0$. Los
          hidruros de los grupos 13, 14 y 15 tienen nombre propio en el curso:
          el CH₄ es el metano, o carburo de hidrógeno. En sistemática,
          tetrahidruro de carbono. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 32: BaH₂'
        pregunta: |
          Nombra el BaH₂.
        respuesta:
          tipo: formula
          valor: hidruro de bario | hidruro bárico | hidruro de bario(II) | dihidruro de bario
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido de bario
            mensaje: |
              El hidróxido de bario es el Ba(OH)₂, con el grupo OH. En el BaH₂
              no hay oxígeno: los hidrógenos van solos, a −1, frente al metal.
              Es un hidruro.
          - valor: bariuro de hidrógeno
            mensaje: |
              Así se nombraría si el bario fuera el negativo, como el cloro en
              el cloruro de hidrógeno. Pero el bario es un metal, con +2; el
              negativo es el hidrógeno, y el nombre es hidruro de bario.
        pista: |
          Frente a un metal, el hidrógeno va a −1. El bario tiene +2.
        desarrollo: |
          Bario +2 y dos hidrógenos a −1: $(+2) + 2\times(-1) = 0$. Hidruro de
          bario, o hidruro bárico. En sistemática, dihidruro de bario. Es la
          de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 33: HF'
        pregunta: |
          Nombra el HF.
        respuesta:
          tipo: formula
          valor: ácido fluorhídrico | fluoruro de hidrógeno | fluorano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidruro de flúor
            mensaje: |
              «Hidruro» es para el hidrógeno a −1, frente a un metal. Frente al
              flúor, el más electronegativo de todos, el hidrógeno va a +1 y el
              flúor a −1: fluoruro de hidrógeno.
          - valor: ácido fluórico
            mensaje: |
              El -ico es de los oxoácidos, como el clórico, HClO₃, con el cloro
              a +5. El flúor no tiene estados positivos, solo −1, así que no hay
              un «fluórico»: su ácido es el hidrácido, el fluorhídrico.
        pista: |
          El flúor solo tiene −1. Frente a él, el hidrógeno va a +1.
        desarrollo: |
          Hidrógeno +1 y flúor −1: $(+1) + (-1) = 0$. Es un hidrácido:
          fluoruro de hidrógeno, o ácido fluorhídrico en disolución. Es la de
          la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 34: HI'
        pregunta: |
          Nombra el HI.
        respuesta:
          tipo: formula
          valor: ioduro de hidrógeno | yoduro de hidrógeno | ácido iodhídrico | ácido yodhídrico | iodano | yodano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido yódico
            mensaje: |
              El yódico es un oxoácido, HIO₃, con el yodo a +5: lleva oxígeno.
              El HI no lleva ninguno, así que es un hidrácido: ácido
              yodhídrico, o yoduro de hidrógeno.
          - valor: ácido iódico
            mensaje: |
              Con la grafía del curso, el iódico es el HIO₃, un oxoácido con el
              yodo a +5. Sin oxígeno el yodo va a −1, y es el ioduro: ioduro de
              hidrógeno, o ácido iodhídrico.
          - valor: hidruro de yodo
            mensaje: |
              «Hidruro» es para el hidrógeno a −1, frente a un metal. Frente al
              yodo, que es más electronegativo, el hidrógeno va a +1 y el yodo a
              −1: yoduro de hidrógeno.
        pista: |
          El yodo, frente al hidrógeno, va a −1. No hay oxígeno.
        desarrollo: |
          Hidrógeno +1 y yodo −1: $(+1) + (-1) = 0$. Es un hidrácido: ioduro
          de hidrógeno, o ácido iodhídrico en disolución; con y griega, yoduro
          y yodhídrico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 35: H₂O'
        pregunta: |
          Nombra el H₂O.
        respuesta:
          tipo: formula
          valor: agua | óxido de hidrógeno | óxido de dihidrógeno | monóxido de dihidrógeno | monoóxido de dihidrógeno | oxidano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peróxido de hidrógeno
            mensaje: |
              El peróxido de hidrógeno es el H₂O₂, el agua oxigenada: el 28 de
              la columna de formular. El H₂O lleva un solo oxígeno, a −2, y es
              el agua.
          - valor: hidruro de oxígeno
            mensaje: |
              «Hidruro» es para el hidrógeno a −1, frente a un metal. Frente al
              oxígeno el hidrógeno va a +1 y el oxígeno a −2; y además el curso
              le da nombre propio: agua.
        pista: |
          Es el hidruro del grupo 16 que el curso trata aparte, porque no es
          ácido.
        desarrollo: |
          Oxígeno −2 y dos hidrógenos a +1: $2\times(+1) + (-2) = 0$. Por la
          regla sería un hidrácido del grupo 16, como el H₂S, pero el curso lo
          saca de la regla porque no es ácido: se llama agua. En sistemática,
          monóxido de dihidrógeno. La hoja de respuestas se salta este, y la
          respuesta es nuestra.

      - tipo: calcular
        titulo: 'El 36: BaO₂'
        pregunta: |
          Nombra el BaO₂.
        respuesta:
          tipo: formula
          valor: peróxido de bario | peróxido bárico | peróxido de bario(II) | dióxido de bario
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de bario
            mensaje: |
              El óxido de bario es el BaO, el 18, con un solo oxígeno. Aquí hay
              dos para un bario: leídos a −2 pondrían el bario a +4, que no
              tiene. Es el grupo peroxo.
          - valor: óxido de bario(IV)
            mensaje: |
              Con los dos oxígenos a −2 el bario te sale +4, pero el bario es
              alcalinotérreo y solo tiene +2. Esa imposibilidad dice que los dos
              oxígenos van unidos, a −1 cada uno.
        pista: |
          El bario solo tiene +2. Compara con el PbO₂ del 39: la misma forma,
          otra lectura.
        desarrollo: |
          Con el oxígeno a −2 el bario saldría +4, que no tiene; los dos
          oxígenos forman el grupo peroxo: $(+2) + 2\times(-1) = 0$. Peróxido
          de bario. Es la de la hoja de respuestas, y el 5 de la columna de
          formular es este mismo, al revés.

      - tipo: calcular
        titulo: 'El 37: BN'
        pregunta: |
          Nombra el BN.
        respuesta:
          tipo: formula
          valor: nitruro de boro | nitruro de boro(III) | mononitruro de boro
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: boruro de nitrógeno
            mensaje: |
              La terminación -uro va al elemento más electronegativo, el que se
              escribe a la derecha: el nitrógeno. «Boruro de nitrógeno» pondría
              el boro como negativo, y es al revés: boro +3, nitrógeno −3.
          - valor: nitrato de boro
            mensaje: |
              El nitrato lleva oxígeno: es el ion NO₃⁻. En el BN el nitrógeno va
              solo, a −3, y es el nitruro.
        pista: |
          Dos no metales: el de la derecha, el más electronegativo, se nombra
          con -uro. Boro +3, nitrógeno −3.
        desarrollo: |
          Boro +3 y nitrógeno −3: $(+3) + (-3) = 0$. Con dos no metales, el más
          electronegativo se nombra con la terminación -uro y el otro va
          detrás, con «de»: nitruro de boro, que es el ejemplo del propio
          curso. La hoja de respuestas se salta este, y la respuesta es
          nuestra.

      - tipo: calcular
        titulo: 'El 38: CS₂'
        pregunta: |
          Nombra el CS₂.
        respuesta:
          tipo: formula
          valor: sulfuro de carbono | disulfuro de carbono | sulfuro de carbono(IV) | bisulfuro de carbono
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: carburo de azufre
            mensaje: |
              La terminación -uro va al más electronegativo, que es el azufre,
              el de la derecha. «Carburo de azufre» pondría el carbono como
              negativo, y aquí el carbono es +4 y el azufre −2.
          - valor: sulfuro de carbono(II)
            mensaje: |
              El 2 es el número de azufres, no la valencia del carbono. Dos
              azufres a −2 suman −4, así que el carbono es +4: sulfuro de
              carbono(IV).
        pista: |
          El azufre, el de la derecha, va a −2, y hay dos.
        desarrollo: |
          Carbono +4 y dos azufres a −2: $(+4) + 2\times(-2) = 0$. Son dos no
          metales, y el azufre, más electronegativo, lleva la terminación -uro:
          sulfuro de carbono, que es el ejemplo del curso. En sistemática,
          disulfuro de carbono. La hoja de respuestas se salta este, y la
          respuesta es nuestra.

      - tipo: calcular
        titulo: 'El 39: PbO₂'
        pregunta: |
          Nombra el PbO₂.
        respuesta:
          tipo: formula
          valor: óxido plúmbico | óxido de plomo(IV) | dióxido de plomo | bióxido de plomo
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido plumboso
            mensaje: |
              Es la de la hoja de respuestas, y no es de este compuesto: en este
              sitio la hoja de respuestas escribe PbO, «Oxido plunboso», y no el
              PbO₂ de la hoja. Plumboso es el plomo a +2, el PbO, que es el 40
              de la columna de formular. En el PbO₂ dos oxígenos a −2 piden un
              plomo a +4: plúmbico.
          - valor: peróxido de plomo
            mensaje: |
              Un O₂ en la fórmula no hace un peróxido. Leído a −2, el oxígeno
              pone el plomo a +4, que es uno de sus dos estados: la lectura
              normal cuadra. El BaO₂ del 36 sí es un peróxido, porque el bario
              no tiene +4.
          - valor: óxido de plomo(II)
            mensaje: |
              El 2 es el número de oxígenos, no la valencia del plomo. Dos
              oxígenos a −2 suman −4, así que el plomo es +4: óxido de
              plomo(IV).
        pista: |
          El plomo tiene +2 y +4. Lee los dos oxígenos a −2 y mira qué número
          sale.
        desarrollo: |
          Dos oxígenos a −2 suman −4, y el plomo pone +4:
          $(+4) + 2\times(-2) = 0$. El +4 existe y es el mayor de los dos del
          plomo: óxido plúmbico, u óxido de plomo(IV). En este sitio la hoja de
          respuestas responde otra cosa, PbO, «Oxido plunboso»: es el nombre
          del PbO, con la m cambiada por una n, y no el de este.

      - tipo: calcular
        titulo: 'El 40: AlCl₃'
        pregunta: |
          Nombra el AlCl₃.
        respuesta:
          tipo: formula
          valor: cloruro de aluminio | cloruro alumínico | cloruro de aluminio(III) | tricloruro de aluminio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: clorato de aluminio
            mensaje: |
              El clorato lleva oxígeno: es el Al(ClO₃)₃, una oxisal. En el AlCl₃
              el cloro va solo, a −1, y es el cloruro.
          - valor: cloruro de trialuminio
            mensaje: |
              El 3 es del cloro, no del aluminio: hay un aluminio y tres cloros.
              En sistemática, **tri**cloruro de aluminio; «cloruro de
              trialuminio» sería Al₃Cl.
        pista: |
          El aluminio tiene +3 y cada cloro −1. No hay oxígeno.
        desarrollo: |
          Aluminio +3 y tres cloros a −1: $(+3) + 3\times(-1) = 0$. Sal
          binaria: cloruro de aluminio, o cloruro alumínico. En sistemática,
          tricloruro de aluminio. Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena cómo se nombran el BN y el CS₂. Una pieza es falsa.
        piezas:
          - texto: 'En el BN y el CS₂ se juntan dos no metales, y hay que decidir cuál de los dos se nombra con la terminación -uro.'
          - texto: 'El -uro va al más electronegativo, que es el que se escribe a la derecha: el nitrógeno en el BN y el azufre en el CS₂.'
          - texto: 'El otro va detrás, con «de»: nitruro de boro y sulfuro de carbono.'
          - texto: 'Y las cargas confirman los dos nombres: boro +3 con nitrógeno −3 en el nitruro de boro, y carbono +4 con dos azufres a −2 en el sulfuro de carbono.'
          - texto: 'El -uro va al primer elemento de la fórmula, así que el BN es el boruro de nitrógeno.'
            trampa: true
            mensaje: |
              Al revés: el primero de la fórmula es el menos electronegativo, y
              la terminación -uro es para el que se queda los electrones. El
              nitrógeno es más electronegativo que el boro, así que es él quien
              la lleva: nitruro de boro. «Boruro de nitrógeno» pondría el boro
              como negativo.
    resolucion: |
      | | fórmula | tradicional | Stock · sistemática |
      |---|---|---|---|
      | 31 | CH₄ | metano · carburo de hidrógeno | tetrahidruro de carbono |
      | 32 | BaH₂ | hidruro de bario | hidruro de bario · dihidruro de bario |
      | 33 | HF | ácido fluorhídrico · fluoruro de hidrógeno | fluoruro de hidrógeno |
      | 34 | HI | ácido iodhídrico · ioduro de hidrógeno | yoduro de hidrógeno |
      | 35 | H₂O | agua | monóxido de dihidrógeno |
      | 36 | BaO₂ | peróxido de bario | peróxido de bario · dióxido de bario |
      | 37 | BN | nitruro de boro | nitruro de boro |
      | 38 | CS₂ | sulfuro de carbono | sulfuro de carbono(IV) · disulfuro de carbono |
      | 39 | PbO₂ | óxido plúmbico | óxido de plomo(IV) · dióxido de plomo |
      | 40 | AlCl₃ | cloruro de aluminio | cloruro de aluminio · tricloruro de aluminio |

      **Lo que se lleva uno del bloque.** El hidrógeno lleva −1 frente a un
      metal, en el hidruro de bario, y +1 frente a un no metal: en los
      hidrácidos, HF y HI, y en los que tienen nombre propio, metano y agua.
      Con dos no metales, la terminación -uro va al de la derecha.

      **El 39 y la hoja de respuestas.** En ese sitio la hoja de respuestas
      escribe PbO, «Oxido plunboso», donde la hoja pone PbO₂. Es el nombre de
      otro compuesto —el óxido plumboso es el PbO, el 40 de la columna de
      formular— y trae además una errata, plunboso por plumboso. El PbO₂, con
      el plomo a +4, es el óxido plúmbico. Las respuestas del 35, 37, 38 y 39
      son nuestras.

  # ── Hoja 1 de formulación, columna «Escribir la fórmula»: 40 compuestos en
  #    cuatro bloques de diez, con la numeración de la hoja. La hoja de
  #    respuestas del curso cubre 13 de los 40 en esta dirección, y uno con
  #    errata (el 1, AuO₃ por Au₂O₃).
  - id: colfq1-f1-formular-del-1-al-10
    titulo: 'Hoja 1 de formulación: formular del 1 al 10, óxidos, anhídridos y un peróxido'
    fuente: >-
      Ejercicios de formulación-1, columna de formular, del 1 al 10 ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La hoja de respuestas del curso publica el 1, el 4,
      el 8 y el 10, y la del 1 tiene una errata: da AuO₃ para el óxido
      áurico, que es Au₂O₃. El par del 5, BaO₂ y peróxido de bario, sale en
      esa hoja en la dirección de nombrar. Las respuestas del 2, el 3, el 6,
      el 7 y el 9 son nuestras.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      1. Óxido aúrico
      2. Anhídrido sulfuroso
      3. Anhídrido hipocloroso
      4. Óxido estánnico
      5. Peróxido de bario
      6. Anhídrido carbónico
      7. Anhídrido fosforoso
      8. Óxido férrico
      9. Anhídrido nítrico
      10. Óxido cuproso

      *El 1 está transcrito como lo imprime la hoja, «aúrico». La palabra es
      «áurico», con la tilde en la a: es el óxido de oro con el oro en +3.
      Aquí se contesta con la fórmula, así que la errata no cambia la
      respuesta.*
    pide: La fórmula de los diez compuestos, en el orden de la hoja.

    pasos:
      - tipo: reconocer
        pregunta: |
          En nueve de estos diez compuestos el oxígeno actúa con −2. ¿En cuál
          no, y por qué?
        opciones:
          - texto: 'En el peróxido de bario, porque los dos oxígenos van unidos en el grupo O₂²⁻ y cada uno lleva −1'
            correcta: true
            mensaje: |
              Eso es. La palabra «peróxido» avisa de que el oxígeno no va
              suelto: va en parejas, –O–O–, y el grupo entero tiene carga 2−.
              Por eso el bario, que es 2+, se queda con un solo grupo: BaO₂.
              En los otros nueve se cruza el número del elemento con el −2
              del oxígeno.
          - texto: 'En los anhídridos, porque ahí el oxígeno se une a un no metal'
            mensaje: |
              En un anhídrido el oxígeno sigue siendo −2. Lo que cambia al
              pasar de metal a no metal es el nombre —«anhídrido» en vez de
              «óxido»— y los prefijos y sufijos que se usan, no la carga del
              oxígeno.
          - texto: 'En el óxido cuproso, porque el cobre actúa con +1'
            mensaje: |
              El que cambia ahí es el cobre, no el oxígeno. Precisamente
              porque el cobre solo aporta +1 hacen falta dos cobres para
              compensar el −2 del oxígeno: Cu₂O.
          - texto: 'En ninguno: el oxígeno es siempre −2'
            mensaje: |
              Casi siempre, y por eso se falla. La excepción que entra en este
              curso son los peróxidos, donde cada oxígeno lleva −1 porque está
              enlazado a otro oxígeno. La señal está en el nombre.

      - tipo: calcular
        titulo: 'El 1: óxido áurico'
        pregunta: |
          Escribe la fórmula del óxido áurico.
        respuesta:
          tipo: formula
          valor: 'Au2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'AuO3'
            mensaje: |
              Es la de la hoja de respuestas, y tiene una errata: con un oro
              por cada tres oxígenos el oro tendría que actuar con +6, y solo
              tiene +1 y +3. Es el cruce hecho a medias: el 3 del oro ha
              bajado al oxígeno, pero el 2 del oxígeno no ha bajado al oro.
          - valor: 'Au2O'
            mensaje: |
              Ese es el óxido auroso, con el oro en +1. El sufijo *-ico* pide
              el mayor de los dos números del oro, que es +3.
          - valor: 'Au3O2'
            mensaje: |
              Has cruzado al revés. El subíndice de cada elemento es la carga
              del otro: el 3 del oro va al oxígeno y el 2 del oxígeno va al
              oro. Súmalo: tres oros con +3 y dos oxígenos con −2 dan 9
              contra 4.
        pista: |
          El oro tiene +1 y +3, y *-ico* es el mayor. El oxígeno, −2.
        desarrollo: |
          Oro(III) con oxígeno(2−). Al cruzar, el 2 del oxígeno va al oro y el
          3 del oro va al oxígeno:

          $$
          \mathrm{Au_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          La hoja de respuestas del curso pone AuO₃, que no es neutro: con el
          oro en +3 suma +3 contra −6. La buena es esta.

      - tipo: calcular
        titulo: 'El 2: anhídrido sulfuroso'
        pregunta: |
          Escribe la fórmula del anhídrido sulfuroso.
        respuesta:
          tipo: formula
          valor: 'SO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'SO3'
            mensaje: |
              Ese es el anhídrido sulfúrico, con el azufre en +6. El sufijo
              *-oso* va con +4, el de en medio de los tres números que el
              azufre usa con el oxígeno.
          - valor: 'S2O4'
            mensaje: |
              El cruce está bien hecho y le falta el último paso: 2 y 4
              comparten el 2, así que se simplifica a SO₂. La fórmula de un
              anhídrido da la proporción más simple.
          - valor: 'SO'
            mensaje: |
              Ese es el anhídrido hiposulfuroso, con el azufre en +2. Con tres
              números, el menor lleva *hipo-…-oso*; el *-oso* a secas es el de
              en medio, +4.
        pista: |
          El azufre tiene +2, +4 y +6 frente al oxígeno: *hipo-…-oso*, *-oso*
          e *-ico*, en ese orden.
        desarrollo: |
          Azufre(IV) con oxígeno(2−). El cruce da $\mathrm{S_2O_4}$, y se
          simplifica dividiendo entre 2:

          $$
          \mathrm{SO_2} \qquad (+4) + 2\times(-2) = 0
          $$

      - tipo: calcular
        titulo: 'El 3: anhídrido hipocloroso'
        pregunta: |
          Escribe la fórmula del anhídrido hipocloroso.
        respuesta:
          tipo: formula
          valor: 'Cl2O'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Cl2O3'
            mensaje: |
              Ese es el anhídrido cloroso, con el cloro en +3. Te has quedado
              con el *-oso* y has perdido el *hipo-*, que baja un escalón más:
              +1.
          - valor: 'HClO'
            mensaje: |
              Eso es el ácido hipocloroso, que es el anhídrido más agua. El
              anhídrido no lleva hidrógeno: solo cloro y oxígeno.
          - valor: 'ClO'
            mensaje: |
              Con un cloro y un oxígeno las cargas no cuadran: +1 contra −2.
              Hay que cruzar, y el 2 del oxígeno pasa al cloro: Cl₂O. El ClO⁻,
              con su carga, es el ion hipoclorito, que es otra cosa.
        pista: |
          El cloro tiene +1, +3, +5 y +7. *Hipo-…-oso* es el más bajo.
        desarrollo: |
          Cloro(I) con oxígeno(2−). El 2 del oxígeno va al cloro, y el 1 del
          cloro, que no se escribe, al oxígeno:

          $$
          \mathrm{Cl_2O} \qquad 2\times(+1) + (-2) = 0
          $$

      - tipo: calcular
        titulo: 'El 4: óxido estánnico'
        pregunta: |
          Escribe la fórmula del óxido estánnico.
        respuesta:
          tipo: formula
          valor: 'SnO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'SnO'
            mensaje: |
              Ese es el óxido estannoso, con el estaño en +2. *-ico* pide el
              mayor de sus dos números, que es +4.
          - valor: 'Sn2O3'
            mensaje: |
              Has tomado *-ico* como si fuera siempre +3, que es lo que vale
              en el férrico. El estaño tiene +2 y +4, así que estánnico es +4.
          - valor: 'Sn2O4'
            mensaje: |
              Es el cruce de +4 con −2 sin simplificar. Los dos subíndices
              comparten el 2 y la fórmula queda SnO₂.
        pista: |
          El estaño tiene +2 y +4.
        desarrollo: |
          Estaño(IV) con oxígeno(2−). El cruce da $\mathrm{Sn_2O_4}$, que se
          simplifica a

          $$
          \mathrm{SnO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 5: peróxido de bario'
        pregunta: |
          Escribe la fórmula del peróxido de bario.
        respuesta:
          tipo: formula
          valor: 'BaO2 | Ba(O2)'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'BaO'
            mensaje: |
              Ese es el óxido de bario, con el oxígeno en −2. «Peróxido»
              quiere decir que los oxígenos van de dos en dos, en el grupo
              O₂²⁻, y ese par no se parte.
          - valor: 'Ba2(O2)2'
            mensaje: |
              Es la fórmula general M₂(O₂)ₓ con x = 2, sin simplificar. Lo que
              no se toca es el O₂, que va entero; la proporción entre el bario
              y el grupo sí se simplifica: 2 y 2 son 1 y 1, y queda BaO₂,
              como el CaO₂ de las diapositivas.
        pista: |
          El bario es 2+, y el grupo peróxido, O₂²⁻, también lleva carga 2.
        desarrollo: |
          Un Ba²⁺ y un grupo O₂²⁻ se compensan uno a uno:

          $$
          \mathrm{BaO_2} \qquad (+2) + 2\times(-1) = 0
          $$

          Cada oxígeno lleva −1. Escrito $\mathrm{Ba(O_2)}$, con el grupo
          entre paréntesis, también vale. La hoja de respuestas trae este
          mismo par en la dirección de nombrar: BaO₂, peróxido de bario.

      - tipo: calcular
        titulo: 'El 6: anhídrido carbónico'
        pregunta: |
          Escribe la fórmula del anhídrido carbónico.
        respuesta:
          tipo: formula
          valor: 'CO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'CO'
            mensaje: |
              Ese es el anhídrido carbonoso, el monóxido de carbono, con el
              carbono en +2. *-ico* es el mayor de los dos números del
              carbono, +4.
          - valor: 'C2O4'
            mensaje: |
              Es el cruce sin simplificar. Con +4 y −2, los subíndices 2 y 4
              se dividen entre 2: CO₂.
          - valor: 'H2CO3'
            mensaje: |
              Eso es el ácido carbónico, el anhídrido más una molécula de
              agua. El anhídrido es lo que queda al quitarle el agua: CO₂.
        pista: |
          El carbono tiene +2 y +4 frente al oxígeno.
        desarrollo: |
          Carbono(IV) con oxígeno(2−). El cruce da $\mathrm{C_2O_4}$, que se
          simplifica a

          $$
          \mathrm{CO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es el dióxido de carbono de siempre, con su nombre tradicional.

      - tipo: calcular
        titulo: 'El 7: anhídrido fosforoso'
        pregunta: |
          Escribe la fórmula del anhídrido fosforoso.
        respuesta:
          tipo: formula
          valor: 'P2O3 | P4O6'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'P2O5'
            mensaje: |
              Ese es el anhídrido fosfórico, con el fósforo en +5. *-oso* es
              +3.
          - valor: 'P2O'
            mensaje: |
              Ese es el anhídrido hipofosforoso, con el fósforo en +1: el 34
              de esta misma hoja. Con tres números, el *-oso* a secas es el de
              en medio, +3.
          - valor: 'P3O2'
            mensaje: |
              Has cruzado al revés: el 3 del fósforo va al oxígeno y el 2 del
              oxígeno va al fósforo. Tu fórmula da 9 cargas positivas contra
              4 negativas.
        pista: |
          El curso da al fósforo +1, +3 y +5.
        desarrollo: |
          Fósforo(III) con oxígeno(2−):

          $$
          \mathrm{P_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          La molécula real es el doble, $\mathrm{P_4O_6}$, y también vale. El
          curso escribe la proporción mínima, que es la que sale del cruce.

      - tipo: calcular
        titulo: 'El 8: óxido férrico'
        pregunta: |
          Escribe la fórmula del óxido férrico.
        respuesta:
          tipo: formula
          valor: 'Fe2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'FeO'
            mensaje: |
              Ese es el óxido ferroso, con el hierro en +2. *-ico* pide el
              mayor de sus dos números, +3.
          - valor: 'Fe3O2'
            mensaje: |
              Has cruzado al revés. El 3 del hierro baja al oxígeno y el 2 del
              oxígeno baja al hierro. Súmalo: 9 contra 4 no es neutro.
        pista: |
          El hierro tiene +2 y +3.
        desarrollo: |
          Hierro(III) con oxígeno(2−), cruzando:

          $$
          \mathrm{Fe_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 9: anhídrido nítrico'
        pregunta: |
          Escribe la fórmula del anhídrido nítrico.
        respuesta:
          tipo: formula
          valor: 'N2O5'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'NO'
            mensaje: |
              Ese es el óxido nítrico, que no es este compuesto aunque se
              llame casi igual. El nitrógeno es la excepción de la lista: el
              óxido nítrico es NO, con el nitrógeno en +2, y el anhídrido
              nítrico lleva +5.
          - valor: 'N2O3'
            mensaje: |
              Ese es el anhídrido nitroso, con el nitrógeno en +3. De los dos
              anhídridos del nitrógeno, el de *-ico* es el de +5.
          - valor: 'HNO3'
            mensaje: |
              Eso es el ácido nítrico, el anhídrido más agua. El anhídrido no
              lleva hidrógeno.
        pista: |
          De los anhídridos del nitrógeno, el nitroso lleva +3 y el nítrico,
          +5.
        desarrollo: |
          Nitrógeno(V) con oxígeno(2−):

          $$
          \mathrm{N_2O_5} \qquad 2\times(+5) + 5\times(-2) = 0
          $$

          El nitrógeno forma anhídridos con +3 y +5; con +1, +2 y +4 forma
          óxidos, y ahí están las trampas de nombre: el óxido nitroso N₂O y
          el óxido nítrico NO.

      - tipo: calcular
        titulo: 'El 10: óxido cuproso'
        pregunta: |
          Escribe la fórmula del óxido cuproso.
        respuesta:
          tipo: formula
          valor: 'Cu2O'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'CuO'
            mensaje: |
              Ese es el óxido cúprico, con el cobre en +2. *-oso* pide el
              menor de sus dos números, +1.
          - valor: 'CuO2'
            mensaje: |
              Has cruzado al revés: con Cu⁺ y O²⁻, el 2 del oxígeno va al
              cobre, no al revés. Tu fórmula tiene +1 contra −4.
        pista: |
          El cobre tiene +1 y +2.
        desarrollo: |
          Cobre(I) con oxígeno(2−). Hacen falta dos cobres para compensar un
          oxígeno:

          $$
          \mathrm{Cu_2O} \qquad 2\times(+1) + (-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el método que resuelve el bloque. Una pieza es falsa.
        piezas:
          - texto: 'El sufijo se lee contra los números de oxidación de ese elemento: -ico es +3 en el oro y +4 en el estaño.'
          - texto: 'Con tres números, como el azufre o el fósforo, el -oso a secas es el de en medio; el más bajo lleva hipo-…-oso.'
          - texto: 'Con el número del elemento y el −2 del oxígeno se cruzan las cargas, y se simplifica si los dos subíndices comparten divisor: S₂O₄ queda SO₂.'
          - texto: 'El peróxido es la excepción: su oxígeno va en el grupo O₂²⁻, que no se parte, y el peróxido de bario es BaO₂.'
          - texto: 'Al cruzar, el número de oxidación del metal pasa al oxígeno y el metal se queda sin subíndice: el óxido áurico es AuO₃.'
            trampa: true
            mensaje: |
              Eso es cruzar en una sola dirección, y es la errata de la hoja
              de respuestas del curso. El cruce va en las dos: el 3 del oro
              baja al oxígeno y el 2 del oxígeno baja al oro. Con AuO₃ salen
              +3 contra −6, y un compuesto tiene que sumar cero: Au₂O₃.
    resolucion: |
      | | fórmula | nombre tradicional | Stock · sistemática |
      |---|---|---|---|
      | 1 | Au₂O₃ | óxido áurico | óxido de oro(III) · trióxido de dioro |
      | 2 | SO₂ | anhídrido sulfuroso | óxido de azufre(IV) · dióxido de azufre |
      | 3 | Cl₂O | anhídrido hipocloroso | óxido de cloro(I) · monóxido de dicloro |
      | 4 | SnO₂ | óxido estánnico | óxido de estaño(IV) · dióxido de estaño |
      | 5 | BaO₂ | peróxido de bario | peróxido de bario · dióxido de bario |
      | 6 | CO₂ | anhídrido carbónico | óxido de carbono(IV) · dióxido de carbono |
      | 7 | P₂O₃ | anhídrido fosforoso | óxido de fósforo(III) · trióxido de difósforo |
      | 8 | Fe₂O₃ | óxido férrico | óxido de hierro(III) · trióxido de dihierro |
      | 9 | N₂O₅ | anhídrido nítrico | óxido de nitrógeno(V) · pentaóxido de dinitrógeno |
      | 10 | Cu₂O | óxido cuproso | óxido de cobre(I) · monóxido de dicobre |

      **Tres pasos, los mismos en los diez.** El sufijo, leído contra los
      números de oxidación de ese elemento; el cruce con el −2 del oxígeno; y
      simplificar si los dos subíndices comparten divisor. El peróxido de
      bario es la única excepción del bloque: su oxígeno va en parejas, con
      −1 cada uno, y el par no se parte.

      **Las erratas.** La hoja de respuestas del curso da AuO₃ para el 1, que
      no es neutro: con el oro en +3 suma +3 contra −6. La fórmula buena es
      Au₂O₃. Y la hoja de ejercicios escribe «aúrico», con la tilde en la u,
      por «áurico».

  - id: colfq1-f1-formular-del-11-al-20
    titulo: 'Hoja 1 de formulación: formular del 11 al 20, dos elementos, óxidos, un anhídrido y tres sales'
    fuente: >-
      Ejercicios de formulación-1, columna de formular, del 11 al 20 ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La hoja de respuestas del curso publica ocho de los
      diez, el 12, el 13 y del 15 al 20, y las ocho están bien. Las
      respuestas del 11 y el 14 son nuestras.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      11. Anhídrido bromoso
      12. Nitrógeno
      13. Oxígeno
      14. Óxido nitroso
      15. Óxido crómico
      16. Óxido mangánico
      17. Bromuro potásico
      18. Cloruro férrico
      19. Ioduro potásico
      20. Óxido niquélico
    pide: La fórmula de los diez compuestos, en el orden de la hoja.

    pasos:
      - tipo: reconocer
        pregunta: |
          El cromo y el manganeso tienen números de oxidación de metal y de no
          metal. En «óxido crómico» y «óxido mangánico», ¿cuáles hay que
          mirar?
        opciones:
          - texto: 'Los de metal, +2 y +3, porque con los de no metal el compuesto sería un anhídrido; -ico es +3'
            correcta: true
            mensaje: |
              Eso es. Con +2 y +3 los dos actúan como metales, y entonces su
              compuesto con oxígeno se llama óxido. Con los números altos —el
              +6 del cromo; el +4, el +6 y el +7 del manganeso— actúan como no
              metales y el compuesto es un anhídrido: anhídrido crómico, CrO₃,
              o permangánico, Mn₂O₇.
          - texto: 'El más alto que tengan, porque -ico siempre es el mayor'
            mensaje: |
              *-ico* es el mayor, pero de los números que corresponden a esa
              palabra. Con el más alto de todos saldría CrO₃ o Mn₂O₇, y esos
              son anhídridos, no óxidos. La palabra «óxido» ya dice que el
              elemento actúa como metal.
          - texto: 'Da igual: óxido y anhídrido son dos nombres para lo mismo'
            mensaje: |
              No lo son. Óxido crómico es Cr₂O₃ y anhídrido crómico es CrO₃:
              dos sustancias distintas, con el cromo en +3 y en +6. El nombre
              es lo único que las distingue.
          - texto: '+3 en los dos, porque -ico es siempre valencia 3'
            mensaje: |
              El número es el bueno y el motivo no. *-ico* es el mayor de los
              números del elemento; aquí coincide con +3, pero en el estánnico
              del 4 o el platínico del 25 es +4.

      - tipo: calcular
        titulo: 'El 11: anhídrido bromoso'
        pregunta: |
          Escribe la fórmula del anhídrido bromoso.
        respuesta:
          tipo: formula
          valor: 'Br2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Br2O'
            mensaje: |
              Ese es el anhídrido hipobromoso, con el bromo en +1. El bromo
              tiene cuatro números, como el cloro, y el *-oso* a secas es el
              segundo: +3.
          - valor: 'Br2O5'
            mensaje: |
              Ese es el anhídrido brómico, con el bromo en +5. *-oso* va un
              escalón por debajo: +3.
          - valor: 'Br3O2'
            mensaje: |
              Has cruzado al revés: el 3 del bromo va al oxígeno y el 2 del
              oxígeno, al bromo. Tu fórmula da 9 cargas positivas contra 4
              negativas.
        pista: |
          El bromo tiene +1, +3, +5 y +7, como el cloro.
        desarrollo: |
          Bromo(III) con oxígeno(2−):

          $$
          \mathrm{Br_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          Los cuatro anhídridos del bromo van como los del cloro: hipobromoso
          Br₂O, bromoso Br₂O₃, brómico Br₂O₅ y perbrómico Br₂O₇.

      - tipo: calcular
        titulo: 'El 12: nitrógeno'
        pregunta: |
          Escribe la fórmula del nitrógeno.
        respuesta:
          tipo: formula
          valor: 'N2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'N'
            mensaje: |
              Ese es el átomo suelto. El nitrógeno, como sustancia, es un gas
              de moléculas de dos átomos, N₂, y así se formula. Igual que el
              oxígeno, el hidrógeno o los halógenos.
          - valor: 'N3'
            mensaje: |
              Has puesto de subíndice un número de oxidación del nitrógeno. En
              una sustancia elemental no hay cargas que cruzar, porque su
              número de oxidación es 0: el subíndice cuenta los átomos de la
              molécula, y la del nitrógeno tiene dos.
        pista: |
          No es un compuesto: es la sustancia elemental, un gas de moléculas
          de dos átomos.
        desarrollo: |
          El nitrógeno del aire son moléculas de dos átomos unidos entre sí:

          $$
          \mathrm{N_2}
          $$

          Su número de oxidación es 0, como el de cualquier sustancia
          elemental. Son diatómicos el hidrógeno, el nitrógeno, el oxígeno y
          los cuatro halógenos: H₂, N₂, O₂, F₂, Cl₂, Br₂ e I₂. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 13: oxígeno'
        pregunta: |
          Escribe la fórmula del oxígeno.
        respuesta:
          tipo: formula
          valor: 'O2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'O'
            mensaje: |
              Ese es el átomo suelto. El oxígeno que respiramos son moléculas
              de dos átomos, O₂.
          - valor: 'O3'
            mensaje: |
              Ese es el ozono, la otra forma del oxígeno, con tres átomos por
              molécula. Las diapositivas lo nombran aparte: «oxígeno» a secas
              es O₂.
        pista: |
          Como el nitrógeno del 12: la sustancia elemental, con moléculas de
          dos átomos.
        desarrollo: |
          $$
          \mathrm{O_2}
          $$

          Número de oxidación 0. El oxígeno tiene una segunda forma, el ozono
          O₃, que se nombra aparte; cuando la hoja dice «oxígeno», es O₂. Es
          la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 14: óxido nitroso'
        pregunta: |
          Escribe la fórmula del óxido nitroso.
        respuesta:
          tipo: formula
          valor: 'N2O'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'N2O3'
            mensaje: |
              Ese es el anhídrido nitroso, con el nitrógeno en +3. El
              nitrógeno es la excepción de los nombres: «óxido nitroso» es otro
              compuesto, con el nitrógeno en +1.
          - valor: 'NO'
            mensaje: |
              Ese es el óxido nítrico, con el nitrógeno en +2. El nitroso es el
              de +1: dos nitrógenos por cada oxígeno.
        pista: |
          El óxido nitroso es uno de los nombres propios del nitrógeno, con el
          nitrógeno en +1.
        desarrollo: |
          Nitrógeno(I) con oxígeno(2−):

          $$
          \mathrm{N_2O} \qquad 2\times(+1) + (-2) = 0
          $$

          Es el gas de la risa. El nitrógeno tiene cinco números positivos y
          los sufijos no alcanzan, así que tres de sus óxidos se aprenden por
          su nombre: óxido nitroso N₂O, óxido nítrico NO y dióxido de
          nitrógeno NO₂.

      - tipo: calcular
        titulo: 'El 15: óxido crómico'
        pregunta: |
          Escribe la fórmula del óxido crómico.
        respuesta:
          tipo: formula
          valor: 'Cr2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'CrO3'
            mensaje: |
              Ese es el anhídrido crómico, con el cromo en +6, actuando como no
              metal. «Óxido» dice que aquí el cromo es metal, con +2 y +3, y
              *-ico* es +3.
          - valor: 'CrO'
            mensaje: |
              Ese es el óxido cromoso, con el cromo en +2. *-ico* es el mayor de
              los dos números de metal, +3.
        pista: |
          Como metal, el cromo tiene +2 y +3.
        desarrollo: |
          Cromo(III) con oxígeno(2−):

          $$
          \mathrm{Cr_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 16: óxido mangánico'
        pregunta: |
          Escribe la fórmula del óxido mangánico.
        respuesta:
          tipo: formula
          valor: 'Mn2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'MnO3'
            mensaje: |
              Ese es el anhídrido mangánico, con el manganeso en +6, actuando
              como no metal. En un óxido el manganeso es metal, con +2 y +3.
          - valor: 'MnO'
            mensaje: |
              Ese es el óxido manganoso, con el manganeso en +2. *-ico* es +3.
          - valor: 'MnO2'
            mensaje: |
              El MnO₂, con el manganeso en +4, no es el óxido mangánico: el
              curso lo llama anhídrido manganoso, y esta hoja, en el 23,
              bióxido de manganeso. «Mangánico» en un óxido es +3, el mayor de
              los dos números de metal.
        pista: |
          Como metal, el manganeso tiene +2 y +3; como no metal, +4, +6 y +7.
        desarrollo: |
          Manganeso(III) con oxígeno(2−):

          $$
          \mathrm{Mn_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 17: bromuro potásico'
        pregunta: |
          Escribe la fórmula del bromuro potásico.
        respuesta:
          tipo: formula
          valor: 'KBr'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'BrK'
            mensaje: |
              Tienes los dos elementos al revés. En la fórmula va primero el
              metal, el más electropositivo, y después el no metal, aunque el
              nombre los diga en el orden contrario: bromuro potásico es KBr.
          - valor: 'KBrO3'
            mensaje: |
              Eso es el bromato potásico, una sal con oxígeno. La terminación
              *-uro* dice que el bromo va solo: es una sal binaria, de dos
              elementos.
        pista: |
          El potasio es 1+, y el bromo, en un bromuro, 1−.
        desarrollo: |
          K⁺ y Br⁻ se compensan uno a uno:

          $$
          \mathrm{KBr} \qquad (+1) + (-1) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 18: cloruro férrico'
        pregunta: |
          Escribe la fórmula del cloruro férrico.
        respuesta:
          tipo: formula
          valor: 'FeCl3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'FeCl2'
            mensaje: |
              Ese es el cloruro ferroso, con el hierro en +2. *-ico* es +3.
          - valor: 'Fe2Cl3'
            mensaje: |
              Es el patrón del óxido férrico, Fe₂O₃, copiado. El 2 de ese
              óxido sale de la carga del oxígeno, 2−; el cloro es 1−, así que
              aquí el hierro no lleva subíndice y el 3 va al cloro.
          - valor: 'Fe3Cl'
            mensaje: |
              Has cruzado al revés: el 3 del hierro va al cloro, y el 1 del
              cloro, que no se escribe, al hierro.
        pista: |
          Férrico es Fe³⁺, y en un cloruro el cloro es 1−.
        desarrollo: |
          Un Fe³⁺ necesita tres Cl⁻:

          $$
          \mathrm{FeCl_3} \qquad (+3) + 3\times(-1) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 19: ioduro potásico'
        pregunta: |
          Escribe la fórmula del ioduro potásico.
        respuesta:
          tipo: formula
          valor: 'KI'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'PI'
            mensaje: |
              P es el fósforo. El potasio es K, del latín *kalium*: es de los
              símbolos que no se parecen a su nombre en castellano, como Na
              para el sodio o Fe para el hierro.
          - valor: 'KY'
            mensaje: |
              Y es el itrio. El símbolo del yodo es I, se escriba el nombre
              «iodo», como en la hoja, o «yodo».
        pista: |
          El potasio es 1+, y el yodo, en un yoduro, 1−.
        desarrollo: |
          K⁺ e I⁻, uno a uno:

          $$
          \mathrm{KI} \qquad (+1) + (-1) = 0
          $$

          «Ioduro» y «yoduro» son el mismo nombre con dos grafías. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 20: óxido niquélico'
        pregunta: |
          Escribe la fórmula del óxido niquélico.
        respuesta:
          tipo: formula
          valor: 'Ni2O3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'NiO'
            mensaje: |
              Ese es el óxido niqueloso, con el níquel en +2. *-ico* es el
              mayor de sus dos números, +3.
          - valor: 'Ni3O2'
            mensaje: |
              Has cruzado al revés: el 3 del níquel va al oxígeno y el 2 del
              oxígeno, al níquel. Así salen 9 cargas positivas contra 4
              negativas.
        pista: |
          El níquel tiene +2 y +3, como el hierro y el cobalto.
        desarrollo: |
          Níquel(III) con oxígeno(2−):

          $$
          \mathrm{Ni_2O_3} \qquad 2\times(+3) + 3\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena lo que resuelve el bloque. Una pieza es falsa.
        piezas:
          - texto: 'El nitrógeno y el oxígeno del 12 y el 13 son sustancias elementales: número de oxidación 0, y la fórmula es la de su molécula, N₂ y O₂.'
          - texto: 'El cromo y el manganeso forman óxidos cuando actúan como metales, con +2 y +3, y por eso el óxido crómico es Cr₂O₃ y el mangánico, Mn₂O₃.'
          - texto: 'El óxido nitroso es una excepción de nombre: N₂O, con el nitrógeno en +1, y no el anhídrido nitroso, N₂O₃.'
          - texto: 'En una sal binaria va delante el metal y detrás el no metal, con su número negativo: KBr, FeCl₃, KI.'
          - texto: 'Férrico lleva siempre dos hierros, así que el cloruro férrico es Fe₂Cl₃, como el óxido férrico es Fe₂O₃.'
            trampa: true
            mensaje: |
              El 2 del Fe₂O₃ no es del hierro: es la carga del oxígeno, que ha
              bajado al hierro al cruzar. El cloro tiene carga 1−, así que en
              el cloruro no baja nada y el hierro se queda con uno solo:
              FeCl₃. Lo que dice «férrico» es el número de oxidación, +3, no
              cuántos hierros hay.
    resolucion: |
      | | fórmula | nombre tradicional | Stock · sistemática |
      |---|---|---|---|
      | 11 | Br₂O₃ | anhídrido bromoso | óxido de bromo(III) · trióxido de dibromo |
      | 12 | N₂ | nitrógeno | dinitrógeno |
      | 13 | O₂ | oxígeno | dioxígeno |
      | 14 | N₂O | óxido nitroso | óxido de nitrógeno(I) · monóxido de dinitrógeno |
      | 15 | Cr₂O₃ | óxido crómico | óxido de cromo(III) · trióxido de dicromo |
      | 16 | Mn₂O₃ | óxido mangánico | óxido de manganeso(III) · trióxido de dimanganeso |
      | 17 | KBr | bromuro potásico | bromuro de potasio |
      | 18 | FeCl₃ | cloruro férrico | cloruro de hierro(III) · tricloruro de hierro |
      | 19 | KI | ioduro potásico | yoduro de potasio |
      | 20 | Ni₂O₃ | óxido niquélico | óxido de níquel(III) · trióxido de diníquel |

      **Lo que hay que llevarse.** Dos de los diez no se cruzan: el
      nitrógeno y el oxígeno son sustancias elementales y se escriben con su
      molécula. Otro se nombra por excepción, el óxido nitroso. Y el cromo y
      el manganeso cambian de números según la palabra: en un óxido son
      metales, con +2 y +3.

      Las ocho respuestas que publica la hoja del curso para este bloque, el
      12, el 13 y del 15 al 20, están bien.

  - id: colfq1-f1-formular-del-21-al-30
    titulo: 'Hoja 1 de formulación: formular del 21 al 30, anhídridos, óxidos, un hidruro y el agua oxigenada'
    fuente: >-
      Ejercicios de formulación-1, columna de formular, del 21 al 30 ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La hoja de respuestas del curso solo publica el 25,
      PtO₂, y está bien. Las otras nueve respuestas son nuestras.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      21. Óxido nítrico
      22. Anhídrido perclórico
      23. Bióxido de manganeso
      24. Anhídrido arsénico
      25. Óxido platínico
      26. Hidruro cobáltico
      27. Anhídrido sulfúrico
      28. Peróxido de hidrógeno
      29. Anhídrido permangánico
      30. Anhídrido telúrico
    pide: La fórmula de los diez compuestos, en el orden de la hoja.

    pasos:
      - tipo: reconocer
        pregunta: |
          El 23 usa un nombre antiguo, «bióxido de manganeso». ¿Qué cuenta ese
          *bi-*?
        opciones:
          - texto: 'Los oxígenos: hay dos por cada manganeso'
            correcta: true
            mensaje: |
              Eso es. *Bi-* va pegado a «óxido», así que cuenta oxígenos, igual
              que el *di-* de «dióxido». Dos oxígenos con −2 piden un
              manganeso con +4: MnO₂. El curso llama a este mismo compuesto
              anhídrido manganoso.
          - texto: 'El número de oxidación del manganeso, que es 2'
            mensaje: |
              Un prefijo numeral no da números de oxidación: cuenta átomos. Con
              el manganeso en +2 saldría MnO, que es el óxido manganoso, un
              compuesto con la mitad de oxígeno.
          - texto: 'Los manganesos: hay dos por cada oxígeno'
            mensaje: |
              El prefijo va delante de «óxido», no de «manganeso», así que lo
              que se duplica es el oxígeno. Mn₂O pediría un manganeso con +1,
              que no tiene.
          - texto: 'Que es un peróxido, porque lleva dos oxígenos'
            mensaje: |
              Llevar dos oxígenos no lo hace peróxido: en el MnO₂ cada oxígeno
              lleva −2 y va unido al manganeso, no a otro oxígeno. Un peróxido
              lo dice su nombre, como el 28 de esta hoja.

      - tipo: calcular
        titulo: 'El 21: óxido nítrico'
        pregunta: |
          Escribe la fórmula del óxido nítrico.
        respuesta:
          tipo: formula
          valor: 'NO'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'N2O5'
            mensaje: |
              Ese es el anhídrido nítrico, el 9 de esta hoja. «Óxido nítrico»
              es la excepción del nitrógeno: NO, con el nitrógeno en +2.
          - valor: 'N2O'
            mensaje: |
              Ese es el óxido nitroso, con el nitrógeno en +1. El nítrico es el
              de +2.
          - valor: 'N2O2'
            mensaje: |
              Es el cruce de +2 con −2 sin simplificar. Los dos subíndices se
              dividen entre 2 y queda NO.
        pista: |
          El óxido nítrico es uno de los nombres propios del nitrógeno, con el
          nitrógeno en +2.
        desarrollo: |
          Nitrógeno(II) con oxígeno(2−). El cruce da $\mathrm{N_2O_2}$, que
          se simplifica a

          $$
          \mathrm{NO} \qquad (+2) + (-2) = 0
          $$

          No hay que confundirlo con el anhídrido nítrico del 9, N₂O₅:
          comparten el adjetivo y no el compuesto.

      - tipo: calcular
        titulo: 'El 22: anhídrido perclórico'
        pregunta: |
          Escribe la fórmula del anhídrido perclórico.
        respuesta:
          tipo: formula
          valor: 'Cl2O7'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Cl2O5'
            mensaje: |
              Ese es el anhídrido clórico, con el cloro en +5. *Per-…-ico* sube
              un escalón más, al +7.
          - valor: 'HClO4'
            mensaje: |
              Eso es el ácido perclórico, el anhídrido más agua. El anhídrido
              no lleva hidrógeno.
          - valor: 'Cl7O2'
            mensaje: |
              Has cruzado al revés: el 7 del cloro va al oxígeno y el 2 del
              oxígeno, al cloro.
        pista: |
          El cloro tiene +1, +3, +5 y +7; *per-…-ico* es el más alto.
        desarrollo: |
          Cloro(VII) con oxígeno(2−):

          $$
          \mathrm{Cl_2O_7} \qquad 2\times(+7) + 7\times(-2) = 0
          $$

      - tipo: calcular
        titulo: 'El 23: bióxido de manganeso'
        pregunta: |
          Escribe la fórmula del bióxido de manganeso.
        respuesta:
          tipo: formula
          valor: 'MnO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'MnO'
            mensaje: |
              Has leído el *bi-* como el número de oxidación del manganeso. El
              prefijo cuenta oxígenos: dos. MnO es el óxido manganoso, con +2.
          - valor: 'Mn2O'
            mensaje: |
              Has puesto el dos en el manganeso. El *bi-* va delante de
              «óxido», así que los dos son oxígenos; Mn₂O pediría un manganeso
              con +1, que no tiene.
          - valor: 'Mn2O4'
            mensaje: |
              El manganeso en +4 está bien y el cruce también; falta
              simplificar. 2 y 4 comparten el 2: MnO₂, que además es lo que
              dice el nombre, dos oxígenos por manganeso.
        pista: |
          El *bi-* cuenta oxígenos. Con dos oxígenos, ¿qué número tiene que
          tener el manganeso?
        desarrollo: |
          Dos oxígenos con −2 piden un manganeso con +4:

          $$
          \mathrm{MnO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es el mismo compuesto que el curso llama anhídrido manganoso, porque
          con +4 el manganeso actúa como no metal. Hoy se dice dióxido de
          manganeso u óxido de manganeso(IV).

      - tipo: calcular
        titulo: 'El 24: anhídrido arsénico'
        pregunta: |
          Escribe la fórmula del anhídrido arsénico.
        respuesta:
          tipo: formula
          valor: 'As2O5'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'As2O3'
            mensaje: |
              Ese es el anhídrido arsenioso, con el arsénico en +3. *-ico* es
              el mayor de sus dos números, +5.
          - valor: 'As5O2'
            mensaje: |
              Has cruzado al revés: el 5 del arsénico va al oxígeno y el 2 del
              oxígeno, al arsénico. Tu fórmula da 25 cargas positivas contra 4
              negativas.
        pista: |
          El arsénico tiene +3 y +5 frente al oxígeno.
        desarrollo: |
          Arsénico(V) con oxígeno(2−):

          $$
          \mathrm{As_2O_5} \qquad 2\times(+5) + 5\times(-2) = 0
          $$

          Aquí el adjetivo coincide con el nombre del elemento: «arsénico» es
          a la vez el elemento y su forma en *-ico*.

      - tipo: calcular
        titulo: 'El 25: óxido platínico'
        pregunta: |
          Escribe la fórmula del óxido platínico.
        respuesta:
          tipo: formula
          valor: 'PtO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'PtO'
            mensaje: |
              Ese es el óxido platinoso, con el platino en +2. *-ico* es el
              mayor de sus dos números, +4.
          - valor: 'Pt2O3'
            mensaje: |
              Has tomado *-ico* como +3, que es lo que vale en el férrico o el
              niquélico. El platino tiene +2 y +4, así que platínico es +4.
          - valor: 'Pt2O4'
            mensaje: |
              Es el cruce de +4 con −2 sin simplificar: los dos subíndices se
              dividen entre 2 y queda PtO₂.
        pista: |
          El platino tiene +2 y +4, como el estaño y el plomo.
        desarrollo: |
          Platino(IV) con oxígeno(2−). El cruce da $\mathrm{Pt_2O_4}$, que se
          simplifica a

          $$
          \mathrm{PtO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 26: hidruro cobáltico'
        pregunta: |
          Escribe la fórmula del hidruro cobáltico.
        respuesta:
          tipo: formula
          valor: 'CoH3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'CoH2'
            mensaje: |
              Ese es el hidruro cobaltoso, con el cobalto en +2. *-ico* es +3.
          - valor: 'Co(OH)3'
            mensaje: |
              Eso es el hidróxido cobáltico. Un hidruro lleva el hidrógeno
              solo, como H⁻, sin oxígeno: CoH₃.
          - valor: 'H3Co'
            mensaje: |
              Tienes los dos elementos al revés. En un hidruro metálico el
              hidrógeno actúa con −1 y va detrás del metal, como el no metal en
              una sal: CoH₃.
        pista: |
          Cobáltico es Co³⁺, y en un hidruro metálico el hidrógeno es −1.
        desarrollo: |
          Un Co³⁺ necesita tres H⁻:

          $$
          \mathrm{CoH_3} \qquad (+3) + 3\times(-1) = 0
          $$

          Es el ejemplo que usan las diapositivas del curso para los hidruros
          metálicos.

      - tipo: calcular
        titulo: 'El 27: anhídrido sulfúrico'
        pregunta: |
          Escribe la fórmula del anhídrido sulfúrico.
        respuesta:
          tipo: formula
          valor: 'SO3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'SO2'
            mensaje: |
              Ese es el anhídrido sulfuroso, con el azufre en +4. *-ico* es el
              más alto de los tres, +6.
          - valor: 'S2O6'
            mensaje: |
              Es el cruce de +6 con −2 sin simplificar. Los dos subíndices
              comparten el 2: SO₃.
          - valor: 'H2SO4'
            mensaje: |
              Eso es el ácido sulfúrico, el anhídrido más agua. El anhídrido no
              lleva hidrógeno.
        pista: |
          El azufre tiene +2, +4 y +6 frente al oxígeno.
        desarrollo: |
          Azufre(VI) con oxígeno(2−). El cruce da $\mathrm{S_2O_6}$, que se
          simplifica a

          $$
          \mathrm{SO_3} \qquad (+6) + 3\times(-2) = 0
          $$

          Con agua da el ácido sulfúrico:
          $\mathrm{SO_3 + H_2O \rightarrow H_2SO_4}$.

      - tipo: calcular
        titulo: 'El 28: peróxido de hidrógeno'
        pregunta: |
          Escribe la fórmula del peróxido de hidrógeno.
        respuesta:
          tipo: formula
          valor: 'H2O2 | H2(O2)'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'HO'
            mensaje: |
              Has simplificado el peróxido. El grupo O₂²⁻ va entero y no se
              divide: por eso los subíndices 2 y 2 no son dos números que se
              puedan dividir, y la fórmula es H₂O₂.
          - valor: 'H2O'
            mensaje: |
              Esa es el agua, el óxido de hidrógeno, con el oxígeno en −2. En
              el peróxido los oxígenos van en pareja, con −1 cada uno: H₂O₂.
        pista: |
          Dos H⁺ y un grupo peróxido, O₂²⁻.
        desarrollo: |
          Dos H⁺ compensan un O₂²⁻:

          $$
          \mathrm{H_2O_2} \qquad 2\times(+1) + 2\times(-1) = 0
          $$

          Es el agua oxigenada. La fórmula no se simplifica: el O₂ es un
          grupo, y partirlo cambia el compuesto.

      - tipo: calcular
        titulo: 'El 29: anhídrido permangánico'
        pregunta: |
          Escribe la fórmula del anhídrido permangánico.
        respuesta:
          tipo: formula
          valor: 'Mn2O7'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'MnO3'
            mensaje: |
              Ese es el anhídrido mangánico, con el manganeso en +6.
              *Per-…-ico* es el más alto de los tres, +7.
          - valor: 'MnO4'
            mensaje: |
              Ese es el ion permanganato sin su carga, MnO₄⁻: lo que queda del
              ácido permangánico al quitarle el hidrógeno. El anhídrido se
              formula cruzando +7 con −2.
          - valor: 'Mn7O2'
            mensaje: |
              Has cruzado al revés: el 7 del manganeso va al oxígeno y el 2 del
              oxígeno, al manganeso.
        pista: |
          Como no metal, el manganeso tiene +4, +6 y +7; *per-…-ico* es el
          más alto.
        desarrollo: |
          Manganeso(VII) con oxígeno(2−):

          $$
          \mathrm{Mn_2O_7} \qquad 2\times(+7) + 7\times(-2) = 0
          $$

          Con agua da el ácido permangánico, HMnO₄, y de él sale el
          permanganato potásico, KMnO₄.

      - tipo: calcular
        titulo: 'El 30: anhídrido telúrico'
        pregunta: |
          Escribe la fórmula del anhídrido telúrico.
        respuesta:
          tipo: formula
          valor: 'TeO3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'TeO2'
            mensaje: |
              Ese es el anhídrido teluroso, con el teluro en +4. *-ico* es +6.
          - valor: 'Te2O6'
            mensaje: |
              Es el cruce de +6 con −2 sin simplificar: los subíndices se
              dividen entre 2 y queda TeO₃.
        pista: |
          El teluro está en el grupo del azufre y se formula igual: *-ico* es
          +6.
        desarrollo: |
          Teluro(VI) con oxígeno(2−):

          $$
          \mathrm{TeO_3} \qquad (+6) + 3\times(-2) = 0
          $$

          Es el mismo patrón que el anhídrido sulfúrico del 27, SO₃, dos
          puestos más abajo en el grupo.

      - tipo: justificar
        pregunta: Ordena lo que resuelve el bloque. Una pieza es falsa.
        piezas:
          - texto: 'El bi- de «bióxido» cuenta oxígenos: MnO₂, con el manganeso en +4.'
          - texto: 'En un hidruro metálico el hidrógeno actúa con −1 y va detrás del metal: CoH₃.'
          - texto: 'El peróxido de hidrógeno es H₂O₂ y no se simplifica, porque el grupo O₂²⁻ va entero.'
          - texto: 'Con per-…-ico se toma el número más alto del elemento: +7 en el cloro y en el manganeso, y salen Cl₂O₇ y Mn₂O₇.'
          - texto: 'El óxido nítrico es N₂O₅, porque «nítrico» es el nitrógeno con +5.'
            trampa: true
            mensaje: |
              Eso vale para el anhídrido nítrico, que es N₂O₅. El óxido nítrico
              es una de las excepciones del nitrógeno: NO, con el nitrógeno en
              +2. En el nitrógeno el nombre del óxido no se deduce del sufijo;
              los tres, nitroso N₂O, nítrico NO y dióxido de nitrógeno NO₂, se
              aprenden.
    resolucion: |
      | | fórmula | nombre tradicional | Stock · sistemática |
      |---|---|---|---|
      | 21 | NO | óxido nítrico | óxido de nitrógeno(II) · monóxido de nitrógeno |
      | 22 | Cl₂O₇ | anhídrido perclórico | óxido de cloro(VII) · heptaóxido de dicloro |
      | 23 | MnO₂ | bióxido de manganeso · anhídrido manganoso | óxido de manganeso(IV) · dióxido de manganeso |
      | 24 | As₂O₅ | anhídrido arsénico | óxido de arsénico(V) · pentaóxido de diarsénico |
      | 25 | PtO₂ | óxido platínico | óxido de platino(IV) · dióxido de platino |
      | 26 | CoH₃ | hidruro cobáltico | hidruro de cobalto(III) · trihidruro de cobalto |
      | 27 | SO₃ | anhídrido sulfúrico | óxido de azufre(VI) · trióxido de azufre |
      | 28 | H₂O₂ | peróxido de hidrógeno, agua oxigenada | peróxido de hidrógeno · dióxido de dihidrógeno |
      | 29 | Mn₂O₇ | anhídrido permangánico | óxido de manganeso(VII) · heptaóxido de dimanganeso |
      | 30 | TeO₃ | anhídrido telúrico | óxido de teluro(VI) · trióxido de teluro |

      **El manganeso, tres veces en la misma columna.** Óxido mangánico Mn₂O₃,
      con +3 y como metal; bióxido de manganeso MnO₂, con +4; anhídrido
      permangánico Mn₂O₇, con +7. El nombre decide el número de oxidación, y
      el número, la fórmula.

      **Y el nitrógeno, otra vez.** El óxido nítrico es NO y el anhídrido
      nítrico, N₂O₅: el mismo adjetivo, dos compuestos.

      La hoja de respuestas del curso solo trae el 25 de este bloque, PtO₂, y
      está bien.

  - id: colfq1-f1-formular-del-31-al-40
    titulo: 'Hoja 1 de formulación: formular del 31 al 40, silano, fosfina, anhídridos, óxidos y dos sales'
    fuente: >-
      Ejercicios de formulación-1, columna de formular, del 31 al 40 ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La hoja de respuestas del curso no trae ninguno de
      estos diez en la dirección de formular. Sí trae, en la de nombrar, los
      pares del 36 (HgO, óxido mercúrico), el 38 (CaSe, seleniuro de calcio)
      y el 40 (PbO, que llama «óxido plunboso», errata de plumboso), y los
      tres coinciden con los de aquí. Las demás respuestas son nuestras.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      31. Silano
      32. Fosfina
      33. Anhídrido selenioso
      34. Anhídrido hipofosforoso
      35. Óxido cúprico
      36. Óxido mercúrico
      37. Anhídrido silícico
      38. Seleniuro de calcio
      39. Sulfuro de cinc
      40. Óxido plumboso
    pide: La fórmula de los diez compuestos, en el orden de la hoja.

    pasos:
      - tipo: reconocer
        pregunta: |
          En siete de estos diez, al cruzar las cargas salen dos subíndices
          con un divisor común: el cúprico da Cu₂O₂ y el silícico, Si₂O₄. ¿Qué
          se hace con ellos?
        opciones:
          - texto: 'Se simplifican: la fórmula da la proporción más simple, CuO y SiO₂'
            correcta: true
            mensaje: |
              Eso es. El cruce garantiza que las cargas sumen cero; simplificar
              deja la proporción mínima, que es lo que escribe una fórmula de
              este tipo. La única excepción son los peróxidos, cuyo O₂ va
              entero, y en este bloque no hay ninguno.
          - texto: 'Se dejan como salen, porque el cruce ya da la fórmula'
            mensaje: |
              El cruce da una fórmula neutra, pero no la más simple. Cu₂O₂
              tiene el mismo cobre por oxígeno que CuO, y la fórmula que se
              escribe es la de la proporción mínima.
          - texto: 'Solo se simplifican los óxidos de los metales; los anhídridos no'
            mensaje: |
              Se simplifican los dos. El SO₂, el CO₂ y el SiO₂ son anhídridos y
              salen de simplificar S₂O₄, C₂O₄ y Si₂O₄. La única excepción de la
              regla es el grupo O₂ de un peróxido.
          - texto: 'Solo se simplifican cuando los dos subíndices son iguales'
            mensaje: |
              También cuando comparten un divisor sin ser iguales: Si₂O₄ se
              divide entre 2 y queda SiO₂. Lo que decide es el divisor común,
              no que coincidan.

      - tipo: calcular
        titulo: 'El 31: silano'
        pregunta: |
          Escribe la fórmula del silano.
        respuesta:
          tipo: formula
          valor: 'SiH4'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'H4Si'
            mensaje: |
              Tienes los dos elementos al revés. En los hidruros del boro, el
              carbono, el silicio, el nitrógeno, el fósforo y el arsénico el
              hidrógeno va detrás: CH₄, NH₃, SiH₄. Delante solo va en los
              hidrácidos, como HCl o H₂S.
          - valor: 'SiH2'
            mensaje: |
              Con dos hidrógenos el silicio actuaría con −2. En el silano actúa
              con −4, como el carbono en el metano: cuatro hidrógenos.
        pista: |
          El silicio está en el grupo del carbono, y el silano se formula como
          el metano, CH₄.
        desarrollo: |
          El silicio actúa con −4 y cada hidrógeno con +1:

          $$
          \mathrm{SiH_4} \qquad (-4) + 4\times(+1) = 0
          $$

          Es uno de los hidruros con nombre propio que da el curso, junto al
          borano BH₃, el metano CH₄, el amoniaco NH₃, la fosfina PH₃ y la
          arsina AsH₃.

      - tipo: calcular
        titulo: 'El 32: fosfina'
        pregunta: |
          Escribe la fórmula de la fosfina.
        respuesta:
          tipo: formula
          valor: 'PH3'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'H3P'
            mensaje: |
              Tienes los dos elementos al revés. Como en el amoniaco, NH₃, el
              hidrógeno va detrás del fósforo. Delante solo va en los
              hidrácidos, los de los grupos del azufre y del cloro: H₂S, HCl.
          - valor: 'PH5'
            mensaje: |
              Has usado el +5 del fósforo. Frente al hidrógeno el fósforo
              actúa con su número negativo, −3, como el nitrógeno en el
              amoniaco: tres hidrógenos.
        pista: |
          El fósforo está en el grupo del nitrógeno, y la fosfina se formula
          como el amoniaco, NH₃.
        desarrollo: |
          El fósforo actúa con −3 y cada hidrógeno con +1:

          $$
          \mathrm{PH_3} \qquad (-3) + 3\times(+1) = 0
          $$

          Hoy se llama fosfano, pero el nombre del curso es fosfina.

      - tipo: calcular
        titulo: 'El 33: anhídrido selenioso'
        pregunta: |
          Escribe la fórmula del anhídrido selenioso.
        respuesta:
          tipo: formula
          valor: 'SeO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'SeO3'
            mensaje: |
              Ese es el anhídrido selénico, con el selenio en +6. *-oso* es +4.
          - valor: 'Se2O4'
            mensaje: |
              El cruce de +4 con −2 está bien y falta simplificar: los dos
              subíndices comparten el 2 y queda SeO₂.
        pista: |
          El selenio va como el azufre: *-oso* es +4 y *-ico*, +6.
        desarrollo: |
          Selenio(IV) con oxígeno(2−). El cruce da $\mathrm{Se_2O_4}$, que se
          simplifica a

          $$
          \mathrm{SeO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es el mismo patrón que el anhídrido sulfuroso, SO₂.

      - tipo: calcular
        titulo: 'El 34: anhídrido hipofosforoso'
        pregunta: |
          Escribe la fórmula del anhídrido hipofosforoso.
        respuesta:
          tipo: formula
          valor: 'P2O'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'P2O3'
            mensaje: |
              Ese es el anhídrido fosforoso, con el fósforo en +3: el 7 de esta
              hoja. El *hipo-* baja un escalón más, al +1.
          - valor: 'PO2'
            mensaje: |
              Has cruzado al revés: con el fósforo en +1 y el oxígeno en −2, el
              2 del oxígeno va al fósforo. Tu fórmula da +1 contra −4.
        pista: |
          El curso da al fósforo +1, +3 y +5; *hipo-…-oso* es el +1.
        desarrollo: |
          Fósforo(I) con oxígeno(2−):

          $$
          \mathrm{P_2O} \qquad 2\times(+1) + (-2) = 0
          $$

          Con tres moléculas de agua da el ácido hipofosforoso, H₃PO₂, que es
          el que aparece en las diapositivas.

      - tipo: calcular
        titulo: 'El 35: óxido cúprico'
        pregunta: |
          Escribe la fórmula del óxido cúprico.
        respuesta:
          tipo: formula
          valor: 'CuO'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Cu2O'
            mensaje: |
              Ese es el óxido cuproso, con el cobre en +1: el 10 de esta hoja.
              *-ico* es el mayor de los dos números del cobre, +2.
          - valor: 'Cu2O2'
            mensaje: |
              Es el cruce de +2 con −2 sin simplificar. Con cargas iguales la
              proporción es uno a uno: CuO.
        pista: |
          El cobre tiene +1 y +2.
        desarrollo: |
          Cobre(II) con oxígeno(2−). El cruce da $\mathrm{Cu_2O_2}$, que se
          simplifica a

          $$
          \mathrm{CuO} \qquad (+2) + (-2) = 0
          $$

      - tipo: calcular
        titulo: 'El 36: óxido mercúrico'
        pregunta: |
          Escribe la fórmula del óxido mercúrico.
        respuesta:
          tipo: formula
          valor: 'HgO'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Hg2O'
            mensaje: |
              Ese es el óxido mercurioso, con el mercurio en +1. *-ico* es +2.
          - valor: 'HgO2'
            mensaje: |
              Has bajado el 2 del mercurio al oxígeno y no has bajado el 2 del
              oxígeno al mercurio: es el cruce a medias, el mismo que da el
              AuO₃ de la hoja de respuestas para el 1. Cruzado entero sale
              Hg₂O₂, que se simplifica a HgO.
        pista: |
          El mercurio tiene +1 y +2, como el cobre.
        desarrollo: |
          Mercurio(II) con oxígeno(2−). Las cargas son iguales, así que va uno
          a uno:

          $$
          \mathrm{HgO} \qquad (+2) + (-2) = 0
          $$

          La hoja de respuestas del curso trae este mismo par en la dirección
          de nombrar: HgO, óxido mercúrico.

      - tipo: calcular
        titulo: 'El 37: anhídrido silícico'
        pregunta: |
          Escribe la fórmula del anhídrido silícico.
        respuesta:
          tipo: formula
          valor: 'SiO2'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Si2O4'
            mensaje: |
              El cruce de +4 con −2 está bien y falta simplificar: 2 y 4
              comparten el 2, y queda SiO₂.
          - valor: 'H2SiO3'
            mensaje: |
              Eso es el ácido metasilícico, el anhídrido más una molécula de
              agua. El anhídrido no lleva hidrógeno: SiO₂.
        pista: |
          El silicio actúa con +4 frente al oxígeno.
        desarrollo: |
          Silicio(IV) con oxígeno(2−). El cruce da $\mathrm{Si_2O_4}$, que se
          simplifica a

          $$
          \mathrm{SiO_2} \qquad (+4) + 2\times(-2) = 0
          $$

          Es la sílice, el cuarzo de la arena.

      - tipo: calcular
        titulo: 'El 38: seleniuro de calcio'
        pregunta: |
          Escribe la fórmula del seleniuro de calcio.
        respuesta:
          tipo: formula
          valor: 'CaSe'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Ca2Se2'
            mensaje: |
              Es el cruce de +2 con −2 sin simplificar. Con cargas iguales la
              proporción es uno a uno: CaSe.
          - valor: 'SeCa'
            mensaje: |
              Tienes los dos elementos al revés. El nombre dice primero el no
              metal, «seleniuro», pero en la fórmula va primero el metal: CaSe.
        pista: |
          El calcio es 2+, y el selenio, en un seleniuro, 2−.
        desarrollo: |
          Ca²⁺ y Se²⁻, uno a uno:

          $$
          \mathrm{CaSe} \qquad (+2) + (-2) = 0
          $$

          Cayó en el control del primer cuatrimestre de 2023-2024 como
          «seleniuro cálcico», que es el mismo nombre. La hoja de respuestas
          del curso trae el par en la dirección de nombrar: CaSe, seleniuro de
          calcio.

      - tipo: calcular
        titulo: 'El 39: sulfuro de cinc'
        pregunta: |
          Escribe la fórmula del sulfuro de cinc.
        respuesta:
          tipo: formula
          valor: 'ZnS'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'Zn2S2'
            mensaje: |
              Es el cruce de +2 con −2 sin simplificar: con cargas iguales, uno
              a uno. ZnS.
          - valor: 'ZnSO4'
            mensaje: |
              Eso es el sulfato de cinc, una sal con oxígeno. *-uro* dice que
              el azufre va solo, con −2: ZnS.
        pista: |
          El cinc es 2+, y el azufre, en un sulfuro, 2−.
        desarrollo: |
          Zn²⁺ y S²⁻, uno a uno:

          $$
          \mathrm{ZnS} \qquad (+2) + (-2) = 0
          $$

          «Cinc» y «zinc» son las dos grafías del mismo elemento; el símbolo
          es Zn.

      - tipo: calcular
        titulo: 'El 40: óxido plumboso'
        pregunta: |
          Escribe la fórmula del óxido plumboso.
        respuesta:
          tipo: formula
          valor: 'PbO'
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: 'PbO2'
            mensaje: |
              Ese es el óxido plúmbico, con el plomo en +4. *-oso* es el menor
              de sus dos números, +2.
          - valor: 'Pb2O2'
            mensaje: |
              Es el cruce de +2 con −2 sin simplificar: queda PbO.
        pista: |
          El plomo tiene +2 y +4.
        desarrollo: |
          Plomo(II) con oxígeno(2−), uno a uno:

          $$
          \mathrm{PbO} \qquad (+2) + (-2) = 0
          $$

          La hoja de respuestas del curso trae el par en la dirección de
          nombrar, con una errata en el nombre: «PbO, óxido plunboso», por
          plumboso.

      - tipo: justificar
        pregunta: Ordena lo que resuelve el bloque. Una pieza es falsa.
        piezas:
          - texto: 'El silano y la fosfina son hidruros con nombre propio: el silicio y el fósforo actúan con su número negativo, −4 y −3, y van delante del hidrógeno.'
          - texto: 'Cuando las dos cargas son iguales en valor, la fórmula queda uno a uno: CuO, HgO, PbO, CaSe, ZnS.'
          - texto: 'Con el no metal en +4 y el oxígeno en −2, el cruce da 2 y 4, y se simplifica: SeO₂, SiO₂.'
          - texto: 'El hipo- del anhídrido hipofosforoso pide el +1 del fósforo, y el cruce con el oxígeno da P₂O.'
          - texto: 'Las sales binarias no se simplifican, igual que los peróxidos: el seleniuro de calcio es Ca₂Se₂.'
            trampa: true
            mensaje: |
              Lo único que no se parte es el grupo O₂ de un peróxido, porque
              sus dos oxígenos van enlazados entre sí. En el seleniuro de calcio
              no hay ningún grupo: un Ca²⁺ por cada Se²⁻, y la fórmula da esa
              proporción, CaSe. Lo mismo el ZnS del 39.
    resolucion: |
      | | fórmula | nombre tradicional | Stock · sistemática |
      |---|---|---|---|
      | 31 | SiH₄ | silano | silano · tetrahidruro de silicio |
      | 32 | PH₃ | fosfina | fosfano · trihidruro de fósforo |
      | 33 | SeO₂ | anhídrido selenioso | óxido de selenio(IV) · dióxido de selenio |
      | 34 | P₂O | anhídrido hipofosforoso | óxido de fósforo(I) · monóxido de difósforo |
      | 35 | CuO | óxido cúprico | óxido de cobre(II) · monóxido de cobre |
      | 36 | HgO | óxido mercúrico | óxido de mercurio(II) · monóxido de mercurio |
      | 37 | SiO₂ | anhídrido silícico | óxido de silicio(IV) · dióxido de silicio |
      | 38 | CaSe | seleniuro de calcio | seleniuro de calcio |
      | 39 | ZnS | sulfuro de cinc | sulfuro de cinc |
      | 40 | PbO | óxido plumboso | óxido de plomo(II) · monóxido de plomo |

      **Simplificar, en siete de los diez.** Salen del cruce con un divisor
      común —SeO₂, CuO, HgO, SiO₂, CaSe, ZnS y PbO— y se escriben en su
      proporción mínima. Los dos primeros no traen sufijo que
      descifrar: silano y fosfina se saben, como el metano o el amoniaco.

      **La hoja de respuestas.** No trae ninguno de estos diez en la
      dirección de formular. En la de nombrar trae los pares del 36, el 38 y
      el 40, que coinciden con estos; el del 40 escribe «óxido plunboso»,
      errata de plumboso.

  # ── La hoja 2 de formulación (hidróxidos y oxoácidos), en cuatro bloques y
  #    en el orden de la hoja: primero la columna de nombrar y después la de
  #    formular. Las únicas respuestas oficiales son las de los hidróxidos, en
  #    la hoja de respuestas de 58 compuestos; todo lo demás es nuestro.
  - id: colfq1-f2-nombrar-del-1-al-12
    titulo: 'Hoja 2 de formulación: nombrar del 1 al 12, hidróxidos y oxoácidos'
    fuente: >-
      Ejercicios de formulación-2, nombrar del 1 al 12 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      La hoja de respuestas del curso, la de 58 compuestos, publica las de los
      hidróxidos 1 a 4, que coinciden con las de aquí (escribe «ferrico» y
      «amonico» sin tilde); en lugar del 5, el Hg(OH)₂, trae un Co(OH)₂,
      hidróxido cobaltoso, que esta hoja no tiene. La del 5 y las de los
      oxoácidos, del 6 al 12, son nuestras.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      1. Ca(OH)₂
      2. Fe(OH)₃
      3. NH₄OH
      4. Zn(OH)₂
      5. Hg(OH)₂
      6. HClO₃
      7. HNO₂
      8. H₃PO₄
      9. H₂SO₄
      10. HBrO₂
      11. HMnO₄
      12. H₃BO₃
    pide: El nombre de los doce compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          La lista junta hidróxidos, $\mathrm{M(OH)}_x$, y oxoácidos,
          $\mathrm{H}_x\mathrm{EO}_y$. En los dos casos, ¿qué hay que saber
          antes de elegir el sufijo?
        opciones:
          - texto: 'El número de oxidación del metal o del elemento central, que sale de que la fórmula sea neutra'
            correcta: true
            mensaje: |
              Eso es. El sufijo no está escrito en la fórmula: se deduce. El
              OH vale −1, el H +1 y el O −2, y lo que falta para llegar a cero
              es el estado del metal o del no metal. Con ese número se elige
              entre -oso, -ico, hipo- y per-.
          - texto: 'El número de oxígenos: con tres es -ico y con cuatro es per-'
            mensaje: |
              El H₂SO₄ tiene cuatro y es sulfúrico, y el HMnO₄ y el H₂MnO₄
              tienen cuatro los dos y se llaman distinto. Los oxígenos cuentan,
              pero dentro de una suma en la que también entran los hidrógenos.
          - texto: 'El número de grupos OH: con uno es -oso y con dos es -ico'
            mensaje: |
              Con esa regla el Fe(OH)₃ no tendría nombre. El número de OH da la
              carga del metal, y el sufijo compara esa carga con las valencias
              que el metal tiene: el Fe(OH)₃ es férrico porque +3 es la mayor
              de las del hierro, no porque lleve tres.
          - texto: 'Nada: cada metal tiene un solo hidróxido y cada no metal un solo ácido'
            mensaje: |
              El hierro tiene dos hidróxidos, Fe(OH)₂ y Fe(OH)₃, y el cloro
              cuatro oxoácidos. Por eso el nombre tiene que decir con qué
              estado actúa el elemento.

      - tipo: calcular
        titulo: 'El 1: Ca(OH)₂'
        pregunta: |
          Nombra el Ca(OH)₂.
        respuesta:
          tipo: formula
          valor: hidróxido de calcio | hidróxido cálcico | dihidróxido de calcio | hidróxido de calcio(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: óxido de calcio
            mensaje: |
              Ese es el CaO, con el oxígeno solo. Aquí cada oxígeno lleva
              pegado su hidrógeno, y ese grupo OH es el hidróxido: óxido e
              hidróxido son dos compuestos distintos, no dos nombres del mismo.
          - valor: hidruro de calcio
            mensaje: |
              Ese es el CaH₂, con el hidrógeno suelto y con −1. En el Ca(OH)₂
              el hidrógeno va dentro del grupo OH, unido al oxígeno. Los dos
              nombres empiezan por «hidr-», y ahí está la trampa.
        pista: |
          El grupo OH lleva carga −1. ¿Cuántos hay, y qué carga le queda al
          calcio?
        desarrollo: |
          Dos OH⁻ piden un calcio con +2: $(+2) + 2\times(-1) = 0$. El calcio
          solo actúa con +2, así que no hay sufijo que elegir: **hidróxido de
          calcio**, o hidróxido cálcico; en sistemática, dihidróxido de
          calcio. Es la de la hoja de respuestas, y el ejemplo de las
          diapositivas del curso.

      - tipo: calcular
        titulo: 'El 2: Fe(OH)₃'
        pregunta: |
          Nombra el Fe(OH)₃.
        respuesta:
          tipo: formula
          valor: hidróxido férrico | hidróxido de hierro(III) | trihidróxido de hierro
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido ferroso | hidróxido de hierro(II)
            mensaje: |
              Ese es el Fe(OH)₂, con el hierro en +2. Aquí hay tres OH, así que
              el hierro está en +3, la mayor de sus dos valencias: -ico.
          - valor: hidróxido de hierro
            mensaje: |
              Falta decir con qué valencia. El hierro tiene dos, +2 y +3, y
              «hidróxido de hierro» vale para los dos compuestos. O se pone el
              sufijo, férrico, o el número romano, hierro(III).
          - valor: óxido férrico | óxido de hierro(III)
            mensaje: |
              Ese es el Fe₂O₃, sin hidrógeno. En el Fe(OH)₃ cada oxígeno va con
              su hidrógeno: es un hidróxido, no un óxido.
        pista: |
          Tres OH⁻ son tres cargas negativas. El hierro actúa con +2 y +3.
        desarrollo: |
          $(+3) + 3\times(-1) = 0$: el hierro está en +3, la mayor de sus dos
          valencias. **Hidróxido férrico**, o hidróxido de hierro(III). Es la
          de la hoja de respuestas, que la escribe «ferrico», sin tilde.

      - tipo: calcular
        titulo: 'El 3: NH₄OH'
        pregunta: |
          Nombra el NH₄OH.
        respuesta:
          tipo: formula
          valor: hidróxido amónico | hidróxido de amonio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido de amoniaco
            mensaje: |
              El amoniaco es el NH₃, una molécula neutra. El que hace aquí de
              catión es el NH₄⁺, el amonio, y es el que da nombre al
              hidróxido. Amonio y amoniaco se parecen en el nombre y se
              diferencian en un hidrógeno y una carga.
          - valor: hidróxido de nitrógeno
            mensaje: |
              El nitrógeno no está aquí como un metal suelto: va dentro del
              catión NH₄⁺, que hace el papel de un metal de carga +1. El
              hidróxido lleva el nombre del catión entero, amonio.
        pista: |
          El NH₄ funciona como un catión de carga +1, igual que el sodio en el
          NaOH.
        desarrollo: |
          El NH₄⁺ —nitrógeno −3 y cuatro hidrógenos +1, $-3 + 4 = +1$— hace
          de metal, y un OH⁻ lo neutraliza. Ese catión se llama amonio:
          **hidróxido amónico**, o hidróxido de amonio. Es la de la hoja de
          respuestas, que escribe «amonico» sin tilde.

      - tipo: calcular
        titulo: 'El 4: Zn(OH)₂'
        pregunta: |
          Nombra el Zn(OH)₂.
        respuesta:
          tipo: formula
          valor: hidróxido de zinc | hidróxido de cinc | hidróxido cíncico | hidróxido zíncico | dihidróxido de zinc | dihidróxido de cinc | hidróxido de zinc(II) | hidróxido de cinc(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido zincoso | hidróxido cincoso
            mensaje: |
              El zinc solo tiene una valencia, +2. Los sufijos -oso e -ico
              sirven para elegir entre dos, y -oso diría «la menor», que el
              zinc no tiene. Se dice hidróxido de zinc o, con sufijo,
              hidróxido cíncico.
          - valor: óxido de zinc | óxido de cinc
            mensaje: |
              Ese es el ZnO. El Zn(OH)₂ tiene dos grupos OH, cada oxígeno con
              su hidrógeno: es un hidróxido.
        pista: |
          El zinc actúa solo con +2.
        desarrollo: |
          $(+2) + 2\times(-1) = 0$. Con una sola valencia no hay sufijo que
          elegir: **hidróxido de zinc**, o de cinc, o hidróxido cíncico. Es la
          de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 5: Hg(OH)₂'
        pregunta: |
          Nombra el Hg(OH)₂.
        respuesta:
          tipo: formula
          valor: hidróxido mercúrico | hidróxido de mercurio(II) | dihidróxido de mercurio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: hidróxido mercurioso | hidróxido de mercurio(I)
            mensaje: |
              Ese sería el HgOH, con el mercurio en +1. Aquí hay dos OH, así
              que el mercurio está en +2, la mayor de sus dos valencias: -ico.
          - valor: hidróxido de mercurio
            mensaje: |
              Falta la valencia. Al revés que el zinc del 4, el mercurio tiene
              dos, +1 y +2, y el nombre tiene que decir cuál: mercúrico, o
              mercurio(II).
        pista: |
          El mercurio tiene +1 y +2, igual que el cobre.
        desarrollo: |
          $(+2) + 2\times(-1) = 0$, y +2 es la mayor de las dos valencias del
          mercurio: **hidróxido mercúrico**, o hidróxido de mercurio(II). La
          hoja de respuestas no trae este compuesto: en su lugar pone un
          Co(OH)₂, hidróxido cobaltoso, que no está en la hoja 2.

      - tipo: calcular
        titulo: 'El 6: HClO₃'
        pregunta: |
          Nombra el HClO₃.
        respuesta:
          tipo: formula
          valor: ácido clórico | ácido trioxoclórico(V) | trioxoclorato(V) de hidrógeno | hidrogeno(trioxidoclorato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido perclórico
            mensaje: |
              Ese es el HClO₄, con el cloro en +7. Con tres oxígenos la cuenta
              da +5: $1 + x - 6 = 0$.
          - valor: ácido cloroso
            mensaje: |
              Ese es el HClO₂, con el cloro en +3. El cloro tiene cuatro
              estados, +1, +3, +5 y +7, y aquí está en el tercero, +5: -ico,
              sin prefijo.
          - valor: ácido clorhídrico
            mensaje: |
              Ese es el HCl, que no lleva oxígeno. La terminación -hídrico es
              la de los ácidos sin oxígeno; con oxígeno, el nombre sale del
              estado de oxidación del cloro.
        pista: |
          El H vale +1 y el O −2. El cloro tiene +1, +3, +5 y +7.
        desarrollo: |
          $(+1) + x + 3\times(-2) = 0$, así que $x = +5$. En el cloro, +1 es
          hipo-…-oso, +3 es -oso, +5 es -ico y +7 es per-…-ico: **ácido
          clórico**. Viene del anhídrido clórico: Cl₂O₅ + H₂O da H₂Cl₂O₆,
          que se simplifica a HClO₃.

      - tipo: calcular
        titulo: 'El 7: HNO₂'
        pregunta: |
          Nombra el HNO₂.
        respuesta:
          tipo: formula
          valor: ácido nitroso | ácido dioxonítrico(III) | dioxonitrato(III) de hidrógeno | hidrogeno(dioxidonitrato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido nítrico
            mensaje: |
              Ese es el HNO₃, con el nitrógeno en +5. Con dos oxígenos el
              nitrógeno está en +3, el menor de los dos estados de sus ácidos
              en el curso, y le toca -oso.
          - valor: ácido hiponitroso
            mensaje: |
              Hipo- es un peldaño por debajo del -oso: el ácido hiponitroso es
              el H₂N₂O₂, con el nitrógeno en +1. Aquí la cuenta da +3, y de los
              dos ácidos del nitrógeno que da el curso, el de +3 es -oso, sin
              prefijo.
        pista: |
          Con H +1 y O −2, ¿qué estado le queda al nitrógeno? En el curso, sus
          ácidos son los de +3 y +5.
        desarrollo: |
          $(+1) + x + 2\times(-2) = 0$, luego $x = +3$. Los ácidos del
          nitrógeno que da el curso son los de +3 y +5, y +3 es el menor:
          **ácido nitroso**. Viene del anhídrido nitroso: N₂O₃ + H₂O da
          H₂N₂O₄, que se simplifica a HNO₂.

      - tipo: calcular
        titulo: 'El 8: H₃PO₄'
        pregunta: |
          Nombra el H₃PO₄.
        respuesta:
          tipo: formula
          valor: ácido fosfórico | ácido ortofosfórico | ácido (orto)fosfórico | ácido tetraoxofosfórico(V) | tetraoxofosfato(V) de hidrógeno | trihidrogeno(tetraoxidofosfato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido fosforoso | ácido ortofosforoso
            mensaje: |
              Ese es el H₃PO₃, con el fósforo en +3. Aquí hay cuatro oxígenos y
              el fósforo está en +5: -ico.
          - valor: ácido metafosfórico
            mensaje: |
              Meta- es el anhídrido con una sola agua: P₂O₅ + H₂O da HPO₃. Tres
              hidrógenos por fósforo salen con tres aguas, y eso es el orto-,
              que se puede callar.
          - valor: ácido pirofosfórico
            mensaje: |
              Piro- son dos aguas: P₂O₅ + 2 H₂O da H₄P₂O₇, con dos fósforos.
              Aquí hay uno solo y tres hidrógenos: tres aguas, orto-.
        pista: |
          El fósforo tiene +1, +3 y +5. Y cuenta las aguas que hacen falta
          para tener tres hidrógenos por fósforo.
        desarrollo: |
          $3\times(+1) + x + 4\times(-2) = 0$, luego $x = +5$: fosfórico. Y
          P₂O₅ + 3 H₂O da H₆P₂O₈, que simplificado es H₃PO₄: tres aguas, el
          orto-, que se puede omitir. **Ácido fosfórico**, u ortofosfórico;
          las diapositivas lo escriben «ácido (orto)fosfórico».

      - tipo: calcular
        titulo: 'El 9: H₂SO₄'
        pregunta: |
          Nombra el H₂SO₄.
        respuesta:
          tipo: formula
          valor: ácido sulfúrico | ácido tetraoxosulfúrico(VI) | tetraoxosulfato(VI) de hidrógeno | dihidrogeno(tetraoxidosulfato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido sulfuroso
            mensaje: |
              Ese es el H₂SO₃, con el azufre en +4. Con cuatro oxígenos el
              azufre está en +6, el más alto que tiene: -ico.
          - valor: ácido persulfúrico
            mensaje: |
              Cuatro oxígenos no piden per-. En el HClO₄ lo hay porque el cloro
              está en +7; el azufre llega como mucho a +6, y +6 es -ico. El
              «persulfúrico» de algunos libros es un peroxoácido, otro
              compuesto.
          - valor: ácido sulfhídrico
            mensaje: |
              Ese es el H₂S, sin oxígeno: la terminación -hídrico es la de los
              ácidos sin oxígeno. Con cuatro oxígenos es un oxoácido.
        pista: |
          El azufre tiene +2, +4 y +6.
        desarrollo: |
          $2\times(+1) + x + 4\times(-2) = 0$, luego $x = +6$, el más alto del
          azufre: **ácido sulfúrico**. Viene del anhídrido sulfúrico, y
          SO₃ + H₂O da H₂SO₄ sin nada que simplificar.

      - tipo: calcular
        titulo: 'El 10: HBrO₂'
        pregunta: |
          Nombra el HBrO₂.
        respuesta:
          tipo: formula
          valor: ácido bromoso | ácido dioxobrómico(III) | dioxobromato(III) de hidrógeno | hidrogeno(dioxidobromato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido hipobromoso
            mensaje: |
              Ese es el HBrO, con el bromo en +1. Con dos oxígenos el bromo
              está en +3, el segundo de sus cuatro estados: -oso, sin hipo-.
          - valor: ácido brómico
            mensaje: |
              Ese es el HBrO₃, con el bromo en +5. Aquí la cuenta da +3, y +3
              es -oso.
        pista: |
          El bromo tiene los mismos estados que el cloro: +1, +3, +5 y +7.
        desarrollo: |
          $(+1) + x + 2\times(-2) = 0$, luego $x = +3$, el segundo peldaño de
          la escalera del bromo: **ácido bromoso**. Br₂O₃ + H₂O da H₂Br₂O₄,
          que se simplifica a HBrO₂.

      - tipo: calcular
        titulo: 'El 11: HMnO₄'
        pregunta: |
          Nombra el HMnO₄.
        respuesta:
          tipo: formula
          valor: ácido permangánico | ácido tetraoxomangánico(VII) | tetraoxomanganato(VII) de hidrógeno | hidrogeno(tetraoxidomanganato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido mangánico
            mensaje: |
              Ese es el H₂MnO₄: los mismos cuatro oxígenos y un hidrógeno más,
              que deja el manganeso en +6. Con un solo hidrógeno está en +7,
              que es per-…-ico.
          - valor: ácido manganoso
            mensaje: |
              Ese es el H₂MnO₃, con el manganeso en +4. Aquí está en +7, el más
              alto de los tres que tiene como no metal.
        pista: |
          Como no metal, el manganeso actúa con +4, +6 y +7.
        desarrollo: |
          $(+1) + x + 4\times(-2) = 0$, luego $x = +7$: **ácido permangánico**.
          Mn₂O₇ + H₂O da H₂Mn₂O₈, que se simplifica a HMnO₄. El mangánico,
          H₂MnO₄, lleva los mismos cuatro oxígenos: lo que los separa es el
          hidrógeno.

      - tipo: calcular
        titulo: 'El 12: H₃BO₃'
        pregunta: |
          Nombra el H₃BO₃.
        respuesta:
          tipo: formula
          valor: ácido bórico | ácido ortobórico | ácido (orto)bórico | ácido trioxobórico(III) | trioxoborato(III) de hidrógeno | trihidrogeno(trioxidoborato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido metabórico
            mensaje: |
              Ese es el HBO₂, el del anhídrido con una sola agua: B₂O₃ + H₂O da
              H₂B₂O₄, que se simplifica a HBO₂. Tres hidrógenos por boro salen
              con tres aguas: orto-, que se omite.
          - valor: ácido boroso
            mensaje: |
              El boro solo tiene un estado positivo, +3, así que no hay -oso
              que valga: con un solo estado, el sufijo es -ico.
        pista: |
          El boro solo actúa con +3. Y cuenta las aguas que hacen falta para
          tener tres hidrógenos por boro.
        desarrollo: |
          $3\times(+1) + x + 3\times(-2) = 0$, luego $x = +3$. B₂O₃ + 3 H₂O da
          H₆B₂O₆, que simplificado es H₃BO₃: tres aguas, el orto-, que se
          calla. **Ácido bórico**, u ortobórico; es el ejemplo de las
          diapositivas.

      - tipo: justificar
        pregunta: Ordena cómo se nombra cualquiera de los doce. Una pieza es falsa.
        piezas:
          - texto: 'Primero se reconoce la familia: un metal con grupos OH es un hidróxido; hidrógeno, un no metal y oxígeno, un oxoácido.'
          - texto: 'Después se saca el estado de oxidación del metal o del elemento central con OH −1, H +1 y O −2, para que la suma dé cero: en el HClO₃, $1 + x - 6 = 0$ y el cloro está en +5.'
          - texto: 'Ese número se coloca en la escalera del elemento. En el cloro, +1, +3, +5 y +7 son hipo-…-oso, -oso, -ico y per-…-ico: el HClO₃ es clórico.'
          - texto: 'Si el metal tiene un solo estado, como el calcio o el zinc, no hay sufijo que elegir: hidróxido de calcio.'
          - texto: 'El sufijo se lee en los oxígenos: con tres es -ico y con cuatro, per-.'
            trampa: true
            mensaje: |
              El H₂SO₄ y el H₃PO₄ tienen cuatro oxígenos y son sulfúrico y
              fosfórico, sin per-. Y el HMnO₄ y el H₂MnO₄ llevan los mismos
              cuatro y se llaman distinto, permangánico y mangánico, porque el
              hidrógeno de más baja el manganeso de +7 a +6. Lo que decide es
              el estado de oxidación, y en él entran también los hidrógenos.
        veredicto: |
          Familia, estado de oxidación, escalera: siempre en ese orden. El
          paso del medio es el que se salta, y es el único que no se puede
          adivinar mirando la fórmula.
    resolucion: |
      | | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 1 | Ca(OH)₂ | hidróxido de calcio · hidróxido cálcico | dihidróxido de calcio |
      | 2 | Fe(OH)₃ | hidróxido férrico | hidróxido de hierro(III) |
      | 3 | NH₄OH | hidróxido amónico | hidróxido de amonio |
      | 4 | Zn(OH)₂ | hidróxido de zinc · hidróxido cíncico | dihidróxido de zinc |
      | 5 | Hg(OH)₂ | hidróxido mercúrico | hidróxido de mercurio(II) |
      | 6 | HClO₃ | ácido clórico | trioxoclorato(V) de hidrógeno |
      | 7 | HNO₂ | ácido nitroso | dioxonitrato(III) de hidrógeno |
      | 8 | H₃PO₄ | ácido (orto)fosfórico | tetraoxofosfato(V) de hidrógeno |
      | 9 | H₂SO₄ | ácido sulfúrico | tetraoxosulfato(VI) de hidrógeno |
      | 10 | HBrO₂ | ácido bromoso | dioxobromato(III) de hidrógeno |
      | 11 | HMnO₄ | ácido permangánico | tetraoxomanganato(VII) de hidrógeno |
      | 12 | H₃BO₃ | ácido (orto)bórico | trioxoborato(III) de hidrógeno |

      Los nombres de la IUPAC de 2005, como hidrogeno(trioxidoclorato), se
      aceptan igual en los pasos.

      **Lo que se lleva uno del bloque.** El sufijo no está escrito en la
      fórmula: sale de una suma que tiene que dar cero, y en esa suma entran
      los hidrógenos. Por eso HMnO₄ y H₂MnO₄, con los mismos oxígenos, se
      llaman distinto; y por eso el Fe(OH)₃ lleva sufijo y el Zn(OH)₂ no: el
      hierro tiene dos valencias y el zinc una.

      **Las respuestas oficiales.** La hoja de respuestas del curso trae los
      hidróxidos 1 a 4, y coinciden con los de aquí (escribe «ferrico» y
      «amonico» sin tilde). Del 5 no dice nada: en su sitio aparece un
      Co(OH)₂, hidróxido cobaltoso, que esta hoja no tiene.

  - id: colfq1-f2-nombrar-del-13-al-25
    titulo: 'Hoja 2 de formulación: nombrar del 13 al 25, polihidratados, isopoliácidos e hidrácidos'
    fuente: >-
      Ejercicios de formulación-2, nombrar del 13 al 25 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      El material no publica las respuestas de este bloque: son nuestras. El
      HF también está en la hoja 1, y la hoja de respuestas del curso lo da
      como «Acido fluorhidrico», sin tildes: coincide. El 23 está impreso
      H₄AsO₇, que no puede existir; se nombra H₄As₂O₇.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      13. H₄P₂O₅
      14. H₂S
      15. H₄SiO₄
      16. HIO₃
      17. H₃PO₃
      18. HF
      19. H₂Cr₂O₇
      20. H₂B₄O₇
      21. H₂SeO₃
      22. H₂TeO₄
      23. H₄AsO₇
      24. H₂CO₃
      25. H₂CrO₄

      *En la hoja, el 23 está impreso H₄AsO₇, y así no puede ser: con un solo
      arsénico, este tendría que actuar con +10, y el arsénico no pasa de +5.
      Se ha perdido el subíndice 2 del arsénico, y aquí se nombra H₄As₂O₇, el
      ácido piroarsénico.*
    pide: El nombre de los trece compuestos, con el 23 leído como H₄As₂O₇.

    pasos:
      - tipo: reconocer
        pregunta: |
          El H₄P₂O₅ y el H₂Cr₂O₇ llevan los dos un 2 en el elemento central, y
          en el curso uno se llama piro- y el otro di-. ¿Qué cuenta cada
          prefijo?
        opciones:
          - texto: 'Piro- cuenta aguas: un anhídrido con dos. Di- cuenta anhídridos: dos, con una sola agua'
            correcta: true
            mensaje: |
              Eso es. P₂O₃ + 2 H₂O da H₄P₂O₅: el 2 del fósforo ya venía en el
              anhídrido. 2 CrO₃ + H₂O da H₂Cr₂O₇: el 2 del cromo sale de juntar
              dos anhídridos. Los dos acaban con dos átomos centrales por
              caminos distintos, y el nombre tradicional dice cuál.
          - texto: 'Los dos cuentan átomos del elemento central, y da igual usar uno u otro'
            mensaje: |
              En el nombre tradicional no da igual: piro- es de los
              polihidratados de B, P, As y Sb, un anhídrido con dos aguas, y
              di- o tetra- son de los isopoliácidos, varios anhídridos con una.
              La IUPAC actual sí cuenta átomos con di- (llama difosfórico al
              H₄P₂O₇), pero la hoja pide el nombre del curso.
          - texto: 'Piro- indica el estado de oxidación más alto, como per-'
            mensaje: |
              El H₄P₂O₅ lleva el fósforo en +3, que no es el más alto —el
              fósforo llega a +5—, y es piro- igual. El estado de oxidación lo
              dice el sufijo, -oso aquí; piro- solo cuenta aguas.
          - texto: 'Di- indica que el ácido tiene dos hidrógenos'
            mensaje: |
              El H₂CrO₄ también tiene dos hidrógenos y es el crómico, sin di-.
              El prefijo cuenta los cromos, que salen de dos anhídridos.

      - tipo: calcular
        titulo: 'El 13: H₄P₂O₅'
        pregunta: |
          Nombra el H₄P₂O₅.
        respuesta:
          tipo: formula
          valor: ácido pirofosforoso | ácido pentaoxodifosfórico(III) | pentaoxodifosfato(III) de hidrógeno | tetrahidrogeno(pentaoxidodifosfato) | ácido difosforoso
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido pirofosfórico
            mensaje: |
              Ese es el H₄P₂O₇, con el fósforo en +5. Aquí hay cinco oxígenos,
              y la cuenta da +3: fosforoso.
          - valor: ácido fosforoso | ácido ortofosforoso
            mensaje: |
              El fósforo está en +3, bien, pero ese es el H₃PO₃, el de tres
              aguas. Dos fósforos y cuatro hidrógenos salen de P₂O₃ + 2 H₂O:
              dos aguas, piro-.
        pista: |
          Hay dos fósforos: reparte la carga entre los dos. Y cuenta las aguas
          que se le suman al P₂O₃.
        desarrollo: |
          $4\times(+1) + 2x + 5\times(-2) = 0$, luego $2x = 6$ y $x = +3$:
          fosforoso. Y P₂O₃ + 2 H₂O da H₄P₂O₅ sin nada que simplificar: dos
          aguas, piro-. **Ácido pirofosforoso**, tal como lo escribe la tabla
          7 de los apuntes de ternarios, la de los polihidratados.

      - tipo: calcular
        titulo: 'El 14: H₂S'
        pregunta: |
          Nombra el H₂S.
        respuesta:
          tipo: formula
          valor: ácido sulfhídrico | sulfuro de hidrógeno | sulfuro de dihidrógeno | sulfano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido sulfúrico
            mensaje: |
              Ese es el H₂SO₄, un oxoácido. El H₂S no lleva oxígeno: es un
              hidrácido, y los hidrácidos terminan en -hídrico.
          - valor: hidruro de azufre
            mensaje: |
              «Hidruro» nombra al hidrógeno cuando actúa con −1, en sus
              compuestos con metales. Aquí el azufre es el más electronegativo
              y actúa con −2, y el hidrógeno con +1: se nombra como sulfuro de
              hidrógeno o, en disolución, ácido sulfhídrico.
        pista: |
          El azufre actúa aquí con −2.
        desarrollo: |
          Dos hidrógenos +1 y un azufre −2. El azufre es del grupo 16, así que
          es un hidrácido: **ácido sulfhídrico** en disolución, o sulfuro de
          hidrógeno.

      - tipo: calcular
        titulo: 'El 15: H₄SiO₄'
        pregunta: |
          Nombra el H₄SiO₄.
        respuesta:
          tipo: formula
          valor: ácido ortosilícico | ácido silícico | ácido (orto)silícico | ácido tetraoxosilícico(IV) | tetraoxosilicato(IV) de hidrógeno | tetrahidrogeno(tetraoxidosilicato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido pirosilícico
            mensaje: |
              Piro- es el de dos aguas en el boro, el fósforo, el arsénico y el
              antimonio. El silicio solo tiene dos peldaños, meta- con una agua
              y orto- con dos, así que SiO₂ + 2 H₂O es el orto-.
          - valor: ácido metasilícico
            mensaje: |
              Ese es el H₂SiO₃, el de una sola agua: SiO₂ + H₂O. Para cuatro
              hidrógenos han hecho falta dos aguas, y eso es orto-.
        pista: |
          El silicio actúa con +4. Cuenta las aguas que se le suman al SiO₂.
        desarrollo: |
          $4\times(+1) + x + 4\times(-2) = 0$, luego $x = +4$. SiO₂ + 2 H₂O
          da H₄SiO₄: dos aguas, que en el silicio es el orto-. **Ácido
          ortosilícico**, o silícico: las diapositivas lo escriben
          «(orto)silícico» porque el prefijo se puede omitir.

      - tipo: calcular
        titulo: 'El 16: HIO₃'
        pregunta: |
          Nombra el HIO₃.
        respuesta:
          tipo: formula
          valor: ácido iódico | ácido yódico | ácido trioxoiódico(V) | ácido trioxoyódico(V) | trioxoiodato(V) de hidrógeno | trioxoyodato(V) de hidrógeno | hidrogeno(trioxidoiodato) | hidrogeno(trioxidoyodato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido periódico | ácido peryódico
            mensaje: |
              Ese es el HIO₄, con el yodo en +7. Con tres oxígenos el yodo está
              en +5: -ico, sin per-.
          - valor: ácido iodoso | ácido yodoso
            mensaje: |
              Ese es el HIO₂, con el yodo en +3. La cuenta con tres oxígenos da
              +5, y +5 es -ico.
          - valor: ácido iodhídrico | ácido yodhídrico
            mensaje: |
              Ese es el HI, sin oxígeno: -hídrico es la terminación de los
              hidrácidos. El HIO₃ es un oxoácido.
        pista: |
          El yodo tiene los mismos estados que el cloro: +1, +3, +5 y +7.
        desarrollo: |
          $(+1) + x + 3\times(-2) = 0$, luego $x = +5$: **ácido iódico**, o
          yódico. Es el mismo caso que el HClO₃, el 6 de esta hoja, con yodo.

      - tipo: calcular
        titulo: 'El 17: H₃PO₃'
        pregunta: |
          Nombra el H₃PO₃.
        respuesta:
          tipo: formula
          valor: ácido fosforoso | ácido ortofosforoso | ácido (orto)fosforoso | ácido trioxofosfórico(III) | trioxofosfato(III) de hidrógeno | trihidrogeno(trioxidofosfato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido fosfórico | ácido ortofosfórico
            mensaje: |
              Ese es el H₃PO₄, con cuatro oxígenos y el fósforo en +5. Con
              tres, el fósforo está en +3: -oso.
          - valor: ácido hipofosforoso
            mensaje: |
              Ese es el H₃PO₂, con el fósforo en +1. Aquí la cuenta da +3, que
              es -oso sin prefijo.
        pista: |
          Tres hidrógenos +1 y tres oxígenos −2.
        desarrollo: |
          $3\times(+1) + x + 3\times(-2) = 0$, luego $x = +3$: fosforoso. Y
          P₂O₃ + 3 H₂O da H₆P₂O₆, que simplificado es H₃PO₃: tres aguas,
          orto-, que se omite. **Ácido fosforoso**, u ortofosforoso. Conviene
          tenerlo al lado del 13: los dos llevan el fósforo en +3, y los
          separa el número de aguas.

      - tipo: calcular
        titulo: 'El 18: HF'
        pregunta: |
          Nombra el HF.
        respuesta:
          tipo: formula
          valor: ácido fluorhídrico | fluoruro de hidrógeno | fluorano
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido fluórico
            mensaje: |
              Un -ico sin -hídrico sería un oxoácido, y el HF no lleva oxígeno.
              Además el flúor solo actúa con −1: no tiene escalera de
              oxoácidos.
          - valor: hidruro de flúor
            mensaje: |
              «Hidruro» nombra al hidrógeno cuando actúa con −1, en sus
              compuestos con metales. Aquí el flúor es el más electronegativo y
              actúa con −1, y el hidrógeno con +1: fluoruro de hidrógeno, o
              ácido fluorhídrico.
        pista: |
          El flúor solo actúa con −1.
        desarrollo: |
          Un hidrógeno +1 y un flúor −1. Es un hidrácido del grupo 17:
          **ácido fluorhídrico** en disolución, o fluoruro de hidrógeno. El
          HF también está en la hoja 1, y la hoja de respuestas del curso lo
          da como «Acido fluorhidrico», sin tildes: coincide.

      - tipo: calcular
        titulo: 'El 19: H₂Cr₂O₇'
        pregunta: |
          Nombra el H₂Cr₂O₇.
        respuesta:
          tipo: formula
          valor: ácido dicrómico | ácido heptaoxodicrómico(VI) | heptaoxodicromato(VI) de hidrógeno | dihidrogeno(heptaoxidodicromato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido crómico
            mensaje: |
              Ese es el H₂CrO₄, con un solo cromo. Aquí hay dos, porque salen
              de dos anhídridos y una sola agua: 2 CrO₃ + H₂O da H₂Cr₂O₇. Por
              eso di-.
          - valor: ácido percrómico
            mensaje: |
              Siete oxígenos no piden per-. Salen de juntar dos CrO₃ con una
              agua, y cada cromo sigue en +6, el más alto que tiene como no
              metal: -ico, con di- por los dos cromos.
        pista: |
          Reparte la carga entre los dos cromos. Como no metal, el cromo tiene
          +3 y +6.
        desarrollo: |
          $2\times(+1) + 2x + 7\times(-2) = 0$, luego $2x = 12$ y $x = +6$:
          crómico. Y 2 CrO₃ + H₂O da H₂Cr₂O₇: dos anhídridos y una agua, un
          isopoliácido. **Ácido dicrómico**, uno de los dos ejemplos de
          isopoliácido de las diapositivas.

      - tipo: calcular
        titulo: 'El 20: H₂B₄O₇'
        pregunta: |
          Nombra el H₂B₄O₇.
        respuesta:
          tipo: formula
          valor: ácido tetrabórico | ácido heptaoxotetrabórico(III) | heptaoxotetraborato(III) de hidrógeno | dihidrogeno(heptaoxidotetraborato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido pirobórico
            mensaje: |
              Piro- sería un anhídrido con dos aguas, B₂O₃ + 2 H₂O, que da
              H₄B₂O₅. Aquí hay cuatro boros y una sola agua para dos
              anhídridos, 2 B₂O₃ + H₂O: es un isopoliácido, y se cuentan los
              boros, tetra-.
          - valor: ácido bórico | ácido ortobórico
            mensaje: |
              Ese es el H₃BO₃, con un solo boro. El boro está en +3, bien,
              pero aquí hay cuatro, y el nombre los cuenta con tetra-.
        pista: |
          Cuatro boros: reparte la carga. ¿Cuántos B₂O₃ y cuántas aguas hacen
          falta?
        desarrollo: |
          $2\times(+1) + 4x + 7\times(-2) = 0$, luego $4x = 12$ y $x = +3$:
          bórico. Y 2 B₂O₃ + H₂O da H₂B₄O₇: dos anhídridos, cuatro boros y
          una agua. **Ácido tetrabórico**, el ácido del bórax y el otro
          ejemplo de isopoliácido de las diapositivas.

      - tipo: calcular
        titulo: 'El 21: H₂SeO₃'
        pregunta: |
          Nombra el H₂SeO₃.
        respuesta:
          tipo: formula
          valor: ácido selenioso | ácido trioxoselénico(IV) | trioxoseleniato(IV) de hidrógeno | trioxoselenato(IV) de hidrógeno | dihidrogeno(trioxidoseleniato) | dihidrogeno(trioxidoselenato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido selénico
            mensaje: |
              Ese es el H₂SeO₄, con el selenio en +6. Con tres oxígenos está en
              +4: -oso.
          - valor: ácido hiposelenioso
            mensaje: |
              Hipo- sería un peldaño por debajo, el +2 del H₂SeO₂ que la hoja
              pide formular en el 16 de la otra columna. Aquí el selenio está
              en +4: -oso, sin prefijo.
        pista: |
          El selenio va como el azufre: el H₂SeO₃ es al selenio lo que el
          H₂SO₃ es al azufre.
        desarrollo: |
          $2\times(+1) + x + 3\times(-2) = 0$, luego $x = +4$. La tabla de
          estados de oxidación de las diapositivas da al selenio +4 y +6, y +4
          es el menor: **ácido selenioso**. Es el mismo molde que el
          sulfuroso, H₂SO₃.

      - tipo: calcular
        titulo: 'El 22: H₂TeO₄'
        pregunta: |
          Nombra el H₂TeO₄.
        respuesta:
          tipo: formula
          valor: ácido telúrico | ácido tetraoxotelúrico(VI) | tetraoxotelurato(VI) de hidrógeno | dihidrogeno(tetraoxidotelurato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido teluroso
            mensaje: |
              Ese es el H₂TeO₃, con el teluro en +4. Con cuatro oxígenos está
              en +6: -ico.
          - valor: ácido telurhídrico
            mensaje: |
              Ese es el H₂Te, sin oxígeno: -hídrico es la terminación de los
              hidrácidos. El H₂TeO₄ lleva cuatro oxígenos, así que es un
              oxoácido, el gemelo del sulfúrico.
        pista: |
          El teluro actúa, como el selenio, con +4 y +6.
        desarrollo: |
          $2\times(+1) + x + 4\times(-2) = 0$, luego $x = +6$: **ácido
          telúrico**. Es el sulfúrico con teluro en vez de azufre: TeO₃ + H₂O
          da H₂TeO₄.

      - tipo: calcular
        titulo: 'El 23: H₄AsO₇, que es H₄As₂O₇'
        pregunta: |
          En la hoja pone H₄AsO₇. Haz la cuenta de cargas con un solo
          arsénico y verás que no cierra. Nombra el H₄As₂O₇, que es la fórmula
          con el subíndice que falta.
        respuesta:
          tipo: formula
          valor: ácido piroarsénico | ácido heptaoxodiarsénico(V) | heptaoxodiarseniato(V) de hidrógeno | heptaoxodiarsenato(V) de hidrógeno | tetrahidrogeno(heptaoxidodiarseniato) | tetrahidrogeno(heptaoxidodiarsenato) | ácido diarsénico
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido perarsénico
            mensaje: |
              Siete oxígenos no piden per-. Con el H₄AsO₇ tal cual, el arsénico
              tendría +10, y no pasa de +5: la fórmula está mal impresa, no
              pide un estado más alto. Con dos arsénicos, cada uno está en +5,
              el más alto que tiene, y eso es -ico.
          - valor: ácido piroarsenioso
            mensaje: |
              Ese es el H₄As₂O₅, con el arsénico en +3. Con siete oxígenos la
              cuenta da +5: arsénico.
          - valor: ácido arsénico | ácido ortoarsénico
            mensaje: |
              Ese es el H₃AsO₄, el de tres aguas y un solo arsénico. Dos
              arsénicos y cuatro hidrógenos salen de As₂O₅ + 2 H₂O: dos aguas,
              piro-.
        pista: |
          Haz la cuenta con un arsénico y luego con dos. El arsénico actúa con
          +3 y +5.
        desarrollo: |
          Tal como está impreso, $4\times(+1) + x + 7\times(-2) = 0$ da
          $x = +10$, y el arsénico no pasa de +5. Con dos arsénicos,
          $4 + 2x - 14 = 0$ y $x = +5$, que sí es suyo: se ha perdido el
          subíndice 2. As₂O₅ + 2 H₂O da H₄As₂O₇: dos aguas, piro-. **Ácido
          piroarsénico**, el gemelo del pirofosfórico H₄P₂O₇.

      - tipo: calcular
        titulo: 'El 24: H₂CO₃'
        pregunta: |
          Nombra el H₂CO₃.
        respuesta:
          tipo: formula
          valor: ácido carbónico | ácido trioxocarbónico(IV) | trioxocarbonato(IV) de hidrógeno | dihidrogeno(trioxidocarbonato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido carbonoso
            mensaje: |
              Ese sería el H₂CO₂, con el carbono en +2. Con tres oxígenos el
              carbono está en +4, el mayor de los dos: -ico.
          - valor: anhídrido carbónico
            mensaje: |
              Ese es el CO₂, sin hidrógenos. El ácido es el anhídrido más una
              molécula de agua: CO₂ + H₂O da H₂CO₃. Mismo apellido, otra
              función.
        pista: |
          El carbono actúa con +2 y +4.
        desarrollo: |
          $2\times(+1) + x + 3\times(-2) = 0$, luego $x = +4$: **ácido
          carbónico**. Viene del anhídrido carbónico: CO₂ + H₂O da H₂CO₃.

      - tipo: calcular
        titulo: 'El 25: H₂CrO₄'
        pregunta: |
          Nombra el H₂CrO₄.
        respuesta:
          tipo: formula
          valor: ácido crómico | ácido tetraoxocrómico(VI) | tetraoxocromato(VI) de hidrógeno | dihidrogeno(tetraoxidocromato)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: ácido dicrómico
            mensaje: |
              Ese es el H₂Cr₂O₇, con dos cromos. Aquí hay uno solo: un
              anhídrido CrO₃ y una agua, sin di-.
          - valor: ácido cromoso
            mensaje: |
              El cromo como no metal tiene +3 y +6, y aquí está en +6, la
              mayor: -ico. El cromoso sería el de +3.
          - valor: hidróxido crómico
            mensaje: |
              Ese es el Cr(OH)₃, con el cromo como metal en +3. Con los
              hidrógenos delante y cuatro oxígenos, el cromo hace de no metal
              y está en +6: ácido crómico.
        pista: |
          Como no metal, el cromo tiene +3 y +6.
        desarrollo: |
          $2\times(+1) + x + 4\times(-2) = 0$, luego $x = +6$: **ácido
          crómico**. CrO₃ + H₂O da H₂CrO₄. Y al lado del 19: el dicrómico
          lleva el mismo cromo en +6, pero dos, de dos anhídridos y una agua.

      - tipo: justificar
        pregunta: Ordena lo que hay que mirar para nombrar un ácido de este bloque. Una pieza es falsa.
        piezas:
          - texto: 'Si no lleva oxígeno es un hidrácido, y se nombra con -hídrico o con -uro de hidrógeno: HF, ácido fluorhídrico; H₂S, sulfuro de hidrógeno.'
          - texto: 'Si lleva oxígeno, se saca el estado del elemento central repartiendo la carga entre todos sus átomos: en el H₄P₂O₅, $4 + 2x - 10 = 0$ y el fósforo está en +3.'
          - texto: 'Luego se mira de dónde sale la fórmula: en B, P, As y Sb, un anhídrido con una, dos o tres aguas es meta-, piro- u orto-; varios anhídridos con una sola agua es di-, tetra-…'
          - texto: 'Si la cuenta da un estado que el elemento no tiene, la fórmula está mal copiada: el H₄AsO₇ de la hoja daría arsénico +10.'
          - texto: 'El silicio sigue la misma escalera que el fósforo: meta- con una agua, piro- con dos y orto- con tres.'
            trampa: true
            mensaje: |
              El silicio solo tiene dos peldaños: meta- con una agua, H₂SiO₃,
              y orto- con dos, H₄SiO₄. Por eso el 15 es ortosilícico y no
              pirosilícico, aunque salga de dos aguas como un piro- del
              fósforo.
        veredicto: |
          En este bloque el estado de oxidación no basta: el H₄P₂O₅ y el
          H₃PO₃ llevan los dos el fósforo en +3, y lo que los separa es el
          número de aguas.
    resolucion: |
      | | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 13 | H₄P₂O₅ | ácido pirofosforoso | pentaoxodifosfato(III) de hidrógeno |
      | 14 | H₂S | ácido sulfhídrico | sulfuro de hidrógeno |
      | 15 | H₄SiO₄ | ácido (orto)silícico | tetraoxosilicato(IV) de hidrógeno |
      | 16 | HIO₃ | ácido iódico | trioxoiodato(V) de hidrógeno |
      | 17 | H₃PO₃ | ácido (orto)fosforoso | trioxofosfato(III) de hidrógeno |
      | 18 | HF | ácido fluorhídrico | fluoruro de hidrógeno |
      | 19 | H₂Cr₂O₇ | ácido dicrómico | heptaoxodicromato(VI) de hidrógeno |
      | 20 | H₂B₄O₇ | ácido tetrabórico | heptaoxotetraborato(III) de hidrógeno |
      | 21 | H₂SeO₃ | ácido selenioso | trioxoseleniato(IV) de hidrógeno |
      | 22 | H₂TeO₄ | ácido telúrico | tetraoxotelurato(VI) de hidrógeno |
      | 23 | H₄As₂O₇ | ácido piroarsénico | heptaoxodiarseniato(V) de hidrógeno |
      | 24 | H₂CO₃ | ácido carbónico | trioxocarbonato(IV) de hidrógeno |
      | 25 | H₂CrO₄ | ácido crómico | tetraoxocromato(VI) de hidrógeno |

      **Lo que se lleva uno del bloque.** Aquí el estado de oxidación ya no
      basta para el nombre: hay que contar también las aguas y los
      anhídridos. El H₄P₂O₅ y el H₃PO₃ tienen el fósforo en +3 y se llaman
      pirofosforoso y fosforoso; el H₂Cr₂O₇ y el H₂CrO₄ tienen el cromo en +6
      y se llaman dicrómico y crómico.

      **La errata del 23.** La hoja imprime H₄AsO₇, que pediría un arsénico
      en +10. Con el subíndice 2 que falta, H₄As₂O₇, el arsénico queda en +5
      y el compuesto es el ácido piroarsénico, que es el que se nombra aquí.

  - id: colfq1-f2-formular-del-1-al-12
    titulo: 'Hoja 2 de formulación: formular del 1 al 12, hidróxidos y oxoácidos'
    fuente: >-
      Ejercicios de formulación-2, formular del 1 al 12 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      La hoja de respuestas del curso, la de 58 compuestos, publica las de los
      cinco hidróxidos, del 1 al 5, y las cinco están bien; las de los ácidos,
      del 6 al 12, son nuestras.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      1. Hidróxido platínico
      2. Hidróxido sódico
      3. Hidróxido crómico
      4. Hidróxido cúprico
      5. Hidróxido niqueloso
      6. Ácido perclórico
      7. Ácido nítrico
      8. Ácido metabórico
      9. Ácido mangánico
      10. Ácido piroarsenioso
      11. Ácido periódico
      12. Ácido sulfuroso
    pide: La fórmula de los doce compuestos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hidróxido platínico, crómico y cúprico: los tres terminan en -ico.
          ¿Llevan el mismo número de grupos OH?
        opciones:
          - texto: 'No: -ico es la mayor valencia de cada metal, y cada uno tiene las suyas'
            correcta: true
            mensaje: |
              Eso es. Platínico es +4, porque el platino tiene +2 y +4;
              crómico es +3, porque el cromo como metal tiene +2 y +3; y
              cúprico es +2, porque el cobre tiene +1 y +2. Tres -ico, y tres
              números distintos de OH.
          - texto: 'Sí, tres: -ico quiere decir valencia 3'
            mensaje: |
              Vale para el hierro y para el cromo, y falla con los otros dos.
              El platino llega a +4 y el cobre solo a +2: Pt(OH)₄ y Cu(OH)₂.
          - texto: 'Sí, dos: los hidróxidos llevan siempre (OH)₂'
            mensaje: |
              El (OH)₂ es de los metales con +2, como el calcio o el cobre
              cúprico. El NaOH lleva uno y el Pt(OH)₄ cuatro: hay tantos OH
              como carga tiene el metal.
          - texto: 'Depende del ácido del que venga el hidróxido'
            mensaje: |
              Un hidróxido no viene de ningún ácido: es un metal con grupos
              OH⁻. Lo único que hace falta es la carga del metal, y esa la
              dice el sufijo.

      - tipo: calcular
        titulo: 'El 1: hidróxido platínico'
        pregunta: |
          Escribe la fórmula del hidróxido platínico.
        respuesta:
          tipo: formula
          valor: Pt(OH)4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Pt(OH)2
            mensaje: |
              Ese es el hidróxido platinoso, con el platino en +2. Platínico es
              la mayor de sus dos valencias, +2 y +4: hacen falta cuatro OH.
          - valor: Pt(OH)3
            mensaje: |
              El 3 sale de leer -ico como «valencia 3», que solo vale para
              metales como el hierro. El sufijo es relativo: el platino tiene
              +2 y +4, así que platínico es +4.
          - valor: PtOH4
            mensaje: |
              Sin el paréntesis, el 4 solo afecta al hidrógeno: eso dice un
              oxígeno y cuatro hidrógenos. Para que multiplique al grupo
              entero hay que escribir Pt(OH)₄.
        pista: |
          El platino tiene +2 y +4.
        desarrollo: |
          Platínico es el platino con su valencia mayor, +4, y cada OH⁻
          aporta −1: hacen falta cuatro. $(+4) + 4\times(-1) = 0$, así que
          **Pt(OH)₄**. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 2: hidróxido sódico'
        pregunta: |
          Escribe la fórmula del hidróxido sódico.
        respuesta:
          tipo: formula
          valor: NaOH | Na(OH)
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Na(OH)2
            mensaje: |
              El sodio solo actúa con +1, así que le basta un OH. El 2 es el
              del calcio, Ca(OH)₂, o el de cualquier metal con +2.
          - valor: Na2O
            mensaje: |
              Ese es el óxido de sodio. Un hidróxido lleva el grupo OH, el
              oxígeno con su hidrógeno: NaOH.
        pista: |
          El sodio actúa solo con +1.
        desarrollo: |
          $(+1) + (-1) = 0$: un OH por cada sodio. **NaOH**, sin paréntesis,
          porque el grupo va una sola vez; escrito Na(OH) también vale. Es la
          de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 3: hidróxido crómico'
        pregunta: |
          Escribe la fórmula del hidróxido crómico.
        respuesta:
          tipo: formula
          valor: Cr(OH)3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Cr(OH)2
            mensaje: |
              Ese es el hidróxido cromoso, con el cromo en +2. Como metal, el
              cromo tiene +2 y +3, y crómico es la mayor.
          - valor: Cr(OH)6
            mensaje: |
              El +6 es el del cromo como no metal, el del ácido crómico H₂CrO₄.
              En un hidróxido el cromo es un metal, con +2 y +3, y crómico es
              +3.
          - valor: CrOH3
            mensaje: |
              Sin el paréntesis, el 3 solo multiplica al hidrógeno. Hace falta
              Cr(OH)₃ para que sean tres grupos OH.
        pista: |
          Como metal, el cromo actúa con +2 y +3.
        desarrollo: |
          En un hidróxido el cromo hace de metal, con +2 y +3, y crómico es
          +3. Tres OH⁻: **Cr(OH)₃**. Es la de la hoja de respuestas, y el
          ejemplo de las diapositivas.

      - tipo: calcular
        titulo: 'El 4: hidróxido cúprico'
        pregunta: |
          Escribe la fórmula del hidróxido cúprico.
        respuesta:
          tipo: formula
          valor: Cu(OH)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: CuOH | Cu(OH)
            mensaje: |
              Ese es el hidróxido cuproso, con el cobre en +1. El cobre tiene
              +1 y +2, y cúprico es +2: dos OH.
          - valor: Cu(OH)3
            mensaje: |
              El 3 sale de leer -ico como «valencia 3». El cobre solo llega a
              +2, así que cúprico es +2.
          - valor: CuOH2
            mensaje: |
              Sin el paréntesis, el 2 solo afecta al hidrógeno. Para dos grupos
              OH se escribe Cu(OH)₂.
        pista: |
          El cobre tiene +1 y +2.
        desarrollo: |
          Cúprico es el cobre en +2, la mayor de sus dos valencias:
          $(+2) + 2\times(-1) = 0$, así que **Cu(OH)₂**. Es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 5: hidróxido niqueloso'
        pregunta: |
          Escribe la fórmula del hidróxido niqueloso.
        respuesta:
          tipo: formula
          valor: Ni(OH)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Ni(OH)3
            mensaje: |
              Ese es el hidróxido niquélico, con el níquel en +3. Niqueloso
              pide la menor de sus dos valencias, +2.
          - valor: NiOH | Ni(OH)
            mensaje: |
              Un solo OH sería níquel +1, y el níquel no tiene ese estado. -oso
              no quiere decir «1»: es la menor de las suyas, y en el níquel es
              +2.
          - valor: NiOH2
            mensaje: |
              Sin el paréntesis, el 2 solo multiplica al hidrógeno. Se escribe
              Ni(OH)₂.
        pista: |
          El níquel tiene +2 y +3.
        desarrollo: |
          Niqueloso es el níquel en +2, la menor de sus dos valencias: dos
          OH⁻, **Ni(OH)₂**. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 6: ácido perclórico'
        pregunta: |
          Escribe la fórmula del ácido perclórico.
        respuesta:
          tipo: formula
          valor: HClO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HClO3
            mensaje: |
              Ese es el ácido clórico, con el cloro en +5. Per-…-ico es el +7:
              hacen falta cuatro oxígenos.
          - valor: HClO
            mensaje: |
              Ese es el hipocloroso, el del +1. Per- e hipo- son los dos
              extremos de la escalera: per- el de arriba, +7, e hipo- el de
              abajo.
          - valor: H2Cl2O8
            mensaje: |
              El anhídrido y el agua están bien, Cl₂O₇ + H₂O, pero falta
              simplificar: H₂Cl₂O₈ se divide entre dos y queda HClO₄.
        pista: |
          Per-…-ico es el +7 del cloro. Empieza por el anhídrido, Cl₂O₇.
        desarrollo: |
          Cloro +7: anhídrido perclórico, Cl₂O₇. Con una agua,
          Cl₂O₇ + H₂O da H₂Cl₂O₈, que simplificado es **HClO₄**.
          Comprobación: $(+1) + (+7) + 4\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 7: ácido nítrico'
        pregunta: |
          Escribe la fórmula del ácido nítrico.
        respuesta:
          tipo: formula
          valor: HNO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HNO2
            mensaje: |
              Ese es el ácido nitroso, con el nitrógeno en +3. Nítrico es +5:
              tres oxígenos.
          - valor: H2N2O6
            mensaje: |
              Es lo que da N₂O₅ + H₂O, y falta el último paso: dividir entre
              dos. Queda HNO₃.
        pista: |
          Nítrico es el nitrógeno en +5: el anhídrido es N₂O₅.
        desarrollo: |
          N₂O₅ + H₂O da H₂N₂O₆, que simplificado es **HNO₃**. Comprobación:
          $(+1) + (+5) + 3\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 8: ácido metabórico'
        pregunta: |
          Escribe la fórmula del ácido metabórico.
        respuesta:
          tipo: formula
          valor: HBO2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H3BO3
            mensaje: |
              Ese es el ácido bórico, u ortobórico: tres aguas. Meta- es una
              sola, B₂O₃ + H₂O.
          - valor: H4B2O5
            mensaje: |
              Ese es el pirobórico, el de dos aguas. Meta- es el de una.
          - valor: H2B2O4
            mensaje: |
              Es el anhídrido con una agua, bien, pero sin simplificar: H₂B₂O₄
              se divide entre dos y queda HBO₂.
        pista: |
          Meta- es el anhídrido con una sola molécula de agua. El boro actúa
          con +3: B₂O₃.
        desarrollo: |
          B₂O₃ + H₂O da H₂B₂O₄, que simplificado es **HBO₂**. Comprobación:
          $(+1) + (+3) + 2\times(-2) = 0$. Es el ejemplo de las diapositivas.

      - tipo: calcular
        titulo: 'El 9: ácido mangánico'
        pregunta: |
          Escribe la fórmula del ácido mangánico.
        respuesta:
          tipo: formula
          valor: H2MnO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HMnO4
            mensaje: |
              Ese es el permangánico, con el manganeso en +7. Mangánico es +6,
              y con los mismos cuatro oxígenos lleva dos hidrógenos.
          - valor: HMnO2
            mensaje: |
              Has usado el +3, que es el mangánico del manganeso como metal
              (Mn₂O₃, óxido mangánico); la tabla 6 de los apuntes de
              ternarios lleva esa misma errata en el anhídrido. En los ácidos
              el manganeso hace de no metal, con +4, +6 y +7, y mangánico es
              +6.
          - valor: H2MnO3
            mensaje: |
              Ese es el manganoso, con el manganeso en +4. Mangánico es +6, y
              su anhídrido es MnO₃.
        pista: |
          Como no metal, el manganeso actúa con +4, +6 y +7.
        desarrollo: |
          Manganeso +6: MnO₃ + H₂O da **H₂MnO₄**. Comprobación:
          $2\times(+1) + (+6) + 4\times(-2) = 0$. Ojo con la tabla 6 de los
          apuntes de ternarios: escribe «Mn₂O₃, anh. mangánico», y con +6 el
          anhídrido es MnO₃, como ponen los apuntes de binarios en su tabla 4.

      - tipo: calcular
        titulo: 'El 10: ácido piroarsenioso'
        pregunta: |
          Escribe la fórmula del ácido piroarsenioso.
        respuesta:
          tipo: formula
          valor: H4As2O5
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H4As2O7
            mensaje: |
              Ese es el piroarsénico, con el arsénico en +5. Arsenioso es el
              +3, y su anhídrido es As₂O₃.
          - valor: H3AsO3
            mensaje: |
              Ese es el (orto)arsenioso, el de tres aguas. Piro- son dos:
              As₂O₃ + 2 H₂O.
        pista: |
          Arsenioso es el arsénico en +3, y piro- son dos aguas.
        desarrollo: |
          As₂O₃ + 2 H₂O da **H₄As₂O₅**, sin nada que simplificar.
          Comprobación: $4\times(+1) + 2\times(+3) + 5\times(-2) = 0$. Es el
          pirofosforoso, H₄P₂O₅, con arsénico.

      - tipo: calcular
        titulo: 'El 11: ácido periódico'
        pregunta: |
          Escribe la fórmula del ácido periódico.
        respuesta:
          tipo: formula
          valor: HIO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HIO3
            mensaje: |
              Ese es el iódico, con el yodo en +5. Per-…-ico es el +7: cuatro
              oxígenos.
          - valor: H2I2O8
            mensaje: |
              Es I₂O₇ + H₂O sin simplificar. Dividido entre dos queda HIO₄.
        pista: |
          Per-…-ico es el +7 del yodo: el anhídrido es I₂O₇.
        desarrollo: |
          I₂O₇ + H₂O da H₂I₂O₈, que simplificado es **HIO₄**. Es el
          perclórico con yodo.

      - tipo: calcular
        titulo: 'El 12: ácido sulfuroso'
        pregunta: |
          Escribe la fórmula del ácido sulfuroso.
        respuesta:
          tipo: formula
          valor: H2SO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H2SO4
            mensaje: |
              Ese es el sulfúrico, con el azufre en +6. Sulfuroso es +4, y su
              anhídrido es SO₂.
          - valor: HSO3
            mensaje: |
              SO₂ + H₂O da H₂SO₃, y ahí no hay nada que simplificar: se quedan
              los dos hidrógenos del agua. Un solo hidrógeno sale de copiar el
              molde del HNO₃.
        pista: |
          Sulfuroso es el azufre en +4.
        desarrollo: |
          SO₂ + H₂O da **H₂SO₃**. Comprobación:
          $2\times(+1) + (+4) + 3\times(-2) = 0$.

      - tipo: justificar
        pregunta: Ordena el método para formular los ácidos de la lista. Una pieza es falsa.
        piezas:
          - texto: 'El prefijo y el sufijo dan el estado de oxidación: perclórico es cloro +7; mangánico, manganeso +6.'
          - texto: 'Con ese estado se escribe el anhídrido, cruzándolo con el oxígeno: Cl₂O₇, MnO₃.'
          - texto: 'Se le suma una molécula de agua, o las que digan meta-, piro- u orto-, y se juntan los átomos: Cl₂O₇ + H₂O da H₂Cl₂O₈.'
          - texto: 'Si todos los subíndices tienen un divisor común, se simplifica: H₂Cl₂O₈ queda HClO₄.'
          - texto: '«Crómico» es siempre cromo +3, así que el hidróxido crómico y el ácido crómico llevan el cromo en el mismo estado.'
            trampa: true
            mensaje: |
              El cromo tiene dos escaleras: como metal, +2 y +3, cromoso y
              crómico; como no metal, +3 y +6. En el hidróxido crómico,
              Cr(OH)₃, está en +3, y en el ácido crómico, H₂CrO₄, en +6. Con el
              manganeso pasa lo mismo: el óxido mangánico es Mn₂O₃, con +3, y
              el ácido mangánico H₂MnO₄, con +6.
        veredicto: |
          Estado de oxidación, anhídrido, agua y simplificar. El último paso
          es el que más se olvida, y el primero el que más se equivoca cuando
          el elemento tiene dos escaleras, como el cromo y el manganeso.
    resolucion: |
      | | nombre de la hoja | fórmula | Stock o sistemática |
      |---|---|---|---|
      | 1 | hidróxido platínico | Pt(OH)₄ | hidróxido de platino(IV) |
      | 2 | hidróxido sódico | NaOH | hidróxido de sodio |
      | 3 | hidróxido crómico | Cr(OH)₃ | hidróxido de cromo(III) |
      | 4 | hidróxido cúprico | Cu(OH)₂ | hidróxido de cobre(II) |
      | 5 | hidróxido niqueloso | Ni(OH)₂ | hidróxido de níquel(II) |
      | 6 | ácido perclórico | HClO₄ | tetraoxoclorato(VII) de hidrógeno |
      | 7 | ácido nítrico | HNO₃ | trioxonitrato(V) de hidrógeno |
      | 8 | ácido metabórico | HBO₂ | dioxoborato(III) de hidrógeno |
      | 9 | ácido mangánico | H₂MnO₄ | tetraoxomanganato(VI) de hidrógeno |
      | 10 | ácido piroarsenioso | H₄As₂O₅ | pentaoxodiarseniato(III) de hidrógeno |
      | 11 | ácido periódico | HIO₄ | tetraoxoiodato(VII) de hidrógeno |
      | 12 | ácido sulfuroso | H₂SO₃ | trioxosulfato(IV) de hidrógeno |

      **Lo que se lleva uno del bloque.** En un hidróxido hay tantos OH como
      carga tiene el metal, y el sufijo dice cuál es esa carga **en ese
      metal**: -ico es +4 en el platino, +3 en el cromo y +2 en el cobre. En
      un ácido, el sufijo da el estado, el estado da el anhídrido, y el
      anhídrido más agua da la fórmula, que se simplifica al final.

      **Las respuestas oficiales.** La hoja de respuestas del curso trae los
      cinco hidróxidos, y los cinco coinciden con los de aquí. Los ácidos no
      los trae.

  - id: colfq1-f2-formular-del-13-al-25
    titulo: 'Hoja 2 de formulación: formular del 13 al 25, oxoácidos e hidrácidos'
    fuente: >-
      Ejercicios de formulación-2, formular del 13 al 25 · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El material no publica las respuestas de este bloque: son
      nuestras. El 22 repite el 10, «ácido piroarsenioso», tal como está en la
      hoja.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      13. Ácido hipocloroso
      14. Ácido fosforoso
      15. Ácido arsénico
      16. Ácido hiposelenioso
      17. Ácido permangánico
      18. Ácido pirofosfórico
      19. Ácido hipobromoso
      20. Ácido iódico
      21. Ácido metasilícico
      22. Ácido piroarsenioso
      23. Ácido telúrico
      24. Ácido clorhídrico
      25. Ácido selenhídrico

      *El 22 repite el 10 de esta misma columna tal como está en la hoja: los
      dos piden el ácido piroarsenioso. Aquí se resuelve lo que dice.*
    pide: La fórmula de los trece compuestos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Ácido fosforoso, ácido arsénico: el nombre no lleva prefijo. ¿Cuántas
          moléculas de agua se le suman al anhídrido?
        opciones:
          - texto: 'Tres, porque en el fósforo y el arsénico un nombre sin prefijo es el orto-, que se omite'
            correcta: true
            mensaje: |
              Eso es, y es la trampa de este bloque. En el cloro o el
              nitrógeno, anhídrido más agua es siempre una agua. En B, P, As y
              Sb hay tres peldaños —meta-, piro- y orto-— y el nombre a secas
              es el orto-: P₂O₃ + 3 H₂O da H₃PO₃.
          - texto: 'Una, como en cualquier oxoácido'
            mensaje: |
              Una agua da el meta-: P₂O₃ + H₂O da HPO₂, el ácido
              metafosforoso. En el fósforo y el arsénico hay que decir meta-
              para que sea una; sin prefijo son tres.
          - texto: 'Dos, porque piro- es el ácido normal y se sobrentiende'
            mensaje: |
              Piro- son dos aguas, y no se sobrentiende nunca: se escribe, como
              en el 18, pirofosfórico. El que se calla es el orto-.
          - texto: 'Depende del sufijo: -oso lleva una agua e -ico lleva tres'
            mensaje: |
              El número de aguas lo dice el prefijo, no el sufijo. Fosforoso y
              fosfórico son los dos orto-, de tres aguas: H₃PO₃ y H₃PO₄.

      - tipo: calcular
        titulo: 'El 13: ácido hipocloroso'
        pregunta: |
          Escribe la fórmula del ácido hipocloroso.
        respuesta:
          tipo: formula
          valor: HClO | HOCl
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HClO2
            mensaje: |
              Ese es el cloroso, con el cloro en +3. Hipo-…-oso es el +1: un
              solo oxígeno.
          - valor: HClO4
            mensaje: |
              Ese es el perclórico, el del +7. Hipo- es el extremo de abajo de
              la escalera, el +1.
          - valor: H2Cl2O2
            mensaje: |
              Es Cl₂O + H₂O sin simplificar. Dividido entre dos queda HClO.
        pista: |
          Hipo-…-oso es el +1 del cloro: el anhídrido es Cl₂O.
        desarrollo: |
          Cl₂O + H₂O da H₂Cl₂O₂, que simplificado es **HClO**. Comprobación:
          $(+1) + (+1) + (-2) = 0$.

      - tipo: calcular
        titulo: 'El 14: ácido fosforoso'
        pregunta: |
          Escribe la fórmula del ácido fosforoso.
        respuesta:
          tipo: formula
          valor: H3PO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HPO2
            mensaje: |
              Ese es el metafosforoso: el anhídrido con una sola agua. En el
              fósforo, un nombre sin prefijo es el orto-, el de tres aguas.
          - valor: H3PO4
            mensaje: |
              Ese es el fosfórico, con el fósforo en +5. Fosforoso es +3.
        pista: |
          Fosforoso es el fósforo en +3. Sin prefijo, en el fósforo se
          sobrentiende orto-: tres aguas.
        desarrollo: |
          P₂O₃ + 3 H₂O da H₆P₂O₆, que simplificado es **H₃PO₃**. El orto- se
          omite, y por eso «fosforoso» a secas son tres aguas y no una.

      - tipo: calcular
        titulo: 'El 15: ácido arsénico'
        pregunta: |
          Escribe la fórmula del ácido arsénico.
        respuesta:
          tipo: formula
          valor: H3AsO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HAsO3
            mensaje: |
              Ese es el metaarsénico, con una sola agua. En el arsénico, un
              nombre sin prefijo es el orto-: tres aguas.
          - valor: H3AsO3
            mensaje: |
              Ese es el arsenioso, con el arsénico en +3. Arsénico es +5.
          - valor: H4As2O7
            mensaje: |
              Ese es el piroarsénico, de dos aguas. Sin prefijo es orto-, el de
              tres.
        pista: |
          Arsénico es el arsénico en +5, y sin prefijo es orto-: tres aguas.
        desarrollo: |
          As₂O₅ + 3 H₂O da H₆As₂O₈, que simplificado es **H₃AsO₄**. Es el
          fosfórico con arsénico.

      - tipo: calcular
        titulo: 'El 16: ácido hiposelenioso'
        pregunta: |
          Escribe la fórmula del ácido hiposelenioso.
        respuesta:
          tipo: formula
          valor: H2SeO2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H2SeO3
            mensaje: |
              Ese es el selenioso, con el selenio en +4. Hipo- baja un peldaño
              más, al +2: dos oxígenos.
          - valor: HSeO
            mensaje: |
              Es el molde del hipocloroso, HClO, y aquí no vale: el cloro se
              queda con un hidrógeno porque H₂Cl₂O₂ se simplifica a la mitad.
              SeO + H₂O da H₂SeO₂, y ahí no hay nada que dividir.
        pista: |
          Hipo-…-oso es el estado más bajo. En el azufre es el +2, el del
          ácido hiposulfuroso H₂SO₂ de los apuntes de ternarios, y el selenio
          se formula igual.
        desarrollo: |
          La tabla de estados de oxidación de las diapositivas da al selenio
          solo +4 y +6, y con dos estados no habría hipo-. La hoja lo pide
          igual, y el nombre solo tiene sentido con un +2 como el del azufre,
          que los apuntes de ternarios sí traen: ácido hiposulfuroso, H₂SO₂.
          Por el mismo camino, SeO + H₂O da **H₂SeO₂**, sin nada que
          simplificar.

      - tipo: calcular
        titulo: 'El 17: ácido permangánico'
        pregunta: |
          Escribe la fórmula del ácido permangánico.
        respuesta:
          tipo: formula
          valor: HMnO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H2MnO4
            mensaje: |
              Ese es el mangánico, con el manganeso en +6. Per-…-ico es +7: con
              los mismos cuatro oxígenos, un solo hidrógeno.
          - valor: H2Mn2O8
            mensaje: |
              Es Mn₂O₇ + H₂O sin simplificar. Dividido entre dos queda HMnO₄.
        pista: |
          Per-…-ico es el +7 del manganeso: el anhídrido es Mn₂O₇.
        desarrollo: |
          Mn₂O₇ + H₂O da H₂Mn₂O₈, que simplificado es **HMnO₄**.
          Comprobación: $(+1) + (+7) + 4\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 18: ácido pirofosfórico'
        pregunta: |
          Escribe la fórmula del ácido pirofosfórico.
        respuesta:
          tipo: formula
          valor: H4P2O7
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H4P2O5
            mensaje: |
              Ese es el pirofosforoso, con el fósforo en +3. Fosfórico es el
              +5, y su anhídrido es P₂O₅.
          - valor: H3PO4
            mensaje: |
              Ese es el (orto)fosfórico, de tres aguas. Piro- son dos:
              P₂O₅ + 2 H₂O.
        pista: |
          Piro- son dos aguas, y fosfórico es el fósforo en +5.
        desarrollo: |
          P₂O₅ + 2 H₂O da **H₄P₂O₇**, y no se simplifica: los subíndices no
          tienen divisor común. Es la fórmula de las diapositivas.

      - tipo: calcular
        titulo: 'El 19: ácido hipobromoso'
        pregunta: |
          Escribe la fórmula del ácido hipobromoso.
        respuesta:
          tipo: formula
          valor: HBrO | HOBr
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HBrO2
            mensaje: |
              Ese es el bromoso, el +3. Hipo- baja al +1: un oxígeno.
          - valor: HBrO4
            mensaje: |
              Ese es el perbrómico, el +7: per- e hipo- están en los dos
              extremos de la escalera, y hipo- es el de abajo.
        pista: |
          Hipo-…-oso es el +1 del bromo, como en el hipocloroso.
        desarrollo: |
          Br₂O + H₂O da H₂Br₂O₂, que simplificado es **HBrO**. El mismo molde
          que el hipocloroso del 13.

      - tipo: calcular
        titulo: 'El 20: ácido iódico'
        pregunta: |
          Escribe la fórmula del ácido iódico.
        respuesta:
          tipo: formula
          valor: HIO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HIO4
            mensaje: |
              Ese es el periódico, el +7. Iódico, sin per-, es +5: tres
              oxígenos.
          - valor: HI
            mensaje: |
              Ese es el ácido iodhídrico, sin oxígeno. Iódico e iodhídrico se
              parecen de oído y son dos familias distintas: -ico es un
              oxoácido, y -hídrico no lleva oxígeno.
        pista: |
          Iódico, o yódico, es el yodo en +5.
        desarrollo: |
          I₂O₅ + H₂O da H₂I₂O₆, que simplificado es **HIO₃**. Comprobación:
          $(+1) + (+5) + 3\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 21: ácido metasilícico'
        pregunta: |
          Escribe la fórmula del ácido metasilícico.
        respuesta:
          tipo: formula
          valor: H2SiO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H4SiO4
            mensaje: |
              Ese es el ortosilícico, el de dos aguas. Meta- es una sola:
              SiO₂ + H₂O.
          - valor: H2SiO4
            mensaje: |
              Con cuatro oxígenos y dos hidrógenos el silicio tendría +6, y no
              pasa de +4. Es el molde del sulfúrico, que no vale para el
              silicio.
        pista: |
          Meta- es el anhídrido con una sola agua. El silicio actúa con +4, y
          su anhídrido es SiO₂.
        desarrollo: |
          SiO₂ + H₂O da **H₂SiO₃**, sin nada que simplificar. Comprobación:
          $2\times(+1) + (+4) + 3\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 22: ácido piroarsenioso, otra vez'
        pregunta: |
          El 22 repite el 10: la hoja vuelve a pedir el ácido piroarsenioso.
          Escribe su fórmula.
        respuesta:
          tipo: formula
          valor: H4As2O5
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H4As2O7
            mensaje: |
              Ese es el piroarsénico, con el arsénico en +5. Arsenioso es el +3.
          - valor: HAsO2
            mensaje: |
              Ese es el metaarsenioso, con una sola agua. Piro- son dos:
              As₂O₃ + 2 H₂O.
        pista: |
          Es el mismo compuesto que el 10: arsénico +3 y dos aguas.
        desarrollo: |
          Es el mismo que el 10, repetido en la hoja tal cual:
          As₂O₃ + 2 H₂O da **H₄As₂O₅**. No se sabe qué compuesto quería poner
          la hoja en este sitio, así que aquí se resuelve lo que dice.

      - tipo: calcular
        titulo: 'El 23: ácido telúrico'
        pregunta: |
          Escribe la fórmula del ácido telúrico.
        respuesta:
          tipo: formula
          valor: H2TeO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: H2TeO3
            mensaje: |
              Ese es el teluroso, con el teluro en +4. Telúrico es +6, y su
              anhídrido es TeO₃.
          - valor: H2Te
            mensaje: |
              Ese es el ácido telurhídrico, sin oxígeno. Telúrico es un
              oxoácido: anhídrido más agua.
        pista: |
          Telúrico es el teluro en +6, como el azufre del sulfúrico.
        desarrollo: |
          TeO₃ + H₂O da **H₂TeO₄**. Comprobación:
          $2\times(+1) + (+6) + 4\times(-2) = 0$.

      - tipo: calcular
        titulo: 'El 24: ácido clorhídrico'
        pregunta: |
          Escribe la fórmula del ácido clorhídrico.
        respuesta:
          tipo: formula
          valor: HCl
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HClO3
            mensaje: |
              Ese es el ácido clórico. -hídrico no es -ico: es la terminación
              de los ácidos sin oxígeno, el hidrógeno y el cloro solos.
          - valor: HClO
            mensaje: |
              Ese es el hipocloroso, un oxoácido. El clorhídrico no lleva
              oxígeno.
        pista: |
          -hídrico quiere decir hidrógeno y no metal, sin oxígeno. El cloro
          actúa con −1.
        desarrollo: |
          Hidrógeno +1 y cloro −1: **HCl**. En disolución es el ácido
          clorhídrico; como gas, cloruro de hidrógeno.

      - tipo: calcular
        titulo: 'El 25: ácido selenhídrico'
        pregunta: |
          Escribe la fórmula del ácido selenhídrico.
        respuesta:
          tipo: formula
          valor: H2Se
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HSe
            mensaje: |
              El selenio actúa aquí con −2, así que hacen falta dos hidrógenos:
              H₂Se, como el H₂S.
          - valor: H2SeO4
            mensaje: |
              Ese es el selénico, un oxoácido. -hídrico es sin oxígeno.
        pista: |
          El selenio actúa con −2, como el azufre en el H₂S.
        desarrollo: |
          Dos hidrógenos +1 y un selenio −2: **H₂Se**. Es el sulfhídrico con
          selenio.

      - tipo: justificar
        pregunta: Ordena cómo se formulan los ácidos de este bloque. Una pieza es falsa.
        piezas:
          - texto: 'Si el nombre termina en -hídrico no hay anhídrido ni agua: hidrógeno y no metal con su carga negativa, HCl o H₂Se.'
          - texto: 'Si es un oxoácido, el prefijo y el sufijo dan el estado del elemento central: hipocloroso es cloro +1, y arsénico es arsénico +5.'
          - texto: 'En B, P, As y Sb, un nombre sin prefijo es el orto-, con tres aguas: el ácido fosforoso es P₂O₃ + 3 H₂O, H₃PO₃.'
          - texto: 'Al final se simplifica si se puede, y solo entonces: Cl₂O + H₂O da H₂Cl₂O₂, que queda HClO.'
          - texto: 'Un ácido hipo-…-oso lleva siempre un hidrógeno y un oxígeno, como el HClO.'
            trampa: true
            mensaje: |
              El HClO sale así porque Cl₂O + H₂O se simplifica a la mitad. El
              hiposelenioso sale de SeO + H₂O, que da H₂SeO₂ y no se
              simplifica: dos hidrógenos y dos oxígenos. Lo que fija la
              fórmula es el anhídrido, no el prefijo.
        veredicto: |
          El prefijo y el sufijo dan el estado; el anhídrido y las aguas dan
          la fórmula. Ninguna fórmula se copia de otra del mismo prefijo.
    resolucion: |
      | | nombre de la hoja | fórmula | Stock o sistemática |
      |---|---|---|---|
      | 13 | ácido hipocloroso | HClO | oxoclorato(I) de hidrógeno |
      | 14 | ácido fosforoso | H₃PO₃ | trioxofosfato(III) de hidrógeno |
      | 15 | ácido arsénico | H₃AsO₄ | tetraoxoarseniato(V) de hidrógeno |
      | 16 | ácido hiposelenioso | H₂SeO₂ | dioxoseleniato(II) de hidrógeno |
      | 17 | ácido permangánico | HMnO₄ | tetraoxomanganato(VII) de hidrógeno |
      | 18 | ácido pirofosfórico | H₄P₂O₇ | heptaoxodifosfato(V) de hidrógeno |
      | 19 | ácido hipobromoso | HBrO | oxobromato(I) de hidrógeno |
      | 20 | ácido iódico | HIO₃ | trioxoiodato(V) de hidrógeno |
      | 21 | ácido metasilícico | H₂SiO₃ | trioxosilicato(IV) de hidrógeno |
      | 22 | ácido piroarsenioso | H₄As₂O₅ | pentaoxodiarseniato(III) de hidrógeno |
      | 23 | ácido telúrico | H₂TeO₄ | tetraoxotelurato(VI) de hidrógeno |
      | 24 | ácido clorhídrico | HCl | cloruro de hidrógeno |
      | 25 | ácido selenhídrico | H₂Se | seleniuro de hidrógeno |

      **Lo que se lleva uno del bloque.** En el fósforo y el arsénico, un
      nombre sin prefijo es el orto-, de tres aguas, y en el silicio el meta-
      es una agua y el orto- dos. Ninguna fórmula se copia de otra del mismo
      prefijo: el hipocloroso tiene un hidrógeno y el hiposelenioso dos.

      **Dos cosas de la hoja.** El 22 repite el 10, y aquí se resuelve lo que
      pone. Y el 16 pide un ácido hiposelenioso aunque la tabla de estados de
      oxidación de las diapositivas da al selenio solo +4 y +6: se formula con
      el +2 del azufre, como el hiposulfuroso H₂SO₂ de los apuntes de
      ternarios.

  # ── La hoja 3 de formulación entera, en cuatro bloques consecutivos: nombrar
  #    del 1 al 12 y del 13 al 25, y formular del 1 al 12 y del 13 al 25.
  #    Oxisales, sales binarias y sales ácidas. Las 50 respuestas oficiales
  #    están comprobadas una a una; las dos erratas químicas (RaMnO₄ y
  #    CdH2(PO4)2) entran como distractor con su mensaje, y las de imprenta
  #    se dicen en la `fuente` y en el desarrollo. Cada bloque lleva un
  #    `reconocer` porque el esquema lo exige a todo ejercicio (§04).
  - id: colfq1-f3-nombrar-del-1-al-12
    titulo: 'Hoja 3 de formulación: nombrar del 1 al 12, sales binarias y oxisales'
    fuente: >-
      Ejercicios de formulación-3, nombrar del 1 al 12 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La
      hoja de respuestas del material publica las doce, y coinciden con las
      nuestras salvo por una errata de imprenta: en el 11 escribe «nitrito
      cobáltio» por cobáltico. Los distractores y el diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      1. Al Cl₃
      2. SrI₂
      3. NH₄NO₃
      4. ZnSO₄
      5. K₂Cr₂O₇
      6. AuPO₄
      7. Li₂SeO₃
      8. Pb₃(PO₃)₂
      9. CuSO₃
      10. KBrO₃
      11. Co(NO₂)₃
      12. CsClO₄
    pide: El nombre de los doce compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de nombrar la sal de un metal con dos cargas posibles hay que
          elegir entre -oso e -ico. En el FeSO₄, ¿de dónde sale si el hierro
          es ferroso o férrico?
        opciones:
          - texto: >-
              De la carga del anión: el sulfato es SO₄²⁻, así que el único
              hierro tiene que poner +2, y es ferroso
            correcta: true
            mensaje: |
              Eso es. El anión trae su carga, la del ácido del que viene, y el
              metal pone la que falta para llegar a cero. Por eso se empieza
              siempre por el anión, y el sufijo del metal es lo último que se
              decide.
          - texto: >-
              De su subíndice: lleva un 1, así que actúa con carga 1
            mensaje: |
              El subíndice de un ion es la carga **del otro**, no la suya: en
              el Pb₃(PO₃)₂ el 3 del plomo viene del fosfito, que es 3−. Además,
              el hierro no tiene carga 1: sus dos estados son +2 y +3.
          - texto: >-
              Se pone -ico, que es el estado mayor, salvo que algo diga lo
              contrario
            mensaje: |
              No hay un sufijo por defecto. Lo decide siempre la fórmula, con
              una cuenta: aquí un hierro frente a un SO₄²⁻, así que el hierro
              es +2 y el nombre es sulfato ferroso.
          - texto: >-
              De los oxígenos: cuatro oxígenos piden el sufijo mayor
            mensaje: |
              Los oxígenos deciden el nombre del **anión**, sulfato y no
              sulfito, no el del metal. El sufijo del metal sale de la carga
              que le queda por poner.

      - tipo: calcular
        titulo: 'El 1: AlCl₃'
        pregunta: |
          Nombra el AlCl₃. La hoja lo imprime con un espacio, «Al Cl₃», y es el
          mismo compuesto.
        respuesta:
          tipo: formula
          valor: cloruro de aluminio | cloruro alumínico | tricloruro de aluminio | cloruro de aluminio(III)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: clorato de aluminio | clorato alumínico
            mensaje: |
              Has puesto la terminación de un oxoanión. El clorato es ClO₃⁻, el
              cloro con oxígenos, y aquí no hay ninguno: el anión es el Cl⁻
              solo, y un anión de un solo elemento acaba en -uro.
          - valor: cloruro de aluminio(I)
            mensaje: |
              Has leído como carga del aluminio su propio subíndice, que es 1.
              El subíndice de cada ion es la carga del otro: los tres cloros
              dicen que el aluminio es 3+. Y como el aluminio no tiene otra
              carga, ni siquiera hace falta escribirla.
        pista: |
          El cloro con un metal actúa con −1, y el aluminio solo tiene +3.
        desarrollo: |
          Metal y no metal, sin oxígeno: es una sal binaria, y el no metal se
          nombra con -uro.

          $$
          (+3) + 3\times(-1) = 0
          $$

          El aluminio tiene un solo estado, así que no lleva número: cloruro
          de aluminio, o cloruro alumínico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 2: SrI₂'
        pregunta: |
          Nombra el SrI₂.
        respuesta:
          tipo: formula
          valor: yoduro de estroncio | ioduro de estroncio | yoduro estróncico | ioduro estróncico | diyoduro de estroncio | diioduro de estroncio | yoduro de estroncio(II) | ioduro de estroncio(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: yodato de estroncio | iodato de estroncio
            mensaje: |
              El yodato es IO₃⁻, con oxígenos. Aquí el yodo va solo, I⁻, y un
              anión de un solo elemento acaba en -uro: yoduro.
          - valor: yoduro estannoso | yoduro de estaño(II) | ioduro estannoso | ioduro de estaño(II)
            mensaje: |
              Has leído Sr como estaño. El estaño es Sn; Sr es el estroncio, un
              alcalinotérreo que solo actúa con +2 y por eso no lleva ni -oso
              ni -ico.
        pista: |
          Sr es el estroncio, del grupo del calcio: siempre 2+. El yodo con un
          metal es I⁻.
        desarrollo: |
          Estroncio(2+) con dos yoduros:

          $$
          (+2) + 2\times(-1) = 0
          $$

          Un solo estado, así que no lleva número: yoduro de estroncio, que
          también se escribe ioduro. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 3: NH₄NO₃'
        pregunta: |
          Nombra el NH₄NO₃.
        respuesta:
          tipo: formula
          valor: nitrato amónico | nitrato de amonio | trioxonitrato(V) de amonio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: nitrito amónico | nitrito de amonio
            mensaje: |
              El nitrito es NO₂⁻, con el nitrógeno a +3. Aquí el anión lleva
              tres oxígenos, NO₃⁻, y el nitrógeno está a +5, su estado alto:
              nitrato.
          - valor: nitrato de amoniaco
            mensaje: |
              El amoniaco es NH₃, una molécula neutra. Lo que hace de catión es
              el NH₄⁺, que se llama **amonio** —amónico como adjetivo—, y es el
              que va en el nombre de la sal.
        pista: |
          Aquí no hay metal: el catión es el NH₄⁺ y el anión, el NO₃⁻.
        desarrollo: |
          El catión es el amonio, NH₄⁺, y el anión, el nitrato, NO₃⁻, con el
          nitrógeno a +5:

          $$
          x + 3\times(-2) = -1 \;\Rightarrow\; x = +5
          $$

          Es el estado alto del nitrógeno en sus oxoácidos, el del HNO₃: la
          sal lleva -ato. Nitrato amónico, que es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 4: ZnSO₄'
        pregunta: |
          Nombra el ZnSO₄.
        respuesta:
          tipo: formula
          valor: sulfato de cinc | sulfato de zinc | sulfato cíncico | sulfato zíncico | sulfato de cinc(II) | sulfato de zinc(II) | tetraoxosulfato(VI) de cinc | tetraoxosulfato(VI) de zinc
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: sulfito de cinc | sulfito de zinc
            mensaje: |
              El sulfito es SO₃²⁻, con el azufre a +4. Con cuatro oxígenos el
              azufre está a +6, su estado más alto, y el anión es el sulfato.
          - valor: sulfuro de cinc | sulfuro de zinc
            mensaje: |
              El sulfuro es el S²⁻ solo, ZnS, sin oxígeno. En cuanto el azufre
              lleva oxígenos el anión es un oxoanión y se nombra por su ácido:
              con -ato o con -ito, nunca con -uro.
        pista: |
          El cinc solo actúa con +2, así que el anión es 2−. ¿Con qué número
          de oxidación está el azufre?
        desarrollo: |
          $$
          x + 4\times(-2) = -2 \;\Rightarrow\; x = +6
          $$

          El azufre a +6 es el del ácido sulfúrico, H₂SO₄, así que el anión es
          el sulfato. El cinc tiene una sola carga: sulfato de cinc. Es la de
          la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 5: K₂Cr₂O₇'
        pregunta: |
          Nombra el K₂Cr₂O₇.
        respuesta:
          tipo: formula
          valor: dicromato potásico | dicromato de potasio | bicromato potásico | bicromato de potasio | dicromato de potasio(I) | heptaoxodicromato(VI) de potasio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: cromato potásico | cromato de potasio
            mensaje: |
              El cromato lleva un solo cromo, CrO₄²⁻, y su sal de potasio es el
              K₂CrO₄. Aquí hay dos cromos y siete oxígenos: es el anión del
              ácido dicrómico, H₂Cr₂O₇, que sale de dos anhídridos y un agua.
          - valor: dicromito potásico | dicromito de potasio
            mensaje: |
              La terminación -ito diría que el cromo está en su estado bajo
              como no metal, el +3. Haz la cuenta con los dos cromos,
              $2x - 14 = -2$, y sale $x = +6$: el estado alto, que va con -ato.
        pista: |
          El potasio es +1, así que el anión es Cr₂O₇²⁻. Reparte la carga entre
          los dos cromos.
        desarrollo: |
          $$
          2x + 7\times(-2) = -2 \;\Rightarrow\; x = +6
          $$

          Es el cromo como no metal en su estado alto, pero con **dos** átomos
          en el anión: el del ácido dicrómico,
          $2\,\mathrm{CrO_3} + \mathrm{H_2O} \rightarrow \mathrm{H_2Cr_2O_7}$.
          Sin sus dos hidrógenos queda el dicromato. Es la de la hoja de
          respuestas. «Bicromato potásico» es su nombre comercial antiguo, y
          ese bi- no tiene nada que ver con el de las sales ácidas.

      - tipo: calcular
        titulo: 'El 6: AuPO₄'
        pregunta: |
          Nombra el AuPO₄.
        respuesta:
          tipo: formula
          valor: fosfato áurico | fosfato de oro(III) | ortofosfato áurico | ortofosfato de oro(III) | tetraoxofosfato(V) de oro(III)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: fosfato auroso | fosfato de oro(I)
            mensaje: |
              Un solo oro no quiere decir oro(I). El fosfato es PO₄³⁻, el ácido
              fosfórico H₃PO₄ sin sus tres hidrógenos, así que el oro tiene que
              poner +3: áurico.
          - valor: fosfito áurico | fosfito de oro(III)
            mensaje: |
              El fosfito es PO₃³⁻, con tres oxígenos y el fósforo a +3. Con
              cuatro oxígenos y la misma carga el fósforo está a +5: fosfato.
        pista: |
          El fosfato viene del H₃PO₄. ¿Cuántas cargas negativas le quedan al
          quitarle los hidrógenos?
        desarrollo: |
          El anión es PO₄³⁻, con el fósforo a +5, su estado alto:

          $$
          x + 4\times(-2) = -3 \;\Rightarrow\; x = +5
          $$

          Un oro frente a tres cargas negativas es Au³⁺, el mayor de sus dos
          estados (+1 y +3): áurico. Es la de la hoja de respuestas, que lo
          escribe «aúrico»; la tilde va en la a.

      - tipo: calcular
        titulo: 'El 7: Li₂SeO₃'
        pregunta: |
          Nombra el Li₂SeO₃.
        respuesta:
          tipo: formula
          valor: selenito de litio | selenito lítico | selenito de litio(I) | trioxoseleniato(IV) de litio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: seleniato de litio | seleniato lítico | selenato de litio
            mensaje: |
              El seleniato es SeO₄²⁻, con el selenio a +6. Aquí hay tres
              oxígenos y el selenio está a +4, el menor de sus dos estados:
              selenito.
          - valor: seleniuro de litio | seleniuro lítico
            mensaje: |
              El seleniuro es el Se²⁻ solo, Li₂Se. Con oxígenos el anión es un
              oxoanión, y lleva -ito o -ato, no -uro.
        pista: |
          Dos litios de +1 dejan el anión en 2−. El selenio actúa con +4 y +6.
        desarrollo: |
          $$
          x + 3\times(-2) = -2 \;\Rightarrow\; x = +4
          $$

          El selenio a +4 es el del ácido selenioso, H₂SeO₃, y su anión es el
          selenito. El litio solo tiene +1: selenito de litio. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 8: Pb₃(PO₃)₂'
        pregunta: |
          Nombra el Pb₃(PO₃)₂.
        respuesta:
          tipo: formula
          valor: fosfito plumboso | fosfito de plomo(II) | ortofosfito plumboso | ortofosfito de plomo(II) | trioxofosfato(III) de plomo(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: fosfato plumboso | fosfato de plomo(II)
            mensaje: |
              El fosfato lleva cuatro oxígenos, PO₄³⁻. Este anión tiene tres y
              la misma carga, así que el fósforo está a +3: es el fosfito, del
              ácido fosforoso H₃PO₃.
          - valor: fosfito plúmbico | fosfito de plomo(IV)
            mensaje: |
              Con plomo(IV) las cargas no cierran. Dos fosfitos son 6−, y
              repartidos entre tres plomos tocan a +2 cada uno: plumboso, el
              menor de los dos estados del plomo.
          - valor: metafosfato plumboso | metafosfato de plomo(II)
            mensaje: |
              El metafosfato también se escribe PO₃, pero con carga 1−: viene
              del HPO₃, con el fósforo a +5. Con esa carga, tres plomos y dos
              aniones no llegan nunca a cero ($3x = 2$). El PO₃ de aquí es 3−,
              el del H₃PO₃: fosfito.
        pista: |
          El fosfito viene del ácido fosforoso, H₃PO₃. Reparte sus cargas entre
          los tres plomos.
        desarrollo: |
          El anión es PO₃³⁻, con el fósforo a +3:

          $$
          x + 3\times(-2) = -3 \;\Rightarrow\; x = +3
          $$

          Dos aniones suman 6−, y tres plomos tienen que poner 6+: tocan a +2
          cada uno, el menor de sus dos estados (+2 y +4). Fosfito plumboso,
          que es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 9: CuSO₃'
        pregunta: |
          Nombra el CuSO₃.
        respuesta:
          tipo: formula
          valor: sulfito cúprico | sulfito de cobre(II) | trioxosulfato(IV) de cobre(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: sulfito cuproso | sulfito de cobre(I)
            mensaje: |
              Has leído como carga del cobre su subíndice, 1. El sulfito es
              SO₃²⁻, y un solo cobre tiene que poner las dos cargas: Cu²⁺,
              cúprico.
          - valor: sulfato cúprico | sulfato de cobre(II)
            mensaje: |
              El sulfato es SO₄²⁻, con cuatro oxígenos. Con tres el azufre está
              a +4, el del ácido sulfuroso, y el anión es el sulfito.
        pista: |
          El sulfito es SO₃²⁻. El cobre actúa con +1 y +2.
        desarrollo: |
          $$
          x + 3\times(-2) = -2 \;\Rightarrow\; x = +4
          $$

          Azufre a +4, ácido sulfuroso, anión sulfito. Un cobre frente a un
          SO₃²⁻ es Cu²⁺, el mayor de sus dos estados: sulfito cúprico. Es la
          de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 10: KBrO₃'
        pregunta: |
          Nombra el KBrO₃.
        respuesta:
          tipo: formula
          valor: bromato potásico | bromato de potasio | bromato de potasio(I) | trioxobromato(V) de potasio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: bromito potásico | bromito de potasio
            mensaje: |
              El bromito es BrO₂⁻, con el bromo a +3. Aquí hay tres oxígenos y
              el bromo está a +5, que en la escalera de los halógenos es -ico
              en el ácido y -ato en la sal.
          - valor: perbromato potásico | perbromato de potasio
            mensaje: |
              Per- es para el +7, BrO₄⁻, con cuatro oxígenos. Con tres el bromo
              está a +5: bromato, sin prefijo.
          - valor: bromuro potásico | bromuro de potasio
            mensaje: |
              El bromuro es el Br⁻ solo, KBr. Con oxígenos el bromo forma un
              oxoanión, y se nombra por su ácido: aquí, el brómico.
        pista: |
          El bromo tiene +1, +3, +5 y +7, como el cloro. Calcula el del anión
          BrO₃⁻.
        desarrollo: |
          $$
          x + 3\times(-2) = -1 \;\Rightarrow\; x = +5
          $$

          De los cuatro estados del bromo, el +5 es el tercero: ácido brómico,
          HBrO₃, y su anión es el bromato. Bromato potásico, que es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 11: Co(NO₂)₃'
        pregunta: |
          Nombra el Co(NO₂)₃.
        respuesta:
          tipo: formula
          valor: nitrito cobáltico | nitrito de cobalto(III) | dioxonitrato(III) de cobalto(III)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: nitrato cobáltico | nitrato de cobalto(III)
            mensaje: |
              El nitrato es NO₃⁻, con tres oxígenos. El NO₂⁻ lleva dos y el
              nitrógeno está a +3, el del ácido nitroso: nitrito.
          - valor: nitrito cobaltoso | nitrito de cobalto(II)
            mensaje: |
              Tres nitritos son tres cargas negativas, y hay un solo cobalto:
              tiene que ser Co³⁺, el mayor de sus dos estados. Cobaltoso sería
              el Co(NO₂)₂.
        pista: |
          El nitrito es NO₂⁻. Cuenta cuántos hay por cada cobalto.
        desarrollo: |
          $$
          x + 2\times(-2) = -1 \;\Rightarrow\; x = +3
          $$

          El nitrógeno a +3 es el del ácido nitroso, HNO₂, y su anión es el
          nitrito. Tres nitritos piden Co³⁺: nitrito cobáltico. La hoja de
          respuestas escribe «nitrito cobáltio», que es una errata de imprenta
          por cobáltico.

      - tipo: calcular
        titulo: 'El 12: CsClO₄'
        pregunta: |
          Nombra el CsClO₄.
        respuesta:
          tipo: formula
          valor: perclorato de cesio | perclorato césico | perclorato de cesio(I) | tetraoxoclorato(VII) de cesio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: clorato de cesio | clorato césico
            mensaje: |
              El clorato es ClO₃⁻, con el cloro a +5. Con cuatro oxígenos el
              cloro llega a +7, el último de sus estados, y ese lleva per-:
              perclorato.
          - valor: cloruro de cesio | cloruro césico
            mensaje: |
              El cloruro es el Cl⁻ solo, CsCl. Los cuatro oxígenos hacen del
              ClO₄⁻ un oxoanión, y se nombra por su ácido, el perclórico.
        pista: |
          Cs es el cesio, un alcalino: +1. El cloro tiene +1, +3, +5 y +7.
        desarrollo: |
          $$
          x + 4\times(-2) = -1 \;\Rightarrow\; x = +7
          $$

          El cloro a +7 es el del ácido perclórico, HClO₄, y su anión es el
          perclorato. Perclorato de cesio, que es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el método para nombrar cualquiera de estas sales. Una pieza es falsa.
        piezas:
          - texto: 'Se separa la fórmula en catión y anión: el metal o el amonio delante, el resto detrás.'
          - texto: 'Si el anión no lleva oxígeno acaba en -uro; si lo lleva, se calcula el número de oxidación de su elemento central con los oxígenos y la carga.'
          - texto: 'Ese número decide el nombre del anión: -ato para el estado alto, -ito para el bajo, y per- o hipo- en los extremos de los halógenos.'
          - texto: 'La carga del anión dice cuánto tiene que poner el metal, y de ahí sale -oso o -ico cuando el metal tiene dos estados.'
          - texto: 'El subíndice del metal es su carga: en el Pb₃(PO₃)₂ el plomo actúa con +3.'
            trampa: true
            mensaje: |
              El subíndice de un ion es la carga **del otro**. En el Pb₃(PO₃)₂
              el 3 del plomo viene de la carga del fosfito, 3−, y el 2 del
              fosfito, de la del plomo, 2+. Y el plomo ni siquiera tiene +3:
              sus estados son +2 y +4.
    resolucion: |
      | n.º | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 1 | AlCl₃ | cloruro de aluminio · cloruro alumínico | tricloruro de aluminio |
      | 2 | SrI₂ | yoduro (o ioduro) de estroncio | diyoduro de estroncio |
      | 3 | NH₄NO₃ | nitrato amónico | trioxonitrato(V) de amonio |
      | 4 | ZnSO₄ | sulfato de cinc | tetraoxosulfato(VI) de cinc |
      | 5 | K₂Cr₂O₇ | dicromato potásico | heptaoxodicromato(VI) de potasio |
      | 6 | AuPO₄ | fosfato áurico | fosfato de oro(III) |
      | 7 | Li₂SeO₃ | selenito de litio | trioxoseleniato(IV) de litio |
      | 8 | Pb₃(PO₃)₂ | fosfito plumboso | fosfito de plomo(II) |
      | 9 | CuSO₃ | sulfito cúprico | sulfito de cobre(II) |
      | 10 | KBrO₃ | bromato potásico | trioxobromato(V) de potasio |
      | 11 | Co(NO₂)₃ | nitrito cobáltico | nitrito de cobalto(III) |
      | 12 | CsClO₄ | perclorato de cesio | tetraoxoclorato(VII) de cesio |

      **Lo que se lleva uno de este bloque.** Se empieza siempre por el
      anión: su número de oxidación da -ato o -ito, y su carga dice cuánto
      pone el metal. El subíndice del metal no es su carga, y los tres
      metales de dos estados de la lista —plomo, cobre y cobalto— se deciden
      con esa cuenta, no a ojo.

      **Las respuestas oficiales** coinciden con estas; la del 11 dice
      «cobáltio», errata de imprenta por cobáltico.

  - id: colfq1-f3-nombrar-del-13-al-25
    titulo: 'Hoja 3 de formulación: nombrar del 13 al 25, sales ácidas y oxisales'
    fuente: >-
      Ejercicios de formulación-3, nombrar del 13 al 25 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La
      hoja de respuestas del material publica las trece, con dos erratas: en el
      13 escribe «pirofosfio» por pirofosfito, y en el 25 llama permanganato de
      radio al RaMnO₄, que es manganato. El 23 la hoja lo imprime AlHAsO₇, que
      no puede existir, y la hoja de respuestas lo escribe AlHAs₂O₇. Los
      distractores y el diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      Escribir el nombre de los siguientes compuestos:

      13. CaH₂P₂O₅
      14. NaHCO₃
      15. Ba₂SiO₄
      16. AgIO₃
      17. FeAsO₃
      18. CaF₂
      19. Rb₂CrO₄
      20. Na₂B₄O₇
      21. PtSeO₃
      22. Sn(TeO₄)₂
      23. AlHAsO₇
      24. MgCO₃
      25. RaMnO₄

      *El 23 está impreso como AlHAsO₇, y así no puede existir: con Al³⁺, H⁺
      y siete oxígenos, el arsénico tendría que estar a +10. La hoja de
      respuestas lo escribe AlHAs₂O₇, piroarseniato ácido de aluminio, y aquí
      se nombra ese.*
    pide: El nombre de los trece compuestos, en tradicional, de Stock o sistemática.

    pasos:
      - tipo: reconocer
        pregunta: |
          El 13, CaH₂P₂O₅, lleva dos hidrógenos entre el metal y el resto del
          anión. ¿Qué hay que hacer para saber de qué ácido viene?
        opciones:
          - texto: >-
              Devolverle al anión los hidrógenos que ocupa el metal: el Ca²⁺
              está en el sitio de dos, así que el ácido es H₄P₂O₅
            correcta: true
            mensaje: |
              Eso es. Una sal ácida es un ácido al que el metal le ha quitado
              **parte** de sus hidrógenos: se devuelven los que ocupa el metal,
              se suman a los que quedan y sale el ácido entero. Con él se
              calcula el número de oxidación y se elige el nombre.
          - texto: >-
              Leer el P₂O₅ de la fórmula, que es el anhídrido fosfórico, y
              tomar su ácido
            mensaje: |
              El P₂O₅ de la fórmula no es una molécula suelta: está dentro de
              un anión con carga, el H₂P₂O₅²⁻. Haz la cuenta con el calcio y
              los dos hidrógenos, $2 + 2 + 2x - 10 = 0$, y el fósforo sale a +3,
              no a +5.
          - texto: >-
              Contar solo los dos hidrógenos que se ven, porque el calcio no es
              parte del ácido
            mensaje: |
              El calcio no es parte del ácido, pero ocupa el sitio de dos de
              sus hidrógenos. Si no se los devuelves sale un H₂P₂O₅ que no es
              ningún ácido del fósforo: dejaría al fósforo a +4, que no es uno
              de sus estados.
          - texto: >-
              Nada: una sal ácida se nombra por su fórmula y no por un ácido
            mensaje: |
              Se nombra por su ácido, como cualquier oxisal: el ácido da el
              prefijo y la terminación, pirofosfito, y los hidrógenos que
              quedan se dicen después con «ácido» o «diácido».

      - tipo: calcular
        titulo: 'El 13: CaH₂P₂O₅'
        pregunta: |
          Nombra el CaH₂P₂O₅.
        respuesta:
          tipo: formula
          valor: pirofosfito diácido de calcio | pirofosfito diácido cálcico | dihidrogenopirofosfito de calcio | dihidrógeno pirofosfito de calcio | dihidrogenodifosfito de calcio | dihidrogenopentaoxodifosfato(III) de calcio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: pirofosfato diácido de calcio | pirofosfato diácido cálcico | dihidrogenopirofosfato de calcio
            mensaje: |
              El pirofosfato es el del fósforo a +5, H₄P₂O₇, con siete
              oxígenos. Aquí hay cinco y el fósforo está a +3: el ácido es el
              pirofosforoso, H₄P₂O₅, y su anión, el pirofosfito.
          - valor: pirofosfito de calcio | pirofosfito cálcico
            mensaje: |
              Faltan los hidrógenos en el nombre. El pirofosfito a secas es el
              P₂O₅⁴⁻, sin ninguno, y su sal de calcio sería Ca₂P₂O₅. Aquí
              quedan dos sin sustituir, y se dicen con «diácido».
          - valor: pirofosfito ácido de calcio | pirofosfito ácido cálcico
            mensaje: |
              «Ácido» a secas es un hidrógeno, y aquí quedan dos. Con uno solo
              el anión sería HP₂O₅³⁻, y con calcio saldría Ca₃(HP₂O₅)₂.
        pista: |
          El calcio ocupa el sitio de dos hidrógenos: el ácido es H₄P₂O₅. ¿Con
          qué número está el fósforo?
        desarrollo: |
          Devolviendo los dos hidrógenos del calcio sale el ácido, H₄P₂O₅:

          $$
          4\times(+1) + 2x + 5\times(-2) = 0 \;\Rightarrow\; x = +3
          $$

          Es el P₂O₃ con dos aguas, el ácido pirofosforoso, y su anión es el
          pirofosfito. De sus cuatro hidrógenos quedan dos: pirofosfito
          diácido de calcio. Es la de la hoja de respuestas, que escribe
          «pirofosfio» por una errata de imprenta.

      - tipo: calcular
        titulo: 'El 14: NaHCO₃'
        pregunta: |
          Nombra el NaHCO₃.
        respuesta:
          tipo: formula
          valor: carbonato ácido de sodio | carbonato ácido sódico | bicarbonato sódico | bicarbonato de sodio | carbonato monoácido de sodio | hidrogenocarbonato de sodio | hidrógeno carbonato de sodio | hidrogenotrioxocarbonato(IV) de sodio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: carbonato sódico | carbonato de sodio
            mensaje: |
              Ese es el Na₂CO₃, con los dos hidrógenos del ácido sustituidos.
              Aquí queda uno, el H del NaHCO₃, y hay que decirlo: carbonato
              ácido de sodio, o bicarbonato.
          - valor: carbonato diácido de sodio | carbonato diácido sódico
            mensaje: |
              Has leído bi- como «dos hidrógenos», y no es eso. El ácido
              carbónico, H₂CO₃, solo tiene dos: si los conservara los dos no
              habría sal, habría ácido. Queda uno, y eso se dice con «ácido» a
              secas o con bi-.
        pista: |
          El ácido carbónico, H₂CO₃, tiene dos hidrógenos. El sodio ha
          sustituido uno.
        desarrollo: |
          El sodio ocupa el sitio de un hidrógeno del H₂CO₃ y el otro se queda:
          el anión es HCO₃⁻, con el carbono a +4.

          $$
          (+1) + (+1) + x + 3\times(-2) = 0 \;\Rightarrow\; x = +4
          $$

          Queda un hidrógeno de un ácido que tenía dos: carbonato ácido de
          sodio, o bicarbonato sódico con el bi- del curso. La hoja de
          respuestas da «bicarbonato de sodio».

      - tipo: calcular
        titulo: 'El 15: Ba₂SiO₄'
        pregunta: |
          Nombra el Ba₂SiO₄.
        respuesta:
          tipo: formula
          valor: silicato de bario | silicato bárico | ortosilicato de bario | ortosilicato bárico | silicato de bario(II) | tetraoxosilicato(IV) de bario
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: metasilicato de bario | metasilicato bárico
            mensaje: |
              El metasilicato es SiO₃²⁻, del H₂SiO₃ (el anhídrido más un agua),
              y su sal de bario es BaSiO₃. Cuatro oxígenos y carga 4− son los
              del H₄SiO₄, con dos aguas: el orto, que se puede omitir.
          - valor: silicato de bario(I)
            mensaje: |
              Ese (I) sale de darle al silicato carga 2−, como al sulfato. El
              silicato del curso es el orto, SiO₄⁴⁻, y lo cierran dos Ba²⁺. El
              bario, además, solo actúa con +2.
        pista: |
          El silicio solo tiene +4. Con dos aguas, su ácido es H₄SiO₄.
        desarrollo: |
          $$
          x + 4\times(-2) = -4 \;\Rightarrow\; x = +4
          $$

          El silicio tiene dos ácidos en el curso: meta, H₂SiO₃, y orto,
          H₄SiO₄. Este anión es el del orto, y el orto se puede omitir:
          silicato de bario. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 16: AgIO₃'
        pregunta: |
          Nombra el AgIO₃.
        respuesta:
          tipo: formula
          valor: yodato de plata | iodato de plata | yodato argéntico | iodato argéntico | yodato de plata(I) | iodato de plata(I) | trioxoyodato(V) de plata | trioxoiodato(V) de plata
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: peryodato de plata | periodato de plata
            mensaje: |
              Per- es para el yodo a +7, IO₄⁻, con cuatro oxígenos. Con tres
              está a +5: yodato, sin prefijo.
          - valor: yoduro de plata | ioduro de plata
            mensaje: |
              El yoduro es el I⁻ solo, AgI. Con oxígenos el yodo forma un
              oxoanión y se nombra por su ácido: aquí, el yódico.
        pista: |
          La plata es +1. El yodo tiene +1, +3, +5 y +7, como el cloro.
        desarrollo: |
          $$
          x + 3\times(-2) = -1 \;\Rightarrow\; x = +5
          $$

          El yodo a +5 es el del ácido yódico, HIO₃, y su anión es el yodato.
          La plata tiene un solo estado: yodato de plata, que también se
          escribe iodato. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 17: FeAsO₃'
        pregunta: |
          Nombra el FeAsO₃.
        respuesta:
          tipo: formula
          valor: arsenito férrico | arsenito de hierro(III) | ortoarsenito férrico | ortoarsenito de hierro(III) | trioxoarseniato(III) de hierro(III)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: arsenito ferroso | arsenito de hierro(II)
            mensaje: |
              Ferroso sale de darle al arsenito carga 2−, como al sulfito. Pero
              viene del H₃AsO₃, con tres hidrógenos: es AsO₃³⁻, y un solo
              hierro tiene que poner +3.
          - valor: arseniato férrico | arseniato de hierro(III)
            mensaje: |
              El arseniato es AsO₄³⁻, con el arsénico a +5. Con tres oxígenos
              y la misma carga el arsénico está a +3: arsenito.
        pista: |
          El arsénico se porta como el fósforo: su ácido con +3 es H₃AsO₃.
        desarrollo: |
          $$
          x + 3\times(-2) = -3 \;\Rightarrow\; x = +3
          $$

          Arsénico a +3, ácido (orto)arsenioso, H₃AsO₃, y anión arsenito. Un
          hierro frente a tres cargas negativas es Fe³⁺: arsenito férrico. Es
          la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 18: CaF₂'
        pregunta: |
          Nombra el CaF₂.
        respuesta:
          tipo: formula
          valor: fluoruro de calcio | fluoruro cálcico | difluoruro de calcio | fluoruro de calcio(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: fosfuro de calcio | fosfuro cálcico
            mensaje: |
              F es el flúor. El fósforo es P, y su sal de calcio, el fosfuro,
              es Ca₃P₂: el fósforo con metales actúa con −3.
          - valor: fluorato de calcio | fluorato cálcico
            mensaje: |
              La terminación -ato es para oxoaniones, y aquí no hay ni un
              oxígeno: el anión es el F⁻ solo, y un anión de un solo elemento
              acaba en -uro. El flúor, además, solo actúa con −1, así que no
              tiene oxoácidos.
        pista: |
          Después de tantas oxisales, esta es binaria: metal y no metal, sin
          oxígeno.
        desarrollo: |
          Calcio(2+) con dos fluoruros:

          $$
          (+2) + 2\times(-1) = 0
          $$

          Sal binaria, no metal en -uro: fluoruro de calcio, o fluoruro
          cálcico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 19: Rb₂CrO₄'
        pregunta: |
          Nombra el Rb₂CrO₄.
        respuesta:
          tipo: formula
          valor: cromato de rubidio | cromato rubídico | cromato de rubidio(I) | tetraoxocromato(VI) de rubidio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: dicromato de rubidio | dicromato rubídico
            mensaje: |
              El 2 es de los rubidios, no de los cromos: hay un solo cromo, y
              el anión es el CrO₄²⁻ del ácido crómico. El dicromato lleva dos
              cromos y siete oxígenos, Cr₂O₇²⁻, y su sal sería Rb₂Cr₂O₇.
          - valor: cromito de rubidio | cromito rubídico
            mensaje: |
              La terminación -ito diría que el cromo está en su estado bajo
              como no metal, el +3. Con dos Rb⁺ y cuatro oxígenos la cuenta
              da +6, el alto, y el alto va con -ato.
        pista: |
          Dos rubidios de +1 dejan el anión en 2−. El cromo como no metal
          tiene +3 y +6.
        desarrollo: |
          $$
          x + 4\times(-2) = -2 \;\Rightarrow\; x = +6
          $$

          El cromo a +6 con un solo átomo es el del ácido crómico, H₂CrO₄, y
          su anión es el cromato. Cromato de rubidio, que es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 20: Na₂B₄O₇'
        pregunta: |
          Nombra el Na₂B₄O₇.
        respuesta:
          tipo: formula
          valor: tetraborato sódico | tetraborato de sodio | tetraborato de sodio(I) | heptaoxotetraborato(III) de sodio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: borato sódico | borato de sodio
            mensaje: |
              El borato a secas lleva un solo boro, BO₃³⁻, y su sal de sodio es
              Na₃BO₃. Aquí hay cuatro boros en el anión: es el del ácido
              tetrabórico, H₂B₄O₇, un isopoliácido.
          - valor: metaborato sódico | metaborato de sodio
            mensaje: |
              El metaborato es BO₂⁻, del HBO₂, y su sal de sodio es NaBO₂. Los
              cuatro boros y los siete oxígenos son los del ácido tetrabórico.
        pista: |
          El boro solo tiene +3. El B₄O₇²⁻ junta cuatro boros: dos anhídridos
          y un agua.
        desarrollo: |
          $$
          4x + 7\times(-2) = -2 \;\Rightarrow\; x = +3
          $$

          Dos anhídridos bóricos y un agua dan el ácido tetrabórico,
          $2\,\mathrm{B_2O_3} + \mathrm{H_2O} \rightarrow \mathrm{H_2B_4O_7}$.
          Sin sus dos hidrógenos queda el tetraborato: tetraborato sódico. Es
          la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 21: PtSeO₃'
        pregunta: |
          Nombra el PtSeO₃.
        respuesta:
          tipo: formula
          valor: selenito platinoso | selenito de platino(II) | trioxoseleniato(IV) de platino(II)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: selenito platínico | selenito de platino(IV)
            mensaje: |
              Un selenito es 2−, y hay un solo platino: Pt²⁺, el menor de sus
              dos estados (+2 y +4). Platínico sería el Pt(SeO₃)₂.
          - valor: seleniato platinoso | seleniato de platino(II) | selenato platinoso
            mensaje: |
              El seleniato es SeO₄²⁻, con el selenio a +6. Con tres oxígenos
              está a +4: selenito.
        pista: |
          El selenito es SeO₃²⁻. El platino actúa con +2 y +4.
        desarrollo: |
          $$
          x + 3\times(-2) = -2 \;\Rightarrow\; x = +4
          $$

          Selenio a +4, ácido selenioso, anión selenito. Un platino frente a
          un SeO₃²⁻ es Pt²⁺: selenito platinoso. Es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 22: Sn(TeO₄)₂'
        pregunta: |
          Nombra el Sn(TeO₄)₂.
        respuesta:
          tipo: formula
          valor: telurato estánnico | telurato de estaño(IV) | tetraoxotelurato(VI) de estaño(IV)
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: telurato estannoso | telurato de estaño(II)
            mensaje: |
              El 2 de fuera del paréntesis dice cuántos teluratos hay, no la
              carga del estaño. Dos TeO₄²⁻ son 4−, y un solo estaño tiene que
              poner +4: estánnico.
          - valor: telurito estánnico | telurito de estaño(IV)
            mensaje: |
              El telurito es TeO₃²⁻, con el teluro a +4. Con cuatro oxígenos
              está a +6: telurato.
        pista: |
          El teluro se porta como el azufre: TeO₄²⁻ es el telurato. ¿Cuántos
          hay por cada estaño?
        desarrollo: |
          $$
          x + 4\times(-2) = -2 \;\Rightarrow\; x = +6
          $$

          Teluro a +6, ácido telúrico, anión telurato. Dos teluratos suman 4−,
          así que el estaño es Sn⁴⁺, el mayor de sus dos estados: telurato
          estánnico. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 23: AlHAs₂O₇'
        pregunta: |
          Nombra el AlHAs₂O₇, que es como lo escribe la hoja de respuestas (la
          hoja imprime AlHAsO₇, que no puede existir).
        respuesta:
          tipo: formula
          valor: piroarseniato ácido de aluminio | piroarseniato ácido alumínico | piroarseniato monoácido de aluminio | hidrogenopiroarseniato de aluminio | hidrógeno piroarseniato de aluminio | hidrogenodiarseniato de aluminio | hidrogenoheptaoxodiarseniato(V) de aluminio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: piroarsenito ácido de aluminio | piroarsenito ácido alumínico
            mensaje: |
              El piroarsenito es el del arsénico a +3, H₄As₂O₅, con cinco
              oxígenos. Aquí hay siete y el arsénico está a +5: piroarseniato.
          - valor: piroarseniato de aluminio | piroarseniato alumínico
            mensaje: |
              Falta el hidrógeno en el nombre. El piroarseniato sin ninguno es
              As₂O₇⁴⁻, y con aluminio sería Al₄(As₂O₇)₃. Aquí queda uno, y se
              dice con «ácido».
          - valor: arseniato ácido de aluminio | arseniato ácido alumínico
            mensaje: |
              El arseniato de siempre lleva un solo arsénico, y su forma ácida
              es HAsO₄²⁻. Con dos arsénicos y siete oxígenos el anión es el del
              ácido piroarsénico, H₄As₂O₇: el As₂O₅ con dos aguas.
        pista: |
          El aluminio ocupa el sitio de tres hidrógenos; con el que queda, el
          ácido es H₄As₂O₇.
        desarrollo: |
          Devolviendo los tres hidrógenos del aluminio sale H₄As₂O₇:

          $$
          4\times(+1) + 2x + 7\times(-2) = 0 \;\Rightarrow\; x = +5
          $$

          Es el As₂O₅ con dos aguas, el ácido piroarsénico, y su anión es el
          piroarseniato. De sus cuatro hidrógenos queda uno: piroarseniato
          ácido de aluminio, que es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 24: MgCO₃'
        pregunta: |
          Nombra el MgCO₃.
        respuesta:
          tipo: formula
          valor: carbonato de magnesio | carbonato magnésico | carbonato de magnesio(II) | trioxocarbonato(IV) de magnesio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: carbonato de manganeso | carbonato manganoso | carbonato de manganeso(II)
            mensaje: |
              Mg es el magnesio. El manganeso es Mn, y su carbonato, el MnCO₃,
              sería el manganoso. Los dos símbolos se parecen y los dos
              elementos no tienen nada que ver.
          - valor: carbonito de magnesio | carbonito magnésico
            mensaje: |
              La terminación -ito sería el carbono a +2, el del ácido carbonoso,
              H₂CO₂. Con tres oxígenos la cuenta da +4, el estado alto:
              carbonato.
        pista: |
          Mg es el magnesio: siempre +2. El carbono tiene +2 y +4.
        desarrollo: |
          $$
          x + 3\times(-2) = -2 \;\Rightarrow\; x = +4
          $$

          Carbono a +4, ácido carbónico, anión carbonato. El magnesio tiene un
          solo estado: carbonato de magnesio. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 25: RaMnO₄'
        pregunta: |
          Nombra el RaMnO₄.
        respuesta:
          tipo: formula
          valor: manganato de radio | manganato rádico | manganato de radio(II) | tetraoxomanganato(VI) de radio
          formato: el nombre, en tradicional, de Stock o sistemática
        distractores:
          - valor: permanganato de radio | permanganato rádico
            mensaje: |
              Es la de la hoja de respuestas, y tiene una errata. El
              permanganato es MnO₄⁻, con una sola carga y el manganeso a +7, y
              el de radio sería Ra(MnO₄)₂. Aquí hay un solo MnO₄ para un Ra²⁺:
              lleva carga 2−, el manganeso está a +6 y el anión es manganato.
          - valor: manganito de radio | manganito rádico
            mensaje: |
              El manganito es MnO₃²⁻, del ácido manganoso, H₂MnO₃, con el
              manganeso a +4. Con cuatro oxígenos está a +6: manganato.
        pista: |
          El radio es un alcalinotérreo, Ra²⁺. ¿Qué carga le queda al MnO₄, y
          con qué número está el manganeso?
        desarrollo: |
          $$
          x + 4\times(-2) = -2 \;\Rightarrow\; x = +6
          $$

          El manganeso como no metal tiene +4, +6 y +7: manganoso, mangánico
          y permangánico. A +6 el ácido es el mangánico, H₂MnO₄, y su anión el
          manganato, MnO₄²⁻. El permanganato se escribe igual pero lleva una
          sola carga, y con Ra²⁺ harían falta dos.

      - tipo: justificar
        pregunta: Ordena cómo se nombra una sal ácida, con el CaH₂P₂O₅. Una pieza es falsa.
        piezas:
          - texto: 'El calcio es Ca²⁺ y ocupa el sitio de dos hidrógenos del ácido.'
          - texto: 'Devolviéndoselos sale el ácido, H₄P₂O₅, con el fósforo a +3.'
          - texto: 'P₂O₃ más dos aguas es el ácido pirofosforoso, así que el anión es un pirofosfito.'
          - texto: 'Quedan dos de sus cuatro hidrógenos, y eso se dice con «diácido»: pirofosfito diácido de calcio.'
          - texto: 'Como quedan dos hidrógenos, también se puede llamar bipirofosfito de calcio.'
            trampa: true
            mensaje: |
              El bi- del curso es solo para los ácidos de **dos** hidrógenos
              que conservan uno: bicarbonato, HCO₃⁻, o bisulfuro, HS⁻. El
              pirofosforoso tiene cuatro, y con él hay que decir cuántos
              quedan: «ácido» si es uno, «diácido» si son dos.
    resolucion: |
      | n.º | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 13 | CaH₂P₂O₅ | pirofosfito diácido de calcio | dihidrogenopirofosfito de calcio |
      | 14 | NaHCO₃ | carbonato ácido de sodio · bicarbonato sódico | hidrogenocarbonato de sodio |
      | 15 | Ba₂SiO₄ | (orto)silicato de bario | tetraoxosilicato(IV) de bario |
      | 16 | AgIO₃ | yodato de plata | trioxoyodato(V) de plata |
      | 17 | FeAsO₃ | arsenito férrico | arsenito de hierro(III) |
      | 18 | CaF₂ | fluoruro de calcio · fluoruro cálcico | difluoruro de calcio |
      | 19 | Rb₂CrO₄ | cromato de rubidio | tetraoxocromato(VI) de rubidio |
      | 20 | Na₂B₄O₇ | tetraborato sódico | heptaoxotetraborato(III) de sodio |
      | 21 | PtSeO₃ | selenito platinoso | selenito de platino(II) |
      | 22 | Sn(TeO₄)₂ | telurato estánnico | telurato de estaño(IV) |
      | 23 | AlHAs₂O₇ | piroarseniato ácido de aluminio | hidrogenopiroarseniato de aluminio |
      | 24 | MgCO₃ | carbonato de magnesio | trioxocarbonato(IV) de magnesio |
      | 25 | RaMnO₄ | manganato de radio | tetraoxomanganato(VI) de radio |

      **Lo que se lleva uno de este bloque.** En una sal ácida se devuelven
      al anión los hidrógenos que ocupa el metal y sale el ácido: con él se
      elige el nombre, y los hidrógenos que quedan se dicen con «ácido» o
      «diácido», o con bi- si el ácido tenía dos y queda uno. Y el MnO₄ se
      escribe igual con dos cargas distintas: la carga decide si es
      manganato o permanganato.

      **Las erratas de las respuestas oficiales.** El 25 no es permanganato
      sino manganato de radio; el 13 dice «pirofosfio» por pirofosfito, y el
      23 hay que leerlo como AlHAs₂O₇, que es como lo escribe la hoja de
      respuestas.

  - id: colfq1-f3-formular-del-1-al-12
    titulo: 'Hoja 3 de formulación: formular del 1 al 12, oxisales y dos sales binarias'
    fuente: >-
      Ejercicios de formulación-3, formular del 1 al 12 · Fundamentos Químicos
      de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La
      hoja de respuestas del material publica las doce fórmulas, y coinciden
      con las nuestras. Los distractores y el diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      1. Sulfuro aúrico
      2. Permanganato potásico
      3. Cloruro crómico
      4. Sulfato cúprico
      5. Piroarseniato de cinc
      6. Clorito platínoso
      7. Nitrato mercúrico
      8. Metaborato estannoso
      9. Manganato niquélico
      10. Silicato cálcico
      11. Carbonato magnésico
      12. Sulfito amónico

      *En el 6 la hoja escribe «platínoso», con una tilde de más: es
      platinoso, el platino con su carga menor. Y en el 1, «aúrico» se
      escribe áurico.*
    pide: La fórmula de los doce compuestos.

    pasos:
      - tipo: reconocer
        pregunta: |
          El 2 y el 9 llevan el mismo grupo, MnO₄: permanganato y manganato.
          ¿En qué se diferencian los dos aniones?
        opciones:
          - texto: >-
              En la carga: el manganato viene del H₂MnO₄, con el manganeso
              a +6, y es MnO₄²⁻; el permanganato viene del HMnO₄, a +7, y es
              MnO₄⁻
            correcta: true
            mensaje: |
              Eso es, y es el procedimiento de las diapositivas para cualquier
              oxoanión: del nombre sale el número de oxidación, de ahí el
              ácido, y al quitarle los hidrógenos queda el anión con tantas
              cargas como hidrógenos tenía. Mismo MnO₄, distinto ácido,
              distinta carga.
          - texto: >-
              En nada: son dos nombres del mismo ion, MnO₄⁻
            mensaje: |
              Se escriben igual y no son el mismo ion. Con el manganeso a +6 la
              cuenta $x + 4\cdot(-2)$ da −2, y con +7 da −1. Confundirlos
              cambia todos los subíndices de la sal.
          - texto: >-
              En los oxígenos: el permanganato lleva uno más, MnO₅⁻
            mensaje: |
              El per- no añade un oxígeno a la fórmula: dice que el manganeso
              está en su estado más alto. Los dos llevan cuatro oxígenos; lo
              que cambia es el número de oxidación, y con él la carga.
          - texto: >-
              El manganato es del manganeso como metal y el permanganato, del
              manganeso como no metal
            mensaje: |
              Los dos son del manganeso como no metal: el +6 y el +7 están en
              la fila roja de la tabla del curso, junto al +4. Como metal el
              manganeso da cationes, Mn²⁺ y Mn³⁺, que no llevan oxígenos.

      - tipo: calcular
        titulo: 'El 1: sulfuro áurico'
        pregunta: |
          Escribe la fórmula del sulfuro áurico.
        respuesta:
          tipo: formula
          valor: Au2S3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Au2S
            mensaje: |
              Ese es el sulfuro auroso, con el oro a +1. Áurico es el mayor de
              sus dos estados, el +3.
          - valor: Au3S2
            mensaje: |
              Has cruzado al revés. El 3 del oro baja al azufre y el 2 del
              azufre baja al oro. Súmalo: 9+ contra 4− no es neutro.
          - valor: Au2(SO4)3
            mensaje: |
              Ese es el sulfato áurico. Sulfuro es el S²⁻ solo, sin oxígenos:
              la terminación -uro es la de los aniones de un solo elemento.
        pista: |
          Áurico es Au³⁺. El azufre con un metal actúa con −2.
        desarrollo: |
          $$
          2\,\mathrm{Au^{3+}} + 3\,\mathrm{S^{2-}} \;\longrightarrow\; \mathrm{Au_2S_3}
          $$

          Seis cargas de cada signo. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 2: permanganato potásico'
        pregunta: |
          Escribe la fórmula del permanganato potásico.
        respuesta:
          tipo: formula
          valor: KMnO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: K2MnO4
            mensaje: |
              Ese es el manganato potásico: MnO₄²⁻, con el manganeso a +6, que
              por eso pide dos potasios. El permanganato tiene una sola carga,
              MnO₄⁻, y va uno a uno con el K⁺.
          - valor: K2Mn2O8
            mensaje: |
              Has formado el ácido sin simplificar. Mn₂O₇ más un agua da
              H₂Mn₂O₈, que se simplifica a HMnO₄; de ahí sale el MnO₄⁻, y la
              sal es KMnO₄.
        pista: |
          Per- es el estado más alto del manganeso, +7. Su ácido es HMnO₄.
        desarrollo: |
          $$
          \mathrm{Mn_2O_7} + \mathrm{H_2O} \rightarrow \mathrm{H_2Mn_2O_8} \;\rightarrow\; \mathrm{HMnO_4}\ \text{(simplificado)}
          $$

          Sin el hidrógeno queda MnO₄⁻, y con K⁺ la sal va uno a uno:
          $\mathrm{KMnO_4}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 3: cloruro crómico'
        pregunta: |
          Escribe la fórmula del cloruro crómico.
        respuesta:
          tipo: formula
          valor: CrCl3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: CrCl2
            mensaje: |
              Ese es el cloruro cromoso, con el cromo a +2. Crómico es el
              mayor de sus dos estados como metal, el +3.
          - valor: CrCl6
            mensaje: |
              El +6 es del cromo como no metal, el de los cromatos y los
              dicromatos. Como metal el cromo tiene +2 y +3, y crómico es +3.
          - valor: Cr(ClO3)3
            mensaje: |
              Ese es el clorato crómico. Cloruro es el Cl⁻ solo, sin oxígenos.
        pista: |
          Como metal, el cromo actúa con +2 y +3.
        desarrollo: |
          $$
          \mathrm{Cr^{3+}} + 3\,\mathrm{Cl^-} \;\longrightarrow\; \mathrm{CrCl_3}
          $$

          El sufijo es relativo a los estados del cromo **como metal**, que
          son dos. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 4: sulfato cúprico'
        pregunta: |
          Escribe la fórmula del sulfato cúprico.
        respuesta:
          tipo: formula
          valor: CuSO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Cu2SO4
            mensaje: |
              Ese es el sulfato cuproso, con el cobre a +1. Cúprico es Cu²⁺, y
              con un sulfato de carga 2− va uno a uno.
          - valor: CuSO3
            mensaje: |
              Ese es el sulfito cúprico. El sulfato lleva cuatro oxígenos,
              SO₄²⁻: es el del ácido sulfúrico, con el azufre a +6.
          - valor: Cu2(SO4)2
            mensaje: |
              Has cruzado sin simplificar. Con cargas 2+ y 2− el cruce da 2 y
              2, y la fórmula de una sal da la proporción más simple: uno a
              uno.
        pista: |
          Cúprico es Cu²⁺ y el sulfato es SO₄²⁻.
        desarrollo: |
          $$
          \mathrm{Cu^{2+}} + \mathrm{SO_4^{2-}} \;\longrightarrow\; \mathrm{CuSO_4}
          $$

          Cargas iguales en valor, proporción uno a uno. Es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 5: piroarseniato de cinc'
        pregunta: |
          Escribe la fórmula del piroarseniato de cinc.
        respuesta:
          tipo: formula
          valor: Zn2As2O7
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Zn4(As2O7)2
            mensaje: |
              El cruce está bien y falta simplificar. Cuatro cincs y dos
              piroarseniatos tienen un 2 en común: Zn₂As₂O₇.
          - valor: Zn3(AsO4)2
            mensaje: |
              Ese es el arseniato de cinc, el del orto, H₃AsO₄. Piro son dos
              aguas sobre el As₂O₅: H₄As₂O₇, con dos arsénicos en el anión.
          - valor: Zn2As2O5
            mensaje: |
              Ese es el piroarsenito de cinc, con el arsénico a +3 (As₂O₃ más
              dos aguas). El piroarseniato es el del +5, y lleva siete
              oxígenos.
        pista: |
          Piroarsénico es As₂O₅ más dos aguas. ¿Cuántos hidrógenos tiene, y
          cuántas cargas le deja al anión?
        desarrollo: |
          $$
          \mathrm{As_2O_5} + 2\,\mathrm{H_2O} \rightarrow \mathrm{H_4As_2O_7}
          $$

          Sin sus cuatro hidrógenos queda As₂O₇⁴⁻, y hacen falta dos Zn²⁺ para
          cerrarlo: $\mathrm{Zn_2As_2O_7}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 6: clorito platinoso'
        pregunta: |
          Escribe la fórmula del clorito platinoso (la hoja escribe
          «platínoso», con una tilde de más).
        respuesta:
          tipo: formula
          valor: Pt(ClO2)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Pt(ClO2)4
            mensaje: |
              Ese es el clorito platínico, con el platino a +4. Platinoso es el
              menor de sus dos estados, el +2, y con la tilde de la hoja es
              fácil leer platínico.
          - valor: Pt(ClO3)2
            mensaje: |
              Ese es el clorato platinoso. El clorito es el del cloro a +3,
              HClO₂, y lleva dos oxígenos: ClO₂⁻.
          - valor: PtClO2
            mensaje: |
              Sin cruzar, las cargas no cierran: +2 contra −1. Hacen falta dos
              cloritos por cada platino, y el paréntesis para decirlo.
        pista: |
          Platinoso es Pt²⁺. El clorito viene del ácido cloroso, HClO₂.
        desarrollo: |
          $$
          \mathrm{Pt^{2+}} + 2\,\mathrm{ClO_2^-} \;\longrightarrow\; \mathrm{Pt(ClO_2)_2}
          $$

          El paréntesis es obligatorio: el 2 de fuera multiplica al grupo
          entero. Es la de la hoja de respuestas, que escribe platinoso sin
          tilde.

      - tipo: calcular
        titulo: 'El 7: nitrato mercúrico'
        pregunta: |
          Escribe la fórmula del nitrato mercúrico.
        respuesta:
          tipo: formula
          valor: Hg(NO3)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: HgNO3
            mensaje: |
              Ese sería el nitrato mercurioso, con el mercurio a +1.
              Mercúrico es el mayor de sus dos estados, Hg²⁺, y pide dos
              nitratos.
          - valor: Hg(NO2)2
            mensaje: |
              Ese es el nitrito mercúrico. El nitrato es el del nitrógeno a +5,
              HNO₃, con tres oxígenos: NO₃⁻.
          - valor: Hg2NO3
            mensaje: |
              Tienes el subíndice en el ion equivocado. El 2 es la carga del
              mercurio y baja al nitrato, que es el que tiene que estar dos
              veces.
        pista: |
          Mercúrico es Hg²⁺ y el nitrato es NO₃⁻.
        desarrollo: |
          $$
          \mathrm{Hg^{2+}} + 2\,\mathrm{NO_3^-} \;\longrightarrow\; \mathrm{Hg(NO_3)_2}
          $$

          Dos nitratos, y el paréntesis porque el 2 multiplica al grupo
          entero. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 8: metaborato estannoso'
        pregunta: |
          Escribe la fórmula del metaborato estannoso.
        respuesta:
          tipo: formula
          valor: Sn(BO2)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Sn3(BO3)2
            mensaje: |
              Ese es el (orto)borato estannoso, del H₃BO₃, con tres aguas. Meta
              es una sola agua sobre el B₂O₃, y el ácido, simplificado, es
              HBO₂.
          - valor: Sn(BO2)4
            mensaje: |
              Ese es el metaborato estánnico, con el estaño a +4. Estannoso es
              el menor de sus dos estados, Sn²⁺.
          - valor: SnBO2
            mensaje: |
              Sin cruzar, las cargas no cierran: +2 contra −1. Hacen falta dos
              metaboratos por cada estaño.
        pista: |
          Meta es el anhídrido más un agua: B₂O₃ y H₂O, que simplificado da
          HBO₂. Estannoso es Sn²⁺.
        desarrollo: |
          $$
          \mathrm{B_2O_3} + \mathrm{H_2O} \rightarrow \mathrm{H_2B_2O_4} \;\rightarrow\; \mathrm{HBO_2}\ \text{(simplificado)}
          $$

          El anión es BO₂⁻, y el Sn²⁺ necesita dos:
          $\mathrm{Sn(BO_2)_2}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 9: manganato niquélico'
        pregunta: |
          Escribe la fórmula del manganato niquélico.
        respuesta:
          tipo: formula
          valor: Ni2(MnO4)3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Ni(MnO4)3
            mensaje: |
              Ese sería el permanganato niquélico: tres MnO₄⁻ de una carga. El
              manganato es MnO₄²⁻, del H₂MnO₄, y con Ni³⁺ el cruce da 2 y 3.
          - valor: NiMnO4
            mensaje: |
              Ese es el manganato niqueloso, con el níquel a +2. Niquélico es
              Ni³⁺, el mayor de sus dos estados.
          - valor: Ni3(MnO4)2
            mensaje: |
              Has cruzado al revés. El 3 del níquel baja al manganato y el 2
              del manganato baja al níquel. Súmalo: 9+ contra 4− no es neutro.
        pista: |
          El manganato es MnO₄²⁻, con el manganeso a +6. Niquélico es Ni³⁺.
        desarrollo: |
          $$
          2\,\mathrm{Ni^{3+}} + 3\,\mathrm{MnO_4^{2-}} \;\longrightarrow\; \mathrm{Ni_2(MnO_4)_3}
          $$

          Seis cargas de cada signo. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 10: silicato cálcico'
        pregunta: |
          Escribe la fórmula del silicato cálcico.
        respuesta:
          tipo: formula
          valor: Ca2SiO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: CaSiO3
            mensaje: |
              Ese es el metasilicato cálcico, del H₂SiO₃. En el curso, silicato
              a secas es el orto, el que se puede omitir: H₄SiO₄, con el anión
              SiO₄⁴⁻. Hay libros que llaman silicato al CaSiO₃; en esta hoja
              no, y el metasilicato sale aparte, en el 21.
          - valor: CaSiO4
            mensaje: |
              Le has dado al silicato carga 2−, como al sulfato. Viene del
              H₄SiO₄, con cuatro hidrógenos: es 4−, y hacen falta dos Ca²⁺.
          - valor: Ca4(SiO4)2
            mensaje: |
              El cruce está bien y falta simplificar. Cuatro calcios y dos
              silicatos tienen un 2 en común: Ca₂SiO₄.
        pista: |
          El silicio solo tiene +4, y su ácido orto es el SiO₂ con dos aguas.
        desarrollo: |
          $$
          \mathrm{SiO_2} + 2\,\mathrm{H_2O} \rightarrow \mathrm{H_4SiO_4}
          $$

          Sin sus cuatro hidrógenos queda SiO₄⁴⁻, y con Ca²⁺ hacen falta dos:
          $\mathrm{Ca_2SiO_4}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 11: carbonato magnésico'
        pregunta: |
          Escribe la fórmula del carbonato magnésico.
        respuesta:
          tipo: formula
          valor: MgCO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: MnCO3
            mensaje: |
              Mn es el manganeso, y el MnCO₃ es el carbonato manganoso. El
              magnesio es Mg.
          - valor: Mg2(CO3)2
            mensaje: |
              Has cruzado sin simplificar. Con 2+ y 2− la proporción es uno a
              uno.
        pista: |
          El magnesio es Mg²⁺, y el carbonato, CO₃²⁻, del ácido carbónico.
        desarrollo: |
          $$
          \mathrm{Mg^{2+}} + \mathrm{CO_3^{2-}} \;\longrightarrow\; \mathrm{MgCO_3}
          $$

          Cargas iguales en valor, proporción uno a uno. Es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 12: sulfito amónico'
        pregunta: |
          Escribe la fórmula del sulfito amónico.
        respuesta:
          tipo: formula
          valor: (NH4)2SO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: (NH4)2SO4
            mensaje: |
              Ese es el sulfato amónico. El sulfito es el del azufre a +4,
              H₂SO₃, con tres oxígenos.
          - valor: NH4SO3
            mensaje: |
              Sin cruzar, las cargas no cierran: +1 contra −2. Hacen falta dos
              amonios por cada sulfito.
          - valor: NH42SO3
            mensaje: |
              Falta el paréntesis. Sin él, NH₄₂ dice cuarenta y dos
              hidrógenos: el 2 tiene que multiplicar al amonio entero, y eso
              se escribe (NH₄)₂SO₃.
        pista: |
          Amónico es el catión NH₄⁺. El sulfito es SO₃²⁻.
        desarrollo: |
          $$
          2\,\mathrm{NH_4^+} + \mathrm{SO_3^{2-}} \;\longrightarrow\; \mathrm{(NH_4)_2SO_3}
          $$

          El amonio es un grupo, y cuando lleva subíndice va entre paréntesis.
          Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena el método para formular una oxisal. Una pieza es falsa.
        piezas:
          - texto: 'Del nombre del anión sale el número de oxidación de su elemento: -ato el mayor, -ito el menor, y per- o hipo- en los extremos.'
          - texto: 'Con ese número se escribe el ácido, anhídrido más agua y simplificado, y al quitarle los hidrógenos queda el anión con tantas cargas como hidrógenos tenía.'
          - texto: 'El sufijo del metal da su carga, relativa a sus propios estados: platinoso es Pt²⁺ porque el platino tiene +2 y +4.'
          - texto: 'Se cruzan las cargas, se simplifica si se puede, y el anión va entre paréntesis si lleva subíndice.'
          - texto: 'Crómico es el cromo en su estado más alto, +6, así que el cloruro crómico es CrCl₆.'
            trampa: true
            mensaje: |
              El +6 es del cromo como no metal, el de los cromatos y los
              dicromatos. Como metal, que es como va en una sal delante del
              anión, el cromo tiene +2 y +3, y crómico es +3: CrCl₃.
    resolucion: |
      | n.º | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 1 | Au₂S₃ | sulfuro áurico | sulfuro de oro(III) |
      | 2 | KMnO₄ | permanganato potásico | permanganato de potasio |
      | 3 | CrCl₃ | cloruro crómico | cloruro de cromo(III) |
      | 4 | CuSO₄ | sulfato cúprico | sulfato de cobre(II) |
      | 5 | Zn₂As₂O₇ | piroarseniato de cinc | heptaoxodiarseniato(V) de cinc |
      | 6 | Pt(ClO₂)₂ | clorito platinoso | clorito de platino(II) |
      | 7 | Hg(NO₃)₂ | nitrato mercúrico | nitrato de mercurio(II) |
      | 8 | Sn(BO₂)₂ | metaborato estannoso | metaborato de estaño(II) |
      | 9 | Ni₂(MnO₄)₃ | manganato niquélico | manganato de níquel(III) |
      | 10 | Ca₂SiO₄ | (orto)silicato cálcico | tetraoxosilicato(IV) de calcio |
      | 11 | MgCO₃ | carbonato magnésico | trioxocarbonato(IV) de magnesio |
      | 12 | (NH₄)₂SO₃ | sulfito amónico | sulfito de amonio |

      **Lo que se lleva uno de este bloque.** El anión sale siempre del
      ácido: número de oxidación, anhídrido más agua, y fuera los
      hidrógenos. Así se ve que manganato y permanganato se escriben igual y
      llevan cargas distintas, 2− y 1−, y que el silicato del curso es el
      orto, 4−. Y el sufijo del metal es relativo a sus estados como metal:
      crómico es +3, no +6.

      Las doce fórmulas coinciden con las de la hoja de respuestas.

  - id: colfq1-f3-formular-del-13-al-25
    titulo: 'Hoja 3 de formulación: formular del 13 al 25, sales ácidas y oxisales'
    fuente: >-
      Ejercicios de formulación-3, formular del 13 al 25 · Fundamentos
      Químicos de la Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). La hoja de respuestas del material publica las trece
      fórmulas, y la del 17 tiene una errata: escribe CdH2(PO4)2, que no es
      neutro, por Cd(H₂PO₄)₂. Los distractores y el diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      Escribir la fórmula de los siguientes compuestos:

      13. Hipoclorito sódico
      14. Fosfito platínico
      15. Seleniato ácido de litio
      16. Bisulfuro potásico
      17. Fosfato diácido de cadmio
      18. Pirofosfito ácido cobáltico
      19. Bromato de magnesio
      20. Arseniato amónico
      21. Metasilicato de estroncio
      22. Telurato crómico
      23. Biseleniuro de plata
      24. Telurato ferroso
      25. Pirofosfato diácido plúmbico
    pide: La fórmula de los trece compuestos.

    pasos:
      - tipo: reconocer
        pregunta: |
          El 16 y el 23 llevan el prefijo bi-: bisulfuro potásico y
          biseleniuro de plata. ¿Qué quiere decir ese bi-?
        opciones:
          - texto: >-
              Que el ácido del que vienen tenía dos hidrógenos y conserva uno:
              del H₂S queda HS⁻, y del H₂Se, HSe⁻
            correcta: true
            mensaje: |
              Eso es. Bi- es la forma corta de decir «ácido» cuando el ácido
              de partida tiene dos hidrógenos: bisulfuro sódico y sulfuro ácido
              de sodio son el mismo NaHS, y bicarbonato y carbonato ácido, el
              mismo NaHCO₃. Con un ácido de tres o cuatro hidrógenos no vale,
              y hay que decir cuántos quedan.
          - texto: >-
              Que hay dos átomos de azufre, o de selenio, como en un disulfuro
            mensaje: |
              Aquí bi- no es di-. El disulfuro existe, S₂²⁻, pero es otro
              anión. En las sales ácidas bi- habla de hidrógenos: del H₂S se ha
              ido uno y el otro se queda.
          - texto: >-
              Que el anión conserva los dos hidrógenos
            mensaje: |
              Si el H₂S conservara los dos no habría sal: habría ácido
              sulfhídrico. Conserva **uno**, y el bi- dice que venía de un
              ácido con dos.
          - texto: >-
              Que el metal actúa con carga 2
            mensaje: |
              El prefijo va pegado al anión, no al metal. El potasio y la plata
              solo tienen +1, y el sufijo del metal, cuando hace falta, va
              detrás, como siempre.

      - tipo: calcular
        titulo: 'El 13: hipoclorito sódico'
        pregunta: |
          Escribe la fórmula del hipoclorito sódico.
        respuesta:
          tipo: formula
          valor: NaClO | NaOCl
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: NaClO4
            mensaje: |
              Ese es el perclorato sódico, con el cloro a +7. El hipoclorito es
              el del +1, HClO, con un solo oxígeno. Ojo, que la tabla 8 de las
              diapositivas de compuestos ternarios escribe NaClO₄ al lado de
              «hipoclorito sódico»: es una errata de la diapositiva.
          - valor: NaClO2
            mensaje: |
              Ese es el clorito sódico, con el cloro a +3. Hipo- es el más bajo
              de sus cuatro estados, el +1, y su ácido, el HClO, lleva un solo
              oxígeno.
        pista: |
          Hipo- y -oso es el +1 del cloro: ácido hipocloroso, HClO.
        desarrollo: |
          $$
          \mathrm{Cl_2O} + \mathrm{H_2O} \rightarrow \mathrm{H_2Cl_2O_2} \;\rightarrow\; \mathrm{HClO}\ \text{(simplificado)}
          $$

          Sin el hidrógeno queda ClO⁻, y con Na⁺ va uno a uno:
          $\mathrm{NaClO}$. Es la de la hoja de respuestas. También se escribe
          NaOCl, con los átomos en el orden en que van enlazados.

      - tipo: calcular
        titulo: 'El 14: fosfito platínico'
        pregunta: |
          Escribe la fórmula del fosfito platínico.
        respuesta:
          tipo: formula
          valor: Pt3(PO3)4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Pt3(PO3)2
            mensaje: |
              Ese es el fosfito platinoso, con el platino a +2. Platínico es
              Pt⁴⁺, y ese 4 es el que baja al fosfito.
          - valor: Pt(PO3)4
            mensaje: |
              Le has dado al PO₃ carga 1−, que es la del metafosfato (HPO₃, con
              el fósforo a +5): eso sería el metafosfato platínico. El fosfito
              viene del H₃PO₃ y es PO₃³⁻.
          - valor: Pt3(PO4)4
            mensaje: |
              Ese es el fosfato platínico. El fosfito es el del fósforo a +3,
              con tres oxígenos: PO₃³⁻.
        pista: |
          El fosfito viene del H₃PO₃: es PO₃³⁻. Platínico es Pt⁴⁺.
        desarrollo: |
          $$
          3\,\mathrm{Pt^{4+}} + 4\,\mathrm{PO_3^{3-}} \;\longrightarrow\; \mathrm{Pt_3(PO_3)_4}
          $$

          Doce cargas de cada signo, y el 3 y el 4 no tienen nada que
          simplificar. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 15: seleniato ácido de litio'
        pregunta: |
          Escribe la fórmula del seleniato ácido de litio.
        respuesta:
          tipo: formula
          valor: LiHSeO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Li2SeO4
            mensaje: |
              Ese es el seleniato de litio, con los dos hidrógenos del ácido
              sustituidos. «Ácido» dice que queda uno: HSeO₄⁻.
          - valor: LiHSeO3
            mensaje: |
              Ese es el selenito ácido de litio, con el selenio a +4. El
              seleniato es el del +6, H₂SeO₄, con cuatro oxígenos.
        pista: |
          El ácido selénico es H₂SeO₄. «Ácido» dice que conserva uno de sus dos
          hidrógenos.
        desarrollo: |
          Del H₂SeO₄ se va un hidrógeno y queda el otro: HSeO₄⁻, con una sola
          carga. Con Li⁺, uno a uno:

          $$
          \mathrm{Li^+} + \mathrm{HSeO_4^-} \;\longrightarrow\; \mathrm{LiHSeO_4}
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 16: bisulfuro potásico'
        pregunta: |
          Escribe la fórmula del bisulfuro potásico.
        respuesta:
          tipo: formula
          valor: KHS | KSH
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: K2S
            mensaje: |
              Ese es el sulfuro potásico, con los dos hidrógenos del H₂S
              sustituidos. Bi- dice que queda uno: HS⁻.
          - valor: KH2S
            mensaje: |
              Has leído bi- como dos hidrógenos. Súmalo: +1 del potasio, +2 de
              los hidrógenos y −2 del azufre no dan cero. Del H₂S queda uno, y
              el anión es HS⁻.
          - valor: KHSO4
            mensaje: |
              Ese es el bisulfato potásico, o sulfato ácido de potasio.
              Sulfuro es el azufre sin oxígenos, el del H₂S.
        pista: |
          El ácido sulfhídrico es H₂S. Bi- dice que conserva uno de sus dos
          hidrógenos.
        desarrollo: |
          $$
          \mathrm{K^+} + \mathrm{HS^-} \;\longrightarrow\; \mathrm{KHS}
          $$

          Es el mismo compuesto que el sulfuro ácido de potasio. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 17: fosfato diácido de cadmio'
        pregunta: |
          Escribe la fórmula del fosfato diácido de cadmio.
        respuesta:
          tipo: formula
          valor: Cd(H2PO4)2 | CdH4(PO4)2 | CdH4P2O8
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: CdH2(PO4)2
            mensaje: |
              Es la de la hoja de respuestas, y tiene una errata. Cada fosfato
              diácido lleva dos hidrógenos y hay dos fosfatos: cuatro en total.
              Con dos, las cargas no cierran,
              $(+2) + 2\times(+1) + 2\times(-3) = -2$. Lo correcto es
              Cd(H₂PO₄)₂, o CdH₄(PO₄)₂ si se juntan los hidrógenos.
          - valor: CdHPO4
            mensaje: |
              Ese es el fosfato ácido de cadmio, con un solo hidrógeno:
              HPO₄²⁻. Diácido son dos, H₂PO₄⁻, que se queda con una sola carga.
          - valor: CdH2PO4
            mensaje: |
              Sin cruzar, las cargas no cierran: el H₂PO₄⁻ tiene una carga y el
              Cd²⁺ dos. Hacen falta dos fosfatos diácidos por cada cadmio.
        pista: |
          Del H₃PO₄, diácido deja dos hidrógenos: H₂PO₄⁻. El cadmio es Cd²⁺.
        desarrollo: |
          $$
          \mathrm{Cd^{2+}} + 2\,\mathrm{H_2PO_4^-} \;\longrightarrow\; \mathrm{Cd(H_2PO_4)_2}
          $$

          Es el mismo esquema que el fosfato diácido férrico de las
          diapositivas, Fe(H₂PO₄)₃. La hoja de respuestas escribe
          CdH2(PO4)2, con dos hidrógenos donde hacen falta cuatro.

      - tipo: calcular
        titulo: 'El 18: pirofosfito ácido cobáltico'
        pregunta: |
          Escribe la fórmula del pirofosfito ácido cobáltico.
        respuesta:
          tipo: formula
          valor: CoHP2O5
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Co3(HP2O5)2
            mensaje: |
              Ese es el pirofosfito ácido cobaltoso, con el cobalto a +2.
              Cobáltico es Co³⁺, y con un anión de carga 3− va uno a uno.
          - valor: CoHP2O7
            mensaje: |
              Ese es el pirofosfato ácido cobáltico, con el fósforo a +5 y
              siete oxígenos. El pirofosfito es el del +3: H₄P₂O₅.
          - valor: Co4(P2O5)3
            mensaje: |
              Ese es el pirofosfito cobáltico, sin hidrógenos: P₂O₅⁴⁻. «Ácido»
              dice que queda uno, y entonces el anión es HP₂O₅³⁻.
        pista: |
          Pirofosforoso es el P₂O₃ con dos aguas: H₄P₂O₅. «Ácido» deja uno de
          sus cuatro hidrógenos.
        desarrollo: |
          $$
          \mathrm{P_2O_3} + 2\,\mathrm{H_2O} \rightarrow \mathrm{H_4P_2O_5}
          $$

          Se van tres hidrógenos y queda uno: HP₂O₅³⁻. Con Co³⁺, uno a uno:
          $\mathrm{CoHP_2O_5}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 19: bromato de magnesio'
        pregunta: |
          Escribe la fórmula del bromato de magnesio.
        respuesta:
          tipo: formula
          valor: Mg(BrO3)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: MgBrO3
            mensaje: |
              Sin cruzar, las cargas no cierran: +2 contra −1. Hacen falta dos
              bromatos por cada magnesio.
          - valor: Mg(BrO2)2
            mensaje: |
              Ese es el bromito de magnesio, con el bromo a +3. El bromato es
              el del +5, HBrO₃, con tres oxígenos.
          - valor: MgBr2
            mensaje: |
              Ese es el bromuro de magnesio, sin oxígenos. El bromato es el
              oxoanión BrO₃⁻.
        pista: |
          El bromato viene del ácido brómico, HBrO₃: es BrO₃⁻. El magnesio es
          Mg²⁺.
        desarrollo: |
          $$
          \mathrm{Mg^{2+}} + 2\,\mathrm{BrO_3^-} \;\longrightarrow\; \mathrm{Mg(BrO_3)_2}
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 20: arseniato amónico'
        pregunta: |
          Escribe la fórmula del arseniato amónico.
        respuesta:
          tipo: formula
          valor: (NH4)3AsO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: (NH4)3AsO3
            mensaje: |
              Ese es el arsenito amónico, con el arsénico a +3. El arseniato es
              el del +5, H₃AsO₄, con cuatro oxígenos.
          - valor: NH4AsO4
            mensaje: |
              Sin cruzar, las cargas no cierran: +1 contra −3. El arseniato
              viene del H₃AsO₄, con tres hidrógenos, y pide tres amonios.
        pista: |
          El arsénico se porta como el fósforo: el arseniato es AsO₄³⁻. Amónico
          es NH₄⁺.
        desarrollo: |
          $$
          3\,\mathrm{NH_4^+} + \mathrm{AsO_4^{3-}} \;\longrightarrow\; \mathrm{(NH_4)_3AsO_4}
          $$

          Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 21: metasilicato de estroncio'
        pregunta: |
          Escribe la fórmula del metasilicato de estroncio.
        respuesta:
          tipo: formula
          valor: SrSiO3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Sr2SiO4
            mensaje: |
              Ese es el (orto)silicato de estroncio, del H₄SiO₄. Meta es una
              sola agua sobre el SiO₂: H₂SiO₃, y su anión es SiO₃²⁻.
          - valor: SnSiO3
            mensaje: |
              Sn es el estaño, y el SnSiO₃ sería el metasilicato estannoso. El
              estroncio es Sr.
        pista: |
          Meta es el anhídrido más un agua: SiO₂ y H₂O. El estroncio es Sr²⁺.
        desarrollo: |
          $$
          \mathrm{SiO_2} + \mathrm{H_2O} \rightarrow \mathrm{H_2SiO_3}
          $$

          Sin sus dos hidrógenos queda SiO₃²⁻, y con Sr²⁺ va uno a uno:
          $\mathrm{SrSiO_3}$. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 22: telurato crómico'
        pregunta: |
          Escribe la fórmula del telurato crómico.
        respuesta:
          tipo: formula
          valor: Cr2(TeO4)3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: CrTeO4
            mensaje: |
              Ese es el telurato cromoso, con el cromo a +2. Crómico es Cr³⁺, y
              con un anión de carga 2− el cruce da 2 y 3.
          - valor: Cr2(TeO3)3
            mensaje: |
              Ese es el telurito crómico. El telurato es el del teluro a +6,
              H₂TeO₄, con cuatro oxígenos.
          - valor: Cr(TeO4)3
            mensaje: |
              Has tomado para crómico el +6, que es del cromo como no metal. En
              una sal el cromo va de metal, con +2 y +3, y crómico es Cr³⁺.
        pista: |
          El telurato es TeO₄²⁻. Crómico, como metal, es Cr³⁺.
        desarrollo: |
          $$
          2\,\mathrm{Cr^{3+}} + 3\,\mathrm{TeO_4^{2-}} \;\longrightarrow\; \mathrm{Cr_2(TeO_4)_3}
          $$

          Seis cargas de cada signo. Es la de la hoja de respuestas.

      - tipo: calcular
        titulo: 'El 23: biseleniuro de plata'
        pregunta: |
          Escribe la fórmula del biseleniuro de plata.
        respuesta:
          tipo: formula
          valor: AgHSe
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Ag2Se
            mensaje: |
              Ese es el seleniuro de plata, con los dos hidrógenos del H₂Se
              sustituidos. Bi- dice que queda uno: HSe⁻.
          - valor: Ag2Se2
            mensaje: |
              Has leído bi- como dos selenios, un diseleniuro. En las sales
              ácidas bi- habla de hidrógenos: del H₂Se queda uno, y el anión
              es HSe⁻.
          - valor: AgHSeO4
            mensaje: |
              Ese es el seleniato ácido de plata, con oxígenos. Seleniuro es el
              selenio solo, el del H₂Se.
        pista: |
          El ácido selenhídrico es H₂Se. Bi- dice que conserva uno de sus dos
          hidrógenos.
        desarrollo: |
          $$
          \mathrm{Ag^+} + \mathrm{HSe^-} \;\longrightarrow\; \mathrm{AgHSe}
          $$

          Es el mismo compuesto que el seleniuro ácido de plata. Es la de la
          hoja de respuestas.

      - tipo: calcular
        titulo: 'El 24: telurato ferroso'
        pregunta: |
          Escribe la fórmula del telurato ferroso.
        respuesta:
          tipo: formula
          valor: FeTeO4
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: Fe2(TeO4)3
            mensaje: |
              Ese es el telurato férrico, con el hierro a +3. Ferroso es Fe²⁺,
              y con TeO₄²⁻ va uno a uno.
          - valor: FeTeO3
            mensaje: |
              Ese es el telurito ferroso. El telurato lleva cuatro oxígenos,
              TeO₄²⁻, con el teluro a +6.
          - valor: Fe2(TeO4)2
            mensaje: |
              Has cruzado sin simplificar. Con 2+ y 2− la proporción es uno a
              uno.
        pista: |
          Ferroso es Fe²⁺, y el telurato, TeO₄²⁻.
        desarrollo: |
          $$
          \mathrm{Fe^{2+}} + \mathrm{TeO_4^{2-}} \;\longrightarrow\; \mathrm{FeTeO_4}
          $$

          Cargas iguales en valor, proporción uno a uno. Es la de la hoja de
          respuestas.

      - tipo: calcular
        titulo: 'El 25: pirofosfato diácido plúmbico'
        pregunta: |
          Escribe la fórmula del pirofosfato diácido plúmbico.
        respuesta:
          tipo: formula
          valor: Pb(H2P2O7)2 | PbH4(P2O7)2 | PbH4P4O14
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: PbH2P2O7
            mensaje: |
              Ese es el pirofosfato diácido plumboso, con el plomo a +2.
              Plúmbico es Pb⁴⁺, y con un anión de carga 2− hacen falta dos.
          - valor: Pb(H2PO4)4
            mensaje: |
              Ese es el fosfato diácido plúmbico, el del orto, H₃PO₄. Piro son
              dos aguas sobre el P₂O₅: H₄P₂O₇, con dos fósforos en el anión.
          - valor: PbP2O7
            mensaje: |
              Ese es el pirofosfato plúmbico, sin hidrógenos: P₂O₇⁴⁻. «Diácido»
              dice que quedan dos, y entonces el anión es H₂P₂O₇²⁻.
        pista: |
          Pirofosfórico es el P₂O₅ con dos aguas: H₄P₂O₇. Diácido deja dos
          hidrógenos, y plúmbico es Pb⁴⁺.
        desarrollo: |
          $$
          \mathrm{P_2O_5} + 2\,\mathrm{H_2O} \rightarrow \mathrm{H_4P_2O_7}
          $$

          Se van dos hidrógenos y quedan dos: H₂P₂O₇²⁻. El Pb⁴⁺ necesita dos:

          $$
          \mathrm{Pb^{4+}} + 2\,\mathrm{H_2P_2O_7^{2-}} \;\longrightarrow\; \mathrm{Pb(H_2P_2O_7)_2}
          $$

          Es la de la hoja de respuestas.

      - tipo: justificar
        pregunta: Ordena cómo se formula el pirofosfato diácido plúmbico. Una pieza es falsa.
        piezas:
          - texto: 'Pirofosfato es el anión del ácido pirofosfórico, H₄P₂O₇: P₂O₅ más dos aguas, con el fósforo a +5.'
          - texto: '«Diácido» dice que conserva dos de sus cuatro hidrógenos: el anión es H₂P₂O₇²⁻.'
          - texto: 'Plúmbico es el plomo con su estado mayor, Pb⁴⁺.'
          - texto: 'Hacen falta dos aniones de carga 2− por cada plomo: Pb(H₂P₂O₇)₂.'
          - texto: 'Los hidrógenos que conserva el anión no cambian su carga, que sigue siendo 4−, como la del pirofosfato.'
            trampa: true
            mensaje: |
              Cada hidrógeno que se queda anula una carga negativa: el P₂O₇⁴⁻
              con dos hidrógenos es H₂P₂O₇²⁻. Con 4− saldría PbH₂P₂O₇, y con el
              Pb⁴⁺ sus cargas no cierran:
              $(+4) + 2\times(+1) + 2\times(+5) + 7\times(-2) = +2$.
    resolucion: |
      | n.º | fórmula | tradicional | Stock o sistemática |
      |---|---|---|---|
      | 13 | NaClO | hipoclorito sódico | hipoclorito de sodio |
      | 14 | Pt₃(PO₃)₄ | fosfito platínico | fosfito de platino(IV) |
      | 15 | LiHSeO₄ | seleniato ácido de litio | hidrogenoseleniato de litio |
      | 16 | KHS | bisulfuro potásico | hidrogenosulfuro de potasio |
      | 17 | Cd(H₂PO₄)₂ | fosfato diácido de cadmio | dihidrogenofosfato de cadmio |
      | 18 | CoHP₂O₅ | pirofosfito ácido cobáltico | hidrogenopirofosfito de cobalto(III) |
      | 19 | Mg(BrO₃)₂ | bromato de magnesio | trioxobromato(V) de magnesio |
      | 20 | (NH₄)₃AsO₄ | arseniato amónico | arseniato de amonio |
      | 21 | SrSiO₃ | metasilicato de estroncio | trioxosilicato(IV) de estroncio |
      | 22 | Cr₂(TeO₄)₃ | telurato crómico | telurato de cromo(III) |
      | 23 | AgHSe | biseleniuro de plata | hidrogenoseleniuro de plata |
      | 24 | FeTeO₄ | telurato ferroso | telurato de hierro(II) |
      | 25 | Pb(H₂P₂O₇)₂ | pirofosfato diácido plúmbico | dihidrogenopirofosfato de plomo(IV) |

      **Lo que se lleva uno de este bloque.** Una sal ácida se formula como
      cualquier oxisal, con un paso más: cada hidrógeno que conserva el
      anión le quita una carga. Bi- vale para los ácidos de dos hidrógenos
      que conservan uno, HS⁻ y HSe⁻; con los de tres o cuatro se dice
      cuántos quedan, «ácido» o «diácido».

      **La errata de las respuestas oficiales.** La del 17 escribe
      CdH2(PO4)2, que no es neutro: faltan dos hidrógenos, y es Cd(H₂PO₄)₂.
