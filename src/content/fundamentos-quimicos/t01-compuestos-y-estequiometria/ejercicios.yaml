ejercicios:
  # ── Los dos primeros son NUESTROS (§08). Los ejercicios de examen de esta
  #    asignatura encadenan seis o siete apartados a la vez, así que no hay por
  #    dónde entrar: hace falta haber cruzado el puente del mol una sola vez, y
  #    haber pasado de una molaridad a un volumen de frasco una sola vez, antes
  #    de que las dos cosas vengan juntas dentro de una cadena industrial.
  - id: ejfq1-el-puente-del-mol-una-sola-vez
    titulo: Seis gramos de magnesio, y lo que pesa después
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se queman al aire 6,00 g de magnesio y todo el metal se convierte en
      óxido de magnesio:

      $$
      2\,\mathrm{Mg\,(s)} + \mathrm{O_2\,(g)} \rightarrow 2\,\mathrm{MgO\,(s)}
      $$

      Calcular la masa de óxido que se obtiene.

      **Datos:** masas atómicas (u): Mg = 24,31; O = 16,00.
    pide: La masa de óxido de magnesio, en gramos.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción produce **más** masa de óxido que la de magnesio de
          partida. ¿Se está creando materia?
        opciones:
          - texto: >-
              No: la masa que falta la aporta el oxígeno del aire, que también
              entra en la reacción
            correcta: true
            mensaje: |
              Exacto. La masa se conserva contando **todo** lo que entra, y el
              oxígeno entra aunque no lo hayas pesado tú. Los 3,95 g de
              diferencia son precisamente el oxígeno que se ha combinado.
          - texto: >-
              Sí: al oxidarse, el metal gana energía y con ella masa
            mensaje: |
              La equivalencia entre masa y energía existe, pero en una reacción
              química el efecto es de una parte en mil millones: no se mide con
              una balanza. Lo que explica la diferencia es mucho más simple.
          - texto: >-
              No, y por eso la masa de óxido tiene que ser también 6,00 g
            mensaje: |
              La masa total se conserva, pero la del **óxido** no tiene por qué
              ser la del magnesio: al óxido se le ha sumado el oxígeno. Lo que
              se conserva es magnesio + oxígeno = óxido.
          - texto: >-
              Depende de si el aire estaba seco
            mensaje: |
              La humedad podría dar reacciones secundarias, pero el enunciado
              dice que **todo** el metal se convierte en óxido. Con eso, la
              cuenta está cerrada.

      - tipo: calcular
        titulo: La masa de óxido
        pregunta: ¿Cuántos gramos de MgO se obtienen?
        respuesta:
          tipo: numero
          valor: '9.95'
          tolerancia: 0.1
          formato: la masa en gramos, con dos cifras decimales
        distractores:
          - valor: '6.00'
            mensaje: |
              Esa es la masa de magnesio de partida. El óxido pesa más porque
              lleva el oxígeno incorporado: cada átomo de Mg arrastra uno de O.
          - valor: '4.97'
            mensaje: |
              Has dividido entre dos por el coeficiente. Los coeficientes son
              **2 y 2**: hay un MgO por cada Mg, no uno por cada dos.
        pista: |
          Tres pasos y ninguno tiene truco: gramos de Mg a moles, moles de Mg a
          moles de MgO con la proporción de la ecuación, y moles de MgO a
          gramos.
        desarrollo: |
          $$
          n(\mathrm{Mg}) = \frac{6{,}00}{24{,}31} = 0{,}2468\ \text{mol}
          $$
          La ecuación es 2 a 2, así que
          $n(\mathrm{MgO}) = n(\mathrm{Mg})$:
          $$
          m(\mathrm{MgO}) = 0{,}2468\cdot 40{,}31 = 9{,}95\ \text{g}
          $$
          Los 3,95 g de más son el oxígeno que se ha combinado.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 6,00 g de magnesio son 0,2468 mol, dividiendo entre su masa
              atómica.
          - texto: >-
              Los coeficientes 2 y 2 dicen que sale un mol de MgO por cada mol
              de Mg, así que hay 0,2468 mol de óxido.
          - texto: >-
              Multiplicando por la masa molar del MgO, 40,31, salen 9,95 g.
          - texto: >-
              La diferencia, 3,95 g, es el oxígeno que se ha incorporado desde
              el aire.
          - texto: >-
              Como la masa se conserva, los gramos de producto tienen que ser
              iguales a los de magnesio de partida.
            trampa: true
            mensaje: |
              Lo que se conserva es la masa **total**, contando todos los
              reactivos. Aquí entra oxígeno del aire, así que el producto pesa
              más que el metal solo.

              Si el enunciado hubiera dado los gramos de oxígeno, podrías
              comprobarlo sumando: 6,00 de Mg más 3,95 de O son los 9,95 del
              óxido, exactos.
        veredicto: |
          El puente del mol tiene tres tramos, y el del medio —la proporción de
          la ecuación— es el único que cambia de un ejercicio a otro.

    resolucion: |
      **La idea.** Una ecuación ajustada habla de partículas y una balanza
      habla de gramos. El mol traduce entre las dos, y este ejercicio es el
      viaje completo en su versión más corta.

      $$
      n(\mathrm{Mg}) = \frac{6{,}00}{24{,}31} = 0{,}2468\ \text{mol}
      $$

      La proporción de la ecuación es 2 a 2, o sea uno a uno, así que hay
      tantos moles de óxido como de metal. Multiplicando por su masa molar:

      $$
      \boxed{\;m(\mathrm{MgO}) = 0{,}2468\cdot 40{,}31 = 9{,}95\ \text{g}\;}
      $$

      **Comprobación que conviene hacerse siempre:** el óxido pesa 3,95 g más
      que el metal, y eso son exactamente 0,2468 mol de átomos de oxígeno
      —0,2468 × 16,00 = 3,95—. Cuando el balance de masas cuadra, el ejercicio
      está bien.

  - id: ejfq1-del-frasco-al-matraz
    titulo: Del frasco al matraz, cruzando la riqueza y la densidad
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      En el laboratorio hay un frasco de ácido clorhídrico comercial con la
      etiqueta: **37 % en masa, densidad 1,18 g/mL**.

      Calcular qué volumen de ese ácido hay que tomar para preparar 250 mL de
      una disolución 0,10 M.

      **Datos:** masas atómicas (u): H = 1,01; Cl = 35,45.
    pide: El volumen de ácido comercial que hay que medir, en mililitros.

    pasos:
      - tipo: reconocer
        pregunta: |
          La etiqueta da dos números, 37 % y 1,18 g/mL. ¿Para qué sirve cada
          uno?
        opciones:
          - texto: >-
              El 37 % pasa de gramos de HCl puro a gramos de disolución, y la
              densidad de gramos de disolución a mililitros
            correcta: true
            mensaje: |
              Eso es, y ese es el orden. Son dos conversiones encadenadas, y
              cada una tiene su dato: la riqueza dice cuánto del frasco es
              ácido de verdad, y la densidad cuánto ocupa lo que pesas.
          - texto: >-
              El 37 % da el volumen y la densidad la concentración
            mensaje: |
              Una riqueza en masa no da volúmenes: relaciona dos masas, la del
              producto puro y la de la disolución que lo contiene.
          - texto: >-
              La densidad sobra: con la riqueza basta para pasar a mililitros
            mensaje: |
              Con la riqueza llegas a **gramos de disolución**, y lo que se
              mide con una pipeta son mililitros. Sin densidad no se puede
              cerrar.
          - texto: >-
              Los dos dicen lo mismo, y se usa el que resulte más cómodo
            mensaje: |
              No: uno relaciona masa con masa y el otro masa con volumen. Hacen
              falta los dos, y en ese orden.

      - tipo: calcular
        titulo: El volumen que hay que medir
        pregunta: ¿Cuántos mililitros del frasco hay que tomar?
        respuesta:
          tipo: numero
          valor: '2.09'
          tolerancia: 0.06
          formato: el volumen en mL, con dos cifras decimales
        distractores:
          - valor: '0.77'
            mensaje: |
              Te has saltado la riqueza. Has convertido a volumen los 0,91 g de
              **ácido puro**, pero en el frasco esos gramos vienen dentro de
              2,46 g de disolución.
          - valor: '2.46'
            mensaje: |
              Esos son los **gramos** de disolución, no los mililitros. Falta
              dividir entre la densidad.
        pista: |
          Empieza por los moles que necesita el matraz, y de ahí hacia atrás:
          gramos de HCl puro, gramos de disolución del frasco, y mililitros.
        desarrollo: |
          $$
          n = 0{,}250\cdot 0{,}10 = 0{,}025\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{HCl}) = 0{,}025\cdot 36{,}46 = 0{,}9115\ \text{g}
          $$
          $$
          m_{\text{disolución}} = \frac{0{,}9115}{0{,}37} = 2{,}464\ \text{g}
          \;\Longrightarrow\;
          V = \frac{2{,}464}{1{,}18} = 2{,}09\ \text{mL}
          $$

      - tipo: justificar
        pregunta: Ordena el procedimiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El matraz de 250 mL a 0,10 M necesita 0,025 mol de HCl.
          - texto: >-
              Esos moles son 0,9115 g de ácido puro, multiplicando por su masa
              molar 36,46.
          - texto: >-
              Como el frasco está al 37 %, esos gramos puros vienen dentro de
              0,9115 / 0,37 = 2,464 g de disolución.
          - texto: >-
              Dividiendo entre la densidad, 2,464 / 1,18 = 2,09 mL, que es lo
              que hay que pipetear.
          - texto: >-
              Se enrasa el matraz con agua hasta los 250 mL, no se añaden
              250 mL de agua.
          - texto: >-
              Como la riqueza es del 37 %, hay que multiplicar los gramos de
              ácido puro por 0,37 para saber cuánta disolución tomar.
            trampa: true
            mensaje: |
              Al revés: se **divide**. Si solo el 37 % del frasco es ácido,
              hace falta **más** disolución que ácido puro, no menos.

              La comprobación mental: multiplicando saldrían 0,34 g de
              disolución para obtener 0,91 g de ácido, o sea más producto que
              recipiente. Cuando un resultado es imposible, el error suele
              estar en el sentido de la división.
        veredicto: |
          Dos conversiones y un enrase. Y la última pieza no es un detalle de
          laboratorio: enrasar a 250 mL y añadir 250 mL de agua dan
          concentraciones distintas.

    resolucion: |
      **La idea.** Un reactivo de laboratorio nunca es puro, y lo que se mide
      con una pipeta son mililitros. Entre «los moles que quiero» y «los
      mililitros que pipeteo» hay dos conversiones, y cada una tiene su dato en
      la etiqueta.

      $$
      \underbrace{0{,}025\ \text{mol}}_{\text{lo que pide el matraz}}
      \;\xrightarrow{\;\times 36{,}46\;}\;
      0{,}9115\ \text{g de HCl}
      \;\xrightarrow{\;\div\,0{,}37\;}\;
      2{,}464\ \text{g de disolución}
      \;\xrightarrow{\;\div\,1{,}18\;}\;
      \boxed{2{,}09\ \text{mL}}
      $$

      **Las dos divisiones van en ese sentido y conviene razonarlo.** Si solo
      el 37 % del frasco es ácido, para tener 0,91 g de ácido hace falta más
      de un gramo de disolución: se divide. Y si cada mililitro pesa 1,18 g,
      para tener 2,46 g hacen falta menos de 2,46 mL: se divide otra vez.

      **Y el detalle de laboratorio que también se pregunta:** esos 2,09 mL se
      echan en el matraz y se **enrasa** con agua hasta la marca de 250 mL. No
      es lo mismo que añadir 250 mL de agua — eso daría 252 mL de disolución y
      una concentración algo menor.

      Este camino, con estos dos datos de etiqueta, es el que cierra casi
      todos los ejercicios largos de la asignatura. En el examen de 2024-2025
      aparece con sulfúrico al 98 %, y en el control de 2023-2024 con sulfúrico
      al 97 %: cambian los números, no el recorrido.

  # ── Y a partir de aquí, los tres problemas de la autoevaluación del tema,
  #    en su orden (§04). Es el único material de colección del tema 1 y viene
  #    RESUELTO: la hoja de resolución da todos los números intermedios, así
  #    que aquí lo nuestro no es la respuesta sino el diagnóstico.
  - id: colfq1-1-el-sulfato-amonico-y-el-abono
    titulo: El sulfato amónico, y un limitante que no es el que pesa una tonelada
    fuente: >-
      Problema 1 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      La síntesis de sulfato amónico, importante componente de determinados
      fertilizantes nitrogenados, se basa en la siguiente reacción en medio
      acuoso:

      Sulfato cálcico + anhídrido carbónico + amoniaco + agua → carbonato
      cálcico + sulfato amónico

      Calcular:

      **a)** ¿Qué cantidad de sulfato amónico se obtendrá si se dispone de una
      tonelada de sulfato cálcico y 4.870 moles de anhídrido carbónico,
      suponiendo que el rendimiento del proceso es del 90%?

      **b)** ¿Qué volumen de solución de amoníaco del 24% y de densidad
      0,9102 g/cm³ sería necesario emplear por cada tonelada de sulfato
      amónico obtenido? Indicar cuál sería la molaridad y molalidad de la
      solución de amoniaco.

      **c)** ¿Cuál sería el contenido en nitrógeno (%) de un abono que
      estuviera constituido en un 80% por sulfato amónico?
    pide: La masa de sulfato amónico, la concentración de la disolución de amoniaco y el nitrógeno del abono.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da **una tonelada** de sulfato cálcico y 4.870 moles de
          anhídrido carbónico. ¿Cuál es el reactivo limitante?
        opciones:
          - texto: El anhídrido carbónico, porque hay menos moles y la reacción va uno a uno
            correcta: true
            mensaje: |
              Eso es. Una tonelada suena a mucho, pero son
              $10^{6}/136 = 7353$ moles frente a 4870 del CO₂, y la ecuación
              ajustada los consume en proporción 1:1. Manda quien tenga menos
              **moles**, no quien pese más.
          - texto: El sulfato cálcico, porque es el que se da en masa y define la escala
            mensaje: |
              Que un dato venga en toneladas no lo convierte en limitante. Hay
              que pasarlo a moles primero, y al hacerlo salen 7353 frente a
              4870: sobra sulfato cálcico.
          - texto: El amoniaco, porque lleva coeficiente 2
            mensaje: |
              El enunciado no da cantidad de amoniaco: lo pregunta en el
              apartado b. Un reactivo del que no se dice cuánto hay se supone
              en exceso.
          - texto: No se puede saber sin ajustar la ecuación
            mensaje: |
              Ajustarla hace falta, y por eso es el primer paso — pero se
              puede: los dos reactivos con dato entran con coeficiente 1, así
              que basta comparar moles.

      - tipo: calcular
        titulo: El sulfato amónico obtenido
        pregunta: |
          Con un rendimiento del 90 %, ¿cuántas toneladas de sulfato amónico
          se obtienen?
        respuesta:
          tipo: numero
          valor: '0.579'
          tolerancia: 0.005
          formato: un número, con tres decimales, en toneladas
        distractores:
          - valor: '0.643'
            mensaje: |
              Has olvidado el rendimiento. Esos 0,643 T son lo que saldría si
              la reacción fuera completa; solo se aprovecha el 90 %.
          - valor: '0.874'
            mensaje: |
              Has usado el sulfato cálcico como limitante. Son 7353 moles
              frente a 4870 del CO₂, así que el que se acaba primero es el
              segundo.
          - valor: '4383'
            mensaje: |
              Esos son los **moles** de sulfato amónico. Falta multiplicar por
              la masa molar, 132 g/mol, y pasar de gramos a toneladas.
        pista: |
          4.870 moles de CO₂ dan como mucho 4.870 de sulfato amónico. Aplica el
          90 % y multiplica por 132 g/mol.
        desarrollo: |
          $$
          4870 \times 0{,}9 = 4383 \ \mathrm{mol\ de\ (NH_4)_2SO_4}
          $$

          $$
          4383 \times 132 = 578556\ \mathrm{g} = 0{,}579\ \mathrm{T}
          $$

      - tipo: calcular
        titulo: La molaridad de la disolución de amoniaco
        pregunta: |
          Para la disolución del 24 % con densidad 0,9102 g/cm³, ¿cuál es su
          molaridad?
        respuesta:
          tipo: numero
          valor: '12.85'
          tolerancia: 0.05
          formato: un número, con dos decimales, en moles por litro
        distractores:
          - valor: '53.54'
            mensaje: |
              Has usado los 910,2 g de **disolución** como si fueran de
              amoniaco. Solo el 24 % lo es: 218,45 g.
          - valor: '18.58'
            mensaje: |
              Esa es la **molalidad**, que divide entre los kilos de
              disolvente y no entre los litros de disolución. Son dos cosas
              distintas y el enunciado pide las dos.
          - valor: '14.11'
            mensaje: |
              Parece que has dividido entre la masa de disolvente en vez de
              entre el volumen. Comprueba qué va en el denominador de cada una.
        pista: |
          Un litro de disolución pesa 910,2 g. De esos, el 24 % es amoniaco.
        desarrollo: |
          En un litro:

          $$
          0{,}9102 \times 1000 = 910{,}2\ \text{g de disolución}
          $$

          $$
          910{,}2 \times 0{,}24 = 218{,}45\ \mathrm{g\ de\ NH_3}
          $$

          $$
          M = \frac{218{,}45 / 17}{1} = 12{,}85\ \mathrm{M}
          $$

          Y la molalidad usa el disolvente, que es lo que queda:
          $910{,}2 - 218{,}45 = 691{,}75$ g, así que
          $m = 12{,}85 / 0{,}69175 = 18{,}58$ molal.

      - tipo: justificar
        pregunta: Ordena el argumento del apartado c. Una pieza es falsa.
        piezas:
          - texto: 'Cada mol de (NH₄)₂SO₄ pesa 132 g y lleva dos átomos de nitrógeno, o sea 28 g de N.'
          - texto: 'Así que el sulfato amónico puro tiene 28/132 × 100 = 21,21 % de nitrógeno.'
          - texto: 'El abono no es sulfato amónico puro: solo un 80 % lo es.'
          - texto: 'Por tanto su contenido en nitrógeno es 21,21 × 0,80 = 16,97 %.'
          - texto: 'Como el abono tiene un 80 % de sulfato amónico, el otro 20 % también aporta nitrógeno en alguna proporción.'
            trampa: true
            mensaje: |
              El enunciado no dice qué es ese 20 % y no se puede suponer.
              Puede ser carga inerte, otro nutriente o cualquier cosa; lo
              único que se sabe es que el nitrógeno **contabilizado** viene del
              sulfato amónico. Inventarle una aportación al resto sería añadir
              un dato que nadie ha dado.
    resolucion: |
      **a · El limitante, que es el truco del apartado.** Lo primero es
      ajustar:

      $$
      \mathrm{CaSO_4} + \mathrm{CO_2} + 2\,\mathrm{NH_3} + \mathrm{H_2O} \;\longrightarrow\; \mathrm{CaCO_3} + \mathrm{(NH_4)_2SO_4}
      $$

      Y después comparar **moles**, no masas:

      $$
      \frac{10^{6}}{136} = 7353\ \mathrm{mol\ de\ CaSO_4} \qquad 4870\ \mathrm{mol\ de\ CO_2}
      $$

      Los dos entran con coeficiente 1, así que el CO₂ se acaba antes y es el
      limitante. Una tonelada impresiona y no decide nada: lo que decide es el
      recuento de partículas.

      $$
      4870 \times 0{,}9 \times 132 = 578556\ \mathrm{g} = \mathbf{0{,}579\ T}
      $$

      **b · La disolución de amoniaco.** Se razona sobre **un litro**, que es
      lo que hace corto el cálculo:

      | | |
      |---|---|
      | masa de un litro | $0{,}9102 \times 1000 = 910{,}2$ g |
      | amoniaco, el 24 % | $218{,}45$ g |
      | disolvente, el resto | $691{,}75$ g |

      $$
      M = \frac{218{,}45/17}{1\ \mathrm{L}} = 12{,}85\ \mathrm{M} \qquad m = \frac{218{,}45/17}{0{,}69175\ \mathrm{kg}} = 18{,}58\ \mathrm{molal}
      $$

      **La diferencia entre las dos**, que es lo que este apartado evalúa: la
      molaridad divide entre el **volumen de disolución** y la molalidad entre
      la **masa de disolvente**. En una disolución diluida los dos números se
      parecen y no se nota el error; aquí, con un 24 %, se llevan casi seis
      unidades.

      Y el volumen que pide el enunciado sale de los moles de amoniaco
      necesarios para una tonelada de producto —contando el rendimiento del
      90 %— divididos por esa molaridad.

      **c · El nitrógeno del abono, en dos pasos.**

      $$
      \frac{28}{132} \times 100 = 21{,}21
      $$

      es decir, un **21,21 % de nitrógeno** en el sulfato amónico puro.

      $$
      21{,}21 \times 0{,}80 = \mathbf{16{,}97\ \%} \quad\text{en el abono}
      $$

      El 28 sale de que cada fórmula lleva **dos** nitrógenos. Poner 14 es el
      fallo típico y da la mitad.

  - id: colfq1-2-el-sulfurico-que-se-diluye-dos-veces
    titulo: Un ácido concentrado, agua, y después más ácido
    fuente: >-
      Problema 2 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      **a)** Se mezclan 200 mL de una solución de ácido sulfúrico del 98% en
      peso y de densidad 1,844 g/mL con 500 mL de agua. ¿Cuál es la
      concentración de la solución resultante expresada como molaridad,
      molalidad y normalidad?

      **b)** La solución resultante en el apartado a) se mezcla con 300 mL de
      una solución de ácido sulfúrico 2 M. ¿Cuál es la concentración de la
      solución final expresada como molaridad y normalidad?
    pide: La molaridad, molalidad y normalidad de la mezcla, y las de la mezcla final.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al mezclar los 200 mL de ácido con los 500 mL de agua, ¿qué se
          conserva y qué no?
        opciones:
          - texto: Se conservan los moles de soluto; la concentración y el volumen cambian
            correcta: true
            mensaje: |
              Eso es lo único que hay que recordar de una dilución. El soluto
              es el mismo, solo está repartido en más sitio: los moles no se
              tocan y la molaridad baja en la proporción del volumen.
          - texto: Se conserva la molaridad, porque es una propiedad del ácido
            mensaje: |
              La molaridad no es una propiedad del ácido sino de **la
              disolución**. Si se conservara al diluir, diluir no serviría
              para nada.
          - texto: Se conserva la masa de disolución pero no los moles
            mensaje: |
              Es justo al revés. La masa total también se conserva —nada se
              evapora— pero lo que sirve para calcular es que **los moles de
              soluto** siguen siendo los mismos.
          - texto: No se conserva nada; hay que recalcularlo todo desde cero
            mensaje: |
              Si no se conservara nada no habría forma de resolverlo. La
              cantidad de ácido puro que había en los 200 mL sigue estando
              ahí después de añadir agua.

      - tipo: calcular
        titulo: La molaridad tras diluir
        pregunta: |
          ¿Cuál es la molaridad de la disolución resultante del apartado a?
        respuesta:
          tipo: numero
          valor: '5.27'
          tolerancia: 0.02
          formato: un número, con dos decimales, en moles por litro
        distractores:
          - valor: '18.44'
            mensaje: |
              Esa es la molaridad del ácido **concentrado**, antes de añadir el
              agua. Los mismos moles en 0,2 L en vez de en 0,7.
          - valor: '3.688'
            mensaje: |
              Esos son los **moles** de ácido, que es el paso intermedio.
              Falta dividir entre el volumen total en litros.
          - valor: '10.54'
            mensaje: |
              Esa es la **normalidad**, que para el sulfúrico es el doble de la
              molaridad porque cede dos protones.
        pista: |
          Masa de disolución, masa de ácido puro, moles, y divide entre
          $0{,}2 + 0{,}5$ litros.
        desarrollo: |
          $$
          1{,}844 \times 200 = 368{,}8\ \text{g de disolución}
          $$

          $$
          368{,}8 \times 0{,}98 = 361{,}424\ \mathrm{g\ de\ H_2SO_4}
          $$

          $$
          M = \frac{361{,}424/98}{0{,}7} = 5{,}27\ \mathrm{M}
          $$

          Y la normalidad, $N = 5{,}27 \times 2 = 10{,}54$, porque el sulfúrico
          es diprótico.

      - tipo: calcular
        titulo: La molalidad, que no divide por lo mismo
        pregunta: |
          ¿Y la molalidad de esa misma disolución?
        respuesta:
          tipo: numero
          valor: '7.27'
          tolerancia: 0.03
          formato: un número, con dos decimales, en moles por kilo
        distractores:
          - valor: '5.27'
            mensaje: |
              Esa es la molaridad. La molalidad divide entre los **kilos de
              disolvente**, no entre los litros de disolución, y aquí los dos
              números no se parecen.
          - valor: '3.688'
            mensaje: |
              Esos son los moles de soluto. Falta dividir entre la masa de
              disolvente en kilos.
        pista: |
          El disolvente son los 500 g de agua **más** el agua que ya traía la
          disolución concentrada, que es $368{,}8 - 361{,}424$.
        desarrollo: |
          El ácido concentrado no era puro: de sus 368,8 g, solo 361,424 eran
          ácido, así que aportaba $7{,}376$ g de agua.

          $$
          m = \frac{361{,}424/98}{(7{,}376 + 500) \times 10^{-3}} = 7{,}27\ \mathrm{molal}
          $$

          Olvidar esos 7,4 g cambia el resultado en una centésima aquí, pero
          en una disolución más concentrada cambia mucho más: el hábito de
          contarlos es lo que hay que llevarse.

      - tipo: calcular
        titulo: La mezcla final
        pregunta: |
          Añadiendo 300 mL de sulfúrico 2 M a los 700 mL anteriores, ¿cuál es
          la molaridad final?
        respuesta:
          tipo: numero
          valor: '4.288'
          tolerancia: 0.01
          formato: un número, con tres decimales, en moles por litro
        distractores:
          - valor: '3.635'
            mensaje: |
              Has hecho la media de las dos molaridades, $(5{,}27 + 2)/2$. No
              vale: las dos disoluciones aportan volúmenes distintos, así que
              hay que sumar **moles** y dividir entre el volumen total.
          - valor: '7.27'
            mensaje: |
              Has sumado las dos concentraciones. Al mezclar dos disoluciones
              del mismo soluto la concentración final queda **entre** las dos,
              nunca por encima de la mayor.
          - valor: '5.27'
            mensaje: |
              Esa es la del apartado a. Añadir una disolución más diluida tiene
              que bajarla.
        pista: |
          Suma los moles de las dos y divide entre $0{,}7 + 0{,}3$.
        desarrollo: |
          $$
          M = \frac{361{,}424/98 + 2 \times 0{,}3}{0{,}7 + 0{,}3} = \frac{3{,}688 + 0{,}6}{1} = 4{,}288\ \mathrm{M}
          $$

          Y $N = 4{,}288 \times 2 = 8{,}576$.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Los 200 mL del concentrado pesan 1,844 × 200 = 368,8 g, de los que el 98 % —361,424 g— es ácido puro.'
          - texto: 'Eso son 3,688 moles, que no cambian al añadir agua: lo único que cambia es el volumen, que pasa a 0,7 L.'
          - texto: 'Así que M = 5,27 y N = 10,54, porque el sulfúrico cede dos protones.'
          - texto: 'La molalidad divide entre el disolvente, que son los 500 g de agua más los 7,376 g que traía el concentrado: 7,27 molal.'
          - texto: 'Al añadir 300 mL de 2 M se suman 0,6 moles más y el volumen pasa a 1 L, así que la molaridad final es 4,288.'
          - texto: 'Al mezclar dos disoluciones del mismo ácido, la concentración final es la media de las dos.'
            trampa: true
            mensaje: |
              Solo si los dos volúmenes fueran iguales, y aquí son 700 y 300
              mL. La media daría 3,635 y el resultado es 4,288: la disolución
              más concentrada aporta más volumen y tira del resultado hacia
              ella. Se suman moles y se divide entre el volumen total, siempre.
    resolucion: |
      **a · Del frasco comercial a la disolución.** Un reactivo comercial se
      describe con dos datos que hay que usar en orden: la **densidad** lleva
      de volumen a masa de disolución, y la **riqueza** de ahí a masa de
      soluto.

      $$
      1{,}844 \times 200 = 368{,}8\ \text{g de disolución} \;\longrightarrow\; \times 0{,}98 = 361{,}424\ \mathrm{g\ de\ H_2SO_4}
      $$

      $$
      n = \frac{361{,}424}{98} = 3{,}688\ \mathrm{mol}
      $$

      Esos moles **no cambian** al añadir agua. Lo que cambia es el volumen:

      $$
      M = \frac{3{,}688}{0{,}7} = 5{,}27\ \mathrm{M} \qquad N = 2M = 10{,}54\ \mathrm{N}
      $$

      **La molalidad, y el detalle que se olvida.** Divide entre los kilos de
      **disolvente**, y el disolvente no son solo los 500 g de agua añadida:
      la disolución concentrada traía ya $368{,}8 - 361{,}424 = 7{,}376$ g.

      $$
      m = \frac{3{,}688}{0{,}507376} = 7{,}27\ \mathrm{molal}
      $$

      **b · Mezclar dos disoluciones del mismo soluto.** Se suman moles y se
      divide entre el volumen total. Nunca se promedian concentraciones:

      $$
      M = \frac{3{,}688 + 2 \times 0{,}3}{1{,}0} = 4{,}288\ \mathrm{M} \qquad N = 8{,}576\ \mathrm{N}
      $$

      **Las tres comprobaciones que salvan el ejercicio.**

      La primera es de **sentido**: al diluir, la molaridad baja; al mezclar
      con algo más diluido, también. Si te sale un número mayor que 5,27 en el
      apartado b, hay un error antes de mirar las cuentas.

      La segunda es la **normalidad**: para el sulfúrico es el doble de la
      molaridad, siempre, porque cede dos protones. Para el clorhídrico serían
      iguales.

      Y la tercera es el **disolvente que ya venía dentro**. Aquí son 7,4 g
      sobre 507 y apenas se nota; en un problema con menos agua añadida
      decidiría la respuesta.

  - id: colfq1-3-la-niacina-y-las-dos-muestras
    titulo: La niacina, y un nitrógeno medido sobre otra muestra
    fuente: >-
      Problema 3 · Autoevaluación del tema 1 · Fundamentos Químicos de la
      Ingeniería (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La
      hoja de resolución publica el desarrollo completo; los distractores y el
      diagnóstico son nuestros.
    nivel: practica
    enunciado: |
      La niacina o ácido nicotínico se comercializa en forma de polvo blanco
      cristalino y presenta un peso molecular de 123 g/mol. Este compuesto está
      formado por C, H, O y N. La combustión de 2,50 g de niacina produce
      5,36 g de dióxido de carbono y 0,91 g de agua. Por otro lado, un análisis
      realizado a 3,50 g de muestra con un determinado método analítico
      proporcionó un valor de 1,31 g de dióxido de nitrógeno. Calcular la
      fórmula molecular de la niacina.
    pide: La fórmula molecular de la niacina.

    pasos:
      - tipo: reconocer
        pregunta: |
          La combustión se hace sobre 2,50 g y el análisis de nitrógeno sobre
          3,50 g. ¿Qué hay que hacer con eso?
        opciones:
          - texto: Escalar el nitrógeno a los 2,50 g, para que todo se refiera a la misma muestra
            correcta: true
            mensaje: |
              Ese es el paso que decide el problema. Los porcentajes de una
              fórmula empírica salen de comparar masas **de la misma muestra**,
              así que hay que llevar el nitrógeno de 3,50 a 2,50 g antes de
              comparar nada.
          - texto: Nada; los porcentajes salen igual con cualquier muestra
            mensaje: |
              Salen igual si se calculan **como porcentajes**. Pero aquí se van
              a restar gramos para sacar el oxígeno por diferencia, y para eso
              todas las masas tienen que ser de la misma muestra.
          - texto: Sumar las dos muestras y trabajar con 6,00 g
            mensaje: |
              No son dos partes de un mismo análisis: son dos análisis
              distintos sobre porciones distintas del mismo compuesto. Sumarlas
              no significa nada.
          - texto: Usar 3,50 g para todo, porque es la muestra mayor
            mensaje: |
              Entonces el carbono y el hidrógeno estarían mal escalados. Da
              igual a cuál de las dos se lleve todo — lo que no vale es
              mezclarlas.

      - tipo: calcular
        titulo: Los moles de carbono
        pregunta: |
          De los 5,36 g de CO₂, ¿cuántos moles de átomos de carbono salen?
        respuesta:
          tipo: numero
          valor: '0.1218'
          tolerancia: 0.0005
          formato: un número, con cuatro decimales, en moles
        distractores:
          - valor: '0.4467'
            mensaje: |
              Has dividido entre 12 en vez de entre 44. Los 5,36 g son de
              **dióxido de carbono**, no de carbono: primero moles de CO₂ y
              después, uno a uno, moles de C.
          - valor: '1.4618'
            mensaje: |
              Esos son los **gramos** de carbono, que es el paso siguiente. La
              pregunta es por moles.
          - valor: '0.0609'
            mensaje: |
              Has dividido por dos en algún sitio, quizá contando dos carbonos
              por molécula de CO₂. Solo lleva uno.
        pista: |
          $5{,}36 / 44$, y cada CO₂ lleva un solo carbono.
        desarrollo: |
          $$
          \frac{5{,}36}{44} = 0{,}1218\ \mathrm{mol\ de\ CO_2} = 0{,}1218\ \mathrm{mol\ de\ C}
          $$

          Y en gramos, $0{,}1218 \times 12 = 1{,}4618$ g.

      - tipo: calcular
        titulo: El oxígeno, que no se mide
        pregunta: |
          Con 1,4618 g de C, 0,1011 g de H y 0,2848 g de N en los 2,50 g de
          muestra, ¿cuántos gramos de oxígeno hay?
        respuesta:
          tipo: numero
          valor: '0.6523'
          tolerancia: 0.002
          formato: un número, con cuatro decimales, en gramos
        distractores:
          - valor: '1.8477'
            mensaje: |
              Has sumado los tres en vez de restarlos del total. El oxígeno es
              lo que **sobra** de la muestra una vez descontados los otros.
          - valor: '0.3675'
            mensaje: |
              Parece que has usado 3,50 g como masa de muestra. Todas las
              masas están referidas a los 2,50 g de la combustión.
        pista: |
          El oxígeno no se mide en ninguno de los dos análisis: sale por
          diferencia.
        desarrollo: |
          $$
          2{,}50 - (1{,}4618 + 0{,}1011 + 0{,}2848) = 0{,}6523\ \mathrm{g\ de\ O}
          $$

          Es el único elemento que no se determina: se obtiene restando, y por
          eso arrastra el error de los otros tres.

      - tipo: calcular
        titulo: La fórmula molecular
        pregunta: |
          Dividiendo los cuatro entre el menor y comprobando con la masa
          molecular de 123 g/mol, ¿cuál es la fórmula molecular?
        respuesta:
          tipo: formula
          valor: C6H5NO2
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: C6H5N2O2
            mensaje: |
              Sobra un nitrógeno. Los 0,0203 moles de N son justo el menor de
              los cuatro, así que su subíndice es 1 por construcción.
          - valor: C12H10N2O4
            mensaje: |
              Esa es la empírica multiplicada por dos, y no cuadra con la masa
              molecular: pesaría 246 y el enunciado dice 123. El factor $n$
              sale de dividir la masa molecular entre la de la fórmula
              empírica, y aquí vale 1.
          - valor: C6H6NO2
            mensaje: |
              Has redondeado el hidrógeno hacia arriba. El cociente es
              $0{,}1011/0{,}0203 = 4{,}98$, que redondea a 5 y no a 6, y con 6
              la masa molecular saldría 124.
        pista: |
          Divide los cuatro números de moles entre 0,0203 y redondea. Después
          comprueba que la masa suma 123.
        desarrollo: |
          | | moles | ÷ 0,0203 |
          |---|---|---|
          | C | 0,1218 | 6 |
          | H | 0,1011 | 5 |
          | N | 0,0203 | 1 |
          | O | 0,0408 | 2 |

          La fórmula empírica es $\mathrm{C_6H_5NO_2}$, que pesa
          $12 \times 6 + 5 + 14 + 32 = 123$. Como la masa molecular también es
          123, $n = 1$ y la molecular coincide con la empírica.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'De la combustión de 2,50 g salen 0,1218 mol de C —1,4618 g— y 0,1011 mol de H —0,1011 g—.'
          - texto: 'El nitrógeno se mide sobre 3,50 g, así que hay que escalarlo: 0,3987 g en 3,50 g son 0,2848 g en 2,50 g.'
          - texto: 'El oxígeno sale por diferencia: 2,50 − (1,4618 + 0,1011 + 0,2848) = 0,6523 g, o sea 0,0408 mol.'
          - texto: 'Dividiendo los cuatro entre el menor, 0,0203, salen 6, 5, 1 y 2: la fórmula empírica es C₆H₅NO₂.'
          - texto: 'Esa fórmula pesa 123, igual que la masa molecular del enunciado, así que n = 1 y la molecular es la misma.'
          - texto: 'La fórmula empírica y la molecular son siempre la misma cosa cuando el compuesto es orgánico.'
            trampa: true
            mensaje: |
              Coinciden aquí porque $n$ ha salido 1, y eso es un resultado, no
              una regla. El benceno es C₆H₆ y su empírica es CH; la glucosa es
              C₆H₁₂O₆ y su empírica es CH₂O. Por eso el enunciado da la masa
              molecular: sin ella no se puede saber el factor.
    resolucion: |
      **El paso que decide el problema está en la segunda frase.** La
      combustión se hace sobre **2,50 g** y el análisis de nitrógeno sobre
      **3,50 g**. Son dos muestras distintas del mismo compuesto, y para
      compararlas hay que llevarlas a la misma masa.

      Es exactamente la misma trampa que el ejercicio de la cocaína del control
      de 2023-2024, y por eso conviene reconocerla: cuando un enunciado da dos
      masas de muestra distintas, lo está haciendo a propósito.

      **De la combustión, sobre 2,50 g:**

      $$
      \frac{5{,}36}{44} = 0{,}1218\ \mathrm{mol\ C} \rightarrow 1{,}4618\ \mathrm{g}
      $$

      $$
      \frac{0{,}91}{18} \times 2 = 0{,}1011\ \mathrm{mol\ H} \rightarrow 0{,}1011\ \mathrm{g}
      $$

      El hidrógeno lleva el factor 2 porque cada molécula de agua tiene dos.

      **Del análisis, sobre 3,50 g, y escalado:**

      $$
      \frac{1{,}31}{46} = 0{,}0285\ \mathrm{mol\ N} \rightarrow 0{,}3987\ \mathrm{g\ en\ 3{,}50\ g}
      $$

      $$
      0{,}3987 \times \frac{2{,}50}{3{,}50} = 0{,}2848\ \mathrm{g\ en\ 2{,}50\ g} \rightarrow 0{,}0203\ \mathrm{mol}
      $$

      **El oxígeno, por diferencia**, porque no se mide en ninguno de los dos:

      $$
      2{,}50 - (1{,}4618 + 0{,}1011 + 0{,}2848) = 0{,}6523\ \mathrm{g} \rightarrow 0{,}0408\ \mathrm{mol}
      $$

      **Los cocientes** entre el menor de los cuatro dan 6, 5, 1 y 2, así que
      la empírica es $\mathrm{C_6H_5NO_2}$. Pesa 123, igual que la masa
      molecular del enunciado, luego $n = 1$ y la molecular coincide.

      **Por qué el enunciado da la masa molecular.** Porque la empírica sola no
      basta: dice la **proporción** y no el tamaño. El benceno y el acetileno
      tienen la misma empírica, CH, y son C₆H₆ y C₂H₂. Aquí $n$ ha salido 1 y
      es un resultado, no una regla.
