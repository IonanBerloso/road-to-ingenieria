ejercicios:
  # ── Los dos son NUESTROS (§08). Los tres ejercicios de examen de este tema
  #    piden seis apartados encadenados —Hess, Kirchhoff, ΔU, espontaneidad y
  #    un balance de calor— y no hay por dónde entrar. Aquí se aísla cada idea:
  #    aplicar Hess una vez, y montar un balance con su cambio de fase.
  - id: ejfq6-hess-una-sola-vez
    titulo: Lo que libera quemar un mol de metano
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      El metano es el componente principal del gas natural. Su combustión
      completa es:

      $$
      \mathrm{CH_4\,(g)} + 2\,\mathrm{O_2\,(g)} \rightarrow
      \mathrm{CO_2\,(g)} + 2\,\mathrm{H_2O\,(l)}
      $$

      Calcular la entalpía estándar de combustión.

      **Datos:** ΔH⁰f (kJ/mol): CH4 (g) = −74,6; CO2 (g) = −393,5;
      H2O (l) = −285,8.
    pide: La entalpía de combustión del metano, en kJ/mol.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla no da la entalpía de formación del oxígeno. ¿Es un olvido
          del enunciado?
        opciones:
          - texto: >-
              No: vale cero, porque el O2 es la forma estable del oxígeno y
              formarlo a partir de sí mismo no cuesta nada
            correcta: true
            mensaje: |
              Eso es. La entalpía de formación de **cualquier elemento en su
              forma más estable** es cero por definición: es el punto de
              referencia desde el que se miden todas las demás.
          - texto: >-
              Sí, y sin ella el ejercicio no se puede resolver
            mensaje: |
              Se puede, y de hecho ninguna tabla la trae. Fíjate en que la
              tabla tampoco da la del N2 ni la del carbono grafito, por el
              mismo motivo.
          - texto: >-
              No: se deduce de la del agua, que también lleva oxígeno
            mensaje: |
              No se deduce de nada: **se define** como cero. Es un convenio,
              igual que decidir dónde está el nivel del mar para medir
              alturas.
          - texto: >-
              No, porque el oxígeno no aparece en la ecuación ajustada
            mensaje: |
              Sí aparece, y con coeficiente 2. Lo que pasa es que su
              contribución al cálculo es $2\times 0 = 0$.

      - tipo: calcular
        titulo: La entalpía de combustión
        pregunta: ¿Cuánto vale $\Delta H^{0}$ de combustión del metano?
        respuesta:
          tipo: numero
          valor: '-890.5'
          tolerancia: 5
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '890.5'
            mensaje: |
              Signo cambiado: has hecho reactivos menos productos. Es al
              revés, y además una combustión **siempre** libera energía, así
              que tiene que salir negativa.
          - valor: '-604.7'
            mensaje: |
              Te has dejado el coeficiente del agua. La combustión del metano
              produce **2 H2O**, porque el CH4 tiene cuatro hidrógenos.
        pista: |
          Productos menos reactivos, con los coeficientes de la ecuación, y el
          oxígeno aportando cero.
        desarrollo: |
          $$
          \Delta H^{0} = \left[(-393{,}5) + 2(-285{,}8)\right]
          - \left[(-74{,}6) + 2(0)\right]
          $$
          $$
          = -965{,}1 + 74{,}6 = -890{,}5\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La entalpía es función de estado, así que la de la reacción es la
              de los productos menos la de los reactivos.
          - texto: >-
              El oxígeno aporta cero por ser un elemento en su forma estable.
          - texto: >-
              Los productos suman $-393{,}5 + 2(-285{,}8) = -965{,}1$ kJ.
          - texto: >-
              Restando el reactivo, $-965{,}1 - (-74{,}6) = -890{,}5$ kJ/mol.
          - texto: >-
              Sale negativa, como tiene que ser en cualquier combustión.
          - texto: >-
              Como el metano tiene entalpía de formación negativa, quemarlo
              libera menos energía que si fuera positiva; por eso hay que
              sumarla al resultado.
            trampa: true
            mensaje: |
              La primera mitad es cierta y la segunda no se sigue de ella. La
              entalpía de formación del reactivo se **resta**, siempre, esté
              como esté de signo. Que restar un número negativo acabe sumando
              74,6 es aritmética, no una regla aparte.

              Confundir «restar un negativo» con «sumar porque es negativo»
              lleva a acertar aquí y fallar en cuanto el reactivo tenga
              entalpía positiva, como el eteno de los exámenes.
        veredicto: |
          Productos menos reactivos, con coeficientes, y los elementos a cero.
          Toda la ley de Hess en su forma más corta.

    resolucion: |
      **La idea.** La entalpía es una función de estado: solo importa dónde
      empiezas y dónde acabas. Formar los productos desde sus elementos y
      deshacer los reactivos hasta sus elementos son los dos tramos de un
      camino que da igual cómo se recorra.

      $$
      \Delta H^{0}_{\text{reacción}}
      = \sum \nu\,\Delta H^{0}_f(\text{prod})
      - \sum \nu\,\Delta H^{0}_f(\text{react})
      $$
      $$
      = \left[-393{,}5 + 2(-285{,}8)\right] - \left[-74{,}6\right]
      = \boxed{-890{,}5\ \text{kJ/mol}}
      $$

      **Dos comprobaciones que valen para cualquier combustión.** Que salga
      negativa, porque quemar libera energía siempre. Y el orden de magnitud:
      un hidrocarburo pequeño ronda los cientos de kJ por mol, y los grandes
      —el octano, con ocho carbonos— llegan a los miles.

      Si te sale positiva, casi seguro has hecho reactivos menos productos. Si
      te sale del orden de la decena, te has dejado un coeficiente.

  - id: ejfq6-el-tramo-que-se-olvida
    titulo: Medio kilo de agua, y el tramo que no calienta
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se quiere llevar **500 g de agua** desde 20 °C hasta convertirla toda en
      vapor a 100 °C, a presión atmosférica.

      Calcular el calor necesario.

      **Datos:** Cp del agua líquida = 75,31 J/(mol·K) · ΔHvaporización =
      44,03 kJ/mol · masa molar del agua = 18,02 g/mol.
    pide: El calor necesario, en kilojulios.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua va de 20 a 100 °C y ahí se queda mientras hierve. ¿Cuántos
          tramos tiene este cálculo?
        opciones:
          - texto: >-
              Dos: calentar el líquido de 20 a 100, y vaporizarlo a 100 sin
              que cambie la temperatura
            correcta: true
            mensaje: |
              Eso es, y el segundo es el que se olvida. Mientras hierve, el
              agua **no sube de temperatura**: toda la energía se emplea en
              separar las moléculas.
          - texto: >-
              Uno: se multiplica el Cp por los 80 grados de salto
            mensaje: |
              Eso solo lleva el agua **hasta** los 100 °C, todavía líquida.
              Falta hervirla, que es la parte cara: 1222 de los 1389 kJ.
          - texto: >-
              Tres: calentar, vaporizar y calentar el vapor
            mensaje: |
              Serían tres si el enunciado pidiera pasar de 100 °C, pero se
              para justo en el vapor a 100. El tercer tramo aparece en el
              examen del control de 2023-2024, que llega hasta 120 °C.
          - texto: >-
              Dos: vaporizar y luego calentar el vapor hasta 100
            mensaje: |
              El orden es al revés y además el vapor ya sale a 100 °C. Primero
              se calienta el líquido hasta su punto de ebullición, y solo
              entonces hierve.

      - tipo: calcular
        titulo: El calor total
        pregunta: ¿Cuánto calor hace falta en total?
        respuesta:
          tipo: numero
          valor: '1389'
          tolerancia: 20
          formato: el calor en kJ
        distractores:
          - valor: '167'
            mensaje: |
              Solo has calentado. Falta la vaporización, que se lleva el 88 %
              del total: mientras hierve, el termómetro no se mueve pero la
              energía sigue entrando.
          - valor: '1222'
            mensaje: |
              Esa es solo la vaporización. Falta subir el agua de 20 a 100 °C
              antes de que empiece a hervir.
        pista: |
          Pasa primero los 500 g a moles, porque los dos datos vienen por mol.
          Después los dos tramos, y súmalos.
        desarrollo: |
          $$
          n = \frac{500}{18{,}02} = 27{,}75\ \text{mol}
          $$
          $$
          q_{\text{calentar}} = \frac{27{,}75\cdot 75{,}31\cdot 80}{1000}
          = 167{,}2\ \text{kJ}
          \qquad
          q_{\text{vaporizar}} = 27{,}75\cdot 44{,}03 = 1221{,}7\ \text{kJ}
          $$
          $$
          q = 1389\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 500 g son 27,75 mol, porque los dos datos vienen por mol y no
              por gramo.
          - texto: >-
              Calentar el líquido de 20 a 100 °C cuesta 167,2 kJ.
          - texto: >-
              Vaporizarlo a 100 °C cuesta 1221,7 kJ, sin que suba ni un grado.
          - texto: >-
              El total son 1389 kJ, y el 88 % es el cambio de fase.
          - texto: >-
              Como la vaporización ocurre a temperatura constante, no consume
              energía: solo reordena las moléculas.
            trampa: true
            mensaje: |
              Que la temperatura no cambie no significa que no entre energía —
              significa que la energía **no se está usando en calentar**. Se
              emplea en vencer las fuerzas que mantienen unidas las moléculas
              del líquido, y son 44 kJ por mol.

              De hecho es el tramo más caro con diferencia. La temperatura mide
              la agitación de las moléculas, no la energía total: durante el
              cambio de fase entra energía y la agitación se queda igual porque
              va a otra cosa.
        veredicto: |
          Un cambio de fase no calienta, pero cuesta. Y aquí cuesta ocho veces
          más que todo el calentamiento junto.

    resolucion: |
      **La idea.** Un balance de calor se hace por tramos, y un cambio de fase
      es un tramo aunque el termómetro no se mueva.

      Los dos datos vienen por mol, así que lo primero es dejar los gramos:

      $$
      n = \frac{500}{18{,}02} = 27{,}75\ \text{mol}
      $$

      | tramo | cuenta | kJ |
      |---|---|---|
      | líquido de 20 a 100 °C | $27{,}75\cdot 75{,}31\cdot 80 / 1000$ | 167,2 |
      | **vaporizar a 100 °C** | $27{,}75\cdot 44{,}03$ | **1221,7** |
      | | | **1389** |

      $$
      \boxed{\;q = 1389\ \text{kJ}\;}
      $$

      **Lo que hay que llevarse.** Hervir el agua cuesta **ocho veces más** que
      calentarla los 80 grados anteriores. No es un detalle del enunciado: si
      lo olvidas, el resultado no se equivoca en un porcentaje, se equivoca en
      un orden de magnitud.

      Y de ahí sale una intuición útil para el examen: cuando un problema
      calienta agua a través de los 100 °C, casi todo el calor se lo lleva el
      cambio de fase, y los tramos de calentamiento son correcciones pequeñas.
  # ── Los ejemplos de entrada que faltaban, escritos el 5 de septiembre de
  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq6-el-mismo-etanol-con-el-agua-en-dos-estados
    titulo: La misma combustión, con el agua líquida y en vapor
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura; las entalpías de formación son
      valores tabulados de uso corriente.
    nivel: ejemplo
    enunciado: |
      Calcular la entalpía de combustión del etanol líquido

      $$
      \mathrm{C_2H_5OH\,(l)} + 3\,\mathrm{O_2\,(g)} \rightarrow
      2\,\mathrm{CO_2\,(g)} + 3\,\mathrm{H_2O}
      $$

      primero suponiendo que el agua sale **líquida** y después suponiendo que
      sale en **vapor**. Datos, en kJ/mol:

      | | |
      |---|---|
      | $\Delta H_f$ del etanol (l) | −277,6 |
      | $\Delta H_f$ del CO₂ (g) | −393,5 |
      | $\Delta H_f$ del H₂O (l) | −285,8 |
      | entalpía de vaporización del agua | +44,03 |
    pide: Las dos entalpías de combustión y la diferencia entre ellas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el agua sale en vapor en vez de líquida, ¿qué le pasa a la energía
          que libera la combustión?
        opciones:
          - texto: Libera menos, porque parte de la energía se queda dentro del vapor
            correcta: true
            mensaje: |
              Eso es, y conviene razonarlo así y no memorizar el signo:
              vaporizar cuesta energía, así que si el agua acaba en vapor hay
              una parte del calor que se ha gastado en ello y no sale del
              sistema.
          - texto: Libera más, porque el vapor ocupa más volumen
            correcta: false
            mensaje: |
              El volumen tiene que ver con la diferencia entre $\Delta H$ y
              $\Delta U$, que es otra cosa. Aquí lo que cambia es el estado
              final del agua, y pasarla a vapor **consume** energía.
          - texto: 'Lo mismo: la entalpía es función de estado'
            correcta: false
            mensaje: |
              Es función de estado, y precisamente por eso cambia: el estado
              final **no es el mismo**. Agua líquida y agua en vapor son dos
              estados distintos, con entalpías de formación distintas.
          - texto: Depende de la temperatura a la que se haga la reacción
            correcta: false
            mensaje: |
              La temperatura entra por Kirchhoff, que es otro apartado. Aquí
              las dos combustiones se comparan a la misma temperatura y lo
              único que cambia es el estado del producto.

      - tipo: calcular
        titulo: Con el agua líquida
        pregunta: |
          Aplica la ley de Hess con las entalpías de formación. ¿Cuánto vale
          $\Delta H$ con el agua líquida?
        respuesta:
          tipo: numero
          valor: '-1366.8'
          tolerancia: 2
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-1644.4'
            mensaje: |
              Te has dejado el etanol. La ley de Hess es productos **menos**
              reactivos, y la entalpía de formación del etanol es −277,6: al
              restarla, suma.
          - valor: '1366.8'
            mensaje: |
              El valor está bien y el signo no. Una combustión libera calor, así
              que su entalpía es negativa.
          - valor: '-1080.9'
            mensaje: |
              Parece que has puesto dos aguas en vez de tres. La ecuación
              ajustada da 3 mol de H₂O por cada mol de etanol.
        pista: |
          $\Delta H = \sum \Delta H_f(\text{productos}) - \sum \Delta H_f(\text{reactivos})$,
          y el O₂ vale cero por ser un elemento en su forma estándar.
        desarrollo: |
          $$
          \Delta H = \bigl[2(-393{,}5) + 3(-285{,}8)\bigr] - (-277{,}6)
          $$

          $$
          = (-787{,}0 - 857{,}4) + 277{,}6 = -1366{,}8\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: Con el agua en vapor
        pregunta: |
          Y ahora con el agua saliendo en vapor. ¿Cuánto vale $\Delta H$?
        respuesta:
          tipo: numero
          valor: '-1234.7'
          tolerancia: 2
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-1498.9'
            mensaje: |
              Has restado los 132,1 en vez de sumarlos. Es el error clásico, y
              se detecta solo: si con el agua en vapor te sale **más** negativo
              que con agua líquida, has ido en la dirección contraria.
          - valor: '-1322.8'
            mensaje: |
              Has corregido una sola agua. Son tres moles, así que la
              corrección es $3 \times 44{,}03 = 132{,}1$.
        pista: |
          Cada mol de agua que sale en vapor se lleva 44,03 kJ.
        desarrollo: |
          La entalpía de formación del agua gaseosa es

          $$
          -285{,}8 + 44{,}03 = -241{,}8\ \text{kJ/mol}
          $$

          y con tres moles:

          $$
          \Delta H = -1366{,}8 + 3\times 44{,}03 = -1366{,}8 + 132{,}1
          = -1234{,}7\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La ley de Hess da −1366,8 kJ/mol cuando el agua sale líquida, que es el poder calorífico superior del etanol.'
          - texto: 'Vaporizar un mol de agua cuesta 44,03 kJ, así que si sale en vapor esa energía se queda dentro y la reacción libera menos.'
          - texto: 'Con tres moles de agua la corrección es 132,1 kJ, y la entalpía pasa a −1234,7 kJ/mol.'
          - texto: 'La diferencia es de casi un 10 % sobre el total, así que no es un redondeo: es el ejercicio bien o mal.'
          - texto: 'Como la corrección es siempre pequeña frente al total, basta con dar el valor con agua líquida y avisar de la aproximación.'
            trampa: true
            mensaje: |
              No es pequeña ni es una aproximación aceptable. Aquí son 132 kJ
              sobre 1367, casi un 10 %, y en la combustión del octano son 396
              sobre 5471, más de un 7 %. Además es exactamente la distinción
              entre poder calorífico superior e inferior, que es un dato de
              catálogo, no un matiz.
    resolucion: |
      ## Dos combustiones que se escriben igual

      La única diferencia entre los dos apartados es una letra entre
      paréntesis, y vale 132 kJ:

      $$
      \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(l)}
      \qquad \Delta H = -1366{,}8\ \text{kJ/mol}
      $$

      $$
      \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}
      \qquad \Delta H = -1234{,}7\ \text{kJ/mol}
      $$

      **De dónde sale la corrección.** No hay que rehacer nada: basta con
      cambiar la entalpía de formación del agua,

      $$
      \Delta H_f(\mathrm{H_2O},\ g) = \Delta H_f(\mathrm{H_2O},\ l)
      + \Delta H_{\text{vap}} = -285{,}8 + 44{,}03 = -241{,}8
      $$

      y multiplicar por los moles de agua que produce la reacción ajustada.
      Aquí tres; en el octano, nueve.

      **El signo, que es donde se pierde el ejercicio.** Hay dos negativos en
      juego y confunden. La forma de no dudar es no memorizarlo: vaporizar
      cuesta energía, luego con el agua en vapor sobra **menos** calor, luego
      el número es **menos negativo**. Si te sale más negativo, has restado
      donde tocaba sumar.

      **Y el nombre que tiene esto fuera de clase**: el valor con agua líquida
      es el **poder calorífico superior** del combustible y el de vapor es el
      **inferior**. En una caldera real manda el inferior, porque los humos
      salen calientes y el agua no llega a condensar — salvo en las calderas
      de condensación, que existen precisamente para recuperar esos 132 kJ.

  - id: ejfq6-la-misma-reaccion-con-dos-energias
    titulo: La misma reacción, y por qué tiene dos energías distintas
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la relación entre
      entalpía y energía interna del tema 6. Las tres entalpías son las que
      publica el enunciado del ejercicio 2 del examen del segundo cuatrimestre
      de 2024-2025, para que el peldaño siguiente use exactamente los mismos
      números. No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      Tres reacciones, con su entalpía estándar a 25 °C:

      $$
      \mathrm{C_2H_4\,(g)} + 3\,\mathrm{O_2\,(g)} \rightarrow
      2\,\mathrm{CO_2\,(g)} + 2\,\mathrm{H_2O\,(l)}
      \qquad \Delta H^{0} = -1422{,}6\ \text{kJ}
      $$
      $$
      \mathrm{C\,(s)} + \mathrm{O_2\,(g)} \rightarrow \mathrm{CO_2\,(g)}
      \qquad \Delta H^{0} = -393{,}5\ \text{kJ}
      $$
      $$
      \mathrm{H_2\,(g)} + \tfrac{1}{2}\,\mathrm{O_2\,(g)} \rightarrow
      \mathrm{H_2O\,(l)}
      \qquad \Delta H^{0} = -285{,}8\ \text{kJ}
      $$

      Calcular la variación de **energía interna** de cada una.

      Dato: $R = 8{,}314\ \text{J/(mol·K)}$.
    pide: La energía interna de las tres reacciones a 25 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\Delta U = \Delta H - \Delta n\,R\,T$, ¿qué es $\Delta n$?
        opciones:
          - texto: >-
              Los moles de **gas** de los productos menos los de los
              reactivos; los sólidos y los líquidos no cuentan
            correcta: true
            mensaje: |
              Eso es. La diferencia entre las dos energías es el trabajo que la
              reacción hace contra la atmósfera al cambiar de volumen, y quien
              ocupa volumen apreciable es el gas. Un mol de agua líquida ocupa
              18 cm³; un mol de gas, 24 litros.
          - texto: >-
              Todos los moles de los productos menos todos los de los
              reactivos, en cualquier estado
            mensaje: |
              Entonces el agua líquida de la primera reacción contaría, y no
              debe: su volumen es mil veces menor que el del mismo número de
              moles en gas. Contarla cambia el resultado y, sobre todo, cambia
              el razonamiento.
          - texto: >-
              La variación de la masa total
            mensaje: |
              La masa se conserva en toda reacción química, así que eso sería
              siempre cero. Lo que cambia es **cuántas partículas hay en fase
              gas**, que es lo que decide el volumen.

      - tipo: calcular
        titulo: El cambio de moles de gas del eteno
        pregunta: |
          En la combustión del eteno, ¿cuánto vale $\Delta n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Has contado el agua. Sale como **líquida**, así que no entra: hay
              4 moles de gas a la izquierda —1 de eteno y 3 de oxígeno— y solo
              2 a la derecha.
          - valor: '2'
            mensaje: |
              El signo. Se restan los reactivos a los productos, y aquí hay
              menos gas al final que al principio: la reacción **encoge**.
        pista: |
          Cuenta solo lo que lleva (g), y resta reactivos de productos.
        desarrollo: |
          A la izquierda, $1+3 = 4$ moles de gas. A la derecha, 2 de
          $\mathrm{CO_2}$ — el agua es líquida y no cuenta.

          $$
          \Delta n = 2 - 4 = -2
          $$

      - tipo: calcular
        titulo: El término de corrección
        pregunta: |
          ¿Cuánto vale el término $-\Delta n\,R\,T$ del eteno, en kJ?
        respuesta:
          tipo: numero
          valor: '4.955'
          tolerancia: 0.05
          formato: un número, en kilojulios
        distractores:
          - valor: '-4.955'
            mensaje: |
              El signo. $\Delta n$ ya es negativo, y el término lleva delante
              **otro** menos: los dos juntos dan un término positivo. Con menos
              gas al final, la atmósfera empuja hacia dentro y hace trabajo
              **sobre** el sistema.
          - valor: '4955'
            mensaje: |
              Has dejado la $R$ en julios y la entalpía está en kilojulios.
              Aquí el error es visible porque el término solo, sin nada al
              lado, sale absurdo — pero sumado a $-1422{,}6$ habría dado
              3.532 kJ y no habría chirriado tanto. **La unidad se arregla
              antes de sumar, no después.**
        pista: |
          $T = 298$ K, y $R$ hay que pasarla a kJ/(mol·K).
        desarrollo: |
          $$
          -\Delta n\,R\,T = -(-2)\cdot 8{,}314\cdot 10^{-3}\cdot 298
          = 2\cdot 2{,}478 = 4{,}955\ \text{kJ}
          $$

          Conviene retener el $R\,T$ a 25 °C: **2,478 kJ/mol**. Con él, la
          corrección de cualquier reacción a temperatura ambiente es
          «$\Delta n$ por dos y medio», y se calcula de cabeza.

      - tipo: calcular
        titulo: La energía interna del eteno
        pregunta: |
          ¿Cuánto vale entonces $\Delta U$ de la combustión del eteno, en kJ?
        respuesta:
          tipo: numero
          valor: '-1417.6'
          tolerancia: 0.5
          formato: un número, en kilojulios
        distractores:
          - valor: '-1427.6'
            mensaje: |
              Has restado la corrección en vez de sumarla. Acabas de calcular
              que el término vale $+4{,}955$: hay que sumarlo tal cual a
              $\Delta H$. Y el resultado tiene sentido físico — con menos gas
              al final, $\Delta U$ sale **menos negativo** que $\Delta H$.
        pista: |
          $\Delta U = \Delta H$ más el término que acabas de calcular.
        desarrollo: |
          $$
          \Delta U = -1422{,}6 + 4{,}955 = -1417{,}6\ \text{kJ}
          $$

          Cinco kilojulios de mil cuatrocientos: un **0,35 %**. Pequeño, y aun
          así el examen lo pide y vale sus puntos.

      - tipo: calcular
        titulo: La del carbono
        pregunta: |
          ¿Y cuánto vale $\Delta U$ de $\mathrm{C\,(s)} + \mathrm{O_2\,(g)}
          \rightarrow \mathrm{CO_2\,(g)}$, en kJ?
        respuesta:
          tipo: numero
          valor: '-393.5'
          tolerancia: 0.5
          formato: un número, en kilojulios
        distractores:
          - valor: '-391.0'
            mensaje: |
              Has aplicado una corrección que aquí no toca. Cuenta los moles de
              gas: uno de $\mathrm{O_2}$ a la izquierda y uno de
              $\mathrm{CO_2}$ a la derecha. El carbono es **sólido**, así que
              $\Delta n = 0$ y no hay nada que corregir.
        pista: |
          Antes de calcular nada, cuenta los moles de gas de cada lado.
        desarrollo: |
          Un mol de gas entra y un mol de gas sale: $\Delta n = 0$, así que

          $$
          \Delta U = \Delta H = -393{,}5\ \text{kJ}
          $$

          **Idénticas.** Es el caso que conviene tener en la cabeza, porque
          enseña de dónde viene la diferencia: si el volumen no cambia, no hay
          trabajo contra la atmósfera, y entonces las dos energías son la
          misma. La entalpía no es «otra energía»: es la energía interna más lo
          que cuesta hacerse sitio.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La diferencia entre $\Delta H$ y $\Delta U$ es el trabajo de
              expansión contra la atmósfera, y solo lo hacen los gases.
          - texto: >-
              Por eso $\Delta n$ cuenta únicamente moles en fase gas: el agua
              líquida del eteno no entra, y el carbono sólido tampoco.
          - texto: >-
              En el eteno $\Delta n = -2$ y la corrección vale 5 kJ; en el
              carbono $\Delta n = 0$ y las dos energías coinciden.
          - texto: >-
              Y como la corrección es siempre pequeña, en un examen se puede
              dar $\Delta U \approx \Delta H$ sin perder puntos.
            trampa: true
            mensaje: |
              Dos cosas mal. Que sea pequeña **aquí** no la hace pequeña
              siempre: en una reacción con pocos kilojulios y muchos moles de
              gas puede ser una fracción enorme. Y aunque lo fuera, el
              enunciado pregunta por $\Delta U$: contestar $\Delta H$ es
              contestar otra cosa, y eso no se puntúa por aproximado.
    resolucion: |
      La relación entre las dos energías sale de la definición de entalpía,
      $H = U + PV$, aplicada a presión constante y suponiendo gases ideales:

      $$
      \Delta U = \Delta H - \Delta n\,R\,T
      $$

      donde $\Delta n$ son los moles **de gas** de los productos menos los de
      los reactivos. A 25 °C, $R\,T = 2{,}478$ kJ/mol.

      | reacción | $\Delta n$ | $\Delta H$ | $\Delta U$ |
      |---|---|---|---|
      | eteno + oxígeno | $-2$ | $-1422{,}6$ | $-1417{,}6$ |
      | carbono + oxígeno | $0$ | $-393{,}5$ | $-393{,}5$ |
      | hidrógeno + oxígeno | $-1{,}5$ | $-285{,}8$ | $-282{,}1$ |

      **Lo que hay que llevarse.** Tres cosas, y las tres son de las que
      cuestan puntos sin que uno se entere:

      1. **Solo cuenta el gas.** El agua líquida del primero y el carbono
         sólido del segundo no aportan volumen apreciable, así que no aportan
         trabajo.
      2. **El signo tiene sentido físico.** Aquí las tres reacciones encogen
         —$\Delta n < 0$ o cero—, así que la atmósfera empuja hacia dentro y
         hace trabajo **sobre** el sistema: por eso $\Delta U$ sale siempre
         menos negativo que $\Delta H$. Si te sale al revés, has restado mal.
      3. **La $R$ viene en julios.** Y la entalpía, en kilojulios. Es el
         descuido más frecuente del apartado y no lo avisa nadie: el resultado
         sigue pareciendo razonable.

      **Y el peldaño siguiente** es el ejercicio 2 del segundo cuatrimestre de
      2024-2025, que usa estas mismas tres reacciones y estos mismos números
      para pedir, además, la entalpía a **100 °C**. Allí el paso nuevo es
      Kirchhoff; aquí ya no habrá que pensar en cuál es $\Delta n$.

  # ── Los dos primeros problemas de colección del tema. Vienen de la hoja
  #    del tema 5, «5.11. Problemas propuestos», que es la que trae los de
  #    entalpía: el curso no reparte hoja de problemas del tema 6. Por eso
  #    sus ids llevan «t5» delante del número. La colección publica la
  #    respuesta final; el desarrollo y los distractores son nuestros. El PDF
  #    es una imagen: los enunciados se han leído sobre la página.
  - id: colfq6-t5-3-el-agua-hasta-los-cien-grados
    titulo: Cien gramos de agua hasta 100 °C, y el tramo que esta vez no se suma
    fuente: >-
      Problema 3 · Problemas propuestos del tema 5, Termodinámica clásica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Se eleva la temperatura de 100 g de agua líquida de 20 ºC a 100 ºC a
      presión atmosférica. Calcular la variación de entalpía del proceso,
      sabiendo que la capacidad calorífica del agua líquida es de
      75,31 J K⁻¹ mol⁻¹.
    pide: La variación de entalpía del proceso, en kJ.

    pasos:
      - tipo: reconocer
        pregunta: |
          El agua llega justo a 100 °C. ¿Hay que sumar la entalpía de
          vaporización?
        opciones:
          - texto: >-
              No: el enunciado solo la calienta hasta 100 °C, y sigue siendo
              agua líquida
            correcta: true
            mensaje: |
              Eso es. «Se eleva la temperatura del agua líquida» es un solo
              tramo: calentar el líquido. Hervirla sería otro proceso, y el
              enunciado ni lo pide ni da la entalpía de vaporización.
          - texto: >-
              Sí: a 100 °C el agua hierve, y el cambio de fase es el tramo que
              siempre se olvida
            mensaje: |
              Se olvida cuando el enunciado lo pide, porque el intervalo cruza
              los 100 °C o acaba en vapor. Aquí acaba en 100 °C con el agua
              todavía líquida: llegar al punto de ebullición no es hervir.
          - texto: >-
              Sí, pero solo la mitad, porque justo a 100 °C hay líquido y
              vapor a la vez
            mensaje: |
              Líquido y vapor conviven a 100 °C mientras se está vaporizando,
              pero eso solo pasa si se le sigue dando calor. El enunciado para
              al llegar a 100 °C, y ahí todo es líquido.
          - texto: >-
              No, porque a presión atmosférica el agua no hierve a 100 °C
            mensaje: |
              Sí hierve a 100 °C: es su temperatura de ebullición a 1 atm. No
              se suma la vaporización porque el enunciado no la pide, no
              porque no pueda hervir.

      - tipo: calcular
        titulo: Los moles de agua
        pregunta: |
          ¿Cuántos moles son los 100 g de agua?
        respuesta:
          tipo: numero
          valor: '5.551'
          tolerancia: 0.01
          formato: los moles, con tres decimales
        distractores:
          - valor: '100'
            mensaje: |
              Has tomado los gramos como moles. La capacidad calorífica viene
              por mol, así que hay que dividir entre la masa molar del agua,
              18 g/mol.
          - valor: '1800'
            mensaje: |
              Has multiplicado por la masa molar en vez de dividir. Un mol de
              agua pesa 18 g, así que en 100 g caben unos cinco moles y medio.
          - valor: '0.18'
            mensaje: |
              Has dividido al revés, masa molar entre masa. Son
              $n = m/M = 100/18{,}015$.
        pista: |
          $n = m/M$, con $M(\mathrm{H_2O}) = 18{,}015$ g/mol.
        desarrollo: |
          $$
          n = \frac{m}{M} = \frac{100}{18{,}015} = 5{,}551\ \text{mol}
          $$

          Con $M = 18$ g/mol sale 5,556 mol, y cabe en la tolerancia.

      - tipo: calcular
        titulo: La variación de entalpía
        pregunta: |
          ¿Cuánto vale $\Delta H$ del proceso, en kJ?
        respuesta:
          tipo: numero
          valor: '33.44'
          tolerancia: 0.05
          formato: la entalpía en kJ, con dos decimales
        distractores:
          - valor: '602.48'
            mensaje: |
              Has tomado los 100 g como si fueran 100 moles. La capacidad
              calorífica es molar: primero hay que pasar a moles, 5,551.
          - valor: '41.80'
            mensaje: |
              Has multiplicado por 100 grados, como si el agua partiera de
              0 °C. El salto es de 20 a 100 °C: $\Delta T = 80$ K.
          - valor: '33443'
            mensaje: |
              La cuenta está bien, pero en julios. La pregunta pide kJ:
              33 443 J son 33,44 kJ.
        pista: |
          A presión constante, $\Delta H = q_P = n\,C_P\,\Delta T$, con
          $\Delta T = 80$ K.
        desarrollo: |
          $$
          \Delta H = n\,C_P\,\Delta T = 5{,}551\cdot 75{,}31\cdot(100 - 20) = 33\,443\ \text{J} = 33{,}44\ \text{kJ}
          $$

          Es la cifra de la colección. Con $M = 18$ g/mol sale 33,47 kJ, y
          cabe en la tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El proceso es a presión atmosférica, constante, así que el calor
              que recibe el agua es su variación de entalpía.
          - texto: >-
              La capacidad calorífica viene por mol: los 100 g son
              $100/18{,}015 = 5{,}551$ mol.
          - texto: >-
              Un salto de 80 °C es un salto de 80 K, así que
              $\Delta H = 5{,}551\cdot 75{,}31\cdot 80 = 33\,443$ J.
          - texto: >-
              El agua acaba a 100 °C pero sigue líquida: no hay cambio de fase
              que sumar.
          - texto: >-
              Hay que pasar las temperaturas a kelvin antes de restarlas, y el
              salto es $373 - 293 = 80$ K, distinto del de 80 °C.
            trampa: true
            mensaje: |
              Un grado Celsius y un kelvin miden el mismo salto: la escala solo
              está desplazada 273,15. Por eso $373 - 293$ da 80, lo mismo que
              $100 - 20$. Pasar a kelvin hace falta cuando la temperatura va
              sola —en $PV = nRT$ o en un logaritmo—, no en una diferencia.
        veredicto: |
          Un tramo, una fórmula y la unidad que pide el dato: todo lo demás es
          no sumar lo que el enunciado no pide.

    resolucion: |
      **Un solo tramo.** El agua sube de 20 a 100 °C y acaba líquida: no hay
      cambio de fase. Y el proceso es a presión atmosférica, así que el calor
      que recibe es su variación de entalpía.

      **Los moles**, porque el dato viene por mol:

      $$
      n = \frac{100}{18{,}015} = 5{,}551\ \text{mol}
      $$

      **La entalpía:**

      $$
      \Delta H = n\,C_P\,\Delta T = 5{,}551\cdot 75{,}31\cdot 80 = 33\,443\ \text{J} = 33{,}44\ \text{kJ}
      $$

      Es la respuesta de la colección, 33,44 kJ, que sale con la masa molar
      18,015 g/mol; con 18 g/mol sale 33,47.

      **Lo que enseña.** El problema es la otra cara del tramo que se olvida:
      aquí el intervalo acaba justo en el punto de ebullición y no lo cruza,
      así que no hay vaporización que sumar. Si se sumara, con los 40,66
      kJ/mol del problema 1 de la hoja del tema 7, saldrían unos 259 kJ, casi
      ocho veces más. Antes de sumar un tramo, hay que ver si el enunciado lo
      recorre.

  - id: colfq6-t5-8-el-agua-hasta-vapor-a-3-bar
    titulo: Un mol de agua de 0 °C a vapor a 200 °C y 3 bar, y el calor que no es la entalpía
    fuente: >-
      Problema 8 · Problemas propuestos del tema 5, Termodinámica clásica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Su 44 301,1 J se reproduce, a cuatro julios,
      con el camino reversible que comprime el vapor al final, a 200 °C. La
      fórmula de la Cp del vapor trae una errata probable (10⁻² por 10⁻³);
      la respuesta de la colección sale con la impresa.
    nivel: practica
    enunciado: |
      Calcular el calor intercambiado en el proceso de convertir 1 mol de
      agua líquida, a 0 ºC y 1 bar, en vapor de agua a 200 ºC y 3 bar,
      suponiendo que la capacidad calorífica molar del agua líquida es
      constante e igual a 75,31 J K⁻¹ mol⁻¹ y que el gas se comporta como
      ideal. La capacidad calorífica del vapor de agua viene dado por:
      Cp = 36,861–7,949 x 10⁻² T+9,205 x 10⁻⁶ T² J K⁻¹mol⁻¹. El calor latente
      de vaporización del agua a 100 ºC es 40,6 kJ mol⁻¹.

      *Así impresa, la Cp del vapor vale 8,5 J K⁻¹ mol⁻¹ a 100 °C y 1,3 a
      200 °C, y se hace negativa por encima de unos 492 K: el término lineal
      parece llevar 10⁻³, no 10⁻². La respuesta de la colección, 44 301,1 J,
      sale con la fórmula tal como está, y es la que se usa aquí.*
    pide: El calor que intercambia el mol de agua en todo el proceso, en julios.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué tramos se parte el proceso para calcular el calor?
        opciones:
          - texto: >-
              Cuatro: calentar el líquido hasta 100 °C, vaporizarlo, calentar
              el vapor hasta 200 °C y comprimirlo de 1 a 3 bar a 200 °C
            correcta: true
            mensaje: |
              Eso es: el enunciado no fija el camino, y este es el camino
              reversible que permite usar los datos y con el que sale la
              respuesta de la colección. Los tres primeros tramos son los de
              siempre, a 1 bar. El cuarto es el que distingue este problema: comprimir un gas ideal a
              temperatura constante no cambia su entalpía, pero sí le hace
              soltar calor.
          - texto: >-
              Tres, porque la entalpía de un gas ideal no depende de la
              presión y el paso de 1 a 3 bar no cuenta
            mensaje: |
              Para la **entalpía** es verdad: $\Delta H$ no ve la compresión.
              Pero el enunciado pide el **calor**, y el calor depende del
              camino. Al comprimir el vapor a 200 °C el exterior le hace
              trabajo, y para no calentarse lo suelta como calor.
          - texto: >-
              Tres: calentar el líquido, vaporizarlo a 3 bar y calentar el
              vapor
            mensaje: |
              El calor latente que da el enunciado es el de 100 °C, que es
              donde el agua hierve a la presión de partida. A 3 bar herviría a
              otra temperatura, y no hay dato para eso. Se vaporiza a 1 bar y
              se comprime después.
          - texto: >-
              Dos: calentar de 0 a 200 °C y vaporizar
            mensaje: |
              El agua no se calienta de 0 a 200 °C en un mismo estado: hasta
              100 °C es líquida y desde ahí es vapor, cada uno con su
              capacidad calorífica. Y falta la compresión.

      - tipo: calcular
        titulo: El calor del vapor de 100 a 200 °C
        pregunta: |
          ¿Cuánto calor recibe el vapor al calentarse de 100 a 200 °C a
          1 bar, en julios, con la $C_p(T)$ del enunciado?
        respuesta:
          tipo: numero
          valor: '488.1'
          tolerancia: 1.5
          formato: el calor en J, con una cifra decimal
        distractores:
          - valor: '3686.1'
            mensaje: |
              Has integrado solo el término constante, $36{,}861\cdot 100$. Los
              otros dos también se integran: el lineal da
              $-\tfrac{7{,}949\cdot 10^{-2}}{2}(T_2^{2} - T_1^{2})$, y es casi
              igual de grande con el signo contrario.
          - valor: '2515.2'
            mensaje: |
              Has metido las temperaturas en grados centígrados, de 100 a 200.
              Una fórmula de $C_p$ en función de $T$ va en kelvin: de 373,15 a
              473,15 K.
          - valor: '848.1'
            mensaje: |
              Has tomado la $C_p$ de 373 K como constante en todo el tramo. La
              del enunciado cambia con la temperatura —baja de 8,5 a 1,3
              J/(mol·K)—, y hay que integrarla.
        pista: |
          $q = \displaystyle\int_{373{,}15}^{473{,}15} C_p\,\mathrm{d}T$, término a
          término, con $T$ en kelvin.
        desarrollo: |
          $$
          q = 36{,}861\,(T_2 - T_1) - \frac{7{,}949\cdot 10^{-2}}{2}\,(T_2^{2} - T_1^{2}) + \frac{9{,}205\cdot 10^{-6}}{3}\,(T_2^{3} - T_1^{3})
          $$

          $$
          q = 3686{,}1 - 3363{,}6 + 165{,}6 = 488{,}1\ \text{J}
          $$

          Con $T = t + 273$ sale 489,1 J, y cabe en la tolerancia.

      - tipo: calcular
        titulo: El calor de la compresión
        pregunta: |
          ¿Cuánto calor intercambia el vapor al comprimirse de forma reversible
          de 1 a 3 bar a 200 °C, en julios?
        respuesta:
          tipo: numero
          valor: '-4322'
          tolerancia: 4
          formato: el calor en J, un número entero con su signo
        distractores:
          - valor: '4322'
            mensaje: |
              El signo. En una compresión isoterma el gas recibe trabajo y, para
              no calentarse, lo suelta como calor: $q < 0$. El logaritmo es
              $\ln(P_1/P_2) = \ln(1/3)$, negativo.
          - valor: '-1877'
            mensaje: |
              Has usado el logaritmo decimal. La isoterma lleva el neperiano:
              $\ln 3 = 1{,}099$, no $\log 3 = 0{,}477$.
          - valor: '-3408'
            mensaje: |
              Has comprimido a 100 °C, antes de calentar el vapor. A 100 °C y
              3 bar el agua no sería vapor —condensaría, porque hierve a
              100 °C con 1 atm—, y el modelo de gas ideal deja de valer. La
              compresión se hace al final, a 200 °C.
        pista: |
          Gas ideal a temperatura constante: $\Delta E = 0$ y
          $q = -W = nRT\ln(P_1/P_2)$, con $T = 473{,}15$ K.
        desarrollo: |
          $$
          q = nRT\ln\frac{P_1}{P_2} = 1\cdot 8{,}314\cdot 473{,}15\cdot\ln\frac{1}{3} = -4322\ \text{J}
          $$

      - tipo: calcular
        titulo: El calor total
        pregunta: |
          ¿Cuánto calor intercambia el mol de agua en todo el proceso, en
          julios?
        respuesta:
          tipo: numero
          valor: '44297'
          tolerancia: 6
          formato: el calor en J, un número entero
        distractores:
          - valor: '48619'
            mensaje: |
              Esa es la variación de **entalpía**: los tres primeros tramos. Es
              función de estado y no ve la compresión, pero el calor sí: al
              comprimir el vapor salen 4322 J. Suma también ese tramo.
          - valor: '52941'
            mensaje: |
              Has sumado el calor de la compresión con el signo cambiado. Al
              comprimir, el gas **cede** calor: el tramo resta 4322 J.
          - valor: '3697'
            mensaje: |
              Te has dejado el calor latente, que es casi todo el total:
              40 600 J de los 44 297. Hervir el agua a 100 °C es un tramo,
              aunque el termómetro no se mueva.
        pista: |
          Suma los cuatro tramos, cada uno con su signo:
          $7531 + 40\,600 + 488{,}1 - 4322$.
        desarrollo: |
          $$
          q = 7531 + 40\,600 + 488{,}1 - 4321{,}7 = 44\,297\ \text{J}
          $$

          La colección da 44 301,1 J: cuatro julios de diferencia, que vienen
          de redondear las temperaturas a $t + 273$ y de la $R$ que se use.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Calentar el líquido de 0 a 100 °C: $75{,}31\cdot 100 = 7531$ J.
          - texto: >-
              Vaporizarlo a 100 °C y 1 bar: 40 600 J, sin que suba la
              temperatura.
          - texto: >-
              Calentar el vapor de 373,15 a 473,15 K integrando la $C_p(T)$
              del enunciado: 488,1 J.
          - texto: >-
              Comprimirlo a 200 °C de 1 a 3 bar, de forma reversible:
              $q = RT\ln(1/3) = -4322$ J, calor que sale.
          - texto: >-
              En total, 44 297 J. La entalpía, en cambio, sube 48 619 J, porque
              no ve la compresión.
          - texto: >-
              Como el vapor es un gas ideal, la presión no afecta a nada, y el
              calor es la suma de los tres primeros tramos, 48 619 J.
            trampa: true
            mensaje: |
              La presión no afecta a la **entalpía** de un gas ideal, pero sí
              al calor. El calor depende del camino: comprimir a temperatura
              constante es recibir trabajo y devolverlo como calor, aquí
              4322 J. Los 48 619 J son $\Delta H$, que coincide con el calor
              solo a presión constante, y aquí la presión cambia.
        veredicto: |
          $\Delta H$ y $q$ coinciden mientras la presión no cambia. El último
          tramo la cambia, y ahí se separan.

    resolucion: |
      **El camino.** El calor depende de por dónde se vaya, así que hay que
      elegir uno. El que permite usar los datos es este: todo a 1 bar hasta
      tener el vapor a 200 °C —el calor latente es el de 100 °C— y la
      compresión al final, reversible y a 200 °C.

      | tramo | cuenta | q (J) |
      |---|---|---|
      | líquido de 0 a 100 °C | $75{,}31\cdot 100$ | 7531 |
      | vaporizar a 100 °C | calor latente | 40 600 |
      | vapor de 100 a 200 °C | $\int C_p\,\mathrm{d}T$ | 488,1 |
      | comprimir de 1 a 3 bar a 200 °C | $RT\ln(1/3)$ | −4321,7 |
      | **total** | | **44 297** |

      El tercer tramo, término a término y con $T$ en kelvin:

      $$
      \int_{373{,}15}^{473{,}15} C_p\,\mathrm{d}T = 3686{,}1 - 3363{,}6 + 165{,}6 = 488{,}1\ \text{J}
      $$

      El cuarto, para un gas ideal a temperatura constante:

      $$
      q = RT\ln\frac{P_1}{P_2} = 8{,}314\cdot 473{,}15\cdot\ln\frac{1}{3} = -4321{,}7\ \text{J}
      $$

      La colección da 44 301,1 J. La diferencia, cuatro julios, es de
      redondeo: con las temperaturas como $t + 273$ y $R = 8{,}31$ sale
      44 301,9.

      **El calor no es la entalpía.** La variación de entalpía del proceso
      son los tres primeros tramos, 48 619 J: la de un gas ideal no depende
      de la presión, y comprimirlo no la cambia. El calor sí lo nota. Mientras
      la presión es constante, $q = \Delta H$; en cuanto cambia, se separan, y
      aquí la diferencia son los 4322 J que el vapor suelta al comprimirse.

      **Una cosa rara del dato.** Con los coeficientes tal como están, la
      $C_p$ del vapor vale 8,5 J/(mol·K) a 100 °C y 1,3 a 200 °C, muy por
      debajo de los 33,56 J/(mol·K) que da para el vapor el control de
      2023-2024 del segundo cuatrimestre. La respuesta de la colección sale
      con la fórmula impresa, así que se usa tal cual; por eso el tercer tramo
      pesa tan poco.
