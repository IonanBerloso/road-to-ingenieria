ejercicios:
  # ── Los dos son NUESTROS (§08). En los exámenes este tema nunca viene solo:
  #    es el último apartado de un ejercicio de termoquímica de seis partes,
  #    así que quien llega ahí ya arrastra cinco resultados. Aquí cada idea se
  #    aísla: colocar una reacción en su caso y encontrar su temperatura de
  #    inversión, y distinguir el logaritmo de la división.
  - id: ejfq7-la-cal-y-la-temperatura-del-horno
    titulo: Por qué un horno de cal tiene que estar a más de 837 grados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      La cal viva se fabrica descomponiendo caliza en un horno:

      $$
      \mathrm{CaCO_3\,(s)} \rightarrow \mathrm{CaO\,(s)} + \mathrm{CO_2\,(g)}
      $$

      Determinar por encima de qué temperatura la reacción es espontánea.

      **Datos:**

      | sustancia | ΔH⁰f (kJ/mol) | S⁰ (J/mol·K) |
      |---|---|---|
      | CaCO3 (s) | −1206,9 | 92,9 |
      | CaO (s) | −635,1 | 39,8 |
      | CO2 (g) | −393,5 | 213,7 |
    pide: La temperatura a partir de la cual la descomposición es espontánea.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué signo esperas para $\Delta S$, y por
          qué?
        opciones:
          - texto: >-
              Positivo, porque aparece un mol de gas donde no había ninguno
            correcta: true
            mensaje: |
              Eso es, y con eso ya sabes en qué caso estás sin tocar la tabla.
              Los moles de gas mandan sobre todo lo demás: un sólido que se
              parte en otro sólido y un gas siempre gana entropía.
          - texto: >-
              Negativo, porque de una sustancia salen dos y eso ordena el
              sistema
            mensaje: |
              Al revés: repartir la materia en más especies, y sobre todo
              liberar un gas, **aumenta** el número de formas de repartir la
              energía.
          - texto: >-
              Cero, porque hay un mol a cada lado de la ecuación
            mensaje: |
              Hay un mol de sólido a la izquierda y dos sustancias a la
              derecha, una de ellas gas. Y aunque los moles totales
              coincidieran, un gas y un sólido no aportan lo mismo ni de lejos.
          - texto: >-
              No se puede saber sin las entropías absolutas de la tabla
            mensaje: |
              Se puede estimar el **signo**, que es lo que decide en qué caso
              de los cuatro estás. El valor exacto sí necesita la tabla, pero
              la dirección no.

      - tipo: calcular
        titulo: La temperatura de inversión
        pregunta: |
          ¿Por encima de qué temperatura, en kelvin, es espontánea la
          descomposición?
        respuesta:
          tipo: numero
          valor: '1110'
          tolerancia: 20
          formato: la temperatura en kelvin
        distractores:
          - valor: '1110000'
            mensaje: |
              Un factor mil: has mezclado las unidades. La entalpía viene en
              **kJ** y la entropía en **J**, así que hay que llevar las dos a
              la misma antes de dividir.
          - valor: '837'
            mensaje: |
              Esa es la temperatura en grados **centígrados**, que es la
              respuesta correcta con otra unidad. La pregunta pide kelvin: hay
              que sumar 273.
        pista: |
          El umbral es donde $\Delta G$ se anula, o sea
          $T = \Delta H / \Delta S$. Calcula los dos por productos menos
          reactivos y cuida las unidades: uno viene en kJ y el otro en J.
        desarrollo: |
          $$
          \Delta H^{0} = \left[-635{,}1 + (-393{,}5)\right] - (-1206{,}9)
          = +178{,}3\ \text{kJ/mol}
          $$
          $$
          \Delta S^{0} = \left[39{,}8 + 213{,}7\right] - 92{,}9
          = +160{,}6\ \text{J/(mol·K)}
          $$
          $$
          T = \frac{178{,}3}{0{,}1606} = 1110\ \text{K} = 837\ \text{°C}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción libera un gas donde no había ninguno, así que
              $\Delta S > 0$ antes de mirar la tabla.
          - texto: >-
              Con las entalpías de formación, $\Delta H = +178{,}3$ kJ/mol:
              endotérmica.
          - texto: >-
              Con las entropías absolutas, $\Delta S = +160{,}6$ J/(mol·K).
          - texto: >-
              Los dos positivos es el caso «solo en caliente»: hay un umbral y
              por encima de él la reacción se da la vuelta.
          - texto: >-
              El umbral es $T = \Delta H/\Delta S = 1110$ K, o 837 °C, que es
              por qué un horno de cal trabaja por encima de los 900.
          - texto: >-
              Como la reacción es endotérmica, hay que aportar calor
              continuamente, y ese aporte es lo que la hace espontánea.
            trampa: true
            mensaje: |
              Se mezclan dos cosas distintas. Que haya que aportar calor es
              cierto —es endotérmica— pero eso no es lo que la hace
              espontánea: lo que la hace espontánea es que la **temperatura**
              sea alta, porque el término $-T\Delta S$ crece con ella.

              La prueba de que son cosas distintas: a 25 °C también puedes
              aportarle calor sin parar, y la caliza no se descompone. Lo que
              hace falta no es energía, es temperatura.
        veredicto: |
          Dos signos y una división. Colocar la reacción en su caso es casi
          todo el ejercicio; el número es la parte fácil.

    resolucion: |
      **La idea.** Con $\Delta H$ y $\Delta S$ del mismo signo hay siempre una
      temperatura frontera, y encontrarla es una división.

      Aquí los dos son positivos —endotérmica y con ganancia de entropía—, que
      es el caso **«solo en caliente»**:

      $$
      \Delta H^{0} = (-635{,}1 - 393{,}5) + 1206{,}9 = +178{,}3\ \text{kJ/mol}
      $$
      $$
      \Delta S^{0} = (39{,}8 + 213{,}7) - 92{,}9 = +160{,}6\ \text{J/(mol·K)}
      $$

      El umbral es donde $\Delta G = \Delta H - T\Delta S$ se anula:

      $$
      \boxed{\;T = \frac{178{,}3}{0{,}1606} = 1110\ \text{K} = 837\ \text{°C}\;}
      $$

      **Comprobación con la realidad**, que es lo que hace bonito el ejercicio:
      los hornos de cal industriales trabajan entre 900 y 1000 °C. No es
      casualidad ni margen de seguridad arbitrario — es que por debajo de 837
      la reacción sencillamente no va, por mucho combustible que se queme.

      Y el contraste con la temperatura ambiente:

      $$
      \Delta G_{298} = 178{,}3 - 298{,}15\cdot 0{,}1606 = +130{,}4\ \text{kJ/mol}
      $$

      muy positiva, o sea que a 25 °C lo espontáneo es lo contrario: la cal
      viva reacciona con el CO₂ del aire y vuelve a caliza. Es exactamente lo
      que pasa con la cal apagada de una obra al fraguar.

  - id: ejfq7-el-logaritmo-o-la-division
    titulo: El logaritmo o la división, según cambie la temperatura
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se toman **100 g de agua a 0 °C** y se calientan hasta 100 °C, y allí se
      vaporizan por completo, todo a presión atmosférica.

      Calcular la variación de entropía del agua en todo el proceso.

      **Datos:** Cp del agua líquida = 75,31 J/(mol·K) · ΔHvaporización =
      44,03 kJ/mol · masa molar del agua = 18,02 g/mol.
    pide: La variación de entropía del agua, en J/K.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos tramos absorben calor, pero se calculan de forma distinta.
          ¿Qué los distingue?
        opciones:
          - texto: >-
              Que en uno la temperatura cambia y en el otro no
            correcta: true
            mensaje: |
              Exacto, y es la única pregunta que hay que hacerse. Si la
              temperatura cambia no hay una sola $T$ entre la que dividir, así
              que hay que integrar y sale un logaritmo.
          - texto: >-
              Que uno es reversible y el otro no
            mensaje: |
              Los dos se suponen reversibles: es lo que permite usar
              $\Delta S = q_{\text{rev}}/T$ en el segundo. Lo que cambia es
              otra cosa.
          - texto: >-
              Que uno cambia de fase y el otro no, y los cambios de fase no
              tienen entropía
            mensaje: |
              El cambio de fase es justo el que **más** entropía aporta aquí:
              655 de los 785 J/K. Pasar de líquido a gas es el mayor salto de
              desorden que hay.
          - texto: >-
              Que el calor del segundo es mucho mayor
            mensaje: |
              Es cierto que lo es, pero eso no cambia **cómo** se calcula. Lo
              que decide la fórmula es si la temperatura es constante o no.

      - tipo: calcular
        titulo: La entropía total
        pregunta: ¿Cuánto aumenta la entropía del agua en todo el proceso?
        respuesta:
          tipo: numero
          valor: '785'
          tolerancia: 12
          formato: la entropía en J/K
        distractores:
          - valor: '655'
            mensaje: |
              Esa es solo la vaporización. Falta el calentamiento de 0 a
              100 °C, que aporta otros 130 J/K.
          - valor: '767'
            mensaje: |
              Has usado $q/T$ para el calentamiento en vez del logaritmo: sale
              112 en lugar de 130. La temperatura cambia durante ese tramo, así
              que no hay una sola $T$ entre la que dividir.
        pista: |
          Dos términos, y cada uno con su fórmula:
          $nC_p\ln(T_2/T_1)$ para el que calienta, y
          $n\Delta H/T$ para el que cambia de fase.
        desarrollo: |
          $$
          n = \frac{100}{18{,}02} = 5{,}549\ \text{mol}
          $$
          $$
          \Delta S_{\text{calentar}} = 5{,}549\cdot 75{,}31\cdot
          \ln\frac{373{,}15}{273{,}15} = 130{,}4\ \text{J/K}
          $$
          $$
          \Delta S_{\text{vaporizar}} = \frac{5{,}549\cdot 44\,030}{373{,}15}
          = 654{,}8\ \text{J/K}
          $$
          $$
          \Delta S = 785\ \text{J/K}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 100 g son 5,549 mol, porque los dos datos vienen por mol.
          - texto: >-
              El calentamiento va de 273,15 a 373,15 K, así que la temperatura
              cambia y hay que integrar.
          - texto: >-
              $\Delta S = nC_p\ln(T_2/T_1) = 130{,}4$ J/K.
          - texto: >-
              La vaporización ocurre toda a 373,15 K, así que ahí sí vale
              dividir: 654,8 J/K.
          - texto: >-
              En total, 785 J/K, y el 83 % lo aporta el cambio de fase.
          - texto: >-
              Para el calentamiento se puede usar igualmente $q/T$ tomando la
              temperatura media del tramo, que da lo mismo.
            trampa: true
            mensaje: |
              No da lo mismo, y la diferencia no es despreciable: con la media
              —323 K— salen 129,4 J/K frente a 130,4, y con la temperatura
              final, 112.

              La media se acerca por casualidad en tramos cortos, pero el
              logaritmo no es una división: la entropía ganada al principio,
              cuando el agua está fría, es mayor que la ganada al final. El
              mismo julio desordena más un sistema a 273 K que a 373.
        veredicto: |
          Una sola pregunta decide la fórmula: ¿cambia la temperatura durante
          el tramo? Si cambia, logaritmo. Si no, división.

    resolucion: |
      **La idea.** La entropía de un proceso se calcula por tramos, igual que
      el calor, pero la fórmula depende de si la temperatura se mueve.

      $$
      n = \frac{100}{18{,}02} = 5{,}549\ \text{mol}
      $$

      **Tramo que calienta**, de 273,15 a 373,15 K. La temperatura cambia, así
      que hay que sumar $dq/T$ a lo largo del camino, y eso da un logaritmo:

      $$
      \Delta S = n\,C_p \ln\frac{T_2}{T_1}
      = 5{,}549\cdot 75{,}31\cdot \ln 1{,}366 = 130{,}4\ \text{J/K}
      $$

      **Tramo que vaporiza**, todo a 373,15 K. Aquí sí hay una sola
      temperatura:

      $$
      \Delta S = \frac{n\,\Delta H_{\text{vap}}}{T}
      = \frac{5{,}549\cdot 44\,030}{373{,}15} = 654{,}8\ \text{J/K}
      $$
      $$
      \boxed{\;\Delta S = 785\ \text{J/K}\;}
      $$

      **Por qué el logaritmo y no una división.** Porque el mismo julio
      desordena más un sistema frío que uno caliente: a 273 K aporta
      $1/273$ de entropía y a 373 K solo $1/373$. Al ir sumando esos aportes
      decrecientes a lo largo del calentamiento aparece el logaritmo, que es
      lo que queda de integrar $1/T$.

      Con $q/T$ usando la temperatura final salen 112 J/K, un 14 % menos. Con
      la media del tramo se acerca —129,4— pero por casualidad: en un
      calentamiento largo las dos cosas se separan mucho.

      **Y el reparto**, que conviene mirar: el cambio de fase aporta el 83 %.
      Igual que en el balance de calor del tema 6, hervir es lo caro. Aquí
      además tiene una lectura física directa — pasar de líquido a gas
      multiplica por mil el volumen disponible para cada molécula, y eso son
      muchísimas más maneras de repartir la misma energía.

  # ── Y a partir de aquí, los problemas propuestos de la colección de
  #    termodinámica, en su orden (§04). La colección publica la respuesta
  #    final; el desarrollo y los distractores son nuestros.
  - id: colfq7-1-la-entropia-de-condensar
    titulo: La entropía de condensar, y por qué sale negativa
    fuente: >-
      Problema 1 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de entropía del proceso correspondiente a la
      condensación de 10 g de vapor de agua a 100 ºC y 1 atm.

      **Dato:** Entalpía de vaporización del agua 40,66 kJ mol⁻¹.
    pide: La variación de entropía del proceso, en J/K.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede calcular la entropía con $\Delta S = \Delta H / T$
          en este caso y no en cualquier otro?
        opciones:
          - texto: Porque es un cambio de fase, que ocurre a temperatura constante y en equilibrio
            correcta: true
            mensaje: |
              Esas son las dos condiciones. La fórmula sale de
              $\Delta S = q_{\text{rev}}/T$, y solo se puede sacar la $T$ de
              la integral si no cambia. En un cambio de fase a presión
              constante no cambia, y además el calor intercambiado es
              exactamente $\Delta H$.
          - texto: Porque el agua es una sustancia pura
            mensaje: |
              Ser pura no basta: calentar agua líquida de 20 a 90 °C también
              es agua pura y ahí la temperatura sí cambia, así que hay que
              integrar $C_p\,\mathrm{d}T/T$.
          - texto: Porque la presión es de 1 atm
            mensaje: |
              La presión constante es lo que hace que el calor sea igual a
              $\Delta H$, y eso hace falta, pero no es lo que permite dividir
              entre una sola $T$. Lo que lo permite es que la temperatura no
              cambie.
          - texto: Porque la entalpía de vaporización está tabulada
            mensaje: |
              Tener el dato no justifica la fórmula. Hay muchos procesos con
              $\Delta H$ conocido en los que $\Delta S \neq \Delta H/T$,
              precisamente porque la temperatura varía durante el camino.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          Para los 10 g de vapor, tomando 18 g/mol y $T = 373$ K, ¿cuánto vale
          $\Delta S$, en J/K?
        respuesta:
          tipo: numero
          valor: '-60.56'
          tolerancia: 0.2
          formato: un número, con dos decimales, en julios por kelvin
        distractores:
          - valor: '60.56'
            mensaje: |
              El módulo está bien y el signo no. Condensar es pasar de gas a
              líquido, o sea de mucho desorden a poco: la entropía **baja**.
              El sistema cede calor, así que $\Delta H$ es negativa y
              $\Delta S$ también.
          - valor: '-109.01'
            mensaje: |
              Ese es el valor **por mol**. Aquí no hay un mol: hay 10 g, que
              son 0,556 mol. Falta multiplicar.
          - valor: '-0.1624'
            mensaje: |
              Has dejado la entalpía en kilojulios. El resultado se pide en
              J/K, así que los 40,66 kJ/mol hay que pasarlos a 40 660 J/mol.
        pista: |
          $\Delta S = \dfrac{n \cdot \Delta H_{\text{cond}}}{T}$, con
          $\Delta H_{\text{cond}} = -\Delta H_{\text{vap}}$.
        desarrollo: |
          $$
          n = \frac{10}{18} = 0{,}556\ \mathrm{mol}
          $$

          $$
          \Delta S = \frac{0{,}556 \times (-40660)}{373} = -60{,}56\ \mathrm{J\,K^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Condensar es un cambio de fase: ocurre a temperatura constante, 373 K, y en equilibrio.'
          - texto: 'Por eso ΔS = q_rev / T se simplifica a ΔS = ΔH / T, con ΔH el calor a presión constante.'
          - texto: 'La condensación es el proceso inverso de la vaporización, así que su entalpía es −40,66 kJ/mol.'
          - texto: 'Con 10 g, o sea 0,556 mol, sale ΔS = 0,556 × (−40 660) / 373 = −60,56 J/K.'
          - texto: 'El signo negativo indica que el proceso no es espontáneo, porque la entropía siempre tiene que aumentar.'
            trampa: true
            mensaje: |
              Lo que nunca disminuye es la entropía del **universo**, no la
              del sistema. Aquí el sistema ordena sus moléculas y su entropía
              baja, pero suelta calor al entorno y la del entorno sube más:
              $+60{,}56$ J/K a 373 K, que compensa exactamente. Por eso el
              vapor condensa solo cuando se enfría un poco por debajo, y por
              eso la condensación es perfectamente espontánea.
    resolucion: |
      **Por qué la fórmula corta vale aquí.** La definición general es
      $\Delta S = \int \mathrm{d}q_{\text{rev}}/T$, y solo se convierte en
      $\Delta H/T$ cuando se dan dos cosas a la vez: que la temperatura sea
      constante —para poder sacarla de la integral— y que el proceso sea a
      presión constante —para que el calor sea $\Delta H$—. Un cambio de fase
      cumple las dos.

      **La cuenta.**

      $$
      n = \frac{10}{18} = 0{,}556\ \mathrm{mol}
      $$

      $$
      \Delta S = \frac{n \, \Delta H_{\text{cond}}}{T} = \frac{0{,}556 \times (-40660)}{373} = -60{,}56\ \mathrm{J\,K^{-1}}
      $$

      Dos detalles que cuestan puntos: la entalpía de **condensación** es la
      de vaporización cambiada de signo, y la temperatura va en kelvin —373,
      no 100—.

      **El signo, que es lo que el problema quiere que entiendas.** Sale
      negativo porque el vapor se ordena: pasa de moléculas sueltas a un
      líquido. Y eso **no** contradice el segundo principio, aunque lo
      parezca.

      Lo que no puede disminuir es la entropía del universo, que es la del
      sistema más la del entorno. El agua suelta 22,6 kJ al condensarse, y el
      entorno los recibe a esa misma temperatura:

      $$
      \Delta S_{\text{entorno}} = \frac{+22600}{373} = +60{,}56\ \mathrm{J\,K^{-1}}
      $$

      La suma es cero, que es lo que caracteriza a un proceso **reversible**:
      vapor y líquido en equilibrio a 100 °C y 1 atm. En cuanto la
      temperatura baja un poco, el entorno gana más de lo que el sistema
      pierde y la condensación se vuelve espontánea.

  - id: colfq7-8-la-expansion-isoterma-entera
    titulo: Una expansión isoterma, y las seis magnitudes de una vez
    fuente: >-
      Problema 8 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de energía interna, calor, trabajo, variación de
      entalpía, variación de entropía y variación de energía libre para el
      siguiente proceso: un mol de gas ideal monoatómico se expansiona
      reversible e isotérmicamente a 300 K desde un volumen inicial de 10 L
      hasta un volumen final de 20 L.
    pide: Las seis magnitudes del proceso.

    pasos:
      - tipo: reconocer
        pregunta: |
          El proceso es isotermo y el gas es ideal. ¿Qué se puede afirmar
          antes de calcular nada?
        opciones:
          - texto: Que $\Delta E = 0$ y $\Delta H = 0$, porque en un gas ideal solo dependen de la temperatura
            correcta: true
            mensaje: |
              Eso es, y ahorra la mitad del problema. En un gas ideal no hay
              interacciones entre moléculas, así que la energía interna solo
              depende de $T$; y como $H = E + PV = E + nRT$, la entalpía
              también. Si $T$ no cambia, las dos son cero.
          - texto: Que $q = 0$, porque no cambia la temperatura
            mensaje: |
              Eso sería un proceso **adiabático**, que es otra cosa. Aquí sí
              entra calor: el gas hace trabajo al expandirse y necesita
              reponer esa energía para no enfriarse. Precisamente por eso la
              temperatura se mantiene.
          - texto: Que $W = 0$, porque no hay cambio de energía interna
            mensaje: |
              $\Delta E = 0$ no significa que no pase nada: significa que el
              calor y el trabajo se compensan. El gas sí se expande contra el
              exterior, así que hace trabajo.
          - texto: Que $\Delta S = 0$, porque el proceso es reversible
            mensaje: |
              Reversible significa que la entropía del **universo** no cambia,
              no la del sistema. El gas pasa a ocupar el doble de volumen y
              su entropía sube; la del entorno baja lo mismo.

      - tipo: calcular
        titulo: El calor absorbido
        pregunta: |
          ¿Cuánto calor absorbe el gas, en julios? Toma
          $R = 8{,}314$ J K⁻¹ mol⁻¹.
        respuesta:
          tipo: numero
          valor: '1728'
          tolerancia: 3
          formato: un número entero, en julios
        distractores:
          - valor: '751'
            mensaje: |
              Has usado el logaritmo decimal. La fórmula lleva logaritmo
              **neperiano**: $\ln 2 = 0{,}693$, no $\log 2 = 0{,}301$. La
              diferencia es el factor 2,303.
          - valor: '-1728'
            mensaje: |
              El módulo está bien y el signo no. El gas se expande, así que
              **hace** trabajo sobre el exterior, y para no enfriarse tiene
              que **absorber** calor: $q$ es positivo.
          - valor: '2494'
            mensaje: |
              Eso es $nRT$ a secas, sin el logaritmo. Sería el trabajo de una
              expansión de otro tipo, no el de una isoterma reversible.
        pista: |
          Como $\Delta E = 0$, todo el calor se va en trabajo:
          $q = nRT \ln(V_2/V_1)$.
        desarrollo: |
          $$
          q = nRT \ln\frac{V_2}{V_1} = 1 \times 8{,}314 \times 300 \times \ln 2 = 1728\ \mathrm{J}
          $$

          Y el trabajo es el mismo con el signo cambiado, $W = -1728$ J, con
          el convenio de que $W$ es lo que **recibe** el sistema.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S$, en J/K?
        respuesta:
          tipo: numero
          valor: '5.76'
          tolerancia: 0.02
          formato: un número, con dos decimales, en julios por kelvin
        distractores:
          - valor: '-5.76'
            mensaje: |
              Signo cambiado. El gas pasa a ocupar el doble de volumen, así
              que tiene más sitio donde estar y su entropía **sube**.
          - valor: '1728'
            mensaje: |
              Ese es el calor. Falta dividir entre la temperatura, que es lo
              que convierte julios en julios por kelvin.
          - valor: '2.88'
            mensaje: |
              Parece que has dividido entre 600 en vez de entre 300, o que has
              usado la mitad del calor. La temperatura del proceso es 300 K y
              no cambia.
        pista: |
          $\Delta S = q_{\text{rev}} / T$, y el proceso es reversible.
        desarrollo: |
          $$
          \Delta S = \frac{q_{\text{rev}}}{T} = \frac{1728}{300} = 5{,}76\ \mathrm{J\,K^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'En un gas ideal E y H solo dependen de la temperatura, así que en un proceso isotermo ΔE = 0 y ΔH = 0.'
          - texto: 'Por la primera ley, ΔE = q + W = 0, así que el calor y el trabajo son iguales y de signo contrario.'
          - texto: 'El gas se expande, luego hace trabajo sobre el exterior: W = −1728 J y q = +1728 J.'
          - texto: 'Al ser reversible, ΔS = q/T = 1728/300 = 5,76 J/K.'
          - texto: 'Y ΔG = ΔH − TΔS = 0 − 300 × 5,76 = −1728 J, negativo, como corresponde a un proceso que ocurre solo.'
          - texto: 'Como ΔE = 0, el gas ni absorbe ni cede energía durante el proceso.'
            trampa: true
            mensaje: |
              Confunde el balance con los flujos. La energía interna no
              cambia, pero eso es porque entran 1728 J de calor y salen 1728 J
              de trabajo, no porque no pase nada. Si no entrara calor el gas
              se enfriaría, y el proceso dejaría de ser isotermo.
    resolucion: |
      **Lo que sale gratis.** El gas es ideal y el proceso isotermo, así que

      $$
      \Delta E = 0 \qquad \Delta H = 0
      $$

      En un gas ideal no hay interacciones intermoleculares, de modo que la
      energía interna solo depende de la temperatura. Y $H = E + PV = E + nRT$,
      así que la entalpía también.

      **Calor y trabajo.** Por la primera ley, $\Delta E = q + W = 0$, así que
      son iguales y opuestos. Para una expansión isoterma reversible:

      $$
      q = nRT \ln\frac{V_2}{V_1} = 1 \times 8{,}314 \times 300 \times \ln 2 = 1728\ \mathrm{J}
      $$

      $$
      W = -1728\ \mathrm{J}
      $$

      El signo de $W$ depende del convenio, y aquí se usa el de la asignatura:
      positivo lo que **entra** al sistema. El gas se expande, así que entrega
      trabajo y $W$ es negativo.

      **Entropía y energía libre.**

      $$
      \Delta S = \frac{q_{\text{rev}}}{T} = \frac{1728}{300} = 5{,}76\ \mathrm{J\,K^{-1}}
      $$

      $$
      \Delta G = \Delta H - T\Delta S = 0 - 300 \times 5{,}76 = -1728\ \mathrm{J}
      $$

      **La coincidencia que no lo es.** $\Delta G$ sale exactamente igual que
      $W$, y no es casualidad: con $\Delta H = 0$, la energía libre es
      $-T\Delta S = -q$, y el calor es a su vez el trabajo cambiado de signo.
      En un proceso isotermo, $\Delta G$ mide el trabajo máximo distinto del
      de expansión que se podría extraer — y aquí no hay ninguno más, así que
      coinciden.

      El signo negativo dice lo que se espera: un gas encerrado en 10 L al que
      se le da acceso a 20 L se expande solo.

  - id: colfq7-7-el-etano-y-si-arde-solo
    titulo: Si el etano arde solo, y por qué eso no basta para que arda
    fuente: >-
      Problema 7 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de energía libre en el proceso de combustión del
      etano en condiciones estándar y decir si la reacción es espontánea.

      **Datos:** ΔGºf (CO2 (g)) = −394,359 kJ mol⁻¹, ΔGºf (H2O (g)) =
      −237,129 kJ mol⁻¹, ΔGºf (C2H6 (g)) = −32,82 kJ mol⁻¹
    pide: La energía libre estándar de la combustión y si el proceso es espontáneo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla no da la energía libre de formación del oxígeno. ¿Falta un
          dato?
        opciones:
          - texto: No, vale cero por ser un elemento en su forma más estable
            correcta: true
            mensaje: |
              Exacto. La energía libre de formación mide lo que cuesta formar
              un compuesto **a partir de sus elementos**; formar oxígeno a
              partir de oxígeno no cuesta nada, por definición. Lo mismo vale
              para $\Delta H^{0}_f$.
          - texto: Sí, y hay que buscarlo en una tabla
            mensaje: |
              No hay nada que buscar: es cero por convenio, y el convenio no
              es arbitrario. Todas las energías libres de formación están
              medidas **respecto de** los elementos, así que estos son el
              origen de la escala.
          - texto: No, porque el oxígeno no aparece en la ecuación ajustada
            mensaje: |
              Sí aparece, y con coeficiente $7/2$: sin oxígeno no hay
              combustión. Lo que pasa es que su contribución al sumatorio es
              cero.
          - texto: Sí, pero se puede estimar a partir de la del agua
            mensaje: |
              Estimar un dato que ya está determinado por convenio es
              inventarse un problema. Vale cero, exactamente.

      - tipo: calcular
        titulo: La energía libre de la combustión
        pregunta: |
          Con la ecuación ajustada
          $\mathrm{C_2H_6} + \tfrac{7}{2}\mathrm{O_2} \rightarrow 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$,
          ¿cuánto vale $\Delta G^{0}$, en kJ por mol de etano?
        respuesta:
          tipo: numero
          valor: '-1467.3'
          tolerancia: 0.2
          formato: un número, con un decimal, en kilojulios por mol
        distractores:
          - valor: '1467.3'
            mensaje: |
              Signo cambiado. El sumatorio es productos **menos** reactivos, y
              los productos están mucho más abajo en energía libre: la
              combustión libera.
          - valor: '-1532.9'
            mensaje: |
              Has **sumado** la energía libre del etano en vez de restarla. El
              reactivo va con signo menos, y como su $\Delta G^{0}_f$ ya es
              negativa, restarla **sube** el resultado en 32,82.
          - valor: '-631.5'
            mensaje: |
              Parece que no has aplicado los coeficientes. Hay 2 moles de CO₂
              y 3 de H₂O por cada mol de etano, y cada energía de formación va
              multiplicada por el suyo.
        pista: |
          $\Delta G^{0} = \sum n \Delta G^{0}_f(\text{productos}) - \sum n \Delta G^{0}_f(\text{reactivos})$,
          y el oxígeno aporta cero.
        desarrollo: |
          $$
          \Delta G^{0} = \left[2(-394{,}359) + 3(-237{,}129)\right] - \left[(-32{,}82) + \tfrac{7}{2}(0)\right]
          $$

          $$
          \Delta G^{0} = -1500{,}105 + 32{,}82 = -1467{,}29\ \mathrm{kJ\,mol^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La ecuación ajustada es C₂H₆ + 7/2 O₂ → 2 CO₂ + 3 H₂O, y el oxígeno aporta cero por ser un elemento en su forma estable.'
          - texto: 'El sumatorio es productos menos reactivos, cada uno multiplicado por su coeficiente.'
          - texto: 'Los productos suman 2(−394,359) + 3(−237,129) = −1500,105 kJ.'
          - texto: 'Restar el reactivo, cuya energía es −32,82, equivale a sumar 32,82, y el resultado es −1467,3 kJ/mol.'
          - texto: 'Al ser ΔG⁰ negativa la reacción es espontánea en condiciones estándar, aunque eso no dice nada de lo deprisa que ocurre.'
          - texto: 'Como ΔG⁰ es muy negativa, la reacción ocurrirá rápidamente en cuanto se mezclen etano y oxígeno.'
            trampa: true
            mensaje: |
              Es la confusión entre termodinámica y cinética, y este ejercicio
              existe en parte para romperla. Una mezcla de etano y aire puede
              estar años sin reaccionar: le falta la energía de activación,
              que es lo que aporta una chispa. La energía libre dice **si**
              puede ocurrir, nunca **cuándo**.
    resolucion: |
      **La ecuación, primero.** Sin ajustar no hay coeficientes, y sin
      coeficientes el sumatorio sale mal:

      $$
      \mathrm{C_2H_6} + \tfrac{7}{2}\,\mathrm{O_2} \;\longrightarrow\; 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}
      $$

      El oxígeno es un elemento en su forma más estable, así que
      $\Delta G^{0}_f = 0$ por definición de la escala. No es un dato que
      falte.

      **El sumatorio.**

      $$
      \Delta G^{0} = \sum n\,\Delta G^{0}_f(\text{prod}) - \sum n\,\Delta G^{0}_f(\text{react})
      $$

      $$
      \Delta G^{0} = \left[2(-394{,}359) + 3(-237{,}129)\right] - (-32{,}82) = -1467{,}29\ \mathrm{kJ\,mol^{-1}}
      $$

      Al ser negativa, **la combustión del etano es espontánea en condiciones
      estándar**.

      **Dos avisos, y los dos importan.**

      El primero es de método: **espontáneo no es rápido**. El etano y el aire
      pueden convivir indefinidamente en un depósito; lo que les falta no es
      energía libre sino energía de activación, y eso lo aporta una chispa. La
      termodinámica dice si un proceso puede ocurrir, la cinética dice cuándo.
      El examen pregunta por lo primero y la vida por lo segundo.

      El segundo es sobre los datos. Con los tres valores del enunciado sale
      $-1467{,}29$, y **la colección publica $-1467{,}37$**: ocho centésimas
      de diferencia, que vienen de redondeos en las energías tabuladas. No es
      un error de nadie y no cambia ninguna conclusión, pero conviene saberlo
      para no repasar la cuenta tres veces buscando un fallo que no está.

      Y una nota sobre el agua: el enunciado etiqueta el dato como
      H₂O **(g)**, aunque $-237{,}129$ kJ/mol es el valor tabulado del agua
      **líquida**. Se reproduce tal cual porque es lo que hay en la colección
      y porque es el valor con el que sale su respuesta; con el del
      vapor, $-228{,}6$, el resultado sería unos 25 kJ menos negativo.
