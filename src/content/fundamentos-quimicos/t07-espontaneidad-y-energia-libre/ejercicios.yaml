ejercicios:
  # ── Los dos son NUESTROS (§08). En los exámenes este tema nunca viene solo:
  #    es el último apartado de un ejercicio de termoquímica de seis partes,
  #    así que quien llega ahí ya arrastra cinco resultados. Aquí cada idea se
  #    aísla: colocar una reacción en su caso y encontrar su temperatura de
  #    inversión, y distinguir el logaritmo de la división.
  - id: ejfq7-la-cal-y-la-temperatura-del-horno
    titulo: Por qué un horno de cal tiene que estar a más de 837 grados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      La cal viva se fabrica descomponiendo caliza en un horno:

      $$
      \mathrm{CaCO_3\,(s)} \rightarrow \mathrm{CaO\,(s)} + \mathrm{CO_2\,(g)}
      $$

      Determinar por encima de qué temperatura la reacción es espontánea.

      **Datos:**

      | sustancia | ΔH⁰f (kJ/mol) | S⁰ (J/mol·K) |
      |---|---|---|
      | CaCO3 (s) | −1206,9 | 92,9 |
      | CaO (s) | −635,1 | 39,8 |
      | CO2 (g) | −393,5 | 213,7 |
    pide: La temperatura a partir de la cual la descomposición es espontánea.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué signo esperas para $\Delta S$, y por
          qué?
        opciones:
          - texto: >-
              Positivo, porque aparece un mol de gas donde no había ninguno
            correcta: true
            mensaje: |
              Eso es, y con eso ya sabes en qué caso estás sin tocar la tabla.
              Los moles de gas mandan sobre todo lo demás: un sólido que se
              parte en otro sólido y un gas siempre gana entropía.
          - texto: >-
              Negativo, porque de una sustancia salen dos y eso ordena el
              sistema
            mensaje: |
              Al revés: repartir la materia en más especies, y sobre todo
              liberar un gas, **aumenta** el número de formas de repartir la
              energía.
          - texto: >-
              Cero, porque hay un mol a cada lado de la ecuación
            mensaje: |
              Hay un mol de sólido a la izquierda y dos sustancias a la
              derecha, una de ellas gas. Y aunque los moles totales
              coincidieran, un gas y un sólido no aportan lo mismo ni de lejos.
          - texto: >-
              No se puede saber sin las entropías absolutas de la tabla
            mensaje: |
              Se puede estimar el **signo**, que es lo que decide en qué caso
              de los cuatro estás. El valor exacto sí necesita la tabla, pero
              la dirección no.

      - tipo: calcular
        titulo: La temperatura de inversión
        pregunta: |
          ¿Por encima de qué temperatura, en kelvin, es espontánea la
          descomposición?
        respuesta:
          tipo: numero
          valor: '1110'
          tolerancia: 20
          formato: la temperatura en kelvin
        distractores:
          - valor: '1110000'
            mensaje: |
              Un factor mil: has mezclado las unidades. La entalpía viene en
              **kJ** y la entropía en **J**, así que hay que llevar las dos a
              la misma antes de dividir.
          - valor: '837'
            mensaje: |
              Esa es la temperatura en grados **centígrados**, que es la
              respuesta correcta con otra unidad. La pregunta pide kelvin: hay
              que sumar 273.
        pista: |
          El umbral es donde $\Delta G$ se anula, o sea
          $T = \Delta H / \Delta S$. Calcula los dos por productos menos
          reactivos y cuida las unidades: uno viene en kJ y el otro en J.
        desarrollo: |
          $$
          \Delta H^{0} = \left[-635{,}1 + (-393{,}5)\right] - (-1206{,}9)
          = +178{,}3\ \text{kJ/mol}
          $$
          $$
          \Delta S^{0} = \left[39{,}8 + 213{,}7\right] - 92{,}9
          = +160{,}6\ \text{J/(mol·K)}
          $$
          $$
          T = \frac{178{,}3}{0{,}1606} = 1110\ \text{K} = 837\ \text{°C}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La reacción libera un gas donde no había ninguno, así que
              $\Delta S > 0$ antes de mirar la tabla.
          - texto: >-
              Con las entalpías de formación, $\Delta H = +178{,}3$ kJ/mol:
              endotérmica.
          - texto: >-
              Con las entropías absolutas, $\Delta S = +160{,}6$ J/(mol·K).
          - texto: >-
              Los dos positivos es el caso «solo en caliente»: hay un umbral y
              por encima de él la reacción se da la vuelta.
          - texto: >-
              El umbral es $T = \Delta H/\Delta S = 1110$ K, o 837 °C, que es
              por qué un horno de cal trabaja por encima de los 900.
          - texto: >-
              Como la reacción es endotérmica, hay que aportar calor
              continuamente, y ese aporte es lo que la hace espontánea.
            trampa: true
            mensaje: |
              Se mezclan dos cosas distintas. Que haya que aportar calor es
              cierto —es endotérmica— pero eso no es lo que la hace
              espontánea: lo que la hace espontánea es que la **temperatura**
              sea alta, porque el término $-T\Delta S$ crece con ella.

              La prueba de que son cosas distintas: a 25 °C también puedes
              aportarle calor sin parar, y la caliza no se descompone. Lo que
              hace falta no es energía, es temperatura.
        veredicto: |
          Dos signos y una división. Colocar la reacción en su caso es casi
          todo el ejercicio; el número es la parte fácil.

    resolucion: |
      **La idea.** Con $\Delta H$ y $\Delta S$ del mismo signo hay siempre una
      temperatura frontera, y encontrarla es una división.

      Aquí los dos son positivos —endotérmica y con ganancia de entropía—, que
      es el caso **«solo en caliente»**:

      $$
      \Delta H^{0} = (-635{,}1 - 393{,}5) + 1206{,}9 = +178{,}3\ \text{kJ/mol}
      $$
      $$
      \Delta S^{0} = (39{,}8 + 213{,}7) - 92{,}9 = +160{,}6\ \text{J/(mol·K)}
      $$

      El umbral es donde $\Delta G = \Delta H - T\Delta S$ se anula:

      $$
      \boxed{\;T = \frac{178{,}3}{0{,}1606} = 1110\ \text{K} = 837\ \text{°C}\;}
      $$

      **Comprobación con la realidad**, que es lo que hace bonito el ejercicio:
      los hornos de cal industriales trabajan entre 900 y 1000 °C. No es
      casualidad ni margen de seguridad arbitrario — es que por debajo de 837
      la reacción sencillamente no va, por mucho combustible que se queme.

      Y el contraste con la temperatura ambiente:

      $$
      \Delta G_{298} = 178{,}3 - 298{,}15\cdot 0{,}1606 = +130{,}4\ \text{kJ/mol}
      $$

      muy positiva, o sea que a 25 °C lo espontáneo es lo contrario: la cal
      viva reacciona con el CO₂ del aire y vuelve a caliza. Es exactamente lo
      que pasa con la cal apagada de una obra al fraguar.

  - id: ejfq7-el-logaritmo-o-la-division
    titulo: El logaritmo o la división, según cambie la temperatura
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se toman **100 g de agua a 0 °C** y se calientan hasta 100 °C, y allí se
      vaporizan por completo, todo a presión atmosférica.

      Calcular la variación de entropía del agua en todo el proceso.

      **Datos:** Cp del agua líquida = 75,31 J/(mol·K) · ΔHvaporización =
      44,03 kJ/mol · masa molar del agua = 18,02 g/mol.
    pide: La variación de entropía del agua, en J/K.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos tramos absorben calor, pero se calculan de forma distinta.
          ¿Qué los distingue?
        opciones:
          - texto: >-
              Que en uno la temperatura cambia y en el otro no
            correcta: true
            mensaje: |
              Exacto, y es la única pregunta que hay que hacerse. Si la
              temperatura cambia no hay una sola $T$ entre la que dividir, así
              que hay que integrar y sale un logaritmo.
          - texto: >-
              Que uno es reversible y el otro no
            mensaje: |
              Los dos se suponen reversibles: es lo que permite usar
              $\Delta S = q_{\text{rev}}/T$ en el segundo. Lo que cambia es
              otra cosa.
          - texto: >-
              Que uno cambia de fase y el otro no, y los cambios de fase no
              tienen entropía
            mensaje: |
              El cambio de fase es justo el que **más** entropía aporta aquí:
              655 de los 785 J/K. Pasar de líquido a gas es el mayor salto de
              desorden que hay.
          - texto: >-
              Que el calor del segundo es mucho mayor
            mensaje: |
              Es cierto que lo es, pero eso no cambia **cómo** se calcula. Lo
              que decide la fórmula es si la temperatura es constante o no.

      - tipo: calcular
        titulo: La entropía total
        pregunta: ¿Cuánto aumenta la entropía del agua en todo el proceso?
        respuesta:
          tipo: numero
          valor: '785'
          tolerancia: 12
          formato: la entropía en J/K
        distractores:
          - valor: '655'
            mensaje: |
              Esa es solo la vaporización. Falta el calentamiento de 0 a
              100 °C, que aporta otros 130 J/K.
          - valor: '767'
            mensaje: |
              Has usado $q/T$ para el calentamiento en vez del logaritmo: sale
              112 en lugar de 130. La temperatura cambia durante ese tramo, así
              que no hay una sola $T$ entre la que dividir.
        pista: |
          Dos términos, y cada uno con su fórmula:
          $nC_p\ln(T_2/T_1)$ para el que calienta, y
          $n\Delta H/T$ para el que cambia de fase.
        desarrollo: |
          $$
          n = \frac{100}{18{,}02} = 5{,}549\ \text{mol}
          $$
          $$
          \Delta S_{\text{calentar}} = 5{,}549\cdot 75{,}31\cdot
          \ln\frac{373{,}15}{273{,}15} = 130{,}4\ \text{J/K}
          $$
          $$
          \Delta S_{\text{vaporizar}} = \frac{5{,}549\cdot 44\,030}{373{,}15}
          = 654{,}8\ \text{J/K}
          $$
          $$
          \Delta S = 785\ \text{J/K}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 100 g son 5,549 mol, porque los dos datos vienen por mol.
          - texto: >-
              El calentamiento va de 273,15 a 373,15 K, así que la temperatura
              cambia y hay que integrar.
          - texto: >-
              $\Delta S = nC_p\ln(T_2/T_1) = 130{,}4$ J/K.
          - texto: >-
              La vaporización ocurre toda a 373,15 K, así que ahí sí vale
              dividir: 654,8 J/K.
          - texto: >-
              En total, 785 J/K, y el 83 % lo aporta el cambio de fase.
          - texto: >-
              Para el calentamiento se puede usar igualmente $q/T$ tomando la
              temperatura media del tramo, que da lo mismo.
            trampa: true
            mensaje: |
              No da lo mismo, y la diferencia no es despreciable: con la media
              —323 K— salen 129,4 J/K frente a 130,4, y con la temperatura
              final, 112.

              La media se acerca por casualidad en tramos cortos, pero el
              logaritmo no es una división: la entropía ganada al principio,
              cuando el agua está fría, es mayor que la ganada al final. El
              mismo julio desordena más un sistema a 273 K que a 373.
        veredicto: |
          Una sola pregunta decide la fórmula: ¿cambia la temperatura durante
          el tramo? Si cambia, logaritmo. Si no, división.

    resolucion: |
      **La idea.** La entropía de un proceso se calcula por tramos, igual que
      el calor, pero la fórmula depende de si la temperatura se mueve.

      $$
      n = \frac{100}{18{,}02} = 5{,}549\ \text{mol}
      $$

      **Tramo que calienta**, de 273,15 a 373,15 K. La temperatura cambia, así
      que hay que sumar $dq/T$ a lo largo del camino, y eso da un logaritmo:

      $$
      \Delta S = n\,C_p \ln\frac{T_2}{T_1}
      = 5{,}549\cdot 75{,}31\cdot \ln 1{,}366 = 130{,}4\ \text{J/K}
      $$

      **Tramo que vaporiza**, todo a 373,15 K. Aquí sí hay una sola
      temperatura:

      $$
      \Delta S = \frac{n\,\Delta H_{\text{vap}}}{T}
      = \frac{5{,}549\cdot 44\,030}{373{,}15} = 654{,}8\ \text{J/K}
      $$
      $$
      \boxed{\;\Delta S = 785\ \text{J/K}\;}
      $$

      **Por qué el logaritmo y no una división.** Porque el mismo julio
      desordena más un sistema frío que uno caliente: a 273 K aporta
      $1/273$ de entropía y a 373 K solo $1/373$. Al ir sumando esos aportes
      decrecientes a lo largo del calentamiento aparece el logaritmo, que es
      lo que queda de integrar $1/T$.

      Con $q/T$ usando la temperatura final salen 112 J/K, un 14 % menos. Con
      la media del tramo se acerca —129,4— pero por casualidad: en un
      calentamiento largo las dos cosas se separan mucho.

      **Y el reparto**, que conviene mirar: el cambio de fase aporta el 83 %.
      Igual que en el balance de calor del tema 6, hervir es lo caro. Aquí
      además tiene una lectura física directa — pasar de líquido a gas
      multiplica por mil el volumen disponible para cada molécula, y eso son
      muchísimas más maneras de repartir la misma energía.

  # ── Y a partir de aquí, los problemas propuestos de la colección de
  #    termodinámica, en su orden (§04). La colección publica la respuesta
  #    final; el desarrollo y los distractores son nuestros.
  - id: colfq7-1-la-entropia-de-condensar
    titulo: La entropía de condensar, y por qué sale negativa
    fuente: >-
      Problema 1 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de entropía del proceso correspondiente a la
      condensación de 10 g de vapor de agua a 100 ºC y 1 atm.

      **Dato:** Entalpía de vaporización del agua 40,66 kJ mol⁻¹.
    pide: La variación de entropía del proceso, en J/K.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede calcular la entropía con $\Delta S = \Delta H / T$
          en este caso y no en cualquier otro?
        opciones:
          - texto: Porque es un cambio de fase, que ocurre a temperatura constante y en equilibrio
            correcta: true
            mensaje: |
              Esas son las dos condiciones. La fórmula sale de
              $\Delta S = q_{\text{rev}}/T$, y solo se puede sacar la $T$ de
              la integral si no cambia. En un cambio de fase a presión
              constante no cambia, y además el calor intercambiado es
              exactamente $\Delta H$.
          - texto: Porque el agua es una sustancia pura
            mensaje: |
              Ser pura no basta: calentar agua líquida de 20 a 90 °C también
              es agua pura y ahí la temperatura sí cambia, así que hay que
              integrar $C_p\,\mathrm{d}T/T$.
          - texto: Porque la presión es de 1 atm
            mensaje: |
              La presión constante es lo que hace que el calor sea igual a
              $\Delta H$, y eso hace falta, pero no es lo que permite dividir
              entre una sola $T$. Lo que lo permite es que la temperatura no
              cambie.
          - texto: Porque la entalpía de vaporización está tabulada
            mensaje: |
              Tener el dato no justifica la fórmula. Hay muchos procesos con
              $\Delta H$ conocido en los que $\Delta S \neq \Delta H/T$,
              precisamente porque la temperatura varía durante el camino.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          Para los 10 g de vapor, tomando 18 g/mol y $T = 373$ K, ¿cuánto vale
          $\Delta S$, en J/K?
        respuesta:
          tipo: numero
          valor: '-60.56'
          tolerancia: 0.2
          formato: un número, con dos decimales, en julios por kelvin
        distractores:
          - valor: '60.56'
            mensaje: |
              El módulo está bien y el signo no. Condensar es pasar de gas a
              líquido, o sea de mucho desorden a poco: la entropía **baja**.
              El sistema cede calor, así que $\Delta H$ es negativa y
              $\Delta S$ también.
          - valor: '-109.01'
            mensaje: |
              Ese es el valor **por mol**. Aquí no hay un mol: hay 10 g, que
              son 0,556 mol. Falta multiplicar.
          - valor: '-0.1624'
            mensaje: |
              Has dejado la entalpía en kilojulios. El resultado se pide en
              J/K, así que los 40,66 kJ/mol hay que pasarlos a 40 660 J/mol.
        pista: |
          $\Delta S = \dfrac{n \cdot \Delta H_{\text{cond}}}{T}$, con
          $\Delta H_{\text{cond}} = -\Delta H_{\text{vap}}$.
        desarrollo: |
          $$
          n = \frac{10}{18} = 0{,}556\ \mathrm{mol}
          $$

          $$
          \Delta S = \frac{0{,}556 \times (-40660)}{373} = -60{,}56\ \mathrm{J\,K^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Condensar es un cambio de fase: ocurre a temperatura constante, 373 K, y en equilibrio.'
          - texto: 'Por eso ΔS = q_rev / T se simplifica a ΔS = ΔH / T, con ΔH el calor a presión constante.'
          - texto: 'La condensación es el proceso inverso de la vaporización, así que su entalpía es −40,66 kJ/mol.'
          - texto: 'Con 10 g, o sea 0,556 mol, sale ΔS = 0,556 × (−40 660) / 373 = −60,56 J/K.'
          - texto: 'El signo negativo indica que el proceso no es espontáneo, porque la entropía siempre tiene que aumentar.'
            trampa: true
            mensaje: |
              Lo que nunca disminuye es la entropía del **universo**, no la
              del sistema. Aquí el sistema ordena sus moléculas y su entropía
              baja, pero suelta calor al entorno y la del entorno sube más:
              $+60{,}56$ J/K a 373 K, que compensa exactamente. Por eso el
              vapor condensa solo cuando se enfría un poco por debajo, y por
              eso la condensación es perfectamente espontánea.
    resolucion: |
      **Por qué la fórmula corta vale aquí.** La definición general es
      $\Delta S = \int \mathrm{d}q_{\text{rev}}/T$, y solo se convierte en
      $\Delta H/T$ cuando se dan dos cosas a la vez: que la temperatura sea
      constante —para poder sacarla de la integral— y que el proceso sea a
      presión constante —para que el calor sea $\Delta H$—. Un cambio de fase
      cumple las dos.

      **La cuenta.**

      $$
      n = \frac{10}{18} = 0{,}556\ \mathrm{mol}
      $$

      $$
      \Delta S = \frac{n \, \Delta H_{\text{cond}}}{T} = \frac{0{,}556 \times (-40660)}{373} = -60{,}56\ \mathrm{J\,K^{-1}}
      $$

      Dos detalles que cuestan puntos: la entalpía de **condensación** es la
      de vaporización cambiada de signo, y la temperatura va en kelvin —373,
      no 100—.

      **El signo, que es lo que el problema quiere que entiendas.** Sale
      negativo porque el vapor se ordena: pasa de moléculas sueltas a un
      líquido. Y eso **no** contradice el segundo principio, aunque lo
      parezca.

      Lo que no puede disminuir es la entropía del universo, que es la del
      sistema más la del entorno. El agua suelta 22,6 kJ al condensarse, y el
      entorno los recibe a esa misma temperatura:

      $$
      \Delta S_{\text{entorno}} = \frac{+22600}{373} = +60{,}56\ \mathrm{J\,K^{-1}}
      $$

      La suma es cero, que es lo que caracteriza a un proceso **reversible**:
      vapor y líquido en equilibrio a 100 °C y 1 atm. En cuanto la
      temperatura baja un poco, el entorno gana más de lo que el sistema
      pierde y la condensación se vuelve espontánea.

  - id: colfq7-2-el-hidrogeno-a-presion-constante
    titulo: Calentar hidrógeno a presión constante, y el calor que no se queda dentro
    fuente: >-
      Problema 2 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. El enunciado trae una errata, una «j» delante de
      CºP, y las cuatro cifras de la colección quedan entre un 0,1 y un 0,25 %
      por debajo de las que salen con R = 8,314.
    nivel: practica
    enunciado: |
      Un metro cúbico de hidrógeno, considerado como gas ideal, se calienta
      desde 298 K y 1 bar, hasta 400 K, reversiblemente y a presión constante.
      Calcular el calor absorbido por el gas, la variación de entropía, la
      variación de energía interna y el trabajo realizado por el gas.

      **Datos:** jCºP = 28,824 J K⁻¹ mol⁻¹; 1atm = 1,01325 bar

      *La hoja imprime «jCºP»: la j sobra. El dato es la capacidad calorífica
      molar a presión constante, CºP.*
    pide: El calor absorbido, la variación de entropía, la de energía interna y el trabajo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas se calienta a presión constante. ¿Qué es el calor que
          absorbe?
        opciones:
          - texto: >-
              La variación de entalpía, $q_P = \Delta H = nC_P\Delta T$
            correcta: true
            mensaje: |
              Eso es. A presión constante el calor que entra es exactamente
              $\Delta H$, y por eso el dato es la $C_P$. Parte de ese calor se
              queda en el gas y parte sale como trabajo, porque el gas se
              expande para mantener la presión.
          - texto: >-
              La variación de energía interna, porque todo el calor se queda
              en el gas
            mensaje: |
              Solo sería así a volumen constante. Aquí el volumen pasa de 1 a
              1,34 m³: el gas empuja la atmósfera y gasta en eso una parte del
              calor que recibe.
          - texto: >-
              Cero, porque el proceso es reversible
            mensaje: |
              Reversible no quiere decir sin calor: quiere decir que el
              proceso pasa por estados de equilibrio. Aquí el gas sube de
              298 a 400 K, y eso solo se consigue metiéndole calor.
          - texto: >-
              $nC_V\Delta T$, porque el gas es ideal
            mensaje: |
              $nC_V\Delta T$ es la energía interna, y coincide con el calor
              solo si el volumen no cambia. Que el gas sea ideal no cambia qué
              capacidad calorífica toca: a presión constante, la $C_P$.

      - tipo: calcular
        titulo: Los moles de hidrógeno
        pregunta: |
          ¿Cuántos moles hay en el metro cúbico de hidrógeno a 298 K y 1 bar?
        respuesta:
          tipo: numero
          valor: '40.36'
          tolerancia: 0.08
          formato: los moles, con dos decimales
        distractores:
          - valor: '40.92'
            mensaje: |
              Has tomado 1 bar como si fuera 1 atm. Con $R = 0{,}082$
              atm·L/(mol·K) la presión va en atmósferas: 1 bar son
              $1/1{,}01325 = 0{,}987$ atm, y para eso da el enunciado la
              equivalencia.
          - valor: '0.04039'
            mensaje: |
              Un factor mil: has metido el volumen en metros cúbicos con una
              $R$ en atm·L/(mol·K). Un metro cúbico son 1000 litros.
          - valor: '44.64'
            mensaje: |
              Has dividido entre 22,4 L/mol, que es el volumen molar a 0 °C y
              1 atm. Aquí el gas está a 298 K y 1 bar, y cada mol ocupa unos
              24,8 L: hay que usar $PV = nRT$.
        pista: |
          $n = PV/RT$. En el SI: $P = 10^{5}$ Pa, $V = 1$ m³ y $R = 8{,}314$.
          O con la presión en atmósferas y el volumen en litros, y
          $R = 0{,}082$.
        desarrollo: |
          $$
          n = \frac{PV}{RT} = \frac{10^{5}\cdot 1}{8{,}314\cdot 298} = 40{,}36\ \text{mol}
          $$

          Por el otro camino, 1 bar son 0,9869 atm:

          $$
          n = \frac{0{,}9869\cdot 1000}{0{,}082\cdot 298} = 40{,}39\ \text{mol}
          $$

          La diferencia es la de usar 0,082 o 8,314, y cabe en la tolerancia.

      - tipo: calcular
        titulo: El calor absorbido
        pregunta: |
          ¿Cuánto calor absorbe el gas, en kJ?
        respuesta:
          tipo: numero
          valor: '118.67'
          tolerancia: 0.25
          formato: el calor en kJ, con una cifra decimal
        distractores:
          - valor: '84.44'
            mensaje: |
              Has usado $C_V$ en vez de $C_P$. Eso da la variación de energía
              interna, que es solo la parte del calor que se queda en el gas.
              A presión constante el calor es $nC_P\Delta T$.
          - valor: '465.4'
            mensaje: |
              Has multiplicado por la temperatura final, 400 K, en vez de por
              el salto. El calor depende de cuánto sube la temperatura:
              $\Delta T = 400 - 298 = 102$ K.
          - valor: '131.25'
            mensaje: |
              Te sale con 44,64 moles, que es dividir el metro cúbico entre
              22,4 L/mol. Ese volumen molar es el de 0 °C y 1 atm; a 298 K y
              1 bar hay 40,36 moles.
        pista: |
          $q_P = \Delta H = nC_P\Delta T$, con los 40,36 moles y
          $\Delta T = 102$ K.
        desarrollo: |
          $$
          q_P = \Delta H = n\,C_P\,\Delta T = 40{,}36\cdot 28{,}824\cdot 102 = 118\,660\ \text{J} = 118{,}7\ \text{kJ}
          $$

          La colección da 118 515,19 J, que redondea a 118,5 kJ. La
          diferencia, un 0,13 %, está en los moles: su cifra sale con 40,31
          en vez de 40,36. Cabe en la tolerancia.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S$ del gas, en J/K?
        respuesta:
          tipo: numero
          valor: '342.5'
          tolerancia: 1
          formato: la entropía en J/K, con una cifra decimal
        distractores:
          - valor: '296.7'
            mensaje: |
              Has dividido el calor entre la temperatura final, 400 K. La
              temperatura cambia durante todo el calentamiento, así que no hay
              una sola $T$ entre la que dividir: hay que integrar, y sale un
              logaritmo.
          - valor: '398.2'
            mensaje: |
              Has dividido el calor entre la temperatura inicial, 298 K. La
              temperatura no es constante: la entropía de un calentamiento es
              $nC_P\ln(T_2/T_1)$.
          - valor: '243.7'
            mensaje: |
              Has usado $C_V$. A presión constante el calor reversible que
              entra es $nC_P\,\mathrm{d}T$, así que el logaritmo va
              multiplicado por $C_P$.
        pista: |
          $\Delta S = nC_P\ln(T_2/T_1)$, porque la temperatura cambia durante
          el proceso.
        desarrollo: |
          $$
          \Delta S = n\,C_P\ln\frac{T_2}{T_1} = 40{,}36\cdot 28{,}824\cdot\ln\frac{400}{298} = 342{,}5\ \text{J/K}
          $$

          La colección da 342 J/K.

      - tipo: calcular
        titulo: La variación de energía interna
        pregunta: |
          ¿Cuánto vale $\Delta E$, en kJ?
        respuesta:
          tipo: numero
          valor: '84.44'
          tolerancia: 0.2
          formato: la energía interna en kJ, con dos decimales
        distractores:
          - valor: '118.67'
            mensaje: |
              Ese es el calor, $nC_P\Delta T$. La energía interna de un gas
              ideal va con $C_V$, porque solo cuenta lo que se queda dentro
              del gas, no lo que sale como trabajo.
          - valor: '34.23'
            mensaje: |
              Eso es $nR\Delta T$, el trabajo de expansión. Es la diferencia
              entre el calor y la energía interna, no la energía interna.
          - valor: '152.9'
            mensaje: |
              Has sumado el trabajo con el signo cambiado:
              $118{,}67 + 34{,}23$. Con el convenio del curso,
              $\Delta E = q + W$ y el trabajo del gas que se expande es
              negativo, así que resta.
        pista: |
          $\Delta E = nC_V\Delta T$, con $C_V = C_P - R$.
        desarrollo: |
          $$
          C_V = C_P - R = 28{,}824 - 8{,}314 = 20{,}51\ \text{J/(mol·K)}
          $$

          $$
          \Delta E = n\,C_V\,\Delta T = 40{,}36\cdot 20{,}51\cdot 102 = 84\,433\ \text{J}
          $$

          Unos 84,4 kJ. La colección da 84,35 kJ.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto vale el trabajo $W$, en kJ, con el convenio del curso
          ($\Delta E = q + W$)?
        respuesta:
          tipo: numero
          valor: '-34.23'
          tolerancia: 0.15
          formato: el trabajo en kJ, con dos decimales y su signo
        distractores:
          - valor: '34.23'
            mensaje: |
              El módulo está bien y el signo no. El gas se expande y hace el
              trabajo sobre el exterior: 34,23 kJ «realizados por el gas» se
              escriben $W = -34{,}23$ kJ con el convenio del curso, que cuenta
              positivo lo que entra al sistema.
          - valor: '-134.2'
            mensaje: |
              Has multiplicado $nR$ por la temperatura final, o la presión por
              el volumen final. El trabajo es $-P\Delta V$: cuenta lo que
              crece el volumen, de 1 a 1,34 m³, no el volumen entero.
          - valor: '-118.67'
            mensaje: |
              Has supuesto que todo el calor sale como trabajo, que es lo que
              pasa en una isoterma. Aquí la temperatura sube, y la mayor parte
              del calor se queda dentro como energía interna.
        pista: |
          $W = -P\Delta V = -nR\Delta T$.
        desarrollo: |
          $$
          W = -P\,\Delta V = -n\,R\,\Delta T = -40{,}36\cdot 8{,}314\cdot 102 = -34\,227\ \text{J}
          $$

          Y cuadra con el primer principio:

          $$
          \Delta E = q + W = 118{,}66 - 34{,}23 = 84{,}43\ \text{kJ}
          $$

          La colección da −34,15 kJ, que es su energía interna menos su
          calor redondeado: 84,35 − 118,5.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A presión constante el calor absorbido es la entalpía:
              $q_P = \Delta H = nC_P\Delta T = 118{,}7$ kJ, con 40,36 moles.
          - texto: >-
              La temperatura cambia durante el proceso, así que la entropía
              lleva un logaritmo: $\Delta S = nC_P\ln(T_2/T_1) = 342{,}5$ J/K.
          - texto: >-
              La energía interna de un gas ideal solo depende de la
              temperatura: $\Delta E = nC_V\Delta T = 84{,}4$ kJ, con
              $C_V = C_P - R$.
          - texto: >-
              El resto del calor sale como trabajo de expansión:
              $W = -nR\Delta T = -34{,}2$ kJ, negativo porque lo hace el gas.
          - texto: >-
              Como el proceso es reversible, todo el calor absorbido se queda
              en el gas como energía interna.
            trampa: true
            mensaje: |
              Reversible no quiere decir que no haya trabajo. A presión
              constante el gas se expande de 1 a 1,34 m³ y empuja la
              atmósfera: de los 118,7 kJ que entran, 34,2 salen como trabajo,
              casi un 29 %. Solo a volumen constante se quedaría todo dentro.
        veredicto: |
          Cuatro magnitudes y una sola cuenta de fondo: el calor se reparte
          entre lo que se queda dentro, $nC_V\Delta T$, y lo que sale como
          trabajo, $nR\Delta T$.

    resolucion: |
      **Los moles, primero.** Todo lo demás va por mol:

      $$
      n = \frac{PV}{RT} = \frac{10^{5}\cdot 1}{8{,}314\cdot 298} = 40{,}36\ \text{mol}
      $$

      Si trabajas con $R = 0{,}082$ atm·L/(mol·K), la presión va en
      atmósferas —1 bar son 0,9869 atm, y para eso da el enunciado la
      equivalencia— y el volumen en litros: sale 40,39 mol, lo mismo salvo
      redondeo.

      **El calor**, a presión constante, es la entalpía:

      $$
      q_P = \Delta H = n\,C_P\,\Delta T = 40{,}36\cdot 28{,}824\cdot 102 = 118\,660\ \text{J}
      $$

      **La entropía**, con logaritmo porque la temperatura se mueve:

      $$
      \Delta S = n\,C_P\ln\frac{T_2}{T_1} = 40{,}36\cdot 28{,}824\cdot\ln\frac{400}{298} = 342{,}5\ \text{J/K}
      $$

      **La energía interna y el trabajo**, que se reparten el calor:

      $$
      \Delta E = n\,(C_P - R)\,\Delta T = 40{,}36\cdot 20{,}51\cdot 102 = 84\,433\ \text{J}
      $$

      $$
      W = -n\,R\,\Delta T = -40{,}36\cdot 8{,}314\cdot 102 = -34\,227\ \text{J}
      $$

      | magnitud | aquí | la colección |
      |---|---|---|
      | $q_P = \Delta H$ | 118,7 kJ | 118,5 kJ |
      | $\Delta S$ | 342,5 J/K | 342 J/K |
      | $\Delta E$ | 84,4 kJ | 84,35 kJ |
      | $W$ | −34,2 kJ | −34,15 kJ |

      Las de la colección quedan entre un 0,1 y un 0,25 % por debajo. El
      calor, la entropía y la energía interna salen de unos 40,31 moles, que
      no se reproducen con ninguna combinación corriente de $R$ y
      temperatura, y el trabajo es su energía interna menos su calor
      redondeado. No cambia nada del razonamiento, y las tolerancias aceptan
      las dos.

      **Dos avisos de lectura.** El enunciado pide «el trabajo realizado por
      el gas»: son 34,2 kJ que el gas hace sobre la atmósfera, y con el
      convenio del curso, que cuenta positivo lo que entra, eso se escribe
      $W = -34{,}2$ kJ, igual que en la colección. Y el dato impreso
      «jCºP» lleva una j que sobra: es la $C_P$ molar.

      **Lo que enseña.** De cada 100 julios que entran, 71 se quedan
      calentando el gas y 29 salen empujando la atmósfera. Es la razón de que
      $C_P$ sea mayor que $C_V$: a presión constante hay que pagar además el
      trabajo de hacerse sitio.

  - id: colfq7-3-el-ciclo-del-monoxido-de-carbono
    titulo: Tres moles de CO en un ciclo de cuatro etapas, y la presión que no se dice
    fuente: >-
      Problema 3 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final de cada
      etapa; el desarrollo y el balance del ciclo son nuestros.
    nivel: practica
    enunciado: |
      Tres moles de CO (g), inicialmente a una presión de 5 atm y en un
      volumen de 10 L, recorren reversiblemente el siguiente ciclo en 4
      etapas:

      Etapa I: (De 1 → 2): Transformación adiabática hasta una presión de 1 atm

      Etapa II:(De 2 → 3): Transformación isocora hasta una presión de 3 atm

      Etapa III:(De 3 → 4): Transformación isoterma hasta una presión de P atm

      Etapa IV:(De 4 → 1): Transformación isobara

      Suponiendo comportamiento ideal, calcular el calor, el trabajo, la
      variación de energía interna, la variación de entalpía y la variación
      de entropía de cada etapa y del ciclo completo.
    pide: El calor, el trabajo, ΔE, ΔH y ΔS de las cuatro etapas y del ciclo completo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La etapa III acaba en una presión «P» que el enunciado no da.
          ¿Cuánto vale?
        opciones:
          - texto: >-
              5 atm, porque la etapa IV es isóbara y termina en el estado 1,
              que está a 5 atm
            correcta: true
            mensaje: |
              Eso es. El ciclo cierra: la isóbara IV va del estado 4 al 1 sin
              cambiar de presión, así que el estado 4 ya está a la presión del
              1. La isoterma III comprime el gas de 3 a 5 atm.
          - texto: >-
              3 atm, porque en una isoterma la presión no cambia
            mensaje: |
              En una isoterma lo que no cambia es la temperatura. La presión y
              el volumen sí cambian, con $PV$ constante; si la presión tampoco
              cambiara, no habría etapa.
          - texto: >-
              1 atm, la del estado 2, porque el ciclo tiene que cerrar
            mensaje: |
              El ciclo cierra en el estado 1, no en el 2: la etapa IV termina
              donde empezó la I. Y el estado 1 está a 5 atm.
          - texto: >-
              No se puede saber sin otro dato
            mensaje: |
              Está determinada por el propio ciclo. La última etapa es isóbara
              y acaba en el estado 1; eso fija la presión de toda la etapa IV,
              y con ella la del final de la III.

      - tipo: calcular
        titulo: La temperatura inicial
        pregunta: |
          ¿A qué temperatura está el gas en el estado 1?
        respuesta:
          tipo: numero
          valor: '203.3'
          tolerancia: 0.3
          formato: la temperatura en kelvin, con una cifra decimal
        distractores:
          - valor: '2.005'
            mensaje: |
              Has usado $R = 8{,}314$ con la presión en atmósferas y el volumen
              en litros. Esa $R$ es para pascales y metros cúbicos; con atm y L
              va $R = 0{,}082$ atm·L/(mol·K).
          - valor: '609.8'
            mensaje: |
              Te has dejado los moles: $PV = nRT$ lleva $n = 3$ en el
              denominador al despejar $T$.
        pista: |
          $T_1 = P_1V_1/(nR)$, con $R = 0{,}082$ atm·L/(mol·K).
        desarrollo: |
          $$
          T_1 = \frac{P_1V_1}{nR} = \frac{5\cdot 10}{3\cdot 0{,}082} = 203{,}25\ \text{K}
          $$

          Y el CO es diatómico: $C_V = \tfrac{5}{2}R = 20{,}785$ J/(mol·K),
          $C_P = \tfrac{7}{2}R = 29{,}099$ J/(mol·K) y $\gamma = 1{,}4$.

      - tipo: calcular
        titulo: El trabajo de la adiabática
        pregunta: |
          Etapa I. ¿Cuánto vale el trabajo $W_I$, en julios?
        respuesta:
          tipo: numero
          valor: '-4672'
          tolerancia: 6
          formato: el trabajo en julios, con su signo
        distractores:
          - valor: '-6540'
            mensaje: |
              Has usado $C_P$. Eso es la variación de entalpía de la etapa. En
              una adiabática $q = 0$ y el trabajo es la variación de energía
              interna, que va con $C_V$.
          - valor: '4672'
            mensaje: |
              El signo. El gas se expande de 10 a 31,6 L sin recibir calor:
              hace trabajo a costa de su energía interna y se enfría. Con el
              convenio del curso, $W < 0$.
          - valor: '-3610'
            mensaje: |
              Has tratado el CO como monoatómico, con $\gamma = 5/3$ y
              $C_V = \tfrac{3}{2}R$. Es una molécula diatómica: $\gamma = 1{,}4$
              y $C_V = \tfrac{5}{2}R$.
        pista: |
          $q = 0$, así que $W = \Delta E = nC_V(T_2 - T_1)$, con
          $T_2 = T_1\,(P_2/P_1)^{(\gamma - 1)/\gamma}$ y $\gamma = 1{,}4$.
        desarrollo: |
          $$
          T_2 = T_1\left(\frac{P_2}{P_1}\right)^{(\gamma-1)/\gamma} = 203{,}25\cdot 0{,}2^{2/7} = 128{,}33\ \text{K}
          $$

          $$
          W_I = \Delta E_I = nC_V(T_2 - T_1) = 3\cdot 20{,}785\cdot(128{,}33 - 203{,}25) = -4672\ \text{J}
          $$

          Es la cifra de la colección. La entalpía de la etapa va con $C_P$:
          $\Delta H_I = -6540$ J, y la colección da −6541.

      - tipo: calcular
        titulo: El calor de la isócora
        pregunta: |
          Etapa II. ¿Cuánto calor recibe el gas, en julios?
        respuesta:
          tipo: numero
          valor: '16004'
          tolerancia: 15
          formato: el calor en julios, con su signo
        distractores:
          - valor: '22406'
            mensaje: |
              Has usado $C_P$, y a volumen constante va $C_V$: sin trabajo,
              todo el calor se queda como energía interna. Lo que has
              calculado es $\Delta H_{II}$.
          - valor: '0'
            mensaje: |
              Isócora quiere decir que el trabajo es cero, no el calor. La
              presión se triplica a volumen constante, y eso solo pasa si la
              temperatura se triplica, es decir, si entra calor.
          - valor: '-16004'
            mensaje: |
              El signo. La temperatura sube de 128 a 385 K: el calor entra, y
              con el convenio del curso es positivo.
        pista: |
          $W = 0$, así que $q = \Delta E = nC_V(T_3 - T_2)$, con
          $T_3 = T_2\,P_3/P_2$.
        desarrollo: |
          $$
          T_3 = T_2\,\frac{P_3}{P_2} = 128{,}33\cdot 3 = 384{,}99\ \text{K}
          $$

          $$
          q_{II} = \Delta E_{II} = nC_V(T_3 - T_2) = 3\cdot 20{,}785\cdot(384{,}99 - 128{,}33) = 16\,004\ \text{J}
          $$

          La colección da 16 005 J. En esta etapa, además,
          $\Delta S_{II} = nC_V\ln 3 = 68{,}50$ J/K.

      - tipo: calcular
        titulo: El calor de la isoterma
        pregunta: |
          Etapa III. ¿Cuánto vale el calor, en julios?
        respuesta:
          tipo: numero
          valor: '-4905'
          tolerancia: 6
          formato: el calor en julios, con su signo
        distractores:
          - valor: '4905'
            mensaje: |
              El signo. La isoterma **comprime** el gas de 3 a 5 atm: recibe
              trabajo y, para no calentarse, lo suelta como calor. El
              logaritmo es $\ln(3/5)$, negativo.
          - valor: '-2130'
            mensaje: |
              Has usado el logaritmo decimal. La fórmula de la isoterma lleva
              el neperiano: $\ln(3/5) = -0{,}511$, no $\log(3/5) = -0{,}222$.
          - valor: '0'
            mensaje: |
              En una isoterma de un gas ideal lo que vale cero es $\Delta E$,
              no el calor. El trabajo que recibe el gas sale entero como
              calor.
        pista: |
          En una isoterma de gas ideal $\Delta E = 0$ y
          $q = nRT\ln(P_3/P_4)$, con $P_4 = 5$ atm.
        desarrollo: |
          $$
          q_{III} = nRT_3\ln\frac{P_3}{P_4} = 3\cdot 8{,}314\cdot 384{,}99\cdot\ln\frac{3}{5} = -4905\ \text{J}
          $$

          El trabajo es el mismo con el signo cambiado, $W_{III} = +4905$ J,
          y $\Delta S_{III} = nR\ln(3/5) = -12{,}74$ J/K. Las tres coinciden
          con la colección.

      - tipo: calcular
        titulo: El trabajo de la isóbara
        pregunta: |
          Etapa IV. ¿Cuánto vale el trabajo $W_{IV}$, en julios?
        respuesta:
          tipo: numero
          valor: '4533'
          tolerancia: 6
          formato: el trabajo en julios, con su signo
        distractores:
          - valor: '-4533'
            mensaje: |
              El signo. En la isóbara el volumen baja de 18,9 a 10 L: el
              exterior comprime el gas, y ese trabajo entra. Con el convenio
              del curso es positivo.
          - valor: '2718'
            mensaje: |
              Has multiplicado la variación de volumen, de 18,94 a 10 L, por
              3 atm, la presión del estado 3. La isóbara va a la presión del
              estado 1, 5 atm, que es justo la P de la etapa III.
          - valor: '-15865'
            mensaje: |
              Ese es el calor de la etapa, $nC_P(T_1 - T_4)$. El trabajo es
              $-P\Delta V = -nR\Delta T$, mucho menor.
        pista: |
          $W = -P\Delta V = -nR(T_1 - T_4)$, con $T_4 = T_3$.
        desarrollo: |
          El volumen del estado 4, a 5 atm y 384,99 K:

          $$
          V_4 = \frac{nRT_4}{P_4} = \frac{3\cdot 0{,}082\cdot 384{,}99}{5} = 18{,}94\ \text{L}
          $$

          $$
          W_{IV} = -P\,\Delta V = -nR(T_1 - T_4) = -3\cdot 8{,}314\cdot(203{,}25 - 384{,}99) = 4533\ \text{J}
          $$

          Es la cifra de la colección. Con $-P\Delta V$ en atm·L salen
          44,7 atm·L, 4530 J: la diferencia es la de usar 0,082 o 8,314.

      - tipo: calcular
        titulo: La entropía de la isóbara
        pregunta: |
          Etapa IV. ¿Cuánto vale $\Delta S_{IV}$, en J/K?
        respuesta:
          tipo: numero
          valor: '-55.76'
          tolerancia: 0.06
          formato: la entropía en J/K, con dos decimales y su signo
        distractores:
          - valor: '-39.83'
            mensaje: |
              Has usado $C_V$. A presión constante el calor reversible es
              $nC_P\,\mathrm{d}T$, así que el logaritmo va con $C_P$.
          - valor: '55.76'
            mensaje: |
              El signo. El gas se enfría de 385 a 203 K y pierde calor: su
              entropía baja. El logaritmo es $\ln(T_1/T_4)$, negativo.
        pista: |
          $\Delta S = nC_P\ln(T_1/T_4)$.
        desarrollo: |
          $$
          \Delta S_{IV} = nC_P\ln\frac{T_1}{T_4} = 3\cdot 29{,}099\cdot\ln\frac{203{,}25}{384{,}99} = -55{,}76\ \text{J/K}
          $$

          La colección da −55,766 J/K. En esta etapa, además,
          $q_{IV} = \Delta H_{IV} = nC_P(T_1 - T_4) = -15\,865$ J y
          $\Delta E_{IV} = -11\,332$ J.

      - tipo: calcular
        titulo: El calor del ciclo completo
        pregunta: |
          ¿Cuánto vale el calor neto del ciclo, en julios?
        respuesta:
          tipo: numero
          valor: '-4766'
          tolerancia: 12
          formato: el calor en julios, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Lo que vale cero en un ciclo son las funciones de estado:
              $\Delta E$, $\Delta H$ y $\Delta S$. El calor no lo es: hay que
              sumar el de las cuatro etapas.
          - valor: '4766'
            mensaje: |
              El signo. El gas recibe 16 004 J en la isócora y suelta 20 770 J
              entre la isoterma y la isóbara: en neto cede calor, y el signo
              es negativo.
          - valor: '-20771'
            mensaje: |
              Has sumado solo los calores que salen, el de la isoterma y el de
              la isóbara. Falta el que entra en la isócora, +16 004 J.
        pista: |
          Suma los cuatro calores: la adiabática aporta cero.
        desarrollo: |
          $$
          q_{\text{ciclo}} = 0 + 16\,004 - 4905 - 15\,865 = -4766\ \text{J}
          $$

          $$
          W_{\text{ciclo}} = -4672 + 0 + 4905 + 4533 = 4766\ \text{J}
          $$

          Iguales y de signo contrario, porque $\Delta E_{\text{ciclo}} = 0$.

      - tipo: justificar
        pregunta: Ordena el balance del ciclo. Una pieza es falsa.
        piezas:
          - texto: >-
              La isóbara IV acaba en el estado 1, así que va a 5 atm: la P de
              la etapa III vale 5 atm.
          - texto: >-
              En la adiabática $q = 0$ y $\Delta S = 0$, y $W = \Delta E$; en
              la isócora $W = 0$ y todo el calor se queda como energía
              interna.
          - texto: >-
              En la isoterma $\Delta E = \Delta H = 0$, y en la isóbara el calor
              es la entalpía, $q = \Delta H = -15\,865$ J.
          - texto: >-
              El gas vuelve al estado 1, así que $\Delta E$, $\Delta H$ y
              $\Delta S$ del ciclo valen cero.
          - texto: >-
              El calor neto, −4766 J, es igual y de signo contrario al trabajo
              neto, +4766 J.
          - texto: >-
              Como el ciclo vuelve al estado inicial, el calor y el trabajo
              netos también son cero.
            trampa: true
            mensaje: |
              El calor y el trabajo no son funciones de estado: dependen del
              camino, y en un ciclo ninguno de los dos tiene por qué anularse
              por separado. Lo que se anula es su suma,
              $\Delta E = q + W = 0$. Aquí el gas recibe
              4766 J de trabajo neto y los devuelve como calor, porque el
              ciclo se recorre en sentido antihorario en el diagrama $P$–$V$.
        veredicto: |
          En un ciclo las funciones de estado suman cero y el calor y el
          trabajo no; lo único que se sabe de ellos es que son iguales y
          opuestos.

    resolucion: |
      **La presión que no se dice.** La etapa IV es isóbara y termina en el
      estado 1, así que va a 5 atm, y la isoterma III comprime el gas de 3 a
      5 atm: $P = 5$ atm.

      **Los cuatro estados.** Con $R = 0{,}082$ atm·L/(mol·K) para los
      volúmenes y 8,314 J/(mol·K) para las energías, y el CO diatómico
      ($C_V = 20{,}785$, $C_P = 29{,}099$ J/(mol·K), $\gamma = 1{,}4$):

      | estado | P (atm) | V (L) | T (K) |
      |---|---|---|---|
      | 1 | 5 | 10 | 203,25 |
      | 2 | 1 | 31,57 | 128,33 |
      | 3 | 3 | 31,57 | 384,99 |
      | 4 | 5 | 18,94 | 384,99 |

      **Las etapas.** Con $\Delta E = q + W$ y el convenio del curso:

      | etapa | q (J) | W (J) | ΔE (J) | ΔH (J) | ΔS (J/K) |
      |---|---|---|---|---|---|
      | I, adiabática | 0 | −4672 | −4672 | −6540 | 0 |
      | II, isócora | 16 004 | 0 | 16 004 | 22 406 | 68,50 |
      | III, isoterma | −4905 | 4905 | 0 | 0 | −12,74 |
      | IV, isóbara | −15 865 | 4533 | −11 332 | −15 865 | −55,76 |
      | **ciclo** | **−4766** | **4766** | **0** | **0** | **0** |

      Las cifras de las etapas coinciden con la colección a un julio o dos:
      −6541, 16 005, 22 407, −11 332,84 y −15 866,23, que salen con otro
      redondeo de las temperaturas. La colección no da el balance del ciclo,
      que el enunciado sí pide.

      **Dos cosas que hay que ver.** La primera, que las tres funciones de
      estado suman cero en el ciclo: $-6540 + 22\,406 + 0 - 15\,865 = 1$ J
      para la entalpía, cero salvo redondeo, y lo mismo la entropía,
      $0 + 68{,}50 - 12{,}74 - 55{,}76 = 0$. Es la comprobación de que no se
      ha perdido ningún signo.

      La segunda, que el calor y el trabajo **no** suman cero: el gas recibe
      4766 J de trabajo y suelta la misma energía como calor. En el diagrama
      $P$–$V$ el ciclo se recorre en sentido antihorario —se expande a
      presión baja y se comprime a presión alta—, que es el sentido de una
      máquina frigorífica, no el de un motor.

  - id: colfq7-4-dos-caminos-entre-los-mismos-estados
    titulo: Dos caminos entre los mismos estados, y lo que no depende del camino
    fuente: >-
      Problema 4 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, calculada
      con R = 8,31; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Dos moles de gas ideal, inicialmente a una temperatura de 281 K y con un
      volumen de 20 L, pasan a ocupar 80 L y su temperatura aumenta a 333 K
      por cada uno de los procesos siguientes:

      **a)** Proceso 1: se calienta a volumen constante hasta 333 K y luego se
      dilata reversiblemente a temperatura constante hasta 80 L.

      **b)** Proceso 2: se dilata reversible e isotérmicamente hasta 80 L y
      luego se calienta a volumen constante hasta 333 K.

      Calcular el calor, trabajo variación de energía interna, variación de
      entalpía, variación de entropía asociada a cada uno de los procesos.

      **Dato:** Cp = 23,013 J mol⁻¹ K⁻¹
    pide: El calor, el trabajo, ΔE, ΔH y ΔS de cada uno de los dos procesos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos procesos empiezan en el mismo estado y acaban en el mismo
          estado. ¿Qué magnitudes tienen que salir iguales en los dos?
        opciones:
          - texto: >-
              $\Delta E$, $\Delta H$ y $\Delta S$, porque son funciones de
              estado; el calor y el trabajo pueden salir distintos
            correcta: true
            mensaje: |
              Eso es, y ahorra la mitad del problema: esas tres se calculan
              una vez y valen para los dos procesos. El calor y el trabajo
              dependen de por dónde se va, y por eso el enunciado propone dos
              caminos.
          - texto: >-
              Las cinco, porque el estado inicial y el final son los mismos
            mensaje: |
              El calor y el trabajo no son propiedades del estado sino de la
              transformación. Aquí la expansión se hace a 333 K en un proceso
              y a 281 K en el otro, y eso cambia el trabajo.
          - texto: >-
              Solo $\Delta E$, porque es la única que depende solo de la
              temperatura
            mensaje: |
              En un gas ideal la entalpía también depende solo de la
              temperatura, y la entropía es función de estado aunque dependa
              además del volumen. Las tres salen iguales.
          - texto: >-
              Ninguna, porque los caminos son distintos
            mensaje: |
              Las funciones de estado no ven el camino: solo miran de dónde se
              sale y adónde se llega. Por eso se pueden calcular por el camino
              que más convenga.

      - tipo: calcular
        titulo: La variación de energía interna
        pregunta: |
          ¿Cuánto vale $\Delta E$, en julios? Es la misma en los dos
          procesos.
        respuesta:
          tipo: numero
          valor: '1529'
          tolerancia: 3
          formato: un número entero, en julios
        distractores:
          - valor: '2393'
            mensaje: |
              Has usado la $C_P$ del dato. La energía interna va con $C_V$, y
              en un gas ideal $C_V = C_P - R$. Lo que has calculado es
              $\Delta H$.
          - valor: '1297'
            mensaje: |
              Has tomado $C_V = \tfrac{3}{2}R$, la de un gas monoatómico. El
              enunciado no dice qué gas es, pero da su $C_P$, y de ella sale
              $C_V = 23{,}013 - 8{,}314 = 14{,}699$ J/(mol·K).
          - valor: '0'
            mensaje: |
              Solo el tramo isotermo tiene $\Delta E = 0$. En el proceso
              entero la temperatura sube de 281 a 333 K, y la energía interna
              de un gas ideal sube con ella.
        pista: |
          $\Delta E = nC_V\Delta T$, con $C_V = C_P - R$.
        desarrollo: |
          $$
          C_V = C_P - R = 23{,}013 - 8{,}314 = 14{,}699\ \text{J/(mol·K)}
          $$

          $$
          \Delta E = nC_V\Delta T = 2\cdot 14{,}699\cdot(333 - 281) = 1529\ \text{J}
          $$

          Es la cifra de la colección.

      - tipo: calcular
        titulo: La variación de entalpía
        pregunta: |
          ¿Cuánto vale $\Delta H$, en julios?
        respuesta:
          tipo: numero
          valor: '2393'
          tolerancia: 3
          formato: un número entero, en julios
        distractores:
          - valor: '1529'
            mensaje: |
              Esa es la energía interna. La entalpía va con $C_P$, que es
              justo el dato del enunciado.
          - valor: '864.7'
            mensaje: |
              Eso es $nR\Delta T$, la diferencia entre la entalpía y la
              energía interna. $\Delta H = \Delta E + nR\Delta T$, o
              directamente $nC_P\Delta T$.
        pista: |
          $\Delta H = nC_P\Delta T$.
        desarrollo: |
          $$
          \Delta H = nC_P\Delta T = 2\cdot 23{,}013\cdot 52 = 2393\ \text{J}
          $$

          La colección imprime 2393,24 J; la cuenta da 2393,35. Una décima
          de julio, de redondeo.

      - tipo: calcular
        titulo: El trabajo del proceso 1
        pregunta: |
          Proceso 1: calentar a volumen constante y después dilatar a 333 K.
          ¿Cuánto vale el trabajo, en julios?
        respuesta:
          tipo: numero
          valor: '-7676'
          tolerancia: 5
          formato: un número entero, en julios, con su signo
        distractores:
          - valor: '-6477'
            mensaje: |
              Has dilatado a 281 K, que es lo que hace el proceso 2. En el
              proceso 1 el gas se calienta primero, así que la isoterma va a
              333 K.
          - valor: '7676'
            mensaje: |
              El signo. El gas se dilata de 20 a 80 L y hace trabajo sobre el
              exterior: con el convenio del curso, negativo.
          - valor: '-3334'
            mensaje: |
              Has usado el logaritmo decimal. El trabajo de una isoterma
              lleva el neperiano: $\ln 4 = 1{,}386$, no $\log 4 = 0{,}602$.
        pista: |
          El tramo a volumen constante no hace trabajo. La isoterma a 333 K
          hace $W = -nRT\ln(V_2/V_1)$.
        desarrollo: |
          $$
          W_1 = -nRT\ln\frac{V_2}{V_1} = -2\cdot 8{,}314\cdot 333\cdot\ln 4 = -7676\ \text{J}
          $$

          La colección da −7672 J: sale con $R = 8{,}31$, y cabe en la
          tolerancia.

      - tipo: calcular
        titulo: El calor del proceso 1
        pregunta: |
          ¿Y el calor del proceso 1, en julios?
        respuesta:
          tipo: numero
          valor: '9205'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '1529'
            mensaje: |
              Esa es la energía interna. Además de lo que se queda dentro, el
              gas tiene que recibir el calor que luego entrega como trabajo en
              la isoterma.
          - valor: '-6147'
            mensaje: |
              Has sumado el trabajo en vez de restarlo: $1529 + (-7676)$. Del
              primer principio, $q = \Delta E - W = 1529 - (-7676)$.
          - valor: '7676'
            mensaje: |
              Ese es solo el calor de la isoterma. Falta el del
              calentamiento a volumen constante, que es la energía interna,
              1529 J.
        pista: |
          $q = \Delta E - W$.
        desarrollo: |
          $$
          q_1 = \Delta E - W_1 = 1529 - (-7676) = 9205\ \text{J}
          $$

          La colección da 9201 J.

      - tipo: calcular
        titulo: El trabajo del proceso 2
        pregunta: |
          Proceso 2: dilatar a 281 K y después calentar a volumen constante.
          ¿Cuánto vale el trabajo, en julios?
        respuesta:
          tipo: numero
          valor: '-6477'
          tolerancia: 5
          formato: un número entero, en julios, con su signo
        distractores:
          - valor: '-7676'
            mensaje: |
              Ese es el trabajo del proceso 1, con la isoterma a 333 K. En el
              proceso 2 el gas se dilata antes de calentarse, a 281 K.
          - valor: '6477'
            mensaje: |
              El signo. El gas se dilata y hace el trabajo: negativo con el
              convenio del curso.
          - valor: '-2813'
            mensaje: |
              Has usado el logaritmo decimal. Es el neperiano:
              $\ln 4 = 1{,}386$.
        pista: |
          Ahora la isoterma va a 281 K: $W = -nRT_1\ln(V_2/V_1)$.
        desarrollo: |
          $$
          W_2 = -nRT_1\ln\frac{V_2}{V_1} = -2\cdot 8{,}314\cdot 281\cdot\ln 4 = -6477\ \text{J}
          $$

          La colección da −6474 J, con $R = 8{,}31$.

      - tipo: calcular
        titulo: El calor del proceso 2
        pregunta: |
          ¿Y el calor del proceso 2, en julios?
        respuesta:
          tipo: numero
          valor: '8006'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '9205'
            mensaje: |
              Ese es el calor del proceso 1. El proceso 2 hace menos trabajo,
              porque se dilata en frío, y necesita menos calor.
          - valor: '-4948'
            mensaje: |
              Has sumado el trabajo en vez de restarlo: $1529 + (-6477)$. Es
              $q = \Delta E - W$.
        pista: |
          $q = \Delta E - W$, con la misma $\Delta E$ de antes.
        desarrollo: |
          $$
          q_2 = \Delta E - W_2 = 1529 - (-6477) = 8006\ \text{J}
          $$

          La colección da 8003 J.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S$, en J/K? Es la misma en los dos procesos.
        respuesta:
          tipo: numero
          valor: '28.04'
          tolerancia: 0.05
          formato: la entropía en J/K, con dos decimales
        distractores:
          - valor: '23.05'
            mensaje: |
              Solo has contado la expansión, $nR\ln 4$. Falta el
              calentamiento de 281 a 333 K, que aporta
              $nC_V\ln(333/281) = 4{,}99$ J/K.
          - valor: '30.87'
            mensaje: |
              Has calentado con $C_P$. El calentamiento de los dos procesos es
              a volumen constante, así que su entropía va con $C_V$.
          - valor: '4.99'
            mensaje: |
              Solo has contado el calentamiento. La expansión de 20 a 80 L
              aporta además $nR\ln 4 = 23{,}05$ J/K, la mayor parte.
        pista: |
          Por cualquiera de los dos caminos:
          $\Delta S = nC_V\ln(T_2/T_1) + nR\ln(V_2/V_1)$.
        desarrollo: |
          $$
          \Delta S = 2\cdot 14{,}699\cdot\ln\frac{333}{281} + 2\cdot 8{,}314\cdot\ln 4 = 4{,}991 + 23{,}051 = 28{,}04\ \text{J/K}
          $$

          Es la cifra de la colección, 28,03 J/K salvo redondeo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\Delta E$, $\Delta H$ y $\Delta S$ son funciones de estado:
              salen iguales por los dos caminos, 1529 J, 2393 J y 28,04 J/K.
          - texto: >-
              En los dos procesos el tramo a volumen constante no hace
              trabajo: todo el trabajo es el de la expansión isoterma.
          - texto: >-
              El proceso 1 se dilata a 333 K y el 2 a 281 K, así que el 1 hace
              más trabajo: 7676 J frente a 6477 J.
          - texto: >-
              Con la misma $\Delta E$, el calor también es distinto:
              $q = \Delta E - W$ da 9205 J en el proceso 1 y 8006 J en el 2.
          - texto: >-
              Como los dos procesos son reversibles, el calor y el trabajo
              tienen que salir iguales en los dos.
            trampa: true
            mensaje: |
              Reversible no hace que el calor y el trabajo dejen de depender
              del camino. Los dos procesos son reversibles y aun así uno se
              dilata en caliente y el otro en frío: a más temperatura, más
              presión durante la expansión y más trabajo. Por eso sale
              1199 J más de trabajo, y de calor, en el proceso 1.
        veredicto: |
          Tres magnitudes se calculan una vez y valen para los dos caminos; las
          otras dos hay que calcularlas camino a camino.

    resolucion: |
      **Lo que no depende del camino, primero.** Con
      $C_V = C_P - R = 14{,}699$ J/(mol·K):

      $$
      \Delta E = nC_V\Delta T = 2\cdot 14{,}699\cdot 52 = 1529\ \text{J}
      $$

      $$
      \Delta H = nC_P\Delta T = 2\cdot 23{,}013\cdot 52 = 2393\ \text{J}
      $$

      $$
      \Delta S = 2\cdot 14{,}699\cdot\ln\frac{333}{281} + 2\cdot 8{,}314\cdot\ln 4 = 28{,}04\ \text{J/K}
      $$

      **Lo que sí depende.** En los dos procesos solo trabaja la isoterma;
      lo que cambia es a qué temperatura se hace:

      $$
      W_1 = -2\cdot 8{,}314\cdot 333\cdot\ln 4 = -7676\ \text{J}
      $$

      $$
      W_2 = -2\cdot 8{,}314\cdot 281\cdot\ln 4 = -6477\ \text{J}
      $$

      y el calor sale del primer principio, $q = \Delta E - W$:

      | | proceso 1 | proceso 2 | la colección |
      |---|---|---|---|
      | $q$ (J) | 9205 | 8006 | 9201 · 8003 |
      | $W$ (J) | −7676 | −6477 | −7672 · −6474 |
      | $\Delta E$ (J) | 1529 | 1529 | 1529 |
      | $\Delta H$ (J) | 2393 | 2393 | 2393,24 |
      | $\Delta S$ (J/K) | 28,04 | 28,04 | 28,03 |

      Las diferencias con la colección, de tres o cuatro julios, son de usar
      $R = 8{,}31$ en vez de 8,314: con 8,31, y la energía interna
      redondeada a 1529 J, salen sus −7672, 9201, −6474 y 8003.

      **Lo que enseña.** Dilatarse en caliente cuesta más trabajo que
      dilatarse en frío —a más temperatura, más presión empujando durante
      toda la expansión—, y como la energía interna es la misma, el calor
      tiene que pagar la diferencia. Las tres funciones de estado, en
      cambio, se podían calcular por el camino que se quisiera, incluso por
      uno que el enunciado no propone.

  - id: colfq7-5-el-agua-de-20-a-250-grados
    titulo: Un mol de agua de 20 a 250 °C, tres tramos y la energía interna que no es la entalpía
    fuente: >-
      Problema 5 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de entalpía, entropía y energía interna del
      proceso de convertir 1 mol de agua líquida, a 20 ºC y 1 atm, en vapor de
      agua a 250 ºC y 1 atm, suponiendo que la capacidad calorífica molar del
      agua líquida es constante e igual a 75,312 J K⁻¹ mol⁻¹, la capacidad
      calorífica molar del vapor de agua es constante e igual 35,94 J K⁻¹
      mol⁻¹y que el vapor se comporta como ideal. La Entalpía estándar de
      vaporización del agua a 100 ºC es 40,6 kJ mol⁻¹.
    pide: La variación de entalpía, de entropía y de energía interna del mol de agua.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En cuántos tramos hay que partir el proceso?
        opciones:
          - texto: >-
              Tres: calentar el líquido de 20 a 100 °C, vaporizarlo a 100 °C y
              calentar el vapor de 100 a 250 °C
            correcta: true
            mensaje: |
              Eso es. Cada tramo tiene su fórmula: los que calientan van con
              su propia capacidad calorífica, que no es la misma en el líquido
              y en el vapor, y el cambio de fase va con la entalpía de
              vaporización, a temperatura constante.
          - texto: >-
              Dos: calentar de 20 a 250 °C y vaporizar
            mensaje: |
              El agua no se calienta entera de 20 a 250 °C en un mismo estado:
              hasta 100 °C es líquida y desde ahí es vapor, con una capacidad
              calorífica que es menos de la mitad.
          - texto: >-
              Uno, porque la entalpía de vaporización ya lo incluye todo
            mensaje: |
              La entalpía de vaporización es solo el cambio de fase a 100 °C.
              Llevar el líquido hasta ahí y el vapor desde ahí son otros dos
              tramos.
          - texto: >-
              Cuatro, porque además hay que comprimir el vapor
            mensaje: |
              La presión es 1 atm al principio y al final, y en todo el
              proceso. No hay ninguna compresión.

      - tipo: calcular
        titulo: La variación de entalpía
        pregunta: |
          ¿Cuánto vale $\Delta H$, en kJ?
        respuesta:
          tipo: numero
          valor: '52.02'
          tolerancia: 0.05
          formato: la entalpía en kJ, con dos decimales
        distractores:
          - valor: '11.42'
            mensaje: |
              Te has dejado la vaporización. Son 40,6 kJ de los 52: la mayor
              parte del calor no calienta, cambia de fase.
          - valor: '57.92'
            mensaje: |
              Has calentado de 20 a 250 °C con la capacidad calorífica del
              líquido. Por encima de 100 °C el agua es vapor, y su $C_P$ es
              35,94, no 75,312.
          - valor: '46.62'
            mensaje: |
              Falta el último tramo: el vapor todavía tiene que subir de 100 a
              250 °C, y eso son otros 5,39 kJ.
        pista: |
          Suma los tres tramos: $C_{P,l}\,\Delta T_1 + \Delta H_{\text{vap}} + C_{P,g}\,\Delta T_3$,
          todo por mol.
        desarrollo: |
          $$
          \Delta H_1 = 75{,}312\cdot(100 - 20) = 6025\ \text{J}
          $$

          $$
          \Delta H_3 = 35{,}94\cdot(250 - 100) = 5391\ \text{J}
          $$

          $$
          \Delta H = 6025 + 40\,600 + 5391 = 52\,016\ \text{J}
          $$

          La colección da 52 015 J/mol, que redondea a 52 kJ.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S$, en J/K?
        respuesta:
          tipo: numero
          valor: '139.15'
          tolerancia: 0.1
          formato: la entropía en J/K, con dos decimales
        distractores:
          - valor: '30.33'
            mensaje: |
              Te has dejado la vaporización, que es casi toda la entropía del
              proceso: $40\,600/373 = 108{,}85$ J/K.
          - valor: '436.3'
            mensaje: |
              Has dividido la entalpía de vaporización entre 100, la
              temperatura en grados centígrados. Va en kelvin: 373 K.
          - valor: '263.0'
            mensaje: |
              Has puesto las temperaturas en grados centígrados dentro de los
              logaritmos, $\ln(100/20)$ y $\ln(250/100)$. El cociente de dos
              temperaturas solo tiene sentido en kelvin: $\ln(373/293)$.
        pista: |
          Los tramos que calientan llevan $C_P\ln(T_2/T_1)$, con las
          temperaturas en kelvin; el cambio de fase, $\Delta H_{\text{vap}}/T$.
        desarrollo: |
          $$
          \Delta S_1 = 75{,}312\cdot\ln\frac{373}{293} = 18{,}18\ \text{J/K}
          $$

          $$
          \Delta S_2 = \frac{40\,600}{373} = 108{,}85\ \text{J/K}
          $$

          $$
          \Delta S_3 = 35{,}94\cdot\ln\frac{523}{373} = 12{,}15\ \text{J/K}
          $$

          $$
          \Delta S = 18{,}18 + 108{,}85 + 12{,}15 = 139{,}18\ \text{J/K}
          $$

          La colección da 139,17 J/K, con las temperaturas como $t + 273$.
          Con 273,15 sale 139,12, y cabe en la tolerancia.

      - tipo: calcular
        titulo: La variación de energía interna
        pregunta: |
          ¿Cuánto vale $\Delta E$, en kJ?
        respuesta:
          tipo: numero
          valor: '47.67'
          tolerancia: 0.05
          formato: la energía interna en kJ, con dos decimales
        distractores:
          - valor: '52.02'
            mensaje: |
              Esa es la entalpía. La presión no cambia, pero el volumen sí: de
              18 mL de líquido a 43 L de vapor. Ese trabajo de hacerse sitio,
              $P\Delta V$, es la diferencia entre $\Delta H$ y $\Delta E$.
          - valor: '49.58'
            mensaje: |
              Has calculado $P\Delta V$ con la temperatura inicial, 293 K. El
              volumen que cuenta es el del vapor al final, a 523 K:
              $P\Delta V \approx RT_{\text{final}}$.
          - valor: '56.36'
            mensaje: |
              Has sumado $RT$ en vez de restarlo. $\Delta E = \Delta H - P\Delta V$:
              el trabajo de expansión sale del sistema, así que la energía
              interna crece menos que la entalpía.
        pista: |
          $\Delta E = \Delta H - \Delta(PV)$. El volumen del líquido es
          despreciable, y el del vapor ideal es $RT/P$ a 523 K.
        desarrollo: |
          $$
          \Delta E = \Delta H - \Delta(PV) \approx \Delta H - RT_{\text{final}} = 52\,016 - 8{,}314\cdot 523 = 47\,668\ \text{J}
          $$

          Es la cifra de la colección, 47 668 J/mol.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El proceso se parte en tres tramos: el líquido de 20 a 100 °C, la
              vaporización a 100 °C y el vapor de 100 a 250 °C.
          - texto: >-
              Las entalpías se suman, 6025 + 40 600 + 5391 = 52 016 J, y la
              vaporización es el 78 % del total.
          - texto: >-
              En los tramos que calientan la entropía lleva logaritmo; en la
              vaporización se divide entre 373 K. En total, 139,2 J/K.
          - texto: >-
              La energía interna es la entalpía menos el trabajo de hacerse
              sitio el vapor, $PV = RT$ a 523 K: 47 668 J.
          - texto: >-
              Como la presión es la misma al principio y al final,
              $\Delta E = \Delta H$.
            trampa: true
            mensaje: |
              $\Delta H - \Delta E = \Delta(PV) = P\,\Delta V$, y lo que cuenta
              es que cambie el volumen, no la presión. Un mol de agua pasa de
              18 mL de líquido a unos 43 L de vapor a 250 °C: eso son 4348 J
              de trabajo contra la atmósfera, un 8 % de la entalpía.
        veredicto: |
          Tres tramos para la entalpía y la entropía, y una resta al final para
          pasar a energía interna.

    resolucion: |
      **Tres tramos**, porque el agua cambia de estado a 100 °C y cada estado
      tiene su capacidad calorífica:

      | tramo | $\Delta H$ (J) | $\Delta S$ (J/K) |
      |---|---|---|
      | líquido de 20 a 100 °C | $75{,}312\cdot 80 = 6025$ | $75{,}312\ln\frac{373}{293} = 18{,}18$ |
      | vaporizar a 100 °C | 40 600 | $40\,600/373 = 108{,}85$ |
      | vapor de 100 a 250 °C | $35{,}94\cdot 150 = 5391$ | $35{,}94\ln\frac{523}{373} = 12{,}15$ |
      | **total** | **52 016** | **139,18** |

      **La energía interna.** A presión constante,
      $\Delta E = \Delta H - P\Delta V$. El volumen del líquido,
      18 cm³, no cuenta frente al del vapor, y para el vapor ideal
      $PV = RT$:

      $$
      \Delta E = 52\,016 - 8{,}314\cdot 523 = 47\,668\ \text{J}
      $$

      Las tres coinciden con la colección: 52 015 J/mol, 139,17 J/K y
      47 668 J/mol, calculadas con las temperaturas como $t + 273$.

      **Lo que enseña.** Dos tramos que parecen el mismo —calentar agua—
      llevan capacidades caloríficas que no se parecen: la del vapor es menos
      de la mitad que la del líquido. Y dos magnitudes que parecen la misma
      —entalpía y energía interna— se separan un 8 % porque el vapor ocupa
      unas dos mil cuatrocientas veces más que el líquido y tiene que hacerse
      sitio empujando la atmósfera.

  - id: colfq7-6-el-hielo-que-no-se-funde-entero
    titulo: Medio kilo de hielo en un kilo de agua, y el hielo que no llega a fundirse
    fuente: >-
      Problema 6 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, con una
      errata en c): imprime 0,300769 kJ/K, que es 0,307692 con un cero de
      más detrás de «0,30». El desarrollo es nuestro.
    nivel: practica
    enunciado: |
      En un recipiente de paredes adiabáticas que contiene 1 kg de agua a
      293 K, se introduce un bloque de hielo de 500 g a 273 K. Determinar:

      **a)** La composición y temperatura de la mezcla en equilibrio

      **b)** La variación de entropía de la masa de agua líquida

      **c)** La variación de entropía de la masa de hielo

      **d)** ¿Es reversible la transformación?

      **Datos:** $C_{P\ \text{agua}}$ = 4,2 kJ kg⁻¹ K⁻¹;
      $\lambda_{\text{fusión hielo}}$ = 336 kJ kg⁻¹
    pide: La composición y la temperatura final, la entropía del agua y la del hielo, y si la transformación es reversible.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de buscar la temperatura final: ¿se funde todo el hielo?
        opciones:
          - texto: >-
              No: enfriar el kilo de agua hasta 0 °C da 84 kJ, y fundir el
              medio kilo de hielo pide 168 kJ
            correcta: true
            mensaje: |
              Eso es, y decide todo el problema. El agua se queda sin calor
              que dar cuando llega a 273 K, y con 84 kJ solo se funde la mitad
              del hielo. La mezcla acaba a 273 K, con agua y hielo a la vez.
          - texto: >-
              Sí, porque el agua está más caliente que el hielo
            mensaje: |
              Estar más caliente dice hacia dónde va el calor, no cuánto hay.
              Un kilo de agua que baja 20 grados da 84 kJ, y el hielo necesita
              el doble para fundirse entero.
          - texto: >-
              Sí, y la mezcla acaba a una temperatura entre 273 y 293 K
            mensaje: |
              Si lo supones y haces el balance, la temperatura final sale de
              259,7 K: por debajo de 0 °C con todo el hielo fundido, que es
              imposible. Esa contradicción es la señal de que no se funde
              todo.
          - texto: >-
              No se puede saber sin conocer antes la temperatura final
            mensaje: |
              Se sabe comparando dos calores: el máximo que puede dar el agua
              hasta 0 °C y el que hace falta para fundir todo el hielo. Esa
              comparación es la que te dice cuál es la temperatura final.

      - tipo: calcular
        titulo: El agua líquida en el equilibrio
        pregunta: |
          a) ¿Cuántos kilos de agua líquida hay cuando se alcanza el
          equilibrio?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.005
          formato: la masa en kg, con dos decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Has fundido todo el hielo. Para eso harían falta
              $0{,}5\cdot 336 = 168$ kJ, y el agua solo puede dar 84 kJ antes
              de llegar a 0 °C.
          - valor: '0.25'
            mensaje: |
              Esa es la masa de hielo que se funde, o la que queda sin
              fundir: son la misma, 0,25 kg. El agua líquida es el kilo que
              había más lo fundido.
        pista: |
          El agua puede dar $1\cdot 4{,}2\cdot 20$ kJ hasta llegar a 273 K.
          Divide entre el calor de fusión por kilo.
        desarrollo: |
          $$
          q_{\text{agua}} = m\,c_P\,\Delta T = 1\cdot 4{,}2\cdot(293 - 273) = 84\ \text{kJ}
          $$

          $$
          m_{\text{fundida}} = \frac{84}{336} = 0{,}25\ \text{kg}
          $$

          Quedan 1,25 kg de agua y 0,25 kg de hielo, todo a 273 K. Es la
          respuesta de la colección.

      - tipo: calcular
        titulo: La entropía del agua líquida
        pregunta: |
          b) ¿Cuánto cambia la entropía del kilo de agua que se enfría, en
          kJ/K?
        respuesta:
          tipo: numero
          valor: '-0.2969'
          tolerancia: 0.0005
          formato: la entropía en kJ/K, con cuatro decimales y su signo
        distractores:
          - valor: '-0.2867'
            mensaje: |
              Has dividido el calor entre 293 K, la temperatura inicial. El
              agua se enfría durante todo el proceso, así que no hay una sola
              temperatura entre la que dividir: hay que integrar, y sale un
              logaritmo.
          - valor: '-0.3077'
            mensaje: |
              Has dividido el calor entre 273 K, la temperatura final. La
              temperatura del agua cambia: su entropía es
              $mc_P\ln(T_f/T_i)$.
          - valor: '0.2969'
            mensaje: |
              El signo. El agua cede calor y se enfría: su entropía baja, y
              $\ln(273/293)$ es negativo.
        pista: |
          $\Delta S = mc_P\ln(T_f/T_i)$, de 293 a 273 K.
        desarrollo: |
          $$
          \Delta S_{\text{agua}} = m\,c_P\ln\frac{T_f}{T_i} = 1\cdot 4{,}2\cdot\ln\frac{273}{293} = -0{,}2969\ \text{kJ/K}
          $$

          La colección da −0,29694 kJ/K.

      - tipo: calcular
        titulo: La entropía del hielo
        pregunta: |
          c) ¿Cuánto cambia la entropía de la masa de hielo, en kJ/K?
        respuesta:
          tipo: numero
          valor: '0.3077'
          tolerancia: 0.0005
          formato: la entropía en kJ/K, con cuatro decimales
        distractores:
          - valor: '0.6154'
            mensaje: |
              Has fundido el medio kilo entero. Solo se funden 0,25 kg, y el
              hielo que no se funde no cambia de estado ni de temperatura: su
              entropía no cambia.
          - valor: '0.300769'
            mensaje: |
              Es lo que imprime la colección en c), y es una errata:
              $84/273 = 0{,}307692$, y en la hoja se ha colado un cero de más
              detrás de «0,30». Su propio apartado d) sale con 0,307692, no
              con este número.
          - valor: '0.2867'
            mensaje: |
              Has dividido entre 293 K, la temperatura del agua. El hielo se
              funde a 273 K, y a esa temperatura recibe el calor: es la que va
              en el denominador.
        pista: |
          El hielo que se funde recibe los 84 kJ a temperatura constante,
          273 K: $\Delta S = q/T$.
        desarrollo: |
          $$
          \Delta S_{\text{hielo}} = \frac{m_{\text{fundida}}\,\lambda}{T} = \frac{0{,}25\cdot 336}{273} = 0{,}3077\ \text{kJ/K}
          $$

          La colección imprime 0,300769 kJ/K: es una errata de 0,307692.

      - tipo: calcular
        titulo: La entropía total
        pregunta: |
          d) ¿Cuánto cambia la entropía del conjunto, en kJ/K?
        respuesta:
          tipo: numero
          valor: '0.0107'
          tolerancia: 0.0004
          formato: la entropía en kJ/K, con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Adiabático no quiere decir que la entropía no cambie: quiere
              decir que no entra ni sale calor del recipiente. Dentro, el
              calor pasa del agua caliente al hielo frío, y eso crea entropía.
          - valor: '0.3184'
            mensaje: |
              Te sale con todo el hielo fundido, 0,6154 kJ/K. Solo se funde la
              mitad.
          - valor: '0.00383'
            mensaje: |
              Te sale con el 0,300769 que imprime la colección en c), que es
              una errata. Con el valor bueno, 0,307692, el total es
              0,0107 kJ/K, que es lo que la propia colección da en d).
        pista: |
          Suma las dos: el recipiente es adiabático, así que el entorno no
          cambia.
        desarrollo: |
          $$
          \Delta S_{\text{total}} = -0{,}29694 + 0{,}30769 = 0{,}01075\ \text{kJ/K}
          $$

          Positiva: la transformación es irreversible. La colección da
          0,0107 kJ/K.

      - tipo: justificar
        pregunta: Ordena la respuesta a d). Una pieza es falsa.
        piezas:
          - texto: >-
              El recipiente es adiabático: no entra ni sale calor, así que la
              entropía del entorno no cambia y la del universo es la del
              contenido.
          - texto: >-
              El agua se enfría de 293 a 273 K y pierde 0,2969 kJ/K; el hielo
              que se funde gana 0,3077 kJ/K.
          - texto: >-
              El hielo gana más de lo que pierde el agua porque recibe el mismo
              calor a menos temperatura.
          - texto: >-
              La entropía del universo sube 0,0107 kJ/K: la transformación es
              irreversible, y por eso ocurre sola.
          - texto: >-
              Como el recipiente es adiabático, la entropía total no cambia y
              la transformación es reversible.
            trampa: true
            mensaje: |
              Adiabático e isentrópico no son lo mismo. Las paredes no dejan
              pasar calor, pero dentro el calor va del agua a 293 K al hielo a
              273 K, con una diferencia de temperatura finita, y eso es
              irreversible. Para que fuera reversible el calor tendría que
              pasar entre cuerpos a la misma temperatura.
        veredicto: |
          El mismo calor vale más entropía a menos temperatura: por eso el
          hielo gana más de lo que pierde el agua, y el balance sale positivo.

    resolucion: |
      **a · ¿Se funde todo?** Se comparan dos calores:

      - el que puede dar el agua hasta 0 °C: $1\cdot 4{,}2\cdot 20 = 84$ kJ;
      - el que haría falta para fundir todo el hielo: $0{,}5\cdot 336 = 168$ kJ.

      No llega: solo se funden $84/336 = 0{,}25$ kg. El equilibrio es
      **1,25 kg de agua y 0,25 kg de hielo, a 273 K**, que es la respuesta de
      la colección.

      **b · El agua**, que se enfría, con logaritmo:

      $$
      \Delta S_{\text{agua}} = 1\cdot 4{,}2\cdot\ln\frac{273}{293} = -0{,}2969\ \text{kJ/K}
      $$

      **c · El hielo**, que se funde a temperatura constante:

      $$
      \Delta S_{\text{hielo}} = \frac{84}{273} = 0{,}3077\ \text{kJ/K}
      $$

      **d · El balance.** El recipiente no intercambia calor con el
      exterior, así que la entropía del universo es la de su contenido:

      $$
      \Delta S = -0{,}29694 + 0{,}30769 = 0{,}01075\ \text{kJ/K} > 0
      $$

      La transformación es **irreversible**, y por eso ocurre sola.

      **Una errata de la colección.** En c) imprime «∆S = 0,300769 kJ K⁻¹».
      La cuenta da $84/273 = 0{,}307692$: es el mismo número con un cero de
      más detrás de «0,30». La prueba está en su propio apartado d): el
      0,0107 que da solo sale con 0,307692; con 0,300769 saldría 0,0038.

      **Lo que enseña.** El agua y el hielo intercambian exactamente el mismo
      calor, 84 kJ, y aun así la entropía no se compensa, porque el agua lo
      suelta a una temperatura media más alta que la del hielo que lo recibe.
      El mismo julio aporta más entropía a 273 K que a 283.

  - id: colfq7-7-el-etano-y-si-arde-solo
    titulo: Si el etano arde solo, y por qué eso no basta para que arda
    fuente: >-
      Problema 7 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de energía libre en el proceso de combustión del
      etano en condiciones estándar y decir si la reacción es espontánea.

      **Datos:** ΔGºf (CO2 (g)) = −394,359 kJ mol⁻¹, ΔGºf (H2O (g)) =
      −237,129 kJ mol⁻¹, ΔGºf (C2H6 (g)) = −32,82 kJ mol⁻¹
    pide: La energía libre estándar de la combustión y si el proceso es espontáneo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla no da la energía libre de formación del oxígeno. ¿Falta un
          dato?
        opciones:
          - texto: No, vale cero por ser un elemento en su forma más estable
            correcta: true
            mensaje: |
              Exacto. La energía libre de formación mide lo que cuesta formar
              un compuesto **a partir de sus elementos**; formar oxígeno a
              partir de oxígeno no cuesta nada, por definición. Lo mismo vale
              para $\Delta H^{0}_f$.
          - texto: Sí, y hay que buscarlo en una tabla
            mensaje: |
              No hay nada que buscar: es cero por convenio, y el convenio no
              es arbitrario. Todas las energías libres de formación están
              medidas **respecto de** los elementos, así que estos son el
              origen de la escala.
          - texto: No, porque el oxígeno no aparece en la ecuación ajustada
            mensaje: |
              Sí aparece, y con coeficiente $7/2$: sin oxígeno no hay
              combustión. Lo que pasa es que su contribución al sumatorio es
              cero.
          - texto: Sí, pero se puede estimar a partir de la del agua
            mensaje: |
              Estimar un dato que ya está determinado por convenio es
              inventarse un problema. Vale cero, exactamente.

      - tipo: calcular
        titulo: La energía libre de la combustión
        pregunta: |
          Con la ecuación ajustada
          $\mathrm{C_2H_6} + \tfrac{7}{2}\mathrm{O_2} \rightarrow 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$,
          ¿cuánto vale $\Delta G^{0}$, en kJ por mol de etano?
        respuesta:
          tipo: numero
          valor: '-1467.3'
          tolerancia: 0.2
          formato: un número, con un decimal, en kilojulios por mol
        distractores:
          - valor: '1467.3'
            mensaje: |
              Signo cambiado. El sumatorio es productos **menos** reactivos, y
              los productos están mucho más abajo en energía libre: la
              combustión libera.
          - valor: '-1532.9'
            mensaje: |
              Has **sumado** la energía libre del etano en vez de restarla. El
              reactivo va con signo menos, y como su $\Delta G^{0}_f$ ya es
              negativa, restarla **sube** el resultado en 32,82.
          - valor: '-631.5'
            mensaje: |
              Parece que no has aplicado los coeficientes. Hay 2 moles de CO₂
              y 3 de H₂O por cada mol de etano, y cada energía de formación va
              multiplicada por el suyo.
        pista: |
          $\Delta G^{0} = \sum n \Delta G^{0}_f(\text{productos}) - \sum n \Delta G^{0}_f(\text{reactivos})$,
          y el oxígeno aporta cero.
        desarrollo: |
          $$
          \Delta G^{0} = \left[2(-394{,}359) + 3(-237{,}129)\right] - \left[(-32{,}82) + \tfrac{7}{2}(0)\right]
          $$

          $$
          \Delta G^{0} = -1500{,}105 + 32{,}82 = -1467{,}29\ \mathrm{kJ\,mol^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La ecuación ajustada es C₂H₆ + 7/2 O₂ → 2 CO₂ + 3 H₂O, y el oxígeno aporta cero por ser un elemento en su forma estable.'
          - texto: 'El sumatorio es productos menos reactivos, cada uno multiplicado por su coeficiente.'
          - texto: 'Los productos suman 2(−394,359) + 3(−237,129) = −1500,105 kJ.'
          - texto: 'Restar el reactivo, cuya energía es −32,82, equivale a sumar 32,82, y el resultado es −1467,3 kJ/mol.'
          - texto: 'Al ser ΔG⁰ negativa la reacción es espontánea en condiciones estándar, aunque eso no dice nada de lo deprisa que ocurre.'
          - texto: 'Como ΔG⁰ es muy negativa, la reacción ocurrirá rápidamente en cuanto se mezclen etano y oxígeno.'
            trampa: true
            mensaje: |
              Es la confusión entre termodinámica y cinética, y este ejercicio
              existe en parte para romperla. Una mezcla de etano y aire puede
              estar años sin reaccionar: le falta la energía de activación,
              que es lo que aporta una chispa. La energía libre dice **si**
              puede ocurrir, nunca **cuándo**.
    resolucion: |
      **La ecuación, primero.** Sin ajustar no hay coeficientes, y sin
      coeficientes el sumatorio sale mal:

      $$
      \mathrm{C_2H_6} + \tfrac{7}{2}\,\mathrm{O_2} \;\longrightarrow\; 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}
      $$

      El oxígeno es un elemento en su forma más estable, así que
      $\Delta G^{0}_f = 0$ por definición de la escala. No es un dato que
      falte.

      **El sumatorio.**

      $$
      \Delta G^{0} = \sum n\,\Delta G^{0}_f(\text{prod}) - \sum n\,\Delta G^{0}_f(\text{react})
      $$

      $$
      \Delta G^{0} = \left[2(-394{,}359) + 3(-237{,}129)\right] - (-32{,}82) = -1467{,}29\ \mathrm{kJ\,mol^{-1}}
      $$

      Al ser negativa, **la combustión del etano es espontánea en condiciones
      estándar**.

      **Dos avisos, y los dos importan.**

      El primero es de método: **espontáneo no es rápido**. El etano y el aire
      pueden convivir indefinidamente en un depósito; lo que les falta no es
      energía libre sino energía de activación, y eso lo aporta una chispa. La
      termodinámica dice si un proceso puede ocurrir, la cinética dice cuándo.
      El examen pregunta por lo primero y la vida por lo segundo.

      El segundo es sobre los datos. Con los tres valores del enunciado sale
      $-1467{,}29$, y **la colección publica $-1467{,}37$**: ocho centésimas
      de diferencia, que vienen de redondeos en las energías tabuladas. No es
      un error de nadie y no cambia ninguna conclusión, pero conviene saberlo
      para no repasar la cuenta tres veces buscando un fallo que no está.

      Y una nota sobre el agua: el enunciado etiqueta el dato como
      H₂O **(g)**, aunque $-237{,}129$ kJ/mol es el valor tabulado del agua
      **líquida**. Se reproduce tal cual porque es lo que hay en la colección
      y porque es el valor con el que sale su respuesta; con el del
      vapor, $-228{,}6$, el resultado sería unos 25 kJ menos negativo.

  - id: colfq7-8-la-expansion-isoterma-entera
    titulo: Una expansión isoterma, y las seis magnitudes de una vez
    fuente: >-
      Problema 8 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcular la variación de energía interna, calor, trabajo, variación de
      entalpía, variación de entropía y variación de energía libre para el
      siguiente proceso: un mol de gas ideal monoatómico se expansiona
      reversible e isotérmicamente a 300 K desde un volumen inicial de 10 L
      hasta un volumen final de 20 L.
    pide: Las seis magnitudes del proceso.

    pasos:
      - tipo: reconocer
        pregunta: |
          El proceso es isotermo y el gas es ideal. ¿Qué se puede afirmar
          antes de calcular nada?
        opciones:
          - texto: Que $\Delta E = 0$ y $\Delta H = 0$, porque en un gas ideal solo dependen de la temperatura
            correcta: true
            mensaje: |
              Eso es, y ahorra la mitad del problema. En un gas ideal no hay
              interacciones entre moléculas, así que la energía interna solo
              depende de $T$; y como $H = E + PV = E + nRT$, la entalpía
              también. Si $T$ no cambia, las dos son cero.
          - texto: Que $q = 0$, porque no cambia la temperatura
            mensaje: |
              Eso sería un proceso **adiabático**, que es otra cosa. Aquí sí
              entra calor: el gas hace trabajo al expandirse y necesita
              reponer esa energía para no enfriarse. Precisamente por eso la
              temperatura se mantiene.
          - texto: Que $W = 0$, porque no hay cambio de energía interna
            mensaje: |
              $\Delta E = 0$ no significa que no pase nada: significa que el
              calor y el trabajo se compensan. El gas sí se expande contra el
              exterior, así que hace trabajo.
          - texto: Que $\Delta S = 0$, porque el proceso es reversible
            mensaje: |
              Reversible significa que la entropía del **universo** no cambia,
              no la del sistema. El gas pasa a ocupar el doble de volumen y
              su entropía sube; la del entorno baja lo mismo.

      - tipo: calcular
        titulo: El calor absorbido
        pregunta: |
          ¿Cuánto calor absorbe el gas, en julios? Toma
          $R = 8{,}314$ J K⁻¹ mol⁻¹.
        respuesta:
          tipo: numero
          valor: '1728'
          tolerancia: 3
          formato: un número entero, en julios
        distractores:
          - valor: '751'
            mensaje: |
              Has usado el logaritmo decimal. La fórmula lleva logaritmo
              **neperiano**: $\ln 2 = 0{,}693$, no $\log 2 = 0{,}301$. La
              diferencia es el factor 2,303.
          - valor: '-1728'
            mensaje: |
              El módulo está bien y el signo no. El gas se expande, así que
              **hace** trabajo sobre el exterior, y para no enfriarse tiene
              que **absorber** calor: $q$ es positivo.
          - valor: '2494'
            mensaje: |
              Eso es $nRT$ a secas, sin el logaritmo. Sería el trabajo de una
              expansión de otro tipo, no el de una isoterma reversible.
        pista: |
          Como $\Delta E = 0$, todo el calor se va en trabajo:
          $q = nRT \ln(V_2/V_1)$.
        desarrollo: |
          $$
          q = nRT \ln\frac{V_2}{V_1} = 1 \times 8{,}314 \times 300 \times \ln 2 = 1728\ \mathrm{J}
          $$

          Y el trabajo es el mismo con el signo cambiado, $W = -1728$ J, con
          el convenio de que $W$ es lo que **recibe** el sistema.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S$, en J/K?
        respuesta:
          tipo: numero
          valor: '5.76'
          tolerancia: 0.02
          formato: un número, con dos decimales, en julios por kelvin
        distractores:
          - valor: '-5.76'
            mensaje: |
              Signo cambiado. El gas pasa a ocupar el doble de volumen, así
              que tiene más sitio donde estar y su entropía **sube**.
          - valor: '1728'
            mensaje: |
              Ese es el calor. Falta dividir entre la temperatura, que es lo
              que convierte julios en julios por kelvin.
          - valor: '2.88'
            mensaje: |
              Parece que has dividido entre 600 en vez de entre 300, o que has
              usado la mitad del calor. La temperatura del proceso es 300 K y
              no cambia.
        pista: |
          $\Delta S = q_{\text{rev}} / T$, y el proceso es reversible.
        desarrollo: |
          $$
          \Delta S = \frac{q_{\text{rev}}}{T} = \frac{1728}{300} = 5{,}76\ \mathrm{J\,K^{-1}}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'En un gas ideal E y H solo dependen de la temperatura, así que en un proceso isotermo ΔE = 0 y ΔH = 0.'
          - texto: 'Por la primera ley, ΔE = q + W = 0, así que el calor y el trabajo son iguales y de signo contrario.'
          - texto: 'El gas se expande, luego hace trabajo sobre el exterior: W = −1728 J y q = +1728 J.'
          - texto: 'Al ser reversible, ΔS = q/T = 1728/300 = 5,76 J/K.'
          - texto: 'Y ΔG = ΔH − TΔS = 0 − 300 × 5,76 = −1728 J, negativo, como corresponde a un proceso que ocurre solo.'
          - texto: 'Como ΔE = 0, el gas ni absorbe ni cede energía durante el proceso.'
            trampa: true
            mensaje: |
              Confunde el balance con los flujos. La energía interna no
              cambia, pero eso es porque entran 1728 J de calor y salen 1728 J
              de trabajo, no porque no pase nada. Si no entrara calor el gas
              se enfriaría, y el proceso dejaría de ser isotermo.
    resolucion: |
      **Lo que sale gratis.** El gas es ideal y el proceso isotermo, así que

      $$
      \Delta E = 0 \qquad \Delta H = 0
      $$

      En un gas ideal no hay interacciones intermoleculares, de modo que la
      energía interna solo depende de la temperatura. Y $H = E + PV = E + nRT$,
      así que la entalpía también.

      **Calor y trabajo.** Por la primera ley, $\Delta E = q + W = 0$, así que
      son iguales y opuestos. Para una expansión isoterma reversible:

      $$
      q = nRT \ln\frac{V_2}{V_1} = 1 \times 8{,}314 \times 300 \times \ln 2 = 1728\ \mathrm{J}
      $$

      $$
      W = -1728\ \mathrm{J}
      $$

      El signo de $W$ depende del convenio, y aquí se usa el de la asignatura:
      positivo lo que **entra** al sistema. El gas se expande, así que entrega
      trabajo y $W$ es negativo.

      **Entropía y energía libre.**

      $$
      \Delta S = \frac{q_{\text{rev}}}{T} = \frac{1728}{300} = 5{,}76\ \mathrm{J\,K^{-1}}
      $$

      $$
      \Delta G = \Delta H - T\Delta S = 0 - 300 \times 5{,}76 = -1728\ \mathrm{J}
      $$

      **La coincidencia que no lo es.** $\Delta G$ sale exactamente igual que
      $W$, y no es casualidad: con $\Delta H = 0$, la energía libre es
      $-T\Delta S = -q$, y el calor es a su vez el trabajo cambiado de signo.
      En un proceso isotermo, $\Delta G$ mide el trabajo máximo distinto del
      de expansión que se podría extraer — y aquí no hay ninguno más, así que
      coinciden.

      El signo negativo dice lo que se espera: un gas encerrado en 10 L al que
      se le da acceso a 20 L se expande solo.

  - id: colfq7-9-cuatro-reacciones-y-sus-temperaturas
    titulo: Cuatro reacciones, cuatro casos de signos y dos temperaturas frontera
    fuente: >-
      Problema 9 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. La hoja manda consultar las tablas y no trae
      datos: los de aquí son los de las tablas del NBS de 1982, con los que
      sale exactamente la respuesta de la colección.
    nivel: practica
    enunciado: |
      En qué condiciones de temperatura se podrá producir espontáneamente la
      reacción:

      **a)** $\mathrm{2\,NH_4NO_3\,(s) \rightarrow 2\,N_2\,(g) + 4\,H_2O\,(l) + O_2\,(g)}$

      **b)** $\mathrm{I_2\,(g) \rightarrow 2\,I\,(g)}$

      **c)** $\mathrm{2\,C\,(grafito) + 2\,H_2\,(g) \rightarrow C_2H_4\,(g)}$

      **d)** $\mathrm{CaCO_3\,(s)\,(calcita) \rightarrow CaO\,(s) + CO_2\,(g)}$

      Consultar los datos necesarios en las tablas termodinámicas.

      *La hoja no trae los datos. Aquí se usan los de las tablas del NBS
      (1982), y con ellos sale exactamente la respuesta de la colección en
      los cuatro apartados:*

      | sustancia | ΔH⁰f (kJ/mol) | S⁰ (J/mol·K) |
      |---|---|---|
      | NH4NO3 (s) | −365,56 | 151,08 |
      | N2 (g) | 0 | 191,61 |
      | H2O (l) | −285,83 | 69,91 |
      | O2 (g) | 0 | 205,14 |
      | I2 (g) | 62,44 | 260,69 |
      | I (g) | 106,84 | 180,79 |
      | C (grafito) | 0 | 5,74 |
      | H2 (g) | 0 | 130,68 |
      | C2H4 (g) | 52,26 | 219,56 |
      | CaCO3 (s), calcita | −1206,9 | 92,9 |
      | CaO (s) | −635,09 | 39,75 |
      | CO2 (g) | −393,51 | 213,74 |
    pide: En qué rango de temperaturas es espontánea cada una de las cuatro reacciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para decir en qué condiciones de temperatura es espontánea una
          reacción, ¿qué hace falta saber de ella?
        opciones:
          - texto: >-
              Los signos de $\Delta H$ y $\Delta S$, y si son iguales, la
              temperatura $T = \Delta H/\Delta S$ donde $\Delta G$ cambia de
              signo
            correcta: true
            mensaje: |
              Eso es. Con signos opuestos la respuesta es «siempre» o «nunca»
              y no hay nada que calcular; con signos iguales hay una frontera,
              y la pregunta es de qué lado de ella hay que estar.
          - texto: >-
              Solo $\Delta H$: si es negativa, la reacción es espontánea
            mensaje: |
              La entalpía es la mitad de la historia. El apartado b) es
              endotérmico y aun así ocurre solo a alta temperatura, porque su
              entropía sube.
          - texto: >-
              Solo $\Delta S$: si es positiva, la reacción es espontánea
            mensaje: |
              La entropía del sistema tampoco basta. Lo que decide es
              $\Delta G = \Delta H - T\Delta S$, y con $\Delta S > 0$ la
              reacción b) no es espontánea a temperatura ambiente.
          - texto: >-
              $\Delta G^{0}$ a 298 K, que decide para cualquier temperatura
            mensaje: |
              $\Delta G^{0}$ a 298 K dice lo que pasa a 298 K. Si $\Delta H$ y
              $\Delta S$ tienen el mismo signo, a otra temperatura el resultado
              se da la vuelta.

      - tipo: calcular
        titulo: La entropía del nitrato de amonio
        pregunta: |
          a) ¿Cuánto vale $\Delta S^{0}$ de la descomposición del nitrato de
          amonio, en J/K?
        respuesta:
          tipo: numero
          valor: '565.8'
          tolerancia: 0.5
          formato: la entropía en J/K, con una cifra decimal
        distractores:
          - valor: '-22.52'
            mensaje: |
              Has puesto $S^{0} = 0$ al N₂ y al O₂, como si fuera una entalpía
              de formación. La entropía tiene valor absoluto, y a 25 °C los
              elementos también llevan la suya: 191,61 y 205,14 J/(mol·K).
          - valor: '315.6'
            mensaje: |
              Te has dejado los coeficientes: 2 de N₂, 4 de agua y 2 de
              nitrato. Cada entropía molar va multiplicada por el suyo.
          - valor: '-565.8'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Y el signo se ve
              antes de calcular: de un sólido salen tres moles de gas.
        pista: |
          Productos menos reactivos, con los coeficientes y con la entropía
          de los elementos, que no es cero.
        desarrollo: |
          $$
          \Delta S^{0} = [2(191{,}61) + 4(69{,}91) + 205{,}14] - 2(151{,}08) = 565{,}84\ \text{J/K}
          $$

          $$
          \Delta H^{0} = 4(-285{,}83) - 2(-365{,}56) = -412{,}2\ \text{kJ}
          $$

          $\Delta H^{0} < 0$ y $\Delta S^{0} > 0$: espontánea a cualquier
          temperatura, como dice la colección.

      - tipo: calcular
        titulo: La frontera del yodo
        pregunta: |
          b) ¿Por encima de qué temperatura es espontánea la disociación del
          yodo, en kelvin?
        respuesta:
          tipo: numero
          valor: '1499'
          tolerancia: 2
          formato: la temperatura en kelvin, un número entero
        distractores:
          - valor: '1.499'
            mensaje: |
              Un factor mil: has dividido kJ entre J/K. Pasa la entalpía a
              julios, 151 240 J, antes de dividir.
          - valor: '-555.7'
            mensaje: |
              Te has dejado el 2 del yodo atómico en las dos sumas. Una
              temperatura negativa es la señal de que algo se ha perdido: con
              el coeficiente, $\Delta H^{0}$ y $\Delta S^{0}$ salen los dos
              positivos.
          - valor: '1226'
            mensaje: |
              Esa es la frontera en grados centígrados. La pregunta pide
              kelvin: $T = \Delta H/\Delta S$ ya sale en kelvin, sin restar
              nada.
        pista: |
          $T = \Delta H^{0}/\Delta S^{0}$, con la entalpía en julios.
        desarrollo: |
          $$
          \Delta H^{0} = 2(106{,}84) - 62{,}44 = 151{,}24\ \text{kJ}
          $$

          $$
          \Delta S^{0} = 2(180{,}79) - 260{,}69 = 100{,}89\ \text{J/K}
          $$

          $$
          T = \frac{\Delta H^{0}}{\Delta S^{0}} = \frac{151\,240}{100{,}89} = 1499\ \text{K}
          $$

          Los dos positivos: espontánea por encima de 1499 K, que es la
          respuesta de la colección.

      - tipo: calcular
        titulo: La entropía de formar eteno
        pregunta: |
          c) ¿Cuánto vale $\Delta S^{0}$ de la formación del eteno desde sus
          elementos, en J/K?
        respuesta:
          tipo: numero
          valor: '-53.28'
          tolerancia: 0.1
          formato: la entropía en J/K, con dos decimales y su signo
        distractores:
          - valor: '219.56'
            mensaje: |
              Has puesto a cero la entropía del carbono y del hidrógeno por
              ser elementos. Eso vale para la entalpía de formación, no para
              la entropía: el H₂ tiene 130,68 J/(mol·K).
          - valor: '83.14'
            mensaje: |
              Te has dejado los coeficientes: son 2 de carbono y 2 de
              hidrógeno por cada eteno.
          - valor: '53.28'
            mensaje: |
              Signo cambiado. De dos moles de gas se pasa a uno: la entropía
              baja.
        pista: |
          $\Delta S^{0} = S^{0}(\mathrm{C_2H_4}) - [2S^{0}(\mathrm{C}) + 2S^{0}(\mathrm{H_2})]$.
        desarrollo: |
          $$
          \Delta S^{0} = 219{,}56 - [2(5{,}74) + 2(130{,}68)] = -53{,}28\ \text{J/K}
          $$

          Y $\Delta H^{0} = +52{,}26$ kJ, la entalpía de formación del
          eteno. Endotérmica y con pérdida de entropía: nunca espontánea,
          como dice la colección.

      - tipo: calcular
        titulo: La frontera de la calcita
        pregunta: |
          d) ¿Por encima de qué temperatura se descompone sola la calcita, en
          kelvin?
        respuesta:
          tipo: numero
          valor: '1110'
          tolerancia: 2
          formato: la temperatura en kelvin, un número entero
        distractores:
          - valor: '1.110'
            mensaje: |
              Un factor mil: kJ entre J/K. La entalpía va en julios,
              178 300 J.
          - valor: '837'
            mensaje: |
              Esa es la frontera en grados centígrados. La pregunta pide
              kelvin.
        pista: |
          Productos menos reactivos para las dos, y $T = \Delta H^{0}/\Delta S^{0}$.
        desarrollo: |
          $$
          \Delta H^{0} = (-635{,}09 - 393{,}51) - (-1206{,}9) = 178{,}3\ \text{kJ}
          $$

          $$
          \Delta S^{0} = (39{,}75 + 213{,}74) - 92{,}9 = 160{,}59\ \text{J/K}
          $$

          $$
          T = \frac{178\,300}{160{,}59} = 1110\ \text{K}
          $$

          Es la respuesta de la colección: por encima de 1110 K.

      - tipo: justificar
        pregunta: Ordena las cuatro conclusiones. Una pieza es falsa.
        piezas:
          - texto: >-
              a) $\Delta H^{0} < 0$ y $\Delta S^{0} > 0$: los dos términos
              empujan a favor, y es espontánea a cualquier temperatura.
          - texto: >-
              b) Romper el I₂ cuesta energía pero da dos moles de gas por uno:
              los dos positivos, espontánea por encima de 1499 K.
          - texto: >-
              c) Formar eteno desde sus elementos es endotérmico y pasa de dos
              moles de gas a uno: nunca es espontánea.
          - texto: >-
              d) Es el mismo caso que b), endotérmica y con ganancia de
              entropía: la calcita se descompone por encima de 1110 K.
          - texto: >-
              c) no es espontánea a 298 K, pero como es endotérmica, al
              calentar lo acabará siendo.
            trampa: true
            mensaje: |
              Eso solo pasa si la entropía sube. Aquí baja, $-53{,}28$ J/K, así
              que $-T\Delta S$ es positivo y crece con la temperatura:
              $\Delta G = 52{,}26 + 0{,}05328\,T$ kJ es positiva a cualquier
              temperatura. Calentar la empeora.
        veredicto: |
          Dos signos por reacción deciden el caso; solo cuando coinciden hay
          una cuenta que hacer.

    resolucion: |
      **El método, una vez.** Con los signos de $\Delta H^{0}$ y $\Delta S^{0}$
      se coloca cada reacción en uno de los cuatro casos, y solo en los dos
      donde coinciden se calcula la frontera $T = \Delta H^{0}/\Delta S^{0}$.

      | reacción | $\Delta H^{0}$ (kJ) | $\Delta S^{0}$ (J/K) | caso | espontánea |
      |---|---|---|---|---|
      | a) nitrato de amonio | −412,2 | +565,8 | los dos a favor | siempre |
      | b) disociación del yodo | +151,24 | +100,89 | solo en caliente | $T > 1499$ K |
      | c) formación del eteno | +52,26 | −53,28 | los dos en contra | nunca |
      | d) descomposición de la calcita | +178,3 | +160,59 | solo en caliente | $T > 1110$ K |

      Las cuatro coinciden con la colección.

      **Sobre los datos.** La hoja dice «consultar los datos necesarios en
      las tablas termodinámicas» y no trae ninguno. Los de aquí son los de
      las tablas del NBS de 1982, y la prueba de que son los que usa la
      colección es que con ellos salen sus dos fronteras exactas, 1499 K y
      1110 K. Con otras tablas cambian unos kelvin, no los casos.

      **Lo que enseña.** Las dos endotérmicas del problema terminan en sitios
      opuestos: la del yodo y la de la calcita ganan entropía y acaban siendo
      espontáneas al calentar, y la del eteno la pierde y no lo es nunca. Que
      una reacción absorba calor no dice nada por sí solo; lo dice junto al
      signo de su entropía.

  - id: colfq7-10-el-bromo-que-se-parte-en-atomos
    titulo: Romper el bromo en átomos, y tres afirmaciones que comprobar
    fuente: >-
      Problema 10 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Dada la reacción: $\mathrm{Br_2\,(g) \rightarrow 2\,Br\,(g)}$, indicar
      si son ciertas las siguientes suposiciones:

      **a)** $\Delta H < 0$ a cualquier temperatura

      **b)** $\Delta S > 0$ a T=298K

      **c)** $\Delta G < 0$ a cualquier temperatura

      **Datos:** ΔHºf (Br2 (g) = 30,91 kJ mol⁻¹, ΔHºf (Br (g) = 111,88 kJ
      mol⁻¹, Sº (Br2 (g) = 245,46 J mol⁻¹ K⁻¹, Sº (Br (g) = 175,02 J mol⁻¹
      K⁻¹
    pide: Si cada una de las tres afirmaciones es cierta o falsa.

    pasos:
      - tipo: reconocer
        pregunta: |
          b) Sin calcular: ¿qué signo tiene $\Delta S$ de la reacción?
        opciones:
          - texto: >-
              Positivo, porque de un mol de gas salen dos
            correcta: true
            mensaje: |
              Eso es. Contar moles de gas decide el signo antes de mirar la
              tabla, y la tabla lo confirma: dos átomos a 175,02 son 350,04
              J/K, más que los 245,46 de la molécula.
          - texto: >-
              Negativo, porque cada átomo tiene menos entropía que la molécula,
              175 frente a 245
            mensaje: |
              Cada mol de átomos tiene menos, pero salen dos moles de átomos
              por cada mol de moléculas: $2\cdot 175{,}02 = 350{,}04$ J/K,
              más que 245,46.
          - texto: >-
              Cero, porque todo es gas
            mensaje: |
              Que todo sea gas no iguala nada: lo que cuenta es cuántos moles
              de gas hay a cada lado, y aquí se duplican.
          - texto: >-
              Depende de la temperatura
            mensaje: |
              El valor de $\Delta S$ cambia algo con la temperatura, pero el
              signo no: duplicar el número de partículas de gas aumenta la
              entropía a cualquier temperatura.

      - tipo: calcular
        titulo: La entalpía de la disociación
        pregunta: |
          a) ¿Cuánto vale $\Delta H^{0}$ de la reacción, en kJ?
        respuesta:
          tipo: numero
          valor: '192.85'
          tolerancia: 0.05
          formato: la entalpía en kJ, con dos decimales
        distractores:
          - valor: '80.97'
            mensaje: |
              Te has dejado el coeficiente: salen **dos** moles de Br por cada
              Br₂, así que la entalpía de formación del Br va multiplicada
              por 2.
          - valor: '-192.85'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Y romper un enlace
              siempre cuesta energía, así que la disociación tiene que ser
              endotérmica.
          - valor: '254.67'
            mensaje: |
              Has sumado la del Br₂ en vez de restarla. Los reactivos van con
              signo menos.
        pista: |
          $\Delta H^{0} = 2\,\Delta H^{0}_f(\mathrm{Br}) - \Delta H^{0}_f(\mathrm{Br_2})$.
        desarrollo: |
          $$
          \Delta H^{0} = 2(111{,}88) - 30{,}91 = 192{,}85\ \text{kJ}
          $$

          Positiva: la afirmación a) es falsa.

      - tipo: calcular
        titulo: La entropía de la disociación
        pregunta: |
          b) ¿Cuánto vale $\Delta S^{0}$ a 298 K, en J/K?
        respuesta:
          tipo: numero
          valor: '104.58'
          tolerancia: 0.05
          formato: la entropía en J/K, con dos decimales
        distractores:
          - valor: '-70.44'
            mensaje: |
              Te has dejado el 2 del bromo atómico. Con él, la entropía sube:
              $2\cdot 175{,}02 - 245{,}46$.
          - valor: '-104.58'
            mensaje: |
              Signo cambiado. De un mol de gas salen dos: la entropía sube.
        pista: |
          $\Delta S^{0} = 2\,S^{0}(\mathrm{Br}) - S^{0}(\mathrm{Br_2})$.
        desarrollo: |
          $$
          \Delta S^{0} = 2(175{,}02) - 245{,}46 = 104{,}58\ \text{J/K}
          $$

          Positiva: la afirmación b) es cierta.

      - tipo: calcular
        titulo: La energía libre a 298 K
        pregunta: |
          c) ¿Cuánto vale $\Delta G^{0}$ a 298 K, en kJ?
        respuesta:
          tipo: numero
          valor: '161.69'
          tolerancia: 0.1
          formato: la energía libre en kJ, con dos decimales
        distractores:
          - valor: '-30972'
            mensaje: |
              Has mezclado kJ y J: la entalpía en kilojulios y la entropía en
              julios por kelvin. Pasa la entropía a 0,10458 kJ/K antes de
              multiplicar por la temperatura.
          - valor: '224.0'
            mensaje: |
              Has sumado el término de entropía en vez de restarlo.
              $\Delta G = \Delta H - T\Delta S$, y con $\Delta S > 0$ el
              término resta.
        pista: |
          $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$, con la entropía en
          kJ/K.
        desarrollo: |
          $$
          \Delta G^{0}_{298} = 192{,}85 - 298\cdot 0{,}10458 = 161{,}69\ \text{kJ}
          $$

          Positiva, y mucho: a 298 K la disociación no es espontánea, así
          que la afirmación c) ya es falsa aquí.

      - tipo: calcular
        titulo: La temperatura frontera
        pregunta: |
          ¿A partir de qué temperatura pasa a ser negativa $\Delta G$, en
          kelvin?
        respuesta:
          tipo: numero
          valor: '1844'
          tolerancia: 2
          formato: la temperatura en kelvin, un número entero
        distractores:
          - valor: '1.844'
            mensaje: |
              Un factor mil: kJ entre J/K. La entalpía va en julios,
              192 850 J.
          - valor: '1571'
            mensaje: |
              Esa es la frontera en grados centígrados. La pregunta pide
              kelvin.
        pista: |
          $\Delta G = 0$ en $T = \Delta H^{0}/\Delta S^{0}$.
        desarrollo: |
          $$
          T = \frac{\Delta H^{0}}{\Delta S^{0}} = \frac{192\,850}{104{,}58} = 1844\ \text{K}
          $$

          Por debajo de 1844 K, $\Delta G > 0$. Con $\Delta H^{0}$ y
          $\Delta S^{0}$ tomados constantes, que es lo único que permiten
          los datos.

      - tipo: justificar
        pregunta: Ordena la respuesta a las tres afirmaciones. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Es falsa: romper el enlace Br–Br cuesta energía, y
              $\Delta H^{0} = +192{,}85$ kJ.
          - texto: >-
              b) Es cierta: de un mol de gas salen dos, y
              $\Delta S^{0} = +104{,}58$ J/K.
          - texto: >-
              Con los dos positivos la reacción solo es espontánea en
              caliente, por encima de $T = \Delta H/\Delta S = 1844$ K.
          - texto: >-
              c) Es falsa: a 298 K, $\Delta G^{0} = +161{,}7$ kJ, y sigue siendo
              positiva hasta 1844 K.
          - texto: >-
              c) Es cierta, porque con $\Delta S > 0$ el término $-T\Delta S$
              siempre acaba ganando a $\Delta H$.
            trampa: true
            mensaje: |
              «Acaba ganando» no es «siempre»: gana a partir de 1844 K. Por
              debajo, $\Delta H$ pesa más y $\Delta G$ es positiva. La
              afirmación dice «a cualquier temperatura», y un solo
              contraejemplo —298 K, con $+161{,}7$ kJ— la hace falsa.
        veredicto: |
          Dos signos positivos: la entalpía manda en frío y la entropía en
          caliente, con la frontera en 1844 K.

    resolucion: |
      **Los dos datos de la reacción**, productos menos reactivos y con el
      coeficiente 2 del bromo atómico:

      $$
      \Delta H^{0} = 2(111{,}88) - 30{,}91 = 192{,}85\ \text{kJ}
      $$

      $$
      \Delta S^{0} = 2(175{,}02) - 245{,}46 = 104{,}58\ \text{J/K}
      $$

      **Las tres afirmaciones:**

      - **a) Falsa.** $\Delta H^{0}$ es positiva: romper el enlace Br–Br
        cuesta energía. Y no cambia de signo con la temperatura.
      - **b) Cierta.** De un mol de gas salen dos.
      - **c) Falsa.** A 298 K, $\Delta G^{0} = 192{,}85 - 298\cdot 0{,}10458 = 161{,}69$ kJ,
        positiva. Solo se hace negativa por encima de
        $T = 192\,850/104{,}58 = 1844$ K.

      Coincide con la colección: falsa, cierta, falsa.

      **Lo que enseña.** Es el caso «solo en caliente» en su forma más
      limpia: romper una molécula en átomos cuesta energía y gana entropía,
      y por eso las moléculas diatómicas se disocian solas únicamente a
      temperaturas muy altas.

  - id: colfq7-11-el-amoniaco-que-arde
    titulo: Quemar amoniaco, y la temperatura a partir de la cual deja de ser espontáneo
    fuente: >-
      Problema 11 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. El enunciado no trae datos: los de aquí son los
      de las tablas del NBS de 1982, con los que sale exactamente la
      respuesta de la colección.
    nivel: practica
    enunciado: |
      Calcular la variación de entropía y energía libre estándar a 298 K de
      la reacción:

      $$
      \mathrm{4\,NH_3\,(g) + 3\,O_2\,(g) \rightarrow 2\,N_2\,(g) + 6\,H_2O\,(l)}
      $$

      **a)** ¿Será espontánea a 298K?

      **b)** ¿Será espontánea a cualquier temperatura? En caso negativo, ¿a
      qué temperatura será espontánea y por qué?

      *La hoja no da los datos. Aquí se usan los de las tablas del NBS
      (1982), los mismos del problema 9, y con ellos sale exactamente la
      respuesta de la colección:*

      | sustancia | ΔH⁰f (kJ/mol) | ΔG⁰f (kJ/mol) | S⁰ (J/mol·K) |
      |---|---|---|---|
      | NH3 (g) | −46,11 | −16,45 | 192,45 |
      | O2 (g) | 0 | 0 | 205,14 |
      | N2 (g) | 0 | 0 | 191,61 |
      | H2O (l) | −285,83 | −237,13 | 69,91 |
    pide: La entropía y la energía libre estándar a 298 K, si es espontánea a 298 K y en qué rango de temperaturas lo es.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué signo esperas para $\Delta S^{0}$?
        opciones:
          - texto: >-
              Negativo: de 7 moles de gas se pasa a 2, porque el agua sale
              líquida
            correcta: true
            mensaje: |
              Eso es. Se cuentan los moles de gas y se olvida el resto: 4 de
              amoniaco y 3 de oxígeno a la izquierda, solo 2 de nitrógeno a la
              derecha.
          - texto: >-
              Positivo, porque de 7 moles salen 8
            mensaje: |
              Estás contando el agua, que sale líquida. Un mol de líquido
              aporta muchísima menos entropía que uno de gas: en gas se pasa
              de 7 a 2.
          - texto: >-
              Cero, porque el número de átomos se conserva
            mensaje: |
              Los átomos se conservan en toda reacción. Lo que cambia la
              entropía es cómo están: aquí la mayoría acaba en un líquido.
          - texto: >-
              Positivo, porque es una combustión y libera calor
            mensaje: |
              El calor que suelta sube la entropía del **entorno**, no la del
              sistema. $\Delta S^{0}$ de la reacción mira solo los reactivos y
              los productos.

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $\Delta S^{0}$, en J/K?
        respuesta:
          tipo: numero
          valor: '-582.5'
          tolerancia: 0.3
          formato: la entropía en J/K, con una cifra decimal y su signo
        distractores:
          - valor: '-350.3'
            mensaje: |
              Has puesto $S^{0} = 0$ al N₂ y al O₂ por ser elementos. Eso vale
              para la entalpía de formación, no para la entropía, que tiene
              valor absoluto: 191,61 y 205,14 J/(mol·K).
          - valor: '-136.1'
            mensaje: |
              Te has dejado los coeficientes: 4, 3, 2 y 6. Cada entropía molar
              va multiplicada por el suyo.
          - valor: '582.5'
            mensaje: |
              Signo cambiado: es productos menos reactivos. De 7 moles de gas
              a 2, la entropía tiene que bajar.
        pista: |
          Productos menos reactivos, con los coeficientes y con la entropía de
          los elementos.
        desarrollo: |
          $$
          \Delta S^{0} = [2(191{,}61) + 6(69{,}91)] - [4(192{,}45) + 3(205{,}14)] = -582{,}54\ \text{J/K}
          $$

      - tipo: calcular
        titulo: La variación de entalpía
        pregunta: |
          ¿Cuánto vale $\Delta H^{0}$, en kJ? Hace falta para la frontera.
        respuesta:
          tipo: numero
          valor: '-1530.5'
          tolerancia: 0.3
          formato: la entalpía en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '1530.5'
            mensaje: |
              Signo cambiado. Es una combustión: libera energía, y
              $\Delta H^{0}$ tiene que salir negativa.
          - valor: '-1668.9'
            mensaje: |
              Te has dejado el 4 del amoniaco: solo has restado un mol. Son
              cuatro, $4(-46{,}11)$.
          - valor: '-101.4'
            mensaje: |
              Te has dejado el 6 del agua. Por cada 4 moles de amoniaco salen
              6 de agua.
        pista: |
          $\Delta H^{0} = 6\,\Delta H^{0}_f(\mathrm{H_2O}) - 4\,\Delta H^{0}_f(\mathrm{NH_3})$;
          el O₂ y el N₂ valen cero.
        desarrollo: |
          $$
          \Delta H^{0} = 6(-285{,}83) - 4(-46{,}11) = -1530{,}54\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La energía libre a 298 K
        pregunta: |
          ¿Cuánto vale $\Delta G^{0}$ a 298 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-1357.0'
          tolerancia: 0.3
          formato: la energía libre en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '172066'
            mensaje: |
              Has mezclado kJ y J: la entalpía en kilojulios y la entropía en
              julios por kelvin. Pasa la entropía a −0,58254 kJ/K antes de
              multiplicar.
          - valor: '-1704.1'
            mensaje: |
              Has sumado el término de entropía en vez de restarlo. Con
              $\Delta S < 0$, $-T\Delta S$ es positivo y la energía libre sale
              **menos** negativa que la entalpía.
          - valor: '1357.0'
            mensaje: |
              Signo cambiado. Una combustión tan exotérmica, a temperatura
              ambiente, es espontánea: $\Delta G^{0} < 0$.
        pista: |
          $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$, o por energías libres
          de formación. Las dos dan lo mismo.
        desarrollo: |
          $$
          \Delta G^{0} = \Delta H^{0} - T\Delta S^{0} = -1530{,}54 - 298\cdot(-0{,}58254) = -1356{,}9\ \text{kJ}
          $$

          Por energías libres de formación sale lo mismo:

          $$
          \Delta G^{0} = 6(-237{,}13) - 4(-16{,}45) = -1356{,}98\ \text{kJ}
          $$

          Negativa: a 298 K es espontánea, como dice la colección.

      - tipo: calcular
        titulo: La temperatura frontera
        pregunta: |
          b) ¿Por debajo de qué temperatura es espontánea, en kelvin?
        respuesta:
          tipo: numero
          valor: '2627'
          tolerancia: 2
          formato: la temperatura en kelvin, un número entero
        distractores:
          - valor: '2.627'
            mensaje: |
              Un factor mil: kJ entre J/K. La entalpía va en julios.
          - valor: '2354'
            mensaje: |
              Esa es la frontera en grados centígrados. La pregunta pide
              kelvin.
        pista: |
          $T = \Delta H^{0}/\Delta S^{0}$, con las dos en las mismas unidades.
        desarrollo: |
          $$
          T = \frac{\Delta H^{0}}{\Delta S^{0}} = \frac{-1530{,}54}{-0{,}58254} = 2627\ \text{K}
          $$

          Es la respuesta de la colección: espontánea por debajo de 2627 K.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua sale líquida: de 7 moles de gas se pasa a 2, y
              $\Delta S^{0} = -582{,}5$ J/K.
          - texto: >-
              Es muy exotérmica, $\Delta H^{0} = -1530{,}5$ kJ, y a 298 K gana
              la entalpía: $\Delta G^{0} = -1357$ kJ, espontánea.
          - texto: >-
              Con $\Delta H^{0}$ y $\Delta S^{0}$ negativos es el caso «solo en
              frío»: al subir la temperatura, $-T\Delta S^{0}$ crece y va
              restando ventaja.
          - texto: >-
              La frontera está en $T = \Delta H^{0}/\Delta S^{0} = 2627$ K: es
              espontánea por debajo.
          - texto: >-
              Como es una combustión muy exotérmica, es espontánea a cualquier
              temperatura.
            trampa: true
            mensaje: |
              Exotérmica no basta cuando la entropía baja. El término
              $-T\Delta S^{0}$ es positivo y crece con la temperatura, y a
              partir de 2627 K supera a los 1530 kJ de la entalpía: por encima,
              $\Delta G^{0} > 0$.
        veredicto: |
          Exotérmica y con pérdida de entropía: espontánea en frío, y la
          frontera es la misma división de siempre.

    resolucion: |
      **Los tres datos de la reacción**, con las tablas del NBS:

      $$
      \Delta S^{0} = [2(191{,}61) + 6(69{,}91)] - [4(192{,}45) + 3(205{,}14)] = -582{,}54\ \text{J/K}
      $$

      $$
      \Delta H^{0} = 6(-285{,}83) - 4(-46{,}11) = -1530{,}54\ \text{kJ}
      $$

      $$
      \Delta G^{0} = -1530{,}54 - 298\cdot(-0{,}58254) = -1356{,}9\ \text{kJ}
      $$

      **a) Sí**, a 298 K es espontánea: $\Delta G^{0} < 0$.

      **b) No a cualquier temperatura.** Con $\Delta H^{0} < 0$ y
      $\Delta S^{0} < 0$ la entalpía empuja a favor y la entropía en contra,
      y la entropía pesa más cuanto más alta es la temperatura. La frontera
      es

      $$
      T = \frac{-1530{,}54}{-0{,}58254} = 2627\ \text{K}
      $$

      y por debajo de ella es espontánea. Coincide con la colección.

      **Sobre los datos.** El enunciado no da ninguno. Los de aquí son los de
      las tablas del NBS de 1982, y con ellos sale exactamente la frontera de
      la colección, 2627 K. Hay además una comprobación interna: $\Delta G^{0}$
      por $\Delta H - T\Delta S$ y por energías libres de formación da lo
      mismo, −1356,9 y −1357,0 kJ.

      **Lo que enseña.** 2627 K es mucho: a cualquier temperatura razonable
      la combustión del amoniaco es espontánea, y la pregunta b) es de
      principio. Lo que hay que saber decir es **por qué** existe esa
      frontera: porque la reacción ordena el sistema, y el orden se paga más
      caro cuanto más caliente está todo.

  - id: colfq7-12-los-oxidos-y-el-carbon
    titulo: Tres óxidos y un carbón a 1000 K, y cuál se deja reducir
    fuente: >-
      Problema 12 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Dadas las $\Delta G^{0}_{f,1000\,\text{K}}$ (en kJ mol⁻¹) de los
      siguientes compuestos:

      NiO (s): −115; MnO (s):−280; TiO2 (s):−630; CO (g):−250

      ¿Cuál de estos óxidos metálicos puede ser reducido a metal por una
      reacción espontánea con carbón a 1000K, obteniéndose monóxido de
      carbono, y con todos los reactivos y productos en su estado estándar?
    pide: Qué óxido se puede reducir espontáneamente con carbón a 1000 K.

    pasos:
      - tipo: reconocer
        pregunta: |
          La lista no da la energía libre de formación del carbono ni la de
          los metales. ¿Falta algún dato?
        opciones:
          - texto: >-
              No: son elementos en su estado estándar, y su energía libre de
              formación vale cero a cualquier temperatura
            correcta: true
            mensaje: |
              Eso es. Formar un elemento a partir de sí mismo no cuesta nada, a
              298 K o a 1000 K. Por eso en cada reducción solo cuentan dos
              números: el del óxido y el del CO.
          - texto: >-
              Sí, y sin ellos no se puede hacer el cálculo
            mensaje: |
              No hacen falta: el carbono, el níquel, el manganeso y el titanio
              son elementos, y su $\Delta G^{0}_f$ es cero por definición.
          - texto: >-
              No, porque a 1000 K los metales están fundidos y no cuentan
            mensaje: |
              Los metales sí cuentan: son productos de la reacción. Lo que
              pasa es que su energía libre de formación vale cero, como la de
              cualquier elemento en su estado estándar.
          - texto: >-
              Solo falta la del carbono, que es la misma que la del CO
            mensaje: |
              El carbono es un elemento: su $\Delta G^{0}_f$ vale cero. La del
              CO es la de un compuesto, −250 kJ/mol, y va en los productos.

      - tipo: calcular
        titulo: La reducción del óxido de níquel
        pregunta: |
          $\mathrm{NiO + C \rightarrow Ni + CO}$. ¿Cuánto vale $\Delta G^{0}$ a
          1000 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-135'
          tolerancia: 0.5
          formato: la energía libre en kJ, un número entero con su signo
        distractores:
          - valor: '135'
            mensaje: |
              Has restado al revés, reactivos menos productos. El CO es el
              producto y va con signo más; el NiO es el reactivo y resta.
          - valor: '-365'
            mensaje: |
              Has sumado las dos energías libres. El óxido es un reactivo:
              su $\Delta G^{0}_f$ se resta, y como es negativa, restarla suma
              115.
        pista: |
          Productos menos reactivos: $\Delta G^{0}_f(\mathrm{CO}) - \Delta G^{0}_f(\mathrm{NiO})$.
        desarrollo: |
          $$
          \Delta G^{0} = -250 - (-115) = -135\ \text{kJ}
          $$

          Negativa: el NiO se reduce con carbón a 1000 K.

      - tipo: calcular
        titulo: La reducción del óxido de manganeso
        pregunta: |
          $\mathrm{MnO + C \rightarrow Mn + CO}$. ¿Cuánto vale $\Delta G^{0}$,
          en kJ?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.5
          formato: la energía libre en kJ, un número entero con su signo
        distractores:
          - valor: '-30'
            mensaje: |
              Has restado al revés. Es la energía libre del CO menos la del
              MnO: $-250 - (-280) = +30$.
          - valor: '-530'
            mensaje: |
              Has sumado las dos. El MnO es un reactivo y su energía libre se
              resta.
        pista: |
          $\Delta G^{0}_f(\mathrm{CO}) - \Delta G^{0}_f(\mathrm{MnO})$.
        desarrollo: |
          $$
          \Delta G^{0} = -250 - (-280) = 30\ \text{kJ}
          $$

          Positiva, aunque por poco: a 1000 K el carbón no reduce el MnO.

      - tipo: calcular
        titulo: La reducción del óxido de titanio
        pregunta: |
          $\mathrm{TiO_2 + 2\,C \rightarrow Ti + 2\,CO}$. ¿Cuánto vale
          $\Delta G^{0}$, en kJ?
        respuesta:
          tipo: numero
          valor: '130'
          tolerancia: 0.5
          formato: la energía libre en kJ, un número entero con su signo
        distractores:
          - valor: '380'
            mensaje: |
              Te has dejado el 2 del CO. El TiO₂ tiene dos oxígenos, así que
              hacen falta dos carbonos y salen dos CO: $2(-250)$.
          - valor: '-130'
            mensaje: |
              Has restado al revés: productos menos reactivos es
              $2(-250) - (-630)$.
          - valor: '760'
            mensaje: |
              Has multiplicado por 2 también el TiO₂. De óxido hay uno solo;
              el 2 va en el carbono y en el CO.
        pista: |
          Dos CO en los productos: $2\,\Delta G^{0}_f(\mathrm{CO}) - \Delta G^{0}_f(\mathrm{TiO_2})$.
        desarrollo: |
          $$
          \Delta G^{0} = 2(-250) - (-630) = 130\ \text{kJ}
          $$

          Positiva: el carbón no reduce el TiO₂ a 1000 K.

      - tipo: calcular
        titulo: El óxido que se reduce
        pregunta: |
          ¿Cuál de los tres óxidos se reduce con carbón a 1000 K?
        respuesta:
          tipo: formula
          valor: NiO
          formato: la fórmula del óxido
        distractores:
          - valor: TiO2
            mensaje: |
              Es el más estable de los tres: su energía libre de formación es
              la más negativa, y por eso es el más difícil de reducir. Su
              reducción sale +130 kJ, la más positiva.
          - valor: MnO
            mensaje: |
              Su reducción sale +30 kJ: positiva por poco, pero positiva. A
              1000 K el carbón no puede con él.
        pista: |
          Es el único cuya reducción tiene $\Delta G^{0} < 0$.
        desarrollo: |
          Solo el NiO da una reducción con $\Delta G^{0} < 0$, −135 kJ. Es la
          respuesta de la colección.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El carbono y los metales son elementos en su estado estándar: su
              $\Delta G^{0}_f$ vale cero.
          - texto: >-
              Con NiO, $\Delta G^{0} = -250 - (-115) = -135$ kJ: negativa,
              espontánea.
          - texto: >-
              Con MnO sale +30 kJ, y con TiO₂, que necesita dos carbonos y da
              dos CO, +130 kJ: las dos positivas.
          - texto: >-
              Solo el NiO se reduce con carbón a 1000 K.
          - texto: >-
              El TiO₂ es el que mejor se reduce, porque su energía libre de
              formación es la más negativa.
            trampa: true
            mensaje: |
              Es al revés. Una energía libre de formación muy negativa quiere
              decir que el óxido es muy estable, y en la reducción esa energía
              se resta: cuanto más negativa, más cuesta deshacerlo. El CO solo
              aporta −250 kJ por oxígeno, y el TiO₂ tiene −315 por oxígeno.
        veredicto: |
          El carbón reduce un óxido si formar CO libera más energía libre que
          la que tiene el óxido por cada oxígeno.

    resolucion: |
      **Las tres reducciones**, con el carbono y los metales a cero:

      | óxido | reacción | $\Delta G^{0}_{1000}$ (kJ) |
      |---|---|---|
      | NiO | $\mathrm{NiO + C \rightarrow Ni + CO}$ | $-250 + 115 = -135$ |
      | MnO | $\mathrm{MnO + C \rightarrow Mn + CO}$ | $-250 + 280 = +30$ |
      | TiO₂ | $\mathrm{TiO_2 + 2\,C \rightarrow Ti + 2\,CO}$ | $-500 + 630 = +130$ |

      Solo la del **NiO** es espontánea, que es la respuesta de la colección.

      **La regla que hay debajo.** Cada reducción cambia un oxígeno unido al
      metal por un oxígeno unido al carbono. Comparando por oxígeno: el CO
      da −250 kJ, el NiO tiene −115, el MnO −280 y el TiO₂ −315. El carbón
      solo gana al óxido que tiene su oxígeno menos agarrado que él.

      **Y por qué se pregunta a 1000 K.** La energía libre de formación del
      CO se hace más negativa al subir la temperatura —se pasa de un mol de
      gas, el O₂, a dos de CO—, así que a temperatura más alta el carbón
      acaba reduciendo óxidos que a 1000 K no puede. Es la idea del
      diagrama de Ellingham, y la razón de que los altos hornos trabajen tan
      calientes.

  - id: colfq7-13-el-metano-a-700-k
    titulo: Quemar metano a 700 K, y la casilla de la tabla que no es un cero
    fuente: >-
      Problema 13 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. La tabla deja en blanco la Cp del O2 (g), y la
      respuesta de la colección sale exactamente con Cp = 29,1 J mol⁻¹ K⁻¹.
    nivel: practica
    enunciado: |
      Calcular la energía libre de la reacción de combustión del metano
      (CH4 (g)) a 700 K, a partir de los siguientes datos termodinámicos:

      | Sustancia | ΔHºf (kJ mol⁻¹) | Sº (J mol⁻¹ K⁻¹) | Cp (J mol⁻¹ K⁻¹) |
      |---|---|---|---|
      | CO2 (g) | −393,50 | 213,70 | 44,22 |
      | H2O (l) | −285,85 | 69,91 | 75,31 |
      | CH4 (g) | −74,85 | 186,30 | 23,64 |
      | O2 (g) | - | 205,03 | |

      Indicar si la reacción es espontánea a 700 K, justificando la
      respuesta.

      *La hoja deja vacía la casilla de la Cp del O2 (g). No es un cero: la
      respuesta de la colección, −742,49 kJ mol⁻¹, sale exactamente con
      Cp(O2) = 29,1 J mol⁻¹ K⁻¹, y es el valor que se usa aquí.*
    pide: La energía libre de la combustión del metano a 700 K y si es espontánea a esa temperatura.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la fila del O₂ la tabla pone un guion en la entalpía de formación
          y deja vacía la capacidad calorífica. ¿Valen lo mismo esos dos
          huecos?
        opciones:
          - texto: >-
              No: la entalpía de formación del O₂ es cero por convenio, pero su
              Cp no es cero; es un dato que falta
            correcta: true
            mensaje: |
              Eso es. El cero de $\Delta H^{0}_f$ es el origen de la escala:
              formar O₂ a partir de O₂ no cuesta nada. La capacidad calorífica,
              en cambio, es una propiedad medible de la sustancia —calentar un
              mol de O₂ un grado cuesta unos 29 J— y ningún convenio la anula.
              Hay que ponerle un valor.
          - texto: >-
              Sí: los dos valen cero, porque el O₂ es un elemento
            mensaje: |
              Es el mismo error que poner $S^{0} = 0$ a los elementos. Lo que
              vale cero por ser elemento es la entalpía de formación, no
              cualquier propiedad. Con la Cp del O₂ a cero, $\Delta C_p$ sale
              171,2 J/K en vez de 113,0, y la energía libre a 700 K se desvía
              once kilojulios.
          - texto: >-
              Faltan los dos: sin la entalpía de formación del O₂ no se puede
              calcular $\Delta H^{0}$
            mensaje: |
              La entalpía de formación no falta: el guion quiere decir cero, y
              es cero por convenio para cualquier elemento en su forma
              estable. La que sí falta es la Cp.
          - texto: >-
              La Cp del O₂ no hace falta, porque la reacción se calcula a 298 K
            mensaje: |
              Se pide a 700 K, y para llevar $\Delta H$ y $\Delta S$ de 298 a
              700 K hace falta $\Delta C_p$, que suma la Cp de **todos** los
              reactivos y productos con sus coeficientes. El O₂ entra con un 2.

      - tipo: calcular
        titulo: La entalpía a 298 K
        pregunta: |
          Con la ecuación ajustada
          $\mathrm{CH_4 + 2\,O_2 \rightarrow CO_2 + 2\,H_2O\,(l)}$, ¿cuánto
          vale $\Delta H^{0}$ a 298 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-890.35'
          tolerancia: 0.1
          formato: la entalpía en kJ, con dos decimales y su signo
        distractores:
          - valor: '890.35'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Y una combustión
              libera energía, así que tiene que salir negativa.
          - valor: '-604.50'
            mensaje: |
              Te has dejado el 2 del agua. Por cada metano salen dos moles de
              agua, porque el CH₄ tiene cuatro hidrógenos.
          - valor: '-1040.05'
            mensaje: |
              Has sumado la entalpía del metano en vez de restarla. El metano
              es reactivo: su $-74{,}85$ se resta, y restar un negativo sube
              el resultado.
        pista: |
          $\Delta H^{0} = \Delta H^{0}_f(\mathrm{CO_2}) + 2\,\Delta H^{0}_f(\mathrm{H_2O}) - \Delta H^{0}_f(\mathrm{CH_4})$,
          con el O₂ a cero.
        desarrollo: |
          $$
          \Delta H^{0}_{298} = [-393{,}50 + 2(-285{,}85)] - (-74{,}85) = -890{,}35\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La entropía a 298 K
        pregunta: |
          ¿Cuánto vale $\Delta S^{0}$ a 298 K, en J/K?
        respuesta:
          tipo: numero
          valor: '-242.84'
          tolerancia: 0.1
          formato: la entropía en J/K, con dos decimales y su signo
        distractores:
          - valor: '167.22'
            mensaje: |
              Has puesto a cero la entropía del O₂. La entropía tiene valor
              absoluto, y la del O₂ viene en la tabla: 205,03 J/(mol·K), dos
              veces.
          - valor: '-37.81'
            mensaje: |
              Has contado el O₂ una sola vez. Entran dos moles:
              $2(205{,}03) = 410{,}06$.
          - valor: '242.84'
            mensaje: |
              Signo cambiado. De tres moles de gas se pasa a uno, porque el
              agua sale líquida: la entropía baja.
        pista: |
          Productos menos reactivos, con los coeficientes y con la entropía del
          O₂, que no es cero.
        desarrollo: |
          $$
          \Delta S^{0}_{298} = [213{,}70 + 2(69{,}91)] - [186{,}30 + 2(205{,}03)] = -242{,}84\ \text{J/K}
          $$

      - tipo: calcular
        titulo: La variación de capacidad calorífica
        pregunta: |
          Con $C_p(\mathrm{O_2}) = 29{,}1$ J/(mol·K), el dato que falta en la
          tabla, ¿cuánto vale $\Delta C_p$ de la reacción, en J/K?
        respuesta:
          tipo: numero
          valor: '113.0'
          tolerancia: 0.1
          formato: un número, con una cifra decimal, en J/K
        distractores:
          - valor: '171.2'
            mensaje: |
              Has tomado la casilla vacía como un cero. La Cp del O₂ no es
              cero —el cero por convenio es solo el de la entalpía de
              formación— y entra restando dos veces: $2(29{,}1) = 58{,}2$.
          - valor: '142.1'
            mensaje: |
              Has restado el O₂ una sola vez. Con su coeficiente son
              $2(29{,}1) = 58{,}2$ J/K.
          - valor: '37.69'
            mensaje: |
              Te has dejado el 2 del agua. Son dos moles de agua líquida, y
              es la sustancia de Cp más alta de la tabla: $2(75{,}31)$.
        pista: |
          Igual que las entalpías: productos menos reactivos, cada Cp
          multiplicada por su coeficiente.
        desarrollo: |
          $$
          \Delta C_p = [44{,}22 + 2(75{,}31)] - [23{,}64 + 2(29{,}1)] = 194{,}84 - 81{,}84 = 113{,}0\ \text{J/K}
          $$

      - tipo: calcular
        titulo: La entalpía a 700 K
        pregunta: |
          Con Kirchhoff, ¿cuánto vale $\Delta H$ a 700 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-844.92'
          tolerancia: 0.3
          formato: la entalpía en kJ, con dos decimales y su signo
        distractores:
          - valor: '-935.78'
            mensaje: |
              Has restado la corrección. $\Delta C_p$ es positiva, así que al
              subir la temperatura $\Delta H$ **crece**: se le suman
              $113{,}0\cdot 402$ J.
          - valor: '-811.25'
            mensaje: |
              Has multiplicado $\Delta C_p$ por 700, la temperatura final. Lo
              que cuenta es el salto desde la temperatura de la tabla:
              $700 - 298 = 402$ K.
          - valor: '44535.65'
            mensaje: |
              Has sumado julios con kilojulios: $\Delta C_p\,\Delta T$ sale en
              julios, 45 426 J, y $\Delta H^{0}_{298}$ está en kJ. Pasa uno de
              los dos antes de sumar.
        pista: |
          $\Delta H_{700} = \Delta H_{298} + \Delta C_p\,(700 - 298)$, con las
          dos cosas en las mismas unidades.
        desarrollo: |
          $$
          \Delta H_{700} = -890\,350 + 113{,}0\cdot(700 - 298) = -890\,350 + 45\,426 = -844\,924\ \text{J}
          $$

      - tipo: calcular
        titulo: La entropía a 700 K
        pregunta: |
          ¿Y $\Delta S$ a 700 K, en J/K?
        respuesta:
          tipo: numero
          valor: '-146.34'
          tolerancia: 0.15
          formato: la entropía en J/K, con dos decimales y su signo
        distractores:
          - valor: '-242.84'
            mensaje: |
              Es la de 298 K, sin corregir. La entropía de una reacción también
              cambia con la temperatura, y con $\Delta C_p = 113$ J/K el
              cambio hasta 700 K es grande: casi 100 J/K.
          - valor: '-339.34'
            mensaje: |
              Has restado la corrección, o has puesto el logaritmo al revés,
              $\ln(298/700)$. Al calentar, la entropía de los productos sube
              más que la de los reactivos, porque su Cp es mayor.
          - valor: '-200.93'
            mensaje: |
              Has usado el logaritmo decimal. La corrección lleva el
              neperiano: $\ln(700/298) = 0{,}854$, no $\log(700/298) = 0{,}371$.
        pista: |
          Para la entropía, la corrección lleva logaritmo:
          $\Delta S_{700} = \Delta S_{298} + \Delta C_p\ln(700/298)$.
        desarrollo: |
          $$
          \Delta S_{700} = -242{,}84 + 113{,}0\cdot\ln\frac{700}{298} = -242{,}84 + 96{,}50 = -146{,}34\ \text{J/K}
          $$

          Es la misma idea que la entropía de un calentamiento: la
          temperatura cambia por el camino, y por eso sale un logaritmo y no
          un producto por $\Delta T$.

      - tipo: calcular
        titulo: La energía libre a 700 K
        pregunta: |
          ¿Cuánto vale $\Delta G$ a 700 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-742.49'
          tolerancia: 0.3
          formato: la energía libre en kJ, con dos decimales y su signo
        distractores:
          - valor: '-720.36'
            mensaje: |
              Has usado $\Delta H$ y $\Delta S$ de 298 K, sin corregir con
              Kirchhoff. Es la aproximación de tomarlos constantes; aquí la
              tabla da las Cp justo para no hacerla, y la diferencia son 22 kJ.
          - valor: '-674.94'
            mensaje: |
              Has corregido la entalpía pero no la entropía: $-844{,}92$ con
              el $-242{,}84$ de 298 K. Las dos cambian con la temperatura, y
              hay que llevar las dos a 700 K.
          - valor: '101592.7'
            mensaje: |
              Has mezclado kJ y J: la entalpía en kilojulios y la entropía en
              julios por kelvin. Pasa la entropía a $-0{,}14634$ kJ/K antes de
              multiplicar por 700.
        pista: |
          $\Delta G_{700} = \Delta H_{700} - 700\,\Delta S_{700}$, con los dos
          valores corregidos.
        desarrollo: |
          $$
          \Delta G_{700} = -844{,}924 - 700\cdot(-0{,}14634) = -844{,}924 + 102{,}44 = -742{,}49\ \text{kJ}
          $$

          Es la cifra de la colección. El valor exacto de la Cp del O₂
          importa poco: con otros valores tabulados, entre 29,1 y 29,4
          J/(mol·K), el resultado cambia en poco más de una décima de
          kilojulio. Lo que sí importa es no ponerla a cero, que lo desvía
          once.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La casilla vacía del O₂ no es un cero: su entalpía de formación
              es cero por convenio, pero su Cp es un dato que falta, 29,1
              J/(mol·K).
          - texto: >-
              A 298 K, $\Delta H^{0} = -890{,}35$ kJ y $\Delta S^{0} = -242{,}84$
              J/K, con los coeficientes y la entropía del O₂.
          - texto: >-
              Con $\Delta C_p = 113{,}0$ J/K se llevan las dos a 700 K:
              $\Delta H = -844{,}92$ kJ y $\Delta S = -146{,}34$ J/K.
          - texto: >-
              $\Delta G_{700} = -844{,}92 + 700\cdot 0{,}14634 = -742{,}49$ kJ:
              negativa, así que la combustión es espontánea a 700 K.
          - texto: >-
              Como $\Delta S$ es negativa, a una temperatura tan alta como
              700 K el término $-T\Delta S$ gana y la combustión deja de ser
              espontánea.
            trampa: true
            mensaje: |
              El término $-T\Delta S$ sí juega en contra, pero a 700 K vale
              $+102$ kJ frente a una entalpía de $-845$ kJ: no llega ni de
              lejos. La frontera $T = \Delta H/\Delta S$ está a varios miles
              de kelvin —3666 K con los valores de 298 K—, así que 700 K
              queda muy por debajo, en la zona espontánea.
        veredicto: |
          Exotérmica y con pérdida de entropía: espontánea en frío, y a 700 K
          todavía se está muy lejos de la frontera.

    resolucion: |
      **El hueco de la tabla, primero.** La fila del O₂ tiene un guion en la
      entalpía de formación y la casilla de la Cp vacía. El guion es un cero
      de verdad, el del convenio de los elementos. La casilla vacía no: la Cp
      es una propiedad medida de la sustancia y no se anula por ser elemento.
      La respuesta de la colección sale exactamente con 29,1 J/(mol·K).

      **A 298 K**, con la combustión
      $\mathrm{CH_4 + 2\,O_2 \rightarrow CO_2 + 2\,H_2O\,(l)}$:

      $$
      \Delta H^{0}_{298} = [-393{,}50 + 2(-285{,}85)] - (-74{,}85) = -890{,}35\ \text{kJ}
      $$

      $$
      \Delta S^{0}_{298} = [213{,}70 + 2(69{,}91)] - [186{,}30 + 2(205{,}03)] = -242{,}84\ \text{J/K}
      $$

      **Hasta 700 K**, con

      $$
      \Delta C_p = [44{,}22 + 2(75{,}31)] - [23{,}64 + 2(29{,}1)] = 113{,}0\ \text{J/K}
      $$

      la entalpía se corrige con el salto de temperatura y la entropía con el
      logaritmo:

      $$
      \Delta H_{700} = -890\,350 + 113{,}0\cdot 402 = -844\,924\ \text{J}
      $$

      $$
      \Delta S_{700} = -242{,}84 + 113{,}0\,\ln\frac{700}{298} = -146{,}34\ \text{J/K}
      $$

      **La energía libre:**

      $$
      \Delta G_{700} = -844{,}924 - 700\cdot(-0{,}14634) = -742{,}49\ \text{kJ}
      $$

      Negativa: **la combustión del metano es espontánea a 700 K.** Es la
      respuesta de la colección, −742,49 kJ mol⁻¹.

      **Por qué es espontánea, dicho con los signos.** Es exotérmica y pierde
      entropía, el caso «solo en frío». El término $-T\Delta S$ juega en
      contra, $+102$ kJ, pero la entalpía pesa ocho veces más. La frontera
      está a miles de kelvin.

      **Lo que aporta Kirchhoff.** Sin corregir, con los valores de 298 K,
      saldría $-720{,}36$ kJ: un 3 % de diferencia que no cambia la
      conclusión pero sí la cifra. Y un aviso sobre el modelo: a 700 K el
      agua no sería líquida. La tabla la trata como líquida en todo el
      intervalo —le da su Cp de líquido—, y la respuesta de la colección
      sale así. Se sigue el enunciado.

  - id: colfq7-14-el-metanol-desde-el-co2
    titulo: Metanol a partir de CO2, y la entropía que a 373 K sigue siendo negativa
    fuente: >-
      Problema 14 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final, con una
      errata en b): da ΔS373 = 193,91 J K⁻¹ sin el signo menos. El desarrollo
      es nuestro.
    nivel: practica
    enunciado: |
      Dada la reacción: $\mathrm{CO_2\,(g) + 3\,H_2(g) \rightarrow CH_3OH(g) + H_2O\,(g)}$

      A partir de los datos de la tabla, calcular:

      **a)** ΔHºr, ΔSºr, ΔGºr a 298K

      **b)** ΔSºr a 373K

      **c)** ¿Será espontánea la reacción a cualquier temperatura?

      | Compuesto | ΔHºf (kJ mol⁻¹) | Sº (J mol⁻¹ K⁻¹) | CºP (J K⁻¹ mol⁻¹) |
      |---|---|---|---|
      | CO2(g) | −393,5 | 213,7 | 37,11 |
      | H2(g) | - | 130,7 | 28,82 |
      | CH3OH(g) | −200,7 | 239,7 | 15,97 |
      | H2O (g) | −241,8 | 188,8 | 33,58 |
    pide: La entalpía, la entropía y la energía libre a 298 K, la entropía a 373 K y si la reacción es espontánea a cualquier temperatura.

    pasos:
      - tipo: reconocer
        pregunta: |
          b) pide $\Delta S^{0}$ a 373 K, y la tabla da las entropías a 298 K.
          ¿Cómo se pasa de una temperatura a la otra?
        opciones:
          - texto: >-
              $\Delta S_{373} = \Delta S_{298} + \Delta C_p\ln(373/298)$, con la
              $\Delta C_p$ de la reacción
            correcta: true
            mensaje: |
              Eso es. Es Kirchhoff para la entropía: cada grado que se calienta
              aporta $\Delta C_p\,\mathrm{d}T/T$, y al integrar sale un
              logaritmo. Para eso da la tabla la columna de las $C_P$.
          - texto: >-
              $\Delta S_{373} = \Delta S_{298} + \Delta C_p\,(373 - 298)$, igual
              que la entalpía
            mensaje: |
              Esa es la corrección de la entalpía. La entropía divide cada
              calor entre la temperatura a la que entra, y eso da un
              logaritmo. Con $\Delta T$ saldrían −5729 J/K, un disparate que
              avisa solo.
          - texto: >-
              No hace falta: la entropía de reacción no depende de la
              temperatura
            mensaje: |
              Tomarla constante es una aproximación, la que se hace en el
              apartado c). Aquí el enunciado pide el valor a 373 K y da las
              $C_P$ para calcularlo: cambia 16,6 J/K.
          - texto: >-
              $\Delta S_{373} = \Delta H_{373}/373$
            mensaje: |
              Dividir la entalpía entre la temperatura solo vale cuando el
              proceso está en equilibrio a esa temperatura, con ΔG = 0: un
              cambio de fase a su temperatura de transición, o esta reacción en
              su frontera de 276 K. A 373 K no lo está, y ΔS ≠ ΔH/T.

      - tipo: calcular
        titulo: La entalpía a 298 K
        pregunta: |
          a) ¿Cuánto vale $\Delta H^{0}_r$ a 298 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-49.0'
          tolerancia: 0.05
          formato: la entalpía en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '49.0'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Los productos
              suman −442,5 kJ y el CO₂ −393,5: los productos están más abajo.
          - valor: '-442.5'
            mensaje: |
              Te has dejado de restar el CO₂. Es un reactivo con entalpía de
              formación, −393,5 kJ, y va restando; el H₂ es el único que
              aporta cero.
          - valor: '-836.0'
            mensaje: |
              Has sumado la entalpía del CO₂ en vez de restarla. Los reactivos
              van con signo menos: restar −393,5 es sumar 393,5.
        pista: |
          $\Delta H^{0} = \Delta H^{0}_f(\mathrm{CH_3OH}) + \Delta H^{0}_f(\mathrm{H_2O}) - \Delta H^{0}_f(\mathrm{CO_2})$,
          con el H₂ a cero.
        desarrollo: |
          $$
          \Delta H^{0}_{298} = (-200{,}7 - 241{,}8) - (-393{,}5) = -49{,}0\ \text{kJ}
          $$

          Es la cifra de la colección, −49 kJ.

      - tipo: calcular
        titulo: La entropía a 298 K
        pregunta: |
          a) ¿Cuánto vale $\Delta S^{0}_r$ a 298 K, en J/K?
        respuesta:
          tipo: numero
          valor: '-177.3'
          tolerancia: 0.05
          formato: la entropía en J/K, con una cifra decimal y su signo
        distractores:
          - valor: '214.8'
            mensaje: |
              Has puesto a cero la entropía del H₂, como su entalpía de
              formación. La entropía tiene valor absoluto: el H₂ lleva 130,7
              J/(mol·K), y entra tres veces.
          - valor: '84.1'
            mensaje: |
              Has restado el H₂ una sola vez. Son tres moles:
              $3(130{,}7) = 392{,}1$ J/K.
          - valor: '177.3'
            mensaje: |
              Signo cambiado. De cuatro moles de gas se pasa a dos: la
              entropía baja.
        pista: |
          Productos menos reactivos, con los tres moles de H₂ y su entropía,
          que no es cero.
        desarrollo: |
          $$
          \Delta S^{0}_{298} = (239{,}7 + 188{,}8) - [213{,}7 + 3(130{,}7)] = 428{,}5 - 605{,}8 = -177{,}3\ \text{J/K}
          $$

          Es la cifra de la colección.

      - tipo: calcular
        titulo: La energía libre a 298 K
        pregunta: |
          a) ¿Cuánto vale $\Delta G^{0}_r$ a 298 K, en julios?
        respuesta:
          tipo: numero
          valor: '3835.4'
          tolerancia: 1
          formato: la energía libre en J, con una cifra decimal y su signo
        distractores:
          - valor: '-3835.4'
            mensaje: |
              Signo cambiado. $-T\Delta S$ es positivo, $+52\,835$ J, y supera
              a la entalpía, $-49\,000$ J: la energía libre sale positiva.
          - valor: '52786.4'
            mensaje: |
              Has mezclado kJ y J: $-49 - 298\cdot(-177{,}3)$. Pasa la entalpía
              a julios, −49 000 J, antes de restar.
          - valor: '-101835.4'
            mensaje: |
              Has sumado el término de entropía en vez de restarlo. Es
              $\Delta G = \Delta H - T\Delta S$, y con $\Delta S < 0$ el
              término $-T\Delta S$ es positivo.
        pista: |
          $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$, todo en julios.
        desarrollo: |
          $$
          \Delta G^{0}_{298} = -49\,000 - 298\cdot(-177{,}3) = -49\,000 + 52\,835{,}4 = 3835{,}4\ \text{J}
          $$

          Es la cifra de la colección. Positiva: a 298 K la reacción no es
          espontánea.

      - tipo: calcular
        titulo: La variación de capacidad calorífica
        pregunta: |
          b) ¿Cuánto vale $\Delta C_p$ de la reacción, en J/K?
        respuesta:
          tipo: numero
          valor: '-74.02'
          tolerancia: 0.02
          formato: un número, con dos decimales y su signo, en J/K
        distractores:
          - valor: '-16.38'
            mensaje: |
              Has restado el H₂ una sola vez. Son tres moles:
              $3(28{,}82) = 86{,}46$ J/K.
          - valor: '12.44'
            mensaje: |
              Te has dejado el H₂. El guion de la tabla es su entalpía de
              formación; su $C_P$ sí viene, 28,82 J/(mol·K), y entra tres
              veces.
          - valor: '74.02'
            mensaje: |
              Signo cambiado: productos menos reactivos, como todo lo demás.
        pista: |
          $\Delta C_p = C_P(\mathrm{CH_3OH}) + C_P(\mathrm{H_2O}) - C_P(\mathrm{CO_2}) - 3\,C_P(\mathrm{H_2})$.
        desarrollo: |
          $$
          \Delta C_p = (15{,}97 + 33{,}58) - [37{,}11 + 3(28{,}82)] = 49{,}55 - 123{,}57 = -74{,}02\ \text{J/K}
          $$

      - tipo: calcular
        titulo: La entropía a 373 K
        pregunta: |
          b) ¿Cuánto vale $\Delta S^{0}_r$ a 373 K, en J/K?
        respuesta:
          tipo: numero
          valor: '-193.92'
          tolerancia: 0.05
          formato: la entropía en J/K, con dos decimales y su signo
        distractores:
          - valor: '193.91'
            mensaje: |
              Es el número que imprime la colección, y le falta el signo
              menos. A 298 K la entropía de reacción es −177,3 J/K y la
              corrección hasta 373 K también es negativa, −16,6 J/K: la suma
              no puede salir positiva.
          - valor: '-160.68'
            mensaje: |
              Has sumado la corrección con el signo cambiado, o has puesto el
              logaritmo al revés, $\ln(298/373)$. Con $\Delta C_p < 0$, al
              calentar la entropía de reacción se hace **más** negativa.
          - valor: '-5728.8'
            mensaje: |
              Has multiplicado $\Delta C_p$ por el salto de temperatura, como
              en la entalpía. La corrección de la entropía lleva logaritmo:
              $\Delta C_p\ln(373/298)$.
        pista: |
          $\Delta S_{373} = \Delta S_{298} + \Delta C_p\ln(373/298)$.
        desarrollo: |
          $$
          \Delta S^{0}_{373} = -177{,}3 + (-74{,}02)\ln\frac{373}{298} = -177{,}3 - 16{,}62 = -193{,}92\ \text{J/K}
          $$

          La colección imprime 193,91 J K⁻¹: es el mismo número sin el signo
          menos, que es una errata.

      - tipo: calcular
        titulo: La temperatura frontera
        pregunta: |
          c) ¿Por debajo de qué temperatura es espontánea la reacción, en
          kelvin?
        respuesta:
          tipo: numero
          valor: '276.4'
          tolerancia: 0.5
          formato: la temperatura en kelvin, con una cifra decimal
        distractores:
          - valor: '0.2764'
            mensaje: |
              Un factor mil: has dividido kJ entre J/K. La entalpía va en
              julios, −49 000 J.
          - valor: '3.2'
            mensaje: |
              Esa es la frontera en grados centígrados. La pregunta pide
              kelvin: $T = \Delta H/\Delta S$ ya sale en kelvin.
          - valor: '-276.4'
            mensaje: |
              Se te ha perdido un signo. $\Delta H$ y $\Delta S$ son los dos
              negativos, así que su cociente es positivo, como toda
              temperatura absoluta.
        pista: |
          $\Delta G = 0$ en $T = \Delta H^{0}/\Delta S^{0}$, con la entalpía en
          julios.
        desarrollo: |
          $$
          T = \frac{\Delta H^{0}}{\Delta S^{0}} = \frac{-49\,000}{-177{,}3} = 276{,}4\ \text{K}
          $$

          Es la respuesta de la colección: espontánea a $T < 276$ K.

      - tipo: justificar
        pregunta: Ordena la respuesta a c). Una pieza es falsa.
        piezas:
          - texto: >-
              $\Delta H^{0} = -49{,}0$ kJ y $\Delta S^{0} = -177{,}3$ J/K: los
              dos negativos, el caso «solo en frío».
          - texto: >-
              A 298 K ya no es espontánea: $\Delta G^{0} = +3835$ J, porque
              $-T\Delta S^{0} = +52{,}8$ kJ supera a la entalpía.
          - texto: >-
              La frontera está en $T = \Delta H^{0}/\Delta S^{0} = 276$ K: por
              debajo es espontánea, y por encima no.
          - texto: >-
              Tomar $\Delta H^{0}$ y $\Delta S^{0}$ constantes es una
              aproximación, pero aquí corregirlos con $\Delta C_p$ apenas
              mueve la frontera: sale 276,0 K.
          - texto: >-
              Es exotérmica, así que es espontánea a cualquier temperatura; a
              298 K sale positiva por los redondeos de la tabla.
            trampa: true
            mensaje: |
              No es un redondeo: $\Delta G^{0}$ sale +3835 J, muy lejos de
              cero. Con $\Delta S < 0$ el término $-T\Delta S$ es positivo y
              crece con la temperatura, y a 298 K ya supera a los 49 kJ de la
              entalpía. Exotérmica solo garantiza espontaneidad cuando la
              entropía no baja.
        veredicto: |
          Exotérmica pero con pérdida de entropía: espontánea solo por debajo
          de 276 K, así que a temperatura ambiente ya no lo es.

    resolucion: |
      **a · A 298 K**, productos menos reactivos, con los tres moles de H₂:

      $$
      \Delta H^{0}_{298} = (-200{,}7 - 241{,}8) - (-393{,}5) = -49{,}0\ \text{kJ}
      $$

      $$
      \Delta S^{0}_{298} = (239{,}7 + 188{,}8) - [213{,}7 + 3(130{,}7)] = -177{,}3\ \text{J/K}
      $$

      $$
      \Delta G^{0}_{298} = -49\,000 - 298\cdot(-177{,}3) = +3835{,}4\ \text{J}
      $$

      El guion de la tabla en el H₂ es su entalpía de formación, cero por
      ser elemento; su entropía, 130,7 J/(mol·K), sí cuenta, y tres veces.

      **b · A 373 K**, con Kirchhoff para la entropía:

      $$
      \Delta C_p = (15{,}97 + 33{,}58) - [37{,}11 + 3(28{,}82)] = -74{,}02\ \text{J/K}
      $$

      $$
      \Delta S^{0}_{373} = -177{,}3 - 74{,}02\,\ln\frac{373}{298} = -193{,}92\ \text{J/K}
      $$

      **c · No es espontánea a cualquier temperatura.** Exotérmica y con
      pérdida de entropía —de cuatro moles de gas a dos—: es el caso «solo en
      frío», con la frontera en

      $$
      T = \frac{-49\,000}{-177{,}3} = 276{,}4\ \text{K}
      $$

      Espontánea por debajo de 276 K. A 298 K ya no lo es, como dice el
      $\Delta G^{0}$ positivo de a): está 22 grados por encima de la frontera.

      | magnitud | aquí | la colección |
      |---|---|---|
      | $\Delta H^{0}_{298}$ | −49,0 kJ | −49 kJ |
      | $\Delta S^{0}_{298}$ | −177,3 J/K | −177,3 J K⁻¹ |
      | $\Delta G^{0}_{298}$ | +3835,4 J | 3835,4 J |
      | $\Delta S^{0}_{373}$ | −193,92 J/K | 193,91 J K⁻¹ |
      | frontera | 276,4 K | 276 K |

      **Una errata de la colección.** En b) imprime 193,91 J K⁻¹, positivo. El
      valor a 298 K es negativo y la corrección hasta 373 K también, así que
      el resultado tiene que ser negativo: es −193,92, y a la colección se le
      ha caído el signo menos.

      **Lo que enseña la frontera.** Se calcula con $\Delta H^{0}$ y
      $\Delta S^{0}$ de 298 K, tomándolos constantes. Si se corrigen los dos
      con $\Delta C_p$ a cada temperatura, la frontera sale en 276,0 K: la
      aproximación es muy buena aquí porque la frontera cae a solo 22 grados
      de la temperatura de la tabla.

  - id: colfq7-15-el-so2-de-las-chimeneas
    titulo: El SO2 de las chimeneas, y tres datos a los que les falta el signo
    fuente: >-
      Problema 15 · Problemas propuestos de termodinámica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro. Tres de los cuatro datos han perdido el signo
      menos, y la respuesta de la colección, 1,06 × 10⁻¹⁶, sale con los signos
      impresos; con los buenos, K = 9,3 × 10¹⁵. Su fórmula para 100 °C escribe
      un cociente de logaritmos y la entalpía de vaporización donde van el
      logaritmo del cociente y la entalpía de la reacción.
    nivel: practica
    enunciado: |
      La reacción:

      $$
      \mathrm{SO_2\,(g) + 2\,H_2S\,(g) \longrightarrow 3\,S(s) + 2\,H_2O\,(g)}
      $$

      Es la base de la eliminación del SO2 de las chimeneas. ¿Cuál será la
      constante de equilibrio 298 k? ¿Cómo calcularías la constante
      deequilibrio a 100 ºC?

      ΔGfº (SO2 (g)) = 300,1 kJ mol⁻¹

      ΔGfº (H2S (g)) = 33 kJ mol⁻¹

      ΔGfº (H2O (g)) = 228,6 kJ mol⁻¹

      ΔGfº (S (s)) = 0 kJ mol⁻¹

      *A los tres primeros datos les falta el signo menos: la energía libre de
      formación del SO2, del H2S y del vapor de agua es negativa, y con
      +228,6 kJ mol⁻¹ el agua se descompondría sola en hidrógeno y oxígeno.
      Con los signos tal como están impresos sale la respuesta de la
      colección, 1,06 × 10⁻¹⁶, que contradice la primera frase del
      enunciado: con K ≈ 10⁻¹⁶ la reacción no eliminaría el SO2. Aquí se resuelve con −300,1, −33 y −228,6 kJ mol⁻¹.*
    pide: La constante de equilibrio a 298 K y cómo se calcularía a 100 °C.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular, mira los cuatro datos. ¿Qué les pasa?
        opciones:
          - texto: >-
              A los tres primeros les falta el signo menos: son compuestos
              estables, y su energía libre de formación es negativa
            correcta: true
            mensaje: |
              Eso es. Una $\Delta G^{0}_f$ positiva querría decir que
              descomponerse en sus elementos le sería espontáneo, y el vapor de
              agua, el SO₂ o el H₂S son compuestos estables. Los valores tabulados son
              −228,6, −300,1 y unos −33 kJ/mol: los mismos números, con signo.
          - texto: >-
              Nada: una energía libre de formación puede ser positiva o
              negativa
            mensaje: |
              Puede, pero no la de estos tres. Con $+228{,}6$ kJ/mol el agua
              sería inestable frente a H₂ y O₂, y la constante saldría
              $10^{-16}$: la reacción no ocurriría, y el enunciado dice que se
              usa en las chimeneas.
          - texto: >-
              Que la del azufre no puede ser cero
            mensaje: |
              Esa es la única que está bien. El azufre sólido es un elemento
              en su forma estable, y su energía libre de formación vale cero
              por convenio.
          - texto: >-
              Que están en kJ, y la constante necesita julios
            mensaje: |
              Es verdad que habrá que pasar a julios para dividir entre
              $RT$, pero eso no es un problema de los datos: es de la cuenta.
              Lo raro de los datos es otra cosa, y se ve en el signo.

      - tipo: calcular
        titulo: La energía libre estándar
        pregunta: |
          Con las energías de formación negativas, ¿cuánto vale $\Delta G^{0}$
          de la reacción a 298 K, en kJ?
        respuesta:
          tipo: numero
          valor: '-91.1'
          tolerancia: 0.05
          formato: la energía libre en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '91.1'
            mensaje: |
              Es lo que sale con los signos tal como están impresos, y es la
              cuenta de la colección. Con los signos buenos la reacción libera
              energía libre: $\Delta G^{0} = -91{,}1$ kJ.
          - valor: '104.5'
            mensaje: |
              Te has dejado los coeficientes: son 2 de H₂S y 2 de agua. Cada
              energía de formación va multiplicada por el suyo.
          - valor: '-823.3'
            mensaje: |
              Has sumado todas las energías, las de los reactivos también. Es
              productos menos reactivos: el SO₂ y el H₂S restan.
        pista: |
          $\Delta G^{0} = 2\,\Delta G^{0}_f(\mathrm{H_2O}) - [\Delta G^{0}_f(\mathrm{SO_2}) + 2\,\Delta G^{0}_f(\mathrm{H_2S})]$,
          con el azufre a cero.
        desarrollo: |
          $$
          \Delta G^{0} = 2(-228{,}6) - [(-300{,}1) + 2(-33)] = -457{,}2 + 366{,}1 = -91{,}1\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El logaritmo de la constante
        pregunta: |
          ¿Cuánto vale $\ln K$ a 298 K?
        respuesta:
          tipo: numero
          valor: '36.77'
          tolerancia: 0.05
          formato: el logaritmo neperiano de K, con dos decimales
        distractores:
          - valor: '-36.77'
            mensaje: |
              Te sale con $\Delta G^{0} = +91{,}1$ kJ, la de los signos
              impresos. Con los buenos, $\Delta G^{0}$ es negativa y $\ln K$
              positivo: $K > 1$.
          - valor: '0.0368'
            mensaje: |
              Has dejado la energía libre en kJ con $R$ en J. Son 91 100 J: el
              exponente te ha salido mil veces pequeño, y con él una constante
              próxima a 1 que no avisa.
          - valor: '15.97'
            mensaje: |
              Ese es $\log K$, el decimal. Está bien calculado, pero en la
              otra base: $\ln K = 2{,}303\log K$.
        pista: |
          $\Delta G^{0} = -RT\ln K$, así que $\ln K = -\Delta G^{0}/RT$, con la
          energía libre en julios.
        desarrollo: |
          $$
          \ln K = -\frac{\Delta G^{0}}{RT} = \frac{91\,100}{8{,}314\cdot 298} = 36{,}77
          $$

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: |
          ¿Cuánto vale $K$ a 298 K?
        respuesta:
          tipo: numero
          valor: '9.31e15'
          tolerancia: 3.5e14
          formato: en notación científica, por ejemplo 2.5e10
        distractores:
          - valor: '5.89e36'
            mensaje: |
              Has elevado 10 a $\ln K$. La inversa del neperiano es la
              exponencial: $K = e^{36{,}77}$, no $10^{36{,}77}$.
        pista: |
          $K = e^{\ln K}$.
        desarrollo: |
          $$
          K = e^{36{,}77} = 9{,}3\cdot 10^{15}
          $$

          Con $R = 8{,}31$ sale $9{,}5\cdot 10^{15}$, y cabe en la tolerancia.
          La colección da $1{,}06\cdot 10^{-16}$, que es la inversa: la cuenta
          con los signos impresos.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como la entregarías en el examen: **cómo calcularías la
          constante de equilibrio a 100 °C**. Qué ecuación usas, qué dato te
          hace falta que el enunciado no da, de dónde lo sacarías y qué
          hipótesis haces. Media cara.
        rubrica:
          - punto: >-
              Escribe van't Hoff como el logaritmo de un cociente:
              $\ln\dfrac{K_{373}}{K_{298}} = -\dfrac{\Delta H^{0}}{R}\left(\dfrac{1}{373} - \dfrac{1}{298}\right)$
            porque: >-
              Es la ecuación que se pide. La solución de la colección la
              imprime como un cociente de dos logaritmos, ln K298 / ln K373, y
              así escrita es otra ecuación, que da otro número.
            minimo: true
          - punto: >-
              Dice que el $\Delta H^{0}$ es el de la reacción, y que se obtiene
              de entalpías de formación, productos menos reactivos
            porque: >-
              La solución de la colección escribe la entalpía de vaporización,
              y es una errata: la constante de esta reacción cambia con el
              calor de la reacción, no con el del agua al hervir. Y ese dato
              no está en el enunciado: hay que ir a la tabla.
            minimo: true
          - punto: >-
              Pone las temperaturas en kelvin: 100 °C son 373 K
            porque: >-
              Con 100 en el paréntesis, $1/100 - 1/298$ sale positivo en vez de
              negativo, y la constante se mueve en el sentido contrario.
          - punto: >-
              Declara la hipótesis: $\Delta H^{0}$ constante entre 298 y 373 K
            porque: >-
              Van't Hoff integrada así la da por hecha. En 75 grados es
              razonable; si no lo fuera, habría que corregir con
              $\Delta C_p$, como en el problema 14.
          - punto: >-
              Dice hacia dónde se mueve K: si la reacción es exotérmica, baja
              al calentar
            porque: >-
              Es la comprobación de signo de toda la cuenta, y Le Chatelier la
              da sin calcular. Si te sale que una exotérmica gana constante al
              calentar, hay un signo cambiado en el paréntesis.
        veredicto: |
          Otro camino vale igual: $\Delta G^{0}_{373} = \Delta H^{0} - 373\,\Delta S^{0}$
          y $K_{373} = e^{-\Delta G^{0}_{373}/(R\cdot 373)}$, con la misma
          hipótesis de $\Delta H^{0}$ y $\Delta S^{0}$ constantes. Lo que no vale
          es reutilizar el $\Delta G^{0}$ de 298 K cambiando solo la $T$ del
          denominador.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los datos del SO₂, el H₂S y el agua han perdido el signo menos:
              son compuestos estables y su energía libre de formación es
              negativa.
          - texto: >-
              Con los signos buenos, $\Delta G^{0} = 2(-228{,}6) - [-300{,}1 + 2(-33)] = -91{,}1$
              kJ.
          - texto: >-
              $\ln K = 91\,100/(8{,}314\cdot 298) = 36{,}77$, así que
              $K = 9{,}3\cdot 10^{15}$: la reacción está desplazada del todo
              hacia los productos.
          - texto: >-
              A 100 °C la constante se calcula con van't Hoff, con el
              $\Delta H^{0}$ de la reacción sacado de las entalpías de
              formación.
          - texto: >-
              A 100 °C basta con poner $T = 373$ K en $K = e^{-\Delta G^{0}/RT}$,
              con el mismo $\Delta G^{0}$ de 298 K.
            trampa: true
            mensaje: |
              $\Delta G^{0}$ no es una constante de la reacción: depende de la
              temperatura, $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$. Cambiar
              solo la $T$ del denominador es suponer $\Delta S^{0} = 0$, y aquí
              no lo es: de tres moles de gas se pasa a dos. Hay que recalcular
              $\Delta G^{0}$ a 373 K, o usar van't Hoff, que es lo mismo.
        veredicto: |
          Una energía libre negativa da una constante mayor que uno, y esta es
          enormemente mayor: por eso la reacción sirve para limpiar chimeneas.

    resolucion: |
      **Los datos, primero.** Los tres compuestos son estables, así que su
      energía libre de formación es negativa. La hoja imprime 300,1, 33 y
      228,6 sin el signo menos. Con los signos buenos:

      $$
      \Delta G^{0} = 2(-228{,}6) - [(-300{,}1) + 2(-33)] = -457{,}2 + 366{,}1 = -91{,}1\ \text{kJ}
      $$

      **La constante a 298 K**, con la energía libre en julios:

      $$
      \ln K = -\frac{\Delta G^{0}}{RT} = \frac{91\,100}{8{,}314\cdot 298} = 36{,}77
      \qquad
      K = e^{36{,}77} = 9{,}3\cdot 10^{15}
      $$

      Una constante así quiere decir que, en el equilibrio, del SO₂ no queda
      prácticamente nada: por eso la reacción sirve para quitarlo de los
      humos.

      **La respuesta de la colección, 1,06 × 10⁻¹⁶, es la inversa.** Sale con
      los datos tal como están impresos: $\Delta G^{0} = +91{,}1$ kJ y, con
      $R = 8{,}31$, $K = e^{-36{,}79} = 1{,}06\cdot 10^{-16}$. Es un resultado
      que contradice el propio enunciado: con esa constante la reacción no
      eliminaría nada.

      **A 100 °C, con van't Hoff**, tomando $\Delta H^{0}$ constante entre
      298 y 373 K:

      $$
      \ln\frac{K_{373}}{K_{298}} = -\frac{\Delta H^{0}}{R}\left(\frac{1}{373} - \frac{1}{298}\right)
      $$

      El $\Delta H^{0}$ es el de la reacción, y sale de entalpías de formación
      que el enunciado no da. La solución de la colección escribe esta misma
      idea con dos erratas: un cociente de logaritmos, ln K298 / ln K373,
      donde va el logaritmo del cociente, y la entalpía de vaporización donde
      va la de la reacción.

      Con las entalpías de formación de las tablas del NBS (1982), que no
      trae la hoja, $\Delta H^{0} = -145{,}5$ kJ: la reacción es exotérmica y
      la constante baja al calentar, hasta unos $7\cdot 10^{10}$ a 373 K.
      Sigue siendo enorme.
