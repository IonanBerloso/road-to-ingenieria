# La sexta convocatoria de la asignatura, y la última que aparece: estaba en el
# material sin extensión de fichero —se llamaba «1C_Control» a secas— y por eso
# no entró con las cinco primeras. Se encontró el 5 de septiembre de 2026 al
# rastrear la colección de problemas del tema 6.
#
# Es el control de mitad del primer cuatrimestre y cubre los temas 1 a 4
# enteros: estructura atómica, enlace iónico con su ciclo de Born-Haber, tipos
# de sólido y enlace covalente. Cinco ejercicios, 10 puntos, 1.5 h.
#
# Publica lo que vale cada ejercicio —3,00 · 1,50 · 1,75 · 2,75 · 1,00— pero no
# lo reparte por competencia, así que no se declara (§10), igual que en las
# otras cinco.
pdf: 2024-2025-1c-control.pdf

ejercicios:
  - id: exfq2425-1c-control-1-cinco-elementos-del-periodo-cinco
    tema: t02-estructura-atomica
  - id: exfq2425-1c-control-2-el-born-haber-del-yoduro-de-bario
    tema: t03-enlace-quimico
  - id: exfq2425-1c-control-3-cinco-temperaturas-de-fusion
    tema: t04-estados-y-propiedades
  - id: exfq2425-1c-control-4-el-acetilcianuro-y-tres-hibridaciones
    tema: t03-enlace-quimico
  - id: exfq2425-1c-control-5-nombra-y-formula
    tema: t01-compuestos-y-estequiometria

