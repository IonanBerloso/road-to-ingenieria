          <figcaption>El ciclo sin números, que es como lo pide el examen. En rojo, el escalón que no está en el ciclo del cloruro de sodio —el yodo es sólido y hay que sublimarlo antes de disociarlo— y la energía reticular, que es lo que se despeja.</figcaption>
          </figure>
        veredicto: |
          Da igual que lo dibujes como una cadena de flechas, como el tema 3, o
          como una escalera de energías que sube en lo que consume y baja en lo
          que libera: lo que se corrige son los estados y las flechas del camino
          largo —seis flechas, o siete si separas las dos ionizaciones—, más la
          del corto.

      - tipo: redactar
        que: deduccion
        consigna: |
          **Y ahora lo que el enunciado llama explicar**, escrito debajo del
          ciclo: cada energía con su nombre, su reacción y si consume o libera,
          y el balance que despeja la energía reticular. Media cara de folio.
        rubrica:
          - punto: |
              **El escalón del yodo sólido**: I₂ (s) → I₂ (g), la sublimación,
              antes de I₂ (g) → 2 I (g), la disociación.
            porque: |
              Es donde más puntos se pierden en este ejercicio. El yodo es sólido
              en su estado estándar y cuesta dos pasos llegar a átomos gaseosos;
              copiar el ciclo del NaCl, donde el cloro ya es gas, deja fuera la
              sublimación y descuadra el balance justo en esa cantidad.
            minimo: true
          - punto: |
              **Cada energía con su reacción y sus estados**: Ba (s) → Ba (g);
              Ba (g) → Ba⁺ (g) + e⁻ y Ba⁺ (g) → Ba²⁺ (g) + e⁻;
              2 I (g) + 2 e⁻ → 2 I⁻ (g); Ba²⁺ (g) + 2 I⁻ (g) → BaI₂ (s); y la
              formación, Ba (s) + I₂ (s) → BaI₂ (s).
            porque: |
              El enunciado pide las energías «indicando las reacciones». Una
              energía sin su reacción no dice de qué proceso es, y en la reacción
              es donde se ve si has contado bien los electrones.
            minimo: true
          - punto: |
              **Los coeficientes que pide la fórmula**: dos energías de
              ionización, no una, y la afinidad electrónica multiplicada por dos.
            porque: |
              El BaI₂ es un Ba²⁺ con dos I⁻. El ciclo del NaCl lleva una
              ionización y una afinidad porque el sodio cede un electrón y el
              cloro toma uno; aquí son dos y dos.
          - punto: |
              **El signo de cada una**: consumen las que separan —sublimar,
              disociar, ionizar— y liberan las que juntan: la afinidad del yodo
              y la energía reticular.
            porque: |
              Es lo que permite comprobar el resultado cuando haya números. Si
              al despejar sale una $\Delta H_{\text{red}}$ positiva, algún signo se ha
              perdido por el camino.
          - punto: |
              **El balance, y lo que despeja**:
              $\Delta H^{0}_f = \Delta H_{\text{sub}}(\mathrm{Ba}) + \Delta H_{\text{sub}}(\mathrm{I_2}) + \Delta H_D + EI_1 + EI_2 + 2\,AE + \Delta H_{\text{red}}$,
              y de ahí $\Delta H_{\text{red}}$.
            porque: |
              Los dos caminos se igualan porque la entalpía es función de
              estado, y esa frase es la razón del balance. Despejar la energía
              reticular es para lo que existe el ciclo: es lo único de él que no
              se puede medir.
            minimo: true
        veredicto: |
          Con los cinco, el balance queda planteado aunque no haya un solo
          número, que es justo lo que pide el examen. Repasa sobre todo el
          primero: es el escalón que separa este ciclo del de los apuntes.

      - tipo: justificar
        pregunta: Ordena el ciclo, de arriba abajo. Una pieza es falsa.
        piezas:
          - texto: 'Ba (s) → Ba (g), sublimación del bario: consume energía.'
          - texto: 'I₂ (s) → I₂ (g), sublimación del yodo, y después I₂ (g) → 2 I (g), disociación: las dos consumen.'
          - texto: 'Ba (g) → Ba²⁺ (g) + 2e⁻, primera y segunda energías de ionización: consumen las dos.'
          - texto: '2 I (g) + 2e⁻ → 2 I⁻ (g), dos veces la afinidad electrónica: libera.'
          - texto: 'Ba²⁺ (g) + 2 I⁻ (g) → BaI₂ (s): la energía reticular, que libera y es la incógnita del ciclo.'
          - texto: 'El yodo se disocia directamente desde el sólido, sin pasar por gas, porque la disociación ya incluye el cambio de estado.'
            trampa: true
            mensaje: |
              Son dos procesos distintos y los dos cuestan energía aparte:
              sublimar rompe las fuerzas **entre** moléculas de I₂, y disociar
              rompe el enlace **dentro** de cada molécula. Juntarlos en uno
              deja fuera la entalpía de sublimación y el balance sale
              descuadrado justo en esa cantidad.
    resolucion: |
      **De qué va el ejercicio.** No pide ningún número —el enunciado no da
      ni uno— sino escribir el ciclo entero con sus reacciones y plantear el
      balance. Se puntúa la estructura, y la estructura tiene una trampa: **el
      yodo es sólido**.

      **El camino corto**, que es el único medible directamente:

      $$
      \mathrm{Ba\,(s)} + \mathrm{I_2\,(s)} \;\longrightarrow\; \mathrm{BaI_2\,(s)} \qquad \Delta H^{0}_f
      $$

      **El camino largo**, escalón a escalón:

      | escalón | reacción | signo |
      |---|---|---|
      | sublimación del bario | Ba (s) → Ba (g) | consume |
      | **sublimación del yodo** | I₂ (s) → I₂ (g) | consume |
      | disociación del yodo | I₂ (g) → 2 I (g) | consume |
      | 1.ª ionización | Ba (g) → Ba⁺ (g) + e⁻ | consume |
      | 2.ª ionización | Ba⁺ (g) → Ba²⁺ (g) + e⁻ | consume |
      | afinidad electrónica, ×2 | 2 I (g) + 2e⁻ → 2 I⁻ (g) | libera |
      | energía reticular | Ba²⁺ (g) + 2 I⁻ (g) → BaI₂ (s) | libera |

      **El balance**, que es igualar los dos caminos porque la entalpía es
      función de estado:

      $$
      \Delta H^{0}_f = \Delta H_{\text{sub}}(\mathrm{Ba}) + \Delta H_{\text{sub}}(\mathrm{I_2}) + \Delta H_D + EI_1 + EI_2 + 2\,AE + \Delta H_{\text{red}}
      $$

      y de ahí se despeja lo único que no se puede medir:

      $$
      \Delta H_{\text{red}} = \Delta H^{0}_f - \left(\Delta H_{\text{sub}}(\mathrm{Ba}) + \Delta H_{\text{sub}}(\mathrm{I_2}) + \Delta H_D + EI_1 + EI_2 + 2\,AE\right)
      $$

      **Los tres sitios donde se pierden puntos**, y los tres vienen de copiar
      el ciclo del cloruro de sodio de los apuntes:

      1. **El escalón que sobra.** El cloro es gas y solo hay que disociarlo;
         el yodo es sólido y hay que sublimarlo primero. Con el bromo, que es
         líquido, sería vaporizarlo. Mira siempre el estado estándar del no
         metal antes de dibujar nada.
      2. **Los coeficientes.** En el NaCl hay medio mol de Cl₂ y una sola
         ionización; aquí hay un mol entero de I₂, **dos** ionizaciones del
         bario y **dos** afinidades electrónicas. La fórmula del compuesto
         dice cuántas de cada.
      3. **Los signos.** Todo lo que separa —sublimar, disociar, ionizar—
         consume. Lo que junta —ganar un electrón, formar el cristal— libera.
         Si al final la energía reticular te sale positiva, has perdido un
         signo por el camino.

  # ── El tercero, y es el tema 4 disfrazado de tabla de temperaturas. Vale
  #    1,75 y no tiene ni una cuenta: se puntúa clasificar cinco compuestos
  #    por su tipo de sólido y ordenarlos por la fuerza que los une.
  - id: exfq2425-1c-control-3-cinco-temperaturas-de-fusion
    titulo: Cinco temperaturas de fusión, y cinco compuestos que colocarlas
    fuente: >-
      Ejercicio 3 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      En la siguiente tabla se muestran las temperaturas de fusión de los
      siguientes compuestos: peróxido de hidrógeno, óxido de bario, óxido de
      magnesio, kripton y anhídrido hipocloroso (dicloro monoxido).
      Identificar la temperatura correspondiente a cada compuesto. Justificar
      la respuesta y completar la tabla con la fórmula de cada compuesto.

      | T fusión (°C) | −157 | −120 | −1 | 1923 | 2852 |
      |---|---|---|---|---|---|
      | Compuesto | | | | | |

      **Datos:** Números atómicos (Z): H (1); O (8); Mg (12); Cl (17);
      Kr (36); Ba (56)

      Masa atómica (u): H = 1.01; O = 16.00; Mg = 24.30; Cl = 35.45;
      Kr = 83.80; Ba = 137.33

      Valores de electronegatividad: H = 2.20; O = 3.44; Mg = 1.31;
      Cl = 3.16; Kr = 3.0; Ba = 0.89
    pide: La fórmula de cada compuesto y a qué temperatura de fusión corresponde, razonado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de mirar ninguna temperatura. ¿Qué partición hay que hacer
          primero entre los cinco compuestos?
        opciones:
          - texto: Separar los dos iónicos de los tres moleculares
            correcta: true
            mensaje: |
              Eso es, y con eso el problema está medio resuelto. Los óxidos de
              bario y magnesio son metal más no metal, o sea iónicos, y funden
              a más de mil grados; los otros tres son moleculares y funden
              muy por debajo de cero, salvo el que tiene enlace de hidrógeno.
          - texto: Ordenarlos por masa molecular
            mensaje: |
              La masa solo manda **dentro** de los moleculares apolares, y ni
              siquiera siempre. Aquí ordenaría mal: el peróxido de hidrógeno
              pesa 34 y funde a −1, el kriptón pesa 84 y funde a −157.
          - texto: Separar los que tienen oxígeno de los que no
            mensaje: |
              Tener oxígeno no dice nada del tipo de sólido: lo tienen el MgO
              —iónico— y el Cl₂O —molecular—, y funden con 3000 grados de
              diferencia.
          - texto: Ordenarlos por electronegatividad del elemento más pesado
            mensaje: |
              Lo que importa no es la electronegatividad de un elemento sino la
              **diferencia** entre los dos que se enlazan, y eso es
              precisamente lo que separa iónicos de moleculares.

      - tipo: calcular
        titulo: La diferencia que hace iónico al óxido de magnesio
        pregunta: |
          Con los datos del enunciado, ¿cuál es la diferencia de
          electronegatividad en el MgO?
        respuesta:
          tipo: numero
          valor: '2.13'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '4.75'
            mensaje: |
              Has sumado. La diferencia que clasifica un enlace es una resta.
          - valor: '2.55'
            mensaje: |
              Esa es la del BaO, $3{,}44 - 0{,}89$. Los dos son iónicos y es
              fácil cruzarlos; fíjate en cuál te piden.
          - valor: '1.24'
            mensaje: |
              Esa es la del peróxido de hidrógeno, $3{,}44 - 2{,}20$. Es de
              las cinco la que marca la frontera: por debajo el enlace es
              covalente polar, y por eso el H₂O₂ es un sólido molecular
              aunque su diferencia no sea pequeña.
        pista: |
          Oxígeno 3,44 y magnesio 1,31.
        desarrollo: |
          $$
          3{,}44 - 1{,}31 = 2{,}13
          $$

          Una diferencia por encima de 2 es enlace iónico sin discusión. Para
          comparar, la del BaO es $3{,}44 - 0{,}89 = 2{,}55$ —también iónico— y
          la del Cl₂O es $3{,}44 - 3{,}16 = 0{,}28$, que es covalente casi
          apolar.

      - tipo: reconocer
        pregunta: |
          Entre los dos iónicos, ¿cuál funde a 2852 °C y por qué?
        opciones:
          - texto: El MgO, porque el Mg²⁺ es mucho menor que el Ba²⁺ y su energía reticular es mayor
            correcta: true
            mensaje: |
              Exacto. Las cargas empatan —2+ y 2− en los dos—, así que decide
              la distancia entre iones. El magnesio es del periodo 3 y el bario
              del 6: su catión es mucho más pequeño, los iones se acercan más y
              la red aguanta más.
          - texto: El BaO, porque el bario es más pesado y su red pesa más
            mensaje: |
              La masa no entra en la energía reticular. La ley de Coulomb solo
              lleva cargas y distancia, y el bario juega en contra por el
              segundo factor: su ion es grande.
          - texto: El MgO, porque el magnesio es más electronegativo que el bario
            mensaje: |
              Es cierto que lo es —1,31 frente a 0,89—, pero eso decide **si**
              el enlace es iónico, no cuánto aguanta la red. Una vez que los
              dos lo son, ordena la energía reticular.
          - texto: El BaO, porque el bario cede sus electrones con más facilidad
            mensaje: |
              Cederlos con facilidad no fortalece la red: lo que la fortalece
              es que los iones, una vez formados, se atraigan de cerca. Y el
              Ba²⁺ es grande, así que se atraen de lejos.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Las fórmulas son H₂O₂, BaO, MgO, Kr y Cl₂O.'
          - texto: 'MgO y BaO son iónicos —metal más no metal, con diferencias de electronegatividad de 2,13 y 2,55— y por eso ocupan las dos temperaturas altas.'
          - texto: 'Entre ellos, las cargas empatan a 2+ y 2−, así que decide el tamaño del catión: MgO a 2852 °C y BaO a 1923 °C.'
          - texto: 'Los otros tres son moleculares, y entre ellos el H₂O₂ es el único con enlace de hidrógeno, así que es el que más aguanta: −1 °C.'
          - texto: 'Quedan Kr y Cl₂O, los dos con solo dispersión o dipolo-dipolo; el Cl₂O es mayor y más polarizable, así que funde a −120 °C y el Kr a −157 °C.'
          - texto: 'El kriptón funde el más bajo porque es un gas noble y los gases nobles no forman enlaces.'
            trampa: true
            mensaje: |
              No formar enlaces **químicos** no es lo mismo que no tener
              fuerzas intermoleculares: si no las tuviera, el kriptón no
              solidificaría nunca a ninguna temperatura, y solidifica a
              −157 °C. Lo que tiene son fuerzas de dispersión, las más débiles
              de todas, y esa es la razón correcta.
    resolucion: |
      **Primero las fórmulas**, porque el enunciado también las pide y porque
      sin ellas no se puede clasificar nada.

      | nombre | fórmula |
      |---|---|
      | peróxido de hidrógeno | H₂O₂ |
      | óxido de bario | BaO |
      | óxido de magnesio | MgO |
      | kriptón | Kr |
      | anhídrido hipocloroso (dicloro monóxido) | Cl₂O |

      **La partición que ordena el problema.** Dos son iónicos y tres
      moleculares, y esa frontera vale casi tres mil grados. Se comprueba con
      las electronegatividades del enunciado:

      $$
      \mathrm{MgO}\!: 3{,}44 - 1{,}31 = 2{,}13 \qquad \mathrm{BaO}\!: 3{,}44 - 0{,}89 = 2{,}55
      $$

      Los dos muy por encima de 2, o sea iónicos. En cambio el Cl₂O tiene
      $3{,}44 - 3{,}16 = 0{,}28$ y el H₂O₂ tiene $3{,}44 - 2{,}20 = 1{,}24$:
      covalentes los dos, y el kriptón ni siquiera se enlaza.

      **Entre los dos iónicos** las cargas empatan a 2+ y 2−, así que la ley
      de Coulomb solo puede decidir por la distancia. El Mg²⁺ es del periodo 3
      y el Ba²⁺ del 6, así que el magnesio es mucho más pequeño, sus iones se
      acercan más y su energía reticular es mayor.

      **Entre los tres moleculares** manda la fuerza intermolecular:

      - **H₂O₂** tiene hidrógenos unidos a oxígeno, o sea **enlace de
        hidrógeno**, la más fuerte de las tres. Por eso funde tan cerca de
        cero, casi como el agua.
      - **Cl₂O** es una molécula angular y polar, así que tiene
        dipolo-dipolo más dispersión, y es la mayor y más polarizable de las
        que quedan.
      - **Kr** es un átomo suelto: solo dispersión, y de un átomo pequeño.
        Es el más débil de los cinco.

      **La tabla completa:**

      | T fusión (°C) | −157 | −120 | −1 | 1923 | 2852 |
      |---|---|---|---|---|---|
      | compuesto | Kr | Cl₂O | H₂O₂ | BaO | MgO |

      **Lo que este ejercicio evalúa de verdad** no es saberse cinco
      temperaturas: es aplicar dos criterios distintos en dos escalas
      distintas. Primero el tipo de sólido, que reparte los cinco en dos
      grupos separados por miles de grados; y solo después, dentro de cada
      grupo, la fuerza concreta — energía reticular en los iónicos, fuerza
      intermolecular en los moleculares. Mezclar las dos escalas es lo que
      lleva a ordenar por masa molecular y equivocarse.
  # ── El cuarto, 2,75 puntos, y es el mismo molde que el cloruro de vinilo
  #    del final de 2024-2025 subido de nivel: en vez de una hibridación hay
  #    TRES en la misma molécula —sp3, sp2 y sp—, una por cada carbono.
  - id: exfq2425-1c-control-4-el-acetilcianuro-y-tres-hibridaciones
    titulo: El acetilcianuro, con tres hibridaciones distintas en una sola molécula
    fuente: >-
      Ejercicio 4 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Analizar la molécula de acetilcianuro, CH3COCN (los átomos de carbono
      son los átomos centrales de la molécula y se enlazan entre ellos):

      **4.1.** Dibujar la estructura de Lewis (razonar la respuesta)

      **4.2.** Indicar los tipos de enlace (pi o sigma).

      **4.3.** Analizar la hibridación de los átomos centrales y estudiar la
      geometría. Razonar la respuesta.

      **4.4.** Indicar los ángulos de enlace y estudia la polaridad de la
      molécula indicando los momentos dipolares. Razonar la respuesta.

      **4.5.** Dibujar la molécula.

      **Datos:** Números atómicos (Z): H (1); C (6); N (7); O (8)
    pide: >-
      La estructura de Lewis, el recuento de enlaces sigma y pi, la
      hibridación y geometría de los tres carbonos, los ángulos y la
      polaridad.

    pasos:
      - tipo: calcular
        titulo: Los electrones de valencia
        pregunta: |
          ¿Cuántos electrones de valencia hay que repartir en la estructura de
          Lewis del CH₃COCN?
        respuesta:
          tipo: numero
          valor: '26'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '40'
            mensaje: |
              Has sumado los electrones **totales** de los ocho átomos. En
              Lewis solo entran los de la capa de valencia: cuatro por carbono,
              uno por hidrógeno, cinco del nitrógeno y seis del oxígeno.
          - valor: '22'
            mensaje: |
              Parece que has contado dos carbonos en vez de tres. La fórmula
              CH₃COCN tiene un carbono en el metilo, otro en el carbonilo y
              otro en el nitrilo.
          - valor: '48'
            mensaje: |
              Cuarenta y ocho son los electrones que **caben** —ocho por átomo
              pesado y dos por hidrógeno—, no los que hay. La diferencia entre
              las dos cifras dice cuántos pares se comparten.
        pista: |
          Tres carbonos a cuatro, tres hidrógenos a uno, un oxígeno a seis y
          un nitrógeno a cinco.
        desarrollo: |
          $$
          3 \times 4 + 3 \times 1 + 1 \times 6 + 1 \times 5 = 26
          $$

          Y como caben $5 \times 8 + 3 \times 2 = 46$, hay
          $46 - 26 = 20$ electrones compartidos, o sea **diez enlaces**
          contando los múltiples por separado. Con siete parejas de átomos
          vecinos, sobran tres: un doble y un triple.

      - tipo: reconocer
        pregunta: |
          Con el esqueleto CH₃–CO–CN, ¿dónde van el doble y el triple enlace?
        opciones:
          - texto: Doble entre el carbono central y el oxígeno, triple entre el último carbono y el nitrógeno
            correcta: true
            mensaje: |
              Eso es. El oxígeno completa octeto con un doble enlace y dos
              pares solitarios, y el nitrógeno con un triple y un par
              solitario. Es un grupo carbonilo pegado a un grupo nitrilo.
          - texto: Triple entre los dos primeros carbonos y doble con el oxígeno
            mensaje: |
              El carbono del metilo lleva tres hidrógenos, así que solo le
              queda un enlace libre: no puede formar un triple. Además el
              nitrógeno se quedaría sin completar octeto.
          - texto: Dos dobles, uno con el oxígeno y otro con el nitrógeno
            mensaje: |
              Con un doble al nitrógeno le faltaría un electrón para el octeto
              y le sobraría una carga formal. El nitrógeno terminal con un solo
              vecino forma triple, que es lo que define un nitrilo.
          - texto: Doble entre los dos últimos carbonos y triple con el nitrógeno
            mensaje: |
              Entonces el carbono del carbonilo tendría cinco enlaces —dos al
              carbono vecino, uno al metilo y los del oxígeno—, y el carbono
              nunca pasa de cuatro.

      - tipo: dibujar
        consigna: |
          **El apartado 4.1, en papel.** Dibuja la estructura de Lewis del
          CH₃COCN con los tres carbonos en cadena, como dice el enunciado: cada
          enlace con su raya, los múltiples con sus dos o tres rayas, y todos
          los pares solitarios. Debajo, en una línea, el recuento que la
          justifica, que es lo que el enunciado llama razonar.
        comprueba:
          - punto: |
              El esqueleto es CH₃–C–C–N, con los tres carbonos seguidos y el
              oxígeno colgando del carbono central.
            porque: |
              Es el que fija el enunciado: los carbonos son los átomos centrales
              y se enlazan entre ellos. Poner el oxígeno entre dos carbonos, o el
              nitrógeno en medio, es dibujar otra molécula, y los apartados 4.2 a
              4.5 salen todos de este esqueleto.
          - punto: |
              Un doble enlace C=O y un triple C≡N; todos los demás, sencillos.
            porque: |
              Caben 46 electrones y hay 26, así que se comparten 20: diez
              enlaces. Con siete parejas de átomos vecinos sobran tres, y solo
              cuadran como un doble al oxígeno y un triple al nitrógeno. El
              carbono del metilo ya tiene sus cuatro enlaces y no admite un
              múltiple.
          - punto: |
              Dos pares solitarios en el oxígeno y uno en el nitrógeno,
              dibujados.
            porque: |
              Son seis de los 26 electrones, y sin ellos el oxígeno se queda con
              cuatro electrones y el nitrógeno con seis. Es el fallo más
              frecuente en Lewis: los enlaces bien y los pares sin dibujar.
          - punto: |
              Ningún par solitario en los carbonos ni en los hidrógenos.
            porque: |
              Cada carbono completa su octeto con cuatro enlaces, contando el
              doble por dos y el triple por tres, y cada hidrógeno tiene sus dos
              electrones con uno. Un par de más en un carbono delata que se han
              contado mal los electrones.
          - punto: |
              La cuenta escrita: 20 electrones en enlaces y 6 en pares
              solitarios, 26 en total.
            porque: |
              Es lo que convierte el dibujo en un razonamiento. Si tu estructura
              suma 24 o 28, sobra o falta un par en algún sitio, y conviene
              encontrarlo antes del 4.2, que cuenta enlaces sobre ella.
        figura: |
