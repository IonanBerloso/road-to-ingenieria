ejercicios:
  # ── El primero del control, y otra vez una tabla: es el tercer enunciado de
  #    los seis del corpus que examina el tema 2 así. La vuelta de tuerca de
  #    este es que da los datos AL REVÉS —el grupo y el periodo, no la Z— en
  #    tres de las cinco filas, y que el 1.5 obliga a distinguir dos elementos
  #    cuyas primeras energías de ionización se diferencian en 2 kJ/mol.
  - id: exfq2425-1c-control-1-cinco-elementos-del-periodo-cinco
    titulo: Cinco elementos del periodo 5, y dos que solo se distinguen por la segunda ionización
    fuente: >-
      Ejercicio 1 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      **1.1.** Completar la tabla (responder directamente en esta hoja).

      | Elemento | Configuración electrónica | Grupo | Periodo |
      |---|---|---|---|
      | A | | 1A | 5 |
      | ₃₉B | | | |
      | ₄₇C | | | |
      | D | | 2B (12) | 5 |
      | E | | 6A | 5 |

      **1.2.** Calcular la carga nuclear efectiva del electrón más externo de
      los elementos A y B.

      **1.3.** Entre los elementos A y B, ¿cuál tendrá el mayo radio atómico?
      Razonar la respuesta.

      **1.4.** Iones más probables de los elementos A, B y E y su
      correspondiente configuración electrónica. Razonar la respuesta.

      **1.5.** En la siguiente tabla se muestran las energías de ionización de
      los elementos A, C, D y E. Indicar cuales se corresponden con cada
      elemento. Justificar la respuesta empleando los datos de 1 y 2 energía
      de ionización.

      | 1.ª E. I. (kJ/mol) | 2.ª E. I. (kJ/mol) |
      |---|---|
      | 867 | 1631 |
      | 403 | 2633 |
      | 731 | 2070 |
      | 869 | 1790 |

      **1.6.** Indicar los números cuánticos del electrón diferenciador del
      elemento B.
    pide: >-
      La tabla de los cinco elementos, las dos cargas efectivas, el radio, los
      iones probables, el reparto de las energías de ionización y los números
      cuánticos del diferenciador de B.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tres filas dan grupo y periodo en vez del número atómico. ¿Cómo se
          identifica el elemento A, del grupo 1A y periodo 5?
        opciones:
          - texto: Contando desde el gas noble anterior; su configuración termina en $5s^{1}$
            correcta: true
            mensaje: |
              Eso es. Periodo 5 significa que el nivel más alto es el 5, y
              grupo 1A significa un solo electrón en él: $\ldots 5s^{1}$.
              Rellenando por debajo hasta el kriptón sale $Z = 37$, el rubidio.
          - texto: No se puede; hace falta el número atómico
            mensaje: |
              El grupo y el periodo determinan la configuración por completo, y
              la configuración determina $Z$. De hecho es la misma información
              con otra cara, y por eso el examen mezcla las dos formas de
              darla.
          - texto: Es el litio, porque es el primer elemento del grupo 1A
            mensaje: |
              El litio es del periodo 2. El grupo dice la columna y el periodo
              la fila; hacen falta los dos.
          - texto: Buscando el elemento cuya masa atómica sea 5
            mensaje: |
              El periodo no es la masa ni el número atómico: es la fila de la
              tabla, y coincide con el valor de $n$ más alto de la
              configuración.

      - tipo: calcular
        titulo: La carga efectiva del elemento A
        pregunta: |
          El elemento A tiene $Z = 37$ y su electrón más externo es un $5s$.
          ¿Cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Es la cuenta ingenua, $37 - 36$. Trata los 36 electrones
              internos como si taparan del todo, y los ocho de la capa 4 solo
              tapan $0{,}85$.
          - valor: '2.55'
            mensaje: |
              Te has contado a ti mismo. En $(5s^{1})$ solo hay un electrón, el
              que miramos, así que no tiene compañeros de grupo.
          - valor: '4.20'
            mensaje: |
              Parece que has dejado los diez electrones $3d$ fuera de la
              cuenta. Están en la capa 3, con peso $1{,}00$, y sí entran.
        pista: |
          Agrupa como $\ldots(3d^{10})(4s^{2}4p^{6})(5s^{1})$. Ningún
          compañero, ocho en la capa 4, veintiocho más adentro.
        desarrollo: |
          $$
          S = 0 \times 0{,}35 + 8 \times 0{,}85 + 28 \times 1{,}00 = 34{,}80
          $$

          $$
          Z_{\text{ef}} = 37 - 34{,}80 = 2{,}20
          $$

          Es el mismo $2{,}20$ que el sodio, y no es casualidad: los dos son
          alcalinos con un solo electrón de valencia, ocho debajo y el resto
          apantallando entero.

      - tipo: calcular
        titulo: La carga efectiva del elemento B
        pregunta: |
          El elemento B tiene $Z = 39$ y su configuración ordenada termina en
          $4d^{1}5s^{2}$. Para su electrón **más externo**, ¿cuánto vale
          $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '3.00'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2.85'
            mensaje: |
              Has olvidado el electrón $4d^{1}$ al contar la capa 4. Esa capa
              tiene nueve electrones en el itrio —$4s^{2}4p^{6}4d^{1}$—, no
              ocho.
          - valor: '3.35'
            mensaje: |
              Te has contado a ti mismo. En $(5s^{2})$ hay dos electrones, así
              que el que miramos tiene **un** compañero.
          - valor: '11.65'
            mensaje: |
              Parece que has calculado la carga efectiva del electrón $4d$, que
              es el **diferenciador**, no el más externo. El apartado 1.2 pide
              el más externo; el diferenciador se pide en el 1.6.
        pista: |
          Un compañero en el grupo $5s$, nueve electrones en la capa 4 y
          veintiocho más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 9 \times 0{,}85 + 28 \times 1{,}00 = 36{,}00
          $$

          $$
          Z_{\text{ef}} = 39 - 36{,}00 = 3{,}00
          $$

      - tipo: reconocer
        pregunta: |
          Apartado 1.5. Las dos primeras energías de ionización más parecidas
          son 867 y 869 kJ/mol, y son las de D (cadmio) y E (teluro). ¿Cómo se
          decide cuál es cuál?
        opciones:
          - texto: Por la segunda, porque el ion Cd⁺ queda como $4d^{10}5s^{1}$ y le cuesta poco perder el que le sobra
            correcta: true
            mensaje: |
              Exacto, y por eso el enunciado dice «empleando los datos de 1 y
              2 energía de ionización». Al cadmio, quitarle el segundo
              electrón lo deja en $4d^{10}$, una subcapa completa: sale barato,
              1631. Al teluro hay que sacarlo de un $5p$ y cuesta 1790.
          - texto: Por la primera, porque 869 es mayor que 867 y el teluro está más a la derecha
            mensaje: |
              Dos kilojulios de diferencia sobre casi novecientos es ruido: no
              se puede sostener un razonamiento sobre eso, y por eso el
              enunciado pide usar **las dos** columnas. La segunda los separa
              por 159.
          - texto: Por el radio atómico, que es menor en el teluro
            mensaje: |
              El radio no está en la tabla del enunciado y además no
              distinguiría: los dos son del periodo 5. Lo que hay que usar es
              lo que el examen da.
          - texto: No se puede decidir; hay que dejar las dos posibilidades abiertas
            mensaje: |
              Sí se puede, y con seguridad. La segunda energía de ionización
              separa 1631 de 1790, que no es ruido, y la explicación es de
              configuración electrónica.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 1.5. Una pieza es falsa.
        piezas:
          - texto: 'Los cuatro elementos son A = rubidio, C = plata, D = cadmio y E = teluro, todos del periodo 5.'
          - texto: 'El rubidio es alcalino: le cuesta poquísimo el primero, 403, y al quedar como gas noble el segundo se dispara a 2633. Es el par más fácil de asignar.'
          - texto: 'A la plata, con 731, el segundo le cuesta 2070 porque Ag⁺ es 4d¹⁰, una subcapa completa que hay que romper.'
          - texto: 'Cadmio y teluro empatan casi en el primero, 867 y 869, y los separa el segundo: 1631 el cadmio, porque Cd⁺ pierde su 5s sobrante y queda en 4d¹⁰, y 1790 el teluro.'
          - texto: 'El orden de las segundas energías, 2633 > 2070 > 1790 > 1631, mide lo estable que es cada ion +1.'
          - texto: 'El rubidio tiene la segunda energía más alta porque es el elemento más pesado de los cuatro.'
            trampa: true
            mensaje: |
              El teluro tiene 52 protones y el rubidio 37, así que el rubidio
              no es el más pesado. Lo que dispara su segunda ionización es que
              Rb⁺ ya tiene configuración de gas noble, y arrancarle otro
              electrón significa romper una capa completa. El peso no tiene
              nada que ver.
    resolucion: |
      **1.1 · La tabla.** Tres filas dan la Z y dos dan grupo y periodo; en
      los dos casos se llega a lo mismo, porque grupo y periodo determinan la
      configuración por completo.

      | | Z | configuración ordenada | grupo | periodo |
      |---|---|---|---|---|
      | A · Rb | 37 | $[\mathrm{Kr}]\,5s^{1}$ | 1A | 5 |
      | B · Y | 39 | $[\mathrm{Kr}]\,4d^{1}5s^{2}$ | 3B | 5 |
      | C · Ag | 47 | $[\mathrm{Kr}]\,4d^{10}5s^{1}$ | 1B | 5 |
      | D · Cd | 48 | $[\mathrm{Kr}]\,4d^{10}5s^{2}$ | 2B | 5 |
      | E · Te | 52 | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{4}$ | 6A | 5 |

      Los cinco son del periodo 5, que es lo que hace comparable todo lo que
      viene después: $n$ no distingue nada y siempre decide la carga efectiva
      o la configuración del ion.

      **1.2 · Las dos cargas efectivas.**

      $$
      S_{\mathrm{Rb}} = 8 \times 0{,}85 + 28 \times 1{,}00 = 34{,}80 \quad\Longrightarrow\quad Z_{\text{ef}} = 37 - 34{,}80 = 2{,}20
      $$

      $$
      S_{\mathrm{Y}} = 1 \times 0{,}35 + 9 \times 0{,}85 + 28 \times 1{,}00 = 36{,}00 \quad\Longrightarrow\quad Z_{\text{ef}} = 39 - 36{,}00 = 3{,}00
      $$

      Ojo al detalle del itrio: su capa 4 tiene **nueve** electrones, porque
      el $4d^{1}$ cuenta ahí. Contar ocho es el fallo típico.

      **1.3 · El radio.** Los dos son del periodo 5, así que $n$ empata y
      decide $Z_{\text{ef}}$: $2{,}20$ frente a $3{,}00$. **El rubidio tiene
      el radio mayor**, porque sujeta su electrón de valencia con menos fuerza.

      **1.4 · Los iones más probables.** Cada uno busca el gas noble más
      cercano.

      | | ion | configuración | por qué |
      |---|---|---|---|
      | Rb | Rb⁺ | $[\mathrm{Kr}]$ | cede su único $5s$ |
      | Y | Y³⁺ | $[\mathrm{Kr}]$ | cede los dos $5s$ y el $4d$ |
      | Te | Te²⁻ | $[\mathrm{Xe}]$ | gana dos y completa el $5p$ |

      **1.5 · Las energías de ionización.** El enunciado pide justificarlo con
      **las dos columnas**, y no es una formalidad: sin la segunda no se
      pueden separar el cadmio y el teluro.

      | elemento | 1.ª EI | 2.ª EI | por qué |
      |---|---|---|---|
      | Rb | 403 | 2633 | alcalino: el primero sale casi solo, y el segundo rompe el gas noble |
      | Ag | 731 | 2070 | Ag⁺ es $4d^{10}$, subcapa completa que hay que romper |
      | Cd | 867 | 1631 | Cd⁺ es $4d^{10}5s^{1}$; perder el $5s$ que sobra sale barato |
      | Te | 869 | 1790 | Te⁺ pierde un $5p$, sin ninguna capa completa que romper |

      **El razonamiento en una frase:** las segundas energías ordenan lo
      **estable que es cada ion +1**. Rb⁺ es un gas noble y no suelta nada más
      sin pagar caro; Ag⁺ tiene la $d$ completa; Cd⁺ está a un electrón de
      tenerla; y Te⁺ es el más flojo de los cuatro.

      Fíjate en lo que **no** sirve: las primeras energías del cadmio y el
      teluro se llevan dos kilojulios, un 0,2 %. Construir la asignación sobre
      esa diferencia sería inventarse una precisión que el dato no tiene.

      **1.6 · Los números cuánticos del diferenciador de B.** El itrio termina
      su llenado en el $4d^{1}$ —el $5s$ se llena antes—, así que el electrón
      diferenciador es ese:

      $$
      (n,\ \ell,\ m_\ell,\ m_s) = (4,\ 2,\ -2,\ +1/2)
      $$

      El $m_\ell = -2$ sale de la regla de Hund con el convenio de empezar a
      llenar por el valor más bajo, y el $+1/2$ de que es el primer electrón
      de la subcapa. Y conviene notar que **este electrón no es el mismo del
      apartado 1.2**: allí se pedía el más externo, que es un $5s$.

  # ── El segundo, y es el único ejercicio de todo el corpus que pide el
  #    ciclo de Born-Haber. No trae ni un número: se puntúa escribir las
  #    reacciones y el balance. La trampa está en el yodo, que es SÓLIDO en
  #    condiciones estándar, así que el ciclo lleva un escalón que el del
  #    cloruro de sodio de los apuntes no tiene.
  - id: exfq2425-1c-control-2-el-born-haber-del-yoduro-de-bario
    titulo: El ciclo del yoduro de bario, y el escalón que el del NaCl no tiene
    fuente: >-
      Ejercicio 2 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Ciclo de Born Haber del yoduro de bario. Explicar las energías que
      forman parte del ciclo (indicando las reacciones) y el balance de
      energía.
    pide: Las reacciones de cada escalón del ciclo y el balance que despeja la energía reticular.

    pasos:
      - tipo: reconocer
        pregunta: |
          El ciclo empieza en los elementos en su estado estándar. ¿En qué
          estado está el yodo?
        opciones:
          - texto: Sólido, así que antes de disociarlo hay que sublimarlo
            correcta: true
            mensaje: |
              Ese es el escalón que el ciclo del NaCl no tiene y este sí. El
              yodo es el único halógeno sólido a temperatura ambiente, así que
              el camino largo lleva **sublimación del I₂** antes de la
              disociación.
          - texto: Gas, como el cloro
            mensaje: |
              El cloro y el flúor son gases, el bromo es líquido y el yodo es
              **sólido**. Copiar el ciclo del NaCl aquí deja fuera un escalón
              entero y el balance sale mal.
          - texto: Líquido, como el bromo
            mensaje: |
              El líquido es el bromo. El yodo forma esos cristales grises que
              subliman al calentarlos — de hecho es el ejemplo clásico de
              sublimación.
          - texto: Da igual, porque el estado no entra en el ciclo
            mensaje: |
              Entra de lleno: el ciclo parte de los elementos **en su estado
              estándar**, y llevar el yodo de sólido a átomos gaseosos cuesta
              dos pasos en vez de uno.

      - tipo: calcular
        titulo: Cuántas ionizaciones hacen falta
        pregunta: |
          Para formar un mol de BaI₂ a partir de los elementos, ¿cuántas
          energías de ionización del bario entran en el ciclo?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Una bastaría para un catión 1+. El bario es del grupo 2 y forma
              Ba²⁺, así que hay que arrancarle **dos** electrones y sumar la
              primera y la segunda energía de ionización.
          - valor: '3'
            mensaje: |
              Tres serían para un catión 3+. La fórmula BaI₂ ya lo dice: dos
              yoduros con carga 1− cada uno piden un catión 2+.
        pista: |
          Mira la fórmula. Dos yoduros de carga 1− exigen un catión de carga…
        desarrollo: |
          La fórmula BaI₂ obliga a un catión 2+, así que:

          $$
          \mathrm{Ba\,(g)} \rightarrow \mathrm{Ba^{+}\,(g)} + e^{-} \qquad (EI_1)
          $$

          $$
          \mathrm{Ba^{+}\,(g)} \rightarrow \mathrm{Ba^{2+}\,(g)} + e^{-} \qquad (EI_2)
          $$

          Y por el otro lado, dos afinidades electrónicas, una por cada yodo.

      - tipo: reconocer
        pregunta: |
          ¿Cuál de estos escalones **libera** energía en vez de consumirla?
        opciones:
          - texto: La afinidad electrónica del yodo y la energía reticular
            correcta: true
            mensaje: |
              Las dos, y por motivos distintos. El yodo gana un electrón y se
              acerca a la configuración de gas noble, así que su afinidad es
              negativa. Y juntar iones de signo contrario en un cristal libera
              muchísimo: es el escalón grande del ciclo.
          - texto: Solo la energía reticular
            mensaje: |
              También la afinidad electrónica. Casi todos los halógenos tienen
              afinidad negativa —ganar un electrón les viene bien— y el yodo
              no es excepción.
          - texto: La sublimación del bario y la del yodo
            mensaje: |
              Sublimar cuesta energía siempre: hay que romper las fuerzas que
              mantienen unido el sólido. Los dos escalones de sublimación son
              endotérmicos.
          - texto: Las dos energías de ionización
            mensaje: |
              Arrancar un electrón cuesta **siempre**: es la definición de
              energía de ionización, y por eso es positiva. La segunda además
              cuesta más que la primera.

      - tipo: justificar
        pregunta: Ordena el ciclo, de arriba abajo. Una pieza es falsa.
        piezas:
          - texto: 'Ba (s) → Ba (g), sublimación del bario: consume energía.'
          - texto: 'I₂ (s) → I₂ (g), sublimación del yodo, y después I₂ (g) → 2 I (g), disociación: las dos consumen.'
          - texto: 'Ba (g) → Ba²⁺ (g) + 2e⁻, primera y segunda energías de ionización: consumen las dos.'
          - texto: '2 I (g) + 2e⁻ → 2 I⁻ (g), dos veces la afinidad electrónica: libera.'
          - texto: 'Ba²⁺ (g) + 2 I⁻ (g) → BaI₂ (s): la energía reticular, que libera y es la incógnita del ciclo.'
          - texto: 'El yodo se disocia directamente desde el sólido, sin pasar por gas, porque la disociación ya incluye el cambio de estado.'
            trampa: true
            mensaje: |
              Son dos procesos distintos y los dos cuestan energía aparte:
              sublimar rompe las fuerzas **entre** moléculas de I₂, y disociar
              rompe el enlace **dentro** de cada molécula. Juntarlos en uno
              deja fuera la entalpía de sublimación y el balance sale
              descuadrado justo en esa cantidad.
    resolucion: |
      **De qué va el ejercicio.** No pide ningún número —el enunciado no da
      ni uno— sino escribir el ciclo entero con sus reacciones y plantear el
      balance. Se puntúa la estructura, y la estructura tiene una trampa: **el
      yodo es sólido**.

      **El camino corto**, que es el único medible directamente:

      $$
      \mathrm{Ba\,(s)} + \mathrm{I_2\,(s)} \;\longrightarrow\; \mathrm{BaI_2\,(s)} \qquad \Delta H^{0}_f
      $$

      **El camino largo**, escalón a escalón:

      | escalón | reacción | signo |
      |---|---|---|
      | sublimación del bario | Ba (s) → Ba (g) | consume |
      | **sublimación del yodo** | I₂ (s) → I₂ (g) | consume |
      | disociación del yodo | I₂ (g) → 2 I (g) | consume |
      | 1.ª ionización | Ba (g) → Ba⁺ (g) + e⁻ | consume |
      | 2.ª ionización | Ba⁺ (g) → Ba²⁺ (g) + e⁻ | consume |
      | afinidad electrónica, ×2 | 2 I (g) + 2e⁻ → 2 I⁻ (g) | libera |
      | energía reticular | Ba²⁺ (g) + 2 I⁻ (g) → BaI₂ (s) | libera |

      **El balance**, que es igualar los dos caminos porque la entalpía es
      función de estado:

      $$
      \Delta H^{0}_f = \Delta H_{\text{sub}}(\mathrm{Ba}) + \Delta H_{\text{sub}}(\mathrm{I_2}) + \Delta H_D + EI_1 + EI_2 + 2\,AE + \Delta H_{\text{red}}
      $$

      y de ahí se despeja lo único que no se puede medir:

      $$
      \Delta H_{\text{red}} = \Delta H^{0}_f - \left(\Delta H_{\text{sub}}(\mathrm{Ba}) + \Delta H_{\text{sub}}(\mathrm{I_2}) + \Delta H_D + EI_1 + EI_2 + 2\,AE\right)
      $$

      **Los tres sitios donde se pierden puntos**, y los tres vienen de copiar
      el ciclo del cloruro de sodio de los apuntes:

      1. **El escalón que sobra.** El cloro es gas y solo hay que disociarlo;
         el yodo es sólido y hay que sublimarlo primero. Con el bromo, que es
         líquido, sería vaporizarlo. Mira siempre el estado estándar del no
         metal antes de dibujar nada.
      2. **Los coeficientes.** En el NaCl hay medio mol de Cl₂ y una sola
         ionización; aquí hay un mol entero de I₂, **dos** ionizaciones del
         bario y **dos** afinidades electrónicas. La fórmula del compuesto
         dice cuántas de cada.
      3. **Los signos.** Todo lo que separa —sublimar, disociar, ionizar—
         consume. Lo que junta —ganar un electrón, formar el cristal— libera.
         Si al final la energía reticular te sale positiva, has perdido un
         signo por el camino.

  # ── El tercero, y es el tema 4 disfrazado de tabla de temperaturas. Vale
  #    1,75 y no tiene ni una cuenta: se puntúa clasificar cinco compuestos
  #    por su tipo de sólido y ordenarlos por la fuerza que los une.
  - id: exfq2425-1c-control-3-cinco-temperaturas-de-fusion
    titulo: Cinco temperaturas de fusión, y cinco compuestos que colocarlas
    fuente: >-
      Ejercicio 3 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      En la siguiente tabla se muestran las temperaturas de fusión de los
      siguientes compuestos: peróxido de hidrógeno, óxido de bario, óxido de
      magnesio, kripton y anhídrido hipocloroso (dicloro monoxido).
      Identificar la temperatura correspondiente a cada compuesto. Justificar
      la respuesta y completar la tabla con la fórmula de cada compuesto.

      | T fusión (°C) | −157 | −120 | −1 | 1923 | 2852 |
      |---|---|---|---|---|---|
      | Compuesto | | | | | |

      **Datos:** Números atómicos (Z): H (1); O (8); Mg (12); Cl (17);
      Kr (36); Ba (56)

      Masa atómica (u): H = 1.01; O = 16.00; Mg = 24.30; Cl = 35.45;
      Kr = 83.80; Ba = 137.33

      Valores de electronegatividad: H = 2.20; O = 3.44; Mg = 1.31;
      Cl = 3.16; Kr = 3.0; Ba = 0.89
    pide: La fórmula de cada compuesto y a qué temperatura de fusión corresponde, razonado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de mirar ninguna temperatura. ¿Qué partición hay que hacer
          primero entre los cinco compuestos?
        opciones:
          - texto: Separar los dos iónicos de los tres moleculares
            correcta: true
            mensaje: |
              Eso es, y con eso el problema está medio resuelto. Los óxidos de
              bario y magnesio son metal más no metal, o sea iónicos, y funden
              a más de mil grados; los otros tres son moleculares y funden
              muy por debajo de cero, salvo el que tiene enlace de hidrógeno.
          - texto: Ordenarlos por masa molecular
            mensaje: |
              La masa solo manda **dentro** de los moleculares apolares, y ni
              siquiera siempre. Aquí ordenaría mal: el peróxido de hidrógeno
              pesa 34 y funde a −1, el kriptón pesa 84 y funde a −157.
          - texto: Separar los que tienen oxígeno de los que no
            mensaje: |
              Tener oxígeno no dice nada del tipo de sólido: lo tienen el MgO
              —iónico— y el Cl₂O —molecular—, y funden con 3000 grados de
              diferencia.
          - texto: Ordenarlos por electronegatividad del elemento más pesado
            mensaje: |
              Lo que importa no es la electronegatividad de un elemento sino la
              **diferencia** entre los dos que se enlazan, y eso es
              precisamente lo que separa iónicos de moleculares.

      - tipo: calcular
        titulo: La diferencia que hace iónico al óxido de magnesio
        pregunta: |
          Con los datos del enunciado, ¿cuál es la diferencia de
          electronegatividad en el MgO?
        respuesta:
          tipo: numero
          valor: '2.13'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '4.75'
            mensaje: |
              Has sumado. La diferencia que clasifica un enlace es una resta.
          - valor: '2.55'
            mensaje: |
              Esa es la del BaO, $3{,}44 - 0{,}89$. Los dos son iónicos y es
              fácil cruzarlos; fíjate en cuál te piden.
          - valor: '1.24'
            mensaje: |
              Esa es la del peróxido de hidrógeno, $3{,}44 - 2{,}20$. Es de
              las cinco la que marca la frontera: por debajo el enlace es
              covalente polar, y por eso el H₂O₂ es un sólido molecular
              aunque su diferencia no sea pequeña.
        pista: |
          Oxígeno 3,44 y magnesio 1,31.
        desarrollo: |
          $$
          3{,}44 - 1{,}31 = 2{,}13
          $$

          Una diferencia por encima de 2 es enlace iónico sin discusión. Para
          comparar, la del BaO es $3{,}44 - 0{,}89 = 2{,}55$ —también iónico— y
          la del Cl₂O es $3{,}44 - 3{,}16 = 0{,}28$, que es covalente casi
          apolar.

      - tipo: reconocer
        pregunta: |
          Entre los dos iónicos, ¿cuál funde a 2852 °C y por qué?
        opciones:
          - texto: El MgO, porque el Mg²⁺ es mucho menor que el Ba²⁺ y su energía reticular es mayor
            correcta: true
            mensaje: |
              Exacto. Las cargas empatan —2+ y 2− en los dos—, así que decide
              la distancia entre iones. El magnesio es del periodo 3 y el bario
              del 6: su catión es mucho más pequeño, los iones se acercan más y
              la red aguanta más.
          - texto: El BaO, porque el bario es más pesado y su red pesa más
            mensaje: |
              La masa no entra en la energía reticular. La ley de Coulomb solo
              lleva cargas y distancia, y el bario juega en contra por el
              segundo factor: su ion es grande.
          - texto: El MgO, porque el magnesio es más electronegativo que el bario
            mensaje: |
              Es cierto que lo es —1,31 frente a 0,89—, pero eso decide **si**
              el enlace es iónico, no cuánto aguanta la red. Una vez que los
              dos lo son, ordena la energía reticular.
          - texto: El BaO, porque el bario cede sus electrones con más facilidad
            mensaje: |
              Cederlos con facilidad no fortalece la red: lo que la fortalece
              es que los iones, una vez formados, se atraigan de cerca. Y el
              Ba²⁺ es grande, así que se atraen de lejos.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Las fórmulas son H₂O₂, BaO, MgO, Kr y Cl₂O.'
          - texto: 'MgO y BaO son iónicos —metal más no metal, con diferencias de electronegatividad de 2,13 y 2,55— y por eso ocupan las dos temperaturas altas.'
          - texto: 'Entre ellos, las cargas empatan a 2+ y 2−, así que decide el tamaño del catión: MgO a 2852 °C y BaO a 1923 °C.'
          - texto: 'Los otros tres son moleculares, y entre ellos el H₂O₂ es el único con enlace de hidrógeno, así que es el que más aguanta: −1 °C.'
          - texto: 'Quedan Kr y Cl₂O, los dos con solo dispersión o dipolo-dipolo; el Cl₂O es mayor y más polarizable, así que funde a −120 °C y el Kr a −157 °C.'
          - texto: 'El kriptón funde el más bajo porque es un gas noble y los gases nobles no forman enlaces.'
            trampa: true
            mensaje: |
              No formar enlaces **químicos** no es lo mismo que no tener
              fuerzas intermoleculares: si no las tuviera, el kriptón no
              solidificaría nunca a ninguna temperatura, y solidifica a
              −157 °C. Lo que tiene son fuerzas de dispersión, las más débiles
              de todas, y esa es la razón correcta.
    resolucion: |
      **Primero las fórmulas**, porque el enunciado también las pide y porque
      sin ellas no se puede clasificar nada.

      | nombre | fórmula |
      |---|---|
      | peróxido de hidrógeno | H₂O₂ |
      | óxido de bario | BaO |
      | óxido de magnesio | MgO |
      | kriptón | Kr |
      | anhídrido hipocloroso (dicloro monóxido) | Cl₂O |

      **La partición que ordena el problema.** Dos son iónicos y tres
      moleculares, y esa frontera vale casi tres mil grados. Se comprueba con
      las electronegatividades del enunciado:

      $$
      \mathrm{MgO}\!: 3{,}44 - 1{,}31 = 2{,}13 \qquad \mathrm{BaO}\!: 3{,}44 - 0{,}89 = 2{,}55
      $$

      Los dos muy por encima de 2, o sea iónicos. En cambio el Cl₂O tiene
      $3{,}44 - 3{,}16 = 0{,}28$ y el H₂O₂ tiene $3{,}44 - 2{,}20 = 1{,}24$:
      covalentes los dos, y el kriptón ni siquiera se enlaza.

      **Entre los dos iónicos** las cargas empatan a 2+ y 2−, así que la ley
      de Coulomb solo puede decidir por la distancia. El Mg²⁺ es del periodo 3
      y el Ba²⁺ del 6, así que el magnesio es mucho más pequeño, sus iones se
      acercan más y su energía reticular es mayor.

      **Entre los tres moleculares** manda la fuerza intermolecular:

      - **H₂O₂** tiene hidrógenos unidos a oxígeno, o sea **enlace de
        hidrógeno**, la más fuerte de las tres. Por eso funde tan cerca de
        cero, casi como el agua.
      - **Cl₂O** es una molécula angular y polar, así que tiene
        dipolo-dipolo más dispersión, y es la mayor y más polarizable de las
        que quedan.
      - **Kr** es un átomo suelto: solo dispersión, y de un átomo pequeño.
        Es el más débil de los cinco.

      **La tabla completa:**

      | T fusión (°C) | −157 | −120 | −1 | 1923 | 2852 |
      |---|---|---|---|---|---|
      | compuesto | Kr | Cl₂O | H₂O₂ | BaO | MgO |

      **Lo que este ejercicio evalúa de verdad** no es saberse cinco
      temperaturas: es aplicar dos criterios distintos en dos escalas
      distintas. Primero el tipo de sólido, que reparte los cinco en dos
      grupos separados por miles de grados; y solo después, dentro de cada
      grupo, la fuerza concreta — energía reticular en los iónicos, fuerza
      intermolecular en los moleculares. Mezclar las dos escalas es lo que
      lleva a ordenar por masa molecular y equivocarse.
  # ── El cuarto, 2,75 puntos, y es el mismo molde que el cloruro de vinilo
  #    del final de 2024-2025 subido de nivel: en vez de una hibridación hay
  #    TRES en la misma molécula —sp3, sp2 y sp—, una por cada carbono.
  - id: exfq2425-1c-control-4-el-acetilcianuro-y-tres-hibridaciones
    titulo: El acetilcianuro, con tres hibridaciones distintas en una sola molécula
    fuente: >-
      Ejercicio 4 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Analizar la molécula de acetilcianuro, CH3COCN (los átomos de carbono
      son los átomos centrales de la molécula y se enlazan entre ellos):

      **4.1.** Dibujar la estructura de Lewis (razonar la respuesta)

      **4.2.** Indicar los tipos de enlace (pi o sigma).

      **4.3.** Analizar la hibridación de los átomos centrales y estudiar la
      geometría. Razonar la respuesta.

      **4.4.** Indicar los ángulos de enlace y estudia la polaridad de la
      molécula indicando los momentos dipolares. Razonar la respuesta.

      **4.5.** Dibujar la molécula.

      **Datos:** Números atómicos (Z): H (1); C (6); N (7); O (8)
    pide: >-
      La estructura de Lewis, el recuento de enlaces sigma y pi, la
      hibridación y geometría de los tres carbonos, los ángulos y la
      polaridad.

    pasos:
      - tipo: calcular
        titulo: Los electrones de valencia
        pregunta: |
          ¿Cuántos electrones de valencia hay que repartir en la estructura de
          Lewis del CH₃COCN?
        respuesta:
          tipo: numero
          valor: '26'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '40'
            mensaje: |
              Has sumado los electrones **totales** de los ocho átomos. En
              Lewis solo entran los de la capa de valencia: cuatro por carbono,
              uno por hidrógeno, cinco del nitrógeno y seis del oxígeno.
          - valor: '22'
            mensaje: |
              Parece que has contado dos carbonos en vez de tres. La fórmula
              CH₃COCN tiene un carbono en el metilo, otro en el carbonilo y
              otro en el nitrilo.
          - valor: '48'
            mensaje: |
              Cuarenta y ocho son los electrones que **caben** —ocho por átomo
              pesado y dos por hidrógeno—, no los que hay. La diferencia entre
              las dos cifras dice cuántos pares se comparten.
        pista: |
          Tres carbonos a cuatro, tres hidrógenos a uno, un oxígeno a seis y
          un nitrógeno a cinco.
        desarrollo: |
          $$
          3 \times 4 + 3 \times 1 + 1 \times 6 + 1 \times 5 = 26
          $$

          Y como caben $5 \times 8 + 3 \times 2 = 46$, hay
          $46 - 26 = 20$ electrones compartidos, o sea **diez enlaces**
          contando los múltiples por separado. Con siete parejas de átomos
          vecinos, sobran tres: un doble y un triple.

      - tipo: reconocer
        pregunta: |
          Con el esqueleto CH₃–CO–CN, ¿dónde van el doble y el triple enlace?
        opciones:
          - texto: Doble entre el carbono central y el oxígeno, triple entre el último carbono y el nitrógeno
            correcta: true
            mensaje: |
              Eso es. El oxígeno completa octeto con un doble enlace y dos
              pares solitarios, y el nitrógeno con un triple y un par
              solitario. Es un grupo carbonilo pegado a un grupo nitrilo.
          - texto: Triple entre los dos primeros carbonos y doble con el oxígeno
            mensaje: |
              El carbono del metilo lleva tres hidrógenos, así que solo le
              queda un enlace libre: no puede formar un triple. Además el
              nitrógeno se quedaría sin completar octeto.
          - texto: Dos dobles, uno con el oxígeno y otro con el nitrógeno
            mensaje: |
              Con un doble al nitrógeno le faltaría un electrón para el octeto
              y le sobraría una carga formal. El nitrógeno terminal con un solo
              vecino forma triple, que es lo que define un nitrilo.
          - texto: Doble entre los dos últimos carbonos y triple con el nitrógeno
            mensaje: |
              Entonces el carbono del carbonilo tendría cinco enlaces —dos al
              carbono vecino, uno al metilo y los del oxígeno—, y el carbono
              nunca pasa de cuatro.

      - tipo: calcular
        titulo: Los enlaces sigma
        pregunta: |
          ¿Cuántos enlaces $\sigma$ tiene la molécula?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '10'
            mensaje: |
              Has contado todos los enlaces, los $\pi$ incluidos. Cada pareja
              de átomos unidos aporta **un solo** $\sigma$, por muy múltiple
              que sea el enlace; el resto son $\pi$.
          - valor: '4'
            mensaje: |
              Parece que has contado solo los enlaces entre átomos pesados y
              te has dejado los tres C–H, que también son $\sigma$.
          - valor: '3'
            mensaje: |
              Tres son los enlaces $\pi$: uno del doble C=O y dos del triple
              C≡N. Los $\sigma$ son los otros.
        pista: |
          Un $\sigma$ por cada pareja de átomos enlazados. Cuenta las parejas.
        desarrollo: |
          Las parejas de átomos unidos son tres C–H, dos C–C, un C–O y un C–N:

          $$
          3 + 2 + 1 + 1 = 7 \ \text{enlaces } \sigma
          $$

          Y los $\pi$ son tres: uno del C=O y dos del C≡N. En total diez
          enlaces, que es lo que salía del recuento de electrones.

      - tipo: reconocer
        pregunta: |
          ¿Qué hibridación tiene cada uno de los tres carbonos?
        opciones:
          - texto: $sp^{3}$ el del metilo, $sp^{2}$ el del carbonilo y $sp$ el del nitrilo
            correcta: true
            mensaje: |
              Exacto, y es lo que hace especial a esta molécula: tres
              hibridaciones distintas en ocho átomos. Se sacan contando
              direcciones — cuatro, tres y dos — sin mirar ninguna tabla.
          - texto: Los tres $sp^{2}$, porque hay enlaces múltiples en la molécula
            mensaje: |
              La hibridación es **de cada átomo**, no de la molécula. El
              carbono del metilo tiene cuatro cosas alrededor y ningún enlace
              múltiple: es $sp^{3}$.
          - texto: $sp^{3}$ el del metilo y $sp$ los otros dos
            mensaje: |
              El del carbonilo tiene tres direcciones —el metilo, el oxígeno y
              el otro carbono—, así que es $sp^{2}$. Solo el del nitrilo tiene
              dos.
          - texto: $sp$ el del metilo, $sp^{2}$ el del carbonilo y $sp^{3}$ el del nitrilo
            mensaje: |
              Está justo del revés. El número estérico crece con las
              direcciones que hay que acomodar, y el metilo es el que más
              tiene: tres hidrógenos y un carbono.

      - tipo: justificar
        pregunta: Ordena la respuesta sobre geometría y polaridad. Una pieza es falsa.
        piezas:
          - texto: 'El carbono del metilo tiene número estérico 4: hibridación sp³, geometría tetraédrica y ángulos de 109,5°.'
          - texto: 'El del carbonilo tiene número estérico 3 —el metilo, el oxígeno y el otro carbono—: sp², trigonal plana, 120°.'
          - texto: 'El del nitrilo tiene número estérico 2: sp, lineal, y el tramo C–C≡N mide 180°.'
          - texto: 'Los enlaces C=O y C≡N son muy polares, con los vectores apuntando al oxígeno y al nitrógeno.'
          - texto: 'La molécula no tiene ninguna simetría que los cancele, así que es polar.'
          - texto: 'Como la molécula tiene un tramo lineal, los dos dipolos grandes se oponen y se anulan.'
            trampa: true
            mensaje: |
              El tramo C–C≡N es lineal, sí, pero el C=O **no está sobre esa
              línea**: sale del carbono central formando 120° con ella. Dos
              vectores que no son colineales no pueden cancelarse por muy
              parecidos que sean sus módulos. Que haya un trozo lineal no hace
              lineal a la molécula entera.
    resolucion: |
      **4.1 · La estructura de Lewis.** Los electrones de valencia son

      $$
      3 \times 4 + 3 \times 1 + 6 + 5 = 26
      $$

      y caben $5 \times 8 + 3 \times 2 = 46$, así que se comparten
      $46 - 26 = 20$ electrones: diez enlaces. Con siete parejas de átomos
      vecinos, tres enlaces son «de más» — un doble y un triple.

      El esqueleto lo da el enunciado: los tres carbonos en el centro,
      enlazados entre sí. El metilo lleva sus tres hidrógenos; el carbono
      central lleva el oxígeno; el último lleva el nitrógeno. El doble va al
      oxígeno —que así completa octeto con dos pares solitarios— y el triple
      al nitrógeno, que lo completa con uno:

      $$
      \mathrm{CH_3 - C(=O) - C \equiv N}
      $$

      **4.2 · Sigma y pi.** Cada pareja de átomos unidos aporta un $\sigma$, y
      los enlaces múltiples añaden $\pi$ encima:

      $$
      7\ \sigma \qquad 3\ \pi
      $$

      Los siete $\sigma$ son tres C–H, dos C–C, uno C–O y uno C–N. Los tres
      $\pi$ son uno del C=O y dos del C≡N.

      **4.3 · Hibridación y geometría, carbono por carbono.** Se cuenta átomos
      unidos más pares solitarios, con los enlaces múltiples valiendo por uno:

      | carbono | direcciones | número estérico | hibridación | geometría |
      |---|---|---|---|---|
      | del metilo | 3 H + 1 C | 4 | $sp^{3}$ | tetraédrica |
      | del carbonilo | 1 C + 1 O + 1 C | 3 | $sp^{2}$ | trigonal plana |
      | del nitrilo | 1 C + 1 N | 2 | $sp$ | lineal |

      **Tres hibridaciones distintas en la misma molécula**, y ese es el salto
      de nivel respecto del cloruro de vinilo del examen final, donde los dos
      carbonos eran iguales. Aquí no se puede contestar «la molécula es $sp^{2}$»:
      hay que ir átomo por átomo.

      El oxígeno, con un enlace y dos pares solitarios, es $sp^{2}$; el
      nitrógeno, con un enlace y un par solitario, es $sp$.

      **4.4 · Ángulos y polaridad.**

      $$
      \mathrm{H-C-H} \approx 109{,}5° \qquad \text{alrededor del carbonilo} \approx 120° \qquad \mathrm{C-C \equiv N} = 180°
      $$

      Para la polaridad se dibuja un vector por enlace hacia el átomo más
      electronegativo. Los dos grandes son el **C=O** y el **C≡N**, los dos
      apuntando fuera del carbono. El C–H apenas cuenta.

      La clave es que esos dos vectores **no son colineales**: el tramo
      C–C≡N es lineal, pero el C=O sale del carbono central a unos 120° de
      él. Dos vectores a 120° no se cancelan, así que

      $$
      \vec{\mu}_{\text{total}} \neq \vec{0}
      $$

      **La molécula es polar**, con el momento dipolar resultante apuntando
      hacia el lado del oxígeno y el nitrógeno.

      **4.5 · El dibujo.** El apartado pide dibujarla y merece la pena hacerlo
      bien, porque es donde se ve si has entendido lo anterior: el metilo con
      sus hidrógenos saliendo en tetraedro, el carbono central con sus tres
      direcciones **en un plano**, y el tramo final recto. Una molécula
      dibujada toda plana o toda en zigzag contradice la respuesta del
      apartado 4.3.
