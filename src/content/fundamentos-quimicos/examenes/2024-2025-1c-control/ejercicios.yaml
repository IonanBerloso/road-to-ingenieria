          <svg viewBox="0 0 440 230" role="img" width="440" height="230" aria-labelledby="fqlw1-t fqlw1-d">
          <title id="fqlw1-t">La estructura de Lewis del acetilcianuro, CH₃COCN</title>
          <desc id="fqlw1-d">Los tres carbonos en cadena, de izquierda a derecha. El primero, el del metilo, lleva tres hidrógenos unidos por enlaces sencillos: uno a la izquierda, otro arriba y otro abajo. El del centro está unido al primero y al tercero por enlaces sencillos, y lleva encima un oxígeno unido por un enlace doble; el oxígeno conserva dos pares solitarios, uno a cada lado. El tercero está unido al nitrógeno por un enlace triple, y el nitrógeno conserva un par solitario en el extremo. Los carbonos y los hidrógenos no tienen pares solitarios. Debajo, el recuento: veintiséis electrones de valencia, veinte en los diez enlaces y seis en los tres pares solitarios.</desc>
