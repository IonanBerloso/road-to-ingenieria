        veredicto: |
          Con los diez enlaces y los tres pares solitarios, todo lo que viene
          después sale de contar sobre esta estructura. Y una cosa que este
          dibujo no dice: la forma. En Lewis los ángulos no significan nada; los
          da el apartado 4.3 y se dibujan en el 4.5.

      - tipo: calcular
        titulo: Los enlaces sigma
        pregunta: |
          ¿Cuántos enlaces $\sigma$ tiene la molécula?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '10'
            mensaje: |
              Has contado todos los enlaces, los $\pi$ incluidos. Cada pareja
              de átomos unidos aporta **un solo** $\sigma$, por muy múltiple
              que sea el enlace; el resto son $\pi$.
          - valor: '4'
            mensaje: |
              Parece que has contado solo los enlaces entre átomos pesados y
              te has dejado los tres C–H, que también son $\sigma$.
          - valor: '3'
            mensaje: |
              Tres son los enlaces $\pi$: uno del doble C=O y dos del triple
              C≡N. Los $\sigma$ son los otros.
        pista: |
          Un $\sigma$ por cada pareja de átomos enlazados. Cuenta las parejas.
        desarrollo: |
          Las parejas de átomos unidos son tres C–H, dos C–C, un C–O y un C–N:

          $$
          3 + 2 + 1 + 1 = 7 \ \text{enlaces } \sigma
          $$

          Y los $\pi$ son tres: uno del C=O y dos del C≡N. En total diez
          enlaces, que es lo que salía del recuento de electrones.

      - tipo: reconocer
        pregunta: |
          ¿Qué hibridación tiene cada uno de los tres carbonos?
        opciones:
          - texto: $sp^{3}$ el del metilo, $sp^{2}$ el del carbonilo y $sp$ el del nitrilo
            correcta: true
            mensaje: |
              Exacto, y es lo que hace especial a esta molécula: tres
              hibridaciones distintas en ocho átomos. Se sacan contando
              direcciones — cuatro, tres y dos — sin mirar ninguna tabla.
          - texto: Los tres $sp^{2}$, porque hay enlaces múltiples en la molécula
            mensaje: |
              La hibridación es **de cada átomo**, no de la molécula. El
              carbono del metilo tiene cuatro cosas alrededor y ningún enlace
              múltiple: es $sp^{3}$.
          - texto: $sp^{3}$ el del metilo y $sp$ los otros dos
            mensaje: |
              El del carbonilo tiene tres direcciones —el metilo, el oxígeno y
              el otro carbono—, así que es $sp^{2}$. Solo el del nitrilo tiene
              dos.
          - texto: $sp$ el del metilo, $sp^{2}$ el del carbonilo y $sp^{3}$ el del nitrilo
            mensaje: |
              Está justo del revés. El número estérico crece con las
              direcciones que hay que acomodar, y el metilo es el que más
              tiene: tres hidrógenos y un carbono.

      - tipo: justificar
        pregunta: Ordena la respuesta sobre geometría y polaridad. Una pieza es falsa.
        piezas:
          - texto: 'El carbono del metilo tiene número estérico 4: hibridación sp³, geometría tetraédrica y ángulos de 109,5°.'
          - texto: 'El del carbonilo tiene número estérico 3 —el metilo, el oxígeno y el otro carbono—: sp², trigonal plana, 120°.'
          - texto: 'El del nitrilo tiene número estérico 2: sp, lineal, y el tramo C–C≡N mide 180°.'
          - texto: 'Los enlaces C=O y C≡N son muy polares, con los vectores apuntando al oxígeno y al nitrógeno.'
          - texto: 'La molécula no tiene ninguna simetría que los cancele, así que es polar.'
          - texto: 'Como la molécula tiene un tramo lineal, los dos dipolos grandes se oponen y se anulan.'
            trampa: true
            mensaje: |
              El tramo C–C≡N es lineal, sí, pero el C=O **no está sobre esa
              línea**: sale del carbono central formando 120° con ella. Dos
              vectores que no son colineales no pueden cancelarse por muy
              parecidos que sean sus módulos. Que haya un trozo lineal no hace
              lineal a la molécula entera.

      - tipo: dibujar
        consigna: |
          **El apartado 4.5.** Dibuja la molécula con su forma de verdad: el
          metilo en tetraedro, con una cuña y una línea de trazos; el carbono
          central en un plano, y el tramo C–C≡N recto. Marca los tres ángulos y,
          ya que el 4.4 los pide, los dos momentos dipolares grandes.
        comprueba:
          - punto: |
              El metilo, tetraédrico: dos enlaces en el plano del papel, uno en
              cuña y otro a trazos, con ángulos de unos 109,5°.
            porque: |
              Es un carbono $sp^{3}$ con cuatro direcciones, y cuatro direcciones
              no caben en un plano. Dibujar los tres hidrógenos y el carbono
              vecino en cruz, a 90°, es dibujar una geometría que ese carbono no
              tiene.
          - punto: |
              El carbono central, trigonal plano: el metilo, el oxígeno y el otro
              carbono a 120°, en un mismo plano.
            porque: |
              Es $sp^{2}$, con tres direcciones, porque el doble enlace cuenta
              como una sola. Es lo que dice el apartado 4.3, y un dibujo que lo
              pone en tetraedro lo contradice.
          - punto: |
              El tramo C–C≡N en línea recta, a 180°.
            porque: |
              El carbono del nitrilo es $sp$, con dos direcciones opuestas. Un
              zigzag en ese tramo es el error que señala la resolución: una
              molécula dibujada toda plana o toda en zigzag contradice el 4.3.
          - punto: |
              Los pares solitarios en su sitio: dos en el oxígeno, abiertos hacia
              fuera, y uno en el nitrógeno, en la prolongación del eje.
            porque: |
              Ocupan dirección igual que un enlace. Los dos del oxígeno completan
              sus tres direcciones y el del nitrógeno, las dos de su recta.
          - punto: |
              Dos vectores grandes, uno hacia el oxígeno y otro hacia el
              nitrógeno, que no están en la misma línea.
            porque: |
              Es el razonamiento del 4.4 dibujado: el tramo C–C≡N es recto, pero
              el C=O sale del carbono central a 120° de él. Dos vectores que no
              son colineales no se anulan, y por eso la molécula es polar.
