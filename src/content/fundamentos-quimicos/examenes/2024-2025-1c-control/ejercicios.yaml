          <marker id="fqbh1a" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--alt)"/></marker>
          <marker id="fqbh1f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--flag)"/></marker>
          <marker id="fqbh1g" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--faint)"/></marker>
