        veredicto: |
          La prueba de que el dibujo sirve es que se lee al revés: mirándolo,
          cualquiera diría $sp^{3}$, $sp^{2}$ y $sp$ sin que se lo cuentes. Si
          hace falta leer tu 4.3 para entender el dibujo, al dibujo le falta
          algo.
    resolucion: |
      **4.1 · La estructura de Lewis.** Los electrones de valencia son

      $$
      3 \times 4 + 3 \times 1 + 6 + 5 = 26
      $$

      y caben $5 \times 8 + 3 \times 2 = 46$, así que se comparten
      $46 - 26 = 20$ electrones: diez enlaces. Con siete parejas de átomos
      vecinos, tres enlaces son «de más» — un doble y un triple.

      El esqueleto lo da el enunciado: los tres carbonos en el centro,
      enlazados entre sí. El metilo lleva sus tres hidrógenos; el carbono
      central lleva el oxígeno; el último lleva el nitrógeno. El doble va al
      oxígeno —que así completa octeto con dos pares solitarios— y el triple
      al nitrógeno, que lo completa con uno:

      $$
      \mathrm{CH_3 - C(=O) - C \equiv N}
      $$

      **4.2 · Sigma y pi.** Cada pareja de átomos unidos aporta un $\sigma$, y
      los enlaces múltiples añaden $\pi$ encima:

      $$
      7\ \sigma \qquad 3\ \pi
      $$

      Los siete $\sigma$ son tres C–H, dos C–C, uno C–O y uno C–N. Los tres
      $\pi$ son uno del C=O y dos del C≡N.

      **4.3 · Hibridación y geometría, carbono por carbono.** Se cuenta átomos
      unidos más pares solitarios, con los enlaces múltiples valiendo por uno:

      | carbono | direcciones | número estérico | hibridación | geometría |
      |---|---|---|---|---|
      | del metilo | 3 H + 1 C | 4 | $sp^{3}$ | tetraédrica |
      | del carbonilo | 1 C + 1 O + 1 C | 3 | $sp^{2}$ | trigonal plana |
      | del nitrilo | 1 C + 1 N | 2 | $sp$ | lineal |

      **Tres hibridaciones distintas en la misma molécula**, y ese es el salto
      de nivel respecto del cloruro de vinilo del examen final, donde los dos
      carbonos eran iguales. Aquí no se puede contestar «la molécula es $sp^{2}$»:
      hay que ir átomo por átomo.

      El oxígeno, con un enlace y dos pares solitarios, es $sp^{2}$; el
      nitrógeno, con un enlace y un par solitario, es $sp$.

      **4.4 · Ángulos y polaridad.**

      $$
      \mathrm{H-C-H} \approx 109{,}5° \qquad \text{alrededor del carbonilo} \approx 120° \qquad \mathrm{C-C \equiv N} = 180°
      $$

      Para la polaridad se dibuja un vector por enlace hacia el átomo más
      electronegativo. Los dos grandes son el **C=O** y el **C≡N**, los dos
      apuntando fuera del carbono. El C–H apenas cuenta.

      La clave es que esos dos vectores **no son colineales**: el tramo
      C–C≡N es lineal, pero el C=O sale del carbono central a unos 120° de
      él. Dos vectores a 120° no se cancelan, así que

      $$
      \vec{\mu}_{\text{total}} \neq \vec{0}
      $$

      **La molécula es polar**, con el momento dipolar resultante apuntando
      hacia el lado del oxígeno y el nitrógeno.

      **4.5 · El dibujo.** El apartado pide dibujarla y merece la pena hacerlo
      bien, porque es donde se ve si has entendido lo anterior: el metilo con
      sus hidrógenos saliendo en tetraedro, el carbono central con sus tres
      direcciones **en un plano**, y el tramo final recto. Una molécula
      dibujada toda plana o toda en zigzag contradice la respuesta del
      apartado 4.3.

  # ── El equivalente del control de 2024-2025, y el segundo ejercicio que
  #    pedía el lector de fórmulas. Con este, la asignatura queda transcrita
  #    entera: seis convocatorias, cero `fuera`.
  - id: exfq2425-1c-control-5-nombra-y-formula
    titulo: Diez compuestos más, con un plomo que admite dos nombres
    fuente: >-
      Ejercicio 5 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Nombra y formula los siguientes compuestos (responder directamente en
      esta hoja).

      | fórmula | nombre |
      |---|---|
      | HgH | Oxido de sodio |
      | HClO | Plomo(II) hidróxido / hidróxido plumboso |
      | Ba(NO3)2 | Acido carbónico |
      | Au(OH)3 | Sulfato férrico |
      | H2S | Iodo (molecular) |
    pide: El nombre de los cinco de la izquierda y la fórmula de los cinco de la derecha.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado escribe un compuesto con **dos nombres**: «Plomo(II)
          hidróxido / hidróxido plumboso». ¿Por qué?
        opciones:
          - texto: Porque las dos nomenclaturas son válidas y designan el mismo compuesto
            correcta: true
            mensaje: |
              Eso es. La de stock pone la valencia en números romanos y la
              tradicional la codifica en el sufijo —**-oso** para la menor y
              **-ico** para la mayor—. El plomo actúa con 2 y con 4, así que
              plumboso es plomo(II).
          - texto: Porque son dos compuestos distintos que hay que formular por separado
            mensaje: |
              Es uno solo. La barra separa dos formas de nombrarlo, no dos
              sustancias: las dos dan Pb(OH)₂.
          - texto: Porque el profesor no está seguro de cuál es el correcto
            mensaje: |
              Los dos lo son. Que el enunciado ponga las dos es una ayuda, no
              una duda: te está diciendo que reconozcas la equivalencia entre
              nomenclaturas.
          - texto: Porque el plomo(II) y el plumboso tienen distinta fórmula
            mensaje: |
              Tienen la misma. «Plumboso» significa exactamente «plomo con su
              valencia menor», que es 2, así que las dos expresiones son
              intercambiables.

      - tipo: calcular
        titulo: El hidróxido plumboso
        pregunta: |
          Escribe la fórmula del hidróxido de plomo(II).
        respuesta:
          tipo: formula
          valor: Pb(OH)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: PbOH
            mensaje: |
              Falta el segundo hidroxilo. El (II) dice que el plomo actúa con
              carga 2+, así que necesita dos OH⁻ para neutralizarse.
          - valor: Pb(OH)4
            mensaje: |
              Ese es el hidróxido de plomo(IV), o plúmbico. El sufijo **-oso**
              y el (II) apuntan a la valencia **menor** de las dos que tiene
              el plomo.
          - valor: Pb2OH
            mensaje: |
              Tienes el subíndice en el ion equivocado. El 2 va al hidroxilo,
              porque es la carga del plomo la que dice cuántos hacen falta.
        pista: |
          El (II) es la carga del plomo. El hidroxilo es OH⁻.
        desarrollo: |
          $$
          \mathrm{Pb^{2+}} + 2\,\mathrm{OH^-} \;\longrightarrow\; \mathrm{Pb(OH)_2}
          $$

      - tipo: calcular
        titulo: El sulfato férrico
        pregunta: |
          Escribe la fórmula del sulfato férrico.
        respuesta:
          tipo: formula
          valor: Fe2(SO4)3
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: FeSO4
            mensaje: |
              Ese es el sulfato **ferroso**, con el hierro en valencia 2. El
              sufijo **-ico** apunta a la valencia mayor, que en el hierro es
              3.
          - valor: Fe3(SO4)2
            mensaje: |
              Tienes los subíndices cruzados al revés. El 3 es la carga del
              hierro y pasa al sulfato; el 2 es la carga del sulfato y pasa al
              hierro.
          - valor: Fe2(SO3)3
            mensaje: |
              Los subíndices están bien pero el anión no: eso es sulfito. El
              sulfato lleva cuatro oxígenos.
        pista: |
          Férrico es hierro(III), o sea Fe³⁺, y el sulfato es SO₄²⁻. Cruza las
          cargas.
        desarrollo: |
          $$
          2\,\mathrm{Fe^{3+}} + 3\,\mathrm{SO_4^{2-}} \;\longrightarrow\; \mathrm{Fe_2(SO_4)_3}
          $$

          Comprobación rápida: $2 \times 3 = 6$ cargas positivas y
          $3 \times 2 = 6$ negativas. Cuadra.

      - tipo: justificar
        pregunta: Ordena el argumento sobre las dos nomenclaturas. Una pieza es falsa.
        piezas:
          - texto: 'Muchos metales actúan con más de una valencia, así que el nombre tiene que decir con cuál.'
          - texto: 'La nomenclatura de stock lo pone explícito en números romanos entre paréntesis: hierro(III), plomo(II).'
          - texto: 'La tradicional lo codifica en el sufijo: -oso para la valencia menor y -ico para la mayor.'
          - texto: 'Por eso férrico es hierro(III) y ferroso es hierro(II), y plumboso es plomo(II) y plúmbico es plomo(IV).'
          - texto: 'Las dos formas designan el mismo compuesto y las dos son válidas en el examen.'
          - texto: 'El sufijo -ico indica siempre valencia 3, y el -oso siempre valencia 2.'
            trampa: true
            mensaje: |
              Los sufijos son **relativos**, no absolutos: dicen «la mayor de
              las suyas» y «la menor de las suyas», y cada metal tiene las
              suyas. En el hierro son 2 y 3, así que férrico es 3; en el plomo
              son 2 y 4, así que plúmbico es 4 y no 3. Aprenderlos como
              números fijos falla en cuanto cambia el metal.
    resolucion: |
      **Las diez respuestas.**

      | fórmula | nombre |
      |---|---|
      | HgH | hidruro de mercurio(I) · hidruro mercurioso |
      | HClO | ácido hipocloroso |
      | Ba(NO₃)₂ | nitrato de bario |
      | Au(OH)₃ | hidróxido de oro(III) · hidróxido áurico |
      | H₂S | sulfuro de hidrógeno · ácido sulfhídrico en disolución |
      | Na₂O | óxido de sodio |
      | Pb(OH)₂ | hidróxido de plomo(II) · hidróxido plumboso |
      | H₂CO₃ | ácido carbónico |
      | Fe₂(SO₄)₃ | sulfato férrico |
      | I₂ | yodo molecular |

      **Las dos nomenclaturas, que es lo que este ejercicio comprueba.** Casi
      todos los metales de la lista actúan con más de una valencia, y el nombre
      tiene que decir con cuál:

      | | stock | tradicional |
      |---|---|---|
      | valencia menor | (II), (I)… | **-oso** |
      | valencia mayor | (III), (IV)… | **-ico** |

      Y son **relativas al metal**. Férrico es hierro(III) porque el hierro
      tiene 2 y 3; plúmbico es plomo(IV) porque el plomo tiene 2 y 4. Tomar
      «-ico» por «siempre 3» funciona con el hierro y falla con el plomo, que
      es exactamente el par que el enunciado pone junto.

      **Los tres sitios donde se pierden puntos aquí.**

      El **yodo molecular** es I₂, no I. El enunciado añade «(molecular)» para
      dejarlo claro, y aun así se contesta con el átomo suelto. Siete elementos
      son diatómicos en su estado natural —H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂— y
      escribirlos sueltos es escribir otra cosa.

      El **ácido hipocloroso** frente al cloroso, clórico y perclórico. El cloro
      forma cuatro oxoácidos y los prefijos ordenan los oxígenos: hipo- el que
      menos (HClO), luego -oso (HClO₂), luego -ico (HClO₃) y per- el que más
      (HClO₄). El del enunciado tiene un solo oxígeno, así que es el primero.

      Y el **H₂S**, que se llama de dos formas según dónde esté: sulfuro de
      hidrógeno como gas, ácido sulfhídrico en disolución acuosa. Es el mismo
      caso que el HBr del otro control, y las dos veces conviene decir cuál se
      está usando.
