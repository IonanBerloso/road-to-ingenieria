ejercicios:
  # ── El primero del control, y otra vez una tabla: es el tercer enunciado de
  #    los seis del corpus que examina el tema 2 así. La vuelta de tuerca de
  #    este es que da los datos AL REVÉS —el grupo y el periodo, no la Z— en
  #    tres de las cinco filas, y que el 1.5 obliga a distinguir dos elementos
  #    cuyas primeras energías de ionización se diferencian en 2 kJ/mol.
  - id: exfq2425-1c-control-1-cinco-elementos-del-periodo-cinco
    titulo: Cinco elementos del periodo 5, y dos que solo se distinguen por la segunda ionización
    fuente: >-
      Ejercicio 1 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      **1.1.** Completar la tabla (responder directamente en esta hoja).

      | Elemento | Configuración electrónica | Grupo | Periodo |
      |---|---|---|---|
      | A | | 1A | 5 |
      | ₃₉B | | | |
      | ₄₇C | | | |
      | D | | 2B (12) | 5 |
      | E | | 6A | 5 |

      **1.2.** Calcular la carga nuclear efectiva del electrón más externo de
      los elementos A y B.

      **1.3.** Entre los elementos A y B, ¿cuál tendrá el mayo radio atómico?
      Razonar la respuesta.

      **1.4.** Iones más probables de los elementos A, B y E y su
      correspondiente configuración electrónica. Razonar la respuesta.

      **1.5.** En la siguiente tabla se muestran las energías de ionización de
      los elementos A, C, D y E. Indicar cuales se corresponden con cada
      elemento. Justificar la respuesta empleando los datos de 1 y 2 energía
      de ionización.

      | 1.ª E. I. (kJ/mol) | 2.ª E. I. (kJ/mol) |
      |---|---|
      | 867 | 1631 |
      | 403 | 2633 |
      | 731 | 2070 |
      | 869 | 1790 |

      **1.6.** Indicar los números cuánticos del electrón diferenciador del
      elemento B.
    pide: >-
      La tabla de los cinco elementos, las dos cargas efectivas, el radio, los
      iones probables, el reparto de las energías de ionización y los números
      cuánticos del diferenciador de B.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tres filas dan grupo y periodo en vez del número atómico. ¿Cómo se
          identifica el elemento A, del grupo 1A y periodo 5?
        opciones:
          - texto: Contando desde el gas noble anterior; su configuración termina en $5s^{1}$
            correcta: true
            mensaje: |
              Eso es. Periodo 5 significa que el nivel más alto es el 5, y
              grupo 1A significa un solo electrón en él: $\ldots 5s^{1}$.
              Rellenando por debajo hasta el kriptón sale $Z = 37$, el rubidio.
          - texto: No se puede; hace falta el número atómico
            mensaje: |
              El grupo y el periodo determinan la configuración por completo, y
              la configuración determina $Z$. De hecho es la misma información
              con otra cara, y por eso el examen mezcla las dos formas de
              darla.
          - texto: Es el litio, porque es el primer elemento del grupo 1A
            mensaje: |
              El litio es del periodo 2. El grupo dice la columna y el periodo
              la fila; hacen falta los dos.
          - texto: Buscando el elemento cuya masa atómica sea 5
            mensaje: |
              El periodo no es la masa ni el número atómico: es la fila de la
              tabla, y coincide con el valor de $n$ más alto de la
              configuración.

      - tipo: calcular
        titulo: La carga efectiva del elemento A
        pregunta: |
          El elemento A tiene $Z = 37$ y su electrón más externo es un $5s$.
          ¿Cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '2.20'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Es la cuenta ingenua, $37 - 36$. Trata los 36 electrones
              internos como si taparan del todo, y los ocho de la capa 4 solo
              tapan $0{,}85$.
          - valor: '2.55'
            mensaje: |
              Te has contado a ti mismo. En $(5s^{1})$ solo hay un electrón, el
              que miramos, así que no tiene compañeros de grupo.
          - valor: '4.20'
            mensaje: |
              Parece que has dejado los diez electrones $3d$ fuera de la
              cuenta. Están en la capa 3, con peso $1{,}00$, y sí entran.
        pista: |
          Agrupa como $\ldots(3d^{10})(4s^{2}4p^{6})(5s^{1})$. Ningún
          compañero, ocho en la capa 4, veintiocho más adentro.
        desarrollo: |
          $$
          S = 0 \times 0{,}35 + 8 \times 0{,}85 + 28 \times 1{,}00 = 34{,}80
          $$

          $$
          Z_{\text{ef}} = 37 - 34{,}80 = 2{,}20
          $$

          Es el mismo $2{,}20$ que el sodio, y no es casualidad: los dos son
          alcalinos con un solo electrón de valencia, ocho debajo y el resto
          apantallando entero.

      - tipo: calcular
        titulo: La carga efectiva del elemento B
        pregunta: |
          El elemento B tiene $Z = 39$ y su configuración ordenada termina en
          $4d^{1}5s^{2}$. Para su electrón **más externo**, ¿cuánto vale
          $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '3.00'
          tolerancia: 0.02
          formato: un número, con dos decimales
        distractores:
          - valor: '2.85'
            mensaje: |
              Has olvidado el electrón $4d^{1}$ al contar la capa 4. Esa capa
              tiene nueve electrones en el itrio —$4s^{2}4p^{6}4d^{1}$—, no
              ocho.
          - valor: '3.35'
            mensaje: |
              Te has contado a ti mismo. En $(5s^{2})$ hay dos electrones, así
              que el que miramos tiene **un** compañero.
          - valor: '11.65'
            mensaje: |
              Parece que has calculado la carga efectiva del electrón $4d$, que
              es el **diferenciador**, no el más externo. El apartado 1.2 pide
              el más externo; el diferenciador se pide en el 1.6.
        pista: |
          Un compañero en el grupo $5s$, nueve electrones en la capa 4 y
          veintiocho más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 9 \times 0{,}85 + 28 \times 1{,}00 = 36{,}00
          $$

          $$
          Z_{\text{ef}} = 39 - 36{,}00 = 3{,}00
          $$

      - tipo: reconocer
        pregunta: |
          Apartado 1.5. Las dos primeras energías de ionización más parecidas
          son 867 y 869 kJ/mol, y son las de D (cadmio) y E (teluro). ¿Cómo se
          decide cuál es cuál?
        opciones:
          - texto: Por la segunda, porque el ion Cd⁺ queda como $4d^{10}5s^{1}$ y le cuesta poco perder el que le sobra
            correcta: true
            mensaje: |
              Exacto, y por eso el enunciado dice «empleando los datos de 1 y
              2 energía de ionización». Al cadmio, quitarle el segundo
              electrón lo deja en $4d^{10}$, una subcapa completa: sale barato,
              1631. Al teluro hay que sacarlo de un $5p$ y cuesta 1790.
          - texto: Por la primera, porque 869 es mayor que 867 y el teluro está más a la derecha
            mensaje: |
              Dos kilojulios de diferencia sobre casi novecientos es ruido: no
              se puede sostener un razonamiento sobre eso, y por eso el
              enunciado pide usar **las dos** columnas. La segunda los separa
              por 159.
          - texto: Por el radio atómico, que es menor en el teluro
            mensaje: |
              El radio no está en la tabla del enunciado y además no
              distinguiría: los dos son del periodo 5. Lo que hay que usar es
              lo que el examen da.
          - texto: No se puede decidir; hay que dejar las dos posibilidades abiertas
            mensaje: |
              Sí se puede, y con seguridad. La segunda energía de ionización
              separa 1631 de 1790, que no es ruido, y la explicación es de
              configuración electrónica.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 1.5. Una pieza es falsa.
        piezas:
          - texto: 'Los cuatro elementos son A = rubidio, C = plata, D = cadmio y E = teluro, todos del periodo 5.'
          - texto: 'El rubidio es alcalino: le cuesta poquísimo el primero, 403, y al quedar como gas noble el segundo se dispara a 2633. Es el par más fácil de asignar.'
          - texto: 'A la plata, con 731, el segundo le cuesta 2070 porque Ag⁺ es 4d¹⁰, una subcapa completa que hay que romper.'
          - texto: 'Cadmio y teluro empatan casi en el primero, 867 y 869, y los separa el segundo: 1631 el cadmio, porque Cd⁺ pierde su 5s sobrante y queda en 4d¹⁰, y 1790 el teluro.'
          - texto: 'El orden de las segundas energías, 2633 > 2070 > 1790 > 1631, mide lo estable que es cada ion +1.'
          - texto: 'El rubidio tiene la segunda energía más alta porque es el elemento más pesado de los cuatro.'
            trampa: true
            mensaje: |
              El teluro tiene 52 protones y el rubidio 37, así que el rubidio
              no es el más pesado. Lo que dispara su segunda ionización es que
              Rb⁺ ya tiene configuración de gas noble, y arrancarle otro
              electrón significa romper una capa completa. El peso no tiene
              nada que ver.
    resolucion: |
      **1.1 · La tabla.** Tres filas dan la Z y dos dan grupo y periodo; en
      los dos casos se llega a lo mismo, porque grupo y periodo determinan la
      configuración por completo.

      | | Z | configuración ordenada | grupo | periodo |
      |---|---|---|---|---|
      | A · Rb | 37 | $[\mathrm{Kr}]\,5s^{1}$ | 1A | 5 |
      | B · Y | 39 | $[\mathrm{Kr}]\,4d^{1}5s^{2}$ | 3B | 5 |
      | C · Ag | 47 | $[\mathrm{Kr}]\,4d^{10}5s^{1}$ | 1B | 5 |
      | D · Cd | 48 | $[\mathrm{Kr}]\,4d^{10}5s^{2}$ | 2B | 5 |
      | E · Te | 52 | $[\mathrm{Kr}]\,4d^{10}5s^{2}5p^{4}$ | 6A | 5 |

      Los cinco son del periodo 5, que es lo que hace comparable todo lo que
      viene después: $n$ no distingue nada y siempre decide la carga efectiva
      o la configuración del ion.

      **1.2 · Las dos cargas efectivas.**

      $$
      S_{\mathrm{Rb}} = 8 \times 0{,}85 + 28 \times 1{,}00 = 34{,}80 \quad\Longrightarrow\quad Z_{\text{ef}} = 37 - 34{,}80 = 2{,}20
      $$

      $$
      S_{\mathrm{Y}} = 1 \times 0{,}35 + 9 \times 0{,}85 + 28 \times 1{,}00 = 36{,}00 \quad\Longrightarrow\quad Z_{\text{ef}} = 39 - 36{,}00 = 3{,}00
      $$

      Ojo al detalle del itrio: su capa 4 tiene **nueve** electrones, porque
      el $4d^{1}$ cuenta ahí. Contar ocho es el fallo típico.

      **1.3 · El radio.** Los dos son del periodo 5, así que $n$ empata y
      decide $Z_{\text{ef}}$: $2{,}20$ frente a $3{,}00$. **El rubidio tiene
      el radio mayor**, porque sujeta su electrón de valencia con menos fuerza.

      **1.4 · Los iones más probables.** Cada uno busca el gas noble más
      cercano.

      | | ion | configuración | por qué |
      |---|---|---|---|
      | Rb | Rb⁺ | $[\mathrm{Kr}]$ | cede su único $5s$ |
      | Y | Y³⁺ | $[\mathrm{Kr}]$ | cede los dos $5s$ y el $4d$ |
      | Te | Te²⁻ | $[\mathrm{Xe}]$ | gana dos y completa el $5p$ |

      **1.5 · Las energías de ionización.** El enunciado pide justificarlo con
      **las dos columnas**, y no es una formalidad: sin la segunda no se
      pueden separar el cadmio y el teluro.

      | elemento | 1.ª EI | 2.ª EI | por qué |
      |---|---|---|---|
      | Rb | 403 | 2633 | alcalino: el primero sale casi solo, y el segundo rompe el gas noble |
      | Ag | 731 | 2070 | Ag⁺ es $4d^{10}$, subcapa completa que hay que romper |
      | Cd | 867 | 1631 | Cd⁺ es $4d^{10}5s^{1}$; perder el $5s$ que sobra sale barato |
      | Te | 869 | 1790 | Te⁺ pierde un $5p$, sin ninguna capa completa que romper |

      **El razonamiento en una frase:** las segundas energías ordenan lo
      **estable que es cada ion +1**. Rb⁺ es un gas noble y no suelta nada más
      sin pagar caro; Ag⁺ tiene la $d$ completa; Cd⁺ está a un electrón de
      tenerla; y Te⁺ es el más flojo de los cuatro.

      Fíjate en lo que **no** sirve: las primeras energías del cadmio y el
      teluro se llevan dos kilojulios, un 0,2 %. Construir la asignación sobre
      esa diferencia sería inventarse una precisión que el dato no tiene.

      **1.6 · Los números cuánticos del diferenciador de B.** El itrio termina
      su llenado en el $4d^{1}$ —el $5s$ se llena antes—, así que el electrón
      diferenciador es ese:

      $$
      (n,\ \ell,\ m_\ell,\ m_s) = (4,\ 2,\ -2,\ +1/2)
      $$

      El $m_\ell = -2$ sale de la regla de Hund con el convenio de empezar a
      llenar por el valor más bajo, y el $+1/2$ de que es el primer electrón
      de la subcapa. Y conviene notar que **este electrón no es el mismo del
      apartado 1.2**: allí se pedía el más externo, que es un $5s$.

  # ── El segundo, y es el único ejercicio de todo el corpus que pide el
  #    ciclo de Born-Haber. No trae ni un número: se puntúa escribir las
  #    reacciones y el balance. La trampa está en el yodo, que es SÓLIDO en
  #    condiciones estándar, así que el ciclo lleva un escalón que el del
  #    cloruro de sodio de los apuntes no tiene.
  - id: exfq2425-1c-control-2-el-born-haber-del-yoduro-de-bario
    titulo: El ciclo del yoduro de bario, y el escalón que el del NaCl no tiene
    fuente: >-
      Ejercicio 2 · Control del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Ciclo de Born Haber del yoduro de bario. Explicar las energías que
      forman parte del ciclo (indicando las reacciones) y el balance de
      energía.
    pide: Las reacciones de cada escalón del ciclo y el balance que despeja la energía reticular.

    pasos:
      - tipo: reconocer
        pregunta: |
          El ciclo empieza en los elementos en su estado estándar. ¿En qué
          estado está el yodo?
        opciones:
          - texto: Sólido, así que antes de disociarlo hay que sublimarlo
            correcta: true
            mensaje: |
              Ese es el escalón que el ciclo del NaCl no tiene y este sí. El
              yodo es el único sólido de los cuatro halógenos habituales, así que
              el camino largo lleva **sublimación del I₂** antes de la
              disociación.
          - texto: Gas, como el cloro
            mensaje: |
              El cloro y el flúor son gases, el bromo es líquido y el yodo es
              **sólido**. Copiar el ciclo del NaCl aquí deja fuera un escalón
              entero y el balance sale mal.
          - texto: Líquido, como el bromo
            mensaje: |
              El líquido es el bromo. El yodo forma esos cristales grises que
              subliman al calentarlos — de hecho es el ejemplo clásico de
              sublimación.
          - texto: Da igual, porque el estado no entra en el ciclo
            mensaje: |
              Entra de lleno: el ciclo parte de los elementos **en su estado
              estándar**, y llevar el yodo de sólido a átomos gaseosos cuesta
              dos pasos en vez de uno.

      - tipo: calcular
        titulo: Cuántas ionizaciones hacen falta
        pregunta: |
          Para formar un mol de BaI₂ a partir de los elementos, ¿cuántas
          energías de ionización del bario entran en el ciclo?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Una bastaría para un catión 1+. El bario es del grupo 2 y forma
              Ba²⁺, así que hay que arrancarle **dos** electrones y sumar la
              primera y la segunda energía de ionización.
          - valor: '3'
            mensaje: |
              Tres serían para un catión 3+. La fórmula BaI₂ ya lo dice: dos
              yoduros con carga 1− cada uno piden un catión 2+.
        pista: |
          Mira la fórmula. Dos yoduros de carga 1− exigen un catión de carga…
        desarrollo: |
          La fórmula BaI₂ obliga a un catión 2+, así que:

          $$
          \mathrm{Ba\,(g)} \rightarrow \mathrm{Ba^{+}\,(g)} + e^{-} \qquad (EI_1)
          $$

          $$
          \mathrm{Ba^{+}\,(g)} \rightarrow \mathrm{Ba^{2+}\,(g)} + e^{-} \qquad (EI_2)
          $$

          Y por el otro lado, dos afinidades electrónicas, una por cada yodo.

      - tipo: reconocer
        pregunta: |
          ¿Cuál de estos escalones **libera** energía en vez de consumirla?
        opciones:
          - texto: La afinidad electrónica del yodo y la energía reticular
            correcta: true
            mensaje: |
              Las dos, y por motivos distintos. El yodo gana un electrón y se
              acerca a la configuración de gas noble, así que su afinidad es
              negativa. Y juntar iones de signo contrario en un cristal libera
              muchísimo: es el escalón grande del ciclo.
          - texto: Solo la energía reticular
            mensaje: |
              También la afinidad electrónica. Casi todos los halógenos tienen
              afinidad negativa —ganar un electrón les viene bien— y el yodo
              no es excepción.
          - texto: La sublimación del bario y la del yodo
            mensaje: |
              Sublimar cuesta energía siempre: hay que romper las fuerzas que
              mantienen unido el sólido. Los dos escalones de sublimación son
              endotérmicos.
          - texto: Las dos energías de ionización
            mensaje: |
              Arrancar un electrón cuesta **siempre**: es la definición de
              energía de ionización, y por eso es positiva. La segunda además
              cuesta más que la primera.

      - tipo: dibujar
        consigna: |
          **El ciclo, dibujado.** Antes de explicar nada, dibuja el ciclo de
          Born-Haber del BaI₂: el punto de partida con los elementos en su estado
          estándar, cada escalón con sus especies y sus estados, el camino corto
          de la formación y la flecha de la energía reticular.
        comprueba:
          - punto: |
              Arriba, Ba (s) + I₂ (s): el yodo, sólido.
            porque: |
              El ciclo parte de los elementos en su estado estándar, y el yodo es
              el único sólido de los cuatro halógenos habituales (F, Cl, Br, I). Escribir I₂ (g) de
              salida es copiar el ciclo del NaCl, y el escalón que se pierde es
              justo el que el examen quiere ver.
          - punto: |
              Tres escalones hasta los átomos gaseosos: sublimar el bario,
              sublimar el yodo y disociar el I₂ en dos átomos.
            porque: |
              Sublimar y disociar son dos procesos distintos: el primero separa
              las moléculas de I₂ y el segundo rompe el enlace dentro de cada
              una. Juntarlos en una sola flecha deja fuera la entalpía de
              sublimación del yodo.
          - punto: |
              Dos ionizaciones del bario, $EI_1$ y $EI_2$, y dos afinidades
              electrónicas, una por cada átomo de yodo.
            porque: |
              La fórmula BaI₂ pide un Ba²⁺ y dos I⁻. Una sola ionización valdría
              para un catión 1+, y una sola afinidad, para un solo anión.
          - punto: |
              La última flecha, de Ba²⁺ (g) + 2 I⁻ (g) a BaI₂ (s), señalada como
              la incógnita: la energía reticular.
            porque: |
              Es lo único del ciclo que no se puede medir, y el ciclo existe para
              despejarla. Si no la señalas, el dibujo no dice qué se está
              calculando.
          - punto: |
              El camino corto, de los elementos al BaI₂ (s) directamente: la
              entalpía de formación.
            porque: |
              Es el escalón que se mide en un calorímetro y el que cierra el
              ciclo. Sin él no hay dos caminos que igualar, y no hay balance.
          - punto: |
              Cada escalón con su signo: consumen los que separan y liberan los
              que juntan.
            porque: |
              Sublimar, disociar e ionizar consumen; ganar un electrón y formar
              el cristal liberan. Es lo que permite comprobar el balance: si tu
              $\Delta H_{\text{red}}$ sale positiva, se ha perdido un signo por el
              camino.
        figura: |
          <figure>
          <svg viewBox="0 0 470 362" role="img" width="470" height="362" aria-labelledby="fqbh1-t fqbh1-d">
          <title id="fqbh1-t">El ciclo de Born-Haber del yoduro de bario</title>
          <desc id="fqbh1-d">Desde bario sólido y yodo sólido hay dos caminos hasta el yoduro de bario sólido. El camino corto, a trazos por la derecha, es la entalpía de formación, que se mide directamente en un calorímetro. El camino largo baja escalón a escalón por la izquierda: sublimar el bario; sublimar el yodo, porque es sólido, que es el escalón que el ciclo del cloruro de sodio no tiene y va destacado; disociar el yodo gaseoso en dos átomos; arrancar dos electrones al bario, la primera y la segunda energía de ionización; dar un electrón a cada uno de los dos átomos de yodo, dos veces la afinidad electrónica; y juntar los iones gaseosos en el cristal, que es la energía reticular, la incógnita, también destacada. Los cuatro primeros escalones consumen energía y los dos últimos la liberan. Como la entalpía es función de estado, los dos caminos suman lo mismo.</desc>
