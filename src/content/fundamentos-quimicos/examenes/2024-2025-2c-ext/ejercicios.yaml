        veredicto: |
          Si has puesto platino en el lado del yodo, y en el del cobre no, has
          entendido para qué sirve un electrodo inerte: hace falta donde el par
          no tiene metal, y solo ahí.

      - tipo: reconocer
        pregunta: |
          Para aplicar Nernst al par I₂ (s)/I⁻, ¿qué se pone en el cociente
          por el yodo sólido?
        opciones:
          - texto: Nada; un sólido puro tiene actividad 1 y no aparece
            correcta: true
            mensaje: |
              Igual que en las constantes de equilibrio. Y aquí importa
              especialmente, porque el enunciado dice «la concentración de la
              especie de mayor estado de oxidación es 10⁻⁵ M» y en este par esa
              especie es un sólido: la frase no se le puede aplicar.
          - texto: $10^{-5}$ M, como dice el enunciado para la especie más oxidada
            mensaje: |
              El enunciado da una regla general, pero un sólido no tiene
              concentración: su actividad es 1 haya el trozo que haya. Aplicar
              el $10^{-5}$ aquí cambia el resultado en 0,148 V.
          - texto: Su masa molar
            mensaje: |
              En el cociente de Nernst van actividades, no masas. Para un
              sólido puro la actividad es 1.
          - texto: Cero, porque no está disuelto
            mensaje: |
              Cero haría infinito el logaritmo. La actividad de un sólido puro
              es **uno**, no cero: está presente y participa, pero su
              «concentración» no cambia.

      - tipo: calcular
        titulo: El potencial del electrodo de yodo
        pregunta: |
          Con $[\mathrm{I^-}] = 10^{-2}$ M y el yodo sólido, ¿cuánto vale $E$
          del par I₂/I⁻, en voltios?
        respuesta:
          tipo: numero
          valor: '0.658'
          tolerancia: 0.005
          formato: un número, con tres decimales, en voltios
        distractores:
          - valor: '0.422'
            mensaje: |
              Signo cambiado en el término de Nernst. Con el yoduro tan
              diluido, la reducción está **favorecida** —hay poco producto—,
              así que el potencial tiene que subir por encima de $0{,}54$.
          - valor: '0.540'
            mensaje: |
              Ese es el potencial estándar, sin corregir. El apartado 4.2 pide
              precisamente el efecto de las concentraciones.
          - valor: '0.777'
            mensaje: |
              Has usado $n = 1$. En la semirreacción
              $\mathrm{I_2} + 2e^{-} \rightarrow 2\,\mathrm{I^{-}}$ se
              intercambian **dos** electrones.
        pista: |
          $E = E^{0} - \dfrac{0{,}0592}{n}\log\dfrac{[\mathrm{I^-}]^{2}}{1}$,
          con $n = 2$.
        desarrollo: |
          $$
          E = 0{,}54 - \frac{0{,}0592}{2}\log\left(10^{-2}\right)^{2} = 0{,}54 - 0{,}0296 \times (-4)
          $$

          $$
          E = 0{,}54 + 0{,}118 = 0{,}658\ \mathrm{V}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 4.2. Una pieza es falsa.
        piezas:
          - texto: 'Corrigiendo los tres con Nernst: I₂/I⁻ sube a 0,658 V, Cu⁺/Cu baja a 0,224 V y Cu²⁺/Cu baja a 0,192 V.'
          - texto: 'Los dos del cobre bajan porque su especie oxidada está muy diluida, 10⁻⁵ M, y eso desfavorece la reducción.'
          - texto: 'El del yodo sube porque el que está diluido es el yoduro, que es el producto de la reducción.'
          - texto: 'El orden se mantiene, así que la mejor pila sigue siendo la misma: cátodo de yodo y ánodo de cobre a Cu²⁺.'
          - texto: 'Y sale más espontánea que antes: 0,658 − 0,192 = 0,466 V, frente a los 0,20 V estándar.'
          - texto: 'Como las tres concentraciones cambian a la vez, los tres potenciales se mueven en el mismo sentido y la pila no cambia.'
            trampa: true
            mensaje: |
              No se mueven en el mismo sentido: dos bajan y uno **sube**. Lo
              que decide el sentido no es que la concentración cambie sino
              **de qué lado de la semirreacción** está la especie diluida. En
              los cobres se diluye el reactivo de la reducción y el potencial
              cae; en el yodo se diluye el producto y sube. Que la pila no
              cambie es cierto, pero por casualidad del orden, no porque todos
              se muevan igual.
    resolucion: |
      **4.1 · La mejor pila en condiciones estándar.** Como
      $E_{\text{pila}} = E_{\text{cátodo}} - E_{\text{ánodo}}$, la diferencia
      se hace máxima con el par de potencial más alto arriba y el más bajo
      abajo. De los tres, el más alto es el yodo, $0{,}54$, y el más bajo el
      Cu²⁺/Cu, $0{,}34$:

      $$
      E^{0}_{\text{pila}} = 0{,}54 - 0{,}34 = 0{,}20\ \mathrm{V}
      $$

      | | semirreacción |
      |---|---|
      | cátodo (reducción) | $\mathrm{I_2\,(s)} + 2e^{-} \rightarrow 2\,\mathrm{I^{-}}$ |
      | ánodo (oxidación) | $\mathrm{Cu\,(s)} \rightarrow \mathrm{Cu^{2+}} + 2e^{-}$ |
      | global | $\mathrm{Cu\,(s)} + \mathrm{I_2\,(s)} \rightarrow \mathrm{Cu^{2+}} + 2\,\mathrm{I^{-}}$ |

      Y el dibujo: dos vasos unidos por un puente salino, el ánodo con una
      lámina de cobre en su disolución de Cu²⁺ y el cátodo con yodo sólido
      sobre un electrodo inerte —platino o grafito— en disolución de yoduro.
      Los electrones van por el hilo **del ánodo al cátodo**, o sea del cobre
      al yodo.

      Conviene comprobar que las otras dos parejas son peores: I₂/I⁻ con
      Cu⁺/Cu da $0{,}02$ V y los dos cobres entre sí dan $0{,}18$ V.

      **4.2 · Con las concentraciones del enunciado.** Aquí hay una lectura
      fina que decide el ejercicio: el enunciado habla de la concentración de
      «la especie de mayor estado de oxidación» y de la de menor, pero
      **dos de los tres pares tienen un sólido**, y un sólido puro tiene
      actividad 1 y no entra en el cociente.

      | par | especie con concentración | Nernst | $E$ |
      |---|---|---|---|
      | I₂ (s)/I⁻ | I⁻ = 10⁻², n = 2 | $0{,}54 - 0{,}0296\log(10^{-2})^{2}$ | **0,658 V** |
      | Cu⁺/Cu | Cu⁺ = 10⁻⁵, n = 1 | $0{,}52 - 0{,}0592\log(1/10^{-5})$ | **0,224 V** |
      | Cu²⁺/Cu | Cu²⁺ = 10⁻⁵, n = 2 | $0{,}34 - 0{,}0296\log(1/10^{-5})$ | **0,192 V** |

      **Por qué uno sube y dos bajan**, que es lo que hay que razonar. En los
      dos pares de cobre lo que está diluido es el **reactivo** de la
      reducción, el catión: hay poco de lo que se va a reducir, así que la
      reducción está menos favorecida y el potencial cae. En el yodo lo que
      está diluido es el **producto**, el yoduro: hay poco de lo que se va a
      formar, así que la reducción está más favorecida y el potencial sube.

      **¿Sigue siendo espontánea la pila del 4.1?** Sí, y además con más
      fuerza. El orden de los tres no ha cambiado, así que la mejor pareja
      sigue siendo la misma:

      $$
      E_{\text{pila}} = 0{,}658 - 0{,}192 = 0{,}466\ \mathrm{V}
      $$

      más del doble que los $0{,}20$ V estándar. La reacción redox es la
      misma que en el apartado anterior.

      **Y lo que conviene no dar por hecho.** Que el orden se mantenga es un
      resultado, no una regla: los dos cobres han pasado de estar a $0{,}18$ V
      de distancia a estar a $0{,}032$, y con concentraciones algo distintas
      podrían haberse cruzado. Cambiar las concentraciones **sí puede** darle
      la vuelta a una pila, y por eso el apartado pide recalcular los tres en
      vez de suponer que el ranking aguanta.
