ejercicios:
  # ── Hess en las dos direcciones y con dos funciones de estado a la vez. La
  #    tabla es media trampa: del etanol NO da la entalpía de formación, da la
  #    de combustión, así que hay que montar el ciclo en vez de aplicar la
  #    fórmula de siempre. Y el apartado 1.4 cierra con un resultado que sale
  #    justo: espontánea a 1200 K, con el umbral en 1124.
  - id: exfq2425-2c-ext-1-el-etanol-y-la-gasolina
    titulo: El etanol contra el etano, y un umbral que cae en 1124 K
    fuente: >-
      Ejercicio 1 · Extraordinaria del segundo cuatrimestre, 3 de julio de
      2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      Actualmente se intenta encontrar sustitutos para la gasolina en el motor
      de explosión de los vehículos. Un ejemplo es la utilización de una
      mezcla de etanol (CH3CH2OH) con la propia gasolina.

      La ventaja es que el etanol puede obtenerse por fermentación de azúcares
      (por ejemplo, glucosa) obtenidos a partir de plantas (por ejemplo,
      maíz). El uso del etanol como combustible aprovecha el hecho de que la
      combustión del etanol es fuertemente exotérmica, aunque ciertamente no
      lo es tanto como la del etano (CH3CH3), ya que el etanol está
      parcialmente oxidado respecto al etano.

      **1.1** Escribe y ajusta las reacciones químicas a las que se ha hecho
      mención, es decir, combustión de etano (CH3CH3), combustión de etanol
      (CH3CH2OH) y oxidación de etano a etanol.

      **1.2** Calcula los valores de la entalpía de reacción (kJ/mol) en
      condiciones estándar i) para la reacción de combustión del etano, y ii)
      para la oxidación de etano a etanol.

      **1.3** Calcula los calores de combustión por gramo de etano y de etanol
      (kJ/g).

      **1.4** Si dentro del motor de explosión se alcanzaran 1200 K de
      temperatura, ¿podría transformarse etanol en etano? (Es decir la
      reacción es espontánea). Suponed que la entalpía y la entropía no varían
      con la temperatura.

      **Datos:**

      | | CH3CH3 (g) | O2 (g) | CO2 (g) | H2O (g) | CH3CH2OH (l) |
      |---|---|---|---|---|---|
      | ΔH⁰ formación (kJ/mol) | −84,7 | — | −393,5 | −241,8 | |
      | S⁰ (J/mol K) | 229,5 | 205 | 213,6 | 188,7 | |
      | ΔH⁰ combustión (kJ/mol) | | | | | −1235,0 |
      | ΔS⁰ combustión (J/mol K) | | | | | 217,7 |

      Pesos atómicos (g/mol): C-12, O-16, H-1.
    pide: >-
      Las tres reacciones ajustadas, la entalpía de combustión del etano y la
      de su oxidación a etanol, los dos calores por gramo, y si a 1200 K el
      etanol se convertiría en etano.

    pasos:
      - tipo: reconocer
        pregunta: |
          De la tabla, ¿qué dato del **etanol** falta y cómo se rodea?
        opciones:
          - texto: >-
              Falta su entalpía de formación, pero dan la de combustión: se
              monta un ciclo de Hess en vez de usar la fórmula de formación
            correcta: true
            mensaje: |
              Eso es, y es toda la gracia del ejercicio. La tabla está
              construida para que no puedas aplicar
              «productos menos reactivos» al etanol: te obliga a ver la
              combustión del etano como dos pasos encadenados.
          - texto: >-
              No falta nada: la entalpía de formación del etanol se deduce de
              su entropía
            mensaje: |
              Entalpía y entropía son independientes; una no se saca de la
              otra. Lo que sí relaciona las dos es la energía libre, y aquí no
              la dan.
          - texto: >-
              Falta su entropía de formación, y se obtiene de los productos de
              su combustión
            mensaje: |
              Su entropía **de combustión** sí está en la tabla, 217,7. Lo que
              no está es la entalpía de formación.
          - texto: >-
              Falta su Cp, para poder llevar los datos a 1200 K
            mensaje: |
              El propio enunciado dice que supongas que la entalpía y la
              entropía **no varían** con la temperatura, así que no hace falta
              ningún Cp.

      - tipo: calcular
        titulo: La combustión del etano
        pregunta: |
          Con la reacción
          $\mathrm{C_2H_6} + \tfrac{7}{2}\mathrm{O_2} \rightarrow
          2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}$,
          ¿cuánto vale $\Delta H^{0}$ de combustión del etano?
        respuesta:
          tipo: numero
          valor: '-1427.7'
          tolerancia: 25
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-1597.1'
            mensaje: |
              Has usado agua **líquida**. La tabla da $\mathrm{H_2O\,(g)}$,
              −241,8: el agua sale como vapor y por eso se libera menos
              energía. La diferencia son los 3 moles de vaporización.
          - valor: '-1258.3'
            mensaje: |
              Te has dejado uno de los tres moles de agua. El etano tiene seis
              hidrógenos, así que la combustión da **3 H2O**.
        pista: |
          Productos menos reactivos con las entalpías de formación, y el
          oxígeno vale cero por ser elemento en su forma estable. Ojo al
          estado del agua: la tabla la da en **gas**.
        desarrollo: |
          $$
          \Delta H^{0} = \left[2(-393{,}5) + 3(-241{,}8)\right]
          - \left[-84{,}7 + 0\right]
          $$
          $$
          = -787{,}0 - 725{,}4 + 84{,}7 = -1427{,}7\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: La oxidación de etano a etanol
        pregunta: |
          ¿Cuánto vale $\Delta H^{0}$ de
          $\mathrm{C_2H_6} + \tfrac{1}{2}\mathrm{O_2} \rightarrow
          \mathrm{C_2H_5OH}$?
        respuesta:
          tipo: numero
          valor: '-192.7'
          tolerancia: 8
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '192.7'
            mensaje: |
              Signo cambiado. Oxidar etano a etanol **libera** energía: es el
              primer tramo de la combustión del etano, y por eso quemar etanol
              rinde menos que quemar etano.
          - valor: '-2662.7'
            mensaje: |
              Has **sumado** las dos combustiones en vez de restarlas. La
              combustión del etano es la oxidación a etanol **más** la
              combustión del etanol, así que la oxidación es la diferencia.
        pista: |
          Piensa la combustión del etano como dos pasos: primero se oxida a
          etanol, después el etanol se quema. Las dos entalpías tienen que
          sumar la del etano.
        desarrollo: |
          $$
          \mathrm{C_2H_6} + \tfrac{1}{2}\mathrm{O_2} \rightarrow \mathrm{C_2H_5OH}
          \qquad (\Delta H_{\text{ox}})
          $$
          $$
          \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
          2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}
          \qquad (-1235{,}0)
          $$
          Sumadas dan la combustión del etano, así que
          $$
          \Delta H_{\text{ox}} = -1427{,}7 - (-1235{,}0) = -192{,}7\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: El calor por gramo, que es lo que decide en un depósito
        pregunta: |
          ¿Cuántos kJ libera por **gramo** el etanol al quemarse?
        respuesta:
          tipo: numero
          valor: '26.8'
          tolerancia: 0.5
          formato: el calor en kJ/g, con una cifra decimal
        distractores:
          - valor: '47.6'
            mensaje: |
              Ese es el del etano. El etanol libera bastante menos por gramo
              —26,8 frente a 47,6— y es justo lo que dice el enunciado cuando
              habla de que está «parcialmente oxidado».
          - valor: '41.2'
            mensaje: |
              Has dividido entre 30, la masa del etano. El etanol es
              C2H5OH: 46 g/mol.
        pista: |
          Divide la entalpía de combustión entre la masa molar. Etano 30 g/mol,
          etanol 46.
        desarrollo: |
          $$
          \text{etano: } \frac{1427{,}7}{30} = 47{,}6\ \text{kJ/g}
          \qquad
          \text{etanol: } \frac{1235{,}0}{46} = 26{,}8\ \text{kJ/g}
          $$
          El etanol rinde un **44 % menos por gramo**. Ya trae oxígeno en la
          molécula, así que parte del camino hacia el CO2 está andado — y esa
          parte ya no da energía.

      - tipo: calcular
        titulo: La entropía de la combustión del etano
        pregunta: |
          Con las entropías absolutas de la tabla, ¿cuánto vale
          $\Delta S^{0}$ de la combustión del etano?
        respuesta:
          tipo: numero
          valor: '46.3'
          tolerancia: 3
          formato: la entropía en J/(mol·K), con una cifra decimal y su signo
        distractores:
          - valor: '-46.3'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Y tiene que salir
              positiva, porque se pasa de 4,5 moles de gas a 5.
          - valor: '763.8'
            mensaje: |
              Te has dejado los reactivos. Hay que restar la entropía del
              etano y la de los 3,5 moles de oxígeno.
        pista: |
          Productos menos reactivos, y el oxígeno entra con **3,5** moles.
          Aquí la entropía del O2 sí cuenta: la entropía absoluta de un
          elemento no es cero.
        desarrollo: |
          $$
          \Delta S^{0} = \left[2(213{,}6) + 3(188{,}7)\right]
          - \left[229{,}5 + 3{,}5(205)\right]
          $$
          $$
          = 993{,}3 - 947{,}0 = 46{,}3\ \text{J/(mol·K)}
          $$

      - tipo: calcular
        titulo: Y a 1200 K, ¿se da la vuelta la reacción?
        pregunta: |
          Para la transformación de etanol en etano a 1200 K, ¿cuánto vale
          $\Delta G$?
        respuesta:
          tipo: numero
          valor: '-13.0'
          tolerancia: 2.5
          formato: la energía libre en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '13.0'
            mensaje: |
              Signo cambiado en algún sitio, y decide la respuesta: con
              $\Delta G$ negativa **sí** es espontánea, con positiva no.
              Repasa el sentido de la reacción: es etanol → etano, o sea la
              inversa de la oxidación.
          - valor: '398.4'
            mensaje: |
              Has sumado $T\Delta S$ en vez de restarlo. Es
              $\Delta G = \Delta H - T\Delta S$.
        pista: |
          La reacción es la **inversa** de la oxidación, así que le cambian el
          signo a la entalpía y a la entropía. La entropía de la oxidación sale
          restando las dos de combustión, igual que hiciste con las entalpías.
        desarrollo: |
          $$
          \Delta S_{\text{ox}} = 46{,}3 - 217{,}7 = -171{,}4\ \text{J/(mol·K)}
          $$
          Invirtiendo, para etanol → etano:
          $$
          \Delta H = +192{,}7\ \text{kJ/mol}
          \qquad
          \Delta S = +171{,}4\ \text{J/(mol·K)}
          $$
          $$
          \Delta G_{1200} = 192{,}7 - 1200\cdot 0{,}1714 = -13{,}0\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las entalpías de formación, la combustión del etano libera
              1427,7 kJ/mol — con el agua en **gas**, que es como la da la
              tabla.
          - texto: >-
              La combustión del etano es la oxidación a etanol más la
              combustión del etanol, así que oxidar etano a etanol libera
              $-1427{,}7-(-1235{,}0) = -192{,}7$ kJ/mol.
          - texto: >-
              Por gramo, el etano da 47,6 kJ y el etanol 26,8: un 44 % menos,
              porque ya trae oxígeno dentro.
          - texto: >-
              La entropía de combustión del etano sale 46,3 J/(mol·K), y
              restando la del etanol, la oxidación tiene
              $\Delta S = -171{,}4$.
          - texto: >-
              Etanol a etano es la inversa: $\Delta H = +192{,}7$ kJ/mol y
              $\Delta S = +171{,}4$ J/(mol·K), los dos positivos.
          - texto: >-
              A 1200 K, $\Delta G = -13{,}0$ kJ/mol: **sí es espontánea**, y el
              umbral está en 1124 K.
          - texto: >-
              Como la transformación de etanol en etano es endotérmica, no
              puede ser espontánea a ninguna temperatura.
            trampa: true
            mensaje: |
              Endotérmica no significa imposible. Lo que decide es
              $\Delta G = \Delta H - T\Delta S$, y aquí la entropía también es
              positiva: el término $-T\Delta S$ empuja hacia lo espontáneo y
              crece con la temperatura.

              Es el caso «solo en caliente» de los cuatro: con
              $\Delta H>0$ y $\Delta S>0$ hay siempre una temperatura a partir
              de la cual la reacción se da la vuelta. Aquí son 1124 K, y el
              motor llega a 1200.
        veredicto: |
          El ejercicio entero es Hess aplicado dos veces —a la entalpía y a la
          entropía— y rematado con la energía libre. Y la respuesta final sale
          **justa**: 1200 K contra un umbral de 1124.

    resolucion: |
      **Lo que se pide.** 2,5 de los 10 puntos de la extraordinaria. Y la
      tabla de datos está construida con mala idea, en el buen sentido: del
      etanol **no da la entalpía de formación**, da la de combustión. Quien
      intente aplicar «productos menos reactivos» al etanol se queda sin
      poder empezar.

      ## 1.1 · Las tres reacciones

      $$
      \mathrm{C_2H_6} + \tfrac{7}{2}\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}
      $$
      $$
      \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}
      \qquad
      \mathrm{C_2H_6} + \tfrac{1}{2}\,\mathrm{O_2} \rightarrow \mathrm{C_2H_5OH}
      $$

      La tercera es la que hay que ver: **es el primer tramo de la primera**.
      Oxidar etano a etanol y después quemar el etanol da exactamente lo mismo
      que quemar el etano, y eso es todo el ciclo de Hess que hace falta.

      ## 1.2 · Las dos entalpías

      $$
      \Delta H^{0}_{\text{comb, etano}}
      = \left[2(-393{,}5)+3(-241{,}8)\right] - (-84{,}7)
      = \boxed{-1427{,}7\ \text{kJ/mol}}
      $$

      El agua es **gas**: la tabla da −241,8, no −285,8. Con agua líquida
      saldrían −1597,1 y el resto del ejercicio se descuadra entero.

      Y por el ciclo:

      $$
      \Delta H_{\text{ox}} = \Delta H_{\text{comb, etano}}
      - \Delta H_{\text{comb, etanol}}
      = -1427{,}7 + 1235{,}0
      = \boxed{-192{,}7\ \text{kJ/mol}}
      $$

      ## 1.3 · Por gramo, que es lo que cabe en un depósito

      $$
      \text{etano: } \frac{1427{,}7}{30} = \boxed{47{,}6\ \text{kJ/g}}
      \qquad
      \text{etanol: } \frac{1235{,}0}{46} = \boxed{26{,}8\ \text{kJ/g}}
      $$

      Un **44 % menos**. Es exactamente lo que dice el enunciado con «el
      etanol está parcialmente oxidado respecto al etano»: parte del camino
      hacia el CO2 ya está recorrido, y ese tramo —los 192,7 kJ/mol de la
      oxidación— ya no se puede cobrar dos veces.

      ## 1.4 · Y la pregunta bonita

      Se pide si a 1200 K el etanol se convertiría en etano, que es la
      **inversa** de la oxidación. Hace falta su entropía, y se obtiene igual
      que la entalpía: por diferencia.

      $$
      \Delta S^{0}_{\text{comb, etano}}
      = \left[2(213{,}6)+3(188{,}7)\right] - \left[229{,}5+3{,}5(205)\right]
      = 46{,}3\ \text{J/(mol·K)}
      $$
      $$
      \Delta S_{\text{ox}} = 46{,}3 - 217{,}7 = -171{,}4\ \text{J/(mol·K)}
      $$

      Invirtiendo el sentido, para etanol → etano:

      $$
      \Delta H = +192{,}7\ \text{kJ/mol}
      \qquad
      \Delta S = +171{,}4\ \text{J/(mol·K)}
      $$
      $$
      \boxed{\;\Delta G_{1200} = 192{,}7 - 1200\cdot 0{,}1714 = -13{,}0\ \text{kJ/mol}\;}
      $$

      **Sí, es espontánea** — y por poco. El umbral es

      $$
      T = \frac{192{,}7}{0{,}1714} = 1124\ \text{K}
      $$

      y el motor llega a 1200. Setenta y seis grados más y la respuesta se da
      la vuelta, así que este es un ejercicio en el que redondear pronto se
      paga: si arrastras 46 en vez de 46,3, o 171 en vez de 171,4, el signo
      de $\Delta G$ puede cambiar y con él la respuesta.

      **La lección de fondo**, que es la del tema entero: endotérmica no
      significa imposible. Con $\Delta H>0$ y $\Delta S>0$ siempre hay una
      temperatura a partir de la cual la reacción se da la vuelta; lo único
      que hay que averiguar es si el proceso llega hasta ella.
