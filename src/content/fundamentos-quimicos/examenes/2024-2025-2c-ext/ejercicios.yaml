ejercicios:
  # ── Hess en las dos direcciones y con dos funciones de estado a la vez. La
  #    tabla es media trampa: del etanol NO da la entalpía de formación, da la
  #    de combustión, así que hay que montar el ciclo en vez de aplicar la
  #    fórmula de siempre. Y el apartado 1.4 cierra con un resultado que sale
  #    justo: espontánea a 1200 K, con el umbral en 1124.
  - id: exfq2425-2c-ext-1-el-etanol-y-la-gasolina
    titulo: El etanol contra el etano, y un umbral que cae en 1124 K
    fuente: >-
      Ejercicio 1 · Extraordinaria del segundo cuatrimestre, 3 de julio de
      2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      Actualmente se intenta encontrar sustitutos para la gasolina en el motor
      de explosión de los vehículos. Un ejemplo es la utilización de una
      mezcla de etanol (CH3CH2OH) con la propia gasolina.

      La ventaja es que el etanol puede obtenerse por fermentación de azúcares
      (por ejemplo, glucosa) obtenidos a partir de plantas (por ejemplo,
      maíz). El uso del etanol como combustible aprovecha el hecho de que la
      combustión del etanol es fuertemente exotérmica, aunque ciertamente no
      lo es tanto como la del etano (CH3CH3), ya que el etanol está
      parcialmente oxidado respecto al etano.

      **1.1** Escribe y ajusta las reacciones químicas a las que se ha hecho
      mención, es decir, combustión de etano (CH3CH3), combustión de etanol
      (CH3CH2OH) y oxidación de etano a etanol.

      **1.2** Calcula los valores de la entalpía de reacción (kJ/mol) en
      condiciones estándar i) para la reacción de combustión del etano, y ii)
      para la oxidación de etano a etanol.

      **1.3** Calcula los calores de combustión por gramo de etano y de etanol
      (kJ/g).

      **1.4** Si dentro del motor de explosión se alcanzaran 1200 K de
      temperatura, ¿podría transformarse etanol en etano? (Es decir la
      reacción es espontánea). Suponed que la entalpía y la entropía no varían
      con la temperatura.

      **Datos:**

      | | CH3CH3 (g) | O2 (g) | CO2 (g) | H2O (g) | CH3CH2OH (l) |
      |---|---|---|---|---|---|
      | ΔH⁰ formación (kJ/mol) | −84,7 | — | −393,5 | −241,8 | |
      | S⁰ (J/mol K) | 229,5 | 205 | 213,6 | 188,7 | |
      | ΔH⁰ combustión (kJ/mol) | | | | | −1235,0 |
      | ΔS⁰ combustión (J/mol K) | | | | | 217,7 |

      Pesos atómicos (g/mol): C-12, O-16, H-1.
    pide: >-
      Las tres reacciones ajustadas, la entalpía de combustión del etano y la
      de su oxidación a etanol, los dos calores por gramo, y si a 1200 K el
      etanol se convertiría en etano.

    pasos:
      - tipo: reconocer
        pregunta: |
          De la tabla, ¿qué dato del **etanol** falta y cómo se rodea?
        opciones:
          - texto: >-
              Falta su entalpía de formación, pero dan la de combustión: se
              monta un ciclo de Hess en vez de usar la fórmula de formación
            correcta: true
            mensaje: |
              Eso es, y es toda la gracia del ejercicio. La tabla está
              construida para que no puedas aplicar
              «productos menos reactivos» al etanol: te obliga a ver la
              combustión del etano como dos pasos encadenados.
          - texto: >-
              No falta nada: la entalpía de formación del etanol se deduce de
              su entropía
            mensaje: |
              Entalpía y entropía son independientes; una no se saca de la
              otra. Lo que sí relaciona las dos es la energía libre, y aquí no
              la dan.
          - texto: >-
              Falta su entropía de formación, y se obtiene de los productos de
              su combustión
            mensaje: |
              Su entropía **de combustión** sí está en la tabla, 217,7. Lo que
              no está es la entalpía de formación.
          - texto: >-
              Falta su Cp, para poder llevar los datos a 1200 K
            mensaje: |
              El propio enunciado dice que supongas que la entalpía y la
              entropía **no varían** con la temperatura, así que no hace falta
              ningún Cp.

      - tipo: calcular
        titulo: La combustión del etano
        pregunta: |
          Con la reacción
          $\mathrm{C_2H_6} + \tfrac{7}{2}\mathrm{O_2} \rightarrow
          2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}$,
          ¿cuánto vale $\Delta H^{0}$ de combustión del etano?
        respuesta:
          tipo: numero
          valor: '-1427.7'
          tolerancia: 25
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-1597.1'
            mensaje: |
              Has usado agua **líquida**. La tabla da $\mathrm{H_2O\,(g)}$,
              −241,8: el agua sale como vapor y por eso se libera menos
              energía. La diferencia son los 3 moles de vaporización.
          - valor: '-1258.3'
            mensaje: |
              Te has dejado uno de los tres moles de agua. El etano tiene seis
              hidrógenos, así que la combustión da **3 H2O**.
        pista: |
          Productos menos reactivos con las entalpías de formación, y el
          oxígeno vale cero por ser elemento en su forma estable. Ojo al
          estado del agua: la tabla la da en **gas**.
        desarrollo: |
          $$
          \Delta H^{0} = \left[2(-393{,}5) + 3(-241{,}8)\right]
          - \left[-84{,}7 + 0\right]
          $$
          $$
          = -787{,}0 - 725{,}4 + 84{,}7 = -1427{,}7\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: La oxidación de etano a etanol
        pregunta: |
          ¿Cuánto vale $\Delta H^{0}$ de
          $\mathrm{C_2H_6} + \tfrac{1}{2}\mathrm{O_2} \rightarrow
          \mathrm{C_2H_5OH}$?
        respuesta:
          tipo: numero
          valor: '-192.7'
          tolerancia: 8
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '192.7'
            mensaje: |
              Signo cambiado. Oxidar etano a etanol **libera** energía: es el
              primer tramo de la combustión del etano, y por eso quemar etanol
              rinde menos que quemar etano.
          - valor: '-2662.7'
            mensaje: |
              Has **sumado** las dos combustiones en vez de restarlas. La
              combustión del etano es la oxidación a etanol **más** la
              combustión del etanol, así que la oxidación es la diferencia.
        pista: |
          Piensa la combustión del etano como dos pasos: primero se oxida a
          etanol, después el etanol se quema. Las dos entalpías tienen que
          sumar la del etano.
        desarrollo: |
          $$
          \mathrm{C_2H_6} + \tfrac{1}{2}\mathrm{O_2} \rightarrow \mathrm{C_2H_5OH}
          \qquad (\Delta H_{\text{ox}})
          $$
          $$
          \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
          2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}
          \qquad (-1235{,}0)
          $$
          Sumadas dan la combustión del etano, así que
          $$
          \Delta H_{\text{ox}} = -1427{,}7 - (-1235{,}0) = -192{,}7\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: El calor por gramo, que es lo que decide en un depósito
        pregunta: |
          ¿Cuántos kJ libera por **gramo** el etanol al quemarse?
        respuesta:
          tipo: numero
          valor: '26.8'
          tolerancia: 0.5
          formato: el calor en kJ/g, con una cifra decimal
        distractores:
          - valor: '47.6'
            mensaje: |
              Ese es el del etano. El etanol libera bastante menos por gramo
              —26,8 frente a 47,6— y es justo lo que dice el enunciado cuando
              habla de que está «parcialmente oxidado».
          - valor: '41.2'
            mensaje: |
              Has dividido entre 30, la masa del etano. El etanol es
              C2H5OH: 46 g/mol.
        pista: |
          Divide la entalpía de combustión entre la masa molar. Etano 30 g/mol,
          etanol 46.
        desarrollo: |
          $$
          \text{etano: } \frac{1427{,}7}{30} = 47{,}6\ \text{kJ/g}
          \qquad
          \text{etanol: } \frac{1235{,}0}{46} = 26{,}8\ \text{kJ/g}
          $$
          El etanol rinde un **44 % menos por gramo**. Ya trae oxígeno en la
          molécula, así que parte del camino hacia el CO2 está andado — y esa
          parte ya no da energía.

      - tipo: calcular
        titulo: La entropía de la combustión del etano
        pregunta: |
          Con las entropías absolutas de la tabla, ¿cuánto vale
          $\Delta S^{0}$ de la combustión del etano?
        respuesta:
          tipo: numero
          valor: '46.3'
          tolerancia: 3
          formato: la entropía en J/(mol·K), con una cifra decimal y su signo
        distractores:
          - valor: '-46.3'
            mensaje: |
              Signo cambiado: es productos menos reactivos. Y tiene que salir
              positiva, porque se pasa de 4,5 moles de gas a 5.
          - valor: '763.8'
            mensaje: |
              Te has dejado los reactivos. Hay que restar la entropía del
              etano y la de los 3,5 moles de oxígeno.
        pista: |
          Productos menos reactivos, y el oxígeno entra con **3,5** moles.
          Aquí la entropía del O2 sí cuenta: la entropía absoluta de un
          elemento no es cero.
        desarrollo: |
          $$
          \Delta S^{0} = \left[2(213{,}6) + 3(188{,}7)\right]
          - \left[229{,}5 + 3{,}5(205)\right]
          $$
          $$
          = 993{,}3 - 947{,}0 = 46{,}3\ \text{J/(mol·K)}
          $$

      - tipo: calcular
        titulo: Y a 1200 K, ¿se da la vuelta la reacción?
        pregunta: |
          Para la transformación de etanol en etano a 1200 K, ¿cuánto vale
          $\Delta G$?
        respuesta:
          tipo: numero
          valor: '-13.0'
          tolerancia: 2.5
          formato: la energía libre en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '13.0'
            mensaje: |
              Signo cambiado en algún sitio, y decide la respuesta: con
              $\Delta G$ negativa **sí** es espontánea, con positiva no.
              Repasa el sentido de la reacción: es etanol → etano, o sea la
              inversa de la oxidación.
          - valor: '398.4'
            mensaje: |
              Has sumado $T\Delta S$ en vez de restarlo. Es
              $\Delta G = \Delta H - T\Delta S$.
        pista: |
          La reacción es la **inversa** de la oxidación, así que le cambian el
          signo a la entalpía y a la entropía. La entropía de la oxidación sale
          restando las dos de combustión, igual que hiciste con las entalpías.
        desarrollo: |
          $$
          \Delta S_{\text{ox}} = 46{,}3 - 217{,}7 = -171{,}4\ \text{J/(mol·K)}
          $$
          Invirtiendo, para etanol → etano:
          $$
          \Delta H = +192{,}7\ \text{kJ/mol}
          \qquad
          \Delta S = +171{,}4\ \text{J/(mol·K)}
          $$
          $$
          \Delta G_{1200} = 192{,}7 - 1200\cdot 0{,}1714 = -13{,}0\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las entalpías de formación, la combustión del etano libera
              1427,7 kJ/mol — con el agua en **gas**, que es como la da la
              tabla.
          - texto: >-
              La combustión del etano es la oxidación a etanol más la
              combustión del etanol, así que oxidar etano a etanol libera
              $-1427{,}7-(-1235{,}0) = -192{,}7$ kJ/mol.
          - texto: >-
              Por gramo, el etano da 47,6 kJ y el etanol 26,8: un 44 % menos,
              porque ya trae oxígeno dentro.
          - texto: >-
              La entropía de combustión del etano sale 46,3 J/(mol·K), y
              restando la del etanol, la oxidación tiene
              $\Delta S = -171{,}4$.
          - texto: >-
              Etanol a etano es la inversa: $\Delta H = +192{,}7$ kJ/mol y
              $\Delta S = +171{,}4$ J/(mol·K), los dos positivos.
          - texto: >-
              A 1200 K, $\Delta G = -13{,}0$ kJ/mol: **sí es espontánea**, y el
              umbral está en 1124 K.
          - texto: >-
              Como la transformación de etanol en etano es endotérmica, no
              puede ser espontánea a ninguna temperatura.
            trampa: true
            mensaje: |
              Endotérmica no significa imposible. Lo que decide es
              $\Delta G = \Delta H - T\Delta S$, y aquí la entropía también es
              positiva: el término $-T\Delta S$ empuja hacia lo espontáneo y
              crece con la temperatura.

              Es el caso «solo en caliente» de los cuatro: con
              $\Delta H>0$ y $\Delta S>0$ hay siempre una temperatura a partir
              de la cual la reacción se da la vuelta. Aquí son 1124 K, y el
              motor llega a 1200.
        veredicto: |
          El ejercicio entero es Hess aplicado dos veces —a la entalpía y a la
          entropía— y rematado con la energía libre. Y la respuesta final sale
          **justa**: 1200 K contra un umbral de 1124.

    resolucion: |
      **Lo que se pide.** 2,5 de los 10 puntos de la extraordinaria. Y la
      tabla de datos está construida con mala idea, en el buen sentido: del
      etanol **no da la entalpía de formación**, da la de combustión. Quien
      intente aplicar «productos menos reactivos» al etanol se queda sin
      poder empezar.

      ## 1.1 · Las tres reacciones

      $$
      \mathrm{C_2H_6} + \tfrac{7}{2}\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}
      $$
      $$
      \mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{CO_2} + 3\,\mathrm{H_2O\,(g)}
      \qquad
      \mathrm{C_2H_6} + \tfrac{1}{2}\,\mathrm{O_2} \rightarrow \mathrm{C_2H_5OH}
      $$

      La tercera es la que hay que ver: **es el primer tramo de la primera**.
      Oxidar etano a etanol y después quemar el etanol da exactamente lo mismo
      que quemar el etano, y eso es todo el ciclo de Hess que hace falta.

      ## 1.2 · Las dos entalpías

      $$
      \Delta H^{0}_{\text{comb, etano}}
      = \left[2(-393{,}5)+3(-241{,}8)\right] - (-84{,}7)
      = \boxed{-1427{,}7\ \text{kJ/mol}}
      $$

      El agua es **gas**: la tabla da −241,8, no −285,8. Con agua líquida
      saldrían −1597,1 y el resto del ejercicio se descuadra entero.

      Y por el ciclo:

      $$
      \Delta H_{\text{ox}} = \Delta H_{\text{comb, etano}}
      - \Delta H_{\text{comb, etanol}}
      = -1427{,}7 + 1235{,}0
      = \boxed{-192{,}7\ \text{kJ/mol}}
      $$

      ## 1.3 · Por gramo, que es lo que cabe en un depósito

      $$
      \text{etano: } \frac{1427{,}7}{30} = \boxed{47{,}6\ \text{kJ/g}}
      \qquad
      \text{etanol: } \frac{1235{,}0}{46} = \boxed{26{,}8\ \text{kJ/g}}
      $$

      Un **44 % menos**. Es exactamente lo que dice el enunciado con «el
      etanol está parcialmente oxidado respecto al etano»: parte del camino
      hacia el CO2 ya está recorrido, y ese tramo —los 192,7 kJ/mol de la
      oxidación— ya no se puede cobrar dos veces.

      ## 1.4 · Y la pregunta bonita

      Se pide si a 1200 K el etanol se convertiría en etano, que es la
      **inversa** de la oxidación. Hace falta su entropía, y se obtiene igual
      que la entalpía: por diferencia.

      $$
      \Delta S^{0}_{\text{comb, etano}}
      = \left[2(213{,}6)+3(188{,}7)\right] - \left[229{,}5+3{,}5(205)\right]
      = 46{,}3\ \text{J/(mol·K)}
      $$
      $$
      \Delta S_{\text{ox}} = 46{,}3 - 217{,}7 = -171{,}4\ \text{J/(mol·K)}
      $$

      Invirtiendo el sentido, para etanol → etano:

      $$
      \Delta H = +192{,}7\ \text{kJ/mol}
      \qquad
      \Delta S = +171{,}4\ \text{J/(mol·K)}
      $$
      $$
      \boxed{\;\Delta G_{1200} = 192{,}7 - 1200\cdot 0{,}1714 = -13{,}0\ \text{kJ/mol}\;}
      $$

      **Sí, es espontánea** — y por poco. El umbral es

      $$
      T = \frac{192{,}7}{0{,}1714} = 1124\ \text{K}
      $$

      y el motor llega a 1200. Setenta y seis grados más y la respuesta se da
      la vuelta, así que este es un ejercicio en el que redondear pronto se
      paga: si arrastras 46 en vez de 46,3, o 171 en vez de 171,4, el signo
      de $\Delta G$ puede cambiar y con él la respuesta.

      **La lección de fondo**, que es la del tema entero: endotérmica no
      significa imposible. Con $\Delta H>0$ y $\Delta S>0$ siempre hay una
      temperatura a partir de la cual la reacción se da la vuelta; lo único
      que hay que averiguar es si el proceso llega hasta ella.

  # ── El fosgeno. A diferencia del gas de agua del examen ordinario, aquí la
  #    perturbación NO deja un cuadrado perfecto: hay que ir a la fórmula
  #    general y descartar una raíz. Y el apartado 2.3 usa van't Hoff en la
  #    dirección que menos se espera —dos constantes dan la entalpía—.
  - id: exfq2425-2c-ext-2-el-fosgeno-y-la-raiz-que-sobra
    titulo: El fosgeno, la cuadrática de verdad y una raíz imposible
    fuente: >-
      Ejercicio 2 · Extraordinaria del segundo cuatrimestre, 3 de julio de
      2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      La descomposición del fosgeno (COCl2 (g)) tiene lugar mediante la
      siguiente reacción:

      $$
      \mathrm{COCl_2\,(g)} \rightleftharpoons
      \mathrm{CO\,(g)} + \mathrm{Cl_2\,(g)}
      $$

      Se tiene una mezcla en equilibrio con 0,0225 moles de CO, 0,0225 moles
      de Cl2 y 0,109 moles de COCl2 contenida en un recipiente de 1 litro a la
      temperatura de 527 ºC.

      **2.1** ¿Cuál será la constante de equilibrio Kc?

      **2.2** Si se agregan 0,02 moles de Cl2 ¿cuáles serán las
      concentraciones de las tres sustancias cuando se haya alcanzado el nuevo
      equilibrio?

      **2.3** Calcula el calor de descomposición de fosgeno sabiendo que a
      100 ºC, la constante de equilibrio Kc es 4,51 x 10⁻⁹.

      **2.4** ¿Cuáles de los siguientes cambios ocasionará que el equilibrio
      se desplace hacia la izquierda? Razonar la respuesta:
      i) agregar más CO; ii) aumentar la temperatura; iii) agregar un
      catalizador; iv) aumentar la presión; v) retirar fosgeno.
    pide: >-
      La constante, las concentraciones del nuevo equilibrio, la entalpía de
      descomposición y cuáles de los cinco cambios desplazan a la izquierda.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se añaden 0,02 mol de Cl2 a una mezcla que ya estaba en equilibrio.
          ¿Hacia dónde se desplaza y por qué?
        opciones:
          - texto: >-
              Hacia la izquierda: el sistema consume parte del cloro añadido
              recombinándolo con CO para dar fosgeno
            correcta: true
            mensaje: |
              Eso es Le Chatelier: el sistema se opone a la perturbación. Y se
              puede comprobar con números — el cociente sube por encima de
              $K_c$, así que sobra producto.
          - texto: >-
              Hacia la derecha, porque hay más reactivos disponibles
            mensaje: |
              El Cl2 es un **producto** de esta reacción, no un reactivo. El
              reactivo es el fosgeno.
          - texto: >-
              No se desplaza: la constante no ha cambiado
            mensaje: |
              La constante no cambia, y precisamente por eso el sistema tiene
              que moverse: las concentraciones se reajustan hasta que el
              cociente vuelve a valer $K_c$.
          - texto: >-
              Hacia la izquierda, porque al añadir gas sube la presión
            mensaje: |
              Aciertas la dirección por una razón que aquí no se aplica.
              Añadir un reactivo o producto a volumen constante desplaza por
              **concentración**, no por presión: el efecto de presión es el de
              comprimir el recipiente.

      - tipo: calcular
        titulo: La constante
        pregunta: ¿Cuánto vale $K_c$ a 527 °C?
        respuesta:
          tipo: numero
          valor: '0.004645'
          tolerancia: 0.00015
          formato: la constante, adimensional, en notación decimal
        distractores:
          - valor: '215.3'
            mensaje: |
              Está del revés, reactivo entre productos. En $K_c$ los productos
              van arriba, y aquí son el CO y el Cl2.
          - valor: '0.2065'
            mensaje: |
              Has puesto un solo producto arriba. Se forman **dos**, CO y Cl2,
              y los dos multiplican.
        pista: |
          El recipiente es de 1 litro, así que moles y concentraciones
          coinciden numéricamente. Productos arriba, los dos.
        desarrollo: |
          $$
          K_c = \frac{[\mathrm{CO}][\mathrm{Cl_2}]}{[\mathrm{COCl_2}]}
          = \frac{0{,}0225\cdot 0{,}0225}{0{,}109} = 4{,}645\cdot 10^{-3}
          $$

      - tipo: calcular
        titulo: El nuevo equilibrio
        pregunta: |
          Tras añadir 0,02 mol de Cl2, ¿cuánto vale $[\mathrm{CO}]$ en el
          nuevo equilibrio?
        respuesta:
          tipo: numero
          valor: '0.01529'
          tolerancia: 0.0006
          formato: la concentración en mol/L, con cinco cifras decimales
        distractores:
          - valor: '0.0225'
            mensaje: |
              Esa es la de antes de que el sistema reaccione. Al desplazarse
              hacia la izquierda se consume CO: quedan 0,0153.
          - valor: '0.0297'
            mensaje: |
              Has sumado $x$ en vez de restarla al CO. El desplazamiento es
              hacia la **izquierda**: los productos bajan y el fosgeno sube.
        pista: |
          Justo después de añadir, hay 0,0225 de CO, 0,0425 de Cl2 y 0,109 de
          fosgeno. Llama $x$ a lo que se recombina y sustituye en el mismo
          $K_c$, que no ha cambiado.
        desarrollo: |
          $$
          \frac{(0{,}0225-x)(0{,}0425-x)}{0{,}109+x} = 4{,}645\cdot 10^{-3}
          $$
          $$
          x^{2} - 0{,}069645\,x + 4{,}50\cdot 10^{-4} = 0
          \;\Longrightarrow\;
          x = 0{,}00721 \quad\text{o}\quad x = 0{,}0624
          $$
          La segunda es imposible: dejaría el CO negativo. Con la primera:
          $$
          [\mathrm{CO}] = 0{,}01529
          \qquad
          [\mathrm{Cl_2}] = 0{,}03529
          \qquad
          [\mathrm{COCl_2}] = 0{,}11621
          $$

      - tipo: calcular
        titulo: El calor de descomposición
        pregunta: |
          Con $K_c = 4{,}51\cdot 10^{-9}$ a 100 °C, ¿cuánto vale $\Delta H$ de
          la descomposición?
        respuesta:
          tipo: numero
          valor: '80.5'
          tolerancia: 3
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-80.5'
            mensaje: |
              Signo cambiado, y no cuadra con lo observado: la constante
              **crece** al subir la temperatura —de $4{,}5\cdot 10^{-9}$ a
              $4{,}6\cdot 10^{-3}$—, y eso solo pasa si la reacción es
              endotérmica.
          - valor: '0.0805'
            mensaje: |
              Te has dejado el factor mil. La cuenta da julios por mol; el
              enunciado pide una entalpía, que se da en kJ/mol.
        pista: |
          Van't Hoff con las dos constantes y las dos temperaturas, en kelvin:
          373,15 y 800,15 K. Aquí se despeja $\Delta H$ en vez de $K$.
        desarrollo: |
          $$
          \ln\frac{K_2}{K_1} = -\frac{\Delta H}{R}
          \left(\frac{1}{T_2}-\frac{1}{T_1}\right)
          $$
          $$
          \ln\frac{4{,}645\cdot 10^{-3}}{4{,}51\cdot 10^{-9}} = 13{,}85
          \;\Longrightarrow\;
          \Delta H = \frac{13{,}85\cdot 8{,}314}
          {\frac{1}{373{,}15}-\frac{1}{800{,}15}} = 80\,500\ \text{J/mol}
          $$

      - tipo: redactar
        que: deduccion
        consigna: |
          **El apartado 2.4, razonado en papel**: para cada uno de los cinco
          cambios, di si desplaza el equilibrio hacia la izquierda y por qué, en
          una línea cada uno. Al final, cuáles son.
        rubrica:
          - punto: |
              **i) Agregar CO: sí, a la izquierda.** Es un producto: el cociente
              sube por encima de $K_c$ y el sistema consume parte del CO añadido
              formando fosgeno.
            porque: |
              Es Le Chatelier en su forma más directa, y conviene decirlo con el
              cociente: $Q > K_c$ es una razón que se puede comprobar, no una
              intuición.
          - punto: |
              **ii) Aumentar la temperatura: no, a la derecha.** La
              descomposición es endotérmica, con $\Delta H = +80{,}5$ kJ/mol del
              apartado 2.3, así que el calor actúa como un reactivo más.
            porque: |
              Es el único de los cinco que cambia la constante, y el sentido lo
              da el signo de $\Delta H$ que acabas de calcular. Sin nombrar ese
              signo, la respuesta es una apuesta.
            minimo: true
          - punto: |
              **iii) Un catalizador: no desplaza nada.** Acelera los dos
              sentidos por igual; el equilibrio llega antes, pero es el mismo.
            porque: |
              La constante depende de $\Delta G^{0}$, que solo mira el principio
              y el final, y el catalizador cambia el camino, no los extremos.
          - punto: |
              **iv) Aumentar la presión: sí, a la izquierda**, porque ahí hay un
              mol de gas y a la derecha dos.
            porque: |
              La presión solo desplaza cuando cambia el número de moles de gas.
              En el gas de agua del examen ordinario, con dos a cada lado, no
              hacía nada; aquí $\Delta n_{\text{gas}} = +1$ y el sistema se va
              hacia el lado que ocupa menos.
            minimo: true
          - punto: |
              **v) Retirar fosgeno: sí, a la izquierda.** Baja el denominador,
              $Q$ sube por encima de $K_c$ y el sistema repone el fosgeno que
              falta. La respuesta: **i), iv) y v)**.
            porque: |
              Es el que más se contesta al revés, porque «retirar» se asocia a
              ir hacia los productos, que es lo que pasa cuando se retira un
              producto. Retirar un reactivo desplaza hacia donde se forma ese
              reactivo, que aquí es la izquierda.
        veredicto: |
          Tres de los cinco: i), iv) y v). Si tu lista tiene la temperatura,
          revisa el signo de $\Delta H$ del 2.3; si le falta el v), mira qué
          especie se retira: el fosgeno es el reactivo.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el recipiente de 1 L, $K_c = 4{,}645\cdot 10^{-3}$: muy
              pequeña, el fosgeno está mayoritariamente sin descomponer a 527 °C.
          - texto: >-
              Al añadir cloro el cociente sube por encima de $K_c$ y el sistema
              retrocede en $x = 0{,}00721$.
          - texto: >-
              De las dos raíces solo vale la pequeña: la otra dejaría el CO en
              negativo.
          - texto: >-
              Con las dos constantes, van't Hoff da $\Delta H = +80{,}5$ kJ/mol:
              descomponer el fosgeno cuesta energía.
          - texto: >-
              Desplazan a la izquierda **agregar CO** y **retirar fosgeno**,
              que suben el cociente por encima de $K_c$, y **aumentar la
              presión**, porque a la izquierda hay menos moles de gas.
          - texto: >-
              Aumentar la temperatura también desplaza a la izquierda, porque
              la descomposición del fosgeno desprende calor.
            trampa: true
            mensaje: |
              Es al revés: el apartado 2.3 acaba de dar
              $\Delta H = +80{,}5$ kJ/mol, así que la descomposición
              **absorbe** calor. Al calentar, el sistema se opone gastando ese
              calor, y eso es ir a la **derecha**. Por eso $K_c$ crece de
              $4{,}5\cdot 10^{-9}$ a 100 °C a $4{,}6\cdot 10^{-3}$ a 527 °C.
        veredicto: |
          Tres de los cinco cambios desplazan a la izquierda: añadir CO,
          comprimir y retirar fosgeno. La temperatura la desplaza a la derecha
          —es endotérmica— y el catalizador no hace nada.

    resolucion: |
      **Lo que se pide.** 2,5 de los 10 puntos. Es el hermano difícil del
      ejercicio de equilibrio del examen ordinario: allí la perturbación
      dejaba un cuadrado perfecto y bastaba una raíz; aquí hay que ir a la
      fórmula general y **descartar una solución**.

      ## 2.1 · La constante

      El recipiente es de 1 L, así que moles y molaridades coinciden:

      $$
      \boxed{\;K_c = \frac{0{,}0225\cdot 0{,}0225}{0{,}109}
      = 4{,}645\cdot 10^{-3}\;}
      $$

      Pequeña: a 527 °C el fosgeno está mayoritariamente sin descomponer.

      ## 2.2 · El nuevo equilibrio

      Justo después de añadir el cloro, y **antes** de que reaccione nada:

      $$
      Q = \frac{0{,}0225\cdot 0{,}0425}{0{,}109} = 8{,}77\cdot 10^{-3} > K_c
      $$

      Sobra producto, así que el sistema **retrocede**.

      | | CO | Cl₂ | COCl₂ |
      |---|---|---|---|
      | tras añadir | 0,0225 | 0,0425 | 0,109 |
      | equilibrio | $0{,}0225-x$ | $0{,}0425-x$ | $0{,}109+x$ |

      $$
      \frac{(0{,}0225-x)(0{,}0425-x)}{0{,}109+x} = 4{,}645\cdot 10^{-3}
      \;\Longrightarrow\;
      x^{2}-0{,}069645\,x+4{,}50\cdot 10^{-4}=0
      $$

      **Y aquí está el paso que decide el apartado.** Las dos raíces son
      0,00721 y 0,0624, y hay que quedarse con la primera — no por ser la
      pequeña, sino porque la otra dejaría $[\mathrm{CO}] = 0{,}0225-0{,}0624$,
      **negativo**. Una concentración negativa no existe.

      $$
      \boxed{\;[\mathrm{CO}] = 0{,}01529
      \qquad
      [\mathrm{Cl_2}] = 0{,}03529
      \qquad
      [\mathrm{COCl_2}] = 0{,}11621\;}
      $$

      Comprobando: $0{,}01529\cdot 0{,}03529/0{,}11621 = 4{,}645\cdot 10^{-3}$ ✓.
      Esa comprobación cuesta diez segundos y caza cualquier error de la
      cuadrática.

      ## 2.3 · La entalpía, con van't Hoff al revés

      Lo habitual es usar van't Hoff para llevar una constante a otra
      temperatura. Aquí se da la vuelta: hay **dos constantes** y se despeja la
      entalpía.

      $$
      \ln\frac{4{,}645\cdot 10^{-3}}{4{,}51\cdot 10^{-9}} = 13{,}85
      \;\Longrightarrow\;
      \boxed{\;\Delta H = +80{,}5\ \text{kJ/mol}\;}
      $$

      **Positiva, y tenía que serlo:** la constante crece seis órdenes de
      magnitud al pasar de 100 a 527 °C, y solo una reacción endotérmica se
      favorece con el calor. Es la comprobación de signo que hay que hacer
      antes de dar el número.

      ## 2.4 · Los cinco cambios

      | | efecto | ¿a la izquierda? |
      |---|---|---|
      | i) agregar CO | sobra producto | **sí** |
      | ii) subir la temperatura | es endotérmica, se favorece | no, a la derecha |
      | iii) catalizador | acelera los dos sentidos igual | **no hace nada** |
      | iv) subir la presión | 1 mol de gas a la izquierda contra 2 | **sí** |
      | v) retirar fosgeno | baja el denominador, $Q$ sube | **sí** |

      La respuesta son **i), iv) y v)**.

      El de la presión es el que hay que razonar mirando la ecuación: solo
      desplaza porque aquí $\Delta n_{\text{gas}} = +1$. En el gas de agua del
      examen ordinario, con dos moles a cada lado, comprimir no habría hecho
      nada.

  # ── Una valoración entera en tres apartados, y cada uno cae en un régimen
  #    distinto: tampón, punto de equivalencia y exceso de base. Es el mejor
  #    ejercicio del corpus para entrenar la decisión que decide el tema:
  #    contar moles ANTES de elegir fórmula.
  - id: exfq2425-2c-ext-3-el-acido-lactico-y-los-tres-regimenes
    titulo: El ácido láctico, y tres pH que se calculan de tres maneras
    fuente: >-
      Ejercicio 3 · Extraordinaria del segundo cuatrimestre, 3 de julio de
      2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      Si la constante de acidez o constante de ionización del ácido láctico
      (CH3CHOHCOOH) es $1{,}37\cdot 10^{-4}$:

      **3.1** Calcular el grado de ionización de una disolución de ácido
      láctico 1 M.

      **3.2** Calcular el pH de la disolución resultante de añadir los
      siguientes volúmenes de NaOH 2 M a 25 mL de la disolución de ácido
      láctico 1 M:

      **3.2.1** 12,5 mL · **3.2.2** 10 mL · **3.2.3** 14 mL
    pide: >-
      El grado de ionización del ácido solo, y el pH tras añadir cada uno de
      los tres volúmenes de sosa.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres apartados añaden sosa a los mismos 25 mL de ácido 1 M, o
          sea a 0,025 mol. ¿Qué hay que mirar antes de elegir fórmula?
        opciones:
          - texto: >-
              Cuántos moles de sosa se añaden en cada caso, y compararlos con
              los 0,025 del ácido
            correcta: true
            mensaje: |
              Eso decide todo. Con 12,5 mL de NaOH 2 M son exactamente 0,025
              mol: punto de equivalencia. Con 10 mL, menos: tampón. Con 14 mL,
              más: sobra base. Tres regímenes y tres fórmulas.
          - texto: >-
              La concentración de la sosa, porque es la que fija el pH final
            mensaje: |
              La concentración importa para contar los moles, pero por sí sola
              no dice nada: 10 mL y 14 mL de la misma sosa caen en regímenes
              distintos.
          - texto: >-
              El volumen total, para poder dividir al final
            mensaje: |
              Hace falta, y se olvida a menudo — pero después. Primero hay que
              saber **qué** se calcula, y eso lo dice la comparación de moles.
          - texto: >-
              Nada: con la constante de acidez basta para los tres
            mensaje: |
              La constante entra en dos de los tres, y en el tercero no entra
              en absoluto: cuando sobra base fuerte, el pH lo fija ella sola.

      - tipo: calcular
        titulo: El grado de ionización
        pregunta: |
          ¿Qué porcentaje del ácido láctico 1 M está disociado?
        respuesta:
          tipo: numero
          valor: '1.16'
          tolerancia: 0.06
          formato: el porcentaje, con dos cifras decimales
        distractores:
          - valor: '0.0137'
            mensaje: |
              Ese es $K_a$ en porcentaje, no el grado de ionización. Hay que
              resolver el equilibrio: $\alpha = x/C$ con
              $x = \sqrt{K_a C}$ aproximadamente.
          - valor: '11.7'
            mensaje: |
              Te has dejado la raíz cuadrada por algún sitio, o has usado
              $C = 0{,}01$. Con $C = 1$ M, $x \approx \sqrt{K_a} = 0{,}0117$,
              o sea un 1,17 %.
        pista: |
          $K_a = x^{2}/(1-x)$. Como $C/K_a$ es enorme, se puede aproximar
          $x \approx \sqrt{K_a\,C}$, y el grado es $x/C$.
        desarrollo: |
          $$
          x = \frac{-K_a+\sqrt{K_a^{2}+4K_a}}{2} = 0{,}01164
          \qquad
          \alpha = \frac{0{,}01164}{1} = 1{,}16\ \%
          $$
          Aproximando sin el $-x$ del denominador sale 0,01170, un 0,6 % de
          diferencia.

      - tipo: calcular
        titulo: Con 10 mL de sosa
        pregunta: ¿Cuál es el pH tras añadir 10 mL de NaOH 2 M?
        respuesta:
          tipo: numero
          valor: '4.47'
          tolerancia: 0.08
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '3.86'
            mensaje: |
              Ese es el $\mathrm{p}K_a$, o sea el pH si quedara la mitad del
              ácido. Aquí se ha neutralizado el 80 %: el cociente es 4, no 1.
          - valor: '1.93'
            mensaje: |
              Ese es el del ácido solo, sin nada de sosa. Con 0,020 mol de base
              añadidos ya hay lactato en el vaso y el régimen es de tampón.
        pista: |
          0,020 mol de sosa neutralizan 0,020 de los 0,025 de ácido: quedan
          0,005 de ácido y 0,020 de lactato. Eso es un tampón, y Henderson
          admite moles.
        desarrollo: |
          $$
          n(\mathrm{HA}) = 0{,}025-0{,}020 = 0{,}005
          \qquad
          n(\mathrm{A^-}) = 0{,}020
          $$
          $$
          \mathrm{pH} = 3{,}863 + \log\frac{0{,}020}{0{,}005}
          = 3{,}863 + 0{,}602 = 4{,}47
          $$

      - tipo: calcular
        titulo: Con 12,5 mL, el punto de equivalencia
        pregunta: ¿Y con 12,5 mL de sosa?
        respuesta:
          tipo: numero
          valor: '8.84'
          tolerancia: 0.1
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '7.00'
            mensaje: |
              Solo sería 7 si el ácido fuera fuerte. El lactato es la base
              conjugada de un ácido débil y **hidroliza**: el punto de
              equivalencia queda básico.
          - valor: '8.68'
            mensaje: |
              Casi: te has dejado el cambio de volumen. Los 0,025 mol de
              lactato están ahora en **37,5 mL**, no en 25, así que la
              concentración es 0,667 M.
        pista: |
          Los moles de base igualan exactamente a los de ácido: solo queda
          lactato. Su $K_b = K_w/K_a$, y ojo al volumen total.
        desarrollo: |
          $$
          C = \frac{0{,}025}{0{,}0375} = 0{,}667\ \mathrm{M}
          \qquad
          K_b = \frac{10^{-14}}{1{,}37\cdot 10^{-4}} = 7{,}30\cdot 10^{-11}
          $$
          $$
          [\mathrm{OH^-}] = \sqrt{K_b\,C} = 6{,}98\cdot 10^{-6}
          \;\Longrightarrow\;
          \mathrm{pOH} = 5{,}16
          \;\Longrightarrow\;
          \mathrm{pH} = 8{,}84
          $$

      - tipo: calcular
        titulo: Con 14 mL, cuando ya sobra base
        pregunta: ¿Y con 14 mL?
        respuesta:
          tipo: numero
          valor: '12.89'
          tolerancia: 0.1
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '9.28'
            mensaje: |
              Has seguido usando Henderson. Ya no hay ácido: se han añadido
              0,028 mol de base a 0,025 de ácido, así que sobran 0,003 mol de
              sosa y el cociente tendría un cero abajo.
          - valor: '11.11'
            mensaje: |
              Te has dejado el volumen total. Los 0,003 mol de exceso están en
              **39 mL**, no en 25.
        pista: |
          Sobra base fuerte, y cuando sobra base fuerte manda ella sola: lo
          demás es despreciable. Solo hace falta el exceso y el volumen total.
        desarrollo: |
          $$
          n(\mathrm{NaOH}) = 0{,}014\cdot 2 = 0{,}028
          \qquad
          \text{exceso} = 0{,}028-0{,}025 = 0{,}003\ \text{mol}
          $$
          $$
          [\mathrm{OH^-}] = \frac{0{,}003}{0{,}039} = 0{,}0769
          \;\Longrightarrow\;
          \mathrm{pOH} = 1{,}11
          \;\Longrightarrow\;
          \mathrm{pH} = 12{,}89
          $$

      - tipo: justificar
        pregunta: Ordena la valoración. Una pieza es falsa.
        piezas:
          - texto: >-
              El ácido solo, 1 M, está disociado un 1,16 %: pH 1,93.
          - texto: >-
              Con 10 mL de sosa quedan 0,005 mol de ácido y 0,020 de lactato:
              es un tampón y Henderson da pH 4,47.
          - texto: >-
              Con 12,5 mL los moles se igualan: solo hay lactato, que hidroliza,
              y el pH sube a 8,84.
          - texto: >-
              Con 14 mL sobran 0,003 mol de sosa en 39 mL: manda ella sola y el
              pH es 12,89.
          - texto: >-
              En los tres hay que recalcular el volumen total, que es la suma
              de los dos.
          - texto: >-
              Como el punto de equivalencia es donde se han igualado ácido y
              base, el pH allí tiene que ser 7.
            trampa: true
            mensaje: |
              Solo con ácido fuerte y base fuerte. Aquí el ácido es débil, así
              que su base conjugada —el lactato— no es un espectador: reacciona
              con el agua y libera OH⁻.

              La regla completa, que conviene tener escrita:
              débil + fuerte → equivalencia **básica**;
              fuerte + débil → equivalencia **ácida**;
              fuerte + fuerte → 7.
        veredicto: |
          Tres apartados, tres regímenes, tres fórmulas. Y la decisión no se
          toma calculando: se toma contando moles antes de empezar.

    resolucion: |
      **Lo que se pide.** 2,5 de los 10 puntos, y es el ejercicio que mejor
      resume el tema: la misma disolución en tres situaciones, y cada una pide
      una fórmula distinta. Lo difícil no es calcular — es acertar cuál.

      ## 3.1 · El ácido solo

      $$
      K_a = \frac{x^{2}}{1-x}
      \;\Longrightarrow\;
      x = 0{,}01164
      \;\Longrightarrow\;
      \boxed{\;\alpha = 1{,}16\ \%\;}
      \qquad (\mathrm{pH} = 1{,}93)
      $$

      Aproximando $x \approx \sqrt{K_a}$ salen 0,01170: un 0,6 % de error, que
      no mueve la segunda cifra. Conviene decir en el examen que se ha
      aproximado y por qué.

      ## La cuenta que decide los tres apartados

      Antes de ninguna fórmula:

      $$
      n(\text{ácido}) = 0{,}025\cdot 1 = 0{,}025\ \text{mol}
      $$

      | sosa añadida | moles de base | frente a 0,025 | régimen |
      |---|---|---|---|
      | 10 mL | 0,020 | **falta** | tampón |
      | 12,5 mL | 0,025 | **igual** | equivalencia |
      | 14 mL | 0,028 | **sobra** | exceso de base |

      Con esa tabla hecha, los tres apartados son mecánicos.

      ## 3.2.2 · 10 mL — el tampón

      $$
      n(\mathrm{HA}) = 0{,}005
      \qquad
      n(\mathrm{A^-}) = 0{,}020
      $$
      $$
      \boxed{\;\mathrm{pH} = 3{,}863 + \log 4 = 4{,}47\;}
      $$

      Aquí el volumen no hace falta: en Henderson el cociente puede ir con
      moles porque los dos están en el mismo vaso.

      ## 3.2.1 · 12,5 mL — la equivalencia

      Los moles se igualan: en el vaso **solo hay lactato**. Y el lactato es
      una base:

      $$
      C = \frac{0{,}025}{0{,}0375} = 0{,}667\ \mathrm{M}
      \qquad
      K_b = \frac{K_w}{K_a} = 7{,}30\cdot 10^{-11}
      $$
      $$
      [\mathrm{OH^-}] = \sqrt{K_b C} = 6{,}98\cdot 10^{-6}
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 8{,}84\;}
      $$

      **Básico, no siete.** Y **aquí el volumen sí importa**: son 37,5 mL, no
      25. Usar la concentración original daría 8,68 — no muy lejos, pero mal.

      ## 3.2.3 · 14 mL — sobra base

      $$
      \text{exceso} = 0{,}028-0{,}025 = 0{,}003\ \text{mol en } 39\ \text{mL}
      $$
      $$
      [\mathrm{OH^-}] = 0{,}0769
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 12{,}89\;}
      $$

      Cuando sobra base fuerte, **manda ella sola**: el lactato que hay al lado
      no cambia la tercera cifra. Seguir con Henderson aquí es el error más
      caro del ejercicio, porque el cociente tendría un cero en el
      denominador.

      ## La curva completa, de un vistazo

      | sosa | pH |
      |---|---|
      | 0 mL | 1,93 |
      | 10 mL | 4,47 |
      | 12,5 mL | 8,84 |
      | 14 mL | 12,89 |

      Entre 12,5 y 14 mL el pH sube **cuatro unidades con milímetro y medio**
      de sosa. Ese salto vertical es el punto de equivalencia, y es lo que hace
      posible una valoración: el indicador cambia de color en una gota.

  # ── El último de la extraordinaria, 2,5 puntos, y con él la convocatoria
  #    queda entera. Tres pares redox de los que hay que elegir DOS, y la
  #    gracia es que dos de los tres son del mismo metal: Cu⁺/Cu y Cu²⁺/Cu.
  #    En el 4.2 entra Nernst y hay una trampa fina — dos de los tres pares
  #    tienen un sólido, cuya actividad vale 1 y no entra en el cociente.
  - id: exfq2425-2c-ext-4-el-yodo-y-los-dos-cobres
    titulo: El yodo y los dos cobres, y qué pila cambia al cambiar las concentraciones
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria del segundo cuatrimestre,
      curso 2024-2025 · Fundamentos Químicos de la Ingeniería (25975),
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      Dados los siguientes potenciales de reducción:

      E⁰ (I2 (s)/I⁻) = 0,54 V, E⁰ (Cu⁺/Cu) = 0,52 V, E⁰ (Cu²⁺/Cu) = 0,34 V

      **4.1.** Indicar cuál sería la pila más espontanea en condiciones
      estándar, escribe la reacción que tendrá lugar en el ánodo, en el
      cátodo, en la pila y dibuja la pila.

      **4.2.** Calcula el potencial de cada electrodo si en todos los casos la
      concentración de la especie de mayor estado de oxidación es 10⁻⁵ M y la
      concentración de la especie de menor estado de oxidación es 10⁻² M.
      ¿Sería la pila del apartado 4.1 espontanea en estas condiciones? ¿Cuál
      sería pila la más espontanea?, ¿Y cuál sería la reacción redox en la
      pila? Razona la respuesta
    pide: >-
      La pila más espontánea en condiciones estándar con sus semirreacciones,
      los tres potenciales corregidos por Nernst y la pila que resulta con
      esas concentraciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres pares y una pila solo usa dos. ¿Cómo se elige la
          combinación más espontánea?
        opciones:
          - texto: El de potencial mayor como cátodo y el menor como ánodo
            correcta: true
            mensaje: |
              Eso es. Como $E_{\text{pila}} = E_{\text{cátodo}} - E_{\text{ánodo}}$,
              la diferencia se hace máxima cogiendo el par de arriba y el de
              abajo. Los dos intermedios nunca dan la mejor pila.
          - texto: Los dos de potencial más alto, porque son los que más reducen
            mensaje: |
              Lo que importa no es que los dos sean altos sino que estén
              **separados**. Dos potenciales altos y parecidos dan una pila
              floja: aquí el par I₂/I⁻ con Cu⁺/Cu daría 0,02 V.
          - texto: Los dos del mismo elemento, porque son compatibles
            mensaje: |
              Que dos pares sean del mismo metal no los hace más adecuados. De
              hecho Cu⁺/Cu y Cu²⁺/Cu solo se llevan 0,18 V y no son la mejor
              pareja.
          - texto: Sumando los tres potenciales y quedándose con el signo
            mensaje: |
              Los potenciales de electrodo no se suman: una pila tiene dos
              electrodos y su potencial es la **diferencia** entre ellos.

      - tipo: calcular
        titulo: El potencial de la pila en condiciones estándar
        pregunta: |
          Con la mejor combinación, ¿cuánto vale $E^{0}$ de la pila, en
          voltios?
        respuesta:
          tipo: numero
          valor: '0.20'
          tolerancia: 0.005
          formato: un número, con dos decimales, en voltios
        distractores:
          - valor: '0.02'
            mensaje: |
              Has emparejado I₂/I⁻ con Cu⁺/Cu, que son los dos más altos y
              casi iguales. Para maximizar hay que coger el más alto y el
              **más bajo**.
          - valor: '0.18'
            mensaje: |
              Esa es la pareja de los dos cobres, $0{,}52 - 0{,}34$. El yodo
              está más arriba que los dos y da más diferencia.
          - valor: '0.88'
            mensaje: |
              Has sumado en vez de restar. El potencial de una pila es la
              diferencia entre los dos electrodos.
          - valor: '-0.20'
            mensaje: |
              Signo cambiado: has puesto de cátodo el de menor potencial. Una
              pila espontánea tiene $E > 0$, así que el que reduce es el de
              arriba.
        pista: |
          $E^{0}_{\text{pila}} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$,
          con el mayor arriba y el menor abajo.
        desarrollo: |
          $$
          E^{0}_{\text{pila}} = 0{,}54 - 0{,}34 = 0{,}20\ \mathrm{V}
          $$

          Cátodo: $\mathrm{I_2\,(s)} + 2e^{-} \rightarrow 2\,\mathrm{I^{-}}$

          Ánodo: $\mathrm{Cu\,(s)} \rightarrow \mathrm{Cu^{2+}} + 2e^{-}$

          Global: $\mathrm{Cu\,(s)} + \mathrm{I_2\,(s)} \rightarrow \mathrm{Cu^{2+}} + 2\,\mathrm{I^{-}}$

      - tipo: dibujar
        consigna: |
          **La pila del apartado 4.1, en papel.** Dibuja los dos vasos, el cable
          con el voltímetro y el puente salino. Marca el ánodo y el cátodo con
          su signo, qué hay en cada vaso, el sentido de los electrones y hacia
          dónde van los iones del puente, y escribe debajo de cada vaso su
          semirreacción.
        comprueba:
          - punto: |
              El ánodo: una lámina de cobre en una disolución de Cu²⁺, polo
              negativo.
            porque: |
              Es el par de potencial menor de los tres, 0,34 V, y el que se
              oxida: Cu → Cu²⁺ + 2e⁻. Es el Cu²⁺/Cu y no el Cu⁺/Cu, porque es el
              que más se separa del yodo y da la pila más espontánea.
          - punto: |
              El cátodo: yodo sólido junto a un electrodo inerte de platino, o de
              grafito, en una disolución de yoduro, polo positivo.
            porque: |
              El par I₂/I⁻ no tiene ningún metal que haga de electrodo, así que
              hace falta uno que conduzca sin reaccionar, y sobre él ocurre
              I₂ + 2e⁻ → 2 I⁻. Es lo mismo que pasa con los pares que no tienen
              metal, como Fe³⁺/Fe²⁺.
          - punto: |
              Los electrones, por el cable, del cobre al platino.
            porque: |
              Salen de donde algo se oxida y llegan a donde algo se reduce. Por
              las disoluciones no pasa ningún electrón: pasan iones.
          - punto: |
              En el puente salino, los aniones hacia el cobre y los cationes
              hacia el platino.
            porque: |
              En el ánodo aparece Cu²⁺, carga positiva que hay que compensar con
              aniones; en el cátodo aparece I⁻, carga negativa que compensan los
              cationes que llegan.
          - punto: |
              Debajo de cada vaso, su semirreacción, y la global:
              Cu + I₂ → Cu²⁺ + 2 I⁻.
            porque: |
              El enunciado pide las tres reacciones junto al dibujo. Cada
              semirreacción mueve dos electrones, así que se suman tal cual, sin
              multiplicar ninguna.
        figura: |
