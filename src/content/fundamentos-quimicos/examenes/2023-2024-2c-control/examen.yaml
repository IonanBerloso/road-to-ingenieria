asignatura: fundamentos-quimicos
curso: '2023-2024'
convocatoria: control-segundo-cuatrimestre
fecha: curso 2023-2024
# El control del segundo cuatrimestre, y con él quedan representadas las cinco
# convocatorias que hay de esta asignatura. Cuatro ejercicios muy desiguales
# —4,00 · 3,00 · 2,00 · 1,00— y los cuatro de termodinámica: entalpías de
# formación por Hess, combustión con cambio de fase, signos de entropía y una
# temperatura de transición.
#
# Publica los puntos por ejercicio pero no por competencia, así que no se
# declaran. Tiempo: 1.30 h.
pdf: 2023-2024-2c-control.pdf

ejercicios:
  - id: exfq2324-2c-control-2-el-octano-y-los-cuatrocientos-kilos-de-agua
    tema: t06-termoquimica

fuera:
  - n: 1
    motivo: >-
      La hidracina de los cohetes: entalpía de formación por Hess, y después
      entalpía, entropía, energía interna y energía libre a 100 ºC. Es del
      tema 6 y del 7, y entra en la próxima tanda; se ha dejado para después
      del 2 porque los dos comparten el mismo cambio de fase del agua y
      conviene que el que lo explica se escriba primero.
  - n: 3
    motivo: >-
      Decir cómo cambia la entropía en cinco procesos y razonarlo. Es del tema
      7 y no tiene número que calcular: la respuesta es un razonamiento en
      cinco líneas, y con los tipos de respuesta que hay hoy no se puede
      corregir automáticamente. Se escribirá con la prosa del tema 7.
  - n: 4
    motivo: >-
      La peste del estaño: por debajo de qué temperatura el estaño blanco se
      convierte en gris. Es del tema 7, que todavía no está escrito.
