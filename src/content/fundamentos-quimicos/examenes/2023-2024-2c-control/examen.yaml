# El control del segundo cuatrimestre. Cuando entró se dijo aquí que con él
# «quedaban representadas las cinco convocatorias que hay de esta asignatura», y
# resultó no ser cierto: el 5 de septiembre de 2026 apareció una sexta, el
# control del primer cuatrimestre de 2024-2025, que estaba en el material sin
# extensión de fichero. Son seis. Cuatro ejercicios muy desiguales
# —4,00 · 3,00 · 2,00 · 1,00— y los cuatro de termodinámica: entalpías de
# formación por Hess, combustión con cambio de fase, signos de entropía y una
# temperatura de transición.
#
# Publica los puntos por ejercicio pero no por competencia, así que no se
# declaran. Tiempo: 1.30 h.
pdf: 2023-2024-2c-control.pdf

ejercicios:
  - id: exfq2324-2c-control-1-la-hidracina-de-los-cohetes
    tema: t06-termoquimica
  - id: exfq2324-2c-control-2-el-octano-y-los-cuatrocientos-kilos-de-agua
    tema: t06-termoquimica
  - id: exfq2324-2c-control-3-cinco-signos-de-entropia
    tema: t07-espontaneidad-y-energia-libre
  - id: exfq2324-2c-control-4-la-peste-del-estano
    tema: t07-espontaneidad-y-energia-libre

# Sin `fuera`: los cuatro ejercicios están. El 3 no tiene número que calcular
# —son cinco signos de entropía razonados— y se resuelve con un paso de
# reconocimiento, uno de recuento y la ordenación del argumento, que es la
# forma que tiene el sitio de corregir un razonamiento.
