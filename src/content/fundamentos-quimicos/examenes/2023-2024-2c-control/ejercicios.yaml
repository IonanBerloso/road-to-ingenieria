ejercicios:
  # ── Dos ideas en un ejercicio: que la tabla da el agua líquida y el
  #    enunciado pide vapor, y que calentar agua de 25 a 120 ºC son TRES
  #    tramos y no uno. Las dos se pagan igual de caras y las dos se ven en el
  #    resultado: sin corregir el cambio de fase, la masa de agua sale un 8 %
  #    alta; sin contar la vaporización, casi nueve veces mayor.
  - id: exfq2324-2c-control-2-el-octano-y-los-cuatrocientos-kilos-de-agua
    titulo: Cincuenta litros de gasolina, y el agua que llegan a hervir
    fuente: >-
      Ejercicio 2 · Control del segundo cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      En la práctica, la gasolina puede considerarse como octano (C8H18).
      Calcula:

      **2.1** La entalpía estándar de combustión del octano líquido, en
      kJ/mol, sabiendo que se generan CO2 y vapor de H2O.

      **2.2** El 80% del calor generado en la combustión de 50 L de octano
      líquido, se emplean para calentar agua de 25 hasta 120 ºC, a presión
      atmosférica. Calcula la masa de agua que puede calentarse.

      **Datos:** densidad del octano = 0,72 g/mL · Cp (H2O (l)) =
      75,31 J/mol K · ΔHvaporización (H2O (l)) = 44,03 kJ/mol · Cp (H2O (g)) =
      33,56 J/mol K.

      | sustancia | ΔH⁰f (kJ/mol) |
      |---|---|
      | CO2 (g) | −393,50 |
      | H2O (l) | −285,85 |
      | C8H18 (l) | −250,00 |
    pide: >-
      La entalpía de combustión del octano con el agua en vapor, y la masa de
      agua que se puede llevar de 25 a 120 ºC con el 80 % de ese calor.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la combustión «sabiendo que se generan CO2 y
          **vapor** de H2O», y la tabla solo da la entalpía de formación del
          agua **líquida**. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Calcular con agua líquida y después sumar la vaporización de
              todos los moles de agua
            correcta: true
            mensaje: |
              Eso es. Vaporizar cuesta energía, así que la reacción con vapor
              libera **menos**: hay que sumar los 44,03 kJ por cada uno de los
              9 moles de agua.
          - texto: >-
              Restar la vaporización, porque el vapor tiene más energía
            mensaje: |
              El vapor sí tiene más energía, y por eso la combustión libera
              menos. El signo va al revés de lo que parece: se **suma** a un
              número negativo, acercándolo a cero.
          - texto: >-
              Usar la entalpía de formación del agua gas, que se deduce
              dividiendo la líquida entre 44,03
            mensaje: |
              Se deduce **sumando**, no dividiendo:
              $\Delta H_f(\text{gas}) = -285{,}85 + 44{,}03 = -241{,}82$. Que
              es, por cierto, el valor que dan otros exámenes de esta misma
              asignatura directamente en la tabla.
          - texto: >-
              Nada: el estado del agua no afecta a la entalpía de combustión
            mensaje: |
              Afecta, y mucho: 9 moles por 44,03 son 396 kJ de diferencia
              sobre 5470, casi un 8 %. Es la diferencia entre el poder
              calorífico superior y el inferior de un combustible.

      - tipo: calcular
        titulo: La combustión del octano, con el agua en vapor
        pregunta: |
          ¿Cuánto vale $\Delta H^{0}$ de combustión del octano líquido
          generando vapor de agua?
        respuesta:
          tipo: numero
          valor: '-5074.4'
          tolerancia: 60
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-5470.7'
            mensaje: |
              Ese es con el agua **líquida**. El enunciado pide vapor: hay que
              sumar 9 · 44,03 = 396,3 kJ.
          - valor: '-5866.9'
            mensaje: |
              Has restado la vaporización en vez de sumarla. Con vapor la
              combustión libera **menos**, no más.
        pista: |
          Ajusta primero:
          $\mathrm{C_8H_{18}} + \tfrac{25}{2}\mathrm{O_2} \rightarrow
          8\,\mathrm{CO_2} + 9\,\mathrm{H_2O}$. Calcula con agua líquida y
          después corrige los nueve moles.
        desarrollo: |
          $$
          \Delta H_{\text{líq}} = \left[8(-393{,}50) + 9(-285{,}85)\right]
          - (-250{,}00) = -5470{,}65\ \text{kJ/mol}
          $$
          $$
          \Delta H_{\text{vap}} = -5470{,}65 + 9\cdot 44{,}03
          = -5074{,}38\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: El calor que hay que dar a un mol de agua
        pregunta: |
          Para llevar **un mol** de agua de 25 a 120 ºC a presión
          atmosférica, ¿cuánto calor hace falta?
        respuesta:
          tipo: numero
          valor: '50.35'
          tolerancia: 1
          formato: el calor en kJ/mol, con dos cifras decimales
        distractores:
          - valor: '6.32'
            mensaje: |
              Te has dejado la vaporización, que es con diferencia el tramo
              más caro: 44,03 de los 50,35 kJ. A 100 ºC el agua no sube de
              temperatura hasta que ha hervido entera.
          - valor: '44.03'
            mensaje: |
              Esa es solo la vaporización. Es el tramo más caro con
              diferencia, pero faltan los dos de calentar: subir el líquido de
              25 a 100 ºC y el vapor de 100 a 120.
        pista: |
          Son **tres** tramos y el del medio no cambia la temperatura:
          calentar el líquido de 25 a 100, vaporizarlo, y calentar el vapor de
          100 a 120.
        desarrollo: |
          $$
          q = \underbrace{\frac{75{,}31\cdot 75}{1000}}_{5{,}648}
          + \underbrace{44{,}03}_{\text{vaporizar}}
          + \underbrace{\frac{33{,}56\cdot 20}{1000}}_{0{,}671}
          = 50{,}35\ \text{kJ/mol}
          $$
          La vaporización se lleva el **87 %** del total.

      - tipo: calcular
        titulo: Y los kilos de agua
        pregunta: |
          Con el 80 % del calor de quemar 50 L de octano, ¿cuánta agua se
          puede llevar de 25 a 120 ºC?
        respuesta:
          tipo: numero
          valor: '458.3'
          tolerancia: 12
          formato: la masa de agua en kg, con una cifra decimal
        distractores:
          - valor: '572.9'
            mensaje: |
              Te has dejado el 80 %. El enunciado dice que solo esa fracción
              del calor se aprovecha; el resto se pierde.
          - valor: '3653'
            mensaje: |
              Has calentado el agua sin vaporizarla. Los 44 kJ/mol del cambio
              de fase son casi nueve décimas del coste, así que sin ellos sale
              ocho veces más agua.
        pista: |
          Tres pasos: los moles de octano que hay en 50 L, el calor total, y
          después dividir el 80 % de ese calor entre los 50,35 kJ que pide
          cada mol de agua.
        desarrollo: |
          $$
          m = 50\,000\cdot 0{,}72 = 36\,000\ \text{g}
          \;\Longrightarrow\;
          n = \frac{36\,000}{114} = 315{,}8\ \text{mol}
          $$
          $$
          Q = 315{,}8\cdot 5074{,}4 = 1{,}602\cdot 10^{6}\ \text{kJ}
          \qquad
          0{,}80\,Q = 1{,}282\cdot 10^{6}\ \text{kJ}
          $$
          $$
          n(\mathrm{H_2O}) = \frac{1{,}282\cdot 10^{6}}{50{,}35}
          = 25\,461\ \text{mol}
          \;\Longrightarrow\;
          m = 25\,461\cdot 18 = 458{,}3\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Ajustar la combustión:
              $\mathrm{C_8H_{18}} + \tfrac{25}{2}\mathrm{O_2} \rightarrow
              8\,\mathrm{CO_2} + 9\,\mathrm{H_2O}$.
          - texto: >-
              Con las entalpías de formación y el agua líquida salen
              −5470,65 kJ/mol.
          - texto: >-
              Como el enunciado pide vapor, se suman los 9 moles por
              44,03 kJ: −5074,38 kJ/mol.
          - texto: >-
              50 L a 0,72 g/mL son 36 kg, o sea 315,8 mol, que liberan
              1602 MJ; aprovechables, 1282 MJ.
          - texto: >-
              Cada mol de agua pide 50,35 kJ para ir de 25 a 120 ºC, sumando
              los tres tramos.
          - texto: >-
              Dividiendo, 25 461 mol de agua: **458,3 kg**.
          - texto: >-
              Como el agua pasa de 25 a 120 ºC, basta multiplicar su Cp por
              los 95 grados de salto.
            trampa: true
            mensaje: |
              Eso ignora el cambio de fase, que es el 87 % del coste. A 100 ºC
              el agua deja de subir de temperatura y se queda ahí hasta haber
              hervido entera: los 44,03 kJ/mol no calientan nada, solo separan
              las moléculas.

              Y hay un segundo error escondido en la misma frase: por encima
              de 100 ºC ya no es líquido, así que su Cp tampoco es el mismo.
              Son 33,56 en vez de 75,31.
        veredicto: |
          Un cambio de fase no es un detalle del enunciado: aquí decide el
          orden de magnitud de la respuesta. Sin él salen 3653 kg de agua en
          vez de 458.

    resolucion: |
      **Lo que se pide.** 3,00 de los 10 puntos del control. Son dos ideas, y
      las dos son sobre el **estado del agua**.

      ## 2.1 · La combustión, con el agua en vapor

      $$
      \mathrm{C_8H_{18}\,(l)} + \tfrac{25}{2}\,\mathrm{O_2\,(g)} \rightarrow
      8\,\mathrm{CO_2\,(g)} + 9\,\mathrm{H_2O\,(g)}
      $$

      La tabla da el agua **líquida**, así que se calcula con ella y se
      corrige después:

      $$
      \Delta H_{\text{líq}} = \left[8(-393{,}50)+9(-285{,}85)\right] + 250{,}00
      = -5470{,}65\ \text{kJ/mol}
      $$
      $$
      \boxed{\;\Delta H_{\text{vap}} = -5470{,}65 + 9\cdot 44{,}03
      = -5074{,}38\ \text{kJ/mol}\;}
      $$

      **El signo confunde y conviene razonarlo, no memorizarlo.** Vaporizar
      cuesta energía; si el agua sale como vapor, esa energía no queda
      disponible, así que la reacción libera menos y el número se acerca a
      cero. Son 396 kJ sobre 5470: casi un 8 %.

      Es exactamente la diferencia entre el **poder calorífico superior** y el
      **inferior** de un combustible, y en la práctica manda el inferior,
      porque los gases de escape salen calientes y el agua no se condensa.

      ## 2.2 · El agua que se puede calentar

      Primero el octano:

      $$
      m = 50\,000\ \text{mL}\cdot 0{,}72 = 36\ \text{kg}
      \;\Longrightarrow\;
      n = \frac{36\,000}{114} = 315{,}8\ \text{mol}
      $$
      $$
      Q = 315{,}8\cdot 5074{,}4 = 1602\ \text{MJ}
      \qquad
      0{,}80\,Q = 1282\ \text{MJ}
      $$

      Y ahora lo que cuesta un mol de agua. **Son tres tramos, no uno**, y el
      del medio no sube ni un grado:

      | tramo | cuenta | kJ/mol |
      |---|---|---|
      | líquido de 25 a 100 ºC | $75{,}31\cdot 75$ | 5,648 |
      | **vaporizar a 100 ºC** | dato | **44,03** |
      | vapor de 100 a 120 ºC | $33{,}56\cdot 20$ | 0,671 |
      | | | **50,35** |

      $$
      n(\mathrm{H_2O}) = \frac{1{,}282\cdot 10^{6}}{50{,}35} = 25\,461\ \text{mol}
      \;\Longrightarrow\;
      \boxed{\;m = 458{,}3\ \text{kg}\;}
      $$

      **La vaporización se lleva el 87 % del calor.** Quien la olvida no comete
      un error del 10 %: obtiene 3653 kg, ocho veces más. Es el fallo que más
      caro sale de todo el ejercicio, y se evita mirando el enunciado: si el
      intervalo de temperaturas cruza los 100 ºC, hay cambio de fase por medio.

      Y el tercer tramo es casi despreciable —0,67 de 50,35— pero conviene
      escribirlo igual: cuesta un renglón y demuestra que sabes que el vapor
      tiene su propio Cp.
