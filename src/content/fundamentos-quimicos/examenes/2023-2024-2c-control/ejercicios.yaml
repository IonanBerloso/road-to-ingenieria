ejercicios:
  # ── El primero, 4,00 de los 10, y el ejercicio más largo del corpus de
  #    Química: encadena Hess, Kirchhoff, la relación entre ΔH y ΔU, y una
  #    discusión de espontaneidad. La trampa está en la primera línea y es
  #    fácil de pasar por alto: la reacción produce agua EN VAPOR y la tabla
  #    solo da la entalpía del agua líquida.
  - id: exfq2324-2c-control-1-la-hidracina-de-los-cohetes
    titulo: La hidracina de los cohetes, y un agua que hay que vaporizar antes de usarla
    fuente: >-
      Ejercicio 1 · Control del segundo cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      La reacción entre la hidracina (N2H4) y el peróxido de hidrógeno (H2O2)
      se emplea para la propulsión de cohetes espaciales, según la reacción:

      $$
      \mathrm{N_2H_4\,(l)} + 2\,\mathrm{H_2O_2\,(l)} \rightarrow \mathrm{N_2\,(g)} + 4\,\mathrm{H_2O\,(g)} \qquad \Delta H^{0}_r = -642\ \mathrm{kJ}
      $$

      **1.1.** Calcula la entalpía estandar de formación para la hidracina.

      **1.2.** Calcula los cambios de entalpía, entropía, energía interna y
      energía libre de Gibbs, para la reacción de formación de la hidracina a
      100 ºC.

      **1.3.** ¿Como afecta la temperatura a la espontaneidad de la reacción
      de formación de la hidracina?

      **Datos:** ΔHvaporización (H2O) = 44,03 kJ/mol

      | Sustancia | ΔH°f (kJ/mol) | S° (J/mol·K) | Cp° (J/mol·K) |
      |---|---|---|---|
      | H2O2 (l) | −187,8 | 109,6 | |
      | N2H4 (l) | | 121,2 | 139,3 |
      | H2O (l) | −285,8 | 69,9 | |
      | N2 (g) | | 191,5 | 29,1 |
      | H2 (g) | | 130,6 | 28,8 |
    pide: >-
      La entalpía de formación de la hidracina, y para su reacción de
      formación a 100 °C la entalpía, la entropía, la energía interna y la
      energía libre, más el efecto de la temperatura.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción produce agua **en vapor** y la tabla solo da la entalpía
          de formación del agua **líquida**. ¿Qué hay que hacer?
        opciones:
          - texto: Sumarle la entalpía de vaporización, porque el dato de la tabla es del líquido
            correcta: true
            mensaje: |
              Ese es el eslabón que decide el apartado. Formar agua gaseosa
              cuesta 44,03 kJ/mol menos de energía liberada que formar
              líquida, así que
              $\Delta H^{0}_f(\mathrm{H_2O,\,g}) = -285{,}8 + 44{,}03 = -241{,}77$.
          - texto: Usar el dato del líquido tal cual; la diferencia es despreciable
            mensaje: |
              Son 44 kJ por mol y hay **cuatro** moles de agua: 176 kJ de
              diferencia sobre una reacción de 642. No es despreciable, es un
              27 %.
          - texto: Restarle la entalpía de vaporización
            mensaje: |
              El signo va al revés. Vaporizar **consume** energía, así que el
              vapor está más arriba en entalpía que el líquido: su entalpía de
              formación es menos negativa, o sea mayor.
          - texto: Buscar el dato del vapor en otra tabla
            mensaje: |
              No hace falta y en el examen no la habrá: el enunciado da la
              entalpía de vaporización precisamente para que lo construyas tú.
              Cuando un dato aparece suelto entre los datos, casi siempre es
              porque hay que usarlo en un paso que no se ve a primera vista.

      - tipo: calcular
        titulo: La entalpía de formación de la hidracina
        pregunta: |
          Aplicando Hess a la reacción del enunciado, ¿cuánto vale
          $\Delta H^{0}_f$ de la hidracina, en kJ/mol?
        respuesta:
          tipo: numero
          valor: '50.52'
          tolerancia: 0.5
          formato: un número, con dos decimales, en kilojulios por mol
        distractores:
          - valor: '-125.6'
            mensaje: |
              Has usado la entalpía del agua **líquida**, $-285{,}8$, sin
              vaporizarla. La reacción produce vapor, y son cuatro moles: el
              error arrastra $4 \times 44{,}03 = 176$ kJ.
          - valor: '-50.52'
            mensaje: |
              El módulo está bien y el signo no. Despeja con cuidado: la
              hidracina está entre los **reactivos**, así que su entalpía entra
              restando en el sumatorio y al despejarla cambia de signo otra
              vez.
          - valor: '-137.28'
            mensaje: |
              Parece que has olvidado el coeficiente 2 del peróxido de
              hidrógeno. Hay dos moles, así que su entalpía va multiplicada
              por dos.
        pista: |
          Primero pasa el agua a vapor:
          $-285{,}8 + 44{,}03$. Después
          $\Delta H^{0}_r = \sum \text{productos} - \sum \text{reactivos}$ y
          despeja.
        desarrollo: |
          El agua del enunciado es vapor:

          $$
          \Delta H^{0}_f(\mathrm{H_2O,\,g}) = -285{,}8 + 44{,}03 = -241{,}77\ \mathrm{kJ/mol}
          $$

          Y el sumatorio de Hess:

          $$
          -642 = \left[4(-241{,}77) + 0\right] - \left[\Delta H^{0}_f(\mathrm{N_2H_4}) + 2(-187{,}8)\right]
          $$

          $$
          -642 = -967{,}08 - \Delta H^{0}_f(\mathrm{N_2H_4}) + 375{,}6 = -591{,}48 - \Delta H^{0}_f(\mathrm{N_2H_4})
          $$

          $$
          \Delta H^{0}_f(\mathrm{N_2H_4}) = -591{,}48 + 642 = 50{,}52\ \mathrm{kJ/mol}
          $$

          Sale **positiva**, y tiene sentido: la hidracina es un compuesto
          inestable que almacena energía, que es justo lo que se le pide a un
          propulsante.

      - tipo: calcular
        titulo: La entropía de formación a 100 °C
        pregunta: |
          Para $\mathrm{N_2\,(g)} + 2\,\mathrm{H_2\,(g)} \rightarrow \mathrm{N_2H_4\,(l)}$
          a 373 K, ¿cuánto vale $\Delta S$, en J/(mol·K)?
        respuesta:
          tipo: numero
          valor: '-319.7'
          tolerancia: 1
          formato: un número, con un decimal, en julios por mol y kelvin
        distractores:
          - valor: '-331.5'
            mensaje: |
              Ese es el valor a 298 K. El apartado pide a 100 °C, así que hay
              que corregir con Kirchhoff, que para la entropía lleva un
              logaritmo.
          - valor: '319.7'
            mensaje: |
              Signo cambiado. La reacción convierte tres moles de gas en uno
              de líquido: el desorden **cae** en picado, así que $\Delta S$ es
              muy negativa.
          - valor: '-452.7'
            mensaje: |
              Parece que has sumado las entropías de los reactivos sin restar
              la del producto. El sumatorio es productos menos reactivos.
        pista: |
          Primero $\Delta S^{0}$ a 298 K, y después
          $\Delta S(T) = \Delta S^{0} + \Delta C_p \ln(T/298)$, con
          $\Delta C_p = 52{,}6$.
        desarrollo: |
          A 298 K:

          $$
          \Delta S^{0} = 121{,}2 - \left[191{,}5 + 2(130{,}6)\right] = -331{,}5\ \mathrm{J/(mol\,K)}
          $$

          Con $\Delta C_p = 139{,}3 - \left[29{,}1 + 2(28{,}8)\right] = 52{,}6$:

          $$
          \Delta S(373) = -331{,}5 + 52{,}6 \times \ln\frac{373}{298} = -331{,}5 + 11{,}8 = -319{,}7
          $$

      - tipo: calcular
        titulo: La energía libre a 100 °C
        pregunta: |
          Con $\Delta H(373) = 54{,}47$ kJ/mol, ¿cuánto vale $\Delta G$ a
          373 K, en kJ/mol?
        respuesta:
          tipo: numero
          valor: '173.7'
          tolerancia: 1
          formato: un número, con un decimal, en kilojulios por mol
        distractores:
          - valor: '-173.7'
            mensaje: |
              Signo cambiado. $\Delta S$ es negativa, así que $-T\Delta S$ es
              **positivo** y suma: dos negativos que se multiplican dan
              positivo.
          - valor: '54.47'
            mensaje: |
              Ese es $\Delta H$. Falta restarle $T\Delta S$, que aquí no es
              una corrección pequeña: vale 119 kJ, más del doble.
          - valor: '119298'
            mensaje: |
              Has mezclado unidades: $\Delta H$ en kilojulios y $\Delta S$ en
              julios. Hay que pasarlas a la misma antes de restar.
        pista: |
          $\Delta G = \Delta H - T\Delta S$, con las dos en las mismas
          unidades.
        desarrollo: |
          $$
          \Delta G = 54{,}47 - 373 \times (-0{,}3197) = 54{,}47 + 119{,}25 = 173{,}72\ \mathrm{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 1.3. Una pieza es falsa.
        piezas:
          - texto: 'La reacción de formación de la hidracina tiene ΔH positiva, +50,52 kJ/mol a 298 K: es endotérmica.'
          - texto: 'Y tiene ΔS muy negativa, −331,5 J/(mol·K), porque tres moles de gas se convierten en uno de líquido.'
          - texto: 'En ΔG = ΔH − TΔS, con ΔH > 0 y ΔS < 0 los dos términos son positivos, así que ΔG > 0 a cualquier temperatura.'
          - texto: 'La reacción de formación de la hidracina no es espontánea nunca, y subir la temperatura la aleja todavía más.'
          - texto: 'Como la reacción es endotérmica, subir la temperatura acabará haciéndola espontánea.'
            trampa: true
            mensaje: |
              Esa regla vale cuando $\Delta S$ es **positiva**: entonces subir
              $T$ agranda el término $-T\Delta S$ negativo y termina ganando.
              Aquí $\Delta S$ es negativa, así que $-T\Delta S$ es positivo y
              crece con la temperatura: subirla empeora. Hay cuatro
              combinaciones de signos y solo dos dependen de $T$.
    resolucion: |
      **1.1 · La entalpía de formación de la hidracina.** Lo primero es ver
      que el agua de la reacción es **vapor** y el dato de la tabla es del
      líquido. Por eso el enunciado da la entalpía de vaporización suelta:

      $$
      \Delta H^{0}_f(\mathrm{H_2O,\,g}) = -285{,}8 + 44{,}03 = -241{,}77\ \mathrm{kJ/mol}
      $$

      Con eso, Hess sobre la reacción del enunciado:

      $$
      -642 = 4(-241{,}77) - \left[\Delta H^{0}_f(\mathrm{N_2H_4}) + 2(-187{,}8)\right]
      $$

      $$
      \Delta H^{0}_f(\mathrm{N_2H_4}) = +50{,}52\ \mathrm{kJ/mol}
      $$

      Positiva, que es lo que cabe esperar de un propulsante: la hidracina
      guarda energía y la suelta al reaccionar.

      **1.2 · Las cuatro magnitudes a 100 °C.** Ahora la reacción es **otra**,
      la de formación:

      $$
      \mathrm{N_2\,(g)} + 2\,\mathrm{H_2\,(g)} \;\longrightarrow\; \mathrm{N_2H_4\,(l)}
      $$

      A 298 K, con los datos de la tabla:

      $$
      \Delta H^{0} = 50{,}52\ \mathrm{kJ/mol} \qquad \Delta S^{0} = 121{,}2 - \left[191{,}5 + 2(130{,}6)\right] = -331{,}5\ \mathrm{J/(mol\,K)}
      $$

      Para llevarlas a 373 K hace falta Kirchhoff, y para eso $\Delta C_p$:

      $$
      \Delta C_p = 139{,}3 - \left[29{,}1 + 2(28{,}8)\right] = 52{,}6\ \mathrm{J/(mol\,K)}
      $$

      $$
      \Delta H(373) = 50520 + 52{,}6 \times 75 = 54465\ \mathrm{J} = 54{,}47\ \mathrm{kJ/mol}
      $$

      $$
      \Delta S(373) = -331{,}5 + 52{,}6 \times \ln\frac{373}{298} = -319{,}7\ \mathrm{J/(mol\,K)}
      $$

      Ojo a la diferencia entre las dos correcciones: la de la entalpía es
      **lineal** en la temperatura y la de la entropía lleva un **logaritmo**.
      Es el error más repetido del tema.

      La energía interna sale de $\Delta H$ descontando el trabajo de
      expansión, y aquí $\Delta n$ de gases es $0 - 3 = -3$:

      $$
      \Delta U = \Delta H - \Delta n\,RT = 54465 - (-3)(8{,}314)(373) = 63768\ \mathrm{J} = 63{,}77\ \mathrm{kJ/mol}
      $$

      Y la energía libre:

      $$
      \Delta G = \Delta H - T\Delta S = 54{,}47 - 373(-0{,}3197) = +173{,}72\ \mathrm{kJ/mol}
      $$

      **1.3 · El efecto de la temperatura.** Aquí no hay nada que calcular,
      solo mirar los signos. $\Delta H > 0$ y $\Delta S < 0$, así que en
      $\Delta G = \Delta H - T\Delta S$ **los dos términos son positivos**:

      $$
      \Delta G > 0 \quad \text{para cualquier } T
      $$

      La formación de la hidracina **no es espontánea a ninguna temperatura**,
      y subirla la aleja más porque agranda el término $-T\Delta S$.

      Merece la pena tener las cuatro combinaciones en la cabeza:

      | $\Delta H$ | $\Delta S$ | espontánea… |
      |---|---|---|
      | − | + | siempre |
      | + | − | nunca ← **este caso** |
      | − | − | a temperatura baja |
      | + | + | a temperatura alta |

      Y una lectura de ingeniería: que formar hidracina no sea espontáneo es
      exactamente lo que la hace útil. Fabricarla cuesta energía, y esa
      energía es la que devuelve el cohete.

  # ── Dos ideas en un ejercicio: que la tabla da el agua líquida y el
  #    enunciado pide vapor, y que calentar agua de 25 a 120 ºC son TRES
  #    tramos y no uno. Las dos se pagan igual de caras y las dos se ven en el
  #    resultado: sin corregir el cambio de fase, la masa de agua sale un 8 %
  #    alta; sin contar la vaporización, casi nueve veces mayor.
  - id: exfq2324-2c-control-2-el-octano-y-los-cuatrocientos-kilos-de-agua
    titulo: Cincuenta litros de gasolina, y el agua que llegan a hervir
    fuente: >-
      Ejercicio 2 · Control del segundo cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      En la práctica, la gasolina puede considerarse como octano (C8H18).
      Calcula:

      **2.1** La entalpía estándar de combustión del octano líquido, en
      kJ/mol, sabiendo que se generan CO2 y vapor de H2O.

      **2.2** El 80% del calor generado en la combustión de 50 L de octano
      líquido, se emplean para calentar agua de 25 hasta 120 ºC, a presión
      atmosférica. Calcula la masa de agua que puede calentarse.

      **Datos:** densidad del octano = 0,72 g/mL · Cp (H2O (l)) =
      75,31 J/mol K · ΔHvaporización (H2O (l)) = 44,03 kJ/mol · Cp (H2O (g)) =
      33,56 J/mol K.

      | sustancia | ΔH⁰f (kJ/mol) |
      |---|---|
      | CO2 (g) | −393,50 |
      | H2O (l) | −285,85 |
      | C8H18 (l) | −250,00 |
    pide: >-
      La entalpía de combustión del octano con el agua en vapor, y la masa de
      agua que se puede llevar de 25 a 120 ºC con el 80 % de ese calor.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la combustión «sabiendo que se generan CO2 y
          **vapor** de H2O», y la tabla solo da la entalpía de formación del
          agua **líquida**. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Calcular con agua líquida y después sumar la vaporización de
              todos los moles de agua
            correcta: true
            mensaje: |
              Eso es. Vaporizar cuesta energía, así que la reacción con vapor
              libera **menos**: hay que sumar los 44,03 kJ por cada uno de los
              9 moles de agua.
          - texto: >-
              Restar la vaporización, porque el vapor tiene más energía
            mensaje: |
              El vapor sí tiene más energía, y por eso la combustión libera
              menos. El signo va al revés de lo que parece: se **suma** a un
              número negativo, acercándolo a cero.
          - texto: >-
              Usar la entalpía de formación del agua gas, que se deduce
              dividiendo la líquida entre 44,03
            mensaje: |
              Se deduce **sumando**, no dividiendo:
              $\Delta H_f(\text{gas}) = -285{,}85 + 44{,}03 = -241{,}82$. Que
              es, por cierto, el valor que dan otros exámenes de esta misma
              asignatura directamente en la tabla.
          - texto: >-
              Nada: el estado del agua no afecta a la entalpía de combustión
            mensaje: |
              Afecta, y mucho: 9 moles por 44,03 son 396 kJ de diferencia
              sobre 5470, casi un 8 %. Es la diferencia entre el poder
              calorífico superior y el inferior de un combustible.

      - tipo: calcular
        titulo: La combustión del octano, con el agua en vapor
        pregunta: |
          ¿Cuánto vale $\Delta H^{0}$ de combustión del octano líquido
          generando vapor de agua?
        respuesta:
          tipo: numero
          valor: '-5074.4'
          tolerancia: 60
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-5470.7'
            mensaje: |
              Ese es con el agua **líquida**. El enunciado pide vapor: hay que
              sumar 9 · 44,03 = 396,3 kJ.
          - valor: '-5866.9'
            mensaje: |
              Has restado la vaporización en vez de sumarla. Con vapor la
              combustión libera **menos**, no más.
        pista: |
          Ajusta primero:
          $\mathrm{C_8H_{18}} + \tfrac{25}{2}\mathrm{O_2} \rightarrow
          8\,\mathrm{CO_2} + 9\,\mathrm{H_2O}$. Calcula con agua líquida y
          después corrige los nueve moles.
        desarrollo: |
          $$
          \Delta H_{\text{líq}} = \left[8(-393{,}50) + 9(-285{,}85)\right]
          - (-250{,}00) = -5470{,}65\ \text{kJ/mol}
          $$
          $$
          \Delta H_{\text{vap}} = -5470{,}65 + 9\cdot 44{,}03
          = -5074{,}38\ \text{kJ/mol}
          $$

      - tipo: calcular
        titulo: El calor que hay que dar a un mol de agua
        pregunta: |
          Para llevar **un mol** de agua de 25 a 120 ºC a presión
          atmosférica, ¿cuánto calor hace falta?
        respuesta:
          tipo: numero
          valor: '50.35'
          tolerancia: 1
          formato: el calor en kJ/mol, con dos cifras decimales
        distractores:
          - valor: '6.32'
            mensaje: |
              Te has dejado la vaporización, que es con diferencia el tramo
              más caro: 44,03 de los 50,35 kJ. A 100 ºC el agua no sube de
              temperatura hasta que ha hervido entera.
          - valor: '44.03'
            mensaje: |
              Esa es solo la vaporización. Es el tramo más caro con
              diferencia, pero faltan los dos de calentar: subir el líquido de
              25 a 100 ºC y el vapor de 100 a 120.
        pista: |
          Son **tres** tramos y el del medio no cambia la temperatura:
          calentar el líquido de 25 a 100, vaporizarlo, y calentar el vapor de
          100 a 120.
        desarrollo: |
          $$
          q = \underbrace{\frac{75{,}31\cdot 75}{1000}}_{5{,}648}
          + \underbrace{44{,}03}_{\text{vaporizar}}
          + \underbrace{\frac{33{,}56\cdot 20}{1000}}_{0{,}671}
          = 50{,}35\ \text{kJ/mol}
          $$
          La vaporización se lleva el **87 %** del total.

      - tipo: calcular
        titulo: Y los kilos de agua
        pregunta: |
          Con el 80 % del calor de quemar 50 L de octano, ¿cuánta agua se
          puede llevar de 25 a 120 ºC?
        respuesta:
          tipo: numero
          valor: '458.3'
          tolerancia: 12
          formato: la masa de agua en kg, con una cifra decimal
        distractores:
          - valor: '572.9'
            mensaje: |
              Te has dejado el 80 %. El enunciado dice que solo esa fracción
              del calor se aprovecha; el resto se pierde.
          - valor: '3653'
            mensaje: |
              Has calentado el agua sin vaporizarla. Los 44 kJ/mol del cambio
              de fase son casi nueve décimas del coste, así que sin ellos sale
              ocho veces más agua.
        pista: |
          Tres pasos: los moles de octano que hay en 50 L, el calor total, y
          después dividir el 80 % de ese calor entre los 50,35 kJ que pide
          cada mol de agua.
        desarrollo: |
          $$
          m = 50\,000\cdot 0{,}72 = 36\,000\ \text{g}
          \;\Longrightarrow\;
          n = \frac{36\,000}{114} = 315{,}8\ \text{mol}
          $$
          $$
          Q = 315{,}8\cdot 5074{,}4 = 1{,}602\cdot 10^{6}\ \text{kJ}
          \qquad
          0{,}80\,Q = 1{,}282\cdot 10^{6}\ \text{kJ}
          $$
          $$
          n(\mathrm{H_2O}) = \frac{1{,}282\cdot 10^{6}}{50{,}35}
          = 25\,461\ \text{mol}
          \;\Longrightarrow\;
          m = 25\,461\cdot 18 = 458{,}3\ \text{kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Ajustar la combustión:
              $\mathrm{C_8H_{18}} + \tfrac{25}{2}\mathrm{O_2} \rightarrow
              8\,\mathrm{CO_2} + 9\,\mathrm{H_2O}$.
          - texto: >-
              Con las entalpías de formación y el agua líquida salen
              −5470,65 kJ/mol.
          - texto: >-
              Como el enunciado pide vapor, se suman los 9 moles por
              44,03 kJ: −5074,38 kJ/mol.
          - texto: >-
              50 L a 0,72 g/mL son 36 kg, o sea 315,8 mol, que liberan
              1602 MJ; aprovechables, 1282 MJ.
          - texto: >-
              Cada mol de agua pide 50,35 kJ para ir de 25 a 120 ºC, sumando
              los tres tramos.
          - texto: >-
              Dividiendo, 25 461 mol de agua: **458,3 kg**.
          - texto: >-
              Como el agua pasa de 25 a 120 ºC, basta multiplicar su Cp por
              los 95 grados de salto.
            trampa: true
            mensaje: |
              Eso ignora el cambio de fase, que es el 87 % del coste. A 100 ºC
              el agua deja de subir de temperatura y se queda ahí hasta haber
              hervido entera: los 44,03 kJ/mol no calientan nada, solo separan
              las moléculas.

              Y hay un segundo error escondido en la misma frase: por encima
              de 100 ºC ya no es líquido, así que su Cp tampoco es el mismo.
              Son 33,56 en vez de 75,31.
        veredicto: |
          Un cambio de fase no es un detalle del enunciado: aquí decide el
          orden de magnitud de la respuesta. Sin él salen 3653 kg de agua en
          vez de 458.

    resolucion: |
      **Lo que se pide.** 3,00 de los 10 puntos del control. Son dos ideas, y
      las dos son sobre el **estado del agua**.

      ## 2.1 · La combustión, con el agua en vapor

      $$
      \mathrm{C_8H_{18}\,(l)} + \tfrac{25}{2}\,\mathrm{O_2\,(g)} \rightarrow
      8\,\mathrm{CO_2\,(g)} + 9\,\mathrm{H_2O\,(g)}
      $$

      La tabla da el agua **líquida**, así que se calcula con ella y se
      corrige después:

      $$
      \Delta H_{\text{líq}} = \left[8(-393{,}50)+9(-285{,}85)\right] + 250{,}00
      = -5470{,}65\ \text{kJ/mol}
      $$
      $$
      \boxed{\;\Delta H_{\text{vap}} = -5470{,}65 + 9\cdot 44{,}03
      = -5074{,}38\ \text{kJ/mol}\;}
      $$

      **El signo confunde y conviene razonarlo, no memorizarlo.** Vaporizar
      cuesta energía; si el agua sale como vapor, esa energía no queda
      disponible, así que la reacción libera menos y el número se acerca a
      cero. Son 396 kJ sobre 5470: casi un 8 %.

      Es exactamente la diferencia entre el **poder calorífico superior** y el
      **inferior** de un combustible, y en la práctica manda el inferior,
      porque los gases de escape salen calientes y el agua no se condensa.

      ## 2.2 · El agua que se puede calentar

      Primero el octano:

      $$
      m = 50\,000\ \text{mL}\cdot 0{,}72 = 36\ \text{kg}
      \;\Longrightarrow\;
      n = \frac{36\,000}{114} = 315{,}8\ \text{mol}
      $$
      $$
      Q = 315{,}8\cdot 5074{,}4 = 1602\ \text{MJ}
      \qquad
      0{,}80\,Q = 1282\ \text{MJ}
      $$

      Y ahora lo que cuesta un mol de agua. **Son tres tramos, no uno**, y el
      del medio no sube ni un grado:

      | tramo | cuenta | kJ/mol |
      |---|---|---|
      | líquido de 25 a 100 ºC | $75{,}31\cdot 75$ | 5,648 |
      | **vaporizar a 100 ºC** | dato | **44,03** |
      | vapor de 100 a 120 ºC | $33{,}56\cdot 20$ | 0,671 |
      | | | **50,35** |

      $$
      n(\mathrm{H_2O}) = \frac{1{,}282\cdot 10^{6}}{50{,}35} = 25\,461\ \text{mol}
      \;\Longrightarrow\;
      \boxed{\;m = 458{,}3\ \text{kg}\;}
      $$

      **La vaporización se lleva el 87 % del calor.** Quien la olvida no comete
      un error del 10 %: obtiene 3653 kg, ocho veces más. Es el fallo que más
      caro sale de todo el ejercicio, y se evita mirando el enunciado: si el
      intervalo de temperaturas cruza los 100 ºC, hay cambio de fase por medio.

      Y el tercer tramo es casi despreciable —0,67 de 50,35— pero conviene
      escribirlo igual: cuesta un renglón y demuestra que sabes que el vapor
      tiene su propio Cp.

  # ── El tercero, 2,00 puntos y ninguna cuenta: cinco procesos y el signo de
  #    su entropía, razonado. Es el ejercicio más barato del examen y el que
  #    más se contesta a medias, porque decir «aumenta» sin decir por qué no
  #    vale nada.
  - id: exfq2324-2c-control-3-cinco-signos-de-entropia
    titulo: Cinco procesos, cinco signos, y una razón para cada uno
    fuente: >-
      Ejercicio 3 · Control del segundo cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Indica como cambiará la entropía para los siguientes procesos,
      **razonando la respuesta**:

      a. Solidificación del agua.

      b. Evaporación del alcohol isopropílico.

      c. Sublimación de la cafeína.

      d. Precipitación del nitrato de plata, a partir de una disolución de sus
      iones.

      e. Descomposición del pentacloruro de fósforo (g) en tricloruro de
      fósforo (g) y cloro (g).
    pide: El signo de la variación de entropía de los cinco procesos, con su razón.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el criterio que resuelve los cinco de un vistazo?
        opciones:
          - texto: Mirar si el proceso aumenta la libertad de movimiento de las partículas
            correcta: true
            mensaje: |
              Ese es el criterio único. La entropía mide de cuántas maneras se
              pueden colocar las partículas, así que sube siempre que ganen
              sitio o libertad: sólido → líquido → gas, y menos moles → más
              moles de gas.
          - texto: Mirar si el proceso es exotérmico o endotérmico
            mensaje: |
              Eso es la entalpía, no la entropía. Son cosas distintas y se
              pueden mover en cualquier combinación: hay procesos exotérmicos
              con entropía creciente y decreciente.
          - texto: Mirar si el proceso es espontáneo
            mensaje: |
              La espontaneidad depende de la entropía **y** de la entalpía a
              la vez, así que no sirve para deducir una de las dos. Además el
              agua se congela sola y su entropía baja.
          - texto: Contar los moles totales antes y después
            mensaje: |
              Contar moles funciona bien en el apartado e, pero no dice nada
              en los cuatro primeros, donde el número de partículas no cambia
              y lo que cambia es el **estado**.

      - tipo: calcular
        titulo: Cuántos aumentan
        pregunta: |
          De los cinco procesos, ¿en cuántos aumenta la entropía?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Repasa la sublimación: pasar de sólido directamente a gas es el
              salto de desorden más grande de todos, así que cuenta entre los
              que aumentan.
          - valor: '4'
            mensaje: |
              Cuidado con la precipitación: unos iones sueltos moviéndose por
              la disolución que se ordenan en un cristal **pierden** libertad,
              así que ahí la entropía baja.
          - valor: '5'
            mensaje: |
              Dos de los cinco la bajan. Solidificar y precipitar son los dos
              procesos de ordenar que hay en la lista.
        pista: |
          Van hacia arriba los que dan más libertad de movimiento; hacia abajo
          los que ordenan.
        desarrollo: |
          Aumentan los apartados **b** (líquido a gas), **c** (sólido a gas) y
          **e** (un mol de gas pasa a dos). Bajan **a** (líquido a sólido) y
          **d** (iones en disolución a sólido).

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a · Solidificación del agua: de líquido a sólido, las moléculas quedan fijas en la red. ΔS < 0.'
          - texto: 'b · Evaporación del isopropílico: de líquido a gas, las moléculas se separan y ganan libertad. ΔS > 0.'
          - texto: 'c · Sublimación de la cafeína: de sólido directamente a gas, el mayor salto de desorden posible. ΔS > 0.'
          - texto: 'd · Precipitación del nitrato de plata: iones sueltos en disolución que se ordenan en un cristal. ΔS < 0.'
          - texto: 'e · PCl₅ (g) → PCl₃ (g) + Cl₂ (g): un mol de gas pasa a dos, así que hay más partículas moviéndose. ΔS > 0.'
          - texto: 'd · La precipitación aumenta la entropía porque se forma una fase nueva y hay más variedad de estados.'
            trampa: true
            mensaje: |
              «Más fases» no es «más entropía». Lo que cuenta es la libertad de
              las partículas, y unos iones que estaban solvatados y moviéndose
              por toda la disolución pasan a estar fijos en posiciones
              concretas de un cristal. Pierden libertad, y la entropía baja.
    resolucion: |
      **El criterio, uno solo.** La entropía mide de cuántas maneras
      distinguibles se pueden colocar las partículas de un sistema. Sube
      siempre que ganen libertad de movimiento o sitio donde estar, y baja
      cuando se ordenan. Con eso los cinco salen sin calcular nada.

      | | proceso | qué pasa | ΔS |
      |---|---|---|---|
      | a | solidificación del agua | líquido → sólido, moléculas fijas en la red | **< 0** |
      | b | evaporación del isopropílico | líquido → gas, se separan | **> 0** |
      | c | sublimación de la cafeína | sólido → gas, el salto mayor | **> 0** |
      | d | precipitación del AgNO₃ | iones solvatados → cristal | **< 0** |
      | e | descomposición del PCl₅ | 1 mol de gas → 2 moles de gas | **> 0** |

      **Los tres que suben y los dos que bajan**, con su razón concreta, que
      es lo que el enunciado pide al decir «razonando la respuesta»:

      - En **b** y **c** manda el cambio de estado. El orden de entropía es
        siempre sólido < líquido < gas, así que cualquier proceso que suba en
        esa escala aumenta la entropía. La sublimación es el que más, porque
        se salta un peldaño.
      - En **e** no hay cambio de estado —todo es gas— y manda el **número de
        moles gaseosos**: uno se convierte en dos, así que hay el doble de
        partículas moviéndose por el mismo sitio.
      - En **a** y **d** el sistema se ordena. Congelar fija las moléculas en
        una red, y precipitar saca unos iones que se movían por toda la
        disolución para colocarlos en posiciones concretas de un cristal.

      **Dónde se pierden los puntos.** No en el signo —la mayoría los acierta—
      sino en la razón. «Aumenta porque es una evaporación» es describir el
      proceso, no explicarlo; lo que se puntúa es nombrar **qué gana o pierde
      libertad**. Y el apartado d es el que más falla, porque «se forma un
      sólido nuevo» suena a que pasan más cosas, cuando lo que hay es menos
      libertad.

      Un aviso que vale para el examen entero: que la entropía del **sistema**
      baje no impide que el proceso ocurra solo. El agua se congela sola por
      debajo de 0 °C, y el nitrato de plata precipita solo: en los dos casos
      el calor que sueltan aumenta la entropía del entorno más de lo que baja
      la suya.

  # ── El cuarto, 1,00 punto, y es el ejercicio más corto del corpus de
  #    Química: dos restas y un cociente. Está aquí porque es el ejemplo
  #    perfecto del caso ΔH<0 con ΔS<0, que es el que se falla.
  - id: exfq2324-2c-control-4-la-peste-del-estano
    titulo: La peste del estaño, y por qué solo ataca en invierno
    fuente: >-
      Ejercicio 4 · Control del segundo cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Los tubos de estaño de los órganos de las iglesias, sufren la "peste del
      estaño", esto es, el estaño metálico original se convierte en estaño
      gris (compuesto no-metálico, en forma de polvo). Partiendo de los
      siguientes datos, indica por debajo de qué temperatura se produce dicha
      peste del estaño.

      **Datos:**

      | | ΔH°f (kJ/mol) | S° (J/mol·K) |
      |---|---|---|
      | Sn (blanco) | 0,00 | 51,55 |
      | Sn (gris) | −2,09 | 44,14 |
    pide: La temperatura por debajo de la cual el estaño blanco se convierte en gris.

    pasos:
      - tipo: reconocer
        pregunta: |
          La transformación es Sn (blanco) → Sn (gris), con $\Delta H < 0$ y
          $\Delta S < 0$. ¿Qué dice eso de la temperatura?
        opciones:
          - texto: Que será espontánea por debajo de cierta temperatura, y no por encima
            correcta: true
            mensaje: |
              Ese es el caso. Con los dos negativos, $\Delta H$ empuja a favor
              y $-T\Delta S$ en contra, y el segundo crece con la temperatura:
              hay un punto en que se igualan y a partir de ahí gana el que
              frena.
          - texto: Que será espontánea por encima de cierta temperatura
            mensaje: |
              Eso pasa con $\Delta H > 0$ y $\Delta S > 0$, donde subir la
              temperatura ayuda. Aquí es al revés: el término entrópico juega
              en contra y subir $T$ lo agranda.
          - texto: Que será espontánea a cualquier temperatura, porque libera energía
            mensaje: |
              Liberar energía ayuda pero no decide solo. Si $\Delta S$ es
              negativa, a temperatura suficiente el término $-T\Delta S$
              supera a $\Delta H$ y el proceso deja de ocurrir.
          - texto: Que no será espontánea nunca
            mensaje: |
              Ese es el caso contrario, $\Delta H > 0$ con $\Delta S < 0$. Y
              además contradice el enunciado: la peste del estaño existe, así
              que en algún régimen de temperatura ocurre.

      - tipo: calcular
        titulo: La entropía de la transformación
        pregunta: |
          ¿Cuánto vale $\Delta S$ de la transformación, en J/(mol·K)?
        respuesta:
          tipo: numero
          valor: '-7.41'
          tolerancia: 0.02
          formato: un número, con dos decimales, en julios por mol y kelvin
        distractores:
          - valor: '7.41'
            mensaje: |
              Tienes la resta al revés. El proceso va **de blanco a gris**, así
              que el gris es el producto y va primero:
              $44{,}14 - 51{,}55$.
          - valor: '95.69'
            mensaje: |
              Has sumado las dos entropías. La variación de una magnitud de
              estado es siempre producto menos reactivo.
        pista: |
          $\Delta S = S^{0}(\text{gris}) - S^{0}(\text{blanco})$.
        desarrollo: |
          $$
          \Delta S = 44{,}14 - 51{,}55 = -7{,}41\ \mathrm{J/(mol\,K)}
          $$

          Negativa, y con sentido: el estaño gris es un no metal más ordenado,
          sin el mar de electrones deslocalizados del metálico.

      - tipo: calcular
        titulo: La temperatura de la transición
        pregunta: |
          ¿Por debajo de qué temperatura se produce la peste, en kelvin?
        respuesta:
          tipo: numero
          valor: '282'
          tolerancia: 1
          formato: un número entero, en kelvin
        distractores:
          - valor: '0.28'
            mensaje: |
              Has dejado la entalpía en kilojulios y la entropía en julios.
              Pasa los $2{,}09$ kJ a $2090$ J antes de dividir.
          - valor: '9'
            mensaje: |
              Ese es el resultado en grados centígrados, que también es una
              respuesta válida — pero la pregunta pide kelvin. Los dos números
              son el mismo con 273 de diferencia.
          - valor: '555'
            mensaje: |
              Parece que has sumado 273 en vez de trabajar directamente en
              kelvin. La temperatura sale ya en kelvin al dividir una energía
              entre una entropía.
        pista: |
          El límite está donde $\Delta G = 0$, es decir
          $T = \Delta H / \Delta S$, con las dos en las mismas unidades.
        desarrollo: |
          $$
          T = \frac{\Delta H}{\Delta S} = \frac{-2090}{-7{,}41} = 282\ \mathrm{K}
          $$

          Es decir unos $9$ °C. Por debajo de esa temperatura, $\Delta G$ se
          vuelve negativa y la conversión ocurre sola.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'La transformación es Sn (blanco) → Sn (gris), con ΔH = −2,09 kJ/mol y ΔS = 44,14 − 51,55 = −7,41 J/(mol·K).'
          - texto: 'Con los dos negativos, ΔG = ΔH − TΔS tiene un término a favor y otro en contra, y el que está en contra crece con la temperatura.'
          - texto: 'El límite es donde ΔG = 0, o sea T = ΔH/ΔS = 2090/7,41 = 282 K.'
          - texto: 'Por debajo de 282 K, unos 9 °C, ΔG es negativa y el estaño blanco se convierte en gris: por eso la peste ataca en invierno y en iglesias sin calefacción.'
          - texto: 'Como la transformación libera energía, ocurrirá tanto más deprisa cuanto más frío haga.'
            trampa: true
            mensaje: |
              Mezcla espontaneidad con velocidad, que es el error clásico. El
              frío hace que la transformación **pueda** ocurrir, pero enfriar
              siempre **ralentiza** una reacción. De hecho la peste del estaño
              es lentísima y por eso tarda años en verse; lo que decide la
              termodinámica es si ocurre, no cuándo.
    resolucion: |
      **Un punto, dos restas y un cociente.** El ejercicio es corto a
      propósito, y está en el examen porque es el ejemplo limpio del caso que
      más se falla: $\Delta H$ y $\Delta S$ los dos negativos.

      $$
      \Delta H = -2{,}09 - 0{,}00 = -2{,}09\ \mathrm{kJ/mol}
      $$

      $$
      \Delta S = 44{,}14 - 51{,}55 = -7{,}41\ \mathrm{J/(mol\,K)}
      $$

      Los dos signos tienen sentido físico: la transformación libera un poco
      de energía, y el estaño gris —un no metal en polvo— está más ordenado
      que el metálico, que tiene sus electrones deslocalizados.

      **El límite está donde el empate.** La conversión ocurre cuando
      $\Delta G < 0$:

      $$
      \Delta G = \Delta H - T\Delta S = -2090 + 7{,}41\,T
      $$

      y eso es negativo mientras

      $$
      T < \frac{2090}{7{,}41} = 282\ \mathrm{K} \approx 9\ °\mathrm{C}
      $$

      **Por debajo de unos 9 °C el estaño blanco se convierte en gris**, y de
      ahí el nombre: los órganos de iglesias sin calefacción pasan meses por
      debajo de esa temperatura.

      **Las dos comprobaciones que conviene hacer.** La primera es de
      unidades: la entalpía viene en kilojulios y la entropía en julios, y si
      no se igualan sale $0{,}28$ K en vez de 282. Un factor mil es fácil de
      pasar por alto cuando el resultado no tiene con qué compararse — pero
      $0{,}28$ K es más frío que el espacio profundo, así que el número
      absurdo delata el error.

      La segunda es de sentido: el resultado tiene que caer en un rango donde
      la peste sea posible en una iglesia. Nueve grados lo es; novecientos, no.

      **Y lo que este ejercicio enseña de fondo:** que un proceso sea
      espontáneo no dice **nada** de lo deprisa que ocurre. La peste del
      estaño es termodinámicamente favorable en cualquier invierno europeo y
      aun así tarda años en manifestarse, porque a esas temperaturas la
      cinética es lentísima. Termodinámica y cinética contestan preguntas
      distintas.
