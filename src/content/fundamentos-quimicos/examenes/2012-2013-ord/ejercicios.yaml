ejercicios:
  # ── Los ejercicios 3 a 8 del examen del 31 de mayo de 2013, transcritos de
  #    su resolución oficial mecanografiada: es de los dos únicos documentos
  #    de la asignatura con una resolución del profesorado detrás, así que
  #    cada cifra de aquí está contrastada con la suya. Los ejercicios 1 y 2
  #    no están en el documento y no se inventan.
  #
  #    El 3 es el de las presiones parciales: tres gases medidos cada uno en
  #    sus condiciones, una combustión y el agua que sale líquida. La prosa
  #    del tema 4 ya cita sus números.
  - id: exfq1213-ord-3-la-mezcla-de-gases-con-etano
    titulo: Aire, etano y nitrógeno medidos en tres condiciones, y una combustión dentro
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria del 31 de mayo de 2013, curso
      2012-2013 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      enunciado se transcribe de la resolución oficial mecanografiada, que lo
      cita antes de resolverlo. La resolución guiada es nuestra, contrastada
      con esa resolución oficial: coinciden la presión antes de reaccionar,
      las presiones parciales del CO₂, del N₂ y del Ar y la presión final; en
      la del O₂ la oficial da 0,082 atm porque redondea a 0,08 los moles que
      sobran, y con más cifras salen 0,0797 atm.
    nivel: examen
    enunciado: |
      Se introduce en un recipiente de 25 L de capacidad que se encuentra a
      40ºC, 100 L de aire a 25ºC y 1 atm de presión, 5 L de etano (C₂H₆ (g))
      medido en condiciones normales y 42 g de nitrógeno. Calcular la presión
      total en el recipiente.

      Se eleva la temperatura para que los componentes de la mezcla puedan
      reaccionar. Calcular las presiones parciales de los gases y la presión
      final después de finalizada la reacción a 40ºC.

      Composición volumétrica del aire: 78% N₂, 21% O₂ y 1% Ar.
    pide: >-
      La presión total antes de reaccionar, las cuatro presiones parciales
      después de la combustión y la presión final.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres gases llegan medidos de tres maneras: el aire a 25 ºC y
          1 atm, el etano en condiciones normales y el nitrógeno pesado. ¿Cómo
          se juntan?
        opciones:
          - texto: >-
              Cada uno se pasa a moles con sus propias condiciones, se suman
              los moles y la presión sale de PV = nRT a 40 ºC y 25 L
            correcta: true
            mensaje: |
              Eso es. En moles se puede sumar, porque un mol es un mol venga de
              donde venga; en litros no, porque cada volumen está medido a una
              presión y una temperatura distintas. Y la temperatura de la
              cuenta final es la del recipiente, 313 K, no la de ninguno de los
              gases que entran.
          - texto: >-
              Se suman los 105 L de gas y se pasan a 25 L con la ley de Boyle
            mensaje: |
              Sumar litros solo vale si están medidos a la misma presión y
              temperatura, y aquí no lo están: el aire a 25 ºC y el etano a
              0 ºC. Y el nitrógeno viene en gramos, que no se suman con litros
              de ninguna manera.
          - texto: >-
              Se calcula la presión de cada gas en sus condiciones de partida y
              se suman las tres
            mensaje: |
              Las presiones de partida son de sitios distintos: el aire estaba
              a 1 atm, pero en 100 L. Una presión parcial solo tiene sentido
              dentro del recipiente donde conviven los gases, a su
              temperatura, y para calcularla hacen falta antes los moles.
          - texto: >-
              Se usa la temperatura media de los tres gases, porque cada uno
              entra a una distinta
            mensaje: |
              Una vez dentro, la mezcla está a la temperatura del recipiente,
              40 ºC. Las temperaturas de partida solo sirven para contar los
              moles de cada gas, cada uno con la suya.

      - tipo: calcular
        titulo: La presión antes de reaccionar
        pregunta: |
          ¿Qué presión total hay en el recipiente antes de que reaccione nada?
        respuesta:
          tipo: magnitud
          valor: '5.97 atm'
          tolerancia: 0.001
          formato: una presión, con su unidad
        distractores:
          - valor: '4.43 atm'
            mensaje: |
              Te has dejado los 42 g de nitrógeno, que son 1,5 mol más. El
              enunciado los mete aparte del nitrógeno que ya trae el aire, y
              cuentan los dos.
          - valor: '7.51 atm'
            mensaje: |
              Has dividido los 42 g entre 14, la masa del átomo de nitrógeno.
              El nitrógeno gaseoso es N₂, de 28 g/mol: son 1,5 mol, no 3.
          - valor: '0.763 atm'
            mensaje: |
              Has puesto la temperatura en grados Celsius, 40 en vez de 313 K.
              En $PV = nRT$ la temperatura va siempre en kelvin.
        pista: |
          Moles de cada uno: el aire con $PV = nRT$ a 298 K, el etano a 273 K
          y 1 atm, y el nitrógeno con su masa molar. Después,
          $P = n_T RT/V$ con $T = 313$ K y $V = 25$ L.
        desarrollo: |
          $$
          n_{\mathrm{N_2}} = \frac{42}{28} = 1{,}5\ \text{mol}
          \qquad
          n_{\mathrm{C_2H_6}} = \frac{1\cdot 5}{0{,}082\cdot 273} = 0{,}2234\ \text{mol}
          \qquad
          n_{\text{aire}} = \frac{1\cdot 100}{0{,}082\cdot 298} = 4{,}092\ \text{mol}
          $$
          $$
          P_T = \frac{(1{,}5+4{,}092+0{,}2234)\cdot 0{,}082\cdot 313}{25}
          = 5{,}97\ \text{atm}
          $$

          Es el resultado de la resolución oficial. Con R = 0,08206 y las
          temperaturas en 273,15 sale 5,972, y la casilla acepta los dos.

      - tipo: reconocer
        pregunta: |
          Se eleva la temperatura y el etano arde:
          $\mathrm{C_2H_6} + \tfrac{7}{2}\,\mathrm{O_2} \rightarrow 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$.
          Con 0,2234 mol de etano y 0,8594 mol de O₂, ¿qué gases quedan al
          volver a 40 ºC?
        opciones:
          - texto: >-
              El O₂ que sobra, el CO₂ formado, todo el N₂ y el Ar; el etano se
              acaba y el agua queda líquida
            correcta: true
            mensaje: |
              Eso es. El etano pide 0,7817 mol de O₂ y hay 0,8594: se acaba el
              etano y sobra oxígeno. El nitrógeno y el argón no reaccionan. Y
              el agua, a 40 ºC, es líquida: no cuenta como gas en la presión
              final.
          - texto: >-
              Se acaba el oxígeno, porque el etano necesita tres veces y media
              más
            mensaje: |
              Tres veces y media más en moles, sí: 0,7817 mol de O₂ para
              0,2234 de etano. Pero hay 0,8594, así que llega y sobra un poco.
              El limitante es el que se acaba antes en proporción, y aquí es el
              etano.
          - texto: >-
              Los mismos gases de antes, más el CO₂ y el vapor de agua
            mensaje: |
              El agua sale de la combustión, pero al volver a 40 ºC está
              líquida, y un líquido no suma presión parcial en esta cuenta.
              Contarla como gas mete 0,67 mol de golpe.
          - texto: >-
              Solo CO₂ y agua, porque la combustión gasta todo lo demás
            mensaje: |
              La combustión solo gasta etano y oxígeno. El nitrógeno —el de los
              42 g y el del aire— y el argón no reaccionan y siguen ahí
              ejerciendo su presión: son casi toda la mezcla.

      - tipo: calcular
        titulo: La presión parcial del oxígeno que sobra
        pregunta: |
          ¿Qué presión parcial tiene el O₂ que queda sin reaccionar?
        respuesta:
          tipo: magnitud
          valor: '0.0797 atm'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.082 atm'
            mensaje: |
              Es el de la resolución oficial, que redondea los moles antes de
              restar —0,86 de O₂ y 0,223 de etano— y deja la diferencia en
              0,08 mol. Con más cifras sobran 0,0776 mol. Al restar dos números
              tan parecidos el redondeo pesa mucho: aquí, un 3 % en el
              resultado.
          - valor: '0.882 atm'
            mensaje: |
              Esa es la presión del O₂ antes de reaccionar. La combustión se
              come 0,7817 mol de los 0,8594, y a la presión final solo llega lo
              que sobra.
          - valor: '0.424 atm'
            mensaje: |
              Has ajustado la combustión con 2 O₂ por etano, contando solo el
              oxígeno del CO₂. El agua también lleva oxígeno: 4 átomos de los
              dos CO₂ y 3 de las tres aguas son 7, o sea 7/2 de O₂.
        pista: |
          Primero lo que sobra: los moles de O₂ del aire menos 7/2 por cada
          mol de etano. Después, $p = nRT/V$ a 313 K y 25 L.
        desarrollo: |
          $$
          n_{\mathrm{O_2}} = 0{,}21\cdot 4{,}0923 = 0{,}85938\ \text{mol}
          \qquad
          n_{\text{gastado}} = \tfrac{7}{2}\cdot 0{,}22335 = 0{,}78173\ \text{mol}
          $$
          $$
          n_{\text{sobra}} = 0{,}85938 - 0{,}78173 = 0{,}07765\ \text{mol}
          \qquad
          p_{\mathrm{O_2}} = \frac{0{,}07765\cdot 0{,}082\cdot 313}{25} = 0{,}0797\ \text{atm}
          $$

          La casilla acepta un 2 % a cada lado, y no el 0,1 % de las demás:
          es la resta de dos números parecidos, y redondear el etano a
          0,223 mol ya la mueve un 1,6 %, mucho más que la R o los 273,15 K.
          Lo que no entra es el 0,082 de la resolución oficial, que redondea
          hasta perder un 3 %.

      - tipo: calcular
        titulo: La presión parcial del CO₂
        pregunta: |
          ¿Y la del CO₂ formado?
        respuesta:
          tipo: magnitud
          valor: '0.4586 atm'
          tolerancia: 0.002
          formato: una presión, con su unidad
        distractores:
          - valor: '0.229 atm'
            mensaje: |
              Has puesto un CO₂ por etano. El etano tiene dos carbonos, así
              que da dos CO₂: 0,4467 mol, no 0,2234.
          - valor: '0.0586 atm'
            mensaje: |
              Has usado 40 en vez de 313 K. Con la temperatura en Celsius la
              presión sale casi ocho veces más pequeña.
        pista: |
          Dos CO₂ por cada etano, y la misma cuenta de antes: $p = nRT/V$.
        desarrollo: |
          $$
          n_{\mathrm{CO_2}} = 2\cdot 0{,}22335 = 0{,}4467\ \text{mol}
          \qquad
          p_{\mathrm{CO_2}} = \frac{0{,}4467\cdot 0{,}082\cdot 313}{25} = 0{,}4586\ \text{atm}
          $$

          Es el resultado de la resolución oficial, que lo da con una cifra
          menos: 0,458 atm.

      - tipo: calcular
        titulo: La presión parcial del nitrógeno
        pregunta: |
          ¿Qué presión parcial tiene el nitrógeno al final?
        respuesta:
          tipo: magnitud
          valor: '4.817 atm'
          tolerancia: 0.001
          formato: una presión, con su unidad
        distractores:
          - valor: '1.54 atm'
            mensaje: |
              Solo has contado los 42 g. El aire también trae nitrógeno, el
              78 % de sus 4,09 mol, y es más del doble del añadido.
          - valor: '3.28 atm'
            mensaje: |
              Solo has contado el nitrógeno del aire, y el enunciado añade
              además 42 g, que son 1,5 mol. Esa cifra es justo la que el tema 4
              calcula para el aire solo.
          - valor: '6.36 atm'
            mensaje: |
              Has pasado los 42 g a moles con 14 g/mol, la masa del átomo. El
              nitrógeno gaseoso es N₂: son 1,5 mol, no 3.
        pista: |
          El nitrógeno no reacciona: suma el de los 42 g y el 78 % del aire.
        desarrollo: |
          $$
          n_{\mathrm{N_2}} = 1{,}5 + 0{,}78\cdot 4{,}0923 = 4{,}692\ \text{mol}
          \qquad
          p_{\mathrm{N_2}} = \frac{4{,}692\cdot 0{,}082\cdot 313}{25} = 4{,}817\ \text{atm}
          $$

          Es el resultado de la resolución oficial, que escribe 4,815 por
          redondear antes.

      - tipo: calcular
        titulo: La presión parcial del argón
        pregunta: |
          ¿Y la del argón?
        respuesta:
          tipo: magnitud
          valor: '0.0420 atm'
          tolerancia: 0.002
          formato: una presión, con su unidad
        distractores:
          - valor: '0.0540 atm'
            mensaje: |
              Has aplicado el 1 % a la presión final de la mezcla. Ese 1 % es
              del aire, no de todo lo que hay en el recipiente: el argón es el
              1 % de los 4,09 mol de aire.
          - valor: '0.0100 atm'
            mensaje: |
              Esa es la presión parcial del argón en el aire de partida, a
              1 atm en 100 L. Dentro del recipiente el mismo argón está en
              25 L y a 40 ºC, y hay que volver a calcularla con sus moles.
        pista: |
          El 1 % de los moles de aire, y la misma cuenta.
        desarrollo: |
          $$
          n_{\mathrm{Ar}} = 0{,}01\cdot 4{,}0923 = 0{,}04092\ \text{mol}
          \qquad
          p_{\mathrm{Ar}} = \frac{0{,}04092\cdot 0{,}082\cdot 313}{25} = 0{,}0420\ \text{atm}
          $$

          Es el resultado de la resolución oficial.

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          ¿Cuál es la presión total al terminar la reacción?
        respuesta:
          tipo: magnitud
          valor: '5.397 atm'
          tolerancia: 0.001
          formato: una presión, con su unidad
        distractores:
          - valor: '6.09 atm'
            mensaje: |
              Has contado el agua como gas: 0,67 mol más. A 40 ºC está
              líquida, y un líquido no suma presión parcial en esta cuenta.
          - valor: '3.86 atm'
            mensaje: |
              Te has dejado el nitrógeno de los 42 g, que no reacciona pero
              sigue ahí: son 1,54 atm.
        pista: |
          Suma las cuatro presiones parciales, o suma los moles de gas que
          quedan y usa $PV = nRT$.
        desarrollo: |
          $$
          P_T = 0{,}0797 + 0{,}4586 + 4{,}817 + 0{,}0420 = 5{,}397\ \text{atm}
          $$

          Baja de 5,97 a 5,40 atm porque la combustión gasta 4,5 mol de gas
          por cada mol de etano —el etano y sus 7/2 de oxígeno— y solo
          devuelve 2 de CO₂. Es el resultado de la resolución oficial.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada gas se pasa a moles con sus condiciones: 1,5 mol de N₂,
              0,2234 de etano en condiciones normales y 4,092 de aire a 25 ºC.
          - texto: >-
              En el recipiente, a 313 K y 25 L, los 5,815 mol ejercen 5,97 atm.
          - texto: >-
              El etano es el limitante: pide 0,7817 mol de O₂ y el aire trae
              0,8594.
          - texto: >-
              Quedan 0,0776 mol de O₂ y se forman 0,4467 de CO₂; el N₂ y el Ar
              no cambian.
          - texto: >-
              Con p = nRT/V salen 0,0797 atm de O₂, 0,4586 de CO₂, 4,817 de N₂
              y 0,0420 de Ar, que suman 5,397 atm.
          - texto: >-
              El agua formada, 0,67 mol, también suma a la presión final,
              porque todo lo que sale de una combustión es gas.
            trampa: true
            mensaje: |
              A 40 ºC el agua está líquida, y un líquido no aporta presión
              parcial en esta cuenta. Que la llama esté caliente no cambia
              nada: la presión se mide al volver a 40 ºC, como dice el
              enunciado. Contarla sube la presión final a 6,09 atm.
        veredicto: |
          Todo el ejercicio es contar moles. Los volúmenes de partida solo
          sirven para eso, y la reacción se lee en moles de gas: entran 4,5
          por cada etano y salen 2.

    resolucion: |
      **Lo que se pide.** Tres gases que entran medidos cada uno a su manera,
      una combustión, y las presiones antes y después. Todo se hace en moles:
      los litros de partida no se pueden sumar, porque el aire está medido a
      25 ºC y el etano a 0 ºC, y el nitrógeno viene pesado.

      ## Antes de reaccionar

      $$
      n_{\mathrm{N_2}} = \frac{42}{28} = 1{,}5
      \qquad
      n_{\mathrm{C_2H_6}} = \frac{1\cdot 5}{0{,}082\cdot 273} = 0{,}2234
      \qquad
      n_{\text{aire}} = \frac{1\cdot 100}{0{,}082\cdot 298} = 4{,}092
      $$

      El aire se reparte según su composición en volumen, que en un gas es la
      composición en moles: 3,192 mol de N₂, 0,8594 de O₂ y 0,0409 de Ar.
      Dentro del recipiente, a 40 ºC:

      $$
      \boxed{\;P_T = \frac{5{,}815\cdot 0{,}082\cdot 313}{25} = 5{,}97\ \text{atm}\;}
      $$

      ## La combustión

      $$
      \mathrm{C_2H_6\,(g)} + \tfrac{7}{2}\,\mathrm{O_2\,(g)} \rightarrow
      2\,\mathrm{CO_2\,(g)} + 3\,\mathrm{H_2O\,(l)}
      $$

      El etano pide $\tfrac{7}{2}\cdot 0{,}22335 = 0{,}7817$ mol de oxígeno y
      el aire trae 0,8594: el etano se acaba y sobra O₂.

      | mol | C₂H₆ | O₂ | CO₂ | H₂O (l) | N₂ | Ar |
      |---|---|---|---|---|---|---|
      | al principio | 0,2234 | 0,8594 | 0 | 0 | 4,692 | 0,0409 |
      | al final | 0 | 0,0776 | 0,4467 | 0,67 | 4,692 | 0,0409 |

      El agua sale **líquida** a 40 ºC y no cuenta como gas.

      ## Las presiones al final

      Todas con el mismo factor, $RT/V = 0{,}082\cdot 313/25 = 1{,}0266$ atm
      por mol:

      $$
      p_{\mathrm{O_2}} = 0{,}0797
      \qquad
      p_{\mathrm{CO_2}} = 0{,}4586
      \qquad
      p_{\mathrm{N_2}} = 4{,}817
      \qquad
      p_{\mathrm{Ar}} = 0{,}0420\ \text{atm}
      $$
      $$
      \boxed{\;P_T = 5{,}397\ \text{atm}\;}
      $$

      La presión baja porque la combustión gasta 4,5 mol de gas por cada mol
      de etano y solo devuelve 2.

      ## Contra la resolución oficial

      Coinciden la presión de partida, la final y las parciales del CO₂, el
      N₂ y el Ar. Tres cosas del documento conviene leerlas bien:

      - en la cuenta del etano escribe «0,223 moles aire»: son moles de
        **etano**;
      - en la tabla escribe «0,086 − 7/2(0,223)», que es 0,86, y titula
        «n inicial» la segunda fila, que es la final;
      - redondea a 0,08 mol el oxígeno que sobra y da 0,082 atm. Con más
        cifras sobran 0,0776 mol y la presión es 0,0797 atm: es una resta de
        dos números parecidos, y ahí el redondeo pesa un 3 %. La presión final
        no lo nota porque su N₂, 4,815 atm, va redondeado hacia abajo y lo
        compensa.

  # ── Una cadena de tres etapas con tres rendimientos, y la regla que la
  #    decide: hacia atrás se divide, hacia delante se multiplica. La
  #    resolución oficial calcula con 1,487 kg/L donde el enunciado dice
  #    1,4987, así que sus dos primeros resultados entran como distractores.
  - id: exfq1213-ord-4-la-calcopirita-y-sus-tres-rendimientos
    titulo: Calcopirita para sulfúrico y cobre, con tres rendimientos en la cadena
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria del 31 de mayo de 2013, curso
      2012-2013 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      enunciado se transcribe de la resolución oficial mecanografiada. La
      resolución guiada es nuestra, contrastada con esa resolución oficial,
      que calcula con una densidad de 1,487 kg/L en vez de la de 1,4987 kg/L
      del enunciado: por eso da 1420,67 kg de calcopirita y 14,86 kg de
      cobre, y con el dato del enunciado salen 1432 kg y 14,98 kg. El
      apartado c coincide, 12,55 g de SO₂ por kilo, porque no depende de la
      densidad.
    nivel: examen
    enunciado: |
      Un mineral de calcopirita, con un contenido en azufre del 45% y en cobre
      del 1,5% en masa, puede emplearse como fuente de materia prima para la
      obtención del ácido sulfúrico y cobre. Considerando que el
      aprovechamiento industrial comienza con el proceso de tostación, en el
      que se genera dióxido de azufre y óxido cúprico y transcurre con un
      rendimiento del 93%, calcular:

      a) La cantidad de calcopirita que será necesaria procesar para obtener
      2000 L de una solución de ácido sulfúrico del 60% en masa y densidad de
      1,4987 kg/L, si la transformación del dióxido de azufre, obtenido en la
      tostación, en ácido sulfúrico se lleva a cabo con un rendimiento del
      98%.

      b) La cantidad de cobre que podría obtenerse con el mineral procesado,
      suponiendo que la transformación del óxido cúprico en cobre tiene lugar
      con un rendimiento del 75%

      c) Los gramos de dióxido de azufre que se emitirían a la atmósfera por
      kg de calcopirita procesada, si el 1,5% del dióxido total producido en
      la tostación escapa a la misma.
    pide: >-
      La calcopirita necesaria para los 2000 L de ácido, el cobre que se
      obtiene de ella y el SO₂ emitido por kilo de mineral.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) da lo que se quiere obtener —2000 L de ácido— y pide
          lo que hay que procesar. ¿Cómo entran los rendimientos del 98 % y
          del 93 % en esa cuenta hacia atrás?
        opciones:
          - texto: >-
              Dividiendo: para obtener algo con un 98 % de rendimiento hay que
              partir de más, así que se divide entre 0,98 y luego entre 0,93
            correcta: true
            mensaje: |
              Eso es. Yendo hacia atrás, del producto a lo que hay que meter,
              cada rendimiento **aumenta** lo necesario: se divide. Multiplicar
              es lo que se hace yendo hacia delante, del mineral al producto,
              como en el apartado b).
          - texto: >-
              Multiplicando por 0,98 y por 0,93, como siempre que hay un
              rendimiento
            mensaje: |
              Multiplicar da lo que sale cuando se conoce lo que entra. Aquí se
              conoce lo que sale y se busca lo que entra: con un rendimiento
              menor que 1 hace falta **más** mineral, y multiplicar daría
              menos. Saldrían 1189 kg en vez de 1432.
          - texto: >-
              Solo cuenta el 98 %, porque el 93 % es de la tostación y no del
              ácido
            mensaje: |
              La tostación es la primera etapa de la misma cadena: el SO₂ que
              va al ácido sale de ella, y solo se forma el 93 % del posible.
              Los dos rendimientos se encadenan.
          - texto: >-
              No cuentan, porque el oxígeno está en exceso
            mensaje: |
              El exceso de oxígeno dice quién limita, no cuánto rinde la
              reacción. El rendimiento es un dato medido de cada etapa, y el
              enunciado da los dos.

      - tipo: calcular
        titulo: El ácido puro que hay en los 2000 L
        pregunta: |
          ¿Cuántos kilos de H₂SO₄ puro hay en los 2000 L de disolución al
          60 %?
        respuesta:
          tipo: magnitud
          valor: '1798.4 kg'
          tolerancia: 0.001
          formato: una masa, con su unidad
        distractores:
          - valor: '1784.4 kg'
            mensaje: |
              Es el de la resolución oficial, que calcula con una densidad de
              1,487 kg/L en vez de la de 1,4987 del enunciado. Todo lo que sale
              de aquí en adelante lleva ese 0,8 % de menos.
          - valor: '2997.4 kg'
            mensaje: |
              Esa es la masa de la **disolución**. El ácido es el 60 % de
              ella: falta multiplicar por 0,60.
          - valor: '800.7 kg'
            mensaje: |
              Has dividido entre la densidad en vez de multiplicar. La
              densidad pasa de volumen a masa: litros por kilos por litro dan
              kilos.
        pista: |
          Volumen por densidad da la masa de disolución, y el 60 % de ella es
          ácido.
        desarrollo: |
          $$
          m_{\text{disolución}} = 2000\cdot 1{,}4987 = 2997{,}4\ \text{kg}
          \qquad
          m_{\mathrm{H_2SO_4}} = 0{,}60\cdot 2997{,}4 = 1798{,}4\ \text{kg}
          $$

          La resolución oficial escribe «d = 1,487 g/mL» y saca 1784,4 kg: se
          ha comido el 9 de 1,4987. Manda el enunciado.

      - tipo: calcular
        titulo: La calcopirita que hay que procesar
        pregunta: |
          Con la tostación al 93 % y la conversión en ácido al 98 %, ¿cuánta
          calcopirita hay que procesar?
        respuesta:
          tipo: magnitud
          valor: '1432 kg'
          tolerancia: 0.002
          formato: una masa, con su unidad
        distractores:
          - valor: '1420.67 kg'
            mensaje: |
              Es el de la resolución oficial, que arrastra la densidad de
              1,487 kg/L en vez de la de 1,4987 del enunciado. El camino es el
              bueno; el dato de partida, no.
          - valor: '1189 kg'
            mensaje: |
              Has multiplicado por los rendimientos en vez de dividir. Yendo
              hacia atrás, del ácido al mineral, un rendimiento menor que 1
              obliga a partir de **más**: se divide entre 0,98 y entre 0,93.
          - valor: '2386 kg'
            mensaje: |
              Te has saltado el 60 %: has tomado los 2997 kg de disolución como
              si fueran todo ácido.
        pista: |
          Moles de H₂SO₄; entre 0,98 para los de SO₂; entre 0,93 para los de
          azufre del mineral; y de ahí la masa de azufre, que es el 45 % de la
          calcopirita.
        desarrollo: |
          $$
          n_{\mathrm{H_2SO_4}} = \frac{1\,798\,440}{98} = 18\,351\ \text{mol}
          \qquad
          n_{\mathrm{SO_2}} = \frac{18\,351}{0{,}98} = 18\,726\ \text{mol}
          $$
          $$
          n_{\mathrm{S}} = \frac{18\,726}{0{,}93} = 20\,135\ \text{mol}
          \qquad
          m_{\text{calcopirita}} = \frac{20\,135\cdot 32}{0{,}45} = 1\,431\,822\ \text{g}
          $$

          Son 1432 kg. Con las masas de la resolución oficial, S = 32 y
          H₂SO₄ = 98, salen 1431,9 kg; con 32,06 y 98,08, 1433,4. La casilla
          acepta las dos, un 0,2 % a cada lado, porque el enunciado no da
          masas atómicas.

      - tipo: calcular
        titulo: El cobre que se obtiene
        pregunta: |
          Con esa calcopirita, al 1,5 % de cobre, ¿cuánto cobre se obtiene si
          la tostación va al 93 % y el paso de CuO a Cu al 75 %?
        respuesta:
          tipo: magnitud
          valor: '14.98 kg'
          tolerancia: 0.002
          formato: una masa, con su unidad
        distractores:
          - valor: '14.86 kg'
            mensaje: |
              Es el de la resolución oficial, que parte de sus 1420,67 kg de
              mineral, calculados con la densidad de 1,487 kg/L en vez de la
              de 1,4987 del enunciado.
          - valor: '16.11 kg'
            mensaje: |
              Te has dejado el 93 % de la tostación. El óxido cúprico sale de
              esa misma etapa, junto al SO₂, así que también se forma solo el
              93 % del posible.
          - valor: '21.48 kg'
            mensaje: |
              Ese es el cobre que **contiene** el mineral. Para sacarlo hay dos
              etapas, la tostación al 93 % y la reducción al 75 %, y hacia
              delante se multiplica por las dos.
        pista: |
          Ahora se va hacia delante: el cobre del mineral por los dos
          rendimientos. La masa molar del cobre entra y sale, así que no hace
          falta.
        desarrollo: |
          $$
          m_{\mathrm{Cu,\ mineral}} = 0{,}015\cdot 1431{,}9 = 21{,}48\ \text{kg}
          \qquad
          m_{\mathrm{Cu}} = 21{,}48\cdot 0{,}93\cdot 0{,}75 = 14{,}98\ \text{kg}
          $$

          La resolución oficial pasa por moles con Cu = 63,5, que se cancela,
          y da 14,86 kg desde sus 1420,67 kg de mineral.

      - tipo: calcular
        titulo: El SO₂ que escapa por kilo de mineral
        pregunta: |
          Si el 1,5 % del SO₂ producido en la tostación escapa a la atmósfera,
          ¿cuántos gramos se emiten por cada kilo de calcopirita procesada?
        respuesta:
          tipo: numero
          valor: '12.55'
          tolerancia: 0.02
          formato: los gramos de SO₂ por kilo de calcopirita, con dos decimales
        distractores:
          - valor: '13.5'
            mensaje: |
              Has sacado el SO₂ de todo el azufre del mineral. La tostación va
              al 93 %: el «dióxido total producido» es el 93 % del posible, y
              el 1,5 % se aplica a eso.
          - valor: '6.28'
            mensaje: |
              Esos son gramos de **azufre**, no de SO₂. Cada mol de azufre da
              un mol de SO₂, que pesa el doble: 64 frente a 32 g/mol.
          - valor: '837'
            mensaje: |
              Ese es todo el SO₂ que produce la tostación por kilo de mineral.
              Solo escapa el 1,5 % de él.
        pista: |
          Por kilo de mineral: 450 g de azufre, el 93 % pasa a SO₂ y de ese
          SO₂ escapa el 1,5 %. No hace falta el resultado del apartado a).
        desarrollo: |
          $$
          \frac{m_{\mathrm{SO_2}}}{m_{\text{mineral}}}
          = 0{,}015\cdot 0{,}93\cdot 0{,}45\cdot \frac{64}{32}\cdot 1000
          = 12{,}555\ \text{g/kg}
          $$

          No depende de cuánta calcopirita se procese, y por eso tampoco de la
          densidad: es el resultado de la resolución oficial, 12,55 g por
          kilo, aunque ella parta de sus 1420,67 kg. Con S = 32,06 salen
          12,54, y la casilla acepta de 12,53 a 12,57.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              En los 2000 L hay 2997,4 kg de disolución y 1798,4 kg de H₂SO₄
              puro, 18 351 mol.
          - texto: >-
              Hacia atrás se divide: 18 726 mol de SO₂ con el 98 %, y 20 135
              mol de azufre con el 93 %.
          - texto: >-
              Esos 644 kg de azufre son el 45 % del mineral: hay que procesar
              1432 kg de calcopirita.
          - texto: >-
              Hacia delante se multiplica: los 21,48 kg de cobre del mineral
              dan 14,98 kg con el 93 % y el 75 %.
          - texto: >-
              Por kilo de mineral, el 1,5 % del SO₂ de la tostación son 12,55 g,
              sin depender del apartado a).
          - texto: >-
              El 93 % de la tostación solo afecta al SO₂, así que el cobre sale
              de multiplicar el del mineral por 0,75.
            trampa: true
            mensaje: |
              La tostación produce a la vez el SO₂ y el óxido cúprico: si solo
              reacciona el 93 % del mineral, solo se forma el 93 % del CuO
              posible. El cobre lleva los dos rendimientos, 0,93 y 0,75, y sin
              el primero salen 16,11 kg en vez de 14,98.
        veredicto: |
          Una sola regla decide el ejercicio: hacia atrás, del producto a lo
          que hay que meter, se divide entre el rendimiento; hacia delante, se
          multiplica.

    resolucion: |
      **Lo que se pide.** Una cadena de tres etapas que sale del mismo mineral:
      la tostación da a la vez SO₂ y óxido cúprico, el SO₂ se convierte en
      ácido y el óxido en cobre. Cada etapa tiene su rendimiento, y la regla
      que decide todo es la dirección: **hacia atrás se divide, hacia delante
      se multiplica**.

      ## a) La calcopirita que hace falta

      Se empieza por lo que se quiere tener:

      $$
      m_{\mathrm{H_2SO_4}} = 2000\cdot 1{,}4987\cdot 0{,}60 = 1798{,}4\ \text{kg}
      \qquad
      n_{\mathrm{H_2SO_4}} = \frac{1\,798\,440}{98} = 18\,351\ \text{mol}
      $$

      y se va hacia atrás, dividiendo entre cada rendimiento: un mol de SO₂
      por cada mol de ácido, y un mol de azufre por cada mol de SO₂.

      $$
      n_{\mathrm{SO_2}} = \frac{18\,351}{0{,}98} = 18\,726
      \qquad
      n_{\mathrm{S}} = \frac{18\,726}{0{,}93} = 20\,135\ \text{mol}
      $$
      $$
      m_{\text{calcopirita}} = \frac{20\,135\cdot 32}{0{,}45} = 1\,431\,822\ \text{g}
      $$

      **Hay que procesar 1432 kg de calcopirita.** Con las masas de la
      resolución oficial, S = 32 y H₂SO₄ = 98, salen 1431,9 kg; con 32,06 y
      98,08, 1433,4. Las dos cuentas son buenas.

      ## b) El cobre que se obtiene

      Ahora hacia delante: el cobre que contiene ese mineral, por los dos
      rendimientos que lo separan del metal.

      $$
      \boxed{\;m_{\mathrm{Cu}} = 0{,}015\cdot 1431{,}9\cdot 0{,}93\cdot 0{,}75
      = 14{,}98\ \text{kg}\;}
      $$

      El 93 % entra porque la tostación es la etapa que forma el óxido
      cúprico, igual que forma el SO₂. La masa molar del cobre no hace falta:
      se pasa a moles y se vuelve a gramos con la misma.

      ## c) El SO₂ que escapa

      Por cada kilo de mineral:

      $$
      \boxed{\;0{,}015\cdot 0{,}93\cdot 0{,}45\cdot \frac{64}{32}\cdot 1000
      = 12{,}555\ \text{g de SO}_2\text{/kg}\;}
      $$

      o sea unos **12,55 g de SO₂ por kilo de calcopirita**. Es un cociente, y
      no depende de cuánto mineral se procese.

      ## Contra la resolución oficial

      - El enunciado da una densidad de **1,4987 kg/L** y la resolución
        calcula con **1,487**, que además escribe «d = 1,487 g/mL». Todo el
        apartado a) le sale un 0,8 % corto: 1784,4 kg de ácido, 1420,67 kg de
        calcopirita y, en el b), 14,86 kg de cobre. Con el dato del enunciado
        son 1798,4, 1432 y 14,98 kg.
      - El apartado c) coincide, 12,55 g por kilo, porque ese cociente no
        depende de la densidad.
      - La resolución no descuenta el 1,5 % que escapa del SO₂ que va al
        ácido: trata el c) como una pregunta aparte, con la calcopirita del
        a). Si lo descontara, haría falta un 1,5 % más de mineral para el
        mismo ácido, pero los gramos por kilo no cambiarían.

  # ── El ejercicio 5 cruza dos temas y se parte en dos piezas. Esta es la
  #    primera: dos compresiones de un gas monoatómico, una isóbara y otra
  #    adiabática, y en cada una hay una magnitud que se sabe sin calcular.
  #    La resolución oficial escribe 1,023·10⁵ y γ = 1,66, pero calcula con
  #    1,013·10⁵ y con 5/3: sus diez resultados coinciden con los nuestros.
  - id: exfq1213-ord-5-el-gas-monoatomico-isobaro-y-adiabatico
    titulo: Dos compresiones de un gas monoatómico, y lo que cada una deja saber sin calcular
    fuente: >-
      Ejercicio 5, apartado a · Convocatoria ordinaria del 31 de mayo de 2013,
      curso 2012-2013 · Fundamentos Químicos de la Ingeniería (25975),
      UPV/EHU · El enunciado se transcribe de la resolución oficial
      mecanografiada. La resolución guiada es nuestra, contrastada con esa
      resolución oficial: coinciden los diez resultados, con diferencias en
      la última cifra que vienen de redondear las temperaturas. La oficial
      escribe «1,023·10⁵ N/m²» por atmósfera y γ = 1,66, pero sus cuentas usan
      1,013·10⁵ y 5/3.
    nivel: examen
    enunciado: |
      **a)** Dos moles de un gas monoatómico ideal se encuentran a una presión
      de 2 atm en un recipiente de 5 L, calcular el trabajo, calor, energía
      interna, entalpía y entropía si:

      i) El gas se comprime hasta un volumen de 3 L a presión constante.

      ii) A continuación, el gas se comprime hasta un volumen de 2 L mediante
      un proceso adiabático.

      **b)** Considerar la siguiente reacción: X + Y → Z

      A partir de los siguientes datos, obtenidos a 360 K, a) determinar el
      orden de la reacción y b) determinar la velocidad inicial de
      desaparición de X cuando su concentración es 0,30 M y la de Y 0,40 M

      | Velocidad inicial de desaparición de X (M/s) | [X] (M) | [Y] (M) |
      |---|---|---|
      | 0,254 | 0,20 | 0,60 |
      | 0,509 | 0,40 | 0,30 |
      | 1,02 | 0,40 | 0,60 |

      *De los dos apartados, aquí se resuelve el **a)**, que es del tema 5.
      El b), la cinética, se resuelve en su propia pieza, con el tema 8.*
    pide: >-
      El trabajo, el calor, la energía interna, la entalpía y la entropía de
      la compresión a presión constante y de la compresión adiabática.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas pasa de 5 L a 3 L a 2 atm constantes. Con el convenio de la
          asignatura, $\Delta U = q + W$, ¿qué signo tiene el trabajo?
        opciones:
          - texto: Positivo, porque el gas se comprime y recibe trabajo
            correcta: true
            mensaje: |
              Eso es. Con $W = -\int P\,dV$, un volumen que baja da $W > 0$: el
              entorno empuja y le mete energía al gas. Es el convenio del
              tema 5, que cuenta positivo lo que entra en el sistema.
          - texto: Negativo, porque ΔV = 3 − 5 es negativo
            mensaje: |
              Eso sería con $W = P\,\Delta V$, el convenio del motor, que
              cuenta positivo el trabajo que el gas **hace**. Esta asignatura
              escribe $\Delta U = q + W$ con $W = -P\,\Delta V$, y ese signo
              menos hace que comprimir salga positivo.
          - texto: Cero, porque la presión no cambia
            mensaje: |
              Lo que anula el trabajo es que no cambie el **volumen**, no la
              presión. A presión constante el trabajo es un rectángulo,
              $P\,\Delta V$, y aquí el volumen baja 2 L.
          - texto: Negativo, porque el gas pierde energía al enfriarse
            mensaje: |
              Que se enfríe dice que pierde energía interna, y la pierde en
              forma de **calor**, que sale. El trabajo va en sentido
              contrario: entra, porque lo comprimen. Son dos flujos distintos,
              cada uno con su signo.

      - tipo: calcular
        titulo: El trabajo de la compresión a presión constante
        pregunta: |
          ¿Cuánto vale el trabajo del tramo i)?
        respuesta:
          tipo: magnitud
          valor: '405.3 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '-405.3 J'
            mensaje: |
              Es el mismo número con el signo del convenio del motor,
              $W = P\,\Delta V$. Con el de esta asignatura, $W = -P\,\Delta V$,
              comprimir da trabajo positivo: entra en el gas.
          - valor: '4 J'
            mensaje: |
              Son 4 atm·L, no 4 J. Para pasar a julios hay que multiplicar por
              101,3: una atmósfera son 1,013·10⁵ Pa y un litro, 10⁻³ m³.
          - valor: '405300 J'
            mensaje: |
              Has multiplicado la presión en pascales por el volumen en
              litros, sin pasarlo a metros cúbicos: sobran tres ceros.
        pista: |
          $W = -P\,\Delta V$. Con la presión en atm y el volumen en litros sale
          en atm·L, y un atm·L son 101,3 J.
        desarrollo: |
          $$
          W = -P\,\Delta V = -2\cdot(3-5) = 4\ \text{atm}\cdot\text{L}
          \qquad
          W = 4\cdot 101{,}3 = 405{,}2\ \text{J}
          $$

          Es el resultado de la resolución oficial. Ojo a un detalle de su
          cuenta: escribe «1,023·10⁵ N/m²» por atmósfera, que es 1,013·10⁵.
          Con 1,023 saldrían 409,2 J, y su 405,2 dice que calcula con el
          bueno.

      - tipo: calcular
        titulo: El calor a presión constante
        pregunta: |
          ¿Y el calor del tramo i)?
        respuesta:
          tipo: magnitud
          valor: '-1013.4 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '-608.1 J'
            mensaje: |
              Has usado $C_v$, y eso da el calor a volumen **constante**. Aquí
              lo constante es la presión, y el calor lleva
              $C_p = \tfrac{5}{2}R$: el gas, además de enfriarse, cede la
              energía del trabajo que le meten.
          - valor: '1013.4 J'
            mensaje: |
              El signo: el gas se enfría de 61 a 37 K, así que el calor
              **sale**. Con el convenio de la asignatura, lo que sale es
              negativo.
          - valor: '-405.3 J'
            mensaje: |
              Has puesto $q = -W$, que es lo que pasa en un isotermo, donde
              $\Delta U = 0$. Aquí la temperatura cae de 61 a 37 K, así que la
              energía interna cambia y el calor no es solo el trabajo
              devuelto.
        pista: |
          Hacen falta las dos temperaturas, de $T = PV/nR$ con R = 0,082.
          Después, $q_P = n\,C_p\,\Delta T$ con $C_p = \tfrac{5}{2}R$ y
          R = 8,31.
        desarrollo: |
          $$
          T_1 = \frac{2\cdot 5}{2\cdot 0{,}082} = 60{,}98\ \text{K}
          \qquad
          T_2 = \frac{2\cdot 3}{2\cdot 0{,}082} = 36{,}59\ \text{K}
          $$
          $$
          q_P = 2\cdot \tfrac{5}{2}\cdot 8{,}31\cdot(36{,}585-60{,}976) = -1013{,}4\ \text{J}
          $$

          Son temperaturas muy bajas, y es lo que dan los datos: dos moles en
          5 L a solo 2 atm. Es el resultado de la resolución oficial, y como
          la presión es constante este calor **es** la entalpía del tramo:
          $q_P = \Delta H$.

      - tipo: calcular
        titulo: La energía interna del tramo isóbaro
        pregunta: |
          ¿Cuánto vale $\Delta U$ en el tramo i)?
        respuesta:
          tipo: magnitud
          valor: '-608.1 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '-1418.7 J'
            mensaje: |
              Has restado el trabajo, $\Delta U = q - W$: es la primera ley del
              convenio del motor. Con el de la asignatura, $\Delta U = q + W$,
              el trabajo que entra al comprimir **suma**.
          - valor: '-1013.4 J'
            mensaje: |
              Ese es el calor, no la energía interna. Con $\Delta U = q + W$
              falta sumar los 405,3 J de trabajo que entran.
        pista: |
          $\Delta U = q + W$, o directamente $n\,C_v\,\Delta T$ con
          $C_v = \tfrac{3}{2}R$. Tienen que salir iguales.
        desarrollo: |
          $$
          \Delta U = q + W = -1013{,}4 + 405{,}3 = -608{,}1\ \text{J}
          $$
          $$
          \Delta U = 2\cdot \tfrac{3}{2}\cdot 8{,}31\cdot(-24{,}39) = -608{,}0\ \text{J}
          $$

          Los dos caminos cuadran salvo en la última cifra, que baila con los
          redondeos de R. La resolución oficial da −608,2 con su trabajo de
          405,2: coincide.

      - tipo: calcular
        titulo: La entalpía del tramo isóbaro
        pregunta: |
          ¿Y $\Delta H$ del tramo i)?
        respuesta:
          tipo: magnitud
          valor: '-1013.4 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '-608.1 J'
            mensaje: |
              Esa es la energía interna. La entalpía le suma $\Delta(PV)$, que
              aquí es $P\,\Delta V = -4$ atm·L, o sea −405,3 J.
          - valor: '-202.8 J'
            mensaje: |
              Has sumado el trabajo, $\Delta H = \Delta U + W$. Lo que se suma
              es $\Delta(PV) = P\,\Delta V$, que a presión constante vale lo
              mismo que el trabajo con el signo **contrario**: −405,3 J, no
              +405,3.
        pista: |
          A presión constante, $\Delta H = q_P$. Si quieres comprobarlo,
          $\Delta H = \Delta U + P\,\Delta V$.
        desarrollo: |
          $$
          \Delta H = \Delta U + P\,\Delta V = -608{,}1 - 405{,}3 = -1013{,}4\ \text{J}
          $$

          Es el calor del paso anterior, y tiene que serlo: a presión
          constante el calor que se mide **es** la entalpía (tema 5). La
          resolución oficial lo escribe en la misma línea, $q_P = \Delta H$.

      - tipo: calcular
        titulo: La entropía del tramo isóbaro
        pregunta: |
          ¿Cuánto cambia la entropía del gas en el tramo i)?
        respuesta:
          tipo: magnitud
          valor: '-21.22 J/K'
          tolerancia: 0.001
          formato: una entropía, con su unidad
        distractores:
          - valor: '-12.73 J/K'
            mensaje: |
              Has integrado con $C_v$. A presión constante el calor reversible
              es $n\,C_p\,dT$, así que va $C_p$: $\tfrac{5}{2}R$, no
              $\tfrac{3}{2}R$.
          - valor: '21.22 J/K'
            mensaje: |
              El signo: has puesto el logaritmo al revés, $\ln(T_1/T_2)$. El
              gas se enfría y suelta calor, así que su entropía **baja**.
          - valor: '-27.70 J/K'
            mensaje: |
              Has dividido el calor entre la temperatura final, $q/T_2$. Aquí
              la temperatura cambia durante el tramo, y eso obliga a integrar:
              sale un logaritmo, no una división (tema 7).
        pista: |
          $\Delta S = \int dq_{\text{rev}}/T = n\,C_p\ln(T_2/T_1)$, porque a
          presión constante $dq = n\,C_p\,dT$.
        desarrollo: |
          $$
          \Delta S = n\,C_p\ln\frac{T_2}{T_1}
          = 2\cdot \tfrac{5}{2}\cdot 8{,}31\cdot \ln\frac{3}{5} = -21{,}22\ \text{J/K}
          $$

          A presión constante el cociente de temperaturas es el de volúmenes,
          3/5, y no hace falta calcularlas. La resolución oficial da −21,23
          con las temperaturas redondeadas: coincide.

      - tipo: reconocer
        pregunta: |
          Ahora el gas se comprime de 3 L a 2 L en un proceso adiabático. ¿Qué
          le pasa a la temperatura?
        opciones:
          - texto: >-
              Sube: no puede soltar calor, así que el trabajo que entra se
              queda como energía interna
            correcta: true
            mensaje: |
              Eso es. Con $q = 0$, la primera ley queda $\Delta U = W$, y
              comprimir mete trabajo: la energía interna sube, y en un gas
              ideal eso es subir la temperatura. El enunciado no dice
              «reversible», pero es la única forma de resolverlo con los datos
              que da, y es lo que supone la resolución oficial:
              $PV^{\gamma}$ constante.
          - texto: No cambia, porque en un adiabático no entra ni sale calor
            mensaje: |
              Que no entre calor no significa que no cambie la temperatura: el
              trabajo también cambia la energía interna. Temperatura constante
              es un **isotermo**, que es el caso contrario: ahí el gas suelta
              como calor todo el trabajo que recibe.
          - texto: Baja, porque el gas se comprime sin recibir calor
            mensaje: |
              Al comprimir entra energía como trabajo, y sin poder soltarla
              como calor se queda dentro. La temperatura baja en una
              **expansión** adiabática, cuando el gas paga el trabajo con su
              propia energía.
          - texto: No se puede saber sin la presión final
            mensaje: |
              Se puede, y sin números: con $q = 0$ y $W > 0$, $\Delta U$ es
              positivo y la temperatura sube. La presión final sale después,
              de $PV^{\gamma}$ constante.

      - tipo: calcular
        titulo: La temperatura al final de la compresión adiabática
        pregunta: |
          ¿A qué temperatura acaba el gas, en el estado de 2 L?
        respuesta:
          tipo: magnitud
          valor: '47.94 K'
          tolerancia: 0.001
          formato: una temperatura, con su unidad
        distractores:
          - valor: '36.59 K'
            mensaje: |
              Esa es la temperatura de partida del tramo: lo has tratado como
              un isotermo. En un adiabático el trabajo que entra calienta el
              gas.
          - valor: '71.91 K'
            mensaje: |
              Has elevado el cociente de volúmenes a $\gamma$ en vez de a
              $\gamma - 1$. Con presiones y volúmenes va $\gamma$,
              $PV^{\gamma}$; con temperaturas y volúmenes, $TV^{\gamma-1}$.
          - valor: '27.92 K'
            mensaje: |
              Has puesto el cociente de volúmenes al revés, 2/3 en vez de 3/2,
              y te sale que el gas se enfría al comprimirlo. Si la temperatura
              baja en una compresión adiabática, algo está invertido.
        pista: |
          $T_2V_2^{\gamma-1} = T_3V_3^{\gamma-1}$ con $\gamma = 5/3$ para un gas
          monoatómico. O primero la presión, $P_2V_2^{\gamma} = P_3V_3^{\gamma}$,
          y después $T_3 = P_3V_3/nR$.
        desarrollo: |
          $$
          T_3 = T_2\left(\frac{V_2}{V_3}\right)^{\gamma-1}
          = 36{,}585\cdot 1{,}5^{2/3} = 47{,}94\ \text{K}
          \qquad
          P_3 = 2\cdot 1{,}5^{5/3} = 3{,}93\ \text{atm}
          $$

          Es el resultado de la resolución oficial, que da 47,93 K al partir
          de la presión ya redondeada. Un aviso sobre su cuenta: escribe
          γ = 1,66, pero calcula con 5/3; con 1,66 la presión saldría
          3,92 atm y no 3,93. Para un gas monoatómico γ es 5/3 exacto.

      - tipo: calcular
        titulo: El trabajo del tramo adiabático, que es su ΔU
        pregunta: |
          Con $q = 0$, ¿cuánto valen el trabajo y $\Delta U$ del tramo ii)? Son
          el mismo número.
        respuesta:
          tipo: magnitud
          valor: '283.1 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '-283.1 J'
            mensaje: |
              El signo: el gas se comprime, así que recibe trabajo y $W > 0$.
              Con $q = 0$, la energía interna sube lo mismo.
          - valor: '202.7 J'
            mensaje: |
              Has usado $-P\,\Delta V$ con los 2 atm de partida, como si la
              presión no cambiara. En un adiabático sube de 2 a 3,93 atm
              durante el tramo: el trabajo sale de $\Delta U = n\,C_v\,\Delta T$.
          - valor: '471.8 J'
            mensaje: |
              Has usado $C_p$. Eso da la entalpía; la energía interna de un gas
              ideal va siempre con $C_v$, sea cual sea el proceso.
        pista: |
          $\Delta U = n\,C_v\,\Delta T$ con $C_v = \tfrac{3}{2}R$, y con
          $q = 0$ la primera ley da $W = \Delta U$.
        desarrollo: |
          $$
          W = \Delta U = 2\cdot \tfrac{3}{2}\cdot 8{,}31\cdot(47{,}94-36{,}585) = 283{,}1\ \text{J}
          $$

          El calor es cero: es la definición de adiabático. La resolución
          oficial da 282,95 J con las temperaturas redondeadas, 47,93 y
          36,58: coincide.

      - tipo: calcular
        titulo: La entalpía del tramo adiabático
        pregunta: |
          ¿Y $\Delta H$ en el tramo ii)?
        respuesta:
          tipo: magnitud
          valor: '471.8 J'
          tolerancia: 0.001
          formato: una energía, con su unidad
        distractores:
          - valor: '0 J'
            mensaje: |
              Has usado $\Delta H = q$, que solo vale a **presión constante**.
              En el tramo adiabático la presión sube de 2 a 3,93 atm, y que el
              calor sea cero no dice nada de la entalpía.
          - valor: '283.1 J'
            mensaje: |
              Esa es la energía interna. La entalpía le suma
              $\Delta(PV) = nR\,\Delta T$, que aquí no es cero porque la
              temperatura sube.
        pista: |
          $\Delta H = n\,C_p\,\Delta T$, o $\Delta H = \Delta U + nR\,\Delta T$.
        desarrollo: |
          $$
          \Delta H = \Delta U + nR\,\Delta T = 283{,}1 + 2\cdot 8{,}31\cdot 11{,}355 = 471{,}8\ \text{J}
          $$

          La resolución oficial da 471,59 J con las temperaturas redondeadas:
          coincide.

      - tipo: calcular
        titulo: La entropía del tramo adiabático
        pregunta: |
          ¿Cuánto cambia la entropía en el tramo ii)?
        respuesta:
          tipo: magnitud
          valor: '0 J/K'
          tolerancia: 0.01
          formato: una entropía, con su unidad
        distractores:
          - valor: '6.74 J/K'
            mensaje: |
              Has calculado solo $n\,C_v\ln(T_3/T_2)$, el efecto de
              calentarse. Comprimir a la vez baja la entropía,
              $nR\ln(V_3/V_2)$, y en un adiabático reversible los dos términos
              se cancelan exactos.
          - valor: '11.23 J/K'
            mensaje: |
              Has usado $n\,C_p\ln(T_3/T_2)$, la fórmula del tramo a presión
              constante. Aquí la presión no es constante, y vale la
              definición: $\Delta S = \int dq_{\text{rev}}/T$, con
              $dq_{\text{rev}} = 0$.
          - valor: '-6.74 J/K'
            mensaje: |
              Has contado solo la compresión, $nR\ln(V_3/V_2)$, como en un
              isotermo. Pero la temperatura sube, y ese término positivo
              cancela el negativo.
        pista: |
          $\Delta S = \int dq_{\text{rev}}/T$. En un adiabático reversible,
          ¿cuánto vale $dq_{\text{rev}}$?
        desarrollo: |
          $$
          \Delta S = \int \frac{dq_{\text{rev}}}{T} = 0
          $$

          Sin calor reversible no hay cambio de entropía, aunque la
          temperatura suba: por eso un adiabático reversible se llama
          isoentrópico. Se comprueba con los dos términos del gas ideal:

          $$
          n\,C_v\ln\frac{T_3}{T_2} + nR\ln\frac{V_3}{V_2} = 6{,}74 - 6{,}74 = 0
          $$

          Es el resultado de la resolución oficial. La casilla acepta hasta
          0,01 J/K, lo que dejan los redondeos de las temperaturas.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Con ΔU = q + W, comprimir da trabajo positivo: en el tramo
              isóbaro W = −PΔV = 4 atm·L, o sea 405,3 J.
          - texto: >-
              A presión constante el calor es la entalpía: q = ΔH = nCpΔT =
              −1013,4 J, y ΔU = q + W = −608,1 J.
          - texto: >-
              La entropía baja, nCp ln(3/5) = −21,22 J/K, porque el gas se
              enfría de 61 a 37 K soltando calor.
          - texto: >-
              En el adiabático q = 0, así que W = ΔU = 283,1 J, y la
              temperatura sube a 47,94 K.
          - texto: >-
              ΔH = nCpΔT = 471,8 J y ΔS = 0, porque el calor reversible es
              cero.
          - texto: >-
              Como en el tramo adiabático no se intercambia calor, su entalpía
              tampoco cambia: ΔH = q = 0.
            trampa: true
            mensaje: |
              $\Delta H = q$ solo vale a presión constante, y en el tramo
              adiabático la presión sube de 2 a 3,93 atm. La entalpía es
              función de estado: cambia porque cambia la temperatura,
              $\Delta H = n\,C_p\,\Delta T = 471{,}8$ J, venga o no calor.
        veredicto: |
          Dos tramos y la misma pregunta en cada uno: qué se mantiene. A
          presión constante, el calor es la entalpía; sin calor, el trabajo es
          la energía interna.

    resolucion: |
      **Lo que se pide.** Cinco magnitudes en dos tramos, y en cada tramo hay
      una que se sabe sin calcular: a presión constante, $q = \Delta H$; en el
      adiabático, $q = 0$. Todo con el convenio de la asignatura,
      $\Delta U = q + W$ y $W = -\int P\,dV$, y con los calores del gas
      monoatómico, $C_v = \tfrac{3}{2}R$ y $C_p = \tfrac{5}{2}R$.

      Las temperaturas no las da el enunciado; salen de $PV = nRT$ con
      R = 0,082:

      $$
      T_1 = \frac{2\cdot 5}{2\cdot 0{,}082} = 60{,}98\ \text{K}
      \qquad
      T_2 = \frac{2\cdot 3}{2\cdot 0{,}082} = 36{,}59\ \text{K}
      $$

      Son muy bajas, y es lo que dan los datos: dos moles en 5 L a solo 2 atm.

      ## i) La compresión a presión constante

      | magnitud | cómo sale | valor |
      |---|---|---|
      | $W$ | $-P\,\Delta V$, 4 atm·L | **+405,3 J** |
      | $q$ | $n\,C_p\,\Delta T$ | **−1013,4 J** |
      | $\Delta U$ | $q + W$ | **−608,1 J** |
      | $\Delta H$ | $q_P$ | **−1013,4 J** |
      | $\Delta S$ | $n\,C_p\ln(T_2/T_1)$ | **−21,22 J/K** |

      El trabajo es positivo porque lo comprimen, y aun así la energía
      interna baja: el gas se enfría y suelta como calor más de lo que recibe
      como trabajo. Y como a presión constante $T_2/T_1 = V_2/V_1 = 3/5$, la
      entropía sale sin las temperaturas:

      $$
      \Delta S = 2\cdot \tfrac{5}{2}\cdot 8{,}31\cdot \ln\frac{3}{5} = -21{,}22\ \text{J/K}
      $$

      ## ii) La compresión adiabática

      El enunciado no dice «reversible», pero es la única forma de resolverlo
      con un solo dato de volumen, y es lo que supone la resolución oficial:
      $PV^{\gamma}$ constante, con $\gamma = 5/3$.

      $$
      T_3 = 36{,}585\cdot 1{,}5^{2/3} = 47{,}94\ \text{K}
      \qquad
      P_3 = 2\cdot 1{,}5^{5/3} = 3{,}93\ \text{atm}
      $$

      | magnitud | cómo sale | valor |
      |---|---|---|
      | $q$ | adiabático | **0** |
      | $W = \Delta U$ | $n\,C_v\,\Delta T$ | **+283,1 J** |
      | $\Delta H$ | $n\,C_p\,\Delta T$ | **+471,8 J** |
      | $\Delta S$ | $\int dq_{\text{rev}}/T$ | **0** |

      La temperatura sube porque el trabajo que entra no puede salir como
      calor. Y la entalpía cambia aunque $q = 0$: la igualdad $q = \Delta H$
      es solo de los procesos a presión constante.

      ## Contra la resolución oficial

      Coinciden los diez resultados, con diferencias en la última cifra que
      vienen de redondear las temperaturas a 60,97, 36,58 y 47,93 K. Dos
      erratas de escritura que no afectan a sus cuentas:

      - escribe «1,023·10⁵ N/m²» por atmósfera; es 1,013·10⁵, que es con el
        que calcula, porque le sale 405,2 J (con 1,023 serían 409,2);
      - escribe γ = 1,66 y calcula con 5/3: con 1,66 la presión final sería
        3,92 atm, y ella da 3,93.

  # ── La segunda pieza del ejercicio 5: los órdenes por velocidades
  #    iniciales. Dentro del apartado b) el enunciado vuelve a llamar a) y b)
  #    a sus dos preguntas, y así se reproduce.
  - id: exfq1213-ord-5-el-orden-por-velocidades-iniciales
    titulo: Tres experimentos, dos órdenes y una velocidad nueva
    fuente: >-
      Ejercicio 5, apartado b · Convocatoria ordinaria del 31 de mayo de 2013,
      curso 2012-2013 · Fundamentos Químicos de la Ingeniería (25975),
      UPV/EHU · El enunciado se transcribe de la resolución oficial
      mecanografiada. La resolución guiada es nuestra, contrastada con esa
      resolución oficial: coinciden los órdenes, 2 en X y 1 en Y, la
      constante, 10,58 M⁻²·s⁻¹, y la velocidad, 0,381 M/s. La oficial escribe
      «0,254 = k[0,020]²[0,06]¹», con un cero de más en cada concentración,
      pero calcula con 0,20 y 0,60.
    nivel: examen
    enunciado: |
      **a)** Dos moles de un gas monoatómico ideal se encuentran a una presión
      de 2 atm en un recipiente de 5 L, calcular el trabajo, calor, energía
      interna, entalpía y entropía si:

      i) El gas se comprime hasta un volumen de 3 L a presión constante.

      ii) A continuación, el gas se comprime hasta un volumen de 2 L mediante
      un proceso adiabático.

      **b)** Considerar la siguiente reacción: X + Y → Z

      A partir de los siguientes datos, obtenidos a 360 K, a) determinar el
      orden de la reacción y b) determinar la velocidad inicial de
      desaparición de X cuando su concentración es 0,30 M y la de Y 0,40 M

      | Velocidad inicial de desaparición de X (M/s) | [X] (M) | [Y] (M) |
      |---|---|---|
      | 0,254 | 0,20 | 0,60 |
      | 0,509 | 0,40 | 0,30 |
      | 1,02 | 0,40 | 0,60 |

      *De los dos apartados, aquí se resuelve el **b)**, que es del tema 8.
      El a), la termodinámica del gas, se resuelve en su propia pieza, con el
      tema 5.*
    pide: >-
      Los órdenes respecto de X y de Y, la constante de velocidad y la
      velocidad inicial con 0,30 M de X y 0,40 M de Y.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para sacar el orden respecto de X, ¿qué dos experimentos se comparan?
        opciones:
          - texto: >-
              El 1 y el 3: la concentración de Y es la misma, 0,60 M, y la de X
              se dobla
            correcta: true
            mensaje: |
              Eso es. Entre dos experimentos en los que solo cambia una
              concentración, todo lo demás se cancela en el cociente de
              velocidades, y lo que queda es esa concentración elevada a su
              orden. Para Y, los que sirven son el 2 y el 3.
          - texto: El 1 y el 2, porque son los dos primeros
            mensaje: |
              Entre el 1 y el 2 cambian **las dos** concentraciones: la de X se
              dobla y la de Y baja a la mitad. El cociente de velocidades
              mezcla los dos efectos y no se puede atribuir a ninguna.
          - texto: >-
              Ninguno: el orden respecto de X es 1, su coeficiente en la
              ecuación
            mensaje: |
              Los coeficientes dicen cuánto reacciona, no cómo depende la
              velocidad de las concentraciones. Solo coinciden si la reacción
              es elemental, y el enunciado no lo dice: el orden se mide
              (tema 8).
          - texto: Los tres a la vez, promediando las velocidades
            mensaje: |
              Promediar velocidades de experimentos distintos no aísla nada. El
              método de las velocidades iniciales compara de dos en dos,
              eligiendo la pareja en la que solo cambia la concentración que
              se estudia.

      - tipo: calcular
        titulo: El orden respecto de X
        pregunta: |
          Del experimento 1 al 3 se dobla [X] y la velocidad pasa de 0,254 a
          1,02 M/s. ¿Qué orden tiene la reacción respecto de X?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Es el coeficiente de X en la ecuación. El orden se mide: al doblar
              [X] la velocidad se multiplica por 4, y $2^{2} = 4$.
          - valor: '4'
            mensaje: |
              Cuatro es lo que se multiplica la **velocidad**. El orden es el
              exponente que convierte el 2 de la concentración en ese 4:
              $2^{\alpha} = 4$, así que $\alpha = 2$.
        pista: |
          $v_3/v_1 = ([\mathrm{X}]_3/[\mathrm{X}]_1)^{\alpha}$, con [Y] igual en
          los dos.
        desarrollo: |
          $$
          \frac{v_3}{v_1} = \frac{1{,}02}{0{,}254} = 4{,}02 = 2^{\alpha}
          \;\Longrightarrow\;
          \alpha = 2
          $$

          El 4,02 no es un 4 justo porque los datos son medidas. El orden es un
          entero, y la casilla acepta también el 2,006 que da el logaritmo. Es
          el resultado de la resolución oficial.

      - tipo: calcular
        titulo: El orden respecto de Y
        pregunta: |
          Del experimento 2 al 3 se dobla [Y] con la misma [X]. ¿Qué orden
          tiene respecto de Y?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '-1'
            mensaje: |
              Has comparado el 1 con el 2, donde cambian las dos
              concentraciones: [Y] baja a la mitad, pero [X] se dobla a la
              vez, y la velocidad se duplica por culpa de X. Hay que comparar
              el 2 con el 3, donde solo cambia [Y].
          - valor: '2'
            mensaje: |
              Dos es lo que se multiplica la velocidad al doblar [Y]. El orden
              es el exponente: $2^{\beta} = 2$, así que $\beta = 1$.
        pista: |
          $v_3/v_2 = ([\mathrm{Y}]_3/[\mathrm{Y}]_2)^{\beta}$, con [X] igual en
          los dos.
        desarrollo: |
          $$
          \frac{v_3}{v_2} = \frac{1{,}02}{0{,}509} = 2{,}00 = 2^{\beta}
          \;\Longrightarrow\;
          \beta = 1
          $$

          La ley de velocidad queda $v = k[\mathrm{X}]^{2}[\mathrm{Y}]$, de orden
          global 3. Es el resultado de la resolución oficial.

      - tipo: calcular
        titulo: La constante de velocidad
        pregunta: |
          ¿Cuánto vale la constante de velocidad?
        respuesta:
          tipo: numero
          valor: '10.58'
          tolerancia: 0.05
          formato: la constante en M⁻²·s⁻¹, con dos decimales
        distractores:
          - valor: '2.117'
            mensaje: |
              Has usado órdenes 1 y 1, los coeficientes de la ecuación:
              $k = 0{,}254/(0{,}20\cdot 0{,}60)$. Con los órdenes medidos, [X]
              va al cuadrado.
          - valor: '3.528'
            mensaje: |
              Has cambiado los órdenes: [X] a la primera y [Y] al cuadrado. El 2
              es de X, que es la que cuadruplica la velocidad al doblarse.
          - valor: '10583'
            mensaje: |
              Has dividido entre $0{,}020^{2}\cdot 0{,}06$: son las
              concentraciones con un cero de más, que es justo como las
              escribe la resolución oficial. En la tabla son 0,20 y 0,60.
        pista: |
          Despeja $k$ de cualquier experimento:
          $k = v/([\mathrm{X}]^{2}[\mathrm{Y}])$.
        desarrollo: |
          $$
          k = \frac{0{,}254}{0{,}20^{2}\cdot 0{,}60} = 10{,}58\ \text{M}^{-2}\,\text{s}^{-1}
          $$

          Con el experimento 2 sale 10,60 y con el 3, 10,63, porque los datos
          son medidas: la casilla acepta de 10,53 a 10,63. La resolución
          oficial la saca del 1, igual que aquí, y la da en L²/(mol²·s), que es
          la misma unidad.

      - tipo: calcular
        titulo: La velocidad con 0,30 M de X y 0,40 M de Y
        pregunta: |
          ¿Cuál es la velocidad inicial de desaparición de X con
          [X] = 0,30 M e [Y] = 0,40 M?
        respuesta:
          tipo: numero
          valor: '0.381'
          tolerancia: 0.002
          formato: la velocidad en M/s, con tres decimales
        distractores:
          - valor: '1.270'
            mensaje: |
              Te has dejado el cuadrado de [X]: $10{,}58\cdot 0{,}30\cdot 0{,}40$.
              La ley es $v = k[\mathrm{X}]^{2}[\mathrm{Y}]$.
          - valor: '0.169'
            mensaje: |
              Es lo que sale con los órdenes cambiados,
              $v = k[\mathrm{X}][\mathrm{Y}]^{2}$ con $k = 3{,}528$. El cuadrado
              es de X.
          - valor: '0.254'
            mensaje: |
              Es lo que sale con órdenes 1 y 1: $k = 2{,}117$ y
              $v = 2{,}117\cdot 0{,}30\cdot 0{,}40$. Que coincida con la del
              primer experimento es casualidad: $0{,}30\cdot 0{,}40$ y
              $0{,}20\cdot 0{,}60$ valen lo mismo.
        pista: |
          Con la ley de velocidad y la constante del paso anterior. Como X
          lleva coeficiente 1, su velocidad de desaparición es la de la
          reacción.
        desarrollo: |
          $$
          v = 10{,}58\cdot 0{,}30^{2}\cdot 0{,}40 = 0{,}381\ \text{M/s}
          $$

          Es el resultado de la resolución oficial. Con la $k$ de los otros
          experimentos sale 0,382, y la casilla acepta de 0,379 a 0,383.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Del experimento 1 al 3 solo cambia [X], que se dobla, y la
              velocidad se multiplica por 4: orden 2 en X.
          - texto: >-
              Del 2 al 3 solo cambia [Y], que se dobla, y la velocidad se
              dobla: orden 1 en Y.
          - texto: >-
              La ley es v = k[X]²[Y], de orden global 3, y del experimento 1
              sale k = 10,58 M⁻²·s⁻¹.
          - texto: >-
              Con [X] = 0,30 M e [Y] = 0,40 M, la velocidad es 10,58 · 0,30² ·
              0,40 = 0,381 M/s.
          - texto: >-
              Como la ecuación es X + Y → Z, la reacción es de orden 1 en cada
              reactivo y de orden 2 en total.
            trampa: true
            mensaje: |
              Los coeficientes de la ecuación no son los órdenes, salvo que la
              reacción sea elemental, y el enunciado no lo dice. Los órdenes se
              miden, y los datos dicen 2 en X: al doblar [X], la velocidad se
              cuadruplica. Con órdenes 1 y 1 la velocidad pedida saldría
              0,254 M/s.
        veredicto: |
          Los órdenes salen de los datos, comparando dos experimentos en los
          que solo cambia una concentración. La ecuación química no los da.

    resolucion: |
      **Lo que se pide.** Los órdenes de una ley de velocidad a partir de tres
      experimentos, y con ellos una velocidad nueva. El método es el de las
      velocidades iniciales: comparar dos experimentos en los que solo cambia
      una concentración.

      ## El orden respecto de X

      Los experimentos 1 y 3 tienen la misma [Y], 0,60 M, y [X] se dobla:

      $$
      \frac{v_3}{v_1} = \frac{1{,}02}{0{,}254} = 4{,}02
      \;\Longrightarrow\;
      2^{\alpha} = 4
      \;\Longrightarrow\;
      \alpha = 2
      $$

      ## El orden respecto de Y

      Los experimentos 2 y 3 tienen la misma [X], 0,40 M, y [Y] se dobla:

      $$
      \frac{v_3}{v_2} = \frac{1{,}02}{0{,}509} = 2{,}00
      \;\Longrightarrow\;
      \beta = 1
      $$

      La ley es $v = k[\mathrm{X}]^{2}[\mathrm{Y}]$: orden 2 en X, orden 1 en Y
      y orden global 3. Los coeficientes de la ecuación, uno y uno, no tenían
      nada que decir.

      ## La constante y la velocidad

      $$
      k = \frac{0{,}254}{0{,}20^{2}\cdot 0{,}60} = 10{,}58\ \text{M}^{-2}\,\text{s}^{-1}
      $$
      $$
      \boxed{\;v = 10{,}58\cdot 0{,}30^{2}\cdot 0{,}40 = 0{,}381\ \text{M/s}\;}
      $$

      Como X lleva coeficiente 1, la velocidad de desaparición de X es la de
      la reacción.

      ## Contra la resolución oficial

      Coinciden los órdenes, la constante y la velocidad. En la línea de la
      constante escribe «0,254 = k[0,020]²[0,06]¹», con un cero de más en cada
      concentración; su cuenta usa 0,20 y 0,60, porque con los números
      escritos saldría 10 583 y no 10,58.

  # ── El ejercicio 6 también cruza temas y se parte en dos. Esta pieza es la
  #    de Hess: se conoce la entalpía de la descomposición y falta la de
  #    formación de un reactivo. «Escribir la ecuación» no tiene lector, así
  #    que va como un reconocer con las ecuaciones candidatas, entre ellas la
  #    de la resolución oficial, que pone el agua en gas.
  - id: exfq1213-ord-6-la-trinitroglicerina-por-hess
    titulo: La trinitroglicerina, su descomposición y su entalpía de formación
    fuente: >-
      Ejercicio 6, apartado a · Convocatoria ordinaria del 31 de mayo de 2013,
      curso 2012-2013 · Fundamentos Químicos de la Ingeniería (25975),
      UPV/EHU · El enunciado se transcribe de la resolución oficial
      mecanografiada. La resolución guiada es nuestra, contrastada con esa
      resolución oficial: coincide la entalpía de formación, −353,6 kJ/mol.
      La oficial escribe la descomposición con ΔH° = +1541,4 kJ cuando el
      enunciado dice −1541,4, y con el agua en gas cuando el enunciado la da
      líquida; sus cuentas usan el signo y el agua buenos.
    nivel: examen
    enunciado: |
      **a)** La entalpía de descomposición de la trinitroglicerina,
      C₃H₅N₃O₉, a 1 atm de presión y 25 ºC para la formar nitrógeno gaseoso,
      dióxido de carbono gaseoso, agua líquida y oxigeno gaseoso es de
      -1541,4 kJ/mol

      i) Escribir la ecuación balanceada para la descomposición de la
      trinitroglicerina.

      ii) Calcular la entalpía de de formación de la trinitroglicerina

      **b)** Se funden, a presión de 1 atm, 1,80 kg de hielo a 260 K
      introduciéndolos en un recipiente -

      ΔH⁰<sub>f</sub> (CO₂(g)) = -393,5 kJ/mol, ΔH⁰<sub>f</sub> (HO₂(l)) = -285,8 kJ/mol

      ΔH⁰<sub>fusión</sub> (hielo) = 6,01 kJ/mol, C<sub>p</sub> (hielo) = 36,56 J/mol.K

      C<sub>p</sub> (H₂O) = 75,39 J/mol.K

      *En los datos, «HO₂(l)» es el agua líquida, H₂O(l): la fórmula está mal
      escrita en el original.*

      *De los dos apartados, aquí se resuelve el **a)**, que es del tema 6.
      El b) se resuelve en su propia pieza, con el tema 7; su enunciado está
      cortado en el documento, y allí se explica qué falta.*
    pide: >-
      La ecuación ajustada de la descomposición y la entalpía de formación de
      la trinitroglicerina.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado i) pide la ecuación ajustada de la descomposición, con los
          productos que nombra el enunciado. ¿Cuál es?
        opciones:
          - texto: >-
              $\mathrm{C_3H_5N_3O_9\,(l)} \rightarrow 3\,\mathrm{CO_2\,(g)} +
              \tfrac{5}{2}\,\mathrm{H_2O\,(l)} + \tfrac{3}{2}\,\mathrm{N_2\,(g)}
              + \tfrac{1}{4}\,\mathrm{O_2\,(g)}$
            correcta: true
            mensaje: |
              Eso es. Carbono, hidrógeno y nitrógeno se ajustan solos, uno por
              producto; el oxígeno se deja para el final: 9 a la izquierda
              contra 6 + 5/2 a la derecha, y el cuarto de O₂ pone el medio
              átomo que falta. Y el agua, **líquida**, como dice el enunciado.
          - texto: >-
              $\mathrm{C_3H_5N_3O_9\,(l)} \rightarrow 3\,\mathrm{CO_2\,(g)} +
              \tfrac{5}{2}\,\mathrm{H_2O\,(g)} + \tfrac{3}{2}\,\mathrm{N_2\,(g)}
              + \tfrac{1}{4}\,\mathrm{O_2\,(g)}$
            mensaje: |
              Los átomos cuadran, y es la ecuación que escribe la resolución
              oficial, pero el enunciado dice **agua líquida**, y los
              −1541,4 kJ/mol son de esa reacción. El estado del agua cambia la
              entalpía: es la trampa que más cuesta del tema 6.
          - texto: >-
              $\mathrm{C_3H_5N_3O_9\,(l)} \rightarrow 3\,\mathrm{CO_2\,(g)} +
              \tfrac{5}{2}\,\mathrm{H_2O\,(l)} + \tfrac{3}{2}\,\mathrm{N_2\,(g)}$
            mensaje: |
              Faltan oxígenos: hay 9 a la izquierda y solo 6 + 5/2 = 8,5 a la
              derecha. Por eso el enunciado nombra también el oxígeno gaseoso
              entre los productos.
          - texto: >-
              $\mathrm{C_3H_5N_3O_9\,(l)} \rightarrow 3\,\mathrm{CO_2\,(g)} +
              \tfrac{5}{2}\,\mathrm{H_2O\,(l)} + \tfrac{3}{2}\,\mathrm{N_2\,(g)}
              + \tfrac{1}{2}\,\mathrm{O_2\,(g)}$
            mensaje: |
              Has puesto medio O₂ por el medio átomo de oxígeno que sobra. Medio
              átomo es un cuarto de molécula: con 1/2 de O₂ saldrían 9,5
              oxígenos a la derecha.

      - tipo: calcular
        titulo: Lo que suman las formaciones de los productos
        pregunta: |
          Por Hess,
          $\Delta H_{\text{desc}} = \sum \Delta H^{0}_f(\text{productos}) - \Delta H^{0}_f(\mathrm{C_3H_5N_3O_9})$.
          ¿Cuánto suman las entalpías de formación de los productos?
        respuesta:
          tipo: numero
          valor: '-1895.0'
          tolerancia: 0.1
          formato: la suma en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '-2609.5'
            mensaje: |
              Has puesto 5 moles de agua en vez de 5/2. La trinitroglicerina
              tiene 5 hidrógenos, y cada agua se lleva dos: son 5/2 de agua.
          - valor: '-1180.5'
            mensaje: |
              Te has dejado el agua. El nitrógeno y el oxígeno valen cero por
              ser elementos en su forma estable, pero el agua es un compuesto y
              tiene su entalpía de formación.
        pista: |
          Con los coeficientes de la ecuación: 3 de CO₂ y 5/2 de agua. El N₂ y
          el O₂ son elementos en su forma estable, y su entalpía de formación
          es cero.
        desarrollo: |
          $$
          \sum \Delta H^{0}_f(\text{productos})
          = 3\cdot(-393{,}5) + \tfrac{5}{2}\cdot(-285{,}8) = -1895{,}0\ \text{kJ}
          $$

          El dato del agua es el del agua líquida, aunque el enunciado lo
          escriba «HO₂(l)», y es el que corresponde: la descomposición la da
          líquida.

      - tipo: calcular
        titulo: La entalpía de formación de la trinitroglicerina
        pregunta: |
          ¿Cuánto vale la entalpía de formación de la trinitroglicerina?
        respuesta:
          tipo: numero
          valor: '-353.6'
          tolerancia: 0.1
          formato: la entalpía en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '-3436.4'
            mensaje: |
              Has tomado la descomposición como +1541,4 kJ, que es como la
              escribe la resolución oficial en el apartado i). El enunciado
              dice −1541,4: con el signo cambiado, al despejar restas los
              1541,4 en vez de sumarlos.
          - valor: '1541.4'
            mensaje: |
              Has invertido la descomposición y ya está, como si la formación
              fuera la reacción al revés. Pero la descomposición no da los
              **elementos**: da CO₂ y agua, que tienen su propia entalpía de
              formación, y hay que contarlas.
          - valor: '-1068.1'
            mensaje: |
              Has usado 5 moles de agua en vez de 5/2: los productos te suman
              −2609,5 kJ en lugar de −1895,0.
        pista: |
          Despeja:
          $\Delta H^{0}_f(\mathrm{C_3H_5N_3O_9}) = \sum \Delta H^{0}_f(\text{productos}) - \Delta H_{\text{desc}}$,
          con $\Delta H_{\text{desc}} = -1541{,}4$ kJ.
        desarrollo: |
          $$
          \Delta H^{0}_f(\mathrm{C_3H_5N_3O_9}) = -1895{,}0 - (-1541{,}4)
          = -353{,}6\ \text{kJ/mol}
          $$

          Es el resultado de la resolución oficial, que llega por el otro
          disfraz de Hess: suma la formación de 3 CO₂, la de 5/2 de agua y la
          descomposición al revés, y le sale lo mismo.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              La descomposición ajustada es C₃H₅N₃O₉(l) → 3 CO₂(g) + 5/2 H₂O(l)
              + 3/2 N₂(g) + 1/4 O₂(g), con el agua líquida del enunciado.
          - texto: >-
              Su entalpía, −1541,4 kJ/mol, es la suma de las formaciones de los
              productos menos la de la trinitroglicerina.
          - texto: >-
              Los productos suman 3(−393,5) + 5/2(−285,8) = −1895,0 kJ; el N₂ y
              el O₂ cuentan cero.
          - texto: >-
              Despejando, la formación de la trinitroglicerina vale −1895,0 +
              1541,4 = −353,6 kJ/mol.
          - texto: >-
              Como la formación es la descomposición al revés, su entalpía es
              +1541,4 kJ/mol.
            trampa: true
            mensaje: |
              La formación parte de los **elementos** —C, H₂, N₂ y O₂—, y la
              descomposición no acaba en ellos: acaba en CO₂ y agua, que tienen
              su propia entalpía de formación. Invertir la reacción no basta;
              hay que contar también cómo se forman los productos, y entonces
              sale −353,6 kJ/mol.
        veredicto: |
          La entalpía de una reacción es la diferencia entre productos y
          reactivos, todos contados desde los elementos. Conocida la de la
          reacción y las de los productos, la que falta se despeja.

    resolucion: |
      **Lo que se pide.** Ajustar la descomposición y, con su entalpía y las de
      formación del CO₂ y del agua, sacar la de la trinitroglicerina. Es el
      primer disfraz de Hess del tema 6, usado al revés: se conoce la entalpía
      de la reacción y falta la de un reactivo.

      ## i) La ecuación

      Carbono, hidrógeno y nitrógeno se ajustan solos; el oxígeno, el último:

      $$
      \mathrm{C_3H_5N_3O_9\,(l)} \rightarrow 3\,\mathrm{CO_2\,(g)}
      + \tfrac{5}{2}\,\mathrm{H_2O\,(l)} + \tfrac{3}{2}\,\mathrm{N_2\,(g)}
      + \tfrac{1}{4}\,\mathrm{O_2\,(g)}
      \qquad \Delta H = -1541{,}4\ \text{kJ}
      $$

      Con enteros, multiplicando por cuatro, es
      $4\,\mathrm{C_3H_5N_3O_9} \rightarrow 12\,\mathrm{CO_2} + 10\,\mathrm{H_2O} + 6\,\mathrm{N_2} + \mathrm{O_2}$,
      pero la entalpía del enunciado es por mol de trinitroglicerina, y por
      eso conviene la forma con fracciones.

      ## ii) La entalpía de formación

      $$
      \Delta H_{\text{desc}} = \sum \Delta H^{0}_f(\text{productos})
      - \Delta H^{0}_f(\mathrm{C_3H_5N_3O_9})
      $$
      $$
      -1541{,}4 = 3\cdot(-393{,}5) + \tfrac{5}{2}\cdot(-285{,}8)
      - \Delta H^{0}_f(\mathrm{C_3H_5N_3O_9})
      $$
      $$
      \boxed{\;\Delta H^{0}_f(\mathrm{C_3H_5N_3O_9}) = -1895{,}0 + 1541{,}4
      = -353{,}6\ \text{kJ/mol}\;}
      $$

      Sale negativa: frente a sus elementos, la trinitroglicerina es estable.
      Lo que la hace explosiva es lo lejos que quedan sus productos de
      descomposición, 1541,4 kJ más abajo.

      ## Contra la resolución oficial

      La entalpía de formación coincide, −353,6 kJ/mol, y la resolución llega
      por el segundo disfraz de Hess: suma la formación de 3 CO₂, la de 5/2 de
      agua y la descomposición invertida. Dos erratas en su apartado i):

      - escribe la descomposición con ΔH° = **+1541,4** kJ, y el enunciado
        dice −1541,4. En el ii) la invierte y escribe +1541,4, que sí es lo
        que corresponde a la reacción al revés, así que el resultado no
        cambia;
      - escribe «5/2 H₂O(g)» cuando el enunciado dice agua líquida, y en el
        ii) «5/2HO₂ g)», pero calcula con la formación del agua líquida,
        −285,8 kJ/mol. La cuenta es la buena y la etiqueta no.

  # ── La segunda pieza del ejercicio 6, y la única de esta convocatoria con el
  #    enunciado cortado: el documento oficial termina el apartado b) en «un
  #    recipiente» y un guion. Lo que falta —3600 g de agua a 350 K, y qué se
  #    calcula— se lee en la propia resolución, y la nota lo dice. Va al tema
  #    7 porque es donde está la entropía de un calentamiento y de un cambio
  #    de fase; el balance de calor es el del tema 6.
  - id: exfq1213-ord-6-el-hielo-que-se-funde-en-agua-caliente
    titulo: Hielo a 260 K en agua a 350 K, y la entropía que gana el conjunto
    fuente: >-
      Ejercicio 6, apartado b · Convocatoria ordinaria del 31 de mayo de 2013,
      curso 2012-2013 · Fundamentos Químicos de la Ingeniería (25975),
      UPV/EHU · El enunciado se transcribe de la resolución oficial
      mecanografiada, donde está cortado; lo que falta se toma de la propia
      resolución. La resolución guiada es nuestra, contrastada con esa
      resolución oficial: coinciden la temperatura final, 295,66 K, y las dos
      entropías, 2981 J/K el hielo y −2544 J/K el agua.
    nivel: examen
    enunciado: |
      **a)** La entalpía de descomposición de la trinitroglicerina,
      C₃H₅N₃O₉, a 1 atm de presión y 25 ºC para la formar nitrógeno gaseoso,
      dióxido de carbono gaseoso, agua líquida y oxigeno gaseoso es de
      -1541,4 kJ/mol

      i) Escribir la ecuación balanceada para la descomposición de la
      trinitroglicerina.

      ii) Calcular la entalpía de de formación de la trinitroglicerina

      **b)** Se funden, a presión de 1 atm, 1,80 kg de hielo a 260 K
      introduciéndolos en un recipiente -

      ΔH⁰<sub>f</sub> (CO₂(g)) = -393,5 kJ/mol, ΔH⁰<sub>f</sub> (HO₂(l)) = -285,8 kJ/mol

      ΔH⁰<sub>fusión</sub> (hielo) = 6,01 kJ/mol, C<sub>p</sub> (hielo) = 36,56 J/mol.K

      C<sub>p</sub> (H₂O) = 75,39 J/mol.K

      *En los datos, «HO₂(l)» es el agua líquida, H₂O(l): la fórmula está mal
      escrita en el original.*

      *El enunciado del b) está cortado en el documento oficial: termina en
      «introduciéndolos en un recipiente» y un guion. Lo que falta se lee en
      la resolución oficial, que resuelve el caso de «1800 g hielo a Ti =
      260K + 3600 g agua a Ti = 350K» y calcula la temperatura final y la
      variación de entropía del hielo y del agua. Aquí se resuelve el **b)**,
      que es del tema 7; el a) va en su propia pieza, con el tema 6.*
    pide: >-
      La temperatura final de la mezcla y la variación de entropía del hielo y
      del agua, que es lo que calcula la resolución oficial.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los 1800 g de hielo a 260 K acaban fundidos en los 3600 g de agua a
          350 K de la resolución. ¿Cómo es el balance de calor?
        opciones:
          - texto: >-
              El agua cede al enfriarse hasta la temperatura final lo que el
              hielo absorbe en tres tramos: calentarse a 273 K, fundirse y
              calentarse como agua
            correcta: true
            mensaje: |
              Eso es. El hielo no llega a la temperatura final de golpe:
              primero sube como hielo, con su $C_p$; luego se funde a
              temperatura constante; y el agua que sale sube con el $C_p$ del
              agua. El tramo que se olvida es el del medio (tema 6).
          - texto: >-
              El agua cede lo que el hielo absorbe al calentarse de 260 K a la
              temperatura final con su Cp
            mensaje: |
              Faltan dos cosas: la fusión, que a 273 K absorbe 6,01 kJ/mol sin
              subir la temperatura, y el cambio de $C_p$, porque por encima de
              273 K ya no es hielo. Con un solo tramo, el hielo parece mucho
              más barato de calentar.
          - texto: >-
              La temperatura final es la media de 260 y 350 K ponderada por las
              masas
            mensaje: |
              La media ponderada solo vale para dos masas de la misma
              sustancia, en el mismo estado y con el mismo $C_p$. Aquí el hielo
              tiene otro $C_p$ y además hay que fundirlo, y la fusión se lleva
              mucho calor sin subir un grado.
          - texto: El hielo cede calor al agua, porque está más frío
            mensaje: |
              El calor va siempre del cuerpo caliente al frío: el agua a 350 K
              lo cede y el hielo a 260 K lo absorbe.

      - tipo: calcular
        titulo: La temperatura final
        pregunta: |
          ¿Cuál es la temperatura final de la mezcla?
        respuesta:
          tipo: magnitud
          valor: '295.66 K'
          tolerancia: 0.001
          formato: una temperatura, con su unidad
        distractores:
          - valor: '297.76 K'
            mensaje: |
              Te has saltado el primer tramo del hielo, de 260 a 273 K. Antes
              de fundirse tiene que calentarse, y eso son 47,5 kJ que también
              pone el agua.
          - valor: '322.23 K'
            mensaje: |
              Te has dejado la fusión: 100 mol de hielo a 6,01 kJ/mol son
              601 kJ que el agua cede mientras el hielo se funde sin subir un
              grado. Es el tramo que más pesa.
        pista: |
          Con n = m/18: el agua cede $n\,C_p(350 - T_f)$ y el hielo absorbe
          $n\,C_p^{\text{hielo}}(273 - 260) + n\,\Delta H_{\text{fus}} + n\,C_p(T_f - 273)$.
          Iguala y despeja.
        desarrollo: |
          $$
          200\cdot 75{,}39\,(350-T_f) = 100\cdot 36{,}56\cdot 13 + 100\cdot 6010
          + 100\cdot 75{,}39\,(T_f-273)
          $$
          $$
          5\,277\,300 - 15\,078\,T_f = 47\,528 + 601\,000 + 7539\,T_f - 2\,058\,147
          $$
          $$
          T_f = \frac{5\,277\,300 + 1\,409\,619}{22\,617} = 295{,}66\ \text{K}
          $$

          Es el resultado de la resolución oficial. Con 273,15 en vez de 273
          sale 295,69 K, y la casilla acepta los dos. La masa molar del agua
          no cambia nada: hielo y agua son la misma sustancia, y se cancela.

      - tipo: calcular
        titulo: La entropía que gana el hielo
        pregunta: |
          ¿Cuánto aumenta la entropía del hielo en todo el proceso?
        respuesta:
          tipo: magnitud
          valor: '2981 J/K'
          tolerancia: 0.003
          formato: una entropía, con su unidad
        distractores:
          - valor: '2201 J/K'
            mensaje: |
              Esa es solo la de la fusión. Faltan los dos calentamientos, el del
              hielo hasta 273 K y el del agua que sale de él hasta 295,66 K.
          - valor: '781.7 J/K'
            mensaje: |
              Has metido el calor de fusión en kJ, 6,01, con todo lo demás en
              julios: la fusión te sale mil veces más pequeña. Son 6010 J/mol.
          - valor: '53657 J/K'
            mensaje: |
              Has usado los gramos como si fueran moles: 1800 en vez de 100.
              Los $C_p$ y el calor de fusión del enunciado son **molares**, por
              mol.
        pista: |
          Tres tramos. En los dos calentamientos la temperatura cambia y va
          $n\,C_p\ln(T_2/T_1)$; en la fusión es constante y va
          $n\,\Delta H_{\text{fus}}/T$.
        desarrollo: |
          $$
          \Delta S_{\text{hielo}} = 100\cdot 36{,}56\ln\frac{273}{260} + \frac{100\cdot 6010}{273}
          + 100\cdot 75{,}39\ln\frac{295{,}66}{273}
          $$
          $$
          \Delta S_{\text{hielo}} = 178{,}4 + 2201{,}5 + 601{,}1 = 2981\ \text{J/K}
          $$

          Es el resultado de la resolución oficial. La casilla acepta un
          0,3 % a cada lado: con 18,02 g/mol para el agua, o con 273,15 K, la
          cifra baja unas unidades.

      - tipo: calcular
        titulo: La entropía que pierde el agua
        pregunta: |
          ¿Y cuánto cambia la entropía de los 3600 g de agua?
        respuesta:
          tipo: magnitud
          valor: '-2544 J/K'
          tolerancia: 0.003
          formato: una entropía, con su unidad
        distractores:
          - valor: '2544 J/K'
            mensaje: |
              El signo: el agua se enfría de 350 a 295,66 K, cede calor, y su
              entropía **baja**. El logaritmo de 295,66 entre 350 es negativo.
          - valor: '-2341 J/K'
            mensaje: |
              Has dividido el calor que cede el agua entre 350 K, su
              temperatura inicial. La temperatura cambia durante el
              enfriamiento, y eso obliga a integrar: $n\,C_p\ln(T_f/T_i)$
              (tema 7).
          - valor: '-45793 J/K'
            mensaje: |
              Has usado los gramos como si fueran moles: 3600 en vez de 200.
        pista: |
          $\Delta S_{\text{agua}} = n\,C_p\ln(T_f/T_i)$, con 200 mol, de 350 K a
          la temperatura final.
        desarrollo: |
          $$
          \Delta S_{\text{agua}} = 200\cdot 75{,}39\ln\frac{295{,}66}{350} = -2544\ \text{J/K}
          $$

          Es el resultado de la resolución oficial. El hielo gana más de lo
          que pierde el agua: suponiendo, como la resolución, que no se escapa
          calor del recipiente, el conjunto sube 437 J/K, que es lo que pide
          la segunda ley a un proceso espontáneo (tema 7).

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua a 350 K cede calor y el hielo a 260 K lo absorbe en tres
              tramos: calentarse hasta 273 K, fundirse y calentarse como agua.
          - texto: >-
              Igualando los dos calores, con 100 mol de hielo y 200 de agua, la
              temperatura final es 295,66 K.
          - texto: >-
              La entropía del hielo sube 2981 J/K: dos logaritmos para los
              calentamientos y ΔH/T para la fusión.
          - texto: >-
              La del agua baja 2544 J/K, con el logaritmo de 295,66 entre 350.
          - texto: >-
              El total sube 437 J/K, como corresponde a un proceso espontáneo en
              un recipiente que no pierde calor.
          - texto: >-
              Como el calor que cede el agua es el que absorbe el hielo, las dos
              entropías son iguales y de signo contrario.
            trampa: true
            mensaje: |
              Los calores sí son iguales, pero la entropía es calor **dividido
              por la temperatura**, y el hielo lo recibe más frío de lo que el
              agua lo cede. El mismo julio desordena más a 270 K que a 320 K:
              por eso el hielo gana 2981 J/K, el agua pierde solo 2544 y el
              total sube 437.
        veredicto: |
          El balance de calor se hace con una igualdad; el de entropía, no. El
          mismo calor pasa de lo caliente a lo frío y la entropía total sube:
          esa diferencia es la segunda ley.

    resolucion: |
      **Lo que se pide.** El enunciado del documento está cortado, y lo que
      falta se lee en la resolución oficial: el hielo se funde en 3600 g de
      agua a 350 K, y se piden la temperatura final y la variación de entropía
      del hielo y del agua. Con 18 g/mol son 100 mol de hielo y 200 de agua.

      ## La temperatura final

      El agua cede al enfriarse lo que el hielo absorbe en tres tramos:

      | tramo | calor que absorbe el hielo (J) |
      |---|---|
      | hielo de 260 a 273 K | $100\cdot 36{,}56\cdot 13 = 47\,528$ |
      | fusión a 273 K | $100\cdot 6010 = 601\,000$ |
      | agua de 273 K a $T_f$ | $7539\,(T_f - 273)$ |

      $$
      15\,078\,(350 - T_f) = 47\,528 + 601\,000 + 7539\,(T_f - 273)
      \;\Longrightarrow\;
      \boxed{\;T_f = 295{,}66\ \text{K}\;}
      $$

      Algo más de 22 ºC. La fusión se lleva la mayor parte: 601 kJ de los
      casi 820 que cede el agua.

      ## Las dos entropías

      En los tramos donde la temperatura cambia va un logaritmo, y en la
      fusión, que es a temperatura constante, una división (tema 7):

      $$
      \Delta S_{\text{hielo}} = 3656\ln\frac{273}{260} + \frac{601\,000}{273}
      + 7539\ln\frac{295{,}66}{273} = 178{,}4 + 2201{,}5 + 601{,}1
      $$
      $$
      \boxed{\;\Delta S_{\text{hielo}} = 2981\ \text{J/K}
      \qquad
      \Delta S_{\text{agua}} = 15\,078\ln\frac{295{,}66}{350} = -2544\ \text{J/K}\;}
      $$

      El hielo gana 2981 J/K y el agua pierde 2544: el conjunto sube 437 J/K.
      Los dos calores son iguales, pero el hielo los recibe más frío, y el
      mismo calor desordena más cuanto más frío está lo que lo recibe.

      ## Contra la resolución oficial

      Coinciden los tres resultados. La resolución trabaja con 273 K para la
      fusión; con 273,15 la temperatura final sale 295,69 K y las entropías
      cambian en la cuarta cifra. Del enunciado, lo que hay que saber es que
      está cortado: termina en «introduciéndolos en un recipiente» y un
      guion, y el agua a 350 K solo aparece en la resolución.

  # ── Dos equilibrios de gases en un ejercicio, y en los dos la dificultad
  #    está en la tabla de moles: el sólido que no entra y reparte sus gases
  #    2 a 1, y los moles totales que crecen al disociarse.
  - id: exfq1213-ord-7-el-carbamato-amonico-y-el-nobr
    titulo: El carbamato que solo deja gases, y el bromuro de nitrosilo que se disocia un 34 %
    fuente: >-
      Ejercicio 7 · Convocatoria ordinaria del 31 de mayo de 2013, curso
      2012-2013 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      enunciado se transcribe de la resolución oficial mecanografiada. La
      resolución guiada es nuestra, contrastada con esa resolución oficial:
      coinciden las tres constantes, la Kp del carbamato, 7,09·10⁻³ atm³ (la
      oficial la corta en 7,08·10⁻³), y la Kp y la Kc del bromuro de
      nitrosilo, 9,64·10⁻³ atm y 3,94·10⁻⁴ mol/L.
    nivel: examen
    enunciado: |
      **a)** El carbamato amónico, NH₄CO₂NH₂, se descompone según la reacción:

      $$
      \mathrm{NH_4CO_2NH_2\,(s)} \rightleftharpoons 2\,\mathrm{NH_3\,(g)} + \mathrm{CO_2\,(g)}
      $$

      Se coloca en un recipiente un poco de carbamato amónico y una vez
      alcanzado el equilibrio, se encuentra que a 40 ºC la presión total de
      los gases es de 0,363 atm. Calcular la constante de equilibrio
      K<sub>p</sub>

      **b)** Considerar el equilibrio:

      $$
      2\,\mathrm{NOBr\,(g)} \rightleftharpoons 2\,\mathrm{NO\,(g)} + \mathrm{Br_2\,(g)}
      $$

      Si el bromuro de nitrosilo, NOBr, se disocia en un 34% a 25 ºC y la
      presión total es de 0,25 atm, determinar las constantes de equilibrio
      K<sub>p</sub> y K<sub>c</sub>.
    pide: >-
      La Kp de la descomposición del carbamato, y la Kp y la Kc del equilibrio
      del bromuro de nitrosilo.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el equilibrio del carbamato hay un sólido y dos gases, y solo se
          conoce la presión total, 0,363 atm. ¿Qué dice eso de las presiones
          parciales?
        opciones:
          - texto: >-
              El sólido no entra en Kp, y como los dos gases salen solo de él,
              siempre 2 a 1, el NH₃ tiene 2/3 de la presión y el CO₂ 1/3
            correcta: true
            mensaje: |
              Eso es. Todo el gas del recipiente sale de descomponer el sólido,
              y cada vez que se forma un CO₂ se forman dos NH₃. Con
              $p_{\mathrm{NH_3}} = 2p$ y $p_{\mathrm{CO_2}} = p$, la total es
              $3p$. El sólido no aparece en la constante porque su
              concentración no cambia (tema 8).
          - texto: Las dos presiones son iguales, la mitad de la total cada una
            mensaje: |
              Solo serían iguales si los dos gases se formaran uno a uno. La
              ecuación da dos NH₃ por cada CO₂, así que el amoniaco tiene el
              doble de presión parcial.
          - texto: Hace falta la cantidad de carbamato que se ha puesto
            mensaje: |
              No hace falta: el sólido no entra en la constante, y mientras
              quede algo sin descomponer la presión de equilibrio es la misma,
              se ponga poco o mucho. Por eso el enunciado dice «un poco».
          - texto: Kp es la presión total, 0,363 atm, porque es lo único que se mide
            mensaje: |
              La constante no es la presión total: es el producto de las
              presiones parciales con sus exponentes,
              $p_{\mathrm{NH_3}}^{2}\,p_{\mathrm{CO_2}}$. La presión total sirve
              para sacar esas dos.

      - tipo: calcular
        titulo: La constante del carbamato
        pregunta: |
          ¿Cuánto vale K<sub>p</sub> de la descomposición del carbamato a 40 ºC?
        respuesta:
          tipo: numero
          valor: '7.086e-3'
          tolerancia: 0.00001
          formato: la constante en atm³; vale la notación científica, 1.23e-3
        distractores:
          - valor: '2.93e-2'
            mensaje: |
              Te has dejado el cuadrado del amoniaco: $0{,}242\cdot 0{,}121$. En
              la constante cada presión va elevada a su coeficiente, y el NH₃
              lleva un 2.
          - valor: '3.54e-3'
            mensaje: |
              Has cambiado las presiones: 0,121 para el NH₃ y 0,242 para el
              CO₂. El amoniaco, que se forma el doble, es el que tiene el doble
              de presión.
          - valor: '5.98e-3'
            mensaje: |
              Has repartido la presión a partes iguales, 0,1815 atm cada gas.
              La ecuación da dos NH₃ por cada CO₂: 0,242 y 0,121.
        pista: |
          Con $p_{\mathrm{CO_2}} = p$ y $p_{\mathrm{NH_3}} = 2p$, la total es
          $3p = 0{,}363$ atm. Y $K_p = p_{\mathrm{NH_3}}^{2}\,p_{\mathrm{CO_2}}$,
          sin el sólido.
        desarrollo: |
          $$
          p = \frac{0{,}363}{3} = 0{,}121\ \text{atm}
          \qquad
          K_p = (0{,}242)^{2}\cdot 0{,}121 = 7{,}086\cdot 10^{-3}\ \text{atm}^{3}
          $$

          Es el resultado de la resolución oficial, que lo deja en
          7,08·10⁻³ atm³ cortando la cuarta cifra; redondeado es 7,09·10⁻³, y
          la casilla acepta los dos. Las unidades salen de los exponentes:
          2 + 1, atm³.

      - tipo: reconocer
        pregunta: |
          En el b) se parte de n moles de NOBr y se disocia una fracción
          $\alpha = 0{,}34$. ¿Cuántos moles de gas hay en el equilibrio?
        opciones:
          - texto: >-
              $n(1+\alpha/2)$: quedan $n(1-\alpha)$ de NOBr y se forman
              $n\alpha$ de NO y $n\alpha/2$ de Br₂
            correcta: true
            mensaje: |
              Eso es. Por cada dos NOBr que se rompen salen dos NO y un solo
              Br₂, así que el gas crece medio mol por cada mol disociado. Con
              $\alpha = 0{,}34$ hay 1,17 n moles en el equilibrio, y con ellos
              se sacan las fracciones molares.
          - texto: $n$, porque los moles se conservan
            mensaje: |
              Se conservan los **átomos**, no los moles. Dos moléculas de NOBr
              dan tres de producto, dos de NO y una de Br₂: el número de moles
              de gas crece.
          - texto: $n(1+\alpha)$, porque cada NOBr que se rompe da dos moléculas
            mensaje: |
              Cada NOBr da un NO y **medio** Br₂: el bromo sale en moléculas de
              dos átomos, una por cada dos NOBr. El aumento es $\alpha/2$ por
              mol, no $\alpha$.
          - texto: $n(1-\alpha)$, lo que queda sin disociar
            mensaje: |
              Eso es solo el NOBr que queda. Los productos también son gases y
              cuentan en los moles totales, y por tanto en las fracciones
              molares.

      - tipo: calcular
        titulo: La Kp del bromuro de nitrosilo
        pregunta: |
          Con una presión total de 0,25 atm, ¿cuánto vale K<sub>p</sub>?
        respuesta:
          tipo: numero
          valor: '9.640e-3'
          tolerancia: 0.00003
          formato: la constante en atm; vale la notación científica, 1.23e-3
        distractores:
          - valor: '3.86e-2'
            mensaje: |
              Has puesto las fracciones molares sin multiplicarlas por la
              presión total. Una presión parcial es $X_i P_T$, y aquí $P_T$
              queda elevada a uno —tres arriba y dos abajo—: faltaba
              multiplicar por 0,25.
          - valor: '1.13e-2'
            mensaje: |
              Has dividido entre $n$ en vez de entre $n(1+\alpha/2)$, como si
              los moles de gas no cambiaran. En el equilibrio hay 1,17 n moles,
              y las fracciones molares se sacan con ellos.
          - valor: '1.68e-2'
            mensaje: |
              Has puesto $n\alpha$ moles de Br₂ en vez de $n\alpha/2$. Por cada
              dos NOBr que se rompen sale un solo Br₂.
        pista: |
          Fracciones molares con los moles totales, $n(1+\alpha/2)$; presiones
          parciales $X_i P_T$; y
          $K_p = p_{\mathrm{NO}}^{2}\,p_{\mathrm{Br_2}}/p_{\mathrm{NOBr}}^{2}$.
        desarrollo: |
          $$
          X_{\mathrm{NO}} = \frac{0{,}34}{1{,}17}
          \qquad
          X_{\mathrm{Br_2}} = \frac{0{,}17}{1{,}17}
          \qquad
          X_{\mathrm{NOBr}} = \frac{0{,}66}{1{,}17}
          $$
          $$
          K_p = P_T\,\frac{\alpha^{2}\,(\alpha/2)}{(1+\alpha/2)(1-\alpha)^{2}}
          = \frac{0{,}25\cdot 0{,}34^{2}\cdot 0{,}17}{1{,}17\cdot 0{,}66^{2}}
          = 9{,}64\cdot 10^{-3}\ \text{atm}
          $$

          Es el resultado de la resolución oficial.

      - tipo: calcular
        titulo: La Kc del bromuro de nitrosilo
        pregunta: |
          ¿Y K<sub>c</sub> a 25 ºC?
        respuesta:
          tipo: numero
          valor: '3.94e-4'
          tolerancia: 0.000003
          formato: la constante en mol/L; vale la notación científica, 1.23e-4
        distractores:
          - valor: '0.2356'
            mensaje: |
              Has multiplicado por RT en vez de dividir.
              $K_p = K_c\,(RT)^{\Delta n}$ con $\Delta n = +1$, así que
              $K_c = K_p/RT$.
          - valor: '9.64e-3'
            mensaje: |
              Has tomado Kc igual a Kp, y solo coinciden cuando no cambian los
              moles de gas. Aquí se pasa de 2 a 3: $\Delta n = +1$.
          - valor: '4.70e-3'
            mensaje: |
              Has puesto la temperatura en grados Celsius, 25 en vez de 298 K.
        pista: |
          $K_p = K_c\,(RT)^{\Delta n}$, con $\Delta n = 3 - 2 = 1$ y
          $T = 298$ K.
        desarrollo: |
          $$
          K_c = \frac{K_p}{RT} = \frac{9{,}640\cdot 10^{-3}}{0{,}082\cdot 298}
          = 3{,}945\cdot 10^{-4}\ \text{mol/L}
          $$

          La resolución oficial da 3,94·10⁻⁴ mol/L: coincide. Con R = 0,08206
          y 298,15 K sale 3,940·10⁻⁴, y la casilla acepta de 3,91 a
          3,97·10⁻⁴.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              El carbamato es sólido y no entra en Kp; sus dos gases salen 2 a
              1: 0,242 atm de NH₃ y 0,121 de CO₂.
          - texto: >-
              Kp = 0,242² · 0,121 = 7,09·10⁻³ atm³.
          - texto: >-
              En el NOBr, de n moles quedan n(1 − α), y se forman nα de NO y
              nα/2 de Br₂: en total, n(1 + α/2).
          - texto: >-
              Con las fracciones molares y P = 0,25 atm, Kp = 9,64·10⁻³ atm.
          - texto: >-
              Como Δn = +1, Kc = Kp/RT = 3,94·10⁻⁴ mol/L.
          - texto: >-
              La constante del carbamato depende de cuánto sólido se ponga en el
              recipiente, porque es él quien produce los gases.
            trampa: true
            mensaje: |
              Mientras quede algo de sólido, la presión de equilibrio es la
              misma se ponga poco o mucho: el sólido no entra en la constante
              porque su concentración no cambia. Por eso el enunciado puede
              decir «un poco» sin dar la masa.
        veredicto: |
          En los dos equilibrios decide la tabla de moles: en el heterogéneo,
          la proporción de los gases que salen del sólido; en el homogéneo,
          los moles totales, que crecen con la disociación.

    resolucion: |
      **Lo que se pide.** Dos equilibrios de gases, y en los dos la dificultad
      está en la tabla de moles, no en la constante.

      ## a) El carbamato amónico

      Es un equilibrio heterogéneo: el sólido no entra en la constante, y los
      dos gases salen de él siempre en la misma proporción, dos NH₃ por cada
      CO₂. Con $p_{\mathrm{CO_2}} = p$:

      $$
      P_T = 2p + p = 3p = 0{,}363
      \;\Longrightarrow\;
      p = 0{,}121\ \text{atm}
      $$
      $$
      \boxed{\;K_p = p_{\mathrm{NH_3}}^{2}\,p_{\mathrm{CO_2}} = (0{,}242)^{2}\cdot 0{,}121
      = 7{,}09\cdot 10^{-3}\ \text{atm}^{3}\;}
      $$

      ## b) El bromuro de nitrosilo

      | | NOBr | NO | Br₂ | total |
      |---|---|---|---|---|
      | al principio | $n$ | 0 | 0 | $n$ |
      | en el equilibrio | $n(1-\alpha)$ | $n\alpha$ | $n\alpha/2$ | $n(1+\alpha/2)$ |

      Las presiones parciales son las fracciones molares por la presión total,
      y la $n$ se cancela:

      $$
      K_p = \frac{(X_{\mathrm{NO}}P_T)^{2}\,(X_{\mathrm{Br_2}}P_T)}{(X_{\mathrm{NOBr}}P_T)^{2}}
      = P_T\,\frac{\alpha^{2}\,(\alpha/2)}{(1+\alpha/2)(1-\alpha)^{2}}
      $$
      $$
      \boxed{\;K_p = \frac{0{,}25\cdot 0{,}34^{2}\cdot 0{,}17}{1{,}17\cdot 0{,}66^{2}}
      = 9{,}64\cdot 10^{-3}\ \text{atm}\;}
      $$

      Y como la reacción gana un mol de gas, $\Delta n = +1$:

      $$
      \boxed{\;K_c = \frac{K_p}{RT} = \frac{9{,}640\cdot 10^{-3}}{0{,}082\cdot 298}
      = 3{,}945\cdot 10^{-4}\ \text{mol/L}\;}
      $$

      ## Contra la resolución oficial

      Coinciden las tres constantes. La del carbamato la deja en
      7,08·10⁻³ atm³, cortando la cuarta cifra de 7,086·10⁻³ en vez de
      redondearla; y en la tabla del b) escribe «B2(g)» por Br₂. Nada de eso
      cambia un resultado.

  # ── Tres pH y tres regímenes: el ácido muy débil solo, la base fuerte sola
  #    y la sal que queda en la equivalencia. La resolución oficial redondea
  #    la x de la hidrólisis a 0,001 y da pH 11; con sus propias cifras sale
  #    11,03, y el 11 entra como distractor.
  - id: exfq1213-ord-8-el-cianhidrico-la-sosa-y-su-mezcla
    titulo: Un ácido muy débil, una base fuerte, y la sal que queda al mezclarlos
    fuente: >-
      Ejercicio 8 · Convocatoria ordinaria del 31 de mayo de 2013, curso
      2012-2013 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El
      enunciado se transcribe de la resolución oficial mecanografiada. La
      resolución guiada es nuestra, contrastada con esa resolución oficial:
      coinciden el pH del ácido, 5,12, y el de la sosa, 13,30. En el de la
      mezcla la oficial redondea la concentración de OH⁻ a 0,001 M y da
      pH 11; sin ese redondeo sale 11,03.
    nivel: examen
    enunciado: |
      **a)** Calcular el pH de una solución de ácido cianhídrico, HCN, 0,1 M

      **b)** Calcular el pH de una solución de hidróxido sódico 0,2 M

      **c)** Si se mezclan 200 mL de la solución a) con 100 mL de la solución
      b) ¿Cuál será el pH de la solución resultante? Se supone que los
      volúmenes son aditivos.

      K<sub>a</sub> (HCN) = 5,8x10⁻¹⁰
    pide: >-
      El pH del ácido cianhídrico 0,1 M, el de la sosa 0,2 M y el de su
      mezcla.

    pasos:
      - tipo: reconocer
        pregunta: |
          El HCN 0,1 M tiene $K_a = 5{,}8\cdot 10^{-10}$. ¿Cómo se saca su pH?
        opciones:
          - texto: >-
              Es un ácido débil: $K_a = x^{2}/(0{,}1 - x)$, y con una Ka tan
              pequeña la x del denominador se desprecia
            correcta: true
            mensaje: |
              Eso es. Con una constante tan pequeña se disocia una molécula de
              cada trece mil, y despreciar la $x$ no mueve nada. Conviene decir
              en el examen que se ha hecho, y comprobarlo después (tema 9).
          - texto: Como un ácido fuerte, con [H₃O⁺] = 0,1 M y pH 1
            mensaje: |
              Eso sería si se disociara entero. Con una Ka de 5,8·10⁻¹⁰ el HCN
              es un ácido muy débil: casi todo sigue sin disociar, y el pH
              queda mucho más alto.
          - texto: Con Henderson-Hasselbalch
            mensaje: |
              Henderson necesita el ácido **y** su base conjugada juntos, que es
              un tampón. Aquí solo hay HCN en agua: es el caso del ácido débil
              solo.
          - texto: Como está tan poco disociado, el pH es 7
            mensaje: |
              Poco disociado no es nada disociado: sus 7,6·10⁻⁶ M de H₃O⁺ son
              setenta y seis veces los del agua pura, y bajan el pH a 5,12.

      - tipo: calcular
        titulo: El pH del ácido cianhídrico
        pregunta: |
          ¿Cuál es el pH del HCN 0,1 M?
        respuesta:
          tipo: numero
          valor: '5.12'
          tolerancia: 0.01
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '1.00'
            mensaje: |
              Lo has tratado como un ácido fuerte, con [H₃O⁺] = 0,1 M. El HCN
              apenas se disocia: su concentración de H₃O⁺ es trece mil veces
              menor.
          - valor: '10.24'
            mensaje: |
              Te has dejado la raíz: $-\log(K_a C)$ es el logaritmo de $x^{2}$,
              no de $x$, y sale el doble del pH.
          - valor: '8.88'
            mensaje: |
              Has tratado la $x$ como si fuera [OH⁻] y has restado de 14. Con
              un ácido, la $x$ es la concentración de H₃O⁺, y su logaritmo
              cambiado de signo ya es el pH.
        pista: |
          $x = \sqrt{K_a C}$ con $C = 0{,}1$ M; después, $\mathrm{pH} = -\log x$.
        desarrollo: |
          $$
          x = \sqrt{5{,}8\cdot 10^{-10}\cdot 0{,}1} = 7{,}6\cdot 10^{-6}\ \text{M}
          \qquad
          \mathrm{pH} = -\log(7{,}6\cdot 10^{-6}) = 5{,}12
          $$

          Es el resultado de la resolución oficial. Despreciar la $x$ es
          legítimo: es el 0,008 % de 0,1.

      - tipo: calcular
        titulo: El pH de la sosa
        pregunta: |
          ¿Y el de la sosa 0,2 M?
        respuesta:
          tipo: numero
          valor: '13.30'
          tolerancia: 0.01
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '0.70'
            mensaje: |
              Ese es el pOH. La sosa da OH⁻, así que el logaritmo de su
              concentración es el pOH, y el pH es 14 menos eso.
          - valor: '14.70'
            mensaje: |
              Te has comido el signo del logaritmo: $\log 0{,}2 = -0{,}70$, así
              que el pOH es +0,70 y el pH, $14 - 0{,}70$.
        pista: |
          Base fuerte: [OH⁻] = 0,2 M, $\mathrm{pOH} = -\log 0{,}2$ y
          $\mathrm{pH} = 14 - \mathrm{pOH}$.
        desarrollo: |
          $$
          \mathrm{pOH} = -\log 0{,}2 = 0{,}70
          \qquad
          \mathrm{pH} = 14 - 0{,}70 = 13{,}30
          $$

          Es el resultado de la resolución oficial.

      - tipo: reconocer
        pregunta: |
          Se mezclan 200 mL del HCN 0,1 M con 100 mL de la sosa 0,2 M. ¿Qué
          queda en el vaso?
        opciones:
          - texto: >-
              Solo cianuro sódico: hay 0,02 mol de cada uno y se neutralizan
              justos, y el CN⁻ hidroliza y deja la disolución básica
            correcta: true
            mensaje: |
              Eso es. Contar moles decide el régimen: 0,2 L de 0,1 M y 0,1 L de
              0,2 M son 0,02 mol cada uno, el punto de equivalencia. Queda la
              sal de un ácido débil y una base fuerte, y su anión toma protones
              del agua: la disolución sale básica (tema 9).
          - texto: >-
              Una disolución neutra, de pH 7, porque ácido y base se
              neutralizan justos
            mensaje: |
              El pH 7 en la equivalencia es solo de ácido fuerte con base
              fuerte. El HCN es débil, y su conjugado, el CN⁻, es una base que
              hidroliza: la equivalencia queda básica.
          - texto: Un tampón de HCN y CN⁻
            mensaje: |
              Para un tampón tendría que sobrar ácido, y aquí no sobra: los
              0,02 mol de sosa se gastan justos con los 0,02 de HCN. Solo queda
              CN⁻, sin su ácido al lado.
          - texto: Sobra sosa, porque su concentración es el doble
            mensaje: |
              La concentración es el doble, pero el volumen es la mitad: 0,1 L
              de 0,2 M son los mismos 0,02 mol que 0,2 L de 0,1 M. Lo que se
              compara son los moles.

      - tipo: calcular
        titulo: La concentración de cianuro sódico en la mezcla
        pregunta: |
          ¿Qué concentración de NaCN hay en la mezcla?
        respuesta:
          tipo: numero
          valor: '0.0667'
          tolerancia: 0.001
          formato: la concentración en mol/L, con tres cifras significativas
        distractores:
          - valor: '0.1'
            mensaje: |
              Has dividido entre los 0,2 L del ácido. Los volúmenes son
              aditivos: la sal está en 0,3 L.
          - valor: '0.2'
            mensaje: |
              Has dividido entre los 0,1 L de la sosa. La mezcla ocupa los
              300 mL, no los 100.
          - valor: '0.133'
            mensaje: |
              Has sumado los moles de los dos, 0,04, como si cada uno diera su
              sal. Cada HCN y cada NaOH que reaccionan dan un solo NaCN: son
              0,02 mol.
        pista: |
          0,02 mol de NaCN en los 300 mL de la mezcla.
        desarrollo: |
          $$
          [\mathrm{NaCN}] = \frac{0{,}02}{0{,}1 + 0{,}2} = 0{,}0667\ \text{M}
          $$

          La resolución oficial escribe 0,066 M, cortando la cifra; es 0,0667,
          y la diferencia no llega a la segunda decimal del pH. La casilla
          acepta las dos.

      - tipo: calcular
        titulo: La constante de hidrólisis del cianuro
        pregunta: |
          ¿Cuánto vale la constante de hidrólisis del CN⁻?
        respuesta:
          tipo: numero
          valor: '1.724e-5'
          tolerancia: 0.00000005
          formato: la constante; vale la notación científica, 1.23e-5
        distractores:
          - valor: '5.8e-10'
            mensaje: |
              Esa es la Ka del ácido. Lo que hidroliza es su base conjugada, el
              CN⁻, y su constante es $K_w/K_a$.
          - valor: '5.8e4'
            mensaje: |
              Has dividido al revés, $K_a/K_w$. La del conjugado es
              $K_w/K_a = 1{,}72\cdot 10^{-5}$: una constante de base de ese
              tamaño, no de cincuenta y ocho mil.
        pista: |
          Para un par conjugado, $K_a\,K_b = K_w$.
        desarrollo: |
          $$
          K_h = \frac{K_w}{K_a} = \frac{10^{-14}}{5{,}8\cdot 10^{-10}} = 1{,}724\cdot 10^{-5}
          $$

          Es la constante que la resolución oficial llama $K_h$, 1,72·10⁻⁵, y
          la que el tema 9 escribe $K_b = K_w/K_a$: son la misma. Cuanto más
          débil el ácido, más fuerte su conjugado, y el CN⁻ es una base casi
          tan fuerte como el amoniaco.

      - tipo: calcular
        titulo: El pH de la mezcla
        pregunta: |
          ¿Cuál es el pH de la mezcla?
        respuesta:
          tipo: numero
          valor: '11.03'
          tolerancia: 0.01
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '11'
            mensaje: |
              Es el pH de la resolución oficial, que redondea
              $x = 1{,}07\cdot 10^{-3}$ M a 0,001 antes de tomar el logaritmo.
              Sin ese redondeo el pOH es 2,97, no 3, y el pH 11,03.
          - valor: '7'
            mensaje: |
              El pH 7 en la equivalencia es solo de ácido fuerte con base
              fuerte. Aquí queda CN⁻, que toma protones del agua y suelta OH⁻:
              la disolución es básica.
          - valor: '2.97'
            mensaje: |
              Ese es el pOH. La hidrólisis del CN⁻ da la concentración de OH⁻,
              y el pH es 14 menos su pOH.
        pista: |
          $[\mathrm{OH^-}] = \sqrt{K_h C}$ con $C = 0{,}0667$ M. Después, el pOH
          y el pH.
        desarrollo: |
          $$
          [\mathrm{OH^-}] = \sqrt{1{,}724\cdot 10^{-5}\cdot 0{,}0667} = 1{,}07\cdot 10^{-3}\ \text{M}
          $$
          $$
          \mathrm{pOH} = -\log(1{,}07\cdot 10^{-3}) = 2{,}97
          \qquad
          \mathrm{pH} = 14 - 2{,}97 = 11{,}03
          $$

          La aproximación vale: $1{,}07\cdot 10^{-3}$ es el 1,6 % de 0,0667,
          por debajo del 5 % con que la comprueba la resolución oficial.
          Resolviendo la ecuación de segundo grado sale 11,027, y la casilla
          acepta de 11,02 a 11,04. La resolución oficial da pH 11 porque
          redondea la $x$ a 0,001.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              a) El HCN es un ácido muy débil: x = √(Ka·C) = 7,6·10⁻⁶ M y
              pH 5,12.
          - texto: >-
              b) La sosa es base fuerte: [OH⁻] = 0,2 M, pOH 0,70 y pH 13,30.
          - texto: >-
              c) Hay 0,02 mol de cada uno: se neutralizan justos y queda solo
              NaCN, 0,0667 M en 300 mL.
          - texto: >-
              El CN⁻ hidroliza con Kh = Kw/Ka = 1,72·10⁻⁵, da [OH⁻] =
              1,07·10⁻³ M y pH 11,03.
          - texto: >-
              En c) ácido y base se neutralizan exactamente, así que la
              disolución resultante es neutra, de pH 7.
            trampa: true
            mensaje: |
              Neutralizar justos da pH 7 solo si el ácido y la base son
              fuertes. El HCN es débil, y su conjugado, el CN⁻, es una base que
              toma protones del agua: la equivalencia queda en pH 11,03, cuatro
              unidades por encima.
        veredicto: |
          Tres pH y tres regímenes: ácido débil solo, base fuerte, y la sal que
          queda en la equivalencia. Contar moles antes de nada dice en cuál
          estás.

    resolucion: |
      **Lo que se pide.** Tres pH, cada uno en un régimen distinto: un ácido
      muy débil solo, una base fuerte sola, y lo que queda al mezclarlos en el
      punto de equivalencia.

      ## a) El HCN 0,1 M

      Ácido débil, con una $K_a$ tan pequeña que la $x$ del denominador se
      desprecia sin miedo:

      $$
      K_a = \frac{x^{2}}{0{,}1 - x} \approx \frac{x^{2}}{0{,}1}
      \;\Longrightarrow\;
      x = \sqrt{5{,}8\cdot 10^{-11}} = 7{,}6\cdot 10^{-6}\ \text{M}
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 5{,}12\;}
      $$

      ## b) La sosa 0,2 M

      Base fuerte, disociada entera:

      $$
      [\mathrm{OH^-}] = 0{,}2\ \text{M}
      \qquad
      \mathrm{pOH} = 0{,}70
      \qquad
      \boxed{\;\mathrm{pH} = 13{,}30\;}
      $$

      ## c) La mezcla

      Primero se cuentan moles: $0{,}2\cdot 0{,}1 = 0{,}02$ de HCN y
      $0{,}1\cdot 0{,}2 = 0{,}02$ de NaOH. Se neutralizan justos y queda solo
      la sal, en los 300 mL de la mezcla:

      $$
      [\mathrm{CN^-}] = \frac{0{,}02}{0{,}3} = 0{,}0667\ \text{M}
      \qquad
      K_h = \frac{K_w}{K_a} = 1{,}724\cdot 10^{-5}
      $$

      El Na⁺ viene de una base fuerte y no hidroliza; el CN⁻ viene de un ácido
      débil y toma protones del agua,
      $\mathrm{CN^-} + \mathrm{H_2O} \rightleftharpoons \mathrm{HCN} + \mathrm{OH^-}$:

      $$
      [\mathrm{OH^-}] = \sqrt{1{,}724\cdot 10^{-5}\cdot 0{,}0667} = 1{,}07\cdot 10^{-3}\ \text{M}
      \;\Longrightarrow\;
      \mathrm{pOH} = 2{,}97
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 11{,}03\;}
      $$

      Básica, como toda equivalencia de un ácido débil con una base fuerte.

      ## Contra la resolución oficial

      Coinciden el a), 5,12, y el b), 13,30. En el c) la resolución acierta el
      régimen y la hidrólisis, pero redondea la $x$ a 0,001 M y da pH = 11;
      con las cifras que salen, $1{,}07\cdot 10^{-3}$ M, el pOH es 2,97 y el
      pH 11,03. También escribe la concentración de la sal como 0,066 M,
      cortando 0,0667, y eso ya no cambia la segunda decimal.
