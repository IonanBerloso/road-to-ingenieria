    tema: t04-estados-y-propiedades
    n: 3
  - id: exfq1213-ord-4-la-calcopirita-y-sus-tres-rendimientos
    tema: t01-compuestos-y-estequiometria
    n: 4
  - id: exfq1213-ord-5-el-gas-monoatomico-isobaro-y-adiabatico
    tema: t05-termodinamica-clasica
    n: 5
  - id: exfq1213-ord-5-el-orden-por-velocidades-iniciales
    tema: t08-equilibrio-quimico
    n: 5
  - id: exfq1213-ord-6-la-trinitroglicerina-por-hess
    tema: t06-termoquimica
    n: 6
  - id: exfq1213-ord-6-el-hielo-que-se-funde-en-agua-caliente
    tema: t07-espontaneidad-y-energia-libre
    n: 6
  - id: exfq1213-ord-7-el-carbamato-amonico-y-el-nobr
    tema: t08-equilibrio-quimico
    n: 7
  - id: exfq1213-ord-8-el-cianhidrico-la-sosa-y-su-mezcla
    tema: t09-equilibrio-acido-base
    n: 8

fuera:
  - n: 1
    motivo: >-
      La resolución oficial empieza en el ejercicio 3: el enunciado del 1 no
      está en el material, y no se transcribe lo que no se tiene.
  - n: 2
    motivo: >-
      Como el 1: la resolución oficial no lo trae, y su enunciado no está en
      ningún otro documento de la asignatura.
