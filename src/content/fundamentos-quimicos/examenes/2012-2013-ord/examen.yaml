asignatura: fundamentos-quimicos
curso: '2012-2013'
convocatoria: ordinaria
fecha: 31 de mayo de 2013
# La convocatoria más antigua de Química en el sitio, y la primera con algo
# oficial detrás: su único documento es la resolución del profesorado,
# mecanografiada, con el enunciado de cada ejercicio citado antes de
# resolverlo. De ahí se transcriben los enunciados, tal cual, y contra ella
# se contrasta cada resultado.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **ES UN EXAMEN ANUAL.** En 2013 la asignatura se examinaba entera en
#    mayo, y sus ejercicios cruzan los dos cuatrimestres de hoy: gases y
#    estequiometría, que ahora son del primero, y termodinámica, cinética,
#    equilibrio y ácido-base, que son del segundo. No cuenta en la medida de
#    ninguna de las dos rutas, que miden las convocatorias de su cuatrimestre.
#
# 2. **EMPIEZA EN EL 3.** El documento no trae los ejercicios 1 y 2, y no se
#    inventan: van en `fuera`. El 5 y el 6 cruzan temas y se parten en dos
#    piezas cada uno, con su `n`.
#
# 3. **SIN PDF.** El documento es la corrección del profesor, y §08 solo deja
#    entrar en `public/examenes/` enunciados oficiales. La resolución de
#    Térmica se publicó por una decisión expresa, y esta no la tiene: queda
#    anotada en `tasks/pendiente.md`.
sinPdf: >-
  El documento de la escuela es la resolución del profesor, con el enunciado
  de cada ejercicio citado encima, y aquí no se publica. Los enunciados están
  transcritos tal cual, y cada resolución dice dónde coincide con la del
  profesor y dónde no.
pdfEs: resolucion

