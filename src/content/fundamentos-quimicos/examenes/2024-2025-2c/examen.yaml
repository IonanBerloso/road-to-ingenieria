asignatura: fundamentos-quimicos
curso: '2024-2025'
convocatoria: segundo-cuatrimestre
fecha: curso 2024-2025
# El examen del segundo cuatrimestre, que es otra asignatura dentro de la
# misma: aquí no hay estequiometría industrial, hay termodinámica. Los cinco
# ejercicios recorren los temas 5, 6, 7, 8, 9 y 10 en ese orden, uno por
# bloque, y eso hace que el temario del 2.º cuatrimestre esté clavado en la
# estructura del examen.
#
# A DIFERENCIA de los otros dos transcritos, este NO publica lo que vale cada
# ejercicio: la cabecera dice solo «EJERCICIO 1». Tiempo: 1.30 h.
pdf: 2024-2025-2c.pdf

ejercicios:
  - id: exfq2425-2c-2-el-eteno-y-los-diez-kilos-de-aluminio
    tema: t06-termoquimica

fuera:
  - n: 1
    motivo: >-
      Representar las variaciones de trabajo de un ciclo sobre un diagrama
      P-V y decir el signo de cada una. Es del tema 5 y hace falta la figura
      del ciclo, que es del enunciado original y hay que redibujar: se hará
      al escribir el tema 5.
  - n: 3
    motivo: >-
      Equilibrio del gas de agua: Kp y Kc, desplazamiento al cambiar de
      volumen y efecto de la temperatura y de un catalizador. Es del tema 8,
      que todavía no está escrito.
  - n: 4
    motivo: >-
      Cuatro cálculos de pH sobre hidróxido amónico —con sosa, con clorhídrico
      y con nitrato amónico— y sus mezclas. Es del tema 9, que todavía no está
      escrito.
  - n: 5
    motivo: >-
      Pila de cobre y hierro: reacción espontánea, esquema, constante de
      equilibrio y ecuación de Nernst. Es del tema 10, que todavía no está
      escrito. Además sus concentraciones salen ilegibles al extraer el texto
      del PDF —los exponentes vienen duplicados— y hay que leerlas sobre la
      imagen antes de transcribirlo.
