    pide: El signo del trabajo en los cuatro tramos y en el ciclo completo, representado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da ni un número. ¿Qué hay que mirar para saber el
          signo del trabajo de un tramo?
        opciones:
          - texto: Hacia dónde se mueve el volumen
            correcta: true
            mensaje: |
              Solo eso. Con el convenio de la asignatura, el gas que **se
              expande** entrega trabajo y su $W$ es negativo; el que **se
              comprime** lo recibe y su $W$ es positivo. La presión decide
              cuánto, no de qué signo.
          - texto: Si la presión sube o baja
            mensaje: |
              La presión determina el **tamaño** del trabajo —el área bajo la
              curva— pero no su signo. En este ciclo hay un tramo donde la
              presión baja y el gas se expande, y otro donde baja y se
              comprime.
          - texto: Si el tramo es una recta o una curva
            mensaje: |
              La forma dice cómo es el proceso —isobaro si es horizontal, otra
              cosa si es curvo— pero no el signo. Hay rectas con trabajo
              positivo y rectas con trabajo negativo en este mismo ciclo.
          - texto: Si el tramo va hacia arriba o hacia abajo en el diagrama
            mensaje: |
              El eje vertical es la presión, así que subir o bajar es
              comprimirse o expandirse **solo si además se mueve en
              horizontal**. Lo que hay que mirar es el eje de volúmenes.

      - tipo: calcular
        titulo: Cuántos tramos tienen trabajo positivo
        pregunta: |
          De los cuatro tramos AB, BC, CD y DA, ¿en cuántos es positivo el
          trabajo?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Hay **dos** tramos que comprimen: el CD, que va de V₄ a V₂, y el
              DA, que va de V₂ a V₁. Los dos se mueven hacia la izquierda.
          - valor: '3'
            mensaje: |
              Solo dos comprimen. El AB va de V₁ a V₃ y el BC de V₃ a V₄: los
              dos hacia la derecha, o sea expandiendo.
          - valor: '0'
            mensaje: |
              Si ningún tramo comprimiera, el gas no volvería nunca a su
              volumen inicial y esto no sería un ciclo.
        pista: |
          Cuenta los tramos que se mueven hacia la **izquierda** en el eje de
          volúmenes.
        desarrollo: |
          Hacia la derecha, expandiendo: **AB** (de V₁ a V₃) y **BC** (de V₃ a
          V₄), los dos con $W < 0$.

          Hacia la izquierda, comprimiendo: **CD** (de V₄ a V₂) y **DA** (de
          V₂ a V₁), los dos con $W > 0$.

          Dos y dos.

      - tipo: reconocer
        pregunta: |
          ¿Y el ciclo completo, ΔW<sub>ABCDA</sub>?
        opciones:
          - texto: Negativo, porque el recorrido es horario y la expansión ocurre a presión más alta
            correcta: true
            mensaje: |
              Exacto, y son las dos mitades del argumento. El área bajo la ida
              —AB y BC, a presión alta— es mayor que la del regreso —CD y DA,
              a presión baja—, así que el gas entrega más de lo que recibe.
              Un ciclo horario es un motor.
          - texto: Cero, porque el gas vuelve al punto de partida
            mensaje: |
              Eso valdría para $\Delta E$ o $\Delta H$, que son funciones de
              estado. El trabajo es función de **camino**: volver al mismo
              sitio no significa que se haya cancelado, y si se cancelara
              ningún motor funcionaría.
          - texto: Positivo, porque hay dos tramos de cada signo y los de compresión son más largos
            mensaje: |
              El tramo CD es efectivamente largo, pero ocurre a presión **P₂**,
              la baja. El trabajo es área, no longitud: lo que cuenta es
              presión por desplazamiento.
          - texto: No se puede saber sin los valores de P₁, P₂ y los volúmenes
            mensaje: |
              Sí se puede, y esa es la gracia del ejercicio. Basta el sentido
              del recorrido: horario significa que la expansión se hace arriba
              y la compresión abajo, y eso ya fija el signo.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Con el convenio de que W es positivo cuando el sistema lo recibe, comprimir da W > 0 y expandirse da W < 0.'
          - texto: 'AB va de V₁ a V₃ a presión constante P₁: el gas se expande, así que ΔW_AB < 0.'
          - texto: 'BC va de V₃ a V₄ bajando la presión: sigue expandiéndose, así que ΔW_BC < 0.'
          - texto: 'CD va de V₄ a V₂ a presión constante P₂ y DA vuelve de V₂ a V₁: los dos comprimen, así que ΔW_CD > 0 y ΔW_DA > 0.'
          - texto: 'El ciclo es horario y la expansión ocurre a presión alta, así que el área de ida supera a la de vuelta: ΔW_ABCDA < 0.'
          - texto: 'Como el gas vuelve al estado inicial, el trabajo del ciclo completo es cero.'
            trampa: true
            mensaje: |
              El trabajo es función de **camino**, no de estado. Lo que sí vale
              cero en un ciclo son $\Delta E$, $\Delta H$ y $\Delta S$. Si el
              trabajo de un ciclo fuera cero no existirían los motores
              térmicos, y el área encerrada del dibujo no significaría nada.
    resolucion: |
      **Un ejercicio sin números, y por eso conviene no calcular nada.** No
      hay datos, ni tabla, ni escala en los ejes. Todo sale de dos cosas: el
      convenio de signos y hacia dónde se mueve el volumen.

      El convenio de la asignatura cuenta positivo lo que **entra** al
      sistema. Un gas que se comprime recibe trabajo, así que $W > 0$; uno que
      se expande lo entrega, así que $W < 0$. La presión no interviene en el
      signo: solo en el tamaño.

      | tramo | qué hace el volumen | proceso | signo |
      |---|---|---|---|
      | **A → B** | de V₁ a V₃, aumenta | isobaro a P₁ | $\Delta W_{AB} < 0$ |
      | **B → C** | de V₃ a V₄, aumenta | expansión con caída de presión | $\Delta W_{BC} < 0$ |
      | **C → D** | de V₄ a V₂, disminuye | isobaro a P₂ | $\Delta W_{CD} > 0$ |
      | **D → A** | de V₂ a V₁, disminuye | compresión con subida de presión | $\Delta W_{DA} > 0$ |

      **El ciclo completo.** Aquí está lo que el ejercicio quiere evaluar, y
      se contesta sin números:

      $$
      \Delta W_{ABCDA} < 0
      $$

      El razonamiento tiene dos pasos. El primero es que **el trabajo de un
      ciclo no es cero**: el trabajo es función de camino, no de estado, así
      que volver al punto de partida no lo cancela. Lo que sí valen cero en un
      ciclo son $\Delta E$, $\Delta H$ y $\Delta S$.

      El segundo es que **el recorrido es horario**. La ida —AB y BC— se hace
      por arriba, a presiones altas; la vuelta —CD y DA— por abajo, a presión
      P₂. Como el trabajo es el área bajo cada tramo, la de ida supera a la de
      vuelta y el balance queda a favor del gas: entrega más de lo que recibe.

      **En módulo, el trabajo neto es el área encerrada por el ciclo**, y su
      signo lo da el sentido: horario, el gas produce trabajo y la máquina es
      un motor; antihorario, hay que dárselo y es una bomba o un frigorífico.

      **Cómo representarlo**, que es lo que el enunciado pide literalmente:
      cada $\Delta W$ se dibuja como el área bajo su tramo hasta el eje de
      volúmenes, sombreada, con una flecha que indique el sentido del
      recorrido. Las dos áreas de ida se cuentan negativas y las dos de vuelta
      positivas, y lo que queda sin cancelar es justamente la superficie
      encerrada entre las cuatro curvas.

  # ── Seis apartados que recorren medio cuatrimestre: Hess por energías
  #    libres, Kirchhoff, la relación entre ΔH y ΔU, espontaneidad con la
  #    temperatura, y un balance de calor que acaba fundiendo diez kilos de
  #    aluminio. Es el ejercicio que mejor enseña que la termoquímica no son
  #    fórmulas sueltas sino una sola contabilidad.
  - id: exfq2425-2c-2-el-eteno-y-los-diez-kilos-de-aluminio
    titulo: Quemar eteno hasta fundir diez kilos de aluminio
    fuente: >-
      Ejercicio 2 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Teniendo en cuenta las siguientes reacciones:

      $$
      \mathrm{H_2\,(g)} + \tfrac{1}{2}\,\mathrm{O_2\,(g)}
      \Rightarrow \mathrm{H_2O\,(l)}
      \qquad \Delta H_1^{0} = -285{,}8\ \text{kJ}
      $$
      $$
      \mathrm{C\,(s)} + \mathrm{O_2\,(g)} \Rightarrow \mathrm{CO_2\,(g)}
      \qquad \Delta H_2^{0} = -393{,}5\ \text{kJ}
      $$
      $$
      \mathrm{C_2H_4\,(g)} + 3\,\mathrm{O_2\,(g)}
      \Rightarrow 2\,\mathrm{CO_2\,(g)} + 2\,\mathrm{H_2O\,(l)}
      \qquad \Delta H_3^{0} = -1422{,}6\ \text{kJ}
      $$

      Calcula:

      **a)** El cambio de entropía de la reacción de combustión del eteno
      (C2H4) en condiciones estándar.

      **b)** El cambio de entalpía de la reacción de combustión del eteno a
      100 ºC.

      **c)** La variación de energía interna de la misma reacción a 100 ºC.

      **d)** Analiza la espontaneidad de la reacción de combustión con la
      temperatura.

      **e)** ¿Cuántos litros de eteno necesitamos quemar para poder fundir
      10 kg de aluminio que están a 25 ºC a presión atmosférica?

      **f)** El cambio total de la entropía que sufrirá el aluminio. Masa
      atómica (g/mol): Al (27).

      **Datos:**

      | sustancia | ΔG⁰f (kJ/mol) | Cp (J/(mol·K)) | T fusión (ºC) | ΔH fusión (kJ/mol) |
      |---|---|---|---|---|
      | H2O (l) | −237,18 | 75,33 | | |
      | CO2 (g) | −394,36 | 37,11 | | |
      | C2H4 (g) | 68,12 | 42,84 | | |
      | O2 (g) | — | 29,40 | | |
      | Al (s) | | 24,29 | 658 | 10,67 |
    pide: >-
      La entropía y la entalpía de combustión, la energía interna a 100 ºC, el
      rango de espontaneidad, el volumen de eteno que funde 10 kg de aluminio
      y la entropía que gana el metal.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) pide la **entropía** de la combustión, y la tabla no
          trae entropías: solo energías libres de formación. ¿Por dónde se
          entra?
        opciones:
          - texto: >-
              Por $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$, calculando
              antes $\Delta G^{0}$ con las energías libres de formación
            correcta: true
            mensaje: |
              Eso es. La tabla da lo que hace falta para $\Delta G^{0}$, el
              enunciado da $\Delta H^{0}$, y la definición de energía libre
              despeja la entropía. Que un dato no esté tabulado no significa
              que no se pueda obtener.
          - texto: >-
              Con la ley de Hess sobre las tres reacciones, combinándolas para
              obtener la entropía
            mensaje: |
              Hess vale para funciones de estado y la entropía lo es, pero las
              tres reacciones traen **entalpías**, no entropías. Combinándolas
              solo se obtienen entalpías.
          - texto: >-
              No se puede: falta la entropía absoluta de cada sustancia
            mensaje: |
              Haría falta si quisieras $\Delta S^{0}$ como suma de $S^{0}$ de
              productos menos reactivos. Pero hay otro camino, y es el que la
              tabla está preparando.
          - texto: >-
              Derivando la entalpía respecto de la temperatura con los Cp
            mensaje: |
              Los Cp sirven para llevar la entalpía de una temperatura a otra
              —apartado b)— y para la entropía del aluminio —apartado f)—,
              pero no dan la entropía de reacción en condiciones estándar.

      - tipo: calcular
        titulo: La entropía de la combustión
        pregunta: |
          ¿Cuánto vale $\Delta S^{0}$ de la combustión del eteno, en J/K?
        respuesta:
          tipo: numero
          valor: '-306.6'
          tolerancia: 3
          formato: la entropía en J/K, con una cifra decimal y su signo
        distractores:
          - valor: '306.6'
            mensaje: |
              El signo importa y aquí es negativo: la reacción pasa de 4 moles
              de gas a 2, y encima condensa agua líquida. El desorden baja.
          - valor: '-0.3066'
            mensaje: |
              Ese es el valor en **kJ/K**. El enunciado no fija unidad, pero
              una entropía se da en J/K salvo que se diga lo contrario.
        pista: |
          Primero $\Delta G^{0}$ con las energías libres de formación —la del
          O2 es cero por ser elemento en su forma estable—, y después despeja
          de $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$ a 298,15 K.
        desarrollo: |
          $$
          \Delta G^{0} = \left[2(-394{,}36) + 2(-237{,}18)\right] - 68{,}12
          = -1331{,}20\ \text{kJ}
          $$
          $$
          \Delta S^{0} = \frac{\Delta H^{0} - \Delta G^{0}}{T}
          = \frac{-1422{,}6 + 1331{,}20}{298{,}15}
          = -0{,}3066\ \text{kJ/K} = -306{,}6\ \text{J/K}
          $$

      - tipo: calcular
        titulo: El ΔCp, que es donde se decide el apartado b
        pregunta: |
          Para llevar la entalpía a 100 ºC hace falta $\Delta C_p$. ¿Cuánto
          vale, en J/(mol·K)?
        respuesta:
          tipo: numero
          valor: '93.84'
          tolerancia: 0.5
          formato: la capacidad calorífica en J/(mol·K), con dos decimales
        distractores:
          - valor: '152.64'
            mensaje: |
              Te has dejado el coeficiente del oxígeno. En la reacción entran
              **3 O2**, así que su Cp cuenta tres veces: 88,20 y no 29,40.
              Es el fallo más común del apartado, y multiplica la corrección
              por 1,6.
          - valor: '-93.84'
            mensaje: |
              Lo has hecho al revés, reactivos menos productos. Con el signo
              cambiado la entalpía te bajaría al subir la temperatura, y aquí
              sube.
        pista: |
          Productos menos reactivos, **con sus coeficientes**. Y después
          Kirchhoff hace el resto:
          $\Delta H(T_2) = \Delta H(T_1) + \Delta C_p\,(T_2-T_1)$.
        desarrollo: |
          $$
          \Delta C_p = \left[2(37{,}11)+2(75{,}33)\right]
          - \left[42{,}84 + 3(29{,}40)\right]
          = 224{,}88 - 131{,}04 = 93{,}84\ \text{J/(mol·K)}
          $$
          $$
          \Delta H(373{,}15) = -1422{,}6 + \frac{93{,}84\cdot 75}{1000}
          = -1415{,}6\ \text{kJ}
          $$

      - tipo: calcular
        titulo: Los moles de gas que cambian
        pregunta: |
          Para la energía interna hace falta $\Delta n_{\text{gas}}$. ¿Cuánto
          vale en esta combustión?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.1
          formato: un número entero con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Has contado el agua como gas: cuatro moles a la izquierda y
              cuatro a la derecha. Pero las tres reacciones del enunciado
              escriben **H2O (l)**, líquida, y en $\Delta n$ solo entran los
              gases. Con cero, $\Delta U$ te saldría igual que $\Delta H$.
          - valor: '2'
            mensaje: |
              El signo está al revés. Se **parte** de 4 moles de gas —1 de
              eteno y 3 de oxígeno— y se **llega** a 2 de CO2: el sistema se
              contrae.
        pista: |
          $\Delta U = \Delta H - \Delta n_{\text{gas}}RT$, y en
          $\Delta n_{\text{gas}}$ solo cuentan los gases: mira en qué estado
          escribe el enunciado cada sustancia.
        desarrollo: |
          $$
          \Delta n_{\text{gas}} = 2 - (1+3) = -2
          $$
          $$
          \Delta U = -1415{,}6 - (-2)(8{,}314\cdot 10^{-3})(373{,}15)
          = -1415{,}6 + 6{,}2 = -1409{,}4\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El calor que pide el aluminio
        pregunta: |
          ¿Cuánto calor hace falta para llevar 10 kg de aluminio de 25 ºC a
          fundido?
        respuesta:
          tipo: numero
          valor: '9647'
          tolerancia: 60
          formato: el calor en kJ
        distractores:
          - valor: '5695'
            mensaje: |
              Eso es solo calentarlo hasta 658 ºC. Falta fundirlo, que a
              temperatura constante son otros 3952 kJ.
          - valor: '3952'
            mensaje: |
              Eso es solo la fusión. El aluminio parte de 25 ºC: antes hay que
              subirlo 633 grados.
        pista: |
          Son dos sumandos y el segundo se olvida: calentar de 25 a 658 ºC con
          el Cp, y después fundir a temperatura constante con la entalpía de
          fusión.
        desarrollo: |
          $$
          n(\mathrm{Al}) = \frac{10\,000}{27} = 370{,}37\ \text{mol}
          $$
          $$
          q_1 = 370{,}37\cdot 24{,}29\cdot (658-25) = 5695\ \text{kJ}
          \qquad
          q_2 = 370{,}37\cdot 10{,}67 = 3952\ \text{kJ}
          $$
          $$
          q = 9647\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La entropía que gana el aluminio
        pregunta: |
          ¿Cuánto aumenta la entropía del aluminio en todo el proceso?
        respuesta:
          tipo: numero
          valor: '14.49'
          tolerancia: 0.2
          formato: la entropía en kJ/K, con dos cifras decimales
        distractores:
          - valor: '10.36'
            mensaje: |
              Has usado $q/T$ para el calentamiento. Ahí la temperatura
              **cambia**, así que hay que integrar: sale
              $nC_p\ln(T_2/T_1)$, no $q/T$.
          - valor: '4.24'
            mensaje: |
              Esa es solo la de la fusión. Falta la del calentamiento, que es
              más del doble.
        pista: |
          Dos términos otra vez, pero **no** son $q_1/T$ y $q_2/T$. En el
          calentamiento la temperatura varía y hay que integrar; en la fusión
          es constante y sí vale dividir.
        desarrollo: |
          $$
          \Delta S_{\text{calentar}} = nC_p\ln\frac{T_2}{T_1}
          = 370{,}37\cdot 24{,}29\cdot \ln\frac{931{,}15}{298{,}15}
          = 10\,245\ \text{J/K}
          $$
          $$
          \Delta S_{\text{fundir}} = \frac{n\,\Delta H_{\text{fus}}}{T_{\text{fus}}}
          = \frac{370{,}37\cdot 10\,670}{931{,}15} = 4244\ \text{J/K}
          $$
          $$
          \Delta S = 14\,489\ \text{J/K} = 14{,}49\ \text{kJ/K}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las energías libres de formación, $\Delta G^{0}=-1331{,}20$ kJ,
              y de ahí $\Delta S^{0}=-306{,}6$ J/K.
          - texto: >-
              Kirchhoff con $\Delta C_p = 93{,}84$ J/(mol·K) lleva la entalpía
              a 100 ºC: $-1415{,}6$ kJ.
          - texto: >-
              Con $\Delta n_{\text{gas}} = -2$, la energía interna es
              $-1409{,}4$ kJ.
          - texto: >-
              $\Delta H<0$ y $\Delta S<0$, así que es espontánea por debajo de
              4641 K — o sea siempre, en la práctica.
          - texto: >-
              Fundir los 10 kg pide 9647 kJ, que son 6,78 mol de eteno.
          - texto: >-
              El aluminio gana 14,49 kJ/K, sumando el calentamiento integrado
              y la fusión a temperatura constante.
          - texto: >-
              Como $\Delta S^{0}$ de la combustión es negativa, la reacción
              solo es espontánea por encima de cierta temperatura.
            trampa: true
            mensaje: |
              Es al revés, y es el error de signo más frecuente del tema.
              $\Delta G = \Delta H - T\Delta S$: con $\Delta S$ **negativa**,
              el término $-T\Delta S$ es **positivo** y crece con la
              temperatura, así que subir T empuja hacia lo no espontáneo.

              La regla, con los cuatro casos: si $\Delta H<0$ y $\Delta S>0$ es
              espontánea siempre; si los dos son positivos, solo en caliente;
              si los dos son negativos —como aquí—, solo en frío; y si
              $\Delta H>0$ y $\Delta S<0$, nunca.
        veredicto: |
          Todo el ejercicio cuelga de una idea: la energía libre relaciona
          entalpía y entropía, y quien sabe despejarla no necesita que la
          tabla le dé la entropía hecha.

    resolucion: |
      **Lo que se pide.** Seis apartados que recorren medio cuatrimestre. Este
      examen no publica lo que vale cada ejercicio, pero es el segundo de
      cinco y el más largo con diferencia.

      ## a) La entropía, que no está en la tabla

      Y esa es la primera decisión del ejercicio: la tabla da **energías
      libres de formación**, no entropías. El camino es la definición:

      $$
      \Delta G^{0} = \left[2(-394{,}36) + 2(-237{,}18)\right] - 68{,}12
      = -1331{,}20\ \text{kJ}
      $$

      El oxígeno no aparece porque su $\Delta G^{0}_f$ es cero: es un elemento
      en su forma más estable. Y ahora se despeja:

      $$
      \Delta G^{0} = \Delta H^{0} - T\Delta S^{0}
      \;\Longrightarrow\;
      \boxed{\;\Delta S^{0} = \frac{-1422{,}6+1331{,}20}{298{,}15}
      = -306{,}6\ \text{J/K}\;}
      $$

      **Que salga negativa tiene sentido físico**, y conviene decirlo en el
      examen: se parte de 4 moles de gas y se llega a 2, y encima el agua sale
      líquida. Menos gas es menos desorden.

      ## b) y c) Subir a 100 ºC

      Kirchhoff, con los Cp y **sus coeficientes**:

      $$
      \Delta C_p = \left[2(37{,}11)+2(75{,}33)\right]
      - \left[42{,}84+3(29{,}40)\right] = 93{,}84\ \text{J/(mol·K)}
      $$
      $$
      \boxed{\;\Delta H(100\ \text{°C}) = -1422{,}6 + 0{,}09384\cdot 75
      = -1415{,}6\ \text{kJ}\;}
      $$

      El 3 del oxígeno es donde más se falla: sin él, $\Delta C_p$ sale 152 y
      la corrección se dispara.

      Para la energía interna, solo cuentan los gases —el agua es líquida—:

      $$
      \Delta n_{\text{gas}} = 2-(1+3) = -2
      \;\Longrightarrow\;
      \boxed{\;\Delta U = -1415{,}6 + 6{,}2 = -1409{,}4\ \text{kJ}\;}
      $$

      Como el sistema se **contrae**, el entorno hace trabajo sobre él, y por
      eso $\Delta U$ queda por encima de $\Delta H$.

      ## d) La espontaneidad

      $\Delta H<0$ y $\Delta S<0$: los dos negativos, que es el caso «solo en
      frío». La temperatura de inversión es

      $$
      T = \frac{\Delta H}{\Delta S} = \frac{-1422{,}6}{-0{,}30656} = 4641\ \text{K}
      $$

      así que **en la práctica es espontánea siempre**: 4641 K está muy por
      encima de cualquier temperatura a la que quede eteno sin descomponer. La
      respuesta completa no es «es espontánea», es «lo es hasta 4641 K, y por
      eso lo es siempre».

      ## e) Los diez kilos de aluminio

      Dos sumandos, y el segundo se olvida:

      $$
      n(\mathrm{Al}) = \frac{10\,000}{27} = 370{,}37\ \text{mol}
      $$
      $$
      q_{\text{calentar}} = 370{,}37\cdot 24{,}29\cdot 633 = 5695\ \text{kJ}
      \qquad
      q_{\text{fundir}} = 370{,}37\cdot 10{,}67 = 3952\ \text{kJ}
      $$
      $$
      q = 9647\ \text{kJ}
      \;\Longrightarrow\;
      n(\mathrm{C_2H_4}) = \frac{9647}{1422{,}6} = 6{,}78\ \text{mol}
      $$

      **Y aquí el enunciado no dice en qué condiciones medir ese volumen.**
      No es un descuido nuestro: la frase «que están a 25 ºC a presión
      atmosférica» describe el aluminio, no el gas. Con la lectura más
      razonable —el mismo 25 ºC y 1 atm—:

      $$
      \boxed{\;V = nRT/P = 6{,}78\cdot 0{,}0821\cdot 298{,}15 = 166\ \text{L}\;}
      $$

      Si el corrector esperaba condiciones normales, 0 ºC y 1 atm, serían
      **152 L**. Conviene escribir en el examen cuál se ha supuesto: un
      supuesto declarado no cuesta puntos, y uno callado sí.

      ## f) La entropía del aluminio

      Dos términos otra vez, y **no** son $q_1/T$ y $q_2/T$. En el
      calentamiento la temperatura cambia, así que hay que integrar:

      $$
      \Delta S_{\text{calentar}} = nC_p\ln\frac{T_2}{T_1}
      = 370{,}37\cdot 24{,}29\cdot \ln\frac{931{,}15}{298{,}15} = 10\,245\ \text{J/K}
      $$

      En la fusión sí es constante, y ahí dividir vale:

      $$
      \Delta S_{\text{fundir}} = \frac{370{,}37\cdot 10\,670}{931{,}15}
      = 4244\ \text{J/K}
      $$
      $$
      \boxed{\;\Delta S = 14{,}49\ \text{kJ/K}\;}
      $$

      El contraste entre los apartados a) y f) es lo mejor del ejercicio: la
      reacción **pierde** 306,6 J/K y el aluminio **gana** 14 489. El universo
      no incumple nada — simplemente el metal se lleva muchísimo más desorden
      del que la combustión ordena.

  # ── El equilibrio del gas de agua, la reacción industrial que ajusta la
  #    proporción H2/CO del gas de síntesis. Tiene dos regalos escondidos:
  #    Δn = 0, así que Kp = Kc y el volumen no desplaza nada; y el apartado b)
  #    parece pedir dos perturbaciones a la vez —quitar agua Y comprimir— pero
  #    la segunda no hace nada, y darse cuenta es medio ejercicio.
  - id: exfq2425-2c-3-el-gas-de-agua-y-el-volumen-que-no-importa
    titulo: El gas de agua, y una compresión que no desplaza nada
    fuente: >-
      Ejercicio 3 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      En un recipiente de 10 L, se introducen 5,0 mol de H2O y 4,0 mol de CO.
      Cuando se establece el equilibrio a 1.000 °C existen 2,0 mol de CO2.

      $$
      \mathrm{H_2O\,(g)} + \mathrm{CO\,(g)} \rightleftharpoons
      \mathrm{H_2\,(g)} + \mathrm{CO_2\,(g)}
      \qquad \Delta H^{0} = -41{,}8\ \text{kJ}
      $$

      **a)** Calcula las constantes Kp y Kc a 1.000 °C.

      **b)** Una vez alcanzado el equilibrio se elimina 1 mol de H2O y se
      traslada la mezcla de equilibrio a un recipiente de volumen 5 L.
      Calcular las presiones parciales en el nuevo equilibrio.

      **c)** Determina el valor de la constante de equilibrio en condiciones
      estándar. ¿Explica cómo afecta al equilibrio la disminución de la
      temperatura?

      **d)** ¿Qué efecto tendría sobre el equilibrio la presencia de un
      catalizador?
    pide: >-
      Las dos constantes a 1000 °C, las presiones parciales del nuevo
      equilibrio, la constante a 25 °C con su interpretación, y el efecto de
      un catalizador.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b) se hacen **dos** cosas: quitar 1 mol de agua y
          reducir el volumen a la mitad. ¿Cuál de las dos desplaza el
          equilibrio?
        opciones:
          - texto: >-
              Solo quitar el agua: como hay dos moles de gas a cada lado,
              comprimir no desplaza nada
            correcta: true
            mensaje: |
              Exacto, y darse cuenta es medio ejercicio. La presión solo
              desplaza cuando cambia el número de moles de gas, y aquí
              $\Delta n = 0$: comprimir sube todas las concentraciones en el
              mismo factor y el cociente no se entera.
          - texto: >-
              Las dos: quitar reactivo desplaza a la izquierda y comprimir
              también
            mensaje: |
              Quitar agua sí desplaza. Comprimir no: con dos moles de gas a
              cada lado, el volumen se cancela en el cociente. Es la misma
              razón por la que $K_p = K_c$ en esta reacción.
          - texto: >-
              Solo comprimir, porque duplica todas las concentraciones
            mensaje: |
              Las duplica todas, y por eso mismo no cambia nada: hay dos
              factores arriba y dos abajo, así que el 2 se cancela.
          - texto: >-
              Ninguna, porque la constante no cambia
            mensaje: |
              La constante no cambia —solo la mueve la temperatura— pero las
              **concentraciones** sí se reajustan. Quitar agua obliga al
              sistema a reponerla.

      - tipo: calcular
        titulo: La constante a 1000 °C
        pregunta: ¿Cuánto vale $K_c$ a 1000 °C?
        respuesta:
          tipo: numero
          valor: '0.667'
          tolerancia: 0.02
          formato: la constante, adimensional, con tres cifras decimales
        distractores:
          - valor: '0.400'
            mensaje: |
              Has usado las cantidades iniciales del agua y el CO. En el
              equilibrio quedan 3,0 y 2,0 mol, no 5,0 y 4,0: han reaccionado
              2,0 de cada uno, los mismos que han formado CO2.
          - valor: '1.500'
            mensaje: |
              Está del revés, reactivos entre productos.
        pista: |
          Los 2,0 mol de CO2 dicen cuánto ha reaccionado: 2,0 de agua y 2,0 de
          CO, y se han formado 2,0 de H2. Y como $\Delta n = 0$, da igual usar
          moles o concentraciones.
        desarrollo: |
          | | H₂O | CO | H₂ | CO₂ |
          |---|---|---|---|---|
          | inicial | 5,0 | 4,0 | 0 | 0 |
          | equilibrio | 3,0 | 2,0 | 2,0 | 2,0 |

          $$
          K_c = \frac{[\mathrm{H_2}][\mathrm{CO_2}]}{[\mathrm{H_2O}][\mathrm{CO}]}
          = \frac{0{,}20\cdot 0{,}20}{0{,}30\cdot 0{,}20} = 0{,}667
          $$
          Y como $\Delta n_{\text{gas}} = 0$, $K_p = K_c(RT)^{0} = 0{,}667$
          también.

      - tipo: calcular
        titulo: La presión parcial del hidrógeno en el nuevo equilibrio
        pregunta: |
          Tras quitar 1 mol de agua y pasar a 5 L, ¿cuál es la presión parcial
          del H2?
        respuesta:
          tipo: numero
          valor: '37.6'
          tolerancia: 1.2
          formato: la presión en atmósferas, con una cifra decimal
        distractores:
          - valor: '41.8'
            mensaje: |
              Has supuesto que el equilibrio no se mueve. Al quitar agua, el
              cociente sube por encima de $K_c$ y el sistema retrocede: se
              consumen 0,202 mol de H2 y de CO2.
          - valor: '75.1'
            mensaje: |
              Has usado el volumen de 10 L para la presión. La mezcla se ha
              trasladado a **5 L**, así que la presión es el doble.
        pista: |
          Como el volumen no desplaza nada, resuelve en moles. Después, la
          presión parcial es $n_i RT/V$ con $V = 5$ L y $T = 1273$ K.
        desarrollo: |
          Tras quitar el agua hay 2,0 mol de cada especie, así que
          $Q = 1{,}00 > K_c$: el equilibrio retrocede en $z$.
          $$
          \frac{(2-z)^{2}}{(2+z)^{2}} = 0{,}667
          \;\Longrightarrow\;
          \frac{2-z}{2+z} = 0{,}8165
          \;\Longrightarrow\;
          z = 0{,}202
          $$
          $$
          n(\mathrm{H_2}) = n(\mathrm{CO_2}) = 1{,}798
          \qquad
          n(\mathrm{H_2O}) = n(\mathrm{CO}) = 2{,}202
          $$
          $$
          p(\mathrm{H_2}) = \frac{1{,}798\cdot 0{,}0821\cdot 1273}{5}
          = 37{,}6\ \text{atm}
          $$

      - tipo: calcular
        titulo: Cuánto crece la constante al enfriar
        pregunta: |
          Con $\Delta H^{0} = -41{,}8$ kJ, ¿cuánto vale
          $\ln\left(K_{298}/K_{1273}\right)$?
        respuesta:
          tipo: numero
          valor: '12.91'
          tolerancia: 0.4
          formato: el logaritmo neperiano del cociente, con dos cifras decimales
        distractores:
          - valor: '-12.91'
            mensaje: |
              Signo cambiado, y decide la respuesta entera. La reacción es
              **exotérmica**, así que enfriar la favorece y la constante tiene
              que **subir**: el logaritmo del cociente es positivo.
          - valor: '0'
            mensaje: |
              Sería cero si $\Delta H$ fuera cero, o si las dos temperaturas
              coincidieran. La constante es lo único que la temperatura sí
              cambia.
        pista: |
          Van't Hoff:
          $\ln(K_2/K_1) = -\frac{\Delta H^{0}}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)$,
          con $T_1 = 1273$ K y $T_2 = 298$ K. Fíjate en que $\Delta H$ es
          negativo y el paréntesis también.
        desarrollo: |
          $$
          \ln\frac{K_{298}}{K_{1273}}
          = \frac{41\,800}{8{,}314}\left(\frac{1}{298{,}15}-\frac{1}{1273{,}15}\right)
          = 12{,}91
          $$
          Y de ahí la constante:
          $$
          K_{298} = 0{,}667\cdot e^{12{,}91} = 2{,}7\cdot 10^{5}
          $$
          Cuatrocientas mil veces mayor: a temperatura ambiente la reacción
          está desplazadísima hacia los productos.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Los 2,0 mol de CO2 fijan la tabla: en el equilibrio quedan 3,0 de
              agua, 2,0 de CO y 2,0 de cada producto.
          - texto: >-
              $K_c = 0{,}667$, y como $\Delta n = 0$, $K_p$ vale lo mismo.
          - texto: >-
              Al quitar 1 mol de agua el cociente sube a 1,00 y el sistema
              retrocede en 0,202 mol.
          - texto: >-
              El cambio a 5 L **no** desplaza nada, solo duplica las presiones:
              37,6 atm para H2 y CO2, 46,0 para H2O y CO.
          - texto: >-
              Por van't Hoff, a 25 °C la constante es $2{,}7\cdot 10^{5}$:
              enfriar favorece la reacción porque es exotérmica.
          - texto: >-
              Un catalizador aceleraría la reacción directa más que la inversa,
              así que desplazaría el equilibrio hacia los productos.
            trampa: true
            mensaje: |
              Un catalizador baja la barrera **en los dos sentidos por igual**,
              así que multiplica las dos velocidades por el mismo factor. El
              equilibrio se alcanza antes y es exactamente el mismo.

              La razón de fondo: la constante depende de $\Delta G^{0}$, que es
              la diferencia entre el principio y el final. Un catalizador
              cambia el camino, no los extremos — si pudiera cambiarlos,
              violaría la primera ley, porque bastaría con quitarlo y ponerlo
              para sacar energía de la nada.
        veredicto: |
          Dos avisos en un ejercicio: $\Delta n = 0$ hace que el volumen no
          desplace nada, y un catalizador nunca desplaza.

    resolucion: |
      **Lo que se pide.** El equilibrio del gas de agua, que es la reacción con
      la que la industria ajusta la proporción H₂/CO del gas de síntesis. Y
      trae dos avisos escondidos.

      ## a) Las dos constantes

      Los 2,0 mol de CO₂ dicen cuánto ha avanzado la reacción:

      | | H₂O | CO | H₂ | CO₂ |
      |---|---|---|---|---|
      | inicial (mol) | 5,0 | 4,0 | 0 | 0 |
      | equilibrio (mol) | 3,0 | 2,0 | 2,0 | 2,0 |

      $$
      \boxed{\;K_c = \frac{0{,}20\cdot 0{,}20}{0{,}30\cdot 0{,}20} = 0{,}667\;}
      $$

      **Y el primer aviso:** hay dos moles de gas a cada lado, así que
      $\Delta n_{\text{gas}} = 0$ y

      $$
      K_p = K_c\,(RT)^{0} = \boxed{0{,}667}
      $$

      las dos son iguales. Conviene decirlo explícitamente en el examen en vez
      de calcular $K_p$ por otro camino.

      ## b) El nuevo equilibrio, y la compresión que no hace nada

      **El segundo aviso, y es el que decide el apartado.** Se piden dos cosas
      a la vez: quitar 1 mol de agua **y** pasar de 10 L a 5. La segunda no
      desplaza nada, por la misma razón de antes: con dos factores arriba y
      dos abajo, el volumen se cancela en el cociente.

      Así que se resuelve en moles. Tras quitar el agua quedan 2,0 mol de cada
      especie:

      $$
      Q = \frac{2\cdot 2}{2\cdot 2} = 1{,}00 > K_c = 0{,}667
      $$

      Hay demasiado producto: el equilibrio **retrocede** en $z$.

      $$
      \frac{(2-z)^{2}}{(2+z)^{2}} = 0{,}667
      \;\Longrightarrow\;
      \frac{2-z}{2+z} = \sqrt{0{,}667} = 0{,}8165
      \;\Longrightarrow\;
      z = 0{,}202
      $$

      Otra vez el atajo del cuadrado perfecto: no hace falta la fórmula
      general.

      $$
      n(\mathrm{H_2}) = n(\mathrm{CO_2}) = 1{,}798
      \qquad
      n(\mathrm{H_2O}) = n(\mathrm{CO}) = 2{,}202
      $$

      Y ahora sí entran los 5 L, pero solo para pasar a presiones:

      $$
      \boxed{\;p(\mathrm{H_2}) = p(\mathrm{CO_2}) = 37{,}6\ \text{atm}
      \qquad
      p(\mathrm{H_2O}) = p(\mathrm{CO}) = 46{,}0\ \text{atm}\;}
      $$

      La presión total son 167 atm. Y comprobando,
      $37{,}6^{2}/46{,}0^{2} = 0{,}667$ ✓.

      ## c) A 25 °C

      $$
      \ln\frac{K_{298}}{K_{1273}}
      = \frac{41\,800}{8{,}314}\left(\frac{1}{298{,}15}-\frac{1}{1273{,}15}\right)
      = 12{,}91
      \;\Longrightarrow\;
      \boxed{\;K_{298} = 2{,}7\cdot 10^{5}\;}
      $$

      **Cuatrocientas mil veces mayor.** La reacción es exotérmica, así que el
      calor es un producto y enfriar la empuja hacia adelante: bajar la
      temperatura **favorece** la formación de hidrógeno.

      Y ahí está la tensión industrial real: termodinámicamente conviene
      trabajar frío, pero en frío la reacción es lentísima. Por eso el proceso
      se hace caliente y con catalizador — se sacrifica constante a cambio de
      velocidad.

      ## d) El catalizador

      **Ninguno sobre el equilibrio.** Acelera los dos sentidos por igual, así
      que se llega antes al mismo sitio. La constante depende de
      $\Delta G^{0}$, una diferencia entre estados, y un catalizador cambia el
      camino y no los extremos.

      Es exactamente lo que se acaba de decir en el apartado c): el catalizador
      resuelve el problema de la velocidad, no el de la posición.

  # ── Cuatro pH sobre la misma base débil, y cada uno en un régimen distinto.
  #    Con una vuelta de tuerca que no tiene el del ácido láctico: aquí la
  #    especie de partida es una BASE, así que Henderson va con pOH y hay que
  #    acordarse de restar de 14 al final.
  - id: exfq2425-2c-4-el-amoniaco-y-cuatro-regimenes
    titulo: Hidróxido amónico, y cuatro pH que no se calculan igual
    fuente: >-
      Ejercicio 4 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Se tienen 10 mL de hidróxido amónico 0,25 M, determina el pH si se
      añaden:

      **a)** 25 mL de hidróxido sódico 0,1 M

      **b)** 25 mL de ácido clorhídrico 0,1 M

      **c)** 30 mL de nitrato amónico 0,1 M

      **d)** ¿Cómo variaría el pH de la solución c) si se le añadiera 10 mL de
      la solución a)? ¿Y 10 mL de la solución b)?

      **Datos:** $K_b(\mathrm{NH_4OH}) = 1{,}8\cdot 10^{-5}$.
    pide: El pH en los tres primeros casos y cómo varía al mezclar en el cuarto.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a) se añade sosa a amoniaco: **dos bases**. ¿Qué pasa?
        opciones:
          - texto: >-
              No reaccionan entre sí, y el pH lo fija la fuerte: la débil
              aporta una parte despreciable
            correcta: true
            mensaje: |
              Exacto. Dos bases no se neutralizan. Y además el ion común
              —el OH⁻ de la sosa— retrasa aún más la disociación del amoniaco,
              así que su aportación es todavía menor de lo normal.
          - texto: >-
              Se neutralizan entre ellas y queda una disolución neutra
            mensaje: |
              Neutralizarse es cosa de un ácido y una base. Dos bases juntas
              solo suman iones OH⁻.
          - texto: >-
              Hay que usar Henderson con las dos
            mensaje: |
              Henderson necesita un ácido débil y **su** base conjugada. La
              sosa no es la conjugada del amoniaco: la conjugada del NH3 es el
              NH4⁺.
          - texto: >-
              El amoniaco precipita al añadir sosa
            mensaje: |
              No hay nada que precipite: el amoniaco es soluble y el sodio
              también. Es simplemente una mezcla de dos bases.

      - tipo: calcular
        titulo: Con sosa
        pregunta: ¿Cuál es el pH tras añadir los 25 mL de NaOH 0,1 M?
        respuesta:
          tipo: numero
          valor: '12.85'
          tolerancia: 0.1
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '11.13'
            mensaje: |
              Ese sería el del amoniaco solo. La sosa aporta 0,0025 mol de OH⁻
              directos, treinta veces más de los que da la base débil.
          - valor: '13.40'
            mensaje: |
              Te has dejado el cambio de volumen. Los 0,0025 mol están ahora en
              **35 mL**, no en 25.
        pista: |
          Cuenta los moles de sosa y divídelos entre el volumen total. La base
          débil no cuenta, y menos aún con el ion común.
        desarrollo: |
          $$
          n(\mathrm{NaOH}) = 0{,}025\cdot 0{,}1 = 0{,}0025\ \text{mol}
          \qquad
          V = 35\ \text{mL}
          $$
          $$
          [\mathrm{OH^-}] = \frac{0{,}0025}{0{,}035} = 0{,}0714
          \;\Longrightarrow\;
          \mathrm{pOH} = 1{,}15
          \;\Longrightarrow\;
          \mathrm{pH} = 12{,}85
          $$

      - tipo: calcular
        titulo: Con clorhídrico
        pregunta: ¿Y tras añadir 25 mL de HCl 0,1 M?
        respuesta:
          tipo: numero
          valor: '5.20'
          tolerancia: 0.1
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '7.00'
            mensaje: |
              Los moles se igualan exactamente, pero eso no da 7: la base es
              **débil**, así que su conjugado —el NH4⁺— es un ácido e
              hidroliza. La equivalencia queda **ácida**.
          - valor: '8.80'
            mensaje: |
              Has calculado como si quedara base. Los 0,0025 mol de HCl
              neutralizan exactamente los 0,0025 de amoniaco: no queda nada de
              base, solo su conjugado.
        pista: |
          Los moles coinciden: es el punto de equivalencia y solo queda NH4⁺.
          Su constante es $K_a = K_w/K_b$, y ojo al volumen total.
        desarrollo: |
          $$
          C(\mathrm{NH_4^+}) = \frac{0{,}0025}{0{,}035} = 0{,}0714\ \mathrm{M}
          \qquad
          K_a = \frac{10^{-14}}{1{,}8\cdot 10^{-5}} = 5{,}56\cdot 10^{-10}
          $$
          $$
          [\mathrm{H^+}] = \sqrt{K_a\,C} = 6{,}30\cdot 10^{-6}
          \;\Longrightarrow\;
          \mathrm{pH} = 5{,}20
          $$

      - tipo: calcular
        titulo: Con nitrato amónico
        pregunta: ¿Y tras añadir 30 mL de NH4NO3 0,1 M?
        respuesta:
          tipo: numero
          valor: '9.18'
          tolerancia: 0.1
          formato: el pH, con dos cifras decimales
        distractores:
          - valor: '4.82'
            mensaje: |
              Ese es el **pOH**, no el pH. Al trabajar con una base, Henderson
              da directamente el pOH: falta restarlo de 14.
          - valor: '11.13'
            mensaje: |
              Ese es el del amoniaco solo. El nitrato amónico aporta NH4⁺, el
              ion común, que frena la disociación de la base y baja el pH casi
              dos unidades.
        pista: |
          El NH4⁺ del nitrato amónico es la especie conjugada de la base: eso
          es un tampón. Con una base, Henderson se escribe con pOH y pKb.
        desarrollo: |
          $$
          n(\mathrm{NH_3}) = 0{,}0025
          \qquad
          n(\mathrm{NH_4^+}) = 0{,}003
          \qquad
          \mathrm{p}K_b = 4{,}745
          $$
          $$
          \mathrm{pOH} = \mathrm{p}K_b + \log\frac{[\mathrm{NH_4^+}]}{[\mathrm{NH_3}]}
          = 4{,}745 + \log\frac{0{,}003}{0{,}0025} = 4{,}824
          $$
          $$
          \mathrm{pH} = 14 - 4{,}824 = 9{,}18
          $$

      - tipo: justificar
        pregunta: Ordena los cuatro apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              a) Sosa y amoniaco no reaccionan: manda la base fuerte y sale
              pH 12,85.
          - texto: >-
              b) El clorhídrico neutraliza exactamente la base: queda solo
              NH4⁺, que hidroliza, y el pH es **ácido**, 5,20.
          - texto: >-
              c) El nitrato amónico aporta el conjugado: es un tampón y da
              pH 9,18.
          - texto: >-
              d) Añadir 10 mL de a) mete sosa en el tampón, que convierte NH4⁺
              en NH3: el pH sube a 9,49.
          - texto: >-
              d) Añadir 10 mL de b) mete NH4⁺, que es el ácido del par: el pH
              baja a 9,08.
          - texto: >-
              Como el tampón del apartado c) resiste los cambios, añadirle las
              disoluciones a) o b) no le mueve el pH.
            trampa: true
            mensaje: |
              Lo mueve, poco: de 9,18 a 9,49 y a 9,08. Un tampón **amortigua**,
              no congela — y ese es justo el sentido del apartado d).

              La comparación que lo hace evidente: esos mismos 0,71 mmol de
              sosa echados en agua darían pH 12,15, y en el tampón dejan 9,49.
              Tres unidades de diferencia.
        veredicto: |
          Cuatro apartados y cuatro regímenes: base fuerte sola, equivalencia
          ácida, tampón, y tampón perturbado. La decisión, otra vez, se toma
          contando moles.

    resolucion: |
      **Lo que se pide.** Cuatro pH sobre la misma base débil, y el ejercicio
      está construido para que cada uno caiga en un régimen distinto. Con una
      vuelta de tuerca respecto del ácido láctico de la extraordinaria: aquí la
      especie de partida es una **base**, así que Henderson da el pOH y hay que
      acordarse de restar de 14.

      La cuenta de siempre, antes de nada:
      $n(\mathrm{NH_3}) = 0{,}010\cdot 0{,}25 = 0{,}0025$ mol.

      ## a) 25 mL de NaOH 0,1 M → dos bases

      No reaccionan entre sí. La sosa aporta 0,0025 mol de OH⁻ directos y el
      amoniaco, con el ion común frenándolo, aporta una parte despreciable.

      $$
      [\mathrm{OH^-}] = \frac{0{,}0025}{0{,}035} = 0{,}0714
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 12{,}85\;}
      $$

      ## b) 25 mL de HCl 0,1 M → equivalencia, y es ácida

      $$
      n(\mathrm{HCl}) = 0{,}0025 = n(\mathrm{NH_3})
      $$

      Se neutralizan exactamente: en el vaso solo queda **NH4⁺**, que es un
      ácido débil.

      $$
      K_a = \frac{K_w}{K_b} = 5{,}56\cdot 10^{-10}
      \qquad
      [\mathrm{H^+}] = \sqrt{K_a\cdot 0{,}0714} = 6{,}30\cdot 10^{-6}
      $$
      $$
      \boxed{\;\mathrm{pH} = 5{,}20\;}
      $$

      **Y fíjate en la simetría con el ácido láctico:** allí un ácido débil
      valorado con base fuerte daba equivalencia **básica**, 8,84. Aquí una
      base débil con ácido fuerte da equivalencia **ácida**, 5,20. El que
      queda mandando es siempre el conjugado del débil.

      ## c) 30 mL de NH4NO3 0,1 M → tampón

      El nitrato amónico aporta NH4⁺, que es la especie conjugada: base y
      conjugado juntos son un tampón.

      $$
      \mathrm{pOH} = \mathrm{p}K_b + \log\frac{0{,}003}{0{,}0025} = 4{,}824
      \;\Longrightarrow\;
      \boxed{\;\mathrm{pH} = 9{,}18\;}
      $$

      **El descuido que este apartado busca** es dar 4,82 como respuesta.
      Trabajando con una base, Henderson da el **pOH**; el pH es 14 menos eso.

      ## d) El tampón, perturbado

      | añadido | qué hace | pH |
      |---|---|---|
      | 10 mL de a) | mete 0,71 mmol de sosa, que pasan NH4⁺ a NH3 | **9,49** |
      | 10 mL de b) | mete 0,71 mmol de NH4⁺, el ácido del par | **9,08** |

      Se mueve, y poco: tres décimas arriba y una abajo. Es exactamente para
      lo que sirve un tampón.

      **La comparación que da la medida:** esos mismos 0,71 mmol de sosa en
      50 mL de agua pura darían pH 12,15. En el tampón dejan 9,49 — casi tres
      unidades menos de sacudida.

  # ── La pila del examen, con los dos potenciales POSITIVOS. Es a propósito:
  #    obliga a decidir por comparación y no por el signo, que es el atajo que
  #    funciona en la pila de manual y falla aquí. Las concentraciones del
  #    apartado d) se leyeron sobre la IMAGEN del PDF, porque al extraer el
  #    texto los exponentes salen duplicados (§17).
  - id: exfq2425-2c-5-la-pila-de-cobre-y-hierro
    titulo: Dos potenciales positivos, y una pila que empuja más de lo que dice la tabla
    fuente: >-
      Ejercicio 5 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Para los pares redox:
      $E^{0}(\mathrm{Cu^+}|\mathrm{Cu}) = +0{,}521$ V;
      $E^{0}(\mathrm{Fe^{3+}}|\mathrm{Fe^{2+}}) = +0{,}77$ V.

      **a)** Determina la reacción espontánea que tendrá lugar en la pila
      formada uniendo ambos electrodos.

      **b)** Dibuja y representa la pila.

      **c)** Calcula la constante de equilibrio de dicha reacción a 25 °C.

      **d)** Calcula E pila y ΔG a 25 °C, si las concentraciones de las
      diferentes especies son $[\mathrm{Fe^{3+}}] = 1{,}0\cdot 10^{-2}$ M;
      $[\mathrm{Fe^{2+}}] = 2{,}0\cdot 10^{-5}$ M;
      $[\mathrm{Cu^+}] = 1{,}0\cdot 10^{-3}$ M. ¿Es espontánea la reacción en
      estas condiciones?

      **Datos:** constante de Faraday 96485 C/mol.
    pide: >-
      La reacción espontánea, el esquema de la pila, su constante de
      equilibrio, y el potencial y la energía libre con esas concentraciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los **dos** potenciales son positivos. ¿Quién se oxida?
        opciones:
          - texto: >-
              El cobre, porque su potencial es el **menor** de los dos
            correcta: true
            mensaje: |
              Eso es, y este ejercicio está diseñado para comprobarlo: con los
              dos positivos, el atajo de «el negativo se oxida» no sirve. Lo
              que decide es siempre cuál es menor.
          - texto: >-
              Ninguno: los dos potenciales positivos significan que los dos se
              reducen
            mensaje: |
              No pueden reducirse los dos: alguien tiene que dar los
              electrones. El signo del potencial se mide **frente al electrodo
              de hidrógeno**, no frente al otro par de la pila.
          - texto: >-
              El hierro, porque el Fe³⁺ ya está oxidado
            mensaje: |
              El Fe³⁺ está oxidado y por eso **se reduce**, a Fe²⁺. Quien se
              oxida es el que sube su número de oxidación, y aquí es el cobre
              metálico pasando a Cu⁺.
          - texto: >-
              Depende de las concentraciones del apartado d)
            mensaje: |
              Las concentraciones pueden cambiar el **valor** del potencial, y
              en casos extremos hasta invertir la pila. Aquí no: con ellas el
              potencial sube a 0,586 V, más espontánea todavía.

      - tipo: calcular
        titulo: El potencial estándar
        pregunta: ¿Cuánto vale $E^{0}$ de la pila?
        respuesta:
          tipo: numero
          valor: '0.249'
          tolerancia: 0.008
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '1.291'
            mensaje: |
              Has cambiado el signo del cobre al invertir su semirreacción y
              además has restado. La resta ya se encarga de la inversión.
          - valor: '-0.249'
            mensaje: |
              Has restado al revés, ánodo menos cátodo. El resultado negativo
              te está diciendo que la reacción que has escrito va al otro
              lado: dale la vuelta.
        pista: |
          $E^{0}_{\text{pila}} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$,
          con los números tal cual vienen. El cátodo es el hierro, que es el
          que se reduce.
        desarrollo: |
          $$
          \mathrm{Cu} + \mathrm{Fe^{3+}} \rightarrow
          \mathrm{Cu^+} + \mathrm{Fe^{2+}}
          \qquad n = 1
          $$
          $$
          E^{0} = 0{,}77 - 0{,}521 = 0{,}249\ \text{V}
          $$

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: ¿Cuánto vale $\ln K$ a 25 °C?
        respuesta:
          tipo: numero
          valor: '9.69'
          tolerancia: 0.3
          formato: el logaritmo neperiano de la constante, con dos decimales
        distractores:
          - valor: '19.38'
            mensaje: |
              Has usado $n = 2$. La reacción intercambia **un** electrón: el
              cobre pasa de 0 a +1 y el hierro de +3 a +2.
          - valor: '-9.69'
            mensaje: |
              Signo cambiado. Con $E^{0}$ positivo la reacción es espontánea y
              $K$ tiene que ser mayor que 1, así que su logaritmo es positivo.
        pista: |
          $\ln K = nFE^{0}/RT$, con $n = 1$, $F = 96\,485$ y
          $RT = 8{,}314\cdot 298{,}15$.
        desarrollo: |
          $$
          \ln K = \frac{nFE^{0}}{RT}
          = \frac{1\cdot 96\,485\cdot 0{,}249}{8{,}314\cdot 298{,}15} = 9{,}69
          \;\Longrightarrow\;
          K = 1{,}6\cdot 10^{4}
          $$
          Y de paso, $\Delta G^{0} = -nFE^{0} = -24{,}0$ kJ.

      - tipo: calcular
        titulo: El potencial con esas concentraciones
        pregunta: |
          Con $[\mathrm{Fe^{3+}}] = 10^{-2}$,
          $[\mathrm{Fe^{2+}}] = 2\cdot 10^{-5}$ y
          $[\mathrm{Cu^+}] = 10^{-3}$, ¿cuánto vale $E$?
        respuesta:
          tipo: numero
          valor: '0.586'
          tolerancia: 0.015
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '-0.088'
            mensaje: |
              Has puesto $Q$ del revés. Los productos son el Cu⁺ y el Fe²⁺, que
              están muy diluidos, así que $Q$ es **pequeño** y el potencial
              **sube**.
          - valor: '0.249'
            mensaje: |
              Ese es el estándar. Las concentraciones no son 1 M, así que hay
              que corregir con Nernst — y la corrección aquí es grande, más
              de un tercio de voltio.
        pista: |
          $Q = [\mathrm{Cu^+}][\mathrm{Fe^{2+}}]/[\mathrm{Fe^{3+}}]$, sin el
          cobre metálico porque es sólido. Después,
          $E = E^{0} - 0{,}0592\log Q$ con $n = 1$.
        desarrollo: |
          $$
          Q = \frac{10^{-3}\cdot 2\cdot 10^{-5}}{10^{-2}} = 2{,}0\cdot 10^{-6}
          \qquad
          \log Q = -5{,}70
          $$
          $$
          E = 0{,}249 - 0{,}0592\cdot(-5{,}70) = 0{,}249 + 0{,}337
          = 0{,}586\ \text{V}
          $$
          $$
          \Delta G = -nFE = -56{,}6\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              De los dos, el hierro tiene el potencial mayor, así que se reduce
              a Fe²⁺ y el cobre se oxida a Cu⁺.
          - texto: >-
              $E^{0} = 0{,}77 - 0{,}521 = 0{,}249$ V, con un solo electrón en
              juego.
          - texto: >-
              El ánodo es el cobre y el cátodo necesita un electrodo inerte de
              platino, porque el par Fe³⁺/Fe²⁺ no tiene sólido.
          - texto: >-
              $\ln K = 9{,}69$, o sea $K = 1{,}6\cdot 10^{4}$, y
              $\Delta G^{0} = -24{,}0$ kJ.
          - texto: >-
              Con las concentraciones dadas, $Q = 2\cdot 10^{-6}$ y el
              potencial **sube** a 0,586 V: más espontánea todavía.
          - texto: >-
              Como los dos potenciales son positivos, la pila funciona en los
              dos sentidos y hay que elegir el que dé mayor voltaje.
            trampa: true
            mensaje: |
              Solo funciona en un sentido, y no se elige: se deduce. El signo
              del potencial está medido **frente al electrodo de hidrógeno**,
              que es la referencia arbitraria de la tabla, no frente al otro
              par de la pila.

              Lo que decide es la comparación entre los dos, y solo una de las
              dos combinaciones da $E^{0}$ positivo. La otra daría −0,249 V,
              que es la forma que tiene la termodinámica de decir «al revés».
        veredicto: |
          Con los dos potenciales positivos el atajo del signo no vale. Decide
          siempre la comparación, y el resultado se comprueba: si sale
          negativo, la reacción estaba escrita al revés.

    resolucion: |
      **Lo que se pide.** La pila del examen tiene los **dos potenciales
      positivos**, y eso es a propósito: rompe el atajo de «el negativo se
      oxida» que funciona en la pila de cinc y cobre de todos los libros.

      ## a) La reacción

      El de potencial mayor se reduce. Aquí es el hierro:

      $$
      \text{cátodo: } \mathrm{Fe^{3+}} + \mathrm{e^-} \rightarrow \mathrm{Fe^{2+}}
      \qquad
      \text{ánodo: } \mathrm{Cu} \rightarrow \mathrm{Cu^+} + \mathrm{e^-}
      $$
      $$
      \boxed{\;\mathrm{Cu} + \mathrm{Fe^{3+}} \rightarrow
      \mathrm{Cu^+} + \mathrm{Fe^{2+}}
      \qquad E^{0} = 0{,}77-0{,}521 = 0{,}249\ \text{V}\;}
      $$

      **El signo positivo de los dos no significa nada por separado.** Está
      medido frente al electrodo de hidrógeno, que es la referencia de la
      tabla. Lo que decide es cuál es mayor.

      ## b) La pila

      $$
      \mathrm{Cu}\,\big|\,\mathrm{Cu^+}\,\big\|\,
      \mathrm{Fe^{3+}},\mathrm{Fe^{2+}}\,\big|\,\mathrm{Pt}
      $$

      - **Ánodo** (negativo): lámina de cobre en disolución de Cu⁺. Se disuelve.
      - **Cátodo** (positivo): un hilo de **platino** en una disolución que
        contiene los dos iones de hierro. El platino hace falta porque el par
        Fe³⁺/Fe²⁺ no tiene ninguna especie sólida que sirva de electrodo: es
        un electrodo inerte, solo conduce.
      - Los electrones van del cobre al platino por el cable; el puente salino
        cierra el circuito.

      ## c) La constante

      $$
      \ln K = \frac{nFE^{0}}{RT} = \frac{96\,485\cdot 0{,}249}{2478{,}8}
      = 9{,}69
      \;\Longrightarrow\;
      \boxed{\;K = 1{,}6\cdot 10^{4}\;}
      \qquad
      \Delta G^{0} = -24{,}0\ \text{kJ}
      $$

      Un electrón, no dos: el cobre va de 0 a +1 y el hierro de +3 a +2.

      ## d) Con las concentraciones reales

      $$
      Q = \frac{[\mathrm{Cu^+}][\mathrm{Fe^{2+}}]}{[\mathrm{Fe^{3+}}]}
      = \frac{10^{-3}\cdot 2\cdot 10^{-5}}{10^{-2}} = 2{,}0\cdot 10^{-6}
      $$

      El cobre metálico no entra: es sólido puro.

      $$
      E = 0{,}249 - 0{,}0592\log(2{,}0\cdot 10^{-6})
      = 0{,}249 + 0{,}337 = \boxed{0{,}586\ \text{V}}
      $$
      $$
      \Delta G = -nFE = \boxed{-56{,}6\ \text{kJ}}
      $$

      **Sí es espontánea, y más que en condiciones estándar.** El potencial
      sube más del doble, y la razón se lee sin calcular: los dos productos
      están mucho más diluidos que el reactivo, así que a la reacción le queda
      mucho camino y empuja con más fuerza.

      Comparando los dos $\Delta G$ —−24,0 estándar contra −56,6 reales— se ve
      lo mismo en energía: hay más del doble de trabajo eléctrico disponible
      por mol.
