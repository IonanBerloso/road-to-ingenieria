ejercicios:
  # ── Seis apartados que recorren medio cuatrimestre: Hess por energías
  #    libres, Kirchhoff, la relación entre ΔH y ΔU, espontaneidad con la
  #    temperatura, y un balance de calor que acaba fundiendo diez kilos de
  #    aluminio. Es el ejercicio que mejor enseña que la termoquímica no son
  #    fórmulas sueltas sino una sola contabilidad.
  - id: exfq2425-2c-2-el-eteno-y-los-diez-kilos-de-aluminio
    titulo: Quemar eteno hasta fundir diez kilos de aluminio
    fuente: >-
      Ejercicio 2 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Teniendo en cuenta las siguientes reacciones:

      $$
      \mathrm{H_2\,(g)} + \tfrac{1}{2}\,\mathrm{O_2\,(g)}
      \Rightarrow \mathrm{H_2O\,(l)}
      \qquad \Delta H_1^{0} = -285{,}8\ \text{kJ}
      $$
      $$
      \mathrm{C\,(s)} + \mathrm{O_2\,(g)} \Rightarrow \mathrm{CO_2\,(g)}
      \qquad \Delta H_2^{0} = -393{,}5\ \text{kJ}
      $$
      $$
      \mathrm{C_2H_4\,(g)} + 3\,\mathrm{O_2\,(g)}
      \Rightarrow 2\,\mathrm{CO_2\,(g)} + 2\,\mathrm{H_2O\,(l)}
      \qquad \Delta H_3^{0} = -1422{,}6\ \text{kJ}
      $$

      Calcula:

      **a)** El cambio de entropía de la reacción de combustión del eteno
      (C2H4) en condiciones estándar.

      **b)** El cambio de entalpía de la reacción de combustión del eteno a
      100 ºC.

      **c)** La variación de energía interna de la misma reacción a 100 ºC.

      **d)** Analiza la espontaneidad de la reacción de combustión con la
      temperatura.

      **e)** ¿Cuántos litros de eteno necesitamos quemar para poder fundir
      10 kg de aluminio que están a 25 ºC a presión atmosférica?

      **f)** El cambio total de la entropía que sufrirá el aluminio. Masa
      atómica (g/mol): Al (27).

      **Datos:**

      | sustancia | ΔG⁰f (kJ/mol) | Cp (J/(mol·K)) | T fusión (ºC) | ΔH fusión (kJ/mol) |
      |---|---|---|---|---|
      | H2O (l) | −237,18 | 75,33 | | |
      | CO2 (g) | −394,36 | 37,11 | | |
      | C2H4 (g) | 68,12 | 42,84 | | |
      | O2 (g) | — | 29,40 | | |
      | Al (s) | | 24,29 | 658 | 10,67 |
    pide: >-
      La entropía y la entalpía de combustión, la energía interna a 100 ºC, el
      rango de espontaneidad, el volumen de eteno que funde 10 kg de aluminio
      y la entropía que gana el metal.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) pide la **entropía** de la combustión, y la tabla no
          trae entropías: solo energías libres de formación. ¿Por dónde se
          entra?
        opciones:
          - texto: >-
              Por $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$, calculando
              antes $\Delta G^{0}$ con las energías libres de formación
            correcta: true
            mensaje: |
              Eso es. La tabla da lo que hace falta para $\Delta G^{0}$, el
              enunciado da $\Delta H^{0}$, y la definición de energía libre
              despeja la entropía. Que un dato no esté tabulado no significa
              que no se pueda obtener.
          - texto: >-
              Con la ley de Hess sobre las tres reacciones, combinándolas para
              obtener la entropía
            mensaje: |
              Hess vale para funciones de estado y la entropía lo es, pero las
              tres reacciones traen **entalpías**, no entropías. Combinándolas
              solo se obtienen entalpías.
          - texto: >-
              No se puede: falta la entropía absoluta de cada sustancia
            mensaje: |
              Haría falta si quisieras $\Delta S^{0}$ como suma de $S^{0}$ de
              productos menos reactivos. Pero hay otro camino, y es el que la
              tabla está preparando.
          - texto: >-
              Derivando la entalpía respecto de la temperatura con los Cp
            mensaje: |
              Los Cp sirven para llevar la entalpía de una temperatura a otra
              —apartado b)— y para la entropía del aluminio —apartado f)—,
              pero no dan la entropía de reacción en condiciones estándar.

      - tipo: calcular
        titulo: La entropía de la combustión
        pregunta: |
          ¿Cuánto vale $\Delta S^{0}$ de la combustión del eteno, en J/K?
        respuesta:
          tipo: numero
          valor: '-306.6'
          tolerancia: 3
          formato: la entropía en J/K, con una cifra decimal y su signo
        distractores:
          - valor: '306.6'
            mensaje: |
              El signo importa y aquí es negativo: la reacción pasa de 4 moles
              de gas a 2, y encima condensa agua líquida. El desorden baja.
          - valor: '-0.3066'
            mensaje: |
              Ese es el valor en **kJ/K**. El enunciado no fija unidad, pero
              una entropía se da en J/K salvo que se diga lo contrario.
        pista: |
          Primero $\Delta G^{0}$ con las energías libres de formación —la del
          O2 es cero por ser elemento en su forma estable—, y después despeja
          de $\Delta G^{0} = \Delta H^{0} - T\Delta S^{0}$ a 298,15 K.
        desarrollo: |
          $$
          \Delta G^{0} = \left[2(-394{,}36) + 2(-237{,}18)\right] - 68{,}12
          = -1331{,}20\ \text{kJ}
          $$
          $$
          \Delta S^{0} = \frac{\Delta H^{0} - \Delta G^{0}}{T}
          = \frac{-1422{,}6 + 1331{,}20}{298{,}15}
          = -0{,}3066\ \text{kJ/K} = -306{,}6\ \text{J/K}
          $$

      - tipo: calcular
        titulo: El ΔCp, que es donde se decide el apartado b
        pregunta: |
          Para llevar la entalpía a 100 ºC hace falta $\Delta C_p$. ¿Cuánto
          vale, en J/(mol·K)?
        respuesta:
          tipo: numero
          valor: '93.84'
          tolerancia: 0.5
          formato: la capacidad calorífica en J/(mol·K), con dos decimales
        distractores:
          - valor: '152.64'
            mensaje: |
              Te has dejado el coeficiente del oxígeno. En la reacción entran
              **3 O2**, así que su Cp cuenta tres veces: 88,20 y no 29,40.
              Es el fallo más común del apartado, y multiplica la corrección
              por 1,6.
          - valor: '-93.84'
            mensaje: |
              Lo has hecho al revés, reactivos menos productos. Con el signo
              cambiado la entalpía te bajaría al subir la temperatura, y aquí
              sube.
        pista: |
          Productos menos reactivos, **con sus coeficientes**. Y después
          Kirchhoff hace el resto:
          $\Delta H(T_2) = \Delta H(T_1) + \Delta C_p\,(T_2-T_1)$.
        desarrollo: |
          $$
          \Delta C_p = \left[2(37{,}11)+2(75{,}33)\right]
          - \left[42{,}84 + 3(29{,}40)\right]
          = 224{,}88 - 131{,}04 = 93{,}84\ \text{J/(mol·K)}
          $$
          $$
          \Delta H(373{,}15) = -1422{,}6 + \frac{93{,}84\cdot 75}{1000}
          = -1415{,}6\ \text{kJ}
          $$

      - tipo: calcular
        titulo: Los moles de gas que cambian
        pregunta: |
          Para la energía interna hace falta $\Delta n_{\text{gas}}$. ¿Cuánto
          vale en esta combustión?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.1
          formato: un número entero con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Has contado el agua como gas: cuatro moles a la izquierda y
              cuatro a la derecha. Pero las tres reacciones del enunciado
              escriben **H2O (l)**, líquida, y en $\Delta n$ solo entran los
              gases. Con cero, $\Delta U$ te saldría igual que $\Delta H$.
          - valor: '2'
            mensaje: |
              El signo está al revés. Se **parte** de 4 moles de gas —1 de
              eteno y 3 de oxígeno— y se **llega** a 2 de CO2: el sistema se
              contrae.
        pista: |
          $\Delta U = \Delta H - \Delta n_{\text{gas}}RT$, y en
          $\Delta n_{\text{gas}}$ solo cuentan los gases: mira en qué estado
          escribe el enunciado cada sustancia.
        desarrollo: |
          $$
          \Delta n_{\text{gas}} = 2 - (1+3) = -2
          $$
          $$
          \Delta U = -1415{,}6 - (-2)(8{,}314\cdot 10^{-3})(373{,}15)
          = -1415{,}6 + 6{,}2 = -1409{,}4\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El calor que pide el aluminio
        pregunta: |
          ¿Cuánto calor hace falta para llevar 10 kg de aluminio de 25 ºC a
          fundido?
        respuesta:
          tipo: numero
          valor: '9647'
          tolerancia: 60
          formato: el calor en kJ
        distractores:
          - valor: '5695'
            mensaje: |
              Eso es solo calentarlo hasta 658 ºC. Falta fundirlo, que a
              temperatura constante son otros 3952 kJ.
          - valor: '3952'
            mensaje: |
              Eso es solo la fusión. El aluminio parte de 25 ºC: antes hay que
              subirlo 633 grados.
        pista: |
          Son dos sumandos y el segundo se olvida: calentar de 25 a 658 ºC con
          el Cp, y después fundir a temperatura constante con la entalpía de
          fusión.
        desarrollo: |
          $$
          n(\mathrm{Al}) = \frac{10\,000}{27} = 370{,}37\ \text{mol}
          $$
          $$
          q_1 = 370{,}37\cdot 24{,}29\cdot (658-25) = 5695\ \text{kJ}
          \qquad
          q_2 = 370{,}37\cdot 10{,}67 = 3952\ \text{kJ}
          $$
          $$
          q = 9647\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La entropía que gana el aluminio
        pregunta: |
          ¿Cuánto aumenta la entropía del aluminio en todo el proceso?
        respuesta:
          tipo: numero
          valor: '14.49'
          tolerancia: 0.2
          formato: la entropía en kJ/K, con dos cifras decimales
        distractores:
          - valor: '10.36'
            mensaje: |
              Has usado $q/T$ para el calentamiento. Ahí la temperatura
              **cambia**, así que hay que integrar: sale
              $nC_p\ln(T_2/T_1)$, no $q/T$.
          - valor: '4.24'
            mensaje: |
              Esa es solo la de la fusión. Falta la del calentamiento, que es
              más del doble.
        pista: |
          Dos términos otra vez, pero **no** son $q_1/T$ y $q_2/T$. En el
          calentamiento la temperatura varía y hay que integrar; en la fusión
          es constante y sí vale dividir.
        desarrollo: |
          $$
          \Delta S_{\text{calentar}} = nC_p\ln\frac{T_2}{T_1}
          = 370{,}37\cdot 24{,}29\cdot \ln\frac{931{,}15}{298{,}15}
          = 10\,245\ \text{J/K}
          $$
          $$
          \Delta S_{\text{fundir}} = \frac{n\,\Delta H_{\text{fus}}}{T_{\text{fus}}}
          = \frac{370{,}37\cdot 10\,670}{931{,}15} = 4244\ \text{J/K}
          $$
          $$
          \Delta S = 14\,489\ \text{J/K} = 14{,}49\ \text{kJ/K}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las energías libres de formación, $\Delta G^{0}=-1331{,}20$ kJ,
              y de ahí $\Delta S^{0}=-306{,}6$ J/K.
          - texto: >-
              Kirchhoff con $\Delta C_p = 93{,}84$ J/(mol·K) lleva la entalpía
              a 100 ºC: $-1415{,}6$ kJ.
          - texto: >-
              Con $\Delta n_{\text{gas}} = -2$, la energía interna es
              $-1409{,}4$ kJ.
          - texto: >-
              $\Delta H<0$ y $\Delta S<0$, así que es espontánea por debajo de
              4641 K — o sea siempre, en la práctica.
          - texto: >-
              Fundir los 10 kg pide 9647 kJ, que son 6,78 mol de eteno.
          - texto: >-
              El aluminio gana 14,49 kJ/K, sumando el calentamiento integrado
              y la fusión a temperatura constante.
          - texto: >-
              Como $\Delta S^{0}$ de la combustión es negativa, la reacción
              solo es espontánea por encima de cierta temperatura.
            trampa: true
            mensaje: |
              Es al revés, y es el error de signo más frecuente del tema.
              $\Delta G = \Delta H - T\Delta S$: con $\Delta S$ **negativa**,
              el término $-T\Delta S$ es **positivo** y crece con la
              temperatura, así que subir T empuja hacia lo no espontáneo.

              La regla, con los cuatro casos: si $\Delta H<0$ y $\Delta S>0$ es
              espontánea siempre; si los dos son positivos, solo en caliente;
              si los dos son negativos —como aquí—, solo en frío; y si
              $\Delta H>0$ y $\Delta S<0$, nunca.
        veredicto: |
          Todo el ejercicio cuelga de una idea: la energía libre relaciona
          entalpía y entropía, y quien sabe despejarla no necesita que la
          tabla le dé la entropía hecha.

    resolucion: |
      **Lo que se pide.** Seis apartados que recorren medio cuatrimestre. Este
      examen no publica lo que vale cada ejercicio, pero es el segundo de
      cinco y el más largo con diferencia.

      ## a) La entropía, que no está en la tabla

      Y esa es la primera decisión del ejercicio: la tabla da **energías
      libres de formación**, no entropías. El camino es la definición:

      $$
      \Delta G^{0} = \left[2(-394{,}36) + 2(-237{,}18)\right] - 68{,}12
      = -1331{,}20\ \text{kJ}
      $$

      El oxígeno no aparece porque su $\Delta G^{0}_f$ es cero: es un elemento
      en su forma más estable. Y ahora se despeja:

      $$
      \Delta G^{0} = \Delta H^{0} - T\Delta S^{0}
      \;\Longrightarrow\;
      \boxed{\;\Delta S^{0} = \frac{-1422{,}6+1331{,}20}{298{,}15}
      = -306{,}6\ \text{J/K}\;}
      $$

      **Que salga negativa tiene sentido físico**, y conviene decirlo en el
      examen: se parte de 4 moles de gas y se llega a 2, y encima el agua sale
      líquida. Menos gas es menos desorden.

      ## b) y c) Subir a 100 ºC

      Kirchhoff, con los Cp y **sus coeficientes**:

      $$
      \Delta C_p = \left[2(37{,}11)+2(75{,}33)\right]
      - \left[42{,}84+3(29{,}40)\right] = 93{,}84\ \text{J/(mol·K)}
      $$
      $$
      \boxed{\;\Delta H(100\ \text{°C}) = -1422{,}6 + 0{,}09384\cdot 75
      = -1415{,}6\ \text{kJ}\;}
      $$

      El 3 del oxígeno es donde más se falla: sin él, $\Delta C_p$ sale 152 y
      la corrección se dispara.

      Para la energía interna, solo cuentan los gases —el agua es líquida—:

      $$
      \Delta n_{\text{gas}} = 2-(1+3) = -2
      \;\Longrightarrow\;
      \boxed{\;\Delta U = -1415{,}6 + 6{,}2 = -1409{,}4\ \text{kJ}\;}
      $$

      Como el sistema se **contrae**, el entorno hace trabajo sobre él, y por
      eso $\Delta U$ queda por encima de $\Delta H$.

      ## d) La espontaneidad

      $\Delta H<0$ y $\Delta S<0$: los dos negativos, que es el caso «solo en
      frío». La temperatura de inversión es

      $$
      T = \frac{\Delta H}{\Delta S} = \frac{-1422{,}6}{-0{,}30656} = 4641\ \text{K}
      $$

      así que **en la práctica es espontánea siempre**: 4641 K está muy por
      encima de cualquier temperatura a la que quede eteno sin descomponer. La
      respuesta completa no es «es espontánea», es «lo es hasta 4641 K, y por
      eso lo es siempre».

      ## e) Los diez kilos de aluminio

      Dos sumandos, y el segundo se olvida:

      $$
      n(\mathrm{Al}) = \frac{10\,000}{27} = 370{,}37\ \text{mol}
      $$
      $$
      q_{\text{calentar}} = 370{,}37\cdot 24{,}29\cdot 633 = 5695\ \text{kJ}
      \qquad
      q_{\text{fundir}} = 370{,}37\cdot 10{,}67 = 3952\ \text{kJ}
      $$
      $$
      q = 9647\ \text{kJ}
      \;\Longrightarrow\;
      n(\mathrm{C_2H_4}) = \frac{9647}{1422{,}6} = 6{,}78\ \text{mol}
      $$

      **Y aquí el enunciado no dice en qué condiciones medir ese volumen.**
      No es un descuido nuestro: la frase «que están a 25 ºC a presión
      atmosférica» describe el aluminio, no el gas. Con la lectura más
      razonable —el mismo 25 ºC y 1 atm—:

      $$
      \boxed{\;V = nRT/P = 6{,}78\cdot 0{,}0821\cdot 298{,}15 = 166\ \text{L}\;}
      $$

      Si el corrector esperaba condiciones normales, 0 ºC y 1 atm, serían
      **152 L**. Conviene escribir en el examen cuál se ha supuesto: un
      supuesto declarado no cuesta puntos, y uno callado sí.

      ## f) La entropía del aluminio

      Dos términos otra vez, y **no** son $q_1/T$ y $q_2/T$. En el
      calentamiento la temperatura cambia, así que hay que integrar:

      $$
      \Delta S_{\text{calentar}} = nC_p\ln\frac{T_2}{T_1}
      = 370{,}37\cdot 24{,}29\cdot \ln\frac{931{,}15}{298{,}15} = 10\,245\ \text{J/K}
      $$

      En la fusión sí es constante, y ahí dividir vale:

      $$
      \Delta S_{\text{fundir}} = \frac{370{,}37\cdot 10\,670}{931{,}15}
      = 4244\ \text{J/K}
      $$
      $$
      \boxed{\;\Delta S = 14{,}49\ \text{kJ/K}\;}
      $$

      El contraste entre los apartados a) y f) es lo mejor del ejercicio: la
      reacción **pierde** 306,6 J/K y el aluminio **gana** 14 489. El universo
      no incumple nada — simplemente el metal se lleva muchísimo más desorden
      del que la combustión ordena.
