ejercicios:
  # ── El primero del final, y es el ejercicio más raro del corpus de Química:
  #    no tiene ni un número, ni un dato, ni una tabla. Solo un ciclo dibujado
  #    y la pregunta de qué signo tiene el trabajo en cada tramo. Se resuelve
  #    entero mirando hacia dónde se mueve el volumen.
  #
  #    La figura del enunciado se ha REDIBUJADO en SVG, que es lo que manda la
  #    regla de derechos: los enunciados se reproducen verbatim, las figuras
  #    se rehacen.
  - id: exfq2425-2c-1-el-ciclo-sin-un-solo-numero
    titulo: Un ciclo sin un solo número, y cuatro signos que salen de mirar
    fuente: >-
      Ejercicio 1 · Examen final del segundo cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · La figura está
      redibujada a partir del enunciado original. El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      Representar gráficamente las variaciones de trabajo e indicar si tienen
      signo positivo o negativo en los siguientes casos; ΔW<sub>AB</sub>,
      ΔW<sub>BC</sub>, ΔW<sub>CD</sub>, ΔW<sub>DA</sub> y ΔW<sub>ABCDA</sub>

      <figure>
      <svg viewBox="0 0 430 290" role="img" width="430" height="290" aria-labelledby="fqpv-t fqpv-d">
