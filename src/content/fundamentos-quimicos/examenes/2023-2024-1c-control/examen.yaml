# El control de mitad de cuatrimestre. Vale un 5 % de la nota final, y aun así
# dura 1.45 h y trae cuatro ejercicios: es el mismo examen que el final, más
# corto de temario. Su cabecera viene en euskera —«kontrola»— y el cuerpo en
# castellano, que es la versión que está entre el material.
#
# Como el final de 2024-2025, publica lo que vale cada ejercicio —3,00 · 1,25 ·
# 2,00 · 3,75— pero no lo reparte por competencia, así que no se declaran.
pdf: 2023-2024-1c-control.pdf

ejercicios:
  - id: exfq2324-1c-control-1-cuatro-elementos-y-una-tabla
    tema: t02-estructura-atomica
  - id: exfq2324-1c-control-2-diez-compuestos-que-nombrar-o-formular
    tema: t01-compuestos-y-estequiometria
  - id: exfq2324-1c-control-3-la-formula-de-la-cocaina
    tema: t01-compuestos-y-estequiometria
  - id: exfq2324-1c-control-4-la-calcopirita-y-la-errata-del-rendimiento
    tema: t01-compuestos-y-estequiometria

# Sin `fuera`: los cuatro ejercicios están. El 2 entró el 5 de septiembre de
# 2026 con el tipo de respuesta `formula`; hasta entonces ningún lector sabía
# comparar una fórmula química y era el único que faltaba.
#
# El 4 trae una errata en el enunciado —330500 kg de FeO a partir
  # de 1 t de mineral, que daría un rendimiento del 93 588 %— y se reproduce
  # tal cual, con la errata explicada en la resolución. Es el mismo criterio
  # que en el tema 6 de Álgebra: aquí los enunciados no se retocan, ni
  # siquiera para arreglarlos.
