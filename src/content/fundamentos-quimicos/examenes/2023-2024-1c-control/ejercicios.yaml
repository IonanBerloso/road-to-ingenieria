ejercicios:
  # ── El análisis elemental clásico, con la vuelta de tuerca de que el
  #    nitrógeno se mide sobre una muestra DISTINTA. Ese detalle es todo el
  #    ejercicio: quien no se da cuenta divide 0,132 entre 5,00 y le sale una
  #    fórmula que no es ninguna sustancia conocida.
  - id: exfq2324-1c-control-3-la-formula-de-la-cocaina
    titulo: Dos análisis, dos muestras distintas, y una fórmula que sale exacta
    fuente: >-
      Ejercicio 3 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Una de las áreas de la Química Aplicada es la identificación de
      estupefacientes. En un registro de aduana fue intervenido un paquete
      conteniendo una sustancia cuyo análisis cualitativo reveló que contenía
      una cierta cantidad de una sustancia pura que estaba formada por C, H, O
      y N. Este hecho y la apariencia de la sustancia, hizo suponer a la
      policía científica que dicha sustancia podría ser cocaína.

      Para identificarla se sometió la muestra a dos análisis cuantitativos.
      En el primero se realizó una combustión completa de 5,00 g de dicho
      compuesto orgánico y se obtiene 12,35 g de CO2, 3,123 g de H2O. En un
      segundo ensayo 2,35 g del compuesto se tratan con ácido sulfúrico y el
      nitrógeno se transforma en amoniaco, obteniéndose 0,132 g de amoniaco.

      Sabiendo que la masa molecular de la cocaína es 303,35 g mol⁻¹ determina
      y su fórmula empírica y su fórmula molecular.

      **Datos:** masas atómicas (u): H = 1.01; C = 12.01; N = 14.01;
      O = 16.00.
    pide: La fórmula empírica y la fórmula molecular del compuesto.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos ensayos se hacen sobre cantidades distintas de muestra:
          5,00 g el de combustión y 2,35 g el del nitrógeno. ¿Qué hay que
          hacer con eso?
        opciones:
          - texto: >-
              Llevar el nitrógeno a la misma base de 5,00 g antes de comparar
              los moles
            correcta: true
            mensaje: |
              Eso es. Una fórmula compara **proporciones dentro de la misma
              muestra**, así que los cuatro elementos tienen que estar
              referidos a la misma cantidad de compuesto.
          - texto: >-
              Nada: los moles de nitrógeno son los que son y se comparan tal
              cual
            mensaje: |
              Entonces estarías comparando el carbono de 5 g con el nitrógeno
              de 2,35 g. Es como medir cuántas ruedas tiene un coche contando
              las ruedas de uno y las puertas de otro más pequeño.
          - texto: >-
              Sumar las dos muestras y trabajar con 7,35 g
            mensaje: |
              No son dos partes de una misma cosa: son dos ensayos
              independientes sobre porciones del mismo compuesto. Sumarlos no
              significa nada.
          - texto: >-
              Repetir el cálculo del carbono y el hidrógeno sobre 2,35 g
            mensaje: |
              Vale igual, y es la misma idea: llevar todo a una base común.
              Pero es más trabajo, porque hay que reescalar dos elementos en
              vez de uno.

      - tipo: calcular
        titulo: El carbono
        pregunta: |
          De los 12,35 g de CO2, ¿cuántos gramos de carbono había en la
          muestra de 5,00 g?
        respuesta:
          tipo: numero
          valor: '3.370'
          tolerancia: 0.02
          formato: la masa de carbono en gramos, con tres cifras decimales
        distractores:
          - valor: '12.35'
            mensaje: |
              Eso es el CO2 entero. Solo la parte del carbono venía de la
              muestra; los dos oxígenos los puso el aire de la combustión.
          - valor: '0.2806'
            mensaje: |
              Esos son los **moles**, no los gramos. Falta multiplicar por la
              masa atómica del carbono.
        pista: |
          Todo el carbono del CO2 venía del compuesto, y cada CO2 lleva un
          carbono. Pasa a moles con $M(\mathrm{CO_2}) = 44{,}01$ y vuelve a
          gramos con $M(\mathrm{C}) = 12{,}01$.
        desarrollo: |
          $$
          n(\mathrm{CO_2}) = \frac{12{,}35}{44{,}01} = 0{,}28062\ \text{mol}
          \;\Longrightarrow\;
          n(\mathrm{C}) = 0{,}28062\ \text{mol}
          $$
          $$
          m(\mathrm{C}) = 0{,}28062\cdot 12{,}01 = 3{,}370\ \text{g}
          $$

      - tipo: calcular
        titulo: El nitrógeno, llevado a la misma base
        pregunta: |
          Los 0,132 g de amoniaco salen de 2,35 g de muestra. ¿Cuántos moles
          de nitrógeno hay en los 5,00 g del otro ensayo?
        respuesta:
          tipo: numero
          valor: '0.01648'
          tolerancia: 0.0004
          formato: los moles de nitrógeno, con cinco cifras decimales
        distractores:
          - valor: '0.00775'
            mensaje: |
              Esos son los moles que hay en 2,35 g. Falta el paso que hace
              este ejercicio distinto: multiplicar por 5,00/2,35 para llevarlo
              a la misma muestra que el carbono y el hidrógeno.
          - valor: '0.0264'
            mensaje: |
              Has puesto los 0,132 g como si fueran nitrógeno puro. Son de
              **amoniaco**: solo 14,01 de sus 17,04 g/mol son nitrógeno.
        pista: |
          Cada NH3 lleva un solo nitrógeno, así que los moles de amoniaco son
          los moles de nitrógeno — de esa muestra. Y después, la regla de tres
          para pasar de 2,35 g a 5,00 g.
        desarrollo: |
          $$
          n(\mathrm{NH_3}) = \frac{0{,}132}{17{,}04} = 0{,}007746\ \text{mol}
          \quad\text{en } 2{,}35\ \text{g}
          $$
          $$
          n(\mathrm{N})_{5{,}00\,\text{g}}
          = 0{,}007746\cdot \frac{5{,}00}{2{,}35} = 0{,}01648\ \text{mol}
          $$

      - tipo: calcular
        titulo: El oxígeno, que no se mide
        pregunta: |
          ¿Cuántos moles de oxígeno hay en los 5,00 g de muestra?
        respuesta:
          tipo: numero
          valor: '0.0655'
          tolerancia: 0.002
          formato: los moles de oxígeno, con cuatro cifras decimales
        distractores:
          - valor: '0.5612'
            mensaje: |
              Ese es el oxígeno del CO2, y no viene de la muestra: lo aporta el
              aire con el que se quema. El oxígeno del compuesto no se puede
              medir directamente en una combustión, y por eso sale por
              diferencia.
          - valor: '0.0625'
            mensaje: |
              Revisa la resta: la masa de oxígeno son los 5,00 g menos el
              carbono, el hidrógeno **y** el nitrógeno. Es fácil dejarse uno
              de los tres.
        pista: |
          El oxígeno es el único que no se determina: se obtiene restando de
          los 5,00 g todo lo demás. El hidrógeno son 0,350 g —dos H por cada
          H2O— y el nitrógeno 0,231 g.
        desarrollo: |
          $$
          n(\mathrm{H}) = 2\cdot\frac{3{,}123}{18{,}02} = 0{,}34661\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{H}) = 0{,}350\ \text{g}
          \qquad
          m(\mathrm{N}) = 0{,}01648\cdot 14{,}01 = 0{,}231\ \text{g}
          $$
          $$
          m(\mathrm{O}) = 5{,}00-3{,}370-0{,}350-0{,}231 = 1{,}049\ \text{g}
          \;\Longrightarrow\;
          n(\mathrm{O}) = \frac{1{,}049}{16{,}00} = 0{,}0655\ \text{mol}
          $$

      - tipo: calcular
        titulo: Cuántos carbonos por nitrógeno
        pregunta: |
          Dividiendo los cuatro por el más pequeño, ¿cuántos átomos de carbono
          hay por cada átomo de nitrógeno?
        respuesta:
          tipo: numero
          valor: '17'
          tolerancia: 0.2
          formato: un número entero
        distractores:
          - valor: '36'
            mensaje: |
              Has dividido entre los moles de nitrógeno de la muestra pequeña,
              sin reescalar. Sale casi el doble, y ninguna fórmula razonable.
          - valor: '4'
            mensaje: |
              Ese es el oxígeno. La proporción sale C 17, H 21, N 1, O 4.
        pista: |
          El más pequeño de los cuatro es el nitrógeno. Divide los otros tres
          entre él y redondea: si el análisis está bien hecho, los cocientes
          salen a menos de una centésima de un entero.
        desarrollo: |
          $$
          \frac{0{,}28062}{0{,}01648} = 17{,}03
          \qquad
          \frac{0{,}34661}{0{,}01648} = 21{,}03
          \qquad
          \frac{0{,}0655}{0{,}01648} = 3{,}98
          $$
          Es decir **C₁₇H₂₁NO₄**, con los cuatro cocientes a menos de tres
          centésimas de un entero: el análisis es bueno.

      - tipo: justificar
        pregunta: Ordena la identificación. Una pieza es falsa.
        piezas:
          - texto: >-
              Del CO2 salen 0,28062 mol de C y del H2O, 0,34661 mol de H, los
              dos referidos a la muestra de 5,00 g.
          - texto: >-
              Del amoniaco salen 0,007746 mol de N en 2,35 g, que reescalados
              a 5,00 g son 0,01648 mol.
          - texto: >-
              El oxígeno no se mide: sale por diferencia, restando de los
              5,00 g el carbono, el hidrógeno y el nitrógeno.
          - texto: >-
              Dividiendo los cuatro entre el nitrógeno queda C₁₇H₂₁NO₄, la
              fórmula empírica.
          - texto: >-
              Su masa es 303,39 g/mol, prácticamente la molecular que da el
              enunciado, así que la molecular es la misma: **C₁₇H₂₁NO₄**.
          - texto: >-
              El oxígeno también se puede obtener del CO2 y del H2O, sumando el
              que llevan los dos productos.
            trampa: true
            mensaje: |
              Ese oxígeno **no viene de la muestra**: lo pone el aire con el
              que se quema. En una combustión el oxígeno es reactivo, así que
              el de los productos es una mezcla del que había en el compuesto
              y del que se ha añadido, y no hay forma de separarlos.

              Por eso el oxígeno de un análisis elemental sale **siempre** por
              diferencia. Es la única de las cuatro masas que no se mide.
        veredicto: |
          Dos ideas sostienen el ejercicio, y las dos son de método: el
          nitrógeno hay que llevarlo a la misma base que el resto, y el
          oxígeno no se mide nunca — se resta.

    resolucion: |
      **Lo que se pide.** Vale 2,00 de los 10 puntos del control. Es el
      análisis elemental de toda la vida con una vuelta de tuerca: los dos
      ensayos se hacen sobre **cantidades distintas de muestra**.

      ## El carbono y el hidrógeno, de la combustión

      Todo el carbono del CO2 y todo el hidrógeno del H2O venían del
      compuesto:

      $$
      n(\mathrm{C}) = \frac{12{,}35}{44{,}01} = 0{,}28062\ \text{mol}
      \qquad
      n(\mathrm{H}) = 2\cdot\frac{3{,}123}{18{,}02} = 0{,}34661\ \text{mol}
      $$

      El factor 2 del hidrógeno se olvida más de lo que parece: cada molécula
      de agua lleva **dos**.

      ## El nitrógeno, y el paso que decide el ejercicio

      El segundo ensayo usa 2,35 g, no 5,00. Cada NH3 lleva un nitrógeno:

      $$
      n(\mathrm{N}) = \frac{0{,}132}{17{,}04} = 0{,}007746\ \text{mol}
      \quad\text{en }2{,}35\ \text{g}
      $$

      Y hay que llevarlo a la misma muestra que los otros dos:

      $$
      n(\mathrm{N})_{5{,}00\,\text{g}} = 0{,}007746\cdot\frac{5{,}00}{2{,}35}
      = 0{,}01648\ \text{mol}
      $$

      **Aquí es donde se pierde el ejercicio entero.** Sin reescalar, la
      proporción sale C 36, H 45, N 1, O 8: una fórmula de masa 600 y pico que
      no es nada. Y lo malo es que los cocientes siguen saliendo casi enteros,
      así que el resultado *parece* correcto.

      ## El oxígeno, por diferencia

      El oxígeno de la combustión no sirve, porque el aire aporta el suyo. Se
      resta:

      $$
      m(\mathrm{O}) = 5{,}00 - 3{,}370 - 0{,}350 - 0{,}231 = 1{,}049\ \text{g}
      \;\Longrightarrow\;
      n(\mathrm{O}) = 0{,}0655\ \text{mol}
      $$

      ## La proporción, y el remate

      Dividiendo entre el más pequeño:

      | | C | H | N | O |
      |---|---|---|---|---|
      | moles | 0,28062 | 0,34661 | 0,01648 | 0,0655 |
      | ÷ 0,01648 | 17,03 | 21,03 | 1,00 | 3,98 |

      $$
      \boxed{\;\text{fórmula empírica: } \mathrm{C_{17}H_{21}NO_4}\;}
      $$

      Su masa molar es

      $$
      17\cdot 12{,}01 + 21\cdot 1{,}01 + 14{,}01 + 4\cdot 16{,}00
      = 303{,}39\ \text{g/mol}
      $$

      y el enunciado da 303,35, así que el cociente es 1,000: la fórmula
      molecular **coincide con la empírica**.

      $$
      \boxed{\;\mathrm{C_{17}H_{21}NO_4}\;}
      $$

      Que es, en efecto, la cocaína. El ejercicio se cierra solo: cuando los
      cuatro cocientes salen a tres centésimas de un entero y la masa cuadra
      al 0,01 %, no hay margen para dudar de la identificación.

  # ── El más largo del control, 3,75 de los 10. Y el que trae una ERRATA:
  #    «330500 kg de óxido de hierro(II) durante la tostación de 1 t de
  #    calcopirita». De una tonelada de mineral no salen 330 toneladas de
  #    óxido; el máximo teórico son 353,1 kg. Se reproduce tal cual (§08) y se
  #    explica en la resolución, que además es la mejor lección del ejercicio:
  #    un rendimiento por encima del 100 % no se ajusta, se investiga.
  - id: exfq2324-1c-control-4-la-calcopirita-y-la-errata-del-rendimiento
    titulo: La calcopirita, y un rendimiento que no puede ser
    fuente: >-
      Ejercicio 4 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El enunciado se
      reproduce tal cual, con su errata en el apartado 4.2 · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      A nivel industrial, se recurre a la tostación (reacción en presencia de
      oxígeno entre 500 °C y 700 °C) de minerales como la calcopirita para la
      producción de cobre. En una primera etapa del proceso, se forma una
      mezcla sólida de óxidos y sulfuros metálicos junto dióxido de azufre
      gaseoso que se separa de dicha mezcla.

      $$
      \mathrm{CuFeS_2} + \mathrm{O_2} \rightarrow
      \text{óxido de hierro(II)} + \text{sulfuro de cobre(II)} +
      \text{dióxido de azufre}
      $$

      **4.1** Escribir la ecuación química ajustada.

      **4.2** Calcular el rendimiento de la reacción química, si se generan
      330500 kg de óxido de hierro(II) durante la tostación de 1 t de
      calcopirita con un volumen de oxígeno de 600 m3 de densidad 0.401 g/L a
      700 °C y 1 atm.

      **4.3** El dióxido de azufre obtenido en la tostación de la calcopirita
      puede emplearse para la producción de ácido sulfúrico mediante el método
      denominado contacto por oxidación. Esta reacción tiene una relación
      estequiométrica entre el dióxido de azufre y el ácido sulfúrico de 1:1.
      Calcular el volumen de disolución de ácido sulfúrico (expresado en L),
      del 97% de riqueza y densidad 1.836 g/mL, que podría obtenerse empleando
      110 m3 de dióxido de azufre (densidad del dióxido de azufre 2.711 g/L a
      15 °C y 1 atm).

      **4.4** La disolución acuosa de ácido sulfúrico se diluye hasta una
      concentración del 7% en masa de sulfúrico y densidad 1.045 g/mL.

      **4.4.1** Calcular la molaridad de esta disolución.

      **4.4.2** Calcular la molalidad de esta disolución.

      **Datos:** la calcopirita es un mineral con un contenido del 90.20 % en
      masa de CuFeS2 · masas atómicas (u): H = 1.01; O = 16.00; S = 32.06;
      Fe = 55.85; Cu = 63.55 · densidad del agua: 0.998 g/mL (20 °C).
    pide: >-
      La ecuación ajustada, el rendimiento de la tostación, el volumen de
      disolución de ácido sulfúrico, y la molaridad y la molalidad de la
      dilución al 7 %.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la calcopirita **y** el oxígeno. Antes de calcular
          ningún rendimiento, ¿qué hay que decidir?
        opciones:
          - texto: >-
              Cuál de los dos es el reactivo limitante, porque es el que fija
              lo que se puede producir
            correcta: true
            mensaje: |
              Eso es. Dar los dos reactivos con cantidad es la señal: el
              enunciado quiere que compruebes cuál se acaba antes. Aquí sale
              la calcopirita, por poco.
          - texto: >-
              Cuál de los dos es más caro, porque el rendimiento se mide sobre
              él
            mensaje: |
              El precio no entra en la estequiometría. Lo que decide es cuál
              se agota primero según la proporción de la ecuación.
          - texto: >-
              Nada: el rendimiento siempre se calcula sobre el mineral
            mensaje: |
              No siempre. Se calcula sobre el limitante, y aquí resulta serlo
              el mineral — pero eso hay que **comprobarlo**, no suponerlo. Con
              50 m³ de oxígeno en vez de 600, el limitante sería el gas.
          - texto: >-
              Pasar el oxígeno a moles con la ecuación de los gases ideales, a
              700 °C
            mensaje: |
              No hace falta y además sobra: el enunciado da la **densidad** del
              oxígeno en esas condiciones, así que la masa sale de multiplicar
              volumen por densidad, sin pasar por $PV=nRT$.

      - tipo: calcular
        titulo: El óxido que cabría esperar
        pregunta: |
          Con la ecuación ajustada
          $2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
          2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}$,
          ¿cuántos kilogramos de FeO saldrían si la reacción fuera completa?
        respuesta:
          tipo: numero
          valor: '353.1'
          tolerancia: 3
          formato: la masa de FeO en kg, con una cifra decimal
        distractores:
          - valor: '391.5'
            mensaje: |
              Has usado la tonelada entera como si fuera CuFeS2. La calcopirita
              es un mineral al **90,20 %**.
          - valor: '360.1'
            mensaje: |
              Has tomado el oxígeno como limitante. Hay 7519 mol disponibles y
              hacen falta 7372: sobra, así que el que manda es el mineral.
        pista: |
          Primero el CuFeS2 que hay de verdad, después comprueba que el
          oxígeno alcanza, y por último la proporción 1:1 con el FeO.
        desarrollo: |
          $$
          n(\mathrm{CuFeS_2}) = \frac{10^{6}\cdot 0{,}9020}{183{,}52}
          = 4915\ \text{mol}
          \qquad
          n(\mathrm{O_2})_{\text{necesario}} = \tfrac{3}{2}\cdot 4915
          = 7372\ \text{mol}
          $$
          $$
          n(\mathrm{O_2})_{\text{disponible}}
          = \frac{600\cdot 10^{3}\cdot 0{,}401}{32{,}00} = 7519\ \text{mol}
          \;\Longrightarrow\; \text{sobra, limita el mineral}
          $$
          $$
          m(\mathrm{FeO}) = 4915\cdot 71{,}85 = 353\,100\ \text{g}
          = 353{,}1\ \text{kg}
          $$

      - tipo: calcular
        titulo: El ácido sulfúrico que se podría sacar
        pregunta: |
          Con 110 m³ de SO2 de densidad 2,711 g/L y relación 1:1, ¿qué volumen
          de disolución de sulfúrico al 97 % se obtiene?
        respuesta:
          tipo: numero
          valor: '256.4'
          tolerancia: 2.5
          formato: el volumen en litros, con una cifra decimal
        distractores:
          - valor: '248.7'
            mensaje: |
              Te has saltado la riqueza. Los 456,6 kg son de ácido **puro**, y
              vienen dentro de 470,7 kg de disolución al 97 %.
          - valor: '162.4'
            mensaje: |
              Has dividido entre la densidad del SO2 en vez de la del ácido.
              La densidad que convierte masa en volumen es la de aquello cuyo
              volumen quieres: 1,836 g/mL.
        pista: |
          La densidad del SO2 está para pasar los 110 m³ a masa y de ahí a
          moles. Después, 1:1, la masa molar del sulfúrico, la riqueza y por
          último la densidad de la disolución.
        desarrollo: |
          $$
          n(\mathrm{SO_2}) = \frac{110\cdot 10^{3}\cdot 2{,}711}{64{,}06}
          = 4655\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{H_2SO_4}) = 4655\cdot 98{,}08 = 456{,}6\ \text{kg}
          $$
          $$
          m_{\text{disolución}} = \frac{456{,}6}{0{,}97} = 470{,}7\ \text{kg}
          \qquad
          V = \frac{470\,700}{1{,}836} = 256\,400\ \text{mL} = 256{,}4\ \text{L}
          $$

      - tipo: calcular
        titulo: La molaridad de la dilución al 7 %
        pregunta: |
          Diluida al 7 % en masa y con densidad 1,045 g/mL, ¿cuál es la
          molaridad?
        respuesta:
          tipo: numero
          valor: '0.746'
          tolerancia: 0.02
          formato: la molaridad en mol/L, con tres cifras decimales
        distractores:
          - valor: '0.714'
            mensaje: |
              Has supuesto que un litro pesa 1000 g. Pesa 1045: la densidad no
              es la del agua, y es justo el dato que el enunciado da para esto.
          - valor: '0.767'
            mensaje: |
              Esa es la **molalidad**, el apartado siguiente. La molaridad va
              por litro de disolución; la molalidad, por kilo de disolvente.
        pista: |
          Trabaja sobre un litro: pesa 1045 g, de los cuales el 7 % es ácido.
        desarrollo: |
          $$
          m_{\text{ácido}} = 0{,}07\cdot 1045 = 73{,}15\ \text{g}
          \;\Longrightarrow\;
          n = \frac{73{,}15}{98{,}08} = 0{,}746\ \text{mol}
          $$
          $$
          M = \frac{0{,}746}{1} = 0{,}746\ \text{mol/L}
          $$

      - tipo: calcular
        titulo: Y su molalidad
        pregunta: ¿Y la molalidad de esa misma disolución?
        respuesta:
          tipo: numero
          valor: '0.767'
          tolerancia: 0.02
          formato: la molalidad en mol/kg, con tres cifras decimales
        distractores:
          - valor: '0.746'
            mensaje: |
              Esa es la molaridad. La molalidad divide entre el **disolvente**,
              que son 971,9 g, no entre el litro entero de disolución.
          - valor: '0.714'
            mensaje: |
              Has usado 1000 g de disolvente. El disolvente son los 1045 g de
              disolución menos los 73,15 de ácido.
        pista: |
          Los moles son los mismos que en el apartado anterior. Lo único que
          cambia es entre qué se dividen: el disolvente, no la disolución.
        desarrollo: |
          $$
          m_{\text{disolvente}} = 1045 - 73{,}15 = 971{,}9\ \text{g}
          = 0{,}9719\ \text{kg}
          $$
          $$
          m = \frac{0{,}746}{0{,}9719} = 0{,}767\ \text{mol/kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Ajustar: $2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
              2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}$.
          - texto: >-
              Comprobar el limitante: hay 7519 mol de O2 y hacen falta 7372,
