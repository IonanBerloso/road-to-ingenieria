ejercicios:
  # ── El primero del control, y el único de los cuatro que no va de
  #    estequiometría. Vale 3,00 de los 10 y es una tabla: la asignatura
  #    pregunta el tema 2 así las dos veces que lo pregunta. Lo difícil no
  #    es ninguna de las cinco columnas por separado, sino que la segunda
  #    —la configuración— hay que escribirla en un orden y leerla en otro.
  - id: exfq2324-1c-control-1-cuatro-elementos-y-una-tabla
    titulo: Cuatro elementos, una tabla y dos cargas efectivas
    fuente: >-
      Ejercicio 1 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      **1.1.** Completa la siguiente tabla (en la misma hoja de examen).

      | Elemento | Configuración electrónica | Periodo | Grupo | Números cuánticos del último electrón |
      |---|---|---|---|---|
      | ₁₁A | | | | |
      | ₂₆B | | | | |
      | ₁₇C | | | | |
      | ₃₅D | | | | |

      \*A, B, C y D no son los símbolos de los elementos.

      **1.2.** Calcula la carga nuclear efectiva para el último electrón
      (diferenciador) de los elementos B y D.

      **1.3.** Entre los elementos B y D cuál tendrá mayor radio atómico?
      Razona tu respuesta.

      **1.4.** Entre los elementos B y D cuál presenta el primer potencial de
      ionización mayor? Y el segundo? Razona tu respuesta.

      **1.5.** Ordena los iones más estables de los siguientes elementos en
      función del radio iónico: potasio (Z = 19), calcio (Z = 20), y selenio
      (Z = 34). Razona tu respuesta.
    pide: >-
      La tabla de los cuatro elementos, las dos cargas efectivas, y el
      razonamiento de radio, potenciales de ionización y radio iónico.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado 1.2 pide la carga efectiva del **último electrón
          (diferenciador)** de B, que tiene $Z = 26$. Con la configuración
          ordenada $\ldots 3d^{6}4s^{2}$, ¿de qué electrón se trata?
        opciones:
          - texto: De uno de los seis electrones $3d$
            correcta: true
            mensaje: |
              Eso es. El diferenciador es el último que **entra** al llenar, y
              en el orden de Moeller el $4s$ se llena antes que el $3d$: los
              dos $4s$ ya estaban puestos y el que cierra el hierro es el
              sexto $3d$.
          - texto: De uno de los dos electrones $4s$
            mensaje: |
              Ese es el electrón **más externo**, que no es lo mismo. La
              distinción parece una sutileza y cambia el resultado por más de
              dos unidades, porque un electrón $d$ y uno $s$ no se apantallan
              con las mismas reglas.
          - texto: Del último electrón escrito en la configuración ordenada
            mensaje: |
              Cuidado con leer el orden energético como si fuera el de
              llenado. En la configuración ordenada el $4s^{2}$ va escrito el
              último porque tiene el $n$ más alto, pero se llenó **antes** que
              el $3d$.
          - texto: Del que tenga el número cuántico $m_\ell$ más alto
            mensaje: |
              $m_\ell$ solo dice la orientación del orbital dentro de su
              subcapa; no ordena electrones entre subcapas distintas. Quien
              decide cuál es el diferenciador es el orden de llenado.

      - tipo: calcular
        titulo: La carga efectiva del elemento B
        pregunta: |
          Aplicando las reglas de Slater al electrón $3d$ del elemento B,
          ¿cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '6.25'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '7.45'
            mensaje: |
              Has usado la tabla de los electrones $s$ y $p$, con su escalón
              de $0{,}85$ para la capa $n-1$. Para un electrón $d$ no hay tal
              escalón: **todo lo que queda a su izquierda apantalla con
              $1{,}00$**.
          - valor: '5.55'
            mensaje: |
              Has contado los dos electrones $4s$. Están en un grupo situado a
              la **derecha** del $3d$, y los de la derecha no apantallan nada.
          - valor: '5.90'
            mensaje: |
              Te has contado a ti mismo entre los compañeros de grupo. Son
              seis electrones $3d$, así que el que miramos tiene cinco
              compañeros, no seis.
        pista: |
          Agrupa como $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(3d^{6})(4s^{2})$ y
          recuerda que para un electrón $d$ solo hay dos pesos en juego.
        desarrollo: |
          Cinco compañeros en el grupo $3d$ y dieciocho electrones a la
          izquierda, todos con peso $1{,}00$:

          $$
          S = 5 \times 0{,}35 + 18 \times 1{,}00 = 19{,}75
          $$

          $$
          Z_{\text{ef}} = 26 - 19{,}75 = 6{,}25
          $$

      - tipo: calcular
        titulo: La carga efectiva del elemento D
        pregunta: |
          El elemento D tiene $Z = 35$ y su último electrón está en el grupo
          $(4s4p)$. ¿Cuánto vale ahora $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '7.60'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '6.10'
            mensaje: |
              Has mandado los diez electrones $3d$ al saco de $1{,}00$. Están
              en la capa $n-1$ igual que el $3s$ y el $3p$, así que apantallan
              con $0{,}85$. Son dieciocho electrones en esa capa, no ocho.
          - valor: '7.25'
            mensaje: |
              Otra vez el electrón contándose a sí mismo. En $(4s^{2}4p^{5})$
              hay siete electrones, y el que miramos tiene seis compañeros.
          - valor: '9.35'
            mensaje: |
              Parece que has dejado fuera los cuatro compañeros del $4s$ y
              solo has contado los del $4p$. El grupo de Slater junta el $ns$
              y el $np$ en uno solo.
        pista: |
          Seis compañeros en el grupo, dieciocho electrones en la capa 3 y
          diez más adentro.
        desarrollo: |
          $$
          S = 6 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 27{,}40
          $$

          $$
          Z_{\text{ef}} = 35 - 27{,}40 = 7{,}60
          $$

      - tipo: reconocer
        pregunta: |
          Apartado 1.3. Los dos elementos están en el mismo periodo. ¿Cuál
          tiene mayor radio atómico, y por qué?
        opciones:
          - texto: B, porque siente una carga efectiva menor que D
            correcta: true
            mensaje: |
              Correcto, y fíjate en que el razonamiento sale de la cuenta que
              acabas de hacer, no de mirar la tabla periódica. Con el mismo
              $n$, quien tira menos de sus electrones los tiene más lejos.
          - texto: D, porque tiene más protones
            mensaje: |
              Más protones aprietan más, no menos. El bromo tiene nueve
              protones más que el hierro y también una carga efectiva mayor,
              así que su nube está **más** contraída, no menos.
          - texto: D, porque está más a la derecha y el radio crece hacia la derecha
            mensaje: |
              La flecha va al revés. Dentro de un periodo el radio **baja** de
              izquierda a derecha, porque $n$ no cambia y $Z_{\text{ef}}$
              sube.
          - texto: No se puede decidir sin conocer el número de capas
            mensaje: |
              Sí se puede, y de hecho el número de capas ya lo sabes: los dos
              son del periodo 4. Justo por eso la comparación la decide
              $Z_{\text{ef}}$ y nada más.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 1.5. Una pieza es falsa.
        piezas:
          - texto: 'Los iones más estables son K⁺ (18 electrones), Ca²⁺ (18 electrones) y Se²⁻ (36 electrones).'
          - texto: K⁺ y Ca²⁺ forman una serie isoelectrónica, así que entre ellos solo decide la carga nuclear.
          - texto: Con los mismos 18 electrones, el calcio tiene un protón más y los sujeta más cerca, así que Ca²⁺ es menor que K⁺.
          - texto: 'Se²⁻ tiene una capa más y además dos electrones de exceso que se repelen: es con diferencia el mayor.'
          - texto: 'El orden creciente de radio iónico es Ca²⁺ < K⁺ < Se²⁻.'
          - texto: Como el selenio tiene menos protones que el calcio en su ion, Se²⁻ es el mayor de los tres.
            trampa: true
            mensaje: |
              La conclusión es correcta pero la razón es falsa dos veces. El
              selenio tiene 34 protones y el calcio 20, así que tiene
              **más**, no menos. Y comparar cargas nucleares solo decide
              dentro de una serie isoelectrónica; Se²⁻ no está en la misma que
              los otros dos, y lo que lo hace grande es tener una capa más.
    resolucion: |
      **1.1 · La tabla.** Los cuatro salen de escribir la configuración y
      leerla en el orden energético.

      | | configuración ordenada | periodo | grupo | último electrón |
      |---|---|---|---|---|
      | ₁₁A | $1s^{2}2s^{2}2p^{6}3s^{1}$ | 3 | 1A | $(3,\,0,\,0,\,+1/2)$ |
      | ₂₆B | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{6}4s^{2}$ | 4 | 8B | $(3,\,2,\,-2,\,-1/2)$ |
      | ₁₇C | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{5}$ | 3 | 7A | $(3,\,1,\,0,\,-1/2)$ |
      | ₃₅D | $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}3d^{10}4s^{2}4p^{5}$ | 4 | 7A | $(4,\,1,\,0,\,-1/2)$ |

      Los elementos son sodio, hierro, cloro y bromo, aunque el examen no los
      pide por su nombre.

      Sobre la última columna conviene decir de dónde salen los signos,
      porque es donde se pierden puntos sin saber por qué. Se llena cada
      subcapa empezando por $m_\ell = -\ell$ y colocando primero un electrón
      en cada orbital con $m_s = +1/2$ —la regla de Hund— y solo después
      apareando. En el $3p^{5}$ del cloro eso deja el quinto electrón
      apareado en $m_\ell = 0$; en el $3d^{6}$ del hierro, el sexto apareado
      en $m_\ell = -2$. **Es un convenio de escritura**, no una propiedad
      medible del átomo, pero es el que la asignatura usa y hay que seguirlo
      para que la casilla coincida.

      **1.2 · Las dos cargas efectivas.** Cambian de tabla porque uno es un
      electrón $d$ y el otro un $p$.

      Para B, el diferenciador es un $3d$. Los dos $4s$ quedan a su derecha y
      no cuentan; todo lo de la izquierda apantalla entero:

      $$
      S = 5 \times 0{,}35 + 18 \times 1{,}00 = 19{,}75 \quad\Longrightarrow\quad Z_{\text{ef}} = 26 - 19{,}75 = 6{,}25
      $$

      Para D, el último electrón está en $(4s^{2}4p^{5})$, y aquí sí hay
      escalón de $0{,}85$ para toda la capa 3, los diez $3d$ incluidos:

      $$
      S = 6 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 27{,}40 \quad\Longrightarrow\quad Z_{\text{ef}} = 35 - 27{,}40 = 7{,}60
      $$

      **1.3 · El radio atómico.** Los dos están en el periodo 4, así que $n$
      no distingue nada y decide $Z_{\text{ef}}$: el hierro siente $6{,}25$ y
      el bromo $7{,}60$. Más carga efectiva es una nube más apretada, luego
      **B tiene el radio mayor**.

      **1.4 · Los dos potenciales de ionización.** El primero es mayor en
      **D**, por lo mismo de antes: cuesta más arrancar un electrón al que
      está más sujeto.

      El segundo también es mayor en D, y esa es la parte que hay que razonar
      y no solo afirmar. Al hierro, después de perder el primero, le queda un
      $4s^{1}$ suelto y encima aún fuera del núcleo de gas noble: sacarlo es
      barato, y deja un Fe²⁺ con la subcapa $3d^{6}$ intacta. Al bromo le
      queda un $4s^{2}4p^{4}$, y el siguiente electrón hay que sacarlo de una
      subcapa $p$ de un átomo muy electronegativo que ya está cargado
      positivamente. **En los dos casos gana D.**

      La forma de equivocarse aquí es dar por hecho que la segunda pregunta
      tiene que responderse al revés que la primera solo porque el enunciado
      la separa con un «¿Y el segundo?». A veces sí cambia —cuando uno de los
      dos alcanza configuración de gas noble al perder el primero— y aquí no
      es el caso.

      **1.5 · Los radios iónicos.** Los iones estables son K⁺, Ca²⁺ y Se²⁻.
      Los dos primeros son isoelectrónicos con el argón, 18 electrones cada
      uno, así que entre ellos manda la carga nuclear y el calcio, con un
      protón más, los sujeta más cerca. El seleniuro está en otra categoría:
      36 electrones y una capa más.

      $$
      \text{Ca}^{2+} < \text{K}^{+} < \text{Se}^{2-}
      $$

      Escribir solo los tres símbolos ordenados vale poco: el enunciado pide
      razonarlo, y el razonamiento son dos comparaciones distintas —una
      dentro de la serie isoelectrónica y otra fuera de ella—, no una sola
      regla aplicada tres veces.

  # ── El de formular, que estuvo en `fuera` desde que se abrió la asignatura
  #    porque ningún tipo de respuesta sabía leer una fórmula química. Entra
  #    con el tipo `formula`, escrito el 5 de septiembre de 2026 cuando ya lo
  #    pedían dos ejercicios y no uno.
  - id: exfq2324-1c-control-2-diez-compuestos-que-nombrar-o-formular
    titulo: Diez compuestos, cinco en cada dirección
    fuente: >-
      Ejercicio 2 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Nombra o formula los siguientes compuestos. (en la misma hoja de examen).

      | fórmula | nombre |
      |---|---|
      | Cu(OH) | Acido bromico |
      | H2SO3 | Peróxido de zinc |
      | PCl5 | Seleniuro cálcico |
      | Fe2O3 | Sulfato potásico |
      | HBr | Nitrato de bario |
    pide: El nombre de los cinco de la izquierda y la fórmula de los cinco de la derecha.

    pasos:
      - tipo: reconocer
        pregunta: |
          El primero de la lista está escrito **Cu(OH)**, sin subíndice. ¿Qué
          hay que hacer con eso?
        opciones:
          - texto: Nombrarlo como hidróxido de cobre(I), que es lo que dice la fórmula tal cual
            correcta: true
            mensaje: |
              Eso es. Un solo grupo hidroxilo obliga a que el cobre actúe con
              valencia 1, así que es el hidróxido de cobre(I) o hidróxido
              cuproso. Los paréntesis sin subíndice son redundantes pero no
              cambian nada.
          - texto: Corregirlo a Cu(OH)₂, que es el hidróxido de cobre más común
            mensaje: |
              El enunciado es el que hay y no se corrige. Y aquí ni siquiera
              hace falta suponer una errata: Cu(OH) es un compuesto
              perfectamente formulable, con el cobre en su valencia 1.
          - texto: Dejarlo en blanco, porque la fórmula está mal escrita
            mensaje: |
              No está mal escrita. Los paréntesis alrededor de un grupo que
              aparece una sola vez sobran, pero no la invalidan: se lee igual
              que CuOH.
          - texto: Nombrarlo como óxido de cobre hidratado
            mensaje: |
              Un hidróxido no es un óxido hidratado: lleva el grupo OH⁻
              enlazado al metal. Los óxidos hidratados se nombran de otra
              forma y no es este caso.

      - tipo: calcular
        titulo: El sulfato potásico
        pregunta: |
          Escribe la fórmula del sulfato potásico.
        respuesta:
          tipo: formula
          valor: K2SO4
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: KSO4
            mensaje: |
              Falta el subíndice del potasio. El ion sulfato tiene carga 2− y
              el potasio solo 1+, así que hacen falta **dos** potasios para
              neutralizarlo.
          - valor: K2SO3
            mensaje: |
              Eso es el sulfito potásico. El sufijo **-ato** corresponde al
              oxoanión con más oxígenos, SO₄²⁻; el **-ito** al de menos,
              SO₃²⁻.
          - valor: K(SO4)2
            mensaje: |
              Tienes los subíndices intercambiados. El de cada ion es la carga
              **del otro**, así que el 2 del sulfato va al potasio y el 1 del
              potasio va al sulfato.
        pista: |
          El ion sulfato es SO₄²⁻ y el potasio forma K⁺. Iguala las cargas.
        desarrollo: |
          El potasio es alcalino y solo actúa con valencia 1; el sulfato tiene
          carga 2−. Para que el compuesto sea neutro hacen falta dos potasios:

          $$
          2 \times (+1) + (-2) = 0 \quad\Longrightarrow\quad \mathrm{K_2SO_4}
          $$

      - tipo: calcular
        titulo: El nitrato de bario
        pregunta: |
          Escribe la fórmula del nitrato de bario.
        respuesta:
          tipo: formula
          valor: Ba(NO3)2
          formato: la fórmula, con paréntesis si hacen falta
        distractores:
          - valor: BaNO3
            mensaje: |
              Falta el segundo nitrato. El bario es alcalinotérreo y forma
              Ba²⁺, así que necesita **dos** nitratos, cada uno con carga 1−.
          - valor: Ba2NO3
            mensaje: |
              Tienes el subíndice en el ion equivocado. El 2 va al **nitrato**,
              porque es la carga del bario la que dice cuántos nitratos hacen
              falta.
          - valor: BaNO2
            mensaje: |
              Eso sería nitrito, no nitrato, y además sin ajustar las cargas.
              El nitrato es NO₃⁻.
        pista: |
          El nitrato es NO₃⁻ y el bario forma Ba²⁺. Cuando hace falta más de
          un ion poliatómico, va entre paréntesis.
        desarrollo: |
          $$
          \mathrm{Ba^{2+}} + 2\,\mathrm{NO_3^-} \;\longrightarrow\; \mathrm{Ba(NO_3)_2}
          $$

          Los paréntesis son obligatorios: sin ellos, `BaNO32` se leería como
          treinta y dos oxígenos.

      - tipo: justificar
        pregunta: Ordena el criterio que resuelve la lista entera. Una pieza es falsa.
        piezas:
          - texto: 'Primero se identifica el tipo de compuesto: hidróxido, oxoácido, sal binaria, óxido o sal de oxoácido.'
          - texto: 'Después se buscan las cargas de los dos iones, que salen del grupo de la tabla periódica o del sufijo del oxoanión.'
          - texto: 'El subíndice de cada ion es la carga del otro, y al final se simplifica si los dos tienen factor común.'
          - texto: 'Los sufijos -oso y -ico, o los números romanos entre paréntesis, dicen con qué valencia actúa el metal cuando tiene varias.'
          - texto: 'El subíndice de cada elemento es su propia valencia, escrita tal cual debajo de su símbolo.'
            trampa: true
            mensaje: |
              Es justo al revés y por eso se falla tanto: el subíndice de un
              ion es la carga **del otro**. En el Fe₂O₃ el 2 del hierro viene
              de que el oxígeno tiene carga 2−, y el 3 del oxígeno de que el
              hierro actúa con 3+. Si cada uno llevara la suya, el óxido de
              hierro(III) sería Fe₃O₂.
    resolucion: |
      **Las diez respuestas.**

      | fórmula | nombre |
      |---|---|
      | Cu(OH) | hidróxido de cobre(I) · hidróxido cuproso |
      | H₂SO₃ | ácido sulfuroso |
      | PCl₅ | pentacloruro de fósforo · cloruro de fósforo(V) |
      | Fe₂O₃ | óxido de hierro(III) · óxido férrico |
      | HBr | bromuro de hidrógeno · ácido bromhídrico en disolución |
      | HBrO₃ | ácido brómico |
      | ZnO₂ | peróxido de zinc |
      | CaSe | seleniuro cálcico · seleniuro de calcio |
      | K₂SO₄ | sulfato potásico · sulfato de potasio |
      | Ba(NO₃)₂ | nitrato de bario |

      **El método, que es siempre el mismo.** Identificar el tipo de compuesto,
      sacar las cargas de los dos iones, y cruzarlas: **el subíndice de cada
      uno es la carga del otro**, simplificando al final si hay factor común.
      Ese cruce es de donde salen todos los subíndices de la tabla de arriba.

      **Los tres sitios donde se pierden puntos en este ejercicio.**

      El primero son los **peróxidos**. El peróxido de zinc es ZnO₂ y no ZnO
      porque el grupo peroxo es O₂²⁻ entero, con los dos oxígenos unidos entre
      sí: el oxígeno actúa ahí con −1, no con −2. Escribir ZnO da el óxido, que
      es otro compuesto.

      El segundo es la pareja **-ato / -ito**. Los dos oxoaniones tienen la
      misma carga y se diferencian solo en un oxígeno: sulfato SO₄²⁻ frente a
      sulfito SO₃²⁻, nitrato NO₃⁻ frente a nitrito NO₂⁻. El sufijo del nombre
      es el único sitio donde está esa información.

      El tercero es el **ácido bromhídrico**. El HBr es bromuro de hidrógeno
      cuando es gas y ácido bromhídrico cuando está en disolución acuosa. No
      confundirlo con el **ácido brómico**, HBrO₃, que es un oxoácido y lleva
      oxígenos: los nombres se parecen y los compuestos no.

  # ── El análisis elemental clásico, con la vuelta de tuerca de que el
  #    nitrógeno se mide sobre una muestra DISTINTA. Ese detalle es todo el
  #    ejercicio: quien no se da cuenta divide 0,132 entre 5,00 y le sale una
  #    fórmula que no es ninguna sustancia conocida.
  - id: exfq2324-1c-control-3-la-formula-de-la-cocaina
    titulo: Dos análisis, dos muestras distintas, y una fórmula que sale exacta
    fuente: >-
      Ejercicio 3 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Una de las áreas de la Química Aplicada es la identificación de
      estupefacientes. En un registro de aduana fue intervenido un paquete
      conteniendo una sustancia cuyo análisis cualitativo reveló que contenía
      una cierta cantidad de una sustancia pura que estaba formada por C, H, O
      y N. Este hecho y la apariencia de la sustancia, hizo suponer a la
      policía científica que dicha sustancia podría ser cocaína.

      Para identificarla se sometió la muestra a dos análisis cuantitativos.
      En el primero se realizó una combustión completa de 5,00 g de dicho
      compuesto orgánico y se obtiene 12,35 g de CO2, 3,123 g de H2O. En un
      segundo ensayo 2,35 g del compuesto se tratan con ácido sulfúrico y el
      nitrógeno se transforma en amoniaco, obteniéndose 0,132 g de amoniaco.

      Sabiendo que la masa molecular de la cocaína es 303,35 g mol⁻¹ determina
      y su fórmula empírica y su fórmula molecular.

      **Datos:** masas atómicas (u): H = 1.01; C = 12.01; N = 14.01;
      O = 16.00.
    pide: La fórmula empírica y la fórmula molecular del compuesto.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos ensayos se hacen sobre cantidades distintas de muestra:
          5,00 g el de combustión y 2,35 g el del nitrógeno. ¿Qué hay que
          hacer con eso?
        opciones:
          - texto: >-
              Llevar el nitrógeno a la misma base de 5,00 g antes de comparar
              los moles
            correcta: true
            mensaje: |
              Eso es. Una fórmula compara **proporciones dentro de la misma
              muestra**, así que los cuatro elementos tienen que estar
              referidos a la misma cantidad de compuesto.
          - texto: >-
              Nada: los moles de nitrógeno son los que son y se comparan tal
              cual
            mensaje: |
              Entonces estarías comparando el carbono de 5 g con el nitrógeno
              de 2,35 g. Es como medir cuántas ruedas tiene un coche contando
              las ruedas de uno y las puertas de otro más pequeño.
          - texto: >-
              Sumar las dos muestras y trabajar con 7,35 g
            mensaje: |
              No son dos partes de una misma cosa: son dos ensayos
              independientes sobre porciones del mismo compuesto. Sumarlos no
              significa nada.
          - texto: >-
              Repetir el cálculo del carbono y el hidrógeno sobre 2,35 g
            mensaje: |
              Vale igual, y es la misma idea: llevar todo a una base común.
              Pero es más trabajo, porque hay que reescalar dos elementos en
              vez de uno.

      - tipo: calcular
        titulo: El carbono
        pregunta: |
          De los 12,35 g de CO2, ¿cuántos gramos de carbono había en la
          muestra de 5,00 g?
        respuesta:
          tipo: numero
          valor: '3.370'
          tolerancia: 0.02
          formato: la masa de carbono en gramos, con tres cifras decimales
        distractores:
          - valor: '12.35'
            mensaje: |
              Eso es el CO2 entero. Solo la parte del carbono venía de la
              muestra; los dos oxígenos los puso el aire de la combustión.
          - valor: '0.2806'
            mensaje: |
              Esos son los **moles**, no los gramos. Falta multiplicar por la
              masa atómica del carbono.
        pista: |
          Todo el carbono del CO2 venía del compuesto, y cada CO2 lleva un
          carbono. Pasa a moles con $M(\mathrm{CO_2}) = 44{,}01$ y vuelve a
          gramos con $M(\mathrm{C}) = 12{,}01$.
        desarrollo: |
          $$
          n(\mathrm{CO_2}) = \frac{12{,}35}{44{,}01} = 0{,}28062\ \text{mol}
          \;\Longrightarrow\;
          n(\mathrm{C}) = 0{,}28062\ \text{mol}
          $$
          $$
          m(\mathrm{C}) = 0{,}28062\cdot 12{,}01 = 3{,}370\ \text{g}
          $$

      - tipo: calcular
        titulo: El nitrógeno, llevado a la misma base
        pregunta: |
          Los 0,132 g de amoniaco salen de 2,35 g de muestra. ¿Cuántos moles
          de nitrógeno hay en los 5,00 g del otro ensayo?
        respuesta:
          tipo: numero
          valor: '0.01648'
          tolerancia: 0.0004
          formato: los moles de nitrógeno, con cinco cifras decimales
        distractores:
          - valor: '0.00775'
            mensaje: |
              Esos son los moles que hay en 2,35 g. Falta el paso que hace
              este ejercicio distinto: multiplicar por 5,00/2,35 para llevarlo
              a la misma muestra que el carbono y el hidrógeno.
          - valor: '0.0264'
            mensaje: |
              Has puesto los 0,132 g como si fueran nitrógeno puro. Son de
              **amoniaco**: solo 14,01 de sus 17,04 g/mol son nitrógeno.
        pista: |
          Cada NH3 lleva un solo nitrógeno, así que los moles de amoniaco son
          los moles de nitrógeno — de esa muestra. Y después, la regla de tres
          para pasar de 2,35 g a 5,00 g.
        desarrollo: |
          $$
          n(\mathrm{NH_3}) = \frac{0{,}132}{17{,}04} = 0{,}007746\ \text{mol}
          \quad\text{en } 2{,}35\ \text{g}
          $$
          $$
          n(\mathrm{N})_{5{,}00\,\text{g}}
          = 0{,}007746\cdot \frac{5{,}00}{2{,}35} = 0{,}01648\ \text{mol}
          $$

      - tipo: calcular
        titulo: El oxígeno, que no se mide
        pregunta: |
          ¿Cuántos moles de oxígeno hay en los 5,00 g de muestra?
        respuesta:
          tipo: numero
          valor: '0.0655'
          tolerancia: 0.002
          formato: los moles de oxígeno, con cuatro cifras decimales
        distractores:
          - valor: '0.5612'
            mensaje: |
              Ese es el oxígeno del CO2, y no viene de la muestra: lo aporta el
              aire con el que se quema. El oxígeno del compuesto no se puede
              medir directamente en una combustión, y por eso sale por
              diferencia.
          - valor: '0.0625'
            mensaje: |
              Revisa la resta: la masa de oxígeno son los 5,00 g menos el
              carbono, el hidrógeno **y** el nitrógeno. Es fácil dejarse uno
              de los tres.
        pista: |
          El oxígeno es el único que no se determina: se obtiene restando de
          los 5,00 g todo lo demás. El hidrógeno son 0,350 g —dos H por cada
          H2O— y el nitrógeno 0,231 g.
        desarrollo: |
          $$
          n(\mathrm{H}) = 2\cdot\frac{3{,}123}{18{,}02} = 0{,}34661\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{H}) = 0{,}350\ \text{g}
          \qquad
          m(\mathrm{N}) = 0{,}01648\cdot 14{,}01 = 0{,}231\ \text{g}
          $$
          $$
          m(\mathrm{O}) = 5{,}00-3{,}370-0{,}350-0{,}231 = 1{,}049\ \text{g}
          \;\Longrightarrow\;
          n(\mathrm{O}) = \frac{1{,}049}{16{,}00} = 0{,}0655\ \text{mol}
          $$

      - tipo: calcular
        titulo: Cuántos carbonos por nitrógeno
        pregunta: |
          Dividiendo los cuatro por el más pequeño, ¿cuántos átomos de carbono
          hay por cada átomo de nitrógeno?
        respuesta:
          tipo: numero
          valor: '17'
          tolerancia: 0.2
          formato: un número entero
        distractores:
          - valor: '36'
            mensaje: |
              Has dividido entre los moles de nitrógeno de la muestra pequeña,
              sin reescalar. Sale casi el doble, y ninguna fórmula razonable.
          - valor: '4'
            mensaje: |
              Ese es el oxígeno. La proporción sale C 17, H 21, N 1, O 4.
        pista: |
          El más pequeño de los cuatro es el nitrógeno. Divide los otros tres
          entre él y redondea: si el análisis está bien hecho, los cocientes
          salen a menos de una centésima de un entero.
        desarrollo: |
          $$
          \frac{0{,}28062}{0{,}01648} = 17{,}03
          \qquad
          \frac{0{,}34661}{0{,}01648} = 21{,}03
          \qquad
          \frac{0{,}0655}{0{,}01648} = 3{,}98
          $$
          Es decir **C₁₇H₂₁NO₄**, con los cuatro cocientes a menos de tres
          centésimas de un entero: el análisis es bueno.

      - tipo: justificar
        pregunta: Ordena la identificación. Una pieza es falsa.
        piezas:
          - texto: >-
              Del CO2 salen 0,28062 mol de C y del H2O, 0,34661 mol de H, los
              dos referidos a la muestra de 5,00 g.
          - texto: >-
              Del amoniaco salen 0,007746 mol de N en 2,35 g, que reescalados
              a 5,00 g son 0,01648 mol.
          - texto: >-
              El oxígeno no se mide: sale por diferencia, restando de los
              5,00 g el carbono, el hidrógeno y el nitrógeno.
          - texto: >-
              Dividiendo los cuatro entre el nitrógeno queda C₁₇H₂₁NO₄, la
              fórmula empírica.
          - texto: >-
              Su masa es 303,39 g/mol, prácticamente la molecular que da el
              enunciado, así que la molecular es la misma: **C₁₇H₂₁NO₄**.
          - texto: >-
              El oxígeno también se puede obtener del CO2 y del H2O, sumando el
              que llevan los dos productos.
            trampa: true
            mensaje: |
              Ese oxígeno **no viene de la muestra**: lo pone el aire con el
              que se quema. En una combustión el oxígeno es reactivo, así que
              el de los productos es una mezcla del que había en el compuesto
              y del que se ha añadido, y no hay forma de separarlos.

              Por eso el oxígeno de un análisis elemental sale **siempre** por
              diferencia. Es la única de las cuatro masas que no se mide.
        veredicto: |
          Dos ideas sostienen el ejercicio, y las dos son de método: el
          nitrógeno hay que llevarlo a la misma base que el resto, y el
          oxígeno no se mide nunca — se resta.

    resolucion: |
      **Lo que se pide.** Vale 2,00 de los 10 puntos del control. Es el
      análisis elemental de toda la vida con una vuelta de tuerca: los dos
      ensayos se hacen sobre **cantidades distintas de muestra**.

      ## El carbono y el hidrógeno, de la combustión

      Todo el carbono del CO2 y todo el hidrógeno del H2O venían del
      compuesto:

      $$
      n(\mathrm{C}) = \frac{12{,}35}{44{,}01} = 0{,}28062\ \text{mol}
      \qquad
      n(\mathrm{H}) = 2\cdot\frac{3{,}123}{18{,}02} = 0{,}34661\ \text{mol}
      $$

      El factor 2 del hidrógeno se olvida más de lo que parece: cada molécula
      de agua lleva **dos**.

      ## El nitrógeno, y el paso que decide el ejercicio

      El segundo ensayo usa 2,35 g, no 5,00. Cada NH3 lleva un nitrógeno:

      $$
      n(\mathrm{N}) = \frac{0{,}132}{17{,}04} = 0{,}007746\ \text{mol}
      \quad\text{en }2{,}35\ \text{g}
      $$

      Y hay que llevarlo a la misma muestra que los otros dos:

      $$
      n(\mathrm{N})_{5{,}00\,\text{g}} = 0{,}007746\cdot\frac{5{,}00}{2{,}35}
      = 0{,}01648\ \text{mol}
      $$

      **Aquí es donde se pierde el ejercicio entero.** Sin reescalar, la
      proporción sale C 36, H 45, N 1, O 8: una fórmula de masa 600 y pico que
      no es nada. Y lo malo es que los cocientes siguen saliendo casi enteros,
      así que el resultado *parece* correcto.

      ## El oxígeno, por diferencia

      El oxígeno de la combustión no sirve, porque el aire aporta el suyo. Se
      resta:

      $$
      m(\mathrm{O}) = 5{,}00 - 3{,}370 - 0{,}350 - 0{,}231 = 1{,}049\ \text{g}
      \;\Longrightarrow\;
      n(\mathrm{O}) = 0{,}0655\ \text{mol}
      $$

      ## La proporción, y el remate

      Dividiendo entre el más pequeño:

      | | C | H | N | O |
      |---|---|---|---|---|
      | moles | 0,28062 | 0,34661 | 0,01648 | 0,0655 |
      | ÷ 0,01648 | 17,03 | 21,03 | 1,00 | 3,98 |

      $$
      \boxed{\;\text{fórmula empírica: } \mathrm{C_{17}H_{21}NO_4}\;}
      $$

      Su masa molar es

      $$
      17\cdot 12{,}01 + 21\cdot 1{,}01 + 14{,}01 + 4\cdot 16{,}00
      = 303{,}39\ \text{g/mol}
      $$

      y el enunciado da 303,35, así que el cociente es 1,000: la fórmula
      molecular **coincide con la empírica**.

      $$
      \boxed{\;\mathrm{C_{17}H_{21}NO_4}\;}
      $$

      Que es, en efecto, la cocaína. El ejercicio se cierra solo: cuando los
      cuatro cocientes salen a tres centésimas de un entero y la masa cuadra
      al 0,01 %, no hay margen para dudar de la identificación.

  # ── El más largo del control, 3,75 de los 10. Y el que trae una ERRATA:
  #    «330500 kg de óxido de hierro(II) durante la tostación de 1 t de
  #    calcopirita». De una tonelada de mineral no salen 330 toneladas de
  #    óxido; el máximo teórico son 353,1 kg. Se reproduce tal cual (§08) y se
  #    explica en la resolución, que además es la mejor lección del ejercicio:
  #    un rendimiento por encima del 100 % no se ajusta, se investiga.
  - id: exfq2324-1c-control-4-la-calcopirita-y-la-errata-del-rendimiento
    titulo: La calcopirita, y un rendimiento que no puede ser
    fuente: >-
      Ejercicio 4 · Control del primer cuatrimestre, curso 2023-2024 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El enunciado se
      reproduce tal cual, con su errata en el apartado 4.2 · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      A nivel industrial, se recurre a la tostación (reacción en presencia de
      oxígeno entre 500 °C y 700 °C) de minerales como la calcopirita para la
      producción de cobre. En una primera etapa del proceso, se forma una
      mezcla sólida de óxidos y sulfuros metálicos junto dióxido de azufre
      gaseoso que se separa de dicha mezcla.

      $$
      \mathrm{CuFeS_2} + \mathrm{O_2} \rightarrow
      \text{óxido de hierro(II)} + \text{sulfuro de cobre(II)} +
      \text{dióxido de azufre}
      $$

      **4.1** Escribir la ecuación química ajustada.

      **4.2** Calcular el rendimiento de la reacción química, si se generan
      330500 kg de óxido de hierro(II) durante la tostación de 1 t de
      calcopirita con un volumen de oxígeno de 600 m3 de densidad 0.401 g/L a
      700 °C y 1 atm.

      **4.3** El dióxido de azufre obtenido en la tostación de la calcopirita
      puede emplearse para la producción de ácido sulfúrico mediante el método
      denominado contacto por oxidación. Esta reacción tiene una relación
      estequiométrica entre el dióxido de azufre y el ácido sulfúrico de 1:1.
      Calcular el volumen de disolución de ácido sulfúrico (expresado en L),
      del 97% de riqueza y densidad 1.836 g/mL, que podría obtenerse empleando
      110 m3 de dióxido de azufre (densidad del dióxido de azufre 2.711 g/L a
      15 °C y 1 atm).

      **4.4** La disolución acuosa de ácido sulfúrico se diluye hasta una
      concentración del 7% en masa de sulfúrico y densidad 1.045 g/mL.

      **4.4.1** Calcular la molaridad de esta disolución.

      **4.4.2** Calcular la molalidad de esta disolución.

      **Datos:** la calcopirita es un mineral con un contenido del 90.20 % en
      masa de CuFeS2 · masas atómicas (u): H = 1.01; O = 16.00; S = 32.06;
      Fe = 55.85; Cu = 63.55 · densidad del agua: 0.998 g/mL (20 °C).
    pide: >-
      La ecuación ajustada, el rendimiento de la tostación, el volumen de
      disolución de ácido sulfúrico, y la molaridad y la molalidad de la
      dilución al 7 %.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la calcopirita **y** el oxígeno. Antes de calcular
          ningún rendimiento, ¿qué hay que decidir?
        opciones:
          - texto: >-
              Cuál de los dos es el reactivo limitante, porque es el que fija
              lo que se puede producir
            correcta: true
            mensaje: |
              Eso es. Dar los dos reactivos con cantidad es la señal: el
              enunciado quiere que compruebes cuál se acaba antes. Aquí sale
              la calcopirita, por poco.
          - texto: >-
              Cuál de los dos es más caro, porque el rendimiento se mide sobre
              él
            mensaje: |
              El precio no entra en la estequiometría. Lo que decide es cuál
              se agota primero según la proporción de la ecuación.
          - texto: >-
              Nada: el rendimiento siempre se calcula sobre el mineral
            mensaje: |
              No siempre. Se calcula sobre el limitante, y aquí resulta serlo
              el mineral — pero eso hay que **comprobarlo**, no suponerlo. Con
              50 m³ de oxígeno en vez de 600, el limitante sería el gas.
          - texto: >-
              Pasar el oxígeno a moles con la ecuación de los gases ideales, a
              700 °C
            mensaje: |
              No hace falta y además sobra: el enunciado da la **densidad** del
              oxígeno en esas condiciones, así que la masa sale de multiplicar
              volumen por densidad, sin pasar por $PV=nRT$.

      - tipo: calcular
        titulo: El óxido que cabría esperar
        pregunta: |
          Con la ecuación ajustada
          $2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
          2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}$,
          ¿cuántos kilogramos de FeO saldrían si la reacción fuera completa?
        respuesta:
          tipo: numero
          valor: '353.1'
          tolerancia: 3
          formato: la masa de FeO en kg, con una cifra decimal
        distractores:
          - valor: '391.5'
            mensaje: |
              Has usado la tonelada entera como si fuera CuFeS2. La calcopirita
              es un mineral al **90,20 %**.
          - valor: '360.1'
            mensaje: |
              Has tomado el oxígeno como limitante. Hay 7519 mol disponibles y
              hacen falta 7372: sobra, así que el que manda es el mineral.
        pista: |
          Primero el CuFeS2 que hay de verdad, después comprueba que el
          oxígeno alcanza, y por último la proporción 1:1 con el FeO.
        desarrollo: |
          $$
          n(\mathrm{CuFeS_2}) = \frac{10^{6}\cdot 0{,}9020}{183{,}52}
          = 4915\ \text{mol}
          \qquad
          n(\mathrm{O_2})_{\text{necesario}} = \tfrac{3}{2}\cdot 4915
          = 7372\ \text{mol}
          $$
          $$
          n(\mathrm{O_2})_{\text{disponible}}
          = \frac{600\cdot 10^{3}\cdot 0{,}401}{32{,}00} = 7519\ \text{mol}
          \;\Longrightarrow\; \text{sobra, limita el mineral}
          $$
          $$
          m(\mathrm{FeO}) = 4915\cdot 71{,}85 = 353\,100\ \text{g}
          = 353{,}1\ \text{kg}
          $$

      - tipo: calcular
        titulo: El ácido sulfúrico que se podría sacar
        pregunta: |
          Con 110 m³ de SO2 de densidad 2,711 g/L y relación 1:1, ¿qué volumen
          de disolución de sulfúrico al 97 % se obtiene?
        respuesta:
          tipo: numero
          valor: '256.4'
          tolerancia: 2.5
          formato: el volumen en litros, con una cifra decimal
        distractores:
          - valor: '248.7'
            mensaje: |
              Te has saltado la riqueza. Los 456,6 kg son de ácido **puro**, y
              vienen dentro de 470,7 kg de disolución al 97 %.
          - valor: '162.4'
            mensaje: |
              Has dividido entre la densidad del SO2 en vez de la del ácido.
              La densidad que convierte masa en volumen es la de aquello cuyo
              volumen quieres: 1,836 g/mL.
        pista: |
          La densidad del SO2 está para pasar los 110 m³ a masa y de ahí a
          moles. Después, 1:1, la masa molar del sulfúrico, la riqueza y por
          último la densidad de la disolución.
        desarrollo: |
          $$
          n(\mathrm{SO_2}) = \frac{110\cdot 10^{3}\cdot 2{,}711}{64{,}06}
          = 4655\ \text{mol}
          \;\Longrightarrow\;
          m(\mathrm{H_2SO_4}) = 4655\cdot 98{,}08 = 456{,}6\ \text{kg}
          $$
          $$
          m_{\text{disolución}} = \frac{456{,}6}{0{,}97} = 470{,}7\ \text{kg}
          \qquad
          V = \frac{470\,700}{1{,}836} = 256\,400\ \text{mL} = 256{,}4\ \text{L}
          $$

      - tipo: calcular
        titulo: La molaridad de la dilución al 7 %
        pregunta: |
          Diluida al 7 % en masa y con densidad 1,045 g/mL, ¿cuál es la
          molaridad?
        respuesta:
          tipo: numero
          valor: '0.746'
          tolerancia: 0.02
          formato: la molaridad en mol/L, con tres cifras decimales
        distractores:
          - valor: '0.714'
            mensaje: |
              Has supuesto que un litro pesa 1000 g. Pesa 1045: la densidad no
              es la del agua, y es justo el dato que el enunciado da para esto.
          - valor: '0.767'
            mensaje: |
              Esa es la **molalidad**, el apartado siguiente. La molaridad va
              por litro de disolución; la molalidad, por kilo de disolvente.
        pista: |
          Trabaja sobre un litro: pesa 1045 g, de los cuales el 7 % es ácido.
        desarrollo: |
          $$
          m_{\text{ácido}} = 0{,}07\cdot 1045 = 73{,}15\ \text{g}
          \;\Longrightarrow\;
          n = \frac{73{,}15}{98{,}08} = 0{,}746\ \text{mol}
          $$
          $$
          M = \frac{0{,}746}{1} = 0{,}746\ \text{mol/L}
          $$

      - tipo: calcular
        titulo: Y su molalidad
        pregunta: ¿Y la molalidad de esa misma disolución?
        respuesta:
          tipo: numero
          valor: '0.767'
          tolerancia: 0.02
          formato: la molalidad en mol/kg, con tres cifras decimales
        distractores:
          - valor: '0.746'
            mensaje: |
              Esa es la molaridad. La molalidad divide entre el **disolvente**,
              que son 971,9 g, no entre el litro entero de disolución.
          - valor: '0.714'
            mensaje: |
              Has usado 1000 g de disolvente. El disolvente son los 1045 g de
              disolución menos los 73,15 de ácido.
        pista: |
          Los moles son los mismos que en el apartado anterior. Lo único que
          cambia es entre qué se dividen: el disolvente, no la disolución.
        desarrollo: |
          $$
          m_{\text{disolvente}} = 1045 - 73{,}15 = 971{,}9\ \text{g}
          = 0{,}9719\ \text{kg}
          $$
          $$
          m = \frac{0{,}746}{0{,}9719} = 0{,}767\ \text{mol/kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Ajustar: $2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
              2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}$.
          - texto: >-
              Comprobar el limitante: hay 7519 mol de O2 y hacen falta 7372,
              así que manda la calcopirita.
          - texto: >-
              El máximo teórico de FeO son 353,1 kg, y con los 330,5 kg reales
              el rendimiento es del 93,6 %.
          - texto: >-
              De 110 m³ de SO2 salen 4655 mol de ácido, 470,7 kg de disolución
              al 97 % y 256,4 L.
          - texto: >-
              Diluida al 7 %, la molaridad es 0,746 mol/L y la molalidad
              0,767 mol/kg.
          - texto: >-
              Como el enunciado da 330500 kg de FeO y el máximo teórico son
              353,1 kg, el rendimiento sale del 93 588 % y hay que darlo así.
            trampa: true
            mensaje: |
              Un rendimiento no puede pasar del 100 %. Si te sale, **no lo
              escribas: búscale la causa**, porque siempre hay una y suele
              estar en la lectura del enunciado, no en la cuenta.

              Aquí es una errata del examen: 330500 kg de óxido a partir de una
              tonelada de mineral es imposible por conservación de la masa. Lo
              coherente es 330,5 kg —o los mismos 330500 en gramos—, y entonces
              sale 93,6 %, que es un rendimiento industrial normal.
        veredicto: |
          El orden es: ajustar, comprobar el limitante, teórico contra real, y
          las tres cuentas de disoluciones. Y una comprobación que vale para
          todos los ejercicios de este tipo: si el rendimiento pasa del 100 %,
          para.

    resolucion: |
      **Lo que se pide.** 3,75 de los 10 puntos del control, el ejercicio más
      largo. Y trae **una errata en el apartado 4.2** que conviene despachar
      antes de nada, porque si no, no hay ejercicio.

      ## Antes de empezar: los 330500 kg no pueden ser

      El enunciado dice que se generan **330500 kg de óxido de hierro(II)** a
      partir de **1 t de calcopirita**. Son 330 toneladas de producto a partir
      de una tonelada de materia prima: la conservación de la masa lo prohíbe
      antes de hacer ninguna cuenta.

      Y el número exacto de lo absurdo, que es lo que enseña:

      $$
      \eta = \frac{330\,500}{353{,}1} = 93\,588\ \%
      $$

      La lectura coherente es **330,5 kg** —o, lo que es lo mismo, 330500 **g**,
      que es seguramente lo que quería decir—. Con ella el rendimiento sale
      93,6 %, que es lo normal en una tostación industrial. El enunciado se
      reproduce tal cual porque aquí los enunciados no se retocan ni para
      arreglarlos, pero la resolución lo dice.

      **La regla que vale para cualquier examen:** un rendimiento por encima
      del 100 % no se ajusta ni se entrega. Se investiga, porque siempre tiene
      causa —una unidad mal leída, un limitante equivocado, una masa molar
      mal calculada— y encontrarla vale más puntos que dar un número absurdo
      con confianza.

      ## 4.1 · La ecuación

      Los productos vienen dichos con palabras: óxido de hierro(II) es FeO,
      sulfuro de cobre(II) es CuS, y el dióxido de azufre, SO2.

      $$
      2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}
      $$

      El cobre, el hierro y el azufre se ajustan solos; el oxígeno es el que
      obliga a poner $\tfrac{3}{2}$ y a multiplicar todo por dos.

      ## 4.2 · El limitante, y el rendimiento

      Que el enunciado dé **los dos** reactivos con cantidad es la señal de que
      hay que comprobar cuál se acaba antes:

      $$
      n(\mathrm{CuFeS_2}) = \frac{10^{6}\cdot 0{,}9020}{183{,}52} = 4915\ \text{mol}
      \qquad
      n(\mathrm{O_2})_{\text{nec}} = \tfrac{3}{2}\cdot 4915 = 7372\ \text{mol}
      $$
      $$
      n(\mathrm{O_2})_{\text{disp}} = \frac{600\cdot 10^{3}\cdot 0{,}401}{32{,}00}
      = 7519\ \text{mol}
      $$

      Sobran 147 mol de oxígeno, así que **limita la calcopirita** — por poco,
      un 2 %. Es un margen pequeño a propósito: si te dejas el 90,20 % del
      mineral, el limitante cambia y todo el ejercicio se va detrás.

      $$
      m(\mathrm{FeO})_{\text{teórico}} = 4915\cdot 71{,}85 = 353{,}1\ \text{kg}
      \;\Longrightarrow\;
      \boxed{\;\eta = \frac{330{,}5}{353{,}1} = 93{,}6\ \%\;}
      $$

      Fíjate en que la densidad del oxígeno está dada **a 700 °C y 1 atm**, así
      que no hace falta $PV=nRT$: volumen por densidad da la masa directamente.

      ## 4.3 · El ácido sulfúrico

      $$
      n(\mathrm{SO_2}) = \frac{110\cdot 10^{3}\cdot 2{,}711}{64{,}06} = 4655\ \text{mol}
      \;\overset{1:1}{\Longrightarrow}\;
      m(\mathrm{H_2SO_4}) = 456{,}6\ \text{kg de ácido puro}
      $$

      Y el ácido puro viene dentro de una disolución al 97 %:

      $$
      m_{\text{disolución}} = \frac{456{,}6}{0{,}97} = 470{,}7\ \text{kg}
      \;\Longrightarrow\;
      \boxed{\;V = \frac{470\,700}{1{,}836} = 256{,}4\ \text{L}\;}
      $$

      ## 4.4 · La dilución al 7 %

      El truco de los dos apartados es trabajar sobre **un litro** de la
      disolución diluida, que pesa 1045 g:

      $$
      m_{\text{ácido}} = 0{,}07\cdot 1045 = 73{,}15\ \text{g}
      \;\Longrightarrow\;
      n = 0{,}746\ \text{mol}
      $$
      $$
      \boxed{\;M = 0{,}746\ \text{mol/L}\;}
      \qquad
      m_{\text{disolvente}} = 1045-73{,}15 = 971{,}9\ \text{g}
      \;\Longrightarrow\;
      \boxed{\;m = \frac{0{,}746}{0{,}9719} = 0{,}767\ \text{mol/kg}\;}
      $$

      Aquí los dos números **sí** se separan —0,746 y 0,767, un 3 %— porque la
      disolución ya no es tan diluida. En el ejercicio del sulfúrico del final
      de 2024-2025 la disolución era 0,2 M y molaridad y molalidad coincidían
      casi hasta la tercera cifra. La diferencia entre las dos crece con la
      concentración, y esa es la idea que hay detrás de que el examen pida las
      dos.

