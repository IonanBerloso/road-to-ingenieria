            trampa: true
            mensaje: |
              Un rendimiento no puede pasar del 100 %. Si te sale, **no lo
              escribas: búscale la causa**, porque siempre hay una y suele
              estar en la lectura del enunciado, no en la cuenta.

              Aquí es una errata del examen: 330500 kg de óxido a partir de una
              tonelada de mineral es imposible por conservación de la masa. Lo
              coherente es 330,5 kg —o los mismos 330500 en gramos—, y entonces
              sale 93,6 %, que es un rendimiento industrial normal.
        veredicto: |
          El orden es: ajustar, comprobar el limitante, teórico contra real, y
