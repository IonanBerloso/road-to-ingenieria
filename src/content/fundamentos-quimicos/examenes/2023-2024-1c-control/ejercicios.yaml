    resolucion: |
      **Lo que se pide.** 3,75 de los 10 puntos del control, el ejercicio más
      largo. Y trae **una errata en el apartado 4.2** que conviene despachar
      antes de nada, porque si no, no hay ejercicio.

      ## Antes de empezar: los 330500 kg no pueden ser

      El enunciado dice que se generan **330500 kg de óxido de hierro(II)** a
      partir de **1 t de calcopirita**. Son 330 toneladas de producto a partir
      de una tonelada de materia prima: la conservación de la masa lo prohíbe
      antes de hacer ninguna cuenta.

      Y el número exacto de lo absurdo, que es lo que enseña:

      $$
      \eta = \frac{330\,500}{353{,}1} = 93\,588\ \%
      $$

      La lectura coherente es **330,5 kg** —o, lo que es lo mismo, 330500 **g**,
      que es seguramente lo que quería decir—. Con ella el rendimiento sale
      93,6 %, que es lo normal en una tostación industrial. El enunciado se
      reproduce tal cual porque aquí los enunciados no se retocan ni para
      arreglarlos, pero la resolución lo dice.

      **La regla que vale para cualquier examen:** un rendimiento por encima
      del 100 % no se ajusta ni se entrega. Se investiga, porque siempre tiene
      causa —una unidad mal leída, un limitante equivocado, una masa molar
      mal calculada— y encontrarla vale más puntos que dar un número absurdo
      con confianza.

      ## 4.1 · La ecuación

      Los productos vienen dichos con palabras: óxido de hierro(II) es FeO,
      sulfuro de cobre(II) es CuS, y el dióxido de azufre, SO2.

      $$
      2\,\mathrm{CuFeS_2} + 3\,\mathrm{O_2} \rightarrow
      2\,\mathrm{FeO} + 2\,\mathrm{CuS} + 2\,\mathrm{SO_2}
      $$

      El cobre, el hierro y el azufre se ajustan solos; el oxígeno es el que
      obliga a poner $\tfrac{3}{2}$ y a multiplicar todo por dos.

      ## 4.2 · El limitante, y el rendimiento

      Que el enunciado dé **los dos** reactivos con cantidad es la señal de que
      hay que comprobar cuál se acaba antes:

      $$
      n(\mathrm{CuFeS_2}) = \frac{10^{6}\cdot 0{,}9020}{183{,}52} = 4915\ \text{mol}
      \qquad
      n(\mathrm{O_2})_{\text{nec}} = \tfrac{3}{2}\cdot 4915 = 7372\ \text{mol}
      $$
      $$
      n(\mathrm{O_2})_{\text{disp}} = \frac{600\cdot 10^{3}\cdot 0{,}401}{32{,}00}
      = 7519\ \text{mol}
      $$

      Sobran 147 mol de oxígeno, así que **limita la calcopirita** — por poco,
      un 2 %. Es un margen pequeño a propósito: si te dejas el 90,20 % del
      mineral, el limitante cambia y todo el ejercicio se va detrás.

      $$
      m(\mathrm{FeO})_{\text{teórico}} = 4915\cdot 71{,}85 = 353{,}1\ \text{kg}
      \;\Longrightarrow\;
      \boxed{\;\eta = \frac{330{,}5}{353{,}1} = 93{,}6\ \%\;}
      $$

      Fíjate en que la densidad del oxígeno está dada **a 700 °C y 1 atm**, así
      que no hace falta $PV=nRT$: volumen por densidad da la masa directamente.

      ## 4.3 · El ácido sulfúrico

      $$
      n(\mathrm{SO_2}) = \frac{110\cdot 10^{3}\cdot 2{,}711}{64{,}06} = 4655\ \text{mol}
      \;\overset{1:1}{\Longrightarrow}\;
      m(\mathrm{H_2SO_4}) = 456{,}6\ \text{kg de ácido puro}
      $$

      Y el ácido puro viene dentro de una disolución al 97 %:

      $$
      m_{\text{disolución}} = \frac{456{,}6}{0{,}97} = 470{,}7\ \text{kg}
      \;\Longrightarrow\;
      \boxed{\;V = \frac{470\,700}{1{,}836} = 256{,}4\ \text{L}\;}
      $$

      ## 4.4 · La dilución al 7 %

      El truco de los dos apartados es trabajar sobre **un litro** de la
      disolución diluida, que pesa 1045 g:

      $$
      m_{\text{ácido}} = 0{,}07\cdot 1045 = 73{,}15\ \text{g}
      \;\Longrightarrow\;
      n = 0{,}746\ \text{mol}
      $$
      $$
      \boxed{\;M = 0{,}746\ \text{mol/L}\;}
      \qquad
      m_{\text{disolvente}} = 1045-73{,}15 = 971{,}9\ \text{g}
      \;\Longrightarrow\;
      \boxed{\;m = \frac{0{,}746}{0{,}9719} = 0{,}767\ \text{mol/kg}\;}
      $$

      Aquí los dos números **sí** se separan —0,746 y 0,767, un 3 %— porque la
      disolución ya no es tan diluida. En el ejercicio del sulfúrico del final
      de 2024-2025 la disolución era 0,2 M y molaridad y molalidad coincidían
      casi hasta la tercera cifra. La diferencia entre las dos crece con la
      concentración, y esa es la idea que hay detrás de que el examen pida las
      dos.

