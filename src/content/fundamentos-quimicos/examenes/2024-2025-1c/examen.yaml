asignatura: fundamentos-quimicos
curso: '2024-2025'
convocatoria: primer-cuatrimestre
fecha: curso 2024-2025
# El primer examen transcrito de la asignatura, y se ha elegido a propósito
# por ser el más difícil de los cinco (§13: empieza por el caso difícil). Su
# ejercicio 1 vale 3,50 de los 10 y cruza cuatro cosas en una sola cadena
# industrial —nombrar, ajustar, estequiometría con rendimientos y
# disoluciones—, que es exactamente el formato que esta asignatura repite.
#
# LOS PUNTOS. El cuadernillo SÍ publica lo que vale cada ejercicio —3,50 · 2 ·
# 2 · 0,50 · 2— pero **no los reparte por competencia**, que es lo único que
# el esquema sabe guardar. Como en Álgebra, no se declaran: inventarles un
# reparto por competencias para poder enseñar el número sería publicar un dato
# falso (§10). Lo que se pierde es real —que un ejercicio valga siete veces
# más que otro es la mejor guía de qué estudiar— y está anotado en
# `tasks/todo.md` como decisión pendiente.
#
# Tiempo: 1.45 h, impreso en la cabecera.
pdf: 2024-2025-1c.pdf

ejercicios:
  - id: exfq2425-1c-1-el-acido-sulfurico-en-tres-etapas
    tema: t01-compuestos-y-estequiometria

fuera:
  - n: 2
    motivo: >-
      Estructura de Lewis del cloruro de vinilo, hibridación, geometría,
      ángulos y polaridad. Es del tema 3, que todavía no está escrito: sin la
      prosa del enlace covalente delante, la resolución sería una receta.
  - n: 3
    motivo: >-
      Tabla periódica con tres elementos: grupo, periodo, carga nuclear
      efectiva, energía de ionización y afinidad electrónica. Es del tema 2,
      que todavía no está escrito.
  - n: 4
    motivo: >-
      Por qué el bañador se seca antes tras ducharse. Media hoja de fuerzas
      intermoleculares, del tema 3, que todavía no está escrito.
  - n: 5
    motivo: >-
      Clasificar cuatro sustancias por su tipo de sólido y sus fuerzas de
      cohesión. Cruza el tema 3 y el 4, ninguno de los dos escrito todavía.
