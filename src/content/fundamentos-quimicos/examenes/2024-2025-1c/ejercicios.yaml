ejercicios:
  # ── El primer ejercicio transcrito de la asignatura. Vale 3,50 de los 10 y
  #    es el molde que Química repite: una cadena industrial de tres etapas
  #    donde hay que nombrar, ajustar, arrastrar un rendimiento y terminar en
  #    disoluciones. Ninguna cuenta es difícil por separado; lo difícil es que
  #    el resultado de cada apartado entra en el siguiente, así que un fallo
  #    en 1.3.1 se propaga hasta 1.4.2.
  - id: exfq2425-1c-1-el-acido-sulfurico-en-tres-etapas
    titulo: El ácido sulfúrico, y un rendimiento que se arrastra tres etapas
    fuente: >-
      Ejercicio 1 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      El H2SO4 (l) es el compuesto químico más producido a nivel mundial ya
      que participa como reactivo en la síntesis de numerosos productos,
      destacando su utilización en la industria agroquímica para la obtención
      de fertilizantes. Se produce industrialmente mediante un procedimiento
      que consta de 3 etapas en serie. La primera etapa corresponde a la
      formación de Fe2O3 (s) y SO2 (g) a partir de la tostación de pirita (ver
      composición en los datos). A continuación, se oxida el SO2 (g) a SO3
      (g). Finalmente, se hidrata este último compuesto para lograr H2SO4 (l).

      **1.1** Nombrar los siguientes compuestos: H2SO4, FeS2, Fe2O3, SO2 y
      SO3.

      **1.2** Indicar las ecuaciones químicas ajustadas de las 3 etapas que
      forman la síntesis industrial del H2SO4 (l).

      **1.3** Se emplean 5 t de pirita para producir H2SO4 (l).

      **1.3.1** Calcular el rendimiento de la primera etapa, si se alimenta
      oxígeno en exceso y se generan 1550 m3 de SO2 (medidos a 0 °C y 1 atm).

      **1.3.2** En la segunda etapa, el SO2 formado durante la primera etapa
      reacciona nuevamente con oxígeno para producir SO3. Calcular la cantidad
      total (etapa 1 + etapa 2) de O2 (expresada en moles) necesaria para
      producir el SO3. Suponer un rendimiento del 100 % en la etapa 2.

      **1.3.3** Calcular el volumen de H2SO4 (l) (expresado en litros),
      suponiendo que el rendimiento de la reacción que tiene lugar durante la
      tercera etapa (hidratación del SO3) es del 95 % y que se alimenta agua
      en exceso.

      **1.4** La segunda etapa (oxidación del SO2) tiene lugar en un reactor.
      Si en vez de oxígeno se emplea aire y suponiendo un rendimiento de la
      reacción del 100 %:

      **1.4.1** Calcular el volumen de aire necesario para oxidar los 1550 m3
      de SO2 (0 °C y 1 atm).

      **1.4.2** Calcular la composición másica (expresada en %) de la mezcla
      de gases tras la reacción de oxidación.

      **1.5** El H2SO4 que se emplea en el laboratorio de prácticas no es un
      líquido puro, sino una disolución acuosa (pureza 98 % en masa y densidad
      1.836 g/mL). Suponiendo que los volúmenes son aditivos:

      **1.5.1** Calcular el volumen de H2SO4 (aq) necesario para preparar
      50 mL de una disolución 0.5 M.

      **1.5.2** Calcular el volumen de agua que debe añadirse a la disolución
      de H2SO4 (aq) 0.5 M para diluirla y conseguir una nueva disolución cuya
      concentración sea 0.2 M.

      **1.5.3** Calcular molalidad de la dilución.

      **Datos:** la pirita es un mineral con un contenido del 90 % en FeS2
      (% másico) · densidad del H2SO4 (l) en el rango de T de trabajo =
      1840 kg/m3 · composición volumétrica del aire (%): 21 O2, 79 N2 ·
      densidad del H2O (l) a 25 °C = 0.997 g/mL · masas atómicas (u):
      H = 1.01; N = 14.01; O = 16.00; S = 32.06; Fe = 55.85.
    pide: >-
      Nombrar los cinco compuestos, ajustar las tres etapas, y de ahí el
      rendimiento, los moles de oxígeno, el volumen de ácido, el volumen de
      aire, la composición másica y las tres cuentas de disoluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da 5 t de pirita y 1550 m³ de SO2 medidos. ¿Qué papel
          juega cada uno de esos dos números en el apartado 1.3.1?
        opciones:
          - texto: >-
              La pirita da el SO2 **teórico** y los 1550 m³ el **real**; el
              rendimiento es el cociente
            correcta: true
            mensaje: |
              Eso es, y es lo único que hay que tener claro en todo el
              ejercicio. Un rendimiento siempre compara lo que se obtuvo con
              lo que se habría obtenido si la reacción hubiera ido entera.
          - texto: >-
              Los dos son datos del mismo cálculo y hay que sumarlos para
              tener el SO2 total
            mensaje: |
              No: son la misma magnitud contada de dos maneras, la ideal y la
              medida. Sumarlas daría un SO2 que nadie ha producido. Uno sale
              de la estequiometría y el otro de un caudalímetro.
          - texto: >-
              Los 1550 m³ son el teórico, porque están medidos en condiciones
              normales
            mensaje: |
              Medir en condiciones normales solo dice a qué presión y
              temperatura se leyó el volumen, no si la reacción fue completa.
              Lo teórico sale **siempre** de la estequiometría del reactivo
              limitante, nunca de una medida.
          - texto: >-
              Hace falta conocer antes el rendimiento para poder usar los
              1550 m³
            mensaje: |
              Es justo al revés: el rendimiento es lo que se pide, y sale de
              comparar los dos. Si ya lo supieras, este apartado no existiría.

      - tipo: calcular
        titulo: El rendimiento de la tostación
        pregunta: |
          Con 5 t de pirita al 90 % y la tostación
          $4\,\mathrm{FeS_2} + 11\,\mathrm{O_2} \rightarrow
          2\,\mathrm{Fe_2O_3} + 8\,\mathrm{SO_2}$, ¿cuál es el rendimiento de
          la primera etapa?
        respuesta:
          tipo: numero
          valor: '92.2'
          tolerancia: 0.4
          formato: el rendimiento en %, con una cifra decimal
        distractores:
          - valor: '83.0'
            mensaje: |
              Has usado las 5 t enteras como si fueran FeS2. La pirita es un
              mineral al **90 %**: solo 4,5 t reaccionan.
          - valor: '46.1'
            mensaje: |
              Te has quedado con un SO2 por cada FeS2. La ecuación ajustada da
              **8 SO2 por cada 4 FeS2**, o sea dos por cada uno.
        pista: |
          Tres pasos: moles de FeS2 que hay de verdad, moles de SO2 que
          saldrían con la proporción de la ecuación, y moles de SO2 que se han
          medido —un volumen a 0 °C y 1 atm se pasa a moles dividiendo entre
          22,414 L/mol—.
        desarrollo: |
          $$
          n(\mathrm{FeS_2}) = \frac{5\cdot 10^{6}\cdot 0{,}90}{119{,}97}
          = 37\,509\ \text{mol}
          $$
          $$
          n(\mathrm{SO_2})_{\text{teórico}} = 2\cdot 37\,509 = 75\,019\ \text{mol}
          \qquad
          n(\mathrm{SO_2})_{\text{real}} = \frac{1{,}55\cdot 10^{6}}{22{,}414}
          = 69\,153\ \text{mol}
          $$
          $$
          \eta = \frac{69\,153}{75\,019} = 0{,}922 = 92{,}2\ \%
          $$

      - tipo: calcular
        titulo: El oxígeno de las dos primeras etapas
        pregunta: |
          ¿Cuántos moles de O2 se consumen en total entre la etapa 1 y la
          etapa 2?
        respuesta:
          tipo: numero
          valor: '129662'
          tolerancia: 900
          formato: los moles de O2, en mol
        distractores:
          - valor: '140660'
            mensaje: |
              Has usado la pirita entera para el O2 de la primera etapa. Solo
              reaccionó el 92,2 %: el oxígeno se gasta con lo que **reacciona**,
              no con lo que se alimenta.
          - valor: '95086'
            mensaje: |
              Ese es solo el de la tostación. Falta el de la etapa 2, que oxida
              el SO2 a SO3 con medio mol de O2 por cada mol de SO2.
        pista: |
          El SO2 medido dice cuánta pirita reaccionó de verdad: la mitad de
          69 153 mol. De ahí, 11 O2 por cada 4 FeS2. Y en la segunda etapa,
          $2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}$.
        desarrollo: |
          $$
          n(\mathrm{FeS_2})_{\text{reacciona}} = \frac{69\,153}{2}
          = 34\,577\ \text{mol}
          \qquad
          n(\mathrm{O_2})_1 = \frac{11}{4}\cdot 34\,577 = 95\,086\ \text{mol}
          $$
          $$
          n(\mathrm{O_2})_2 = \frac{69\,153}{2} = 34\,577\ \text{mol}
          \qquad
          n(\mathrm{O_2})_{\text{total}} = 129\,662\ \text{mol}
          $$

      - tipo: calcular
        titulo: El volumen de ácido que sale
        pregunta: |
          Con un 95 % de rendimiento en la hidratación, ¿qué volumen de H2SO4
          líquido se obtiene?
        respuesta:
          tipo: numero
          valor: '3502'
          tolerancia: 30
          formato: el volumen en litros
        distractores:
          - valor: '3686'
            mensaje: |
              Te has dejado el 95 % de la tercera etapa. Ese sería el volumen
              si la hidratación fuera completa.
          - valor: '3.5'
            mensaje: |
              Ese es el volumen en **metros cúbicos**. La densidad viene en
              kg/m³ y el enunciado pide litros: sobran tres órdenes de
              magnitud.
        pista: |
          Cada mol de SO3 da un mol de H2SO4, y el SO3 son los 69 153 mol de
          SO2 de antes porque la etapa 2 va al 100 %. Después, masa a volumen
          con los 1840 kg/m³.
        desarrollo: |
          $$
          n(\mathrm{H_2SO_4}) = 0{,}95\cdot 69\,153 = 65\,696\ \text{mol}
          \qquad
          m = 65\,696\cdot 98{,}08 = 6\,443\ \text{kg}
          $$
          $$
          V = \frac{6\,443}{1840} = 3{,}50\ \text{m}^{3} = 3502\ \text{L}
          $$

      - tipo: calcular
        titulo: El aire, y lo que arrastra consigo
        pregunta: |
          Si la oxidación se hace con aire en vez de con oxígeno puro, ¿qué
          volumen de aire hace falta para los 1550 m³ de SO2?
        respuesta:
          tipo: numero
          valor: '3690'
          tolerancia: 30
          formato: el volumen de aire en m³
        distractores:
          - valor: '7381'
            mensaje: |
              Has pedido un mol de O2 por cada mol de SO2. La ecuación es
              $2\,\mathrm{SO_2} + \mathrm{O_2}$: hace falta **la mitad**.
          - valor: '775'
            mensaje: |
              Ese es el oxígeno, no el aire. El aire solo lleva un 21 % de O2
              en volumen, así que hay que dividir entre 0,21.
        pista: |
          En gases a la misma presión y temperatura, los volúmenes van como
          los moles: no hace falta pasar a moles para esta parte.
        desarrollo: |
          $$
          V(\mathrm{O_2}) = \frac{1550}{2} = 775\ \text{m}^{3}
          \qquad
          V(\text{aire}) = \frac{775}{0{,}21} = 3690\ \text{m}^{3}
          $$

      - tipo: calcular
        titulo: La composición másica de lo que sale del reactor
        pregunta: |
          Tras la oxidación con aire, ¿qué porcentaje **en masa** de la mezcla
          de gases es SO3?
        respuesta:
          tipo: numero
          valor: '60.3'
          tolerancia: 0.8
          formato: el porcentaje en masa de SO3, con una cifra decimal
        distractores:
          - valor: '19.2'
            mensaje: |
              Eso es el porcentaje **en volumen**, o sea en moles. La pregunta
              es en masa, y el SO3 pesa casi el triple que el N2: 80,06 frente
              a 28,02 g/mol.
          - valor: '39.7'
            mensaje: |
              Ese es el del N2. Has calculado bien y has contestado el otro.
        pista: |
          El nitrógeno entra con el aire y sale sin reaccionar, así que a la
          salida solo hay SO3 y N2. Pasa los dos a masa y divide.
        desarrollo: |
          $$
          n(\mathrm{N_2}) = \frac{3690\cdot 0{,}79\cdot 10^{3}}{22{,}414}
          = 130\,074\ \text{mol}
          $$
          $$
          m(\mathrm{SO_3}) = 69\,153\cdot 80{,}06 = 5\,536\ \text{kg}
          \qquad
          m(\mathrm{N_2}) = 130\,074\cdot 28{,}02 = 3\,645\ \text{kg}
          $$
          $$
          \%\,\mathrm{SO_3} = \frac{5\,536}{5\,536+3\,645} = 60{,}3\ \%
          \qquad
          \%\,\mathrm{N_2} = 39{,}7\ \%
          $$

      - tipo: calcular
        titulo: El ácido del laboratorio
        pregunta: |
          ¿Qué volumen de H2SO4 acuoso al 98 % y densidad 1,836 g/mL hace
          falta para preparar 50 mL de disolución 0,5 M?
        respuesta:
          tipo: numero
          valor: '1.36'
          tolerancia: 0.012
          formato: el volumen en mL, con dos cifras decimales
        distractores:
          - valor: '1.34'
            mensaje: |
              Te has saltado la pureza. Los 2,45 g de ácido puro vienen dentro
              de 2,50 g de disolución, y es esa masa la que se convierte en
              volumen.
          - valor: '2.50'
            mensaje: |
              Eso son los **gramos** de disolución, no los mililitros. Falta
              dividir entre la densidad, 1,836 g/mL.
        pista: |
          Tres saltos y en este orden: moles que se necesitan, gramos de ácido
          puro, gramos de disolución al 98 %, y de ahí el volumen.
        desarrollo: |
          $$
          n = 0{,}050\cdot 0{,}5 = 0{,}025\ \text{mol}
          \qquad
          m(\mathrm{H_2SO_4}) = 0{,}025\cdot 98{,}08 = 2{,}452\ \text{g}
          $$
          $$
          m_{\text{disolución}} = \frac{2{,}452}{0{,}98} = 2{,}502\ \text{g}
          \qquad
          V = \frac{2{,}502}{1{,}836} = 1{,}36\ \text{mL}
          $$

      - tipo: calcular
        titulo: La dilución, y su molalidad
        pregunta: |
          Al diluir los 50 mL de 0,5 M hasta 0,2 M, ¿cuál es la molalidad de
          la disolución final?
        respuesta:
          tipo: numero
          valor: '0.203'
          tolerancia: 0.0015
          formato: la molalidad en mol/kg, con tres cifras decimales
        distractores:
          - valor: '0.200'
            mensaje: |
              Has tomado la molalidad igual que la molaridad. Solo coinciden si
              un litro de disolución pesa un kilo de **disolvente**, y aquí el
              disolvente son 123,6 mL, no 125.
          - valor: '0.500'
            mensaje: |
              Esa es la concentración de partida, no la de la dilución. Diluir
              no cambia los moles de soluto, cambia el disolvente.
        pista: |
          Diluir no crea ni destruye soluto: los 0,025 mol siguen ahí. La
          molalidad va por kilogramos de **disolvente**, no de disolución, y
          los volúmenes son aditivos.

          Y aquí la tercera cifra decimal decide: todos los caminos
          equivocados de este apartado dan 0,200, que se parece muchísimo a la
          respuesta buena. No redondees antes de tiempo.
        desarrollo: |
          $$
          V_{\text{final}} = \frac{0{,}025}{0{,}2} = 0{,}125\ \text{L}
          \qquad
          V_{\text{agua añadida}} = 125-50 = 75\ \text{mL}
          $$
          El disolvente es todo lo que no es el ácido concentrado:
          $$
          V_{\text{agua}} = 125-1{,}36 = 123{,}64\ \text{mL}
          \qquad
          m_{\text{agua}} = 123{,}64\cdot 0{,}997 = 123{,}3\ \text{g}
          $$
          $$
          m = \frac{0{,}025}{0{,}1233} = 0{,}203\ \text{mol/kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio de principio a fin. Una pieza es falsa.
        piezas:
          - texto: >-
              Nombrar: ácido sulfúrico, disulfuro de hierro (pirita), óxido de
              hierro(III), dióxido de azufre y trióxido de azufre.
          - texto: >-
              Ajustar las tres etapas:
              $4\,\mathrm{FeS_2}+11\,\mathrm{O_2}\rightarrow
              2\,\mathrm{Fe_2O_3}+8\,\mathrm{SO_2}$;
              $2\,\mathrm{SO_2}+\mathrm{O_2}\rightarrow 2\,\mathrm{SO_3}$;
              $\mathrm{SO_3}+\mathrm{H_2O}\rightarrow \mathrm{H_2SO_4}$.
          - texto: >-
              Comparar el SO2 teórico de las 4,5 t de FeS2 con los 69 153 mol
              medidos: el rendimiento de la tostación es del 92,2 %.
          - texto: >-
              El SO2 medido fija cuánta pirita reaccionó, y de ahí los 129 662
              mol de O2 de las dos primeras etapas.
          - texto: >-
              Con el 95 % de la hidratación, 65 696 mol de ácido, 6443 kg y
              3502 L.
          - texto: >-
              Con aire, 3690 m³ para los mismos 775 m³ de oxígeno, y a la
              salida la mezcla es 60,3 % de SO3 y 39,7 % de N2 en masa.
          - texto: >-
              Como el rendimiento de la primera etapa es del 92,2 %, hay que
              multiplicar por 0,922 otra vez al calcular el ácido final.
            trampa: true
            mensaje: |
              El rendimiento ya está dentro. Los 1550 m³ de SO2 son lo que
              **se produjo de verdad**, no lo teórico, así que todo lo que se
              calcula a partir de ellos ya lleva la pérdida incorporada.
              Volver a multiplicar por 0,922 la descuenta dos veces.

              Es el fallo más caro de este ejercicio precisamente porque
              parece cuidadoso: quien lo comete está acordándose del
              rendimiento, no olvidándolo.
        veredicto: |
          La estructura de todo el ejercicio es una sola cadena: el volumen
          medido de SO2 es la bisagra, y a partir de él todo lo demás sale
          hacia adelante sin volver a tocar el rendimiento de la tostación.

    resolucion: |
      **Lo que se pide.** Vale 3,50 de los 10 puntos del examen, y es el
      ejercicio más largo de los cinco. No hay ninguna cuenta difícil: lo
      difícil es que cada apartado se apoya en el anterior.

      ## 1.1 · Los nombres

      | fórmula | nombre |
      |---|---|
      | $\mathrm{H_2SO_4}$ | ácido sulfúrico |
      | $\mathrm{FeS_2}$ | disulfuro de hierro — el mineral es la pirita |
      | $\mathrm{Fe_2O_3}$ | óxido de hierro(III) |
      | $\mathrm{SO_2}$ | dióxido de azufre |
      | $\mathrm{SO_3}$ | trióxido de azufre |

      ## 1.2 · Las tres etapas, ajustadas

      $$
      4\,\mathrm{FeS_2} + 11\,\mathrm{O_2} \rightarrow
      2\,\mathrm{Fe_2O_3} + 8\,\mathrm{SO_2}
      $$
      $$
      2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}
      \qquad
      \mathrm{SO_3} + \mathrm{H_2O} \rightarrow \mathrm{H_2SO_4}
      $$

      La primera es la que cuesta. Se ajusta por partes: primero el hierro,
      después el azufre, y el oxígeno al final, que es el que obliga a
      multiplicar todo por dos para quitar el medio.

      ## 1.3 · El rendimiento, y lo que arrastra

      **1.3.1** De las 5 t solo son pirita 4,5:

      $$
      n(\mathrm{FeS_2}) = \frac{4{,}5\cdot 10^{6}}{119{,}97} = 37\,509\ \text{mol}
      \;\Longrightarrow\;
      n(\mathrm{SO_2})_{\text{teórico}} = 75\,019\ \text{mol}
      $$

      Y lo medido, a 0 °C y 1 atm, con 22,414 L por mol:

      $$
      n(\mathrm{SO_2})_{\text{real}} = \frac{1{,}55\cdot 10^{6}}{22{,}414}
      = 69\,153\ \text{mol}
      \;\Longrightarrow\;
      \boxed{\;\eta = 92{,}2\ \%\;}
      $$

      **1.3.2** Aquí está la bisagra del ejercicio entero. El oxígeno se gasta
      con la pirita que **reacciona**, no con la que se alimenta, y quién
      reaccionó lo dice el SO2 medido:

      $$
      n(\mathrm{FeS_2})_{\text{reacciona}} = \frac{69\,153}{2} = 34\,577\ \text{mol}
      \;\Longrightarrow\;
      n(\mathrm{O_2})_1 = \frac{11}{4}\cdot 34\,577 = 95\,086\ \text{mol}
      $$

      La etapa 2 va al 100 % y consume medio O2 por cada SO2:

      $$
      n(\mathrm{O_2})_2 = 34\,577
      \;\Longrightarrow\;
      \boxed{\;n(\mathrm{O_2})_{\text{total}} = 129\,662\ \text{mol}\;}
      $$

      **1.3.3** Cada SO3 da un H2SO4, con el 95 % de la hidratación:

      $$
      n = 0{,}95\cdot 69\,153 = 65\,696\ \text{mol}
      \qquad
      m = 6443\ \text{kg}
      \qquad
      \boxed{\;V = 3502\ \text{L}\;}
      $$

      ## 1.4 · El aire, y el nitrógeno que sobra

      **1.4.1** En gases a la misma presión y temperatura los volúmenes van
      como los moles, así que no hace falta pasar a moles:

      $$
      V(\mathrm{O_2}) = \frac{1550}{2} = 775\ \text{m}^{3}
      \qquad
      \boxed{\;V(\text{aire}) = \frac{775}{0{,}21} = 3690\ \text{m}^{3}\;}
      $$

      **1.4.2** El nitrógeno entra y sale sin reaccionar, y es casi cuatro
      quintas partes del aire: a la salida hay SO3 y N2.

      $$
      n(\mathrm{N_2}) = \frac{3690\cdot 0{,}79\cdot 10^{3}}{22{,}414}
      = 130\,074\ \text{mol}
      $$
      $$
      m(\mathrm{SO_3}) = 5536\ \text{kg}
      \qquad
      m(\mathrm{N_2}) = 3645\ \text{kg}
      $$
      $$
      \boxed{\;60{,}3\ \%\ \mathrm{SO_3} \quad\text{y}\quad 39{,}7\ \%\ \mathrm{N_2}\;}
      $$

      **Ojo al cambio de pregunta.** En moles el SO3 es solo el 34,7 % de la
      mezcla; en masa es el 60,3 %. La diferencia está en que el SO3 pesa casi
      el triple que el N2. Es el apartado donde más se falla, y no por la
      cuenta: por contestar en la unidad que no era.

      ## 1.5 · Las disoluciones

      **1.5.1** El reactivo del laboratorio no es ácido puro:

      $$
      n = 0{,}025\ \text{mol}
      \quad\rightarrow\quad
      2{,}452\ \text{g de ácido}
      \quad\rightarrow\quad
      \frac{2{,}452}{0{,}98} = 2{,}502\ \text{g de disolución}
      \quad\rightarrow\quad
      \boxed{\;1{,}36\ \text{mL}\;}
      $$

      **1.5.2** Diluir no cambia los moles:

      $$
      V_{\text{final}} = \frac{0{,}025}{0{,}2} = 125\ \text{mL}
      \;\Longrightarrow\;
      \boxed{\;\text{hay que añadir } 75\ \text{mL de agua}\;}
      $$

      **1.5.3** Y la molalidad va por kilos de **disolvente**, que es donde
      este apartado separa a quien ha entendido la definición de quien la ha
      memorizado. Como los volúmenes son aditivos, el agua son los 125 mL
      menos el 1,36 de ácido concentrado:

      $$
      m_{\text{agua}} = 123{,}64\cdot 0{,}997 = 123{,}3\ \text{g}
      \;\Longrightarrow\;
      \boxed{\;m = \frac{0{,}025}{0{,}1233} = 0{,}203\ \text{mol/kg}\;}
      $$

      Sale casi igual que la molaridad —0,203 frente a 0,200— y esa
      casi-coincidencia es una trampa: pasa porque la disolución es muy
      diluida y su densidad es prácticamente la del agua. En una disolución
      concentrada los dos números no se parecen en nada.
