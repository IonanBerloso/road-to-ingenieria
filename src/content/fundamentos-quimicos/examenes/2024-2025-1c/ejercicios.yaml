ejercicios:
  # ── El primer ejercicio transcrito de la asignatura. Vale 3,50 de los 10 y
  #    es el molde que Química repite: una cadena industrial de tres etapas
  #    donde hay que nombrar, ajustar, arrastrar un rendimiento y terminar en
  #    disoluciones. Ninguna cuenta es difícil por separado; lo difícil es que
  #    el resultado de cada apartado entra en el siguiente, así que un fallo
  #    en 1.3.1 se propaga hasta 1.4.2.
  - id: exfq2425-1c-1-el-acido-sulfurico-en-tres-etapas
    titulo: El ácido sulfúrico, y un rendimiento que se arrastra tres etapas
    fuente: >-
      Ejercicio 1 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      El H2SO4 (l) es el compuesto químico más producido a nivel mundial ya
      que participa como reactivo en la síntesis de numerosos productos,
      destacando su utilización en la industria agroquímica para la obtención
      de fertilizantes. Se produce industrialmente mediante un procedimiento
      que consta de 3 etapas en serie. La primera etapa corresponde a la
      formación de Fe2O3 (s) y SO2 (g) a partir de la tostación de pirita (ver
      composición en los datos). A continuación, se oxida el SO2 (g) a SO3
      (g). Finalmente, se hidrata este último compuesto para lograr H2SO4 (l).

      **1.1** Nombrar los siguientes compuestos: H2SO4, FeS2, Fe2O3, SO2 y
      SO3.

      **1.2** Indicar las ecuaciones químicas ajustadas de las 3 etapas que
      forman la síntesis industrial del H2SO4 (l).

      **1.3** Se emplean 5 t de pirita para producir H2SO4 (l).

      **1.3.1** Calcular el rendimiento de la primera etapa, si se alimenta
      oxígeno en exceso y se generan 1550 m3 de SO2 (medidos a 0 °C y 1 atm).

      **1.3.2** En la segunda etapa, el SO2 formado durante la primera etapa
      reacciona nuevamente con oxígeno para producir SO3. Calcular la cantidad
      total (etapa 1 + etapa 2) de O2 (expresada en moles) necesaria para
      producir el SO3. Suponer un rendimiento del 100 % en la etapa 2.

      **1.3.3** Calcular el volumen de H2SO4 (l) (expresado en litros),
      suponiendo que el rendimiento de la reacción que tiene lugar durante la
      tercera etapa (hidratación del SO3) es del 95 % y que se alimenta agua
      en exceso.

      **1.4** La segunda etapa (oxidación del SO2) tiene lugar en un reactor.
      Si en vez de oxígeno se emplea aire y suponiendo un rendimiento de la
      reacción del 100 %:

      **1.4.1** Calcular el volumen de aire necesario para oxidar los 1550 m3
      de SO2 (0 °C y 1 atm).

      **1.4.2** Calcular la composición másica (expresada en %) de la mezcla
      de gases tras la reacción de oxidación.

      **1.5** El H2SO4 que se emplea en el laboratorio de prácticas no es un
      líquido puro, sino una disolución acuosa (pureza 98 % en masa y densidad
      1.836 g/mL). Suponiendo que los volúmenes son aditivos:

      **1.5.1** Calcular el volumen de H2SO4 (aq) necesario para preparar
      50 mL de una disolución 0.5 M.

      **1.5.2** Calcular el volumen de agua que debe añadirse a la disolución
      de H2SO4 (aq) 0.5 M para diluirla y conseguir una nueva disolución cuya
      concentración sea 0.2 M.

      **1.5.3** Calcular molalidad de la dilución.

      **Datos:** la pirita es un mineral con un contenido del 90 % en FeS2
      (% másico) · densidad del H2SO4 (l) en el rango de T de trabajo =
      1840 kg/m3 · composición volumétrica del aire (%): 21 O2, 79 N2 ·
      densidad del H2O (l) a 25 °C = 0.997 g/mL · masas atómicas (u):
      H = 1.01; N = 14.01; O = 16.00; S = 32.06; Fe = 55.85.
    pide: >-
      Nombrar los cinco compuestos, ajustar las tres etapas, y de ahí el
      rendimiento, los moles de oxígeno, el volumen de ácido, el volumen de
      aire, la composición másica y las tres cuentas de disoluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da 5 t de pirita y 1550 m³ de SO2 medidos. ¿Qué papel
          juega cada uno de esos dos números en el apartado 1.3.1?
        opciones:
          - texto: >-
              La pirita da el SO2 **teórico** y los 1550 m³ el **real**; el
              rendimiento es el cociente
            correcta: true
            mensaje: |
              Eso es, y es lo único que hay que tener claro en todo el
              ejercicio. Un rendimiento siempre compara lo que se obtuvo con
              lo que se habría obtenido si la reacción hubiera ido entera.
          - texto: >-
              Los dos son datos del mismo cálculo y hay que sumarlos para
              tener el SO2 total
            mensaje: |
              No: son la misma magnitud contada de dos maneras, la ideal y la
              medida. Sumarlas daría un SO2 que nadie ha producido. Uno sale
              de la estequiometría y el otro de un caudalímetro.
          - texto: >-
              Los 1550 m³ son el teórico, porque están medidos en condiciones
              normales
            mensaje: |
              Medir en condiciones normales solo dice a qué presión y
              temperatura se leyó el volumen, no si la reacción fue completa.
              Lo teórico sale **siempre** de la estequiometría del reactivo
              limitante, nunca de una medida.
          - texto: >-
              Hace falta conocer antes el rendimiento para poder usar los
              1550 m³
            mensaje: |
              Es justo al revés: el rendimiento es lo que se pide, y sale de
              comparar los dos. Si ya lo supieras, este apartado no existiría.

      - tipo: calcular
        titulo: El rendimiento de la tostación
        pregunta: |
          Con 5 t de pirita al 90 % y la tostación
          $4\,\mathrm{FeS_2} + 11\,\mathrm{O_2} \rightarrow
          2\,\mathrm{Fe_2O_3} + 8\,\mathrm{SO_2}$, ¿cuál es el rendimiento de
          la primera etapa?
        respuesta:
          tipo: numero
          valor: '92.2'
          tolerancia: 0.4
          formato: el rendimiento en %, con una cifra decimal
        distractores:
          - valor: '83.0'
            mensaje: |
              Has usado las 5 t enteras como si fueran FeS2. La pirita es un
              mineral al **90 %**: solo 4,5 t reaccionan.
          - valor: '46.1'
            mensaje: |
              Te has quedado con un SO2 por cada FeS2. La ecuación ajustada da
              **8 SO2 por cada 4 FeS2**, o sea dos por cada uno.
        pista: |
          Tres pasos: moles de FeS2 que hay de verdad, moles de SO2 que
          saldrían con la proporción de la ecuación, y moles de SO2 que se han
          medido —un volumen a 0 °C y 1 atm se pasa a moles dividiendo entre
          22,414 L/mol—.
        desarrollo: |
          $$
          n(\mathrm{FeS_2}) = \frac{5\cdot 10^{6}\cdot 0{,}90}{119{,}97}
          = 37\,509\ \text{mol}
          $$
          $$
          n(\mathrm{SO_2})_{\text{teórico}} = 2\cdot 37\,509 = 75\,019\ \text{mol}
          \qquad
          n(\mathrm{SO_2})_{\text{real}} = \frac{1{,}55\cdot 10^{6}}{22{,}414}
          = 69\,153\ \text{mol}
          $$
          $$
          \eta = \frac{69\,153}{75\,019} = 0{,}922 = 92{,}2\ \%
          $$

      - tipo: calcular
        titulo: El oxígeno de las dos primeras etapas
        pregunta: |
          ¿Cuántos moles de O2 se consumen en total entre la etapa 1 y la
          etapa 2?
        respuesta:
          tipo: numero
          valor: '129662'
          tolerancia: 900
          formato: los moles de O2, en mol
        distractores:
          - valor: '140660'
            mensaje: |
              Has usado la pirita entera para el O2 de la primera etapa. Solo
              reaccionó el 92,2 %: el oxígeno se gasta con lo que **reacciona**,
              no con lo que se alimenta.
          - valor: '95086'
            mensaje: |
              Ese es solo el de la tostación. Falta el de la etapa 2, que oxida
              el SO2 a SO3 con medio mol de O2 por cada mol de SO2.
        pista: |
          El SO2 medido dice cuánta pirita reaccionó de verdad: la mitad de
          69 153 mol. De ahí, 11 O2 por cada 4 FeS2. Y en la segunda etapa,
          $2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}$.
        desarrollo: |
          $$
          n(\mathrm{FeS_2})_{\text{reacciona}} = \frac{69\,153}{2}
          = 34\,577\ \text{mol}
          \qquad
          n(\mathrm{O_2})_1 = \frac{11}{4}\cdot 34\,577 = 95\,086\ \text{mol}
          $$
          $$
          n(\mathrm{O_2})_2 = \frac{69\,153}{2} = 34\,577\ \text{mol}
          \qquad
          n(\mathrm{O_2})_{\text{total}} = 129\,662\ \text{mol}
          $$

      - tipo: calcular
        titulo: El volumen de ácido que sale
        pregunta: |
          Con un 95 % de rendimiento en la hidratación, ¿qué volumen de H2SO4
          líquido se obtiene?
        respuesta:
          tipo: numero
          valor: '3502'
          tolerancia: 30
          formato: el volumen en litros
        distractores:
          - valor: '3686'
            mensaje: |
              Te has dejado el 95 % de la tercera etapa. Ese sería el volumen
              si la hidratación fuera completa.
          - valor: '3.5'
            mensaje: |
              Ese es el volumen en **metros cúbicos**. La densidad viene en
              kg/m³ y el enunciado pide litros: sobran tres órdenes de
              magnitud.
        pista: |
          Cada mol de SO3 da un mol de H2SO4, y el SO3 son los 69 153 mol de
          SO2 de antes porque la etapa 2 va al 100 %. Después, masa a volumen
          con los 1840 kg/m³.
        desarrollo: |
          $$
          n(\mathrm{H_2SO_4}) = 0{,}95\cdot 69\,153 = 65\,696\ \text{mol}
          \qquad
          m = 65\,696\cdot 98{,}08 = 6\,443\ \text{kg}
          $$
          $$
          V = \frac{6\,443}{1840} = 3{,}50\ \text{m}^{3} = 3502\ \text{L}
          $$

      - tipo: calcular
        titulo: El aire, y lo que arrastra consigo
        pregunta: |
          Si la oxidación se hace con aire en vez de con oxígeno puro, ¿qué
          volumen de aire hace falta para los 1550 m³ de SO2?
        respuesta:
          tipo: numero
          valor: '3690'
          tolerancia: 30
          formato: el volumen de aire en m³
        distractores:
          - valor: '7381'
            mensaje: |
              Has pedido un mol de O2 por cada mol de SO2. La ecuación es
              $2\,\mathrm{SO_2} + \mathrm{O_2}$: hace falta **la mitad**.
          - valor: '775'
            mensaje: |
              Ese es el oxígeno, no el aire. El aire solo lleva un 21 % de O2
              en volumen, así que hay que dividir entre 0,21.
        pista: |
          En gases a la misma presión y temperatura, los volúmenes van como
          los moles: no hace falta pasar a moles para esta parte.
        desarrollo: |
          $$
          V(\mathrm{O_2}) = \frac{1550}{2} = 775\ \text{m}^{3}
          \qquad
          V(\text{aire}) = \frac{775}{0{,}21} = 3690\ \text{m}^{3}
          $$

      - tipo: calcular
        titulo: La composición másica de lo que sale del reactor
        pregunta: |
          Tras la oxidación con aire, ¿qué porcentaje **en masa** de la mezcla
          de gases es SO3?
        respuesta:
          tipo: numero
          valor: '60.3'
          tolerancia: 0.8
          formato: el porcentaje en masa de SO3, con una cifra decimal
        distractores:
          - valor: '19.2'
            mensaje: |
              Eso es el porcentaje **en volumen**, o sea en moles. La pregunta
              es en masa, y el SO3 pesa casi el triple que el N2: 80,06 frente
              a 28,02 g/mol.
          - valor: '39.7'
            mensaje: |
              Ese es el del N2. Has calculado bien y has contestado el otro.
        pista: |
          El nitrógeno entra con el aire y sale sin reaccionar, así que a la
          salida solo hay SO3 y N2. Pasa los dos a masa y divide.
        desarrollo: |
          $$
          n(\mathrm{N_2}) = \frac{3690\cdot 0{,}79\cdot 10^{3}}{22{,}414}
          = 130\,074\ \text{mol}
          $$
          $$
          m(\mathrm{SO_3}) = 69\,153\cdot 80{,}06 = 5\,536\ \text{kg}
          \qquad
          m(\mathrm{N_2}) = 130\,074\cdot 28{,}02 = 3\,645\ \text{kg}
          $$
          $$
          \%\,\mathrm{SO_3} = \frac{5\,536}{5\,536+3\,645} = 60{,}3\ \%
          \qquad
          \%\,\mathrm{N_2} = 39{,}7\ \%
          $$

      - tipo: calcular
        titulo: El ácido del laboratorio
        pregunta: |
          ¿Qué volumen de H2SO4 acuoso al 98 % y densidad 1,836 g/mL hace
          falta para preparar 50 mL de disolución 0,5 M?
        respuesta:
          tipo: numero
          valor: '1.36'
          tolerancia: 0.012
          formato: el volumen en mL, con dos cifras decimales
        distractores:
          - valor: '1.34'
            mensaje: |
              Te has saltado la pureza. Los 2,45 g de ácido puro vienen dentro
              de 2,50 g de disolución, y es esa masa la que se convierte en
              volumen.
          - valor: '2.50'
            mensaje: |
              Eso son los **gramos** de disolución, no los mililitros. Falta
              dividir entre la densidad, 1,836 g/mL.
        pista: |
          Tres saltos y en este orden: moles que se necesitan, gramos de ácido
          puro, gramos de disolución al 98 %, y de ahí el volumen.
        desarrollo: |
          $$
          n = 0{,}050\cdot 0{,}5 = 0{,}025\ \text{mol}
          \qquad
          m(\mathrm{H_2SO_4}) = 0{,}025\cdot 98{,}08 = 2{,}452\ \text{g}
          $$
          $$
          m_{\text{disolución}} = \frac{2{,}452}{0{,}98} = 2{,}502\ \text{g}
          \qquad
          V = \frac{2{,}502}{1{,}836} = 1{,}36\ \text{mL}
          $$

      - tipo: calcular
        titulo: La dilución, y su molalidad
        pregunta: |
          Al diluir los 50 mL de 0,5 M hasta 0,2 M, ¿cuál es la molalidad de
          la disolución final?
        respuesta:
          tipo: numero
          valor: '0.203'
          tolerancia: 0.0015
          formato: la molalidad en mol/kg, con tres cifras decimales
        distractores:
          - valor: '0.200'
            mensaje: |
              Has tomado la molalidad igual que la molaridad. Solo coinciden si
              un litro de disolución pesa un kilo de **disolvente**, y aquí el
              disolvente son 123,6 mL, no 125.
          - valor: '0.500'
            mensaje: |
              Esa es la concentración de partida, no la de la dilución. Diluir
              no cambia los moles de soluto, cambia el disolvente.
        pista: |
          Diluir no crea ni destruye soluto: los 0,025 mol siguen ahí. La
          molalidad va por kilogramos de **disolvente**, no de disolución, y
          los volúmenes son aditivos.

          Y aquí la tercera cifra decimal decide: todos los caminos
          equivocados de este apartado dan 0,200, que se parece muchísimo a la
          respuesta buena. No redondees antes de tiempo.
        desarrollo: |
          $$
          V_{\text{final}} = \frac{0{,}025}{0{,}2} = 0{,}125\ \text{L}
          \qquad
          V_{\text{agua añadida}} = 125-50 = 75\ \text{mL}
          $$
          El disolvente es todo lo que no es el ácido concentrado:
          $$
          V_{\text{agua}} = 125-1{,}36 = 123{,}64\ \text{mL}
          \qquad
          m_{\text{agua}} = 123{,}64\cdot 0{,}997 = 123{,}3\ \text{g}
          $$
          $$
          m = \frac{0{,}025}{0{,}1233} = 0{,}203\ \text{mol/kg}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio de principio a fin. Una pieza es falsa.
        piezas:
          - texto: >-
              Nombrar: ácido sulfúrico, disulfuro de hierro (pirita), óxido de
              hierro(III), dióxido de azufre y trióxido de azufre.
          - texto: >-
              Ajustar las tres etapas:
              $4\,\mathrm{FeS_2}+11\,\mathrm{O_2}\rightarrow
              2\,\mathrm{Fe_2O_3}+8\,\mathrm{SO_2}$;
              $2\,\mathrm{SO_2}+\mathrm{O_2}\rightarrow 2\,\mathrm{SO_3}$;
              $\mathrm{SO_3}+\mathrm{H_2O}\rightarrow \mathrm{H_2SO_4}$.
          - texto: >-
              Comparar el SO2 teórico de las 4,5 t de FeS2 con los 69 153 mol
              medidos: el rendimiento de la tostación es del 92,2 %.
          - texto: >-
              El SO2 medido fija cuánta pirita reaccionó, y de ahí los 129 662
              mol de O2 de las dos primeras etapas.
          - texto: >-
              Con el 95 % de la hidratación, 65 696 mol de ácido, 6443 kg y
              3502 L.
          - texto: >-
              Con aire, 3690 m³ para los mismos 775 m³ de oxígeno, y a la
              salida la mezcla es 60,3 % de SO3 y 39,7 % de N2 en masa.
          - texto: >-
              Como el rendimiento de la primera etapa es del 92,2 %, hay que
              multiplicar por 0,922 otra vez al calcular el ácido final.
            trampa: true
            mensaje: |
              El rendimiento ya está dentro. Los 1550 m³ de SO2 son lo que
              **se produjo de verdad**, no lo teórico, así que todo lo que se
              calcula a partir de ellos ya lleva la pérdida incorporada.
              Volver a multiplicar por 0,922 la descuenta dos veces.

              Es el fallo más caro de este ejercicio precisamente porque
              parece cuidadoso: quien lo comete está acordándose del
              rendimiento, no olvidándolo.
        veredicto: |
          La estructura de todo el ejercicio es una sola cadena: el volumen
          medido de SO2 es la bisagra, y a partir de él todo lo demás sale
          hacia adelante sin volver a tocar el rendimiento de la tostación.

    resolucion: |
      **Lo que se pide.** Vale 3,50 de los 10 puntos del examen, y es el
      ejercicio más largo de los cinco. No hay ninguna cuenta difícil: lo
      difícil es que cada apartado se apoya en el anterior.

      ## 1.1 · Los nombres

      | fórmula | nombre |
      |---|---|
      | $\mathrm{H_2SO_4}$ | ácido sulfúrico |
      | $\mathrm{FeS_2}$ | disulfuro de hierro — el mineral es la pirita |
      | $\mathrm{Fe_2O_3}$ | óxido de hierro(III) |
      | $\mathrm{SO_2}$ | dióxido de azufre |
      | $\mathrm{SO_3}$ | trióxido de azufre |

      ## 1.2 · Las tres etapas, ajustadas

      $$
      4\,\mathrm{FeS_2} + 11\,\mathrm{O_2} \rightarrow
      2\,\mathrm{Fe_2O_3} + 8\,\mathrm{SO_2}
      $$
      $$
      2\,\mathrm{SO_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{SO_3}
      \qquad
      \mathrm{SO_3} + \mathrm{H_2O} \rightarrow \mathrm{H_2SO_4}
      $$

      La primera es la que cuesta. Se ajusta por partes: primero el hierro,
      después el azufre, y el oxígeno al final, que es el que obliga a
      multiplicar todo por dos para quitar el medio.

      ## 1.3 · El rendimiento, y lo que arrastra

      **1.3.1** De las 5 t solo son pirita 4,5:

      $$
      n(\mathrm{FeS_2}) = \frac{4{,}5\cdot 10^{6}}{119{,}97} = 37\,509\ \text{mol}
      \;\Longrightarrow\;
      n(\mathrm{SO_2})_{\text{teórico}} = 75\,019\ \text{mol}
      $$

      Y lo medido, a 0 °C y 1 atm, con 22,414 L por mol:

      $$
      n(\mathrm{SO_2})_{\text{real}} = \frac{1{,}55\cdot 10^{6}}{22{,}414}
      = 69\,153\ \text{mol}
      \;\Longrightarrow\;
      \boxed{\;\eta = 92{,}2\ \%\;}
      $$

      **1.3.2** Aquí está la bisagra del ejercicio entero. El oxígeno se gasta
      con la pirita que **reacciona**, no con la que se alimenta, y quién
      reaccionó lo dice el SO2 medido:

      $$
      n(\mathrm{FeS_2})_{\text{reacciona}} = \frac{69\,153}{2} = 34\,577\ \text{mol}
      \;\Longrightarrow\;
      n(\mathrm{O_2})_1 = \frac{11}{4}\cdot 34\,577 = 95\,086\ \text{mol}
      $$

      La etapa 2 va al 100 % y consume medio O2 por cada SO2:

      $$
      n(\mathrm{O_2})_2 = 34\,577
      \;\Longrightarrow\;
      \boxed{\;n(\mathrm{O_2})_{\text{total}} = 129\,662\ \text{mol}\;}
      $$

      **1.3.3** Cada SO3 da un H2SO4, con el 95 % de la hidratación:

      $$
      n = 0{,}95\cdot 69\,153 = 65\,696\ \text{mol}
      \qquad
      m = 6443\ \text{kg}
      \qquad
      \boxed{\;V = 3502\ \text{L}\;}
      $$

      ## 1.4 · El aire, y el nitrógeno que sobra

      **1.4.1** En gases a la misma presión y temperatura los volúmenes van
      como los moles, así que no hace falta pasar a moles:

      $$
      V(\mathrm{O_2}) = \frac{1550}{2} = 775\ \text{m}^{3}
      \qquad
      \boxed{\;V(\text{aire}) = \frac{775}{0{,}21} = 3690\ \text{m}^{3}\;}
      $$

      **1.4.2** El nitrógeno entra y sale sin reaccionar, y es casi cuatro
      quintas partes del aire: a la salida hay SO3 y N2.

      $$
      n(\mathrm{N_2}) = \frac{3690\cdot 0{,}79\cdot 10^{3}}{22{,}414}
      = 130\,074\ \text{mol}
      $$
      $$
      m(\mathrm{SO_3}) = 5536\ \text{kg}
      \qquad
      m(\mathrm{N_2}) = 3645\ \text{kg}
      $$
      $$
      \boxed{\;60{,}3\ \%\ \mathrm{SO_3} \quad\text{y}\quad 39{,}7\ \%\ \mathrm{N_2}\;}
      $$

      **Ojo al cambio de pregunta.** En moles el SO3 es solo el 34,7 % de la
      mezcla; en masa es el 60,3 %. La diferencia está en que el SO3 pesa casi
      el triple que el N2. Es el apartado donde más se falla, y no por la
      cuenta: por contestar en la unidad que no era.

      ## 1.5 · Las disoluciones

      **1.5.1** El reactivo del laboratorio no es ácido puro:

      $$
      n = 0{,}025\ \text{mol}
      \quad\rightarrow\quad
      2{,}452\ \text{g de ácido}
      \quad\rightarrow\quad
      \frac{2{,}452}{0{,}98} = 2{,}502\ \text{g de disolución}
      \quad\rightarrow\quad
      \boxed{\;1{,}36\ \text{mL}\;}
      $$

      **1.5.2** Diluir no cambia los moles:

      $$
      V_{\text{final}} = \frac{0{,}025}{0{,}2} = 125\ \text{mL}
      \;\Longrightarrow\;
      \boxed{\;\text{hay que añadir } 75\ \text{mL de agua}\;}
      $$

      **1.5.3** Y la molalidad va por kilos de **disolvente**, que es donde
      este apartado separa a quien ha entendido la definición de quien la ha
      memorizado. Como los volúmenes son aditivos, el agua son los 125 mL
      menos el 1,36 de ácido concentrado:

      $$
      m_{\text{agua}} = 123{,}64\cdot 0{,}997 = 123{,}3\ \text{g}
      \;\Longrightarrow\;
      \boxed{\;m = \frac{0{,}025}{0{,}1233} = 0{,}203\ \text{mol/kg}\;}
      $$

      Sale casi igual que la molaridad —0,203 frente a 0,200— y esa
      casi-coincidencia es una trampa: pasa porque la disolución es muy
      diluida y su densidad es prácticamente la del agua. En una disolución
      concentrada los dos números no se parecen en nada.

  # ── Dos puntos de los diez, y seis apartados que cuelgan de un solo dibujo:
  #    si el Lewis sale mal, los seis salen mal. Es el molde con el que esta
  #    asignatura examina el tema 3, y trae además la distinción que más se
  #    falla —geometría electrónica frente a molecular— escondida detrás de
  #    la palabra «geometría» a secas.
  - id: exfq2425-1c-2-el-cloruro-de-vinilo-de-lewis-a-las-fuerzas
    titulo: El cloruro de vinilo, y los seis apartados que cuelgan de un dibujo
    fuente: >-
      Ejercicio 2 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      El PVC (policloruro de vinilo) es un polímero muy versátil con el que se
      fabrican desde tuberías hasta ventanas. Este polímero se obtiene
      mediante la polimerización del cloruro de vinilo (CH2CHCl).

      **2.1.** Dibujar la estructura de Lewis del CH2CHCl. Razonar la
      respuesta.

      **2.2.** Analizar la hibridación de los átomos y estudiar la geometría.
      Razonar la respuesta.

      **2.3.** Indicar los ángulos de enlace y estudia la polaridad de la
      molécula indicando los momentos dipolares. Razonar la respuesta.

      **2.4.** Indicar razonadamente que fuerza(s) intermolecular(es)
      surgirá(n) entre las moléculas de CH2CHCl.

      **Datos:** Números atómicos (Z): H (1); C (6); Cl (17)
    pide: >-
      La estructura de Lewis, la hibridación de cada átomo, la geometría, los
      ángulos, la polaridad con sus momentos dipolares y las fuerzas
      intermoleculares.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con enlaces solo sencillos, uno de los dos carbonos se queda con
          seis electrones a su alrededor. ¿Qué dice eso de la estructura?
        opciones:
          - texto: Que falta un doble enlace entre los dos carbonos
            correcta: true
            mensaje: |
              Eso es. Cuando al átomo central le falta octeto se trae un par
              solitario de un vecino y se cierra un enlace múltiple. Aquí el
              único vecino que puede aportarlo es el otro carbono, y sale el
              C=C que da nombre a los compuestos vinílicos.
          - texto: Que el carbono es una excepción al octeto
            mensaje: |
              El carbono es justamente el átomo que **nunca** hace excepción:
              forma cuatro enlaces siempre. Las excepciones del temario son
              otras —el berilio, el boro, y los que expanden octeto con
              orbitales $d$—, y ninguna incluye al carbono.
          - texto: Que falta un hidrógeno en la fórmula
            mensaje: |
              La fórmula del enunciado es la que hay y no se corrige: CH2CHCl
              son tres hidrógenos. Si le añadieras uno tendrías etano
              clorado, que es otra sustancia y no polimeriza igual.
          - texto: Que el cloro debe formar un doble enlace con el carbono
            mensaje: |
              El cloro ya tiene su octeto con un enlace sencillo y tres pares
              solitarios. Forzarle un doble enlace le dejaría diez electrones,
              y el cloro no expande octeto en este compuesto.

      - tipo: calcular
        titulo: Los electrones de valencia
        pregunta: |
          ¿Cuántos electrones de valencia hay que repartir en la estructura de
          Lewis del CH2CHCl?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '31'
            mensaje: |
              Has sumado los electrones **totales**,
              $2 \times 6 + 3 \times 1 + 17$. En Lewis solo entran los de la
              capa de valencia: cuatro por carbono, uno por hidrógeno y siete
              del cloro.
          - valor: '11'
            mensaje: |
              Parece que has dado al cloro los mismos electrones que a un
              carbono, o que has contado un solo carbono. El cloro es del
              grupo 17 y aporta siete.
          - valor: '30'
            mensaje: |
              Treinta son los electrones que **caben**
              —$2 \times 8 + 3 \times 2 + 8$—, no los que hay. La diferencia
              entre las dos cifras te dice cuántos enlaces habrá.
        pista: |
          Cuatro por cada carbono, uno por cada hidrógeno y siete del cloro.
        desarrollo: |
          $$
          2 \times 4 + 3 \times 1 + 1 \times 7 = 18
          $$

          Caben $2 \times 8 + 3 \times 2 + 8 = 30$, así que
          $30 - 18 = 12$ electrones están compartidos: seis enlaces. Como
          átomos distintos solo hay cinco pares unidos, uno de los enlaces
          tiene que ser doble.

      - tipo: calcular
        titulo: El ángulo de enlace
        pregunta: |
          Los dos carbonos tienen número estérico 3. ¿Cuánto valen entonces
          los ángulos de enlace alrededor de cada uno, en grados?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.1
          formato: un número entero, en grados
        distractores:
          - valor: '109.5'
            mensaje: |
              Ese es el ángulo del tetraedro, que corresponde a número
              estérico 4. Aquí has contado el doble enlace como dos
              direcciones: cuenta como una.
          - valor: '180'
            mensaje: |
              180° es geometría lineal, número estérico 2. La tendría un
              carbono con dos cosas alrededor, como el del CO₂ o el de un
              triple enlace terminal.
          - valor: '90'
            mensaje: |
              90° aparece en las geometrías octaédricas y en parte de la
              bipirámide trigonal, con números estéricos 5 y 6. Un carbono no
              llega ahí: no tiene orbitales $d$ disponibles.
        pista: |
          Número estérico 3 es hibridación $sp^{2}$ y geometría trigonal
          plana. Tres direcciones repartidas en un plano.
        desarrollo: |
          Tres direcciones que se reparten el plano por igual:

          $$
          \frac{360}{3} = 120
          $$

          Es el ideal de la trigonal plana. En la molécula real hay pequeñas
          desviaciones, porque el doble enlace ocupa algo más de sitio que un
          sencillo y el cloro es voluminoso, pero la respuesta que el examen
          pide es el valor de la geometría.

      - tipo: reconocer
        pregunta: |
          ¿Y qué hibridación tiene el átomo de cloro?
        opciones:
          - texto: $sp^{3}$, porque tiene un átomo unido y tres pares solitarios
            correcta: true
            mensaje: |
              Exacto. El número estérico se cuenta igual en un átomo terminal
              que en uno central: $1 + 3 = 4$, o sea $sp^{3}$. El apartado
              2.2 pide «la hibridación de los átomos», en plural, así que el
              cloro entra.
          - texto: $sp^{2}$, la misma que los carbonos, porque está en el mismo plano
            mensaje: |
              Estar en el plano de la molécula no impone hibridación. El
              cloro está en ese plano porque solo forma un enlace, y un
              enlace siempre está contenido en cualquier plano que lo
              contenga; sus tres pares solitarios apuntan fuera.
          - texto: No tiene hibridación, porque solo forma un enlace
            mensaje: |
              La hibridación no depende de cuántos enlaces se formen sino de
              cuántas direcciones hay que acomodar, y los pares solitarios
              también ocupan dirección. El cloro tiene que colocar cuatro
              cosas.
          - texto: $sp$, porque le sobran electrones y no necesita hibridar mucho
            mensaje: |
              $sp$ es número estérico 2, y el cloro tiene 4. Que le sobren
              electrones es justamente lo que sube el número, no lo que lo
              baja: cada par solitario cuenta.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 2.4. Una pieza es falsa.
        piezas:
          - texto: 'El enlace C–Cl es polar (3,16 frente a 2,55) y los C–H apenas lo son (2,55 frente a 2,20).'
          - texto: 'La molécula es plana y trigonal pero no simétrica: no hay ningún cloro enfrente que cancele al primero, así que queda un momento dipolar neto hacia el cloro.'
          - texto: 'Al ser polar, entre sus moléculas aparecen fuerzas dipolo-dipolo.'
          - texto: 'Y, como en toda sustancia molecular, aparecen además fuerzas de dispersión de London.'
          - texto: 'No hay enlace de hidrógeno, porque los tres hidrógenos están unidos a carbono y no a nitrógeno, oxígeno o flúor.'
          - texto: 'Como la molécula tiene hidrógenos y un átomo muy electronegativo, entre sus moléculas hay enlaces de hidrógeno.'
            trampa: true
            mensaje: |
              Le falta la condición que de verdad manda: el hidrógeno tiene
              que estar unido **directamente** a N, O o F. Aquí los tres
              cuelgan de carbonos, y el cloro —aunque sea electronegativo— es
              demasiado grande y su carga demasiado repartida para sostener un
              enlace de hidrógeno. Si esta pieza entrase, el apartado quedaría
              con la fuerza más intensa de las tres puesta donde no está.
    resolucion: |
      **2.1 · La estructura de Lewis.** Los electrones de valencia son

      $$
      2 \times 4 + 3 \times 1 + 1 \times 7 = 18
      $$

      y caben $2 \times 8 + 3 \times 2 + 8 = 30$. La diferencia,
      $30 - 18 = 12$, son seis pares compartidos. Como solo hay cinco parejas
      de átomos vecinos —tres C–H, un C–C y un C–Cl—, uno de esos enlaces
      tiene que ser doble, y el único que puede serlo es el C=C: el cloro ya
      completa octeto con un sencillo y sus tres pares solitarios, y el
      hidrógeno no puede.

      La estructura queda con un carbono llevando dos hidrógenos, el otro
      llevando un hidrógeno y el cloro, y un doble enlace entre los dos.

      **2.2 · Hibridación y geometría.** Se cuenta átomos unidos más pares
      solitarios, con el doble enlace valiendo por uno:

      | átomo | átomos unidos | pares solitarios | número estérico | hibridación |
      |---|---|---|---|---|
      | C del CH₂ | 3 | 0 | 3 | $sp^{2}$ |
      | C del CHCl | 3 | 0 | 3 | $sp^{2}$ |
      | Cl | 1 | 3 | 4 | $sp^{3}$ |

      Los dos carbonos son trigonales planos. Y como el enlace $\pi$ del doble
      enlace impide el giro, los dos triángulos quedan en el **mismo plano**:
      la molécula entera es plana.

      Conviene decirlo en términos de enlaces, porque el apartado pide
      razonar: hay **cinco enlaces $\sigma$** —tres C–H, uno C–C y uno C–Cl—
      y **un enlace $\pi$**, formado por el solapamiento lateral de los
      orbitales $2p_z$ que los dos carbonos no hibridaron.

      **2.3 · Ángulos y polaridad.** Los ángulos alrededor de cada carbono son
      los de la trigonal plana, $120°$, con las desviaciones pequeñas que cabe
      esperar por el volumen del cloro y del doble enlace.

      Para la polaridad se dibuja un vector por enlace, apuntando al átomo más
      electronegativo:

      - **C–Cl:** $3{,}16 - 2{,}55 = 0{,}61$. Es el dipolo grande, y apunta
        del carbono al cloro.
      - **C–H:** $2{,}55 - 2{,}20 = 0{,}35$. Pequeño, y apunta del hidrógeno
        al carbono.
      - **C=C:** entre dos átomos iguales, dipolo nulo.

      La geometría no tiene ningún elemento de simetría que enfrente el C–Cl
      con otro igual, así que la suma no se cancela:

      $$
      \vec{\mu}_{\text{total}} \neq \vec{0}
      $$

      **La molécula es polar**, con el momento dipolar apuntando hacia el lado
      del cloro. Merece la pena compararlo con el 1,2-dicloroeteno *trans*,
      donde los dos cloros se enfrentan y la molécula sale apolar teniendo los
      mismos enlaces: es la prueba de que aquí decide la forma.

      **2.4 · Las fuerzas intermoleculares.** Dos, y hay que descartar la
      tercera diciendo por qué:

      - **Dipolo-dipolo**, porque la molécula es polar. Es la consecuencia
        directa del apartado anterior, y por eso el examen los pone
        seguidos.
      - **Dispersión de London**, que están siempre, en toda sustancia
        molecular. Aquí además son apreciables, porque el cloro es un átomo
        grande y muy polarizable.
      - **Enlace de hidrógeno, no.** Los tres hidrógenos están unidos a
        carbono. Hace falta N, O o F para que el protón quede lo bastante
        desnudo, y el cloro no sirve pese a su electronegatividad: es
        demasiado grande.

      Las dos que sí están se agrupan como **fuerzas de van der Waals**, que
      es el nombre que el temario usa para el conjunto.

  # ── El tema 2 de esta asignatura se pregunta siempre igual: una tabla. Aquí
  #    son tres elementos y seis columnas, y la gracia está en que las filas
  #    llegan DESCOLOCADAS —traen las energías pero no dicen de quién son—, así
  #    que antes de rellenar nada hay que emparejarlas razonando la tendencia.
  #    Quien las rellena en el orden A, B, C del enunciado se equivoca en las
  #    tres filas y además contesta los dos apartados finales sobre el
  #    elemento que no es.
  - id: exfq2425-1c-3-tres-elementos-y-la-tabla-descolocada
    titulo: Tres elementos, y una tabla que hay que emparejar antes de rellenar
    fuente: >-
      Ejercicio 3 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Se dispone de 3 elementos (las letras A, B y C no se corresponden con
      los símbolos reales de dichos elementos) cuyos números atómicos son los
      siguientes: "A": Z = 20, "B": Z = 29 y "C": Z = 33.

      **3.1.** Completar la tabla, rellenando los datos que faltan en las
      columnas vacías.

      | Elemento | Grupo | Periodo | Carga del ion (o iones) más probable(s) | Carga nuclear efectiva (Zef) del electrón más externo | Energía de Ionización (kJ/mol) | Afinidad Electrónica (kJ/mol) |
      |---|---|---|---|---|---|---|
      | | | | | | 947,0 | −78,0 |
      | | | | | | 589,8 | −2,4 |
      | | | | | | 745,5 | −118,4 |

      **3.2.** Explicar razonadamente por qué el elemento con la mayor energía
      de ionización no presenta la mayor afinidad electrónica.

      **3.3.** Explicar razonadamente qué elemento tendrá la 3.ª energía de
      ionización más elevada.
    pide: >-
      La tabla completa con los tres elementos emparejados a sus energías, y
      los dos razonamientos sobre afinidad electrónica e ionizaciones
      sucesivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla da las energías pero no dice a qué elemento pertenece cada
          fila. ¿Cómo se emparejan sin sabérselas de memoria?
        opciones:
          - texto: Por la energía de ionización, que crece hacia la derecha dentro del periodo
            correcta: true
            mensaje: |
              Eso es. Los tres son del periodo 4, así que basta ordenarlos de
              izquierda a derecha en la tabla periódica —grupo 2, metal de
              transición, grupo 15— y asignar las energías de menor a mayor.
              La columna que parece un dato suelto es en realidad la llave de
              toda la tabla.
          - texto: Por la afinidad electrónica, que crece con el número atómico
            mensaje: |
              La afinidad electrónica es justamente la propiedad que **no**
              sigue una tendencia limpia, y aquí se ve: el valor más negativo
              no es ni el del $Z$ más alto ni el del más bajo. Usarla para
              emparejar es empezar por el sitio inestable.
          - texto: Por el orden en que aparecen los elementos en el enunciado
            mensaje: |
              Es lo que invita a hacer la maquetación, y es una trampa: las
              filas de la tabla no van en el orden A, B, C. Si las rellenas
              así, los tres razonamientos posteriores salen sobre el elemento
              equivocado.
          - texto: No se puede emparejar; hay que buscar los valores en una tabla de datos
            mensaje: |
              Sí se puede, y de hecho es lo que el ejercicio evalúa. Las
              energías concretas no hay que sabérselas: hay que saber
              **ordenarlas**.

      - tipo: calcular
        titulo: La carga efectiva del elemento de Z = 20
        pregunta: |
          Aplicando las reglas de Slater al electrón más externo del elemento
          con $Z = 20$, ¿cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '2.85'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              Es la cuenta ingenua, $20 - 18$, que trata a los dieciocho
              electrones internos como si taparan del todo. Slater existe
              precisamente porque no lo hacen.
          - valor: '2.50'
            mensaje: |
              Te has contado a ti mismo. El grupo $(4s^{2})$ tiene dos
              electrones, así que el que miramos tiene **un** compañero, no
              dos.
          - valor: '1.65'
            mensaje: |
              Has apantallado con $1{,}00$ los ocho electrones del tercer
              nivel. Están en la capa $n-1$, y ahí el peso es $0{,}85$.
        pista: |
          Agrupa como $(1s^{2})(2s^{2}2p^{6})(3s^{2}3p^{6})(4s^{2})$. Un
          compañero, ocho en $n-1$, diez más adentro.
        desarrollo: |
          $$
          S = 1 \times 0{,}35 + 8 \times 0{,}85 + 10 \times 1{,}00 = 17{,}15
          $$

          $$
          Z_{\text{ef}} = 20 - 17{,}15 = 2{,}85
          $$

      - tipo: calcular
        titulo: La carga efectiva del elemento de Z = 33
        pregunta: |
          Ahora el elemento con $Z = 33$, cuya configuración ordenada termina
          en $4s^{2}4p^{3}$. ¿Cuánto vale $Z_{\text{ef}}$?
        respuesta:
          tipo: numero
          valor: '6.30'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '4.80'
            mensaje: |
              Has dejado los diez electrones $3d$ fuera de la capa $n-1$. El
              tercer nivel de este elemento tiene dieciocho electrones —$3s$,
              $3p$ y $3d$— y los dieciocho apantallan con $0{,}85$.
          - valor: '5.95'
            mensaje: |
              El electrón mirado se ha contado entre sus compañeros. En
              $(4s^{2}4p^{3})$ hay cinco electrones, así que los compañeros
              son cuatro.
          - valor: '5'
            mensaje: |
              La cuenta ingenua otra vez, $33 - 28$. Con ella el arsénico y el
              fósforo tendrían la misma carga efectiva, y no la tienen.
        pista: |
          Cuatro compañeros de grupo, dieciocho electrones en la capa 3 y
          diez más adentro.
        desarrollo: |
          $$
          S = 4 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 26{,}70
          $$

          $$
          Z_{\text{ef}} = 33 - 26{,}70 = 6{,}30
          $$

          Es el valor que la colección de problemas de la asignatura publica
          para el arsénico, así que sirve de comprobación.

      - tipo: reconocer
        pregunta: |
          Apartado 3.3. ¿Qué elemento tendrá la tercera energía de ionización
          más elevada?
        opciones:
          - texto: El de $Z = 20$, porque su ion 2+ ya tiene configuración de gas noble
            correcta: true
            mensaje: |
              Exacto. Ca²⁺ es $1s^{2}2s^{2}2p^{6}3s^{2}3p^{6}$, la
              configuración del argón. El tercer electrón habría que sacarlo
              de una capa completa, y eso dispara la energía muy por encima de
              lo que costaron los dos primeros.
          - texto: El de $Z = 33$, porque es el que tiene la primera energía de ionización más alta
            mensaje: |
              La primera y la tercera no van de la mano. Lo que dispara una
              ionización sucesiva no es lo caro que fue la anterior, sino si
              el electrón que toca sacar rompe una capa cerrada. El ion 2+ del
              arsénico todavía tiene un $4p^{1}$ suelto.
          - texto: El de $Z = 29$, porque es un metal de transición y sus electrones $d$ están muy sujetos
            mensaje: |
              El ion 2+ del cobre conserva una subcapa $d$ parcialmente
              ocupada, de donde sacar un electrón más no exige romper nada
              cerrado. Ser metal de transición no encarece por sí solo la
              tercera ionización.
          - texto: Los tres tienen la tercera energía parecida, porque siempre crece igual
            mensaje: |
              Crece siempre, sí, pero no igual. El salto grande aparece
              exactamente cuando el electrón siguiente pertenece a una capa
              completa, y eso pasa en un elemento de los tres y no en los
              otros dos.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado 3.2. Una pieza es falsa.
        piezas:
          - texto: 'La mayor energía de ionización, 947,0 kJ/mol, es la del elemento de Z = 33; la afinidad más negativa, −118,4 kJ/mol, es la del de Z = 29.'
          - texto: Las dos magnitudes miden cosas opuestas, una lo que cuesta sacar un electrón y otra lo que se gana al meterlo, así que nada obliga a que el máximo de una coincida con el de la otra.
          - texto: 'El elemento de Z = 33 termina en 4p³, una subcapa semillena y por eso especialmente estable: cuesta mucho quitarle un electrón, pero meter uno más rompe esa estabilidad y aporta poco.'
          - texto: 'El de Z = 29 termina en 4s¹, y el electrón que entra completa el orbital: por eso su afinidad es la más favorable de los tres.'
          - texto: 'La afinidad electrónica es siempre el valor opuesto de la energía de ionización: si una es máxima, la otra tiene que ser mínima.'
            trampa: true
            mensaje: |
              Sería cómodo y es falso. Son procesos distintos sobre especies
              distintas —$\text{X} \rightarrow \text{X}^{+}$ frente a
              $\text{X} \rightarrow \text{X}^{-}$— y no hay ninguna relación
              aritmética entre ellos. Si la hubiera, este apartado del examen
              no tendría nada que explicar.
    resolucion: |
      **3.1 · Primero emparejar, después rellenar.** La tabla llega
      descolocada a propósito: las filas traen las energías pero no dicen de
      quién son. Los tres elementos son del periodo 4 y están ordenados de
      izquierda a derecha como grupo 2, metal de transición y grupo 15, así
      que la energía de ionización crece en ese mismo orden.

      | | Z | grupo | periodo | ion más probable | Zef del más externo | EI | AE |
      |---|---|---|---|---|---|---|---|
      | Ca | 20 | 2 (2A) | 4 | Ca²⁺ | 2,85 | 589,8 | −2,4 |
      | Cu | 29 | 11 (1B) | 4 | Cu⁺ y Cu²⁺ | ver abajo | 745,5 | −118,4 |
      | As | 33 | 15 (5A) | 4 | As³⁻ | 6,30 | 947,0 | −78,0 |

      Las dos cargas efectivas del calcio y del arsénico salen de Slater sin
      ambigüedad:

      $$
      S_{\text{Ca}} = 1 \times 0{,}35 + 8 \times 0{,}85 + 10 \times 1{,}00 = 17{,}15 \quad\Longrightarrow\quad Z_{\text{ef}} = 20 - 17{,}15 = 2{,}85
      $$

      $$
      S_{\text{As}} = 4 \times 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 26{,}70 \quad\Longrightarrow\quad Z_{\text{ef}} = 33 - 26{,}70 = 6{,}30
      $$

      **El cobre, y por qué aquí no damos un número solo.** El cobre es una de
      las dos anomalías clásicas del llenado: en vez de $3d^{9}4s^{2}$, que es
      lo que sale de aplicar Moeller sin pensar, su configuración real es
      $3d^{10}4s^{1}$, porque una subcapa $d$ completa compensa el hueco del
      $s$. Y de esa elección depende el resultado:

      - con $3d^{10}4s^{1}$, el electrón más externo no tiene compañeros de
        grupo, así que $S = 18 \times 0{,}85 + 10 \times 1{,}00 = 25{,}30$ y
        $Z_{\text{ef}} = 29 - 25{,}30 = 3{,}70$;
      - con $3d^{9}4s^{2}$, tendría un compañero y $S = 0{,}35 + 18 \times 0{,}85 + 10 \times 1{,}00 = 25{,}65$, o sea
        $Z_{\text{ef}} = 29 - 25{,}65 = 3{,}35$.

      La configuración correcta es la primera, y $3{,}70$ es la respuesta que
      defendemos. Pero **el examen no publica su solución y no tenemos la del
      profesor**, así que dejamos las dos cuentas escritas en vez de publicar
      una como si estuviera confirmada. Si tienes la corrección oficial,
      dínoslo y se cierra.

      **3.2 · Por qué el de mayor ionización no es el de mayor afinidad.** El
      arsénico gana en energía de ionización porque su $4p^{3}$ está
      semilleno, con un electrón en cada uno de los tres orbitales $p$: es una
      disposición especialmente estable y romperla cuesta. Pero esa misma
      estabilidad juega en contra cuando lo que se hace es **añadir** un
      electrón, porque el que entra tiene que aparearse en un orbital ya
      ocupado y deshace la simetría. Por eso su afinidad es modesta.

      El cobre está en la situación contraria: su $4s^{1}$ está a medio
      llenar, y el electrón que entra lo completa. Ganar esa configuración es
      favorable, y de ahí que sea el de la afinidad más negativa de los tres.

      Y la razón de fondo, que es la que hay que escribir: **son medidas de
      procesos distintos**. La ionización mide $\text{X} \rightarrow \text{X}^{+} + e^{-}$ y la
      afinidad mide $\text{X} + e^{-} \rightarrow \text{X}^{-}$. Que las dos dependan de
      $Z_{\text{ef}}$ no las convierte en la misma propiedad con el signo
      cambiado.

      **3.3 · La tercera ionización.** La respuesta es el calcio, y el
      argumento no es de tamaño ni de carga efectiva: es de capa cerrada.
      Ca²⁺ ya tiene la configuración del argón, y arrancarle un tercer
      electrón significa entrar en una capa completa. Los otros dos no están
      en esa situación: As²⁺ conserva un $4p^{1}$ y Cu²⁺ una subcapa $d$
      incompleta, y en los dos casos el tercer electrón sale de un sitio que
      no está cerrado.

      La regla general que conviene llevarse: en las ionizaciones sucesivas
      **el salto no está donde el átomo es más pequeño, sino donde el
      siguiente electrón rompe un gas noble**. Contar hasta ahí es lo único
      que hay que hacer.

  # ── Medio punto, media hoja y ninguna cuenta. Es el ejercicio más barato
  #    del examen y el que más gente deja en blanco o contesta con sentido
  #    común; lo que se puntúa es nombrar el mecanismo con su vocabulario.
  - id: exfq2425-1c-4-el-banador-y-la-presion-de-vapor
    titulo: El bañador que se seca antes, y los cuatro términos que valen medio punto
    fuente: >-
      Ejercicio 4 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      Explicar el fundamento científico de la siguiente afirmación: "después
      de bañarte en el mar lo mejor es ducharte para que el bañador se seque
      más rápido"
    pide: El mecanismo por el que la sal disuelta retrasa el secado, con su vocabulario.

    pasos:
      - tipo: reconocer
        pregunta: |
          El bañador sale del mar mojado. ¿Con qué, exactamente?
        opciones:
          - texto: Con una disolución acuosa de sales, no con agua pura
            correcta: true
            mensaje: |
              Ese es el punto de partida y sin él no hay ejercicio. El agua
              del mar lleva NaCl y otras sales disueltas, y al secarse el
              agua la sal se queda en la tela.
          - texto: Con agua pura, porque la sal se queda en el mar
            mensaje: |
              La sal está **disuelta**, no en suspensión: viaja con el agua
              allá donde vaya. De hecho todo el mundo ha visto el cerco blanco
              que deja un bañador seco, que es exactamente la sal que quedó.
          - texto: Con agua y arena, que es lo que dificulta el secado
            mensaje: |
              La arena no retiene agua ni cambia sus propiedades: se cae al
              sacudir. Lo que el enunciado quiere que expliques es un efecto
              químico, y por eso propone **ducharse** y no cepillarse.

      - tipo: calcular
        titulo: Las partículas en disolución
        pregunta: |
          Al disolverse en agua, ¿cuántas partículas en disolución produce
          cada unidad fórmula de NaCl?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Sería una si el NaCl se disolviera como molécula, y no lo hace:
              es un sólido iónico y en agua se **disocia** en Na⁺ y Cl⁻. La
              diferencia importa mucho, porque las propiedades coligativas
              cuentan partículas, no fórmulas.
          - valor: '58.5'
            mensaje: |
              Esa es la masa molar del cloruro sódico en g/mol, no un número
              de partículas.
          - valor: '4'
            mensaje: |
              Cuatro serían las de una sal como el CaCl₂ contando mal, o las
              de dos unidades fórmula. El NaCl tiene un catión y un anión.
        pista: |
          Escribe la disociación. ¿En qué se separa el NaCl al disolverse?
        desarrollo: |
          $$
          \mathrm{NaCl\,(s)} \;\longrightarrow\; \mathrm{Na^{+}\,(aq)} + \mathrm{Cl^{-}\,(aq)}
          $$

          Dos partículas. Y como el descenso de la presión de vapor es una
          propiedad coligativa —depende de cuántas partículas hay, no de
          cuáles—, esa disociación **duplica** el efecto respecto de un
          soluto que no se disociara.

      - tipo: reconocer
        pregunta: |
          Con los iones disueltos y rodeados de moléculas de agua, ¿qué le
          pasa a la presión de vapor de la disolución respecto de la del agua
          pura?
        opciones:
          - texto: Baja, porque hay menos moléculas de agua capaces de escapar
            correcta: true
            mensaje: |
              Eso es. Las moléculas que solvatan a un ion están sujetas por
              atracción ion-dipolo, y parte de la superficie la ocupan los
              propios iones. Menos moléculas escapando por segundo es una
              presión de vapor menor.
          - texto: Sube, porque los iones agitan el agua y le dan energía
            mensaje: |
              Los iones no aportan energía al agua: la sujetan. Si la presión
              de vapor subiera, el agua salada se secaría **antes** y el
              consejo del enunciado no tendría sentido.
          - texto: No cambia, porque la sal no es volátil y no aporta vapor
            mensaje: |
              Es cierto que la sal no aporta vapor, y aun así la presión de
              vapor cambia: lo que la baja no es lo que el soluto aporta, sino
              lo que le quita al disolvente. Esa es justamente la idea de una
              propiedad coligativa.
          - texto: Baja, pero solo si la disolución está saturada
            mensaje: |
              El descenso es proporcional a la cantidad de soluto disuelto y
              existe desde la primera pizca. No hace falta saturación; de
              hecho el agua de mar está lejos de estarlo.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: El bañador sale del mar empapado en una disolución acuosa de sales, no en agua pura.
          - texto: 'Las sales están disociadas en iones: cada NaCl da un Na⁺ y un Cl⁻.'
          - texto: Cada ion se rodea de moléculas de agua orientadas hacia él por atracción ion-dipolo, que quedan retenidas.
          - texto: 'Con menos moléculas capaces de escapar, la presión de vapor de la disolución es menor que la del agua pura: es un descenso coligativo.'
          - texto: 'Menos presión de vapor significa evaporación más lenta, así que el bañador tarda más en secarse; ducharse retira la sal y devuelve la presión de vapor del agua pura.'
          - texto: 'El agua salada se seca más despacio porque pesa más que el agua dulce y cuesta más evaporarla.'
            trampa: true
            mensaje: |
              La densidad no interviene: evaporarse no es levantar peso, es
              que una molécula concreta de la superficie escape. Lo que
              decide es cuántas están libres para hacerlo, y eso lo baja la
              solvatación, no la densidad.
    resolucion: |
      **Medio punto, media hoja, y cero si contestas «la sal retiene agua».**
      El enunciado no pide el fenómeno, pide el **fundamento científico**, y
      lo que se puntúa es la cadena con su vocabulario. Son cinco eslabones.

      **1 · Lo que moja el bañador es una disolución.** El agua de mar lleva
      sales disueltas, sobre todo NaCl. Al escurrirse el bañador, la
      disolución se queda en la tela.

      **2 · La sal está disociada.** El cloruro sódico es un sólido iónico y
      en agua se separa:

      $$
      \mathrm{NaCl\,(s)} \;\longrightarrow\; \mathrm{Na^{+}\,(aq)} + \mathrm{Cl^{-}\,(aq)}
      $$

      Dos partículas por unidad fórmula, no una. Conviene decirlo porque el
      efecto que viene después depende del número de partículas.

      **3 · Los iones sujetan agua.** Cada ion se rodea de moléculas de agua
      orientadas hacia él —el oxígeno hacia el catión, los hidrógenos hacia
      el anión— por interacción **ion-dipolo**. Es la solvatación, y esas
      moléculas dejan de estar libres.

      **4 · Eso baja la presión de vapor.** La presión de vapor mide cuántas
      moléculas escapan de la superficie por unidad de tiempo, en equilibrio.
      Con parte de las moléculas retenidas alrededor de los iones y parte de
      la superficie ocupada por ellos, escapan menos:

      $$
      P_{\text{disolución}} < P_{\text{agua pura}}
      $$

      Es un **descenso coligativo**: depende de cuántas partículas hay
      disueltas, no de qué son.

      **5 · Menos presión de vapor, evaporación más lenta.** Y por tanto el
      bañador tarda más en secarse. Ducharse con agua dulce arrastra la sal,
      la tela queda mojada con agua prácticamente pura, y la presión de vapor
      vuelve a ser la del disolvente puro.

      **Lo que hay que asegurarse de escribir**, porque es lo que el corrector
      busca: *disociación en iones*, *ion-dipolo*, *presión de vapor* y
      *propiedad coligativa*. La respuesta puede ser corta, pero esos cuatro
      términos tienen que estar.

  - id: exfq2425-1c-5-cuatro-solidos-por-lo-que-hacen
    titulo: Cuatro sustancias descritas por lo que hacen, y ocho candidatas
    fuente: >-
      Ejercicio 5 · Examen final del primer cuatrimestre, curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      **5.1.** Escoger razonadamente 1 compuesto de la siguiente lista (Na,
      HF, C (diamante), Ne, CaF2, F2, BaCl2 y CH4) para cada una de las
      cuatro sustancias "A", "B", "C" y "D" que se describen a continuación.
      Responder directamente en la hoja del enunciado.

      a) La sustancia "A" presenta fuerzas de Van der Waals (entre otras) y
      bulle por encima de los 0 °C, siendo la de mayor temperatura de
      ebullición en su categoría.

      b) La sustancia "B" es un buen conductor eléctrico. Además, se funde
      aproximadamente a 100 °C a presión ambiental.

      c) La sustancia "C" mantiene unidos sus átomos mediante una red
      covalente.

      d) La sustancia "D" es capaz de conducir la electricidad únicamente
      cuando está fundida. Además, presenta un punto de fusión mayor que
      cualquier otro sólido de su misma categoría (y tipo de estructura).

      **5.2.** Completar la siguiente tabla con las 4 sustancias
      seleccionadas.

      | Sustancia | Tipo de sólido | Partícula característica | Fuerzas de cohesión entre las partículas |
      |---|---|---|---|

      **Datos:**

      | Elemento | H | C | F | Ne | Na | Cl | Ca | Ba |
      |---|---|---|---|---|---|---|---|---|
      | Z | 1 | 6 | 9 | 10 | 11 | 17 | 20 | 56 |
      | Electronegatividad | 2,20 | 2,55 | 3,98 | — | 0,93 | 3,16 | 1,00 | 0,89 |
    pide: Las cuatro sustancias identificadas y la tabla con su tipo, partícula y fuerza de cohesión.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sustancia B «es un buen conductor eléctrico» y funde hacia los
          100 °C. ¿Cuál de las ocho es, y por qué las dos pistas apuntan a lo
          mismo?
        opciones:
          - texto: Na, porque conduce en estado sólido y el temario da su punto de fusión en 97,5 °C
            correcta: true
            mensaje: |
              Eso es. «Buen conductor eléctrico» a secas, sin decir «fundido»,
              solo lo cumple un metal, porque sus electrones están
              deslocalizados y se mueven en el sólido. Y el sodio es
              justamente el metal de punto de fusión bajo que el temario usa
              de ejemplo.
          - texto: CaF₂, porque es iónico y los iónicos conducen
            mensaje: |
              Los iónicos conducen **fundidos o disueltos**, no en sólido: en
              la red los iones están fijos. Y el enunciado guarda esa
              descripción para la sustancia D, así que si pones CaF₂ aquí te
              quedas sin candidata allí.
          - texto: C (diamante), porque el carbono conduce
            mensaje: |
              Estás pensando en el grafito, cuyo carbono es $sp^{2}$ y
              conduce a lo largo de las capas. El diamante es $sp^{3}$, con
              los cuatro electrones de valencia comprometidos en enlaces, y
              **no** conduce. Además funde altísimo, no a 100 °C.
          - texto: BaCl₂, porque el bario es un metal
            mensaje: |
              El bario **elemental** es un metal, pero el BaCl₂ es un compuesto
              iónico y se comporta como tal. Lo que decide el tipo de sólido
              es la sustancia entera, no uno de sus elementos.

      - tipo: calcular
        titulo: La diferencia de electronegatividad del CaF₂
        pregunta: |
          Con los datos del enunciado, ¿cuál es la diferencia de
          electronegatividad entre el flúor y el calcio en el CaF₂?
        respuesta:
          tipo: numero
          valor: '2.98'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '4.98'
            mensaje: |
              Has sumado. La diferencia que clasifica un enlace es una resta,
              y el resultado tiene que quedar entre 0 y unos 3,3.
          - valor: '2.27'
            mensaje: |
              Esa es la diferencia del BaCl₂, $3{,}16 - 0{,}89$. Son los dos
              iónicos de la lista y es fácil cruzarlos; fíjate en qué
              compuesto te piden.
          - valor: '1.78'
            mensaje: |
              Esa es la del HF, $3{,}98 - 2{,}20$. Comparte el flúor con el
              CaF₂ y por eso se confunde, pero el otro elemento cambia todo:
              con el hidrógeno el enlace es covalente polar, no iónico.
        pista: |
          Flúor 3,98 y calcio 1,00, y la operación es una resta.
        desarrollo: |
          $$
          3{,}98 - 1{,}00 = 2{,}98
          $$

          Una diferencia tan grande confirma que el enlace es iónico. Para
          comparar, la del BaCl₂ es $3{,}16 - 0{,}89 = 2{,}27$, también iónica,
          y la del HF es $3{,}98 - 2{,}20 = 1{,}78$, que ya es covalente polar.

      - tipo: reconocer
        pregunta: |
          La sustancia A tiene fuerzas de Van der Waals «entre otras» y es la
          de mayor temperatura de ebullición **de su categoría**. ¿Cuál es?
        opciones:
          - texto: HF, el único molecular de la lista con enlace de hidrógeno
            correcta: true
            mensaje: |
              Exacto. Los moleculares de la lista son HF, Ne, F₂ y CH₄, y solo
              el HF tiene el hidrógeno unido a flúor. Ese enlace de hidrógeno
              es lo que lo sube por encima de los otros tres y lo que el
              enunciado llama «entre otras».
          - texto: Ne, porque es un gas noble y no reacciona
            mensaje: |
              No reaccionar no tiene nada que ver con hervir alto. El neón es
              el que menos fuerzas intermoleculares tiene de toda la lista
              —solo dispersión, y de un átomo diminuto—, así que es el que
              hierve **más bajo**.
          - texto: CH₄, porque tiene cuatro enlaces y es el más grande
            mensaje: |
              El metano solo tiene dispersión: es apolar y sus hidrógenos
              cuelgan de un carbono, así que no hay enlace de hidrógeno. Y de
              grande tiene poco comparado con el HF en cuanto a
              polarizabilidad.
          - texto: F₂, porque el flúor es el elemento más electronegativo
            mensaje: |
              En el F₂ los dos átomos son iguales, así que el enlace es apolar
              y la molécula también: solo tiene dispersión. La
              electronegatividad del flúor solo cuenta cuando está enlazado a
              **otro** elemento.

      - tipo: justificar
        pregunta: Ordena el argumento para la sustancia D. Una pieza es falsa.
        piezas:
          - texto: 'Conducir solo cuando está fundida es la firma de un sólido iónico: los iones son los portadores y en la red están fijos.'
          - texto: 'De la lista, los iónicos son dos: CaF₂ y BaCl₂, y los dos comparten el mismo tipo de estructura.'
          - texto: El punto de fusión de un iónico crece con su energía de red, y la energía de red crece cuando los iones son más pequeños y su carga mayor.
          - texto: 'Ca²⁺ es más pequeño que Ba²⁺ y F⁻ más pequeño que Cl⁻, así que el CaF₂ tiene la energía de red mayor: la sustancia D es el CaF₂.'
          - texto: 'La sustancia D es el CaF₂ porque su diferencia de electronegatividad, 2,98, es mayor que la del BaCl₂, 2,27.'
            trampa: true
            mensaje: |
              Llega a la respuesta correcta por un camino que no vale, y es la
              trampa más fina del ejercicio. La diferencia de
              electronegatividad decide **si** el enlace es iónico; una vez que
              los dos lo son, quien ordena los puntos de fusión es la
              **energía de red**, que depende del tamaño y la carga de los
              iones. Aquí los dos criterios coinciden por casualidad, y el
              enunciado lo dice al añadir «y tipo de estructura».
    resolucion: |
      **5.1 · Las cuatro, y por qué.**

      **A · HF.** Los sólidos moleculares de la lista son HF, Ne, F₂ y CH₄.
      De los cuatro, solo el HF tiene el hidrógeno unido a flúor, así que es
      el único con enlace de hidrógeno además de las fuerzas de van der Waals
      —el «entre otras» del enunciado—. Por eso es el de mayor temperatura de
      ebullición de su categoría, y el único que supera los 0 °C.

      **B · Na.** «Buen conductor eléctrico», sin condición ninguna, solo lo
      cumple un metal: sus electrones están deslocalizados y se mueven en el
      sólido. Y el punto de fusión encaja: el temario da $97{,}5$ °C para el
      sodio, que es el «aproximadamente 100 °C» del enunciado.

      **C · C (diamante).** El enunciado lo regala —«red covalente»— y solo
      hay un candidato. Conviene recordar que el diamante es carbono $sp^{3}$
      con los cuatro electrones de valencia enlazados: por eso es muy duro, no
      conduce y funde altísimo. El grafito, $sp^{2}$, sí conduce a lo largo de
      las capas y es blando.

      **D · CaF₂.** Conducir solo fundido es la firma del sólido iónico, y de
      la lista quedan dos: CaF₂ y BaCl₂. Los dos tienen el mismo tipo de
      estructura, que es lo que el enunciado precisa entre paréntesis para
      que la comparación sea limpia. Decide la **energía de red**, que crece
      cuando los iones son más pequeños y su carga mayor: Ca²⁺ es menor que
      Ba²⁺ y F⁻ menor que Cl⁻, así que el CaF₂ funde más alto.

      Las sobrantes son Ne, F₂, CH₄ y BaCl₂, y eso es una comprobación:
      quedan cuatro, ninguna repetida.

      **5.2 · La tabla.**

      | sustancia | tipo de sólido | partícula característica | fuerzas de cohesión |
      |---|---|---|---|
      | HF | molecular | moléculas de HF | enlace de hidrógeno, dipolo-dipolo y dispersión |
      | Na | metálico | cationes Na⁺ en un mar de electrones | enlace metálico |
      | C (diamante) | covalente | átomos de carbono | enlace covalente en red tridimensional |
      | CaF₂ | iónico | iones Ca²⁺ y F⁻ | enlace iónico, atracción electrostática |

      **El fallo que decide el ejercicio.** Es la diferencia entre «conduce» y
      «conduce fundido». El apartado b y el apartado d describen conductividad
      los dos, y son dos tipos de sólido distintos: si escribes «conduce» sin
      decir cuándo, no has contestado ninguno de los dos.

      **Y una trampa de segundo orden**, la de la sustancia D. Es tentador
      elegir el CaF₂ porque tiene la diferencia de electronegatividad mayor
      —$2{,}98$ frente a $2{,}27$—, y el resultado sale bien por casualidad.
      Pero ese criterio sirve para decidir **si** un enlace es iónico, no para
      ordenar dos iónicos por su punto de fusión. Lo que ordena es la energía
      de red. Vale la pena escribirlo así, porque el enunciado se ha molestado
      en añadir «y tipo de estructura» precisamente para que la comparación se
      haga por ahí.
