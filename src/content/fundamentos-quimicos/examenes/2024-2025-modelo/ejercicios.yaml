        veredicto: |
          Con el Lewis bien dibujado, los apartados 2.2 y 2.3 se leen sobre él:
          cada átomo pesado dice su hibridación contando lo que tiene alrededor.

      - tipo: calcular
        titulo: Los pares solitarios
        pregunta: |
          En la estructura final, ¿cuántos pares solitarios hay en toda la
          molécula?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              Esos son los del esqueleto con todos los enlaces sencillos, antes
              de cerrar el doble enlace: $24 - 12 = 12$ electrones, seis pares.
              Al formar el C=O, uno de los pares del oxígeno pasa a ser
              compartido, y quedan cinco.
          - valor: '4'
            mensaje: |
              Te has dejado el par solitario del nitrógeno. Tiene cinco
              electrones de valencia y solo comparte tres, uno con cada vecino:
              los otros dos forman un par.
          - valor: '10'
            mensaje: |
              Diez son los **electrones** de esos pares, $24 - 14$. Los pares
              son la mitad.
        pista: |
          Tras los siete pares compartidos quedan $24 - 14$ electrones. Y mira
          átomo por átomo: el nitrógeno, el oxígeno del doble enlace y el del
          –OH.
        desarrollo: |
          $$
          24 - 2 \times 7 = 10\ \text{electrones}
          $$

          Cinco pares: uno en el nitrógeno, dos en el oxígeno del C=O y dos en
          el del –OH. El carbono y los hidrógenos no tienen ninguno. Es la
          estructura de la resolución oficial.

      - tipo: reconocer
        pregunta: |
          Con esa estructura de Lewis y el método del curso —átomos unidos más
          pares solitarios—, ¿qué hibridación tiene el nitrógeno?
        opciones:
          - texto: >-
              $sp^{3}$: tres átomos unidos y un par solitario, número estérico 4
            correcta: true
            mensaje: |
              Es la respuesta del curso y la de la resolución oficial: geometría
              electrónica tetraédrica y molecular de pirámide trigonal, como el
              amoniaco. En la molécula real el par del nitrógeno se reparte con
              el C=O por resonancia, como en las amidas, y el nitrógeno queda
              casi plano, mucho menos piramidal que en el amoniaco; eso queda
              fuera del curso, que asigna la hibridación sobre
              la estructura de Lewis sin cargas.
          - texto: >-
              $sp^{2}$, porque está unido a un carbono $sp^{2}$
            mensaje: |
              La hibridación no se hereda del vecino: se cuenta alrededor de
              cada átomo. El nitrógeno tiene tres átomos unidos y un par
              solitario, cuatro regiones, y con el método del curso eso es
              $sp^{3}$.
          - texto: >-
              $sp^{2}$: tres átomos unidos, número estérico 3
            mensaje: |
              Te has dejado el par solitario, que ocupa una dirección igual que
              un enlace. Es el mismo olvido que hace plano al amoniaco en los
              dibujos que están mal.
          - texto: >-
              $sp$, porque solo está unido a un átomo pesado
            mensaje: |
              Los hidrógenos también cuentan como átomos unidos. El nitrógeno
              tiene tres vecinos —dos H y el C— y además su par solitario.

      - tipo: reconocer
        pregunta: |
          ¿Y los dos oxígenos, que no son iguales?
        opciones:
          - texto: >-
              El del C=O es $sp^{2}$ y el del –OH es $sp^{3}$
            correcta: true
            mensaje: |
              Exacto. El del doble enlace tiene un átomo unido —el doble cuenta
              por uno— y dos pares solitarios: número estérico 3, $sp^{2}$. El
              del –OH tiene dos átomos unidos y dos pares: 4, $sp^{3}$, angular
              como el agua. Es lo que da la resolución oficial.
          - texto: >-
              Los dos $sp^{3}$, porque los dos tienen dos pares solitarios
            mensaje: |
              Los pares solitarios son los mismos, pero los átomos unidos no: el
              del C=O tiene uno solo, porque el doble enlace cuenta por uno, y
              el del –OH tiene dos. $1 + 2 = 3$ frente a $2 + 2 = 4$.
          - texto: >-
              Los dos $sp^{2}$, porque los dos están unidos al carbono $sp^{2}$
            mensaje: |
              La hibridación no se contagia del vecino. El oxígeno del –OH
              tiene dos átomos unidos y dos pares solitarios, cuatro regiones:
              $sp^{3}$.
          - texto: >-
              El del C=O es $sp^{3}$, porque el doble enlace cuenta por dos
            mensaje: |
              A efectos de geometría el doble enlace cuenta por uno: el enlace
              $\pi$ se monta sobre el $\sigma$ y no apunta a ningún sitio
              nuevo. Contándolo por dos, un oxígeno con un solo vecino tendría
              cuatro regiones.

      - tipo: calcular
        titulo: El ángulo alrededor del carbono
        pregunta: |
          El carbono tiene número estérico 3. ¿Cuánto valen los ángulos de enlace
          a su alrededor, en grados?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.1
          formato: un número entero, en grados
        distractores:
          - valor: '109.5'
            mensaje: |
              Ese es el ángulo tetraédrico, el de número estérico 4: has contado
              el doble enlace C=O como dos direcciones, y cuenta como una.
          - valor: '180'
            mensaje: |
              180° es la geometría lineal, número estérico 2: la de un carbono
              con dos cosas alrededor, como el del CO₂. Este tiene tres.
        pista: |
          Número estérico 3 es geometría trigonal plana: tres direcciones
          repartidas en un plano.
        desarrollo: |
          $$
          \frac{360}{3} = 120
          $$

          Los tres ángulos del carbono —N–C=O, O=C–O y N–C–O— son de 120°, y
          es lo que escribe la resolución oficial. En la molécula real se
          desvían un poco, porque el doble enlace ocupa más que un sencillo,
          pero lo que el examen pide es el valor de la geometría.

      - tipo: justificar
        pregunta: Ordena el análisis átomo por átomo de los apartados 2.2 y 2.3. Una pieza es falsa.
        piezas:
          - texto: >-
              Nitrógeno: tres átomos unidos y un par solitario, número estérico
              4, $sp^{3}$; pirámide trigonal, con ángulos de unos 109°.
          - texto: >-
              Carbono: tres átomos unidos —el doble enlace cuenta por uno— y
              ningún par, número estérico 3, $sp^{2}$; trigonal plano, a 120°.
          - texto: >-
              Oxígeno del C=O: un átomo unido y dos pares solitarios, número
              estérico 3, $sp^{2}$.
          - texto: >-
              Oxígeno del –OH: dos átomos unidos y dos pares, número estérico 4,
              $sp^{3}$; angular, con un ángulo C–O–H de unos 109° que sus dos
              pares cierran algo, como en el agua.
          - texto: >-
              Enlaces: seis $\sigma$ —uno por cada pareja de átomos unidos— y
              un $\pi$, el del C=O, que sale de los
              orbitales $p$ que el carbono y ese oxígeno no hibridaron.
          - texto: >-
              El nitrógeno y el oxígeno del –OH son $sp^{2}$ porque están unidos
              a un carbono $sp^{2}$: la hibridación del átomo central la heredan
              sus vecinos.
            trampa: true
            mensaje: |
              La hibridación se cuenta en cada átomo, con lo que tiene
              alrededor, y no pasa de un átomo a otro. El nitrógeno tiene cuatro
              regiones —tres átomos y un par— y el oxígeno del –OH otras cuatro
              —dos átomos y dos pares—: con el método del curso, los dos son
              $sp^{3}$. En la molécula real el nitrógeno sí queda casi plano,
              pero por la resonancia de su par con el C=O, no por herencia.
        veredicto: |
          Cada átomo se analiza por su cuenta sobre la estructura de Lewis,
          contando átomos unidos y pares solitarios: el vecino no decide nada.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel: **la polaridad del ácido carbámico, indicando los momentos
          dipolares** (apartado 2.3), razonada sobre la geometría de los
          apartados anteriores. El enunciado no da electronegatividades: el
          orden O > N > C > H hay que saberlo.
        rubrica:
          - punto: |
              Un vector por cada enlace polar, hacia el átomo más
              electronegativo: C=O y C–O hacia el oxígeno, C–N y N–H hacia el
              nitrógeno, O–H hacia el oxígeno.
            porque: |
              «Indicando los momentos dipolares» pide dibujarlos, no nombrarlos.
              El sentido sale del orden O > N > C > H, y un vector al revés
              cambia hacia dónde apunta la suma.
            minimo: true
          - punto: |
              La suma se hace sobre la geometría de los apartados anteriores
              —trigonal en el carbono, pirámide en el nitrógeno, angular en el
              oxígeno del –OH—, no sobre el dibujo plano del Lewis.
            porque: |
              La polaridad es una suma de vectores, y los vectores apuntan hacia
              donde están los átomos en el espacio. El tema lo dice así: la
              decide la geometría molecular, no los enlaces.
          - punto: |
              Ninguna simetría cancela los dipolos: los tres vecinos del carbono
              son distintos —el N, el O del doble enlace y el O del –OH—, y ni
              el –NH₂ ni el –OH tienen enfrente un grupo igual que los anule.
            porque: |
              Es el argumento que decide. La resolución oficial lo escribe
              centro por centro: la resultante alrededor del nitrógeno, del
              carbono y del oxígeno no es cero.
            minimo: true
          - punto: |
              La conclusión: el momento dipolar total no es cero, y la molécula
              es polar.
            porque: |
              Es la respuesta, y sin ella el apartado se queda a medias. Una
              lista de vectores sin sumarlos no dice si la molécula es polar.
            minimo: true
        veredicto: |
          Lo que decide no es que haya enlaces polares —los hay en moléculas
          apolares, como el CO₂— sino que en esta forma no hay nada que los
          anule.

    resolucion: |
      **2.1 · La estructura de Lewis.** Con los números atómicos del enunciado,
      la configuración da los electrones de valencia: el nitrógeno,
      $1s^{2}2s^{2}2p^{3}$, tiene cinco; el carbono, cuatro; cada oxígeno,
      seis, y cada hidrógeno, uno.

      $$
      5 + 4 + 2 \times 6 + 3 \times 1 = 24
      $$

      El esqueleto lo da el enunciado: el carbono en el centro, unido al
      nitrógeno y a los dos oxígenos; dos hidrógenos en el nitrógeno y uno en un
      oxígeno. Con seis enlaces sencillos se gastan 12 electrones, y los otros 12
      se reparten como pares solitarios en los átomos de fuera. Así el
      nitrógeno y los dos oxígenos llegan a ocho, pero **el carbono se queda con
      seis**: le falta un par, y se lo presta el oxígeno que no lleva
      hidrógeno, formando un doble enlace.

      La comprobación rápida del tema llega a lo mismo sin dibujar: caben
      $4 \times 8 + 3 \times 2 = 38$ electrones, hay 24, y la diferencia,
      $38 - 24 = 14$, son siete pares compartidos para solo seis parejas de
      átomos vecinos. Uno de los enlaces es doble.

      | átomo | e⁻ de valencia | no enlazantes | enlaces | carga formal |
      |---|---|---|---|---|
      | N | 5 | 2 | 3 | 0 |
      | C | 4 | 0 | 4 | 0 |
      | O del C=O | 6 | 4 | 2 | 0 |
      | O del –OH | 6 | 4 | 2 | 0 |

      Todos los átomos pesados tienen su octeto y ninguno lleva carga formal.
      Por eso el doble enlace va con ese oxígeno y no con el nitrógeno ni con el
      oxígeno del –OH: cualquiera de esas dos estructuras dejaría un +1 y un −1.
      La molécula queda con siete pares compartidos y cinco solitarios, y es la
      estructura de la resolución oficial.

      **2.2 · Hibridación y geometría.** Se cuenta alrededor de cada átomo:
      átomos unidos más pares solitarios, con el doble enlace valiendo por uno.

      | átomo | átomos unidos | pares solitarios | número estérico | hibridación | geometría |
      |---|---|---|---|---|---|
      | N | 3 | 1 | 4 | $sp^{3}$ | pirámide trigonal |
      | C | 3 | 0 | 3 | $sp^{2}$ | trigonal plana |
      | O del C=O | 1 | 2 | 3 | $sp^{2}$ | átomo terminal |
      | O del –OH | 2 | 2 | 4 | $sp^{3}$ | angular |

      Hay seis enlaces $\sigma$, uno por cada pareja de átomos vecinos, y un
      $\pi$, el del C=O, que sale del
      solapamiento lateral de los orbitales $p$ que el carbono y ese oxígeno no
      hibridaron. Las cuatro hibridaciones son las de la resolución oficial.

      Una frase sobre el nitrógeno, porque ahí el método del curso y la molécula
      real se separan: en la molécula real su par solitario se reparte con el
      C=O por resonancia, como en las amidas, y el nitrógeno queda casi plano,
      mucho menos piramidal que en el amoniaco.
      Eso queda fuera del curso, que asigna la hibridación sobre la estructura
      de Lewis sin cargas, y la respuesta del examen es $sp^{3}$.

      **2.3 · Ángulos y polaridad.** Alrededor del carbono, los tres ángulos
      son los de la trigonal plana, 120°. Alrededor del nitrógeno y del
      oxígeno del –OH, la geometría electrónica es tetraédrica y la resolución
      oficial escribe 109°: es el ángulo ideal del modelo. En el oxígeno los
      dos pares lo cierran algo, como en el agua; en el nitrógeno real pasa lo
      contrario, porque su par se reparte con el C=O (apartado 2.2) y sus
      ángulos se abren hacia 120°.

      Para la polaridad, un vector por enlace hacia el átomo más
      electronegativo, O > N > C > H: los C=O y C–O hacia el oxígeno, el C–N y
      los N–H hacia el nitrógeno, el O–H hacia el oxígeno. Ninguna simetría los
      anula: los tres vecinos del carbono son distintos y ni el –NH₂ ni el –OH
      tienen enfrente otro grupo igual. La suma no es cero:

      $$
      \vec{\mu}_{\text{total}} \neq \vec{0}
      $$

      **La molécula es polar**, que es la conclusión de la resolución oficial:
      la resultante no es cero alrededor del nitrógeno, del carbono ni del
      oxígeno.

  # ── Ejercicio 4, apartados 4.1 y 4.2: el tema 1. Nombrar cinco compuestos
  #    —el apartado que la resolución oficial NO resuelve, así que los nombres
  #    son nuestros— y la fórmula empírica de un análisis en dos experimentos
  #    con muestras distintas, que es el detalle que decide el ejercicio.
  #
  #    Los cinco nombres se corrigen con el lector de fórmulas, que compara
  #    nombres sin tildes ni conectores y acepta los sinónimos separados por
  #    « | »: la tradicional del curso, Stock, y los de prefijos donde se usan.
  #    La fórmula empírica acepta los órdenes de los elementos con el carbono
  #    delante; la oficial la escribe C₂H₃O₂Cl₃ y C₂H₃Cl₃O₂.
  - id: exfq2425-modelo-4-el-hipnotico-clorado-y-su-formula-empirica
    titulo: Un hipnótico clorado, cinco nombres y una fórmula empírica de tres pesadas
    fuente: >-
      Ejercicio 4, apartados 4.1 y 4.2 · Modelo de examen «Examen 5», curso
      2024-2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · La
      resolución guiada es nuestra, contrastada con la resolución oficial
      manuscrita del modelo: los porcentajes y la fórmula empírica, C₂H₃Cl₃O₂,
      coinciden. El apartado 4.1 no está resuelto en el documento oficial: los
      nombres son nuestros.
    nivel: examen
    enunciado: |
      A un laboratorio de química analítica ha llegado la muestra de un
      compuesto orgánico sólido clorado (formado por los elementos C, H, Cl y O)
      cristalino e incoloro que se utiliza como hipnótico. Oxidando 0.248 g de
      este compuesto, se desprenden 0.0405 g de agua y CO₂. Por otro lado,
      utilizando la masa de CO₂ obtenida, y mediante otra reacción se generan
      0.592 g de precipitado de BaCO₃ (la única fuente de C en este proceso es
      el CO₂, es decir, no hay aportación de otro reactivo). En otro
      experimento se hacen reaccionar 0.314 g del hipnótico con HNO₃ y AgNO₃,
      obteniéndose 0.816 g de AgCl.

      **Datos:**

      - Suponer que el compuesto analizado es no-electrolito y no-volátil.
      - Masas atómicas (u): H = 1.01; C = 12.01; N = 14.01; O = 16.00;
        Cl = 35.5; Ag = 107.87; Ba = 137.33

      **4.1.** Nombrar los 5 compuestos que aparecen en el ejercicio (CO₂,
      BaCO₃, HNO₃, AgNO₃, AgCl).

      **4.2.** Determinar la fórmula empírica de la muestra.

      *Los apartados 4.3 y 4.4 —la fórmula molecular por la presión osmótica y
      el diagrama de fases— son el ejercicio siguiente, con este mismo párrafo
      de partida.*
    pide: Los nombres de los cinco compuestos y la fórmula empírica del hipnótico.

    pasos:
      - tipo: reconocer
        pregunta: |
          El hidrógeno se mide en el agua, el carbono en el BaCO₃ y el cloro en
          el AgCl. ¿Y el oxígeno del compuesto?
        opciones:
          - texto: 'Por diferencia: es lo que falta hasta el 100 %'
            correcta: true
            mensaje: |
              Eso es, y no por comodidad: en una oxidación el oxígeno es
              reactivo, así que el del agua y el del CO₂ es una mezcla del que
              traía el compuesto y del que se añadió. No hay forma de
              separarlos, y por eso se resta.
          - texto: Del agua y del CO₂ que se desprenden
            mensaje: |
              Ese oxígeno viene en parte del oxidante, no del compuesto, y
              contarlo daría más del que hay. Es la regla del tema: el oxígeno
              de una combustión nunca se mide.
          - texto: Del BaCO₃, que lleva tres oxígenos por cada carbono
            mensaje: |
              El BaCO₃ solo sirve para contar carbonos, uno por cada unidad. Sus
              oxígenos vienen del CO₂ y del reactivo que lo precipita, no del
              compuesto.
          - texto: 'No hay oxígeno: el compuesto es solo C, H y Cl'
            mensaje: |
              El enunciado dice que está formado por C, H, Cl y O. Y la cuenta
              lo confirma: los tres elementos que se miden suman un 80,7 %, y
              falta un 19,3 %.

      - tipo: calcular
        titulo: El nombre del CO₂
        pregunta: ¿Cómo se llama el CO₂?
        respuesta:
          tipo: formula
          valor: 'dióxido de carbono | anhídrido carbónico | óxido de carbono(IV) | bióxido de carbono'
          formato: el nombre, en tradicional, en Stock o con prefijos
        distractores:
          - valor: monóxido de carbono
            mensaje: |
              Ese es el CO, con un solo oxígeno. El prefijo dice cuántos
              oxígenos hay, y aquí son dos: dióxido.
          - valor: anhídrido carbonoso
            mensaje: |
              Con *-oso* el carbono actuaría con el menor de sus dos números de
              oxidación, +2, y ese es el CO. En el CO₂ tiene +4, el mayor:
              anhídrido carbón**ico**.
          - valor: ácido carbónico
            mensaje: |
              Ese es el H₂CO₃, el que forma el CO₂ al reaccionar con agua. El
              CO₂ es su anhídrido: el ácido sin el agua.
        pista: |
          El carbono actúa aquí con +4, el mayor de sus dos números. En la
          tradicional del curso, el óxido de un no metal es un anhídrido; con
          prefijos, se cuentan los oxígenos.
        desarrollo: |
          Tres nombres para lo mismo: **dióxido de carbono**, con prefijos;
          **anhídrido carbónico**, en la tradicional del curso, con *-ico*
          porque el carbono usa el mayor de sus números, +4; y **óxido de
          carbono(IV)**, en Stock. La resolución oficial no resuelve el 4.1:
          esta respuesta es nuestra.

      - tipo: calcular
        titulo: El nombre del BaCO₃
        pregunta: ¿Y el BaCO₃?
        respuesta:
          tipo: formula
          valor: 'carbonato de bario | carbonato bárico | carbonato de bario(II) | trioxocarbonato(IV) de bario | trioxidocarbonato de bario'
          formato: el nombre, en tradicional o en Stock
        distractores:
          - valor: carburo de bario
            mensaje: |
              El sufijo *-uro* es de las sales binarias, sin oxígeno: el carburo
              de bario sería BaC₂. Aquí el carbono va con tres oxígenos en el
              anión carbonato.
          - valor: bicarbonato de bario
            mensaje: |
              El bicarbonato, o hidrogenocarbonato, es el HCO₃⁻, con un
              hidrógeno: su sal de bario sería Ba(HCO₃)₂. El BaCO₃ no lleva
              hidrógeno.
        pista: |
          Es la sal del ácido carbónico: el *-ico* del ácido pasa a *-ato* en
          el anión. El bario solo tiene un número de oxidación, +2.
        desarrollo: |
          El anión es el CO₃²⁻, el **carbonato**, que sale del ácido carbónico
          (*-ico* → *-ato*). El bario, Ba²⁺, lo neutraliza uno a uno:
          **carbonato de bario**, o carbonato bárico en la tradicional.

      - tipo: calcular
        titulo: El nombre del HNO₃
        pregunta: ¿Y el HNO₃?
        respuesta:
          tipo: formula
          valor: 'ácido nítrico | ácido trioxonítrico(V) | trioxonitrato(V) de hidrógeno | nitrato de hidrógeno | trioxidonitrato de hidrógeno | hidrogeno(trioxidonitrato)'
          formato: el nombre, en tradicional o en la nomenclatura actual
        distractores:
          - valor: ácido nitroso
            mensaje: |
              El ácido nitroso es el HNO₂, con el nitrógeno a +3. En el HNO₃ el
              nitrógeno actúa con +5, el mayor de los dos que dan oxoácido, y
              eso es *-ico*: ácido nítrico.
          - valor: nitrito de hidrógeno
            mensaje: |
              El *-ito* corresponde al ácido en *-oso*, el HNO₂. El HNO₃ lleva
              un oxígeno más: su anión es el nitr**ato**, y el compuesto, nitrato
              de hidrógeno o ácido nítrico.
        pista: |
          Calcula el número de oxidación del nitrógeno: el hidrógeno aporta +1 y
          cada oxígeno −2. Y el nitrógeno forma oxoácidos con +3 y con +5.
        desarrollo: |
          $$
          (+1) + x + 3(-2) = 0 \;\Longrightarrow\; x = +5
          $$

          El mayor de los dos números con los que el nitrógeno da oxoácido, así
          que *-ico*: **ácido nítrico**.

      - tipo: calcular
        titulo: El nombre del AgNO₃
        pregunta: ¿Y el AgNO₃?
        respuesta:
          tipo: formula
          valor: 'nitrato de plata | nitrato argéntico | nitrato de plata(I) | trioxonitrato(V) de plata | trioxidonitrato de plata'
          formato: el nombre, en tradicional o en Stock
        distractores:
          - valor: nitrito de plata
            mensaje: |
              El nitrito es el NO₂⁻, del ácido nitroso. Aquí el anión lleva tres
              oxígenos, NO₃⁻: nitrato.
          - valor: nitruro de plata
            mensaje: |
              El *-uro* es de las sales binarias: el nitruro de plata sería
              Ag₃N, sin oxígeno. El AgNO₃ es una oxisal.
        pista: |
          Es la sal del ácido nítrico con la plata, que solo actúa con +1.
        desarrollo: |
          Del ácido nítrico sale el anión **nitrato**, NO₃⁻, y la plata, Ag⁺, lo
          neutraliza uno a uno: **nitrato de plata**. Como la plata solo tiene
          un número de oxidación, no hace falta decirlo; la tradicional dice
          nitrato argéntico.

      - tipo: calcular
        titulo: El nombre del AgCl
        pregunta: ¿Y el AgCl?
        respuesta:
          tipo: formula
          valor: 'cloruro de plata | cloruro argéntico | cloruro de plata(I) | monocloruro de plata'
          formato: el nombre, en tradicional o en Stock
        distractores:
          - valor: clorato de plata
            mensaje: |
              El clorato es un oxoanión, el ClO₃⁻: el clorato de plata sería
              AgClO₃. El AgCl no lleva oxígeno, y una sal binaria termina en
              *-uro*.
          - valor: cloruro argentoso
            mensaje: |
              La plata solo tiene un número de oxidación, +1, así que no hay
              *-oso* e *-ico* entre los que elegir. En la tradicional, con un
              solo número se usa *-ico*: cloruro argéntico, o cloruro de plata.
        pista: |
          Es una sal binaria, sin oxígeno: el no metal termina en *-uro*.
        desarrollo: |
          El cloro actúa con −1 y da el anión **cloruro**, Cl⁻; la plata, Ag⁺.
          Uno a uno: **cloruro de plata**. Es el precipitado blanco que sirve
          para medir el cloro de la muestra.

      - tipo: calcular
        titulo: El porcentaje de hidrógeno
        pregunta: |
          ¿Qué porcentaje en masa de hidrógeno tiene el hipnótico?
        respuesta:
          tipo: numero
          valor: '1.83'
          tolerancia: 0.01
          formato: el porcentaje en masa, con dos decimales
        distractores:
          - valor: '0.92'
            mensaje: |
              Te has dejado el 2: cada molécula de agua lleva **dos**
              hidrógenos, y los dos venían del compuesto. Sale la mitad del
              porcentaje real.
          - valor: '16.33'
            mensaje: |
              Has dividido la masa de agua entera entre la muestra,
              $0{,}0405/0{,}248$, como si toda fuera hidrógeno. Del agua solo es
              hidrógeno lo que pesan sus dos hidrógenos: unos 2 g de cada 18.
        pista: |
          Moles de agua, por dos hidrógenos, por 1,01 g/mol, y entre los
          0,248 g de la muestra que se oxidó. La masa molar del agua, con las
          masas del enunciado, es 18,02 g/mol.
        desarrollo: |
          $$
          \%\,\mathrm{H} = \frac{0{,}0405}{18{,}02}\cdot 2 \cdot 1{,}01
          \cdot \frac{100}{0{,}248} = 1{,}831\ \%
          $$

          La resolución oficial divide entre 18 g/mol en vez de 18,02 y escribe
          1,832 %: la casilla acepta los dos.

      - tipo: calcular
        titulo: El porcentaje de carbono
        pregunta: |
          ¿Y de carbono, a partir de los 0,592 g de BaCO₃?
        respuesta:
          tipo: numero
          valor: '14.53'
          tolerancia: 0.03
          formato: el porcentaje en masa, con dos decimales
        distractores:
          - valor: '65.14'
            mensaje: |
              Has tratado los 0,592 g como si fueran de CO₂. Son de BaCO₃, que
              pesa 197,34 g/mol y no 44,01: la misma cantidad de carbono viene
              envuelta en mucha más masa.
          - valor: '11.47'
            mensaje: |
              Has dividido entre los 0,314 g del otro experimento. El carbono
              sale de la oxidación de los 0,248 g: cada porcentaje se calcula
              sobre la muestra en la que se midió.
        pista: |
          Cada unidad de BaCO₃ lleva un carbono, y todo ese carbono venía del
          compuesto: el enunciado dice que no hay otra fuente.
        desarrollo: |
          $$
          M(\mathrm{BaCO_3}) = 137{,}33 + 12{,}01 + 3 \cdot 16{,}00 = 197{,}34\ \text{g/mol}
          $$

          $$
          \%\,\mathrm{C} = \frac{0{,}592}{197{,}34}\cdot 12{,}01
          \cdot \frac{100}{0{,}248} = 14{,}53\ \%
          $$

          La resolución oficial redondea la masa molar a 197 y escribe 14,55 %:
          también entra en la casilla.

      - tipo: calcular
        titulo: El porcentaje de cloro
        pregunta: |
          ¿Y de cloro, con el AgCl del otro experimento?
        respuesta:
          tipo: numero
          valor: '64.35'
          tolerancia: 0.03
          formato: el porcentaje en masa, con dos decimales
        distractores:
          - valor: '81.47'
            mensaje: |
              Has dividido entre los 0,248 g de la oxidación. El cloro se midió
              en **otro experimento**, sobre 0,314 g de hipnótico, y es sobre
              esa masa donde hay que calcularlo.
          - valor: '128.69'
            mensaje: |
              Has contado un Cl₂, 71 g/mol, por cada AgCl. Cada AgCl lleva un
              solo átomo de cloro, y un porcentaje por encima de 100 es la
              señal de que sobra algo.
        pista: |
          Un cloro por cada AgCl, con $M(\mathrm{AgCl}) = 107{,}87 + 35{,}5$, y
          el porcentaje sobre los 0,314 g de esa muestra.
        desarrollo: |
          $$
          \%\,\mathrm{Cl} = \frac{0{,}816}{143{,}37}\cdot 35{,}5
          \cdot \frac{100}{0{,}314} = 64{,}35\ \%
          $$

          La resolución oficial escribe 64,34 %.

      - tipo: calcular
        titulo: La fórmula empírica
        pregunta: |
          Con el oxígeno por diferencia, ¿cuál es la fórmula empírica del
          hipnótico?
        respuesta:
          tipo: formula
          valor: 'C2H3Cl3O2 | C2H3O2Cl3 | C2Cl3H3O2 | C2Cl3O2H3 | C2O2H3Cl3 | C2O2Cl3H3'
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: 'CHClO | CHOCl | CClHO | CClOH | COHCl | COClH'
            mensaje: |
              Has redondeado 1,5 a 1. Un cociente que sale 1,5 no se redondea:
              se multiplican todos por dos, y queda C₂H₃Cl₃O₂. El 1,5 del
              hidrógeno y del cloro sale limpio, a tres milésimas, y eso ya
              avisa de que no es un error del análisis.
          - valor: 'CH2Cl2O | CH2OCl2 | CCl2H2O | CCl2OH2 | COH2Cl2 | COCl2H2'
            mensaje: |
              Has redondeado 1,5 a 2, y un 1,5 no se redondea ni hacia arriba
              ni hacia abajo: se multiplica todo por dos. Con dos hidrógenos y
              dos cloros por carbono en vez de uno y medio, la fórmula lleva un
              tercio más de los dos, y es la de otra sustancia.
          - valor: 'C2H3Cl3 | C2Cl3H3'
            mensaje: |
              Te has dejado el oxígeno. Los tres porcentajes medidos suman un
              80,7 %: el 19,3 % que falta es oxígeno, y en moles son dos por
              cada dos carbonos.
        pista: |
          Pasa los cuatro porcentajes a moles, divide entre el más pequeño y, si
          algún cociente sale 1,5, multiplica todos por dos.
        desarrollo: |
          $$
          \%\,\mathrm{O} = 100 - 1{,}831 - 14{,}53 - 64{,}35 = 19{,}29\ \%
          $$

          | | % | moles en 100 g | entre 1,206 | por 2 |
          |---|---|---|---|---|
          | C | 14,53 | 1,210 | 1,00 | 2 |
          | H | 1,831 | 1,812 | 1,50 | 3 |
          | Cl | 64,35 | 1,813 | 1,50 | 3 |
          | O | 19,29 | 1,206 | 1 | 2 |

          La fórmula empírica es **C₂H₃Cl₃O₂**, la misma de la resolución
          oficial, que la escribe C₂H₃O₂Cl₃: el orden de los elementos no cambia
          nada.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Los nombres: dióxido de carbono, carbonato de bario, ácido
              nítrico, nitrato de plata y cloruro de plata.
          - texto: >-
              El hidrógeno sale del agua, dos por molécula: un 1,83 % sobre los
              0,248 g oxidados.
          - texto: >-
              El carbono sale del BaCO₃, uno por unidad, y todo venía del
              compuesto: un 14,53 %.
          - texto: >-
              El cloro se mide sobre los 0,314 g del otro experimento: un
              64,35 %.
          - texto: >-
              El oxígeno, por diferencia hasta el 100 %: un 19,29 %.
          - texto: >-
              En moles, C : H : Cl : O = 1 : 1,5 : 1,5 : 1, y por dos,
              C₂H₃Cl₃O₂.
          - texto: >-
              Como el cloro se midió en otro experimento, su porcentaje se
              calcula sobre la suma de las dos muestras, 0,562 g.
            trampa: true
            mensaje: |
              Cada porcentaje es una proporción **dentro de su muestra**, y se
              calcula sobre la masa que se analizó en ese experimento: el cloro
              sobre 0,314 g, el carbono y el hidrógeno sobre 0,248 g. Sumar las
              dos masas mezcla dos análisis independientes: daría un 35,95 % de
              cloro, el oxígeno por diferencia se inflaría hasta el 47,7 % y la
              fórmula saldría la de otra sustancia.
        veredicto: |
          Cada elemento se pesa en un compuesto distinto y en una muestra
          distinta. Lo que los une es pasarlos todos a porcentaje, cada uno
          sobre su propia muestra, y el oxígeno por lo que falta.

    resolucion: |
      **4.1 · Los nombres.** La resolución oficial no resuelve este apartado;
      los nombres son nuestros, en la tradicional del curso y con los de Stock y
      de prefijos que también se aceptan.

      | fórmula | nombre |
      |---|---|
      | CO₂ | dióxido de carbono · anhídrido carbónico · óxido de carbono(IV) |
      | BaCO₃ | carbonato de bario · carbonato bárico |
      | HNO₃ | ácido nítrico · nitrato de hidrógeno |
      | AgNO₃ | nitrato de plata · nitrato argéntico |
      | AgCl | cloruro de plata · cloruro argéntico |

      **4.2 · La fórmula empírica.** Cada elemento se mide en un sitio: el
      hidrógeno en el agua, el carbono en el BaCO₃ —el enunciado dice que todo
      su carbono sale del CO₂— y el cloro en el AgCl, sobre otra muestra. El
      oxígeno no se mide nunca: en la oxidación es reactivo, así que va por
      diferencia.

      $$
      \%\,\mathrm{H} = \frac{0{,}0405}{18{,}02}\cdot 2 \cdot 1{,}01
      \cdot \frac{100}{0{,}248} = 1{,}831\ \%
      $$

      $$
      \%\,\mathrm{C} = \frac{0{,}592}{197{,}34}\cdot 12{,}01
      \cdot \frac{100}{0{,}248} = 14{,}53\ \%
      $$

      $$
      \%\,\mathrm{Cl} = \frac{0{,}816}{143{,}37}\cdot 35{,}5
      \cdot \frac{100}{0{,}314} = 64{,}35\ \%
      $$

      $$
      \%\,\mathrm{O} = 100 - 1{,}831 - 14{,}53 - 64{,}35 = 19{,}29\ \%
      $$

      **El cloro va sobre 0,314 g**, no sobre 0,248: es la trampa del
      enunciado, y cada porcentaje se calcula sobre la muestra en la que se
      midió. Pasando a moles en 100 g y dividiendo entre el menor, el del
      oxígeno:

      $$
      \mathrm{C} : \mathrm{H} : \mathrm{Cl} : \mathrm{O}
      = 1{,}210 : 1{,}812 : 1{,}813 : 1{,}206
      = 1 : 1{,}5 : 1{,}5 : 1
      $$

      Los dos 1,5 no se redondean: se multiplica todo por dos.

      $$
      \boxed{\;\text{fórmula empírica: } \mathrm{C_2H_3Cl_3O_2}\;}
      $$

      Es la de la resolución oficial, que escribe C₂H₃O₂Cl₃ y llega a los
      mismos porcentajes: 1,832 % de hidrógeno porque divide el agua entre 18
      g/mol, 14,55 % de carbono porque redondea el BaCO₃ a 197 g/mol, 64,34 % de
      cloro y 19,28 % de oxígeno. Añade además «otra forma de hacer el
      ejercicio»: con la masa molar del apartado siguiente, 165 g/mol, cuenta los
      moles de cada elemento en un mol de compuesto —3 de hidrógeno, 2 de
      carbono, 3 de cloro y, por diferencia de masas, 2 de oxígeno— y llega a la
      molecular directamente. Es el hidrato de cloral, uno de los hipnóticos más
      antiguos, aunque el enunciado no lo nombra.

  # ── Ejercicio 4, apartados 4.3 y 4.4: el tema 4. La presión osmótica para
  #    la masa molar, Raoult y el diagrama de fases. El diagrama de 4.4.b es
  #    un paso `dibujar` con la figura calculada: curvas de Clausius-Clapeyron
  #    en unidades arbitrarias, la de la disolución multiplicada por una
  #    fracción molar exagerada para que el hueco se vea, y el punto triple de
  #    la disolución sobre la curva de sublimación del hielo, que es la misma.
  #
  #    La errata que importa: el enunciado dice 1122 mmHg y la resolución
  #    oficial calcula con 1125. Da 165,1 g/mol donde con el dato del enunciado
  #    salen 165,6; la fórmula molecular no cambia. La casilla acepta los
  #    caminos razonables —R = 0,082 o 0,08206, T = 298 o 298,15 K— y el
  #    valor oficial entra como distractor, con un mensaje que dice también
  #    que redondear la presión a 1,48 atm lleva al mismo número.
  #
  #    El original lleva un acento grave suelto después de «compuesto.» al
  #    final del 4.3, una marca de tecleo sin contenido: no se reproduce.
  - id: exfq2425-modelo-4-el-hipnotico-por-su-presion-osmotica
    titulo: El mismo hipnótico, su masa molar por ósmosis y su disolución en el diagrama de fases
    fuente: >-
      Ejercicio 4, apartados 4.3 y 4.4 · Modelo de examen «Examen 5», curso
      2024-2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · La
      resolución guiada es nuestra, contrastada con la resolución oficial
      manuscrita del modelo: coinciden la fórmula molecular, C₂H₃Cl₃O₂, la
      comparación de presiones de vapor y el diagrama de fases. La masa molar
      no: la resolución oficial calcula con 1125 mmHg en vez de los 1122 del
      enunciado y obtiene 165 g/mol, y con el dato del enunciado son 165,6.
    nivel: examen
    enunciado: |
      A un laboratorio de química analítica ha llegado la muestra de un
      compuesto orgánico sólido clorado (formado por los elementos C, H, Cl y O)
      cristalino e incoloro que se utiliza como hipnótico. Oxidando 0.248 g de
      este compuesto, se desprenden 0.0405 g de agua y CO₂. Por otro lado,
      utilizando la masa de CO₂ obtenida, y mediante otra reacción se generan
      0.592 g de precipitado de BaCO₃ (la única fuente de C en este proceso es
      el CO₂, es decir, no hay aportación de otro reactivo). En otro
      experimento se hacen reaccionar 0.314 g del hipnótico con HNO₃ y AgNO₃,
      obteniéndose 0.816 g de AgCl.

      **Datos:**

      - Suponer que el compuesto analizado es no-electrolito y no-volátil.
      - Masas atómicas (u): H = 1.01; C = 12.01; N = 14.01; O = 16.00;
        Cl = 35.5; Ag = 107.87; Ba = 137.33

      **4.3.** Para el cálculo de la fórmula molecular del compuesto sólido en
      el laboratorio se preparó se disolvió 1g del compuesto en agua obteniendo
      100 mL de disolución. Posteriormente se midió la presión osmótica de la
      disolución siendo 1122 mmHg a 25 °C. Indicar la fórmula molecular del
      compuesto.

      **4.4.** Comparando la solución preparada en el apartado anterior con el
      disolvente (agua):

      **4.4.a.** ¿Quién tendrá mayor presión de vapor? **Razonar la respuesta**.

      **4.4.b.** Representar el diagrama de fases (P *vs* T) indicando las
      curvas teóricas (cualitativas) de la disolución y del disolvente. A partir
      del diagrama, deducir cuál tendrá mayor temperatura de ebullición (1 atm).

      *Los apartados 4.1 y 4.2 —los cinco nombres y la fórmula empírica,
      C₂H₃Cl₃O₂— son el ejercicio anterior. «Se preparó se disolvió» está así en
      el original: sobra uno de los dos verbos.*
    pide: >-
      La fórmula molecular a partir de la presión osmótica, quién tiene mayor
      presión de vapor, el diagrama de fases de la disolución y del disolvente,
      y cuál hierve a mayor temperatura.

    pasos:
      - tipo: reconocer
        pregunta: |
          La fórmula empírica ya está: C₂H₃Cl₃O₂. ¿Qué le falta para ser la
          molecular, y de dónde sale aquí?
        opciones:
          - texto: La masa molar, y la da la presión osmótica de la disolución
            correcta: true
            mensaje: |
              Eso es. La empírica solo dice la proporción; la molecular es
              (C₂H₃Cl₃O₂)ₙ, y $n$ sale de comparar la masa molar medida con la
              de la empírica. La presión osmótica es la propiedad coligativa con
              la que se miden masas molares, porque da presiones grandes con muy
              poco soluto.
          - texto: 'Nada: la fórmula empírica y la molecular son siempre la misma'
            mensaje: |
              A veces coinciden —aquí sí, se verá—, pero no siempre: la glucosa,
              C₆H₁₂O₆, tiene de empírica CH₂O. Sin la masa molar no se puede
              saber.
          - texto: La densidad de la disolución, que el enunciado no da
            mensaje: |
              Para la presión osmótica basta la molaridad: masa, volumen de
              disolución y temperatura. La densidad haría falta para la
              molalidad o la fracción molar, que aquí no se piden.
          - texto: >-
              El número de partículas que da cada molécula, porque el compuesto
              lleva cloro y puede soltarlo como cloruro
            mensaje: |
              Eso lo resuelve el propio enunciado al decir que es no-electrolito:
              no se disocia, cada molécula es una sola partícula y el factor de
              van 't Hoff vale 1. El cloro está unido al carbono, no suelto.

      - tipo: calcular
        titulo: La masa molar del hipnótico
        pregunta: |
          Con 1 g disuelto en 100 mL de disolución y 1122 mmHg de presión
          osmótica a 25 °C, ¿cuál es la masa molar del compuesto?
        respuesta:
          tipo: numero
          valor: '165.6'
          tolerancia: 0.55
          formato: la masa molar en g/mol, con una cifra decimal
        distractores:
          - valor: '16791'
            mensaje: |
              Has usado R = 8,314 J/(mol·K) con la presión en atmósferas y el
              volumen en litros. Esa R va con pascales y metros cúbicos; con
              atm y L, la que toca es 0,082 atm·L/(mol·K).
          - valor: '13.89'
            mensaje: |
              Has puesto la temperatura en grados Celsius, 25 en vez de
              298,15 K. La ecuación de la presión osmótica, como la de los
              gases, va siempre en kelvin.
          - valor: '0.1656'
            mensaje: |
              Has dejado el volumen en mililitros. Con R en atm·L/(mol·K), el
              volumen va en litros: 0,100 L, no 100. (Si te sale 0,218, lo que
              has dejado sin pasar es la presión: 1122 mmHg son 1,4763 atm.)
        pista: |
          $\pi V = nRT$ con $n = m/M$: la presión en atmósferas, dividiendo
          entre 760; el volumen en litros, y la temperatura en kelvin.
        desarrollo: |
          $$
          \pi = \frac{1122}{760} = 1{,}4763\ \text{atm}
          $$

          $$
          M = \frac{m\,R\,T}{\pi\,V} = \frac{1\cdot 0{,}082\cdot 298{,}15}{1{,}4763\cdot 0{,}100}
          = 165{,}6\ \text{g/mol}
          $$

          Con 298 K salen 165,5, y con R = 0,08206, 165,7; redondeando la
          presión a 1,48 atm antes de dividir, entre 165,1 y 165,3. La casilla
          acepta todo ese margen. La resolución oficial escribe 1125 mmHg en
          vez de los 1122 del enunciado y obtiene 165 g/mol; la diferencia no
          cambia la fórmula molecular.

      - tipo: calcular
        titulo: La fórmula molecular
        pregunta: |
          Con esa masa molar y la fórmula empírica C₂H₃Cl₃O₂, ¿cuál es la
          fórmula molecular?
        respuesta:
          tipo: formula
          valor: 'C2H3Cl3O2 | C2H3O2Cl3 | C2Cl3H3O2 | C2Cl3O2H3 | C2O2H3Cl3 | C2O2Cl3H3'
          formato: la fórmula, con los subíndices como números
        distractores:
          - valor: 'C4H6Cl6O4 | C4H6O4Cl6 | C4Cl6H6O4 | C4Cl6O4H6 | C4O4H6Cl6 | C4O4Cl6H6'
            mensaje: |
              Eso sería $n = 2$: una masa molar de 331 g/mol, el doble de la
              medida. El 2 por el que se multiplicó en el apartado 4.2 ya está
              dentro de la empírica —sirvió para quitar los 1,5—, y no es la
              $n$ de la molecular.
          - valor: 'C8H12Cl12O8 | C8H12O8Cl12 | C8Cl12H12O8 | C8Cl12O8H12 | C8O8H12Cl12 | C8O8Cl12H12'
            mensaje: |
              Sale $n = 4$ si metes un factor de van 't Hoff de 4, como si los
              tres cloros se soltaran como cloruro: la masa molar se multiplica
              por cuatro, 662 g/mol. El enunciado dice que el compuesto es
              no-electrolito: no se disocia, y el factor es 1.
        pista: |
          La molecular es la empírica multiplicada por un entero,
          $n = M / M_{\text{empírica}}$. Calcula la masa de C₂H₃Cl₃O₂ con las
          masas del enunciado.
        desarrollo: |
          La masa de la empírica, C₂H₃Cl₃O₂, con las masas del enunciado:

          $$
          2\cdot 12{,}01 + 3\cdot 1{,}01 + 3\cdot 35{,}5 + 2\cdot 16{,}00
          = 165{,}55\ \text{g/mol}
          $$

          $$
          n = \frac{165{,}6}{165{,}55} = 1{,}00
          $$

          La fórmula molecular es la misma que la empírica, **C₂H₃Cl₃O₂**. Es el
          resultado de la resolución oficial, que compara su 165,1 con la masa de
          la empírica y llega a la misma $n = 1$.

      - tipo: reconocer
        pregunta: |
          Apartado 4.4.a. ¿Quién tiene mayor presión de vapor, la disolución o el
          agua pura?
        opciones:
          - texto: >-
              El agua pura: en la disolución solo una fracción de las moléculas
              es de agua, y el soluto no se evapora
            correcta: true
            mensaje: |
              Es la ley de Raoult: $P = x_{1}\,P_{0}$, con $x_{1} < 1$ en cuanto
              hay soluto. El hipnótico es no volátil y no aporta vapor, y además
              le quita sitio al disolvente. La resolución oficial lo escribe
              así: $P_{0} > P_{1}$.
          - texto: La disolución, porque tiene más partículas
            mensaje: |
              Más partículas disueltas bajan la presión de vapor, no la suben:
              es un descenso coligativo. Las del soluto no escapan —es no
              volátil— y les quitan sitio a las de agua.
          - texto: >-
              Las dos igual, porque el hipnótico es no volátil y no aporta vapor
            mensaje: |
              Que no aporte vapor es cierto, y aun así la presión baja: lo que la
              baja no es lo que el soluto aporta, sino lo que le quita al
              disolvente. Es exactamente lo que dice Raoult.
          - texto: Depende de la temperatura a la que se comparen
            mensaje: |
              A cualquier temperatura la disolución queda por debajo: $P =
              x_{1}\,P_{0}$ con el mismo $x_{1} < 1$. Por eso, en el diagrama,
              las dos curvas de vapor no se cruzan.

      - tipo: dibujar
        consigna: |
          En papel: **el diagrama de fases, P frente a T, del agua y de la
          disolución**, cualitativo, con la horizontal de 1 atm, y sobre él las
          dos temperaturas de ebullición.
        comprueba:
          - punto: |
              La curva líquido-vapor de la disolución **por debajo** de la del
              agua en todo el tramo, sin cortarla.
            porque: |
              Es el apartado 4.4.a dibujado: a cualquier temperatura la
              disolución tiene menos presión de vapor, $P = x_{1}\,P_{0}$.
          - punto: |
              La horizontal de **1 atm** corta la curva del agua a 100 °C y la
              de la disolución **más a la derecha**.
            porque: |
              Un líquido hierve cuando su presión de vapor iguala a la exterior,
              y la disolución necesita más temperatura para llegar a 1 atm. Ese
              corrimiento es el ascenso ebulloscópico, $\Delta T_e$, y contesta
              la pregunta del apartado.
          - punto: |
              La línea sólido-líquido de la disolución corrida **hacia la
              izquierda**, con su punto triple más abajo, sobre la curva de
              sublimación del hielo.
            porque: |
              El hielo que se forma es agua pura, así que la curva sólido-vapor
              es la misma para las dos; la disolución la corta antes. De ahí sale
              el descenso crioscópico, $\Delta T_c$: no se pregunta, pero es la
              otra mitad de las curvas de la disolución que pide el enunciado.
          - punto: |
              Las tres zonas rotuladas —sólido, líquido y vapor— y dicho qué
              curva es de quién.
            porque: |
              Sin rótulos el dibujo no dice cuál es la curva de la disolución,
              que es justo lo que se pregunta.
        figura: |
          <svg viewBox="0 0 460 320" role="img" width="460" height="320" aria-labelledby="fq2425mfases-t fq2425mfases-d">
            <title id="fq2425mfases-t">Diagrama de fases del agua y de la disolución del hipnótico</title>
            <desc id="fq2425mfases-d">Presión frente a temperatura, sin escala. En trazo continuo, las tres curvas del agua pura: sólido-vapor, líquido-vapor y la línea sólido-líquido, casi vertical e inclinada un poco hacia la izquierda, que se cortan en el punto triple. En trazo discontinuo, las de la disolución: su curva líquido-vapor queda por debajo de la del agua en todo el tramo, porque su presión de vapor es menor, y su línea sólido-líquido está corrida hacia la izquierda, con su punto triple más abajo sobre la curva de sublimación del hielo, que es la misma para las dos. La horizontal de 1 atm corta la curva del agua a 100 °C y la de la disolución más a la derecha: la disolución hierve a mayor temperatura, y congela a menor. El hueco entre las curvas está exagerado para que se vea.</desc>
