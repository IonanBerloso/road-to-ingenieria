        veredicto: |
          El diagrama contesta solo la pregunta del final: la curva de abajo
          llega a 1 atm más tarde, así que la disolución hierve a mayor
          temperatura.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado 4.4. Una pieza es falsa.
        piezas:
          - texto: >-
              Por Raoult, la presión de vapor de la disolución es la del agua
              por su fracción molar, $P = x_{1}\,P_{0}$, y $x_{1} < 1$.
          - texto: >-
              Así que a cualquier temperatura la disolución tiene menos presión
              de vapor que el agua pura: $P_{0} > P$.
          - texto: >-
              En el diagrama P–T su curva líquido-vapor queda por debajo de la
              del agua, y corta la horizontal de 1 atm más a la derecha.
          - texto: >-
              La disolución hierve a mayor temperatura que el agua: es el
              ascenso ebulloscópico, una propiedad coligativa.
          - texto: >-
              Como el hipnótico es no volátil, la disolución hierve a 100 °C,
              igual que el agua: el soluto no se evapora y no cambia nada.
            trampa: true
            mensaje: |
              Que el soluto no se evapore es justo lo que sube la temperatura de
              ebullición. No aporta vapor y le quita sitio al disolvente, así
              que la presión de vapor de la disolución es menor y hay que
              calentarla más para que llegue a 1 atm. Si el soluto fuera volátil,
              el resultado podría ser otro; al no serlo, siempre hierve por
              encima del disolvente puro.
        veredicto: |
          Una sola idea sostiene los dos apartados: el soluto baja la presión de
          vapor, y todo lo demás —la curva de abajo, la ebullición más alta— es
          esa idea dibujada.

    resolucion: |
      **4.3 · La masa molar, y de ahí la fórmula molecular.** La empírica,
      C₂H₃Cl₃O₂, solo da la proporción. La masa molar sale de la presión
      osmótica, con $n = m/M$, la presión en atmósferas, el volumen en litros y
      la temperatura en kelvin:

      $$
      \pi = \frac{1122}{760} = 1{,}4763\ \text{atm}
      $$

      $$
      M = \frac{m\,R\,T}{\pi\,V} = \frac{1\cdot 0{,}082\cdot 298{,}15}{1{,}4763\cdot 0{,}100}
      = 165{,}6\ \text{g/mol}
      $$

      Con R = 0,082 y 298 K salen 165,5 g/mol, y con R = 0,08206, 165,7: son los
      redondeos del curso y no cambian nada. La masa de la empírica, con las
      masas del enunciado, es

      $$
      2\cdot 12{,}01 + 3\cdot 1{,}01 + 3\cdot 35{,}5 + 2\cdot 16{,}00
      = 165{,}55\ \text{g/mol}
      $$

      así que $n = 165{,}6/165{,}55 = 1$ y

      $$
      \boxed{\;\text{fórmula molecular: } \mathrm{C_2H_3Cl_3O_2}\;}
      $$

      Es la de la resolución oficial. **Su masa molar no**: la resolución
      oficial escribe 1125 mmHg donde el enunciado dice 1122, y obtiene
      165 g/mol. Con 1125 la cuenta da 165,1; con el dato del enunciado, 165,6.
      La diferencia es pequeña y no mueve la $n$, pero la cifra que se publica
      aquí es la del enunciado. Y el enunciado dice que el compuesto es
      no-electrolito: no se disocia, y cada molécula cuenta como una partícula.

      **4.4.a · La presión de vapor.** La tiene mayor **el agua pura**. Por la
      ley de Raoult, la presión de vapor de la disolución es la del disolvente
      por su fracción molar:

      $$
      P_{1} = x_{1}\,P_{0}
      \qquad
      P_{0} - P_{1} = x_{2}\,P_{0}
      $$

      con $x_{1} < 1$ y $x_{2}$ la fracción molar del soluto. El soluto es no
      volátil, no aporta vapor y le quita sitio al disolvente en la superficie:
      $P_{0} > P_{1}$, que es lo que escribe la resolución oficial.

      **4.4.b · El diagrama de fases.** La curva líquido-vapor de la disolución
      queda por debajo de la del agua a cualquier temperatura, y la horizontal
      de 1 atm la corta más a la derecha: **la disolución hierve a mayor
      temperatura** que el agua, por encima de los 100 °C. Es el ascenso
      ebulloscópico. En el mismo diagrama, la línea sólido-líquido de la
      disolución sale de un punto triple más bajo, sobre la curva de sublimación
      del hielo —que es la misma, porque el hielo que se forma es agua pura—, y
      queda a la izquierda de la del agua: congela por debajo de 0 °C. La
      resolución oficial usa un diagrama de este tipo y marca en él la bajada
      de presión, $\Delta P = x_{2}\,P_{0}$.

      Con 1 g en 100 mL, la fracción molar del soluto es pequeñísima, y las
      curvas reales casi se tocan: por eso un diagrama cualitativo exagera el
      hueco, que es lo que el enunciado pide dibujar.

  # ── Ejercicio 5, apartados 5.1 a 5.4: el tema 1. Una tostación con agua
  #    —la blenda da directamente ácido sulfúrico—, un rendimiento del 90 %
  #    que se aplica dividiendo, y las dos concentraciones del ácido.
  #
  #    La reacción del 5.1 se pregunta por su coeficiente del oxígeno: no hay
  #    lector de ecuaciones, y ajustar esta es contar el oxígeno al final.
  #
  #    Los datos del ejercicio van impresos al final, después del 5.5; esta
  #    pieza los reproduce enteros porque los necesita (las masas del Zn y del
  #    S) y avisa de dónde están.
  - id: exfq2425-modelo-5-la-blenda-y-el-acido-sulfurico
    titulo: Ácido sulfúrico de la blenda, con un rendimiento del 90 %
    fuente: >-
      Ejercicio 5, apartados 5.1 a 5.4 · Modelo de examen «Examen 5», curso
      2024-2025 · Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · La
      resolución guiada es nuestra, contrastada con la resolución oficial
      manuscrita del modelo: coinciden la ecuación ajustada, los 108,15 kg de
      blenda, el 25,9 % en masa y la molalidad de 3,57 mol/kg.
    nivel: examen
    enunciado: |
      El ácido sulfúrico puede obtenerse de la tostación de la blenda. La blenda
      es un mineral cuyo principal componente es el sulfuro de zinc, que supone
      un 53% en masa. En el proceso de la tostación se produce la siguiente
      reacción:

      sulfuro de zinc (*s*) + oxígeno (*g*) + agua (*l*) → óxido de zinc (*s*) + ácido sulfúrico (*ac*) **(rendimiento de la reacción: 90%)**

      **5.1.** Escribir la reacción.

      **5.2.** Calcular la cantidad de blenda necesaria para obtener 200 kg de
      una disolución de ácido sulfúrico 3.15 M.

      Dato: densidad de la disolución de ácido sulfúrico 3.15 M (25 °C): 1.19 g/cm³.

      **5.3.** Calcular la concentración de la disolución de ácido sulfúrico
      3.15 M en porcentaje másico.

      **5.4.** Calcular la molalidad de la disolución de ácido sulfúrico 3.15 M.

      **Datos:**

      - Masas atómicas (u): H = 1.01; C = 12.01; N = 14.01; O = 16.00;
        S = 32.06; Ar = 39.95; Zn = 65.38
      - Densidad del agua (30 °C): 0.996 g/cm³
      - Composición volumétrica del aire: 21% O₂, 78% N₂, 1% Ar
      - Suponer que el ácido sulfúrico es no-electrolito y no-volátil.

      *En el original, los datos van al final del ejercicio, después del
      apartado 5.5 —el reactor cerrado con aire—, que es el ejercicio
      siguiente.*
    pide: >-
      La reacción ajustada, la blenda necesaria para los 200 kg de disolución,
      y el porcentaje en masa y la molalidad del ácido 3,15 M.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción viene en palabras. ¿Qué fórmulas son «sulfuro de zinc»,
          «óxido de zinc» y «ácido sulfúrico»?
        opciones:
          - texto: ZnS, ZnO y H₂SO₄
            correcta: true
            mensaje: |
              Eso es. El zinc solo actúa con +2, y con el sulfuro, S²⁻, y el
              óxido, O²⁻, va uno a uno. El ácido sulfúrico es el del azufre con
              +6, el *-ico*.
          - texto: ZnSO₄, ZnO y H₂SO₄
            mensaje: |
              ZnSO₄ es el sulfato de zinc, la sal del ácido sulfúrico. El
              sulfuro, con *-uro*, es la sal binaria, sin oxígeno: ZnS.
          - texto: ZnS, ZnO y H₂SO₃
            mensaje: |
              El H₂SO₃ es el ácido sulfuroso, con el azufre a +4. El sulfúrico,
              en *-ico*, es el de +6: H₂SO₄.
          - texto: ZnS₂, ZnO₂ y H₂SO₄
            mensaje: |
              El zinc es +2 y el sulfuro y el óxido son −2: se neutralizan uno a
              uno. El ZnO₂ sería el peróxido de zinc.

      - tipo: calcular
        titulo: El coeficiente del oxígeno
        pregunta: |
          Ajustada con los coeficientes enteros más pequeños,

          $$
          \mathrm{ZnS} + x\,\mathrm{O_2} + \mathrm{H_2O} \rightarrow \mathrm{ZnO} + \mathrm{H_2SO_4}
          $$

          ¿cuánto vale $x$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2.5'
            mensaje: |
              Te has dejado el oxígeno del agua. A la izquierda hay $2x$ del O₂
              **más uno** del H₂O; a la derecha, uno del ZnO y cuatro del ácido:
              $2x + 1 = 5$.
          - valor: '1.5'
            mensaje: |
              Te has dejado el oxígeno del ZnO. A la derecha hay cinco: uno en
              el óxido y cuatro en el ácido.
          - valor: '1'
            mensaje: |
              Con un solo O₂ la ecuación no está ajustada: a la izquierda
              quedarían tres oxígenos y a la derecha cinco.
        pista: |
          El zinc, el azufre y el hidrógeno ya cuadran con coeficiente 1. Cuenta
          el oxígeno el último, a los dos lados, sin olvidar el del agua ni el
          del óxido.
        desarrollo: |
          $$
          \mathrm{ZnS\,(s)} + 2\,\mathrm{O_2\,(g)} + \mathrm{H_2O\,(l)}
          \rightarrow \mathrm{ZnO\,(s)} + \mathrm{H_2SO_4\,(ac)}
          $$

          Oxígenos: $2 \cdot 2 + 1 = 5$ a la izquierda y $1 + 4 = 5$ a la
          derecha. Es la ecuación de la resolución oficial.

      - tipo: calcular
        titulo: Los moles de ácido en los 200 kg
        pregunta: |
          ¿Cuántos moles de H₂SO₄ hay en 200 kg de disolución 3,15 M, de
          densidad 1,19 g/cm³?
        respuesta:
          tipo: numero
          valor: '529.4'
          tolerancia: 0.6
          formato: los moles de H₂SO₄, con una cifra decimal
        distractores:
          - valor: '630'
            mensaje: |
              Has tomado los 200 kg como 200 L. La densidad no es 1: 200 kg de
              esta disolución ocupan 168 L, y la molaridad va por litro.
          - valor: '749.7'
            mensaje: |
              Has multiplicado por la densidad en vez de dividir. De masa a
              volumen se divide: $V = m/\rho$.
          - valor: '0.5294'
            mensaje: |
              No has pasado los kilos a gramos. Con la densidad en g/cm³, la
              masa va en gramos: 200 000 g.
        pista: |
          La molaridad va por litro de disolución, y lo que da el enunciado es
          una masa: pásala a volumen con la densidad.
        desarrollo: |
          $$
          V = \frac{200\,000}{1{,}19} = 168\,067\ \text{cm}^{3} = 168{,}07\ \text{L}
          $$

          $$
          n(\mathrm{H_2SO_4}) = 168{,}067 \cdot 3{,}15 = 529{,}41\ \text{mol}
          $$

          La resolución oficial escribe 529 mol.

      - tipo: calcular
        titulo: La blenda necesaria
        pregunta: |
          Con el 90 % de rendimiento y la blenda al 53 % de ZnS, ¿cuántos kilos
          de blenda hacen falta?
        respuesta:
          tipo: numero
          valor: '108.15'
          tolerancia: 0.3
          formato: la masa en kg, con dos cifras decimales
        distractores:
          - valor: '97.33'
            mensaje: |
              Te has dejado el rendimiento. Con el 90 %, solo nueve de cada diez
              moles de ZnS acaban en ácido: para obtener los 529,4 mol hay que
              meter más.
          - valor: '87.60'
            mensaje: |
              Has multiplicado por 0,90 en vez de dividir. Con un rendimiento
              menor hace falta **más** reactivo, no menos; con 87,6 kg no se
              llega a los 200 kg de disolución.
          - valor: '57.32'
            mensaje: |
              Esos son los kilos de ZnS puro. La blenda solo tiene un 53 % de
              ZnS: falta dividir entre 0,53.
        pista: |
          Un ZnS por cada H₂SO₄. El rendimiento se aplica dividiendo entre 0,90,
          porque para obtener lo mismo hace falta más reactivo. Y la blenda solo
          es un 53 % de ZnS.
        desarrollo: |
          $$
          n(\mathrm{ZnS}) = \frac{529{,}41}{0{,}90} = 588{,}23\ \text{mol}
          $$

          $$
          M(\mathrm{ZnS}) = 65{,}38 + 32{,}06 = 97{,}44\ \text{g/mol}
          $$

          $$
          m_{\text{blenda}} = \frac{588{,}23 \cdot 97{,}44}{0{,}53} = 108\,146\ \text{g}
          $$

          Son 108,15 kg de blenda, y es el resultado de la resolución oficial.

      - tipo: calcular
        titulo: El porcentaje en masa
        pregunta: |
          ¿Qué porcentaje en masa de H₂SO₄ tiene la disolución 3,15 M?
        respuesta:
          tipo: numero
          valor: '25.96'
          tolerancia: 0.1
          formato: el porcentaje en masa, con dos cifras decimales
        distractores:
          - valor: '30.90'
            mensaje: |
              Has tomado el litro de disolución como 1000 g. Pesa 1190: la
              densidad es 1,19 g/cm³, no la del agua.
          - valor: '35.07'
            mensaje: |
              Has dividido entre el agua, 881 g, y no entre la disolución
              entera, 1190 g. El porcentaje en masa va sobre la disolución.
        pista: |
          Toma un litro de disolución: pesa 1190 g y lleva 3,15 mol de ácido.
        desarrollo: |
          $$
          m(\mathrm{H_2SO_4}) = 3{,}15 \cdot 98{,}08 = 308{,}95\ \text{g}
          $$

          $$
          m_{\text{disolución}} = 1000 \cdot 1{,}19 = 1190\ \text{g}
          $$

          $$
          \frac{308{,}95}{1190}\cdot 100 = 25{,}96\ \%
          $$

          La resolución oficial usa 98 g/mol para el ácido y escribe 25,9 %: la
          casilla acepta los dos.

      - tipo: calcular
        titulo: La molalidad
        pregunta: ¿Y su molalidad?
        respuesta:
          tipo: numero
          valor: '3.575'
          tolerancia: 0.01
          formato: la molalidad en mol/kg, con tres decimales
        distractores:
          - valor: '2.647'
            mensaje: |
              Has dividido entre la masa de disolución, 1,19 kg. La molalidad
              va por kilo de **disolvente**: el agua, lo que queda al quitar el
              ácido.
          - valor: '4.558'
            mensaje: |
              Has restado el ácido de 1000 g, como si el litro de disolución
              pesara un kilo. Pesa 1190 g, y el agua son 881 g.
          - valor: '3.15'
            mensaje: |
              Esa es la molaridad. Solo coincidiría con la molalidad si en un
              litro de disolución hubiera justo un kilo de agua, y aquí hay
              881 g.
        pista: |
          Molalidad es por kilo de **disolvente**. En el litro de disolución, el
          agua es lo que queda al quitar el ácido: 1190 − 308,95 g.
        desarrollo: |
          $$
          m_{\text{agua}} = 1190 - 308{,}95 = 881{,}05\ \text{g}
          $$

          $$
          m = \frac{3{,}15}{0{,}88105} = 3{,}575\ \text{mol/kg}
          $$

          La resolución oficial escribe 3,57 mol/kg.

      - tipo: justificar
        pregunta: Ordena el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación: ZnS + 2 O₂ + H₂O → ZnO + H₂SO₄, un ZnS por cada
              H₂SO₄.
          - texto: >-
              Los 200 kg de disolución ocupan 168,07 L, y a 3,15 M llevan
              529,4 mol de ácido.
          - texto: >-
              Con un 90 % de rendimiento hace falta más ZnS del que da la
              estequiometría: 529,4 / 0,90 = 588,2 mol, que son 57,32 kg.
          - texto: >-
              Como la blenda solo tiene un 53 % de ZnS, hacen falta 108,15 kg de
              blenda.
          - texto: >-
              Un litro de disolución pesa 1190 g y lleva 308,95 g de ácido: un
              25,96 % en masa y, con 881,05 g de agua, 3,575 mol/kg.
          - texto: >-
              Como el rendimiento es del 90 %, los moles de ZnS son el 90 % de
              los de ácido: 476,5 mol.
            trampa: true
            mensaje: |
              Es el error de dirección más común con un rendimiento. Si solo el
              90 % del ZnS acaba en ácido, para obtener 529,4 mol de ácido hay
              que meter **más** ZnS, no menos: se divide entre 0,90.
              Multiplicando saldrían 87,60 kg de blenda, que no darían los
              200 kg de disolución.
        veredicto: |
          Todo el ejercicio pasa por un solo número, los 529,4 mol de ácido: de
          ellos salen la blenda hacia atrás y las dos concentraciones hacia
          delante.

    resolucion: |
      **5.1 · La reacción.** Con las fórmulas —ZnS, O₂, H₂O, ZnO y H₂SO₄—, el
      zinc, el azufre y el hidrógeno cuadran con coeficiente 1, y el oxígeno se
      deja para el final: a la derecha hay $1 + 4 = 5$, y a la izquierda, uno
      del agua más los del O₂.

      $$
      \boxed{\;\mathrm{ZnS\,(s)} + 2\,\mathrm{O_2\,(g)} + \mathrm{H_2O\,(l)}
      \rightarrow \mathrm{ZnO\,(s)} + \mathrm{H_2SO_4\,(ac)}\;}
      $$

      Es la ecuación de la resolución oficial.

      **5.2 · La blenda.** La molaridad va por litro y el enunciado da una
      masa, así que primero el volumen:

      $$
      V = \frac{200\,000}{1{,}19} = 168\,067\ \text{cm}^{3}
      $$

      $$
      n(\mathrm{H_2SO_4}) = 168{,}067 \cdot 3{,}15 = 529{,}41\ \text{mol}
      $$

      Un ZnS por cada H₂SO₄, y el 90 % de rendimiento se aplica **dividiendo**,
      porque para obtener esos moles hace falta meter más ZnS del que da la
      estequiometría:

      $$
      n(\mathrm{ZnS}) = \frac{529{,}41}{0{,}90} = 588{,}23\ \text{mol}
      $$

      $$
      m_{\text{blenda}} = \frac{588{,}23 \cdot 97{,}44}{0{,}53} = 108\,146\ \text{g}
      $$

      $$
      \boxed{\;m_{\text{blenda}} = 108{,}15\ \text{kg}\;}
      $$

      Con $M(\mathrm{ZnS}) = 65{,}38 + 32{,}06 = 97{,}44$ g/mol. Es el resultado
      de la resolución oficial.

      **5.3 · El porcentaje en masa.** Sobre un litro de disolución, que pesa
      1190 g y lleva 3,15 mol de ácido:

      $$
      m(\mathrm{H_2SO_4}) = 3{,}15 \cdot 98{,}08 = 308{,}95\ \text{g}
      $$

      $$
      \frac{308{,}95}{1190}\cdot 100 = 25{,}96\ \%
      $$

      La resolución oficial usa 98 g/mol y escribe 25,9 %.

      **5.4 · La molalidad.** En ese mismo litro, el disolvente es lo que queda
      al quitar el ácido:

      $$
      m_{\text{agua}} = 1190 - 308{,}95 = 881{,}05\ \text{g}
      $$

      $$
      m = \frac{3{,}15}{0{,}88105} = 3{,}575\ \text{mol/kg}
      $$

      La resolución oficial escribe 3,57 mol/kg. En una disolución tan
      concentrada, molaridad y molalidad ya no se parecen: 3,15 frente a 3,575.

  # ── Ejercicio 5, apartado 5.5: el tema 4. La misma tostación en un reactor
  #    cerrado con aire. El reactivo limitante por un margen del 1 % de
  #    oxígeno, el nitrógeno que no reacciona y la presión de una mezcla de
  #    gases con Dalton.
  #
  #    Todos los resultados coinciden con la resolución oficial. Sus erratas
  #    son de escritura en pasos intermedios, y se dicen en la `fuente`: pone
  #    «273 + 30» y calcula con 303,15 K; escribe «0,71 mol N₂/mol aire» y
  #    calcula con 0,78 (le salen 2039,5 mol); da 26,22 mol de argón, que son
  #    26,15; y usa 18 g/mol para el agua en vez de 18,02, que no cambia nada
  #    porque el agua sobra y queda líquida.
  #
  #    El agua líquida que sobra tiene su propia presión de vapor, que el
  #    enunciado no da y la resolución oficial no suma; se dice en el mensaje
  #    de la pieza trampa sin publicar ninguna cifra.
  - id: exfq2425-modelo-5-el-reactor-cerrado-con-aire
    titulo: La misma tostación en un reactor cerrado, y el aire que queda
    fuente: >-
      Ejercicio 5, apartado 5.5 · Modelo de examen «Examen 5», curso 2024-2025 ·
      Fundamentos Químicos de la Ingeniería (25975), UPV/EHU · La resolución
      guiada es nuestra, contrastada con la resolución oficial manuscrita del
      modelo: coinciden la presión total, 1,716 atm, la del nitrógeno, 1,69 atm,
      y la composición final. En los pasos intermedios, la resolución oficial
      escribe «273 + 30» y calcula con 303,15 K, pone 0,71 donde calcula con el
      0,78 del nitrógeno, y da 26,22 mol de argón donde son 26,15.
    nivel: examen
    enunciado: |
      El ácido sulfúrico puede obtenerse de la tostación de la blenda. La blenda
      es un mineral cuyo principal componente es el sulfuro de zinc, que supone
      un 53% en masa. En el proceso de la tostación se produce la siguiente
      reacción:

      sulfuro de zinc (*s*) + oxígeno (*g*) + agua (*l*) → óxido de zinc (*s*) + ácido sulfúrico (*ac*) **(rendimiento de la reacción: 90%)**

      **5.5.** Teniendo en cuenta la reacción del proceso de tostación
      planteado en el ejercicio, en un reactor cerrado de 30 m³ se introducen
      50 kg de blenda, 65 m³ de aire (medidos a 1 atm y 30 °C) y 5.5 L de agua
      (30 °C). El proceso de tostación tiene lugar a temperaturas elevadas pero
      una vez concluida la reacción se vuelve a enfriar el reactor a 30 °C. Para
      este apartado suponer que el rendimiento de la reacción es del 100% y que
      el volumen de los sólidos y líquidos es despreciable.

      **5.5.a.** Calcular tras finalizar la reacción la presión total en el
      reactor.

      **5.5.b.** Calcular tras finalizar la reacción la presión parcial del
      nitrógeno.

      **5.5.c.** Calcular la composición volumétrica final (%) de la mezcla
      gaseosa.

      **Datos:**

      - Masas atómicas (u): H = 1.01; C = 12.01; N = 14.01; O = 16.00;
        S = 32.06; Ar = 39.95; Zn = 65.38
      - Densidad del agua (30 °C): 0.996 g/cm³
      - Composición volumétrica del aire: 21% O₂, 78% N₂, 1% Ar
      - Suponer que el ácido sulfúrico es no-electrolito y no-volátil.

      *Los apartados 5.1 a 5.4 —la ecuación ajustada, la blenda, el porcentaje
      en masa y la molalidad— son el ejercicio anterior.*
    pide: >-
      La presión total y la parcial del nitrógeno al acabar la reacción, y la
      composición en volumen de la mezcla gaseosa final.

    pasos:
      - tipo: reconocer
        pregunta: |
          Acabada la reacción y de vuelta a 30 °C, ¿qué cuenta en la presión del
          reactor?
        opciones:
          - texto: >-
              Solo los gases: el N₂ y el Ar, que no reaccionan, y el O₂ que
              sobre
            correcta: true
            mensaje: |
              Eso es. El ZnO es sólido, el ácido queda en el líquido, con el
              agua que sobra —líquida a 30 °C—, y el enunciado dice que el volumen de
              sólidos y líquidos es despreciable y que el ácido no es volátil.
              En la presión solo entran los gases.
          - texto: >-
              El aire entero, porque el reactor está cerrado y la masa se
              conserva
            mensaje: |
              La masa se conserva, pero los moles de gas no: el oxígeno que
              reacciona pasa al ZnO y al H₂SO₄ y deja de estar en el gas. Son
              544 de los 2615 mol de aire que entraron.
          - texto: 'Todo lo que se ha metido: la blenda, el aire y el agua'
            mensaje: |
              La presión es cosa de gases. La blenda y el ZnO son sólidos y el
              agua que sobra es líquida a 30 °C: ni ocupan volumen en la cuenta
              —lo dice el enunciado— ni empujan las paredes como un gas.
          - texto: Los gases y el vapor del ácido sulfúrico que se ha formado
            mensaje: |
              El enunciado supone el ácido no volátil: se queda disuelto en el
              agua líquida y no pasa al gas.

      - tipo: calcular
        titulo: Los moles de aire que entran
        pregunta: |
          ¿Cuántos moles de aire hay en los 65 m³ medidos a 1 atm y 30 °C?
        respuesta:
          tipo: numero
          valor: '2615'
          tolerancia: 4
          formato: los moles de aire, sin decimales
        distractores:
          - valor: '2900'
            mensaje: |
              Has usado 22,4 L/mol, el volumen molar a 0 °C. El aire está
              medido a 30 °C: más caliente, menos moles en el mismo volumen.
          - valor: '26423'
            mensaje: |
              Has puesto 30 en vez de 303,15 K. La ecuación de los gases va
              siempre en kelvin, y con los grados Celsius sale diez veces más
              aire del que cabe.
          - valor: '2.615'
            mensaje: |
              Has dejado el volumen en metros cúbicos. Con R en atm·L/(mol·K),
              van 65 000 L.
        pista: |
          $n = PV/RT$, con el volumen en litros y la temperatura en kelvin.
        desarrollo: |
          $$
          n_{\text{aire}} = \frac{1 \cdot 65\,000}{0{,}082 \cdot 303{,}15}
          = 2614{,}82\ \text{mol}
          $$

          De ellos, con la composición del aire:

          $$
          n(\mathrm{O_2}) = 0{,}21 \cdot 2614{,}82 = 549{,}11
          $$

          $$
          n(\mathrm{N_2}) = 0{,}78 \cdot 2614{,}82 = 2039{,}56
          $$

          $$
          n(\mathrm{Ar}) = 0{,}01 \cdot 2614{,}82 = 26{,}15
          $$

          La resolución oficial escribe «273 + 30» y calcula con 303,15 K:
          2614,82 mol, como aquí. Con 303 K justos salen 2616, y la casilla
          acepta los dos. Donde se separa es después: escribe 0,71 para el
          nitrógeno —calcula con 0,78, porque le salen 2039,5 mol— y 26,22 mol
          de argón, que son 26,15.

      - tipo: reconocer
        pregunta: |
          Entran 272,0 mol de ZnS, 549,1 de O₂ y 304,0 de agua. ¿Cuál es el
          reactivo limitante?
        opciones:
          - texto: >-
              El ZnS: pide 543,9 mol de O₂ y 272,0 de agua, y hay más de los dos
            correcta: true
            mensaje: |
              Eso es, y por poco en el oxígeno: sobran 5,2 mol de 549. Por eso
              conviene comparar con los coeficientes y no a ojo. Es lo que
              concluye la resolución oficial.
          - texto: >-
              El O₂, porque hacen falta dos por cada ZnS y es el que va más
              justo
            mensaje: |
              Va justo, pero llega: $2 \times 271{,}96 = 543{,}9$ mol, y hay
              549,1. El limitante es el que se acaba primero, no el que va más
              apurado.
          - texto: >-
              El agua, porque 5,5 L son muy poco al lado de 65 m³ de aire
            mensaje: |
              Litros de líquido y metros cúbicos de gas no se comparan: se
              comparan moles, con la proporción de la ecuación. Los 5,5 L de
              agua son 304 mol, más que los 272 que pide el ZnS.
          - texto: El aire, porque su nitrógeno no reacciona
            mensaje: |
              El nitrógeno no aparece en la ecuación, así que no puede ser
              limitante de nada. Del aire solo cuenta su oxígeno.

      - tipo: calcular
        titulo: El oxígeno que consume la tostación
        pregunta: |
          ¿Cuántos moles de O₂ consume la reacción?
        respuesta:
          tipo: numero
          valor: '543.9'
          tolerancia: 1
          formato: los moles de O₂, con una cifra decimal
        distractores:
          - valor: '272.0'
            mensaje: |
              Has gastado un O₂ por cada ZnS. La ecuación ajustada pide dos.
          - valor: '489.5'
            mensaje: |
              Has aplicado el 90 % de rendimiento de los apartados anteriores.
              En este, el enunciado dice que la reacción va al 100 %: el ZnS se
              gasta entero.
          - valor: '604.4'
            mensaje: |
              Has dividido entre el 90 % de antes. En el 5.5 el rendimiento es
              del 100 %, y el oxígeno que se gasta es el que pide el ZnS, ni más
              ni menos.
        pista: |
          El ZnS es el limitante y se gasta entero, con el rendimiento del 100 %
          que dice este apartado. Dos O₂ por cada ZnS.
        desarrollo: |
          $$
          n(\mathrm{ZnS}) = \frac{50\,000 \cdot 0{,}53}{97{,}44} = 271{,}96\ \text{mol}
          $$

          $$
          n(\mathrm{O_2})_{\text{gastado}} = 2 \cdot 271{,}96 = 543{,}92\ \text{mol}
          $$

          Sobran $549{,}11 - 543{,}92 = 5{,}19$ mol de O₂, que se quedan en el
          gas. Es una resta de dos números grandes y parecidos, y por eso baila
          con los redondeos: con 303 K salen 5,46 mol, y con R = 0,08206,
          4,79. Lo que no cambia es que sobra muy poco.

      - tipo: calcular
        titulo: La presión total
        pregunta: |
          ¿Qué presión total hay en el reactor al volver a 30 °C?
        respuesta:
          tipo: numero
          valor: '1.716'
          tolerancia: 0.006
          formato: la presión en atm, con tres decimales
        distractores:
          - valor: '2.167'
            mensaje: |
              Has contado el aire entero, como si el oxígeno no reaccionara: son
              los 65 m³ a 1 atm metidos en 30 m³. La tostación se lleva 543,9
              mol de O₂ del gas.
          - valor: '1.743'
            mensaje: |
              Has contado como gas los 32,0 mol de agua que sobran. A 30 °C esa
              agua es líquida, y el enunciado dice que el volumen de los
              líquidos es despreciable.
          - valor: '0.170'
            mensaje: |
              Has puesto la temperatura en grados Celsius, 30 en vez de
              303,15 K.
        pista: |
          Suma los moles de gas que quedan —el N₂, el Ar y el O₂ que sobra— y
          aplica $PV = nRT$ con los 30 m³ del reactor.
        desarrollo: |
          $$
          n_{\text{gas}} = 5{,}19 + 2039{,}56 + 26{,}15 = 2070{,}90\ \text{mol}
          $$

          $$
          P_T = \frac{2070{,}90 \cdot 0{,}082 \cdot 303{,}15}{30\,000}
          = 1{,}716\ \text{atm}
          $$

          Es la presión de la resolución oficial.

      - tipo: calcular
        titulo: La presión parcial del nitrógeno
        pregunta: |
          ¿Y la presión parcial del N₂?
        respuesta:
          tipo: numero
          valor: '1.690'
          tolerancia: 0.005
          formato: la presión en atm, con tres decimales
        distractores:
          - valor: '1.338'
            mensaje: |
              Has aplicado el 78 % del aire a la presión final. Pero la mezcla
              final ya no es aire: sin casi oxígeno, el nitrógeno es el 98,5 %
              del gas.
          - valor: '1.538'
            mensaje: |
              Has usado el 0,71 que aparece escrito en la resolución oficial. El
              enunciado da un 78 % de N₂, y la propia resolución calcula con él:
              le salen 2039,5 mol.
        pista: |
          El nitrógeno no reacciona: son los mismos moles que entraron, ahora en
          30 m³ y a la misma temperatura. O bien, su fracción molar por la
          presión total.
        desarrollo: |
          $$
          P(\mathrm{N_2}) = \frac{2039{,}56}{2070{,}90}\cdot 1{,}716
          = 1{,}690\ \text{atm}
          $$

          Y un atajo que lo confirma: el nitrógeno ni reacciona ni cambia de
          temperatura, así que su presión es la que tenía en el aire, 0,78 atm,
          pasada de 65 m³ a 30:

          $$
          0{,}78 \cdot \frac{65}{30} = 1{,}690\ \text{atm}
          $$

          Es el valor de la resolución oficial.

      - tipo: calcular
        titulo: El porcentaje de nitrógeno en la mezcla final
        pregunta: |
          ¿Qué porcentaje en volumen de la mezcla gaseosa final es N₂?
        respuesta:
          tipo: numero
          valor: '98.49'
          tolerancia: 0.05
          formato: el porcentaje en volumen, con dos decimales
        distractores:
          - valor: '78'
            mensaje: |
              Esa es la composición del aire que entró. Al quitarse casi todo el
              oxígeno, la mezcla cambia: el nitrógeno pasa a ser casi todo el
              gas.
          - valor: '96.99'
            mensaje: |
              Has sumado al gas los 32,0 mol de agua que sobran, y a 30 °C esa
              agua es líquida.
          - valor: '99.75'
            mensaje: |
              Te has dejado el argón, que tampoco reacciona: son 26,15 mol que
              siguen en el gas.
        pista: |
          En un gas, la composición en volumen es la composición en moles: moles
          de N₂ entre moles de gas totales.
        desarrollo: |
          $$
          \%\,\mathrm{N_2} = \frac{2039{,}56}{2070{,}90}\cdot 100 = 98{,}49\ \%
          $$

          Y los otros dos, del mismo modo:

          $$
          \%\,\mathrm{O_2} = \frac{5{,}19}{2070{,}90}\cdot 100 = 0{,}25\ \%
          $$

          $$
          \%\,\mathrm{Ar} = \frac{26{,}15}{2070{,}90}\cdot 100 = 1{,}26\ \%
          $$

          La resolución oficial da 98,48 %, 0,25 % y 1,26 %: los mismos.

      - tipo: justificar
        pregunta: Ordena el apartado 5.5. Una pieza es falsa.
        piezas:
          - texto: >-
              El aire son 2615 mol: 549,1 de O₂, 2039,6 de N₂ y 26,15 de Ar.
          - texto: >-
              El ZnS, 272,0 mol, es el limitante: pide 543,9 mol de O₂ y 272,0
              de agua, y hay más de los dos.
          - texto: >-
              Tras la reacción el gas es N₂, Ar y los 5,2 mol de O₂ que sobran:
              2070,9 mol.
          - texto: >-
              A 30 °C y en 30 m³ eso son 1,716 atm; el nitrógeno, con su
              fracción molar, 1,690 atm.
          - texto: >-
              En volumen, la mezcla es un 98,49 % de N₂, un 0,25 % de O₂ y un
              1,26 % de Ar.
          - texto: >-
              El agua que sobra, 32,0 mol, también está en el gas y suma a la
              presión total.
            trampa: true
            mensaje: |
              A 30 °C el agua que sobra es líquida, y el enunciado dice que el
              volumen de los líquidos es despreciable: no se cuenta como gas.
              Contarla daría 1,743 atm. En rigor ese líquido tiene su propia
              presión de vapor, que el enunciado no da y la resolución oficial
              tampoco suma; lo que no vale es meter sus 32 mol enteros en el gas.
        veredicto: |
          La presión solo mira los gases: lo que reacciona se va del gas, lo que
          no reacciona se queda, y los líquidos y sólidos no cuentan.

    resolucion: |
      **Los moles de cada cosa.** El aire, a 1 atm y 30 °C:

      $$
      n_{\text{aire}} = \frac{1 \cdot 65\,000}{0{,}082 \cdot 303{,}15}
      = 2614{,}82\ \text{mol}
      $$

      De ellos, 549,11 son de O₂, 2039,56 de N₂ y 26,15 de Ar. La blenda y el
      agua:

      $$
      n(\mathrm{ZnS}) = \frac{50\,000 \cdot 0{,}53}{97{,}44} = 271{,}96\ \text{mol}
      $$

      $$
      n(\mathrm{H_2O}) = \frac{5500 \cdot 0{,}996}{18{,}02} = 304{,}00\ \text{mol}
      $$

      **El reactivo limitante.** Con $\mathrm{ZnS} + 2\,\mathrm{O_2} +
      \mathrm{H_2O}$, los 271,96 mol de ZnS piden 543,92 mol de O₂ —hay
      549,11— y 271,96 de agua —hay 304,00—. **El ZnS es el limitante**, por
      poco en el oxígeno, y con el rendimiento del 100 % de este apartado se
      gasta entero. Sobran 5,19 mol de O₂, que siguen en el gas, y 32,04 mol de
      agua, líquida a 30 °C.

      **5.5.a · La presión total.** Solo cuentan los gases: el N₂ y el Ar, que
      no reaccionan, y el O₂ que sobra. El ZnO es sólido, el ácido queda en el
      líquido, con el agua que sobra, y el enunciado lo supone no volátil.

      $$
      n_{\text{gas}} = 5{,}19 + 2039{,}56 + 26{,}15 = 2070{,}90\ \text{mol}
      $$

      $$
      \boxed{\;P_T = \frac{2070{,}90 \cdot 0{,}082 \cdot 303{,}15}{30\,000}
      = 1{,}716\ \text{atm}\;}
      $$

      **5.5.b · La presión del nitrógeno.** Con su fracción molar:

      $$
      \boxed{\;P(\mathrm{N_2}) = \frac{2039{,}56}{2070{,}90}\cdot 1{,}716
      = 1{,}690\ \text{atm}\;}
      $$

      Y se comprueba sin la presión total: el nitrógeno tenía 0,78 atm en los
      65 m³ de aire, a la misma temperatura, y ahora ocupa 30 m³, así que
      $0{,}78 \cdot 65/30 = 1{,}69$ atm.

      **5.5.c · La composición en volumen.** En un gas, la composición en
      volumen es la composición en moles:

      $$
      \%\,\mathrm{N_2} = \frac{2039{,}56}{2070{,}90}\cdot 100 = 98{,}49\ \%
      $$

      $$
      \%\,\mathrm{O_2} = \frac{5{,}19}{2070{,}90}\cdot 100 = 0{,}25\ \%
      $$

      $$
      \%\,\mathrm{Ar} = \frac{26{,}15}{2070{,}90}\cdot 100 = 1{,}26\ \%
      $$

      Los tres resultados son los de la resolución oficial: 1,716 atm, 1,69 atm
      y 98,48 %, 0,25 % y 1,26 %. Sus erratas no cambian ningún resultado:
      «273 + 30» con 303,15 K dentro,
      0,71 donde calcula con el 0,78 del nitrógeno, 26,22 mol de argón donde
      son 26,15, y 18 g/mol para el agua, que da 304,33 mol en vez de 304,00 y
      no cambia nada porque el agua sobra.

      El oxígeno que sobra es una resta de dos números grandes y parecidos, y
      por eso es la cifra más sensible a los redondeos: con 303 K saldrían 5,46
      mol y un 0,26 %. La presión total, en cambio, casi no se mueve: el aire
      entra y acaba a la misma temperatura, así que su parte vale 65/30 atm con
      cualquier R, y lo que se le resta, el oxígeno gastado, solo depende del
      ZnS.
