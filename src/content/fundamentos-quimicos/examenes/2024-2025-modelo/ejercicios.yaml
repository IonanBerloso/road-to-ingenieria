ejercicios:
  # ── El modelo de examen «Examen 5» de 2024-2025 es, con la ordinaria de
  #    2013, uno de los dos documentos de Química con resolución oficial detrás: el profesor la resolvió a mano
  #    y se reparte escaneada. Cada resultado de aquí está contrastado con el
  #    suyo, y donde no coinciden se dice por qué. El escaneado NO se publica
  #    (es una foto de un documento resuelto a mano): el enunciado de cada
  #    ejercicio está transcrito del texto mecanografiado, con los puntos
  #    decimales del original.
  #
  #    Los ejercicios 1 y 3 no están en el documento. El 4 y el 5 van partidos
  #    en dos piezas cada uno, porque cruzan temas: sus primeros apartados son
  #    del tema 1 y los últimos del tema 4. Cada pieza repite el párrafo de
  #    partida y la lista de datos, que es lo que el alumno necesita para
  #    resolverla, y dice en cursiva dónde están los apartados que faltan.

  # ── Ejercicio 2. Es el molde del tema 3 que la asignatura repite —el mismo
  #    formato que el cloruro de vinilo del final de 2024-2025—, con una
  #    molécula que tiene un nitrógeno, dos oxígenos distintos y un carbono:
  #    cuatro átomos centrales que se analizan cada uno por su cuenta.
  #
  #    El nitrógeno se da como sp³, que es lo que sale con la estructura de
  #    Lewis sin cargas y el número estérico, y lo que da la resolución
  #    oficial. En la molécula real el par del nitrógeno se deslocaliza hacia
  #    el C=O —como en las amidas— y el nitrógeno se aplana; el desarrollo lo
  #    dice en una frase, sin quitarle la razón al método del curso, y ningún
  #    mensaje de este ejercicio llama falso a lo que es cierto en la molécula
  #    real: lo que se da por malo es el razonamiento («lo hereda del vecino»,
  #    «se me ha olvidado el par»), no el resultado.
  - id: exfq2425-modelo-2-el-acido-carbamico-de-lewis-a-la-polaridad
    titulo: El ácido carbámico, de la estructura de Lewis a la polaridad átomo por átomo
    fuente: >-
      Ejercicio 2 · Modelo de examen «Examen 5», curso 2024-2025 · Fundamentos
      Químicos de la Ingeniería (25975), UPV/EHU · La resolución guiada es
      nuestra, contrastada con la resolución oficial manuscrita del modelo:
      coinciden los 24 electrones de valencia, la estructura de Lewis sin
      cargas formales, las cuatro hibridaciones, los ángulos y la polaridad.
    nivel: examen
    enunciado: |
      Analizar la molécula de ácido carbámico, H₂NCOOH (el átomo de carbono se
      enlaza con el de nitrógeno y con los dos oxígenos).

      **2.1.** Dibujar la estructura de Lewis. **Razonar la respuesta.**

      **2.2.** Analizar la hibridación de los átomos y estudiar la geometría.
      **Razonar la respuesta**.

      **2.3.** Indicar los ángulos de enlace y estudia la polaridad de la
      molécula indicando los momentos dipolares. **Razonar la respuesta**.

      - **Datos**: Números atómicos (Z): H (1); C (6); N (7); O (8)
    pide: >-
      La estructura de Lewis razonada, la hibridación y la geometría de cada
      átomo, los ángulos de enlace y la polaridad con sus momentos dipolares.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el carbono se enlaza con el nitrógeno y con los
          dos oxígenos. ¿Qué esqueleto deja eso, antes de repartir ningún
          electrón?
        opciones:
          - texto: >-
              El carbono en el centro, con dos hidrógenos en el nitrógeno y uno
              en uno de los oxígenos
            correcta: true
            mensaje: |
              Eso es: H₂N–C(O)–O–H. El paréntesis del enunciado fija los tres
              vecinos del carbono, y la fórmula reparte los hidrógenos: los dos
              primeros van con el nitrógeno y el último con un oxígeno, que es
              lo que hace del –COOH un ácido. El carbono, además, es el menos
              electronegativo de los tres átomos pesados, y es el que va en el
              centro.
          - texto: El nitrógeno en el centro, porque en la fórmula va delante
            mensaje: |
              El orden de una fórmula condensada no dice quién va en el centro.
              Y aquí el enunciado lo dice con todas las letras: el carbono está
              unido al nitrógeno y a los dos oxígenos. Con el nitrógeno en el
              centro, el carbono solo estaría unido a él.
          - texto: Los dos oxígenos unidos entre sí, y el carbono colgando de uno
            mensaje: |
              Un enlace O–O sería un peróxido, y el enunciado lo descarta: el
              carbono se enlaza con **los dos** oxígenos, así que ninguno puede
              quedar entre el carbono y el otro.
          - texto: Los tres hidrógenos en el carbono, que es el que más enlaces forma
            mensaje: |
              El carbono ya tiene tres vecinos pesados —N, O y O—; con tres
              hidrógenos más serían seis enlaces, y el carbono forma cuatro. La
              fórmula H₂NCOOH pone dos hidrógenos con el nitrógeno y uno al
              final, con un oxígeno.

      - tipo: calcular
        titulo: Los electrones de valencia
        pregunta: |
          ¿Cuántos electrones de valencia hay que repartir en la estructura de
          Lewis del H₂NCOOH?
        respuesta:
          tipo: numero
          valor: '24'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '32'
            mensaje: |
              Has sumado los números atómicos, $7 + 6 + 2 \times 8 + 3 = 32$:
              esos son **todos** los electrones. En Lewis solo entran los de la
              capa de valencia: cinco del nitrógeno, cuatro del carbono, seis de
              cada oxígeno y uno de cada hidrógeno.
          - valor: '14'
            mensaje: |
              Has sumado los enlaces que forma cada átomo —tres el nitrógeno,
              cuatro el carbono, dos cada oxígeno, uno cada hidrógeno—: es su
              covalencia, no sus electrones de valencia. Al nitrógeno le quedan
              además dos electrones sin compartir, y a cada oxígeno cuatro.
          - valor: '23'
            mensaje: |
              Te has dejado un hidrógeno: el H₂NCOOH tiene tres, dos en el
              –NH₂ y el del –OH. Un número impar de electrones, además, no se
              puede repartir en pares, y es la señal de que falta algo.
        pista: |
          Con los números atómicos del enunciado, la configuración dice cuántos
          electrones hay en la última capa: el nitrógeno es $1s^{2}2s^{2}2p^{3}$.
          Y cuenta bien los hidrógenos de la fórmula.
        desarrollo: |
          Nitrógeno, $2s^{2}2p^{3}$: cinco. Carbono: cuatro. Cada oxígeno: seis.
          Cada hidrógeno: uno.

          $$
          5 + 4 + 2 \times 6 + 3 \times 1 = 24
          $$

          Es la cuenta de la resolución oficial, que escribe los 24 como
          «disponibles».

      - tipo: calcular
        titulo: Los pares compartidos
        pregunta: |
          Con 24 electrones, y ocho alrededor de cada átomo pesado y dos en cada
          hidrógeno, ¿cuántos pares de electrones tienen que estar compartidos,
          contando un doble enlace como dos pares?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '14'
            mensaje: |
              Esos son los **electrones** compartidos, no los pares:
              $38 - 24 = 14$ electrones, que son siete pares.
          - valor: '6'
            mensaje: |
              Seis son las parejas de átomos unidos —dos N–H, el N–C, dos C–O y
              el O–H—, lo que sale con todos los enlaces sencillos. Pero hacen
              falta siete pares compartidos para que todos lleguen a su octeto:
              uno de los enlaces tiene que ser doble.
        pista: |
          Cuenta los electrones que **caben** —ocho por átomo pesado, dos por
          hidrógeno— y réstale los que **hay**. La diferencia son electrones
          compartidos; entre dos, pares.
        desarrollo: |
          $$
          \text{caben} = 4 \times 8 + 3 \times 2 = 38
          $$

          $$
          38 - 24 = 14\ \text{electrones compartidos}
          $$

          Catorce electrones son siete pares, y solo hay seis parejas de átomos
          vecinos —dos N–H, N–C, dos C–O y O–H—. Así que uno de los enlaces es
          doble, y eso se sabe **antes** de dibujar. La resolución oficial llega
          a lo mismo por el otro camino: dibuja los seis enlaces sencillos,
          reparte lo que sobra y ve que al carbono le faltan dos electrones.

      - tipo: dibujar
        consigna: |
          En papel: **la estructura de Lewis del H₂NCOOH**, con todos los
          enlaces y todos los pares solitarios, y razonada: de dónde sale el
          doble enlace y por qué va donde va.
        comprueba:
          - punto: |
              **24 electrones en el dibujo**, ni uno más: siete pares
              compartidos y cinco solitarios.
            porque: |
              Es la comprobación que caza casi todos los fallos:
              $7 \times 2 + 5 \times 2 = 24$. Si te salen 22 o 26, falta o sobra
              un par en algún sitio.
          - punto: |
              **Un doble enlace C=O** con el oxígeno que no lleva hidrógeno, y
              todos los demás enlaces sencillos.
            porque: |
              Con seis enlaces sencillos el carbono se queda con seis
              electrones. Es la única forma de darle el octeto sin cargas
              formales: un doble enlace con el nitrógeno o con el oxígeno del
              –OH dejaría un +1 en ese átomo y un −1 en el oxígeno sin
              hidrógeno.
          - punto: |
              **El octeto de cada átomo pesado** y dos electrones en cada
              hidrógeno, contados sobre el dibujo.
            porque: |
              Es la condición de validez que pide el «razonar», y la que la
              resolución oficial comprueba antes de dar la estructura por buena:
              «todos los át. tienen el octeto completo».
          - punto: |
              **Ninguna carga formal**: cero en el nitrógeno, en el carbono y en
              los dos oxígenos.
            porque: |
              Nitrógeno, $5 - 2 - 3 = 0$; carbono, $4 - 0 - 4 = 0$; cada oxígeno,
              $6 - 4 - 2 = 0$. Es el criterio del tema para elegir entre
              estructuras, y la resolución oficial lo escribe: «no hay cargas
              formales en ningún átomo».
          - punto: |
              **El par solitario del nitrógeno**, dibujado.
            porque: |
              Es el que más se olvida, y decide el apartado siguiente: sin él,
              el nitrógeno tendría tres regiones alrededor y saldría $sp^{2}$.
        figura: |
          <svg viewBox="0 0 380 250" role="img" width="380" height="250" aria-labelledby="fq2425mlewis-t fq2425mlewis-d">
