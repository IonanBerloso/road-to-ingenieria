asignatura: fundamentos-quimicos
curso: '2024-2025'
convocatoria: modelo
fecha: curso 2024-2025
# El «Examen 5» de los modelos de examen de la asignatura: un escaneado de
# doce páginas con la cabecera «Fundamentos Químicos de la Ingeniería
# (2024-25)», el enunciado mecanografiado de tres de sus cinco ejercicios y la
# resolución del profesor escrita a mano encima. Es, con la resolución de
# 2013, el único documento de la asignatura con algo oficial detrás.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **NO ES UNA CONVOCATORIA.** Es un modelo que la asignatura reparte, sin
#    fecha de examen, y por eso no cuenta en la medida de ninguna ruta. Lo que
#    sí hace es entrar en el simulacro del primer cuatrimestre: sus
#    ejercicios son de los temas 1, 3 y 4.
#
# 2. **SOLO TRAE EL 2, EL 4 Y EL 5**, y el 4 y el 5 cruzan temas: van en dos
#    piezas cada uno, con su `n`. El 1 y el 3 van en `fuera`.
#
# 3. **SIN PDF.** El documento es un escaneado con la letra del profesor, y
#    los escaneados de exámenes no se publican nunca (regla de datos del
#    proyecto). El enunciado transcrito es la única versión que ve el alumno.
sinPdf: >-
  El único documento es un escaneado del modelo de examen con la resolución
  del profesor escrita a mano encima, y los escaneados de exámenes no se
  publican. El enunciado está transcrito tal cual, con los datos de cada
  ejercicio, y cada resolución dice dónde coincide con la del profesor.
pdfEs: resolucion

puntosImpresos:
  fuente: 'junto al título de cada ejercicio: «4. EJERCICIO (2.50 puntos)»'
  reparto:
    - { n: 2, puntos: 1.75 }
    - { n: 4, puntos: 2.5 }
    - { n: 5, puntos: 2.5 }

ejercicios:
  - id: exfq2425-modelo-2-el-acido-carbamico-de-lewis-a-la-polaridad
    tema: t03-enlace-quimico
    n: 2
  - id: exfq2425-modelo-4-el-hipnotico-clorado-y-su-formula-empirica
    tema: t01-compuestos-y-estequiometria
    n: 4
  - id: exfq2425-modelo-4-el-hipnotico-por-su-presion-osmotica
    tema: t04-estados-y-propiedades
    n: 4
  - id: exfq2425-modelo-5-la-blenda-y-el-acido-sulfurico
    tema: t01-compuestos-y-estequiometria
    n: 5
  - id: exfq2425-modelo-5-el-reactor-cerrado-con-aire
    tema: t04-estados-y-propiedades
    n: 5

fuera:
  - n: 1
    motivo: >-
      El escaneado de la asignatura empieza en el ejercicio 2: el enunciado
      del 1 no está en el material, y no se transcribe lo que no se tiene.
  - n: 3
    motivo: >-
      Tampoco está: el escaneado salta del ejercicio 2 al 4, y ningún otro
      documento de la asignatura trae el enunciado del 3.
