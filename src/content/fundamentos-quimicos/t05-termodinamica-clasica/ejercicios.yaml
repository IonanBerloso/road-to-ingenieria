ejercicios:
  # ── Los dos son NUESTROS (§08). El ejercicio de examen de este tema no tiene
  #    ni un número: es un ciclo dibujado y hay que decir el signo del trabajo
  #    en cada tramo. Aquí se llega por partes: primero un solo tramo con su
  #    signo y su valor, y después el ciclo entero.
  - id: ejfq5-un-tramo-y-su-signo
    titulo: Un gas que se expande, y el signo que casi todo el mundo pone al revés
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Un gas se expande de **1,0 L a 5,0 L** contra una presión exterior
      constante de **2,0 atm**.

      Calcular el trabajo, con su signo, en julios.

      **Dato:** 1 atm·L = 101,325 J. Convenio:
      $\Delta U = q + W$.
    pide: El trabajo intercambiado, con su signo, en julios.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas se expande. Con el convenio $\Delta U = q + W$, ¿qué signo
          tiene el trabajo?
        opciones:
          - texto: >-
              Negativo, porque el gas empuja al entorno y le entrega energía
            correcta: true
            mensaje: |
              Eso es. Con este convenio lo positivo es lo que **entra** al
              sistema. Al expandirse, el gas gasta energía apartando la
              atmósfera, así que sale.
          - texto: >-
              Positivo, porque el gas realiza trabajo
            mensaje: |
              Realiza trabajo, sí — y por eso **pierde** energía. Con el
              convenio $\Delta U = q + W$ eso es negativo. El signo contrario
              corresponde al otro convenio, el de $\Delta U = q - W$.
          - texto: >-
              Positivo, porque el volumen aumenta
            mensaje: |
              El volumen aumenta y por eso el trabajo es negativo: la fórmula
              lleva un menos delante, $W = -P\Delta V$.
          - texto: >-
              Depende de si el proceso es reversible
            mensaje: |
              La reversibilidad cambia el **valor** —un proceso reversible
              entrega más trabajo— pero no el signo. Expandirse siempre entrega
              energía al entorno.

      - tipo: calcular
        titulo: El trabajo
        pregunta: ¿Cuánto vale el trabajo, en julios?
        respuesta:
          tipo: numero
          valor: '-811'
          tolerancia: 15
          formato: el trabajo en julios, con su signo
        distractores:
          - valor: '811'
            mensaje: |
              El valor está bien y el signo no. Con $\Delta U = q + W$, una
              expansión da trabajo **negativo**: el sistema entrega energía.
          - valor: '-1013'
            mensaje: |
              Has usado el volumen final en vez de la **variación**. Lo que
              cuenta es cuánto se ha desplazado el entorno: $5{,}0 - 1{,}0 = 4$ L.
        pista: |
          $W = -P\,\Delta V$, con $\Delta V$ la variación y no el volumen
          final. El resultado sale en atm·L y hay que pasarlo a julios.
        desarrollo: |
          $$
          W = -P\,\Delta V = -2{,}0\cdot(5{,}0-1{,}0) = -8{,}0\ \text{atm·L}
          $$
          $$
          W = -8{,}0\cdot 101{,}325 = -811\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión exterior es constante, así que
              $W = -P\,\Delta V$ sin integrar nada.
          - texto: >-
              $\Delta V = 5{,}0 - 1{,}0 = 4{,}0$ L, la variación y no el
              volumen final.
          - texto: >-
              $W = -2{,}0\cdot 4{,}0 = -8{,}0$ atm·L, negativo porque el gas se
              expande.
          - texto: >-
              En julios, $-811$ J.
          - texto: >-
              Como el trabajo es negativo, el gas ha perdido energía interna.
            trampa: true
            mensaje: |
              No se sigue. La primera ley es $\Delta U = q + W$: el trabajo es
              solo **uno** de los dos términos.

              Si mientras se expande el gas absorbe calor —y en una expansión
              isoterma absorbe exactamente el mismo que entrega como trabajo—
              su energía interna no cambia en absoluto. Para saber qué pasa con
              $\Delta U$ hace falta conocer también $q$.
        veredicto: |
          El signo lo decide una sola pregunta: ¿sube el volumen o baja? Y el
          trabajo por sí solo no dice qué le pasa a la energía interna.

    resolucion: |
      **La idea.** Con presión exterior constante el trabajo es un rectángulo,
      y su signo se lee del sentido en que se mueve el volumen.

      $$
      W = -P\,\Delta V = -2{,}0\cdot 4{,}0 = -8{,}0\ \text{atm·L}
      = \boxed{-811\ \text{J}}
      $$

      **Los dos descuidos**, y los dos dan un número que no parece raro:

      - usar $V_2$ en vez de $\Delta V$ —salen −1013 J—, porque lo que importa
        es cuánto se ha apartado el entorno, no dónde ha acabado el pistón;
      - poner el signo al revés, que es lo que pasa al arrastrar el convenio de
        los motores.

      **Y una advertencia sobre el valor.** Estos 811 J son el trabajo contra
      una presión exterior **constante**. Si la expansión fuera reversible —el
      gas empujando siempre contra una presión infinitesimalmente menor que la
      suya— el trabajo entregado sería mayor, y saldría de integrar
      $\int P\,dV$ con la $P$ del gas. La expansión irreversible contra presión
      fija es siempre la que menos trabajo rinde.

  - id: ejfq5-el-area-que-encierra-el-ciclo
    titulo: Un ciclo rectangular, y por qué su trabajo no es cero
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Un gas recorre un ciclo de cuatro tramos, en este orden:

      1. se **expande** de 2,0 L a 6,0 L a la presión constante de 3,0 atm;
      2. se **enfría** a volumen constante hasta 1,0 atm;
      3. se **comprime** de 6,0 L a 2,0 L a la presión constante de 1,0 atm;
      4. se **calienta** a volumen constante hasta volver a 3,0 atm.

      Calcular el trabajo neto del ciclo, en atm·L, y decir si el gas produce
      trabajo o lo consume.
    pide: El trabajo neto del ciclo y su interpretación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas vuelve exactamente a su estado inicial. ¿Qué vale cero en un
          ciclo?
        opciones:
          - texto: >-
              La variación de las funciones de estado, como $\Delta U$, pero
              no el trabajo ni el calor
            correcta: true
            mensaje: |
              Exacto, y es la distinción central del tema. $U$ depende solo de
              dónde estás; $q$ y $W$ dependen del camino, y en un ciclo el
              camino no ha sido nulo aunque el punto sí.
          - texto: >-
              Todo: si vuelve al mismo sitio, no ha cambiado nada
            mensaje: |
              No ha cambiado nada **en el sistema**. En el entorno sí: le han
              dado calor y ha recibido trabajo. Si no fuera así no existirían
              los motores.
          - texto: >-
              El trabajo, porque los dos tramos se compensan
            mensaje: |
              Se compensarían si la expansión y la compresión ocurrieran a la
              misma presión, y no es el caso: se expande a 3 atm y se comprime
              a 1. Esa diferencia es todo el ciclo.
          - texto: >-
              El calor, porque no hay fuente externa
            mensaje: |
              Hay dos tramos a volumen constante en los que el gas se enfría y
              se calienta: ahí entra y sale calor sin que haya trabajo.

      - tipo: calcular
        titulo: El trabajo neto
        pregunta: ¿Cuánto vale el trabajo neto del ciclo, en atm·L?
        respuesta:
          tipo: numero
          valor: '-8'
          tolerancia: 0.3
          formato: el trabajo en atm·L, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Sería cero si la expansión y la compresión ocurrieran a la misma
              presión. Aquí se expande a 3 atm y se comprime a 1: la ida cuesta
              12 y la vuelta devuelve solo 4.
          - valor: '8'
            mensaje: |
              El valor está bien y el signo al revés. El ciclo es **horario**
              —se expande arriba y se comprime abajo—, así que el gas produce
              trabajo neto, que con este convenio es negativo.
        pista: |
          Los dos tramos a volumen constante no aportan nada. Suma los otros
          dos, cada uno con su presión y su signo.
        desarrollo: |
          $$
          W_1 = -3{,}0\cdot(6{,}0-2{,}0) = -12\ \text{atm·L}
          \qquad
          W_2 = 0
          $$
          $$
          W_3 = -1{,}0\cdot(2{,}0-6{,}0) = +4\ \text{atm·L}
          \qquad
          W_4 = 0
          $$
          $$
          W_{\text{neto}} = -12 + 4 = -8\ \text{atm·L}
          $$
          Que es exactamente el **área del rectángulo** que encierra el ciclo:
          $(3{,}0-1{,}0)\cdot(6{,}0-2{,}0) = 8$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos tramos a volumen constante tienen $W = 0$, sea cual sea
              la presión.
          - texto: >-
              La expansión a 3 atm da $-12$ atm·L y la compresión a 1 atm
              devuelve $+4$.
          - texto: >-
              El neto son $-8$ atm·L, que es el área encerrada por el ciclo.
          - texto: >-
              Negativo significa que el gas **produce** trabajo neto: el ciclo
              es horario y funciona como un motor.
          - texto: >-
              Como $\Delta U = 0$ en el ciclo, el calor neto absorbido es
              $+8$ atm·L: todo lo que entra como calor sale como trabajo.
          - texto: >-
              Los tramos a volumen constante no cambian nada del sistema,
              porque no hay trabajo.
            trampa: true
            mensaje: |
              No hay trabajo, pero **sí hay calor**, y mucho: son los dos
              tramos donde el gas se enfría y se calienta. Con $W = 0$, la
              primera ley queda $\Delta U = q$, así que ahí toda la energía
              intercambiada va a energía interna.

              De hecho son imprescindibles: sin ellos el gas no podría volver a
              su presión inicial y no habría ciclo.
        veredicto: |
          El área encerrada es el trabajo neto, y el sentido de giro da el
          signo. Horario, motor; antihorario, frigorífico.

    resolucion: |
      **La idea.** En un ciclo, $\Delta U = 0$ porque $U$ es función de estado.
      El trabajo **no** es cero porque no lo es — y esa diferencia es la que
      hace posibles los motores.

      | tramo | qué pasa | $W$ (atm·L) |
      |---|---|---|
      | 1 · expansión a 3,0 atm | $V$ sube | $-12$ |
      | 2 · enfriar a $V$ constante | nada se mueve | $0$ |
      | 3 · compresión a 1,0 atm | $V$ baja | $+4$ |
      | 4 · calentar a $V$ constante | nada se mueve | $0$ |
      | | | $\boxed{-8}$ |

      **El atajo que conviene reconocer:** ese $-8$ es exactamente el **área
      del rectángulo** que encierra el ciclo,
      $(3{,}0-1{,}0)\times(6{,}0-2{,}0)$. Vale para cualquier ciclo, tenga la
      forma que tenga: el trabajo neto es el área encerrada, y el sentido de
      giro da el signo.

      - **Horario** —expandir arriba, comprimir abajo— el gas produce trabajo.
        Es un motor.
      - **Antihorario**, hay que dárselo. Es un frigorífico.

      **Y de dónde sale esa energía.** Como $\Delta U = 0$, la primera ley
      obliga a que $q = -W = +8$ atm·L: el gas ha absorbido justo ese calor y
      lo ha entregado como trabajo. No se ha creado nada — se ha convertido.

      Los dos tramos a volumen constante parecen no hacer nada porque su
      trabajo es cero, pero son los que mueven el calor: con $W = 0$, allí
      $\Delta U = q$. Sin ellos el ciclo no podría cerrarse.
