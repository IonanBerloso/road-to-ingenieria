ejercicios:
  # ── Los dos son NUESTROS (§08). El ejercicio de examen de este tema no tiene
  #    ni un número: es un ciclo dibujado y hay que decir el signo del trabajo
  #    en cada tramo. Aquí se llega por partes: primero un solo tramo con su
  #    signo y su valor, y después el ciclo entero.
  - id: ejfq5-un-tramo-y-su-signo
    titulo: Un gas que se expande, y el signo que casi todo el mundo pone al revés
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Un gas se expande de **1,0 L a 5,0 L** contra una presión exterior
      constante de **2,0 atm**.

      Calcular el trabajo, con su signo, en julios.

      **Dato:** 1 atm·L = 101,325 J. Convenio:
      $\Delta U = q + W$.
    pide: El trabajo intercambiado, con su signo, en julios.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas se expande. Con el convenio $\Delta U = q + W$, ¿qué signo
          tiene el trabajo?
        opciones:
          - texto: >-
              Negativo, porque el gas empuja al entorno y le entrega energía
            correcta: true
            mensaje: |
              Eso es. Con este convenio lo positivo es lo que **entra** al
              sistema. Al expandirse, el gas gasta energía apartando la
              atmósfera, así que sale.
          - texto: >-
              Positivo, porque el gas realiza trabajo
            mensaje: |
              Realiza trabajo, sí — y por eso **pierde** energía. Con el
              convenio $\Delta U = q + W$ eso es negativo. El signo contrario
              corresponde al otro convenio, el de $\Delta U = q - W$.
          - texto: >-
              Positivo, porque el volumen aumenta
            mensaje: |
              El volumen aumenta y por eso el trabajo es negativo: la fórmula
              lleva un menos delante, $W = -P\Delta V$.
          - texto: >-
              Depende de si el proceso es reversible
            mensaje: |
              La reversibilidad cambia el **valor** —un proceso reversible
              entrega más trabajo— pero no el signo. Expandirse siempre entrega
              energía al entorno.

      - tipo: calcular
        titulo: El trabajo
        pregunta: ¿Cuánto vale el trabajo, en julios?
        respuesta:
          tipo: numero
          valor: '-811'
          tolerancia: 15
          formato: el trabajo en julios, con su signo
        distractores:
          - valor: '811'
            mensaje: |
              El valor está bien y el signo no. Con $\Delta U = q + W$, una
              expansión da trabajo **negativo**: el sistema entrega energía.
          - valor: '-1013'
            mensaje: |
              Has usado el volumen final en vez de la **variación**. Lo que
              cuenta es cuánto se ha desplazado el entorno: $5{,}0 - 1{,}0 = 4$ L.
        pista: |
          $W = -P\,\Delta V$, con $\Delta V$ la variación y no el volumen
          final. El resultado sale en atm·L y hay que pasarlo a julios.
        desarrollo: |
          $$
          W = -P\,\Delta V = -2{,}0\cdot(5{,}0-1{,}0) = -8{,}0\ \text{atm·L}
          $$
          $$
          W = -8{,}0\cdot 101{,}325 = -811\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión exterior es constante, así que
              $W = -P\,\Delta V$ sin integrar nada.
          - texto: >-
              $\Delta V = 5{,}0 - 1{,}0 = 4{,}0$ L, la variación y no el
              volumen final.
          - texto: >-
              $W = -2{,}0\cdot 4{,}0 = -8{,}0$ atm·L, negativo porque el gas se
              expande.
          - texto: >-
              En julios, $-811$ J.
          - texto: >-
              Como el trabajo es negativo, el gas ha perdido energía interna.
            trampa: true
            mensaje: |
              No se sigue. La primera ley es $\Delta U = q + W$: el trabajo es
              solo **uno** de los dos términos.

              Si mientras se expande el gas absorbe calor —y en una expansión
              isoterma absorbe exactamente el mismo que entrega como trabajo—
              su energía interna no cambia en absoluto. Para saber qué pasa con
              $\Delta U$ hace falta conocer también $q$.
        veredicto: |
          El signo lo decide una sola pregunta: ¿sube el volumen o baja? Y el
          trabajo por sí solo no dice qué le pasa a la energía interna.

    resolucion: |
      **La idea.** Con presión exterior constante el trabajo es un rectángulo,
      y su signo se lee del sentido en que se mueve el volumen.

      $$
      W = -P\,\Delta V = -2{,}0\cdot 4{,}0 = -8{,}0\ \text{atm·L}
      = \boxed{-811\ \text{J}}
      $$

      **Los dos descuidos**, y los dos dan un número que no parece raro:

      - usar $V_2$ en vez de $\Delta V$ —salen −1013 J—, porque lo que importa
        es cuánto se ha apartado el entorno, no dónde ha acabado el pistón;
      - poner el signo al revés, que es lo que pasa al arrastrar el convenio de
        los motores.

      **Y una advertencia sobre el valor.** Estos 811 J son el trabajo contra
      una presión exterior **constante**. Si la expansión fuera reversible —el
      gas empujando siempre contra una presión infinitesimalmente menor que la
      suya— el trabajo entregado sería mayor, y saldría de integrar
      $\int P\,dV$ con la $P$ del gas. La expansión irreversible contra presión
      fija es siempre la que menos trabajo rinde.

  - id: ejfq5-el-area-que-encierra-el-ciclo
    titulo: Un ciclo rectangular, y por qué su trabajo no es cero
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Un gas recorre un ciclo de cuatro tramos, en este orden:

      1. se **expande** de 2,0 L a 6,0 L a la presión constante de 3,0 atm;
      2. se **enfría** a volumen constante hasta 1,0 atm;
      3. se **comprime** de 6,0 L a 2,0 L a la presión constante de 1,0 atm;
      4. se **calienta** a volumen constante hasta volver a 3,0 atm.

      Calcular el trabajo neto del ciclo, en atm·L, y decir si el gas produce
      trabajo o lo consume.
    pide: El trabajo neto del ciclo y su interpretación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El gas vuelve exactamente a su estado inicial. ¿Qué vale cero en un
          ciclo?
        opciones:
          - texto: >-
              La variación de las funciones de estado, como $\Delta U$, pero
              no el trabajo ni el calor
            correcta: true
            mensaje: |
              Exacto, y es la distinción central del tema. $U$ depende solo de
              dónde estás; $q$ y $W$ dependen del camino, y en un ciclo el
              camino no ha sido nulo aunque el punto sí.
          - texto: >-
              Todo: si vuelve al mismo sitio, no ha cambiado nada
            mensaje: |
              No ha cambiado nada **en el sistema**. En el entorno sí: le han
              dado calor y ha recibido trabajo. Si no fuera así no existirían
              los motores.
          - texto: >-
              El trabajo, porque los dos tramos se compensan
            mensaje: |
              Se compensarían si la expansión y la compresión ocurrieran a la
              misma presión, y no es el caso: se expande a 3 atm y se comprime
              a 1. Esa diferencia es todo el ciclo.
          - texto: >-
              El calor, porque no hay fuente externa
            mensaje: |
              Hay dos tramos a volumen constante en los que el gas se enfría y
              se calienta: ahí entra y sale calor sin que haya trabajo.

      - tipo: calcular
        titulo: El trabajo neto
        pregunta: ¿Cuánto vale el trabajo neto del ciclo, en atm·L?
        respuesta:
          tipo: numero
          valor: '-8'
          tolerancia: 0.3
          formato: el trabajo en atm·L, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Sería cero si la expansión y la compresión ocurrieran a la misma
              presión. Aquí se expande a 3 atm y se comprime a 1: la ida cuesta
              12 y la vuelta devuelve solo 4.
          - valor: '8'
            mensaje: |
              El valor está bien y el signo al revés. El ciclo es **horario**
              —se expande arriba y se comprime abajo—, así que el gas produce
              trabajo neto, que con este convenio es negativo.
        pista: |
          Los dos tramos a volumen constante no aportan nada. Suma los otros
          dos, cada uno con su presión y su signo.
        desarrollo: |
          $$
          W_1 = -3{,}0\cdot(6{,}0-2{,}0) = -12\ \text{atm·L}
          \qquad
          W_2 = 0
          $$
          $$
          W_3 = -1{,}0\cdot(2{,}0-6{,}0) = +4\ \text{atm·L}
          \qquad
          W_4 = 0
          $$
          $$
          W_{\text{neto}} = -12 + 4 = -8\ \text{atm·L}
          $$
          Que es exactamente el **área del rectángulo** que encierra el ciclo:
          $(3{,}0-1{,}0)\cdot(6{,}0-2{,}0) = 8$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos tramos a volumen constante tienen $W = 0$, sea cual sea
              la presión.
          - texto: >-
              La expansión a 3 atm da $-12$ atm·L y la compresión a 1 atm
              devuelve $+4$.
          - texto: >-
              El neto son $-8$ atm·L, que es el área encerrada por el ciclo.
          - texto: >-
              Negativo significa que el gas **produce** trabajo neto: el ciclo
              es horario y funciona como un motor.
          - texto: >-
              Como $\Delta U = 0$ en el ciclo, el calor neto absorbido es
              $+8$ atm·L: todo lo que entra como calor sale como trabajo.
          - texto: >-
              Los tramos a volumen constante no cambian nada del sistema,
              porque no hay trabajo.
            trampa: true
            mensaje: |
              No hay trabajo, pero **sí hay calor**, y mucho: son los dos
              tramos donde el gas se enfría y se calienta. Con $W = 0$, la
              primera ley queda $\Delta U = q$, así que ahí toda la energía
              intercambiada va a energía interna.

              De hecho son imprescindibles: sin ellos el gas no podría volver a
              su presión inicial y no habría ciclo.
        veredicto: |
          El área encerrada es el trabajo neto, y el sentido de giro da el
          signo. Horario, motor; antihorario, frigorífico.

    resolucion: |
      **La idea.** En un ciclo, $\Delta U = 0$ porque $U$ es función de estado.
      El trabajo **no** es cero porque no lo es — y esa diferencia es la que
      hace posibles los motores.

      | tramo | qué pasa | $W$ (atm·L) |
      |---|---|---|
      | 1 · expansión a 3,0 atm | $V$ sube | $-12$ |
      | 2 · enfriar a $V$ constante | nada se mueve | $0$ |
      | 3 · compresión a 1,0 atm | $V$ baja | $+4$ |
      | 4 · calentar a $V$ constante | nada se mueve | $0$ |
      | | | $\boxed{-8}$ |

      **El atajo que conviene reconocer:** ese $-8$ es exactamente el **área
      del rectángulo** que encierra el ciclo,
      $(3{,}0-1{,}0)\times(6{,}0-2{,}0)$. Vale para cualquier ciclo, tenga la
      forma que tenga: el trabajo neto es el área encerrada, y el sentido de
      giro da el signo.

      - **Horario** —expandir arriba, comprimir abajo— el gas produce trabajo.
        Es un motor.
      - **Antihorario**, hay que dárselo. Es un frigorífico.

      **Y de dónde sale esa energía.** Como $\Delta U = 0$, la primera ley
      obliga a que $q = -W = +8$ atm·L: el gas ha absorbido justo ese calor y
      lo ha entregado como trabajo. No se ha creado nada — se ha convertido.

      Los dos tramos a volumen constante parecen no hacer nada porque su
      trabajo es cero, pero son los que mueven el calor: con $W = 0$, allí
      $\Delta U = q$. Sin ellos el ciclo no podría cerrarse.

  # ── Y a partir de aquí, los problemas propuestos del tema en el orden de la
  #    colección (§04). La colección publica la respuesta final; el desarrollo
  #    y los distractores son nuestros. El PDF de esta colección es una
  #    imagen: el volcado de texto devuelve una línea, así que los enunciados
  #    se han leído sobre la página renderizada.
  - id: colfq5-1-el-convenio-en-una-linea
    titulo: Un gas que se comprime y suelta calor, y dos signos que decidirlo todo
    fuente: >-
      Problema 1 · Problemas propuestos del tema 5, Termodinámica clásica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      El trabajo realizado cuando se comprime un gas en un cilindro es de
      450 J. Durante este proceso, hay transferencia de calor de 125 J del gas
      hacia el entorno. Calcular el cambio de energía interna en este proceso.
    pide: La variación de energía interna del gas.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da dos números positivos, 450 y 125. ¿Con qué signo
          entra cada uno en la primera ley?
        opciones:
          - texto: El trabajo positivo y el calor negativo
            correcta: true
            mensaje: |
              Eso es. El convenio cuenta positivo lo que **entra** al sistema.
              Comprimir es hacerle trabajo al gas, así que $W = +450$; y el
              calor va del gas **hacia el entorno**, o sea sale, así que
              $q = -125$.
          - texto: Los dos positivos, porque el enunciado los da positivos
            mensaje: |
              El enunciado da módulos y describe el sentido con palabras
              —«se comprime», «del gas hacia el entorno»—. El signo lo pones
              tú al leer esas palabras; si no lo haces, la primera ley da
              cualquier cosa.
          - texto: El trabajo negativo y el calor positivo
            mensaje: |
              Justo al revés. Comprimir es trabajo que **recibe** el gas, y
              «del gas hacia el entorno» es calor que **cede**. Con estos
              signos saldría $-325$ J, y un gas comprimido que además no
              recibe calor no puede perder energía interna.
          - texto: Los dos negativos, porque el gas pierde en los dos casos
            mensaje: |
              El gas no pierde en los dos casos: pierde calor, pero **recibe**
              trabajo. Comprimirlo es empujarlo, y empujar es dar energía.

      - tipo: calcular
        titulo: La variación de energía interna
        pregunta: |
          Aplicando $\Delta E = q + W$, ¿cuánto vale $\Delta E$, en julios?
        respuesta:
          tipo: numero
          valor: '325'
          tolerancia: 1
          formato: un número entero, en julios
        distractores:
          - valor: '-325'
            mensaje: |
              Tienes los dos signos cambiados. Comprueba el sentido físico:
              al gas se le ha hecho trabajo y solo ha devuelto una parte como
              calor, así que se queda con energía. $\Delta E$ tiene que ser
              positivo.
          - valor: '575'
            mensaje: |
              Has sumado los dos como positivos. El calor sale del gas, así
              que resta.
          - valor: '-575'
            mensaje: |
              Has sumado los dos como negativos. El trabajo de compresión
              entra al gas y suma.
        pista: |
          Lo que entra suma y lo que sale resta. Entran 450 J de trabajo y
          salen 125 J de calor.
        desarrollo: |
          $$
          \Delta E = q + W = (-125) + (+450) = 325\ \mathrm{J}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'El convenio de la asignatura cuenta positivo lo que entra al sistema, y la primera ley se escribe ΔE = q + W.'
          - texto: 'Comprimir el gas es hacerle trabajo desde fuera, así que W = +450 J.'
          - texto: 'El calor va «del gas hacia el entorno», o sea que sale: q = −125 J.'
          - texto: 'ΔE = −125 + 450 = 325 J, positivo, y eso cuadra: al gas le han dado más de lo que ha devuelto.'
          - texto: 'Como el gas cede calor, su energía interna tiene que bajar.'
            trampa: true
            mensaje: |
              El calor es solo una de las dos vías. Aquí el gas cede 125 J por
              una y recibe 450 J por la otra, así que el balance es a favor.
              Mirar solo el calor es olvidarse de la mitad de la primera ley.
    resolucion: |
      **Todo el problema es leer dos frases.** Los números no tienen ninguna
      dificultad; la tiene decidir su signo, y por eso este ejercicio abre la
      colección del tema.

      El convenio de la asignatura —el de la IUPAC— cuenta positivo **lo que
      entra al sistema**, y la primera ley se escribe

      $$
      \Delta E = q + W
      $$

      «Se comprime un gas»: alguien empuja el émbolo desde fuera, así que el
      trabajo **entra**. $W = +450$ J.

      «Transferencia de calor de 125 J del gas hacia el entorno»: el calor
      **sale**. $q = -125$ J.

      $$
      \Delta E = (-125) + (+450) = 325\ \mathrm{J}
      $$

      **La comprobación que evita el 90 % de los fallos de este tema.** Antes
      de escribir el resultado, pregúntate si el signo tiene sentido: al gas
      se le ha dado trabajo y solo ha devuelto parte en forma de calor, así
      que se ha quedado con energía y $\Delta E$ tiene que ser positivo. Si
      te sale negativo, no repases la aritmética — repasa los signos.

      Y un aviso que cuesta caro en la práctica: **hay otro convenio en
      circulación**, el de la ingeniería térmica, que cuenta positivo el
      trabajo que el sistema **produce** y escribe $\Delta E = q - W$. Con él,
      este mismo problema tendría $W = -450$ y daría el mismo 325 J. Los dos
      son correctos; mezclarlos no. Mira siempre cómo está escrita la primera
      ley en el enunciado o en los apuntes que estés usando.

  - id: colfq5-2-el-helio-comprimido
    titulo: Comprimir helio a temperatura constante, y por qué la energía no cambia
    fuente: >-
      Problema 2 · Problemas propuestos del tema 5, Termodinámica clásica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Dos moles de helio gas, inicialmente a 1 atm y 300 K, se comprimen
      reversible e isotérmicamente hasta una presión de 4 atm. Calcular el
      trabajo y calor intercambiados y la variación de energía interna de este
      proceso, suponiendo que se comporta como un gas ideal.
    pide: El trabajo, el calor y la variación de energía interna.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da presiones y la fórmula del trabajo isotermo lleva
          volúmenes. ¿Hace falta calcularlos?
        opciones:
          - texto: No, porque a temperatura constante el cociente de volúmenes es el inverso del de presiones
            correcta: true
            mensaje: |
              Exacto. Con $T$ constante, $P_1V_1 = P_2V_2$, así que
              $V_2/V_1 = P_1/P_2 = 1/4$. El logaritmo se puede escribir
              directamente con las presiones y no hace falta ni un volumen.
          - texto: Sí, hay que sacarlos con la ecuación de los gases ideales
            mensaje: |
              Se puede hacer así y sale lo mismo, pero es trabajo de más y una
              oportunidad más de equivocarse. El cociente es lo único que
              entra en el logaritmo, y ese cociente ya lo tienes.
          - texto: No, porque en una compresión isoterma el trabajo no depende del volumen
            mensaje: |
              Sí depende, y mucho: comprimir a la mitad y comprimir a la
              cuarta parte dan trabajos distintos. Lo que pasa es que depende
              del **cociente**, no de los valores sueltos.
          - texto: Sí, y además hace falta el volumen molar del helio
            mensaje: |
              El helio es un gas ideal aquí por hipótesis del enunciado, así
              que no tiene volumen propio que consultar.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto vale el trabajo, en julios, con el convenio de que es
          positivo lo que entra al sistema?
        respuesta:
          tipo: numero
          valor: '6915'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '-6915'
            mensaje: |
              Signo cambiado. El gas se **comprime**, así que recibe trabajo
              del exterior y con este convenio es positivo. En una expansión
              sería al revés.
          - valor: '4988'
            mensaje: |
              Eso es $nRT$ a secas, sin el logaritmo. Es el factor que va
              delante, no el resultado.
          - valor: '3457'
            mensaje: |
              Parece que has usado un mol en vez de dos, o que has olvidado
              alguno de los factores. Comprueba $n = 2$.
        pista: |
          $W = -nRT \ln(V_2/V_1)$, y $V_2/V_1 = P_1/P_2 = 1/4$.
        desarrollo: |
          $$
          W = -nRT \ln\frac{V_2}{V_1} = -2 \times 8{,}314 \times 300 \times \ln\frac{1}{4}
          $$

          $$
          W = -4988{,}4 \times (-1{,}3863) = 6915\ \mathrm{J}
          $$

          La colección publica $6912{,}06$ J; la diferencia de tres julios
          sale del valor de $R$ que se use y no cambia nada.

      - tipo: calcular
        titulo: El calor
        pregunta: |
          ¿Y el calor intercambiado, en julios?
        respuesta:
          tipo: numero
          valor: '-6915'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '6915'
            mensaje: |
              Signo cambiado. Como $\Delta E = 0$, el calor tiene que ser
              **opuesto** al trabajo: todo lo que entra como trabajo sale como
              calor, o el gas se calentaría y dejaría de ser isotermo.
          - valor: '0'
            mensaje: |
              Cero sería un proceso adiabático. Aquí el calor tiene que salir
              precisamente para que la temperatura no suba mientras se
              comprime.
        pista: |
          $\Delta E = q + W$, y en un gas ideal a temperatura constante
          $\Delta E = 0$.
        desarrollo: |
          $$
          \Delta E = 0 \quad\Longrightarrow\quad q = -W = -6915\ \mathrm{J}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'En un gas ideal la energía interna solo depende de la temperatura, así que en un proceso isotermo ΔE = 0.'
          - texto: 'A temperatura constante P₁V₁ = P₂V₂, así que V₂/V₁ = P₁/P₂ = 1/4 y no hacen falta los volúmenes.'
          - texto: 'W = −nRT ln(1/4) = +6915 J, positivo porque el gas se comprime y recibe trabajo.'
          - texto: 'Y como ΔE = q + W = 0, el calor es q = −6915 J: sale todo lo que entra como trabajo.'
          - texto: 'La energía interna no cambia porque el proceso es reversible.'
            trampa: true
            mensaje: |
              La reversibilidad no tiene nada que ver. Lo que hace $\Delta E = 0$
              es que sea **isotermo** y el gas **ideal**: la energía interna de
              un gas ideal solo depende de $T$. Una compresión isoterma
              irreversible también tendría $\Delta E = 0$, aunque su trabajo
              fuera otro.
    resolucion: |
      **Lo que sale gratis.** El helio se supone gas ideal y el proceso es
      isotermo, así que

      $$
      \Delta E = 0
      $$

      La energía interna de un gas ideal solo depende de la temperatura, y no
      cambia. Ojo con el motivo: es **ideal + isotermo**, no «reversible».

      **El trabajo, sin calcular volúmenes.** A $T$ constante se cumple
      $P_1V_1 = P_2V_2$, así que

      $$
      \frac{V_2}{V_1} = \frac{P_1}{P_2} = \frac{1}{4}
      $$

      $$
      W = -nRT \ln\frac{V_2}{V_1} = -2 \times 8{,}314 \times 300 \times \ln 0{,}25 = +6915\ \mathrm{J}
      $$

      Positivo, porque el gas **recibe** trabajo: lo están comprimiendo.

      **El calor sale de la primera ley y no hay que calcularlo aparte.**

      $$
      q = \Delta E - W = 0 - 6915 = -6915\ \mathrm{J}
      $$

      Es decir: **todo el trabajo que entra sale como calor**. Tiene que ser
      así, y conviene entender por qué antes que memorizarlo. Comprimir un gas
      lo calienta; si además se quiere que la temperatura no cambie, hay que
      ir retirando exactamente ese calor. Eso es lo que significa hacer una
      compresión isoterma en la práctica: comprimir despacio, en contacto con
      un baño que absorba el calor.

  - id: colfq5-4-el-aire-en-dos-etapas
    titulo: Dos compresiones seguidas, y por qué no se pueden sumar los volúmenes
    fuente: >-
      Problema 4 · Problemas propuestos del tema 5, Termodinámica clásica ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La colección publica la respuesta final; el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Una masa de aire, inicialmente a 80 kPa, ocupa un volumen de 100 dm³. Se
      comprime isotérmicamente hasta reducir su volumen a la mitad.
      Posteriormente, se vuelve a reducir el volumen a la mitad mediante un
      proceso isobaro. Suponiendo comportamiento ideal del gas, determina el
      trabajo total del proceso.
    pide: El trabajo total de las dos etapas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda etapa es isobara. ¿A qué presión ocurre?
        opciones:
          - texto: A 160 kPa, la que ha quedado al final de la primera etapa
            correcta: true
            mensaje: |
              Eso es lo que más se falla aquí. «Isobaro» significa presión
              constante **durante esa etapa**, no igual a la del principio del
              problema. Y al final de la primera el volumen es la mitad, así
              que la presión ha doblado.
          - texto: A 80 kPa, la presión inicial del enunciado
            mensaje: |
              La presión ya no es 80 kPa cuando empieza la segunda etapa: la
              primera la ha subido. Con este error el trabajo de la segunda
              sale la mitad de lo que es.
          - texto: A 40 kPa, porque el volumen se ha reducido
            mensaje: |
              Al comprimir un gas la presión **sube**, no baja. A temperatura
              constante, la mitad de volumen es el doble de presión.
          - texto: No se puede saber sin conocer la temperatura
            mensaje: |
              No hace falta: la primera etapa es isoterma, así que
              $P_1V_1 = P_2V_2$ y la presión final sale del cociente de
              volúmenes sin saber a qué temperatura ocurre todo.

      - tipo: calcular
        titulo: El trabajo de la primera etapa
        pregunta: |
          Comprimiendo isotérmicamente de 100 a 50 dm³ desde 80 kPa, ¿cuánto
          trabajo entra al gas, en julios?
        respuesta:
          tipo: numero
          valor: '5545'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '-5545'
            mensaje: |
              Signo cambiado. Es una compresión: el gas recibe trabajo.
          - valor: '8000'
            mensaje: |
              Eso es $P_1V_1$ sin el logaritmo, es decir $80\,000 \times 0{,}1$.
              Es el factor de delante, no el resultado.
          - valor: '4000'
            mensaje: |
              Eso es $P \Delta V$, que sería el trabajo si la presión no
              cambiara. Pero en una isoterma la presión sube mientras
              comprimes, así que hay que integrar y sale el logaritmo.
        pista: |
          $W = -P_1V_1 \ln(V_2/V_1)$, con $P_1V_1 = nRT$. Pasa el volumen a
          metros cúbicos.
        desarrollo: |
          $$
          W_1 = -P_1V_1 \ln\frac{V_2}{V_1} = -80000 \times 0{,}1 \times \ln 0{,}5
          $$

          $$
          W_1 = -8000 \times (-0{,}6931) = 5545\ \mathrm{J}
          $$

      - tipo: calcular
        titulo: El trabajo total
        pregunta: |
          Sumando la segunda etapa, isobara a 160 kPa de 50 a 25 dm³, ¿cuánto
          vale el trabajo total, en julios?
        respuesta:
          tipo: numero
          valor: '9545'
          tolerancia: 5
          formato: un número entero, en julios
        distractores:
          - valor: '5545'
            mensaje: |
              Ese es solo el de la primera etapa. Falta sumarle el de la
              segunda, que son 4000 J más.
          - valor: '4000'
            mensaje: |
              Ese es solo el de la segunda. El trabajo total es la suma de las
              dos, porque el trabajo es función de camino y se acumula tramo
              a tramo.
          - valor: '7545'
            mensaje: |
              Parece que has usado 80 kPa en la segunda etapa en vez de 160.
              La presión ha doblado al terminar la primera.
        pista: |
          En una isobara $W = -P\,\Delta V$, con $P = 160$ kPa y
          $\Delta V = -0{,}025$ m³.
        desarrollo: |
          $$
          W_2 = -P\,\Delta V = -160000 \times (0{,}025 - 0{,}05) = 4000\ \mathrm{J}
          $$

          $$
          W_{\text{total}} = 5545 + 4000 = 9545\ \mathrm{J}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La primera etapa es isoterma, así que W₁ = −P₁V₁ ln(V₂/V₁) = −8000 × ln 0,5 = 5545 J.'
          - texto: 'Al terminar la primera, el volumen es la mitad y la presión el doble: 160 kPa.'
          - texto: 'La segunda es isobara a esos 160 kPa, así que W₂ = −P ΔV = −160 000 × (−0,025) = 4000 J.'
          - texto: 'El trabajo total es la suma de los dos tramos, 9545 J, y entra al gas en los dos.'
          - texto: 'Los dos tramos se pueden juntar en uno solo de 100 a 25 dm³, porque el trabajo solo depende de los estados inicial y final.'
            trampa: true
            mensaje: |
              El trabajo es **función de camino**, no de estado: dos caminos
              distintos entre los mismos extremos dan trabajos distintos. De
              hecho una isoterma de 100 a 25 dm³ daría
              $-8000 \ln 0{,}25 = 11\,090$ J, que no son los 9545 de aquí.
              Lo que sí se podría juntar es $\Delta E$ o $\Delta H$.
    resolucion: |
      **Dos etapas, dos fórmulas distintas, y una presión que cambia entre
      medias.** Ese es todo el problema.

      **Etapa 1, isoterma, de 100 a 50 dm³.** En una isoterma la presión sube
      mientras comprimes, así que hay que integrar y aparece el logaritmo:

      $$
      W_1 = -P_1V_1 \ln\frac{V_2}{V_1} = -80000 \times 0{,}1 \times \ln 0{,}5 = 5545\ \mathrm{J}
      $$

      **El eslabón que se olvida.** Al terminar esa etapa la presión ya no es
      80 kPa. Con $T$ constante y el volumen a la mitad:

      $$
      P_2 = \frac{P_1V_1}{V_2} = \frac{80 \times 100}{50} = 160\ \mathrm{kPa}
      $$

      **Etapa 2, isobara, de 50 a 25 dm³ a 160 kPa.** Aquí la presión no
      cambia, así que no hay logaritmo:

      $$
      W_2 = -P\,\Delta V = -160000 \times (0{,}025 - 0{,}05) = 4000\ \mathrm{J}
      $$

      $$
      W_{\text{total}} = 5545 + 4000 = 9545\ \mathrm{J}
      $$

      **Y lo que el problema enseña de fondo.** El trabajo es **función de
      camino**. Si en vez de estas dos etapas se hiciera una sola isoterma de
      100 a 25 dm³ —los mismos extremos de volumen— saldría

      $$
      -8000 \times \ln 0{,}25 = 11090\ \mathrm{J}
      $$

      Mil quinientos julios más, por el mismo cambio de volumen. Por eso no se
      pueden juntar tramos ni «atajar» un camino: hay que recorrerlo entero,
      etapa por etapa, arrastrando el estado que deja cada una.
