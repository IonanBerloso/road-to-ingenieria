ejercicios:
  # ── Los dos son NUESTROS (§08). Los dos ejercicios de examen de este tema
  #    piden cuatro cosas seguidas —reacción, esquema, K y Nernst— sobre pares
  #    que hay que elegir de una tabla de tres. Aquí se usa la pila de manual,
  #    Daniell, para aislar primero la resta de potenciales y después Nernst.
  - id: ejfq10-la-resta-que-no-lleva-signos
    titulo: La pila de cinc y cobre, y la resta que no cambia signos
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      Se construye una pila con un electrodo de cinc sumergido en disolución de
      Zn²⁺ y uno de cobre en disolución de Cu²⁺, ambas 1 M.

      Determinar la reacción espontánea, el potencial de la pila en condiciones
      estándar y su constante de equilibrio a 25 °C.

      **Datos:** potenciales estándar de reducción:
      $E^{0}(\mathrm{Zn^{2+}/Zn}) = -0{,}76$ V ·
      $E^{0}(\mathrm{Cu^{2+}/Cu}) = +0{,}34$ V ·
      $F = 96\,485$ C/mol · $R = 8{,}314$ J/(mol·K).
    pide: La reacción espontánea, el potencial estándar de la pila y su constante de equilibrio.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con los dos potenciales delante, ¿cuál de los dos metales se oxida?
        opciones:
          - texto: >-
              El cinc, porque su potencial de reducción es **menor**
            correcta: true
            mensaje: |
              Eso es. La tabla mide ganas de reducirse, así que el que menos
              tiene es el que acaba haciendo lo contrario. El cinc pasa a Zn²⁺
              y suelta electrones.
          - texto: >-
              El cobre, porque su potencial es positivo
            mensaje: |
              El signo del potencial no dice quién se oxida: lo dice la
              **comparación** entre los dos. Frente a un metal aún más noble,
              el cobre también se oxidaría.
          - texto: >-
              El cinc, porque su potencial es negativo
            mensaje: |
              Aciertas el metal por la razón equivocada, y esa razón falla en
              cuanto los dos potenciales son positivos — como en el ejercicio
              de la ordinaria de 2024-2025, con 0,521 y 0,77. Lo que decide es
              cuál es **menor**.
          - texto: >-
              Depende de las concentraciones, y aquí no se puede saber
            mensaje: |
              Las concentraciones sí pueden llegar a invertir una pila, pero
              hace falta muchísima diferencia. Con las dos a 1 M estamos en
              condiciones estándar y manda la tabla.

      - tipo: calcular
        titulo: El potencial de la pila
        pregunta: ¿Cuánto vale $E^{0}$ de la pila?
        respuesta:
          tipo: numero
          valor: '1.10'
          tolerancia: 0.03
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.42'
            mensaje: |
              Has cambiado el signo del cinc al invertir su semirreacción
              **y además** has restado. La resta ya se encarga del cambio de
              sentido: los potenciales entran tal como vienen en la tabla.
          - valor: '2.20'
            mensaje: |
              Has multiplicado por los 2 electrones. El potencial es una
              magnitud **intensiva**: no se multiplica por los coeficientes,
              igual que juntar dos vasos a 80 °C no da 160.
        pista: |
          $E^{0}_{\text{pila}} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$,
          con los dos valores tal como los da la tabla. El cátodo es donde se
          reduce.
        desarrollo: |
          $$
          E^{0}_{\text{pila}} = E^{0}(\mathrm{Cu^{2+}/Cu})
          - E^{0}(\mathrm{Zn^{2+}/Zn}) = 0{,}34 - (-0{,}76) = 1{,}10\ \text{V}
          $$
          Positivo, así que la reacción
          $\mathrm{Zn} + \mathrm{Cu^{2+}} \rightarrow
          \mathrm{Zn^{2+}} + \mathrm{Cu}$ es espontánea.

      - tipo: calcular
        titulo: La energía libre
        pregunta: ¿Cuánto vale $\Delta G^{0}$ de la reacción?
        respuesta:
          tipo: numero
          valor: '-212.3'
          tolerancia: 6
          formato: la energía libre en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '212.3'
            mensaje: |
              Signo cambiado. En $\Delta G^{0} = -nFE^{0}$ el menos está en la
              fórmula: un potencial positivo da una energía libre **negativa**,
              que es lo que significa espontánea.
          - valor: '-106.1'
            mensaje: |
              Te has dejado los electrones. La reacción intercambia **dos** por
              cada cinc que se oxida, así que $n = 2$.
        pista: |
          $\Delta G^{0} = -nFE^{0}$, con $n$ los electrones intercambiados en
          la reacción ajustada — no los de una semirreacción suelta.
        desarrollo: |
          $$
          \Delta G^{0} = -nFE^{0} = -2\cdot 96\,485\cdot 1{,}10
          = -212\,267\ \text{J} = -212{,}3\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La tabla da reducciones, así que el de potencial mayor —el
              cobre— es el que se reduce.
          - texto: >-
              El cinc, con el menor, se oxida: es el ánodo y el polo negativo.
          - texto: >-
              $E^{0}_{\text{pila}} = 0{,}34 - (-0{,}76) = 1{,}10$ V, con los
              valores tal cual vienen.
          - texto: >-
              Con dos electrones, $\Delta G^{0} = -212{,}3$ kJ y
              $K = 1{,}5\cdot 10^{37}$: la reacción está completamente
              desplazada.
          - texto: >-
              Como hay que invertir la semirreacción del cinc para escribirla
              como oxidación, hay que cambiarle el signo antes de restar.
            trampa: true
            mensaje: |
              Se cuenta dos veces. La fórmula
              $E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$ **ya** incorpora
              que el ánodo va al revés: eso es lo que significa la resta.

              Y lo peligroso es que aquí el resultado equivocado, 0,42 V,
              también sale positivo, así que la comprobación de «tiene que ser
              positiva si es espontánea» no lo caza. Solo lo caza no hacerlo.
        veredicto: |
          Cátodo menos ánodo, con los números de la tabla y sin tocarlos. Y
          los electrones aparecen después, en $\Delta G$, no en el potencial.

    resolucion: |
      **La idea.** Una tabla de potenciales está escrita toda como reducciones
      y el número mide las ganas de reducirse. Con eso, decidir qué pasa al
      juntar dos pares es una comparación.

      El cobre (+0,34) tiene más ganas que el cinc (−0,76), así que el cobre se
      reduce y el cinc se oxida:

      $$
      \mathrm{Zn} + \mathrm{Cu^{2+}} \rightarrow
      \mathrm{Zn^{2+}} + \mathrm{Cu}
      $$
      $$
      \boxed{\;E^{0} = 0{,}34 - (-0{,}76) = 1{,}10\ \text{V}\;}
      $$

      **Las dos trampas de esta línea**, y las dos dan resultados que no
      parecen raros:

      - **No se cambian signos.** La resta ya invierte el ánodo. Cambiando
        además el signo del cinc saldría 0,42 V, positivo también, y nada
        avisaría.
      - **No se multiplica por los coeficientes.** El potencial es intensivo.
        Los dos electrones entran después.

      Y de ahí los otros dos números, que dicen lo mismo con otras unidades:

      $$
      \Delta G^{0} = -nFE^{0} = \boxed{-212{,}3\ \text{kJ}}
      \qquad
      K = e^{\,nFE^{0}/RT} = \boxed{1{,}5\cdot 10^{37}}
      $$

      Una constante de $10^{37}$ significa que en el equilibrio no queda
      prácticamente Cu²⁺: la reacción va hasta el final. Es lo que se ve al
      meter una lámina de cinc en sulfato de cobre — el azul desaparece y
      aparece cobre metálico.

  - id: ejfq10-nernst-y-la-pila-que-empuja-mas
    titulo: Por qué una pila casi gastada empuja menos
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura.
    nivel: ejemplo
    enunciado: |
      En la pila anterior —cinc y cobre, $E^{0} = 1{,}10$ V— se cambian las
      concentraciones: **[Cu²⁺] = 1,0 M** y **[Zn²⁺] = 0,001 M**.

      Calcular el potencial de la pila en esas condiciones y razonar si es
      mayor o menor que el estándar.

      **Dato:** a 25 °C,
      $E = E^{0} - \dfrac{0{,}0592}{n}\log Q$.
    pide: El potencial de la pila con esas concentraciones, y por qué cambia.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué entra en $Q$ para esta pila?
        opciones:
          - texto: >-
              Solo los iones: $Q = [\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}]$
            correcta: true
            mensaje: |
              Eso es. Los dos metales son sólidos puros y no entran, igual que
              no entraban en $K_c$. Y el Zn²⁺ va arriba porque es el producto.
          - texto: >-
              Los iones y los metales, los cuatro
            mensaje: |
              Un sólido puro tiene actividad 1. Su cantidad cambia al gastarse
              la pila, pero su **concentración** no: un trozo de cinc es igual
              de cinc sea grande o pequeño.
          - texto: >-
              $Q = [\mathrm{Cu^{2+}}]/[\mathrm{Zn^{2+}}]$
            mensaje: |
              Está del revés. En $Q$, como en cualquier cociente de reacción,
              los productos van arriba — y aquí el producto es el Zn²⁺.
          - texto: >-
              Nada, porque en una pila las concentraciones no importan
            mensaje: |
              Importan, y bastante: aquí cambian el potencial en 89 mV. Lo que
              no cambian es $E^{0}$, que es por definición el de 1 M.

      - tipo: calcular
        titulo: El potencial real
        pregunta: ¿Cuánto vale $E$ con esas concentraciones?
        respuesta:
          tipo: numero
          valor: '1.189'
          tolerancia: 0.015
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '1.011'
            mensaje: |
              Has puesto $Q$ del revés. El producto es el Zn²⁺, que está a
              0,001 M, así que $Q$ es **pequeño** y el potencial **sube**.
          - valor: '1.278'
            mensaje: |
              Te has dejado la $n$ del denominador. Se intercambian dos
              electrones, así que el factor es 0,0592/2 y no 0,0592.
        pista: |
          $Q = [\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}] = 10^{-3}$, su logaritmo
          es −3, y con el menos de la fórmula el potencial sube.
        desarrollo: |
          $$
          Q = \frac{0{,}001}{1{,}0} = 10^{-3}
          \qquad
          \log Q = -3
          $$
          $$
          E = 1{,}10 - \frac{0{,}0592}{2}\cdot(-3)
          = 1{,}10 + 0{,}089 = 1{,}189\ \text{V}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En $Q$ solo entran los iones: los dos metales son sólidos puros.
          - texto: >-
              $Q = [\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}] = 10^{-3}$, con el
              producto arriba.
          - texto: >-
              Con dos electrones, el término de Nernst vale
              $(0{,}0592/2)\cdot(-3) = -0{,}089$ V.
          - texto: >-
              Restándolo, $E = 1{,}189$ V: **más** que el estándar.
          - texto: >-
              Tiene sentido: hay poco producto, así que a la reacción le queda
              más camino por delante y empuja más.
          - texto: >-
              Cuando la pila se agote y $Q$ llegue a $K$, el potencial será
              negativo y la reacción irá hacia atrás.
            trampa: true
            mensaje: |
              En el equilibrio el potencial es **cero**, no negativo. Es
              justamente la definición: $Q = K$ hace que el término de Nernst
              iguale a $E^{0}$ y la diferencia se anule.

              Una pila agotada no empuja al revés: no empuja. Para que fuera al
              revés habría que pasarse del equilibrio, y eso solo ocurre si
              alguien aporta corriente desde fuera — que es una electrólisis,
              no una pila.
        veredicto: |
          Poco producto, más empuje. Y el equilibrio es donde el empuje se
          acaba, no donde se invierte.

    resolucion: |
      **La idea.** $E^{0}$ es el potencial con todo a 1 M. Nernst corrige para
      las concentraciones reales, y la corrección se lee sin calcular nada:
      **poco producto, más empuje**.

      $$
      Q = \frac{[\mathrm{Zn^{2+}}]}{[\mathrm{Cu^{2+}}]} = \frac{0{,}001}{1{,}0}
      = 10^{-3}
      $$
      $$
      E = 1{,}10 - \frac{0{,}0592}{2}\log 10^{-3}
      = 1{,}10 + 0{,}089 = \boxed{1{,}189\ \text{V}}
      $$

      Los metales no entran en $Q$: son sólidos puros, actividad 1. Es la misma
      regla del tema 8 y se olvida en los dos.

      **La lectura física**, que es lo que hay que saber decir en el examen:
      hay mil veces menos producto del que habría en el equilibrio, así que a
      la reacción le queda mucho camino y tira con más fuerza. Al revés
      —Zn²⁺ 1 M y Cu²⁺ 0,001— saldría 1,011 V.

      **Y el final del camino.** Según la pila funciona, el Zn²⁺ sube y el Cu²⁺
      baja, así que $Q$ crece y $E$ baja. Cuando $Q$ alcanza a $K$:

      $$
      E = E^{0} - \frac{0{,}0592}{n}\log K = 0
      $$

      El potencial es **cero**, no negativo. Una pila gastada está en
      equilibrio: no es que empuje al revés, es que ha dejado de empujar. Con
      $K = 1{,}5\cdot 10^{37}$, eso ocurre cuando ya no queda cobre en
      disolución que valga la pena — por eso una pila Daniell dura tanto.
  # ── Los ejemplos de entrada que faltaban, escritos el 5 de septiembre de
  #    2026. La ruta tenía ocho escalones de Química que arrancaban
  #    directamente en un ejercicio de examen, y §14 no lo admite: si el
  #    primero no lo puede hacer alguien que acaba de leer la teoría, falta
  #    un peldaño delante.
  - id: ejfq10-la-pila-daniell-y-sus-tres-numeros
    titulo: La pila Daniell, y los tres números que dicen lo mismo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni de los
      problemas propuestos de la asignatura; los potenciales son los tabulados
      del temario.
    nivel: ejemplo
    enunciado: |
      Se monta una pila con un electrodo de cinc sumergido en ZnSO₄ 1 M y otro
      de cobre en CuSO₄ 1 M, unidos por un puente salino. Datos:

      $$
      E^{0}(\mathrm{Cu^{2+}/Cu}) = +0{,}34\ \text{V}
      \qquad
      E^{0}(\mathrm{Zn^{2+}/Zn}) = -0{,}76\ \text{V}
      $$

      Calcular la fuerza electromotriz de la pila y la variación de energía
      libre de Gibbs de la reacción, y decir si es espontánea.
    pide: La fem de la pila y el ΔG° de la reacción.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué electrodo actúa de cátodo?
        opciones:
          - texto: El cobre, porque tiene el potencial de reducción más alto
            correcta: true
            mensaje: |
              Eso es. El cátodo es donde ocurre la reducción, y se reduce el
              que más «ganas» tiene de hacerlo, es decir el de potencial de
              reducción mayor. El cinc queda de ánodo y se oxida.
          - texto: El cinc, porque su potencial es negativo
            correcta: false
            mensaje: |
              El signo negativo dice justo lo contrario: que se reduce peor que
              el hidrógeno, y por tanto peor que el cobre. El cinc es el que se
              oxida, o sea el ánodo — y por eso la lámina de cinc se va
              consumiendo.
          - texto: El cobre, porque es el metal más pesado
            correcta: false
            mensaje: |
              La masa no interviene. Lo único que decide es la comparación de
              los dos potenciales de reducción, y da la casualidad de que aquí
              gana el más pesado.
          - texto: Depende de hacia dónde se conecte el voltímetro
            correcta: false
            mensaje: |
              La pila tiene su ánodo y su cátodo antes de conectar nada:
              los fija la química. Conectar el voltímetro al revés solo cambia
              el signo que se lee en la pantalla.

      - tipo: calcular
        titulo: La fuerza electromotriz
        pregunta: |
          ¿Cuánto vale la fem de la pila en condiciones estándar?
        respuesta:
          tipo: numero
          valor: '1.10'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos decimales
        distractores:
          - valor: '-0.42'
            mensaje: |
              Has sumado los dos potenciales. La fem es una **diferencia**:
              cátodo menos ánodo.
          - valor: '0.42'
            mensaje: |
              Ese es el valor absoluto de la suma. La fem es la resta, y hay
              que respetar el signo del potencial del cinc al restarlo:
              $0{,}34 - (-0{,}76)$.
          - valor: '-1.10'
            mensaje: |
              El valor está bien y el signo al revés: has puesto el cinc de
              cátodo. Una pila espontánea tiene siempre la fem positiva; si te
              sale negativa, tienes los electrodos cambiados.
        pista: |
          $E^{0}_{\text{pila}} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$.
        desarrollo: |
          $$
          E^{0}_{\text{pila}} = 0{,}34 - (-0{,}76) = 1{,}10\ \text{V}
          $$

      - tipo: calcular
        titulo: La energía libre
        pregunta: |
          La reacción intercambia dos electrones. ¿Cuánto vale $\Delta G^{0}$?
        respuesta:
          tipo: numero
          valor: '-212.3'
          tolerancia: 2
          formato: la energía libre en kJ/mol, con una cifra decimal y su signo
        distractores:
          - valor: '212.3'
            mensaje: |
              Falta el signo menos de la fórmula. $\Delta G^{0} = -nFE^{0}$, y
              con $E^{0}$ positiva el resultado sale negativo, que es lo que
              dice que la reacción es espontánea.
          - valor: '-106.1'
            mensaje: |
              Has usado un solo electrón. La reacción es
              $\mathrm{Zn} + \mathrm{Cu^{2+}} \rightarrow \mathrm{Zn^{2+}} +
              \mathrm{Cu}$, y ahí se transfieren **dos**.
          - valor: '-212300'
            mensaje: |
              El número es el correcto en julios. El formato pide kilojulios:
              hay que dividir entre mil.
        pista: |
          $\Delta G^{0} = -n F E^{0}$, con $F = 96\,485$ C/mol.
        desarrollo: |
          $$
          \Delta G^{0} = -n F E^{0} = -2 \times 96\,485 \times 1{,}10
          = -212\,267\ \text{J/mol} = -212{,}3\ \text{kJ/mol}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'Se reduce el de potencial de reducción mayor: el cobre es el cátodo y el cinc el ánodo.'
          - texto: 'La fem es la diferencia cátodo menos ánodo, 0,34 − (−0,76) = 1,10 V, y sale positiva.'
          - texto: 'Con dos electrones intercambiados, ΔG° = −nFE° = −212,3 kJ/mol, negativa: la reacción es espontánea.'
          - texto: 'Los tres números dicen lo mismo con distinta unidad: E° > 0, ΔG° < 0 y K > 1 van siempre juntos.'
            # no lleva trampa
          - texto: 'Los electrones salen del cátodo y van al ánodo por el circuito exterior.'
            trampa: true
            mensaje: |
              Van al revés. Los electrones salen del **ánodo** —donde algo se
              oxida y los suelta— y llegan al **cátodo**, donde algo se reduce
              y los recoge. Aquí salen del cinc y llegan al cobre, que es por
              lo que la lámina de cinc adelgaza y sobre la de cobre se deposita
              metal.
    resolucion: |
      ## Una sola cuenta, tres formas de escribirla

      **El montaje.** Cátodo el de mayor potencial de reducción, o sea el
      cobre; ánodo el cinc. La notación abreviada de la pila:

      $$
      \mathrm{Zn\,|\,Zn^{2+}\,(1\ M)\,\|\,Cu^{2+}\,(1\ M)\,|\,Cu}
      $$

      con el ánodo siempre a la izquierda y la doble barra por puente salino.

      **La reacción global**, que sale de sumar las dos semirreacciones:

      $$
      \mathrm{Zn\,(s)} + \mathrm{Cu^{2+}\,(aq)} \rightarrow
      \mathrm{Zn^{2+}\,(aq)} + \mathrm{Cu\,(s)}
      \qquad n = 2
      $$

      **Los tres números.**

      $$
      E^{0} = 0{,}34 - (-0{,}76) = 1{,}10\ \text{V}
      $$

      $$
      \Delta G^{0} = -nFE^{0} = -212{,}3\ \text{kJ/mol}
      $$

      $$
      \ln K = \frac{nFE^{0}}{RT} = 85{,}6
      \quad\Rightarrow\quad
      K \approx 1{,}5\cdot 10^{37}
      $$

      Y eso es lo que hay que llevarse: **son el mismo dato tres veces**. Una
      fem positiva, una energía libre negativa y una constante enorme dicen
      exactamente lo mismo — que la reacción va— y se pasa de una a otra sin
      información nueva. Si en un examen te salen incoherentes entre sí, hay un
      error de signo en alguna de las tres.

      **El sentido de las cosas**, que es la otra mitad de la pregunta:

      - Los **electrones** van por el cable del ánodo al cátodo, de cinc a
        cobre.
      - En el **puente salino** los aniones van hacia el ánodo y los cationes
        hacia el cátodo, que parece al revés y no lo es: compensan la carga
        que se acumula en cada vaso.
      - La lámina de **cinc adelgaza** y sobre la de **cobre se deposita**
        metal.

      **Y el aviso de cara al examen.** Aquí uno de los dos potenciales es
      negativo, y eso permite un atajo: el negativo es el ánodo. El ejercicio
      del final de 2024-2025 pone los dos positivos a propósito, para que el
      atajo no funcione y haya que comparar de verdad.

  - id: ejfq10-nernst-electrodo-por-electrodo
    titulo: Nernst aplicado a cada electrodo, y la comprobación que cuadra
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ecuación de Nernst
      del tema 10. El ejemplo anterior la aplica a la pila entera; este la
      aplica a cada electrodo por separado, que es lo que pide el examen con
      esas palabras. No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      En la pila de cinc y cobre, con $E^{0} = 1{,}10\ \text{V}$, las
      concentraciones son ahora
      $[\mathrm{Cu^{2+}}] = 0{,}010\ \text{M}$ y
      $[\mathrm{Zn^{2+}}] = 0{,}10\ \text{M}$.

      a) Calcular el potencial **de cada electrodo**.

      b) Con ellos, el potencial de la pila, y comprobar que coincide con
      aplicar Nernst a la reacción global.

      **Datos:** $E^{0}(\mathrm{Cu^{2+}/Cu}) = +0{,}34\ \text{V}$ ·
      $E^{0}(\mathrm{Zn^{2+}/Zn}) = -0{,}76\ \text{V}$ · a 25 °C,
      $E = E^{0} - \dfrac{0{,}0592}{n}\log Q$.
    pide: El potencial de cada electrodo y el de la pila.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al aplicar Nernst a **un solo electrodo**, $\mathrm{Cu^{2+}} + 2e^-
          \rightarrow \mathrm{Cu}$, ¿qué se pone en $Q$?
        opciones:
          - texto: >-
              $Q = 1/[\mathrm{Cu^{2+}}]$: el metal sólido no entra, y el ion
              va en el denominador porque es reactivo
            correcta: true
            mensaje: |
              Eso es. La semirreacción se escribe siempre **como reducción**, y
              $Q$ se monta con ella: productos arriba, reactivos abajo, y los
              sólidos puros valen 1. El metal del electrodo es sólido, así que
              arriba solo queda el uno.
          - texto: >-
              $Q = [\mathrm{Cu^{2+}}]$, la concentración tal cual
            mensaje: |
              Eso invierte el logaritmo y con él el signo de la corrección.
              Fíjate en el sentido físico: si hay **menos** ion, la reducción
              cuesta más y el potencial baja. Con $Q = [\mathrm{Cu^{2+}}]$
              saldría al revés.
          - texto: >-
              $Q = [\mathrm{Cu^{2+}}]/[\mathrm{Zn^{2+}}]$
            mensaje: |
              Ese es el $Q$ de la **reacción global**, y sirve para la otra
              forma de hacerlo — la del apartado b). Al trabajar electrodo por
              electrodo, cada uno solo ve sus propias especies.

      - tipo: calcular
        titulo: El electrodo de cobre
        pregunta: |
          ¿Cuánto vale el potencial del electrodo de cobre, en voltios?
        respuesta:
          tipo: numero
          valor: '0.2808'
          tolerancia: 0.002
          formato: un número, en voltios
        distractores:
          - valor: '0.3992'
            mensaje: |
              Has sumado la corrección en vez de restarla, o has puesto
              $Q = [\mathrm{Cu^{2+}}]$. El ion está **diluido**, así que la
              reducción está menos favorecida y el potencial tiene que
              **bajar** respecto del estándar.
          - valor: '0.34'
            mensaje: |
              Ese es el potencial estándar, sin corregir. Solo valdría si la
              concentración fuera 1 M, y aquí es cien veces menor.
        pista: |
          $n = 2$, así que el factor es $0{,}0592/2 = 0{,}0296$. Y
          $\log(1/0{,}010) = 2$.
        desarrollo: |
          $$
          E = 0{,}34 - \frac{0{,}0592}{2}\log\frac{1}{0{,}010}
          = 0{,}34 - 0{,}0296\cdot 2 = 0{,}2808\ \text{V}
          $$

      - tipo: calcular
        titulo: El electrodo de cinc
        pregunta: |
          ¿Y el del electrodo de cinc, en voltios?
        respuesta:
          tipo: numero
          valor: '-0.7896'
          tolerancia: 0.002
          formato: un número, en voltios
        distractores:
          - valor: '-0.7304'
            mensaje: |
              Has sumado la corrección. Aquí también el ion está diluido
              —0,10 M— así que la reducción está menos favorecida y el
              potencial baja: se hace **más negativo**, no menos.
          - valor: '-0.76'
            mensaje: |
              Ese es el estándar. La concentración es 0,10 M, no 1 M, así que
              hay corrección — pequeña, porque el logaritmo de diez es uno,
              pero la hay.
        pista: |
          Mismo procedimiento, y el signo del resultado no cambia: sigue siendo
          negativo.
        desarrollo: |
          $$
          E = -0{,}76 - 0{,}0296\cdot\log\frac{1}{0{,}10}
          = -0{,}76 - 0{,}0296 = -0{,}7896\ \text{V}
          $$

          Los **dos** electrodos han bajado, porque en los dos el ion está
          diluido. Que la pila acabe dando casi lo mismo que en condiciones
          estándar no es que las correcciones no existan: es que **se restan**.

      - tipo: calcular
        titulo: La pila
        pregunta: |
          ¿Cuánto vale el potencial de la pila, en voltios?
        respuesta:
          tipo: numero
          valor: '1.0704'
          tolerancia: 0.002
          formato: un número, en voltios
        distractores:
          - valor: '1.1'
            mensaje: |
              Ese es el estándar. Las dos correcciones no se cancelan del todo,
              porque las concentraciones no han bajado en la misma
              proporción: el cobre por cien y el cinc por diez.
          - valor: '-1.0704'
            mensaje: |
              Has restado al revés. El potencial de una pila espontánea es
              positivo: se resta el ánodo al cátodo, y el cátodo es el de
              potencial **mayor**.
        pista: |
          Cátodo menos ánodo, y el cátodo es el de mayor potencial.
        desarrollo: |
          $$
          E_{\text{pila}} = E_{\text{cátodo}} - E_{\text{ánodo}}
          = 0{,}2808 - \left(-0{,}7896\right) = 1{,}0704\ \text{V}
          $$

          **Y la comprobación**, que es la razón de ser de este ejercicio. Por
          el otro camino, aplicando Nernst a la reacción global con
          $Q = [\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}] = 10$:

          $$
          E = 1{,}10 - 0{,}0296\cdot\log 10 = 1{,}10 - 0{,}0296 = 1{,}0704\ \text{V}
          $$

          **Los dos caminos dan el mismo número hasta la última cifra**, y no
          por casualidad: restar los dos Nernst de electrodo es
          algebraicamente lo mismo que aplicar uno solo a la reacción global.
          Cuando el examen pide «el potencial de cada electrodo» y luego el de
          la pila, la segunda cuenta es gratis y además te dice si la primera
          estaba bien.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada semirreacción se escribe como reducción, y su $Q$ lleva
              solo sus especies: el sólido vale 1 y el ion va abajo.
          - texto: >-
              Con el ion diluido, los dos potenciales de electrodo bajan
              respecto de su valor estándar.
          - texto: >-
              El de la pila sale de restar ánodo a cátodo, 1,0704 V, y coincide
              con aplicar Nernst a la reacción global.
          - texto: >-
              Y como los dos electrodos han bajado, la pila da menos que en
              condiciones estándar exactamente por la suma de las dos
              correcciones.
            trampa: true
            mensaje: |
              Por la **diferencia**, no por la suma. Las dos correcciones
              entran con signos opuestos al restar los electrodos: el cobre
              baja 0,0592 y el cinc baja 0,0296, y la pila pierde solo la
              diferencia, 0,0296. Si las dos concentraciones hubieran bajado en
              la misma proporción, la pila habría dado **exactamente** el
              potencial estándar.
    resolucion: |
      **a) Cada electrodo por separado.** Con $n=2$, el factor es
      $0{,}0592/2 = 0{,}0296$, y cada semirreacción escrita como reducción
      lleva su propio $Q$:

      $$
      E_{\mathrm{Cu}} = 0{,}34 - 0{,}0296\log\frac{1}{0{,}010} = 0{,}2808\ \text{V}
      $$
      $$
      E_{\mathrm{Zn}} = -0{,}76 - 0{,}0296\log\frac{1}{0{,}10} = -0{,}7896\ \text{V}
      $$

      **b) La pila, por los dos caminos.**

      $$
      E_{\text{pila}} = 0{,}2808 - (-0{,}7896) = 1{,}0704\ \text{V}
      $$
      $$
      E_{\text{pila}} = 1{,}10 - 0{,}0296\log 10 = 1{,}0704\ \text{V}
      $$

      **Lo que hay que llevarse.** Tres cosas:

      1. **Un electrodo solo ve sus especies.** El $Q$ de una semirreacción no
         lleva nada del otro lado de la pila, y el metal sólido vale 1.
      2. **Diluir el ion baja el potencial de reducción**, siempre, y en los
         dos electrodos por igual. Lo que decide cuánto cambia la pila no es
         que bajen, sino **cuánto se diferencian** las dos bajadas.
      3. **Los dos caminos tienen que dar lo mismo**, y por eso el segundo es
         la mejor comprobación que existe en este tema: cuesta una línea y
         valida los dos electrodos a la vez.

  # ═══════════════════════════════════════════════════════════════════
  # LA COLECCIÓN DEL TEMA, ENTERA
  # ═══════════════════════════════════════════════════════════════════
  #
  #    Entró el 28 de septiembre de 2026 (fase G3 de la auditoría). Hasta ese
  #    día el tema tenía sus cuatro ejemplos y ningún problema del material, y
  #    la ruta del segundo cuatrimestre lo declaraba en su `falta`: las
  #    diapositivas traían catorce ajustes por ion-electrón, cuatro problemas
  #    resueltos y siete propuestos con su solución. La escribió un agente, y
  #    se revisó entera —cada ajuste átomo a átomo, cada número contra el
  #    material— antes de entrar aquí.

  # ── La colección del tema 10, en el orden del material (§04): los dos
  #    ejercicios de ajuste del tema 10.1 —catorce reacciones, en tres
  #    bloques—, los cuatro problemas resueltos del tema 10.2 y los siete
  #    problemas propuestos. El ajuste no trae solución; los resueltos traen
  #    la suya y los propuestos, la respuesta final. Cada ajuste está
  #    comprobado átomo a átomo y cada semirreacción, también en carga.
  - id: colfq10-ajuste-1-el-acido-que-oxida-y-acompana
    titulo: Cinco ajustes por el ion-electrón, y el ácido que hace dos papeles
    fuente: >-
      Ejercicio 1, apartados a) a e) · Ejercicios del tema 10.1, Redox (ajuste
      por el método del ion-electrón) · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no
      publica la solución: los ajustes, los distractores y el diagnóstico son
      nuestros.
    nivel: practica
    enunciado: |
      Ajusta las siguientes reacciones redox utilizando el método del
      ión-electrón:

      **a)** $\mathrm{Cu} + \mathrm{HNO_3} \rightarrow \mathrm{NO} + \mathrm{Cu(NO_3)_2} + \mathrm{H_2O}$

      **b)** $\mathrm{H_2SO_4} + \mathrm{NaI} \rightarrow \mathrm{H_2S} + \mathrm{H_2O} + \mathrm{I_2} + \mathrm{Na_2SO_4}$

      **c)** $\mathrm{I_2} + \mathrm{KOH} \rightarrow \mathrm{KIO_3} + \mathrm{H_2O} + \mathrm{KI}$

      **d)** $\mathrm{CoCl_2} + \mathrm{KClO_3} + \mathrm{KOH} \rightarrow \mathrm{Co_2O_3} + \mathrm{KCl} + \mathrm{H_2O}$

      **e)** $\mathrm{KCl} + \mathrm{KMnO_4} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{Cl_2} + \mathrm{H_2O}$
    pide: Los coeficientes de las cinco reacciones, los enteros más pequeños.

    pasos:
      - tipo: reconocer
        pregunta: |
          El primer paso del método es poner números de oxidación. En la
          reacción b), ¿qué elemento se reduce?
        opciones:
          - texto: >-
              El azufre, que pasa de +6 en el H₂SO₄ a −2 en el H₂S
            correcta: true
            mensaje: |
              Eso es: gana ocho electrones por átomo. Y fíjate en que no todo
              el azufre cambia. El que acaba en el Na₂SO₄ sigue en +6, así que
              el sulfúrico hace dos papeles, y eso se paga al volver a la
              ecuación molecular.
          - texto: >-
              El yodo, que pasa de −1 a 0
            mensaje: |
              El yodo cambia, pero sube: de −1 en el NaI a 0 en el I₂. Subir
              el número de oxidación es perder electrones, o sea oxidarse. El
              que se reduce es el que baja.
          - texto: >-
              El hidrógeno, que pasa del ácido al H₂S
            mensaje: |
              El hidrógeno está en +1 en el H₂SO₄, en el H₂S y en el agua: no
              cambia. Aparecer en otra molécula no es cambiar de número de
              oxidación.
          - texto: >-
              El sodio, que pasa del NaI al Na₂SO₄
            mensaje: |
              El sodio vale +1 en los dos sitios, como todo alcalino: es un
              espectador. Acompaña al yoduro al principio y al sulfato al
              final, sin ganar ni perder nada.

      - tipo: calcular
        titulo: La reacción a
        pregunta: |
          **a)** $\mathrm{Cu} + \mathrm{HNO_3} \rightarrow \mathrm{NO} + \mathrm{Cu(NO_3)_2} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden en que están escritos los
          compuestos?
        respuesta:
          tipo: vector
          valor: '(3, 8, 2, 3, 4)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 4, 1, 1, 2)'
            mensaje: |
              No has igualado los electrones. El cobre cede 2 y cada nitrato
              que pasa a NO gana 3: hacen falta 3 Cu por cada 2 NO para que
              sean 6 y 6. Con tu ecuación no cuadra el nitrógeno (4 a la
              izquierda, 3 a la derecha) ni el oxígeno (12 frente a 9).
          - valor: '(3, 4, 1, 3, 2)'
            mensaje: |
              Has multiplicado por 3 la semirreacción del cobre y te has
              olvidado de multiplicar por 2 la del nitrato: 6 electrones
              cedidos contra 3 ganados. Se ve en el nitrógeno, 4 a la
              izquierda y 7 a la derecha.
          - valor: '(3, 2, 2, 3, 4)'
            mensaje: |
              Has puesto a HNO₃ solo los dos nitratos que se reducen a NO. El
              ácido hace además otro papel: seis nitratos más acompañan al
              cobre en el Cu(NO₃)₂ sin cambiar. Lo delata el hidrógeno: la
              ecuación iónica pide 8 H⁺, y cada uno sale de un HNO₃.
          - valor: '(6, 16, 4, 6, 8)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación: $\mathrm{Cu} \rightarrow \mathrm{Cu^{2+}}$. Reducción:
          $\mathrm{NO_3^-} \rightarrow \mathrm{NO}$.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{Cu} &\rightarrow \mathrm{Cu^{2+}} + 2\,\mathrm{e^-} && \times 3 \\
          \mathrm{NO_3^-} + 4\,\mathrm{H^+} + 3\,\mathrm{e^-} &\rightarrow \mathrm{NO} + 2\,\mathrm{H_2O} && \times 2
          \end{aligned}
          $$

          Seis electrones cedidos y seis ganados. Al sumar:

          $$
          3\,\mathrm{Cu} + 2\,\mathrm{NO_3^-} + 8\,\mathrm{H^+} \rightarrow 3\,\mathrm{Cu^{2+}} + 2\,\mathrm{NO} + 4\,\mathrm{H_2O}
          $$

          Los 8 H⁺ salen de 8 HNO₃: dos nitratos se reducen y los otros seis
          acompañan al cobre.

          $$
          3\,\mathrm{Cu} + 8\,\mathrm{HNO_3} \rightarrow 2\,\mathrm{NO} + 3\,\mathrm{Cu(NO_3)_2} + 4\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: La reacción b
        pregunta: |
          **b)** $\mathrm{H_2SO_4} + \mathrm{NaI} \rightarrow \mathrm{H_2S} + \mathrm{H_2O} + \mathrm{I_2} + \mathrm{Na_2SO_4}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(5, 8, 1, 4, 4, 4)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(4, 6, 1, 4, 3, 3)'
            mensaje: |
              Al ajustar el hidrógeno de la semirreacción del sulfato te has
              dejado los dos H del H₂S: a la derecha hay 2 + 8 = 10, así que
              hacen falta 10 H⁺, y con ellos la carga pide 8 electrones y no
              6. Tu ecuación lo delata en el hidrógeno: 8 a la izquierda y 10
              a la derecha.
          - valor: '(1, 8, 1, 4, 4, 4)'
            mensaje: |
              Has puesto a H₂SO₄ el coeficiente del único sulfato que se
              reduce. Los otros cuatro acaban en el Na₂SO₄ sin cambiar, y
              también hay que traerlos: 1 + 4 = 5. Cuenta el azufre: con tu
              ecuación, 1 a la izquierda y 5 a la derecha.
          - valor: '(5, 2, 1, 4, 1, 1)'
            mensaje: |
              No has igualado los electrones. Cada I₂ supone 2 electrones y
              cada H₂S, 8: hacen falta cuatro I₂ por cada H₂S. Sin eso no
              cuadra el azufre (5 frente a 2) ni el oxígeno (20 frente a 8).
          - valor: '(10, 16, 2, 8, 8, 8)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños. Sale de
              multiplicar en cruz —la del yoduro por 8 y la del sulfato por
              2—, que iguala 16 electrones cuando bastaban 8.
        pista: |
          Oxidación: $\mathrm{I^-} \rightarrow \mathrm{I_2}$. Reducción:
          $\mathrm{SO_4^{2-}} \rightarrow \mathrm{H_2S}$.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{I^-} &\rightarrow \mathrm{I_2} + 2\,\mathrm{e^-} && \times 4 \\
          \mathrm{SO_4^{2-}} + 10\,\mathrm{H^+} + 8\,\mathrm{e^-} &\rightarrow \mathrm{H_2S} + 4\,\mathrm{H_2O} && \times 1
          \end{aligned}
          $$

          El azufre baja de +6 a −2: ocho electrones. Al sumar:

          $$
          8\,\mathrm{I^-} + \mathrm{SO_4^{2-}} + 10\,\mathrm{H^+} \rightarrow 4\,\mathrm{I_2} + \mathrm{H_2S} + 4\,\mathrm{H_2O}
          $$

          Los 10 H⁺ son 5 H₂SO₄: un sulfato se reduce y cuatro acompañan a
          los ocho Na⁺ en el Na₂SO₄.

          $$
          5\,\mathrm{H_2SO_4} + 8\,\mathrm{NaI} \rightarrow \mathrm{H_2S} + 4\,\mathrm{H_2O} + 4\,\mathrm{I_2} + 4\,\mathrm{Na_2SO_4}
          $$

      - tipo: reconocer
        pregunta: |
          Las reacciones c) y d) llevan KOH: el medio es básico. ¿Qué cambia
          al ajustarlas?
        opciones:
          - texto: >-
              Que al final no puede quedar ningún H⁺: se neutralizan con OH⁻ y
              salen como agua
            correcta: true
            mensaje: |
              Eso es. La forma más cómoda: ajusta como en medio ácido y, al
              final, suma a los dos lados tantos OH⁻ como H⁺ tengas. Cada
              H⁺ con su OH⁻ es una molécula de agua, y el agua que aparece a
              los dos lados se tacha.
          - texto: >-
              Nada: se ajusta con H⁺ y H₂O exactamente igual que en medio
              ácido
            mensaje: |
              Los pasos son los mismos, pero el resultado no se puede quedar
              con H⁺: en una disolución de KOH no los hay. Y la ecuación
              molecular no tiene ningún ácido del que sacarlos.
          - texto: >-
              Que el KOH es un espectador y no entra en las semirreacciones
            mensaje: |
              El K⁺ sí es espectador; el OH⁻ no. Es el que aporta el oxígeno
              en medio básico y se consume, por eso el KOH lleva coeficiente
              en la ecuación ajustada.
          - texto: >-
              Que el oxígeno que falta se pone como un OH⁻ por cada átomo de O
            mensaje: |
              Un OH⁻ trae también un hidrógeno, y ese hidrógeno hay que
              cuadrarlo. Por cada oxígeno que falta en un lado se ponen dos
              OH⁻ en ese lado y una molécula de agua en el otro, que es lo
              mismo que sale de neutralizar los H⁺ del ajuste ácido.

      - tipo: calcular
        titulo: La reacción c
        pregunta: |
          **c)** $\mathrm{I_2} + \mathrm{KOH} \rightarrow \mathrm{KIO_3} + \mathrm{H_2O} + \mathrm{KI}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(3, 6, 1, 3, 5)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(6, 12, 2, 6, 10)'
            mensaje: |
              La proporción es la buena y la ecuación está ajustada, pero
              todos los coeficientes son pares: al sumar las semirreacciones
              salen 6 I₂ y 12 OH⁻, y hay que dividir entre 2. Se piden los
              enteros más pequeños.
          - valor: '(1, 6, 1, 3, 1)'
            mensaje: |
              No has igualado los electrones. El yodo que pasa a yodato cede
              5 por átomo (10 por I₂) y el que pasa a yoduro gana 1 por átomo
              (2 por I₂): por cada IO₃⁻ tienen que salir cinco I⁻. Con tu
              ecuación no cuadra el potasio, 6 a la izquierda y 2 a la
              derecha.
          - valor: '(3, 6, 5, 3, 1)'
            mensaje: |
              Tienes el 5 y el 1 cambiados de sitio. El que sale cinco veces
              es el yoduro, KI, porque cada yodo que se reduce gana solo un
              electrón y cada uno que se oxida a yodato cede cinco. Con tu
              ecuación el oxígeno no cuadra: 6 a la izquierda y 18 a la
              derecha.
        pista: |
          Es una dismutación: el mismo I₂ se oxida y se reduce. Oxidación:
          $\mathrm{I_2} \rightarrow \mathrm{IO_3^-}$. Reducción:
          $\mathrm{I_2} \rightarrow \mathrm{I^-}$.
        desarrollo: |
          En medio básico, el oxígeno lo ponen los OH⁻:

          $$
          \begin{aligned}
          \mathrm{I_2} + 12\,\mathrm{OH^-} &\rightarrow 2\,\mathrm{IO_3^-} + 6\,\mathrm{H_2O} + 10\,\mathrm{e^-} && \times 1 \\
          \mathrm{I_2} + 2\,\mathrm{e^-} &\rightarrow 2\,\mathrm{I^-} && \times 5
          \end{aligned}
          $$

          Al sumar salen seis I₂ y todos los coeficientes pares, así que se
          divide entre 2:

          $$
          3\,\mathrm{I_2} + 6\,\mathrm{OH^-} \rightarrow \mathrm{IO_3^-} + 5\,\mathrm{I^-} + 3\,\mathrm{H_2O}
          $$

          Los seis K⁺ del KOH acaban uno en el KIO₃ y cinco en el KI:

          $$
          3\,\mathrm{I_2} + 6\,\mathrm{KOH} \rightarrow \mathrm{KIO_3} + 3\,\mathrm{H_2O} + 5\,\mathrm{KI}
          $$

      - tipo: calcular
        titulo: La reacción d
        pregunta: |
          **d)** $\mathrm{CoCl_2} + \mathrm{KClO_3} + \mathrm{KOH} \rightarrow \mathrm{Co_2O_3} + \mathrm{KCl} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(6, 1, 12, 3, 13, 6)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(6, 1, 12, 3, 1, 6)'
            mensaje: |
              Has puesto a KCl solo el cloruro que sale del clorato. Los doce
              Cl⁻ de los seis CoCl₂ no cambian de número de oxidación, pero
              siguen ahí, y los trece K⁺ —uno del KClO₃ y doce del KOH—
              también: acaban en 13 KCl. Cuenta el potasio: 13 a la izquierda
              y 1 a la derecha.
          - valor: '(12, 2, 24, 6, 26, 12)'
            mensaje: |
              Está ajustada, pero todo es el doble de lo necesario. Has
              multiplicado en cruz —la del cobalto por 6 y la del clorato por
              2—, y el mínimo común múltiplo de 2 y 6 es 6, no 12: la del
              cobalto va por 3 y la del clorato por 1. Divide entre 2.
        pista: |
          Oxidación: $\mathrm{Co^{2+}} \rightarrow \mathrm{Co_2O_3}$.
          Reducción: $\mathrm{ClO_3^-} \rightarrow \mathrm{Cl^-}$. Medio
          básico.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{Co^{2+}} + 6\,\mathrm{OH^-} &\rightarrow \mathrm{Co_2O_3} + 3\,\mathrm{H_2O} + 2\,\mathrm{e^-} && \times 3 \\
          \mathrm{ClO_3^-} + 3\,\mathrm{H_2O} + 6\,\mathrm{e^-} &\rightarrow \mathrm{Cl^-} + 6\,\mathrm{OH^-} && \times 1
          \end{aligned}
          $$

          Al sumar se tachan 6 OH⁻ y 3 H₂O de cada lado:

          $$
          6\,\mathrm{Co^{2+}} + 12\,\mathrm{OH^-} + \mathrm{ClO_3^-} \rightarrow 3\,\mathrm{Co_2O_3} + \mathrm{Cl^-} + 6\,\mathrm{H_2O}
          $$

          Los espectadores: los doce Cl⁻ del cloruro de cobalto y los trece
          K⁺ —uno del clorato y doce del KOH— se juntan en 13 KCl.

          $$
          6\,\mathrm{CoCl_2} + \mathrm{KClO_3} + 12\,\mathrm{KOH} \rightarrow 3\,\mathrm{Co_2O_3} + 13\,\mathrm{KCl} + 6\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: La reacción e
        pregunta: |
          **e)** $\mathrm{KCl} + \mathrm{KMnO_4} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{Cl_2} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(10, 2, 8, 2, 6, 5, 8)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(10, 2, 16, 2, 6, 5, 8)'
            mensaje: |
              Has puesto un H₂SO₄ por cada H⁺, y cada molécula de sulfúrico
              aporta dos: 16 H⁺ son 8 H₂SO₄. Con tu ecuación sobran azufre
              (16 frente a 8) e hidrógeno (32 frente a 16).
          - valor: '(5, 1, 4, 1, 3, 5, 4)'
            mensaje: |
              Te has saltado el ajuste de átomos en la oxidación: escribir
              Cl⁻ → Cl₂ + e⁻ deja un cloro a la izquierda y dos a la derecha.
              Ajustada es 2 Cl⁻ → Cl₂ + 2 e⁻, y con ella hacen falta 5 Cl₂ por
              cada 2 MnO₄⁻. En tu ecuación todo cuadra menos el cloro: 5 a la
              izquierda y 10 a la derecha.
          - valor: '(10, 2, 8, 2, 1, 5, 8)'
            mensaje: |
              El K₂SO₄ recoge todo el potasio, y te has olvidado del que trae
              el KCl. Son 10 + 2 = 12 K⁺, es decir 6 K₂SO₄, no 1. Cuenta el
              potasio: 12 a la izquierda y 2 a la derecha.
          - valor: '(20, 4, 16, 4, 12, 10, 16)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación: $\mathrm{Cl^-} \rightarrow \mathrm{Cl_2}$. Reducción:
          $\mathrm{MnO_4^-} \rightarrow \mathrm{Mn^{2+}}$.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{Cl^-} &\rightarrow \mathrm{Cl_2} + 2\,\mathrm{e^-} && \times 5 \\
          \mathrm{MnO_4^-} + 8\,\mathrm{H^+} + 5\,\mathrm{e^-} &\rightarrow \mathrm{Mn^{2+}} + 4\,\mathrm{H_2O} && \times 2
          \end{aligned}
          $$

          $$
          10\,\mathrm{Cl^-} + 2\,\mathrm{MnO_4^-} + 16\,\mathrm{H^+} \rightarrow 5\,\mathrm{Cl_2} + 2\,\mathrm{Mn^{2+}} + 8\,\mathrm{H_2O}
          $$

          Los 16 H⁺ son 8 H₂SO₄. De los ocho sulfatos, dos van con el Mn²⁺ y
          seis con los doce K⁺ —diez del KCl y dos del KMnO₄—:

          $$
          10\,\mathrm{KCl} + 2\,\mathrm{KMnO_4} + 8\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 5\,\mathrm{Cl_2} + 8\,\mathrm{H_2O}
          $$

      - tipo: justificar
        pregunta: Ordena el método tal como lo aplica la reacción a). Una pieza es falsa.
        piezas:
          - texto: >-
              Números de oxidación: el cobre sube de 0 a +2 y el nitrógeno del
              nitrato baja de +5 a +2 en el NO.
          - texto: >-
              Forma iónica: se disocian el ácido y la sal, y quedan Cu, NO₃⁻,
              H⁺, NO, Cu²⁺ y H₂O.
          - texto: >-
              Cada semirreacción se ajusta en átomos: el oxígeno con agua y el
              hidrógeno con H⁺.
          - texto: >-
              La carga se ajusta con electrones, y la del cobre se multiplica
              por 3 y la del nitrato por 2: seis electrones cedidos y seis
              ganados.
          - texto: >-
              Se suman y se vuelve a la ecuación molecular con los
              espectadores: los seis nitratos que acompañan al Cu²⁺.
          - texto: >-
              Cada semirreacción se multiplica por su propio número de
              electrones: la del cobre por 2 y la del nitrato por 3.
            trampa: true
            mensaje: |
              Al revés. Así saldrían 2 × 2 = 4 electrones cedidos frente a
              3 × 3 = 9 ganados. Se multiplica cada una por los electrones de
              la otra —o por lo justo para llegar al mínimo común múltiplo—, y
              en a) eso es la del cobre por 3 y la del nitrato por 2.
        veredicto: |
          Números de oxidación, forma iónica, átomos, electrones, suma y
          espectadores. El último paso es el que más se olvida: la ecuación
          iónica ajustada todavía no es la respuesta.

    resolucion: |
      **La idea.** El método del ion-electrón no ajusta la ecuación entera de
      golpe: la parte en dos semirreacciones, ajusta cada una en átomos y en
      carga, las multiplica hasta que los electrones cedidos sean los
      ganados, y solo al final vuelve a la ecuación molecular. Ese último
      paso es donde más puntos se pierden, porque hay especies que no
      cambian y siguen contando.

      Los cinco ajustes:

      $$
      \begin{aligned}
      \text{a)}\;& 3\,\mathrm{Cu} + 8\,\mathrm{HNO_3} \rightarrow 2\,\mathrm{NO} + 3\,\mathrm{Cu(NO_3)_2} + 4\,\mathrm{H_2O} \\
      \text{b)}\;& 5\,\mathrm{H_2SO_4} + 8\,\mathrm{NaI} \rightarrow \mathrm{H_2S} + 4\,\mathrm{H_2O} + 4\,\mathrm{I_2} + 4\,\mathrm{Na_2SO_4} \\
      \text{c)}\;& 3\,\mathrm{I_2} + 6\,\mathrm{KOH} \rightarrow \mathrm{KIO_3} + 3\,\mathrm{H_2O} + 5\,\mathrm{KI} \\
      \text{d)}\;& 6\,\mathrm{CoCl_2} + \mathrm{KClO_3} + 12\,\mathrm{KOH} \rightarrow 3\,\mathrm{Co_2O_3} + 13\,\mathrm{KCl} + 6\,\mathrm{H_2O} \\
      \text{e)}\;& 10\,\mathrm{KCl} + 2\,\mathrm{KMnO_4} + 8\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 5\,\mathrm{Cl_2} + 8\,\mathrm{H_2O}
      \end{aligned}
      $$

      **Lo que se repite en las cinco**, y conviene tener a mano:

      - **El ácido hace dos papeles.** En a) solo 2 de los 8 HNO₃ se
        reducen; los otros 6 acompañan al Cu²⁺. En b) y en e) pasa lo mismo
        con el sulfúrico. El coeficiente del ácido sale de los H⁺, no de la
        semirreacción del ion que cambia.
      - **En medio básico no quedan H⁺.** c) y d) se ajustan con OH⁻ y agua:
        por cada oxígeno que falta, dos OH⁻ en ese lado y un agua en el otro.
      - **Se simplifica al final.** La suma de c) sale con todos los
        coeficientes pares, y se piden los enteros más pequeños.
      - **Se comprueba contando.** Cada elemento a los dos lados, también el
        potasio y el sodio, que no hacen nada y son los que más se olvidan.

      El material no publica la solución de estos ejercicios. Los cinco
      ajustes están comprobados átomo a átomo, cada semirreacción también en
      carga, y cada uno es el único posible salvo un factor: no hay dos
      formas distintas de ajustar ninguna de las cinco.

  - id: colfq10-ajuste-2-el-oxalato-y-el-cloro-que-va-y-viene
    titulo: Otras cinco, con un oxalato, un tiosulfato y un cloro que va y viene
    fuente: >-
      Ejercicio 2, apartados f) a j) · Ejercicios del tema 10.1, Redox (ajuste
      por el método del ion-electrón) · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no
      publica la solución: los ajustes, los distractores y el diagnóstico son
      nuestros.
    nivel: practica
    enunciado: |
      Ajusta las siguientes reacciones redox utilizando el método del
      ión-electrón:

      **f)** $\mathrm{KMnO_4} + \mathrm{K_2C_2O_4} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{CO_2} + \mathrm{H_2O}$

      **g)** $\mathrm{HCl} + \mathrm{MnO_2} \rightarrow \mathrm{MnCl_2} + \mathrm{Cl_2} + \mathrm{H_2O}$

      **h)** $\mathrm{Cu} + \mathrm{H_2SO_4} \rightarrow \mathrm{CuSO_4} + \mathrm{H_2O} + \mathrm{SO_2}$

      **i)** $\mathrm{I_2} + \mathrm{Na_2S_2O_3} \rightarrow \mathrm{Na_2S_4O_6} + \mathrm{NaI}$

      **j)** $\mathrm{Ca(ClO)_2} + \mathrm{HCl} \rightarrow \mathrm{CaCl_2} + \mathrm{H_2O} + \mathrm{Cl_2}$
    pide: Los coeficientes de las cinco reacciones, los enteros más pequeños.

    pasos:
      - tipo: reconocer
        pregunta: |
          En f) el oxalato, $\mathrm{C_2O_4^{2-}}$, pasa a CO₂. ¿Cuántos
          electrones cede cada ion oxalato?
        opciones:
          - texto: >-
              Dos, porque cada carbono pasa de +3 a +4 y el oxalato lleva dos
            correcta: true
            mensaje: |
              Eso es. En el oxalato, $2x + 4\cdot(-2) = -2$ da $x = +3$; en el
              CO₂ el carbono está en +4. Un electrón por carbono y dos
              carbonos: $\mathrm{C_2O_4^{2-}} \rightarrow 2\,\mathrm{CO_2} + 2\,\mathrm{e^-}$.
          - texto: >-
              Uno, porque el carbono sube una sola unidad
            mensaje: |
              Uno por cada carbono, sí, pero el ion lleva dos. Si escribes un
              solo electrón, la semirreacción no cuadra en carga: −2 a la
              izquierda y −1 a la derecha.
          - texto: >-
              Cuatro, porque el carbono acaba en +4
            mensaje: |
              +4 es dónde acaba, no cuánto cambia. Los electrones cuentan la
              diferencia entre el número de oxidación inicial y el final, y el
              carbono ya empezaba en +3.
          - texto: >-
              Ninguno, porque el oxalato no cambia de carga al pasar a CO₂
            mensaje: |
              La carga del ion no es el número de oxidación del carbono. El
              oxalato tiene carga −2 y el CO₂ es neutro, pero lo que decide es
              el carbono, que pasa de +3 a +4: se oxida.

      - tipo: calcular
        titulo: La reacción f
        pregunta: |
          **f)** $\mathrm{KMnO_4} + \mathrm{K_2C_2O_4} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{CO_2} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(2, 5, 8, 2, 6, 10, 8)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(2, 5, 8, 2, 6, 5, 8)'
            mensaje: |
              Cada oxalato lleva dos carbonos, así que da dos CO₂, no uno:
              C₂O₄²⁻ → 2 CO₂ + 2 e⁻. Con tu ecuación no cuadra el carbono (10
              a la izquierda, 5 a la derecha) ni el oxígeno (60 frente a 50).
          - valor: '(2, 5, 8, 2, 1, 10, 8)'
            mensaje: |
              El K₂SO₄ recoge todo el potasio y te has dejado el del oxalato:
              2 del KMnO₄ y 10 de los cinco K₂C₂O₄ son 12 K⁺, o sea 6 K₂SO₄.
              Cuenta el potasio: 12 a la izquierda y 2 a la derecha.
          - valor: '(2, 5, 16, 2, 6, 10, 8)'
            mensaje: |
              Un H₂SO₄ por cada H⁺ es el doble de lo que hace falta: cada
              molécula aporta dos. Los 16 H⁺ de la ecuación iónica son 8
              H₂SO₄. Con tu ecuación sobran azufre (16 frente a 8) e
              hidrógeno (32 frente a 16).
          - valor: '(4, 10, 16, 4, 12, 20, 16)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación: $\mathrm{C_2O_4^{2-}} \rightarrow \mathrm{CO_2}$.
          Reducción: $\mathrm{MnO_4^-} \rightarrow \mathrm{Mn^{2+}}$.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{C_2O_4^{2-}} &\rightarrow 2\,\mathrm{CO_2} + 2\,\mathrm{e^-} && \times 5 \\
          \mathrm{MnO_4^-} + 8\,\mathrm{H^+} + 5\,\mathrm{e^-} &\rightarrow \mathrm{Mn^{2+}} + 4\,\mathrm{H_2O} && \times 2
          \end{aligned}
          $$

          $$
          2\,\mathrm{MnO_4^-} + 5\,\mathrm{C_2O_4^{2-}} + 16\,\mathrm{H^+} \rightarrow 2\,\mathrm{Mn^{2+}} + 10\,\mathrm{CO_2} + 8\,\mathrm{H_2O}
          $$

          Los 16 H⁺ son 8 H₂SO₄: dos sulfatos van con el Mn²⁺ y seis con los
          doce K⁺, dos del permanganato y diez del oxalato.

          $$
          2\,\mathrm{KMnO_4} + 5\,\mathrm{K_2C_2O_4} + 8\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 10\,\mathrm{CO_2} + 8\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: La reacción g
        pregunta: |
          **g)** $\mathrm{HCl} + \mathrm{MnO_2} \rightarrow \mathrm{MnCl_2} + \mathrm{Cl_2} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(4, 1, 1, 1, 2)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(2, 1, 1, 1, 2)'
            mensaje: |
              Has puesto solo los dos HCl cuyo cloruro se oxida a Cl₂. Otros
              dos se quedan como Cl⁻ en el MnCl₂ sin cambiar: el ácido hace
              dos papeles, y son 2 + 2 = 4. Lo delata el hidrógeno: la
              semirreacción del MnO₂ pide 4 H⁺.
          - valor: '(8, 2, 2, 2, 4)'
            mensaje: |
              Está ajustada, pero todo es el doble. Los electrones ya estaban
              igualados —2 cede el cloruro y 2 gana el MnO₂—, así que no hacía
              falta multiplicar ninguna semirreacción. Divide entre 2.
          - valor: '(4, 1, 1, 1, 4)'
            mensaje: |
              Has puesto un agua por cada H⁺. Los 4 H⁺ se juntan con los 2
              oxígenos del MnO₂ en 2 moléculas de agua, porque cada H₂O lleva
              dos hidrógenos. Cuenta el oxígeno: 2 a la izquierda y 4 a la
              derecha.
        pista: |
          Oxidación: $\mathrm{Cl^-} \rightarrow \mathrm{Cl_2}$. Reducción:
          $\mathrm{MnO_2} \rightarrow \mathrm{Mn^{2+}}$.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{Cl^-} &\rightarrow \mathrm{Cl_2} + 2\,\mathrm{e^-} && \times 1 \\
          \mathrm{MnO_2} + 4\,\mathrm{H^+} + 2\,\mathrm{e^-} &\rightarrow \mathrm{Mn^{2+}} + 2\,\mathrm{H_2O} && \times 1
          \end{aligned}
          $$

          Los electrones ya están igualados. Al sumar:

          $$
          \mathrm{MnO_2} + 4\,\mathrm{H^+} + 2\,\mathrm{Cl^-} \rightarrow \mathrm{Mn^{2+}} + \mathrm{Cl_2} + 2\,\mathrm{H_2O}
          $$

          Los 4 H⁺ son 4 HCl: dos cloruros se oxidan y los otros dos
          acompañan al Mn²⁺ en el MnCl₂.

          $$
          4\,\mathrm{HCl} + \mathrm{MnO_2} \rightarrow \mathrm{MnCl_2} + \mathrm{Cl_2} + 2\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: La reacción h
        pregunta: |
          **h)** $\mathrm{Cu} + \mathrm{H_2SO_4} \rightarrow \mathrm{CuSO_4} + \mathrm{H_2O} + \mathrm{SO_2}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(1, 2, 1, 2, 1)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 1, 1, 2, 1)'
            mensaje: |
              Has puesto a H₂SO₄ solo el sulfato que se reduce a SO₂. Hay otro
              que acompaña al Cu²⁺ en el CuSO₄ sin cambiar, así que son dos. Lo
              delata el hidrógeno: la semirreacción pide 4 H⁺, que son 2
              H₂SO₄.
          - valor: '(1, 4, 1, 2, 1)'
            mensaje: |
              Un H₂SO₄ por cada H⁺ es el doble: cada molécula aporta dos
              protones, y 4 H⁺ son 2 H₂SO₄. Con tu ecuación el azufre no
              cuadra: 4 a la izquierda y 2 a la derecha.
          - valor: '(2, 4, 2, 4, 2)'
            mensaje: |
              Está ajustada, pero todo es el doble. El cobre cede 2
              electrones y el sulfato gana 2: ya estaban igualados sin
              multiplicar nada. Divide entre 2.
        pista: |
          Oxidación: $\mathrm{Cu} \rightarrow \mathrm{Cu^{2+}}$. Reducción:
          $\mathrm{SO_4^{2-}} \rightarrow \mathrm{SO_2}$.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{Cu} &\rightarrow \mathrm{Cu^{2+}} + 2\,\mathrm{e^-} && \times 1 \\
          \mathrm{SO_4^{2-}} + 4\,\mathrm{H^+} + 2\,\mathrm{e^-} &\rightarrow \mathrm{SO_2} + 2\,\mathrm{H_2O} && \times 1
          \end{aligned}
          $$

          $$
          \mathrm{Cu} + \mathrm{SO_4^{2-}} + 4\,\mathrm{H^+} \rightarrow \mathrm{Cu^{2+}} + \mathrm{SO_2} + 2\,\mathrm{H_2O}
          $$

          Los 4 H⁺ son 2 H₂SO₄: un sulfato se reduce y el otro acompaña al
          Cu²⁺.

          $$
          \mathrm{Cu} + 2\,\mathrm{H_2SO_4} \rightarrow \mathrm{CuSO_4} + 2\,\mathrm{H_2O} + \mathrm{SO_2}
          $$

      - tipo: calcular
        titulo: La reacción i
        pregunta: |
          **i)** $\mathrm{I_2} + \mathrm{Na_2S_2O_3} \rightarrow \mathrm{Na_2S_4O_6} + \mathrm{NaI}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(1, 2, 1, 2)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 1, 1, 2)'
            mensaje: |
              Un tetrationato lleva cuatro azufres y cada tiosulfato dos:
              hacen falta 2 S₂O₃²⁻ por cada S₄O₆²⁻. Ajustando primero el
              azufre, la semirreacción es 2 S₂O₃²⁻ → S₄O₆²⁻ + 2 e⁻. Con tu
              ecuación no cuadra el azufre (2 frente a 4) ni el sodio (2
              frente a 4).
          - valor: '(1, 2, 1, 1)'
            mensaje: |
              Cada I₂ da dos yoduros: I₂ + 2 e⁻ → 2 I⁻. Con un solo NaI no
              cuadran ni el yodo (2 a la izquierda, 1 a la derecha) ni el
              sodio (4 frente a 3).
          - valor: '(2, 4, 2, 4)'
            mensaje: |
              Está ajustada, pero todo es el doble: las dos semirreacciones
              intercambian 2 electrones y no hacía falta multiplicar ninguna.
              Divide entre 2.
        pista: |
          Oxidación: $\mathrm{S_2O_3^{2-}} \rightarrow \mathrm{S_4O_6^{2-}}$.
          Reducción: $\mathrm{I_2} \rightarrow \mathrm{I^-}$.
        desarrollo: |
          El azufre pasa de +2 en el tiosulfato a +2,5 de media en el
          tetrationato. Con números de oxidación fraccionarios es más limpio
          ajustar primero el azufre y contar los electrones por la carga:
          dos tiosulfatos suman −4 y el tetrationato, −2.

          $$
          \begin{aligned}
          2\,\mathrm{S_2O_3^{2-}} &\rightarrow \mathrm{S_4O_6^{2-}} + 2\,\mathrm{e^-} && \times 1 \\
          \mathrm{I_2} + 2\,\mathrm{e^-} &\rightarrow 2\,\mathrm{I^-} && \times 1
          \end{aligned}
          $$

          $$
          \mathrm{I_2} + 2\,\mathrm{S_2O_3^{2-}} \rightarrow \mathrm{S_4O_6^{2-}} + 2\,\mathrm{I^-}
          $$

          Los cuatro Na⁺ se reparten entre el tetrationato y los dos
          yoduros:

          $$
          \mathrm{I_2} + 2\,\mathrm{Na_2S_2O_3} \rightarrow \mathrm{Na_2S_4O_6} + 2\,\mathrm{NaI}
          $$

      - tipo: reconocer
        pregunta: |
          En j) el cloro aparece en los dos reactivos, y el Cl₂ sale de los
          dos. ¿Qué le pasa al cloro?
        opciones:
          - texto: >-
              El del hipoclorito baja de +1 a 0 y el de parte del HCl sube de
              −1 a 0: los dos acaban en el mismo Cl₂
            correcta: true
            mensaje: |
              Eso es: una comproporción, lo contrario de la dismutación de c).
              El mismo producto sale de una reducción y de una oxidación, así
              que hay que sumar el Cl₂ de las dos semirreacciones.
          - texto: >-
              Solo se oxida el cloruro del HCl; el hipoclorito es un
              espectador
            mensaje: |
              El cloro del ClO⁻ está en +1 y acaba en 0: se reduce. Si fuera
              espectador, nadie recogería los electrones que suelta el
              cloruro, y en una redox siempre hay alguien que los gana.
          - texto: >-
              El cloro del hipoclorito se oxida a Cl₂
            mensaje: |
              Va al revés: de +1 a 0 es bajar, o sea ganar electrones. El que
              se oxida es el cloruro, que sube de −1 a 0.
          - texto: >-
              No es una redox, porque el cloro está en todas las especies
            mensaje: |
              Que un elemento esté en todas partes no dice nada; lo que cuenta
              es si cambia de número de oxidación. Aquí cambian dos cloros en
              sentidos opuestos: es redox, y de las que piden cuidado.

      - tipo: calcular
        titulo: La reacción j
        pregunta: |
          **j)** $\mathrm{Ca(ClO)_2} + \mathrm{HCl} \rightarrow \mathrm{CaCl_2} + \mathrm{H_2O} + \mathrm{Cl_2}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(1, 4, 1, 2, 2)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 4, 1, 2, 1)'
            mensaje: |
              El Cl₂ sale de las dos semirreacciones —del hipoclorito que se
              reduce y del cloruro que se oxida— y hay que sumarlos: 1 + 1 =
              2. Con uno solo, el cloro no cuadra: 6 a la izquierda y 4 a la
              derecha.
          - valor: '(1, 2, 1, 1, 1)'
            mensaje: |
              Cada Ca(ClO)₂ trae dos iones ClO⁻, no uno: la reducción hay que
              escribirla con 2 ClO⁻, y con ella salen 2 Cl₂ y 2 H₂O. Con tu
              ecuación el oxígeno no cuadra: 2 a la izquierda y 1 a la
              derecha.
          - valor: '(1, 2, 1, 2, 2)'
            mensaje: |
              Has puesto solo los dos HCl cuyo cloruro se oxida. Otros dos
              acompañan al Ca²⁺ en el CaCl₂ sin cambiar, así que son cuatro,
              que es también lo que piden los 4 H⁺ de la reducción. Cuenta el
              hidrógeno: 2 a la izquierda y 4 a la derecha.
          - valor: '(2, 8, 2, 4, 4)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños. Sale de
              multiplicar en cruz —cada semirreacción por los 2 electrones de
              la otra—, que iguala 4 electrones cuando bastaban 2.
        pista: |
          Reducción: $\mathrm{ClO^-} \rightarrow \mathrm{Cl_2}$. Oxidación:
          $\mathrm{Cl^-} \rightarrow \mathrm{Cl_2}$. Las dos dan el mismo
          producto.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{ClO^-} + 4\,\mathrm{H^+} + 2\,\mathrm{e^-} &\rightarrow \mathrm{Cl_2} + 2\,\mathrm{H_2O} && \times 1 \\
          2\,\mathrm{Cl^-} &\rightarrow \mathrm{Cl_2} + 2\,\mathrm{e^-} && \times 1
          \end{aligned}
          $$

          La reducción va con 2 ClO⁻ porque así los trae el Ca(ClO)₂. Al
          sumar, el Cl₂ de las dos se junta:

          $$
          2\,\mathrm{ClO^-} + 4\,\mathrm{H^+} + 2\,\mathrm{Cl^-} \rightarrow 2\,\mathrm{Cl_2} + 2\,\mathrm{H_2O}
          $$

          La iónica se podría dividir entre 2, pero la molecular no: el
          hipoclorito viene de dos en dos. Los 4 H⁺ son 4 HCl, de los que dos
          se oxidan y dos acompañan al Ca²⁺.

          $$
          \mathrm{Ca(ClO)_2} + 4\,\mathrm{HCl} \rightarrow \mathrm{CaCl_2} + 2\,\mathrm{H_2O} + 2\,\mathrm{Cl_2}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento sobre el ácido de g). Una pieza es falsa.
        piezas:
          - texto: >-
              En g) solo 2 de los 4 Cl⁻ se oxidan a Cl₂; los otros 2 acompañan
              al Mn²⁺ en el MnCl₂.
          - texto: >-
              Por eso el coeficiente del HCl no sale de la semirreacción del
              cloro, sino de los H⁺ que pide la del MnO₂: 4.
          - texto: >-
              En h) pasa lo mismo con el sulfúrico: un sulfato se reduce a SO₂
              y el otro se queda en el CuSO₄.
          - texto: >-
              Y en j) el HCl vuelve a hacer los dos papeles, oxidarse y
              acompañar al Ca²⁺.
          - texto: >-
              La comprobación final es contar cada elemento a los dos lados,
              espectadores incluidos.
          - texto: >-
              El coeficiente del ácido en la ecuación molecular es siempre el
              del ion que se oxida o se reduce en su semirreacción.
            trampa: true
            mensaje: |
              Solo cuando el ácido no aporta además el anión de una sal. En g)
              la semirreacción del cloro pide 2 Cl⁻ y el HCl lleva 4: los
              otros dos acaban en el MnCl₂. Con 2 HCl no cuadran ni el
              hidrógeno ni el cloro.
        veredicto: |
          El ácido que oxida suele hacer también de ácido a secas. Se cuenta
          por los H⁺ y se comprueba por los espectadores.

    resolucion: |
      **Los cinco ajustes:**

      $$
      \begin{aligned}
      \text{f)}\;& 2\,\mathrm{KMnO_4} + 5\,\mathrm{K_2C_2O_4} + 8\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 10\,\mathrm{CO_2} + 8\,\mathrm{H_2O} \\
      \text{g)}\;& 4\,\mathrm{HCl} + \mathrm{MnO_2} \rightarrow \mathrm{MnCl_2} + \mathrm{Cl_2} + 2\,\mathrm{H_2O} \\
      \text{h)}\;& \mathrm{Cu} + 2\,\mathrm{H_2SO_4} \rightarrow \mathrm{CuSO_4} + 2\,\mathrm{H_2O} + \mathrm{SO_2} \\
      \text{i)}\;& \mathrm{I_2} + 2\,\mathrm{Na_2S_2O_3} \rightarrow \mathrm{Na_2S_4O_6} + 2\,\mathrm{NaI} \\
      \text{j)}\;& \mathrm{Ca(ClO)_2} + 4\,\mathrm{HCl} \rightarrow \mathrm{CaCl_2} + 2\,\mathrm{H_2O} + 2\,\mathrm{Cl_2}
      \end{aligned}
      $$

      **Tres cosas que este bloque añade al anterior:**

      - **Los electrones salen de cuánto cambia el número de oxidación, por
        átomo y por el número de átomos.** El oxalato de f) cede dos porque
        lleva dos carbonos; el tiosulfato de i) se ajusta mejor por la carga,
        porque su azufre pasa a +2,5 de media.
      - **El ácido vuelve a hacer dos papeles** en g), en h) y en j): una
        parte cambia y otra acompaña al catión de la sal.
      - **Un mismo producto puede salir de las dos semirreacciones.** En j)
        el Cl₂ viene del hipoclorito que se reduce y del cloruro que se
        oxida: es una comproporción, y los dos Cl₂ se suman.

      Y g), h) e i) intercambian 2 electrones por cada lado sin multiplicar
      nada: multiplicar en cruz ahí da el doble, y hay que simplificar.

      El material no publica la solución. Los cinco ajustes están
      comprobados átomo a átomo y en carga, y ninguno admite otro ajuste que
      no sea un múltiplo de este.

  - id: colfq10-ajuste-3-el-que-se-oxida-por-dos-sitios
    titulo: Las cuatro últimas, con un compuesto que se oxida por dos sitios
    fuente: >-
      Ejercicio 2, apartados k) a n) · Ejercicios del tema 10.1, Redox (ajuste
      por el método del ion-electrón) · Fundamentos Químicos de la Ingeniería
      (25975), Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El material no
      publica la solución: los ajustes, los distractores y el diagnóstico son
      nuestros.
    nivel: practica
    enunciado: |
      Ajusta las siguientes reacciones redox utilizando el método del
      ión-electrón:

      **k)** $\mathrm{CuSO_4} + \mathrm{KI} \rightarrow \mathrm{K_2SO_4} + \mathrm{Cu_2I_2} + \mathrm{I_2}$

      **l)** $\mathrm{FeSO_4} + \mathrm{H_2SO_4} + \mathrm{KMnO_4} \rightarrow \mathrm{Fe_2(SO_4)_3} + \mathrm{K_2SO_4} + \mathrm{MnSO_4} + \mathrm{H_2O}$

      **m)** $\mathrm{KMnO_4} + \mathrm{K_2SO_3} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{H_2O}$

      **n)** $\mathrm{CrI_3} + \mathrm{Cl_2} + \mathrm{NaOH} \rightarrow \mathrm{NaIO_4} + \mathrm{Na_2CrO_4} + \mathrm{NaCl} + \mathrm{H_2O}$
    pide: Los coeficientes de las cuatro reacciones, los enteros más pequeños.

    pasos:
      - tipo: reconocer
        pregunta: |
          En k) el yodo acaba en dos productos, Cu₂I₂ e I₂. ¿Cuál sale de la
          oxidación?
        opciones:
          - texto: >-
              El I₂, porque ahí el yodo pasa de −1 a 0; en el Cu₂I₂ sigue en −1
            correcta: true
            mensaje: |
              Eso es. El Cu₂I₂ es yoduro de cobre(I): el cobre baja de +2 a
              +1 y el yoduro que lo acompaña no cambia. Por eso el KI hace dos
              papeles, como el ácido de las reacciones anteriores.
          - texto: >-
              Los dos, porque en los dos hay yodo que ha cambiado de compuesto
            mensaje: |
              Cambiar de compuesto no es cambiar de número de oxidación. En el
              Cu₂I₂ el yodo sigue en −1, igual que en el KI.
          - texto: >-
              El Cu₂I₂, porque lleva el cobre, que es el que cambia
            mensaje: |
              El cobre cambia, sí, pero se reduce: baja de +2 a +1. El Cu₂I₂
              es el producto de la reducción, no el de la oxidación.
          - texto: >-
              Ninguno, porque el que se oxida es el cobre
            mensaje: |
              El cobre pasa de +2 en el CuSO₄ a +1 en el Cu₂I₂: gana
              electrones, se reduce. Alguien tiene que cederlos, y es el
              yoduro que acaba en I₂.

      - tipo: calcular
        titulo: La reacción k
        pregunta: |
          **k)** $\mathrm{CuSO_4} + \mathrm{KI} \rightarrow \mathrm{K_2SO_4} + \mathrm{Cu_2I_2} + \mathrm{I_2}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(2, 4, 2, 1, 1)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(2, 2, 1, 1, 1)'
            mensaje: |
              Has contado solo los dos yoduros que se oxidan a I₂. Otros dos
              acaban en el Cu₂I₂ sin cambiar, así que son cuatro KI, y con
              ellos cuatro K⁺ que forman 2 K₂SO₄. Con tu ecuación no cuadran el
              yodo (2 frente a 4) ni el azufre (2 frente a 1).
          - valor: '(4, 8, 4, 2, 2)'
            mensaje: |
              Está ajustada, pero todo es el doble: las dos semirreacciones ya
              intercambiaban 2 electrones cada una. Divide entre 2.
          - valor: '(2, 4, 2, 2, 1)'
            mensaje: |
              Has puesto un Cu₂I₂ por cada cobre, y cada Cu₂I₂ lleva dos: dos
              Cu²⁺ dan un solo Cu₂I₂. Con tu ecuación el cobre no cuadra: 2 a
              la izquierda y 4 a la derecha.
        pista: |
          Reducción: $\mathrm{Cu^{2+}} \rightarrow \mathrm{Cu_2I_2}$, con los
          yoduros que se lleva el cobre. Oxidación:
          $\mathrm{I^-} \rightarrow \mathrm{I_2}$.
        desarrollo: |
          $$
          \begin{aligned}
          2\,\mathrm{Cu^{2+}} + 2\,\mathrm{I^-} + 2\,\mathrm{e^-} &\rightarrow \mathrm{Cu_2I_2} && \times 1 \\
          2\,\mathrm{I^-} &\rightarrow \mathrm{I_2} + 2\,\mathrm{e^-} && \times 1
          \end{aligned}
          $$

          $$
          2\,\mathrm{Cu^{2+}} + 4\,\mathrm{I^-} \rightarrow \mathrm{Cu_2I_2} + \mathrm{I_2}
          $$

          Los espectadores: los dos sulfatos y los cuatro K⁺ forman 2 K₂SO₄.

          $$
          2\,\mathrm{CuSO_4} + 4\,\mathrm{KI} \rightarrow 2\,\mathrm{K_2SO_4} + \mathrm{Cu_2I_2} + \mathrm{I_2}
          $$

      - tipo: calcular
        titulo: La reacción l
        pregunta: |
          **l)** $\mathrm{FeSO_4} + \mathrm{H_2SO_4} + \mathrm{KMnO_4} \rightarrow \mathrm{Fe_2(SO_4)_3} + \mathrm{K_2SO_4} + \mathrm{MnSO_4} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(10, 8, 2, 5, 1, 2, 8)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(5, 4, 1, 2.5, 0.5, 1, 4)'
            mensaje: |
              Es la proporción buena, pero con fracciones: el Fe₂(SO₄)₃ lleva
              los hierros de dos en dos, y con 5 Fe²⁺ salen dos sulfatos
              férricos y medio. Multiplica todo por 2 para tener los enteros
              más pequeños.
          - valor: '(5, 4, 1, 5, 1, 1, 4)'
            mensaje: |
              Has puesto un Fe₂(SO₄)₃ por cada Fe³⁺, y cada uno lleva dos
              hierros. Con 5 FeSO₄ solo salen dos y medio; para que salga
              entero hay que partir de 10 Fe²⁺ y duplicar lo demás. Con tu
              ecuación el hierro no cuadra: 5 a la izquierda y 10 a la
              derecha.
          - valor: '(10, 16, 2, 5, 1, 2, 8)'
            mensaje: |
              Un H₂SO₄ por cada H⁺ es el doble: cada molécula aporta dos. Los
              16 H⁺ son 8 H₂SO₄, que con los 10 sulfatos del FeSO₄ dan los 18
              que hay a la derecha. Con tu ecuación el azufre no cuadra: 26
              frente a 18.
          - valor: '(20, 16, 4, 10, 2, 4, 16)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación: $\mathrm{Fe^{2+}} \rightarrow \mathrm{Fe^{3+}}$.
          Reducción: $\mathrm{MnO_4^-} \rightarrow \mathrm{Mn^{2+}}$. Y ojo con
          el Fe₂(SO₄)₃, que lleva dos hierros.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{Fe^{2+}} &\rightarrow \mathrm{Fe^{3+}} + \mathrm{e^-} && \times 5 \\
          \mathrm{MnO_4^-} + 8\,\mathrm{H^+} + 5\,\mathrm{e^-} &\rightarrow \mathrm{Mn^{2+}} + 4\,\mathrm{H_2O} && \times 1
          \end{aligned}
          $$

          Con 5 Fe³⁺ saldrían dos Fe₂(SO₄)₃ y medio, así que se duplica
          todo:

          $$
          10\,\mathrm{Fe^{2+}} + 2\,\mathrm{MnO_4^-} + 16\,\mathrm{H^+} \rightarrow 10\,\mathrm{Fe^{3+}} + 2\,\mathrm{Mn^{2+}} + 8\,\mathrm{H_2O}
          $$

          Los 16 H⁺ son 8 H₂SO₄. A la derecha hay $15 + 1 + 2 = 18$ sulfatos,
          los 10 del FeSO₄ y los 8 del ácido.

          $$
          10\,\mathrm{FeSO_4} + 8\,\mathrm{H_2SO_4} + 2\,\mathrm{KMnO_4} \rightarrow 5\,\mathrm{Fe_2(SO_4)_3} + \mathrm{K_2SO_4} + 2\,\mathrm{MnSO_4} + 8\,\mathrm{H_2O}
          $$

      - tipo: calcular
        titulo: La reacción m
        pregunta: |
          **m)** $\mathrm{KMnO_4} + \mathrm{K_2SO_3} + \mathrm{H_2SO_4} \rightarrow \mathrm{MnSO_4} + \mathrm{K_2SO_4} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(2, 5, 3, 2, 6, 3)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(2, 5, 8, 2, 6, 8)'
            mensaje: |
              Has sumado las semirreacciones sin tachar lo que aparece a los
              dos lados. La oxidación del sulfito produce 10 H⁺ y consume 5
              H₂O; la reducción consume 16 H⁺ y produce 8 H₂O. Netos quedan 6
              H⁺, que son 3 H₂SO₄, y 3 H₂O. Con tu ecuación no cuadran el
              azufre (13 frente a 8) ni el oxígeno (55 frente a 40).
          - valor: '(2, 5, 6, 2, 6, 3)'
            mensaje: |
              Los H⁺ netos están bien, 6, pero cada H₂SO₄ aporta dos: son 3
              H₂SO₄. Con tu ecuación sobran azufre (11 frente a 8) e
              hidrógeno (12 frente a 6).
          - valor: '(2, 5, 3, 2, 5, 3)'
            mensaje: |
              Has contado como K₂SO₄ solo los cinco sulfatos que salen del
              sulfito. El K₂SO₄ recoge todo el potasio: 2 del KMnO₄ y 10 del
              K₂SO₃ son 12 K⁺, o sea 6 K₂SO₄. Cuenta el potasio: 12 a la
              izquierda y 10 a la derecha.
          - valor: '(4, 10, 6, 4, 12, 6)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación: $\mathrm{SO_3^{2-}} \rightarrow \mathrm{SO_4^{2-}}$.
          Reducción: $\mathrm{MnO_4^-} \rightarrow \mathrm{Mn^{2+}}$. Al sumar,
          los H⁺ y el agua aparecen a los dos lados.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{SO_3^{2-}} + \mathrm{H_2O} &\rightarrow \mathrm{SO_4^{2-}} + 2\,\mathrm{H^+} + 2\,\mathrm{e^-} && \times 5 \\
          \mathrm{MnO_4^-} + 8\,\mathrm{H^+} + 5\,\mathrm{e^-} &\rightarrow \mathrm{Mn^{2+}} + 4\,\mathrm{H_2O} && \times 2
          \end{aligned}
          $$

          Al sumar hay 16 H⁺ a la izquierda y 10 a la derecha, y 5 H₂O a la
          izquierda y 8 a la derecha. Tachando lo que se repite:

          $$
          5\,\mathrm{SO_3^{2-}} + 2\,\mathrm{MnO_4^-} + 6\,\mathrm{H^+} \rightarrow 5\,\mathrm{SO_4^{2-}} + 2\,\mathrm{Mn^{2+}} + 3\,\mathrm{H_2O}
          $$

          Los 6 H⁺ son 3 H₂SO₄, y los 12 K⁺ —2 del permanganato y 10 del
          sulfito— forman 6 K₂SO₄:

          $$
          2\,\mathrm{KMnO_4} + 5\,\mathrm{K_2SO_3} + 3\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 3\,\mathrm{H_2O}
          $$

      - tipo: reconocer
        pregunta: |
          En n) el $\mathrm{CrI_3}$ se oxida por dos sitios. ¿Cuántos
          electrones cede cada $\mathrm{CrI_3}$?
        opciones:
          - texto: >-
              27: el cromo sube de +3 a +6, que son 3, y cada yodo de −1 a +7,
              que son 8 por tres yodos
            correcta: true
            mensaje: |
              Eso es: $3 + 3\cdot 8 = 27$. Los dos cambios vienen del mismo
              compuesto y en proporción fija, un cromo por cada tres yodos,
              así que se escriben en una sola semirreacción con el CrI₃
              entero.
          - texto: >-
              24: los tres yodos, de −1 a +7
            mensaje: |
              Te dejas el cromo, que también se oxida: pasa de +3 en el CrI₃ a
              +6 en el cromato. Son 3 electrones más, 27 en total.
          - texto: >-
              3: el cromo, de +3 a +6
            mensaje: |
              El yodo también cambia, y mucho: de −1 en el CrI₃ a +7 en el
              peryodato, NaIO₄. Ocho electrones por yodo, y hay tres.
          - texto: >-
              11: 3 del cromo y 8 del yodo
            mensaje: |
              Los 8 son por cada yodo, y el CrI₃ lleva tres: $3 + 3\cdot 8 = 27$.

      - tipo: calcular
        titulo: La reacción n
        pregunta: |
          **n)** $\mathrm{CrI_3} + \mathrm{Cl_2} + \mathrm{NaOH} \rightarrow \mathrm{NaIO_4} + \mathrm{Na_2CrO_4} + \mathrm{NaCl} + \mathrm{H_2O}$

          ¿Cuáles son los coeficientes, en el orden de la ecuación?
        respuesta:
          tipo: vector
          valor: '(2, 27, 64, 6, 2, 54, 32)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 12, 32, 3, 1, 24, 16)'
            mensaje: |
              Te has olvidado de que el cromo también se oxida: cada CrI₃ cede
              3 + 24 = 27 electrones, no 24. Con 24 la semirreacción ni
              siquiera cuadra en carga, y en la ecuación final falla el sodio:
              32 a la izquierda y 29 a la derecha.
          - valor: '(2, 27, 64, 6, 2, 54, 16)'
            mensaje: |
              Al multiplicar por 2 la semirreacción del CrI₃ te has dejado el
              agua sin multiplicar: son 2 · 16 = 32 H₂O. Con 16 no cuadran el
              hidrógeno (64 frente a 32) ni el oxígeno (64 frente a 48).
          - valor: '(2, 27, 64, 6, 2, 27, 32)'
            mensaje: |
              Cada Cl₂ da dos cloruros: Cl₂ + 2 e⁻ → 2 Cl⁻. Los 27 Cl₂ son 54
              NaCl. Con 27 no cuadran el cloro (54 frente a 27) ni el sodio
              (64 frente a 37).
          - valor: '(4, 54, 128, 12, 4, 108, 64)'
            mensaje: |
              Está ajustada, pero todos los coeficientes son pares: se puede
              dividir entre 2, y se piden los enteros más pequeños.
        pista: |
          Oxidación, en una sola semirreacción:
          $\mathrm{CrI_3} \rightarrow \mathrm{CrO_4^{2-}} + \mathrm{IO_4^-}$.
          Reducción: $\mathrm{Cl_2} \rightarrow \mathrm{Cl^-}$. Medio básico.
        desarrollo: |
          En medio básico, con el CrI₃ entero en una sola semirreacción. Los
          16 oxígenos del cromato y los tres peryodatos los ponen 32 OH⁻, y
          salen 16 H₂O:

          $$
          \begin{aligned}
          \mathrm{CrI_3} + 32\,\mathrm{OH^-} &\rightarrow \mathrm{CrO_4^{2-}} + 3\,\mathrm{IO_4^-} + 16\,\mathrm{H_2O} + 27\,\mathrm{e^-} && \times 2 \\
          \mathrm{Cl_2} + 2\,\mathrm{e^-} &\rightarrow 2\,\mathrm{Cl^-} && \times 27
          \end{aligned}
          $$

          Cincuenta y cuatro electrones a cada lado. Al sumar:

          $$
          2\,\mathrm{CrI_3} + 27\,\mathrm{Cl_2} + 64\,\mathrm{OH^-} \rightarrow 2\,\mathrm{CrO_4^{2-}} + 6\,\mathrm{IO_4^-} + 54\,\mathrm{Cl^-} + 32\,\mathrm{H_2O}
          $$

          Los 64 Na⁺ del NaOH se reparten entre los tres productos de sodio,
          $6 + 2\cdot 2 + 54 = 64$:

          $$
          2\,\mathrm{CrI_3} + 27\,\mathrm{Cl_2} + 64\,\mathrm{NaOH} \rightarrow 6\,\mathrm{NaIO_4} + 2\,\mathrm{Na_2CrO_4} + 54\,\mathrm{NaCl} + 32\,\mathrm{H_2O}
          $$

      - tipo: justificar
        pregunta: Ordena el ajuste de n). Una pieza es falsa.
        piezas:
          - texto: >-
              El CrI₃ se oxida por dos sitios: el cromo cede 3 electrones y los
              tres yodos, 24.
          - texto: >-
              Como los dos vienen del mismo compuesto, se escriben en una sola
              semirreacción, que cede 27.
          - texto: >-
              El oxidante es el cloro, que gana 2 electrones por cada Cl₂.
          - texto: >-
              Para igualar hacen falta 2 CrI₃ y 27 Cl₂: 54 electrones a cada
              lado.
          - texto: >-
              En medio básico el oxígeno del cromato y del peryodato lo ponen
              los OH⁻, y sale agua.
          - texto: >-
              El cromo y el yodo se pueden ajustar por separado, cada uno con
              su propio factor, porque son dos oxidaciones distintas.
            trampa: true
            mensaje: |
              No son independientes: vienen del mismo CrI₃, un cromo por cada
              tres yodos, y esa proporción no se puede cambiar. Si multiplicas
              cada oxidación por un factor distinto, la ecuación deja de tener
              CrI₃. Por eso se escribe una sola semirreacción con el compuesto
              entero.
        veredicto: |
          Un compuesto que se oxida por dos sitios cede la suma de los dos, y
          entra entero en una sola semirreacción.

    resolucion: |
      **Los cuatro ajustes:**

      $$
      \begin{aligned}
      \text{k)}\;& 2\,\mathrm{CuSO_4} + 4\,\mathrm{KI} \rightarrow 2\,\mathrm{K_2SO_4} + \mathrm{Cu_2I_2} + \mathrm{I_2} \\
      \text{l)}\;& 10\,\mathrm{FeSO_4} + 8\,\mathrm{H_2SO_4} + 2\,\mathrm{KMnO_4} \rightarrow 5\,\mathrm{Fe_2(SO_4)_3} + \mathrm{K_2SO_4} + 2\,\mathrm{MnSO_4} + 8\,\mathrm{H_2O} \\
      \text{m)}\;& 2\,\mathrm{KMnO_4} + 5\,\mathrm{K_2SO_3} + 3\,\mathrm{H_2SO_4} \rightarrow 2\,\mathrm{MnSO_4} + 6\,\mathrm{K_2SO_4} + 3\,\mathrm{H_2O} \\
      \text{n)}\;& 2\,\mathrm{CrI_3} + 27\,\mathrm{Cl_2} + 64\,\mathrm{NaOH} \rightarrow 6\,\mathrm{NaIO_4} + 2\,\mathrm{Na_2CrO_4} + 54\,\mathrm{NaCl} + 32\,\mathrm{H_2O}
      \end{aligned}
      $$

      **Lo que tiene cada una:**

      - **k)** El KI hace dos papeles: dos yoduros se oxidan a I₂ y otros dos
        se van con el cobre, que se reduce a Cu(I), en el Cu₂I₂.
      - **l)** El ajuste iónico sale con 5 Fe²⁺, pero el Fe₂(SO₄)₃ pide los
        hierros de dos en dos: se duplica todo para no dejar fracciones.
      - **m)** Las dos semirreacciones llevan H⁺ y agua, y al sumar hay que
        tachar lo que se repite: quedan 6 H⁺ y 3 H₂O netos.
      - **n)** El CrI₃ se oxida por dos sitios, 3 electrones del cromo y 24
        de los yodos, y se escribe entero en una sola semirreacción. El
        medio es básico, así que el oxígeno lo ponen los OH⁻.

      El material no publica la solución. Los cuatro ajustes están
      comprobados átomo a átomo y en carga, y ninguno admite otro ajuste que
      no sea un múltiplo de este.

  # ── Los cuatro problemas resueltos del tema 10.2, en su orden. El material
  #    publica la resolución de cada uno; aquí se contrasta paso a paso, y las
  #    dos erratas que tiene —una coma perdida en el 2 y una concentración en
  #    el esquema del 3— se dicen en la fuente y en la resolución. Las
  #    láminas 35 y 36, que siguen al 4, son dos ejemplos resueltos escaneados
  #    de un manual y no se transcriben (§08).
  - id: colfq10-1-el-aluminio-que-falta
    titulo: El aluminio que falta, y una Q con exponentes
    fuente: >-
      Problema resuelto 1 · Tema 10.2, Reacciones de oxidación-reducción ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución, que da
      [Al³⁺] = 0,108 M; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Se introduce un electrodo de Cu en una disolución de iones Cu²⁺ de
      concentración 10⁻² M y un electrodo e de Al introducido en una
      disolución de iones Al³⁺. Si el potencial de la pila es 1,96 V ¿Cuáles
      la concentración de iones Al³⁺ en la disolución?

      $E^{0}(\mathrm{Cu^{2+}/Cu}) = 0{,}34$ V

      $E^{0}(\mathrm{Al^{3+}/Al}) = -1{,}66$ V
    pide: La concentración de iones Al³⁺ que da un potencial de 1,96 V.

    pasos:
      - tipo: reconocer
        pregunta: |
          La reacción global es
          $3\,\mathrm{Cu^{2+}} + 2\,\mathrm{Al} \rightarrow 3\,\mathrm{Cu} + 2\,\mathrm{Al^{3+}}$.
          ¿Cómo queda $Q$ en la ecuación de Nernst?
        opciones:
          - texto: >-
              $Q = [\mathrm{Al^{3+}}]^{2}/[\mathrm{Cu^{2+}}]^{3}$, con los
              coeficientes de la reacción como exponentes
            correcta: true
            mensaje: |
              Eso es. Productos arriba, reactivos abajo, cada uno elevado a su
              coeficiente, y los dos metales fuera porque son sólidos. Esos
              mismos coeficientes son los que hacen que aquí $n$ valga 6.
          - texto: >-
              $Q = [\mathrm{Al^{3+}}]/[\mathrm{Cu^{2+}}]$, sin exponentes
            mensaje: |
              Los coeficientes de la reacción global entran como exponentes,
              igual que en cualquier constante de equilibrio. Sin ellos sale
              una concentración de aluminio de más de 100 M, que no existe.
          - texto: >-
              $Q = [\mathrm{Cu^{2+}}]^{3}/[\mathrm{Al^{3+}}]^{2}$
            mensaje: |
              Está del revés: en $Q$ los productos van arriba, y aquí el
              producto es el Al³⁺. El Cu²⁺ es el reactivo que se reduce y
              desaparece de la disolución.
          - texto: >-
              $Q = [\mathrm{Al^{3+}}]^{2}[\mathrm{Cu}]^{3}/([\mathrm{Cu^{2+}}]^{3}[\mathrm{Al}]^{2})$
            mensaje: |
              Los metales no entran: son sólidos puros y su actividad vale 1.
              Una lámina de cobre es igual de cobre sea grande o pequeña.

      - tipo: calcular
        titulo: El potencial estándar
        pregunta: |
          ¿Cuánto vale $E^{0}$ de la pila?
        respuesta:
          tipo: numero
          valor: '2.00'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '-1.32'
            mensaje: |
              Has sumado los dos potenciales, o has cambiado el signo del
              aluminio antes de restar, que da lo mismo. La fem es cátodo
              menos ánodo con los valores tal como vienen:
              $0{,}34 - (-1{,}66)$.
          - valor: '4.34'
            mensaje: |
              Has multiplicado cada potencial por su coeficiente, 3 y 2. El
              potencial es intensivo y no se multiplica: los coeficientes
              entran en $n$ y en $Q$, no en $E^{0}$.
          - valor: '-2.00'
            mensaje: |
              Has restado al revés, ánodo menos cátodo. Una pila que funciona
              tiene $E^{0}$ positivo; si sale negativo, tienes los electrodos
              cambiados. El cátodo es el cobre, el de potencial mayor.
        pista: |
          $E^{0}_{\text{pila}} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}}$,
          y el cátodo es el de potencial de reducción mayor.
        desarrollo: |
          El cobre (0,34 V) se reduce y el aluminio (−1,66 V) se oxida:

          $$
          E^{0} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}} = 0{,}34 - (-1{,}66) = 2{,}00\ \text{V}
          $$

      - tipo: calcular
        titulo: El logaritmo de Q
        pregunta: |
          Con $E = 1{,}96$ V, ¿cuánto vale $\log Q$?
        respuesta:
          tipo: numero
          valor: '4.068'
          tolerancia: 0.02
          formato: el logaritmo decimal de Q, con dos cifras decimales
        distractores:
          - valor: '2.034'
            mensaje: |
              Has usado $n = 3$, los electrones de una sola semirreacción. En
              la reacción global se intercambian 6: cada aluminio cede 3 y
              hay dos, cada cobre gana 2 y hay tres.
          - valor: '1.356'
            mensaje: |
              Has usado $n = 2$, los del cobre solo. La $n$ de Nernst es la de
              la reacción global ajustada, el mínimo común múltiplo de 2 y 3:
              6.
          - valor: '-4.068'
            mensaje: |
              Signo cambiado. La pila da menos que $E^{0}$, así que el término
              que se resta es positivo y $\log Q$ también: en proporción hay
              más producto que en condiciones estándar.
        pista: |
          $1{,}96 = 2{,}00 - \dfrac{0{,}059}{6}\log Q$, con $n = 6$.
        desarrollo: |
          $$
          E = E^{0} - \frac{0{,}059}{n}\log Q
          \quad\Longrightarrow\quad
          \log Q = \frac{6\,(2{,}00 - 1{,}96)}{0{,}059} = 4{,}07
          $$

          Con 0,0592 en lugar de 0,059 sale 4,05: la diferencia es del
          redondeo de la constante, y cabe en la tolerancia.

      - tipo: calcular
        titulo: La concentración de aluminio
        pregunta: |
          Con $[\mathrm{Cu^{2+}}] = 10^{-2}$ M, ¿cuánto vale
          $[\mathrm{Al^{3+}}]$?
        respuesta:
          tipo: numero
          valor: '0.1081'
          tolerancia: 0.002
          formato: la concentración en mol/L, con tres cifras decimales
        distractores:
          - valor: '0.0117'
            mensaje: |
              Eso es $[\mathrm{Al^{3+}}]^{2}$, y te falta la raíz cuadrada. Es
              lo mismo que sale si te olvidas del exponente del aluminio y
              conservas el del cobre.
              $[\mathrm{Al^{3+}}]^{2} = Q\,[\mathrm{Cu^{2+}}]^{3} = 0{,}0117$,
              y su raíz es 0,108.
          - valor: '116.9'
            mensaje: |
              Has quitado los exponentes de $Q$: con
              $[\mathrm{Al^{3+}}] = Q\,[\mathrm{Cu^{2+}}]$ salen 117 M, una
              concentración imposible. Un número así es la señal de que algo
              se ha perdido por el camino: aquí, el cuadrado y el cubo.
          - valor: '9.25e-6'
            mensaje: |
              Has despejado con $Q$ del revés,
              $[\mathrm{Cu^{2+}}]^{3}/[\mathrm{Al^{3+}}]^{2}$. El aluminio es
              el producto y va arriba; con él abajo sale una concentración
              diminuta, y con tan poco producto la pila daría más que
              $E^{0}$, no menos.
        pista: |
          $Q = 10^{4{,}07}$, y
          $[\mathrm{Al^{3+}}]^{2} = Q\,[\mathrm{Cu^{2+}}]^{3}$.
        desarrollo: |
          $$
          Q = 10^{4{,}068} = 1{,}17\cdot 10^{4}
          $$

          $$
          [\mathrm{Al^{3+}}]^{2} = Q\,[\mathrm{Cu^{2+}}]^{3} = 1{,}17\cdot 10^{4}\cdot (10^{-2})^{3} = 1{,}17\cdot 10^{-2}
          $$

          $$
          [\mathrm{Al^{3+}}] = \sqrt{1{,}17\cdot 10^{-2}} = 0{,}108\ \text{M}
          $$

          Coincide con la resolución del material, 0,108 M. Con 0,0592
          saldría 0,106 M.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El cobre (0,34 V) tiene el potencial mayor: se reduce y es el
              cátodo. El aluminio (−1,66 V) es el ánodo.
          - texto: >-
              Para igualar electrones hacen falta 3 Cu²⁺ y 2 Al: la reacción
              global intercambia 6.
          - texto: >-
              $E^{0} = 0{,}34 - (-1{,}66) = 2{,}00$ V, y la pila da 1,96 V.
          - texto: >-
              Nernst con $n = 6$ da $\log Q = 4{,}07$.
          - texto: >-
              Con $[\mathrm{Al^{3+}}]^{2} = Q\,[\mathrm{Cu^{2+}}]^{3}$ sale
              $[\mathrm{Al^{3+}}] = 0{,}108$ M.
          - texto: >-
              Como la pila da menos que $E^{0}$, $Q$ tiene que ser menor que 1.
            trampa: true
            mensaje: |
              Al revés. Si $E < E^{0}$, el término $\frac{0{,}059}{n}\log Q$
              que se resta es positivo, así que $\log Q > 0$ y $Q > 1$: en
              proporción hay más producto que en condiciones estándar. Aquí
              $Q$ vale unos 12 000.
        veredicto: |
          El 6 lo decide todo: es la $n$ de Nernst y sale de los mismos
          coeficientes que hacen de exponentes en $Q$.

    resolucion: |
      **Quién es quién.** El cobre tiene el potencial mayor, así que se
      reduce (cátodo) y el aluminio se oxida (ánodo):

      $$
      \begin{aligned}
      \mathrm{Cu^{2+}} + 2\,\mathrm{e^-} &\rightarrow \mathrm{Cu} && \times 3 \\
      \mathrm{Al} &\rightarrow \mathrm{Al^{3+}} + 3\,\mathrm{e^-} && \times 2
      \end{aligned}
      $$

      $$
      3\,\mathrm{Cu^{2+}} + 2\,\mathrm{Al} \rightarrow 3\,\mathrm{Cu} + 2\,\mathrm{Al^{3+}}
      \qquad n = 6
      $$

      $$
      E^{0} = 0{,}34 - (-1{,}66) = 2{,}00\ \text{V}
      $$

      **Nernst, despejando la incógnita.** Con los metales fuera de $Q$:

      $$
      1{,}96 = 2{,}00 - \frac{0{,}059}{6}\log\frac{[\mathrm{Al^{3+}}]^{2}}{[\mathrm{Cu^{2+}}]^{3}}
      \quad\Longrightarrow\quad
      \log Q = 4{,}07
      $$

      $$
      [\mathrm{Al^{3+}}] = \sqrt{10^{4{,}068}\cdot (10^{-2})^{3}} = \boxed{0{,}108\ \text{M}}
      $$

      Es lo que da la resolución del material.

      **Los dos sitios donde se cae este problema**, y los dos tienen que ver
      con el 6:

      - **La $n$.** No es la de una semirreacción: es la de la reacción
        global ajustada, el mínimo común múltiplo de 2 y 3.
      - **Los exponentes de $Q$.** Los coeficientes 3 y 2 entran como
        exponentes, y al despejar hay que deshacerlos: una raíz cuadrada al
        final.

      Y una comprobación de sentido que no cuesta nada: la pila da **menos**
      que $E^{0}$, así que $Q$ tiene que ser mayor que 1, es decir, hay
      proporcionalmente más aluminio que cobre en disolución. Con el cobre a
      0,01 M, 0,108 M de aluminio lo cumple.

  - id: colfq10-2-cobre-contra-cobre
    titulo: Cobre contra cobre, y una pila que funciona con E° igual a cero
    fuente: >-
      Problema resuelto 2 · Tema 10.2, Reacciones de oxidación-reducción ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución, y su resultado
      impreso, «+ 00295 V», ha perdido la coma: es +0,0295 V. El diagnóstico
      de los errores es nuestro.
    nivel: practica
    enunciado: |
      Dado el siguiente esquema de la pila: Cu°/ Cu²⁺ (0,1 M) // Cu²⁺ (1 M)/Cu°

      Calcula el potencial de la pila
    pide: El potencial de una pila con cobre a los dos lados.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos electrodos son del mismo par, Cu²⁺/Cu, así que
          $E^{0}_{\text{pila}} = 0$. ¿Da corriente esta pila?
        opciones:
          - texto: >-
              Sí: el lado diluido se oxida y sube su concentración, y en el
              concentrado se deposita cobre, hasta que las dos se igualan
            correcta: true
            mensaje: |
              Eso es: una pila de concentración. Lo que la mueve no es la
              diferencia entre dos metales sino entre dos concentraciones, y
              se acaba cuando las dos son iguales, que es cuando $Q = 1$.
          - texto: >-
              No: con $E^{0} = 0$ el potencial es cero con cualquier
              concentración
            mensaje: |
              $E^{0}$ es el potencial con todo a 1 M. Nernst corrige por las
              concentraciones reales, y aquí una es diez veces menor que la
              otra: la corrección no es cero.
          - texto: >-
              Sí, porque el puente salino aporta la energía que falta
            mensaje: |
              El puente salino no aporta energía: cierra el circuito y
              mantiene neutras las dos disoluciones. La energía sale de que
              el sistema tienda a igualar las dos concentraciones.
          - texto: >-
              Sí, y el ánodo es el de la disolución 1 M, porque tiene más iones
              que soltar
            mensaje: |
              Es al revés. En el ánodo el cobre pasa a Cu²⁺ y **sube** la
              concentración, y eso solo tiene sentido en el lado diluido, que
              se va acercando al otro.

      - tipo: calcular
        titulo: El potencial de la pila
        pregunta: |
          ¿Cuánto vale el potencial de la pila?
        respuesta:
          tipo: numero
          valor: '0.0295'
          tolerancia: 0.001
          formato: el potencial en voltios, con cuatro cifras decimales
        distractores:
          - valor: '-0.0295'
            mensaje: |
              Has puesto $Q$ del revés, el cátodo arriba. En el ánodo se forma
              Cu²⁺, así que su concentración es la del producto y va arriba:
              $Q = 0{,}1/1$. Una pila que funciona tiene potencial positivo.
          - valor: '0.059'
            mensaje: |
              Te has dejado la $n$. El cobre intercambia dos electrones, así
              que el factor es $0{,}059/2 = 0{,}0295$ y no 0,059.
          - valor: '0'
            mensaje: |
              Has dado $E^{0}$, que sí es cero, sin la corrección de Nernst.
              La pila da corriente justamente porque las concentraciones son
              distintas: $E = 0 - \frac{0{,}059}{2}\log 0{,}1$.
        pista: |
          La reacción global lleva Cu²⁺ del lado de 1 M al de 0,1 M, con
          $n = 2$, y
          $Q = [\mathrm{Cu^{2+}}]_{\text{ánodo}}/[\mathrm{Cu^{2+}}]_{\text{cátodo}}$.
        desarrollo: |
          $$
          E = E^{0} - \frac{0{,}059}{2}\log\frac{[\mathrm{Cu^{2+}}]_{\text{ánodo}}}{[\mathrm{Cu^{2+}}]_{\text{cátodo}}}
          = 0 - \frac{0{,}059}{2}\log\frac{0{,}1}{1} = 0{,}0295\ \text{V}
          $$

          Unos 30 mV: poco, pero positivo. La resolución del material da el
          mismo número, impreso «+ 00295 V» porque se ha perdido la coma.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos electrodos son del mismo par, así que $E^{0} = 0$.
          - texto: >-
              El lado diluido, 0,1 M, es el ánodo: el cobre se disuelve y su
              concentración sube.
          - texto: >-
              El lado concentrado, 1 M, es el cátodo: el Cu²⁺ se deposita como
              cobre y su concentración baja.
          - texto: >-
              $Q = 0{,}1/1$, y $E = -\frac{0{,}059}{2}\log 0{,}1 = +0{,}0295$ V.
          - texto: >-
              La pila funciona hasta que las dos concentraciones se igualan:
              entonces $Q = 1$ y $E = 0$.
          - texto: >-
              El potencial sale positivo porque el cátodo tiene un potencial
              estándar mayor que el ánodo.
            trampa: true
            mensaje: |
              Los dos electrodos tienen el mismo potencial estándar, 0,34 V: la
              diferencia entre ellos es cero. El signo positivo sale entero
              del término de Nernst, es decir, de que las concentraciones son
              distintas.
        veredicto: |
          En una pila de concentración todo el potencial es Nernst, y el
          diluido es siempre el ánodo.

    resolucion: |
      **Una pila con el mismo metal a los dos lados.** Como los dos
      electrodos son del mismo par, $E^{0} = 0{,}34 - 0{,}34 = 0$ V. Lo único
      que distingue un lado del otro es la concentración, y basta: el
      sistema tiende a igualarlas.

      - **Ánodo**, el lado diluido (0,1 M):
        $\mathrm{Cu} \rightarrow \mathrm{Cu^{2+}} + 2\,\mathrm{e^-}$. Sube su
        concentración.
      - **Cátodo**, el concentrado (1 M):
        $\mathrm{Cu^{2+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Cu}$. Baja la
        suya.

      $$
      E = 0 - \frac{0{,}059}{2}\log\frac{0{,}1}{1} = \boxed{+0{,}0295\ \text{V}}
      $$

      **Una errata del material.** La resolución imprime «+ 00295 V»: se ha
      perdido la coma. Es +0,0295 V, unos 30 milivoltios, que es lo que sale
      de la cuenta y lo que cabe esperar de una diferencia de diez veces en
      la concentración.

      **La regla que deja este problema:** en una pila de concentración el
      diluido es siempre el ánodo, y el potencial vale
      $\frac{0{,}059}{n}\log\frac{c_{\text{concentrado}}}{c_{\text{diluido}}}$,
      positivo por construcción. Se agota cuando las dos concentraciones son
      iguales.

  - id: colfq10-3-el-estano-el-sodio-y-el-platino
    titulo: El estaño, el sodio y el platino que hace falta
    fuente: >-
      Problema resuelto 3 · Tema 10.2, Reacciones de oxidación-reducción ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución, con una errata en
      el esquema final, que pone el Na⁺ a 1 M cuando el enunciado lo da a
      10⁻¹ M; el diagnóstico de los errores es nuestro.
    nivel: practica
    enunciado: |
      Se construye una celda galvánica como sigue: un alambre de Pt se
      sumerge en una disolución que contiene iones Sn²⁺ 1 M e iones Sn⁴⁺
      10⁻³ M; esto constituye una semicelda; la otra semicelda tiene una
      barra de sodio metálico sumergida en una disolución 10⁻¹ M de Na⁺.
      Escribe las reacciones de semicelda, la reacción global y dibuja la
      pila.

      $E^{0}(\mathrm{Sn^{4+}/Sn^{2+}}) = 0{,}13$ V,
      $E^{0}(\mathrm{Na^{+}/Na}) = -2{,}71$ V
    pide: Las reacciones de cada semicelda, la reacción global, el potencial de la pila y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La semicelda del estaño lleva un alambre de platino. ¿Por qué?
        opciones:
          - texto: >-
              Porque el par Sn⁴⁺/Sn²⁺ no tiene ningún sólido que pueda hacer de
              electrodo, y el platino solo conduce
            correcta: true
            mensaje: |
              Eso es. Los dos estados del estaño están disueltos, y hace falta
              algo que recoja los electrones sin reaccionar. El platino es
              inerte: no aparece en ninguna semirreacción ni en $Q$.
          - texto: >-
              Porque el platino es el metal que se reduce en esa semicelda
            mensaje: |
              El platino no se reduce ni se oxida: es un electrodo inerte. Lo
              que se reduce es el Sn⁴⁺, que pasa a Sn²⁺ en la disolución, junto
              a la superficie del platino.
          - texto: >-
              Porque el sodio es demasiado blando para hacer de electrodo
            mensaje: |
              El platino está en la otra semicelda, la del estaño. La del
              sodio tiene su propio electrodo, la barra de sodio, que sí
              participa: es el metal que se oxida.
          - texto: >-
              Porque el ánodo siempre necesita un electrodo inerte
            mensaje: |
              Aquí el platino está en el cátodo, no en el ánodo. Un electrodo
              inerte hace falta donde el par no tiene sólido, sea cual sea el
              papel de esa semicelda.

      - tipo: calcular
        titulo: El electrodo de estaño
        pregunta: |
          ¿Cuánto vale el potencial del electrodo $\mathrm{Sn^{4+}/Sn^{2+}}$,
          con $[\mathrm{Sn^{2+}}] = 1$ M y $[\mathrm{Sn^{4+}}] = 10^{-3}$ M?
        respuesta:
          tipo: numero
          valor: '0.0415'
          tolerancia: 0.003
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '0.2185'
            mensaje: |
              Has puesto $Q$ del revés. La semirreacción se escribe como
              reducción,
              $\mathrm{Sn^{4+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Sn^{2+}}$,
              así que $Q = [\mathrm{Sn^{2+}}]/[\mathrm{Sn^{4+}}] = 10^{3}$. Hay
              poco Sn⁴⁺, que es el que se reduce: el potencial tiene que
              bajar, no subir.
          - valor: '0.13'
            mensaje: |
              Ese es el potencial estándar, sin corregir. Solo valdría con los
              dos iones a 1 M, y el Sn⁴⁺ está mil veces más diluido.
          - valor: '-0.047'
            mensaje: |
              Has usado $n = 1$. El estaño pasa de +4 a +2: son dos
              electrones, y el factor es $0{,}059/2$.
        pista: |
          $E = 0{,}13 - \dfrac{0{,}059}{2}\log\dfrac{[\mathrm{Sn^{2+}}]}{[\mathrm{Sn^{4+}}]}$.
        desarrollo: |
          $$
          E = 0{,}13 - \frac{0{,}059}{2}\log\frac{1}{10^{-3}} = 0{,}13 - 0{,}0295\cdot 3 = 0{,}0415\ \text{V}
          $$

          La resolución del material lo redondea a 0,04 V.

      - tipo: calcular
        titulo: El electrodo de sodio
        pregunta: |
          ¿Y el del electrodo $\mathrm{Na^{+}/Na}$, con
          $[\mathrm{Na^{+}}] = 10^{-1}$ M?
        respuesta:
          tipo: numero
          valor: '-2.769'
          tolerancia: 0.005
          formato: el potencial en voltios, con tres cifras decimales y su signo
        distractores:
          - valor: '-2.651'
            mensaje: |
              Has puesto $Q$ del revés. Escrita como reducción,
              $\mathrm{Na^{+}} + \mathrm{e^-} \rightarrow \mathrm{Na}$, el ion
              es el reactivo y va abajo: $Q = 1/[\mathrm{Na^{+}}] = 10$. Con el
              ion diluido el potencial de reducción baja, es decir, se hace
              más negativo.
          - valor: '-2.71'
            mensaje: |
              Te has quedado cerca del estándar: o no has corregido por la
              concentración, y sale −2,71, o has dividido la corrección entre
              2, y sale −2,74. Para el sodio $n = 1$, así que la corrección
              vale 0,059 V entera.
          - valor: '2.769'
            mensaje: |
              Has dado el potencial de oxidación, con el signo cambiado. Los
              potenciales de electrodo se dan siempre de reducción, como en la
              tabla, aunque ese electrodo acabe de ánodo: la resta cátodo
              menos ánodo ya se encarga del sentido.
        pista: |
          Para el sodio $n = 1$:
          $E = -2{,}71 - 0{,}059\log\dfrac{1}{[\mathrm{Na^{+}}]}$.
        desarrollo: |
          $$
          E = -2{,}71 - \frac{0{,}059}{1}\log\frac{1}{0{,}1} = -2{,}71 - 0{,}059 = -2{,}769\ \text{V}
          $$

          El material da −2,77 V.

      - tipo: calcular
        titulo: El potencial de la pila
        pregunta: |
          ¿Cuánto vale el potencial de la pila?
        respuesta:
          tipo: numero
          valor: '2.8105'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '2.84'
            mensaje: |
              Ese es el potencial estándar, $0{,}13 - (-2{,}71)$, sin las
              correcciones de concentración. Con las concentraciones del
              enunciado bajan los dos electrodos, el de estaño bastante más,
              y la pila da 2,81 V.
          - valor: '-2.7275'
            mensaje: |
              Has sumado los dos potenciales de reducción,
              $0{,}0415 + (-2{,}769)$. La fem es la diferencia, cátodo menos
              ánodo. La suma solo vale si antes le cambias el signo al del
              ánodo para escribirlo como oxidación, que es otra forma de
              restar.
          - valor: '-2.8105'
            mensaje: |
              Has restado al revés, sodio menos estaño. El cátodo es el de
              potencial mayor, el estaño, y la fem de una pila que funciona
              sale positiva.
        pista: |
          $E_{\text{pila}} = E_{\text{cátodo}} - E_{\text{ánodo}}$, con los dos
          potenciales que acabas de calcular.
        desarrollo: |
          $$
          E_{\text{pila}} = E_{\text{cátodo}} - E_{\text{ánodo}} = 0{,}0415 - (-2{,}769) = 2{,}8105\ \text{V}
          $$

          El material escribe $0{,}04 - (-2{,}77) = 2{,}81$ V: lo mismo, con
          los dos electrodos redondeados.

      - tipo: dibujar
        consigna: |
          Dibuja la pila: los dos vasos, el cable con el voltímetro y el
          puente salino. Marca el ánodo y el cátodo con su signo, el sentido
          de los electrones y hacia dónde van los iones del puente, y escribe
          debajo el esquema abreviado.
        comprueba:
          - punto: El ánodo es la barra de sodio, y es el polo negativo.
            porque: |
              Es el electrodo de potencial de reducción menor, −2,77 V, así
              que se oxida. El esquema abreviado empieza siempre por él.
          - punto: El cátodo es el alambre de platino, metido en la disolución de Sn⁴⁺ y Sn²⁺, y es el polo positivo.
            porque: |
              El platino no reacciona: recoge los electrones y el Sn⁴⁺ se
              reduce a Sn²⁺ junto a él. Un dibujo con una barra de estaño está
              mal, porque en esta pila no hay estaño metálico.
          - punto: Los electrones van por el cable, del sodio al platino.
            porque: |
              Salen de donde algo se oxida y llegan a donde algo se reduce.
              Por la disolución no pasan electrones: pasan iones.
          - punto: En el puente salino, los aniones van hacia el sodio y los cationes hacia el platino.
            porque: |
              En el ánodo aparecen Na⁺ y hay que compensar esa carga con
              aniones; en el cátodo desaparece carga positiva y llegan
              cationes. Con KCl en el puente, el Cl⁻ va al lado del sodio y el
              K⁺ al del estaño.
          - punto: |
              El esquema es
              $\mathrm{Na}\,\big|\,\mathrm{Na^{+}}\,(0{,}1\ \text{M})\,\big\|\,\mathrm{Sn^{4+}}\,(10^{-3}\ \text{M}),\,\mathrm{Sn^{2+}}\,(1\ \text{M})\,\big|\,\mathrm{Pt}$.
            porque: |
              Del ánodo al cátodo, con doble barra en el puente y las
              concentraciones del enunciado. El esquema del material pone el
              Na⁺ a 1 M, y es una errata: el enunciado lo da a 10⁻¹ M.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada semirreacción se escribe como reducción, con un $Q$ que
              solo lleva las especies de su semicelda.
          - texto: >-
              El estaño queda en 0,04 V y el sodio en −2,77 V: el estaño es el
              cátodo y el sodio, el ánodo.
          - texto: >-
              Reducción:
              $\mathrm{Sn^{4+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Sn^{2+}}$.
              Oxidación, dos veces:
              $\mathrm{Na} \rightarrow \mathrm{Na^{+}} + \mathrm{e^-}$.
          - texto: >-
              Reacción global:
              $\mathrm{Sn^{4+}} + 2\,\mathrm{Na} \rightarrow \mathrm{Sn^{2+}} + 2\,\mathrm{Na^{+}}$,
              con $E = 0{,}04 - (-2{,}77) = 2{,}81$ V.
          - texto: >-
              Como la oxidación del sodio va dos veces, su potencial también:
              $2 \times (-2{,}77) = -5{,}54$ V, y la pila da 5,58 V.
            trampa: true
            mensaje: |
              El potencial no se multiplica: es intensivo, como la
              temperatura. Multiplicar la semirreacción por 2 sirve para
              igualar electrones en la reacción global y cambia $n$, no el
              potencial del electrodo.
        veredicto: |
          Cada electrodo con su Nernst, cátodo el de mayor potencial, y la
          resta sin multiplicar nada.

    resolucion: |
      **Cada electrodo con su Nernst.** Las dos semirreacciones se escriben
      como reducción, con las concentraciones de su semicelda:

      $$
      E_{\mathrm{Sn}} = 0{,}13 - \frac{0{,}059}{2}\log\frac{1}{10^{-3}} = 0{,}0415\ \text{V}
      $$

      $$
      E_{\mathrm{Na}} = -2{,}71 - 0{,}059\log\frac{1}{0{,}1} = -2{,}769\ \text{V}
      $$

      **Quién es quién.** El estaño tiene el potencial mayor: es el cátodo, y
      su electrodo es el platino, porque el par Sn⁴⁺/Sn²⁺ no tiene ningún
      sólido. El sodio es el ánodo.

      $$
      \begin{aligned}
      \text{cátodo: }& \mathrm{Sn^{4+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Sn^{2+}} \\
      \text{ánodo: }& \mathrm{Na} \rightarrow \mathrm{Na^{+}} + \mathrm{e^-} \quad (\times 2) \\
      \text{global: }& \mathrm{Sn^{4+}} + 2\,\mathrm{Na} \rightarrow \mathrm{Sn^{2+}} + 2\,\mathrm{Na^{+}}
      \end{aligned}
      $$

      $$
      E_{\text{pila}} = 0{,}0415 - (-2{,}769) = \boxed{2{,}81\ \text{V}}
      $$

      Positivo: espontánea. Coincide con la resolución del material.

      **La pila, en esquema:**

      $$
      \mathrm{Na}\,\big|\,\mathrm{Na^{+}}\,(0{,}1\ \text{M})\,\big\|\,\mathrm{Sn^{4+}}\,(10^{-3}\ \text{M}),\,\mathrm{Sn^{2+}}\,(1\ \text{M})\,\big|\,\mathrm{Pt}
      $$

      En el dibujo, los electrones van por el cable del sodio al platino, y
      en el puente salino los aniones van hacia el sodio y los cationes
      hacia el platino.

      **Una errata del material.** Su esquema final escribe «Na/Na⁺ (1M)»,
      pero el enunciado pone el Na⁺ a 10⁻¹ M, y con 0,1 M es como sale el
      −2,77 V de su propia resolución.

      Y un apunte de realismo que el problema no pide: el sodio metálico
      reacciona con el agua, así que esta pila no se podría montar tal cual.
      Es un ejercicio de papel para practicar Nernst con un potencial muy
      negativo.

  - id: colfq10-4-plata-hierro-y-plomo
    titulo: Tres electrodos, la pila que más empuja y la que se pide
    fuente: >-
      Problema resuelto 4 · Tema 10.2, Reacciones de oxidación-reducción ·
      Fundamentos Químicos de la Ingeniería (25975), Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El material publica la resolución; el diagnóstico
      de los errores es nuestro.
    nivel: practica
    enunciado: |
      Dados los potenciales de reducción de los siguientes electrodos:
      $E^{0}(\mathrm{Fe^{2+}/Fe}) = -0{,}44$ V ·
      $E^{0}(\mathrm{Ag^{+}/Ag}) = 0{,}80$ V ·
      $E^{0}(\mathrm{Pb^{2+}/Pb}) = -0{,}13$ V

      i. ¿qué combinación resultará en la pila de mayor fuerza
      electromotriz?

      ii. Calcula la fuerza electromotriz de la pila formada por un electrodo
      de plata introducido en una disolución 0,1 M de nitrato de plata y
      unelectrodo de plomo introducido en una disolución de sulfato plumboso
      0,1 M, indicando cátodo, ánodo y las reacciones que ocurren en cada
      electrodo
    pide: La pareja de mayor fem, y la fem de la pila de plata y plomo con sus electrodos y reacciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          i. ¿Qué combinación da la pila de mayor fuerza electromotriz?
        opciones:
          - texto: >-
              Plata con hierro, porque son los dos potenciales más separados
            correcta: true
            mensaje: |
              Eso es. La fem es la diferencia entre los dos potenciales de
              reducción, así que la mayor sale del más alto contra el más
              bajo: $0{,}80 - (-0{,}44) = 1{,}24$ V. Es lo que responde el
              material.
          - texto: >-
              Plata con plomo, porque es la que pide el apartado ii
            mensaje: |
              El apartado ii pide esa pila, pero no porque sea la mayor: da
              $0{,}80 - (-0{,}13) = 0{,}93$ V, menos que los 1,24 V de la plata
              con el hierro.
          - texto: >-
              Hierro con plomo, porque los dos potenciales son negativos
            mensaje: |
              Dos potenciales negativos también forman pila, pero si están
              cerca dan poca fem: $-0{,}13 - (-0{,}44) = 0{,}31$ V. La fem crece
              con la separación entre los dos, no con su signo.
          - texto: >-
              Da igual, porque la fem depende solo de las concentraciones
            mensaje: |
              Las concentraciones corrigen la fem, pero lo que manda es la
              diferencia de potenciales estándar. En condiciones estándar no
              hay corrección y la fem es exactamente esa diferencia.

      - tipo: calcular
        titulo: El potencial estándar de la pila de plata y plomo
        pregunta: |
          ii. Para la pila de plata y plomo, ¿cuánto vale $E^{0}$?
        respuesta:
          tipo: numero
          valor: '0.93'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.67'
            mensaje: |
              Has sumado los dos potenciales. La fem es la resta, cátodo menos
              ánodo, con los valores de la tabla: $0{,}80 - (-0{,}13)$.
          - valor: '1.73'
            mensaje: |
              Has multiplicado el potencial de la plata por 2 porque su
              semirreacción va dos veces. El potencial es intensivo: igualar
              electrones cambia $n$, no $E^{0}$.
          - valor: '-0.93'
            mensaje: |
              Has restado al revés. El cátodo es la plata, que tiene el
              potencial mayor, y la fem de una pila que funciona es positiva.
        pista: |
          La plata (0,80 V) se reduce y el plomo (−0,13 V) se oxida.
        desarrollo: |
          $$
          E^{0} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}} = 0{,}80 - (-0{,}13) = 0{,}93\ \text{V}
          $$

      - tipo: calcular
        titulo: La fuerza electromotriz con 0,1 M
        pregunta: |
          Con las dos disoluciones 0,1 M, ¿cuánto vale la fem?
        respuesta:
          tipo: numero
          valor: '0.9005'
          tolerancia: 0.005
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.9595'
            mensaje: |
              Has puesto $Q$ del revés. En
              $2\,\mathrm{Ag^{+}} + \mathrm{Pb} \rightarrow 2\,\mathrm{Ag} + \mathrm{Pb^{2+}}$
              el producto es el Pb²⁺:
              $Q = [\mathrm{Pb^{2+}}]/[\mathrm{Ag^{+}}]^{2} = 10$, y con
              $Q > 1$ el potencial baja.
          - valor: '0.93'
            mensaje: |
              Te sale el potencial estándar. O no has corregido, o te has
              dejado el cuadrado de $[\mathrm{Ag^{+}}]$: sin él,
              $Q = 0{,}1/0{,}1 = 1$ y el logaritmo es cero. Con él,
              $Q = 0{,}1/0{,}1^{2} = 10$.
          - valor: '0.871'
            mensaje: |
              Has usado $n = 1$. La reacción global intercambia dos
              electrones —el plomo cede dos y hay dos platas que ganan uno
              cada una—, así que el factor es $0{,}059/2$.
        pista: |
          $Q = [\mathrm{Pb^{2+}}]/[\mathrm{Ag^{+}}]^{2}$, con $n = 2$ y los
          metales fuera.
        desarrollo: |
          $$
          E = 0{,}93 - \frac{0{,}059}{2}\log\frac{0{,}1}{0{,}1^{2}} = 0{,}93 - 0{,}0295 = 0{,}9005\ \text{V}
          $$

          El material da 0,90 V.

      - tipo: justificar
        pregunta: Ordena la resolución del apartado ii. Una pieza es falsa.
        piezas:
          - texto: >-
              La plata tiene el potencial mayor, 0,80 V: es el cátodo, y en él
              $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$.
          - texto: >-
              El plomo, con −0,13 V, es el ánodo, y en él
              $\mathrm{Pb} \rightarrow \mathrm{Pb^{2+}} + 2\,\mathrm{e^-}$.
          - texto: >-
              Para igualar electrones la de la plata va dos veces:
              $2\,\mathrm{Ag^{+}} + \mathrm{Pb} \rightarrow 2\,\mathrm{Ag} + \mathrm{Pb^{2+}}$,
              con $n = 2$.
          - texto: >-
              $E^{0} = 0{,}93$ V y, con $Q = 0{,}1/0{,}1^{2} = 10$, la fem baja a
              0,90 V.
          - texto: >-
              Como $Q = 10$ es mayor que 1, la reacción va hacia los reactivos
              y la plata acaba disolviéndose.
            trampa: true
            mensaje: |
              Que $Q$ sea mayor que 1 solo baja un poco el potencial: la
              referencia no es 1, es $K$. Aquí $\log K = 2\cdot 0{,}93/0{,}059$,
              más de 31, así que $K$ es muchísimo mayor que 10 y la reacción
              sigue yendo hacia la plata metálica. Lo dice también el signo:
              la fem sigue siendo positiva.
        veredicto: |
          El cátodo lo decide el potencial, la $n$ la reacción global y la
          corrección el cuadrado de la plata.

    resolucion: |
      **i · La pila de mayor fem.** La fem es la diferencia entre los dos
      potenciales de reducción, así que la mayor sale de los dos más
      separados: la plata (+0,80 V) con el hierro (−0,44 V),
      $0{,}80 - (-0{,}44) = 1{,}24$ V. Es la respuesta del material, que da
      el par y no el número.

      **ii · La pila de plata y plomo.** La plata tiene el potencial mayor:

      $$
      \begin{aligned}
      \text{cátodo: }& \mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag} \quad (\times 2) \\
      \text{ánodo: }& \mathrm{Pb} \rightarrow \mathrm{Pb^{2+}} + 2\,\mathrm{e^-} \\
      \text{global: }& 2\,\mathrm{Ag^{+}} + \mathrm{Pb} \rightarrow 2\,\mathrm{Ag} + \mathrm{Pb^{2+}}
      \end{aligned}
      $$

      $$
      E^{0} = 0{,}80 - (-0{,}13) = 0{,}93\ \text{V}
      $$

      $$
      E = 0{,}93 - \frac{0{,}059}{2}\log\frac{[\mathrm{Pb^{2+}}]}{[\mathrm{Ag^{+}}]^{2}} = 0{,}93 - \frac{0{,}059}{2}\log\frac{0{,}1}{0{,}01} = \boxed{0{,}90\ \text{V}}
      $$

      Coincide con el material. El cuadrado de $[\mathrm{Ag^{+}}]$ es lo que
      hace que haya corrección: sin él, $Q$ valdría 1 y la fem se quedaría
      en 0,93 V.

      Un apunte sobre el enunciado: el sulfato de plomo(II) es muy poco
      soluble, así que una disolución 0,1 M de PbSO₄ no se puede preparar
      de verdad. El problema lo idealiza, y lo único que usa es que
      $[\mathrm{Pb^{2+}}] = 0{,}1$ M; con una sal soluble de plomo(II) la
      cuenta sería la misma.

  # ── Y los siete problemas propuestos del tema, en su orden (láminas 38 y
  #    39 del tema 10.2). Traen la respuesta final, contra la que se ha
  #    contrastado cada paso. Los que no dan potenciales los toman de la
  #    tabla de potenciales estándar del propio tema 10.2 (lámina 14).
  #    Numeración propia, `p1`…`p7`, porque la de los resueltos ya usa del 1
  #    al 4.
  - id: colfq10-p1-la-plata-que-da-1-21-v
    titulo: Cinc contra plata, y cuánta plata queda si la pila da 1,21 V
    fuente: >-
      Problema 1 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro. Los potenciales estándar son
      los de la tabla del tema 10.2.
    nivel: practica
    enunciado: |
      **a)** Determina el potencial estándar de la celda galvánica:
      Zn/Zn²⁺//Ag⁺/Ag.

      **b)** Si la concentración del ión zinc en la semicelda Zn/Zn²⁺ es 1 M
      y el potencial de la celda a 25 °C es 1,21 V, ¿Cuál será la
      concentración del ion de plata en la semicelda Ag⁺/Ag?
    pide: El potencial estándar de la celda y la concentración de Ag⁺ que da 1,21 V.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da ningún potencial. ¿De dónde salen?
        opciones:
          - texto: >-
              De la tabla de potenciales estándar de reducción del tema, que da
              0,80 V para Ag⁺/Ag y −0,76 V para Zn²⁺/Zn
            correcta: true
            mensaje: |
              Eso es. Un «determina el potencial estándar» sin datos manda a
              la tabla. Son los valores de la tabla del tema 10.2, y con ellos
              sale la solución de la colección, 1,56 V.
          - texto: >-
              Del esquema, porque el electrodo de la derecha siempre tiene el
              potencial positivo
            mensaje: |
              El esquema dice quién es el cátodo —el de la derecha—, no cuánto
              vale su potencial. Para el número hace falta la tabla.
          - texto: >-
              Del apartado b, porque con 1,21 V ya se puede despejar $E^{0}$
            mensaje: |
              En b hay dos incógnitas, $E^{0}$ y la concentración de plata, y
              una sola ecuación. $E^{0}$ tiene que venir de fuera, de la
              tabla.
          - texto: >-
              De ningún sitio, porque el potencial estándar de una pila es
              siempre 1,10 V
            mensaje: |
              1,10 V es el de la pila Daniell, cinc contra cobre. Cada pareja
              de electrodos tiene el suyo, y aquí el cátodo es de plata, no de
              cobre.

      - tipo: calcular
        titulo: El potencial estándar
        pregunta: |
          a) ¿Cuánto vale $E^{0}$ de la celda?
        respuesta:
          tipo: numero
          valor: '1.56'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.04'
            mensaje: |
              Has sumado los dos potenciales, $0{,}80 + (-0{,}76)$. La fem es
              la diferencia, cátodo menos ánodo: $0{,}80 - (-0{,}76)$.
          - valor: '2.36'
            mensaje: |
              Has multiplicado por 2 el potencial de la plata porque su
              semirreacción va dos veces. El potencial es intensivo: igualar
              electrones cambia $n$, no $E^{0}$.
          - valor: '-1.56'
            mensaje: |
              Has restado al revés. El cátodo es la plata, el de potencial
              mayor, y la fem de una pila que funciona es positiva.
        pista: |
          La plata (0,80 V) se reduce y el cinc (−0,76 V) se oxida.
        desarrollo: |
          $$
          E^{0} = E^{0}(\mathrm{Ag^{+}/Ag}) - E^{0}(\mathrm{Zn^{2+}/Zn}) = 0{,}80 - (-0{,}76) = 1{,}56\ \text{V}
          $$

          Es la solución de la colección.

      - tipo: calcular
        titulo: El logaritmo de la concentración de plata
        pregunta: |
          b) Con $[\mathrm{Zn^{2+}}] = 1$ M y $E = 1{,}21$ V, ¿cuánto vale
          $\log[\mathrm{Ag^{+}}]$?
        respuesta:
          tipo: numero
          valor: '-5.932'
          tolerancia: 0.03
          formato: el logaritmo decimal de la concentración, con dos cifras decimales y su signo
        distractores:
          - valor: '-2.966'
            mensaje: |
              Has usado $n = 1$. La reacción global,
              $\mathrm{Zn} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Zn^{2+}} + 2\,\mathrm{Ag}$,
              intercambia dos electrones, y el factor es $0{,}059/2$.
          - valor: '-11.86'
            mensaje: |
              Te has dejado el cuadrado de la plata en $Q$. Con
              $Q = [\mathrm{Zn^{2+}}]/[\mathrm{Ag^{+}}]^{2}$, el 2 del
              exponente se come el 2 de la $n$ y queda
              $E = E^{0} + 0{,}059\log[\mathrm{Ag^{+}}]$; sin él sale el doble.
          - valor: '5.932'
            mensaje: |
              Signo cambiado: una concentración de un millón de moles por
              litro no existe. La pila da menos que $E^{0}$, así que hay poca
              plata, el reactivo, y su logaritmo tiene que ser negativo.
        pista: |
          $E = E^{0} - \dfrac{0{,}059}{2}\log\dfrac{[\mathrm{Zn^{2+}}]}{[\mathrm{Ag^{+}}]^{2}}$,
          y con el cinc a 1 M queda
          $E = E^{0} + 0{,}059\log[\mathrm{Ag^{+}}]$.
        desarrollo: |
          $$
          1{,}21 = 1{,}56 - \frac{0{,}059}{2}\log\frac{1}{[\mathrm{Ag^{+}}]^{2}} = 1{,}56 + 0{,}059\log[\mathrm{Ag^{+}}]
          $$

          $$
          \log[\mathrm{Ag^{+}}] = \frac{1{,}21 - 1{,}56}{0{,}059} = -5{,}93
          $$

      - tipo: calcular
        titulo: La concentración de plata
        pregunta: |
          ¿Cuánto vale entonces $[\mathrm{Ag^{+}}]$?
        respuesta:
          tipo: numero
          valor: '1.169e-6'
          tolerancia: 7e-8
          formato: la concentración en mol/L, en notación científica, como 3,5e-4
        distractores:
          - valor: '2.65e-3'
            mensaje: |
              Has deshecho el logaritmo con $e^{x}$, y el de Nernst con 0,059
              es decimal: la concentración es $10^{-5{,}93}$, no
              $e^{-5{,}93}$.
          - valor: '8.55e5'
            mensaje: |
              Se te ha perdido el signo del exponente: $10^{+5{,}93}$ son casi
              un millón de moles por litro. Es $10^{-5{,}93}$.
        pista: |
          $[\mathrm{Ag^{+}}] = 10^{-5{,}93}$.
        desarrollo: |
          $$
          [\mathrm{Ag^{+}}] = 10^{-5{,}932} = 1{,}17\cdot 10^{-6}\ \text{M}
          $$

          Es la solución de la colección. Con 0,0592 en lugar de 0,059
          saldría $1{,}22\cdot 10^{-6}$ M, y cabe en la tolerancia.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los potenciales de la tabla, la plata (0,80 V) es el cátodo y
              el cinc (−0,76 V) el ánodo: $E^{0} = 1{,}56$ V.
          - texto: >-
              La reacción global,
              $\mathrm{Zn} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Zn^{2+}} + 2\,\mathrm{Ag}$,
              intercambia dos electrones.
          - texto: >-
              Con el cinc a 1 M, Nernst queda
              $E = 1{,}56 + 0{,}059\log[\mathrm{Ag^{+}}]$.
          - texto: >-
              La pila da 1,21 V, menos que $E^{0}$, porque hay poca plata:
              $1{,}17\cdot 10^{-6}$ M.
          - texto: >-
              Como la pila da menos que $E^{0}$, la plata tiene que estar más
              concentrada que 1 M.
            trampa: true
            mensaje: |
              Al revés. La plata es un reactivo: si hay menos que en
              condiciones estándar, $Q$ crece y el potencial baja. Una pila
              que da menos que $E^{0}$ con el cinc a 1 M es una pila con poca
              plata.
        veredicto: |
          Por cada factor diez que baja la plata, la pila pierde 0,059 V: 0,35
          V son casi seis factores diez.

    resolucion: |
      **a · El potencial estándar**, con los valores de la tabla del tema:

      $$
      E^{0} = E^{0}(\mathrm{Ag^{+}/Ag}) - E^{0}(\mathrm{Zn^{2+}/Zn}) = 0{,}80 - (-0{,}76) = 1{,}56\ \text{V}
      $$

      **b · La plata que queda.** La reacción es
      $\mathrm{Zn} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Zn^{2+}} + 2\,\mathrm{Ag}$,
      con $n = 2$, y con el cinc a 1 M el cuadrado de la plata se simplifica
      con el 2 de la $n$:

      $$
      E = E^{0} - \frac{0{,}059}{2}\log\frac{1}{[\mathrm{Ag^{+}}]^{2}} = E^{0} + 0{,}059\log[\mathrm{Ag^{+}}]
      $$

      $$
      \log[\mathrm{Ag^{+}}] = \frac{1{,}21 - 1{,}56}{0{,}059} = -5{,}93
      \quad\Longrightarrow\quad
      [\mathrm{Ag^{+}}] = \boxed{1{,}17\cdot 10^{-6}\ \text{M}}
      $$

      Las dos coinciden con la colección: 1,56 V y $1{,}17\cdot 10^{-6}$ M.

      **La lectura física.** La pila ha perdido 0,35 V respecto del
      estándar, y con Nernst cada factor diez en la concentración de plata
      vale 0,059 V: son casi seis factores diez, una plata un millón de
      veces más diluida que la estándar.

  - id: colfq10-p2-magnesio-y-plata-a-la-centesima
    titulo: Magnesio y plata a la centésima molar, electrodo por electrodo
    fuente: >-
      Problema 2 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro. Los potenciales estándar son
      los de la tabla del tema 10.2.
    nivel: practica
    enunciado: |
      Dada la siguiente celda galvánica: Mg (s)/Mg²⁺ (10⁻² M)//Ag⁺ (10⁻² M)/Ag (s)

      **a)** Escribe las semirreacciones correspondientes a los dos
      electrodos y la reacción global de la celda.

      **b)** Calcula el potencial de cada electrodo y la fem de la celda.
    pide: Las semirreacciones, la reacción global, el potencial de cada electrodo y la fem.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué electrodo es el cátodo?
        opciones:
          - texto: >-
              La plata, porque su potencial de reducción, 0,80 V, es mucho
              mayor que el del magnesio, −2,37 V
            correcta: true
            mensaje: |
              Eso es, y el esquema lo dice también: el cátodo va a la derecha.
              El magnesio, uno de los metales más reductores de la tabla, es
              el ánodo.
          - texto: >-
              El magnesio, porque va a la izquierda del esquema
            mensaje: |
              La izquierda del esquema es el ánodo, no el cátodo: el esquema se
              escribe siempre del ánodo al cátodo.
          - texto: >-
              Ninguno de los dos, porque las dos concentraciones son iguales
            mensaje: |
              Que las concentraciones sean iguales no anula nada cuando los
              pares son distintos: la diferencia de potenciales estándar, más
              de 3 V, sigue ahí.
          - texto: >-
              El magnesio, porque su ion tiene más carga que el de la plata
            mensaje: |
              La carga del ion no decide; decide el potencial de reducción. Y
              el del magnesio es de los más bajos de la tabla.

      - tipo: calcular
        titulo: La reacción global
        pregunta: |
          a) La reacción global, sin ajustar, es
          $\mathrm{Mg} + \mathrm{Ag^{+}} \rightarrow \mathrm{Mg^{2+}} + \mathrm{Ag}$.
          ¿Cuáles son los coeficientes, en ese orden?
        respuesta:
          tipo: vector
          valor: '(1, 2, 1, 2)'
          tolerancia: 0.001
          formato: los coeficientes en el orden de la ecuación, entre paréntesis y separados por comas
        distractores:
          - valor: '(1, 1, 1, 1)'
            mensaje: |
              Así la masa cuadra, pero la carga no: +1 a la izquierda y +2 a la
              derecha. El magnesio cede dos electrones y cada plata gana uno,
              así que hacen falta dos Ag⁺ por cada Mg.
          - valor: '(2, 1, 2, 1)'
            mensaje: |
              Has multiplicado la semirreacción equivocada. La que va dos veces
              es la de la plata, que solo gana un electrón; la del magnesio ya
              cede dos. Con tu ecuación la carga no cuadra: +1 a la izquierda
              y +4 a la derecha.
        pista: |
          Cátodo: $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$.
          Ánodo: $\mathrm{Mg} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{e^-}$.
        desarrollo: |
          $$
          \begin{aligned}
          \mathrm{Ag^{+}} + \mathrm{e^-} &\rightarrow \mathrm{Ag} && \times 2 \\
          \mathrm{Mg} &\rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{e^-} && \times 1
          \end{aligned}
          $$

          $$
          \mathrm{Mg} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{Ag}
          $$

          Es la reacción global de la colección.

      - tipo: calcular
        titulo: El electrodo de plata
        pregunta: |
          b) ¿Cuánto vale el potencial del electrodo de plata?
        respuesta:
          tipo: numero
          valor: '0.682'
          tolerancia: 0.005
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.918'
            mensaje: |
              Has sumado la corrección en vez de restarla, o has puesto
              $Q = [\mathrm{Ag^{+}}]$. Escrita como reducción,
              $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$, el ion
              es reactivo: $Q = 1/[\mathrm{Ag^{+}}] = 100$. Con el ion diluido,
              el potencial baja.
          - valor: '0.80'
            mensaje: |
              Ese es el potencial estándar. La plata está a 10⁻² M, cien veces
              por debajo de la estándar, y eso baja el potencial 0,118 V.
          - valor: '0.741'
            mensaje: |
              Has usado $n = 2$, el de la reacción global. En el electrodo de
              plata cada ion gana un solo electrón: $n = 1$.
        pista: |
          $E = 0{,}80 - 0{,}059\log\dfrac{1}{[\mathrm{Ag^{+}}]}$, con $n = 1$.
        desarrollo: |
          $$
          E = 0{,}80 - 0{,}059\log\frac{1}{10^{-2}} = 0{,}80 - 0{,}118 = 0{,}682\ \text{V}
          $$

          La colección da 0,68 V.

      - tipo: calcular
        titulo: El electrodo de magnesio
        pregunta: |
          ¿Y el del electrodo de magnesio?
        respuesta:
          tipo: numero
          valor: '-2.429'
          tolerancia: 0.005
          formato: el potencial en voltios, con dos cifras decimales y su signo
        distractores:
          - valor: '-2.311'
            mensaje: |
              Has puesto $Q$ del revés. Con
              $\mathrm{Mg^{2+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Mg}$,
              $Q = 1/[\mathrm{Mg^{2+}}] = 100$. El ion está diluido y el
              potencial de reducción baja: se hace más negativo.
          - valor: '-2.37'
            mensaje: |
              Ese es el estándar. Con el Mg²⁺ a 10⁻² M hay corrección:
              $\frac{0{,}059}{2}\log 100 = 0{,}059$ V.
          - valor: '-2.488'
            mensaje: |
              Has usado $n = 1$. El magnesio intercambia dos electrones, así
              que el factor es $0{,}059/2$ y la corrección se queda en 0,059
              V, no en 0,118.
        pista: |
          $E = -2{,}37 - \dfrac{0{,}059}{2}\log\dfrac{1}{[\mathrm{Mg^{2+}}]}$,
          con $n = 2$.
        desarrollo: |
          $$
          E = -2{,}37 - \frac{0{,}059}{2}\log\frac{1}{10^{-2}} = -2{,}37 - 0{,}059 = -2{,}429\ \text{V}
          $$

          La colección da −2,43 V.

      - tipo: calcular
        titulo: La fem de la celda
        pregunta: |
          ¿Cuánto vale la fem de la celda?
        respuesta:
          tipo: numero
          valor: '3.111'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '3.17'
            mensaje: |
              Ese es el potencial estándar, $0{,}80 - (-2{,}37)$. Con las
              concentraciones del enunciado bajan los dos electrodos, la plata
              el doble que el magnesio, así que la celda da algo menos: 3,11
              V.
          - valor: '-1.747'
            mensaje: |
              Has sumado los dos potenciales de electrodo. La fem es la
              diferencia, cátodo menos ánodo: $0{,}682 - (-2{,}429)$.
          - valor: '3.793'
            mensaje: |
              Has multiplicado por 2 el potencial de la plata porque su
              semirreacción va dos veces. El potencial de un electrodo no se
              multiplica: igualar electrones cambia la reacción global, no
              cuánto empuja cada electrodo.
        pista: |
          Cátodo menos ánodo, con los dos potenciales de electrodo.
        desarrollo: |
          $$
          E = E_{\text{cátodo}} - E_{\text{ánodo}} = 0{,}682 - (-2{,}429) = 3{,}111\ \text{V}
          $$

          La colección da 0,68 V, −2,43 V y 3,11 V: coinciden las tres.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La plata tiene el potencial mayor: es el cátodo, con
              $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$. El
              magnesio es el ánodo, con
              $\mathrm{Mg} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{e^-}$.
          - texto: >-
              Reacción global:
              $\mathrm{Mg} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{Ag}$.
          - texto: >-
              Cada electrodo con su Nernst: la plata baja a 0,68 V, con
              $n = 1$, y el magnesio a −2,43 V, con $n = 2$.
          - texto: >-
              La fem es la diferencia, 3,11 V: algo menos que la estándar,
              porque la plata ha bajado el doble que el magnesio.
          - texto: >-
              Como las dos concentraciones son iguales, las dos correcciones
              se anulan y la fem es la estándar, 3,17 V.
            trampa: true
            mensaje: |
              Se anularían si los dos electrodos tuvieran la misma $n$. Aquí
              la plata intercambia un electrón y el magnesio dos, así que la
              misma concentración baja la plata 0,118 V y el magnesio solo
              0,059 V. La diferencia, 0,059 V, es lo que pierde la celda.
        veredicto: |
          Cada electrodo lleva su propia $n$, y por eso dos concentraciones
          iguales no se compensan.

    resolucion: |
      **a · Semirreacciones y reacción global.** La plata tiene el potencial
      de reducción mayor:

      $$
      \begin{aligned}
      \text{cátodo: }& \mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag} \quad (\times 2) \\
      \text{ánodo: }& \mathrm{Mg} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{e^-} \\
      \text{global: }& \mathrm{Mg} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Mg^{2+}} + 2\,\mathrm{Ag}
      \end{aligned}
      $$

      **b · Cada electrodo con su Nernst**, escrito como reducción:

      $$
      E_{\mathrm{Ag}} = 0{,}80 - 0{,}059\log\frac{1}{10^{-2}} = 0{,}682\ \text{V}
      $$

      $$
      E_{\mathrm{Mg}} = -2{,}37 - \frac{0{,}059}{2}\log\frac{1}{10^{-2}} = -2{,}429\ \text{V}
      $$

      $$
      E = 0{,}682 - (-2{,}429) = \boxed{3{,}11\ \text{V}}
      $$

      Las tres cifras coinciden con la colección: 0,68 V, −2,43 V y 3,11 V.

      **Lo que enseña este problema.** Las dos disoluciones están a la
      misma concentración y aun así la fem no es la estándar, porque cada
      electrodo tiene su $n$: la plata, con un electrón, baja 0,118 V; el
      magnesio, con dos, solo 0,059 V. Si calculas la fem por la reacción
      global, sale lo mismo:
      $Q = [\mathrm{Mg^{2+}}]/[\mathrm{Ag^{+}}]^{2} = 100$ y
      $E = 3{,}17 - \frac{0{,}059}{2}\log 100 = 3{,}111$ V.

  - id: colfq10-p3-dos-pilas-de-concentracion
    titulo: Dos pilas de concentración, y el 2 molar que no es 1
    fuente: >-
      Problema 3 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      Calcula la fem de las siguientes celdas de concentración:

      Zn (s) / Zn²⁺ (10⁻⁶ M) // Zn²⁺ (1 M) / Zn (s)

      Ag (s) / Ag⁺ (10⁻⁵ M) // Ag⁺ (2 M) / Ag (s)
    pide: La fem de las dos celdas de concentración.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una celda de concentración los dos electrodos son del mismo par.
          ¿Qué lado es el ánodo?
        opciones:
          - texto: >-
              El diluido, porque allí el metal se disuelve y su concentración
              sube hacia la del otro lado
            correcta: true
            mensaje: |
              Eso es. La pila funciona igualando concentraciones: el lado
              diluido gana iones (oxidación, ánodo) y el concentrado los
              pierde (reducción, cátodo). Por eso estos esquemas ponen el
              diluido a la izquierda.
          - texto: >-
              El concentrado, porque tiene más iones que ceder
            mensaje: |
              En el ánodo los iones no se ceden: se forman. Si el concentrado
              fuera el ánodo se haría aún más concentrado y la diferencia
              crecería, que es lo contrario de lo que hace una pila.
          - texto: >-
              Cualquiera de los dos, porque con $E^{0} = 0$ la pila no tiene
              sentido preferido
            mensaje: |
              $E^{0} = 0$ dice que con todo a 1 M no hay pila. Con
              concentraciones distintas sí la hay, y va en un sentido: el que
              iguala las concentraciones.
          - texto: >-
              El de la izquierda, sea cual sea su concentración
            mensaje: |
              Por convenio el ánodo se escribe a la izquierda, y en estos dos
              esquemas coincide con el diluido. Pero lo que decide cuál es el
              ánodo es la química, no el orden en que lo escribas.

      - tipo: calcular
        titulo: La pila de cinc
        pregunta: |
          ¿Cuánto vale la fem de
          $\mathrm{Zn}\,|\,\mathrm{Zn^{2+}}\,(10^{-6}\ \text{M})\,\|\,\mathrm{Zn^{2+}}\,(1\ \text{M})\,|\,\mathrm{Zn}$?
        respuesta:
          tipo: numero
          valor: '0.177'
          tolerancia: 0.003
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '-0.177'
            mensaje: |
              Has puesto $Q$ del revés. En el ánodo se forma Zn²⁺, así que la
              concentración del lado diluido es la del producto y va arriba:
              $Q = 10^{-6}/1$. Una pila de concentración da siempre potencial
              positivo.
          - valor: '0.354'
            mensaje: |
              Has usado $n = 1$. El cinc intercambia dos electrones, así que el
              factor es $0{,}059/2$.
          - valor: '0'
            mensaje: |
              Ese es $E^{0}$, que en una pila de concentración vale cero. La
              fem sale entera del término de Nernst:
              $E = -\frac{0{,}059}{2}\log 10^{-6}$.
        pista: |
          $E = 0 - \dfrac{0{,}059}{2}\log\dfrac{c_{\text{diluido}}}{c_{\text{concentrado}}}$.
        desarrollo: |
          $$
          E = 0 - \frac{0{,}059}{2}\log\frac{10^{-6}}{1} = 0{,}0295\cdot 6 = 0{,}177\ \text{V}
          $$

          Es la solución de la colección.

      - tipo: calcular
        titulo: La pila de plata
        pregunta: |
          ¿Y la de
          $\mathrm{Ag}\,|\,\mathrm{Ag^{+}}\,(10^{-5}\ \text{M})\,\|\,\mathrm{Ag^{+}}\,(2\ \text{M})\,|\,\mathrm{Ag}$?
        respuesta:
          tipo: numero
          valor: '0.3128'
          tolerancia: 0.003
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '0.295'
            mensaje: |
              Has tomado el lado concentrado como si fuera 1 M, y es 2 M.
              $Q = 10^{-5}/2$, no $10^{-5}$: el logaritmo pasa de −5 a −5,30,
              y la fem de 0,295 a 0,313 V.
          - valor: '0.1564'
            mensaje: |
              Has usado $n = 2$, como en la de cinc. La plata intercambia un
              solo electrón, $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$,
              y el factor es 0,059 entero.
          - valor: '-0.3128'
            mensaje: |
              Has puesto $Q$ del revés: el lado diluido, 10⁻⁵ M, es el ánodo y
              su ion va arriba. La fem de una pila de concentración es
              positiva.
        pista: |
          Aquí $n = 1$, y el lado concentrado es 2 M, no 1 M.
        desarrollo: |
          $$
          E = -0{,}059\log\frac{10^{-5}}{2} = 0{,}059\cdot 5{,}301 = 0{,}313\ \text{V}
          $$

          Es la solución de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En las dos celdas $E^{0} = 0$, porque los dos electrodos son del
              mismo par.
          - texto: >-
              El lado diluido es el ánodo, y $Q$ es la concentración diluida
              entre la concentrada.
          - texto: >-
              Cinc: $n = 2$ y $E = 0{,}0295\cdot 6 = 0{,}177$ V.
          - texto: >-
              Plata: $n = 1$ y $E = 0{,}059\log(2/10^{-5}) = 0{,}313$ V.
          - texto: >-
              La de plata da más porque la plata es un metal más noble que el
              cinc.
            trampa: true
            mensaje: |
              El metal no pinta nada en una pila de concentración: $E^{0}$ es
              cero en las dos. La de plata da más porque su $n$ es 1 —cada
              factor diez de concentración vale 0,059 V, no 0,0295— y eso a
              pesar de que su cociente de concentraciones es menor,
              $2\cdot 10^{5}$ frente a $10^{6}$.
        veredicto: |
          En una pila de concentración solo cuentan el cociente de las dos
          concentraciones y la $n$.

    resolucion: |
      **Dos pilas con el mismo par a cada lado**, así que $E^{0} = 0$ en las
      dos y toda la fem sale de Nernst. El diluido es el ánodo y el
      concentrado, el cátodo:

      $$
      E_{\mathrm{Zn}} = -\frac{0{,}059}{2}\log\frac{10^{-6}}{1} = 0{,}177\ \text{V}
      $$

      $$
      E_{\mathrm{Ag}} = -0{,}059\log\frac{10^{-5}}{2} = 0{,}313\ \text{V}
      $$

      Las dos coinciden con la colección.

      **Dos detalles que deciden el número:**

      - **La $n$.** El cinc intercambia dos electrones y la plata uno. Por
        eso la de plata da más con un cociente de concentraciones menor.
      - **El 2 M.** El lado concentrado de la de plata no está a 1 M: si lo
        tomas como 1, sale 0,295 V en vez de 0,313.

  - id: colfq10-p4-cobre-e-hierro-sin-metal
    titulo: Cobre y hierro sin un solo metal, con platino a los dos lados
    fuente: >-
      Problema 4 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final, con una errata en la reacción global, que escribe Cu²⁺
      en los dos lados; el desarrollo es nuestro. Los potenciales estándar son
      los de la tabla del tema 10.2.
    nivel: practica
    enunciado: |
      Se construye una celda galvánica con dos electrodos de platino
      sumergidos en dos disoluciones a 298 K. La primera consiste en iones de
      Cu²⁺ y Cu⁺, y la segunda en iones Fe³⁺ y Fe²⁺.

      **a)** Escribe la reacción química que tiene lugar y el valor del
      potencial de celda en condiciones estándar.

      **b)** Calcula el valor de la constante de equilibrio.

      **c)** Determina el potencial de la celda si las concentraciones son:
      $[\mathrm{Cu^{2+}}] = 10^{-2}$ M, $[\mathrm{Cu^{+}}] = 5\cdot 10^{-3}$ M,
      $[\mathrm{Fe^{3+}}] = 2{,}5\cdot 10^{-3}$ M,
      $[\mathrm{Fe^{2+}}] = 5{,}5\cdot 10^{-3}$ M.

      **d)** Calcula la variación de energía libre de Gibbs bajo las
      condiciones del apartado c) y explica hacia qué lado evolucionará la
      reacción.
    pide: La reacción y su potencial estándar, la constante de equilibrio, el potencial con esas concentraciones y la energía libre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos pares son Cu²⁺/Cu⁺ y Fe³⁺/Fe²⁺, sin ningún metal. ¿Quién se
          oxida?
        opciones:
          - texto: >-
              El Cu⁺, que pasa a Cu²⁺, porque el par Cu²⁺/Cu⁺ tiene el
              potencial menor, 0,15 V frente a 0,77 V
            correcta: true
            mensaje: |
              Eso es. El par de hierro se reduce (Fe³⁺ → Fe²⁺) y el de cobre se
              oxida. Y cuidado con la tabla: el que hace falta es Cu²⁺/Cu⁺,
              0,15 V, no Cu²⁺/Cu, 0,34 V, porque aquí no hay cobre metálico.
          - texto: >-
              El Cu²⁺, porque es el que tiene más carga
            mensaje: |
              El Cu²⁺ ya está en el más oxidado de los dos estados del cobre:
              no puede oxidarse más aquí. El que se oxida es el Cu⁺, que sube
              a Cu²⁺.
          - texto: >-
              El Fe²⁺, porque el par del hierro tiene el potencial mayor
            mensaje: |
              El par de potencial mayor es el que se reduce: el Fe³⁺ pasa a
              Fe²⁺. El que se oxida es el del par de potencial menor, el
              cobre.
          - texto: >-
              Ninguno, porque con platino en los dos lados no puede haber
              reacción
            mensaje: |
              El platino es inerte, pero los iones no. Hace falta platino
              porque ninguno de los dos pares tiene un sólido; la reacción
              ocurre entre los iones, sobre los electrodos.

      - tipo: calcular
        titulo: El potencial estándar
        pregunta: |
          a) ¿Cuánto vale $E^{0}$ de la celda?
        respuesta:
          tipo: numero
          valor: '0.62'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.92'
            mensaje: |
              Has sumado los dos potenciales. La fem es la diferencia, cátodo
              menos ánodo: $0{,}77 - 0{,}15$.
          - valor: '-0.62'
            mensaje: |
              Has restado al revés. El cátodo es el par de hierro, el de
              potencial mayor, y la fem de una pila que funciona es positiva.
          - valor: '0.43'
            mensaje: |
              Has tomado el par $\mathrm{Cu^{2+}/Cu}$, de 0,34 V. Aquí no hay
              cobre metálico: los dos iones son Cu²⁺ y Cu⁺, y su par es el de
              0,15 V.
        pista: |
          Cátodo $\mathrm{Fe^{3+}/Fe^{2+}}$, 0,77 V; ánodo
          $\mathrm{Cu^{2+}/Cu^{+}}$, 0,15 V.
        desarrollo: |
          $$
          \begin{aligned}
          \text{cátodo: }& \mathrm{Fe^{3+}} + \mathrm{e^-} \rightarrow \mathrm{Fe^{2+}} \\
          \text{ánodo: }& \mathrm{Cu^{+}} \rightarrow \mathrm{Cu^{2+}} + \mathrm{e^-} \\
          \text{global: }& \mathrm{Fe^{3+}} + \mathrm{Cu^{+}} \rightarrow \mathrm{Fe^{2+}} + \mathrm{Cu^{2+}}
          \end{aligned}
          $$

          $$
          E^{0} = 0{,}77 - 0{,}15 = 0{,}62\ \text{V}
          $$

          Es el valor de la colección.

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: |
          b) ¿Cuánto vale $\log K$?
        respuesta:
          tipo: numero
          valor: '10.51'
          tolerancia: 0.05
          formato: el logaritmo decimal de K, con dos cifras decimales
        distractores:
          - valor: '21.02'
            mensaje: |
              Has usado $n = 2$. La reacción intercambia un solo electrón: el
              hierro pasa de +3 a +2 y el cobre de +1 a +2.
          - valor: '-10.51'
            mensaje: |
              Signo cambiado. Con $E^{0}$ positivo la reacción es espontánea y
              $K > 1$, así que su logaritmo es positivo.
          - valor: '24.20'
            mensaje: |
              Ese es $\ln K$, no $\log K$: está bien calculado, pero en la otra
              base. $\log K = \ln K/2{,}303$.
        pista: |
          En el equilibrio $E = 0$, así que
          $\log K = \dfrac{n\,E^{0}}{0{,}059}$, con $n = 1$.
        desarrollo: |
          $$
          \log K = \frac{n\,E^{0}}{0{,}059} = \frac{1\cdot 0{,}62}{0{,}059} = 10{,}51
          \quad\Longrightarrow\quad
          K = 10^{10{,}51} = 3{,}2\cdot 10^{10}
          $$

          Es la solución de la colección, $3{,}22\cdot 10^{10}$. Por el camino
          de la energía libre, $\ln K = nFE^{0}/RT$, sale $3{,}0\cdot 10^{10}$:
          la diferencia viene de que 0,059 es un redondeo de $2{,}303\,RT/F$, y
          en una constante tan grande un redondeo pequeño del exponente se nota
          en la mantisa.

      - tipo: calcular
        titulo: El potencial con esas concentraciones
        pregunta: |
          c) ¿Cuánto vale el potencial de la celda con las concentraciones del
          enunciado?
        respuesta:
          tipo: numero
          valor: '0.582'
          tolerancia: 0.005
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.658'
            mensaje: |
              Has puesto $Q$ del revés, con los reactivos arriba. Los
              productos son Fe²⁺ y Cu²⁺: $Q = 4{,}4$, mayor que 1, y el
              potencial baja un poco respecto del estándar.
          - valor: '0.62'
            mensaje: |
              Ese es el estándar. Con las concentraciones del enunciado
              $Q = 4{,}4$ y hay que corregir, aunque sea poco:
              $0{,}059\log 4{,}4 = 0{,}038$ V.
          - valor: '0.600'
            mensaje: |
              Has metido en $Q$ un solo par: con el hierro solo, $Q = 2{,}2$ y
              sale 0,600 V; con el cobre solo, $Q = 2$ y sale 0,602 V. La
              reacción global lleva los cuatro iones: $Q = 2{,}2\cdot 2 = 4{,}4$.
        pista: |
          $Q = \dfrac{[\mathrm{Fe^{2+}}][\mathrm{Cu^{2+}}]}{[\mathrm{Fe^{3+}}][\mathrm{Cu^{+}}]}$,
          con $n = 1$.
        desarrollo: |
          $$
          Q = \frac{[\mathrm{Fe^{2+}}][\mathrm{Cu^{2+}}]}{[\mathrm{Fe^{3+}}][\mathrm{Cu^{+}}]} = \frac{5{,}5\cdot 10^{-3}\cdot 10^{-2}}{2{,}5\cdot 10^{-3}\cdot 5\cdot 10^{-3}} = 4{,}4
          $$

          $$
          E = 0{,}62 - 0{,}059\log 4{,}4 = 0{,}62 - 0{,}038 = 0{,}582\ \text{V}
          $$

          La colección da 0,58 V.

      - tipo: calcular
        titulo: La energía libre en esas condiciones
        pregunta: |
          d) ¿Cuánto vale $\Delta G$ en las condiciones de c)?
        respuesta:
          tipo: numero
          valor: '-56.16'
          tolerancia: 0.3
          formato: la energía libre en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '56.16'
            mensaje: |
              Signo cambiado. $\Delta G = -nFE$, y con $E$ positivo la energía
              libre sale negativa: la reacción sigue siendo espontánea en
              estas condiciones.
          - valor: '-59.82'
            mensaje: |
              Has usado $E^{0}$, y eso da $\Delta G^{0}$. El apartado pide la
              energía libre en las condiciones de c), así que va con
              $E = 0{,}582$ V.
          - valor: '-112.3'
            mensaje: |
              Has usado $n = 2$. La reacción intercambia un solo electrón.
        pista: |
          $\Delta G = -nFE$, con $n = 1$, $F = 96\,485$ C/mol y el $E$ de c).
        desarrollo: |
          $$
          \Delta G = -nFE = -1\cdot 96\,485\cdot 0{,}582 = -56\,154\ \text{J} = -56{,}2\ \text{kJ}
          $$

          La colección da −55 970 J: sale con $E = 0{,}58$ V y
          $F = 96\,500$ C/mol, redondeos de la misma cuenta que caben en la
          tolerancia. Negativa, así que la reacción evoluciona hacia la
          derecha, hacia Fe²⁺ y Cu²⁺.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El par de hierro (0,77 V) se reduce y el de cobre (0,15 V) se
              oxida:
              $\mathrm{Fe^{3+}} + \mathrm{Cu^{+}} \rightarrow \mathrm{Fe^{2+}} + \mathrm{Cu^{2+}}$.
          - texto: >-
              $E^{0} = 0{,}62$ V y $\log K = 0{,}62/0{,}059 = 10{,}5$, así que
              $K = 3{,}2\cdot 10^{10}$.
          - texto: >-
              Con las concentraciones de c), $Q = 4{,}4$ y $E = 0{,}582$ V.
          - texto: >-
              $\Delta G = -96\,485\cdot 0{,}582$ J, unos −56 kJ: negativa.
          - texto: >-
              Como $Q = 4{,}4$ es muchísimo menor que $K$, la reacción
              evoluciona hacia la derecha, hacia Fe²⁺ y Cu²⁺.
          - texto: >-
              Como $Q = 4{,}4$ es mayor que 1, la reacción evoluciona hacia los
              reactivos.
            trampa: true
            mensaje: |
              La referencia no es 1, es $K$. Una reacción avanza hacia los
              productos mientras $Q < K$, y aquí $Q = 4{,}4$ frente a
              $K = 3{,}2\cdot 10^{10}$: le queda casi todo el camino. Lo dicen
              también $E > 0$ y $\Delta G < 0$.
        veredicto: |
          $E > 0$, $\Delta G < 0$ y $Q < K$ son la misma frase dicha tres
          veces: la reacción va hacia la derecha.

    resolucion: |
      **a · La reacción.** Sin metales en ningún lado, los dos electrodos son
      de platino. El par de hierro tiene el potencial mayor:

      $$
      \mathrm{Fe^{3+}} + \mathrm{Cu^{+}} \rightarrow \mathrm{Fe^{2+}} + \mathrm{Cu^{2+}}
      \qquad
      E^{0} = 0{,}77 - 0{,}15 = 0{,}62\ \text{V}
      $$

      **Una errata de la colección.** Su solución escribe la reacción global
      como «Fe³⁺ + Cu²⁺ → Fe²⁺ + Cu²⁺». El reactivo es Cu⁺: así escrita no
      hay nada que se oxide, y ni siquiera cuadra la carga, +5 a la
      izquierda y +4 a la derecha. El potencial, 0,62 V, sí es el suyo.

      **b · La constante**, con $n = 1$:

      $$
      \log K = \frac{0{,}62}{0{,}059} = 10{,}51
      \quad\Longrightarrow\quad
      K = 3{,}2\cdot 10^{10}
      $$

      **c · Con las concentraciones del enunciado**, $Q = 4{,}4$:

      $$
      E = 0{,}62 - 0{,}059\log 4{,}4 = 0{,}582\ \text{V}
      $$

      **d · La energía libre**, y hacia dónde va:

      $$
      \Delta G = -nFE = -56{,}2\ \text{kJ}
      $$

      Negativa: la reacción avanza hacia la derecha, porque $Q = 4{,}4$ está
      todavía lejísimos de $K = 3{,}2\cdot 10^{10}$.

      La colección da $3{,}22\cdot 10^{10}$, 0,58 V y −55 970 J: coinciden
      con esto salvo redondeos, y el último sale con $F = 96\,500$ C/mol y
      $E = 0{,}58$ V.

  - id: colfq10-p5-plata-y-niquel
    titulo: Plata y níquel, y si se puede construir la pila
    fuente: >-
      Problema 5 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo y el dibujo son nuestros.
    nivel: practica
    enunciado: |
      Los potenciales estándar de reducción de Ag⁺/Ag y Ni²⁺/Ni son 0,80 V y
      -0,25 V, respectivamente. ¿Se podría construir una celda con electrodos
      de plata y níquel sumergidos en las respectivas disoluciones? En caso
      afirmativo, dibújala y responde a las siguientes cuestiones:

      **a)** ¿Qué electrodo actúa como ánodo y cuál como cátodo?

      **b)** ¿Cuál es la fem de la celda en condiciones estándar?
    pide: Si la celda se puede construir, su dibujo, el ánodo, el cátodo y la fem estándar.

    pasos:
      - tipo: reconocer
        pregunta: |
          a) ¿Qué electrodo actúa como ánodo y cuál como cátodo?
        opciones:
          - texto: >-
              Ánodo el níquel y cátodo la plata, porque el níquel tiene el
              potencial de reducción menor
            correcta: true
            mensaje: |
              Eso es, y es la solución de la colección. La respuesta a la
              primera pregunta es sí: dos pares con potenciales distintos
              siempre dan una pila, y el de menor potencial se oxida.
          - texto: >-
              Ánodo la plata, porque su potencial es positivo
            mensaje: |
              El signo no decide, decide la comparación: el de potencial mayor
              se reduce. La plata, con 0,80 V, es el cátodo.
          - texto: >-
              Ninguno: no se puede construir, porque el níquel tiene potencial
              negativo
            mensaje: |
              Un potencial negativo no impide nada: significa que ese metal se
              oxida frente al hidrógeno. Frente a la plata también se oxida, y
              eso es justo lo que hace funcionar la pila.
          - texto: >-
              Depende del puente salino que se use
            mensaje: |
              El puente salino solo cierra el circuito; no decide quién se
              oxida. Lo deciden los potenciales.

      - tipo: calcular
        titulo: La fem estándar
        pregunta: |
          b) ¿Cuánto vale la fem de la celda en condiciones estándar?
        respuesta:
          tipo: numero
          valor: '1.05'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '0.55'
            mensaje: |
              Has sumado los dos potenciales. La fem es la diferencia, cátodo
              menos ánodo: $0{,}80 - (-0{,}25)$.
          - valor: '-1.05'
            mensaje: |
              Has restado al revés. El cátodo es la plata, el de potencial
              mayor, y la fem de una pila que funciona es positiva.
          - valor: '1.85'
            mensaje: |
              Has multiplicado por 2 el potencial de la plata, porque su
              semirreacción va dos veces para igualar los dos electrones del
              níquel. Igualar electrones cambia $n$, no el potencial.
        pista: |
          Cátodo menos ánodo, con los valores tal como vienen.
        desarrollo: |
          $$
          E^{0} = E^{0}_{\text{cátodo}} - E^{0}_{\text{ánodo}} = 0{,}80 - (-0{,}25) = 1{,}05\ \text{V}
          $$

          Es la solución de la colección.

      - tipo: dibujar
        consigna: |
          Dibuja la celda: los dos vasos, el cable con el voltímetro y el
          puente salino. Marca el ánodo y el cátodo con su signo, el sentido
          de los electrones y el de los iones del puente, y escribe debajo el
          esquema abreviado.
        comprueba:
          - punto: El ánodo es la barra de níquel, en una disolución de Ni²⁺, y es el polo negativo.
            porque: |
              Es el de potencial menor y se oxida:
              $\mathrm{Ni} \rightarrow \mathrm{Ni^{2+}} + 2\,\mathrm{e^-}$. La
              barra adelgaza.
          - punto: El cátodo es la barra de plata, en una disolución de Ag⁺, y es el polo positivo.
            porque: |
              Se reduce, $\mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag}$,
              y sobre la barra se deposita plata. Aquí no hace falta platino:
              los dos pares tienen su metal.
          - punto: Los electrones van por el cable, del níquel a la plata.
            porque: |
              Salen de donde algo se oxida y llegan a donde algo se reduce,
              nunca por la disolución.
          - punto: En el puente salino, los aniones van hacia el níquel y los cationes hacia la plata.
            porque: |
              En el ánodo aparece Ni²⁺ y hay que compensarlo con aniones; en
              el cátodo desaparece Ag⁺ y llegan cationes.
          - punto: |
              El esquema es
              $\mathrm{Ni}\,\big|\,\mathrm{Ni^{2+}}\,\big\|\,\mathrm{Ag^{+}}\,\big|\,\mathrm{Ag}$.
            porque: |
              Del ánodo al cátodo, con doble barra en el puente salino.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos pares tienen potenciales distintos, así que la celda se
              puede construir.
          - texto: >-
              El níquel (−0,25 V) se oxida: es el ánodo, el polo negativo.
          - texto: >-
              La plata (0,80 V) se reduce: es el cátodo, el polo positivo.
          - texto: >-
              Reacción global:
              $\mathrm{Ni} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Ni^{2+}} + 2\,\mathrm{Ag}$,
              con $E^{0} = 1{,}05$ V.
          - texto: >-
              Hace falta un electrodo de platino, porque el níquel no conduce
              lo bastante.
            trampa: true
            mensaje: |
              El platino solo hace falta cuando el par no tiene sólido, como
              Fe³⁺/Fe²⁺ o Sn⁴⁺/Sn²⁺. Aquí los dos pares tienen su metal, y el
              propio metal hace de electrodo: el níquel conduce perfectamente.
        veredicto: |
          Dos pares con potenciales distintos siempre forman pila; el de menor
          potencial es el ánodo.

    resolucion: |
      **¿Se puede construir?** Sí. Dos pares con potenciales de reducción
      distintos siempre forman una pila: el de menor potencial se oxida y el
      de mayor potencial se reduce.

      **a · Ánodo y cátodo.** El níquel (−0,25 V) es el ánodo y la plata
      (0,80 V), el cátodo:

      $$
      \begin{aligned}
      \text{ánodo: }& \mathrm{Ni} \rightarrow \mathrm{Ni^{2+}} + 2\,\mathrm{e^-} \\
      \text{cátodo: }& \mathrm{Ag^{+}} + \mathrm{e^-} \rightarrow \mathrm{Ag} \quad (\times 2) \\
      \text{global: }& \mathrm{Ni} + 2\,\mathrm{Ag^{+}} \rightarrow \mathrm{Ni^{2+}} + 2\,\mathrm{Ag}
      \end{aligned}
      $$

      **b · La fem estándar:**

      $$
      E^{0} = 0{,}80 - (-0{,}25) = \boxed{1{,}05\ \text{V}}
      $$

      Las dos coinciden con la colección.

      **El dibujo.** Dos vasos: la barra de níquel en una disolución de
      Ni²⁺ (ánodo, polo negativo) y la de plata en una de Ag⁺ (cátodo, polo
      positivo). Los electrones van por el cable del níquel a la plata, y
      en el puente salino los aniones van hacia el níquel y los cationes
      hacia la plata. En esquema:

      $$
      \mathrm{Ni}\,\big|\,\mathrm{Ni^{2+}}\,\big\|\,\mathrm{Ag^{+}}\,\big|\,\mathrm{Ag}
      $$

  - id: colfq10-p6-la-misma-pila-y-su-constante
    titulo: La pila del estaño y el sodio otra vez, con su constante y un giro
    fuente: >-
      Problema 6 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro. Los potenciales estándar son
      los de la tabla del tema 10.2.
    nivel: practica
    enunciado: |
      Una celda galvánica está constituida por: una semicelda con un alambre
      de platino sumergido en una disolución de Sn²⁺ 1 M y Sn⁴⁺ 10⁻³ M, y
      otra semicelda con una barra de sodio metálico sumergida en una
      disolución de Na⁺ 10⁻¹ M.

      **a)** Escribe las reacciones de cada semicelda y la reacción global.

      **b)** Calcula el potencial de celda y la constante de equilibrio del
      proceso, que tiene lugar a 25 °C.

      **c)** Si la semicelda que ha actuado como ánodo se hubiera conectado a
      una semicelda de sodio metálico sumergida en una disolución de Na⁺
      10⁻³ M, ¿cuál habría sido el potencial de celda?
    pide: Las reacciones, el potencial de celda, la constante de equilibrio y el potencial de la pila de sodio contra sodio.

    pasos:
      - tipo: reconocer
        pregunta: |
          b) Para la constante de equilibrio, ¿qué potencial se usa?
        opciones:
          - texto: >-
              $E^{0} = 2{,}84$ V, porque la constante es de la reacción y no
              depende de las concentraciones de este montaje
            correcta: true
            mensaje: |
              Eso es. $K$ se calcula con el potencial estándar,
              $\log K = nE^{0}/0{,}059$. El 2,81 V de este montaje dice cuánto
              le falta a esta pila para llegar al equilibrio, no dónde está el
              equilibrio.
          - texto: >-
              $E = 2{,}81$ V, que es el potencial real de la pila
            mensaje: |
              El potencial real depende de las concentraciones del momento, y
              $K$ no. Con 2,81 V saldría un $\log K$ una unidad más bajo: una
              constante diez veces menor.
          - texto: >-
              Cualquiera de los dos, porque dan lo mismo
            mensaje: |
              Se parecen en voltios, 2,81 frente a 2,84, pero en el exponente
              de $K$ esa diferencia vale un factor diez.
          - texto: >-
              $E = 0$, porque en el equilibrio el potencial se anula
            mensaje: |
              En el equilibrio $E = 0$, sí, y justamente de ahí sale la
              fórmula: $0 = E^{0} - \frac{0{,}059}{n}\log K$. Lo que queda
              dentro es $E^{0}$.

      - tipo: calcular
        titulo: El potencial de la celda
        pregunta: |
          b) ¿Cuánto vale el potencial de la celda?
        respuesta:
          tipo: numero
          valor: '2.8105'
          tolerancia: 0.01
          formato: el potencial en voltios, con dos cifras decimales
        distractores:
          - valor: '2.84'
            mensaje: |
              Ese es el potencial estándar, $0{,}13 - (-2{,}71)$, sin las
              correcciones de concentración. Con las del enunciado el estaño
              baja a 0,04 V y el sodio a −2,77 V: la celda da 2,81 V.
          - valor: '-2.7275'
            mensaje: |
              Has sumado los dos potenciales de reducción,
              $0{,}0415 + (-2{,}769)$. La fem es la diferencia, cátodo menos
              ánodo.
          - valor: '-2.8105'
            mensaje: |
              Has restado al revés, sodio menos estaño. El cátodo es el
              estaño, el de potencial mayor, y la fem sale positiva.
        pista: |
          Es la pila del problema resuelto 3: cada electrodo con su Nernst, y
          cátodo menos ánodo.
        desarrollo: |
          $$
          E_{\mathrm{Sn}} = 0{,}13 - \frac{0{,}059}{2}\log\frac{1}{10^{-3}} = 0{,}0415\ \text{V}
          \qquad
          E_{\mathrm{Na}} = -2{,}71 - 0{,}059\log\frac{1}{0{,}1} = -2{,}769\ \text{V}
          $$

          $$
          E = 0{,}0415 - (-2{,}769) = 2{,}8105\ \text{V}
          $$

          La colección da 2,81 V.

      - tipo: calcular
        titulo: La constante de equilibrio
        pregunta: |
          b) ¿Cuánto vale $\log K$?
        respuesta:
          tipo: numero
          valor: '96.27'
          tolerancia: 0.35
          formato: el logaritmo decimal de K, con dos cifras decimales
        distractores:
          - valor: '48.14'
            mensaje: |
              Has usado $n = 1$, el de la semirreacción del sodio. La reacción
              global intercambia dos electrones: el estaño gana dos y hay dos
              sodios que ceden uno.
          - valor: '95.27'
            mensaje: |
              Has usado $E = 2{,}81$ V, el potencial de este montaje. $K$ va
              con $E^{0} = 2{,}84$ V, y en el exponente los 0,03 V de
              diferencia valen una unidad entera.
          - valor: '-96.27'
            mensaje: |
              Signo cambiado. Con un $E^{0}$ tan positivo, $K$ es enorme y su
              logaritmo, positivo.
        pista: |
          $\log K = \dfrac{n\,E^{0}}{0{,}059}$, con $n = 2$ y
          $E^{0} = 0{,}13 - (-2{,}71)$.
        desarrollo: |
          $$
          \log K = \frac{n\,E^{0}}{0{,}059} = \frac{2\cdot 2{,}84}{0{,}059} = 96{,}27
          \quad\Longrightarrow\quad
          K = 10^{96{,}27} = 1{,}86\cdot 10^{96}
          $$

          La colección da $1{,}87\cdot 10^{96}$: la misma cuenta. Con
          $\ln K = nFE^{0}/RT$ sale $1{,}0\cdot 10^{96}$, y con 0,0592,
          $8{,}8\cdot 10^{95}$. Con un exponente de 96, cualquier redondeo de
          la constante mueve la mantisa, y por eso conviene comparar
          logaritmos.

      - tipo: calcular
        titulo: La pila de sodio contra sodio
        pregunta: |
          c) ¿Cuánto vale el potencial de la pila formada por la semicelda de
          sodio de 10⁻¹ M y otra de sodio de 10⁻³ M?
        respuesta:
          tipo: numero
          valor: '0.118'
          tolerancia: 0.003
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '-0.118'
            mensaje: |
              Has puesto $Q$ del revés. Ahora el ánodo es el lado más diluido,
              el de 10⁻³ M, y su ion va arriba: $Q = 10^{-3}/10^{-1}$.
          - valor: '0.059'
            mensaje: |
              Has usado $n = 2$. Es una pila de sodio contra sodio,
              $\mathrm{Na^{+}} + \mathrm{e^-} \rightarrow \mathrm{Na}$: un
              electrón.
          - valor: '0.177'
            mensaje: |
              Has tomado el otro lado como 1 M. La semicelda que actuaba de
              ánodo tiene el Na⁺ a 10⁻¹ M, así que el cociente es 100, no
              1000.
        pista: |
          Es una pila de concentración: $E^{0} = 0$ y el lado diluido es el
          ánodo.
        desarrollo: |
          Sodio a los dos lados, así que $E^{0} = 0$. El lado de 10⁻³ M es el
          nuevo ánodo, y la semicelda de 10⁻¹ M, que antes era el ánodo,
          ahora hace de cátodo:

          $$
          E = 0 - 0{,}059\log\frac{10^{-3}}{10^{-1}} = 0{,}059\cdot 2 = 0{,}118\ \text{V}
          $$

          Es la solución de la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las semirreacciones son las del problema resuelto 3: el Sn⁴⁺ se
              reduce sobre el platino y el sodio se oxida.
          - texto: >-
              Reacción global:
              $\mathrm{Sn^{4+}} + 2\,\mathrm{Na} \rightarrow \mathrm{Sn^{2+}} + 2\,\mathrm{Na^{+}}$,
              con $E = 2{,}81$ V.
          - texto: >-
              La constante va con $E^{0} = 2{,}84$ V:
              $\log K = 2\cdot 2{,}84/0{,}059 = 96{,}3$.
          - texto: >-
              En c) el sodio de 10⁻¹ M se enfrenta a otro de 10⁻³ M: es una
              pila de concentración, y el diluido es el ánodo.
          - texto: >-
              Su potencial es $0{,}059\log 100 = 0{,}118$ V.
          - texto: >-
              En c) la semicelda de 10⁻¹ M sigue siendo el ánodo, porque ya lo
              era en la pila anterior.
            trampa: true
            mensaje: |
              Ser ánodo no es una propiedad de la semicelda: depende de con
              quién se conecte. Frente al estaño se oxidaba; frente a un sodio
              más diluido es la que tiene más concentración, y en una pila de
              concentración el concentrado es el cátodo.
        veredicto: |
          El papel de cada semicelda depende de con quién se conecte. Y la
          constante va siempre con $E^{0}$.

    resolucion: |
      **a · Las reacciones** son las del problema resuelto 3:

      $$
      \begin{aligned}
      \text{cátodo: }& \mathrm{Sn^{4+}} + 2\,\mathrm{e^-} \rightarrow \mathrm{Sn^{2+}} \\
      \text{ánodo: }& \mathrm{Na} \rightarrow \mathrm{Na^{+}} + \mathrm{e^-} \quad (\times 2) \\
      \text{global: }& \mathrm{Sn^{4+}} + 2\,\mathrm{Na} \rightarrow \mathrm{Sn^{2+}} + 2\,\mathrm{Na^{+}}
      \end{aligned}
      $$

      **b · El potencial y la constante.** Con cada electrodo corregido por
      su concentración, $E = 0{,}0415 - (-2{,}769) = 2{,}81$ V. La constante
      no depende del montaje y va con $E^{0}$:

      $$
      \log K = \frac{2\cdot 2{,}84}{0{,}059} = 96{,}27
      \quad\Longrightarrow\quad
      K = 1{,}87\cdot 10^{96}
      $$

      **c · Sodio contra sodio.** Es una pila de concentración: $E^{0} = 0$,
      el lado de 10⁻³ M es el ánodo y el de 10⁻¹ M, que antes era el ánodo,
      pasa a cátodo.

      $$
      E = -0{,}059\log\frac{10^{-3}}{10^{-1}} = \boxed{0{,}118\ \text{V}}
      $$

      Coincide con la colección en las tres cifras: 2,81 V,
      $1{,}87\cdot 10^{96}$ y 0,118 V.

  - id: colfq10-p7-una-reaccion-con-letras
    titulo: Una reacción con letras, una constante de 100 y hacia dónde va
    fuente: >-
      Problema 7 · Problemas propuestos del tema 10, Electroquímica y
      reacciones redox · Fundamentos Químicos de la Ingeniería (25975),
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La colección publica la
      respuesta final; el desarrollo es nuestro.
    nivel: practica
    enunciado: |
      La siguiente reacción en disolución acuosa:
      $2\,\mathrm{A^{4+}} + \mathrm{B^{2+}} \leftrightarrow 2\,\mathrm{A^{3+}} + \mathrm{B^{4+}}$
      posee una constante de equilibrio K = 100 a 25 °C.

      **a)** Describe los procesos que tienen lugar en cada electrodo y
      calcula el potencial de celda estándar.

      **b)** Calcula la variación de energía libre de Gibbs y explica hacia
      qué lado evolucionará la reacción a 25 °C para alcanzar el equilibrio,
      si las concentraciones iniciales son:
      $[\mathrm{B^{4+}}] = [\mathrm{A^{3+}}] = 1$ M,
      $[\mathrm{B^{2+}}] = [\mathrm{A^{4+}}] = 0{,}01$ M.
    pide: Los procesos de cada electrodo, el potencial estándar, la energía libre en esas condiciones y el sentido de la reacción.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos electrones intercambia la reacción tal como está escrita?
        opciones:
          - texto: >-
              Dos: el B²⁺ cede dos al pasar a B⁴⁺, y los dos A⁴⁺ ganan uno cada
              uno
            correcta: true
            mensaje: |
              Eso es: $n = 2$. Las cargas bastan para saberlo, sin conocer
              qué elementos son A y B.
          - texto: >-
              Cuatro: dos del B y dos de los A
            mensaje: |
              Son los mismos dos electrones contados dos veces: los que cede
              el B son los que ganan los A. $n$ es el número intercambiado,
              no la suma de los de cada semirreacción.
          - texto: >-
              Uno, porque cada A⁴⁺ gana uno
            mensaje: |
              Uno por cada A, pero la reacción lleva dos. El B cede dos, y $n$
              es lo que se intercambia en la reacción tal como está escrita.
          - texto: >-
              No se puede saber sin conocer los elementos A y B
            mensaje: |
              No hace falta: las cargas bastan. A pasa de 4+ a 3+ y B de 2+ a
              4+, y eso fija los electrones sin saber qué elementos son.

      - tipo: calcular
        titulo: El potencial estándar
        pregunta: |
          a) ¿Cuánto vale $E^{0}$ de la celda?
        respuesta:
          tipo: numero
          valor: '0.059'
          tolerancia: 0.002
          formato: el potencial en voltios, con tres cifras decimales
        distractores:
          - valor: '0.118'
            mensaje: |
              Has usado $n = 1$. La reacción intercambia dos electrones, así
              que $E^{0} = \frac{0{,}059}{2}\log 100$.
          - valor: '0.0295'
            mensaje: |
              Has usado $n = 4$, sumando los electrones de las dos
              semirreacciones. Son los mismos dos contados dos veces: $n = 2$.
          - valor: '-0.059'
            mensaje: |
              Signo cambiado. Con $K = 100 > 1$ la reacción está desplazada
              hacia los productos, y eso es $E^{0} > 0$.
        pista: |
          En el equilibrio $E = 0$, así que
          $E^{0} = \dfrac{0{,}059}{n}\log K$.
        desarrollo: |
          $$
          E^{0} = \frac{0{,}059}{n}\log K = \frac{0{,}059}{2}\log 100 = \frac{0{,}059}{2}\cdot 2 = 0{,}059\ \text{V}
          $$

          Es la solución de la colección. En la pila estándar, el cátodo es el
          par A⁴⁺/A³⁺ —$\mathrm{A^{4+}} + \mathrm{e^-} \rightarrow \mathrm{A^{3+}}$,
          dos veces— y el ánodo, el par B⁴⁺/B²⁺:
          $\mathrm{B^{2+}} \rightarrow \mathrm{B^{4+}} + 2\,\mathrm{e^-}$.

      - tipo: calcular
        titulo: La energía libre con esas concentraciones
        pregunta: |
          b) ¿Cuánto vale $\Delta G$ con las concentraciones del enunciado?
        respuesta:
          tipo: numero
          valor: '22.77'
          tolerancia: 0.1
          formato: la energía libre en kJ, con una cifra decimal y su signo
        distractores:
          - valor: '-22.77'
            mensaje: |
              Signo cambiado. En estas condiciones el potencial de la reacción
              tal como está escrita es negativo, $E = -0{,}118$ V, así que
              $\Delta G = -nFE$ sale positiva.
          - valor: '-11.42'
            mensaje: |
              Esa es $\Delta G^{0} = -RT\ln K$, la de condiciones estándar. El
              apartado pide la de estas concentraciones, que llevan
              $Q = 10^{6}$: $\Delta G = \Delta G^{0} + RT\ln Q$.
          - valor: '-45.66'
            mensaje: |
              Has puesto $Q$ del revés, con los reactivos arriba. Con los
              productos arriba,
              $Q = \frac{1^{2}\cdot 1}{0{,}01^{2}\cdot 0{,}01} = 10^{6}$.
        pista: |
          Calcula $Q$ con los productos arriba y los coeficientes como
          exponentes, después $E$ con Nernst y, por último,
          $\Delta G = -nFE$.
        desarrollo: |
          $$
          Q = \frac{[\mathrm{A^{3+}}]^{2}[\mathrm{B^{4+}}]}{[\mathrm{A^{4+}}]^{2}[\mathrm{B^{2+}}]} = \frac{1^{2}\cdot 1}{0{,}01^{2}\cdot 0{,}01} = 10^{6}
          $$

          $$
          E = E^{0} - \frac{0{,}059}{2}\log Q = 0{,}059 - 0{,}0295\cdot 6 = -0{,}118\ \text{V}
          $$

          $$
          \Delta G = -nFE = -2\cdot 96\,485\cdot(-0{,}118) = 22\,770\ \text{J} = 22{,}8\ \text{kJ}
          $$

          La colección da 22 774 J, que sale con $F = 96\,500$ C/mol. Por el
          otro camino, $\Delta G = RT\ln(Q/K)$, sale 22,8 kJ también.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El B²⁺ cede dos electrones y pasa a B⁴⁺; los dos A⁴⁺ ganan uno
              cada uno: $n = 2$.
          - texto: >-
              En la pila estándar, el A⁴⁺ se reduce en el cátodo y el B²⁺ se
              oxida en el ánodo.
          - texto: >-
              $E^{0} = \frac{0{,}059}{2}\log 100 = 0{,}059$ V.
          - texto: >-
              Con esas concentraciones $Q = 10^{6}$, mucho mayor que
              $K = 100$.
          - texto: >-
              $\Delta G = +22{,}8$ kJ: tal como está escrita no es espontánea,
              y la reacción evoluciona hacia la izquierda, hacia A⁴⁺ y B²⁺.
          - texto: >-
              Como $K = 100$ es mayor que 1, la reacción avanza hacia la
              derecha con cualquier concentración inicial.
            trampa: true
            mensaje: |
              $K > 1$ dice hacia dónde está desplazado el equilibrio, no hacia
              dónde va una mezcla concreta. Eso lo decide comparar $Q$ con
              $K$: aquí $Q = 10^{6}$ es diez mil veces mayor que $K$, así que
              sobra producto y la reacción va hacia la izquierda.
        veredicto: |
          El signo de $E^{0}$ lo pone $K$; el de $E$ y el de $\Delta G$, la
          comparación entre $Q$ y $K$.

    resolucion: |
      **a · Los electrodos y el potencial estándar.** El B²⁺ cede dos
      electrones y los dos A⁴⁺ ganan uno cada uno, así que $n = 2$. En la
      pila estándar:

      $$
      \begin{aligned}
      \text{cátodo: }& \mathrm{A^{4+}} + \mathrm{e^-} \rightarrow \mathrm{A^{3+}} \quad (\times 2) \\
      \text{ánodo: }& \mathrm{B^{2+}} \rightarrow \mathrm{B^{4+}} + 2\,\mathrm{e^-}
      \end{aligned}
      $$

      $$
      E^{0} = \frac{0{,}059}{2}\log 100 = \boxed{0{,}059\ \text{V}}
      $$

      **b · Con esas concentraciones.**

      $$
      Q = \frac{1^{2}\cdot 1}{0{,}01^{2}\cdot 0{,}01} = 10^{6}
      \qquad
      E = 0{,}059 - \frac{0{,}059}{2}\log 10^{6} = -0{,}118\ \text{V}
      $$

      $$
      \Delta G = -nFE = \boxed{+22{,}8\ \text{kJ}}
      $$

      Positiva: tal como está escrita, la reacción no es espontánea. Hay
      muchísimo más producto del que admite el equilibrio —$Q = 10^{6}$
      frente a $K = 100$—, así que evoluciona **hacia la izquierda**, hacia
      A⁴⁺ y B²⁺. En esas condiciones los papeles de la pila se invierten: el
      A³⁺ se oxida y el B⁴⁺ se reduce.

      La colección da 0,059 V y 22 774 J; lo segundo sale con
      $F = 96\,500$ C/mol, y con 96 485 son 22 770 J. Por el camino de
      $RT\ln(Q/K)$ salen unos 22 830 J: la diferencia es la de tomar 0,059
      por $2{,}303\,RT/F$.
