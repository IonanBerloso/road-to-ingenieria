  - id: la-recta-desplazada-en-cinco-puntos
    titulo: Una recta desplazada, y cinco puntos donde decidir
    fuente: Ejercicio 11.2 (b) · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(t)=t+1$ con $0<t<2$ y $T=2$, y sea $S(t)$ su serie de Fourier.
      Calcular $S(0)$, $S(1)$, $S(2)$, $S(3{,}5)$ y $S(4{,}5)$.
    pide: Los cinco valores de la serie.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer antes que nada con un punto como $t=4{,}5$?
        opciones:
          - texto: >-
              Reducirlo al periodo: $4{,}5 = 2\cdot2 + 0{,}5$, así que
              equivale a $t=0{,}5$
            correcta: true
            mensaje: |
              Eso es. $S$ es periódica de periodo $2$, así que solo hay que
              saber qué pasa dentro de un periodo. Restar múltiplos del periodo
              es el primer gesto de todo este tipo de ejercicios.
          - texto: >-
              Sustituirlo en $f(t)=t+1$, que da $5{,}5$
            mensaje: |
              La fórmula $t+1$ solo vale en $(0,2)$. Fuera, la función es su
              repetición periódica, y $4{,}5$ hay que traerlo primero a ese
              intervalo.
          - texto: >-
              Nada: $S$ y $f$ coinciden siempre
            mensaje: |
              Coinciden donde $f$ es continua, pero no en los saltos — y además
              $f$ solo está dada en $(0,2)$: fuera hay que usar la
              periodicidad.

      - tipo: calcular
        titulo: El valor en el salto
        pregunta: |
          ¿Cuánto vale $S(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el límite por la **derecha**, $f(0^{+})$. En un salto la
              serie da la semisuma de los dos límites, no uno de ellos.
          - valor: '3'
            mensaje: |
              $3$ es el límite por la **izquierda**, $f(2^{-})$. Falta
              promediarlo con el de la derecha.
        pista: |
          Los límites laterales en $t=0$ son $3$ por la izquierda y $1$ por
          la derecha.
        desarrollo: |
          $$
          S(0) = \frac{f(0^{-})+f(0^{+})}{2} = \frac{3+1}{2} = 2
          $$

      - tipo: calcular
        titulo: El valor en un punto lejano
        pregunta: |
          ¿Cuánto vale $S(4{,}5)$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.006
          formato: con un decimal
        distractores:
          - valor: '5.5'
            mensaje: |
              $5{,}5$ sale de sustituir $4{,}5$ en $t+1$ sin reducir al
              periodo. La fórmula solo vale en $(0,2)$.
          - valor: '2.5'
            mensaje: |
              $2{,}5$ es $S(3{,}5)$, que reduce a $t=1{,}5$. El $4{,}5$ reduce
              a $0{,}5$.
        pista: |
          $4{,}5-4 = 0{,}5$, y ahí la función es continua.
        desarrollo: |
          $$
          4{,}5 = 2\cdot 2 + 0{,}5
          \quad\Longrightarrow\quad
          S(4{,}5) = f(0{,}5) = 0{,}5+1 = 1{,}5
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La función periódica salta en cada múltiplo de $2$: de $3$ por la
              izquierda a $1$ por la derecha.
          - texto: >-
              En esos puntos —$t=0$ y $t=2$— la serie vale la semisuma, $2$.
          - texto: >-
              En los puntos interiores la serie vale la función, previa
              reducción al periodo: $S(1)=2$, $S(3{,}5)=2{,}5$,
              $S(4{,}5)=1{,}5$.
          - texto: >-
              Y como $S(0)=S(1)=2$, la serie es constante en $[0,1]$.
            trampa: true
            mensaje: |
              Es una coincidencia: $S(0)=2$ por ser la semisuma de un salto, y
              $S(1)=2$ porque $f(1)=1+1=2$. Entre medias la serie recorre todos
              los valores de $1$ a $2$. Dos valores iguales no hacen una
              función constante.
        veredicto: |
          Dos reglas y nada más: **reducir al periodo** y, si el punto cae en
          un salto, **promediar los laterales**. Todo lo demás es aritmética.
    resolucion: |
      **Los cinco valores.**

      | $t$ | reduce a | ¿salto? | $S(t)$ |
      |---|---|---|---|
      | $0$ | $0$ | sí | $2$ |
      | $1$ | $1$ | no | $2$ |
      | $2$ | $0$ | sí | $2$ |
      | $3{,}5$ | $1{,}5$ | no | $2{,}5$ |
      | $4{,}5$ | $0{,}5$ | no | $1{,}5$ |

      ### 1 · Cómo es la función

      En $(0,2)$ sube de $1$ a $3$. Y entonces empieza otro periodo y vuelve a
      $1$: **salto de $2$ unidades** en cada múltiplo del periodo, o sea en
      $t=0,\,2,\,4,\,\dots$ Es un diente de sierra levantado una unidad.

      ### 2 · La regla de Dirichlet

      $$
      S(t) = \begin{cases}
      f(t) & \text{si }f\text{ es continua en }t\\[4pt]
      \dfrac{f(t^{-})+f(t^{+})}{2} & \text{si hay salto}
      \end{cases}
      $$

      En los saltos: $\tfrac{3+1}{2}=2$. Y esa es la respuesta para $t=0$ y
      $t=2$.

      ### 3 · Los tres puntos interiores

      $$
      S(1) = f(1) = 2
      $$

      $$
      S(3{,}5): \quad 3{,}5-2 = 1{,}5 \;\Longrightarrow\; f(1{,}5) = 2{,}5
      $$

      $$
      S(4{,}5): \quad 4{,}5-4 = 0{,}5 \;\Longrightarrow\; f(0{,}5) = 1{,}5
      $$

      ### 4 · Una comprobación gratis

      La media de $f$ en un periodo es

      $$
      \frac{1}{2}\int_{0}^{2}\left(t+1\right)dt = \frac{1}{2}\cdot 4 = 2
      $$

      y coincide con el valor en el salto. **No es casualidad**: en un diente
      de sierra el salto ocurre justo donde la recta pasaría por su valor
      medio, así que la semisuma de los laterales es la media. En otras
      funciones no tiene por qué pasar.

      **Lo que hay que llevarse.** Reducir al periodo antes de sustituir, y
      distinguir los puntos de salto de los demás. Los dos errores clásicos son
      meter $4{,}5$ en la fórmula y dar $f(0^{+})$ en vez de la semisuma.

