ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 11. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-paridad-antes-de-integrar
    titulo: La paridad, que ahorra la mitad del trabajo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Decidir, sin calcular ninguna integral, qué coeficientes de Fourier se
      anulan para cada una de estas funciones periódicas de periodo $2\pi$:

      a) $f(t) = t^{2}$ en $(-\pi,\pi)$
      b) $g(t) = t^{3}$ en $(-\pi,\pi)$
    pide: Qué coeficientes son nulos en cada caso, y por qué.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se comprueba si una función es par o impar?
        opciones:
          - texto: Sustituyendo t por −t y comparando con la función original
            correcta: true
            mensaje: |
              Sí. Si sale la misma, es par; si sale la opuesta, es impar; y si no
              sale ninguna de las dos, no tiene simetría y hay que calcular todos
              los coeficientes.
          - texto: Mirando si la gráfica pasa por el origen
            mensaje: |
              Pasar por el origen es necesario para ser impar, pero no
              suficiente: $f(t)=t^{2}$ pasa por el origen y es par.
          - texto: Viendo si el exponente es par o impar
            mensaje: |
              Funciona para potencias sueltas, pero no en general: $\cos t$ es par
              y no tiene exponente, y $t^{2}+t$ no es ni par ni impar.
      - tipo: calcular
        titulo: El valor de la función reflejada
        pregunta: |
          Para $g(t)=t^{3}$, ¿cuánto vale $g(-2)$?
        respuesta:
          tipo: numero
          valor: '-8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              Un cubo conserva el signo: $(-2)^{3} = -8$, no $+8$. Es un cuadrado
              el que lo pierde.
          - valor: '-6'
            mensaje: |
              $-6$ sería $3\cdot(-2)$. Elevar al cubo es multiplicar por sí mismo
              tres veces: $(-2)(-2)(-2) = -8$.
        pista: |
          $(-2)^3 = (-2)(-2)(-2)$. Tres factores negativos.
        desarrollo: |
          $$
          g(-2) = (-2)^{3} = -8 = -g(2)
          $$

          Como $g(-t) = -g(t)$ para todo $t$, la función es **impar**.
      - tipo: justificar
        pregunta: |
          Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: 'a) $f(-t)=(-t)^{2}=t^{2}=f(t)$, luego $f$ es **par**.'
          - texto: 'Por tanto todos los $b_n$ valen 0 y la serie es de cosenos.'
          - texto: 'b) $g(-t)=(-t)^{3}=-t^{3}=-g(t)$, luego $g$ es **impar**.'
          - texto: 'Por tanto todos los $a_n$ valen 0, incluido $a_0$, y la serie es de senos.'
          - texto: 'Como las dos son potencias, las dos tienen los mismos coeficientes nulos.'
            trampa: true
            mensaje: |
              Son casos opuestos precisamente por el exponente: el cuadrado es par
              y el cubo impar. Una da serie de cosenos y la otra de senos, y no
              comparten ni un coeficiente nulo.
    resolucion: |
      **Mirar la paridad es el primer movimiento del tema**, y cuesta una
      sustitución.

      **a) $f(t)=t^{2}$.**

      $$
      f(-t) = (-t)^{2} = t^{2} = f(t)
      \qquad\Longrightarrow\qquad
      \textbf{par}
      $$

      El producto de una función par por un seno (impar) es impar, y una función
      impar integrada sobre un intervalo simétrico da cero. Así que

      $$
      b_n = 0 \text{ para todo } n
      $$

      y la serie es **solo de cosenos**.

      **b) $g(t)=t^{3}$.**

      $$
      g(-t) = (-t)^{3} = -t^{3} = -g(t)
      \qquad\Longrightarrow\qquad
      \textbf{impar}
      $$

      Ahora se anulan los otros:

      $$
      a_n = 0 \text{ para todo } n,
      \qquad\text{y también } a_0 = 0
      $$

      y la serie es **solo de senos**.

      > **Lo que se ahorra.** En cada caso desaparece la mitad de las integrales,
      > y no son integrales cortas: llevan integración por partes dos veces. Y
      > escribir «como $f$ es par, $b_n=0$ para todo $n$» **es una respuesta
      > completa**: no hay que demostrarlo cada vez.

  - id: ej-dirichlet-en-el-salto
    titulo: A qué converge la serie en un salto
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea $f(t)$ la función periódica de periodo 2 definida por $f(t) = -1$ si
      $-1<t<0$ y $f(t)=1$ si $0<t<1$. Calcular el valor de su serie de Fourier
      $S(t)$ en $t=0$ y en $t=0{,}5$.
    pide: Los valores S(0) y S(0,5).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice el teorema de Dirichlet en un punto donde la función salta?
        opciones:
          - texto: Que la serie converge a la media de los dos límites laterales
            correcta: true
            mensaje: |
              Exacto. La serie no elige un lado: se queda exactamente en medio,
              y eso pasa aunque la función esté definida en ese punto con otro
              valor.
          - texto: Que la serie converge al valor de la función en ese punto
            mensaje: |
              Solo donde $f$ es continua. En un salto la serie hace otra cosa, y
              es justo lo que el examen pregunta.
          - texto: Que la serie no converge en ese punto
            mensaje: |
              Sí converge — ese es el contenido del teorema. Lo que no hace es
              converger a uno de los dos valores laterales.
      - tipo: calcular
        titulo: El valor en el salto
        pregunta: |
          En $t=0$ la función pasa de $-1$ a $1$. ¿Cuánto vale $S(0)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el límite por la derecha. La serie no toma ese lado: toma la
              media de los dos, $(-1+1)/2 = 0$.
          - valor: '-1'
            mensaje: |
              $-1$ es el límite por la izquierda, el otro lado del salto. La
              serie se queda en el punto medio.
        pista: |
          La media de −1 y 1.
        desarrollo: |
          $$
          S(0) = \frac{f(0^-)+f(0^+)}{2} = \frac{-1+1}{2} = 0
          $$

          Y fíjate en que la función **ni siquiera está definida** en $t=0$ según
          el enunciado. Da igual: la serie sí vale algo ahí, y vale 0.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'En $t=0$ hay un salto: por la izquierda $-1$, por la derecha $1$.'
          - texto: 'Dirichlet dice que $S(0)$ es la media, o sea 0.'
          - texto: 'En $t=0{,}5$ la función es continua y vale 1.'
          - texto: 'Luego $S(0{,}5) = 1$, porque en los puntos de continuidad serie y función coinciden.'
          - texto: 'Como $f$ no está definida en $t=0$, la serie tampoco lo está.'
            trampa: true
            mensaje: |
              La serie está definida en todos los puntos: es una suma de senos y
              cosenos, que existen siempre. Que la función tenga un hueco no le
              impide a la serie tomar un valor ahí — y ese valor es la media de
              los laterales.
    resolucion: |
      **Dos puntos, dos situaciones distintas**, y el ejercicio existe para que
      se vea la diferencia.

      **En $t=0$ hay un salto.** Los límites laterales son

      $$
      f(0^-) = -1,
      \qquad
      f(0^+) = 1
      $$

      y el teorema de Dirichlet da

      $$
      S(0) = \frac{-1+1}{2} = 0
      $$

      **En $t=0{,}5$ la función es continua**, y vale 1. Ahí serie y función
      coinciden:

      $$
      S(0{,}5) = 1
      $$

      **La observación que puntúa.** La función **no está definida** en $t=0$: el
      enunciado la define en $(-1,0)$ y en $(0,1)$, dejando el punto fuera. Y sin
      embargo la serie sí vale algo ahí. La serie de Fourier es una suma de senos
      y cosenos, funciones continuas todas: existe en todos los puntos aunque la
      función original tenga huecos.

      > Esta es exactamente la función «onda cuadrada», y es el ejemplo de
      > libro del tema. Su serie es
      > $S(t) = \frac{4}{\pi}\left(\text{sen}\,\pi t + \frac{1}{3}\text{sen}\,3\pi t + \cdots\right)$,
      > y en $t=0$ todos los senos valen 0: la serie da 0 término a término, sin
      > necesidad de Dirichlet. **Las dos vías coinciden**, que es la
      > comprobación.

  - id: ej-ampliar-y-reducir
    titulo: Ampliar media función, y reducir un argumento enorme
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea $f(t)=t$ definida solo en $(0,\pi)$. Se construye su **ampliación
      impar y periódica** $F(t)$, de periodo $2\pi$.

      a) ¿Cuánto vale $F$ justo a la izquierda de $\pi$, y justo a la derecha?

      b) ¿A qué punto del periodo básico se reduce $t=41\pi$?
    pide: Los dos límites laterales en pi, y el punto reducido.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace la ampliación **impar** con el trozo que da el enunciado?
        opciones:
          - texto: >-
              Lo refleja respecto del origen: lo copia al otro lado cambiándole
              el signo, $F(-t)=-F(t)$
            correcta: true
            mensaje: |
              Eso es. Y de ahí sale que todos los $a_n$ se anulan y la serie es
              solo de senos. La par haría lo mismo **sin** cambiar el signo.
          - texto: Lo refleja como un espejo, $F(-t)=F(t)$
            mensaje: |
              Esa es la ampliación **par**. La impar además cambia el signo, y
              esa diferencia decide si la serie sale de senos o de cosenos.
          - texto: Lo repite tal cual a la izquierda del origen
            mensaje: |
              Repetir tal cual sin reflejar es lo que hace la periodicidad, y
              es un paso posterior. La ampliación decide **primero** qué pasa en
              $(-\pi,0)$, y ahí no se copia: se refleja.

      - tipo: calcular
        titulo: El límite por la derecha en pi
        pregunta: |
          ¿Cuánto vale $F(\pi^{+})$?
        respuesta:
          tipo: numero
          valor: '-3.1415927'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $+\pi$ es el límite por la **izquierda**: viniendo de dentro del
              intervalo, $F$ sube hasta $\pi$. Justo pasado $\pi$ empieza el
              periodo siguiente, que arranca donde arrancaba el anterior.
          - valor: '0'
            mensaje: |
              $0$ es la media de los dos, o sea el valor al que converge la
              **serie**. La pregunta es por la función, y la función salta.
          - valor: '1.5707963'
            mensaje: |
              $\pi/2$ es el punto medio del intervalo, no un valor de $F$ en
              $\pi$.
        pista: |
          Pasado $\pi$ empieza otro periodo, idéntico al que va de $-\pi$ a
          $\pi$. Así que $F(\pi^{+})=F(-\pi^{+})$.
        desarrollo: |
          Por periodicidad, lo que hay justo a la derecha de $\pi$ es lo mismo
          que hay justo a la derecha de $-\pi$:

          $$
          F(\pi^{+})=F(-\pi^{+})=-\pi\approx-3{,}1416
          $$

          Y por la izquierda, $F(\pi^{-})=\pi$. Hay un **salto de altura
          $2\pi$**, y ahí la serie valdrá $0$.

      - tipo: calcular
        titulo: Reducir el argumento
        pregunta: |
          $t=41\pi$ se reduce a $k\pi$ dentro de $(-\pi,\pi]$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '41'
            mensaje: |
              $41$ es el argumento sin reducir. Hay que restarle múltiplos
              enteros del periodo, que es $2\pi$, hasta caer dentro.
          - valor: '0'
            mensaje: |
              $0$ saldría si $41$ fuera par. Es impar: $41\pi=40\pi+\pi$, y
              $40\pi$ son veinte periodos completos.
          - valor: '20.5'
            mensaje: |
              $20{,}5$ es el número de **periodos** que hay en $41\pi$, no el
              punto reducido. Lo que sobra de esa división es medio periodo, o
              sea $\pi$.
        pista: |
          El periodo es $2\pi$, así que resta $2\pi$ tantas veces como puedas.
        desarrollo: |
          $$
          41\pi-20\cdot 2\pi=41\pi-40\pi=\pi
          $$

          Y $\pi$ es justo el salto del apartado anterior, así que
          $S(41\pi)=0$ mientras que $F(41\pi)$ depende de cómo se defina la
          función en ese punto — que es la razón de que el examen pida siempre
          los dos valores juntos.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La ampliación impar copia $f$ en $(-\pi,0)$ con el signo cambiado,
              así que $F(t)=t$ en todo $(-\pi,\pi)$.
          - texto: >-
              Después se repite ese periodo indefinidamente, y eso crea un salto
              en cada múltiplo impar de $\pi$: se llega a $+\pi$ y se sale de
              $-\pi$.
          - texto: >-
              $41\pi$ es un múltiplo **impar** de $\pi$, así que al reducir cae
              en $\pi$, que es uno de esos saltos, y allí $S=0$.
          - texto: >-
              Como $F$ es impar, la serie tiene solo senos, y por eso $S$ se
              anula en todos los múltiplos de $\pi$ sin necesidad de mirar los
              saltos.
            trampa: true
            mensaje: |
              La conclusión es cierta aquí y el razonamiento no. Que la serie
              sea de senos hace que $S(0)=0$ y $S(k\pi)=0$ **para esta
              función**, sí — pero solo porque $\operatorname{sen}(nk\pi)=0$.
              En una ampliación impar con un salto **dentro** del intervalo,
              por ejemplo en $\pi/2$, el mismo argumento no diría nada. La
              regla que siempre vale es la de Dirichlet: mirar los dos límites
              laterales.
    resolucion: |
      **a) Los dos lados de $\pi$.** Dentro del intervalo $F(t)=t$, así que
      acercándose a $\pi$ por la izquierda la función sube hasta $\pi$:

      $$
      F(\pi^{-})=\pi
      $$

      A la derecha de $\pi$ empieza el periodo siguiente, que es una copia del
      que va de $-\pi$ a $\pi$. Y ese periodo arranca en $-\pi$:

      $$
      F(\pi^{+})=-\pi
      $$

      Hay un **salto de altura $2\pi$**, y la serie de Fourier no elige lado:

      $$
      S(\pi)=\frac{\pi+(-\pi)}{2}=0
      $$

      **b) Reducir $41\pi$.** El periodo es $2\pi$, así que se le restan
      múltiplos enteros de $2\pi$ hasta caer dentro:

      $$
      41\pi-20\cdot2\pi=\pi
      $$

      Cae exactamente en el salto. Con lo cual $S(41\pi)=0$, y $F(41\pi)$ vale
      lo que se haya decidido definir ahí — nada, si el enunciado no lo dice.

      **Por qué esto es el escalón de entrada del tema.** Los dos apartados son
      las dos preguntas que el examen hace siempre, y ninguna exige calcular una
      integral. Ampliar es una decisión sobre el dibujo; reducir es una
      división entera. Si estas dos las tienes, lo que queda del ejercicio de
      Fourier es integrar por partes — que es largo, pero no tiene sorpresas.

      **El truco de los múltiplos, para no equivocarse nunca.** Con periodo
      $2\pi$, un múltiplo **par** de $\pi$ se reduce a $0$ y uno **impar** se
      reduce a $\pi$. Solo hay que mirar la paridad del número, y eso convierte
      $S(2024\pi)$ o $S(41\pi)$ en preguntas de un segundo.

