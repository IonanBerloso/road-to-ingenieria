      <figcaption>Las tres tienen simetrías distintas, y eso decide qué coeficientes hay que calcular: la primera es impar y solo tiene senos; la tercera es par y solo tiene cosenos; la segunda no es ni una cosa ni otra, así que hay que calcularlo todo.</figcaption>
