  - id: tres-espectros-discretos
    titulo: Tres espectros discretos, y las frecuencias que se repiten
    fuente: Ejercicio 11.1 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Trazar el espectro discreto de las siguientes funciones:

      (a)

      $$
      y(t) = 5 - 3\cos(3t) + 5\operatorname{sen}(3t) - \cos(12t)
      - 3\cos(18t) + 5\cos(6t) - 4\cos(15t)
      $$

      (b)

      $$
      y(t) = 3 + 3\cos(4t) + 2\operatorname{sen}(4t) - 2\cos(8t)
      - 3\cos(8t) - 3\cos(20t) - 4\operatorname{sen}(20t)
      $$

      (c)

      $$
      y(t) = 5\cos(23t) + 2\operatorname{sen}(46t) - 2\cos(46t)
      - 3\cos(138t) - 5\operatorname{sen}(138t) - 4\operatorname{sen}(92t)
      $$
    pide: La amplitud de cada frecuencia presente.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (a) aparecen $-3\cos 3t$ y $5\operatorname{sen}3t$. ¿Cuántas rayas
          dibujan en el espectro?
        opciones:
          - texto: >-
              Una sola, de altura $\sqrt{3^{2}+5^{2}}=\sqrt{34}$
            correcta: true
            mensaje: |
              Eso es. Un seno y un coseno de la misma frecuencia son **un solo
              armónico** escrito en dos piezas:
              $a\cos\omega t + b\operatorname{sen}\omega t = A\cos\left(\omega t-\varphi\right)$ con
              $A=\sqrt{a^{2}+b^{2}}$.
          - texto: >-
              Dos, una de altura $3$ y otra de altura $5$
            mensaje: |
              El espectro se dibuja **por frecuencias**, no por sumandos. Los
              dos términos tienen la misma frecuencia $3$, así que se combinan
              en una sola raya.
          - texto: >-
              Una, de altura $2$
            mensaje: |
              $2$ sería $5-3$. Las amplitudes no se restan: se componen con el
              teorema de Pitágoras, porque seno y coseno están desfasados
              $90^\circ$.

      - tipo: calcular
        titulo: La raya de frecuencia 3 en el apartado (a)
        pregunta: |
          ¿Qué altura tiene la raya de $\omega=3$ en el espectro de (a)?
        respuesta:
          tipo: numero
          valor: '5.8310'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $5-3$. Las dos componentes están en cuadratura: se
              combinan como catetos de un triángulo rectángulo, no restando.
          - valor: '8'
            mensaje: |
              $8$ es $5+3$. Sumar las amplitudes sobrevalora el armónico: el
              máximo de $-3\cos 3t+5\operatorname{sen}3t$ es $\sqrt{34}$, no
              $8$.
        pista: |
          $\sqrt{(-3)^{2}+5^{2}}$, y $\sqrt{34}\approx5{,}83$.
        desarrollo: |
          $$
          A_3 = \sqrt{(-3)^{2}+5^{2}} = \sqrt{34} \approx 5{,}8310
          $$

      - tipo: calcular
        titulo: Cuántas rayas tiene el espectro de (a)
        pregunta: |
          ¿Cuántas rayas distintas dibuja el espectro del apartado (a),
          contando la de frecuencia cero?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '7'
            mensaje: |
              $7$ es el número de sumandos. Dos de ellos —el coseno y el seno
              de frecuencia $3$— comparten frecuencia y dan una sola raya.
          - valor: '5'
            mensaje: |
              Faltaría contar el término constante $5$, que es la raya de
              frecuencia $0$ y en un espectro sí se dibuja.
        pista: |
          Las frecuencias presentes son $0$, $3$, $6$, $12$, $15$ y $18$.
        desarrollo: |
          | $\omega$ | amplitud |
          |---|---|
          | $0$ | $5$ |
          | $3$ | $\sqrt{34}\approx5{,}83$ |
          | $6$ | $5$ |
          | $12$ | $1$ |
          | $15$ | $4$ |
          | $18$ | $3$ |

          Seis rayas.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Primero se agrupan los sumandos por frecuencia, sumando los que
              comparten el mismo argumento.
          - texto: >-
              Después, cada grupo $a\cos\omega t+b\operatorname{sen}\omega t$
              se reduce a una amplitud $\sqrt{a^{2}+b^{2}}$.
          - texto: >-
              El término independiente es la raya de $\omega=0$, y su altura es
              el propio valor.
          - texto: >-
              Y los signos de $a$ y $b$ se conservan en la altura de la raya,
              que por eso puede salir negativa.
            trampa: true
            mensaje: |
              Una amplitud nunca es negativa: la raíz cuadrada se encarga. El
              signo se traslada a la **fase**, que es la otra mitad de la
              información y se dibuja en un segundo gráfico, el espectro de
              fases.
        veredicto: |
          Trazar un espectro son dos pasos mecánicos: agrupar por frecuencia y
          componer cada grupo con Pitágoras. Lo que se pierde por el camino es
          la fase, y por eso el espectro de amplitudes no basta para
          reconstruir la señal.
    resolucion: |
      **Los tres espectros.**

      ### (a)

      | $\omega$ | $a$ | $b$ | amplitud |
      |---|---|---|---|
      | $0$ | $5$ | — | $5$ |
      | $3$ | $-3$ | $5$ | $\sqrt{34}\approx5{,}831$ |
      | $6$ | $5$ | $0$ | $5$ |
      | $12$ | $-1$ | $0$ | $1$ |
      | $15$ | $-4$ | $0$ | $4$ |
      | $18$ | $-3$ | $0$ | $3$ |

      ### (b)

      Aquí hay dos cosenos de frecuencia $8$ que **se suman antes**:
      $-2\cos 8t-3\cos 8t = -5\cos 8t$.

      | $\omega$ | $a$ | $b$ | amplitud |
      |---|---|---|---|
      | $0$ | $3$ | — | $3$ |
      | $4$ | $3$ | $2$ | $\sqrt{13}\approx3{,}606$ |
      | $8$ | $-5$ | $0$ | $5$ |
      | $20$ | $-3$ | $-4$ | $5$ |

      ### (c)

      | $\omega$ | $a$ | $b$ | amplitud |
      |---|---|---|---|
      | $23$ | $5$ | $0$ | $5$ |
      | $46$ | $-2$ | $2$ | $2\sqrt2\approx2{,}828$ |
      | $92$ | $0$ | $-4$ | $4$ |
      | $138$ | $-3$ | $-5$ | $\sqrt{34}\approx5{,}831$ |

      Sin término constante: el espectro empieza en $\omega=23$.

      ### Lo que enseña el (c)

      Las frecuencias son $23$, $46=2\cdot23$, $92=4\cdot23$ y
      $138=6\cdot23$. Todas son múltiplos de $23$, así que la señal **es
      periódica** con frecuencia fundamental $23$ y periodo
      $\tfrac{2\pi}{23}$. Los armónicos presentes son el primero, el segundo,
      el cuarto y el sexto: faltan el tercero y el quinto, y eso es
      información sobre la señal, no una omisión.

      ### Cómo se dibuja

      Eje horizontal $\omega$, y sobre cada frecuencia presente una raya
      vertical de altura igual a la amplitud. Nada entre raya y raya: eso es lo
      que significa **discreto**, y es la diferencia con el espectro continuo
      de una señal no periódica.

      **Lo que hay que llevarse.** Agrupar por frecuencia **antes** de medir,
      y componer con $\sqrt{a^{2}+b^{2}}$. El error que más se repite es
      dibujar una raya por sumando, que confunde la escritura con la señal.

  - id: la-recta-desplazada-en-cinco-puntos
    titulo: Una recta desplazada, y cinco puntos donde decidir
    fuente: Ejercicio 11.2 (b) · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(t)=t+1$ con $0<t<2$ y $T=2$, y sea $S(t)$ su serie de Fourier.
      Calcular $S(0)$, $S(1)$, $S(2)$, $S(3{,}5)$ y $S(4{,}5)$.
    pide: Los cinco valores de la serie.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer antes que nada con un punto como $t=4{,}5$?
        opciones:
          - texto: >-
              Reducirlo al periodo: $4{,}5 = 2\cdot2 + 0{,}5$, así que
              equivale a $t=0{,}5$
            correcta: true
            mensaje: |
              Eso es. $S$ es periódica de periodo $2$, así que solo hay que
              saber qué pasa dentro de un periodo. Restar múltiplos del periodo
              es el primer gesto de todo este tipo de ejercicios.
          - texto: >-
              Sustituirlo en $f(t)=t+1$, que da $5{,}5$
            mensaje: |
              La fórmula $t+1$ solo vale en $(0,2)$. Fuera, la función es su
              repetición periódica, y $4{,}5$ hay que traerlo primero a ese
              intervalo.
          - texto: >-
              Nada: $S$ y $f$ coinciden siempre
            mensaje: |
              Coinciden donde $f$ es continua, pero no en los saltos — y además
              $f$ solo está dada en $(0,2)$: fuera hay que usar la
              periodicidad.

      - tipo: calcular
        titulo: El valor en el salto
        pregunta: |
          ¿Cuánto vale $S(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el límite por la **derecha**, $f(0^{+})$. En un salto la
              serie da la semisuma de los dos límites, no uno de ellos.
          - valor: '3'
            mensaje: |
              $3$ es el límite por la **izquierda**, $f(2^{-})$. Falta
              promediarlo con el de la derecha.
        pista: |
          Los límites laterales en $t=0$ son $3$ por la izquierda y $1$ por
          la derecha.
        desarrollo: |
          $$
          S(0) = \frac{f(0^{-})+f(0^{+})}{2} = \frac{3+1}{2} = 2
          $$

      - tipo: calcular
        titulo: El valor en un punto lejano
        pregunta: |
          ¿Cuánto vale $S(4{,}5)$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.006
          formato: con un decimal
        distractores:
          - valor: '5.5'
            mensaje: |
              $5{,}5$ sale de sustituir $4{,}5$ en $t+1$ sin reducir al
              periodo. La fórmula solo vale en $(0,2)$.
          - valor: '2.5'
            mensaje: |
              $2{,}5$ es $S(3{,}5)$, que reduce a $t=1{,}5$. El $4{,}5$ reduce
              a $0{,}5$.
        pista: |
          $4{,}5-4 = 0{,}5$, y ahí la función es continua.
        desarrollo: |
          $$
          4{,}5 = 2\cdot 2 + 0{,}5
          \quad\Longrightarrow\quad
          S(4{,}5) = f(0{,}5) = 0{,}5+1 = 1{,}5
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La función periódica salta en cada múltiplo de $2$: de $3$ por la
              izquierda a $1$ por la derecha.
          - texto: >-
              En esos puntos —$t=0$ y $t=2$— la serie vale la semisuma, $2$.
          - texto: >-
              En los puntos interiores la serie vale la función, previa
              reducción al periodo: $S(1)=2$, $S(3{,}5)=2{,}5$,
              $S(4{,}5)=1{,}5$.
          - texto: >-
              Y como $S(0)=S(1)=2$, la serie es constante en $[0,1]$.
            trampa: true
            mensaje: |
              Es una coincidencia: $S(0)=2$ por ser la semisuma de un salto, y
              $S(1)=2$ porque $f(1)=1+1=2$. Entre medias la serie recorre todos
              los valores de $1$ a $2$. Dos valores iguales no hacen una
              función constante.
        veredicto: |
          Dos reglas y nada más: **reducir al periodo** y, si el punto cae en
          un salto, **promediar los laterales**. Todo lo demás es aritmética.
    resolucion: |
      **Los cinco valores.**

      | $t$ | reduce a | ¿salto? | $S(t)$ |
      |---|---|---|---|
      | $0$ | $0$ | sí | $2$ |
      | $1$ | $1$ | no | $2$ |
      | $2$ | $0$ | sí | $2$ |
      | $3{,}5$ | $1{,}5$ | no | $2{,}5$ |
      | $4{,}5$ | $0{,}5$ | no | $1{,}5$ |

      ### 1 · Cómo es la función

      En $(0,2)$ sube de $1$ a $3$. Y entonces empieza otro periodo y vuelve a
      $1$: **salto de $2$ unidades** en cada múltiplo del periodo, o sea en
      $t=0,\,2,\,4,\,\dots$ Es un diente de sierra levantado una unidad.

      ### 2 · La regla de Dirichlet

      $$
      S(t) = \begin{cases}
      f(t) & \text{si }f\text{ es continua en }t\\[4pt]
      \dfrac{f(t^{-})+f(t^{+})}{2} & \text{si hay salto}
      \end{cases}
      $$

      En los saltos: $\tfrac{3+1}{2}=2$. Y esa es la respuesta para $t=0$ y
      $t=2$.

      ### 3 · Los tres puntos interiores

      $$
      S(1) = f(1) = 2
      $$

      $$
      S(3{,}5): \quad 3{,}5-2 = 1{,}5 \;\Longrightarrow\; f(1{,}5) = 2{,}5
      $$

      $$
      S(4{,}5): \quad 4{,}5-4 = 0{,}5 \;\Longrightarrow\; f(0{,}5) = 1{,}5
      $$

      ### 4 · Una comprobación gratis

      La media de $f$ en un periodo es

      $$
      \frac{1}{2}\int_{0}^{2}\left(t+1\right)dt = \frac{1}{2}\cdot 4 = 2
      $$

      y coincide con el valor en el salto. **No es casualidad**: en un diente
      de sierra el salto ocurre justo donde la recta pasaría por su valor
      medio, así que la semisuma de los laterales es la media. En otras
      funciones no tiene por qué pasar.

      **Lo que hay que llevarse.** Reducir al periodo antes de sustituir, y
      distinguir los puntos de salto de los demás. Los dos errores clásicos son
      meter $4{,}5$ en la fórmula y dar $f(0^{+})$ en vez de la semisuma.

  - id: nueve-funciones-par-impar-o-ninguna
    titulo: Nueve funciones, y la tercera casilla que casi nadie marca
    fuente: Ejercicio 11.3 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar si las siguientes funciones son pares o impares:

      (a) $f(t)=1-t^{2}$ &nbsp;&nbsp; (d) $f(t)=2t^{3}+3t^{2}-5t+1$
      &nbsp;&nbsp; (g) $f(t)=e^{t}-e^{-t}$

      (b) $f(t)=1-t$ &nbsp;&nbsp; (e) $f(t)=e^{t}$ &nbsp;&nbsp;
      (h) $f(t)=\operatorname{sen}t\cos t$

      (c) $f(t)=2t^{3}-4t$ &nbsp;&nbsp; (f) $f(t)=e^{t}+e^{-t}$
      &nbsp;&nbsp; (i) $f(t)=\operatorname{sen}t+\cos t$
    pide: La clasificación de las nueve.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué pasa con $f(t)=1-t$?
        opciones:
          - texto: >-
              Ni par ni impar: $f(-t)=1+t$, que no es $f(t)$ ni $-f(t)$
            correcta: true
            mensaje: |
              Eso es, y es la casilla que más se olvida. «Par o impar» es una
              pregunta con **tres** respuestas posibles, y la tercera es la más
              frecuente en la práctica.
          - texto: >-
              Impar, porque lleva una $t$ de grado uno
            mensaje: |
              El $1$ lo estropea: $f(-t)=1+t$ y $-f(t)=t-1$. No coinciden. Una
              suma de un par y un impar no es ninguna de las dos cosas.
          - texto: >-
              Par, porque es una recta
            mensaje: |
              Una recta no vertical solo es par si es horizontal. $1-t$ tiene
              pendiente, así que no es simétrica respecto del eje $OY$.

      - tipo: calcular
        titulo: Cuántas son pares
        pregunta: |
          De las nueve, ¿cuántas son **pares**?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Tres serían si se contara alguna de las «ninguna» como par.
              Repasa la (b) y la (i): las dos mezclan una parte par con una
              impar.
          - valor: '1'
            mensaje: |
              Hay dos: la (a), que es un polinomio de exponentes pares, y la
              (f), que es $2\cosh t$.
        pista: |
          Son la (a) y la (f). Las demás, o son impares, o no son ninguna de
          las dos cosas.
        desarrollo: |
          **(a)** $1-t^{2}$: todos los exponentes son pares ✓

          **(f)** $e^{t}+e^{-t}=2\cosh t$: al cambiar $t$ por $-t$ los dos
          sumandos se intercambian y la suma no cambia ✓

      - tipo: calcular
        titulo: Cuántas son impares
        pregunta: |
          De las nueve, ¿cuántas son **impares**?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Falta alguna. La (h) es $\tfrac12\operatorname{sen}2t$, y un seno
              es impar aunque venga disfrazado de producto.
          - valor: '4'
            mensaje: |
              Cuatro serían si se contara la (i), pero
              $\operatorname{sen}t+\cos t$ mezcla un impar con un par: no es
              ninguna de las dos cosas.
        pista: |
          Son la (c), la (g) y la (h).
        desarrollo: |
          **(c)** $2t^{3}-4t$: exponentes impares ✓

          **(g)** $e^{t}-e^{-t}=2\operatorname{senh}t$ ✓

          **(h)** $\operatorname{sen}t\cos t=\tfrac12\operatorname{sen}2t$ ✓ —
          y también por la regla «impar por par es impar».

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un polinomio es par si solo tiene exponentes pares e impar si
              solo tiene exponentes impares. La (a) y la (c) están en ese caso.
          - texto: >-
              Toda función se descompone en parte par más parte impar:
              $f=\tfrac{f(t)+f(-t)}{2}+\tfrac{f(t)-f(-t)}{2}$.
          - texto: >-
              Por eso $e^{t}$ no es par ni impar, pero $e^{t}+e^{-t}$ y
              $e^{t}-e^{-t}$ —sus dos partes— sí lo son.
          - texto: >-
              Y por eso una función que no es par ni impar no admite serie de
              Fourier.
            trampa: true
            mensaje: |
              La admite perfectamente: lo que pasa es que tendrá **las dos**
              familias de coeficientes. La paridad es un atajo para ahorrar
              integrales, no un requisito. Todas las funciones de este boletín
              tienen serie.
        veredicto: |
          La paridad se comprueba siempre igual: sustituir $t$ por $-t$ y
          comparar. Y merece la pena porque anula de golpe la mitad de los
          coeficientes — pero su ausencia no impide nada.
    resolucion: |
      **Las nueve.**

      | | función | clase | por qué |
      |---|---|---|---|
      | (a) | $1-t^{2}$ | **par** | exponentes $0$ y $2$ |
      | (b) | $1-t$ | ninguna | $f(-t)=1+t$ |
      | (c) | $2t^{3}-4t$ | **impar** | exponentes $3$ y $1$ |
      | (d) | $2t^{3}+3t^{2}-5t+1$ | ninguna | mezcla pares e impares |
      | (e) | $e^{t}$ | ninguna | $e^{-t}\ne\pm e^{t}$ |
      | (f) | $e^{t}+e^{-t}$ | **par** | es $2\cosh t$ |
      | (g) | $e^{t}-e^{-t}$ | **impar** | es $2\operatorname{senh}t$ |
      | (h) | $\operatorname{sen}t\cos t$ | **impar** | es $\tfrac12\operatorname{sen}2t$ |
      | (i) | $\operatorname{sen}t+\cos t$ | ninguna | impar más par |

      Dos pares, tres impares y **cuatro que no son ninguna de las dos
      cosas** — que es la mayoría, y por eso la tercera casilla importa.

      ### 1 · La comprobación, siempre la misma

      $$
      f\text{ par} \iff f(-t)=f(t)
      \qquad
      f\text{ impar} \iff f(-t)=-f(t)
      $$

      ### 2 · Las reglas que ahorran trabajo

      - **Polinomios**: par si todos los exponentes son pares, impar si todos
        son impares, y ninguna si se mezclan. El término independiente cuenta
        como exponente $0$, o sea par — por eso la (d) no es impar.
      - **Productos**: par·par = par, impar·impar = par, par·impar = impar.
        Con eso la (h) sale sin transformar nada.
      - **Sumas**: solo conservan la clase si los dos sumandos la comparten.
        La (i) suma un impar y un par, y por eso no es ninguna.

      ### 3 · Por qué la (e) da las otras dos

      $$
      e^{t} = \underbrace{\frac{e^{t}+e^{-t}}{2}}_{\text{par}}
      + \underbrace{\frac{e^{t}-e^{-t}}{2}}_{\text{impar}}
      = \cosh t + \operatorname{senh}t
      $$

      Los apartados (e), (f) y (g) son el mismo ejemplo mirado tres veces: una
      función sin paridad y sus dos mitades.

      ### 4 · Para qué sirve

      | si $f$ es | se anulan | quedan |
      |---|---|---|
      | par | todos los $b_n$ | serie de cosenos |
      | impar | $a_0$ y todos los $a_n$ | serie de senos |
      | ninguna | nada | las dos familias |

      **Lo que hay que llevarse.** Comprobar la paridad cuesta una línea y
      puede ahorrar la mitad de las integrales. Pero hay que estar dispuesto a
      marcar la tercera casilla: cuatro de estas nueve no son ni lo uno ni lo
      otro.

  - id: tres-series-del-complementario
    titulo: Tres series más, una por cada tipo de simetría
    fuente: Ejercicio 11.4 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la serie de Fourier $S(t)$ de las siguientes funciones
      periódicas:

      (a) $f(t)=\begin{cases}-1 & -1<t<0\\ 1 & 0<t<1\end{cases}$,
      &nbsp; $T=2$

      (b) $f(t)=\begin{cases}0 & -3<t<0\\ 2 & 0<t<3\end{cases}$,
      &nbsp; $T=6$

      (c) $f(t)=1+\lvert t\rvert$, &nbsp; $-1<t<1$, &nbsp; $T=2$
    pide: Las tres series de Fourier.
    pasos:
      - tipo: reconocer
        pregunta: |
          La (b) es la (a) escalada y desplazada. ¿Qué relación hay entre sus
          series?
        opciones:
          - texto: >-
              La (b) vale $1+f_{a}$ con el periodo estirado: mismo $b_n$, más
              un término constante $1$
            correcta: true
            mensaje: |
              Exacto. $f_b(t) = 1 + f_a\!\left(\tfrac{t}{3}\right)$, así que
              los senos son idénticos —solo cambia el argumento— y aparece la
              media $1$. Verlo ahorra las integrales de la (b) enteras.
          - texto: >-
              No hay ninguna relación: son funciones distintas
            mensaje: |
              Las dos son ondas cuadradas de salto $2$. La diferencia es dónde
              está el eje de simetría y cuánto dura el periodo, y las dos cosas
              se traducen en cambios mecánicos de la serie.
          - texto: >-
              La (b) tiene los mismos coeficientes exactamente
            mensaje: |
              Los $b_n$ coinciden, pero la (b) tiene además el término
              constante $1$ que la (a) no tiene, porque su media no es cero.

      - tipo: calcular
        titulo: El primer armónico de la (a)
        pregunta: |
          ¿Cuánto vale $b_1$ en el apartado (a)?
        respuesta:
          tipo: numero
          valor: '1.2732'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '0.6366'
            mensaje: |
              $\tfrac{2}{\pi}$ es la mitad. El factor $1-\cos n\pi$ vale $2$
              para $n=1$, así que el resultado es $\tfrac4\pi$.
          - valor: '2.5465'
            mensaje: |
              $\tfrac8\pi$ es el doble. La fórmula de la onda cuadrada de
              amplitud $A$ es $\tfrac{4A}{n\pi}$, y aquí $A=1$.
        pista: |
          Onda cuadrada de amplitud $1$: $b_n=\tfrac{4}{n\pi}$ para $n$ impar.
        desarrollo: |
          $$
          b_n = \frac{2\left(1-\cos n\pi\right)}{n\pi}
          \qquad
          b_1 = \frac{4}{\pi} \approx 1{,}2732
          $$

      - tipo: calcular
        titulo: El primer armónico de la (c)
        pregunta: |
          ¿Cuánto vale $a_1$ en el apartado (c)?
        respuesta:
          tipo: numero
          valor: '-0.4053'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '0.4053'
            mensaje: |
              El signo. $\cos n\pi - 1$ vale $-2$ para $n$ impar, así que el
              coeficiente es negativo.
          - valor: '-0.2026'
            mensaje: |
              $-\tfrac{2}{\pi^{2}}$ es la mitad: el paréntesis
              $\cos\pi-1$ vale $-2$, no $-1$.
        pista: |
          $a_n=\dfrac{2\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}$, y
          $\tfrac{4}{\pi^{2}}\approx0{,}41$.
        desarrollo: |
          $$
          a_1 = \frac{2\left(-1-1\right)}{\pi^{2}} = -\frac{4}{\pi^{2}}
          \approx -0{,}4053
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La (a) es impar: solo senos, y sin término constante porque su
              media es cero.
          - texto: >-
              La (b) tiene media $1$; restándosela queda una impar, así que
              solo hay término constante y senos.
          - texto: >-
              La (c) es par —es $1+\lvert t\rvert$— y por tanto solo tiene
              término constante y cosenos.
          - texto: >-
              Y las tres caen como $\tfrac1n$, porque las tres están definidas
              a trozos.
            trampa: true
            mensaje: |
              La (c) cae como $\tfrac1{n^{2}}$: es **continua**, solo tiene
              esquinas. Lo que marca la velocidad de caída no es que la
              definición tenga trozos, sino que la función salte o no.
        veredicto: |
          Las dos primeras saltan, y sus coeficientes caen como $\tfrac1n$. La
          tercera no salta, y cae como $\tfrac1{n^{2}}$. La velocidad de caída
          es un diagnóstico de suavidad, no de cómo esté escrita la función.
    resolucion: |
      **Las tres.**

      $$
      \text{(a)}\quad S(t) = \frac{2}{\pi}\sum_{n=1}^{\infty}
      \frac{1-\cos n\pi}{n}\operatorname{sen}\left(n\pi t\right)
      $$

      $$
      \text{(b)}\quad S(t) = 1 + \frac{2}{\pi}\sum_{n=1}^{\infty}
      \frac{1-\cos n\pi}{n}\operatorname{sen}\frac{n\pi t}{3}
      $$

      $$
      \text{(c)}\quad S(t) = \frac32 + \frac{2}{\pi^{2}}
      \sum_{n=1}^{\infty}\frac{\cos n\pi-1}{n^{2}}\cos\left(n\pi t\right)
      $$

      ### 1 · (a), la onda cuadrada de amplitud 1

      Función impar, media cero:

      $$
      b_n = \frac{2}{2}\int_{-1}^{1}f\operatorname{sen}\left(n\pi t\right)dt
      = 2\int_{0}^{1}\operatorname{sen}\left(n\pi t\right)dt
      = \frac{2\left(1-\cos n\pi\right)}{n\pi}
      $$

      Para $n$ impar, $\tfrac{4}{n\pi}$ — el clásico $\tfrac{4A}{n\pi}$ con
      $A=1$.

      ### 2 · (b), la misma onda levantada y estirada

      $$
      \frac{a_0}{2} = \frac16\int_{0}^{3}2\,dt = 1
      \qquad
      b_n = \frac13\int_{0}^{3}2\operatorname{sen}\frac{n\pi t}{3}\,dt
      = \frac{2\left(1-\cos n\pi\right)}{n\pi}
      $$

      **Los mismos $b_n$ que la (a).** No es casualidad: restando la media,

      $$
      f_b(t) - 1 = f_a\!\left(\frac{t}{3}\right)
      $$

      y un cambio de escala en $t$ solo cambia el argumento de los senos, no
      sus amplitudes.

      ### 3 · (c), la onda triangular levantada

      Par, así que $b_n=0$:

      $$
      \frac{a_0}{2} = \frac12\int_{-1}^{1}\left(1+\lvert t\rvert\right)dt
      = \frac12\cdot 3 = \frac32
      $$

      $$
      a_n = \int_{-1}^{1}\left(1+\lvert t\rvert\right)
      \cos\left(n\pi t\right)dt
      = 2\int_{0}^{1}t\cos\left(n\pi t\right)dt
      = \frac{2\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}
      $$

      El $1$ no contribuye a ningún $a_n$ con $n\ge1$: solo levanta la media.

      ### 4 · Las tres, comparadas

      | ap. | simetría | salto | caída |
      |---|---|---|---|
      | (a) | impar | sí | $\tfrac1n$ |
      | (b) | impar tras restar $1$ | sí | $\tfrac1n$ |
      | (c) | par | no | $\tfrac1{n^{2}}$ |

      Truncando en diez términos, la (c) ya es casi indistinguible de la
      función; las otras dos siguen oscilando visiblemente cerca de los saltos
      — el fenómeno de Gibbs, que no desaparece por muchos términos que se
      añadan.

      **Lo que hay que llevarse.** Antes de integrar: restar la media, mirar la
      paridad de lo que queda, y reconocer si la función ya es una de las
      formas conocidas. Aquí las tres lo eran, y la (b) no necesitaba ni una
      integral nueva.
