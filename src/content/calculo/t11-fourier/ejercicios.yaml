  - id: cuando-la-funcion-ni-existe
    titulo: Donde la función no está definida y la serie sí
    fuente: Ejercicio 11.6 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2016/2017 6E)
    nivel: practica
    enunciado: |
      Sea la función periódica de periodo $2\pi$ dada por $f(t) = -t$ con
      $t \in (-\pi, \pi)$.

      a) Dibujar $f(t)$.
      b) Calcular la serie de Fourier $S(t)$ de la función.
      c) Calcular $S(0)$, $f(0)$, $S(101\pi)$ y $f(101\pi)$.
      d) Calcular el valor de la suma
      $B = 1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} + \cdots$
    pide: La serie, los cuatro valores y la suma B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) pide $S$ y $f$ en los mismos dos puntos. ¿Qué está
          anunciando?
        opciones:
          - texto: Que en alguno de ellos los dos valores no coinciden
            correcta: true
            mensaje: |
              Siempre. Cuando un enunciado pide los dos valores en el mismo
              punto es porque hay un salto — o algo más raro, como aquí.
          - texto: Que hay que comprobar que la serie converge
            mensaje: |
              La convergencia la garantiza Dirichlet sin comprobar nada. Lo que
              se pregunta es a **qué** converge.
          - texto: Que los dos valen siempre lo mismo
            mensaje: |
              Entonces no tendría sentido preguntar los dos. La gracia del
              apartado es justamente que en $101\pi$ pasa algo peculiar.
      - tipo: calcular
        titulo: Reducir el argumento grande
        pregunta: |
          $101\pi$ se reduce restando múltiplos de $2\pi$. ¿A qué punto del
          intervalo $[-\pi,\pi]$ equivale? Da el número que multiplica a $\pi$.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '101'
            mensaje: |
              101 es el múltiplo sin reducir. Restando 50 periodos completos
              —o sea $100\pi$— queda $\pi$.
          - valor: '0'
            mensaje: |
              0 saldría si 101 fuera par. Al ser **impar**, $101\pi$ cae en el
              extremo $\pi$, que es justo donde está el salto.
        pista: |
          101 es impar. Resta 100π, que son 50 periodos.
        desarrollo: |
          $$
          101\pi - 50\cdot 2\pi = \pi
          $$

          Y $\pi$ es precisamente donde la diente de sierra salta.
      - tipo: justificar
        pregunta: |
          Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: 'En $t=0$ la función es continua, así que $S(0)=f(0)=0$.'
          - texto: '$101\pi$ se reduce a $\pi$, que es un punto de salto.'
          - texto: 'Por Dirichlet, $S(101\pi)$ es la media de los laterales $-\pi$ y $\pi$, o sea 0.'
          - texto: 'Pero $f(101\pi)$ **no está definida**, porque el enunciado define $f$ solo en el intervalo abierto.'
          - texto: '$f(101\pi) = -\pi$, el valor por la izquierda.'
            trampa: true
            mensaje: |
              El enunciado define $f(t)=-t$ en el intervalo **abierto**
              $(-\pi,\pi)$: los extremos quedan fuera. Así que en $\pi$ —y por
              periodicidad en $101\pi$— la función no tiene valor. Elegir uno de
              los dos laterales es inventárselo.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 380 215" role="img" width="380" height="215"
               aria-labelledby="f-fourier-hueco-t f-fourier-hueco-d">
