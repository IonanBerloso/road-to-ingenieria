        consigna: |
          Dibuja tres periodos de $f(t)=-t$ y marca, con dos símbolos distintos,
          los puntos donde $f$ está definida y aquellos donde solo lo está $S$.
        comprueba:
          - punto: |
              Rampas que **bajan** de $\pi$ a $-\pi$, con pendiente $-1$.
            porque: |
              El signo menos invierte el diente de sierra habitual. Dibujarlo
              subiendo cambia el signo de todos los coeficientes.
          - punto: |
              En los múltiplos impares de $\pi$, un **hueco** en la gráfica de
              $f$.
            porque: |
              El enunciado define $f$ solo en el intervalo abierto
              $\left(-\pi,\pi\right)$: en $t=\pm\pi$ no hay valor. Eso es lo que
              hace que $f(101\pi)$ no exista, y es la mitad del apartado (c).
          - punto: |
              En esos mismos puntos, un punto lleno a altura $0$ para $S$.
            porque: |
              La serie sí está definida ahí, y vale la semisuma de los límites
              laterales. Dibujar los dos símbolos enseña la diferencia entre $f$
              y $S$ mejor que cualquier frase.
          - punto: |
              En $t=0$, un solo punto: ahí $f$ y $S$ coinciden y valen $0$.
            porque: |
              Es un punto de continuidad, y sirve de contraste con los
              anteriores: la serie no siempre discrepa de la función, solo en los
              saltos.
        veredicto: |
          El dibujo con dos símbolos es la respuesta del apartado (c) entera:
          $S(101\pi)=0$ y $f(101\pi)$ **no existe**. Escribirlo así, distinguiendo
          los dos objetos, es lo que se puntúa.

    resolucion: |
      **La respuesta del apartado c) tiene una asimetría que es todo el
      ejercicio.**

      **b) La serie.** $f(t)=-t$ es **impar**, así que solo hay senos:

      $$
      S(t) = 2\sum_{k=1}^{\infty}\frac{(-1)^{k}}{k}\,\text{sen}(kt)
      $$

      **c) Los cuatro valores:**

      | | valor | por qué |
      |---|---|---|
      | $S(0)$ | $0$ | continuidad |
      | $f(0)$ | $0$ | $f(0) = -0$ |
      | $S(101\pi)$ | $0$ | se reduce a $\pi$, salto, media de $-\pi$ y $\pi$ |
      | $f(101\pi)$ | **no definida** | el enunciado define $f$ en el **abierto** |

      **Esa última fila es la que se falla.** La función se da en $(-\pi,\pi)$,
      abierto: los extremos no tienen valor. La **serie** en cambio existe en
      todos los puntos —es una suma de senos, que están definidos siempre— y
      allí vale 0.

      **d) La suma.** Evaluando la serie en $t=\pi/2$, donde $f$ es continua y
      vale $-\pi/2$, los senos de los pares se anulan y los impares alternan:

      $$
      -\frac{\pi}{2} = -2\left(1-\frac13+\frac15-\cdots\right)
      \qquad\Longrightarrow\qquad
      \boxed{\;B = \frac{\pi}{4}\;}
      $$

      > **Que una función no esté definida en un punto y su serie sí** no es una
      > rareza de examen: es lo normal. La serie de Fourier es una suma de senos
      > y cosenos, funciones continuas todas, y existe en todo $\mathbb{R}$
      > aunque la función original tenga huecos o saltos.

  - id: la-que-no-tiene-saltos
    titulo: Una serie que coincide con la función en todas partes
    fuente: Ejercicio 11.7 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2014/2015 6E)
    nivel: practica
    enunciado: |
      Dada la función periódica $f(t)$ de periodo $\pi$ definida por
      $f(t) = |t|$ en $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$, se pide:

      a) Desarrollar la función en serie de Fourier.
      b) Estudiar la convergencia de la serie $S(t)$ obtenida.
    pide: La serie de Fourier y su convergencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          La gráfica es una sucesión de uves pegadas. ¿Qué tiene de especial
          frente a la diente de sierra?
        opciones:
          - texto: Que es continua en todas partes, aunque tenga picos
            correcta: true
            mensaje: |
              Eso es. Un pico no es un salto: la función no da un brinco, solo
              cambia de pendiente. Y donde no hay salto, serie y función
              coinciden **en todos** los puntos.
          - texto: Que no es periódica
            mensaje: |
              Sí lo es, con periodo $\pi$. Lo que la distingue de la diente de
              sierra es que al repetirse los trozos encajan sin dar un salto.
          - texto: Que su serie no converge
            mensaje: |
              Converge, y mejor que la de la diente de sierra: al ser continua
              converge a la función en todos los puntos sin excepción.
      - tipo: calcular
        titulo: El término constante
        pregunta: |
          El valor medio de $|t|$ sobre un periodo es $\frac{a_0}{2}$. Para
          $|t|$ en $(-\pi/2,\pi/2)$ ese valor es $\pi/4$. ¿Cuánto vale con
          cuatro decimales?
        respuesta:
          tipo: numero
          valor: '0.7854'
          tolerancia: 0.01
          formato: en forma exacta (pi/4) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              $\pi/2$ es el **máximo** de la función, no su media. La media de
              una uve que sube de 0 a $\pi/2$ es la mitad de eso.
          - valor: '3.1416'
            mensaje: |
              $\pi$ es el periodo. El valor medio de la función es otra cosa.
        pista: |
          π/4, con pi = 3,14159...
        desarrollo: |
          La función va de 0 en el centro a $\pi/2$ en los bordes, linealmente.
          Su media es la mitad del máximo:

          $$
          \frac{a_0}{2} = \frac{\pi}{4} \approx 0{,}785
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: '$|t|$ es **par**, así que $b_n=0$ y la serie es de cosenos.'
          - texto: 'El término constante es el valor medio, $\pi/4$.'
          - texto: 'Solo sobreviven los armónicos impares, y la serie es $S(t)=\frac{\pi}{4}-\frac{2}{\pi}\sum\frac{\cos[2(2k+1)t]}{(2k+1)^{2}}$.'
          - texto: 'b) La función es continua en todo $\mathbb{R}$, así que $S(t)=f(t)$ para todo $t$.'
          - texto: 'b) En los picos hay que aplicar Dirichlet, porque la función no es derivable ahí.'
            trampa: true
            mensaje: |
              Dirichlet habla de **saltos**, no de picos. En un pico la función
              es continua —los dos límites laterales coinciden— aunque no sea
              derivable. La media de dos valores iguales es ese mismo valor, así
              que la serie coincide con la función también ahí.
    resolucion: |
      **a) La serie.** La función es **par**, así que $b_n = 0$ y solo hay
      cosenos. Con periodo $\pi$, la frecuencia base es $2$:

      $$
      a_n = \frac{4}{\pi}\int_{0}^{\pi/2} t\cos 2nt\,dt
      = \frac{(-1)^{n}-1}{\pi n^{2}}
      $$

      que vale $0$ si $n$ es par y $-\dfrac{2}{\pi n^{2}}$ si es impar. **El
      signo es negativo**, y de ahí:

      $$
      S(t) = \frac{\pi}{4} - \frac{2}{\pi}\sum_{k=0}^{\infty}\frac{\cos\bigl[2(2k+1)t\bigr]}{(2k+1)^{2}}
      $$

      Los armónicos pares se anulan, como suele pasar con las funciones
      triangulares.

      > **La comprobación que decide el signo.** En $t=0$ la función vale $0$, y
      > como es continua la serie tiene que valer $0$ también. Con el menos:
      > $\frac{\pi}{4}-\frac{2}{\pi}\cdot\frac{\pi^{2}}{8}=0$ ✓ Con el más
      > saldría $\frac{\pi}{2}$, que no es el valor de $f$ en ningún punto. Y de
      > paso ese cálculo regala $\sum\frac{1}{(2k+1)^{2}}=\frac{\pi^{2}}{8}$.

      **b) La convergencia**, que es el apartado interesante:

      $$
      S(t) = f(t) \qquad \text{para todo } t
      $$

      **Sin excepciones.** Y conviene decir por qué: la extensión periódica de
      $|t|$ es **continua en todo $\mathbb{R}$**. Tiene picos —no es derivable
      en ellos— pero no da ningún salto, y Dirichlet solo se desvía de la
      función donde hay salto.

      > **Compáralo con la diente de sierra.** Aquella salta en cada periodo y
      > su serie se queda a media altura en cada salto. Esta no salta nunca, y
      > su serie la reproduce entera.
      >
      > Y hay una consecuencia práctica: **los coeficientes de esta decrecen
      > como $1/n^{2}$** y los de la diente de sierra como $1/n$. Cuanto más
      > suave la función, más rápido se apagan sus armónicos y menos términos
      > hacen falta para aproximarla bien.

