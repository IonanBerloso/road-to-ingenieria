        <desc id="f-ej-coeficiente-d">Las rampas de pendiente uno de la función, y encima, con otro trazo, la onda dos por seno de t, que es el primer término de la serie. La onda sigue la forma general de la rampa —sube donde ella sube y se anula donde ella se anula— pero se queda corta cerca de los saltos, que es exactamente lo que van corrigiendo los armónicos siguientes.</desc>
