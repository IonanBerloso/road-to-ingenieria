  - id: serie-de-f-igual-t
    titulo: La serie de f(t)=t, y una suma numérica de regalo
    fuente: Ejercicio 11.5 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2015/2016 6E)
    nivel: practica
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $2\pi$ definida por $f(t) = t$
      para $-\pi < t < \pi$.

      a) Dibujar $f(t)$.
      b) Obtener su serie de Fourier $S(t)$.
      c) Calcular $S(0)$, $S\left(\frac{121\pi}{2}\right)$ y $S(2001\pi)$.
      d) Obtener la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}$.
    pide: El dibujo, la serie, tres valores y la suma numérica.
    pasos:
      - tipo: reconocer
        pregunta: |
          $f(t)=t$ en $(-\pi,\pi)$. ¿Qué se puede decir antes de integrar?
        opciones:
          - texto: Es impar, así que todos los coeficientes de coseno se anulan
            correcta: true
            mensaje: |
              Sí, y eso elimina la mitad del trabajo. La serie será solo de
              senos, y ni siquiera hay que calcular $a_0$.
          - texto: Es par, así que la serie será de cosenos
            mensaje: |
              $f(-t) = -t = -f(t)$: es **impar**, no par. La serie será de senos.
          - texto: No tiene simetría y hay que calcular todos los coeficientes
            mensaje: |
              Sí la tiene: la identidad es la función impar por excelencia. Fíjate
              en la gráfica — es simétrica respecto del origen.
      - tipo: calcular
        titulo: El valor en el salto
        pregunta: |
          En $t=\pi$ la función salta de $\pi$ (por la izquierda) a $-\pi$ (por
          la derecha, ya en el periodo siguiente). ¿Cuánto vale $S(\pi)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3.1416'
            mensaje: |
              $\pi$ es el límite por la izquierda. Dirichlet toma la media de los
              dos laterales, que son $\pi$ y $-\pi$.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la suma de los dos laterales sin dividir. La media exige
              dividir entre 2, y además los signos son opuestos.
        pista: |
          La media de π y −π.
        desarrollo: |
          $$
          S(\pi) = \frac{\pi + (-\pi)}{2} = 0
          $$

          Y esto es lo que hace falta para el apartado c): $2001\pi$ es un
          múltiplo impar de $\pi$, así que cae exactamente en un salto.
      - tipo: calcular
        titulo: Reducir el argumento grande
        pregunta: |
          $S$ tiene periodo $2\pi$. ¿A qué punto del intervalo $(-\pi,\pi]$
          equivale $\frac{121\pi}{2}$? Da la respuesta como múltiplo de $\pi$,
          es decir, el número que multiplica a $\pi$.
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '60.5'
            mensaje: |
              $60{,}5$ es el múltiplo original, sin reducir. Hay que restarle
              múltiplos de 2 hasta caer en el intervalo básico: $60{,}5 - 60 = 0{,}5$.
          - valor: '1.5'
            mensaje: |
              Te has pasado o te has quedado corto al restar. $60{,}5$ menos 60
              —o sea 30 periodos completos— da $0{,}5$, que ya está dentro.
        pista: |
          121/2 = 60,5. Réstale múltiplos de 2 hasta quedar entre −1 y 1.
        desarrollo: |
          $$
          \frac{121\pi}{2} = 60{,}5\,\pi = 0{,}5\,\pi + 60\pi = \frac{\pi}{2}+30\cdot 2\pi
          $$

          Treinta periodos completos, así que
          $S\left(\frac{121\pi}{2}\right) = S\left(\frac{\pi}{2}\right)$. Y ahí
          la función es continua, luego vale $\pi/2$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La gráfica es una diente de sierra: rectas de pendiente 1 que saltan en los múltiplos impares de $\pi$.'
          - texto: 'b) Como $f$ es impar, $a_n=0$ y la serie es $S(t)=\sum \frac{2(-1)^{n+1}}{n}\,\text{sen}\,nt$.'
          - texto: 'c) $S(0)=0$ por continuidad, $S(121\pi/2)=\pi/2$ tras reducir, y $S(2001\pi)=0$ por ser un salto.'
          - texto: 'd) Evaluando la serie en $t=\pi/2$ se obtiene la suma pedida.'
          - texto: 'c) $S(2001\pi) = \pi$, porque es el valor de la función justo antes del salto.'
            trampa: true
            mensaje: |
              En un salto la serie **no** toma el valor de un lado. $2001$ es
              impar, así que $2001\pi$ es un punto de discontinuidad, y Dirichlet
              da la media: $(\pi + (-\pi))/2 = 0$.
    resolucion: |
      **a) La gráfica** es una **diente de sierra**: en cada periodo, la recta
      $y=t$ subiendo de $-\pi$ a $\pi$, y después un salto vertical de vuelta
      abajo. Los saltos están en los múltiplos impares de $\pi$.

      **b) La serie.** Como $f$ es **impar**, todos los $a_n$ se anulan —y $a_0$
      también— sin calcular nada. Solo quedan los senos:

      $$
      b_n = \frac{2}{\pi}\int_{0}^{\pi} t\,\text{sen}\,nt\,dt
      = \frac{2(-1)^{n+1}}{n}
      $$

      $$
      S(t) = \sum_{n=1}^{\infty}\frac{2(-1)^{n+1}}{n}\,\text{sen}\,nt
      = 2\left(\text{sen}\,t - \frac{\text{sen}\,2t}{2} + \frac{\text{sen}\,3t}{3} - \cdots\right)
      $$

      **c) Los tres valores**, y cada uno ilustra una cosa distinta:

      | punto | situación | valor |
      |---|---|---|
      | $t=0$ | continuidad, $f(0)=0$ | $S(0)=0$ |
      | $t=\frac{121\pi}{2}$ | $=\frac{\pi}{2}+30\cdot 2\pi$, continuidad | $S = \frac{\pi}{2}$ |
      | $t=2001\pi$ | múltiplo **impar** de $\pi$: salto | $S = 0$ |

      **d) La suma de la serie**, que es el remate. Evaluando la serie en
      $t = \pi/2$, donde $f$ es continua y vale $\pi/2$:

      $$
      \frac{\pi}{2} = 2\left(\text{sen}\,\frac{\pi}{2} - \frac{\text{sen}\,\pi}{2} + \frac{\text{sen}\,\frac{3\pi}{2}}{3} - \cdots\right)
      $$

      Los senos de los múltiplos pares de $\pi/2$ se anulan y los impares valen
      $1,-1,1,-1,\dots$, así que queda

      $$
      \frac{\pi}{2} = 2\left(1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7}+\cdots\right)
      $$

      $$
      \boxed{\;\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1} = \frac{\pi}{4}\;}
      $$

      > **Esto es lo que hace especial al tema.** Esa suma no se puede calcular
      > con nada del tema 2: los criterios de convergencia dicen que converge,
      > pero no a cuánto. Fourier da el valor exacto, y de propina. El truco está
      > en **elegir el punto donde evaluar**: $\pi/2$ mata los términos pares y
      > deja justo la serie que se pide.

  - id: extension-par-de-t
    titulo: La extensión par, y una serie de cuadrados
    fuente: Ejercicio 11.8 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2017/2018 6E)
    nivel: practica
    enunciado: |
      Sea la función $f(t) = t$ donde $0 \le t < \pi$.

      a) Obtener la extensión par de la función $f(t)$.
      b) Representar gráficamente la función extendida.
      c) Obtener la serie de Fourier $S(t)$ de la función $f(t)$.
      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y $t=\pi$.
      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}$.
    pide: La extensión par, su serie, los valores pedidos y la suma.
    pasos:
      - tipo: reconocer
        pregunta: |
          La función solo está dada en $[0,\pi)$. ¿Qué es «extenderla de forma
          par»?
        opciones:
          - texto: Definirla en (−π,0) como el reflejo especular, f(−t)=f(t)
            correcta: true
            mensaje: |
              Eso es. Se copia el trozo dado y se refleja como en un espejo, y la
              función resultante es par: su serie será solo de cosenos.
          - texto: Definirla en (−π,0) con el signo cambiado
            mensaje: |
              Eso es la extensión **impar**, que también existe y da una serie de
              senos. El enunciado pide la par.
          - texto: Repetirla con periodo π
            mensaje: |
              Repetir es lo que se hace después, para hacerla periódica. Extender
              es decidir qué vale en la otra mitad del periodo.
      - tipo: calcular
        titulo: El valor de la extensión a la izquierda
        pregunta: |
          Si la extensión es par, ¿cuánto vale la función extendida en
          $t = -2$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ese sería el valor de la extensión **impar**. En la par el reflejo
              conserva la altura: $f(-2)=f(2)=2$.
          - valor: '0'
            mensaje: |
              La función no vale cero fuera de $[0,\pi)$: se extiende, no se
              anula. En $t=-2$ la extensión par vale lo mismo que en $t=2$.
        pista: |
          Par significa $f(-t)=f(t)$. Y $f(2)=2$.
        desarrollo: |
          $$
          f_{\text{par}}(-2) = f(2) = 2
          $$

          La extensión par de $f(t)=t$ es $f(t) = |t|$ en $(-\pi,\pi)$: una **uve**
          con el vértice en el origen.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La extensión par es $|t|$ en $(-\pi,\pi)$, extendida con periodo $2\pi$.'
          - texto: 'b) La gráfica es una sucesión de uves, continua en todas partes.'
          - texto: 'c) Al ser par, $b_n=0$ y la serie es de cosenos, con $a_0/2 = \pi/2$.'
          - texto: 'd) Como la extensión es continua, $S(0)=f(0)=0$ y $S(\pi)=f(\pi)=\pi$.'
          - texto: 'd) En $t=\pi$ hay un salto, así que $S(\pi)=0$ por Dirichlet.'
            trampa: true
            mensaje: |
              Aquí **no** hay salto. La extensión par de $t$ es $|t|$, y en $\pi$
              vale $\pi$ tanto por la izquierda como por la derecha (donde
              empieza el periodo siguiente bajando desde $\pi$). Es continua, y
              por eso serie y función coinciden. Esa es justamente la diferencia
              con el ejercicio de la diente de sierra.
    resolucion: |
      **a) y b) La extensión par.** Se refleja el trozo dado como en un espejo:

      $$
      f_{\text{par}}(t) = |t|,
      \qquad t\in(-\pi,\pi)
      $$

      Repetida con periodo $2\pi$, la gráfica es una **sucesión de uves** con los
      vértices en los múltiplos pares de $\pi$ y los picos en los impares. Y —esto
      importa para el apartado d)— **es continua en todas partes**, incluidos los
      picos.

      **c) La serie.** Al ser par, $b_n = 0$ y solo hay cosenos:

      $$
      \frac{a_0}{2} = \frac{1}{\pi}\int_{0}^{\pi} t\,dt = \frac{\pi}{2},
      \qquad
      a_n = \frac{2}{\pi}\int_{0}^{\pi} t\cos nt\,dt = \frac{2\,((-1)^{n}-1)}{\pi n^{2}}
      $$

      Ese numerador vale $0$ si $n$ es par y $-4$ si es impar, así que **solo
      sobreviven los impares**:

      $$
      S(t) = \frac{\pi}{2} - \frac{4}{\pi}\sum_{n=1}^{\infty}\frac{\cos\bigl((2n-1)t\bigr)}{(2n-1)^{2}}
      $$

      **d) Los valores.** La extensión es continua, así que serie y función
      coinciden en los dos puntos:

      $$
      S(0)=f(0)=0,
      \qquad
      S(\pi)=f(\pi)=\pi
      $$

      > **Compáralo con la diente de sierra.** Allí la extensión tenía saltos y
      > Dirichlet daba la media; aquí la extensión par los ha eliminado. **La
      > misma función de partida, extendida de dos maneras, da comportamientos
      > distintos en los bordes** — y el enunciado pide los dos valores
      > precisamente para ver si lo has notado.

      **e) La suma.** Evaluando la serie en $t=0$, donde $S(0)=0$ y todos los
      cosenos valen 1:

      $$
      0 = \frac{\pi}{2} - \frac{4}{\pi}\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}
      $$

      $$
      \boxed{\;\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}} = \frac{\pi^{2}}{8}\;}
      $$

      Y aquí el punto elegido es el más cómodo posible: en $t=0$ todos los
      cosenos valen 1 y la serie se queda desnuda.

  - id: dirichlet-en-cinco-puntos
    titulo: Cinco puntos, y hay que decidir uno a uno
    fuente: Ejercicio 11.2a · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(t) = t$ para $-1 < t < 1$, extendida con periodo $T=2$, y sea
      $S(t)$ su serie de Fourier. Calcular $S(0)$, $S(0{,}5)$, $S(1)$, $S(2)$ y
      $S(3{,}5)$.
    pide: Los cinco valores de la serie.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de evaluar en cada punto, ¿qué hay que decidir?
        opciones:
          - texto: Si ese punto es de continuidad o de salto, después de reducirlo al periodo
            correcta: true
            mensaje: |
              Los dos pasos, y en ese orden. Primero se reduce al intervalo
              básico, y allí se mira si la función es continua o salta.
          - texto: Calcular la serie completa y sumarla numéricamente
            mensaje: |
              No hace falta y sería inviable a mano. Dirichlet contesta con la
              función, sin tocar la serie.
          - texto: Nada; la serie vale siempre lo mismo que la función
            mensaje: |
              Solo en los puntos de continuidad. En los saltos vale la media de
              los laterales, y este ejercicio tiene tres puntos así.
      - tipo: calcular
        titulo: Un punto de continuidad
        pregunta: |
          En $t=0{,}5$ la función es continua. ¿Cuánto vale $S(0{,}5)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es el valor en los saltos. En $0{,}5$ la función es continua y
              vale $t$, o sea $0{,}5$.
          - valor: '1'
            mensaje: |
              1 sería el extremo del intervalo. En $t=0{,}5$ la recta $y=t$ vale
              exactamente $0{,}5$.
        pista: |
          Continuidad: serie y función coinciden, y f(t)=t.
        desarrollo: |
          $$
          S(0{,}5) = f(0{,}5) = 0{,}5
          $$
      - tipo: calcular
        titulo: Un punto de salto lejano
        pregunta: |
          $t=3{,}5$ se reduce restando periodos: $3{,}5 - 2 = 1{,}5$, y
          $1{,}5 - 2 = -0{,}5$. ¿Cuánto vale $S(3{,}5)$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Signo cambiado. Al reducir, $3{,}5$ cae en $-0{,}5$, donde la recta
              $y=t$ es negativa.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es el resultado intermedio de restar **un** periodo, y
              todavía está fuera del intervalo $(-1,1)$. Hay que restar otro.
        pista: |
          Resta 2 dos veces: 3,5 → 1,5 → −0,5. Y ahí f(t)=t.
        desarrollo: |
          $$
          3{,}5 - 2\cdot 2 = -0{,}5 \in (-1,1)
          $$

          Punto de continuidad, así que $S(3{,}5) = f(-0{,}5) = -0{,}5$.
      - tipo: justificar
        pregunta: |
          Ordena los cinco valores. Una pieza es falsa.
        piezas:
          - texto: '$S(0)=0$ y $S(0{,}5)=0{,}5$, los dos por continuidad.'
          - texto: '$S(1)=0$, porque en $t=1$ hay un salto de 1 a $-1$ y la media es 0.'
          - texto: '$S(2)=0$, porque $2$ se reduce a $0$, que es continuo y vale 0.'
          - texto: '$S(3{,}5) = -0{,}5$, reduciendo dos periodos.'
          - texto: '$S(2)=2$, porque la función vale $t$ y en $t=2$ eso da 2.'
            trampa: true
            mensaje: |
              La fórmula $f(t)=t$ solo vale en $(-1,1)$. Fuera de ahí la función
              se **repite**, no sigue creciendo. Aplicar la fórmula fuera de su
              intervalo es el error más frecuente con funciones periódicas.
    resolucion: |
      **El procedimiento es el mismo cinco veces:** reducir al periodo básico y
      decidir si allí hay salto.

      La función es la **diente de sierra**: la recta $y=t$ entre $-1$ y $1$,
      repetida cada 2. Los saltos están en los enteros impares.

      | punto | reducido | situación | $S$ |
      |---|---|---|---|
      | $0$ | $0$ | continuidad | $0$ |
      | $0{,}5$ | $0{,}5$ | continuidad | $0{,}5$ |
      | $1$ | $1$ | **salto** de $1$ a $-1$ | $0$ |
      | $2$ | $0$ | continuidad | $0$ |
      | $3{,}5$ | $-0{,}5$ | continuidad | $-0{,}5$ |

      > **El error que este ejercicio caza** es aplicar $f(t)=t$ fuera de
      > $(-1,1)$ y contestar $S(2)=2$ o $S(3{,}5)=3{,}5$. La fórmula describe
      > **un** periodo; la función se repite, y la serie con ella. Reducir
      > primero no es un paso opcional.

  - id: cuando-la-funcion-ni-existe
    titulo: Donde la función no está definida y la serie sí
    fuente: Ejercicio 11.6 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2016/2017 6E)
    nivel: practica
    enunciado: |
      Sea la función periódica de periodo $2\pi$ dada por $f(t) = -t$ con
      $t \in (-\pi, \pi)$.

      a) Dibujar $f(t)$.
      b) Calcular la serie de Fourier $S(t)$ de la función.
      c) Calcular $S(0)$, $f(0)$, $S(101\pi)$ y $f(101\pi)$.
      d) Calcular el valor de la suma
      $B = 1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} + \cdots$
    pide: La serie, los cuatro valores y la suma B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) pide $S$ y $f$ en los mismos dos puntos. ¿Qué está
          anunciando?
        opciones:
          - texto: Que en alguno de ellos los dos valores no coinciden
            correcta: true
            mensaje: |
              Siempre. Cuando un enunciado pide los dos valores en el mismo
              punto es porque hay un salto — o algo más raro, como aquí.
          - texto: Que hay que comprobar que la serie converge
            mensaje: |
              La convergencia la garantiza Dirichlet sin comprobar nada. Lo que
              se pregunta es a **qué** converge.
          - texto: Que los dos valen siempre lo mismo
            mensaje: |
              Entonces no tendría sentido preguntar los dos. La gracia del
              apartado es justamente que en $101\pi$ pasa algo peculiar.
      - tipo: calcular
        titulo: Reducir el argumento grande
        pregunta: |
          $101\pi$ se reduce restando múltiplos de $2\pi$. ¿A qué punto del
          intervalo $[-\pi,\pi]$ equivale? Da el número que multiplica a $\pi$.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '101'
            mensaje: |
              101 es el múltiplo sin reducir. Restando 50 periodos completos
              —o sea $100\pi$— queda $\pi$.
          - valor: '0'
            mensaje: |
              0 saldría si 101 fuera par. Al ser **impar**, $101\pi$ cae en el
              extremo $\pi$, que es justo donde está el salto.
        pista: |
          101 es impar. Resta 100π, que son 50 periodos.
        desarrollo: |
          $$
          101\pi - 50\cdot 2\pi = \pi
          $$

          Y $\pi$ es precisamente donde la diente de sierra salta.
      - tipo: justificar
        pregunta: |
          Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: 'En $t=0$ la función es continua, así que $S(0)=f(0)=0$.'
          - texto: '$101\pi$ se reduce a $\pi$, que es un punto de salto.'
          - texto: 'Por Dirichlet, $S(101\pi)$ es la media de los laterales $-\pi$ y $\pi$, o sea 0.'
          - texto: 'Pero $f(101\pi)$ **no está definida**, porque el enunciado define $f$ solo en el intervalo abierto.'
          - texto: '$f(101\pi) = -\pi$, el valor por la izquierda.'
            trampa: true
            mensaje: |
              El enunciado define $f(t)=-t$ en el intervalo **abierto**
              $(-\pi,\pi)$: los extremos quedan fuera. Así que en $\pi$ —y por
              periodicidad en $101\pi$— la función no tiene valor. Elegir uno de
              los dos laterales es inventárselo.
    resolucion: |
      **La respuesta del apartado c) tiene una asimetría que es todo el
      ejercicio.**

      **b) La serie.** $f(t)=-t$ es **impar**, así que solo hay senos:

      $$
      S(t) = 2\sum_{k=1}^{\infty}\frac{(-1)^{k}}{k}\,\text{sen}(kt)
      $$

      **c) Los cuatro valores:**

      | | valor | por qué |
      |---|---|---|
      | $S(0)$ | $0$ | continuidad |
      | $f(0)$ | $0$ | $f(0) = -0$ |
      | $S(101\pi)$ | $0$ | se reduce a $\pi$, salto, media de $-\pi$ y $\pi$ |
      | $f(101\pi)$ | **no definida** | el enunciado define $f$ en el **abierto** |

      **Esa última fila es la que se falla.** La función se da en $(-\pi,\pi)$,
      abierto: los extremos no tienen valor. La **serie** en cambio existe en
      todos los puntos —es una suma de senos, que están definidos siempre— y
      allí vale 0.

      **d) La suma.** Evaluando la serie en $t=\pi/2$, donde $f$ es continua y
      vale $-\pi/2$, los senos de los pares se anulan y los impares alternan:

      $$
      -\frac{\pi}{2} = -2\left(1-\frac13+\frac15-\cdots\right)
      \qquad\Longrightarrow\qquad
      \boxed{\;B = \frac{\pi}{4}\;}
      $$

      > **Que una función no esté definida en un punto y su serie sí** no es una
      > rareza de examen: es lo normal. La serie de Fourier es una suma de senos
      > y cosenos, funciones continuas todas, y existe en todo $\mathbb{R}$
      > aunque la función original tenga huecos o saltos.

  - id: la-que-no-tiene-saltos
    titulo: Una serie que coincide con la función en todas partes
    fuente: Ejercicio 11.7 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2014/2015 6E)
    nivel: practica
    enunciado: |
      Dada la función periódica $f(t)$ de periodo $\pi$ definida por
      $f(t) = |t|$ en $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$, se pide:

      a) Desarrollar la función en serie de Fourier.
      b) Estudiar la convergencia de la serie $S(t)$ obtenida.
    pide: La serie de Fourier y su convergencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          La gráfica es una sucesión de uves pegadas. ¿Qué tiene de especial
          frente a la diente de sierra?
        opciones:
          - texto: Que es continua en todas partes, aunque tenga picos
            correcta: true
            mensaje: |
              Eso es. Un pico no es un salto: la función no da un brinco, solo
              cambia de pendiente. Y donde no hay salto, serie y función
              coinciden **en todos** los puntos.
          - texto: Que no es periódica
            mensaje: |
              Sí lo es, con periodo $\pi$. Lo que la distingue de la diente de
              sierra es que al repetirse los trozos encajan sin dar un salto.
          - texto: Que su serie no converge
            mensaje: |
              Converge, y mejor que la de la diente de sierra: al ser continua
              converge a la función en todos los puntos sin excepción.
      - tipo: calcular
        titulo: El término constante
        pregunta: |
          El valor medio de $|t|$ sobre un periodo es $\frac{a_0}{2}$. Para
          $|t|$ en $(-\pi/2,\pi/2)$ ese valor es $\pi/4$. ¿Cuánto vale con
          cuatro decimales?
        respuesta:
          tipo: numero
          valor: '0.7854'
          tolerancia: 0.01
          formato: en forma exacta (pi/4) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              $\pi/2$ es el **máximo** de la función, no su media. La media de
              una uve que sube de 0 a $\pi/2$ es la mitad de eso.
          - valor: '3.1416'
            mensaje: |
              $\pi$ es el periodo. El valor medio de la función es otra cosa.
        pista: |
          π/4, con pi = 3,14159...
        desarrollo: |
          La función va de 0 en el centro a $\pi/2$ en los bordes, linealmente.
          Su media es la mitad del máximo:

          $$
          \frac{a_0}{2} = \frac{\pi}{4} \approx 0{,}785
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: '$|t|$ es **par**, así que $b_n=0$ y la serie es de cosenos.'
          - texto: 'El término constante es el valor medio, $\pi/4$.'
          - texto: 'Solo sobreviven los armónicos impares, y la serie es $S(t)=\frac{\pi}{4}-\frac{2}{\pi}\sum\frac{\cos[2(2k+1)t]}{(2k+1)^{2}}$.'
          - texto: 'b) La función es continua en todo $\mathbb{R}$, así que $S(t)=f(t)$ para todo $t$.'
          - texto: 'b) En los picos hay que aplicar Dirichlet, porque la función no es derivable ahí.'
            trampa: true
            mensaje: |
              Dirichlet habla de **saltos**, no de picos. En un pico la función
              es continua —los dos límites laterales coinciden— aunque no sea
              derivable. La media de dos valores iguales es ese mismo valor, así
              que la serie coincide con la función también ahí.
    resolucion: |
      **a) La serie.** La función es **par**, así que $b_n = 0$ y solo hay
      cosenos. Con periodo $\pi$, la frecuencia base es $2$:

      $$
      a_n = \frac{4}{\pi}\int_{0}^{\pi/2} t\cos 2nt\,dt
      = \frac{(-1)^{n}-1}{\pi n^{2}}
      $$

      que vale $0$ si $n$ es par y $-\dfrac{2}{\pi n^{2}}$ si es impar. **El
      signo es negativo**, y de ahí:

      $$
      S(t) = \frac{\pi}{4} - \frac{2}{\pi}\sum_{k=0}^{\infty}\frac{\cos\bigl[2(2k+1)t\bigr]}{(2k+1)^{2}}
      $$

      Los armónicos pares se anulan, como suele pasar con las funciones
      triangulares.

      > **La comprobación que decide el signo.** En $t=0$ la función vale $0$, y
      > como es continua la serie tiene que valer $0$ también. Con el menos:
      > $\frac{\pi}{4}-\frac{2}{\pi}\cdot\frac{\pi^{2}}{8}=0$ ✓ Con el más
      > saldría $\frac{\pi}{2}$, que no es el valor de $f$ en ningún punto. Y de
      > paso ese cálculo regala $\sum\frac{1}{(2k+1)^{2}}=\frac{\pi^{2}}{8}$.

      **b) La convergencia**, que es el apartado interesante:

      $$
      S(t) = f(t) \qquad \text{para todo } t
      $$

      **Sin excepciones.** Y conviene decir por qué: la extensión periódica de
      $|t|$ es **continua en todo $\mathbb{R}$**. Tiene picos —no es derivable
      en ellos— pero no da ningún salto, y Dirichlet solo se desvía de la
      función donde hay salto.

      > **Compáralo con la diente de sierra.** Aquella salta en cada periodo y
      > su serie se queda a media altura en cada salto. Esta no salta nunca, y
      > su serie la reproduce entera.
      >
      > Y hay una consecuencia práctica: **los coeficientes de esta decrecen
      > como $1/n^{2}$** y los de la diente de sierra como $1/n$. Cuanto más
      > suave la función, más rápido se apagan sus armónicos y menos términos
      > hacen falta para aproximarla bien.

  - id: ampliacion-impar-de-una-recta
    titulo: La ampliación impar, y el signo de la suma
    fuente: Ejercicio 11.9 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU (2019/2020 6E)
    nivel: practica
    enunciado: |
      Sea $f(t) = 2\pi - t$ la función definida en el intervalo $(0,\pi)$.

      a) Obtener la ampliación impar y periódica de la función $f(t)$.
      b) Obtener la serie de Fourier $S(t)$.
      c) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=\frac{\pi}{2}$.
      d) Calcular la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1}$.
    pide: La ampliación, la serie, los valores y la suma.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se construye la ampliación **impar** de una función dada en
          $(0,\pi)$?
        opciones:
          - texto: Se define en (−π,0) como −f(−t)
            correcta: true
            mensaje: |
              Eso es: se refleja y se le cambia el signo, de modo que la gráfica
              queda simétrica respecto del origen. La serie será solo de senos.
          - texto: Se define en (−π,0) como f(−t)
            mensaje: |
              Esa es la ampliación **par**, que da serie de cosenos. La impar
              lleva además el cambio de signo.
          - texto: Se pone a cero fuera de (0,π)
            mensaje: |
              Eso no es ampliar, es truncar — y la función resultante no sería
              ni par ni impar, así que no ahorraría ningún coeficiente.
      - tipo: calcular
        titulo: El valor en el punto medio
        pregunta: |
          En $t=\pi/2$ la función es continua. ¿Cuánto vale $f(\pi/2)$ si
          $f(t) = 2\pi - t$?
        respuesta:
          tipo: numero
          valor: '4.7124'
          tolerancia: 0.02
          formato: en forma exacta (3pi/2) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              $\pi/2$ es el punto donde se evalúa, no el valor. Hay que
              sustituirlo en $2\pi - t$.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el valor en $t=0$, el extremo del intervalo. En el punto
              medio ya se ha restado $\pi/2$.
        pista: |
          $2\pi - \pi/2 = 3\pi/2$.
        desarrollo: |
          $$
          f\left(\tfrac{\pi}{2}\right) = 2\pi - \tfrac{\pi}{2} = \tfrac{3\pi}{2} \approx 4{,}712
          $$

          Y como ahí es continua, $S(\pi/2)$ vale lo mismo.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La ampliación impar es $2\pi-t$ en $(0,\pi)$ y $-2\pi-t$ en $(-\pi,0)$.'
          - texto: 'b) Al ser impar, $a_n=0$ y la serie es $S(t)=\sum \frac{4-2(-1)^{k}}{k}\,\text{sen}(kt)$.'
          - texto: 'c) En $\pi/2$ hay continuidad, así que $S=f=3\pi/2$.'
          - texto: 'c) En $t=0$ la serie vale 0, pero $f(0)$ **no está definida**: el intervalo dado es abierto.'
          - texto: 'c) En $t=0$ la serie vale $2\pi$, porque es el límite de $f$ por la derecha.'
            trampa: true
            mensaje: |
              En una ampliación impar, $t=0$ es siempre un salto salvo que la
              función tienda a cero. Aquí el límite por la derecha es $2\pi$ y
              por la izquierda $-2\pi$, así que la media —y por tanto $S(0)$— es
              **0**, no $2\pi$.
    resolucion: |
      **a) La ampliación impar.** Se refleja cambiando el signo:

      $$
      f_{\text{imp}}(t) = \begin{cases}
      2\pi - t & 0<t<\pi\\[4pt]
      -2\pi - t & -\pi<t<0
      \end{cases}
      $$

      **b) La serie.** Al ser impar, todos los $a_n$ se anulan:

      $$
      S(t) = \sum_{k=1}^{\infty}\frac{4-2(-1)^{k}}{k}\,\text{sen}(kt)
      $$

      **c) Los valores**, y aquí está la gracia:

      | punto | $S$ | $f$ |
      |---|---|---|
      | $t=0$ | $0$ (salto de $-2\pi$ a $2\pi$) | **no definida** |
      | $t=\pi/2$ | $3\pi/2$ | $3\pi/2$ |

      **El origen es un salto**, y uno grande: la ampliación impar salta de
      $-2\pi$ a $2\pi$. La media es 0 — que es siempre el valor de una serie de
      senos en el origen, porque todos los senos se anulan ahí.

      **d) La suma.** Evaluando en $t=\pi/2$, donde los senos de índice par se
      anulan y los impares alternan:

      $$
      \frac{3\pi}{2} = \text{(la serie con solo términos impares)}
      \qquad\Longrightarrow\qquad
      \boxed{\;\sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1} = -\frac{\pi}{4}\;}
      $$

      > **Fíjate en el signo.** La suma sale $-\pi/4$ y no $+\pi/4$, porque el
      > exponente es $n+1$ y no $n-1$: la serie empieza restando. Es el mismo
      > número de siempre con el signo cambiado, y confundirlo es tirar el
      > apartado entero después de haberlo hecho bien.

  # ═══════════════════════════════════════════════════════════════════
  # Boletín básico del tema 11. Los cinco problemas, en seis ejercicios.
  # ═══════════════════════════════════════════════════════════════════

  - id: el-escalon-de-periodo-diez
    titulo: Un escalón de periodo 10, y los tres puntos que hay que redefinir
    fuente: Ejercicio 1 · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $10$ definida de la siguiente
      forma:

      $$
      f(t)=\begin{cases}
      0 & -5<t<0\\[2pt]
      3 & 0<t<5
      \end{cases}
      $$

      (a) Calcular la serie de Fourier de $f(t)$.

      (b) Definir $f(t)$ en los puntos $t=-5$, $t=0$ y $t=5$ para que la serie
      de Fourier converja a $f(t)$ en $[-5,5]$.
    pide: La serie y el valor que hay que dar en los tres puntos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar nada: ¿qué se puede decir de los $a_n$ con $n\ge1$?
        opciones:
          - texto: >-
              Que se anulan todos, porque $f$ menos su media es una función
              **impar**
            correcta: true
            mensaje: |
              Eso es. $f-\tfrac32$ vale $-\tfrac32$ en $(-5,0)$ y $+\tfrac32$
              en $(0,5)$: impar. Y una función impar solo tiene senos. Restar
              la media antes de mirar la paridad es el truco que ahorra la
              mitad de las integrales.
          - texto: >-
              Que no se puede saber sin integrar, porque $f$ no es par ni impar
            mensaje: |
              $f$ tal cual no lo es, cierto. Pero $f-\tfrac32$ sí, y la media
              solo afecta al término constante. Mirar la paridad **después de
              restar la media** es lo que hay que hacer.
          - texto: >-
              Que son todos iguales a $\tfrac32$
            mensaje: |
              $\tfrac32$ es el término constante $\tfrac{a_0}{2}$, que es la
              media de $f$ en un periodo. Los $a_n$ con $n\ge1$ son otra cosa.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_0}{2}$, la media de $f$ en un periodo?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.006
          formato: en forma exacta (3/2) o con un decimal
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el valor de $f$ en media onda. La media pesa las dos
              mitades: la función vale $3$ en la mitad del periodo y $0$ en la
              otra mitad.
          - valor: '0.3'
            mensaje: |
              $0{,}3$ sería $\tfrac{3}{10}$, o sea dividir por el periodo sin
              multiplicar por la longitud del tramo donde $f$ vale $3$.
        pista: |
          $\dfrac{1}{10}\displaystyle\int_{-5}^{5}f(t)\,dt$, y la integral es
          el área de un rectángulo de base $5$ y altura $3$.
        desarrollo: |
          $$
          \frac{a_0}{2} = \frac{1}{10}\int_{-5}^{5} f(t)\,dt
          = \frac{1}{10}\int_{0}^{5} 3\,dt = \frac{15}{10} = \frac32
          $$

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $b_1$?
        respuesta:
          tipo: numero
          valor: '1.9099'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '0.9549'
            mensaje: |
              $\tfrac{3}{\pi}$ es la mitad. El factor $\left(1-\cos n\pi\right)$ vale $2$ para $n$ impar, no $1$.
          - valor: '0'
            mensaje: |
              $0$ es lo que valen los $b_n$ **pares**, donde
              $1-\cos n\pi = 0$. El primero es impar.
        pista: |
          $b_n = \dfrac{3\left(1-\cos n\pi\right)}{n\pi}$, y para $n=1$ el
          paréntesis vale $2$.
        desarrollo: |
          $$
          b_n = \frac{2}{10}\int_{0}^{5} 3\operatorname{sen}\frac{n\pi t}{5}\,dt
          = \frac{3}{n\pi}\left(1-\cos n\pi\right)
          $$

          $$
          b_1 = \frac{6}{\pi} \approx 1{,}9099
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado (b). Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema de Dirichlet dice que en un punto de salto la serie
              converge a la **semisuma** de los dos límites laterales.
          - texto: >-
              En $t=0$ los límites son $0$ por la izquierda y $3$ por la
              derecha: la serie vale $\tfrac32$.
          - texto: >-
              En $t=\pm5$ la periodicidad hace que los límites vuelvan a ser
              $3$ y $0$, así que también vale $\tfrac32$.
          - texto: >-
              Y por eso hay que redefinir $f$ en todos los puntos del
              intervalo, no solo en esos tres.
            trampa: true
            mensaje: |
              En los demás puntos $f$ es continua y la serie ya converge al
              valor que tiene: no hay nada que tocar. Solo los **tres puntos de
              salto** necesitan una definición nueva, y es la que el propio
              teorema impone.
        veredicto: |
          Redefinir $f$ en los saltos no es un capricho: es la única manera de
          que la igualdad $f(t)=S(t)$ sea cierta **en todo** el intervalo. Sin
          eso, la serie y la función discrepan exactamente en tres puntos.
    resolucion: |
      **Resultados.**

      $$
      S(t) = \frac32 + \frac{3}{\pi}\sum_{n=1}^{\infty}
      \frac{1-\cos n\pi}{n}\,\operatorname{sen}\frac{n\pi t}{5}
      $$

      $$
      f(-5) = f(0) = f(5) = \frac32
      $$

      ### 1 · El periodo y la frecuencia

      $T=10$, así que el semiperiodo es $L=5$ y la frecuencia fundamental
      $\omega=\tfrac{2\pi}{10}=\tfrac{\pi}{5}$. Todos los armónicos son
      $\operatorname{sen}\tfrac{n\pi t}{5}$ y $\cos\tfrac{n\pi t}{5}$.

      ### 2 · El término constante

      $$
      \frac{a_0}{2} = \frac{1}{10}\int_{-5}^{5} f
      = \frac{1}{10}\cdot 15 = \frac32
      $$

      ### 3 · Los cosenos, que se van

      $$
      a_n = \frac{2}{10}\int_{0}^{5} 3\cos\frac{n\pi t}{5}\,dt
      = \frac{3}{5}\left[\frac{5}{n\pi}\operatorname{sen}\frac{n\pi t}{5}
      \right]_{0}^{5}
      = \frac{3}{n\pi}\operatorname{sen}n\pi = 0
      $$

      Se podía haber visto sin integrar: $f-\tfrac32$ es impar.

      ### 4 · Los senos

      $$
      b_n = \frac{2}{10}\int_{0}^{5} 3\operatorname{sen}\frac{n\pi t}{5}\,dt
      = \frac{3}{5}\left[-\frac{5}{n\pi}\cos\frac{n\pi t}{5}\right]_{0}^{5}
      = \frac{3\left(1-\cos n\pi\right)}{n\pi}
      $$

      | $n$ | $1-\cos n\pi$ | $b_n$ |
      |---|---|---|
      | impar | $2$ | $\dfrac{6}{n\pi}$ |
      | par | $0$ | $0$ |

      Solo sobreviven los armónicos impares, y su amplitud cae como
      $\tfrac1n$ — la caída lenta típica de una función con saltos.

      ### 5 · Los tres puntos

      El teorema de Dirichlet garantiza que en un salto la serie converge a

      $$
      \frac{f(t^{-})+f(t^{+})}{2}
      $$

      En $t=0$: $\tfrac{0+3}{2}=\tfrac32$. En $t=5$, por la derecha empieza
      otro periodo y vale $0$: $\tfrac{3+0}{2}=\tfrac32$. Y en $t=-5$ lo
      mismo. Definiendo $f$ con ese valor en los tres puntos, la igualdad
      $f=S$ pasa a ser cierta en todo $[-5,5]$.

      Comprobación rápida: en $t=0$ todos los senos se anulan y
      $S(0)=\tfrac32$ ✓, tal y como tenía que salir.

      **Lo que hay que llevarse.** Dos rutinas que se repiten en todo el tema:
      restar la media antes de mirar la paridad, y saber que la serie **nunca**
      reproduce un salto — en el salto da la semisuma, y eso es un resultado,
      no un fallo.

  - id: la-parabola-en-un-periodo-entero
    titulo: La parábola en un periodo entero, que no tiene ninguna simetría
    fuente: Ejercicio 2 (a) · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Desarrollar en serie de Fourier la función periódica
      $f(t)=t^{2}$ con $0<t<2\pi$ y $T=2\pi$.
    pide: La serie de Fourier de $f$.
    pasos:
      - tipo: reconocer
        pregunta: |
          $t^{2}$ es una función par. ¿Se anulan entonces los senos?
        opciones:
          - texto: >-
              No: el periodo es $(0,2\pi)$, y en ese intervalo la función
              **periódica** no es par
            correcta: true
            mensaje: |
              Exacto, y es el error más repetido del tema. La paridad se mira
              sobre un intervalo simétrico respecto del origen. Aquí el
              periodo es $(0,2\pi)$, y la extensión periódica tiene un salto en
              $t=0$ de $4\pi^{2}$ a $0$: nada de simetría.
          - texto: >-
              Sí: $t^{2}$ es par, así que $b_n=0$
            mensaje: |
              $t^{2}$ es par **como fórmula**, pero la función del problema es
              la extensión periódica de $t^{2}$ desde $(0,2\pi)$, y esa no lo
              es. Dibújala: sube de $0$ a $4\pi^{2}$ y cae en vertical.
          - texto: >-
              Sí, y además se anulan los cosenos
            mensaje: |
              No puede ser: si se anularan las dos familias, la serie sería
              constante y la función no lo es.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_0}{2}$?
        respuesta:
          tipo: numero
          valor: '13.1595'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '26.3189'
            mensaje: |
              $\tfrac{8\pi^{2}}{3}$ es el doble: falta dividir la integral
              entre el periodo $2\pi$, no entre $\pi$.
          - valor: '9.8696'
            mensaje: |
              $\pi^{2}$ sería la media si la función fuese $t^{2}$ con
              $-\pi<t<\pi$. Aquí el intervalo es $(0,2\pi)$.
        pista: |
          $\dfrac{1}{2\pi}\displaystyle\int_{0}^{2\pi}t^{2}\,dt$, y
          $\tfrac{4\pi^{2}}{3}\approx13{,}16$.
        desarrollo: |
          $$
          \frac{a_0}{2} = \frac{1}{2\pi}\int_{0}^{2\pi} t^{2}\,dt
          = \frac{1}{2\pi}\cdot\frac{8\pi^{3}}{3} = \frac{4\pi^{2}}{3}
          \approx 13{,}1595
          $$

      - tipo: calcular
        titulo: El segundo coeficiente coseno
        pregunta: |
          Sabiendo que $a_n=\dfrac{4}{n^{2}}$, ¿cuánto vale $a_2$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ sería $\tfrac4n$. El denominador va al cuadrado: los
              coeficientes de una función continua a trozos con salto caen
              como $\tfrac1{n^{2}}$ en los cosenos.
          - valor: '4'
            mensaje: |
              $4$ es $a_1$. Para $n=2$ hay que dividir entre $2^{2}=4$.
        pista: |
          $\dfrac{4}{2^{2}}$.
        desarrollo: |
          $$
          a_2 = \frac{4}{4} = 1
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $T=2\pi$, la frecuencia fundamental es $\omega=1$ y los
              armónicos son $\cos nt$ y $\operatorname{sen}nt$.
          - texto: >-
              Integrando dos veces por partes,
              $a_n=\tfrac{4}{n^{2}}$ y $b_n=-\tfrac{4\pi}{n}$.
          - texto: >-
              Los senos caen como $\tfrac1n$ y los cosenos como
              $\tfrac1{n^{2}}$: la diferencia la produce el salto en $t=0$.
          - texto: >-
              Y como $b_n$ es negativo para todo $n$, la serie converge a un
              valor menor que la función.
            trampa: true
            mensaje: |
              El signo de un coeficiente no dice nada sobre a qué converge la
              serie. La serie converge a $f(t)$ en todos los puntos de
              continuidad, y a $2\pi^{2}$ en el salto — que, por cierto, es la
              semisuma de $4\pi^{2}$ y $0$.
        veredicto: |
          La velocidad con que caen los coeficientes mide lo suave que es la
          función: con salto, $\tfrac1n$; continua con esquina,
          $\tfrac1{n^{2}}$. Aquí conviven las dos porque $t^{2}$ es suave
          dentro del periodo pero salta al empalmarse consigo misma.
    resolucion: |
      **Resultado.**

      $$
      S(t) = \frac{4\pi^{2}}{3}
      + \sum_{n=1}^{\infty}\left(\frac{4}{n^{2}}\cos nt
      - \frac{4\pi}{n}\operatorname{sen}nt\right)
      $$

      ### 1 · Lo primero es dibujarla

      En $(0,2\pi)$ la función sube de $0$ a $4\pi^{2}\approx39{,}5$. Y
      entonces el periodo siguiente empieza otra vez en $0$: **hay un salto de
      $4\pi^{2}$ en cada múltiplo de $2\pi$**. Esa es la razón de que no haya
      ninguna simetría que aprovechar, y de que haya que calcular las dos
      familias de coeficientes.

      ### 2 · El término constante

      $$
      \frac{a_0}{2} = \frac{1}{2\pi}\int_{0}^{2\pi}t^{2}\,dt
      = \frac{4\pi^{2}}{3}
      $$

      ### 3 · Los cosenos

      $$
      a_n = \frac{1}{\pi}\int_{0}^{2\pi}t^{2}\cos nt\,dt
      $$

      Por partes dos veces, con $u=t^{2}$:

      $$
      \int_{0}^{2\pi}t^{2}\cos nt\,dt
      = \left[\frac{t^{2}\operatorname{sen}nt}{n}
      + \frac{2t\cos nt}{n^{2}}
      - \frac{2\operatorname{sen}nt}{n^{3}}\right]_{0}^{2\pi}
      = \frac{4\pi}{n^{2}}
      $$

      porque $\operatorname{sen}2n\pi=0$ y $\cos 2n\pi=1$. Luego
      $a_n=\tfrac{4}{n^{2}}$.

      ### 4 · Los senos

      $$
      \int_{0}^{2\pi}t^{2}\operatorname{sen}nt\,dt
      = \left[-\frac{t^{2}\cos nt}{n}
      + \frac{2t\operatorname{sen}nt}{n^{2}}
      + \frac{2\cos nt}{n^{3}}\right]_{0}^{2\pi}
      = -\frac{4\pi^{2}}{n}
      $$

      y $b_n=-\tfrac{4\pi}{n}$.

      ### 5 · Comprobación

      En $t=0$ todos los senos se anulan y

      $$
      S(0) = \frac{4\pi^{2}}{3} + 4\sum_{n=1}^{\infty}\frac{1}{n^{2}}
      = \frac{4\pi^{2}}{3} + 4\cdot\frac{\pi^{2}}{6}
      = 2\pi^{2}
      $$

      que es exactamente la semisuma $\tfrac{4\pi^{2}+0}{2}$ del salto ✓. Esa
      comprobación, además, **regala** la suma
      $\sum\tfrac1{n^{2}}=\tfrac{\pi^{2}}{6}$ si se lee al revés.

      **Lo que hay que llevarse.** «$t^{2}$ es par» no vale de nada si el
      periodo no está centrado en el origen. La paridad se mira sobre la
      función periódica dibujada, no sobre la fórmula.

  - id: cuatro-desarrollos-del-boletin
    titulo: Cuatro desarrollos más, y uno de los resultados no cuadra
    fuente: Ejercicio 2 (b)–(e) · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Desarrollar en serie de Fourier las siguientes funciones periódicas:

      (b) $f(t)=\begin{cases}8 & 0<t<2\\ -8 & 2<t<4\end{cases}$ &nbsp;&nbsp;
      con $T=4$

      (c) $f(t)=\begin{cases}-t & -4\le t\le0\\ t & 0\le t\le4\end{cases}$
      &nbsp;&nbsp; con $T=8$

      (d) $f(t)=4t$, &nbsp; $0<t<10$, &nbsp; $T=10$

      (e) $f(t)=\begin{cases}2t & 0\le t<3\\ 0 & -3<t<0\end{cases}$
      &nbsp;&nbsp; con $T=6$
    pide: Las cuatro series de Fourier.
    pasos:
      - tipo: reconocer
        pregunta: |
          Tres de las cuatro tienen una simetría aprovechable. ¿Cuál es la que
          **no** tiene ninguna?
        opciones:
          - texto: >-
              La (e), porque vale $2t$ a la derecha y $0$ a la izquierda
            correcta: true
            mensaje: |
              Eso es, y por eso es la única con las dos familias de
              coeficientes no nulas. La (b) es impar, la (c) es par, y la (d)
              es impar una vez restada su media $20$.
          - texto: >-
              La (c), porque está definida a trozos
            mensaje: |
              La (c) es $\lvert t\rvert$ en $(-4,4)$: **par**, y por tanto sin
              senos. Estar definida a trozos no impide tener simetría.
          - texto: >-
              La (d), porque $4t$ no es par ni impar en $(0,10)$
            mensaje: |
              Restando la media: $4t-20$ es impar respecto del centro del
              periodo, $t=5$. Solo hay senos, y así sale.

      - tipo: calcular
        titulo: El primer armónico de la (b)
        pregunta: |
          ¿Cuánto vale $b_1$ en el apartado (b)?
        respuesta:
          tipo: numero
          valor: '10.1859'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '20.3718'
            mensaje: |
              $\tfrac{64}{\pi}$ es **el doble**, y es lo que da el resultado
              impreso en el boletín. Ahí hay una errata: el coeficiente que
              antecede al sumatorio debería ser $\tfrac{16}{\pi}$, no
              $\tfrac{32}{\pi}$.
          - valor: '5.0930'
            mensaje: |
              $\tfrac{16}{\pi}$ es la mitad. El factor $1-\cos n\pi$ vale $2$
              para $n$ impar, y $n=1$ lo es.
        pista: |
          Una onda cuadrada de amplitud $A$ tiene $b_n=\tfrac{4A}{n\pi}$ para
          $n$ impar, y aquí $A=8$.
        desarrollo: |
          $$
          b_n = \frac{2}{4}\int_{0}^{4} f\operatorname{sen}\frac{n\pi t}{2}\,dt
          = \frac{16\left(1-\cos n\pi\right)}{n\pi}
          $$

          $$
          b_1 = \frac{32}{\pi} \approx 10{,}1859
          $$

          Que es el resultado clásico $\tfrac{4A}{\pi}$ con $A=8$.

      - tipo: calcular
        titulo: El primer armónico de la (c)
        pregunta: |
          ¿Cuánto vale $a_1$ en el apartado (c)?
        respuesta:
          tipo: numero
          valor: '-1.6211'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '1.6211'
            mensaje: |
              El signo. $\cos n\pi - 1$ vale $-2$ para $n$ impar, así que el
              coeficiente sale negativo.
          - valor: '-0.8106'
            mensaje: |
              $-\tfrac{8}{\pi^{2}}$ es la mitad: el factor
              $1-\cos n\pi$ vale $2$ para $n=1$, no $1$.
        pista: |
          $a_n = -\dfrac{8\left(1-\cos n\pi\right)}{n^{2}\pi^{2}}$, y
          $\tfrac{16}{\pi^{2}}\approx1{,}62$.
        desarrollo: |
          $$
          a_1 = -\frac{8\cdot 2}{\pi^{2}} = -\frac{16}{\pi^{2}}
          \approx -1{,}6211
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre la errata de la (b). Una pieza es falsa.
        piezas:
          - texto: >-
              Una onda cuadrada que vale $+A$ media onda y $-A$ la otra tiene
              $b_n=\tfrac{2A\left(1-\cos n\pi\right)}{n\pi}$.
          - texto: >-
              Con $A=8$ eso es $\tfrac{16\left(1-\cos n\pi\right)}{n\pi}$, o
              sea $\tfrac{32}{n\pi}$ para $n$ impar.
          - texto: >-
              El boletín imprime $\tfrac{32}{\pi}$ delante del sumatorio, que
              es el doble de lo que debe ser.
          - texto: >-
              Y como el error es un factor constante, la serie sigue
              convergiendo a $f$, solo que más despacio.
            trampa: true
            mensaje: |
              No converge a $f$: converge a $2f$. Multiplicar todos los
              coeficientes por $2$ duplica la suma. Con el resultado impreso,
              la serie valdría $16$ donde la función vale $8$.
        veredicto: |
          La comprobación que caza la errata cabe en una línea: en
          $t=1$ la serie debe valer $8$, y con el coeficiente impreso vale
          $16$. **Evaluar la serie en un punto fácil** es la forma más barata
          de auditar un desarrollo.
    resolucion: |
      **Los cuatro.**

      $$
      \text{(b)}\quad S(t) = \frac{16}{\pi}\sum_{n=1}^{\infty}
      \frac{1-\cos n\pi}{n}\operatorname{sen}\frac{n\pi t}{2}
      $$

      $$
      \text{(c)}\quad S(t) = 2 - \frac{8}{\pi^{2}}\sum_{n=1}^{\infty}
      \frac{1-\cos n\pi}{n^{2}}\cos\frac{n\pi t}{4}
      $$

      $$
      \text{(d)}\quad S(t) = 20 - \frac{40}{\pi}\sum_{n=1}^{\infty}
      \frac{1}{n}\operatorname{sen}\frac{n\pi t}{5}
      $$

      $$
      \text{(e)}\quad S(t) = \frac32 + \sum_{n=1}^{\infty}\left(
      \frac{6\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}\cos\frac{n\pi t}{3}
      - \frac{6\cos n\pi}{n\pi}\operatorname{sen}\frac{n\pi t}{3}\right)
      $$

      ### 1 · La tabla que organiza el trabajo

      | ap. | $T$ | simetría | qué hay que calcular |
      |---|---|---|---|
      | (b) | $4$ | impar | solo $b_n$ |
      | (c) | $8$ | par | solo $a_0$ y $a_n$ |
      | (d) | $10$ | impar tras restar $20$ | $a_0$ y $b_n$ |
      | (e) | $6$ | ninguna | todo |

      ### 2 · (b), la onda cuadrada

      $$
      b_n = \frac12\int_{0}^{4}f\operatorname{sen}\frac{n\pi t}{2}\,dt
      = \frac12\cdot 8\cdot\frac{2}{n\pi}\cdot 2\left(1-\cos n\pi\right)
      = \frac{16\left(1-\cos n\pi\right)}{n\pi}
      $$

      Para $n$ impar, $\tfrac{32}{n\pi}$ — el clásico $\tfrac{4A}{n\pi}$ con
      $A=8$.

      > **Errata del boletín.** El resultado impreso lleva $\tfrac{32}{\pi}$
      > delante del sumatorio, que da el doble de lo debido. Comprobado por
      > integración numérica y contra la fórmula estándar de la onda cuadrada:
      > el coeficiente correcto es $\tfrac{16}{\pi}$.

      ### 3 · (c), el pico triangular

      Es $\lvert t\rvert$ en $(-4,4)$, función **par**: $b_n=0$.

      $$
      \frac{a_0}{2} = \frac18\int_{-4}^{4}\lvert t\rvert\,dt = 2
      \qquad
      a_n = \frac12\cdot 2\int_{0}^{4}t\cos\frac{n\pi t}{4}\,dt
      = \frac{8\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}
      $$

      Los coeficientes caen como $\tfrac1{n^{2}}$: la función es continua, sin
      saltos, y solo tiene esquinas.

      ### 4 · (d), el diente de sierra

      $$
      \frac{a_0}{2} = \frac{1}{10}\int_{0}^{10}4t\,dt = 20
      \qquad
      b_n = \frac15\int_{0}^{10}4t\operatorname{sen}\frac{n\pi t}{5}\,dt
      = -\frac{40}{n\pi}
      $$

      Caída $\tfrac1n$, la firma del salto en cada múltiplo de $10$.

      ### 5 · (e), la que no tiene simetría

      $$
      \frac{a_0}{2} = \frac16\int_{0}^{3}2t\,dt = \frac32
      $$

      $$
      a_n = \frac13\int_{0}^{3}2t\cos\frac{n\pi t}{3}\,dt
      = \frac{6\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}
      $$

      $$
      b_n = \frac13\int_{0}^{3}2t\operatorname{sen}\frac{n\pi t}{3}\,dt
      = -\frac{6\cos n\pi}{n\pi}
      $$

      **Lo que hay que llevarse.** Antes de integrar, la tabla: periodo,
      simetría, y qué familias hay que calcular. Y al terminar, evaluar la
      serie en un punto donde la función se conozca — es lo que ha destapado la
      errata de la (b).

  - id: senos-y-cosenos-de-la-misma-recta
    titulo: La misma recta, desarrollada en senos y en cosenos
    fuente: Ejercicio 3 · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(t)=t$ con $0<t<2$.

      (a) Desarrollar la función en serie de senos.

      (b) Desarrollar la función en serie de cosenos.
    pide: Las dos series de medio rango.
    pasos:
      - tipo: reconocer
        pregunta: |
          La función es la misma en $(0,2)$. ¿Cómo pueden salir dos series
          distintas?
        opciones:
          - texto: >-
              Porque se está **eligiendo** cómo prolongarla fuera de $(0,2)$:
              impar para la de senos, par para la de cosenos
            correcta: true
            mensaje: |
              Eso es. Dentro de $(0,2)$ las dos series valen lo mismo —$t$—;
              fuera representan funciones distintas. La libertad está en la
              extensión, no en el intervalo dado.
          - texto: >-
              Porque una de las dos está mal
            mensaje: |
              Las dos son correctas. Una función definida en medio periodo
              admite infinitas extensiones periódicas, y dos de ellas —la par y
              la impar— son especialmente cómodas.
          - texto: >-
              Porque el periodo es distinto en cada caso
            mensaje: |
              En los dos casos la extensión tiene periodo $4$: se refleja el
              intervalo $(0,2)$ y se repite. Lo que cambia es **cómo** se
              refleja.

      - tipo: calcular
        titulo: El primer seno
        pregunta: |
          En la serie de senos, ¿cuánto vale $b_1$?
        respuesta:
          tipo: numero
          valor: '1.2732'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '-1.2732'
            mensaje: |
              El signo. $b_n=-\tfrac{4\cos n\pi}{n\pi}$, y para $n=1$ el coseno
              vale $-1$: los dos signos se cancelan.
          - valor: '0.6366'
            mensaje: |
              $\tfrac{2}{\pi}$ es la mitad. La fórmula de medio rango lleva el
              factor $\tfrac{2}{L}$ con $L=2$, o sea $1$, y la integral da
              $\tfrac{4}{\pi}$.
        pista: |
          $b_n=-\dfrac{4\cos n\pi}{n\pi}$, y $\tfrac4\pi\approx1{,}27$.
        desarrollo: |
          $$
          b_n = \int_{0}^{2}t\operatorname{sen}\frac{n\pi t}{2}\,dt
          = -\frac{4\cos n\pi}{n\pi}
          $$

          $$
          b_1 = -\frac{4\cdot(-1)}{\pi} = \frac{4}{\pi} \approx 1{,}2732
          $$

      - tipo: calcular
        titulo: El primer coseno
        pregunta: |
          En la serie de cosenos, ¿cuánto vale $a_1$?
        respuesta:
          tipo: numero
          valor: '-0.8106'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '0.8106'
            mensaje: |
              El signo. $\cos n\pi - 1$ vale $-2$ para $n$ impar, así que
              $a_1$ es negativo.
          - valor: '-0.4053'
            mensaje: |
              $-\tfrac{4}{\pi^{2}}$ es la mitad: el paréntesis
              $\cos\pi-1$ vale $-2$, no $-1$.
        pista: |
          $a_n=\dfrac{4\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}$, y
          $\tfrac{8}{\pi^{2}}\approx0{,}81$.
        desarrollo: |
          $$
          a_1 = \frac{4\left(-1-1\right)}{\pi^{2}} = -\frac{8}{\pi^{2}}
          \approx -0{,}8106
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La extensión impar de $t$ desde $(0,2)$ es el diente de sierra
              de periodo $4$, con salto en $t=\pm2$.
          - texto: >-
              La extensión par es la onda triangular, continua en todas
              partes, con esquinas en $t=\pm2$.
          - texto: >-
              Por eso los senos caen como $\tfrac1n$ y los cosenos como
              $\tfrac1{n^{2}}$: la par converge mucho más deprisa.
          - texto: >-
              Y por eso la serie de cosenos es la correcta y la de senos hay
              que descartarla.
            trampa: true
            mensaje: |
              Las dos son correctas: dentro de $(0,2)$ ambas valen $t$. La de
              cosenos converge más deprisa, y eso la hace **preferible en la
              práctica**, pero no convierte a la otra en falsa. En $t=2$ sí
              discrepan: la de senos vale $0$ y la de cosenos vale $2$.
        veredicto: |
          Elegir la extensión es elegir cómo se comporta la serie fuera del
          intervalo y en los extremos. La par evita el salto, y por eso
          converge más rápido — es la que conviene si se va a truncar.
    resolucion: |
      **Resultados.**

      $$
      \text{(a)}\quad S(t) = \sum_{n=1}^{\infty}\frac{-4}{n\pi}\cos(n\pi)
      \operatorname{sen}\frac{n\pi t}{2}
      $$

      $$
      \text{(b)}\quad S(t) = 1 + \sum_{n=1}^{\infty}
      \frac{4}{n^{2}\pi^{2}}\left(\cos n\pi-1\right)\cos\frac{n\pi t}{2}
      $$

      ### 1 · Qué significa «serie de senos»

      Significa: extiende $f$ a $(-2,0)$ de forma **impar** y después
      periódicamente con $T=4$. Una función impar solo tiene senos, así que
      $a_n=0$ automáticamente y

      $$
      b_n = \frac{2}{L}\int_{0}^{L}f(t)\operatorname{sen}\frac{n\pi t}{L}\,dt,
      \qquad L=2
      $$

      ### 2 · Los senos

      $$
      b_n = \int_{0}^{2}t\operatorname{sen}\frac{n\pi t}{2}\,dt
      $$

      Por partes, con $k=\tfrac{n\pi}{2}$:

      $$
      \left[-\frac{t\cos kt}{k}\right]_{0}^{2}
      + \left[\frac{\operatorname{sen}kt}{k^{2}}\right]_{0}^{2}
      = -\frac{2\cos n\pi}{k} = -\frac{4\cos n\pi}{n\pi}
      $$

      Para $n$ impar sale $+\tfrac{4}{n\pi}$ y para $n$ par
      $-\tfrac{4}{n\pi}$: **todos los armónicos aparecen**, con signo
      alternado.

      ### 3 · Los cosenos

      $$
      \frac{a_0}{2} = \frac{1}{2}\int_{0}^{2}t\,dt = 1
      \qquad
      a_n = \int_{0}^{2}t\cos\frac{n\pi t}{2}\,dt
      = \frac{4\left(\cos n\pi-1\right)}{n^{2}\pi^{2}}
      $$

      Aquí los pares se anulan —$\cos n\pi=1$— y solo quedan los impares, con
      amplitud $-\tfrac{8}{n^{2}\pi^{2}}$.

      ### 4 · Las dos, comparadas

      | | senos | cosenos |
      |---|---|---|
      | extensión | diente de sierra | onda triangular |
      | continuidad | salto en $t=\pm2$ | continua |
      | caída | $\tfrac1n$ | $\tfrac1{n^{2}}$ |
      | valor en $t=2$ | $0$ (semisuma del salto) | $2$ |

      En $t=1$ las dos valen $1$, como debe ser. En $t=2$ discrepan, y esa
      discrepancia es la mejor manera de entender qué significa elegir una
      extensión.

      **Lo que hay que llevarse.** Un problema de medio rango no pregunta por
      la función: pregunta por la **extensión**. Y el precio de cada elección
      se lee en la velocidad de caída de los coeficientes.

  - id: la-serie-de-cosenos-del-seno
    titulo: El seno desarrollado en cosenos, y el armónico que falta
    fuente: Ejercicio 4 · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Desarrollar en serie de cosenos la función $f(t)=\operatorname{sen}t$
      con $0<t<\pi$.
    pide: La serie de cosenos de $f$.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función periódica es la extensión par de
          $\operatorname{sen}t$ desde $(0,\pi)$?
        opciones:
          - texto: >-
              $\lvert\operatorname{sen}t\rvert$, la onda rectificada de doble
              onda, de periodo $\pi$
            correcta: true
            mensaje: |
              Eso es, y es una función que aparece en electrónica: la salida de
              un rectificador de onda completa. Continua en todas partes, con
              esquinas en cada múltiplo de $\pi$.
          - texto: >-
              $\operatorname{sen}t$ otra vez
            mensaje: |
              $\operatorname{sen}t$ es **impar**. Su extensión par desde
              $(0,\pi)$ tiene que valer $\operatorname{sen}(-t)$ reflejado, o
              sea $+\operatorname{sen}\lvert t\rvert$.
          - texto: >-
              $\cos t$
            mensaje: |
              $\cos t$ es par, sí, pero no coincide con
              $\operatorname{sen}t$ en $(0,\pi)$, que es lo que se pide.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_0}{2}$?
        respuesta:
          tipo: numero
          valor: '0.6366'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '1.2732'
            mensaje: |
              $\tfrac{4}{\pi}$ es el doble. La media es
              $\tfrac{1}{\pi}\int_{0}^{\pi}\operatorname{sen}t\,dt$, y esa
              integral vale $2$.
          - valor: '0.3183'
            mensaje: |
              $\tfrac{1}{\pi}$ olvida que
              $\int_{0}^{\pi}\operatorname{sen}t\,dt=2$, no $1$.
        pista: |
          $\dfrac{1}{\pi}\displaystyle\int_{0}^{\pi}\operatorname{sen}t\,dt$, y
          $\tfrac2\pi\approx0{,}64$.
        desarrollo: |
          $$
          \frac{a_0}{2} = \frac{1}{\pi}\int_{0}^{\pi}\operatorname{sen}t\,dt
          = \frac{1}{\pi}\left[-\cos t\right]_{0}^{\pi} = \frac{2}{\pi}
          \approx 0{,}6366
          $$

      - tipo: calcular
        titulo: El primer armónico que sobrevive
        pregunta: |
          ¿Cuánto vale $a_2$?
        respuesta:
          tipo: numero
          valor: '-0.4244'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '0.4244'
            mensaje: |
              El signo. La fórmula es
              $a_n=-\tfrac{2}{\pi}\cdot\tfrac{1+\cos n\pi}{n^{2}-1}$, y con
              $n=2$ tanto el numerador como el denominador son positivos.
          - valor: '-0.2122'
            mensaje: |
              $-\tfrac{2}{3\pi}$ es la mitad: el paréntesis
              $1+\cos 2\pi$ vale $2$, no $1$.
        pista: |
          $a_n = -\dfrac{2\left(1+\cos n\pi\right)}{\pi\left(n^{2}-1\right)}$,
          y con $n=2$ el denominador vale $3$.
        desarrollo: |
          $$
          a_2 = -\frac{2\left(1+1\right)}{\pi\cdot 3} = -\frac{4}{3\pi}
          \approx -0{,}4244
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula general $a_n=\tfrac{2}{\pi}\cdot \tfrac{1+\cos n\pi}{1-n^{2}}$ se obtiene convirtiendo el producto
              $\operatorname{sen}t\cos nt$ en suma.
          - texto: >-
              Esa fórmula no vale para $n=1$, porque el denominador se anula:
              $a_1$ hay que calcularlo aparte.
          - texto: >-
              Y sale $a_1=\tfrac{2}{\pi}\int_{0}^{\pi}\operatorname{sen}t\cos t \,dt=0$, así que el sumatorio empieza en $n=2$.
          - texto: >-
              Y los $a_n$ impares con $n\ge3$ también hay que calcularlos
              aparte, por el mismo motivo.
            trampa: true
            mensaje: |
              Para $n\ge3$ el denominador $1-n^{2}$ no se anula y la fórmula
              general sirve. Lo que pasa con los impares es otra cosa: el
              numerador $1+\cos n\pi$ vale $0$, así que **se anulan**, pero eso
              lo dice la propia fórmula sin necesidad de calcular nada aparte.
        veredicto: |
          El caso $n=1$ es singular porque el denominador se anula, y hay que
          tratarlo por separado. Los demás impares se anulan por el numerador,
          que es un motivo distinto y no exige cálculo adicional.
    resolucion: |
      **Resultado.**

      $$
      S(t) = \frac{2}{\pi} - \frac{2}{\pi}\sum_{n=2}^{\infty}
      \left(\frac{1+\cos n\pi}{n^{2}-1}\cos nt\right)
      $$

      ### 1 · La extensión

      Extendiendo $\operatorname{sen}t$ de forma par desde $(0,\pi)$ se obtiene
      $\lvert\operatorname{sen}t\rvert$, de periodo $\pi$. Por ser par,
      $b_n=0$, y

      $$
      \frac{a_0}{2} = \frac{1}{\pi}\int_{0}^{\pi}\operatorname{sen}t\,dt
      = \frac{2}{\pi}
      \qquad
      a_n = \frac{2}{\pi}\int_{0}^{\pi}\operatorname{sen}t\cos nt\,dt
      $$

      ### 2 · La integral, convirtiendo producto en suma

      $$
      \operatorname{sen}t\cos nt
      = \frac12\Bigl[\operatorname{sen}\left(1+n\right)t
      + \operatorname{sen}\left(1-n\right)t\Bigr]
      $$

      $$
      \int_{0}^{\pi}\operatorname{sen}t\cos nt\,dt
      = \frac12\left[\frac{1-\cos(1+n)\pi}{1+n}
      + \frac{1-\cos(1-n)\pi}{1-n}\right]
      $$

      Y como $\cos(1\pm n)\pi = -\cos n\pi$:

      $$
      = \frac{1+\cos n\pi}{1-n^{2}}
      \qquad\Longrightarrow\qquad
      a_n = \frac{2}{\pi}\cdot\frac{1+\cos n\pi}{1-n^{2}}
      $$

      ### 3 · Los dos casos que hay que mirar aparte

      **$n=1$.** La fórmula da $\tfrac00$. Volviendo a la integral:

      $$
      a_1 = \frac{2}{\pi}\int_{0}^{\pi}\operatorname{sen}t\cos t\,dt
      = \frac{1}{\pi}\int_{0}^{\pi}\operatorname{sen}2t\,dt = 0
      $$

      Tenía que salir $0$: $\lvert\operatorname{sen}t\rvert$ tiene periodo
      $\pi$, o sea que solo contiene armónicos de frecuencia par.

      **$n$ impar, $n\ge3$.** El numerador $1+\cos n\pi$ vale $0$, así que
      todos se anulan. La misma razón de fondo, vista desde la fórmula.

      ### 4 · Los primeros términos

      $$
      S(t) = \frac{2}{\pi} - \frac{4}{3\pi}\cos 2t
      - \frac{4}{15\pi}\cos 4t - \frac{4}{35\pi}\cos 6t - \dots
      $$

      Los denominadores son $n^{2}-1$ con $n$ par: $3$, $15$, $35$, $63$. La
      caída es $\tfrac1{n^{2}}$, coherente con una función continua y con
      esquinas.

      Comprobación: en $t=\tfrac{\pi}{2}$ la función vale $1$, y

      $$
      \frac{2}{\pi}\left(1 + \frac{2}{3} - \frac{2}{15} + \dots\right)
      $$

      converge a $1$, que es lo que se esperaba.

      **Lo que hay que llevarse.** Cuando una fórmula de coeficientes tiene un
      denominador que se anula para algún $n$, ese $n$ **no está cubierto** y
      hay que integrarlo aparte. Escribir el sumatorio desde $n=2$ sin decir
      por qué es la mitad de la respuesta.

  - id: dos-identidades-y-cuatro-sumas
    titulo: Dos identidades de Fourier, y cuatro sumas que salen de ellas
    fuente: Ejercicio 5 · Problemas, tema 11 · Cálculo, UPV/EHU
    nivel: examen
    enunciado: |
      Demostrar que en el intervalo $0\le t\le\pi$ se verifican las siguientes
      igualdades:

      (a)

      $$
      t(\pi-t) = \frac{\pi^{2}}{6} - \left(\frac{\cos 2t}{1^{2}}
      + \frac{\cos 4t}{2^{2}} + \frac{\cos 6t}{3^{2}} + \dots\right)
      $$

      (b)

      $$
      t(\pi-t) = \frac{8}{\pi}\left(\frac{\operatorname{sen}t}{1^{3}}
      + \frac{\operatorname{sen}3t}{3^{3}}
      + \frac{\operatorname{sen}5t}{5^{3}} + \dots\right)
      $$

      (c) Utilizando los apartados anteriores demostrar que

      $$
      \text{(c.1)}\quad \sum_{n=1}^{\infty}\frac{1}{n^{2}}
      = \frac{\pi^{2}}{6}
      $$

      $$
      \text{(c.2)}\quad \sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^{2}}
      = \frac{\pi^{2}}{12}
      $$

      $$
      \text{(c.3)}\quad \sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{(2n-1)^{3}}
      = \frac{\pi^{3}}{32}
      $$

      $$
      \text{(c.4)}\quad \frac{1}{1^{3}} + \frac{1}{3^{3}} - \frac{1}{5^{3}}
      - \frac{1}{7^{3}} + \frac{1}{9^{3}} + \frac{1}{11^{3}} - \dots
      = \frac{3\pi^{3}\sqrt2}{128}
      $$
    pide: Las dos identidades y las cuatro sumas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale cada una de las cuatro sumas?
        opciones:
          - texto: >-
              De evaluar (a) o (b) en un punto bien elegido: $t=0$,
              $t=\tfrac\pi2$ y $t=\tfrac\pi4$
            correcta: true
            mensaje: |
              Eso es. Una identidad válida en todo el intervalo se convierte en
              una suma numérica en cuanto se fija $t$. Todo el arte está en
              elegir el punto donde los senos o cosenos valgan algo cómodo.
          - texto: >-
              De derivar las dos identidades
            mensaje: |
              Derivar cambiaría los exponentes de los denominadores, y además
              derivar una serie de Fourier término a término no siempre es
              legítimo. No hace falta: basta sustituir.
          - texto: >-
              De integrar entre $0$ y $\pi$
            mensaje: |
              Integrar daría $0$ en casi todos los términos y no produciría
              estas sumas. La herramienta aquí es **evaluar**.

      - tipo: calcular
        titulo: La suma de Basilea
        pregunta: |
          Evaluando (a) en $t=0$, ¿cuánto vale
          $\sum_{n=1}^{\infty}\tfrac{1}{n^{2}}$?
        respuesta:
          tipo: numero
          valor: '1.644934'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.822467'
            mensaje: |
              $\tfrac{\pi^{2}}{12}$ es la suma **alternada**, la del apartado
              (c.2). La de (c.1) tiene todos los términos positivos y es el
              doble.
          - valor: '1.2337'
            mensaje: |
              $\tfrac{\pi^{2}}{8}$ es la suma de $\tfrac{1}{n^{2}}$ solo sobre
              los impares. Aquí entran todos los enteros.
        pista: |
          En $t=0$ el miembro izquierdo vale $0$ y todos los cosenos valen
          $1$.
        desarrollo: |
          $$
          0 = \frac{\pi^{2}}{6} - \sum_{n=1}^{\infty}\frac{1}{n^{2}}
          \quad\Longrightarrow\quad
          \sum_{n=1}^{\infty}\frac{1}{n^{2}} = \frac{\pi^{2}}{6}
          \approx 1{,}644934
          $$

      - tipo: calcular
        titulo: La suma con el patrón + + − −
        pregunta: |
          Evaluando (b) en $t=\tfrac{\pi}{4}$, ¿cuánto vale
          $\tfrac{1}{1^{3}}+\tfrac{1}{3^{3}}-\tfrac{1}{5^{3}} -\tfrac{1}{7^{3}}+\dots$?
        respuesta:
          tipo: numero
          valor: '1.027723'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.968946'
            mensaje: |
              $\tfrac{\pi^{3}}{32}$ es la suma de (c.3), con el patrón
              $+\,-\,+\,-$. Esta otra alterna de dos en dos y sale algo mayor.
          - valor: '0.726543'
            mensaje: |
              $\tfrac{3\pi^{3}}{128}$ olvida el $\sqrt2$, que viene de que
              $\operatorname{sen}\tfrac{\pi}{4}=\tfrac{\sqrt2}{2}$ y hay que
              despejarlo.
        pista: |
          Los senos valen $\tfrac{\sqrt2}{2}$, $\tfrac{\sqrt2}{2}$,
          $-\tfrac{\sqrt2}{2}$, $-\tfrac{\sqrt2}{2}$, y así sucesivamente.
        desarrollo: |
          $$
          \frac{\pi}{4}\cdot\frac{3\pi}{4} = \frac{3\pi^{2}}{16}
          = \frac{8}{\pi}\cdot\frac{\sqrt2}{2}\left(
          \frac{1}{1^{3}}+\frac{1}{3^{3}}-\frac{1}{5^{3}}-\dots\right)
          $$

          $$
          \text{suma} = \frac{3\pi^{2}}{16}\cdot\frac{\pi}{8}
          \cdot\frac{2}{\sqrt2} = \frac{3\pi^{3}\sqrt2}{128}
          \approx 1{,}027723
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $t(\pi-t)$ es simétrica respecto de $t=\tfrac\pi2$ y se anula en
              los dos extremos: por eso admite las dos representaciones.
          - texto: >-
              La (a) es su serie de cosenos de periodo $\pi$, y la (b) su serie
              de senos en $(0,\pi)$.
          - texto: >-
              Las dos son continuas en $[0,\pi]$, así que la igualdad vale en
              **todo** el intervalo cerrado, extremos incluidos.
          - texto: >-
              Y por eso los dos desarrollos convergen a la misma velocidad.
            trampa: true
            mensaje: |
              No: la (a) cae como $\tfrac1{n^{2}}$ y la (b) como
              $\tfrac1{n^{3}}$. La de senos es mucho más rápida porque su
              extensión impar es más suave —no tiene esquinas—, y por eso es la
              que produce las sumas cúbicas.
        veredicto: |
          Las dos identidades son el mismo objeto visto de dos maneras, y la
          diferencia de suavidad de sus extensiones se lee directamente en el
          exponente del denominador: $n^{2}$ frente a $n^{3}$.
    resolucion: |
      **Las dos identidades y las cuatro sumas.**

      ### 1 · La identidad (a)

      La extensión par de $t(\pi-t)$ desde $(0,\pi)$ tiene periodo $\pi$, así
      que sus armónicos son $\cos 2nt$.

      $$
      \frac{a_0}{2} = \frac{1}{\pi}\int_{0}^{\pi}\left(\pi t-t^{2}\right)dt
      = \frac{1}{\pi}\left(\frac{\pi^{3}}{2}-\frac{\pi^{3}}{3}\right)
      = \frac{\pi^{2}}{6}
      $$

      $$
      a_n = \frac{2}{\pi}\int_{0}^{\pi}\left(\pi t-t^{2}\right)\cos 2nt\,dt
      = -\frac{1}{n^{2}}
      $$

      lo que da exactamente la identidad (a).

      ### 2 · La identidad (b)

      La extensión impar desde $(0,\pi)$ tiene periodo $2\pi$:

      $$
      b_n = \frac{2}{\pi}\int_{0}^{\pi}\left(\pi t-t^{2}\right)
      \operatorname{sen}nt\,dt
      = \frac{4\left(1-\cos n\pi\right)}{\pi n^{3}}
      $$

      Para $n$ par vale $0$; para $n$ impar, $\tfrac{8}{\pi n^{3}}$. Esa es la
      identidad (b).

      ### 3 · Las cuatro sumas, una por punto

      | suma | dónde se evalúa | qué queda |
      |---|---|---|
      | (c.1) | (a) en $t=0$ | $0=\tfrac{\pi^{2}}{6}-\sum\tfrac1{n^{2}}$ |
      | (c.2) | (a) en $t=\tfrac\pi2$ | $\tfrac{\pi^{2}}{4}=\tfrac{\pi^{2}}{6}-\sum\tfrac{\cos n\pi}{n^{2}}$ |
      | (c.3) | (b) en $t=\tfrac\pi2$ | $\tfrac{\pi^{2}}{4}=\tfrac8\pi\sum\tfrac{(-1)^{n-1}}{(2n-1)^{3}}$ |
      | (c.4) | (b) en $t=\tfrac\pi4$ | $\tfrac{3\pi^{2}}{16}=\tfrac8\pi\cdot\tfrac{\sqrt2}{2}\cdot\text{suma}$ |

      **(c.2)** con más detalle: en $t=\tfrac\pi2$ el coseno $\cos 2nt$ pasa a
      valer $\cos n\pi=(-1)^{n}$, así que

      $$
      \frac{\pi}{2}\cdot\frac{\pi}{2}
      = \frac{\pi^{2}}{6} - \sum_{n=1}^{\infty}\frac{(-1)^{n}}{n^{2}}
      = \frac{\pi^{2}}{6} + \sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^{2}}
      $$

      y despejando,
      $\sum\tfrac{(-1)^{n-1}}{n^{2}} = \tfrac{\pi^{2}}{4}-\tfrac{\pi^{2}}{6} = \tfrac{\pi^{2}}{12}$.

      **(c.4)** con más detalle: los senos en $t=\tfrac\pi4$ siguen el patrón

      $$
      \operatorname{sen}\frac{\pi}{4},\;
      \operatorname{sen}\frac{3\pi}{4},\;
      \operatorname{sen}\frac{5\pi}{4},\;
      \operatorname{sen}\frac{7\pi}{4},\;\dots
      = \frac{\sqrt2}{2},\;\frac{\sqrt2}{2},\;
      -\frac{\sqrt2}{2},\;-\frac{\sqrt2}{2},\;\dots
      $$

      que es exactamente el patrón $+\,+\,-\,-$ del enunciado.

      ### 4 · Los cuatro valores

      | suma | valor exacto | decimal |
      |---|---|---|
      | (c.1) | $\tfrac{\pi^{2}}{6}$ | $1{,}644934$ |
      | (c.2) | $\tfrac{\pi^{2}}{12}$ | $0{,}822467$ |
      | (c.3) | $\tfrac{\pi^{3}}{32}$ | $0{,}968946$ |
      | (c.4) | $\tfrac{3\pi^{3}\sqrt2}{128}$ | $1{,}027723$ |

      Los cuatro comprobados sumando las series numéricamente.

      **Lo que hay que llevarse.** Una serie de Fourier es una máquina de
      fabricar sumas numéricas: se evalúa en un punto donde los armónicos
      valgan algo reconocible y se despeja. Los puntos que casi siempre
      funcionan son $0$, $\tfrac\pi2$, $\tfrac\pi4$ y $\pi$.

