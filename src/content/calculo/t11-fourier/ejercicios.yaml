  - id: nueve-funciones-par-impar-o-ninguna
    titulo: Nueve funciones, y la tercera casilla que casi nadie marca
    fuente: Ejercicio 11.3 · Problemas complementarios, tema 11 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar si las siguientes funciones son pares o impares:

      (a) $f(t)=1-t^{2}$ &nbsp;&nbsp; (d) $f(t)=2t^{3}+3t^{2}-5t+1$
      &nbsp;&nbsp; (g) $f(t)=e^{t}-e^{-t}$

      (b) $f(t)=1-t$ &nbsp;&nbsp; (e) $f(t)=e^{t}$ &nbsp;&nbsp;
      (h) $f(t)=\operatorname{sen}t\cos t$

      (c) $f(t)=2t^{3}-4t$ &nbsp;&nbsp; (f) $f(t)=e^{t}+e^{-t}$
      &nbsp;&nbsp; (i) $f(t)=\operatorname{sen}t+\cos t$
    pide: La clasificación de las nueve.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué pasa con $f(t)=1-t$?
        opciones:
          - texto: >-
              Ni par ni impar: $f(-t)=1+t$, que no es $f(t)$ ni $-f(t)$
            correcta: true
            mensaje: |
              Eso es, y es la casilla que más se olvida. «Par o impar» es una
              pregunta con **tres** respuestas posibles, y la tercera es la más
              frecuente en la práctica.
          - texto: >-
              Impar, porque lleva una $t$ de grado uno
            mensaje: |
              El $1$ lo estropea: $f(-t)=1+t$ y $-f(t)=t-1$. No coinciden. Una
              suma de un par y un impar no es ninguna de las dos cosas.
          - texto: >-
              Par, porque es una recta
            mensaje: |
              Una recta no vertical solo es par si es horizontal. $1-t$ tiene
              pendiente, así que no es simétrica respecto del eje $OY$.

      - tipo: calcular
        titulo: Cuántas son pares
        pregunta: |
          De las nueve, ¿cuántas son **pares**?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Tres serían si se contara alguna de las «ninguna» como par.
              Repasa la (b) y la (i): las dos mezclan una parte par con una
              impar.
          - valor: '1'
            mensaje: |
              Hay dos: la (a), que es un polinomio de exponentes pares, y la
              (f), que es $2\cosh t$.
        pista: |
          Son la (a) y la (f). Las demás, o son impares, o no son ninguna de
          las dos cosas.
        desarrollo: |
          **(a)** $1-t^{2}$: todos los exponentes son pares ✓

          **(f)** $e^{t}+e^{-t}=2\cosh t$: al cambiar $t$ por $-t$ los dos
          sumandos se intercambian y la suma no cambia ✓

      - tipo: calcular
        titulo: Cuántas son impares
        pregunta: |
          De las nueve, ¿cuántas son **impares**?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Falta alguna. La (h) es $\tfrac12\operatorname{sen}2t$, y un seno
              es impar aunque venga disfrazado de producto.
          - valor: '4'
            mensaje: |
              Cuatro serían si se contara la (i), pero
              $\operatorname{sen}t+\cos t$ mezcla un impar con un par: no es
              ninguna de las dos cosas.
        pista: |
          Son la (c), la (g) y la (h).
        desarrollo: |
          **(c)** $2t^{3}-4t$: exponentes impares ✓

          **(g)** $e^{t}-e^{-t}=2\operatorname{senh}t$ ✓

          **(h)** $\operatorname{sen}t\cos t=\tfrac12\operatorname{sen}2t$ ✓ —
          y también por la regla «impar por par es impar».

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un polinomio es par si solo tiene exponentes pares e impar si
              solo tiene exponentes impares. La (a) y la (c) están en ese caso.
          - texto: >-
              Toda función se descompone en parte par más parte impar:
              $f=\tfrac{f(t)+f(-t)}{2}+\tfrac{f(t)-f(-t)}{2}$.
          - texto: >-
              Por eso $e^{t}$ no es par ni impar, pero $e^{t}+e^{-t}$ y
              $e^{t}-e^{-t}$ —sus dos partes— sí lo son.
          - texto: >-
              Y por eso una función que no es par ni impar no admite serie de
              Fourier.
            trampa: true
            mensaje: |
              La admite perfectamente: lo que pasa es que tendrá **las dos**
              familias de coeficientes. La paridad es un atajo para ahorrar
              integrales, no un requisito. Todas las funciones de este boletín
              tienen serie.
        veredicto: |
          La paridad se comprueba siempre igual: sustituir $t$ por $-t$ y
          comparar. Y merece la pena porque anula de golpe la mitad de los
          coeficientes — pero su ausencia no impide nada.
    resolucion: |
      **Las nueve.**

      | | función | clase | por qué |
      |---|---|---|---|
      | (a) | $1-t^{2}$ | **par** | exponentes $0$ y $2$ |
      | (b) | $1-t$ | ninguna | $f(-t)=1+t$ |
      | (c) | $2t^{3}-4t$ | **impar** | exponentes $3$ y $1$ |
      | (d) | $2t^{3}+3t^{2}-5t+1$ | ninguna | mezcla pares e impares |
      | (e) | $e^{t}$ | ninguna | $e^{-t}\ne\pm e^{t}$ |
      | (f) | $e^{t}+e^{-t}$ | **par** | es $2\cosh t$ |
      | (g) | $e^{t}-e^{-t}$ | **impar** | es $2\operatorname{senh}t$ |
      | (h) | $\operatorname{sen}t\cos t$ | **impar** | es $\tfrac12\operatorname{sen}2t$ |
      | (i) | $\operatorname{sen}t+\cos t$ | ninguna | impar más par |

      Dos pares, tres impares y **cuatro que no son ninguna de las dos
      cosas** — que es la mayoría, y por eso la tercera casilla importa.

      ### 1 · La comprobación, siempre la misma

      $$
      f\text{ par} \iff f(-t)=f(t)
      \qquad
      f\text{ impar} \iff f(-t)=-f(t)
      $$

      ### 2 · Las reglas que ahorran trabajo

      - **Polinomios**: par si todos los exponentes son pares, impar si todos
        son impares, y ninguna si se mezclan. El término independiente cuenta
        como exponente $0$, o sea par — por eso la (d) no es impar.
      - **Productos**: par·par = par, impar·impar = par, par·impar = impar.
        Con eso la (h) sale sin transformar nada.
      - **Sumas**: solo conservan la clase si los dos sumandos la comparten.
        La (i) suma un impar y un par, y por eso no es ninguna.

      ### 3 · Por qué la (e) da las otras dos

      $$
      e^{t} = \underbrace{\frac{e^{t}+e^{-t}}{2}}_{\text{par}}
      + \underbrace{\frac{e^{t}-e^{-t}}{2}}_{\text{impar}}
      = \cosh t + \operatorname{senh}t
      $$

      Los apartados (e), (f) y (g) son el mismo ejemplo mirado tres veces: una
      función sin paridad y sus dos mitades.

      ### 4 · Para qué sirve

      | si $f$ es | se anulan | quedan |
      |---|---|---|
      | par | todos los $b_n$ | serie de cosenos |
      | impar | $a_0$ y todos los $a_n$ | serie de senos |
      | ninguna | nada | las dos familias |

      **Lo que hay que llevarse.** Comprobar la paridad cuesta una línea y
      puede ahorrar la mitad de las integrales. Pero hay que estar dispuesto a
      marcar la tercera casilla: cuatro de estas nueve no son ni lo uno ni lo
      otro.

      <figure class="figura-examen">
      <svg viewBox="0 0 516 166" role="img" width="516" height="166"
           aria-labelledby="f-par-impar-ninguna-t f-par-impar-ninguna-d">
        <title id="f-par-impar-ninguna-t">Una función par, una impar y una que no es ninguna de las dos</title>
        <desc id="f-par-impar-ninguna-d">Tres recuadros. En el primero, una parábola invertida simétrica respecto del eje vertical: lo que hay a la izquierda es el reflejo de lo que hay a la derecha, y eso es ser par. En el segundo, una cúbica que sube, baja y vuelve a subir, simétrica respecto del origen: girando el dibujo media vuelta queda igual, y eso es ser impar. En el tercero, una exponencial creciente que no tiene ninguna de las dos simetrías. En los dos primeros se dibuja con trazo fino el reflejo para que la simetría se vea.</desc>
