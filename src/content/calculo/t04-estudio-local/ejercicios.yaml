  - id: ocho-series-de-potencias
    titulo: Ocho desarrollos, y solo tres hay que calcular
    fuente: >-
      Ejercicio 5 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU ·
      El boletín no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: practica
    enunciado: |
      Desarrollar las siguientes funciones en serie de potencias:

      **1.** $f(x) = e^{x}$ · **2.** $f(x) = \mathrm{sen}\,x$ ·
      **3.** $f(x) = \cos x$ · **4.** $f(x) = \ln(1+x)$

      **5.** $f(x) = \dfrac{1}{x-1}$ · **6.** $f(x) = (1+x)^{m}$ ·
      **7.** $f(x) = x^{2}e^{x}$ · **8.** $f(x) = \ln\dfrac{1+x}{1-x}$
    pide: Desarrollar las ocho en serie de potencias.

    pasos:
      - tipo: reconocer
        pregunta: |
          Ocho desarrollos parecen ocho ejercicios. ¿Lo son?
        opciones:
          - texto: >-
              No: los cinco últimos salen de los primeros, **componiendo,
              multiplicando o combinando**
            correcta: true
            mensaje: |
              Eso es. El 7 es el 1 multiplicado por $x^{2}$; el 5 es la
              geométrica con un cambio de signo; el 8 es la resta de dos
              versiones del 4. Calcular ocho desarrollos derivada a derivada
              sería perder el tiempo — y en un examen, no llegar.
          - texto: Sí, y hay que derivar ocho veces cada uno
            mensaje: |
              Sería el camino largo y además innecesario. Con cinco desarrollos
              básicos memorizados, los demás salen de manipularlos.
          - texto: No, porque todos son el mismo
            mensaje: |
              No son el mismo: el exponencial, el trigonométrico y el
              logarítmico son familias distintas. Lo que ocurre es que hay
              relaciones entre ellos.
          - texto: Sí, pero solo los cuatro primeros importan
            mensaje: |
              Los ocho importan, y precisamente porque los cuatro últimos
              enseñan a **operar** con series, que es lo que se examina.

      - tipo: calcular
        titulo: El radio de convergencia del logaritmo
        pregunta: |
          ¿Cuál es el radio de convergencia del desarrollo de $\ln(1+x)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Un radio nunca es negativo: es una distancia. El desarrollo
              converge para $\left|x\right|<1$, es decir en el intervalo
              $(-1,1)$, y su **radio** es 1.
          - valor: '0'
            mensaje: |
              Radio 0 significaría que la serie solo converge en el punto de
              desarrollo. El de $\ln(1+x)$ converge en todo un intervalo.
          - valor: '2'
            mensaje: |
              2 sería la **longitud** del intervalo de convergencia,
              $(-1,1)$. El radio es la mitad.
        pista: |
          El desarrollo sale de integrar la geométrica $\frac{1}{1+x}$, que
          converge donde $\left|x\right|<1$.
        desarrollo: |
          El desarrollo se obtiene integrando la serie geométrica:

          $$
          \frac{1}{1+x} = 1-x+x^{2}-x^{3}+\dots
          \qquad \left|x\right|<1
          $$

          $$
          \ln(1+x) = x-\frac{x^{2}}{2}+\frac{x^{3}}{3}-\dots
          = \sum_{n\ge1}\frac{(-1)^{n+1}x^{n}}{n}
          $$

          La integración **no cambia el radio**, así que sigue siendo

          $$
          R = 1
          $$

          y el desarrollo vale en $(-1,1)$ — más el extremo $x=1$, donde queda
          la serie armónica alternada, que converge.
        veredicto: |
          El radio es la mitad de la respuesta. Un desarrollo sin decir dónde
          vale está incompleto, y en $x=2$ esa serie diverge.

      - tipo: justificar
        pregunta: |
          Ordena los ocho desarrollos y sus relaciones. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **Los tres básicos** salen de derivar y evaluar en 0:
              $e^{x} = \sum\frac{x^{n}}{n!}$,
              $\mathrm{sen}\,x = \sum\frac{(-1)^{n}x^{2n+1}}{(2n+1)!}$,
              $\cos x = \sum\frac{(-1)^{n}x^{2n}}{(2n)!}$. Los tres convergen
              para **todo** $x$.
          - texto: |
              **El cuarto** sale de integrar la geométrica:
              $\ln(1+x) = \sum_{n\ge1}\frac{(-1)^{n+1}x^{n}}{n}$, con
              $\left|x\right|<1$.
          - texto: |
              **El quinto** es la geométrica con un signo:
              $\frac{1}{x-1} = -\frac{1}{1-x} = -\sum_{n\ge0}x^{n}$, con
              $\left|x\right|<1$.
          - texto: |
              **El sexto** es la serie binómica:
              $(1+x)^{m} = \sum_{n\ge0}\binom{m}{n}x^{n}$, con
              $\left|x\right|<1$ si $m$ no es un entero no negativo.
          - texto: |
              **El séptimo y el octavo** salen de los anteriores:
              $x^{2}e^{x} = \sum\frac{x^{n+2}}{n!}$, y
              $\ln\frac{1+x}{1-x} = \ln(1+x)-\ln(1-x)
              = 2\sum_{n\ge0}\frac{x^{2n+1}}{2n+1}$.
          - texto: |
              Todos los desarrollos convergen para cualquier valor de $x$,
              porque son series infinitas.
            trampa: true
            mensaje: |
              Solo los tres primeros. Los que vienen de la geométrica —el 4, el
              5, el 6 y el 8— tienen radio 1 y **divergen** fuera de $(-1,1)$.
              Con $x=2$, $\frac{1}{x-1}$ vale 1 y la serie $-\sum2^{n}$ no
              converge a nada. El radio es parte del desarrollo.
        veredicto: |
          Fíjate en el 8: al restar los dos logaritmos se cancelan los términos
          pares y queda una serie **solo con potencias impares**. Es la seña de
          que la función es impar.

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una resolución propuesta, pendiente de revisión.

      **Datos.** Ocho funciones que desarrollar en serie de potencias.

      ### 1 · La estrategia: tres se calculan, cinco se deducen

      Calcular ocho desarrollos derivando cada uno sería el camino largo. La
      forma eficiente —y la que se examina— es tener **memorizados unos pocos** y
      obtener los demás manipulándolos.

      ### 2 · Los que se calculan derivando

      **1. $e^{x}$.** Todas sus derivadas valen 1 en 0:

      $$
      e^{x} = \sum_{n\ge0}\frac{x^{n}}{n!}
      = 1+x+\frac{x^{2}}{2!}+\frac{x^{3}}{3!}+\dots
      \qquad \forall x \in \mathbb{R}
      $$

      **2. $\mathrm{sen}\,x$.** Sus derivadas en 0 se repiten con periodo 4:
      $0,1,0,-1$:

      $$
      \mathrm{sen}\,x = \sum_{n\ge0}\frac{(-1)^{n}x^{2n+1}}{(2n+1)!}
      = x-\frac{x^{3}}{3!}+\frac{x^{5}}{5!}-\dots
      \qquad \forall x
      $$

      Solo potencias **impares**: el seno es una función impar.

      **3. $\cos x$.** Igual, con $1,0,-1,0$:

      $$
      \cos x = \sum_{n\ge0}\frac{(-1)^{n}x^{2n}}{(2n)!}
      = 1-\frac{x^{2}}{2!}+\frac{x^{4}}{4!}-\dots
      \qquad \forall x
      $$

      Solo potencias **pares**: el coseno es par. Y derivando esta serie término
      a término sale la del seno cambiada de signo, como debe.

      ### 3 · Los que salen de la geométrica

      La serie madre es

      $$
      \frac{1}{1-t} = \sum_{n\ge0}t^{n}, \qquad \left|t\right|<1
      $$

      **5. $\frac{1}{x-1}$.** Basta un signo:

      $$
      \frac{1}{x-1} = -\frac{1}{1-x} = -\sum_{n\ge0}x^{n}
      = -1-x-x^{2}-\dots
      \qquad \left|x\right|<1
      $$

      **4. $\ln(1+x)$.** Sustituyendo $t=-x$ e **integrando**:

      $$
      \frac{1}{1+x} = \sum_{n\ge0}(-1)^{n}x^{n}
      $$

      $$
      \ln(1+x) = \int_0^x \frac{dt}{1+t}
      = \sum_{n\ge0}\frac{(-1)^{n}x^{n+1}}{n+1}
      = \sum_{n\ge1}\frac{(-1)^{n+1}x^{n}}{n}
      $$

      $$
      = x-\frac{x^{2}}{2}+\frac{x^{3}}{3}-\dots
      \qquad \left|x\right|<1
      $$

      Integrar **no cambia el radio de convergencia**.

      **6. $(1+x)^{m}$.** Es la serie binómica:

      $$
      (1+x)^{m} = \sum_{n\ge0}\binom{m}{n}x^{n}
      = 1+mx+\frac{m(m-1)}{2!}x^{2}+\frac{m(m-1)(m-2)}{3!}x^{3}+\dots
      $$

      con $\left|x\right|<1$. Si $m$ es un entero no negativo la serie se corta
      —es el binomio de Newton— y vale para todo $x$.

      ### 4 · Los que salen de operar

      **7. $x^{2}e^{x}$.** Se multiplica el desarrollo de $e^{x}$ por $x^{2}$,
      término a término:

      $$
      x^{2}e^{x} = x^{2}\sum_{n\ge0}\frac{x^{n}}{n!}
      = \sum_{n\ge0}\frac{x^{n+2}}{n!}
      = x^{2}+x^{3}+\frac{x^{4}}{2!}+\frac{x^{5}}{3!}+\dots
      $$

      válido para todo $x$: multiplicar por un polinomio no cambia el radio.

      **8. $\ln\frac{1+x}{1-x}$.** Se usa la propiedad del logaritmo de un
      cociente:

      $$
      \ln\frac{1+x}{1-x} = \ln(1+x)-\ln(1-x)
      $$

      $$
      = \left(x-\frac{x^{2}}{2}+\frac{x^{3}}{3}-\dots\right)
      - \left(-x-\frac{x^{2}}{2}-\frac{x^{3}}{3}-\dots\right)
      $$

      Los términos **pares se cancelan** y los impares se duplican:

      $$
      = 2\left(x+\frac{x^{3}}{3}+\frac{x^{5}}{5}+\dots\right)
      = 2\sum_{n\ge0}\frac{x^{2n+1}}{2n+1}
      \qquad \left|x\right|<1
      $$

      Que queden solo potencias impares confirma que la función es **impar**, y
      lo es: cambiar $x$ por $-x$ invierte la fracción y cambia el signo del
      logaritmo.

      ### 5 · El radio es parte de la respuesta

      | desarrollo | radio | dónde vale |
      |---|---|---|
      | 1, 2, 3, 7 | $\infty$ | todo $\mathbb{R}$ |
      | 4, 5, 6, 8 | 1 | $\lvert x\rvert<1$ |

      Un desarrollo sin su intervalo está incompleto. Con $x=2$, la función
      $\frac{1}{x-1}$ vale perfectamente 1, pero la serie $-\sum2^{n}$ no
      converge: **la serie deja de representar a la función** fuera del radio.

      ### 6 · Comprobación

      **Numérica**, con $x = 0{,}5$ y cuatro términos de cada una:

      | | serie truncada | valor exacto |
      |---|---|---|
      | $e^{0,5}$ | $1+0{,}5+0{,}125+0{,}0208 = 1{,}6458$ | $1{,}6487$ ✔ |
      | $\ln1{,}5$ | $0{,}5-0{,}125+0{,}0417-0{,}0156 = 0{,}4011$ | $0{,}4055$ ✔ |
      | $\ln3$ | $2(0{,}5+0{,}0417+0{,}00625+0{,}00112) = 1{,}0981$ | $1{,}0986$ ✔ |

      El tercero converge mucho más rápido que el segundo aunque calcule un
      número mayor, y esa es la utilidad práctica del desarrollo 8: sirve para
      calcular logaritmos con pocos términos.

      **De coherencia:** derivando la serie del 8 término a término sale
      $2\sum x^{2n} = \frac{2}{1-x^{2}}$, que es exactamente la derivada de
      $\ln\frac{1+x}{1-x}$ ✔

