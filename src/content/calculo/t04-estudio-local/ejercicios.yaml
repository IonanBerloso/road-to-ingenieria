        <desc id="t4feD">La curva sale del origen subiendo, hace cumbre en x igual a 1, baja hasta tocar el eje en x igual a 3 y vuelve a subir. Entre la cumbre y el valle, en x igual a 2, la curvatura cambia: antes se dobla hacia abajo y después hacia arriba. Los tres puntos van marcados con un círculo.</desc>

