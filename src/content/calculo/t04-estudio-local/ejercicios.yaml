  - id: ej-lagrange-basico
    titulo: El teorema del valor medio, aplicado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Comprobar que $f(x) = x^{2}$ cumple las hipótesis del teorema de Lagrange
      en $[0,2]$ y encontrar el punto $c$ que el teorema garantiza.
    pide: La comprobación de las hipótesis y el valor de c.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos hipótesis pide el teorema de Lagrange, y en qué intervalos?
        opciones:
          - texto: Continua en el cerrado y derivable en el abierto
            correcta: true
            mensaje: |
              Eso es, y la diferencia entre los dos intervalos **no es un
              descuido del enunciado**: es a propósito, para permitir tangentes
              verticales en los extremos.
          - texto: Continua y derivable, las dos en el cerrado
            mensaje: |
              La derivabilidad se pide solo en el abierto, que es más débil. Con
              tu versión, funciones como $\sqrt{x}$ en $[0,1]$ quedarían fuera
              sin motivo.
          - texto: Que la función valga lo mismo en los dos extremos
            mensaje: |
              Esa es la hipótesis extra de **Rolle**, que es el caso particular
              de Lagrange cuando la pendiente media vale cero.
      - tipo: calcular
        titulo: La pendiente media
        pregunta: |
          ¿Cuánto vale $\dfrac{f(2)-f(0)}{2-0}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $f(2)$, el numerador. Falta dividir entre la longitud del
              intervalo, que es 2.
          - valor: '1'
            mensaje: |
              Parece que has dividido 2 entre 2. El numerador es
              $f(2)-f(0) = 4-0 = 4$.
        pista: |
          $f(2) = 4$ y $f(0) = 0$. Divide la diferencia entre 2.
        desarrollo: |
          $$
          \frac{f(2)-f(0)}{2-0} = \frac{4-0}{2} = 2
          $$

          Es la pendiente de la recta que une los dos extremos de la curva.
      - tipo: calcular
        titulo: El punto que el teorema garantiza
        pregunta: |
          Resolviendo $f'(c) = 2$, con $f'(x) = 2x$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la pendiente media, no el punto. De $2c = 2$ hay que despejar
              $c$.
          - valor: '0'
            mensaje: |
              Con $c=0$ la derivada valdría 0, no 2. Y además el teorema
              garantiza un punto en el **abierto**, así que los extremos no
              cuentan.
        pista: |
          $2c = 2$.
        desarrollo: |
          $$
          f'(c) = 2c = 2 \;\Longrightarrow\; c = 1
          $$

          Y $1$ está en el intervalo abierto $(0,2)$, como el teorema promete.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza sobra.
        piezas:
          - texto: $f(x)=x^{2}$ es un polinomio, luego continua en $[0,2]$ y derivable en $(0,2)$.
          - texto: La pendiente media vale $\frac{4-0}{2} = 2$.
          - texto: Lagrange garantiza un $c \in (0,2)$ con $f'(c) = 2$.
          - texto: Resolviendo $2c = 2$ sale $c = 1$, que efectivamente está dentro.
          - texto: El teorema dice que ese $c$ es el punto medio del intervalo.
            trampa: true
            mensaje: |
              Coincide aquí por casualidad, porque la parábola es simétrica. El
              teorema **no dice dónde** está el punto: solo que existe. Con otra
              función cae en otro sitio.
    resolucion: |
      **Las hipótesis.** $f$ es un polinomio, así que es continua en el cerrado
      $[0,2]$ y derivable en el abierto $(0,2)$. Las dos se comprueban por
      separado y las dos hacen falta.

      **La pendiente media**, que es lo que el teorema iguala:

      $$
      \frac{f(2)-f(0)}{2-0} = \frac{4-0}{2} = 2
      $$

      **El punto.** El teorema garantiza que existe $c \in (0,2)$ con
      $f'(c) = 2$. Como $f'(x) = 2x$:

      $$
      2c = 2 \;\Longrightarrow\; c = 1
      $$

      **Qué significa.** En $x=1$ la tangente a la parábola tiene la misma
      pendiente que la recta que une $(0,0)$ con $(2,4)$. Si un coche recorre
      100 km en una hora, en algún instante su velocímetro marcó 100 km/h: es
      el mismo enunciado.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 265" role="img" width="300" height="265"
           aria-labelledby="f-ej-lagrange-basico-t f-ej-lagrange-basico-d">
        <title id="f-ej-lagrange-basico-t">La parábola y igual a x al cuadrado entre cero y dos, con la secante y la tangente paralelas</title>
        <desc id="f-ej-lagrange-basico-d">Una parábola sube del origen hasta el punto dos coma cuatro. Una recta discontinua une esos dos extremos: es la secante, y su pendiente vale dos. Otra recta, continua y de otro color, es tangente a la parábola en el punto uno coma uno y es paralela a la anterior. Una línea de puntos baja de ese punto de tangencia hasta el eje horizontal, donde está marcado el valor c igual a uno, justo en el centro del intervalo.</desc>
