  - id: canal-de-capacidad-maxima
    titulo: El canal que más agua lleva
    fuente: >-
      Ejercicio 10 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Se quiere construir un canal abierto de capacidad máxima. La base y los
      lados deben de ser de 10 m y la inclinación de los dos lados sobre la
      base es la misma, $\alpha$. ¿Cuánto mide la base superior?
    pide: Calcular la anchura de la base superior.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sección del canal es un trapecio. ¿Cuál es la variable del
          problema?
        opciones:
          - texto: >-
              El **ángulo** $\alpha$: las tres longitudes están fijadas en 10 m
            correcta: true
            mensaje: |
              Eso es lo que hace especial a este problema. Las chapas miden 10 m
              y no se pueden cambiar; lo único que se puede elegir es **cuánto
              se abren**. Así que el objetivo hay que escribirlo en función de
              $\alpha$, con senos y cosenos.
          - texto: La anchura de la base superior
            mensaje: |
              Es lo que se **pide**, no la variable natural. Se puede usar como
              variable, pero entonces la altura sale con una raíz y las cuentas
              se complican. Con el ángulo salen limpias.
          - texto: La altura del canal
            mensaje: |
              También determina la forma, pero igual que antes: introduce
              raíces. El ángulo es la variable cómoda.
          - texto: La longitud de los lados
            mensaje: |
              Está fijada por el enunciado en 10 m: no es variable, es dato.

      - tipo: calcular
        titulo: El ángulo óptimo
        pregunta: |
          ¿Cuál es el ángulo $\alpha$ que maximiza el área, en grados?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '45'
            mensaje: |
              $45^{\circ}$ es la respuesta intuitiva, pero no la correcta. La
              ecuación $2\cos^{2}\alpha+\cos\alpha-1 = 0$ da
              $\cos\alpha = \frac12$, es decir $60^{\circ}$.
          - valor: '90'
            mensaje: |
              Con $90^{\circ}$ los lados quedan verticales y la sección es un
              rectángulo de $10\times10 = 100\ \text{m}^{2}$. Se puede hacer
              mejor: con $60^{\circ}$ el área es $75\sqrt3 \approx 130$.
          - valor: '30'
            mensaje: |
              Con $30^{\circ}$ el canal queda muy abierto y bajo:
              $100\,\mathrm{sen}\,30^{\circ}(1+\cos30^{\circ}) \approx 93$,
              menos que con $60^{\circ}$.
        pista: |
          El área es $A(\alpha) = 100\,\mathrm{sen}\,\alpha\left(1+\cos\alpha\right)$.
          Deriva y resuelve la ecuación de segundo grado en $\cos\alpha$.
        desarrollo: |
          La sección es un trapecio con base menor 10, lados de 10 inclinados
          $\alpha$, altura $10\,\mathrm{sen}\,\alpha$ y base mayor
          $10+2\cdot10\cos\alpha$.

          $$
          A = \frac{B+b}{2}\cdot h
          = \frac{(10+20\cos\alpha)+10}{2}\cdot 10\,\mathrm{sen}\,\alpha
          $$

          $$
          = 100\,\mathrm{sen}\,\alpha\left(1+\cos\alpha\right)
          $$

          Derivando:

          $$
          A'(\alpha) = 100\left[\cos\alpha(1+\cos\alpha)
          - \mathrm{sen}^{2}\alpha\right]
          $$

          y usando $\mathrm{sen}^{2} = 1-\cos^{2}$:

          $$
          = 100\left[\cos\alpha+\cos^{2}\alpha-1+\cos^{2}\alpha\right]
          = 100\left[2\cos^{2}\alpha+\cos\alpha-1\right]
          $$

          Con $c = \cos\alpha$:

          $$
          2c^{2}+c-1 = 0 \;\Longrightarrow\; c = \frac{-1\pm3}{4}
          \;\Longrightarrow\; c = \frac12 \;\text{ o }\; c = -1
          $$

          $c=-1$ daría $\alpha = 180^{\circ}$, sin sentido físico. Luego
          $\cos\alpha = \frac12$ y $\alpha = 60^{\circ}$.
        veredicto: |
          Con $60^{\circ}$ el trapecio resulta ser **medio hexágono regular**:
          los tres lados de 10 y la abertura de 20 son tres sextos de un
          hexágono de lado 10.

      - tipo: calcular
        titulo: La base superior
        pregunta: |
          ¿Cuánto mide la base superior, en metros?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              10 es la base **inferior**, dato del enunciado. La superior es
              mayor porque los lados se abren.
          - valor: '30'
            mensaje: |
              30 sería si los lados estuvieran completamente tumbados,
              $\alpha=0$: base superior $10+20 = 30$, pero altura 0 y área 0.
          - valor: '15'
            mensaje: |
              15 saldría de $10+2\cdot10\cos60^{\circ}$ con un factor mal:
              $2\cdot10\cdot\frac12 = 10$, así que la base superior es
              $10+10 = 20$.
        pista: |
          Base superior $= 10+20\cos\alpha$, con $\cos60^{\circ} = \frac12$.
        desarrollo: |
          $$
          B = 10+20\cos 60^{\circ} = 10+20\cdot\frac12 = 10+10 = 20 \ \text{m}
          $$

          Y el área máxima:

          $$
          A = 100\,\mathrm{sen}\,60^{\circ}\left(1+\cos60^{\circ}\right)
          = 100\cdot\frac{\sqrt3}{2}\cdot\frac32
          = 75\sqrt3 \approx 129{,}9\ \text{m}^{2}
          $$
        veredicto: |
          La base superior mide **el doble** que la inferior. Es la seña del
          medio hexágono.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La variable es el ángulo.** Las tres chapas miden 10 m y son
              dato; lo único que se elige es cuánto se abren.
          - texto: |
              **La geometría del trapecio:** altura $10\,\mathrm{sen}\,\alpha$,
              base menor 10, base mayor $10+20\cos\alpha$.
          - texto: |
              **El área:**
              $A(\alpha) = \frac{B+b}{2}h
              = 100\,\mathrm{sen}\,\alpha(1+\cos\alpha)$.
          - texto: |
              **Derivar** y usar $\mathrm{sen}^{2} = 1-\cos^{2}$ para dejar todo
              en cosenos: $2\cos^{2}\alpha+\cos\alpha-1 = 0$.
          - texto: |
              **Resolver y filtrar:** $\cos\alpha = \frac12$ o $\cos\alpha=-1$;
              la segunda no tiene sentido físico. Luego $\alpha = 60^{\circ}$ y
              la base superior mide 20 m.
          - texto: |
              El área máxima se consigue con los lados verticales, porque así el
              canal es más profundo.
            trampa: true
            mensaje: |
              Con los lados verticales ($\alpha = 90^{\circ}$) la sección es un
              rectángulo de $10\times10$ y área **100**. Abriéndolos a
              $60^{\circ}$ se pierde algo de profundidad pero se gana mucha más
              anchura, y el área sube a $75\sqrt3 \approx 130$. Más profundo no
              es más capaz.
        veredicto: |
          El compromiso entre profundidad y anchura es el mismo mecanismo que en
          el rectángulo bajo la parábola. Cambia la geometría, no la idea.

    resolucion: |
      **Datos.** Canal abierto con la base y los dos lados de 10 m, inclinados
      un ángulo $\alpha$ igual sobre la base. Se pide la base superior que hace
      máxima la capacidad.

      ### 1 · Qué se puede elegir y qué no

      La capacidad del canal por metro de longitud es el **área de su sección**,
      que es un trapecio isósceles.

      Y aquí está lo característico del problema: **las tres longitudes están
      fijadas** en 10 m. No se puede hacer la base más ancha ni los lados más
      largos; lo único que se elige es **cuánto se abren**.

      Por eso la variable natural es el **ángulo** $\alpha$, y el objetivo se
      escribe con senos y cosenos.

      ### 2 · La geometría del trapecio

      Cada lado de 10 m inclinado $\alpha$ sobre la horizontal aporta:

      | | |
      |---|---|
      | altura | $h = 10\,\mathrm{sen}\,\alpha$ |
      | voladizo horizontal | $10\cos\alpha$ por cada lado |
      | base menor | $b = 10$ |
      | base mayor | $B = 10+2\cdot10\cos\alpha = 10+20\cos\alpha$ |

      ### 3 · La función objetivo

      $$
      A(\alpha) = \frac{B+b}{2}\cdot h
      = \frac{\left(10+20\cos\alpha\right)+10}{2}\cdot10\,\mathrm{sen}\,\alpha
      $$

      $$
      = \left(10+10\cos\alpha\right)\cdot10\,\mathrm{sen}\,\alpha
      = 100\,\mathrm{sen}\,\alpha\left(1+\cos\alpha\right)
      $$

      con $\alpha \in \left(0,\frac{\pi}{2}\right]$: por debajo de 0 no hay
      canal y por encima de $90^{\circ}$ los lados se cerrarían hacia dentro.

      ### 4 · Derivar

      $$
      A'(\alpha) = 100\left[\cos\alpha\left(1+\cos\alpha\right)
      + \mathrm{sen}\,\alpha\left(-\mathrm{sen}\,\alpha\right)\right]
      $$

      $$
      = 100\left[\cos\alpha+\cos^{2}\alpha-\mathrm{sen}^{2}\alpha\right]
      $$

      Y aquí el paso que ordena la ecuación: sustituir
      $\mathrm{sen}^{2}\alpha = 1-\cos^{2}\alpha$ para dejarlo **todo en
      cosenos**:

      $$
      = 100\left[\cos\alpha+\cos^{2}\alpha-1+\cos^{2}\alpha\right]
      = 100\left[2\cos^{2}\alpha+\cos\alpha-1\right]
      $$

      ### 5 · Resolver y filtrar

      Con $c = \cos\alpha$:

      $$
      2c^{2}+c-1 = 0
      \;\Longrightarrow\;
      c = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
      $$

      $$
      c = \frac12 \qquad\text{o}\qquad c = -1
      $$

      $c=-1$ daría $\alpha = 180^{\circ}$: los lados tumbados hacia atrás, sin
      sentido físico. Se descarta.

      $$
      \cos\alpha = \frac12 \;\Longrightarrow\; \alpha = 60^{\circ}
      $$

      ### 6 · El resultado

      $$
      B = 10+20\cos60^{\circ} = 10+10 = 20
      $$

      $$
      \boxed{\;\text{base superior } = 20\ \text{m}\;}
      $$

      Con área

      $$
      A = 100\cdot\frac{\sqrt3}{2}\cdot\frac{3}{2} = 75\sqrt3
      \approx 129{,}9\ \text{m}^{2}
      $$

      ### 7 · La figura que sale

      El trapecio óptimo tiene los tres lados de 10 y la base mayor de 20: es
      **medio hexágono regular** de lado 10.

      No es casualidad, y es un resultado clásico: entre todos los trapecios con
      tres lados fijos, el de área máxima es el que se inscribe en una
      semicircunferencia — y con tres lados iguales, ese es el medio hexágono.

      ### 8 · Comprobación

      | $\alpha$ | altura | base sup. | área |
      |---|---|---|---|
      | $30^{\circ}$ | $5$ | $27{,}3$ | $93{,}3$ |
      | $45^{\circ}$ | $7{,}07$ | $24{,}1$ | $120{,}7$ |
      | $\mathbf{60^{\circ}}$ | $\mathbf{8{,}66}$ | $\mathbf{20}$ | $\mathbf{129{,}9}$ |
      | $75^{\circ}$ | $9{,}66$ | $15{,}2$ | $121{,}6$ |
      | $90^{\circ}$ | $10$ | $10$ | $100$ |

      El máximo está en $60^{\circ}$ ✔

      Y la última fila desmonta la intuición de «cuanto más profundo, mejor»:
      con los lados verticales el canal es el más hondo posible y lleva **un 23 %
      menos de agua** que el óptimo. Lo que se gana en profundidad se pierde en
      anchura, y con creces.

