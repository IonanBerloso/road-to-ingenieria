  - id: rectangulo-en-semicircunferencia
    titulo: El rectángulo más grande dentro de media circunferencia
    fuente: >-
      Ejercicio 11 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las dimensiones del rectángulo de área máxima inscrito en una
      semicircunferencia de radio $a$.
    pide: Calcular la base y la altura del rectángulo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El radio se llama $a$ y no es un número. ¿Qué cambia eso?
        opciones:
          - texto: >-
              Nada en el método: $a$ es un **parámetro**, y la respuesta saldrá
              en función de él
            correcta: true
            mensaje: |
              Eso es. Se deriva respecto de la variable —la semibase— tratando
              $a$ como una constante, exactamente igual que si fuera un 5. La
              respuesta es una fórmula, no un número, y eso la hace más útil:
              vale para cualquier radio.
          - texto: Que hay que derivar también respecto de $a$
            mensaje: |
              $a$ es un dato del problema, no una variable que se pueda elegir.
              Derivar respecto de él no significaría nada aquí.
          - texto: Que hay que dar un valor concreto a $a$
            mensaje: |
              Sería perder generalidad. Con $a$ simbólico la respuesta sirve
              para todos los radios a la vez.
          - texto: Que el problema no tiene solución numérica
            mensaje: |
              Tiene solución perfectamente: base $a\sqrt2$ y altura
              $\frac{a}{\sqrt2}$. Lo que pasa es que la solución es una fórmula.

      - tipo: calcular
        titulo: La semibase óptima
        pregunta: |
          Si el radio fuera $a = 10$, ¿cuánto valdría la **semibase** del
          rectángulo óptimo?
        respuesta:
          tipo: numero
          valor: '7.0710678'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '14.142136'
            mensaje: |
              $10\sqrt2 \approx 14{,}14$ es la **base entera**, $2x$. La
              semibase es la mitad.
          - valor: '5'
            mensaje: |
              5 sería la mitad del radio. La semibase óptima es
              $\frac{a}{\sqrt2} \approx 0{,}707a$, no $0{,}5a$.
          - valor: '10'
            mensaje: |
              10 es el radio. La semibase tiene que ser menor: el rectángulo cabe
              dentro de la semicircunferencia.
        pista: |
          La semibase óptima es $x = \frac{a}{\sqrt2}$.
        desarrollo: |
          Con la semibase $x$, la altura es $y = \sqrt{a^{2}-x^{2}}$ y el área

          $$
          A(x) = 2x\sqrt{a^{2}-x^{2}}
          $$

          Conviene maximizar $A^{2}$ en vez de $A$, para evitar la raíz —el
          máximo está en el mismo sitio porque $A>0$—:

          $$
          f(x) = A^{2} = 4x^{2}\left(a^{2}-x^{2}\right) = 4a^{2}x^{2}-4x^{4}
          $$

          $$
          f'(x) = 8a^{2}x-16x^{3} = 8x\left(a^{2}-2x^{2}\right) = 0
          $$

          $$
          x^{2} = \frac{a^{2}}{2} \;\Longrightarrow\; x = \frac{a}{\sqrt2}
          $$

          Con $a=10$: $x = \frac{10}{\sqrt2} \approx 7{,}071$.
        veredicto: |
          Maximizar el cuadrado en vez de la propia área es un truco que ahorra
          derivar una raíz, y vale siempre que la función sea positiva.

      - tipo: calcular
        titulo: La proporción del rectángulo
        pregunta: |
          ¿Cuántas veces es la base más larga que la altura?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Si fueran iguales sería un cuadrado. Pero la base es $a\sqrt2$ y la
              altura $\frac{a}{\sqrt2}$, y su cociente es 2.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ aparece en las dos dimensiones, pero al dividirlas se
              cancela y queda un factor 2 limpio:
              $\frac{a\sqrt2}{a/\sqrt2} = \sqrt2\cdot\sqrt2 = 2$.
          - valor: '0.5'
            mensaje: |
              Es al revés: la **base** es el doble de la altura, no la mitad. El
              rectángulo es apaisado, como corresponde a estar apoyado en el
              diámetro.
        pista: |
          Base $= a\sqrt2$ y altura $= \frac{a}{\sqrt2}$. Divide.
        desarrollo: |
          $$
          \text{base} = 2x = \frac{2a}{\sqrt2} = a\sqrt2
          $$

          $$
          \text{altura} = \sqrt{a^{2}-\frac{a^{2}}{2}}
          = \sqrt{\frac{a^{2}}{2}} = \frac{a}{\sqrt2}
          $$

          $$
          \frac{\text{base}}{\text{altura}}
          = \frac{a\sqrt2}{a/\sqrt2} = \sqrt2\cdot\sqrt2 = 2
          $$

          Y el área máxima:

          $$
          A = a\sqrt2\cdot\frac{a}{\sqrt2} = a^{2}
          $$
        veredicto: |
          El área máxima es exactamente $a^{2}$, sin ninguna raíz ni ningún
          $\pi$. Es uno de esos resultados que sorprenden por lo limpios.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Nombrar con simetría.** El rectángulo tiene la base en el
              diámetro y los vértices superiores en el arco, así que es simétrico
              respecto del centro: semibase $x$, altura
              $y = \sqrt{a^{2}-x^{2}}$.
          - texto: |
              **Objetivo:** $A(x) = 2x\sqrt{a^{2}-x^{2}}$, con
              $x \in (0,a)$.
          - texto: |
              **Truco:** maximizar $A^{2} = 4x^{2}(a^{2}-x^{2})$ en lugar de
              $A$, que evita derivar la raíz y tiene el máximo en el mismo
              sitio porque $A>0$.
          - texto: |
              **Derivar:** $8x(a^{2}-2x^{2}) = 0$ da $x = \frac{a}{\sqrt2}$,
              descartando $x=0$ por degenerado.
          - texto: |
              **El resultado:** base $a\sqrt2$, altura $\frac{a}{\sqrt2}$, área
              $a^{2}$. La base es el doble de la altura.
          - texto: |
              El rectángulo de área máxima inscrito es un cuadrado, porque el
              cuadrado es el rectángulo más eficiente.
            trampa: true
            mensaje: |
              El cuadrado es el rectángulo de área máxima con **perímetro**
              fijo, que es otro problema. Aquí lo que restringe es que los
              vértices estén en el arco, y sale apaisado: base doble que altura.
              La forma óptima depende de qué restrinja, no hay un rectángulo
              «mejor» en abstracto.
        veredicto: |
          En una circunferencia **completa** sí saldría un cuadrado. Es la media
          circunferencia la que rompe la simetría vertical.

    resolucion: |
      **Datos.** Semicircunferencia de radio $a$. Se pide el rectángulo inscrito
      de área máxima.

      ### 1 · Nombrar aprovechando la simetría

      El rectángulo tiene la base sobre el diámetro y los dos vértices
      superiores sobre el arco. Como el arco es simétrico respecto del eje
      vertical, el rectángulo también lo es.

      Poniendo el centro en el origen y llamando $x$ a la **semibase**:

      | | |
      |---|---|
      | vértices inferiores | $(\pm x,\,0)$ |
      | vértices superiores | $(\pm x,\,y)$ con $x^{2}+y^{2} = a^{2}$ |
      | base | $2x$ |
      | altura | $y = \sqrt{a^{2}-x^{2}}$ |

      ### 2 · La función objetivo

      $$
      A(x) = 2x\sqrt{a^{2}-x^{2}}, \qquad x \in (0,a)
      $$

      El parámetro $a$ es una **constante** del problema: se deriva respecto de
      $x$ tratándolo como si fuera un número.

      ### 3 · El truco de maximizar el cuadrado

      Derivar esa raíz es engorroso. Como $A>0$ en todo el dominio, $A$ y
      $A^{2}$ alcanzan el máximo en el **mismo** punto, y $A^{2}$ es un
      polinomio:

      $$
      f(x) = A^{2} = 4x^{2}\left(a^{2}-x^{2}\right) = 4a^{2}x^{2}-4x^{4}
      $$

      Ese cambio es aplicable siempre que la función objetivo sea positiva, y
      ahorra bastante trabajo.

      ### 4 · Derivar

      $$
      f'(x) = 8a^{2}x-16x^{3} = 8x\left(a^{2}-2x^{2}\right) = 0
      $$

      $$
      x = 0 \qquad\text{o}\qquad x^{2} = \frac{a^{2}}{2}
      $$

      El $x=0$ da un rectángulo degenerado de área nula: se descarta. Queda

      $$
      x = \frac{a}{\sqrt2} = \frac{a\sqrt2}{2}
      $$

      ### 5 · Comprobar que es máximo

      $$
      f''(x) = 8a^{2}-48x^{2}, \qquad
      f''\!\left(\frac{a}{\sqrt2}\right) = 8a^{2}-48\cdot\frac{a^{2}}{2}
      = 8a^{2}-24a^{2} = -16a^{2} < 0
      $$

      Máximo ✔ Y los extremos del dominio dan área nula —en $x=0$ no hay base y
      en $x=a$ no hay altura—, así que el máximo está en el interior.

      ### 6 · Las dimensiones

      $$
      \text{base} = 2x = \frac{2a}{\sqrt2} = a\sqrt2
      $$

      $$
      \text{altura} = \sqrt{a^{2}-\frac{a^{2}}{2}} = \frac{a}{\sqrt2}
      $$

      $$
      \boxed{\;\text{base } = a\sqrt2, \qquad \text{altura } = \frac{a}{\sqrt2},
      \qquad A_{\max} = a^{2}\;}
      $$

      ### 7 · Dos lecturas del resultado

      **La proporción es 2 a 1.** La base mide exactamente el doble que la
      altura, sea cual sea el radio. El rectángulo óptimo es apaisado, no
      cuadrado.

      Y conviene decir por qué no es un cuadrado: el cuadrado es óptimo cuando
      lo que se fija es el **perímetro**. Aquí lo que restringe es el arco, y la
      media circunferencia impide crecer hacia arriba tanto como hacia los
      lados. En una circunferencia **completa** —con el rectángulo centrado— sí
      saldría un cuadrado.

      **El área es $a^{2}$.** Sin raíces y sin $\pi$: el rectángulo máximo
      inscrito en una semicircunferencia de radio $a$ tiene exactamente el área
      del cuadrado de lado $a$.

      Y ocupa

      $$
      \frac{a^{2}}{\frac{\pi a^{2}}{2}} = \frac{2}{\pi} \approx 63{,}7\ \%
      $$

      del semicírculo, una proporción que tampoco depende del radio.

      ### 8 · Comprobación

      Con $a=1$, para que los números se lean:

      | $x$ | altura | área $2xy$ |
      |---|---|---|
      | $0{,}5$ | $0{,}866$ | $0{,}866$ |
      | $0{,}6$ | $0{,}8$ | $0{,}96$ |
      | $\mathbf{0{,}707}$ | $\mathbf{0{,}707}$ | $\mathbf{1{,}000}$ |
      | $0{,}8$ | $0{,}6$ | $0{,}96$ |
      | $0{,}9$ | $0{,}436$ | $0{,}785$ |

      El máximo es 1, que es $a^{2}$ ✔ Y en el óptimo la semibase y la altura
      **coinciden**: los dos valen $\frac{1}{\sqrt2}$. Es decir, el vértice
      superior está justo a $45^{\circ}$ sobre el arco.

      Esa es otra forma de recordar el resultado: el vértice va en la bisectriz.

