  - id: caja-sin-tapa
    titulo: La caja de cartón que menos material gasta
    fuente: >-
      Ejercicio 9 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Se quiere construir una caja de cartón sin tapa, de base cuadrada y
      volumen $108\ \text{m}^{3}$. Calcular la mínima cantidad de cartón a
      utilizar.
    pide: Calcular la superficie mínima de cartón.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Sin tapa» cambia la fórmula. ¿Cuántas caras tiene la caja?
        opciones:
          - texto: >-
              **Cinco**: la base y los cuatro laterales
            correcta: true
            mensaje: |
              Eso es, y contar mal las caras es la forma más rápida de estropear
              el ejercicio. La superficie es $x^{2}+4xh$, no $2x^{2}+4xh$. Y el
              resultado cambia por completo.
          - texto: Seis, como cualquier caja
            mensaje: |
              Seis tendría una caja cerrada. El enunciado dice **sin tapa**, así
              que falta la de arriba: son cinco.
          - texto: Cuatro, solo los laterales
            mensaje: |
              La base sí está: lo que falta es la tapa. Sin base no sería una
              caja.
          - texto: Depende de la altura
            mensaje: |
              El número de caras no depende de las medidas. Es cinco sea cual
              sea la altura.

      - tipo: calcular
        titulo: El lado de la base
        pregunta: |
          ¿Cuánto mide el lado de la base, en metros?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es la **altura**, no el lado. Salen a la vez, pero la base es el
              doble de la altura en la caja óptima.
          - valor: '108'
            mensaje: |
              108 es el volumen en metros cúbicos. El lado sale de resolver
              $x^{3} = 216$.
          - valor: '4.7622032'
            mensaje: |
              $\sqrt[3]{108} \approx 4{,}76$ sería el lado de una caja **cúbica**
              de ese volumen. Pero la caja óptima sin tapa no es un cubo: es más
              ancha y más baja.
        pista: |
          $A(x) = x^{2}+\frac{432}{x}$. Deriva e iguala a cero.
        desarrollo: |
          Con lado $x$ y altura $h$:

          $$
          V = x^{2}h = 108 \;\Longrightarrow\; h = \frac{108}{x^{2}}
          $$

          $$
          A = \underbrace{x^{2}}_{\text{base}}+\underbrace{4xh}_{\text{laterales}}
          = x^{2}+4x\cdot\frac{108}{x^{2}} = x^{2}+\frac{432}{x}
          $$

          $$
          A'(x) = 2x-\frac{432}{x^{2}} = 0
          \;\Longrightarrow\;
          2x^{3} = 432
          \;\Longrightarrow\;
          x^{3} = 216
          \;\Longrightarrow\;
          x = 6
          $$

          Y entonces $h = \frac{108}{36} = 3$.
        veredicto: |
          La base mide **el doble** que la altura. Es la proporción óptima de
          cualquier caja de base cuadrada sin tapa, sea cual sea el volumen.

      - tipo: calcular
        titulo: La cantidad de cartón
        pregunta: |
          ¿Cuántos metros cuadrados de cartón hacen falta?
        respuesta:
          tipo: numero
          valor: '108'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '144'
            mensaje: |
              144 sería la superficie de una caja **cerrada** con esas medidas:
              $2\cdot36+4\cdot18$. Sin tapa se ahorran los 36 de arriba.
          - valor: '72'
            mensaje: |
              72 es solo la superficie **lateral**, $4\cdot6\cdot3$. Falta la
              base, otros 36.
          - valor: '36'
            mensaje: |
              36 es el área de la **base**, $6^{2}$. Faltan los cuatro
              laterales.
        pista: |
          $A = x^{2}+\frac{432}{x}$ con $x=6$.
        desarrollo: |
          $$
          A = 6^{2}+\frac{432}{6} = 36+72 = 108 \ \text{m}^{2}
          $$

          Curiosamente, el mismo número que el volumen. Es una coincidencia del
          enunciado: con otro volumen no pasaría.

          **Comprobando que es mínimo:**

          $$
          A''(x) = 2+\frac{864}{x^{3}}, \qquad A''(6) = 2+4 = 6 > 0
          \;\Longrightarrow\; \text{mínimo} \ \checkmark
          $$
        veredicto: |
          Que el área y el volumen coincidan numéricamente es casualidad del
          108, no una propiedad. Conviene no leerlo como una regla.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Nombrar:** lado de la base $x$, altura $h$.
              **Objetivo:** minimizar la superficie.
              **Restricción:** $x^{2}h = 108$.
          - texto: |
              **Contar caras.** Sin tapa son cinco: la base, $x^{2}$, y los
              cuatro laterales, $4xh$.
          - texto: |
              **Reducir a una variable:** $h = \frac{108}{x^{2}}$, y
              $A(x) = x^{2}+\frac{432}{x}$, con $x>0$.
          - texto: |
              **Derivar:** $A'(x) = 2x-\frac{432}{x^{2}} = 0$ da $x^{3} = 216$,
              es decir $x=6$, y entonces $h=3$.
          - texto: |
              **Comprobar:** $A''(6) = 6>0$, mínimo ✔ Y
              $A = 36+72 = 108\ \text{m}^{2}$.
          - texto: |
              La caja óptima es un cubo, porque el cubo es el cuerpo de menor
              superficie para un volumen dado.
            trampa: true
            mensaje: |
              El cubo es óptimo para una caja **cerrada**. Sin tapa la
              situación cambia: como la cara de arriba no cuesta nada, conviene
              hacerla más grande y la caja más baja. Aquí sale $x=6$ y $h=3$: la
              base mide el doble que la altura, no lo mismo.
        veredicto: |
          Ese contraste es el contenido del ejercicio: quitar una cara cambia la
          proporción óptima. La geometría depende de qué se está pagando.

    resolucion: |
      **Datos.** Caja sin tapa, base cuadrada, volumen $108\ \text{m}^{3}$. Se
      pide la mínima superficie de cartón.

      ### 1 · Contar bien las caras

      Es el paso donde se estropea el ejercicio antes de empezar. **Sin tapa**
      la caja tiene **cinco** caras:

      | cara | área |
      |---|---|
      | base | $x^{2}$ |
      | cuatro laterales | $4xh$ |

      $$
      A = x^{2}+4xh
      $$

      Con tapa sería $2x^{2}+4xh$, y el resultado saldría distinto.

      ### 2 · La restricción

      $$
      V = x^{2}h = 108 \;\Longrightarrow\; h = \frac{108}{x^{2}}
      $$

      ### 3 · Reducir a una variable

      $$
      A(x) = x^{2}+4x\cdot\frac{108}{x^{2}} = x^{2}+\frac{432}{x},
      \qquad x>0
      $$

      El dominio $x>0$ es obligatorio: una longitud no es negativa, y en $x=0$
      la función ni siquiera está definida.

      ### 4 · Derivar

      $$
      A'(x) = 2x-\frac{432}{x^{2}} = 0
      \;\Longrightarrow\;
      2x^{3} = 432
      \;\Longrightarrow\;
      x^{3} = 216
      \;\Longrightarrow\;
      x = 6
      $$

      $$
      h = \frac{108}{36} = 3
      $$

      ### 5 · Comprobar que es mínimo

      $$
      A''(x) = 2+\frac{864}{x^{3}}, \qquad A''(6) = 2+\frac{864}{216} = 6 > 0
      $$

      Mínimo ✔ Y además $A''>0$ para todo $x>0$, así que la función es convexa
      en todo el dominio y el mínimo es **global**, no solo local.

      ### 6 · El resultado

      $$
      A = 6^{2}+\frac{432}{6} = 36+72 = 108
      $$

      $$
      \boxed{\;\text{base } 6\times6\ \text{m},\quad \text{altura } 3\ \text{m},
      \quad A_{\min} = 108\ \text{m}^{2}\;}
      $$

      ### 7 · La proporción óptima, y por qué no es un cubo

      $$
      \frac{\text{lado}}{\text{altura}} = \frac{6}{3} = 2
      $$

      **La base mide el doble que la altura.** Y no es casualidad del 108: sale
      igual con cualquier volumen. De $2x^{3} = 4V$ se obtiene
      $x = \sqrt[3]{2V}$ y $h = \frac{V}{x^{2}} = \frac{x}{2}$ siempre.

      Conviene contrastarlo con la intuición: para una caja **cerrada**, la
      forma óptima es el cubo. Aquí no lo es, porque **la tapa no se paga**: si
      la cara de arriba es gratis, conviene hacerla grande y bajar la caja.

      La diferencia es notable. Un cubo de volumen 108 tendría lado
      $\sqrt[3]{108} \approx 4{,}76$ y, sin tapa, superficie

      $$
      4{,}76^{2}+4\cdot4{,}76\cdot4{,}76 \approx 22{,}7+90{,}6 = 113{,}3\ \text{m}^{2}
      $$

      **más** que los 108 de la caja óptima ✔

      ### 8 · Comprobación

      | $x$ | $h = \frac{108}{x^{2}}$ | $A = x^{2}+4xh$ |
      |---|---|---|
      | $4$ | $6{,}75$ | $16+108 = 124$ |
      | $5$ | $4{,}32$ | $25+86{,}4 = 111{,}4$ |
      | $\mathbf{6}$ | $\mathbf{3}$ | $\mathbf{36+72 = 108}$ |
      | $7$ | $2{,}20$ | $49+61{,}7 = 110{,}7$ |
      | $8$ | $1{,}69$ | $64+54 = 118$ |

      Baja hasta 108 y vuelve a subir ✔

      Y el volumen se conserva en todas las filas: $6^{2}\cdot3 = 108$ ✔

