        <text x="97" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
        <text x="157" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
        <text x="217" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">3</text>
        <text x="277" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">4</text>
        <text x="284" y="44" font-size="11" fill="var(--live)" font-family="var(--mono)">f</text>

        <text x="86" y="42" font-size="9.5" fill="var(--faint)" font-family="var(--mono)">máx</text>
        <text x="212" y="168" font-size="9.5" fill="var(--faint)" font-family="var(--mono)">mín</text>
        <text x="166" y="96" font-size="9.5" fill="var(--alt)" font-family="var(--mono)">inflexión</text>
      </svg>
      <figcaption>La gráfica de f. Todo lo que se pregunta se lee de su forma: la pendiente da f ′ y la curvatura da f ″.</figcaption>
      </figure>
    pide: Los intervalos donde f′ es positiva y el punto donde f″ cambia de signo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar en el dibujo para saber el signo de $f'$?
        opciones:
          - texto: >-
              Si la curva **sube o baja**: la pendiente de la propia gráfica
            correcta: true
            mensaje: |
              Eso es. $f'$ es la pendiente, así que su signo se lee del sentido
              en que va la curva, y no hace falta ninguna fórmula.
          - texto: >-
              Si la curva está **por encima o por debajo** del eje
            mensaje: |
              Eso es el signo de $f$, no el de $f'$. Aquí la curva llega a
              tocar el eje en $x=3$ y eso no dice nada de su pendiente — de
              hecho ahí la pendiente es cero, pero por ser un mínimo, no por
              estar en el eje.
          - texto: >-
              Cómo se curva: si se dobla hacia arriba o hacia abajo
            mensaje: |
              Esa es la **segunda** derivada, que es la otra mitad del
              ejercicio. Es la confusión que más veces convierte este apartado
              en dos respuestas cruzadas: la pendiente es $f'$, la curvatura es
              $f''$.

      - tipo: reconocer
        pregunta: |
          La curva sube, hace cumbre en $x=1$, baja hasta $x=3$ y vuelve a
          subir. ¿Dónde es $f'>0$?
        opciones:
          - texto: >-
              En $(0,1)$ y en $(3,4)$
            correcta: true
            mensaje: |
              Exacto: donde la curva sube. En $x=1$ y $x=3$ la pendiente es
              cero, y entre medias es negativa.
          - texto: >-
              En $(1,3)$
            mensaje: |
              Ahí la curva **baja**, así que $f'$ es negativa. Es el intervalo
              contrario.
          - texto: >-
              En todo $(0,4)$ menos en $x=2$
            mensaje: |
              El $x=2$ es la inflexión, y ahí no pasa nada con $f'$: la curva
              sigue bajando. Lo que se anula en la inflexión es $f''$.

      - tipo: calcular
        titulo: Dónde cambia de signo la segunda derivada
        pregunta: |
          Antes de $x=2$ la curva se dobla hacia abajo y después hacia arriba.
          ¿En qué $x$ cambia de signo $f''$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entre 0 y 4
        distractores:
          - valor: '1'
            mensaje: |
              Ahí está el **máximo**, que es donde se anula $f'$, no $f''$. En
              el máximo la curva se dobla hacia abajo tanto antes como después:
              la curvatura no cambia de signo.
          - valor: '3'
            mensaje: |
              Ahí está el **mínimo**, y pasa lo mismo del revés: la curva se
              dobla hacia arriba a los dos lados. El punto donde cambia la
              curvatura está entre el máximo y el mínimo.
        pista: |
          La inflexión es donde la curva pasa de doblarse hacia un lado a
          doblarse hacia el otro. En el dibujo va marcada.
        desarrollo: |
          Entre el máximo y el mínimo la curva pasa de **cóncava hacia abajo**
          a **cóncava hacia arriba**, y ese punto es la inflexión:

          $$
          x = 2
          $$

          Ahí $f''$ se anula y cambia de signo: negativa en $(0,2)$, positiva
          en $(2,4)$.

      - tipo: justificar
        pregunta: Ordena la lectura completa del dibujo. Una pieza es falsa.
        piezas:
          - texto: >-
              $f'>0$ donde la curva sube: en $(0,1)$ y en $(3,4)$.
          - texto: >-
              $f'=0$ en los dos puntos donde la curva hace cumbre y valle:
              $x=1$ y $x=3$.
          - texto: >-
              $f''<0$ mientras la curva se dobla hacia abajo, en $(0,2)$, y
              $f''>0$ en $(2,4)$.
          - texto: >-
              Como $f(3)=0$, en $x=3$ la función tiene también un cero de $f'$
              **y** de $f''$.
            trampa: true
            mensaje: |
              Que la curva **toque el eje** en $x=3$ es un cero de $f$, y no
              tiene nada que ver con sus derivadas. Ahí sí se anula $f'$, pero
              porque es un mínimo; y $f''$ no se anula: es positiva, que es
              justo lo que hace que sea mínimo y no máximo. Tres cosas
              distintas que coinciden en la misma $x$ y no son la misma.
        veredicto: |
          Eso es lo que el examen comprueba con este formato: que sepas separar
          las tres lecturas —dónde está la curva, hacia dónde va y cómo se
          dobla— en un dibujo donde se ven las tres a la vez.
    resolucion: |
      **Nada de esto se calcula.** No hay fórmula y no hace falta: las tres
      preguntas se contestan mirando la curva, y cada una mira una cosa
      distinta.

      | qué se pregunta | qué se mira en el dibujo |
      |---|---|
      | signo de $f$ | si la curva está por encima o por debajo del eje |
      | signo de $f'$ | si la curva **sube o baja** |
      | signo de $f''$ | hacia dónde se **dobla** |

      ### $f'$, la pendiente

      $$
      f' > 0 \text{ en } (0,1) \cup (3,4),
      \qquad
      f' < 0 \text{ en } (1,3),
      \qquad
      f' = 0 \text{ en } x=1 \text{ y } x=3
      $$

      El máximo está en $x=1$ y el mínimo en $x=3$: son los dos puntos donde la
      curva cambia de sentido.

      ### $f''$, la curvatura

      $$
      f'' < 0 \text{ en } (0,2),
      \qquad
      f'' > 0 \text{ en } (2,4),
      \qquad
      f'' = 0 \text{ en } x=2
      $$

      La inflexión está **entre** el máximo y el mínimo, y ese es el sitio
      donde casi siempre está: la curva tiene que dejar de doblarse hacia abajo
      en algún momento para poder llegar al valle.

      **Lo que hay que llevarse.** Tres preguntas, tres lecturas, y ninguna se
      contesta con la de al lado. El error de esta familia no es calcular mal:
      es contestar sobre $f$ lo que preguntaban de $f'$, o confundir el cero de
      la función con el cero de la derivada — como en $x=3$, donde coinciden
      por casualidad y no significan lo mismo.

  - id: ej-signos-del-polinomio-de-taylor
    titulo: Los signos del polinomio de Taylor, leídos en el dibujo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. Prepara la familia de «Taylor
      leído en una gráfica», que cae en seis convocatorias y no tenía rampa:
      los dos ejemplos de Taylor del tema explican la fórmula pero ninguno
      trae figura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      La figura es la gráfica de una función $f$ de la que **no se da la
      fórmula**. En el punto $a=1$ está marcada la curva y su recta tangente.

      <figure>
      <svg viewBox="15 10 265 175" role="img" aria-labelledby="t4tayT t4tayD">
        <title id="t4tayT">Una curva decreciente y convexa, con su tangente marcada en x igual a 1</title>
        <desc id="t4tayD">La curva baja de izquierda a derecha haciendo valle cerca de x igual a 4, y en todo el tramo está por encima del eje horizontal. En x igual a 1 hay un punto marcado y dibujada su recta tangente, que baja.</desc>

        <line x1="30" y1="160" x2="275" y2="160" stroke="var(--rule)" stroke-width="1.2"></line>
        <line x1="40" y1="172" x2="40" y2="18" stroke="var(--rule)" stroke-width="1.2"></line>

        <line x1="49" y1="35" x2="139" y2="119" stroke="var(--alt)" stroke-width="1.4" stroke-dasharray="5 3"></line>

        <polyline points="40,20 49,31 58,41 67,51 76,60 85,69 94,77 103,85 112,92 121,98 130,104 139,109 148,114 157,118 166,122 175,125 184,128 193,129 202,131 211,132 220,132 229,132 238,131 247,129 256,128 265,125" fill="none" stroke="var(--live)" stroke-width="2"></polyline>

        <circle cx="85" cy="69" r="4" fill="var(--alt)"></circle>
        <line x1="85" y1="69" x2="85" y2="160" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"></line>

        <text x="81" y="174" font-size="10" fill="var(--alt)" font-family="var(--mono)">a = 1</text>
        <text x="143" y="120" font-size="9.5" fill="var(--alt)" font-family="var(--mono)">tangente</text>
        <text x="268" y="120" font-size="11" fill="var(--live)" font-family="var(--mono)">f</text>
        <text x="34" y="174" font-size="10" fill="var(--faint)" font-family="var(--mono)">0</text>
      </svg>
      <figcaption>La curva y su tangente en a = 1. No hace falta la fórmula: los tres signos se leen del dibujo.</figcaption>
      </figure>

      El polinomio de Taylor de orden 2 en $a=1$ es

      $$
      P_2(x) = f(1) + f'(1)\,(x-1) + \frac{f''(1)}{2}\,(x-1)^{2}
      $$

      Decir el **signo** de cada uno de los tres coeficientes.
    pide: El signo de f(1), de f′(1) y de f″(1).
    pasos:
      - tipo: reconocer
        pregunta: |
          El primer coeficiente es $f(1)$. ¿Qué hay que mirar?
        opciones:
          - texto: >-
              La **altura** de la curva en $x=1$: está por encima del eje,
              luego $f(1)>0$
            correcta: true
            mensaje: |
              Eso es. El término independiente del polinomio es el valor de la
              función en el punto, y eso se lee directamente de dónde está la
              curva respecto del eje.
          - texto: >-
              Que la curva esté bajando, luego $f(1)<0$
            mensaje: |
              Bajar es cosa de la **derivada**. La curva puede estar bajando
              muy por encima del eje —como aquí— y su valor sigue siendo
              positivo. Es la confusión que estos enunciados buscan.
          - texto: >-
              No se puede saber sin la fórmula
            mensaje: |
              Se ve: el punto marcado está claramente por encima del eje. Estos
              enunciados no dan la fórmula precisamente porque no hace falta
              para los signos.

      - tipo: reconocer
        pregunta: |
          El segundo es $f'(1)$, y la tangente está dibujada. ¿Qué signo tiene?
        opciones:
          - texto: >-
              Negativo: la tangente **baja**
            correcta: true
            mensaje: |
              Exacto. La derivada es la pendiente de la tangente, y esa recta
              va hacia abajo de izquierda a derecha.
          - texto: >-
              Positivo, porque la curva está por encima del eje
            mensaje: |
              Estar arriba es el signo de $f$, no el de $f'$. Son los dos
              primeros coeficientes y miden cosas distintas: uno dónde está la
              curva y otro hacia dónde va.
          - texto: >-
              Cero, porque hay una tangente dibujada
            mensaje: |
              Toda función derivable tiene tangente en todos sus puntos; que
              esté dibujada no significa que sea horizontal. Solo valdría cero
              si fuese **paralela al eje**, y aquí baja claramente.

      - tipo: reconocer
        pregunta: |
          Y el tercero lleva $f''(1)$. Mirando cómo se dobla la curva cerca de
          $x=1$, ¿qué signo tiene?
        opciones:
          - texto: >-
              Positivo: la curva se dobla hacia arriba y queda **por encima**
              de su tangente
            correcta: true
            mensaje: |
              Eso es, y fíjate en la comprobación que da el dibujo: la curva
              está por encima de la recta de trazos a los dos lados del punto.
              Eso es exactamente ser convexa, y es $f''>0$.
          - texto: >-
              Negativo, porque la curva está bajando
            mensaje: |
              Bajar es $f'<0$, que ya está contestado. Una curva puede bajar
              doblándose hacia arriba —es lo que hace esta— o hacia abajo: son
              dos cosas independientes.
          - texto: >-
              Cero, porque la curva parece casi recta ahí
            mensaje: |
              Si fuese recta la tangente se confundiría con ella, y aquí se
              separan visiblemente a los dos lados. Esa separación **es** la
              segunda derivada.

      - tipo: calcular
        titulo: Cuántos coeficientes son positivos
        pregunta: |
          De los tres coeficientes de $P_2$ —el independiente, el de $(x-1)$ y
          el de $(x-1)^{2}$—, ¿cuántos son positivos?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              El de $(x-1)$ es $f'(1)$, y la tangente baja: ese es negativo.
              Los otros dos sí son positivos.
          - valor: '1'
            mensaje: |
              Son dos: $f(1)>0$ porque la curva está arriba, y
              $f''(1)/2>0$ porque se dobla hacia arriba. Solo el del medio es
              negativo.
        pista: |
          Uno por pregunta: arriba, bajando, doblándose hacia arriba.
        desarrollo: |
          $$
          P_2(x) = \underbrace{f(1)}_{>0}
          + \underbrace{f'(1)}_{<0}(x-1)
          + \underbrace{\tfrac{f''(1)}{2}}_{>0}(x-1)^{2}
          $$

          **Dos** positivos y uno negativo, y ninguno ha hecho falta calcularlo.

      - tipo: justificar
        pregunta: Ordena las tres lecturas. Una pieza es falsa.
        piezas:
          - texto: >-
              $f(1)>0$ porque el punto marcado está por encima del eje.
          - texto: >-
              $f'(1)<0$ porque la tangente dibujada baja de izquierda a
              derecha.
          - texto: >-
              $f''(1)>0$ porque la curva se dobla hacia arriba, y se comprueba
              en que queda por encima de su tangente a los dos lados.
          - texto: >-
              Como $f'(1)<0$, el polinomio $P_2$ también decrece en todo el
              intervalo dibujado.
            trampa: true
            mensaje: |
              $P_2$ es una **parábola** con el coeficiente cuadrático positivo:
              baja al principio y acaba subiendo, igual que la propia $f$. Que
              su derivada en el punto sea negativa dice lo que hace **ahí**, no
              en todo el intervalo. Confundir el signo de la derivada en un
              punto con el comportamiento global es el error clásico de esta
              familia.
        veredicto: |
          Tres coeficientes, tres lecturas distintas del mismo dibujo: dónde
          está la curva, hacia dónde va y cómo se dobla. Es la misma terna del
          ejemplo de leer la gráfica de $f$, ahora puesta dentro de un
          polinomio.
    resolucion: |
      **No hace falta la fórmula**, y ese es el punto del ejercicio. Cada
      coeficiente de Taylor mide una cosa que se ve:

      | coeficiente | qué es | qué se mira | signo |
      |---|---|---|---|
      | independiente | $f(1)$ | dónde está la curva | $+$ |
      | de $(x-1)$ | $f'(1)$ | hacia dónde va la tangente | $-$ |
      | de $(x-1)^{2}$ | $f''(1)/2$ | hacia dónde se dobla | $+$ |

      $$
      P_2(x) = \underbrace{f(1)}_{+}
      + \underbrace{f'(1)}_{-}(x-1)
      + \underbrace{\tfrac{f''(1)}{2}}_{+}(x-1)^{2}
      $$

      ### La comprobación que regala el dibujo

      La tangente está dibujada a propósito: **una curva convexa queda siempre
      por encima de su tangente**, y aquí se ve a los dos lados del punto. Eso
      confirma $f''>0$ sin medir nada.

      Al revés valdría igual: si la curva quedase por debajo de su tangente,
      sería cóncava y el tercer coeficiente sería negativo.

      **Lo que hay que llevarse.** Los tres coeficientes de $P_2$ son las tres
      lecturas de siempre —posición, pendiente y curvatura— escritas en fila.
      Por eso el examen se atreve a pedirlos sin dar la función: no está
      pidiendo una cuenta, está pidiendo que sepas qué significa cada término.

  - id: ej-el-cuadrado-de-la-derivada
    titulo: El cuadrado de la derivada, sin conocer la función
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, para el hueco de «leer una
      gráfica». Prepara un enunciado que ha caído dos veces idéntico —la
      extraordinaria de 2017-2018 y la de 2023-2024, palabra por palabra— y que
      no tenía ninguna rampa delante. La curva es la misma del ejemplo
      anterior, a propósito: lo único nuevo aquí es la idea.
    nivel: ejemplo
    enunciado: |
      La figura vuelve a ser la gráfica de $f$, la misma de antes: sube hasta
      un máximo en $x=1$, baja hasta un mínimo en $x=3$, y su inflexión está en
      $x=2$.

      Ahora considera $h(x) = \big(f'(x)\big)^{2}$.

      a) ¿Dónde crece $h$?

      b) ¿Dónde tiene extremos, y de qué tipo?

      <figure>
      <svg viewBox="10 25 290 175" role="img" aria-labelledby="t4cdT t4cdD">
        <title id="t4cdT">La misma curva, con el signo de f prima y f segunda en cada tramo</title>
        <desc id="t4cdD">La curva de antes, con el eje dividido en cuatro tramos por el máximo, la inflexión y el mínimo. Debajo de cada tramo se indican los signos de la primera y la segunda derivada: más y menos entre 0 y 1, menos y menos entre 1 y 2, menos y más entre 2 y 3, más y más entre 3 y 4.</desc>

        <line x1="30" y1="150" x2="292" y2="150" stroke="var(--rule)" stroke-width="1.2"></line>
        <line x1="40" y1="165" x2="40" y2="40" stroke="var(--rule)" stroke-width="1.2"></line>

        <line x1="100" y1="150" x2="100" y2="50" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"></line>
        <line x1="160" y1="150" x2="160" y2="100" stroke="var(--alt)" stroke-width="1.2" stroke-dasharray="4 3"></line>

        <polyline points="40,150 52,110.8 64,82.4 76,63.6 88,53.2 100,50 112,52.8 124,60.4 136,71.6 148,85.2 160,100 172,114.8 184,128.4 196,139.6 208,147.2 220,150 232,146.8 244,136.4 256,117.6 268,89.2 280,50" fill="none" stroke="var(--live)" stroke-width="2"></polyline>

        <circle cx="100" cy="50" r="3.5" fill="var(--live)"></circle>
        <circle cx="160" cy="100" r="3.5" fill="var(--alt)"></circle>
        <circle cx="220" cy="150" r="3.5" fill="var(--live)"></circle>

        <text x="36" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">0</text>
        <text x="97" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
        <text x="157" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
        <text x="217" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">3</text>
        <text x="277" y="163" font-size="10" fill="var(--faint)" font-family="var(--mono)">4</text>
        <text x="284" y="44" font-size="11" fill="var(--live)" font-family="var(--mono)">f</text>

        <text x="58" y="182" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">f′+ f″−</text>
        <text x="118" y="182" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">f′− f″−</text>
        <text x="178" y="182" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">f′− f″+</text>
        <text x="238" y="182" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">f′+ f″+</text>
      </svg>
      <figcaption>La misma curva, con los signos de f ′ y f ″ en cada uno de los cuatro tramos. Con eso basta.</figcaption>
      </figure>
    pide: Los intervalos de crecimiento de h y sus extremos, con su tipo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Lo primero, y es todo el ejercicio: ¿cuánto vale $h'$?
        opciones:
          - texto: >-
              $h' = 2\,f'\,f''$, por la regla de la cadena
            correcta: true
            mensaje: |
              Exacto. $h$ es el cuadrado de $f'$, así que derivar da dos por la
              base por su derivada — y la derivada de $f'$ es $f''$. A partir
              de aquí ya no hay que pensar en $h$: basta con los signos de las
              dos derivadas de $f$, que están en el dibujo.
          - texto: >-
              $h' = 2\,f'$
            mensaje: |
              Falta la cadena. Si fuese $h = x^{2}$ la derivada sería $2x$,
              pero la base no es $x$: es $f'(x)$, que a su vez depende de $x$.
              Hay que multiplicar por su derivada, que es $f''$.
          - texto: >-
              $h' = \big(f''\big)^{2}$
            mensaje: |
              Ese sería el cuadrado de la segunda derivada, que es otra
              función. Derivar un cuadrado no eleva al cuadrado la derivada:
              $\big(u^{2}\big)' = 2uu'$.

      - tipo: reconocer
        pregunta: |
          Entonces $h$ crece donde $f'f''>0$. ¿Y cuándo es positivo ese
          producto?
        opciones:
          - texto: >-
              Cuando $f'$ y $f''$ tienen **el mismo signo**, los dos positivos
              o los dos negativos
            correcta: true
            mensaje: |
              Eso es, y es lo que hace que este ejercicio se resuelva mirando
              el dibujo: donde la curva **sube y se dobla hacia arriba**, o
              donde **baja y se dobla hacia abajo**.
          - texto: >-
              Solo cuando los dos son positivos
            mensaje: |
              Dos negativos también dan producto positivo, y ese caso existe
              aquí: entre $x=1$ y $x=2$ la curva baja y se dobla hacia abajo.
              Olvidarlo deja fuera un intervalo entero de crecimiento.
          - texto: >-
              Cuando $f$ es positiva
            mensaje: |
              El signo de $f$ no aparece en $h'=2f'f''$. Da igual dónde esté la
              curva respecto del eje: lo que decide es cómo va y cómo se dobla.

      - tipo: calcular
        titulo: Dónde está el máximo de h
        pregunta: |
          Con la tabla de signos del dibujo, $h$ decrece en $(0,1)$, crece en
          $(1,2)$, decrece en $(2,3)$ y crece en $(3,4)$. ¿En qué $x$ tiene un
          **máximo** local?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entre 0 y 4
        distractores:
          - valor: '1'
            mensaje: |
              Ahí $h$ pasa de decrecer a crecer, así que es un **mínimo** — y
              además vale cero, porque $f'(1)=0$ y $h$ es un cuadrado. Los
              extremos de $f$ dan los mínimos de $h$, no sus máximos.
          - valor: '3'
            mensaje: |
              El otro mínimo, por lo mismo: $f'(3)=0$, así que $h(3)=0$.
          - valor: '0'
            mensaje: |
              En el borde del intervalo no hay extremo local; además $h$ está
              decreciendo ahí.
        pista: |
          El máximo está donde $h$ pasa de crecer a decrecer. Míralo en la
          tabla de signos.
        desarrollo: |
          $h$ crece en $(1,2)$ y decrece en $(2,3)$, así que en $x=2$ pasa de
          subir a bajar:

          $$
          x = 2 \quad\text{(máximo local)}
          $$

          Y no es casualidad que sea **la inflexión de $f$**: ahí es donde
          $f''$ cambia de signo, que es lo único que puede hacer cambiar el
          signo de $h'=2f'f''$ sin que $f'$ se anule.

      - tipo: justificar
        pregunta: Ordena el razonamiento entero. Una pieza es falsa.
        piezas:
          - texto: >-
              $h=(f')^{2}$, luego $h'=2f'f''$: el signo de $h'$ es el del
              **producto** de las dos derivadas de $f$.
          - texto: >-
              $h$ crece donde $f'$ y $f''$ tienen el mismo signo: en $(1,2)$
              —baja y se dobla hacia abajo— y en $(3,4)$ —sube y se dobla hacia
              arriba—.
          - texto: >-
              Donde $f'=0$, o sea en $x=1$ y $x=3$, la función $h$ vale cero. Y
              como es un cuadrado nunca es negativa, esos dos son **mínimos
              absolutos**.
          - texto: >-
              En la inflexión $x=2$ también se anula $h$, porque $f''=0$ allí.
            trampa: true
            mensaje: |
              Se anula $h'$, no $h$. En $x=2$ la derivada $f'$ vale $-3$, así
              que $h(2)=9$: es el punto más **alto** del tramo, no un cero.
              Confundir «se anula la derivada de $h$» con «se anula $h$» es el
              error que convierte el máximo en un mínimo.
        veredicto: |
          Fíjate en el reparto, que es lo que hay que llevarse: los ceros de
          $f'$ dan los **mínimos** de $h$, y los ceros de $f''$ dan sus
          **máximos**. Un extremo de $f$ y una inflexión de $f$ producen cosas
          opuestas en $h$.
    resolucion: |
      **Todo sale de una línea**, y el resto es leer el dibujo:

      $$
      h = \big(f'\big)^{2}
      \quad\Longrightarrow\quad
      h' = 2\,f'\,f''
      $$

      Así que **el signo de $h'$ es el signo del producto $f'f''$**, y los dos
      factores se leen de la gráfica de $f$: el primero de si sube o baja, el
      segundo de hacia dónde se dobla.

      ### a) El crecimiento

      | tramo | $f'$ | $f''$ | $h'=2f'f''$ | $h$ |
      |---|---|---|---|---|
      | $(0,1)$ | $+$ | $-$ | $-$ | decrece |
      | $(1,2)$ | $-$ | $-$ | $+$ | **crece** |
      | $(2,3)$ | $-$ | $+$ | $-$ | decrece |
      | $(3,4)$ | $+$ | $+$ | $+$ | **crece** |

      El tramo $(1,2)$ es el que más se falla: la curva **baja**, y aun así $h$
      sube, porque los dos factores son negativos y su producto es positivo.

      ### b) Los extremos

      $$
      x=1 \text{ y } x=3: \quad f'=0 \;\Rightarrow\; h=0 \quad\text{(mínimos)}
      $$

      $$
      x=2: \quad f''=0 \;\Rightarrow\; h'=0, \quad h(2)=\big(f'(2)\big)^{2} \quad\text{(máximo)}
      $$

      Y como $h$ es un cuadrado, nunca es negativa: los dos ceros son mínimos
      **absolutos**, no solo locales.

      **Lo que hay que llevarse.** En $h=(f')^{2}$ los papeles se cruzan: los
      **extremos** de $f$ dan los **mínimos** de $h$, y las **inflexiones** de
      $f$ dan sus **máximos**. Nada de esto necesita conocer $f$, y por eso el
      enunciado se atreve a no dártela.

  - id: ej-leer-grafica-derivada
    titulo: Lo dibujado es la derivada, no la función
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      **Lo dibujado es $f'$, no $f$.** Decir dónde crece $f$, dónde tiene
      extremos y cómo se curva.

      <figure>
      <svg viewBox="30 5 250 195" role="img" aria-labelledby="t4dvT t4dvD">
        <title id="t4dvT">La gráfica de la derivada: una recta por el origen con pendiente positiva</title>
        <desc id="t4dvD">Unos ejes con una recta que pasa por el origen subiendo de izquierda a derecha. A la izquierda del origen la recta está por debajo del eje horizontal y esa mitad va rotulada «f prima negativa, f decrece»; a la derecha está por encima y va rotulada «f prima positiva, f crece». El corte con el eje en el origen va marcado con un punto.</desc>

        <line x1="45" y1="100" x2="265" y2="100" stroke="var(--rule)" stroke-width="1.2"></line>
        <line x1="150" y1="185" x2="150" y2="20" stroke="var(--rule)" stroke-width="1.2"></line>

        <line x1="45" y1="175" x2="255" y2="25" stroke="var(--live)" stroke-width="2"></line>
        <circle cx="150" cy="100" r="3.5" fill="var(--live)"></circle>

        <text x="256" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">x</text>
        <text x="240" y="22" font-size="11" fill="var(--live)" font-family="var(--mono)">f ′</text>
        <text x="155" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">0</text>

        <text x="52" y="136" font-size="9.5" fill="var(--alt)" font-family="var(--mono)">f ′ &lt; 0</text>
        <text x="52" y="150" font-size="9.5" fill="var(--alt)" font-family="var(--mono)">f decrece</text>
        <text x="196" y="62" font-size="9.5" fill="var(--live)" font-family="var(--mono)">f ′ &gt; 0</text>
        <text x="196" y="76" font-size="9.5" fill="var(--live)" font-family="var(--mono)">f crece</text>
      </svg>
      <figcaption>La recta es f ′. Lo que hace f se lee del signo de esta gráfica, no de su forma.</figcaption>
      </figure>

      La recta pasa por el origen con pendiente 1, así que $f'(x) = x$.
    pide: Los intervalos de crecimiento, los extremos y la concavidad de f.
    pasos:
      - tipo: reconocer
        pregunta: |
          Lo dibujado corta el eje en $x=0$. ¿Qué significa eso para $f$?
        opciones:
          - texto: Que $f$ tiene ahí un punto crítico
            correcta: true
            mensaje: |
              Eso es. Que la curva **dibujada** valga cero significa que la
              derivada se anula, y eso es un punto crítico de la función que no
              ves.
          - texto: Que $f$ vale cero en el origen
            mensaje: |
              Eso sería si lo dibujado fuera $f$. Es $f'$, así que lo que se
              anula es la pendiente, no el valor.
          - texto: Que $f$ no está definida en el origen
            mensaje: |
              Nada de eso. La derivada existe y vale cero, que es una situación
              perfectamente normal: tangente horizontal.
      - tipo: calcular
        titulo: Dónde decrece
        pregunta: |
          $f$ decrece donde $f'$ es negativa. Con $f'(x) = x$, ¿cuál es el
          mayor valor de $x$ en el que $f$ decrece?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              En $x=1$ la derivada vale 1, que es positiva: ahí la función
              **crece**. Decrece mientras $x$ sea negativa.
          - valor: '-1'
            mensaje: |
              En $x=-1$ sí decrece, pero no es el mayor: sigue decreciendo hasta
              llegar al cero, donde la derivada se anula.
        pista: |
          $f'(x) = x < 0$ exactamente cuando $x < 0$.
        desarrollo: |
          $$
          f'(x) = x < 0 \;\Longleftrightarrow\; x < 0
          $$

          Así que $f$ decrece en $(-\infty, 0)$ y crece en $(0,\infty)$. El
          punto de corte, $x=0$, es la frontera.
      - tipo: justificar
        pregunta: |
          Ordena la lectura completa. Una pieza es falsa.
        piezas:
          - texto: Lo dibujado es $f'$, así que su altura es la pendiente de $f$.
          - texto: Con $f' < 0$ para $x<0$ y $f' > 0$ para $x>0$, la función decrece y luego crece.
          - texto: En $x=0$ la derivada pasa de negativa a positiva, luego hay un **mínimo** de $f$.
          - texto: La curva dibujada sube siempre, luego $f'' > 0$ y $f$ es convexa en todo $\mathbb{R}$.
          - texto: Como lo dibujado tiene un cero en el origen, $f$ vale cero ahí.
            trampa: true
            mensaje: |
              Ese es **el** error del ejercicio. Un cero de la curva dibujada es
              un cero de la derivada, no de la función. El valor de $f$ en el
              origen no se puede saber con esta información: falta una
              constante.
    resolucion: |
      **Antes de contestar nada**, escribir en el margen qué es cada cosa: lo
      dibujado es $f'$; lo que preguntan es sobre $f$. Treinta segundos que
      valen seis o siete puntos.

      **Crecimiento**, que lo da el signo de lo dibujado:

      $$
      f'(x) = x
      \quad\Rightarrow\quad
      f \text{ decrece en } (-\infty,0), \quad f \text{ crece en } (0,\infty)
      $$

      **Extremos**, que están donde la curva dibujada corta el eje. En $x=0$
      pasa de negativa a positiva, así que $f$ tiene ahí un **mínimo**.

      **Curvatura**, que la da si la curva dibujada sube o baja. Aquí sube
      siempre, luego $f'' > 0$ y $f$ es **convexa** en todo $\mathbb{R}$. Y como
      $f''$ no cambia de signo, no hay puntos de inflexión.

      **Lo que no se puede saber.** Cuánto vale $f$ en cualquier punto. La
      gráfica de la derivada determina la función salvo una constante: todas las
      $f(x) = \frac{x^{2}}{2} + C$ tienen esta misma derivada.
  - id: ej-cual-de-las-dos-es-la-derivada
    titulo: Dos curvas, y decidir cuál deriva a cuál
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      En la figura hay dos curvas, **A** y **B**, dibujadas sobre los mismos
      ejes. Una es la derivada de la otra. Decidir cuál es cuál, y justificarlo
      sin calcular nada.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 300" role="img" width="440" height="287"
           aria-labelledby="c04dt c04dd">
        <title id="c04dt">Dos curvas sobre los mismos ejes, rotuladas A y B</title>
        <desc id="c04dd">La curva A es una parábola con el vértice en el punto
        de abscisa cero y ordenada menos uno, y corta al eje horizontal en
        menos uno y en uno. La curva B sube por la izquierda, alcanza un máximo
        en menos uno, baja pasando por el origen, alcanza un mínimo en uno y
        vuelve a subir; corta al eje horizontal en tres puntos: el origen y dos
        más, cerca de los extremos del dibujo. Dos líneas de puntos verticales
        marcan las abscisas menos uno y uno, y sobre cada una hay dos puntos
        gruesos: el de la curva A está justo en el eje horizontal y el de la B,
        en su máximo y en su mínimo.</desc>

        <g stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
          <path d="M130 30 L130 258 M330 30 L330 258"></path>
        </g>
        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M30 174 L432 174 M230 25 L230 262"></path>
        </g>

        <path fill="none" stroke="var(--live)" stroke-width="2.6"
              d="M50 39.6 L70 80.4 L90 116.4 L110 147.6 L130 174 L150 195.6
                 L170 212.4 L190 224.4 L210 231.6 L230 234 L250 231.6
                 L270 224.4 L290 212.4 L310 195.6 L330 174 L350 147.6
                 L370 116.4 L390 80.4 L410 39.6"></path>
        <path fill="none" stroke="var(--alt)" stroke-width="2.6"
              d="M50 182.6 L70 159.9 L90 144.9 L110 136.6 L130 134 L150 136.3
                 L170 142.3 L190 151.3 L210 162.2 L230 174 L250 185.8
                 L270 196.7 L290 205.7 L310 211.7 L330 214 L350 211.4
                 L370 203.1 L390 188.1 L410 165.4"></path>

        <g fill="var(--live)" stroke="none">
          <circle cx="130" cy="174" r="4.2"></circle>
          <circle cx="330" cy="174" r="4.2"></circle>
        </g>
        <g fill="var(--alt)" stroke="none">
          <circle cx="130" cy="134" r="4.2"></circle>
          <circle cx="330" cy="214" r="4.2"></circle>
        </g>

        <g font-family="var(--mono)" font-size="16" font-weight="600">
          <text x="416" y="46" fill="var(--live)">A</text>
          <text x="416" y="172" fill="var(--alt)">B</text>
        </g>
        <g font-family="var(--mono)" font-size="14" fill="var(--graphite)">
          <text x="119" y="194">-1</text>
          <text x="326" y="194">1</text>
          <text x="234" y="194">0</text>
        </g>
      </svg>
      <figcaption>

      Las dos líneas de puntos marcan **x = −1** y **x = 1**. No hace falta
      ninguna fórmula: todo lo que decide la respuesta está en dónde corta una
      y dónde se pone horizontal la otra.

      </figcaption>
      </figure>
    pide: Cuál de las dos es la derivada, con el argumento que lo demuestra.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para decidir cuál es la derivada de cuál, ¿qué hay que mirar?
        opciones:
          - texto: Dónde una corta al eje horizontal y dónde la otra tiene tangente horizontal — tienen que coincidir
            correcta: true
            mensaje: |
              Eso es, y es lo único que hay que mirar. La derivada vale cero
              exactamente donde la función se pone horizontal, así que los
              ceros de una tienen que caer justo debajo de los extremos de la
              otra. **Todos**, no uno.
          - texto: Cuál de las dos va por debajo
            mensaje: |
              La posición no dice nada. Súmale una constante a una función y
              su gráfica sube entera sin que su derivada cambie ni un poco:
              cualquiera de las dos puede ir arriba o abajo.
          - texto: Cuál de las dos tiene menos grado
            mensaje: |
              Aquí acertarías, porque derivar un polinomio le baja un grado.
              Pero el grado no se ve en un dibujo —se deduce contando cortes y
              curvas— y con una exponencial o un seno la regla no existe. El
              criterio que siempre vale es el otro.
          - texto: Cuál de las dos crece más deprisa
            mensaje: |
              Que la derivada sea grande significa que la función crece
              deprisa, sí, pero eso no distingue cuál es cuál: en la parte
              derecha del dibujo las dos crecen a la vez.

      - tipo: calcular
        titulo: La pendiente de B en el origen
        pregunta: |
          Una vez decidido cuál es la derivada, ¿cuánto vale la pendiente de la
          curva **B** en $x = 0$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la curva B **pasa por cero**, que no es lo mismo que
              tener pendiente cero. El valor de la función lo lees en la propia
              B; su pendiente la lees en la otra curva.
          - valor: '1'
            mensaje: |
              El módulo está bien y el signo no. Mira la A en $x=0$: está por
              **debajo** del eje, así que la pendiente es negativa — y se ve
              también en la B, que ahí está bajando.
        pista: |
          La pendiente de B en un punto es el valor que la otra curva toma en
          ese mismo punto.
        desarrollo: |
          La derivada es **A**, así que la pendiente de B en $x=0$ es el valor
          de A en $x=0$, que es el vértice de la parábola:

          $$
          B'(0) = A(0) = -1
          $$

          Y encaja con lo que se ve: en el origen B está bajando, y bajando lo
          más deprisa que baja en todo el dibujo, porque ahí es donde A alcanza
          su mínimo.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              A corta al eje horizontal en $x=-1$ y en $x=1$, exactamente donde
              B tiene sus dos tangentes horizontales.
          - texto: >-
              Y los signos acompañan: a la izquierda de $-1$ la A es positiva y
              la B sube; entre $-1$ y $1$ la A es negativa y la B baja.
          - texto: 'Luego **A es la derivada de B**, y no al revés.'
          - texto: >-
              El mínimo de A en $x=0$ dice además que ahí está el punto de
              inflexión de B, que es donde más deprisa baja.
          - texto: >-
              También vale al revés: B es la derivada de A, porque B corta al
              eje justo donde A tiene su mínimo.
            trampa: true
            mensaje: |
              Es cierto que coinciden en $x=0$, y por eso engaña. Pero **una
              coincidencia no basta: tienen que coincidir todas**. Mira otra
              vez la figura: B corta al eje en **tres** puntos —el origen y dos
              más, cerca de los bordes— y A solo se pone horizontal en uno. Con
              dos cortes sin pareja, esa lectura se cae.
    resolucion: |
      **El criterio, y por qué es el único que hace falta.** La derivada se
      anula exactamente donde la función tiene tangente horizontal. Así que
      entre dos curvas basta con comprobar una cosa: si los **ceros** de una
      caen bajo los **extremos** de la otra.

      Aquí A corta el eje en $x=-1$ y en $x=1$, y es justo donde B se pone
      horizontal. Luego **A es la derivada de B**.

      **La comprobación que lo cierra, y que es la que se puntúa.** Con los
      ceros no basta: hay que mirar los signos, porque un cero de la derivada
      también podría ser un punto de inflexión.

      | dónde | signo de A | qué hace B |
      |---|---|---|
      | $x < -1$ | positiva | sube |
      | $-1 < x < 1$ | negativa | baja |
      | $x > 1$ | positiva | sube |

      Las tres filas encajan, así que la lectura es coherente en todo el
      dibujo y no solo en dos puntos.

      **Por qué la lectura contraria se cae.** Si B fuera la derivada de A, A
      tendría que ponerse horizontal en **cada** corte de B con el eje. B corta
      en tres sitios —el origen y dos cerca de los bordes— y A solo tiene una
      tangente horizontal, su vértice. Dos cortes sin pareja bastan para
      descartarla.

      Es el error que más veces cuesta este ejercicio en el examen: encontrar
      **una** coincidencia y dar la respuesta por buena.


  - id: ej-componer-un-desarrollo
    titulo: Un desarrollo compuesto, sin derivar ni una vez
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Obtener los tres primeros términos no nulos del desarrollo de Maclaurin
      de $f(x) = e^{x^{2}}$, sin calcular ninguna derivada.
    pide: Los tres primeros términos no nulos del desarrollo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no hace falta derivar para obtener este desarrollo?
        opciones:
          - texto: >-
              Porque el de $e^{u}$ ya se conoce, y basta sustituir $u = x^{2}$
            correcta: true
            mensaje: |
              Eso es. Los seis desarrollos memorizados no son seis casos: son
              seis **moldes**, y casi todo lo que cae sale de sustituir algo
              dentro de uno de ellos.
          - texto: Porque la función es par
            mensaje: |
              Es par, y eso explica que solo aparezcan potencias pares. Pero no
              es lo que ahorra las derivadas: lo que las ahorra es reconocer el
              molde.
          - texto: Porque el desarrollo de una exponencial siempre es finito
            mensaje: |
              No lo es: la serie de $e^{u}$ tiene infinitos términos. Lo que
              pide el enunciado son los tres primeros, que es otra cosa.
      - tipo: calcular
        titulo: El coeficiente de grado cuatro
        pregunta: |
          En $e^{x^{2}} = 1 + x^{2} + \frac{x^{4}}{2} + \ldots$, ¿cuál es el
          coeficiente de $x^{4}$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0005
          formato: en forma exacta (1/2), o con cuatro decimales
        distractores:
          - valor: '0.0416667'
            mensaje: |
              $\frac1{24} = \frac1{4!}$ sería el coeficiente de $x^{4}$ en el
              desarrollo de $e^{x}$. Aquí la potencia cuarta viene del término
              $\frac{u^{2}}{2!}$ con $u=x^{2}$, así que el factorial que toca es
              el $2!$, no el $4!$.
          - valor: '1'
            mensaje: |
              $1$ es el coeficiente de $x^{2}$, que sale del término $u$. El de
              $x^{4}$ viene del siguiente, y lleva el $\frac1{2!}$.
          - valor: '0.1666667'
            mensaje: |
              $\frac16 = \frac1{3!}$ es el coeficiente del término cúbico de
              $e^{u}$, que aquí da $x^{6}$, no $x^{4}$. Al sustituir
              $u = x^{2}$ **los grados se duplican**.
        pista: |
          En $e^{u} = 1+u+\frac{u^{2}}{2!}+\ldots$ pon $u = x^{2}$ y mira qué
          término produce $x^{4}$.
        desarrollo: |
          $$
          e^{u} = 1 + u + \frac{u^{2}}{2!} + \frac{u^{3}}{3!} + \ldots
          $$

          Con $u = x^{2}$, cada término sube el grado al doble:

          $$
          e^{x^{2}} = 1 + x^{2} + \frac{x^{4}}{2} + \frac{x^{6}}{6} + \ldots
          $$

          El coeficiente de $x^{4}$ es $\frac{1}{2!} = \frac12 = 0{,}5$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Se parte de $e^{u} = 1+u+\frac{u^{2}}{2!}+\frac{u^{3}}{3!}+\ldots$'
          - texto: 'Se sustituye $u = x^{2}$, con lo que cada grado se duplica.'
          - texto: 'Queda $e^{x^{2}} = 1 + x^{2} + \frac{x^{4}}{2} + \ldots$, con solo potencias pares.'
          - texto: 'El radio de convergencia sigue siendo infinito, porque el de $e^{u}$ lo es.'
          - texto: 'Para llegar hasta $x^{4}$ hay que derivar $f$ cuatro veces y evaluar en 0.'
            trampa: true
            mensaje: |
              Se **puede**, pero es exactamente lo que este método evita, y con
              motivo: la cuarta derivada de $e^{x^{2}}$ ocupa media página. El
              desarrollo compuesto da el mismo resultado en dos líneas, y el
              examen lo pide así — en 2021-2022 preguntaba la derivada número
              veinticinco, que por derivación directa no se calcula en ninguna
              cantidad de tiempo.
    resolucion: |
      **La idea entera del apartado, en una línea:** casi ningún desarrollo se
      calcula derivando. Se reconoce cuál de los seis moldes tiene dentro y se
      sustituye.

      $$
      e^{u} = \sum_{n\ge 0}\frac{u^{n}}{n!}
      = 1 + u + \frac{u^{2}}{2!} + \frac{u^{3}}{3!} + \ldots
      $$

      Con $u = x^{2}$:

      $$
      \boxed{\;e^{x^{2}} = 1 + x^{2} + \frac{x^{4}}{2} + \frac{x^{6}}{6} + \ldots\;}
      $$

      **Dos cosas que se leen de aquí sin más cuentas:**

      - Solo hay **potencias pares**, porque $x^{2}$ elevado a lo que sea es
        par. Eso confirma que $f$ es par, que ya se veía en la fórmula.
      - El **radio de convergencia sigue siendo infinito**: la serie de $e^{u}$
        converge para todo $u$, y $u = x^{2}$ existe para todo $x$.

      > **Y de aquí sale la derivada de orden alto sin derivar.** El coeficiente
      > de $x^{n}$ en un desarrollo de Maclaurin es $\frac{f^{(n)}(0)}{n!}$, así
      > que leyendo el coeficiente se obtiene la derivada:
      >
      > $$
      > \frac{f^{(4)}(0)}{4!} = \frac12
      > \qquad\Longrightarrow\qquad
      > f^{(4)}(0) = \frac{4!}{2} = 12
      > $$
      >
      > Ese es el truco que el examen pregunta año tras año, y por eso este
      > ejercicio va antes que ninguno de los suyos.

      <figure>
      <svg viewBox="15 25 285 160" role="img" aria-labelledby="t4compT t4compD">
        <title id="t4compT">Cada término nuevo pega la truncación un poco más lejos</title>
        <desc id="t4compD">Tres curvas con forma de cuenco, simetricas respecto del eje vertical y con el mismo minimo en x igual a cero. La de fuera es la funcion; las otras dos son sus truncaciones. Cerca del cero las tres van juntas; segun uno se aleja se separan, y la que lleva un termino mas aguanta pegada bastante mas rato.</desc>

