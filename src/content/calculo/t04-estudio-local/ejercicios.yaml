  - id: cuantos-terminos-hacen-falta
    titulo: Cuántos términos para una precisión dada
    fuente: >-
      Ejercicio 4 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU ·
      El boletín no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: practica
    enunciado: |
      ¿Cuántos términos hay que tomar en el desarrollo

      $$
      \mathrm{sen}\,x = x-\frac{x^{3}}{3!}+\dots
      $$

      para calcular $\mathrm{sen}\,15^{\circ}$ con una exactitud menor que
      $0{,}0001$?
    pide: Determinar cuántos términos hacen falta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se decide cuántos términos hacen falta?
        opciones:
          - texto: >-
              Imponiendo que la **cota del resto** sea menor que la precisión
              pedida, y despejando
            correcta: true
            mensaje: |
              Eso es. No se calculan términos hasta que «parezca suficiente»: se
              acota el resto, se impone $\left|R_n\right| < 0{,}0001$ y se busca
              el primer $n$ que lo cumpla. Es una desigualdad, no un tanteo.
          - texto: Calculando términos hasta que dejen de cambiar los decimales
            mensaje: |
              Eso da una idea, pero no una **garantía**: podría haber un término
              posterior que volviera a mover la cifra. La cota del resto es lo
              que garantiza.
          - texto: Con tres términos siempre basta
            mensaje: |
              Depende del ángulo y de la precisión pedida. Para
              $\mathrm{sen}\,80^{\circ}$ harían falta más, y para
              $10^{-10}$ también.
          - texto: Comparando con el valor exacto
            mensaje: |
              Si se conociera el valor exacto no haría falta aproximar. El
              método tiene que funcionar **sin** conocerlo.

      - tipo: calcular
        titulo: El ángulo en radianes
        pregunta: |
          ¿Cuánto es $15^{\circ}$ en radianes? En forma exacta, o con cinco decimales.
        respuesta:
          tipo: numero
          valor: '0.26180'
          tolerancia: 0.000005
          formato: un número en forma exacta, o con cinco decimales
        distractores:
          - valor: '15'
            mensaje: |
              15 son los grados. El desarrollo en serie del seno solo vale con
              el ángulo en **radianes**: con 15 el primer término ya sería 15,
              absurdo para un seno.
          - valor: '0.25882'
            mensaje: |
              $0{,}25882$ es $\mathrm{sen}\,15^{\circ}$, el valor que se quiere
              calcular. El ángulo en radianes es $\frac{\pi}{12} = 0{,}26180$.
          - valor: '0.20944'
            mensaje: |
              $\frac{\pi}{15} \approx 0{,}20944$ sería $12^{\circ}$. Quince
              grados son $\frac{\pi}{12}$.
        pista: |
          $15^{\circ} = \frac{15\pi}{180} = \frac{\pi}{12}$.
        desarrollo: |
          $$
          15^{\circ} = \frac{15\pi}{180} = \frac{\pi}{12} \approx 0{,}261799
          $$

          Que sea menor que 1 es lo que hace que las potencias $x^{n}$ decrezcan
          rápido y bastén pocos términos.
        veredicto: |
          Si el ángulo fuera mayor que 1 rad, las potencias crecerían al
          principio y harían falta bastantes más términos.

      - tipo: calcular
        titulo: El número de términos
        pregunta: |
          ¿Cuántos términos del desarrollo hacen falta?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Con tres términos sobra: el tercero ya vale $10^{-5}$, por debajo
              de la precisión pedida. La pregunta es cuántos hacen **falta**, y
              con dos ya se baja de $0{,}0001$.
          - valor: '1'
            mensaje: |
              Con uno solo, $x = 0{,}2618$, el error sería el segundo término,
              $\frac{x^{3}}{6} \approx 0{,}003$: treinta veces mayor que la
              precisión pedida.
          - valor: '4'
            mensaje: |
              Cuatro términos darían una precisión de $10^{-8}$, muchísimo más
              de la necesaria. Se pide el **mínimo**.
        pista: |
          El primer término omitido acota el error. Calcula $\frac{x^{3}}{6}$ y
          $\frac{x^{5}}{120}$ y mira cuál baja de $0{,}0001$.
        desarrollo: |
          En una serie **alternada** con términos decrecientes en valor
          absoluto, el error al truncar es menor que el **primer término
          omitido**. Así que basta buscar el primero que sea pequeño.

          $$
          \frac{x^{3}}{3!} = \frac{0{,}261799^{3}}{6}
          = \frac{0{,}017944}{6} \approx 2{,}99\cdot10^{-3}
          $$

          Demasiado grande: con un solo término el error sería $0{,}003$.

          $$
          \frac{x^{5}}{5!} = \frac{0{,}261799^{5}}{120}
          = \frac{1{,}2298\cdot10^{-3}}{120} \approx 1{,}02\cdot10^{-5}
          $$

          $1{,}02\cdot10^{-5} < 10^{-4}$ ✔

          Así que tomando **dos** términos —$x$ y $-\frac{x^{3}}{6}$— el error
          ya es menor que la precisión pedida.
        veredicto: |
          El criterio de la serie alternada ahorra tener que acotar la derivada
          $n$-ésima. Es válido porque el seno tiene desarrollo alternado y los
          términos decrecen.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Convertir a radianes:** $15^{\circ} = \frac{\pi}{12} \approx
              0{,}2618$.
          - texto: |
              **Elegir el criterio.** El desarrollo del seno es **alternado** y
              sus términos decrecen en valor absoluto, así que el error al
              truncar es menor que el primer término omitido.
          - texto: |
              **Probar términos.** $\frac{x^{3}}{6} \approx 3\cdot10^{-3}$, aún
              grande; $\frac{x^{5}}{120} \approx 1{,}0\cdot10^{-5}$, ya menor que
              $10^{-4}$.
          - texto: |
              Luego bastan **dos términos**:
              $\mathrm{sen}\,15^{\circ} \approx x-\frac{x^{3}}{6}
              \approx 0{,}25882$.
          - texto: |
              El resultado coincide con el valor exacto hasta la quinta cifra,
              como garantizaba la cota.
          - texto: |
              Como el error se acota con el primer término omitido, basta con
              que ese término sea pequeño, sin importar si la serie alterna.
            trampa: true
            mensaje: |
              El criterio del primer término omitido **es propio de las series
              alternadas** con términos decrecientes. En una serie de términos
              positivos no vale: la serie armónica tiene términos que tienden a
              cero y su cola suma infinito. Aquí se puede usar porque el seno
              alterna, y hay que decirlo.
        veredicto: |
          Sin la alternancia habría que acotar $f^{(n+1)}$, que para el seno es
          fácil —está acotada por 1— pero para otras funciones no.

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una resolución propuesta, pendiente de revisión.

      **Datos.** El desarrollo del seno y la precisión $0{,}0001$. Se pregunta
      cuántos términos hacen falta para $\mathrm{sen}\,15^{\circ}$.

      ### 1 · Convertir a radianes

      $$
      15^{\circ} = \frac{15\pi}{180} = \frac{\pi}{12} \approx 0{,}261799
      $$

      Que el ángulo sea **menor que 1** importa: hace que las potencias
      $x^{3}, x^{5}, \dots$ decrezcan deprisa, y por eso bastarán pocos
      términos.

      ### 2 · El criterio, y por qué se puede usar

      Hay dos formas de acotar el error:

      **La general**, con el resto de Lagrange:
      $\left|R_n\right| \le \frac{\max\left|f^{(n+1)}\right|}{(n+1)!}x^{n+1}$.
      Para el seno es cómoda porque todas sus derivadas están acotadas por 1.

      **La de las series alternadas**, más directa: si una serie alterna y sus
      términos decrecen en valor absoluto, el error al truncar es **menor que el
      primer término omitido**.

      El desarrollo del seno cumple las dos condiciones —alterna y, para
      $x<1$, decrece—, así que se puede usar la segunda. Decirlo es parte de la
      respuesta: el criterio no vale para cualquier serie.

      ### 3 · Probar términos

      $$
      \frac{x^{3}}{3!} = \frac{(0{,}261799)^{3}}{6}
      = \frac{0{,}0179441}{6} \approx 2{,}99\cdot10^{-3}
      $$

      Demasiado grande: con un solo término el error rondaría $0{,}003$, treinta
      veces la precisión pedida.

      $$
      \frac{x^{5}}{5!} = \frac{(0{,}261799)^{5}}{120}
      = \frac{1{,}22980\cdot10^{-3}}{120} \approx 1{,}02\cdot10^{-5}
      $$

      $$
      1{,}02\cdot10^{-5} < 10^{-4} \quad\checkmark
      $$

      ### 4 · Conclusión

      Bastan **dos términos**:

      $$
      \mathrm{sen}\,15^{\circ} \approx x-\frac{x^{3}}{6}
      = 0{,}261799-0{,}002991 = 0{,}258808
      $$

      $$
      \boxed{\;\text{Dos términos: } x-\frac{x^{3}}{6},
      \qquad \text{error} < 1{,}1\cdot10^{-5}\;}
      $$

      ### 5 · Comprobación

      El valor exacto es

      $$
      \mathrm{sen}\,15^{\circ} = \frac{\sqrt6-\sqrt2}{4} = 0{,}2588190
      $$

      y el error real:

      $$
      \left|0{,}2588190-0{,}2588083\right| = 1{,}07\cdot10^{-5}
      $$

      **Menor que $10^{-4}$** ✔, y muy cerca de la cota $1{,}02\cdot10^{-5}$
      —la cota es tan ajustada porque en una alternada el error es casi el
      primer término omitido—.

      Y para ver que **un solo término no basta**:

      $$
      \left|0{,}2588190-0{,}261799\right| = 2{,}98\cdot10^{-3} > 10^{-4}
      \quad\times
      $$

      Confirmado: uno se queda corto, dos sobran para la precisión pedida.

      ### 6 · Cómo cambiaría con otro ángulo

      Merece la pena ver de qué depende el resultado, porque es lo que se
      pregunta de verdad:

      | ángulo | $x$ (rad) | $\frac{x^{3}}{6}$ | $\frac{x^{5}}{120}$ | términos |
      |---|---|---|---|---|
      | $15^{\circ}$ | $0{,}262$ | $3{,}0\cdot10^{-3}$ | $1{,}0\cdot10^{-5}$ | 2 |
      | $45^{\circ}$ | $0{,}785$ | $8{,}1\cdot10^{-2}$ | $2{,}5\cdot10^{-3}$ | 3 |
      | $90^{\circ}$ | $1{,}571$ | $6{,}5\cdot10^{-1}$ | $8{,}0\cdot10^{-2}$ | 4 |

      Cuanto más grande el ángulo, más términos. Por eso en la práctica se
      reduce siempre el ángulo al primer octante antes de desarrollar.

