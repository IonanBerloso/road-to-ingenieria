  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 4. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-punto-critico-clasificado
    titulo: Un punto crítico, y decidir qué es
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Para $f(x) = x^{3} - 3x$, encontrar sus puntos críticos y clasificarlos.
    pide: Los puntos donde la derivada se anula y qué es cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si $f'(c) = 0$, ¿qué se puede afirmar del punto $c$?
        opciones:
          - texto: Que es candidato a extremo, pero hay que decidirlo aparte
            correcta: true
            mensaje: |
              Eso es. Fermat dice «extremo implica derivada nula», y el
              recíproco es falso. Por eso se llaman **críticos** y no
              «extremos»: son candidatos.
          - texto: Que hay un máximo o un mínimo
            mensaje: |
              No necesariamente. En $f(x) = x^{3}$ la derivada se anula en el
              origen y ahí no hay ni máximo ni mínimo, solo una inflexión con
              tangente horizontal.
          - texto: Que la función vale cero en $c$
            mensaje: |
              Eso sería $f(c) = 0$, otra cosa. Aquí lo que se anula es la
              **derivada**: la tangente es horizontal, pero la función puede
              valer lo que sea.
      - tipo: calcular
        titulo: El punto crítico positivo
        pregunta: |
          Resolviendo $f'(x) = 3x^{2} - 3 = 0$, ¿cuál es la solución positiva?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Parece que has despejado mal: de $3x^{2} = 3$ sale $x^{2} = 1$, no
              $x^{2} = 3$. El 3 se cancela.
          - valor: '1.7320508'
            mensaje: |
              Has sacado la raíz de 3. Divide primero entre 3 los dos lados y
              verás que queda $x^{2}=1$.
        pista: |
          $3x^{2} = 3$, así que $x^{2} = 1$.
        desarrollo: |
          $$
          f'(x) = 3x^{2}-3 = 0
          \;\Longrightarrow\;
          x^{2} = 1
          \;\Longrightarrow\;
          x = \pm 1
          $$

          Hay dos puntos críticos, $x = -1$ y $x = 1$.
      - tipo: calcular
        titulo: Clasificarlo
        pregunta: |
          Con $f''(x) = 6x$, ¿cuánto vale $f''(1)$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $f''(x) = 6x$, así que en $x=1$ vale 6, no 0. Se anula en el
              origen, que no es un punto crítico de esta función.
          - valor: '3'
            mensaje: |
              3 es el coeficiente de la primera derivada. La segunda derivada de
              $x^{3}-3x$ es $6x$: al derivar $3x^{2}$ el 2 baja y multiplica.
        pista: |
          Sustituye $x=1$ en $6x$. Y fíjate en el signo, que es lo que decide.
        desarrollo: |
          $$
          f''(1) = 6 > 0
          $$

          Con la segunda derivada **positiva**, la curva abre hacia arriba en
          ese punto: es un **mínimo**. Por simetría, $f''(-1) = -6 < 0$ y allí
          hay un máximo.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: $f'(x) = 3x^{2}-3$ se anula en $x = \pm 1$.
          - texto: $f''(x) = 6x$, y $f''(1) = 6 > 0$, luego en $x=1$ hay un mínimo.
          - texto: $f''(-1) = -6 < 0$, luego en $x=-1$ hay un máximo.
          - texto: Son extremos **relativos** y no absolutos, porque la función no está acotada.
          - texto: Como la derivada se anula en dos puntos, los dos son mínimos.
            trampa: true
            mensaje: |
              Anularse no dice de qué tipo es. Lo decide el signo de la segunda
              derivada, y aquí sale opuesto en cada punto: uno es máximo y el
              otro mínimo.
    resolucion: |
      **Los candidatos.** Se buscan donde la derivada se anula, que es lo que
      Fermat autoriza:

      $$
      f'(x) = 3x^{2}-3 = 0 \;\Longrightarrow\; x = \pm 1
      $$

      **Clasificarlos** con el signo de la segunda derivada, $f''(x) = 6x$:

      | punto | $f''$ | qué es |
      |---|---|---|
      | $x=-1$ | $-6 < 0$ | máximo relativo |
      | $x=1$ | $6 > 0$ | mínimo relativo |

      **El detalle que se pierde.** Son extremos **relativos**. La función es
      una cúbica y no está acotada, así que no tiene máximo ni mínimo
      absolutos. Si el enunciado pidiera absolutos sobre un intervalo cerrado,
      habría que evaluar también en los bordes.

      **Y si $f''(c)$ saliera cero**, el criterio no diría nada y habría que
      mirar el signo de $f'$ a los dos lados del punto.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 265" role="img" width="320" height="265"
           aria-labelledby="f-ej-punto-critico-t f-ej-punto-critico-d">
        <title id="f-ej-punto-critico-t">La cúbica x al cubo menos tres x, con sus dos puntos de tangente horizontal</title>
        <desc id="f-ej-punto-critico-d">Una curva que sube desde abajo a la izquierda, hace una joroba, baja hasta un valle y vuelve a subir hasta arriba a la derecha. La cima de la joroba está en el punto menos uno coma dos y el fondo del valle en el punto uno coma menos dos. En cada uno de los dos hay dibujada una recta horizontal corta, que es la tangente: es horizontal porque ahí la derivada se anula. La curva sigue subiendo indefinidamente por la derecha y bajando por la izquierda, de modo que ninguno de los dos puntos es el mayor ni el menor valor de la función.</desc>
