        <desc id="f-rolle-tres-d">Tres recuadros. En el primero, una parábola entre menos tres y dos que vale diez en los dos extremos; su vértice, donde la tangente es horizontal, está en menos un medio. En el segundo, una cúbica entre uno y cinco que vale tres en los dos extremos; baja, hace un mínimo y vuelve a subir, y ese mínimo está en tres coma cinco dos ocho. En el tercero, el seno entre cero y pi, que vale cero en los dos extremos y tiene su máximo en pi medios. En los tres, una línea discontinua horizontal marca la altura común de los extremos y otra recta, continua, es la tangente en el punto c.</desc>
