            <desc id="f-racional-completa-d">La gráfica está partida en dos ramas por una recta vertical de puntos en x igual a uno, que es la asíntota vertical. Hay además una recta oblicua de puntos, y igual a x más uno, que es la asíntota oblicua. La rama izquierda viene de abajo a la izquierda pegada por debajo a la recta oblicua, sube hasta tocar el origen, donde tiene tangente horizontal, y desde ahí cae hacia menos infinito pegándose a la recta vertical. La rama derecha baja desde arriba pegada a la recta vertical por su derecha, alcanza un punto más bajo en x igual a dos, a la altura cuatro, y desde ahí sube pegándose por encima a la recta oblicua. Los dos puntos de tangente horizontal, el origen y el dos coma cuatro, están marcados: el primero es un máximo local y el segundo un mínimo local, aunque el máximo esté más abajo que el mínimo, porque están en ramas distintas.</desc>
