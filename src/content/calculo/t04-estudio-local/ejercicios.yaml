  - id: ej-cota-del-resto
    titulo: La cota del error, que es media pregunta
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Se aproxima $e^{x}$ por su polinomio de Maclaurin de orden 2 en el
      intervalo $[0, 1]$. Acotar el error cometido.
    pide: Una cota del error de la aproximación en ese intervalo.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el resto de Lagrange $R_2(x) = \dfrac{f'''(\xi)}{3!}x^{3}$,
          ¿qué es lo que hay que acotar?
        opciones:
          - texto: >-
              La **tercera** derivada en el intervalo, porque $\xi$ está ahí
              dentro y no se sabe dónde
            correcta: true
            mensaje: |
              Eso es. El resto de orden $n$ lleva la derivada $n+1$, evaluada en
              un punto desconocido. Como no se sabe cuál, se acota por el mayor
              valor que pueda tomar en el intervalo.
          - texto: La segunda derivada, que es el orden del polinomio
            mensaje: |
              El polinomio es de orden 2, pero el resto lleva **una derivada
              más**: la tercera. Confundir los dos órdenes es el error más
              común de este apartado.
          - texto: El valor de $x$, que es lo único que varía
            mensaje: |
              $x$ también se acota —por eso se toma $x=1$, el extremo—, pero lo
              que no se conoce y hay que acotar de verdad es la derivada, porque
              $\xi$ es un punto desconocido.
      - tipo: calcular
        titulo: La cota
        pregunta: |
          Con $f'''(\xi) = e^{\xi} \le e$ en $[0,1]$ y $x \le 1$, ¿cuánto vale
          la cota $\dfrac{e}{6}$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.4530'
          tolerancia: 0.0005
          formato: en forma exacta (e/6), o con cuatro decimales
        distractores:
          - valor: '0.1133'
            mensaje: |
              $\frac{e}{24} = \frac{e}{4!}$ lleva el factorial del **orden del
              polinomio más uno**… pero mal: el resto de orden 2 lleva $3!=6$,
              no $4!$. Ese cuatro sería para un polinomio de orden 3.
          - valor: '1.3591'
            mensaje: |
              $\frac{e}{2}$ usa $2!$, el factorial del orden del polinomio. El
              resto lleva **una unidad más**: $3! = 6$.
          - valor: '2.7182818'
            mensaje: |
              $e$ es la cota de la derivada, pero falta dividir entre $3!$ y
              multiplicar por $x^{3}$, que aquí vale como mucho 1.
        pista: |
          $e \approx 2{,}71828$. Divídelo entre 6.
        desarrollo: |
          $$
          \left|R_2(x)\right|
          = \left|\frac{f'''(\xi)}{3!}\,x^{3}\right|
          \le \frac{e}{6}\cdot 1^{3}
          = \frac{e}{6} \approx 0{,}4530
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El resto de un polinomio de orden 2 es
              $R_2(x) = \frac{f'''(\xi)}{3!}x^{3}$, con $\xi$ entre 0 y $x$.
          - texto: >-
              Todas las derivadas de $e^{x}$ son $e^{x}$, así que
              $f'''(\xi) = e^{\xi}$.
          - texto: 'Como $\xi \in [0,1]$ y la exponencial crece, $e^{\xi} \le e$.'
          - texto: 'Y como $x \le 1$, entonces $x^{3}\le 1$, así que la cota es $\frac{e}{6}$.'
          - texto: 'Al ser una cota, el error real es exactamente $\frac{e}{6}$.'
            trampa: true
            mensaje: |
              Una cota dice «el error **no pasa** de esto», no cuánto vale. El
              error real aquí es bastante menor: en $x=1$ vale
              $e - 2{,}5 \approx 0{,}218$, menos de la mitad de la cota. Que la
              cota sea holgada no la invalida: sigue siendo una respuesta
              correcta, y es lo que el examen pide.
    resolucion: |
      **El polinomio**, que es la parte fácil:

      $$
      P_2(x) = 1 + x + \frac{x^{2}}{2}
      $$

      **Y el resto**, que es la que puntúa. La fórmula de Lagrange para el resto
      de un polinomio de orden $n$ lleva la derivada de orden $n+1$:

      $$
      R_n(x) = \frac{f^{(n+1)}(\xi)}{(n+1)!}\,x^{\,n+1},
      \qquad \xi \text{ entre } 0 \text{ y } x
      $$

      Con $n=2$, la derivada que aparece es la **tercera** y el factorial es
      $3!$. Ese desfase de uno es lo que más se falla del apartado.

      $$
      R_2(x) = \frac{f'''(\xi)}{3!}\,x^{3} = \frac{e^{\xi}}{6}\,x^{3}
      $$

      **Acotar es sustituir lo desconocido por lo peor posible.** No se sabe
      dónde está $\xi$, pero sí que está en $[0,1]$, y ahí la exponencial es
      creciente:

      $$
      e^{\xi} \le e^{1} = e,
      \qquad
      x^{3} \le 1
      $$

      $$
      \boxed{\;\left|R_2(x)\right| \le \frac{e}{6} \approx 0{,}4530\;}
      $$

      > **Cómo se lee una cota, y por qué el enunciado a veces la pide al
      > revés.** Esto dice que el error no llega a medio punto — no que valga
      > medio punto: el real en $x=1$ es $e-2{,}5\approx 0{,}218$. Y de la misma
      > desigualdad sale la otra pregunta que hace el examen, «cuántos términos
      > hacen falta para que el error sea menor que $10^{-3}$»: se escribe la
      > cota con $n$ genérico y se busca el primer $n$ que la cumpla, **sin
      > sumar ningún término**.

      <figure>
      <svg viewBox="12 20 293 165" role="img" aria-labelledby="t4cotaT t4cotaD">
        <title id="t4cotaT">El error verdadero y la cota, uno debajo de la otra</title>
        <desc id="t4cotaD">Dos curvas que salen las dos del origen y suben hacia la derecha. La de arriba es la cota, la de abajo el error de verdad. En el extremo derecho, en x igual a uno, la cota vale cuarenta y cinco centesimas y el error veintidos: la cota es algo mas del doble. Entre las dos queda una franja que se ensancha.</desc>

