  - id: maximo-con-restriccion
    titulo: Un producto máximo con la suma fijada
    fuente: >-
      Ejercicio 6 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular los valores de $x$ e $y$ que verifican $x+y = 6$ y para los
      cuales el valor $xy^{2}$ es máximo.
    pide: Calcular los valores de $x$ e $y$.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos variables y una sola derivada. ¿Cómo se arregla?
        opciones:
          - texto: >-
              Usando la **restricción** para dejar la función objetivo con una
              sola variable
            correcta: true
            mensaje: |
              Eso es el método entero. La restricción $x+y=6$ permite escribir
              $x = 6-y$ y sustituir, con lo que $xy^{2}$ pasa a depender solo de
              $y$. A partir de ahí es derivar e igualar a cero.
          - texto: Derivando respecto de las dos por separado
            mensaje: |
              Eso sería optimización en varias variables, que es de otro tema.
              Aquí la restricción reduce el problema a una sola variable y basta
              con el cálculo de una variable.
          - texto: Suponiendo que $x = y$
            mensaje: |
              Sería inventarse una condición. Y de hecho la respuesta es
              $x=2$, $y=4$: no son iguales, porque la función no es simétrica —
              la $y$ está elevada al cuadrado.
          - texto: Probando valores hasta encontrar el mayor
            mensaje: |
              Tantear no demuestra nada y además puede fallar. El método del
              cálculo da el punto exacto y la garantía de que es máximo.

      - tipo: calcular
        titulo: El valor de y
        pregunta: |
          ¿Cuánto vale $y$ en el máximo?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el valor de **$x$**, no de $y$. La función es $xy^{2}$, con
              la $y$ al cuadrado: le conviene ser la grande de las dos.
          - valor: '3'
            mensaje: |
              3 saldría si el objetivo fuera $xy$, simétrico en las dos
              variables. Con $xy^{2}$ el reparto se desequilibra a favor de $y$.
          - valor: '0'
            mensaje: |
              $y=0$ es el otro punto crítico, y da $xy^{2} = 0$: el **mínimo**,
              no el máximo. Hay que decidir cuál es cuál.
        pista: |
          Sustituye $x = 6-y$ y deriva $f(y) = (6-y)y^{2}$.
        desarrollo: |
          Con $x = 6-y$:

          $$
          f(y) = (6-y)y^{2} = 6y^{2}-y^{3}
          $$

          $$
          f'(y) = 12y-3y^{2} = 3y(4-y) = 0
          \;\Longrightarrow\;
          y = 0 \;\text{ o }\; y = 4
          $$

          **Hay que decidir cuál es el máximo.** Con la segunda derivada:

          $$
          f''(y) = 12-6y
          $$

          $$
          f''(0) = 12 > 0 \;\Longrightarrow\; \text{mínimo}
          $$

          $$
          f''(4) = 12-24 = -12 < 0 \;\Longrightarrow\; \text{máximo}
          $$

          Luego $y = 4$, y $x = 6-4 = 2$.
        veredicto: |
          Los dos puntos críticos aparecen siempre. Quedarse con el primero que
          salga sin comprobar es la forma más rápida de dar el mínimo por
          máximo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Objetivo:** maximizar $P = xy^{2}$.
              **Restricción:** $x+y = 6$.
          - texto: |
              **Reducir a una variable:** de la restricción, $x = 6-y$, y
              sustituyendo, $f(y) = 6y^{2}-y^{3}$.
          - texto: |
              **Derivar e igualar a cero:** $f'(y) = 12y-3y^{2} = 3y(4-y) = 0$,
              con soluciones $y=0$ e $y=4$.
          - texto: |
              **Decidir cuál es máximo:** $f''(y) = 12-6y$, y
              $f''(4) = -12 < 0$, así que $y=4$ es el máximo.
          - texto: |
              **La respuesta:** $x = 2$, $y = 4$, con $P = 2\cdot16 = 32$.
          - texto: |
              Como $f'(0) = 0$, el punto $y=0$ también es un máximo del
              producto.
            trampa: true
            mensaje: |
              Que la derivada se anule solo dice que hay un punto **crítico**.
              En $y=0$ el producto vale $0\cdot36 = 0$, que es el valor más
              **pequeño** posible con $y\ge0$: es un mínimo. Hay que decidirlo
              con la segunda derivada o con el signo de la primera, no darlo por
              hecho.
        veredicto: |
          El reparto 2-4 en vez de 3-3 tiene una explicación: la $y$ pesa más
          en el objetivo, así que se lleva la parte mayor. Con $xy^{3}$ sería
          $1{,}5$ y $4{,}5$.

    resolucion: |
      **Datos.** $x+y = 6$. Se pide maximizar $xy^{2}$.

      ### 1 · El método, y por qué el orden importa

      Todos los problemas de optimización con restricción siguen el mismo guion:

      1. Escribir la **función objetivo**.
      2. Escribir la **restricción**.
      3. Usar la restricción para dejar el objetivo con **una sola variable**.
      4. Derivar e igualar a cero.
      5. **Decidir** si es máximo o mínimo.

      Los pasos 1 a 3 son el ejercicio; el 4 es mecánico; el 5 es donde se
      pierden los puntos.

      ### 2 · Plantear

      **Objetivo:** $P = xy^{2}$, que hay que hacer máximo.

      **Restricción:** $x+y = 6$.

      De la restricción, $x = 6-y$, y sustituyendo:

      $$
      f(y) = (6-y)y^{2} = 6y^{2}-y^{3}
      $$

      Una sola variable. Conviene despejar la variable que **no** está elevada,
      para no arrastrar raíces.

      ### 3 · Derivar

      $$
      f'(y) = 12y-3y^{2} = 3y\left(4-y\right)
      $$

      $$
      f'(y) = 0 \;\Longrightarrow\; y = 0 \;\text{ o }\; y = 4
      $$

      **Dos** puntos críticos. Hay que decidir cuál es cuál.

      ### 4 · Decidir cuál es el máximo

      $$
      f''(y) = 12-6y
      $$

      | $y$ | $f''(y)$ | qué es | $P = xy^{2}$ |
      |---|---|---|---|
      | $0$ | $+12$ | mínimo | $6\cdot0 = 0$ |
      | $4$ | $-12$ | **máximo** | $2\cdot16 = 32$ |

      $$
      \boxed{\;x = 2, \qquad y = 4, \qquad P_{\max} = 32\;}
      $$

      ### 5 · Por qué el reparto no es equitativo

      Con $x+y=6$ fijo, uno esperaría que el producto máximo saliera en el
      reparto igualado. Y lo haría **si el objetivo fuera $xy$**: ahí el máximo
      está en $x=y=3$.

      Pero aquí la $y$ está **elevada al cuadrado**: pesa más en el producto, así
      que le conviene llevarse la parte mayor. El reparto óptimo es $2$ y $4$,
      es decir $\frac13$ y $\frac23$ del total.

      Y hay un patrón general detrás: para maximizar $x^{a}y^{b}$ con
      $x+y = S$, el óptimo reparte $S$ en proporción a los exponentes:

      $$
      x = \frac{a}{a+b}S, \qquad y = \frac{b}{a+b}S
      $$

      Aquí $a=1$, $b=2$, $S=6$: $x = \frac16\cdot6\cdot1 = 2$ y
      $y = \frac{2}{3}\cdot6 = 4$ ✔

      ### 6 · Comprobación

      Evaluando alrededor del punto:

      | $y$ | $x = 6-y$ | $P = xy^{2}$ |
      |---|---|---|
      | $3$ | $3$ | $27$ |
      | $3{,}5$ | $2{,}5$ | $30{,}6$ |
      | $\mathbf{4}$ | $\mathbf{2}$ | $\mathbf{32}$ |
      | $4{,}5$ | $1{,}5$ | $30{,}4$ |
      | $5$ | $1$ | $25$ |

      El 32 es efectivamente el mayor: sube hasta $y=4$ y baja después ✔

      Y el reparto igualado, $3$ y $3$, da 27: **menos** que el óptimo, como
      anticipaba el razonamiento de los exponentes.

