        <title id="f-ocho-series-t">Cuatro de los ocho desarrollos, con su suma parcial y su radio de convergencia</title>
        <desc id="f-ocho-series-d">Cuatro recuadros, cada uno con una función y una suma parcial de su serie. En el primero, la exponencial y un polinomio de cuatro términos que la sigue bien en toda la franja dibujada; el fondo está sombreado entero porque la serie converge en toda la recta. En el segundo, el seno y su aproximación, igual. En el tercero, el logaritmo de uno más x: la sombra llega solo de menos uno a uno, y fuera de ahí la suma parcial se dispara. En el cuarto, uno partido por x menos uno, con la misma sombra de menos uno a uno y una asíntota vertical en x igual a uno.</desc>
