  - id: teorema-de-lagrange
    titulo: Tres funciones y una pendiente media
    fuente: >-
      Ejercicio 1 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Estudiar si es posible aplicar el teorema del valor medio (Lagrange) a las
      siguientes funciones en los intervalos indicados, y en caso afirmativo
      calcular el valor $c$ a que hace referencia este teorema.

      **(a)** $f(x) = 3x-4$ en $[1,4]$ ·
      **(b)** $f(x) = \sqrt{1-x}$ en $[-3,0]$ ·
      **(c)** $f(x) = x-\dfrac{1}{x}$ en $[1,3]$
    pide: Estudiar las hipótesis y calcular $c$ donde sea posible.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las hipótesis de Lagrange son dos y **no son la misma**. ¿Cuáles?
        opciones:
          - texto: >-
              Continua en el intervalo **cerrado** y derivable en el
              **abierto**
            correcta: true
            mensaje: |
              Eso es, y la asimetría es deliberada. Al pedir derivabilidad solo
              en el interior, el teorema sigue valiendo para funciones con
              tangente vertical en un extremo — como la raíz del apartado (b) en
              $x=1$, aunque ahí ni siquiera esté en el intervalo.
          - texto: Derivable en el cerrado y continua en el abierto
            mensaje: |
              Al revés, y además sería redundante: derivable implica continua,
              así que pedir derivabilidad en el cerrado ya daría la continuidad.
              La versión útil es la que exige menos.
          - texto: Continua y derivable en el cerrado
            mensaje: |
              Es más fuerte de lo necesario, y dejaría fuera funciones que sí
              cumplen la tesis. Los teoremas se enuncian con las hipótesis
              mínimas.
          - texto: Solo continuidad
            mensaje: |
              Sin derivabilidad la tesis no tiene sentido: habla de $f'(c)$. El
              valor absoluto en $[-1,1]$ es continuo y no hay ningún $c$ con
              $f'(c) = 0$.

      - tipo: calcular
        titulo: El caso de la recta
        pregunta: |
          En **(a)**, ¿para cuántos valores de $c$ se cumple la tesis?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: escribe -1 si sirven todos los del intervalo
        distractores:
          - valor: '1'
            mensaje: |
              Uno sería lo habitual, pero aquí la función es una **recta**: su
              derivada vale 3 en todos los puntos, y la pendiente media también
              vale 3. Así que la igualdad se cumple en **todo** el intervalo, no
              en un punto suelto.
          - valor: '0'
            mensaje: |
              Ninguno sería si fallara alguna hipótesis, y aquí no falla: una
              recta es continua y derivable en todas partes.
          - valor: '3'
            mensaje: |
              3 es la pendiente de la recta y también la pendiente media, pero no
              es el número de soluciones ni un valor de $c$.
        pista: |
          Calcula $f'(x)$ y la pendiente media. ¿Qué pasa cuando coinciden para
          todo $x$?
        desarrollo: |
          $f(x) = 3x-4$ es continua y derivable en todo $\mathbb{R}$: las
          hipótesis se cumplen.

          $$
          \frac{f(4)-f(1)}{4-1} = \frac{8-(-1)}{3} = \frac{9}{3} = 3
          $$

          $$
          f'(x) = 3 \qquad \text{para todo } x
          $$

          La ecuación $f'(c) = 3$ se cumple para **cualquier** $c$:

          $$
          \forall c \in (1,4)
          $$

          Es lo natural en una recta: su pendiente instantánea y su pendiente
          media son la misma en todos los puntos.
        veredicto: |
          El teorema garantiza «existe al menos un $c$». No dice que sea único,
          y este apartado es el recordatorio.

      - tipo: calcular
        titulo: El caso de la raíz
        pregunta: |
          En **(b)**, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-1.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.25'
            mensaje: |
              Signo cambiado. El intervalo es $[-3,0]$, así que $c$ tiene que
              estar **dentro** de él: entre $-3$ y 0. Un $c$ positivo estaría
              fuera y no valdría.
          - valor: '-1.5'
            mensaje: |
              $-1{,}5$ es el punto medio del intervalo. El $c$ de Lagrange rara
              vez es el punto medio: solo lo es para parábolas.
          - valor: '-2.25'
            mensaje: |
              $-2{,}25$ saldría de despejar mal. De
              $\frac{-1}{2\sqrt{1-c}} = -\frac13$ sale $\sqrt{1-c} = \frac32$,
              luego $1-c = \frac94$ y $c = -\frac54$.
        pista: |
          Pendiente media $= \frac{f(0)-f(-3)}{3} = \frac{1-2}{3}$. E iguala a
          $f'(c) = \frac{-1}{2\sqrt{1-c}}$.
        desarrollo: |
          **Hipótesis.** $\sqrt{1-x}$ está definida para $x \le 1$, y $[-3,0]$
          está dentro. Es continua ahí, y derivable en $(-3,0)$ porque el
          radicando no se anula —solo lo haría en $x=1$, fuera del intervalo—.

          **Pendiente media:**

          $$
          \frac{f(0)-f(-3)}{0-(-3)} = \frac{\sqrt1-\sqrt4}{3}
          = \frac{1-2}{3} = -\frac13
          $$

          **Derivada:**

          $$
          f'(x) = \frac{-1}{2\sqrt{1-x}}
          $$

          Igualando:

          $$
          \frac{-1}{2\sqrt{1-c}} = -\frac13
          \;\Longrightarrow\;
          2\sqrt{1-c} = 3
          \;\Longrightarrow\;
          \sqrt{1-c} = \frac32
          $$

          $$
          1-c = \frac94 \;\Longrightarrow\; c = 1-\frac94 = -\frac54 = -1{,}25
          $$

          Y $-1{,}25 \in (-3,0)$ ✔
        veredicto: |
          Comprobar que $c$ **cae dentro** del intervalo es obligatorio: si
          saliera fuera, habría un error en algún sitio.

      - tipo: justificar
        pregunta: |
          Ordena el método y los tres resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **El método.** Comprobar continuidad en el cerrado y
              derivabilidad en el abierto; calcular la pendiente media
              $\frac{f(b)-f(a)}{b-a}$; igualarla a $f'(c)$ y resolver.
          - texto: |
              **(a)** Es una recta: $f' \equiv 3$ y la pendiente media también
              es 3, así que **sirve todo** $c \in (1,4)$.
          - texto: |
              **(b)** Pendiente media $-\frac13$, y de
              $\frac{-1}{2\sqrt{1-c}} = -\frac13$ sale $c = -\frac54$.
          - texto: |
              **(c)** $f(x) = x-\frac1x$ es continua y derivable en $[1,3]$
              porque el 0 queda fuera. Pendiente media
              $\frac{8/3-0}{2} = \frac43$, y de $1+\frac{1}{c^{2}} = \frac43$
              sale $c = \sqrt3$.
          - texto: |
              En los tres casos hay que comprobar que el $c$ obtenido **cae
              dentro** del intervalo abierto.
          - texto: |
              En (c) hay dos soluciones, $c = \pm\sqrt3$, y las dos son válidas.
            trampa: true
            mensaje: |
              $c = -\sqrt3$ **no** está en $(1,3)$, así que se descarta. La
              ecuación algebraica tiene dos raíces, pero el teorema solo habla
              de puntos **del intervalo**. Dar las dos es no haber mirado dónde
              caen.
        veredicto: |
          Resolver la ecuación es la mitad; la otra mitad es filtrar las
          soluciones que caen fuera. Ese filtro es donde se pierden los puntos.

    resolucion: |
      **Datos.** Tres funciones con sus intervalos. Se pide comprobar las
      hipótesis de Lagrange y, si se cumplen, hallar $c$.

      ### 1 · El teorema y sus dos hipótesis

      Si $f$ es **continua en $[a,b]$** y **derivable en $(a,b)$**, existe
      $c \in (a,b)$ tal que

      $$
      f'(c) = \frac{f(b)-f(a)}{b-a}
      $$

      La asimetría entre cerrado y abierto es deliberada: al pedir
      derivabilidad solo en el interior, el teorema sigue valiendo para
      funciones con tangente vertical en un extremo.

      Y la tesis dice «**existe al menos un** $c$»: no promete unicidad.

      ### 2 · (a) $f(x) = 3x-4$ en $[1,4]$

      **Hipótesis:** un polinomio es continuo y derivable en todo
      $\mathbb{R}$ ✔

      $$
      \frac{f(4)-f(1)}{4-1} = \frac{8-(-1)}{3} = 3
      $$

      $$
      f'(x) = 3
      $$

      La ecuación $f'(c) = 3$ se cumple para **todos** los $c$:

      $$
      \boxed{\forall c \in (1,4)}
      $$

      Es lo que le pasa a cualquier recta: su pendiente instantánea coincide
      siempre con la media. El apartado está para recordar que el teorema
      garantiza existencia, no unicidad.

      ### 3 · (b) $f(x) = \sqrt{1-x}$ en $[-3,0]$

      **Hipótesis.** El dominio de $\sqrt{1-x}$ es $x \le 1$, y
      $[-3,0] \subset (-\infty,1]$ ✔. Es continua ahí. Y derivable en
      $(-3,0)$, porque

      $$
      f'(x) = \frac{-1}{2\sqrt{1-x}}
      $$

      solo falla donde $1-x = 0$, es decir en $x=1$, **fuera** del intervalo ✔

      **Pendiente media:**

      $$
      \frac{f(0)-f(-3)}{0-(-3)} = \frac{1-2}{3} = -\frac{1}{3}
      $$

      **Igualando:**

      $$
      \frac{-1}{2\sqrt{1-c}} = -\frac13
      \;\Longrightarrow\;
      \sqrt{1-c} = \frac32
      \;\Longrightarrow\;
      1-c = \frac94
      $$

      $$
      \boxed{c = -\frac54 = -1{,}25}
      $$

      Y está en $(-3,0)$ ✔

      ### 4 · (c) $f(x) = x-\frac{1}{x}$ en $[1,3]$

      **Hipótesis.** La función no está definida en $x=0$, pero **el 0 no
      pertenece a $[1,3]$**, así que es continua y derivable en todo el
      intervalo ✔ Decirlo es parte de la respuesta: la restricción existe y hay
      que comprobar que no molesta.

      **Pendiente media:**

      $$
      f(1) = 1-1 = 0, \qquad f(3) = 3-\frac13 = \frac83
      $$

      $$
      \frac{f(3)-f(1)}{3-1} = \frac{8/3}{2} = \frac43
      $$

      **Derivada e igualdad:**

      $$
      f'(x) = 1+\frac{1}{x^{2}}
      $$

      $$
      1+\frac{1}{c^{2}} = \frac43
      \;\Longrightarrow\;
      \frac{1}{c^{2}} = \frac13
      \;\Longrightarrow\;
      c^{2} = 3
      \;\Longrightarrow\;
      c = \pm\sqrt3
      $$

      **Y aquí el filtro:** $-\sqrt3 \approx -1{,}73$ **no** está en $(1,3)$, así
      que se descarta. Solo vale

      $$
      \boxed{c = \sqrt3 \approx 1{,}732}
      $$

      ### 5 · Comprobación

      | | $c$ | $f'(c)$ | pendiente media | ¿coinciden? |
      |---|---|---|---|---|
      | (a) | cualquiera | $3$ | $3$ | ✔ |
      | (b) | $-1{,}25$ | $\frac{-1}{2\sqrt{2{,}25}} = \frac{-1}{3}$ | $-\frac13$ | ✔ |
      | (c) | $\sqrt3$ | $1+\frac13 = \frac43$ | $\frac43$ | ✔ |

      Y en los tres casos $c$ cae dentro del intervalo abierto, que es la otra
      condición que hay que verificar.

      ### Resultado

      $$
      \boxed{\;\text{(a) } \forall c \in (1,4)
      \qquad \text{(b) } c = -\tfrac54
      \qquad \text{(c) } c = \sqrt3\;}
      $$

