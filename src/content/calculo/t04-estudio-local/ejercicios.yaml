  - id: triangulo-de-area-minima
    titulo: El triángulo más pequeño que pasa por un punto
    fuente: >-
      Ejercicio 8 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU ·
      El enunciado impreso está incompleto: falta el punto por el que pasa la
      hipotenusa. Se ha reconstruido a partir de la propia solución del
      boletín; ver la resolución. Pendiente de tu revisión.
    nivel: practica
    enunciado: |
      Calcular el área mínima de un triángulo rectángulo cuyo vértice
      correspondiente al ángulo recto se encuentra en el punto $(0,0)$, cuyos
      lados contiguos están sobre los ejes $OX$ y $OY$, y **cuya hipotenusa pasa
      por el punto $(3,7)$**.
    pide: Calcular el área mínima del triángulo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sin la condición de que la hipotenusa pase por un punto fijo, ¿cuál
          sería el área mínima?
        opciones:
          - texto: >-
              **Cero**: el triángulo se puede encoger todo lo que se quiera, y
              el problema no tendría solución
            correcta: true
            mensaje: |
              Exacto, y por eso el enunciado del boletín está incompleto tal como
              está impreso. Sin una condición que impida encoger, el ínfimo del
              área es 0 y no se alcanza: no hay mínimo. La condición que falta
              es la que fija el tamaño.
          - texto: 1, porque los catetos miden al menos 1
            mensaje: |
              Nada obliga a que los catetos midan 1. Pueden ser tan pequeños como
              se quiera, y el área con ellos.
          - texto: >-
              Infinito, porque el triángulo puede ser tan grande como se quiera
            mensaje: |
              Puede ser tan grande como se quiera, sí, pero se pide el **mínimo**,
              no el máximo. Y por abajo no hay tope.
          - texto: >-
              No se puede saber sin más datos
            mensaje: |
              Sí se puede: sin restricción, el área baja hasta 0. Que no haya
              datos no impide razonar; al contrario, razonarlo es lo que revela
              que falta una condición.

      - tipo: calcular
        titulo: El cateto horizontal óptimo
        pregunta: |
          Llamando $a$ al cateto sobre el eje $OX$, ¿cuánto vale en el mínimo?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es la abscisa del punto por el que pasa la hipotenusa. Si el
              cateto valiera 3, la hipotenusa sería **vertical** y el triángulo
              degeneraría: el área se iría a infinito.
          - valor: '14'
            mensaje: |
              14 es el **otro** cateto, el vertical. Los dos salen a la vez, pero
              la pregunta es por el horizontal.
          - valor: '7'
            mensaje: |
              7 es la ordenada del punto fijo, no un cateto. El cateto horizontal
              sale de $a(a-6) = 0$ con $a>3$.
        pista: |
          El área es $A(a) = \frac{7a^{2}}{2(a-3)}$. Deriva e iguala a cero.
        desarrollo: |
          Con los catetos $a$ sobre $OX$ y $b$ sobre $OY$, la hipotenusa es la
          recta $\frac{x}{a}+\frac{y}{b} = 1$. Que pase por $(3,7)$:

          $$
          \frac{3}{a}+\frac{7}{b} = 1
          \;\Longrightarrow\;
          b = \frac{7a}{a-3}
          $$

          con $a>3$ para que $b$ sea positivo. El área:

          $$
          A(a) = \frac{ab}{2} = \frac{7a^{2}}{2(a-3)}
          $$

          Derivando con la regla del cociente:

          $$
          A'(a) = \frac{7}{2}\cdot\frac{2a(a-3)-a^{2}}{(a-3)^{2}}
          = \frac{7}{2}\cdot\frac{a^{2}-6a}{(a-3)^{2}}
          = \frac{7a(a-6)}{2(a-3)^{2}}
          $$

          $$
          A'(a) = 0 \;\Longrightarrow\; a = 0 \;\text{ o }\; a = 6
          $$

          El $a=0$ está fuera del dominio $a>3$. Luego $a=6$.
        veredicto: |
          El dominio $a>3$ es lo que descarta la solución espuria. Sin él
          habría que discutir dos casos.

      - tipo: calcular
        titulo: El área mínima
        pregunta: |
          ¿Cuál es el área mínima?
        respuesta:
          tipo: numero
          valor: '42'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '84'
            mensaje: |
              84 es el **producto** de los catetos, $6\cdot14$. El área de un
              triángulo es la mitad de la base por la altura.
          - valor: '21'
            mensaje: |
              21 es $3\cdot7$, el producto de las coordenadas del punto fijo.
              El área mínima es el doble.
          - valor: '20'
            mensaje: |
              20 no sale de ninguna cuenta del problema. Con $a=6$ y $b=14$ el
              área es $\frac{6\cdot14}{2} = 42$.
        pista: |
          Con $a=6$, calcula $b = \frac{7a}{a-3}$ y luego $\frac{ab}{2}$.
        desarrollo: |
          $$
          b = \frac{7\cdot6}{6-3} = \frac{42}{3} = 14
          $$

          $$
          A = \frac{ab}{2} = \frac{6\cdot14}{2} = 42
          $$

          **Comprobando que es mínimo**, con el signo de $A'$:

          $$
          A'(a) = \frac{7a(a-6)}{2(a-3)^{2}}
          $$

          Para $3<a<6$ el factor $(a-6)$ es negativo y $A'<0$: decrece.
          Para $a>6$ es positivo y $A'>0$: crece. Mínimo en $a=6$ ✔
        veredicto: |
          El punto fijo $(3,7)$ resulta ser el **punto medio** de la hipotenusa:
          va de $(6,0)$ a $(0,14)$, y su medio es $(3,7)$. Es una propiedad
          general de este problema.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Detectar el dato que falta.** Sin una condición que impida
              encoger el triángulo, el área baja hasta 0 y no hay mínimo. El
              enunciado necesita fijar un punto de la hipotenusa.
          - texto: |
              **Plantear.** Con catetos $a$ y $b$, la hipotenusa es
              $\frac{x}{a}+\frac{y}{b} = 1$, y pasar por $(3,7)$ da
              $\frac3a+\frac7b = 1$.
          - texto: |
              **Reducir a una variable:** $b = \frac{7a}{a-3}$, con $a>3$ para
              que $b>0$, y $A(a) = \frac{7a^{2}}{2(a-3)}$.
          - texto: |
              **Derivar:** $A'(a) = \frac{7a(a-6)}{2(a-3)^{2}}$, que se anula en
              $a=0$ —fuera del dominio— y en $a=6$.
          - texto: |
              **Comprobar y concluir:** $A'$ cambia de negativo a positivo en
              $a=6$, así que es mínimo. $b=14$ y $A = 42$.
          - texto: |
              Como el área crece sin límite cuando $a \to 3^{+}$ y cuando
              $a \to \infty$, no puede haber ningún mínimo interior.
            trampa: true
            mensaje: |
              Justo al revés: que el área se dispare en los dos extremos del
              dominio **garantiza** que el mínimo está en el interior. Es el
              mismo razonamiento que usa el teorema de Weierstrass. Si creciera
              sin límite solo por un lado, habría que mirar el otro extremo.
        veredicto: |
          Los dos comportamientos extremos son fáciles de ver: con $a$ cerca de
          3 la hipotenusa se pone casi vertical y $b$ se dispara; con $a$ grande
          es la base la que se dispara.

    resolucion: |
      > **Aviso sobre el enunciado.** El boletín, tal como está impreso, pide
      > «el área mínima de un triángulo rectángulo con el vértice recto en
      > $(0,0)$ y los catetos sobre los ejes», **sin ninguna condición más**.
      > Así planteado el problema no tiene solución: el triángulo se puede
      > encoger indefinidamente y el ínfimo del área es 0, que no se alcanza.
      >
      > La solución que el boletín publica es
      > $A = -\frac{7}{2}\cdot\frac{a^{2}}{3-a}$, y de ahí se puede
      > **reconstruir** el dato que falta. Reescribiéndola como
      > $A = \frac{7a^{2}}{2(a-3)}$ y comparándola con la fórmula general de
      > este problema cuando la hipotenusa pasa por un punto $(p,q)$ —que es
      > $A = \frac{q\,a^{2}}{2(a-p)}$—, sale $p=3$ y $q=7$.
      >
      > Es decir: **falta decir que la hipotenusa pasa por $(3,7)$**. Además, lo
      > que el boletín llama «solución» no es el área mínima sino el área en
      > función de $a$, a medio camino. Aquí se completa el ejercicio hasta el
      > final. Todo esto queda pendiente de tu revisión.

      **Datos.** Triángulo rectángulo con el vértice recto en el origen, catetos
      sobre los ejes y la hipotenusa pasando por $(3,7)$. Se pide el área
      mínima.

      ### 1 · Por qué hace falta el punto

      Merece la pena decirlo antes de calcular, porque es lo que da sentido al
      problema. Sin ninguna restricción, un triángulo con catetos $a$ y $b$
      tiene área $\frac{ab}{2}$, y tomando $a$ y $b$ tan pequeños como se quiera
      el área se acerca a 0 sin alcanzarlo. **No hay mínimo.**

      La condición de pasar por un punto fijo impide encogerlo: cuanto más se
      estrecha por un lado, más se estira por el otro.

      ### 2 · Plantear

      Con los catetos $a$ sobre $OX$ y $b$ sobre $OY$, la hipotenusa es la recta
      que une $(a,0)$ con $(0,b)$, cuya ecuación canónica es

      $$
      \frac{x}{a}+\frac{y}{b} = 1
      $$

      **Objetivo:** $A = \frac{ab}{2}$, que hay que minimizar.

      **Restricción:** pasar por $(3,7)$:

      $$
      \frac{3}{a}+\frac{7}{b} = 1
      $$

      ### 3 · Reducir a una variable

      $$
      \frac{7}{b} = 1-\frac{3}{a} = \frac{a-3}{a}
      \;\Longrightarrow\;
      b = \frac{7a}{a-3}
      $$

      **El dominio:** hace falta $a>3$ para que $b$ sea positivo. Si $a<3$, el
      punto $(3,7)$ quedaría fuera del triángulo. Decir el dominio es lo que
      luego permite descartar soluciones.

      $$
      A(a) = \frac{ab}{2} = \frac{a}{2}\cdot\frac{7a}{a-3}
      = \frac{7a^{2}}{2(a-3)}, \qquad a>3
      $$

      ### 4 · Derivar

      Con la regla del cociente:

      $$
      A'(a) = \frac{7}{2}\cdot\frac{2a(a-3)-a^{2}\cdot1}{(a-3)^{2}}
      = \frac{7}{2}\cdot\frac{2a^{2}-6a-a^{2}}{(a-3)^{2}}
      = \frac{7}{2}\cdot\frac{a^{2}-6a}{(a-3)^{2}}
      $$

      $$
      A'(a) = \frac{7a(a-6)}{2(a-3)^{2}} = 0
      \;\Longrightarrow\;
      a = 0 \;\text{ o }\; a = 6
      $$

      El $a=0$ **no está en el dominio** $a>3$: se descarta.

      ### 5 · Comprobar que es mínimo

      El denominador $(a-3)^{2}$ es siempre positivo, así que el signo de $A'$
      es el de $a(a-6)$, y con $a>3$ el factor $a$ también es positivo:

      | intervalo | signo de $(a-6)$ | $A'$ | $A$ |
      |---|---|---|---|
      | $3<a<6$ | negativo | $<0$ | decrece |
      | $a>6$ | positivo | $>0$ | crece |

      Cambia de decrecer a crecer: **mínimo** en $a=6$ ✔

      ### 6 · El resultado

      $$
      b = \frac{7\cdot6}{6-3} = 14
      $$

      $$
      \boxed{\;a = 6, \qquad b = 14, \qquad A_{\min} = \frac{6\cdot14}{2} = 42\;}
      $$

      ### 7 · Una propiedad que sale de propina

      La hipotenusa va de $(6,0)$ a $(0,14)$. Su punto medio es

      $$
      \left(\frac{6+0}{2},\;\frac{0+14}{2}\right) = (3,\;7)
      $$

      **exactamente el punto fijo**. No es casualidad: en este problema el
      triángulo de área mínima es siempre aquel cuya hipotenusa tiene al punto
      dado como punto medio, y de ahí sale una forma alternativa de resolverlo
      sin derivar: $a = 2p$ y $b = 2q$.

      Con $p=3$ y $q=7$: $a=6$, $b=14$, $A = \frac{2p\cdot2q}{2} = 2pq = 42$ ✔

      ### 8 · Comprobación

      | $a$ | $b = \frac{7a}{a-3}$ | $A = \frac{ab}{2}$ |
      |---|---|---|
      | $4$ | $28$ | $56$ |
      | $5$ | $17{,}5$ | $43{,}75$ |
      | $\mathbf{6}$ | $\mathbf{14}$ | $\mathbf{42}$ |
      | $7$ | $12{,}25$ | $42{,}9$ |
      | $10$ | $10$ | $50$ |

      Baja hasta 42 y vuelve a subir ✔

      Y el comportamiento en los extremos confirma que el mínimo tiene que estar
      dentro: con $a\to3^{+}$ el cateto vertical se dispara, y con
      $a\to\infty$ el horizontal.

