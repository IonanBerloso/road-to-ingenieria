  - id: rectangulo-bajo-la-parabola
    titulo: El rectángulo más grande bajo una parábola
    fuente: >-
      Ejercicio 7 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Obtener el rectángulo de área máxima cuya base se encuentra en el eje
      $OX$ y sus vértices superiores en la parábola $y = 6-x^{2}$.
    pide: Obtener el rectángulo de área máxima.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué conviene llamar $x$ a **la mitad** de la base?
        opciones:
          - texto: >-
              Porque la parábola es simétrica respecto del eje $OY$, y el
              rectángulo también lo será
            correcta: true
            mensaje: |
              Eso es. Si los dos vértices superiores están en la parábola y la
              base en el eje, el rectángulo tiene que ser simétrico: sus
              vértices son $(-x,0)$, $(x,0)$, $(x,y)$ y $(-x,y)$. Llamar $x$ a
              la semibase deja la base como $2x$ y evita fracciones.
          - texto: Porque así el área es más pequeña
            mensaje: |
              La elección de variable no cambia el área: cambia lo cómodas que
              son las cuentas. El rectángulo es el mismo.
          - texto: Porque la parábola solo está definida para $x>0$
            mensaje: |
              $y = 6-x^{2}$ está definida para todo $x$. Lo que ocurre es que
              corta el eje en $\pm\sqrt6$, y el rectángulo cabe entre esos dos.
          - texto: 'No conviene: hay que llamar $x$ a la base entera'
            mensaje: |
              También se puede, pero entonces el vértice está en
              $\frac{x}{2}$ y la altura es $6-\frac{x^{2}}{4}$: más fracciones y
              más ocasiones de equivocarse.

      - tipo: calcular
        titulo: La semibase óptima
        pregunta: |
          ¿Cuánto vale la semibase $x$ en el rectángulo de área máxima?
        respuesta:
          tipo: numero
          valor: '1.4142136'
          tolerancia: 0.0005
          formato: un número, o una expresión como √2
        distractores:
          - valor: '2.4494897'
            mensaje: |
              $\sqrt6 \approx 2{,}449$ es donde la parábola **corta el eje**: ahí
              la altura sería 0 y el área también. Es el extremo del intervalo,
              no el máximo.
          - valor: '2'
            mensaje: |
              Con $x=2$ el área es $2\cdot2\cdot(6-4) = 8$, menor que el máximo
              $8\sqrt2 \approx 11{,}3$.
          - valor: '2.8284271'
            mensaje: |
              $2\sqrt2$ es la **base entera** del rectángulo óptimo, no la
              semibase. La semibase es $\sqrt2$.
        pista: |
          El área es $A(x) = 2x(6-x^{2}) = 12x-2x^{3}$. Deriva e iguala a cero.
        desarrollo: |
          Con la semibase $x$, la altura es $y = 6-x^{2}$ y el área

          $$
          A(x) = 2x\left(6-x^{2}\right) = 12x-2x^{3}
          $$

          $$
          A'(x) = 12-6x^{2} = 0
          \;\Longrightarrow\;
          x^{2} = 2
          \;\Longrightarrow\;
          x = \sqrt2
          $$

          tomando la raíz positiva, que es la única con sentido geométrico.

          **Comprobando que es máximo:**

          $$
          A''(x) = -12x, \qquad A''(\sqrt2) = -12\sqrt2 < 0
          \;\Longrightarrow\; \text{máximo}
          $$
        veredicto: |
          Hay que descartar $x = -\sqrt2$ por sentido físico, no por
          matemáticas: una longitud negativa no significa nada.

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          ¿Cuál es el área máxima? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '11.3137'
          tolerancia: 0.0005
          formato: un número, o una expresión como 8√2
        distractores:
          - valor: '8'
            mensaje: |
              8 es el coeficiente de $8\sqrt2$, no el área. Falta multiplicar
              por $\sqrt2 \approx 1{,}414$.
          - valor: '5.6568542'
            mensaje: |
              $4\sqrt2$ sería el área si se hubiera usado la semibase en vez de
              la base: $A = 2xy$, con el factor 2.
          - valor: '12'
            mensaje: |
              12 es el coeficiente de $A(x) = 12x-2x^{3}$, no un área. Hay que
              evaluar en $x=\sqrt2$.
        pista: |
          $A(\sqrt2) = 12\sqrt2-2\left(\sqrt2\right)^{3}$, y
          $\left(\sqrt2\right)^{3} = 2\sqrt2$.
        desarrollo: |
          $$
          A(\sqrt2) = 12\sqrt2-2\left(\sqrt2\right)^{3}
          = 12\sqrt2-2\cdot2\sqrt2 = 12\sqrt2-4\sqrt2 = 8\sqrt2
          $$

          $$
          8\sqrt2 \approx 11{,}3137
          $$

          Las dimensiones del rectángulo son base $2\sqrt2 \approx 2{,}83$ y
          altura $6-2 = 4$.
        veredicto: |
          La altura óptima es 4 y la parábola llega hasta 6: el rectángulo
          renuncia a un tercio de la altura disponible para ganar base. Ese
          compromiso es toda la gracia del problema.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Nombrar con simetría.** Los vértices son $(\pm x,0)$ y
              $(\pm x, y)$ con $y = 6-x^{2}$, así que la base es $2x$ y la
              altura $6-x^{2}$.
          - texto: |
              **Objetivo con una variable:**
              $A(x) = 2x\left(6-x^{2}\right) = 12x-2x^{3}$.
          - texto: |
              **El intervalo con sentido:** $x \in \left(0,\sqrt6\right)$, porque
              fuera de ahí la altura sería negativa.
          - texto: |
              **Derivar:** $A'(x) = 12-6x^{2} = 0$ da $x = \sqrt2$, descartando
              la raíz negativa por ser una longitud.
          - texto: |
              **Comprobar que es máximo:** $A''(\sqrt2) = -12\sqrt2 < 0$ ✔ Y el
              área vale $8\sqrt2 \approx 11{,}31$, con base $2\sqrt2$ y altura 4.
          - texto: |
              Hay que comprobar también los extremos del intervalo, y en
              $x=\sqrt6$ el área es mayor porque la base es máxima.
            trampa: true
            mensaje: |
              En $x = \sqrt6$ la **altura vale 0**, así que el área también es 0:
              el rectángulo degenera en un segmento. Los extremos sí hay que
              mirarlos —eso es correcto—, pero aquí dan el área mínima, no la
              máxima. Base grande no implica área grande cuando la altura se
              paga con ella.
        veredicto: |
          El compromiso entre base y altura es toda la gracia del problema:
          crecer en una encoge la otra, y el óptimo está en medio.

    resolucion: |
      **Datos.** Rectángulo con la base en el eje $OX$ y los vértices superiores
      en $y = 6-x^{2}$. Se pide el de área máxima.

      ### 1 · Nombrar aprovechando la simetría

      La parábola es simétrica respecto del eje $OY$, y el rectángulo también
      tiene que serlo: si un vértice superior está en $(x,y)$ de la parábola, el
      otro está en $(-x,y)$.

      Llamando $x$ a la **semibase**:

      | | |
      |---|---|
      | vértices inferiores | $(-x,0)$ y $(x,0)$ |
      | vértices superiores | $(-x,\,6-x^{2})$ y $(x,\,6-x^{2})$ |
      | base | $2x$ |
      | altura | $6-x^{2}$ |

      Llamar $x$ a la semibase y no a la base entera evita arrastrar fracciones.

      ### 2 · La función objetivo y su dominio

      $$
      A(x) = \text{base}\times\text{altura} = 2x\left(6-x^{2}\right)
      = 12x-2x^{3}
      $$

      **Con sentido geométrico solo para**

      $$
      x \in \left(0,\;\sqrt6\right)
      $$

      porque la semibase tiene que ser positiva y la altura también: la parábola
      corta el eje en $\pm\sqrt6$.

      Decir el intervalo no es un adorno: es lo que permite descartar soluciones
      después.

      ### 3 · Derivar

      $$
      A'(x) = 12-6x^{2} = 0
      \;\Longrightarrow\;
      x^{2} = 2
      \;\Longrightarrow\;
      x = \pm\sqrt2
      $$

      Se descarta $-\sqrt2$ **por sentido físico**: una longitud no es negativa.
      Y $\sqrt2 \approx 1{,}414$ está dentro de $\left(0,\sqrt6\right)$ ✔

      ### 4 · Comprobar que es máximo

      $$
      A''(x) = -12x, \qquad A''(\sqrt2) = -12\sqrt2 < 0
      $$

      Máximo ✔ Y hay que mirar también los **extremos del intervalo**, que es
      donde se esconden los máximos cuando la derivada no se anula:

      $$
      A(0) = 0, \qquad A(\sqrt6) = 2\sqrt6\cdot0 = 0
      $$

      Los dos dan área nula: el rectángulo degenera en un segmento. Así que el
      máximo está en el interior, en $x=\sqrt2$.

      ### 5 · El resultado

      $$
      A(\sqrt2) = 12\sqrt2-2\left(\sqrt2\right)^{3} = 12\sqrt2-4\sqrt2
      = 8\sqrt2 \approx 11{,}3137
      $$

      $$
      \boxed{\;\text{base } 2\sqrt2 \approx 2{,}83,
      \quad\text{altura } 4,
      \quad A_{\max} = 8\sqrt2 \approx 11{,}31\;}
      $$

      ### 6 · La lectura del resultado

      La altura óptima es **4**, y la parábola llega hasta 6. Es decir: el
      rectángulo renuncia a un tercio de la altura disponible para ganar base.

      Ese compromiso es la esencia del problema. Subir la altura estrecha el
      rectángulo, y bajarla lo achata; el óptimo está donde las dos pérdidas se
      equilibran.

      ### 7 · Comprobación

      | $x$ | base | altura | área |
      |---|---|---|---|
      | $1$ | $2$ | $5$ | $10$ |
      | $1{,}2$ | $2{,}4$ | $4{,}56$ | $10{,}9$ |
      | $\mathbf{1{,}414}$ | $\mathbf{2{,}83}$ | $\mathbf{4}$ | $\mathbf{11{,}31}$ |
      | $1{,}6$ | $3{,}2$ | $3{,}44$ | $11{,}0$ |
      | $2$ | $4$ | $2$ | $8$ |

      Sube hasta $\sqrt2$ y baja después ✔

      Y una comprobación de sentido: el rectángulo tiene que caber en el recinto
      entre la parábola y el eje, cuya área es

      $$
      \int_{-\sqrt6}^{\sqrt6}\left(6-x^{2}\right)dx = 8\sqrt6 \approx 19{,}6
      $$

      El rectángulo ocupa $11{,}31$, un 58 % de ese recinto: plausible para el
      rectángulo inscrito más grande ✔

