        consigna: |
          Esboza la gráfica de $f$ en el rectángulo $x\in[-4,6]$,
          $y\in[-8,12]$, con sus dos asíntotas dibujadas a trazos y los dos
          extremos marcados con su valor.
        comprueba:
          - punto: La asíntota vertical $x=1$, a trazos, con la curva huyendo de ella por los dos lados
            porque: >-
              Es lo que parte la gráfica en dos ramas. Sin ella, el esbozo
              sugiere una curva continua y todo lo demás deja de encajar.
          - punto: La asíntota oblicua $y=x+1$, también a trazos
            porque: >-
              Es lo que dice cómo se va la función en los dos infinitos. Una
              racional con un grado más arriba no se aplana, y un esbozo con
              ramas horizontales estaría mal.
          - punto: El máximo local en $(0,0)$, en la rama izquierda, y el mínimo local en $(2,4)$, en la derecha
            porque: >-
              Son los dos únicos puntos de tangente horizontal. Que el máximo
              esté más abajo que el mínimo es correcto, y solo se entiende si
              las dos ramas están bien separadas.
          - punto: La rama izquierda por debajo de la oblicua y la derecha por encima
            porque: >-
              La diferencia es $f(x)-(x+1)=\frac{1}{x-1}$, negativa a la
              izquierda de 1 y positiva a la derecha. Es lo que decide de qué
              lado se acerca cada rama.
        veredicto: |
          Si tu esbozo tiene las dos asíntotas y los dos extremos en el lado
          que les toca, está bien aunque las curvas no sean exactas: eso es lo
          que se corrige.
    resolucion: |
      **Datos.** $f(x)=\dfrac{x^2}{x-1}$.

      ### 1 · Dominio y asíntota vertical

      El denominador se anula en $x=1$, y el numerador ahí vale $1\neq0$:

      $$
      \text{Dom}(f)=\mathbb{R}\setminus\{1\},
      \qquad
      \lim_{x\to1^-}f=-\infty,\quad \lim_{x\to1^+}f=+\infty
      $$

      Asíntota vertical $x=1$.

      ### 2 · Asíntota oblicua

      Dividiendo:

      $$
      f(x)=x+1+\frac{1}{x-1}
      $$

      Como $\frac{1}{x-1}\to0$ en los dos infinitos, $y=x+1$ es asíntota
      oblicua por ambos lados. Y como esa diferencia **nunca se anula**, la
      curva no corta a su asíntota.

      ### 3 · Monotonía y extremos

      $$
      f'(x)=\frac{2x(x-1)-x^2}{(x-1)^2}=\frac{x^2-2x}{(x-1)^2}=\frac{x(x-2)}{(x-1)^2}
      $$

      El denominador es siempre positivo, así que el signo lo pone $x(x-2)$:

      | tramo | $x(x-2)$ | $f$ |
      |---|---|---|
      | $(-\infty,0)$ | $+$ | crece |
      | $(0,1)$ | $-$ | decrece |
      | $(1,2)$ | $-$ | decrece |
      | $(2,\infty)$ | $+$ | crece |

      $$
      x=0:\ \text{máximo local},\ f(0)=0
      \qquad
      x=2:\ \text{mínimo local},\ f(2)=4
      $$

      ### 4 · Curvatura

      De $f(x)=x+1+(x-1)^{-1}$:

      $$
      f''(x)=\frac{2}{(x-1)^3}
      $$

      Negativa para $x<1$ —cóncava hacia abajo— y positiva para $x>1$ —cóncava
      hacia arriba—. No hay punto de inflexión, porque en $x=1$ la función ni
      siquiera está definida.

      ### 5 · Comprobación

      El máximo local vale $0$ y el mínimo local vale $4$: el máximo está **por
      debajo** del mínimo. Suena a error y no lo es — están en ramas distintas,
      separadas por la asíntota vertical, y entre ellas la función pasa por
      $-\infty$ y $+\infty$.

      ### Resultado

      $$
      \boxed{\;\text{AV } x=1,\ \text{AO } y=x+1,\
      \text{máx } (0,0),\ \text{mín } (2,4)\;}
      $$

      > **Lo que enseña.** Dividir la fracción al principio resuelve dos cosas
      > de golpe: da la asíntota oblicua y deja la función en una forma,
      > $x+1+\frac{1}{x-1}$, en la que las derivadas salen en una línea.

  - id: aproximar-una-raiz-cubica-con-la-diferencial
    titulo: Una raíz cúbica sin calculadora
    fuente: Ejercicio propio · Road to Ingeniería. De nivel de boletín, escrito para un escalón al que el boletín no da material. No es del boletín ni ha caído en examen.
    nivel: practica
    enunciado: |
      Usando la diferencial, aproximar $\sqrt[3]{8{,}1}$ y estimar el error
      cometido.
    pide: El valor aproximado y una idea del error.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función y qué punto de partida conviene elegir?
        opciones:
          - texto: $f(x)=\sqrt[3]{x}$ en $a=8$, porque $\sqrt[3]{8}=2$ es exacto y $8$ está cerca de $8{,}1$
            correcta: true
            mensaje: |
              Las dos cosas a la vez, y las dos hacen falta: el punto tiene que
              dar un valor que se sepa de memoria **y** estar cerca del que se
              busca. Si estuviera lejos, la aproximación no valdría nada.
          - texto: $f(x)=\sqrt[3]{x}$ en $a=0$, porque ahí todo es más sencillo
            mensaje: |
              En $a=0$ la derivada de la raíz cúbica ni siquiera existe —la
              tangente es vertical—, y además $0$ está lejísimos de $8{,}1$.
          - texto: $f(x)=x^3$ en $a=2$
            mensaje: |
              Esa es la función inversa. Aproximaría cubos, no raíces cúbicas:
              daría $(2{,}1)^3$, que no es lo que se pide.
      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da la aproximación $f(a)+f'(a)\,\Delta x$?
        respuesta:
          tipo: numero
          valor: '2.0083333'
          tolerancia: 0.0002
          formato: un número, con cuatro decimales
        distractores:
          - valor: '2.1'
            mensaje: |
              Has sumado el incremento entero, $0{,}1$, sin multiplicarlo por
              la derivada. La derivada aquí vale $1/12$, así que el incremento
              de $f$ es doce veces menor que el de $x$.
          - valor: '2.0333333'
            mensaje: |
              Has usado $f'(8)=1/3$ en vez de $1/12$. La derivada de
              $x^{1/3}$ es $\frac13x^{-2/3}$, y en $x=8$ eso es
              $\frac13\cdot\frac14$.
        pista: |
          $f'(x)=\frac{1}{3\sqrt[3]{x^2}}$, y $\sqrt[3]{8^2}=4$.
        desarrollo: |
          $$
          f'(8)=\frac{1}{3\cdot4}=\frac1{12},
          \qquad
          \sqrt[3]{8{,}1}\approx 2+\frac{0{,}1}{12}=2{,}008\overline{3}
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento, incluido el del error. Una pieza es falsa.
        piezas:
          - texto: 'Se toma $f(x)=x^{1/3}$, $a=8$ y $\Delta x = 0{,}1$, porque $f(8)=2$ es exacto.'
          - texto: 'La diferencial es $df = f''(a)\,\Delta x = \frac{1}{12}\cdot0{,}1 = 0{,}00833$.'
          - texto: 'Luego $\sqrt[3]{8{,}1}\approx f(8)+df = 2{,}00833$.'
          - texto: 'Como $f''''(x)=-\frac{2}{9}x^{-5/3}<0$, la función es cóncava hacia abajo y la tangente va por encima: la aproximación se pasa.'
          - texto: 'El error de la diferencial es siempre menor que $\Delta x$, así que aquí es menor que $0{,}1$.'
            trampa: true
            mensaje: |
              Ni es siempre así ni dice gran cosa cuando lo es. El error
              depende de la segunda derivada y del **cuadrado** del incremento:
              aquí sale del orden de $3\cdot10^{-5}$, tres mil veces menor que
              $0{,}1$. Con una cota tan floja, la aproximación parecería inútil.
        veredicto: |
          El signo de la segunda derivada dice de qué lado falla la
          aproximación, y eso se puede decir sin calcular nada.
    resolucion: |
      **Datos.** Aproximar $\sqrt[3]{8{,}1}$ con la diferencial.

      ### 1 · Elegir función, punto e incremento

      $$
      f(x)=x^{1/3}, \qquad a=8, \qquad \Delta x = 0{,}1
      $$

      El punto $a=8$ se elige por dos razones a la vez: $f(8)=2$ es exacto y
      está cerca de $8{,}1$.

      ### 2 · La derivada ahí

      $$
      f'(x)=\frac13x^{-2/3}=\frac{1}{3\sqrt[3]{x^2}}
      \quad\Longrightarrow\quad
      f'(8)=\frac{1}{3\cdot4}=\frac1{12}
      $$

      ### 3 · La aproximación

      $$
      f(a+\Delta x)\approx f(a)+f'(a)\,\Delta x
      = 2+\frac{0{,}1}{12}=2{,}00833
      $$

      ### 4 · De qué lado falla

      $$
      f''(x)=-\frac29x^{-5/3}<0 \ \text{ para } x>0
      $$

      La función es cóncava hacia abajo, luego su **tangente queda por
      encima** de la curva: la aproximación se pasa por arriba.

      El tamaño del error se estima con el término siguiente de Taylor:

      $$
      \left|\frac{f''(8)}{2}(\Delta x)^2\right|
      = \frac{2/(9\cdot32)}{2}\cdot0{,}01 \approx 3{,}5\cdot10^{-5}
      $$

      ### 5 · Comprobación

      El valor exacto es $2{,}0082988$, así que el error real es
      $3{,}5\cdot10^{-5}$ **y por exceso**, las dos cosas como se había
      previsto.

      ### Resultado

      $$
      \boxed{\;\sqrt[3]{8{,}1}\approx2{,}00833,\ \text{por exceso, con error} \sim3{,}5\cdot10^{-5}\;}
      $$

      > **Lo que enseña.** La diferencial es el polinomio de Taylor de grado
      > uno con otro nombre, y por eso el error va con $(\Delta x)^2$. Saber si
      > se pasa o se queda corto no cuesta ninguna cuenta: lo dice el signo de
      > $f''$.

  - id: cual-de-las-tres-es-la-funcion
    titulo: Tres curvas parecidas, y solo una es la función
    fuente: Ejercicio propio · Road to Ingeniería. De nivel de boletín, escrito para un escalón al que el boletín no da material. No es del boletín ni ha caído en examen.
    nivel: practica
    enunciado: |
      La figura muestra, en el mismo par de ejes, las gráficas de una función
      $f$, de su derivada $f'$ y de su derivada segunda $f''$, rotuladas
      $A$, $B$ y $C$ en algún orden. Las tres se anulan una sola vez en el
      intervalo dibujado: $A$ en $x=3$, $B$ en $x=6$ y $C$ en $x=0$.

      Decidir cuál es cuál, razonadamente.

      <figure class="figura-examen">
      <svg viewBox="0 0 350 255" role="img" width="350" height="255"
           aria-labelledby="f-tres-curvas-emparejar-t f-tres-curvas-emparejar-d">
        <title id="f-tres-curvas-emparejar-t">Tres curvas rotuladas A, B y C, que son una función y sus dos derivadas en algún orden</title>
        <desc id="f-tres-curvas-emparejar-d">Tres curvas dibujadas sobre los mismos ejes, entre x igual a cero y x igual a diez. La rotulada C arranca en el origen, sube hasta su punto más alto en x igual a tres, a la altura uno coma uno, y desde ahí baja despacio acercándose al eje sin volver a tocarlo. La rotulada A arranca a la altura uno cuando x vale cero, baja cortando el eje en x igual a tres, sigue bajando hasta su punto más bajo en x igual a seis, a la altura menos cero coma catorce, y después sube muy suavemente hacia el eje. La rotulada B arranca a la altura menos cero coma sesenta y siete cuando x vale cero, sube cortando el eje en x igual a seis y alcanza un punto más alto muy pequeño hacia x igual a nueve. Los tres cortes con el eje horizontal, en cero, tres y seis, están marcados con un punto. Lo que hay que decidir es cuál de las tres es la función y cuáles sus derivadas.</desc>
