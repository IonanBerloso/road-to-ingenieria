  - id: teorema-de-rolle
    titulo: Tres veces que la derivada tiene que anularse
    fuente: >-
      Ejercicio 2 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Estudiar si es posible aplicar el teorema de Rolle a las siguientes
      funciones en los intervalos indicados, y en caso afirmativo calcular el
      valor $c$ a que hace referencia este teorema.

      **(a)** $f(x) = x^{2}+x+4$ en $[-3,2]$ ·
      **(b)** $f(x) = x^{3}-6x^{2}+5x+3$ en $[1,5]$ ·
      **(c)** $f(x) = \mathrm{sen}\,x$ en $[0,\pi]$
    pide: Estudiar las hipótesis y calcular $c$ donde sea posible.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis tiene Rolle que no tiene Lagrange?
        opciones:
          - texto: >-
              Que los **valores en los extremos coincidan**: $f(a) = f(b)$
            correcta: true
            mensaje: |
              Eso es lo único que añade, y a cambio la tesis se simplifica: la
              pendiente media vale 0, así que existe $c$ con $f'(c)=0$. Rolle
              es el caso particular de Lagrange con extremos a la misma altura.
          - texto: Que la función sea positiva
            mensaje: |
              El signo de la función no interviene. En (b) la función toma
              valores negativos dentro del intervalo y el teorema se aplica
              igual.
          - texto: Que el intervalo sea simétrico
            mensaje: |
              No hace falta: en (b) el intervalo es $[1,5]$, nada simétrico, y
              el teorema se aplica.
          - texto: Que la función sea monótona
            mensaje: |
              Sería contradictorio: una función monótona no puede valer lo mismo
              en los dos extremos salvo que sea constante.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          En **(a)**, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Signo cambiado. De $2c+1 = 0$ sale $c = -\frac12$.
          - valor: '-1'
            mensaje: |
              $-1$ es el punto medio de... nada en particular. La ecuación es
              $2c+1 = 0$, cuya solución es $-\frac12$.
          - valor: '-2.5'
            mensaje: |
              $-2{,}5$ es el punto medio del intervalo $[-3,2]$. Coincidiría con
              $c$ solo si la parábola fuera simétrica respecto de él, y no lo
              es: su vértice está en $-\frac12$.
        pista: |
          Comprueba primero $f(-3) = f(2)$, y luego resuelve $f'(c)=0$.
        desarrollo: |
          **Hipótesis.** Un polinomio es continuo y derivable siempre ✔ Y hay
          que comprobar la tercera:

          $$
          f(-3) = 9-3+4 = 10, \qquad f(2) = 4+2+4 = 10
          $$

          Coinciden ✔ Se puede aplicar Rolle.

          **La tesis:**

          $$
          f'(x) = 2x+1 = 0 \;\Longrightarrow\; c = -\frac12
          $$

          Y $-\frac12 \in (-3,2)$ ✔

          Era de esperar: en una parábola el único punto de derivada nula es el
          **vértice**.
        veredicto: |
          El intervalo $[-3,2]$ está elegido para que sea simétrico respecto del
          vértice $x=-\frac12$: por eso los extremos valen lo mismo.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          En **(b)**, ¿cuánto vale $c$? En forma exacta, o con tres decimales.
        respuesta:
          tipo: numero
          valor: '3.528'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.472'
            mensaje: |
              $2-\sqrt{7/3} \approx 0{,}472$ es la **otra** raíz de la ecuación,
              y no está en $(1,5)$: queda fuera por la izquierda. Hay que
              filtrar.
          - valor: '2'
            mensaje: |
              2 sale de $\frac{-b}{3a}$, el punto de inflexión de la cúbica. Es
              donde se anula la **segunda** derivada, no la primera.
          - valor: '3'
            mensaje: |
              3 es el punto medio del intervalo $[1,5]$. Rolle no dice que $c$
              sea el punto medio.
        pista: |
          $f'(x) = 3x^{2}-12x+5$. Resuelve y quédate con la raíz que esté en
          $(1,5)$.
        desarrollo: |
          **Hipótesis.** Polinomio ✔ Y los extremos:

          $$
          f(1) = 1-6+5+3 = 3
          $$

          $$
          f(5) = 125-150+25+3 = 3
          $$

          Coinciden ✔

          **La tesis:**

          $$
          f'(x) = 3x^{2}-12x+5 = 0
          $$

          $$
          x = \frac{12\pm\sqrt{144-60}}{6} = \frac{12\pm\sqrt{84}}{6}
          = 2 \pm \frac{\sqrt{84}}{6} = 2 \pm \sqrt{\frac{7}{3}}
          $$

          $$
          \sqrt{\tfrac73} \approx 1{,}528
          \;\Longrightarrow\;
          x \approx 3{,}528 \;\text{ o }\; x \approx 0{,}472
          $$

          Solo $3{,}528$ está en $(1,5)$. El otro se descarta.
        veredicto: |
          La forma cerrada es $c = 2+\sqrt{\frac73}$, que es como suele darse la
          respuesta.

      - tipo: justificar
        pregunta: |
          Ordena el método y los tres resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Las tres hipótesis de Rolle:** continua en el cerrado, derivable
              en el abierto **y $f(a) = f(b)$**. La tercera es la que hay que
              comprobar aparte.
          - texto: |
              **(a)** $f(-3) = f(2) = 10$ ✔, y $f'(c) = 2c+1 = 0$ da
              $c = -\frac12$, el vértice de la parábola.
          - texto: |
              **(b)** $f(1) = f(5) = 3$ ✔, y $3c^{2}-12c+5 = 0$ da
              $c = 2\pm\sqrt{\frac73}$; solo $2+\sqrt{\frac73} \approx 3{,}53$
              está en $(1,5)$.
          - texto: |
              **(c)** $\mathrm{sen}\,0 = \mathrm{sen}\,\pi = 0$ ✔, y
              $\cos c = 0$ da $c = \frac{\pi}{2}$, la cima de la onda.
          - texto: |
              En los tres hay que **filtrar** las soluciones que caen fuera del
              intervalo abierto.
          - texto: |
              Como en los tres casos las funciones son derivables, no hace falta
              comprobar que $f(a) = f(b)$.
            trampa: true
            mensaje: |
              Esa es **la** hipótesis propia de Rolle, y sin ella el teorema es
              falso. $f(x)=x$ en $[0,1]$ es derivable y su derivada no se anula
              nunca: no cumple $f(0)=f(1)$. Comprobarla cuesta dos evaluaciones
              y es donde el ejercicio pone la nota.
        veredicto: |
          En los tres casos el intervalo está elegido a propósito para que los
          extremos valgan lo mismo. Ese detalle del enunciado no es casual.

      - tipo: redactar
        consigna: |
          **Escribe en papel el enunciado del teorema de Rolle** —hipótesis y
          tesis, con los intervalos correctos— y, debajo, la comprobación
          completa del apartado **(b)**: que se cumplen las tres, y de dónde
          sale la $c$.

          Enunciar un teorema con sus hipótesis es de lo que más cae en este
          tema y de lo que peor se puntúa, porque casi todo el mundo recuerda
          la tesis y se deja alguna hipótesis por el camino.
        rubrica:
          - punto: |
              Las **tres** hipótesis, y ni una menos: continua en el cerrado
              $[a,b]$, derivable en el abierto $(a,b)$, y $f(a)=f(b)$.
            porque: |
              La tercera es la propia de Rolle y es la que casi nadie olvida;
              las que se caen son las dos primeras. Un teorema enunciado sin
              sus hipótesis no es el teorema: es la conclusión suelta, y eso
              no se puntúa.
          - punto: |
              El **cerrado y el abierto en su sitio**: continuidad en
              $[a,b]$, derivabilidad en $(a,b)$.
            porque: |
              No es una manía de notación. Pedir derivabilidad en los extremos
              dejaría fuera funciones a las que el teorema sí se aplica, y
              pedir continuidad solo en el abierto lo haría falso. El corrector
              mira los corchetes.
          - punto: |
              La tesis con su cuantificador: **existe** $c \in (a,b)$ tal que
              $f'(c)=0$ — no «hay un único» ni «para todo».
            porque: |
              Rolle garantiza al menos uno, no exactamente uno. En el apartado
              (b) de este mismo ejercicio la derivada es de segundo grado y
              podría anularse dos veces: decir «único» afirma algo que el
              teorema no dice.
          - punto: |
              En la comprobación, decir **por qué** es continua y derivable:
              «es un polinomio», no «se ve».
            porque: |
              Es una línea y vale puntos. Los polinomios lo son en todo
              $\mathbb{R}$, y ahí se acaba la justificación; con una función a
              trozos o con una raíz, esa misma línea es donde está la
              dificultad del ejercicio.
          - punto: |
              La $c$ **dentro del intervalo abierto**, y descartar
              explícitamente la raíz que se sale.
            porque: |
              En (b) la derivada se anula en dos puntos y solo uno cae en
              $(1,5)$. El teorema habla del abierto: dar la raíz de fuera, o
              darlas las dos sin decir nada, es no haber leído dónde vive la
              $c$.
        veredicto: |
          Un atajo que no vale: comprobar solo $f(a)=f(b)$ y saltar a calcular
          $f'(c)=0$. Sale el mismo número y se pierde la mitad del apartado,
          porque lo que se puntúa es haber verificado que el teorema **se puede
          aplicar**.

    resolucion: |
      **Datos.** Tres funciones con sus intervalos. Se pide comprobar las
      hipótesis de Rolle y hallar $c$.

      ### 1 · El teorema

      Si $f$ es **continua en $[a,b]$**, **derivable en $(a,b)$** y
      $\boldsymbol{f(a) = f(b)}$, entonces existe $c \in (a,b)$ con

      $$
      f'(c) = 0
      $$

      Es el caso particular de Lagrange en que la pendiente media vale 0. La
      tercera hipótesis es la propia de Rolle, y es la que hay que comprobar
      explícitamente: las dos primeras suelen ser inmediatas.

      ### 2 · (a) $f(x) = x^{2}+x+4$ en $[-3,2]$

      **Hipótesis.** Polinomio: continuo y derivable en todo $\mathbb{R}$ ✔

      $$
      f(-3) = 9-3+4 = 10, \qquad f(2) = 4+2+4 = 10 \quad\checkmark
      $$

      **Tesis.**

      $$
      f'(x) = 2x+1 = 0 \;\Longrightarrow\; \boxed{c = -\frac12}
      $$

      Y $-\frac12 \in (-3,2)$ ✔

      El único punto de derivada nula de una parábola es su **vértice**, así
      que aquí $c$ es único. Y el intervalo del enunciado está elegido para ser
      simétrico respecto de él: por eso los extremos coinciden.

      ### 3 · (b) $f(x) = x^{3}-6x^{2}+5x+3$ en $[1,5]$

      **Hipótesis.** Polinomio ✔

      $$
      f(1) = 1-6+5+3 = 3
      $$

      $$
      f(5) = 125-150+25+3 = 3 \quad\checkmark
      $$

      **Tesis.**

      $$
      f'(x) = 3x^{2}-12x+5 = 0
      $$

      $$
      x = \frac{12\pm\sqrt{144-60}}{6} = \frac{12\pm\sqrt{84}}{6}
      = 2\pm\frac{2\sqrt{21}}{6} = 2\pm\sqrt{\frac{7}{3}}
      $$

      Las dos raíces son $\approx 3{,}528$ y $\approx 0{,}472$. **Solo la
      primera** está en $(1,5)$:

      $$
      \boxed{c = 2+\sqrt{\frac{7}{3}} \approx 3{,}528}
      $$

      El filtro es obligatorio. La ecuación algebraica no sabe nada del
      intervalo.

      ### 4 · (c) $f(x) = \mathrm{sen}\,x$ en $[0,\pi]$

      **Hipótesis.** El seno es continuo y derivable en todo $\mathbb{R}$ ✔

      $$
      \mathrm{sen}\,0 = 0, \qquad \mathrm{sen}\,\pi = 0 \quad\checkmark
      $$

      **Tesis.**

      $$
      f'(x) = \cos x = 0 \;\Longrightarrow\; x = \frac{\pi}{2}+k\pi
      $$

      De todas esas, la única en $(0,\pi)$ es

      $$
      \boxed{c = \frac{\pi}{2}}
      $$

      que es la cima de la onda: el máximo del seno en ese intervalo.

      ### 5 · Qué tienen en común los tres

      En los tres casos $c$ resulta ser un **extremo local** de la función:

      | | $c$ | qué es |
      |---|---|---|
      | (a) | $-\frac12$ | vértice, mínimo |
      | (b) | $3{,}528$ | mínimo local de la cúbica |
      | (c) | $\frac{\pi}{2}$ | máximo del seno |

      No es casualidad. Si $f(a) = f(b)$ y la función no es constante, tiene
      que subir y bajar —o al revés— dentro del intervalo, y en el punto de
      giro la derivada se anula. Esa es la **demostración** del teorema, y
      conviene tenerla en la cabeza: por el teorema de Weierstrass, una función
      continua en un cerrado alcanza su máximo y su mínimo, y si los extremos
      valen lo mismo al menos uno de ellos cae en el interior.

      ### 6 · Comprobación

      | | $f(a)$ | $f(b)$ | $c$ | $f'(c)$ |
      |---|---|---|---|---|
      | (a) | $10$ | $10$ | $-0{,}5$ | $2(-0{,}5)+1 = 0$ ✔ |
      | (b) | $3$ | $3$ | $3{,}528$ | $3(12{,}45)-12(3{,}528)+5 = 0{,}0$ ✔ |
      | (c) | $0$ | $0$ | $\frac{\pi}{2}$ | $\cos\frac{\pi}{2} = 0$ ✔ |

      ### Resultado

      $$
      \boxed{\;\text{(a) } c = -\tfrac12
      \qquad \text{(b) } c = 2+\sqrt{\tfrac73}
      \qquad \text{(c) } c = \tfrac{\pi}{2}\;}
      $$

