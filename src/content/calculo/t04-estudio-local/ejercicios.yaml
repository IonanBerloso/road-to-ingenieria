  - id: ej-optimizar-rectangulo
    titulo: Optimizar, con la restricción a la vista
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Con 20 metros de valla se quiere cercar un rectángulo. ¿Qué dimensiones
      dan el área máxima?
    pide: Las dimensiones del rectángulo de área máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          En un problema de optimización, ¿qué es la «función objetivo»?
        opciones:
          - texto: Lo que hay que hacer máximo o mínimo, aquí el área
            correcta: true
            mensaje: |
              Eso es. Y la otra ecuación, la que liga las variables, es la
              **restricción**. Distinguirlas es la mitad del ejercicio.
          - texto: La que relaciona las dos variables entre sí
            mensaje: |
              Esa es la restricción. La objetivo es la que se quiere optimizar:
              aquí, el área.
          - texto: La derivada que hay que igualar a cero
            mensaje: |
              Derivar viene después, y es lo mecánico. La función objetivo es lo
              que se deriva, y hay que escribirla antes.
      - tipo: calcular
        titulo: El objetivo con una sola variable
        pregunta: |
          Con perímetro $2x+2y=20$, se despeja $y = 10-x$ y el área queda
          $A(x) = x(10-x)$. ¿En qué valor de $x$ se anula $A'(x)$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              10 es la suma de los dos lados, no cada uno. De
              $A'(x) = 10-2x = 0$ sale $x = 5$.
          - valor: '20'
            mensaje: |
              20 es el perímetro entero. Cada lado mide bastante menos.
          - valor: '2.5'
            mensaje: |
              Parece que has dividido dos veces. De $10 = 2x$ sale $x=5$, no
              $2{,}5$.
        pista: |
          Desarrolla $A(x) = 10x - x^{2}$ y deriva.
        desarrollo: |
          $$
          A(x) = x(10-x) = 10x - x^{2}
          \;\Longrightarrow\;
          A'(x) = 10-2x = 0
          \;\Longrightarrow\;
          x = 5
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza no debe entrar.
        piezas:
          - texto: Objetivo, el área $A = xy$; restricción, el perímetro $2x+2y=20$.
          - texto: De la restricción, $y = 10-x$, y el objetivo queda $A(x)=10x-x^{2}$.
          - texto: El intervalo es $0 < x < 10$, porque los lados son positivos.
          - texto: $A'(x)=10-2x$ se anula en $x=5$, y $A''=-2<0$, luego es máximo.
          - texto: Con $x=5$ sale $y=5$, un cuadrado de 25 m².
          - texto: Basta con encontrar dónde se anula la derivada.
            trampa: true
            mensaje: |
              No basta: eso solo da un candidato. Falta comprobar que es máximo
              y no mínimo, y que la solución tiene sentido — un lado no puede
              ser negativo. Son los dos pasos que separan una respuesta
              completa de una a medias.
    resolucion: |
      **Nombrar y dibujar.** Lados $x$ e $y$, los dos positivos.

      **Objetivo**, lo que se quiere máximo:

      $$
      A = xy
      $$

      **Restricción**, lo que liga las variables:

      $$
      2x + 2y = 20 \;\Longrightarrow\; y = 10 - x
      $$

      **Una sola variable**, sustituyendo:

      $$
      A(x) = x(10-x) = 10x - x^{2}, \qquad 0 < x < 10
      $$

      Ese intervalo hay que escribirlo: sale de que los dos lados son
      positivos, y es el que permite hablar de extremos absolutos.

      **Derivar y resolver.**

      $$
      A'(x) = 10 - 2x = 0 \;\Longrightarrow\; x = 5
      $$

      **Comprobar que es máximo.** $A''(x) = -2 < 0$, así que sí.

      **Y que tiene sentido.** Con $x=5$ sale $y = 5$: un cuadrado de lado 5 y
      área 25 m². Los dos lados son positivos y suman el perímetro pedido.

      **El resultado general**, que conviene reconocer: de todos los
      rectángulos con el mismo perímetro, el de área máxima es el cuadrado.

      <figure class="figura-examen">
      <svg viewBox="0 0 416 191" role="img" width="416" height="191"
           aria-labelledby="f-ej-optimizar-rectangulo-t f-ej-optimizar-rectangulo-d">
        <title id="f-ej-optimizar-rectangulo-t">Tres rectángulos de igual perímetro y la gráfica del área en función del lado</title>
        <desc id="f-ej-optimizar-rectangulo-d">A la izquierda, tres rectángulos apoyados en la misma línea, todos con perímetro veinte metros. El primero es estrecho y alto, de dos por ocho, y su área vale dieciséis. El segundo es un cuadrado de cinco por cinco y su área vale veinticinco, la mayor. El tercero es ancho y bajo, de ocho por dos, y vuelve a valer dieciséis. A la derecha, la gráfica del área en función del lado x: una parábola abierta hacia abajo que vale cero en x igual a cero y en x igual a diez, y cuyo punto más alto está exactamente en x igual a cinco, con valor veinticinco.</desc>
