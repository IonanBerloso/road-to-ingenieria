  - id: ej-leer-la-grafica-de-efe
    titulo: Lo dibujado es f, y preguntan por sus derivadas
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, para el hueco de «leer una
      gráfica» que la ruta de la ordinaria declara. Es el camino contrario al
      del ejemplo siguiente: allí se da la derivada y se pregunta por la
      función. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      **Lo dibujado es $f$**, no ninguna de sus derivadas. Sin calcular nada,
      decir dónde es positiva $f'$ y dónde cambia de signo $f''$.

