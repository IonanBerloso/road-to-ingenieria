  - id: rectangulo-en-triangulo-equilatero
    titulo: El rectángulo más grande dentro de un triángulo
    fuente: >-
      Ejercicio 12 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular el área máxima del rectángulo inscrito en un triángulo equilátero
      de lado $a$.
    pide: Calcular el área máxima del rectángulo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la variable más cómoda para este problema?
        opciones:
          - texto: >-
              La **altura** a la que está el lado superior del rectángulo
            correcta: true
            mensaje: |
              Eso es. Conocida la altura $y$, la anchura del triángulo a ese
              nivel queda determinada por semejanza, y el área sale de una sola
              multiplicación. Si se elige la base como variable, hay que
              despejar la altura y las cuentas se enredan.
          - texto: El lado del triángulo
            mensaje: |
              Es un **dato**, no una variable: el enunciado lo fija en $a$. Lo
              que se elige es dónde colocar el rectángulo dentro.
          - texto: El ángulo de la base
            mensaje: |
              En un triángulo equilátero los ángulos valen $60^{\circ}$ y no se
              pueden elegir. Aquí no hay ningún ángulo variable.
          - texto: El área del rectángulo
            mensaje: |
              El área es lo que se quiere maximizar, no la variable de la que
              depende todo. Hace falta algo que describa **la posición** del
              rectángulo.

      - tipo: calcular
        titulo: La altura óptima
        pregunta: |
          Si el triángulo tiene altura $h$, ¿a qué fracción de $h$ está el lado
          superior del rectángulo óptimo?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.3333333'
            mensaje: |
              Un tercio es donde está el **baricentro** del triángulo, que aquí
              no interviene. La altura óptima del rectángulo es la mitad exacta.
          - valor: '0.6666667'
            mensaje: |
              Dos tercios es la otra medida asociada al baricentro. La respuesta
              es $\frac12$, y sale de derivar $a\left(1-\frac{y}{h}\right)y$.
          - valor: '0.25'
            mensaje: |
              Un cuarto haría el rectángulo demasiado bajo y ancho. El óptimo
              está justo en el punto medio de la altura.
        pista: |
          El área es $A(y) = a\left(1-\frac{y}{h}\right)y$. Es una parábola en
          $y$: su vértice está en el punto medio de sus raíces.
        desarrollo: |
          Por semejanza, a la altura $y$ la anchura del triángulo es

          $$
          w(y) = a\left(1-\frac{y}{h}\right)
          $$

          —vale $a$ en la base y 0 en el vértice—. El área del rectángulo:

          $$
          A(y) = a\left(1-\frac{y}{h}\right)y = ay-\frac{a}{h}y^{2}
          $$

          Es una **parábola** en $y$ que se anula en $y=0$ y en $y=h$. Su
          vértice está en el punto medio:

          $$
          y = \frac{h}{2}
          $$

          O derivando:

          $$
          A'(y) = a-\frac{2a}{h}y = 0 \;\Longrightarrow\; y = \frac{h}{2}
          $$
        veredicto: |
          Que el objetivo sea una parábola simplifica el ejercicio: su máximo
          está siempre en el punto medio entre sus dos ceros, sin derivar.

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          Con $a = 4$, ¿cuál es el área máxima del rectángulo?
        respuesta:
          tipo: numero
          valor: '3.4641'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '6.9282'
            mensaje: |
              $4\sqrt3 \approx 6{,}93$ es el área del **triángulo** entero, no la
              del rectángulo. El rectángulo ocupa exactamente la mitad.
          - valor: '2'
            mensaje: |
              2 es la base del rectángulo óptimo, $\frac{a}{2}$. Falta
              multiplicar por la altura, $\frac{a\sqrt3}{4} \approx 1{,}73$.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3 \approx 1{,}73$ es la altura del rectángulo,
              $\frac{a\sqrt3}{4}$ con $a=4$. Falta multiplicar por la base.
        pista: |
          $A = \sqrt3\frac{a^{2}}{8}$, y $a^{2} = 16$.
        desarrollo: |
          $$
          A = \sqrt3\,\frac{a^{2}}{8} = \sqrt3\cdot\frac{16}{8} = 2\sqrt3
          \approx 3{,}4641
          $$

          Y las dimensiones: base $\frac{a}{2} = 2$ y altura
          $\frac{h}{2} = \frac{a\sqrt3}{4} = \sqrt3 \approx 1{,}732$.

          El triángulo entero tiene área
          $\frac{\sqrt3}{4}a^{2} = 4\sqrt3 \approx 6{,}93$, así que el
          rectángulo ocupa **exactamente la mitad**.
        veredicto: |
          Esa mitad exacta es general: el rectángulo máximo inscrito en
          cualquier triángulo ocupa la mitad de su área, sea equilátero o no.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La altura del triángulo:** $h = \frac{a\sqrt3}{2}$, por
              Pitágoras sobre medio triángulo.
          - texto: |
              **La anchura por semejanza:** a la altura $y$, el triángulo mide
              $w(y) = a\left(1-\frac{y}{h}\right)$ — vale $a$ abajo y 0 en el
              vértice.
          - texto: |
              **El objetivo:** $A(y) = a\left(1-\frac{y}{h}\right)y$, una
              parábola que se anula en $y=0$ y en $y=h$.
          - texto: |
              **El máximo** de una parábola está en el punto medio de sus
              raíces: $y = \frac{h}{2}$, sin necesidad de derivar.
          - texto: |
              **El resultado:** base $\frac{a}{2}$, altura $\frac{a\sqrt3}{4}$ y
              área $\frac{\sqrt3\,a^{2}}{8}$, que es la mitad del triángulo.
          - texto: |
              El rectángulo inscrito de área máxima tiene la misma proporción
              que el triángulo, porque es semejante a él.
            trampa: true
            mensaje: |
              Un rectángulo no puede ser semejante a un triángulo: no tienen el
              mismo número de lados. Y la proporción del rectángulo óptimo,
              base entre altura, es $\frac{a/2}{a\sqrt3/4} = \frac{2}{\sqrt3}
              \approx 1{,}15$, que no coincide con nada del triángulo. La
              semejanza que sí se usa es la de los **triángulos** que quedan
              arriba, y sirve para hallar la anchura a cada altura.
        veredicto: |
          La semejanza es la herramienta, pero entre los triángulos pequeño y
          grande. Es lo que convierte «la anchura a la altura y» en una fórmula.

    resolucion: |
      **Datos.** Triángulo equilátero de lado $a$. Se pide el área máxima de un
      rectángulo inscrito.

      ### 1 · La altura del triángulo

      Partiendo el equilátero por su altura queda un triángulo rectángulo de
      hipotenusa $a$ y cateto $\frac{a}{2}$:

      $$
      h = \sqrt{a^{2}-\frac{a^{2}}{4}} = \frac{a\sqrt3}{2}
      $$

      ### 2 · Elegir la variable, y la semejanza

      El rectángulo tiene la base sobre la base del triángulo y los dos vértices
      superiores sobre los lados. La variable cómoda es **la altura $y$ a la que
      está su lado superior**.

      A esa altura, el triángulo que queda por encima es **semejante** al
      original, con razón $\frac{h-y}{h}$. Así que la anchura del triángulo a la
      altura $y$ es

      $$
      w(y) = a\cdot\frac{h-y}{h} = a\left(1-\frac{y}{h}\right)
      $$

      Se comprueba en los extremos: en $y=0$ vale $a$, la base entera; en $y=h$
      vale 0, el vértice ✔

      ### 3 · La función objetivo

      $$
      A(y) = w(y)\cdot y = a\left(1-\frac{y}{h}\right)y
      = ay-\frac{a}{h}y^{2}, \qquad y \in (0,h)
      $$

      Es una **parábola** en $y$ que abre hacia abajo y se anula en $y=0$ y en
      $y=h$.

      ### 4 · El máximo

      Como es una parábola, su vértice está en el punto medio de sus dos raíces
      —sin necesidad de derivar—:

      $$
      y = \frac{0+h}{2} = \frac{h}{2}
      $$

      Y derivando, para confirmarlo:

      $$
      A'(y) = a-\frac{2a}{h}y = 0 \;\Longrightarrow\; y = \frac{h}{2}
      $$

      $$
      A''(y) = -\frac{2a}{h} < 0 \;\Longrightarrow\; \text{máximo} \ \checkmark
      $$

      ### 5 · Las dimensiones y el área

      **Altura del rectángulo:**

      $$
      y = \frac{h}{2} = \frac{a\sqrt3}{4}
      $$

      **Base:**

      $$
      w\!\left(\frac{h}{2}\right) = a\left(1-\frac12\right) = \frac{a}{2}
      $$

      **Área:**

      $$
      A = \frac{a}{2}\cdot\frac{a\sqrt3}{4} = \frac{\sqrt3\,a^{2}}{8}
      $$

      $$
      \boxed{\;A_{\max} = \sqrt3\,\frac{a^{2}}{8},
      \quad\text{con base } \frac{a}{2} \text{ y altura } \frac{a\sqrt3}{4}\;}
      $$

      ### 6 · La mitad exacta

      El área del triángulo equilátero es

      $$
      A_{\triangle} = \frac{\sqrt3}{4}a^{2}
      $$

      y la del rectángulo, $\frac{\sqrt3}{8}a^{2}$: **exactamente la mitad**.

      Y no depende de que el triángulo sea equilátero. En cualquier triángulo, el
      rectángulo inscrito de área máxima tiene la altura a la mitad y ocupa la
      mitad del área, porque el razonamiento —anchura lineal en $y$, objetivo
      parabólico, vértice en el medio— es el mismo.

      Es un resultado que merece la pena recordar: **la mitad, siempre**.

      ### 7 · Comprobación

      Con $a = 4$, para que se lean los números. Entonces
      $h = 2\sqrt3 \approx 3{,}464$ y el triángulo tiene área
      $4\sqrt3 \approx 6{,}928$.

      | $y$ | anchura $w(y)$ | área $wy$ |
      |---|---|---|
      | $0{,}87$ | $3$ | $2{,}60$ |
      | $1{,}39$ | $2{,}4$ | $3{,}33$ |
      | $\mathbf{1{,}732}$ | $\mathbf{2}$ | $\mathbf{3{,}464}$ |
      | $2{,}08$ | $1{,}6$ | $3{,}33$ |
      | $2{,}60$ | $1$ | $2{,}60$ |

      El máximo está en $y = \frac{h}{2} = 1{,}732$ y vale $2\sqrt3 = 3{,}464$,
      justo la mitad de $6{,}928$ ✔

      La tabla es **simétrica** alrededor del máximo, como corresponde a una
      parábola: los valores en $1{,}39$ y $2{,}08$ coinciden, y los de $0{,}87$
      y $2{,}60$ también.

