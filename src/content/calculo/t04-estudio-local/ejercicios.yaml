  - id: poster-con-margenes
    titulo: El póster que menos cartón gasta
    fuente: >-
      Ejercicio 13 · Boletín «Estudio local. Problemas» · Cálculo, UPV/EHU ·
      El enunciado dice «en un póster de 216 cm²», pero los 216 cm² son el área
      de la inscripción, no la del póster: si el póster estuviera fijado, no
      habría nada que minimizar. Ver la resolución.
    nivel: practica
    enunciado: |
      Se quiere hacer un póster con una inscripción central de
      $216\ \text{cm}^{2}$, con márgenes laterales de 2 cm y márgenes
      verticales de 3 cm. Calcular las dimensiones del póster que permita
      utilizar el mínimo cartón posible.
    pide: Calcular las dimensiones del póster.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es lo que está fijado y qué es lo que se minimiza?
        opciones:
          - texto: >-
              Fijada la **inscripción** (216 cm²); se minimiza el **póster**
            correcta: true
            mensaje: |
              Eso es, y es lo que hace que el problema tenga sentido. Si el
              póster fuera el que mide 216 cm², su área ya estaría fijada y no
              habría nada que minimizar. Lo que se fija es el texto; el cartón
              se ajusta a él.
          - texto: Fijado el póster; se minimiza la inscripción
            mensaje: |
              Entonces la respuesta sería «inscripción de área cero», que no
              tiene sentido. Y el póster ya tendría área conocida: nada que
              calcular.
          - texto: Están fijados los dos
            mensaje: |
              Si los dos estuvieran fijados no habría variable ninguna y el
              problema sería una comprobación, no una optimización.
          - texto: Se minimizan los márgenes
            mensaje: |
              Los márgenes son datos: 2 cm y 3 cm. Lo que varía es la forma del
              rectángulo interior, que puede ser ancho y bajo o estrecho y alto.

      - tipo: calcular
        titulo: La anchura del póster
        pregunta: |
          ¿Cuánto mide de ancho el póster óptimo, en centímetros?
        respuesta:
          tipo: numero
          valor: '16'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '24'
            mensaje: |
              24 cm es la **altura**, no la anchura. Los dos números salen
              juntos, pero el ancho va con los márgenes de 2 cm y el alto con
              los de 3 cm.
          - valor: '12'
            mensaje: |
              12 cm es la anchura de la **inscripción**. Faltan los dos márgenes
              laterales de 2 cm: $12+4 = 16$.
          - valor: '18'
            mensaje: |
              18 cm es la altura de la **inscripción**, no una anchura.
        pista: |
          Con $x$ la anchura del póster, la inscripción mide $(x-4)$ de ancho.
          El área del póster es $A(x) = 6x+\frac{216x}{x-4}$.
        desarrollo: |
          Con $x$ la anchura del póster e $y$ su altura, la inscripción mide
          $(x-4)$ por $(y-6)$ —dos márgenes de 2 a los lados y dos de 3 arriba y
          abajo—:

          $$
          (x-4)(y-6) = 216
          \;\Longrightarrow\;
          y = 6+\frac{216}{x-4}
          $$

          El área del póster:

          $$
          A(x) = xy = x\left(6+\frac{216}{x-4}\right)
          = 6x+\frac{216x}{x-4}, \qquad x>4
          $$

          Derivando:

          $$
          A'(x) = 6+216\cdot\frac{(x-4)-x}{(x-4)^{2}}
          = 6-\frac{864}{(x-4)^{2}} = 0
          $$

          $$
          (x-4)^{2} = 144 \;\Longrightarrow\; x-4 = 12
          \;\Longrightarrow\; x = 16
          $$

          tomando la raíz positiva, porque $x>4$.
        veredicto: |
          El dominio $x>4$ no es un detalle: por debajo de 4 la inscripción
          tendría anchura negativa y el problema no significaría nada.

      - tipo: calcular
        titulo: El área total de cartón
        pregunta: |
          ¿Cuánto cartón se gasta, en centímetros cuadrados?
        respuesta:
          tipo: numero
          valor: '384'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '216'
            mensaje: |
              216 es el área de la **inscripción**, el dato del enunciado. El
              póster es mayor: hay que sumarle los márgenes.
          - valor: '168'
            mensaje: |
              168 es lo que ocupan los márgenes, $384-216$. El cartón total es
              la suma de las dos cosas.
          - valor: '400'
            mensaje: |
              400 saldría de un póster de $20\times20$. El óptimo es
              $16\times24 = 384$, algo menos.
        pista: |
          $x = 16$ y $y = 6+\frac{216}{12}$.
        desarrollo: |
          $$
          y = 6+\frac{216}{16-4} = 6+\frac{216}{12} = 6+18 = 24
          $$

          $$
          A = xy = 16\cdot24 = 384\ \text{cm}^{2}
          $$

          Comprobando la inscripción: $(16-4)(24-6) = 12\cdot18 = 216$ ✔

          **Confirmando que es mínimo:**

          $$
          A''(x) = \frac{1728}{(x-4)^{3}}, \qquad A''(16) = \frac{1728}{1728} = 1 > 0
          \;\Longrightarrow\; \text{mínimo} \ \checkmark
          $$
        veredicto: |
          Los márgenes se comen 168 cm², un 44 % del póster. Es mucho, y es lo
          que hace que merezca la pena optimizar la forma.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Nombrar:** $x$ e $y$ son las dimensiones del **póster**. La
              inscripción mide $(x-4)$ por $(y-6)$, porque hay dos márgenes de
              cada tipo.
          - texto: |
              **La restricción** es el área de la inscripción:
              $(x-4)(y-6) = 216$, de donde $y = 6+\frac{216}{x-4}$.
          - texto: |
              **El objetivo** es el área del póster:
              $A(x) = 6x+\frac{216x}{x-4}$, con $x>4$.
          - texto: |
              **Derivar:** $A'(x) = 6-\frac{864}{(x-4)^{2}} = 0$ da
              $(x-4)^{2} = 144$, es decir $x=16$.
          - texto: |
              **El resultado:** póster de $16\times24$ cm, con
              $384\ \text{cm}^{2}$ de cartón e inscripción de $12\times18$.
          - texto: |
              Los márgenes se restan una sola vez, porque solo hay un margen a
              cada lado.
            trampa: true
            mensaje: |
              Hay **dos** márgenes en cada dirección: uno a la izquierda y otro
              a la derecha, uno arriba y otro abajo. Así que se restan
              $2\cdot2 = 4$ del ancho y $2\cdot3 = 6$ del alto. Restar una sola
              vez es el error más común del ejercicio, y da un póster
              imposiblemente pequeño.
        veredicto: |
          Fíjate en la proporción: el póster es $16\times24$ —relación
          $\frac23$— y la inscripción $12\times18$, la misma relación. No es
          casualidad.

    resolucion: |
      > **Aviso sobre el enunciado.** El boletín dice «en un póster de
      > $216\ \text{cm}^{2}$ se quiere incluir una inscripción central…», pero
      > **los 216 cm² tienen que ser el área de la inscripción**, no la del
      > póster: si el póster estuviera fijado, su área ya sería 216 y no habría
      > nada que minimizar.
      >
      > La solución publicada, $24$ y $16$, lo confirma: con inscripción
      > $12\times18 = 216$ los márgenes cuadran, y con póster de 216 no cuadra
      > nada. Aquí se resuelve con esa lectura.

      **Datos.** Inscripción de $216\ \text{cm}^{2}$, márgenes laterales de 2 cm
      y verticales de 3 cm. Se pide el póster de área mínima.

      ### 1 · Nombrar, con cuidado con los márgenes

      Sean $x$ la **anchura del póster** e $y$ su **altura**.

      Los márgenes van a los dos lados, así que se restan **dos veces** en cada
      dirección:

      | | póster | márgenes | inscripción |
      |---|---|---|---|
      | ancho | $x$ | $2+2 = 4$ | $x-4$ |
      | alto | $y$ | $3+3 = 6$ | $y-6$ |

      Restar una sola vez es el error más frecuente del ejercicio.

      ### 2 · Objetivo y restricción

      **Objetivo:** minimizar el cartón, $A = xy$.

      **Restricción:** la inscripción mide 216:

      $$
      (x-4)(y-6) = 216
      $$

      ### 3 · Reducir a una variable

      $$
      y-6 = \frac{216}{x-4}
      \;\Longrightarrow\;
      y = 6+\frac{216}{x-4}
      $$

      $$
      A(x) = x\left(6+\frac{216}{x-4}\right) = 6x+\frac{216x}{x-4},
      \qquad x>4
      $$

      **El dominio $x>4$** es obligatorio: con $x \le 4$ la inscripción tendría
      anchura nula o negativa.

      ### 4 · Derivar

      Para el segundo sumando, regla del cociente:

      $$
      \left(\frac{216x}{x-4}\right)'
      = 216\cdot\frac{(x-4)\cdot1-x\cdot1}{(x-4)^{2}}
      = 216\cdot\frac{-4}{(x-4)^{2}} = \frac{-864}{(x-4)^{2}}
      $$

      $$
      A'(x) = 6-\frac{864}{(x-4)^{2}} = 0
      \;\Longrightarrow\;
      (x-4)^{2} = 144
      $$

      $$
      x-4 = \pm12 \;\Longrightarrow\; x = 16 \;\text{ o }\; x = -8
      $$

      El $x=-8$ está fuera del dominio: se descarta.

      ### 5 · Comprobar que es mínimo

      $$
      A''(x) = \frac{1728}{(x-4)^{3}}, \qquad A''(16) = \frac{1728}{12^{3}} = 1 > 0
      $$

      Mínimo ✔ Y para $x>4$ el denominador es siempre positivo, así que
      $A''>0$ en todo el dominio: el mínimo es **global**.

      ### 6 · El resultado

      $$
      y = 6+\frac{216}{12} = 6+18 = 24
      $$

      $$
      \boxed{\;\text{póster de } 16 \times 24\ \text{cm},
      \qquad A_{\min} = 384\ \text{cm}^{2}\;}
      $$

      con inscripción de $12\times18$ cm.

      ### 7 · La proporción, que no es casual

      $$
      \frac{\text{ancho}}{\text{alto}}_{\text{póster}} = \frac{16}{24} = \frac23
      $$

      $$
      \frac{\text{ancho}}{\text{alto}}_{\text{inscripción}}
      = \frac{12}{18} = \frac23
      $$

      **La misma.** Y hay una razón: en el óptimo, la relación entre las
      dimensiones sigue la de los márgenes, $\frac{2}{3}$. El póster se estira en
      la dirección donde los márgenes cuestan más.

      Tiene sentido: como los márgenes verticales son mayores, conviene que haya
      **menos** superficie desperdiciada arriba y abajo en proporción, y eso se
      consigue haciendo el póster más alto que ancho.

      ### 8 · Comprobación

      | $x$ | $y = 6+\frac{216}{x-4}$ | inscripción | $A = xy$ |
      |---|---|---|---|
      | $10$ | $42$ | $6\times36 = 216$ ✔ | $420$ |
      | $13$ | $30$ | $9\times24 = 216$ ✔ | $390$ |
      | $\mathbf{16}$ | $\mathbf{24}$ | $\mathbf{12\times18 = 216}$ ✔ | $\mathbf{384}$ |
      | $20$ | $19{,}5$ | $16\times13{,}5 = 216$ ✔ | $390$ |
      | $25$ | $16{,}3$ | $21\times10{,}3 = 216$ ✔ | $407$ |

      Todas las filas cumplen la restricción, y el área baja hasta 384 y vuelve
      a subir ✔

      **Del desperdicio:** los márgenes ocupan $384-216 = 168\ \text{cm}^{2}$,
      un 44 % del póster. Es mucho, y es justo lo que hace que optimizar la
      forma tenga sentido: en el peor caso de la tabla el desperdicio sería de
      $420-216 = 204\ \text{cm}^{2}$.

