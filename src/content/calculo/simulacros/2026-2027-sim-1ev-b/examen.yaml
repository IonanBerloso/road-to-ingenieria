# Simulacro B de la 1.ª evaluación de Cálculo (15 de octubre de 2026). El
# porqué de los cuatro, en CONVOCATORIAS (`simulacro-primera-b`).
#
# La otra cara: los mismos cuatro huecos que el A, cada uno con la variante
# que menos se entrena. Tampoco repite nada de la ruta.
asignatura: calculo
curso: '2026-2027'
convocatoria: simulacro-primera-b
propio:
  titulo: Simulacro B de la 1.ª evaluación, la otra cara
  aviso: |
    **No es un examen que haya caído, ni el que va a caer.** Son los mismos
    cuatro huecos que el simulacro A, pero cada uno por su lado menos
    entrenado: una región hecha de un argumento y de una desigualdad entre
    módulos, una ecuación en la que una de las soluciones se pierde si se
    divide sin mirar, la demostración en forma de verdadero o falso —con
    contraejemplos— y una serie cuyo criterio viene escrito en el enunciado.
    Los cuatro salen de otras convocatorias que preguntan los temas 1 y 2, y
    ninguno está en la ruta.

    Cada ejercicio dice de qué examen sale. El reloj es la regla de treinta
    minutos por ejercicio.
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Cada ejercicio es el de su
  convocatoria, transcrito tal cual, y su PDF original está en la página de
  ese examen.
ejercicios:
  - id: ex2122-3ev-1-semirrecta-cortada
    tema: t01-complejos
  - id: ex2324-ext-1-cinco-soluciones-y-una-en-el-origen
    tema: t01-complejos
  - id: ex2122-3ev-2-verdadero-o-falso
    tema: t02-sucesiones
  - id: ex2526-3ev-2-hipergeometricas
    tema: t02-sucesiones
