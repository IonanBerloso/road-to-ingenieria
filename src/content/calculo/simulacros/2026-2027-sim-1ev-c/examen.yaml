# Simulacro C de la 1.ª evaluación de Cálculo (15 de octubre de 2026). El
# porqué de los cuatro, en CONVOCATORIAS (`simulacro-primera-c`).
#
# Los de trampa: ejercicios en los que los puntos se pierden por un detalle y
# no por la cuenta. El tercero está también en la ruta, en el escalón «La
# demostración que más cae»: de sucesiones solo hay seis ejercicios de examen
# fuera de ella que sirvan, y hacen falta ocho para cuatro simulacros. Los
# dos que se repiten van en el C y en el D, que son los de reserva.
asignatura: calculo
curso: '2026-2027'
convocatoria: simulacro-primera-c
propio:
  titulo: Simulacro C de la 1.ª evaluación, los de trampa
  aviso: |
    **No es un examen que haya caído, ni el que va a caer.** Son cuatro
    ejercicios en los que casi todo el mundo hace bien la cuenta y pierde los
    puntos en un detalle: un lugar geométrico que es un solo arco y no la
    circunferencia entera, y una suma de distancias que no puede ser una
    elipse; una ecuación con el conjugado en la que el cero parece solución y
    no lo es; una desigualdad estricta que no sobrevive al límite; y la
    fórmula de la serie geométrica, demostrada y usada en una suma que no
    empieza en cero. Salen de otras convocatorias que preguntan los temas 1 y
    2.

    El tercero está también en la ruta, en el escalón «La demostración que más
    cae»: si ya lo hiciste allí, hazlo igual, pero a reloj. Cada ejercicio
    dice de qué examen sale, y el reloj es la regla de treinta minutos por
    ejercicio.
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Cada ejercicio es el de su
  convocatoria, transcrito tal cual, y su PDF original está en la página de
  ese examen.
ejercicios:
  - id: ex1819-ext-1-el-arco-capaz-y-la-elipse-imposible
    tema: t01-complejos
  - id: ex1819-3ev-1-conjugado-en-la-ecuacion
    tema: t01-complejos
  - id: ex2021-rec-3-la-desigualdad-estricta-no-sobrevive
    tema: t02-sucesiones
  - id: ex1718-3ev-2-suma-de-la-geometrica
    tema: t02-sucesiones
