# Simulacro A de la 1.ª evaluación de Cálculo (15 de octubre de 2026). No es
# una convocatoria: el porqué de los cuatro, en CONVOCATORIAS
# (`simulacro-primera-a`, content.config.ts).
#
# El examen más probable: la plantilla de cuatro huecos que la primera
# evaluación repite desde 2021-2022, cada hueco con su variante más
# frecuente. Ninguno de los cuatro está en la ruta ni en las tres últimas
# primeras evaluaciones, que son los exámenes enteros de la ruta.
asignatura: calculo
curso: '2026-2027'
convocatoria: simulacro-primera-a
propio:
  titulo: Simulacro A de la 1.ª evaluación, el examen más probable
  aviso: |
    **No es un examen que haya caído, ni el que va a caer.** Lo hemos montado
    con cuatro ejercicios de otras convocatorias que preguntan los temas 1 y
    2, puestos en la forma que la primera evaluación repite desde 2021-2022:
    una región del plano complejo con desigualdades, una ecuación polinómica,
    la demostración de una propiedad de los límites y una serie que se suma.
    Es, hueco a hueco, lo que más veces ha caído. Ninguno está en la ruta ni
    en las tres últimas primeras evaluaciones, así que los cuatro son nuevos
    para quien ya las ha hecho.

    Cada ejercicio dice de qué examen sale. El reloj es la regla de treinta
    minutos por ejercicio.
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Cada ejercicio es el de su
  convocatoria, transcrito tal cual, y su PDF original está en la página de
  ese examen.
ejercicios:
  - id: ex2526-3ev-1-medio-disco
    tema: t01-complejos
  - id: ex2425-3ev-1-dos-triangulos
    tema: t01-complejos
  - id: ex1920-2ev-2-orden-en-el-limite
    tema: t02-sucesiones
  - id: ex2425-3ev-2-pelota-que-bota
    tema: t02-sucesiones
