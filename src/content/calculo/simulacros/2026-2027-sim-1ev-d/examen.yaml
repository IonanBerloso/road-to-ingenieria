# Simulacro D de la 1.ª evaluación de Cálculo (15 de octubre de 2026). El
# porqué de los cuatro, en CONVOCATORIAS (`simulacro-primera-d`).
#
# Las sorpresas: lo que cae poco pero ha caído. El tercero está también en la
# ruta, en el escalón «El límite, si existe, es único»; el porqué, en el
# simulacro C.
asignatura: calculo
curso: '2026-2027'
convocatoria: simulacro-primera-d
propio:
  titulo: Simulacro D de la 1.ª evaluación, las sorpresas
  aviso: |
    **No es un examen que haya caído, ni el que va a caer.** Es el de
    reserva: lo que cae pocas veces pero ha caído, para que no pille de
    nuevas. Una tangente compleja y una región que sale de un cociente de
    módulos; una ecuación en la que el cubo de $z$ vale menos su módulo; la
    unicidad del límite, que se demuestra con la definición y nada más; y una
    sucesión definida a trozos cuyos parámetros salen del supremo, del ínfimo
    y de un salto. Salen de otras convocatorias que preguntan los temas 1 y 2.

    El tercero está también en la ruta, en el escalón «El límite, si existe,
    es único». Cada ejercicio dice de qué examen sale, y el reloj es la regla
    de treinta minutos por ejercicio.
sinPdf: >-
  Es un simulacro nuestro y no tiene cuadernillo. Cada ejercicio es el de su
  convocatoria, transcrito tal cual, y su PDF original está en la página de
  ese examen.
ejercicios:
