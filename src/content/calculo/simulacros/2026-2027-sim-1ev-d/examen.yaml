    tema: t01-complejos
  - id: ex1718-3ev-1-cubo-igual-a-menos-el-modulo
    tema: t01-complejos
  - id: ex1920-3-unicidad-del-limite
    tema: t02-sucesiones
  - id: ex1819-ext-2-el-supremo-el-infimo-y-el-salto
    tema: t02-sucesiones
