ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 3.
  #
  # Nuestros, no de examen ni del boletín, y su `fuente` lo dice. Mismo
  # criterio que en complejos y sucesiones: una sola idea, números que salen a
  # mano, tres o cuatro pasos.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-dominio-con-arcoseno
    titulo: Un dominio con una restricción que no se ve
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar el dominio de $f(x) = \arcsin(2x)$.
    pide: El intervalo de valores de x para los que la función existe.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué operación de esta fórmula puede fallar?
        opciones:
          - texto: El arcoseno, que solo acepta argumentos entre −1 y 1
            correcta: true
            mensaje: |
              Eso es, y es **la prohibición que casi nadie mira**. Se buscan
              divisiones entre cero, raíces pares y logaritmos, y se olvida que
              el arcoseno y el arcocoseno también restringen.
          - texto: Ninguna, es un polinomio
            mensaje: |
              El $2x$ de dentro sí es un polinomio y no da problemas. El
              problema es la función que lo envuelve: $\arcsin$ no acepta
              cualquier número.
          - texto: La multiplicación por 2
            mensaje: |
              Multiplicar siempre se puede. Lo que restringe es el arcoseno, y
              el 2 lo único que hace es cambiar dónde queda el límite.
      - tipo: calcular
        titulo: El extremo derecho
        pregunta: |
          De $-1 \le 2x \le 1$, ¿cuál es el mayor valor que puede tomar $x$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 es la cota del **argumento**, no de $x$. El argumento es $2x$,
              así que hay que dividir entre 2 para saber hasta dónde llega $x$.
          - valor: '2'
            mensaje: |
              Has multiplicado en vez de dividir. Si $2x \le 1$, entonces $x$ es
              como mucho la mitad de 1, no el doble.
        pista: |
          Resuelve $2x \le 1$. El 2 pasa dividiendo.
        desarrollo: |
          $$
          -1 \le 2x \le 1
          \;\Longleftrightarrow\;
          -\frac12 \le x \le \frac12
          $$

          El mayor valor es $\frac12$. Fíjate en que ese número **no aparece en
          ninguna parte de la fórmula**: sale de la restricción del arcoseno.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: $\arcsin$ solo está definido para argumentos en $[-1,1]$.
          - texto: Aquí el argumento es $2x$, luego se exige $-1 \le 2x \le 1$.
          - texto: Dividiendo entre 2, el dominio es $\left[-\frac12,\frac12\right]$.
          - texto: Los extremos entran, porque $\arcsin(\pm1)$ sí existe.
          - texto: Como no hay denominadores ni raíces, el dominio es todo $\mathbb{R}$.
            trampa: true
            mensaje: |
              Ese es exactamente el razonamiento que falla. Divisiones, raíces y
              logaritmos son tres prohibiciones, pero **no son las únicas**: las
              trigonométricas inversas también restringen, y sin avisar.
    resolucion: |
      **El dominio no se calcula: se descarta.** Se recorre la fórmula buscando
      lo que no siempre se puede hacer.

      Aquí no hay denominadores, ni raíces de índice par, ni logaritmos. Pero
      hay un **arcoseno**, y el arcoseno solo acepta argumentos entre $-1$ y
      $1$. Como el argumento es $2x$:

      $$
      -1 \le 2x \le 1
      \;\Longrightarrow\;
      -\frac12 \le x \le \frac12
      $$

      $$
      \operatorname{Dom} f = \left[-\tfrac12, \tfrac12\right]
      $$

      **Comprobación.** Con $x = \frac12$ queda $\arcsin(1) = \frac{\pi}{2}$,
      que existe. Con $x = 1$ quedaría $\arcsin(2)$, que no.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 240" role="img" width="330" height="240"
           aria-labelledby="f-ej-dominio-arcoseno-t f-ej-dominio-arcoseno-d">
